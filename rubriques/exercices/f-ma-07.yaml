  enonce: |
    Soit $(u_{n})$ la suite définie par $u_{0} = 1$ et $u_{n+1} = 1 + \dfrac{2}{u_{n}}$.

    **1.** Montrer que l'intervalle $[1\,,3]$ est stable par $f : x \mapsto 1 + \frac{2}{x}$, et que $f$ y est décroissante.

    **2.** Montrer que $(u_{2n})$ et $(u_{2n+1})$ sont monotones de sens contraires, et déterminer leurs limites.

    **3.** Conclure. Retrouver le résultat en majorant $|u_{n+1} - 2|$ en fonction de $|u_{n} - 2|$ pour $n \geqslant 1$.
  corrige: |
    **1.** La fonction $f$ est décroissante sur $]0\,,+\infty[$, et $f(1) = 3$, $f(3) = \frac{5}{3}$ : $\boxed{f([1\,,3]) = \Big[\frac{5}{3}\,,3\Big] \subset [1\,,3]}$.

    **2.** La fonction $g = f \circ f$ est croissante sur $[1\,,3]$, et $g(x) = 1 + \frac{2x}{x + 2} = \frac{3x + 2}{x + 2}$, d'où 
    $$g(x) - x = -\frac{(x - 2)(x + 1)}{x + 2},$$
     positif sur $[1\,,2]$ et négatif sur $[2\,,3]$. Comme $u_{0} = 1 \in [1\,,2]$, intervalle stable par $g$, la suite $(u_{2n})$ est croissante et majorée par $2$ ; comme $u_{1} = 3 \in [2\,,3]$, la suite $(u_{2n+1})$ est décroissante et minorée par $2$. Leurs limites sont des points fixes de $g$ dans $[1\,,3]$, et le seul est $2$. 
    $$\boxed{u_{2n} \nearrow 2 \qquad u_{2n+1} \searrow 2}$$
     **3.** La proposition 11 donne $\boxed{u_{n} \to 2}$. Directement : pour $n \geqslant 1$, $u_{n} \geqslant \frac{5}{3}$, et 
    $$|u_{n+1} - 2| = \Big|\frac{2 - u_{n}}{u_{n}}\Big| \leqslant \frac{3}{5}\,|u_{n} - 2|, \qquad\text{d'où}\qquad |u_{n} - 2| \leqslant \Big(\frac{3}{5}\Big)^{n-1}.$$
     Les termes $1$, $3$, $\frac{5}{3}$, $\frac{11}{5}$, $\frac{21}{11}$, $\frac{43}{21}$… sont alternativement au-dessous et au-dessus de $2$, comme le prévoyait la décroissance de $f$.
- id: "ma-07-40"
  feuille: "f-ma-07"
  numero: 40
  partie: "Suites récurrentes et suites implicites"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites récurrentes, limites de suites]
  noeuds: [ar-suites, su-monotone, su-convergence]
  notions: [suite, limite-suite]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    Étudier les suites définies par les relations suivantes.

    **(a)** $u_{0} = 1$ et $u_{n+1} = u_{n} + \mathrm{e}^{-u_{n}}$.

    **(b)** $u_{0} = -\frac{1}{2}$ et $u_{n+1} = u_{n} + u_{n}^{2}$. Que se passe-t-il pour d'autres valeurs de $u_{0}$ ?

    **(c)** $u_{0} = 1$ et $u_{n+1} = \sin u_{n}$. On montrera de plus, à l'aide de $\sin t \geqslant t - \frac{t^{3}}{6}$ pour $t \geqslant 0$, que $\frac{1}{u_{n+1}^{2}} - \frac{1}{u_{n}^{2}} \leqslant \frac{12}{25}$, puis que $u_{n} \geqslant \frac{1}{\sqrt{1 + n/2}}$ : la convergence est très lente.
  corrige: |
    **(a)** On a $u_{n+1} - u_{n} = \mathrm{e}^{-u_{n}} > 0$ : la suite est croissante. Si elle était majorée par $M$, on aurait $u_{n+1} - u_{n} \geqslant \mathrm{e}^{-M}$, d'où $u_{n} \geqslant 1 + n\,\mathrm{e}^{-M} \to +\infty$, ce qui est contradictoire. $\boxed{u_{n} \to +\infty}$

    **(b)** On a $f(x) - x = x^{2} \geqslant 0$ : la suite est croissante. L'intervalle $\big[-\frac{1}{2}\,,0\big]$ est stable, car $f(x) = \big(x + \frac{1}{2}\big)^{2} - \frac{1}{4} \in \big[-\frac{1}{4}\,,0\big]$ pour $x$ dans cet intervalle. Croissante et majorée par $0$, la suite converge vers un point fixe, donc vers $0$, seule solution de $\ell^{2} = 0$. $\boxed{u_{n} \to 0}$

    Plus généralement, si $u_{0} \in [-1\,,0]$, alors $u_{1} = u_{0}(1 + u_{0}) \in \big[-\frac{1}{4}\,,0\big]$ et $u_{n} \to 0$. Si $u_{0} > 0$, la suite croît, et une limite finie serait un point fixe supérieur à $u_{0} > 0$ : $u_{n} \to +\infty$. Si $u_{0} < -1$, alors $u_{1} > 0$ et l'on est ramené au cas précédent. 
    $$\boxed{u_{n} \to 0 \text{ si } u_{0} \in [-1\,,0], \qquad u_{n} \to +\infty \text{ sinon}}$$
     **(c)** L'intervalle $[0\,,1]$ est stable, puisque $0 \leqslant \sin x \leqslant x$ sur cet intervalle ; la suite est décroissante et minorée par $0$. Sa limite $\ell \in [0\,,1]$ vérifie $\sin\ell = \ell$, et l'inégalité $\sin x < x$ pour $x \in \,]0\,,\frac{\pi}{2}[$ (chapitre 4) impose $\ell = 0$. Par récurrence, $u_{n} > 0$.

    Pour $t \in \,]0\,,1]$, on a $\sin t \geqslant t\big(1 - \frac{t^{2}}{6}\big) > 0$, d'où 
    $$\frac{1}{\sin^{2} t} - \frac{1}{t^{2}} \leqslant \frac{1 - (1 - t^{2}/6)^{2}}{t^{2}(1 - t^{2}/6)^{2}} = \frac{\frac{1}{3} - \frac{t^{2}}{36}}{(1 - t^{2}/6)^{2}} \leqslant \frac{1/3}{(5/6)^{2}} = \frac{12}{25}.$$
     Avec $t = u_{n}$, puis en sommant, $\frac{1}{u_{n}^{2}} \leqslant 1 + \frac{12n}{25} \leqslant 1 + \frac{n}{2}$. 
    $$\boxed{u_{n} \to 0, \qquad u_{n} \geqslant \frac{1}{\sqrt{1 + n/2}}}$$
     Ainsi $u_{100} \geqslant 0{,}14$ ; en réalité $u_{100} \approx 0{,}169$. La décroissance n'est pas géométrique : elle est de l'ordre de $\frac{1}{\sqrt{n}}$, ce que le chapitre 10 précisera.
- id: "ma-07-41"
  feuille: "f-ma-07"
  numero: 41
  partie: "Suites récurrentes et suites implicites"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites récurrentes, limites de suites, suites monotones, suites extraites]
  noeuds: [ar-suites, su-monotone, su-convergence, su-extraites]
  notions: [suite, limite-suite, suite-extraite]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    Soit $(u_{n})$ la suite définie par $u_{0} = \frac{1}{2}$ et $u_{n+1} = (1 - u_{n})^{2}$, et $f : x \mapsto (1 - x)^{2}$.

    **1.** Montrer que $[0\,,1]$ est stable par $f$, et que $f$ y est décroissante. Déterminer le point fixe de $f$ dans $[0\,,1]$.

    **2.** Factoriser $f(f(x)) - x$, et étudier son signe sur $[0\,,1]$.

    **3.** En déduire le comportement de $(u_{2n})$ et de $(u_{2n+1})$. La suite $(u_{n})$ converge-t-elle ?

    **4.** Que se passe-t-il si $u_{0}$ est le point fixe de $f$ ? Si $u_{0} = 0$ ?
  corrige: |
    **1.** La fonction $f$ est décroissante sur $[0\,,1]$, avec $f(0) = 1$ et $f(1) = 0$ : $[0\,,1]$ est stable. Le point fixe vérifie $x^{2} - 3x + 1 = 0$. 
    $$\boxed{a = \frac{3 - \sqrt{5}}{2} \approx 0{,}382}$$
     **2.** Le développement donne : 
    $$\boxed{f(f(x)) - x = x(x - 1)(x^{2} - 3x + 1)}$$
     Sur $[0\,,1]$, les facteurs $x$ et $x - 1$ sont de signes contraires, et $x^{2} - 3x + 1$ change de signe en $a$ : la différence est négative sur $]0\,,a[$ et positive sur $]a\,,1[$.

    **3.** La fonction $g = f \circ f$ est croissante, et laisse stables $[0\,,a]$ et $[a\,,1]$. Comme $u_{0} = \frac{1}{2} \in \,]a\,,1]$, la suite $(u_{2n})$ croît, et sa limite est un point fixe de $g$ dans $\big[\frac{1}{2}\,,1\big]$, c'est-à-dire $1$. Comme $u_{1} = \frac{1}{4} \in [0\,,a[$, la suite $(u_{2n+1})$ décroît vers $0$. 
    $$\boxed{u_{2n} \to 1, \quad u_{2n+1} \to 0 : \ (u_{n}) \text{ diverge}}$$
     Numériquement, $u_{8} \approx 0{,}901$ et $u_{7} \approx 0{,}051$.

    **4.** Si $u_{0} = a$, la suite est constante. Si $u_{0} = 0$, elle vaut alternativement $0$ et $1$.

    Le point fixe $a$ existe, mais aucune suite ne s'en approche, sauf la suite constante : il est *répulsif*. La décroissance de $f$ ne garantit donc pas la convergence ; elle garantit seulement que les termes d'indices pairs et impairs ont un comportement monotone.
- id: "ma-07-42"
  feuille: "f-ma-07"
  numero: 42
  partie: "Suites récurrentes et suites implicites"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites récurrentes, suites monotones]
  noeuds: [ar-suites, su-monotone]
  notions: [suite]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    **1.** Montrer que, pour tout $n \geqslant 1$, l'équation $x^{n} + x^{n-1} + \cdots + x = 1$ a une unique solution $x_{n}$ dans $\mathbb{R}_{+}$, et que $\frac{1}{2} \leqslant x_{n} \leqslant 1$.

    **2.** Montrer que la suite $(x_{n})$ est décroissante.

    **3.** Montrer que $x_{n} = \frac{1}{2}\big(1 + x_{n}^{n+1}\big)$, et en déduire que $x_{n} \to \frac{1}{2}$.
  corrige: |
    **1.** La fonction $P_{n} : x \mapsto x + x^{2} + \cdots + x^{n}$ est strictement croissante sur $\mathbb{R}_{+}$, nulle en $0$, et tend vers $+\infty$ ; d'après le théorème 2 du chapitre 5, elle réalise une bijection de $\mathbb{R}_{+}$ sur $\mathbb{R}_{+}$. Comme $P_{n}(1) = n \geqslant 1$ et $P_{n}\big(\frac{1}{2}\big) = 1 - \frac{1}{2^{n}} \leqslant 1$, on obtient l'encadrement. 
    $$\boxed{\exists!\,x_{n} \in \mathbb{R}_{+},\ P_{n}(x_{n}) = 1, \qquad \frac{1}{2} \leqslant x_{n} \leqslant 1}$$
     **2.** On a $P_{n+1}(x_{n}) = P_{n}(x_{n}) + x_{n}^{n+1} > 1 = P_{n+1}(x_{n+1})$, et $P_{n+1}$ est croissante. $\boxed{x_{n+1} < x_{n}}$

    **3.** Pour $n \geqslant 2$, $x_{n} < 1$ puisque $P_{n}(1) = n > 1$, et la somme géométrique donne $\frac{x_{n} - x_{n}^{n+1}}{1 - x_{n}} = 1$, soit $x_{n} - x_{n}^{n+1} = 1 - x_{n}$ ; pour $n = 1$, $x_{1} = 1$ vérifie aussi la formule. 
    $$\boxed{x_{n} = \frac{1}{2}\big(1 + x_{n}^{n+1}\big)}$$
     Pour $n \geqslant 2$, on a $0 \leqslant x_{n}^{n+1} \leqslant x_{2}^{n+1}$, avec $x_{2} = \frac{\sqrt{5} - 1}{2} < 1$, donc $x_{n}^{n+1} \to 0$. $\boxed{x_{n} \to \frac{1}{2}}$

    Numériquement, $x_{5} \approx 0{,}5087$ et $x_{20} \approx 0{,}500\,000\,24$ : l'écart $x_{n} - \frac{1}{2}$ décroît à peu près comme $2^{-n}$.
- id: "ma-07-43"
  feuille: "f-ma-07"
  numero: 43
  partie: "Suites récurrentes et suites implicites"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites récurrentes, suites monotones]
  noeuds: [ar-suites, su-monotone]
  notions: [suite]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    Pour $n \geqslant 1$, on note $f_{n}(x) = x^{5} + nx - 1$.

    **1.** Montrer que $f_{n}$ s'annule en un unique réel $u_{n}$, et que $0 < u_{n} < \frac{1}{n}$.

    **2.** Montrer que la suite $(u_{n})$ est décroissante et tend vers $0$.

    **3.** Montrer que $nu_{n} \to 1$, puis que $n^{5}(1 - nu_{n}) \to 1$.
  corrige: |
    **1.** La fonction $f_{n}$ est dérivable, de dérivée $5x^{4} + n > 0$, et tend vers $\pm\infty$ en $\pm\infty$ : c'est une bijection de $\mathbb{R}$ sur $\mathbb{R}$ (théorème 2 du chapitre 5). Comme $f_{n}(0) = -1 < 0$ et $f_{n}\big(\frac{1}{n}\big) = \frac{1}{n^{5}} > 0$ : 
    $$\boxed{0 < u_{n} < \frac{1}{n}}$$
     **2.** On a $f_{n+1}(u_{n}) = f_{n}(u_{n}) + u_{n} = u_{n} > 0 = f_{n+1}(u_{n+1})$, et $f_{n+1}$ est croissante, d'où $u_{n+1} < u_{n}$. L'encadrement de la question 1 donne la limite. $\boxed{(u_{n}) \text{ décroît vers } 0}$

    **3.** De $u_{n}^{5} + nu_{n} = 1$, on tire $nu_{n} = 1 - u_{n}^{5} \to 1$, puis $n^{5}(1 - nu_{n}) = n^{5}u_{n}^{5} = (nu_{n})^{5}$. 
    $$\boxed{nu_{n} \to 1, \qquad n^{5}(1 - nu_{n}) \to 1}$$
     Ainsi $u_{n}$ est très proche de $\frac{1}{n}$, l'écart $\frac{1}{n} - u_{n} = \frac{1 - nu_{n}}{n}$ étant de l'ordre de $\frac{1}{n^{6}}$. Pour $n = 10$, on trouve $u_{10} \approx 0{,}099\,999\,000\,05$.
- id: "ma-07-44"
  feuille: "f-ma-07"
  numero: 44
  partie: "Suites récurrentes et suites implicites"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [suites récurrentes, bornes supérieure et inférieure, limites infinies, suites monotones]
  noeuds: [ar-suites, su-monotone, od-sup-propriete, su-infinies]
  notions: [suite, borne-superieure, limite-infinie]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    **1.** Montrer que, pour tout $n \geqslant 1$, l'équation $x + \ln x = n$ a une unique solution $u_{n}$ dans $]0\,,+\infty[$.

    **2.** Montrer que $(u_{n})$ est croissante, que $u_{n} \geqslant 1$, et que $u_{n} \to +\infty$.

    **3.** Montrer que $n - \ln n \leqslant u_{n} \leqslant n$ pour tout $n \geqslant 1$, puis que $\frac{u_{n}}{n} \to 1$.

    **4.** À l'aide de l'inégalité $\ln(1 - h) \geqslant -\frac{h}{1 - h}$ pour $h \in [0\,,1[$, montrer que $u_{n} - n + \ln n \to 0$.
  corrige: |
    **1.** La fonction $f : x \mapsto x + \ln x$ est dérivable et strictement croissante sur $]0\,,+\infty[$, de limites $-\infty$ en $0$ et $+\infty$ en $+\infty$ : c'est une bijection sur $\mathbb{R}$. $\boxed{\exists!\,u_{n} > 0,\ u_{n} + \ln u_{n} = n}$

    **2.** On a $f(u_{n+1}) = n + 1 > n = f(u_{n})$, donc $u_{n+1} > u_{n}$ ; et $f(1) = 1 \leqslant n = f(u_{n})$, donc $u_{n} \geqslant 1$. Si $(u_{n})$ était majorée par $M$, on aurait $n = f(u_{n}) \leqslant f(M)$ pour tout $n$, ce qui est absurde. 
    $$\boxed{(u_{n}) \text{ est croissante, } u_{n} \geqslant 1, \ u_{n} \to +\infty}$$
     **3.** Comme $u_{n} \geqslant 1$, $\ln u_{n} \geqslant 0$ et $u_{n} = n - \ln u_{n} \leqslant n$ ; puis $\ln u_{n} \leqslant \ln n$, d'où $u_{n} \geqslant n - \ln n$. En divisant par $n$, et comme $\frac{\ln n}{n} \to 0$ (théorème 7) : 
    $$\boxed{n - \ln n \leqslant u_{n} \leqslant n, \qquad \frac{u_{n}}{n} \to 1}$$
     **4.** Posons $h_{n} = 1 - \frac{u_{n}}{n} \in \big[0\,,\frac{\ln n}{n}\big]$, qui tend vers $0$. Alors $u_{n} - n + \ln n = \ln n - \ln u_{n} = -\ln(1 - h_{n})$, et l'inégalité indiquée, qui découle de l'exercice 21 avec $x = -h_{n}$, donne 
    $$0 \leqslant -\ln(1 - h_{n}) \leqslant \frac{h_{n}}{1 - h_{n}} \to 0.$$

    $$\boxed{u_{n} = n - \ln n + \varepsilon_{n}, \quad \varepsilon_{n} \to 0}$$
     Numériquement, $u_{100} \approx 95{,}441$ et $n - \ln n \approx 95{,}395$ : l'écart vaut environ $0{,}047$, et il est de l'ordre de $\frac{\ln n}{n}$, comme le montre l'encadrement.
- id: "ma-07-45"
  feuille: "f-ma-07"
  numero: 45
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [bornes supérieure et inférieure, majorants, limites de suites, limites infinies, suites monotones, suites extraites]
  noeuds: [od-sup-propriete, od-majorants, su-convergence, su-infinies, su-monotone, su-extraites]
  notions: [borne-superieure, majorant, limite-suite, limite-infinie, suite-extraite]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Toute partie non vide et majorée de $\mathbb{Q}$ admet une borne supérieure dans $\mathbb{Q}$.

    **2.** Si une partie non vide et majorée $A$ de $\mathbb{R}$ ne contient pas sa borne supérieure, alors $A$ est infinie.

    **3.** Toute suite bornée est convergente.

    **4.** Toute suite convergente est monotone à partir d'un certain rang.

    **5.** Si $u_{n} > 0$ pour tout $n$ et si $u_{n} \to \ell$, alors $\ell > 0$.

    **6.** Si $u_{n+1} - u_{n} \to 0$, alors $(u_{n})$ converge.

    **7.** Si $(u_{n}^{2})$ converge, alors $(u_{n})$ converge.

    **8.** Une suite croissante qui n'est pas majorée tend vers $+\infty$.

    **9.** Si $u_{n} \to \ell$ et $v_{n} \to \ell$, avec $u_{n} < v_{n}$ pour tout $n$, alors toute suite $(w_{n})$ telle que $u_{n} \leqslant w_{n} \leqslant v_{n}$ converge vers $\ell$.

    **10.** Toute suite réelle admet une suite extraite qui a une limite dans $\overline{\mathbb{R}}$.
  corrige: |
    **1.** **Fausse**. La partie $\{r \in \mathbb{Q} \mid r > 0,\ r^{2} < 2\}$ est majorée par $2$, mais n'a pas de borne supérieure rationnelle (exercice 7).

    **2.** **Vraie**. Une partie finie non vide de $\mathbb{R}$ a un plus grand élément, qui est sa borne supérieure et lui appartient : par contraposée, si $\sup A \notin A$, alors $A$ est infinie.

    **3.** **Fausse**. La suite $\big((-1)^{n}\big)$ est bornée et diverge.

    **4.** **Fausse**. La suite $\frac{(-1)^{n}}{n + 1}$ tend vers $0$ sans être monotone à partir d'aucun rang.

    **5.** **Fausse**. La suite $\frac{1}{n + 1}$ est strictement positive, de limite nulle : l'inégalité stricte devient large.

    **6.** **Fausse**. La suite $(\sqrt{n})$ vérifie $\sqrt{n + 1} - \sqrt{n} \to 0$ et tend vers $+\infty$ ; de même $(H_{n})$, exercice 47.

    **7.** **Fausse**. Avec $u_{n} = (-1)^{n}$, la suite $(u_{n}^{2})$ est constante.

    **8.** **Vraie**. C'est le théorème 8 du cours.

    **9.** **Vraie**. C'est le théorème d'encadrement ; le caractère strict de $u_{n} < v_{n}$ ne joue aucun rôle.

    **10.** **Vraie**. Si la suite est bornée, le théorème de Bolzano-Weierstrass fournit une suite extraite convergente ; si elle n'est pas majorée, l'exercice 31 fournit une suite extraite qui tend vers $+\infty$, et de même vers $-\infty$ si elle n'est pas minorée.
- id: "ma-07-46"
  feuille: "f-ma-07"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [bornes supérieure et inférieure, limites de suites, limites infinies, "théorème d'encadrement", suites monotones, moyennes de Césaro]
  noeuds: [od-sup-propriete, su-convergence, su-infinies, su-encadrement, su-monotone]
  notions: [borne-superieure, limite-suite, limite-infinie]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    *Le théorème de Cesàro.* Soit $(u_{n})_{n \geqslant 1}$ une suite réelle, et $c_{n} = \dfrac{u_{1} + u_{2} + \cdots + u_{n}}{n}$ la moyenne de ses $n$ premiers termes.

    **1.** On suppose que $u_{n} \to 0$. Soit $\varepsilon > 0$, et $N$ tel que $|u_{n}| \leqslant \varepsilon$ pour $n > N$. Montrer que, pour $n > N$, 
    $$|c_{n}| \leqslant \frac{|u_{1} + \cdots + u_{N}|}{n} + \varepsilon,$$
     et en déduire que $c_{n} \to 0$. Montrer ensuite que, si $u_{n} \to \ell \in \mathbb{R}$, alors $c_{n} \to \ell$.

    **2.** Montrer que, si $u_{n} \to +\infty$, alors $c_{n} \to +\infty$.

    **3.** Montrer par un exemple que la réciproque de la question 1 est fausse. Montrer qu'elle est vraie si $(u_{n})$ est monotone.

    **4.** Application : si $u_{n+1} - u_{n} \to a \in \mathbb{R}$, montrer que $\frac{u_{n}}{n} \to a$. En déduire la limite de $\frac{\ln(n!)}{n\ln n}$, en appliquant ce résultat à $u_{n} = \ln(n!) - n\ln n$ et en utilisant l'encadrement de $\ln(1 + x)$ de l'exercice 21.
  corrige: |
    **1.** Pour $n > N$, on coupe la somme en deux et l'on applique l'inégalité triangulaire : 
    $$|c_{n}| \leqslant \frac{|u_{1} + \cdots + u_{N}|}{n} + \frac{1}{n}\sum_{k=N+1}^{n} |u_{k}| \leqslant \frac{|u_{1} + \cdots + u_{N}|}{n} + \frac{n - N}{n}\,\varepsilon.$$
     Le premier terme, où $N$ est fixé, tend vers $0$ : il est inférieur à $\varepsilon$ à partir d'un rang $N'$, et $|c_{n}| \leqslant 2\varepsilon$ pour $n \geqslant \max(N, N') + 1$. Si $u_{n} \to \ell$, on applique ce résultat à $(u_{n} - \ell)$, dont la moyenne est $c_{n} - \ell$. 
    $$\boxed{u_{n} \to \ell \implies c_{n} \to \ell}$$
     **2.** Soit $A > 0$, et $N$ tel que $u_{n} \geqslant 3A$ pour $n > N$. Pour $n \geqslant 2N$, on a $\frac{n - N}{n} \geqslant \frac{1}{2}$, d'où 
    $$c_{n} \geqslant \frac{u_{1} + \cdots + u_{N}}{n} + \frac{3A}{2},$$
     et le premier terme est supérieur à $-\frac{A}{2}$ à partir d'un certain rang : $c_{n} \geqslant A$. $\boxed{u_{n} \to +\infty \implies c_{n} \to +\infty}$

    **3.** Pour $u_{n} = (-1)^{n}$, on a $|c_{n}| \leqslant \frac{1}{n}$, donc $c_{n} \to 0$, alors que $(u_{n})$ diverge. Si $(u_{n})$ est croissante et $c_{n} \to \ell$, elle est majorée, sinon elle tendrait vers $+\infty$ et $(c_{n})$ aussi d'après la question 2 ; elle converge donc vers un réel $\ell'$, et la question 1 donne $\ell' = \ell$. Le cas décroissant est symétrique. 
    $$\boxed{\text{réciproque fausse en général, vraie pour une suite monotone}}$$
     **4.** La suite $v_{k} = u_{k+1} - u_{k}$ tend vers $a$ ; la moyenne de ses $n$ premiers termes, $\frac{u_{n} - u_{0}}{n}$, tend donc vers $a$, et $\frac{u_{0}}{n} \to 0$. $\boxed{\frac{u_{n}}{n} \to a}$

    Avec $u_{n} = \ln(n!) - n\ln n$, on a $u_{n+1} - u_{n} = -n\ln\big(1 + \frac{1}{n}\big)$, et l'encadrement de l'exercice 21 donne $\frac{n}{n + 1} \leqslant n\ln\big(1 + \frac{1}{n}\big) \leqslant 1$, d'où $u_{n+1} - u_{n} \to -1$, puis $\frac{u_{n}}{n} \to -1$. Ainsi 
    $$\frac{\ln(n!)}{n\ln n} = 1 + \frac{u_{n}}{n} \cdot \frac{1}{\ln n} \to \boxed{1}.$$
     La convergence est lente : pour $n = 1000$, le quotient vaut environ $0{,}856$. Le chapitre 10 donnera la formule de Stirling, beaucoup plus précise.
- id: "ma-07-47"
  feuille: "f-ma-07"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [bornes supérieure et inférieure, majorants, "partie entière et propriété d'Archimède", densité, limites de suites, Bolzano-Weierstrass, suites de Cauchy]
  noeuds: [od-sup-propriete, od-majorants, ar-archimede, tr-dense, su-convergence, ar-bw, ar-cauchy]
  notions: [borne-superieure, majorant, archimedien, partie-dense, limite-suite, suite-cauchy]
  page_enonce: 13
  page_corrige: 23
  enonce: |
    *Suites de Cauchy et complétude de $\mathbb{R}$.* Une suite réelle $(u_{n})$ est dite *de Cauchy* si 
    $$\forall \varepsilon > 0,\ \exists N \in \mathbb{N},\ \forall p, q \geqslant N,\quad |u_{p} - u_{q}| \leqslant \varepsilon.$$

    **1.** Montrer qu'une suite convergente est de Cauchy.

    **2.** Soit $(u_{n})$ une suite de Cauchy. Montrer qu'elle est bornée, puis, à l'aide du théorème de Bolzano-Weierstrass, qu'elle converge.

    **3.** La suite $(H_{n})$ de l'exercice 21 vérifie-t-elle $|H_{n+1} - H_{n}| \to 0$ ? Est-elle de Cauchy ? Que montre cet exemple ?

    **4.** On se place dans $\mathbb{Q}$ : montrer que la suite des valeurs décimales approchées par défaut de $\sqrt{2}$ est une suite de rationnels qui vérifie la condition de Cauchy, mais qui n'a pas de limite dans $\mathbb{Q}$. Comparer avec l'introduction historique du cours.

    **5.** Réciproquement, on admet ici seulement que toute suite de Cauchy de réels converge, et l'on veut retrouver l'axiome de la borne supérieure. Soit $A$ une partie non vide et majorée de $\mathbb{R}$, $a_{0} \in A$ et $b_{0}$ un majorant. On construit par dichotomie $a_{n} \in A$ et un majorant $b_{n}$ de $A$ tels que $b_{n} - a_{n} \leqslant \frac{b_{0} - a_{0}}{2^{n}}$. À l'aide de la propriété d'Archimède, montrer que $(b_{n})$ est de Cauchy, puis que sa limite est la borne supérieure de $A$.
  corrige: |
    **1.** Si $u_{n} \to \ell$, pour $\varepsilon > 0$ il existe $N$ tel que $|u_{n} - \ell| \leqslant \frac{\varepsilon}{2}$ pour $n \geqslant N$, et alors, pour $p$, $q \geqslant N$, 
    $$|u_{p} - u_{q}| \leqslant |u_{p} - \ell| + |\ell - u_{q}| \leqslant \varepsilon.$$
     $\boxed{\text{toute suite convergente est de Cauchy}}$

    **2.** Avec $\varepsilon = 1$, il existe $N$ tel que $|u_{p}| \leqslant |u_{N}| + 1$ pour $p \geqslant N$ : la suite est bornée, par le maximum de ce réel et des $|u_{p}|$ pour $p < N$. Le théorème de Bolzano-Weierstrass fournit une suite extraite $(u_{\varphi(n)})$ de limite $\ell$. Soit $\varepsilon > 0$, $N$ le rang de la condition de Cauchy et $n_{0}$ tel que $|u_{\varphi(n)} - \ell| \leqslant \varepsilon$ pour $n \geqslant n_{0}$. Pour $p \geqslant N$, prenons $n \geqslant \max(n_{0}, N)$ : alors $\varphi(n) \geqslant n \geqslant N$, et 
    $$|u_{p} - \ell| \leqslant |u_{p} - u_{\varphi(n)}| + |u_{\varphi(n)} - \ell| \leqslant 2\varepsilon.$$

    $$\boxed{\text{toute suite de Cauchy réelle converge}}$$
     **3.** On a $H_{n+1} - H_{n} = \frac{1}{n + 1} \to 0$, mais $H_{2n} - H_{n} \geqslant \frac{1}{2}$ pour tout $n$ (exercice 21) : la condition de Cauchy échoue avec $\varepsilon = \frac{1}{4}$, $p = 2n$ et $q = n$. 
    $$\boxed{(H_{n}) \text{ n'est pas de Cauchy}}$$
     La condition de Cauchy porte sur *tous* les couples d'indices assez grands, et pas seulement sur les indices consécutifs.

    **4.** Pour $p \geqslant q$, les décimaux $d_{p}$ et $d_{q}$ sont dans $[d_{q}\,,d_{q} + 10^{-q}[$, donc $|d_{p} - d_{q}| < 10^{-q}$ : la suite est de Cauchy. Si elle convergeait vers un rationnel $r$, $r$ serait aussi sa limite dans $\mathbb{R}$, c'est-à-dire $\sqrt{2}$, qui n'est pas rationnel. 
    $$\boxed{\mathbb{Q} \text{ n'est pas complet}}$$
     C'est exactement la situation qui gênait Dedekind : la suite croissante et majorée des $d_{n}$ « devrait » converger, mais sa limite manque dans $\mathbb{Q}$.

    **5.** On procède par dichotomie : on pose $c = \frac{a_{n} + b_{n}}{2}$ ; si $c$ majore $A$, on prend $a_{n+1} = a_{n}$ et $b_{n+1} = c$ ; sinon, il existe $a \in A$ tel que $a > c$, et l'on prend $a_{n+1} = a$ et $b_{n+1} = b_{n}$. Dans les deux cas $b_{n+1} - a_{n+1} \leqslant \frac{1}{2}(b_{n} - a_{n})$. La suite $(b_{n})$ est décroissante, et tout $a_{n}$, élément de $A$, minore tout $b_{p}$ ; donc, pour $p \geqslant q$, 
    $$0 \leqslant b_{q} - b_{p} \leqslant b_{q} - a_{q} \leqslant \frac{b_{0} - a_{0}}{2^{q}} \leqslant \frac{b_{0} - a_{0}}{q},$$
     qui est inférieur à $\varepsilon$ pour $q$ assez grand, par la propriété d'Archimède. La suite $(b_{n})$ est de Cauchy ; soit $\beta$ sa limite. Tout $a \in A$ vérifie $a \leqslant b_{n}$, donc $a \leqslant \beta$ par passage à la limite ; et $a_{n} \geqslant b_{n} - \frac{b_{0} - a_{0}}{2^{n}}$ tend vers $\beta$. D'après la proposition 13 du cours : 
    $$\boxed{\beta = \sup A}$$
     Dans un corps ordonné archimédien, la propriété de la borne supérieure et la convergence des suites de Cauchy sont donc équivalentes : ce sont deux formulations de la complétude de $\mathbb{R}$, qui correspondent aux deux constructions de Dedekind et de Cantor.
- id: "ma-07-48"
  feuille: "f-ma-07"
  numero: 48
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [bornes supérieure et inférieure, limites de suites]
  noeuds: [od-sup-propriete, su-convergence]
  notions: [borne-superieure, limite-suite]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    *Le lemme de Fekete.* Soit $(u_{n})_{n \geqslant 1}$ une suite de réels positifs, *sous-additive*, c'est-à-dire telle que $u_{n+m} \leqslant u_{n} + u_{m}$ pour tous $n$, $m \geqslant 1$. On pose $\lambda = \inf\big\{\frac{u_{k}}{k} \mid k \geqslant 1\big\}$.

    **1.** Justifier l'existence de $\lambda$. Montrer que $u_{qk} \leqslant q\,u_{k}$ pour tous $q$, $k \geqslant 1$.

    **2.** Soit $k \geqslant 1$ fixé. Pour $n \geqslant k$, on écrit la division euclidienne $n = qk + r$, avec $0 \leqslant r < k$. Montrer que 
    $$\frac{u_{n}}{n} \leqslant \frac{u_{k}}{k} + \frac{M_{k}}{n}, \qquad\text{où}\qquad M_{k} = \max(u_{1}, \dots, u_{k}),$$
     en convenant que $u_{0} = 0$ dans le cas $r = 0$.

    **3.** En déduire que $\frac{u_{n}}{n} \to \lambda$.

    **4.** Application : on note $u_{n}$ le nombre de mots de longueur $n$, écrits avec les lettres $a$ et $b$, qui ne contiennent pas deux $a$ consécutifs. Montrer que $\ln u_{n+m} \leqslant \ln u_{n} + \ln u_{m}$, et identifier la limite de $\frac{\ln u_{n}}{n}$ à l'aide d'une récurrence linéaire.
  corrige: |
    **1.** La partie $\big\{\frac{u_{k}}{k}\big\}$ est non vide et minorée par $0$ : elle a une borne inférieure $\lambda \geqslant 0$ (théorème 1). Par récurrence sur $q$, $u_{(q+1)k} \leqslant u_{qk} + u_{k} \leqslant (q + 1)\,u_{k}$. $\boxed{u_{qk} \leqslant q\,u_{k}}$

    **2.** Si $r \geqslant 1$, $u_{n} \leqslant u_{qk} + u_{r} \leqslant q\,u_{k} + M_{k}$ ; si $r = 0$, $u_{n} \leqslant q\,u_{k}$. Comme $qk \leqslant n$ et $u_{k} \geqslant 0$, $\frac{q\,u_{k}}{n} = \frac{qk}{n}\cdot\frac{u_{k}}{k} \leqslant \frac{u_{k}}{k}$. 
    $$\boxed{\frac{u_{n}}{n} \leqslant \frac{u_{k}}{k} + \frac{M_{k}}{n}}$$
     **3.** Soit $\varepsilon > 0$. Par la proposition 2, il existe $k$ tel que $\frac{u_{k}}{k} \leqslant \lambda + \varepsilon$. Pour $n \geqslant \max\big(k, \frac{M_{k}}{\varepsilon}\big)$, on obtient $\lambda \leqslant \frac{u_{n}}{n} \leqslant \lambda + 2\varepsilon$. $\boxed{\frac{u_{n}}{n} \to \lambda}$

    **4.** Un mot de longueur $n + m$ sans deux $a$ consécutifs se découpe en un préfixe de longueur $n$ et un suffixe de longueur $m$, qui n'en contiennent pas non plus ; ce découpage est injectif, donc $u_{n+m} \leqslant u_{n}u_{m}$, et $(\ln u_{n})$ est sous-additive et positive. Un mot valide de longueur $n + 2$ se termine par $b$, précédé d'un mot valide de longueur $n + 1$, ou par $ba$, précédé d'un mot valide de longueur $n$ : $u_{n+2} = u_{n+1} + u_{n}$, avec $u_{1} = 2$ et $u_{2} = 3$. Ainsi $u_{n} = F_{n+2}$, et la formule de Binet du cours donne 
    $$\ln u_{n} = (n + 2)\ln\varphi - \ln\sqrt{5} + \ln\Big(1 - \Big(\frac{\psi}{\varphi}\Big)^{n+2}\Big),$$
     dont le dernier terme tend vers $0$, par l'encadrement de l'exercice 21. 
    $$\boxed{\frac{\ln u_{n}}{n} \to \ln\varphi \approx 0{,}481}$$
     Le lemme de Fekete donne l'existence de la limite sans calcul ; c'est ainsi que l'on définit l'*entropie* d'un système de mots, même lorsqu'aucune formule explicite n'est disponible.
- id: "ma-07-49"
  feuille: "f-ma-07"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [limites de suites, suites extraites, Bolzano-Weierstrass]
  noeuds: [su-convergence, su-extraites, ar-bw]
  notions: [limite-suite, suite-extraite]
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Valeurs d'adhérence.* On dit qu'un réel $a$ est une *valeur d'adhérence* de la suite $(u_{n})$ si $a$ est la limite d'une suite extraite de $(u_{n})$.

    **1.** Montrer que $a$ est une valeur d'adhérence si et seulement si, pour tout $\varepsilon > 0$, l'ensemble $\{n \in \mathbb{N} \mid |u_{n} - a| \leqslant \varepsilon\}$ est infini.

    **2.** Déterminer les valeurs d'adhérence des suites $\big((-1)^{n}\big)$, $\big(\cos\frac{2n\pi}{5}\big)$ et $(u_{n})$ de l'exercice 41.

    **3.** Montrer qu'une suite bornée converge si et seulement si elle a une unique valeur d'adhérence. Le résultat subsiste-t-il sans l'hypothèse « bornée » ?

    **4.** On suppose $(u_{n})$ bornée et $u_{n+1} - u_{n} \to 0$. Soit $a < b$ deux valeurs d'adhérence et $c \in \,]a\,,b[$. Montrer qu'il existe une infinité d'indices $n$ tels que $u_{n} \leqslant c < u_{n+1}$, et en déduire que $c$ est une valeur d'adhérence : l'ensemble des valeurs d'adhérence est un intervalle.
  corrige: |
    **1.** Si $u_{\varphi(n)} \to a$, alors pour $\varepsilon > 0$, tous les indices $\varphi(n)$ avec $n$ assez grand vérifient $|u_{\varphi(n)} - a| \leqslant \varepsilon$, et ils sont en nombre infini. Réciproquement, on construit $\varphi$ par récurrence en choisissant $\varphi(n + 1) > \varphi(n)$ tel que $|u_{\varphi(n+1)} - a| \leqslant \frac{1}{n + 2}$, ce qui est possible puisque l'ensemble correspondant est infini. 
    $$\boxed{a \text{ valeur d'adhérence} \iff \forall \varepsilon > 0,\ \{n \mid |u_{n} - a| \leqslant \varepsilon\} \text{ infini}}$$
     **2.** La suite $\big((-1)^{n}\big)$ ne prend que les valeurs $\pm 1$, chacune une infinité de fois ; une valeur $a \notin \{-1, 1\}$ est à distance au moins $\varepsilon > 0$ de ces deux valeurs. La suite $\big(\cos\frac{2n\pi}{5}\big)$ est $5$-périodique et prend les valeurs $1$, $\cos\frac{2\pi}{5}$ et $\cos\frac{4\pi}{5}$. Pour l'exercice 41, on a trouvé deux suites extraites recouvrant tous les indices, de limites $1$ et $0$. 
    $$\boxed{\{-1, 1\} \qquad \Big\{1, \frac{\sqrt{5} - 1}{4}, -\frac{\sqrt{5} + 1}{4}\Big\} \qquad \{0, 1\}}$$
     **3.** Une suite convergente a pour seule valeur d'adhérence sa limite (proposition 11). Réciproquement, soit $(u_{n})$ bornée, d'unique valeur d'adhérence $a$. Si elle ne tendait pas vers $a$, il existerait $\varepsilon > 0$ et une infinité d'indices tels que $|u_{n} - a| > \varepsilon$ ; ils formeraient une suite extraite bornée, dont le théorème de Bolzano-Weierstrass extrairait une suite convergente, de limite $b$ vérifiant $|b - a| \geqslant \varepsilon$ : une seconde valeur d'adhérence. Sans l'hypothèse « bornée », la suite définie par $u_{2n} = n$ et $u_{2n+1} = 0$ a pour unique valeur d'adhérence $0$, mais diverge. 
    $$\boxed{\text{bornée et une seule valeur d'adhérence} \iff \text{convergente}}$$
     **4.** D'après la question 1, il y a une infinité d'indices tels que $u_{n} \leqslant c$, au voisinage de $a$, et une infinité tels que $u_{n} > c$, au voisinage de $b$. Pour tout indice $n_{1}$ tel que $u_{n_{1}} \leqslant c$, il existe un indice ultérieur où $u > c$ ; le premier d'entre eux, $m$, vérifie $u_{m-1} \leqslant c < u_{m}$. On obtient ainsi une infinité d'indices $n$ tels que $u_{n} \leqslant c < u_{n+1}$, et pour eux 
    $$0 \leqslant c - u_{n} < u_{n+1} - u_{n} \to 0.$$
     La suite extraite correspondante tend vers $c$ : c'est une valeur d'adhérence. L'ensemble des valeurs d'adhérence vérifie donc la caractérisation des intervalles de la proposition 6. 
    $$\boxed{\text{l'ensemble des valeurs d'adhérence est un intervalle}}$$
     L'hypothèse $u_{n+1} - u_{n} \to 0$ empêche la suite de « sauter » par-dessus $c$ sans s'en approcher.
- id: "ma-07-50"
  feuille: "f-ma-07"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: ["partie entière et propriété d'Archimède", densité, valeur absolue, Bolzano-Weierstrass]
  noeuds: [ar-archimede, tr-dense, ar-corps, ar-bw]
  notions: [archimedien, partie-dense]
  page_enonce: 14
  page_corrige: 25
  enonce: |
    *Densité de $\mathbb{Z} + \alpha\mathbb{Z}$ et valeurs de $\sin n$.* Soit $\alpha$ un irrationnel, et $G = \{p + q\alpha \mid (p, q) \in \mathbb{Z}^{2}\}$.

    **1.** Soit $N \geqslant 1$. En appliquant le principe des tiroirs du chapitre 2 aux $N + 1$ réels $k\alpha - \lfloor k\alpha \rfloor$, pour $0 \leqslant k \leqslant N$, et aux $N$ intervalles $\big[\frac{j}{N}\,,\frac{j + 1}{N}\big[$, montrer que $G$ contient un élément $g$ tel que $0 < |g| < \frac{1}{N}$.

    **2.** En déduire, comme à l'exercice 6, que $G$ est dense dans $\mathbb{R}$.

    **3.** On admet que $\pi$ est irrationnel (Lambert, 1761). Montrer que l'ensemble $\{n + 2k\pi \mid n \in \mathbb{Z},\ k \in \mathbb{Z}\}$ est dense dans $\mathbb{R}$.

    **4.** Soit $N \geqslant 1$. En appliquant le principe des tiroirs aux $N + 1$ réels $n - 2\pi\big\lfloor \frac{n}{2\pi} \big\rfloor \in [0\,,2\pi[$, pour $0 \leqslant n \leqslant N$, montrer qu'il existe des entiers $d \in [\![1\,;N]\!]$ et $m \in \mathbb{Z}$ tels que $0 < |d - 2\pi m| < \frac{2\pi}{N}$. En déduire que, pour tout réel $s$ et tout entier $n_{0} \geqslant 0$, il existe des entiers $n \geqslant n_{0}$ et $k \in \mathbb{Z}$ tels que $|n - s - 2k\pi| \leqslant \frac{2\pi}{N}$.

    **5.** En utilisant l'inégalité $|\sin x - \sin y| \leqslant |x - y|$, que l'on établira à l'aide d'une formule de trigonométrie du chapitre 4, montrer que tout réel de $[-1\,,1]$ est valeur d'adhérence, au sens de l'exercice 49, de la suite $(\sin n)_{n \in \mathbb{N}}$.
  corrige: |
    **1.** Les $N + 1$ réels $k\alpha - \lfloor k\alpha \rfloor$ sont dans $[0\,,1[$, réunion des $N$ intervalles $\big[\frac{j}{N}\,,\frac{j + 1}{N}\big[$ ; deux d'entre eux, d'indices $k \neq k'$, sont dans le même intervalle. Le réel $g = (k - k')\alpha - (\lfloor k\alpha \rfloor - \lfloor k'\alpha \rfloor)$ appartient à $G$, et $|g| < \frac{1}{N}$ ; il n'est pas nul, sinon $\alpha$ serait rationnel. 
    $$\boxed{\exists g \in G,\ 0 < |g| < \frac{1}{N}}$$
     **2.** Soit $a < b$ et $N$ tel que $\frac{1}{N} < b - a$. Avec le $g$ précédent et $k = \big\lfloor \frac{a}{|g|} \big\rfloor + 1$, on a $a < k|g| \leqslant a + |g| < b$, et $k|g| \in G$, puisque $G$ est stable par addition et passage à l'opposé. $\boxed{G \text{ est dense dans } \mathbb{R}}$

    **3.** Si $2\pi$ était rationnel, $\pi$ le serait. Avec $\alpha = 2\pi$, l'ensemble $G$ est exactement $\{n + 2k\pi \mid n, k \in \mathbb{Z}\}$. $\boxed{\{n + 2k\pi\} \text{ est dense dans } \mathbb{R}}$

    **4.** Les $N + 1$ réels $n - 2\pi\lfloor \frac{n}{2\pi} \rfloor \in [0\,,2\pi[$, pour $0 \leqslant n \leqslant N$, sont dans $N$ intervalles de longueur $\frac{2\pi}{N}$ ; deux d'entre eux, d'indices $n > n'$, sont dans le même. Avec $d = n - n' \in [\![1\,;N]\!]$ et $m = \lfloor \frac{n}{2\pi} \rfloor - \lfloor \frac{n'}{2\pi} \rfloor$, le réel $\delta = d - 2\pi m$ vérifie $0 < |\delta| < \frac{2\pi}{N}$, puisque $\pi$ est irrationnel. Soit maintenant $s$ réel et $n_{0} \geqslant 0$ ; notons $s'$ le réel de $[0\,,2\pi[$ si $\delta > 0$, ou de $]-2\pi\,,0]$ si $\delta < 0$, qui diffère de $s - n_{0}$ d'un multiple de $2\pi$. Les réels $j\delta$, pour $j \in \mathbb{N}$, avancent par pas de $|\delta|$ dans la direction de $s'$ : l'un d'eux vérifie $|j\delta - s'| \leqslant |\delta|$. L'entier $n = n_{0} + jd \geqslant n_{0}$ vérifie alors 
    $$n - s - 2\pi(jm + K) = j\delta - s' \quad\text{pour un entier } K, \qquad\text{d'où}\qquad \boxed{|n - s - 2k\pi| \leqslant \frac{2\pi}{N}}.$$
     **5.** La formule $\sin x - \sin y = 2\cos\frac{x + y}{2}\sin\frac{x - y}{2}$ et $|\sin t| \leqslant |t|$ donnent $|\sin x - \sin y| \leqslant |x - y|$. Soit $y \in [-1\,,1]$, $s = \operatorname{Arcsin} y$ et $\varepsilon > 0$. Avec $N > \frac{2\pi}{\varepsilon}$ et un entier $n_{0}$ quelconque, la question 4 fournit $n \geqslant n_{0}$ tel que 
    $$|\sin n - y| = |\sin(n - 2k\pi) - \sin s| \leqslant |n - 2k\pi - s| \leqslant \varepsilon.$$
     Il y a donc une infinité d'entiers $n$ tels que $|\sin n - y| \leqslant \varepsilon$, et l'exercice 49 conclut. 
    $$\boxed{\text{tout réel de } [-1\,,1] \text{ est valeur d'adhérence de } (\sin n)}$$
     La suite $(\sin n)$, que l'on aurait pu croire régulière, passe donc arbitrairement près de chaque valeur de $[-1\,,1]$ une infinité de fois ; c'est l'irrationalité de $\pi$ qui l'empêche de se répéter.

