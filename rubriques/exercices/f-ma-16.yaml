  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $f$ l'endomorphisme de $\mathbb{R}^{3}$ défini par $f(x, y, z) = (x - z, y, y)$.

    **1.** Déterminer la matrice $A$ de $f$ dans la base canonique.

    **2.** Calculer $A^{2}$, $A^{3}$ et $A^{4}$, conjecturer une expression de $A^{n}$ pour $n \geqslant 1$, puis la démontrer.

    **3.** En déduire l'expression de $f^{n}(x, y, z)$.
  corrige: |
    **1.** Les images des vecteurs de la base canonique sont $f(e_{1}) = (1, 0, 0)$, $f(e_{2}) = (0, 1, 1)$ et $f(e_{3}) = (-1, 0, 0)$ ; ce sont les colonnes de $A$. 
    $$\boxed{A = \begin{pmatrix} 1 & 0 & -1 \\ 0 & 1 & 0 \\ 0 & 1 & 0 \end{pmatrix}}$$

    **2.** Le calcul donne 
    $$A^{2} = \begin{pmatrix} 1 & -1 & -1 \\ 0 & 1 & 0 \\ 0 & 1 & 0 \end{pmatrix}, \qquad A^{3} = \begin{pmatrix} 1 & -2 & -1 \\ 0 & 1 & 0 \\ 0 & 1 & 0 \end{pmatrix}, \qquad A^{4} = \begin{pmatrix} 1 & -3 & -1 \\ 0 & 1 & 0 \\ 0 & 1 & 0 \end{pmatrix}.$$
     On conjecture la formule ci-dessous. Elle est vraie pour $n = 1$, et si elle l'est au rang $n$, le produit $A^{n}A$ a pour deuxième colonne $(-(n - 1) - 1, 1, 1) = (-n, 1, 1)$, les autres colonnes restant inchangées. 
    $$\boxed{A^{n} = \begin{pmatrix} 1 & -(n - 1) & -1 \\ 0 & 1 & 0 \\ 0 & 1 & 0 \end{pmatrix} \qquad (n \geqslant 1)}$$

    **3.** La matrice de $f^{n}$ est $A^{n}$ (théorème 2), d'où 
    $$\boxed{f^{n}(x, y, z) = \big(x - (n - 1)y - z, \ y, \ y\big) \qquad (n \geqslant 1)}$$
- id: "ma-16-19"
  feuille: "f-ma-16"
  numero: 19
  partie: "Matrices et applications linéaires"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["matrice d'une application linéaire", espaces de polynômes]
  noeuds: [v-matrices, pol-anneau]
  notions: [matrice]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Montrer que les applications suivantes sont linéaires, et déterminer leurs matrices dans les bases canoniques.

    **1.** $u : \mathbb{K}_{3}[X] \to \mathbb{K}^{2}$, $P \mapsto \big(P(-1), P'(0) + P''(1)\big)$.

    **2.** $v : \mathbb{K}_{n}[X] \to \mathbb{K}_{n}[X]$, $P \mapsto XP'$.

    **3.** $w : \mathbb{K}_{3}[X] \to \mathbb{K}_{3}[X]$, $P \mapsto 2P + (X - 1)P'$.

    Lesquelles sont injectives ? surjectives ?
  corrige: |
    La linéarité de chacune des trois applications découle de celle de l'évaluation et de la dérivation.

    **(i)** Les images de $1$, $X$, $X^{2}$, $X^{3}$ sont $(1, 0)$, $(-1, 1)$, $(1, 2)$ et $(-1, 6)$. Les deux lignes de la matrice ne sont pas proportionnelles, donc $\mathrm{rg} u = 2 = \dim \mathbb{K}^{2}$ : l'application $u$ est surjective, mais non injective, puisque $\dim \mathbb{K}_{3}[X] = 4 > 2$. 
    $$\boxed{\mathrm{Mat}(u) = \begin{pmatrix} 1 & -1 & 1 & -1 \\ 0 & 1 & 2 & 6 \end{pmatrix}, \quad u \text{ surjective, non injective}}$$

    **(ii)** On a $v(X^{k}) = kX^{k}$. Les constantes sont dans le noyau, et $1$ n'est pas dans l'image : $v$ n'est ni injective ni surjective. 
    $$\boxed{\mathrm{Mat}(v) = \mathrm{diag}(0, 1, 2, \dots, n)}$$

    **(iii)** On a $w(X^{k}) = 2X^{k} + kX^{k - 1}(X - 1) = (k + 2)X^{k} - kX^{k - 1}$. La matrice est triangulaire supérieure de coefficients diagonaux $2, 3, 4, 5$, tous non nuls : elle est inversible (proposition 12), et $w$ est un automorphisme. 
    $$\boxed{\mathrm{Mat}(w) = \begin{pmatrix} 2 & -1 & 0 & 0 \\ 0 & 3 & -2 & 0 \\ 0 & 0 & 4 & -3 \\ 0 & 0 & 0 & 5 \end{pmatrix}, \quad w \text{ bijective}}$$
- id: "ma-16-20"
  feuille: "f-ma-16"
  numero: 20
  partie: "Matrices et applications linéaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["matrice d'une application linéaire", matrices inversibles]
  noeuds: [v-matrices]
  notions: [matrice, matrice-inversible, groupe-lineaire]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Montrer que $A = \begin{pmatrix} 1 & 1 & 0 \\ 0 & 1 & 2 \\ 0 & 0 & 1 \end{pmatrix}$ est inversible et calculer $A^{-1}$.

    **2.** Soit $\Delta$ l'endomorphisme de $\mathbb{R}_{2}[X]$ défini par $\Delta(P) = P + P'$. Déterminer sa matrice dans la base canonique.

    **3.** En déduire que $\Delta$ est un automorphisme, et résoudre l'équation $\Delta(P) = 1 + X + 2X^{2}$.
  corrige: |
    **1.** La matrice $A$ est triangulaire à diagonale non nulle, donc inversible (proposition 12). On résout $AX = Y$ en remontant : $z = c$, $y = b - 2c$, $x = a - b + 2c$. 
    $$\boxed{A^{-1} = \begin{pmatrix} 1 & -1 & 2 \\ 0 & 1 & -2 \\ 0 & 0 & 1 \end{pmatrix}}$$

    **2.** On a $\Delta(1) = 1$, $\Delta(X) = 1 + X$ et $\Delta(X^{2}) = 2X + X^{2}$ : la matrice de $\Delta$ dans la base canonique est exactement $A$.

    **3.** La matrice de $\Delta$ est inversible, donc $\Delta$ est un automorphisme (théorème 3). Les coordonnées de la solution sont $A^{-1}(1, 1, 2) = (4, -3, 2)$. 
    $$\boxed{\Delta(P) = 1 + X + 2X^{2} \iff P = 4 - 3X + 2X^{2}}$$
     On vérifie : $P + P' = 4 - 3X + 2X^{2} - 3 + 4X = 1 + X + 2X^{2}$.
- id: "ma-16-21"
  feuille: "f-ma-16"
  numero: 21
  partie: "Matrices et applications linéaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["matrice d'une application linéaire"]
  noeuds: [v-matrices]
  notions: [matrice]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    On pose $A = \begin{pmatrix} 0 & 1 \\ 1 & 0 \\ 1 & 1 \end{pmatrix}$.

    **1.** Existe-t-il $B \in \mathcal{M}_{2, 3}(\mathbb{R})$ telle que $AB = I_{3}$ ?

    **2.** Existe-t-il $C \in \mathcal{M}_{2, 3}(\mathbb{R})$ telle que $CA = I_{2}$ ? Si oui, déterminer toutes ces matrices.
  corrige: |
    **1.** On aurait $3 = \mathrm{rg} I_{3} = \mathrm{rg}(AB) \leqslant \mathrm{rg} A \leqslant 2$, ce qui est impossible. 
    $$\boxed{\text{il n'existe pas de } B \text{ telle que } AB = I_{3}}$$

    **2.** On écrit $C = \begin{pmatrix} c_{1} & c_{2} & c_{3} \\ c_{4} & c_{5} & c_{6} \end{pmatrix}$. L'égalité $CA = I_{2}$ donne $c_{2} + c_{3} = 1$, $c_{1} + c_{3} = 0$, $c_{5} + c_{6} = 0$ et $c_{4} + c_{6} = 1$. En prenant $c_{3} = s$ et $c_{6} = t$ comme paramètres : 
    $$\boxed{CA = I_{2} \iff C = \begin{pmatrix} -s & 1 - s & s \\ 1 - t & -t & t \end{pmatrix}, \quad (s, t) \in \mathbb{R}^{2}}$$
     *Piège.* Le théorème 3, qui fait d'une inverse d'un côté une inverse des deux côtés, ne vaut que pour les matrices carrées. Ici, $A$ a une infinité d'inverses à gauche et aucune inverse à droite.
- id: "ma-16-22"
  feuille: "f-ma-16"
  numero: 22
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["matrice d'une application linéaire"]
  noeuds: [v-matrices]
  notions: [matrice]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $F = \{u \in \mathbb{R}^{\mathbb{N}} \mid \forall n \in \mathbb{N}, \ u_{n + 2} = u_{n + 1} + u_{n}\}$.

    **1.** Donner une base $\mathcal{B}$ de $F$.

    **2.** Montrer que $T : (u_{n})_{n \in \mathbb{N}} \mapsto (u_{n + 1})_{n \in \mathbb{N}}$ est un endomorphisme de $F$.

    **3.** Calculer $\mathrm{Mat}_{\mathcal{B}}(T)$ et en déduire que $T$ est un automorphisme de $F$.
  corrige: |
    **1.** L'application $u \mapsto (u_{0}, u_{1})$ est un isomorphisme de $F$ sur $\mathbb{R}^{2}$, puisqu'une suite de $F$ est déterminée par ses deux premiers termes, que l'on peut choisir librement. On note $a$ et $b$ les suites de $F$ de premiers termes $(1, 0)$ et $(0, 1)$. 
    $$\boxed{\mathcal{B} = (a, b), \qquad a = (1, 0, 1, 1, 2, 3, \dots), \quad b = (0, 1, 1, 2, 3, 5, \dots)}$$

    **2.** L'application $T$ est linéaire, et si $u \in F$, la suite $v = T(u)$ vérifie 
    $$v_{n + 2} = u_{n + 3} = u_{n + 2} + u_{n + 1} = v_{n + 1} + v_{n},$$
     donc $T(u) \in F$.

    **3.** La suite $T(a)$ a pour premiers termes $(a_{1}, a_{2}) = (0, 1)$, donc $T(a) = b$ ; la suite $T(b)$ a pour premiers termes $(1, 1)$, donc $T(b) = a + b$. 
    $$\boxed{\mathrm{Mat}_{\mathcal{B}}(T) = \begin{pmatrix} 0 & 1 \\ 1 & 1 \end{pmatrix}}$$
     Cette matrice est inversible, car $0 \times 1 - 1 \times 1 = -1 \neq 0$ (proposition 9), d'inverse $\begin{pmatrix} -1 & 1 \\ 1 & 0 \end{pmatrix}$. Par le théorème 3, $T$ est un automorphisme de $F$ : on peut « remonter » une suite de Fibonacci, en posant $u_{-1} = u_{1} - u_{0}$.
- id: "ma-16-23"
  feuille: "f-ma-16"
  numero: 23
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["matrice d'une application linéaire"]
  noeuds: [v-matrices]
  notions: [matrice]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $\alpha \in \mathbb{R}$ et $n \geqslant 1$. Pour $k \in [\![0\,;n]\!]$, on note $f_{k} : x \mapsto x^{k}\mathrm{e}^{\alpha x}$, et $E = \mathrm{Vect}(f_{0}, \dots, f_{n})$.

    **1.** Quelle est la dimension de $E$ ?

    **2.** Montrer que la dérivation $D : f \mapsto f'$ induit un endomorphisme de $E$, et donner sa matrice dans la base $(f_{0}, \dots, f_{n})$.

    **3.** Montrer que $D$ est un automorphisme de $E$ si et seulement si $\alpha \neq 0$.

    **4.** Application : déterminer une primitive de $x \mapsto x^{2}\mathrm{e}^{x}$ sans intégrer par parties.
  corrige: |
    **1.** Si $\sum_{k} \lambda_{k}f_{k} = 0$, alors, en multipliant par $\mathrm{e}^{-\alpha x}$, le polynôme $\sum_{k} \lambda_{k}X^{k}$ s'annule sur tout $\mathbb{R}$, donc il est nul et tous les $\lambda_{k}$ sont nuls. La famille $(f_{0}, \dots, f_{n})$ est libre et engendre $E$. 
    $$\boxed{\dim E = n + 1}$$

    **2.** On a $f_{k}' = kf_{k - 1} + \alpha f_{k}$, avec la convention $f_{-1} = 0$. Par linéarité, $D(E) \subset E$, et 
    $$\boxed{\mathrm{Mat}(D) = \begin{pmatrix} \alpha & 1 & & & \\ & \alpha & 2 & & \\ & & \ddots & \ddots & \\ & & & \alpha & n \\ & & & & \alpha \end{pmatrix}}$$

    **3.** La matrice est triangulaire supérieure de coefficients diagonaux tous égaux à $\alpha$. Elle est inversible si et seulement si $\alpha \neq 0$ (proposition 12), et le théorème 3 conclut. Pour $\alpha = 0$, on retrouve d'ailleurs que les constantes ont une dérivée nulle.

    **4.** Avec $\alpha = 1$ et $n = 2$, la matrice de $D$ est celle de l'exercice 20, dont on connaît l'inverse. Une primitive de $f_{2}$ est $D^{-1}(f_{2})$, de coordonnées $A^{-1}(0, 0, 1) = (2, -2, 1)$. 
    $$\boxed{\int x^{2}\mathrm{e}^{x}\,\mathrm{d}x = (x^{2} - 2x + 2)\mathrm{e}^{x} + C}$$
     On vérifie en dérivant : $(2x - 2)\mathrm{e}^{x} + (x^{2} - 2x + 2)\mathrm{e}^{x} = x^{2}\mathrm{e}^{x}$.

    *À retenir.* Inverser la matrice de la dérivation sur un espace stable, c'est trouver une primitive. Les deux intégrations par parties du chapitre 6 sont ici remplacées par la résolution d'un système triangulaire.
- id: "ma-16-24"
  feuille: "f-ma-16"
  numero: 24
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["matrice d'une application linéaire"]
  noeuds: [v-matrices]
  notions: [matrice]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Montrer que $f : P \mapsto X^{2}P'' + 2XP'$ est un endomorphisme de $\mathbb{K}_{3}[X]$. Déterminer sa matrice dans la base canonique, et en déduire $\mathrm{Ker}\, f$ et $\operatorname{Im} f$.

    **2.** L'application $g : P \mapsto (X^{2} - 1)P' - (2X + 1)P$ est-elle un automorphisme de $\mathbb{K}_{2}[X]$ ?
  corrige: |
    **1.** L'application $f$ est linéaire, et $f(X^{k}) = k(k - 1)X^{k} + 2kX^{k} = k(k + 1)X^{k}$ : elle envoie $\mathbb{K}_{3}[X]$ dans lui-même. 
    $$\boxed{\mathrm{Mat}(f) = \mathrm{diag}(0, 2, 6, 12), \qquad \mathrm{Ker}\, f = \mathbb{K}_{0}[X], \qquad \operatorname{Im} f = \mathrm{Vect}(X, X^{2}, X^{3})}$$

    **2.** L'application $g$ est linéaire. Les termes de degré $3$ se compensent : 
    $$g(1) = -1 - 2X, \qquad g(X) = -1 - X - X^{2}, \qquad g(X^{2}) = 2X^{3} - 2X - 2X^{3} - X^{2} = -2X - X^{2}.$$
     Donc $g$ est un endomorphisme de $\mathbb{K}_{2}[X]$, de matrice 
    $$G = \begin{pmatrix} -1 & -1 & 0 \\ -2 & -1 & -2 \\ 0 & -1 & -1 \end{pmatrix}.$$
     L'échelonnement $L_{2} \leftarrow L_{2} - 2L_{1}$ donne la ligne $(0, 1, -2)$, puis $L_{3} \leftarrow L_{3} + L_{2}$ donne $(0, 0, -3)$ : trois pivots, donc $\mathrm{rg} G = 3$ (théorème 8). 
    $$\boxed{g \text{ est un automorphisme de } \mathbb{K}_{2}[X]}$$
- id: "ma-16-25"
  feuille: "f-ma-16"
  numero: 25
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["matrice d'une application linéaire", rang]
  noeuds: [v-matrices, v-rang]
  notions: [matrice, rang-matrice]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $A = \begin{pmatrix} a & b \\ c & d \end{pmatrix} \in \mathcal{M}_{2}(\mathbb{K})$.

    **1.** On note $L_{A}$ l'endomorphisme $M \mapsto AM$ de $\mathcal{M}_{2}(\mathbb{K})$. Déterminer sa matrice dans la base $(E_{11}, E_{21}, E_{12}, E_{22})$.

    **2.** Généraliser à $A \in \mathcal{M}_{n}(\mathbb{K})$, en ordonnant convenablement la base canonique de $\mathcal{M}_{n}(\mathbb{K})$. Quel est le rang de $L_{A}$ ?

    **3.** Soit $u \in \mathcal{L}(E)$. Déterminer le rang de $v \mapsto u \circ v$, endomorphisme de $\mathcal{L}(E)$.
  corrige: |
    **1.** Par la proposition 4, $AE_{11} = aE_{11} + cE_{21}$, $AE_{21} = bE_{11} + dE_{21}$, $AE_{12} = aE_{12} + cE_{22}$ et $AE_{22} = bE_{12} + dE_{22}$. 
    $$\boxed{\mathrm{Mat}(L_{A}) = \begin{pmatrix} a & b & 0 & 0 \\ c & d & 0 & 0 \\ 0 & 0 & a & b \\ 0 & 0 & c & d \end{pmatrix} = \begin{pmatrix} A & 0 \\ 0 & A \end{pmatrix}}$$

    **2.** On ordonne la base colonne par colonne : $(E_{11}, \dots, E_{n1}, E_{12}, \dots, E_{n2}, \dots, E_{1n}, \dots, E_{nn})$. Comme la $j$-ième colonne de $AM$ est $A$ fois la $j$-ième colonne de $M$, la matrice de $L_{A}$ est diagonale par blocs, avec $n$ blocs égaux à $A$. L'image de $L_{A}$ est formée des matrices dont chaque colonne est dans $\operatorname{Im} A$, et ce sous-espace est isomorphe à $(\operatorname{Im} A)^{n}$. 
    $$\boxed{\mathrm{rg} L_{A} = n\,\mathrm{rg} A}$$

    **3.** Dans une base de $E$, l'endomorphisme $v \mapsto u \circ v$ correspond à $M \mapsto AM$, avec $A = \mathrm{Mat}(u)$, par l'isomorphisme du théorème 2. Son rang est donc $n\,\mathrm{rg} u$, où $n = \dim E$.
- id: "ma-16-26"
  feuille: "f-ma-16"
  numero: 26
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["matrice d'une application linéaire", matrices inversibles, espaces de polynômes]
  noeuds: [v-matrices, pol-anneau, pol-binome]
  notions: [matrice, matrice-inversible, groupe-lineaire, coefficient-binomial]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $a \in \mathbb{K}$, $n \in \mathbb{N}$, et $\tau_{a}$ l'endomorphisme $P \mapsto P(X + a)$ de $\mathbb{K}_{n}[X]$.

    **1.** Déterminer la matrice $A_{a}$ de $\tau_{a}$ dans la base canonique.

    **2.** Calculer $\tau_{a} \circ \tau_{b}$. En déduire que $A_{a}$ est inversible et donner $A_{a}^{-1}$, puis $A_{1}^{k}$ pour tout $k \in \mathbb{Z}$.

    **3.** Écrire $A_{1}$ et $A_{1}^{-1}$ pour $n = 3$. Quelle identité sur les coefficients binomiaux le produit $A_{1}A_{1}^{-1} = I_{4}$ exprime-t-il ?
  corrige: |
    **1.** La formule du binôme donne $\tau_{a}(X^{j}) = (X + a)^{j} = \sum_{i = 0}^{j}\binom{j}{i}a^{j - i}X^{i}$. 
    $$\boxed{A_{a} = \Big(\binom{j}{i}a^{j - i}\Big)_{0 \leqslant i, j \leqslant n}, \text{ triangulaire supérieure}}$$
     avec la convention $\binom{j}{i} = 0$ pour $i > j$.

    **2.** On a $\tau_{a}\big(\tau_{b}(P)\big) = \tau_{a}\big(P(X + b)\big) = P(X + a + b)$, donc $\tau_{a} \circ \tau_{b} = \tau_{a + b}$, et $A_{a}A_{b} = A_{a + b}$ (théorème 2). Comme $A_{0} = I_{n + 1}$, on a $A_{a}A_{-a} = I_{n + 1}$. 
    $$\boxed{A_{a}^{-1} = A_{-a}, \qquad A_{1}^{k} = A_{k} \quad (k \in \mathbb{Z})}$$

    **3.** Pour $n = 3$, on obtient 
    $$A_{1} = \begin{pmatrix} 1 & 1 & 1 & 1 \\ 0 & 1 & 2 & 3 \\ 0 & 0 & 1 & 3 \\ 0 & 0 & 0 & 1 \end{pmatrix}, \qquad A_{1}^{-1} = A_{-1} = \begin{pmatrix} 1 & -1 & 1 & -1 \\ 0 & 1 & -2 & 3 \\ 0 & 0 & 1 & -3 \\ 0 & 0 & 0 & 1 \end{pmatrix}.$$
     Le coefficient d'indice $(i, j)$ du produit $A_{1}A_{-1}$ exprime l'identité 
    $$\boxed{\sum_{k = i}^{j}(-1)^{j - k}\binom{k}{i}\binom{j}{k} = \begin{cases} 1 & \text{si } i = j \\ 0 & \text{si } i \neq j \end{cases}}$$
     c'est une *formule d'inversion* des coefficients binomiaux, obtenue sans aucun calcul de sommes.
- id: "ma-16-27"
  feuille: "f-ma-16"
  numero: 27
  partie: "Matrices et applications linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["matrice d'une application linéaire", matrices inversibles, rang, espaces de polynômes]
  noeuds: [v-matrices, v-rang, pol-anneau]
  notions: [matrice, matrice-inversible, groupe-lineaire, rang-matrice]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $x_{0}, \dots, x_{n} \in \mathbb{K}$ deux à deux distincts.

    **1.** Montrer que $\varphi : P \mapsto \big(P(x_{0}), \dots, P(x_{n})\big)$ est un isomorphisme de $\mathbb{K}_{n}[X]$ sur $\mathbb{K}^{n + 1}$.

    **2.** En déduire que la *matrice de Vandermonde* $V = \big(x_{i}^{j}\big)_{0 \leqslant i, j \leqslant n} \in \mathcal{M}_{n + 1}(\mathbb{K})$ est inversible.

    **3.** Que représentent les colonnes de $V^{-1}$ ? On pourra penser à l'interpolation de Lagrange (chapitre 13).
  corrige: |
    **1.** L'application $\varphi$ est linéaire. Si $\varphi(P) = 0$, le polynôme $P$, de degré au plus $n$, a $n + 1$ racines distinctes, donc il est nul (chapitre 13) : $\varphi$ est injective. Comme $\dim \mathbb{K}_{n}[X] = \dim \mathbb{K}^{n + 1} = n + 1$, c'est un isomorphisme.

    **2.** Pour $P = \sum_{j} a_{j}X^{j}$, la $i$-ième coordonnée de $\varphi(P)$ est $\sum_{j} x_{i}^{j}a_{j}$ : la matrice de $\varphi$ dans les bases canoniques est $V$. Elle représente un isomorphisme, elle est donc inversible (théorème 2).

    **3.** La matrice $V^{-1}$ est celle de $\varphi^{-1}$. Sa $i$-ième colonne est formée des coordonnées du polynôme $\varphi^{-1}(e_{i})$, c'est-à-dire de l'unique polynôme de degré au plus $n$ qui vaut $1$ en $x_{i}$ et $0$ en les autres $x_{k}$. 
    $$\boxed{\text{la } i\text{-ième colonne de } V^{-1} \text{ contient les coefficients du polynôme de Lagrange } L_{i}}$$
     *À retenir.* L'interpolation de Lagrange du chapitre 13 n'est autre que l'inversion de la matrice de Vandermonde. Le chapitre 17 calculera le déterminant de cette matrice.
- id: "ma-16-28"
  feuille: "f-ma-16"
  numero: 28
  partie: "Matrices et applications linéaires"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["matrice d'une application linéaire", rang, matrices semblables]
  noeuds: [v-matrices, v-rang]
  notions: [matrice, rang-matrice, matrices-semblables]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $f \in \mathcal{L}(E)$, où $\dim E = n \geqslant 1$, tel que $f^{n} = 0$ et $f^{n - 1} \neq 0$.

    **1.** Soit $x \in E$ tel que $f^{n - 1}(x) \neq 0$. Montrer que $\mathcal{B} = \big(x, f(x), \dots, f^{n - 1}(x)\big)$ est une base de $E$.

    **2.** Écrire $\mathrm{Mat}_{\mathcal{B}}(f)$, et en déduire le rang de $f$.

    **3.** Montrer que deux endomorphismes vérifiant ces hypothèses ont des matrices semblables.
  corrige: |
    **1.** Supposons $\sum_{k = 0}^{n - 1}\lambda_{k}f^{k}(x) = 0$, et que les $\lambda_{k}$ ne soient pas tous nuls ; soit $m$ le plus petit indice tel que $\lambda_{m} \neq 0$. En appliquant $f^{n - 1 - m}$, tous les termes d'indice $k > m$ deviennent $f^{n - 1 - m + k}(x) = 0$, car $n - 1 - m + k \geqslant n$, et il reste $\lambda_{m}f^{n - 1}(x) = 0$, ce qui contredit $f^{n - 1}(x) \neq 0$. La famille est libre, de cardinal $n = \dim E$ : c'est une base.

    **2.** L'image de chaque vecteur de $\mathcal{B}$ est le suivant, et l'image du dernier est $f^{n}(x) = 0$. 
    $$\boxed{\mathrm{Mat}_{\mathcal{B}}(f) = \begin{pmatrix} 0 & & & \\ 1 & 0 & & \\ & \ddots & \ddots & \\ & & 1 & 0 \end{pmatrix} = \sum_{k = 1}^{n - 1} E_{k + 1, k}, \qquad \mathrm{rg} f = n - 1}$$

    **3.** Deux tels endomorphismes ont la même matrice ci-dessus, chacun dans une base convenable. Par le théorème 4, leurs matrices dans une base quelconque sont semblables à cette matrice, donc semblables entre elles.
