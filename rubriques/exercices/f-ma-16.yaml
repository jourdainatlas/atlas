  enonce: |
    Soit $u \in \mathcal{L}(E)$ de rang $1$. Montrer qu'un sous-espace $F$ de $E$ est stable par $u$ si et seulement si $F \subset \mathrm{Ker}\, u$ ou $\operatorname{Im} u \subset F$.
  corrige: |
    On note $\operatorname{Im} u = \mathbb{K} a$, avec $a \neq 0$.

    Si $F \subset \mathrm{Ker}\, u$, alors $u(F) = \{0\} \subset F$. Si $\operatorname{Im} u \subset F$, alors $u(F) \subset \operatorname{Im} u \subset F$. Dans les deux cas, $F$ est stable.

    Réciproquement, soit $F$ stable par $u$, et supposons $F \not\subset \mathrm{Ker}\, u$. Il existe $x \in F$ tel que $u(x) \neq 0$. Le vecteur $u(x)$ appartient à $F$, par stabilité, et à la droite $\operatorname{Im} u$, dont il est un vecteur non nul ; il l'engendre, donc $\operatorname{Im} u = \mathbb{K} u(x) \subset F$. 
    $$\boxed{F \text{ stable par } u \iff F \subset \mathrm{Ker}\, u \ \text{ ou } \ \operatorname{Im} u \subset F}$$
     *À retenir.* Pour un endomorphisme de rang $1$, il n'y a que deux façons d'être stable : être écrasé sur $0$, ou contenir la seule direction que $u$ produit.
