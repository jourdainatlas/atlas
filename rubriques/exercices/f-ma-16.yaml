  enonce: |
    **1.** Montrer que l'application $\Theta : A \mapsto \big(M \mapsto \operatorname{tr}(AM)\big)$ est un isomorphisme de $\mathcal{M}_{n}(\mathbb{K})$ sur $\mathcal{L}(\mathcal{M}_{n}(\mathbb{K}), \mathbb{K})$. On pourra utiliser l'exercice 5.

    **2.** En déduire que tout hyperplan de $\mathcal{M}_{n}(\mathbb{K})$, pour $n \geqslant 2$, est de la forme $\{M \mid \operatorname{tr}(AM) = 0\}$ avec $A \neq 0$.

    **3.** Montrer que tout hyperplan de $\mathcal{M}_{n}(\mathbb{K})$, pour $n \geqslant 2$, contient une matrice inversible. On pourra chercher une matrice de permutation, au sens de l'exercice 17, convenable.
  corrige: |
    **1.** L'application $\Theta$ est linéaire, car la trace et le produit le sont. Elle est injective par l'exercice 5 : si $\operatorname{tr}(AM) = 0$ pour toute $M$, alors $A = 0$. Comme $\dim \mathcal{M}_{n}(\mathbb{K}) = n^{2} = \dim\mathcal{L}(\mathcal{M}_{n}(\mathbb{K}), \mathbb{K})$ (chapitre 15), c'est un isomorphisme.

    **2.** Un hyperplan $H$ est le noyau d'une forme linéaire $\varphi$ non nulle (chapitre 15). Par la question 1, $\varphi = \Theta(A)$ pour une matrice $A$, non nulle puisque $\varphi$ ne l'est pas. 
    $$\boxed{H = \{M \in \mathcal{M}_{n}(\mathbb{K}) \mid \operatorname{tr}(AM) = 0\}, \qquad A \neq 0}$$

    **3.** Soit $r = \mathrm{rg} A \geqslant 1$. Par le théorème 5, on écrit $A = QJ_{r}P^{-1}$, avec $P$, $Q$ inversibles. Soit $C$ la matrice de permutation associée au cycle $(1\ 2\ \cdots\ n)$, qui envoie $e_{j}$ sur $e_{j + 1}$ et $e_{n}$ sur $e_{1}$. Comme $n \geqslant 2$, elle n'a aucun coefficient diagonal non nul, et $J_{r}C$ non plus, puisque $J_{r}C$ est formée des $r$ premières lignes de $C$ complétées par des lignes nulles. On pose $M = PCQ^{-1}$, inversible. Alors 
    $$\operatorname{tr}(AM) = \operatorname{tr}(QJ_{r}P^{-1}PCQ^{-1}) = \operatorname{tr}(QJ_{r}CQ^{-1}) = \operatorname{tr}(J_{r}C) = 0.$$

    $$\boxed{\text{tout hyperplan de } \mathcal{M}_{n}(\mathbb{K}) \ (n \geqslant 2) \text{ contient une matrice inversible}}$$
     *Piège.* Pour $n = 1$, le résultat est faux : le seul hyperplan de $\mathcal{M}_{1}(\mathbb{K}) = \mathbb{K}$ est $\{0\}$. C'est là qu'intervient l'existence d'une permutation sans point fixe, qui exige $n \geqslant 2$.
- id: "ma-16-46"
  feuille: "f-ma-16"
  numero: 46
  partie: "Opérations élémentaires et systèmes linéaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: [opérations élémentaires et systèmes, rang]
  noeuds: [v-rang]
  notions: [rang-matrice]
  page_enonce: 10
  page_corrige: 20
  enonce: |
    Calculer le rang des familles suivantes de $\mathbb{R}^{3}$ ou de $\mathbb{R}^{4}$. Sont-elles libres ? génératrices ? Compléter celles qui sont libres en des bases, et extraire une base de celles qui sont génératrices.

    **1.** $\big((1, 2, 5, 4), (2, 4, 10, 7)\big)$ ;

    **2.** $\big((1, 2, 3), (-5, -10, -15)\big)$ ;

    **3.** $\big((1, -2, 7), (0, -12, 35), (0, 0, 2)\big)$ ;

    **4.** $\big((3, 1, -4, 6), (1, 1, 4, 4), (1, 0, -4, a)\big)$, en fonction du réel $a$.
  corrige: |
    On place les vecteurs en lignes et l'on échelonne : les opérations sur les lignes ne changent pas l'espace engendré (proposition 17), et le rang est le nombre de pivots (théorème 8).

    **(i)** On note $v_{1} = (1, 2, 5, 4)$ et $v_{2} = (2, 4, 10, 7)$. Alors $v_{2} - 2v_{1} = (0, 0, 0, -1)$ : deux pivots, la famille est libre, de rang $2$, et n'engendre pas $\mathbb{R}^{4}$. Les lignes $v_{1}$, $(0, 0, 0, -1)$, $e_{2}$, $e_{3}$ forment, après permutation, une matrice échelonnée à quatre pivots. 
    $$\boxed{\mathrm{rg} = 2, \quad \text{libre} ; \quad (v_{1}, v_{2}, e_{2}, e_{3}) \text{ base de } \mathbb{R}^{4}}$$

    **(ii)** Le second vecteur vaut $-5$ fois le premier. 
    $$\boxed{\mathrm{rg} = 1, \quad \text{ni libre ni génératrice}}$$

    **(iii)** La famille est déjà échelonnée, avec trois pivots $1$, $-12$, $2$. 
    $$\boxed{\mathrm{rg} = 3, \quad \text{base de } \mathbb{R}^{3}}$$

    **(iv)** L'échelonnement donne les lignes $(3, 1, -4, 6)$, $(0, 2, 16, 6)$ et $(0, 0, 0, 6a - 6)$, à un facteur non nul près. Si $a \neq 1$, il y a trois pivots, dans les colonnes $1$, $2$, $4$ : la famille est libre et on la complète par $e_{3}$. Si $a = 1$, le rang vaut $2$, et l'on trouve la relation $2v_{3} = v_{1} - v_{2}$. 
    $$\boxed{\mathrm{rg} = 3 \text{ si } a \neq 1, \quad \mathrm{rg} = 2 \text{ si } a = 1 ; \quad \text{jamais génératrice de } \mathbb{R}^{4}}$$
