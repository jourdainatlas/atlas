  page_enonce: 15
  page_corrige: 29
  enonce: |
    Déterminer les fonctions $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}$ telles que, pour toutes matrices $A$, $B \in \mathcal{M}_{n}(\mathbb{R})$, 
    $$f(AB) \leqslant \min\big(f(A), f(B)\big).$$
  corrige: |
    *Idée.* L'inégalité appliquée avec des matrices inversibles montre que $f$ est constante sur les classes d'équivalence, donc ne dépend que du rang ; appliquée aux matrices $J_{r}$, elle montre que cette dépendance est croissante.

    Si $P$ et $Q$ sont inversibles, on a 
    $$f(PAQ) \leqslant f(AQ) \leqslant f(A) \qquad \text{et} \qquad f(A) = f\big(P^{-1}(PAQ)Q^{-1}\big) \leqslant f(PAQ).$$
     Ainsi $f$ est constante sur chaque classe d'équivalence, c'est-à-dire, par le théorème 6, sur chaque ensemble de matrices de même rang : il existe $\varphi : [\![0\,;n]\!] \to \mathbb{R}$ telle que $f = \varphi \circ \mathrm{rg}$. Pour $r \leqslant s$, on a $J_{r} = J_{r}J_{s}$, donc $\varphi(r) = f(J_{r}) \leqslant f(J_{s}) = \varphi(s)$ : $\varphi$ est croissante.

    Réciproquement, si $f = \varphi \circ \mathrm{rg}$ avec $\varphi$ croissante, l'inégalité $\mathrm{rg}(AB) \leqslant \min(\mathrm{rg} A, \mathrm{rg} B)$ donne $f(AB) \leqslant \min\big(f(A), f(B)\big)$. 
    $$\boxed{f = \varphi \circ \mathrm{rg}, \qquad \varphi : [\![0\,;n]\!] \to \mathbb{R} \text{ croissante}}$$
- id: "ma-16-71"
  feuille: "f-ma-16"
  numero: 71
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [matrices à coefficients entiers, monoïde libre]
  noeuds: [v-matrices, a-monoide]
  notions: []
  page_enonce: 15
  page_corrige: 30
  enonce: |
    On note $\mathcal{S}$ l'ensemble des matrices carrées d'ordre $2$ à coefficients entiers naturels $a$, $b$, $c$, $d$ telles que $ad - bc = 1$, et l'on pose 
    $$M = \begin{pmatrix} a & b \\ c & d \end{pmatrix}, \qquad D = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, \qquad G = \begin{pmatrix} 1 & 0 \\ 1 & 1 \end{pmatrix}.$$
     Montrer que toute matrice de $\mathcal{S}$ s'écrit de façon unique comme un produit de facteurs égaux à $D$ ou à $G$, le produit vide étant $I_{2}$.
  corrige: |
    *Idée.* C'est un algorithme d'Euclide matriciel : multiplier à gauche par $D^{-1}$ ou $G^{-1}$ retranche une ligne à l'autre. La condition $ad - bc = 1$ impose que l'une des lignes domine l'autre, et la somme des coefficients diminue à chaque étape.

    On a $D^{-1}M = \begin{pmatrix} a - c & b - d \\ c & d \end{pmatrix}$ et $G^{-1}M = \begin{pmatrix} a & b \\ c - a & d - b \end{pmatrix}$, et ces deux matrices vérifient encore $(a - c)d - (b - d)c = ad - bc = 1$, de même pour la seconde.

    *Étape clé.* Soit $M \in \mathcal{S}$, $M \neq I_{2}$. Montrons que les lignes de $M$ sont comparables coefficient par coefficient. Si l'on avait $a > c$ et $b < d$, alors $ad - bc \geqslant (c + 1)(b + 1) - bc = b + c + 1$ ; l'égalité $ad - bc = 1$ forcerait $b = c = 0$, puis $ad = 1$, soit $M = I_{2}$, exclu. Si l'on avait $a < c$ et $b > d$, alors $ad - bc \leqslant (c - 1)d - (d + 1)c = -c - d < 1$, exclu. Les deux lignes ne sont pas égales, sinon $ad - bc = 0$. Donc exactement l'une des deux matrices $D^{-1}M$, $G^{-1}M$ appartient à $\mathcal{S}$, et la somme de ses coefficients est strictement inférieure à celle de $M$, puisqu'on a retranché une ligne non nulle.

    *Existence.* On répète l'étape clé ; la somme des coefficients, entier naturel, décroît strictement, donc on aboutit à $I_{2}$ en un nombre fini d'étapes, et $M$ est le produit des facteurs $D$ ou $G$ retranchés.

    *Unicité.* Si $M = M_{1}M_{2} \cdots M_{r}$ avec $r \geqslant 1$ et $M_{k} \in \{D, G\}$, la matrice $M_{1}^{-1}M = M_{2} \cdots M_{r}$ est à coefficients entiers naturels : par l'étape clé, $M_{1}$ est imposé. De plus, $M \neq I_{2}$, car multiplier à gauche par $D$ ou $G$ une matrice de $\mathcal{S}$ augmente strictement la somme de ses coefficients. Une récurrence sur la somme des coefficients conclut. 
    $$\boxed{\text{tout } M \in \mathcal{S} \text{ s'écrit de façon unique comme produit de facteurs } D \text{ et } G}$$
     Par exemple, $\begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix} = DG$ et $\begin{pmatrix} 3 & 2 \\ 1 & 1 \end{pmatrix} = DDG$. La suite des facteurs code le développement en fraction continue de $\frac{a}{c}$, ce que l'on pourra relier à l'algorithme d'Euclide du chapitre 12.

