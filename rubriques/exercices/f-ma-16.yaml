  enonce: |
    Déterminer la matrice, dans la base canonique de $\mathbb{R}^{3}$, de la projection sur le plan d'équation $x - 2y + z = 0$ parallèlement à la droite $\mathrm{Vect}\big((-1, 1, 2)\big)$. Vérifier le résultat par deux calculs indépendants.
  corrige: |
    On note $N = (1, -2, 1)$ et $d = (-1, 1, 2)$. Un vecteur $v$ se décompose en $v = (v - \lambda d) + \lambda d$, avec $v - \lambda d$ dans le plan, c'est-à-dire ${N}^{T}(v - \lambda d) = 0$. Comme ${N}^{T}d = -1 - 2 + 2 = -1$, on obtient $\lambda = -{N}^{T}v$, et $p(v) = v + ({N}^{T}v)\,d$. La matrice de $p$ est donc $I_{3} + d{N}^{T}$. 
    $$\boxed{\mathrm{Mat}(p) = \begin{pmatrix} 0 & 2 & -1 \\ 1 & -1 & 1 \\ 2 & -4 & 3 \end{pmatrix}}$$
     *Premier contrôle.* On vérifie que la matrice $M$ obtenue envoie $d$ sur $0$ et fixe les vecteurs $(2, 1, 0)$ et $(1, 0, -1)$ du plan, qui forment une base du plan : ces trois conditions caractérisent $p$.

    *Second contrôle.* On vérifie $M^{2} = M$, et $\operatorname{tr} M = 2 = \mathrm{rg} M$, comme pour tout projecteur (exercice 40).
- id: "ma-16-34"
  feuille: "f-ma-16"
  numero: 34
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [changements de bases, matrices diagonales]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage, matrice-diagonale]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $\varphi : P \mapsto (X^{2} + 2)P'' + (X + 1)P' + P$.

    **1.** Montrer que $\varphi$ est un endomorphisme de $\mathbb{R}_{2}[X]$ et donner sa matrice dans la base canonique.

    **2.** Déterminer les réels $\lambda$ tels que $\varphi - \lambda\,\mathrm{id}$ ne soit pas injectif, et pour chacun d'eux le noyau de $\varphi - \lambda\,\mathrm{id}$.

    **3.** En déduire une base de $\mathbb{R}_{2}[X]$ dans laquelle la matrice de $\varphi$ est diagonale.
  corrige: |
    **1.** L'application $\varphi$ est linéaire et ne fait pas monter le degré : $\varphi(1) = 1$, $\varphi(X) = X + 1 + X = 1 + 2X$, et $\varphi(X^{2}) = 2X^{2} + 4 + 2X^{2} + 2X + X^{2} = 4 + 2X + 5X^{2}$. 
    $$\boxed{\mathrm{Mat}(\varphi) = \begin{pmatrix} 1 & 1 & 4 \\ 0 & 2 & 2 \\ 0 & 0 & 5 \end{pmatrix}}$$

    **2.** La matrice de $\varphi - \lambda\,\mathrm{id}$ est triangulaire de diagonale $(1 - \lambda, 2 - \lambda, 5 - \lambda)$. Elle n'est pas inversible, c'est-à-dire que $\varphi - \lambda\,\mathrm{id}$ n'est pas injectif, si et seulement si $\lambda \in \{1, 2, 5\}$ (proposition 12). La résolution des trois systèmes donne : 
    $$\boxed{\mathrm{Ker}\,(\varphi - \mathrm{id}) = \mathrm{Vect}(1), \qquad \mathrm{Ker}\,(\varphi - 2\,\mathrm{id}) = \mathrm{Vect}(1 + X), \qquad \mathrm{Ker}\,(\varphi - 5\,\mathrm{id}) = \mathrm{Vect}(7 + 4X + 6X^{2})}$$
     Pour $\lambda = 5$, par exemple, le système donne $c = 1$, puis $-3b + 2 = 0$, puis $-4a + b + 4 = 0$, soit $(a, b, c) = (\frac{7}{6}, \frac{2}{3}, 1)$, que l'on multiplie par $6$.

    **3.** Trois vecteurs pris dans les trois noyaux, de degrés échelonnés $0$, $1$, $2$, forment une base de $\mathbb{R}_{2}[X]$. 
    $$\boxed{\text{dans la base } (1, \ 1 + X, \ 7 + 4X + 6X^{2}), \quad \mathrm{Mat}(\varphi) = \mathrm{diag}(1, 2, 5)}$$
- id: "ma-16-35"
  feuille: "f-ma-16"
  numero: 35
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changements de bases, matrices semblables]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage, matrices-semblables]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    **1.** Montrer que $A = \begin{pmatrix} 1 & 1 & 1 \\ 0 & 1 & 2 \\ 0 & 1 & 2 \end{pmatrix}$ est semblable à $\mathrm{diag}(0, 1, 3)$.

    **2.** Montrer que $B = \begin{pmatrix} 1 & 1 & -1 \\ -3 & -3 & 3 \\ -2 & -2 & 2 \end{pmatrix}$ est semblable à $E_{21}$.
  corrige: |
    **1.** On cherche des vecteurs $v$ tels que $Av = \lambda v$ pour $\lambda = 0, 1, 3$. On trouve 
    $$A(1, -2, 1) = 0, \qquad A(1, 0, 0) = (1, 0, 0), \qquad A(1, 1, 1) = (3, 3, 3).$$
     Ces trois vecteurs sont libres : si $a(1, -2, 1) + b(1, 0, 0) + c(1, 1, 1) = 0$, la deuxième et la troisième coordonnée donnent $-2a + c = 0$ et $a + c = 0$, donc $a = c = 0$, puis $b = 0$. 
    $$\boxed{P^{-1}AP = \mathrm{diag}(0, 1, 3) \quad \text{avec} \quad P = \begin{pmatrix} 1 & 1 & 1 \\ -2 & 0 & 1 \\ 1 & 0 & 1 \end{pmatrix}}$$

    **2.** Les colonnes de $B$ sont proportionnelles à $w = (1, -3, -2)$, donc $\mathrm{rg} B = 1$, et $\mathrm{Ker}\, B$ est le plan d'équation $x + y - z = 0$, qui contient $w$ ; ainsi $B^{2} = 0$. On pose $v_{1} = (1, 0, 0)$, $v_{2} = Bv_{1} = w$ et $v_{3} = (1, 0, 1) \in \mathrm{Ker}\, B$. Ces vecteurs sont libres, car $(v_{2}, v_{3})$ est une base de $\mathrm{Ker}\, B$ et $v_{1} \notin \mathrm{Ker}\, B$. Dans la base $(v_{1}, v_{2}, v_{3})$, on a $v_{1} \mapsto v_{2}$, $v_{2} \mapsto 0$, $v_{3} \mapsto 0$. 
    $$\boxed{P^{-1}BP = E_{21} \quad \text{avec} \quad P = \begin{pmatrix} 1 & 1 & 1 \\ 0 & -3 & 0 \\ 0 & -2 & 1 \end{pmatrix}}$$
- id: "ma-16-36"
  feuille: "f-ma-16"
  numero: 36
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [changements de bases, matrices diagonales, changement de base, matrices semblables]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage, matrice-diagonale, matrices-semblables]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Pour $\theta \in \mathbb{R}$, on pose $R(\theta) = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}$.

    **1.** Montrer que $\theta \mapsto R(\theta)$ est un morphisme de groupes de $(\mathbb{R}, +)$ dans $\big(\mathrm{GL}_{2}(\mathbb{R}), \times\big)$, et déterminer son noyau.

    **2.** Calculer $R(\theta)^{n}$ pour tout $n \in \mathbb{Z}$.

    **3.** On suppose $\theta \notin \pi\mathbb{Z}$.

    **(a)** Montrer qu'il n'existe aucun vecteur non nul $v \in \mathbb{R}^{2}$ tel que $R(\theta)v$ soit colinéaire à $v$. En déduire que $R(\theta)$ n'est semblable à aucune matrice diagonale de $\mathcal{M}_{2}(\mathbb{R})$.

    **(b)** Montrer que $R(\theta)$, vue comme une matrice de $\mathcal{M}_{2}(\mathbb{C})$, est semblable à une matrice diagonale, et expliciter une matrice de passage.
  corrige: |
    **1.** Les formules d'addition (chapitre 4) donnent $R(\theta)R(\varphi) = R(\theta + \varphi)$. Comme $R(0) = I_{2}$, chaque $R(\theta)$ est inversible d'inverse $R(-\theta)$, et $\theta \mapsto R(\theta)$ est un morphisme de groupes. Son noyau est l'ensemble des $\theta$ tels que $\cos\theta = 1$ et $\sin\theta = 0$. 
    $$\boxed{\mathrm{Ker}\, = 2\pi\mathbb{Z}}$$

    **2.** Par récurrence pour $n \geqslant 0$, puis en passant à l'inverse pour $n < 0$ : 
    $$\boxed{R(\theta)^{n} = R(n\theta) \qquad (n \in \mathbb{Z})}$$
     c'est la formule de Moivre écrite matriciellement.

    **3.(a)** Si $R(\theta)v = \lambda v$ avec $v = (x, y) \neq 0$ et $\lambda \in \mathbb{R}$, alors $\big(R(\theta) - \lambda I_{2}\big)v = 0$, donc $R(\theta) - \lambda I_{2}$ n'est pas inversible. Par la proposition 9, $(\cos\theta - \lambda)^{2} + \sin^{2}\theta = 0$, ce qui impose $\sin\theta = 0$, c'est-à-dire $\theta \in \pi\mathbb{Z}$, exclu. Si l'on avait $P^{-1}R(\theta)P = \mathrm{diag}(\lambda, \mu)$ avec $P \in \mathrm{GL}_{2}(\mathbb{R})$, la première colonne $v$ de $P$ serait non nulle et vérifierait $R(\theta)v = \lambda v$ : c'est impossible.

    **3.(b)** Sur $\mathbb{C}$, on vérifie $R(\theta)(1, -\mathrm{i}) = (\cos\theta + \mathrm{i}\sin\theta, \sin\theta - \mathrm{i}\cos\theta) = \mathrm{e}^{\mathrm{i}\theta}(1, -\mathrm{i})$ et, de même, $R(\theta)(1, \mathrm{i}) = \mathrm{e}^{-\mathrm{i}\theta}(1, \mathrm{i})$. Les deux vecteurs ne sont pas colinéaires. 
    $$\boxed{P^{-1}R(\theta)P = \begin{pmatrix} \mathrm{e}^{\mathrm{i}\theta} & 0 \\ 0 & \mathrm{e}^{-\mathrm{i}\theta} \end{pmatrix} \quad \text{avec} \quad P = \begin{pmatrix} 1 & 1 \\ -\mathrm{i} & \mathrm{i} \end{pmatrix}}$$
     *À retenir.* Être semblable à une matrice diagonale dépend du corps : une rotation du plan réel ne fixe aucune droite réelle, mais elle fixe deux droites complexes, sur lesquelles elle agit par multiplication par $\mathrm{e}^{\pm\mathrm{i}\theta}$.
- id: "ma-16-37"
  feuille: "f-ma-16"
  numero: 37
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changements de bases, changement de base, matrices équivalentes, matrices semblables]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage, matrices-equivalentes, matrices-semblables]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    On considère les matrices élémentaires de $\mathcal{M}_{n}(\mathbb{K})$, avec $n \geqslant 2$.

    **1.** Deux matrices élémentaires sont-elles toujours équivalentes ?

    **2.** Montrer que $E_{ii}$ et $E_{jj}$ sont semblables, en explicitant une matrice de passage.

    **3.** Montrer que, pour $i \neq j$ et $k \neq \ell$, les matrices $E_{ij}$ et $E_{k\ell}$ sont semblables.

    **4.** Les matrices $E_{11}$ et $E_{12}$ sont-elles semblables ?
  corrige: |
    **1.** Toutes les matrices élémentaires sont de rang $1$. Par le théorème 6, deux matrices de même taille et de même rang sont équivalentes. 
    $$\boxed{\text{deux matrices élémentaires de } \mathcal{M}_{n}(\mathbb{K}) \text{ sont toujours équivalentes}}$$

    **2.** Soit $P$ la matrice de permutation qui échange $e_{i}$ et $e_{j}$ ; elle vérifie $P^{2} = I_{n}$. L'endomorphisme canoniquement associé à $E_{jj}$ envoie $e_{j}$ sur $e_{j}$ et les autres vecteurs sur $0$. Dans la base obtenue en échangeant $e_{i}$ et $e_{j}$, sa matrice devient $E_{ii}$. 
    $$\boxed{P^{-1}E_{jj}P = E_{ii}, \qquad P = P_{ij} = I_{n} - E_{ii} - E_{jj} + E_{ij} + E_{ji}}$$

    **3.** Comme $i \neq j$ et $k \neq \ell$, il existe une permutation $\sigma$ de $[\![1\,;n]\!]$ telle que $\sigma(k) = i$ et $\sigma(\ell) = j$. L'endomorphisme associé à $E_{k\ell}$ envoie $e_{\ell}$ sur $e_{k}$ et les autres vecteurs de base sur $0$. Dans la base $(e'_{1}, \dots, e'_{n})$ définie par $e'_{\sigma(m)} = e_{m}$, il envoie $e'_{j}$ sur $e'_{i}$ et les autres sur $0$ : sa matrice est $E_{ij}$. Les matrices $E_{k\ell}$ et $E_{ij}$ sont donc semblables.

    **4.** Si $P^{-1}E_{11}P = E_{12}$, on aurait $\operatorname{tr} E_{11} = \operatorname{tr} E_{12}$ (proposition 14), soit $1 = 0$. Autre argument : $E_{11}^{2} = E_{11}$ et $E_{12}^{2} = 0$, et deux matrices semblables ont des carrés semblables. 
    $$\boxed{E_{11} \text{ et } E_{12} \text{ sont équivalentes mais pas semblables}}$$
- id: "ma-16-38"
  feuille: "f-ma-16"
  numero: 38
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changements de bases]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension $2$ et $u \in \mathcal{L}(E)$ tel que $u^{2} = -\mathrm{id}_{E}$.

    **1.** Montrer que, pour tout $x \neq 0$, la famille $\big(x, u(x)\big)$ est une base de $E$.

    **2.** En déduire qu'il existe une base $\mathcal{B}$ de $E$ telle que $\mathrm{Mat}_{\mathcal{B}}(u) = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$.

    **3.** Existe-t-il un tel endomorphisme sur un $\mathbb{R}$-espace de dimension $3$ ?
  corrige: |
    **1.** Si $(x, u(x))$ était liée, avec $x \neq 0$, on aurait $u(x) = \lambda x$ pour un réel $\lambda$, puis $-x = u^{2}(x) = \lambda^{2}x$, soit $\lambda^{2} = -1$ : c'est impossible. La famille est libre, de cardinal $2 = \dim E$ : c'est une base.

    **2.** Dans la base $\mathcal{B} = (x, u(x))$, on a $u(x) = 0 \cdot x + 1 \cdot u(x)$ et $u\big(u(x)\big) = -x$. 
    $$\boxed{\mathrm{Mat}_{\mathcal{B}}(u) = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}}$$

    **3.** Supposons $\dim E = 3$ et $u^{2} = -\mathrm{id}_{E}$. La question 1 montre qu'aucune droite n'est stable par $u$. Soit $x \neq 0$ ; le plan $F$ engendré par $x$ et $u(x)$ est stable par $u$, puisque $u(u(x)) = -x$. Soit $y \notin F$, et $G$ le plan stable engendré par $y$ et $u(y)$. Par la formule de Grassmann (chapitre 15), $\dim(F \cap G) \geqslant 2 + 2 - 3 = 1$. L'intersection $F \cap G$ est stable par $u$ ; elle n'est pas une droite, donc c'est un plan, et $G = F$, ce qui contredit $y \notin F$. 
    $$\boxed{\text{aucun endomorphisme } u \text{ d'un } \mathbb{R}\text{-espace de dimension } 3 \text{ ne vérifie } u^{2} = -\mathrm{id}}$$
     Le chapitre 17 donnera une preuve en une ligne : $\det(u)^{2} = \det(-\mathrm{id}) = -1$.
- id: "ma-16-39"
  feuille: "f-ma-16"
  numero: 39
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changements de bases]
  noeuds: [v-matrices, v-rang]
  notions: [matrice-passage]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $u \in \mathcal{L}(E)$, avec $\dim E = n$, et $\lambda \neq \mu$ deux scalaires tels que $(u - \lambda\,\mathrm{id}_{E}) \circ (u - \mu\,\mathrm{id}_{E}) = 0$.

    **1.** Montrer que $E = \mathrm{Ker}\,(u - \lambda\,\mathrm{id}_{E}) \oplus \mathrm{Ker}\,(u - \mu\,\mathrm{id}_{E})$.

    **2.** En déduire qu'il existe une base de $E$ dans laquelle la matrice de $u$ est $\mathrm{diag}(\lambda, \dots, \lambda, \mu, \dots, \mu)$.

    **3.** Que retrouve-t-on pour $(\lambda, \mu) = (1, 0)$, puis pour $(\lambda, \mu) = (1, -1)$ ?
  corrige: |
    **1.** On pose $p = \frac{1}{\lambda - \mu}(u - \mu\,\mathrm{id})$ et $q = \frac{1}{\mu - \lambda}(u - \lambda\,\mathrm{id})$, de sorte que $p + q = \mathrm{id}$. Pour tout $x$, on a $x = p(x) + q(x)$, avec $(u - \lambda\,\mathrm{id})\big(p(x)\big) = 0$ et $(u - \mu\,\mathrm{id})\big(q(x)\big) = 0$, car les deux facteurs commutent. Ainsi $E = \mathrm{Ker}\,(u - \lambda\,\mathrm{id}) + \mathrm{Ker}\,(u - \mu\,\mathrm{id})$. Si $x$ est dans l'intersection, alors $\lambda x = u(x) = \mu x$, et $x = 0$ puisque $\lambda \neq \mu$.

    **2.** Une base adaptée à cette somme directe (chapitre 15), formée d'une base de chaque noyau, convient : $u$ agit par $\lambda$ sur les vecteurs du premier et par $\mu$ sur ceux du second. 
    $$\boxed{\mathrm{Mat}(u) = \mathrm{diag}(\underbrace{\lambda, \dots, \lambda}_{p}, \underbrace{\mu, \dots, \mu}_{n - p}), \qquad p = \dim\mathrm{Ker}\,(u - \lambda\,\mathrm{id})}$$

    **3.** Pour $(\lambda, \mu) = (1, 0)$, la relation s'écrit $u^{2} = u$ : on retrouve qu'un projecteur a une matrice $\mathrm{diag}(1, \dots, 1, 0, \dots, 0)$ dans une base adaptée à $E = \operatorname{Im} u \oplus \mathrm{Ker}\, u$. Pour $(\lambda, \mu) = (1, -1)$, elle s'écrit $u^{2} = \mathrm{id}$ : on retrouve qu'une symétrie a une matrice $\mathrm{diag}(1, \dots, 1, -1, \dots, -1)$.
- id: "ma-16-40"
  feuille: "f-ma-16"
  numero: 40
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changements de bases, rang, trace, projecteurs et symétries]
  noeuds: [v-matrices, v-rang, v-trace, v-somme-directe]
  notions: [matrice-passage, rang-matrice, trace]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    **1.** Soit $M \in \mathcal{M}_{n}(\mathbb{K})$ telle que $M^{2} = M$. Montrer que $\operatorname{tr}(M)$ est un entier naturel, et qu'il est égal au rang de $M$.

    **2.** Soit $S \in \mathcal{M}_{n}(\mathbb{K})$ telle que $S^{2} = I_{n}$. Montrer que $\operatorname{tr}(S)$ est un entier de même parité que $n$, compris entre $-n$ et $n$.

    **3.** La matrice $\begin{pmatrix} 2 & 3 \\ -1 & -1 \end{pmatrix}$ peut-elle être la matrice d'un projecteur ? d'une symétrie ?
  corrige: |
    **1.** L'endomorphisme canoniquement associé à $M$ est un projecteur. Par l'exercice 39, $M$ est semblable à $\mathrm{diag}(1, \dots, 1, 0, \dots, 0)$, avec $r$ coefficients égaux à $1$, et $r = \mathrm{rg} M$. La trace est invariante par similitude (proposition 14). 
    $$\boxed{M^{2} = M \implies \operatorname{tr} M = \mathrm{rg} M \in \mathbb{N}}$$

    **2.** De même, $S$ est semblable à $\mathrm{diag}(1, \dots, 1, -1, \dots, -1)$, avec $p$ coefficients égaux à $1$ et $q = n - p$ égaux à $-1$. 
    $$\boxed{\operatorname{tr} S = p - q = n - 2q \in \{-n, -n + 2, \dots, n - 2, n\}}$$

    **3.** La matrice $M = \begin{pmatrix} 2 & 3 \\ -1 & -1 \end{pmatrix}$ a pour trace $1$ et vérifie $2 \times (-1) - 3 \times (-1) = 1 \neq 0$, donc elle est inversible et de rang $2$ (proposition 9). Ce n'est pas un projecteur, puisque $\operatorname{tr} M \neq \mathrm{rg} M$. Ce n'est pas une symétrie, puisque sa trace $1$ n'a pas la parité de $n = 2$. On le confirme par le calcul : $M^{2} = \begin{pmatrix} 1 & 3 \\ -1 & -2 \end{pmatrix}$ n'est égale ni à $M$ ni à $I_{2}$.

    *Piège.* La condition sur la trace est nécessaire, mais pas suffisante : la matrice $E_{12}$ a une trace nulle, donc paire, et n'est pas une symétrie.
- id: "ma-16-41"
