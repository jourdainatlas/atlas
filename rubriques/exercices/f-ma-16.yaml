  page_enonce: 9
  page_corrige: 18
  enonce: |
    On suppose qu'il existe $A$, $B \in \mathcal{M}_{2}(\mathbb{R})$ et deux réels $x \leqslant y$ tels que 
    $$AB = \begin{pmatrix} 25 & 11 \\ 11 & 5 \end{pmatrix} \qquad\text{et}\qquad BA = \begin{pmatrix} x & 14 \\ 14 & y \end{pmatrix}.$$

    **1.** Montrer que $x + y = 30$.

    **2.** En calculant de deux façons $\operatorname{tr}(ABAB)$, montrer que $x^{2} + y^{2} = 500$.

    **3.** En déduire $x$ et $y$.
  corrige: |
    **1.** Par la proposition 14, $\operatorname{tr}(BA) = \operatorname{tr}(AB)$, soit $x + y = 25 + 5 = 30$.

    **2.** D'une part, $\operatorname{tr}(ABAB) = \operatorname{tr}\big((AB)^{2}\big) = 25^{2} + 11^{2} + 11^{2} + 5^{2} = 892$. D'autre part, la proposition 14 appliquée à $A$ et $BAB$ donne $\operatorname{tr}(ABAB) = \operatorname{tr}(BABA) = \operatorname{tr}\big((BA)^{2}\big) = x^{2} + 2 \times 14^{2} + y^{2}$. Donc $x^{2} + y^{2} = 892 - 392 = 500$.

    **3.** On en déduit $2xy = (x + y)^{2} - (x^{2} + y^{2}) = 400$ : $x$ et $y$ sont les racines de 
    $$t^{2} - 30t + 200 = (t - 10)(t - 20).$$

    $$\boxed{x = 10, \qquad y = 20}$$
     *À retenir.* Les matrices $AB$ et $BA$ ne sont pas égales en général, mais elles ont la même trace, ainsi que leurs carrés. Pour des matrices d'ordre $2$, cela suffit ici à déterminer les coefficients manquants.
- id: "ma-16-43"
  feuille: "f-ma-16"
  numero: 43
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [changements de bases, rang, matrices semblables, trace]
  noeuds: [v-matrices, v-rang, v-trace]
  notions: [matrice-passage, rang-matrice, matrices-semblables, trace]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    **1.** Montrer qu'une matrice $M \in \mathcal{M}_{n,p}(\mathbb{K})$ est de rang $1$ si et seulement s'il existe deux colonnes non nulles $X \in \mathbb{K}^{n}$ et $Y \in \mathbb{K}^{p}$ telles que $M = X{Y}^{T}$.

    **2.** Soit $M \in \mathcal{M}_{n}(\mathbb{K})$ de rang $1$. Montrer que $M^{2} = \operatorname{tr}(M)\,M$.

    **3.** En déduire que $M$ est semblable à $\operatorname{tr}(M)E_{11}$ si $\operatorname{tr}(M) \neq 0$, et à $E_{12}$ sinon.
  corrige: |
    **1.** Si $M = X{Y}^{T}$ avec $X$, $Y$ non nulles, la $j$-ième colonne de $M$ est $y_{j}X$ : toutes les colonnes sont proportionnelles à $X$, et l'une au moins est non nulle, donc $\mathrm{rg} M = 1$. Réciproquement, si $\mathrm{rg} M = 1$, l'image de $M$ est une droite $\mathbb{K} X$, et chaque colonne s'écrit $y_{j}X$ ; la colonne $Y = (y_{j})$ n'est pas nulle, puisque $M \neq 0$, et $M = X{Y}^{T}$.

    **2.** Le produit ${Y}^{T}X$ est un scalaire $s$, et $\operatorname{tr}(M) = \operatorname{tr}(X{Y}^{T}) = \operatorname{tr}({Y}^{T}X) = s$ (proposition 14). Par associativité, 
    $$M^{2} = X({Y}^{T}X){Y}^{T} = s\,X{Y}^{T}, \qquad \text{d'où} \qquad \boxed{M^{2} = \operatorname{tr}(M)\,M}$$

    **3.** Si $t = \operatorname{tr} M \neq 0$, la matrice $\frac{1}{t}M$ est un projecteur de rang $1$ ; par l'exercice 40, elle est semblable à $E_{11}$, et $M$ est semblable à $tE_{11}$. Si $\operatorname{tr} M = 0$, alors $M^{2} = 0$. On reprend la méthode de l'exercice 35 : on choisit $v_{1}$ tel que $v_{2} = Mv_{1} \neq 0$ ; le vecteur $v_{2}$ appartient au noyau, de dimension $n - 1$, et l'on complète $v_{2}$ en une base $(v_{2}, \dots, v_{n})$ de ce noyau. La famille $(v_{1}, \dots, v_{n})$ est une base, puisque $v_{1} \notin \mathrm{Ker}\, M$, et la matrice de $M$ y vaut $E_{21}$, elle-même semblable à $E_{12}$ (exercice 37). 
    $$\boxed{\mathrm{rg} M = 1 \implies M \sim \operatorname{tr}(M)E_{11} \text{ si } \operatorname{tr} M \neq 0, \qquad M \sim E_{12} \text{ si } \operatorname{tr} M = 0}$$
     *À retenir.* Une matrice de rang $1$ est entièrement décrite, à similitude près, par un seul nombre : sa trace.
- id: "ma-16-44"
  feuille: "f-ma-16"
