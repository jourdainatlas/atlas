  enonce: |
    On pose 
    $$A = \begin{pmatrix} 1 & -4 & -3 & -2 & -2 \\ 2 & -6 & -6 & -4 & -2 \\ -3 & 12 & 12 & 6 & 3 \\ 0 & 2 & 3 & 0 & -1 \end{pmatrix}.$$
     Déterminer le rang $r$ de $A$, puis des matrices inversibles $Q$ et $P$ telles que $A = QJ_{r}P^{-1}$.
  corrige: |
    L'échelonnement de $A$ par opérations sur les lignes conduit à la forme échelonnée réduite 
    $$\begin{pmatrix} 1 & 0 & 0 & -2 & -1 \\ 0 & 1 & 0 & 0 & 1 \\ 0 & 0 & 1 & 0 & -1 \\ 0 & 0 & 0 & 0 & 0 \end{pmatrix},$$
     qui a trois pivots : $r = 3$ (théorème 8). Elle donne aussi une base du noyau, de dimension $5 - 3 = 2$ : $k_{1} = (2, 0, 0, 1, 0)$ et $k_{2} = (1, -1, 1, 0, 1)$.

    On suit la preuve du théorème 5. On complète $(k_{1}, k_{2})$ par $e_{1}$, $e_{2}$, $e_{3}$, et l'on note $P$ la matrice de colonnes $e_{1}$, $e_{2}$, $e_{3}$, $k_{1}$, $k_{2}$, qui est inversible car ses deux dernières lignes forment $I_{2}$ dans les deux dernières colonnes. Les vecteurs $Ae_{1}$, $Ae_{2}$, $Ae_{3}$, colonnes de $A$, sont libres, puisque le rang vaut $3$ ; on les complète par $e_{4}$ pour former $Q$. Alors $AP = QJ_{3}$, puisque $AP$ a pour colonnes $Ae_{1}$, $Ae_{2}$, $Ae_{3}$, $0$, $0$. 
    $$\boxed{r = 3, \qquad Q = \begin{pmatrix} 1 & -4 & -3 & 0 \\ 2 & -6 & -6 & 0 \\ -3 & 12 & 12 & 0 \\ 0 & 2 & 3 & 1 \end{pmatrix}, \qquad P = \begin{pmatrix} 1 & 0 & 0 & 2 & 1 \\ 0 & 1 & 0 & 0 & -1 \\ 0 & 0 & 1 & 0 & 1 \\ 0 & 0 & 0 & 1 & 0 \\ 0 & 0 & 0 & 0 & 1 \end{pmatrix}}$$
     Un calcul direct confirme $QJ_{3}P^{-1} = A$ et $\mathrm{rg} Q = 4$.
- id: "ma-16-42"
  feuille: "f-ma-16"
  numero: 42
  partie: "Changements de bases, équivalence et similitude"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [changements de bases, trace]
