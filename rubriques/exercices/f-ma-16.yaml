  enonce: |
    Dire si les matrices suivantes sont inversibles, et calculer leur inverse le cas échéant, par la méthode de Gauss-Jordan. 
    $$A = \begin{pmatrix} 1 & 1 & 2 \\ 1 & 2 & 1 \\ 2 & 1 & 1 \end{pmatrix}, \quad B = \begin{pmatrix} 0 & 1 & 2 \\ 1 & 1 & 2 \\ 0 & 2 & 3 \end{pmatrix}, \quad C = \begin{pmatrix} 1 & 4 & 7 \\ 2 & 5 & 8 \\ 3 & 6 & 9 \end{pmatrix}, \quad D = \begin{pmatrix} \mathrm{i} & -1 & 2\mathrm{i} \\ 2 & 0 & 2 \\ -1 & 0 & 1 \end{pmatrix}.$$
  corrige: |
    On applique les mêmes opérations sur les lignes à $A$ et à $I_{3}$, jusqu'à transformer $A$ en $I_{3}$ ; la matrice obtenue à droite est alors $A^{-1}$, puisque le produit des matrices d'opérations élémentaires utilisées vaut $A^{-1}$ (proposition 16). Pour $A$, les opérations $L_{2} \leftarrow L_{2} - L_{1}$, $L_{3} \leftarrow L_{3} - 2L_{1}$, puis $L_{3} \leftarrow L_{3} + L_{2}$ font apparaître les pivots $1$, $1$, $-4$, et la remontée conduit à 
    $$\boxed{A^{-1} = \frac{1}{4}\begin{pmatrix} -1 & -1 & 3 \\ -1 & 3 & -1 \\ 3 & -1 & -1 \end{pmatrix}}$$
     Pour $B$, on échange d'abord $L_{1}$ et $L_{2}$, le premier coefficient de $L_{1}$ étant nul : 
    $$\boxed{B^{-1} = \begin{pmatrix} -1 & 1 & 0 \\ -3 & 0 & 2 \\ 2 & 0 & -1 \end{pmatrix}}$$
     Pour $C$, l'échelonnement fait apparaître une ligne nulle à la troisième étape : $C$ est de rang $2$, et ses colonnes vérifient $C_{1} - 2C_{2} + C_{3} = 0$. 
    $$\boxed{C \text{ non inversible}, \quad \mathrm{rg} C = 2, \quad \mathrm{Ker}\, C = \mathbb{K}(1, -2, 1)}$$
     Pour $D$, on prend comme premier pivot le coefficient $-1$ de la troisième ligne, pour éviter les divisions par $\mathrm{i}$ : 
    $$\boxed{D^{-1} = \begin{pmatrix} 0 & \frac{1}{4} & -\frac{1}{2} \\ -1 & \frac{3\mathrm{i}}{4} & \frac{\mathrm{i}}{2} \\ 0 & \frac{1}{4} & \frac{1}{2} \end{pmatrix}}$$
     Chaque inverse a été contrôlé par le calcul du produit avec la matrice de départ.

    *Piège.* L'erreur la plus répandue dans la méthode de Gauss-Jordan est de mélanger opérations sur les lignes et opérations sur les colonnes : on n'utilise que des opérations sur les lignes, appliquées simultanément aux deux matrices.
- id: "ma-16-48"
  feuille: "f-ma-16"
  numero: 48
  partie: "Opérations élémentaires et systèmes linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: [opérations élémentaires et systèmes, matrices inversibles]
  noeuds: [v-rang, v-matrices]
  notions: [rang-matrice, matrice-inversible, groupe-lineaire]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    **1.** Pour quelles valeurs du réel $m$ la matrice $\begin{pmatrix} 1 & 1 & m \\ 1 & m & 1 \\ m & 1 & 1 \end{pmatrix}$ est-elle inversible ?

    **2.** Pour quelles valeurs du réel $t$ la matrice $A_{t} = \begin{pmatrix} 1 & 0 & t \\ 2 & 1 & 0 \\ 0 & 1 & 1 \end{pmatrix}$ est-elle inversible ? Calculer alors $A_{t}^{-1}$.
  corrige: |
    **1.** Les opérations $L_{2} \leftarrow L_{2} - L_{1}$ et $L_{3} \leftarrow L_{3} - mL_{1}$, puis $L_{3} \leftarrow L_{3} + L_{2}$, donnent la matrice échelonnée 
    $$\begin{pmatrix} 1 & 1 & m \\ 0 & m - 1 & 1 - m \\ 0 & 0 & (1 - m)(2 + m) \end{pmatrix}.$$
     Si $m = 1$, toutes les lignes sont égales et le rang vaut $1$. Sinon, la matrice est inversible si et seulement si le troisième pivot est non nul. 
    $$\boxed{\text{inversible} \iff m \notin \{1, -2\}}$$
     Pour $m = -2$, on voit d'ailleurs que la somme des trois lignes est nulle.

    **2.** Les opérations $L_{2} \leftarrow L_{2} - 2L_{1}$, puis $L_{3} \leftarrow L_{3} - L_{2}$, donnent les pivots $1$, $1$, $1 + 2t$. La méthode de Gauss-Jordan donne ensuite l'inverse. 
    $$\boxed{A_{t} \text{ inversible} \iff t \neq -\frac{1}{2}, \qquad A_{t}^{-1} = \frac{1}{2t + 1}\begin{pmatrix} 1 & t & -t \\ -2 & 1 & 2t \\ 2 & -1 & 1 \end{pmatrix}}$$
- id: "ma-16-49"
  feuille: "f-ma-16"
  numero: 49
