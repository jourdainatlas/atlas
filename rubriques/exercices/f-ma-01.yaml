  enonce: |
    **1.** Montrer que pour tout $n \in \mathbb{N}$, il existe deux entiers naturels $a_{n}$ et $b_{n}$ tels que $(3 + 2\sqrt{2})^{n} = a_{n} + b_{n}\sqrt{2}$. On exprimera $a_{n+1}$ et $b_{n+1}$ en fonction de $a_{n}$ et $b_{n}$.

    **2.** Montrer que, pour tout $n \in \mathbb{N}$, $(3 - 2\sqrt{2})^{n} = a_{n} - b_{n}\sqrt{2}$.

    **3.** En déduire qu'il existe une infinité de couples $(x,y) \in \mathbb{N}^{2}$ tels que $x^{2} - 2y^{2} = 1$. Donner les trois premiers.
  corrige: |
    **1.** Par récurrence sur $n$. Pour $n = 0$, $(3 + 2\sqrt{2})^{0} = 1 + 0\sqrt{2}$ : $a_{0} = 1$, $b_{0} = 0$. Si $(3 + 2\sqrt{2})^{n} = a_{n} + b_{n}\sqrt{2}$ avec $a_{n}$, $b_{n}$ entiers naturels, alors 
    $$(3 + 2\sqrt{2})^{n+1} = (a_{n} + b_{n}\sqrt{2})(3 + 2\sqrt{2}) = (3a_{n} + 4b_{n}) + (2a_{n} + 3b_{n})\sqrt{2}.$$

    $$\boxed{a_{n+1} = 3a_{n} + 4b_{n} \qquad b_{n+1} = 2a_{n} + 3b_{n}}$$
     sont bien des entiers naturels.

    **2.** On démontre de même, par récurrence, que $(3 - 2\sqrt{2})^{n} = a_{n} - b_{n}\sqrt{2}$ : c'est vrai pour $n = 0$, et si c'est vrai au rang $n$, alors $(a_{n} - b_{n}\sqrt{2})(3 - 2\sqrt{2}) = (3a_{n} + 4b_{n}) - (2a_{n} + 3b_{n})\sqrt{2} = a_{n+1} - b_{n+1}\sqrt{2}$, avec les mêmes relations de récurrence.

    **3.** En multipliant les deux égalités, et comme $(3 + 2\sqrt{2})(3 - 2\sqrt{2}) = 9 - 8 = 1$ : 
    $$a_{n}^{2} - 2b_{n}^{2} = (a_{n} + b_{n}\sqrt{2})(a_{n} - b_{n}\sqrt{2}) = 1^{n} = 1.$$
     Il reste à voir que ces couples sont deux à deux distincts. Par récurrence, $a_{n} \geqslant 1$ pour tout $n$, donc $a_{n+1} \geqslant 3a_{n} > a_{n}$ : la suite $(a_{n})$ est strictement croissante. 
    $$\boxed{(1,0),\ (3,2),\ (17,12),\ (99,70),\ \dots \text{ sont des solutions de } x^{2} - 2y^{2} = 1, \text{ en nombre infini.}}$$
     Vérification : $17^{2} - 2 \times 12^{2} = 289 - 288 = 1$. ✓ On remarquera que $\frac{17}{12} \approx 1{,}4167$ et $\frac{99}{70} \approx 1{,}41429$ approchent $\sqrt{2} \approx 1{,}41421$ : comme $\frac{a_{n}}{b_{n}} - \sqrt{2} = \frac{1}{b_{n}(a_{n} + b_{n}\sqrt{2})}$, ces fractions en sont des approximations remarquablement précises. On montre en arithmétique que ce sont *toutes* les solutions dans $\mathbb{N}^{2}$.
- id: "ma-01-22"
  feuille: "f-ma-01"
  numero: 22
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de raisonnement, récurrence, divisibilité]
  noeuds: [l-connecteurs, n-recurrence, z-division]
  notions: []
  page_enonce: 7
  page_corrige: 16
  enonce: |
    ![Figure](documents/figures/986c5f45da081347.svg)

    Le jeu des *tours de Hanoï* se joue avec trois piquets et $n$ disques percés de tailles deux à deux distinctes. Au départ, les $n$ disques sont empilés sur le premier piquet, du plus grand en bas au plus petit en haut (figure, pour $n = 3$). Un coup consiste à déplacer le disque situé au sommet d'un piquet vers un autre piquet, à condition de ne jamais poser un disque sur un disque plus petit. Le but est d'amener tous les disques sur le troisième piquet.

    **1.** Montrer que, pour tout $n \geqslant 1$, le jeu peut être résolu.

    **2.** Déterminer, en le démontrant, le nombre minimal de coups nécessaires.
  corrige: |
    **1.** Montrons par récurrence sur $n \geqslant 1$ l'assertion $P(n)$ : « on peut déplacer une pile de $n$ disques d'un piquet à n'importe quel autre, en respectant les règles ». Il est commode de l'énoncer pour deux piquets quelconques, et de remarquer qu'on peut ignorer des disques plus grands posés sous la pile, puisque tout disque peut être posé sur eux.

    **Initialisation :** Un seul disque se déplace en un coup.

    **Hérédité :** Supposons $P(n)$ et considérons une pile de $n + 1$ disques sur le piquet $i$, à déplacer vers le piquet $j$, le troisième piquet étant $k$. On déplace les $n$ disques supérieurs de $i$ vers $k$, ce qui est possible par $P(n)$, le grand disque restant immobile sous eux ; on déplace le grand disque de $i$ vers $j$ ; puis on déplace les $n$ disques de $k$ vers $j$, à nouveau par $P(n)$, sur le grand disque.

    **Conclusion :** Le jeu peut être résolu pour tout $n \geqslant 1$.

    **2.** Notons $m_{n}$ le nombre minimal de coups pour déplacer $n$ disques d'un piquet à un autre. La stratégie précédente utilise $2m_{n} + 1$ coups pour $n + 1$ disques, donc $m_{n+1} \leqslant 2m_{n} + 1$. Inversement, dans toute solution pour $n + 1$ disques, considérons le premier déplacement du grand disque, de $i$ vers $j$. À ce moment, aucun disque n'est au-dessus de lui sur $i$ ni sur $j$ : les $n$ petits disques sont tous sur le troisième piquet, et il a fallu au moins $m_{n}$ coups pour les y amener. Après le dernier déplacement du grand disque, il faut encore au moins $m_{n}$ coups pour reposer les $n$ petits disques sur lui. D'où $m_{n+1} \geqslant m_{n} + 1 + m_{n}$, et finalement $m_{n+1} = 2m_{n} + 1$, avec $m_{1} = 1$. On vérifie alors par récurrence que $m_{n} = 2^{n} - 1$ : c'est vrai pour $n = 1$, et $2(2^{n} - 1) + 1 = 2^{n+1} - 1$. 
    $$\boxed{\text{Le nombre minimal de coups est } 2^{n} - 1.}$$
     Pour $n = 3$, il faut $7$ coups, et pour $n = 64$, la légende qui accompagne le jeu imagine des moines déplaçant un disque par seconde : il leur faudrait $2^{64} - 1 \approx 1{,}8 \times 10^{19}$ secondes, soit plus de $500$ milliards d'années.
- id: "ma-01-23"
  feuille: "f-ma-01"
