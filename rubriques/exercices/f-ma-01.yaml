  noeuds: [zf-operations, z-division, zf-ext, r-familles, zf-parties]
  notions: [ensemble, famille, ensemble-parties]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    **1.** Montrer que $\displaystyle\bigcup_{x \in [0,1]} \,]x - 1\,,x + 1[\ = \ ]-1\,,2[$, puis déterminer $\displaystyle\bigcap_{x \in [0,1]} \,]x - 1\,,x + 1[$.

    **2.** Soit $(E_{n})_{n \in \mathbb{N}}$ une famille de parties de $\mathbb{R}$. On définit ses limites inférieure et supérieure par 
    $$\liminf E_{n} = \bigcup_{n \in \mathbb{N}}\ \bigcap_{k \geqslant n} E_{k} \qquad\text{et}\qquad \limsup E_{n} = \bigcap_{n \in \mathbb{N}}\ \bigcup_{k \geqslant n} E_{k}.$$

    **(a)** Traduire avec des quantificateurs, puis en français, l'appartenance d'un réel $x$ à $\liminf E_{n}$ et à $\limsup E_{n}$. En déduire que $\liminf E_{n} \subset \limsup E_{n}$.

    **(b)** Déterminer $\liminf E_{n}$ et $\limsup E_{n}$ lorsque $E_{n} = [n\,,+\infty[$ pour tout $n$, puis lorsque $E_{n} = \big[(-1)^{n}\,n\,,+\infty\big[$.

    **(c)** Déterminer $\liminf E_{n}$ et $\limsup E_{n}$ lorsque $E_{n} = A$ pour $n$ pair et $E_{n} = B$ pour $n$ impair, où $A$ et $B$ sont deux parties de $\mathbb{R}$.
  corrige: |
    **1.** *Réunion.* Si $y \in \,]x - 1\,,x + 1[$ avec $x \in [0\,,1]$, alors $-1 \leqslant x - 1 < y < x + 1 \leqslant 2$, donc $y \in \,]-1\,,2[$. Réciproquement, soit $y \in \,]-1\,,2[$. Si $y < 1$, alors $y \in \,]-1\,,1[$, qui correspond à $x = 0$ ; si $y \geqslant 1$, alors $y \in \,]0\,,2[$, qui correspond à $x = 1$.

    *Intersection.* Un réel $y$ appartient à tous les intervalles si et seulement si $x - 1 < y < x + 1$ pour tout $x \in [0\,,1]$, c'est-à-dire si $y > x - 1$ pour tout $x \in [0,1]$, soit $y > 0$ (la condition pour $x = 1$ est la plus forte), et $y < x + 1$ pour tout $x \in [0,1]$, soit $y < 1$ (condition pour $x = 0$). 
    $$\boxed{\bigcup_{x \in [0,1]} \,]x - 1\,,x + 1[\ = \ ]-1\,,2[ \qquad \bigcap_{x \in [0,1]} \,]x - 1\,,x + 1[\ = \ ]0\,,1[}$$

    **2. (a)** En revenant à la définition de la réunion et de l'intersection d'une famille : 
    $$x \in \liminf E_{n} \iff \exists n \in \mathbb{N},\ \forall k \geqslant n,\ x \in E_{k} \qquad x \in \limsup E_{n} \iff \forall n \in \mathbb{N},\ \exists k \geqslant n,\ x \in E_{k}.$$
     Autrement dit, $x$ appartient à $\liminf E_{n}$ s'il appartient à *tous les $E_{k}$ à partir d'un certain rang*, et à $\limsup E_{n}$ s'il appartient à *une infinité* de $E_{k}$ : pour tout rang $n$, on trouve un $E_{k}$ plus loin qui le contient. Si $x$ appartient à tous les $E_{k}$ pour $k \geqslant n_{0}$, alors pour tout $n$, l'indice $k = \max(n,n_{0})$ vérifie $k \geqslant n$ et $x \in E_{k}$. 
    $$\boxed{\liminf E_{n} \subset \limsup E_{n}}$$
     C'est l'implication « $\exists \forall \Rightarrow \forall \exists$ » du cours, appliquée aux rangs.

    **2. (b)** Pour $E_{n} = [n\,,+\infty[$ : aucun réel $x$ n'appartient à une infinité de $E_{k}$, puisque $x \notin E_{k}$ dès que $k > x$. Donc $\limsup E_{n} = \varnothing$, et $\liminf E_{n} = \varnothing$ par la question (a).

    Pour $E_{n} = [(-1)^{n} n\,,+\infty[$ : on a $E_{n} = [n\,,+\infty[$ pour $n$ pair et $E_{n} = [-n\,,+\infty[$ pour $n$ impair. Un réel $x$ appartient à tous les $E_{k}$ impairs tels que $k \geqslant -x$, donc à une infinité d'entre eux ; mais il n'appartient pas aux $E_{k}$ pairs tels que $k > x$, donc pas à tous les $E_{k}$ à partir d'un certain rang. 
    $$\boxed{E_{n} = [n\,,+\infty[ : \ \liminf = \limsup = \varnothing \qquad E_{n} = [(-1)^{n} n\,,+\infty[ : \ \liminf = \varnothing,\ \limsup = \mathbb{R}}$$

    **2. (c)** Un réel appartient à tous les $E_{k}$ à partir d'un certain rang si et seulement s'il appartient à $A$ et à $B$ ; il appartient à une infinité de $E_{k}$ si et seulement s'il appartient à $A$ ou à $B$, car chacun des deux ensembles revient une infinité de fois. 
    $$\boxed{\liminf E_{n} = A \cap B \qquad \limsup E_{n} = A \cup B}$$
     Ainsi l'inclusion de la question (a) peut être stricte. Ces notions reviendront en probabilités, où $\limsup E_{n}$ est l'événement « une infinité des événements $E_{n}$ se réalisent ».
- id: "ma-01-33"
  feuille: "f-ma-01"
  numero: 33
  partie: "Ensembles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [ensembles, contre-exemple, inclusion, opérations sur les parties]
  noeuds: [zf-operations, zf-ext]
  notions: [ensemble]
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Soit $A$, $B$, $C$ trois parties d'un ensemble $E$. Démontrer ou réfuter chacune des affirmations suivantes ; une affirmation fausse sera réfutée par un contre-exemple aussi simple que possible.

    **1.** Si $A \cap B = A \cup B$, alors $A = B$.

    **2.** Si $A \cup B \subset A \cap C$, alors $B \subset A \subset C$.

    **3.** Si $A \cap B \subset A \cap C$ et $A \cup B \subset A \cup C$, alors $B \subset C$. L'une des deux hypothèses suffit-elle ?

    **4.** Si $C \subset A \cup B$, alors $C \subset A$ ou $C \subset B$.

    **5.** $A \setminus (B \cup C) = (A \setminus B) \cap (A \setminus C)$.

    **6.** $A \setminus (B \setminus C) = (A \setminus B) \setminus C$.

    **7.** Si $D$ est une quatrième partie de $E$ telle que $A \subset C$, $B \subset D$, $C \cap D = \varnothing$ et $A \cup B = C \cup D$, alors $A = C$ et $B = D$.

    Déterminer enfin une condition nécessaire et suffisante portant sur $A$ et $C$ pour que l'égalité $(A \cup B) \cap C = A \cup (B \cap C)$ soit vraie pour toute partie $B$ de $E$.
  corrige: |
    **1.** **Vraie.** On a $A \subset A \cup B = A \cap B \subset B$, et de même $B \subset A \cup B = A \cap B \subset A$. 
    $$\boxed{A = B}$$

    **2.** **Vraie.** On a $B \subset A \cup B \subset A \cap C \subset A$, et $A \subset A \cup B \subset A \cap C \subset C$. 
    $$\boxed{B \subset A \subset C}$$

    **3.** **Vraie.** Soit $x \in B$ ; on distingue deux cas. Si $x \in A$, alors $x \in A \cap B \subset A \cap C$, donc $x \in C$. Si $x \notin A$, alors $x \in A \cup B \subset A \cup C$ et $x \notin A$, donc $x \in C$. 
    $$\boxed{B \subset C}$$
     Aucune des deux hypothèses ne suffit seule. Prenons $E = \{1\}$. Avec $A = C = \varnothing$ et $B = \{1\}$, on a $A \cap B = \varnothing \subset A \cap C$ mais $B \not\subset C$. Avec $A = B = \{1\}$ et $C = \varnothing$, on a $A \cup B = \{1\} \subset A \cup C$ mais $B \not\subset C$. 
    $$\boxed{\text{Les deux hypothèses sont nécessaires.}}$$

    **4.** **Fausse.** Prenons $E = \{1,2\}$, $A = \{1\}$, $B = \{2\}$ et $C = \{1,2\}$ : on a $C \subset A \cup B$, mais $C$ n'est inclus ni dans $A$ ni dans $B$. 
    $$\boxed{\text{Contre-exemple : } A = \{1\},\ B = \{2\},\ C = \{1,2\}}$$
     *Piège :* l'erreur consiste à « distribuer » le quantificateur universel sur le « ou ». Chaque élément de $C$ est dans $A$ ou dans $B$, mais pas forcément tous dans la même partie.

    **5.** **Vraie.** Pour tout $x \in E$, d'après une loi de De Morgan : 
    $$x \in A \setminus (B \cup C) \Leftrightarrow x \in A \ \mathrm{et}\ x \notin B \ \mathrm{et}\ x \notin C \Leftrightarrow (x \in A \ \mathrm{et}\ x \notin B) \ \mathrm{et}\ (x \in A \ \mathrm{et}\ x \notin C)$$

    $$\boxed{A \setminus (B \cup C) = (A \setminus B) \cap (A \setminus C)}$$

    **6.** **Fausse.** Pour $A = B = C = \{1\}$, le membre de gauche vaut $\{1\} \setminus \varnothing = \{1\}$, celui de droite $\varnothing \setminus \{1\} = \varnothing$. 
    $$\boxed{\text{Contre-exemple : } A = B = C = \{1\}}$$
     La formule correcte est $A \setminus (B \setminus C) = (A \setminus B) \cup (A \cap C)$ : en retirant moins d'éléments, on en conserve davantage.

    **7.** **Vraie.** On sait déjà que $A \subset C$. Soit $x \in C$. Alors $x \in C \cup D = A \cup B$. Si l'on avait $x \in B$, on aurait $x \in D$ puisque $B \subset D$, donc $x \in C \cap D = \varnothing$ : c'est impossible. Donc $x \in A$, et $C \subset A$. On montre de même que $D \subset B$. 
    $$\boxed{A = C \text{ et } B = D}$$

    **Condition nécessaire et suffisante.** Montrons que l'égalité est vraie pour toute partie $B$ si et seulement si $A \subset C$. 
    $$\boxed{\forall B \in \mathcal{P}(E),\ (A \cup B) \cap C = A \cup (B \cap C) \quad\Longleftrightarrow\quad A \subset C}$$
     Si l'égalité est vraie pour tout $B$, elle l'est pour $B = \varnothing$, ce qui donne $A \cap C = A$, c'est-à-dire $A \subset C$. Réciproquement, si $A \subset C$, la distributivité donne $(A \cup B) \cap C = (A \cap C) \cup (B \cap C) = A \cup (B \cap C)$.

    *À retenir :* pour obtenir une condition nécessaire à partir d'un énoncé valable « pour tout $B$ », on choisit une valeur particulière de $B$ qui le simplifie : c'est l'étape d'analyse d'une analyse-synthèse.
- id: "ma-01-34"
  feuille: "f-ma-01"
  numero: 34
  partie: "Ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles, quantificateurs, inclusion, opérations sur les parties, ensemble des parties]
  noeuds: [zf-operations, l-syntaxe, zf-ext, zf-parties]
  notions: [ensemble, quantificateur, ensemble-parties]
  page_enonce: 10
  page_corrige: 25
  enonce: |
    Soit $E$ un ensemble. Démontrer les équivalences suivantes.

    **1.** Pour tous $x$, $y$ de $E$ : $x = y \Leftrightarrow \big(\forall A \in \mathcal{P}(E),\ x \in A \Rightarrow y \in A\big)$.

    **2.** Pour toutes parties $A$, $B$ de $E$ : $A \subset B \Leftrightarrow \big(\forall X \in \mathcal{P}(E),\ A \cap X \subset B \cap X\big)$.

    **3.** Pour toutes parties $A$, $B$ de $E$, donner une assertion simple équivalente à chacune des deux suivantes : 
    $$\text{(a)}\ \ \exists X \in \mathcal{P}(E) \setminus \{\varnothing\},\ A \cap X = \varnothing \qquad\qquad \text{(b)}\ \ \forall X \in \mathcal{P}(E),\ X \cap A \neq \varnothing \Rightarrow X \cap B \neq \varnothing.$$

    **4.** Pour toutes parties $A$, $B$ de $\mathbb{N}$ : 
    $$A = B \Leftrightarrow \big(\forall n \in \mathbb{N},\ A \cup \{n\} = B \cup \{n\}\big) \qquad\text{et}\qquad A = B \Leftrightarrow \big(\forall n \in \mathbb{N},\ A \cap [\![0\,;n]\!] = B \cap [\![0\,;n]\!]\big).$$
     La seconde équivalence reste-t-elle vraie si l'on remplace les deux intersections par des réunions ?
  corrige: |
    **1.** Si $x = y$, l'implication $x \in A \Rightarrow y \in A$ est vraie pour toute partie $A$. Réciproquement, appliquons l'hypothèse à la partie $A = \{x\}$ : comme $x \in \{x\}$, on obtient $y \in \{x\}$, c'est-à-dire $y = x$. 
    $$\boxed{x = y \iff \big(\forall A \in \mathcal{P}(E),\ x \in A \Rightarrow y \in A\big)}$$
     Deux éléments sont égaux dès qu'ils ne peuvent être séparés par aucune partie, et le singleton $\{x\}$ est la partie qui réalise le test.

    **2.** Si $A \subset B$, alors pour tout $X$, un élément de $A \cap X$ est dans $A$, donc dans $B$, et dans $X$ : il est dans $B \cap X$. Réciproquement, l'hypothèse appliquée à $X = E$ donne $A \cap E \subset B \cap E$, c'est-à-dire $A \subset B$. 
    $$\boxed{A \subset B \iff \big(\forall X \in \mathcal{P}(E),\ A \cap X \subset B \cap X\big)}$$

    **3. (a)** Si $A \neq E$, il existe $x \in E \setminus A$, et $X = \{x\}$ est une partie non vide disjointe de $A$. Réciproquement, si $A = E$, toute partie non vide $X$ vérifie $A \cap X = X \neq \varnothing$. 
    $$\boxed{\text{(a)} \iff A \neq E}$$

    **3. (b)** Si $A \subset B$ et $X \cap A \neq \varnothing$, un élément de $X \cap A$ est dans $X \cap B$. Réciproquement, supposons (b) et soit $x \in A$. Pour $X = \{x\}$, on a $X \cap A \neq \varnothing$, donc $X \cap B \neq \varnothing$, c'est-à-dire $x \in B$. 
    $$\boxed{\text{(b)} \iff A \subset B}$$

    **4.** Dans les deux cas, le sens direct est immédiat ; montrons les sens réciproques par contraposée. Supposons $A \neq B$ ; quitte à échanger $A$ et $B$, il existe $a \in A \setminus B$.

    • Pour $n = a + 1 \neq a$, l'élément $a$ appartient à $A \cup \{n\}$ mais pas à $B \cup \{n\}$.

    • Pour $n = a$, l'élément $a$ appartient à $A \cap [\![0\,;a]\!]$ mais pas à $B \cap [\![0\,;a]\!]$.

    $$\boxed{\text{Les deux équivalences sont vraies.}}$$
     Avec des réunions, l'équivalence devient fausse : pour $A = \{0\}$ et $B = \varnothing$, on a $A \cup [\![0\,;n]\!] = [\![0\,;n]\!] = B \cup [\![0\,;n]\!]$ pour tout $n$, puisque $0 \in [\![0\,;n]\!]$, alors que $A \neq B$. 
    $$\boxed{\text{Avec des réunions, l'équivalence est fausse.}}$$
     *À retenir :* pour montrer qu'une famille de « tests » caractérise une partie, on prend un élément qui distingue les deux parties et l'on choisit le test qui le révèle. La réunion avec $[\![0\,;n]\!]$ efface au contraire l'information contenue dans les petits entiers.
- id: "ma-01-35"
  feuille: "f-ma-01"
  numero: 35
  partie: "Ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles, "raisonnement par l'absurde", suites]
  noeuds: [zf-operations, ar-suites]
  notions: [ensemble, suite]
  page_enonce: 11
  page_corrige: 25
  enonce: |
    **1.** Soit $A$ une partie non vide de $\mathbb{Z}$ telle que, pour tout $n \in \mathbb{Z}$, $n \in A \Rightarrow (n - 1 \in A \ \mathrm{et}\ n + 1 \in A)$. Montrer que $A = \mathbb{Z}$.

    **2.** Montrer que toute suite décroissante d'entiers naturels est stationnaire, c'est-à-dire constante à partir d'un certain rang. On utilisera le fait que toute partie non vide de $\mathbb{N}$ possède un plus petit élément.

    **3.** En déduire qu'il n'existe aucune suite strictement décroissante d'entiers naturels. Ce résultat fonde le raisonnement par *descente infinie* : l'utiliser pour démontrer à nouveau que $\sqrt{2}$ est irrationnel.
  corrige: |
    **1.** Soit $a \in A$. Montrons par récurrence sur $k \in \mathbb{N}$ que $a + k$ et $a - k$ appartiennent à $A$. C'est vrai pour $k = 0$. Si $a + k \in A$, l'hypothèse appliquée à $n = a + k$ donne $a + k + 1 \in A$ ; de même, si $a - k \in A$, elle donne $a - k - 1 \in A$. Tout entier relatif $m$ s'écrit $a + k$ ou $a - k$, avec $k = |m - a| \in \mathbb{N}$. 
    $$\boxed{A = \mathbb{Z}}$$
     L'hypothèse « non vide » est indispensable : la partie vide vérifie trivialement la condition de stabilité.

    **2.** Soit $(u_{n})$ une suite décroissante d'entiers naturels. L'ensemble $\{u_{n} \mid n \in \mathbb{N}\}$ de ses valeurs est une partie non vide de $\mathbb{N}$ ; il possède un plus petit élément, de la forme $u_{n_{0}}$. Pour $n \geqslant n_{0}$, on a $u_{n} \leqslant u_{n_{0}}$ par décroissance, et $u_{n} \geqslant u_{n_{0}}$ par minimalité. 
    $$\boxed{u_{n} = u_{n_{0}} \text{ pour tout } n \geqslant n_{0} : \text{ la suite est stationnaire.}}$$
     Le résultat est faux pour des réels positifs : la suite $\left(\frac{1}{n+1}\right)$ est strictement décroissante. C'est bien la propriété du plus petit élément, propre à $\mathbb{N}$, qui intervient.

    **3.** Une suite strictement décroissante d'entiers naturels serait décroissante, donc stationnaire, ce qui contredit la stricte décroissance.

    Supposons $\sqrt{2} = \frac{p}{q}$, avec $p$, $q$ entiers naturels non nuls. Comme $1 < \sqrt{2} < 2$, on a $q < p < 2q$. Posons $p' = 2q - p$ et $q' = p - q$ : ce sont des entiers naturels non nuls, et $q' < q$. De plus, en utilisant $p^{2} = 2q^{2}$, 
    $$p'^{2} - 2q'^{2} = 4q^{2} - 4pq + p^{2} - 2p^{2} + 4pq - 2q^{2} = 2q^{2} - p^{2} = 0,$$
     donc $\sqrt{2} = \frac{p'}{q'}$. En itérant, on construit une suite strictement décroissante de dénominateurs entiers naturels non nuls : c'est impossible. 
    $$\boxed{\sqrt{2} \text{ est irrationnel.}}$$
     Cette preuve, différente de celle du cours, n'utilise aucune considération de parité.
- id: "ma-01-36"
  feuille: "f-ma-01"
  numero: 36
  partie: "Ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles, opérations sur les parties, ensemble des parties, produit cartésien]
  noeuds: [zf-operations, zf-parties, r-produit]
  notions: [ensemble, ensemble-parties, produit-cartesien]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $E$, $F$ deux ensembles, et $A$, $C$ deux parties de $E$, $B$, $D$ deux parties de $F$.

    **1.** Comparer $\mathcal{P}(E \cap F)$ et $\mathcal{P}(E) \cap \mathcal{P}(F)$, puis $\mathcal{P}(E \cup F)$ et $\mathcal{P}(E) \cup \mathcal{P}(F)$. À quelle condition nécessaire et suffisante ces deux derniers ensembles sont-ils égaux ?

    **2.** Montrer que $(A \times B) \cap (C \times D) = (A \cap C) \times (B \cap D)$.

    **3.** Comparer $(A \times B) \cup (C \times D)$ et $(A \cup C) \times (B \cup D)$, en s'aidant de la figure ci-dessous où $E = F = \mathbb{R}$.

    **4.** Montrer que le disque $\big\{(x,y) \in \mathbb{R}^{2} \mid x^{2} + y^{2} \leqslant 1\big\}$ ne peut pas s'écrire $X \times Y$, avec $X$ et $Y$ deux parties de $\mathbb{R}$.

    ![Figure](documents/figures/4b69031edcead00b.svg)
  corrige: |
    **1.** Pour toute partie $X$ : $X \subset E \cap F \Leftrightarrow (X \subset E \ \mathrm{et}\ X \subset F)$. 
    $$\boxed{\mathcal{P}(E \cap F) = \mathcal{P}(E) \cap \mathcal{P}(F)}$$
     Pour la réunion, une partie de $E$ ou de $F$ est une partie de $E \cup F$, d'où : 
    $$\boxed{\mathcal{P}(E) \cup \mathcal{P}(F) \subset \mathcal{P}(E \cup F)}$$
     Montrons que l'égalité a lieu si et seulement si $E \subset F$ ou $F \subset E$. Si $E \subset F$, alors $E \cup F = F$ et $\mathcal{P}(E) \subset \mathcal{P}(F)$, donc les deux membres valent $\mathcal{P}(F)$ ; de même si $F \subset E$. Réciproquement, raisonnons par contraposition : si ni $E \subset F$ ni $F \subset E$, il existe $a \in E \setminus F$ et $b \in F \setminus E$. La partie $\{a,b\}$ est incluse dans $E \cup F$, mais ni dans $E$ (car $b \notin E$), ni dans $F$ (car $a \notin F$). 
    $$\boxed{\mathcal{P}(E \cup F) = \mathcal{P}(E) \cup \mathcal{P}(F) \Longleftrightarrow (E \subset F \ \mathrm{ou}\ F \subset E)}$$

    **2.** Pour tout couple $(x,y) \in E \times F$ : 
    $$(x,y) \in (A \times B) \cap (C \times D) \Leftrightarrow (x \in A \ \mathrm{et}\ y \in B) \ \mathrm{et}\ (x \in C \ \mathrm{et}\ y \in D) \Leftrightarrow (x \in A \cap C) \ \mathrm{et}\ (y \in B \cap D)$$

    $$\boxed{(A \times B) \cap (C \times D) = (A \cap C) \times (B \cap D)}$$

    **3.** Si $(x,y) \in A \times B$, alors $x \in A \cup C$ et $y \in B \cup D$ ; de même pour $C \times D$. D'où l'inclusion : 
    $$\boxed{(A \times B) \cup (C \times D) \subset (A \cup C) \times (B \cup D)}$$
     La figure montre qu'elle est stricte en général : la réunion des deux carrés ne remplit pas le carré $[0\,,3]^{2}$. Le point $\big(\frac{1}{2}, \frac{5}{2}\big)$, par exemple, appartient à $[0\,,3]^{2}$, mais ni à $A \times B$ (car $\frac{5}{2} > 2$) ni à $C \times D$ (car $\frac{1}{2} < 1$).

    ![Figure](documents/figures/6edb6ac2652c104f.svg)

    Les deux petits carrés teintés de bleu pétrole sont les éléments de $(A \cup C) \times (B \cup D)$ qui manquent à la réunion des deux produits.

    **4.** Supposons que le disque $\mathcal{D}$ s'écrive $X \times Y$. Comme $(1,0) \in \mathcal{D}$, on a $1 \in X$ ; comme $(0,1) \in \mathcal{D}$, on a $1 \in Y$. Donc $(1,1) \in X \times Y = \mathcal{D}$, ce qui est faux puisque $1^{2} + 1^{2} = 2 > 1$. 
    $$\boxed{\text{Le disque n'est pas un produit cartésien de deux parties de } \mathbb{R}.}$$
     *À retenir :* un produit $X \times Y$ a une propriété de « rectangle » : s'il contient $(x,y)$ et $(x',y')$, il contient aussi $(x,y')$. C'est cette propriété, mise en défaut, qui fournit la contradiction.
- id: "ma-01-37"
  feuille: "f-ma-01"
  numero: 37
  partie: "Ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensembles, inclusion, opérations sur les parties, ensemble des parties, produit cartésien]
  noeuds: [zf-operations, zf-ext, zf-parties, r-produit]
  notions: [ensemble, ensemble-parties, produit-cartesien]
  page_enonce: 11
  page_corrige: 27
  enonce: |
    **1.** Soit $A$, $B$, $C$ trois ensembles non vides tels que $A \times B \subset B \times C$. Montrer que $A \subset C$. Le résultat subsiste-t-il si l'on ne suppose plus $B$ non vide ? et $A$ ?

    **2.** Soit $\Omega$ un ensemble et $E$, $F$ deux parties de $\Omega$ telles que $E \times F \subset (F \times \Omega) \cup (\Omega \times E)$. Montrer que $E \subset F$ ou $F \subset E$.
  corrige: |
    **1.** Montrons même que $A \subset B \subset C$. Soit $a \in A$ et $b \in B$, qui existent puisque $A$ et $B$ sont non vides. Le couple $(a,b)$ appartient à $A \times B$, donc à $B \times C$ : ainsi $a \in B$ et $b \in C$. Le premier point, valable pour tout $a \in A$, donne $A \subset B$ ; le second, valable pour tout $b \in B$, donne $B \subset C$. 
    $$\boxed{A \subset B \subset C, \text{ et en particulier } A \subset C.}$$
     Sans l'hypothèse $B \neq \varnothing$, le résultat tombe : pour $A = \{1\}$ et $B = C = \varnothing$, on a $A \times B = \varnothing \subset B \times C$, mais $A \not\subset C$. L'hypothèse $A \neq \varnothing$ est en revanche inutile : si $A$ est vide, l'inclusion $A \subset C$ est vraie. L'hypothèse $C \neq \varnothing$ l'est aussi, car elle découle des deux autres.

    **2.** Raisonnons par l'absurde, en supposant $E \not\subset F$ et $F \not\subset E$. Il existe alors $x \in E \setminus F$ et $y \in F \setminus E$. Le couple $(x,y)$ appartient à $E \times F$, donc à $(F \times \Omega) \cup (\Omega \times E)$ : ainsi $x \in F$ ou $y \in E$, ce qui contredit le choix de $x$ et $y$. 
    $$\boxed{E \subset F \ \mathrm{ou}\ F \subset E}$$
     La négation de « $E \subset F$ ou $F \subset E$ » est « $E \not\subset F$ et $F \not\subset E$ », qui fournit deux éléments témoins : c'est la bonne façon d'aborder une conclusion disjonctive.
- id: "ma-01-38"
  feuille: "f-ma-01"
  numero: 38
  partie: "Ensembles"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [ensembles, quantificateurs, inclusion, opérations sur les parties, produit cartésien]
  noeuds: [zf-operations, l-syntaxe, zf-ext, r-produit]
  notions: [ensemble, quantificateur, produit-cartesien]
  page_enonce: 11
  page_corrige: 27
  enonce: |
    **1.** Pour deux parties $A$ et $B$ de $\mathbb{R}$, on note $A \oplus B = \{a + b \mid (a,b) \in A \times B\}$.

    **(a)** Déterminer $\{0\,,1\} \oplus \{1\,,4\}$, puis $[0\,,1] \oplus [2\,,5]$.

    **(b)** Soit $A$ une partie non vide de $\mathbb{R}$. Montrer que $A \oplus \mathbb{R} = \mathbb{R}$.

    **(c)** Montrer que $(A_{1} \cap A_{2}) \oplus B \subset (A_{1} \oplus B) \cap (A_{2} \oplus B)$ pour toutes parties $A_{1}$, $A_{2}$, $B$ de $\mathbb{R}$. Y a-t-il toujours égalité ?

    **2.** Pour toute partie $P$ de $\mathbb{R}^{2}$, on pose 
    $$\widehat{P} = \big\{x \in \mathbb{R} \mid \exists y \in \mathbb{R},\ (x,y) \in P\big\} \qquad\text{et}\qquad \check{P} = \big\{x \in \mathbb{R} \mid \forall y \in \mathbb{R},\ (x,y) \in P\big\}.$$

    **(a)** Dessiner $H = \{(x,y) \in \mathbb{R}^{2} \mid xy \leqslant 1\}$, puis déterminer $\widehat{H}$ et $\check{H}$. Quelle est l'interprétation géométrique de $\widehat{P}$ ?

    **(b)** Montrer que $\widehat{P \cup Q} = \widehat{P} \cup \widehat{Q}$ et $\widehat{P \cap Q} \subset \widehat{P} \cap \widehat{Q}$ pour toutes parties $P$, $Q$ de $\mathbb{R}^{2}$, et que cette inclusion peut être stricte.

    **(c)** Énoncer et démontrer les propriétés analogues pour $\check{P}$.
  corrige: |
    **1. (a)** On calcule les quatre sommes $0 + 1$, $0 + 4$, $1 + 1$, $1 + 4$. Pour les intervalles, une somme $a + b$ avec $a \in [0,1]$ et $b \in [2,5]$ est dans $[2\,,6]$ ; réciproquement, si $t \in [2\,,5]$, alors $t = 0 + t$, et si $t \in [5\,,6]$, alors $t = (t - 5) + 5$. 
    $$\boxed{\{0\,,1\} \oplus \{1\,,4\} = \{1\,,2\,,4\,,5\} \qquad [0\,,1] \oplus [2\,,5] = [2\,,6]}$$

    **1. (b)** L'inclusion $A \oplus \mathbb{R} \subset \mathbb{R}$ est évidente. Soit $t \in \mathbb{R}$ et $a \in A$, qui existe car $A$ est non vide : $t = a + (t - a)$, avec $t - a \in \mathbb{R}$. 
    $$\boxed{A \oplus \mathbb{R} = \mathbb{R}}$$

    **1. (c)** Si $t = a + b$ avec $a \in A_{1} \cap A_{2}$ et $b \in B$, alors $t \in A_{1} \oplus B$ et $t \in A_{2} \oplus B$. L'égalité est fausse en général : pour $A_{1} = \{0\}$, $A_{2} = \{1\}$ et $B = \{0\,,1\}$, on a $(A_{1} \cap A_{2}) \oplus B = \varnothing \oplus B = \varnothing$, tandis que $1 = 0 + 1 = 1 + 0$ appartient à $(A_{1} \oplus B) \cap (A_{2} \oplus B) = \{0\,,1\} \cap \{1\,,2\} = \{1\}$. 
    $$\boxed{\text{Inclusion toujours vraie, égalité fausse en général.}}$$
     Le même réel peut s'écrire $a_{1} + b_{1}$ et $a_{2} + b_{2}$ avec $a_{1} \neq a_{2}$ : c'est ce qui fait échouer l'inclusion réciproque.

    **2. (a)** La partie $H$ est la région du plan comprise entre les deux branches de l'hyperbole d'équation $y = \frac{1}{x}$, branches comprises.

    ![Figure](documents/figures/98b3104c9c966397.svg)

    La partie $H$ est colorée ; sous la figure, sa projection sur l'axe des abscisses, puis l'ensemble des abscisses dont toute la droite verticale est contenue dans $H$.

    Pour tout réel $x$, le couple $(x,0)$ appartient à $H$, donc $\widehat{H} = \mathbb{R}$. Si $x \neq 0$, le couple $\left(x,\frac{2}{x}\right)$ n'appartient pas à $H$, car $x \times \frac{2}{x} = 2 > 1$ ; en revanche, $(0,y) \in H$ pour tout $y$. 
    $$\boxed{\widehat{H} = \mathbb{R} \qquad \check{H} = \{0\}}$$
     L'ensemble $\widehat{P}$ est la *projection* de $P$ sur l'axe des abscisses : l'ensemble des $x$ dont la droite verticale rencontre $P$. L'ensemble $\check{P}$ est l'ensemble des $x$ dont la droite verticale est entièrement contenue dans $P$.

    **2. (b)** Pour $x \in \mathbb{R}$ : 
    $$\begin{aligned} x \in \widehat{P \cup Q} &\iff \exists y \in \mathbb{R},\ \big((x,y) \in P \ \mathrm{ou}\ (x,y) \in Q\big) \\ &\iff \big(\exists y \in \mathbb{R},\ (x,y) \in P\big) \ \mathrm{ou}\ \big(\exists y \in \mathbb{R},\ (x,y) \in Q\big) \iff x \in \widehat{P} \cup \widehat{Q}, \end{aligned}$$
     car « il existe » se distribue sur « ou ». En revanche, de $\exists y,\ \big((x,y) \in P \ \mathrm{et}\ (x,y) \in Q\big)$ on déduit seulement que $x \in \widehat{P}$ et $x \in \widehat{Q}$, les deux témoins pouvant être différents. Pour $P = \{(0,0)\}$ et $Q = \{(0,1)\}$, on a $P \cap Q = \varnothing$, donc $\widehat{P \cap Q} = \varnothing$, alors que $\widehat{P} \cap \widehat{Q} = \{0\}$. 
    $$\boxed{\widehat{P \cup Q} = \widehat{P} \cup \widehat{Q} \qquad \widehat{P \cap Q} \subset \widehat{P} \cap \widehat{Q}, \text{ inclusion stricte en général}}$$

    **2. (c)** Les rôles s'échangent, car « pour tout » se distribue sur « et » mais pas sur « ou » : en notant $R = P \cap Q$ et $S = P \cup Q$, 
    $$\boxed{\check{R} = \check{P} \cap \check{Q} \qquad \check{P} \cup \check{Q} \subset \check{S}}$$
     La première égalité découle de $\forall y,\ (\alpha(y) \ \mathrm{et}\ \beta(y)) \iff (\forall y,\ \alpha(y)) \ \mathrm{et}\ (\forall y,\ \beta(y))$. Pour la seconde, si la droite verticale d'abscisse $x$ est contenue dans $P$, elle l'est dans $P \cup Q$. L'inclusion est stricte en général : pour $P = \{(x,y) \mid y \geqslant 0\}$ et $Q = \{(x,y) \mid y < 0\}$, on a $\check{P} = \check{Q} = \varnothing$, alors que $S = P \cup Q = \mathbb{R}^{2}$ et $\check{S} = \mathbb{R}$.

    *À retenir :* les opérations $P \mapsto \widehat{P}$ et $P \mapsto \check{P}$ sont la traduction ensembliste des quantificateurs $\exists y$ et $\forall y$. Leurs propriétés vis-à-vis de $\cup$ et $\cap$ sont exactement les règles de distributivité des quantificateurs du cours, ce qui explique la parenté entre cet exercice et la partie de Minkowski : un « il existe » est caché dans la définition de $A \oplus B$.
- id: "ma-01-39"
  feuille: "f-ma-01"
  numero: 39
  partie: "Ensembles"
  etoiles: 3
  types: [Calcul]
  mots_cles: [ensembles, inclusion, opérations sur les parties, ensemble des parties, produit cartésien]
  noeuds: [zf-operations, zf-ext, zf-parties, r-produit]
  notions: [ensemble, ensemble-parties, produit-cartesien]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Soit $E$ un ensemble et $A$, $B$, $C$ trois parties de $E$.

    **1.** Discuter, selon $A$, $B$ et $C$, l'existence d'une partie $X$ de $E$ vérifiant à la fois $A \cup X = B$ et $A \cap X = C$, et déterminer toutes les solutions lorsqu'il en existe.

    **2.** Déterminer les parties $X$ de $E$ telles que $A \cup X = B$. Lorsque $E$ est fini et que $A$ possède $k$ éléments, combien y a-t-il de solutions ?

    **3.** Montrer que l'équation $A \,\Delta\, X = B$, d'inconnue $X \in \mathcal{P}(E)$, possède une unique solution, que l'on déterminera.

    **4.** On suppose que $E$ est fini, à $n$ éléments. Dénombrer les couples $(X,Y) \in \mathcal{P}(E)^{2}$ tels que $X \subset Y$ ; puis ceux tels que $X \cap Y = \varnothing$ ; puis ceux tels que $X \cup Y = E$. Expliquer le résultat obtenu.
  corrige: |
    **1.** *Analyse.* Soit $X$ une solution. Alors $A \subset A \cup X = B$ et $C = A \cap X \subset A$ : il est nécessaire que $C \subset A \subset B$. De plus, $X$ est la réunion de sa partie hors de $A$ et de sa partie dans $A$ ; or $X \setminus A = (A \cup X) \setminus A = B \setminus A$ et $X \cap A = C$. Donc nécessairement $X = (B \setminus A) \cup C$.

    *Synthèse.* Supposons $C \subset A \subset B$ et posons $X = (B \setminus A) \cup C$. Comme $A \subset B$, on a $A \cup (B \setminus A) = B$, et comme $C \subset B$, on obtient $A \cup X = B$. D'autre part, $A \cap X = \big(A \cap (B \setminus A)\big) \cup (A \cap C) = \varnothing \cup C = C$. 
    $$\boxed{\text{Il existe une solution si et seulement si } C \subset A \subset B \text{ ; elle est alors unique : } X = (B \setminus A) \cup C.}$$

    **2.** D'après la question 1, une partie $X$ vérifie $A \cup X = B$ si et seulement si $A \subset B$ et $X = (B \setminus A) \cup Y$, où $Y = A \cap X$ est une partie de $A$. Réciproquement, toute partie $Y$ de $A$ fournit une solution, et deux parties $Y$ différentes fournissent deux solutions différentes, puisque l'on retrouve $Y$ comme $A \cap X$. 
    $$\boxed{\text{Si } A \subset B \text{, les solutions sont les } X = (B \setminus A) \cup Y,\ Y \subset A \text{ ; sinon il n'y en a aucune.}}$$
     Il y a donc autant de solutions que de parties de $A$, soit, d'après la proposition 6 du cours : 
    $$\boxed{2^{k} \text{ solutions lorsque } A \subset B.}$$

    **3.** On raisonne élément par élément. Pour $x \in E$, l'appartenance à $A \,\Delta\, X$ est le « ou exclusif » des appartenances à $A$ et à $X$. Si $x \in A$, alors $x \in A \,\Delta\, X \Leftrightarrow x \notin X$ ; si $x \notin A$, alors $x \in A \,\Delta\, X \Leftrightarrow x \in X$. L'égalité $A \,\Delta\, X = B$ impose donc, pour chaque $x$ : si $x \in A$, alors $x \in X \Leftrightarrow x \notin B$ ; si $x \notin A$, alors $x \in X \Leftrightarrow x \in B$. Autrement dit, $x \in X$ exactement lorsque $x$ appartient à une seule des parties $A$ et $B$ : nécessairement $X = A \,\Delta\, B$. Réciproquement, les mêmes équivalences montrent que $X = A \,\Delta\, B$ convient. 
    $$\boxed{X = A \,\Delta\, B \text{ est l'unique solution.}}$$
     La situation rappelle l'équation $a + x = b$, d'unique solution $x = b - a$ : on verra au chapitre 11 que $(\mathcal{P}(E), \Delta)$ est un groupe, dans lequel chaque partie est son propre opposé.

    **4.** Pour chaque élément $x$ de $E$, un couple $(X,Y)$ vérifiant $X \subset Y$ laisse exactement trois possibilités : $x \in X$ (et donc $x \in Y$), $x \in Y \setminus X$, ou $x \notin Y$. Ces choix sont indépendants d'un élément à l'autre, ce qui donne, par le principe multiplicatif évoqué dans le cours : 
    $$\boxed{3^{n} \text{ couples tels que } X \subset Y}$$
     De même, pour $X \cap Y = \varnothing$, chaque élément est dans $X$ seulement, dans $Y$ seulement, ou dans aucune ; pour $X \cup Y = E$, il est dans $X$ seulement, dans $Y$ seulement, ou dans les deux. 
    $$\boxed{3^{n} \text{ couples dans chacun des trois cas.}}$$
     Ce n'est pas une coïncidence. D'après le point (v) de la proposition 7 du cours, $X \subset Y \Leftrightarrow X \cap \overline{Y} = \varnothing$ : remplacer $Y$ par son complémentaire fait passer, un à un, des couples du premier type à ceux du deuxième. D'après les lois de De Morgan, $X \cap Y = \varnothing \Leftrightarrow \overline{X} \cup \overline{Y} = E$ : remplacer $X$ et $Y$ par leurs complémentaires fait passer du deuxième type au troisième. Pour $n = 1$, on vérifie directement les trois couples $(\varnothing,\varnothing)$, $(\varnothing,E)$, $(E,E)$ du premier type. ✓
- id: "ma-01-40"
  feuille: "f-ma-01"
  numero: 40
  partie: "Ensembles"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [ensembles, partitions]
  noeuds: [zf-operations, r-equivalence]
  notions: [ensemble, partition]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Pour tout $k \in \mathbb{N}$, on note $A_{k} = \{2^{k}(2m + 1) \mid m \in \mathbb{N}\}$.

    **1.** Écrire les cinq plus petits éléments de $A_{0}$, de $A_{1}$ et de $A_{2}$.

    **2.** Montrer que la famille $(A_{k})_{k \in \mathbb{N}}$ est une partition de $\mathbb{N}^{*}$.

    **3.** Existe-t-il une partition de $\mathbb{N}^{*}$ en deux parties telle qu'aucune d'elles ne contienne à la fois un entier et son double ? Si oui, combien en existe-t-il ?
  corrige: |
    **1.** On calcule $2^{k}(2m + 1)$ pour $m = 0$, …, $4$ : 
    $$\boxed{A_{0} : 1,\ 3,\ 5,\ 7,\ 9} \qquad \boxed{A_{1} : 2,\ 6,\ 10,\ 14,\ 18} \qquad \boxed{A_{2} : 4,\ 12,\ 20,\ 28,\ 36}$$
     L'ensemble $A_{0}$ est celui des entiers impairs, et $A_{k}$ celui des entiers dont la plus grande puissance de $2$ qui les divise est $2^{k}$.

    **2.** Il y a trois points à vérifier : les $A_{k}$ sont des parties non vides de $\mathbb{N}^{*}$, ils recouvrent $\mathbb{N}^{*}$, et ils sont deux à deux disjoints.

    • Chaque $A_{k}$ est inclus dans $\mathbb{N}^{*}$ et contient $2^{k}$.

    • *Recouvrement*, par récurrence forte : $1 = 2^{0} \times 1 \in A_{0}$. Soit $n \geqslant 1$ tel que tout entier de $[\![1\,;n]\!]$ appartienne à l'un des $A_{k}$. Si $n + 1$ est impair, il appartient à $A_{0}$. Sinon $n + 1 = 2p$ avec $1 \leqslant p \leqslant n$ ; par hypothèse $p = 2^{j}(2m + 1)$, donc $n + 1 = 2^{j+1}(2m+1) \in A_{j+1}$.

    • *Disjonction.* Supposons $2^{k}(2m+1) = 2^{\ell}(2p+1)$ avec $k < \ell$. En divisant par $2^{k}$, on obtient $2m + 1 = 2^{\ell - k}(2p + 1)$, nombre pair puisque $\ell - k \geqslant 1$ : contradiction. Donc $A_{k} \cap A_{\ell} = \varnothing$ dès que $k \neq \ell$.

    $$\boxed{(A_{k})_{k \in \mathbb{N}} \text{ est une partition de } \mathbb{N}^{*}.}$$
     Autrement dit, tout entier $n \geqslant 1$ s'écrit de façon unique $n = 2^{k}(2m + 1)$ : l'exposant $k$ est appelé la valuation $2$-adique de $n$ (chapitre 12).

    **3.** Oui. Notons $P$ la réunion des $A_{k}$ d'indice $k$ pair et $I$ celle des $A_{k}$ d'indice impair. D'après la question 2, $P$ et $I$ forment une partition de $\mathbb{N}^{*}$, puisque $1 \in P$ et $2 \in I$. Si $n \in A_{k}$, alors $2n \in A_{k+1}$ : les indices de $n$ et $2n$ sont de parités différentes, donc $n$ et $2n$ ne sont jamais dans la même partie. 
    $$\boxed{P = \bigcup_{k \text{ pair}} A_{k} \text{ et } I = \bigcup_{k \text{ impair}} A_{k} \text{ conviennent.}}$$
     Ce n'est pas la seule. Pour chaque entier impair $m$, les entiers $m$, $2m$, $4m$, … doivent alterner entre les deux parties ; une fois choisie la partie qui contient $m$, toute la suite est déterminée. Ces suites sont deux à deux disjointes (question 2), et le choix peut être fait indépendamment pour chaque entier impair $m$ ; inversement, une partition ainsi construite convient, puisque $n$ et $2n$ sont toujours dans la même suite. 
    $$\boxed{\text{Il existe une infinité de telles partitions : une par choix de la partie de chaque entier impair.}}$$
     *À retenir :* il y en a même « beaucoup trop » pour être rangées en une suite : choisir la partie de chaque entier impair revient à choisir une partie de l'ensemble des entiers impairs, et l'exercice 45 montrera que de tels choix ne peuvent pas être numérotés.
- id: "ma-01-41"
  feuille: "f-ma-01"
  numero: 41
  partie: "Ensembles"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [ensembles, ensemble des parties]
  noeuds: [zf-operations, zf-parties]
  notions: [ensemble, ensemble-parties]
  page_enonce: 12
  page_corrige: 30
  enonce: |
    Soit $n \geqslant 1$. On dit que deux parties de $[\![1\,;n]\!]$ sont *adjacentes* si l'on passe de l'une à l'autre en ajoutant ou en retirant un seul élément.

    **1.** Montrer qu'on peut ranger les $2^{n}$ parties de $[\![1\,;n]\!]$ en une liste $A_{0}$, $A_{1}$, …, $A_{2^{n} - 1}$, où chaque partie figure exactement une fois, de sorte que $A_{k-1}$ et $A_{k}$ soient adjacentes pour tout $k \in [\![1\,;2^{n} - 1]\!]$, et qu'en outre $A_{2^{n} - 1}$ et $A_{0}$ soient adjacentes. Écrire une telle liste pour $n = 3$.

    **2.** Montrer qu'on peut imposer de plus $A_{0} = \varnothing$ et $A_{k} = [\![1\,;k]\!]$ pour tout $k \in [\![1\,;n]\!]$.

    *Une telle liste est un *code de Gray* ; on l'utilise pour coder des positions de sorte que deux positions voisines ne diffèrent que d'un bit.*
  corrige: |
    **1.** Par récurrence sur $n \geqslant 1$. Pour $n = 1$, la liste $\varnothing$, $\{1\}$ convient. Supposons construite une liste convenable $C_{0}$, …, $C_{N-1}$ des parties de $[\![1\,;n]\!]$, avec $N = 2^{n}$. On forme la liste des parties de $[\![1\,;n+1]\!]$ en parcourant cette liste, puis en la parcourant à l'envers après avoir ajouté $n + 1$ à chaque partie : 
    $$C_{0},\ C_{1},\ \dots,\ C_{N-1},\ C_{N-1} \cup \{n+1\},\ C_{N-2} \cup \{n+1\},\ \dots,\ C_{0} \cup \{n+1\}.$$
     Les parties de $[\![1\,;n+1]\!]$ ne contenant pas $n + 1$ sont les $C_{k}$, et celles qui le contiennent sont les $C_{k} \cup \{n+1\}$ : chacune apparaît exactement une fois, ce qui fait bien $2N = 2^{n+1}$ parties. Deux termes consécutifs dans une même moitié sont adjacents, comme $C_{k-1}$ et $C_{k}$. À la jonction, $C_{N-1}$ et $C_{N-1} \cup \{n+1\}$ sont adjacents, ainsi que le dernier terme $C_{0} \cup \{n+1\}$ et le premier $C_{0}$. Pour $n = 3$, on obtient 
    $$\boxed{\varnothing,\ \{1\},\ \{1,2\},\ \{2\},\ \{2,3\},\ \{1,2,3\},\ \{1,3\},\ \{3\}}$$

    **2.** On adapte la construction précédente pour contrôler les premiers termes. Montrons par récurrence sur $n \geqslant 1$ qu'il existe une liste cyclique adjacente $C_{0}$, …, $C_{N-1}$ des parties de $[\![1\,;n]\!]$, avec $N = 2^{n}$, telle que $C_{k} = [\![1\,;k]\!]$ pour $0 \leqslant k \leqslant n$ (avec $[\![1\,;0]\!] = \varnothing$). Pour $n = 1$, la liste $\varnothing$, $\{1\}$ convient.

    Supposons une telle liste construite pour $n$, et notons $m = n + 1$. Comme $N = 2^{n} \geqslant n + 1$, les termes $C_{0}$, …, $C_{n}$ existent. On forme la liste 
    $$\underbrace{C_{0},\ \dots,\ C_{n}}_{\text{(1)}},\quad \underbrace{C_{n} \cup \{m\},\ \dots,\ C_{0} \cup \{m\}}_{\text{(2)}},\quad \underbrace{C_{N-1} \cup \{m\},\ \dots,\ C_{n+1} \cup \{m\}}_{\text{(3)}},\quad \underbrace{C_{n+1},\ \dots,\ C_{N-1}}_{\text{(4)}}.$$

    • Chaque partie de $[\![1\,;m]\!]$ figure exactement une fois : les $C_{k}$ dans les blocs (1) et (4), les $C_{k} \cup \{m\}$ dans (2) et (3).

    • Les termes consécutifs à l'intérieur de chaque bloc sont adjacents, car $C_{k-1}$ et $C_{k}$ le sont. Aux jonctions : $C_{n}$ et $C_{n} \cup \{m\}$ ; puis $C_{0} \cup \{m\}$ et $C_{N-1} \cup \{m\}$, adjacents car $C_{0}$ et $C_{N-1}$ le sont, par cyclicité ; puis $C_{n+1} \cup \{m\}$ et $C_{n+1}$ ; enfin le dernier terme $C_{N-1}$ et le premier $C_{0}$. Si les blocs (3) et (4) sont vides, ce qui n'arrive que pour $N = n + 1$, c'est-à-dire $n = 1$, la liste se referme directement de $C_{0} \cup \{m\}$ sur $C_{0}$.

    • Les premiers termes sont $C_{k} = [\![1\,;k]\!]$ pour $k \leqslant n$, puis $C_{n} \cup \{m\} = [\![1\,;n+1]\!]$ au rang $n + 1 = m$.

    $$\boxed{\text{On peut imposer } A_{0} = \varnothing \text{ et } A_{k} = [\![1\,;k]\!] \text{ pour } 1 \leqslant k \leqslant n.}$$
     Pour $n = 3$, la construction fournit $\varnothing$, $\{1\}$, $\{1,2\}$, $\{1,2,3\}$, $\{1,3\}$, $\{3\}$, $\{2,3\}$, $\{2\}$, liste que l'on vérifie directement. La construction a été contrôlée par ordinateur jusqu'à $n = 8$.

    *À retenir :* on démontre souvent un énoncé plus précis que celui demandé, ici la position des $n + 1$ premiers termes, pour disposer d'une hypothèse de récurrence assez riche. On retrouve, sous une forme combinatoire, la leçon des exercices 19 et 24.
- id: "ma-01-42"
  feuille: "f-ma-01"
  numero: 42
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [négation, contre-exemple, récurrence, quantificateurs, divisibilité, inclusion, opérations sur les parties, ensemble des parties]
  noeuds: [l-tautologies, n-recurrence, l-syntaxe, z-division, zf-ext, zf-operations, zf-parties, r-produit]
  notions: [quantificateur, ensemble, ensemble-parties, produit-cartesien]
  page_enonce: 12
  page_corrige: 31
  enonce: |
    **Vrai ou faux.** Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse et justifier la réponse par une démonstration ou un contre-exemple.

    **1.** Pour toutes assertions $P$ et $Q$, l'assertion $(P \Rightarrow Q) \Rightarrow (\mathrm{non}\, P \Rightarrow \mathrm{non}\, Q)$ est vraie.

    **2.** La négation de « $\forall x \in \mathbb{R},\ x^{2} \geqslant 1 \Rightarrow x \geqslant 1$ » est « $\exists x \in \mathbb{R},\ x^{2} < 1 \ \mathrm{et}\ x < 1$ ».

    **3.** Pour toutes parties $A$ et $B$ d'un ensemble $E$ : $A \subset B \Leftrightarrow A \cup B = B$.

    **4.** Si $P(0)$ est vraie et si $P(n) \Rightarrow P(n+1)$ pour tout $n \geqslant 1$, alors $P(n)$ est vraie pour tout $n \in \mathbb{N}$.

    **5.** Pour tous ensembles $E$ et $F$ : $\mathcal{P}(E \times F) = \mathcal{P}(E) \times \mathcal{P}(F)$.

    **6.** L'intersection d'une famille de parties toutes non vides peut être vide.

    **7.** Pour tous ensembles $E$ et $F$ non vides : $E \times F = F \times E \Leftrightarrow E = F$.

    **8.** Pour tout entier $n$, si $n^{2}$ est divisible par $3$, alors $n$ est divisible par $3$.

    **9.** Pour tout ensemble $E$ : $\{\varnothing\} \in \mathcal{P}\big(\mathcal{P}(E)\big)$.

    **10.** Toute partie non vide et majorée de $\mathbb{Z}$ possède un plus grand élément.
  corrige: |
    **1.** $\boxed{\textbf{Fausse}}$ Pour $P$ fausse et $Q$ vraie, $P \Rightarrow Q$ est vraie mais $\mathrm{non}\, P \Rightarrow \mathrm{non}\, Q$ est fausse. L'implication $\mathrm{non}\, P \Rightarrow \mathrm{non}\, Q$ est la contraposée de la *réciproque* $Q \Rightarrow P$, et non de $P \Rightarrow Q$ (schéma de la section 1.2.3 du cours).

    **2.** $\boxed{\textbf{Fausse}}$ La négation de $A \Rightarrow B$ est $A \ \mathrm{et}\ \mathrm{non}\, B$ : la bonne négation est « $\exists x \in \mathbb{R},\ x^{2} \geqslant 1 \ \mathrm{et}\ x < 1$ ». Pour voir que la méthode proposée est fausse, appliquons-la à l'assertion vraie « $\forall x \in \mathbb{R},\ x^{2} \geqslant 1 \Rightarrow |x| \geqslant 1$ » : elle fournirait « $\exists x \in \mathbb{R},\ x^{2} < 1 \ \mathrm{et}\ |x| < 1$ », vraie elle aussi pour $x = 0$. Une assertion et sa négation ne peuvent pas être vraies ensemble.

    **3.** $\boxed{\textbf{Vraie}}$ Si $A \subset B$, alors $A \cup B \subset B$ et $B \subset A \cup B$, donc $A \cup B = B$. Réciproquement, $A \subset A \cup B = B$.

    **4.** $\boxed{\textbf{Fausse}}$ Le maillon $P(0) \Rightarrow P(1)$ manque. L'assertion $P(n)$ : « $n = 0$ ou $n \geqslant 2$ » vérifie $P(0)$, et $P(n) \Rightarrow P(n+1)$ pour tout $n \geqslant 1$ puisque $n + 1 \geqslant 2$ ; pourtant $P(1)$ est fausse.

    **5.** $\boxed{\textbf{Fausse}}$ Les éléments de $\mathcal{P}(E \times F)$ sont des parties de $E \times F$, ceux de $\mathcal{P}(E) \times \mathcal{P}(F)$ des couples de parties : ce ne sont pas les mêmes objets. Les nombres d'éléments diffèrent d'ailleurs : si $E$ et $F$ ont chacun un élément, $\mathcal{P}(E \times F)$ en a $2^{1} = 2$, et $\mathcal{P}(E) \times \mathcal{P}(F)$ en a $2 \times 2 = 4$.

    **6.** $\boxed{\textbf{Vraie}}$ Chaque intervalle $\left]0\,,\frac{1}{n}\right[$ est non vide, mais leur intersection est vide : un réel $x$ commun vérifierait $0 < x < \frac{1}{n}$ pour tout $n$, ce que la propriété d'Archimède interdit. L'exercice 31 en donne un autre exemple avec les $[n\,,+\infty[$.

    **7.** $\boxed{\textbf{Vraie}}$ Le sens réciproque est clair. Supposons $E \times F = F \times E$. Soit $x \in E$ ; comme $F$ est non vide, on choisit $y \in F$, et $(x,y) \in E \times F = F \times E$ donne $x \in F$. Donc $E \subset F$, et de même $F \subset E$. L'hypothèse « non vides » est indispensable : $\varnothing \times \{1\} = \{1\} \times \varnothing = \varnothing$.

    **8.** $\boxed{\textbf{Vraie}}$ Par contraposition : si $n = 3k + 1$, alors $n^{2} = 3(3k^{2} + 2k) + 1$ ; si $n = 3k + 2$, alors $n^{2} = 3(3k^{2} + 4k + 1) + 1$. Dans les deux cas, $n^{2}$ n'est pas divisible par $3$. On en déduit l'irrationalité de $\sqrt{3}$ comme celle de $\sqrt{2}$ dans le cours.

    **9.** $\boxed{\textbf{Vraie}}$ Comme $\varnothing \in \mathcal{P}(E)$, la partie $\{\varnothing\}$ est incluse dans $\mathcal{P}(E)$, c'est-à-dire $\{\varnothing\} \in \mathcal{P}\big(\mathcal{P}(E)\big)$. Le piège porte sur la différence entre $\varnothing$ et $\{\varnothing\}$.

    **10.** $\boxed{\textbf{Vraie}}$ Soit $A$ une partie non vide de $\mathbb{Z}$, majorée par un réel $M$, et $m$ un entier supérieur à $M$. L'ensemble $\{m - a \mid a \in A\}$ est une partie non vide de $\mathbb{N}$ ; d'après la proposition 4 du cours, il possède un plus petit élément $m - a_{0}$. Pour tout $a \in A$, $m - a \geqslant m - a_{0}$, donc $a \leqslant a_{0}$ : $a_{0}$ est le plus grand élément de $A$. Le résultat est faux dans $\mathbb{Q}$ ou $\mathbb{R}$ : $\{x \in \mathbb{Q} \mid x < 1\}$ est majorée mais n'a pas de plus grand élément.
- id: "ma-01-43"
  feuille: "f-ma-01"
  numero: 43
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [principe des tiroirs]
  noeuds: [n-fini]
  notions: []
  page_enonce: 13
  page_corrige: 32
  enonce: |
    **1.** Soit $n \geqslant 1$ et $x_{1}$, …, $x_{n}$ des réels. Montrer que 
    $$\min(x_{1},\dots,x_{n}) \leqslant \frac{x_{1} + \dots + x_{n}}{n} \leqslant \max(x_{1},\dots,x_{n}).$$

    **2.** *Principe des tiroirs.* On range $m$ objets dans $n$ tiroirs, avec $m > n \geqslant 1$. Déduire de la question précédente qu'un tiroir au moins contient au moins deux objets.

    **3.** Sur un réseau social comptant $N \geqslant 2$ inscrits, chacun peut être ami avec tout autre inscrit, mais pas avec lui-même, et l'amitié est réciproque. Montrer que deux inscrits au moins ont le même nombre d'amis.

    **4.** Montrer que parmi $n + 1$ entiers choisis dans $[\![1\,;2n]\!]$, deux au moins sont consécutifs. Est-ce encore vrai avec $n$ entiers ?
  corrige: |
    **1.** Notons $m = \min(x_{1},\dots,x_{n})$ et $M = \max(x_{1},\dots,x_{n})$. Pour tout $i$, on a $m \leqslant x_{i} \leqslant M$ ; en sommant ces $n$ encadrements, $nm \leqslant x_{1} + \dots + x_{n} \leqslant nM$, et l'on divise par $n > 0$. 
    $$\boxed{\min(x_{1},\dots,x_{n}) \leqslant \frac{x_{1} + \dots + x_{n}}{n} \leqslant \max(x_{1},\dots,x_{n})}$$
     Autrement dit, l'un des $x_{i}$ au moins est supérieur ou égal à la moyenne : c'est la forme générale de la question 3 de l'exercice 11.

    **2.** Notons $x_{j}$ le nombre d'objets dans le tiroir $j$, pour $j \in [\![1\,;n]\!]$. Alors $x_{1} + \dots + x_{n} = m$, et la question 1 donne un tiroir tel que $x_{j} \geqslant \frac{m}{n} > 1$. Comme $x_{j}$ est un entier, $x_{j} \geqslant 2$. 
    $$\boxed{\text{Un tiroir au moins contient au moins deux objets.}}$$

    **3.** Chaque inscrit a entre $0$ et $N - 1$ amis. Mais les valeurs $0$ et $N - 1$ ne peuvent pas être prises toutes les deux : un inscrit ayant $N - 1$ amis est ami avec tous les autres, et aucun d'eux n'a alors $0$ ami. Les nombres d'amis prennent donc leurs valeurs dans $[\![0\,;N-2]\!]$ ou dans $[\![1\,;N-1]\!]$, deux ensembles à $N - 1$ éléments. En rangeant les $N$ inscrits dans $N - 1$ tiroirs, un par valeur possible, la question 2 donne deux inscrits dans le même tiroir. 
    $$\boxed{\text{Deux inscrits au moins ont le même nombre d'amis.}}$$

    **4.** On range les entiers de $[\![1\,;2n]\!]$ dans les $n$ tiroirs $\{1,2\}$, $\{3,4\}$, …, $\{2n - 1, 2n\}$. Parmi $n + 1$ entiers distincts, deux sont dans le même tiroir, et ils sont consécutifs. Avec $n$ entiers, c'est faux : les entiers impairs $1$, $3$, …, $2n - 1$ n'en contiennent pas deux consécutifs. 
    $$\boxed{\text{Vrai pour } n + 1 \text{ entiers, faux pour } n.}$$
     *À retenir :* la difficulté d'un argument de tiroirs est toujours de choisir les tiroirs. Le principe sera formalisé au chapitre 2 avec la notion d'application : une application d'un ensemble à $m$ éléments dans un ensemble à $n < m$ éléments n'est jamais injective.
- id: "ma-01-44"
  feuille: "f-ma-01"
  numero: 44
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [quantificateurs, inclusion, opérations sur les parties]
  noeuds: [l-syntaxe, zf-ext, zf-operations]
  notions: [quantificateur, ensemble]
  page_enonce: 13
  page_corrige: 32
  enonce: |
    On dit qu'une partie $O$ de $\mathbb{R}$ est *ouverte* si 
    $$\forall x \in O,\ \exists \varepsilon > 0,\ \ ]x - \varepsilon\,,x + \varepsilon[\ \subset O,$$
     et qu'une partie $F$ de $\mathbb{R}$ est *fermée* si son complémentaire $\mathbb{R} \setminus F$ est ouvert.

    ![Figure](documents/figures/bfb93c9b669e34b6.svg)

    La figure illustre la définition : autour de chaque point $x$ de $O$, on peut placer un petit intervalle ouvert entièrement contenu dans $O$.

    **1.** Traduire la définition d'une partie ouverte en une phrase française, sans symbole. Les parties $\varnothing$ et $\mathbb{R}$ sont-elles ouvertes ? fermées ?

    **2.** Montrer que $]0\,,+\infty[$ est ouvert, que $[0\,,1]$ n'est pas ouvert, mais qu'il est fermé.

    **3.** Montrer qu'une réunion quelconque de parties ouvertes est ouverte, et que l'intersection de deux parties ouvertes est ouverte. Que peut-on en déduire pour les parties fermées ?

    **4.** L'intersection d'une famille infinie de parties ouvertes est-elle toujours ouverte ?

    **5.** Montrer que $\mathbb{Q}$ n'est ni ouvert ni fermé.

    **6.** Les parties $\mathbb{Z}$, $\left\{\frac{1}{n} \mid n \in \mathbb{N}^{*}\right\}$ et $\{0\} \cup \left\{\frac{1}{n} \mid n \in \mathbb{N}^{*}\right\}$ sont-elles fermées ?
  corrige: |
    **1.** Une partie est ouverte si, autour de chacun de ses points, elle contient tout un petit intervalle centré en ce point : on peut déplacer légèrement n'importe lequel de ses points sans en sortir.

    La partie $\varnothing$ est ouverte, car la condition « pour tout $x \in \varnothing$ » est vide, donc vraie. La partie $\mathbb{R}$ est ouverte, n'importe quel $\varepsilon > 0$ convenant. Par conséquent $\varnothing = \mathbb{R} \setminus \mathbb{R}$ et $\mathbb{R} = \mathbb{R} \setminus \varnothing$ sont aussi fermées. 
    $$\boxed{\varnothing \text{ et } \mathbb{R} \text{ sont à la fois ouvertes et fermées.}}$$
     *Piège :* « fermée » n'est pas le contraire d'« ouverte ». Une partie peut être les deux à la fois, comme ici, ou aucun des deux, comme à la question 5.

    **2.** Soit $x > 0$ ; pour $\varepsilon = x$, on a $]0\,,2x[ \; \subset \; ]0\,,+\infty[$. 
    $$\boxed{]0\,,+\infty[ \text{ est ouvert.}}$$
     Le point $0$ appartient à $[0\,,1]$, mais pour tout $\varepsilon > 0$, l'intervalle $]-\varepsilon\,,\varepsilon[$ contient $-\frac{\varepsilon}{2} \notin [0\,,1]$. 
    $$\boxed{[0\,,1] \text{ n'est pas ouvert.}}$$
     Son complémentaire est $]-\infty\,,0[ \, \cup \, ]1\,,+\infty[$. Pour $x < 0$, le réel $\varepsilon = |x|$ convient ; pour $x > 1$, le réel $\varepsilon = x - 1$ convient. Ce complémentaire est ouvert. 
    $$\boxed{[0\,,1] \text{ est fermé.}}$$

    **3.** Soit $(O_{i})_{i \in I}$ une famille de parties ouvertes et $x$ un point de leur réunion. Il existe $i_{0}$ tel que $x \in O_{i_{0}}$, puis $\varepsilon > 0$ tel que $]x - \varepsilon\,,x + \varepsilon[ \; \subset O_{i_{0}} \subset \bigcup_{i} O_{i}$. Pour deux ouverts $O_{1}$, $O_{2}$ et $x \in O_{1} \cap O_{2}$, on dispose de $\varepsilon_{1}$ et $\varepsilon_{2}$, et $\varepsilon = \min(\varepsilon_{1}, \varepsilon_{2})$ convient pour les deux. 
    $$\boxed{\text{Toute réunion d'ouverts est ouverte ; l'intersection de deux ouverts est ouverte.}}$$
     Par les lois de De Morgan pour une famille (proposition 8 du cours), le complémentaire d'une intersection de fermés est une réunion d'ouverts, et celui d'une réunion de deux fermés une intersection de deux ouverts. 
    $$\boxed{\text{Toute intersection de fermés est fermée ; la réunion de deux fermés est fermée.}}$$
     Par récurrence, ces résultats s'étendent à un nombre fini d'ouverts ou de fermés.

    **4.** Non. D'après le cours, $\bigcap_{n \geqslant 1} \left]-\frac{1}{n}\,,\frac{1}{n}\right[ = \{0\}$, qui n'est pas ouvert : tout intervalle $]-\varepsilon\,,\varepsilon[$ contient $\frac{\varepsilon}{2} \neq 0$. 
    $$\boxed{\text{Une intersection infinie d'ouverts n'est pas toujours ouverte.}}$$
     La démonstration de la question 3 échoue précisément ici : les rayons $\varepsilon_{n} = \frac{1}{n}$ n'ont pas de plus petit élément strictement positif.

    **5.** *$\mathbb{Q}$ n'est pas ouvert.* Le point $0$ est rationnel. Pour tout $\varepsilon > 0$, la propriété d'Archimède donne $n$ tel que $\frac{1}{n} < \frac{\varepsilon}{\sqrt{2}}$ ; le réel $\frac{\sqrt{2}}{n}$ appartient alors à $]-\varepsilon\,,\varepsilon[$ et il est irrationnel, d'après l'exercice 11 (produit du rationnel non nul $\frac{1}{n}$ par l'irrationnel $\sqrt{2}$).

    *$\mathbb{Q}$ n'est pas fermé*, c'est-à-dire que $\mathbb{R} \setminus \mathbb{Q}$ n'est pas ouvert. Le point $\sqrt{2}$ est irrationnel. Soit $\varepsilon > 0$ et $n$ tel que $\frac{1}{n} < \varepsilon$ ; d'après l'exercice 5 (f), il existe un entier $k$ tel que $k \leqslant n\sqrt{2} < k + 1$. Alors $0 \leqslant \sqrt{2} - \frac{k}{n} < \frac{1}{n} < \varepsilon$, et le rationnel $\frac{k}{n}$ appartient à $]\sqrt{2} - \varepsilon\,,\sqrt{2} + \varepsilon[$. 
    $$\boxed{\mathbb{Q} \text{ n'est ni ouvert ni fermé.}}$$
     On a démontré au passage que tout intervalle ouvert non vide contient des rationnels et des irrationnels : c'est la densité, qui sera étudiée au chapitre 7.

    **6.** *$\mathbb{Z}$ est fermé* : son complémentaire est la réunion des intervalles $]k\,,k+1[$, $k \in \mathbb{Z}$, qui sont ouverts (pour $x \in \,]a\,,b[$, le réel $\varepsilon = \min(x - a, b - x)$ convient), donc ce complémentaire est ouvert d'après la question 3.

    *$S = \left\{\frac{1}{n} \mid n \in \mathbb{N}^{*}\right\}$ n'est pas fermé* : le point $0$ n'appartient pas à $S$, mais tout intervalle $]-\varepsilon\,,\varepsilon[$ contient un élément $\frac{1}{n}$ de $S$, par la propriété d'Archimède. Le complémentaire de $S$ n'est donc pas ouvert.

    *$S \cup \{0\}$ est fermé* : son complémentaire est 
    $$]-\infty\,,0[ \;\cup\; ]1\,,+\infty[ \;\cup\; \bigcup_{n \geqslant 1} \left]\frac{1}{n+1}\,,\frac{1}{n}\right[,$$
     réunion d'ouverts. En effet, si $0 < x < 1$ et $x \notin S$, l'entier $n$ tel que $n \leqslant \frac{1}{x} < n + 1$ vérifie $n \geqslant 1$ et $\frac{1}{n+1} < x \leqslant \frac{1}{n}$, avec $x \neq \frac{1}{n}$. 
    $$\boxed{\mathbb{Z} \text{ et } S \cup \{0\} \text{ sont fermés ; } S \text{ ne l'est pas.}}$$
     *À retenir :* ajouter le point $0$, vers lequel « s'accumulent » les éléments de $S$, suffit à rendre la partie fermée. Cette idée de point limite sera précisée en analyse.
- id: "ma-01-45"
  feuille: "f-ma-01"
  numero: 45
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [suites, ensemble des parties]
  noeuds: [ar-suites, zf-parties]
  notions: [suite, ensemble-parties]
  page_enonce: 14
  page_corrige: 34
  enonce: |
    **1.** Montrer qu'il n'existe aucune suite $(A_{n})_{n \in \mathbb{N}}$ de parties de $\mathbb{N}$ telle que toute partie de $\mathbb{N}$ soit égale à l'un des $A_{n}$.

    **2.** Montrer qu'en revanche, il existe une suite $(F_{n})_{n \in \mathbb{N}}$ de parties *finies* de $\mathbb{N}$ telle que toute partie finie de $\mathbb{N}$ soit égale à l'un des $F_{n}$.

    **3.** Comparer le raisonnement de la première question avec le paradoxe de Russell évoqué dans le cours.
  corrige: |
    **1.** Supposons par l'absurde qu'une telle suite $(A_{n})$ existe, et considérons la partie 
    $$D = \{n \in \mathbb{N} \mid n \notin A_{n}\}.$$
     C'est une partie de $\mathbb{N}$, donc il existe $m \in \mathbb{N}$ tel que $D = A_{m}$. Alors 
    $$m \in D \Longleftrightarrow m \notin A_{m} \Longleftrightarrow m \notin D,$$
     ce qui est absurde. 
    $$\boxed{\text{Aucune suite de parties de } \mathbb{N} \text{ ne contient toutes les parties de } \mathbb{N}.}$$
     La partie $D$ est construite pour différer de chaque $A_{n}$ au moins en un point, l'entier $n$ lui-même : c'est l'argument diagonal de Cantor (1891).

    **2.** D'après l'exercice 19, tout entier $n \geqslant 1$ s'écrit de façon unique $n = \sum_{j \in J_{n}} 2^{j}$, où $J_{n}$ est une partie finie non vide de $\mathbb{N}$. Posons $F_{0} = \varnothing$ et $F_{n} = J_{n}$ pour $n \geqslant 1$. Soit $F$ une partie finie de $\mathbb{N}$. Si $F = \varnothing$, alors $F = F_{0}$. Sinon, l'entier $n = \sum_{j \in F} 2^{j}$ est au moins égal à $1$, et l'unicité de l'écriture donne $J_{n} = F$, c'est-à-dire $F = F_{n}$. 
    $$\boxed{F_{n} = \text{ensemble des exposants de l'écriture de } n \text{ en base } 2 \text{ convient.}}$$
     Par exemple, $13 = 2^{3} + 2^{2} + 2^{0}$ donne $F_{13} = \{0\,,2\,,3\}$. Chaque partie finie apparaît même exactement une fois dans la suite.

    **3.** Les deux raisonnements reposent sur la même construction autoréférente. Dans le paradoxe de Russell, on considère l'ensemble des $x$ tels que $x \notin x$ ; ici, l'ensemble des $n$ tels que $n \notin A_{n}$, l'indice $n$ jouant le rôle de l'objet qui « s'appartient ». Dans les deux cas, on aboutit à une équivalence du type $m \in D \Leftrightarrow m \notin D$. 
    $$\boxed{\text{Même argument diagonal : chez Russell, il interdit un ensemble ; ici, il interdit une suite.}}$$

    *À retenir :* les questions 1 et 2 montrent qu'il y a « beaucoup plus » de parties de $\mathbb{N}$ que de parties finies de $\mathbb{N}$. Le chapitre 2 donnera un sens précis à cette comparaison, et généralisera l'argument diagonal à un ensemble $E$ quelconque et à $\mathcal{P}(E)$.
- id: "ma-01-46"
  feuille: "f-ma-01"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [partitions]
  noeuds: [r-equivalence]
  notions: [partition]
  page_enonce: 14
  page_corrige: 34
  enonce: |
    On partage l'ensemble $[\![1\,;9]\!]$ en deux parties.

    **1.** Montrer que l'une au moins des deux parties contient trois entiers distincts en progression arithmétique.

    **2.** Le résultat subsiste-t-il si l'on remplace $[\![1\,;9]\!]$ par $[\![1\,;8]\!]$ ? Le cas échéant, déterminer tous les partages de $[\![1\,;8]\!]$ qui font exception.

    **3.** Que peut-on en déduire pour un partage de $\mathbb{N}^{*}$ en deux parties ?
  corrige: |
    On appelle $U$ et $V$ les deux parties, et l'on raisonne par l'absurde : on suppose qu'aucune ne contient trois entiers en progression arithmétique. On écrira simplement « $(a,b,c)$ interdit » pour rappeler qu'une progression $(a,b,c)$ ne peut pas être contenue dans une seule partie.

    **1.** *Premier cas : $4$ et $6$ sont dans la même partie*, disons $U$. Les progressions $(2,4,6)$, $(4,5,6)$ et $(4,6,8)$ forcent $2$, $5$ et $8$ à être dans $V$. Mais $(2,5,8)$ est une progression contenue dans $V$ : contradiction.

    *Second cas : $4$ et $6$ sont dans des parties différentes* ; quitte à échanger les noms, $4 \in U$ et $6 \in V$.

    • Si $5 \in U$ : $(3,4,5)$ donne $3 \in V$ ; $(3,6,9)$ donne $9 \in U$ ; $(5,7,9)$ donne $7 \in V$ ; $(6,7,8)$ donne $8 \in U$ ; $(2,5,8)$ donne $2 \in V$ ; $(1,2,3)$ donne $1 \in U$. Mais alors $(1,5,9)$ est contenue dans $U$ : contradiction.

    • Si $5 \in V$ : $(5,6,7)$ donne $7 \in U$ ; $(1,4,7)$ donne $1 \in V$ ; $(1,5,9)$ donne $9 \in U$ ; $(7,8,9)$ donne $8 \in V$ ; $(2,5,8)$ donne $2 \in U$ ; $(2,3,4)$ donne $3 \in V$. Mais alors $(1,3,5)$ est contenue dans $V$ : contradiction.

    $$\boxed{\text{Pour tout partage de } [\![1\,;9]\!] \text{ en deux parties, l'une contient une progression arithmétique.}}$$

    **2.** Non. Les progressions arithmétiques de trois termes dans $[\![1\,;8]\!]$ sont au nombre de douze : 
    $$\begin{array}{ll} \text{raison } 1 : & (1,2,3),\ (2,3,4),\ (3,4,5),\ (4,5,6),\ (5,6,7),\ (6,7,8) \\ \text{raison } 2 : & (1,3,5),\ (2,4,6),\ (3,5,7),\ (4,6,8) \\ \text{raison } 3 : & (1,4,7),\ (2,5,8) \end{array}$$
     Le partage $\{1,2,5,6\}$, $\{3,4,7,8\}$ n'en laisse aucune dans une même partie, comme on le vérifie sur cette liste.

    Pour trouver *tous* les partages exceptionnels, on reprend le raisonnement de la question 1, sans les progressions qui utilisent $9$. Le premier cas mène toujours à une contradiction, car $(2,5,8)$ reste dans $[\![1\,;8]\!]$. Dans le second cas, avec $4 \in U$ et $6 \in V$ :

    • si $5 \in V$ : $(5,6,7)$, $(1,4,7)$ et $(1,3,5)$ donnent successivement $7 \in U$, $1 \in V$, $3 \in U$ ; puis $(2,3,4)$ donne $2 \in V$ et $(2,5,8)$ donne $8 \in U$. On obtient $U = \{3,4,7,8\}$ et $V = \{1,2,5,6\}$ ;

    • si $5 \in U$ et $7 \in V$ : $(3,4,5)$, $(6,7,8)$, $(2,5,8)$, $(1,2,3)$ donnent $3 \in V$, $8 \in U$, $2 \in V$, $1 \in U$. On obtient $U = \{1,4,5,8\}$ et $V = \{2,3,6,7\}$ ;

    • si $5 \in U$ et $7 \in U$ : $(3,4,5)$, $(1,4,7)$, $(1,2,3)$, $(2,5,8)$ donnent $3 \in V$, $1 \in V$, $2 \in U$, $8 \in V$. On obtient $U = \{2,4,5,7\}$ et $V = \{1,3,6,8\}$.

    Dans chaque cas, toutes les progressions de la liste ont été examinées : aucune n'est contenue dans une seule partie. Exactement trois partages font exception : 
    $$\boxed{\{1,2,5,6\} \text{ et } \{3,4,7,8\}} \qquad \boxed{\{1,4,5,8\} \text{ et } \{2,3,6,7\}} \qquad \boxed{\{1,3,6,8\} \text{ et } \{2,4,5,7\}}$$
     Ce résultat a été confirmé par l'examen informatique des $2^{8} = 256$ manières de répartir les entiers.

    **3.** Soit $\mathbb{N}^{*}$ partagé en deux parties. Pour tout entier $k \geqslant 0$, les neuf entiers $k + 1$, …, $k + 9$ se répartissent entre les deux parties ; comme une translation conserve les progressions arithmétiques, la question 1 s'applique à eux et fournit une progression contenue dans une seule partie. En prenant $k = 0$, $9$, $18$, …, on obtient des blocs disjoints. 
    $$\boxed{\text{L'une des parties contient une infinité de progressions arithmétiques de trois termes.}}$$
     *À retenir :* le nombre $9$ est le plus petit possible, d'après la question 2. Ce résultat est le premier cas du théorème de van der Waerden (1927) : quel que soit le nombre de parties, et quelle que soit la longueur voulue, tout partage de $\mathbb{N}^{*}$ en un nombre fini de parties laisse dans l'une d'elles des progressions arithmétiques aussi longues que l'on veut.

