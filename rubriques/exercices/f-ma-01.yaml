  notions: [quantificateur, suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Un élève a proposé les négations suivantes ; $f$ est une fonction de $\mathbb{R}$ dans $\mathbb{R}$, $(u_{n})$ une suite réelle et $\ell$ un réel. Dire lesquelles sont correctes, corriger les autres en expliquant l'erreur commise, puis traduire en français l'assertion (b).

    ```tableau
     ¦ **Assertion** ¦ **Négation proposée**
    (a) ¦ $\forall x \in \mathbb{R},\ f(x) > 0$ ¦ $\forall x \in \mathbb{R},\ f(x) \leqslant 0$
    (b) ¦ $\exists M \in \mathbb{R},\ \forall n \in \mathbb{N},\ u_{n} \leqslant M$ ¦ $\forall M \in \mathbb{R},\ \exists n \in \mathbb{N},\ u_{n} > M$
    (c) ¦ $\forall \varepsilon > 0,\ \exists N \in \mathbb{N},\ \forall n \geqslant N,\ |u_{n} - \ell| \leqslant \varepsilon$ ¦ $\exists \varepsilon > 0,\ \forall N \in \mathbb{N},\ \exists n \geqslant N,\ |u_{n} - \ell| > \varepsilon$
    (d) ¦ $\forall x \in \mathbb{R},\ x > 0 \Rightarrow f(x) > 0$ ¦ $\exists x \in \mathbb{R},\ x > 0 \Rightarrow f(x) \leqslant 0$
    (e) ¦ $\exists !\, x \in \mathbb{R},\ f(x) = 0$ ¦ $\exists !\, x \in \mathbb{R},\ f(x) \neq 0$
    (f) ¦ $\forall x > 0,\ \exists n \in \mathbb{N},\ f(x) > n$ ¦ $\exists x \leqslant 0,\ \forall n \in \mathbb{N},\ f(x) \leqslant n$
    ```

    Pour la ligne (d), montrer de plus que l'assertion proposée comme négation est vraie pour *toute* fonction $f$ : en quoi cela confirme-t-il qu'elle ne peut pas être la négation de (d) ?
  corrige: |
    **(a)** **Incorrecte.** Le quantificateur n'a pas été changé : la négation de « pour tout » est « il existe ». 
    $$\boxed{\exists x \in \mathbb{R},\ f(x) \leqslant 0}$$

    **(b)** **Correcte.** L'assertion (b) signifie « la suite $(u_{n})$ est majorée », et la négation proposée signifie qu'elle n'est pas majorée : aucun réel $M$ ne majore tous ses termes.

    **(c)** **Correcte.** Les quantificateurs sont échangés, leurs domaines ($\varepsilon > 0$, $N \in \mathbb{N}$, $n \geqslant N$) conservés, et l'inégalité finale niée. L'assertion de départ exprime que $(u_{n})$ converge vers $\ell$, comme on le verra au chapitre 7.

    **(d)** **Incorrecte.** La négation d'une implication $A \Rightarrow B$ est $A \ \mathrm{et}\ \mathrm{non}\, B$, et non une autre implication : 
    $$\boxed{\exists x \in \mathbb{R},\ x > 0 \ \mathrm{et}\ f(x) \leqslant 0}$$
     La proposition de l'élève est vraie pour toute fonction $f$ : le réel $x = -1$ la vérifie, puisque l'hypothèse $x > 0$ y est fausse. Or pour $f = \exp$, l'assertion (d) est vraie elle aussi. Une assertion et sa négation ne pouvant être vraies simultanément, la proposition ne peut pas être la négation de (d).

    **(e)** **Incorrecte.** Nier « il existe un unique $x$ », c'est dire qu'il n'en existe aucun, ou qu'il en existe au moins deux : 
    $$\boxed{\big(\forall x \in \mathbb{R},\ f(x) \neq 0\big) \ \mathrm{ou}\ \big(\exists (x,y) \in \mathbb{R}^{2},\ x \neq y \ \mathrm{et}\ f(x) = f(y) = 0\big)}$$
     Pour la fonction nulle, l'assertion (e) et la proposition de l'élève sont toutes deux fausses, ce qui confirme l'erreur.

    **(f)** **Incorrecte.** Le domaine du premier quantificateur a été modifié : on nie la propriété, pas l'ensemble sur lequel porte la variable. 
    $$\boxed{\exists x > 0,\ \forall n \in \mathbb{N},\ f(x) \leqslant n}$$

    *À retenir :* l'assertion (f) cache une curiosité. Pour un réel $t$, dire qu'il existe $n \in \mathbb{N}$ tel que $t > n$ revient à dire que $t > 0$ (prendre $n = 0$ dans un sens, et utiliser $n \geqslant 0$ dans l'autre). L'assertion (f) signifie donc simplement que $f$ est strictement positive sur $]0\,,+\infty[$, et sa négation qu'elle prend une valeur négative ou nulle en un réel strictement positif. Simplifier une assertion avant de la nier évite bien des erreurs.
- id: "ma-01-07"
  feuille: "f-ma-01"
  numero: 7
  partie: "Quantificateurs"
  etoiles: 2
  types: [Vrai ou faux, Calcul]
  mots_cles: [quantificateurs, divisibilité, suites]
  noeuds: [l-syntaxe, z-division, ar-suites]
  notions: [quantificateur, suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Déterminer si chacune des assertions suivantes est vraie ou fausse, en le démontrant.

    **(a)** $1 = 0 \Rightarrow \big(\exists (p,q,r) \in \mathbb{Z}^{3},\ p^{3} + q^{3} + r^{3} = 114\big)$

    **(b)** $\forall x \in \mathbb{R},\ x > 2 \Rightarrow x \geqslant 3$

    **(c)** $\forall (x,y) \in (\mathbb{R}^{*})^{2},\ x < y \Rightarrow \frac{1}{x} > \frac{1}{y}$

    **(d)** $\exists x \in \mathbb{R}_{+},\ \sqrt{x} < x$

    **(e)** $\exists !\, z \in \mathbb{R},\ \cos z = 0$

    **(f)** $\exists x \in \mathbb{R},\ \big(x \leqslant x^{2} \ \mathrm{et}\ x = \mathrm{e}^{-x}\big)$

    **(g)** $\forall n \in \mathbb{N},\ \exists m \in \mathbb{N},\ nm \text{ est impair}$

    **(h)** $\exists \eta > 0,\ \forall x \in \mathbb{R},\ x \leqslant \eta \Rightarrow x^{2} \leqslant 1$

    **(i)** $\exists \eta > 0,\ \forall x \in \mathbb{R},\ |x| \leqslant \eta \Rightarrow x^{2} \leqslant 1$

    **(j)** $\exists \eta > 0,\ \forall x \in \mathbb{R},\ |x| \leqslant \eta \Rightarrow x^{2} \leqslant 10^{-18}$

    **(k)** $\forall \varepsilon > 0,\ \exists \eta > 0,\ \forall x \in \mathbb{R},\ |x| \leqslant \eta \Rightarrow x^{2} \leqslant \varepsilon$

    Que traduit l'assertion (k) ? En quoi diffère-t-elle de la suite d'assertions (i), (j) ?
  corrige: |
    **(a)** $\boxed{\textbf{Vraie}}$ L'hypothèse $1 = 0$ est fausse, donc l'implication est vraie, quelle que soit la valeur de vérité de la conclusion. Le choix de $114$ n'est pas innocent : on ne sait pas, à ce jour, si $114$ est somme de trois cubes d'entiers relatifs. On a donc démontré une implication dont on ignore si la conclusion est vraie.

    **(b)** $\boxed{\textbf{Fausse}}$ Le réel $x = \frac{5}{2}$ vérifie $x > 2$ mais pas $x \geqslant 3$. L'implication serait vraie pour des *entiers* : l'erreur est de raisonner sur $\mathbb{R}$ comme sur $\mathbb{Z}$.

    **(c)** $\boxed{\textbf{Fausse}}$ Pour $x = -1$ et $y = 1$, on a $x < y$ mais $\frac{1}{x} = -1 < 1 = \frac{1}{y}$. La fonction inverse est décroissante sur $]-\infty\,,0[$ et sur $]0\,,+\infty[$, mais pas sur $\mathbb{R}^{*}$, comme l'exercice 12 l'a déjà montré pour d'autres fonctions.

    **(d)** $\boxed{\textbf{Vraie}}$ Pour $x = 4$ : $\sqrt{4} = 2 < 4$. Plus généralement, tout $x > 1$ convient.

    **(e)** $\boxed{\textbf{Fausse}}$ Les réels $\frac{\pi}{2}$ et $-\frac{\pi}{2}$ sont deux solutions distinctes : l'existence est vraie, mais pas l'unicité. La négation de (e) est « aucune solution, ou au moins deux ».

    **(f)** $\boxed{\textbf{Fausse}}$ La fonction $g : x \mapsto x - \mathrm{e}^{-x}$ est strictement croissante sur $\mathbb{R}$, comme somme de deux fonctions strictement croissantes ; elle s'annule donc au plus une fois. Comme $g(0) = -1 < 0$ et $g(1) = 1 - \mathrm{e}^{-1} > 0$, le théorème des valeurs intermédiaires (Terminale) donne un unique $\alpha \in \,]0\,,1[$ tel que $\alpha = \mathrm{e}^{-\alpha}$. Mais pour $0 < \alpha < 1$, on a $\alpha^{2} < \alpha$, donc $\alpha \leqslant \alpha^{2}$ est fausse. Numériquement, $\alpha \approx 0{,}567$.

    **(g)** $\boxed{\textbf{Fausse}}$ La négation est $\exists n \in \mathbb{N},\ \forall m \in \mathbb{N},\ nm$ est pair : elle est vraie pour $n = 0$ (ou tout $n$ pair), car $nm$ est alors pair quel que soit $m$.

    **(h)** $\boxed{\textbf{Fausse}}$ Soit $\eta > 0$. Le réel $x = -2$ vérifie $x \leqslant \eta$, mais $x^{2} = 4 > 1$. La condition $x \leqslant \eta$ ne contrôle pas les grands négatifs.

    **(i)** $\boxed{\textbf{Vraie}}$ Avec $\eta = 1$ : si $|x| \leqslant 1$, alors $x^{2} = |x|^{2} \leqslant 1$.

    **(j)** $\boxed{\textbf{Vraie}}$ Avec $\eta = 10^{-9}$ : si $|x| \leqslant 10^{-9}$, alors $x^{2} \leqslant 10^{-18}$.

    **(k)** $\boxed{\textbf{Vraie}}$ Soit $\varepsilon > 0$. Avec $\eta = \sqrt{\varepsilon}$, si $|x| \leqslant \eta$, alors $x^{2} \leqslant \eta^{2} = \varepsilon$.

    L'assertion (k) dit que $x^{2}$ est aussi proche de $0$ qu'on le souhaite, pourvu que $x$ soit assez proche de $0$ : c'est la continuité en $0$ de la fonction carré, au sens de l'assertion $(C)$ de l'exercice 9. Les assertions (i) et (j) en sont des cas particuliers, pour $\varepsilon = 1$ et $\varepsilon = 10^{-18}$ ; mais aucune liste finie de tels cas ne suffit à établir (k), qui porte sur *tous* les $\varepsilon > 0$. D'où la nécessité d'exprimer $\eta$ en fonction de $\varepsilon$.
- id: "ma-01-08"
  feuille: "f-ma-01"
  numero: 8
  partie: "Quantificateurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [quantificateurs]
  noeuds: [l-syntaxe]
  notions: [quantificateur]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $f$ une fonction de $\mathbb{R}$ dans $\mathbb{R}$. On dit que $f$ est *bornée* si $\exists M \in \mathbb{R},\ \forall x \in \mathbb{R},\ |f(x)| \leqslant M$.

    **1.** Écrire avec des quantificateurs l'assertion « $f$ n'est pas bornée ». Donner, en le démontrant, un exemple de fonction bornée et un exemple de fonction non bornée.

    **2.** Quelles sont les fonctions qui vérifient l'assertion $\forall x \in \mathbb{R},\ \exists M \in \mathbb{R},\ |f(x)| \leqslant M$, obtenue en échangeant les deux quantificateurs ?

    **3.** Montrer que $f$ est bornée si et seulement si $\exists (a,b) \in \mathbb{R}^{2},\ \forall x \in \mathbb{R},\ a \leqslant f(x) \leqslant b$.

    **4.** Montrer que $f$ est bornée si et seulement si $\exists (a,b) \in \mathbb{R}^{2},\ \forall (x,y) \in \mathbb{R}^{2},\ a \leqslant f(x) - f(y) \leqslant b$.
  corrige: |
    **1.** On applique la méthode de négation du cours : 
    $$\boxed{f \text{ n'est pas bornée} \iff \forall M \in \mathbb{R},\ \exists x \in \mathbb{R},\ |f(x)| > M}$$
     La fonction sinus est bornée : $|\sin x| \leqslant 1$ pour tout réel $x$, donc $M = 1$ convient. La fonction identité ne l'est pas : pour tout réel $M$, le réel $x = |M| + 1$ vérifie $|x| = |M| + 1 > M$.

    **2.** Pour tout réel $x$, le réel $M = |f(x)|$ convient. L'assertion est donc vraie pour toute fonction. 
    $$\boxed{\text{Toutes les fonctions de } \mathbb{R} \text{ dans } \mathbb{R} \text{ vérifient cette assertion.}}$$
     C'est le cas typique où l'échange des quantificateurs vide l'assertion de son contenu : $M$ peut maintenant dépendre de $x$, et la valeur $|f(x)|$ elle-même convient.

    **3.** Si $|f(x)| \leqslant M$ pour tout $x$, alors $-M \leqslant f(x) \leqslant M$ : le couple $(a,b) = (-M,M)$ convient. Réciproquement, si $a \leqslant f(x) \leqslant b$ pour tout $x$, posons $M = \max(|a|,|b|)$. Alors $-M \leqslant -|a| \leqslant a \leqslant f(x) \leqslant b \leqslant |b| \leqslant M$, donc $|f(x)| \leqslant M$. 
    $$\boxed{f \text{ bornée} \iff f \text{ est minorée et majorée.}}$$

    **4.** Si $|f| \leqslant M$, alors $-2M \leqslant f(x) - f(y) \leqslant 2M$ pour tous $x$, $y$ : $(a,b) = (-2M,2M)$ convient. Réciproquement, supposons la condition vérifiée, et choisissons $y = 0$ : pour tout $x$, $a + f(0) \leqslant f(x) \leqslant b + f(0)$. La question 3 permet de conclure. 
    $$\boxed{f \text{ bornée} \iff \text{les écarts } f(x) - f(y) \text{ sont bornés.}}$$
     *À retenir :* dans le sens réciproque, il suffisait de *fixer* la variable $y$ : une assertion universelle peut toujours être spécialisée, et choisir la bonne valeur est souvent toute la démonstration.
- id: "ma-01-09"
  feuille: "f-ma-01"
  numero: 9
  partie: "Quantificateurs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [quantificateurs]
  noeuds: [l-syntaxe]
  notions: [quantificateur]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $f$ une fonction de $\mathbb{R}$ dans $\mathbb{R}$. On considère les trois assertions suivantes, qui ne diffèrent que par l'ordre des quantificateurs : 
    $$\begin{aligned} (C) &: \quad \forall \varepsilon > 0,\ \exists \delta > 0,\ \forall x \in \mathbb{R},\ |x| < \delta \Rightarrow |f(x) - f(0)| < \varepsilon \\ (L) &: \quad \exists \delta > 0,\ \forall \varepsilon > 0,\ \forall x \in \mathbb{R},\ |x| < \delta \Rightarrow |f(x) - f(0)| < \varepsilon \\ (M) &: \quad \forall \delta > 0,\ \exists \varepsilon > 0,\ \forall x \in \mathbb{R},\ |x| < \delta \Rightarrow |f(x) - f(0)| < \varepsilon \end{aligned}$$

    **1.** Montrer que $(L)$ entraîne $(C)$.

    **2.** Montrer que $(L)$ équivaut à une propriété simple de $f$, que l'on énoncera sans quantificateur portant sur $\varepsilon$. En déduire une fonction qui vérifie $(C)$ sans vérifier $(L)$.

    **3.** Caractériser de même les fonctions qui vérifient $(M)$. Donner une fonction qui ne vérifie pas $(M)$.

    **4.** Les assertions $(C)$ et $(M)$ sont-elles comparables ?

    *L'assertion $(C)$ est la définition de la continuité en $0$, qui sera étudiée au chapitre 8.*
  corrige: |
    **1.** Supposons $(L)$ et fixons un réel $\delta_{0} > 0$ qui convient. Soit $\varepsilon > 0$. Le réel $\delta = \delta_{0}$ convient alors dans $(C)$ : pour tout réel $x$ tel que $|x| < \delta_{0}$, l'assertion $(L)$ appliquée à ce $\varepsilon$ donne $|f(x) - f(0)| < \varepsilon$. 
    $$\boxed{(L) \Longrightarrow (C)}$$
     C'est un cas particulier de la proposition 3 du cours : « $\exists \delta\ \forall \varepsilon$ » entraîne « $\forall \varepsilon\ \exists \delta$ ».

    **2.** Montrons que $(L)$ équivaut à l'existence d'un intervalle $]-\delta\,,\delta[$ sur lequel $f$ est constante. 
    $$\boxed{(L) \Longleftrightarrow \exists \delta > 0,\ \forall x \in\ ]-\delta\,,\delta[,\ f(x) = f(0)}$$
     Si $(L)$ est vraie avec un certain $\delta$, alors pour $|x| < \delta$, le réel $|f(x) - f(0)|$ est inférieur à tout $\varepsilon > 0$, donc il est nul d'après la question 4 de l'exercice 11. Réciproquement, si $f(x) = f(0)$ sur $]-\delta\,,\delta[$, alors $|f(x) - f(0)| = 0 < \varepsilon$ pour tout $\varepsilon > 0$.

    La fonction $x \mapsto x$ vérifie $(C)$ : pour $\varepsilon > 0$, le réel $\delta = \varepsilon$ convient. Elle ne vérifie pas $(L)$, puisqu'elle n'est constante sur aucun intervalle $]-\delta\,,\delta[$. 
    $$\boxed{x \mapsto x \text{ vérifie } (C) \text{ mais pas } (L).}$$

    **3.** Montrons que $(M)$ équivaut au fait que $f$ soit bornée sur chaque intervalle $]-\delta\,,\delta[$. 
    $$\boxed{(M) \Longleftrightarrow \forall \delta > 0,\ f \text{ est bornée sur } ]-\delta\,,\delta[}$$
     Si $(M)$ est vraie, soit $\delta > 0$ et $\varepsilon$ le réel associé ; pour $|x| < \delta$, on a $|f(x)| \leqslant |f(0)| + |f(x) - f(0)| < |f(0)| + \varepsilon$. Réciproquement, si $|f(x)| \leqslant K$ sur $]-\delta\,,\delta[$, le réel $\varepsilon = K + |f(0)| + 1$ convient, puisque $|f(x) - f(0)| \leqslant K + |f(0)| < \varepsilon$.

    La fonction définie par $f(x) = \frac{1}{x}$ pour $x \neq 0$ et $f(0) = 0$ ne vérifie pas $(M)$ : elle n'est bornée sur aucun intervalle $]-\delta\,,\delta[$, puisque $f\big(\frac{1}{n}\big) = n$ et que $\frac{1}{n} < \delta$ pour $n$ assez grand. 
    $$\boxed{x \mapsto \tfrac{1}{x} \text{ (prolongée par } 0 \text{ en } 0) \text{ ne vérifie pas } (M).}$$

    **4.** Aucune des deux assertions n'entraîne l'autre.

    • La fonction définie par $g(x) = \frac{1}{x - 1}$ pour $x \neq 1$ et $g(1) = 0$ vérifie $(C)$ : pour $|x| < \frac{1}{2}$, on a $|x - 1| \geqslant \frac{1}{2}$, donc $|g(x) - g(0)| = \frac{|x|}{|x - 1|} \leqslant 2|x|$, et $\delta = \min\big(\frac{1}{2}, \frac{\varepsilon}{2}\big)$ convient. Elle ne vérifie pas $(M)$, n'étant pas bornée sur $]-2\,,2[$ au voisinage de $1$.

    • La fonction $h$ qui vaut $1$ sur $]0\,,+\infty[$ et $0$ sur $]-\infty\,,0]$ vérifie $(M)$, puisqu'elle est bornée. Elle ne vérifie pas $(C)$ : pour $\varepsilon = \frac{1}{2}$ et tout $\delta > 0$, le réel $x = \frac{\delta}{2}$ donne $|h(x) - h(0)| = 1 \geqslant \varepsilon$.

    $$\boxed{(C) \text{ et } (M) \text{ ne sont pas comparables.}}$$

    *À retenir :* déplacer un seul quantificateur change complètement le sens d'une définition. Au chapitre 8, la continuité uniforme ne différera de la continuité que par la place d'un quantificateur, exactement comme ici.
- id: "ma-01-10"
  feuille: "f-ma-01"
  numero: 10
  partie: "Quantificateurs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [quantificateurs, suites]
  noeuds: [l-syntaxe, ar-suites]
  notions: [quantificateur, suite]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Dans cet exercice, une suite réelle $(u_{n})_{n \in \mathbb{N}}$ est dite *croissante* si $\forall (n,m) \in \mathbb{N}^{2},\ n \leqslant m \Rightarrow u_{n} \leqslant u_{m}$, et *pseudo-croissante* si 
    $$\forall n \in \mathbb{N},\ \exists M \in \mathbb{N},\ \forall m \geqslant M,\ u_{m} \geqslant u_{n}.$$

    **1.** Traduire en français la définition d'une suite pseudo-croissante. Montrer que toute suite croissante est pseudo-croissante.

    **2.** Montrer que la somme de deux suites pseudo-croissantes est pseudo-croissante.

    **3.** Montrer que la suite $\big((-1)^{n}\big)_{n \in \mathbb{N}}$ n'est pas pseudo-croissante.

    **4.** En étudiant la suite $\big(n + (-1)^{n}\big)_{n \in \mathbb{N}}$, montrer que la réciproque de la question 1 est fausse.

    **5.** On dit que $(u_{n})$ est *pseudo-décroissante* si $\forall n \in \mathbb{N},\ \exists M \in \mathbb{N},\ \forall m \geqslant M,\ u_{m} \leqslant u_{n}$. On suppose que $(u_{n})$ est à la fois pseudo-croissante et pseudo-décroissante.

    **(a)** Montrer que pour tout $k \in \mathbb{N}$, il existe $N \in \mathbb{N}$ tel que $u_{n} = u_{k}$ pour tout $n \geqslant N$.

    **(b)** En déduire que $(u_{n})$ est constante.
  corrige: |
    **1.** Une suite est pseudo-croissante si chacun de ses termes est dépassé, au sens large, par tous les termes à partir d'un certain rang, ce rang pouvant dépendre du terme considéré. Si $(u_{n})$ est croissante et $n \in \mathbb{N}$, le rang $M = n$ convient : $m \geqslant n \Rightarrow u_{m} \geqslant u_{n}$. 
    $$\boxed{\text{Toute suite croissante est pseudo-croissante.}}$$

    **2.** Soit $(u_{n})$ et $(v_{n})$ pseudo-croissantes, et $n \in \mathbb{N}$. On dispose de rangs $M_{1}$ et $M_{2}$ tels que $u_{m} \geqslant u_{n}$ pour $m \geqslant M_{1}$ et $v_{m} \geqslant v_{n}$ pour $m \geqslant M_{2}$. Posons $M = \max(M_{1},M_{2})$ : pour $m \geqslant M$, les deux inégalités sont vraies et s'additionnent. 
    $$\boxed{u_{m} + v_{m} \geqslant u_{n} + v_{n} \text{ pour tout } m \geqslant \max(M_{1},M_{2}).}$$

    **3.** La négation de la définition est $\exists n \in \mathbb{N},\ \forall M \in \mathbb{N},\ \exists m \geqslant M,\ u_{m} < u_{n}$. Prenons $n = 0$, de sorte que $u_{n} = 1$. Pour tout $M$, l'entier impair $m = 2M + 1 \geqslant M$ vérifie $u_{m} = -1 < 1$. 
    $$\boxed{\big((-1)^{n}\big) \text{ n'est pas pseudo-croissante.}}$$

    **4.** Posons $u_{n} = n + (-1)^{n}$. Elle n'est pas croissante : $u_{0} = 1 > 0 = u_{1}$. Elle est pseudo-croissante : pour tout $n$, on a $u_{n} \leqslant n + 1$, et pour $m \geqslant n + 2$, on a $u_{m} \geqslant m - 1 \geqslant n + 1 \geqslant u_{n}$. Le rang $M = n + 2$ convient. 
    $$\boxed{\text{La suite } \big(n + (-1)^{n}\big) \text{ est pseudo-croissante sans être croissante.}}$$

    **5. (a)** Soit $k \in \mathbb{N}$. Il existe $M_{1}$ tel que $u_{n} \geqslant u_{k}$ pour $n \geqslant M_{1}$, et $M_{2}$ tel que $u_{n} \leqslant u_{k}$ pour $n \geqslant M_{2}$. Avec $N = \max(M_{1},M_{2})$, on a $u_{n} = u_{k}$ pour tout $n \geqslant N$.

    **5. (b)** Soit $k$ et $j$ deux entiers. La question (a) fournit $N_{k}$ et $N_{j}$ ; pour $n = \max(N_{k},N_{j})$, on obtient $u_{k} = u_{n} = u_{j}$. 
    $$\boxed{\text{Une suite pseudo-croissante et pseudo-décroissante est constante.}}$$
     *À retenir :* la technique du « $\max$ des rangs », employée trois fois ici, est omniprésente en analyse : deux propriétés vraies à partir d'un certain rang sont simultanément vraies à partir du plus grand des deux rangs. Elle servira constamment au chapitre 7 sur les suites.
- id: "ma-01-11"
  feuille: "f-ma-01"
  numero: 11
  partie: "Modes de raisonnement"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [modes de raisonnement, "raisonnement par l'absurde", divisibilité]
  noeuds: [l-connecteurs, z-division]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Soit $n$ un entier relatif. Montrer que si $n^{2} - 1$ n'est pas divisible par $8$, alors $n$ est pair.

    **2.** Montrer que le réel $\dfrac{\ln 2}{\ln 3}$ est irrationnel.

    **3.** Soit $a_{1}$, …, $a_{5}$ cinq réels de somme $1$. Montrer que l'un d'eux au moins est supérieur ou égal à $\frac{1}{5}$.

    **4.** Soit $x$ un réel tel que $|x| \leqslant \varepsilon$ pour tout réel $\varepsilon > 0$. Montrer que $x = 0$.

    **5.** Soit $r$ un rationnel et $x$ un irrationnel. Montrer que $r + x$ est irrationnel, puis que $rx$ l'est aussi lorsque $r \neq 0$. La somme de deux irrationnels est-elle toujours irrationnelle ? Et leur produit ?
  corrige: |
    **1.** On démontre la contraposée : si $n$ est impair, alors $8$ divise $n^{2} - 1$. Écrivons $n = 2k + 1$ avec $k \in \mathbb{Z}$ : 
    $$n^{2} - 1 = 4k^{2} + 4k = 4k(k+1)$$
     Des deux entiers consécutifs $k$ et $k + 1$, l'un est pair, donc $k(k+1)$ est pair et $4k(k+1)$ est divisible par $8$. 
    $$\boxed{n \text{ impair} \Rightarrow 8 \mid n^{2} - 1, \text{ ce qui est la contraposée demandée.}}$$

    **2.** Les réels $\ln 2$ et $\ln 3$ sont strictement positifs. Supposons par l'absurde que $\frac{\ln 2}{\ln 3} = \frac{p}{q}$ avec $p$, $q$ entiers naturels non nuls. Alors $q \ln 2 = p \ln 3$, soit $\ln(2^{q}) = \ln(3^{p})$, et donc $2^{q} = 3^{p}$ puisque $\ln$ est strictement croissante. Or $2^{q}$ est pair car $q \geqslant 1$, tandis que $3^{p}$ est impair : contradiction. 
    $$\boxed{\frac{\ln 2}{\ln 3} \text{ est irrationnel.}}$$

    *Piège :* il faut justifier que l'on peut prendre $p$ et $q$ positifs ; c'est le signe du quotient qui le permet.

    **3.** Supposons par l'absurde que $a_{k} < \frac{1}{5}$ pour tout $k$. En additionnant ces cinq inégalités strictes, on obtient $a_{1} + \dots + a_{5} < 1$, ce qui contredit l'hypothèse. 
    $$\boxed{\text{L'un des } a_{k} \text{ est supérieur ou égal à } \tfrac{1}{5}.}$$
     C'est une version du principe des tiroirs : une quantité répartie en cinq parts en possède au moins une qui atteint la moyenne.

    **4.** Raisonnons par contraposition : si $x \neq 0$, le réel $\varepsilon = \frac{|x|}{2}$ est strictement positif et vérifie $|x| > \varepsilon$. Ainsi l'hypothèse « $|x| \leqslant \varepsilon$ pour tout $\varepsilon > 0$ » est fausse. 
    $$\boxed{x = 0}$$
     Ce résultat est l'outil standard pour démontrer une égalité en analyse : on montre que $|a - b|$ est plus petit que tout réel strictement positif. C'est lui qui sert à la question 2 de l'exercice 9.

    **5.** Supposons par l'absurde que $r + x$ soit un rationnel $s$. Alors $x = s - r$ est une différence de rationnels, donc un rationnel : contradiction. De même, si $r \neq 0$ et si $rx$ est un rationnel $s$, alors $x = \frac{s}{r}$ est rationnel : contradiction. 
    $$\boxed{r + x \text{ est irrationnel, et } rx \text{ aussi lorsque } r \neq 0.}$$
     La somme et le produit de deux irrationnels ne sont pas toujours irrationnels. Le réel $\sqrt{2}$ est irrationnel (théorème 1 du cours), donc $-\sqrt{2}$ aussi d'après ce qui précède avec $r = -1$ ; or $\sqrt{2} + (-\sqrt{2}) = 0$ et $\sqrt{2} \times \sqrt{2} = 2$ sont rationnels. 
    $$\boxed{\text{Non dans les deux cas : } \sqrt{2} + (-\sqrt{2}) = 0 \text{ et } \sqrt{2} \times \sqrt{2} = 2.}$$
     Ils peuvent aussi l'être : $\sqrt{2} + \sqrt{2} = 2\sqrt{2}$ est irrationnel. L'hypothèse $r \neq 0$ était indispensable, puisque $0 \times x = 0$.
- id: "ma-01-12"
  feuille: "f-ma-01"
  numero: 12
  partie: "Modes de raisonnement"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [modes de raisonnement, contre-exemple, divisibilité]
  noeuds: [l-connecteurs, z-division]
  notions: []
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Chacune des affirmations suivantes est fausse. Le démontrer à l'aide d'un contre-exemple aussi simple que possible.

    **1.** Pour tout réel $x$, $x^{2} > x$.

    **2.** Pour tous réels $a$ et $b$, $|a + b| = |a| + |b|$.

    **3.** Si un entier est divisible par $4$ et par $6$, alors il est divisible par $24$.

    **4.** Pour tout entier naturel $n$, l'entier $n^{2} + n + 41$ est premier.

    **5.** Si une fonction $f : \mathbb{R} \to \mathbb{R}$ est croissante sur $]-\infty\,,0[$ et sur $[0\,,+\infty[$, alors elle est croissante sur $\mathbb{R}$.

    Pour l'affirmation 4, combien de valeurs de $n$ faut-il tester avant de trouver un contre-exemple ? Pour l'affirmation 5, le résultat devient-il vrai si l'on remplace $]-\infty\,,0[$ par $]-\infty\,,0]$ ?
  corrige: |
    **1.** Pour $x = 0$, l'inégalité $0^{2} > 0$ est fausse. 
    $$\boxed{x = 0}$$

    **2.** Pour $a = 1$ et $b = -1$, on a $|a + b| = 0$ alors que $|a| + |b| = 2$. 
    $$\boxed{(a,b) = (1,-1)}$$

    **3.** L'entier $12$ est divisible par $4$ et par $6$, mais pas par $24$. 
    $$\boxed{12}$$
     Le bon énoncé fait intervenir le PPCM : un entier divisible par $4$ et par $6$ est divisible par $\mathrm{ppcm}(4,6) = 12$, et pas davantage. On le verra au chapitre 12.

    **4.** Pour $n = 40$ : 
    $$40^{2} + 40 + 41 = 1\,681 = 41^{2}$$
     qui n'est pas premier. 
    $$\boxed{n = 40}$$
     Pour $n = 0$, $1$, …, $39$, l'entier $n^{2} + n + 41$ est premier : il faut donc tester $41$ valeurs avant de trouver le premier contre-exemple. On pouvait pourtant le trouver sans calcul, en remarquant que pour $n = 41$ les trois termes $41^{2}$, $41$ et $41$ sont divisibles par $41$.

    *À retenir :* vérifier une affirmation sur quarante cas ne prouve rien. Une affirmation universelle se démontre ; un seul contre-exemple suffit à la réfuter, et le chercher par la réflexion est souvent plus efficace que par le calcul.

    **5.** Soit $f$ la fonction égale à $1$ sur $]-\infty\,,0[$ et à $0$ sur $[0\,,+\infty[$. Elle est constante, donc croissante, sur chacun des deux intervalles, mais $f(-1) = 1 > 0 = f(0)$. 
    $$\boxed{f = 1 \text{ sur } ]-\infty\,,0[ \text{ et } f = 0 \text{ sur } [0\,,+\infty[}$$
     Avec $]-\infty\,,0]$, le résultat devient vrai. Soit $x < y$ deux réels. Si $x$ et $y$ sont dans un même intervalle, on conclut directement. Sinon, $x < 0 < y$, et l'on passe par le point commun $0$ : $f(x) \leqslant f(0)$ par croissance sur $]-\infty\,,0]$, puis $f(0) \leqslant f(y)$ par croissance sur $[0\,,+\infty[$. 
    $$\boxed{\text{Oui : le point commun } 0 \text{ sert de relais entre les deux intervalles.}}$$
- id: "ma-01-13"
  feuille: "f-ma-01"
  numero: 13
  partie: "Modes de raisonnement"
  etoiles: 1
  types: [Calcul]
  mots_cles: [modes de raisonnement, divisibilité, suites]
  noeuds: [l-connecteurs, z-division, ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Voici des extraits de démonstrations portant sur des notions qui ne seront étudiées que plus tard. Sans chercher à comprendre de quoi il est question, identifier le mode de raisonnement employé dans chacun d'eux, en citant les mots qui le signalent.

    **1.** *« Supposons que l'ensemble des nombres premiers congrus à $3$ modulo $4$ soit fini, et notons $p_{1}$, …, $p_{r}$ ses éléments. L'entier $N = 4p_{1} \cdots p_{r} - 1$ possède alors un facteur premier congru à $3$ modulo $4$, qui ne peut être aucun des $p_{i}$. C'est impossible. »*

    **2.** *« Si la suite $(u_{n})$ ne tend pas vers $0$, les sommes partielles $u_{0} + \dots + u_{n}$ ne forment pas une suite de Cauchy ; la série $\sum u_{n}$ diverge donc. Ainsi, la convergence de la série entraîne que $u_{n} \to 0$. »*

    **3.** *« Si $p = 2$, le résultat se vérifie directement sur les quatre éléments de $\mathbb{Z}/4\mathbb{Z}$. On peut donc supposer $p$ impair, et alors… »*

    **4.** *« Supposons que $f = g + h$, avec $g$ paire et $h$ impaire. Alors $f(-x) = g(x) - h(x)$, d'où nécessairement $g(x) = \frac{f(x) + f(-x)}{2}$ et $h(x) = \frac{f(x) - f(-x)}{2}$. Réciproquement, les fonctions ainsi définies conviennent. »*

    **5.** *« On raisonne sur la dimension $n$ de l'espace. Pour $n = 1$, toute matrice est diagonale. Supposons le résultat établi pour les espaces de dimension $n - 1$, et soit $u$ un endomorphisme d'un espace de dimension $n$… »*

    **6.** *« Si $A$ est inversible, alors $\det(A)\det(A^{-1}) = \det(I_{n}) = 1$, donc $\det(A) \neq 0$. Inversement, si $\det(A) \neq 0$, la comatrice fournit un inverse de $A$. »*
  corrige: |
    **1.** $\boxed{\text{Raisonnement par l'absurde}}$ : on suppose le contraire de ce que l'on veut établir (« supposons que l'ensemble… soit fini ») et l'on aboutit à « c'est impossible ». C'est la structure de la démonstration d'Euclide de l'infinitude des nombres premiers.

    **2.** $\boxed{\text{Raisonnement par contraposée}}$ : pour montrer « la série converge $\Rightarrow u_{n} \to 0$ », on montre « $u_{n} \not\to 0 \Rightarrow$ la série diverge ». Le mot « Ainsi » final reformule le résultat sous sa forme directe.

    **3.** $\boxed{\text{Disjonction de cas}}$ : le cas $p = 2$ est traité à part, puis « on peut donc supposer » annonce le cas restant, $p$ impair.

    **4.** $\boxed{\text{Analyse-synthèse}}$ : on suppose l'objet trouvé, on en déduit sa seule forme possible (« nécessairement »), puis « Réciproquement » ouvre la synthèse. L'analyse établit l'unicité de la décomposition, la synthèse son existence.

    **5.** $\boxed{\text{Raisonnement par récurrence}}$ sur la dimension : initialisation pour $n = 1$, puis « supposons le résultat établi » au rang $n - 1$ pour l'établir au rang $n$.

    **6.** $\boxed{\text{Double implication}}$ : une équivalence est démontrée en deux sens, signalés par « Si… alors » puis « Inversement ».

    *À retenir :* une démonstration bien rédigée annonce son mode de raisonnement dès sa première phrase. Le lecteur sait alors ce qui est supposé, ce qui est visé, et peut suivre sans se perdre : c'est cette discipline qu'il faut adopter dans les copies.
- id: "ma-01-14"
  feuille: "f-ma-01"
  numero: 14
  partie: "Modes de raisonnement"
  etoiles: 1
  types: [Conjecture, Démonstration]
  mots_cles: [modes de raisonnement, divisibilité]
  noeuds: [l-connecteurs, z-division]
  notions: []
  page_enonce: 5
  page_corrige: 10
  enonce: |
    La *conjecture de Goldbach forte* affirme que tout entier pair supérieur ou égal à $4$ est la somme de deux nombres premiers. La *conjecture de Goldbach faible* affirme que tout entier impair supérieur ou égal à $7$ est la somme de trois nombres premiers.

    **1.** Montrer que la conjecture forte entraîne la conjecture faible.

    **2.** En 2013, Harald Helfgott a annoncé une démonstration de la conjecture faible. En admettant cette démonstration, que peut-on en déduire sur la conjecture forte ?
  corrige: |
    **1.** Supposons la conjecture forte vraie, et soit $n \geqslant 7$ un entier impair. L'entier $n - 3$ est pair et supérieur ou égal à $4$ : d'après la conjecture forte, il s'écrit $n - 3 = p + q$ avec $p$ et $q$ premiers. Alors $n = 3 + p + q$ est somme de trois nombres premiers. 
    $$\boxed{\text{Goldbach forte} \Rightarrow \text{Goldbach faible.}}$$

    **2.** Savoir que la conclusion d'une implication est vraie ne renseigne en rien sur son hypothèse : l'implication « forte $\Rightarrow$ faible » est vraie aussi bien si la conjecture forte est vraie que si elle est fausse. 
    $$\boxed{\text{On ne peut rien en déduire sur la conjecture forte.}}$$
     *Piège :* conclure que la conjecture forte est vraie serait confondre une implication et sa réciproque, comme dans la tâche de Wason de l'exercice 2. La conjecture de Goldbach forte, énoncée en 1742, reste ouverte ; la démonstration de Helfgott de la conjecture faible, annoncée en 2013, est en cours de relecture en vue de sa publication définitive.
- id: "ma-01-15"
  feuille: "f-ma-01"
  numero: 15
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de raisonnement, divisibilité, suites]
  noeuds: [l-connecteurs, z-division, ar-suites]
  notions: [suite]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Montrer que pour tout entier relatif $n$, l'entier $n(n+1)(2n+1)$ est divisible par $6$.

    **2.** Résoudre dans $\mathbb{R}$ l'inéquation $|x + 1| - |2x - 3| \geqslant 1$.

    **3.** Soit $x$ et $y$ deux réels. Montrer que $\max(x,y) = \dfrac{x + y + |x - y|}{2}$, puis exprimer de même $\min(x,y)$. Proposer ensuite une expression de $\max(x,y,z)$ à l'aide de valeurs absolues, pour trois réels $x$, $y$, $z$.
  corrige: |
    **1.** Il suffit de montrer que $N = n(n+1)(2n+1)$ est divisible par $2$ et par $3$ : comme $2$ et $3$ sont premiers entre eux, $N$ sera alors divisible par $6$ (lemme de Gauss, vu en mathématiques expertes). Parmi $n$ et $n + 1$, l'un est pair, donc $2 \mid N$. Pour la divisibilité par $3$, on distingue les trois restes possibles de $n$ modulo $3$ :

    • si $n \equiv 0 \;[3]$, alors $3 \mid n$ ;

    • si $n \equiv 1 \;[3]$, alors $2n + 1 \equiv 3 \equiv 0 \;[3]$ ;

    • si $n \equiv 2 \;[3]$, alors $n + 1 \equiv 0 \;[3]$.

    $$\boxed{6 \mid n(n+1)(2n+1) \text{ pour tout } n \in \mathbb{Z}}$$
     Cette divisibilité n'est pas un hasard : le chapitre 3 établira que $\frac{n(n+1)(2n+1)}{6}$ est la somme $1^{2} + 2^{2} + \dots + n^{2}$.

    **2.** Les valeurs absolues changent d'expression en $-1$ et en $\frac{3}{2}$, ce qui conduit à trois cas, qui recouvrent $\mathbb{R}$.

    • Si $x \leqslant -1$ : l'inéquation s'écrit $-(x+1) - (3 - 2x) \geqslant 1$, soit $x - 4 \geqslant 1$, c'est-à-dire $x \geqslant 5$ ; aucune solution dans ce cas.

    • Si $-1 \leqslant x \leqslant \frac{3}{2}$ : elle s'écrit $(x + 1) - (3 - 2x) \geqslant 1$, soit $3x \geqslant 3$ ; solutions $\big[1\,,\frac{3}{2}\big]$.

    • Si $x \geqslant \frac{3}{2}$ : elle s'écrit $(x + 1) - (2x - 3) \geqslant 1$, soit $x \leqslant 3$ ; solutions $\big[\frac{3}{2}\,,3\big]$.

    $$\boxed{S = [1\,,3]}$$
     Vérification aux bornes : $|2| - |{-1}| = 1$ et $|4| - |3| = 1$. ✓

    **3.** Si $x \geqslant y$, alors $|x - y| = x - y$ et $\frac{x + y + (x - y)}{2} = x = \max(x,y)$ ; si $x < y$, alors $|x - y| = y - x$ et l'on obtient $y$. En remplaçant $+|x-y|$ par $-|x-y|$, le même calcul donne le minimum : 
    $$\boxed{\max(x,y) = \frac{x + y + |x - y|}{2}} \qquad \boxed{\min(x,y) = \frac{x + y - |x - y|}{2}}$$
     Pour trois réels, on utilise $\max(x,y,z) = \max\big(\max(x,y), z\big)$. En notant $m = \max(x,y)$, on obtient $\frac{m + z + |m - z|}{2}$, puis en remplaçant $m$ : 
    $$\boxed{\max(x,y,z) = \frac{x + y + 2z + |x - y| + \big|x + y - 2z + |x - y|\big|}{4}}$$
     Cette formule a été contrôlée numériquement sur de nombreux triplets. Elle n'est pas symétrique en apparence, alors que $\max(x,y,z)$ l'est : il en existe donc d'autres écritures, obtenues en regroupant différemment.
- id: "ma-01-16"
  feuille: "f-ma-01"
  numero: 16
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Lecture graphique, Démonstration]
  mots_cles: [modes de raisonnement, quantificateurs, suites]
  noeuds: [l-connecteurs, l-syntaxe, ar-suites]
  notions: [quantificateur, suite]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $(u_{n})_{n \in \mathbb{N}}$ une suite réelle. Montrer que les assertions suivantes sont équivalentes : 
    $$\text{(i)}\ \ \forall A \in \mathbb{R},\ \exists n \in \mathbb{N},\ u_{n} \geqslant A \qquad\qquad \text{(ii)}\ \ \forall A \in \mathbb{R},\ \exists n \in \mathbb{N},\ u_{n} > A.$$

    **2.** Soit $f$ une fonction de $\mathbb{R}$ dans $\mathbb{R}$. On rappelle que $f$ est strictement croissante si $\forall (x,y) \in \mathbb{R}^{2},\ x < y \Rightarrow f(x) < f(y)$. Montrer que $f$ est strictement croissante si et seulement si 
    $$\forall (a,b) \in \mathbb{R}^{2},\ \big(a \leqslant b \Leftrightarrow f(a) \leqslant f(b)\big).$$

    **3.** Soit $a$ et $b$ deux réels. Montrer que l'assertion $\forall x \in \,]0\,,1[,\ ax + b \geqslant 0$ équivaut à $(b \geqslant 0 \ \mathrm{et}\ a + b \geqslant 0)$. Interpréter graphiquement.
  corrige: |
    **1.** *(ii) $\Rightarrow$ (i).* Soit $A \in \mathbb{R}$ ; (ii) fournit $n$ tel que $u_{n} > A$, donc $u_{n} \geqslant A$.

    *(i) $\Rightarrow$ (ii).* Soit $A \in \mathbb{R}$. On applique (i) au réel $A + 1$ : il existe $n$ tel que $u_{n} \geqslant A + 1 > A$. 
    $$\boxed{\text{(i)} \iff \text{(ii)} : \text{ ces deux assertions traduisent que } (u_{n}) \text{ n'est pas majorée.}}$$
     Le procédé est à retenir : pour passer d'une inégalité large à une inégalité stricte, on applique l'hypothèse universelle à une valeur légèrement décalée.

    **2.** *Sens direct.* Supposons $f$ strictement croissante et soit $a$, $b$ deux réels. Si $a \leqslant b$, alors soit $a = b$ et $f(a) = f(b)$, soit $a < b$ et $f(a) < f(b)$ ; dans les deux cas, $f(a) \leqslant f(b)$. Réciproquement, montrons $f(a) \leqslant f(b) \Rightarrow a \leqslant b$ par contraposée : si $a > b$, alors $f(a) > f(b)$.

    *Sens réciproque.* Supposons la condition vérifiée et soit $x < y$. Comme $x \leqslant y$, on a $f(x) \leqslant f(y)$. Si l'on avait $f(x) = f(y)$, alors $f(y) \leqslant f(x)$, et la condition appliquée à $(a,b) = (y,x)$ donnerait $y \leqslant x$ : c'est faux. Donc $f(x) < f(y)$. 
    $$\boxed{f \text{ strictement croissante} \iff \forall (a,b) \in \mathbb{R}^{2},\ \big(a \leqslant b \Leftrightarrow f(a) \leqslant f(b)\big)}$$
     Une fonction strictement croissante est donc exactement une fonction qui « préserve et reflète » l'ordre : on peut appliquer $f$ aux deux membres d'une inégalité, mais aussi la « retirer ». C'est ce que l'on fait, sans le dire, en résolvant $\mathrm{e}^{x} \leqslant \mathrm{e}^{2}$.

    **3.** *Sens réciproque.* Supposons $b \geqslant 0$ et $a + b \geqslant 0$. Pour tout $x \in \,]0\,,1[$, 
    $$ax + b = (1 - x)\,b + x\,(a + b) \geqslant 0,$$
     comme somme de deux produits de réels positifs.

    *Sens direct*, par contraposée. Supposons d'abord $b < 0$. Si $a \leqslant 0$, alors $ax + b \leqslant b < 0$ pour tout $x \in \,]0\,,1[$, par exemple pour $x = \frac{1}{2}$. Si $a > 0$, le réel $x = \min\big(\frac{1}{2}\,,-\frac{b}{2a}\big)$ appartient à $]0\,,1[$ et vérifie $ax \leqslant -\frac{b}{2}$, donc $ax + b \leqslant \frac{b}{2} < 0$. Supposons maintenant $a + b < 0$. En posant $t = 1 - x$, qui parcourt aussi $]0\,,1[$, on a $ax + b = (-a)\,t + (a + b)$ : c'est une expression de la même forme, de coefficients $a' = -a$ et $b' = a + b < 0$, et le cas précédent fournit un $t$ qui la rend strictement négative. 
    $$\boxed{\big(\forall x \in \,]0\,,1[,\ ax + b \geqslant 0\big) \iff \big(b \geqslant 0 \ \mathrm{et}\ a + b \geqslant 0\big)}$$
     Graphiquement, le segment de droite d'équation $y = ax + b$ au-dessus de $]0\,,1[$ est au-dessus de l'axe des abscisses si et seulement si ses deux extrémités, d'ordonnées $b$ et $a + b$, le sont. L'identité $ax + b = (1 - x)b + x(a + b)$ exprime que chaque point du segment est un barycentre à coefficients positifs de ses extrémités.
- id: "ma-01-17"
  feuille: "f-ma-01"
  numero: 17
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [modes de raisonnement, analyse-synthèse]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Déterminer toutes les fonctions $f : \mathbb{R} \to \mathbb{R}$ vérifiant chacune des conditions suivantes.

    **1.** Pour tous réels $x$ et $y$ : $f(x + y) = f(x) + y$.

    **2.** Pour tous réels $x$ et $y$ : $f(x)\,f(y) - f(xy) = x + y$.

    **3.** Pour tout réel $x$ : $f(x) + x\,f(-x) = 1 + x$.

    **4.** Pour tous réels $x$ et $y$ : $f\big(y - f(x)\big) = 2 - x - y$.
  corrige: |
    Chaque question se traite par analyse-synthèse : on remplace les variables par des valeurs bien choisies pour obtenir des conditions nécessaires, puis on vérifie les candidats.

    **1.** *Analyse.* Soit $f$ une solution. Avec $x = 0$, on obtient $f(y) = f(0) + y$ pour tout réel $y$ : en notant $c = f(0)$, la fonction $f$ est $y \mapsto y + c$.

    *Synthèse.* Pour $f(x) = x + c$, on a $f(x + y) = x + y + c = f(x) + y$. 
    $$\boxed{\text{Les solutions sont les fonctions } x \mapsto x + c, \ c \in \mathbb{R}.}$$
     L'analyse laisse ici un paramètre libre : la synthèse montre qu'il ne faut pas le fixer, toutes les valeurs convenant.

    **2.** *Analyse.* Soit $f$ une solution. Avec $x = y = 0$, on obtient $f(0)^{2} - f(0) = 0$, donc $f(0) \in \{0\,,1\}$. Si $f(0) = 0$, alors avec $y = 0$ : $f(x)f(0) - f(0) = x$, soit $0 = x$ pour tout réel $x$, ce qui est absurde. Donc $f(0) = 1$, et avec $y = 0$ : $f(x) - 1 = x$, c'est-à-dire $f(x) = x + 1$.

    *Synthèse.* Pour $f(x) = x + 1$ : $(x+1)(y+1) - (xy + 1) = x + y$. 
    $$\boxed{f(x) = x + 1}$$

    **3.** *Analyse.* Soit $f$ une solution et $x$ un réel. En remplaçant $x$ par $-x$, on obtient une seconde équation, et l'on dispose du système : 
    $$\left\{ \begin{array}{l} f(x) + x\,f(-x) = 1 + x \\ f(-x) - x\,f(x) = 1 - x \end{array} \right.$$
     On tire $f(-x) = 1 - x + x f(x)$ de la seconde et on l'injecte dans la première : 
    $$f(x) + x(1 - x) + x^{2} f(x) = 1 + x, \qquad\text{soit}\qquad (1 + x^{2})\,f(x) = 1 + x^{2}$$
     Comme $1 + x^{2} \neq 0$, on obtient $f(x) = 1$.

    *Synthèse.* La fonction constante égale à $1$ vérifie $1 + x \times 1 = 1 + x$. 
    $$\boxed{f = 1 \text{ est l'unique solution.}}$$

    **4.** *Analyse.* Soit $f$ une solution. Avec $y = f(x)$, on obtient $f(0) = 2 - x - f(x)$, donc $f(x) = 2 - x - f(0)$ pour tout réel $x$. En particulier, pour $x = 0$ : $f(0) = 2 - f(0)$, d'où $f(0) = 1$ et $f(x) = 1 - x$.

    *Synthèse.* Pour $f(x) = 1 - x$ : $f\big(y - (1 - x)\big) = 1 - (y - 1 + x) = 2 - x - y$. 
    $$\boxed{f(x) = 1 - x}$$

    *À retenir :* le choix des valeurs substituées est le cœur de l'analyse. On cherche à annuler un terme ($x = 0$, $y = 0$), à faire apparaître une valeur connue ($y = f(x)$ rend l'argument nul), ou à exploiter une symétrie ($x \to -x$). Et l'on n'oublie jamais la synthèse, comme le rappelle la dernière remarque de la section 1.4.5 du cours.
