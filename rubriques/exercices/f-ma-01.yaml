  page_enonce: 7
  page_corrige: 15
  enonce: |
    Chacune des deux démonstrations suivantes établit un résultat manifestement faux. Localiser précisément l'erreur.

    **1.** *« Montrons que pour tout $n \geqslant 1$, l'assertion $P(n)$ : « $n$ points quelconques du plan sont toujours alignés » est vraie. $P(1)$ est évidente. Soit $n \geqslant 1$ tel que $P(n)$ soit vraie, et soit $M_{1}$, …, $M_{n+1}$ des points du plan. D'après $P(n)$, les points $M_{1}$, …, $M_{n}$ sont alignés sur une droite $D$, et les points $M_{2}$, …, $M_{n+1}$ sur une droite $D'$. Les droites $D$ et $D'$ contiennent toutes deux les points $M_{2}$, …, $M_{n}$ : elles sont donc égales, et les $n+1$ points sont alignés. »*

    Pour quelles valeurs de $n$ l'argument d'hérédité est-il incorrect ? L'implication $P(n) \Rightarrow P(n+1)$ est-elle fausse pour ces valeurs, ou seulement mal démontrée ?

    **2.** *« Montrons par récurrence forte que $2^{n} = 1$ pour tout $n \in \mathbb{N}$. C'est vrai pour $n = 0$. Soit $n \in \mathbb{N}$ tel que $2^{k} = 1$ pour tout $k \in [\![0\,;n]\!]$. Alors $2^{n+1} = \dfrac{2^{n} \times 2^{n}}{2^{n-1}} = \dfrac{1 \times 1}{1} = 1$. »*
  corrige: |
    **1.** L'argument suppose que $D$ et $D'$ ont au moins deux points communs distincts, car deux points distincts déterminent une droite. Les points communs annoncés sont $M_{2}$, …, $M_{n}$.

    • Pour $n = 1$, cette liste est vide : $D$ et $D'$ n'ont aucun point commun garanti.

    • Pour $n = 2$, elle se réduit à $M_{2}$ : un seul point ne détermine pas une droite, et $D$ et $D'$ peuvent être distinctes.

    $$\boxed{\text{L'argument d'hérédité est incorrect pour } n = 1 \text{ et } n = 2.}$$
     Les deux cas ne sont pas de même nature. Pour $n = 1$, l'implication $P(1) \Rightarrow P(2)$ est *vraie*, puisque deux points sont toujours alignés : elle est seulement mal démontrée. Pour $n = 2$, l'implication $P(2) \Rightarrow P(3)$ est *fausse*, puisque $P(2)$ est vraie et $P(3)$ fausse : c'est là que la démonstration s'effondre. 
    $$\boxed{P(2) \Rightarrow P(3) \text{ est fausse : c'est le maillon manquant.}}$$

    *À retenir :* pour $n \geqslant 3$, l'implication $P(n) \Rightarrow P(n+1)$ est vraie, mais pour une raison inattendue : son hypothèse $P(n)$ est fausse. Une hérédité vraie ne garantit donc rien tant que la chaîne n'est pas complète depuis l'initialisation ; c'est la même leçon que l'exemple $10^{n} + 1$ du cours, vue sous un autre angle. Signalons enfin que l'argument suppose aussi les points $M_{2}$, …, $M_{n}$ non tous confondus.

    **2.** Pour $n = 0$, le calcul fait intervenir $2^{n-1} = 2^{-1}$, c'est-à-dire l'entier $k = -1$, qui n'appartient pas à $[\![0\,;n]\!] = \{0\}$ : l'hypothèse de récurrence ne dit rien de $2^{-1}$, qui vaut d'ailleurs $\frac{1}{2}$. 
    $$\boxed{\text{Le passage de } P(0) \text{ à } P(1) \text{ n'est pas justifié, et il est faux : } 2^{1} = 2.}$$
     Pour $n \geqslant 1$, le calcul est correct, mais l'hypothèse est fausse : on retrouve la situation de la question précédente.
