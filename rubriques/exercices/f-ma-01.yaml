  enonce: |
    **1.** Montrer que $\big\{(x,y) \in \mathbb{R}^{2} \mid 3x - y = 2\big\} = \big\{(t + 1\,,\,3t + 1) \mid t \in \mathbb{R}\big\}$.

    **2.** Montrer que $\{7a + 12b \mid (a,b) \in \mathbb{Z}^{2}\} = \mathbb{Z}$, puis déterminer l'ensemble $\{6a + 10b \mid (a,b) \in \mathbb{Z}^{2}\}$.

    **3.** Déterminer les ensembles suivants, en justifiant chaque égalité par une double inclusion : 
    $$\bigcup_{n \geqslant 1} \left[\frac{1}{n}\,,n\right], \qquad \bigcap_{n \geqslant 1} \left[-\frac{1}{n}\,,1 + \frac{1}{n}\right[, \qquad \bigcap_{n \in \mathbb{N}} \,[n\,,+\infty[, \qquad \bigcup_{n \geqslant 1} \left]-\infty\,,1 - \frac{1}{n}\right].$$
  corrige: |
    **1.** Notons $\mathcal{D}$ le premier ensemble et $\mathcal{D}'$ le second.

    *Inclusion $\mathcal{D} \subset \mathcal{D}'$.* Soit $(x,y) \in \mathcal{D}$. Posons $t = x - 1$ ; alors $x = t + 1$ et $y = 3x - 2 = 3t + 1$, donc $(x,y) \in \mathcal{D}'$.

    *Inclusion $\mathcal{D}' \subset \mathcal{D}$.* Pour tout réel $t$, $3(t+1) - (3t + 1) = 2$. 
    $$\boxed{\mathcal{D} = \mathcal{D}'}$$
     Les deux écritures décrivent la même droite du plan, l'une par une équation cartésienne, l'autre par une représentation paramétrique.

    **2.** L'inclusion $\{7a + 12b\} \subset \mathbb{Z}$ est claire. Réciproquement, on remarque que $7 \times (-5) + 12 \times 3 = 1$, donc tout entier $n$ s'écrit $n = 7 \times (-5n) + 12 \times (3n)$. 
    $$\boxed{\{7a + 12b \mid (a,b) \in \mathbb{Z}^{2}\} = \mathbb{Z}}$$
     Pour le second ensemble, tout élément $6a + 10b = 2(3a + 5b)$ est pair. Réciproquement $6 \times 2 + 10 \times (-1) = 2$, donc $2k = 6 \times (2k) + 10 \times (-k)$ pour tout $k \in \mathbb{Z}$. 
    $$\boxed{\{6a + 10b \mid (a,b) \in \mathbb{Z}^{2}\} = 2\mathbb{Z}}$$
     Dans les deux cas, on obtient l'ensemble des multiples du PGCD : $\mathrm{pgcd}(7,12) = 1$ et $\mathrm{pgcd}(6,10) = 2$. Ce fait général sera établi aux chapitres 11 et 12.

    **3.** Les deux sens de la propriété d'Archimède servent ici : pour tout réel $x > 0$, il existe $n \geqslant 1$ tel que $\frac{1}{n} < x$ ; et, en l'appliquant à $\frac{1}{x}$, il existe $n \geqslant 1$ tel que $n > x$.

    *Premier ensemble.* Chaque $\left[\frac{1}{n}\,,n\right]$ est inclus dans $]0\,,+\infty[$. Réciproquement, soit $x > 0$ ; il existe $n_{1}$ tel que $\frac{1}{n_{1}} < x$ et $n_{2}$ tel que $n_{2} > x$. Pour $n = \max(n_{1}, n_{2})$, on a $\frac{1}{n} \leqslant \frac{1}{n_{1}} < x < n_{2} \leqslant n$. 
    $$\boxed{\bigcup_{n \geqslant 1} \left[\frac{1}{n}\,,n\right] = \,]0\,,+\infty[}$$
     *Piège :* il faut un même entier $n$ pour les deux bornes ; on le prend assez grand pour les deux, ce que permet l'emboîtement des intervalles.

    *Deuxième ensemble.* Si $x \in [0\,,1]$, alors $-\frac{1}{n} < 0 \leqslant x \leqslant 1 < 1 + \frac{1}{n}$ pour tout $n$. Réciproquement, soit $x$ appartenant à tous les intervalles. Si $x < 0$, il existe $n$ tel que $\frac{1}{n} < -x$, soit $x < -\frac{1}{n}$ : contradiction. Si $x > 1$, il existe $n$ tel que $\frac{1}{n} < x - 1$, soit $x > 1 + \frac{1}{n}$ : contradiction. 
    $$\boxed{\bigcap_{n \geqslant 1} \left[-\frac{1}{n}\,,1 + \frac{1}{n}\right[ = [0\,,1]}$$

    *Troisième ensemble.* Un réel $x$ appartenant à tous les $[n\,,+\infty[$ vérifierait $x \geqslant n$ pour tout $n$, ce qui est impossible puisqu'il existe un entier $n > x$. 
    $$\boxed{\bigcap_{n \in \mathbb{N}} \,[n\,,+\infty[ \; = \varnothing}$$

    *Quatrième ensemble.* Chaque intervalle est inclus dans $]-\infty\,,1[$. Réciproquement, si $x < 1$, il existe $n$ tel que $\frac{1}{n} < 1 - x$, soit $x < 1 - \frac{1}{n}$. 
    $$\boxed{\bigcup_{n \geqslant 1} \left]-\infty\,,1 - \frac{1}{n}\right] = \,]-\infty\,,1[}$$

    *À retenir :* comme le signalait le cours, les bornes « passent mal à la limite » : une intersection d'intervalles semi-ouverts peut être fermée, une réunion d'intervalles fermés peut être ouverte, et une intersection de parties non vides emboîtées peut être vide.
- id: "ma-01-32"
  feuille: "f-ma-01"
  numero: 32
  partie: "Ensembles"
