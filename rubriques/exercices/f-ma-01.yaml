- id: "ma-01-01"
  feuille: "f-ma-01"
  numero: 1
  partie: "Assertions et connecteurs logiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [connecteurs et tables de vérité]
  noeuds: [l-connecteurs, l-tautologies]
  notions: [connecteur]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $P$, $Q$, $R$ trois assertions. Parmi les assertions suivantes, déterminer celles qui sont vraies quelles que soient les valeurs de vérité de $P$, $Q$ et $R$. Pour chacune des autres, donner des valeurs de $P$, $Q$, $R$ qui la rendent fausse.

    **(a)** $(P \Rightarrow Q) \ \mathrm{ou}\ (Q \Rightarrow P)$

    **(b)** $\big(P \Rightarrow (Q \Rightarrow R)\big) \Leftrightarrow \big((P \ \mathrm{et}\ Q) \Rightarrow R\big)$

    **(c)** $\big((P \Rightarrow Q) \Rightarrow R\big) \Leftrightarrow \big(P \Rightarrow (Q \Rightarrow R)\big)$

    **(d)** $\big((P \Rightarrow Q) \ \mathrm{et}\ (P \Rightarrow \mathrm{non}\, Q)\big) \Leftrightarrow \mathrm{non}\, P$

    **(e)** $(P \Rightarrow Q) \Rightarrow \big((P \ \mathrm{ou}\ R) \Rightarrow (Q \ \mathrm{ou}\ R)\big)$

    **2.** L'une des assertions précédentes justifie un mode de raisonnement du cours. Lequel ?

    **3.** Sur une île, chaque habitant est soit un *chevalier*, qui dit toujours la vérité, soit un *fripon*, qui ment toujours. Deux habitants $A$ et $B$ déclarent :

    $A$ : « $B$ et moi sommes de même nature. » $B$ : « $A$ est un fripon. »

    En notant $a$ l'assertion « $A$ est un chevalier » et $b$ l'assertion « $B$ est un chevalier », traduire chaque déclaration par une équivalence entre $a$, $b$ et le contenu de la phrase prononcée, puis déterminer la nature de chacun.
  corrige: |
    **1.** Pour chaque assertion, on cherche les valeurs de $P$, $Q$, $R$ qui pourraient la rendre fausse : c'est plus rapide qu'une table complète à huit lignes, puisqu'une implication n'est fausse que dans un seul cas.

    **(a)** Si $P \Rightarrow Q$ est fausse, alors $P$ est vraie et $Q$ est fausse ; mais dans ce cas $Q \Rightarrow P$ est vraie. Les deux membres ne peuvent donc pas être faux simultanément. 
    $$\boxed{(P \Rightarrow Q) \ \mathrm{ou}\ (Q \Rightarrow P) \text{ est toujours vraie.}}$$

    **(b)** Le membre de gauche est faux exactement lorsque $P$ est vraie et $Q \Rightarrow R$ fausse, c'est-à-dire lorsque $P$ et $Q$ sont vraies et $R$ fausse. Le membre de droite est faux exactement lorsque $P \ \mathrm{et}\ Q$ est vraie et $R$ fausse : c'est la même situation. Les deux membres ont donc toujours la même valeur. 
    $$\boxed{\text{L'équivalence (b) est toujours vraie.}}$$

    **(c)** Prenons $P$ et $R$ fausses, et $Q$ quelconque. Alors $P \Rightarrow Q$ est vraie, donc $(P \Rightarrow Q) \Rightarrow R$ est fausse ; tandis que $P \Rightarrow (Q \Rightarrow R)$ est vraie, son hypothèse $P$ étant fausse. 
    $$\boxed{\text{(c) est fausse pour } P \text{ et } R \text{ fausses.}}$$

    **(d)** On distingue deux cas. Si $P$ est vraie, le membre de gauche vaut $Q \ \mathrm{et}\ \mathrm{non}\, Q$, qui est faux, comme $\mathrm{non}\, P$. Si $P$ est fausse, les deux implications sont vraies, et $\mathrm{non}\, P$ aussi. 
    $$\boxed{\text{L'équivalence (d) est toujours vraie.}}$$

    **(e)** Supposons $P \Rightarrow Q$ et $P \ \mathrm{ou}\ R$ vraies. Si $P$ est vraie, alors $Q$ est vraie, donc $Q \ \mathrm{ou}\ R$ aussi ; sinon $R$ est vraie, et $Q \ \mathrm{ou}\ R$ aussi. 
    $$\boxed{\text{(e) est toujours vraie.}}$$

    *Piège :* l'assertion (c) montre que l'implication n'est pas « associative ». Une écriture comme $P \Rightarrow Q \Rightarrow R$ est donc ambiguë et doit toujours être parenthésée.

    **2.** L'assertion (d) affirme que si, en supposant $P$, on aboutit à la fois à $Q$ et à $\mathrm{non}\, Q$, alors $P$ est fausse. 
    $$\boxed{\text{C'est le principe du raisonnement par l'absurde.}}$$

    **3.** Un habitant dit la vérité si et seulement si c'est un chevalier. Les deux déclarations se traduisent donc par : 
    $$a \Leftrightarrow (a \Leftrightarrow b) \qquad\text{et}\qquad b \Leftrightarrow \mathrm{non}\, a$$
     Étudions la première. Si $a$ est vraie, elle se réduit à $b$ ; si $a$ est fausse, elle s'écrit « faux $\Leftrightarrow (\text{faux} \Leftrightarrow b)$ », c'est-à-dire « faux $\Leftrightarrow \mathrm{non}\, b$ », ce qui équivaut encore à $b$. Dans tous les cas, la première déclaration impose donc que $b$ soit vraie : $B$ est un chevalier. La seconde donne alors $\mathrm{non}\, a$ vraie. 
    $$\boxed{A \text{ est un fripon et } B \text{ un chevalier.}}$$
     Vérification : $A$ ment bien en affirmant qu'ils sont de même nature, et $B$ dit vrai en affirmant que $A$ est un fripon. ✓

    *À retenir :* quelle que soit la nature de $A$, la phrase « $B$ et moi sommes de même nature » prononcée par $A$ révèle toujours que $B$ est un chevalier. C'est le genre de résultat que le calcul logique fait apparaître sans effort, et que l'intuition manque facilement.
- id: "ma-01-02"
  feuille: "f-ma-01"
  numero: 2
  partie: "Assertions et connecteurs logiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [connecteurs et tables de vérité, contraposition, divisibilité]
  noeuds: [l-connecteurs, l-tautologies, z-division]
  notions: [connecteur]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Quatre cartes portent chacune un nombre sur une face et une lettre sur l'autre. Posées sur une table, elles montrent

    [-0.5ex]0pt2.6ex A [-0.5ex]0pt2.6ex B [-0.5ex]0pt2.6ex 1 [-0.5ex]0pt2.6ex 2

    Quelles cartes faut-il retourner, et seulement celles-là, pour savoir si elles respectent la règle « au dos de chaque voyelle se trouve un nombre pair » ? Traduire la règle par une implication et expliquer la réponse à l'aide de sa contraposée.

    **2.** Après une représentation de *Pelléas et Mélisande*, un journaliste hésite entre deux rédactions :

    **(a)** « Jamais le rôle de Mélisande n'a été si bien chanté. »

    **(b)** « Jamais si jeune cantatrice, aux si beaux cheveux, n'a si bien chanté Mélisande. »

    Lequel de ces deux compliments est le plus fort ? On pourra écrire chacun d'eux sous la forme « pour toute représentation passée $r$ vérifiant…, la chanteuse de $r$ a moins bien chanté ».
  corrige: |
    **1.** La règle s'écrit, pour chaque carte : « voyelle $\Rightarrow$ pair ». Une implication n'est fausse que lorsque son hypothèse est vraie et sa conclusion fausse ; une carte ne peut donc contredire la règle que si elle porte une voyelle *et* un nombre impair. On examine chaque carte.

    • La carte A montre une voyelle : si son dos est impair, la règle est violée. Il faut la retourner.

    • La carte B montre une consonne : l'hypothèse est fausse, l'implication est vraie quel que soit le dos.

    • La carte 1 montre un nombre impair : par contraposée, la règle équivaut à « impair $\Rightarrow$ consonne », et il faut vérifier que son dos n'est pas une voyelle.

    • La carte 2 montre un nombre pair : la conclusion est vraie, donc l'implication aussi, quel que soit le dos.

    $$\boxed{\text{Il faut retourner les cartes \textsf{A} et \textsf{1}, et elles seules.}}$$
     *Piège :* dans l'expérience de Peter Wason (1966), la plupart des personnes interrogées choisissent A et 2. Retourner 2 revient à tester la réciproque « pair $\Rightarrow$ voyelle », que la règle n'affirme pas ; oublier 1, c'est oublier la contraposée, qui est pourtant équivalente à la règle.

    **2.** Notons $\mathcal{R}$ l'ensemble des représentations passées de l'opéra. Le compliment (i) affirme que pour *toute* représentation $r \in \mathcal{R}$, la chanteuse de $r$ a moins bien chanté. Le compliment (ii) affirme la même chose, mais seulement pour les représentations $r$ dont la chanteuse était au moins aussi jeune et avait d'aussi beaux cheveux : c'est une assertion universelle sur une partie $\mathcal{R}' \subset \mathcal{R}$. Or 
    $$\big(\forall r \in \mathcal{R},\ P(r)\big) \Rightarrow \big(\forall r \in \mathcal{R}',\ P(r)\big),$$
     et la réciproque est fausse en général : la chanteuse peut être surpassée par une interprète plus âgée. 
    $$\boxed{\text{Le compliment (i) est le plus fort : (i) entraîne (ii).}}$$
     *À retenir :* restreindre le domaine d'un « pour tout » affaiblit l'assertion, tandis que restreindre celui d'un « il existe » la renforce. Les adjectifs flatteurs de (ii) sont autant de restrictions : le journaliste qui les ajoute retire en réalité au compliment. L'exemple est dû à Roger Godement, dans son *Cours d'algèbre* (1963).
- id: "ma-01-03"
  feuille: "f-ma-01"
  numero: 3
  partie: "Assertions et connecteurs logiques"
  etoiles: 3
  types: [Calcul]
  mots_cles: [connecteurs et tables de vérité, tautologies, produit cartésien]
  noeuds: [l-connecteurs, l-tautologies, r-produit]
  notions: [connecteur, tautologie, produit-cartesien]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Pour deux assertions $P$ et $Q$, on note $P \uparrow Q$ l'assertion $\mathrm{non}\,(P \ \mathrm{et}\ Q)$.

    **1.** Exprimer $\mathrm{non}\, P$, puis $P \ \mathrm{et}\ Q$, $P \ \mathrm{ou}\ Q$ et $P \Rightarrow Q$, en n'utilisant que $P$, $Q$ et le seul connecteur $\uparrow$.

    **2.** Un *connecteur binaire* associe à chaque couple de valeurs de vérité de $(P,Q)$ une valeur de vérité. Combien existe-t-il de connecteurs binaires ?

    **3.** Montrer que tout connecteur binaire peut s'exprimer à l'aide de $P$, $Q$ et des seuls connecteurs « non », « et », « ou ». En déduire qu'il peut s'exprimer à l'aide du seul connecteur $\uparrow$.

    **4.** Peut-on exprimer $\mathrm{non}\, P$ à l'aide de $P$ et des seuls connecteurs « et », « ou » et $\Rightarrow$ ?
  corrige: |
    **1.** On commence par la négation, qui servira à tout le reste : 
    $$\boxed{\mathrm{non}\, P \Leftrightarrow P \uparrow P}$$
     car $\mathrm{non}\,(P \ \mathrm{et}\ P)$ a la même valeur que $\mathrm{non}\, P$. La conjonction s'obtient en niant $P \uparrow Q$, la disjonction grâce à une loi de De Morgan, et l'implication grâce au point (iv) de la proposition 1 du cours : 
    $$\boxed{P \ \mathrm{et}\ Q \Leftrightarrow (P \uparrow Q) \uparrow (P \uparrow Q)} \qquad \boxed{P \ \mathrm{ou}\ Q \Leftrightarrow (P \uparrow P) \uparrow (Q \uparrow Q)} \qquad \boxed{P \Rightarrow Q \Leftrightarrow P \uparrow (Q \uparrow Q)}$$
     Pour la disjonction : $(P \uparrow P) \uparrow (Q \uparrow Q) = \mathrm{non}\,(\mathrm{non}\, P \ \mathrm{et}\ \mathrm{non}\, Q)$, qui équivaut à $P \ \mathrm{ou}\ Q$. Pour l'implication : $P \uparrow (\mathrm{non}\, Q) = \mathrm{non}\,(P \ \mathrm{et}\ \mathrm{non}\, Q)$, qui équivaut à $P \Rightarrow Q$.

    **2.** Une table de vérité à deux variables comporte quatre lignes, et chacune peut recevoir l'une des deux valeurs **V** ou **F**, indépendamment des autres : 
    $$\boxed{2^{4} = 16 \text{ connecteurs binaires.}}$$
     Parmi eux figurent « et », « ou », $\Rightarrow$, $\Leftrightarrow$, $\uparrow$, le « ou exclusif », mais aussi des connecteurs dégénérés comme « toujours vrai » ou « valeur de $P$ ».

    **3.** Soit $c$ un connecteur binaire. S'il est toujours faux, il équivaut à $P \ \mathrm{et}\ \mathrm{non}\, P$. Sinon, à chaque ligne de sa table où il vaut **V**, on associe la conjonction qui n'est vraie que sur cette ligne : par exemple $P \ \mathrm{et}\ \mathrm{non}\, Q$ pour la ligne où $P$ est vraie et $Q$ fausse. La disjonction de ces conjonctions est vraie exactement sur les lignes où $c$ vaut **V** : 
    $$\boxed{\text{tout connecteur s'écrit comme une disjonction de conjonctions de } P,\ Q,\ \mathrm{non}\, P,\ \mathrm{non}\, Q.}$$
     Par exemple, le « ou exclusif » s'écrit $(P \ \mathrm{et}\ \mathrm{non}\, Q) \ \mathrm{ou}\ (\mathrm{non}\, P \ \mathrm{et}\ Q)$. Comme la question 1 exprime « non », « et » et « ou » à l'aide de $\uparrow$, il suffit de remplacer chacun d'eux par son expression : 
    $$\boxed{\text{tout connecteur binaire s'exprime à l'aide du seul connecteur } \uparrow.}$$

    **4.** Montrons que toute assertion construite à partir de $P$ avec les seuls connecteurs « et », « ou » et $\Rightarrow$ est vraie lorsque $P$ est vraie. On raisonne par récurrence forte sur le nombre $k$ de connecteurs utilisés. Si $k = 0$, l'assertion est $P$ elle-même. Si $k \geqslant 1$, l'assertion s'écrit $F_{1} \ast F_{2}$, où $\ast$ est l'un des trois connecteurs et où $F_{1}$, $F_{2}$ utilisent chacune strictement moins de $k$ connecteurs ; par hypothèse de récurrence, $F_{1}$ et $F_{2}$ sont vraies lorsque $P$ l'est, et l'on conclut car « **V** et **V** », « **V** ou **V** » et « **V** $\Rightarrow$ **V** » valent tous **V**. Or $\mathrm{non}\, P$ est fausse lorsque $P$ est vraie. 
    $$\boxed{\text{Non : } \mathrm{non}\, P \text{ ne s'exprime pas à l'aide de } P \text{ et des seuls connecteurs «~et~», «~ou~», } \Rightarrow.}$$

    *À retenir :* pour démontrer une impossibilité, on cherche une propriété conservée par toutes les constructions autorisées et que l'objet visé ne possède pas : c'est la méthode de l'*invariant*. On en reverra des exemples tout au long de l'année. Par ailleurs, le connecteur $\uparrow$ est le « NAND » des électroniciens : un circuit logique arbitraire peut être réalisé avec ce seul type de porte.
- id: "ma-01-04"
  feuille: "f-ma-01"
  numero: 4
  partie: "Quantificateurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [quantificateurs, négation, suites]
  noeuds: [l-syntaxe, l-tautologies, ar-suites]
  notions: [quantificateur, suite]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Dans tout l'exercice, $f$ désigne une fonction de $\mathbb{R}$ dans $\mathbb{R}$ et $(u_{n})_{n \in \mathbb{N}}$ une suite réelle.

    **1.** Traduire les phrases suivantes par des assertions quantifiées, puis écrire leur négation.

    **(a)** La fonction $f$ ne s'annule pas.

    **(b)** La fonction $f$ est constante.

    **(c)** La fonction $f$ ne prend jamais deux fois la même valeur.

    **(d)** La suite $(u_{n})$ est constante à partir d'un certain rang.

    **(e)** La fonction $f$ est périodique.

    **(f)** Tout réel positif est une valeur prise par $f$.

    **2.** Traduire en français, sans aucun symbole mathématique, les assertions suivantes, puis donner un exemple de fonction qui vérifie chacune d'elles et un exemple de fonction qui ne la vérifie pas. 
    $$\text{(a)}\ \ \forall x \in \mathbb{R},\ \exists y \in \mathbb{R},\ f(y) > f(x) \qquad\qquad \text{(b)}\ \ \exists x \in \mathbb{R},\ \forall y \in \mathbb{R},\ f(y) \geqslant f(x)$$
  corrige: |
    **1.** On donne pour chaque phrase l'assertion quantifiée, puis sa négation obtenue par la méthode du cours.

    **(a)** Ne pas s'annuler, c'est ne jamais prendre la valeur $0$ : 
    $$\boxed{\forall x \in \mathbb{R},\ f(x) \neq 0} \qquad\text{négation :}\qquad \boxed{\exists x \in \mathbb{R},\ f(x) = 0}$$

    **(b)** Une fonction constante prend partout la même valeur : 
    $$\boxed{\exists c \in \mathbb{R},\ \forall x \in \mathbb{R},\ f(x) = c} \qquad\text{négation :}\qquad \boxed{\forall c \in \mathbb{R},\ \exists x \in \mathbb{R},\ f(x) \neq c}$$
     Une forme équivalente sans constante auxiliaire est $\forall (x,y) \in \mathbb{R}^{2},\ f(x) = f(y)$, dont la négation $\exists (x,y) \in \mathbb{R}^{2},\ f(x) \neq f(y)$ est souvent plus commode.

    **(c)** Deux réels distincts ont toujours des images distinctes : 
    $$\boxed{\forall (x,y) \in \mathbb{R}^{2},\ x \neq y \Rightarrow f(x) \neq f(y)} \qquad\text{négation :}\qquad \boxed{\exists (x,y) \in \mathbb{R}^{2},\ x \neq y \ \mathrm{et}\ f(x) = f(y)}$$
     Par contraposition, l'assertion équivaut à $\forall (x,y) \in \mathbb{R}^{2},\ f(x) = f(y) \Rightarrow x = y$ : c'est la notion d'*injectivité*, qui sera étudiée au chapitre 2.

    **(d)** Il existe un rang à partir duquel deux termes consécutifs sont égaux : 
    $$\boxed{\exists N \in \mathbb{N},\ \forall n \geqslant N,\ u_{n+1} = u_{n}} \qquad\text{négation :}\qquad \boxed{\forall N \in \mathbb{N},\ \exists n \geqslant N,\ u_{n+1} \neq u_{n}}$$

    **(e)** Une fonction est périodique s'il existe une période *strictement positive* : 
    $$\boxed{\exists T > 0,\ \forall x \in \mathbb{R},\ f(x + T) = f(x)} \qquad\text{négation :}\qquad \boxed{\forall T > 0,\ \exists x \in \mathbb{R},\ f(x + T) \neq f(x)}$$

    **(f)** Chaque réel positif admet au moins un antécédent : 
    $$\boxed{\forall y \geqslant 0,\ \exists x \in \mathbb{R},\ f(x) = y} \qquad\text{négation :}\qquad \boxed{\exists y \geqslant 0,\ \forall x \in \mathbb{R},\ f(x) \neq y}$$

    *Piège :* dans (e), oublier la condition $T > 0$ rend l'assertion vide de sens, puisque $T = 0$ convient pour toute fonction. Une traduction correcte doit être fausse pour au moins une fonction : c'est un bon test.

    **2.** On traduit, puis on cherche des exemples.

    **(a)** Pour toute valeur prise par $f$, il existe une valeur strictement plus grande : 
    $$\boxed{\text{la fonction } f \text{ n'atteint pas de maximum.}}$$
     La fonction $x \mapsto x$ vérifie (a) ; la fonction cosinus ne la vérifie pas, puisqu'elle atteint son maximum $1$ en $0$.

    **(b)** Il existe un réel en lequel $f$ prend sa plus petite valeur : 
    $$\boxed{\text{la fonction } f \text{ atteint un minimum.}}$$
     La fonction $x \mapsto x^{2}$ vérifie (b), son minimum valant $0$ ; la fonction exponentielle ne la vérifie pas : elle est minorée par $0$, mais n'atteint jamais cette valeur.

    *Piège :* l'assertion (a) est la négation de « $f$ atteint un maximum », et non de (b). L'exemple de la fonction exponentielle montre aussi qu'une fonction minorée n'atteint pas forcément un minimum, distinction qui sera au cœur du chapitre 7.
- id: "ma-01-05"
  feuille: "f-ma-01"
  numero: 5
  partie: "Quantificateurs"
  etoiles: 2
  types: [Vrai ou faux, Calcul]
  mots_cles: [quantificateurs, négation]
  noeuds: [l-syntaxe, l-tautologies]
  notions: [quantificateur]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Déterminer si chacune des assertions suivantes est vraie ou fausse, en justifiant, puis écrire sa négation.

    **(a)** $\forall x \in \mathbb{R},\ \exists y \in \mathbb{R},\ x = y^{2}$

    **(b)** $\exists y \in \mathbb{R},\ \forall x \in \mathbb{R},\ y \leqslant x^{2}$

    **(c)** $\forall \varepsilon > 0,\ \exists n \in \mathbb{N}^{*},\ \frac{1}{n} < \varepsilon$

    **(d)** $\exists n \in \mathbb{N}^{*},\ \forall \varepsilon > 0,\ \frac{1}{n} < \varepsilon$

    **(e)** $\forall (a,b) \in \mathbb{Z}^{2},\ \exists (u,v) \in \mathbb{Z}^{2},\ au + bv = 1$

    **(f)** $\forall x \in \mathbb{R},\ \exists n \in \mathbb{Z},\ n \leqslant x < n + 1$

    **(g)** $\exists a \in \mathbb{R},\ \forall x \in \mathbb{R},\ x^{2} - ax + 1 > 0$

    **(h)** $\forall a \in \mathbb{R},\ \exists x \in \mathbb{R},\ x^{2} - ax + 1 < 0$
  corrige: |
    **(a)** Fausse : pour $x = -1$, aucun réel $y$ ne vérifie $y^{2} = -1$. 
    $$\boxed{\text{Fausse}} \qquad \text{négation : } \boxed{\exists x \in \mathbb{R},\ \forall y \in \mathbb{R},\ x \neq y^{2}}$$

    **(b)** Vraie : $y = 0$ convient, puisque $x^{2} \geqslant 0$ pour tout réel $x$. 
    $$\boxed{\text{Vraie}} \qquad \text{négation : } \boxed{\forall y \in \mathbb{R},\ \exists x \in \mathbb{R},\ y > x^{2}}$$

    **(c)** Vraie : c'est exactement la propriété d'Archimède, admise dans le cours. 
    $$\boxed{\text{Vraie}} \qquad \text{négation : } \boxed{\exists \varepsilon > 0,\ \forall n \in \mathbb{N}^{*},\ \tfrac{1}{n} \geqslant \varepsilon}$$

    **(d)** Fausse : soit $n \in \mathbb{N}^{*}$ ; le réel $\varepsilon = \frac{1}{n}$ ne vérifie pas $\frac{1}{n} < \varepsilon$. 
    $$\boxed{\text{Fausse}} \qquad \text{négation : } \boxed{\forall n \in \mathbb{N}^{*},\ \exists \varepsilon > 0,\ \tfrac{1}{n} \geqslant \varepsilon}$$

    **(e)** Fausse : pour $(a,b) = (2,4)$, tout entier $2u + 4v$ est pair, donc différent de $1$. 
    $$\boxed{\text{Fausse}} \qquad \text{négation : } \boxed{\exists (a,b) \in \mathbb{Z}^{2},\ \forall (u,v) \in \mathbb{Z}^{2},\ au + bv \neq 1}$$

    **(f)** Vraie : le cours a signalé que les intervalles $[n\,,n+1[$, pour $n \in \mathbb{Z}$, forment une partition de $\mathbb{R}$. Tout réel appartient donc à l'un d'eux, qui est unique ; l'entier $n$ correspondant sera appelé la partie entière de $x$ au chapitre 7. 
    $$\boxed{\text{Vraie}} \qquad \text{négation : } \boxed{\exists x \in \mathbb{R},\ \forall n \in \mathbb{Z},\ x < n \ \mathrm{ou}\ x \geqslant n + 1}$$

    **(g)** Vraie : pour $a = 0$, on a $x^{2} + 1 > 0$ pour tout réel $x$. 
    $$\boxed{\text{Vraie}} \qquad \text{négation : } \boxed{\forall a \in \mathbb{R},\ \exists x \in \mathbb{R},\ x^{2} - ax + 1 \leqslant 0}$$

    **(h)** Fausse : pour $a = 0$, aucun réel ne vérifie $x^{2} + 1 < 0$. 
    $$\boxed{\text{Fausse}} \qquad \text{négation : } \boxed{\exists a \in \mathbb{R},\ \forall x \in \mathbb{R},\ x^{2} - ax + 1 \geqslant 0}$$

    *À retenir :* les paires (c)--(d) et (g)--(h) illustrent la proposition 3 du cours. Dans (c), l'entier $n$ peut dépendre de $\varepsilon$ ; dans (d), il devrait convenir pour tous les $\varepsilon$ à la fois, ce qui est impossible. Pour (g), une étude du discriminant $a^{2} - 4$ montre plus précisément que les réels $a$ qui conviennent sont exactement ceux de $]-2\,,2[$. Enfin, le théorème de Bézout de Terminale montre que (e) devient vraie dès que $a$ et $b$ sont premiers entre eux.
- id: "ma-01-06"
  feuille: "f-ma-01"
