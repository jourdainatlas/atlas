  page_enonce: 6
  page_corrige: 12
  enonce: |
    **1.** On cherche toutes les fonctions $f : \mathbb{R} \to \mathbb{R}$ telles que 
    $$(\ast) \qquad \forall (x,y) \in \mathbb{R}^{2},\quad x\,f(x) + y^{2} + f(xy) = f(x + y)^{2} - f(x)\,f(y).$$

    **(a)** Soit $f$ une solution. Calculer $f(0)$, puis montrer que $f(y)^{2} = y^{2}$ pour tout réel $y$. Peut-on en conclure que $f = \mathrm{id}$ ou $f = -\mathrm{id}$ ?

    **(b)** Montrer que $f(x) = x$ pour tout réel $x$. On pourra appliquer $(\ast)$ avec $y = x$.

    **(c)** Conclure.

    **2.** Déterminer les fonctions $f : \mathbb{R} \to \mathbb{R}$ telles que $f(xy) = f(x) + f(y)$ pour tous réels $x$ et $y$. Comparer avec le logarithme népérien.

    **3.** Déterminer l'ensemble des réels $x$ tels que $x^{n+2} \leqslant x^{n+1} + x^{n}$ pour tout $n \in \mathbb{N}$ (avec la convention $x^{0} = 1$).
  corrige: |
    **1. (a)** *Analyse.* Soit $f$ une solution. Avec $x = y = 0$, la relation $(\ast)$ donne $f(0) = f(0)^{2} - f(0)^{2} = 0$. Avec $x = 0$ et $y$ quelconque, elle donne $y^{2} + f(0) = f(y)^{2} - f(0)f(y)$, c'est-à-dire 
    $$\boxed{f(0) = 0 \qquad\text{et}\qquad \forall y \in \mathbb{R},\ f(y)^{2} = y^{2}}$$
     On en déduit que, pour chaque réel $y$, $f(y) = y$ ou $f(y) = -y$. On ne peut *pas* en conclure que $f = \mathrm{id}$ ou $f = -\mathrm{id}$ : le choix du signe peut dépendre de $y$, comme pour la fonction valeur absolue, qui vérifie aussi $f(y)^{2} = y^{2}$. C'est l'erreur la plus répandue sur cet exercice, qui confond « $\forall y,\ (A(y) \ \mathrm{ou}\ B(y))$ » et « $(\forall y,\ A(y)) \ \mathrm{ou}\ (\forall y,\ B(y))$ ».

    **1. (b)** Avec $y = x$, la relation $(\ast)$ donne $x\,f(x) + x^{2} + f(x^{2}) = f(2x)^{2} - f(x)^{2} = 4x^{2} - x^{2}$, d'après (a). Ainsi 
    $$x\,f(x) + f(x^{2}) = 2x^{2}.$$
     Or $|x\,f(x)| = x^{2}$ et $|f(x^{2})| = x^{2}$, d'après (a). La somme de deux réels inférieurs ou égaux à $x^{2}$ ne peut valoir $2x^{2}$ que s'ils valent tous deux $x^{2}$. Donc $x\,f(x) = x^{2}$, et pour $x \neq 0$, $f(x) = x$ ; enfin $f(0) = 0$.

    **1. (c)** *Synthèse.* Pour $f = \mathrm{id}$, le membre de gauche vaut $x^{2} + y^{2} + xy$ et celui de droite $(x + y)^{2} - xy = x^{2} + xy + y^{2}$. 
    $$\boxed{\text{L'unique solution de } (\ast) \text{ est l'identité de } \mathbb{R}.}$$

    **2.** *Analyse.* Soit $f$ une solution. Avec $x = 0$, on obtient $f(0) = f(0) + f(y)$, donc $f(y) = 0$ pour tout réel $y$. *Synthèse.* La fonction nulle convient. 
    $$\boxed{\text{La seule solution est la fonction nulle.}}$$
     Le logarithme népérien vérifie bien $\ln(xy) = \ln x + \ln y$, mais seulement pour $x$, $y$ strictement positifs : c'est la présence de $0$ dans le domaine qui tue toutes les solutions non nulles. Le domaine fait partie de l'énoncé d'une équation fonctionnelle.

    **3.** Pour tout $n$, l'inégalité s'écrit $x^{n}(x^{2} - x - 1) \leqslant 0$. Le trinôme $x^{2} - x - 1$ a pour racines $\psi = \frac{1 - \sqrt{5}}{2} \approx -0{,}618$ et $\varphi = \frac{1 + \sqrt{5}}{2} \approx 1{,}618$ ; il est négatif ou nul exactement sur $[\psi\,,\varphi]$.

    *Analyse.* Soit $x$ une solution. Pour $n = 0$, on obtient $x^{2} - x - 1 \leqslant 0$, donc $x \in [\psi\,,\varphi]$. Si de plus $x < 0$, alors pour $n = 1$, l'inégalité $x(x^{2} - x - 1) \leqslant 0$ impose $x^{2} - x - 1 \geqslant 0$ ; avec la condition précédente, $x^{2} - x - 1 = 0$, donc $x = \psi$.

    *Synthèse.* Si $x \in [0\,,\varphi]$, alors $x^{n} \geqslant 0$ et $x^{2} - x - 1 \leqslant 0$, d'où le résultat pour tout $n$. Si $x = \psi$, alors $x^{n}(x^{2} - x - 1) = 0$ pour tout $n$. 
    $$\boxed{\left\{\frac{1 - \sqrt{5}}{2}\right\} \cup \left[0\,,\frac{1 + \sqrt{5}}{2}\right]}$$
     Le point isolé $\psi$ est le piège de l'exercice : sur les négatifs, le signe de $x^{n}$ alterne, et seule une racine du trinôme survit à cette alternance. Le nombre $\varphi$ est le nombre d'or, que l'on retrouvera dans l'exercice 23 sur la suite de Fibonacci.
- id: "ma-01-19"
  feuille: "f-ma-01"
  numero: 19
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Conjecture, Démonstration]
  mots_cles: [modes de raisonnement, récurrence, divisibilité, suites]
  noeuds: [l-connecteurs, n-recurrence, z-division, ar-suites]
  notions: [suite]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **1.** Pour $n \geqslant 1$, on pose $S_{n} = \displaystyle\sum_{k=1}^{n} \frac{1}{k^{2}}$. On souhaite montrer que $S_{n} \leqslant 2$ pour tout $n \geqslant 1$.

    **(a)** Expliquer pourquoi une récurrence portant directement sur l'assertion « $S_{n} \leqslant 2$ » ne permet pas d'établir l'hérédité.

    **(b)** Démontrer une inégalité plus forte par récurrence, et conclure.

    **2.** Soit $(u_{n})$ la suite définie par $u_{0} = u_{1} = 1$ et $u_{n+2} = u_{n+1} + 2u_{n}$ pour tout $n \in \mathbb{N}$. Calculer ses premiers termes, conjecturer une expression de $u_{n}$ de la forme $\alpha\,2^{n} + \beta\,(-1)^{n}$, puis la démontrer.

    **3.** Montrer que tout entier $n \geqslant 1$ s'écrit comme somme de puissances de $2$ deux à deux distinctes, puis que cette écriture est unique à l'ordre des termes près.
  corrige: |
    **1. (a)** Si l'on suppose seulement $S_{n} \leqslant 2$, on obtient $S_{n+1} = S_{n} + \frac{1}{(n+1)^{2}} \leqslant 2 + \frac{1}{(n+1)^{2}}$, ce qui ne permet pas de conclure $S_{n+1} \leqslant 2$. 
    $$\boxed{\text{L'hypothèse } S_{n} \leqslant 2 \text{ ne laisse aucune marge pour absorber le terme ajouté.}}$$

    **1. (b)** On renforce l'énoncé en se ménageant une marge : montrons par récurrence que, pour tout $n \geqslant 1$, 
    $$P(n) : \quad S_{n} \leqslant 2 - \frac{1}{n}$$
     **Initialisation.** $S_{1} = 1 = 2 - \frac{1}{1}$, donc $P(1)$ est vraie.

    **Hérédité.** Soit $n \geqslant 1$ tel que $P(n)$ soit vraie. Alors $S_{n+1} \leqslant 2 - \frac{1}{n} + \frac{1}{(n+1)^{2}}$, et il suffit de vérifier que ce majorant est inférieur à $2 - \frac{1}{n+1}$ : 
    $$\frac{1}{(n+1)^{2}} \leqslant \frac{1}{n} - \frac{1}{n+1} = \frac{1}{n(n+1)} \quad\Longleftrightarrow\quad n(n+1) \leqslant (n+1)^{2},$$
     ce qui est vrai. Ainsi $P(n+1)$ est vraie.

    **Conclusion.** Pour tout $n \geqslant 1$ : $S_{n} \leqslant 2 - \frac{1}{n} < 2$. 
    $$\boxed{S_{n} \leqslant 2 - \frac{1}{n} < 2 \text{ pour tout } n \geqslant 1}$$

    *À retenir :* il est parfois plus facile de démontrer un énoncé plus fort, parce que l'hypothèse de récurrence est elle aussi plus forte. L'idée de la marge $\frac{1}{n}$ vient de la majoration $\frac{1}{k^{2}} \leqslant \frac{1}{k(k-1)} = \frac{1}{k-1} - \frac{1}{k}$, qui rend la somme télescopique (chapitre 3). La suite $(S_{n})$, croissante et majorée, converge (chapitre 7) ; on verra au chapitre 20 que sa limite vaut $\frac{\pi^{2}}{6} \approx 1{,}645$.

    **2.** Les premiers termes sont : 
    $$\boxed{u_{0} = 1,\ u_{1} = 1,\ u_{2} = 3,\ u_{3} = 5,\ u_{4} = 11,\ u_{5} = 21,\ u_{6} = 43}$$
     On détermine $\alpha$ et $\beta$ à l'aide des deux premiers termes : $\alpha + \beta = 1$ et $2\alpha - \beta = 1$, d'où $\alpha = \frac{2}{3}$ et $\beta = \frac{1}{3}$. On conjecture donc 
    $$\boxed{u_{n} = \frac{2^{n+1} + (-1)^{n}}{3}}$$
     ce que confirment les valeurs $u_{2} = \frac{8 + 1}{3} = 3$ et $u_{3} = \frac{16 - 1}{3} = 5$. ✓

    Démontrons-le par récurrence double. La formule est vraie aux rangs $0$ et $1$ par construction. Si elle est vraie aux rangs $n$ et $n + 1$, alors 
    $$u_{n+2} = \frac{2^{n+2} + (-1)^{n+1}}{3} + 2 \times \frac{2^{n+1} + (-1)^{n}}{3} = \frac{2^{n+3} + (-1)^{n}\,(-1 + 2)}{3} = \frac{2^{n+3} + (-1)^{n+2}}{3}.$$
     Comme dans l'exemple du cours, $2$ et $-1$ sont les racines de l'équation $r^{2} = r + 2$ associée à la relation de récurrence, ce que le chapitre 7 expliquera.

    **3.** *Existence*, par récurrence forte. L'entier $1 = 2^{0}$ convient. Soit $n \geqslant 1$ tel que tout entier de $[\![1\,;n]\!]$ s'écrive comme somme de puissances de $2$ distinctes. L'ensemble des entiers $k$ tels que $2^{k} > n + 1$ est une partie non vide de $\mathbb{N}$ (elle contient $n + 1$), donc possède un plus petit élément $k_{0}$, d'après la proposition 4 du cours ; comme $2^{0} \leqslant n + 1$, on a $k_{0} \geqslant 1$, et $m = k_{0} - 1$ vérifie $2^{m} \leqslant n + 1 < 2^{m+1}$.

    • Si $n + 1 = 2^{m}$, l'écriture est trouvée.

    • Sinon, $r = n + 1 - 2^{m}$ vérifie $1 \leqslant r < 2^{m}$, et en particulier $r \leqslant n$. Par hypothèse, $r$ est une somme de puissances de $2$ distinctes, toutes inférieures à $r < 2^{m}$, donc différentes de $2^{m}$ ; il suffit d'y ajouter $2^{m}$.

    *Unicité.* On utilise la somme géométrique $1 + 2 + \dots + 2^{M-1} = 2^{M} - 1 < 2^{M}$. Supposons qu'un entier admette deux écritures différentes ; en retirant les puissances communes, on obtient deux ensembles d'exposants $S$ et $T$ disjoints, non tous deux vides, de même somme $\sum_{j \in S} 2^{j} = \sum_{j \in T} 2^{j}$. Aucun des deux ne peut être vide, car l'autre aurait une somme nulle. Soit $M$ le plus grand élément de $S \cup T$, par exemple dans $S$. Les éléments de $T$ sont alors des entiers distincts strictement inférieurs à $M$, donc $\sum_{j \in T} 2^{j} \leqslant 2^{M} - 1 < 2^{M} \leqslant \sum_{j \in S} 2^{j}$ : contradiction. 
    $$\boxed{\text{Tout entier } n \geqslant 1 \text{ s'écrit de façon unique comme somme de puissances de } 2 \text{ distinctes.}}$$
     C'est l'écriture de $n$ en base $2$, utilisée par tous les ordinateurs. Elle servira à l'exercice 45.
- id: "ma-01-20"
