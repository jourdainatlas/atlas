  enonce: |
    **1.** Soient $U \sim \mathcal{U}([0, 1])$ et $X \sim \mathcal{E}(1)$ indépendantes. Calculer $\mathbb{P}(\max(U, X) \leqslant t)$ pour tout réel $t$, et tracer la fonction de répartition de $\max(U, X)$.

    **2.** Soient $X$, $Y$, $Z$ indépendantes de loi $\mathcal{E}(1)$. Montrer que $\mathbb{P}(\max(X, Y) \geqslant Z) = 1 - \mathbb{E}\big[(1 - \mathrm{e}^{-Z})^{2}\big]$ et calculer cette probabilité. Est-elle égale à $1 - \mathbb{P}(X \leqslant Z)\mathbb{P}(Y \leqslant Z)$ ? Pourquoi ?

    **3.** Soient $X \sim \mathcal{E}(1)$ et $Y \sim \mathcal{U}([0, 1])$ indépendantes. Calculer $\mathbb{P}(X \geqslant 3,\ X - Y \geqslant 1)$, $\mathbb{P}(X - Y \geqslant 1)$, puis $\mathbb{P}(X \geqslant 3 \mid X - Y \geqslant 1)$, et comparer cette dernière à $\mathbb{P}(X \geqslant 3)$.
  corrige: |
    **1.** $\mathbb{P}(\max(U, X) \leqslant t) = \mathbb{P}(U \leqslant t)\mathbb{P}(X \leqslant t)$ vaut $0$ pour $t < 0$, $\boxed{t(1 - \mathrm{e}^{-t})}$ pour $0 \leqslant t \leqslant 1$, et $\boxed{1 - \mathrm{e}^{-t}}$ pour $t > 1$. La fonction est continue, avec un point anguleux en $1$ (pente $\mathrm{e}^{-1}$ à droite contre $1 - \mathrm{e}^{-1} + \mathrm{e}^{-1} = 1$ à gauche).

    **2.** Par Fubini et indépendance, en conditionnant par la valeur de $Z$, 
    $$\mathbb{P}(X \leqslant Z, Y \leqslant Z) = \int_{0}^{+\infty}\mathbb{P}(X \leqslant z)\mathbb{P}(Y \leqslant z)\,\mathrm{e}^{-z}\,\mathrm{d} z = \mathbb{E}\big[(1 - \mathrm{e}^{-Z})^{2}\big] = 1 - 1 + \frac{1}{3} = \frac{1}{3},$$
     donc $\boxed{\mathbb{P}(\max(X, Y) \geqslant Z) = \frac{2}{3}}$, ce qui se voit aussi par symétrie : c'est la probabilité que $Z$ ne soit pas la plus grande des trois.

    En revanche, $\mathbb{P}(X \leqslant Z) = \frac{1}{2}$, et $1 - \mathbb{P}(X \leqslant Z)\mathbb{P}(Y \leqslant Z) = \frac{3}{4} \neq \frac{2}{3}$. Les évènements $\{X \leqslant Z\}$ et $\{Y \leqslant Z\}$ *ne sont pas indépendants* : tous deux sont favorisés par une grande valeur de $Z$. Ils ne sont indépendants que conditionnellement à $Z$, et c'est pourquoi l'on doit intégrer le produit, et non multiplier les intégrales.

    **3.** Par Fubini, $\mathbb{P}(X \geqslant 3, X - Y \geqslant 1) = \int_{0}^{1}\mathbb{P}(X \geqslant 3)\,\mathrm{d} y = \boxed{\mathrm{e}^{-3}}$ (si $X \geqslant 3$, alors $X - Y \geqslant 2$), et 
    $$\mathbb{P}(X - Y \geqslant 1) = \int_{0}^{1}\mathrm{e}^{-(1 + y)}\,\mathrm{d} y = \boxed{\mathrm{e}^{-1} - \mathrm{e}^{-2}}, \qquad \mathbb{P}(X \geqslant 3 \mid X - Y \geqslant 1) = \frac{\mathrm{e}^{-3}}{\mathrm{e}^{-1} - \mathrm{e}^{-2}} \approx \boxed{0{,}214},$$
     nettement plus grand que $\mathbb{P}(X \geqslant 3) = \mathrm{e}^{-3} \approx 0{,}050$ : savoir que $X$ dépasse $1 + Y \geqslant 1$ rend les grandes valeurs plus probables (par l'absence de mémoire, $X$ dépasse alors en moyenne sa borne de $1$).
