- id: "l3-pr-07-01"
  feuille: "f-l3-pr-07"
  numero: 1
  partie: "Densités, marginales, indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 3, exercice 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $\mathcal{D} = \{(x, y) \in \mathbb{R}^{2} : 0 \leqslant y \leqslant 1,\ |x| \leqslant 1 - y\}$ et $a > 0$. Le couple $(X, Y)$ a pour densité $f(x, y) = a\,|x|\,y^{2}\,\mathbf{1}_{\mathcal{D}}(x, y)$.

    **1.** Déterminer $a$. Les variables $X$ et $Y$ sont-elles indépendantes ?

    **2.** Déterminer les lois marginales, les espérances et les variances de $X$ et $Y$.

    **3.** Calculer $\operatorname{Cov}(X, Y)$. Commenter.
  corrige: |
    **1.** Pour $y \in [0, 1]$ fixé, $\int_{-(1 - y)}^{1 - y}|x|\,\mathrm{d} x = (1 - y)^{2}$. Par Fubini-Tonelli, 
    $$\iint f = a\int_{0}^{1}y^{2}(1 - y)^{2}\,\mathrm{d} y = a\,\mathrm{B}(3, 3) = \frac{a}{30}, \qquad \text{d'où} \quad \boxed{a = 30}.$$
     Les variables ne sont pas indépendantes : la densité est nulle sur $[\frac{1}{2}, 1] \times [\frac{1}{2}, 1]$, rectangle hors de $\mathcal{D}$, alors que $\mathbb{P}(X \geqslant \frac{1}{2}) > 0$ et $\mathbb{P}(Y \geqslant \frac{1}{2}) > 0$.

    1.5em

    ![Figure](documents/figures/58406d1ebfd718bf.svg)

    Le domaine $\mathcal{D}$ (en bleu) n'est pas un produit d'intervalles : le carré rouge $[\frac{1}{2}, 1]^{2}$ en est exclu, ce qui interdit l'indépendance.

    **2.** Par la prop. 2, pour $y \in [0, 1]$, $\boxed{f_{Y}(y) = 30y^{2}(1 - y)^{2}}$ : c'est la loi $\beta(3, 3)$, symétrique autour de $\frac{1}{2}$, donc $\boxed{\mathbb{E}[Y] = \frac{1}{2}}$, et 
    $$\mathbb{E}[Y^{2}] = 30\,\mathrm{B}(5, 3) = 30 \cdot \frac{4!\,2!}{7!} = \frac{2}{7}, \qquad \boxed{\operatorname{Var}(Y) = \frac{2}{7} - \frac{1}{4} = \frac{1}{28}}.$$
     Pour $x \in [-1, 1]$, $f_{X}(x) = 30|x|\int_{0}^{1 - |x|}y^{2}\,\mathrm{d} y$, soit $\boxed{f_{X}(x) = 10|x|(1 - |x|)^{3}}$. Cette densité est paire, donc $\boxed{\mathbb{E}[X] = 0}$, et 
    $$\operatorname{Var}(X) = \mathbb{E}[X^{2}] = 2\int_{0}^{1}10x^{3}(1 - x)^{3}\,\mathrm{d} x = 20\,\mathrm{B}(4, 4) = 20 \cdot \frac{3!\,3!}{7!} = \boxed{\frac{1}{7}}.$$

    **3.** La densité est paire en $x$, donc $\mathbb{E}[XY] = 0$, et $\boxed{\operatorname{Cov}(X, Y) = 0}$. *Commentaire.* Les variables sont non corrélées sans être indépendantes : la symétrie $x \mapsto -x$ annule la covariance, alors que la valeur de $Y$ limite l'amplitude de $X$ ($|X| \leqslant 1 - Y$). C'est le même phénomène que pour le disque (cours, section 7.4).
- id: "l3-pr-07-02"
  feuille: "f-l3-pr-07"
  numero: 2
  partie: "Densités, marginales, indépendance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Durand (Orsay), exercice 2.27 ; Rubenthaler, chapitre 6, exercice 4"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $(X, Y)$ de densité $\frac{4}{\pi}\mathrm{e}^{-(x^{2} + y^{2})}\mathbf{1}_{\{x \geqslant |y|\}}$. Vérifier que c'est une densité, calculer $\operatorname{Cov}(X, Y)$ et étudier l'indépendance de $X$ et $Y$. Déterminer la loi de $(X - Y, X + Y)$ ; ses composantes sont-elles indépendantes ?

    **2.** Soit $(X, Y)$ de densité $\frac{3}{4}\exp\big(-|x + 2y| - |x - y|\big)$. Déterminer la densité de $(X + 2Y, X - Y)$, puis les densités de $X$ et de $Y$.
  corrige: |
    **1.** En coordonnées polaires, le domaine $\{x \geqslant |y|\}$ est le secteur $|\theta| \leqslant \frac{\pi}{4}$, d'angle $\frac{\pi}{2}$ : 
    $$\iint_{x \geqslant |y|}\mathrm{e}^{-(x^{2} + y^{2})}\,\mathrm{d} x\,\mathrm{d} y = \frac{\pi}{2}\int_{0}^{+\infty}\mathrm{e}^{-r^{2}}r\,\mathrm{d} r = \frac{\pi}{4},$$
     et la densité est bien normalisée. Elle est paire en $y$, donc $\mathbb{E}[Y] = 0$ et $\mathbb{E}[XY] = 0$ : $\boxed{\operatorname{Cov}(X, Y) = 0}$. Mais $X$ et $Y$ 
    $$\boxed{\text{ne sont pas indépendantes}}:$$
     la densité est nulle sur $[0, 1] \times [1, 2]$ (où $x < y$), alors que $\mathbb{P}(0 \leqslant X \leqslant 1) > 0$ et $\mathbb{P}(1 \leqslant Y \leqslant 2) > 0$.

    Posons $U = X - Y$, $V = X + Y$. L'application linéaire $(x, y) \mapsto (x - y, x + y)$ a pour déterminant $2$, et son inverse est $x = \frac{u + v}{2}$, $y = \frac{v - u}{2}$. Comme $x^{2} + y^{2} = \frac{u^{2} + v^{2}}{2}$ et que $x \geqslant |y|$ équivaut à $u \geqslant 0$ et $v \geqslant 0$, le théorème 1 donne 
    $$f_{U, V}(u, v) = \frac{1}{2} \cdot \frac{4}{\pi}\mathrm{e}^{-(u^{2} + v^{2})/2}\mathbf{1}_{\{u, v \geqslant 0\}} = \boxed{\Big(\sqrt{\tfrac{2}{\pi}}\,\mathrm{e}^{-u^{2}/2}\mathbf{1}_{\{u \geqslant 0\}}\Big)\Big(\sqrt{\tfrac{2}{\pi}}\,\mathrm{e}^{-v^{2}/2}\mathbf{1}_{\{v \geqslant 0\}}\Big)}.$$
     La densité se factorise : $U$ et $V$ sont *indépendantes*, de même loi que $|G|$, $G \sim \mathcal{N}(0, 1)$ (prop. 4). Le changement de variables a « redressé » le secteur en un quadrant, sur lequel la densité gaussienne se sépare.

    **2.** L'application $(x, y) \mapsto (s, d) = (x + 2y, x - y)$ a pour déterminant $-3$, d'où 
    $$f_{S, D}(s, d) = \frac{1}{3} \cdot \frac{3}{4}\mathrm{e}^{-|s| - |d|} = \boxed{\frac{1}{2}\mathrm{e}^{-|s|} \cdot \frac{1}{2}\mathrm{e}^{-|d|}} :$$
     $S = X + 2Y$ et $D = X - Y$ sont indépendantes, de loi de Laplace de paramètre $1$. On revient à $X = \frac{S + 2D}{3}$ et $Y = \frac{S - D}{3}$ par le théorème 2. La convolution de deux densités de Laplace donne $f_{S - D}(z) = f_{S + D}(z) = \frac{1}{4}(1 + |z|)\mathrm{e}^{-|z|}$ ; celle de $S$ et de $2D$ (densité $\frac{1}{4}\mathrm{e}^{-|w|/2}$) donne $f_{S + 2D}(z) = \frac{1}{3}\mathrm{e}^{-|z|/2} - \frac{1}{6}\mathrm{e}^{-|z|}$, en découpant l'intégrale en $w < 0$, $0 < w < z$ et $w > z$ pour $z > 0$. Par la prop. 9 du chapitre 4, 
    $$\boxed{f_{X}(x) = \mathrm{e}^{-3|x|/2} - \frac{1}{2}\mathrm{e}^{-3|x|}}, \qquad \boxed{f_{Y}(y) = \frac{3}{4}(1 + 3|y|)\,\mathrm{e}^{-3|y|}}.$$
     Chacune est d'intégrale $1$ ($2(\frac{2}{3} - \frac{1}{6}) = 1$ et $\frac{3}{2}(\frac{1}{3} + \frac{1}{3}) = 1$), et les valeurs ont été vérifiées par intégration numérique de $f$ en $x = 0{,}3$, $x = -1{,}1$ et $y = 0{,}4$.
- id: "l3-pr-07-03"
  feuille: "f-l3-pr-07"
  numero: 3
  partie: "Densités, marginales, indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Rubenthaler, chapitre 6, exercice 8, et chapitre 7, exercice 7"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Déterminer les lois marginales du couple $(X, Y)$ lorsque sa densité est :

    **1.** $\frac{1}{\pi^{2}} \cdot \frac{1}{1 + (1 + x^{2})^{2}y^{2}}$ sur $\mathbb{R}^{2}$ (on se contentera de la loi de $X$) ;

    **2.** $\frac{2}{\pi}\exp\big(-x(1 + y^{2})\big)$ sur $\mathbb{R}_{+}^{2}$ ; on rappelle que $\int_{0}^{+\infty}\mathrm{e}^{-u^{2}}\,\mathrm{d} u = \frac{\sqrt{\pi}}{2}$.

    Dans chaque cas, $X$ et $Y$ sont-elles indépendantes ?
  corrige: |
    **1.** Pour $x$ fixé, avec $c = 1 + x^{2}$, $\int_{\mathbb{R}}\frac{\mathrm{d} y}{1 + c^{2}y^{2}} = \frac{\pi}{c}$, donc $\boxed{f_{X}(x) = \frac{1}{\pi(1 + x^{2})}}$ : $X$ suit la loi de Cauchy. La loi de $Y$ n'a pas d'expression simple. Les variables ne sont pas indépendantes : sinon la densité, continue, serait égale au produit des marginales en tout point, et l'on aurait $f(x, y)f(0, 0) = f(x, 0)f(0, y)$ ; or $f(x, 0) = f(0, 0) = \frac{1}{\pi^{2}}$, et cela imposerait $f(x, y) = f(0, y)$, ce qui est faux pour $x, y \neq 0$.

    **2.** Pour $x > 0$, le changement de variable $u = y\sqrt{x}$ donne 
    $$f_{X}(x) = \frac{2}{\pi}\mathrm{e}^{-x}\int_{0}^{+\infty}\mathrm{e}^{-xy^{2}}\,\mathrm{d} y = \frac{2}{\pi}\mathrm{e}^{-x}\frac{\sqrt{\pi}}{2\sqrt{x}} = \boxed{\frac{\mathrm{e}^{-x}}{\sqrt{\pi x}}},$$
     c'est la loi $\Gamma(\frac{1}{2}, 1)$. Pour $y > 0$, 
    $$\boxed{f_{Y}(y) = \frac{2}{\pi}\int_{0}^{+\infty}\mathrm{e}^{-x(1 + y^{2})}\,\mathrm{d} x = \frac{2}{\pi(1 + y^{2})}}:$$
     $Y$ suit la loi de $|C|$, $C$ de loi de Cauchy. Ici encore, $f(x, y) \neq f_{X}(x)f_{Y}(y)$ (le produit ne contient pas le terme croisé $\mathrm{e}^{-xy^{2}}$) : pas d'indépendance.
- id: "l3-pr-07-04"
  feuille: "f-l3-pr-07"
  numero: 4
  partie: "Densités, marginales, indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Durand, exercices 2.7 et 2.11"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $\phi : \mathbb{R} \to \mathbb{R}_{+}$ borélienne, d'intégrale $I \in \,]0, +\infty[$, et $D_{\phi} = \{(x, y) \in \mathbb{R} \times \mathbb{R}_{+} : y \leqslant \phi(x)\}$.

    **1.** Soit $(X, Y)$ de loi uniforme sur $D_{\phi}$. Déterminer la loi de $X$. Donner des fonctions $\phi$ pour lesquelles $X$ et $Y$ sont indépendantes, et d'autres pour lesquelles elles ne le sont pas.

    **2.** Soit $W$ de densité $\frac{\phi}{I}$, et $U \sim \mathcal{U}([0, 1])$ indépendante de $W$. Déterminer la loi de $(W, U\phi(W))$.

    **3.** *Acceptation-rejet.* Soit $(Z_{i})_{i \geqslant 1}$ une suite de vecteurs indépendants de même loi $\mu$, $D$ un borélien tel que $\mu(D) > 0$, et $T = \inf\{i \geqslant 1 : Z_{i} \in D\}$. Montrer que $T$ est fini presque sûrement, que $Z_{T}$ suit la loi $\mu(\,\cdot \mid D)$ et qu'elle est indépendante de $T$. Quelle est la loi de $T$, et son espérance ?

    **4.** Si $\mu$ est la loi uniforme sur un borélien $A \supset D$, quelle est la loi de $Z_{T}$ ? En déduire une méthode pour simuler une variable de densité $h$ bornée, nulle hors d'un segment $[a, b]$, à partir de variables uniformes. Quelle est la densité des abscisses de points uniformes dans $\{(x, y) : 1 < x < \mathrm{e},\ 0 < y < \ln x\}$ ?
  corrige: |
    **1.** L'aire de $D_{\phi}$ est $I$, et $(X, Y)$ a la densité $\frac{1}{I}\mathbf{1}_{D_{\phi}}$. Par la prop. 2, $f_{X}(x) = \frac{1}{I}\int_{0}^{\phi(x)}\mathrm{d} y = \boxed{\frac{\phi(x)}{I}}$.

    Si $\phi = c\,\mathbf{1}_{A}$, avec $c > 0$ et $\lambda(A) \in \,]0, +\infty[$, $D_{\phi} = A \times [0, c]$ et $(X, Y)$ est uniforme sur un produit : $X$ et $Y$ sont indépendantes (prop. 4). Si $\phi(x) = \mathrm{e}^{-x}\mathbf{1}_{x > 0}$, $X \sim \mathcal{E}(1)$, et $\mathbb{P}(X > 1, Y > \frac{1}{2}) = 0$ (car $\mathrm{e}^{-x} < \frac{1}{2}$ pour $x > 1$), alors que les deux probabilités sont positives : pas d'indépendance. Plus généralement, l'indépendance n'a lieu que si $D_{\phi}$ est un produit, c'est-à-dire si $\phi$ est une constante fois une indicatrice.

    **2.** Sachant $W = w$, la variable $U\phi(W)$ est uniforme sur $[0, \phi(w)]$. Plus précisément, pour $h \geqslant 0$ borélienne, par indépendance et Fubini, 
    $$\mathbb{E}\big[h(W, U\phi(W))\big] = \int_{\mathbb{R}}\frac{\phi(w)}{I}\int_{0}^{1}h(w, u\phi(w))\,\mathrm{d} u\,\mathrm{d} w = \int_{\mathbb{R}}\frac{1}{I}\int_{0}^{\phi(w)}h(w, v)\,\mathrm{d} v\,\mathrm{d} w,$$
     donc 
    $$\boxed{(W, U\phi(W)) \text{ suit la loi uniforme sur } D_{\phi}}$$
     (prop. 1) : on fabrique un point uniforme sous le graphe en tirant son abscisse selon $\frac{\phi}{I}$, puis sa hauteur uniformément.

    **3.** $\mathbb{P}(T > n) = \mathbb{P}(Z_{1} \notin D, \dots, Z_{n} \notin D) = (1 - \mu(D))^{n} \to 0$ : $T$ est fini presque sûrement. Pour $n \geqslant 1$ et $B$ borélien, par indépendance : l'évènement $\{T = n, Z_{T} \in B\}$ s'écrit 
    $$\{Z_{1} \notin D, \dots, Z_{n - 1} \notin D,\ Z_{n} \in B \cap D\},$$
     d'où 
    $$\mathbb{P}(T = n, Z_{T} \in B) = (1 - \mu(D))^{n - 1}\mu(D) \cdot \frac{\mu(B \cap D)}{\mu(D)}.$$
     En sommant sur $n$, on obtient $\mathbb{P}(Z_{T} \in B) = \mu(B \mid D)$, et l'égalité précédente s'écrit donc $\mathbb{P}(T = n, Z_{T} \in B) = \mathbb{P}(T = n)\,\mathbb{P}(Z_{T} \in B)$. Ainsi $Z_{T}$ est indépendante de $T$, et 
    $$\boxed{Z_{T} \sim \mu(\cdot \mid D)}, \qquad \boxed{T \sim \mathcal{G}(\mu(D))}, \qquad \mathbb{E}[T] = \frac{1}{\mu(D)}.$$

    **4.** Si $\mu$ est uniforme sur $A$, $\mu(B \mid D) = \frac{\lambda(B \cap D)}{\lambda(D)}$ : $\boxed{Z_{T} \text{ est uniforme sur } D}$. *Méthode de rejet.* Soit $M \geqslant \sup h$. On tire des points uniformes dans le rectangle $A = [a, b] \times [0, M]$ (deux uniformes indépendantes), jusqu'au premier qui tombe sous le graphe $D_{h}$ ; ce point est uniforme sur $D_{h}$, et son abscisse a la densité $h$ par la question 1. Le nombre moyen d'essais est $\frac{\lambda(A)}{\lambda(D_{h})} = M(b - a)$ : on a intérêt à prendre $M$ le plus petit possible.

    Pour $D = \{1 < x < \mathrm{e},\ 0 < y < \ln x\}$, d'aire $\int_{1}^{\mathrm{e}}\ln x\,\mathrm{d} x = 1$, les abscisses ont la densité $\boxed{\ln x\,\mathbf{1}_{]1, \mathrm{e}[}(x)}$.
- id: "l3-pr-07-05"
  feuille: "f-l3-pr-07"
  numero: 5
  partie: "Densités, marginales, indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Durand, exercice 2.19"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Le couple $(X, Y)$ suit la loi uniforme sur le disque unité. Déterminer la loi de $T = \sqrt{X^{2} + Y^{2}}$, puis la loi du couple $(T, \Theta)$, où $\Theta \in [0, 2\pi[$ est l'angle polaire de $(X, Y)$ (pris nul à l'origine). Ces deux variables sont-elles indépendantes ? Pourquoi $X$ et $Y$, elles, ne le sont-elles pas ?
  corrige: |
    Pour $t \in [0, 1]$, $\mathbb{P}(T \leqslant t) = \frac{\pi t^{2}}{\pi} = t^{2}$ : $\boxed{f_{T}(t) = 2t\,\mathbf{1}_{[0, 1]}(t)}$.

    Le passage en coordonnées polaires $(t, \theta) \mapsto (t\cos\theta, t\sin\theta)$ est un difféomorphisme de $]0, 1[ \times ]0, 2\pi[$ sur le disque privé d'un rayon (ensemble négligeable), de jacobien $t$. Par le théorème 1, 
    $$f_{T, \Theta}(t, \theta) = \frac{1}{\pi}\,t\,\mathbf{1}_{]0, 1[}(t)\mathbf{1}_{]0, 2\pi[}(\theta) = \boxed{2t\,\mathbf{1}_{]0, 1[}(t) \cdot \frac{1}{2\pi}\mathbf{1}_{]0, 2\pi[}(\theta)} :$$
     la densité se factorise, $T$ et $\Theta$ sont *indépendantes*, et $\Theta$ est uniforme. Au contraire, $X$ et $Y$ ne sont pas indépendantes, car le disque n'est pas un produit : $\mathbb{P}(X > 0{,}8,\ Y > 0{,}8) = 0$ alors que chaque facteur est positif. L'indépendance dépend du système de coordonnées : le disque est un « produit » en polaires, pas en cartésiennes.
- id: "l3-pr-07-06"
  feuille: "f-l3-pr-07"
  numero: 6
  partie: "Densités, marginales, indépendance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Bordeaux, TD 2, exercice 12 ; Durand, exercice 2.57"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *(Paradoxe de Bertrand.)* Soit $\mathcal{C}$ le cercle de centre $O$ et de rayon $1$, et $\ell = \sqrt{3}$ la longueur du côté du triangle équilatéral inscrit. On choisit une corde $[AB]$ de $\mathcal{C}$ selon l'une des procédures suivantes, on note $L$ sa longueur, et l'on demande, dans chaque cas, la fonction de répartition et la densité de $L$, puis $\mathbb{P}(L \geqslant \ell)$.

    **1.** On fixe un rayon $[OI]$, on choisit $M$ uniformément sur $[OI]$, et $[AB]$ est la corde perpendiculaire à $(OI)$ passant par $M$.

    **2.** On fixe $A$ sur le cercle et l'on choisit $B$ uniformément sur le cercle.

    **3.** On choisit $M$ uniformément dans le disque, et $[AB]$ est la corde de milieu $M$ (un diamètre quelconque si $M = O$).

    Expliquer pourquoi ces réponses différentes ne sont pas contradictoires.
  corrige: |
    Une corde à distance $d \in [0, 1]$ du centre a pour longueur $L = 2\sqrt{1 - d^{2}}$, et $L \geqslant \sqrt{3}$ équivaut à $d \leqslant \frac{1}{2}$. Pour $0 \leqslant u \leqslant 2$, $L \leqslant u$ équivaut à $d \geqslant \sqrt{1 - u^{2}/4}$.

    **1.** Ici $d$ est uniforme sur $[0, 1]$ : $F_{L}(u) = 1 - \sqrt{1 - \frac{u^{2}}{4}}$, $\boxed{f_{L}(u) = \frac{u}{4\sqrt{1 - u^{2}/4}}}$ sur $]0, 2[$, et $\boxed{\mathbb{P}(L \geqslant \sqrt{3}) = \frac{1}{2}}$.

    **2.** Soit $\theta \in [0, 2\pi[$ l'angle $\widehat{AOB}$, uniforme. Alors $L = 2\big|\sin\frac{\theta}{2}\big|$, et l'inégalité $L \leqslant u$ équivaut à $\frac{\theta}{2} \in [0, \arcsin\frac{u}{2}] \cup [\pi - \arcsin\frac{u}{2}, \pi[$ : 
    $$F_{L}(u) = \frac{2}{\pi}\arcsin\frac{u}{2}, \qquad \boxed{f_{L}(u) = \frac{2}{\pi\sqrt{4 - u^{2}}}}, \qquad \mathbb{P}(L \geqslant \sqrt{3}) = 1 - \frac{2}{\pi} \cdot \frac{\pi}{3} = \boxed{\frac{1}{3}}.$$

    **3.** La distance de $M$ au centre a pour fonction de répartition $r^{2}$ (exercice 5), donc 
    $$F_{L}(u) = 1 - \Big(1 - \frac{u^{2}}{4}\Big) = \frac{u^{2}}{4}, \qquad \boxed{f_{L}(u) = \frac{u}{2}} \ \text{sur } [0, 2], \qquad \mathbb{P}(L \geqslant \sqrt{3}) = 1 - \frac{3}{4} = \boxed{\frac{1}{4}}.$$

    1.5em

    ![Figure](documents/figures/3dbdb1b3890328d4.svg)

    Les densités de la longueur $L$ selon les trois procédures. La probabilité $\mathbb{P}(L \geqslant \sqrt{3})$ est l'aire sous chaque courbe dans la bande verte ; les deux premières densités tendent vers $+\infty$ en $2$ (les cordes proches d'un diamètre sont nombreuses), la troisième non.

    *Pourquoi ce n'est pas une contradiction.* « Choisir une corde au hasard » ne définit pas une loi sur l'ensemble des cordes : chaque procédure en définit une différente, et les trois calculs sont justes, chacun pour son modèle. La question de Bertrand est mal posée tant que l'expérience n'est pas précisée (cours, introduction).
- id: "l3-pr-07-07"
  feuille: "f-l3-pr-07"
  numero: 7
  partie: "Densités, marginales, indépendance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [densités marginales]
  noeuds: [p-variables, m-fubini]
  notions: [densite-probabilite, independance]
  source: "Rubenthaler, chapitre 7, exercice 11, et chapitre 6, exercice 12 (b)"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Bouvard et Pécuchet vont chacun boire un café entre $10$ h et $11$ h ; Bouvard arrive à $10$ h $+ X$ heure et Pécuchet à $10$ h $+ Y$ heure, où $X$ et $Y$ sont indépendantes de loi $\mathcal{U}([0, 1])$. Chacun reste un quart d'heure.

    **1.** Calculer la probabilité qu'ils se croisent, c'est-à-dire $\mathbb{P}(|X - Y| \leqslant \frac{1}{4})$. Calculer de même $\mathbb{P}(|X - Y| \leqslant \frac{1}{10})$.

    **2.** Soit $U = \max(X, Y)\,\mathbf{1}_{\{|X - Y| \leqslant 1/4\}}$. Calculer $\mathbb{P}(U \leqslant t)$ pour $t < 0$, pour $t \in [0, \frac{1}{4}]$ et pour $t > 1$, et montrer que $\mathbb{P}(U \leqslant t) = \frac{1 + t}{2}$ pour $t \in [\frac{1}{4}, 1]$. Les évènements $\{\max(X, Y) \leqslant t\}$ et $\{|X - Y| \leqslant \frac{1}{4}\}$ sont-ils indépendants ? Tracer la fonction de répartition de $U$ ; $U$ a-t-elle une densité ?

    **3.** Pécuchet arrive désormais à l'heure fixe $10$ h $+ T$, avec $T \in [0, 1]$. Calculer $\mathbb{P}(|T - X| \leqslant \frac{1}{4})$ et déterminer les $T$ qui la rendent maximale.
  corrige: |
    **1.** Le couple $(X, Y)$ est uniforme sur le carré unité, et $\{|X - Y| > c\}$ est formé de deux triangles de côtés $1 - c$, d'aire totale $(1 - c)^{2}$. Donc 
    $$\mathbb{P}\Big(|X - Y| \leqslant \frac{1}{4}\Big) = 1 - \frac{9}{16} = \boxed{\frac{7}{16}}, \qquad \mathbb{P}\Big(|X - Y| \leqslant \frac{1}{10}\Big) = 1 - \frac{81}{100} = \boxed{\frac{19}{100}}.$$

    **2.** $U \geqslant 0$, donc $\mathbb{P}(U \leqslant t) = 0$ pour $t < 0$ ; $U \leqslant 1$, donc $\mathbb{P}(U \leqslant t) = 1$ pour $t > 1$. Pour $t \in [0, 1]$, 
    $$\mathbb{P}(U \leqslant t) = \mathbb{P}\big(|X - Y| > \tfrac{1}{4}\big) + \mathbb{P}\big(\max(X, Y) \leqslant t,\ |X - Y| \leqslant \tfrac{1}{4}\big).$$
     Si $t \leqslant \frac{1}{4}$, $\max(X, Y) \leqslant t$ entraîne $|X - Y| \leqslant \frac{1}{4}$, et le second terme vaut $t^{2}$ : $\boxed{\mathbb{P}(U \leqslant t) = \frac{9}{16} + t^{2}}$. Si $t \in [\frac{1}{4}, 1]$, il faut retirer du carré $[0, t]^{2}$ les deux triangles $|x - y| > \frac{1}{4}$, de côtés $t - \frac{1}{4}$ : 
    $$\mathbb{P}(U \leqslant t) = \frac{9}{16} + t^{2} - \Big(t - \frac{1}{4}\Big)^{2} = \frac{9}{16} + \frac{t}{2} - \frac{1}{16} = \boxed{\frac{1 + t}{2}}.$$
     Les évènements ne sont pas indépendants : pour $t \in \,]0, \frac{1}{4}]$, $\mathbb{P}(\max(X, Y) \leqslant t,\ |X - Y| \leqslant \frac{1}{4}) = t^{2} \neq \frac{7}{16}t^{2}$. Savoir qu'ils arrivent tous deux tôt garantit qu'ils se croisent.

    1.5em

    ![Figure](documents/figures/4891aefbb7b21072.svg)

    La fonction de répartition de $U$ : un saut de $\frac{9}{16}$ en $0$ (ils ne se croisent pas), un arc de parabole sur $[0, \frac{1}{4}]$, puis un segment de pente $\frac{1}{2}$ jusqu'à $1$.

    Le saut en $0$ montre que $\mathbb{P}(U = 0) = \frac{9}{16}$ : $\boxed{U \text{ n'a pas de densité}}$. Sa loi mélange une masse de Dirac et une partie à densité ($2t$ sur $[0, \frac{1}{4}]$, $\frac{1}{2}$ sur $[\frac{1}{4}, 1]$), comme à l'exercice 1 de la feuille 4.

    **3.** $\mathbb{P}(|T - X| \leqslant \frac{1}{4})$ est la longueur de $[T - \frac{1}{4}, T + \frac{1}{4}] \cap [0, 1]$ : elle vaut $T + \frac{1}{4}$ si $T \leqslant \frac{1}{4}$, $\frac{1}{2}$ si $\frac{1}{4} \leqslant T \leqslant \frac{3}{4}$, et $\frac{5}{4} - T$ si $T \geqslant \frac{3}{4}$. Elle est maximale, égale à $\frac{1}{2}$, pour $\boxed{T \in [\tfrac{1}{4}, \tfrac{3}{4}]}$ : en arrivant à heure fixe au milieu de la plage, Pécuchet fait mieux ($\frac{1}{2}$) qu'en arrivant au hasard ($\frac{7}{16}$).
- id: "l3-pr-07-08"
  feuille: "f-l3-pr-07"
  numero: 8
  partie: "Changements de variables"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [changement de variables]
  noeuds: [cv-changement, p-independance]
  notions: [densite-probabilite, mesure-densite]
  source: "Bordeaux, TD 3, exercice 1"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soient $X$ et $Y$ indépendantes de loi $\mathcal{E}(\lambda)$, $U = X + Y$ et $V = \frac{X + Y}{Y}$.

    **1.** Montrer que $(U, V)$ a pour densité $\lambda^{2}\frac{u}{v^{2}}\mathrm{e}^{-\lambda u}\mathbf{1}_{\{u \geqslant 0\}}\mathbf{1}_{\{v \geqslant 1\}}$.

    **2.** En déduire les lois de $U$ et de $V$. Sont-elles indépendantes ? Calculer $\mathbb{P}(V \geqslant 2)$ et interpréter.
  corrige: |
    **1.** L'application $(x, y) \mapsto (u, v) = \big(x + y, \frac{x + y}{y}\big)$ est un difféomorphisme de $]0, +\infty[^{2}$ sur $\{u > 0, v > 1\}$, d'inverse $x = u\big(1 - \frac{1}{v}\big)$, $y = \frac{u}{v}$. Son jacobien inverse est 
    $$\det\begin{pmatrix} 1 - \frac{1}{v} & \frac{u}{v^{2}} \\ \frac{1}{v} & -\frac{u}{v^{2}} \end{pmatrix} = -\frac{u}{v^{2}} + \frac{u}{v^{3}} - \frac{u}{v^{3}} = -\frac{u}{v^{2}}.$$
     Comme $f_{X, Y}(x, y) = \lambda^{2}\mathrm{e}^{-\lambda(x + y)} = \lambda^{2}\mathrm{e}^{-\lambda u}$, le théorème 1 donne la densité annoncée.

    **2.** Elle se factorise : $\lambda^{2}u\,\mathrm{e}^{-\lambda u}\mathbf{1}_{u > 0} \cdot \frac{1}{v^{2}}\mathbf{1}_{v > 1}$. Donc $\boxed{U \sim \Gamma(2, \lambda)}$, $V$ a la densité $\boxed{\frac{1}{v^{2}}\mathbf{1}_{v > 1}}$, et $U$ et $V$ sont *indépendantes* (prop. 4). Puis $\mathbb{P}(V \geqslant 2) = \int_{2}^{+\infty}\frac{\mathrm{d} v}{v^{2}} = \boxed{\frac{1}{2}}$ : en effet, $V \geqslant 2$ équivaut à $X \geqslant Y$, de probabilité $\frac{1}{2}$ par symétrie. L'indépendance de $U$ et $V$ dit que la proportion $\frac{Y}{X + Y} = \frac{1}{V}$ ne dépend pas de la durée totale.
- id: "l3-pr-07-09"
  feuille: "f-l3-pr-07"
  numero: 9
  partie: "Changements de variables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [changement de variables]
  noeuds: [cv-changement, p-independance]
  notions: [densite-probabilite, mesure-densite]
  source: "Bordeaux, TD 3, exercice 2 ; Durand, exercice 2.12"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soient $X \sim \Gamma(a, \lambda)$ et $Y \sim \Gamma(b, \lambda)$ indépendantes, $U = X + Y$ et $V = \frac{X}{X + Y}$.

    **1.** Calculer l'espérance et la variance de $X$, et déterminer la loi de $cX$ pour $c > 0$.

    **2.** Déterminer la densité de $(U, V)$. Montrer que $U$ et $V$ sont indépendantes, et que $U \sim \Gamma(a + b, \lambda)$ et $V \sim \beta(a, b)$. En déduire que $\mathrm{B}(a, b) = \frac{\Gamma(a)\Gamma(b)}{\Gamma(a + b)}$, puis l'espérance et la variance de $V$.

    **3.** Soient $G_{1}, \dots, G_{k}$ indépendantes de loi $\mathcal{N}(0, 1)$. Montrer que $G_{1}^{2} \sim \Gamma(\frac{1}{2}, \frac{1}{2})$, puis que $G_{1}^{2} + \dots + G_{k}^{2} \sim \Gamma(\frac{k}{2}, \frac{1}{2})$, en utilisant $\Gamma(\frac{1}{2}) = \sqrt{\pi}$.

    **4.** *Applications.* (a) Les durées entre appels à un standard sont indépendantes, de loi $\mathcal{E}(0{,}5)$ (en minutes) ; quelle est la loi de la durée entre le premier et le dixième appel ? (b) Des piles ont des durées de vie indépendantes de loi exponentielle de moyenne $3$ heures, et l'on remplace chaque pile usée par une neuve. Combien faut-il de piles, la première comprise, pour fonctionner $9$ heures avec une probabilité de panne inférieure à $5\,\%$ ? On pourra montrer que $\mathbb{P}(S_{n} \leqslant t) = \mathbb{P}(N \geqslant n)$ pour $S_{n} \sim \Gamma(n, \lambda)$ et $N \sim \mathcal{P}(\lambda t)$.
  corrige: |
    **1.** Avec $\int_{0}^{+\infty}x^{a + k - 1}\mathrm{e}^{-\lambda x}\,\mathrm{d} x = \frac{\Gamma(a + k)}{\lambda^{a + k}}$ et $\Gamma(a + 1) = a\Gamma(a)$, on obtient $\mathbb{E}[X^{2}] = \frac{a(a + 1)}{\lambda^{2}}$, puis 
    $$\boxed{\mathbb{E}[X] = \frac{a}{\lambda}}, \qquad \boxed{\operatorname{Var}(X) = \frac{a}{\lambda^{2}}}.$$
     La variable $cX$ a la densité $\frac{1}{c}f\big(\frac{x}{c}\big) = \frac{(\lambda/c)^{a}}{\Gamma(a)}x^{a - 1}\mathrm{e}^{-\lambda x/c}$ : $\boxed{cX \sim \Gamma\big(a, \tfrac{\lambda}{c}\big)}$ ; le second paramètre est l'inverse d'une échelle.

    **2.** L'inverse de $(x, y) \mapsto (u, v)$ est $x = uv$, $y = u(1 - v)$, de jacobien $\det\begin{pmatrix} v & u \\ 1 - v & -u \end{pmatrix} = -u$. Pour $u > 0$ et $v \in \,]0, 1[$, 
    $$f_{U, V}(u, v) = \frac{\lambda^{a + b}}{\Gamma(a)\Gamma(b)}(uv)^{a - 1}\big(u(1 - v)\big)^{b - 1}\mathrm{e}^{-\lambda u}\,u = \frac{\lambda^{a + b}u^{a + b - 1}\mathrm{e}^{-\lambda u}}{\Gamma(a + b)} \cdot \frac{\Gamma(a + b)}{\Gamma(a)\Gamma(b)}v^{a - 1}(1 - v)^{b - 1}.$$
     La densité se factorise ; le premier facteur est la densité de $\Gamma(a + b, \lambda)$, d'intégrale $1$. Le second est donc une densité sur $]0, 1[$, et son intégrale vaut $1$ : 
    $$\boxed{\mathrm{B}(a, b) = \frac{\Gamma(a)\Gamma(b)}{\Gamma(a + b)}}, \qquad \boxed{U \sim \Gamma(a + b, \lambda), \quad V \sim \beta(a, b), \quad U \text{ et } V \text{ indépendantes}}.$$
     On a démontré, au passage, que *la somme de deux variables gamma indépendantes de même paramètre $\lambda$ est une variable gamma* ; pour $a = b = 1$, on retrouve l'exemple du cours. Puis, avec $\mathrm{B}(a + 1, b) = \frac{a}{a + b}\mathrm{B}(a, b)$, 
    $$\boxed{\mathbb{E}[V] = \frac{a}{a + b}}, \qquad \mathbb{E}[V^{2}] = \frac{a(a + 1)}{(a + b)(a + b + 1)}, \qquad \boxed{\operatorname{Var}(V) = \frac{ab}{(a + b)^{2}(a + b + 1)}}.$$

    **3.** Pour $t > 0$, $\mathbb{P}(G_{1}^{2} \leqslant t) = 2\Phi(\sqrt{t}) - 1$ ; en dérivant, 
    $$f_{G_{1}^{2}}(t) = \frac{1}{\sqrt{t}}\cdot\frac{1}{\sqrt{2\pi}}\mathrm{e}^{-t/2}.$$
     Comme $\frac{(1/2)^{1/2}}{\Gamma(1/2)} = \frac{1}{\sqrt{2\pi}}$, c'est la densité de $\boxed{\Gamma(\tfrac{1}{2}, \tfrac{1}{2})}$. Par la question 2 et une récurrence, $\boxed{G_{1}^{2} + \dots + G_{k}^{2} \sim \Gamma(\tfrac{k}{2}, \tfrac{1}{2})}$ : c'est la loi du $\chi^{2}$ à $k$ degrés de liberté, que le chapitre 10 retrouvera par une autre voie.

    **4.(a)** La durée entre le premier et le dixième appel est la somme de $9$ durées indépendantes de loi $\mathcal{E}(0{,}5)$ : elle suit $\boxed{\Gamma(9\,;\,0{,}5)}$, d'espérance $18$ minutes.

    **(b)** Avec $n$ piles, la durée de fonctionnement est $S_{n} \sim \Gamma(n, \frac{1}{3})$. L'exercice 14 montre que $\mathbb{P}(S_{n} \leqslant t) = \mathbb{P}(N(t) \geqslant n)$, où $N(t) \sim \mathcal{P}(\frac{t}{3})$ ; pour $t = 9$, $N(9) \sim \mathcal{P}(3)$. On cherche le plus petit $n$ tel que $\mathbb{P}(N(9) \geqslant n) < 0{,}05$ : $\mathbb{P}(N(9) \geqslant 6) \approx 0{,}084$ et $\mathbb{P}(N(9) \geqslant 7) \approx 0{,}034$. Il faut $\boxed{7 \text{ piles}}$, alors que trois piles couvrent neuf heures « en moyenne ».
- id: "l3-pr-07-10"
  feuille: "f-l3-pr-07"
  numero: 10
