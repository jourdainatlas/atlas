  notions: [densite-probabilite, independance]
  source: "Durand, exercice 2.14"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soient $U_{1}, \dots, U_{n}$ indépendantes de loi $\mathcal{U}([0, 1])$.

    **1.** Pour $r \geqslant 1$ et $i \in \llbracket 1, r\rrbracket$, soit $X_{i}$ le nombre de points $U_{j}$ dans $\big]\frac{i - 1}{r}, \frac{i}{r}\big]$. Déterminer la loi du vecteur $(X_{1}, \dots, X_{r})$ et ses covariances. Par quelle loi peut-on approcher celle de $(X_{1}, \dots, X_{k})$, $k$ fixé, lorsque $n$ et $r$ tendent vers $+\infty$ avec $\frac{n}{r} \to a > 0$ ?

    **2.** Montrer que $\mathbb{P}(\exists\, i < j : U_{i} = U_{j}) = 0$. On note $U_{(1)} < \dots < U_{(n)}$ les $U_{i}$ rangés dans l'ordre croissant (*statistiques d'ordre*), de sorte que $U_{(k)} = U_{\sigma(k)}$ pour une permutation aléatoire $\sigma$. Montrer que $\sigma$ suit la loi uniforme sur $\mathfrak{S}_{n}$.

    **3.** Montrer que le vecteur $(U_{(1)}, \dots, U_{(n)})$ a pour densité 
    $$n!\,\mathbf{1}_{\{0 \leqslant x_{1} \leqslant \dots \leqslant x_{n} \leqslant 1\}}.$$
     En déduire que $U_{(i)} \sim \beta(i, n - i + 1)$.

    **4.** Montrer que les *espacements* $U_{(i)} - U_{(i - 1)}$, $2 \leqslant i \leqslant n$, ont tous la même loi, que l'on déterminera.
  corrige: |
    **1.** Chaque point tombe dans l'intervalle $i$ avec probabilité $\frac{1}{r}$, indépendamment des autres : $(X_{1}, \dots, X_{r})$ suit la 
    $$\boxed{\text{loi multinomiale de paramètres } n \text{ et } (\tfrac{1}{r}, \dots, \tfrac{1}{r})}$$
     (feuille 5, exercice 19). Donc $\operatorname{Var}(X_{i}) = \frac{n}{r}\big(1 - \frac{1}{r}\big)$ et $\boxed{\operatorname{Cov}(X_{i}, X_{j}) = -\frac{n}{r^{2}}}$ pour $i \neq j$. Lorsque $\frac{n}{r} \to a$, la feuille 5 (exercice 19 (5)) montre que $(X_{1}, \dots, X_{k})$ converge en loi vers 
    $$\boxed{k \text{ variables indépendantes de loi } \mathcal{P}(a)}:$$
     c'est la répartition « poissonienne » de points jetés au hasard.

    **2.** Pour $i < j$, $\mathbb{P}(U_{i} = U_{j}) = \iint_{\{x = y\}}\mathrm{d} x\,\mathrm{d} y = 0$ (la diagonale est négligeable), et une réunion finie d'évènements négligeables l'est encore.

    Hors de cet évènement négligeable, la permutation $\sigma$ est définie, et 
    $$\{\sigma = \tau\} = \{U_{\tau(1)} < \dots < U_{\tau(n)}\}.$$
     Le vecteur $(U_{\tau(1)}, \dots, U_{\tau(n)})$ a la même loi que $(U_{1}, \dots, U_{n})$ (densité produit, invariante par permutation des coordonnées), donc ces $n!$ évènements, deux à deux disjoints, ont même probabilité, et leur réunion est presque sûre : $\boxed{\mathbb{P}(\sigma = \tau) = \frac{1}{n!}}$ pour tout $\tau \in \mathfrak{S}_{n}$.

    **3.** Soit $C = \{0 \leqslant x_{1} < \dots < x_{n} \leqslant 1\}$ et $B \subset C$ borélien. Par la question 2, 
    $$\mathbb{P}\big((U_{(1)}, \dots, U_{(n)}) \in B\big) = \sum_{\tau \in \mathfrak{S}_{n}}\mathbb{P}\big((U_{\tau(1)}, \dots, U_{\tau(n)}) \in B\big) = n!\,\lambda(B),$$
     d'où la densité $\boxed{n!\,\mathbf{1}_{C}}$. La densité de $U_{(i)}$ s'obtient en intégrant les autres variables : pour $x \in [0, 1]$, les $i - 1$ premières décrivent un simplexe de volume $\frac{x^{i - 1}}{(i - 1)!}$ et les $n - i$ dernières un simplexe de volume $\frac{(1 - x)^{n - i}}{(n - i)!}$. Donc 
    $$\boxed{f_{U_{(i)}}(x) = \frac{n!}{(i - 1)!\,(n - i)!}\,x^{i - 1}(1 - x)^{n - i}}, \qquad U_{(i)} \sim \beta(i, n - i + 1), \qquad \mathbb{E}[U_{(i)}] = \frac{i}{n + 1}.$$

    1.5em

    ![Figure](documents/figures/b8c882064b78d986.svg)

    Les densités des cinq statistiques d'ordre de $n = 5$ points uniformes : les lois $\beta(i, 6 - i)$, centrées en $\frac{i}{6}$. Les points rangés se répartissent régulièrement en moyenne, la plus petite et la plus grande valeur étant collées aux bords.

    **4.** L'application linéaire $(x_{1}, \dots, x_{n}) \mapsto (y_{1}, \dots, y_{n}) = (x_{1}, x_{2} - x_{1}, \dots, x_{n} - x_{n - 1})$ est triangulaire de déterminant $1$, et elle envoie $C$ sur le simplexe $\{y_{k} \geqslant 0,\ y_{1} + \dots + y_{n} \leqslant 1\}$ (aux bords près). Par le théorème 1, $(U_{(1)}, U_{(2)} - U_{(1)}, \dots, U_{(n)} - U_{(n - 1)})$ a la densité $n!$ sur ce simplexe, qui est invariant par permutation des coordonnées. Toutes les coordonnées ont donc la même loi, celle de la première, $U_{(1)}$ : 
    $$\boxed{\text{chaque espacement suit } \beta(1, n), \text{ de densité } n(1 - x)^{n - 1}},$$
     d'espérance $\frac{1}{n + 1}$. Les $n$ points découpent $[0, 1]$ en $n + 1$ morceaux qui ont tous la même loi, y compris le premier et le dernier.

