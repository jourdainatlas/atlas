  source: "Bordeaux, TD 3, exercice 4 ; Durand, exercices 2.10 (4) et 2.26 (fin) ; Rubenthaler, chapitre 6, exercice 9"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soient $X$ et $Y$ indépendantes de loi $\mathcal{N}(0, \sigma^{2})$, $\sigma > 0$, et $Z = \frac{X}{Y}$.

    **1.** Déterminer la loi de $Z$. La variable $Z$ est-elle intégrable ?

    **2.** Quelle est la loi de $\frac{1}{Z}$ ? Le vérifier sans calcul.
  corrige: |
    **1.** $Z = \frac{X/\sigma}{Y/\sigma}$ est le quotient de deux variables indépendantes de loi $\mathcal{N}(0, 1)$ : par l'exemple du cours (section 7.5.2), 
    $$\boxed{Z \text{ suit la loi de Cauchy}},$$
     de densité $\frac{1}{\pi(1 + z^{2})}$, quel que soit $\sigma$. Elle n'est pas intégrable, car $\frac{|z|}{\pi(1 + z^{2})} \sim \frac{1}{\pi|z|}$ en $\pm\infty$.

    **2.** $\frac{1}{Z} = \frac{Y}{X}$, et $(Y, X)$ a la même loi que $(X, Y)$ (variables indépendantes de même loi) ; donc $\frac{Y}{X}$ a la même loi que $\frac{X}{Y}$ : 
    $$\boxed{\tfrac{1}{Z} \text{ suit aussi la loi de Cauchy}}.$$
     Le calcul direct, par la prop. 10 du chapitre 4 avec $z \mapsto \frac{1}{z}$, redonne $\frac{1}{z^{2}} \cdot \frac{1}{\pi(1 + 1/z^{2})} = \frac{1}{\pi(1 + z^{2})}$.
- id: "l3-pr-07-11"
  feuille: "f-l3-pr-07"
  numero: 11
  partie: "Changements de variables"
  etoiles: 2
  types: [Calcul]
  mots_cles: [changement de variables]
  noeuds: [cv-changement, p-independance]
  notions: [densite-probabilite, mesure-densite]
  source: "Durand, exercice 2.16 ; Rubenthaler, chapitre 7, exercice 1 (a) ; Durand, exercice 1.25 (4)"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soient $X$ et $Y$ indépendantes de loi $\mathcal{E}(\alpha)$, $m = \min(X, Y)$ et $M = \max(X, Y)$.

    **1.** Calculer la fonction de répartition de $M$.

    **2.** Déterminer la loi du couple $(m, M - m)$. En déduire que $m$ et $M - m$ sont indépendantes, et donner leurs lois. Interpréter à l'aide de l'absence de mémoire. Quelle est la loi de $|X - Y|$ ?
  corrige: |
    **1.** Par indépendance, $\mathbb{P}(M \leqslant t) = \mathbb{P}(X \leqslant t)\mathbb{P}(Y \leqslant t) = \boxed{(1 - \mathrm{e}^{-\alpha t})^{2}}$ pour $t \geqslant 0$.

    **2.** Sur $\{X < Y\}$, $(m, M - m) = (X, Y - X)$ ; l'application $(x, y) \mapsto (x, y - x)$ a pour jacobien $1$, et pour $s > 0$, $d > 0$, elle contribue à la densité par $\alpha^{2}\mathrm{e}^{-\alpha s}\mathrm{e}^{-\alpha(s + d)}$. Le cas $\{Y < X\}$ donne la même contribution, et $\{X = Y\}$ est négligeable. Donc 
    $$f_{m, M - m}(s, d) = 2\alpha^{2}\mathrm{e}^{-2\alpha s}\mathrm{e}^{-\alpha d} = \boxed{2\alpha\,\mathrm{e}^{-2\alpha s} \cdot \alpha\,\mathrm{e}^{-\alpha d}}, \qquad s, d > 0 :$$

    $$\boxed{m \sim \mathcal{E}(2\alpha) \text{ et } M - m \sim \mathcal{E}(\alpha) \text{ sont indépendantes}}.$$

    *Interprétation.* Deux appareils de durées de vie $\mathcal{E}(\alpha)$ fonctionnent ; la première panne survient au bout d'un temps $\mathcal{E}(2\alpha)$. Par l'absence de mémoire, l'appareil restant est alors « comme neuf », et il dure encore un temps $\mathcal{E}(\alpha)$, quel que soit l'instant de la première panne.

    Enfin $|X - Y| = M - m$ : 
    $$\boxed{|X - Y| \sim \mathcal{E}(\alpha)}.$$
     L'écart entre deux durées exponentielles indépendantes de moyenne $t = \frac{1}{\alpha}$ a donc la même loi que chacune d'elles.
- id: "l3-pr-07-12"
  feuille: "f-l3-pr-07"
  numero: 12
  partie: "Changements de variables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [changement de variables]
  noeuds: [cv-changement, p-independance]
  notions: [densite-probabilite, mesure-densite]
  source: "Rubenthaler, chapitre 7, exercices 2 et 8"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soient $X$ et $Y$ indépendantes de loi $\mathcal{N}(0, 1)$. Montrer, par un changement de variables, que $X + Y$ et $X - Y$ sont indépendantes, et donner leurs lois.

    **2.** Soit $(X, Y)$ à valeurs dans $\mathbb{R}_{+}^{2}$, de densité $\frac{\exp(-(xy)^{1/4})}{4\pi(y\sqrt{x} + x\sqrt{y})}$. On pose $U = (XY)^{1/4}$ et $V = \big(\frac{X}{Y}\big)^{1/4}$. Déterminer la densité de $(U, V)$. Les variables $U$ et $V$ sont-elles indépendantes ? Donner leurs lois.
  corrige: |
    **1.** L'inverse de $(x, y) \mapsto (s, d) = (x + y, x - y)$ est $x = \frac{s + d}{2}$, $y = \frac{s - d}{2}$, de jacobien $-\frac{1}{2}$, et $x^{2} + y^{2} = \frac{s^{2} + d^{2}}{2}$. Donc 
    $$f_{S, D}(s, d) = \frac{1}{2} \cdot \frac{1}{2\pi}\mathrm{e}^{-(s^{2} + d^{2})/4} = \boxed{\frac{1}{\sqrt{4\pi}}\mathrm{e}^{-s^{2}/4} \cdot \frac{1}{\sqrt{4\pi}}\mathrm{e}^{-d^{2}/4}} :$$
     $X + Y$ et $X - Y$ sont indépendantes, de loi $\mathcal{N}(0, 2)$. Elles sont non corrélées ($\operatorname{Cov} = \operatorname{Var} X - \operatorname{Var} Y = 0$), et le chapitre 10 montrera que, pour des variables gaussiennes, c'est équivalent à l'indépendance.

    **2.** L'inverse de $(x, y) \mapsto (u, v)$ est $x = u^{2}v^{2}$, $y = \frac{u^{2}}{v^{2}}$, de jacobien 
    $$\det\begin{pmatrix} 2uv^{2} & 2u^{2}v \\ \frac{2u}{v^{2}} & -\frac{2u^{2}}{v^{3}} \end{pmatrix} = -\frac{4u^{3}}{v} - \frac{4u^{3}}{v} = -\frac{8u^{3}}{v}.$$
     Le dénominateur vaut $4\pi(y\sqrt{x} + x\sqrt{y}) = 4\pi\big(\frac{u^{2}}{v^{2}}uv + u^{2}v^{2}\frac{u}{v}\big) = \frac{4\pi u^{3}(1 + v^{2})}{v}$, et $(xy)^{1/4} = u$. Donc, pour $u, v > 0$, 
    $$f_{U, V}(u, v) = \frac{v\,\mathrm{e}^{-u}}{4\pi u^{3}(1 + v^{2})} \cdot \frac{8u^{3}}{v} = \boxed{\mathrm{e}^{-u} \cdot \frac{2}{\pi(1 + v^{2})}} :$$

    $$\boxed{U \sim \mathcal{E}(1) \text{ et } V \text{ (loi de } |C|, C \text{ de Cauchy) sont indépendantes}}.$$
     Le calcul a été vérifié par calcul formel.
- id: "l3-pr-07-13"
  feuille: "f-l3-pr-07"
  numero: 13
  partie: "Sommes, temps d'attente, statistiques d'ordre"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["sommes et statistiques d'ordre"]
  noeuds: [p-independance, p-poisson-exp]
  notions: [densite-probabilite, independance]
  source: "Bordeaux, TD 2, exercice 10 (3) ; Durand, exercice 2.18 ; Rubenthaler, chapitre 6, exercice 12 (a)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Soient $Y$ et $Z$ indépendantes de loi $\mathcal{E}(\lambda)$. Montrer que $Y - Z$ suit la loi de Laplace, de densité $\frac{\lambda}{2}\mathrm{e}^{-\lambda|x|}$.

    **2.** Soient $X$, $Y$, $\varepsilon$ indépendantes, $X$ et $Y$ de loi $\mathcal{U}([0, 1])$, et $\varepsilon \sim \mathcal{B}(\frac{1}{2})$. Déterminer la fonction de répartition et la densité de $T = X + \varepsilon Y$.
  corrige: |
    **1.** $-Z$ a la densité $\lambda\mathrm{e}^{\lambda z}\mathbf{1}_{z < 0}$. Par le théorème 2, pour $x \in \mathbb{R}$, 
    $$f_{Y - Z}(x) = \int_{\mathbb{R}}\lambda\mathrm{e}^{-\lambda y}\mathbf{1}_{y > 0}\,\lambda\mathrm{e}^{\lambda(x - y)}\mathbf{1}_{x - y < 0}\,\mathrm{d} y = \lambda^{2}\mathrm{e}^{\lambda x}\int_{\max(0, x)}^{+\infty}\mathrm{e}^{-2\lambda y}\,\mathrm{d} y = \frac{\lambda}{2}\mathrm{e}^{\lambda x - 2\lambda\max(0, x)},$$
     soit $\boxed{f_{Y - Z}(x) = \frac{\lambda}{2}\mathrm{e}^{-\lambda|x|}}$ : c'est la loi de Laplace, qui est aussi celle de $\varepsilon Y$, $\varepsilon$ de Rademacher indépendante de $Y$ (feuille 4, exercice 8).

    **2.** Par la formule des probabilités totales selon $\varepsilon$, et par indépendance de $\varepsilon$ et $(X, Y)$, 
    $$F_{T}(t) = \frac{1}{2}\mathbb{P}(X \leqslant t) + \frac{1}{2}\mathbb{P}(X + Y \leqslant t).$$
     La somme $X + Y$ a la densité triangulaire du cours, d'où 
    $$\boxed{F_{T}(t) = \frac{t}{2} + \frac{t^{2}}{4}} \ \text{sur } [0, 1], \qquad \boxed{F_{T}(t) = 1 - \frac{(2 - t)^{2}}{4}} \ \text{sur } [1, 2],$$
     et la densité est $\boxed{f_{T}(t) = \frac{1 + t}{2}}$ sur $[0, 1[$, $\boxed{f_{T}(t) = \frac{2 - t}{2}}$ sur $]1, 2]$ : la moyenne du créneau et du triangle. Elle vaut $1$ à gauche de $1$ et $\frac{1}{2}$ à droite, car le créneau s'arrête en $1$.

    1.5em

    ![Figure](documents/figures/cfac88dc85b706f8.svg)

    La densité de $T = X + \varepsilon Y$ (en bleu) est la demi-somme de celle de $X$ (créneau vert, cas $\varepsilon = 0$) et de celle de $X + Y$ (triangle orange, cas $\varepsilon = 1$). Elle saute en $0$ et en $1$, aux bords du créneau.
- id: "l3-pr-07-14"
  feuille: "f-l3-pr-07"
  numero: 14
  partie: "Sommes, temps d'attente, statistiques d'ordre"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["sommes et statistiques d'ordre"]
  noeuds: [p-independance, p-poisson-exp]
  notions: [densite-probabilite, independance]
  source: "Bordeaux, TD 3, exercice 7 ; Durand, exercice 2.9 (1) et (2)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{E}(\lambda)$, et $S_{n} = X_{1} + \dots + X_{n}$ ; pour $t \geqslant 0$, on pose $N(t) = \operatorname{card}\{n \geqslant 1 : S_{n} \leqslant t\}$.

    **1.** Rappeler la loi de $S_{n}$. Pour $k \in \mathbb{N}$, exprimer l'évènement $\{N(t) \geqslant k\}$ à l'aide de $S_{k}$, calculer $\mathbb{P}(N(t) \geqslant k)$, et en déduire que $N(t) \sim \mathcal{P}(\lambda t)$.

    **2.** Un poste de radio fonctionne avec une pile, de durée de vie $\mathcal{E}(\lambda)$, que l'on remplace par une neuve dès qu'elle est usée. Quelle est la loi du nombre de piles utilisées pendant les $t$ premières heures ? Quelles hypothèses a-t-on faites ?

    **3.** Un autre poste fonctionne avec deux piles, de durées de vie indépendantes de loi $\mathcal{E}(a)$, et s'arrête dès que l'une d'elles est usée. Quelle est la loi de sa durée de fonctionnement si l'on ne dispose que de ces deux piles ?
  corrige: |
    **1.** On a $S_{n} \sim \Gamma(n, \lambda)$ (cours, exemple du théorème 2). Comme la suite $(S_{n})$ est croissante, $\{N(t) \geqslant k\} = \{S_{k} \leqslant t\}$ pour $k \geqslant 1$. Posons 
    $$P_{k}(t) = 1 - \sum_{j = 0}^{k - 1}\mathrm{e}^{-\lambda t}\frac{(\lambda t)^{j}}{j!}.$$
     Sa dérivée est télescopique : 
    $$P_{k}'(t) = \lambda\mathrm{e}^{-\lambda t}\Big[\sum_{j = 0}^{k - 1}\frac{(\lambda t)^{j}}{j!} - \sum_{j = 1}^{k - 1}\frac{(\lambda t)^{j - 1}}{(j - 1)!}\Big] = \lambda\mathrm{e}^{-\lambda t}\frac{(\lambda t)^{k - 1}}{(k - 1)!},$$
     qui est la densité de $S_{k}$, et $P_{k}(0) = 0$. Donc $\mathbb{P}(N(t) \geqslant k) = \mathbb{P}(S_{k} \leqslant t) = P_{k}(t)$, et par différence, $\mathbb{P}(N(t) = k) = \mathrm{e}^{-\lambda t}\frac{(\lambda t)^{k}}{k!}$ : $\boxed{N(t) \sim \mathcal{P}(\lambda t)}$. C'est le *processus de Poisson* d'intensité $\lambda$.

    **2.** Le nombre de piles utilisées pendant $[0, t]$ est la pile initiale plus le nombre de remplacements effectués avant $t$ : $\boxed{1 + N(t)}$, avec $N(t) \sim \mathcal{P}(\lambda t)$. On a supposé les durées de vie indépendantes, de même loi $\mathcal{E}(\lambda)$, et le remplacement instantané.

    **3.** Le poste s'arrête au premier épuisement, au temps $\min(T_{1}, T_{2})$, et $\mathbb{P}(\min(T_{1}, T_{2}) > t) = \mathrm{e}^{-2at}$ : sa durée suit $\boxed{\mathcal{E}(2a)}$, d'espérance moitié moindre que celle d'une pile.
