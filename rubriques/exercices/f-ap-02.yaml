- id: "ap-02-01"
  feuille: "f-ap-02"
  numero: 1
  partie: "Généralités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications]
  noeuds: [r-produit, rel]
  notions: [application]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Les quatre diagrammes sagittaux ci-dessous définissent-ils une application de $E$ dans $F$ ? Justifier.

    ![Figure](documents/figures/75157323ce411249.svg)

    ![Figure](documents/figures/bd3d6aa10be3fcfd.svg)

    ![Figure](documents/figures/b6f05a3a18cdfb75.svg)

    ![Figure](documents/figures/d04a286a910f6bc0.svg)

    **2.** Même question pour les correspondances suivantes, en précisant à chaque fois ce qui fait défaut le cas échéant.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \dfrac{1}{x} \end{array}$

    **2.** $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \sqrt{x} \end{array}$

    **3.** $\begin{array}{r|ccl} h : & \mathbb{R} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array}$

    **4.** $\begin{array}{r|ccl} u : & \mathbb{Z} & \longrightarrow & \mathbb{N} \\ & n & \longmapsto & n^{2} \end{array}$
  corrige: |
    **1.** La définition du cours exige que *chaque* élément de $E$ possède *une et une seule* image.

    **(a)** Chacun des trois points de $E$ est l'origine d'exactement une flèche : 
    $$\boxed{\text{C'est une application.}}$$

    **(b)** L'élément $2$ est l'origine de deux flèches, vers $a$ et vers $b$ : 
    $$\boxed{\text{Ce n'est pas une application : l'élément } 2 \text{ a deux images.}}$$

    **(c)** Aucune flèche ne part de l'élément $2$ : 
    $$\boxed{\text{Ce n'est pas une application : l'élément } 2 \text{ n'a pas d'image.}}$$

    **(d)** Chacun des trois points est l'origine d'exactement une flèche, toutes dirigées vers $b$ : 
    $$\boxed{\text{C'est une application (constante).}}$$
     Rien n'interdit à un élément de $F$ de recevoir plusieurs flèches, ni de n'en recevoir aucune : la condition ne porte que sur l'ensemble de départ.

    **2.** On examine à chaque fois si tout élément de l'ensemble de départ possède une image dans l'ensemble d'arrivée.

    **(1)** Le quotient $\dfrac{1}{x}$ n'est pas défini pour $x=0$ : 
    $$\boxed{\text{Ce n'est pas une application : } 0 \text{ n'a pas d'image.}}$$

    **(2)** La racine carrée n'est pas définie pour $x<0$ : 
    $$\boxed{\text{Ce n'est pas une application : les réels strictement négatifs n'ont pas d'image.}}$$

    **(3)** Tout réel possède un carré, et ce carré est positif, donc appartient bien à $\mathbb{R}_{+}$ : 
    $$\boxed{\text{C'est une application.}}$$

    **(4)** Tout entier relatif possède un carré, qui est un entier positif, donc un élément de $\mathbb{N}$ : 
    $$\boxed{\text{C'est une application.}}$$

    *Piège :* aux questions **(3)** et **(4)**, il ne suffit pas que la formule ait un sens ; encore faut-il que le résultat appartienne à l'ensemble d'arrivée annoncé.
- id: "ap-02-02"
  feuille: "f-ap-02"
  numero: 2
  partie: "Généralités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications, égalité de deux applications, composition]
  noeuds: [r-produit, rel, r-composition]
  notions: [application]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chacun des cas suivants, dire si les deux applications $f$ et $g$ sont égales. Justifier en examinant les trois composantes d'une application.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array}$

    **2.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & (x+1)^{2} \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2}+2x+1 \end{array}$

    **3.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & |x| \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \sqrt{x^{2}} \end{array}$

    **4.** $\begin{array}{r|ccl} f : & \mathbb{R}_{+} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x \end{array}$

    **5.** $\begin{array}{r|ccl} f : & \mathbb{R}^{*} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \dfrac{x}{x} \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{R}^{*} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 1 \end{array}$
  corrige: |
    Deux applications sont égales lorsque leurs trois composantes le sont : même ensemble de départ, même ensemble d'arrivée, et même image pour chaque élément.

    **1.** Les ensembles de départ et les formules coïncident, mais les ensembles d'arrivée sont $\mathbb{R}$ et $\mathbb{R}_{+}$ : 
    $$\boxed{f \neq g}$$
     C'est exactement la distinction annoncée par le cours, et elle est loin d'être formelle : $f$ n'est pas surjective, alors que $g$ l'est.

    **2.** Les ensembles coïncident, et pour tout réel $x$ on a $(x+1)^{2}=x^{2}+2x+1$ : 
    $$\boxed{f = g}$$

    **3.** Les ensembles coïncident, et pour tout réel $x$ on a $\sqrt{x^{2}}=|x|$ : 
    $$\boxed{f = g}$$
     On notera que $\sqrt{x^{2}}=x$ serait faux pour $x<0$.

    **4.** Les ensembles de départ sont $\mathbb{R}_{+}$ et $\mathbb{R}$ : 
    $$\boxed{f \neq g}$$

    **5.** Les ensembles coïncident, et pour tout réel non nul $x$ on a $\dfrac{x}{x}=1$ : 
    $$\boxed{f = g}$$
     L'exclusion de $0$ est ici indispensable : sur $\mathbb{R}$ tout entier, $f$ ne serait pas une application.
- id: "ap-02-03"
  feuille: "f-ap-02"
  numero: 3
  partie: "Généralités"
  etoiles: 2
  types: [Conjecture]
  mots_cles: [applications, injectivité, surjectivité]
  noeuds: [r-produit, rel, r-injections]
  notions: [application, injection, surjection]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On pose $E=\{1 \;;\; 2 \;;\; 3\}$ et $F=\{a \;;\; b\}$.

    **1.** Combien y a-t-il d'applications de $E$ dans $F$ ? Les décrire toutes, par exemple en donnant le triplet $\big(f(1)\,;f(2)\,;f(3)\big)$.

    **2.** Parmi elles, lesquelles sont injectives ? lesquelles sont surjectives ?

    **3.** Reprendre les deux questions précédentes pour les applications de $F$ dans $E$.

    **4.** Conjecturer une expression du nombre d'éléments de $F^{E}$ lorsque $E$ et $F$ sont finis.
  corrige: |
    **1.** Se donner une application de $E$ dans $F$, c'est se donner les trois images $f(1)$, $f(2)$ et $f(3)$, chacune valant $a$ ou $b$ : il y a deux choix indépendants pour chacune. 
    $$\boxed{\text{Il y a } 2 \times 2 \times 2 = 8 \text{ applications de } E \text{ dans } F.}$$
     Les voici, sous la forme $\big(f(1)\,;f(2)\,;f(3)\big)$ : 
    $$(a\,;a\,;a) \quad (a\,;a\,;b) \quad (a\,;b\,;a) \quad (a\,;b\,;b) \quad (b\,;a\,;a) \quad (b\,;a\,;b) \quad (b\,;b\,;a) \quad (b\,;b\,;b)$$

    **2.** Une application injective enverrait les trois éléments de $E$ sur trois éléments distincts de $F$, qui n'en compte que deux : chacun des huit triplets comporte donc au moins une répétition. 
    $$\boxed{\text{Aucune n'est injective.}}$$
     Une application est surjective lorsque $a$ et $b$ figurent tous deux dans le triplet, ce qui exclut $(a\,;a\,;a)$ et $(b\,;b\,;b)$ : 
    $$\boxed{\text{Six sont surjectives.}}$$

    **3.** Une application de $F$ dans $E$ est déterminée par le couple $\big(f(a)\,;f(b)\big)$, chaque coordonnée valant $1$, $2$ ou $3$ : il y en a $3 \times 3 = 9$. Elle est injective lorsque $f(a) \neq f(b)$, ce qui exclut les trois couples $(1\,;1)$, $(2\,;2)$ et $(3\,;3)$. 
    $$\boxed{\begin{array}{l} \text{Il y a } 9 \text{ applications de } F \text{ dans } E, \text{ dont } 6 \text{ injectives.} \\[1mm] \text{Aucune n'est surjective : deux images ne peuvent pas couvrir trois éléments.} \end{array}}$$

    **4.** On généralise le raisonnement de comptage : 
    $$\boxed{\text{Si } E \text{ et } F \text{ sont finis, } F^{E} \text{ possède } (\text{card } F)^{\,\text{card } E} \text{ éléments.}}$$
     C'est ce qui justifie la notation $F^{E}$ ; ce résultat sera réutilisé à l'exercice 25.
- id: "ap-02-04"
  feuille: "f-ap-02"
  numero: 4
  partie: "Composition"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications, composition]
  noeuds: [r-produit, rel, r-composition]
  notions: [application]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Dans chacun des cas suivants, $f$ et $g$ sont des applications de $\mathbb{R}$ dans $\mathbb{R}$. Déterminer $g \circ f$ et $f \circ g$, puis conclure.

    **1.** $f(x)=2x+1$ et $g(x)=x^{2}$

    **2.** $f(x)=x-3$ et $g(x)=x^{3}$

    **3.** $f(x)=\mathrm{e}^{x}$ et $g(x)=x+1$

    **4.** $f(x)=x^{2}$ et $g(x)=x^{2}$
  corrige: |
    On rappelle que dans $g \circ f$, c'est $f$ qui agit en premier.

    **1.** On compose dans les deux sens : 
    $$(g \circ f)(x) = g(2x+1) = (2x+1)^{2} \qquad\text{et}\qquad (f \circ g)(x) = f\big(x^{2}\big) = 2x^{2}+1$$

    $$\boxed{g \circ f \neq f \circ g}$$

    **2.** On procède de la même manière : 
    $$(g \circ f)(x) = (x-3)^{3} \qquad\text{et}\qquad (f \circ g)(x) = x^{3}-3 \qquad\text{donc}\qquad \boxed{g \circ f \neq f \circ g}$$

    **3.** On procède de la même manière : 
    $$(g \circ f)(x) = \mathrm{e}^{x}+1 \qquad\text{et}\qquad (f \circ g)(x) = \mathrm{e}^{x+1} \qquad\text{donc}\qquad \boxed{g \circ f \neq f \circ g}$$

    **4.** Ici $f=g$, donc les deux composées coïncident : 
    $$(g \circ f)(x) = \big(x^{2}\big)^{2} = x^{4} = (f \circ g)(x) \qquad\text{donc}\qquad \boxed{g \circ f = f \circ g}$$

    *Conclusion :* la composition n'est pas commutative en général, ce que montrent les trois premiers cas. Le quatrième rappelle qu'elle peut l'être dans des cas particuliers : « non commutative » ne signifie pas « jamais commutative ».
- id: "ap-02-05"
  feuille: "f-ap-02"
  numero: 5
  partie: "Composition"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications, composition]
  noeuds: [r-produit, rel, r-composition]
  notions: [application]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soient $f$, $g$ et $h$ les applications de $\mathbb{R}$ dans $\mathbb{R}$ définies par $f(x)=x+1$, $g(x)=2x$ et $h(x)=x^{2}$.

    **1.** Calculer $g \circ f$, puis $h \circ (g \circ f)$.

    **2.** Calculer $h \circ g$, puis $(h \circ g) \circ f$. Que constate-t-on ?

    **3.** Calculer $f \circ \mathrm{Id}_{\mathbb{R}}$ et $\mathrm{Id}_{\mathbb{R}} \circ f$.

    **4.** Ces calculs démontrent-ils l'associativité de la composition ? Justifier.
  corrige: |
    **1.** On compose dans l'ordre indiqué : 
    $$(g \circ f)(x) = g(x+1) = 2(x+1) = 2x+2$$

    $$\big(h \circ (g \circ f)\big)(x) = h(2x+2) = \boxed{(2x+2)^{2}}$$

    **2.** On regroupe cette fois les deux dernières applications : 
    $$(h \circ g)(x) = h(2x) = 4x^{2} \qquad\text{puis}\qquad \big((h \circ g) \circ f\big)(x) = 4(x+1)^{2} = \boxed{(2x+2)^{2}}$$

    $$\boxed{h \circ (g \circ f) = (h \circ g) \circ f \text{ sur cet exemple.}}$$

    **3.** Pour tout réel $x$ : 
    $$\big(f \circ \mathrm{Id}_{\mathbb{R}}\big)(x) = f(x) = x+1 \qquad\text{et}\qquad \big(\mathrm{Id}_{\mathbb{R}} \circ f\big)(x) = \mathrm{Id}_{\mathbb{R}}(x+1) = x+1$$

    $$\boxed{f \circ \mathrm{Id}_{\mathbb{R}} = \mathrm{Id}_{\mathbb{R}} \circ f = f}$$

    **4.** La réponse est négative : 
    $$\boxed{\text{Non : un exemple ne démontre jamais une propriété universelle.}}$$
     C'est l'asymétrie signalée au chapitre 1 : un exemple ne prouve rien, un contre-exemple suffit à réfuter. La démonstration générale de l'associativité figure dans la propriété 1 du cours, où l'on compare les images d'un $x$ *quelconque*.
- id: "ap-02-06"
  feuille: "f-ap-02"
  numero: 6
  partie: "Composition"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, composition, involutions]
  noeuds: [r-produit, rel, r-composition, r-inverses]
  notions: [application]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Une application $f : E \to E$ est dite *involutive* lorsque $f \circ f = \mathrm{Id}_{E}$. Montrer que les applications suivantes le sont.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & -x \end{array}$

    **2.** $\begin{array}{r|ccl} g : & \mathbb{R}^{*} & \longrightarrow & \mathbb{R}^{*} \\ & x & \longmapsto & \dfrac{1}{x} \end{array}$

    **3.** $\begin{array}{r|ccl} u : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 1-x \end{array}$

    **4.** $\begin{array}{r|ccl} v : & \mathbb{R} \setminus \{1\} & \longrightarrow & \mathbb{R} \setminus \{1\} \\ & x & \longmapsto & \dfrac{x+1}{x-1} \end{array}$

    Pour la dernière, on vérifiera d'abord que $v(x)$ appartient bien à $\mathbb{R} \setminus \{1\}$ pour tout $x$ de $\mathbb{R} \setminus \{1\}$.
  corrige: |
    **1.** Pour tout réel $x$ : $(f \circ f)(x) = f(-x) = -(-x) = x$, donc : 
    $$\boxed{f \circ f = \mathrm{Id}_{\mathbb{R}}}$$

    **2.** Pour tout réel non nul $x$, le nombre $\dfrac{1}{x}$ est encore non nul, et : 
    $$(g \circ g)(x) = \frac{1}{\frac{1}{x}} = x \qquad\text{donc}\qquad \boxed{g \circ g = \mathrm{Id}_{\mathbb{R}^{*}}}$$

    **3.** Pour tout réel $x$ : $(u \circ u)(x) = 1-(1-x) = x$, donc : 
    $$\boxed{u \circ u = \mathrm{Id}_{\mathbb{R}}}$$

    **4.** Vérifions d'abord que $v$ est bien à valeurs dans $\mathbb{R} \setminus \{1\}$. Supposons $v(x)=1$ pour un $x \neq 1$ : 
    $$\frac{x+1}{x-1}=1 \iff x+1=x-1 \iff 1=-1$$
     ce qui est absurde. Donc $v(x) \neq 1$ pour tout $x$ de $\mathbb{R} \setminus \{1\}$, et la composée $v \circ v$ a bien un sens. On calcule alors : 
    $$(v \circ v)(x) = \frac{v(x)+1}{v(x)-1} = \frac{\dfrac{x+1}{x-1}+1}{\dfrac{x+1}{x-1}-1} = \frac{\dfrac{(x+1)+(x-1)}{x-1}}{\dfrac{(x+1)-(x-1)}{x-1}} = \frac{2x}{2} = x$$

    $$\boxed{v \circ v = \mathrm{Id}_{\mathbb{R} \setminus \{1\}}}$$

    *Piège :* la vérification préalable n'est pas une formalité. Sans elle, $v(x)$ pourrait sortir de l'ensemble de départ de $v$, et l'écriture $v \circ v$ n'aurait aucun sens.
- id: "ap-02-07"
  feuille: "f-ap-02"
  numero: 7
  partie: "Injectivité, surjectivité, bijectivité"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications, injectivité, surjectivité, bijectivité]
  noeuds: [r-produit, rel, r-injections]
  notions: [application, injection, surjection, bijection]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Chacun des quatre diagrammes ci-dessous définit une application de $E$ dans $F$. Pour chacune, dire si elle est injective, surjective, bijective, ou aucune des trois. Justifier en exhibant l'élément qui met en défaut la propriété.

    ![Figure](documents/figures/6c1c4813640d4384.svg)

    ![Figure](documents/figures/fa4a9ba899651a9a.svg)

    ![Figure](documents/figures/43886c9b1f49ac41.svg)

    ![Figure](documents/figures/c5ff07fdaf09401a.svg)
  corrige: |
    **(a)** Chaque élément de $F$ reçoit exactement une flèche : 
    $$\boxed{\text{Bijective.}}$$

    **(b)** L'élément $a$ reçoit deux flèches, celles de $1$ et de $2$, mais tout élément de $F$ en reçoit au moins une : 
    $$\boxed{\text{Surjective, non injective : } 1 \text{ et } 2 \text{ ont la même image } a.}$$

    **(c)** Chaque élément de $F$ reçoit au plus une flèche, mais $c$ n'en reçoit aucune : 
    $$\boxed{\text{Injective, non surjective : } c \text{ n'a pas d'antécédent.}}$$

    **(d)** L'élément $a$ reçoit deux flèches et $c$ n'en reçoit aucune : 
    $$\boxed{\text{Ni injective (}1 \text{ et } 2 \text{ ont la même image), ni surjective (}c \text{ n'a pas d'antécédent).}}$$
- id: "ap-02-08"
  feuille: "f-ap-02"
  numero: 8
  partie: "Injectivité, surjectivité, bijectivité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [applications, injectivité, surjectivité, bijectivité]
  noeuds: [r-produit, rel, r-injections]
  notions: [application, injection, surjection, bijection]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Les applications suivantes sont-elles injectives ? surjectives ? bijectives ? On rédigera en suivant les deux schémas donnés dans le cours.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array}$

    **2.** $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{3} \end{array}$

    **3.** $\begin{array}{r|ccl} h : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \cos(x) \end{array}$

    **4.** $\begin{array}{r|ccl} u : & \mathbb{R}_{+} & \longrightarrow & [0\,;1[ \\ & x & \longmapsto & \dfrac{x^{2}}{x^{2}+1} \end{array}$

    **5.** $\begin{array}{r|ccl} v : & \mathbb{R}^{\mathbb{R}} & \longrightarrow & \mathbb{R} \\ & \varphi & \longmapsto & \varphi(0) \end{array}$

    **6.** $\begin{array}{r|ccl} w : & \mathcal{C}\big([0\,;1]\,,\mathbb{R}\big) & \longrightarrow & \mathbb{R} \\ & \varphi & \longmapsto & \displaystyle\int_{0}^{1} \varphi(t)\,\mathrm{d}t \end{array}$

    Dans les deux derniers cas, $\mathbb{R}^{\mathbb{R}}$ désigne l'ensemble des applications de $\mathbb{R}$ dans $\mathbb{R}$, et $\mathcal{C}\big([0\,;1]\,,\mathbb{R}\big)$ celui des fonctions continues de $[0\,;1]$ dans $\mathbb{R}$.
  corrige: |
    **1.** L'application $f : x \mapsto x^{2}$ de $\mathbb{R}$ dans $\mathbb{R}$ vérifie $f(-1)=f(1)=1$, et le réel $-1$ n'a pas d'antécédent puisqu'un carré est positif. 
    $$\boxed{f \text{ n'est ni injective, ni surjective.}}$$

    **2.** *Injectivité.* Soit $(x\,;x') \in \mathbb{R}^{2}$ tel que $x^{3}=x'^{3}$. La fonction cube étant strictement croissante sur $\mathbb{R}$, elle est injective : $x \neq x'$ entraînerait $x^{3} \neq x'^{3}$. Donc $x=x'$.

    *Surjectivité.* Soit $y \in \mathbb{R}$. Posons $x=y^{1/3}$, qui est bien un réel. Alors $g(x)=y$. 
    $$\boxed{g \text{ est bijective, de bijection réciproque } y \mapsto y^{1/3}.}$$

    **3.** On a $\cos(0)=\cos(2\pi)=1$, et le réel $2$ n'a pas d'antécédent puisque $|\cos| \leqslant 1$. 
    $$\boxed{h \text{ n'est ni injective, ni surjective.}}$$

    **4.** *Injectivité.* Soit $(x\,;x') \in \mathbb{R}_{+}^{2}$ tel que $u(x)=u(x')$ : 
    $$\frac{x^{2}}{x^{2}+1}=\frac{x'^{2}}{x'^{2}+1} \iff x^{2}\big(x'^{2}+1\big)=x'^{2}\big(x^{2}+1\big) \iff x^{2}=x'^{2}$$
     Comme $x$ et $x'$ sont positifs, il vient $x=x'$.

    *Surjectivité.* Soit $y \in [0\,;1[$. Alors $1-y>0$, et l'on peut poser : 
    $$x=\sqrt{\frac{y}{1-y}}$$
     qui est bien un élément de $\mathbb{R}_{+}$. On a $x^{2}=\dfrac{y}{1-y}$, d'où : 
    $$u(x)=\frac{\frac{y}{1-y}}{\frac{y}{1-y}+1}=\frac{\frac{y}{1-y}}{\frac{y+1-y}{1-y}}=y$$

    $$\boxed{u \text{ est bijective.}}$$

    **5.** L'application $v$ associe à une fonction sa valeur en $0$. Les fonctions $\varphi_{1} : x \mapsto 0$ et $\varphi_{2} : x \mapsto x$ sont distinctes et vérifient $\varphi_{1}(0)=\varphi_{2}(0)=0$. En revanche, pour tout $y \in \mathbb{R}$, la fonction constante égale à $y$ a pour image $y$. 
    $$\boxed{v \text{ est surjective, non injective.}}$$

    **6.** Les fonctions $\varphi_{1} : t \mapsto 0$ et $\varphi_{2} : t \mapsto t-\dfrac{1}{2}$ sont continues sur $[0\,;1]$, distinctes, et d'intégrales toutes deux nulles. En revanche, pour tout $y \in \mathbb{R}$, la fonction constante égale à $y$ a pour intégrale $y$. 
    $$\boxed{w \text{ est surjective, non injective.}}$$
     On remarque que les questions 5 et 6 se traitent exactement de la même façon : dans les deux cas, l'application « oublie » presque toute l'information contenue dans $\varphi$.
