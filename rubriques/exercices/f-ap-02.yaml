  enonce: |
    On considère l'application : 
    $$\begin{array}{r|ccl} f : & \mathbb{R}^{2} & \longrightarrow & \mathbb{R}^{2} \\ & (x\,;y) & \longmapsto & (x+y \,;\, x+2y) \end{array}$$

    **1.** L'application $f$ est-elle injective ?

    **2.** L'application $f$ est-elle surjective ?

    **3.** Conclure.
  corrige: |
    **1.** Soient $(x\,;y)$ et $(x'\,;y')$ deux éléments de $\mathbb{R}^{2}$ tels que $f(x\,;y)=f(x'\,;y')$, c'est-à-dire : 
    $$\left\{\begin{array}{l} x+y=x'+y' \\ x+2y=x'+2y' \end{array}\right.$$
     En soustrayant la première ligne à la seconde, il vient $y=y'$, puis la première donne $x=x'$. Donc $(x\,;y)=(x'\,;y')$ : 
    $$\boxed{f \text{ est injective.}}$$

    **2.** Soit $(a\,;b) \in \mathbb{R}^{2}$. Posons $y=b-a$ et $x=2a-b$, qui sont bien des réels. Alors : 
    $$x+y=(2a-b)+(b-a)=a \qquad\text{et}\qquad x+2y=(2a-b)+2(b-a)=b$$
     donc $f(x\,;y)=(a\,;b)$. 
    $$\boxed{f \text{ est surjective.}}$$

    **3.** On conclut : 
    $$\boxed{f \text{ est bijective, et } f^{-1}(a\,;b)=(2a-b \,;\, b-a).}$$
- id: "ap-02-10"
  feuille: "f-ap-02"
  numero: 10
  partie: "Injectivité, surjectivité, bijectivité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, bijectivité, bijection réciproque]
  noeuds: [r-produit, rel, r-injections, r-inverses]
  notions: [application, bijection]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On note $\mathcal{P}air$ l'ensemble des entiers naturels pairs. Démontrer que l'application : 
    $$\begin{array}{r|ccl} \varphi : & \mathbb{N} & \longrightarrow & \mathcal{P}air \\ & n & \longmapsto & 2n \end{array}$$
     est bijective, et préciser sa bijection réciproque.

    Il y a donc « autant » d'entiers naturels que d'entiers naturels pairs, bien que le second ensemble soit strictement inclus dans le premier. Commenter ce résultat.
  corrige: |
    *Injectivité.* Soit $(n\,;n') \in \mathbb{N}^{2}$ tel que $\varphi(n)=\varphi(n')$, c'est-à-dire $2n=2n'$. En divisant par $2$, on obtient $n=n'$.

    *Surjectivité.* Soit $p \in \mathcal{P}air$. Par définition, $p$ est un entier naturel pair : il existe donc $k \in \mathbb{N}$ tel que $p=2k$. Alors $k \in \mathbb{N}$ et $\varphi(k)=p$. 
    $$\boxed{\varphi \text{ est bijective, et } \varphi^{-1}(p)=\dfrac{p}{2}.}$$

    *Commentaire.* L'inclusion $\mathcal{P}air \subset \mathbb{N}$ est stricte, puisque $1 \notin \mathcal{P}air$, et pourtant les deux ensembles sont en bijection. C'est impossible pour un ensemble fini : une partie stricte d'un ensemble fini a toujours strictement moins d'éléments. Cette propriété caractérise en fait les ensembles infinis.

    *Piège :* si l'on avait pris pour $\mathcal{P}air$ l'ensemble des entiers *relatifs* pairs, $\varphi$ n'aurait plus été surjective, l'entier $-2$ n'ayant pas d'antécédent dans $\mathbb{N}$.
- id: "ap-02-11"
  feuille: "f-ap-02"
  numero: 11
  partie: "Injectivité, surjectivité, bijectivité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [applications, injectivité, surjectivité, bijectivité, bijection réciproque]
  noeuds: [r-produit, rel, r-injections, r-inverses]
  notions: [application, injection, surjection, bijection]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On considère les cinq applications suivantes, qui se calculent toutes de la même façon.

    **1.** $\begin{array}{r|ccl} f_{1} : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array}$

    **2.** $\begin{array}{r|ccl} f_{2} : & \mathbb{R} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array}$

    **3.** $\begin{array}{r|ccl} f_{3} : & \mathbb{R}_{+} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array}$

    **4.** $\begin{array}{r|ccl} f_{4} : & \mathbb{R}_{+} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array}$

    **5.** $\begin{array}{r|ccl} f_{5} : & \mathbb{R}_{-} & \longrightarrow & \mathbb{R}_{+} \\ & x & \longmapsto & x^{2} \end{array}$

    **1.** Pour chacune, déterminer si elle est injective, surjective, bijective.

    **2.** Préciser la bijection réciproque lorsqu'elle existe.

    **3.** Quelle conclusion générale tirer de cet exercice ?
  corrige: |
    **1.** et **2.** On rassemble les résultats.

    $$\begin{array}{|c|c|c|c|c|c|} \hline  & \text{Départ} & \text{Arrivée} & \text{Injective} & \text{Surjective} & \text{Réciproque} \\ \hline f_{1} & \mathbb{R} & \mathbb{R} & \text{non} & \text{non} & \text{---} \\ \hline f_{2} & \mathbb{R} & \mathbb{R}_{+} & \text{non} & \text{oui} & \text{---} \\ \hline f_{3} & \mathbb{R}_{+} & \mathbb{R} & \text{oui} & \text{non} & \text{---} \\ \hline f_{4} & \mathbb{R}_{+} & \mathbb{R}_{+} & \text{oui} & \text{oui} & y \mapsto \sqrt{y} \\ \hline f_{5} & \mathbb{R}_{-} & \mathbb{R}_{+} & \text{oui} & \text{oui} & y \mapsto -\sqrt{y} \\ \hline \end{array}$$

    Justifions les points essentiels.

    • *Défaut d'injectivité* pour $f_{1}$ et $f_{2}$ : on a $(-1)^{2}=1^{2}$, et $-1$ comme $1$ appartiennent à $\mathbb{R}$.

    • *Injectivité* de $f_{3}$, $f_{4}$ et $f_{5}$ : si $x^{2}=x'^{2}$ avec $x$ et $x'$ de même signe, alors $x=x'$.

    • *Défaut de surjectivité* pour $f_{1}$ et $f_{3}$ : le réel $-1$ n'a pas d'antécédent.

    • *Surjectivité* de $f_{2}$, $f_{4}$ et $f_{5}$ : pour $y \in \mathbb{R}_{+}$, le réel $\sqrt{y}$ (respectivement $-\sqrt{y}$) est un antécédent situé dans l'ensemble de départ.

    **3.** On tire de ce tableau la conclusion générale : 
    $$\boxed{\begin{array}{l} \text{L'injectivité et la surjectivité ne dépendent pas de la formule, mais du triplet} \\[1mm] \text{(départ, arrivée, graphe). Restreindre l'arrivée peut créer la surjectivité,} \\[1mm] \text{restreindre le départ peut créer l'injectivité.} \end{array}}$$
     C'est exactement ce que le cours illustre avec la fonction sinus.
- id: "ap-02-12"
  feuille: "f-ap-02"
  numero: 12
  partie: "Injectivité, surjectivité, bijectivité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, composition, injectivité, surjectivité, bijectivité]
  noeuds: [r-produit, rel, r-composition, r-injections]
  notions: [application, injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soient $E$, $F$ et $G$ trois ensembles, ainsi que deux applications $f : E \to F$ et $g : F \to G$.

    **1.** Démontrer que si $g \circ f$ est injective, alors $f$ est injective.

    **2.** Démontrer que si $g \circ f$ est surjective, alors $g$ est surjective.

    **3.** On pose $\begin{array}{r|ccl} f : & \mathbb{N} & \longrightarrow & \mathbb{Z} \\ & n & \longmapsto & n \end{array}$ et $\begin{array}{r|ccl} g : & \mathbb{Z} & \longrightarrow & \mathbb{N} \\ & k & \longmapsto & |k| \end{array}$. Déterminer $g \circ f$.

    **4.** En déduire un exemple où $g \circ f$ est injective sans que $g$ le soit, et un exemple où $g \circ f$ est surjective sans que $f$ le soit.

    **5.** Démontrer que si $f$ et $g$ sont bijectives, alors $g \circ f$ l'est aussi.
  corrige: |
    **1.** Soit $(x\,;x') \in E^{2}$ tel que $f(x)=f(x')$. En appliquant $g$ aux deux membres : 
    $$g\big(f(x)\big)=g\big(f(x')\big) \qquad\text{c'est-à-dire}\qquad (g \circ f)(x)=(g \circ f)(x')$$
     Comme $g \circ f$ est injective, on en déduit $x=x'$. 
    $$\boxed{f \text{ est injective.}}$$

    **2.** Soit $z \in G$. Comme $g \circ f$ est surjective, il existe $x \in E$ tel que $(g \circ f)(x)=z$. Posons $y=f(x)$, qui appartient à $F$. Alors $g(y)=z$. 
    $$\boxed{g \text{ est surjective.}}$$

    **3.** Pour tout $n \in \mathbb{N}$, on a $g\big(f(n)\big)=|n|=n$ puisque $n$ est positif : 
    $$\boxed{g \circ f = \mathrm{Id}_{\mathbb{N}}}$$

    **4.** L'application $\mathrm{Id}_{\mathbb{N}}$ est injective et surjective. Pourtant :

    • $g$ n'est pas injective, car $g(-1)=g(1)=1$ ;

    • $f$ n'est pas surjective, car $-1 \in \mathbb{Z}$ n'a pas d'antécédent dans $\mathbb{N}$.

    $$\boxed{\begin{array}{l} \text{Les réciproques des questions 1 et 2 sont donc fausses : } g \circ f \text{ peut être} \\[1mm] \text{injective sans que } g \text{ le soit, et surjective sans que } f \text{ le soit.} \end{array}}$$

    **5.** *Injectivité.* Soit $(x\,;x') \in E^{2}$ tel que $(g \circ f)(x)=(g \circ f)(x')$. Comme $g$ est injective, $f(x)=f(x')$ ; comme $f$ est injective, $x=x'$.

    *Surjectivité.* Soit $z \in G$. Comme $g$ est surjective, il existe $y \in F$ tel que $g(y)=z$ ; comme $f$ est surjective, il existe $x \in E$ tel que $f(x)=y$. Alors $(g \circ f)(x)=z$. 
    $$\boxed{g \circ f \text{ est bijective.}}$$
- id: "ap-02-13"
  feuille: "f-ap-02"
  numero: 13
  partie: "Le rôle des ensembles de départ et d'arrivée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications, injectivité, surjectivité, bijectivité]
  noeuds: [r-produit, rel, r-injections]
  notions: [application, injection, surjection, bijection]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $\varphi$ la fonction définie sur $[-2\,;2]$ par $\varphi(x)=x^{3}-3x$, dont la courbe représentative est donnée ci-dessous. Trois droites horizontales y ont été tracées.

    ![Figure](documents/figures/5bb9dbbb0ba204c0.svg)

    **1.** Pour chacune des trois droites, lire le nombre de points d'intersection avec la courbe.

    **2.** L'application $\begin{array}{r|ccl} f : & [-2\,;2] & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{3}-3x \end{array}$ est-elle injective ? surjective ?

    **3.** Même question pour $\begin{array}{r|ccl} g : & [-2\,;2] & \longrightarrow & [-2\,;2] \\ & x & \longmapsto & x^{3}-3x \end{array}$.

    **4.** Proposer un intervalle $I \subset [-2\,;2]$ tel que $\begin{array}{r|ccl} h : & I & \longrightarrow & [-2\,;2] \\ & x & \longmapsto & x^{3}-3x \end{array}$ soit bijective. Y a-t-il plusieurs réponses possibles ?
  corrige: |
    **1.** On lit sur le graphique : 
    $$\boxed{y=2{,}5 \;:\; 0 \text{ point} \qquad y=1 \;:\; 3 \text{ points} \qquad y=-2 \;:\; 2 \text{ points}}$$
     Pour $y=-2$, la droite est tangente à la courbe au point d'abscisse $1$ et la recoupe à l'extrémité gauche, en $x=-2$.

    **2.** La droite $y=1$ rencontre la courbe en trois points : le réel $1$ possède trois antécédents. La droite $y=2{,}5$ n'en rencontre aucun : le réel $2{,}5$ n'a pas d'antécédent. 
    $$\boxed{f \text{ n'est ni injective, ni surjective.}}$$

    **3.** L'ensemble d'arrivée est maintenant $[-2\,;2]$. Toute droite d'équation $y=a$ avec $a \in [-2\,;2]$ rencontre la courbe au moins une fois, mais la droite $y=1$ la rencontre encore trois fois. 
    $$\boxed{g \text{ est surjective, mais toujours pas injective.}}$$
     Restreindre l'ensemble d'arrivée a créé la surjectivité, sans rien changer à l'injectivité.

    **4.** Il faut choisir $I$ de sorte que chaque droite $y=a$, pour $a \in [-2\,;2]$, rencontre la courbe restreinte exactement une fois : autrement dit, un intervalle sur lequel $\varphi$ est monotone et prend toutes les valeurs de $[-2\,;2]$. 
    $$\boxed{I=[-2\,;-1] \qquad\text{ou}\qquad I=[-1\,;1] \qquad\text{ou}\qquad I=[1\,;2]}$$
     Il y a donc trois réponses possibles. Sur $[-2\,;-1]$ et $[1\,;2]$, la fonction croît de $-2$ à $2$ ; sur $[-1\,;1]$, elle décroît de $2$ à $-2$.
- id: "ap-02-14"
  feuille: "f-ap-02"
  numero: 14
  partie: "Le rôle des ensembles de départ et d'arrivée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [applications, bijectivité]
  noeuds: [r-produit, rel, r-injections]
  notions: [application, bijection]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Pour chacune des expressions suivantes, proposer un ensemble de départ $E$ et un ensemble d'arrivée $F$, aussi grands que possible, rendant l'application $x \mapsto \varphi(x)$ bijective de $E$ dans $F$.

    **1.** $\varphi(x)=2x+3$

    **2.** $\varphi(x)=x^{2}+2x$

    **3.** $\varphi(x)=\dfrac{1}{x}$

    **4.** $\varphi(x)=\mathrm{e}^{x}$
  corrige: |
    **1.** L'application $x \mapsto 2x+3$ est affine de coefficient directeur non nul : 
    $$\boxed{E=\mathbb{R} \quad,\quad F=\mathbb{R} \quad,\quad \varphi^{-1}(y)=\dfrac{y-3}{2}}$$

    **2.** On écrit $x^{2}+2x=(x+1)^{2}-1$. La fonction est strictement croissante sur $[-1\,;+\infty[$, où elle prend toutes les valeurs de $[-1\,;+\infty[$ : 
    $$\boxed{E=[-1\,;+\infty[ \quad,\quad F=[-1\,;+\infty[ \quad,\quad \varphi^{-1}(y)=-1+\sqrt{y+1}}$$
     Le choix $E=\;]-\infty\,;-1]$ convient également, avec $\varphi^{-1}(y)=-1-\sqrt{y+1}$.

    **3.** L'inverse est défini et à valeurs dans $\mathbb{R}^{*}$ : 
    $$\boxed{E=\mathbb{R}^{*} \quad,\quad F=\mathbb{R}^{*} \quad,\quad \varphi^{-1}(y)=\dfrac{1}{y}}$$
     Cette application est sa propre réciproque : c'est l'involution rencontrée à l'exercice 6.

    **4.** L'exponentielle est strictement croissante sur $\mathbb{R}$ et à valeurs strictement positives, avec pour limites $0$ et $+\infty$ : 
    $$\boxed{E=\mathbb{R} \quad,\quad F=\;]0\,;+\infty[ \quad,\quad \varphi^{-1}(y)=\ln(y)}$$

    *Piège :* prendre $F=\mathbb{R}$ pour l'exponentielle détruirait la surjectivité, puisqu'aucun réel négatif n'a d'antécédent.
- id: "ap-02-15"
  feuille: "f-ap-02"
  numero: 15
  partie: "Bijection réciproque"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [applications, composition, bijectivité, bijection réciproque]
  noeuds: [r-produit, rel, r-composition, r-injections, r-inverses]
  notions: [application, bijection]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Démontrer que chacune des applications suivantes est bijective, puis déterminer sa bijection réciproque. On vérifiera à chaque fois que $f^{-1} \circ f = \mathrm{Id}$.

    **1.** $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 3x-5 \end{array}$

    **2.** $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{3} \end{array}$

    **3.** $\begin{array}{r|ccl} h : & \mathbb{R} \setminus \{2\} & \longrightarrow & \mathbb{R} \setminus \{1\} \\ & x & \longmapsto & \dfrac{x+1}{x-2} \end{array}$
  corrige: |
    **1.** *Injectivité.* Si $3x-5=3x'-5$, alors $3x=3x'$ puis $x=x'$.

    *Surjectivité.* Soit $y \in \mathbb{R}$. Posons $x=\dfrac{y+5}{3}$, qui est un réel, et $f(x)=3 \times \dfrac{y+5}{3}-5=y$. 
    $$\boxed{f \text{ est bijective, et } f^{-1}(y)=\dfrac{y+5}{3}}$$
     *Vérification :* $f^{-1}\big(f(x)\big)=\dfrac{(3x-5)+5}{3}=x$ ✓

    **2.** La fonction cube est strictement croissante sur $\mathbb{R}$, donc injective, et tout réel $y$ admet $y^{1/3}$ pour antécédent. 
    $$\boxed{g \text{ est bijective, et } g^{-1}(y)=y^{1/3}}$$
     *Vérification :* $g^{-1}\big(g(x)\big)=\big(x^{3}\big)^{1/3}=x$ ✓

    **3.** Vérifions d'abord que $h$ est bien à valeurs dans $\mathbb{R} \setminus \{1\}$. Si $\dfrac{x+1}{x-2}=1$, alors $x+1=x-2$, ce qui est absurde.

    *Injectivité.* Soient $x$ et $x'$ dans $\mathbb{R} \setminus \{2\}$ tels que $h(x)=h(x')$ : 
    $$\frac{x+1}{x-2}=\frac{x'+1}{x'-2} \iff (x+1)(x'-2)=(x'+1)(x-2) \iff -2x+x'=-2x'+x \iff x=x'$$

    *Surjectivité.* Soit $y \in \mathbb{R} \setminus \{1\}$. Posons $x=\dfrac{2y+1}{y-1}$, bien défini car $y \neq 1$. Ce réel est différent de $2$ : sinon $2y+1=2y-2$, ce qui est absurde. Et l'on vérifie que $h(x)=y$. 
    $$\boxed{h \text{ est bijective, et } h^{-1}(y)=\dfrac{2y+1}{y-1}}$$
- id: "ap-02-16"
  feuille: "f-ap-02"
  numero: 16
  partie: "Bijection réciproque"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [bijectivité]
  noeuds: [r-injections]
  notions: [bijection]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Dans chacun des cas suivants, déterminer $J=f(I)$, montrer que $f$ réalise une bijection de $I$ sur $J$, puis préciser $f^{-1}$.

    **1.** $f(x)=x^{2}-4x+3$ et $I=\;]-\infty\,;2]$

    **2.** $f(x)=\dfrac{2x-1}{x+2}$ et $I=\;]-2\,;+\infty[$

    **3.** $f(x)=\sqrt{2x+3}-1$ et $I=\left[-\dfrac{3}{2}\,;+\infty\right[$
  corrige: |
    **1.** On écrit $f(x)=x^{2}-4x+3=(x-2)^{2}-1$. Sur $I=\;]-\infty\,;2]$, la fonction est strictement décroissante, avec $f(2)=-1$ et $f(x) \to +\infty$ quand $x \to -\infty$ : 
    $$\boxed{J=[-1\,;+\infty[}$$
     Soit $y \in J$. L'équation $(x-2)^{2}-1=y$ équivaut à $(x-2)^{2}=y+1$, avec $y+1 \geqslant 0$, donc à $x-2=\pm\sqrt{y+1}$. La contrainte $x \leqslant 2$ impose $x=2-\sqrt{y+1}$ : chaque $y$ de $J$ a donc un unique antécédent dans $I$. 
    $$\boxed{f \text{ réalise une bijection de } I \text{ sur } J, \text{ et } f^{-1}(y)=2-\sqrt{y+1}}$$

    **2.** On écrit $f(x)=\dfrac{2x-1}{x+2}=2-\dfrac{5}{x+2}$. Sur $I=\;]-2\,;+\infty[$, le dénominateur $x+2$ est strictement positif et croissant, donc $f$ est strictement croissante, avec $f(x) \to -\infty$ quand $x \to -2^{+}$ et $f(x) \to 2^{-}$ quand $x \to +\infty$ : 
    $$\boxed{J=\;]-\infty\,;2[}$$
     Soit $y \in J$. On résout : 
    $$y=2-\frac{5}{x+2} \iff \frac{5}{x+2}=2-y \iff x+2=\frac{5}{2-y} \iff x=\frac{5}{2-y}-2=\frac{2y+1}{2-y}$$
     Ce réel est bien strictement supérieur à $-2$ puisque $\dfrac{5}{2-y}>0$. 
    $$\boxed{f \text{ réalise une bijection de } I \text{ sur } J, \text{ et } f^{-1}(y)=\dfrac{2y+1}{2-y}}$$

    **3.** Sur $I=\left[-\dfrac{3}{2}\,;+\infty\right[$, la quantité $2x+3$ est positive et croissante, donc $f$ est strictement croissante, avec $f\left(-\dfrac{3}{2}\right)=-1$ et $f(x) \to +\infty$ : 
    $$\boxed{J=[-1\,;+\infty[}$$
     Soit $y \in J$. Comme $y+1 \geqslant 0$ : 
    $$y=\sqrt{2x+3}-1 \iff \sqrt{2x+3}=y+1 \iff 2x+3=(y+1)^{2} \iff x=\frac{(y+1)^{2}-3}{2}$$

    $$\boxed{f \text{ réalise une bijection de } I \text{ sur } J, \text{ et } f^{-1}(y)=\dfrac{(y+1)^{2}-3}{2}}$$

    *Piège :* l'équivalence $\sqrt{u}=v \iff u=v^{2}$ n'est correcte que sous la condition $v \geqslant 0$, ici assurée par $y \in [-1\,;+\infty[$.
- id: "ap-02-17"
  feuille: "f-ap-02"
  numero: 17
  partie: "Bijection réciproque"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [applications, composition, bijectivité, bijection réciproque]
  noeuds: [r-produit, rel, r-composition, r-injections, r-inverses]
  notions: [application, bijection]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soient $f : E \to F$ et $g : F \to G$ deux applications bijectives.

    **1.** Justifier que $g \circ f$ est bijective. On pourra utiliser l'exercice 12.

    **2.** Démontrer que $(g \circ f)^{-1} = f^{-1} \circ g^{-1}$.

    **3.** Application : on pose $f(x)=2x+1$ et $g(x)=x^{3}$, toutes deux de $\mathbb{R}$ dans $\mathbb{R}$. Calculer $(g \circ f)^{-1}$ de deux façons différentes, et vérifier que les résultats coïncident.

    **4.** Pourquoi l'ordre des deux applications est-il inversé dans la formule de la question 2 ?
  corrige: |
    **1.** C'est exactement la question 5 de l'exercice 12 : 
    $$\boxed{g \circ f \text{ est bijective.}}$$

    **2.** Il suffit de vérifier que $f^{-1} \circ g^{-1}$ se comporte comme la réciproque de $g \circ f$. Pour tout $z \in G$ : 
    $$\big((g \circ f) \circ (f^{-1} \circ g^{-1})\big)(z) = g\Big(f\big(f^{-1}(g^{-1}(z))\big)\Big) = g\big(g^{-1}(z)\big) = z$$
     et pour tout $x \in E$ : 
    $$\big((f^{-1} \circ g^{-1}) \circ (g \circ f)\big)(x) = f^{-1}\Big(g^{-1}\big(g(f(x))\big)\Big) = f^{-1}\big(f(x)\big) = x$$
     Les deux composées valent donc $\mathrm{Id}_{G}$ et $\mathrm{Id}_{E}$ : 
    $$\boxed{(g \circ f)^{-1} = f^{-1} \circ g^{-1}}$$

    **3.** *Première méthode.* On a $(g \circ f)(x)=(2x+1)^{3}$. En résolvant $y=(2x+1)^{3}$, il vient $2x+1=y^{1/3}$, puis : 
    $$x=\frac{y^{1/3}-1}{2}$$

    *Seconde méthode.* On a $f^{-1}(y)=\dfrac{y-1}{2}$ et $g^{-1}(y)=y^{1/3}$, donc : 
    $$\big(f^{-1} \circ g^{-1}\big)(y)=f^{-1}\big(y^{1/3}\big)=\frac{y^{1/3}-1}{2}$$

    $$\boxed{(g \circ f)^{-1}(y)=\dfrac{y^{1/3}-1}{2}}$$

    **4.** On répond en une phrase : 
    $$\boxed{\text{Pour revenir en arrière, on défait les opérations dans l'ordre inverse.}}$$
     Dans $g \circ f$, c'est $f$ qui agit d'abord et $g$ ensuite ; pour remonter, il faut donc défaire $g$ d'abord, puis $f$. L'image est celle d'un vêtement : on enfile la chaussette puis la chaussure, on retire la chaussure puis la chaussette.
- id: "ap-02-18"
  feuille: "f-ap-02"
  numero: 18
  partie: "Bijection réciproque"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, involutions, bijectivité, bijection réciproque]
  noeuds: [r-produit, rel, r-inverses, r-injections]
  notions: [application, bijection]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    On reprend les quatre applications involutives de l'exercice 6.

    **1.** Démontrer qu'une application involutive $f : E \to E$ est nécessairement bijective.

    **2.** Que vaut alors $f^{-1}$ ?

    **3.** En déduire les bijections réciproques des quatre applications de l'exercice 6.

    **4.** L'application $\begin{array}{r|ccl} u : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 2x \end{array}$ est-elle involutive ? Est-elle bijective ? Que peut-on en conclure sur la réciproque de la question 1 ?
  corrige: |
    **1.** Supposons $f \circ f = \mathrm{Id}_{E}$.

    *Injectivité.* Soit $(x\,;x') \in E^{2}$ tel que $f(x)=f(x')$. En appliquant $f$ : 
    $$x = (f \circ f)(x) = f\big(f(x)\big) = f\big(f(x')\big) = (f \circ f)(x') = x'$$

    *Surjectivité.* Soit $y \in E$. Posons $x=f(y)$, qui appartient à $E$. Alors $f(x)=(f \circ f)(y)=y$. 
    $$\boxed{\text{Une application involutive est bijective.}}$$

    **2.** De $f \circ f = \mathrm{Id}_{E}$ et de la bijectivité de $f$, on tire, en composant par $f^{-1}$ à gauche : 
    $$f^{-1} \circ f \circ f = f^{-1} \circ \mathrm{Id}_{E} \qquad\text{c'est-à-dire}\qquad \boxed{f^{-1}=f}$$

    **3.** On applique les deux questions précédentes : 
    $$\boxed{\begin{array}{l} \text{Les quatre applications de l'exercice 6 sont bijectives et égales à leur} \\[1mm] \text{propre réciproque : } x \mapsto -x, \; x \mapsto \dfrac{1}{x}, \; x \mapsto 1-x \; \text{ et } \; x \mapsto \dfrac{x+1}{x-1}. \end{array}}$$

    **4.** On a $(u \circ u)(x)=2 \times 2x=4x$, qui ne vaut $x$ que pour $x=0$ : $u$ n'est pas involutive. Elle est pourtant bijective, de réciproque $y \mapsto \dfrac{y}{2}$. 
    $$\boxed{\text{La réciproque de la question 1 est fausse : une bijection n'est pas toujours involutive.}}$$
- id: "ap-02-19"
  feuille: "f-ap-02"
  numero: 19
  partie: "Image directe et image réciproque"
  etoiles: 1
  types: [Calcul]
  mots_cles: [image directe, image réciproque]
  noeuds: [r-images]
  notions: [image-directe, image-reciproque]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **A.** On considère $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & 2x-1 \end{array}$. Déterminer :

    **1.** $f\big([0\,;3]\big)$

    **2.** $f^{-1}\big([1\,;7]\big)$

    **3.** $f^{-1}\big(\{0\}\big)$

    **4.** $f(\mathbb{Z})$

    **B.** On considère $\begin{array}{r|ccl} g : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2}-1 \end{array}$. Déterminer :

    **1.** $g\big([-2\,;1]\big)$

    **2.** $g^{-1}\big([0\,;3]\big)$

    **3.** $g^{-1}\big(\;]-\infty\,;-2[\;\big)$

    **4.** $g(\mathbb{R})$
  corrige: |
    **A.** L'application $f : x \mapsto 2x-1$ est affine strictement croissante.

    **(1)** L'image d'un intervalle par une fonction affine croissante est l'intervalle des images des bornes : $f(0)=-1$ et $f(3)=5$. 
    $$\boxed{f\big([0\,;3]\big)=[-1\,;5]}$$

    **(2)** On résout l'encadrement : $1 \leqslant 2x-1 \leqslant 7 \iff 2 \leqslant 2x \leqslant 8 \iff 1 \leqslant x \leqslant 4$. 
    $$\boxed{f^{-1}\big([1\,;7]\big)=[1\,;4]}$$

    **(3)** On résout $2x-1=0$, soit $x=\dfrac{1}{2}$. 
    $$\boxed{f^{-1}\big(\{0\}\big)=\left\{\dfrac{1}{2}\right\}}$$

    **(4)** Les images des entiers relatifs sont les nombres $2k-1$ avec $k \in \mathbb{Z}$. 
    $$\boxed{f(\mathbb{Z})=\{2k-1 \mid k \in \mathbb{Z}\} \text{ : l'ensemble des entiers impairs.}}$$

    **B.** L'application $g : x \mapsto x^{2}-1$.

    **(1)** Sur $[-2\,;1]$, la quantité $x^{2}$ prend toutes les valeurs de $[0\,;4]$ : le minimum $0$ est atteint en $x=0$ et le maximum $4$ en $x=-2$. 
    $$\boxed{g\big([-2\,;1]\big)=[-1\,;3]}$$
     *Piège :* il ne faut surtout pas se contenter des images des bornes, qui donneraient $[g(-2)\,;g(1)]=[3\,;0]$, dépourvu de sens. La fonction n'est pas monotone sur cet intervalle.

    **(2)** On résout : $0 \leqslant x^{2}-1 \leqslant 3 \iff 1 \leqslant x^{2} \leqslant 4 \iff 1 \leqslant |x| \leqslant 2$. 
    $$\boxed{g^{-1}\big([0\,;3]\big)=[-2\,;-1] \cup [1\,;2]}$$

    **(3)** L'inégalité $x^{2}-1<-2$ équivaut à $x^{2}<-1$, ce qui est impossible. 
    $$\boxed{g^{-1}\big(\;]-\infty\,;-2[\;\big)=\varnothing}$$

    **(4)** Le carré $x^{2}$ décrit $\mathbb{R}_{+}$ lorsque $x$ décrit $\mathbb{R}$. 
    $$\boxed{g(\mathbb{R})=[-1\,;+\infty[}$$
- id: "ap-02-20"
  feuille: "f-ap-02"
  numero: 20
  partie: "Image directe et image réciproque"
  etoiles: 2
  types: [Calcul]
  mots_cles: [image directe, image réciproque]
  noeuds: [r-images]
  notions: [image-directe, image-reciproque]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \sin(x) \end{array}$. Déterminer les ensembles suivants, après avoir vérifié dans chaque cas si la notation employée a un sens.

    **1.** $f^{-1}(0)$

    **2.** $f^{-1}\big(\{0\}\big)$

    **3.** $f^{-1}\big([0\,;+\infty[\big)$

    **4.** $f\big([0\,;\pi]\big)$

    **5.** $f\big(\{0\}\big)$

    **6.** $f(\mathbb{R})$
  corrige: |
    **1.** L'application $f$ n'est pas bijective : elle n'est ni injective, ni surjective (exercice 8, question 3, avec le cosinus ; le raisonnement est identique pour le sinus). 
    $$\boxed{\text{Notation incorrecte : } f^{-1}(y) \text{ n'a de sens que pour une bijection.}}$$
     Il faut bien distinguer $f^{-1}(y)$, qui désigne un *élément* et suppose $f$ bijective, de $f^{-1}(B)$, qui désigne une *partie* de l'ensemble de départ et a toujours un sens.

    **2.** On cherche les réels dont le sinus est nul : 
    $$\boxed{f^{-1}\big(\{0\}\big)=\{k\pi \mid k \in \mathbb{Z}\}}$$

    **3.** Le sinus est positif exactement sur les intervalles $[2k\pi \,;\, (2k+1)\pi]$ : 
    $$\boxed{f^{-1}\big([0\,;+\infty[\big)=\bigcup_{k \in \mathbb{Z}} \big[2k\pi \,;\, (2k+1)\pi\big]}$$

    **4.** Sur $[0\,;\pi]$, le sinus croît de $0$ à $1$ puis décroît de $1$ à $0$ : il prend toutes les valeurs de $[0\,;1]$. 
    $$\boxed{f\big([0\,;\pi]\big)=[0\,;1]}$$

    **5.** L'image directe d'un singleton est le singleton de l'image : 
    $$\boxed{f\big(\{0\}\big)=\{\sin(0)\}=\{0\}}$$

    **6.** Le sinus prend toutes les valeurs de $[-1\,;1]$ et aucune autre : 
    $$\boxed{f(\mathbb{R})=[-1\,;1]}$$
     C'est l'image de $f$ au sens du cours : c'est en la prenant pour ensemble d'arrivée que l'on rend $f$ surjective.
- id: "ap-02-21"
  feuille: "f-ap-02"
  numero: 21
  partie: "Image directe et image réciproque"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [applications, image directe, image réciproque]
  noeuds: [r-produit, rel, r-images]
  notions: [application, image-directe, image-reciproque]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f : E \to F$ une application, $A_{1}$ et $A_{2}$ deux parties de $E$, $B_{1}$ et $B_{2}$ deux parties de $F$. Démontrer les propriétés suivantes.

    **1.** $B_{1} \subset B_{2} \;\Longrightarrow\; f^{-1}(B_{1}) \subset f^{-1}(B_{2})$

    **2.** $f^{-1}(B_{1} \cap B_{2}) = f^{-1}(B_{1}) \cap f^{-1}(B_{2})$

    **3.** $f^{-1}(B_{1} \cup B_{2}) = f^{-1}(B_{1}) \cup f^{-1}(B_{2})$

    **4.** $A_{1} \subset A_{2} \;\Longrightarrow\; f(A_{1}) \subset f(A_{2})$

    **5.** $f(A_{1} \cup A_{2}) = f(A_{1}) \cup f(A_{2})$

    **6.** $f(A_{1} \cap A_{2}) \subset f(A_{1}) \cap f(A_{2})$

    **7.** $f\big(f^{-1}(B_{1})\big) \subset B_{1}$
  corrige: |
    **1.** Soit $x \in f^{-1}(B_{1})$. Alors $f(x) \in B_{1}$, donc $f(x) \in B_{2}$ puisque $B_{1} \subset B_{2}$, donc $x \in f^{-1}(B_{2})$. 
    $$\boxed{B_{1} \subset B_{2} \;\Longrightarrow\; f^{-1}(B_{1}) \subset f^{-1}(B_{2})}$$

    **2.** Soit $x \in E$. On enchaîne les équivalences : 
    $$\begin{aligned} x \in f^{-1}(B_{1} \cap B_{2}) &\iff f(x) \in B_{1} \cap B_{2} \\ &\iff f(x) \in B_{1} \;\text{ et }\; f(x) \in B_{2} \\ &\iff x \in f^{-1}(B_{1}) \;\text{ et }\; x \in f^{-1}(B_{2}) \\ &\iff x \in f^{-1}(B_{1}) \cap f^{-1}(B_{2}) \end{aligned}$$

    $$\boxed{f^{-1}(B_{1} \cap B_{2}) = f^{-1}(B_{1}) \cap f^{-1}(B_{2})}$$

    **3.** Le même enchaînement, en remplaçant partout « et » par « ou », donne : 
    $$\boxed{f^{-1}(B_{1} \cup B_{2}) = f^{-1}(B_{1}) \cup f^{-1}(B_{2})}$$

    **4.** Soit $y \in f(A_{1})$. Il existe $x \in A_{1}$ tel que $f(x)=y$. Comme $A_{1} \subset A_{2}$, ce $x$ appartient aussi à $A_{2}$, donc $y \in f(A_{2})$. 
    $$\boxed{A_{1} \subset A_{2} \;\Longrightarrow\; f(A_{1}) \subset f(A_{2})}$$

    **5.** *Première inclusion.* Soit $y \in f(A_{1} \cup A_{2})$ : il existe $x \in A_{1} \cup A_{2}$ tel que $f(x)=y$. Si $x \in A_{1}$, alors $y \in f(A_{1})$ ; sinon $x \in A_{2}$ et $y \in f(A_{2})$. Dans les deux cas $y \in f(A_{1}) \cup f(A_{2})$.

    *Réciproquement*, $A_{1} \subset A_{1} \cup A_{2}$ donne $f(A_{1}) \subset f(A_{1} \cup A_{2})$ d'après la question 4, et de même pour $A_{2}$. La réunion de ces deux parties est donc incluse dans $f(A_{1} \cup A_{2})$. 
    $$\boxed{f(A_{1} \cup A_{2}) = f(A_{1}) \cup f(A_{2})}$$

    **6.** On a $A_{1} \cap A_{2} \subset A_{1}$, donc $f(A_{1} \cap A_{2}) \subset f(A_{1})$ d'après la question 4 ; de même $f(A_{1} \cap A_{2}) \subset f(A_{2})$. Une partie incluse dans deux ensembles est incluse dans leur intersection. 
    $$\boxed{f(A_{1} \cap A_{2}) \subset f(A_{1}) \cap f(A_{2})}$$

    **7.** Soit $y \in f\big(f^{-1}(B_{1})\big)$. Il existe $x \in f^{-1}(B_{1})$ tel que $y=f(x)$. Or dire que $x \in f^{-1}(B_{1})$, c'est dire que $f(x) \in B_{1}$, c'est-à-dire $y \in B_{1}$. 
    $$\boxed{f\big(f^{-1}(B_{1})\big) \subset B_{1}}$$

    On observera l'asymétrie : l'image *réciproque* se comporte parfaitement bien vis-à-vis de l'intersection et de la réunion (questions 2 et 3), alors que l'image *directe* ne préserve que la réunion. C'est l'objet de l'exercice suivant.
- id: "ap-02-22"
  feuille: "f-ap-02"
  numero: 22
  partie: "Image directe et image réciproque"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [applications, injectivité, surjectivité, image directe, image réciproque]
  noeuds: [r-produit, rel, r-injections, r-images]
  notions: [application, injection, surjection, image-directe, image-reciproque]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Les propriétés 6 et 7 de l'exercice 21 sont des inclusions, et non des égalités. Cet exercice cherche à quelle condition ce sont des égalités. Soit $f : E \to F$ une application.

    **1.** Avec $\begin{array}{r|ccl} f : & \mathbb{R} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & x^{2} \end{array}$, déterminer $f(A_{1} \cap A_{2})$ et $f(A_{1}) \cap f(A_{2})$ pour $A_{1}=\{-1\}$ et $A_{2}=\{1\}$. Conclure.

    **2.** Démontrer que si $f$ est injective, alors $f(A_{1} \cap A_{2}) = f(A_{1}) \cap f(A_{2})$ pour toutes parties $A_{1}$ et $A_{2}$ de $E$.

    **3.** Soit $A$ une partie de $E$. Démontrer que $A \subset f^{-1}\big(f(A)\big)$, puis donner un contre-exemple à l'égalité.

    **4.** Démontrer que si $f$ est injective, alors $f^{-1}\big(f(A)\big) = A$ pour toute partie $A$ de $E$.

    **5.** Soit $B$ une partie de $F$. Démontrer que $f\big(f^{-1}(B)\big) = B$ si et seulement si $B \subset f(E)$. Que devient cette condition lorsque $f$ est surjective ?
  corrige: |
    **1.** On a $A_{1} \cap A_{2}=\varnothing$, donc $f(A_{1} \cap A_{2})=\varnothing$. En revanche $f(A_{1})=\{1\}$ et $f(A_{2})=\{1\}$, donc : 
    $$f(A_{1}) \cap f(A_{2}) = \{1\} \neq \varnothing$$

    $$\boxed{\text{L'inclusion 6 de l'exercice 21 peut être stricte.}}$$
     Le phénomène est clair : $-1$ et $1$ sont distincts mais ont la même image, ce que l'intersection des images ne peut pas distinguer.

    **2.** Supposons $f$ injective. L'inclusion directe est acquise. Réciproquement, soit $y \in f(A_{1}) \cap f(A_{2})$. Il existe $x_{1} \in A_{1}$ et $x_{2} \in A_{2}$ tels que $f(x_{1})=y=f(x_{2})$. Par injectivité, $x_{1}=x_{2}$ : ce point appartient donc à $A_{1} \cap A_{2}$, et $y \in f(A_{1} \cap A_{2})$. 
    $$\boxed{\text{Si } f \text{ est injective, } f(A_{1} \cap A_{2}) = f(A_{1}) \cap f(A_{2}).}$$

    **3.** Soit $x \in A$. Alors $f(x) \in f(A)$ par définition de l'image directe, donc $x \in f^{-1}\big(f(A)\big)$ par définition de l'image réciproque. 
    $$\boxed{A \subset f^{-1}\big(f(A)\big)}$$
     *Contre-exemple à l'égalité :* avec $f : x \mapsto x^{2}$ de $\mathbb{R}$ dans $\mathbb{R}$ et $A=\{1\}$, on a $f(A)=\{1\}$ et : 
    $$f^{-1}\big(f(A)\big)=f^{-1}\big(\{1\}\big)=\{-1 \;;\; 1\} \neq A$$

    **4.** Supposons $f$ injective, et soit $x \in f^{-1}\big(f(A)\big)$. Alors $f(x) \in f(A)$ : il existe $a \in A$ tel que $f(x)=f(a)$. Par injectivité, $x=a$, donc $x \in A$. Avec la question 3, on obtient la double inclusion. 
    $$\boxed{\text{Si } f \text{ est injective, } f^{-1}\big(f(A)\big) = A.}$$

    **5.** L'inclusion $f\big(f^{-1}(B)\big) \subset B$ est toujours vraie (question 7 de l'exercice 21).

    *Supposons $B \subset f(E)$*, et soit $y \in B$. Comme $y \in f(E)$, il existe $x \in E$ tel que $f(x)=y$. Alors $f(x)=y \in B$, donc $x \in f^{-1}(B)$, et $y=f(x) \in f\big(f^{-1}(B)\big)$. D'où l'égalité.

    *Réciproquement*, si $f\big(f^{-1}(B)\big)=B$, alors $B$ est une image directe par $f$, donc $B \subset f(E)$. 
    $$\boxed{f\big(f^{-1}(B)\big) = B \iff B \subset f(E)}$$

    $$\boxed{\text{Si } f \text{ est surjective, } f(E)=F \text{ et la condition est automatiquement vérifiée.}}$$
- id: "ap-02-23"
  feuille: "f-ap-02"
  numero: 23
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [applications, égalité de deux applications, composition, injectivité, surjectivité, bijectivité, bijection réciproque, image réciproque]
  noeuds: [r-produit, rel, r-composition, r-injections, r-inverses, r-images]
  notions: [application, injection, surjection, bijection, image-reciproque]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $f$ désigne une application de $E$ dans $F$.

    **1.** Une application est entièrement déterminée par sa formule de calcul.

    **2.** La composition des applications est associative.

    **3.** La composition des applications est commutative.

    **4.** Si $f$ est injective, tout élément de $F$ admet au plus un antécédent par $f$.

    **5.** Toute application devient surjective si l'on remplace son ensemble d'arrivée par $f(E)$.

    **6.** L'écriture $f^{-1}(B)$, où $B$ est une partie de $F$, suppose que $f$ soit bijective.

    **7.** Si $f$ est bijective, alors $f^{-1} \circ f = \mathrm{Id}_{E}$.

    **8.** Deux applications ayant la même formule mais des ensembles d'arrivée différents sont égales.

    **9.** L'image réciproque d'une partie de $F$ est une partie de $E$.

    **10.** Pour toute partie $A$ de $E$, on a $A \subset f^{-1}\big(f(A)\big)$.
  corrige: |
    **1.** $\boxed{\textbf{Fausse}}$ Une application est le triplet formé de l'ensemble de départ, de l'ensemble d'arrivée et du graphe. L'exercice 2 en donne trois illustrations.

    **2.** $\boxed{\textbf{Vraie}}$ C'est la propriété 1 du cours, qui autorise à écrire $h \circ g \circ f$ sans parenthèses.

    **3.** $\boxed{\textbf{Fausse}}$ L'exercice 4 fournit trois contre-exemples, dont $f : x \mapsto x+1$ et $g : x \mapsto x^{2}$.

    **4.** $\boxed{\textbf{Vraie}}$ C'est la définition même de l'injectivité : *au plus* un antécédent, éventuellement aucun.

    **5.** $\boxed{\textbf{Vraie}}$ Par construction, tout élément de $f(E)$ admet au moins un antécédent. C'est la remarque du cours, illustrée au point (b) de son exemple.

    **6.** $\boxed{\textbf{Fausse}}$ L'image réciproque d'une *partie* a toujours un sens, même si $f$ n'est pas bijective. C'est un abus de notation signalé par le cours, et travaillé à l'exercice 20.

    **7.** $\boxed{\textbf{Vraie}}$ C'est la propriété 2 du cours.

    **8.** $\boxed{\textbf{Fausse}}$ C'est la question 1 de l'exercice 2 : $x \mapsto x^{2}$ de $\mathbb{R}$ dans $\mathbb{R}$ et de $\mathbb{R}$ dans $\mathbb{R}_{+}$ sont deux applications distinctes, la seconde étant surjective et non la première.

    **9.** $\boxed{\textbf{Vraie}}$ Par définition, $f^{-1}(B)=\{x \in E \mid f(x) \in B\}$ est constituée d'éléments de $E$.

    **10.** $\boxed{\textbf{Vraie}}$ C'est la question 3 de l'exercice 22, l'égalité n'ayant lieu que si $f$ est injective.
- id: "ap-02-24"
  feuille: "f-ap-02"
  numero: 24
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [applications, composition, injectivité, bijectivité, image directe, image réciproque]
  noeuds: [r-produit, rel, r-composition, r-injections, r-images]
  notions: [application, injection, bijection, image-directe, image-reciproque]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    On considère l'application : 
    $$\begin{array}{r|ccl} f : & \mathbb{R} \setminus \{-1\} & \longrightarrow & \mathbb{R} \\ & x & \longmapsto & \dfrac{x-1}{x+1} \end{array}$$

    **1.** Démontrer que $f$ est injective.

    **2.** Déterminer $f\big(\mathbb{R} \setminus \{-1\}\big)$.

    **3.** En déduire que $f$ réalise une bijection de $\mathbb{R} \setminus \{-1\}$ sur un ensemble à préciser, puis déterminer $f^{-1}$.

    **4.** Calculer $f \circ f$. Le résultat est-il celui que l'on pouvait attendre ?

    **5.** En déduire l'expression de $f \circ f \circ f \circ f$, puis exprimer $f^{-1}$ à l'aide de compositions de $f$.

    **6.** Déterminer $f\big([0\,;1]\big)$ et $f^{-1}\big([0\,;1]\big)$.
  corrige: |
    **1.** Soient $x$ et $x'$ dans $\mathbb{R} \setminus \{-1\}$ tels que $f(x)=f(x')$ : 
    $$\begin{aligned} \frac{x-1}{x+1}=\frac{x'-1}{x'+1} &\iff (x-1)(x'+1)=(x'-1)(x+1)\\ &\iff xx'+x-x'-1 = xx'+x'-x-1\\ &\iff 2x=2x' \iff x=x' \end{aligned}$$

    $$\boxed{f \text{ est injective.}}$$

    **2.** Soit $y \in \mathbb{R}$. On cherche $x \neq -1$ tel que $f(x)=y$ : 
    $$\frac{x-1}{x+1}=y \iff x-1=y(x+1) \iff x(1-y)=1+y$$
     Si $y=1$, cette équation devient $0=2$, sans solution. Sinon, elle donne $x=\dfrac{1+y}{1-y}$, qui est bien différent de $-1$ : sinon $1+y=-1+y$, ce qui est absurde. 
    $$\boxed{f\big(\mathbb{R} \setminus \{-1\}\big)=\mathbb{R} \setminus \{1\}}$$

    **3.** L'application $f$ est injective et prend pour valeurs exactement les éléments de $\mathbb{R} \setminus \{1\}$ : 
    $$\boxed{f \text{ réalise une bijection de } \mathbb{R} \setminus \{-1\} \text{ sur } \mathbb{R} \setminus \{1\}, \text{ et } f^{-1}(y)=\dfrac{1+y}{1-y}.}$$

    **4.** La composée $f \circ f$ n'a de sens qu'aux points $x$ où $f(x)$ appartient encore à $\mathbb{R} \setminus \{-1\}$. Or : 
    $$f(x)=-1 \iff x-1=-(x+1) \iff 2x=0 \iff x=0$$
     La composée est donc définie sur $\mathbb{R} \setminus \{-1 \;;\; 0\}$, et pour un tel $x$ : 
    $$(f \circ f)(x) = \frac{f(x)-1}{f(x)+1} = \frac{\dfrac{x-1}{x+1}-1}{\dfrac{x-1}{x+1}+1} = \frac{\dfrac{(x-1)-(x+1)}{x+1}}{\dfrac{(x-1)+(x+1)}{x+1}} = \frac{-2}{2x} = -\frac{1}{x}$$

    $$\boxed{f \circ f : x \mapsto -\dfrac{1}{x} \quad\text{sur}\quad \mathbb{R} \setminus \{-1 \;;\; 0\}}$$
     *Piège :* on pouvait s'attendre à retrouver $\mathrm{Id}$, comme pour les involutions de l'exercice 6. Ce n'est pas le cas : $f$ n'est pas involutive.

    **5.** En composant $f \circ f$ avec elle-même, on obtient, là où c'est défini : 
    $$(f \circ f) \circ (f \circ f) : x \mapsto -\frac{1}{-\frac{1}{x}} = x$$

    $$\boxed{f \circ f \circ f \circ f = \mathrm{Id} \quad\text{sur}\quad \mathbb{R} \setminus \{-1 \;;\; 0 \;;\; 1\}}$$
     En composant cette égalité par $f^{-1}$ à gauche, il vient $f^{-1}=f \circ f \circ f$. On peut le vérifier directement, pour $y \notin \{-1 \;;\; 0\}$ : 
    $$(f \circ f \circ f)(y) = f\left(-\frac{1}{y}\right) = \frac{-\frac{1}{y}-1}{-\frac{1}{y}+1} = \frac{\dfrac{-1-y}{y}}{\dfrac{-1+y}{y}} = \frac{-1-y}{y-1} = \frac{1+y}{1-y}$$
     qui est bien l'expression de $f^{-1}$ trouvée à la question 3. 
    $$\boxed{f^{-1}=f \circ f \circ f}$$
     *Piège :* cette égalité de *formules* ne doit pas faire oublier les ensembles de définition. L'application $f^{-1}$ est définie sur $\mathbb{R} \setminus \{1\}$ tout entier, alors que $f \circ f \circ f$ ne l'est que sur $\mathbb{R} \setminus \{0 \;;\; 1\}$ : les deux applications coïncident partout où la seconde a un sens, mais ne sont pas égales au sens strict du cours.

    **6.** On écrit $f(x)=\dfrac{x-1}{x+1}=1-\dfrac{2}{x+1}$, expression strictement croissante sur $[0\,;1]$. Comme $f(0)=-1$ et $f(1)=0$ : 
    $$\boxed{f\big([0\,;1]\big)=[-1\,;0]}$$
     Pour l'image réciproque, on résout le double encadrement. D'une part : 
    $$\frac{x-1}{x+1} \geqslant 0 \iff x \in \;]-\infty\,;-1[ \;\cup\; [1\,;+\infty[$$
     D'autre part : 
    $$\frac{x-1}{x+1} \leqslant 1 \iff \frac{(x-1)-(x+1)}{x+1} \leqslant 0 \iff \frac{-2}{x+1} \leqslant 0 \iff x+1>0 \iff x>-1$$
     En intersectant les deux conditions : 
    $$\boxed{f^{-1}\big([0\,;1]\big)=[1\,;+\infty[}$$
- id: "ap-02-25"
  feuille: "f-ap-02"
