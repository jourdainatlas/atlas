  noeuds: [r-produit, rel, r-injections, r-images, zf-parties]
  notions: [application, injection, surjection, image-reciproque]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $E$ un ensemble. Pour toute partie $A$ de $E$, on appelle *fonction indicatrice* de $A$ l'application : 
    $$\begin{array}{r|ccl} \mathbf{1}_{A} : & E & \longrightarrow & \{0 \;;\; 1\} \\ & x & \longmapsto & \left\{\begin{array}{ll} 1 & \text{si } x \in A \\ 0 & \text{si } x \notin A \end{array}\right. \end{array}$$

    On considère alors l'application $\Phi$ qui à toute partie de $E$ associe sa fonction indicatrice : 
    $$\begin{array}{r|ccl} \Phi : & \mathcal{P}(E) & \longrightarrow & \{0 \;;\; 1\}^{E} \\ & A & \longmapsto & \mathbf{1}_{A} \end{array}$$

    **1.** Décrire les applications $\mathbf{1}_{\varnothing}$ et $\mathbf{1}_{E}$.

    **2.** Démontrer que, pour toutes parties $A$ et $B$ de $E$ et tout $x \in E$ : 
    $$\mathbf{1}_{A \cap B}(x) = \mathbf{1}_{A}(x) \times \mathbf{1}_{B}(x)$$

    **3.** Démontrer que $\Phi$ est injective.

    **4.** Soit $g$ un élément de $\{0 \;;\; 1\}^{E}$. Vérifier que $A=g^{-1}\big(\{1\}\big)$ convient, et en déduire que $\Phi$ est surjective.

    **5.** Conclure. À l'aide de l'exercice 3, retrouver le nombre d'éléments de $\mathcal{P}(E)$ lorsque $E$ possède $n$ éléments.
  corrige: |
    **1.** Aucun élément de $E$ n'appartient à $\varnothing$, et tous appartiennent à $E$ : 
    $$\boxed{\mathbf{1}_{\varnothing} \text{ est l'application constante égale à } 0, \text{ et } \mathbf{1}_{E} \text{ l'application constante égale à } 1.}$$

    **2.** Soit $x \in E$. On distingue deux cas.

    • Si $x \in A \cap B$, alors $x \in A$ et $x \in B$, donc $\mathbf{1}_{A}(x)=\mathbf{1}_{B}(x)=1$ et le produit vaut $1$. Or $\mathbf{1}_{A \cap B}(x)=1$.

    • Sinon, $x \notin A$ ou $x \notin B$ : l'un au moins des deux facteurs est nul, donc le produit vaut $0$. Or $\mathbf{1}_{A \cap B}(x)=0$.

    Les deux membres coïncident dans les deux cas : 
    $$\boxed{\mathbf{1}_{A \cap B} = \mathbf{1}_{A} \times \mathbf{1}_{B}}$$

    **3.** Soient $A$ et $B$ deux parties de $E$ telles que $\Phi(A)=\Phi(B)$, c'est-à-dire $\mathbf{1}_{A}=\mathbf{1}_{B}$.

    Soit $x \in A$. Alors $\mathbf{1}_{A}(x)=1$, donc $\mathbf{1}_{B}(x)=1$, donc $x \in B$. Ainsi $A \subset B$, et le raisonnement symétrique donne $B \subset A$. 
    $$\boxed{\Phi \text{ est injective.}}$$

    **4.** Soit $g$ un élément de $\{0 \;;\; 1\}^{E}$, c'est-à-dire une application de $E$ dans $\{0 \;;\; 1\}$. Posons : 
    $$A = g^{-1}\big(\{1\}\big) = \{x \in E \mid g(x)=1\}$$
     qui est bien une partie de $E$. Soit $x \in E$ :

    • si $g(x)=1$, alors $x \in A$, donc $\mathbf{1}_{A}(x)=1=g(x)$ ;

    • si $g(x)=0$, alors $x \notin A$, donc $\mathbf{1}_{A}(x)=0=g(x)$.

    Ces deux applications, de mêmes ensembles de départ et d'arrivée, coïncident en tout point : elles sont égales. 
    $$\boxed{\Phi(A)=g, \text{ donc } \Phi \text{ est surjective.}}$$

    **5.** On conclut : 
    $$\boxed{\Phi \text{ est une bijection de } \mathcal{P}(E) \text{ sur } \{0 \;;\; 1\}^{E}.}$$
     Supposons $E$ fini de cardinal $n$. La question 4 de l'exercice 3 donne : 
    $$\mathrm{card}\left(\{0 \;;\; 1\}^{E}\right) = 2^{n}$$
     et une bijection entre deux ensembles finis impose l'égalité de leurs cardinaux : 
    $$\boxed{\mathrm{card}\,\mathcal{P}(E) = 2^{n}}$$
     On retrouve ainsi, et cette fois par une démonstration, le résultat que le chapitre 1 s'était contenté d'annoncer après l'avoir vérifié sur de petits exemples.

