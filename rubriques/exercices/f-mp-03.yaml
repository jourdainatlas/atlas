  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [synthèse, diagonalisation, Cayley-Hamilton, groupes de matrices]
  noeuds: [rd-diagonalisable, rd-cayley-hamilton, a-groupe]
  notions: [diagonalisable, valeur-propre]
  source: "Réduction #2 (Prost), exercice 46"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Le lemme de Serre.* On note $\mathrm{GL}_{n}(\mathbb{Z})$ l'ensemble des matrices de $\mathcal{M}_{n}(\mathbb{Z})$ inversibles dont l'inverse est aussi à coefficients entiers.

    **1.** Montrer que $\mathrm{GL}_{n}(\mathbb{Z})$ est un sous-groupe de $\mathrm{GL}_{n}(\mathbb{R})$, et qu'une matrice $A \in \mathcal{M}_{n}(\mathbb{Z})$ appartient à $\mathrm{GL}_{n}(\mathbb{Z})$ si et seulement si $\det A = \pm 1$.

    **2.** Soit $A \in \mathrm{GL}_{n}(\mathbb{Z})$ d'ordre fini $m$ dans ce groupe. Montrer que $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{C})$, et que ses valeurs propres sont des racines $m$-ièmes de l'unité.

    **3.** Soit $p \geqslant 3$ un nombre premier. On suppose de plus que $A = I_{n} + pM$ avec $M \in \mathcal{M}_{n}(\mathbb{Z})$.

    **(a)** Montrer que les valeurs propres complexes de $M$ sont de module au plus $\frac{2}{p} < 1$.

    **(b)** Écrire $\chi_{M} = X^{k}Q$ avec $Q(0) \neq 0$, et montrer que $Q$ est à coefficients entiers. En considérant $|Q(0)|$, montrer que $Q = 1$.

    **(c)** En déduire que $\operatorname{Sp}(A) = \{1\}$, puis que $A = I_{n}$.

    **4.** Montrer que le résultat de la question 3 est faux pour $p = 2$.

    **5.** Soit $p \geqslant 3$ premier. On note $\rho$ l'application qui à $A \in \mathrm{GL}_{n}(\mathbb{Z})$ associe la matrice de $\mathcal{M}_{n}(\mathbb{Z}/p\mathbb{Z})$ obtenue en réduisant chaque coefficient modulo $p$. Montrer que $\rho$ est un morphisme de groupes de $\mathrm{GL}_{n}(\mathbb{Z})$ dans $\mathrm{GL}_{n}(\mathbb{Z}/p\mathbb{Z})$, puis que sa restriction à tout sous-groupe fini de $\mathrm{GL}_{n}(\mathbb{Z})$ est injective.

    **6.** En déduire que tout sous-groupe fini de $\mathrm{GL}_{n}(\mathbb{Z})$ a un cardinal qui divise celui de $\mathrm{GL}_{n}(\mathbb{Z}/3\mathbb{Z})$.
  corrige: |
    **1.** Le produit de deux matrices entières est entier, $I_{n}$ est entière, et l'inverse d'un élément de $\mathrm{GL}_{n}(\mathbb{Z})$ y appartient par définition : c'est un sous-groupe de $\mathrm{GL}_{n}(\mathbb{R})$. Si $A$ et $A^{-1}$ sont entières, $\det A \cdot \det A^{-1} = 1$ est un produit d'entiers, donc $\det A = \pm 1$. Réciproquement, si $\det A = \pm 1$, la formule $A^{-1} = \frac{1}{\det A}{\mathrm{Com}(A)}^{T}$ (chapitre 17 de MPSI) montre que $A^{-1}$ est entière. 
    $$\boxed{A \in \mathrm{GL}_{n}(\mathbb{Z}) \iff A \in \mathcal{M}_{n}(\mathbb{Z}) \text{ et } \det A = \pm 1}$$

    **2.** Si $A^{m} = I_{n}$, le polynôme $X^{m} - 1$, simplement scindé sur $\mathbb{C}$, annule $A$ : $A$ est diagonalisable sur $\mathbb{C}$ (théorème 3), et ses valeurs propres en sont racines. 
    $$\boxed{A \text{ diagonalisable sur } \mathbb{C}, \qquad \operatorname{Sp}(A) \subset \mathbb{U}_{m}}$$

    **3.a.** Si $\lambda$ est valeur propre de $A$, de vecteur propre $Y$, alors $MY = \frac{\lambda - 1}{p}Y$. Les valeurs propres de $M$ sont donc les $\mu = \frac{\lambda - 1}{p}$, avec $|\mu| \leqslant \frac{|\lambda| + 1}{p} = \frac{2}{p}$. 
    $$\boxed{|\mu| \leqslant \frac{2}{p} \leqslant \frac{2}{3} < 1}$$

    **3.b.** Le polynôme $\chi_{M}$ est unitaire à coefficients entiers, puisque $M$ est entière. La division par $X^{k}$ est exacte et conserve les coefficients entiers : $Q$ est unitaire à coefficients entiers, et ses racines sont les valeurs propres non nulles de $M$. Si $Q$ n'était pas constant, $|Q(0)|$, produit des modules de ses racines, serait un entier non nul strictement inférieur à $1$ : impossible. 
    $$\boxed{Q = 1, \qquad \chi_{M} = X^{n}}$$

    **3.c.** Toutes les valeurs propres de $M$ sont nulles, donc celles de $A = I_{n} + pM$ valent $1$. Comme $A$ est diagonalisable, elle est semblable à $I_{n}$, donc égale à $I_{n}$. 
    $$\boxed{\operatorname{Sp}(A) = \{1\}, \qquad A = I_{n}}$$

    **4.** Pour $p = 2$, la matrice $A = -I_{n} = I_{n} + 2(-I_{n})$ est d'ordre $2$ et différente de $I_{n}$. L'argument échoue en 3.a : la borne $\frac{2}{p}$ vaut $1$. 
    $$\boxed{\text{Le résultat est faux pour } p = 2.}$$

    **5.** La réduction modulo $p$ est un morphisme d'anneaux de $\mathbb{Z}$ dans $\mathbb{Z}/p\mathbb{Z}$ (chapitre 1, section 1.5) ; les coefficients d'un produit de matrices s'écrivent par sommes et produits, donc $\rho(AB) = \rho(A)\rho(B)$, et $\rho(I_{n}) = I_{n}$. Il s'ensuit que $\rho(A)\rho(A^{-1}) = I_{n}$ : $\rho(A)$ est inversible, et $\rho$ est un morphisme de groupes. Soit $G$ un sous-groupe fini et $A \in G$ tel que $\rho(A) = I_{n}$ : tous les coefficients de $A - I_{n}$ sont multiples de $p$, donc $A = I_{n} + pM$, et $A$, d'ordre fini, vaut $I_{n}$ par la question 3. Le noyau de la restriction de $\rho$ à $G$ est trivial. 
    $$\boxed{\rho_{|G} \text{ est injective.}}$$

    **6.** Avec $p = 3$, la question 5 montre que $G$ est isomorphe au sous-groupe $\rho(G)$ du groupe fini $\mathrm{GL}_{n}(\mathbb{Z}/3\mathbb{Z})$, et le théorème de Lagrange (chapitre 1, proposition 5) conclut. 
    $$\boxed{\operatorname{card} G \text{ divise } \operatorname{card} \mathrm{GL}_{n}(\mathbb{Z}/3\mathbb{Z})}$$
     Pour $n = 2$, le groupe $\mathrm{GL}_{2}(\mathbb{Z}/3\mathbb{Z})$ a $(9 - 1)(9 - 3) = 48$ éléments : un sous-groupe fini de $\mathrm{GL}_{2}(\mathbb{Z})$ a un cardinal divisant $48$. Le résultat montre en particulier que les cardinaux des sous-groupes finis de $\mathrm{GL}_{n}(\mathbb{Z})$ sont bornés, ce qui n'a rien d'évident a priori, puisque $\mathrm{GL}_{n}(\mathbb{Z})$ est infini dès que $n \geqslant 2$.

