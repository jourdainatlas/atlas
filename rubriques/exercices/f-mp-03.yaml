  source: "Réduction #2 (Prost), exercice 29"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $f \in \mathcal{L}(E)$ de polynôme minimal $(X - 1)^{2}$, et $g = f - \mathrm{id}_{E}$.

    **1.** Comparer $\mathrm{Ker}\, g$ et $\mathrm{Im}\, g$.

    **2.** En déduire l'existence d'une base de $E$ dans laquelle la matrice de $f$ est diagonale par blocs, avec des blocs de la forme $(1)$ ou $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$, au moins un bloc étant de la seconde forme.
  corrige: |
    **1.** On a $g^{2} = (f - \mathrm{id}_{E})^{2} = \pi_{f}(f) = 0$, et $g \neq 0$ puisque $\pi_{f} \neq X - 1$. 
    $$\boxed{\{0\} \neq \mathrm{Im}\, g \subset \mathrm{Ker}\, g}$$

    **2.** Notons $r = \mathrm{rg} g \geqslant 1$. L'exercice 4 de la feuille du chapitre 2 fournit une base 
    $$(e_{1}, \dots, e_{r}, f_{1}, \dots, f_{r}, h_{1}, \dots, h_{n-2r})$$
     telle que $g(f_{i}) = e_{i}$ et que $g$ annule les $e_{i}$ et les $h_{j}$. Réordonnons-la en $(e_{1}, f_{1}, \dots, e_{r}, f_{r}, h_{1}, \dots, h_{n-2r})$ : la matrice de $g$ devient diagonale par blocs, avec $r$ blocs $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et des blocs $(0)$, et celle de $f = \mathrm{id}_{E} + g$ s'en déduit. 
    $$\boxed{\mathrm{Mat}(f) = \operatorname{diag}\Big(\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, \dots, \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}, 1, \dots, 1\Big)}$$
     avec $r = \mathrm{rg}(f - \mathrm{id}_{E})$ blocs de taille $2$. Le nombre de blocs de taille $2$ est le rang de $f - \mathrm{id}_{E}$ : c'est un invariant de similitude, et deux tels endomorphismes sont semblables si et seulement si ces rangs coïncident (comparer avec l'exercice 45).
- id: "mp-03-43"
  feuille: "f-mp-03"
  numero: 43
  partie: "Sous-espaces caractéristiques"
  etoiles: 2
