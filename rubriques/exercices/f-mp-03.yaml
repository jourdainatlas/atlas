  enonce: |
    Soit $A \in \mathrm{GL}_{6}(\mathbb{R})$ telle que $A^{3} - 3A^{2} + 2A = 0$.

    **1.** Montrer que $A$ est diagonalisable et préciser ses valeurs propres possibles.

    **2.** On suppose de plus que $\operatorname{tr} A = 8$. Déterminer $\chi_{A}$.
  corrige: |
    **1.** Le polynôme $X^{3} - 3X^{2} + 2X = X(X - 1)(X - 2)$ annule $A$ et est simplement scindé : $A$ est diagonalisable (théorème 3), et $\operatorname{Sp}(A) \subset \{0, 1, 2\}$. Comme $A$ est inversible, $0$ n'est pas valeur propre. 
    $$\boxed{A \text{ diagonalisable}, \qquad \operatorname{Sp}(A) \subset \{1, 2\}}$$

    **2.** Notons $p$ la multiplicité de $1$ ; celle de $2$ est $6 - p$. La trace est la somme des valeurs propres : $p + 2(6 - p) = 12 - p = 8$, d'où $p = 4$. 
    $$\boxed{\chi_{A} = (X - 1)^{4}(X - 2)^{2}}$$
- id: "mp-03-19"
  feuille: "f-mp-03"
  numero: 19
  partie: "Polynômes annulateurs et réduction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [annulateurs et réduction, polynômes annulateurs, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction #2 (Prost), exercice 40"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{2} = A$, et $\varphi$ l'endomorphisme de $\mathcal{M}_{n}(\mathbb{R})$ défini par $\varphi(M) = AM + MA$. Calculer $\varphi^{2}(M)$ et $\varphi^{3}(M)$, trouver un polynôme annulateur de $\varphi$ de degré $3$, et en déduire que $\varphi$ est diagonalisable.
  corrige: |
    En développant, et en utilisant $A^{2} = A$ : 
    $$\varphi^{2}(M) = A(AM + MA) + (AM + MA)A = AM + 2AMA + MA,$$

    $$\varphi^{3}(M) = A(AM + 2AMA + MA) + (AM + 2AMA + MA)A = AM + 6AMA + MA.$$
     On en tire $\varphi^{3} - 3\varphi^{2} + 2\varphi = 0$, les termes en $AM$, $MA$ et $AMA$ s'éliminant : $1 - 3 + 2 = 0$ et $6 - 6 = 0$. 
    $$\boxed{X^{3} - 3X^{2} + 2X = X(X - 1)(X - 2) \text{ annule } \varphi, \text{ qui est diagonalisable.}}$$
     On peut décrire les sous-espaces propres : dans une base où $A = \operatorname{diag}(I_{r}, 0)$, la matrice $M$ découpée en blocs $\begin{pmatrix} M_{1} & M_{2} \\ M_{3} & M_{4} \end{pmatrix}$ a pour image $\begin{pmatrix} 2M_{1} & M_{2} \\ M_{3} & 0 \end{pmatrix}$ : les valeurs propres $2$, $1$, $0$ correspondent aux blocs $M_{1}$, $(M_{2}, M_{3})$ et $M_{4}$.
