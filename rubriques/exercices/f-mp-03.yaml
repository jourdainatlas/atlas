  source: "exercice composé pour la feuille (Vrai ou faux)"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Les endomorphismes agissent sur un espace $E$ de dimension finie $n \geqslant 2$.

    **1.** Deux matrices qui ont le même polynôme minimal sont semblables.

    **2.** Si $P$ annule $u$, toute racine de $P$ est valeur propre de $u$.

    **3.** Si $u$ est diagonalisable, tout polynôme en $u$ est diagonalisable.

    **4.** Les polynômes $\pi_{u}$ et $\chi_{u}$ ont les mêmes racines complexes.

    **5.** Si $u^{2}$ est diagonalisable, alors $u$ est diagonalisable.

    **6.** Une matrice $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{2} + I_{n} = 0$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{C})$.

    **7.** Le polynôme minimal de $u$ est de degré au plus $n$.

    **8.** Si $u$ est diagonalisable, tout sous-espace stable par $u$ possède une base formée de vecteurs propres de $u$.

    **9.** Deux endomorphismes diagonalisables ont toujours une base commune de vecteurs propres.

    **10.** Si $u$ est inversible, $u^{-1}$ est un polynôme en $u$.
  corrige: |
    **1. Faux.** Les matrices $\operatorname{diag}(1, 1, 2)$ et $\operatorname{diag}(1, 2, 2)$ ont le même polynôme minimal $(X - 1)(X - 2)$, mais pas le même polynôme caractéristique.

    **2. Faux.** Le polynôme $X(X - 1)$ annule $I_{n}$, dont $0$ n'est pas valeur propre. Seule l'implication inverse est vraie : toute valeur propre est racine (proposition 2).

    **3. Vrai.** Dans une base de vecteurs propres de $u$, la matrice de $P(u)$ est diagonale (proposition 2).

    **4. Vrai.** C'est la proposition 8 (ii).

    **5. Faux.** $E_{12}$ a un carré nul, diagonalisable, sans l'être elle-même (exercice 27).

    **6. Vrai.** Le polynôme $X^{2} + 1 = (X - \mathrm{i})(X + \mathrm{i})$ est simplement scindé sur $\mathbb{C}$ (théorème 3).

    **7. Vrai.** Le polynôme minimal divise $\chi_{u}$, de degré $n$ (proposition 8).

    **8. Vrai.** L'induit sur un sous-espace stable est diagonalisable (proposition 6, exercice 24).

    **9. Faux.** Les matrices $U$ et $V$ de l'exercice 29 sont diagonalisables, mais $V = \operatorname{diag}(-1, 0)$ n'admet que les droites $\mathbb{K} e_{1}$ et $\mathbb{K} e_{2}$ comme droites propres, et $e_{2}$ n'est pas vecteur propre de $U$. Il faut que les endomorphismes commutent (théorème 4).

    **10. Vrai.** C'est la proposition 4 (ii). 
    $$\boxed{\text{Vrai : } 3, 4, 6, 7, 8, 10. \qquad \text{Faux : } 1, 2, 5, 9.}$$
- id: "mp-03-48"
