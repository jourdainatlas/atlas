  source: "Réduction #2 (Prost), exercice 18"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $u \in \mathcal{L}(E)$ de rang $r$. En considérant l'endomorphisme induit par $u$ sur $\mathrm{Im}\, u$, montrer que $\deg \pi_{u} \leqslant r + 1$. Donner un exemple où l'égalité a lieu.
  corrige: |
    Le sous-espace $F = \mathrm{Im}\, u$, de dimension $r$, est stable par $u$. Notons $v$ l'endomorphisme induit ; son polynôme minimal $\pi_{v}$ est de degré au plus $r$ (proposition 8, appliquée à $v$). Pour tout $x \in E$, on a $u(x) \in F$, donc 
    $$\big(\pi_{v}(u) \circ u\big)(x) = \pi_{v}(v)\big(u(x)\big) = 0.$$
     Le polynôme $X\pi_{v}$ annule $u$, et $\pi_{u}$ le divise. 
    $$\boxed{\deg \pi_{u} \leqslant \deg(X\pi_{v}) \leqslant r + 1}$$
     L'égalité a lieu pour un endomorphisme nilpotent d'indice $r + 1$, comme celui de matrice $\sum_{i = 1}^{r} E_{i, i+1}$, de rang $r$ et de polynôme minimal $X^{r+1}$ (exercice 49 de la feuille du chapitre 2). Si $r = 0$, on obtient $u = 0$ et $\pi_{u} = X$.
- id: "mp-03-07"
  feuille: "f-mp-03"
  numero: 7
  partie: "Polynômes d'un endomorphisme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["polynômes d'un endomorphisme", polynôme minimal, polynômes annulateurs, Cayley-Hamilton, sous-espaces stables]
  noeuds: [rd-polynomes-endo, rd-cayley-hamilton, rd-stables]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme, sous-espace-stable]
  source: "Réduction #2 (Prost), exercices 20 et 22 ; BibM@th, Polynômes d'endomorphismes, exercices 2 et 22"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $A_{1} \in \mathcal{M}_{p}(\mathbb{K})$, $A_{2} \in \mathcal{M}_{q}(\mathbb{K})$ et $A = \operatorname{diag}(A_{1}, A_{2}) \in \mathcal{M}_{p + q}(\mathbb{K})$. Exprimer $\chi_{A}$ à l'aide de $\chi_{A_{1}}$ et $\chi_{A_{2}}$, et montrer que $\pi_{A}$ est le PPCM de $\pi_{A_{1}}$ et $\pi_{A_{2}}$.

    **2.** En déduire que si $E = F \oplus G$ avec $F$ et $G$ stables par $u$, alors $\pi_{u}$ est le PPCM des polynômes minimaux des endomorphismes induits.

    **3.** Soit maintenant $M = \begin{pmatrix} A_{1} & C \\ 0 & A_{2} \end{pmatrix}$, avec $C \in \mathcal{M}_{p,q}(\mathbb{K})$. Montrer que $\pi_{A_{1}}\pi_{A_{2}}$ annule $M$, et que $\pi_{A_{1}}$ et $\pi_{A_{2}}$ divisent $\pi_{M}$.

    **4.** Montrer par un exemple que $\pi_{M}$ peut être différent du PPCM de $\pi_{A_{1}}$ et $\pi_{A_{2}}$.
  corrige: |
    **1.** Le déterminant d'une matrice diagonale par blocs est le produit des déterminants des blocs (chapitre 2, proposition 4), appliqué à $XI - A$ : 
    $$\boxed{\chi_{A} = \chi_{A_{1}}\,\chi_{A_{2}}}$$
     Pour tout polynôme $P$, le calcul par blocs donne $P(A) = \operatorname{diag}\big(P(A_{1}), P(A_{2})\big)$. Donc $P$ annule $A$ si et seulement s'il annule $A_{1}$ et $A_{2}$, c'est-à-dire s'il est multiple de $\pi_{A_{1}}$ et de $\pi_{A_{2}}$, ou encore de leur PPCM (chapitre 13 de MPSI). L'ensemble des annulateurs de $A$ est donc l'ensemble des multiples du PPCM. 
    $$\boxed{\pi_{A} = \pi_{A_{1}} \vee \pi_{A_{2}}}$$

    **2.** Dans une base adaptée à $E = F \oplus G$, la matrice de $u$ est $\operatorname{diag}(A_{1}, A_{2})$, où $A_{1}$ et $A_{2}$ représentent les endomorphismes induits. 
    $$\boxed{\pi_{u} = \pi_{u_{F}} \vee \pi_{u_{G}}}$$

    **3.** Par récurrence, $M^{k} = \begin{pmatrix} A_{1}^{k} & C_{k} \\ 0 & A_{2}^{k} \end{pmatrix}$, d'où $P(M) = \begin{pmatrix} P(A_{1}) & * \\ 0 & P(A_{2}) \end{pmatrix}$. Si $P(M) = 0$, alors $P(A_{1}) = P(A_{2}) = 0$ : $\pi_{A_{1}}$ et $\pi_{A_{2}}$ divisent $\pi_{M}$. Pour le produit, $\pi_{A_{1}}(M)$ et $\pi_{A_{2}}(M)$ ont les formes 
    $$\pi_{A_{1}}(M) = \begin{pmatrix} 0 & * \\ 0 & * \end{pmatrix}, \qquad \pi_{A_{2}}(M) = \begin{pmatrix} * & * \\ 0 & 0 \end{pmatrix},$$
     et leur produit $\pi_{A_{1}}(M)\,\pi_{A_{2}}(M)$, calculé par blocs, est nul : la première colonne de blocs du premier facteur est nulle et la seconde ligne de blocs du second aussi. 
    $$\boxed{(\pi_{A_{1}}\pi_{A_{2}})(M) = 0, \qquad \pi_{A_{1}} \vee \pi_{A_{2}} \mid \pi_{M} \mid \pi_{A_{1}}\pi_{A_{2}}}$$

    **4.** Avec $p = q = 1$, $A_{1} = A_{2} = (0)$ et $C = (1)$, on obtient $M = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, de polynôme minimal $X^{2}$, alors que le PPCM de $\pi_{A_{1}} = \pi_{A_{2}} = X$ vaut $X$. 
    $$\boxed{\pi_{M} = X^{2} \neq X = \pi_{A_{1}} \vee \pi_{A_{2}}}$$
     Le bloc $C$ peut « allonger » le polynôme minimal, exactement comme il empêche la diagonalisabilité.
