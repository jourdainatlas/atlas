  notions: [polynome-annulateur, diagonalisable, endomorphisme-trigonalisable, endomorphisme-nilpotent]
  source: "Réduction #2 (Prost), exercice 43"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Trigonalisation simultanée.* Soit $E$ un $\mathbb{C}$-espace vectoriel de dimension $n$ et $(u_{i})_{i \in I}$ une famille d'endomorphismes de $E$ qui commutent deux à deux.

    **1.** Montrer, par récurrence sur $n$, que les $u_{i}$ ont un vecteur propre commun. On pourra distinguer le cas où tous les $u_{i}$ sont des homothéties.

    **2.** En déduire qu'il existe une base de $E$ dans laquelle les matrices de tous les $u_{i}$ sont triangulaires supérieures.

    **3.** Application : soit $N_{1}, \dots, N_{n} \in \mathcal{M}_{n}(\mathbb{C})$ nilpotentes et commutant deux à deux. Montrer que $N_{1}N_{2} \cdots N_{n} = 0$. Le résultat subsiste-t-il sans l'hypothèse de commutation ?
  corrige: |
    **1.** Récurrence sur $n$. Pour $n = 1$, tout vecteur non nul convient. Soit $n \geqslant 2$. Si tous les $u_{i}$ sont des homothéties, tout vecteur non nul est propre pour tous. Sinon, choisissons $u_{i_{0}}$ qui n'est pas une homothétie, et une valeur propre $\lambda$ de $u_{i_{0}}$ (elle existe sur $\mathbb{C}$). Le sous-espace $F = E_{\lambda}(u_{i_{0}})$ est non nul, distinct de $E$, et stable par tous les $u_{i}$, qui commutent avec $u_{i_{0}}$ (chapitre 2, proposition 7). Les endomorphismes induits sur $F$ commutent deux à deux, et $\dim F < n$ : par hypothèse de récurrence, ils ont un vecteur propre commun, qui convient. 
    $$\boxed{\text{Les } u_{i} \text{ ont un vecteur propre commun.}}$$

    **2.** Récurrence sur $n$, comme dans le théorème 6 du chapitre 2. On complète un vecteur propre commun $e_{1}$ en une base ; les matrices des $u_{i}$ s'écrivent $\begin{pmatrix} \lambda_{i} & L_{i} \\ 0 & B_{i} \end{pmatrix}$. Le calcul par blocs de $u_{i}u_{j} = u_{j}u_{i}$ donne $B_{i}B_{j} = B_{j}B_{i}$ : les $B_{i}$ commutent, et l'hypothèse de récurrence fournit $R$ inversible telle que tous les $R^{-1}B_{i}R$ soient triangulaires supérieurs. La matrice de passage $\operatorname{diag}(1, R)$ trigonalise alors tous les $u_{i}$. 
    $$\boxed{\text{Il existe une base commune de trigonalisation.}}$$

    **3.** Dans une base commune de trigonalisation, chaque $N_{i}$ a une matrice triangulaire supérieure de diagonale nulle, puisque sa seule valeur propre est $0$. Avec les notations de la proposition 7, $N_{i}(F_{k}) \subset F_{k-1}$ pour tout $k$, et le produit de $n$ telles matrices envoie $F_{n} = \mathbb{C}^{n}$ dans $F_{0} = \{0\}$. 
    $$\boxed{N_{1}N_{2}\cdots N_{n} = 0}$$
     Sans commutation, c'est faux : pour $n = 2$, $E_{12}$ et $E_{21}$ sont nilpotentes et $E_{12}E_{21} = E_{11} \neq 0$.
- id: "mp-03-31"
  feuille: "f-mp-03"
  numero: 31
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [annulateurs et réduction, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable, valeur-propre]
  source: "Réduction #2 (Prost), exercice 31 ; Réduction (LLG), exercices 44 et 100 ; BibM@th, Polynômes d'endomorphismes, exercice 29"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $P \in \mathbb{C}[X]$ non constant.

    **1.** Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ diagonalisable. Montrer qu'il existe $M \in \mathcal{M}_{n}(\mathbb{C})$ telle que $P(M) = A$.

    **2.** On suppose de plus que les valeurs propres de $A$ sont simples. Déterminer toutes les matrices $M$ telles que $P(M) = A$.

    **3.** Soit $n \geqslant 2$ et $J \in \mathcal{M}_{n}(\mathbb{C})$ la matrice dont les coefficients valent $1$ sur la sur-diagonale et $0$ ailleurs. Montrer qu'il n'existe pas de matrice $M$ telle que $M^{2} = J$. Que montre cet exemple ?
  corrige: |
    **1.** Écrivons $A = QDQ^{-1}$ avec $D = \operatorname{diag}(\lambda_{1}, \dots, \lambda_{n})$. Pour chaque indice $i$, le théorème de d'Alembert-Gauss fournit une racine complexe $\mu_{i}$ du polynôme non constant $P - \lambda_{i}$. On pose alors 
    $$M = Q\,\operatorname{diag}(\mu_{1}, \dots, \mu_{n})\,Q^{-1}, \qquad\text{d'où}\qquad P(M) = Q\,\operatorname{diag}\big(P(\mu_{1}), \dots, P(\mu_{n})\big)\,Q^{-1} = A.$$

    $$\boxed{\text{Il existe } M \text{ telle que } P(M) = A.}$$

    **2.** Si $P(M) = A$, alors $M$ commute avec $A$, polynôme en $M$. Comme $A$ a $n$ valeurs propres simples, ses sous-espaces propres sont des droites, stables par $M$ : les colonnes de $Q$ sont des vecteurs propres de $M$, et $Q^{-1}MQ$ est diagonale (exercice 37 du chapitre 2). L'équation devient $P(\mu_{i}) = \lambda_{i}$ pour chaque $i$. 
    $$\boxed{P(M) = A \iff M = Q\,\operatorname{diag}(\mu_{1}, \dots, \mu_{n})\,Q^{-1} \text{ avec } P(\mu_{i}) = \lambda_{i}}$$
     Le nombre de solutions est le produit des nombres de racines distinctes des polynômes $P - \lambda_{i}$ ; il est fini.

    **3.** Si $M^{2} = J$, alors $M^{2n} = J^{n} = 0$ : $M$ est nilpotente, donc $M^{n} = 0$ (chapitre 2, théorème 7). Comme $n \geqslant 2$, on a $2n - 2 \geqslant n$, d'où $J^{n-1} = M^{2n-2} = 0$. Or $J^{n-1} = E_{1n} \neq 0$ : contradiction. 
    $$\boxed{J \text{ n'a pas de racine carrée.}}$$
     L'hypothèse de diagonalisabilité de la première question ne peut donc pas être supprimée.
- id: "mp-03-32"
  feuille: "f-mp-03"
  numero: 32
  partie: "Polynômes annulateurs et réduction"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [annulateurs et réduction, polynôme minimal, diagonalisation, nilpotents]
  noeuds: [rd-diagonalisable, rd-polynomes-endo, rd-nilpotents]
  notions: [polynome-annulateur, diagonalisable, polynome-minimal-endomorphisme, endomorphisme-nilpotent]
  source: "Réduction #2 (Prost), exercice 38 ; Réduction (LLG), exercice 106"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ et $P \in \mathbb{C}[X]$.

    **1.** Pour chacune des matrices 
    $$B_{1} = \begin{pmatrix} A & 0 \\ 0 & A \end{pmatrix}, \qquad B_{2} = \begin{pmatrix} A & A \\ 0 & A \end{pmatrix}, \qquad B_{3} = \begin{pmatrix} A & A \\ A & A \end{pmatrix},$$
     calculer $B_{i}^{k}$ pour $k \in \mathbb{N}$, puis exprimer $P(B_{i})$ à l'aide de $P(A)$, de $P'(A)$ ou de $P(2A)$ et $P(0)$.

    **2.** Donner une condition nécessaire et suffisante portant sur $A$ pour que $B_{i}$ soit diagonalisable, pour $i = 1, 2, 3$. Pour $B_{2}$, on comparera le résultat avec l'exercice 41 de la feuille du chapitre 2.

    **3.** On suppose $B_{1}$ et $B_{2}$ semblables. Montrer que $A\,\pi_{A}'(A) = 0$, puis que $A$ est nilpotente.
  corrige: |
    **1.** Par récurrence sur $k$, on obtient, pour $k \geqslant 1$, 
    $$B_{1}^{k} = \begin{pmatrix} A^{k} & 0 \\ 0 & A^{k} \end{pmatrix}, \qquad B_{2}^{k} = \begin{pmatrix} A^{k} & kA^{k} \\ 0 & A^{k} \end{pmatrix}, \qquad B_{3}^{k} = 2^{k-1}\begin{pmatrix} A^{k} & A^{k} \\ A^{k} & A^{k} \end{pmatrix}.$$
     Par linéarité, en remarquant que $\sum_{k} k a_{k}A^{k} = AP'(A)$ et que $\sum_{k \geqslant 1} a_{k}2^{k-1}A^{k} = \frac{1}{2}\big(P(2A) - P(0)I_{n}\big)$ : 
    $$\boxed{P(B_{1}) = \begin{pmatrix} P(A) & 0 \\ 0 & P(A) \end{pmatrix}, \quad P(B_{2}) = \begin{pmatrix} P(A) & AP'(A) \\ 0 & P(A) \end{pmatrix}, \quad P(B_{3}) = \begin{pmatrix} P(0)I_{n} + R & R \\ R & P(0)I_{n} + R \end{pmatrix}}$$
     avec $R = \frac{1}{2}\big(P(2A) - P(0)I_{n}\big)$.

    **2.** *Pour $B_{1}$* : $P(B_{1}) = 0$ si et seulement si $P(A) = 0$, donc $\pi_{B_{1}} = \pi_{A}$, et $B_{1}$ est diagonalisable si et seulement si $A$ l'est.

    *Pour $B_{2}$* : supposons $B_{2}$ diagonalisable, et $P = \pi_{B_{2}}$, simplement scindé. Alors $P(A) = 0$, donc $\pi_{A} \mid P$ est simplement scindé, et $AP'(A) = 0$, donc $\pi_{A} \mid XP'$. Une racine $\lambda \neq 0$ de $\pi_{A}$ serait racine de $P$ et de $P'$, donc racine multiple de $P$ : impossible. Ainsi $\pi_{A} = X$ et $A = 0$. Réciproquement, $A = 0$ donne $B_{2} = 0$.

    *Pour $B_{3}$* : $P(B_{3}) = 0$ si et seulement si $R = 0$ et $P(0) = 0$, c'est-à-dire $P(0) = 0$ et $P(2A) = 0$. Si $A$ est diagonalisable, $2A$ l'est, et le PPCM de $X$ et de $\pi_{2A}$, simplement scindé, annule $B_{3}$. Réciproquement, si $B_{3}$ est diagonalisable, $\pi_{B_{3}}$ annule $2A$ et est simplement scindé : $2A$, donc $A$, est diagonalisable. 
    $$\boxed{B_{1} \text{ et } B_{3} \text{ diagonalisables} \iff A \text{ diagonalisable} ; \qquad B_{2} \text{ diagonalisable} \iff A = 0}$$
     Pour $B_{2}$, on retrouve le résultat de l'exercice 41 du chapitre 2, obtenu là par une étude fine des sous-espaces propres ; la formule de Taylor « $P(B_{2})$ fait apparaître $P'(A)$ » rend la démonstration presque immédiate.

    **3.** Si $B_{2} = SB_{1}S^{-1}$, alors $\pi_{A}(B_{2}) = S\,\pi_{A}(B_{1})\,S^{-1} = 0$, et la question 1 donne $A\pi_{A}'(A) = 0$. Donc $\pi_{A}$ divise $X\pi_{A}'$, qui a le même degré $d$ et pour coefficient dominant $d$ : $X\pi_{A}' = d\,\pi_{A}$. En écrivant $\pi_{A} = \sum_{k} c_{k}X^{k}$, cette égalité donne $kc_{k} = dc_{k}$, donc $c_{k} = 0$ pour $k \neq d$. 
    $$\boxed{\pi_{A} = X^{d} : \quad A \text{ est nilpotente.}}$$
- id: "mp-03-33"
  feuille: "f-mp-03"
  numero: 33
  partie: "Théorème de Cayley-Hamilton"
  etoiles: 1
  types: [Calcul]
  mots_cles: [Cayley-Hamilton, polynôme minimal, diagonalisation]
  noeuds: [rd-cayley-hamilton, rd-polynomes-endo, rd-diagonalisable]
  notions: [polynome-minimal-endomorphisme, diagonalisable]
  source: "Réduction #2 (Prost), exercice 15"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Calculer le polynôme minimal des matrices suivantes, et dire si elles sont diagonalisables : 
    $$A = \begin{pmatrix} 2 & 2 & 0 \\ 1 & 2 & 1 \\ 0 & 2 & 2 \end{pmatrix}, \quad B = \begin{pmatrix} 3 & -1 & 1 \\ -1 & 3 & 1 \\ 2 & 2 & 2 \end{pmatrix}, \quad C = \begin{pmatrix} 1 & 2 & 2 \\ -1 & 1 & -1 \\ 1 & 0 & 2 \end{pmatrix}, \quad D = \begin{pmatrix} 1 & -2 & -2 \\ 0 & 2 & 1 \\ 1 & 1 & 0 \end{pmatrix}.$$
  corrige: |
    Dans chaque cas, on calcule $\chi$, puis on teste les diviseurs unitaires de $\chi$ ayant toutes ses racines (proposition 8), du plus petit au plus grand.

    **La matrice $A$.** Le calcul donne $\chi_{A} = X(X - 2)(X - 4)$ : trois racines simples, et nécessairement $\pi_{A} = \chi_{A}$. 
    $$\boxed{\pi_{A} = X(X - 2)(X - 4), \qquad A \text{ diagonalisable}}$$

    **La matrice $B$.** On trouve $\chi_{B} = X(X - 4)^{2}$. Le seul diviseur candidat plus petit est $X(X - 4)$, et la matrice $B - 4I_{3} = \begin{pmatrix} -1 & -1 & 1 \\ -1 & -1 & 1 \\ 2 & 2 & -2 \end{pmatrix}$ est de rang $1$, d'image $\mathbb{R}{(1, 1, -2)}^{T}$, droite contenue dans $\mathrm{Ker}\, B = \mathbb{R}{(1, 1, -2)}^{T}$ : donc $B(B - 4I_{3}) = 0$. 
    $$\boxed{\pi_{B} = X(X - 4), \qquad B \text{ diagonalisable}}$$

    **La matrice $C$.** On trouve $\chi_{C} = (X - 1)^{2}(X - 2)$, et 
    $$(C - I_{3})(C - 2I_{3}) = \begin{pmatrix} 0 & -2 & -2 \\ 0 & -2 & -2 \\ 0 & 2 & 2 \end{pmatrix} \neq 0.$$

    $$\boxed{\pi_{C} = (X - 1)^{2}(X - 2), \qquad C \text{ non diagonalisable}}$$

    **La matrice $D$.** On trouve $\chi_{D} = (X - 1)^{3}$, et 
    $$(D - I_{3})^{2} = \begin{pmatrix} -2 & -4 & 0 \\ 1 & 2 & 0 \\ -1 & -2 & 0 \end{pmatrix} \neq 0.$$

    $$\boxed{\pi_{D} = (X - 1)^{3}, \qquad D \text{ non diagonalisable}}$$
     On retrouve les réponses de la source. La méthode est économique : on ne calcule jamais plus de produits que de diviseurs candidats, et le théorème de Cayley-Hamilton garantit que $\chi$ lui-même convient.
- id: "mp-03-34"
  feuille: "f-mp-03"
  numero: 34
  partie: "Théorème de Cayley-Hamilton"
  etoiles: 1
