  page_corrige: 17
  enonce: |
    On reprend la matrice $C$ de l'exercice 33, dont le polynôme caractéristique est $(X - 1)^{2}(X - 2)$.

    **1.** Déterminer les sous-espaces caractéristiques $N_{1}(C)$ et $N_{2}(C)$, et vérifier leurs dimensions.

    **2.** Trouver une matrice inversible $P$ telle que $P^{-1}CP = \begin{pmatrix} 1 & 1 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 2 \end{pmatrix}$.

    **3.** En déduire $C^{k}$ pour tout $k \in \mathbb{N}$.
  corrige: |
    **1.** La matrice $C - I_{3} = \begin{pmatrix} 0 & 2 & 2 \\ -1 & 0 & -1 \\ 1 & 0 & 1 \end{pmatrix}$ est de rang $2$, et le calcul de $(C - I_{3})^{2}$, de rang $1$, donne 
    $$N_{1}(C) = \mathrm{Ker}\,(C - I_{3})^{2} = \mathrm{Vect}\big((-2, 1, 0), (-3, 0, 1)\big), \qquad N_{2}(C) = \mathrm{Ker}\,(C - 2I_{3}) = \mathbb{R}(0, -1, 1).$$

    $$\boxed{\dim N_{1}(C) = 2 = m_{1}, \qquad \dim N_{2}(C) = 1 = m_{2}}$$
     Le sous-espace propre $E_{1}(C) = \mathbb{R}(1, 1, -1)$ est strictement contenu dans $N_{1}(C)$ : $C$ n'est pas diagonalisable, comme à l'exercice 33.

    **2.** On prend $v_{2} = {(2, -1, 0)}^{T} \in N_{1}(C)$ ; alors $v_{1} = (C - I_{3})v_{2} = {(-2, -2, 2)}^{T}$ est un vecteur propre pour $1$, et $Cv_{2} = v_{2} + v_{1}$. Avec $v_{3} = {(0, -1, 1)}^{T}$ : 
    $$\boxed{P = \begin{pmatrix} -2 & 2 & 0 \\ -2 & -1 & -1 \\ 2 & 0 & 1 \end{pmatrix}, \qquad P^{-1} = \begin{pmatrix} -\frac{1}{2} & -1 & -1 \\ 0 & -1 & -1 \\ 1 & 2 & 3 \end{pmatrix}}$$
     avec $\det P = 2$, et l'on vérifie $CP = PT$, où $T$ est la matrice de l'énoncé.

    **3.** On a $T^{k} = \begin{pmatrix} 1 & k & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 2^{k} \end{pmatrix}$ (bloc $I_{2} + E_{12}$, avec $E_{12}^{2} = 0$, et formule du binôme), et $C^{k} = PT^{k}P^{-1}$ : 
    $$\boxed{C^{k} = \begin{pmatrix} 1 & 2k & 2k \\ 1 - 2^{k} & 3 + 2k - 2^{k+1} & 3 + 2k - 3 \cdot 2^{k} \\ 2^{k} - 1 & 2^{k+1} - 2k - 2 & 3 \cdot 2^{k} - 2k - 2 \end{pmatrix}}$$
     Pour $k = 1$, on retrouve $C$ ✓. Les termes en $k$ proviennent du bloc non diagonal, et les termes en $2^{k}$ du sous-espace caractéristique $N_{2}(C)$.
- id: "mp-03-42"
  feuille: "f-mp-03"
