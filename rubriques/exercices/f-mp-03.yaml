  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $u \in \mathcal{L}(E)$ et $P = QR$ un polynôme annulateur de $u$, avec $Q$ et $R$ premiers entre eux. Montrer que $\mathrm{Im}\, R(u) = \mathrm{Ker}\, Q(u)$.
  corrige: |
    Si $y = R(u)(x)$, alors $Q(u)(y) = (QR)(u)(x) = 0$ : $\mathrm{Im}\, R(u) \subset \mathrm{Ker}\, Q(u)$. Réciproquement, une relation de Bézout $UQ + VR = 1$ donne, pour $y \in \mathrm{Ker}\, Q(u)$, 
    $$y = U(u)\big(Q(u)(y)\big) + V(u)\big(R(u)(y)\big) = R(u)\big(V(u)(y)\big),$$
     puisque $V(u)$ et $R(u)$ commutent. Donc $y \in \mathrm{Im}\, R(u)$. 
    $$\boxed{\mathrm{Im}\, R(u) = \mathrm{Ker}\, Q(u)}$$
     Avec le lemme des noyaux, $E = \mathrm{Ker}\, Q(u) \oplus \mathrm{Ker}\, R(u)$, et l'on obtient $E = \mathrm{Im}\, R(u) \oplus \mathrm{Ker}\, R(u)$ : le noyau et l'image de $R(u)$ sont supplémentaires. C'est ce résultat qu'utilisent les exercices 11 et 13.
