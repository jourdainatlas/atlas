  page_corrige: 8
  enonce: |
    Déterminer les matrices $M \in \mathcal{M}_{n}(\mathbb{C})$ telles que $M(M - I_{n}) = 0$ et $\operatorname{tr} M = 0$.
  corrige: |
    Le polynôme $X(X - 1)$ annule $M$ et est simplement scindé : $M$ est diagonalisable, semblable à $\operatorname{diag}(I_{r}, 0)$, où $r$ est le nombre de valeurs propres égales à $1$. Sa trace vaut $r$, donc $r = 0$. 
    $$\boxed{M = 0}$$
     Autrement dit, la trace d'un projecteur est son rang ; un projecteur de trace nulle est nul.
- id: "mp-03-18"
  feuille: "f-mp-03"
  numero: 18
  partie: "Polynômes annulateurs et réduction"
