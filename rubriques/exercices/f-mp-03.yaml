  source: "Réduction (LLG), exercice 105"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Deux matrices de $\mathcal{M}_{n}(\mathbb{C})$ qui ont le même polynôme caractéristique et le même polynôme minimal sont-elles semblables ?

    **1.** Montrer que la réponse est oui pour $n \leqslant 3$. On distinguera selon le nombre de valeurs propres distinctes et selon le degré du polynôme minimal.

    **2.** Montrer que la réponse est non pour $n = 4$, en considérant deux matrices nilpotentes de polynôme minimal $X^{2}$ et de rangs différents.
  corrige: |
    **1.** Si $\pi$ est simplement scindé, les deux matrices sont diagonalisables, et $\chi$ fixe les multiplicités des valeurs propres : elles sont semblables à la même matrice diagonale, et ce, quel que soit $n$. Supposons donc que $\pi$ a une racine multiple ; pour $n \leqslant 3$, il reste trois cas.

    • $\chi = (X - a)^{2}$ ou $\chi = (X - a)^{3}$, avec $\pi = (X - a)^{2}$. La matrice $N = A - aI_{n}$ est non nulle, de carré nul ; par l'exercice 4 du chapitre 2, $2\mathrm{rg} N \leqslant n \leqslant 3$, donc $\mathrm{rg} N = 1$, et $A$ est semblable à $aI_{n} + E_{12}$.

    • $\chi = (X - a)^{3}$ et $\pi = (X - a)^{3}$. La matrice $N = A - aI_{3}$ est nilpotente d'indice $3$ ; pour $x$ tel que $N^{2}x \neq 0$, la famille $(N^{2}x, Nx, x)$ est une base, dans laquelle $A$ s'écrit $aI_{3} + E_{12} + E_{23}$.

    • $\chi = (X - a)^{2}(X - b)$ et $\pi = \chi$. Par le théorème 7, $\mathbb{C}^{3} = N_{a} \oplus N_{b}$, avec $\dim N_{a} = 2$ et $N_{b} = E_{b}(A)$ ; l'induit sur $N_{a}$ est $a\,\mathrm{id} + n_{a}$ avec $n_{a}^{2} = 0$ et $n_{a} \neq 0$, sinon $(X - a)(X - b)$ annulerait $A$. Comme au premier cas, $A$ est semblable à $\operatorname{diag}(aI_{2} + E_{12}, b)$.

    Dans chaque cas, la forme réduite ne dépend que de $\chi$ et de $\pi$. 
    $$\boxed{n \leqslant 3 : \text{ même } \chi \text{ et même } \pi \implies \text{semblables.}}$$

    **2.** Les matrices $N_{1} = E_{12} + E_{34}$ et $N_{2} = E_{12}$ de $\mathcal{M}_{4}(\mathbb{C})$ vérifient $N_{1}^{2} = N_{2}^{2} = 0$, sont non nulles, et ont donc pour polynôme minimal $X^{2}$ et pour polynôme caractéristique $X^{4}$. Mais $\mathrm{rg} N_{1} = 2 \neq 1 = \mathrm{rg} N_{2}$. 
    $$\boxed{n = 4 : \ N_{1} \text{ et } N_{2} \text{ ne sont pas semblables.}}$$
     Le couple $(\chi, \pi)$ ne classe donc plus les matrices à partir de la taille $4$ ; il faut les rangs de toutes les puissances de $A - \lambda I_{n}$, ce que fait la réduction de Jordan, hors programme.
