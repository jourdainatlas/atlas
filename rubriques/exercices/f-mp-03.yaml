  enonce: |
    Déterminer les matrices $A \in \mathcal{M}_{n}(\mathbb{R})$ diagonalisables telles que $A^{3} + 2A = 3I_{n}$. Le résultat subsiste-t-il si l'on ne suppose plus $A$ diagonalisable ? si l'on travaille dans $\mathcal{M}_{n}(\mathbb{C})$ ?
  corrige: |
    Le polynôme $X^{3} + 2X - 3$ a la racine évidente $1$, et $X^{3} + 2X - 3 = (X - 1)(X^{2} + X + 3)$, le second facteur ayant pour discriminant $1 - 12 = -11 < 0$. Si $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{R})$, ses valeurs propres sont réelles et racines de ce polynôme annulateur (proposition 2) : la seule possible est $1$, et $A$ est semblable à $I_{n}$, donc égale à $I_{n}$. 
    $$\boxed{A = I_{n}}$$
     Sans l'hypothèse de diagonalisabilité, il y a d'autres solutions réelles : la matrice compagnon $\begin{pmatrix} 0 & -3 \\ 1 & -1 \end{pmatrix}$ de $X^{2} + X + 3$ vérifie l'équation, puisque son polynôme caractéristique l'annule (théorème 6), et l'on peut la placer en blocs diagonaux à côté d'une identité. Dans $\mathcal{M}_{n}(\mathbb{C})$, le polynôme est simplement scindé, de racines $1$ et $\frac{-1 \pm \mathrm{i}\sqrt{11}}{2}$ : les solutions sont toutes les matrices diagonalisables dont le spectre est contenu dans ces trois nombres (théorème 3).
- id: "mp-03-17"
  feuille: "f-mp-03"
