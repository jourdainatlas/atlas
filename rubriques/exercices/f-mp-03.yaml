  source: "Réduction #2 (Prost), exercice 4"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $u \in \mathcal{L}(E)$ nilpotent d'indice $n = \dim E$.

    **1.** Montrer que, pour $k \in \llbracket 0\,,n \rrbracket$, $\dim \mathrm{Ker}\, u^{k} = k$.

    **2.** Soit $F$ un sous-espace stable par $u$, de dimension $k$. Montrer que $F = \mathrm{Ker}\, u^{k}$.

    **3.** En déduire que $u$ admet exactement $n + 1$ sous-espaces stables.
  corrige: |
    **1.** La suite $\big(\dim \mathrm{Ker}\, u^{k}\big)_{0 \leqslant k \leqslant n}$ est strictement croissante (exercice 49 de la feuille du chapitre 2), de $0$ à $n$, en $n$ étapes : chaque étape augmente la dimension d'exactement $1$. 
    $$\boxed{\dim \mathrm{Ker}\, u^{k} = k \quad (0 \leqslant k \leqslant n)}$$

    **2.** L'endomorphisme $u_{F}$ induit sur $F$ est nilpotent sur un espace de dimension $k$, donc $u_{F}^{k} = 0$ (chapitre 2, théorème 7) : $F \subset \mathrm{Ker}\, u^{k}$. Les dimensions sont égales. 
    $$\boxed{F = \mathrm{Ker}\, u^{k}}$$

    **3.** Chaque $\mathrm{Ker}\, u^{k}$ est stable, et ces $n + 1$ sous-espaces sont distincts, de dimensions $0, 1, \dots, n$. Par la question 2, ce sont les seuls. 
    $$\boxed{u \text{ a exactement } n + 1 \text{ sous-espaces stables.}}$$
     À l'opposé, une homothétie, en dimension au moins $2$, laisse stables tous les sous-espaces, en nombre infini sur $\mathbb{R}$ ou $\mathbb{C}$.
