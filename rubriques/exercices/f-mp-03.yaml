  noeuds: [rd-polynomes-endo, rd-diagonalisable]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme]
  source: "Réduction #2 (Prost), exercice 6"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$ et $P \in \mathbb{K}[X]$ un polynôme non constant tel que $P(0) \neq 0$ et $AB = P(A)$. Montrer que $A$ est inversible, puis que $A$ et $B$ commutent.
  corrige: |
    Écrivons $P = P(0) + XQ$. L'hypothèse s'écrit $AB = P(0)I_{n} + AQ(A)$, soit 
    $$A\big(B - Q(A)\big) = P(0)\,I_{n}, \qquad\text{d'où}\qquad A \cdot \frac{1}{P(0)}\big(B - Q(A)\big) = I_{n}.$$
     Une matrice carrée qui a un inverse à droite est inversible (chapitre 16 de MPSI). 
    $$\boxed{A \in \mathrm{GL}_{n}(\mathbb{K}), \qquad B = Q(A) + P(0)A^{-1}}$$
     L'inverse $A^{-1}$ est un polynôme en $A$ (proposition 4), donc $B$ aussi, et deux polynômes en $A$ commutent (proposition 1). 
    $$\boxed{AB = BA}$$
     *Piège.* L'hypothèse $P(0) \neq 0$ est indispensable : avec $P = X$, la relation $AB = A$ est vérifiée par $A = E_{11}$ et $B = I_{2} + E_{12}$, qui ne commutent pas.
- id: "mp-03-04"
  feuille: "f-mp-03"
  numero: 4
  partie: "Polynômes d'un endomorphisme"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["polynômes d'un endomorphisme", polynômes annulateurs]
  noeuds: [rd-polynomes-endo]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme]
  source: "BibM@th, Polynômes d'endomorphismes, exercice 5"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Le théorème 1 suppose $E$ de dimension finie. Soit $E = \mathbb{R}[X]$ et $u$ l'endomorphisme de $E$ défini par $u(P) = XP$.

    **1.** Pour $Q \in \mathbb{R}[X]$, calculer $Q(u)(1)$. En déduire que $u$ n'admet aucun polynôme annulateur non nul.

    **2.** Montrer que la dérivation $D : P \mapsto P'$ de $\mathbb{R}[X]$ n'admet pas non plus de polynôme annulateur non nul, alors que sa restriction à $\mathbb{R}_{n}[X]$ en admet un. Lequel ?
  corrige: |
    **1.** Par récurrence, $u^{k}(1) = X^{k}$, donc $Q(u)(1) = Q$ pour tout $Q \in \mathbb{R}[X]$. Si $Q(u) = 0$, alors $Q = Q(u)(1) = 0$. 
    $$\boxed{\text{Le seul polynôme annulateur de } u \text{ est le polynôme nul.}}$$

    **2.** Soit $Q = \sum_{k = 0}^{d} a_{k}X^{k}$ non nul, et $k_{0}$ le plus petit indice tel que $a_{k_{0}} \neq 0$. Dans 
    $$Q(D)(X^{d}) = \sum_{k = k_{0}}^{d} a_{k}D^{k}(X^{d}),$$
     le polynôme $D^{k}(X^{d})$ est de degré exactement $d - k$ ; le terme d'indice $k_{0}$ est donc le seul de degré $d - k_{0}$, et la somme n'est pas nulle. Sur $\mathbb{R}_{n}[X]$, en revanche, $D^{n+1} = 0$ et $D^{n} \neq 0$. 
    $$\boxed{D \text{ n'a pas de polynôme annulateur non nul sur } \mathbb{R}[X], \qquad \pi_{D|\mathbb{R}_{n}[X]} = X^{n+1}}$$
     L'existence du polynôme minimal repose sur la dimension finie : la famille $(\mathrm{id}_{E}, u, u^{2}, \dots)$ y est forcément liée, ce qui n'est plus vrai ici.
- id: "mp-03-05"
  feuille: "f-mp-03"
  numero: 5
  partie: "Polynômes d'un endomorphisme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["polynômes d'un endomorphisme", polynôme minimal]
  noeuds: [rd-polynomes-endo]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme]
  source: "Réduction #2 (Prost), exercice 21 ; BibM@th, Polynômes d'endomorphismes, exercice 25 ; Réduction (LLG), exercice 32"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $u \in \mathcal{L}(E)$.

    **1.** Soit $P \in \mathbb{K}[X]$. Montrer que $P(u)$ est inversible si et seulement si $P$ et $\pi_{u}$ sont premiers entre eux.

    **2.** On suppose $u$ inversible, et l'on note $d = \deg \pi_{u}$. Montrer que $\pi_{u}(0) \neq 0$, et que le polynôme minimal de $u^{-1}$ est 
    $$\pi_{u^{-1}} = \frac{X^{d}\,\pi_{u}\big(\frac{1}{X}\big)}{\pi_{u}(0)}.$$

    **3.** À quelle condition sur $\pi_{u}$ a-t-on $\mathbb{K}[u] \subset \mathrm{GL}(E) \cup \{0\}$ ?
  corrige: |
    **1.** Notons $D = P \wedge \pi_{u}$. *Si $D = 1$*, une relation de Bézout $UP + V\pi_{u} = 1$ donne, en évaluant en $u$, $U(u) \circ P(u) = \mathrm{id}_{E}$ : $P(u)$ est inversible. *Si $D \neq 1$*, on écrit $\pi_{u} = DR$ ; comme $\deg R < \deg \pi_{u}$, $R(u) \neq 0$, et $P(u) \circ R(u) = \frac{P}{D}(u) \circ \pi_{u}(u) = 0$, ce qui interdit à $P(u)$ d'être injectif. 
    $$\boxed{P(u) \in \mathrm{GL}(E) \iff P \wedge \pi_{u} = 1}$$

    **2.** Si $u$ est inversible, $0$ n'est pas valeur propre ; par la proposition 3, le nombre $\pi_{u}(0)$ est non nul. Posons $\tilde{\pi} = X^{d}\pi_{u}(1/X)$, le polynôme « retourné », dont le coefficient de $X^{k}$ est celui de $X^{d-k}$ dans $\pi_{u}$. En multipliant l'égalité $\pi_{u}(u) = \sum_{k} c_{k}u^{k} = 0$ par $u^{-d}$, on obtient 
    $$\sum_{k = 0}^{d} c_{k}\,(u^{-1})^{d-k} = 0 :$$
     $\tilde{\pi}$ annule $u^{-1}$, et il est de degré $d$ puisque son coefficient dominant est $c_{0} = \pi_{u}(0) \neq 0$. Ainsi $\deg \pi_{u^{-1}} \leqslant d$, et par symétrie des rôles de $u$ et $u^{-1}$, $\deg \pi_{u} \leqslant \deg \pi_{u^{-1}}$. Le polynôme $\tilde{\pi}/\pi_{u}(0)$, unitaire, annulateur et de degré minimal, est le polynôme minimal. 
    $$\boxed{\pi_{u^{-1}} = \frac{X^{d}\,\pi_{u}(1/X)}{\pi_{u}(0)}}$$
     Ses racines sont les inverses de celles de $\pi_{u}$, ce qui correspond à $\operatorname{Sp}(u^{-1}) = \{\lambda^{-1} \mid \lambda \in \operatorname{Sp}(u)\}$.

    **3.** Pour $P \in \mathbb{K}[X]$, $P(u) = 0$ équivaut à $\pi_{u} \mid P$, et $P(u)$ inversible à $P \wedge \pi_{u} = 1$. La condition demandée est donc : tout polynôme non multiple de $\pi_{u}$ est premier avec $\pi_{u}$, c'est-à-dire que les seuls diviseurs unitaires de $\pi_{u}$ sont $1$ et $\pi_{u}$. 
    $$\boxed{\mathbb{K}[u] \subset \mathrm{GL}(E) \cup \{0\} \iff \pi_{u} \text{ est irréductible dans } \mathbb{K}[X]}$$
     Dans ce cas, $\mathbb{K}[u]$ est un corps, comme $\mathbb{R}[u] \simeq \mathbb{C}$ pour l'exercice 1.
- id: "mp-03-06"
  feuille: "f-mp-03"
  numero: 6
