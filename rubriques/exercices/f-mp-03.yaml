  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{3} + A^{2} + A = 0$. Montrer que le rang de $A$ est pair. On pourra utiliser l'exercice 9.
  corrige: |
    Le polynôme $X(X^{2} + X + 1)$ annule $A$, et ses deux facteurs sont premiers entre eux. L'exercice 9, avec $Q = X^{2} + X + 1$ et $R = X$, donne $\mathrm{Im}\, A = \mathrm{Ker}\,(A^{2} + A + I_{n})$, sous-espace stable par $A$. L'endomorphisme $g$ induit par $A$ sur ce sous-espace est annulé par $X^{2} + X + 1$, de discriminant $-3 < 0$ : il n'a aucune valeur propre réelle. Son polynôme caractéristique, réel, n'a donc pas de racine réelle, et il est de degré pair, puisqu'un polynôme réel de degré impair s'annule (théorème des valeurs intermédiaires). 
    $$\boxed{\mathrm{rg} A = \dim \mathrm{Ker}\,(A^{2} + A + I_{n}) \text{ est pair.}}$$
     Sur $\mathbb{C}$, en revanche, le rang peut être impair : $A = (\jmath) \in \mathcal{M}_{1}(\mathbb{C})$ vérifie $A^{3} + A^{2} + A = 0$ et est de rang $1$.
- id: "mp-03-14"
  feuille: "f-mp-03"
  numero: 14
  partie: "Lemme de décomposition des noyaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lemme des noyaux, polynôme minimal]
  noeuds: [rd-noyaux, rd-polynomes-endo]
  notions: [polynome-minimal-endomorphisme, multiplicite-racine]
  source: "Réduction (LLG), exercice 33"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $u \in \mathcal{L}(E)$ et $p$ la multiplicité de $0$ comme racine de $\pi_{u}$ (avec $p = 0$ si $\pi_{u}(0) \neq 0$).

    **1.** Que dire de $u$ si $p = 0$ ?

    **2.** Montrer que $E = \mathrm{Ker}\, u^{p} \oplus \mathrm{Im}\, u^{p}$, et que le projecteur sur $\mathrm{Ker}\, u^{p}$ parallèlement à $\mathrm{Im}\, u^{p}$ est un polynôme en $u$.

    **3.** Montrer que $p$ est le plus petit entier $k$ tel que $\mathrm{Ker}\, u^{k} = \mathrm{Ker}\, u^{k+1}$.
  corrige: |
    **1.** Si $p = 0$, alors $\pi_{u}(0) \neq 0$, et $u$ est inversible (proposition 4).

    **2.** Écrivons $\pi_{u} = X^{p}R$ avec $R(0) \neq 0$ : les polynômes $X^{p}$ et $R$ sont premiers entre eux. Le lemme des noyaux donne $E = \mathrm{Ker}\, u^{p} \oplus \mathrm{Ker}\, R(u)$, et l'exercice 9 donne $\mathrm{Ker}\, R(u) = \mathrm{Im}\, u^{p}$. 
    $$\boxed{E = \mathrm{Ker}\, u^{p} \oplus \mathrm{Im}\, u^{p}}$$
     Par le théorème 2, le projecteur sur $\mathrm{Ker}\, u^{p}$ parallèlement à $\mathrm{Ker}\, R(u) = \mathrm{Im}\, u^{p}$ est un polynôme en $u$, à savoir $(VR)(u)$ si $UX^{p} + VR = 1$ est une relation de Bézout.

    **3.** La suite des noyaux $\mathrm{Ker}\, u^{k}$ est croissante. Pour $k \geqslant p$, on a $\mathrm{Ker}\, u^{k} = \mathrm{Ker}\, u^{p}$ : si $u^{k}(x) = 0$, la composante de $x$ sur $\mathrm{Im}\, u^{p}$ est annulée par $u^{k}$, alors que $u$ induit sur $\mathrm{Im}\, u^{p} = \mathrm{Ker}\, R(u)$ un endomorphisme injectif, puisque $R(0) \neq 0$ ; cette composante est donc nulle. Il reste à voir que la suite n'est pas constante avant le rang $p$. Si $\mathrm{Ker}\, u^{k} = \mathrm{Ker}\, u^{k+1}$ pour un $k < p$, la suite est constante à partir du rang $k$ (même argument qu'à l'exercice 49 de la feuille du chapitre 2), et en particulier $\mathrm{Ker}\, u^{p-1} = \mathrm{Ker}\, u^{p}$ ; montrons que c'est impossible si $p \geqslant 1$. Sinon, $X^{p-1}R$ annulerait $u$ : pour $x = x_{1} + x_{2}$ décomposé selon la question 2, $u^{p-1}R(u)(x_{1}) = R(u)u^{p-1}(x_{1}) = 0$ puisque $x_{1} \in \mathrm{Ker}\, u^{p} = \mathrm{Ker}\, u^{p-1}$, et $R(u)(x_{2}) = 0$. Cela contredit la minimalité de $\pi_{u}$. 
    $$\boxed{p = \min\{k \in \mathbb{N} \mid \mathrm{Ker}\, u^{k} = \mathrm{Ker}\, u^{k+1}\}}$$
     Ainsi, la multiplicité de $0$ dans $\pi_{u}$ est l'indice à partir duquel la suite des noyaux se stabilise. C'est le cas $\lambda = 0$ de la proposition 10, mais avec la multiplicité dans $\pi_{u}$, plus fine que celle dans $\chi_{u}$.
- id: "mp-03-15"
  feuille: "f-mp-03"
  numero: 15
  partie: "Lemme de décomposition des noyaux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [lemme des noyaux, polynôme minimal]
  noeuds: [rd-noyaux, rd-polynomes-endo]
  notions: [polynome-minimal-endomorphisme]
  source: "Réduction #2 (Prost), exercice 23 ; Réduction (LLG), exercice 31"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Polynôme minimal ponctuel.* Soit $E$ un $\mathbb{C}$-espace vectoriel et $u \in \mathcal{L}(E)$. Pour $x \in E$, on note $I_{x} = \{P \in \mathbb{C}[X] \mid P(u)(x) = 0\}$.

    **1.** Montrer que $I_{x}$ est un idéal de $\mathbb{C}[X]$ contenant $\pi_{u}$. On note $\pi_{u, x}$ son générateur unitaire ; montrer que $\pi_{u, x}$ divise $\pi_{u}$.

    **2.** Soit $x$, $y$ tels que $\pi_{u, x}$ et $\pi_{u, y}$ soient premiers entre eux. Montrer que $\pi_{u, x+y} = \pi_{u, x}\,\pi_{u, y}$.

    **3.** On écrit $\pi_{u} = \prod_{i = 1}^{r} (X - \lambda_{i})^{d_{i}}$, les $\lambda_{i}$ étant distincts. Justifier l'existence d'un vecteur 
    $$x_{i} \in \mathrm{Ker}\,(u - \lambda_{i}\mathrm{id}_{E})^{d_{i}} \setminus \mathrm{Ker}\,(u - \lambda_{i}\mathrm{id}_{E})^{d_{i} - 1},$$
     et calculer $\pi_{u, x_{i}}$.

    **4.** En déduire qu'il existe $x \in E$ tel que $\pi_{u, x} = \pi_{u}$.
  corrige: |
    **1.** L'ensemble $I_{x}$ est le noyau de l'application linéaire $P \mapsto P(u)(x)$, donc un sous-groupe ; si $P \in I_{x}$ et $Q \in \mathbb{C}[X]$, alors $(QP)(u)(x) = Q(u)\big(P(u)(x)\big) = 0$. C'est un idéal, qui contient $\pi_{u}$, donc non nul : le théorème 7 du chapitre 1 fournit son générateur unitaire $\pi_{u, x}$, et $\pi_{u} \in I_{x}$ donne $\pi_{u, x} \mid \pi_{u}$. 
    $$\boxed{I_{x} = \pi_{u, x}\,\mathbb{C}[X], \qquad \pi_{u, x} \mid \pi_{u}}$$

    **2.** Notons $P = \pi_{u, x}$, $Q = \pi_{u, y}$. D'une part, $(PQ)(u)(x + y) = Q(u)P(u)(x) + P(u)Q(u)(y) = 0$, donc $\pi_{u, x+y} \mid PQ$. D'autre part, soit $S = \pi_{u, x+y}$. Alors $(SQ)(u)(x) = (SQ)(u)(x + y) - S(u)Q(u)(y) = 0$, donc $P \mid SQ$ ; comme $P \wedge Q = 1$, le lemme de Gauss donne $P \mid S$. De même $Q \mid S$, et comme $P$ et $Q$ sont premiers entre eux, $PQ \mid S$. 
    $$\boxed{\pi_{u, x+y} = \pi_{u, x}\,\pi_{u, y}}$$

    **3.** Si l'on avait $\mathrm{Ker}\,(u - \lambda_{i}\mathrm{id}_{E})^{d_{i}} = \mathrm{Ker}\,(u - \lambda_{i}\mathrm{id}_{E})^{d_{i}-1}$, le polynôme $\pi_{u}/(X - \lambda_{i})$ annulerait $u$, puisque par le lemme des noyaux $E = \bigoplus_{j} \mathrm{Ker}\,(u - \lambda_{j}\mathrm{id}_{E})^{d_{j}}$ et que ce polynôme annule chacun des termes. C'est impossible, d'où l'existence de $x_{i}$. Le polynôme $\pi_{u, x_{i}}$ divise $(X - \lambda_{i})^{d_{i}}$, puisque ce dernier annule $x_{i}$, et ne divise pas $(X - \lambda_{i})^{d_{i}-1}$. 
    $$\boxed{\pi_{u, x_{i}} = (X - \lambda_{i})^{d_{i}}}$$

    **4.** Les polynômes $(X - \lambda_{i})^{d_{i}}$ sont premiers entre eux deux à deux. En appliquant la question 2 de proche en proche, avec $x = x_{1} + \cdots + x_{r}$ (le produit $\prod_{i < k}(X - \lambda_{i})^{d_{i}}$ est premier avec $(X - \lambda_{k})^{d_{k}}$) : 
    $$\boxed{\pi_{u, x_{1} + \cdots + x_{r}} = \prod_{i = 1}^{r}(X - \lambda_{i})^{d_{i}} = \pi_{u}}$$
     Le polynôme minimal est donc « atteint » par un vecteur : $(x, u(x), \dots, u^{d-1}(x))$ est libre, avec $d = \deg \pi_{u}$. En particulier, si $\pi_{u} = \chi_{u}$, l'endomorphisme $u$ est cyclique au sens de l'exercice 38.
