  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f \in \mathcal{L}(E)$ et $a$, $b$ deux scalaires distincts tels que $(f - a\,\mathrm{id}_{E}) \circ (f - b\,\mathrm{id}_{E}) = 0$.

    **1.** Déterminer deux réels $\alpha$ et $\beta$ tels que les endomorphismes $p = \alpha(f - b\,\mathrm{id}_{E})$ et $q = \beta(f - a\,\mathrm{id}_{E})$ vérifient $p + q = \mathrm{id}_{E}$. Montrer que $p$ et $q$ sont les projecteurs associés à la décomposition $E = E_{a}(f) \oplus E_{b}(f)$.

    **2.** Exprimer $f$, puis $f^{k}$ pour $k \in \mathbb{N}$, à l'aide de $p$ et de $q$.

    **3.** On suppose $a$ et $b$ non nuls. Montrer que $f$ est inversible et que la formule obtenue pour $f^{k}$ reste valable pour $k \in \mathbb{Z}$.
  corrige: |
    **1.** On veut $\alpha(f - b\,\mathrm{id}_{E}) + \beta(f - a\,\mathrm{id}_{E}) = \mathrm{id}_{E}$, ce qui est réalisé si $\alpha + \beta = 0$ et $-\alpha b - \beta a = 1$ : c'est la relation de Bézout de l'interpolation de Lagrange. 
    $$\boxed{\alpha = \frac{1}{a - b}, \qquad \beta = \frac{1}{b - a}, \qquad p = \frac{f - b\,\mathrm{id}_{E}}{a - b}, \qquad q = \frac{f - a\,\mathrm{id}_{E}}{b - a}}$$
     L'image de $p$ est contenue dans $\mathrm{Ker}\,(f - a\,\mathrm{id}_{E}) = E_{a}(f)$, puisque $(f - a\,\mathrm{id}_{E}) \circ p = 0$, et de même $\mathrm{Im}\, q \subset E_{b}(f)$. Comme $p + q = \mathrm{id}_{E}$ et $pq = 0$ (le produit contient le facteur $(f - a\,\mathrm{id}_{E})(f - b\,\mathrm{id}_{E}) = 0$), on a $p^{2} = p(p + q) = p$ et $q^{2} = q$ : ce sont les projecteurs du théorème 2.

    **2.** Sur $E_{a}(f)$, $f$ vaut $a\,\mathrm{id}$, et sur $E_{b}(f)$, $b\,\mathrm{id}$ : 
    $$\boxed{f = ap + bq, \qquad f^{k} = a^{k}p + b^{k}q \quad (k \in \mathbb{N})}$$
     La seconde formule découle de la première par récurrence, à l'aide de $p^{2} = p$, $q^{2} = q$ et $pq = qp = 0$.

    **3.** Si $a$ et $b$ sont non nuls, l'endomorphisme $g = a^{-1}p + b^{-1}q$ vérifie $fg = p + q = \mathrm{id}_{E}$ : $f$ est inversible et $f^{-1} = a^{-1}p + b^{-1}q$. Les puissances négatives suivent par récurrence. 
    $$\boxed{f^{k} = a^{k}p + b^{k}q \quad \text{pour tout } k \in \mathbb{Z}}$$
- id: "mp-03-11"
  feuille: "f-mp-03"
  numero: 11
  partie: "Lemme de décomposition des noyaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lemme des noyaux, polynômes annulateurs]
  noeuds: [rd-noyaux, rd-polynomes-endo]
  notions: [polynome-annulateur]
  source: "Réduction #2 (Prost), exercice 27 ; BibM@th, Polynômes d'endomorphismes, exercice 7"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f \in \mathcal{L}(E)$ admettant un polynôme annulateur $P$ tel que $P(0) = 0$ et $P'(0) \neq 0$.

    **1.** Montrer que $P = XQ$ avec $Q(0) \neq 0$, puis que $\mathrm{Im}\, f = \mathrm{Ker}\, Q(f)$.

    **2.** En déduire que $E = \mathrm{Ker}\, f \oplus \mathrm{Im}\, f$.

    **3.** Montrer qu'il existe une base de $E$ dans laquelle la matrice de $f$ est de la forme $\begin{pmatrix} A' & 0 \\ 0 & 0 \end{pmatrix}$, avec $A'$ inversible.
  corrige: |
    **1.** Comme $P(0) = 0$, on écrit $P = XQ$ ; alors $P' = Q + XQ'$ donne $Q(0) = P'(0) \neq 0$. Les polynômes $X$ et $Q$ sont donc premiers entre eux, puisque $0$ n'est pas racine de $Q$. L'exercice 9, avec le facteur $R = X$, donne 
    $$\boxed{\mathrm{Im}\, f = \mathrm{Ker}\, Q(f)}$$

    **2.** Le lemme des noyaux, appliqué au polynôme annulateur $P = XQ$ (proposition 5), donne $E = \mathrm{Ker}\, f \oplus \mathrm{Ker}\, Q(f)$. 
    $$\boxed{E = \mathrm{Ker}\, f \oplus \mathrm{Im}\, f}$$

    **3.** Dans une base adaptée à cette décomposition, la matrice de $f$ est diagonale par blocs (les deux sous-espaces sont stables), avec un bloc nul sur $\mathrm{Ker}\, f$ et un bloc $A'$ représentant l'endomorphisme induit $f'$ sur $\mathrm{Im}\, f$. Celui-ci est injectif, puisque $\mathrm{Ker}\, f' = \mathrm{Ker}\, f \cap \mathrm{Im}\, f = \{0\}$ : $A'$ est inversible. 
    $$\boxed{\mathrm{Mat}(f) = \begin{pmatrix} A' & 0 \\ 0 & 0 \end{pmatrix}, \qquad A' \text{ inversible}}$$
     *Piège.* Sans l'hypothèse $P'(0) \neq 0$, la conclusion est fausse : $f = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, annulé par $X^{2}$, vérifie $\mathrm{Ker}\, f = \mathrm{Im}\, f$.
- id: "mp-03-12"
  feuille: "f-mp-03"
  numero: 12
  partie: "Lemme de décomposition des noyaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lemme des noyaux]
  noeuds: [rd-noyaux]
  notions: []
  source: "BibM@th, Polynômes d'endomorphismes, exercice 6"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $f$ un endomorphisme non nul de $\mathbb{R}^{3}$ tel que $f^{3} + f = 0$.

    **1.** Montrer que $\mathbb{R}^{3} = \mathrm{Ker}\, f \oplus \mathrm{Ker}\,(f^{2} + \mathrm{id})$, et que $\mathrm{Ker}\,(f^{2} + \mathrm{id}) \neq \{0\}$.

    **2.** Montrer que $\mathrm{Ker}\,(f^{2} + \mathrm{id})$ est de dimension paire, puis que $\dim \mathrm{Ker}\, f = 1$.

    **3.** En déduire qu'il existe une base de $\mathbb{R}^{3}$ dans laquelle la matrice de $f$ est 
    $$\begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & -1 \\ 0 & 1 & 0 \end{pmatrix}.$$
  corrige: |
    **1.** Le polynôme $X^{3} + X = X(X^{2} + 1)$ annule $f$, et $X$, $X^{2} + 1$ sont premiers entre eux. La proposition 5 donne 
    $$\boxed{\mathbb{R}^{3} = \mathrm{Ker}\, f \oplus \mathrm{Ker}\,(f^{2} + \mathrm{id})}$$
     Si $\mathrm{Ker}\,(f^{2} + \mathrm{id})$ était réduit à $\{0\}$, on aurait $\mathrm{Ker}\, f = \mathbb{R}^{3}$, donc $f = 0$, ce qui est exclu.

    **2.** L'endomorphisme $g$ induit par $f$ sur $F = \mathrm{Ker}\,(f^{2} + \mathrm{id})$, stable, vérifie $g^{2} = -\mathrm{id}_{F}$. En passant au déterminant, $(\det g)^{2} = (-1)^{\dim F}$, donc $\dim F$ est pair (c'est l'argument de l'exercice 35 de la feuille du chapitre 2). Comme $1 \leqslant \dim F \leqslant 3$, on a $\dim F = 2$. 
    $$\boxed{\dim \mathrm{Ker}\,(f^{2} + \mathrm{id}) = 2, \qquad \dim \mathrm{Ker}\, f = 1}$$

    **3.** Soit $e_{1}$ une base de $\mathrm{Ker}\, f$ et $e_{2} \in F$ non nul. Le vecteur $e_{3} = f(e_{2})$ est dans $F$, et $(e_{2}, e_{3})$ est libre : sinon $e_{2}$ serait vecteur propre réel de $g$, qui n'en a pas puisque $\lambda^{2} = -1$ est impossible. On a $f(e_{3}) = f^{2}(e_{2}) = -e_{2}$. 
    $$\boxed{\mathrm{Mat}_{(e_{1}, e_{2}, e_{3})}(f) = \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & -1 \\ 0 & 1 & 0 \end{pmatrix}}$$
     Géométriquement, $f$ est la composée de la projection sur le plan $F$ parallèlement à la droite $\mathrm{Ker}\, f$ et d'une « rotation d'un quart de tour » de $F$, au sens de la base $(e_{2}, e_{3})$.
- id: "mp-03-13"
  feuille: "f-mp-03"
