  enonce: |
    Montrer que le sous-espace vectoriel de $\mathcal{M}_{n}(\mathbb{K})$ engendré par les matrices nilpotentes est l'hyperplan des matrices de trace nulle. On pourra examiner la matrice $E_{ii} + E_{ij} - E_{ji} - E_{jj}$ pour $i \neq j$.
  corrige: |
    Une matrice nilpotente a pour polynôme caractéristique $X^{n}$ (chapitre 2, théorème 7), donc une trace nulle : le sous-espace $V$ engendré par les nilpotentes est contenu dans l'hyperplan $H$ des matrices de trace nulle. Réciproquement, pour $i \neq j$, $E_{ij}$ est nilpotente, et la matrice $M = E_{ii} + E_{ij} - E_{ji} - E_{jj}$ agit sur $\mathrm{Vect}(e_{i}, e_{j})$ comme $\begin{pmatrix} 1 & 1 \\ -1 & -1 \end{pmatrix}$, de carré nul, et annule les autres vecteurs de base : elle est nilpotente. Donc 
    $$E_{ii} - E_{jj} = M - E_{ij} + E_{ji} \in V.$$
     Les $n^{2} - n$ matrices $E_{ij}$ ($i \neq j$) et les $n - 1$ matrices $E_{ii} - E_{nn}$ ($i < n$) forment une famille libre de $n^{2} - 1$ éléments de $V$. 
    $$\boxed{\mathrm{Vect}\{N \mid N \text{ nilpotente}\} = \{M \mid \operatorname{tr} M = 0\}}$$
     Les nilpotentes ne forment pas un sous-espace (exercice 48 du chapitre 2, question 4 : $E_{12} + E_{21}$ n'est pas nilpotente), mais elles engendrent tout l'hyperplan des matrices de trace nulle.
