- id: "mp-03-01"
  feuille: "f-mp-03"
  numero: 1
  partie: "Polynômes d'un endomorphisme"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["polynômes d'un endomorphisme", polynôme minimal]
  noeuds: [rd-polynomes-endo]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme, valeur-propre]
  source: "Réduction #2 (Prost), exercice 16"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel et $u \in \mathcal{L}(E)$ tel que $u^{2} = 3u - 3\,\mathrm{id}_{E}$. Déterminer le polynôme minimal de $u$. L'endomorphisme $u$ a-t-il des valeurs propres ? Montrer que $u$ est inversible et exprimer $u^{-1}$ comme polynôme en $u$.
  corrige: |
    Le polynôme $P = X^{2} - 3X + 3$ annule $u$. Son discriminant vaut $9 - 12 = -3 < 0$ : il n'a pas de racine réelle, donc il est irréductible dans $\mathbb{R}[X]$. Le polynôme minimal, unitaire et diviseur non constant de $P$ (théorème 1), est donc $P$ lui-même. 
    $$\boxed{\pi_{u} = X^{2} - 3X + 3}$$
     Les valeurs propres réelles de $u$ seraient des racines de $\pi_{u}$ (proposition 3) : $u$ n'a aucune valeur propre réelle. En particulier $0$ n'est pas valeur propre, et $u$ est inversible ; on le voit aussi en écrivant $u \circ (u - 3\,\mathrm{id}_{E}) = -3\,\mathrm{id}_{E}$, d'où 
    $$\boxed{u^{-1} = \frac{1}{3}\,(3\,\mathrm{id}_{E} - u) = \mathrm{id}_{E} - \frac{1}{3}u.}$$
     On remarque que $E$ est nécessairement de dimension paire : c'est le cas $\pi_{u}$ irréductible de degré $2$ de l'exercice 37.
- id: "mp-03-02"
  feuille: "f-mp-03"
  numero: 2
  partie: "Polynômes d'un endomorphisme"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["polynômes d'un endomorphisme", polynôme minimal]
  noeuds: [rd-polynomes-endo, pol-binome]
  notions: [polynome-annulateur, polynome-minimal-endomorphisme]
  source: "BibM@th, Polynômes d'endomorphismes, exercice 4"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $n \geqslant 2$ et $J \in \mathcal{M}_{n}(\mathbb{K})$ la matrice dont tous les coefficients valent $1$.

    **1.** Calculer $J^{2}$ en fonction de $J$. En déduire le polynôme minimal de $J$, ainsi que $J^{k}$ pour tout $k \in \mathbb{N}^{*}$.

    **2.** Soit $a$, $b \in \mathbb{K}$ et $M = aI_{n} + bJ$. Calculer $M^{k}$ pour $k \in \mathbb{N}$, à l'aide de la formule du binôme.
  corrige: |
    **1.** Le coefficient $(i, j)$ de $J^{2}$ est $\sum_{k} 1 \times 1 = n$ : $J^{2} = nJ$. Le polynôme $X^{2} - nX = X(X - n)$ annule $J$, et $J$ n'est pas une homothétie, donc aucun polynôme de degré $1$ ne l'annule. 
    $$\boxed{\pi_{J} = X(X - n), \qquad J^{k} = n^{k-1}J \quad (k \geqslant 1)}$$
     La seconde formule s'obtient par récurrence : $J^{k+1} = n^{k-1}J^{2} = n^{k}J$. Le polynôme minimal est simplement scindé : $J$ est diagonalisable (théorème 3), de valeurs propres $0$ et $n$.

    **2.** Les matrices $aI_{n}$ et $bJ$ commutent, et la formule du binôme donne, en séparant le terme $j = 0$, 
    $$M^{k} = a^{k}I_{n} + \sum_{j = 1}^{k}\binom{k}{j}a^{k-j}b^{j}n^{j-1}J = a^{k}I_{n} + \frac{1}{n}\Big(\sum_{j = 0}^{k}\binom{k}{j}a^{k-j}(nb)^{j} - a^{k}\Big)J.$$

    $$\boxed{M^{k} = a^{k}I_{n} + \frac{(a + nb)^{k} - a^{k}}{n}\,J}$$
     Pour $k = 1$, on retrouve $aI_{n} + bJ$ ✓. Les nombres $a$ et $a + nb$ sont les valeurs propres de $M$, associées à $\mathrm{Ker}\, J$ et à $\mathbb{K}{(1, \dots, 1)}^{T}$.
- id: "mp-03-03"
  feuille: "f-mp-03"
  numero: 3
  partie: "Polynômes d'un endomorphisme"
  etoiles: 1
  types: [Démonstration]
