  source: "Réduction #2 (Prost), exercice 35"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Soit $u \in \mathcal{L}(E)$. On note $\mathcal{K} = \{\mathrm{Ker}\, P(u) \mid P \in \mathbb{K}[X]\}$ et $\mathcal{I} = \{\mathrm{Im}\, P(u) \mid P \in \mathbb{K}[X]\}$.

    **1.** Soit $P \in \mathbb{K}[X]$ et $D = P \wedge \pi_{u}$. Montrer que $\mathrm{Ker}\, P(u) = \mathrm{Ker}\, D(u)$ et $\mathrm{Im}\, P(u) = \mathrm{Im}\, D(u)$. En déduire que $\mathcal{K}$ et $\mathcal{I}$ sont finis.

    **2.** Soit $D$ et $D'$ deux diviseurs de $\pi_{u}$, et $\Delta = D \wedge D'$. Montrer que $\mathrm{Ker}\, \Delta(u) \subset \mathrm{Ker}\, D(u)$ et $\mathrm{Im}\, D(u) \subset \mathrm{Im}\, \Delta(u)$, puis que $\mathrm{Ker}\, D(u) = \mathrm{Ker}\, \Delta(u)$ si et seulement si $\mathrm{Im}\, D(u) = \mathrm{Im}\, \Delta(u)$.

    **3.** En déduire que $\mathrm{Ker}\, D(u) = \mathrm{Ker}\, D'(u)$ si et seulement si $\mathrm{Im}\, D(u) = \mathrm{Im}\, D'(u)$, puis que $\mathcal{K}$ et $\mathcal{I}$ ont le même cardinal.
  corrige: |
    **1.** Une relation de Bézout $D = UP + V\pi_{u}$ donne $D(u) = U(u)P(u)$, d'où $\mathrm{Ker}\, P(u) \subset \mathrm{Ker}\, D(u)$ et $\mathrm{Im}\, D(u) \subset \mathrm{Im}\, P(u)$. L'écriture $P = DQ$ donne $P(u) = Q(u)D(u) = D(u)Q(u)$, d'où les inclusions réciproques. 
    $$\boxed{\mathrm{Ker}\, P(u) = \mathrm{Ker}\, D(u), \qquad \mathrm{Im}\, P(u) = \mathrm{Im}\, D(u)}$$
     Les ensembles $\mathcal{K}$ et $\mathcal{I}$ sont donc indexés par les diviseurs unitaires de $\pi_{u}$, en nombre fini (produits de facteurs irréductibles de $\pi_{u}$ avec des exposants bornés).

    **2.** Comme $\Delta \mid D$, on écrit $D = \Delta S$, d'où $D(u) = S(u)\Delta(u) = \Delta(u)S(u)$ et les deux inclusions. Par le théorème du rang, $\dim \mathrm{Ker}\, D(u) + \dim \mathrm{Im}\, D(u) = n = \dim \mathrm{Ker}\, \Delta(u) + \dim \mathrm{Im}\, \Delta(u)$. Grâce aux inclusions, l'égalité des noyaux équivaut à celle de leurs dimensions, donc à celle des dimensions des images, donc à l'égalité des images. 
    $$\boxed{\mathrm{Ker}\, D(u) = \mathrm{Ker}\, \Delta(u) \iff \mathrm{Im}\, D(u) = \mathrm{Im}\, \Delta(u)}$$

    **3.** Une relation de Bézout $\Delta = AD + BD'$ montre, avec les inclusions de la question 2, que 
    $$\mathrm{Ker}\, \Delta(u) = \mathrm{Ker}\, D(u) \cap \mathrm{Ker}\, D'(u), \qquad \mathrm{Im}\, \Delta(u) = \mathrm{Im}\, D(u) + \mathrm{Im}\, D'(u).$$
     Supposons que $D(u)$ et $D'(u)$ aient le même noyau. Ce noyau est alors celui de $\Delta(u)$, et la question 2, appliquée à $D$ puis à $D'$, montre que les images de $D(u)$ et de $D'(u)$ sont toutes deux égales à celle de $\Delta(u)$. Réciproquement, si $D(u)$ et $D'(u)$ ont la même image, celle-ci est l'image de $\Delta(u)$, et la question 2 donne l'égalité des noyaux. L'application $\mathrm{Ker}\, D(u) \mapsto \mathrm{Im}\, D(u)$ est donc bien définie et injective, de $\mathcal{K}$ sur $\mathcal{I}$, et elle est surjective par construction. 
    $$\boxed{\operatorname{card} \mathcal{K} = \operatorname{card} \mathcal{I}}$$
     Le résultat est surprenant à première vue : les noyaux et les images de polynômes en $u$ ne sont pas les mêmes sous-espaces (pour $u$ nilpotent d'indice $2$ en dimension $3$, $\mathrm{Ker}\, u$ est un plan et $\mathrm{Im}\, u$ une droite), mais ils sont en nombre égal.
- id: "mp-03-50"
  feuille: "f-mp-03"
