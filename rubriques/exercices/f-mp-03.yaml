    Déterminer les matrices $A \in \mathcal{M}_{n}(\mathbb{R})$ telles que $A^{5} = A^{3}$ et $\operatorname{tr} A = n$.
  corrige: |
    Le polynôme $X^{5} - X^{3} = X^{3}(X - 1)(X + 1)$ annule $A$ : les valeurs propres complexes de $A$ appartiennent à $\{-1, 0, 1\}$ (proposition 2, appliquée dans $\mathcal{M}_{n}(\mathbb{C})$). La trace est la somme des $n$ valeurs propres complexes comptées avec multiplicité, chacune au plus égale à $1$ ; elle vaut $n$ si et seulement si toutes valent $1$. Ainsi $\chi_{A} = (X - 1)^{n}$, et $\pi_{A}$, qui divise $X^{3}(X - 1)(X + 1)$ et a les mêmes racines que $\chi_{A}$ (proposition 8), est égal à $X - 1$. 
    $$\boxed{A = I_{n}}$$
     *Piège.* Le polynôme annulateur n'est pas simplement scindé, à cause du facteur $X^{3}$ : on ne peut pas affirmer d'emblée que $A$ est diagonalisable. C'est la condition sur la trace qui élimine la valeur propre $0$ et, avec elle, le facteur gênant.
- id: "mp-03-21"
  feuille: "f-mp-03"
  numero: 21
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [annulateurs et réduction]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction #2 (Prost), exercice 11 ; Réduction (LLG), exercice 35"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{3} = A + I_{n}$. Montrer que $\det A > 0$. On pourra étudier les racines réelles et complexes du polynôme $X^{3} - X - 1$.
  corrige: |
    Étudions $f : x \mapsto x^{3} - x - 1$ sur $\mathbb{R}$. Sa dérivée $3x^{2} - 1$ s'annule en $\pm\frac{1}{\sqrt{3}}$, et le maximum local vaut $f\big(-\frac{1}{\sqrt{3}}\big) = \frac{2}{3\sqrt{3}} - 1 < 0$. Le polynôme $P = X^{3} - X - 1$ a donc une seule racine réelle $r$, et $f(1) = -1 < 0 < 5 = f(2)$ donne $r \in \,]1, 2[$. Ses deux autres racines complexes $z$ et $\bar{z}$ sont non réelles et conjuguées.

    Les valeurs propres complexes de $A$ sont parmi $r$, $z$, $\bar{z}$ (proposition 2). Comme $\chi_{A}$ est réel, $z$ et $\bar{z}$ y ont la même multiplicité $b$ ; notons $a$ celle de $r$. Le déterminant est le produit des valeurs propres comptées avec multiplicité : 
    $$\det A = r^{a}\,(z\bar{z})^{b} = r^{a}\,|z|^{2b}.$$

    $$\boxed{\det A > 0}$$
     Numériquement, $r \approx 1{,}325$ et $|z|^{2} = \frac{1}{r} \approx 0{,}755$, puisque le produit des trois racines vaut $1$.
- id: "mp-03-22"
  feuille: "f-mp-03"
  numero: 22
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, polynômes annulateurs, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction #2 (Prost), exercice 14"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{2} + {A}^{T} = I_{n}$.

    **1.** En transposant la relation, trouver un polynôme annulateur de $A$ de degré $4$, et en déduire que $A$ est diagonalisable.

    **2.** On suppose $A$ inversible. Montrer que $1 \notin \operatorname{Sp}(A)$, puis que $A$ est symétrique.
  corrige: |
    **1.** En transposant, $({A}^{T})^{2} + A = I_{n}$, et ${A}^{T} = I_{n} - A^{2}$ donne $(I_{n} - A^{2})^{2} + A = I_{n}$, soit $A^{4} - 2A^{2} + A = 0$. Le polynôme 
    $$X^{4} - 2X^{2} + X = X(X - 1)(X^{2} + X - 1) = X(X - 1)\Big(X - \frac{-1 + \sqrt{5}}{2}\Big)\Big(X - \frac{-1 - \sqrt{5}}{2}\Big)$$
     a quatre racines réelles distinctes : il est simplement scindé sur $\mathbb{R}$. 
    $$\boxed{A \text{ est diagonalisable dans } \mathcal{M}_{n}(\mathbb{R}).}$$

    **2.** Si $A$ est inversible, $0 \notin \operatorname{Sp}(A)$. Si l'on avait $AX = X$ avec $X \neq 0$, alors ${A}^{T}X = X - A^{2}X = 0$, et ${A}^{T}$, donc $A$, ne serait pas inversible. Ainsi $\operatorname{Sp}(A)$ est contenu dans l'ensemble des racines de $X^{2} + X - 1$, et le polynôme minimal, simplement scindé et à racines dans cet ensemble, divise $X^{2} + X - 1$. Donc $A^{2} = I_{n} - A$, et ${A}^{T} = I_{n} - A^{2} = A$. 
    $$\boxed{1 \notin \operatorname{Sp}(A), \qquad {A}^{T} = A}$$
- id: "mp-03-23"
  feuille: "f-mp-03"
  numero: 23
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction #2 (Prost), exercice 10"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $3A^{3} = A^{2} + A + I_{n}$.

    **1.** Factoriser le polynôme $3X^{3} - X^{2} - X - 1$ et montrer que $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{C})$.

    **2.** Montrer que chaque coefficient de la matrice $A^{p}$ converge lorsque $p$ tend vers $+\infty$, et que la matrice limite $L$ vérifie $L^{2} = L$. Préciser l'image et le noyau de $L$.
  corrige: |
    **1.** La racine évidente $1$ donne $3X^{3} - X^{2} - X - 1 = (X - 1)(3X^{2} + 2X + 1)$. Le second facteur a pour discriminant $4 - 12 = -8$ et pour racines $\mu$, $\bar\mu = \frac{-1 \pm \mathrm{i}\sqrt{2}}{3}$, de module $|\mu| = \sqrt{\mu\bar\mu} = \frac{1}{\sqrt{3}}$. Les trois racines sont distinctes : le polynôme est simplement scindé sur $\mathbb{C}$. 
    $$\boxed{A \text{ est diagonalisable dans } \mathcal{M}_{n}(\mathbb{C}), \qquad \operatorname{Sp}(A) \subset \Big\{1, \frac{-1 \pm \mathrm{i}\sqrt{2}}{3}\Big\}}$$

    **2.** Écrivons $A = PDP^{-1}$ avec $P \in \mathrm{GL}_{n}(\mathbb{C})$ et $D$ diagonale. Alors $A^{p} = PD^{p}P^{-1}$, dont les coefficients sont des combinaisons linéaires fixes des nombres $1^{p}$, $\mu^{p}$, $\bar\mu^{p}$. Comme $|\mu| < 1$, $\mu^{p} \to 0$, et chaque coefficient converge. La limite est $L = PD_{\infty}P^{-1}$, où $D_{\infty}$ s'obtient en remplaçant par $0$ les coefficients diagonaux différents de $1$ : $D_{\infty}^{2} = D_{\infty}$, donc $L^{2} = L$. Plus explicitement, la relation de Bézout 
    $$\frac{1}{6}(3X^{2} + 2X + 1) - \Big(\frac{X}{2} + \frac{5}{6}\Big)(X - 1) = 1$$
     montre (théorème 2) que $L$ est le projecteur $\frac{1}{6}(3A^{2} + 2A + I_{n})$, réel : 
    $$\boxed{L = \lim_{p \to +\infty} A^{p} = \frac{1}{6}(3A^{2} + 2A + I_{n}), \qquad \mathrm{Im}\, L = \mathrm{Ker}\,(A - I_{n}), \qquad \mathrm{Ker}\, L = \mathrm{Ker}\,(3A^{2} + 2A + I_{n})}$$
     On contrôle que $\frac{1}{6}(3 + 2 + 1) = 1$ et que $3\mu^{2} + 2\mu + 1 = 0$ : le polynôme $\frac{1}{6}(3X^{2} + 2X + 1)$ vaut $1$ en $1$ et $0$ en $\mu$, $\bar\mu$. C'est le comportement des chaînes de Markov : les puissances convergent vers le projecteur sur les vecteurs fixes dès que les autres valeurs propres sont de module strictement inférieur à $1$.
- id: "mp-03-24"
  feuille: "f-mp-03"
  numero: 24
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [annulateurs et réduction, diagonalisation, sous-espaces stables]
  noeuds: [rd-diagonalisable, rd-polynomes-endo, rd-stables]
  notions: [polynome-annulateur, diagonalisable, sous-espace-stable]
  source: "Réduction #2 (Prost), exercice 1"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $u \in \mathcal{L}(E)$ diagonalisable.

    **1.** Soit $F$ un sous-espace stable par $u$. Montrer que $F = \bigoplus_{\lambda \in \operatorname{Sp}(u)} \big(F \cap E_{\lambda}(u)\big)$, et en déduire que $F$ est somme directe de droites propres.

    **2.** Déterminer les sous-espaces de $\mathbb{R}^{3}$ stables par les endomorphismes canoniquement associés aux matrices 
    $$A = \begin{pmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \\ 0 & 0 & 3 \end{pmatrix} \qquad\text{et}\qquad B = \begin{pmatrix} 3 & -2 & 8 \\ 1 & 0 & 4 \\ 0 & 0 & 1 \end{pmatrix}.$$
  corrige: |
    **1.** L'endomorphisme $u_{F}$ induit sur $F$ est diagonalisable (proposition 6) ; ses vecteurs propres sont des vecteurs propres de $u$ appartenant à $F$, et $E_{\lambda}(u_{F}) = F \cap E_{\lambda}(u)$. Comme $F$ est somme de ses sous-espaces propres, 
    $$\boxed{F = \bigoplus_{\lambda \in \operatorname{Sp}(u)} \big(F \cap E_{\lambda}(u)\big)}$$
     En choisissant une base de chaque $F \cap E_{\lambda}(u)$, on écrit $F$ comme somme directe de droites engendrées par des vecteurs propres. Réciproquement, toute somme de sous-espaces de sous-espaces propres est stable.

    **2.** Pour $A$, les sous-espaces propres sont les trois axes de coordonnées, et chaque $F \cap E_{\lambda}(A)$ est nul ou égal à l'axe : les sous-espaces stables sont les $2^{3} = 8$ sommes d'axes. 
    $$\boxed{\{0\}, \ \mathbb{R} e_{1}, \ \mathbb{R} e_{2}, \ \mathbb{R} e_{3}, \ \mathrm{Vect}(e_{1}, e_{2}), \ \mathrm{Vect}(e_{1}, e_{3}), \ \mathrm{Vect}(e_{2}, e_{3}), \ \mathbb{R}^{3}}$$
     Pour $B$, le calcul donne $\chi_{B} = (X - 1)^{2}(X - 2)$, et $B - I_{3}$ est de rang $1$ : $B$ est diagonalisable, avec 
    $$E_{1}(B) = \mathrm{Vect}\big((1, 1, 0), (-4, 0, 1)\big), \qquad E_{2}(B) = \mathbb{R}(2, 1, 0).$$
     Les sous-espaces stables sont les $G \oplus H$ avec $G$ sous-espace de $E_{1}(B)$ et $H \in \{\{0\}, E_{2}(B)\}$ : 
    $$\boxed{\{0\}, \ \text{les droites de } E_{1}(B), \ E_{2}(B), \ E_{1}(B), \ \text{les plans } D \oplus E_{2}(B) \ (D \subset E_{1}(B)), \ \mathbb{R}^{3}}$$
     Il y en a une infinité, puisque le plan $E_{1}(B)$ contient une infinité de droites. Le nombre de sous-espaces stables est fini exactement lorsque tous les sous-espaces propres sont des droites.
- id: "mp-03-25"
  feuille: "f-mp-03"
  numero: 25
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, sous-espaces stables]
  noeuds: [rd-diagonalisable, rd-polynomes-endo, rd-stables]
  notions: [polynome-annulateur, diagonalisable, sous-espace-stable, valeur-propre]
  source: "Réduction #2 (Prost), exercice 2"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $E$ un $\mathbb{C}$-espace vectoriel de dimension $n \geqslant 2$ et $u \in \mathcal{L}(E)$.

    **1.** Montrer qu'il existe une droite vectorielle stable par $u$.

    **2.** Soit $\lambda$ une valeur propre de $u$. Montrer que tout hyperplan contenant $\mathrm{Im}\,(u - \lambda\,\mathrm{id}_{E})$ est stable par $u$, et en déduire qu'il existe un hyperplan stable par $u$.

    **3.** Ces propriétés restent-elles vraies lorsque $E$ est un $\mathbb{R}$-espace vectoriel ?
  corrige: |
    **1.** Sur $\mathbb{C}$, $u$ a une valeur propre (chapitre 2, proposition 12) ; la droite engendrée par un vecteur propre est stable.

    **2.** Le sous-espace $\mathrm{Im}\,(u - \lambda\,\mathrm{id}_{E})$ est de dimension au plus $n - 1$, puisque $u - \lambda\,\mathrm{id}_{E}$ n'est pas injectif : il est contenu dans un hyperplan $H$ (base incomplète). Pour $x \in H$, 
    $$u(x) = (u - \lambda\,\mathrm{id}_{E})(x) + \lambda x \in \mathrm{Im}\,(u - \lambda\,\mathrm{id}_{E}) + H = H.$$

    $$\boxed{\text{Tout hyperplan contenant } \mathrm{Im}\,(u - \lambda\,\mathrm{id}_{E}) \text{ est stable par } u.}$$

    **3.** Sur $\mathbb{R}$, les deux propriétés tombent en défaut : la rotation d'angle $\frac{\pi}{2}$ de $\mathbb{R}^{2}$ n'a ni droite stable, ni hyperplan stable, puisque les hyperplans de $\mathbb{R}^{2}$ sont des droites. Elles restent vraies si $n$ est impair, puisqu'il existe alors une valeur propre réelle (chapitre 2, proposition 12), et les deux arguments précédents s'appliquent.
- id: "mp-03-26"
  feuille: "f-mp-03"
  numero: 26
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction (LLG), exercice 26"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{R})$, avec $B$ diagonalisable et $AB^{3} = B^{3}A$.

    **1.** Montrer qu'il existe un polynôme $P \in \mathbb{R}[X]$ tel que $B = P(B^{3})$. On pourra utiliser l'interpolation de Lagrange.

    **2.** En déduire que $AB = BA$.

    **3.** Le résultat subsiste-t-il si l'on remplace $B^{3}$ par $B^{2}$ ? Proposer une généralisation.
  corrige: |
    **1.** Soit $\lambda_{1}, \dots, \lambda_{p}$ les valeurs propres distinctes de $B$, réelles. La fonction cube est injective sur $\mathbb{R}$, donc les $\lambda_{i}^{3}$ sont distincts, et l'interpolation de Lagrange (chapitre 13 de MPSI) fournit $P \in \mathbb{R}[X]$ tel que $P(\lambda_{i}^{3}) = \lambda_{i}$ pour tout $i$. Si $B = QDQ^{-1}$ avec $D$ diagonale, alors 
    $$P(B^{3}) = Q\,P(D^{3})\,Q^{-1} = QDQ^{-1} = B,$$
     puisque $P(D^{3})$ est diagonale de coefficients $P(\lambda_{i}^{3}) = \lambda_{i}$. 
    $$\boxed{B = P(B^{3})}$$

    **2.** La matrice $A$ commute avec $B^{3}$, donc avec ses puissances et avec tout polynôme en $B^{3}$ ; en particulier avec $P(B^{3}) = B$. 
    $$\boxed{AB = BA}$$

    **3.** Non : avec $B = \operatorname{diag}(1, -1)$, on a $B^{2} = I_{2}$, qui commute avec toute matrice, mais $A = E_{12}$ vérifie $AB = -E_{12} \neq E_{12} = BA$. L'argument échoue parce que $x \mapsto x^{2}$ n'est pas injective sur $\{1, -1\}$. La généralisation est la suivante : si $B$ est diagonalisable, si $AB^{k} = B^{k}A$, et si $\lambda \mapsto \lambda^{k}$ est injective sur $\operatorname{Sp}(B)$, alors $AB = BA$. C'est le cas pour tout $k$ impair et $B$ réelle diagonalisable.
- id: "mp-03-27"
  feuille: "f-mp-03"
  numero: 27
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, polynômes annulateurs, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction (LLG), exercice 25 ; Réduction #2 (Prost), exercice 26 ; BibM@th, Polynômes d'endomorphismes, exercice 26"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $E$ un $\mathbb{C}$-espace vectoriel et $f \in \mathcal{L}(E)$.

    **1.** On suppose $f$ inversible et $f^{2}$ diagonalisable. Trouver un polynôme annulateur de $f$ simplement scindé, et en déduire que $f$ est diagonalisable.

    **2.** Dans le cas général, montrer que $f$ est diagonalisable si et seulement si $f^{2}$ est diagonalisable et $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$.

    **3.** Le résultat de la première question subsiste-t-il si $E$ est un $\mathbb{R}$-espace vectoriel ?
  corrige: |
    **1.** La matrice $f^{2}$ est diagonalisable et inversible : $\pi_{f^{2}} = \prod_{i = 1}^{r}(X - \mu_{i})$, avec des $\mu_{i}$ distincts et non nuls (théorème 3). Le polynôme $Q = \pi_{f^{2}}(X^{2}) = \prod_{i}(X^{2} - \mu_{i})$ annule $f$. Sur $\mathbb{C}$, chaque $\mu_{i}$ a deux racines carrées opposées et distinctes, puisque $\mu_{i} \neq 0$, et deux valeurs $\mu_{i} \neq \mu_{j}$ n'ont pas de racine carrée commune : $Q$ a $2r$ racines simples. 
    $$\boxed{Q = \prod_{i}(X^{2} - \mu_{i}) \text{ est simplement scindé et annule } f : f \text{ est diagonalisable.}}$$

    **2.** Si $f$ est diagonalisable, de matrice $\operatorname{diag}(\lambda_{i})$, alors $f^{2}$ a pour matrice $\operatorname{diag}(\lambda_{i}^{2})$, et $\lambda_{i}^{2} = 0$ si et seulement si $\lambda_{i} = 0$ : $\mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$. Réciproquement, supposons $f^{2}$ diagonalisable et $\mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}$. Les sous-espaces propres $E_{\mu}(f^{2})$ sont stables par $f$, qui commute avec $f^{2}$. Sur $E_{\mu}(f^{2})$ avec $\mu \neq 0$, l'induit $g$ vérifie $g^{2} = \mu\,\mathrm{id}$, et $X^{2} - \mu$ est simplement scindé sur $\mathbb{C}$ : $g$ est diagonalisable. Sur $E_{0}(f^{2}) = \mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$, l'induit est nul. En réunissant des bases de vecteurs propres de ces induits, on obtient une base de vecteurs propres de $f$. 
    $$\boxed{f \text{ diagonalisable} \iff f^{2} \text{ diagonalisable et } \mathrm{Ker}\, f = \mathrm{Ker}\, f^{2}}$$
     La condition sur les noyaux élimine le cas d'un nilpotent : $f = E_{12}$ vérifie $f^{2} = 0$, diagonalisable, mais $\mathrm{Ker}\, f \neq \mathrm{Ker}\, f^{2}$.

    **3.** Sur $\mathbb{R}$, le résultat de la question 1 est faux : la rotation $R$ d'angle $\frac{\pi}{2}$ de $\mathbb{R}^{2}$ est inversible, $R^{2} = -I_{2}$ est diagonalisable, et $R$ n'est pas diagonalisable sur $\mathbb{R}$. L'argument échoue car $X^{2} + 1$ n'est pas scindé sur $\mathbb{R}$ : les racines carrées d'un réel négatif ne sont pas réelles.
- id: "mp-03-28"
  feuille: "f-mp-03"
  numero: 28
  partie: "Polynômes annulateurs et réduction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, diagonalisation]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable, valeur-propre]
  source: "Réduction #2 (Prost), exercice 32 ; BibM@th, Polynômes d'endomorphismes, exercice 11"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $u \in \mathcal{L}(E)$.

    **1.** On suppose $u$ diagonalisable, de valeurs propres distinctes $\lambda_{1}, \dots, \lambda_{p}$. Montrer qu'il existe des endomorphismes $u_{1}, \dots, u_{p}$, qui sont des polynômes en $u$, tels que 
    $$P(u) = \sum_{i = 1}^{p} P(\lambda_{i})\,u_{i} \qquad\text{pour tout } P \in \mathbb{K}[X].$$

    **2.** Réciproquement, soit $\lambda_{1}, \dots, \lambda_{p}$ des scalaires deux à deux distincts et $u_{1}, \dots, u_{p}$ des endomorphismes de $E$ tels que l'égalité précédente ait lieu pour tout polynôme $P$. Montrer que $u$ est diagonalisable et que $\operatorname{Sp}(u) \subset \{\lambda_{1}, \dots, \lambda_{p}\}$.
  corrige: |
    **1.** Soit $p_{i}$ les projecteurs associés à $E = \bigoplus_{i} E_{\lambda_{i}}(u)$. Pour $P \in \mathbb{K}[X]$ et $x \in E_{\lambda_{i}}(u)$, on a $P(u)(x) = P(\lambda_{i})x$ (proposition 2), d'où, en décomposant un vecteur quelconque, $P(u) = \sum_{i} P(\lambda_{i})p_{i}$. Les $p_{i}$ sont des polynômes en $u$ : si $L_{i}$ est le polynôme de Lagrange qui vaut $1$ en $\lambda_{i}$ et $0$ aux autres $\lambda_{j}$, la formule appliquée à $L_{i}$ donne $L_{i}(u) = p_{i}$. 
    $$\boxed{u_{i} = p_{i} = L_{i}(u), \qquad P(u) = \sum_{i = 1}^{p} P(\lambda_{i})\,p_{i}}$$

    **2.** Avec $P = \prod_{i}(X - \lambda_{i})$, la formule donne $P(u) = 0$ : $u$ annule un polynôme simplement scindé, puisque les $\lambda_{i}$ sont distincts. 
    $$\boxed{u \text{ est diagonalisable}, \qquad \operatorname{Sp}(u) \subset \{\lambda_{1}, \dots, \lambda_{p}\}}$$
     La formule avec $P = L_{i}$ montre alors que $u_{i} = L_{i}(u)$ : les $u_{i}$ sont nécessairement les projecteurs spectraux, ou nuls si $\lambda_{i}$ n'est pas valeur propre. L'hypothèse « $\lambda_{i}$ distincts » est indispensable ; c'est la précision ajoutée à l'énoncé de la source.
- id: "mp-03-29"
  feuille: "f-mp-03"
  numero: 29
  partie: "Polynômes annulateurs et réduction"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [annulateurs et réduction, diagonalisation, endomorphismes qui commutent]
  noeuds: [rd-diagonalisable, rd-polynomes-endo]
  notions: [polynome-annulateur, diagonalisable]
  source: "Réduction #2 (Prost), exercice 42"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $u$, $v \in \mathcal{L}(E)$ diagonalisables tels que $u \circ v = v \circ u$.

    **1.** Montrer que $u \circ v$ et $u + v$ sont diagonalisables.

    **2.** Montrer par un exemple que la conclusion tombe en défaut sans l'hypothèse de commutation.
  corrige: |
    **1.** Le théorème 4 fournit une base dans laquelle les matrices $D$ et $D'$ de $u$ et de $v$ sont toutes deux diagonales. Dans cette base, $u \circ v$ et $u + v$ ont pour matrices $DD'$ et $D + D'$, diagonales. 
    $$\boxed{u \circ v \text{ et } u + v \text{ sont diagonalisables.}}$$

    **2.** Les matrices $U = \begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix}$ et $V = \begin{pmatrix} -1 & 0 \\ 0 & 0 \end{pmatrix}$ sont diagonalisables, la première ayant deux valeurs propres distinctes, mais $U + V = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ est nilpotente non nulle. Pour le produit, $U' = \operatorname{diag}(1, -1)$ et $V' = \begin{pmatrix} 1 & 1 \\ 0 & -1 \end{pmatrix}$ sont diagonalisables, et $U'V' = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ ne l'est pas. 
    $$\boxed{\text{Sans commutation, ni la somme ni le produit ne sont diagonalisables en général.}}$$
