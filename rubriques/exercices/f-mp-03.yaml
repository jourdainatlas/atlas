  enonce: |
    On dit que $u \in \mathcal{L}(E)$ est *cyclique* s'il existe $x_{0} \in E$ tel que $\big(x_{0}, u(x_{0}), \dots, u^{n-1}(x_{0})\big)$ soit une base de $E$.

    **1.** Soit $u$ cyclique. Montrer que $(\mathrm{id}_{E}, u, \dots, u^{n-1})$ est libre, puis que $\pi_{u} = \chi_{u}$.

    **2.** Montrer que si $u$ est cyclique, les endomorphismes qui commutent avec $u$ sont exactement les polynômes en $u$.

    **3.** On suppose $u$ diagonalisable. Montrer que $u$ est cyclique si et seulement si ses $n$ valeurs propres sont distinctes.
  corrige: |
    **1.** Si $\sum_{k < n} c_{k}u^{k} = 0$, on applique cette égalité à $x_{0}$ : la liberté de $(u^{k}(x_{0}))_{k < n}$ donne $c_{k} = 0$. Donc $\deg \pi_{u} \geqslant n$, et comme $\pi_{u} \mid \chi_{u}$ (théorème 6), 
    $$\boxed{(\mathrm{id}_{E}, u, \dots, u^{n-1}) \text{ libre}, \qquad \pi_{u} = \chi_{u}}$$

    **2.** Les polynômes en $u$ commutent avec $u$. Réciproquement, soit $v$ tel que $uv = vu$. On décompose $v(x_{0}) = \sum_{k < n} a_{k}u^{k}(x_{0}) = P(u)(x_{0})$. Pour tout $k$, 
    $$v\big(u^{k}(x_{0})\big) = u^{k}\big(v(x_{0})\big) = u^{k}P(u)(x_{0}) = P(u)\big(u^{k}(x_{0})\big).$$
     Les endomorphismes $v$ et $P(u)$ coïncident sur une base. 
    $$\boxed{\{v \mid uv = vu\} = \mathbb{K}[u], \quad \text{de dimension } n}$$

    **3.** Si $u$ est diagonalisable et cyclique, $\chi_{u} = \pi_{u}$ est simplement scindé (théorème 3) : les $n$ valeurs propres sont distinctes. Réciproquement, si $u$ a $n$ valeurs propres distinctes, de vecteurs propres $e_{1}, \dots, e_{n}$, posons $x_{0} = e_{1} + \cdots + e_{n}$. Alors $u^{k}(x_{0}) = \sum_{i} \lambda_{i}^{k}e_{i}$, et la matrice de $(x_{0}, \dots, u^{n-1}(x_{0}))$ dans la base $(e_{i})$ est la matrice de Vandermonde $(\lambda_{i}^{k})$, inversible puisque les $\lambda_{i}$ sont distincts (chapitre 17 de MPSI). 
    $$\boxed{u \text{ diagonalisable} : \quad u \text{ cyclique} \iff u \text{ a } n \text{ valeurs propres distinctes}}$$
     L'exercice 15 montre plus généralement que $u$ est cyclique dès que $\pi_{u} = \chi_{u}$, sur $\mathbb{C}$.
- id: "mp-03-39"
  feuille: "f-mp-03"
  numero: 39
  partie: "Théorème de Cayley-Hamilton"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Cayley-Hamilton]
  noeuds: [rd-cayley-hamilton]
  notions: []
  source: "Réduction #2 (Prost), exercice 34"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{C})$. Montrer l'équivalence des trois assertions :

    **1.** $\operatorname{Sp}(A) \cap \operatorname{Sp}(B) \neq \varnothing$ ;

    **2.** la matrice $\chi_{A}(B)$ n'est pas inversible ;

    **3.** il existe $C \in \mathcal{M}_{n}(\mathbb{C})$ non nulle telle que $AC = CB$.

    Pour (i) $\Rightarrow$ (iii), on pourra chercher $C$ de la forme $X\,{Y}^{T}$, avec $X$ vecteur propre de $A$ et $Y$ vecteur propre de ${B}^{T}$. Y a-t-il unicité de la matrice $C$ ?
  corrige: |
    *(i) $\Rightarrow$ (iii).* Soit $\lambda \in \operatorname{Sp}(A) \cap \operatorname{Sp}(B)$. La matrice ${B}^{T}$ a le même polynôme caractéristique que $B$, donc $\lambda$ en est valeur propre. Soit $X \neq 0$ tel que $AX = \lambda X$ et $Y \neq 0$ tel que ${B}^{T}Y = \lambda Y$, et $C = X\,{Y}^{T}$, non nulle. Alors 
    $$AC = \lambda X\,{Y}^{T}, \qquad CB = X\,{({B}^{T}Y)}^{T} = \lambda X\,{Y}^{T}.$$

    *(iii) $\Rightarrow$ (ii).* De $AC = CB$, on tire $A^{k}C = CB^{k}$ par récurrence, puis $P(A)C = CP(B)$ pour tout polynôme $P$. Avec $P = \chi_{A}$ et le théorème de Cayley-Hamilton : $0 = C\,\chi_{A}(B)$. Si $\chi_{A}(B)$ était inversible, on aurait $C = 0$.

    *(ii) $\Rightarrow$ (i).* Sur $\mathbb{C}$, $\chi_{A} = \prod_{i}(X - \lambda_{i})$, donc $\chi_{A}(B) = \prod_{i}(B - \lambda_{i}I_{n})$. Un produit de matrices inversibles est inversible : l'un des facteurs $B - \lambda_{i}I_{n}$ n'est pas inversible, et la valeur propre $\lambda_{i}$ de $A$ est valeur propre de $B$. 
    $$\boxed{\operatorname{Sp}(A) \cap \operatorname{Sp}(B) \neq \varnothing \iff \chi_{A}(B) \notin \mathrm{GL}_{n}(\mathbb{C}) \iff \exists\, C \neq 0, \ AC = CB}$$
     Il n'y a pas unicité : les solutions de $AC = CB$ forment un sous-espace vectoriel, qui contient tous les multiples de $C$. Par le théorème du rang appliqué à l'endomorphisme $C \mapsto AC - CB$ de $\mathcal{M}_{n}(\mathbb{C})$, on en déduit que l'équation $AC - CB = D$ a une unique solution pour tout $D$ exactement lorsque $A$ et $B$ n'ont pas de valeur propre commune.
- id: "mp-03-40"
  feuille: "f-mp-03"
  numero: 40
  partie: "Théorème de Cayley-Hamilton"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Cayley-Hamilton, polynôme minimal, polynômes irréductibles]
  noeuds: [rd-cayley-hamilton, rd-polynomes-endo, pol-irreductibles]
  notions: [polynome-minimal-endomorphisme]
  source: "Réduction #2 (Prost), exercice 41 ; Réduction (LLG), exercice 45 ; BibM@th, Polynômes d'endomorphismes, exercice 24"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $P$ un polynôme non constant de $\mathbb{K}[X]$ et $n \in \mathbb{N}^{*}$. On cherche s'il existe $A \in \mathcal{M}_{n}(\mathbb{K})$ telle que $P(A) = 0$.

    **1.** Traiter le cas $\mathbb{K} = \mathbb{C}$.

    **2.** Traiter le cas $\mathbb{K} = \mathbb{R}$, en distinguant selon que $P$ a ou non une racine réelle. Application : pour quels $n$ existe-t-il $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{2} + I_{n} = 0$ ?

    **3.** On prend $\mathbb{K} = \mathbb{Q}$ et $P = X^{3} - X - 1$. Montrer que $P$ n'a pas de racine rationnelle, puis qu'il est irréductible dans $\mathbb{Q}[X]$. En déduire que, si $P(A) = 0$, alors $\pi_{A} = P$, puis que $\chi_{A}$ est une puissance de $P$. Pour quels $n$ existe-t-il une telle matrice ?
  corrige: |
    **1.** Sur $\mathbb{C}$, $P$ a une racine $\lambda$, et $A = \lambda I_{n}$ convient pour tout $n$. 
    $$\boxed{\mathbb{K} = \mathbb{C} : \text{ il existe toujours une solution.}}$$

    **2.** Si $P$ a une racine réelle $r$, la matrice $rI_{n}$ convient pour tout $n$. Sinon, soit $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $P(A) = 0$ : $\pi_{A}$ divise $P$, donc n'a pas de racine réelle, et $\chi_{A}$, qui a les mêmes racines complexes (proposition 8), non plus. Un polynôme réel sans racine réelle est de degré pair : $n$ est pair. Réciproquement, si $n = 2m$, $P$ a un facteur irréductible $Q = X^{2} + bX + c$, et la matrice diagonale par blocs formée de $m$ copies de la matrice compagnon $\begin{pmatrix} 0 & -c \\ 1 & -b \end{pmatrix}$ est annulée par $Q$ (théorème 6), donc par $P$. 
    $$\boxed{\mathbb{K} = \mathbb{R} : \text{ solution pour tout } n \text{ si } P \text{ a une racine réelle, pour } n \text{ pair seulement sinon.}}$$
     Pour $P = X^{2} + 1$, il existe $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $A^{2} = -I_{n}$ si et seulement si $n$ est pair.

    **3.** Une racine rationnelle $\frac{p}{q}$ de $X^{3} - X - 1$, écrite sous forme irréductible, vérifierait $p^{3} - pq^{2} - q^{3} = 0$, donc $p \mid q^{3}$ et $q \mid p^{3}$, d'où $p = \pm 1$ et $q = 1$ ; or $P(1) = P(-1) = -1$. Sans racine rationnelle, le polynôme $P$, de degré $3$, est irréductible dans $\mathbb{Q}[X]$ : une factorisation non triviale ferait apparaître un facteur de degré $1$. Si $P(A) = 0$, le polynôme minimal $\pi_{A}$, diviseur unitaire non constant de $P$, est égal à $P$. Soit $F$ un facteur irréductible unitaire de $\chi_{A}$ dans $\mathbb{Q}[X]$ ; une racine complexe de $F$ est racine de $\pi_{A} = P$ (proposition 8), donc $F \wedge P \neq 1$, et comme $P$ est irréductible, $P \mid F$, puis $F = P$. 
    $$\boxed{\chi_{A} = P^{n/3} : \text{ une solution existe si et seulement si } 3 \mid n.}$$
     Pour $n = 3k$, la matrice diagonale par blocs formée de $k$ copies de la matrice compagnon de $P$ convient. Le corps de base compte : la même équation a des solutions de toute taille sur $\mathbb{R}$, où $P$ a une racine réelle.
