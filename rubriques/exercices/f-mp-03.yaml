  noeuds: [rd-diagonalisable, a-groupe]
  notions: [diagonalisable]
  source: "Réduction #2 (Prost), exercice 45"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    Soit $G$ un sous-groupe fini de $\mathrm{GL}_{n}(\mathbb{R})$, de cardinal $m$, et $F = \sum_{g \in G} g$.

    **1.** Donner un exemple de tel sous-groupe, de cardinal au moins $3$.

    **2.** Montrer que $F^{2} = mF$. En déduire que $F$ est diagonalisable et que $\operatorname{Sp}(F) \subset \{0, m\}$.

    **3.** Montrer que $\mathrm{Im}\, F = E_{m}(F)$ est l'ensemble des vecteurs $x$ tels que $gx = x$ pour tout $g \in G$.

    **4.** En déduire que la dimension de cet espace de vecteurs fixes est $\frac{1}{m}\sum_{g \in G} \operatorname{tr} g$.
  corrige: |
    **1.** Le groupe $\{I_{2}, R, R^{2}\}$, avec $R$ la matrice de la rotation d'angle $\frac{2\pi}{3}$, convient ($m = 3$) ; de même le groupe des $n!$ matrices de permutation de $\mathcal{M}_{n}(\mathbb{R})$.

    **2.** Pour $g \in G$, l'application $h \mapsto gh$ est une bijection de $G$ (chapitre 1, section 1.2), donc $gF = \sum_{h} gh = F$, et $F^{2} = \sum_{g} gF = mF$. Le polynôme $X(X - m)$ annule $F$ et est simplement scindé. 
    $$\boxed{F^{2} = mF, \qquad F \text{ diagonalisable}, \qquad \operatorname{Sp}(F) \subset \{0, m\}}$$

    **3.** L'endomorphisme $\frac{1}{m}F$ est un projecteur, d'image $E_{m}(F)$, d'où $\mathrm{Im}\, F = E_{m}(F)$. Si $x = F(y)$, alors $gx = gF(y) = F(y) = x$ pour tout $g$. Réciproquement, si $gx = x$ pour tout $g$, alors $Fx = mx$. 
    $$\boxed{\mathrm{Im}\, F = E_{m}(F) = \{x \mid gx = x \text{ pour tout } g \in G\}}$$

    **4.** La trace du projecteur $\frac{1}{m}F$ est son rang, c'est-à-dire la dimension de l'espace des vecteurs fixes, et $\operatorname{tr} F = \sum_{g} \operatorname{tr} g$. 
    $$\boxed{\dim\{x \mid \forall g, \ gx = x\} = \frac{1}{m}\sum_{g \in G}\operatorname{tr} g}$$
     Pour le groupe des rotations d'ordre $3$, on trouve $\frac{1}{3}(2 - 1 - 1) = 0$ : seul le vecteur nul est fixé par toutes les rotations. Pour les matrices de permutation de taille $3$, on trouve $\frac{1}{6}(3 + 3 \times 1 + 2 \times 0) = 1$ : les vecteurs fixes sont les multiples de ${(1, 1, 1)}^{T}$. Cette formule de moyenne est le point de départ de la théorie des représentations des groupes finis.
