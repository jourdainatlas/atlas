  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$, et $\varphi$, $\psi$ les endomorphismes de $\mathcal{M}_{n}(\mathbb{R})$ définis par $\varphi(M) = AM$ et $\psi(M) = MA$.

    **1.** Pour $P \in \mathbb{R}[X]$, calculer $P(\varphi)(M)$ et $P(\psi)(M)$. En déduire que $\pi_{\varphi} = \pi_{\psi} = \pi_{A}$.

    **2.** En déduire que $\varphi$ et $\psi$ sont diagonalisables si et seulement si $A$ l'est. Comparer avec la méthode de l'exercice 32 de la feuille du chapitre 2.
  corrige: |
    **1.** Par récurrence, $\varphi^{k}(M) = A^{k}M$ et $\psi^{k}(M) = MA^{k}$, d'où, par linéarité, 
    $$P(\varphi)(M) = P(A)\,M, \qquad P(\psi)(M) = M\,P(A).$$
     Si $P(A) = 0$, alors $P(\varphi) = P(\psi) = 0$. Réciproquement, si $P(\varphi) = 0$, on prend $M = I_{n}$ et l'on obtient $P(A) = 0$ ; de même pour $\psi$. Les trois endomorphismes ont les mêmes polynômes annulateurs. 
    $$\boxed{\pi_{\varphi} = \pi_{\psi} = \pi_{A}}$$

    **2.** Par le théorème 3, la diagonalisabilité se lit sur le polynôme minimal, qui est le même pour les trois. 
    $$\boxed{\varphi \text{ diagonalisable} \iff \psi \text{ diagonalisable} \iff A \text{ diagonalisable}}$$
     L'exercice 32 du chapitre 2 obtenait ce résultat pour $\varphi$ en écrivant sa matrice par blocs et en comparant les dimensions des sous-espaces propres ; le polynôme minimal donne la conclusion en deux lignes, et pour $\psi$ sans calcul supplémentaire.
- id: "mp-03-09"
