  enonce: |
    Soit $A$, $N \in \mathcal{M}_{n}(\mathbb{C})$, avec $N$ nilpotente et $AN = NA$. Montrer que $\det(A + N) = \det A$. On distinguera les cas $A$ inversible et $A$ non inversible.
  corrige: |
    *Cas $A$ inversible.* L'inverse $A^{-1}$ est un polynôme en $A$ (proposition 4), donc commute avec $N$, et $(A^{-1}N)^{n} = A^{-n}N^{n} = 0$ : la matrice $A^{-1}N$ est nilpotente. Ses valeurs propres sont nulles, celles de $I_{n} + A^{-1}N$ valent toutes $1$ (exercice 44 de la feuille du chapitre 2), et $\det(I_{n} + A^{-1}N) = 1$. Ainsi 
    $$\det(A + N) = \det A \cdot \det(I_{n} + A^{-1}N) = \det A.$$

    *Cas $A$ non inversible.* Le sous-espace $\mathrm{Ker}\, A \neq \{0\}$ est stable par $N$, qui commute avec $A$. L'endomorphisme induit par $N$ y est nilpotent, donc non injectif : il existe $x \neq 0$ tel que $Ax = 0$ et $Nx = 0$. Alors $(A + N)x = 0$, et $\det(A + N) = 0 = \det A$. 
    $$\boxed{\det(A + N) = \det A}$$
     *Piège.* La commutation est indispensable : $A = E_{21}$ et $N = E_{12}$ donnent $\det A = 0$ et $\det(A + N) = -1$.
- id: "mp-03-45"
  feuille: "f-mp-03"
