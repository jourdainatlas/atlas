  source: "Réduction #2 (Prost), exercice 17 ; Réduction (LLG), exercice 58"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension $n$ et $f \in \mathcal{L}(E)$ dont le polynôme minimal $\pi_{f}$ est irréductible de degré $2$ dans $\mathbb{R}[X]$. Montrer que $n$ est pair et que $\chi_{f} = \pi_{f}^{n/2}$. Comparer avec l'exercice 35 de la feuille du chapitre 2.
  corrige: |
    Le polynôme $\pi_{f}$, irréductible de degré $2$ dans $\mathbb{R}[X]$, a deux racines complexes conjuguées non réelles $a$ et $\bar{a}$. Par la proposition 8, ce sont les seules racines complexes de $\chi_{f}$. Comme $\chi_{f}$ est réel, $a$ et $\bar{a}$ y ont la même multiplicité $m$ ; le degré donne $n = 2m$. 
    $$\boxed{n = 2m \text{ est pair}, \qquad \chi_{f} = \big((X - a)(X - \bar{a})\big)^{m} = \pi_{f}^{n/2}}$$
     Pour $\pi_{f} = X^{2} + 1$, c'est-à-dire $f^{2} = -\mathrm{id}_{E}$, on retrouve la parité de la dimension obtenue à l'exercice 35 du chapitre 2 par le déterminant. Cet exercice obtenait aussi une forme réduite par blocs $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ ; l'argument des plans $\mathrm{Vect}(x, f(x))$ s'adapte mot pour mot à tout $\pi_{f}$ irréductible de degré $2$, avec des blocs égaux à la matrice compagnon de $\pi_{f}$.
