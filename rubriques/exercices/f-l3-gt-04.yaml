  enonce: |
    **Deux surfaces qui ne sont pas des sphères.**

    **1.** Montrer que $\mathcal{P}^{n}$ est homéomorphe au quotient de $D^{n}$ obtenu en identifiant les points diamétralement opposés de son bord $\mathbb{S}^{n-1}$.

    **2.** Montrer que $\phi : \mathcal{P}^{1} \to \mathcal{P}^{2}$, $[x_{1} : x_{2}] \mapsto [x_{1} : x_{2} : 0]$, est un homéomorphisme sur son image, et que $\mathcal{P}^{2} \setminus \phi(\mathcal{P}^{1})$ est connexe. En déduire que $\mathcal{P}^{2}$ n'est pas homéomorphe à $\mathbb{S}^{2}$.

    **3.** Montrer de même que le tore $T^{2}$ n'est pas homéomorphe à $\mathbb{S}^{2}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'application $x \mapsto \big(x, \sqrt{1 - \lVert x \rVert^{2}}\big)$ envoie $D^{n}$ sur l'hémisphère nord fermé de $\mathbb{S}^{n}$ ; composée avec la projection $\mathbb{S}^{n} \to \mathcal{P}^{n} = \mathbb{S}^{n}/\{\pm 1\}$ (cours, prop. 14), elle donne une application continue $D^{n} \to \mathcal{P}^{n}$. Elle est surjective, car toute paire $\{\pm y\}$ a un point dans l'hémisphère nord fermé. Deux points de l'hémisphère ouvert ne sont jamais opposés ; deux points de l'équateur ont même image si et seulement s'ils sont opposés. Les fibres sont donc les classes de la relation de l'énoncé, et l'on conclut par la proposition 4 du chapitre 3, $\mathcal{P}^{n}$ étant séparé.

    **2.** L'application $(x_{1}, x_{2}) \mapsto (x_{1}, x_{2}, 0)$ de $\mathbb{R}^{2} \setminus \{0\}$ dans $\mathbb{R}^{3} \setminus \{0\}$ respecte la colinéarité, donc induit $\phi$ continue et injective. Comme $\mathcal{P}^{1}$ est compact et $\mathcal{P}^{2}$ séparé, $\phi$ est un homéomorphisme sur son image (chapitre 2, th. 4). Le complémentaire $\mathcal{P}^{2} \setminus \phi(\mathcal{P}^{1})$ est l'ensemble des $[x_{1} : x_{2} : x_{3}]$ avec $x_{3} \neq 0$ : c'est la carte affine $[x : y : 1]$, homéomorphe à $\mathbb{R}^{2}$, donc connexe.

    Si $\mathcal{P}^{2}$ était homéomorphe à $\mathbb{S}^{2}$, l'image de $\phi(\mathcal{P}^{1}) \simeq \mathcal{P}^{1} \simeq \mathbb{S}^{1}$ serait une partie de $\mathbb{S}^{2}$ homéomorphe à un cercle, de complémentaire connexe ; le théorème de Jordan l'interdit. *$\mathcal{P}^{2}$ n'est pas homéomorphe à $\mathbb{S}^{2}$.* Le chapitre 6 en donnera une autre preuve, par le groupe fondamental.

    ![Figure](documents/figures/c89aa5491785b109.svg)

    Le plan projectif comme disque dont les points opposés du bord sont identifiés (paires reliées en orange). Le bord devient la droite $\phi(\mathcal{P}^{1})$ (en rouge), et son complémentaire, l'intérieur du disque, est d'un seul tenant : une droite ne sépare pas le plan projectif.

    **3.** Dans $T^{2} = \mathbb{R}^{2}/\mathbb{Z}^{2}$, l'image du segment $\{0\} \times [0, 1]$ est un cercle $K$ (un méridien). Son complémentaire est l'image de $]0, 1[ \times \mathbb{R}$, connexe comme image d'un connexe. Si $T^{2}$ était homéomorphe à $\mathbb{S}^{2}$, on obtiendrait dans $\mathbb{S}^{2}$ un cercle de complémentaire connexe, ce que le théorème de Jordan interdit.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-12"
  feuille: "f-l3-gt-04"
  numero: 12
  partie: "Actions de groupes et quotients"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [actions de groupes]
  noeuds: [gt-quotient, rv-tore, rv-projectif]
  notions: [action-groupe, espace-projectif-reel]
  source: "devoir maison, exercice 2"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Tores d'applications.** Soient $M$ et $N$ deux variétés et $\Gamma$ un groupe agissant sur $M$ et sur $N$ ; on suppose l'action sur $M$ propre et libre (exercice 9).

    **1.** Montrer que l'action diagonale de $\Gamma$ sur $M \times N$, $g \cdot (x, y) = (g \cdot x, g \cdot y)$, est propre et libre.

    **2.** Soit $\Phi \in \operatorname{Homeo}(N)$. Montrer que le quotient $T_{\Phi}$ de $\mathbb{R} \times N$ par l'action de $\mathbb{Z}$ définie par $k \cdot (t, x) = (t + k, \Phi^{k}(x))$ est une variété, homéomorphe au quotient de $[0, 1] \times N$ par la relation qui identifie $(1, x)$ à $\big(0, \Phi^{-1}(x)\big)$.

    **3.** Identifier $T_{\Phi}$ lorsque $N = \mathbb{S}^{1} \subset \mathbb{C}$ et $\Phi$ est l'identité, l'application $z \mapsto -z$, ou la conjugaison $z \mapsto \bar{z}$.

    **4.** On suppose $N$ compacte. Deux homéomorphismes $\Phi$ et $\Phi'$ de $N$ sont *isotopes* s'il existe une application continue $H : [0, 1] \times N \to N$ telle que chaque $H_{t} = H(t, \cdot)$ soit un homéomorphisme, $H_{0} = \Phi$ et $H_{1} = \Phi'$. Montrer qu'alors $T_{\Phi}$ et $T_{\Phi'}$ sont homéomorphes.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'action diagonale est libre, puisque $g \cdot x = x$ impose déjà $g = e$. Soit $K$ un compact de $M \times N$ ; ses projections $K_{1}$ et $K_{2}$ sont compactes et $K \subset K_{1} \times K_{2}$. Si $g(K) \cap K \neq \varnothing$, alors $g(K_{1}) \cap K_{1} \neq \varnothing$, ce qui n'arrive que pour un nombre fini de $g$. L'action est propre.

    **2.** Le groupe $\mathbb{Z}$ agit proprement et librement sur $\mathbb{R}$ par translations (exercice 10), et sur $N$ par $k \mapsto \Phi^{k}$. Par la question 1, l'exercice 9 et le théorème 2 du cours, $T_{\Phi}$ est une variété, de dimension $1 + \dim N$.

    L'application $[0, 1] \times N \to T_{\Phi}$ induite par l'inclusion est continue et surjective, puisque toute orbite rencontre $[0, 1] \times N$ ; elle identifie exactement $(1, x)$ à $(-1) \cdot (1, x) = \big(0, \Phi^{-1}(x)\big)$. Elle induit une bijection continue $\beta$ du quotient $Q$ de l'énoncé sur $T_{\Phi}$. Construisons la réciproque : sur $[k, k + 1] \times N$, posons $\gamma(t, x) = \big[t - k, \Phi^{-k}(x)\big] \in Q$. En $t = k + 1$, les deux définitions donnent $[1, \Phi^{-k}x]$ et $[0, \Phi^{-k-1}x]$, qui sont égaux dans $Q$ ; les bandes formant un recouvrement fermé localement fini, $\gamma$ est continue sur $\mathbb{R} \times N$. Elle est constante sur les orbites, car $(t + 1, \Phi x)$ a même image que $(t, x)$, et induit donc $T_{\Phi} \to Q$ continue, réciproque de $\beta$.

    ![Figure](documents/figures/f608e70459cc45d8.svg)

    Le tore d'application $T_{\Phi}$ : le cylindre $[0, 1] \times N$ dont on recolle les deux extrémités en tordant par $\Phi$. Sans torsion, on obtient le produit $\mathbb{S}^{1} \times N$.

    **3.** Pour $\Phi = \mathrm{id}$, $T_{\Phi} = (\mathbb{R}/\mathbb{Z}) \times N$ est le tore $\mathbb{S}^{1} \times \mathbb{S}^{1}$. Pour $\Phi(z) = -z$, qui est la rotation d'angle $\pi$ et se relie à l'identité par les rotations $z \mapsto \mathrm{e}^{\mathrm{i}\pi s}z$, on obtient encore un tore, par la question 4 ; concrètement, $(t, \mathrm{e}^{\mathrm{i}\alpha}) \mapsto (\mathrm{e}^{2\mathrm{i}\pi t}, \mathrm{e}^{\mathrm{i}(\alpha - \pi t)})$ passe au quotient et fournit l'homéomorphisme. Pour la conjugaison, le recollement $(1, \mathrm{e}^{\mathrm{i}\alpha}) \sim (0, \mathrm{e}^{-\mathrm{i}\alpha})$ retourne le cercle : en paramétrant $\mathbb{S}^{1}$ par $\alpha \in [0, 2\pi]$, on reconnaît le carré dont deux côtés opposés sont recollés directement et les deux autres en sens contraires, c'est-à-dire *la bouteille de Klein.* L'erreur la plus répandue est de croire que $-\mathrm{id}$ retourne le cercle : sur $\mathbb{S}^{1}$, c'est une rotation, et elle donne le même tore d'application que l'identité.

    **4.** Posons $G_{t} = H_{t} \circ \Phi^{-1}$, de sorte que $G_{0} = \mathrm{id}$ et $G_{1} = \Phi' \circ \Phi^{-1}$, et $F(t, x) = \big(t, G_{t}(x)\big)$ sur $[0, 1] \times N$. L'application $F$ est continue et bijective, chaque $G_{t}$ étant bijectif ; comme $[0, 1] \times N$ est compact, c'est un homéomorphisme. Elle respecte les recollements : $(1, x) \sim \big(0, \Phi^{-1}(x)\big)$ est envoyé sur $\big(1, \Phi'\Phi^{-1}(x)\big)$ et $\big(0, \Phi^{-1}(x)\big)$, qui sont identifiés dans $T_{\Phi'}$ puisque $\Phi'^{-1}\big(\Phi'\Phi^{-1}(x)\big) = \Phi^{-1}(x)$. Ainsi $F$ et $F^{-1}$ passent aux quotients (chapitre 3, th. 1) : $T_{\Phi} \simeq T_{\Phi'}$. La compacité de $N$ sert à garantir la continuité de $(t, y) \mapsto G_{t}^{-1}(y)$.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-13"
  feuille: "f-l3-gt-04"
  numero: 13
  partie: "Actions de groupes et quotients"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [actions de groupes]
  noeuds: [gt-quotient, rv-tore, rv-projectif]
  notions: [action-groupe, espace-projectif-reel]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Sous-groupes discrets.** Soient $G$ un groupe topologique séparé (chapitre 3, exercice 4), $H$ un sous-groupe *discret* de $G$, c'est-à-dire discret pour la topologie induite, et $q : G \to G/H$ la projection sur l'espace des classes $gH$.

    **1.** Montrer qu'il existe des voisinages ouverts $W$ et $V$ de $e$ tels que $W \cap H = \{e\}$, $V = V^{-1}$ et $VV^{-1} \subset W$, et que les parties $hV$, $h \in H$, sont deux à deux disjointes.

    **2.** Montrer que $H$ est fermé dans $G$. En déduire que $G/H$ est séparé.

    **3.** On suppose $H$ distingué et $G$ connexe. Montrer que tout élément de $H$ commute avec tout élément de $G$, et que $H$ est commutatif. Le résultat subsiste-t-il sans l'hypothèse « $H$ distingué » ?

    **4.** Montrer que $q$ est un revêtement. On pourra considérer $U = q(V)$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Comme $H$ est discret, il existe un ouvert $W \ni e$ avec $W \cap H = \{e\}$. L'application $(a, b) \mapsto ab^{-1}$ est continue et vaut $e$ en $(e, e)$ : il existe un ouvert $V_{1} \ni e$ avec $V_{1}V_{1}^{-1} \subset W$, et $V = V_{1} \cap V_{1}^{-1}$ convient. Si $hv = h'v'$ avec $h, h' \in H$ et $v, v' \in V$, alors $h'^{-1}h = v'v^{-1} \in H \cap VV^{-1} \subset H \cap W = \{e\}$, donc $h = h'$.

    **2.** Soit $g \in \overline{H}$. Si $gV$ contenait deux éléments $h = gv$ et $h' = gv'$ de $H$, on aurait
    $$h^{-1}h' = v^{-1}v' \in H \cap VV^{-1} = \{e\} ,$$
    puisque $V^{-1} = V$ : $gV$ contient au plus un point $h$ de $H$. Comme $gV$ est un voisinage de $g$ et $g \in \overline{H}$, il en contient au moins un. Si l'on avait $g \neq h$, un voisinage $O$ de $g$ ne contenant pas $h$ (séparation) donnerait un voisinage $O \cap gV$ de $g$ sans point de $H$ : contradiction. Donc $g = h \in H$, et $H$ est fermé. Par l'exercice 4 du chapitre 3, $G/H$ est séparé.

    **3.** Fixons $h \in H$. L'application $g \mapsto ghg^{-1}$ est continue sur $G$ et, $H$ étant distingué, à valeurs dans l'espace discret $H$ : elle est constante sur le connexe $G$, égale à sa valeur $h$ en $e$. Ainsi $ghg^{-1} = h$ pour tout $g$ : $H$ est contenu dans le centre de $G$, et en particulier commutatif.

    L'hypothèse « distingué » est indispensable. Dans le groupe connexe
    $$G = \{x \mapsto ax + b \mid a > 0, \; b \in \mathbb{R}\} ,$$
    homéomorphe à $]0, +\infty[ \times \mathbb{R}$, le sous-groupe $H = \{x \mapsto 2^{k}x\}$ est discret, mais l'homothétie $x \mapsto 2x$ ne commute pas avec la translation $x \mapsto x + 1$.

    **4.** Par l'exercice 4 du chapitre 3, $q$ est continue, ouverte et surjective ; $U = q(V)$ est un ouvert contenant $[e]$, et 
    $$q^{-1}(U) = VH = \bigcup_{h \in H}Vh .$$
     Les ouverts $Vh$ sont deux à deux disjoints, par le même calcul qu'à la question 1 : $vh = v'h'$ donne $v'^{-1}v = h'h^{-1} \in VV^{-1} \cap H = \{e\}$. La restriction de $q$ à $Vh$ est surjective sur $U$, car $q(vh) = q(v)$, et injective : $q(vh) = q(v'h)$ signifie $v'h \in vhH = vH$, donc $v^{-1}v' \in H \cap VV^{-1} = \{e\}$. Continue, ouverte et bijective, elle est un homéomorphisme de $Vh$ sur $U$. Pour une classe $[g]$, on transporte par la translation $x \mapsto gx$, qui passe au quotient en un homéomorphisme de $G/H$ : $gU$ est un voisinage de $[g]$ de même nature. *$q$ est un revêtement.* Cette question n'utilise pas que $H$ est distingué. Exemples : $\mathbb{R} \to \mathbb{R}/\mathbb{Z} = \mathbb{S}^{1}$, $\mathbb{R}^{n} \to T^{n}$.

    ![Figure](documents/figures/fe206b72968e98ed.svg)

    Pour $G = \mathbb{R}^{2}$ et $H = \mathbb{Z}^{2}$ (points bleus) : le voisinage $W$ de $0$ ne contient pas d'autre point du réseau, et les translatés $h + V$ (en orange) sont deux à deux disjoints. Chacun est envoyé homéomorphiquement sur le même ouvert du tore : c'est la structure de revêtement.

