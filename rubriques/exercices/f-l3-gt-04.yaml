  enonce: |
    **Le tore de dimension $n$.**

    **1.** Prouver que l'action de $\mathbb{Z}^{n}$ sur $\mathbb{R}^{n}$ par translations est propre et libre.

    **2.** En déduire que $T^{n} = \mathbb{R}^{n}/\mathbb{Z}^{n}$ est une variété compacte de dimension $n$.

    **3.** Montrer que $T^{n}$ est homéomorphe à $\mathbb{S}^{1} \times \dots \times \mathbb{S}^{1}$ ($n$ facteurs).

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'action est libre : $x + k = x$ impose $k = 0$. Si $K$ est compact, il est contenu dans une boule $\bar{B}(0, R)$, et $(K + k) \cap K \neq \varnothing$ impose $\lVert k \rVert \leq 2R$, ce qui ne laisse qu'un nombre fini de $k$.

    **2.** Par l'exercice 9 et le théorème 2 du cours, $T^{n}$ est une $n$-variété. Elle est compacte, image du compact $[0, 1]^{n}$ par la projection.

    **3.** L'application $x \mapsto (\mathrm{e}^{2\mathrm{i}\pi x_{1}}, \dots, \mathrm{e}^{2\mathrm{i}\pi x_{n}})$ est continue et surjective de $\mathbb{R}^{n}$ sur $(\mathbb{S}^{1})^{n}$, et ses fibres sont les orbites de $\mathbb{Z}^{n}$. Elle induit une bijection continue du compact $T^{n}$ sur le séparé $(\mathbb{S}^{1})^{n}$, qui est un homéomorphisme (chapitre 3, prop. 4).

    0@10@ii@ii-@>@ii@ii>@-\@M
