  source: "Bordeaux 2016, feuille 5, exercice 6"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **L'exponentielle complexe.**

    **1.** Soit $\Gamma_{a}$ le groupe des translations $z \mapsto z + 2\mathrm{i}\pi k$, $k \in \mathbb{Z}$, de $\mathbb{C}$. Montrer que $\mathbb{C}/\Gamma_{a}$ est une variété homéomorphe à $\mathbb{C}^{*}$, et en déduire que $\exp : \mathbb{C} \to \mathbb{C}^{*}$ est un revêtement.

    **2.** Soit $n \geq 1$ et $\Gamma_{b}$ le groupe des rotations $z \mapsto \mathrm{e}^{2\mathrm{i}\pi k/n}z$ de $\mathbb{S}^{1}$. Montrer que $\mathbb{S}^{1}/\Gamma_{b}$ est homéomorphe à $\mathbb{S}^{1}$.
  corrige: |
    **1.** Le groupe $\Gamma_{a}$ agit par isométries de $\mathbb{C}$, avec des orbites fermées et $c_{z} = 2\pi$ : par la proposition 12 et le théorème 2 du cours, l'action est totalement discontinue et séparante, $\mathbb{C}/\Gamma_{a}$ est une $2$-variété et la projection $\mathbb{C} \to \mathbb{C}/\Gamma_{a}$ est un revêtement. L'exponentielle est continue, surjective sur $\mathbb{C}^{*}$, et ouverte : localement, elle admet une réciproque continue, une détermination du logarithme. Ses fibres sont les orbites de $\Gamma_{a}$, puisque $\mathrm{e}^{z} = \mathrm{e}^{w}$ équivaut à $w - z \in 2\mathrm{i}\pi\mathbb{Z}$. Par la proposition 3 du chapitre 3, elle induit un homéomorphisme $\bar{e} : \mathbb{C}/\Gamma_{a} \to \mathbb{C}^{*}$, et $\exp = \bar{e} \circ \pi$ est un revêtement, composé d'un revêtement et d'un homéomorphisme.

    **2.** L'application $z \mapsto z^{n}$ est continue et surjective de $\mathbb{S}^{1}$ sur $\mathbb{S}^{1}$, et $z^{n} = w^{n}$ si et seulement si $w = \mathrm{e}^{2\mathrm{i}\pi k/n}z$ : ses fibres sont les orbites de $\Gamma_{b}$. Elle induit une bijection continue du compact $\mathbb{S}^{1}/\Gamma_{b}$ sur le séparé $\mathbb{S}^{1}$, donc un homéomorphisme.

