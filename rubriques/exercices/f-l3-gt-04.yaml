  source: "Bordeaux 2016, feuille 5, exercice 2"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Cylindre, ruban de Möbius, tore et bouteille de Klein.**

    **1.** Soient $X = \mathbb{R} \times \, ]-1, 1[$, $\tau(x, y) = (x + 1, y)$, $\Gamma = \langle\tau\rangle$ et $M = X/\Gamma$.

    **(a)** Montrer que $M$ est une variété, et la décrire.

    **(b)** Soit $\phi : M \to M$, $(x \bmod \mathbb{Z}, y) \mapsto (x + \dfrac{1}{2} \bmod \mathbb{Z}, -y)$. Vérifier que $\phi$ est un homéomorphisme, que le groupe $G = \langle\phi\rangle$ est d'ordre $2$, et décrire $M/G$.

    **2.** Soit $M = \mathbb{R}^{2}/\mathbb{Z}^{2}$ le tore et $\phi : M \to M$, $(x \bmod \mathbb{Z}, y \bmod \mathbb{Z}) \mapsto (x + \dfrac{1}{2} \bmod \mathbb{Z}, -y \bmod \mathbb{Z})$. Vérifier que $\phi$ est un homéomorphisme, déterminer le groupe $G = \langle\phi\rangle$, montrer que $M/G$ est une $2$-variété et l'identifier.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** (a) Le groupe $\Gamma \simeq \mathbb{Z}$ agit par isométries, avec des orbites fermées et une distance $c_{x} = 1$ entre un point et les autres points de son orbite : par la proposition 12 du cours, l'action est totalement discontinue et séparante, et $M$ est une $2$-variété (th. 2). L'application $(x, y) \mapsto (\mathrm{e}^{2\mathrm{i}\pi x}, y)$ est continue, ouverte, surjective sur $\mathbb{S}^{1} \times \, ]-1, 1[$, de fibres les orbites : *$M$ est un cylindre ouvert.*

    (b) $\phi$ est bien définie, car remplacer $x$ par $x + 1$ ne change pas la classe de $x + \dfrac{1}{2}$. Elle est induite par l'homéomorphisme $\tilde{\phi}(x, y) = (x + \dfrac{1}{2}, -y)$ de $X$, qui commute avec $\tau$ ; c'est donc un homéomorphisme de $M$. On a $\phi^{2} = \mathrm{id}$, puisque $\tilde{\phi}^{2} = \tau$, et $\phi \neq \mathrm{id}$ : $G \simeq \mathbb{Z}/2\mathbb{Z}$. L'action est libre, car $x + \dfrac{1}{2} \equiv x \pmod{1}$ est impossible ; $G$ étant fini, $M/G$ est une variété. Enfin $M/G = X/\langle\tilde{\phi}\rangle$, de domaine fondamental la bande $[0, \dfrac{1}{2}] \times \, ]-1, 1[$ dont les bords sont recollés par $(0, y) \sim (\dfrac{1}{2}, -y)$ : *$M/G$ est un ruban de Möbius ouvert.*

    **2.** De même, $\phi$ est bien définie sur le tore, car $(x + m + \dfrac{1}{2}, -y - n)$ est congru à $(x + \dfrac{1}{2}, -y)$ ; c'est un homéomorphisme, $\phi^{2}(x, y) = (x + 1, y) = (x, y)$ dans le tore, et $\phi \neq \mathrm{id}$ : $G \simeq \mathbb{Z}/2\mathbb{Z}$. L'action est libre, $G$ est fini, donc $M/G$ est une $2$-variété, compacte comme image du tore. Elle est le quotient de $\mathbb{R}^{2}$ par le groupe engendré par $(x, y) \mapsto (x, y + 1)$ et $(x, y) \mapsto (x + \dfrac{1}{2}, -y)$, de domaine fondamental le rectangle $[0, \dfrac{1}{2}] \times [0, 1]$ : les côtés horizontaux sont recollés directement, les côtés verticaux par $(0, y) \sim (\dfrac{1}{2}, 1 - y)$, au retournement près. *$M/G$ est la bouteille de Klein,* décrite au chapitre 3 comme quotient du carré.

    ![Figure](documents/figures/1838c0158bdbace6.svg)

    La bande $X$ et le domaine fondamental de $\langle\tilde{\phi}\rangle$ (en orange) : ses bords sont recollés en sens contraires (flèches), d'où le ruban de Möbius. Un point $m$, son image par $\tilde{\phi}$ et son image par $\tilde{\phi}^{2} = \tau$ montrent le retournement à chaque demi-pas.

    0@10@ii@ii-@>@ii@ii>@-\@M
