  enonce: |
    **Le plan épointé modulo $\pm 1$.** Soient $X = \mathbb{R}^{2} \setminus \{0\}$ et $G$ le groupe engendré par $x \mapsto -x$.

    **1.** Quel est le cardinal de $G$ ?

    **2.** Montrer que $X/G$ est une variété, homéomorphe à $X$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** $G = \{\mathrm{id}, -\mathrm{id}\}$ a deux éléments.

    **2.** L'action est libre, car $-x = x$ impose $x = 0$, et $G$ est fini : par la proposition 11 et le théorème 2 du cours, $X/G$ est une $2$-variété. Identifions $X$ à $\mathbb{C}^{*}$. L'application $z \mapsto z^{2}$ est continue, surjective, ouverte (c'est un revêtement, cours, prop. 8 et 9), et $z^{2} = w^{2}$ si et seulement si $w = \pm z$ : ses fibres sont les orbites. Par la proposition 3 du chapitre 3, elle induit un homéomorphisme $X/G \simeq \mathbb{C}^{*} = X$.

    0@10@ii@ii-@>@ii@ii>@-\@M
