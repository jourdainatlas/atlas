  enonce: |
    **Revêtements et homéomorphismes locaux.** Une application continue $p : E \to B$ est un *homéomorphisme local* si tout point de $E$ a un voisinage ouvert $U$ tel que $p(U)$ soit ouvert et que $p$ induise un homéomorphisme de $U$ sur $p(U)$.

    **1.** Soient $p : E \to B$ un revêtement et $B'$ une partie de $B$. Montrer que $p$ induit un revêtement de $E' = p^{-1}(B')$ sur $B'$.

    **2.** Montrer qu'un homéomorphisme local est une application ouverte, et que ses fibres $p^{-1}(b)$, munies de la topologie induite, sont discrètes.

    **3.** Soit $p : \, ]0, +\infty[ \, \to \mathbb{S}^{1}$, $p(t) = \mathrm{e}^{2\mathrm{i}\pi t}$. Montrer que $p$ est un homéomorphisme local surjectif dont toutes les fibres sont dénombrables infinies, mais que ce n'est pas un revêtement.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** La restriction $p' : E' \to B'$ est continue et surjective. Soient $b \in B'$ et $U$ un voisinage ouvert de $b$ dans $B$ tel que $p^{-1}(U) = \mathop{\displaystyle \bigsqcup_{i}}U_{i}$, chaque $U_{i}$ étant envoyé homéomorphiquement sur $U$. Alors $U' = U \cap B'$ est un voisinage ouvert de $b$ dans $B'$, et $p'^{-1}(U') = \mathop{\displaystyle \bigsqcup_{i}}\big(U_{i} \cap E'\big)$. Chaque $U_{i} \cap E' = (p|_{U_{i}})^{-1}(U')$ est envoyé homéomorphiquement sur $U'$, par restriction d'un homéomorphisme.

    **2.** Soit $O$ un ouvert de $E$. Pour $e \in O$, soit $U_{e}$ un ouvert comme dans la définition : $p(O \cap U_{e})$ est ouvert dans l'ouvert $p(U_{e})$, puisque $p|_{U_{e}}$ est un homéomorphisme, donc ouvert dans $B$. Alors $p(O) = \mathop{\displaystyle \bigcup_{e}}p(O \cap U_{e})$ est ouvert. Pour $e \in p^{-1}(b)$, $U_{e} \cap p^{-1}(b) = \{e\}$, par injectivité de $p$ sur $U_{e}$ : chaque point de la fibre y est isolé, et la fibre est discrète.

    **3.** Au voisinage de chaque $t > 0$, $p$ envoie l'intervalle $]t - \dfrac{1}{2}, t + \dfrac{1}{2}[ \, \cap \, ]0, +\infty[$ homéomorphiquement sur un arc ouvert : c'est un homéomorphisme local, surjectif, et chaque fibre $\{\theta + k \mid k \in \mathbb{N}\} \cap \, ]0, +\infty[$ est dénombrable infinie.

    Supposons que $p$ soit un revêtement, et soit $U$ un arc ouvert contenant $1$, assez petit, tel que $p^{-1}(U) = \mathop{\displaystyle \bigsqcup_{i}}U_{i}$ avec $p|_{U_{i}} : U_{i} \to U$ homéomorphisme. Chaque $U_{i}$ est connexe, comme $U$, et ouvert : les $U_{i}$ sont les composantes connexes de $p^{-1}(U)$. L'une d'elles est un intervalle $]0, a[$, avec $a < 1$ ; or $p(]0, a[)$ ne contient pas $1 = p(t)$, puisque $p(t) = 1$ exige $t$ entier. Ce morceau n'est donc pas envoyé sur $U$ : contradiction. Le cardinal constant des fibres ne suffit pas à faire un revêtement ; c'est la « feuille coupée » $]0, a[$ qui pose problème, comme dans le contre-exemple du cours.

    ![Figure](documents/figures/fb3d57a364c78423.svg)

    Au-dessus de l'arc $U$ (en bleu), les intervalles centrés sur les entiers sont envoyés homéomorphiquement sur $U$ ; le premier morceau $]0, a[$ (en orange) n'en couvre que la moitié : $p$ n'est pas un revêtement.

