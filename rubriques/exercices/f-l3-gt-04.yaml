  source: "Bordeaux 2016, feuille 4, exercice 6"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Actions propres et libres.** Soient $X$ un espace séparé et localement compact, c'est-à-dire dont tout point a un voisinage compact, et $\Gamma$ un sous-groupe de $\operatorname{Homeo}(X)$. On suppose que :

    **(a)** pour tout compact $K$ de $X$, l'ensemble $\{\gamma \in \Gamma \mid \gamma(K) \cap K \neq \varnothing\}$ est fini ;

    **(b)** pour tout $x \in X$, le stabilisateur $\{\gamma \in \Gamma \mid \gamma(x) = x\}$ est réduit à $\{\mathrm{id}\}$.

    Une telle action est dite *propre et libre*.

    **1.** Montrer qu'une action propre et libre est totalement discontinue et séparante.

    **2.** Soient $n \geq 2$, $\zeta = \mathrm{e}^{2\mathrm{i}\pi/n}$ et $q$ un entier premier avec $n$. Montrer que $k \cdot (z_{1}, z_{2}) = (\zeta^{k}z_{1}, \zeta^{kq}z_{2})$ définit une action libre de $\mathbb{Z}/n\mathbb{Z}$ sur $\mathbb{S}^{3} = \{(z_{1}, z_{2}) \in \mathbb{C}^{2} \mid |z_{1}|^{2} + |z_{2}|^{2} = 1\}$, et que le quotient est une $3$-variété.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** $\triangleright$ *Totalement discontinue.* Soient $x \in X$ et $K$ un voisinage compact de $x$. L'ensemble
    $$F = \{\gamma \neq \mathrm{id} \mid \gamma(K) \cap K \neq \varnothing\}$$
    est fini, et pour $\gamma \in F$, $\gamma(x) \neq x$ puisque l'action est libre. L'espace étant séparé, il existe des ouverts disjoints $A_{\gamma} \ni x$ et $B_{\gamma} \ni \gamma(x)$. L'ouvert 
    $$U = \mathring{K} \; \cap \bigcap_{\gamma \in F}\big(A_{\gamma} \cap \gamma^{-1}(B_{\gamma})\big)$$
     contient $x$. Pour $\gamma \in F$, $\gamma(U) \subset B_{\gamma}$ et $U \subset A_{\gamma}$ sont disjoints ; pour $\gamma \notin F \cup \{\mathrm{id}\}$, $\gamma(U) \subset \gamma(K)$ est disjoint de $K \supset U$.

    $\triangleright$ *Séparante.* Soient $x$ et $y$ d'orbites distinctes, $K_{x}$ et $K_{y}$ des voisinages compacts, $K = K_{x} \cup K_{y}$ et $F = \{\gamma \mid \gamma(K) \cap K \neq \varnothing\}$, fini. Pour $\gamma \in F$, $\gamma(x) \neq y$ ; on les sépare par des ouverts disjoints $A_{\gamma} \ni \gamma(x)$ et $B_{\gamma} \ni y$. Les ouverts $U = \mathring{K_{x}} \cap \mathop{\displaystyle \bigcap_{\gamma \in F}}\gamma^{-1}(A_{\gamma})$ et $V = \mathring{K_{y}} \cap \mathop{\displaystyle \bigcap_{\gamma \in F}}B_{\gamma}$ conviennent : $\gamma(U) \cap V = \varnothing$ pour tout $\gamma$, par le même argument.

    **2.** Si $(\zeta^{k}z_{1}, \zeta^{kq}z_{2}) = (z_{1}, z_{2})$ avec $(z_{1}, z_{2}) \neq 0$, alors $\zeta^{k} = 1$ ou $\zeta^{kq} = 1$, c'est-à-dire $n \mid k$ ou $n \mid kq$ ; comme $q$ est premier avec $n$, dans les deux cas $n \mid k$ : l'action est libre. Un groupe fini agit toujours proprement, puisque l'ensemble de la condition (a) est fini ; $\mathbb{S}^{3}$ est une $3$-variété compacte, donc localement compacte. Par la question 1 et le théorème 2 du cours, le quotient est une $3$-variété : c'est l'espace lenticulaire $L(n, q)$, que l'on retrouvera au chapitre 6.

    0@10@ii@ii-@>@ii@ii>@-\@M
