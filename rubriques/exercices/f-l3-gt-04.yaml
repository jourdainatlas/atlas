  enonce: |
    **Grassmanniennes.** Pour $0 \leq k \leq n$, on note $\mathrm{Gr}_{k}(\mathbb{R}^{n})$ l'ensemble des sous-espaces vectoriels de dimension $k$ de $\mathbb{R}^{n}$. On l'identifie à une partie de $\mathcal{M}_{n}(\mathbb{R})$ en associant à chaque sous-espace $F$ la matrice $p_{F}$ du projecteur orthogonal sur $F$, et on le munit de la topologie induite.

    **1.** Montrer que $\mathrm{Gr}_{k}(\mathbb{R}^{n}) = \{p \in \mathcal{M}_{n}(\mathbb{R}) \mid p^{2} = p, \; {p}^{T} = p, \; \mathrm{tr}\,p = k\}$, et que c'est un compact.

    **2.** Montrer que $F \mapsto F^{\perp}$ est un homéomorphisme de $\mathrm{Gr}_{k}(\mathbb{R}^{n})$ sur $\mathrm{Gr}_{n-k}(\mathbb{R}^{n})$.

    **3.** Montrer que $\mathrm{Gr}_{1}(\mathbb{R}^{n+1})$ est homéomorphe à $\mathcal{P}^{n}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Le projecteur orthogonal $p_{F}$ vérifie $p_{F}^{2} = p_{F}$, ${p_{F}}^{T} = p_{F}$ et $\mathrm{tr}\,p_{F} = \mathrm{rg} p_{F} = k$. Réciproquement, une matrice symétrique $p$ telle que $p^{2} = p$ est le projecteur orthogonal sur son image $F$, et $\dim F = \mathrm{rg} p = \mathrm{tr}\,p$. Cet ensemble est fermé, comme intersection d'images réciproques de fermés par des applications continues, et borné, car 
    $$\sum_{i, j}p_{ij}^{2} = \mathrm{tr}({p}^{T}p) = \mathrm{tr}(p^{2}) = \mathrm{tr}\,p = k .$$
     Il est donc compact (chapitre 2, th. 5).

    **2.** On a $p_{F^{\perp}} = I_{n} - p_{F}$. L'application $p \mapsto I_{n} - p$ est continue, envoie $\mathrm{Gr}_{k}(\mathbb{R}^{n})$ dans $\mathrm{Gr}_{n-k}(\mathbb{R}^{n})$ (la trace devient $n - k$) et est sa propre réciproque : c'est un homéomorphisme.

    **3.** Pour $x \in \mathbb{S}^{n}$, le projecteur orthogonal sur $\mathbb{R} x$ est $x{x}^{T}$. L'application $x \mapsto x{x}^{T}$ est continue, surjective de $\mathbb{S}^{n}$ sur $\mathrm{Gr}_{1}(\mathbb{R}^{n+1})$, et $x{x}^{T} = y{y}^{T}$ si et seulement si $y = \pm x$. Elle induit une bijection continue du compact $\mathcal{P}^{n} = \mathbb{S}^{n}/\{\pm 1\}$ sur un séparé : $\mathrm{Gr}_{1}(\mathbb{R}^{n+1}) \simeq \mathcal{P}^{n}$. On peut montrer que $\mathrm{Gr}_{k}(\mathbb{R}^{n})$ est une variété compacte de dimension $k(n - k)$, qui généralise ainsi les espaces projectifs.

