  enonce: |
    **Le fibré unitaire tangent de la sphère.** On note $T(\mathbb{S}^{2}) = \{(x, y) \in \mathbb{S}^{2} \times \mathbb{S}^{2} \mid \langle x, y \rangle = 0\}$ l'espace des vecteurs unitaires tangents à $\mathbb{S}^{2}$.

    **1.** Montrer que $T(\mathbb{S}^{2})$ est homéomorphe au groupe $\mathrm{SO}(3)$ des rotations de $\mathbb{R}^{3}$.

    **2.** Pour $v \in \mathbb{R}^{3}$ non nul de norme $\theta \leq \pi$, on note $R(v)$ la rotation d'axe dirigé par $v$ et d'angle $\theta$, et l'on pose $R(0) = I_{3}$. Montrer que $R$ est continue sur la boule fermée $\bar{B}(0, \pi)$ et surjective sur $\mathrm{SO}(3)$, et déterminer quand $R(v) = R(w)$. On admettra la formule de Rodrigues : si $v = \theta u$ avec $\lVert u \rVert = 1$, alors $R(v)x = \cos\theta\,x + \sin\theta\,u \wedge x + (1 - \cos\theta)\langle u, x \rangle u$.

    **3.** En déduire que $T(\mathbb{S}^{2})$ est homéomorphe à $\mathcal{P}^{3}$.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $(x, y) \in T(\mathbb{S}^{2})$, la matrice de colonnes $x$, $y$ et $x \wedge y$ est orthogonale et directe. L'application $(x, y) \mapsto (x \mid y \mid x \wedge y)$ est continue, de réciproque continue $A \mapsto (Ae_{1}, Ae_{2})$ : $T(\mathbb{S}^{2}) \simeq \mathrm{SO}(3)$. Choisir un vecteur unitaire tangent en un point de la sphère revient à choisir un repère orthonormé direct.

    ![Figure](documents/figures/182fb22d1594e06c.svg)

    Un point $x$ de la sphère et un vecteur unitaire $y$ tangent en $x$ déterminent le repère orthonormé direct $(x, y, x \wedge y)$, donc une rotation : c'est l'homéomorphisme $T(\mathbb{S}^{2}) \simeq \mathrm{SO}(3)$.

    **2.** Pour $v = \theta u$, la formule de Rodrigues s'écrit $R(v)x = \cos\theta\,x + \dfrac{\sin\theta}{\theta}\,v \wedge x + \dfrac{1 - \cos\theta}{\theta^{2}}\langle v, x \rangle v$. Les fonctions $\dfrac{\sin\theta}{\theta}$ et $\dfrac{1 - \cos\theta}{\theta^{2}}$ se prolongent continûment en $\theta = 0$ (par $1$ et $\dfrac{1}{2}$), et $\theta = \lVert v \rVert$ dépend continûment de $v$ : $R$ est continue sur $\bar{B}(0, \pi)$, avec $R(0) = I_{3}$. Elle est surjective : toute rotation de $\mathbb{R}^{3}$ a un axe, et un angle que l'on peut choisir dans $[0, \pi]$ quitte à changer l'orientation de l'axe (chapitre 2, exercice 8). Si $0 < \theta < \pi$, l'axe orienté et l'angle sont déterminés par la rotation ; l'angle $0$ ne correspond qu'à l'identité ; enfin, pour $\theta = \pi$, la rotation d'angle $\pi$ autour de $u$ est aussi celle autour de $-u$. *On a $R(v) = R(w)$ si et seulement si $v = w$, ou $\lVert v \rVert = \pi$ et $w = -v$.*

    **3.** Par la question 2 et la proposition 4 du chapitre 3, $\mathrm{SO}(3)$ est homéomorphe à la boule $\bar{B}(0, \pi) \simeq D^{3}$ dont les points opposés du bord sont identifiés, c'est-à-dire à $\mathcal{P}^{3}$ par l'exercice 11. Avec la question 1, *$T(\mathbb{S}^{2}) \simeq \mathrm{SO}(3) \simeq \mathcal{P}^{3}$.* Le chapitre 6 en tirera $\pi_{1}(\mathrm{SO}(3)) \simeq \mathbb{Z}/2\mathbb{Z}$.

