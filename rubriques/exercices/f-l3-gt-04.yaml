  enonce: |
    **Est-ce une variété ?**

    **1.** Une sphère avec un cheveu, $\mathbb{S}^{2} \cup \big(\{0\} \times \{0\} \times [1, 2]\big)$, est-elle une variété ?

    **2.** La réunion des deux axes de coordonnées de $\mathbb{R}^{2}$, munie de la topologie induite, est-elle une variété ?

    **3.** Soient $X$ une variété et $\Delta = \{(x, x) \mid x \in X\} \subset X \times X$. Montrer que $\Delta$ est une variété.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Non. Un point du cheveu, de cote $z \in \, ]1, 2[$, a un voisinage homéomorphe à un intervalle ouvert, donc à $\mathbb{R}$ ; un point de la sphère éloigné du cheveu a un voisinage homéomorphe à $\mathbb{R}^{2}$. Si l'espace était une $m$-variété, un ouvert de $\mathbb{R}$ et un ouvert de $\mathbb{R}^{2}$ seraient tous deux homéomorphes à des ouverts de $\mathbb{R}^{m}$, ce que le théorème 1 du cours interdit.

    **2.** Non, pour la même raison que la croix du cours (prop. 4) : un voisinage connexe assez petit de l'origine, privé de l'origine, a au moins quatre composantes connexes, alors qu'un intervalle ouvert privé d'un point en a deux. Les autres points ayant des voisinages homéomorphes à $\mathbb{R}$, la seule dimension possible serait $1$.

    **3.** L'application $x \mapsto (x, x)$ est un homéomorphisme de $X$ sur $\Delta$ (chapitre 2, exercice 9). Être séparé, à base dénombrable et localement homéomorphe à $\mathbb{R}^{m}$ sont des propriétés invariantes par homéomorphisme : $\Delta$ est une $m$-variété.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-02"
  feuille: "f-l3-gt-04"
  numero: 2
  partie: "Variétés et atlas"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variétés et atlas]
  noeuds: [t-separe, t-quotient]
  notions: [carte, atlas, cartes-compatibles]
  source: "Bordeaux 2016, feuille 4, exercice 2, question 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **L'espace des droites du plan.** Soit $\mathcal{L}$ l'ensemble des droites affines de $\mathbb{R}^{2}$.

    **1.** On note $U_{1}$ l'ensemble des droites non verticales, d'équation $y = mx + p$, et $U_{2}$ celui des droites non horizontales, d'équation $x = m'y + p'$. Montrer que les applications $D \mapsto (m, p)$ sur $U_{1}$ et $D \mapsto (m', p')$ sur $U_{2}$ forment un $C^{0}$-atlas de dimension $2$ sur $\mathcal{L}$, et que la topologie associée fait de $\mathcal{L}$ une $2$-variété.

    **2.** Toute droite s'écrit $\{x\cos\theta + y\sin\theta = d\}$ avec $\theta \in [0, \pi]$ et $d \in \mathbb{R}$. Montrer que $\mathcal{L}$ est homéomorphe au ruban de Möbius ouvert $\big([0, \pi] \times \mathbb{R}\big)/\big((0, d) \sim (\pi, -d)\big)$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Notons $\psi_{1}(D) = (m, p)$ sur $U_{1}$ et $\psi_{2}(D) = (m', p')$ sur $U_{2}$ ; ce sont des bijections sur $\mathbb{R}^{2}$. Une droite est dans $U_{1} \cap U_{2}$ si elle n'est ni verticale ni horizontale, c'est-à-dire si $m \neq 0$ : $\psi_{1}(U_{1} \cap U_{2}) = \mathbb{R}^{*} \times \mathbb{R}$, qui est ouvert, et de même pour $\psi_{2}$. Sur cet ouvert, $y = mx + p$ équivaut à $x = \dfrac{1}{m}y - \dfrac{p}{m}$, d'où le changement de cartes 
    $$\psi_{2} \circ \psi_{1}^{-1}(m, p) = \Big(\frac{1}{m}, -\frac{p}{m}\Big) ,$$
     homéomorphisme de $\mathbb{R}^{*} \times \mathbb{R}$ sur lui-même. C'est un $C^{0}$-atlas, qui définit une topologie sur $\mathcal{L}$ (cours, prop. 6) ; elle est à base dénombrable, puisque deux cartes suffisent.

    Il reste la séparation. Deux droites d'un même $U_{i}$ sont séparées dans cette carte. Sinon, l'une est horizontale, $y = p_{0}$, et l'autre verticale, $x = p'_{0}$ ; les ouverts $\{|m| < 1\} \subset U_{1}$ et $\{|m'| < 1\} \subset U_{2}$ les contiennent et sont disjoints, car $m' = \dfrac{1}{m}$ ne peut être de valeur absolue $< 1$ en même temps que $m$. *$\mathcal{L}$ est une $2$-variété.*

    **2.** Écrivons le ruban de Möbius ouvert comme le quotient $M_{0}$ de $\mathbb{R}^{2}$ par l'action de $\mathbb{Z}$ définie par $k \cdot (\theta, d) = \big(\theta + k\pi, (-1)^{k}d\big)$ ; la bande $[0, \pi] \times \mathbb{R}$ en est un domaine fondamental, et l'on retrouve la relation $(0, d) \sim (\pi, -d)$. L'application $(\theta, d) \mapsto \{x\cos\theta + y\sin\theta = d\}$ est constante sur les orbites, car changer $\theta$ en $\theta + \pi$ et $d$ en $-d$ multiplie l'équation par $-1$. Elle induit une bijection $\Psi : M_{0} \to \mathcal{L}$ : une droite a exactement deux vecteurs normaux unitaires opposés.

    Lue dans les cartes, $\Psi$ est continue : là où $\sin\theta \neq 0$, la droite est $y = -\dfrac{\cos\theta}{\sin\theta}\,x + \dfrac{d}{\sin\theta}$, et là où $\cos\theta \neq 0$, elle est $x = -\dfrac{\sin\theta}{\cos\theta}\,y + \dfrac{d}{\cos\theta}$. La réciproque aussi : dans $U_{1}$, la droite $y = mx + p$ a pour normale $\dfrac{(-m, 1)}{\sqrt{1 + m^{2}}}$, soit $\theta = \dfrac{\pi}{2} + \arctan m$ et $d = \dfrac{p}{\sqrt{1 + m^{2}}}$ ; dans $U_{2}$, on obtient $\theta = -\arctan m'$ et $d = \dfrac{p'}{\sqrt{1 + m'^{2}}}$, fonctions continues à valeurs dans $\mathbb{R}^{2}$, que l'on compose avec la projection sur $M_{0}$. *$\mathcal{L}$ est homéomorphe au ruban de Möbius ouvert.* En faisant tourner une droite d'un demi-tour autour d'un point, on revient à la même droite avec la normale retournée : c'est la torsion du ruban.

    ![Figure](documents/figures/89b36a47f4ba2ea8.svg)

    Une droite $D$ est repérée par l'angle $\theta$ de sa normale et sa distance algébrique $d$ à l'origine. Le couple $(\theta, d)$ décrit la bande de droite, infinie vers le haut et le bas, dont les bords sont recollés en sens contraires : c'est le ruban de Möbius ouvert.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-03"
  feuille: "f-l3-gt-04"
  numero: 3
  partie: "Variétés et atlas"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variétés et atlas]
  noeuds: [t-separe, t-quotient]
  notions: [carte, atlas, cartes-compatibles]
  source: "Bordeaux 2016, feuille 4, exercice 3"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Une variété à deux cartes.** On considère une variété $X$ munie d'un atlas formé de deux cartes $f_{i} : U_{i} \to \, ]-1, 1[^{2}$, $i = 1, 2$, toutes deux surjectives, telles que $U_{1} \cap U_{2} = W_{1} \sqcup W_{2}$ avec 
    $$f_{1}(W_{1}) = f_{2}(W_{2}) = \Big]-1, -\frac{1}{2}\Big[ \times ]-1, 1[ , \qquad f_{1}(W_{2}) = f_{2}(W_{1}) = \Big]\frac{1}{2}, 1\Big[ \times ]-1, 1[ ,$$
     et dont le changement de cartes $f_{2} \circ f_{1}^{-1}$ est $(x, y) \mapsto (x + \dfrac{3}{2}, -y)$ sur $f_{1}(W_{1})$ et $(x, y) \mapsto (x - \dfrac{3}{2}, y)$ sur $f_{1}(W_{2})$. On définit $\varphi : X \to \mathbb{R}$ par $\varphi(p) = |y|$ si $p \in U_{i}$ et $f_{i}(p) = (x, y)$.

    **1.** Montrer que $\varphi$ est bien définie et déterminer son image.

    **2.** Pour tout $t$ de l'image, déterminer $\varphi^{-1}(t)$.

    **3.** Montrer que $X \setminus \varphi^{-1}(0)$ est connexe. En déduire que $X$ n'est pas homéomorphe au cylindre $\mathbb{S}^{1} \times \, ]-1, 1[$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Un point de $U_{1} \cap U_{2}$ a deux expressions $f_{1}(p) = (x, y)$ et $f_{2}(p) = (x \pm \dfrac{3}{2}, \pm y)$ : la valeur absolue de la seconde coordonnée est la même, et $\varphi$ est bien définie. Son image est $[0, 1[$.

    **2.** Pour $t = 0$, $\varphi^{-1}(0)$ est formé des points d'ordonnée nulle dans l'une ou l'autre carte. Le segment $y = 0$ de la carte $1$ se prolonge dans la carte $2$ par le segment $y = 0$, aux deux bouts : c'est un cercle, l'âme du ruban.

    Pour $0 < t < 1$, suivons le segment $y = t$ de la carte $1$ vers la droite. Dans la bande $f_{1}(W_{2})$, il se recolle au segment $y = t$ de la carte $2$ ; celui-ci, arrivé dans la bande $f_{2}(W_{1})$, se recolle au segment $y = -t$ de la carte $1$, à cause du changement de signe ; on continue de même par le segment $y = -t$ de la carte $2$, qui revient au point de départ. *$\varphi^{-1}(t)$ est un seul cercle, qui fait deux fois le tour du ruban.*

    ![Figure](documents/figures/fd755460c542866f.svg)

    Les deux cartes : les bandes vertes ($W_{2}$) sont recollées sans retournement, les bandes orange ($W_{1}$) avec $y \mapsto -y$. L'âme $y = 0$ (en rouge) se referme après un tour ; les segments $y = t$ (trait plein) et $y = -t$ (tirets) forment un seul cercle, parcouru en deux tours.

    **3.** Notons $A_{\pm}$ et $C_{\pm}$ les parties de $U_{1}$ et de $U_{2}$ où l'ordonnée est de signe $\pm$ ; ce sont des connexes, images réciproques par les cartes de rectangles ouverts, dont la réunion est $X \setminus \varphi^{-1}(0)$. Par le recollement sans retournement, $A_{+}$ rencontre $C_{+}$ et $A_{-}$ rencontre $C_{-}$ ; par le recollement avec retournement, $A_{+}$ rencontre $C_{-}$. Par l'exercice 4 du chapitre 2 (chaînes de connexes), *$X \setminus \varphi^{-1}(0)$ est connexe.*

    Supposons maintenant que $h : X \to \mathbb{S}^{1} \times \, ]-1, 1[$ soit un homéomorphisme. Le cylindre s'identifie à $\mathbb{S}^{2}$ privée des deux pôles, et $K = h\big(\varphi^{-1}(0)\big)$ est une partie de $\mathbb{S}^{2}$ homéomorphe à un cercle. Par le théorème de Jordan, $\mathbb{S}^{2} \setminus K$ a deux composantes connexes $O_{1}$ et $O_{2}$, ouvertes. Le complémentaire de $K$ dans le cylindre est $(O_{1} \setminus \{N, S\}) \cup (O_{2} \setminus \{N, S\})$ ; un ouvert connexe d'une surface privé d'un nombre fini de points reste connexe (on contourne chaque point dans une carte), et il reste non vide. Ce complémentaire a donc deux composantes, alors qu'il est homéomorphe à $X \setminus \varphi^{-1}(0)$, qui est connexe : contradiction. *$X$, qui est un ruban de Möbius ouvert, n'est pas homéomorphe au cylindre.*

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-04"
  feuille: "f-l3-gt-04"
  numero: 4
  partie: "Variétés et atlas"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variétés et atlas]
  noeuds: [t-separe, t-quotient]
  notions: [carte, atlas, cartes-compatibles]
  source: "Bordeaux 2016, feuille 4, exercice 4"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Deux recollements de deux plans.**

    **1.** Soit $X$ une variété munie d'un atlas formé de deux cartes $f_{i} : U_{i} \to \mathbb{C}$, $i = 1, 2$, surjectives, avec $f_{1}(U_{1} \cap U_{2}) = f_{2}(U_{1} \cap U_{2}) = \mathbb{C}^{*}$ et $f_{2} \circ f_{1}^{-1}(z) = \dfrac{1}{z}$ sur $\mathbb{C}^{*}$. Montrer que $X$ est homéomorphe à la sphère $\mathbb{S}^{2}$. On pourra utiliser les deux projections stéréographiques de $\mathbb{S}^{2}$.

    **2.** Existe-t-il une variété, nécessairement séparée, munie d'un atlas formé de deux cartes $f_{i} : U_{i} \to \mathbb{C}$ surjectives, avec $f_{1}(U_{1} \cap U_{2}) = f_{2}(U_{1} \cap U_{2}) = \mathbb{C}^{*}$ et $f_{2} \circ f_{1}^{-1}(z) = z$ sur $\mathbb{C}^{*}$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Notons $\sigma_{N}$ et $\sigma_{S}$ les projections stéréographiques de $\mathbb{S}^{2} \setminus \{N\}$ et $\mathbb{S}^{2} \setminus \{S\}$ sur $\mathbb{C}$ : 
    $$\sigma_{N}(x, y, z) = \frac{x + \mathrm{i} y}{1 - z} , \qquad \sigma_{S}(x, y, z) = \frac{x + \mathrm{i} y}{1 + z} .$$
     Sur $\mathbb{S}^{2} \setminus \{N, S\}$, $\sigma_{N}\,\overline{\sigma_{S}} = \dfrac{x^{2} + y^{2}}{1 - z^{2}} = 1$, donc $\overline{\sigma_{S}} = \dfrac{1}{\sigma_{N}}$. Posons $F = \sigma_{N}^{-1} \circ f_{1}$ sur $U_{1}$ et $F = \overline{\sigma_{S}}^{\,-1} \circ f_{2}$ sur $U_{2}$, où $\overline{\sigma_{S}}$ désigne $\sigma_{S}$ suivie de la conjugaison. Sur $U_{1} \cap U_{2}$, si $w = f_{1}(p)$, alors $f_{2}(p) = \dfrac{1}{w}$, et le point $\sigma_{N}^{-1}(w)$ de la sphère vérifie $\overline{\sigma_{S}}\big(\sigma_{N}^{-1}(w)\big) = \dfrac{1}{w}$ : les deux définitions coïncident.

    L'application $F : X \to \mathbb{S}^{2}$ est continue, car elle l'est sur chacun des ouverts $U_{i}$, et c'est un homéomorphisme local. Elle est bijective : $U_{1}$ est envoyé sur $\mathbb{S}^{2} \setminus \{N\}$, et le seul point de $U_{2} \setminus U_{1}$, d'image $0$ par $f_{2}$, est envoyé sur $N$. Une bijection qui est un homéomorphisme local est un homéomorphisme : *$X \simeq \mathbb{S}^{2}$.*

    **2.** Non. Les points $o_{1} = f_{1}^{-1}(0) \in U_{1} \setminus U_{2}$ et $o_{2} = f_{2}^{-1}(0) \in U_{2} \setminus U_{1}$ ne peuvent pas être séparés : tout voisinage de $o_{1}$ contient un ensemble $f_{1}^{-1}\big(D(0, \varepsilon) \setminus \{0\}\big)$, tout voisinage de $o_{2}$ un ensemble $f_{2}^{-1}\big(D(0, \varepsilon') \setminus \{0\}\big)$, et ces deux ensembles se rencontrent puisque le changement de cartes est l'identité. L'espace obtenu est le plan à deux origines, analogue de la droite à deux origines du chapitre 3 ; il vérifie tous les axiomes des variétés sauf la séparation.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-05"
  feuille: "f-l3-gt-04"
  numero: 5
  partie: "Variétés et atlas"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variétés et atlas]
  noeuds: [t-separe, t-quotient]
  notions: [carte, atlas, cartes-compatibles]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **La droite projective complexe.** Dans $\mathbb{R}^{3}$, soit $f$ la réciproque de la projection stéréographique de pôle $N = (0, 0, 1)$ de la sphère unité privée de $N$ sur le plan d'équation $x_{3} = -1$ : $f(P)$ est le second point d'intersection de la droite $(NP)$ avec la sphère.

    **1.** Donner une expression de $f(u, v)$.

    **2.** On note $\mathbb{P}^{1}(\mathbb{C})$ le quotient de $\mathbb{C}^{2} \setminus \{0\}$ par la relation $(z_{1}, z_{2}) \sim (\lambda z_{1}, \lambda z_{2})$, $\lambda \in \mathbb{C}^{*}$. Construire une application continue $g : \mathbb{C}^{2} \setminus \{0\} \to \mathbb{S}^{2}$, constante sur les classes, dont la restriction à $\mathbb{C} \times \{1\}$ soit $f$, en identifiant $\mathbb{C}$ au plan $x_{3} = -1$ par $u + \mathrm{i} v \mapsto (u, v, -1)$.

    **3.** En déduire que $\mathbb{P}^{1}(\mathbb{C})$ est homéomorphe à $\mathbb{S}^{2}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** La droite $(NP)$, avec $P = (u, v, -1)$, est formée des points $N + t(P - N) = (tu, tv, 1 - 2t)$. Ce point est sur la sphère si $t^{2}(u^{2} + v^{2}) + (1 - 2t)^{2} = 1$, soit $t\big(t(u^{2} + v^{2} + 4) - 4\big) = 0$. La solution non nulle donne 
    $$f(u, v) = \frac{(4u, 4v, u^{2} + v^{2} - 4)}{u^{2} + v^{2} + 4} .$$

    **2.** En notant $z = u + \mathrm{i} v$ et en identifiant $\mathbb{R}^{3}$ à $\mathbb{C} \times \mathbb{R}$, on a $f(z) = \dfrac{(4z, |z|^{2} - 4)}{|z|^{2} + 4}$. Rendons cette expression homogène en $(z_{1}, z_{2})$ : 
    $$g(z_{1}, z_{2}) = \frac{\big(4z_{1}\bar{z}_{2}, \; |z_{1}|^{2} - 4|z_{2}|^{2}\big)}{|z_{1}|^{2} + 4|z_{2}|^{2}} .$$
     Elle est continue sur $\mathbb{C}^{2} \setminus \{0\}$, vérifie $g(z, 1) = f(z)$ et $g(\lambda z_{1}, \lambda z_{2}) = g(z_{1}, z_{2})$, puisque numérateur et dénominateur sont multipliés par $|\lambda|^{2}$. Elle est à valeurs dans $\mathbb{S}^{2}$, car 
    $$16|z_{1}|^{2}|z_{2}|^{2} + \big(|z_{1}|^{2} - 4|z_{2}|^{2}\big)^{2} = \big(|z_{1}|^{2} + 4|z_{2}|^{2}\big)^{2} .$$

    **3.** Par le théorème 1 du chapitre 3, $g$ induit $\bar{g} : \mathbb{P}^{1}(\mathbb{C}) \to \mathbb{S}^{2}$ continue. Si $z_{2} \neq 0$, la classe de $(z_{1}, z_{2})$ est celle de $(z, 1)$ avec $z = \dfrac{z_{1}}{z_{2}}$, d'image $f(z)$ ; si $z_{2} = 0$, la classe est celle de $(1, 0)$, d'image $N$. Comme $f$ est une bijection du plan sur $\mathbb{S}^{2} \setminus \{N\}$, $\bar{g}$ est bijective. Enfin $\mathbb{P}^{1}(\mathbb{C})$ est compact, image du compact $\mathbb{S}^{3} \subset \mathbb{C}^{2} \setminus \{0\}$, qui rencontre toutes les classes, et $\mathbb{S}^{2}$ est séparé : par la proposition 4 du chapitre 3, *$\mathbb{P}^{1}(\mathbb{C}) \simeq \mathbb{S}^{2}$.* La droite projective complexe est une sphère, dite de Riemann : le plan complexe complété par un point à l'infini.

    ![Figure](documents/figures/e3e908deea722eac.svg)

    Coupe par un plan vertical : la droite issue de $N$ et passant par le point $P$ du plan tangent au pôle sud recoupe la sphère en $f(P)$. Quand $P$ s'éloigne, $f(P)$ tend vers $N$, image de la classe de $(1, 0)$.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-06"
  feuille: "f-l3-gt-04"
  numero: 6
  partie: "Variétés et atlas"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variétés et atlas]
  noeuds: [t-separe, t-quotient]
  notions: [carte, atlas, cartes-compatibles]
  source: "Bordeaux 2016, feuille 4, exercice 5"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Homogénéité des variétés.**

    **1.** Soient $a < b < d$ et $a < c < d$ des réels. Construire un homéomorphisme $\varphi$ de $\mathbb{R}$, affine par morceaux, tel que $\varphi(b) = c$ et $\varphi(t) = t$ pour $t \notin [a, d]$.

    **2.** Soient $B = B(0, r)$ la boule ouverte euclidienne de $\mathbb{R}^{2}$ et $p, q \in B$. Montrer qu'il existe un homéomorphisme $f$ de $\mathbb{R}^{2}$ tel que $f(p) = q$ et $f(v) = v$ pour tout $v \notin B$. On pourra d'abord envoyer $0$ sur $p$ en déformant chaque rayon de la boule.

    **3.** Soit $M$ une surface connexe. Montrer que, pour tous $x, y \in M$, il existe un homéomorphisme de $M$ envoyant $x$ sur $y$.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** On pose $\varphi(t) = t$ hors de $[a, d]$, et sur $[a, d]$ on prend l'application affine par morceaux qui envoie $[a, b]$ sur $[a, c]$ et $[b, d]$ sur $[c, d]$. Elle est continue, strictement croissante, bijective, et sa réciproque, du même type, est continue.

    **2.** $\triangleright$ *Envoyer $0$ sur $p$.* Posons $h_{p}(x) = x + \big(1 - \dfrac{\lVert x \rVert}{r}\big)p$ si $\lVert x \rVert \leq r$, et $h_{p}(x) = x$ sinon. Pour $x = su$ avec $\lVert u \rVert = 1$ et $0 \leq s \leq r$, on a 
    $$h_{p}(su) = p + \frac{s}{r}\,(ru - p) :$$
     $h_{p}$ envoie le rayon $[0, ru]$ affinement sur le segment $[p, ru]$. Comme la boule fermée $\bar{B}$ est convexe et que $p$ est intérieur, chaque point de $\bar{B} \setminus \{p\}$ est sur un et un seul de ces segments, à une position bien déterminée : $h_{p}$ est une bijection continue du compact $\bar{B}$ sur lui-même, donc un homéomorphisme, égal à l'identité sur la sphère de rayon $r$. Recollée avec l'identité hors de $B$, elle donne un homéomorphisme de $\mathbb{R}^{2}$, les deux définitions coïncidant sur le bord.

    $\triangleright$ *Conclusion.* $f = h_{q} \circ h_{p}^{-1}$ envoie $p$ sur $q$ et fixe les points hors de $B$.

    ![Figure](documents/figures/e919e2ecefa6b48a.svg)

    À gauche, l'homéomorphisme affine par morceaux $\varphi$, égal à l'identité (en pointillés) hors de $[a, d]$. À droite, les segments $[p, ru]$ (en orange), images des rayons $[0, ru]$ issus du centre (point noir) par $h_{p}$ : ils remplissent le disque sans se croiser, ce qui rend $h_{p}$ bijective.

    **3.** Disons que $x \approx y$ s'il existe un homéomorphisme de $M$ envoyant $x$ sur $y$ ; c'est une relation d'équivalence, puisque les homéomorphismes forment un groupe. Montrons que ses classes sont ouvertes. Soient $x \in M$ et $\psi : U \to \mathbb{R}^{2}$ une carte avec $\psi(x) = 0$, et $r > 0$ tel que $\bar{B}(0, r) \subset \psi(U)$. Pour $q \in B(0, r)$, soit $f$ un homéomorphisme de $\mathbb{R}^{2}$ fixant les points hors de $B(0, r)$ et envoyant $0$ sur $q$. Posons $F = \psi^{-1} \circ f \circ \psi$ sur $U$ et $F = \mathrm{id}$ sur $M \setminus \psi^{-1}\big(\bar{B}(0, r)\big)$. Ces deux ouverts recouvrent $M$, car $\psi^{-1}\big(\bar{B}(0, r)\big)$ est compact, donc fermé dans le séparé $M$, et les deux définitions coïncident sur leur intersection. Ainsi $F$ est un homéomorphisme de $M$, de réciproque construite de même, qui envoie $x$ sur $\psi^{-1}(q)$. La classe de $x$ contient l'ouvert $\psi^{-1}\big(B(0, r)\big)$.

    Les classes sont des ouverts disjoints qui recouvrent $M$ ; comme $M$ est connexe, il n'y en a qu'une. L'argument vaut mot pour mot en toute dimension : *une variété connexe est homogène,* tous ses points jouent le même rôle.

    0@16@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-04-07"
