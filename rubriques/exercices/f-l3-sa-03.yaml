  enonce: |
    Soit $d \in \mathbb{N}^{*}$.

    **1.** On suppose $d \in \{1, 2\}$. Montrer que, pour tout $z \in \mathbb{C}$, il existe $q \in \mathbb{Z}[\mathrm{i}\sqrt{d}]$ tel que $N(z - q) \leqslant \dfrac{1 + d}{4} < 1$. En déduire que $\mathbb{Z}[\mathrm{i}\sqrt{d}]$ est euclidien pour la norme $N$, donc principal et factoriel, et déterminer son groupe des inversibles.

    **2.** On suppose $d \geqslant 3$. Montrer que $2$ est irréductible dans $\mathbb{Z}[\mathrm{i}\sqrt{d}]$, mais qu'il n'est pas premier. *Distinguer selon la parité de $d$.*

    **3.** Conclure : pour quelles valeurs de $d \in \mathbb{N}^{*}$ l'anneau $\mathbb{Z}[\mathrm{i}\sqrt{d}]$ est-il factoriel ? principal ? euclidien ?
  corrige: |
    **1.** Écrivons $z = \alpha + \mathrm{i}\beta\sqrt{d}$, avec $\alpha$, $\beta$ réels, et choisissons des entiers $m$, $n$ tels que $|\alpha - m| \leqslant \dfrac{1}{2}$ et $|\beta - n| \leqslant \dfrac{1}{2}$. Pour $q = m + \mathrm{i} n\sqrt{d}$, 
    $$N(z - q) = (\alpha - m)^{2} + d(\beta - n)^{2} \leqslant \frac{1}{4} + \frac{d}{4} = \frac{1 + d}{4},$$
     qui est $< 1$ pour $d \leqslant 2$.

    *Division euclidienne.* Soit $a$, $b \in \mathbb{Z}[\mathrm{i}\sqrt{d}]$, $b \neq 0$. On applique ce qui précède à $z = a/b$ et l'on pose $r = a - bq = b(z - q)$. Alors $r \in \mathbb{Z}[\mathrm{i}\sqrt{d}]$ et $N(r) = N(b)N(z - q) < N(b)$.

    L'anneau, intègre, est donc euclidien pour $N$, puis principal (cours, th. 3) et factoriel (th. 2). Ses inversibles sont les éléments de norme $1$ (cours, prop. 2) : $\{\pm 1, \pm \mathrm{i}\}$ pour $d = 1$, $\{\pm 1\}$ pour $d = 2$.

    **2.** *Irréductibilité.* Si $2 = zw$ avec $z$, $w$ non inversibles, alors $N(z) = 2$, soit $u^{2} + dv^{2} = 2$. C'est impossible : si $v \neq 0$, le membre de gauche vaut au moins $d \geqslant 3$ ; si $v = 0$, $u^{2} = 2$.

    *Non-primalité.* Un élément $x + y\mathrm{i}\sqrt{d}$ est multiple de $2$ si et seulement si $x$ et $y$ sont pairs.

    • Si $d$ est pair, $(\mathrm{i}\sqrt{d})^{2} = -d$ est multiple de $2$, mais $\mathrm{i}\sqrt{d}$ ne l'est pas.

    • Si $d$ est impair, $(1 + \mathrm{i}\sqrt{d})(1 - \mathrm{i}\sqrt{d}) = 1 + d$ est multiple de $2$, mais aucun des deux facteurs ne l'est.

    **3.** Pour $d \in \{1, 2\}$, l'anneau est euclidien, principal et factoriel. Pour $d \geqslant 3$, il contient un irréductible non premier, donc n'est pas factoriel (cours, th. 1), ni principal, ni euclidien. *Les trois propriétés coïncident donc pour cette famille d'anneaux*, ce qui n'est pas vrai en général (cours, remarque sur $\mathbb{Z}\big[\dfrac{1 + \mathrm{i}\sqrt{19}}{2}\big]$).

    1.5em

    ![Figure](documents/figures/6a25276bc2c77154.svg)

    Les points bleus forment le réseau $\mathbb{Z}[\mathrm{i}\sqrt{d}]$, de mailles $1 \times \sqrt{d}$. Le point du plan le plus éloigné du réseau est le centre d'une maille, en rouge, à la distance $\dfrac{\sqrt{1 + d}}{2}$ des sommets (segment orange). Pour $d = 2$, les sommets sont strictement dans le cercle de rayon $1$ en pointillés : on peut toujours approcher $z$ à moins de $1$. Pour $d = 3$, ils sont sur le cercle, et la division euclidienne pour $N$ échoue.
- id: "l3-sa-03-08"
  feuille: "f-l3-sa-03"
  numero: 8
  partie: "Anneaux principaux, anneaux euclidiens"
  etoiles: 2
  types: [Démonstration]
