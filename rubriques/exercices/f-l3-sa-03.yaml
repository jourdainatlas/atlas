  source: "Exo7 (fic00032), exercice 8 ; TD Algèbre 4, feuille 4 (2014-15), exercices 4 (1) et 7 (2)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $A$ factoriel et $\mathfrak{p}$ un idéal premier non nul de $A$. Montrer que $\mathfrak{p}$ contient un élément irréductible.

    **2.** Dans $\mathbb{Z}[\mathrm{i}\sqrt{5}]$, montrer que $2$, $3$, $1 + \mathrm{i}\sqrt{5}$ et $1 - \mathrm{i}\sqrt{5}$ sont irréductibles. *On pourra chercher les éléments de norme $2$ ou $3$.*

    **3.** En déduire deux factorisations de $6$ en produit d'irréductibles de $\mathbb{Z}[\mathrm{i}\sqrt{5}]$, puis que $3$ n'est pas premier et que $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ n'est pas factoriel.
  corrige: |
    **1.** Soit $a \in \mathfrak{p}$ non nul. Il n'est pas inversible, car $\mathfrak{p} \neq A$ ; il s'écrit donc $a = up_{1}\cdots p_{r}$, avec $u$ inversible, $r \geqslant 1$ et les $p_{i}$ irréductibles.

    L'idéal $\mathfrak{p}$ étant premier, l'un des facteurs est dans $\mathfrak{p}$. Ce n'est pas $u$, qui est inversible : c'est donc un irréductible $p_{i}$.

    **2.** La norme est $N(a + b\mathrm{i}\sqrt{5}) = a^{2} + 5b^{2}$. Si $b \neq 0$, elle vaut au moins $5$ ; si $b = 0$, c'est un carré. *Aucun élément n'est donc de norme $2$ ou $3$.*

    On a $N(2) = 4$, $N(3) = 9$ et $N(1 \pm \mathrm{i}\sqrt{5}) = 6$. Si l'un de ces éléments s'écrivait $zw$ avec $z$, $w$ non inversibles, on aurait $N(z)$, $N(w) > 1$ et $N(z)N(w) \in \{4, 9, 6\}$, d'où $N(z) \in \{2, 3\}$ : c'est impossible. Les quatre éléments sont irréductibles.

    **3.** On a les deux factorisations 
    $$6 = 2 \times 3 = (1 + \mathrm{i}\sqrt{5})(1 - \mathrm{i}\sqrt{5}).$$
     Elles sont réellement différentes : les inversibles sont $\pm 1$ (cours, prop. 2), et $2$ n'est associé ni à $1 + \mathrm{i}\sqrt{5}$ ni à $1 - \mathrm{i}\sqrt{5}$, qui n'ont pas la même norme.

    L'élément $3$ divise $(1 + \mathrm{i}\sqrt{5})(1 - \mathrm{i}\sqrt{5})$, mais ne divise aucun des deux facteurs, puisque $\dfrac{1 \pm \mathrm{i}\sqrt{5}}{3} \notin \mathbb{Z}[\mathrm{i}\sqrt{5}]$ : $3$ est irréductible et n'est pas premier.

    Par le th. 1 du cours, $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ n'est pas factoriel.
- id: "l3-sa-03-03"
  feuille: "f-l3-sa-03"
  numero: 3
  partie: "Divisibilité, éléments irréductibles et premiers"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [éléments irréductibles et premiers]
  noeuds: [ac-divisibilite, ac-factoriels]
  notions: [element-irreductible, element-premier]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 7 (1), (3), (4)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Montrer que l'idéal $\langle 2, 1 + \mathrm{i}\sqrt{5} \rangle$ n'est pas principal dans $\mathbb{Z}[\mathrm{i}\sqrt{5}]$. En conclure que $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ n'est pas un anneau principal.

    **2.** Montrer que $3$ et $2 + \mathrm{i}\sqrt{5}$ ont un PGCD, mais pas de PPCM, dans $\mathbb{Z}[\mathrm{i}\sqrt{5}]$.

    **3.** Montrer que $4$ et $2 + 2\mathrm{i}\sqrt{3}$ n'ont pas de PGCD dans $\mathbb{Z}[\mathrm{i}\sqrt{3}]$.
  corrige: |
    **1.** Notons $I = \langle 2, 1 + \mathrm{i}\sqrt{5} \rangle$.

    $\triangleright$ *$I$ n'est pas l'anneau entier.* Ses éléments $2\alpha + (1 + \mathrm{i}\sqrt{5})\beta$ sont de la forme $x + y\mathrm{i}\sqrt{5}$ avec $x \equiv y \pmod{2}$. En effet, pour $\alpha = a + b\mathrm{i}\sqrt{5}$, $2\alpha = 2a + 2b\mathrm{i}\sqrt{5}$, et pour $\beta = a + b\mathrm{i}\sqrt{5}$, 
    $$(1 + \mathrm{i}\sqrt{5})\beta = (a - 5b) + (a + b)\mathrm{i}\sqrt{5}, \quad a - 5b \equiv a + b \pmod{2}.$$
     Donc $1 \notin I$.

    $\triangleright$ *$I$ n'est pas principal.* Si $I = \langle \delta \rangle$, $\delta$ diviserait $2$ et $1 + \mathrm{i}\sqrt{5}$, donc $N(\delta)$ diviserait $4$ et $6$ : $N(\delta) \in \{1, 2\}$. La norme $2$ est impossible (exercice 2), donc $\delta = \pm 1$ et $I$ serait l'anneau entier, ce qui vient d'être exclu.

    L'anneau $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ n'est donc pas principal ; c'était déjà une conséquence de l'exercice 2, puisqu'un anneau principal est factoriel.

    **2.** *PGCD.* Soit $\delta$ un diviseur commun de $3$ et $2 + \mathrm{i}\sqrt{5}$, tous deux de norme $9$. Alors $N(\delta) \in \{1, 3, 9\}$, et $3$ est exclu. Si $N(\delta) = 9$, $\delta$ serait associé à $3$ et à $2 + \mathrm{i}\sqrt{5}$, qui ne sont pas associés entre eux (les inversibles sont $\pm 1$). Donc $\delta = \pm 1$, et $\boxed{1}$ est un PGCD de $3$ et $2 + \mathrm{i}\sqrt{5}$.

    *PPCM.* Supposons que $m$ soit un PPCM. D'après l'exercice 4 (question 1), $\dfrac{3(2 + \mathrm{i}\sqrt{5})}{m}$ serait un PGCD, donc $m \sim 3(2 + \mathrm{i}\sqrt{5})$, de norme $81$.

    Or $9 = (2 + \mathrm{i}\sqrt{5})(2 - \mathrm{i}\sqrt{5}) = 3 \times 3$ est un multiple commun, donc $m \mid 9$. Comme $N(m) = 81 = N(9)$, on aurait $m \sim 9$, puis $3(2 + \mathrm{i}\sqrt{5}) \sim 9$, et $2 + \mathrm{i}\sqrt{5} \sim 3$, ce qui est faux. Il n'y a pas de PPCM. *C'est la promesse du chapitre 3 du cours : un PGCD peut exister sans PPCM.*

    **3.** Dans $\mathbb{Z}[\mathrm{i}\sqrt{3}]$, $N(4) = N(2 + 2\mathrm{i}\sqrt{3}) = 16$, et $2$, $1 + \mathrm{i}\sqrt{3}$ sont deux diviseurs communs, car $4 = (1 + \mathrm{i}\sqrt{3})(1 - \mathrm{i}\sqrt{3})$ et $2 + 2\mathrm{i}\sqrt{3} = 2(1 + \mathrm{i}\sqrt{3})$.

    Supposons que $d$ soit un PGCD. Comme $2 \mid d$, $N(d)$ est un multiple de $4$ ; comme $d \mid 4$, $N(d)$ divise $16$.

    • Les éléments de norme $16$ sont $\pm 4$ et $\pm 2 \pm 2\mathrm{i}\sqrt{3}$ ($a^{2} + 3b^{2} = 16$). Aucun ne divise à la fois $4$ et $2 + 2\mathrm{i}\sqrt{3}$ : par exemple $\dfrac{4}{2 + 2\mathrm{i}\sqrt{3}} = \dfrac{1 - \mathrm{i}\sqrt{3}}{2} \notin \mathbb{Z}[\mathrm{i}\sqrt{3}]$.

    • Il n'y a pas d'élément de norme $8$ ($a^{2} + 3b^{2} = 8$ est impossible).

    • Les éléments de norme $4$ sont $\pm 2$ et $\pm 1 \pm \mathrm{i}\sqrt{3}$. Comme $2 \mid d$ et $N(d) = N(2)$, on aurait $d = \pm 2$ ; mais $1 + \mathrm{i}\sqrt{3}$ devrait alors diviser $2$, ce qui est faux, car $\dfrac{2}{1 + \mathrm{i}\sqrt{3}} = \dfrac{1 - \mathrm{i}\sqrt{3}}{2}$.

    Les éléments $4$ et $2 + 2\mathrm{i}\sqrt{3}$ n'ont donc pas de PGCD.
- id: "l3-sa-03-04"
  feuille: "f-l3-sa-03"
  numero: 4
  partie: "PGCD, PPCM et idéaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["PGCD, PPCM et idéaux", anneaux factoriels]
  noeuds: [ac-factoriels, ac-principaux]
  notions: [pgcd-anneau, premiers-entre-eux, anneau-factoriel]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercices 9 et 4 (3) ; Exo7 (fic00033), exercice 6"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $A$ un anneau intègre et $a$, $b \in A$ non nuls.

    **1.** Montrer que $a$ et $b$ ont un PPCM $m$ si et seulement si $\langle a \rangle \cap \langle b \rangle$ est un idéal principal, engendré par $m$. Prouver que, dans ce cas, $\dfrac{ab}{m}$ est un PGCD de $a$ et $b$.

    **2.** Les éléments $a$ et $b$ ont-ils un PGCD $d$ si et seulement si l'idéal $\langle a, b \rangle$ est principal et engendré par $d$ ?

    **3.** On suppose $A$ factoriel. Montrer que $\langle a \rangle\langle b \rangle = \langle a \rangle \cap \langle b \rangle$ si et seulement si $a \wedge b \sim 1$, et que, si $\langle a, b \rangle$ est principal, alors $\langle a, b \rangle = \langle a \wedge b \rangle$.

    **4.** L'idéal engendré par un élément irréductible d'un anneau factoriel est-il toujours maximal ?
  corrige: |
    **1.** Les multiples communs de $a$ et $b$ forment l'idéal $\langle a \rangle \cap \langle b \rangle$. Un élément $m$ est un PPCM s'il est multiple commun et divise tout multiple commun, c'est-à-dire si $m \in \langle a \rangle \cap \langle b \rangle$ et $\langle a \rangle \cap \langle b \rangle \subset \langle m \rangle$ : c'est exactement $\langle a \rangle \cap \langle b \rangle = \langle m \rangle$.

    Supposons-le. Comme $ab$ est un multiple commun, $ab = md$ pour un $d \in A$. Montrons que $d$ est un PGCD.

    $\triangleright$ *$d$ est un diviseur commun.* Écrivons $m = aa'$ ; alors $ab = aa'd$, donc $b = a'd$ et $d \mid b$. De même $d \mid a$.

    $\triangleright$ *Tout diviseur commun divise $d$.* Soit $e$ tel que $a = ea_{1}$ et $b = eb_{1}$. L'élément $ea_{1}b_{1} = ab_{1} = a_{1}b$ est un multiple commun, donc $ea_{1}b_{1} = mk$. Alors $md = ab = e \cdot ea_{1}b_{1} = emk$, et, en simplifiant par $m \neq 0$, $d = ek$ : $e \mid d$.

    **2.** Une implication est vraie : si $\langle a, b \rangle = \langle d \rangle$, alors $d$ divise $a$ et $b$, et, comme $d = ua + vb$, tout diviseur commun divise $d$ ; $d$ est un PGCD.

    La réciproque est fausse. Dans $\mathbb{Z}[X]$, les diviseurs communs de $2$ et $X$ sont $\pm 1$ (les diviseurs de $2$ sont $\pm 1$ et $\pm 2$, et $2 \nmid X$) : $1$ est un PGCD. Mais $\langle 2, X \rangle \neq \mathbb{Z}[X]$, puisque ses éléments ont un terme constant pair : l'idéal n'est pas engendré par $1$, et il n'est même pas principal (cours, chapitre 3).

    **3.** Dans un anneau factoriel, $a$ et $b$ ont un PPCM $m$ (cours, prop. 4), et $\langle a \rangle \cap \langle b \rangle = \langle m \rangle$ par la question 1. Comme $\langle a \rangle\langle b \rangle = \langle ab \rangle$, l'égalité équivaut à $ab \sim m$. Or $(a \wedge b)\,m \sim ab$ (cours, prop. 4) : elle équivaut donc à $a \wedge b \sim 1$.

    Si $\langle a, b \rangle = \langle d \rangle$, alors $d$ est un PGCD par la question 2. Deux PGCD étant associés, $\langle a, b \rangle = \langle a \wedge b \rangle$.

    **4.** Non. L'anneau $\mathbb{Z}[X]$ est factoriel (cours, chapitre 5), $X$ y est irréductible, mais 
    $$\langle X \rangle \subsetneq \langle 2, X \rangle \subsetneq \mathbb{Z}[X],$$
     la seconde inclusion étant stricte par la question 2 : $\langle X \rangle$ n'est pas maximal. Il l'est en revanche dans un anneau principal (cours, th. 2).
