  enonce: |
    Soit $A$ un anneau factoriel dans lequel, pour tous $a$, $b \in A$, l'idéal $\langle a, b \rangle$ est principal.

    **1.** Soit $a$, $b \in A$ non nuls. Montrer qu'un générateur de l'idéal $\langle a, b \rangle$ est un PGCD de $a$ et $b$ : $A$ vérifie la *propriété de Bézout*.

    **2.** Soit $I \neq A$ un idéal non nul. Soit $a \in I$ non nul qui s'écrit comme un produit $p_{1}\cdots p_{n}$ d'irréductibles, avec un nombre $n$ de facteurs minimal parmi les éléments de $I \setminus \{0\}$. Soit $b \in I$ et $d$ tel que $\langle a, b \rangle = \langle d \rangle$. Montrer que $d \mid a$ et $d \in I$, puis que $\langle d \rangle = \langle a \rangle$ et $a \mid b$. Conclure que $I = \langle a \rangle$.

    **3.** En déduire que $A$ est principal.
  corrige: |
    **1.** C'est l'implication démontrée à l'exercice 4, question 2.

    **2.** Comme $I \neq A$, $I$ ne contient pas d'inversible ; ses éléments non nuls sont non inversibles et ont, $A$ étant factoriel, une décomposition en irréductibles dont le nombre de facteurs $\ell$ est bien défini. On choisit $a$ minimisant ce nombre $n = \ell(a)$.

    Soit $b \in I$ et $d$ tel que $\langle a, b \rangle = \langle d \rangle$. Alors $d \mid a$, et $d = ua + vb \in I$ ; en particulier $d \neq 0$ et $d$ n'est pas inversible.

    Écrivons $a = dc$. Par unicité de la décomposition, $\ell(a) = \ell(d) + \ell(c)$, et $\ell(d) \geqslant n$ par minimalité : donc $\ell(c) = 0$, $c$ est inversible et $\langle d \rangle = \langle a \rangle$.

    Ainsi $b \in \langle a, b \rangle = \langle a \rangle$, soit $a \mid b$. Comme $b$ est quelconque dans $I$, $I \subset \langle a \rangle \subset I$.

    **3.** Les idéaux $\{0\}$ et $A$ sont principaux, et les autres le sont par la question 2 : $A$ est principal. *Ainsi, un anneau est principal si et seulement s'il est factoriel et vérifie la propriété de Bézout* ; l'implication directe est le th. 2 du cours.
- id: "l3-sa-03-06"
  feuille: "f-l3-sa-03"
