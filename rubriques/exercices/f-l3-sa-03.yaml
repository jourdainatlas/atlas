  source: "Exo7 (fic00031), exercices 11, 12 et 13"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $n$, $m \geqslant 1$. Déterminer le PGCD de $X^{n} - 1$ et $X^{m} - 1$ dans $\mathbb{Z}[X]$.

    **2.** Dans $\mathbb{F}_{2}[X]$, déterminer le PGCD $d$ de $f$ et $g$, et des polynômes $u$, $v$ tels que $fu + gv = d$, lorsque : 
    $$f = X^{5} + X^{4} + 1, \quad g = X^{4} + X^{2} + 1 ; \qquad\text{puis}\qquad f = X^{5} + X^{3} + X + 1, \quad g = X^{4} + 1.$$

    **3.** Déterminer le PGCD de $f = X^{4} + 1$ et $g = X^{3} + X + 1$ dans $\mathbb{F}_{3}[X]$, puis dans $\mathbb{F}_{5}[X]$.
  corrige: |
    **1.** Écrivons $n = qm + r$, $0 \leqslant r < m$. Comme $X^{m} - 1$ divise $X^{qm} - 1$, 
    $$X^{n} - 1 = X^{r}(X^{qm} - 1) + (X^{r} - 1) \equiv X^{r} - 1 \pmod{X^{m} - 1}.$$
     Les diviseurs communs de $X^{n} - 1$ et $X^{m} - 1$ sont donc ceux de $X^{m} - 1$ et $X^{r} - 1$ : l'algorithme d'Euclide sur les polynômes suit celui sur les exposants, et le PGCD est $\boxed{X^{n \wedge m} - 1}$, au signe près.

    **2.** *Premier couple.* L'algorithme d'Euclide (cours, prop. 8) donne, en caractéristique $2$, 
    $$\begin{aligned} f &= (X + 1)g + (X^{3} + X^{2} + X), \\ g &= (X + 1)(X^{3} + X^{2} + X) + (X^{2} + X + 1), \\ X^{3} + X^{2} + X &= X(X^{2} + X + 1). \end{aligned}$$
     Le PGCD est $\boxed{d = X^{2} + X + 1}$. En remontant, $d = g + (X + 1)\big(f + (X + 1)g\big) = (X + 1)f + X^{2}g$ : $\boxed{u = X + 1, \ v = X^{2}}$.

    *Second couple.* On obtient 
    $$f = Xg + (X^{3} + 1), \quad g = X(X^{3} + 1) + (X + 1), \quad X^{3} + 1 = (X + 1)(X^{2} + X + 1).$$
     Le PGCD est $\boxed{d = X + 1}$, et $d = g + X(f + Xg) = Xf + (X^{2} + 1)g$ : $\boxed{u = X, \ v = X^{2} + 1}$.

    **3.** Dans $\mathbb{F}_{3}[X]$, $f = Xg - (X^{2} + X - 1)$, et $(X^{2} + X - 1)(X - 1) = X^{3} - 2X + 1 = g$ : le PGCD est $\boxed{X^{2} + X - 1 = X^{2} + X + 2}$, avec $Xg - f = X^{2} + X - 1$.

    Dans $\mathbb{F}_{5}[X]$, $f = Xg - (X^{2} + X - 1)$ encore, puis $g = (X - 1)(X^{2} + X - 1) + 3X$, et $X^{2} + X - 1 = (2X + 2) \cdot 3X - 1$ : le dernier reste non nul est une constante, et le PGCD est $\boxed{1}$. *Le PGCD dépend du corps* : modulo $3$, $f$ et $g$ ont le facteur commun $X^{2} + X + 2$, qui n'existe pas modulo $5$.
