  enonce: |
    **1.** Résoudre dans $\mathbb{Z}^{2}$ l'équation $ax + by = c$ pour $(a, b, c) = (36, 30, 14)$, $(15, 21, 35)$, puis $(7, 15, 0)$ et $(7, 15, 3)$.

    **2.** Quel est le plus petit entier naturel $x$ tel que $11x \equiv 5 \pmod{19}$ et $5x \equiv 1 \pmod{11}$ ?

    **3.** Pour quels entiers $n$ et $m$ la fraction $\dfrac{11n + 2m}{18n + 5m}$ est-elle réductible ?
  corrige: |
    **1.** L'équation $ax + by = c$ a des solutions si et seulement si $a \wedge b$ divise $c$ (théorème de Bézout).

    • $(36, 30, 14)$ : $36 \wedge 30 = 6$ ne divise pas $14$ ; pas de solution.

    • $(15, 21, 35)$ : $15 \wedge 21 = 3$ ne divise pas $35$ ; pas de solution.

    • $(7, 15, 0)$ : $7x = -15y$ et $7 \wedge 15 = 1$, donc $15 \mid x$ (lemme de Gauss) ; les solutions sont les $\boxed{(15k, -7k)}$, $k \in \mathbb{Z}$.

    • $(7, 15, 3)$ : $15 = 2 \times 7 + 1$ donne $1 = 15 - 2 \times 7$, puis $3 = 7 \times (-6) + 15 \times 3$. Par différence avec le cas précédent, les solutions sont les $\boxed{(-6 + 15k, 3 - 7k)}$, $k \in \mathbb{Z}$.

    **2.** L'inverse de $11$ modulo $19$ est $7$ ($77 = 4 \times 19 + 1$), donc $x \equiv 35 \equiv 16 \pmod{19}$. L'inverse de $5$ modulo $11$ est $9$, donc $x \equiv 9 \pmod{11}$.

    En écrivant $x = 16 + 19k$, on obtient $5 + 8k \equiv 9 \pmod{11}$, soit $8k \equiv 4$, et, l'inverse de $8$ étant $7$, $k \equiv 6 \pmod{11}$. Les solutions sont les $x \equiv 130 \pmod{209}$, et la plus petite est $\boxed{x = 130}$.

    **3.** Posons $\delta = n \wedge m$ (avec $(n, m) \neq (0, 0)$) et $g$ le pgcd du numérateur et du dénominateur. D'une part $\delta \mid g$. D'autre part, la matrice $\begin{pmatrix} 11 & 2 \\ 18 & 5 \end{pmatrix}$ a pour déterminant $19$, et 
    $$19n = 5(11n + 2m) - 2(18n + 5m), \qquad 19m = -18(11n + 2m) + 11(18n + 5m),$$
     donc $g$ divise $19n$ et $19m$, puis $19\delta$. Ainsi $g = \delta$ ou $g = 19\delta$.

    Enfin $19 \mid 11n + 2m$ équivaut à $m \equiv 4n \pmod{19}$, et entraîne alors $18n + 5m \equiv 38n \equiv 0$. La fraction est réductible si et seulement si $\boxed{n \wedge m > 1 \text{ ou } m \equiv 4n \pmod{19}}$. Par exemple, pour $n = 1$ et $m = 4$, on obtient $\dfrac{19}{38} = \dfrac{1}{2}$.
- id: "l3-sa-03-10"
  feuille: "f-l3-sa-03"
  numero: 10
