  noeuds: [ac-principaux]
  notions: [anneau-principal, anneau-euclidien, stathme]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 5 ; Exo7 (fic00030), exercice 7 (3)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $\mathbb{Z}[\sqrt{2}] = \{x + y\sqrt{2} ; x, y \in \mathbb{Z}\} \subset \mathbb{R}$.

    **1.** Montrer que $\mathbb{Z}[\sqrt{2}]$ est un anneau intègre, et que tout $z \in \mathbb{Z}[\sqrt{2}]$ s'écrit de façon unique $z = x + y\sqrt{2}$, avec $x$, $y \in \mathbb{Z}$.

    **2.** Pour $z = x + y\sqrt{2}$, on appelle *conjugué* de $z$ le réel $\bar{z} = x - y\sqrt{2}$.

    **(a)** Montrer que $z \mapsto \bar{z}$ est un automorphisme de l'anneau $\mathbb{Z}[\sqrt{2}]$.

    **(b)** Prouver que $z\bar{z} \in \mathbb{Z}$, et que $z \in \mathbb{Z}[\sqrt{2}]^{\times}$ si et seulement si $z\bar{z} \in \{-1, 1\}$. Vérifier que $\theta = 1 + \sqrt{2}$ est inversible. Le groupe $\mathbb{Z}[\sqrt{2}]^{\times}$ est-il fini ?

    **3.** Prouver que $\mathbb{Z}[\sqrt{2}]$ est euclidien pour $s(z) = |z\bar{z}|$.

    **4.** On veut montrer que le groupe $\mathbb{Z}[\sqrt{2}]^{\times}$ est engendré par $-1$ et $\theta$.

    **(a)** Vérifier que $x = \dfrac{z + \bar{z}}{2}$ et $y = \dfrac{z - \bar{z}}{2\sqrt{2}}$.

    **(b)** Soit $z \in \mathbb{Z}[\sqrt{2}]^{\times}$ tel que $1 \leqslant z < \theta$. Montrer que $|\bar{z}| \leqslant 1$, puis que $0 \leqslant x \leqslant \dfrac{\theta + 1}{2} < 1{,}8$ et $0 \leqslant y \leqslant \dfrac{\theta + 1}{2\sqrt{2}} < 1{,}3$. En déduire que $z = 1$.

    **(c)** Soit $\eta \in \mathbb{Z}[\sqrt{2}]^{\times}$. Montrer qu'il existe $m \in \mathbb{Z}$ tel que $\theta^{m} \leqslant |\eta| < \theta^{m + 1}$, et considérer $|\eta|\theta^{-m}$. Conclure que $\mathbb{Z}[\sqrt{2}]^{\times} = \{\pm\theta^{m} ; m \in \mathbb{Z}\}$ et que $\mathbb{Z}[\sqrt{2}]^{\times} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}$.
  corrige: |
    **1.** C'est un sous-anneau de $\mathbb{R}$ : il contient $1$ et est stable par différence et par produit, car $(x + y\sqrt{2})(x' + y'\sqrt{2}) = (xx' + 2yy') + (xy' + x'y)\sqrt{2}$. Il est intègre comme sous-anneau d'un corps. L'écriture est unique, car $\sqrt{2}$ est irrationnel.

    **2. (a)** La conjugaison est bien définie par l'unicité de l'écriture. Elle est additive, et la formule du produit ci-dessus, où $\sqrt{2}$ est remplacé par $-\sqrt{2}$, montre qu'elle est multiplicative. Elle est involutive, donc bijective : c'est un automorphisme.

    **(b)** On calcule $z\bar{z} = x^{2} - 2y^{2} \in \mathbb{Z}$.

    Si $zw = 1$, alors $(z\bar{z})(w\bar{w}) = 1$ dans $\mathbb{Z}$, donc $z\bar{z} = \pm 1$. Réciproquement, si $z\bar{z} = \pm 1$, alors $z^{-1} = \pm\bar{z} \in \mathbb{Z}[\sqrt{2}]$.

    Comme $\theta\bar{\theta} = 1 - 2 = -1$, $\theta$ est inversible. Ses puissances $\theta^{m}$ sont deux à deux distinctes, puisque $\theta > 1$ : le groupe des inversibles est *infini*.

    **3.** Le stathme $s$ est multiplicatif, car la conjugaison l'est, et $s(z) = 0$ seulement pour $z = 0$. Soit $a$, $b \neq 0$ et $z = a/b = \alpha + \beta\sqrt{2}$, avec $\alpha$, $\beta \in \mathbb{Q}$ (on multiplie haut et bas par $\bar{b}$). Choisissons des entiers $m$, $n$ à distance au plus $\dfrac{1}{2}$ de $\alpha$, $\beta$, et $q = m + n\sqrt{2}$. Alors 
    $$|(\alpha - m)^{2} - 2(\beta - n)^{2}| \leqslant \max\Big(\frac{1}{4}, \frac{1}{2}\Big) < 1,$$
     car la valeur absolue de la différence de deux réels positifs est majorée par le plus grand. Le reste $r = a - bq$ vérifie $s(r) = s(b)\,|(\alpha - m)^{2} - 2(\beta - n)^{2}| < s(b)$.

    **4. (a)** $z + \bar{z} = 2x$ et $z - \bar{z} = 2y\sqrt{2}$.

    **(b)** Comme $|z\bar{z}| = 1$, $|\bar{z}| = 1/z \leqslant 1$. Donc $z + \bar{z} \geqslant 1 - 1 = 0$ et $z + \bar{z} < \theta + 1$ : $0 \leqslant x < \dfrac{\theta + 1}{2} \approx 1{,}71$. De même $z - \bar{z} \geqslant 0$ et $z - \bar{z} < \theta + 1$ : $0 \leqslant y < \dfrac{\theta + 1}{2\sqrt{2}} \approx 1{,}21$.

    Ainsi $x$, $y \in \{0, 1\}$, et $z \in \{0, 1, \sqrt{2}, 1 + \sqrt{2}\}$. Or $0$ et $\sqrt{2}$ ne sont pas inversibles ($\sqrt{2} \cdot (-\sqrt{2}) = -2$), et $1 + \sqrt{2} = \theta$ est exclu : $z = 1$.

    **(c)** Comme $|\eta| > 0$ et $\theta > 1$, l'entier $m = \Big\lfloor\dfrac{\ln|\eta|}{\ln\theta}\Big\rfloor$ vérifie $\theta^{m} \leqslant |\eta| < \theta^{m + 1}$. L'élément $z = |\eta|\theta^{-m} = \pm\eta\theta^{-m}$ est inversible et vérifie $1 \leqslant z < \theta$, donc $z = 1$ : $\eta = \pm\theta^{m}$.

    L'application $(\varepsilon, m) \mapsto (-1)^{\varepsilon}\theta^{m}$, de $\mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}$ dans $\mathbb{Z}[\sqrt{2}]^{\times}$, est un morphisme surjectif ; il est injectif, car $\pm\theta^{m} = 1$ impose $m = 0$ (puisque $\theta > 1$) puis le signe $+$. D'où $\boxed{\mathbb{Z}[\sqrt{2}]^{\times} \simeq \mathbb{Z}/2\mathbb{Z} \times \mathbb{Z}}$.

    1.5em

    ![Figure](documents/figures/f65f484ee2aa2961.svg)

    Chaque inversible $\pm\theta^{m} = x + y\sqrt{2}$ est représenté par le point $(x, y)$. Ces points sont les points entiers des deux hyperboles $x^{2} - 2y^{2} = \pm 1$ : les puissances paires de $\theta$ sur la bleue, les impaires sur l'orange. Ils s'écartent très vite de l'origine ($\theta^{3} = 7 + 5\sqrt{2}$), ce qui illustre la question 4 (c) : il n'y en a aucun entre $1$ et $\theta$.
