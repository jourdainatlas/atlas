  page_corrige: 4
  enonce: |
    On admet ici que $\mathbb{Z}[\mathrm{i}\sqrt{2}]$ est principal et que $\mathbb{Z}[\mathrm{i}\sqrt{2}]^{\times} = \{\pm 1\}$ (exercice 7).

    **1.** Soit $n \geqslant 2$ et $a$, $b$, $c$ des éléments d'un anneau factoriel $A$ tels que $b \wedge c = 1$ et $a^{n} = bc$. Montrer qu'il existe $b'$, $c' \in A$ et $u$, $v \in A^{\times}$ tels que $b = ub'^{\,n}$ et $c = vc'^{\,n}$.

    On suppose dans la suite que $x$ et $y$ sont des entiers tels que $y^{3} = x^{2} + 2$.

    **2.** **(a)** Prouver que $x$ est impair.

    **(b)** Soit $z \in \mathbb{Z}[\mathrm{i}\sqrt{2}]$ un diviseur commun de $x + \mathrm{i}\sqrt{2}$ et $x - \mathrm{i}\sqrt{2}$. Montrer que $z$ divise $2x$ et $2\mathrm{i}\sqrt{2}$, puis que $N(z)$ divise $4$.

    **(c)** Montrer que $x + \mathrm{i}\sqrt{2}$ et $x - \mathrm{i}\sqrt{2}$ sont premiers entre eux dans $\mathbb{Z}[\mathrm{i}\sqrt{2}]$.

    **3.** **(a)** Prouver qu'il existe $u$, $v \in \mathbb{Z}$ tels que $x + \mathrm{i}\sqrt{2} = (u + \mathrm{i} v\sqrt{2})^{3}$.

    **(b)** Montrer que $1 = v(3u^{2} - 2v^{2})$ et $x = u^{3} - 6uv^{2}$. En déduire que $v = \pm 1$.

    **(c)** Quelles sont les solutions $(x, y) \in \mathbb{Z}^{2}$ de l'équation $y^{3} = x^{2} + 2$ ?
  corrige: |
    **1.** Si $a = 0$, alors $bc = 0$, et l'un des deux est nul, l'autre inversible puisque $b \wedge c = 1$ : le résultat est clair. Sinon, pour tout irréductible $p$ du système de représentants, $v_{p}(b) + v_{p}(c) = n\,v_{p}(a)$.

    Comme $b \wedge c = 1$, l'une des deux valuations est nulle (cours, prop. 4) : chacune vaut $0$ ou $n\,v_{p}(a)$, et elle est multiple de $n$. Ainsi 
    $$b = u\prod_{p}p^{v_{p}(b)} = u\Big(\prod_{p}p^{v_{p}(b)/n}\Big)^{n} = ub'^{\,n},$$
     avec $u$ inversible, et de même pour $c$.

    **2. (a)** Si $x$ était pair, $x^{2} + 2 \equiv 2 \pmod{4}$ ; mais alors $y^{3}$ serait pair, donc $y$ pair et $y^{3} \equiv 0 \pmod{8}$, ce qui contredit $y^{3} \equiv 2 \pmod{4}$. Donc $x$ est impair.

    **(b)** $z$ divise la somme $2x$ et la différence $2\mathrm{i}\sqrt{2}$ des deux éléments. Donc $N(z)$ divise $N(2x) = 4x^{2}$ et $N(2\mathrm{i}\sqrt{2}) = 8$, donc leur pgcd, qui vaut $4$ puisque $x$ est impair.

    **(c)** $N(z)$ divise aussi $N(x + \mathrm{i}\sqrt{2}) = x^{2} + 2$, qui est impair. Comme $N(z) \mid 4$, $N(z) = 1$ et $z$ est inversible : les deux éléments sont premiers entre eux.

    **3. (a)** On a $(x + \mathrm{i}\sqrt{2})(x - \mathrm{i}\sqrt{2}) = x^{2} + 2 = y^{3}$, avec des facteurs premiers entre eux dans l'anneau factoriel $\mathbb{Z}[\mathrm{i}\sqrt{2}]$. Par la question 1, $x + \mathrm{i}\sqrt{2} = \pm w^{3}$, avec $w \in \mathbb{Z}[\mathrm{i}\sqrt{2}]$ ; comme $-1 = (-1)^{3}$, on peut absorber le signe : $x + \mathrm{i}\sqrt{2} = (u + \mathrm{i} v\sqrt{2})^{3}$.

    **(b)** En développant, 
    $$(u + \mathrm{i} v\sqrt{2})^{3} = (u^{3} - 6uv^{2}) + (3u^{2}v - 2v^{3})\,\mathrm{i}\sqrt{2}.$$
     L'unicité de l'écriture donne $x = u^{3} - 6uv^{2}$ et $1 = v(3u^{2} - 2v^{2})$. Donc $v$ divise $1$ : $v = \pm 1$.

    **(c)** Si $v = -1$, $3u^{2} - 2 = -1$ est impossible. Si $v = 1$, $3u^{2} - 2 = 1$, donc $u = \pm 1$, et $x = u(u^{2} - 6) = \mp 5$, $y^{3} = 27$. Les solutions sont $\boxed{(x, y) = (5, 3) \text{ et } (-5, 3)}$.

    1.5em

    ![Figure](documents/figures/35c720c8683e9970.svg)

    La courbe $y^{3} = x^{2} + 2$ passe près de nombreux points entiers, mais elle n'en contient que deux, $(\pm 5, 3)$, en rouge. Aucune considération de congruence ne permettrait de le voir : c'est la factorisation dans $\mathbb{Z}[\mathrm{i}\sqrt{2}]$, anneau factoriel, qui ramène l'équation à $1 = v(3u^{2} - 2v^{2})$.
