- id: "l3-sa-03-01"
  feuille: "f-l3-sa-03"
  numero: 1
  partie: "Divisibilité, éléments irréductibles et premiers"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [éléments irréductibles et premiers]
  noeuds: [ac-divisibilite, ac-factoriels]
  notions: [element-irreductible, element-premier]
  source: "examen du 15/12/2014, exercice 3 ; Exo7 (fic00030), exercice 7 (2)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $z = x + y\mathrm{i}$ et $w$ deux éléments de $\mathbb{Z}[\mathrm{i}]$.

    **1.** Montrer que $N(zw) = N(z)N(w)$ pour tous $z$, $w \in \mathbb{C}$.

    **2.** On sait (cours, prop. 2) que $z \mid w$ entraîne $N(z) \mid N(w)$. La réciproque est-elle vraie ?

    **3.** On sait que, si $N(z)$ est premier, $z$ est irréductible. La réciproque est-elle vraie ? *Considérer $z = 3$.*
  corrige: |
    **1.** $N(zw) = |zw|^{2} = |z|^{2}|w|^{2} = N(z)N(w)$.

    **2.** Non. Pour $z = 2 + \mathrm{i}$ et $w = 2 - \mathrm{i}$, on a $N(z) = N(w) = 5$, mais 
    $$\frac{w}{z} = \frac{(2 - \mathrm{i})^{2}}{5} = \frac{3 - 4\mathrm{i}}{5} \notin \mathbb{Z}[\mathrm{i}].$$
     La norme ne voit pas la différence entre $z$ et son conjugué : *c'est un outil pour démontrer qu'il n'y a pas divisibilité, jamais pour démontrer qu'il y en a une.*

    **3.** Non. On a $N(3) = 9$, qui n'est pas premier, et pourtant $3$ est irréductible.

    En effet, si $3 = zw$ avec $z$, $w$ non inversibles, alors $N(z)N(w) = 9$ avec $N(z)$, $N(w) > 1$ (cours, prop. 2), donc $N(z) = 3$. Or $x^{2} + y^{2} = 3$ n'a pas de solution, les carrés valant $0$ ou $1$ modulo $4$.

    L'exercice 11 montre que les irréductibles de $\mathbb{Z}[\mathrm{i}]$ sont exactement ceux dont la norme est un nombre premier, et les nombres premiers $p \equiv 3 \pmod{4}$, de norme $p^{2}$.
- id: "l3-sa-03-02"
