  source: "examen du 15/12/2014, exercice 6 (b)-(e)"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Soit $z \in \mathbb{Z}[\mathrm{i}]$ non nul. Montrer que l'anneau quotient $\mathbb{Z}[\mathrm{i}]/\langle z \rangle$ est fini. *On pourra utiliser la division euclidienne par $z$.*

    **2.** Soit $z$ un irréductible de $\mathbb{Z}[\mathrm{i}]$. Montrer que $\mathbb{Z}[\mathrm{i}]/\langle z \rangle$ est un corps.

    **3.** Parmi les éléments $1 + \mathrm{i}$, $2 + \mathrm{i}$, $2$, $3$, $5$, lesquels sont irréductibles dans $\mathbb{Z}[\mathrm{i}]$ ? Déterminer les anneaux quotients $\mathbb{Z}[\mathrm{i}]/\langle 2 + \mathrm{i} \rangle$, $\mathbb{Z}[\mathrm{i}]/\langle 3 \rangle$ et $\mathbb{Z}[\mathrm{i}]/\langle 5 \rangle$. *Pour le dernier, utiliser le lemme chinois.*

    **4.** *(Irréductibles de $\mathbb{Z}[\mathrm{i}]$.)* Soit $p$ un nombre premier.

    **(a)** Montrer que $p$ est irréductible dans $\mathbb{Z}[\mathrm{i}]$ si et seulement si $p$ n'est pas somme de deux carrés d'entiers.

    **(b)** Si $p \equiv 1 \pmod{4}$, il existe $a \in \mathbb{Z}$ tel que $p \mid a^{2} + 1$ (feuille 1, exercice 16). Montrer que $p$ ne divise ni $a + \mathrm{i}$ ni $a - \mathrm{i}$ dans $\mathbb{Z}[\mathrm{i}]$, et en déduire que $p$ est somme de deux carrés.

    **(c)** Montrer que, si $p \equiv 3 \pmod{4}$, $p$ n'est pas somme de deux carrés.

    **(d)** Soit $\pi$ un irréductible de $\mathbb{Z}[\mathrm{i}]$. Montrer que $\pi$ divise un unique nombre premier $p$, et que $N(\pi) = p$ ou $N(\pi) = p^{2}$. En déduire que, à association près, les irréductibles de $\mathbb{Z}[\mathrm{i}]$ sont $1 + \mathrm{i}$, les nombres premiers $p \equiv 3 \pmod{4}$, et les $a + b\mathrm{i}$ tels que $a^{2} + b^{2}$ soit un nombre premier $p \equiv 1 \pmod{4}$.
  corrige: |
    **1.** L'anneau $\mathbb{Z}[\mathrm{i}]$ est euclidien pour $N$ (cours, prop. 7). Tout $w$ s'écrit $w = qz + r$ avec $N(r) < N(z)$, donc chaque classe modulo $\langle z \rangle$ contient un élément de norme $< N(z)$. Ces éléments sont en nombre fini (points entiers d'un disque) : le quotient est fini.

    **2.** L'anneau $\mathbb{Z}[\mathrm{i}]$ est principal, et l'idéal engendré par un irréductible y est maximal (cours, th. 2) : le quotient est un corps. On peut aussi dire : $\langle z \rangle$ est premier, le quotient est intègre et fini, donc c'est un corps (chapitre 1, th. 4).

    **3.** *Irréductibilité.* $1 + \mathrm{i}$ et $2 + \mathrm{i}$ sont de normes $2$ et $5$, premières : ils sont irréductibles. $3$ est irréductible (exercice 1). En revanche $2 = -\mathrm{i}(1 + \mathrm{i})^{2}$ et $5 = (2 + \mathrm{i})(2 - \mathrm{i})$ ne le sont pas.

    $\triangleright$ *$\mathbb{Z}[\mathrm{i}]/\langle 2 + \mathrm{i} \rangle$.* Modulo $2 + \mathrm{i}$, $\mathrm{i} \equiv -2$, donc $a + b\mathrm{i} \equiv a - 2b$ : le morphisme $\mathbb{Z} \to \mathbb{Z}[\mathrm{i}]/\langle 2 + \mathrm{i} \rangle$ est surjectif. Son noyau contient $5 = (2 + \mathrm{i})(2 - \mathrm{i})$ et ne contient pas $1$, $2 + \mathrm{i}$ n'étant pas inversible : c'est $5\mathbb{Z}$. Ainsi $\boxed{\mathbb{Z}[\mathrm{i}]/\langle 2 + \mathrm{i} \rangle \simeq \mathbb{F}_{5}}$, comme l'annonçait le chapitre 2 du cours.

    $\triangleright$ *$\mathbb{Z}[\mathrm{i}]/\langle 3 \rangle$.* Par $\mathbb{Z}[\mathrm{i}] \simeq \mathbb{Z}[X]/\langle X^{2} + 1 \rangle$ et la feuille 2 (exercices 5 et 7), 
    $$\mathbb{Z}[\mathrm{i}]/\langle 3 \rangle \simeq \mathbb{Z}[X]/\langle 3, X^{2} + 1 \rangle \simeq \mathbb{F}_{3}[X]/\langle X^{2} + 1 \rangle :$$
     c'est un corps à $9$ éléments, le corps $\mathbb{F}_{3}[\mathrm{i}]$ de la feuille 1 (exercice 18).

    $\triangleright$ *$\mathbb{Z}[\mathrm{i}]/\langle 5 \rangle$.* Les irréductibles $2 + \mathrm{i}$ et $2 - \mathrm{i}$ ne sont pas associés : les associés de $2 - \mathrm{i}$ sont $\pm(2 - \mathrm{i})$ et $\pm(1 + 2\mathrm{i})$. Ils sont donc premiers entre eux, et $\langle 2 + \mathrm{i} \rangle + \langle 2 - \mathrm{i} \rangle = \mathbb{Z}[\mathrm{i}]$ (cours, prop. 6). Le lemme chinois donne 
    $$\mathbb{Z}[\mathrm{i}]/\langle 5 \rangle \simeq \mathbb{Z}[\mathrm{i}]/\langle 2 + \mathrm{i} \rangle \times \mathbb{Z}[\mathrm{i}]/\langle 2 - \mathrm{i} \rangle \simeq \boxed{\mathbb{F}_{5} \times \mathbb{F}_{5}},$$
     qui n'est pas un corps.

    **4. (a)** Le nombre premier $p$ n'est pas inversible. S'il s'écrit $p = zw$ avec $z$, $w$ non inversibles, alors $N(z)N(w) = p^{2}$ avec $N(z)$, $N(w) > 1$, donc $N(z) = p$ : $p = a^{2} + b^{2}$. Réciproquement, si $p = a^{2} + b^{2}$, alors $p = (a + b\mathrm{i})(a - b\mathrm{i})$, avec deux facteurs de norme $p > 1$.

    **(b)** On a $p \mid a^{2} + 1 = (a + \mathrm{i})(a - \mathrm{i})$. Mais $p \nmid a \pm \mathrm{i}$, puisque $\dfrac{a \pm \mathrm{i}}{p}$ a une partie imaginaire $\pm\dfrac{1}{p} \notin \mathbb{Z}$. Donc $p$ n'est pas premier dans $\mathbb{Z}[\mathrm{i}]$ ; cet anneau étant factoriel, $p$ n'est pas irréductible (cours, th. 1), et $p$ est somme de deux carrés par (a).

    **(c)** Les carrés valent $0$ ou $1$ modulo $4$, donc une somme de deux carrés n'est jamais $\equiv 3 \pmod{4}$.

    **(d)** Soit $\pi$ irréductible. Il divise $N(\pi) = \pi\bar{\pi}$, entier $\geqslant 2$, produit de nombres premiers ; $\pi$ étant premier (anneau factoriel), il divise l'un d'eux, $p$. Il n'en divise pas deux distincts $p$ et $q$, sinon il diviserait $1 = up + vq$.

    Comme $\pi \mid p$, $N(\pi) \mid p^{2}$ : $N(\pi) = p$ ou $N(\pi) = p^{2}$.

    • Si $N(\pi) = p^{2}$, alors $p = \pi w$ avec $N(w) = 1$ : $\pi \sim p$, et $p$ est irréductible. Par (a), (b), (c), et comme $2 = 1 + 1$, c'est que $p \equiv 3 \pmod{4}$.

    • Si $N(\pi) = p$, alors $\pi = a + b\mathrm{i}$ avec $a^{2} + b^{2} = p$. Pour $p = 2$, $\pi \in \{\pm 1 \pm \mathrm{i}\}$ est associé à $1 + \mathrm{i}$ ; sinon $p \equiv 1 \pmod{4}$ par (c).

    Réciproquement, ces éléments sont irréductibles, par (a) et (c) pour les premiers $p \equiv 3 \pmod{4}$, et parce que leur norme est première pour les autres. D'où la liste annoncée. *C'est la caractérisation promise au chapitre 3 du cours* ; elle donne bien les $140$ irréductibles de la figure de sa page 1.

    1.5em

    ![Figure](documents/figures/0d6baabc652f4a9b.svg)

    Les nombres premiers jusqu'à $41$ se répartissent en trois familles dans $\mathbb{Z}[\mathrm{i}]$ : $2$, seul à être, à un inversible près, le carré d'un irréductible ; les $p \equiv 1 \pmod{4}$, en bleu, qui se décomposent en deux irréductibles conjugués non associés ; les $p \equiv 3 \pmod{4}$, en orange, qui restent irréductibles.

