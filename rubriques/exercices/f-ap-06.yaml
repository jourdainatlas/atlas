- id: "ap-06-01"
  feuille: "f-ap-06"
  numero: 1
  partie: "Espaces vectoriels : généralités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces vectoriels, axiomes, espaces de suites]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les ensembles suivants, munis des lois indiquées, sont-ils des espaces vectoriels ? Le cas échéant, préciser sur quel corps ; sinon, indiquer quel axiome échoue.

    **1.** $\mathbb{R}^{2}$, muni des lois usuelles, comme $\mathbb{R}$-espace vectoriel.

    **2.** $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$, muni des opérations point par point, comme $\mathbb{R}$-espace vectoriel.

    **3.** $\mathcal{S}(\mathbb{R})$, l'ensemble des suites réelles, comme $\mathbb{R}$-espace vectoriel.

    **4.** $\mathbb{R}_{+}$, muni de l'addition et de la multiplication usuelles, comme $\mathbb{R}$-espace vectoriel.

    **5.** $\mathbb{Q}$, muni de l'addition et de la multiplication usuelles, comme $\mathbb{R}$-espace vectoriel.

    **6.** $\mathbb{R}$, muni de l'addition et de la multiplication usuelles, comme $\mathbb{Q}$-espace vectoriel.
  corrige: |
    **1.** L'addition fait de $\mathbb{R}^{2}$ un groupe abélien, et les quatre axiomes de la loi externe se vérifient coordonnée par coordonnée à partir de ceux de $\mathbb{R}$. 
    $$\boxed{\mathbb{R}^{2} \text{ est un } \mathbb{R}\text{-espace vectoriel.}}$$

    **2.** Les opérations étant définies point par point, chaque axiome se ramène à une égalité de réels, vraie en chaque point. 
    $$\boxed{\mathcal{F}(\mathbb{R}\,;\mathbb{R}) \text{ est un } \mathbb{R}\text{-espace vectoriel.}}$$

    **3.** Une suite réelle n'est rien d'autre qu'une application de $\mathbb{N}$ dans $\mathbb{R}$ : c'est le cas particulier $I=\mathbb{N}$ de l'exemple précédent. 
    $$\boxed{\mathcal{S}(\mathbb{R}) \text{ est un } \mathbb{R}\text{-espace vectoriel.}}$$

    **4.** La loi externe devrait être une application de $\mathbb{R} \times \mathbb{R}_{+}$ dans $\mathbb{R}_{+}$. Or $(-1) \cdot 1 = -1 \notin \mathbb{R}_{+}$ : elle n'est même pas définie. De plus $(\mathbb{R}_{+}\,;+)$ n'est pas un groupe, puisque $1$ n'y admet pas d'opposé. 
    $$\boxed{\text{Non : la loi externe n'est pas à valeurs dans } \mathbb{R}_{+}, \text{ et l'axiome \textbf{A} échoue.}}$$

    **5.** La loi externe devrait être une application de $\mathbb{R} \times \mathbb{Q}$ dans $\mathbb{Q}$. Or $\sqrt{2} \cdot 1 = \sqrt{2} \notin \mathbb{Q}$. 
    $$\boxed{\text{Non : la loi externe n'est pas définie.}}$$

    **6.** L'ensemble $(\mathbb{R}\,;+)$ est un groupe abélien, la multiplication définit bien une application de $\mathbb{Q} \times \mathbb{R}$ dans $\mathbb{R}$, et les quatre axiomes découlent des règles de calcul dans le corps $\mathbb{R}$. 
    $$\boxed{\mathbb{R} \text{ est un } \mathbb{Q}\text{-espace vectoriel.}}$$
     *Piège :* les questions 5 et 6 portent sur le même ensemble et la même multiplication. C'est le *corps des scalaires* qui change tout, et cette structure est étudiée à l'exercice 21.
- id: "ap-06-02"
  feuille: "f-ap-06"
  numero: 2
  partie: "Espaces vectoriels : généralités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [espaces vectoriels]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $E$ un $K$-espace vectoriel, $\lambda \in K$ et $x \in E$.

    **1.** Démontrer que $0_{K} \cdot x = 0_{E}$. On pourra partir de $0_{K}=0_{K}+0_{K}$.

    **2.** Démontrer que $\lambda \cdot 0_{E} = 0_{E}$.

    **3.** Démontrer que $(-1_{K}) \cdot x = -x$.

    **4.** Démontrer que $\lambda \cdot x = 0_{E}$ entraîne $\lambda = 0_{K}$ ou $x = 0_{E}$. Où l'hypothèse « $K$ est un corps » intervient-elle ?
  corrige: |
    **1.** On part de $0_{K}=0_{K}+0_{K}$ et l'on applique la distributivité par rapport à l'addition des scalaires : 
    $$0_{K} \cdot x = \big(0_{K}+0_{K}\big) \cdot x = 0_{K} \cdot x+0_{K} \cdot x$$
     Comme $(E\,;+)$ est un groupe, on simplifie par $0_{K} \cdot x$ : 
    $$\boxed{0_{K} \cdot x = 0_{E}}$$

    **2.** On procède de la même manière, avec cette fois la distributivité par rapport à l'addition des vecteurs : 
    $$\lambda \cdot 0_{E} = \lambda \cdot \big(0_{E}+0_{E}\big) = \lambda \cdot 0_{E}+\lambda \cdot 0_{E} \qquad\text{d'où}\qquad \boxed{\lambda \cdot 0_{E} = 0_{E}}$$

    **3.** On calcule, en utilisant l'axiome **N** puis la question 1 : 
    $$x+(-1_{K}) \cdot x = 1_{K} \cdot x+(-1_{K}) \cdot x = \big(1_{K}+(-1_{K})\big) \cdot x = 0_{K} \cdot x = 0_{E}$$
     Donc $(-1_{K}) \cdot x$ est l'opposé de $x$ dans le groupe $(E\,;+)$ : 
    $$\boxed{(-1_{K}) \cdot x = -x}$$

    **4.** Supposons $\lambda \cdot x = 0_{E}$ et $\lambda \neq 0_{K}$. Comme $K$ est un corps, $\lambda$ est inversible, et : 
    $$x = 1_{K} \cdot x = \big(\lambda^{-1}\lambda\big) \cdot x = \lambda^{-1} \cdot \big(\lambda \cdot x\big) = \lambda^{-1} \cdot 0_{E} = 0_{E}$$
     en utilisant successivement les axiomes **N** et **A**, puis la question 2. 
    $$\boxed{\lambda \cdot x = 0_{E} \;\Longrightarrow\; \lambda = 0_{K} \text{ ou } x = 0_{E}}$$

    $$\boxed{\text{L'hypothèse «\,}{K}\text{ est un corps\,» sert exactement à disposer de } \lambda^{-1}.}$$
- id: "ap-06-03"
  feuille: "f-ap-06"
  numero: 3
  partie: "Espaces vectoriels : généralités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espaces vectoriels, axiomes]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On munit $\mathbb{R}^{2}$ de lois inhabituelles. Dans chaque cas, déterminer si l'on obtient un $\mathbb{R}$-espace vectoriel, en identifiant précisément l'axiome qui échoue le cas échéant.

    **1.** L'addition usuelle et la loi externe $\lambda \star (x\,;y) = (\lambda x \,;\, y)$.

    **2.** La loi externe usuelle et l'addition $(x\,;y) \boxplus (x'\,;y') = (x+x' \,;\, 0)$.

    **3.** L'addition usuelle et la loi externe $\lambda \star (x\,;y) = \big(\lambda^{2}x \,;\, \lambda^{2}y\big)$.
  corrige: |
    **1.** L'addition étant l'addition usuelle, $(\mathbb{R}^{2}\,;+)$ est bien un groupe abélien. On vérifie ensuite :

    • $1 \star (x\,;y)=(x\,;y)$ : l'axiome **N** est vérifié ;

    • $(\lambda\mu) \star (x\,;y)=(\lambda\mu x \,;\, y)=\lambda \star \big(\mu \star (x\,;y)\big)$ : l'axiome **A** est vérifié ;

    • $\lambda \star \big((x\,;y)+(x'\,;y')\big)=\big(\lambda(x+x') \,;\, y+y'\big)=\lambda \star (x\,;y)+\lambda \star (x'\,;y')$ : la distributivité sur l'addition des vecteurs est vérifiée.

    En revanche, avec $\lambda=\mu=1$ et $(x\,;y)=(0\,;1)$ : 
    $$(1+1) \star (0\,;1)=(0\,;1) \qquad\text{tandis que}\qquad 1 \star (0\,;1)+1 \star (0\,;1)=(0\,;2)$$

    $$\boxed{\text{Non : la distributivité sur l'addition des \emph{scalaires} échoue.}}$$

    **2.** La loi $\boxplus$ est bien interne, commutative et associative, mais elle n'admet aucun neutre : pour tout couple $(e\,;f)$, on a $(x\,;y) \boxplus (e\,;f)=(x+e \,;\, 0)$, qui ne vaut $(x\,;y)$ que si $y=0$. 
    $$\boxed{\text{Non : } (\mathbb{R}^{2} \,;\boxplus) \text{ n'est pas un groupe, l'axiome \textbf{A} échoue.}}$$

    **3.** Les axiomes **N** et **A** sont vérifiés, puisque $1^{2}=1$ et $(\lambda\mu)^{2}=\lambda^{2}\mu^{2}$, ainsi que la distributivité sur l'addition des vecteurs. Mais avec $\lambda=\mu=1$ et $u=(1\,;0)$ : 
    $$(1+1) \star u=(4\,;0) \qquad\text{tandis que}\qquad 1 \star u+1 \star u=(2\,;0)$$
     En effet $(\lambda+\mu)^{2}-\big(\lambda^{2}+\mu^{2}\big)=2\lambda\mu$, qui n'est pas nul en général. 
    $$\boxed{\text{Non : le même axiome qu'à la question 1 échoue.}}$$
     *Remarque :* les questions 1 et 3 échouent toutes deux sur la distributivité par rapport à l'addition des scalaires. C'est l'axiome que l'on oublie le plus volontiers de vérifier, parce qu'il fait intervenir les *deux* additions à la fois — celle de $K$ à gauche, celle de $E$ à droite.
- id: "ap-06-04"
  feuille: "f-ap-06"
  numero: 4
  partie: "Sous-espaces vectoriels"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels]
  noeuds: [v-espace]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Les quatre parties de $\mathbb{R}^{2}$ représentées ci-dessous sont-elles des sous-espaces vectoriels de $\mathbb{R}^{2}$ ? Justifier à chaque fois par un argument de nature géométrique.

    ![Figure](documents/figures/b820f8aee220bd57.svg)

    ![Figure](documents/figures/b86e24e5f72452c0.svg)

    ![Figure](documents/figures/ab8fdf4ace8e7c2b.svg)

    ![Figure](documents/figures/555549f3233859f5.svg)

    Le point rouge marque l'origine ; le dernier dessin représente le demi-plan $y \geqslant 0$.
  corrige: |
    Le réflexe est celui du cours : un sous-espace vectoriel contient toujours $0_{E}$.

    **(a)** La droite passe par l'origine, et elle est stable par addition et par multiplication externe : additionner deux vecteurs portés par une même droite, ou en étirer un, ne fait pas sortir de la droite. 
    $$\boxed{\text{C'est un sous-espace vectoriel.}}$$

    **(b)** La réunion contient l'origine, mais elle n'est pas stable : en additionnant un vecteur non nul de chaque droite, on obtient un vecteur qui n'appartient à aucune des deux. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel.}}$$
     C'est exactement la figure du cours illustrant que la réunion de deux sous-espaces n'en est presque jamais un.

    **(c)** La droite ne passe pas par l'origine. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel : } 0_{E} \notin F.}$$

    **(d)** Le demi-plan contient l'origine et est stable par addition, mais pas par multiplication externe : le vecteur $(0\,;1)$ y appartient, alors que $(-1) \cdot (0\,;1)=(0\,;-1)$ n'y appartient pas. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel.}}$$
     *Piège :* contenir $0_{E}$ et être stable par addition ne suffit pas. Le dernier exemple montre qu'il faut aussi tester la multiplication par un scalaire *négatif*.
- id: "ap-06-05"
  feuille: "f-ap-06"
  numero: 5
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, espaces de suites]
  noeuds: [v-espace]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Dans chacun des cas suivants, l'ensemble $F$ est-il un sous-espace vectoriel de $E$ ?

    **1.** $E=\mathbb{R}^{2}$ et $F=\big\{(x\,;y) \in E \;\big|\; ax+by+c=0\big\}$, où $a$, $b$ et $c$ sont trois réels fixés.

    **2.** $E=\mathbb{R}^{3}$ et $F=\big\{(x\,;y\,;z) \in E \;\big|\; x+y+3z=0\big\}$.

    **3.** $E=\mathbb{R}^{3}$ et $F=\big\{(x\,;y\,;z) \in E \;\big|\; x+y+3z=2\big\}$.

    **4.** $E=\mathbb{R}^{2}$ et $F=\big\{(x\,;y) \in E \;\big|\; xy=0\big\}$.

    **5.** $E=\mathcal{S}(\mathbb{R})$ et $F$ est l'ensemble des suites convergentes.

    **6.** $E=\mathcal{S}(\mathbb{R})$ et $F$ est l'ensemble des suites convergeant vers $\alpha$, où $\alpha$ est un réel fixé.

    **7.** $E=\mathcal{S}(\mathbb{R})$ et $F$ est l'ensemble des suites tendant vers $+\infty$.

    **8.** $E=\mathcal{S}(\mathbb{C})$ et $F=\big\{(x_{n}) \in E \;\big|\; \forall n \in \mathbb{N}, \; x_{n+2}=5x_{n+1}-2x_{n}\big\}$.

    **9.** $E=\mathcal{F}\big([0\,;1]\,;\mathbb{R}\big)$ et $F=\big\{f \in E \;\big|\; f(0)=\pi f(1)\big\}$.
  corrige: |
    **1.** Le couple $(0\,;0)$ appartient à $F$ si et seulement si $c=0$. Réciproquement, lorsque $c=0$, soient $\lambda \in \mathbb{R}$ et $(x\,;y)$, $(x'\,;y')$ dans $F$ : 
    $$a(\lambda x+x')+b(\lambda y+y')=\lambda(ax+by)+(ax'+by')=0$$

    $$\boxed{F \text{ est un sous-espace vectoriel si et seulement si } c=0.}$$

    **2.** L'équation est linéaire et homogène, et le même calcul s'applique. 
    $$\boxed{F \text{ est un sous-espace vectoriel de } \mathbb{R}^{3}.}$$

    **3.** On a $0+0+3 \times 0=0 \neq 2$. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel : } 0_{E} \notin F.}$$

    **4.** Les vecteurs $(1\,;0)$ et $(0\,;1)$ appartiennent à $F$, mais leur somme $(1\,;1)$ vérifie $xy=1 \neq 0$. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel : } F \text{ n'est pas stable par addition.}}$$

    **5.** La suite nulle converge. Et si $(x_{n})$ et $(y_{n})$ convergent, il en va de même de $\lambda(x_{n})+(y_{n})$, par linéarité de la limite. 
    $$\boxed{F \text{ est un sous-espace vectoriel de } \mathcal{S}(\mathbb{R}).}$$

    **6.** La suite nulle converge vers $0$, et non vers $\alpha$ si $\alpha \neq 0$. Réciproquement, si $\alpha=0$, l'ensemble des suites de limite nulle est stable par combinaison linéaire. 
    $$\boxed{F \text{ est un sous-espace vectoriel si et seulement si } \alpha=0.}$$

    **7.** La suite nulle ne tend pas vers $+\infty$. De plus, si $(x_{n})$ tend vers $+\infty$, alors $(-1) \cdot (x_{n})$ tend vers $-\infty$. 
    $$\boxed{\text{Ce n'est pas un sous-espace vectoriel.}}$$

    **8.** La suite nulle vérifie la relation. Et si $(x_{n})$ et $(y_{n})$ la vérifient, alors pour tout $n$ : 
    $$(\lambda x+y)_{n+2}=\lambda x_{n+2}+y_{n+2}=\lambda\big(5x_{n+1}-2x_{n}\big)+\big(5y_{n+1}-2y_{n}\big)=5(\lambda x+y)_{n+1}-2(\lambda x+y)_{n}$$

    $$\boxed{F \text{ est un sous-espace vectoriel de } \mathcal{S}(\mathbb{C}).}$$

    **9.** La fonction nulle convient, et pour $f$, $g$ dans $F$ : 
    $$(\lambda f+g)(0)=\lambda f(0)+g(0)=\lambda \pi f(1)+\pi g(1)=\pi\,(\lambda f+g)(1)$$

    $$\boxed{F \text{ est un sous-espace vectoriel de } \mathcal{F}\big([0\,;1]\,;\mathbb{R}\big).}$$

    *Piège :* les questions 1, 3, 6 et 7 échouent toutes pour la même raison — une condition *non homogène*, qui exclut le vecteur nul. C'est le premier test à effectuer.
- id: "ap-06-06"
  feuille: "f-ap-06"
  numero: 6
  partie: "Sous-espaces vectoriels"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, espaces de fonctions]
  noeuds: [v-espace]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Parmi les parties suivantes de $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$, lesquelles sont des sous-espaces vectoriels ?

    **1.** les fonctions paires

    **2.** les fonctions impaires

    **3.** les fonctions croissantes

    **4.** les fonctions bornées

    **5.** les fonctions positives

    **6.** $\big\{f \;\big|\; f(1)=0\big\}$

    **7.** $\big\{f \;\big|\; f(1)=1\big\}$

    **8.** les fonctions polynomiales de degré inférieur ou égal à $2$
  corrige: |
    **1.** La fonction nulle est paire, et si $f$ et $g$ le sont, alors $(\lambda f+g)(-x)=\lambda f(-x)+g(-x)=\lambda f(x)+g(x)=(\lambda f+g)(x)$. $\boxed{\text{Sous-espace vectoriel.}}$

    **2.** Le même calcul, avec un signe $-$ des deux côtés, s'applique. $\boxed{\text{Sous-espace vectoriel.}}$

    **3.** La fonction $\mathrm{Id}_{\mathbb{R}}$ est croissante, mais $(-1) \cdot \mathrm{Id}_{\mathbb{R}}$ est décroissante. $\boxed{\text{Non.}}$

    **4.** La fonction nulle est bornée, et si $|f| \leqslant M$ et $|g| \leqslant M'$, alors $|\lambda f+g| \leqslant |\lambda|M+M'$. $\boxed{\text{Sous-espace vectoriel.}}$

    **5.** La fonction constante égale à $1$ est positive, mais son opposée ne l'est pas. $\boxed{\text{Non.}}$

    **6.** La fonction nulle convient, et $(\lambda f+g)(1)=\lambda f(1)+g(1)=0$. $\boxed{\text{Sous-espace vectoriel.}}$

    **7.** La fonction nulle ne vérifie pas $f(1)=1$. $\boxed{\text{Non.}}$

    **8.** Cet ensemble n'est autre que $\mathrm{Vect}\big(x \mapsto 1 \,;\, x \mapsto x \,;\, x \mapsto x^{2}\big)$, donc un sous-espace vectoriel d'après l'exercice 7. $\boxed{\text{Sous-espace vectoriel.}}$

    *Piège de la question 8 :* l'ensemble des fonctions polynomiales de degré *exactement* $2$ n'en serait pas un — il ne contient pas la fonction nulle, et la somme de $x \mapsto x^{2}$ et de $x \mapsto -x^{2}+x$ est de degré $1$.
- id: "ap-06-07"
  feuille: "f-ap-06"
  numero: 7
  partie: "Sous-espaces vectoriels"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, familles génératrices]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel, sous-espace-vectoriel, famille-generatrice]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soient $E$ un $K$-espace vectoriel et $u$, $v$ deux vecteurs de $E$. On note : 
    $$\mathrm{Vect}(u\,;v)=\big\{\lambda u+\mu v \;\big|\; (\lambda\,;\mu) \in K^{2}\big\}$$

    **1.** Démontrer que $\mathrm{Vect}(u\,;v)$ est un sous-espace vectoriel de $E$, dont $(u\,;v)$ est une famille génératrice.

    **2.** Démontrer que tout sous-espace vectoriel de $E$ contenant $u$ et $v$ contient $\mathrm{Vect}(u\,;v)$.

    **3.** Dans $\mathbb{R}^{3}$, décrire $\mathrm{Vect}\big((1\,;0\,;1)\,;(0\,;1\,;1)\big)$ par une équation cartésienne.

    **4.** Dans $\mathbb{R}^{3}$, décrire $\mathrm{Vect}\big((1\,;2\,;3)\,;(2\,;4\,;6)\big)$. Que remarque-t-on ?
  corrige: |
    **1.** On a $\mathrm{Vect}(u\,;v) \subset E$, et $0_{E}=0_{K} \cdot u+0_{K} \cdot v$ en appartient. Soient ensuite $\lambda \in K$ et deux éléments $au+bv$ et $a'u+b'v$ : 
    $$\lambda(au+bv)+(a'u+b'v)=(\lambda a+a')\,u+(\lambda b+b')\,v \in \mathrm{Vect}(u\,;v)$$
     Enfin, tout élément de $\mathrm{Vect}(u\,;v)$ est par définition une combinaison linéaire de $u$ et $v$. 
    $$\boxed{\mathrm{Vect}(u\,;v) \text{ est un sous-espace vectoriel de } E, \text{ dont } (u\,;v) \text{ est une famille génératrice.}}$$

    **2.** Soit $W$ un sous-espace vectoriel contenant $u$ et $v$, et soit $\lambda u+\mu v$ un élément de $\mathrm{Vect}(u\,;v)$. Comme $W$ est stable par multiplication externe, $\lambda u \in W$ et $\mu v \in W$ ; comme il est stable par addition, leur somme y appartient. 
    $$\boxed{\mathrm{Vect}(u\,;v) \subset W}$$
     Autrement dit, $\mathrm{Vect}(u\,;v)$ est le *plus petit* sous-espace vectoriel contenant $u$ et $v$.

    **3.** On calcule la combinaison générale : 
    $$\lambda\,(1\,;0\,;1)+\mu\,(0\,;1\,;1)=\big(\lambda \,;\, \mu \,;\, \lambda+\mu\big)$$
     Un tel vecteur vérifie $z=x+y$. Réciproquement, si $z=x+y$, le choix $\lambda=x$ et $\mu=y$ convient. 
    $$\boxed{\mathrm{Vect}\big((1\,;0\,;1)\,;(0\,;1\,;1)\big)=\big\{(x\,;y\,;z) \in \mathbb{R}^{3} \;\big|\; z=x+y\big\}}$$
     C'est donc un plan vectoriel de $\mathbb{R}^{3}$.

    **4.** On remarque que $(2\,;4\,;6)=2 \times (1\,;2\,;3)$ : le second vecteur est colinéaire au premier, et n'apporte rien. 
    $$\boxed{\mathrm{Vect}\big((1\,;2\,;3)\,;(2\,;4\,;6)\big)=\mathrm{Vect}\big((1\,;2\,;3)\big)=\big\{(t\,;2t\,;3t) \;\big|\; t \in \mathbb{R}\big\}}$$
     Deux vecteurs peuvent donc n'engendrer qu'une droite : le nombre de vecteurs d'une famille génératrice ne dit rien de la « taille » de l'espace engendré. C'est précisément ce que la notion de famille libre viendra corriger.
- id: "ap-06-08"
  feuille: "f-ap-06"
  numero: 8
  partie: "Opérations sur les sous-espaces"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, opérations sur les sous-espaces]
  noeuds: [v-espace, v-somme-directe]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Dans $\mathbb{R}^{3}$, on considère les trois parties suivantes : 
    $$F=\big\{(x\,;y\,;z) \in \mathbb{R}^{3} \;\big|\; x+y+z=0\big\} \qquad G=\mathrm{Vect}\big((1\,;1\,;1)\big) \qquad H=\big\{(x\,;y\,;z) \in \mathbb{R}^{3} \;\big|\; z=0\big\}$$

    **1.** Justifier que $F$, $G$ et $H$ sont des sous-espaces vectoriels de $\mathbb{R}^{3}$.

    **2.** Déterminer $F \cap G$, puis $F \cap H$.

    **3.** L'ensemble $F \cup G$ est-il un sous-espace vectoriel de $\mathbb{R}^{3}$ ? On exhibera un contre-exemple explicite.

    **4.** Démontrer que $F+G=\mathbb{R}^{3}$, en donnant pour tout $(x\,;y\,;z)$ une décomposition explicite.
  corrige: |
    **1.** Les ensembles $F$ et $H$ sont définis par une équation linéaire homogène : le calcul de l'exercice 5 s'applique. Quant à $G$, c'est un $\mathrm{Vect}$, donc un sous-espace d'après l'exercice 7. 
    $$\boxed{F, \; G \text{ et } H \text{ sont des sous-espaces vectoriels de } \mathbb{R}^{3}.}$$

    **2.** Un élément de $G$ s'écrit $(t\,;t\,;t)$. Il appartient à $F$ si et seulement si $3t=0$, c'est-à-dire $t=0$. Pour $F \cap H$, on résout le système $x+y+z=0$ et $z=0$, qui donne $y=-x$. 
    $$\boxed{F \cap G=\big\{(0\,;0\,;0)\big\} \qquad\text{et}\qquad F \cap H=\mathrm{Vect}\big((1\,;-1\,;0)\big)}$$

    **3.** Le vecteur $(1\,;-1\,;0)$ appartient à $F$ et $(1\,;1\,;1)$ appartient à $G$. Leur somme vaut $(2\,;0\,;1)$, dont la somme des coordonnées vaut $3 \neq 0$ : elle n'appartient pas à $F$. Et elle n'est pas colinéaire à $(1\,;1\,;1)$, donc n'appartient pas à $G$. 
    $$\boxed{F \cup G \text{ n'est pas stable par addition : ce n'est pas un sous-espace vectoriel.}}$$

    **4.** Soit $(x\,;y\,;z) \in \mathbb{R}^{3}$. Posons $s=\dfrac{x+y+z}{3}$ et écrivons : 
    $$(x\,;y\,;z)=\underbrace{(x-s \,;\, y-s \,;\, z-s)}_{\in \, F}+\underbrace{(s\,;s\,;s)}_{\in \, G}$$
     Le premier vecteur appartient bien à $F$, puisque la somme de ses coordonnées vaut $x+y+z-3s=0$. 
    $$\boxed{F+G=\mathbb{R}^{3}}$$
- id: "ap-06-09"
  feuille: "f-ap-06"
  numero: 9
  partie: "Opérations sur les sous-espaces"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, opérations sur les sous-espaces]
  noeuds: [v-espace, v-somme-directe]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soient $F$ et $G$ deux sous-espaces vectoriels d'un $K$-espace vectoriel $E$.

    **1.** Démontrer que $F \subset F+G$ et $G \subset F+G$.

    **2.** Soit $H$ un sous-espace vectoriel de $E$ contenant $F$ et $G$. Démontrer que $F+G \subset H$.

    **3.** Conclure : $F+G$ est le plus petit sous-espace vectoriel de $E$ contenant $F \cup G$.

    **4.** En déduire que $F+G=F$ si et seulement si $G \subset F$.
  corrige: |
    **1.** Soit $x \in F$. Comme $0_{E} \in G$, on peut écrire $x=x+0_{E}$ avec $x \in F$ et $0_{E} \in G$, donc $x \in F+G$. Le raisonnement est symétrique pour $G$. 
    $$\boxed{F \subset F+G \qquad\text{et}\qquad G \subset F+G}$$

    **2.** Soit $x \in F+G$ : il existe $a \in F$ et $b \in G$ tels que $x=a+b$. Comme $F \subset H$ et $G \subset H$, on a $a \in H$ et $b \in H$ ; et $H$ étant un sous-espace vectoriel, il est stable par addition. 
    $$\boxed{F+G \subset H}$$

    **3.** L'ensemble $F+G$ est un sous-espace vectoriel d'après la proposition 2, il contient $F \cup G$ d'après la question 1, et tout sous-espace contenant $F \cup G$ le contient d'après la question 2. 
    $$\boxed{F+G \text{ est le plus petit sous-espace vectoriel de } E \text{ contenant } F \cup G.}$$

    **4.** Si $F+G=F$, alors $G \subset F+G=F$ d'après la question 1. Réciproquement, si $G \subset F$, la question 2 appliquée avec $H=F$ donne $F+G \subset F$, et l'inclusion réciproque vient de la question 1. 
    $$\boxed{F+G=F \iff G \subset F}$$
- id: "ap-06-10"
  feuille: "f-ap-06"
  numero: 10
  partie: "Opérations sur les sous-espaces"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, opérations sur les sous-espaces]
  noeuds: [v-espace, v-somme-directe]
  notions: [espace-vectoriel, sous-espace-vectoriel]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soient $F$, $G$ et $H$ trois sous-espaces vectoriels d'un $K$-espace vectoriel $E$.

    **1.** Démontrer que si $F \subset H$, alors $(F+G) \cap H = F+(G \cap H)$.

    **2.** En déduire que si $F \subset H$ ou $G \subset H$, alors : 
    $$(F+G) \cap H = (F \cap H)+(G \cap H) \quad (\ast) \qquad\text{et}\qquad F+(G \cap H)=(F+G) \cap (F+H) \quad (\ast\ast)$$

    **3.** Sans aucune hypothèse d'inclusion, démontrer qu'une inclusion subsiste dans $(\ast)$ et dans $(\ast\ast)$, en précisant son sens.

    **4.** Donner, dans $E=\mathbb{R}^{2}$, un exemple de trois sous-espaces pour lesquels ces deux inclusions sont strictes.
  corrige: |
    **1.** *Première inclusion.* On a $F \subset H$ par hypothèse et $F \subset F+G$, donc $F \subset (F+G) \cap H$. De même $G \cap H \subset G \subset F+G$ et $G \cap H \subset H$, donc $G \cap H \subset (F+G) \cap H$. Comme $(F+G) \cap H$ est un sous-espace vectoriel, l'exercice 9 donne $F+(G \cap H) \subset (F+G) \cap H$.

    *Seconde inclusion.* Soit $x \in (F+G) \cap H$. Il existe $f \in F$ et $g \in G$ tels que $x=f+g$, et de plus $x \in H$. Or $f \in F \subset H$, donc : 
    $$g=x-f \in H \qquad\text{d'où}\qquad g \in G \cap H$$
     et $x=f+g$ appartient à $F+(G \cap H)$. 
    $$\boxed{F \subset H \;\Longrightarrow\; (F+G) \cap H = F+(G \cap H)}$$

    **2.** *Si $F \subset H$*, alors $F \cap H=F$, et la question 1 donne directement $(\ast)$. De plus $F+H=H$, donc : 
    $$(F+G) \cap (F+H)=(F+G) \cap H = F+(G \cap H)$$
     ce qui est $(\ast\ast)$.

    *Si $G \subset H$*, on applique la question 1 en échangeant les rôles de $F$ et $G$, la somme étant commutative : 
    $$(F+G) \cap H=(G+F) \cap H=G+(F \cap H)=(G \cap H)+(F \cap H)$$
     ce qui est $(\ast)$. Pour $(\ast\ast)$ : on a $G \cap H=G$, donc le membre de gauche vaut $F+G$ ; et $F+H$ contient $F$ et $H \supset G$, donc contient $F+G$, d'où $(F+G) \cap (F+H)=F+G$. 
    $$\boxed{\text{Les deux identités } (\ast) \text{ et } (\ast\ast) \text{ sont vérifiées.}}$$

    **3.** Sans hypothèse, on a toujours $F \cap H \subset F \subset F+G$ et $F \cap H \subset H$, donc $F \cap H \subset (F+G) \cap H$ ; de même pour $G \cap H$. Le membre de droite étant un sous-espace vectoriel, il contient la somme.

    De même, $F \subset F+G$ et $F \subset F+H$ ; et $G \cap H \subset G \subset F+G$, $G \cap H \subset H \subset F+H$. 
    $$\boxed{(F \cap H)+(G \cap H) \subset (F+G) \cap H \qquad\text{et}\qquad F+(G \cap H) \subset (F+G) \cap (F+H)}$$

    **4.** Prenons dans $\mathbb{R}^{2}$ trois droites vectorielles deux à deux distinctes : 
    $$F=\mathrm{Vect}\big((1\,;0)\big) \qquad G=\mathrm{Vect}\big((0\,;1)\big) \qquad H=\mathrm{Vect}\big((1\,;1)\big)$$
     Ces droites étant deux à deux distinctes, chacune des intersections $F \cap H$ et $G \cap H$ est réduite à $\{0_{E}\}$, alors que $F+G=\mathbb{R}^{2}$. Donc : 
    $$(F+G) \cap H = \mathbb{R}^{2} \cap H = H \qquad\text{tandis que}\qquad (F \cap H)+(G \cap H)=\{0_{E}\}$$

    $$F+(G \cap H)=F+\{0_{E}\}=F \qquad\text{tandis que}\qquad (F+G) \cap (F+H)=\mathbb{R}^{2} \cap \mathbb{R}^{2}=\mathbb{R}^{2}$$

    $$\boxed{\text{Les deux inclusions sont strictes : ni } (\ast) \text{ ni } (\ast\ast) \text{ ne vaut sans hypothèse.}}$$
- id: "ap-06-11"
  feuille: "f-ap-06"
  numero: 11
  partie: "Sommes directes et supplémentaires"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [sous-espaces vectoriels, somme directe et supplémentaires]
  noeuds: [v-espace, v-somme-directe]
  notions: [sous-espace-vectoriel, supplementaire]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On reprend les sous-espaces $F$ et $G$ de l'exercice 8.

    **1.** Démontrer que $F$ et $G$ sont supplémentaires dans $\mathbb{R}^{3}$.

    **2.** Décomposer explicitement le vecteur $(1\,;2\,;6)$ sur $F$ et $G$.

    **3.** Les sous-espaces $F$ et $H$ de l'exercice 8 sont-ils supplémentaires dans $\mathbb{R}^{3}$ ? Justifier.
  corrige: |
    **1.** L'exercice 8 a établi $F \cap G=\{0_{E}\}$ et $F+G=\mathbb{R}^{3}$. La proposition 3 donne alors que la somme est directe. 
    $$\boxed{\mathbb{R}^{3}=F \oplus G \text{ : les sous-espaces } F \text{ et } G \text{ sont supplémentaires.}}$$

    **2.** Ici $s=\dfrac{1+2+6}{3}=3$, donc : 
    $$\boxed{(1\,;2\,;6)=\underbrace{(-2\,;-1\,;3)}_{\in \, F}+\underbrace{(3\,;3\,;3)}_{\in \, G}}$$
     *Vérification :* $-2-1+3=0$, donc le premier vecteur appartient bien à $F$ ✓

    **3.** L'exercice 8 a établi $F \cap H=\mathrm{Vect}\big((1\,;-1\,;0)\big)$, qui n'est pas réduit au vecteur nul : la somme n'est pas directe. 
    $$\boxed{F \text{ et } H \text{ ne sont pas supplémentaires dans } \mathbb{R}^{3}.}$$
     Ils vérifient pourtant $F+H=\mathbb{R}^{3}$ : par exemple $(0\,;0\,;1)=(-1\,;0\,;1)+(1\,;0\,;0)$, le premier vecteur étant dans $F$ et le second dans $H$. C'est bien l'unicité de la décomposition qui fait défaut, et non son existence.
- id: "ap-06-12"
  feuille: "f-ap-06"
  numero: 12
  partie: "Sommes directes et supplémentaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [opérations sur les sous-espaces, somme directe et supplémentaires, espaces de fonctions]
  noeuds: [v-somme-directe, v-espace]
  notions: [supplementaire]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On note $\mathcal{P}$ l'ensemble des fonctions paires de $\mathbb{R}$ dans $\mathbb{R}$, et $\mathcal{I}$ celui des fonctions impaires.

    **1.** Démontrer que $\mathcal{P} \cap \mathcal{I}=\{0\}$.

    **2.** Soit $f \in \mathcal{F}(\mathbb{R}\,;\mathbb{R})$. Vérifier que les fonctions définies par : 
    $$p(x)=\frac{f(x)+f(-x)}{2} \qquad\text{et}\qquad i(x)=\frac{f(x)-f(-x)}{2}$$
     appartiennent respectivement à $\mathcal{P}$ et à $\mathcal{I}$, et que $f=p+i$.

    **3.** Conclure que $\mathcal{P}$ et $\mathcal{I}$ sont supplémentaires dans $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$.

    **4.** Décomposer la fonction $x \mapsto \mathrm{e}^{x}$ selon cette décomposition.
  corrige: |
    **1.** Soit $f \in \mathcal{P} \cap \mathcal{I}$. Pour tout réel $x$, on a à la fois $f(-x)=f(x)$ et $f(-x)=-f(x)$, donc $f(x)=-f(x)$, puis $2f(x)=0$ et $f(x)=0$. 
    $$\boxed{\mathcal{P} \cap \mathcal{I}=\{0\}}$$

    **2.** Pour tout réel $x$ : 
    $$p(-x)=\frac{f(-x)+f(x)}{2}=p(x) \qquad\text{et}\qquad i(-x)=\frac{f(-x)-f(x)}{2}=-i(x)$$
     donc $p \in \mathcal{P}$ et $i \in \mathcal{I}$. Enfin : 
    $$p(x)+i(x)=\frac{f(x)+f(-x)+f(x)-f(-x)}{2}=f(x)$$

    $$\boxed{f=p+i \text{ avec } p \in \mathcal{P} \text{ et } i \in \mathcal{I}}$$

    **3.** Les ensembles $\mathcal{P}$ et $\mathcal{I}$ sont des sous-espaces vectoriels (exercice 6), leur intersection est réduite à la fonction nulle, et leur somme vaut $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$ tout entier d'après la question 2. 
    $$\boxed{\mathcal{F}(\mathbb{R}\,;\mathbb{R})=\mathcal{P} \oplus \mathcal{I}}$$

    **4.** On applique la question 2 à $f : x \mapsto \mathrm{e}^{x}$ : 
    $$\boxed{\mathrm{e}^{x}=\underbrace{\frac{\mathrm{e}^{x}+\mathrm{e}^{-x}}{2}}_{\text{paire}}+\underbrace{\frac{\mathrm{e}^{x}-\mathrm{e}^{-x}}{2}}_{\text{impaire}}}$$
     On reconnaît le cosinus et le sinus hyperboliques : leur définition n'est rien d'autre que cette décomposition.
- id: "ap-06-13"
  feuille: "f-ap-06"
  numero: 13
  partie: "Sommes directes et supplémentaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, somme directe et supplémentaires, espaces de fonctions]
  noeuds: [v-espace, v-somme-directe]
  notions: [espace-vectoriel, sous-espace-vectoriel, supplementaire]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On pose : 
    $$F=\big\{f \in \mathcal{F}(\mathbb{R}\,;\mathbb{R}) \;\big|\; f(0)=f(1)=0\big\} \qquad\text{et}\qquad G=\big\{x \mapsto ax+b \;\big|\; (a\,;b) \in \mathbb{R}^{2}\big\}$$

    **1.** Démontrer que $F$ et $G$ sont des sous-espaces vectoriels de $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$.

    **2.** Démontrer que $F$ et $G$ sont en somme directe.

    **3.** Soit $h \in \mathcal{F}(\mathbb{R}\,;\mathbb{R})$. Déterminer les réels $a$ et $b$ pour lesquels la fonction $f : x \mapsto h(x)-(ax+b)$ appartient à $F$.

    **4.** En déduire que $F$ et $G$ sont supplémentaires dans $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$.
  corrige: |
    **1.** La fonction nulle appartient à $F$, et si $f$, $g \in F$ et $\lambda \in \mathbb{R}$ : 
    $$(\lambda f+g)(0)=\lambda f(0)+g(0)=0 \qquad\text{et}\qquad (\lambda f+g)(1)=\lambda f(1)+g(1)=0$$
     Quant à $G$, il s'écrit $G=\mathrm{Vect}\big(x \mapsto x \,;\, x \mapsto 1\big)$, donc c'est un sous-espace vectoriel d'après l'exercice 7. 
    $$\boxed{F \text{ et } G \text{ sont des sous-espaces vectoriels de } \mathcal{F}(\mathbb{R}\,;\mathbb{R}).}$$

    **2.** Soit $f \in F \cap G$ : il existe $(a\,;b)$ tel que $f(x)=ax+b$ pour tout $x$, avec $f(0)=f(1)=0$. La première condition donne $b=0$, la seconde $a+b=0$, donc $a=0$. 
    $$\boxed{F \cap G=\{0\} \text{ : les sous-espaces } F \text{ et } G \text{ sont en somme directe.}}$$

    **3.** On veut $f(0)=0$ et $f(1)=0$, c'est-à-dire : 
    $$h(0)-b=0 \qquad\text{et}\qquad h(1)-(a+b)=0$$

    $$\boxed{b=h(0) \qquad\text{et}\qquad a=h(1)-h(0)}$$

    **4.** Soit $h \in \mathcal{F}(\mathbb{R}\,;\mathbb{R})$ quelconque. En posant $g : x \mapsto \big(h(1)-h(0)\big)x+h(0)$, qui appartient à $G$, la question 3 montre que $f=h-g$ appartient à $F$. Ainsi $h=f+g \in F+G$. 
    $$\boxed{\mathcal{F}(\mathbb{R}\,;\mathbb{R})=F \oplus G}$$
- id: "ap-06-14"
  feuille: "f-ap-06"
  numero: 14
  partie: "Sommes directes et supplémentaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, somme directe et supplémentaires]
  noeuds: [v-espace, v-somme-directe]
  notions: [espace-vectoriel, sous-espace-vectoriel, supplementaire]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On note $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$ le $\mathbb{R}$-espace vectoriel des applications dérivables de $\mathbb{R}$ dans $\mathbb{R}$, et l'on pose : 
    $$F=\big\{f \in \mathcal{D}(\mathbb{R}\,;\mathbb{R}) \;\big|\; f(0)=f'(0)=0\big\}$$

    **1.** Démontrer que $F$ est un sous-espace vectoriel de $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$.

    **2.** Déterminer un supplémentaire de $F$ dans $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$, et démontrer que c'en est bien un.
  corrige: |
    **1.** La fonction nulle est dérivable et vérifie les deux conditions. Soient $f$, $g \in F$ et $\lambda \in \mathbb{R}$ : la fonction $\lambda f+g$ est dérivable, de dérivée $\lambda f'+g'$, et : 
    $$(\lambda f+g)(0)=\lambda f(0)+g(0)=0 \qquad\text{et}\qquad (\lambda f+g)'(0)=\lambda f'(0)+g'(0)=0$$

    $$\boxed{F \text{ est un sous-espace vectoriel de } \mathcal{D}(\mathbb{R}\,;\mathbb{R}).}$$

    **2.** Posons $G=\big\{x \mapsto ax+b \;\big|\; (a\,;b) \in \mathbb{R}^{2}\big\}$, l'ensemble des fonctions affines, qui est un sous-espace vectoriel de $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$ puisque toute fonction affine est dérivable.

    *Somme directe.* Soit $f \in F \cap G$, disons $f(x)=ax+b$. Alors $f(0)=b=0$ et $f'(0)=a=0$, donc $f=0$.

    *Somme égale à $\mathcal{D}(\mathbb{R}\,;\mathbb{R})$.* Soit $h$ une fonction dérivable. Posons : 
    $$g : x \longmapsto h'(0)\,x+h(0) \qquad\text{et}\qquad f=h-g$$
     La fonction $g$ appartient à $G$, la fonction $f$ est dérivable, et : 
    $$f(0)=h(0)-h(0)=0 \qquad\text{et}\qquad f'(0)=h'(0)-h'(0)=0$$
     donc $f \in F$ et $h=f+g$. 
    $$\boxed{\mathcal{D}(\mathbb{R}\,;\mathbb{R})=F \oplus G, \text{ où } G \text{ est l'ensemble des fonctions affines.}}$$
     *Remarque :* la fonction $g$ n'est autre que la *tangente* au graphe de $h$ au point d'abscisse $0$. Décomposer $h$, c'est donc séparer sa partie affine tangente de ce qui reste — un reste qui, par construction, s'annule ainsi que sa dérivée en $0$.
- id: "ap-06-15"
  feuille: "f-ap-06"
  numero: 15
  partie: "Systèmes et bases"
  etoiles: 1
  types: [Calcul]
  mots_cles: [familles libres, familles génératrices]
  noeuds: [v-libre]
  notions: [famille-libre, famille-generatrice]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Les familles suivantes sont-elles libres dans $\mathbb{R}^{3}$ ? Si oui, sont-elles génératrices de $\mathbb{R}^{3}$ ?

    **1.** $(u\,;v)$ avec $u=(1\,;2\,;3)$ et $v=(-1\,;4\,;6)$.

    **2.** $(u\,;v\,;w)$ avec $u=(1\,;2\,;-1)$, $v=(1\,;0\,;1)$ et $w=(0\,;0\,;1)$.

    **3.** $(u\,;v\,;w)$ avec $u=(1\,;2\,;-1)$, $v=(1\,;0\,;1)$ et $w=(-1\,;2\,;-3)$.
  corrige: |
    **1.** *Liberté.* Soient $\lambda$ et $\mu$ tels que $\lambda u+\mu v=0_{E}$, c'est-à-dire : 
    $$\left\{\begin{array}{l} \lambda-\mu=0 \\ 2\lambda+4\mu=0 \\ 3\lambda+6\mu=0 \end{array}\right.$$
     La première ligne donne $\lambda=\mu$, et la deuxième $6\lambda=0$, donc $\lambda=\mu=0$.

    *Caractère générateur.* Tout vecteur $\lambda u+\mu v=(\lambda-\mu \,;\, 2\lambda+4\mu \,;\, 3\lambda+6\mu)$ vérifie : 
    $$3y-2z=3(2\lambda+4\mu)-2(3\lambda+6\mu)=0$$
     Or le vecteur $(0\,;0\,;1)$ ne vérifie pas cette relation, puisque $3 \times 0-2 \times 1=-2 \neq 0$. 
    $$\boxed{\text{La famille est libre, mais non génératrice de } \mathbb{R}^{3}.}$$
     Elle engendre exactement le plan d'équation $3y-2z=0$.

    **2.** *Liberté.* Le système $\lambda u+\mu v+\nu w=0_{E}$ s'écrit : 
    $$\left\{\begin{array}{l} \lambda+\mu=0 \\ 2\lambda=0 \\ -\lambda+\mu+\nu=0 \end{array}\right.$$
     La deuxième ligne donne $\lambda=0$, la première $\mu=0$, la troisième $\nu=0$.

    *Caractère générateur.* Pour $(x\,;y\,;z) \in \mathbb{R}^{3}$, le même système avec second membre se résout en : 
    $$\lambda=\frac{y}{2} \qquad \mu=x-\frac{y}{2} \qquad \nu=-x+y+z$$

    $$\boxed{\text{La famille est libre et génératrice : c'est une base de } \mathbb{R}^{3}.}$$

    **3.** On cherche une relation. Le système $\lambda u+\mu v+\nu w=0_{E}$ s'écrit : 
    $$\left\{\begin{array}{l} \lambda+\mu-\nu=0 \\ 2\lambda+2\nu=0 \\ -\lambda+\mu-3\nu=0 \end{array}\right.$$
     La deuxième ligne donne $\lambda=-\nu$, la première $\mu=2\nu$, et la troisième est alors automatiquement vérifiée. En prenant $\nu=1$ : 
    $$-u+2v+w=-(1\,;2\,;-1)+2\,(1\,;0\,;1)+(-1\,;2\,;-3)=(0\,;0\,;0)$$

    $$\boxed{\text{La famille est liée.}}$$
- id: "ap-06-16"
  feuille: "f-ap-06"
  numero: 16
  partie: "Systèmes et bases"
  etoiles: 2
  types: [Calcul]
  mots_cles: [familles libres]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Les familles suivantes de $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$ sont-elles libres ? On pourra évaluer une combinaison linéaire nulle en des points bien choisis.

    **1.** $\big(x \mapsto 1 \,;\, x \mapsto x \,;\, x \mapsto x^{2}\big)$

    **2.** $\big(\cos \,;\, \sin\big)$

    **3.** $\big(x \mapsto \mathrm{e}^{x} \,;\, x \mapsto \mathrm{e}^{2x}\big)$

    **4.** $\big(x \mapsto |x| \,;\, x \mapsto x\big)$

    **5.** $\big(x \mapsto 1 \,;\, x \mapsto \cos(2x) \,;\, x \mapsto \cos^{2}(x)\big)$
  corrige: |
    **1.** Supposons $a+bx+cx^{2}=0$ pour tout réel $x$. En évaluant en $0$, puis en $1$ et en $-1$ : 
    $$a=0 \qquad a+b+c=0 \qquad a-b+c=0$$
     Les deux dernières donnent, par somme et différence, $c=0$ et $b=0$. $\boxed{\text{Famille libre.}}$

    **2.** Supposons $a\cos(x)+b\sin(x)=0$ pour tout réel $x$. En $x=0$ on obtient $a=0$, en $x=\frac{\pi}{2}$ on obtient $b=0$. $\boxed{\text{Famille libre.}}$

    **3.** Supposons $a\,\mathrm{e}^{x}+b\,\mathrm{e}^{2x}=0$ pour tout réel $x$. En $x=0$ : $a+b=0$. En $x=\ln(2)$ : $2a+4b=0$. En reportant $a=-b$, il vient $2b=0$, donc $b=0$ puis $a=0$. $\boxed{\text{Famille libre.}}$

    **4.** Supposons $a|x|+bx=0$ pour tout réel $x$. En $x=1$ : $a+b=0$. En $x=-1$ : $a-b=0$. Donc $a=b=0$. $\boxed{\text{Famille libre.}}$

    **5.** La formule de duplication $\cos(2x)=2\cos^{2}(x)-1$ fournit, pour tout réel $x$ : 
    $$1 \times 1+1 \times \cos(2x)+(-2) \times \cos^{2}(x)=1+\big(2\cos^{2}(x)-1\big)-2\cos^{2}(x)=0$$
     C'est une combinaison linéaire nulle à coefficients non tous nuls. $\boxed{\text{Famille liée.}}$

    *Méthode :* pour une famille de fonctions, l'égalité $\sum \lambda_{k}f_{k}=0$ porte sur *toutes* les valeurs de $x$. On peut donc en évaluer autant qu'on veut, et c'est le choix des points qui rend le système facile à résoudre.
- id: "ap-06-17"
  feuille: "f-ap-06"
  numero: 17
  partie: "Systèmes et bases"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [familles libres, familles génératrices, bases, espaces de fonctions]
  noeuds: [v-libre, v-espace]
  notions: [famille-libre, famille-generatrice, base-vectorielle]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On pose $e_{1}=(1\,;1\,;0)$, $e_{2}=(0\,;1\,;1)$ et $e_{3}=(1\,;0\,;1)$ dans $\mathbb{R}^{3}$.

    **1.** Démontrer que la famille $(e_{1}\,;e_{2}\,;e_{3})$ est libre.

    **2.** Démontrer qu'elle est génératrice de $\mathbb{R}^{3}$, en exprimant les coefficients en fonction de $(x\,;y\,;z)$.

    **3.** Conclure, puis déterminer les coordonnées du vecteur $(1\,;2\,;3)$ dans cette base.

    **4.** Quelles sont les coordonnées de ce même vecteur dans la base canonique ?
  corrige: |
    **1.** Soient $\lambda$, $\mu$, $\nu$ tels que $\lambda e_{1}+\mu e_{2}+\nu e_{3}=0_{E}$, c'est-à-dire : 
    $$\left\{\begin{array}{l} \lambda+\nu=0 \\ \lambda+\mu=0 \\ \mu+\nu=0 \end{array}\right.$$
     Les deux premières donnent $\nu=-\lambda$ et $\mu=-\lambda$, et la troisième devient $-2\lambda=0$, d'où $\lambda=0$, puis $\mu=\nu=0$. 
    $$\boxed{\text{La famille } (e_{1}\,;e_{2}\,;e_{3}) \text{ est libre.}}$$

    **2.** Soit $(x\,;y\,;z) \in \mathbb{R}^{3}$. On résout : 
    $$\left\{\begin{array}{l} \lambda+\nu=x \\ \lambda+\mu=y \\ \mu+\nu=z \end{array}\right.$$
     En additionnant les trois lignes : $2(\lambda+\mu+\nu)=x+y+z$. Posons $s=\dfrac{x+y+z}{2}$. En retranchant successivement chaque ligne : 
    $$\boxed{\mu=s-x \qquad \nu=s-y \qquad \lambda=s-z}$$
     Ce triplet existe toujours : la famille est génératrice.

    **3.** Libre et génératrice, la famille est une base de $\mathbb{R}^{3}$. Pour le vecteur $(1\,;2\,;3)$, on a $s=\dfrac{1+2+3}{2}=3$, d'où $\lambda=3-3=0$, $\mu=3-1=2$ et $\nu=3-2=1$. 
    $$\boxed{(1\,;2\,;3)=0 \cdot e_{1}+2\,e_{2}+1\,e_{3}}$$
     *Vérification :* $2\,(0\,;1\,;1)+(1\,;0\,;1)=(1\,;2\,;3)$ ✓

    **4.** Dans la base canonique, les coordonnées d'un vecteur sont ses composantes. 
    $$\boxed{\text{Les coordonnées sont } 1, \; 2 \text{ et } 3.}$$
     Un même vecteur a donc des coordonnées différentes selon la base choisie — ici $(0\,;2\,;1)$ et $(1\,;2\,;3)$. La base canonique n'a rien de privilégié mathématiquement, comme le souligne le cours.
- id: "ap-06-18"
  feuille: "f-ap-06"
  numero: 18
  partie: "Systèmes et bases"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces vectoriels, axiomes, familles libres, bases]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel, famille-libre, base-vectorielle]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    L'ensemble $\mathbb{C}$ peut être vu comme un $\mathbb{C}$-espace vectoriel, ou comme un $\mathbb{R}$-espace vectoriel, la loi externe étant dans les deux cas la multiplication des complexes.

    **1.** Justifier que ces deux structures sont bien définies.

    **2.** Démontrer que la famille $(1)$ est une base du $\mathbb{C}$-espace vectoriel $\mathbb{C}$.

    **3.** Démontrer que la famille $(1\,;\mathrm{i})$ est une base du $\mathbb{R}$-espace vectoriel $\mathbb{C}$.

    **4.** La famille $(1\,;\mathrm{i})$ est-elle libre dans le $\mathbb{C}$-espace vectoriel $\mathbb{C}$ ? Que conclure ?
  corrige: |
    **1.** L'ensemble $(\mathbb{C}\,;+)$ est un groupe abélien. La multiplication des complexes fournit une application de $\mathbb{C} \times \mathbb{C}$ dans $\mathbb{C}$, et sa restriction une application de $\mathbb{R} \times \mathbb{C}$ dans $\mathbb{C}$. Dans les deux cas, les axiomes **D**, **A** et **N** sont des règles de calcul dans le corps $\mathbb{C}$. 
    $$\boxed{\mathbb{C} \text{ est à la fois un } \mathbb{C}\text{-espace vectoriel et un } \mathbb{R}\text{-espace vectoriel.}}$$

    **2.** *Liberté.* Si $\lambda \cdot 1=0$ avec $\lambda \in \mathbb{C}$, alors $\lambda=0$. *Caractère générateur.* Tout $z \in \mathbb{C}$ s'écrit $z=z \cdot 1$. 
    $$\boxed{(1) \text{ est une base du } \mathbb{C}\text{-espace vectoriel } \mathbb{C}.}$$

    **3.** *Liberté.* Soient $a$ et $b$ *réels* tels que $a \cdot 1+b \cdot \mathrm{i}=0$. L'unicité de la forme algébrique donne $a=b=0$.

    *Caractère générateur.* Tout complexe $z$ s'écrit $z=a+\mathrm{i}b$ avec $a$ et $b$ réels. 
    $$\boxed{(1\,;\mathrm{i}) \text{ est une base du } \mathbb{R}\text{-espace vectoriel } \mathbb{C}.}$$

    **4.** Dans le $\mathbb{C}$-espace vectoriel $\mathbb{C}$, les coefficients sont autorisés à être complexes, et : 
    $$\mathrm{i} \cdot 1+(-1) \cdot \mathrm{i}=\mathrm{i}-\mathrm{i}=0$$
     avec $(\mathrm{i}\,;-1) \neq (0\,;0)$. 
    $$\boxed{\text{La famille } (1\,;\mathrm{i}) \text{ est liée sur } \mathbb{C}, \text{ alors qu'elle est libre sur } \mathbb{R}.}$$
     *Conclusion :* la liberté d'une famille n'est pas une propriété des seuls vecteurs. Elle dépend du corps des scalaires, exactement comme l'injectivité d'une application dépendait de son ensemble de départ au chapitre 2.
- id: "ap-06-19"
  feuille: "f-ap-06"
  numero: 19
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, somme directe et supplémentaires, familles libres, familles génératrices, bases]
  noeuds: [v-espace, v-somme-directe, v-libre]
  notions: [espace-vectoriel, sous-espace-vectoriel, supplementaire, famille-libre, famille-generatrice, base-vectorielle]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $E$ désigne un $K$-espace vectoriel.

    **1.** Un sous-espace vectoriel de $E$ contient toujours le vecteur nul.

    **2.** La réunion de deux sous-espaces vectoriels de $E$ est un sous-espace vectoriel.

    **3.** L'intersection de deux sous-espaces vectoriels de $E$ est un sous-espace vectoriel.

    **4.** La somme de deux sous-espaces vectoriels de $E$ est un sous-espace vectoriel.

    **5.** Deux sous-espaces vectoriels dont l'intersection est réduite au vecteur nul sont supplémentaires dans $E$.

    **6.** Une famille contenant le vecteur nul est liée.

    **7.** Toute famille libre est génératrice.

    **8.** Dans une base, tout vecteur se décompose d'une unique façon.

    **9.** Une droite du plan ne passant pas par l'origine est un sous-espace vectoriel de $\mathbb{R}^{2}$.

    **10.** Toute partie non vide de $E$ stable par combinaison linéaire est un sous-espace vectoriel.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la conséquence immédiate de la proposition 1, obtenue en prenant $\lambda=-1_{K}$ et $x=y$. Le cours en fait le premier réflexe de vérification.

    **2.** $\boxed{\textbf{Fausse}}$ Deux droites vectorielles distinctes du plan en fournissent un contre-exemple (exercice 4). La proposition 2 précise que la réunion n'est un sous-espace que si l'un des deux contient l'autre.

    **3.** $\boxed{\textbf{Vraie}}$ C'est le premier point de la proposition 2, valable pour une famille quelconque.

    **4.** $\boxed{\textbf{Vraie}}$ C'est le troisième point de la proposition 2. L'exercice 9 précise que c'est même le plus petit sous-espace contenant les deux.

    **5.** $\boxed{\textbf{Fausse}}$ Il faut de plus que leur somme soit $E$ tout entier. Deux droites vectorielles distinctes de $\mathbb{R}^{3}$ ont une intersection réduite au vecteur nul, sans être supplémentaires.

    **6.** $\boxed{\textbf{Vraie}}$ Si $x_{1}=0_{E}$, la combinaison $1_{K} \cdot x_{1}+0_{K} \cdot x_{2}+\dots=0_{E}$ est nulle sans que tous les coefficients le soient.

    **7.** $\boxed{\textbf{Fausse}}$ La famille $\big((1\,;0\,;0)\big)$ est libre dans $\mathbb{R}^{3}$, mais n'engendre qu'une droite. L'exercice 15 en donne un autre exemple, avec deux vecteurs.

    **8.** $\boxed{\textbf{Vraie}}$ C'est la propriété caractéristique d'une base, signalée dans la remarque du cours : le caractère générateur donne l'existence, la liberté l'unicité.

    **9.** $\boxed{\textbf{Fausse}}$ Elle ne contient pas le vecteur nul. C'est l'exemple $D'$ du cours, repris au panneau (c) de l'exercice 4.

    **10.** $\boxed{\textbf{Vraie}}$ C'est exactement la proposition 1 : non-vacuité et stabilité par $\lambda x+y$.
- id: "ap-06-20"
  feuille: "f-ap-06"
  numero: 20
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces vectoriels, sous-espaces vectoriels, familles libres, bases, espaces de suites]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel, sous-espace-vectoriel, famille-libre, base-vectorielle]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On note $E$ l'ensemble des suites réelles $(u_{n})$ vérifiant : 
    $$\forall n \in \mathbb{N}, \qquad u_{n+2}=5u_{n+1}-6u_{n}$$

    **1.** Démontrer que $E$ est un sous-espace vectoriel de $\mathcal{S}(\mathbb{R})$.

    **2.** Vérifier que les suites $a=\big(2^{n}\big)_{n \in \mathbb{N}}$ et $b=\big(3^{n}\big)_{n \in \mathbb{N}}$ appartiennent à $E$.

    **3.** Démontrer que la famille $(a\,;b)$ est libre.

    **4.** Soit $u \in E$. Démontrer qu'il existe un unique couple $(\lambda\,;\mu)$ de réels tel que $u_{0}=\lambda+\mu$ et $u_{1}=2\lambda+3\mu$, puis que $u=\lambda a+\mu b$.

    **5.** Conclure : $(a\,;b)$ est une base de $E$. Déterminer la suite de $E$ vérifiant $u_{0}=1$ et $u_{1}=0$.
  corrige: |
    **1.** L'ensemble $E$ est une partie de $\mathcal{S}(\mathbb{R})$, et la suite nulle vérifie la relation. Soient $u$, $v \in E$ et $\lambda \in \mathbb{R}$. Pour tout $n \in \mathbb{N}$ : 
    $$(\lambda u+v)_{n+2}=\lambda u_{n+2}+v_{n+2}=\lambda\big(5u_{n+1}-6u_{n}\big)+\big(5v_{n+1}-6v_{n}\big)=5(\lambda u+v)_{n+1}-6(\lambda u+v)_{n}$$

    $$\boxed{E \text{ est un sous-espace vectoriel de } \mathcal{S}(\mathbb{R}).}$$

    **2.** Pour tout $n \in \mathbb{N}$ : 
    $$5 \times 2^{n+1}-6 \times 2^{n}=(10-6) \times 2^{n}=4 \times 2^{n}=2^{n+2}$$

    $$5 \times 3^{n+1}-6 \times 3^{n}=(15-6) \times 3^{n}=9 \times 3^{n}=3^{n+2}$$

    $$\boxed{a \in E \qquad\text{et}\qquad b \in E}$$

    **3.** Soient $\lambda$ et $\mu$ tels que $\lambda a+\mu b=0$, c'est-à-dire $\lambda 2^{n}+\mu 3^{n}=0$ pour tout $n$. En prenant $n=0$ puis $n=1$ : 
    $$\lambda+\mu=0 \qquad\text{et}\qquad 2\lambda+3\mu=0$$
     En reportant $\lambda=-\mu$ dans la seconde, il vient $\mu=0$, puis $\lambda=0$. 
    $$\boxed{\text{La famille } (a\,;b) \text{ est libre.}}$$

    **4.** Le système $\lambda+\mu=u_{0}$, $2\lambda+3\mu=u_{1}$ se résout en soustrayant deux fois la première ligne à la seconde : 
    $$\boxed{\mu=u_{1}-2u_{0} \qquad\text{et}\qquad \lambda=3u_{0}-u_{1}}$$
     et cette solution est unique. Posons alors $v=\lambda a+\mu b$, qui appartient à $E$ d'après la question 1. Par construction $v_{0}=u_{0}$ et $v_{1}=u_{1}$.

    Montrons par récurrence double que $u_{n}=v_{n}$ pour tout $n$. C'est vrai aux rangs $0$ et $1$. Si c'est vrai aux rangs $n$ et $n+1$, alors : 
    $$u_{n+2}=5u_{n+1}-6u_{n}=5v_{n+1}-6v_{n}=v_{n+2}$$
     les deux suites vérifiant la même relation de récurrence. 
    $$\boxed{u=\lambda a+\mu b \text{ : la famille } (a\,;b) \text{ est génératrice de } E.}$$

    **5.** Libre d'après la question 3 et génératrice d'après la question 4 : 
    $$\boxed{(a\,;b) \text{ est une base de } E.}$$
     Pour $u_{0}=1$ et $u_{1}=0$, la question 4 donne $\lambda=3$ et $\mu=-2$ : 
    $$\boxed{\forall n \in \mathbb{N}, \qquad u_{n}=3 \times 2^{n}-2 \times 3^{n}}$$
     *Vérification :* $u_{0}=3-2=1$ et $u_{1}=6-6=0$ ✓
- id: "ap-06-21"
  feuille: "f-ap-06"
  numero: 21
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces vectoriels, familles libres, familles génératrices]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel, famille-libre, famille-generatrice]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    On considère $\mathbb{R}$ comme un $\mathbb{Q}$-espace vectoriel. On admet que $\sqrt{2}$, $\sqrt{3}$ et $\sqrt{6}$ sont irrationnels.

    **1.** Justifier que $\mathbb{R}$ est bien un $\mathbb{Q}$-espace vectoriel.

    **2.** Démontrer que la famille $\big(1\,;\sqrt{2}\big)$ est libre.

    **3.** Démontrer que $\mathrm{Vect}\big(1\,;\sqrt{2}\big)=\mathbb{Q}\big[\sqrt{2}\big]$, l'ensemble étudié au chapitre 5.

    **4.** Démontrer que $\sqrt{3}$ n'appartient pas à $\mathbb{Q}\big[\sqrt{2}\big]$. On pourra supposer $\sqrt{3}=a+b\sqrt{2}$ avec $(a\,;b) \in \mathbb{Q}^{2}$, élever au carré, et distinguer selon la nullité de $ab$.

    **5.** En déduire que la famille $\big(1\,;\sqrt{2}\big)$ n'est pas génératrice de $\mathbb{R}$.

    **6.** Le $\mathbb{Q}$-espace vectoriel $\mathbb{R}$ peut-il admettre une famille génératrice finie ? Commenter.
  corrige: |
    **1.** L'ensemble $(\mathbb{R}\,;+)$ est un groupe abélien, et la multiplication fournit une application de $\mathbb{Q} \times \mathbb{R}$ dans $\mathbb{R}$. Les quatre axiomes sont des règles de calcul dans le corps $\mathbb{R}$. 
    $$\boxed{\mathbb{R} \text{ est un } \mathbb{Q}\text{-espace vectoriel.}}$$

    **2.** Soient $a$ et $b$ deux *rationnels* tels que $a \times 1+b\sqrt{2}=0$. Si $b \neq 0$, alors : 
    $$\sqrt{2}=-\frac{a}{b} \in \mathbb{Q}$$
     ce qui contredit l'irrationalité de $\sqrt{2}$. Donc $b=0$, puis $a=0$. 
    $$\boxed{\text{La famille } \big(1\,;\sqrt{2}\big) \text{ est libre dans le } \mathbb{Q}\text{-espace vectoriel } \mathbb{R}.}$$

    **3.** Par définition, $\mathrm{Vect}\big(1\,;\sqrt{2}\big)$ est l'ensemble des $a \times 1+b\sqrt{2}$ avec $a$ et $b$ rationnels, ce qui est exactement la définition de $\mathbb{Q}\big[\sqrt{2}\big]$ donnée au chapitre 5. 
    $$\boxed{\mathrm{Vect}\big(1\,;\sqrt{2}\big)=\mathbb{Q}\big[\sqrt{2}\big]}$$

    **4.** Supposons $\sqrt{3}=a+b\sqrt{2}$ avec $(a\,;b) \in \mathbb{Q}^{2}$. En élevant au carré : 
    $$3=a^{2}+2b^{2}+2ab\sqrt{2}$$
     *Si $ab \neq 0$*, on en tire $\sqrt{2}=\dfrac{3-a^{2}-2b^{2}}{2ab} \in \mathbb{Q}$, ce qui est absurde. Donc $a=0$ ou $b=0$.

    • Si $b=0$, alors $\sqrt{3}=a \in \mathbb{Q}$, ce qui est absurde.

    • Si $a=0$, alors $\sqrt{3}=b\sqrt{2}$, donc en multipliant par $\sqrt{2}$ : $\sqrt{6}=2b \in \mathbb{Q}$, ce qui est absurde.

    $$\boxed{\sqrt{3} \notin \mathbb{Q}\big[\sqrt{2}\big]}$$

    **5.** Si la famille $\big(1\,;\sqrt{2}\big)$ était génératrice de $\mathbb{R}$, on aurait $\mathbb{R}=\mathrm{Vect}\big(1\,;\sqrt{2}\big)=\mathbb{Q}\big[\sqrt{2}\big]$. Or $\sqrt{3}$ est un réel qui n'appartient pas à cet ensemble. 
    $$\boxed{\text{La famille } \big(1\,;\sqrt{2}\big) \text{ n'est pas génératrice de } \mathbb{R}.}$$

    **6.** La réponse est négative : 
    $$\boxed{\text{Non : le } \mathbb{Q}\text{-espace vectoriel } \mathbb{R} \text{ n'admet aucune famille génératrice finie.}}$$
     Le procédé de la question 4 se généralise : quelle que soit la famille finie choisie, on peut construire un réel qui lui échappe. La démonstration complète relève de la théorie de la dimension, mais l'idée se résume ainsi : à partir d'une famille de $n$ vecteurs, on n'atteint que les sommes $\lambda_{1}x_{1}+\dots+\lambda_{n}x_{n}$ à coefficients rationnels, dont l'ensemble reste « de la taille » de $\mathbb{Q}^{n}$ — bien trop petit pour épuiser $\mathbb{R}$.

    Cet exemple mérite d'être retenu : tous les espaces vectoriels rencontrés jusqu'ici admettaient une base finie, mais ce n'est nullement la règle générale. Le $\mathbb{R}$-espace vectoriel $\mathcal{F}(\mathbb{R}\,;\mathbb{R})$ est dans le même cas.

