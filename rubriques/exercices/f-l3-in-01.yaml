  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $(X, d)$ un espace métrique et $f : X \to \mathbb{R}$ une fonction quelconque.

    **1.** Montrer que $f$ est continue en $x$ si et seulement si, pour tout $\varepsilon > 0$, il existe un voisinage $V$ de $x$ tel que $|f(y) - f(z)| < \varepsilon$ pour tous $y$, $z \in V$.

    **2.** En déduire que l'ensemble des points de continuité de $f$ est une intersection dénombrable d'ouverts, donc un borélien.
  corrige: |
    **1.** Si $f$ est continue en $x$, il existe un voisinage $V$ de $x$ sur lequel $|f(y) - f(x)| < \dfrac{\varepsilon}{2}$, et alors $|f(y) - f(z)| < \varepsilon$ pour $y$, $z \in V$. Réciproquement, on prend $z = x$.

    **2.** Pour $k \geqslant 1$, soit $G_{k}$ l'ensemble des $x$ admettant un voisinage ouvert $V$ tel que $|f(y) - f(z)| < \dfrac{1}{k}$ pour $y$, $z \in V$. Si $x \in G_{k}$, le voisinage ouvert $V$ correspondant convient aussi pour tous ses points : $V \subset G_{k}$, et $G_{k}$ est ouvert. Par la question 1, 
    $$\boxed{\{x \in X \,;\, f \text{ est continue en } x\} = \bigcap_{k \geqslant 1}G_{k}}\text{,}$$
     intersection dénombrable d'ouverts (un « $G_{\delta}$ »), donc un borélien. Par exemple, l'ensemble des points de continuité de la fonction de Thomae (chapitre 4) est l'ensemble des irrationnels, qui est donc un $G_{\delta}$ ; on peut montrer en revanche que $\mathbb{Q}$ n'en est pas un, si bien qu'aucune fonction n'est continue exactement sur $\mathbb{Q}$.
