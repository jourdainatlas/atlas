  notions: [tribu-borelienne]
  source: "Lyon 1 (TD02 2020), exercices 17 et 18"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Prouver ou réfuter les assertions suivantes.

    **1.** Un ouvert, un fermé, un intervalle de $\mathbb{R}$ sont des boréliens.

    **2.** Un borélien de $\mathbb{R}$ est un ouvert ou un fermé.

    **3.** L'ensemble $[2, 3[ \cap \mathbb{Q}$ est un borélien de $\mathbb{R}$.

    **4.** L'ensemble $\{x \in \mathbb{R} \,;\, \cos x = \sin(\sin x)\}$ est un borélien de $\mathbb{R}$.

    **5.** Si $B$ est un borélien de $\mathbb{R}$ et $A \subset B$, alors $A$ est un borélien.
  corrige: |
    **1.** Vrai. Un ouvert est dans $\mathcal{B}(\mathbb{R})$ par définition, un fermé comme complémentaire d'un ouvert, et un intervalle s'écrit à l'aide d'ouverts et de fermés : par exemple $[a, b[ = [a, b] \cap ]-\infty, b[$, ou $[a, +\infty[$ qui est fermé.

    **2.** Faux : $[0, 1[$ est un borélien qui n'est ni ouvert ni fermé ; $\mathbb{Q}$ en est un autre.

    **3.** Vrai : $[2, 3[ \cap \mathbb{Q}$ est une réunion dénombrable de singletons, qui sont fermés.

    **4.** Vrai : c'est l'image réciproque du fermé $\{0\}$ par la fonction continue $x \mapsto \cos x - \sin(\sin x)$ ; c'est donc un fermé.

    **5.** Faux : $A$ peut ne pas être borélien, même si $B = \mathbb{R}$. L'existence de parties non boréliennes de $\mathbb{R}$ sera établie au chapitre 2 (ensemble de Vitali, qui n'est même pas mesurable au sens de Lebesgue). *L'erreur la plus répandue* est de croire qu'une tribu est stable par passage aux sous-ensembles : c'est la propriété de *complétude*, qui concerne seulement les parties des ensembles de mesure nulle, et que la tribu de Lebesgue possède alors que $\mathcal{B}(\mathbb{R})$ ne la possède pas.
- id: "l3-in-01-19"
  feuille: "f-l3-in-01"
  numero: 19
  partie: "Boréliens"
  etoiles: 2
