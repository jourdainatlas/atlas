  source: "Lyon 1 (TD02 2020), exercice 2"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Un *pavé* de $\mathbb{R}^{n}$ est un produit $P = I_{1} \times \dots \times I_{n}$ d'intervalles de $\mathbb{R}$ (bornés ou non, éventuellement vides ou réduits à un point).

    **1.** Montrer que l'ensemble $\mathcal{E}_{1}$ des réunions finies d'intervalles de $\mathbb{R}$ est une algèbre de Boole. Même question en remplaçant $\mathbb{R}$ par un intervalle $I$ et en ne considérant que des intervalles contenus dans $I$.

    **2.** Montrer que l'intersection de deux pavés est un pavé, et que le complémentaire d'un pavé est une réunion finie de pavés deux à deux disjoints.

    **3.** En déduire que l'ensemble $\mathcal{E}_{n}$ des réunions finies de pavés de $\mathbb{R}^{n}$ est une algèbre de Boole, et que tout élément de $\mathcal{E}_{n}$ est une réunion finie de pavés deux à deux disjoints.

    **4.** Est-ce une tribu ?
  corrige: |
    **1.** L'ensemble vide est la réunion de la famille vide (ou l'intervalle vide). Le complémentaire d'un intervalle est réunion d'au plus deux intervalles ; le complémentaire d'une réunion finie d'intervalles est l'intersection de leurs complémentaires, qui, en développant, est une réunion finie d'intersections d'intervalles, c'est-à-dire d'intervalles. La stabilité par réunion finie est évidente. Le raisonnement est identique dans un intervalle $I$.

    **2.** $(I_{1} \times \dots \times I_{n}) \cap (J_{1} \times \dots \times J_{n}) = (I_{1} \cap J_{1}) \times \dots \times (I_{n} \cap J_{n})$. Un point $x$ est hors de $P$ si et seulement si l'une de ses coordonnées sort de l'intervalle correspondant ; en notant $j$ le premier indice où cela se produit, 
    $${P}^{c} = \bigsqcup_{j=1}^{n}I_{1} \times \dots \times I_{j-1} \times {I_{j}}^{c} \times \mathbb{R} \times \dots \times \mathbb{R},$$
     et ${I_{j}}^{c}$ est réunion disjointe d'au plus deux intervalles : ${P}^{c}$ est réunion disjointe d'au plus $2n$ pavés.

    **3.** Par 2, le complémentaire d'une réunion finie de pavés est une intersection finie de réunions finies de pavés, donc, en développant, une réunion finie de pavés : $\mathcal{E}_{n}$ est une algèbre de Boole. Si $A = P_{1} \cup \dots \cup P_{k}$, on désunit (exercice 3) : $A = \mathop{\displaystyle \bigsqcup_{i}}P_{i} \cap {P_{1}}^{c} \cap \dots \cap {P_{i-1}}^{c}$ ; chaque terme est l'intersection d'un pavé et de réunions disjointes de pavés, donc une réunion disjointe de pavés.

    **4.** Non : $\mathbb{Q} = \mathop{\displaystyle \bigcup_{r \in \mathbb{Q}}}\{r\}$ est une réunion dénombrable de pavés de $\mathbb{R}$, mais n'est pas réunion finie d'intervalles (les intervalles contenus dans $\mathbb{Q}$ sont des points, et $\mathbb{Q}$ est infini). C'est pour passer de $\mathcal{E}_{n}$ à une tribu que le cours introduit la tribu borélienne, engendrée par $\mathcal{E}_{n}$ (prop. 10).
- id: "l3-in-01-09"
  feuille: "f-l3-in-01"
  numero: 9
  partie: "Algèbres de Boole et tribus"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [algèbres de Boole et tribus, classe monotone]
  noeuds: [m-tribus, m-dynkin]
  notions: [tribu, tribu-engendree, classe-monotone]
  source: "Lyon 1 (TD02 2020), exercices 5, 6 et 11 (b) ; Exo7 (fic00142), exercice 2 (« classe monotone » au sens des limites monotones)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On dit qu'une famille $\mathcal{M} \subset \mathcal{P}(\Omega)$ est *stable par limites monotones* si la réunion de toute suite croissante d'éléments de $\mathcal{M}$ et l'intersection de toute suite décroissante d'éléments de $\mathcal{M}$ appartiennent à $\mathcal{M}$. Pour $\mathcal{A} \subset \mathcal{P}(\Omega)$, on note $\mathcal{M}(\mathcal{A})$ la plus petite famille stable par limites monotones contenant $\mathcal{A}$, et $\mathcal{E}(\mathcal{A})$ l'algèbre de Boole engendrée par $\mathcal{A}$.

    **1.** Justifier l'existence de $\mathcal{M}(\mathcal{A})$. Montrer qu'une tribu est stable par limites monotones.

    **2.** Montrer qu'une algèbre de Boole stable par limites monotones est une tribu.

    **3.** On prend $\Omega = \{1, 2, 3\}$ et $\mathcal{A} = \{\{1\}\}$. Montrer que $\mathcal{E}(\mathcal{A}) = \mathcal{T}(\mathcal{A}) = \{\emptyset, \Omega, \{1\}, \{2, 3\}\}$ et que $\mathcal{M}(\mathcal{A}) = \mathcal{A}$. Quelle est la plus petite classe monotone, au sens du cours, contenant $\mathcal{A}$ ?

    **4.** On prend $\Omega = \mathbb{N}$ et $\mathcal{A} = \{\{n\} \,;\, n \in \mathbb{N}\}$. Montrer que $\mathcal{T}(\mathcal{A}) = \mathcal{P}(\mathbb{N})$, que $\mathcal{E}(\mathcal{A})$ est l'ensemble des parties finies ou de complémentaire fini, et que $\mathcal{M}(\mathcal{A}) = \mathcal{A}$. En déduire qu'une algèbre de Boole n'est pas stable, en général, par réunion ou intersection dénombrable.
  corrige: |
    **1.** $\mathcal{P}(\Omega)$ est stable par limites monotones, et une intersection de familles stables par limites monotones l'est encore : $\mathcal{M}(\mathcal{A})$ est l'intersection de toutes celles qui contiennent $\mathcal{A}$. Une tribu est stable par réunion et intersection dénombrables, donc par limites monotones.

    **2.** Soit $\mathcal{E}$ une algèbre de Boole stable par limites monotones et $(A_{n})$ une suite de $\mathcal{E}$. Les $B_{n} = A_{0} \cup \dots \cup A_{n}$ sont dans $\mathcal{E}$ et forment une suite croissante, donc $\mathop{\displaystyle \bigcup} A_{n} = \mathop{\displaystyle \bigcup} B_{n} \in \mathcal{E}$ : $\mathcal{E}$ est une tribu.

    **3.** $\{\emptyset, \Omega, \{1\}, \{2, 3\}\}$ est une tribu (finie) qui contient $\{1\}$, et toute algèbre de Boole contenant $\{1\}$ contient ces quatre parties : $\mathcal{E}(\mathcal{A}) = \mathcal{T}(\mathcal{A})$ est cet ensemble. Une suite monotone d'éléments de $\mathcal{A} = \{\{1\}\}$ est constante, donc $\mathcal{A}$ est stable par limites monotones et $\mathcal{M}(\mathcal{A}) = \mathcal{A}$. Une classe monotone au sens du cours contient $\Omega$, donc $\{1\}$, $\Omega \setminus \{1\} = \{2, 3\}$ et $\Omega \setminus \Omega = \emptyset$ : la plus petite est la tribu $\mathcal{T}(\mathcal{A})$, conformément au lemme de classe monotone (cours, th. 1), puisque $\mathcal{A}$ est un $\pi$-système.

    **4.** Toute partie de $\mathbb{N}$ est réunion dénombrable de singletons, donc $\mathcal{T}(\mathcal{A}) = \mathcal{P}(\mathbb{N})$. L'ensemble $\mathcal{F}$ des parties finies ou de complémentaire fini est une algèbre de Boole (stable par complémentaire, et la réunion de deux parties est finie si les deux le sont, de complémentaire fini sinon) ; il contient les singletons, et toute algèbre de Boole qui les contient contient les parties finies et leurs complémentaires : $\mathcal{E}(\mathcal{A}) = \mathcal{F}$. Deux singletons distincts ne sont pas emboîtés, donc une suite monotone de singletons est constante : $\mathcal{M}(\mathcal{A}) = \mathcal{A}$. Enfin, $2\mathbb{N} = \mathop{\displaystyle \bigcup_{k}}\{2k\}$ n'est ni fini ni de complémentaire fini : $\mathcal{F}$ n'est pas stable par réunion dénombrable, et, par passage au complémentaire, pas non plus par intersection dénombrable.

    Cet exemple montre que les deux notions de « classe monotone » ne se comportent pas de la même façon : la famille stable par limites monotones engendrée par $\mathcal{A}$ peut être bien plus petite que $\mathcal{T}(\mathcal{A})$. Le théorème de Halmos, cité à l'exercice 35, affirme l'égalité lorsque $\mathcal{A}$ est une algèbre de Boole.
