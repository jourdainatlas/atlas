  page_enonce: 7
  page_corrige: 11
  enonce: |
    On suppose $\mu$ $\sigma$-finie, et l'on se donne une suite $(\Omega_{n})_{n \geqslant 1}$ d'éléments de $\mathcal{T}$ de mesures finies, de réunion $\Omega$.

    **1.** Montrer qu'il existe une suite $(\Omega'_{n})$ d'éléments de $\mathcal{T}$, deux à deux disjoints et de mesures finies, de réunion $\Omega$.

    **2.** Pour $A \in \mathcal{T}$, on pose $\mu_{n}(A) = \mu\big(A \cap (\Omega_{1} \cup \dots \cup \Omega_{n})\big)$. Montrer que $\mu_{n}$ est une mesure finie et que, pour tout $A \in \mathcal{T}$, la suite $(\mu_{n}(A))$ croît vers $\mu(A)$.
  corrige: |
    **1.** On désunit (exercice 3) : $\Omega'_{1} = \Omega_{1}$, $\Omega'_{n} = \Omega_{n} \setminus (\Omega_{1} \cup \dots \cup \Omega_{n-1})$. Ces parties sont disjointes, de réunion $\Omega$, et $\mu(\Omega'_{n}) \leqslant \mu(\Omega_{n}) < +\infty$.

    **2.** Soit $F_{n} = \Omega_{1} \cup \dots \cup \Omega_{n}$, de mesure au plus $\mathop{\displaystyle \sum_{i \leqslant n}}\mu(\Omega_{i}) < +\infty$. L'application $\mu_{n} = \mu(\,\cdot\, \cap F_{n})$ est une mesure (on intersecte une réunion disjointe avec $F_{n}$), de masse totale $\mu(F_{n})$ finie. Pour $A \in \mathcal{T}$, la suite $(A \cap F_{n})$ croît vers $A$, donc $\mu_{n}(A)$ croît vers $\mu(A)$ (cours, prop. 15). Ce procédé permet d'étendre aux mesures $\sigma$-finies des résultats établis pour les mesures finies ; le cours l'utilise pour l'unicité des mesures (prop. 18) et le chapitre 7 pour la mesure produit.
- id: "l3-in-01-26"
  feuille: "f-l3-in-01"
