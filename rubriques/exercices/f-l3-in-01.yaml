  enonce: |
    **1.** Montrer que la réunion de deux tribus n'est pas toujours une tribu.

    **2.** Montrer que la réunion d'une suite finie et croissante de tribus est une tribu.

    **3.** Pour $n \in \mathbb{N}$, soit $\mathcal{T}_{n}$ la tribu sur $\mathbb{N}$ engendrée par $\mathcal{P}(\{0, \dots, n\})$. Décrire $\mathcal{T}_{n}$. Montrer que $(\mathcal{T}_{n})$ est une suite croissante de tribus, mais que $\mathop{\displaystyle \bigcup_{n}}\mathcal{T}_{n}$ n'est pas une tribu.
  corrige: |
    **1.** Sur $\Omega = \{1, 2, 3\}$, $\mathcal{T}_{1} = \{\emptyset, \Omega, \{1\}, \{2, 3\}\}$ et $\mathcal{T}_{2} = \{\emptyset, \Omega, \{2\}, \{1, 3\}\}$ sont des tribus, mais $\{1\} \cup \{2\} = \{1, 2\}$ n'est pas dans $\mathcal{T}_{1} \cup \mathcal{T}_{2}$.

    **2.** Si $\mathcal{T}_{1} \subset \dots \subset \mathcal{T}_{n}$, la réunion est $\mathcal{T}_{n}$.

    **3.** $\mathcal{T}_{n}$ est engendrée par la partition $\{0\}$, …, $\{n\}$, $\{n + 1, n + 2, \dots\}$ ; c'est l'ensemble des parties $A$ telles que $A$ contienne $\{n + 1, n + 2, \dots\}$ ou ne le rencontre pas. Chaque atome de $\mathcal{T}_{n}$ est réunion d'atomes de $\mathcal{T}_{n+1}$, donc $\mathcal{T}_{n} \subset \mathcal{T}_{n+1}$. Les singletons $\{2k\}$ sont tous dans $\mathop{\displaystyle \bigcup}\mathcal{T}_{n}$ (on a $\{2k\} \in \mathcal{T}_{2k}$), mais leur réunion $2\mathbb{N}$ n'est dans aucun $\mathcal{T}_{n}$ : elle rencontre $\{n + 1, \dots\}$ sans le contenir. La réunion n'est pas stable par réunion dénombrable : *une réunion croissante de tribus n'est pas une tribu en général*, ce qui explique qu'on parle de la tribu *engendrée* par une réunion.
- id: "l3-in-01-13"
  feuille: "f-l3-in-01"
  numero: 13
