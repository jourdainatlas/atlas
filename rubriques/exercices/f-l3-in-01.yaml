  enonce: |
    **1.** Soit $\mu$ une probabilité sur $([0, 1], \mathcal{B}([0, 1]))$ telle que, pour tout borélien $B$, $\mu(B) > 0$ entraîne $\mu([0, 1] \setminus B) = 0$. Construire une suite décroissante de segments $I_{j} \subset [0, 1]$, avec $I_{0} = [0, 1]$, $I_{j}$ de longueur $2^{-j}$ et $\mu(I_{j}) = 1$. En déduire qu'il existe $a \in [0, 1]$ tel que $\mu = \delta_{a}$.

    **2.** Soit $\nu$ une mesure $\sigma$-finie sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$ telle que, pour tout borélien $B$, $\nu(B) > 0$ entraîne $\nu(\mathbb{R} \setminus B) = 0$. Montrer qu'il existe $a \in \mathbb{R}$ et $b \in [0, +\infty[$ tels que $\nu = b\,\delta_{a}$. L'hypothèse de $\sigma$-finitude est-elle utile ?
  corrige: |
    **1.** Si $\mu(I_{j}) = 1$, on coupe $I_{j}$ en deux moitiés fermées $L$ et $R$ ; comme $\mu(L) + \mu(R) \geqslant 1$, l'une, disons $L$, est de mesure non nulle, donc $\mu([0, 1] \setminus L) = 0$ et $\mu(L) = 1$. On pose $I_{j+1} = L$. Les $I_{j}$ sont emboîtés, de longueur $2^{-j}$, et se réduisent à un point $a$ ; par continuité décroissante, $\mu(\{a\}) = \mathop{\displaystyle \lim}\mu(I_{j}) = 1$. Pour tout borélien $B$, $\mu(B) = 1$ si $a \in B$ (car $\mu(B) \geqslant \mu(\{a\})$) et $\mu(B) = 0$ sinon (car $\mu(B) \leqslant \mu([0, 1] \setminus \{a\}) = 0$) : $\mu = \delta_{a}$.

    **2.** Si $\nu = 0$, on prend $b = 0$. Sinon, $\mathbb{R}$ est la réunion des $\Omega_{k}$ de mesures finies, dont l'un vérifie $\nu(\Omega_{k}) > 0$, d'où $\nu(\mathbb{R} \setminus \Omega_{k}) = 0$ : $\nu$ est finie, de masse $b = \nu(\Omega_{k}) \in ]0, +\infty[$. L'un des segments $[m, m + 1]$, $m \in \mathbb{Z}$, est de mesure non nulle, donc porte toute la masse ; la question 1, appliquée à $\dfrac{1}{b}\nu$ transportée sur $[0, 1]$ par translation, donne $\nu = b\,\delta_{a}$. Sans $\sigma$-finitude, la mesure $\nu(B) = +\infty$ si $0 \in B$, $\nu(B) = 0$ sinon, vérifie l'hypothèse et n'est pas de la forme $b\,\delta_{a}$ avec $b$ fini.
- id: "l3-in-01-30"
  feuille: "f-l3-in-01"
  numero: 30
  partie: "Mesures"
  etoiles: 1
  types: [Calcul]
  mots_cles: [mesures, mesure image, mesures discrètes]
  noeuds: [m-mesures]
  notions: [mesure, espace-mesure]
  source: "Lyon 1 (TD02 2020), exercice 44 ; TD2 Paris-Dauphine, exercice 5"
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soit $(\Omega', \mathcal{T}')$ un espace mesurable et $f : \Omega \to \Omega'$ telle que $f^{-1}(B) \in \mathcal{T}$ pour tout $B \in \mathcal{T}'$. On rappelle (proposition 14 du cours) que $f_{*}\mu(B) = \mu\big(f^{-1}(B)\big)$ définit une mesure sur $(\Omega', \mathcal{T}')$, la mesure image de $\mu$ par $f$.

    **1.** On suppose que $\mathcal{T}'$ contient les singletons. Déterminer $f_{*}\delta_{a}$ pour $a \in \Omega$.

    **2.** On suppose que $\mu$ est une probabilité. Pour $B \in \mathcal{T}$, déterminer la mesure image de $\mu$ par $\chi_{B} : \Omega \to \mathbb{R}$.

    **3.** Soit $\Omega = \{1, \dots, 6\}^{2}$ muni de $\mu = \dfrac{1}{36}c$, où $c$ est la mesure de comptage, et $s(i, j) = i + j$. Déterminer $s_{*}\mu$.
  corrige: |
    **1.** $f_{*}\delta_{a}(B) = \delta_{a}\big(f^{-1}(B)\big) = \chi_{B}(f(a))$, d'où $\boxed{f_{*}\delta_{a} = \delta_{f(a)}}$.

    **2.** $\chi_{B}^{-1}(C)$ vaut $\emptyset$, ${B}^{c}$, $B$ ou $\Omega$ selon que $C$ ne contient ni $0$ ni $1$, $0$ seulement, $1$ seulement, ou les deux : $\boxed{(\chi_{B})_{*}\mu = \mu({B}^{c})\,\delta_{0} + \mu(B)\,\delta_{1}}$, la loi de Bernoulli de paramètre $\mu(B)$.

    **3.** $s_{*}\mu(\{k\}) = \dfrac{1}{36}\operatorname{card}\{(i, j) \,;\, i + j = k\} = \dfrac{6 - |k - 7|}{36}$ pour $2 \leqslant k \leqslant 12$, d'où 
    $$s_{*}\mu = \sum_{k=2}^{12}\frac{6 - |k - 7|}{36}\,\delta_{k}\text{.}$$

    ![Figure](documents/figures/3f669d33af1d0f28.svg)

    La mesure image de la mesure uniforme sur les $36$ issues de deux dés par la somme : les masses (multipliées par $36$) croissent de $1$ à $6$ puis décroissent.
- id: "l3-in-01-31"
  feuille: "f-l3-in-01"
  numero: 31
  partie: "Mesures"
