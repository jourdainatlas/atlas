  noeuds: [m-mesures]
  notions: [mesure, espace-mesure]
  source: "Lyon 1 (TD03 2020), exercice 35 (a) et (b)(i)"
  page_enonce: 8
  page_corrige: 14
  enonce: |
    **1.** Soit $(a_{n,k})_{n, k \in \mathbb{N}}$ une famille de réels positifs telle que, pour tout $n$, la suite $(a_{n,k})_{k}$ soit croissante, de limite $a_{n} \in [0, +\infty]$. Montrer que $\displaystyle\mathop{\displaystyle \lim_{k \to +\infty}}\mathop{\displaystyle \sum_{n \in \mathbb{N}}}a_{n,k} = \mathop{\displaystyle \sum_{n \in \mathbb{N}}}a_{n}$.

    **2.** Soit $(\mu_{k})$ une suite de mesures sur $(\Omega, \mathcal{T})$ telle que, pour tout $A \in \mathcal{T}$, la suite $(\mu_{k}(A))$ soit croissante. Montrer que $\mu(A) = \mathop{\displaystyle \lim_{k}}\mu_{k}(A)$ définit une mesure sur $(\Omega, \mathcal{T})$.

    **3.** Le résultat subsiste-t-il pour une suite décroissante de mesures ? On pourra considérer $\mu_{k} = c\big(\,\cdot\, \cap \{k, k + 1, \dots\}\big)$ sur $\mathbb{N}$.
  corrige: |
    **1.** Pour tout $k$, $\mathop{\displaystyle \sum_{n}}a_{n,k} \leqslant \mathop{\displaystyle \sum_{n}}a_{n}$, et la suite $\big(\mathop{\displaystyle \sum_{n}}a_{n,k}\big)_{k}$ est croissante, de limite $S \leqslant \mathop{\displaystyle \sum} a_{n}$. Inversement, pour $N$ fixé, $\mathop{\displaystyle \sum_{n \leqslant N}}a_{n,k} \leqslant S$ ; une somme finie passe à la limite : $\mathop{\displaystyle \sum_{n \leqslant N}}a_{n} \leqslant S$, et l'on fait tendre $N$ vers $+\infty$. C'est une première forme du théorème de convergence monotone (chapitre 3).

    **2.** $\mu(\emptyset) = 0$, et pour une suite disjointe, $\mu\big(\mathop{\displaystyle \bigcup} A_{n}\big) = \mathop{\displaystyle \lim_{k}}\mathop{\displaystyle \sum_{n}}\mu_{k}(A_{n}) = \mathop{\displaystyle \sum_{n}}\mathop{\displaystyle \lim_{k}}\mu_{k}(A_{n}) = \mathop{\displaystyle \sum_{n}}\mu(A_{n})$ par la question 1.

    **3.** Non. Les $\mu_{k} = c(\,\cdot\, \cap \{k, k + 1, \dots\})$ décroissent, et $\mathop{\displaystyle \lim}\mu_{k}(A)$ vaut $+\infty$ si $A$ est infinie, $0$ si elle est finie. Ce n'est pas une mesure : $\mathbb{N}$ est la réunion disjointe des singletons, de « mesure » nulle, alors que la limite vaut $+\infty$ pour $\mathbb{N}$. On retrouve l'obstacle de l'exercice 23 (question 3).
- id: "l3-in-01-32"
  feuille: "f-l3-in-01"
  numero: 32
  partie: "Mesures"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [mesures, lemme de Borel-Cantelli]
  noeuds: [m-mesures]
  notions: [mesure, espace-mesure]
  source: "TD2 Paris-Dauphine 2021-2022, exercices 7 et 8"
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soit $(A_{n})$ une suite d'éléments de $\mathcal{T}$.

    **1.** *(Lemme de Fatou pour les ensembles.)* Montrer que $\mu\big(\mathop{\underline{\mathop{\displaystyle \lim}}}\limits A_{n}\big) \leqslant \mathop{\displaystyle \liminf}\mu(A_{n})$ et, si $\mu$ est finie, que $\mathop{\displaystyle \limsup}\mu(A_{n}) \leqslant \mu\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big)$. Montrer par un exemple que la seconde inégalité peut être fausse si $\mu$ n'est pas finie.

    **2.** Rappeler la démonstration du lemme de Borel-Cantelli (proposition 17 du cours).
  corrige: |
    **1.** Soit $B_{n} = \mathop{\displaystyle \bigcap_{k \geqslant n}}A_{k}$, suite croissante de réunion $\mathop{\underline{\mathop{\displaystyle \lim}}}\limits A_{k}$. Comme $B_{n} \subset A_{k}$ pour $k \geqslant n$, $\mu(B_{n}) \leqslant \mathop{\displaystyle \inf_{k \geqslant n}}\mu(A_{k})$, et la continuité croissante donne $\mu\big(\mathop{\underline{\mathop{\displaystyle \lim}}}\limits A_{n}\big) = \mathop{\displaystyle \lim}\mu(B_{n}) \leqslant \mathop{\displaystyle \liminf}\mu(A_{n})$. Si $\mu$ est finie, on applique ce résultat aux complémentaires (exercice 2) : 
    $$\mu(\Omega) - \mu\big(\mathop{\overline{\lim}}\limits A_{n}\big) = \mu\big(\mathop{\underline{\lim}}\limits{A_{n}}^{c}\big) \leqslant \liminf\big(\mu(\Omega) - \mu(A_{n})\big) = \mu(\Omega) - \limsup\mu(A_{n}).$$
     Pour la mesure de comptage sur $\mathbb{N}$ et $A_{n} = \{n\}$, $\mu(A_{n}) = 1$ pour tout $n$, alors que $\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n} = \emptyset$.

    **2.** Voir la proposition 17 du cours : $\mu\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{k}\big) \leqslant \mu\big(\mathop{\displaystyle \bigcup_{k \geqslant n}}A_{k}\big) \leqslant \mathop{\displaystyle \sum_{k \geqslant n}}\mu(A_{k})$, reste d'une série convergente.
- id: "l3-in-01-33"
  feuille: "f-l3-in-01"
