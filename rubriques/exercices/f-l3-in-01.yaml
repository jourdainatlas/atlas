- id: "l3-in-01-01"
  feuille: "f-l3-in-01"
  numero: 1
  partie: "Préliminaires ensemblistes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [préliminaires ensemblistes]
  noeuds: [m-tribus]
  notions: [tribu]
  source: "S. Rubenthaler (poly-integration-probas-janvier-2009), exercice 1.1 ; exercice 2.1 (d)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On rappelle que, pour $f : E \to F$, $C \subset E$ et $B \subset F$, on note $f(C) = \{f(x) \,;\, x \in C\}$ et $f^{-1}(B) = \{x \in E \,;\, f(x) \in B\}$. Soit $f : \mathbb{R} \to \mathbb{R}$, $x \mapsto x^{2}$.

    **1.** Déterminer $f([-3, -1])$, $f([-3, 1])$ et $f(]-3, 1])$.

    **2.** Déterminer $f^{-1}(]-\infty, 2])$, $f^{-1}(]1, +\infty[)$, $f^{-1}(]-1, 0] \cup [1, 2[)$ et $f^{-1}\Big(\displaystyle\mathop{\displaystyle \bigcup_{n \in \mathbb{N}}}\Big[\dfrac{1}{n + 1}, +\infty\Big[\Big)$.

    **3.** Montrer que, pour toute application $f : E \to F$ et toute famille $(B_{i})_{i \in I}$ de parties de $F$, $f^{-1}\Big(\displaystyle\mathop{\displaystyle \bigcup_{i \in I}}B_{i}\Big) = \mathop{\displaystyle \bigcup_{i \in I}}f^{-1}(B_{i})$, $f^{-1}\Big(\displaystyle\mathop{\displaystyle \bigcap_{i \in I}}B_{i}\Big) = \mathop{\displaystyle \bigcap_{i \in I}}f^{-1}(B_{i})$ et $f^{-1}({B}^{c}) = {\big(f^{-1}(B)\big)}^{c}$. Les égalités analogues pour les images directes sont-elles vraies ?
  corrige: |
    **1.** La fonction carré est décroissante sur $]-\infty, 0]$ et croissante sur $[0, +\infty[$. D'où 
    $$\boxed{f([-3, -1]) = [1, 9], \qquad f([-3, 1]) = [0, 9], \qquad f(]-3, 1]) = [0, 9[}\text{ :}$$
     dans le dernier cas, la valeur $9$ ne serait atteinte qu'en $\pm 3$, qui n'appartiennent pas à $]-3, 1]$.

    **2.** On résout les inéquations : $x^{2} \leqslant 2 \iff |x| \leqslant \sqrt{2}$, $x^{2} > 1 \iff |x| > 1$, $x^{2} \in ]-1, 0] \iff x = 0$ et $x^{2} \in [1, 2[ \iff 1 \leqslant |x| < \sqrt{2}$. Enfin $\mathop{\displaystyle \bigcup_{n}}\big[\dfrac{1}{n + 1}, +\infty\big[ = ]0, +\infty[$. Ainsi 
    $$\boxed{\begin{array}{ll} f^{-1}(]-\infty, 2]) = [-\sqrt{2}, \sqrt{2}], & f^{-1}(]1, +\infty[) = ]-\infty, -1[ \cup ]1, +\infty[, \\[1mm] f^{-1}(]-1, 0] \cup [1, 2[) = ]-\sqrt{2}, -1] \cup \{0\} \cup [1, \sqrt{2}[, & f^{-1}(]0, +\infty[) = \mathbb{R}^{*}. \end{array}}$$

    ![Figure](documents/figures/ca137257ee1b31d2.svg)

    La parabole $y = x^{2}$ : l'image du segment $[-3, 1]$ (en bleu pétrole, sous l'axe des abscisses) est le segment $[0, 9]$ (en carmin sur l'axe des ordonnées), et l'image réciproque de $]-\infty, 2]$ est le segment ocre $[-\sqrt{2}, \sqrt{2}]$, formé des abscisses des points de la courbe situés sous la droite $y = 2$.

    **3.** On a $x \in f^{-1}\big(\mathop{\displaystyle \bigcup} B_{i}\big) \iff f(x) \in \mathop{\displaystyle \bigcup} B_{i} \iff \exists i,\ f(x) \in B_{i} \iff x \in \mathop{\displaystyle \bigcup} f^{-1}(B_{i})$ ; on remplace « il existe » par « pour tout » pour les intersections, et $x \in f^{-1}({B}^{c}) \iff f(x) \notin B \iff x \notin f^{-1}(B)$. L'image directe commute avec les réunions ($y \in f(\mathop{\displaystyle \bigcup} C_{i})$ si et seulement si $y = f(x)$ avec $x$ dans l'un des $C_{i}$), mais seulement $f\big(\mathop{\displaystyle \bigcap} C_{i}\big) \subset \mathop{\displaystyle \bigcap} f(C_{i})$ : pour $C_{1} = \{-1\}$ et $C_{2} = \{1\}$, $f(C_{1} \cap C_{2}) = \emptyset$ alors que $f(C_{1}) \cap f(C_{2}) = \{1\}$. De même $f({\mathbb{R}}^{c}) = \emptyset$, alors que ${f(\mathbb{R})}^{c} = ]-\infty, 0[$. *L'erreur la plus répandue* est d'appliquer aux images directes les règles des images réciproques : seules ces dernières respectent toutes les opérations ensemblistes, et c'est pourquoi elles seules interviennent dans la définition des fonctions mesurables.
- id: "l3-in-01-02"
  feuille: "f-l3-in-01"
  numero: 2
  partie: "Préliminaires ensemblistes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [préliminaires ensemblistes]
  noeuds: [m-tribus]
  notions: [tribu]
  source: "Exo7, B. Tumpach (fic00144), exercice 1 ; Rubenthaler, exercice 2.1 (a)-(c) et 2.2 (b)-(c) ; J. Féjoz (exosIntegration), exercice 1.2 ; Lyon 1 (TD02 2020), exercice 12"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Une suite $(A_{n})$ de parties de $\Omega$ *converge* si $\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n} = \mathop{\underline{\mathop{\displaystyle \lim}}}\limits A_{n}$ ; cette partie commune est sa limite, notée $\mathop{\displaystyle \lim} A_{n}$.

    **1.** Montrer que $\Big(\displaystyle\mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}A_{n}\Big)^{c} = \mathop{\displaystyle \bigcup_{n \in \mathbb{N}}}{A_{n}}^{c}$ et $\Big(\displaystyle\mathop{\displaystyle \bigcup_{n \in \mathbb{N}}}A_{n}\Big)^{c} = \mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}{A_{n}}^{c}$. Que vaut ${\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big)}^{c}$ ?

    **2.** Soit $a < b$ deux réels. Montrer que 
    $$[a, b] = \bigcap_{n \geqslant 1}\Big]a - \frac{1}{n}, b + \frac{1}{n}\Big[ \qquad \text{et} \qquad ]a, b[ = \bigcup_{n \geqslant 1}\Big[a + \frac{1}{n}, b - \frac{1}{n}\Big].$$
     Déterminer de même $\displaystyle\mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}\Big]1, 1 + \dfrac{1}{n + 1}\Big]$, $\displaystyle\mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}\Big]1, 2 + \dfrac{1}{n + 1}\Big]$ et $\displaystyle\mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}\Big]1 - \dfrac{1}{n + 1}, 2\Big]$.

    **3.** Montrer qu'une suite croissante $(A_{n})$ converge vers $\mathop{\displaystyle \bigcup} A_{n}$, et qu'une suite décroissante converge vers $\mathop{\displaystyle \bigcap} A_{n}$. Montrer que $(A_{n})$ est croissante et de limite $A$ si et seulement si la suite de fonctions $(\chi_{A_{n}})$ est croissante et converge simplement vers $\chi_{A}$, et énoncer le résultat analogue pour une suite décroissante.

    **4.** Déterminer les limites des suites définies pour $n \geqslant 1$ par $A_{n} = \Big[-\dfrac{1}{n}, 1\Big]$ et $A'_{n} = \Big]-\dfrac{1}{n}, 1\Big]$. Donner un exemple de suite non constante de parties de $\mathbb{R}$ de limite $]0, 1]$.

    **5.** Déterminer les limites supérieure et inférieure de la suite définie par $B_{2n-1} = \Big[-2 - \dfrac{1}{n}, 1\Big]$ et $B_{2n} = \Big[-1, 2 + \dfrac{1}{n^{2}}\Big]$, $n \geqslant 1$. Existe-t-il une suite $(C_{n})$ de parties de $\mathbb{R}$ telle que $\mathop{\overline{\mathop{\displaystyle \lim}}}\limits C_{n} = [-1, 2]$ et $\mathop{\underline{\mathop{\displaystyle \lim}}}\limits C_{n} = [-2, 1]$ ?

    **6.** Soit $(a_{n})$ et $(b_{n})$ deux suites réelles de limites respectives $-1$ et $1$. À quelle condition la suite $([a_{n}, b_{n}])$ a-t-elle pour limite $[-1, 1[$ ? Est-il possible qu'elle n'ait pas de limite ?
  corrige: |
    **1.** $x \notin \mathop{\displaystyle \bigcap} A_{n} \iff \exists n,\ x \notin A_{n} \iff x \in \mathop{\displaystyle \bigcup}{A_{n}}^{c}$ ; la seconde égalité s'obtient en appliquant la première aux ${A_{n}}^{c}$. En combinant les deux, ${\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big)}^{c} = {\big(\mathop{\displaystyle \bigcap_{n}}\mathop{\displaystyle \bigcup_{k \geqslant n}}A_{k}\big)}^{c} = \mathop{\displaystyle \bigcup_{n}}\mathop{\displaystyle \bigcap_{k \geqslant n}}{A_{k}}^{c}$, donc 
    $$\boxed{{\big(\mathop{\overline{\lim}}\limits A_{n}\big)}^{c} = \mathop{\underline{\lim}}\limits{A_{n}}^{c}}\text{.}$$

    **2.** Un réel $x$ est dans tous les $]a - \dfrac{1}{n}, b + \dfrac{1}{n}[$ si et seulement si $a - \dfrac{1}{n} < x < b + \dfrac{1}{n}$ pour tout $n$, c'est-à-dire $a \leqslant x \leqslant b$ en passant à la limite. Il est dans l'un des $[a + \dfrac{1}{n}, b - \dfrac{1}{n}]$ si et seulement si $a < x < b$ : dans ce cas, il suffit de prendre $\dfrac{1}{n} \leqslant \mathop{\displaystyle \min}(x - a, b - x)$. De même, 
    $$\boxed{\bigcap_{n}\Big]1, 1 + \frac{1}{n + 1}\Big] = \emptyset, \qquad \bigcap_{n}\Big]1, 2 + \frac{1}{n + 1}\Big] = ]1, 2], \qquad \bigcap_{n}\Big]1 - \frac{1}{n + 1}, 2\Big] = [1, 2]}\text{.}$$
     Dans le premier cas, tout $x > 1$ sort de l'intervalle dès que $\dfrac{1}{n + 1} < x - 1$ ; dans le dernier, la borne $1$ est atteinte à la limite et appartient à l'intersection, alors qu'aucun des intervalles n'est fermé à gauche en $1$.

    **3.** Si $(A_{n})$ est croissante, $\mathop{\displaystyle \bigcup_{k \geqslant n}}A_{k} = \mathop{\displaystyle \bigcup_{k}}A_{k}$ pour tout $n$, d'où $\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n} = \mathop{\displaystyle \bigcup} A_{k}$, et $\mathop{\displaystyle \bigcap_{k \geqslant n}}A_{k} = A_{n}$, d'où $\mathop{\underline{\mathop{\displaystyle \lim}}}\limits A_{n} = \mathop{\displaystyle \bigcup} A_{n}$. Le cas décroissant s'en déduit par passage au complémentaire (question 1). Ensuite, $A_{n} \subset A_{n+1}$ équivaut à $\chi_{A_{n}} \leqslant \chi_{A_{n+1}}$, et, pour une suite croissante, $\chi_{A_{n}}(x)$ vaut $1$ à partir d'un certain rang si $x \in \mathop{\displaystyle \bigcup} A_{n}$, et $0$ sinon : $(\chi_{A_{n}})$ converge simplement vers $\chi_{\bigcup A_{n}}$, qui vaut $\chi_{A}$ si et seulement si $A = \mathop{\displaystyle \bigcup} A_{n}$. Pour une suite décroissante, $(\chi_{A_{n}})$ décroît et converge simplement vers $\chi_{\bigcap A_{n}}$. Plus généralement, $\chi_{\mathop{\overline{\lim}}\limits A_{n}} = \mathop{\displaystyle \limsup}\chi_{A_{n}}$ et $\chi_{\mathop{\underline{\lim}}\limits A_{n}} = \mathop{\displaystyle \liminf}\chi_{A_{n}}$, comme le remarque le cours.

    **4.** Les deux suites sont décroissantes, de limites 
    $$\boxed{\lim\Big[-\frac{1}{n}, 1\Big] = \lim\Big]-\frac{1}{n}, 1\Big] = [0, 1]}\text{ :}$$
     dans le second cas, $0$ appartient à tous les intervalles. La suite croissante $\big(\big[\dfrac{1}{n}, 1\big]\big)_{n \geqslant 1}$ a pour limite $]0, 1]$.

    **5.** Un réel est dans une infinité de $B_{2n-1}$ si et seulement s'il est dans $[-2, 1]$, et dans tous les $B_{2n-1}$ à partir d'un certain rang dans le même cas : la borne $-2 - \dfrac{1}{n}$ décroît vers $-2$ en restant strictement en dessous. De même pour les $B_{2n}$, avec $[-1, 2]$. Par conséquent 
    $$\boxed{\mathop{\underline{\lim}}\limits B_{n} = [-2, 1] \cap [-1, 2] = [-1, 1], \qquad \mathop{\overline{\lim}}\limits B_{n} = [-2, 1] \cup [-1, 2] = [-2, 2]}\text{.}$$
     On a toujours $\mathop{\underline{\mathop{\displaystyle \lim}}}\limits C_{n} \subset \mathop{\overline{\mathop{\displaystyle \lim}}}\limits C_{n}$ ; comme $[-2, 1] \not\subset [-1, 2]$, aucune suite $(C_{n})$ ne convient.

    ![Figure](documents/figures/0d35c06ed1989ea2.svg)

    Les intervalles d'indice impair (bleu ardoise) se resserrent vers $[-2, 1]$, ceux d'indice pair (ocre) vers $[-1, 2]$. La limite inférieure retient les points qui finissent par être dans *tous* les intervalles, la limite supérieure ceux qui reviennent *une infinité de fois*.

    **6.** Les points $x < -1$ et $x > 1$ sortent de $[a_{n}, b_{n}]$ à partir d'un certain rang, et les points de $]-1, 1[$ y entrent à partir d'un certain rang. Tout se joue donc en $-1$ et en $1$. On a $-1 \in \mathop{\underline{\mathop{\displaystyle \lim}}}\limits[a_{n}, b_{n}]$ si et seulement si $a_{n} \leqslant -1$ à partir d'un certain rang, et $1 \notin \mathop{\overline{\mathop{\displaystyle \lim}}}\limits[a_{n}, b_{n}]$ si et seulement si $b_{n} < 1$ à partir d'un certain rang : 
    $$\boxed{\lim[a_{n}, b_{n}] = [-1, 1[ \iff \text{à partir d'un certain rang, } a_{n} \leqslant -1 \text{ et } b_{n} < 1}\text{.}$$
     La limite peut ne pas exister : pour $a_{n} = -1$ et $b_{n} = 1 + \dfrac{(-1)^{n}}{n}$, le point $1$ est dans une infinité d'intervalles sans être dans tous à partir d'un certain rang.
