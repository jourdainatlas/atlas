  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** *Mesure de comptage.* Montrer que l'application $c : \mathcal{P}(\Omega) \to [0, +\infty]$ définie par $c(A) = \operatorname{card} A$ si $A$ est fini et $c(A) = +\infty$ sinon est une mesure sur $(\Omega, \mathcal{P}(\Omega))$.

    **2.** *Mesure de Dirac.* Soit $\mathcal{T}$ une tribu sur $\Omega$ et $a \in \Omega$. Montrer que $\delta_{a}(A) = \chi_{A}(a)$ définit une mesure sur $(\Omega, \mathcal{T})$.

    **3.** Soit $a_{1}$, …, $a_{k}$ des points distincts de $\Omega$ et $p_{1}$, …, $p_{k} > 0$. Montrer que $\mu = \mathop{\displaystyle \sum_{i=1}^{k}}p_{i}\delta_{a_{i}}$ est une mesure. À quelle condition est-ce une probabilité ? Que vaut $\mu$ quand $\Omega = \{a_{1}, \dots, a_{k}\}$ et $p_{i} = 1$ pour tout $i$ ?
  corrige: |
    **1.** $c(\emptyset) = 0$. Soit $(A_{n})$ des parties deux à deux disjointes. Si elles sont toutes finies et que seules un nombre fini sont non vides, $\operatorname{card}\mathop{\displaystyle \bigcup} A_{n} = \mathop{\displaystyle \sum}\operatorname{card} A_{n}$. Sinon, l'une est infinie ou une infinité sont non vides : la réunion est infinie et la somme vaut $+\infty$.

    **2.** $\delta_{a}(\emptyset) = 0$, et $a$ appartient à au plus une des $A_{n}$ deux à deux disjointes : $\chi_{\bigcup A_{n}}(a) = \mathop{\displaystyle \sum_{n}}\chi_{A_{n}}(a)$.

    **3.** Une combinaison à coefficients positifs de mesures est une mesure, les sommes de séries à termes positifs pouvant être permutées (cours, prop. 13). C'est une probabilité si et seulement si $\mathop{\displaystyle \sum} p_{i} = 1$. Lorsque $\Omega = \{a_{1}, \dots, a_{k}\}$ et $p_{i} = 1$, $\mu(A) = \operatorname{card} A$ : c'est la mesure de comptage.
- id: "l3-in-01-23"
  feuille: "f-l3-in-01"
  numero: 23
  partie: "Mesures"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [mesures, mesures discrètes]
  noeuds: [m-mesures]
  notions: [mesure, espace-mesure]
  source: "Lyon 1 (TD02 2020), exercices 35 et 36"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Prouver ou réfuter les assertions suivantes.

    **1.** Pour tout $A \in \mathcal{T}$, $\mu(\Omega) = \mu(A) + \mu({A}^{c})$.

    **2.** Si $(A_{n})$ est une suite décroissante d'éléments de $\mathcal{T}$ et si $\mu(A_{2}) < +\infty$, alors $\mu\big(\mathop{\displaystyle \bigcap} A_{n}\big) = \mathop{\displaystyle \lim}\mu(A_{n})$.

    **3.** Pour la mesure de comptage sur $\mathbb{N}$, on a $\mu\big(\mathop{\displaystyle \bigcap} A_{n}\big) = \mathop{\displaystyle \lim}\mu(A_{n})$ pour toute suite décroissante $(A_{n})$.

    **4.** Si $A$, $B \in \mathcal{T}$ et $\mu(A \cup B) = \mu(A) + \mu(B)$, alors $A$ et $B$ sont disjoints.

    **5.** Il existe un espace mesuré tel que $\{\mu(A) \,;\, A \in \mathcal{T}\} = \{0, 1, 2\}$.

    **6.** Il existe un espace mesuré tel que $\{\mu(A) \,;\, A \in \mathcal{T}\} = \{0, 1, 3\}$.

    **7.** La mesure de comptage sur $\mathbb{N}$ est finie ; elle est $\sigma$-finie.

    **8.** Si $\mathcal{A}$ engendre $\mathcal{T}$ et si deux mesures $\mu_{1}$, $\mu_{2}$ sur $\mathcal{T}$ coïncident sur $\mathcal{A}$, elles sont égales. Quelles hypothèses raisonnables faut-il ajouter ?
  corrige: |
    **1.** Vrai, par additivité, y compris lorsque l'un des termes est infini.

    **2.** Vrai : on applique la continuité décroissante (cours, prop. 15) à la suite $(A_{n})_{n \geqslant 2}$, de mesures finies.

    **3.** Faux : pour $A_{n} = \{n, n + 1, \dots\}$, $\mu(A_{n}) = +\infty$ pour tout $n$, alors que $\mathop{\displaystyle \bigcap} A_{n} = \emptyset$. L'hypothèse de finitude de la question 2 est donc indispensable.

    **4.** Faux : il suffit que $\mu(A \cap B) = 0$ ; par exemple $A = B = \{1\}$ pour $\mu = \delta_{0}$.

    **5.** Vrai : la mesure de comptage sur $\Omega = \{1, 2\}$.

    **6.** Faux. La plus grande valeur est $\mu(\Omega)$, donc $\mu(\Omega) = 3$ ; s'il existe $A$ avec $\mu(A) = 1$, alors $\mu({A}^{c}) = 3 - 1 = 2$ serait une valeur prise.

    **7.** Elle n'est pas finie, puisque $c(\mathbb{N}) = +\infty$, mais elle est $\sigma$-finie : $\mathbb{N} = \mathop{\displaystyle \bigcup_{n}}\{n\}$.

    **8.** Faux : sur $\Omega = \{1, 2\}$, $\mathcal{A} = \{\{1\}\}$ engendre $\mathcal{P}(\Omega)$, et $\delta_{1} + \delta_{2}$ et $\delta_{1} + 2\delta_{2}$ coïncident sur $\mathcal{A}$ sans être égales. Il faut supposer que $\mathcal{A}$ est un $\pi$-système et que les mesures sont finies et coïncident aussi sur $\Omega$, ou sont $\sigma$-finies par une suite d'éléments de $\mathcal{A}$ (cours, prop. 18). Dans l'exemple, $\mathcal{A}$ est un $\pi$-système, mais $\mu_{1}(\Omega) \neq \mu_{2}(\Omega)$.
