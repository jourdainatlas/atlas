  enonce: |
    **1.** Soit $\Phi : X \to Y$ un homéomorphisme entre deux espaces métriques. Montrer que $A \in \mathcal{B}(X)$ si et seulement si $\Phi(A) \in \mathcal{B}(Y)$.

    **2.** Soit $A \in \mathcal{B}(\mathbb{R}^{n})$ et $B \in \mathcal{B}(\mathbb{R}^{m})$. Montrer que $A \times B \in \mathcal{B}(\mathbb{R}^{n+m})$ (on pourra écrire $A \times B$ comme l'intersection de deux images réciproques par des applications continues).

    **3.** Plus généralement, si $(X, d)$ et $(Y, \delta)$ sont deux espaces métriques et si $X \times Y$ est muni de la distance $\mathop{\displaystyle \max}(d, \delta)$, montrer que $A \times B \in \mathcal{B}(X \times Y)$ pour tous $A \in \mathcal{B}(X)$ et $B \in \mathcal{B}(Y)$.
  corrige: |
    **1.** Si $g : X \to Y$ est continue, la famille $\{B \subset Y \,;\, g^{-1}(B) \in \mathcal{B}(X)\}$ est une tribu (exercice 17) qui contient les ouverts de $Y$, donc elle contient $\mathcal{B}(Y)$ : l'image réciproque d'un borélien par une application continue est un borélien (cours, prop. 11, pour $\mathbb{R}^{n}$). On l'applique à $g = \Phi^{-1}$, pour qui $g^{-1}(A) = \Phi(A)$, puis à $g = \Phi$.

    **2.** Les projections $p : \mathbb{R}^{n+m} \to \mathbb{R}^{n}$ et $q : \mathbb{R}^{n+m} \to \mathbb{R}^{m}$ sont continues, et $A \times B = p^{-1}(A) \cap q^{-1}(B)$ est l'intersection de deux boréliens de $\mathbb{R}^{n+m}$.

    **3.** Même raisonnement : pour la distance $\mathop{\displaystyle \max}(d, \delta)$, les projections de $X \times Y$ sur $X$ et sur $Y$ sont $1$-lipschitziennes, donc continues. Le chapitre 7 précisera que, dans $\mathbb{R}^{n+m}$, les pavés $A \times B$ engendrent $\mathcal{B}(\mathbb{R}^{n+m})$.
