  notions: [mesure, espace-mesure]
  source: "Lyon 1 (TD02 2020), exercice 4 ; Féjoz (exosIntegration), exercice 1.20 ; M61B TD3, exercice 2 (2)"
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $\Omega$ un ensemble non dénombrable et $\mathcal{T} = \{A \subset \Omega \,;\, A \text{ ou } {A}^{c} \text{ est au plus dénombrable}\}$.

    **1.** Montrer que $\mathcal{T}$ est une tribu, et que c'est la tribu engendrée par les singletons.

    **2.** Pour $\Omega = \mathbb{R}$, montrer que $\mathcal{T} \neq \mathcal{P}(\mathbb{R})$. En déduire qu'une réunion quelconque d'éléments d'une tribu (ici, de singletons) n'est pas toujours dans la tribu.

    **3.** On pose $\mu(A) = 0$ si $A$ est au plus dénombrable et $\mu(A) = 1$ sinon. Montrer que $\mu$ est une probabilité sur $(\Omega, \mathcal{T})$, et que $\mu(\{x\}) = 0$ pour tout $x$ (on dit que $\mu$ est *diffuse*).

    **4.** Un *atome* de $\mu$ est un $A \in \mathcal{T}$ tel que $\mu(A) > 0$ et que, pour tout $B \in \mathcal{T}$ contenu dans $A$, $\mu(B) = 0$ ou $\mu(A \setminus B) = 0$. Déterminer les atomes de $\mu$. Le mot « diffuse » est-il bien choisi ?
  corrige: |
    **1.** $\emptyset \in \mathcal{T}$, et la définition est symétrique en $A$ et ${A}^{c}$. Si $(A_{n})$ est une suite de $\mathcal{T}$ : si tous les $A_{n}$ sont au plus dénombrables, leur réunion l'est (exercice 4) ; si l'un, $A_{k}$, a un complémentaire au plus dénombrable, le complémentaire de la réunion, contenu dans ${A_{k}}^{c}$, l'est aussi. $\mathcal{T}$ contient les singletons ; toute tribu qui les contient contient les parties au plus dénombrables (réunions dénombrables) et leurs complémentaires : $\mathcal{T}$ est la tribu engendrée par les singletons.

    **2.** $]0, 1[$ n'est pas dénombrable (exercice 5), et son complémentaire non plus : $]0, 1[ \notin \mathcal{T}$. Pourtant $]0, 1[$ est la réunion des singletons $\{x\}$, $x \in ]0, 1[$, tous dans $\mathcal{T}$ : une tribu n'est stable que par réunion *dénombrable*.

    **3.** $\mu(\emptyset) = 0$. Dans une suite $(A_{n})$ de parties deux à deux disjointes de $\mathcal{T}$, au plus une a un complémentaire au plus dénombrable : si deux, $A$ et $B$, l'avaient, $\Omega = {(A \cap B)}^{c} = {A}^{c} \cup {B}^{c}$ serait au plus dénombrable. Si aucune ne l'a, la réunion est au plus dénombrable et $0 = \mathop{\displaystyle \sum} 0$ ; si une seule l'a, la réunion aussi, et $1 = 1 + 0$. Enfin $\mu(\Omega) = 1$ et $\mu(\{x\}) = 0$.

    **4.** Si $\mu(A) > 0$, ${A}^{c}$ est au plus dénombrable. Pour $B \in \mathcal{T}$ contenu dans $A$, ou bien $B$ est au plus dénombrable et $\mu(B) = 0$, ou bien ${B}^{c}$ l'est, et $A \setminus B \subset {B}^{c}$ est de mesure nulle. Donc 
    $$\boxed{\text{les atomes de } \mu \text{ sont les parties de complémentaire au plus dénombrable}}\text{ ;}$$
     en particulier $\Omega$ est un atome. La mesure est diffuse, puisqu'aucun point n'a de masse, mais purement atomique : un atome n'est pas forcément un point. Le mot « diffuse » ne parle que des points ; cet exemple montre qu'il ne suffit pas à interdire toute concentration de la masse.
- id: "l3-in-01-28"
  feuille: "f-l3-in-01"
  numero: 28
  partie: "Mesures"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [mesures, mesures discrètes]
  noeuds: [m-mesures]
  notions: [mesure, espace-mesure]
  source: "Lyon 1 (TD02 2020), exercices 41 et 43 ; TD2 Paris-Dauphine 2021-2022, exercice 15"
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On suppose que $\mathcal{T}$ contient les singletons, et l'on pose $D = \{x \in \Omega \,;\, \mu(\{x\}) > 0\}$. La mesure $\mu$ est *diffuse* si $D = \emptyset$, *discrète* s'il existe une partie au plus dénombrable $E$ telle que $\mu({E}^{c}) = 0$.

    **1.** L'ensemble $D$ est-il au plus dénombrable lorsque $\mu$ est finie ? $\sigma$-finie ? quelconque ?

    **2.** Montrer que $\mu$ est diffuse si et seulement si toute partie au plus dénombrable est de mesure nulle.

    **3.** Montrer que $\mu$ est discrète si et seulement s'il existe une suite $(a_{n})$ de points de $\Omega$ et une suite $(c_{n})$ d'éléments de $[0, +\infty]$ telles que $\mu = \mathop{\displaystyle \sum} c_{n}\delta_{a_{n}}$.

    **4.** On suppose $\mu$ $\sigma$-finie. Montrer que $\mu$ s'écrit de façon unique $\mu = \mu_{c} + \mu_{d}$, avec $\mu_{c}$ diffuse et $\mu_{d}$ discrète.

    **5.** *Fonction de répartition.* Soit $\mu$ une probabilité sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$ et $F(x) = \mu(]-\infty, x])$. Montrer que $F$ est croissante, continue à droite, de limites $0$ en $-\infty$ et $1$ en $+\infty$, qu'elle a une limite à gauche en tout point et qu'elle est continue en $x$ si et seulement si $\mu(\{x\}) = 0$. Retrouver ainsi que $D$ est au plus dénombrable, et montrer que $\mu$ est diffuse si et seulement si $F(\mathbb{R}) \supset {]0, 1[}$.
  corrige: |
    **1.** Si $\mu$ est finie, $D_{k} = \{x \,;\, \mu(\{x\}) > \dfrac{1}{k}\}$ a au plus $k\,\mu(\Omega)$ éléments : pour $m$ points distincts de $D_{k}$, $\dfrac{m}{k} < \mu(\Omega)$. Donc $D = \mathop{\displaystyle \bigcup_{k}}D_{k}$ est au plus dénombrable. Si $\mu$ est $\sigma$-finie, $D = \mathop{\displaystyle \bigcup_{n}}(D \cap \Omega_{n})$, et chaque $D \cap \Omega_{n}$ est au plus dénombrable par le cas fini appliqué à $\mu(\,\cdot\, \cap \Omega_{n})$. Pour une mesure quelconque, c'est faux : pour la mesure de comptage sur $\mathbb{R}$, $D = \mathbb{R}$.

    **2.** Si $\mu$ est diffuse, une partie au plus dénombrable est une réunion dénombrable de singletons de mesure nulle, donc de mesure nulle. La réciproque est claire.

    **3.** Si $\mu({E}^{c}) = 0$ avec $E = \{a_{n}\}$ au plus dénombrable (les $a_{n}$ distincts), alors pour tout $A \in \mathcal{T}$, $\mu(A) = \mu(A \cap E) = \mathop{\displaystyle \sum_{n}}\mu(\{a_{n}\})\chi_{A}(a_{n})$, c'est-à-dire $\mu = \mathop{\displaystyle \sum} c_{n}\delta_{a_{n}}$ avec $c_{n} = \mu(\{a_{n}\})$. Réciproquement, si $\mu = \mathop{\displaystyle \sum} c_{n}\delta_{a_{n}}$, $E = \{a_{n}\}$ convient.

    **4.** Par 1, $D$ est au plus dénombrable. On pose $\mu_{d}(A) = \mu(A \cap D)$ et $\mu_{c}(A) = \mu(A \setminus D)$ : $\mu_{d}$ est discrète ($\mu_{d}({D}^{c}) = 0$), $\mu_{c}$ est diffuse ($\mu_{c}(\{x\}) = 0$ si $x \in D$, et $\mu(\{x\}) = 0$ sinon), et $\mu = \mu_{c} + \mu_{d}$. Si $\mu = \mu'_{c} + \mu'_{d}$ est une autre décomposition, avec $\mu'_{d}({E}^{c}) = 0$ et $E$ au plus dénombrable, alors $\mu(\{x\}) = \mu'_{d}(\{x\})$ pour tout $x$ (car $\mu'_{c}(\{x\}) = 0$), donc $\mu'_{d}$ est nulle sur les points de $E \setminus D$, et $\mu'_{d}(A) = \mathop{\displaystyle \sum_{x \in A \cap E}}\mu'_{d}(\{x\}) = \mathop{\displaystyle \sum_{x \in A \cap D}}\mu(\{x\}) = \mu_{d}(A)$. Enfin $\mu'_{c}(A \cap D) = 0$ ($D$ est au plus dénombrable) et $\mu'_{d}(A \setminus D) = 0$, d'où $\mu'_{c}(A) = \mu'_{c}(A \setminus D) = \mu(A \setminus D) = \mu_{c}(A)$. On évite ainsi toute soustraction, qui serait illégitime pour des valeurs infinies.

    **5.** $F$ est croissante, puisque $\mu$ l'est. Les suites $]-\infty, x + \dfrac{1}{n}]$ et $]-\infty, -n]$ décroissent vers $]-\infty, x]$ et $\emptyset$, et $]-\infty, n]$ croît vers $\mathbb{R}$ : par continuité (cours, prop. 15, $\mu$ étant finie), $F$ est continue à droite, de limites $0$ et $1$. De même $]-\infty, x - \dfrac{1}{n}]$ croît vers $]-\infty, x[$, donc 
    $$\boxed{F(x^{-}) = \mu(]-\infty, x[), \qquad F(x) - F(x^{-}) = \mu(\{x\})}\text{,}$$
     et $F$ est continue en $x$ si et seulement si $\mu(\{x\}) = 0$. Les sauts d'une fonction croissante sont des intervalles $]F(x^{-}), F(x)[$ deux à deux disjoints, contenant chacun un rationnel : il y en a au plus une infinité dénombrable, ce qui redonne que $D$ est au plus dénombrable. Si $\mu$ est diffuse, $F$ est continue, et le théorème des valeurs intermédiaires, avec les limites $0$ et $1$, donne $F(\mathbb{R}) \supset ]0, 1[$. Si $\mu(\{x\}) > 0$, l'intervalle ouvert non vide $]F(x^{-}), F(x)[$, contenu dans $]0, 1[$, n'est pas atteint par $F$, qui est croissante.

    ![Figure](documents/figures/78053ff09ec348e6.svg)

    La fonction de répartition de $\mu = \dfrac{1}{4}\delta_{-1} + \dfrac{1}{2}\delta_{0} + \dfrac{1}{4}\delta_{2}$ : elle est constante par morceaux, continue à droite (point plein), et saute de $\mu(\{x\})$ (en carmin) en chaque atome. Les valeurs de $]0, 1[$ situées dans les sauts, par exemple $\dfrac{1}{2}$, ne sont pas atteintes.
