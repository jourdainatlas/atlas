  enonce: |
    Soit $f : E \to F$ une application. On dit que $f$ est *mesurable* de $(E, \mathcal{T}_{E})$ dans $(F, \mathcal{T}_{F})$ si $f^{-1}(B) \in \mathcal{T}_{E}$ pour tout $B \in \mathcal{T}_{F}$ ; cette notion sera étudiée au chapitre 3.

    **1.** *Tribu image réciproque.* Soit $\mathcal{T}_{F}$ une tribu sur $F$. Vérifier que $f$ est mesurable de $(E, \mathcal{P}(E))$ dans $(F, \mathcal{T}_{F})$ et que $f^{-1}(\mathcal{T}_{F}) = \{f^{-1}(B) \,;\, B \in \mathcal{T}_{F}\}$ est une tribu sur $E$. Montrer que c'est la plus petite tribu sur $E$ qui rende $f$ mesurable. La décrire lorsque $(F, \mathcal{T}_{F}) = (\mathbb{R}, \mathcal{B}(\mathbb{R}))$ et que $f$ ne prend qu'un nombre fini de valeurs.

    **2.** *Tribu image directe.* Soit $\mathcal{T}_{E}$ une tribu sur $E$. Vérifier que $f$ est mesurable de $(E, \mathcal{T}_{E})$ dans $(F, \{\emptyset, F\})$. Montrer que $\{B \subset F \,;\, f^{-1}(B) \in \mathcal{T}_{E}\}$ est une tribu sur $F$, et que c'est la plus grande tribu sur $F$ qui rende $f$ mesurable ; montrer en revanche que $\{f(A) \,;\, A \in \mathcal{T}_{E}\}$ n'est pas une tribu en général.

    **3.** Déterminer la tribu image directe lorsque $f$ est constante, puis lorsque $f$ prend deux valeurs distinctes $a$ et $b$, avec $f = a$ sur une partie $A$ et $f = b$ sur ${A}^{c}$ ; distinguer les cas $A \in \mathcal{T}_{E}$ et $A \notin \mathcal{T}_{E}$.
  corrige: |
    **1.** Toute partie de $E$ est dans $\mathcal{P}(E)$, donc $f$ est mesurable de $(E, \mathcal{P}(E))$ dans $(F, \mathcal{T}_{F})$. Les images réciproques commutant avec complémentaires et réunions (exercice 1), $f^{-1}(\mathcal{T}_{F})$ est une tribu, et toute tribu rendant $f$ mesurable contient les $f^{-1}(B)$ : c'est la plus petite. Si $f$ prend les valeurs distinctes $y_{1}$, …, $y_{k}$, $f^{-1}(B)$ est la réunion des $f^{-1}(\{y_{i}\})$ pour $y_{i} \in B$ : 
    $$\boxed{f^{-1}(\mathcal{B}(\mathbb{R})) = \mathcal{T}\big(\{f^{-1}(\{y_{1}\}), \dots, f^{-1}(\{y_{k}\})\}\big) \text{, tribu à } 2^{k} \text{ éléments}}\text{.}$$

    **2.** $f^{-1}(\emptyset) = \emptyset$ et $f^{-1}(F) = E$ sont dans $\mathcal{T}_{E}$. Pour la même raison qu'en 1, $\{B \,;\, f^{-1}(B) \in \mathcal{T}_{E}\}$ est une tribu ; une tribu $\mathcal{T}_{F}$ rend $f$ mesurable si et seulement si elle y est contenue : c'est la plus grande. En revanche, pour $f$ constante égale à $c$ et $F$ ayant au moins deux points, $\{f(A) \,;\, A \in \mathcal{T}_{E}\} = \{\emptyset, \{c\}\}$ ne contient pas $F$.

    **3.** Si $f$ est constante, $f^{-1}(B)$ vaut $E$ ou $\emptyset$, toujours dans $\mathcal{T}_{E}$ : la tribu image directe est $\mathcal{P}(F)$. Si $f$ prend les valeurs $a$ sur $A$ et $b$ sur ${A}^{c}$, $f^{-1}(B)$ vaut $\emptyset$, $A$, ${A}^{c}$ ou $E$ selon que $B$ ne contient ni $a$ ni $b$, $a$ seulement, $b$ seulement, ou les deux. Si $A \in \mathcal{T}_{E}$, la tribu image directe est $\mathcal{P}(F)$ ; si $A \notin \mathcal{T}_{E}$, c'est 
    $$\boxed{\big\{B \subset F \,;\, (a \in B \text{ et } b \in B) \text{ ou } (a \notin B \text{ et } b \notin B)\big\}}\text{.}$$
- id: "l3-in-01-18"
  feuille: "f-l3-in-01"
