  page_enonce: 8
  page_corrige: 14
  enonce: |
    Soit $\mu$ et $\nu$ deux mesures finies sur $(\Omega, \mathcal{T})$ telles que $\mu(A) = 0$ entraîne $\nu(A) = 0$. Montrer que, pour tout $\varepsilon > 0$, il existe $\eta > 0$ tel que, pour tout $A \in \mathcal{T}$, $\mu(A) < \eta$ entraîne $\nu(A) < \varepsilon$.

    *Indication : raisonner par l'absurde et utiliser l'exercice précédent.*
  corrige: |
    Supposons le contraire : il existe $\varepsilon > 0$ et, pour tout $n$, $A_{n} \in \mathcal{T}$ avec $\mu(A_{n}) < 2^{-n}$ et $\nu(A_{n}) \geqslant \varepsilon$. Par Borel-Cantelli, $\mu\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big) = 0$, donc $\nu\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big) = 0$ par hypothèse. Mais $\nu$ est finie, et l'exercice 32 donne $\nu\big(\mathop{\overline{\mathop{\displaystyle \lim}}}\limits A_{n}\big) \geqslant \mathop{\displaystyle \limsup}\nu(A_{n}) \geqslant \varepsilon$ : contradiction. Seule la finitude de $\nu$ a servi. Le théorème de Radon-Nikodym (chapitre 8) identifiera de telles mesures $\nu$ aux mesures à densité par rapport à $\mu$.
- id: "l3-in-01-34"
  feuille: "f-l3-in-01"
