  source: "Lyon 1 (TD02 2020), exercice 15"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $\mathcal{A} \subset \mathcal{P}(\Omega)$. Montrer que, pour tout $A \in \mathcal{T}(\mathcal{A})$, il existe une famille au plus dénombrable $\mathcal{D} \subset \mathcal{A}$ telle que $A \in \mathcal{T}(\mathcal{D})$.

    *Indication : montrer que la famille suivante est une tribu :* 
    $$\mathcal{C} = \big\{A \in \mathcal{T}(\mathcal{A}) \,;\, \text{il existe } \mathcal{D} \subset \mathcal{A} \text{ au plus dénombrable telle que } A \in \mathcal{T}(\mathcal{D})\big\}.$$
  corrige: |
    Montrons que $\mathcal{C}$ est une tribu ; comme elle contient $\mathcal{A}$ (pour $A \in \mathcal{A}$, prendre $\mathcal{D} = \{A\}$) et qu'elle est contenue dans $\mathcal{T}(\mathcal{A})$, ce sera $\mathcal{T}(\mathcal{A})$. $\triangleright$ *$\emptyset \in \mathcal{C}$* , puisque $\emptyset \in \mathcal{T}(\emptyset)$, avec $\mathcal{D} = \emptyset$. $\triangleright$ *Complémentaire.* Si $A \in \mathcal{T}(\mathcal{D})$, alors ${A}^{c} \in \mathcal{T}(\mathcal{D})$, avec le même $\mathcal{D}$. $\triangleright$ *Réunion dénombrable.* Si $A_{k} \in \mathcal{T}(\mathcal{D}_{k})$ avec $\mathcal{D}_{k}$ au plus dénombrable, alors $\mathcal{D} = \mathop{\displaystyle \bigcup}\mathcal{D}_{k}$ est au plus dénombrable (exercice 4), $A_{k} \in \mathcal{T}(\mathcal{D}_{k}) \subset \mathcal{T}(\mathcal{D})$ (exercice 7), donc $\mathop{\displaystyle \bigcup} A_{k} \in \mathcal{T}(\mathcal{D})$.

    Cette méthode, qui consiste à montrer qu'une propriété est vraie sur les générateurs et que la famille des parties qui la vérifient est une tribu, est la méthode des « bons ensembles » ; on la retrouvera dans tout le cours, par exemple pour démontrer la proposition 8 (lemme de transport).
- id: "l3-in-01-14"
  feuille: "f-l3-in-01"
  numero: 14
  partie: "Algèbres de Boole et tribus"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [algèbres de Boole et tribus]
  noeuds: [m-tribus]
  notions: [tribu, tribu-engendree]
  source: "Rubenthaler, exercice 2.3 ; Féjoz (exosIntegration), exercice 1.4"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Soit $A$ une partie de $\Omega$, distincte de $\emptyset$ et de $\Omega$. Montrer que $\mathcal{T}(\{A\})$ est la réunion de $\{\emptyset, \Omega\}$ et d'une partition de $\Omega$.

    **2.** Soit $(A_{1}, \dots, A_{n})$ une partition de $\Omega$. Montrer que $\Big\{\displaystyle\mathop{\displaystyle \bigcup_{i \in I}}A_{i} \,;\, I \subset \{1, \dots, n\}\Big\}$ est une tribu, et que c'est $\mathcal{T}(\{A_{1}, \dots, A_{n}\})$. Décrire en particulier la tribu engendrée par une partition $\{A, B, C\}$ en trois parties.

    **3.** Soit $\mathcal{T}$ une tribu sur $\Omega$. Pour $x \in \Omega$, on pose $\bar{x} = \displaystyle\mathop{\displaystyle \bigcap_{A \in \mathcal{T},\ x \in A}}A$. Montrer que les $\bar{x}$ forment une partition de $\Omega$.

    **4.** On suppose $\mathcal{T}$ au plus dénombrable. Montrer que $\bar{x} \in \mathcal{T}$ pour tout $x$, et que la partition précédente engendre $\mathcal{T}$. Montrer que, si $\mathcal{T}$ est engendrée par une partition au plus dénombrable, c'est cette partition.

    **5.** Quelle partition engendre la tribu de $\mathbb{R}$ engendrée par $\{[0, 1]\}$ ? Par $\{[0, 1], [0, 2]\}$ ? Quel est le cardinal de ces tribus ?

    **6.** Montrer que $\mathcal{P}(\mathbb{R})$ n'est engendrée par aucune partition de $\mathbb{R}$.
  corrige: |
    **1.** $\mathcal{T}(\{A\}) = \{\emptyset, \Omega, A, {A}^{c}\}$, réunion de $\{\emptyset, \Omega\}$ et de la partition $\{A, {A}^{c}\}$.

    **2.** La famille des réunions $\mathop{\displaystyle \bigcup_{i \in I}}A_{i}$ contient $\emptyset$ ($I = \emptyset$), est stable par complémentaire (indices complémentaires, puisque les $A_{i}$ forment une partition) et par réunion (réunion des ensembles d'indices) : c'est une tribu, finie. Elle contient les $A_{i}$ et est contenue dans toute tribu qui les contient : c'est $\mathcal{T}(\{A_{1}, \dots, A_{n}\})$. Pour une partition $\{A, B, C\}$, on obtient les $8$ parties $\emptyset$, $A$, $B$, $C$, $A \cup B$, $A \cup C$, $B \cup C$, $\Omega$.

    **3.** Chaque $x$ appartient à $\bar{x}$. Soit $z \in \bar{x} \cap \bar{y}$. Si $x \notin \bar{y}$, il existe $A \in \mathcal{T}$ contenant $y$ et pas $x$ ; alors ${A}^{c} \in \mathcal{T}$ contient $x$, donc $\bar{x} \subset {A}^{c}$ et $z \in {A}^{c}$, alors que $z \in \bar{y} \subset A$ : contradiction. Donc $x \in \bar{y}$, et de même $y \in \bar{x}$. Ainsi les éléments de $\mathcal{T}$ qui contiennent $x$ sont exactement ceux qui contiennent $y$, et $\bar{x} = \bar{y}$ : deux classes sont égales ou disjointes.

    **4.** Si $\mathcal{T}$ est au plus dénombrable, $\bar{x}$ est une intersection au plus dénombrable d'éléments de $\mathcal{T}$, donc $\bar{x} \in \mathcal{T}$ ; c'est le plus petit élément de $\mathcal{T}$ contenant $x$. Tout $A \in \mathcal{T}$ est la réunion des $\bar{x}$, $x \in A$, et il y a au plus autant de classes distinctes que d'éléments de $\mathcal{T}$ : c'est une réunion au plus dénombrable, et la partition engendre $\mathcal{T}$. Si $\mathcal{T}$ est engendrée par une partition au plus dénombrable $(B_{i})$, ses éléments sont les réunions de $B_{i}$ (cours, prop. 4), et le plus petit qui contient $x \in B_{i}$ est $B_{i}$ : $\bar{x} = B_{i}$. Avec la proposition 5 du cours, une tribu au plus dénombrable est finie, ce qui limite la portée de cette question.

    **5.** $\mathcal{T}(\{[0, 1]\})$ est engendrée par la partition $\{[0, 1], \mathbb{R} \setminus [0, 1]\}$ et a $4$ éléments ; $\mathcal{T}(\{[0, 1], [0, 2]\})$ par la partition $\{[0, 1], ]1, 2], \mathbb{R} \setminus [0, 2]\}$ et a $8$ éléments.

    **6.** Si une partition $\mathcal{B}$ de $\mathbb{R}$ engendrait $\mathcal{P}(\mathbb{R})$, elle ne pourrait pas contenir de partie à deux points $a \neq b$ ou plus : les parties qui contiennent à la fois $a$ et $b$ ou aucun des deux forment une tribu qui contiendrait $\mathcal{B}$, donc $\mathcal{T}(\mathcal{B})$, mais pas $\{a\}$. Ce serait donc la partition en singletons, qui engendre la tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable (exercice 27), à laquelle n'appartient pas $]0, 1[$.
