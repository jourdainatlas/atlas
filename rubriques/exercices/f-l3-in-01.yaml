  enonce: |
    Prouver ou réfuter les assertions suivantes.

    **1.** Si $\Omega$ est dénombrable, toute tribu sur $\Omega$ est au plus dénombrable.

    **2.** Une famille $\mathcal{T} \subset \mathcal{P}(\Omega)$ est une tribu dès qu'elle contient $\emptyset$, qu'elle est stable par passage au complémentaire et par intersection dénombrable.
  corrige: |
    **1.** Faux : $\mathcal{P}(\mathbb{N})$ est une tribu sur $\mathbb{N}$ qui n'est pas dénombrable (cours, prop. 6, ou exercice 6).

    **2.** Vrai : $\Omega = {\emptyset}^{c} \in \mathcal{T}$ et $\mathop{\displaystyle \bigcup} A_{n} = {\big(\mathop{\displaystyle \bigcap}{A_{n}}^{c}\big)}^{c} \in \mathcal{T}$ (exercice 2) ; la stabilité par réunion finie s'en déduit en complétant par des $\emptyset$.
- id: "l3-in-01-11"
  feuille: "f-l3-in-01"
  numero: 11
  partie: "Algèbres de Boole et tribus"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [algèbres de Boole et tribus]
  noeuds: [m-tribus]
  notions: [tribu, tribu-engendree]
  source: "Lyon 1 (TD02 2020), exercice 7 ; Féjoz (exosIntegration), exercice 1.3"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Déterminer les tribus engendrées par les familles suivantes.

    **1.** Dans $\Omega = \mathbb{R}$ : $\{\mathbb{Z}\}$ ; $\{\{n\} \,;\, n \in \mathbb{Z}\}$ ; $\{[0, 2], [1, 3]\}$ (préciser le cardinal de cette dernière).

    **2.** Dans $\Omega = \mathbb{N}$ : $\{\{0\}, \{2\}, \{4\}, \dots\}$.

    **3.** Dans un ensemble $\Omega$ quelconque : l'ensemble des singletons ; l'ensemble des paires (parties à deux éléments), en supposant $\operatorname{card}\Omega > 2$ ; l'ensemble des parties qui contiennent une partie $A$ fixée.

    **4.** Soit $\mathcal{T}_{1}$ et $\mathcal{T}_{2}$ deux tribus sur $\Omega$. Que vaut $\mathcal{T}(\mathcal{T}_{1} \cap \mathcal{T}_{2})$ ? Montrer que $\mathcal{T}(\mathcal{T}_{1} \cup \mathcal{T}_{2})$ est engendrée par les intersections $A_{1} \cap A_{2}$, $A_{1} \in \mathcal{T}_{1}$, $A_{2} \in \mathcal{T}_{2}$.
  corrige: |
    **1.** $\mathcal{T}(\{\mathbb{Z}\}) = \{\emptyset, \mathbb{Z}, \mathbb{R} \setminus \mathbb{Z}, \mathbb{R}\}$. Pour la famille des singletons $\{n\}$, $n \in \mathbb{Z}$, la tribu engendrée est 
    $$\boxed{\big\{A \,;\, A \subset \mathbb{Z}\big\} \cup \big\{A \cup (\mathbb{R} \setminus \mathbb{Z}) \,;\, A \subset \mathbb{Z}\big\}}$$
     car cette famille est une tribu (le complémentaire de $A \cup (\mathbb{R} \setminus \mathbb{Z})$ est $\mathbb{Z} \setminus A$), qui contient les singletons, et toute tribu contenant les singletons de $\mathbb{Z}$ contient les parties de $\mathbb{Z}$ (réunions dénombrables) et donc $\mathbb{R} \setminus \mathbb{Z}$. Pour $\{[0, 2], [1, 3]\}$, les *atomes* sont les parties non vides obtenues en intersectant chaque générateur ou son complémentaire : 
    $$[0, 1[, \qquad [1, 2], \qquad ]2, 3], \qquad \mathbb{R} \setminus [0, 3],$$
     et la tribu engendrée est formée des $2^{4} = 16$ réunions de ces atomes (cours, prop. 4).

    ![Figure](documents/figures/3fe9d175144d1c44.svg)

    Les deux générateurs (en haut) découpent $\mathbb{R}$ en quatre atomes (en bas) ; l'atome $\mathbb{R} \setminus [0, 3]$, en gris, est formé de deux morceaux. Tout élément de la tribu engendrée est une réunion d'atomes.

    **2.** La tribu engendrée par les singletons pairs est formée des parties $A$ de $\mathbb{N}$ telles que $A$ contienne tous les impairs ou aucun : c'est la tribu engendrée par la partition (dénombrable) formée des singletons $\{2k\}$ et de l'ensemble $2\mathbb{N} + 1$ des impairs (cours, prop. 4). Elle n'est pas dénombrable.

    **3.** Les singletons engendrent la tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable (exercice 27) ; si $\Omega$ est au plus dénombrable, c'est $\mathcal{P}(\Omega)$. Les paires engendrent la même tribu, puisque $\{a\} = \{a, b\} \cap \{a, c\}$ pour $b \neq c$ distincts de $a$. Les parties qui contiennent $A$ engendrent 
    $$\boxed{\big\{B \subset \Omega \,;\, A \subset B \text{ ou } A \cap B = \emptyset\big\}}\text{ :}$$
     cette famille est une tribu qui contient les générateurs ; inversement, pour $C \subset {A}^{c}$, $C = (A \cup C) \setminus A$ est dans la tribu engendrée, et toute partie de la famille est de la forme $C$ ou $A \cup C$ avec $C \subset {A}^{c}$.

    **4.** $\mathcal{T}_{1} \cap \mathcal{T}_{2}$ est une tribu (cours, prop. 3), donc $\mathcal{T}(\mathcal{T}_{1} \cap \mathcal{T}_{2}) = \mathcal{T}_{1} \cap \mathcal{T}_{2}$. Notons $\mathcal{I}$ la famille des $A_{1} \cap A_{2}$. Elle est contenue dans $\mathcal{T}(\mathcal{T}_{1} \cup \mathcal{T}_{2})$, et elle contient $\mathcal{T}_{1}$ (prendre $A_{2} = \Omega$) et $\mathcal{T}_{2}$ ; donc $\mathcal{T}(\mathcal{I}) = \mathcal{T}(\mathcal{T}_{1} \cup \mathcal{T}_{2})$.
