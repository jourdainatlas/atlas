  enonce: |
    On suppose $\mu$ finie. Montrer que $\mathcal{S} = \{A \in \mathcal{T} \,;\, \mu(A) = 0 \text{ ou } \mu(A) = \mu(\Omega)\}$ est une tribu. Que devient $\mathcal{S}$ lorsque $\mu$ est une probabilité ?
  corrige: |
    $\emptyset$ et $\Omega$ sont dans $\mathcal{S}$. Si $A \in \mathcal{S}$, $\mu({A}^{c}) = \mu(\Omega) - \mu(A)$ vaut $\mu(\Omega)$ ou $0$. Si $(A_{n})$ est une suite de $\mathcal{S}$ : ou bien tous les $A_{n}$ sont de mesure nulle, et $\mu\big(\mathop{\displaystyle \bigcup} A_{n}\big) \leqslant \mathop{\displaystyle \sum}\mu(A_{n}) = 0$ ; ou bien l'un est de mesure $\mu(\Omega)$, et $\mu(\Omega) \geqslant \mu\big(\mathop{\displaystyle \bigcup} A_{n}\big) \geqslant \mu(\Omega)$. Lorsque $\mu$ est une probabilité, $\mathcal{S}$ est la tribu des événements de probabilité $0$ ou $1$, les événements « presque impossibles » et « presque certains ».
- id: "l3-in-01-25"
  feuille: "f-l3-in-01"
