  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $(A_{n})_{n \in \mathbb{N}}$ une suite croissante de parties de $\Omega$. On pose $B_{0} = A_{0}$ et $B_{n} = A_{n} \setminus A_{n-1}$ pour $n \geqslant 1$. Montrer que les $B_{n}$ sont deux à deux disjoints, que $A_{n} = B_{0} \cup \dots \cup B_{n}$ et que $\mathop{\displaystyle \bigcup} A_{n} = \mathop{\displaystyle \bigcup} B_{n}$. Pour une suite quelconque $(C_{n})$, construire de même une suite $(D_{n})$ de parties deux à deux disjointes, avec $D_{n} \subset C_{n}$ et $\mathop{\displaystyle \bigcup} D_{n} = \mathop{\displaystyle \bigcup} C_{n}$.
  corrige: |
    Si $m < n$, $B_{m} \subset A_{m} \subset A_{n-1}$ et $B_{n} \cap A_{n-1} = \emptyset$, donc $B_{m} \cap B_{n} = \emptyset$. Par récurrence, $A_{n} = A_{n-1} \cup (A_{n} \setminus A_{n-1}) = B_{0} \cup \dots \cup B_{n}$, et la réunion sur $n$ donne $\mathop{\displaystyle \bigcup} A_{n} = \mathop{\displaystyle \bigcup} B_{n}$. Pour une suite quelconque, on pose $D_{0} = C_{0}$ et $D_{n} = C_{n} \setminus (C_{0} \cup \dots \cup C_{n-1})$ : c'est la construction précédente appliquée à la suite croissante $A_{n} = C_{0} \cup \dots \cup C_{n}$, et $D_{n} \subset C_{n}$. Ce procédé de *désunion* sert constamment : il ramène une réunion quelconque à une réunion disjointe, à laquelle s'applique la $\sigma$-additivité (cours, prop. 15).
- id: "l3-in-01-04"
  feuille: "f-l3-in-01"
  numero: 4
  partie: "Préliminaires ensemblistes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [préliminaires ensemblistes]
  noeuds: [m-tribus]
  notions: [tribu]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Montrer qu'une partie infinie d'un ensemble dénombrable est dénombrable. En déduire qu'un ensemble infini $E$ est dénombrable si et seulement s'il existe une injection de $E$ dans $\mathbb{N}$.

    **2.** Montrer que la réunion de deux ensembles dénombrables est dénombrable. Que peut-on en déduire par récurrence ?

    **3.** En « rangeant » les éléments de $\mathbb{N} \times \mathbb{N}$ dans l'ordre $(0, 0)$, $(0, 1)$, $(1, 0)$, $(0, 2)$, $(1, 1)$, $(2, 0)$, $(0, 3)$, $(1, 2)$, $(2, 1)$, $(3, 0)$, $(0, 4)$, …, déterminer une bijection de $\mathbb{N}$ sur $\mathbb{N} \times \mathbb{N}$. Que peut-on dire de l'application $\varphi : \mathbb{N} \times \mathbb{N} \to \mathbb{N}$, $(p, q) \mapsto 2^{q}(2p + 1)$ ?

    **4.** En déduire que $\mathbb{Q}$ est dénombrable, puis qu'une réunion dénombrable d'ensembles dénombrables est dénombrable. Que penser d'une réunion quelconque d'ensembles finis ou dénombrables ?

    **5.** Montrer que l'ensemble des parties *finies* de $\mathbb{N}$ est dénombrable.
  corrige: |
    **1.** Soit $A \subset \mathbb{N}$ infinie. On pose $a_{0} = \mathop{\displaystyle \min} A$ et $a_{n+1} = \mathop{\displaystyle \min}\big(A \setminus \{a_{0}, \dots, a_{n}\}\big)$, ensemble non vide puisque $A$ est infinie. La suite $(a_{n})$ est strictement croissante, donc injective, et $a_{n} \geqslant n$. Tout $a \in A$ est atteint : sinon, $a$ resterait dans $A \setminus \{a_{0}, \dots, a_{n}\}$ pour tout $n$, d'où $a_{n+1} \leqslant a$ pour tout $n$, ce qui contredit $a_{n+1} \geqslant n + 1$. Une partie infinie d'un ensemble dénombrable $D$ s'y ramène par une bijection $D \to \mathbb{N}$. Si $E$ est infini et s'il existe une injection $g : E \to \mathbb{N}$, $E$ est en bijection avec $g(E)$, partie infinie de $\mathbb{N}$, donc dénombrable ; la réciproque est claire.

    **2.** Si $A$ et $B$ sont dénombrables, de bijections $g : A \to \mathbb{N}$ et $h : B \to \mathbb{N}$, l'application qui envoie $a \in A$ sur $2g(a)$ et $b \in B \setminus A$ sur $2h(b) + 1$ est une injection de $A \cup B$ dans $\mathbb{N}$, et $A \cup B$ est infini : il est dénombrable. Par récurrence, une réunion finie d'ensembles dénombrables est dénombrable.

    **3.** L'ordre proposé parcourt les diagonales $p + q = s$, $s = 0, 1, 2, \dots$, et, sur chacune, les couples par $p$ croissant. Avant la diagonale $s$, il y a $1 + 2 + \dots + s = \dfrac{s(s + 1)}{2}$ couples, d'où la bijection 
    $$\boxed{\mathbb{N} \times \mathbb{N} \to \mathbb{N}, \qquad (p, q) \mapsto \frac{(p + q)(p + q + 1)}{2} + p}\text{.}$$
     L'application $\varphi$ est une *bijection de $\mathbb{N} \times \mathbb{N}$ sur $\mathbb{N}^{*}$* : tout entier $m \geqslant 1$ s'écrit de façon unique $m = 2^{q}m'$ avec $m'$ impair, et $m' = 2p + 1$.

    ![Figure](documents/figures/4e6d57c99f878aeb.svg)

    L'énumération par diagonales : on parcourt chaque diagonale $p + q = s$ en bleu ardoise, puis on saute (en ocre, tirets) au début de la suivante ; les nombres carmin sont les rangs. Chaque couple est atteint en un nombre fini d'étapes, ce qui donne la bijection.

    **4.** L'application $\mathbb{Q} \to \mathbb{Z} \times \mathbb{N}^{*}$ qui associe à $r$ son écriture irréductible $r = \dfrac{a}{b}$, $b > 0$, est injective ; $\mathbb{Z} \times \mathbb{N}^{*}$ est dénombrable par 2 et 3 ; $\mathbb{Q}$ est infini : il est dénombrable. Si $(A_{n})$ est une suite d'ensembles dénombrables, de bijections $g_{n} : \mathbb{N} \to A_{n}$, l'application $(n, k) \mapsto g_{n}(k)$ est une surjection de $\mathbb{N} \times \mathbb{N}$ sur $\mathop{\displaystyle \bigcup} A_{n}$. En associant à chaque $x \in \mathop{\displaystyle \bigcup} A_{n}$ le plus petit antécédent pour l'ordre de la question 3, on obtient une injection de $\mathop{\displaystyle \bigcup} A_{n}$ dans $\mathbb{N} \times \mathbb{N}$, et $\mathop{\displaystyle \bigcup} A_{n}$ est infini : il est dénombrable. En revanche, une réunion *quelconque* d'ensembles finis peut ne pas l'être : $\mathbb{R} = \mathop{\displaystyle \bigcup_{x \in \mathbb{R}}}\{x\}$ (exercice 5).

    **5.** L'application $A \mapsto \mathop{\displaystyle \sum_{k \in A}}2^{k}$ est une bijection de l'ensemble des parties finies de $\mathbb{N}$ sur $\mathbb{N}$ : c'est l'écriture en base $2$.
- id: "l3-in-01-05"
  feuille: "f-l3-in-01"
  numero: 5
  partie: "Préliminaires ensemblistes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [préliminaires ensemblistes]
  noeuds: [m-tribus]
  notions: [tribu]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On montre de deux façons que $[0, 1]$ n'est pas dénombrable.

    **1.** *Segments emboîtés.* On suppose qu'il existe une suite $(x_{n})_{n \geqslant 1}$ telle que $[0, 1] = \{x_{n} \,;\, n \geqslant 1\}$. On pose $I_{0} = [a_{0}, b_{0}] = [0, 1]$. Justifier que l'un au moins des trois intervalles 
    $$\Big[a_{0}, \frac{2a_{0} + b_{0}}{3}\Big], \qquad \Big[\frac{2a_{0} + b_{0}}{3}, \frac{a_{0} + 2b_{0}}{3}\Big], \qquad \Big[\frac{a_{0} + 2b_{0}}{3}, b_{0}\Big]$$
     ne contient pas $x_{1}$, et en choisir un, $I_{1} = [a_{1}, b_{1}]$. En itérant, construire une suite décroissante de segments $I_{n} = [a_{n}, b_{n}]$ de longueur $3^{-n}$ tels que $x_{n} \notin I_{n}$. Montrer que $\mathop{\displaystyle \bigcap} I_{n}$ est réduit à un point et conclure.

    **2.** *Diagonale.* On suppose qu'il existe une suite $(x_{n})_{n \geqslant 1}$ telle que $[0, 1[ = \{x_{n} \,;\, n \geqslant 1\}$. On écrit chaque $x_{n}$ en base $3$, $x_{n} = 0{,}a_{n,1}a_{n,2}a_{n,3}\dots$, en choisissant l'écriture qui ne se termine pas par une infinité de chiffres $2$ ; pourquoi est-ce possible, et pourquoi cette écriture est-elle unique ? Construire $x = 0{,}a_{1}a_{2}a_{3}\dots \in [0, 1[$, avec $a_{n} \in \{0, 1\}$ et $a_{n} \neq a_{n,n}$ pour tout $n$, et conclure.
  corrige: |
    **1.** Les trois segments recouvrent $[a_{0}, b_{0}]$ et ne se chevauchent qu'en leurs extrémités communes : un point appartient à deux d'entre eux au plus, donc l'un au moins ne contient pas $x_{1}$. On itère, le segment $I_{n}$ étant choisi parmi les trois tiers de $I_{n-1}$ et ne contenant pas $x_{n}$. Les suites $(a_{n})$ et $(b_{n})$ sont adjacentes ($b_{n} - a_{n} = 3^{-n}$) ; leur limite commune $c$ est l'unique point de $\mathop{\displaystyle \bigcap} I_{n}$. Comme $c \in [0, 1]$, il existe $m$ tel que $c = x_{m}$ ; mais $x_{m} \notin I_{m}$, alors que $c \in I_{m}$ : contradiction.

    ![Figure](documents/figures/14aac38593764da9.svg)

    Trois étapes de la construction, pour des valeurs arbitraires de $x_{1}$, $x_{2}$, $x_{3}$ : chaque segment est un tiers du précédent qui évite le point d'indice correspondant. Le point limite échappe ainsi à toute la suite $(x_{n})$.

    **2.** Tout $x \in [0, 1[$ admet un développement en base $3$ ; deux développements distincts d'un même réel existent seulement pour les nombres de la forme $\dfrac{k}{3^{m}}$, l'un se terminant par une infinité de $0$, l'autre par une infinité de $2$. Exclure les développements terminés par des $2$ assure donc l'existence et l'unicité (et exclut l'écriture $0{,}222\dots = 1$). Posons $a_{n} = 1$ si $a_{n,n} = 0$ et $a_{n} = 0$ sinon. Le réel $x = \mathop{\displaystyle \sum} a_{n}3^{-n}$ appartient à $\big[0, \dfrac{1}{2}\big] \subset [0, 1[$ et son développement, formé de $0$ et de $1$, est le développement admissible ; il diffère de celui de $x_{n}$ au rang $n$, donc $x \neq x_{n}$ pour tout $n$ : contradiction. On a choisi des chiffres $0$ et $1$ pour ne pas créer un développement terminé par des $2$, qui représenterait peut-être l'un des $x_{n}$ sous son autre écriture.
- id: "l3-in-01-06"
  feuille: "f-l3-in-01"
  numero: 6
  partie: "Préliminaires ensemblistes"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [préliminaires ensemblistes]
  noeuds: [m-tribus]
  notions: [tribu]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **1.** Si $E$ est fini de cardinal $n$, montrer que $\mathcal{P}(E)$ est de cardinal $2^{n}$.

    **2.** *(Théorème de Cantor.)* Soit $E$ un ensemble quelconque et $\phi : E \to \mathcal{P}(E)$. En considérant $F = \{x \in E \,;\, x \notin \phi(x)\}$, montrer que $\phi$ n'est pas surjective. On retrouve la proposition 6 du cours.

    **3.** *(Théorème de Cantor-Bernstein.)* Soit $A$ un ensemble, $B \subset A$ et $\phi : A \to B$ une injection. On pose $C_{0} = A \setminus B$, $C_{n+1} = \phi(C_{n})$, $C = \mathop{\displaystyle \bigcup_{n \in \mathbb{N}}}C_{n}$, et $\psi(x) = \phi(x)$ si $x \in C$, $\psi(x) = x$ sinon. Montrer que $\psi$ est une bijection de $A$ sur $B$. En déduire que, s'il existe une injection $f : E \to F$ et une injection $g : F \to E$, il existe une bijection de $E$ sur $F$ (on pourra appliquer ce qui précède à $\phi = g \circ f$, avec $A = E$ et $B = g(F)$).

    **4.** Pour deux ensembles $A$ et $B$, on note $A^{B}$ l'ensemble des applications de $B$ dans $A$. Construire une bijection de $\mathcal{P}(\mathbb{N})$ sur $\{0, 1\}^{\mathbb{N}}$.

    **5.** À l'aide de l'écriture en base $2$, construire une surjection de $\{0, 1\}^{\mathbb{N}}$ sur $[0, 1]$ ; à l'aide de l'écriture en base $3$, une injection de $\{0, 1\}^{\mathbb{N}}$ dans $[0, 1]$. En déduire que $\{0, 1\}^{\mathbb{N}}$, $\mathcal{P}(\mathbb{N})$ et $[0, 1]$ sont en bijection deux à deux, puis que $\mathbb{R}$ est en bijection avec $\mathcal{P}(\mathbb{N})$.
  corrige: |
    **1.** L'application $A \mapsto \chi_{A}$ est une bijection de $\mathcal{P}(E)$ sur l'ensemble des applications de $E$ dans $\{0, 1\}$, qui a $2^{n}$ éléments.

    **2.** Si $F = \phi(y)$ pour un $y \in E$, alors $y \in F \iff y \notin \phi(y) = F$, ce qui est absurde. Donc $F$ n'a pas d'antécédent.

    **3.** $\triangleright$ *$\psi$ est à valeurs dans $B$.* Si $x \in C$, $\psi(x) = \phi(x) \in B$ ; si $x \notin C$, alors $x \notin C_{0} = A \setminus B$, donc $x \in B$.

    $\triangleright$ *$\psi$ est injective.* Elle l'est sur $C$ (où elle vaut $\phi$) et sur $A \setminus C$ (où elle vaut l'identité). De plus $\phi(C) = \mathop{\displaystyle \bigcup_{n \geqslant 0}}\phi(C_{n}) = \mathop{\displaystyle \bigcup_{n \geqslant 1}}C_{n} \subset C$, alors que $\psi(A \setminus C) = A \setminus C$ : les images de $C$ et de $A \setminus C$ sont disjointes.

    $\triangleright$ *$\psi$ est surjective.* Soit $y \in B$. Si $y \notin C$, $y = \psi(y)$. Si $y \in C$, alors $y \in C_{n}$ avec $n \geqslant 1$, puisque $y \notin C_{0}$ ; donc $y = \phi(x)$ avec $x \in C_{n-1} \subset C$, et $y = \psi(x)$.

    Pour deux injections $f : E \to F$ et $g : F \to E$, $\phi = g \circ f$ est une injection de $E$ dans $B = g(F) \subset E$, donc $E$ est en bijection avec $g(F)$, lui-même en bijection avec $F$ par $g$ : 
    $$\boxed{\text{s'il existe une injection de } E \text{ dans } F \text{ et une de } F \text{ dans } E, \ E \text{ et } F \text{ sont en bijection}}\text{.}$$

    ![Figure](documents/figures/2e29812a0c2a5d06.svg)

    Les rectangles emboîtés sont $A \supset B \supset \phi(A) \supset \phi(B) \supset \phi^{2}(A) \supset \dots$ ; les couronnes grisées sont $C_{0} = A \setminus B$, $C_{1} = \phi(A) \setminus \phi(B)$, $C_{2}$, … L'application $\psi$ décale chaque couronne grisée de deux crans vers l'intérieur et laisse fixes les couronnes blanches : la couronne $C_{0}$, qui n'est pas dans $B$, est ainsi absorbée.

    **4.** L'application $A \mapsto \chi_{A}$ est une bijection de $\mathcal{P}(\mathbb{N})$ sur $\{0, 1\}^{\mathbb{N}}$.

    **5.** L'application $s : (\varepsilon_{k})_{k \geqslant 1} \mapsto \mathop{\displaystyle \sum_{k \geqslant 1}}\varepsilon_{k}2^{-k}$ est une surjection de $\{0, 1\}^{\mathbb{N}^{*}}$ sur $[0, 1]$ (tout réel de $[0, 1]$ a un développement dyadique) ; en choisissant pour chaque $x \in [0, 1]$ un antécédent (par exemple le développement qui ne se termine pas par des $1$, sauf pour $x = 1$), on obtient une injection de $[0, 1]$ dans $\{0, 1\}^{\mathbb{N}^{*}}$. L'application $t : (\varepsilon_{k}) \mapsto \mathop{\displaystyle \sum_{k \geqslant 1}}2\varepsilon_{k}3^{-k}$ est injective : deux développements triadiques distincts d'un même réel diffèrent par un chiffre $d$ contre $d - 1$, ce qui est impossible avec des chiffres dans $\{0, 2\}$. Le théorème de Cantor-Bernstein donne une bijection entre $\{0, 1\}^{\mathbb{N}}$ (en bijection avec $\{0, 1\}^{\mathbb{N}^{*}}$ par décalage) et $[0, 1]$. Enfin $x \mapsto \dfrac{1}{2} + \dfrac{1}{\pi}\operatorname{Arctan}x$ est une bijection de $\mathbb{R}$ sur $]0, 1[$, qui s'injecte dans $[0, 1]$, et $[0, 1]$ s'injecte dans $\mathbb{R}$ : 
    $$\boxed{\mathbb{R}, \ [0, 1], \ \{0, 1\}^{\mathbb{N}} \text{ et } \mathcal{P}(\mathbb{N}) \text{ sont en bijection deux à deux}}\text{.}$$
     Avec la question 2, on retrouve que $\mathbb{R}$ n'est pas dénombrable. Le cours montrera au chapitre 2 que l'image de $t$, l'ensemble triadique de Cantor, est de mesure de Lebesgue nulle : un ensemble « aussi gros que $\mathbb{R}$ » peut donc être négligeable.
- id: "l3-in-01-07"
  feuille: "f-l3-in-01"
  numero: 7
