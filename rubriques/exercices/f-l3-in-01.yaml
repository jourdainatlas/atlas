  source: "TD2 Paris-Dauphine, exercice 12"
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Soit $\mu$ et $\nu$ deux mesures finies sur $(\Omega, \mathcal{T})$. Pour $A \in \mathcal{T}$, on pose 
    $$(\mu \wedge \nu)(A) = \inf\big\{\mu(A_{1}) + \nu(A_{2}) \,;\, A_{1}, A_{2} \in \mathcal{T},\ A_{1} \cap A_{2} = \emptyset,\ A_{1} \cup A_{2} = A\big\}.$$

    **1.** Montrer que $\mu \wedge \nu \leqslant \mu$ et $\mu \wedge \nu \leqslant \nu$.

    **2.** Montrer que $\mu \wedge \nu$ est une mesure.

    **3.** Montrer que, si $\xi$ est une mesure telle que $\xi \leqslant \mu$ et $\xi \leqslant \nu$, alors $\xi \leqslant \mu \wedge \nu$.

    **4.** Calculer $\mu \wedge \nu$ lorsque $\mu = \delta_{0} + 2\delta_{1}$ et $\nu = 3\delta_{0} + \delta_{2}$ sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$.
  corrige: |
    **1.** La décomposition $A_{1} = A$, $A_{2} = \emptyset$ donne $(\mu \wedge \nu)(A) \leqslant \mu(A)$, et $A_{1} = \emptyset$, $A_{2} = A$ donne l'autre inégalité.

    **2.** $(\mu \wedge \nu)(\emptyset) = 0$. Soit $B$ réunion disjointe des $B_{k}$. $\triangleright$ *Minoration.* Pour toute décomposition $B = A_{1} \sqcup A_{2}$, 
    $$\mu(A_{1}) + \nu(A_{2}) = \sum_{k}\big(\mu(A_{1} \cap B_{k}) + \nu(A_{2} \cap B_{k})\big) \geqslant \sum_{k}(\mu \wedge \nu)(B_{k}),$$
     puisque $(A_{1} \cap B_{k}, A_{2} \cap B_{k})$ décompose $B_{k}$. On passe à la borne inférieure. $\triangleright$ *Majoration.* Soit $\varepsilon > 0$ et, pour chaque $k$, une décomposition $B_{k} = A_{1}^{k} \sqcup A_{2}^{k}$ telle que 
    $$\mu(A_{1}^{k}) + \nu(A_{2}^{k}) \leqslant (\mu \wedge \nu)(B_{k}) + \varepsilon 2^{-k}.$$
     Alors $A_{1} = \mathop{\displaystyle \bigcup} A_{1}^{k}$ et $A_{2} = \mathop{\displaystyle \bigcup} A_{2}^{k}$ décomposent $B$, et 
    $$(\mu \wedge \nu)(B) \leqslant \mu(A_{1}) + \nu(A_{2}) \leqslant \sum_{k}(\mu \wedge \nu)(B_{k}) + 2\varepsilon.$$

    **3.** Pour toute décomposition $A = A_{1} \sqcup A_{2}$, $\xi(A) = \xi(A_{1}) + \xi(A_{2}) \leqslant \mu(A_{1}) + \nu(A_{2})$ ; on passe à la borne inférieure. Ainsi $\mu \wedge \nu$ est *la plus grande mesure inférieure à $\mu$ et à $\nu$*.

    **4.** Pour un singleton, les seules décompositions sont $(\{x\}, \emptyset)$ et $(\emptyset, \{x\})$ : 
    $$(\mu \wedge \nu)(\{x\}) = \min\big(\mu(\{x\}), \nu(\{x\})\big)\text{,}$$
     qui vaut $\mathop{\displaystyle \min}(1, 3) = 1$ en $0$, $\mathop{\displaystyle \min}(2, 0) = 0$ en $1$ et $\mathop{\displaystyle \min}(0, 1) = 0$ en $2$. Comme la mesure de $\mathbb{R} \setminus \{0, 1, 2\}$ est nulle pour $\mu$, elle l'est pour $\mu \wedge \nu$, et l'on conclut par additivité : $\boxed{\mu \wedge \nu = \delta_{0}}$.
- id: "l3-in-01-35"
  feuille: "f-l3-in-01"
  numero: 35
  partie: "Mesures"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [mesures, classe monotone]
  noeuds: [m-mesures, m-dynkin]
  notions: [mesure, espace-mesure, classe-monotone]
  source: "TD2 Paris-Dauphine, exercice 18 (« classe monotone » au sens des limites monotones ; la conclusion, qui repose sur le théorème de Halmos, est donnée comme admise)"
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Soit $\mu$ et $\nu$ deux probabilités sur $(\Omega, \mathcal{T})$, et $\mathcal{P} \subset \mathcal{T}$ une famille contenant $\Omega$, stable par intersection finie, telle que $\mathcal{T}(\mathcal{P}) = \mathcal{T}$ et que $\mu(A) = \nu(A)$ pour tout $A \in \mathcal{P}$. On veut montrer que $\mu = \nu$ sans utiliser le lemme de classe monotone du cours.

    **1.** *Application.* Montrer que $\mathcal{P} = \{]t, +\infty[ \,;\, t \in \overline{\mathbb{R}}\}$ vérifie ces hypothèses pour $\mathcal{T} = \mathcal{B}(\mathbb{R})$. En déduire que deux probabilités sur $\mathbb{R}$ qui ont la même fonction de répartition (exercice 28) sont égales.

    **2.** Soit $\mathcal{G} = \{A \in \mathcal{T} \,;\, \mu(A) = \nu(A)\}$. Montrer que $\mathcal{G}$ est stable par limites monotones (exercice 9) et que, si $A$, $B \in \mathcal{G}$ et $A \subset B$, alors $B \setminus A \in \mathcal{G}$.

    **3.** Montrer que, pour $B_{1}$, …, $B_{k} \in \mathcal{T}$ et $\lambda \in \{\mu, \nu\}$, 
    $$\lambda(B_{1} \cup \dots \cup B_{k}) = \lambda(B_{1} \cup \dots \cup B_{k-1}) + \lambda(B_{k}) - \lambda(B'_{1} \cup \dots \cup B'_{k-1}), \qquad B'_{i} = B_{i} \cap B_{k},$$
     et en déduire par récurrence sur $k$ que toute réunion finie d'éléments de $\mathcal{P}$ est dans $\mathcal{G}$.

    **4.** Soit $\mathcal{C}$ l'ensemble des intersections finies $\mathop{\displaystyle \bigcap_{i \in I}}A_{i}$ où, pour chaque $i$, $A_{i} \in \mathcal{P}$ ou ${A_{i}}^{c} \in \mathcal{P}$. Montrer que tout élément de $\mathcal{C}$ s'écrit $A_{0} \setminus (A'_{1} \cup \dots \cup A'_{k})$ avec $A_{0}$, $A'_{i} \in \mathcal{P}$ et $A'_{i} \subset A_{0}$, et en déduire que $\mathcal{C} \subset \mathcal{G}$.

    **5.** Soit $\mathcal{D}$ l'ensemble des réunions finies d'éléments de $\mathcal{C}$. Montrer que $\mathcal{D} \subset \mathcal{G}$ et que $\mathcal{D}$ est une algèbre de Boole.

    **6.** On admet le *théorème de Halmos* : la plus petite famille stable par limites monotones qui contient une algèbre de Boole $\mathcal{E}$ est la tribu $\mathcal{T}(\mathcal{E})$. Conclure que $\mu = \nu$. Expliquer comment la proposition 18 du cours donne ce résultat en quelques lignes.
  corrige: |
    **1.** $\mathcal{P}$ contient $\mathbb{R}$ (pour $t = -\infty$) et $\emptyset$ (pour $t = +\infty$), et l'intersection de $]s, +\infty[$ et de $]t, +\infty[$ est $]\mathop{\displaystyle \max}(s, t), +\infty[$. Ces demi-droites engendrent $\mathcal{B}(\mathbb{R})$ (cours, prop. 10). Si $F_{\mu} = F_{\nu}$, alors, pour tout $t$, 
    $$\mu(]t, +\infty[) = 1 - F_{\mu}(t) = \nu(]t, +\infty[),$$
     d'où $\mu = \nu$ par la suite de l'exercice.

    **2.** Les mesures étant finies, la continuité croissante et la continuité décroissante (cours, prop. 15) montrent que $\mathcal{G}$ est stable par limites monotones, et $\lambda(B \setminus A) = \lambda(B) - \lambda(A)$ pour $A \subset B$ donne la seconde propriété.

    **3.** On écrit $B_{1} \cup \dots \cup B_{k} = U \cup B_{k}$ avec $U = B_{1} \cup \dots \cup B_{k-1}$ et $U \cap B_{k} = B'_{1} \cup \dots \cup B'_{k-1}$, et l'on applique $\lambda(U \cup B_{k}) = \lambda(U) + \lambda(B_{k}) - \lambda(U \cap B_{k})$ (exercice 26). Si les $B_{i}$ sont dans $\mathcal{P}$, les $B'_{i}$ aussi ($\pi$-système) ; par l'hypothèse de récurrence (réunions de $k - 1$ éléments de $\mathcal{P}$), les trois termes du second membre sont les mêmes pour $\mu$ et $\nu$, donc la réunion est dans $\mathcal{G}$.

    **4.** En regroupant les facteurs, un élément de $\mathcal{C}$ s'écrit $A_{0} \cap {B_{1}}^{c} \cap \dots \cap {B_{k}}^{c}$, où $A_{0}$ est l'intersection des facteurs qui sont dans $\mathcal{P}$ (ou $\Omega$ s'il n'y en a pas) et les $B_{i}$ sont dans $\mathcal{P}$. C'est $A_{0} \setminus (A'_{1} \cup \dots \cup A'_{k})$ avec $A'_{i} = B_{i} \cap A_{0} \in \mathcal{P}$, contenu dans $A_{0}$. Par la question 3, $A'_{1} \cup \dots \cup A'_{k} \in \mathcal{G}$ ; par la question 2, la différence emboîtée est dans $\mathcal{G}$.

    **5.** $\mathcal{C}$ est stable par intersection finie, et la récurrence de la question 3 montre que $\mathcal{D} \subset \mathcal{G}$. $\mathcal{D}$ contient $\emptyset$, est stable par réunion finie, et par complémentaire : ${C_{j}}^{c}$ est la réunion des complémentaires de ses facteurs, éléments de $\mathcal{C}$, et l'on développe $\mathop{\displaystyle \bigcap_{j}}{C_{j}}^{c}$.

    **6.** $\mathcal{G}$ est stable par limites monotones et contient l'algèbre de Boole $\mathcal{D}$, donc il contient la plus petite famille stable par limites monotones contenant $\mathcal{D}$, qui est $\mathcal{T}(\mathcal{D})$ par le théorème de Halmos. Comme $\mathcal{P} \subset \mathcal{D} \subset \mathcal{T}$, $\mathcal{T}(\mathcal{D}) = \mathcal{T}$, et $\mu = \nu$. Avec le cours, il suffit d'observer que $\mathcal{G}$ est une classe monotone au sens du cours (question 2, et $\Omega \in \mathcal{G}$) qui contient le $\pi$-système $\mathcal{P}$ : le lemme de classe monotone (th. 1) donne $\mathcal{T} = \mathcal{T}(\mathcal{P}) \subset \mathcal{G}$, ce qui est la proposition 18.

