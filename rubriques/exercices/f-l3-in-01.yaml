    Soit $\mathcal{A} \subset \mathcal{P}(\Omega)$ une famille contenant $\emptyset$ et $\mu : \mathcal{A} \to [0, +\infty]$ une application $\sigma$-additive (pour toute suite $(A_{n})$ d'éléments de $\mathcal{A}$ deux à deux disjoints dont la réunion est dans $\mathcal{A}$, $\mu(\mathop{\displaystyle \bigcup} A_{n}) = \mathop{\displaystyle \sum}\mu(A_{n})$). Montrer que l'on a, ou bien $\mu(\emptyset) = 0$, ou bien $\mu(A) = +\infty$ pour tout $A \in \mathcal{A}$.
  corrige: |
    La suite constante égale à $\emptyset$ est formée de parties deux à deux disjointes, de réunion $\emptyset$ : $\mu(\emptyset) = \mathop{\displaystyle \sum_{n}}\mu(\emptyset)$. Si $\mu(\emptyset) > 0$, la série diverge et $\mu(\emptyset) = +\infty$. Alors, pour $A \in \mathcal{A}$, la suite $(A, \emptyset, \emptyset, \dots)$ donne $\mu(A) = \mu(A) + \mathop{\displaystyle \sum_{n \geqslant 1}}\mu(\emptyset) = +\infty$. C'est pourquoi la condition $\mu(\emptyset) = 0$ figure dans la définition d'une mesure : elle écarte seulement ce cas dégénéré.
- id: "l3-in-01-22"
  feuille: "f-l3-in-01"
  numero: 22
