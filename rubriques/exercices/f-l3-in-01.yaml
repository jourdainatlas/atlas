  enonce: |
    **1.** Soit $\mathcal{E}$ une algèbre de Boole sur $\Omega$ et $Y \subset \Omega$. Montrer que $\mathcal{E}_{Y} = \{A \cap Y \,;\, A \in \mathcal{E}\}$ est une algèbre de Boole sur $Y$, et que, si $Y \in \mathcal{E}$, $\mathcal{E}_{Y} = \{A \in \mathcal{E} \,;\, A \subset Y\}$. Comparer avec la proposition 7 du cours.

    **2.** Soit $(X, d)$ un espace métrique et $Y \subset X$, muni de la distance induite. Montrer que la tribu borélienne de $Y$ (engendrée par les ouverts de $Y$) est la tribu trace de $\mathcal{B}(X)$ sur $Y$ : $\mathcal{B}(Y) = \{B \cap Y \,;\, B \in \mathcal{B}(X)\}$.
  corrige: |
    **1.** $\emptyset = \emptyset \cap Y$, $Y \setminus (A \cap Y) = {A}^{c} \cap Y$ et $(A \cap Y) \cup (B \cap Y) = (A \cup B) \cap Y$ : $\mathcal{E}_{Y}$ est une algèbre de Boole sur $Y$. Si $Y \in \mathcal{E}$, les $A \cap Y$ sont dans $\mathcal{E}$ et contenus dans $Y$ ; inversement, $A \subset Y$ s'écrit $A = A \cap Y$. C'est la proposition 7 du cours, qui traite le cas des tribus de la même façon (la réunion dénombrable passant à la trace comme la réunion finie).

    **2.** Les ouverts de $Y$ sont les traces $U \cap Y$ des ouverts $U$ de $X$. La tribu trace $\{B \cap Y \,;\, B \in \mathcal{B}(X)\}$ est une tribu sur $Y$ (cours, prop. 7) qui contient ces ouverts, donc elle contient $\mathcal{B}(Y)$. Inversement, la famille $\{B \in \mathcal{B}(X) \,;\, B \cap Y \in \mathcal{B}(Y)\}$ est une tribu sur $X$ (les opérations ensemblistes passent à la trace) qui contient les ouverts de $X$, donc c'est $\mathcal{B}(X)$ : toute trace $B \cap Y$ est dans $\mathcal{B}(Y)$. C'est encore la méthode des bons ensembles de l'exercice 13.
