  source: "Lyon 1 (TD02 2020), exercice 40 ; Exo7 (fic00142), exercice 3"
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $A_{1}$, …, $A_{n} \in \mathcal{T}$ tels que $\mu(A_{1} \cup \dots \cup A_{n}) < +\infty$.

    **1.** Montrer que $\mu(A_{1} \cup A_{2}) = \mu(A_{1}) + \mu(A_{2}) - \mu(A_{1} \cap A_{2})$, puis, par récurrence, la formule de Poincaré 
    $$\mu(A_{1} \cup \dots \cup A_{n}) = \sum_{j=1}^{n}(-1)^{j+1}\sum_{1 \leqslant i_{1} < \dots < i_{j} \leqslant n}\mu(A_{i_{1}} \cap \dots \cap A_{i_{j}}).$$

    **2.** Que devient cette formule pour la mesure de comptage ? Combien d'entiers compris entre $1$ et $1000$ ne sont divisibles ni par $2$, ni par $3$, ni par $5$ ?
  corrige: |
    **1.** $A_{1} \cup A_{2}$ est la réunion disjointe de $A_{1}$ et de $A_{2} \setminus A_{1}$, et $A_{2}$ celle de $A_{2} \setminus A_{1}$ et de $A_{1} \cap A_{2}$ ; toutes les mesures étant finies, on soustrait. Pour la récurrence, on applique ce cas à $U = A_{1} \cup \dots \cup A_{n-1}$ et $A_{n}$ : 
    $$\mu(U \cup A_{n}) = \mu(U) + \mu(A_{n}) - \mu\big((A_{1} \cap A_{n}) \cup \dots \cup (A_{n-1} \cap A_{n})\big),$$
     puis l'hypothèse de récurrence aux deux réunions de $n - 1$ ensembles ; les intersections faisant intervenir $A_{n}$ apparaissent dans le dernier terme, avec un signe changé, ce qui donne la formule (cours, prop. 16).

    **2.** Pour la mesure de comptage, c'est le *principe d'inclusion-exclusion* des dénombrements. Soit $M_{d}$ l'ensemble des multiples de $d$ entre $1$ et $1000$, de cardinal $\lfloor 1000/d \rfloor$, et $M_{2} \cap M_{3} = M_{6}$, etc. : 
    $$\operatorname{card}(M_{2} \cup M_{3} \cup M_{5}) = (500 + 333 + 200) - (166 + 100 + 66) + 33 = 734,$$
     d'où $\boxed{1000 - 734 = 266}$ entiers divisibles ni par $2$, ni par $3$, ni par $5$ (vérifié par un décompte direct). On retrouve la proportion $\big(1 - \dfrac{1}{2}\big)\big(1 - \dfrac{1}{3}\big)\big(1 - \dfrac{1}{5}\big) = \dfrac{4}{15} \approx 0{,}267$.
- id: "l3-in-01-27"
  feuille: "f-l3-in-01"
  numero: 27
  partie: "Mesures"
  etoiles: 2
