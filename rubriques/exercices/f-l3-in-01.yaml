  enonce: |
    Une *topologie* sur $\Omega$ est une partie de $\mathcal{P}(\Omega)$ qui contient $\emptyset$ et $\Omega$ et qui est stable par intersection finie et par réunion quelconque.

    **1.** Comparer les axiomes d'une tribu et d'une topologie. Donner un exemple de topologie qui n'est pas une tribu, puis de tribu qui n'est pas une topologie.

    **2.** Soit $(A_{i})_{i \in I}$ une partition au plus dénombrable de $\Omega$. Comparer la tribu et la topologie engendrées par cette partition (la topologie engendrée est la plus petite topologie qui la contient).
  corrige: |
    **1.** Les deux contiennent $\emptyset$ et $\Omega$. Une tribu est stable par complémentaire et par réunion *dénombrable* ; une topologie est stable par réunion *quelconque* et par intersection finie, mais pas par complémentaire. La topologie usuelle de $\mathbb{R}$ n'est pas une tribu (${]0, 1[}^{c}$ n'est pas ouvert). La tribu des parties au plus dénombrables ou de complémentaire au plus dénombrable de $\mathbb{R}$ (exercice 27) n'est pas une topologie : elle contient les singletons de $]0, 1[$, mais pas leur réunion.

    **2.** Les intersections finies d'éléments de la partition sont vides ou égales à l'un d'eux ; la topologie engendrée est donc formée des réunions quelconques d'éléments de la partition. Comme $I$ est au plus dénombrable, ce sont aussi les éléments de la tribu engendrée (cours, prop. 4) : 
    $$\boxed{\text{tribu et topologie engendrées par une partition au plus dénombrable coïncident}}\text{.}$$
