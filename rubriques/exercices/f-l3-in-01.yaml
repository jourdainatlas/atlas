  notions: [tribu, tribu-engendree]
  source: "Lyon 1 (TD02 2020), exercices 1, 10, 11 (a) et (c), 13 et 14 (« clan » = algèbre de Boole)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Montrer que $\mathcal{P}(\Omega)$ et $\{\emptyset, \Omega\}$ sont des tribus sur $\Omega$.

    **2.** Montrer qu'une algèbre de Boole (resp. une tribu) est stable par réunion finie : si $A_{1}$, …, $A_{n}$ lui appartiennent, $A_{1} \cup \dots \cup A_{n}$ aussi.

    **3.** Montrer qu'une tribu est une algèbre de Boole et que, si $\Omega$ est fini, toute algèbre de Boole sur $\Omega$ est une tribu.

    **4.** Montrer qu'une intersection quelconque d'algèbres de Boole (resp. de tribus, de classes monotones) sur $\Omega$ en est une.

    **5.** Montrer que, si $\mathcal{G} \subset \mathcal{G}'$, alors $\mathcal{T}(\mathcal{G}) \subset \mathcal{T}(\mathcal{G}')$, et que $\mathcal{T}\big(\mathcal{T}(\mathcal{G})\big) = \mathcal{T}(\mathcal{G})$. Énoncer les propriétés analogues pour l'algèbre de Boole engendrée.
  corrige: |
    **1.** Les axiomes sont immédiats : $\mathcal{P}(\Omega)$ contient toutes les parties, et $\{\emptyset, \Omega\}$ est stable par complémentaire et par réunion.

    **2.** Par récurrence sur $n$, $A_{1} \cup \dots \cup A_{n} = (A_{1} \cup \dots \cup A_{n-1}) \cup A_{n}$. Pour une tribu, on peut aussi écrire $A_{1} \cup \dots \cup A_{n} = A_{1} \cup \dots \cup A_{n} \cup \emptyset \cup \emptyset \cup \dots$, réunion dénombrable.

    **3.** Par définition (cours), une tribu est une algèbre de Boole stable par réunion dénombrable. Si $\Omega$ est fini, $\mathcal{P}(\Omega)$ l'est aussi : une suite d'éléments d'une algèbre de Boole ne prend qu'un nombre fini de valeurs, et sa réunion est une réunion finie.

    **4.** Chacun des axiomes (contenir $\emptyset$ ou $\Omega$, être stable par complémentaire, réunion finie ou dénombrable, différence emboîtée, réunion croissante) est conservé par intersection : si chaque famille le vérifie, leur intersection aussi. C'est la proposition 3 du cours pour les tribus.

    **5.** $\mathcal{T}(\mathcal{G}')$ est une tribu qui contient $\mathcal{G}$, donc elle contient $\mathcal{T}(\mathcal{G})$, plus petite tribu contenant $\mathcal{G}$. $\mathcal{T}(\mathcal{G})$ est une tribu, donc la plus petite tribu qui la contient est elle-même. Les mêmes énoncés valent pour l'algèbre de Boole engendrée, avec la même preuve.
- id: "l3-in-01-08"
  feuille: "f-l3-in-01"
