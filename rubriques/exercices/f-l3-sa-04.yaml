  mots_cles: [anneaux noethériens]
  noeuds: [ac-noetheriens]
  notions: [anneau-noetherien, ideal-type-fini]
  source: "ENS Lyon, TD 3 (2016-17), exercice 4"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $A$ un anneau noethérien.

    **1.** Un idéal $I$ est dit *irréductible* si $I = I_{1} \cap I_{2}$ entraîne $I = I_{1}$ ou $I = I_{2}$. Montrer que tout idéal de $A$ est intersection finie d'idéaux irréductibles. *On pourra considérer l'ensemble des idéaux qui ne le sont pas.* Que donne ce résultat dans $\mathbb{Z}$ ?

    **2.** Soit $I$ un idéal de $A$. Montrer qu'il existe $n \geqslant 1$ tel que $(\sqrt{I})^{n} \subset I$. Ce résultat subsiste-t-il sans l'hypothèse noethérienne ?
  corrige: |
    **1.** Soit $\mathcal{E}$ l'ensemble des idéaux qui ne sont pas intersection finie d'idéaux irréductibles, et supposons-le non vide. Par le th. 1 du cours (condition (iii), pour le module $A$), il a un élément maximal $I$.

    L'idéal $I$ n'est pas irréductible, sinon il serait l'intersection de lui seul. Il s'écrit donc $I = I_{1} \cap I_{2}$, avec $I \subsetneq I_{1}$ et $I \subsetneq I_{2}$. Par maximalité, $I_{1}$, $I_{2} \notin \mathcal{E}$ : ce sont des intersections finies d'irréductibles, et $I$ aussi, ce qui est absurde.

    Dans $\mathbb{Z}$, les idéaux irréductibles non nuls sont $\mathbb{Z}$ et les $p^{a}\mathbb{Z}$, $p$ premier : si $m$ a deux facteurs premiers distincts, $m = uv$ avec $u \wedge v = 1$, $u$, $v > 1$, et $m\mathbb{Z} = u\mathbb{Z} \cap v\mathbb{Z}$. La décomposition de $n\mathbb{Z}$ est alors $\bigcap_{p}p^{v_{p}(n)}\mathbb{Z}$ : *c'est la décomposition de $n$ en facteurs premiers, lue sur les idéaux*.

    **2.** L'idéal $\sqrt{I}$ est de type fini : $\sqrt{I} = \langle x_{1}, \dots, x_{r} \rangle$, avec $x_{i}^{n_{i}} \in I$. Posons $N = \sum_{i}(n_{i} - 1) + 1$. L'idéal $(\sqrt{I})^{N}$ est engendré par les produits $x_{1}^{e_{1}}\cdots x_{r}^{e_{r}}$, avec $\sum e_{i} = N$ ; dans chacun, un exposant vérifie $e_{i} \geqslant n_{i}$, donc le produit est dans $I$.

    *Sans l'hypothèse noethérienne, c'est faux.* Soit $B = K[X_{1}, X_{2}, \dots]/\langle X_{1}, X_{2}^{2}, X_{3}^{3}, \dots \rangle$ et $I = \{0\}$. Chaque $\overline{X_{k}}$ est nilpotent, donc dans $\sqrt{0}$. Mais, pour tout $m$, $\overline{X_{m + 1}}^{\,m} \in (\sqrt{0})^{m}$ est non nul : le monôme $X_{m + 1}^{m}$ n'est divisible par aucun $X_{k}^{k}$.
- id: "l3-sa-04-06"
  feuille: "f-l3-sa-04"
  numero: 6
  partie: "Anneaux noethériens"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux noethériens, idéaux premiers]
  noeuds: [ac-noetheriens, a-premier-maximal]
  notions: [anneau-noetherien, ideal-type-fini, ideal-premier]
  source: "ENS Lyon, TD 3 (2016-17), exercice 5 ; D. Izquierdo, TD 4, exercice 4"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $A$ un anneau noethérien.

    **1.** Soit $I$ un idéal de $A$. En raisonnant par l'absurde, montrer qu'il existe des idéaux premiers $\mathfrak{p}_{1}, \dots, \mathfrak{p}_{n}$ tels que $\mathfrak{p}_{1}\mathfrak{p}_{2}\cdots\mathfrak{p}_{n} \subset I$, puis que l'on peut exiger $I \subset \mathfrak{p}_{i}$ pour tout $i$.

    **2.** En déduire que $A$ n'a qu'un nombre fini d'idéaux premiers minimaux. *On montrera que tout idéal premier contient un idéal premier minimal, puis on appliquera la question 1 à $I = \{0\}$.*

    **3.** Déterminer les idéaux premiers minimaux de $\mathbb{Z}/12\mathbb{Z}$ et de $\mathbb{C}[X, Y]/\langle XY \rangle$.
  corrige: |
    **1.** Pour $I = A$, le produit vide, égal à $A$, convient. Soit $\mathcal{E}$ l'ensemble des idéaux $I$ qui ne contiennent aucun produit d'idéaux premiers contenant $I$, et supposons-le non vide. Il a un élément maximal $I$ (cours, th. 1), et $I \neq A$.

    L'idéal $I$ n'est pas premier : sinon $\mathfrak{p}_{1} = I$ conviendrait. Il existe donc $a$, $b \notin I$ tels que $ab \in I$. Les idéaux $I + \langle a \rangle$ et $I + \langle b \rangle$ contiennent strictement $I$ : ils contiennent des produits $P$ et $Q$ d'idéaux premiers qui les contiennent, et ces premiers contiennent $I$. Alors 
    $$PQ \subset (I + \langle a \rangle)(I + \langle b \rangle) \subset I + \langle ab \rangle = I,$$
     ce qui contredit $I \in \mathcal{E}$. Donc $\mathcal{E}$ est vide.

    **2.** Appliquons la question 1 à $I = \{0\}$ : $\mathfrak{p}_{1}\cdots\mathfrak{p}_{n} = \{0\}$. Soit $\mathfrak{q}$ un idéal premier. Il contient le produit, donc l'un des $\mathfrak{p}_{i}$ (feuille 2, exercice 9).

    Choisissons, parmi les $\mathfrak{p}_{i}$ contenus dans $\mathfrak{q}$, un élément $\mathfrak{p}_{j}$ minimal pour l'inclusion dans cet ensemble fini. Si $\mathfrak{r} \subset \mathfrak{p}_{j}$ est premier, $\mathfrak{r}$ contient un $\mathfrak{p}_{k}$, et $\mathfrak{p}_{k} \subset \mathfrak{p}_{j}$ impose $\mathfrak{p}_{k} = \mathfrak{p}_{j}$, donc $\mathfrak{r} = \mathfrak{p}_{j}$ : $\mathfrak{p}_{j}$ est un premier minimal contenu dans $\mathfrak{q}$.

    Si $\mathfrak{q}$ est lui-même minimal, alors $\mathfrak{q} = \mathfrak{p}_{j}$. Les premiers minimaux sont donc parmi $\mathfrak{p}_{1}, \dots, \mathfrak{p}_{n}$ : il y en a un nombre fini.

    **3.** On traite les deux anneaux l'un après l'autre.

    $\triangleright$ *$\mathbb{Z}/12\mathbb{Z}$.* Ses idéaux premiers correspondent aux idéaux premiers de $\mathbb{Z}$ contenant $12\mathbb{Z}$ : ce sont $\langle \overline{2} \rangle$ et $\langle \overline{3} \rangle$, non comparables, donc tous deux minimaux. On vérifie $\langle \overline{2} \rangle^{2}\langle \overline{3} \rangle = \langle \overline{12} \rangle = \{0\}$.

    $\triangleright$ *$\mathbb{C}[X, Y]/\langle XY \rangle$.* Un idéal premier de $\mathbb{C}[X, Y]$ qui contient $XY$ contient $X$ ou $Y$, donc $\langle X \rangle$ ou $\langle Y \rangle$. Ces deux idéaux sont premiers, de quotients $\mathbb{C}[Y]$ et $\mathbb{C}[X]$ intègres (feuille 2, exercice 4), et non comparables. Les premiers minimaux du quotient sont donc $\langle \overline{X} \rangle$ et $\langle \overline{Y} \rangle$, de produit nul.

    1.5em

    ![Figure](documents/figures/6677c2027772e3f6.svg)

    Les zéros réels de $XY$ forment la réunion des deux axes. Chaque idéal premier minimal correspond à l'une des deux « composantes » : l'axe des abscisses pour $\langle Y \rangle$, l'axe des ordonnées pour $\langle X \rangle$. Le résultat de la question 2 dit qu'un anneau noethérien n'a qu'un nombre fini de telles composantes.
