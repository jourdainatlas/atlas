  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $M$ un $A$-module noethérien et $u : M \to M$ un endomorphisme de $A$-modules.

    **1.** Montrer qu'il existe $n \in \mathbb{N}$ tel que $\mathrm{Ker}\,(u^{n}) \cap \operatorname{Im}(u^{n}) = \{0\}$.

    **2.** En déduire que, si $u$ est surjectif, alors $u$ est un isomorphisme.

    **3.** Ce résultat subsiste-t-il si $M$ n'est pas noethérien ?
  corrige: |
    **1.** La suite croissante $\mathrm{Ker}\, u \subset \mathrm{Ker}\, u^{2} \subset \cdots$ est stationnaire : il existe $n$ tel que $\mathrm{Ker}\, u^{k} = \mathrm{Ker}\, u^{n}$ pour $k \geqslant n$.

    Soit $x \in \mathrm{Ker}\,(u^{n}) \cap \operatorname{Im}(u^{n})$, $x = u^{n}(y)$. Alors $u^{2n}(y) = u^{n}(x) = 0$, donc $y \in \mathrm{Ker}\, u^{2n} = \mathrm{Ker}\, u^{n}$, et $x = u^{n}(y) = 0$.

    **2.** Si $u$ est surjectif, $u^{n}$ aussi, donc $\operatorname{Im}(u^{n}) = M$ et $\mathrm{Ker}\, u^{n} = \{0\}$ par la question 1. Comme $\mathrm{Ker}\, u \subset \mathrm{Ker}\, u^{n}$, $u$ est injectif : c'est un isomorphisme.

    **3.** Non. Sur le $\mathbb{Q}$-espace vectoriel $\mathbb{Q}[X]$, qui n'est pas noethérien (de dimension infinie), la dérivation est surjective mais pas injective. De même pour le décalage $(x_{0}, x_{1}, \dots) \mapsto (x_{1}, x_{2}, \dots)$ sur $K^{\mathbb{N}}$. *L'énoncé dual est faux même pour un module noethérien* : $x \mapsto 2x$ est injectif sur $\mathbb{Z}$, mais pas surjectif.
