  source: "D. Izquierdo, TD 4, exercice 8"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $M$ un $A$-module. On note $M[X]$ l'ensemble des expressions $\sum_{k = 0}^{d}m_{k}X^{k}$, à coefficients $m_{k} \in M$, appelées polynômes à coefficients dans $M$. C'est un $A[X]$-module pour la loi 
    $$\Big(\sum_{j}a_{j}X^{j}\Big)\cdot\Big(\sum_{k}m_{k}X^{k}\Big) = \sum_{n}\Big(\sum_{j + k = n}a_{j}m_{k}\Big)X^{n}.$$
     Montrer que $M[X]$ est un $A[X]$-module noethérien si et seulement si $M$ est un $A$-module noethérien. *Pour le sens réciproque, on adaptera la démonstration du théorème de Hilbert du cours, en remplaçant les idéaux $L_{d}$ des coefficients dominants par des sous-modules de $M$.*
  corrige: |
    $\triangleright$ *Sens direct.* À un sous-module $N$ de $M$ on associe le sous-$A[X]$-module $N[X]$ de $M[X]$, et $N \subsetneq N'$ entraîne $N[X] \subsetneq N'[X]$. Une suite croissante non stationnaire de sous-modules de $M$ en donnerait une de $M[X]$.

    $\triangleright$ *Sens réciproque.* Soit $M$ noethérien et $P$ un sous-$A[X]$-module de $M[X]$. Pour $d \geqslant 0$, soit $L_{d}$ l'ensemble formé de $0$ et des coefficients dominants des éléments de $P$ de degré $d$.

    • $L_{d}$ est un sous-$A$-module de $M$ : si $m$, $m'$ sont les coefficients dominants de $Q$, $Q' \in P$ de degré $d$, et si $m + m' \neq 0$, c'est le coefficient dominant de $Q + Q'$ ; de même $am$ pour $aQ$.

    • $L_{d} \subset L_{d + 1}$, puisque $XQ \in P$ a le même coefficient dominant que $Q$.

    La suite $(L_{d})$ est stationnaire, égale à $L_{D}$ à partir d'un rang $D$, et chaque $L_{d}$ est de type fini. Pour $d \leqslant D$, choisissons des $Q_{d, 1}, \dots, Q_{d, r_{d}} \in P$ de degré $d$ dont les coefficients dominants engendrent $L_{d}$.

    Montrons, par récurrence sur le degré $e$, que tout $Q \in P$ est dans le sous-module $P'$ engendré par ces éléments, en nombre fini. Si $Q = 0$, c'est clair. Soit $m$ son coefficient dominant.

    • Si $e \geqslant D$, écrivons $m = \sum a_{j}\,\mathrm{cd}(Q_{D, j})$ ; alors $Q - \sum a_{j}X^{e - D}Q_{D, j}$ est dans $P$, de degré $< e$.

    • Si $e < D$, écrivons $m = \sum a_{j}\,\mathrm{cd}(Q_{e, j})$ ; alors $Q - \sum a_{j}Q_{e, j}$ est dans $P$, de degré $< e$.

    Par hypothèse de récurrence, cette différence est dans $P'$, donc $Q$ aussi. Ainsi $P = P'$ est de type fini, et $M[X]$ est noethérien. Le cas $M = A$ redonne le théorème de Hilbert.

    1.5em

    ![Figure](documents/figures/e8413bf7584cd3f0.svg)

    Schéma de la démonstration : les modules $L_{d}$ des coefficients dominants croissent avec $d$ et se stabilisent, $M$ étant noethérien. Un nombre fini de générateurs, pris en degrés $0$ à $D$, suffit alors à réduire le degré de tout élément de $P$.
- id: "l3-sa-04-10"
  feuille: "f-l3-sa-04"
  numero: 10
  partie: "Perspective"
  etoiles: 3
  types: [Calcul]
  mots_cles: [anneaux noethériens]
  noeuds: [ac-noetheriens]
  notions: [anneau-noetherien]
  source: "ENS Lyon, TD 3 (2016-17), exercice 1"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Parmi les anneaux suivants, lesquels sont noethériens ?

    **1.** Le sous-anneau de $\mathbb{C}(X)$ formé des fractions rationnelles sans pôle sur le cercle $|z| = 1$.

    **2.** L'anneau des séries entières de rayon de convergence strictement positif.

    **3.** L'anneau des séries entières de rayon de convergence infini.

    **4.** L'anneau des polynômes $P \in \mathbb{Q}[X]$ tels que $P(0) \in \mathbb{Z}$.

    **5.** L'anneau $\mathbb{Z}^{\mathbb{N}}$ des suites à termes entiers, pour les opérations terme à terme.
  corrige: |
    **1. Noethérien.** Soit $\mathcal{S}$ l'ensemble des polynômes sans racine sur le cercle unité : l'anneau est $A = \{P/S ; P \in \mathbb{C}[X], S \in \mathcal{S}\}$. Soit $J$ un idéal de $A$ ; $J \cap \mathbb{C}[X]$ est un idéal de $\mathbb{C}[X]$, engendré par un polynôme $P_{0}$. Si $f = Q/S \in J$, alors $Q = Sf \in J \cap \mathbb{C}[X]$, donc $Q = P_{0}R$ et $f = P_{0} \cdot (R/S)$ : $J = P_{0}A$. L'anneau est principal, donc noethérien.

    **2. Noethérien.** Toute série non nulle s'écrit $f = z^{k}u$, avec $u(0) \neq 0$. On admet que $1/u$ est développable en série entière au voisinage de $0$ (résultat d'analyse complexe) : $u$ est inversible. Les idéaux non nuls sont donc les $\langle z^{k} \rangle$ : l'anneau est principal.

    **3. Non noethérien.** Soit $I_{n}$ l'idéal des fonctions entières qui s'annulent en tout entier $k \geqslant n$. La suite $(I_{n})$ est croissante. Elle est strictement croissante : la fonction $\frac{\sin(\pi z)}{z(z - 1)\cdots(z - n)}$, prolongée par continuité, est entière (on l'admet), s'annule en tout entier $k \geqslant n + 1$ mais pas en $n$.

    **4. Non noethérien.** La suite $\langle X \rangle \subset \langle X/2 \rangle \subset \langle X/4 \rangle \subset \cdots$ est croissante, car $\frac{X}{2^{n}} = 2 \cdot \frac{X}{2^{n + 1}}$. Elle est strictement croissante : $\frac{X}{2^{n + 1}} = \frac{X}{2^{n}}\,g$ imposerait $g = \frac{1}{2}$, dont le terme constant n'est pas entier.

    **5. Non noethérien.** L'idéal $I_{n}$ des suites nulles à partir du rang $n$ forme une suite strictement croissante.

