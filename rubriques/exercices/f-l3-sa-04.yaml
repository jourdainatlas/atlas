  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux noethériens]
  noeuds: [ac-noetheriens]
  notions: [anneau-noetherien, ideal-type-fini]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 10 ; D. Izquierdo, TD 4, exercice 3"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $H$ un sous-groupe de $\mathbb{Z}^{2}$ et $f : \mathbb{Z}^{2} \to \mathbb{Z}$, $(x, y) \mapsto x$. En considérant $f(H)$ et $H \cap \mathrm{Ker}\, f$, montrer que $H$ est engendré par au plus deux éléments.

    **2.** En déduire que tout idéal de l'anneau $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ est engendré par au plus deux éléments.

    **3.** Conclure que $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ est noethérien, mais non factoriel. Pourquoi tout élément non nul et non inversible y est-il néanmoins produit d'irréductibles ?
  corrige: |
    **1.** Le sous-groupe $f(H)$ de $\mathbb{Z}$ s'écrit $a\mathbb{Z}$, $a \geqslant 0$ (chapitre 1, prop. 3). Le sous-groupe $H \cap \mathrm{Ker}\, f$ est contenu dans $\{0\} \times \mathbb{Z}$, donc de la forme $\{0\} \times b\mathbb{Z}$ ; on pose $h_{2} = (0, b)$.

    Si $a = 0$, alors $H = H \cap \mathrm{Ker}\, f = \langle h_{2} \rangle$.

    Sinon, soit $h_{1} \in H$ tel que $f(h_{1}) = a$. Pour $h \in H$, $f(h) = ka$, et $h - kh_{1} \in H \cap \mathrm{Ker}\, f = \langle h_{2} \rangle$. Ainsi $H = \langle h_{1}, h_{2} \rangle$.

    **2.** Le groupe additif de $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ est isomorphe à $\mathbb{Z}^{2}$ par $x + y\mathrm{i}\sqrt{5} \mapsto (x, y)$. Un idéal $I$ en est un sous-groupe, donc $I = \mathbb{Z} h_{1} + \mathbb{Z} h_{2}$ par la question 1. L'idéal engendré par $h_{1}$, $h_{2}$ contient $\mathbb{Z} h_{1} + \mathbb{Z} h_{2} = I$ et est contenu dans $I$ : $I = \langle h_{1}, h_{2} \rangle$.

    **3.** Tout idéal est de type fini : l'anneau est noethérien (cours, th. 1). Il n'est pas factoriel (feuille 3, exercice 2). Les décompositions en irréductibles existent néanmoins, car c'est vrai dans tout anneau intègre noethérien (cours, prop. 4) ; c'est l'*unicité* qui fait défaut, comme le montrent les deux décompositions de $6$. *C'est la promesse du chapitre 4 du cours : noethérien et factoriel sont deux propriétés indépendantes.*

    1.5em

    ![Figure](documents/figures/3a73e94792d366c8.svg)

    La méthode de la question 1, appliquée à l'idéal $I = \langle 2, 1 + \mathrm{i}\sqrt{5} \rangle$ de la feuille 3 (exercice 3), repéré par les coordonnées $(x, y)$ de $x + y\mathrm{i}\sqrt{5}$ : $f(I) = \mathbb{Z}$, atteint en $h_{1} = 1 + \mathrm{i}\sqrt{5}$, et $I \cap \mathrm{Ker}\, f$ est engendré par $h_{2} = 2\mathrm{i}\sqrt{5}$. Les deux flèches rouges engendrent le réseau orange, qui n'est pas de la forme $\delta\,\mathbb{Z}[\mathrm{i}\sqrt{5}]$.
- id: "l3-sa-04-03"
  feuille: "f-l3-sa-04"
  numero: 3
  partie: "Anneaux noethériens"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux noethériens, idéaux premiers]
  noeuds: [ac-noetheriens, a-premier-maximal]
  notions: [anneau-noetherien, ideal-type-fini, ideal-premier]
  source: "D. Izquierdo, TD 4, exercice 5 ; devoir surveillé du 7/11/2014, question de cours 2"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $A$ un anneau.

    **1.** Soit $I$ un idéal de $A$ et $a \in A$. Montrer que, si $I + \langle a \rangle$ et $(I : a)$ sont de type fini, alors $I$ est de type fini.

    **2.** On suppose que tous les idéaux premiers de $A$ sont de type fini, et que l'ensemble $\mathcal{F}$ des idéaux de $A$ qui ne sont pas de type fini est non vide. Montrer, à l'aide du lemme de Zorn, que $\mathcal{F}$ a un élément maximal $I$, puis que $I$ est premier. *Si $ab \in I$ avec $a$, $b \notin I$, appliquer la question 1.*

    **3.** En déduire que $A$ est noethérien si et seulement si tous ses idéaux premiers sont de type fini.
  corrige: |
    **1.** Tout élément de $I + \langle a \rangle$ s'écrit $i + ra$, $i \in I$ : on peut choisir des générateurs de cette forme, $I + \langle a \rangle = \langle i_{1} + r_{1}a, \dots, i_{n} + r_{n}a \rangle$. Soit aussi $(I : a) = \langle j_{1}, \dots, j_{m} \rangle$. Montrons que 
    $$I = \langle i_{1}, \dots, i_{n}, aj_{1}, \dots, aj_{m} \rangle.$$

    L'inclusion $\supset$ vient de ce que $aj_{l} \in I$ par définition de $(I : a)$.

    Réciproquement, soit $x \in I \subset I + \langle a \rangle$ : $x = \sum c_{k}(i_{k} + r_{k}a) = \sum c_{k}i_{k} + ca$, avec $c = \sum c_{k}r_{k}$. Alors $ca = x - \sum c_{k}i_{k} \in I$, donc $c \in (I : a)$ s'écrit $\sum d_{l}j_{l}$, et $x = \sum c_{k}i_{k} + \sum d_{l}\,aj_{l}$.

    **2.** On procède en trois étapes.

    $\triangleright$ *Existence d'un élément maximal.* Soit $(I_{\lambda})$ une chaîne d'éléments de $\mathcal{F}$, et $U$ sa réunion, qui est un idéal. Si $U$ était de type fini, ses générateurs, en nombre fini, seraient dans un même $I_{\lambda}$, et l'on aurait $U = I_{\lambda}$, de type fini : contradiction. Donc $U \in \mathcal{F}$ ; l'ensemble $\mathcal{F}$ est inductif, et le lemme de Zorn fournit un élément maximal $I$.

    $\triangleright$ *$I$ est premier.* On a $I \neq A$, car $A = \langle 1 \rangle$. Supposons $ab \in I$ avec $a$, $b \notin I$. L'idéal $I + \langle a \rangle$ contient strictement $I$, donc il est de type fini par maximalité. L'idéal $(I : a)$ contient $I$ et $b$, donc il contient strictement $I$ et il est aussi de type fini. Par la question 1, $I$ est de type fini : c'est absurde.

    $\triangleright$ *Conclusion.* L'idéal $I$ est premier et n'est pas de type fini, ce qui contredit l'hypothèse : $\mathcal{F}$ est vide.

    **3.** Si $A$ est noethérien, tous ses idéaux sont de type fini. Réciproquement, si les idéaux premiers sont de type fini, la question 2 montre que tous les idéaux le sont, et $A$ est noethérien (cours, th. 1). *Il suffit donc de tester la condition sur les idéaux premiers* ; un argument analogue montre qu'un anneau dont tous les idéaux premiers sont principaux est principal.
