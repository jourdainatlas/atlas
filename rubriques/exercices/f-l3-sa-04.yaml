- id: "l3-sa-04-01"
  feuille: "f-l3-sa-04"
  numero: 1
  partie: "Vrai ou faux"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [anneaux et modules noethériens]
  noeuds: [ac-noetheriens, a-module]
  notions: [anneau-noetherien, module]
  source: "D. Izquierdo, Algèbre 2, TD 4 (2015), exercices 1 et 2 (items 1, 2, 7, 8, 9, 10 de l'exercice 1 ; items 1, 2, 3, 4, 5, 11 de l'exercice 2) ; devoir surveillé du 7/11/2014, questions de cours 3, 4 et 5 ; examen du 15/12/2014, exercice 4 (d) et (e) (partie « noethérien ») ; ENS Lyon, TD 3 (2016-17), exercice 2 (2)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dire si les assertions suivantes sont vraies ou fausses, en donnant une démonstration ou un contre-exemple. Sauf mention contraire, $A$ désigne un anneau.

    **1.** Tout sous-anneau d'un anneau noethérien est noethérien.

    **2.** Tout quotient d'un anneau noethérien est noethérien.

    **3.** Si $A[X]$ est noethérien, alors $A$ est noethérien.

    **4.** Tout anneau principal est noethérien.

    **5.** Tout anneau intègre noethérien est factoriel.

    **6.** Tout anneau factoriel est noethérien.

    **7.** Un produit fini d'anneaux noethériens est un anneau noethérien.

    **8.** Si $I$ est un idéal de type fini de $A$ et si $A/I$ est noethérien, alors $A$ est noethérien.

    **9.** Pour tout $\alpha \in \mathbb{C}$, l'anneau $\mathbb{Z}[\alpha]$ est noethérien. Les anneaux $\mathbb{Z}[\sqrt{2014}]$ et $\mathbb{Z}[\mathrm{i}][t]$ sont noethériens.

    **10.** Si $A$ est noethérien, tout sous-module d'un $A$-module de type fini est de type fini.

    **11.** Si $N$ est un sous-module d'un $A$-module $M$ et si $N$ et $M/N$ sont de type fini, alors $M$ est de type fini.

    **12.** Il existe un $\mathbb{Z}$-module qui n'a pas de famille génératrice minimale (pour l'inclusion).

    **13.** Si $n \geqslant 1$, toute famille génératrice du $A$-module $A^{n}$ a au moins $n$ éléments.
  corrige: |
    On note $K[X_{1}, X_{2}, \dots]$ l'anneau des polynômes en une infinité d'indéterminées sur un corps $K$ ; il n'est pas noethérien, car la suite $\langle X_{1} \rangle \subsetneq \langle X_{1}, X_{2} \rangle \subsetneq \cdots$ n'est pas stationnaire (cours, section 4.4).

    **1. Faux.** L'anneau intègre $K[X_{1}, X_{2}, \dots]$ est un sous-anneau de son corps des fractions, qui est noethérien comme tout corps.

    **2. Vrai.** C'est la prop. 4 du cours.

    **3. Vrai.** On a $A \simeq A[X]/\langle X \rangle$ (feuille 2, exercice 4), quotient d'un anneau noethérien.

    **4. Vrai.** Tout idéal est engendré par un élément, donc de type fini (cours, th. 1).

    **5. Faux.** L'anneau $\mathbb{Z}[\mathrm{i}\sqrt{5}]$ est intègre et noethérien (exercice 2), mais pas factoriel (feuille 3, exercice 2).

    **6. Faux.** L'anneau $\mathbb{Q}[X_{1}, X_{2}, \dots]$ est factoriel (cours, chapitre 5, prop. 6), mais pas noethérien.

    **7. Vrai.** Soit $A_{1}$, $A_{2}$ noethériens et $I$ un idéal de $A_{1} \times A_{2}$. Comme $(a, b) = (a, 0) + (0, b)$ et $(a, 0) = (1, 0)(a, b)$, on a $I = I_{1} \times I_{2}$, où $I_{1}$, $I_{2}$ sont les projections de $I$, idéaux de $A_{1}$ et $A_{2}$. Une suite croissante d'idéaux du produit donne deux suites croissantes, stationnaires, d'où le résultat.

    **8. Faux.** Soit $B$ un anneau non noethérien, $K$ un corps et $A = K \times B$. L'idéal $I = \{0\} \times B = \langle (0, 1) \rangle$ est de type fini, et $A/I \simeq K$ est noethérien. Mais $A$ ne l'est pas : une suite croissante non stationnaire d'idéaux $J_{n}$ de $B$ donne la suite $\{0\} \times J_{n}$.

    **9. Vrai.** L'anneau $\mathbb{Z}$ est principal, donc noethérien, et $\mathbb{Z}[X]$ l'est par le théorème de Hilbert. L'évaluation en $\alpha$ est un morphisme surjectif de $\mathbb{Z}[X]$ sur $\mathbb{Z}[\alpha]$ : ce dernier est noethérien (cours, prop. 4). C'est le cas de $\mathbb{Z}[\sqrt{2014}]$.

    De même, $\mathbb{Z}[\mathrm{i}]$ est principal (feuille 3, exercice 7), donc $\mathbb{Z}[\mathrm{i}][t]$ est noethérien par le théorème de Hilbert. *Il n'est pas principal* : l'idéal $\langle 1 + \mathrm{i}, t \rangle$ ne l'est pas (cours, section 4.5).

    **10. Vrai.** Un module de type fini sur un anneau noethérien est noethérien (cours, prop. 3), et ses sous-modules sont de type fini (th. 1).

    **11. Vrai.** Soit $n_{1}, \dots, n_{r}$ des générateurs de $N$ et $x_{1}, \dots, x_{s} \in M$ dont les classes engendrent $M/N$. Pour $m \in M$, on écrit $\overline{m} = \sum a_{j}\overline{x_{j}}$ ; alors $m - \sum a_{j}x_{j} \in N$ s'écrit $\sum b_{i}n_{i}$. Les $n_{i}$ et les $x_{j}$ engendrent $M$.

    **12. Vrai.** Le $\mathbb{Z}$-module $\mathbb{Q}$ convient. Supposons que $S$ soit une famille génératrice minimale de $\mathbb{Q}$, et soit $s \in S$. Le sous-groupe $N = \langle S \setminus \{s\} \rangle$ est différent de $\mathbb{Q}$, et $\mathbb{Q}/N$ est engendré par $\overline{s}$ : c'est un groupe cyclique non nul, isomorphe à $\mathbb{Z}$ ou à un $\mathbb{Z}/k\mathbb{Z}$, $k \geqslant 2$.

    Or $\mathbb{Q}/N$ est *divisible* : pour tout $y$ et tout $k \geqslant 1$, il existe $x$ tel que $kx = y$, puisque c'est vrai dans $\mathbb{Q}$. Ni $\mathbb{Z}$ (où $2x = 1$ est impossible) ni $\mathbb{Z}/k\mathbb{Z}$ (où $kx = \overline{1}$ est impossible, $kx$ étant nul) ne sont divisibles : contradiction.

    **13. Vrai.** Soit $\mathfrak{m}$ un idéal maximal de $A$ (chapitre 2, th. 5) et $K = A/\mathfrak{m}$. La surjection $A^{n} \to K^{n}$, réduction modulo $\mathfrak{m}$ de chaque coordonnée, est $A$-linéaire. L'image d'une famille génératrice de $A^{n}$ engendre $K^{n}$ comme $A$-module, donc comme $K$-espace vectoriel, l'action de $A$ sur $K^{n}$ passant par $K$. Comme $\dim_{K}K^{n} = n$, la famille a au moins $n$ éléments.
- id: "l3-sa-04-02"
  feuille: "f-l3-sa-04"
  numero: 2
