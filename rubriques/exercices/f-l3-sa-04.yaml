    Soit $M$, $N$ et $P$ trois $A$-modules, $i : M \to N$ un morphisme injectif et $p : N \to P$ un morphisme surjectif tels que $p \circ i = 0$. Montrer que $N$ est noethérien si et seulement si $M$, $P$ et $\mathrm{Ker}\, p/\operatorname{Im} i$ sont noethériens.
  corrige: |
    Posons $K = \mathrm{Ker}\, p$ ; comme $p \circ i = 0$, $\operatorname{Im} i \subset K$. On a $M \simeq \operatorname{Im} i$, puisque $i$ est injectif, et $N/K \simeq P$, puisque $p$ est surjectif (cours, prop. 1).

    $\triangleright$ *Sens direct.* Si $N$ est noethérien, ses sous-modules $\operatorname{Im} i \simeq M$ et $K$ le sont, ainsi que les quotients $N/K \simeq P$ et $K/\operatorname{Im} i$ (cours, prop. 2).

    $\triangleright$ *Sens réciproque.* Si $\operatorname{Im} i \simeq M$ et $K/\operatorname{Im} i$ sont noethériens, $K$ l'est (prop. 2). Puis, $K$ et $N/K \simeq P$ étant noethériens, $N$ l'est (prop. 2 encore).

    La prop. 2 du cours est le cas particulier où $\operatorname{Im} i = \mathrm{Ker}\, p$.
