  enonce: |
    **1.** Soit $R$ un anneau intègre dans lequel toute suite décroissante d'idéaux est stationnaire. Montrer que $R$ est un corps.

    **2.** Un sous-anneau d'un anneau noethérien (respectivement principal, euclidien) a-t-il la même propriété ? Même question pour le quotient par un idéal premier.
  corrige: |
    **1.** Soit $a \neq 0$. La suite décroissante $\langle a \rangle \supset \langle a^{2} \rangle \supset \cdots$ est stationnaire : $\langle a^{n} \rangle = \langle a^{n + 1} \rangle$ pour un $n$, donc $a^{n} = ba^{n + 1}$ pour un $b \in R$. Alors $a^{n}(1 - ba) = 0$, et, $R$ étant intègre et $a^{n} \neq 0$, $ba = 1$ : $a$ est inversible.

    **2.** *Sous-anneaux : non dans les trois cas.* L'exercice 1 (question 1) traite le cas noethérien. Le corps $\mathbb{Q}(X)$ est euclidien (tout reste peut être pris nul), donc principal, et son sous-anneau $\mathbb{Z}[X]$ n'est pas principal (cours, chapitre 3), donc pas euclidien.

    *Quotients par un idéal premier $\mathfrak{p}$ : oui dans les trois cas.*

    • Noethérien : c'est la prop. 4 du cours.

    • Principal : $A/\mathfrak{p}$ est intègre (chapitre 2, th. 4), et ses idéaux, images d'idéaux principaux $\langle a \rangle$, sont les $\langle \overline{a} \rangle$ (feuille 2, exercice 6).

    • Euclidien : si $\mathfrak{p} = \{0\}$, $A/\mathfrak{p} \simeq A$. Sinon, $\mathfrak{p} = \langle \pi \rangle$ est maximal (chapitre 3, th. 2), et $A/\mathfrak{p}$ est un corps, euclidien.
- id: "l3-sa-04-05"
  feuille: "f-l3-sa-04"
  numero: 5
  partie: "Anneaux noethériens"
  etoiles: 2
