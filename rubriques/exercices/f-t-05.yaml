  enonce: |
    *Les formes indéterminées « $1^{\infty}$ » et « $0^{0}$ ».* Comme à l'exercice 31, une expression de la forme $u(x)^{v(x)}$, avec $u(x)>0$, désigne $\mathrm{e}^{v(x)\ln\left(u(x)\right)}$.

    **1.** Trouver les limites quand $x$ tend vers $+\infty$ de : 
    $$f(x)=\left(1+\frac{1}{x^{2}}\right)^{x} \qquad\qquad g(x)=\left(1+\frac{1}{x}\right)^{x^{2}}$$

    **2.** Montrer que $x^{x}$ tend vers $1$ lorsque $x$ tend vers $0^{+}$.

    **3.** Indiquer un exemple de fonction $u$ définie sur $]0\,;1[$, à valeurs strictement positives, tendant vers $0$ en $0$ et telle que $u(x)^{x}$ ne tende pas vers $1$ lorsque $x$ tend vers $0^{+}$.

    **4.** Indiquer un exemple de fonction $v$ définie sur $]0\,;1[$, à valeurs strictement positives, tendant vers $0$ en $0$ et telle que $x^{v(x)}$ ne tende pas vers $1$ lorsque $x$ tend vers $0^{+}$.
  corrige: |
    Dans tout l'exercice, on utilise la limite du cours $\displaystyle\lim_{t\to 0} \frac{\ln(1+t)}{t}=1$, déjà employée aux exercices 30 et 32, et la continuité de l'exponentielle.

    **1.** On a $f(x)=\mathrm{e}^{\,x\ln\left(1+\frac{1}{x^{2}}\right)}$. Posons $t=\dfrac{1}{x^{2}}$, qui tend vers $0$ : 
    $$x\ln\left(1+\frac{1}{x^{2}}\right)=x\times t\times\frac{\ln(1+t)}{t} =\frac{1}{x}\times\frac{\ln(1+t)}{t}\longrightarrow 0\times 1=0$$

    $$\boxed{\lim_{x\to+\infty}f(x)=\mathrm{e}^{0}=1}$$
     De même, $g(x)=\mathrm{e}^{\,x^{2}\ln\left(1+\frac{1}{x}\right)}$ et, avec $t=\dfrac{1}{x}\to 0$ : 
    $$x^{2}\ln\left(1+\frac{1}{x}\right)=x\times\frac{\ln(1+t)}{t}\longrightarrow+\infty$$

    $$\boxed{\lim_{x\to+\infty}g(x)=+\infty}$$
     *Remarque.* Les deux expressions sont de la forme « $1^{\infty}$ », et leurs limites diffèrent ; l'exercice 32 en fournit une troisième, $\left(1+\frac{x}{n}\right)^{n}\to\mathrm{e}^{x}$. C'est la preuve que « $1^{\infty}$ » est une forme indéterminée : l'erreur la plus répandue est de penser qu'une puissance de $1$ vaut toujours $1$, en oubliant que la base n'est pas égale à $1$ mais seulement proche de $1$.

    **2.** $x^{x}=\mathrm{e}^{\,x\ln(x)}$, et $x\ln(x)\to 0$ quand $x\to 0^{+}$ par croissances comparées (cours, et question 7 de l'exercice 23). Par continuité de l'exponentielle : 
    $$\boxed{\lim_{x\to 0^{+}}x^{x}=\mathrm{e}^{0}=1}$$

    **3.** Prenons $u(x)=\mathrm{e}^{-\frac{1}{x^{2}}}$ : elle est à valeurs strictement positives, et $-\frac{1}{x^{2}}\to-\infty$ donne $u(x)\to 0$ quand $x\to 0^{+}$. Mais 
    $$u(x)^{x}=\mathrm{e}^{\,x\times\left(-\frac{1}{x^{2}}\right)}=\mathrm{e}^{-\frac{1}{x}}\longrightarrow 0 \qquad\text{quand } x\to 0^{+}$$

    $$\boxed{u(x)=\mathrm{e}^{-1/x^{2}} \text{ convient : } u(x)^{x}\to 0\neq 1.}$$

    **4.** Prenons $v(x)=-\dfrac{1}{\ln(x)}$ sur $]0\,;1[$ : comme $\ln(x)<0$, elle est à valeurs strictement positives, et $\ln(x)\to-\infty$ donne $v(x)\to 0$. Mais 
    $$x^{v(x)}=\mathrm{e}^{\,v(x)\ln(x)}=\mathrm{e}^{-1}$$
     est constant. 
    $$\boxed{v(x)=-\frac{1}{\ln(x)} \text{ convient : } x^{v(x)}=\frac{1}{\mathrm{e}}\neq 1.}$$
     *Remarque.* Les questions 2 à 4 montrent que « $0^{0}$ » est, lui aussi, une forme indéterminée : selon la vitesse à laquelle la base et l'exposant tendent vers $0$, la limite peut valoir $1$, $0$ ou $\frac{1}{\mathrm{e}}$. La convention $0^{0}=1$, commode en algèbre (pour écrire un polynôme $\sum a_{k}x^{k}$ en $x=0$), ne dit donc rien des limites.
