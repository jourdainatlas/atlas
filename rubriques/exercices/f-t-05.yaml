  page_corrige: 22
  enonce: |
    **1.** Étudier la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=\ln\left(1+\mathrm{e}^{x}\right)$.

    **2.** Montrer que $f(x)-x$ tend vers $0$ lorsque $x$ tend vers $+\infty$. Interpréter géométriquement.
  corrige: |
    **1.** Pour tout réel $x$, $1+\mathrm{e}^{x}>0$ : $f$ est définie et dérivable sur $\mathbb{R}$, et 
    $$f'(x)=\frac{\mathrm{e}^{x}}{1+\mathrm{e}^{x}}>0$$
     La fonction $f$ est donc strictement croissante sur $\mathbb{R}$. En $-\infty$, $\mathrm{e}^{x}\to 0$, donc $1+\mathrm{e}^{x}\to 1$ et $f(x)\to\ln(1)=0$ : l'axe des abscisses est asymptote en $-\infty$. En $+\infty$, $1+\mathrm{e}^{x}\to+\infty$, donc $f(x)\to+\infty$. On note enfin que $f(0)=\ln(2)$.

    ![Figure](documents/figures/ba039a556267a681.svg)

    **2.** Comme $x=\ln\left(\mathrm{e}^{x}\right)$, on a, pour tout réel $x$ : 
    $$f(x)-x=\ln\left(1+\mathrm{e}^{x}\right)-\ln\left(\mathrm{e}^{x}\right)=\ln\left(\frac{1+\mathrm{e}^{x}}{\mathrm{e}^{x}}\right) =\ln\left(1+\mathrm{e}^{-x}\right)$$
     Quand $x\to+\infty$, $\mathrm{e}^{-x}\to 0$, donc $1+\mathrm{e}^{-x}\to 1$ et 
    $$\boxed{\lim_{x\to+\infty}\big(f(x)-x\big)=\ln(1)=0}$$
     *Interprétation.* L'écart vertical entre la courbe de $f$ et la droite d'équation $y=x$ tend vers $0$ : cette droite est *asymptote oblique* à la courbe en $+\infty$. De plus, $1+\mathrm{e}^{-x}>1$ donne $f(x)-x>0$ : la courbe est toujours au-dessus de son asymptote.

    ![Figure](documents/figures/42b4a6dbd0c1dead.svg)

    Cette figure montre les deux asymptotes : l'axe des abscisses en $-\infty$, et la droite d'équation $y=x$ en $+\infty$, que la courbe approche par au-dessus.

    *Remarque.* Le calcul de la question 2 est un réflexe à retenir : pour comparer $\ln(\text{quelque chose})$ à $x$, on écrit $x=\ln\left(\mathrm{e}^{x}\right)$ et l'on regroupe les deux logarithmes. En $-\infty$, c'est la limite du cours $\frac{\ln(1+t)}{t}\to 1$, appliquée à $t=\mathrm{e}^{x}\to 0$, qui donne $\frac{f(x)}{\mathrm{e}^{x}}\to 1$ : très à gauche, $f(x)$ est « presque égal » à $\mathrm{e}^{x}$, au sens où leur quotient tend vers $1$.
