  noeuds: [cx-exponentielle, nb-logarithme, c-tvi]
  notions: [exponentielle, logarithme]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 165 et n° 175"
  page_enonce: 14
  page_corrige: 24
  enonce: |
    *Fonctions hyperboliques.* Les fonctions $\operatorname{ch}$ (cosinus hyperbolique) et $\operatorname{sh}$ (sinus hyperbolique) sont définies sur $\mathbb{R}$ par : 
    $$\operatorname{ch}(x)=\frac{\mathrm{e}^{x}+\mathrm{e}^{-x}}{2} \qquad\qquad \operatorname{sh}(x)=\frac{\mathrm{e}^{x}-\mathrm{e}^{-x}}{2}$$

    **1.** Étudier ces deux fonctions ; en tracer les courbes.

    **2.** Montrer que, pour tout réel $y\geqslant 1$, l'équation $\operatorname{ch}(x)=y$ admet une unique solution $x$ dans $[0\,;+\infty[$, et exprimer cette solution en fonction de $y$.

    **3.** Montrer que, pour tout réel $y$, l'équation $\operatorname{sh}(x)=y$ admet une unique solution réelle $x$, et exprimer cette solution en fonction de $y$.

    **4.** Pour $x$ réel, calculer $\operatorname{ch}^{2}(x)-\operatorname{sh}^{2}(x)$.

    **5.** En utilisant la fonction $g : x\mapsto\ln\left(\operatorname{ch}(x)\right)-\dfrac{x^{2}}{2}$, montrer que : 
    $$\text{pour tout réel } x, \qquad \operatorname{ch}(x)\leqslant\mathrm{e}^{\frac{x^{2}}{2}}$$
  corrige: |
    **1.** La dérivée de $x\mapsto\mathrm{e}^{-x}$ étant $x\mapsto-\mathrm{e}^{-x}$, on obtient 
    $$\operatorname{ch}'(x)=\frac{\mathrm{e}^{x}-\mathrm{e}^{-x}}{2}=\operatorname{sh}(x) \qquad\text{et}\qquad \operatorname{sh}'(x)=\frac{\mathrm{e}^{x}+\mathrm{e}^{-x}}{2}=\operatorname{ch}(x)$$
     Comme $\operatorname{ch}(x)>0$, la fonction $\operatorname{sh}$ est strictement croissante sur $\mathbb{R}$ ; elle s'annule en $0$, donc elle est négative sur $]-\infty\,;0]$ et positive sur $[0\,;+\infty[$. Par conséquent $\operatorname{ch}$ est décroissante sur $]-\infty\,;0]$ et croissante sur $[0\,;+\infty[$, de minimum $\operatorname{ch}(0)=1$. On remarque aussi que $\operatorname{ch}(-x)=\operatorname{ch}(x)$ et $\operatorname{sh}(-x)=-\operatorname{sh}(x)$ : $\operatorname{ch}$ est paire, $\operatorname{sh}$ est impaire. Pour les limites, $\mathrm{e}^{x}\to+\infty$ et $\mathrm{e}^{-x}\to 0$ en $+\infty$, donc $\operatorname{ch}$ et $\operatorname{sh}$ tendent vers $+\infty$ ; par parité, en $-\infty$, $\operatorname{ch}\to+\infty$ et $\operatorname{sh}\to-\infty$.

    ![Figure](documents/figures/25fb743c6a0c7ef6.svg)

    ![Figure](documents/figures/05973cf25f1aba4d.svg)

    On lit sur cette figure la parité de $\operatorname{ch}$ (courbe symétrique par rapport à l'axe des ordonnées), l'imparité de $\operatorname{sh}$ (courbe symétrique par rapport à l'origine), et le fait que la courbe de $\operatorname{ch}$ reste au-dessus de celle de $\operatorname{sh}$, l'écart $\operatorname{ch}(x)-\operatorname{sh}(x)=\mathrm{e}^{-x}$ tendant vers $0$ en $+\infty$.

    **2.** La fonction $\operatorname{ch}$ est continue et strictement croissante sur $[0\,;+\infty[$, avec $\operatorname{ch}(0)=1$ et une limite $+\infty$ : d'après le théorème de la bijection, l'équation $\operatorname{ch}(x)=y$ admet une unique solution $x\geqslant 0$ pour tout $y\geqslant 1$. Pour l'exprimer, on multiplie par $2\mathrm{e}^{x}>0$ et l'on pose $X=\mathrm{e}^{x}$ : 
    $$\operatorname{ch}(x)=y \iff \mathrm{e}^{2x}-2y\,\mathrm{e}^{x}+1=0 \iff X^{2}-2yX+1=0$$
     Le discriminant $4y^{2}-4$ est positif ou nul, d'où les racines $X=y\pm\sqrt{y^{2}-1}$, dont le produit vaut $1$. La condition $x\geqslant 0$ équivaut à $X\geqslant 1$ : c'est la racine $y+\sqrt{y^{2}-1}$, qui est supérieure ou égale à $y\geqslant 1$, l'autre valant son inverse. 
    $$\boxed{x=\ln\left(y+\sqrt{y^{2}-1}\right)}$$

    **3.** De même, $\operatorname{sh}$ est continue et strictement croissante sur $\mathbb{R}$, de limites $-\infty$ et $+\infty$ : l'équation $\operatorname{sh}(x)=y$ a une unique solution pour tout réel $y$. Avec $X=\mathrm{e}^{x}$, elle devient $X^{2}-2yX-1=0$, de discriminant $4y^{2}+4>0$ et de racines $y\pm\sqrt{y^{2}+1}$. Leur produit vaut $-1$ : l'une est positive, l'autre négative. Or $X=\mathrm{e}^{x}>0$, et $\sqrt{y^{2}+1}>\sqrt{y^{2}}=|y|$ assure que $y+\sqrt{y^{2}+1}>0$. 
    $$\boxed{x=\ln\left(y+\sqrt{y^{2}+1}\right)}$$

    **4.** On factorise : $\operatorname{ch}^{2}(x)-\operatorname{sh}^{2}(x)=\big(\operatorname{ch}(x)-\operatorname{sh}(x) \big)\big(\operatorname{ch}(x)+\operatorname{sh}(x)\big)=\mathrm{e}^{-x}\times\mathrm{e}^{x}$, d'où 
    $$\boxed{\operatorname{ch}^{2}(x)-\operatorname{sh}^{2}(x)=1}$$
     *Remarque.* Cette relation rappelle $\cos^{2}+\sin^{2}=1$, que l'on retrouvera au chapitre 9 : le point de coordonnées $\left(\cos t\,;\sin t\right)$ décrit un cercle, tandis que le point $\left(\operatorname{ch}t\,;\operatorname{sh}t\right)$ décrit une branche de l'hyperbole d'équation $X^{2}-Y^{2}=1$. C'est l'origine du mot « hyperbolique ».

    **5.** Comme $\operatorname{ch}(x)\geqslant 1>0$, la fonction $g$ est définie et dérivable sur $\mathbb{R}$, et 
    $$g'(x)=\frac{\operatorname{sh}(x)}{\operatorname{ch}(x)}-x =\frac{\operatorname{sh}(x)-x\operatorname{ch}(x)}{\operatorname{ch}(x)}$$
     Posons $k(x)=x\operatorname{ch}(x)-\operatorname{sh}(x)$. Alors $k'(x)=\operatorname{ch}(x)+x\operatorname{sh}(x)-\operatorname{ch}(x)=x\operatorname{sh}(x)$, qui est positif puisque $x$ et $\operatorname{sh}(x)$ ont le même signe. La fonction $k$ est donc croissante, et $k(0)=0$ : elle est négative sur $]-\infty\,;0]$ et positive sur $[0\,;+\infty[$. Comme $g'(x)=-\dfrac{k(x)}{\operatorname{ch}(x)}$, la fonction $g$ est croissante sur $]-\infty\,;0]$ et décroissante sur $[0\,;+\infty[$ : elle atteint son maximum en $0$, où elle vaut $\ln(1)-0=0$. Ainsi $\ln\left(\operatorname{ch}(x)\right)\leqslant \dfrac{x^{2}}{2}$, et, l'exponentielle étant croissante : 
    $$\boxed{\text{pour tout réel } x,\quad \operatorname{ch}(x)\leqslant\mathrm{e}^{\frac{x^{2}}{2}}}$$
     *Vérification :* pour $x=2$, $\operatorname{ch}(2)\approx 3{,}762$ et $\mathrm{e}^{2}\approx 7{,}389$.

    *Remarque.* Le passage au logarithme est ce qui rend la question abordable : comparer directement $\operatorname{ch}(x)$ et $\mathrm{e}^{x^{2}/2}$ conduirait à une dérivée où les deux exponentielles se mélangent. Cette majoration n'est pas une curiosité : elle intervient en probabilités, dans la démonstration de l'inégalité de Hoeffding, qui précise la loi des grands nombres du chapitre 10.
