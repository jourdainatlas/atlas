  page_enonce: 14
  page_corrige: 23
  enonce: |
    **1.** Étudier la fonction $f : x\mapsto\dfrac{\ln(x)}{x}$ sur $]0\,;+\infty[$.

    **2.** En utilisant la question 1, déterminer les couples $(a\,;b)$ d'entiers naturels non nuls vérifiant $a<b$ et 
    $$a^{b}=b^{a}$$
  corrige: |
    **1.** C'est la fonction $g$ de l'exercice 20 : $f$ est strictement croissante sur $]0\,;\mathrm{e}]$, de $-\infty$ à $\frac{1}{\mathrm{e}}$, puis strictement décroissante sur $[\mathrm{e}\,;+\infty[$, de $\frac{1}{\mathrm{e}}$ à $0$. Elle s'annule en $1$, est négative sur $]0\,;1[$ et positive sur $]1\,;+\infty[$.

    **2.** Pour des entiers $a$ et $b$ strictement positifs, la fonction $\ln$ étant strictement croissante : 
    $$a^{b}=b^{a} \iff b\ln(a)=a\ln(b) \iff \frac{\ln(a)}{a}=\frac{\ln(b)}{b} \iff f(a)=f(b)$$
     Supposons $a<b$ et $f(a)=f(b)$. Comme $f$ est strictement monotone sur $]0\,;\mathrm{e}]$ et sur $[\mathrm{e}\,;+\infty[$, deux réels distincts appartenant à un même de ces deux intervalles ont des images distinctes. On a donc nécessairement $a<\mathrm{e}<b$, et l'entier $a$ vaut $1$ ou $2$.

    • Si $a=1$, alors $f(b)=f(1)=0$, ce qui est impossible puisque $f(b)>0$ pour $b>1$.

    • Si $a=2$, on remarque que $f(2)=\dfrac{\ln(2)}{2}=\dfrac{2\ln(2)}{4}=\dfrac{\ln(4)}{4}=f(4)$. Comme $4>\mathrm{e}$ et que $f$ est strictement décroissante sur $[\mathrm{e}\,;+\infty[$, l'entier $b=4$ est le seul $b>\mathrm{e}$ tel que $f(b)=f(2)$.

    $$\boxed{\text{Le seul couple est } (a\,;b)=(2\,;4) \text{ : } 2^{4}=4^{2}=16.}$$
     *Remarque.* Si l'on cherche des réels et non des entiers, la même étude montre que, pour tout $a\in]1\,;\mathrm{e}[$, il existe un unique réel $b>\mathrm{e}$ tel que $a^{b}=b^{a}$ : il y a une infinité de couples réels, et l'arithmétique, en imposant $a$ entier, n'en laisse qu'un. L'erreur la plus répandue est de conclure par un simple essai de valeurs : trouver $(2\,;4)$ ne prouve pas qu'il n'y en a pas d'autre, c'est l'étude de $f$ qui le garantit.
- id: "t-05-36"
  feuille: "f-t-05"
