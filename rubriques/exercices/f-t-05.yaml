  page_enonce: 8
  page_corrige: 13
  enonce: |
    On considère la fonction $f$ définie sur $]0\,;+\infty[$ par $f(x)=2\ln(x)-x+3$.

    **1.** Déterminer $\displaystyle\lim_{x\to 0^{+}}f(x)$.

    **2.** Montrer que $f(x)=x\left(\dfrac{2\ln(x)}{x}-1+\dfrac{3}{x}\right)$ pour $x>0$, puis en déduire $\displaystyle\lim_{x\to+\infty}f(x)$.

    **3.** Calculer $f'(x)$ et montrer que $f'(x)=\dfrac{2-x}{x}$.

    **4.** Dresser le tableau de variations de $f$, en précisant la valeur exacte du maximum.

    **5.** Démontrer que l'équation $f(x)=0$ admet exactement deux solutions $\alpha$ et $\beta$, avec $\alpha<\beta$.

    **6.** Donner un encadrement de $\alpha$ et de $\beta$ d'amplitude $0{,}1$ pour $\alpha$, et d'amplitude $1$ pour $\beta$.

    **7.** En déduire le signe de $f$ sur $]0\,;+\infty[$.

    **8.** Déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $1$.
  corrige: |
    **1.** $\ln(x)\to-\infty$ et $-x+3\to 3$, donc $\boxed{\lim_{x\to 0^{+}}f(x)=-\infty}$

    **2.** Pour $x>0$, on factorise par $x$ : 
    $$f(x)=x\left(\frac{2\ln(x)}{x}-1+\frac{3}{x}\right)$$
     Par croissances comparées, $\dfrac{\ln(x)}{x}\to 0$, et $\dfrac{3}{x}\to 0$ : la parenthèse tend donc vers $-1$, tandis que $x\to+\infty$. 
    $$\boxed{\lim_{x\to+\infty}f(x)=-\infty}$$

    **3.** $f'(x)=\dfrac{2}{x}-1=\boxed{\dfrac{2-x}{x}}$

    **4.** Sur $]0\,;+\infty[$, $f'$ a le signe de $2-x$, et le maximum vaut $f(2)=2\ln(2)-2+3=2\ln(2)+1$.

    ![Figure](documents/figures/20b1350f6c8617e6.svg)

    *Valeur approchée du maximum :* $2\ln(2)+1\approx 2{,}386$.

    **5.** Sur $]0\,;2]$, $f$ est continue et strictement croissante de $-\infty$ à $2\ln(2)+1>0$ : d'après le théorème de la bijection, l'équation $f(x)=0$ admet une unique solution $\alpha$. Sur $[2\,;+\infty[$, $f$ est continue et strictement décroissante de $2\ln(2)+1$ à $-\infty$ : une unique solution $\beta$. 
    $$\boxed{\text{L'équation } f(x)=0 \text{ admet exactement deux solutions } \alpha<2<\beta.}$$

    **6.** $f(0{,}2)\approx-0{,}42<0$ et $f(0{,}3)\approx 0{,}29>0$ ; $f(6)\approx 0{,}58>0$ et $f(7)\approx-0{,}11<0$ : 
    $$\boxed{0{,}2<\alpha<0{,}3 \qquad\text{et}\qquad 6<\beta<7}$$

    **7.** D'après le tableau de variations et le signe des valeurs : 
    $$\boxed{f<0 \text{ sur } ]0\,;\alpha[\ \cup\ ]\beta\,;+\infty[ \quad\text{et}\quad f>0 \text{ sur } ]\alpha\,;\beta[.}$$

    **8.** $f(1)=2\ln(1)-1+3=2$ et $f'(1)=\dfrac{2-1}{1}=1$, d'où 
    $$\boxed{y=x+1}$$
- id: "t-05-27"
  feuille: "f-t-05"
  numero: 27
  titre: "Type Bac"
