  enonce: |
    Montrer que, pour tout entier $n\geqslant 1$ et tout réel $x\in[0\,;2[$ : 
    $$\left(1+\frac{x}{n}\right)^{n}\leqslant\frac{2+x}{2-x}$$
  corrige: |
    Fixons un entier $n\geqslant 1$. Pour $x\in[0\,;2[$, les nombres $1+\frac{x}{n}$, $2+x$ et $2-x$ sont strictement positifs. La fonction $\ln$ étant strictement croissante, l'inégalité demandée équivaut à 
    $$n\ln\left(1+\frac{x}{n}\right)\leqslant\ln(2+x)-\ln(2-x)$$
     Posons donc, pour $x\in[0\,;2[$, $h(x)=\ln(2+x)-\ln(2-x)-n\ln\left(1+\dfrac{x}{n}\right)$. La fonction $h$ est dérivable, et, la dérivée de $x\mapsto\ln(2-x)$ étant $x\mapsto-\dfrac{1}{2-x}$ : 
    $$h'(x)=\frac{1}{2+x}+\frac{1}{2-x}-\frac{n\times\frac{1}{n}}{1+\frac{x}{n}} =\frac{4}{4-x^{2}}-\frac{n}{n+x} =\frac{4(n+x)-n\left(4-x^{2}\right)}{\left(4-x^{2}\right)(n+x)} =\frac{x\,(nx+4)}{\left(4-x^{2}\right)(n+x)}$$
     Sur $[0\,;2[$, tous les facteurs sont positifs : $h'(x)\geqslant 0$, donc $h$ est croissante, et $h(x)\geqslant h(0)=\ln(2)-\ln(2)-0=0$. 
    $$\boxed{\text{Pour tout } n\geqslant 1 \text{ et tout } x\in[0\,;2[,\quad \left(1+\frac{x}{n}\right)^{n}\leqslant\frac{2+x}{2-x}}$$

    *Remarque.* D'après l'exercice 32, le membre de gauche tend vers $\mathrm{e}^{x}$ quand $n$ tend vers $+\infty$. Le passage à la limite dans les inégalités donne alors $\mathrm{e}^{x}\leqslant\dfrac{2+x}{2-x}$ sur $[0\,;2[$. Cette fraction rationnelle est une approximation remarquable de l'exponentielle près de $0$ : pour $x=0{,}1$, elle vaut $1{,}105\,26$, alors que $\mathrm{e}^{0{,}1}\approx 1{,}105\,17$.
- id: "t-05-40"
  feuille: "f-t-05"
  numero: 40
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [exponentielle, inégalité]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), théorème 7 (§ 7.3) et n° 216"
  page_enonce: 15
  page_corrige: 27
  enonce: |
    *L'inégalité arithmético-géométrique.*

    **1.** Soient $n\geqslant 1$ un entier et $x_1$, $x_2$, …, $x_n$ des réels strictement positifs. Montrer que 
    $$\left(x_1x_2\cdots x_n\right)^{\frac{1}{n}}\leqslant\frac{x_1+x_2+\dots+x_n}{n}$$
     et qu'il y a égalité si et seulement si les $x_i$ sont tous égaux. On pourra utiliser l'inégalité $t\leqslant\mathrm{e}^{\,t-1}$, valable pour tout réel $t$.

    **2.** *Application.* Les arêtes d'un parallélépipède rectangle ont pour longueurs $a$, $b$, $c$. On note $V$ son volume et $S$ son aire totale, c'est-à-dire la somme des aires de ses six faces.

    **(a)** Calculer $V$ et $S$ en fonction de $a$, $b$, $c$.

    **(b)** Montrer que $\dfrac{ab+bc+ca}{3}\geqslant V^{\frac{2}{3}}$. À quelle condition y a-t-il égalité ?

    **(c)** Quel est le volume maximal d'un parallélépipède rectangle d'aire totale $S$ donnée ? Pour quels parallélépipèdes est-il atteint ?
  corrige: |
    **1.** *L'inégalité utilisée.* Le cours donne $\mathrm{e}^{u}\geqslant 1+u$ pour tout réel $u$, avec égalité seulement pour $u=0$ : la fonction $u\mapsto\mathrm{e}^{u}-u$, étudiée à la question c) de l'exercice 5, admet en $0$ un minimum strict égal à $1$. Avec $u=t-1$, on obtient $t\leqslant\mathrm{e}^{\,t-1}$, avec égalité si et seulement si $t=1$.

    *La démonstration.* Notons $S=x_1+\dots+x_n$, $P=x_1x_2\cdots x_n$ et $m=\dfrac{S}{n}>0$. Pour chaque $i$, l'inégalité précédente appliquée à $t=\dfrac{x_i}{m}$ donne 
    $$0<\frac{x_i}{m}\leqslant\mathrm{e}^{\frac{x_i}{m}-1}$$
     On peut multiplier membre à membre ces $n$ inégalités entre nombres strictement positifs : 
    $$\frac{P}{m^{n}}\leqslant\mathrm{e}^{\left(\frac{x_1}{m}-1\right)+\dots+\left(\frac{x_n}{m}-1\right)} =\mathrm{e}^{\frac{S}{m}-n}=\mathrm{e}^{0}=1$$
     Donc $P\leqslant m^{n}$. La fonction $x\mapsto x^{\frac{1}{n}}$ étant croissante sur $]0\,;+\infty[$ (exercice 31, avec un exposant positif), et $\left(m^{n}\right)^{\frac{1}{n}}=m$ (exercice 31, question 6) : 
    $$\boxed{\left(x_1x_2\cdots x_n\right)^{\frac{1}{n}}\leqslant\frac{x_1+x_2+\dots+x_n}{n}}$$

    *Le cas d'égalité.* Si les $x_i$ sont tous égaux à un même réel $a$, les deux membres valent $a$. Réciproquement, si l'un des $x_i$ est différent de $m$, l'inégalité correspondante est stricte, et le produit d'inégalités entre nombres strictement positifs dont l'une est stricte est strict : on obtient $P<m^{n}$, et l'inégalité est stricte. Il y a donc égalité si et seulement si tous les $x_i$ valent $m$, c'est-à-dire sont tous égaux.

    *Remarque.* Le nom vient de ce que $\frac{x_1+\dots+x_n}{n}$ est la moyenne *arithmétique* des $x_i$, et $\left(x_1\cdots x_n\right)^{1/n}$ leur moyenne *géométrique*. Le cas $n=2$ s'écrit $\sqrt{ab}\leqslant\frac{a+b}{2}$ et se démontre en développant $\left(\sqrt{a}-\sqrt{b}\right)^{2}\geqslant 0$ ; pour $n$ quelconque, c'est l'exponentielle qui fournit l'argument.

    **2.** **(a)** Le volume vaut $\boxed{V=abc}$. Les six faces sont deux à deux identiques, d'aires $ab$, $bc$ et $ca$ : 
    $$\boxed{S=2(ab+bc+ca)}$$

    **(b)** On applique la question 1 avec $n=3$ aux nombres $ab$, $bc$ et $ca$, dont le produit vaut $(abc)^{2}=V^{2}$ : 
    $$\frac{ab+bc+ca}{3}\geqslant\left(V^{2}\right)^{\frac{1}{3}}=V^{\frac{2}{3}}$$
     Il y a égalité si et seulement si $ab=bc=ca$. Comme $a$, $b$, $c$ sont non nuls, $ab=bc$ donne $a=c$, et $bc=ca$ donne $b=a$. 
    $$\boxed{\text{Égalité si et seulement si } a=b=c \text{ : le parallélépipède est un cube.}}$$

    **(c)** D'après b), $\dfrac{S}{6}\geqslant V^{\frac{2}{3}}$, donc, en élevant à la puissance $\frac{3}{2}$ (fonction croissante), $V\leqslant\left(\dfrac{S}{6}\right)^{\frac{3}{2}}$. Cette valeur est atteinte par le cube d'arête $\sqrt{\frac{S}{6}}$, dont l'aire totale est bien $6\times\frac{S}{6}=S$, et par lui seul d'après le cas d'égalité. 
    $$\boxed{V_{\max}=\left(\frac{S}{6}\right)^{\frac{3}{2}}, \text{ atteint uniquement pour le cube.}}$$
     *Vérification :* pour $S=24$, le cube d'arête $2$ a pour volume $8=4^{3/2}$, tandis que le parallélépipède de dimensions $1$, $2$ et $\frac{10}{3}$, de même aire $2\left(2+\frac{20}{3}+\frac{10}{3}\right)=24$, n'a pour volume que $\frac{20}{3}\approx 6{,}67$.

