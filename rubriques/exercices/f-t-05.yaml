- id: "t-05-01"
  feuille: "f-t-05"
  numero: 1
  partie: "Exponentielle : calculs, équations et dérivées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, propriétés algébriques]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Simplifier au maximum chacune des expressions suivantes, où $x$ désigne un réel quelconque.

    **a)** $\mathrm{e}^{3}\times\mathrm{e}^{-5}$

    **b)** $\mathrm{e}^{2x}\times\mathrm{e}^{x+1}$

    **c)** $\dfrac{\mathrm{e}^{5x}}{\mathrm{e}^{2x}}$

    **d)** $\left(\mathrm{e}^{-x}\right)^{3}$

    **e)** $\mathrm{e}^{x}\times\mathrm{e}^{-x}$

    **f)** $\dfrac{\mathrm{e}^{2x+1}}{\mathrm{e}^{x-3}}$

    **g)** $\left(\mathrm{e}^{x}\right)^{2}\times\mathrm{e}^{-3x}$

    **h)** $\left(1+\mathrm{e}^{-x}\right)\mathrm{e}^{x}$

    **i)** $\mathrm{e}^{2x}-\mathrm{e}^{x}$ *(on factorisera)*

    **j)** $\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2}-\left(\mathrm{e}^{x}-\mathrm{e}^{-x}\right)^{2}$
  corrige: |
    *On applique les propriétés algébriques : $\mathrm{e}^{a}\mathrm{e}^{b}=\mathrm{e}^{a+b}$, $\dfrac{\mathrm{e}^{a}}{\mathrm{e}^{b}}=\mathrm{e}^{a-b}$ et $\left(\mathrm{e}^{a}\right)^{n}=\mathrm{e}^{na}$.*

    **a)** $\mathrm{e}^{3-5}=\boxed{\mathrm{e}^{-2}}$

    **b)** $\mathrm{e}^{2x+x+1}=\boxed{\mathrm{e}^{3x+1}}$

    **c)** $\mathrm{e}^{5x-2x}=\boxed{\mathrm{e}^{3x}}$

    **d)** $\mathrm{e}^{-3x}=\boxed{\mathrm{e}^{-3x}}$

    **e)** $\mathrm{e}^{x-x}=\mathrm{e}^{0}=\boxed{1}$

    **f)** $\mathrm{e}^{(2x+1)-(x-3)}=\boxed{\mathrm{e}^{x+4}}$

    **g)** $\mathrm{e}^{2x-3x}=\boxed{\mathrm{e}^{-x}}$

    **h)** $\mathrm{e}^{x}+\mathrm{e}^{-x}\mathrm{e}^{x}=\boxed{\mathrm{e}^{x}+1}$

    **i)** $\boxed{\mathrm{e}^{x}\left(\mathrm{e}^{x}-1\right)}$

    **j)** voir ci-dessous : $\boxed{4}$

    **Détail de la question j).** On reconnaît l'identité $(a+b)^{2}-(a-b)^{2}=4ab$ avec $a=\mathrm{e}^{x}$ et $b=\mathrm{e}^{-x}$ : 
    $$\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2}-\left(\mathrm{e}^{x}-\mathrm{e}^{-x}\right)^{2} =4\times\mathrm{e}^{x}\times\mathrm{e}^{-x}=4\,\mathrm{e}^{0}=4$$
     *Le résultat ne dépend pas de $x$*, ce qui n'était pas évident au départ.
- id: "t-05-02"
  feuille: "f-t-05"
  numero: 2
  partie: "Exponentielle : calculs, équations et dérivées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, équation]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **a)** $\mathrm{e}^{x}=\mathrm{e}^{3}$

    **b)** $\mathrm{e}^{2x}=\mathrm{e}^{x+3}$

    **c)** $\mathrm{e}^{3x+1}=1$

    **d)** $\mathrm{e}^{x^{2}-2}=\mathrm{e}^{-x}$

    **e)** $\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{x+6}$

    **f)** $\mathrm{e}^{x^{2}-3x}=1$

    *On utilisera la stricte croissance de l'exponentielle : $\mathrm{e}^{a}=\mathrm{e}^{b}$ équivaut à $a=b$.*
  corrige: |
    *La fonction exponentielle étant strictement croissante sur $\mathbb{R}$, elle est en particulier injective : $\mathrm{e}^{a}=\mathrm{e}^{b}$ équivaut à $a=b$.*

    **a)** $x=\boxed{3}$

    **b)** $2x=x+3$, donc $\boxed{x=3}$

    **c)** $\mathrm{e}^{3x+1}=\mathrm{e}^{0}$ donne $3x+1=0$, donc $\boxed{x=-\dfrac{1}{3}}$

    **d)** $x^{2}-2=-x \iff x^{2}+x-2=0$. Le discriminant vaut $\Delta=1+8=9$, d'où $\boxed{x=1 \text{ ou } x=-2}$

    **e)** $\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{2x}$, donc $2x=x+6$ et $\boxed{x=6}$

    **f)** $x^{2}-3x=0 \iff x(x-3)=0$, donc $\boxed{x=0 \text{ ou } x=3}$
- id: "t-05-03"
  feuille: "f-t-05"
  numero: 3
  partie: "Exponentielle : calculs, équations et dérivées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, équation, inéquation]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Résoudre dans $\mathbb{R}$ les inéquations suivantes.

    **a)** $\mathrm{e}^{x}>\mathrm{e}^{2}$

    **b)** $\mathrm{e}^{2x-1}\leqslant\mathrm{e}^{x+3}$

    **c)** $\mathrm{e}^{x^{2}}<\mathrm{e}^{3x}$

    **d)** $\mathrm{e}^{x}\geqslant 1$

    **e)** $\mathrm{e}^{-x}<\mathrm{e}^{2x+9}$

    **f)** $\left(\mathrm{e}^{x}-1\right)\left(\mathrm{e}^{x}-\mathrm{e}\right)\leqslant 0$
  corrige: |
    *La stricte croissance permet cette fois de conserver le sens de l'inégalité : $\mathrm{e}^{a}<\mathrm{e}^{b}$ équivaut à $a<b$.*

    **a)** $\boxed{S=\,]2\,;+\infty[}$

    **b)** $2x-1\leqslant x+3$, donc $\boxed{S=\,]-\infty\,;4]}$

    **c)** $x^{2}<3x \iff x(x-3)<0$, ce qui a lieu entre les racines : $\boxed{S=\,]0\,;3[}$

    **d)** $\mathrm{e}^{x}\geqslant\mathrm{e}^{0}$, donc $\boxed{S=[0\,;+\infty[}$

    **e)** $-x<2x+9 \iff -9<3x$, donc $\boxed{S=\,]-3\,;+\infty[}$

    **f)** Le produit est négatif ou nul lorsque les deux facteurs sont de signes contraires. Or $\mathrm{e}^{x}-1\geqslant 0$ pour $x\geqslant 0$ et $\mathrm{e}^{x}-\mathrm{e}\geqslant 0$ pour $x\geqslant 1$ : 
    $$\boxed{S=[0\,;1]}$$
- id: "t-05-04"
  feuille: "f-t-05"
  numero: 4
  partie: "Exponentielle : calculs, équations et dérivées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, dérivée]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer la fonction dérivée de chacune des fonctions suivantes, définies sur l'ensemble indiqué.

    **a)** $f(x)=\mathrm{e}^{3x}$ sur $\mathbb{R}$

    **b)** $f(x)=\mathrm{e}^{-2x+1}$ sur $\mathbb{R}$

    **c)** $f(x)=\mathrm{e}^{x^{2}}$ sur $\mathbb{R}$

    **d)** $f(x)=x\,\mathrm{e}^{x}$ sur $\mathbb{R}$

    **e)** $f(x)=x^{2}\mathrm{e}^{-x}$ sur $\mathbb{R}$

    **f)** $f(x)=(2x+1)\mathrm{e}^{3x}$ sur $\mathbb{R}$

    **g)** $f(x)=\dfrac{\mathrm{e}^{x}}{x}$ sur $\mathbb{R}^{*}$

    **h)** $f(x)=\mathrm{e}^{\frac{1}{x}}$ sur $\mathbb{R}^{*}$

    **i)** $f(x)=\left(\mathrm{e}^{x}+1\right)^{3}$ sur $\mathbb{R}$

    **j)** $f(x)=\dfrac{\mathrm{e}^{2x}}{x+1}$ sur $\mathbb{R}\setminus\{-1\}$
  corrige: |
    *On applique $\left(\mathrm{e}^{u}\right)'=u'\,\mathrm{e}^{u}$, complétée par les règles du produit et du quotient.*

    **a)** $\boxed{f'(x)=3\,\mathrm{e}^{3x}}$

    **b)** $\boxed{f'(x)=-2\,\mathrm{e}^{-2x+1}}$

    **c)** $\boxed{f'(x)=2x\,\mathrm{e}^{x^{2}}}$

    **d)** $f'(x)=1\times\mathrm{e}^{x}+x\,\mathrm{e}^{x}=\boxed{(x+1)\mathrm{e}^{x}}$

    **e)** $f'(x)=2x\,\mathrm{e}^{-x}-x^{2}\mathrm{e}^{-x}=\boxed{x(2-x)\mathrm{e}^{-x}}$

    **f)** $f'(x)=2\mathrm{e}^{3x}+3(2x+1)\mathrm{e}^{3x}=\boxed{(6x+5)\mathrm{e}^{3x}}$

    **g)** $f'(x)=\dfrac{x\,\mathrm{e}^{x}-\mathrm{e}^{x}}{x^{2}}=\boxed{\dfrac{(x-1)\mathrm{e}^{x}}{x^{2}}}$

    **h)** $u(x)=\dfrac{1}{x}$ donne $u'(x)=-\dfrac{1}{x^{2}}$, d'où $\boxed{f'(x)=-\dfrac{1}{x^{2}}\,\mathrm{e}^{\frac{1}{x}}}$

    **i)** $\boxed{f'(x)=3\,\mathrm{e}^{x}\left(\mathrm{e}^{x}+1\right)^{2}}$

    **j)** $f'(x)=\dfrac{2\mathrm{e}^{2x}(x+1)-\mathrm{e}^{2x}}{(x+1)^{2}} =\boxed{\dfrac{(2x+1)\mathrm{e}^{2x}}{(x+1)^{2}}}$
- id: "t-05-05"
  feuille: "f-t-05"
  numero: 5
  partie: "Exponentielle : calculs, équations et dérivées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle, tableau de variations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Pour chacune des fonctions suivantes, définie sur $\mathbb{R}$ : calculer $f'$, la factoriser, puis dresser le tableau de variations de $f$.

    *On rappelle que $\mathrm{e}^{u}>0$ pour tout réel $u$ : le signe de $f'$ ne dépend donc jamais du facteur exponentiel.*

    **a)** $f(x)=\left(x^{2}-3\right)\mathrm{e}^{x}$

    **b)** $f(x)=(x-2)\mathrm{e}^{-x}$

    **c)** $f(x)=\mathrm{e}^{x}-x$

    **d)** $f(x)=\mathrm{e}^{x^{2}-4x}$
  corrige: |
    **a)** $f'(x)=2x\,\mathrm{e}^{x}+\left(x^{2}-3\right)\mathrm{e}^{x}=\left(x^{2}+2x-3\right)\mathrm{e}^{x} =\boxed{(x+3)(x-1)\mathrm{e}^{x}}$

    Le facteur $\mathrm{e}^{x}$ étant strictement positif, $f'$ a le signe du trinôme, négatif entre ses racines :

    ![Figure](documents/figures/c70716b74893a878.svg)

    **b)** $f'(x)=\mathrm{e}^{-x}-(x-2)\mathrm{e}^{-x}=\boxed{(3-x)\mathrm{e}^{-x}}$, du signe de $3-x$ : $f$ est croissante sur $]-\infty\,;3]$, décroissante sur $[3\,;+\infty[$, avec un maximum $f(3)=\mathrm{e}^{-3}$.

    **c)** $f'(x)=\boxed{\mathrm{e}^{x}-1}$, qui s'annule en $0$ et est du signe de $x$ : $f$ est décroissante sur $]-\infty\,;0]$, croissante sur $[0\,;+\infty[$, avec un minimum $f(0)=1$.

    *On retrouve l'inégalité $\mathrm{e}^{x}\geqslant x+1$ du cours*, puisque $f(x)=\mathrm{e}^{x}-x\geqslant 1$.

    **d)** $f'(x)=(2x-4)\,\mathrm{e}^{x^{2}-4x}=\boxed{2(x-2)\mathrm{e}^{x^{2}-4x}}$, du signe de $x-2$ : $f$ est décroissante sur $]-\infty\,;2]$, croissante sur $[2\,;+\infty[$, avec un minimum $f(2)=\mathrm{e}^{-4}$.
- id: "t-05-06"
  feuille: "f-t-05"
  numero: 6
  partie: "Limites et croissances comparées"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [exponentielle, limite]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer les limites suivantes.

    **a)** $\displaystyle\lim_{x\to+\infty}\mathrm{e}^{2x}$

    **b)** $\displaystyle\lim_{x\to-\infty}\mathrm{e}^{3x+1}$

    **c)** $\displaystyle\lim_{x\to+\infty}\mathrm{e}^{-x}$

    **d)** $\displaystyle\lim_{x\to+\infty}\left(\mathrm{e}^{x}-3\right)$

    **e)** $\displaystyle\lim_{x\to-\infty}\left(2+\mathrm{e}^{x}\right)$

    **f)** $\displaystyle\lim_{x\to+\infty}\mathrm{e}^{-x^{2}}$

    **g)** $\displaystyle\lim_{x\to+\infty}\frac{1}{1+\mathrm{e}^{-x}}$

    **h)** $\displaystyle\lim_{x\to-\infty}\frac{1}{1+\mathrm{e}^{-x}}$

    Pour les questions g) et h), interpréter graphiquement les résultats obtenus.
  corrige: |
    **a)** $\boxed{+\infty}$

    **b)** $\boxed{0}$

    **c)** $\boxed{0}$

    **d)** $\boxed{+\infty}$

    **e)** $\boxed{2}$

    **f)** $\boxed{0}$

    **g)** $\boxed{1}$

    **h)** $\boxed{0}$

    **Détails.** Pour f), $-x^{2}\to-\infty$ donc $\mathrm{e}^{-x^{2}}\to 0$. Pour g), $\mathrm{e}^{-x}\to 0$ quand $x\to+\infty$, donc le dénominateur tend vers $1$. Pour h), $\mathrm{e}^{-x}\to+\infty$ quand $x\to-\infty$, donc le dénominateur tend vers $+\infty$ et le quotient vers $0$.

    **Interprétation graphique.** La fonction $x\mapsto\dfrac{1}{1+\mathrm{e}^{-x}}$ admet donc deux asymptotes horizontales : 
    $$\boxed{\text{la droite } y=1 \text{ en } +\infty \quad\text{et}\quad \text{la droite } y=0 \text{ en } -\infty.}$$
     *Cette fonction, appelée fonction logistique, sert de modèle à de nombreux phénomènes de saturation.*
- id: "t-05-07"
  feuille: "f-t-05"
  numero: 7
  partie: "Limites et croissances comparées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle, limite, croissances comparées, forme indéterminée]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer les limites suivantes, en précisant à chaque fois la forme indéterminée rencontrée et le théorème de croissances comparées utilisé.

    **a)** $\displaystyle\lim_{x\to+\infty}\frac{\mathrm{e}^{x}}{x^{3}}$

    **b)** $\displaystyle\lim_{x\to+\infty}x^{2}\mathrm{e}^{-x}$

    **c)** $\displaystyle\lim_{x\to-\infty}x^{3}\mathrm{e}^{x}$

    **d)** $\displaystyle\lim_{x\to+\infty}\frac{x^{2}+1}{\mathrm{e}^{x}}$

    **e)** $\displaystyle\lim_{x\to+\infty}\left(\mathrm{e}^{x}-x^{5}\right)$

    **f)** $\displaystyle\lim_{x\to-\infty}\left(x\,\mathrm{e}^{x}-3\right)$

    **g)** $\displaystyle\lim_{x\to 0}\frac{\mathrm{e}^{2x}-1}{x}$

    **h)** $\displaystyle\lim_{x\to 0}\frac{\mathrm{e}^{x}-1}{3x}$
  corrige: |
    **a)** Forme indéterminée $\frac{\infty}{\infty}$, levée par le théorème 1 avec $n=3$ : $\boxed{+\infty}$

    **b)** $x^{2}\mathrm{e}^{-x}=\dfrac{x^{2}}{\mathrm{e}^{x}}$, inverse du précédent : $\boxed{0}$

    **c)** Forme indéterminée $0\times\infty$, levée par le théorème 1 avec $n=3$ : $\boxed{0}$

    **d)** $\dfrac{x^{2}+1}{\mathrm{e}^{x}}=\dfrac{x^{2}}{\mathrm{e}^{x}}+\dfrac{1}{\mathrm{e}^{x}}$, somme de deux termes tendant vers $0$ : $\boxed{0}$

    **e)** Forme indéterminée $\infty-\infty$. On factorise par $\mathrm{e}^{x}$ : 
    $$\mathrm{e}^{x}-x^{5}=\mathrm{e}^{x}\left(1-\frac{x^{5}}{\mathrm{e}^{x}}\right)$$
     Or $\dfrac{x^{5}}{\mathrm{e}^{x}}\to 0$, donc la parenthèse tend vers $1$ et le produit vers $\boxed{+\infty}$.

    **f)** $x\,\mathrm{e}^{x}\to 0$ par croissances comparées, donc $\boxed{-3}$

    **g)** On pose $X=2x$, qui tend vers $0$ : 
    $$\frac{\mathrm{e}^{2x}-1}{x}=2\times\frac{\mathrm{e}^{X}-1}{X}\longrightarrow 2\times 1=\boxed{2}$$

    **h)** $\dfrac{\mathrm{e}^{x}-1}{3x}=\dfrac{1}{3}\times\dfrac{\mathrm{e}^{x}-1}{x}\longrightarrow \boxed{\dfrac{1}{3}}$
- id: "t-05-08"
  feuille: "f-t-05"
  numero: 8
  partie: "Limites et croissances comparées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle, limite, forme indéterminée]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Méthode : lorsqu'un quotient présente une forme indéterminée, on factorise numérateur et dénominateur par le terme dominant — ici presque toujours $\mathrm{e}^{x}$.*

    Déterminer les limites suivantes.

    **1.** $\displaystyle\lim_{x\to+\infty}\frac{\mathrm{e}^{x}+x^{2}}{\mathrm{e}^{x}-x}$

    **2.** $\displaystyle\lim_{x\to+\infty}\frac{2\mathrm{e}^{x}-x}{3\mathrm{e}^{x}+1}$

    **3.** $\displaystyle\lim_{x\to+\infty}\frac{\mathrm{e}^{2x}}{\mathrm{e}^{x}+1}$

    **4.** $\displaystyle\lim_{x\to+\infty}\left(x-\mathrm{e}^{x}\right)$

    **5.** $\displaystyle\lim_{x\to-\infty}\frac{\mathrm{e}^{x}+1}{\mathrm{e}^{x}-2}$
  corrige: |
    **1.** On factorise haut et bas par $\mathrm{e}^{x}$ : 
    $$\frac{\mathrm{e}^{x}+x^{2}}{\mathrm{e}^{x}-x} =\frac{\mathrm{e}^{x}\left(1+\frac{x^{2}}{\mathrm{e}^{x}}\right)}{\mathrm{e}^{x}\left(1-\frac{x}{\mathrm{e}^{x}}\right)} =\frac{1+\frac{x^{2}}{\mathrm{e}^{x}}}{1-\frac{x}{\mathrm{e}^{x}}}\longrightarrow\frac{1+0}{1-0}=\boxed{1}$$

    **2.** De même : 
    $$\frac{2\mathrm{e}^{x}-x}{3\mathrm{e}^{x}+1}=\frac{2-\frac{x}{\mathrm{e}^{x}}}{3+\frac{1}{\mathrm{e}^{x}}} \longrightarrow\frac{2}{3}=\boxed{\dfrac{2}{3}}$$

    **3.** $\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{x}+1}=\dfrac{\mathrm{e}^{x}\times\mathrm{e}^{x}}{\mathrm{e}^{x}\left(1+\mathrm{e}^{-x}\right)} =\dfrac{\mathrm{e}^{x}}{1+\mathrm{e}^{-x}}$. Le numérateur tend vers $+\infty$ et le dénominateur vers $1$ : $\boxed{+\infty}$

    **4.** $x-\mathrm{e}^{x}=\mathrm{e}^{x}\left(\dfrac{x}{\mathrm{e}^{x}}-1\right)$. La parenthèse tend vers $-1$ et $\mathrm{e}^{x}$ vers $+\infty$ : $\boxed{-\infty}$

    **5.** Ici $\mathrm{e}^{x}\to 0$ quand $x\to-\infty$, il n'y a donc aucune indétermination : 
    $$\frac{\mathrm{e}^{x}+1}{\mathrm{e}^{x}-2}\longrightarrow\frac{0+1}{0-2}=\boxed{-\dfrac{1}{2}}$$
- id: "t-05-09"
  feuille: "f-t-05"
  numero: 9
  partie: "Limites et croissances comparées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle, équation, dérivée, tableau de variations, limite, tangente]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    On considère la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=(x+1)\mathrm{e}^{-x}$, et l'on note $\mathcal{C}$ sa courbe représentative.

    **1.** Déterminer $\displaystyle\lim_{x\to-\infty}f(x)$.

    **2.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$. Quelle conséquence graphique en tire-t-on ?

    **3.** Calculer $f'(x)$ et montrer que $f'(x)=-x\,\mathrm{e}^{-x}$.

    **4.** Étudier le signe de $f'$ et dresser le tableau de variations de $f$.

    **5.** Déterminer une équation de la tangente à $\mathcal{C}$ au point d'abscisse $0$.

    **6.** Résoudre l'équation $f(x)=0$, puis déterminer le signe de $f$ sur $\mathbb{R}$.
  corrige: |
    **1.** Quand $x\to-\infty$ : $x+1\to-\infty$ et $\mathrm{e}^{-x}\to+\infty$, donc par produit 
    $$\boxed{\lim_{x\to-\infty}f(x)=-\infty}$$

    **2.** On écrit $f(x)=x\,\mathrm{e}^{-x}+\mathrm{e}^{-x}=\dfrac{x}{\mathrm{e}^{x}}+\mathrm{e}^{-x}$. Par croissances comparées, le premier terme tend vers $0$, et le second aussi : 
    $$\boxed{\lim_{x\to+\infty}f(x)=0}$$

    $$\boxed{\text{La droite d'équation } y=0 \text{ est asymptote horizontale à } \mathcal{C} \text{ en } +\infty.}$$

    **3.** $f'(x)=1\times\mathrm{e}^{-x}+(x+1)\times(-\mathrm{e}^{-x})=\mathrm{e}^{-x}\big(1-(x+1)\big) =\boxed{-x\,\mathrm{e}^{-x}}$

    **4.** Le facteur $\mathrm{e}^{-x}$ étant strictement positif, $f'$ a le signe de $-x$ :

    ![Figure](documents/figures/ce8ea5dd12a58005.svg)

    **5.** $f(0)=1$ et $f'(0)=0$, donc la tangente est horizontale : 
    $$\boxed{y=1}$$

    **6.** $f(x)=0$ équivaut à $(x+1)\mathrm{e}^{-x}=0$. Comme $\mathrm{e}^{-x}\neq 0$, il reste $x+1=0$, soit $\boxed{x=-1}$. Le signe de $f$ est alors celui de $x+1$ : 
    $$\boxed{f(x)<0 \text{ sur } ]-\infty\,;-1[ \quad\text{et}\quad f(x)>0 \text{ sur } ]-1\,;+\infty[.}$$
- id: "t-05-10"
  feuille: "f-t-05"
  numero: 10
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, logarithme, propriétés algébriques]
  noeuds: [cx-exponentielle, nb-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Simplifier au maximum chacune des expressions suivantes.

    **a)** $\ln(12)-\ln(3)$

    **b)** $\ln(2)+\ln(50)$

    **c)** $\ln\left(\mathrm{e}^{3}\right)$

    **d)** $\mathrm{e}^{\ln(5)}$

    **e)** $\ln\left(\dfrac{1}{\mathrm{e}}\right)$

    **f)** $2\ln(3)+\ln(5)-\ln(45)$

    **g)** $\ln\left(\sqrt{\mathrm{e}}\right)$

    **h)** $\ln\left(\mathrm{e}^{2x}\right)$

    **i)** $\ln(16)-4\ln(2)$

    **j)** $\ln\left(a^{2}b\right)-2\ln(a)-\ln(b)$ *(avec $a>0$ et $b>0$)*
  corrige: |
    **a)** $\ln\left(\dfrac{12}{3}\right)=\boxed{\ln(4)}$

    **b)** $\ln(2\times 50)=\ln(100)=\boxed{2\ln(10)}$

    **c)** $\boxed{3}$

    **d)** $\boxed{5}$

    **e)** $-\ln(\mathrm{e})=\boxed{-1}$

    **f)** $\ln(9)+\ln(5)-\ln(45)=\ln\left(\dfrac{45}{45}\right)=\boxed{0}$

    **g)** $\dfrac{1}{2}\ln(\mathrm{e})=\boxed{\dfrac{1}{2}}$

    **h)** $\boxed{2x}$

    **i)** $4\ln(2)-4\ln(2)=\boxed{0}$

    **j)** $2\ln(a)+\ln(b)-2\ln(a)-\ln(b)=\boxed{0}$

    *Attention :* la propriété $\ln\left(a^{n}\right)=n\ln(a)$ n'a de sens que pour $a>0$. C'est pourquoi l'énoncé de la question j) précise $a>0$ et $b>0$.
- id: "t-05-11"
  feuille: "f-t-05"
  numero: 11
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [logarithme, équation, ensemble de définition]
  noeuds: [nb-logarithme]
  notions: [logarithme]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes. *On commencera systématiquement par déterminer la condition d'existence.*

    **a)** $\ln(x)=3$

    **b)** $\ln(2x-1)=0$

    **c)** $\ln(x+2)=\ln(3x-4)$

    **d)** $2\ln(x)=\ln(9)$

    **e)** $\ln(x)+\ln(x+3)=\ln(10)$

    **f)** $\ln(x-1)+\ln(x+1)=\ln(8)$
  corrige: |
    **a)** Condition d'existence : $x>0$. Alors $\boxed{x=\mathrm{e}^{3}}$.

    **b)** C.E. : $x>\dfrac{1}{2}$. On a $\ln(2x-1)=\ln(1)$, donc $2x-1=1$ et $\boxed{x=1}$, qui convient.

    **c)** C.E. : $x>-2$ et $x>\dfrac{4}{3}$, soit $x>\dfrac{4}{3}$. L'équation donne $x+2=3x-4$, soit $\boxed{x=3}$, qui convient.

    **d)** C.E. : $x>0$. Alors $\ln\left(x^{2}\right)=\ln(9)$ donne $x^{2}=9$, d'où $x=3$ ou $x=-3$ ; seule $\boxed{x=3}$ convient.

    **e)** C.E. : $x>0$ et $x>-3$, soit $x>0$. L'équation devient 
    $$\ln\big(x(x+3)\big)=\ln(10) \iff x^{2}+3x-10=0$$
     Le discriminant vaut $\Delta=9+40=49$, d'où $x=2$ ou $x=-5$. Seule $\boxed{x=2}$ convient.

    **f)** C.E. : $x>1$. L'équation devient $\ln\left(x^{2}-1\right)=\ln(8)$, soit $x^{2}=9$, d'où $x=3$ ou $x=-3$ ; seule $\boxed{x=3}$ convient.
- id: "t-05-12"
  feuille: "f-t-05"
  numero: 12
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, logarithme, équation, changement de variable]
  noeuds: [cx-exponentielle, nb-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **1.** $\mathrm{e}^{x}=5$ puis $\mathrm{e}^{2x-1}=7$

    **2.** $\mathrm{e}^{2x}-3\mathrm{e}^{x}+2=0$ *(on posera $X=\mathrm{e}^{x}$)*

    **3.** $\mathrm{e}^{x}+6\,\mathrm{e}^{-x}=5$ *(on multipliera d'abord par $\mathrm{e}^{x}$)*

    **4.** $\mathrm{e}^{2x}-\mathrm{e}^{x}-6=0$

    **5.** $\left(\ln(x)\right)^{2}-3\ln(x)+2=0$ *(on posera $X=\ln(x)$)*
  corrige: |
    **1.** $\mathrm{e}^{x}=5$ donne $\boxed{x=\ln(5)}$. $\mathrm{e}^{2x-1}=7$ donne $2x-1=\ln(7)$, soit $\boxed{x=\dfrac{\ln(7)+1}{2}}$.

    **2.** On pose $X=\mathrm{e}^{x}$, avec $X>0$. L'équation devient $X^{2}-3X+2=0$, de discriminant $\Delta=1$, d'où $X=1$ ou $X=2$. Les deux valeurs étant positives : 
    $$\mathrm{e}^{x}=1 \text{ ou } \mathrm{e}^{x}=2 \qquad\text{soit}\qquad \boxed{x=0 \text{ ou } x=\ln(2)}$$

    **3.** En multipliant par $\mathrm{e}^{x}$, qui est non nul : 
    $$\mathrm{e}^{2x}+6=5\,\mathrm{e}^{x} \iff \mathrm{e}^{2x}-5\mathrm{e}^{x}+6=0$$
     Avec $X=\mathrm{e}^{x}$ : $X^{2}-5X+6=0$ donne $X=2$ ou $X=3$, d'où $\boxed{x=\ln(2) \text{ ou } x=\ln(3)}$.

    **4.** $X^{2}-X-6=0$ donne $X=3$ ou $X=-2$. La valeur $-2$ est à rejeter car $\mathrm{e}^{x}>0$ : 
    $$\boxed{x=\ln(3)}$$

    **5.** C.E. : $x>0$. On pose $X=\ln(x)$ : $X^{2}-3X+2=0$ donne $X=1$ ou $X=2$, d'où 
    $$\boxed{x=\mathrm{e} \text{ ou } x=\mathrm{e}^{2}}$$
- id: "t-05-13"
  feuille: "f-t-05"
  numero: 13
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle, logarithme, équation, ensemble de définition]
  noeuds: [cx-exponentielle, nb-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    *Aucune indication n'est donnée dans cet exercice : c'est à vous de reconnaître, pour chaque équation, la méthode qui convient. On n'oubliera jamais de commencer par la condition d'existence lorsqu'un logarithme apparaît.*

    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **a)** $\mathrm{e}^{3x}=4$

    **b)** $\mathrm{e}^{x+1}=\mathrm{e}^{2-x}$

    **c)** $3\mathrm{e}^{x}-1=0$

    **d)** $\ln(2x+1)=2$

    **e)** $\mathrm{e}^{x^{2}}=\mathrm{e}^{2x+3}$

    **f)** $\mathrm{e}^{2x}=3\mathrm{e}^{x}$

    **g)** $\mathrm{e}^{2x}-5\mathrm{e}^{x}+6=0$

    **h)** $\mathrm{e}^{2x}+\mathrm{e}^{x}-12=0$

    **i)** $\mathrm{e}^{x}-2\mathrm{e}^{-x}=1$

    **j)** $\left(\ln(x)\right)^{2}=4$

    **k)** $\ln(x)+\ln(x-2)=\ln(3)$

    **l)** $2\ln(x)=\ln(x+6)$

    **m)** $\ln\left(x^{2}-3x\right)=\ln(4)$

    **n)** $\left(\mathrm{e}^{x}-2\right)\left(\ln(x)-1\right)=0$

    **o)** $\mathrm{e}^{2x}-4\mathrm{e}^{x}+4=0$
  corrige: |
    **a)** $3x=\ln(4)$, donc $\boxed{x=\dfrac{\ln(4)}{3}}$

    **b)** $x+1=2-x$, donc $\boxed{x=\dfrac{1}{2}}$

    **c)** $\mathrm{e}^{x}=\dfrac{1}{3}$, donc $x=\ln\left(\frac{1}{3}\right)=\boxed{-\ln(3)}$

    **d)** C.E. : $x>-\dfrac{1}{2}$. Alors $2x+1=\mathrm{e}^{2}$, donc $\boxed{x=\dfrac{\mathrm{e}^{2}-1}{2}}$

    **e)** $x^{2}=2x+3 \iff x^{2}-2x-3=0$, de discriminant $16$ : $\boxed{x=3 \text{ ou } x=-1}$

    **f)** Comme $\mathrm{e}^{x}\neq 0$, on divise par $\mathrm{e}^{x}$ : $\mathrm{e}^{x}=3$, donc $\boxed{x=\ln(3)}$

    **g)** Avec $X=\mathrm{e}^{x}$ : $X^{2}-5X+6=0$ donne $X=2$ ou $X=3$, d'où $\boxed{x=\ln(2) \text{ ou } x=\ln(3)}$

    **h)** $X^{2}+X-12=0$ donne $X=3$ ou $X=-4$ ; on rejette $-4$ : $\boxed{x=\ln(3)}$

    **i)** En multipliant par $\mathrm{e}^{x}$ : $\mathrm{e}^{2x}-\mathrm{e}^{x}-2=0$, soit $X^{2}-X-2=0$, d'où $X=2$ ou $X=-1$ ; on rejette $-1$ : $\boxed{x=\ln(2)}$

    **j)** C.E. : $x>0$. Alors $\ln(x)=2$ ou $\ln(x)=-2$ : $\boxed{x=\mathrm{e}^{2} \text{ ou } x=\mathrm{e}^{-2}}$

    **k)** C.E. : $x>0$ et $x>2$, soit $x>2$. L'équation devient $x^{2}-2x=3$, soit $x^{2}-2x-3=0$, d'où $x=3$ ou $x=-1$. Seule $\boxed{x=3}$ convient.

    **l)** C.E. : $x>0$. Alors $\ln\left(x^{2}\right)=\ln(x+6)$ donne $x^{2}-x-6=0$, d'où $x=3$ ou $x=-2$. Seule $\boxed{x=3}$ convient.

    **m)** C.E. : $x^{2}-3x>0$, c'est-à-dire $x<0$ ou $x>3$. L'équation donne $x^{2}-3x-4=0$, d'où $x=4$ ou $x=-1$.

    **Les deux valeurs conviennent**, car $-1<0$ et $4>3$ : 
    $$\boxed{x=-1 \text{ ou } x=4}$$
     *C'est le piège de l'exercice :* on rejette d'ordinaire les valeurs négatives, mais ici c'est $x^{2}-3x$, et non $x$, qui doit être strictement positif.

    **n)** C.E. : $x>0$. Un produit est nul si l'un des facteurs l'est : 
    $$\mathrm{e}^{x}=2 \text{ ou } \ln(x)=1 \qquad\text{soit}\qquad \boxed{x=\ln(2) \text{ ou } x=\mathrm{e}}$$
     Les deux valeurs sont bien strictement positives.

    **o)** On reconnaît une identité remarquable : $\left(\mathrm{e}^{x}-2\right)^{2}=0$, donc $\mathrm{e}^{x}=2$ : 
    $$\boxed{x=\ln(2)}$$
     *La racine est double, mais l'équation n'a qu'une seule solution.*
- id: "t-05-14"
  feuille: "f-t-05"
  numero: 14
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, logarithme, équation, inéquation, inégalité]
  noeuds: [cx-exponentielle, nb-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Résoudre dans $\mathbb{R}$ les inéquations suivantes.

    **a)** $\ln(x)<2$

    **b)** $\ln(3x-1)\geqslant 0$

    **c)** $\mathrm{e}^{x}>4$

    **d)** $\mathrm{e}^{-2x}\leqslant 3$

    **e)** $\ln(x)\geqslant\ln(2x-3)$

    **f)** $\mathrm{e}^{x}<\dfrac{1}{2}$

    *Attention au sens de l'inégalité lorsque l'on divise par un logarithme négatif.*
  corrige: |
    **a)** C.E. : $x>0$. Alors $\ln(x)<\ln\left(\mathrm{e}^{2}\right)$, et par stricte croissance $\boxed{S=\,]0\,;\mathrm{e}^{2}[}$

    **b)** C.E. : $x>\dfrac{1}{3}$. Alors $3x-1\geqslant 1$, soit $x\geqslant\dfrac{2}{3}$ : $\boxed{S=\left[\dfrac{2}{3}\,;+\infty\right[}$

    **c)** $\boxed{S=\,]\ln(4)\,;+\infty[}$

    **d)** $-2x\leqslant\ln(3)$, et en divisant par $-2$ le sens change : $\boxed{S=\left[-\dfrac{\ln(3)}{2}\,;+\infty\right[}$

    **e)** C.E. : $x>0$ et $x>\dfrac{3}{2}$, soit $x>\dfrac{3}{2}$. Alors $x\geqslant 2x-3$, soit $x\leqslant 3$ : $\boxed{S=\left]\dfrac{3}{2}\,;3\right]}$

    **f)** $\boxed{S=\left]-\infty\,;-\ln(2)\right[}$, car $\ln\left(\frac{1}{2}\right)=-\ln(2)$
- id: "t-05-15"
  feuille: "f-t-05"
  numero: 15
  partie: "Logarithme : calculs, équations et inéquations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [seuil, intérêts composés, modélisation]
  noeuds: []
  notions: []
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Déterminer le plus petit entier naturel $n$ tel que $0{,}8^{\,n}\leqslant 0{,}001$.

    **2.** Déterminer le plus petit entier naturel $n$ tel que $1{,}05^{\,n}\geqslant 2$.

    **3.** Un capital de $3\,000$ € est placé au taux annuel de $3\,\%$. Au bout de combien d'années aura-t-il dépassé $5\,000$ € ?

    **4.** Une population de bactéries diminue de $15\,\%$ par heure. Au bout de combien d'heures aura-t-elle été divisée par $100$ ?

    **5.** Un médicament a une demi-vie de $6$ heures : la quantité présente dans l'organisme est multipliée par $0{,}5$ toutes les $6$ heures. Au bout de combien de demi-vies reste-t-il moins de $1\,\%$ de la dose initiale ?
  corrige: |
    *Les deux membres étant strictement positifs, on applique le logarithme. On veillera au signe de $\ln(q)$ lorsque $0<q<1$ : la division change alors le sens de l'inégalité.*

    **1.** $0{,}8^{\,n}\leqslant 0{,}001 \iff n\ln(0{,}8)\leqslant\ln(0{,}001)$. Comme $\ln(0{,}8)<0$ : 
    $$n\geqslant\frac{\ln(0{,}001)}{\ln(0{,}8)}\approx 30{,}96 \qquad\Longrightarrow\qquad \boxed{n=31}$$

    **2.** $1{,}05^{\,n}\geqslant 2 \iff n\ln(1{,}05)\geqslant\ln(2)$. Ici $\ln(1{,}05)>0$ : 
    $$n\geqslant\frac{\ln(2)}{\ln(1{,}05)}\approx 14{,}21 \qquad\Longrightarrow\qquad \boxed{n=15}$$

    **3.** Le capital vaut $3\,000\times 1{,}03^{\,n}$ au bout de $n$ années. On résout : 
    $$3\,000\times 1{,}03^{\,n}>5\,000 \iff 1{,}03^{\,n}>\frac{5}{3} \iff n>\frac{\ln\left(\frac{5}{3}\right)}{\ln(1{,}03)}\approx 17{,}28$$

    $$\boxed{\text{Au bout de } 18 \text{ ans.}}$$

    **4.** La population est multipliée par $0{,}85$ chaque heure. On résout $0{,}85^{\,n}\leqslant 0{,}01$ : 
    $$n\geqslant\frac{\ln(0{,}01)}{\ln(0{,}85)}\approx 28{,}34 \qquad\Longrightarrow\qquad \boxed{n=29 \text{ heures.}}$$

    **5.** On résout $0{,}5^{\,n}\leqslant 0{,}01$ : 
    $$n\geqslant\frac{\ln(0{,}01)}{\ln(0{,}5)}\approx 6{,}64 \qquad\Longrightarrow\qquad \boxed{n=7 \text{ demi-vies, soit } 42 \text{ heures.}}$$
- id: "t-05-16"
  feuille: "f-t-05"
  numero: 16
  partie: "Étude de la fonction logarithme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [logarithme, ensemble de définition]
  noeuds: [nb-logarithme]
  notions: [logarithme]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Déterminer l'ensemble de définition de chacune des fonctions suivantes.

    **a)** $f(x)=\ln(x-3)$

    **b)** $f(x)=\ln(2x+5)$

    **c)** $f(x)=\ln\left(x^{2}-4\right)$

    **d)** $f(x)=\ln\left(-x^{2}+4x\right)$

    **e)** $f(x)=\ln\left(\dfrac{x-1}{x+2}\right)$

    **f)** $f(x)=\dfrac{\ln(x)}{x-1}$
  corrige: |
    **a)** $x-3>0$ : $\boxed{D_{f}=\,]3\,;+\infty[}$

    **b)** $2x+5>0$ : $\boxed{D_{f}=\left]-\dfrac{5}{2}\,;+\infty\right[}$

    **c)** $x^{2}-4>0$, c'est-à-dire $(x-2)(x+2)>0$, vrai à l'extérieur des racines : 
    $$\boxed{D_{f}=\,]-\infty\,;-2[\,\cup\,]2\,;+\infty[}$$

    **d)** $-x^{2}+4x>0$, soit $x(4-x)>0$, vrai entre les racines : $\boxed{D_{f}=\,]0\,;4[}$

    **e)** Le quotient $\dfrac{x-1}{x+2}$ est strictement positif à l'extérieur de $[-2\,;1]$ : 
    $$\boxed{D_{f}=\,]-\infty\,;-2[\,\cup\,]1\,;+\infty[}$$

    **f)** Il faut $x>0$ pour le logarithme et $x\neq 1$ pour le quotient : $\boxed{D_{f}=\,]0\,;1[\,\cup\,]1\,;+\infty[}$
- id: "t-05-17"
  feuille: "f-t-05"
  numero: 17
  partie: "Étude de la fonction logarithme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [logarithme, dérivée]
  noeuds: [nb-logarithme, ar-deriv]
  notions: [logarithme, derivable]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Déterminer la fonction dérivée de chacune des fonctions suivantes, sur l'intervalle où elle est définie.

    **a)** $f(x)=\ln(3x+1)$

    **b)** $f(x)=\ln\left(x^{2}+1\right)$

    **c)** $f(x)=x\ln(x)$

    **d)** $f(x)=\dfrac{\ln(x)}{x}$

    **e)** $f(x)=\left(\ln(x)\right)^{2}$

    **f)** $f(x)=x^{2}\ln(x)$

    **g)** $f(x)=\ln\left(\ln(x)\right)$

    **h)** $f(x)=\ln\left(\dfrac{x+1}{x-1}\right)$
  corrige: |
    *On applique $\left(\ln(u)\right)'=\dfrac{u'}{u}$.*

    **a)** $\boxed{\dfrac{3}{3x+1}}$

    **b)** $\boxed{\dfrac{2x}{x^{2}+1}}$

    **c)** $\boxed{\ln(x)+1}$

    **d)** $\boxed{\dfrac{1-\ln(x)}{x^{2}}}$

    **e)** $\boxed{\dfrac{2\ln(x)}{x}}$

    **f)** $\boxed{x\left(2\ln(x)+1\right)}$

    **g)** $\boxed{\dfrac{1}{x\ln(x)}}$

    **h)** $\boxed{\dfrac{-2}{x^{2}-1}}$

    **Détail de la question h).** Plutôt que de dériver un quotient dans un logarithme, on sépare d'abord : 
    $$\ln\left(\frac{x+1}{x-1}\right)=\ln(x+1)-\ln(x-1) \qquad\text{d'où}\qquad f'(x)=\frac{1}{x+1}-\frac{1}{x-1}=\frac{-2}{x^{2}-1}$$
     *C'est presque toujours plus rapide :* les propriétés algébriques du logarithme simplifient l'expression avant même de dériver.
- id: "t-05-18"
  feuille: "f-t-05"
  numero: 18
  partie: "Étude de la fonction logarithme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [logarithme, limite]
  noeuds: [nb-logarithme]
  notions: [logarithme]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Déterminer les limites suivantes.

    **a)** $\displaystyle\lim_{x\to 0^{+}}\ln(x)$

    **b)** $\displaystyle\lim_{x\to+\infty}\frac{\ln(x)}{x^{2}}$

    **c)** $\displaystyle\lim_{x\to 0^{+}}x^{2}\ln(x)$

    **d)** $\displaystyle\lim_{x\to+\infty}\left(x-\ln(x)\right)$

    **e)** $\displaystyle\lim_{x\to 0^{+}}\frac{\ln(x)}{x}$

    **f)** $\displaystyle\lim_{x\to+\infty}\left(\ln(x+1)-\ln(x)\right)$

    **g)** $\displaystyle\lim_{x\to 0}\frac{\ln(1+3x)}{x}$

    **h)** $\displaystyle\lim_{x\to+\infty}\frac{\ln(x)}{\sqrt{x}}$

    *Pour la question f), on écrira $\ln(x+1)-\ln(x)=\ln\left(1+\frac{1}{x}\right)$.*
  corrige: |
    **a)** $\boxed{-\infty}$ (limite de référence du cours)

    **b)** Croissances comparées : $\dfrac{\ln(x)}{x^{2}}=\dfrac{\ln(x)}{x}\times\dfrac{1}{x} \longrightarrow 0\times 0=\boxed{0}$

    **c)** $x^{2}\ln(x)=x\times\big(x\ln(x)\big)\longrightarrow 0\times 0=\boxed{0}$

    **d)** $x-\ln(x)=x\left(1-\dfrac{\ln(x)}{x}\right)$. La parenthèse tend vers $1$ : $\boxed{+\infty}$

    **e)** Le numérateur tend vers $-\infty$ et le dénominateur vers $0^{+}$ : il n'y a pas d'indétermination, $\boxed{-\infty}$

    **f)** $\ln(x+1)-\ln(x)=\ln\left(\dfrac{x+1}{x}\right)=\ln\left(1+\dfrac{1}{x}\right)$. Comme $1+\frac{1}{x}\to 1$ et $\ln(1)=0$ : $\boxed{0}$

    **g)** On pose $X=3x$, qui tend vers $0$ : $\dfrac{\ln(1+3x)}{x}=3\times\dfrac{\ln(1+X)}{X}\longrightarrow\boxed{3}$

    **h)** On pose $X=\sqrt{x}$, qui tend vers $+\infty$. Alors $x=X^{2}$ et $\ln(x)=2\ln(X)$, d'où 
    $$\frac{\ln(x)}{\sqrt{x}}=\frac{2\ln(X)}{X}\longrightarrow 2\times 0=\boxed{0}$$
     *Le logarithme est donc négligeable même devant $\sqrt{x}$*, conformément à la hiérarchie $\ln(x)\ll x^{n}\ll\mathrm{e}^{x}$ du cours.
- id: "t-05-19"
  feuille: "f-t-05"
  numero: 19
  partie: "Étude de la fonction logarithme"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [logarithme, dérivée, tableau de variations, limite, inégalité]
  noeuds: [nb-logarithme, ar-deriv]
  notions: [logarithme, derivable]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On considère la fonction $f$ définie sur $]0\,;+\infty[$ par $f(x)=x-\ln(x)$.

    **1.** Déterminer $\displaystyle\lim_{x\to 0^{+}}f(x)$.

    **2.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$. *On factorisera par $x$.*

    **3.** Calculer $f'(x)$ et montrer que $f'(x)=\dfrac{x-1}{x}$.

    **4.** Dresser le tableau de variations de $f$.

    **5.** En déduire que pour tout réel $x>0$, on a $\ln(x)\leqslant x-1$.

    **6.** Interpréter graphiquement cette inégalité.
  corrige: |
    **1.** Quand $x\to 0^{+}$ : $x\to 0$ et $-\ln(x)\to+\infty$, donc $\boxed{\lim_{x\to 0^{+}}f(x)=+\infty}$

    **2.** $f(x)=x\left(1-\dfrac{\ln(x)}{x}\right)$. Par croissances comparées, la parenthèse tend vers $1$, donc 
    $$\boxed{\lim_{x\to+\infty}f(x)=+\infty}$$

    **3.** $f'(x)=1-\dfrac{1}{x}=\boxed{\dfrac{x-1}{x}}$

    **4.** Sur $]0\,;+\infty[$, le dénominateur est positif : $f'$ a le signe de $x-1$.

    ![Figure](documents/figures/7f335347aa43ceda.svg)

    **5.** Le minimum de $f$ vaut $f(1)=1$, donc pour tout $x>0$ : $x-\ln(x)\geqslant 1$, soit 
    $$\boxed{\ln(x)\leqslant x-1}$$

    **6.** 
    $$\boxed{\text{La courbe du logarithme reste toujours en dessous de la droite d'équation } y=x-1.}$$
     Cette droite est d'ailleurs la tangente à la courbe de $\ln$ au point d'abscisse $1$, puisque $\ln(1)=0$ et $\ln'(1)=1$.
- id: "t-05-20"
  feuille: "f-t-05"
  numero: 20
  partie: "Étude de la fonction logarithme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [logarithme, équation, ensemble de définition, dérivée, tableau de variations, asymptote, théorème des valeurs intermédiaires]
  noeuds: [nb-logarithme, ar-deriv, c-tvi]
  notions: [logarithme, derivable]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On considère la fonction $g$ définie sur $]0\,;+\infty[$ par $g(x)=\dfrac{\ln(x)}{x}$, et l'on note $\mathcal{C}$ sa courbe représentative.

    **1.** Déterminer les limites de $g$ aux bornes de son ensemble de définition, et en déduire les asymptotes éventuelles.

    **2.** Calculer $g'(x)$ et montrer que $g'(x)=\dfrac{1-\ln(x)}{x^{2}}$.

    **3.** Étudier le signe de $g'$ et dresser le tableau de variations de $g$.

    **4.** En déduire que pour tout $x>0$, $\dfrac{\ln(x)}{x}\leqslant\dfrac{1}{\mathrm{e}}$.

    **5.** Résoudre l'équation $g(x)=0$, puis déterminer le signe de $g$.

    **6.** Déterminer, en justifiant, le nombre de solutions de l'équation $g(x)=0{,}2$.
  corrige: |
    **1.** Quand $x\to 0^{+}$ : $\ln(x)\to-\infty$ et $\dfrac{1}{x}\to+\infty$, donc 
    $$\lim_{x\to 0^{+}}g(x)=-\infty \qquad\text{et}\qquad \lim_{x\to+\infty}g(x)=0$$
     par croissances comparées. 
    $$\boxed{\text{Asymptote verticale } x=0 \text{ et asymptote horizontale } y=0 \text{ en } +\infty.}$$

    **2.** $g'(x)=\dfrac{\frac{1}{x}\times x-\ln(x)}{x^{2}}=\boxed{\dfrac{1-\ln(x)}{x^{2}}}$

    **3.** Le dénominateur est positif : $g'$ a le signe de $1-\ln(x)$, positif pour $\ln(x)<1$, c'est-à-dire $x<\mathrm{e}$.

    ![Figure](documents/figures/1e10ef10f053b323.svg)

    **4.** Le maximum de $g$ est atteint en $\mathrm{e}$ et vaut $g(\mathrm{e})=\dfrac{\ln(\mathrm{e})}{\mathrm{e}}=\dfrac{1}{\mathrm{e}}$ : 
    $$\boxed{\text{pour tout } x>0,\ \frac{\ln(x)}{x}\leqslant\frac{1}{\mathrm{e}}.}$$

    **5.** $g(x)=0$ équivaut à $\ln(x)=0$, soit $\boxed{x=1}$. Le signe de $g$ est celui de $\ln(x)$ : 
    $$\boxed{g<0 \text{ sur } ]0\,;1[ \quad\text{et}\quad g>0 \text{ sur } ]1\,;+\infty[.}$$

    **6.** Comme $\dfrac{1}{\mathrm{e}}\approx 0{,}368>0{,}2$, la valeur $0{,}2$ est bien atteinte. Sur $]0\,;\mathrm{e}]$, $g$ est continue et strictement croissante de $-\infty$ à $\frac{1}{\mathrm{e}}$ : d'après le théorème de la bijection, l'équation admet une unique solution. Sur $[\mathrm{e}\,;+\infty[$, $g$ est continue et strictement décroissante de $\frac{1}{\mathrm{e}}$ à $0$, et $0<0{,}2<\frac{1}{\mathrm{e}}$ : une seconde solution. 
    $$\boxed{\text{L'équation } g(x)=0{,}2 \text{ admet exactement deux solutions.}}$$
     *Valeurs approchées :* $x_{1}\approx 1{,}30$ et $x_{2}\approx 12{,}71$.
- id: "t-05-21"
  feuille: "f-t-05"
  numero: 21
  partie: "Autres exponentielles et logarithmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle, équation, inéquation, dérivée, tableau de variations, logarithme décimal, fonction puissance]
  noeuds: [cx-exponentielle, ar-deriv, nb-logarithme]
  notions: [exponentielle, derivable]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** Écrire sous la forme $\mathrm{e}^{k x}$ les expressions $2^{x}$, $3^{2x}$ et $0{,}5^{x}$.

    **2.** Calculer, sans calculatrice, $\log(1000)$, $\log(0{,}01)$, $\log\left(10^{-5}\right)$ et $\log(1)$.

    **3.** Déterminer la fonction dérivée de $x\mapsto 2^{x}$, puis celle de $x\mapsto 3^{-x}$. Préciser à chaque fois le sens de variation.

    **4.** Résoudre l'équation $2^{x}=5$, puis l'inéquation $0{,}5^{x}\leqslant 0{,}1$.
  corrige: |
    **1.** Par définition, $a^{x}=\mathrm{e}^{x\ln(a)}$ : 
    $$2^{x}=\boxed{\mathrm{e}^{x\ln(2)}} \qquad 3^{2x}=\boxed{\mathrm{e}^{2x\ln(3)}} \qquad 0{,}5^{x}=\boxed{\mathrm{e}^{x\ln(0{,}5)}=\mathrm{e}^{-x\ln(2)}}$$

    **2.** $\log(1000)=\log\left(10^{3}\right)=\boxed{3}$ $\log(0{,}01)=\log\left(10^{-2}\right)=\boxed{-2}$

    $\log\left(10^{-5}\right)=\boxed{-5}$ $\log(1)=\log\left(10^{0}\right)=\boxed{0}$

    **3.** $\left(2^{x}\right)'=\boxed{\ln(2)\,2^{x}}$. Comme $\ln(2)>0$, la fonction est **strictement croissante**.

    $3^{-x}=\mathrm{e}^{-x\ln(3)}$, donc $\left(3^{-x}\right)'=\boxed{-\ln(3)\,3^{-x}}$, négatif : la fonction est **strictement décroissante**.

    **4.** $2^{x}=5 \iff x\ln(2)=\ln(5) \iff \boxed{x=\dfrac{\ln(5)}{\ln(2)}\approx 2{,}32}$

    $0{,}5^{x}\leqslant 0{,}1 \iff x\ln(0{,}5)\leqslant\ln(0{,}1)$. Comme $\ln(0{,}5)<0$, le sens change : 
    $$x\geqslant\frac{\ln(0{,}1)}{\ln(0{,}5)}\approx 3{,}32 \qquad\text{soit}\qquad \boxed{S=\left[\dfrac{\ln(0{,}1)}{\ln(0{,}5)}\,;+\infty\right[}$$
- id: "t-05-22"
  feuille: "f-t-05"
  numero: 22
  partie: "Autres exponentielles et logarithmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [logarithme décimal]
  noeuds: []
  notions: []
  page_enonce: 6
  page_corrige: 11
  enonce: |
    *Les échelles logarithmiques sont partout en sciences : cet exercice en présente trois.*

    **1.** **Chimie.** Le pH d'une solution vaut $-\log\left(\left[\mathrm{H}^{+}\right]\right)$, où la concentration s'exprime en $\mathrm{mol}\cdot\mathrm{L}^{-1}$.

    **(a)** Calculer le pH d'une solution de concentration $2{,}5\times 10^{-4}$ $\mathrm{mol}\cdot\mathrm{L}^{-1}$, arrondi au dixième.

    **(b)** Déterminer la concentration d'une solution de pH égal à $5$.

    **(c)** Que devient le pH lorsque la concentration est divisée par $10$ ?

    **2.** **Acoustique.** Le niveau sonore en décibels vaut $L=10\log\left(\frac{I}{I_{0}} \right)$, où $I_{0}=10^{-12}\ \mathrm{W}\cdot\mathrm{m}^{-2}$.

    **(a)** Calculer le niveau sonore correspondant à $I=10^{-5}\ \mathrm{W}\cdot\mathrm{m}^{-2}$.

    **(b)** De combien augmente le niveau sonore lorsque l'intensité est multipliée par $100$ ?

    **(c)** Deux sources identiques de $70$ dB fonctionnent ensemble. Quel est le niveau sonore obtenu ? *Le résultat n'est pas $140$ dB.*

    **3.** **Numération.** Combien de chiffres comporte le nombre $2^{100}$ ? Et le nombre $3^{500}$ ?
  corrige: |
    **1.** **Chimie.**

    **(a)** $\mathrm{pH}=-\log\left(2{,}5\times 10^{-4}\right) =-\left(\log(2{,}5)+\log\left(10^{-4}\right)\right)=-\log(2{,}5)+4\approx\boxed{3{,}6}$

    La solution est donc **acide**.

    **(b)** $\mathrm{pH}=5$ donne $\log\left(\left[\mathrm{H}^{+}\right]\right)=-5$, soit $\boxed{\left[\mathrm{H}^{+}\right]=10^{-5}\ \mathrm{mol}\cdot\mathrm{L}^{-1}}$

    **(c)** Diviser la concentration par $10$ retranche $\log(10)=1$ à son logarithme, donc 
    $$\boxed{\text{le pH augmente de } 1.}$$

    **2.** **Acoustique.**

    **(a)** $L=10\log\left(\dfrac{10^{-5}}{10^{-12}}\right)=10\log\left(10^{7}\right) =\boxed{70 \text{ dB}}$

    **(b)** Multiplier $I$ par $100$ ajoute $10\log(100)=20$ : $\boxed{\text{le niveau augmente de } 20 \text{ dB.}}$

    **(c)** Deux sources identiques doublent l'intensité, donc ajoutent $10\log(2)\approx 3$ : 
    $$\boxed{L\approx 73 \text{ dB, et non } 140 \text{ dB.}}$$
     *Les décibels ne s'additionnent pas :* ce sont les intensités qui s'ajoutent, et le logarithme transforme cette somme en une augmentation très modeste.

    **3.** **Numération.** Un entier $N$ possède $p$ chiffres lorsque $p-1\leqslant\log(N)<p$. 
    $$\log\left(2^{100}\right)=100\log(2)\approx 30{,}10 \qquad\Longrightarrow\qquad \boxed{2^{100} \text{ compte } 31 \text{ chiffres.}}$$

    $$\log\left(3^{500}\right)=500\log(3)\approx 238{,}56 \qquad\Longrightarrow\qquad \boxed{3^{500} \text{ compte } 239 \text{ chiffres.}}$$
- id: "t-05-23"
  feuille: "f-t-05"
  numero: 23
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [exponentielle, logarithme, ensemble de définition, dérivée, limite, fonction puissance]
  noeuds: [cx-exponentielle, nb-logarithme, ar-deriv]
  notions: [exponentielle, logarithme, derivable]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. $\displaystyle\lim_{x\to+\infty}\frac{\mathrm{e}^{x}}{x^{2}}$ vaut ¦ $0$ ¦ $+\infty$ ¦ $1$
    2. $\displaystyle\lim_{x\to-\infty}x\,\mathrm{e}^{x}$ vaut ¦ $0$ ¦ $-\infty$ ¦ $1$
    3. La dérivée de $x\mapsto\mathrm{e}^{3x}$ est ¦ $3\mathrm{e}^{3x}$ ¦ $\mathrm{e}^{3x}$ ¦ $3x\,\mathrm{e}^{3x-1}$
    4. Pour $a>0$ et $b>0$, $\ln(a)+\ln(b)$ vaut ¦ $\ln(a+b)$ ¦ $\ln(ab)$ ¦ $\ln(a)\times\ln(b)$
    5. L'ensemble de définition de $x\mapsto\ln(x-2)$ est ¦ $]2\,;+\infty[$ ¦ $[2\,;+\infty[$ ¦ $\mathbb{R}\setminus\{2\}$
    6. La dérivée de $x\mapsto\ln\left(x^{2}+1\right)$ est ¦ $\dfrac{1}{x^{2}+1}$ ¦ $\dfrac{2x}{x^{2}+1}$ ¦ $2x$
    7. $\displaystyle\lim_{x\to 0^{+}}x\ln(x)$ vaut ¦ $0$ ¦ $-\infty$ ¦ $1$
    8. L'équation $\mathrm{e}^{x}=-3$ admet ¦ une solution ¦ deux solutions ¦ aucune solution
    9. Pour tout réel $x$, $\left(\mathrm{e}^{x}\right)^{2}$ vaut ¦ $\mathrm{e}^{x^{2}}$ ¦ $\mathrm{e}^{2x}$ ¦ $2\mathrm{e}^{x}$
    10. Pour $a>0$ et $x$ réel, $a^{x}$ vaut ¦ $\mathrm{e}^{a\ln(x)}$ ¦ $\mathrm{e}^{x\ln(a)}$ ¦ $x^{a}$
    ```
  corrige: |
    **1.** **Réponse B.** C'est le théorème des croissances comparées : l'exponentielle l'emporte sur toute puissance de $x$.

    **2.** **Réponse A.** Croissances comparées également, sous la forme $\lim_{x\to-\infty}x^{n}\mathrm{e}^{x}=0$.

    **3.** **Réponse A.** $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}$ avec $u(x)=3x$. La réponse C applique à tort la règle des puissances.

    **4.** **Réponse B.** C'est la propriété fondamentale du logarithme, celle que recherchait Neper : transformer un produit en une somme.

    **5.** **Réponse A.** Il faut $x-2>0$, l'inégalité étant *stricte* puisque $\ln(0)$ n'existe pas.

    **6.** **Réponse B.** $\left(\ln(u)\right)'=\dfrac{u'}{u}$ avec $u(x)=x^{2}+1$. La réponse A oublie le facteur $u'$.

    **7.** **Réponse A.** Croissances comparées : $x$ tend vers $0$ plus vite que $\ln(x)$ ne tend vers $-\infty$.

    **8.** **Réponse C.** L'exponentielle est strictement positive : elle ne peut jamais valoir $-3$.

    **9.** **Réponse B.** $\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{x}\times\mathrm{e}^{x}=\mathrm{e}^{2x}$. La réponse A confond avec $\mathrm{e}^{\left(x^{2}\right)}$.

    **10.** **Réponse B.** C'est la définition du cours : dans $a^{x}$, c'est l'exposant $x$ qui varie, d'où $\mathrm{e}^{x\ln(a)}$. La réponse A correspondrait à $x^{a}$.
- id: "t-05-24"
  feuille: "f-t-05"
  numero: 24
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [exponentielle, logarithme, limite, asymptote]
  noeuds: [cx-exponentielle, nb-logarithme]
  notions: [exponentielle, logarithme]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Pour tout réel $x$, $\mathrm{e}^{x}>0$.

    **2.** Pour tous réels $a>0$ et $b>0$, $\ln(a+b)=\ln(a)+\ln(b)$.

    **3.** Pour tout réel $x>0$, $\mathrm{e}^{\ln(x)}=x$.

    **4.** Pour tout réel $x$, $\ln\left(\mathrm{e}^{x}\right)=x$.

    **5.** La fonction $\ln$ est définie sur $\mathbb{R}$.

    **6.** $\displaystyle\lim_{x\to+\infty}\frac{\ln(x)}{x}=0$.

    **7.** Si $\ln(a)<\ln(b)$, alors $a<b$.

    **8.** La courbe de la fonction $\ln$ admet une asymptote horizontale en $+\infty$.

    **9.** Les courbes des fonctions $\exp$ et $\ln$ sont symétriques par rapport à la droite d'équation $y=x$.

    **10.** L'équation $\ln(x)=-5$ n'a pas de solution, car un logarithme est toujours positif.
  corrige: |
    **1.** **Vraie**. C'est une propriété fondamentale de l'exponentielle, qui justifie que le signe de $u'\mathrm{e}^{u}$ ne dépende que de $u'$.

    **2.** **Fausse**. La bonne propriété est $\ln(a)+\ln(b)=\ln(ab)$. *Contre-exemple :* $\ln(1+1)=\ln(2)\approx 0{,}69$, alors que $\ln(1)+\ln(1)=0$.

    **3.** **Vraie**. Les deux fonctions se défont l'une l'autre, à condition que $x>0$.

    **4.** **Vraie**. Ici aucune condition n'est nécessaire : $\mathrm{e}^{x}$ est toujours strictement positif, donc $\ln\left(\mathrm{e}^{x}\right)$ existe pour tout réel $x$.

    **5.** **Fausse**. Elle est définie sur $]0\,;+\infty[$ seulement, puisqu'un réel négatif n'a pas d'antécédent par l'exponentielle.

    **6.** **Vraie**. C'est la proposition 7 du cours : le logarithme croît plus lentement que $x$.

    **7.** **Vraie**. La fonction $\ln$ étant strictement croissante, elle conserve l'ordre — et cela vaut aussi dans l'autre sens.

    **8.** **Fausse**. On a $\lim_{x\to+\infty}\ln(x)=+\infty$ : la courbe monte indéfiniment, même si elle le fait très lentement. *C'est une erreur fréquente*, encouragée par l'aspect très aplati de la courbe.

    **9.** **Vraie**. C'est la conséquence graphique du fait que chacune est la réciproque de l'autre.

    **10.** **Fausse**. Un logarithme peut parfaitement être négatif : c'est le cas dès que $0<x<1$. Ici $\ln(x)=-5$ admet la solution $\boxed{x=\mathrm{e}^{-5}\approx 0{,}0067}$.
- id: "t-05-25"
  feuille: "f-t-05"
  numero: 25
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Lecture graphique, Conjecture, Démonstration, Calcul]
  mots_cles: [exponentielle, équation, dérivée, tableau de variations, limite, asymptote, tangente, théorème des valeurs intermédiaires]
  noeuds: [cx-exponentielle, ar-deriv, c-tvi]
  notions: [exponentielle, derivable]
  page_enonce: 8
  page_corrige: 12
  enonce: |
    On considère la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=(2-x)\mathrm{e}^{x}$. On a représenté ci-dessous sa courbe $\mathcal{C}$, ainsi que la droite d'équation $y=1$.

    ![Figure](documents/figures/dfef1245a0cd31a4.svg)

    **1.** **Lecture graphique.** Par simple lecture de la figure, conjecturer :

    **(a)** les limites de $f$ en $-\infty$ et en $+\infty$, ainsi que l'existence d'une asymptote ;

    **(b)** le sens de variation de $f$ et l'abscisse de son maximum ;

    **(c)** le nombre de solutions de l'équation $f(x)=1$, et un encadrement de chacune à l'unité ;

    **(d)** le signe de $f(x)$ selon les valeurs de $x$.

    *Les questions suivantes ont pour but de démontrer ces conjectures.*

    **2.** Déterminer $\displaystyle\lim_{x\to-\infty}f(x)$. En déduire une asymptote à $\mathcal{C}$.

    **3.** Déterminer $\displaystyle\lim_{x\to+\infty}f(x)$.

    **4.** Calculer $f'(x)$ et montrer que $f'(x)=(1-x)\mathrm{e}^{x}$.

    **5.** Étudier le signe de $f'$ et dresser le tableau de variations de $f$ sur $\mathbb{R}$.

    **6.** Déterminer une équation de la tangente $T$ à $\mathcal{C}$ au point d'abscisse $0$.

    **7.** Résoudre l'équation $f(x)=0$, puis en déduire le signe de $f$ sur $\mathbb{R}$.

    **8.** Démontrer que l'équation $f(x)=1$ admet exactement deux solutions sur $\mathbb{R}$, puis donner un encadrement de chacune d'elles d'amplitude $0{,}1$.
  corrige: |
    **1.** **Lecture graphique.**

    **(a)** La courbe semble se rapprocher de l'axe des abscisses en $-\infty$ : on conjecture $\lim_{x\to-\infty}f(x)=0$ et une asymptote horizontale d'équation $y=0$. En $+\infty$, la courbe plonge : $\lim_{x\to+\infty}f(x)=-\infty$.

    **(b)** $f$ semble croissante puis décroissante, avec un maximum atteint pour $x=1$.

    **(c)** La droite $y=1$ coupe la courbe en **deux** points, l'un d'abscisse comprise entre $-2$ et $-1$, l'autre entre $1$ et $2$.

    **(d)** La courbe est au-dessus de l'axe avant $2$ et en dessous après : $f$ semble positive sur $]-\infty\,;2[$ et négative sur $]2\,;+\infty[$.

    **2.** $f(x)=2\mathrm{e}^{x}-x\,\mathrm{e}^{x}$. Or $\mathrm{e}^{x}\to 0$ et $x\,\mathrm{e}^{x}\to 0$ par croissances comparées : 
    $$\boxed{\lim_{x\to-\infty}f(x)=0}$$

    $$\boxed{\text{La droite d'équation } y=0 \text{ est asymptote horizontale en } -\infty.}$$

    **3.** $2-x\to-\infty$ et $\mathrm{e}^{x}\to+\infty$, donc par produit $\boxed{\lim_{x\to+\infty}f(x)=-\infty}$

    **4.** $f'(x)=-\mathrm{e}^{x}+(2-x)\mathrm{e}^{x}=\mathrm{e}^{x}\big(-1+2-x\big)=\boxed{(1-x)\mathrm{e}^{x}}$

    **5.** Le facteur $\mathrm{e}^{x}$ est strictement positif : $f'$ a le signe de $1-x$.

    ![Figure](documents/figures/a425f024359bd651.svg)

    Les conjectures des questions 1.(a) et 1.(b) sont donc démontrées.

    **6.** $f(0)=2$ et $f'(0)=1$, d'où $\boxed{T : y=x+2}$.

    **7.** $f(x)=0$ équivaut à $(2-x)\mathrm{e}^{x}=0$. Comme $\mathrm{e}^{x}\neq 0$, il reste $\boxed{x=2}$, et le signe de $f$ est celui de $2-x$ : 
    $$\boxed{f>0 \text{ sur } ]-\infty\,;2[ \quad\text{et}\quad f<0 \text{ sur } ]2\,;+\infty[.}$$

    **8.** Sur $]-\infty\,;1]$, $f$ est continue et strictement croissante, de $0$ à $\mathrm{e}\approx 2{,}718$. Comme $1\in\,]0\,;\mathrm{e}[$, le théorème de la bijection assure l'existence d'une unique solution $\alpha$. Sur $[1\,;+\infty[$, $f$ est continue et strictement décroissante de $\mathrm{e}$ à $-\infty$, et $1<\mathrm{e}$ : une unique solution $\beta$. 
    $$\boxed{\text{L'équation } f(x)=1 \text{ admet exactement deux solutions.}}$$
     À la calculatrice : $f(-1{,}2)\approx 0{,}96<1$ et $f(-1{,}1)\approx 1{,}03>1$ ; $f(1{,}8)\approx 1{,}21>1$ et $f(1{,}9)\approx 0{,}67<1$. 
    $$\boxed{-1{,}2<\alpha<-1{,}1 \qquad\text{et}\qquad 1{,}8<\beta<1{,}9}$$
- id: "t-05-26"
  feuille: "f-t-05"
  numero: 26
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [logarithme, dérivée, tableau de variations, limite, tangente, théorème des valeurs intermédiaires]
  noeuds: [nb-logarithme, ar-deriv, c-tvi]
