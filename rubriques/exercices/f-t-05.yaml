  enonce: |
    Une entreprise possède un parc de $100$ machines au $1^{\text{er}}$ janvier $2025$. Chaque année, elle met au rebut $20\,\%$ de son parc et achète $60$ machines neuves.

    On note $u_{n}$ le nombre de machines au $1^{\text{er}}$ janvier de l'année $2025+n$, de sorte que $u_{0}=100$.

    **1.** Justifier que, pour tout entier naturel $n$, $u_{n+1}=0{,}8\,u_{n}+60$.

    **2.** Calculer $u_{1}$, $u_{2}$ et $u_{3}$.

    **3.** On pose $v_{n}=u_{n}-300$. Démontrer que $(v_{n})$ est une suite géométrique dont on précisera la raison et le premier terme.

    **4.** En déduire que, pour tout entier naturel $n$ : 
    $$u_{n}=300-200\times 0{,}8^{\,n}$$

    **5.** Déterminer la limite de la suite $(u_{n})$ et interpréter ce résultat dans le contexte.

    **6.** La suite $(u_{n})$ est-elle croissante ? Justifier.

    **7.** Déterminer, par le calcul, la plus petite année à partir de laquelle le parc dépassera $290$ machines.

    **8.** Recopier et compléter la fonction Python suivante, qui renvoie le plus petit entier $n$ tel que $u_{n}>s$ :

    ```python
    def seuil(s):
        u = 100
        n = 0
        while ... :
            u = ...
            n = n + 1
        return n
    ```
  corrige: |
    **1.** Chaque année, $20\,\%$ du parc est mis au rebut : il en reste donc $80\,\%$, soit $0{,}8\,u_{n}$ machines, auxquelles s'ajoutent les $60$ machines neuves : 
    $$\boxed{u_{n+1}=0{,}8\,u_{n}+60}$$

    **2.** $u_{1}=0{,}8\times 100+60=\boxed{140}$ $u_{2}=0{,}8\times 140+60=\boxed{172}$ $u_{3}=0{,}8\times 172+60=\boxed{197{,}6}$

    **3.** Pour tout entier naturel $n$ : 
    $$v_{n+1}=u_{n+1}-300=0{,}8\,u_{n}+60-300=0{,}8\,u_{n}-240=0{,}8\left(u_{n}-300\right) =0{,}8\,v_{n}$$

    $$\boxed{(v_{n}) \text{ est géométrique de raison } 0{,}8 \text{ et de premier terme } v_{0}=100-300=-200.}$$

    **4.** On en déduit $v_{n}=-200\times 0{,}8^{\,n}$, puis $u_{n}=v_{n}+300$ : 
    $$\boxed{u_{n}=300-200\times 0{,}8^{\,n}}$$

    **5.** Comme $-1<0{,}8<1$, on a $0{,}8^{\,n}\to 0$, donc $\boxed{\lim_{n\to+\infty}u_{n}=300}$. 
    $$\boxed{\text{Le parc se stabilise à long terme autour de } 300 \text{ machines.}}$$

    **6.** Pour tout $n$ : 
    $$u_{n+1}-u_{n}=-200\times 0{,}8^{\,n+1}+200\times 0{,}8^{\,n} =200\times 0{,}8^{\,n}\left(1-0{,}8\right)=40\times 0{,}8^{\,n}>0$$

    $$\boxed{\text{La suite } (u_{n}) \text{ est strictement croissante.}}$$

    **7.** On résout : 
    $$300-200\times 0{,}8^{\,n}>290 \iff 200\times 0{,}8^{\,n}<10 \iff 0{,}8^{\,n}<0{,}05$$
     En appliquant le logarithme, et comme $\ln(0{,}8)<0$ : 
    $$n>\frac{\ln(0{,}05)}{\ln(0{,}8)}\approx 13{,}43 \qquad\Longrightarrow\qquad n=14$$

    $$\boxed{\text{Le parc dépassera } 290 \text{ machines au } 1^{\text{er}} \text{ janvier } 2039.}$$
     *Vérification :* $u_{13}\approx 289{,}0$ et $u_{14}\approx 291{,}2$.

    **8.** 

    ```python
    def seuil(s):
        u = 100
        n = 0
        while u <= s:
            u = 0.8*u + 60
            n = n + 1
        return n
    ```

     *L'appel* `seuil(290)` *renvoie bien* `14`.
- id: "t-05-30"
  feuille: "f-t-05"
  numero: 30
  titre: "L'algorithme de Briggs"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Algorithmique, Problème, Démonstration]
  mots_cles: [logarithme, limite, suite, récurrence, Python]
  noeuds: [nb-logarithme, ar-suites, n-recurrence]
  notions: [logarithme, suite]
  page_enonce: 11
  page_corrige: 17
  enonce: |
    *Henry Briggs, cité dans l'introduction du cours, a construit ses tables de logarithmes sans calculatrice, à partir d'une seule opération : l'extraction de racines carrées. Cet exercice reconstitue son idée.*

    **Partie A : le principe**

    Soit $x$ un réel strictement positif. On définit la suite $(u_{n})$ par 
    $$u_{0}=x \qquad\text{et}\qquad u_{n+1}=\sqrt{u_{n}}$$

    **1.** Démontrer par récurrence que $u_{n}>0$ pour tout entier naturel $n$.

    **2.** Démontrer par récurrence que, pour tout entier naturel $n$ : 
    $$\ln\left(u_{n}\right)=\frac{\ln(x)}{2^{\,n}}$$

    **3.** En déduire la limite de $\ln\left(u_{n}\right)$, puis celle de $u_{n}$.

    **4.** On pose $v_{n}=2^{\,n}\left(u_{n}-1\right)$. Démontrer que, tant que $u_{n}\neq 1$ : 
    $$v_{n}=\ln(x)\times\frac{u_{n}-1}{\ln\left(u_{n}\right)}$$

    **5.** On pose $t_{n}=u_{n}-1$. Justifier que $t_{n}$ tend vers $0$, puis que 
    $$\frac{u_{n}-1}{\ln\left(u_{n}\right)}=\frac{t_{n}}{\ln\left(1+t_{n}\right)}$$

    **6.** En utilisant la limite $\displaystyle\lim_{t\to 0}\frac{\ln(1+t)}{t}=1$ du cours, conclure que la suite $(v_{n})$ converge vers $\ln(x)$.

    **Partie B : l'algorithme**

    **7.** Recopier et compléter la fonction Python suivante, qui renvoie la valeur approchée $v_{n}$ du logarithme de $x$ :

    ```python
    from math import sqrt

    def briggs(x, n):
        u = x
        for i in range(n):
            u = ...
        return ...
    ```

    **8.** On applique cet algorithme à $x=2$. Recopier et compléter le tableau suivant, à l'aide d'une calculatrice ou d'un ordinateur.

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline n & 5 & 10 & 20 & 30 & 40 & 50 \\ \hline v_{n} &  &  &  &  &  &  \\ \hline \end{array}$$

    On rappelle que $\ln(2)\approx 0{,}693\,147\,180\,6$.

    **9.** Décrire ce que l'on observe lorsque $n$ dépasse $30$. Le résultat se rapproche-t-il encore de $\ln(2)$ ?

    **10.** Proposer une explication. *On pourra remarquer que $u_{n}$ devient extrêmement proche de $1$, et réfléchir à ce que devient la soustraction $u_{n}-1$ dans une machine qui ne conserve qu'une quinzaine de chiffres significatifs.*

    **11.** Quelle valeur de $n$ conseilleriez-vous à un utilisateur de cet algorithme ?
  corrige: |
    **Partie A**

    **1.** Démontrons par récurrence la propriété $P_n : \text{« } u_{n}>0 \text{ »}$.

    **Initialisation :** $u_{0}=x>0$ par hypothèse, donc $P_0$ est vraie.

    **Hérédité :** Soit $k\in\mathbb{N}$. Supposons $u_{k}>0$. Alors $\sqrt{u_{k}}$ existe et est strictement positif, donc $u_{k+1}>0$ : la propriété $P_{k+1}$ est vraie.

    **Conclusion :** Par principe de récurrence, $\boxed{u_{n}>0 \text{ pour tout } n\in\mathbb{N}.}$

    *Cette étape n'est pas une formalité :* elle garantit que la racine carrée et le logarithme utilisés ensuite ont bien un sens.

    **2.** Démontrons par récurrence la propriété $P_n : \text{« } \ln\left(u_{n}\right)=\dfrac{\ln(x)}{2^{\,n}} \text{ »}$.

    **Initialisation :** Pour $n=0$ : $\ln\left(u_{0}\right)=\ln(x)$ et $\dfrac{\ln(x)}{2^{0}}=\ln(x)$. Vrai.

    **Hérédité :** Soit $k\in\mathbb{N}$. Supposons $\ln\left(u_{k}\right)=\dfrac{\ln(x)}{2^{\,k}}$. Alors, en utilisant $\ln\left(\sqrt{a}\right)=\dfrac{1}{2}\ln(a)$ : 
    $$\ln\left(u_{k+1}\right)=\ln\left(\sqrt{u_{k}}\right)=\frac{1}{2}\ln\left(u_{k}\right) =\frac{1}{2}\times\frac{\ln(x)}{2^{\,k}}=\frac{\ln(x)}{2^{\,k+1}}$$

    **Conclusion :** $\boxed{\text{Pour tout } n\in\mathbb{N},\ \ln\left(u_{n}\right)=\dfrac{\ln(x)}{2^{\,n}}.}$

    **3.** Le numérateur $\ln(x)$ est un nombre fixé, tandis que $2^{\,n}\to+\infty$ : 
    $$\boxed{\lim_{n\to+\infty}\ln\left(u_{n}\right)=0}$$
     Comme $u_{n}=\mathrm{e}^{\ln\left(u_{n}\right)}$ et que la fonction exponentielle est continue en $0$ : 
    $$\boxed{\lim_{n\to+\infty}u_{n}=\mathrm{e}^{0}=1}$$

    **4.** De la question 2 on tire $2^{\,n}=\dfrac{\ln(x)}{\ln\left(u_{n}\right)}$, valable tant que $\ln\left(u_{n}\right)\neq 0$, c'est-à-dire tant que $u_{n}\neq 1$. En reportant : 
    $$v_{n}=2^{\,n}\left(u_{n}-1\right) =\boxed{\ln(x)\times\frac{u_{n}-1}{\ln\left(u_{n}\right)}}$$

    **5.** D'après la question 3, $u_{n}\to 1$, donc $\boxed{t_{n}=u_{n}-1\longrightarrow 0}$. De plus $u_{n}=1+t_{n}$, d'où 
    $$\frac{u_{n}-1}{\ln\left(u_{n}\right)}=\boxed{\frac{t_{n}}{\ln\left(1+t_{n}\right)}}$$

    **6.** La limite du cours $\displaystyle\lim_{t\to 0}\frac{\ln(1+t)}{t}=1$ donne, par passage à l'inverse, $\dfrac{t_{n}}{\ln\left(1+t_{n}\right)}\longrightarrow 1$. Par produit : 
    $$v_{n}=\ln(x)\times\frac{t_{n}}{\ln\left(1+t_{n}\right)}\longrightarrow \ln(x)\times 1$$

    $$\boxed{\lim_{n\to+\infty}v_{n}=\ln(x)}$$
     *L'algorithme calcule donc bien un logarithme, à partir de la seule extraction de racines carrées — ce que Briggs savait faire à la main.*

    **Partie B**

    **7.** 

    ```python
    from math import sqrt

    def briggs(x, n):
        u = x
        for i in range(n):
            u = sqrt(u)
        return 2**n * (u - 1)
    ```

    **8.** Pour $x=2$ :

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline n & 5 & 10 & 20 & 30 & 40 & 50 \\ \hline v_{n} & 0{,}700\,709 & 0{,}693\,382 & 0{,}693\,1474 & 0{,}693\,1472 & 0{,}693\,115 & 0{,}5 \\ \hline \end{array}$$

    **9.** Jusqu'à $n=30$, l'approximation s'améliore régulièrement : l'erreur passe de $8\times 10^{-3}$ à $2\times 10^{-9}$. Puis tout se dégrade brutalement. 
    $$\boxed{\text{Pour } n=40 \text{ on perd cinq décimales, et pour } n=50 \text{ le résultat } 0{,}5 \text{ est absurde.}}$$
     *En poursuivant, on obtiendrait même $0$ pour $n=60$.*

    **10.** Le nombre $u_{n}$ devient extrêmement proche de $1$. Or une machine ne conserve qu'une quinzaine de chiffres significatifs : lorsque $u_{n}$ vaut par exemple $1{,}000\,000\,000\,000\,6$, la soustraction $u_{n}-1$ ne conserve qu'un seul chiffre exact, tous les autres ayant été perdus au moment de l'arrondi de $u_{n}$. 
    $$\boxed{\begin{array}{l} \text{C'est le phénomène de \textbf{cancellation} : soustraire deux nombres très proches}\\[1mm] \text{détruit la précision. Le facteur } 2^{\,n} \text{ amplifie ensuite l'erreur commise.} \end{array}}$$

    **11.** Le meilleur compromis se situe autour de $\boxed{n=25 \text{ à } 30}$ : assez grand pour que $t_{n}$ soit petit, assez petit pour que la soustraction reste fiable.

    *Il est remarquable qu'augmenter le nombre d'itérations puisse dégrader le résultat :* en analyse numérique, plus de calculs ne signifie pas toujours plus de précision.
- id: "t-05-31"
  feuille: "f-t-05"
  numero: 31
  titre: "La fonction puissance"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [exponentielle, logarithme, équation, dérivée, tableau de variations, limite, fonction puissance]
  noeuds: [cx-exponentielle, nb-logarithme, ar-deriv]
  notions: [exponentielle, logarithme, derivable]
  page_enonce: 12
  page_corrige: 19
  enonce: |
    *Le cours a défini $a^{x}=\mathrm{e}^{x\ln(a)}$ en faisant varier l'exposant. On fixe cette fois l'exposant et l'on fait varier la base.*

    Pour tout réel $a$ et tout réel $x>0$, on pose 
    $$x^{a}=\mathrm{e}^{a\ln(x)}$$
     et l'on note $f_{a}$ la fonction ainsi définie sur $]0\,;+\infty[$.

    **1.** Vérifier que cette définition redonne le résultat attendu pour $a=3$ et $x=2$.

    **2.** Démontrer que $f_{a}$ est dérivable sur $]0\,;+\infty[$ et que 
    $$f_{a}'(x)=a\,x^{\,a-1}$$
     *On retrouve ainsi, pour tout exposant réel, la formule connue pour les exposants entiers.*

    **3.** Appliquer ce résultat au cas $a=\dfrac{1}{2}$, et vérifier que l'on retrouve la dérivée de la fonction racine carrée.

    **4.** Étudier le sens de variation de $f_{a}$ sur $]0\,;+\infty[$, en distinguant les cas $a>0$, $a=0$ et $a<0$.

    **5.** Déterminer $\displaystyle\lim_{x\to+\infty}x^{a}$ et $\displaystyle\lim_{x\to 0^{+}}x^{a}$ selon le signe de $a$.

    **6.** Démontrer que pour tous réels $a$ et $b$ et tout $x>0$ : 
    $$x^{a}\times x^{b}=x^{\,a+b} \qquad\text{et}\qquad \left(x^{a}\right)^{b}=x^{\,ab}$$

    **7.** Résoudre l'équation $x^{\frac{2}{3}}=4$ d'inconnue $x>0$.

    **8.** Comparer les nombres $2^{\sqrt{2}}$ et $\left(\sqrt{2}\right)^{2}$.
  corrige: |
    **1.** Pour $a=3$ et $x=2$ : 
    $$2^{3}=\mathrm{e}^{3\ln(2)}=\left(\mathrm{e}^{\ln(2)}\right)^{3}=2^{3}=\boxed{8}$$
     La définition coïncide donc bien avec la puissance usuelle.

    **2.** La fonction $x\mapsto a\ln(x)$ est dérivable sur l'intervalle $]0\,;+\infty[$, et sa dérivée vaut $\dfrac{a}{x}$. Par composition avec l'exponentielle : 
    $$f_{a}'(x)=\frac{a}{x}\times\mathrm{e}^{a\ln(x)}=\frac{a}{x}\times x^{a} =a\times\frac{x^{a}}{x}=\boxed{a\,x^{\,a-1}}$$
     en utilisant $\dfrac{x^{a}}{x^{1}}=\mathrm{e}^{a\ln(x)-\ln(x)}=\mathrm{e}^{(a-1)\ln(x)}=x^{\,a-1}$.

    **3.** Pour $a=\dfrac{1}{2}$, on a $f_{a}(x)=x^{\frac{1}{2}}=\mathrm{e}^{\frac{1}{2}\ln(x)}=\sqrt{x}$, et 
    $$f_{a}'(x)=\frac{1}{2}\,x^{-\frac{1}{2}}=\frac{1}{2}\times\frac{1}{\sqrt{x}} =\boxed{\frac{1}{2\sqrt{x}}}$$
     On retrouve exactement la dérivée connue depuis la Première.

    **4.** Comme $x^{\,a-1}>0$ pour tout $x>0$, le signe de $f_{a}'$ est celui de $a$ : 
    $$\boxed{\begin{array}{l} \text{si } a>0 : f_{a} \text{ est strictement croissante sur } ]0\,;+\infty[ ; \\[1mm] \text{si } a=0 : f_{a} \text{ est constante égale à } 1 ; \\[1mm] \text{si } a<0 : f_{a} \text{ est strictement décroissante.} \end{array}}$$

    **5.** On a $x^{a}=\mathrm{e}^{a\ln(x)}$, et $\ln(x)\to+\infty$ quand $x\to+\infty$ : 
    $$\boxed{\begin{array}{l} \text{si } a>0 : \displaystyle\lim_{x\to+\infty}x^{a}=+\infty \quad\text{et}\quad \lim_{x\to 0^{+}}x^{a}=0 ; \\[2mm] \text{si } a<0 : \displaystyle\lim_{x\to+\infty}x^{a}=0 \quad\text{et}\quad \lim_{x\to 0^{+}}x^{a}=+\infty. \end{array}}$$

    **6.** Il suffit de revenir à l'exponentielle : 
    $$x^{a}\times x^{b}=\mathrm{e}^{a\ln(x)}\times\mathrm{e}^{b\ln(x)}=\mathrm{e}^{(a+b)\ln(x)}=\boxed{x^{\,a+b}}$$

    $$\left(x^{a}\right)^{b}=\mathrm{e}^{b\ln\left(x^{a}\right)}=\mathrm{e}^{b\times a\ln(x)}=\boxed{x^{\,ab}}$$
     en utilisant $\ln\left(x^{a}\right)=\ln\left(\mathrm{e}^{a\ln(x)}\right)=a\ln(x)$.

    **7.** En élevant les deux membres à la puissance $\dfrac{3}{2}$, ce qui est licite d'après la question 6 : 
    $$\left(x^{\frac{2}{3}}\right)^{\frac{3}{2}}=4^{\frac{3}{2}} \iff x=\left(4^{\frac{1}{2}} \right)^{3}=2^{3}=\boxed{8}$$
     *Vérification :* $8^{\frac{2}{3}}=\left(8^{\frac{1}{3}}\right)^{2}=2^{2}=4$.

    **8.** $\left(\sqrt{2}\right)^{2}=2$, tandis que $2^{\sqrt{2}}=\mathrm{e}^{\sqrt{2}\ln(2)}$. Comme $\sqrt{2}\approx 1{,}414>1$ et que la fonction $x\mapsto 2^{x}$ est strictement croissante : 
    $$2^{\sqrt{2}}>2^{1}=2$$

    $$\boxed{2^{\sqrt{2}}\approx 2{,}665>\left(\sqrt{2}\right)^{2}=2}$$
- id: "t-05-32"
  feuille: "f-t-05"
  numero: 32
  titre: "Les intérêts composés et le nombre e"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [exponentielle, logarithme, limite, suite, intérêts composés]
  noeuds: [cx-exponentielle, nb-logarithme, ar-suites]
  notions: [exponentielle, logarithme, suite]
  page_enonce: 13
  page_corrige: 20
  enonce: |
    *L'introduction du cours signalait que certaines suites d'intérêts composés convergent vers une constante mystérieuse, voisine de $2{,}718$. Cet exercice reconstitue cette découverte.*

    **Partie A : la limite**

    Soit $x$ un réel fixé. Pour tout entier $n>|x|$, on pose 
    $$w_{n}=\left(1+\frac{x}{n}\right)^{n}$$

    **1.** Justifier que $1+\dfrac{x}{n}>0$ pour $n>|x|$, ce qui donne un sens à l'écriture ci-dessus.

    **2.** Démontrer que $w_{n}=\mathrm{e}^{\,n\ln\left(1+\frac{x}{n}\right)}$.

    **3.** On suppose $x\neq 0$ et l'on pose $t_{n}=\dfrac{x}{n}$. Démontrer que 
    $$n\ln\left(1+\frac{x}{n}\right)=x\times\frac{\ln\left(1+t_{n}\right)}{t_{n}}$$

    **4.** Justifier que $t_{n}$ tend vers $0$, puis conclure que 
    $$\lim_{n\to+\infty}\left(1+\frac{x}{n}\right)^{n}=\mathrm{e}^{x}$$

    **5.** Que devient ce résultat pour $x=0$ ?

    **Partie B : le nombre e**

    **6.** Déduire de la partie A que $\displaystyle\lim_{n\to+\infty}\left(1+\frac{1}{n}\right)^{n} =\mathrm{e}$.

    **7.** Calculer $\left(1+\frac{1}{n}\right)^{n}$ pour $n=10$, $n=100$, $n=1\,000$ et $n=10\,000$. Combien de décimales exactes de $\mathrm{e}$ obtient-on à chaque fois ?

    **8.** Cette convergence vous paraît-elle rapide ? Comparer avec l'algorithme de l'exercice 30.

    **Partie C : les intérêts composés**

    Un capital de $1\,000$ € est placé au taux annuel de $5\,\%$. Les intérêts sont capitalisés $n$ fois par an, chaque versement rapportant $\dfrac{5}{n}\,\%$.

    **9.** Justifier qu'au bout d'un an, le capital vaut $C_{n}=1\,000\left(1+\dfrac{0{,}05}{n}\right)^{n}$.

    **10.** Calculer $C_{n}$ pour $n=1$ (intérêts annuels), $n=12$ (mensuels) et $n=365$ (quotidiens). On arrondira au centime.

    **11.** Vers quelle valeur tend $C_{n}$ lorsque $n$ tend vers $+\infty$ ? Calculer cette limite au centime près.

    **12.** Une banque propose une capitalisation « à chaque seconde ». Le client y gagne-t-il beaucoup par rapport à une capitalisation quotidienne ? Commenter.
  corrige: |
    **Partie A**

    **1.** Si $n>|x|$, alors $\left|\dfrac{x}{n}\right|<1$, donc $\dfrac{x}{n}>-1$ et 
    $$\boxed{1+\frac{x}{n}>0}$$
     Le logarithme de ce nombre existe donc, ce qui donne un sens à l'écriture proposée.

    **2.** Par définition de la puissance de base quelconque : 
    $$w_{n}=\left(1+\frac{x}{n}\right)^{n}=\mathrm{e}^{\,n\ln\left(1+\frac{x}{n}\right)}$$

    **3.** Avec $t_{n}=\dfrac{x}{n}$, on a $n=\dfrac{x}{t_{n}}$, d'où 
    $$n\ln\left(1+\frac{x}{n}\right)=\frac{x}{t_{n}}\times\ln\left(1+t_{n}\right) =\boxed{x\times\frac{\ln\left(1+t_{n}\right)}{t_{n}}}$$

    **4.** Le réel $x$ étant fixé et $n$ tendant vers $+\infty$, on a $t_{n}=\dfrac{x}{n}\longrightarrow 0$. La limite du cours donne alors $\dfrac{\ln\left(1+t_{n}\right)}{t_{n}}\longrightarrow 1$, donc l'exposant tend vers $x$. Par continuité de l'exponentielle : 
    $$\boxed{\lim_{n\to+\infty}\left(1+\frac{x}{n}\right)^{n}=\mathrm{e}^{x}}$$

    **5.** Pour $x=0$, on a $w_{n}=1^{\,n}=1$ pour tout $n$, et $\mathrm{e}^{0}=1$ : 
    $$\boxed{\text{le résultat reste vrai.}}$$

    **Partie B**

    **6.** Il suffit d'appliquer la partie A avec $x=1$ : 
    $$\boxed{\lim_{n\to+\infty}\left(1+\frac{1}{n}\right)^{n}=\mathrm{e}^{1}=\mathrm{e}}$$

    **7.**

    $$\begin{array}{|c|c|c|c|c|} \hline n & 10 & 100 & 1\,000 & 10\,000 \\ \hline \left(1+\frac{1}{n}\right)^{n} & 2{,}593\,742 & 2{,}704\,814 & 2{,}716\,924 & 2{,}718\,146 \\ \hline \text{Décimales exactes} & 0 & 1 & 2 & 3 \\ \hline \end{array}$$

    On rappelle que $\mathrm{e}\approx 2{,}718\,281\,8$.

    **8.** La convergence est très lente : il faut multiplier $n$ par $10$ pour gagner une seule décimale. 
    $$\boxed{\text{L'algorithme de Briggs est incomparablement plus efficace.}}$$
     Celui-ci gagnait environ trois décimales à chaque doublement du nombre d'étapes, et atteignait neuf décimales exactes en trente racines carrées seulement.

    *Cette formule a donc un grand intérêt théorique — elle explique d'où vient le nombre $\mathrm{e}$ — mais aucun intérêt pratique pour le calculer.*

    **Partie C**

    **9.** À chacune des $n$ périodes, le capital est multiplié par $\left(1+\dfrac{0{,}05}{n} \right)$. Au bout d'un an, soit $n$ périodes : 
    $$\boxed{C_{n}=1\,000\left(1+\frac{0{,}05}{n}\right)^{n}}$$

    **10.**

    ```tableau
    Capitalisation ¦ annuelle $(n=1)$ ¦ mensuelle $(n=12)$ ¦ quotidienne $(n=365)$
    $C_{n}$ ¦ $1\,050{,}00$ € ¦ $1\,051{,}16$ € ¦ $1\,051{,}27$ €
    ```

    **11.** D'après la partie A appliquée à $x=0{,}05$ : 
    $$\lim_{n\to+\infty}C_{n}=1\,000\,\mathrm{e}^{0{,}05}\approx\boxed{1\,051{,}27~\text{€}}$$

    **12.** Entre la capitalisation quotidienne et la limite théorique, l'écart est inférieur au centime. 
    $$\boxed{\text{Une capitalisation « à chaque seconde » ne rapporterait rien de plus.}}$$
     *Interprétation.* Le gain apporté par une capitalisation plus fréquente est **plafonné** : passer de l'annuel au mensuel rapporte $1{,}16$ €, du mensuel au quotidien $0{,}11$ €, et au-delà plus rien du tout. C'est exactement ce que traduit la convergence vers $\mathrm{e}^{0{,}05}$ — et c'est cette observation, faite au XVIIᵉ siècle sur les intérêts composés, qui a mis les mathématiciens sur la piste du nombre $\mathrm{e}$.
