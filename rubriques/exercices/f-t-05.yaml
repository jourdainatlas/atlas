  enonce: |
    Si $m\in\mathbb{R}$, quel est le nombre de réels $x$ tels que $\mathrm{e}^{x}=mx^{2}$ ?
  corrige: |
    Le réel $0$ n'est jamais solution, puisque $\mathrm{e}^{0}=1$ alors que $m\times 0^{2}=0$. Pour $x\neq 0$, on peut diviser par $x^{2}>0$ : 
    $$\mathrm{e}^{x}=mx^{2} \iff m=\frac{\mathrm{e}^{x}}{x^{2}}$$
     Il s'agit donc de compter les solutions de l'équation $h(x)=m$, où $h$ est la fonction définie sur $\mathbb{R}^{*}$ par $h(x)=\dfrac{\mathrm{e}^{x}}{x^{2}}$. C'est une fonction dérivable, et 
    $$h'(x)=\frac{\mathrm{e}^{x}\times x^{2}-\mathrm{e}^{x}\times 2x}{x^{4}}=\frac{\mathrm{e}^{x}(x-2)}{x^{3}}$$
     Comme $\mathrm{e}^{x}>0$, le signe de $h'(x)$ est celui de $\dfrac{x-2}{x^{3}}$ : positif sur $]-\infty\,;0[$ (deux facteurs négatifs), négatif sur $]0\,;2[$, positif sur $]2\,;+\infty[$.

    Pour les limites : en $-\infty$, $\mathrm{e}^{x}\to 0$ et $x^{2}\to+\infty$, donc $h(x)\to 0$ (il n'y a pas de forme indéterminée) ; en $0$, $\mathrm{e}^{x}\to 1$ et $x^{2}\to 0^{+}$, donc $h(x)\to+\infty$ des deux côtés ; en $+\infty$, $h(x)\to+\infty$ par croissances comparées. Enfin $h(2)=\dfrac{\mathrm{e}^{2}}{4}\approx 1{,}847$.

    ![Figure](documents/figures/fae8a9ab8dae2b57.svg)

    On applique le théorème de la bijection sur chacun des trois intervalles où $h$ est continue et strictement monotone. Sur $]-\infty\,;0[$, $h$ prend une fois et une seule chaque valeur de $]0\,;+\infty[$. Sur $]0\,;2]$ et sur $[2\,;+\infty[$, elle prend chacune une fois chaque valeur de $\left[\frac{\mathrm{e}^{2}}{4}\,;+\infty\right[$, la valeur $\frac{\mathrm{e}^{2}}{4}$ n'étant atteinte qu'en $x=2$, commun aux deux intervalles. 
    $$\boxed{\begin{array}{ll} m\leqslant 0 : & \text{aucune solution} \\[2pt] 0<m<\frac{\mathrm{e}^{2}}{4} : & \text{une solution (négative)} \\[2pt] m=\frac{\mathrm{e}^{2}}{4} : & \text{deux solutions (une négative, et } x=2\text{)} \\[2pt] m>\frac{\mathrm{e}^{2}}{4} : & \text{trois solutions (une négative, deux positives)} \end{array}}$$

    ![Figure](documents/figures/0b38e5fc7d70ffbf.svg)

    On lit sur cette figure que la droite d'équation $y=m$ coupe la courbe de $h$ en un, deux ou trois points selon la position de $m$ par rapport au minimum local $\frac{\mathrm{e}^{2}}{4}$ : ce sont les solutions de l'équation.

    *Remarque.* Le passage à l'équation $h(x)=m$, qui *sépare le paramètre*, est la clé : étudier directement $x\mapsto\mathrm{e}^{x}-mx^{2}$ obligerait à refaire une étude pour chaque valeur de $m$. Pour $m=1$, par exemple, on apprend sans calcul que les courbes de $\exp$ et de $x\mapsto x^{2}$ ne se coupent qu'une fois, en un point d'abscisse voisine de $-0{,}70$.
