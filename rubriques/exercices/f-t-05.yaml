  enonce: |
    **Partie A : une fonction auxiliaire**

    On considère la fonction $g$ définie sur $\mathbb{R}$ par $g(x)=\mathrm{e}^{x}-x-2$, dont la courbe est représentée ci-dessous.

    ![Figure](documents/figures/480b23054e9dab72.svg)

    **1.** **Lecture graphique.** Conjecturer, à l'aide de la figure, le nombre de solutions de l'équation $g(x)=0$, un encadrement de chacune à l'unité, ainsi que le signe de $g(x)$ sur $\mathbb{R}$.

    **2.** Déterminer les limites de $g$ en $-\infty$ et en $+\infty$.

    **3.** Calculer $g'(x)$, étudier son signe, puis dresser le tableau de variations de $g$.

    **4.** Démontrer que l'équation $g(x)=0$ admet exactement deux solutions $\alpha$ et $\beta$, avec $\alpha<0<\beta$.

    **5.** Donner un encadrement de $\alpha$ et de $\beta$ d'amplitude $0{,}1$.

    **6.** En déduire le signe de $g(x)$ sur $\mathbb{R}$.

    **Partie B : la fonction étudiée**

    On considère la fonction $f$ définie sur $\mathbb{R}$ par 
    $$f(x)=\mathrm{e}^{x}-\frac{x^{2}}{2}-2x$$

    **7.** Calculer $f'(x)$ et vérifier que $f'(x)=g(x)$.

    **8.** En utilisant la partie A, dresser le tableau de variations de $f$ sur $\mathbb{R}$.

    **9.** Déterminer les limites de $f$ en $-\infty$ et en $+\infty$. *On factorisera par $x^{2}$ en $+\infty$.*

    **10.** Démontrer que $\mathrm{e}^{\alpha}=\alpha+2$, puis en déduire que 
    $$f(\alpha)=2-\alpha-\frac{\alpha^{2}}{2}$$
     *Cette écriture a l'avantage de ne plus contenir d'exponentielle.*

    **11.** Déterminer de même une expression de $f(\beta)$ sans exponentielle, puis en donner une valeur approchée au centième.
  corrige: |
    **Partie A**

    **1.** **Lecture graphique.** La courbe coupe l'axe des abscisses en **deux** points, l'un d'abscisse comprise entre $-2$ et $-1$, l'autre entre $1$ et $2$. Elle est au-dessus de l'axe à l'extérieur de ces deux valeurs, et en dessous entre elles : $g$ semble donc positive sur $]-\infty\,;\alpha[$ et sur $]\beta\,;+\infty[$, négative sur $]\alpha\,;\beta[$.

    **2.** En $-\infty$ : $\mathrm{e}^{x}\to 0$ et $-x-2\to+\infty$, donc $\boxed{\lim_{x\to-\infty}g(x)=+\infty}$.

    En $+\infty$ : on factorise par $\mathrm{e}^{x}$, sous la forme $g(x)=\mathrm{e}^{x}\left(1-\dfrac{x}{\mathrm{e}^{x}}-\dfrac{2}{\mathrm{e}^{x}}\right)$, la parenthèse tendant vers $1$ : 
    $$\boxed{\lim_{x\to+\infty}g(x)=+\infty}$$

    **3.** $g'(x)=\mathrm{e}^{x}-1$, qui s'annule en $0$, est négatif avant et positif après.

    ![Figure](documents/figures/f58b581fab99de9d.svg)

    **4.** Sur $]-\infty\,;0]$, $g$ est continue et strictement décroissante de $+\infty$ à $-1<0$ : le théorème de la bijection donne une unique solution $\alpha$, qui vérifie $\alpha<0$. Sur $[0\,;+\infty[$, $g$ est continue et strictement croissante de $-1$ à $+\infty$ : une unique solution $\beta>0$. 
    $$\boxed{\text{L'équation } g(x)=0 \text{ admet exactement deux solutions } \alpha<0<\beta.}$$

    **5.** $g(-1{,}9)\approx 0{,}05>0$ et $g(-1{,}8)\approx-0{,}03<0$ ; $g(1{,}1)\approx-0{,}10<0$ et $g(1{,}2)\approx 0{,}12>0$ : 
    $$\boxed{-1{,}9<\alpha<-1{,}8 \qquad\text{et}\qquad 1{,}1<\beta<1{,}2}$$

    **6.** $\boxed{g>0 \text{ sur } ]-\infty\,;\alpha[\ \cup\ ]\beta\,;+\infty[ \quad\text{et}\quad g<0 \text{ sur } ]\alpha\,;\beta[.}$

    **Partie B**

    **7.** $f'(x)=\mathrm{e}^{x}-\dfrac{2x}{2}-2=\mathrm{e}^{x}-x-2=\boxed{g(x)}$

    **8.** Le signe de $f'$ est donc celui de $g$, déterminé à la question 6 :

    ![Figure](documents/figures/bc7702f998b92b42.svg)

    **9.** En $-\infty$ : $\mathrm{e}^{x}\to 0$ et $-\dfrac{x^{2}}{2}-2x\to-\infty$ (le terme en $x^{2}$ l'emporte), donc $\boxed{\lim_{x\to-\infty}f(x)=-\infty}$.

    En $+\infty$, on factorise par $x^{2}$ : 
    $$f(x)=x^{2}\left(\frac{\mathrm{e}^{x}}{x^{2}}-\frac{1}{2}-\frac{2}{x}\right)$$
     Par croissances comparées, $\dfrac{\mathrm{e}^{x}}{x^{2}}\to+\infty$, donc la parenthèse tend vers $+\infty$ : $\boxed{\lim_{x\to+\infty}f(x)=+\infty}$.

    **10.** Par définition, $g(\alpha)=0$, c'est-à-dire $\mathrm{e}^{\alpha}-\alpha-2=0$, soit $\boxed{\mathrm{e}^{\alpha}=\alpha+2}$. En reportant dans $f$ : 
    $$f(\alpha)=\mathrm{e}^{\alpha}-\frac{\alpha^{2}}{2}-2\alpha=(\alpha+2)-\frac{\alpha^{2}}{2}-2\alpha$$

    $$\boxed{f(\alpha)=2-\alpha-\frac{\alpha^{2}}{2}}$$

    **11.** Le même raisonnement s'applique à $\beta$, puisque $g(\beta)=0$ : 
    $$\boxed{f(\beta)=2-\beta-\frac{\beta^{2}}{2}}$$
     Avec $\beta\approx 1{,}146$ : $f(\beta)\approx 2-1{,}146-0{,}657\approx\boxed{0{,}20}$.
- id: "t-05-29"
  feuille: "f-t-05"
  numero: 29
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Algorithmique, Démonstration, Calcul]
  mots_cles: [seuil, suite, Python]
  noeuds: [ar-suites]
  notions: [suite]
  page_enonce: 10
