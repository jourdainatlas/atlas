  page_enonce: 9
  page_corrige: 14
  enonce: |
    Après injection, la quantité de médicament présente dans le sang d'un patient, exprimée en milligrammes, est modélisée par la fonction 
    $$Q(t)=5\,\mathrm{e}^{-0{,}4t}$$
     où $t$ désigne le temps écoulé depuis l'injection, en heures. La courbe de $Q$ est représentée ci-dessous, ainsi que les droites d'équations $y=2{,}5$ et $y=1$.

    ![Figure](documents/figures/599f494572b75cf6.svg)

    **1.** **Lecture graphique.** Estimer, par lecture de la figure :

    **(a)** la quantité présente au bout de $3$ heures ;

    **(b)** le temps au bout duquel la moitié de la dose a été éliminée ;

    **(c)** le temps au bout duquel il reste moins de $1$ mg de médicament.

    *Les questions 4 et 5 permettront de confirmer ces lectures par le calcul.*

    **2.** Quelle quantité a été injectée à l'instant initial ?

    **3.** Calculer $Q'(t)$ et en déduire le sens de variation de $Q$ sur $[0\,;+\infty[$. Ce résultat était-il prévisible ?

    **4.** Déterminer $\displaystyle\lim_{t\to+\infty}Q(t)$ et interpréter ce résultat dans le contexte.

    **5.** On appelle **demi-vie** le temps au bout duquel la quantité initiale a été divisée par deux. Calculer la demi-vie de ce médicament, en heures puis en heures et minutes.

    **6.** Le médicament n'est plus actif lorsque la quantité présente devient inférieure à $1$ mg. Au bout de combien de temps une nouvelle injection est-elle nécessaire ?

    **7.** Calculer $Q'(0)$ et interpréter ce nombre dans le contexte de l'exercice.
  corrige: |
    **1.** **Lecture graphique.**

    **(a)** Au bout de $3$ heures, on lit environ $\boxed{1{,}5 \text{ mg}}$.

    **(b)** La droite $y=2{,}5$ coupe la courbe pour $t\approx\boxed{1{,}7 \text{ h}}$.

    **(c)** La droite $y=1$ coupe la courbe pour $t\approx\boxed{4 \text{ h}}$.

    **2.** $Q(0)=5\,\mathrm{e}^{0}=\boxed{5 \text{ mg}}$

    **3.** $Q'(t)=5\times(-0{,}4)\mathrm{e}^{-0{,}4t}=\boxed{-2\,\mathrm{e}^{-0{,}4t}}$

    Ce nombre est strictement négatif pour tout $t$, donc $Q$ est strictement décroissante sur $[0\,;+\infty[$. C'était prévisible : le médicament est progressivement éliminé par l'organisme.

    **4.** Comme $-0{,}4t\to-\infty$, on a $\boxed{\lim_{t\to+\infty}Q(t)=0}$. 
    $$\boxed{\text{Le médicament finit par être totalement éliminé, sans jamais disparaître complètement.}}$$

    **5.** On résout $Q(t)=2{,}5$ : 
    $$5\,\mathrm{e}^{-0{,}4t}=2{,}5 \iff \mathrm{e}^{-0{,}4t}=0{,}5 \iff -0{,}4t=\ln(0{,}5) \iff t=\frac{\ln(2)}{0{,}4}$$

    $$\boxed{t=\frac{\ln(2)}{0{,}4}\approx 1{,}73 \text{ h, soit environ } 1 \text{ h } 44 \text{ min.}}$$
     Ce résultat confirme la lecture graphique de la question 1.(b).

    **6.** On résout $Q(t)<1$ : 
    $$5\,\mathrm{e}^{-0{,}4t}<1 \iff \mathrm{e}^{-0{,}4t}<0{,}2 \iff -0{,}4t<\ln(0{,}2) \iff t>\frac{\ln(5)}{0{,}4}$$

    $$\boxed{t>\frac{\ln(5)}{0{,}4}\approx 4{,}02 \text{ h : une nouvelle injection est nécessaire au bout d'environ } 4 \text{ heures.}}$$

    **7.** $Q'(0)=-2\,\mathrm{e}^{0}=\boxed{-2}$. 
    $$\boxed{\text{À l'instant de l'injection, le médicament s'élimine au rythme de } 2 \text{ mg par heure.}}$$
     C'est le moment où l'élimination est la plus rapide, puisque $|Q'|$ décroît ensuite.
