  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 193 et n° 22"
  page_enonce: 14
  page_corrige: 25
  enonce: |
    *Caractérisations de l'exponentielle et du logarithme.*

    **Partie A.** On se propose de déterminer les fonctions $f$ dérivables sur $\mathbb{R}$ telles que : 
    $$\text{pour tous réels } x \text{ et } y, \qquad f(x+y)=f(x)\,f(y)$$

    **1.** Soit $f$ une fonction vérifiant les conditions précédentes. Montrer que, pour tout réel $x$, $f'(x)=f'(0)\,f(x)$.

    **2.** Conclure.

    **Partie B.**

    **3.** Trouver les fonctions $f$ dérivables sur $]0\,;+\infty[$ telles que : 
    $$\text{pour tous réels } x>0 \text{ et } y>0, \qquad f(xy)=f(x)+f(y)$$
  corrige: |
    **Partie A**

    **1.** Fixons $y$. Les deux membres de l'égalité $f(x+y)=f(x)f(y)$ sont des fonctions dérivables de $x$, de dérivées respectives $f'(x+y)$ et $f'(x)f(y)$. Elles sont égales, donc $f'(x+y)=f'(x)f(y)$ pour tous réels $x$ et $y$. En prenant $x=0$, il vient $f'(y)=f'(0)f(y)$ pour tout réel $y$, ce qui est le résultat demandé.

    **2.** Notons $k=f'(0)$. Avec $x=y=0$, on obtient $f(0)=f(0)^{2}$, donc $f(0)=0$ ou $f(0)=1$.

    • Si $f(0)=0$, alors pour tout réel $x$, $f(x)=f(x+0)=f(x)f(0)=0$ : $f$ est la fonction nulle.

    • Si $f(0)=1$, posons $\varphi(x)=f(x)\,\mathrm{e}^{-kx}$. Alors $\varphi'(x)=\left(f'(x)-kf(x)\right)\mathrm{e}^{-kx}=0$ d'après la question 1. La fonction $\varphi$, de dérivée nulle sur l'intervalle $\mathbb{R}$, est constante, égale à $\varphi(0)=1$ : donc $f(x)=\mathrm{e}^{kx}$.

    Réciproquement, la fonction nulle convient, et $\mathrm{e}^{k(x+y)}=\mathrm{e}^{kx}\mathrm{e}^{ky}$ montre que $x\mapsto\mathrm{e}^{kx}$ convient pour tout réel $k$. 
    $$\boxed{\text{Les solutions sont la fonction nulle et les fonctions } x\mapsto\mathrm{e}^{kx},\ k\in\mathbb{R}.}$$
     *Remarque.* La fonction auxiliaire $\varphi$ est exactement celle qui sert, dans le cours, à démontrer l'unicité de l'exponentielle. En écrivant $k=\ln(a)$ avec $a>0$, on reconnaît les fonctions $x\mapsto a^{x}$ de l'exercice 21 : ce sont les seules fonctions dérivables qui transforment les sommes en produits.

    **Partie B**

    **3.** Soit $f$ une solution. Fixons $y>0$ et dérivons par rapport à $x$ les deux membres de $f(xy)=f(x)+f(y)$ : la dérivée de $x\mapsto f(xy)$ est $x\mapsto y\,f'(xy)$, d'où $y\,f'(xy)=f'(x)$. Pour $x=1$, on obtient $y\,f'(y)=f'(1)$, c'est-à-dire, en notant $c=f'(1)$ : 
    $$\text{pour tout } y>0, \qquad f'(y)=\frac{c}{y}$$
     La fonction $\psi=f-c\ln$ a donc une dérivée nulle sur l'intervalle $]0\,;+\infty[$ : elle est constante. Or, avec $x=y=1$, on a $f(1)=2f(1)$, donc $f(1)=0$, et $\psi(1)=0$. Ainsi $f=c\ln$. Réciproquement, $c\ln(xy)=c\ln(x)+c\ln(y)$ montre que ces fonctions conviennent. 
    $$\boxed{\text{Les solutions sont les fonctions } x\mapsto c\ln(x),\ c\in\mathbb{R}.}$$
     *Remarque.* Le choix $c=\dfrac{1}{\ln(10)}$ donne le logarithme décimal de l'exercice 21 : tous les logarithmes sont proportionnels. C'est cette propriété de transformer les produits en sommes qui faisait l'intérêt des tables de Briggs (exercice 30), et l'exercice montre qu'aucune autre fonction dérivable ne la possède.
