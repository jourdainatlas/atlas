  page_enonce: 6
  page_corrige: 20
  enonce: |
    On note $R(\theta)$ la matrice de la rotation de centre $O$ et d'angle $\theta$. On admet que faire tourner un point d'un angle $b$, puis d'un angle $a$, revient à le faire tourner d'un angle $a+b$.

    **1.** À l'aide de l'exercice 11, en déduire que $R(a)R(b)=R(a+b)$ pour tous réels $a$ et $b$.

    **2.** En développant le produit $R(a)R(b)$, retrouver les formules donnant $\cos(a+b)$ et $\sin(a+b)$.

    **3.** Montrer par récurrence que, pour tout $n\in\mathbb{N}^{*}$ et tout réel $x$, $R(x)^{n}=R(nx)$.

    **4.** Pour $x$ dans $\mathbb{R}$, exprimer $\cos(3x)$ en fonction de $\cos(x)$, et $\sin(3x)$ en fonction de $\sin(x)$, en calculant $R(x)^{3}$.
  corrige: |
    **1.** D'après l'exercice 11, tourner d'abord d'un angle $b$ puis d'un angle $a$ correspond à la matrice $R(a)R(b)$. Comme cela revient à tourner d'un angle $a+b$, les deux matrices transforment tout point de la même façon. En prenant les points $I(1;0)$ et $J(0;1)$, leurs premières puis secondes colonnes sont égales (exercice 12), donc $\boxed{R(a)R(b)=R(a+b)}$.

    **2.** On développe : 
    $$R(a)R(b)=\begin{pmatrix} \cos a\cos b-\sin a\sin b & -\cos a\sin b-\sin a\cos b \\ \sin a\cos b+\cos a\sin b & -\sin a\sin b+\cos a\cos b \end{pmatrix} =\begin{pmatrix} \cos(a+b) & -\sin(a+b) \\ \sin(a+b) & \cos(a+b) \end{pmatrix}$$
     En identifiant la première colonne : 
    $$\boxed{\cos(a+b)=\cos a\cos b-\sin a\sin b \qquad \sin(a+b)=\sin a\cos b+\cos a\sin b}$$
     Ce sont les formules d'addition du chapitre 5, qui découlent ici d'une évidence géométrique : deux rotations successives s'ajoutent.

    **3.** On note $\mathcal{P}_{n}$ : « $R(x)^{n}=R(nx)$ ».

    **Initialisation :** Pour $n=1$, l'égalité est immédiate.

    **Hérédité :** Si $\mathcal{P}_{k}$ est vraie pour un $k\in\mathbb{N}^{*}$, alors, d'après la question 1 : 
    $$R(x)^{k+1}=R(x)^{k}R(x)=R(kx)R(x)=R(kx+x)=R\big((k+1)x\big)$$

    **Conclusion :** $\mathcal{P}_{n}$ est vraie pour tout $n\in\mathbb{N}^{*}$. C'est la version matricielle de la formule de Moivre du chapitre 5.

    **4.** Notons $c=\cos(x)$ et $s=\sin(x)$. D'une part $R(x)^{2}=\begin{pmatrix} c^{2}-s^{2} & -2cs \\ 2cs & c^{2}-s^{2} \end{pmatrix}$, et d'autre part la première colonne de $R(x)^{3}=R(x)^{2}R(x)$ est : 
    $$\begin{pmatrix} (c^{2}-s^{2})c-2cs\times s \\ 2cs\times c+(c^{2}-s^{2})s \end{pmatrix}=\begin{pmatrix} c^{3}-3cs^{2} \\ 3c^{2}s-s^{3} \end{pmatrix}$$
     Comme $R(x)^{3}=R(3x)$, on identifie, puis on remplace $s^{2}$ par $1-c^{2}$ dans la première ligne et $c^{2}$ par $1-s^{2}$ dans la seconde : 
    $$\boxed{\cos(3x)=4\cos^{3}(x)-3\cos(x) \qquad \sin(3x)=3\sin(x)-4\sin^{3}(x)}$$
     Contrôle avec $x=\frac{\pi}{3}$ : $4\times\frac{1}{8}-3\times\frac{1}{2}=-1=\cos(\pi)$.
- id: "me-06-24"
  feuille: "f-me-06"
  numero: 24
  titre: "Somme des carrés des premiers entiers"
