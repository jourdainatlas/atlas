- id: "mp-08-01"
  feuille: "f-mp-08"
  numero: 1
  partie: "Entraînement : calcul de normes uniformes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [normes uniformes, convergence uniforme]
  noeuds: [fc-uniforme, tg-arctan]
  notions: [convergence-uniforme, arc-tangente, cosinus-sinus]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 1 ; BibM@th, Suites et séries de fonctions, exercices 2 et 7"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Majorations directes.* Pour chacune des suites suivantes, déterminer la limite simple $f$ sur l'intervalle indiqué, majorer $|f_{n}(x) - f(x)|$ indépendamment de $x$ lorsque c'est possible, et conclure quant à la convergence uniforme. En cas de non-convergence uniforme, donner des intervalles sur lesquels elle a lieu.

    ```tableau
    (a) $f_{n}(x) = \dfrac{x}{1 + nx}$ sur $\mathbb{R}_{+}$ ; ¦ (b) $f_{n}(x) = x\,\mathrm{e}^{-nx}$ sur $\mathbb{R}_{+}$ ;
    (c) $f_{n}(x) = \operatorname{Arctan}(nx)$ sur $\mathbb{R}_{+}$ ; ¦ (d) $f_{n}(x) = n\sin\dfrac{x}{n}$ sur $\mathbb{R}$ ;
    (e) $f_{n}(x) = \dfrac{n\,\mathrm{e}^{-x} + x^{2}}{n + x}$ sur $\mathbb{R}_{+}$ ; ¦ (f) $f_{n}(x) = \dfrac{nx^{2}}{1 + nx}$ sur $[0, 1]$ ;
    (g) $f_{n}(x) = \dfrac{n}{1 + n(1 + x)}$ sur $\mathbb{R}_{+}$ ; ¦ (h) $f_{n}(x) = \sqrt{x^{2} + \dfrac{1}{n^{2}}} - x$ sur $\mathbb{R}_{+}$.
    ```

    Pour (d), on pourra utiliser l'inégalité $|\sin u - u| \leqslant \frac{|u|^{3}}{6}$.
  corrige: |
    Dans chaque cas, on calcule la limite simple $f$, puis on cherche un majorant de $|f_{n}(x) - f(x)|$ qui ne dépend pas de $x$ (méthode du cours, section 8.2).

    **(a)** Pour $x \geqslant 0$, on a $0 \leqslant \frac{x}{1 + nx} < \frac{x}{nx} = \frac{1}{n}$ si $x > 0$, et $f_{n}(0) = 0$. La limite simple est nulle et $\lVert f_{n} \rVert_{\infty} = \frac{1}{n}$ (borne supérieure non atteinte, limite en $+\infty$). 
    $$\boxed{f_{n} \to 0 \text{ uniformément sur } \mathbb{R}_{+}, \quad \lVert f_{n} \rVert_{\infty} = \tfrac{1}{n}}$$

    **(b)** La fonction $x \mapsto x\,\mathrm{e}^{-nx}$ a pour dérivée $(1 - nx)\mathrm{e}^{-nx}$ : elle croît sur $[0, \frac{1}{n}]$ et décroît ensuite. 
    $$\boxed{f_{n} \to 0 \text{ uniformément sur } \mathbb{R}_{+}, \quad \lVert f_{n} \rVert_{\infty} = f_{n}\big(\tfrac{1}{n}\big) = \tfrac{1}{\mathrm{e} n}}$$

    **(c)** On a $f_{n}(0) = 0$ et $\operatorname{Arctan}(nx) \to \frac{\pi}{2}$ pour $x > 0$ : la limite $f$ est discontinue en $0$. Avec $x_{n} = \frac{1}{n}$, $|f_{n}(x_{n}) - f(x_{n})| = \frac{\pi}{2} - \frac{\pi}{4} = \frac{\pi}{4}$, donc la convergence n'est pas uniforme sur $\mathbb{R}_{+}$. Pour $x \geqslant a > 0$, comme $\frac{\pi}{2} - \operatorname{Arctan} u = \operatorname{Arctan}\frac{1}{u}$ pour $u > 0$, 
    $$0 \leqslant \frac{\pi}{2} - \operatorname{Arctan}(nx) = \operatorname{Arctan}\frac{1}{nx} \leqslant \operatorname{Arctan}\frac{1}{na} \xrightarrow[n \to +\infty]{} 0.$$

    $$\boxed{\text{CU sur } [a, +\infty[ \text{ pour tout } a > 0, \text{ pas sur } \mathbb{R}_{+}}$$

    **(d)** Pour $x$ fixé, $n\sin\frac{x}{n} \to x$. L'inégalité rappelée donne $\big|n\sin\frac{x}{n} - x\big| \leqslant n\frac{|x|^{3}}{6n^{3}} = \frac{|x|^{3}}{6n^{2}}$, majoré par $\frac{A^{3}}{6n^{2}}$ sur $[-A, A]$. Sur $\mathbb{R}$, en revanche, $x_{n} = n\pi$ donne $f_{n}(x_{n}) - x_{n} = -n\pi$. 
    $$\boxed{\text{CU sur tout segment, pas sur } \mathbb{R}}$$

    **(e)** La limite simple est $f(x) = \mathrm{e}^{-x}$, et 
    $$f_{n}(x) - \mathrm{e}^{-x} = \frac{n\,\mathrm{e}^{-x} + x^{2} - (n + x)\mathrm{e}^{-x}}{n + x} = \frac{x^{2} - x\,\mathrm{e}^{-x}}{n + x}.$$
     Sur $[0, A]$, ce quotient est majoré en valeur absolue par $\frac{A^{2} + A}{n}$. Sur $\mathbb{R}_{+}$, avec $x_{n} = n$, il vaut $\frac{n^{2} - n\,\mathrm{e}^{-n}}{2n} \to +\infty$ : la différence n'est même pas bornée. 
    $$\boxed{\text{CU sur tout segment de } \mathbb{R}_{+}, \text{ pas sur } \mathbb{R}_{+}}$$

    **(f)** Pour $x > 0$, $\frac{nx^{2}}{1 + nx} \to x$, et $f_{n}(0) = 0$ : la limite est $f(x) = x$. On calcule 
    $$|f_{n}(x) - x| = \frac{x}{1 + nx} \leqslant \frac{1}{n}.$$

    $$\boxed{f_{n} \to \mathrm{id} \text{ uniformément sur } [0, 1]}$$

    **(g)** La limite simple est $\frac{1}{1 + x}$, et la réduction au même dénominateur donne 
    $$\Big|\frac{n}{1 + n(1 + x)} - \frac{1}{1 + x}\Big| = \frac{1}{(1 + x)\big(1 + n(1 + x)\big)} \leqslant \frac{1}{n + 1}.$$

    $$\boxed{f_{n} \to \tfrac{1}{1 + x} \text{ uniformément sur } \mathbb{R}_{+}}$$

    **(h)** Pour $x \geqslant 0$, la quantité conjuguée donne 
    $$0 \leqslant \sqrt{x^{2} + \frac{1}{n^{2}}} - x = \frac{1/n^{2}}{\sqrt{x^{2} + 1/n^{2}} + x} \leqslant \frac{1/n^{2}}{1/n} = \frac{1}{n},$$
     avec égalité en $0$. 
    $$\boxed{f_{n} \to 0 \text{ uniformément sur } \mathbb{R}_{+}, \quad \lVert f_{n} \rVert_{\infty} = \tfrac{1}{n}}$$
     *Piège.* En (d) et (e), la convergence est uniforme sur tout segment mais pas sur l'intervalle entier : il faut toujours préciser l'ensemble sur lequel on affirme la convergence uniforme.
- id: "mp-08-02"
  feuille: "f-mp-08"
  numero: 2
  partie: "Entraînement : calcul de normes uniformes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes uniformes, équivalents]
  noeuds: [fc-uniforme, as-series]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercices 1 et 2 ; BibM@th, Suites et séries de fonctions, exercices 4 et 5"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Par étude de fonction.* Même question, en calculant $\lVert f_{n} - f \rVert_{\infty}$ exactement ou un équivalent :

    ```tableau
    (a) $f_{n}(x) = \dfrac{nx}{1 + n^{2}x^{2}}$ sur $\mathbb{R}_{+}$ ; ¦ (b) $f_{n}(x) = x^{n}(1 - x)$ sur $[0, 1]$ ;
    (c) $f_{n}(x) = nx^{n}(1 - x)$ sur $[0, 1]$ ; ¦ (d) $f_{n}(x) = x^{n}(1 - x)^{n}$ sur $[0, 1]$ ;
    (e) $f_{n}(x) = nx^{n}\ln x$ sur $]0, 1]$ ; ¦ (f) $f_{n}(x) = \mathrm{e}^{-nx}\sin(nx)$ sur $\mathbb{R}_{+}$ ;
    (g) $f_{n}(x) = \dfrac{1}{(1 + x^{2})^{n}}$ sur $\mathbb{R}$ ; ¦ (h) $f_{n}(x) = (\sin x)^{n}\cos x$ sur $\big[0, \frac{\pi}{2}\big]$.
    ```

    Pour (f), on montrera que $\lVert f_{n} \rVert_{\infty}$ ne dépend pas de $n$ et vaut $\frac{\mathrm{e}^{-\pi/4}}{\sqrt{2}}$.
  corrige: |
    On étudie chaque fois $f_{n} - f$ par dérivation pour obtenir la norme exacte.

    **(a)** La limite est nulle. La dérivée de $f_{n}$ est $\frac{n(1 - n^{2}x^{2})}{(1 + n^{2}x^{2})^{2}}$, nulle en $x = \frac{1}{n}$, où $f_{n}$ vaut $\frac{1}{2}$. Pour $a > 0$ et $n \geqslant \frac{1}{a}$, $f_{n}$ décroît sur $[a, +\infty[$, d'où $\lVert f_{n} \rVert_{\infty, [a, +\infty[} = \frac{na}{1 + n^{2}a^{2}} \leqslant \frac{1}{na}$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} = \tfrac{1}{2} : \text{ pas de CU sur } \mathbb{R}_{+} ; \ \text{CU sur } [a, +\infty[}$$

    **(b)** La limite est nulle. La dérivée $x^{n - 1}\big(n - (n + 1)x\big)$ s'annule en $\frac{n}{n + 1}$, d'où 
    $$\lVert f_{n} \rVert_{\infty} = \Big(\frac{n}{n + 1}\Big)^{n}\frac{1}{n + 1} \leqslant \frac{1}{n + 1}.$$

    $$\boxed{\text{CU sur } [0, 1], \quad \lVert f_{n} \rVert_{\infty} \sim \tfrac{1}{\mathrm{e} n}}$$

    **(c)** Par le calcul précédent, $\lVert f_{n} \rVert_{\infty} = \big(\frac{n}{n + 1}\big)^{n + 1} = \exp\big(-(n + 1)\ln(1 + \frac{1}{n})\big) \to \mathrm{e}^{-1}$. Sur $[0, a]$ avec $a < 1$, $|f_{n}(x)| \leqslant na^{n} \to 0$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} \to \tfrac{1}{\mathrm{e}} : \text{ pas de CU sur } [0, 1] ; \ \text{CU sur } [0, a], \ a < 1}$$

    **(d)** On écrit $f_{n}(x) = \big(x(1 - x)\big)^{n}$, et $x(1 - x) \leqslant \frac{1}{4}$ avec égalité en $\frac{1}{2}$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} = \tfrac{1}{4^{n}} : \text{ CU sur } [0, 1]}$$

    **(e)** La limite est nulle, y compris en $1$. La dérivée $nx^{n - 1}(n\ln x + 1)$ s'annule en $\mathrm{e}^{-1/n}$, où $f_{n}$ vaut $n\,\mathrm{e}^{-1} \cdot \big(-\frac{1}{n}\big) = -\frac{1}{\mathrm{e}}$. Pour $a \in ]0, 1[$ et $n$ tel que $\mathrm{e}^{-1/n} \geqslant a$, $|f_{n}|$ croît sur $]0, a]$, d'où $\lVert f_{n} \rVert_{\infty, ]0, a]} = na^{n}|\ln a| \to 0$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} = \tfrac{1}{\mathrm{e}} : \text{ pas de CU sur } ]0, 1] ; \ \text{CU sur } ]0, a], \ a < 1}$$

    **(f)** La limite est nulle. Avec $t = nx$, $\lVert f_{n} \rVert_{\infty} = \sup_{t \geqslant 0} \mathrm{e}^{-t}|\sin t|$, qui ne dépend pas de $n$. La dérivée de $\mathrm{e}^{-t}\sin t$ est $\mathrm{e}^{-t}(\cos t - \sin t)$ ; les extremums locaux sont aux points $\frac{\pi}{4} + k\pi$, où $|\mathrm{e}^{-t}\sin t| = \frac{\mathrm{e}^{-\pi/4 - k\pi}}{\sqrt{2}}$, maximal pour $k = 0$. Sur $[a, +\infty[$, $|f_{n}(x)| \leqslant \mathrm{e}^{-na}$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} = \tfrac{\mathrm{e}^{-\pi/4}}{\sqrt{2}} \approx 0{,}322 : \text{ pas de CU sur } \mathbb{R}_{+} ; \ \text{CU sur } [a, +\infty[}$$

    **(g)** La limite vaut $1$ en $0$ et $0$ ailleurs : elle est discontinue, donc la convergence n'est pas uniforme sur $\mathbb{R}$ (théorème 1). Pour $|x| \geqslant a > 0$, $f_{n}(x) \leqslant \frac{1}{(1 + a^{2})^{n}}$. 
    $$\boxed{\text{CU sur } \{|x| \geqslant a\}, \ a > 0, \text{ pas sur } \mathbb{R}}$$

    **(h)** La limite est nulle : $\cos\frac{\pi}{2} = 0$, et $\sin^{n}x \to 0$ pour $x < \frac{\pi}{2}$. La dérivée $\sin^{n - 1}x\,(n\cos^{2}x - \sin^{2}x)$ s'annule pour $\tan^{2}x = n$, soit $\sin x = \sqrt{\frac{n}{n + 1}}$ et $\cos x = \frac{1}{\sqrt{n + 1}}$. 
    $$\boxed{\lVert f_{n} \rVert_{\infty} = \Big(\frac{n}{n + 1}\Big)^{n/2}\frac{1}{\sqrt{n + 1}} \sim \frac{1}{\sqrt{\mathrm{e} n}} : \text{ CU sur } \big[0, \tfrac{\pi}{2}\big]}$$
- id: "mp-08-03"
  feuille: "f-mp-08"
  numero: 3
  partie: "Entraînement : calcul de normes uniformes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [normes uniformes, convergence uniforme, intégration, équivalents]
  noeuds: [fc-uniforme, ri-integrable, as-series]
  notions: [convergence-uniforme]
  source: "BibM@th, Suites et séries de fonctions, exercice 6 ; exercice composé pour la feuille (question 3)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Avec un paramètre.* Soit $a \in \mathbb{R}$.

    **1.** Pour $x \in [0, 1]$, on pose $f_{n}(x) = n^{a}x^{n}(1 - x)$. Montrer que $\lVert f_{n} \rVert_{\infty} \sim \frac{n^{a - 1}}{\mathrm{e}}$, et en déduire que $(f_{n})$ converge uniformément sur $[0, 1]$ si et seulement si $a < 1$.

    **2.** Même question pour $g_{n}(x) = n^{a}x\,\mathrm{e}^{-nx}$ sur $\mathbb{R}_{+}$.

    **3.** Calculer $\int_{0}^{1} f_{n}$. Pour quelles valeurs de $a$ a-t-on $\int_{0}^{1} f_{n} \to 0$ ? Qu'en conclure sur la réciproque du théorème d'intégration sur un segment ?
  corrige: |
    **1.** On reprend le calcul de l'exercice 2 (b). Pour tout $a$, la limite simple est nulle, car $n^{a}x^{n} \to 0$ pour $x < 1$, et 
    $$\lVert f_{n} \rVert_{\infty} = \frac{n^{a}}{n + 1}\Big(\frac{n}{n + 1}\Big)^{n} \sim \frac{n^{a - 1}}{\mathrm{e}},$$
     puisque $\big(1 + \frac{1}{n}\big)^{-n} \to \mathrm{e}^{-1}$. Cette norme tend vers $0$ si et seulement si $a < 1$. 
    $$\boxed{f_{n} \to 0 \text{ uniformément sur } [0, 1] \iff a < 1}$$

    **2.** On reprend l'exercice 1 (b) : le maximum de $x\,\mathrm{e}^{-nx}$ est $\frac{1}{\mathrm{e} n}$, d'où $\lVert g_{n} \rVert_{\infty} = \frac{n^{a - 1}}{\mathrm{e}}$ exactement ; la limite simple est encore nulle. 
    $$\boxed{g_{n} \to 0 \text{ uniformément sur } \mathbb{R}_{+} \iff a < 1}$$

    **3.** Le calcul est immédiat : 
    $$\int_{0}^{1} f_{n} = n^{a}\Big(\frac{1}{n + 1} - \frac{1}{n + 2}\Big) = \frac{n^{a}}{(n + 1)(n + 2)} \sim n^{a - 2}.$$

    $$\boxed{\int_{0}^{1} f_{n} \to 0 \iff a < 2}$$
     Pour $1 \leqslant a < 2$, les intégrales tendent vers $\int_{0}^{1} 0$ sans que la convergence soit uniforme : le théorème 3 donne une condition suffisante, non nécessaire.
- id: "mp-08-04"
  feuille: "f-mp-08"
  numero: 4
  partie: "Entraînement : calcul de normes uniformes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [normes uniformes, convergence uniforme, convergence sur tout segment]
  noeuds: [fc-uniforme]
  notions: [convergence-uniforme, convergence-uniforme-compact]
  source: "BibM@th, Suites et séries de fonctions, exercices 5 et 10 ; Suites et séries de fonctions (Prost, LLG), exercice 2"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Suites oscillantes.* Étudier la convergence simple, puis uniforme, des suites suivantes, et préciser des intervalles de convergence uniforme lorsqu'elle n'a pas lieu sur tout l'ensemble de définition : 
    $$\text{(a) } \frac{\sin(nx)}{1 + n^{2}x^{2}} \text{ sur } \mathbb{R} ; \qquad \text{(b) } \frac{\sin(nx)}{n\sqrt{x}} \text{ sur } \mathbb{R}_{+}^{*} ; \qquad \text{(c) } \cos^{n}\Big(\frac{x}{\sqrt{n}}\Big) \text{ sur } \mathbb{R}.$$
     Pour (b), on majorera $|\sin(nx)|$ de deux façons. Pour (c), on montrera que la limite est $x \mapsto \mathrm{e}^{-x^{2}/2}$, que la convergence n'est pas uniforme sur $\mathbb{R}$, et, à l'aide d'un développement limité de $\ln\cos$, qu'elle l'est sur tout segment.
  corrige: |
    **(a)** La limite simple est nulle, y compris en $0$. Avec $x_{n} = \frac{\pi}{2n}$, on obtient $f_{n}(x_{n}) = \frac{1}{1 + \pi^{2}/4} \approx 0{,}288$ pour tout $n$ : pas de convergence uniforme sur $\mathbb{R}$. Pour $|x| \geqslant a > 0$, $|f_{n}(x)| \leqslant \frac{1}{1 + n^{2}a^{2}}$. 
    $$\boxed{\text{CU sur } \{|x| \geqslant a\}, \ a > 0, \text{ pas sur } \mathbb{R}}$$

    **(b)** On majore $|\sin(nx)|$ par $1$, puis par $nx$ : 
    $$|f_{n}(x)| \leqslant \min\Big(\frac{1}{n\sqrt{x}}, \sqrt{x}\Big) \leqslant \frac{1}{\sqrt{n}},$$
     le premier terme suffisant si $x \geqslant \frac{1}{n}$, le second si $x \leqslant \frac{1}{n}$. 
    $$\boxed{f_{n} \to 0 \text{ uniformément sur } \mathbb{R}_{+}^{*}, \quad \lVert f_{n} \rVert_{\infty} \leqslant \tfrac{1}{\sqrt{n}}}$$

    **(c)** Pour $x$ fixé et $n$ assez grand, $\big|\frac{x}{\sqrt{n}}\big| < \frac{\pi}{2}$, donc $\cos\frac{x}{\sqrt{n}} > 0$ et $f_{n}(x) = \exp\big(n\ln\cos\frac{x}{\sqrt{n}}\big)$. Le développement $\ln\cos u = -\frac{u^{2}}{2} + O(u^{4})$ donne $n\ln\cos\frac{x}{\sqrt{n}} \to -\frac{x^{2}}{2}$.

    *Non-uniformité sur $\mathbb{R}$.* Pour $x_{n} = \pi\sqrt{n}$, $f_{n}(x_{n}) = \cos^{n}\pi = (-1)^{n}$, alors que $\mathrm{e}^{-x_{n}^{2}/2} = \mathrm{e}^{-\pi^{2}n/2} \to 0$.

    *Uniformité sur $[-A, A]$.* La fonction $r(u) = \ln\cos u + \frac{u^{2}}{2}$ vérifie $\frac{r(u)}{u^{4}} \to -\frac{1}{12}$ en $0$ ; elle est donc majorée par $C u^{4}$ sur $[-1, 1]$, pour une constante $C$. Pour $n \geqslant A^{2}$ et $|x| \leqslant A$, $\big|\frac{x}{\sqrt{n}}\big| \leqslant 1$ et 
    $$n\ln\cos\frac{x}{\sqrt{n}} = -\frac{x^{2}}{2} + \rho_{n}(x), \qquad |\rho_{n}(x)| \leqslant \frac{CA^{4}}{n}.$$
     Comme $|\mathrm{e}^{y} - 1| \leqslant \mathrm{e}^{|y|} - 1$, on obtient $|f_{n}(x) - \mathrm{e}^{-x^{2}/2}| = \mathrm{e}^{-x^{2}/2}|\mathrm{e}^{\rho_{n}(x)} - 1| \leqslant \mathrm{e}^{CA^{4}/n} - 1 \to 0$. 
    $$\boxed{\cos^{n}\tfrac{x}{\sqrt{n}} \to \mathrm{e}^{-x^{2}/2} : \text{ CU sur tout segment, pas sur } \mathbb{R}}$$
     Cette limite gaussienne annonce le théorème central limite.
- id: "mp-08-05"
  feuille: "f-mp-08"
  numero: 5
  partie: "Convergence simple, convergence uniforme"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [convergence simple et uniforme, convergence simple, convergence uniforme]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme, fonction-convexe]
  source: "BibM@th, Suites et séries de fonctions, exercices 1 et 14"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Ce qui passe à la limite simple.* Soit $(f_{n})$ une suite de fonctions de $I$ dans $\mathbb{R}$, convergeant simplement vers $f$ sur l'intervalle $I$.

    **1.** Montrer que si les $f_{n}$ sont croissantes, alors $f$ est croissante ; si les $f_{n}$ sont $T$-périodiques, alors $f$ est $T$-périodique ; si les $f_{n}$ sont convexes, alors $f$ est convexe.

    **2.** Montrer par un exemple que les $f_{n}$ peuvent être strictement croissantes sans que $f$ le soit.

    **3.** Montrer que si la convergence est uniforme et si les $f_{n}$ sont bornées, alors $f$ est bornée. Que devient ce résultat pour une convergence seulement simple ? On pourra considérer la suite définie sur $\mathbb{R}_{+}$ par $f_{n}(x) = \min(x, n)$.
  corrige: |
    **1.** Chaque propriété s'écrit par des inégalités ou des égalités entre valeurs en un nombre fini de points, qui passent à la limite. Si $x \leqslant y$, alors $f_{n}(x) \leqslant f_{n}(y)$, d'où $f(x) \leqslant f(y)$. De même $f_{n}(x + T) = f_{n}(x)$ donne $f(x + T) = f(x)$, et l'inégalité de convexité 
    $$f_{n}(tx + (1 - t)y) \leqslant tf_{n}(x) + (1 - t)f_{n}(y)$$
     passe à la limite pour $x$, $y$, $t$ fixés. 
    $$\boxed{\text{croissance, périodicité et convexité passent à la limite simple}}$$

    **2.** Les inégalités strictes deviennent larges à la limite : $f_{n}(x) = \frac{x}{n}$ est strictement croissante, de limite nulle.

    **3.** On fixe $N$ tel que $\lVert f_{N} - f \rVert_{\infty} \leqslant 1$, et $M_{N}$ un majorant de $|f_{N}|$ ; alors $|f(x)| \leqslant 1 + M_{N}$. Pour une convergence simple, chaque $f_{n}(x) = \min(x, n)$ est bornée par $n$ sur $\mathbb{R}_{+}$, mais la limite simple $x \mapsto x$ ne l'est pas. 
    $$\boxed{\text{limite uniforme de fonctions bornées : bornée ; faux pour la limite simple}}$$
     Pour la convergence uniforme, il suffit qu'*une* fonction $f_{N}$ soit bornée.
- id: "mp-08-06"
  feuille: "f-mp-08"
  numero: 6
  partie: "Convergence simple, convergence uniforme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence simple et uniforme, convergence uniforme]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme]
  source: "BibM@th, Suites et séries de fonctions, exercice 16"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *Produit de deux suites.* Soient $(f_{n})$ et $(g_{n})$ deux suites de fonctions de $A$ dans $\mathbb{K}$, convergeant uniformément vers $f$ et $g$.

    **1.** On suppose $f$ et $g$ bornées. Montrer que $(f_{n}g_{n})$ converge uniformément vers $fg$ sur $A$.

    **2.** Montrer que la conclusion est en défaut sans hypothèse de bornitude, avec $f_{n}(x) = g_{n}(x) = x + \frac{1}{n}$ sur $\mathbb{R}$.
  corrige: |
    **1.** On sépare les deux écarts : $f_{n}g_{n} - fg = (f_{n} - f)g_{n} + f(g_{n} - g)$. Pour $n$ assez grand, $\lVert g_{n} - g \rVert_{\infty} \leqslant 1$, donc $|g_{n}| \leqslant \lVert g \rVert_{\infty} + 1$, et 
    $$\lVert f_{n}g_{n} - fg \rVert_{\infty} \leqslant (\lVert g \rVert_{\infty} + 1)\lVert f_{n} - f \rVert_{\infty} + \lVert f \rVert_{\infty}\lVert g_{n} - g \rVert_{\infty} \to 0.$$

    $$\boxed{f_{n}g_{n} \to fg \text{ uniformément sur } A}$$

    **2.** On a $f_{n} \to \mathrm{id}$ uniformément sur $\mathbb{R}$, avec $\lVert f_{n} - \mathrm{id} \rVert_{\infty} = \frac{1}{n}$, mais 
    $$f_{n}(x)^{2} - x^{2} = \frac{2x}{n} + \frac{1}{n^{2}},$$
     qui n'est pas bornée sur $\mathbb{R}$. 
    $$\boxed{f_{n}^{2} \not\to x^{2} \text{ uniformément sur } \mathbb{R}}$$
