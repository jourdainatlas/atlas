  noeuds: [fc-uniforme, ri-integrable]
  notions: [convergence-simple, convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 3"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f \in \mathcal{C}([0, 1], \mathbb{R})$ et, pour $n \in \mathbb{N}$ et $x \in [0, 1]$, $f_{n}(x) = \int_{0}^{x} f(t^{n})\,\mathrm{d} t$.

    **1.** Déterminer la limite simple de $(f_{n})$. On découpera l'intervalle d'intégration en $[0, 1 - \delta]$ et $[1 - \delta, x]$.

    **2.** Montrer que la convergence est uniforme sur $[0, 1]$.
  corrige: |
    **1 et 2.** On montre directement la convergence uniforme vers $x \mapsto xf(0)$, qui donne aussi la limite simple. Pour $x \in [0, 1]$, 
    $$|f_{n}(x) - xf(0)| = \Big|\int_{0}^{x} \big(f(t^{n}) - f(0)\big)\,\mathrm{d} t\Big| \leqslant \int_{0}^{1} |f(t^{n}) - f(0)|\,\mathrm{d} t = \alpha_{n},$$
     majorant indépendant de $x$. Soit $\varepsilon > 0$, $M = \lVert f \rVert_{\infty}$, et $\delta \in ]0, 1[$ tel que $2M\delta \leqslant \varepsilon$. Par continuité de $f$ en $0$, il existe $\eta > 0$ tel que $|f(s) - f(0)| \leqslant \varepsilon$ pour $0 \leqslant s \leqslant \eta$. Pour $n$ tel que $(1 - \delta)^{n} \leqslant \eta$, on a $t^{n} \leqslant \eta$ sur $[0, 1 - \delta]$, d'où 
    $$\alpha_{n} \leqslant \int_{0}^{1 - \delta} \varepsilon\,\mathrm{d} t + \int_{1 - \delta}^{1} 2M\,\mathrm{d} t \leqslant \varepsilon + 2M\delta \leqslant 2\varepsilon.$$

    $$\boxed{f_{n} \to \big(x \mapsto xf(0)\big) \text{ uniformément sur } [0, 1]}$$
     *Piège.* On ne peut pas écrire « $f(t^{n}) \to f(0)$ uniformément sur $[0, 1]$ » : en $t = 1$, $f(t^{n}) = f(1)$. C'est l'intégrale qui gomme ce mauvais voisinage, de longueur $\delta$.
- id: "mp-08-09"
  feuille: "f-mp-08"
  numero: 9
  partie: "Convergence simple, convergence uniforme"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convergence simple et uniforme, convergence uniforme]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 12"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On définit une suite de fonctions sur $\mathbb{R}_{+}$ par $f_{0} = 0$ et $f_{n + 1}(t) = \sqrt{t + f_{n}(t)}$.

    **1.** Montrer que, pour $t$ fixé, la suite $(f_{n}(t))$ est croissante, et déterminer sa limite $\ell(t)$. On distinguera $t = 0$ et $t > 0$.

    **2.** La convergence est-elle uniforme sur $\mathbb{R}_{+}$ ?

    **3.** Montrer que, pour $t > 0$ et $n \geqslant 0$, $|f_{n + 1}(t) - \ell(t)| \leqslant \frac{|f_{n}(t) - \ell(t)|}{\ell(t)}$, et que $0 \leqslant \ell(t) - f_{1}(t) \leqslant 1$.

    **4.** En déduire que la convergence est uniforme sur $[a, +\infty[$ pour tout $a > 0$.
  corrige: |
    **1.** On note $\ell(t)$ la racine positive de $y^{2} - y - t = 0$, soit $\ell(t) = \frac{1}{2}\big(1 + \sqrt{1 + 4t}\big)$. Par récurrence, $0 \leqslant f_{n}(t) \leqslant f_{n + 1}(t) \leqslant \ell(t)$ : c'est vrai pour $n = 0$, et si $f_{n - 1} \leqslant f_{n} \leqslant \ell$, alors $f_{n + 1} = \sqrt{t + f_{n}}$ est comprise entre $\sqrt{t + f_{n - 1}} = f_{n}$ et $\sqrt{t + \ell} = \ell$. La suite croissante majorée converge vers $L \geqslant 0$ vérifiant $L^{2} = t + L$. Pour $t = 0$, tous les termes sont nuls ; pour $t > 0$, $L \geqslant f_{1}(t) = \sqrt{t} > 0$ exclut la racine négative ou nulle. 
    $$\boxed{\ell(0) = 0, \qquad \ell(t) = \frac{1 + \sqrt{1 + 4t}}{2} \ \ (t > 0)}$$

    **2.** La limite est discontinue en $0$, puisque $\ell(t) \to 1$ quand $t \to 0^{+}$, alors que les $f_{n}$ sont continues : par le théorème 1, la convergence n'est pas uniforme sur $\mathbb{R}_{+}$.

    **3.** On factorise la différence des carrés. Pour $t > 0$, $f_{n + 1}^{2} - \ell^{2} = (t + f_{n}) - (t + \ell) = f_{n} - \ell$, d'où 
    $$|f_{n + 1}(t) - \ell(t)| = \frac{|f_{n}(t) - \ell(t)|}{f_{n + 1}(t) + \ell(t)} \leqslant \frac{|f_{n}(t) - \ell(t)|}{\ell(t)}.$$
     Enfin $\ell(t) = \frac{1}{2} + \sqrt{\frac{1}{4} + t} \leqslant \frac{1}{2} + \frac{1}{2} + \sqrt{t}$, d'où $0 \leqslant \ell(t) - f_{1}(t) \leqslant 1$.

    **4.** La fonction $\ell$ croît, donc $\ell(t) \geqslant q = \ell(a) > 1$ sur $[a, +\infty[$, et par récurrence 
    $$|f_{n}(t) - \ell(t)| \leqslant \frac{1}{q^{n - 1}} \qquad (n \geqslant 1, \ t \geqslant a).$$

    $$\boxed{f_{n} \to \ell \text{ uniformément sur } [a, +\infty[ \text{ pour tout } a > 0}$$
