  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme, de-derivee]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 18"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On pose $u_{n}(x) = (-1)^{n}\dfrac{\mathrm{e}^{-nx}}{n}$ pour $n \geqslant 1$.

    **1.** Déterminer le domaine de convergence simple de $\sum u_{n}$, et montrer que la convergence est uniforme sur $\mathbb{R}_{+}$. Est-elle normale ?

    **2.** On note $S$ la somme. Montrer que $S$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}_{+}^{*}$, et calculer $S'$.

    **3.** En déduire $S(x)$ pour $x > 0$, puis, par continuité, retrouver la valeur de $\sum_{n \geqslant 1} \frac{(-1)^{n - 1}}{n}$.
  corrige: |
    **1.** Pour $x < 0$, $|u_{n}(x)| \to +\infty$. Pour $x \geqslant 0$, $\big(\frac{\mathrm{e}^{-nx}}{n}\big)$ décroît vers $0$, et le critère des séries alternées donne $|R_{n}(x)| \leqslant \frac{\mathrm{e}^{-(n + 1)x}}{n + 1} \leqslant \frac{1}{n + 1}$. Comme $\lVert u_{n} \rVert_{\infty} = \frac{1}{n}$, la convergence n'est pas normale. 
    $$\boxed{D = \mathbb{R}_{+}, \ \text{CU sur } \mathbb{R}_{+}, \ \text{pas CN}}$$

    **2.** Sur $[a, +\infty[$, $|u_{n}'(x)| = \mathrm{e}^{-nx} \leqslant \mathrm{e}^{-na}$ : la série des dérivées converge normalement, et le théorème 6 (iv) donne 
    $$\boxed{S'(x) = \sum_{n \geqslant 1} (-1)^{n + 1}\mathrm{e}^{-nx} = \frac{\mathrm{e}^{-x}}{1 + \mathrm{e}^{-x}}}$$

    **3.** Une primitive de $S'$ est $-\ln(1 + \mathrm{e}^{-x})$ ; par le théorème 6 (ii), appliqué sur $[1, +\infty[$, $S(x) \to 0$ en $+\infty$, ce qui fixe la constante. Par continuité de $S$ en $0$ (convergence uniforme sur $\mathbb{R}_{+}$), $S(0) = -\ln 2$. 
    $$\boxed{S(x) = -\ln(1 + \mathrm{e}^{-x}), \qquad \sum_{n \geqslant 1} \frac{(-1)^{n - 1}}{n} = \ln 2}$$
- id: "mp-08-29"
  feuille: "f-mp-08"
  numero: 29
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [modes de convergence des séries, convergence simple, convergence uniforme, convergence normale]
  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme]
  notions: [convergence-uniforme, convergence-simple]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 20 ; BibM@th, Suites et séries de fonctions, exercice 23"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $(a_{n})_{n \geqslant 1}$ une suite décroissante de réels positifs, et $u_{n}(x) = a_{n}x^{n}(1 - x)$ pour $x \in [0, 1]$.

    **1.** Montrer que $\sum u_{n}$ converge simplement sur $[0, 1]$.

    **2.** Calculer $\lVert u_{n} \rVert_{\infty}$, et montrer que $\sum u_{n}$ converge normalement sur $[0, 1]$ si et seulement si $\sum \frac{a_{n}}{n}$ converge.

    **3.** Montrer que $\sum u_{n}$ converge uniformément sur $[0, 1]$ si et seulement si $a_{n} \to 0$. On majorera le reste à l'aide de la décroissance de $(a_{n})$.

    **4.** Donner une suite $(a_{n})$ pour laquelle la convergence est uniforme sans être normale. Que donne le cas $a_{n} = n^{\alpha}$, $\alpha \leqslant 0$ ?
  corrige: |
    **1.** Pour $x \in [0, 1[$, $0 \leqslant u_{n}(x) \leqslant a_{1}x^{n}$ ; pour $x = 1$, $u_{n}(1) = 0$.

    **2.** Par l'exercice 2 (b), $\sup_{[0, 1]} x^{n}(1 - x) = c_{n} = \frac{n^{n}}{(n + 1)^{n + 1}} \sim \frac{1}{\mathrm{e} n}$. 
    $$\boxed{\lVert u_{n} \rVert_{\infty} = a_{n}c_{n} \sim \frac{a_{n}}{\mathrm{e} n} : \ \text{CN} \iff \sum \frac{a_{n}}{n} \text{ converge}}$$

    **3.** La suite décroissante positive $(a_{n})$ a une limite $\ell \geqslant 0$. Si $\ell = 0$, la décroissance donne, pour $x \in [0, 1[$, 
    $$0 \leqslant R_{n}(x) \leqslant a_{n + 1}(1 - x)\sum_{k > n} x^{k} = a_{n + 1}x^{n + 1} \leqslant a_{n + 1},$$
     et $R_{n}(1) = 0$. Si $\ell > 0$, $R_{n}(x) \geqslant \ell x^{n + 1}$, de borne supérieure $\ell$ sur $[0, 1[$. 
    $$\boxed{\text{CU sur } [0, 1] \iff a_{n} \to 0}$$

    **4.** Pour $a_{n} = \frac{1}{\ln(n + 1)}$, $a_{n} \to 0$ mais $\frac{a_{n}}{n} \sim \frac{1}{n\ln n}$ (Bertrand). Pour $a_{n} = n^{\alpha}$, la série $\sum n^{\alpha - 1}$ converge si et seulement si $\alpha < 0$. 
    $$\boxed{a_{n} = \tfrac{1}{\ln(n + 1)} : \text{CU sans CN} ; \quad a_{n} = n^{\alpha} : \text{CN} \iff \text{CU} \iff \alpha < 0}$$
- id: "mp-08-30"
  feuille: "f-mp-08"
  numero: 30
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence des séries, convergence uniforme]
  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 7"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    *Produits infinis de fonctions.* Soit $(u_{n})$ une suite de fonctions continues sur un intervalle $I$, à valeurs dans $\mathbb{C}$, telle que $|u_{n}(x)| \leqslant a_{n}$ pour tout $x \in I$, où $\sum a_{n}$ est une série convergente. Pour $n \geqslant 1$, on pose $P_{n}(x) = \prod_{k = 1}^{n} \big(1 + u_{k}(x)\big)$.

    **1.** Montrer que $|P_{n}(x)| \leqslant \exp\big(\sum_{k = 1}^{+\infty} a_{k}\big)$ pour tous $n$ et $x$.

    **2.** En écrivant $P_{n} = P_{1} + \sum_{k = 1}^{n - 1} (P_{k + 1} - P_{k})$, montrer que $(P_{n})$ converge uniformément sur $I$ vers une fonction continue.

    **3.** Application : montrer que $x \mapsto \prod_{k = 1}^{+\infty} \big(1 - \frac{x^{2}}{k^{2}}\big)$ est définie et continue sur $\mathbb{R}$.
  corrige: |
    **1.** On utilise $1 + t \leqslant \mathrm{e}^{t}$ : $|P_{n}(x)| \leqslant \prod_{k \leqslant n} (1 + a_{k}) \leqslant \exp\big(\sum_{k \leqslant n} a_{k}\big) \leqslant M = \exp\big(\sum_{k \geqslant 1} a_{k}\big)$.

    **2.** On a $P_{k + 1} - P_{k} = P_{k}u_{k + 1}$, donc $\lVert P_{k + 1} - P_{k} \rVert_{\infty} \leqslant Ma_{k + 1}$. La série $\sum (P_{k + 1} - P_{k})$ de fonctions continues converge normalement sur $I$ (théorème 5), et ses sommes partielles sont les $P_{n} - P_{1}$. 
    $$\boxed{(P_{n}) \text{ converge uniformément sur } I \text{ vers une fonction continue}}$$

    **3.** Sur $[-A, A]$, $|u_{k}(x)| = \frac{x^{2}}{k^{2}} \leqslant \frac{A^{2}}{k^{2}}$ : la question 2 s'applique sur chaque $[-A, A]$, et la continuité étant locale, elle vaut sur $\mathbb{R}$. 
    $$\boxed{x \mapsto \prod_{k \geqslant 1} \Big(1 - \frac{x^{2}}{k^{2}}\Big) \text{ est continue sur } \mathbb{R}}$$
     Euler a montré que ce produit vaut $\frac{\sin(\pi x)}{\pi x}$ ; l'exercice 56 en contient la dérivée logarithmique.
- id: "mp-08-31"
  feuille: "f-mp-08"
  numero: 31
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence des séries, convergence normale, intégration]
  noeuds: [cx-convergence-uniforme, as-series, ri-integrable]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 31"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Primitives itérées.* Soit $u_{0} \in \mathcal{C}(\mathbb{R}_{+}, \mathbb{R})$ et, pour $n \in \mathbb{N}$ et $x \geqslant 0$, $u_{n + 1}(x) = \int_{0}^{x} u_{n}(t)\,\mathrm{d} t$.

    **1.** Soit $a > 0$ et $M = \lVert u_{0} \rVert_{\infty, [0, a]}$. Montrer que $|u_{n}(x)| \leqslant \frac{Mx^{n}}{n!}$ sur $[0, a]$, et en déduire que $\sum u_{n}$ converge normalement sur $[0, a]$. Justifier la continuité de sa somme $S$ sur $\mathbb{R}_{+}$.

    **2.** Montrer que $S(x) = u_{0}(x) + \int_{0}^{x} S(t)\,\mathrm{d} t$, puis que $S(x) = u_{0}(x) + \mathrm{e}^{x}\int_{0}^{x} \mathrm{e}^{-t}u_{0}(t)\,\mathrm{d} t$.

    **3.** Expliciter $S$ lorsque $u_{0} = \cos$.
  corrige: |
    **1.** Par récurrence, $|u_{n + 1}(x)| \leqslant \int_{0}^{x} \frac{Mt^{n}}{n!}\,\mathrm{d} t = \frac{Mx^{n + 1}}{(n + 1)!}$. Sur $[0, a]$, $\lVert u_{n} \rVert_{\infty} \leqslant \frac{Ma^{n}}{n!}$, terme général d'une série convergente. 
    $$\boxed{\sum u_{n} \text{ CN sur } [0, a] \text{ pour tout } a > 0 ; \ S \text{ continue sur } \mathbb{R}_{+}}$$

    **2.** On intègre terme à terme (théorème 6 (iii)) : 
    $$\sum_{n \geqslant 0} u_{n + 1}(x) = \sum_{n \geqslant 0} \int_{0}^{x} u_{n} = \int_{0}^{x} S, \qquad\text{donc}\qquad S(x) = u_{0}(x) + \int_{0}^{x} S.$$
     La fonction $F(x) = \int_{0}^{x} S$ vérifie $F' = F + u_{0}$ et $F(0) = 0$ ; la méthode de variation de la constante (chapitre 6 de MPSI) donne $F(x) = \mathrm{e}^{x}\int_{0}^{x} \mathrm{e}^{-t}u_{0}(t)\,\mathrm{d} t$. 
    $$\boxed{S(x) = u_{0}(x) + \mathrm{e}^{x}\int_{0}^{x} \mathrm{e}^{-t}u_{0}(t)\,\mathrm{d} t}$$

    **3.** Avec $\int_{0}^{x} \mathrm{e}^{-t}\cos t\,\mathrm{d} t = \frac{1}{2}\big(1 + \mathrm{e}^{-x}(\sin x - \cos x)\big)$, on trouve 
    $$\boxed{S(x) = \frac{\cos x + \sin x + \mathrm{e}^{x}}{2}}$$
     On le vérifie en sommant directement : $u_{1} = \sin$, $u_{2} = 1 - \cos$, $u_{3} = x - \sin$, etc.
- id: "mp-08-32"
  feuille: "f-mp-08"
  numero: 32
