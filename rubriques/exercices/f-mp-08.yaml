  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Une belle bosse.* Pour $n \geqslant 1$, soit $f_{n}$ la fonction égale à $\big(1 - \frac{x}{n}\big)^{n}$ sur $[0, n]$ et nulle sur $]n, +\infty[$.

    **1.** Montrer que $(f_{n})$ converge simplement vers $x \mapsto \mathrm{e}^{-x}$ sur $\mathbb{R}_{+}$, et que $0 \leqslant f_{n}(x) \leqslant \mathrm{e}^{-x}$.

    **2.** On pose $\delta_{n} = \mathrm{e}^{-x} - f_{n}$. Montrer que $\lVert \delta_{n} \rVert_{\infty, [n, +\infty[} = \mathrm{e}^{-n}$, puis, en étudiant $\delta_{n}$ en un point $x_{n}$ de $]0, n[$ où $\delta_{n}'(x_{n}) = 0$, que $\lVert \delta_{n} \rVert_{\infty, [0, n]} \leqslant \frac{1}{\mathrm{e} n}$. Conclure.

    **3.** Calculer $\int_{0}^{n} f_{n}(x)\,\mathrm{d} x$, et déterminer $\lim_{n \to +\infty} \int_{0}^{1} f_{n}(x)\,\mathrm{d} x$.
  corrige: |
    **1.** Pour $x$ fixé et $n > x$, $f_{n}(x) = \exp\big(n\ln(1 - \frac{x}{n})\big)$ et $n\ln(1 - \frac{x}{n}) \to -x$. L'inégalité $\ln(1 - u) \leqslant -u$ donne $f_{n}(x) \leqslant \mathrm{e}^{-x}$ sur $[0, n[$, et l'inégalité est claire ailleurs. 
    $$\boxed{0 \leqslant f_{n}(x) \leqslant \mathrm{e}^{-x}, \qquad f_{n}(x) \to \mathrm{e}^{-x}}$$

    **2.** Sur $[n, +\infty[$, $\delta_{n}(x) = \mathrm{e}^{-x}$, de borne supérieure $\mathrm{e}^{-n}$. Sur $[0, n]$, la fonction continue $\delta_{n} \geqslant 0$ vaut $0$ en $0$ et $\mathrm{e}^{-n}$ en $n$ ; si son maximum est atteint en un point intérieur $x_{n}$, alors 
    $$\delta_{n}'(x_{n}) = -\mathrm{e}^{-x_{n}} + \Big(1 - \frac{x_{n}}{n}\Big)^{n - 1} = 0, \qquad\text{d'où}\qquad \delta_{n}(x_{n}) = \mathrm{e}^{-x_{n}} - \Big(1 - \frac{x_{n}}{n}\Big)\mathrm{e}^{-x_{n}} = \frac{x_{n}\mathrm{e}^{-x_{n}}}{n} \leqslant \frac{1}{\mathrm{e} n}.$$
     Comme $\mathrm{e}^{-n} \leqslant \frac{1}{\mathrm{e} n}$, on obtient $\lVert \delta_{n} \rVert_{\infty} \leqslant \frac{1}{\mathrm{e} n}$. 
    $$\boxed{f_{n} \to \mathrm{e}^{-x} \text{ uniformément sur } \mathbb{R}_{+}}$$

    **3.** Le calcul est direct, puis le théorème 3 s'applique sur $[0, 1]$ : 
    $$\int_{0}^{n} \Big(1 - \frac{x}{n}\Big)^{n}\mathrm{d} x = \Big[-\frac{n}{n + 1}\Big(1 - \frac{x}{n}\Big)^{n + 1}\Big]_{0}^{n} = \frac{n}{n + 1}, \qquad \int_{0}^{1} f_{n} \to \int_{0}^{1} \mathrm{e}^{-x}\,\mathrm{d} x.$$

    $$\boxed{\int_{0}^{n} f_{n} = \frac{n}{n + 1}, \qquad \lim \int_{0}^{1} f_{n} = 1 - \frac{1}{\mathrm{e}}}$$
     La limite $1$ des intégrales sur $[0, n]$ sera interprétée au chapitre 12 comme $\int_{0}^{+\infty} \mathrm{e}^{-x}\,\mathrm{d} x$ ; le théorème 3, limité aux segments, ne permet pas de l'obtenir.
- id: "mp-08-11"
  feuille: "f-mp-08"
  numero: 11
  partie: "Convergence simple, convergence uniforme"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [convergence simple et uniforme, convergence simple, convergence uniforme, convergence sur tout segment]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme, convergence-uniforme-compact]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 14"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Second théorème de Dini.* Soient $a < b$ et $(f_{n})$ une suite de fonctions *croissantes* de $[a, b]$ dans $\mathbb{R}$, qui converge simplement vers une fonction $f$ *continue*. Pour $p \in \mathbb{N}^{*}$, on pose $a_{k} = a + k\frac{b - a}{p}$ pour $0 \leqslant k \leqslant p$.

    **1.** Montrer que $f$ est croissante. Soit $\varepsilon > 0$ ; montrer qu'il existe $p$ tel que $f(a_{k + 1}) - f(a_{k}) \leqslant \varepsilon$ pour tout $k \in \llbracket 0\,,p - 1 \rrbracket$.

    **2.** Pour $x \in [a_{k}, a_{k + 1}]$, encadrer $f_{n}(x) - f(x)$ à l'aide de $f_{n}(a_{k}) - f(a_{k + 1})$ et $f_{n}(a_{k + 1}) - f(a_{k})$, et en déduire que la convergence est uniforme sur $[a, b]$.

    **3.** *Application.* Montrer que la suite $x \mapsto \big(1 + \frac{x}{n}\big)^{n}$ converge uniformément vers $\exp$ sur tout segment de $\mathbb{R}$.
  corrige: |
    **1.** La croissance passe à la limite (exercice 5). Par le théorème de Heine (chapitre 5), $f$ est uniformément continue sur $[a, b]$ : pour $\eta$ associé à $\varepsilon$, tout $p \geqslant \frac{b - a}{\eta}$ convient.

    **2.** On encadre à l'aide de la monotonie. Pour $x \in [a_{k}, a_{k + 1}]$, $f_{n}(a_{k}) \leqslant f_{n}(x) \leqslant f_{n}(a_{k + 1})$ et $f(a_{k}) \leqslant f(x) \leqslant f(a_{k + 1})$, d'où 
    $$f_{n}(a_{k}) - f(a_{k + 1}) \leqslant f_{n}(x) - f(x) \leqslant f_{n}(a_{k + 1}) - f(a_{k}).$$
     Il n'y a qu'un nombre fini de points $a_{k}$ : il existe $N$ tel que $|f_{n}(a_{k}) - f(a_{k})| \leqslant \varepsilon$ pour tout $k$ et tout $n \geqslant N$. Alors $f_{n}(a_{k + 1}) - f(a_{k}) \leqslant \varepsilon + \big(f(a_{k + 1}) - f(a_{k})\big) \leqslant 2\varepsilon$, et de même la minoration par $-2\varepsilon$. 
    $$\boxed{\lVert f_{n} - f \rVert_{\infty} \leqslant 2\varepsilon \text{ pour } n \geqslant N : \text{ convergence uniforme}}$$

    **3.** Soit $A > 0$. Pour $n \geqslant A$ et $x \in [-A, A]$, $1 + \frac{x}{n} \geqslant 0$, donc $x \mapsto (1 + \frac{x}{n})^{n}$ est croissante sur $[-A, A]$ ; la limite simple $\exp$ est continue. Le théorème de Dini s'applique à la suite $(f_{n})_{n \geqslant A}$. 
    $$\boxed{\Big(1 + \frac{x}{n}\Big)^{n} \to \mathrm{e}^{x} \text{ uniformément sur tout segment}}$$
     *Piège.* Ce sont les *fonctions* $f_{n}$ qui sont croissantes en $x$, et non la suite $(f_{n}(x))$ en $n$ : il ne faut pas confondre avec le premier théorème de Dini.
- id: "mp-08-12"
  feuille: "f-mp-08"
  numero: 12
  partie: "Convergence simple, convergence uniforme"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [convergence simple et uniforme, convergence simple, convergence uniforme, convergence sur tout segment]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme, convergence-uniforme-compact, fonction-convexe]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 15 ; BibM@th, Suites et séries de fonctions, exercice 20"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Fonctions lipschitziennes, fonctions convexes.*

    **1.** Soit $\alpha > 0$ et $(f_{n})$ une suite de fonctions $\alpha$-lipschitziennes de $[a, b]$ dans $\mathbb{R}$, convergeant simplement vers $f$. Montrer que $f$ est $\alpha$-lipschitzienne et que la convergence est uniforme sur $[a, b]$. On utilisera une subdivision régulière de pas assez petit.

    **2.** Soit $(f_{n})$ une suite de fonctions convexes sur un intervalle ouvert $I$, convergeant simplement vers $f$. Montrer que $f$ est convexe. Soit $[c, d] \subset I$, et $c' < c$, $d' > d$ deux points de $I$. À l'aide de l'inégalité des pentes, montrer que les $f_{n}$ sont, à partir d'un certain rang, $\alpha$-lipschitziennes sur $[c, d]$ pour un même $\alpha$, et conclure que la convergence est uniforme sur tout segment de $I$.
  corrige: |
    **1.** L'inégalité $|f_{n}(x) - f_{n}(y)| \leqslant \alpha|x - y|$ passe à la limite. Soit $\varepsilon > 0$, $h = \frac{\varepsilon}{2\alpha}$, et $(a_{k})$ une subdivision de $[a, b]$ de pas au plus $h$. Il existe $N$ tel que $|f_{n}(a_{k}) - f(a_{k})| \leqslant \varepsilon$ pour tout $k$ et tout $n \geqslant N$. Pour $x \in [a, b]$ et $a_{k}$ tel que $|x - a_{k}| \leqslant h$, 
    $$|f_{n}(x) - f(x)| \leqslant |f_{n}(x) - f_{n}(a_{k})| + |f_{n}(a_{k}) - f(a_{k})| + |f(a_{k}) - f(x)| \leqslant 2\alpha h + \varepsilon = 2\varepsilon.$$

    $$\boxed{f \text{ est } \alpha\text{-lipschitzienne et } f_{n} \to f \text{ uniformément sur } [a, b]}$$

    **2.** La convexité passe à la limite simple (exercice 5). Pour $c \leqslant x < y \leqslant d$, l'inégalité des pentes donne 
    $$\frac{f_{n}(c) - f_{n}(c')}{c - c'} \leqslant \frac{f_{n}(y) - f_{n}(x)}{y - x} \leqslant \frac{f_{n}(d') - f_{n}(d)}{d' - d}.$$
     Les deux bornes sont des suites convergentes, donc bornées : il existe $\alpha$ tel que tous les $f_{n}$ soient $\alpha$-lipschitziennes sur $[c, d]$. La question 1 conclut. 
    $$\boxed{f \text{ convexe}, \ f_{n} \to f \text{ uniformément sur tout segment de } I}$$
     L'intervalle ouvert est indispensable : sur $[0, 1]$, les fonctions convexes $x^{n}$ convergent simplement sans convergence uniforme.
- id: "mp-08-13"
  feuille: "f-mp-08"
  numero: 13
  partie: "Continuité et double limite"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [double limite, convergence uniforme]
  noeuds: [fc-uniforme]
  notions: [convergence-uniforme]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Réfuter une convergence uniforme sans calcul.* Pour chacune des suites suivantes, déterminer la limite simple et montrer, à l'aide du théorème de continuité ou du théorème de la double limite, que la convergence n'est pas uniforme sur l'intervalle indiqué. Donner ensuite un intervalle aussi grand que possible sur lequel elle l'est. 
    $$\text{(a) } x^{1/n} \text{ sur } [0, 1] ; \qquad \text{(b) } \frac{1}{1 + x^{n}} \text{ sur } \mathbb{R}_{+} ; \qquad \text{(c) } \frac{x^{n}}{1 + x^{n}} \text{ sur } [0, 1[ ; \qquad \text{(d) } \Big(\frac{x}{1 + x}\Big)^{n} \text{ sur } \mathbb{R}_{+}.$$
     Pour (c) et (d), on pourra examiner les limites en $1$ et en $+\infty$.
  corrige: |
    Pour (a) et (b), la limite simple est discontinue alors que les $f_{n}$ sont continues : le théorème 1 interdit la convergence uniforme. Pour (c) et (d), la limite est continue, et c'est le théorème 2 qui conclut.

    **(a)** La limite vaut $0$ en $0$ et $1$ sur $]0, 1]$. Sur $[a, 1]$, $0 \leqslant 1 - x^{1/n} \leqslant 1 - a^{1/n} \to 0$. 
    $$\boxed{\text{CU sur } [a, 1], \ a > 0, \text{ pas sur } [0, 1]}$$

    **(b)** La limite vaut $1$ sur $[0, 1[$, $\frac{1}{2}$ en $1$, et $0$ sur $]1, +\infty[$. Pour $a < 1 < b$, 
    $$\Big|\frac{1}{1 + x^{n}} - 1\Big| = \frac{x^{n}}{1 + x^{n}} \leqslant a^{n} \ \text{ sur } [0, a], \qquad \frac{1}{1 + x^{n}} \leqslant \frac{1}{b^{n}} \ \text{ sur } [b, +\infty[.$$

    $$\boxed{\text{CU sur } [0, a] \text{ et sur } [b, +\infty[, \ a < 1 < b}$$

    **(c)** La limite est nulle sur $[0, 1[$. Si la convergence était uniforme, le théorème 2 appliqué en $a = 1$, avec $\ell_{n} = \lim_{x \to 1} f_{n}(x) = \frac{1}{2}$, donnerait $\lim_{x \to 1} 0 = \frac{1}{2}$. Sur $[0, a]$, $f_{n}(x) \leqslant a^{n}$. 
    $$\boxed{\text{CU sur } [0, a], \ a < 1, \text{ pas sur } [0, 1[}$$

    **(d)** La limite est nulle, car $0 \leqslant \frac{x}{1 + x} < 1$. En $+\infty$, chaque $f_{n}$ tend vers $1$ : le théorème 2 interdit la convergence uniforme sur $\mathbb{R}_{+}$. Sur $[0, A]$, $f_{n}(x) \leqslant \big(\frac{A}{1 + A}\big)^{n}$. 
    $$\boxed{\text{CU sur } [0, A], \text{ pas sur } \mathbb{R}_{+}}$$
- id: "mp-08-14"
  feuille: "f-mp-08"
  numero: 14
  partie: "Continuité et double limite"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [double limite, convergence uniforme, convergence sur tout segment]
  noeuds: [fc-uniforme]
  notions: [convergence-uniforme, convergence-uniforme-compact]
  source: "BibM@th, Suites et séries de fonctions, exercice 17"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Uniforme continuité.* Soit $(f_{n})$ une suite de fonctions uniformément continues de $\mathbb{R}$ dans $\mathbb{R}$, convergeant uniformément vers $f$ sur $\mathbb{R}$. Montrer que $f$ est uniformément continue. Le résultat subsiste-t-il si la convergence est seulement uniforme sur tout segment ? On pourra considérer $f_{n}(x) = \frac{x^{2}}{1 + x^{2}/n}$.
  corrige: |
    On reproduit l'argument en $3\varepsilon$ du théorème 1, avec deux points variables. Soit $\varepsilon > 0$. On fixe $N$ tel que $\lVert f_{N} - f \rVert_{\infty} \leqslant \varepsilon$, puis $\eta$ associé à $\varepsilon$ par l'uniforme continuité de $f_{N}$. Si $|x - y| \leqslant \eta$, alors 
    $$|f(x) - f(y)| \leqslant |f(x) - f_{N}(x)| + |f_{N}(x) - f_{N}(y)| + |f_{N}(y) - f(y)| \leqslant 3\varepsilon.$$

    $$\boxed{f \text{ est uniformément continue}}$$
     Le résultat tombe en défaut pour une convergence uniforme sur tout segment. La fonction proposée et sa dérivée sont 
    $$f_{n}(x) = \frac{nx^{2}}{n + x^{2}}, \qquad f_{n}'(x) = \frac{2n^{2}x}{(n + x^{2})^{2}} ;$$
     cette dérivée est continue et de limite nulle en $\pm\infty$, donc bornée : $f_{n}$ est lipschitzienne, donc uniformément continue. Sur $[-A, A]$, 
    $$|x^{2} - f_{n}(x)| = \frac{x^{4}}{n + x^{2}} \leqslant \frac{A^{4}}{n}.$$
     Mais la limite $x \mapsto x^{2}$ n'est pas uniformément continue : $(x + \frac{1}{x})^{2} - x^{2} \geqslant 2$ pour $x > 0$.
- id: "mp-08-15"
  feuille: "f-mp-08"
  numero: 15
  partie: "Continuité et double limite"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [double limite, convergence uniforme, théorème de Weierstrass]
  noeuds: [fc-uniforme, fc-weierstrass]
  notions: [convergence-uniforme]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Convergence continue.* Soit $(f_{n})$ une suite de fonctions continues sur $[a, b]$ et $f : [a, b] \to \mathbb{R}$.

    **1.** On suppose que $(f_{n})$ converge uniformément vers $f$. Montrer que, pour toute suite $(x_{n})$ de $[a, b]$ convergeant vers $x$, la suite $(f_{n}(x_{n}))$ converge vers $f(x)$.

    **2.** Réciproquement, on suppose que $f_{n}(x_{n}) \to f(x)$ pour toute suite $(x_{n})$ de $[a, b]$ de limite $x$. Montrer que $f$ est continue. Montrer par l'absurde, à l'aide du théorème de Bolzano-Weierstrass, que la convergence est uniforme.

    **3.** Les suites $(x^{n})$ sur $[0, 1]$ et $(\mathrm{e}^{-nx}\sin(nx))$ sur $[0, 1]$ vérifient-elles la propriété de la question 2 ?
  corrige: |
    **1.** On sépare l'écart en deux termes. La fonction $f$ est continue (théorème 1), et 
    $$|f_{n}(x_{n}) - f(x)| \leqslant \lVert f_{n} - f \rVert_{\infty} + |f(x_{n}) - f(x)| \xrightarrow[n \to +\infty]{} 0.$$

    **2.** En prenant des suites constantes, $(f_{n})$ converge simplement vers $f$.

    *Continuité de $f$.* Soit $(y_{k})$ une suite de $[a, b]$ de limite $x$. On construit par récurrence des entiers $m_{1} < m_{2} < \cdots$ tels que $|f_{m_{k}}(y_{k}) - f(y_{k})| \leqslant \frac{1}{k}$, puis l'on pose $x_{n} = y_{k}$ pour $m_{k} \leqslant n < m_{k + 1}$ (et $x_{n} = x$ pour $n < m_{1}$). Alors $x_{n} \to x$, donc $f_{n}(x_{n}) \to f(x)$, et en particulier $f_{m_{k}}(y_{k}) \to f(x)$. Il vient $f(y_{k}) \to f(x)$.

    *Uniformité.* Sinon, il existe $\varepsilon > 0$, une extractrice $\varphi$ et des points $z_{n}$ tels que $|f_{\varphi(n)}(z_{n}) - f(z_{n})| \geqslant \varepsilon$. Par le théorème de Bolzano-Weierstrass, quitte à extraire encore, $z_{n} \to z$. On complète comme ci-dessus la suite $(z_{n})$, indexée par $\varphi(n)$, en une suite $(x_{m})$ de limite $z$ ; alors $f_{\varphi(n)}(z_{n}) \to f(z)$, et $f(z_{n}) \to f(z)$ par continuité de $f$, ce qui contredit l'inégalité. 
    $$\boxed{\text{sur un segment : } \big(f_{n}(x_{n}) \to f(x) \text{ pour toute } x_{n} \to x\big) \iff f_{n} \to f \text{ uniformément}}$$

    **3.** Les deux suites ne convergent pas uniformément sur $[0, 1]$ ; on exhibe une suite qui met la propriété en défaut. Pour la première, $x_{n} = 1 - \frac{1}{n}$ tend vers $1$ et $x_{n}^{n} \to \mathrm{e}^{-1} \neq f(1) = 1$. Pour la seconde, $x_{n} = \frac{\pi}{4n}$ tend vers $0$ et 
    $$\mathrm{e}^{-nx_{n}}\sin(nx_{n}) = \frac{\mathrm{e}^{-\pi/4}}{\sqrt{2}} \neq 0 = f(0).$$

    $$\boxed{\text{non dans les deux cas}}$$
