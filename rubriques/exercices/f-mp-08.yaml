  enonce: |
    Pour $x > 0$, on pose $f(x) = \sum_{n = 1}^{+\infty} \dfrac{1}{n + n^{2}x}$.

    **1.** Montrer que $f$ est définie, continue et décroissante sur $\mathbb{R}_{+}^{*}$.

    **2.** Montrer que $xf(x) \to \frac{\pi^{2}}{6}$ quand $x \to +\infty$.

    **3.** Montrer que $f(x) \to +\infty$ quand $x \to 0^{+}$. Plus précisément, à l'aide de la décomposition $\frac{1}{t(1 + tx)} = \frac{1}{t} - \frac{x}{1 + tx}$ et d'une comparaison avec une intégrale, établir 
    $$\ln\frac{1 + x}{x} \leqslant f(x) \leqslant \frac{1}{1 + x} + \ln\frac{1 + x}{x},$$
     et en déduire un équivalent de $f$ en $0^{+}$.
  corrige: |
    **1.** Sur $[a, +\infty[$, $0 < \frac{1}{n + n^{2}x} \leqslant \frac{1}{n^{2}a}$ : convergence normale, donc continuité ; chaque terme décroît en $x$. 
    $$\boxed{f \text{ continue et décroissante sur } \mathbb{R}_{+}^{*}}$$

    **2.** On a $xf(x) = \sum \frac{1}{n^{2} + n/x}$, terme majoré par $\frac{1}{n^{2}}$ et de limite $\frac{1}{n^{2}}$ en $+\infty$ ; le théorème 6 (ii) s'applique sur $[1, +\infty[$. 
    $$\boxed{xf(x) \to \sum \frac{1}{n^{2}} = \frac{\pi^{2}}{6}, \qquad f(x) \underset{+\infty}{\sim} \frac{\pi^{2}}{6x}}$$

    **3.** Pour tout $N$, $f(x) \geqslant \sum_{n \leqslant N} \frac{1}{n + n^{2}x} \to H_{N}$ quand $x \to 0$, et $H_{N} \to +\infty$. Pour l'encadrement, $\varphi(t) = \frac{1}{t(1 + tx)}$ décroît sur $[1, +\infty[$ et admet la primitive $\ln\frac{t}{1 + tx}$, d'où 
    $$\int_{1}^{M} \varphi = \ln\frac{M}{1 + Mx} + \ln(1 + x) \xrightarrow[M \to +\infty]{} \ln\frac{1 + x}{x}.$$
     La comparaison $\int_{1}^{N + 1} \varphi \leqslant \sum_{n = 1}^{N} \varphi(n) \leqslant \varphi(1) + \int_{1}^{N} \varphi$ et le passage à la limite donnent l'encadrement de l'énoncé, puis, comme $\ln(1 + x) \to 0$, 
    $$\boxed{f(x) \underset{0^{+}}{\sim} -\ln x}$$
- id: "mp-08-37"
  feuille: "f-mp-08"
  numero: 37
  partie: "Fonctions définies par une série"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions définies par une série, dérivation, équivalents]
  noeuds: [cx-convergence-uniforme, de-derivee, as-series]
  notions: []
  source: "BibM@th, Suites et séries de fonctions, exercice 36"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Pour $x > -1$, on pose $S(x) = \sum_{n = 1}^{+\infty} \Big(\dfrac{1}{n} - \dfrac{1}{n + x}\Big)$.

    **1.** Montrer que $S$ est définie, de classe $\mathcal{C}^{1}$ et croissante sur $]-1, +\infty[$.

    **2.** Calculer $S(x + 1) - S(x)$, puis $S(p)$ pour $p \in \mathbb{N}$.

    **3.** Déterminer un équivalent de $S$ en $-1^{+}$, puis en $+\infty$, en encadrant $S(x)$ par $S(\lfloor x \rfloor)$ et $S(\lfloor x \rfloor + 1)$.
  corrige: |
    **1.** Le terme général vaut $u_{n}(x) = \frac{x}{n(n + x)}$. Soit $0 < a < 1$ et $A > 0$ ; pour $x \in [-1 + a, A]$ et $n \geqslant 1$, $n + x \geqslant n - 1 + a \geqslant an$, d'où 
    $$|u_{n}(x)| \leqslant \frac{\max(1, A)}{an^{2}}, \qquad 0 < u_{n}'(x) = \frac{1}{(n + x)^{2}} \leqslant \frac{1}{a^{2}n^{2}}.$$
     Les deux séries convergent normalement sur ce segment, et tout segment de $]-1, +\infty[$ est de cette forme. 
    $$\boxed{S \in \mathcal{C}^{1}(]-1, +\infty[), \qquad S'(x) = \sum_{n \geqslant 1} \frac{1}{(n + x)^{2}} > 0}$$

    **2.** La différence est télescopique : 
    $$S(x + 1) - S(x) = \lim_{N \to +\infty} \sum_{n = 1}^{N} \Big(\frac{1}{n + x} - \frac{1}{n + x + 1}\Big) = \frac{1}{x + 1}.$$

    $$\boxed{S(x + 1) - S(x) = \frac{1}{x + 1}, \qquad S(0) = 0, \qquad S(p) = H_{p} = \sum_{k = 1}^{p} \frac{1}{k}}$$

    **3.** En $-1^{+}$, $S(x) = S(x + 1) - \frac{1}{x + 1}$ avec $S(x + 1) \to S(0) = 0$. En $+\infty$, pour $p = \lfloor x \rfloor$, $H_{p} \leqslant S(x) \leqslant H_{p + 1}$, et $H_{p} \sim \ln p \sim \ln x$ (chapitre 20 de MPSI). 
    $$\boxed{S(x) \underset{-1^{+}}{\sim} -\frac{1}{x + 1}, \qquad S(x) \underset{+\infty}{\sim} \ln x}$$
     La fonction $S$ prolonge $p \mapsto H_{p}$ aux réels ; elle vaut $\psi(x + 1) + \gamma$, où $\psi = \frac{\Gamma'}{\Gamma}$ et où $\Gamma$ est la fonction d'Euler, étudiée au chapitre 13.
- id: "mp-08-38"
  feuille: "f-mp-08"
  numero: 38
  partie: "Fonctions définies par une série"
  etoiles: 2
