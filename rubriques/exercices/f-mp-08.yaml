  source: "Suites et séries de fonctions (Prost, LLG), exercice 17 ; BibM@th, Suites et séries de fonctions, exercice 24"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Étudier la convergence simple, normale et uniforme des séries de termes généraux suivants :

    **1.** $u_{n}(x) = \dfrac{x^{2n}}{1 + x^{2n}}$ sur $\mathbb{R}$ ;

    **2.** $u_{n}(x) = x\ln\Big(1 + \dfrac{1}{n}\Big) - \ln\Big(1 + \dfrac{x}{n}\Big)$ sur $\mathbb{R}_{+}$, pour $n \geqslant 1$ ; on utilisera l'encadrement 
    $$u - \frac{u^{2}}{2} \leqslant \ln(1 + u) \leqslant u, \qquad u \geqslant 0 ;$$

    **3.** $u_{n}(x) = nx^{2}\mathrm{e}^{-x\sqrt{n}}$ sur $\mathbb{R}_{+}$.
  corrige: |
    **1.** Pour $|x| < 1$, $u_{n}(x) \leqslant x^{2n}$ ; pour $|x| \geqslant 1$, $u_{n}(x) \geqslant \frac{1}{2}$. Sur $[-a, a]$ avec $a < 1$, $u_{n}(x) \leqslant a^{2n}$. Sur $]-1, 1[$, $\sup u_{n} = \frac{1}{2}$ (limite en $1$) ne tend pas vers $0$ : pas de convergence uniforme (proposition 4). 
    $$\boxed{D = ]-1, 1[, \ \text{CN sur } [-a, a], \ \text{ni CU ni CN sur } ]-1, 1[}$$

    **2.** On fait apparaître les écarts au développement limité : 
    $$u_{n}(x) = x\Big(\ln\Big(1 + \frac{1}{n}\Big) - \frac{1}{n}\Big) - \Big(\ln\Big(1 + \frac{x}{n}\Big) - \frac{x}{n}\Big), \qquad |u_{n}(x)| \leqslant \frac{x}{2n^{2}} + \frac{x^{2}}{2n^{2}}.$$
     Sur $[0, A]$, $|u_{n}| \leqslant \frac{A + A^{2}}{2n^{2}}$. Sur $\mathbb{R}_{+}$, $u_{n}(x) \sim x\ln(1 + \frac{1}{n})$ tend vers $+\infty$ en $+\infty$ : $u_{n}$ n'est pas bornée. 
    $$\boxed{\text{CS sur } \mathbb{R}_{+}, \ \text{CN sur } [0, A], \ \text{ni CU ni CN sur } \mathbb{R}_{+}}$$

    **3.** Pour $x > 0$, $u_{n}(x) = o(n^{-2})$ par croissances comparées, et $u_{n}(0) = 0$. La dérivée vaut $\sqrt{n}\,x(2 - x\sqrt{n})\mathrm{e}^{-x\sqrt{n}}$ ; elle s'annule en $\frac{2}{\sqrt{n}}$, où $u_{n}$ vaut $4\mathrm{e}^{-2}$, constante : pas de convergence uniforme sur $\mathbb{R}_{+}$. Sur $[a, +\infty[$ et pour $n \geqslant \frac{4}{a^{2}}$, $u_{n}$ décroît, donc $\lVert u_{n} \rVert_{\infty, [a, +\infty[} = na^{2}\mathrm{e}^{-a\sqrt{n}}$, terme d'une série convergente. 
    $$\boxed{\text{CS sur } \mathbb{R}_{+}, \ \text{CN sur } [a, +\infty[, \ \text{ni CU ni CN sur } \mathbb{R}_{+}}$$
- id: "mp-08-28"
  feuille: "f-mp-08"
  numero: 28
