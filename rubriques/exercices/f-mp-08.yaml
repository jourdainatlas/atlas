  source: "BibM@th, Suites et séries de fonctions, exercice 30"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Pour $x > 0$, on pose $S(x) = \sum_{n = 0}^{+\infty} \dfrac{(-1)^{n}}{1 + nx}$.

    **1.** Montrer que $S$ est définie et continue sur $\mathbb{R}_{+}^{*}$, et déterminer $\lim_{x \to +\infty} S(x)$.

    **2.** Montrer que $S$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}_{+}^{*}$. On vérifiera que la suite $\big(\frac{n}{(1 + nx)^{2}}\big)_{n}$ décroît à partir du rang $\frac{1}{x}$.
  corrige: |
    **1.** Pour $x > 0$, $\big(\frac{1}{1 + nx}\big)$ décroît vers $0$. Sur $[a, +\infty[$, $|R_{n}(x)| \leqslant \frac{1}{1 + (n + 1)a}$ : convergence uniforme, donc continuité. Sur $[1, +\infty[$, le terme d'indice $0$ vaut $1$ et les autres tendent vers $0$ en $+\infty$ ; le théorème 6 (ii) donne la limite. 
    $$\boxed{S \text{ continue sur } \mathbb{R}_{+}^{*}, \qquad \lim_{+\infty} S = 1}$$

    **2.** La dérivée du terme général vaut $(-1)^{n + 1}\frac{n}{(1 + nx)^{2}}$. La fonction $t \mapsto \frac{t}{(1 + tx)^{2}}$ a pour dérivée $\frac{1 - tx}{(1 + tx)^{3}}$ : elle décroît pour $t \geqslant \frac{1}{x}$. Sur $[a, +\infty[$ et pour $n \geqslant \frac{1}{a}$, la série des dérivées vérifie donc le critère des séries alternées à partir du rang $n$, avec 
    $$|R_{n}'(x)| \leqslant \frac{n + 1}{(1 + (n + 1)x)^{2}} \leqslant \frac{n + 1}{(n + 1)^{2}a^{2}} = \frac{1}{(n + 1)a^{2}}.$$

    $$\boxed{S \in \mathcal{C}^{1}(\mathbb{R}_{+}^{*})}$$
- id: "mp-08-39"
  feuille: "f-mp-08"
  numero: 39
  partie: "Fonctions définies par une série"
  etoiles: 2
  types: [Lecture graphique, Démonstration]
  mots_cles: [fonctions définies par une série, dérivation]
  noeuds: [cx-convergence-uniforme, de-derivee, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  source: "BibM@th, Suites et séries de fonctions, exercice 31"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Tangente verticale.* Pour $t \in \mathbb{R}$, on pose $S(t) = \sum_{n = 1}^{+\infty} \dfrac{\operatorname{Arctan}(nt)}{n^{2}}$.

    **1.** Montrer que $S$ est définie, continue et impaire sur $\mathbb{R}$, et calculer $\lim_{t \to +\infty} S(t)$.

    **2.** Montrer que $S$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{*}$.

    **3.** Montrer que $\frac{S(t)}{t} \to +\infty$ quand $t \to 0^{+}$. Interpréter graphiquement.
  corrige: |
    **1.** On a $|u_{n}(t)| \leqslant \frac{\pi}{2n^{2}}$ : convergence normale sur $\mathbb{R}$, et chaque terme est impair. Le théorème 6 (ii) en $+\infty$ donne 
    $$\boxed{\lim_{+\infty} S = \frac{\pi}{2}\sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{\pi^{3}}{12}}$$

    **2.** La dérivée du terme général vaut $\frac{1}{n(1 + n^{2}t^{2})}$, majorée par $\frac{1}{n^{3}a^{2}}$ pour $|t| \geqslant a$. 
    $$\boxed{S \in \mathcal{C}^{1}(\mathbb{R}^{*})}$$

    **3.** Pour $t > 0$, tous les termes sont positifs, donc pour tout $N$, 
    $$\frac{S(t)}{t} \geqslant \sum_{n = 1}^{N} \frac{\operatorname{Arctan}(nt)}{n^{2}t} \xrightarrow[t \to 0^{+}]{} \sum_{n = 1}^{N} \frac{1}{n} = H_{N}.$$

    $$\boxed{\frac{S(t) - S(0)}{t} \to +\infty : \text{ tangente verticale à l'origine}}$$
     La série des dérivées diverge en $0$, ce qui laissait prévoir le phénomène, sans le démontrer.
