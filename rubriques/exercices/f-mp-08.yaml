  noeuds: [fc-weierstrass, ri-integrable]
  notions: []
  source: "Suites et séries de fonctions (Prost, LLG), exercice 37 ; exercice composé pour la feuille (questions 2 et 3)"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    *Variations sur les moments.* Dans chaque cas, montrer que la fonction continue $f$ est nulle, ou préciser ce que l'on peut en dire.

    **1.** $f \in \mathcal{C}([0, 1], \mathbb{R})$ et $\int_{0}^{1} f(t)\,t^{n}\,\mathrm{d} t = 0$ pour tout entier $n \geqslant N$, où $N$ est fixé.

    **2.** $f \in \mathcal{C}([0, 1], \mathbb{R})$ et $\int_{0}^{1} f(t)\,\mathrm{e}^{nt}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$. On posera $u = \mathrm{e}^{t}$.

    **3.** $f \in \mathcal{C}([-1, 1], \mathbb{R})$ et $\int_{-1}^{1} f(t)\,t^{2n}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$. On montrera que $f$ est impaire, en approchant $u \mapsto f(\sqrt{u}) + f(-\sqrt{u})$ sur $[0, 1]$ par des polynômes.
  corrige: |
    **1.** La fonction $g(t) = t^{N}f(t)$ est continue et vérifie $\int_{0}^{1} g(t)t^{n}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$ : par la proposition 5, $g = 0$, donc $f = 0$ sur $]0, 1]$, puis en $0$ par continuité. 
    $$\boxed{f = 0}$$

    **2.** Le changement de variable $u = \mathrm{e}^{t}$ transforme la condition : 
    $$\int_{0}^{1} f(t)\mathrm{e}^{nt}\,\mathrm{d} t = \int_{1}^{\mathrm{e}} f(\ln u)u^{n - 1}\,\mathrm{d} u = \int_{1}^{\mathrm{e}} h(u)u^{n}\,\mathrm{d} u, \qquad h(u) = \frac{f(\ln u)}{u}.$$
     La fonction $h$ est continue sur $[1, \mathrm{e}]$ et la proposition 5 donne $h = 0$. 
    $$\boxed{f = 0}$$

    **3.** On pose $h(u) = f(\sqrt{u}) + f(-\sqrt{u})$, continue sur $[0, 1]$, de sorte que 
    $$\int_{-1}^{1} f(t)t^{2n}\,\mathrm{d} t = \int_{0}^{1} \big(f(t) + f(-t)\big)t^{2n}\,\mathrm{d} t = \int_{0}^{1} h(t^{2})t^{2n}\,\mathrm{d} t = 0.$$
     Par linéarité, $\int_{0}^{1} h(t^{2})P(t^{2})\,\mathrm{d} t = 0$ pour tout polynôme $P$. Soit $P_{k} \to h$ uniformément sur $[0, 1]$ ; alors $P_{k}(t^{2}) \to h(t^{2})$ uniformément sur $[0, 1]$, et $\int_{0}^{1} h(t^{2})^{2}\,\mathrm{d} t = 0$, donc $h = 0$. 
    $$\boxed{f \text{ est impaire}}$$
     Réciproquement, toute fonction impaire vérifie la condition : on ne peut pas conclure $f = 0$.
- id: "mp-08-46"
  feuille: "f-mp-08"
  numero: 46
  partie: "Approximation uniforme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [approximation uniforme, convergence uniforme, dérivation, théorème de Weierstrass]
  noeuds: [fc-weierstrass, fc-uniforme, de-derivee]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 38"
  page_enonce: 10
  page_corrige: 25
  enonce: |
    *Approximation simultanée.*

    **1.** Soient $f$, $g \in \mathcal{C}^{1}([a, b], \mathbb{C})$ et $x_{0} \in [a, b]$. Montrer que $\lVert f - g \rVert_{\infty} \leqslant |f(x_{0}) - g(x_{0})| + (b - a)\lVert f' - g' \rVert_{\infty}$.

    **2.** En déduire que pour toute $f \in \mathcal{C}^{1}([a, b], \mathbb{C})$, il existe une suite $(P_{n})$ de fonctions polynomiales telle que $P_{n} \to f$ et $P_{n}' \to f'$ uniformément sur $[a, b]$.

    **3.** Généraliser à $f \in \mathcal{C}^{k}([a, b], \mathbb{C})$ et aux dérivées d'ordre au plus $k$.
  corrige: |
    **1.** On écrit $f - g$ comme une intégrale de sa dérivée : 
    $$(f - g)(x) = (f - g)(x_{0}) + \int_{x_{0}}^{x} (f' - g'), \qquad\text{d'où}\qquad \boxed{\lVert f - g \rVert_{\infty} \leqslant |f(x_{0}) - g(x_{0})| + (b - a)\lVert f' - g' \rVert_{\infty}}$$

    **2.** On approche d'abord $f'$, puis on intègre. Le théorème 8 fournit des polynômes $Q_{n} \to f'$ uniformément ; on pose $P_{n}(x) = f(a) + \int_{a}^{x} Q_{n}$, polynôme vérifiant $P_{n}(a) = f(a)$ et $P_{n}' = Q_{n}$. La question 1 avec $x_{0} = a$ donne $\lVert f - P_{n} \rVert_{\infty} \leqslant (b - a)\lVert f' - Q_{n} \rVert_{\infty}$. 
    $$\boxed{P_{n} \to f \text{ et } P_{n}' \to f' \text{ uniformément}}$$

    **3.** Pour $f \in \mathcal{C}^{k}$, on approche $f^{(k)}$ par $Q_{n}$ et l'on pose $P_{n} = T + I^{k}Q_{n}$, où $T(x) = \sum_{j < k} \frac{f^{(j)}(a)}{j!}(x - a)^{j}$ et $I^{k}$ désigne la primitive $k$-ième nulle en $a$ avec ses $k - 1$ premières dérivées. Les $P_{n}^{(j)}$ et $f^{(j)}$ ont même valeur en $a$ pour $j < k$, et la question 1, appliquée de proche en proche, donne 
    $$\boxed{\lVert P_{n}^{(j)} - f^{(j)} \rVert_{\infty} \leqslant (b - a)^{k - j}\lVert Q_{n} - f^{(k)} \rVert_{\infty} \to 0 \qquad (0 \leqslant j \leqslant k)}$$
- id: "mp-08-47"
  feuille: "f-mp-08"
  numero: 47
  partie: "Approximation uniforme"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [approximation uniforme, convergence uniforme, théorème de Weierstrass]
  noeuds: [fc-weierstrass, fc-uniforme]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 39 ; BibM@th, Suites et séries de fonctions, exercice 13"
  page_enonce: 11
  page_corrige: 25
  enonce: |
    *Approximation polynomiale de la racine carrée.* On définit une suite de polynômes par $P_{0} = 0$ et $P_{n + 1} = P_{n} + \frac{1}{2}\big(X - P_{n}^{2}\big)$.

    **1.** Calculer $P_{1}$, $P_{2}$, et préciser le degré de $P_{n}$.

    **2.** Montrer que, pour $x \geqslant 0$, $P_{n + 1}(x) - \sqrt{x} = \big(P_{n}(x) - \sqrt{x}\big)\Big(1 - \frac{1}{2}\big(P_{n}(x) + \sqrt{x}\big)\Big)$.

    **3.** Montrer que $0 \leqslant P_{n}(x) \leqslant P_{n + 1}(x) \leqslant \sqrt{x}$ pour $x \in [0, 1]$, et en déduire la convergence simple de $(P_{n})$ vers $\sqrt{\cdot}$ sur $[0, 1]$.

    **4.** Montrer par récurrence que $0 \leqslant \sqrt{x} - P_{n}(x) \leqslant \frac{2\sqrt{x}}{2 + n\sqrt{x}} \leqslant \frac{2}{n}$ pour $x \in [0, 1]$ et $n \geqslant 1$. Conclure.

    **5.** En déduire une suite de polynômes qui converge uniformément vers $x \mapsto |x|$ sur $[-1, 1]$.
  corrige: |
    **1.** Le calcul direct donne $P_{1} = \frac{X}{2}$ et $P_{2} = \frac{X}{2} + \frac{1}{2}\big(X - \frac{X^{2}}{4}\big) = X - \frac{X^{2}}{8}$. Pour $n \geqslant 1$, le terme $-\frac{1}{2}P_{n}^{2}$ impose $\deg P_{n + 1} = 2\deg P_{n}$, de coefficient dominant non nul. 
    $$\boxed{\deg P_{n} = 2^{n - 1} \ (n \geqslant 1)}$$

    **2.** On factorise $x - P_{n}^{2} = (\sqrt{x} - P_{n})(\sqrt{x} + P_{n})$ : 
    $$P_{n + 1} - \sqrt{x} = (P_{n} - \sqrt{x}) + \frac{1}{2}(\sqrt{x} - P_{n})(\sqrt{x} + P_{n}) = (P_{n} - \sqrt{x})\Big(1 - \frac{1}{2}(P_{n} + \sqrt{x})\Big).$$

    **3.** On raisonne par récurrence. Si $0 \leqslant P_{n}(x) \leqslant \sqrt{x} \leqslant 1$, alors $1 - \frac{1}{2}(P_{n} + \sqrt{x}) \geqslant 1 - \sqrt{x} \geqslant 0$, donc $P_{n + 1}(x) \leqslant \sqrt{x}$ par la question 2, et $P_{n + 1} - P_{n} = \frac{1}{2}(x - P_{n}^{2}) \geqslant 0$. La suite croissante majorée converge vers $L \in [0, \sqrt{x}]$ avec $x - L^{2} = 0$. 
    $$\boxed{0 \leqslant P_{n} \leqslant P_{n + 1} \leqslant \sqrt{x}, \qquad P_{n}(x) \to \sqrt{x}}$$

    **4.** On pose $y = \sqrt{x} \in [0, 1]$. Pour $n = 1$, l'inégalité $y - \frac{y^{2}}{2} \leqslant \frac{2y}{2 + y}$ équivaut à $(2 - y)(2 + y) \leqslant 4$. Si elle vaut au rang $n$, comme $1 - \frac{1}{2}(P_{n} + y) \leqslant 1 - \frac{y}{2}$, 
    $$y - P_{n + 1} \leqslant \frac{2y}{2 + ny}\Big(1 - \frac{y}{2}\Big) \leqslant \frac{2y}{2 + (n + 1)y},$$
     la dernière inégalité équivalant à $\big(1 - \frac{y}{2}\big)\big(2 + (n + 1)y\big) \leqslant 2 + ny$, c'est-à-dire $-\frac{(n + 1)y^{2}}{2} \leqslant 0$. Enfin $\frac{2y}{2 + ny} \leqslant \frac{2y}{ny} = \frac{2}{n}$. 
    $$\boxed{0 \leqslant \sqrt{x} - P_{n}(x) \leqslant \frac{2}{n} : \text{ CU sur } [0, 1]}$$

    **5.** Pour $x \in [-1, 1]$, $x^{2} \in [0, 1]$ et $\sqrt{x^{2}} = |x|$. 
    $$\boxed{\big|P_{n}(x^{2}) - |x|\big| \leqslant \frac{2}{n} \ \text{ sur } [-1, 1]}$$
     On a ainsi approché $|x|$ par des polynômes explicites, sans le théorème de Weierstrass : c'est l'étape clé de l'exercice 58.
