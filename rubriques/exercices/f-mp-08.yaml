  enonce: |
    Pour $x \in \big[0, \frac{\pi}{2}\big]$, soit $f_{n}(x) = n\cos^{n}(x)\sin(x)$.

    **1.** Étudier la convergence simple de $(f_{n})$.

    **2.** Comparer $\lim_{n} \int_{0}^{\pi/2} f_{n}$ et $\int_{0}^{\pi/2} \lim_{n} f_{n}$. Qu'en déduire ? Retrouver ce résultat en calculant $f_{n}\big(\frac{1}{\sqrt{n}}\big)$.
  corrige: |
    **1.** On distingue $x = 0$ des autres points. On a $f_{n}(0) = 0$, et pour $x \in ]0, \frac{\pi}{2}]$, $0 \leqslant \cos x < 1$, donc $n\cos^{n}x \to 0$. 
    $$\boxed{f_{n} \to 0 \text{ simplement sur } \big[0, \tfrac{\pi}{2}\big]}$$

    **2.** On reconnaît une dérivée : 
    $$\int_{0}^{\pi/2} f_{n} = n\Big[-\frac{\cos^{n + 1}x}{n + 1}\Big]_{0}^{\pi/2} = \frac{n}{n + 1} \to 1 \neq 0 = \int_{0}^{\pi/2} \lim f_{n}.$$
     Par le théorème 3, la convergence n'est pas uniforme. Directement, $n\ln\cos\frac{1}{\sqrt{n}} \to -\frac{1}{2}$ et $\sin\frac{1}{\sqrt{n}} \sim \frac{1}{\sqrt{n}}$, d'où 
    $$\boxed{f_{n}\big(\tfrac{1}{\sqrt{n}}\big) \sim \sqrt{n}\,\mathrm{e}^{-1/2} \to +\infty, \qquad \lVert f_{n} \rVert_{\infty} \to +\infty}$$
- id: "mp-08-18"
  feuille: "f-mp-08"
  numero: 18
  partie: "Intégration et dérivation"
