  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $a < b$, $g \in \mathcal{C}([a, b], \mathbb{R})$ et $f_{n}(x) = \dfrac{n}{1 + n^{2}x^{2}}$. Déterminer la limite de $\int_{a}^{b} f_{n}(x)g(x)\,\mathrm{d} x$.

    **1.** Traiter le cas où $0 \notin [a, b]$.

    **2.** On suppose $a < 0 < b$. Calculer $\int_{a}^{b} f_{n}$, puis montrer que $\int_{a}^{b} f_{n}(x)\big(g(x) - g(0)\big)\,\mathrm{d} x \to 0$ en coupant l'intégrale en $[-\delta, \delta]$ et son complémentaire. Conclure que la limite vaut $\pi g(0)$.

    **3.** Que se passe-t-il si $a = 0 < b$ ?
  corrige: |
    **1.** On note $m = \min_{[a, b]} |x| > 0$. Alors $0 \leqslant f_{n}(x) \leqslant \frac{n}{1 + n^{2}m^{2}} \to 0$ uniformément sur $[a, b]$, et le théorème 3 s'applique à $f_{n}g$. 
    $$\boxed{\int_{a}^{b} f_{n}g \to 0}$$

    **2.** On calcule d'abord $\int_{a}^{b} f_{n} = \operatorname{Arctan}(nb) - \operatorname{Arctan}(na) \to \pi$. Soit $\varepsilon > 0$ et $\delta \in ]0, \min(-a, b)[$ tel que $|g(x) - g(0)| \leqslant \varepsilon$ sur $[-\delta, \delta]$. Alors 
    $$\Big|\int_{a}^{b} f_{n}(g - g(0))\Big| \leqslant \varepsilon\int_{-\delta}^{\delta} f_{n} + 2\lVert g \rVert_{\infty}(b - a)\frac{n}{1 + n^{2}\delta^{2}} \leqslant \pi\varepsilon + o(1).$$

    $$\boxed{\int_{a}^{b} f_{n}g \to \pi g(0)}$$

    **3.** Le même raisonnement s'applique sur $[0, \delta]$, avec $\int_{0}^{b} f_{n} = \operatorname{Arctan}(nb) \to \frac{\pi}{2}$. 
    $$\boxed{\int_{0}^{b} f_{n}g \to \frac{\pi}{2}g(0)}$$
     La suite $\big(\frac{f_{n}}{\pi}\big)$ « tend vers une masse en $0$ » : c'est le prototype des approximations de l'unité de l'exercice 57.
- id: "mp-08-20"
  feuille: "f-mp-08"
