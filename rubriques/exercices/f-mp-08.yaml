  noeuds: [cx-convergence-uniforme, ri-integrable, de-derivee, as-series]
  notions: []
  source: "Suites et séries de fonctions (Prost, LLG), exercice 25 ; BibM@th, Suites et séries de fonctions, exercice 28"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Pour $x > 0$, on pose $f(x) = \sum_{n = 0}^{+\infty} \dfrac{(-1)^{n}}{n + x}$.

    **1.** Montrer que $f$ est définie et continue sur $\mathbb{R}_{+}^{*}$, puis qu'elle y est de classe $\mathcal{C}^{1}$ et même $\mathcal{C}^{\infty}$.

    **2.** Justifier la décroissance de $f$, et montrer que $f(x) + f(x + 1) = \frac{1}{x}$ pour tout $x > 0$.

    **3.** Déterminer un équivalent de $f$ en $0$ et en $+\infty$.

    **4.** Montrer que $f(x) = \int_{0}^{1} \frac{t^{x - 1}}{1 + t}\,\mathrm{d} t$ pour tout $x \geqslant 1$. On écrira $\frac{1}{1 + t} = \sum_{k = 0}^{n} (-t)^{k} + \frac{(-t)^{n + 1}}{1 + t}$.
  corrige: |
    **1.** Pour $x > 0$, $\big(\frac{1}{n + x}\big)$ décroît vers $0$ : par le critère des séries alternées, 
    $$|R_{n}(x)| \leqslant \frac{1}{n + 1 + x} \leqslant \frac{1}{n + 1},$$
     d'où la convergence uniforme sur $\mathbb{R}_{+}^{*}$ et la continuité. Pour $k \geqslant 1$, la dérivée $k$-ième du terme général vaut $(-1)^{n + k}\frac{k!}{(n + x)^{k + 1}}$, majorée sur $[a, +\infty[$ par $\frac{k!}{(n + a)^{k + 1}}$ : convergence normale, et le théorème 6 (iv) s'applique à tout ordre. 
    $$\boxed{f \in \mathcal{C}^{\infty}(\mathbb{R}_{+}^{*})}$$

    **2.** La dérivée $f'(x) = -\sum_{n \geqslant 0} \frac{(-1)^{n}}{(n + x)^{2}}$ est l'opposée d'une série alternée dont la somme a le signe du premier terme, et même $\sum \frac{(-1)^{n}}{(n + x)^{2}} \geqslant \frac{1}{x^{2}} - \frac{1}{(1 + x)^{2}} > 0$. En décalant l'indice, 
    $$f(x + 1) = \sum_{m \geqslant 1} \frac{(-1)^{m - 1}}{m + x} = -\Big(f(x) - \frac{1}{x}\Big).$$

    $$\boxed{f \text{ décroissante}, \qquad f(x) + f(x + 1) = \frac{1}{x}}$$

    **3.** En $0$, $f(x) = \frac{1}{x} - f(x + 1)$ et $f(x + 1) \to f(1)$, finie. En $+\infty$, la décroissance donne, pour $x > 1$, 
    $$\frac{1}{x} = f(x) + f(x + 1) \leqslant 2f(x) \leqslant f(x - 1) + f(x) = \frac{1}{x - 1}.$$

    $$\boxed{f(x) \underset{0}{\sim} \frac{1}{x}, \qquad f(x) \underset{+\infty}{\sim} \frac{1}{2x}}$$

    **4.** Pour $x \geqslant 1$, l'intégrande est continue sur $[0, 1]$, et l'identité proposée donne 
    $$\int_{0}^{1} \frac{t^{x - 1}}{1 + t}\,\mathrm{d} t = \sum_{k = 0}^{n} \frac{(-1)^{k}}{k + x} + r_{n}, \qquad |r_{n}| \leqslant \int_{0}^{1} t^{n + x}\,\mathrm{d} t = \frac{1}{n + x + 1}.$$

    $$\boxed{f(x) = \int_{0}^{1} \frac{t^{x - 1}}{1 + t}\,\mathrm{d} t \ \ (x \geqslant 1), \qquad f(1) = \ln 2}$$
     Pour $x \in ]0, 1[$, l'intégrale est généralisée en $0$ ; le chapitre 12 étendra la formule.
- id: "mp-08-33"
  feuille: "f-mp-08"
