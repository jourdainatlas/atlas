  page_enonce: 5
  page_corrige: 10
  enonce: |
    Pour $x \in \mathbb{R}_{+}$ et $n \in \mathbb{N}$, on pose $f_{n}(x) = \dfrac{x^{n}}{1 + x + \cdots + x^{n}}$.

    **1.** Déterminer la limite simple $f$ de $(f_{n})$ sur $\mathbb{R}_{+}$.

    **2.** Montrer que $0 \leqslant f_{n}(x) \leqslant \frac{1}{n + 1}$ pour $x \in [0, 1]$, et que $|f_{n}(x) - f(x)| = \frac{x - 1}{x(x^{n + 1} - 1)} \leqslant \frac{1}{n + 1}$ pour $x > 1$. Conclure.

    **3.** En déduire $\lim_{n \to +\infty} \int_{1}^{2} f_{n}(x)\,\mathrm{d} x$.
  corrige: |
    **1.** On distingue $x \leqslant 1$ et $x > 1$. Pour $x \in [0, 1[$, $0 \leqslant f_{n}(x) \leqslant x^{n}$ ; en $1$, $f_{n}(1) = \frac{1}{n + 1}$ ; pour $x > 1$, $f_{n}(x) = \frac{(x - 1)x^{n}}{x^{n + 1} - 1} \to \frac{x - 1}{x}$. 
    $$\boxed{f = 0 \text{ sur } [0, 1], \qquad f(x) = 1 - \frac{1}{x} \text{ sur } ]1, +\infty[}$$

    **2.** Sur $[0, 1]$, chaque terme de $1 + x + \cdots + x^{n}$ est au moins $x^{n}$, d'où $f_{n}(x) \leqslant \frac{1}{n + 1}$. Pour $x > 1$, 
    $$f_{n}(x) - f(x) = (x - 1)\Big(\frac{x^{n}}{x^{n + 1} - 1} - \frac{1}{x}\Big) = \frac{x - 1}{x(x^{n + 1} - 1)} \leqslant \frac{1}{(n + 1)x} \leqslant \frac{1}{n + 1},$$
     car $x^{n + 1} - 1 = (x - 1)(1 + x + \cdots + x^{n}) \geqslant (n + 1)(x - 1)$. 
    $$\boxed{\lVert f_{n} - f \rVert_{\infty} \leqslant \tfrac{1}{n + 1} : \text{ CU sur } \mathbb{R}_{+}}$$

    **3.** Le théorème 3 s'applique sur $[1, 2]$ : 
    $$\boxed{\int_{1}^{2} f_{n} \to \int_{1}^{2} \Big(1 - \frac{1}{x}\Big)\mathrm{d} x = 1 - \ln 2 \approx 0{,}307}$$
     On peut aussi intégrer directement l'encadrement $0 \leqslant f_{n} - f \leqslant \frac{1}{n + 1}$, ce qui est la seconde façon.
- id: "mp-08-19"
  feuille: "f-mp-08"
