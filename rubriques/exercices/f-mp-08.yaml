  page_corrige: 18
  enonce: |
    On note $\zeta(x) = \sum_{n \geqslant 1} \frac{1}{n^{x}}$ pour $x > 1$, et $\eta(x) = \sum_{n \geqslant 1} \frac{(-1)^{n - 1}}{n^{x}}$ sous réserve de convergence.

    **1.** Montrer que $\eta$ est définie et continue sur $\mathbb{R}_{+}^{*}$. La convergence est-elle uniforme sur $\mathbb{R}_{+}^{*}$ ?

    **2.** Montrer que $\eta(x) = (1 - 2^{1 - x})\zeta(x)$ pour $x > 1$.

    **3.** En déduire, à l'aide de $\eta(1)$, un équivalent de $\zeta(x)$ quand $x \to 1^{+}$, et le comparer à celui du cours.

    **4.** Montrer que $\zeta$ est de classe $\mathcal{C}^{2}$ et convexe sur $]1, +\infty[$, puis, à l'aide de l'inégalité de Cauchy-Schwarz appliquée aux sommes partielles, que $\zeta\zeta'' \geqslant \zeta'^{2}$. En déduire que $\ln\zeta$ est convexe.
  corrige: |
    **1.** Pour $x > 0$, $(n^{-x})$ décroît vers $0$ et le critère des séries alternées donne $|R_{n}(x)| \leqslant (n + 1)^{-a}$ sur $[a, +\infty[$ : convergence uniforme et continuité. Sur $\mathbb{R}_{+}^{*}$, $\sup_{x > 0} n^{-x} = 1$, donc $(u_{n})$ ne tend pas uniformément vers $0$ (proposition 4). 
    $$\boxed{\eta \text{ continue sur } \mathbb{R}_{+}^{*}, \ \text{pas de CU sur } \mathbb{R}_{+}^{*}}$$

    **2.** Pour $x > 1$, la convergence est absolue, et l'on peut séparer les termes pairs : 
    $$\zeta(x) - \eta(x) = 2\sum_{m \geqslant 1} \frac{1}{(2m)^{x}} = 2^{1 - x}\zeta(x).$$

    $$\boxed{\eta(x) = (1 - 2^{1 - x})\zeta(x)}$$

    **3.** On a $1 - 2^{1 - x} = 1 - \mathrm{e}^{-(x - 1)\ln 2} \sim (x - 1)\ln 2$ et $\eta(x) \to \eta(1) = \ln 2$ par continuité. 
    $$\boxed{\zeta(x) = \frac{\eta(x)}{1 - 2^{1 - x}} \underset{1^{+}}{\sim} \frac{1}{x - 1}}$$
     C'est l'équivalent du cours, obtenu ici sans comparaison à une intégrale.

    **4.** Sur $[a, +\infty[$ avec $a > 1$, $\frac{(\ln n)^{2}}{n^{x}} \leqslant \frac{(\ln n)^{2}}{n^{a}} = o(n^{-b})$ pour $b = \frac{1 + a}{2}$ : $\zeta$ est de classe $\mathcal{C}^{2}$ et $\zeta'' = \sum \frac{(\ln n)^{2}}{n^{x}} \geqslant 0$. L'inégalité de Cauchy-Schwarz donne, pour tout $N$, 
    $$\Big(\sum_{n \leqslant N} \frac{\ln n}{n^{x}}\Big)^{2} = \Big(\sum_{n \leqslant N} \frac{\ln n}{n^{x/2}} \cdot \frac{1}{n^{x/2}}\Big)^{2} \leqslant \sum_{n \leqslant N} \frac{(\ln n)^{2}}{n^{x}}\sum_{n \leqslant N} \frac{1}{n^{x}},$$
     et le passage à la limite donne $\zeta'^{2} \leqslant \zeta\zeta''$. 
    $$\boxed{\zeta \text{ convexe}, \qquad (\ln\zeta)'' = \frac{\zeta\zeta'' - \zeta'^{2}}{\zeta^{2}} \geqslant 0}$$
- id: "mp-08-35"
  feuille: "f-mp-08"
  numero: 35
  partie: "Fonctions définies par une série"
  etoiles: 2
