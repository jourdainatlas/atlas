  source: "exercice composé pour la feuille ; Suites et séries de fonctions (Prost, LLG), exercice 14 (question 3)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Limites d'intégrales.* Déterminer les limites suivantes, en justifiant soigneusement l'interversion : 
    $$\text{(a) } \int_{0}^{1} \Big(1 + \frac{x}{n}\Big)^{n}\mathrm{d} x ; \qquad \text{(b) } \int_{0}^{1} n\ln\Big(1 + \frac{x}{n}\Big)\mathrm{d} x ; \qquad \text{(c) } \int_{0}^{1} \big(1 + x^{n}\big)^{1/n}\,\mathrm{d} x ; \qquad \text{(d) } \int_{0}^{\pi} \frac{n\sin x}{n + x}\,\mathrm{d} x.$$
     Pour (a), on établira l'encadrement $\mathrm{e}^{x - x^{2}/(2n)} \leqslant \big(1 + \frac{x}{n}\big)^{n} \leqslant \mathrm{e}^{x}$ sur $[0, 1]$. Calculer enfin $\lim \int_{0}^{1} \frac{\mathrm{d} x}{1 + x^{n}}$, sans convergence uniforme, à l'aide d'une majoration directe.
  corrige: |
    Dans chaque cas, on établit la convergence uniforme sur le segment d'intégration, puis on applique le théorème 3.

    **(a)** L'inégalité $\ln(1 + u) \leqslant u$ donne la majoration, et $\ln(1 + u) \geqslant u - \frac{u^{2}}{2}$, pour $u \geqslant 0$, la minoration. Comme $1 - \mathrm{e}^{-y} \leqslant y$, 
    $$0 \leqslant \mathrm{e}^{x} - \Big(1 + \frac{x}{n}\Big)^{n} \leqslant \mathrm{e}^{x}\big(1 - \mathrm{e}^{-x^{2}/(2n)}\big) \leqslant \frac{\mathrm{e}}{2n} \qquad (x \in [0, 1]).$$

    $$\boxed{\int_{0}^{1} \Big(1 + \frac{x}{n}\Big)^{n}\mathrm{d} x \to \mathrm{e} - 1}$$

    **(b)** Le même encadrement donne $0 \leqslant x - n\ln(1 + \frac{x}{n}) \leqslant \frac{x^{2}}{2n} \leqslant \frac{1}{2n}$. 
    $$\boxed{\int_{0}^{1} n\ln\Big(1 + \frac{x}{n}\Big)\mathrm{d} x \to \frac{1}{2}}$$

    **(c)** Pour $x \in [0, 1]$, $1 \leqslant 1 + x^{n} \leqslant 2$, d'où $1 \leqslant (1 + x^{n})^{1/n} \leqslant 2^{1/n}$, et la convergence vers $1$ est uniforme. 
    $$\boxed{\int_{0}^{1} (1 + x^{n})^{1/n}\,\mathrm{d} x \to 1}$$

    **(d)** On a $\big|\frac{n\sin x}{n + x} - \sin x\big| = \frac{x\sin x}{n + x} \leqslant \frac{\pi}{n}$ sur $[0, \pi]$. 
    $$\boxed{\int_{0}^{\pi} \frac{n\sin x}{n + x}\,\mathrm{d} x \to \int_{0}^{\pi} \sin x\,\mathrm{d} x = 2}$$

    Pour la dernière limite, la convergence n'est pas uniforme sur $[0, 1]$ (la limite vaut $\frac{1}{2}$ en $1$), mais $0 \leqslant 1 - \frac{1}{1 + x^{n}} = \frac{x^{n}}{1 + x^{n}} \leqslant x^{n}$, d'où $\big|\int_{0}^{1} \frac{\mathrm{d} x}{1 + x^{n}} - 1\big| \leqslant \frac{1}{n + 1}$. 
    $$\boxed{\int_{0}^{1} \frac{\mathrm{d} x}{1 + x^{n}} \to 1}$$
