  noeuds: [fc-weierstrass, as-series]
  notions: []
  source: "evn1 (Prost, LLG), exercice 26, question 2 ; reporté de la feuille du chapitre 4"
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soient $[a, b]$ et $[c, d]$ deux segments de $\mathbb{R}$, non réduits à un point, avec $b < c$. Pour $P \in \mathbb{R}[X]$, on pose $N_{1}(P) = \sup_{[a, b]} |P|$ et $N_{2}(P) = \sup_{[c, d]} |P|$.

    **1.** Construire une fonction continue $h : [a, d] \to \mathbb{R}$, nulle sur $[a, b]$ et égale à $1$ sur $[c, d]$.

    **2.** À l'aide du théorème de Weierstrass, construire une suite de polynômes $(P_{n})$ vérifiant 
    $$N_{1}(P_{n}) \to 0 \qquad\text{et}\qquad N_{2}(P_{n}) \to 1.$$
     Retrouver ainsi le résultat de l'exercice 33 de la feuille 4 : les normes $N_{1}$ et $N_{2}$ ne sont pas équivalentes.
  corrige: |
    **1.** On interpole linéairement entre $b$ et $c$ : 
    $$\boxed{h = 0 \text{ sur } [a, b], \quad h(x) = \frac{x - b}{c - b} \text{ sur } [b, c], \quad h = 1 \text{ sur } [c, d]}$$

    **2.** Le théorème 8 fournit des polynômes $P_{n}$ avec $\lVert P_{n} - h \rVert_{\infty, [a, d]} \leqslant \frac{1}{n}$. Alors $N_{1}(P_{n}) \leqslant \frac{1}{n}$ et $|N_{2}(P_{n}) - 1| \leqslant \frac{1}{n}$. S'il existait $\beta$ tel que $N_{2} \leqslant \beta N_{1}$, on aurait $N_{2}(P_{n}) \to 0$. 
    $$\boxed{N_{1}(P_{n}) \to 0, \quad N_{2}(P_{n}) \to 1 : \ N_{1} \text{ et } N_{2} \text{ ne sont pas équivalentes}}$$
     Le théorème de Weierstrass rend la preuve conceptuelle : sur $[a, b] \cup [c, d]$, les polynômes peuvent imiter n'importe quelle fonction continue, en particulier une fonction nulle sur l'un et non nulle sur l'autre.
- id: "mp-08-50"
  feuille: "f-mp-08"
  numero: 50
  partie: "Approximation uniforme"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [approximation uniforme, convergence uniforme, théorème de Weierstrass]
  noeuds: [fc-weierstrass, fc-uniforme]
  notions: [convergence-uniforme]
  page_enonce: 11
  page_corrige: 27
  enonce: |
    *Conséquences du théorème de Weierstrass.* Soit $f \in \mathcal{C}([a, b], \mathbb{R})$.

    **1.** Montrer que $f$ est limite uniforme sur $[a, b]$ d'une suite de polynômes à coefficients *rationnels*.

    **2.** On suppose $[a, b] = [-1, 1]$ et $f$ paire. Montrer que $f$ est limite uniforme d'une suite de polynômes pairs.

    **3.** On suppose que $f$ est limite uniforme sur $[a, b]$ d'une suite de polynômes de degré au plus $d$. Montrer que $f$ est polynomiale de degré au plus $d$. On utilisera qu'un sous-espace de dimension finie d'un espace normé est fermé (chapitre 5).
  corrige: |
    **1.** Soit $P = \sum_{k = 0}^{d} a_{k}X^{k}$ avec $\lVert f - P \rVert_{\infty} \leqslant \varepsilon$, et $M = \max(1, |a|, |b|)$. Par densité de $\mathbb{Q}$, on choisit des rationnels $q_{k}$ avec $|a_{k} - q_{k}| \leqslant \frac{\varepsilon}{(d + 1)M^{k}}$ ; alors $Q = \sum q_{k}X^{k}$ vérifie $\lVert P - Q \rVert_{\infty} \leqslant \varepsilon$. 
    $$\boxed{\lVert f - Q \rVert_{\infty} \leqslant 2\varepsilon, \qquad Q \in \mathbb{Q}[X]}$$

    **2.** On symétrise une approximation $P_{n} \to f$ : $Q_{n}(x) = \frac{P_{n}(x) + P_{n}(-x)}{2}$ est pair, et comme $f(-x) = f(x)$, 
    $$|Q_{n}(x) - f(x)| \leqslant \frac{1}{2}\big(|P_{n}(x) - f(x)| + |P_{n}(-x) - f(-x)|\big) \leqslant \lVert P_{n} - f \rVert_{\infty}.$$

    **3.** L'application qui associe à un polynôme sa restriction à $[a, b]$ est injective, car $[a, b]$ est infini : $\mathbb{R}_{d}[X]$ s'identifie à un sous-espace de dimension $d + 1$ de $\mathcal{C}([a, b], \mathbb{R})$, donc fermé. La fonction $f$, limite d'une suite de ce sous-espace, lui appartient. 
    $$\boxed{f \in \mathbb{R}_{d}[X]}$$
     L'exercice 48 en donne une autre preuve, par l'interpolation de Lagrange.
- id: "mp-08-51"
  feuille: "f-mp-08"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, convergence uniforme, convergence normale, intégration, dérivation, théorème de Weierstrass]
  noeuds: [fc-uniforme, cx-convergence-uniforme, ri-integrable, de-derivee, fc-weierstrass]
  notions: [convergence-uniforme]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Si $(f_{n})$ converge uniformément vers $f$ sur $A$ et sur $B$, elle converge uniformément vers $f$ sur $A \cup B$.

    **2.** Une limite simple de fonctions continues est continue.

    **3.** Une limite uniforme de fonctions bornées est bornée.

    **4.** Si $\sum u_{n}$ converge normalement sur $A$, alors elle converge uniformément sur $A$.

    **5.** Si $\sum u_{n}$ converge uniformément sur $A$, alors elle converge normalement sur $A$.

    **6.** Une limite uniforme sur $[0, 1]$ de fonctions de classe $\mathcal{C}^{1}$ est de classe $\mathcal{C}^{1}$.

    **7.** Si les $u_{n}$ sont continues sur $[a, b]$ et convergent uniformément vers $u$, alors $\int_{a}^{b} u_{n} \to \int_{a}^{b} u$.

    **8.** Si $(f_{n})$ converge uniformément vers $f$ sur $\mathbb{R}$, alors $(f_{n}^{2})$ converge uniformément vers $f^{2}$ sur $\mathbb{R}$.

    **9.** Si $(f_{n})$ converge uniformément vers $f$ sur $]0, 1]$ et si chaque $f_{n}$ a une limite finie en $0$, alors $f$ a une limite finie en $0$.

    **10.** La fonction exponentielle est limite uniforme sur $[0, 1]$ d'une suite de fonctions polynomiales.
  corrige: |
    **1.** **Vrai** : c'est la proposition 2 (ii), qui ne vaut que pour une réunion finie.

    **2.** **Faux** : $x^{n}$ sur $[0, 1]$ a une limite discontinue en $1$.

    **3.** **Vrai** : exercice 5, question 3.

    **4.** **Vrai** : théorème 5.

    **5.** **Faux** : $\sum \frac{(-1)^{n}}{n + x}$ converge uniformément sur $\mathbb{R}_{+}$, mais $\lVert u_{n} \rVert_{\infty} = \frac{1}{n}$ (cours, section 8.5).

    **6.** **Faux** : $\sqrt{(x - \frac{1}{2})^{2} + \frac{1}{n}}$ converge uniformément vers $|x - \frac{1}{2}|$, non dérivable en $\frac{1}{2}$.

    **7.** **Vrai** : théorème 3.

    **8.** **Faux** : $f_{n}(x) = x + \frac{1}{n}$ sur $\mathbb{R}$ (exercice 6).

    **9.** **Vrai** : théorème 2, le point $0$ étant adhérent à $]0, 1]$.

    **10.** **Vrai** : théorème 8, ou plus explicitement l'inégalité de Taylor-Lagrange, qui donne sur $[0, 1]$ 
    $$\Big|\mathrm{e}^{x} - \sum_{k \leqslant n} \frac{x^{k}}{k!}\Big| \leqslant \frac{\mathrm{e}}{(n + 1)!}.$$

    $$\boxed{\text{vraies : 1, 3, 4, 7, 9, 10 ; \quad fausses : 2, 5, 6, 8}}$$
- id: "mp-08-52"
  feuille: "f-mp-08"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [synthèse, convergence simple, convergence uniforme]
  noeuds: [fc-uniforme]
  notions: [convergence-simple, convergence-uniforme]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    *Perspective : complétude de $\mathcal{C}([a, b])$.* Une suite $(f_{k})$ d'un espace normé est *de Cauchy* si, pour tout $\varepsilon > 0$, il existe $N$ tel que $\lVert f_{k} - f_{p} \rVert \leqslant \varepsilon$ pour tous $k$, $p \geqslant N$ ; l'espace est *complet* si toute suite de Cauchy y converge. On admet que $\mathbb{R}$ est complet (exercice 18 de la feuille 4).

    **1.** Soit $(f_{k})$ une suite de Cauchy de $(\mathcal{C}([a, b], \mathbb{R}), \lVert \cdot \rVert_{\infty})$. Montrer que $(f_{k})$ converge simplement vers une fonction $f$, puis uniformément, en passant à la limite en $p$ dans l'inégalité $|f_{k}(x) - f_{p}(x)| \leqslant \varepsilon$. Conclure que $(\mathcal{C}([a, b], \mathbb{R}), \lVert \cdot \rVert_{\infty})$ est complet.

    **2.** En déduire que si $u_{n} \in \mathcal{C}([a, b], \mathbb{R})$ et si $\sum \lVert u_{n} \rVert_{\infty}$ converge, alors $\sum u_{n}$ converge dans $\mathcal{C}([a, b], \mathbb{R})$ : c'est le théorème 5 du cours, vu comme une propriété de l'espace.

    **3.** Montrer que $\mathcal{C}^{1}([a, b], \mathbb{R})$, muni de $N(f) = \lVert f \rVert_{\infty} + \lVert f' \rVert_{\infty}$, est complet, mais qu'il ne l'est pas pour $\lVert \cdot \rVert_{\infty}$. On pourra considérer une suite qui converge uniformément vers $x \mapsto |x - c|$, avec $a < c < b$.
  corrige: |
    **1.** Pour $x$ fixé, $|f_{k}(x) - f_{p}(x)| \leqslant \lVert f_{k} - f_{p} \rVert_{\infty}$ : la suite réelle $(f_{k}(x))$ est de Cauchy, donc converge vers un réel $f(x)$. Soit $\varepsilon > 0$ et $N$ tel que $|f_{k}(x) - f_{p}(x)| \leqslant \varepsilon$ pour tous $k$, $p \geqslant N$ et tout $x$ ; en faisant tendre $p$ vers $+\infty$, $|f_{k}(x) - f(x)| \leqslant \varepsilon$ pour tout $x$ et tout $k \geqslant N$. La convergence est uniforme, et $f$ est continue par le théorème 1. 
    $$\boxed{(\mathcal{C}([a, b], \mathbb{R}), \lVert \cdot \rVert_{\infty}) \text{ est complet}}$$

    **2.** Les sommes partielles $S_{n}$ vérifient, pour $p < q$, 
    $$\lVert S_{q} - S_{p} \rVert_{\infty} \leqslant \sum_{n = p + 1}^{q} \lVert u_{n} \rVert_{\infty},$$
     reste d'une série convergente : la suite $(S_{n})$ est de Cauchy, donc converge dans $\mathcal{C}([a, b], \mathbb{R})$.

    **3.** Si $(f_{k})$ est de Cauchy pour $N$, les suites $(f_{k})$ et $(f_{k}')$ sont de Cauchy pour $\lVert \cdot \rVert_{\infty}$ ; par la question 1, $f_{k} \to f$ et $f_{k}' \to g$ uniformément, et le théorème 4 donne $f \in \mathcal{C}^{1}$ avec $f' = g$, d'où $N(f_{k} - f) \to 0$. Pour $\lVert \cdot \rVert_{\infty}$, la suite $f_{k}(x) = \sqrt{(x - c)^{2} + \frac{1}{k}}$ de $\mathcal{C}^{1}([a, b])$ converge uniformément vers $|x - c|$ ; elle est donc de Cauchy, et si elle convergeait dans $\mathcal{C}^{1}$ pour $\lVert \cdot \rVert_{\infty}$, sa limite serait $|x - c|$ par unicité, qui n'est pas de classe $\mathcal{C}^{1}$. 
    $$\boxed{(\mathcal{C}^{1}, N) \text{ complet}, \quad (\mathcal{C}^{1}, \lVert \cdot \rVert_{\infty}) \text{ non complet}}$$
     La complétude est la propriété qui permet de démontrer une convergence sans connaître la limite : c'est elle qui manquait au cours pour démontrer le théorème de la double limite.
- id: "mp-08-53"
  feuille: "f-mp-08"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, dérivation]
  noeuds: [de-derivee]
  notions: []
  page_enonce: 12
  page_corrige: 28
  enonce: |
    *Perspective : une fonction continue nulle part dérivable.* On note $d(y)$ la distance du réel $y$ à $\mathbb{Z}$, et l'on pose $T(x) = \sum_{k = 0}^{+\infty} \frac{d(2^{k}x)}{2^{k}}$.

    **1.** Montrer que $T$ est définie, continue et $1$-périodique sur $\mathbb{R}$.

    **2.** Soit $x \in \mathbb{R}$ et $n \in \mathbb{N}^{*}$. On pose $u_{n} = \frac{\lfloor 2^{n}x \rfloor}{2^{n}}$ et $v_{n} = u_{n} + \frac{1}{2^{n}}$. Montrer que, pour $k \geqslant n$, $d(2^{k}u_{n}) = d(2^{k}v_{n}) = 0$, et que, pour $k < n$, la fonction $t \mapsto d(2^{k}t)$ est affine sur $[u_{n}, v_{n}]$, de pente $\pm 2^{k}$.

    **3.** En déduire que $s_{n} = \frac{T(v_{n}) - T(u_{n})}{v_{n} - u_{n}}$ est un entier, de même parité que $n$.

    **4.** On suppose $T$ dérivable en $x$. Montrer que $s_{n} \to T'(x)$, en écrivant $s_{n}$ comme une moyenne pondérée de taux d'accroissement issus de $x$. Conclure.
  corrige: |
    **1.** Comme $0 \leqslant d \leqslant \frac{1}{2}$, le terme général est majoré par $2^{-k - 1}$ : la convergence est normale sur $\mathbb{R}$, et $T$ est continue. Chaque terme est $1$-périodique, car $d(2^{k}x + 2^{k}) = d(2^{k}x)$.

    **2.** Pour $k \geqslant n$, $2^{k}u_{n} = 2^{k - n}\lfloor 2^{n}x \rfloor$ et $2^{k}v_{n}$ sont entiers. Pour $k < n$, quand $t$ parcourt $[u_{n}, v_{n}]$, $2^{k}t$ parcourt un intervalle de la forme $\big[\frac{m}{2^{n - k}}, \frac{m + 1}{2^{n - k}}\big]$, avec $n - k \geqslant 1$, qui est inclus dans un intervalle $\big[\frac{j}{2}, \frac{j + 1}{2}\big]$. Sur un tel intervalle, $d$ est affine de pente $\pm 1$. 
    $$\boxed{t \mapsto d(2^{k}t) \text{ est affine de pente } \pm 2^{k} \text{ sur } [u_{n}, v_{n}] \ (k < n)}$$

    **3.** Seuls les termes $k < n$ contribuent, et chacun apporte une pente $\frac{\pm 2^{k}}{2^{k}} = \pm 1$. 
    $$\boxed{s_{n} = \sum_{k = 0}^{n - 1} \varepsilon_{k}, \quad \varepsilon_{k} \in \{-1, 1\} : \ s_{n} \in \mathbb{Z}, \ s_{n} \equiv n \pmod 2}$$

    **4.** On a $u_{n} \leqslant x < v_{n}$. Avec $\lambda_{n} = \frac{v_{n} - x}{v_{n} - u_{n}} \in ]0, 1]$, 
    $$s_{n} = \lambda_{n}\frac{T(v_{n}) - T(x)}{v_{n} - x} + (1 - \lambda_{n})\frac{T(x) - T(u_{n})}{x - u_{n}},$$
     le second terme étant absent si $x = u_{n}$. Les deux taux tendent vers $T'(x)$, donc $s_{n} \to T'(x)$, et $s_{n + 1} - s_{n} \to 0$. Mais $s_{n + 1} - s_{n} = \varepsilon_{n} = \pm 1$. 
    $$\boxed{T \text{ est continue et nulle part dérivable}}$$
     Une somme de fonctions continues, et même lipschitziennes, peut donc être aussi irrégulière que possible : la convergence uniforme ne transmet aucune information sur les dérivées.
- id: "mp-08-54"
  feuille: "f-mp-08"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [synthèse, convergence simple, convergence uniforme, convergence normale, dérivation]
  noeuds: [fc-uniforme, cx-convergence-uniforme, de-derivee]
  notions: [convergence-simple, convergence-uniforme]
  page_enonce: 13
  page_corrige: 29
  enonce: |
    *Perspective : lecture critique.* Chacun des raisonnements suivants contient une erreur. La localiser, et dire si la conclusion est vraie ou fausse.

    **1.** « Les fonctions $x \mapsto x^{n}$ sont continues sur $[0, 1[$ et convergent simplement vers la fonction nulle, qui est continue ; la convergence est donc uniforme sur $[0, 1[$. »

    **2.** « Pour tout $x \in \mathbb{R}$, $\big|\frac{x}{n}\big| \leqslant \frac{|x|}{n} \to 0$ ; la suite $\big(x \mapsto \frac{x}{n}\big)$ converge donc uniformément vers $0$ sur $\mathbb{R}$. »

    **3.** « La série $\sum \frac{(-1)^{n}}{n}$ converge ; la série de fonctions $\sum \frac{(-1)^{n}x^{n}}{n}$ converge donc normalement sur $[0, 1]$. »

    **4.** « On a $\big|\frac{\sin(nx)}{n}\big| \leqslant \frac{1}{n}$, donc $\frac{\sin(nx)}{n} \to 0$ uniformément sur $\mathbb{R}$, et par le théorème de dérivation, $\cos(nx) \to 0$ pour tout $x$. »
  corrige: |
    **1.** L'erreur est d'utiliser la réciproque du théorème 1, qui est fausse. La conclusion est **fausse** : $\sup_{[0, 1[} x^{n} = 1$.

    **2.** L'erreur est que le majorant $\frac{|x|}{n}$ dépend de $x$, alors qu'il doit en être indépendant. La conclusion est **fausse** : $\sup_{\mathbb{R}} \frac{|x|}{n} = +\infty$.

    **3.** L'erreur est de confondre la convergence de la série au point $x = 1$ avec celle de $\sum \lVert u_{n} \rVert_{\infty} = \sum \frac{1}{n}$, divergente. La conclusion est **fausse**, bien que la convergence soit uniforme sur $[0, 1]$ par le critère des séries alternées : $|R_{n}(x)| \leqslant \frac{x^{n + 1}}{n + 1} \leqslant \frac{1}{n + 1}$.

    **4.** L'erreur est d'appliquer le théorème 4 sans la convergence uniforme des *dérivées*. La conclusion est **fausse** : $\cos(0) = 1$, et l'exercice 20 montre que $(\cos(nx))$ ne tend vers $0$ pour aucun $x$.
