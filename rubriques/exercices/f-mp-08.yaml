  source: "Suites et séries de fonctions (Prost, LLG), exercice 42"
  page_enonce: 11
  page_corrige: 26
  enonce: |
    *Polynômes de degré borné.* Soit $d \in \mathbb{N}$ et $(P_{k})$ une suite de fonctions polynomiales réelles, toutes de degré au plus $d$. Montrer l'équivalence des propriétés suivantes, et que la limite est alors polynomiale de degré au plus $d$ :

    **1.** il existe des réels distincts $x_{0}, \dots, x_{d}$ tels que chaque suite $(P_{k}(x_{i}))_{k}$ converge ;

    **2.** la suite $(P_{k})$ converge simplement sur $\mathbb{R}$ ;

    **3.** la suite $(P_{k})$ converge uniformément sur tout segment de $\mathbb{R}$.

    On écrira $P_{k}$ dans la base des polynômes interpolateurs de Lagrange associés à $x_{0}, \dots, x_{d}$ (chapitre 13 de MPSI).
  corrige: |
    Soit $(L_{0}, \dots, L_{d})$ la base de Lagrange de $\mathbb{R}_{d}[X]$ associée à $x_{0}, \dots, x_{d}$, de sorte que $P_{k} = \sum_{i = 0}^{d} P_{k}(x_{i})L_{i}$.

    *(i) $\Rightarrow$ (iii).* Soit $c_{i} = \lim_{k} P_{k}(x_{i})$ et $P = \sum c_{i}L_{i} \in \mathbb{R}_{d}[X]$. Sur un segment $J$, 
    $$\lVert P_{k} - P \rVert_{\infty, J} \leqslant \sum_{i = 0}^{d} |P_{k}(x_{i}) - c_{i}|\,\lVert L_{i} \rVert_{\infty, J} \to 0.$$
     *(iii) $\Rightarrow$ (ii) $\Rightarrow$ (i)* sont immédiates. 
    $$\boxed{\text{(i)} \iff \text{(ii)} \iff \text{(iii)}, \quad \text{limite } P = \sum c_{i}L_{i} \in \mathbb{R}_{d}[X]}$$
     *Piège.* La convergence n'est pas uniforme sur $\mathbb{R}$ en général : $P_{k} = \frac{X}{k}$ converge vers $0$ sur tout segment, mais $\lVert P_{k} \rVert_{\infty, \mathbb{R}} = +\infty$.
- id: "mp-08-49"
  feuille: "f-mp-08"
  numero: 49
  partie: "Approximation uniforme"
  etoiles: 2
  types: [Calcul]
