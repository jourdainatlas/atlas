  noeuds: [cx-convergence-uniforme, fc-uniforme, ri-integrable]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 24 ; BibM@th, Suites et séries de fonctions, exercices 22 et 35"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Pour $x \in \mathbb{R}$, on pose $f(x) = \sum_{n = 1}^{+\infty} \dfrac{x}{x^{2} + n^{2}}$.

    **1.** Montrer que $f$ est définie, impaire et continue sur $\mathbb{R}$.

    **2.** À l'aide d'une comparaison avec une intégrale, montrer que $f(x) \to \frac{\pi}{2}$ quand $x \to +\infty$.

    **3.** La convergence est-elle normale sur $\mathbb{R}$ ? uniforme sur $\mathbb{R}_{+}$ ? On utilisera le théorème de la double limite.
  corrige: |
    **1.** Sur $[-A, A]$, $\big|\frac{x}{x^{2} + n^{2}}\big| \leqslant \frac{A}{n^{2}}$ : la convergence est normale, et chaque terme est impair. 
    $$\boxed{f \text{ continue et impaire sur } \mathbb{R}}$$

    **2.** Pour $x > 0$, $f(x) = x\,g(x)$ où $g(x) = \sum \frac{1}{x^{2} + n^{2}}$ est la fonction étudiée dans le cours (section 8.5), qui vérifie 
    $$\frac{1}{x}\Big(\frac{\pi}{2} - \operatorname{Arctan}\frac{1}{x}\Big) \leqslant g(x) \leqslant \frac{\pi}{2x}, \qquad\text{d'où}\qquad \frac{\pi}{2} - \operatorname{Arctan}\frac{1}{x} \leqslant f(x) \leqslant \frac{\pi}{2}.$$

    $$\boxed{f(x) \xrightarrow[x \to +\infty]{} \frac{\pi}{2}}$$

    **3.** Le maximum de $x \mapsto \frac{x}{x^{2} + n^{2}}$ sur $\mathbb{R}_{+}$ est atteint en $x = n$ et vaut $\frac{1}{2n}$ : pas de convergence normale. Si la convergence était uniforme sur $\mathbb{R}_{+}$, le théorème 6 (ii) en $+\infty$, où chaque terme tend vers $0$, donnerait $f(x) \to 0$. 
    $$\boxed{\text{ni CN sur } \mathbb{R}, \text{ ni CU sur } \mathbb{R}_{+}}$$
- id: "mp-08-34"
  feuille: "f-mp-08"
  numero: 34
  partie: "Fonctions définies par une série"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions définies par une série, convergence uniforme, dérivation, fonction zêta, équivalents]
  noeuds: [cx-convergence-uniforme, fc-uniforme, de-derivee, as-series]
