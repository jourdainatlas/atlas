  noeuds: [cx-convergence-uniforme, de-derivee, as-series]
  notions: []
  source: "Suites et séries de fonctions (Prost, LLG), exercice 28"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Pour $x > 0$, on pose $f(x) = \sum_{n = 1}^{+\infty} \dfrac{(-1)^{n - 1}}{\ln(x + n)}$.

    **1.** Montrer que $f$ est définie, continue et à valeurs strictement positives sur $\mathbb{R}_{+}^{*}$.

    **2.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ et décroissante. On montrera que $t \mapsto t\ln^{2}t$ est croissante sur $]1, +\infty[$.

    **3.** Calculer $f(x) + f(x + 1)$ pour $x > 0$.

    **4.** En déduire que $f(x) \sim \frac{1}{2\ln x}$ en $+\infty$ et que $f(x) \sim \frac{1}{x}$ en $0^{+}$.
  corrige: |
    **1.** Pour $x > 0$ et $n \geqslant 1$, $x + n > 1$, et $\big(\frac{1}{\ln(x + n)}\big)$ décroît vers $0$. Le critère des séries alternées donne $|R_{n}(x)| \leqslant \frac{1}{\ln(x + n + 1)} \leqslant \frac{1}{\ln(n + 1)}$ : convergence uniforme sur $\mathbb{R}_{+}^{*}$, et la somme est comprise entre les deux premières sommes partielles. 
    $$\boxed{f \text{ continue}, \qquad f(x) \geqslant \frac{1}{\ln(x + 1)} - \frac{1}{\ln(x + 2)} > 0}$$

    **2.** La dérivée du terme général vaut $\frac{(-1)^{n}}{(x + n)\ln^{2}(x + n)}$. La fonction $t \mapsto t\ln^{2}t$ a pour dérivée $\ln^{2}t + 2\ln t > 0$ sur $]1, +\infty[$ : la valeur absolue décroît vers $0$ en $n$, et le reste est majoré par $\frac{1}{(n + 1)\ln^{2}(n + 1)}$, uniformément. Par le théorème 6 (iv), $f$ est de classe $\mathcal{C}^{1}$, et $f'(x)$ a le signe de son premier terme, $-\frac{1}{(x + 1)\ln^{2}(x + 1)}$. 
    $$\boxed{f \in \mathcal{C}^{1}(\mathbb{R}_{+}^{*}), \quad f' < 0}$$

    **3.** Comme à l'exercice 32, le décalage d'indice donne $f(x + 1) = -\big(f(x) - \frac{1}{\ln(x + 1)}\big)$. 
    $$\boxed{f(x) + f(x + 1) = \frac{1}{\ln(x + 1)}}$$

    **4.** Par décroissance, pour $x > 1$, $\frac{1}{\ln(x + 1)} \leqslant 2f(x) \leqslant \frac{1}{\ln x}$, et les deux bornes sont équivalentes à $\frac{1}{\ln x}$. En $0$, $f(x) = \frac{1}{\ln(1 + x)} - f(x + 1)$, avec $f(x + 1) \to f(1)$. 
    $$\boxed{f(x) \underset{+\infty}{\sim} \frac{1}{2\ln x}, \qquad f(x) \underset{0}{\sim} \frac{1}{x}}$$
- id: "mp-08-36"
  feuille: "f-mp-08"
