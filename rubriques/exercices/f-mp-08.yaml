  enonce: |
    *Une formule intégrale.* Pour $x \in \mathbb{R}$, on pose $f(x) = \sum_{n = 0}^{+\infty} \dfrac{x^{2n}}{(n!)^{2}}$.

    **1.** Montrer que $f$ est définie et continue sur $\mathbb{R}$.

    **2.** Soit $x \in \mathbb{R}$. Pour $t \in [-\pi, \pi]$, on pose $\varphi_{x}(t) = \sum_{k = 0}^{+\infty} \frac{x^{k}}{k!}\mathrm{e}^{\mathrm{i} kt} = \exp\big(x\mathrm{e}^{\mathrm{i} t}\big)$. Montrer que la série converge normalement sur $[-\pi, \pi]$, et calculer, pour $n \in \mathbb{Z}$, 
    $$I_{n}(x) = \frac{1}{2\pi}\int_{-\pi}^{\pi} \varphi_{x}(t)\,\mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t.$$

    **3.** Calculer $|\varphi_{x}(t)|^{2}$. En écrivant $|\varphi_{x}|^{2} = \varphi_{x}\,\overline{\varphi_{x}}$ et en développant $\overline{\varphi_{x}}$ en série, calculer de deux façons $\frac{1}{2\pi}\int_{-\pi}^{\pi} |\varphi_{x}(t)|^{2}\,\mathrm{d} t$.

    **4.** En déduire que $f(x) = \dfrac{1}{\pi}\displaystyle\int_{0}^{\pi} \mathrm{e}^{2x\cos t}\,\mathrm{d} t$ pour tout $x \in \mathbb{R}$, puis que $1 \leqslant f(x) \leqslant \mathrm{e}^{2|x|}$.
  corrige: |
    **1.** Sur $[-A, A]$, le terme général est majoré par $\frac{A^{2n}}{(n!)^{2}}$, terme d'une série convergente (règle de d'Alembert). 
    $$\boxed{f \text{ continue sur } \mathbb{R}}$$

    **2.** Le terme $\frac{x^{k}}{k!}\mathrm{e}^{\mathrm{i} kt}$ a pour module $\frac{|x|^{k}}{k!}$, indépendant de $t$ : convergence normale sur $[-\pi, \pi]$, et la somme est $\exp(x\mathrm{e}^{\mathrm{i} t})$ par la série exponentielle (chapitre 20 de MPSI). On intègre terme à terme (théorème 6 (iii)), avec $\frac{1}{2\pi}\int_{-\pi}^{\pi} \mathrm{e}^{\mathrm{i}(k - n)t}\,\mathrm{d} t = \delta_{k, n}$ : 
    $$\boxed{I_{n}(x) = \frac{x^{n}}{n!} \ (n \geqslant 0), \qquad I_{n}(x) = 0 \ (n < 0)}$$

    **3.** Comme $|\mathrm{e}^{z}| = \mathrm{e}^{\Re z}$, $|\varphi_{x}(t)|^{2} = \mathrm{e}^{2x\cos t}$. Par ailleurs, $\overline{\varphi_{x}(t)} = \sum_{l} \frac{x^{l}}{l!}\mathrm{e}^{-\mathrm{i} lt}$, et la série $\sum_{l} \frac{x^{l}}{l!}\varphi_{x}(t)\mathrm{e}^{-\mathrm{i} lt}$ converge normalement, puisque $|\varphi_{x}| \leqslant \mathrm{e}^{|x|}$. En intégrant terme à terme, 
    $$\frac{1}{2\pi}\int_{-\pi}^{\pi} |\varphi_{x}|^{2} = \sum_{l \geqslant 0} \frac{x^{l}}{l!}I_{l}(x) = \sum_{l \geqslant 0} \frac{x^{2l}}{(l!)^{2}} = f(x).$$

    $$\boxed{\frac{1}{2\pi}\int_{-\pi}^{\pi} \mathrm{e}^{2x\cos t}\,\mathrm{d} t = f(x)}$$

    **4.** L'intégrande est paire en $t$, d'où la formule. Tous les termes de $f(x)$ sont positifs et le premier vaut $1$ ; l'intégrande est majorée par $\mathrm{e}^{2|x|}$. 
    $$\boxed{f(x) = \frac{1}{\pi}\int_{0}^{\pi} \mathrm{e}^{2x\cos t}\,\mathrm{d} t, \qquad 1 \leqslant f(x) \leqslant \mathrm{e}^{2|x|}}$$
     Par exemple, $f(1) \approx 2{,}2796$, valeur obtenue par les deux formules en Python. Le calcul de la question 3 est un cas particulier de l'égalité de Parseval du chapitre 11.
- id: "mp-08-56"
