  page_corrige: 30
  enonce: |
    *Décomposition de la cotangente.* On pose $f_{0}(x) = \frac{1}{x}$ et $f_{n}(x) = \frac{2x}{x^{2} - n^{2}}$ pour $n \geqslant 1$.

    **1.** Soit $A > 0$. Montrer que la série $\sum_{n > 2A} f_{n}$ converge normalement sur $[-A, A]$, et en déduire que la somme $f$ de la série $\sum_{n \geqslant 0} f_{n}$ est définie, continue et impaire sur $\mathbb{R} \setminus \mathbb{Z}$.

    **2.** Vérifier que $f_{n}(x) = \frac{1}{x - n} + \frac{1}{x + n}$, puis que $f(x) = \lim_{N \to +\infty} \sum_{n = -N}^{N} \frac{1}{x - n}$. En déduire que $f$ est $1$-périodique et que $2f(2x) = f(x) + f\big(x + \frac{1}{2}\big)$ pour $x \notin \frac{1}{2}\mathbb{Z}$.

    **3.** Montrer que $g : x \mapsto f(x) - \pi\operatorname{cotan}(\pi x)$ se prolonge en une fonction continue sur $\mathbb{R}$, $1$-périodique, nulle en $0$, et vérifiant la même relation que $f$ à la question 2.

    **4.** Soit $M = \max_{[0, 1]} |g|$, atteint en $x_{0}$. Montrer que $\big|g\big(\frac{x_{0}}{2}\big)\big| = M$, puis que $\big|g\big(\frac{x_{0}}{2^{k}}\big)\big| = M$ pour tout $k$. Conclure que $g = 0$, c'est-à-dire 
    $$\pi\operatorname{cotan}(\pi x) = \frac{1}{x} + \sum_{n = 1}^{+\infty} \frac{2x}{x^{2} - n^{2}}, \qquad x \in \mathbb{R} \setminus \mathbb{Z}.$$

    **5.** En dérivant terme à terme, après justification, établir que, pour $x \in \mathbb{R} \setminus \mathbb{Z}$, 
    $$\frac{\pi^{2}}{\sin^{2}(\pi x)} = \frac{1}{x^{2}} + \sum_{n = 1}^{+\infty} \Big(\frac{1}{(x - n)^{2}} + \frac{1}{(x + n)^{2}}\Big),$$
     et en déduire, en faisant tendre $x$ vers $0$, que $\sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6}$.
  corrige: |
    **1.** Pour $|x| \leqslant A$ et $n > 2A$, $n^{2} - x^{2} \geqslant \frac{3n^{2}}{4}$, d'où $|f_{n}(x)| \leqslant \frac{8A}{3n^{2}}$ : convergence normale. La somme $f$ s'écrit sur $[-A, A] \setminus \mathbb{Z}$ comme une somme finie de fonctions continues et d'une fonction continue sur $[-A, A]$ ; chaque $f_{n}$ est impaire. 
    $$\boxed{f \text{ continue et impaire sur } \mathbb{R} \setminus \mathbb{Z}}$$

    **2.** La décomposition en éléments simples donne 
    $$f_{n}(x) = \frac{1}{x - n} + \frac{1}{x + n}, \qquad\text{d'où}\qquad f(x) = \lim_{N \to +\infty} \sum_{n = -N}^{N} \frac{1}{x - n}.$$
     Pour la périodicité, 
    $$\sum_{n = -N}^{N} \frac{1}{x + 1 - n} = \sum_{m = -N}^{N} \frac{1}{x - m} + \frac{1}{x + N + 1} - \frac{1}{x - N} \xrightarrow[N \to +\infty]{} f(x).$$
     Pour la duplication, on sépare les indices pairs $n = 2m$ et impairs $n = 2m + 1$ : 
    $$\sum_{n = -2N}^{2N} \frac{2}{2x - n} = \sum_{m = -N}^{N} \frac{1}{x - m} + \sum_{m = -N}^{N - 1} \frac{1}{(x - \frac{1}{2}) - m} \to f(x) + f\big(x - \tfrac{1}{2}\big) = f(x) + f\big(x + \tfrac{1}{2}\big).$$

    $$\boxed{f(x + 1) = f(x), \qquad 2f(2x) = f(x) + f\big(x + \tfrac{1}{2}\big)}$$

    **3.** Près de $0$, $f(x) - \frac{1}{x} = \sum_{n \geqslant 1} f_{n}(x)$ est continue en $0$ et vaut $0$ en $0$, et $\pi\operatorname{cotan}(\pi x) - \frac{1}{x} \to 0$ par le développement $\operatorname{cotan} y = \frac{1}{y} - \frac{y}{3} + o(y)$. Par périodicité, $g$ se prolonge par continuité en tout entier, avec $g(k) = 0$. Enfin, avec $y = \pi x$, 
    $$\pi\operatorname{cotan} y + \pi\operatorname{cotan}\Big(y + \frac{\pi}{2}\Big) = \pi(\operatorname{cotan} y - \tan y) = \pi\frac{\cos^{2}y - \sin^{2}y}{\sin y\cos y} = 2\pi\operatorname{cotan}(2y),$$
     de sorte que $g$ vérifie la relation de duplication hors de $\frac{1}{2}\mathbb{Z}$, puis partout par continuité.

    **4.** La fonction $g$ est continue et $1$-périodique, donc $|g| \leqslant M$ sur $\mathbb{R}$. La relation en $\frac{x_{0}}{2}$ donne 
    $$2M = 2|g(x_{0})| = \big|g\big(\tfrac{x_{0}}{2}\big) + g\big(\tfrac{x_{0}}{2} + \tfrac{1}{2}\big)\big| \leqslant 2M,$$
     ce qui impose $\big|g\big(\frac{x_{0}}{2}\big)\big| = M$. Comme $\frac{x_{0}}{2} \in [0, 1]$, on itère, et la continuité en $0$ donne $M = |g(0)| = 0$. 
    $$\boxed{\pi\operatorname{cotan}(\pi x) = \frac{1}{x} + \sum_{n = 1}^{+\infty} \frac{2x}{x^{2} - n^{2}}}$$

    **5.** Pour $|x| \leqslant A$ et $n > 2A$, $|f_{n}'(x)| = \frac{1}{(x - n)^{2}} + \frac{1}{(x + n)^{2}} \leqslant \frac{8}{n^{2}}$ : la série des dérivées converge normalement, et l'on dérive terme à terme sur chaque intervalle $]k, k + 1[$ (théorème 6 (iv)). Comme $(\pi\operatorname{cotan}(\pi x))' = -\frac{\pi^{2}}{\sin^{2}(\pi x)}$, on obtient la formule de l'énoncé. Pour $x \to 0$, le membre de droite diminué de $\frac{1}{x^{2}}$ tend vers $2\sum \frac{1}{n^{2}}$ par continuité, et 
    $$\frac{\pi^{2}}{\sin^{2}(\pi x)} = \frac{1}{x^{2}}\Big(1 - \frac{\pi^{2}x^{2}}{6} + o(x^{2})\Big)^{-2} = \frac{1}{x^{2}} + \frac{\pi^{2}}{3} + o(1).$$

    $$\boxed{\sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6}}$$
     Les égalités ont été vérifiées numériquement, par exemple $\pi\operatorname{cotan}(0{,}3\pi) \approx 2{,}2825$ des deux côtés. Le chapitre 11 retrouvera $\zeta(2)$ par l'égalité de Parseval.
- id: "mp-08-57"
  feuille: "f-mp-08"
