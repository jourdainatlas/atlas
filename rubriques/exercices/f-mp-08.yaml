  types: [Problème, Démonstration]
  mots_cles: [synthèse, convergence uniforme, intégration, théorème de Weierstrass]
  noeuds: [fc-uniforme, ri-integrable, fc-weierstrass]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 40"
  page_enonce: 14
  page_corrige: 31
  enonce: |
    *Une démonstration du théorème de Weierstrass par convolution.* On note $E$ l'ensemble des fonctions continues de $\mathbb{R}$ dans $\mathbb{C}$ nulles en dehors d'un segment. Pour $f$, $g \in E$, avec $f$ nulle hors de $[-A, A]$, on pose 
    $$(f \ast g)(x) = \int_{-A}^{A} f(t)\,g(x - t)\,\mathrm{d} t, \qquad x \in \mathbb{R},$$
     quantité qui ne dépend pas du choix de $A$.

    **1.** Montrer que $f \ast g \in E$ (on utilisera l'uniforme continuité de $g$), et que $f \ast g = g \ast f$.

    **2.** On appelle *approximation de l'unité* toute suite $(e_{n})$ de fonctions positives de $E$, nulles hors de $[-1, 1]$, telles que $\int_{-1}^{1} e_{n} = 1$ et $\int_{\alpha \leqslant |t| \leqslant 1} e_{n}(t)\,\mathrm{d} t \to 0$ pour tout $\alpha \in ]0, 1[$. Montrer que $f \ast e_{n} \to f$ uniformément sur $\mathbb{R}$ pour toute $f \in E$.

    **3.** On pose $\lambda_{n} = \int_{-1}^{1} (1 - t^{2})^{n}\,\mathrm{d} t$, et $e_{n}(t) = \frac{(1 - t^{2})^{n}}{\lambda_{n}}$ si $|t| \leqslant 1$, $e_{n}(t) = 0$ sinon. Montrer que $\lambda_{n} \geqslant \frac{2}{n + 1}$, et que $(e_{n})$ est une approximation de l'unité.

    **4.** Soit $f \in E$ nulle en dehors de $\big[-\frac{1}{2}, \frac{1}{2}\big]$. Montrer que $f \ast e_{n}$ coïncide sur $\big[-\frac{1}{2}, \frac{1}{2}\big]$ avec une fonction polynomiale.

    **5.** En déduire le théorème de Weierstrass.
  corrige: |
    **1.** On suppose $g$ nulle hors de $[-B, B]$. Elle est continue sur $[-B - 1, B + 1]$, donc uniformément continue sur ce segment (théorème de Heine), et nulle au-delà : elle est uniformément continue sur $\mathbb{R}$, de module $\omega$. Alors 
    $$|(f \ast g)(x) - (f \ast g)(y)| \leqslant \int_{-A}^{A} |f(t)|\,|g(x - t) - g(y - t)|\,\mathrm{d} t \leqslant 2A\lVert f \rVert_{\infty}\,\omega(|x - y|),$$
     et $(f \ast g)(x) = 0$ pour $|x| > A + B$. Le changement de variable $s = x - t$ donne la commutativité, l'intervalle d'intégration pouvant être élargi puisque les intégrandes s'annulent. 
    $$\boxed{f \ast g \in E, \qquad f \ast g = g \ast f}$$

    **2.** Par commutativité et parce que $\int e_{n} = 1$, 
    $$(f \ast e_{n})(x) - f(x) = \int_{-1}^{1} e_{n}(t)\big(f(x - t) - f(x)\big)\,\mathrm{d} t.$$
     Soit $\varepsilon > 0$ et $\alpha \in ]0, 1[$ tel que $|f(y) - f(z)| \leqslant \varepsilon$ dès que $|y - z| \leqslant \alpha$. La partie $|t| \leqslant \alpha$ contribue pour au plus $\varepsilon$, et l'autre pour au plus $2\lVert f \rVert_{\infty}\int_{\alpha \leqslant |t| \leqslant 1} e_{n}$, indépendamment de $x$. 
    $$\boxed{f \ast e_{n} \to f \text{ uniformément sur } \mathbb{R}}$$

    **3.** Comme $1 - t^{2} \geqslant 1 - t$ sur $[0, 1]$, $\lambda_{n} = 2\int_{0}^{1} (1 - t^{2})^{n}\,\mathrm{d} t \geqslant 2\int_{0}^{1} (1 - t)^{n}\,\mathrm{d} t = \frac{2}{n + 1}$. Les $e_{n}$ sont continues, positives, d'intégrale $1$, et 
    $$\int_{\alpha \leqslant |t| \leqslant 1} e_{n} \leqslant \frac{2(1 - \alpha^{2})^{n}}{\lambda_{n}} \leqslant (n + 1)(1 - \alpha^{2})^{n} \to 0.$$

    **4.** Pour $x$, $t \in [-\frac{1}{2}, \frac{1}{2}]$, $|x - t| \leqslant 1$, donc $e_{n}(x - t) = \frac{(1 - (x - t)^{2})^{n}}{\lambda_{n}}$, polynôme en $x$ à coefficients polynomiaux en $t$. En développant, 
    $$(f \ast e_{n})(x) = \int_{-1/2}^{1/2} f(t)e_{n}(x - t)\,\mathrm{d} t = \sum_{j = 0}^{2n} c_{j}x^{j}, \qquad c_{j} \in \mathbb{C}.$$

    **5.** Soit $h$ continue sur $[a, b]$ et $\psi$ l'application affine croissante de $[-\frac{1}{4}, \frac{1}{4}]$ sur $[a, b]$. On prolonge $k = h \circ \psi$ en $F \in E$, affine sur $[\frac{1}{4}, \frac{1}{2}]$ et $[-\frac{1}{2}, -\frac{1}{4}]$ et nulle hors de $[-\frac{1}{2}, \frac{1}{2}]$. Les fonctions $F \ast e_{n}$ coïncident sur $[-\frac{1}{4}, \frac{1}{4}]$ avec des polynômes $Q_{n}$ et convergent uniformément vers $F$. 
    $$\boxed{Q_{n} \circ \psi^{-1} \to h \text{ uniformément sur } [a, b]}$$
     Cette preuve, due à Landau (1908), est le modèle des méthodes de régularisation par convolution ; elle n'utilise pas le théorème 7.
- id: "mp-08-58"
  feuille: "f-mp-08"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [synthèse, théorème de Weierstrass]
  noeuds: [fc-weierstrass]
  notions: []
  source: "Topologie des espaces vectoriels normés (LLG), exercice 103 (X), écarté des feuilles des chapitres 4 et 5"
  page_enonce: 14
  page_corrige: 32
  enonce: |
    *Théorème de Stone-Weierstrass.* Soit $C = \mathcal{C}([0, 1], \mathbb{R})$, muni de $\lVert \cdot \rVert_{\infty}$, $A$ une sous-algèbre de $C$ contenant les fonctions constantes, et $\overline{A}$ son adhérence. On suppose que $A$ *sépare les points* : pour $a \neq b$ dans $[0, 1]$, il existe $f \in A$ telle que $f(a) \neq f(b)$. On admet la propriété de Borel-Lebesgue : de tout recouvrement de $[0, 1]$ par des ouverts relatifs, on peut extraire un recouvrement fini.

    **1.** Montrer que $\overline{A}$ est une sous-algèbre de $C$.

    **2.** Soit $f \in \overline{A}$. À l'aide de l'exercice 47, montrer que $|f| \in \overline{A}$. En déduire que $\min(f_{1}, \dots, f_{m})$ et $\max(f_{1}, \dots, f_{m})$ appartiennent à $\overline{A}$ dès que $f_{1}, \dots, f_{m} \in \overline{A}$.

    **3.** Soient $a \neq b$ dans $[0, 1]$ et $\alpha$, $\beta \in \mathbb{R}$. Montrer qu'il existe $h \in A$ telle que $h(a) = \alpha$ et $h(b) = \beta$.

    **4.** Soit $f \in C$ et $\varepsilon > 0$. Pour $x \in [0, 1]$, montrer qu'il existe $g_{x} \in \overline{A}$ telle que $g_{x}(x) = f(x)$ et $g_{x} < f + \varepsilon$ sur $[0, 1]$.

    **5.** Montrer qu'il existe $g \in \overline{A}$ telle que $\lVert f - g \rVert_{\infty} < \varepsilon$, et conclure que $\overline{A} = C$.

    **6.** Retrouver le théorème de Weierstrass, puis montrer que les fonctions $x \mapsto \sum_{k = 0}^{p} a_{k}\mathrm{e}^{kx}$ sont denses dans $C$.
  corrige: |
    **1.** L'adhérence d'un sous-espace vectoriel est un sous-espace vectoriel (chapitre 4). Pour le produit, si $f_{n} \to f$ et $g_{n} \to g$ uniformément avec $f_{n}$, $g_{n} \in A$, l'exercice 6 donne $f_{n}g_{n} \to fg$, les fonctions continues sur $[0, 1]$ étant bornées.

    **2.** Soit $f \in \overline{A}$ non nulle, $M = \lVert f \rVert_{\infty}$, et $(P_{n})$ la suite de l'exercice 47. Les fonctions $M P_{n}\big(\frac{f^{2}}{M^{2}}\big)$ appartiennent à $\overline{A}$, qui est une algèbre contenant les constantes, et 
    $$\Big\lVert M P_{n}\Big(\frac{f^{2}}{M^{2}}\Big) - |f| \Big\rVert_{\infty} \leqslant \frac{2M}{n},$$
     puisque $\frac{f^{2}}{M^{2}}$ prend ses valeurs dans $[0, 1]$ et que sa racine carrée est $\frac{|f|}{M}$. Comme $\overline{A}$ est fermée, $|f| \in \overline{A}$. On conclut avec $\min(f, g) = \frac{f + g - |f - g|}{2}$, $\max(f, g) = \frac{f + g + |f - g|}{2}$, et une récurrence sur $m$.

    **3.** Soit $f \in A$ avec $f(a) \neq f(b)$. La fonction 
    $$\boxed{h = \alpha + (\beta - \alpha)\frac{f - f(a)}{f(b) - f(a)}}$$
     appartient à $A$ et convient.

    **4.** Pour chaque $y \in [0, 1]$, la question 3 (ou une constante si $y = x$) fournit $h_{y} \in A$ avec $h_{y}(x) = f(x)$ et $h_{y}(y) = f(y)$. L'ensemble $U_{y} = \{t \in [0, 1] \mid h_{y}(t) < f(t) + \varepsilon\}$ est un ouvert relatif contenant $y$. Par Borel-Lebesgue, $[0, 1] = U_{y_{1}} \cup \dots \cup U_{y_{m}}$, et l'on pose $g_{x} = \min(h_{y_{1}}, \dots, h_{y_{m}}) \in \overline{A}$ (question 2). Alors $g_{x}(x) = f(x)$, et tout $t$ appartient à un $U_{y_{i}}$, d'où $g_{x}(t) \leqslant h_{y_{i}}(t) < f(t) + \varepsilon$.

    **5.** L'ensemble $V_{x} = \{t \mid g_{x}(t) > f(t) - \varepsilon\}$ est un ouvert relatif contenant $x$ ; on en extrait un recouvrement fini $V_{x_{1}}, \dots, V_{x_{p}}$ et l'on pose $g = \max(g_{x_{1}}, \dots, g_{x_{p}}) \in \overline{A}$. Pour tout $t$, $f(t) - \varepsilon < g(t) < f(t) + \varepsilon$, et la borne supérieure de $|f - g|$, atteinte sur le compact $[0, 1]$, est strictement inférieure à $\varepsilon$. Ainsi $f$ est adhérente à $\overline{A}$, qui est fermée. 
    $$\boxed{\overline{A} = \mathcal{C}([0, 1], \mathbb{R})}$$

    **6.** Les fonctions polynomiales forment une sous-algèbre contenant les constantes et séparant les points, grâce à $x \mapsto x$ : on retrouve le théorème 8 sur $[0, 1]$. De même, $\mathrm{Vect}(x \mapsto \mathrm{e}^{kx}, k \in \mathbb{N})$ est stable par produit, car $\mathrm{e}^{kx}\mathrm{e}^{lx} = \mathrm{e}^{(k + l)x}$, contient les constantes ($k = 0$), et sépare les points, car $x \mapsto \mathrm{e}^{x}$ est injective. 
    $$\boxed{\Big\{x \mapsto \sum_{k = 0}^{p} a_{k}\mathrm{e}^{kx}\Big\} \text{ est dense dans } \mathcal{C}([0, 1], \mathbb{R})}$$
     Le théorème de Stone (1937) généralise ainsi celui de Weierstrass à toute algèbre séparante ; le chapitre 11 en verra un autre cas, celui des polynômes trigonométriques.

