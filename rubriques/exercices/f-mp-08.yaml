  source: "BibM@th, Suites et séries de fonctions, exercices 8 et 11"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Dérivées et convergence uniforme.*

    **1.** Soit $f_{n}(x) = \dfrac{x}{1 + n^{2}x^{2}}$ sur $\mathbb{R}$. Montrer que $(f_{n})$ converge uniformément vers $0$, que $(f_{n}')$ converge simplement vers une fonction $g$ que l'on déterminera, et que $g(0) \neq 0$. Quelle hypothèse du théorème de dérivation est en défaut ?

    **2.** Soit $g_{n}(x) = \dfrac{\sin(nx)}{\sqrt{n}}$. Montrer que $(g_{n})$ converge uniformément sur $\mathbb{R}$, mais que la suite $(g_{n}'(x))$ diverge pour tout $x \in \mathbb{R}$. En raisonnant par l'absurde, on examinera $\cos(nx)$, puis 
    $$\cos(2nx) = 2\cos^{2}(nx) - 1.$$
  corrige: |
    **1.** Le maximum de $|f_{n}|$ est atteint en $x = \pm\frac{1}{n}$ et vaut $\frac{1}{2n}$ : $(f_{n})$ converge uniformément vers $0$. On calcule 
    $$f_{n}'(x) = \frac{1 - n^{2}x^{2}}{(1 + n^{2}x^{2})^{2}}, \qquad f_{n}'(0) = 1, \qquad f_{n}'(x) \to 0 \ (x \neq 0).$$

    $$\boxed{g = \mathbf{1}_{\{0\}}, \qquad g(0) = 1 \neq 0 = (\lim f_{n})'(0)}$$
     La suite $(f_{n}')$ ne converge uniformément sur aucun segment contenant $0$, puisque sa limite y est discontinue : c'est l'hypothèse du théorème 4 qui manque.

    **2.** On a $\lVert g_{n} \rVert_{\infty} = \frac{1}{\sqrt{n}}$ et $g_{n}'(x) = \sqrt{n}\cos(nx)$. Si la suite $(g_{n}'(x))$ convergeait vers un réel, on aurait 
    $$\cos(nx) = \frac{g_{n}'(x)}{\sqrt{n}} \to 0,$$
     puis 
    $$\cos(2nx) = 2\cos^{2}(nx) - 1 \to -1 ;$$
     mais $(\cos(2nx))_{n}$ est extraite de $(\cos(mx))_{m}$, qui tend vers $0$. 
    $$\boxed{g_{n} \to 0 \text{ uniformément}, \quad (g_{n}'(x)) \text{ diverge pour tout } x}$$
- id: "mp-08-21"
  feuille: "f-mp-08"
  numero: 21
  partie: "Intégration et dérivation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [intégration et dérivation, convergence uniforme, convergence sur tout segment, dérivation]
  noeuds: [fc-uniforme, ri-integrable, de-derivee]
  notions: [convergence-uniforme, convergence-uniforme-compact, derivee-successive]
  source: "BibM@th, Suites et séries de fonctions, exercice 18"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Taux d'accroissement.* Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, à dérivée seconde bornée. Pour $n \geqslant 1$, on pose $g_{n}(x) = n\big(f(x + \frac{1}{n}) - f(x)\big)$.

    **1.** Montrer que $(g_{n})$ converge uniformément vers $f'$ sur $\mathbb{R}$, avec $\lVert g_{n} - f' \rVert_{\infty} \leqslant \frac{\lVert f'' \rVert_{\infty}}{2n}$.

    **2.** On suppose seulement $f$ de classe $\mathcal{C}^{1}$. Montrer que la convergence est uniforme sur tout segment. Montrer qu'elle n'est pas uniforme sur $\mathbb{R}$ pour $f(x) = \sin(x^{2})$, en examinant $x_{n} = n\sqrt{2\pi}$.
  corrige: |
    **1.** On applique l'inégalité de Taylor-Lagrange à l'ordre $2$, avec $M = \lVert f'' \rVert_{\infty}$ et $h = \frac{1}{n}$ : 
    $$|f(x + h) - f(x) - hf'(x)| \leqslant \frac{Mh^{2}}{2}, \qquad\text{d'où}\qquad \boxed{|g_{n}(x) - f'(x)| \leqslant \frac{M}{2n}}$$

    **2.** On écrit l'écart comme une intégrale. Pour $x \in [a, b]$, 
    $$g_{n}(x) - f'(x) = n\int_{x}^{x + 1/n} \big(f'(t) - f'(x)\big)\,\mathrm{d} t.$$
     La fonction $f'$ est uniformément continue sur $[a, b + 1]$. Si $\eta$ est associé à $\varepsilon$, l'écart est au plus $\varepsilon$ dès que $n\eta \geqslant 1$. 
    $$\boxed{g_{n} \to f' \text{ uniformément sur tout segment}}$$
     Pour $f(x) = \sin(x^{2})$ et $x_{n} = n\sqrt{2\pi}$, on a $x_{n}^{2} = 2\pi n^{2}$, $f(x_{n}) = 0$, $f'(x_{n}) = 2x_{n}$, et 
    $$\Big(x_{n} + \frac{1}{n}\Big)^{2} = 2\pi n^{2} + 2\sqrt{2\pi} + \frac{1}{n^{2}},$$
     d'où 
    $$g_{n}(x_{n}) - f'(x_{n}) = n\Big(\sin\Big(2\sqrt{2\pi} + \frac{1}{n^{2}}\Big) - 2\sqrt{2\pi}\Big).$$
     La parenthèse tend vers $\sin(2\sqrt{2\pi}) - 2\sqrt{2\pi} \neq 0$, car $|\sin y| < y$ pour $y > 0$. 
    $$\boxed{|g_{n}(x_{n}) - f'(x_{n})| \to +\infty : \text{ pas de CU sur } \mathbb{R}}$$
- id: "mp-08-22"
  feuille: "f-mp-08"
  numero: 22
  partie: "Intégration et dérivation"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégration et dérivation, convergence uniforme, intégration, dérivation, théorème de Weierstrass]
  noeuds: [fc-uniforme, ri-integrable, de-derivee, fc-weierstrass]
  notions: [convergence-uniforme]
  source: "BibM@th, Suites et séries de fonctions, exercice 21"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Une drôle d'équation différentielle.* On définit une suite de fonctions sur $[0, 1]$ par $u_{0} = 1$ et 
    $$u_{n + 1}(x) = 1 + \int_{0}^{x} u_{n}(t - t^{2})\,\mathrm{d} t.$$

    **1.** Justifier que les $u_{n}$ sont bien définies, polynomiales, et calculer $u_{1}$ et $u_{2}$.

    **2.** Montrer que $|u_{n + 1}(x) - u_{n}(x)| \leqslant \frac{x^{n + 1}}{(n + 1)!}$ pour $x \in [0, 1]$ et $n \in \mathbb{N}$.

    **3.** En déduire que $(u_{n})$ converge uniformément sur $[0, 1]$ vers une fonction $u$, de classe $\mathcal{C}^{1}$, vérifiant $u(0) = 1$ et $u'(x) = u(x - x^{2})$.

    **4.** Montrer que $1 + x \leqslant u(x) \leqslant \mathrm{e}^{x}$ sur $[0, 1]$.
  corrige: |
    **1.** Pour $t \in [0, 1]$, $t - t^{2} \in [0, \frac{1}{4}] \subset [0, 1]$, donc $u_{n}(t - t^{2})$ est défini. Par récurrence, $u_{n}$ est polynomiale : composée et primitive de polynômes. 
    $$\boxed{u_{1}(x) = 1 + x, \qquad u_{2}(x) = 1 + x + \frac{x^{2}}{2} - \frac{x^{3}}{3}}$$

    **2.** On raisonne par récurrence. Pour $n = 0$, $u_{1} - u_{0} = x$. Si la majoration vaut au rang $n - 1$, alors, comme $0 \leqslant t - t^{2} \leqslant t$, 
    $$|u_{n + 1}(x) - u_{n}(x)| \leqslant \int_{0}^{x} \frac{(t - t^{2})^{n}}{n!}\,\mathrm{d} t \leqslant \int_{0}^{x} \frac{t^{n}}{n!}\,\mathrm{d} t = \frac{x^{n + 1}}{(n + 1)!}.$$

    **3.** La série télescopique $\sum (u_{n + 1} - u_{n})$ converge normalement sur $[0, 1]$, puisque 
    $$\lVert u_{n + 1} - u_{n} \rVert_{\infty} \leqslant \frac{1}{(n + 1)!} ;$$
     ses sommes partielles $u_{n} - u_{0}$ convergent donc uniformément (théorème 5), vers une fonction continue. Comme $t - t^{2} \in [0, 1]$, la suite $\big(t \mapsto u_{n}(t - t^{2})\big)$ converge uniformément vers $t \mapsto u(t - t^{2})$, et le théorème 3 donne 
    $$u(x) = 1 + \int_{0}^{x} u(t - t^{2})\,\mathrm{d} t.$$

    $$\boxed{u \in \mathcal{C}^{1}([0, 1]), \qquad u(0) = 1, \qquad u'(x) = u(x - x^{2})}$$

    **4.** Par récurrence, $u_{n} \geqslant 1$, donc $u \geqslant 1$ et $u' \geqslant 1$, d'où $u(x) \geqslant 1 + x$. Comme $u$ croît et que $x - x^{2} \leqslant x$, on a $u'(x) = u(x - x^{2}) \leqslant u(x)$, donc $(\mathrm{e}^{-x}u)' \leqslant 0$ et $\mathrm{e}^{-x}u(x) \leqslant u(0) = 1$. 
    $$\boxed{1 + x \leqslant u(x) \leqslant \mathrm{e}^{x}}$$
     L'équation $u'(x) = u(x - x^{2})$ n'est pas une équation différentielle ordinaire : la dérivée en $x$ dépend de la valeur en un autre point. La méthode des approximations successives, qui reviendra au chapitre 16, permet néanmoins de la résoudre.
- id: "mp-08-23"
  feuille: "f-mp-08"
  numero: 23
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence des séries, convergence normale]
  noeuds: [cx-convergence-uniforme, as-series]
  notions: [convergence-uniforme]
  source: "exercice composé pour la feuille ; BibM@th, Suites et séries de fonctions, exercice 22"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Domaines de convergence.* Déterminer l'ensemble $D$ des réels $x$ pour lesquels la série de terme général $u_{n}(x)$ converge, puis des parties de $D$ sur lesquelles la convergence est normale :

    ```tableau
    (a) $\dfrac{1}{1 + x^{n}}$ ; ¦ (b) $\dfrac{x^{n}}{1 + x^{2n}}$ ; ¦ (c) $\Big(\dfrac{x^{2} - 1}{x^{2} + 1}\Big)^{n}$ ;
    (d) $\dfrac{(\ln n)^{x}}{n^{2}}$ ; ¦ (e) $\dfrac{1}{n^{x} + n^{2x}}$ ; ¦ (f) $\dfrac{\mathrm{e}^{-nx}}{\sqrt{n}}$.
    ```

    Pour (c), calculer la somme, et montrer que la convergence n'est pas normale sur $[1, +\infty[$.
  corrige: |
    Dans chaque cas, on étudie la série numérique pour $x$ fixé, puis on cherche un majorant de $|u_{n}(x)|$ indépendant de $x$ sur des parties adaptées.

    **(a)** Il faut $x \neq -1$. Pour $|x| < 1$ ou $x = 1$, le terme général tend vers $1$ ou vaut $\frac{1}{2}$ : divergence grossière. Pour $|x| > 1$, $|u_{n}(x)| \leqslant \frac{1}{|x|^{n} - 1} \sim |x|^{-n}$. Sur $\{|x| \geqslant b\}$ avec $b > 1$, $|u_{n}(x)| \leqslant \frac{1}{b^{n} - 1}$ pour $n \geqslant 1$. 
    $$\boxed{D = ]-\infty, -1[ \,\cup\, ]1, +\infty[, \quad \text{CN sur } \{|x| \geqslant b\}, \ b > 1}$$

    **(b)** On a $|u_{n}(x)| \leqslant \min(|x|^{n}, |x|^{-n})$, et $|u_{n}(\pm 1)| = \frac{1}{2}$. 
    $$\boxed{D = \mathbb{R} \setminus \{-1, 1\}, \quad \text{CN sur } \{|x| \leqslant a\} \text{ et } \{|x| \geqslant b\}, \ a < 1 < b}$$

    **(c)** C'est une série géométrique de raison $r(x) = \frac{x^{2} - 1}{x^{2} + 1} \in [-1, 1[$, avec $r(x) = -1$ si et seulement si $x = 0$. Pour $x \neq 0$, la somme (à partir de $n = 0$) vaut $\frac{1}{1 - r(x)} = \frac{x^{2} + 1}{2}$. Sur un segment ne contenant pas $0$, la fonction continue $|r|$ est majorée par un $q < 1$ : convergence normale. Sur $[1, +\infty[$, $\sup |r|^{n} = 1$ car $r(x) \to 1$ en $+\infty$. 
    $$\boxed{D = \mathbb{R}^{*}, \quad S(x) = \frac{x^{2} + 1}{2}, \quad \text{CN sur tout segment de } \mathbb{R}^{*}, \text{ pas sur } [1, +\infty[}$$

    **(d)** Pour tout $x$, $(\ln n)^{x} = o(\sqrt{n})$, donc $u_{n}(x) = o(n^{-3/2})$. Pour $n \geqslant 3$, $\ln n \geqslant 1$, d'où la majoration sur $]-\infty, A]$ : 
    $$u_{n}(x) \leqslant \frac{(\ln n)^{A}}{n^{2}}.$$

    $$\boxed{D = \mathbb{R}, \quad \text{CN sur } ]-\infty, A], \text{ pas sur } \mathbb{R}}$$

    **(e)** Pour $x > 0$, $u_{n}(x) \sim n^{-2x}$ ; pour $x = 0$, $u_{n} = \frac{1}{2}$ ; pour $x < 0$, $u_{n}(x) \sim n^{-x} \to +\infty$. Sur $[a, +\infty[$ avec $a > \frac{1}{2}$, $u_{n}(x) \leqslant n^{-2a}$. 
    $$\boxed{D = \big]\tfrac{1}{2}, +\infty\big[, \quad \text{CN sur } [a, +\infty[, \ a > \tfrac{1}{2}}$$

    **(f)** Pour $x > 0$, $u_{n}(x) \leqslant \mathrm{e}^{-nx}$ ; pour $x \leqslant 0$, $u_{n}(x) \geqslant \frac{1}{\sqrt{n}}$. Sur $[a, +\infty[$, $u_{n}(x) \leqslant \mathrm{e}^{-na}$ ; sur $]0, +\infty[$, $\lVert u_{n} \rVert_{\infty} = \frac{1}{\sqrt{n}}$. 
    $$\boxed{D = \mathbb{R}_{+}^{*}, \quad \text{CN sur } [a, +\infty[, \ a > 0, \text{ pas sur } \mathbb{R}_{+}^{*}}$$
- id: "mp-08-24"
  feuille: "f-mp-08"
  numero: 24
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence des séries, convergence uniforme, convergence normale]
  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme]
  notions: [convergence-uniforme]
  source: "exercice composé pour la feuille ; Suites et séries de fonctions (Prost, LLG), exercice 17"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Convergence normale.* Montrer que la série de terme général $u_{n}$ converge normalement sur l'ensemble indiqué, en donnant une majoration explicite de $\lVert u_{n} \rVert_{\infty}$ :

    ```tableau
    (a) $\dfrac{\sin(nx)}{n^{3}}$ sur $\mathbb{R}$ ; ¦ (b) $x^{2}\mathrm{e}^{-nx}$ sur $\mathbb{R}_{+}$ ; ¦ (c) $\dfrac{x}{n(1 + nx)}$ sur $\mathbb{R}_{+}$ ;
    (d) $\dfrac{1}{2^{n}}\operatorname{th}\Big(\dfrac{x}{2^{n}}\Big)$ sur $\mathbb{R}$ ; ¦ (e) $\dfrac{\mathrm{e}^{-n^{2}x^{2}}}{n}$ sur $[1, +\infty[$ ; ¦ (f) $\dfrac{x}{n^{2} + x^{2}}$ sur $[-A, A]$.
    ```

    La série de terme général $x\,\mathrm{e}^{-nx}$, $n \geqslant 1$, converge-t-elle normalement sur $\mathbb{R}_{+}$ ? uniformément ? On calculera sa somme.
  corrige: |
    On donne pour chaque série un majorant de $\lVert u_{n} \rVert_{\infty}$, terme général d'une série convergente. 
    $$\text{(a) } \frac{1}{n^{3}} ; \quad \text{(b) } \frac{4\mathrm{e}^{-2}}{n^{2}} \ \big(\text{maximum en } x = \tfrac{2}{n}\big) ; \quad \text{(c) } \frac{1}{n^{2}} \ (\text{fonction croissante}) ;$$

    $$\text{(d) } \frac{1}{2^{n}} ; \quad \text{(e) } \frac{\mathrm{e}^{-n^{2}}}{n} ; \quad \text{(f) } \frac{A}{n^{2}}.$$
     Pour $u_{n}(x) = x\,\mathrm{e}^{-nx}$, $n \geqslant 1$, l'exercice 1 (b) donne $\lVert u_{n} \rVert_{\infty} = \frac{1}{\mathrm{e} n}$ : pas de convergence normale sur $\mathbb{R}_{+}$. La somme vaut $S(0) = 0$ et, pour $x > 0$, par la série géométrique, 
    $$S(x) = x\frac{\mathrm{e}^{-x}}{1 - \mathrm{e}^{-x}} = \frac{x}{\mathrm{e}^{x} - 1} \xrightarrow[x \to 0^{+}]{} 1.$$

    $$\boxed{S \text{ discontinue en } 0 : \text{ ni CN ni CU sur } \mathbb{R}_{+} \ \text{(théorème 6)}}$$
     Sur $[a, +\infty[$, la convergence est normale, car $\sup_{x \geqslant a} x\,\mathrm{e}^{-nx} = a\,\mathrm{e}^{-na}$ dès que $n \geqslant \frac{1}{a}$.
- id: "mp-08-25"
  feuille: "f-mp-08"
  numero: 25
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence des séries, convergence uniforme, convergence normale, intégration]
  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme, ri-integrable]
  notions: [convergence-uniforme]
  source: "Suites et séries de fonctions (Prost, LLG), exercice 16"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Étudier la convergence simple, normale, puis uniforme sur $\mathbb{R}_{+}$ des séries de termes généraux 
    $$u_{n}(x) = \frac{x}{n(1 + nx)} \qquad\text{et}\qquad v_{n}(x) = \frac{x}{(1 + nx)^{2}}, \qquad n \geqslant 1.$$
     Pour la seconde, on minorera le reste $\sum_{k > n} v_{k}(x)$ en $x = \frac{1}{n}$ par une intégrale, et l'on montrera que la convergence est normale sur $[a, +\infty[$ pour tout $a > 0$.
  corrige: |
    **Série $\sum u_{n}$.** La fonction $u_{n}$ croît sur $\mathbb{R}_{+}$ et tend vers $\frac{1}{n^{2}}$ en $+\infty$. 
    $$\boxed{\lVert u_{n} \rVert_{\infty} = \tfrac{1}{n^{2}} : \text{ CN, donc CU et CS sur } \mathbb{R}_{+}}$$

    **Série $\sum v_{n}$.** En $0$, tous les termes sont nuls ; pour $x > 0$, $v_{n}(x) \leqslant \frac{1}{n^{2}x}$ : la convergence simple a lieu sur $\mathbb{R}_{+}$. La dérivée de $v_{n}$ s'annule en $x = \frac{1}{n}$, d'où $\lVert v_{n} \rVert_{\infty} = \frac{1}{4n}$ : pas de convergence normale sur $\mathbb{R}_{+}$. Pour la convergence uniforme, on minore le reste en $x = \frac{1}{n}$ en ne gardant que les termes $n < k \leqslant 2n$ : 
    $$R_{n}\big(\tfrac{1}{n}\big) \geqslant \sum_{k = n + 1}^{2n} \frac{1/n}{(1 + k/n)^{2}} \geqslant n \cdot \frac{1/n}{9} = \frac{1}{9}.$$
     Une comparaison à une intégrale donnerait plus précisément $R_{n}(\frac{1}{n}) \to \frac{1}{2}$. Sur $[a, +\infty[$, $v_{n}(x) \leqslant \frac{1}{n^{2}a}$. 
    $$\boxed{\sum v_{n} : \text{ CS sur } \mathbb{R}_{+}, \text{ ni CN ni CU sur } \mathbb{R}_{+}, \text{ CN sur } [a, +\infty[}$$
- id: "mp-08-26"
  feuille: "f-mp-08"
  numero: 26
  partie: "Entraînement : modes de convergence des séries de fonctions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence des séries, convergence uniforme, convergence normale]
  noeuds: [cx-convergence-uniforme, as-series, fc-uniforme]
  notions: [convergence-uniforme]
  source: "BibM@th, Suites et séries de fonctions, exercices 25 et 26 ; Suites et séries de fonctions (Prost, LLG), exercice 17"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Uniforme sans être normale.* Montrer que les séries suivantes convergent uniformément, mais pas normalement, sur l'ensemble indiqué : 
    $$\text{(a) } \sum_{n \geqslant 1} \frac{(-1)^{n}}{n + x^{2}} \text{ sur } \mathbb{R} ; \qquad \text{(b) } \sum_{n \geqslant 1} (-1)^{n}\ln\Big(1 + \frac{x}{n(1 + x)}\Big) \text{ sur } \mathbb{R}_{+} ; \qquad \text{(c) } \sum_{n \geqslant 2} \frac{x\,\mathrm{e}^{-nx}}{\ln n} \text{ sur } \mathbb{R}_{+}.$$
     Pour (c), on majorera le reste d'ordre $n$ par $\frac{1}{\ln(n + 1)}\sum_{k \geqslant 1} x\,\mathrm{e}^{-kx}$, et l'on utilisera la série de Bertrand $\sum \frac{1}{n\ln n}$, divergente.
  corrige: |
    Dans les trois cas, on majore le reste indépendamment de $x$, alors que $\sum \lVert u_{n} \rVert_{\infty}$ diverge.

    **(a)** Pour $x$ fixé, $\big(\frac{1}{n + x^{2}}\big)$ décroît vers $0$ : le critère des séries alternées donne 
    $$|R_{n}(x)| \leqslant \frac{1}{n + 1 + x^{2}} \leqslant \frac{1}{n + 1}, \qquad\text{mais}\qquad \lVert u_{n} \rVert_{\infty} = \frac{1}{n}.$$

    **(b)** Le terme $a_{n}(x) = \ln\big(1 + \frac{x}{n(1 + x)}\big)$ décroît vers $0$ en $n$ ; comme $\frac{x}{1 + x} < 1$, 
    $$|R_{n}(x)| \leqslant a_{n + 1}(x) \leqslant \ln\Big(1 + \frac{1}{n + 1}\Big), \qquad\text{mais}\qquad \lVert a_{n} \rVert_{\infty} = \ln\Big(1 + \frac{1}{n}\Big) \sim \frac{1}{n},$$
     borne supérieure obtenue en $+\infty$.

    **(c)** Les termes sont positifs, et $\ln k \geqslant \ln(n + 1)$ pour $k > n$ : 
    $$0 \leqslant R_{n}(x) \leqslant \frac{1}{\ln(n + 1)}\sum_{k \geqslant 1} x\,\mathrm{e}^{-kx} = \frac{1}{\ln(n + 1)} \cdot \frac{x}{\mathrm{e}^{x} - 1} \leqslant \frac{1}{\ln(n + 1)},$$
     puisque $\mathrm{e}^{x} - 1 \geqslant x$. Mais $\lVert u_{n} \rVert_{\infty} = \frac{1}{\mathrm{e} n\ln n}$, terme d'une série de Bertrand divergente. 
    $$\boxed{\text{(a), (b), (c) : CU sans CN}}$$
- id: "mp-08-27"
  feuille: "f-mp-08"
  numero: 27
  partie: "Entraînement : modes de convergence des séries de fonctions"
