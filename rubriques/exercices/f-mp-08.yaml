  enonce: |
    *Composition.* Soit $(f_{n})$ une suite de fonctions de $I$ dans $\mathbb{R}$ convergeant uniformément sur $I$ vers $f$.

    **1.** Soit $\varphi : \mathbb{R} \to \mathbb{R}$ uniformément continue. Montrer que $(\varphi \circ f_{n})$ converge uniformément vers $\varphi \circ f$ sur $I$.

    **2.** Que dire de la suite $\big(\frac{f_{n}}{1 + f_{n}^{2}}\big)$ ? On montrera que $t \mapsto \frac{t}{1 + t^{2}}$ est $1$-lipschitzienne.

    **3.** Montrer par un exemple que l'hypothèse d'uniforme continuité ne peut pas être remplacée par la continuité.
  corrige: |
    **1.** On combine les deux uniformités. Soit $\varepsilon > 0$ et $\eta > 0$ tel que $|\varphi(s) - \varphi(t)| \leqslant \varepsilon$ dès que $|s - t| \leqslant \eta$. Pour $n$ tel que $\lVert f_{n} - f \rVert_{\infty} \leqslant \eta$, on a $|\varphi(f_{n}(x)) - \varphi(f(x))| \leqslant \varepsilon$ pour tout $x \in I$. 
    $$\boxed{\varphi \circ f_{n} \to \varphi \circ f \text{ uniformément sur } I}$$

    **2.** On montre que $\varphi(t) = \frac{t}{1 + t^{2}}$ est lipschitzienne. Sa dérivée vérifie 
    $$\varphi'(t) = \frac{1 - t^{2}}{(1 + t^{2})^{2}}, \qquad |1 - t^{2}| \leqslant 1 + t^{2} \leqslant (1 + t^{2})^{2},$$
     donc $|\varphi'| \leqslant 1$ : $\varphi$ est $1$-lipschitzienne, donc uniformément continue. 
    $$\boxed{\frac{f_{n}}{1 + f_{n}^{2}} \to \frac{f}{1 + f^{2}} \text{ uniformément sur } I}$$

    **3.** La fonction $\varphi(t) = t^{2}$ est continue, non uniformément continue sur $\mathbb{R}$, et l'exercice 6 donne $f_{n}(x) = x + \frac{1}{n}$, pour laquelle $\varphi \circ f_{n} \not\to \varphi \circ f$ uniformément.
- id: "mp-08-08"
  feuille: "f-mp-08"
