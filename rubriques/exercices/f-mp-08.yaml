  enonce: |
    Pour $t \geqslant 0$, on pose $S(t) = \sum_{n = 1}^{+\infty} \dfrac{\mathrm{e}^{-nt}}{1 + n^{2}}$.

    **1.** Montrer que $S$ est continue sur $\mathbb{R}_{+}$ et de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}_{+}^{*}$.

    **2.** Montrer que $S$ n'est pas dérivable en $0$, et que sa courbe y admet une demi-tangente verticale. On minorera $\frac{S(0) - S(t)}{t}$ par une somme finie.
  corrige: |
    **1.** Sur $\mathbb{R}_{+}$, on a $0 \leqslant u_{n}(t) \leqslant \frac{1}{1 + n^{2}}$. Sur $[a, +\infty[$, la dérivée $k$-ième est majorée par $n^{k}\mathrm{e}^{-na}$, qui est un $o(n^{-2})$. 
    $$\boxed{S \in \mathcal{C}(\mathbb{R}_{+}) \cap \mathcal{C}^{\infty}(\mathbb{R}_{+}^{*})}$$

    **2.** Pour tout $N$, les termes étant positifs, 
    $$\frac{S(0) - S(t)}{t} = \sum_{n \geqslant 1} \frac{1 - \mathrm{e}^{-nt}}{t(1 + n^{2})} \geqslant \sum_{n = 1}^{N} \frac{1 - \mathrm{e}^{-nt}}{t(1 + n^{2})} \xrightarrow[t \to 0^{+}]{} \sum_{n = 1}^{N} \frac{n}{1 + n^{2}},$$
     et cette somme tend vers $+\infty$ avec $N$, puisque $\frac{n}{1 + n^{2}} \sim \frac{1}{n}$. 
    $$\boxed{\frac{S(t) - S(0)}{t} \to -\infty : \text{ demi-tangente verticale en } 0}$$
- id: "mp-08-41"
  feuille: "f-mp-08"
  numero: 41
  partie: "Fonctions définies par une série"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions définies par une série, intégration, équivalents]
  noeuds: [cx-convergence-uniforme, ri-integrable, as-series, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  source: "Suites et séries de fonctions (Prost, LLG), exercices 21 et 27"
  page_enonce: 9
  page_corrige: 22
  enonce: |
    *Équivalents par comparaison à une intégrale.*

    **1.** Pour $x \geqslant 0$, on pose $F(x) = \sum_{n = 1}^{+\infty} \ln\Big(1 + \dfrac{x}{n^{2}}\Big)$. Montrer que $F$ est définie et continue sur $\mathbb{R}_{+}$.

    **2.** Vérifier que $\Phi : s \mapsto s\ln\big(1 + \frac{1}{s^{2}}\big) + 2\operatorname{Arctan} s$ est une primitive de $s \mapsto \ln\big(1 + \frac{1}{s^{2}}\big)$ sur $\mathbb{R}_{+}^{*}$, et que $\Phi(s) \to 0$ quand $s \to 0^{+}$ et $\Phi(s) \to \pi$ quand $s \to +\infty$.

    **3.** Pour $x > 0$, établir l'encadrement 
    $$\sqrt{x}\Big(\Phi\Big(\frac{N + 1}{\sqrt{x}}\Big) - \Phi\Big(\frac{1}{\sqrt{x}}\Big)\Big) \leqslant \sum_{n = 1}^{N} \ln\Big(1 + \frac{x}{n^{2}}\Big) \leqslant \ln(1 + x) + \sqrt{x}\Big(\Phi\Big(\frac{N}{\sqrt{x}}\Big) - \Phi\Big(\frac{1}{\sqrt{x}}\Big)\Big),$$
     et en déduire que $F(x) \sim \pi\sqrt{x}$ quand $x \to +\infty$.

    **4.** Pour $x \neq 0$, on pose $G(x) = \sum_{n \geqslant 1} \ln\big(1 + \frac{1}{n^{2}x^{2}}\big)$. Déterminer un équivalent de $G$ en $0$ et en $+\infty$.
  corrige: |
    **1.** Sur $[0, A]$, $0 \leqslant \ln\big(1 + \frac{x}{n^{2}}\big) \leqslant \frac{A}{n^{2}}$ : convergence normale.

    **2.** On dérive : 
    $$\Phi'(s) = \ln\Big(1 + \frac{1}{s^{2}}\Big) + s\frac{-2/s^{3}}{1 + 1/s^{2}} + \frac{2}{1 + s^{2}} = \ln\Big(1 + \frac{1}{s^{2}}\Big).$$
     En $0^{+}$, $s\ln(1 + \frac{1}{s^{2}}) = s\ln(1 + s^{2}) - 2s\ln s \to 0$ ; en $+\infty$, $s\ln(1 + \frac{1}{s^{2}}) \sim \frac{1}{s} \to 0$ et $2\operatorname{Arctan} s \to \pi$. 
    $$\boxed{\Phi(0^{+}) = 0, \qquad \Phi(+\infty) = \pi}$$

    **3.** La fonction $t \mapsto \ln(1 + \frac{x}{t^{2}})$ décroît sur $\mathbb{R}_{+}^{*}$. La comparaison terme à terme donne 
    $$\int_{1}^{N + 1} \ln\Big(1 + \frac{x}{t^{2}}\Big)\mathrm{d} t \leqslant \sum_{n = 1}^{N} \ln\Big(1 + \frac{x}{n^{2}}\Big) \leqslant \ln(1 + x) + \int_{1}^{N} \ln\Big(1 + \frac{x}{t^{2}}\Big)\mathrm{d} t,$$
     et le changement de variable $t = \sqrt{x}\,s$ donne $\int_{\alpha}^{\beta} \ln(1 + \frac{x}{t^{2}})\,\mathrm{d} t = \sqrt{x}\big(\Phi(\frac{\beta}{\sqrt{x}}) - \Phi(\frac{\alpha}{\sqrt{x}})\big)$. Quand $N \to +\infty$, 
    $$\sqrt{x}\Big(\pi - \Phi\Big(\frac{1}{\sqrt{x}}\Big)\Big) \leqslant F(x) \leqslant \ln(1 + x) + \sqrt{x}\Big(\pi - \Phi\Big(\frac{1}{\sqrt{x}}\Big)\Big).$$
     Quand $x \to +\infty$, $\Phi(\frac{1}{\sqrt{x}}) \to 0$ et $\ln(1 + x) = o(\sqrt{x})$. 
    $$\boxed{F(x) \underset{+\infty}{\sim} \pi\sqrt{x}}$$

    **4.** On a $G(x) = F\big(\frac{1}{x^{2}}\big)$, fonction paire. En $0$, $\frac{1}{x^{2}} \to +\infty$ et la question 3 s'applique. En $+\infty$, $y = \frac{1}{x^{2}} \to 0$ : la série $\frac{F(y)}{y} = \sum \frac{\ln(1 + y/n^{2})}{y}$ a des termes majorés par $\frac{1}{n^{2}}$ et de limite $\frac{1}{n^{2}}$, et le théorème 6 (ii) donne $F(y) \sim \frac{\pi^{2}}{6}y$. 
    $$\boxed{G(x) \underset{0}{\sim} \frac{\pi}{|x|}, \qquad G(x) \underset{+\infty}{\sim} \frac{\pi^{2}}{6x^{2}}}$$
     Une formule d'Euler, analogue au produit de l'exercice 30, donne $F(x) = \ln\frac{\operatorname{sh}(\pi\sqrt{x})}{\pi\sqrt{x}}$, ce qui redonne l'équivalent ; elle a été vérifiée numériquement.
- id: "mp-08-42"
  feuille: "f-mp-08"
  numero: 42
  partie: "Fonctions définies par une série"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [fonctions définies par une série, intégration, équivalents]
  noeuds: [cx-convergence-uniforme, ri-integrable, as-series]
  notions: []
  source: "Suites et séries de fonctions (Prost, LLG), exercice 26"
  page_enonce: 9
  page_corrige: 22
  enonce: |
    Pour $x > 0$, on pose $f(x) = \sum_{n = 1}^{+\infty} \ln\big(1 + \mathrm{e}^{-nx}\big)$.

    **1.** Montrer que $f$ est définie et continue sur $\mathbb{R}_{+}^{*}$, et déterminer sa limite en $+\infty$.

    **2.** Montrer que $u \mapsto \frac{\ln(1 + u)}{u}$ se prolonge en une fonction continue sur $[0, 1]$. On note 
    $$L = \int_{0}^{1} \frac{\ln(1 + u)}{u}\,\mathrm{d} u.$$

    **3.** Pour $x > 0$ et $M > 1$, calculer $\int_{1}^{M} \ln\big(1 + \mathrm{e}^{-tx}\big)\,\mathrm{d} t$ à l'aide du changement de variable $u = \mathrm{e}^{-tx}$. En comparant la série à des intégrales, en déduire que $f(x) \sim \frac{L}{x}$ quand $x \to 0^{+}$.

    Le chapitre 9 montrera que $L = \frac{\pi^{2}}{12}$.
  corrige: |
    **1.** Sur $[a, +\infty[$, $0 \leqslant \ln(1 + \mathrm{e}^{-nx}) \leqslant \mathrm{e}^{-nx} \leqslant \mathrm{e}^{-na}$ : convergence normale. Chaque terme tend vers $0$ en $+\infty$, et le théorème 6 (ii) s'applique sur $[1, +\infty[$. 
    $$\boxed{f \text{ continue sur } \mathbb{R}_{+}^{*}, \qquad \lim_{+\infty} f = 0}$$

    **2.** Comme $\ln(1 + u) \sim u$ en $0$, le quotient tend vers $1$ : on le prolonge par $1$ en $0$, et $L$ est l'intégrale d'une fonction continue sur un segment.

    **3.** Avec $u = \mathrm{e}^{-tx}$, $\mathrm{d} t = -\frac{\mathrm{d} u}{xu}$, et 
    $$\int_{1}^{M} \ln(1 + \mathrm{e}^{-tx})\,\mathrm{d} t = \frac{1}{x}\int_{\mathrm{e}^{-Mx}}^{\mathrm{e}^{-x}} \frac{\ln(1 + u)}{u}\,\mathrm{d} u.$$
     La fonction $t \mapsto \ln(1 + \mathrm{e}^{-tx})$ décroît ; on note $\Lambda(x) = \int_{0}^{\mathrm{e}^{-x}} \frac{\ln(1 + u)}{u}\,\mathrm{d} u$. La comparaison série-intégrale et le passage à la limite $N \to +\infty$ donnent 
    $$\frac{\Lambda(x)}{x} \leqslant f(x) \leqslant \ln(1 + \mathrm{e}^{-x}) + \frac{\Lambda(x)}{x}.$$
     Quand $x \to 0^{+}$, $\Lambda(x) \to L$ par continuité de l'intégrale en sa borne, et $\ln(1 + \mathrm{e}^{-x}) \to \ln 2$. 
    $$\boxed{f(x) \underset{0^{+}}{\sim} \frac{L}{x}}$$
     Numériquement, $L \approx 0{,}8225$, en accord avec la valeur $\frac{\pi^{2}}{12}$ que le chapitre 9 établira.
- id: "mp-08-43"
  feuille: "f-mp-08"
  numero: 43
  partie: "Fonctions définies par une série"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions définies par une série, convergence normale]
  noeuds: [cx-convergence-uniforme]
  notions: []
  source: "Suites et séries de fonctions (Prost, LLG), exercice 30"
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Pour $n \geqslant 1$ et $x \in \mathbb{R}$, on pose $f_{n}(x) = \operatorname{th}(x + n) - \operatorname{th}(n)$.

    **1.** Soit $A > 0$. Montrer que, pour $|x| \leqslant A$ et $n > A$, $|f_{n}(x)| \leqslant 4A\,\mathrm{e}^{-2(n - A)}$. En déduire que $\sum f_{n}$ converge normalement sur $[-A, A]$. On note $S$ sa somme.

    **2.** Montrer que $S$ est croissante et continue sur $\mathbb{R}$.

    **3.** Montrer que $S(x + 1) - S(x) = 1 - \operatorname{th}(x + 1)$ pour tout $x \in \mathbb{R}$.

    **4.** En déduire la limite de $S(x + 1) - S(x)$ en $+\infty$, puis montrer que $S(x) \to -\infty$ quand $x \to -\infty$.
  corrige: |
    **1.** On applique l'inégalité des accroissements finis à $\operatorname{th}$, de dérivée $\frac{1}{\operatorname{ch}^{2}}$, sur le segment d'extrémités $n$ et $x + n$, inclus dans $[n - A, n + A] \subset \mathbb{R}_{+}^{*}$. Comme $\operatorname{ch} y \geqslant \frac{\mathrm{e}^{y}}{2}$, 
    $$|f_{n}(x)| \leqslant |x|\sup_{[n - A, n + A]} \frac{1}{\operatorname{ch}^{2}} \leqslant 4A\,\mathrm{e}^{-2(n - A)}.$$

    $$\boxed{\sum f_{n} \text{ CN sur } [-A, A]}$$

    **2.** Chaque $f_{n}$ est continue et croissante ; la somme l'est sur chaque $[-A, A]$, donc sur $\mathbb{R}$.

    **3.** La différence de deux séries convergentes est télescopique : 
    $$S(x + 1) - S(x) = \lim_{N \to +\infty} \sum_{n = 1}^{N} \big(\operatorname{th}(x + 1 + n) - \operatorname{th}(x + n)\big) = \lim_{N \to +\infty} \big(\operatorname{th}(x + N + 1) - \operatorname{th}(x + 1)\big).$$

    $$\boxed{S(x + 1) - S(x) = 1 - \operatorname{th}(x + 1)}$$

    **4.** En $+\infty$, $1 - \operatorname{th}(x + 1) \to 0$. Comme $S(0) = 0$, en sommant la relation de la question 3, 
    $$S(-p) = -\sum_{j = 0}^{p - 1} \big(1 - \operatorname{th}(-j)\big) = -\sum_{j = 0}^{p - 1} (1 + \operatorname{th} j) \leqslant -p,$$
     et par croissance, $S(x) \leqslant -p$ pour $x \leqslant -p$. 
    $$\boxed{S(x + 1) - S(x) \xrightarrow[+\infty]{} 0, \qquad S(x) \xrightarrow[-\infty]{} -\infty}$$
- id: "mp-08-44"
  feuille: "f-mp-08"
  numero: 44
  partie: "Approximation uniforme"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [approximation uniforme, intégration, fonctions en escalier]
  noeuds: [fc-weierstrass, ri-integrable]
  notions: []
  source: "exercice composé pour la feuille (cours, théorème 7 et lemme de Riemann-Lebesgue) ; Suites et séries de fonctions (Prost, LLG), exercice 36"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Soit $f : [a, b] \to \mathbb{C}$ continue par morceaux. On veut montrer que 
    $$\int_{a}^{b} f(t)\,|\sin(nt)|\,\mathrm{d} t \xrightarrow[n \to +\infty]{} \frac{2}{\pi}\int_{a}^{b} f(t)\,\mathrm{d} t.$$

    **1.** Calculer $\int_{k\pi/n}^{(k + 1)\pi/n} |\sin(nt)|\,\mathrm{d} t$. En déduire que, pour $[c, d] \subset [a, b]$, $\Big|\int_{c}^{d} |\sin(nt)|\,\mathrm{d} t - \frac{2}{\pi}(d - c)\Big| \leqslant \frac{4\pi}{n}$.

    **2.** Conclure pour une fonction en escalier, puis pour $f$ à l'aide du théorème d'approximation par des fonctions en escalier.

    **3.** Que vaut la limite de $\int_{0}^{\pi} \frac{|\sin(nt)|}{1 + t}\,\mathrm{d} t$ ?
  corrige: |
    **1.** Le changement de variable $u = nt$ donne la valeur sur une arche : 
    $$\int_{k\pi/n}^{(k + 1)\pi/n} |\sin(nt)|\,\mathrm{d} t = \frac{1}{n}\int_{0}^{\pi} \sin u\,\mathrm{d} u = \frac{2}{n}.$$
     Soit $[\alpha, \beta]$ la réunion des arches $\big[\frac{k\pi}{n}, \frac{(k + 1)\pi}{n}\big]$ incluses dans $[c, d]$ ; elle contient $p$ arches, avec $\frac{p\pi}{n} = \beta - \alpha \in \big[d - c - \frac{2\pi}{n}, d - c\big]$. Les deux morceaux restants, de longueur au plus $\frac{\pi}{n}$ chacun, contribuent pour au plus $\frac{2\pi}{n}$. Ainsi 
    $$\Big|\int_{c}^{d} |\sin(nt)|\,\mathrm{d} t - \frac{2}{\pi}(d - c)\Big| \leqslant \frac{2\pi}{n} + \Big|\frac{2p}{n} - \frac{2}{\pi}(d - c)\Big| \leqslant \frac{2\pi}{n} + \frac{4}{n} \leqslant \frac{4\pi}{n}.$$
     Si $[c, d]$ ne contient aucune arche, les deux termes sont directement majorés par $\frac{2\pi}{n}$ et $\frac{4}{n}$.

    **2.** Une fonction en escalier est, sauf en un nombre fini de points, une combinaison linéaire d'indicatrices d'intervalles : le résultat découle de la question 1 par linéarité. Pour $f$ continue par morceaux, soit $\varphi$ en escalier avec $\lVert f - \varphi \rVert_{\infty} \leqslant \varepsilon$ (théorème 7). Alors 
    $$\Big|\int_{a}^{b} f|\sin(nt)| - \frac{2}{\pi}\int_{a}^{b} f\Big| \leqslant (b - a)\varepsilon + \Big|\int_{a}^{b} \varphi|\sin(nt)| - \frac{2}{\pi}\int_{a}^{b} \varphi\Big| + \frac{2}{\pi}(b - a)\varepsilon,$$
     et le terme du milieu est inférieur à $\varepsilon$ pour $n$ assez grand. 
    $$\boxed{\int_{a}^{b} f(t)|\sin(nt)|\,\mathrm{d} t \to \frac{2}{\pi}\int_{a}^{b} f(t)\,\mathrm{d} t}$$

    **3.** On applique le résultat à $f(t) = \frac{1}{1 + t}$ sur $[0, \pi]$. 
    $$\boxed{\int_{0}^{\pi} \frac{|\sin(nt)|}{1 + t}\,\mathrm{d} t \to \frac{2}{\pi}\ln(1 + \pi) \approx 0{,}905}$$
     La fonction $|\sin(nt)|$ oscille si vite qu'elle agit comme sa valeur moyenne $\frac{2}{\pi}$ : c'est le même mécanisme que dans le lemme de Riemann-Lebesgue, où la valeur moyenne de $\mathrm{e}^{\mathrm{i}\lambda t}$ est nulle.
- id: "mp-08-45"
  feuille: "f-mp-08"
