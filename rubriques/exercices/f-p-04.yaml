  page_corrige: 8
  enonce: |
    Chacune des fonctions suivantes est un **quotient**. Après avoir posé $u$ et $v$, donner la fonction dérivée sous forme simplifiée, en précisant l'ensemble de dérivabilité.

    **a)** $f(x)=\dfrac{1-2x}{x-2}$

    **b)** $f(x)=\dfrac{\sqrt{x}}{x+1}$

    **c)** $f(x)=\dfrac{2-x^{2}}{2+x^{2}}$

    **d)** $f(x)=\dfrac{x^{2}-4x+8}{2x-5}$

    **e)** $f(x)=\dfrac{3x+1}{x^{2}+1}$

    **f)** $f(x)=\dfrac{x^{2}+x}{x-1}$

    **g)** $f(x)=\dfrac{x+3}{2x-1}$

    **h)** $f(x)=\dfrac{\sqrt{x}+1}{x}$
  corrige: |
    *On utilise la formule du quotient : $f'(x)=\dfrac{u'(x)v(x)-u(x)v'(x)}{\big(v(x)\big)^{2}}$. **Attention à l'ordre des deux termes du numérateur : ici c'est une soustraction, et elle n'est pas commutative.***

    **a)** $f(x)=\dfrac{1-2x}{x-2}$, dérivable sur $\mathbb{R}\setminus\{2\}$. On pose :

    $$\left\{\begin{array}{l} u(x)=1-2x \\[2mm] v(x)=x-2 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=-2 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{-2(x-2)-(1-2x)\times 1}{(x-2)^{2}} =\dfrac{-2x+4-1+2x}{(x-2)^{2}}=\boxed{\dfrac{3}{(x-2)^{2}}}$$

    **b)** $f(x)=\dfrac{\sqrt{x}}{x+1}$, dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=\sqrt{x} \\[2mm] v(x)=x+1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{2\sqrt{x}} \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{\dfrac{1}{2\sqrt{x}}(x+1)-\sqrt{x}}{(x+1)^{2}} =\dfrac{\dfrac{x+1}{2\sqrt{x}}-\dfrac{2x}{2\sqrt{x}}}{(x+1)^{2}} =\boxed{\dfrac{1-x}{2\sqrt{x}\,(x+1)^{2}}}$$

    **c)** $f(x)=\dfrac{2-x^{2}}{2+x^{2}}$, dérivable sur $\mathbb{R}$. On pose :

    $$\left\{\begin{array}{l} u(x)=2-x^{2} \\[2mm] v(x)=2+x^{2} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=-2x \\[2mm] v'(x)=2x \end{array}\right.$$

    $$f'(x)=\dfrac{-2x(2+x^{2})-(2-x^{2})\times 2x}{(2+x^{2})^{2}} =\dfrac{-4x-2x^{3}-4x+2x^{3}}{(2+x^{2})^{2}}=\boxed{\dfrac{-8x}{(2+x^{2})^{2}}}$$

    **d)** $f(x)=\dfrac{x^{2}-4x+8}{2x-5}$, dérivable sur $\mathbb{R}\setminus\left\{\frac{5}{2}\right\}$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}-4x+8 \\[2mm] v(x)=2x-5 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x-4 \\[2mm] v'(x)=2 \end{array}\right.$$

    $$f'(x)=\dfrac{(2x-4)(2x-5)-2(x^{2}-4x+8)}{(2x-5)^{2}} =\dfrac{4x^{2}-18x+20-2x^{2}+8x-16}{(2x-5)^{2}}$$

    $$=\boxed{\dfrac{2x^{2}-10x+4}{(2x-5)^{2}}=\dfrac{2(x^{2}-5x+2)}{(2x-5)^{2}}}$$

    **e)** $f(x)=\dfrac{3x+1}{x^{2}+1}$, dérivable sur $\mathbb{R}$. On pose :

    $$\left\{\begin{array}{l} u(x)=3x+1 \\[2mm] v(x)=x^{2}+1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=3 \\[2mm] v'(x)=2x \end{array}\right.$$

    $$f'(x)=\dfrac{3(x^{2}+1)-(3x+1)\times 2x}{(x^{2}+1)^{2}} =\dfrac{3x^{2}+3-6x^{2}-2x}{(x^{2}+1)^{2}}=\boxed{\dfrac{-3x^{2}-2x+3}{(x^{2}+1)^{2}}}$$

    **f)** $f(x)=\dfrac{x^{2}+x}{x-1}$, dérivable sur $\mathbb{R}\setminus\{1\}$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+x \\[2mm] v(x)=x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x+1 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{(2x+1)(x-1)-(x^{2}+x)}{(x-1)^{2}} =\dfrac{2x^{2}-x-1-x^{2}-x}{(x-1)^{2}}=\boxed{\dfrac{x^{2}-2x-1}{(x-1)^{2}}}$$

    **g)** $f(x)=\dfrac{x+3}{2x-1}$, dérivable sur $\mathbb{R}\setminus\left\{\frac{1}{2}\right\}$. On pose :

    $$\left\{\begin{array}{l} u(x)=x+3 \\[2mm] v(x)=2x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=2 \end{array}\right.$$

    $$f'(x)=\dfrac{1\times(2x-1)-(x+3)\times 2}{(2x-1)^{2}} =\dfrac{2x-1-2x-6}{(2x-1)^{2}}=\boxed{\dfrac{-7}{(2x-1)^{2}}}$$

    **h)** $f(x)=\dfrac{\sqrt{x}+1}{x}$, dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=\sqrt{x}+1 \\[2mm] v(x)=x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{2\sqrt{x}} \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{\dfrac{1}{2\sqrt{x}}\times x-\left(\sqrt{x}+1\right)}{x^{2}} =\dfrac{\dfrac{\sqrt{x}}{2}-\sqrt{x}-1}{x^{2}} =\dfrac{-\dfrac{\sqrt{x}}{2}-1}{x^{2}}=\boxed{-\dfrac{\sqrt{x}+2}{2x^{2}}}$$
     en utilisant $\dfrac{x}{2\sqrt{x}}=\dfrac{\sqrt{x}}{2}$.
- id: "p-04-12"
  feuille: "f-p-04"
  numero: 12
