  page_enonce: 4
  page_corrige: 7
  enonce: |
    Chacune des fonctions suivantes est l'**inverse** d'une fonction. Après avoir posé $v$, donner la fonction dérivée en précisant l'ensemble de dérivabilité.

    **a)** $f(x)=\dfrac{2}{3x-5}$

    **b)** $f(x)=\dfrac{1}{x^{2}+1}$

    **c)** $f(x)=\dfrac{1}{\sqrt{x}}$

    **d)** $f(x)=\dfrac{-3}{x^{2}-4}$

    **e)** $f(x)=\dfrac{1}{2x-1}$

    **f)** $f(x)=\dfrac{5}{x^{3}+x}$
  corrige: |
    *On utilise la formule de l'inverse : $\left(\dfrac{1}{v}\right)'=-\dfrac{v'}{v^{2}}$.*

    **a)** $f(x)=2\times\dfrac{1}{3x-5}$, dérivable sur $\mathbb{R}\setminus\left\{\frac{5}{3}\right\}$.

    $$v(x)=3x-5 \qquad\text{ce qui donne :}\qquad v'(x)=3$$

    $$f'(x)=2\times\left(-\dfrac{3}{(3x-5)^{2}}\right)=\boxed{-\dfrac{6}{(3x-5)^{2}}}$$

    **b)** $f(x)=\dfrac{1}{x^{2}+1}$, dérivable sur $\mathbb{R}$ car $x^{2}+1\geqslant 1>0$.

    $$v(x)=x^{2}+1 \qquad\text{ce qui donne :}\qquad v'(x)=2x$$

    $$\boxed{f'(x)=-\dfrac{2x}{(x^{2}+1)^{2}}}$$

    **c)** $f(x)=\dfrac{1}{\sqrt{x}}$, dérivable sur $]0\,;+\infty[$.

    $$v(x)=\sqrt{x} \qquad\text{ce qui donne :}\qquad v'(x)=\dfrac{1}{2\sqrt{x}}$$

    $$f'(x)=-\dfrac{\frac{1}{2\sqrt{x}}}{\left(\sqrt{x}\right)^{2}} =-\dfrac{1}{2\sqrt{x}\times x}=\boxed{-\dfrac{1}{2x\sqrt{x}}}$$

    **d)** $f(x)=-3\times\dfrac{1}{x^{2}-4}$, dérivable sur $\mathbb{R}\setminus\{-2\,;2\}$.

    $$v(x)=x^{2}-4 \qquad\text{ce qui donne :}\qquad v'(x)=2x$$

    $$f'(x)=-3\times\left(-\dfrac{2x}{(x^{2}-4)^{2}}\right)=\boxed{\dfrac{6x}{(x^{2}-4)^{2}}}$$

    **e)** $f(x)=\dfrac{1}{2x-1}$, dérivable sur $\mathbb{R}\setminus\left\{\frac{1}{2}\right\}$.

    $$v(x)=2x-1 \qquad\text{ce qui donne :}\qquad v'(x)=2$$

    $$\boxed{f'(x)=-\dfrac{2}{(2x-1)^{2}}}$$

    **f)** $f(x)=5\times\dfrac{1}{x^{3}+x}$. Comme $x^{3}+x=x(x^{2}+1)$ ne s'annule qu'en $0$, $f$ est dérivable sur $\mathbb{R}^{*}$.

    $$v(x)=x^{3}+x \qquad\text{ce qui donne :}\qquad v'(x)=3x^{2}+1$$

    $$\boxed{f'(x)=-\dfrac{5(3x^{2}+1)}{(x^{3}+x)^{2}}}$$
- id: "p-04-11"
  feuille: "f-p-04"
  numero: 11
  partie: "Fonction dérivée : calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, produit et quotient, racine carrée]
  noeuds: [ar-deriv]
