  enonce: |
    **Attention : la courbe ci-dessous est celle de la fonction dérivée $f'$**, et non celle de $f$. La fonction $f$ est définie et dérivable sur $[-3\,;3]$.

    ![Figure](documents/figures/f54ec814e1deba84.svg)

    **1.** Déterminer par lecture graphique les valeurs de $x$ pour lesquelles $f'(x)=0$.

    **2.** Dresser le tableau de signes de $f'$ sur $[-3\,;3]$.

    **3.** En déduire le tableau de variations de $f$ sur $[-3\,;3]$.

    **4.** La fonction $f$ admet-elle des extremums locaux ? Si oui, en quelles abscisses, et de quelle nature ?

    **5.** Lire $f'(0)$. Que représente ce nombre pour la courbe de $f$ ?

    **6.** On sait de plus que $f(0)=1$. Donner une équation de la tangente à la courbe de $f$ au point d'abscisse $0$.
  corrige: |
    **1.** La courbe de $f'$ coupe l'axe des abscisses en deux points : 
    $$\boxed{f'(x)=0 \text{ pour } x=-2 \text{ et } x=2}$$

    **2.** La parabole est *au-dessus* de l'axe entre $-2$ et $2$, et en dessous à l'extérieur :

    ![Figure](documents/figures/65ba3943741bf61d.svg)

    *Piège à éviter :* on lit ici le **signe** de $f'$, c'est-à-dire la position de la courbe par rapport à l'axe — et non ses variations.

    **3.** Le signe de $f'$ donne les variations de $f$ :

    ![Figure](documents/figures/73d85af6c6b369ac.svg)

    **4.** $\boxed{f \text{ admet un minimum local en } -2 \text{ et un maximum local en } 2.}$ Dans les deux cas, $f'$ s'annule *en changeant de signe*.

    **5.** Par lecture graphique, $\boxed{f'(0)=4}$. Ce nombre est le **coefficient directeur de la tangente** à la courbe de $f$ au point d'abscisse $0$.

    **6.** Avec $f(0)=1$ et $f'(0)=4$ : 
    $$y=4(x-0)+1 \qquad\text{soit}\qquad \boxed{y=4x+1}$$
- id: "p-04-22"
  feuille: "f-p-04"
  numero: 22
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
