  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $f$ une fonction définie et dérivable sur $[-4\,;6]$, dont la dérivée $f'$ admet le tableau de signes suivant :

    ![Figure](documents/figures/44a98f4c5522069d.svg)

    On donne par ailleurs $f(-4)=5$, $f(-2)=-3$, $f(1)=0$, $f(4)=6$ et $f(6)=2$.

    **1.** Dresser le tableau de variations de $f$ sur $[-4\,;6]$.

    **2.** Préciser les extremums locaux de $f$ et leur nature.

    **3.** *Attention :* $f'$ s'annule en $1$ sans changer de signe. Que peut-on en dire pour la courbe de $f$ en ce point ?

    **4.** Déterminer le maximum et le minimum de $f$ sur l'intervalle $[-4\,;6]$.

    **5.** Combien l'équation $f(x)=1$ admet-elle de solutions sur $[-4\,;6]$ ? On justifiera à l'aide du tableau de variations.
  corrige: |
    **1.** On reporte le signe de $f'$ et les cinq valeurs données :

    ![Figure](documents/figures/09199ca4d4601cb9.svg)

    *La fonction est croissante sur tout $[-2\,;4]$*, l'annulation en $1$ n'interrompant pas la croissance.

    **2.** $\boxed{f \text{ admet un minimum local } -3 \text{ en } -2,\ \text{et un maximum local } 6 \text{ en } 4.}$

    **3.** En $x=1$, la dérivée s'annule mais **ne change pas de signe**. D'après la propriété du cours, il n'y a donc *pas* d'extremum en ce point. 
    $$\boxed{\begin{array}{l} \text{la courbe admet en } (1\,;0) \text{ une tangente horizontale, sans extremum :} \\[1mm] \text{elle y marque un palier avant de repartir vers le haut.} \end{array}}$$

    **4.** Sur $[-4\,;6]$, en comparant toutes les valeurs remarquables $5$, $-3$, $6$ et $2$ : 
    $$\boxed{\text{maximum } 6 \text{ atteint en } x=4 \quad;\quad \text{minimum } -3 \text{ atteint en } x=-2}$$

    **5.** On examine les trois branches monotones :

    • sur $[-4\,;-2]$, $f$ décroît de $5$ à $-3$ : comme $1\in\,]-3\,;5[$, il y a une solution ;

    • sur $[-2\,;4]$, $f$ croît de $-3$ à $6$ : comme $1\in\,]-3\,;6[$, il y a une solution ;

    • sur $[4\,;6]$, $f$ décroît de $6$ à $2$ : comme $1<2$, il n'y en a aucune.

    $$\boxed{\text{L'équation } f(x)=1 \text{ admet } 2 \text{ solutions sur } [-4\,;6].}$$
