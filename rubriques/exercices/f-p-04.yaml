  enonce: |
    Chacune des fonctions suivantes est de la forme $u^{n}$. Après avoir posé $u$ et précisé $n$, donner la fonction dérivée en utilisant la formule $\left(u^{n}\right)'=n\,u'\,u^{\,n-1}$, puis préciser l'ensemble de dérivabilité.

    **a)** $f(x)=(3x-1)^{4}$

    **b)** $f(x)=(x^{2}+1)^{3}$

    **c)** $f(x)=(-2x+3)^{4}$

    **d)** $f(x)=(3x^{3}+1)^{2}$

    **e)** $f(x)=(x^{2}-4x)^{5}$

    **f)** $f(x)=(x^{2}+x+1)^{2}$

    **g)** $f(x)=\dfrac{1}{(2x-1)^{2}}$

    **h)** $f(x)=\dfrac{1}{(2x+1)^{3}}$

    *Pour les questions g) et h), on remarquera que $\dfrac{1}{v^{n}}=v^{-n}$ : la formule s'applique aussi avec un exposant négatif.* Vérifier la question g) en utilisant cette fois la règle de dérivation de l'inverse.
  corrige: |
    *On utilise $\left(u^{n}\right)'=n\,u'\,u^{\,n-1}$. Toutes les fonctions polynomiales sont dérivables sur $\mathbb{R}$.*

    **a)** $u(x)=3x-1$, $u'(x)=3$, $n=4$ : 
    $$f'(x)=4\times 3\times(3x-1)^{3}=\boxed{12(3x-1)^{3}} \qquad (\text{sur } \mathbb{R})$$

    **b)** $u(x)=x^{2}+1$, $u'(x)=2x$, $n=3$ : 
    $$f'(x)=3\times 2x\times(x^{2}+1)^{2}=\boxed{6x(x^{2}+1)^{2}} \qquad (\text{sur } \mathbb{R})$$

    **c)** $u(x)=-2x+3$, $u'(x)=-2$, $n=4$ : 
    $$f'(x)=4\times(-2)\times(-2x+3)^{3}=\boxed{-8(-2x+3)^{3}} \qquad (\text{sur } \mathbb{R})$$

    **d)** $u(x)=3x^{3}+1$, $u'(x)=9x^{2}$, $n=2$ : 
    $$f'(x)=2\times 9x^{2}\times(3x^{3}+1)=\boxed{18x^{2}(3x^{3}+1)} \qquad (\text{sur } \mathbb{R})$$

    **e)** $u(x)=x^{2}-4x$, $u'(x)=2x-4$, $n=5$ : 
    $$f'(x)=5(2x-4)(x^{2}-4x)^{4}=\boxed{10(x-2)(x^{2}-4x)^{4}} \qquad (\text{sur } \mathbb{R})$$

    **f)** $u(x)=x^{2}+x+1$, $u'(x)=2x+1$, $n=2$ : 
    $$f'(x)=\boxed{2(2x+1)(x^{2}+x+1)} \qquad (\text{sur } \mathbb{R})$$

    **g)** $f(x)=\dfrac{1}{(2x-1)^{2}}=(2x-1)^{-2}$, avec $u(x)=2x-1$, $u'(x)=2$ et $n=-2$ : 
    $$f'(x)=-2\times 2\times(2x-1)^{-3}=\boxed{-\dfrac{4}{(2x-1)^{3}}} \qquad \left(\text{sur } \mathbb{R}\setminus\left\{\tfrac{1}{2}\right\}\right)$$

    *Vérification par la règle de l'inverse.* On pose $v(x)=(2x-1)^{2}$, donc $v'(x)=2\times 2\times(2x-1)=4(2x-1)$, d'où 
    $$f'(x)=-\dfrac{v'(x)}{\big(v(x)\big)^{2}}=-\dfrac{4(2x-1)}{(2x-1)^{4}} =-\dfrac{4}{(2x-1)^{3}}$$
     Les deux méthodes concordent.

    **h)** $f(x)=(2x+1)^{-3}$, avec $u(x)=2x+1$, $u'(x)=2$ et $n=-3$ : 
    $$f'(x)=-3\times 2\times(2x+1)^{-4}=\boxed{-\dfrac{6}{(2x+1)^{4}}} \qquad \left(\text{sur } \mathbb{R}\setminus\left\{-\tfrac{1}{2}\right\}\right)$$
- id: "p-04-13"
  feuille: "f-p-04"
  numero: 13
  partie: "Fonction dérivée : calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonction dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Chacune des fonctions suivantes est de la forme $\sqrt{u}$. Après avoir posé $u$, donner l'ensemble de définition, l'ensemble de dérivabilité, puis la fonction dérivée à l'aide de la formule $\left(\sqrt{u}\right)'=\dfrac{u'}{2\sqrt{u}}$.

    **a)** $f(x)=\sqrt{x-4}$

    **b)** $f(x)=\sqrt{3x+1}$

    **c)** $f(x)=\sqrt{1-2x}$

    **d)** $f(x)=\sqrt{x^{2}+4}$

    **e)** $f(x)=\sqrt{x^{2}+x+1}$

    **f)** $f(x)=2\sqrt{x^{2}-9}$

    **g)** $f(x)=\sqrt{\dfrac{1}{2x}-1}$

    **h)** $f(x)=x\sqrt{x+1}$

    *Attention :* pour la question e), on justifiera que $u$ ne s'annule jamais ; pour la question h), il faut combiner deux règles.
  corrige: |
    *On utilise $\left(\sqrt{u}\right)'=\dfrac{u'}{2\sqrt{u}}$. La fonction $\sqrt{u}$ est définie là où $u\geqslant 0$, mais dérivable seulement là où $u>0$ : les deux ensembles diffèrent toujours des points où $u$ s'annule.*

    **a)** $u(x)=x-4$, $u'(x)=1$. $\;D_f=[4\,;+\infty[$ et $D_{f'}=]4\,;+\infty[$ : 
    $$\boxed{f'(x)=\dfrac{1}{2\sqrt{x-4}}}$$

    **b)** $u(x)=3x+1$, $u'(x)=3$. $\;D_f=\left[-\frac{1}{3}\,;+\infty\right[$ et $D_{f'}=\left]-\frac{1}{3}\,;+\infty\right[$ : 
    $$\boxed{f'(x)=\dfrac{3}{2\sqrt{3x+1}}}$$

    **c)** $u(x)=1-2x$, $u'(x)=-2$. $\;D_f=\left]-\infty\,;\frac{1}{2}\right]$ et $D_{f'}=\left]-\infty\,;\frac{1}{2}\right[$ : 
    $$f'(x)=\dfrac{-2}{2\sqrt{1-2x}}=\boxed{-\dfrac{1}{\sqrt{1-2x}}}$$

    **d)** $u(x)=x^{2}+4$, $u'(x)=2x$. Comme $x^{2}+4\geqslant 4>0$, on a $D_f=D_{f'}=\mathbb{R}$ : 
    $$f'(x)=\dfrac{2x}{2\sqrt{x^{2}+4}}=\boxed{\dfrac{x}{\sqrt{x^{2}+4}}}$$

    **e)** $u(x)=x^{2}+x+1$, $u'(x)=2x+1$. Le discriminant de $u$ vaut $\Delta=1^{2}-4\times 1\times 1=-3<0$ : le trinôme ne s'annule jamais et garde le signe de son coefficient dominant, donc $u(x)>0$ pour tout réel $x$. Ainsi $D_f=D_{f'}=\mathbb{R}$ et 
    $$\boxed{f'(x)=\dfrac{2x+1}{2\sqrt{x^{2}+x+1}}}$$

    **f)** $f(x)=2\sqrt{x^{2}-9}$, avec $u(x)=x^{2}-9$ et $u'(x)=2x$. On a $u(x)\geqslant 0$ pour $x\leqslant -3$ ou $x\geqslant 3$, donc $D_f=\,]-\infty\,;-3]\cup[3\,;+\infty[$ et $D_{f'}=\,]-\infty\,;-3[\,\cup\,]3\,;+\infty[$ : 
    $$f'(x)=2\times\dfrac{2x}{2\sqrt{x^{2}-9}}=\boxed{\dfrac{2x}{\sqrt{x^{2}-9}}}$$

    **g)** $u(x)=\dfrac{1}{2x}-1=\dfrac{1-2x}{2x}$. Ce quotient est strictement positif lorsque $1-2x$ et $2x$ sont de même signe, c'est-à-dire pour $0<x<\frac{1}{2}$. Donc $D_f=\left]0\,;\frac{1}{2}\right]$ et $D_{f'}=\left]0\,;\frac{1}{2}\right[$. Avec $u'(x)=-\dfrac{1}{2x^{2}}$ : 
    $$f'(x)=\dfrac{-\frac{1}{2x^{2}}}{2\sqrt{\frac{1}{2x}-1}} =\boxed{-\dfrac{1}{4x^{2}\sqrt{\dfrac{1}{2x}-1}}}$$

    **h)** $f(x)=x\sqrt{x+1}$ : c'est un **produit**, dont le second facteur est une racine. $D_f=[-1\,;+\infty[$ et $D_{f'}=\,]-1\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x \\[2mm] v(x)=\sqrt{x+1} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=\dfrac{1}{2\sqrt{x+1}} \end{array}\right.$$

    $$f'(x)=\sqrt{x+1}+\dfrac{x}{2\sqrt{x+1}} =\dfrac{2(x+1)}{2\sqrt{x+1}}+\dfrac{x}{2\sqrt{x+1}}=\boxed{\dfrac{3x+2}{2\sqrt{x+1}}}$$
- id: "p-04-14"
  feuille: "f-p-04"
  numero: 14
  partie: "Fonction dérivée : calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Les fonctions suivantes mélangent toutes les règles du chapitre : il faut donc commencer par reconnaître de quel type de fonction il s'agit. Donner à chaque fois l'ensemble de définition, l'ensemble de dérivabilité, et la fonction dérivée.

    **a)** $f(x)=\sqrt{x}\,(2x-1)$

    **b)** $f(x)=\dfrac{x^{2}-1}{x}$

    **c)** $f(x)=3x^{2}-\dfrac{1}{x^{2}}$

    **d)** $f(x)=\dfrac{2x+1}{\sqrt{x}}$

    **e)** $f(x)=\dfrac{1}{x-3}$

    **f)** $f(x)=x^{2}\sqrt{x}$

    **g)** $f(x)=\dfrac{4}{x}-3x^{2}+7$

    **h)** $f(x)=(x-1)\left(\dfrac{1}{x}+2\right)$

    **i)** $f(x)=(2x-5)^{3}$

    **j)** $f(x)=\sqrt{4x-3}$
  corrige: |
    **a)** **Produit.** $D_f=[0\,;+\infty[$, $D_{f'}=]0\,;+\infty[$.

    $$\left\{\begin{array}{l} u(x)=\sqrt{x} \\[2mm] v(x)=2x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{2\sqrt{x}} \\[2mm] v'(x)=2 \end{array}\right.$$

    $$f'(x)=\dfrac{2x-1}{2\sqrt{x}}+2\sqrt{x} =\dfrac{2x-1}{2\sqrt{x}}+\dfrac{4x}{2\sqrt{x}}=\boxed{\dfrac{6x-1}{2\sqrt{x}}}$$

    **b)** **Quotient.** $D_f=D_{f'}=\mathbb{R}^{*}$.

    $$\left\{\begin{array}{l} u(x)=x^{2}-1 \\[2mm] v(x)=x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{2x\times x-(x^{2}-1)}{x^{2}}=\dfrac{2x^{2}-x^{2}+1}{x^{2}} =\boxed{\dfrac{x^{2}+1}{x^{2}}}$$

    **c)** **Somme.** $D_f=D_{f'}=\mathbb{R}^{*}$ : $f'(x)=6x-\left(-\dfrac{2}{x^{3}}\right)=\boxed{6x+\dfrac{2}{x^{3}}}$

    **d)** **Quotient.** $D_f=D_{f'}=]0\,;+\infty[$.

    $$\left\{\begin{array}{l} u(x)=2x+1 \\[2mm] v(x)=\sqrt{x} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2 \\[2mm] v'(x)=\dfrac{1}{2\sqrt{x}} \end{array}\right.$$

    $$f'(x)=\dfrac{2\sqrt{x}-(2x+1)\dfrac{1}{2\sqrt{x}}}{x} =\dfrac{\dfrac{4x-2x-1}{2\sqrt{x}}}{x}=\boxed{\dfrac{2x-1}{2x\sqrt{x}}}$$

    **e)** **Inverse.** $D_f=D_{f'}=\mathbb{R}\setminus\{3\}$, avec $v(x)=x-3$ et $v'(x)=1$ : $\boxed{f'(x)=-\dfrac{1}{(x-3)^{2}}}$

    **f)** **Produit.** $D_f=[0\,;+\infty[$, $D_{f'}=]0\,;+\infty[$.

    $$\left\{\begin{array}{l} u(x)=x^{2} \\[2mm] v(x)=\sqrt{x} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=\dfrac{1}{2\sqrt{x}} \end{array}\right.$$

    $$f'(x)=2x\sqrt{x}+\dfrac{x^{2}}{2\sqrt{x}} =\dfrac{4x^{2}}{2\sqrt{x}}+\dfrac{x^{2}}{2\sqrt{x}}=\boxed{\dfrac{5x^{2}}{2\sqrt{x}} =\dfrac{5x\sqrt{x}}{2}}$$

    **g)** **Somme.** $D_f=D_{f'}=\mathbb{R}^{*}$ : $\boxed{f'(x)=-\dfrac{4}{x^{2}}-6x}$

    **h)** **Produit.** $D_f=D_{f'}=\mathbb{R}^{*}$.

    $$\left\{\begin{array}{l} u(x)=x-1 \\[2mm] v(x)=\dfrac{1}{x}+2 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=-\dfrac{1}{x^{2}} \end{array}\right.$$

    $$f'(x)=\dfrac{1}{x}+2+(x-1)\left(-\dfrac{1}{x^{2}}\right) =\dfrac{1}{x}+2-\dfrac{1}{x}+\dfrac{1}{x^{2}}=\boxed{2+\dfrac{1}{x^{2}}}$$
     *Vérification :* $f(x)=1+2x-\dfrac{1}{x}-2=2x-\dfrac{1}{x}-1$, donc $f'(x)=2+\dfrac{1}{x^{2}}$.

    **i)** **Puissance.** $u(x)=2x-5$, $u'(x)=2$, $n=3$, sur $\mathbb{R}$ : 
    $$f'(x)=3\times 2\times(2x-5)^{2}=\boxed{6(2x-5)^{2}}$$

    **j)** **Racine.** $u(x)=4x-3$, $u'(x)=4$. $D_f=\left[\frac{3}{4}\,;+\infty\right[$ et $D_{f'}=\left]\frac{3}{4}\,;+\infty\right[$ : 
    $$f'(x)=\dfrac{4}{2\sqrt{4x-3}}=\boxed{\dfrac{2}{\sqrt{4x-3}}}$$
- id: "p-04-15"
  feuille: "f-p-04"
  numero: 15
  partie: "Fonction dérivée : calculs"
  etoiles: 1
  types: [Lecture graphique, Conjecture, Calcul]
  mots_cles: [nombre dérivé, tangente, fonction dérivée, produit et quotient]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    **Retour sur les exercices 5 et 6.** Maintenant que l'on sait dériver, on peut vérifier par le calcul les nombres dérivés qui avaient été lus graphiquement.

    **1.** La fonction de l'exercice 5 est définie sur $[-6\,;6]$ par $f(x)=4-\dfrac{x^{2}}{4}$. Calculer $f'(x)$, puis $f'(-4)$, $f'(0)$, $f'(2)$ et $f'(4)$. Comparer aux valeurs lues.

    **2.** La fonction de l'exercice 6 est définie sur $[-1\,;3]$ par $g(x)=x^{3}-3x^{2}+2$. Calculer $g'(x)$, puis $g'(0)$, $g'(1)$ et $g'(2)$. Comparer aux valeurs lues.

    **3.** Calculer $g'(0{,}5)$ et $g'(3)$, et vérifier les signes conjecturés à l'exercice 6.

    **4.** Résoudre $f'(x)=0$ et $g'(x)=0$. Retrouve-t-on les abscisses des tangentes horizontales observées sur les deux figures ?
  corrige: |
    **1.** $f(x)=4-\dfrac{x^{2}}{4}$ donne $f'(x)=-\dfrac{2x}{4}=\boxed{-\dfrac{x}{2}}$, d'où : 
    $$f'(-4)=2 \qquad f'(0)=0 \qquad f'(2)=-1 \qquad f'(4)=-2$$

    $$\boxed{\text{Les quatre valeurs coïncident exactement avec celles lues à l'exercice 5.}}$$

    **2.** $g(x)=x^{3}-3x^{2}+2$ donne $\boxed{g'(x)=3x^{2}-6x}$, d'où : 
    $$g'(0)=0 \qquad g'(1)=3-6=-3 \qquad g'(2)=12-12=0$$

    $$\boxed{\text{Les trois valeurs confirment les lectures de l'exercice 6.}}$$

    **3.** $g'(0{,}5)=3\times 0{,}25-6\times 0{,}5=0{,}75-3=\boxed{-2{,}25<0}$ et $g'(3)=27-18=\boxed{9>0}$.

    Les deux signes conjecturés graphiquement sont donc corrects.

    **4.** $f'(x)=0 \iff -\dfrac{x}{2}=0 \iff \boxed{x=0}$ : c'est bien l'unique abscisse où la tangente était horizontale sur la première figure.

    $g'(x)=0 \iff 3x(x-2)=0 \iff \boxed{x=0 \text{ ou } x=2}$ : ce sont bien les deux abscisses repérées sur la seconde figure.
- id: "p-04-16"
  feuille: "f-p-04"
  numero: 16
  partie: "Équation de tangente"
  etoiles: 1
  types: [Calcul]
  mots_cles: [tangente, racine carrée]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Dans chaque cas, déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $a$.

    **a)** $f(x)=x^{2}-3x+1$ et $a=2$

    **b)** $f(x)=x^{3}$ et $a=-1$

    **c)** $f(x)=\dfrac{1}{x}$ et $a=2$

    **d)** $f(x)=\sqrt{x}$ et $a=9$

    **e)** $f(x)=-x^{2}+4x$ et $a=3$

    **f)** $f(x)=\dfrac{x+1}{x-1}$ et $a=2$
  corrige: |
    *On applique la formule $y=f'(a)(x-a)+f(a)$.*

    **a)** $f(2)=4-6+1=-1$ et $f'(x)=2x-3$ donc $f'(2)=1$ : 
    $$y=1\times(x-2)-1 \qquad\text{soit}\qquad \boxed{y=x-3}$$

    **b)** $f(-1)=-1$ et $f'(x)=3x^{2}$ donc $f'(-1)=3$ : 
    $$y=3(x+1)-1 \qquad\text{soit}\qquad \boxed{y=3x+2}$$

    **c)** $f(2)=\dfrac{1}{2}$ et $f'(x)=-\dfrac{1}{x^{2}}$ donc $f'(2)=-\dfrac{1}{4}$ : 
    $$y=-\dfrac{1}{4}(x-2)+\dfrac{1}{2} \qquad\text{soit}\qquad \boxed{y=-\dfrac{x}{4}+1}$$

    **d)** $f(9)=3$ et $f'(x)=\dfrac{1}{2\sqrt{x}}$ donc $f'(9)=\dfrac{1}{6}$ : 
    $$y=\dfrac{1}{6}(x-9)+3 \qquad\text{soit}\qquad \boxed{y=\dfrac{x}{6}+\dfrac{3}{2}}$$

    **e)** $f(3)=-9+12=3$ et $f'(x)=-2x+4$ donc $f'(3)=-2$ : 
    $$y=-2(x-3)+3 \qquad\text{soit}\qquad \boxed{y=-2x+9}$$

    **f)** $f(2)=\dfrac{3}{1}=3$ et, avec $u(x)=x+1$ et $v(x)=x-1$, $f'(x)=\dfrac{(x-1)-(x+1)}{(x-1)^{2}}=-\dfrac{2}{(x-1)^{2}}$ donc $f'(2)=-2$ : 
    $$y=-2(x-2)+3 \qquad\text{soit}\qquad \boxed{y=-2x+7}$$
- id: "p-04-17"
  feuille: "f-p-04"
  numero: 17
  partie: "Équation de tangente"
  etoiles: 2
  types: [Calcul]
  mots_cles: [tangente]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 6
  page_corrige: 14
  enonce: |
    **1.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=x^{3}-6x^{2}+9x+1$. Déterminer les points de la courbe de $f$ en lesquels la tangente est horizontale, puis donner l'équation de ces tangentes.

    **2.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=x^{2}-4x+1$. Déterminer le point de la courbe en lequel la tangente est parallèle à la droite d'équation $y=2x-7$, puis l'équation de cette tangente.

    **3.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=x^{3}-3x$. Déterminer les points de la courbe en lesquels la tangente a pour coefficient directeur $9$.

    **4.** Soit $f$ définie sur $\mathbb{R}^{*}$ par $f(x)=\dfrac{1}{x}$. La courbe de $f$ admet-elle une tangente horizontale ? Justifier.

    **5.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=x^{2}+x$. Déterminer le point de la courbe en lequel la tangente est parallèle à l'axe des abscisses.
  corrige: |
    **1.** $f'(x)=3x^{2}-12x+9=3(x^{2}-4x+3)=3(x-1)(x-3)$. La tangente est horizontale lorsque $f'(x)=0$, c'est-à-dire pour $x=1$ ou $x=3$. Comme $f(1)=1-6+9+1=5$ et $f(3)=27-54+27+1=1$ : 
    $$\boxed{\text{aux points } (1\,;5) \text{ et } (3\,;1),\ \text{tangentes } y=5 \text{ et } y=1.}$$

    **2.** Deux droites sont parallèles lorsqu'elles ont le même coefficient directeur. On résout donc $f'(x)=2$ : 
    $$2x-4=2 \iff x=3 \qquad\text{et}\qquad f(3)=9-12+1=-2$$

    $$\boxed{\text{au point } (3\,;-2),\ \text{tangente } y=2(x-3)-2=2x-8.}$$

    **3.** On résout $f'(x)=9$ : 
    $$3x^{2}-3=9 \iff 3x^{2}=12 \iff x^{2}=4 \iff x=-2 \text{ ou } x=2$$
     Comme $f(-2)=-8+6=-2$ et $f(2)=8-6=2$ : 
    $$\boxed{\text{aux points } (-2\,;-2) \text{ et } (2\,;2),\ \text{tangentes } y=9x+16 \text{ et } y=9x-16.}$$
     *Attention :* l'équation $x^{2}=4$ admet **deux** solutions, il y a donc deux points.

    **4.** $f'(x)=-\dfrac{1}{x^{2}}$. Or $x^{2}>0$ pour tout $x\neq 0$, donc $f'(x)<0$ : la dérivée ne s'annule jamais. 
    $$\boxed{\text{La courbe de la fonction inverse n'admet aucune tangente horizontale.}}$$

    **5.** Une tangente parallèle à l'axe des abscisses est une tangente horizontale. On résout $f'(x)=0$ : 
    $$2x+1=0 \iff x=-\dfrac{1}{2} \qquad\text{et}\qquad f\left(-\dfrac{1}{2}\right)=\dfrac{1}{4}-\dfrac{1}{2}=-\dfrac{1}{4}$$

    $$\boxed{\text{au point } \left(-\dfrac{1}{2}\,;-\dfrac{1}{4}\right),\ \text{tangente } y=-\dfrac{1}{4}.}$$
- id: "p-04-18"
  feuille: "f-p-04"
  numero: 18
  partie: "Équation de tangente"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [tangente]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=x^{2}$, de courbe $\mathcal{P}$. Pour tout réel $a$, on note $T_{a}$ la tangente à $\mathcal{P}$ au point d'abscisse $a$.

    **1.** Montrer que $T_{a}$ a pour équation $y=2ax-a^{2}$.

    **2.** Déterminer les valeurs de $a$ pour lesquelles $T_{a}$ passe par le point $A(0\,;-1)$. En déduire les équations des tangentes correspondantes.

    **3.** Déterminer de même les valeurs de $a$ pour lesquelles $T_{a}$ passe par le point $B(1\,;0)$.

    **4.** Existe-t-il une tangente à $\mathcal{P}$ passant par le point $C(0\,;1)$ ? Justifier, puis interpréter graphiquement ce résultat.
  corrige: |
    **1.** $f(a)=a^{2}$ et $f'(x)=2x$ donc $f'(a)=2a$. La tangente $T_{a}$ a donc pour équation : 
    $$y=2a(x-a)+a^{2}=2ax-2a^{2}+a^{2} \qquad\text{soit}\qquad \boxed{y=2ax-a^{2}}$$

    **2.** Le point $A(0\,;-1)$ appartient à $T_{a}$ si et seulement si ses coordonnées vérifient l'équation : 
    $$-1=2a\times 0-a^{2} \iff -1=-a^{2} \iff a^{2}=1 \iff a=-1 \text{ ou } a=1$$

    $$\boxed{\text{Deux tangentes conviennent : } y=2x-1 \text{ et } y=-2x-1.}$$

    **3.** Pour $B(1\,;0)$ : 
    $$0=2a\times 1-a^{2} \iff 2a-a^{2}=0 \iff a(2-a)=0 \iff a=0 \text{ ou } a=2$$

    $$\boxed{\text{Deux tangentes conviennent : } y=0 \text{ et } y=4x-4.}$$

    **4.** Pour $C(0\,;1)$ : 
    $$1=-a^{2} \iff a^{2}=-1$$
     Un carré ne pouvant être négatif, cette équation n'a aucune solution : 
    $$\boxed{\text{Aucune tangente à } \mathcal{P} \text{ ne passe par } C.}$$
     **Interprétation.** La parabole est *convexe* : elle est située au-dessus de toutes ses tangentes. Le point $C(0\,;1)$ se trouve à l'intérieur de la parabole, c'est-à-dire au-dessus d'elle ; aucune tangente ne peut donc l'atteindre. Les points $A$ et $B$, eux, sont situés en dessous de la courbe, et l'on peut en mener deux tangentes.
- id: "p-04-19"
  feuille: "f-p-04"
  numero: 19
  partie: "Équation de tangente"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [nombre dérivé, tangente, fonction dérivée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On donne ci-dessous la courbe représentative d'une fonction $f$ définie sur $[-1\,;7]$, ainsi que ses tangentes en trois points.

    ![Figure](documents/figures/0d61e93cc2d2a3a8.svg)

    **1.** Déterminer par lecture graphique $f(0)$, $f(2)$, $f(4)$, puis $f'(0)$, $f'(2)$ et $f'(4)$.

    **2.** En déduire une équation de chacune des trois tangentes tracées.

    **3.** On admet que $f(x)=\dfrac{x^{2}}{2}-2x$. Calculer $f'(x)$ et vérifier les trois nombres dérivés lus à la question 1.

    **4.** Déterminer une équation de la tangente au point d'abscisse $6$, puis la tracer sur le graphique.

    **5.** Existe-t-il un point de la courbe en lequel la tangente est parallèle à la droite d'équation $y=x+3$ ? Si oui, déterminer ses coordonnées et l'équation de cette tangente.
  corrige: |
    **1.** On lit les ordonnées des trois points marqués, puis les coefficients directeurs des tangentes : 
    $$\boxed{f(0)=0 \qquad f(2)=-2 \qquad f(4)=0}$$

    $$\boxed{f'(0)=-2 \qquad f'(2)=0 \qquad f'(4)=2}$$

    **2.** On applique $y=f'(a)(x-a)+f(a)$ :

    • en $a=0$ : $y=-2(x-0)+0$, soit $\boxed{y=-2x}$ ;

    • en $a=2$ : $y=0\times(x-2)-2$, soit $\boxed{y=-2}$ ;

    • en $a=4$ : $y=2(x-4)+0$, soit $\boxed{y=2x-8}$.

    **3.** $f(x)=\dfrac{x^{2}}{2}-2x$ donne $\boxed{f'(x)=x-2}$, d'où $f'(0)=-2$, $f'(2)=0$ et $f'(4)=2$ : les trois lectures sont confirmées.

    **4.** $f(6)=18-12=6$ et $f'(6)=4$, donc : 
    $$y=4(x-6)+6 \qquad\text{soit}\qquad \boxed{y=4x-18}$$
     Pour la tracer, il suffit de placer le point $(6\,;6)$ et, par exemple, le point $(5\,;2)$.

    **5.** La droite $y=x+3$ a pour coefficient directeur $1$. On résout donc $f'(x)=1$ : 
    $$x-2=1 \iff x=3 \qquad\text{et}\qquad f(3)=\dfrac{9}{2}-6=-\dfrac{3}{2}$$

    $$\boxed{\text{Au point } \left(3\,;-\dfrac{3}{2}\right),\ \text{tangente } y=x-\dfrac{9}{2}.}$$
- id: "p-04-20"
  feuille: "f-p-04"
  numero: 20
  partie: "Dérivée, variations et extremums"
  etoiles: 1
  types: [Lecture graphique, Démonstration]
  mots_cles: [nombre dérivé, tangente, fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On donne ci-dessous la courbe représentative d'une fonction $f$ définie sur $[-3\,;5]$. Les points $A$ et $B$ sont les deux points de la courbe en lesquels la tangente est horizontale.

    ![Figure](documents/figures/209457dd7a61423b.svg)

    **1.** Donner les coordonnées des points $A$ et $B$.

    **2.** Dresser le tableau de variations de $f$ sur $[-3\,;5]$.

    **3.** En déduire le tableau de signes de $f'$ sur $[-3\,;5]$.

    **4.** Pour quelles valeurs de $x$ a-t-on $f'(x)=0$ ?

    **5.** Préciser les extremums locaux de $f$ ainsi que leur nature.

    **6.** Le nombre $f'(0)$ est-il positif ou négatif ? Et $f'(4)$ ? Justifier sans calcul.
  corrige: |
    **1.** Par lecture graphique : $\boxed{A(-1\,;4) \quad\text{et}\quad B(3\,;-4)}$

    **2.** La courbe monte, puis descend, puis remonte :

    ![Figure](documents/figures/414291cb7ac526f0.svg)

    **3.** Une fonction croissante a une dérivée positive, une fonction décroissante une dérivée négative :

    ![Figure](documents/figures/724cd636bbf58dc6.svg)

    **4.** La dérivée s'annule là où la tangente est horizontale : 
    $$\boxed{f'(x)=0 \text{ pour } x=-1 \text{ et } x=3}$$

    **5.** $\boxed{f \text{ admet un maximum local } 4 \text{ en } -1,\ \text{et un minimum local } -4 \text{ en } 3.}$

    **6.** En $x=0$, la courbe **descend** : la tangente y descend aussi, donc $\boxed{f'(0)<0}$. En $x=4$, la courbe **monte**, donc $\boxed{f'(4)>0}$.

    *Aucun calcul n'est nécessaire : le signe de la dérivée se lit directement sur le sens de variation.*
