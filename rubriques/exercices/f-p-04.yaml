- id: "p-04-01"
  feuille: "f-p-04"
  numero: 1
  partie: "Taux de variation et nombre dérivé"
  etoiles: 1
  types: [Calcul]
  mots_cles: [taux de variation, racine carrée, variations]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, calculer le taux de variation de la fonction $f$ entre les deux réels indiqués.

    **a)** $f(x)=3x-5$ entre $1$ et $4$

    **b)** $f(x)=x^{2}$ entre $2$ et $5$

    **c)** $f(x)=x^{2}$ entre $-1$ et $3$

    **d)** $f(x)=x^{3}$ entre $0$ et $2$

    **e)** $f(x)=\dfrac{1}{x}$ entre $1$ et $4$

    **f)** $f(x)=\sqrt{x}$ entre $1$ et $9$

    **g)** $f(x)=x^{2}-3x$ entre $-2$ et $1$

    **h)** $f(x)=-4x+1$ entre $-3$ et $5$

    Que remarque-t-on pour les questions a) et h) ? Expliquer.
  corrige: |
    *On applique la définition : le taux de variation de $f$ entre $a$ et $b$ vaut $\dfrac{f(b)-f(a)}{b-a}$.*

    **a)** $\dfrac{f(4)-f(1)}{4-1}=\dfrac{7-(-2)}{3}=\dfrac{9}{3}=\boxed{3}$

    **b)** $\dfrac{f(5)-f(2)}{5-2}=\dfrac{25-4}{3}=\boxed{7}$

    **c)** $\dfrac{f(3)-f(-1)}{3-(-1)}=\dfrac{9-1}{4}=\boxed{2}$

    **d)** $\dfrac{f(2)-f(0)}{2-0}=\dfrac{8-0}{2}=\boxed{4}$

    **e)** $\dfrac{f(4)-f(1)}{4-1}=\dfrac{\frac{1}{4}-1}{3}=\dfrac{-\frac{3}{4}}{3} =\boxed{-\dfrac{1}{4}}$

    **f)** $\dfrac{f(9)-f(1)}{9-1}=\dfrac{3-1}{8}=\boxed{\dfrac{1}{4}}$

    **g)** $f(-2)=4+6=10$ et $f(1)=1-3=-2$, donc $\dfrac{-2-10}{1-(-2)}=\dfrac{-12}{3}=\boxed{-4}$

    **h)** $f(-3)=13$ et $f(5)=-19$, donc $\dfrac{-19-13}{5-(-3)}=\dfrac{-32}{8}=\boxed{-4}$

    **Remarque sur a) et h).** Les deux fonctions sont **affines**, et le taux obtenu est exactement leur coefficient directeur : $3$ pour $x\mapsto 3x-5$, et $-4$ pour $x\mapsto -4x+1$. C'est normal : le taux de variation est le coefficient directeur de la droite passant par les deux points de la courbe, et pour une fonction affine cette droite *est* la courbe. Le taux ne dépend donc pas des deux réels choisis.
- id: "p-04-02"
  feuille: "f-p-04"
  numero: 2
  partie: "Taux de variation et nombre dérivé"
  etoiles: 1
  types: [Calcul]
  mots_cles: [taux de variation, nombre dérivé, fonction dérivée, variations]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, exprimer puis simplifier le taux de variation $\dfrac{f(a+h)-f(a)}{h}$ pour la valeur de $a$ indiquée et pour $h\neq 0$. Observer ensuite l'expression obtenue et indiquer de quelle valeur ce taux se rapproche lorsque $h$ devient très proche de $0$ : cette valeur est le **nombre dérivé** $f'(a)$.

    **a)** $f(x)=x^{2}$ avec $a=3$

    **b)** $f(x)=x^{2}+2x$ avec $a=1$

    **c)** $f(x)=3x^{2}-x$ avec $a=2$

    **d)** $f(x)=x^{3}$ avec $a=1$

    **e)** $f(x)=\dfrac{1}{x}$ avec $a=2$

    **f)** $f(x)=5x-4$ avec $a$ quelconque

    *On rappelle que $(1+h)^{3}=1+3h+3h^{2}+h^{3}$.* Que remarque-t-on à la question f) ?
  corrige: |
    **a)** $\dfrac{(3+h)^{2}-3^{2}}{h}=\dfrac{9+6h+h^{2}-9}{h}=\dfrac{h(6+h)}{h}=\boxed{6+h}$

    Lorsque $h$ devient très proche de $0$, cette expression se rapproche de $6$ : $\boxed{f'(3)=6}$.

    **b)** $f(1+h)=(1+h)^{2}+2(1+h)=1+2h+h^{2}+2+2h=3+4h+h^{2}$ et $f(1)=3$, donc le taux vaut 
    $$\dfrac{4h+h^{2}}{h}=\boxed{4+h} \qquad\text{et}\qquad \boxed{f'(1)=4}$$

    **c)** $f(2+h)=3(2+h)^{2}-(2+h)=3(4+4h+h^{2})-2-h=10+11h+3h^{2}$ et $f(2)=10$, donc 
    $$\dfrac{11h+3h^{2}}{h}=\boxed{11+3h} \qquad\text{et}\qquad \boxed{f'(2)=11}$$

    **d)** $(1+h)^{3}=1+3h+3h^{2}+h^{3}$ et $f(1)=1$, donc 
    $$\dfrac{3h+3h^{2}+h^{3}}{h}=\boxed{3+3h+h^{2}} \qquad\text{et}\qquad \boxed{f'(1)=3}$$

    **e)** $\dfrac{\frac{1}{2+h}-\frac{1}{2}}{h} =\dfrac{\frac{2-(2+h)}{2(2+h)}}{h} =\dfrac{\frac{-h}{2(2+h)}}{h}=\boxed{-\dfrac{1}{2(2+h)}}$

    Lorsque $h$ se rapproche de $0$, le dénominateur se rapproche de $4$, donc $\boxed{f'(2)=-\dfrac{1}{4}}$.

    **f)** $\dfrac{5(a+h)-4-(5a-4)}{h}=\dfrac{5a+5h-4-5a+4}{h}=\dfrac{5h}{h}=\boxed{5}$

    **Remarque sur f).** Le taux ne dépend ni de $a$, ni de $h$ : il vaut $5$ partout. On retrouve le résultat du cours, à savoir que la fonction affine $x\mapsto ax+b$ a pour dérivée la fonction constante $x\mapsto a$.
- id: "p-04-03"
  feuille: "f-p-04"
  numero: 3
  partie: "Taux de variation et nombre dérivé"
  etoiles: 2
  types: [Conjecture, Calcul]
  mots_cles: [taux de variation, nombre dérivé, fonction dérivée, produit et quotient, racine carrée, variations, optimisation]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Partie A : approcher un nombre dérivé par le calcul**

    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=x^{2}$. On s'intéresse au nombre dérivé de $f$ en $3$.

    **1.** Recopier et compléter le tableau suivant, en arrondissant si nécessaire au millième.

    $$\begin{array}{|c|c|c|c|c|c|c|c|} \hline h & 1 & 0{,}5 & 0{,}1 & 0{,}01 & -0{,}01 & -0{,}1 & -0{,}5 \\ \hline \dfrac{f(3+h)-f(3)}{h} &  &  &  &  &  &  &  \\ \hline \end{array}$$

    **2.** De quelle valeur le taux de variation semble-t-il se rapprocher lorsque $h$ se rapproche de $0$, que ce soit par valeurs positives ou négatives ? Conjecturer la valeur de $f'(3)$.

    **3.** Retrouver ce résultat en utilisant la formule de dérivation de $x\mapsto x^{2}$.

    **4.** Reprendre les questions 1 et 2 avec la fonction $g$ définie sur $[0\,;+\infty[$ par $g(x)=\sqrt{x}$, au point $a=4$, en se limitant à $h=1$ ; $0{,}1$ ; $0{,}01$ ; $0{,}001$. Vérifier ensuite à l'aide de la formule du cours.

    **Partie B : approcher $f(a+h)$**

    Lorsque $h$ est très petit, le taux de variation $\dfrac{f(a+h)-f(a)}{h}$ est très proche de $f'(a)$. On peut donc écrire : 
    $$f(a+h)\approx f(a)+h\times f'(a)$$

    **5.** Justifier cette écriture à partir de la définition du taux de variation.

    **6.** En utilisant $f(3)=9$ et $f'(3)=6$, donner une valeur approchée de $f(3{,}02)$ **sans calculer** $3{,}02^{2}$. Comparer ensuite avec la valeur exacte, et calculer l'erreur commise.

    **7.** De la même manière, donner une valeur approchée de $\sqrt{4{,}1}$, puis comparer à la valeur affichée par la calculatrice.

    **8.** Soit $k$ la fonction inverse, définie sur $\mathbb{R}^{*}$ par $k(x)=\dfrac{1}{x}$. Calculer $k(2)$ et $k'(2)$, puis donner une valeur approchée de $\dfrac{1}{2{,}05}$. Comparer à la valeur exacte.

    **9.** L'approximation est-elle meilleure pour $h=0{,}1$ ou pour $h=0{,}001$ ? Expliquer.
  corrige: |
    **Partie A**

    **1.** D'après l'exercice 2, le taux vaut $6+h$. On complète donc directement :

    $$\begin{array}{|c|c|c|c|c|c|c|c|} \hline h & 1 & 0{,}5 & 0{,}1 & 0{,}01 & -0{,}01 & -0{,}1 & -0{,}5 \\ \hline \dfrac{f(3+h)-f(3)}{h} & 7 & 6{,}5 & 6{,}1 & 6{,}01 & 5{,}99 & 5{,}9 & 5{,}5 \\ \hline \end{array}$$

    **2.** Lorsque $h$ se rapproche de $0$ **par valeurs positives**, le taux se rapproche de $6$ en restant supérieur à $6$ ; lorsque $h$ s'en rapproche **par valeurs négatives**, le taux se rapproche de $6$ en restant inférieur à $6$. Le nombre $6$ est donc encadré d'aussi près que l'on veut : 
    $$\boxed{f'(3)=6}$$

    **3.** La formule du cours donne $f'(x)=2x$, donc $f'(3)=2\times 3=6$. On retrouve bien la valeur conjecturée.

    **4.** Pour $g(x)=\sqrt{x}$ en $a=4$, le taux vaut $\dfrac{\sqrt{4+h}-2}{h}$ :

    $$\begin{array}{|c|c|c|c|c|} \hline h & 1 & 0{,}1 & 0{,}01 & 0{,}001 \\ \hline \dfrac{g(4+h)-g(4)}{h} & 0{,}2361 & 0{,}2485 & 0{,}2498 & 0{,}2500 \\ \hline \end{array}$$

    Le taux se rapproche de $0{,}25$, donc $\boxed{g'(4)=\dfrac{1}{4}}$.

    *Vérification :* $g'(x)=\dfrac{1}{2\sqrt{x}}$, donc $g'(4)=\dfrac{1}{2\times 2} =\dfrac{1}{4}$.

    **Partie B**

    **5.** Lorsque $h$ est très petit, on a $\dfrac{f(a+h)-f(a)}{h}\approx f'(a)$. En multipliant les deux membres par $h$, il vient $f(a+h)-f(a)\approx h\times f'(a)$, puis 
    $$\boxed{f(a+h)\approx f(a)+h\times f'(a)}$$

    **6.** Avec $a=3$ et $h=0{,}02$ : 
    $$f(3{,}02)\approx f(3)+0{,}02\times f'(3)=9+0{,}02\times 6=9+0{,}12=\boxed{9{,}12}$$
     La valeur exacte est $3{,}02^{2}=9{,}1204$. L'erreur commise vaut donc $\boxed{0{,}0004}$, soit moins de un dix-millième.

    **7.** Avec $g(x)=\sqrt{x}$, $a=4$ et $h=0{,}1$ : 
    $$\sqrt{4{,}1}\approx g(4)+0{,}1\times g'(4)=2+0{,}1\times\dfrac{1}{4}=\boxed{2{,}025}$$
     La calculatrice donne $\sqrt{4{,}1}\approx 2{,}02485$ : l'erreur est d'environ $1{,}5\times 10^{-4}$.

    **8.** $k(2)=\dfrac{1}{2}=0{,}5$ et $k'(x)=-\dfrac{1}{x^{2}}$, donc $k'(2)=-\dfrac{1}{4}=-0{,}25$. Avec $h=0{,}05$ : 
    $$\dfrac{1}{2{,}05}\approx 0{,}5+0{,}05\times(-0{,}25)=0{,}5-0{,}0125=\boxed{0{,}4875}$$
     La valeur exacte est $\dfrac{1}{2{,}05}\approx 0{,}48780$ : l'erreur vaut environ $3\times 10^{-4}$.

    **9.** L'approximation est **bien meilleure pour $h=0{,}001$**. En effet, plus $h$ est petit, plus le taux de variation est proche de $f'(a)$, donc plus le remplacement de l'un par l'autre est légitime. Géométriquement, on remplace la courbe par sa tangente : cette substitution n'est acceptable qu'au voisinage immédiat du point de contact.
- id: "p-04-04"
  feuille: "f-p-04"
  numero: 4
  partie: "Taux de variation et nombre dérivé"
  etoiles: 2
  types: [Calcul]
  mots_cles: [taux de variation, variations, optimisation]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Un mobile se déplace en ligne droite. À l'instant $t$ (en secondes), la distance parcourue depuis son départ, en mètres, est donnée par : 
    $$d(t)=t^{2}+2t \qquad \text{pour } t\in[0\,;10]$$

    **1.** Calculer la vitesse moyenne du mobile entre les instants $t=1$ et $t=3$.

    **2.** Exprimer puis simplifier le taux de variation de $d$ entre $1$ et $1+h$, pour $h\neq 0$.

    **3.** De quelle valeur ce taux se rapproche-t-il lorsque $h$ devient très petit ? Cette valeur est la **vitesse instantanée** du mobile à l'instant $t=1$.

    **4.** Déterminer $d'(t)$, puis la vitesse instantanée à l'instant $t=3$ et à l'instant $t=10$.

    **5.** À quel instant la vitesse du mobile atteint-elle $12$ m$\cdot$s$^{-1}$ ?

    **6.** Donner une valeur approchée de la distance parcourue à l'instant $t=1{,}02$, sans calculer $1{,}02^{2}$.
  corrige: |
    **1.** $d(1)=1+2=3$ et $d(3)=9+6=15$, donc la vitesse moyenne vaut 
    $$\dfrac{d(3)-d(1)}{3-1}=\dfrac{15-3}{2}=\boxed{6 \text{ m}\cdot\text{s}^{-1}}$$

    **2.** $d(1+h)=(1+h)^{2}+2(1+h)=1+2h+h^{2}+2+2h=3+4h+h^{2}$, et $d(1)=3$, donc 
    $$\dfrac{d(1+h)-d(1)}{h}=\dfrac{4h+h^{2}}{h}=\boxed{4+h}$$

    **3.** Lorsque $h$ devient très petit, cette expression se rapproche de $4$ : 
    $$\boxed{\text{la vitesse instantanée à l'instant } t=1 \text{ vaut } 4 \text{ m}\cdot\text{s}^{-1}.}$$

    **4.** $d'(t)=2t+2$, donc $d'(3)=\boxed{8 \text{ m}\cdot\text{s}^{-1}}$ et $d'(10)=\boxed{22 \text{ m}\cdot\text{s}^{-1}}$.

    *Vérification :* $d'(1)=2+2=4$, ce qui confirme la question 3.

    **5.** On résout $d'(t)=12$ : 
    $$2t+2=12 \iff 2t=10 \iff \boxed{t=5 \text{ s}}$$

    **6.** Avec $a=1$ et $h=0{,}02$ : 
    $$d(1{,}02)\approx d(1)+0{,}02\times d'(1)=3+0{,}02\times 4=\boxed{3{,}08 \text{ m}}$$
     *(la valeur exacte est $1{,}02^{2}+2\times 1{,}02=3{,}0804$)*
- id: "p-04-05"
  feuille: "f-p-04"
  numero: 5
  partie: "Taux de variation et nombre dérivé"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [nombre dérivé, tangente, fonction dérivée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On donne ci-dessous la courbe représentative d'une fonction $f$ définie sur $[-6\,;6]$, ainsi que ses tangentes en quatre points, tracées en violet.

    ![Figure](documents/figures/bcb1d3b3d34dcad8.svg)

    **1.** Déterminer par lecture graphique $f(-4)$, $f(0)$, $f(2)$ et $f(4)$.

    **2.** Déterminer de même les nombres dérivés $f'(-4)$, $f'(0)$, $f'(2)$ et $f'(4)$.

    **3.** En quel point la tangente tracée est-elle horizontale ? Que vaut alors le nombre dérivé ?

    **4.** Parmi les quatre nombres dérivés lus, lesquels sont positifs ? lesquels sont négatifs ? Que peut-on dire de la tangente dans chacun de ces deux cas ?

    **5.** Sur l'intervalle $[-6\,;0]$, la courbe monte-t-elle ou descend-elle ? Quel semble être le signe des nombres dérivés sur cet intervalle ?
  corrige: |
    **1.** On lit les ordonnées des quatre points marqués : 
    $$\boxed{f(-4)=0 \qquad f(0)=4 \qquad f(2)=3 \qquad f(4)=0}$$

    **2.** Le nombre dérivé est le **coefficient directeur de la tangente**. On le lit en se déplaçant d'une unité vers la droite sur chaque tangente, et en mesurant le déplacement vertical : 
    $$\boxed{f'(-4)=2 \qquad f'(0)=0 \qquad f'(2)=-1 \qquad f'(4)=-2}$$
     Par exemple, la tangente au point d'abscisse $-4$ passe par les points $(-4\,;0)$ et $(-2\,;4)$ : son coefficient directeur vaut $\dfrac{4-0}{-2-(-4)}=\dfrac{4}{2}=2$.

    **3.** La tangente est horizontale au point de coordonnées $(0\,;4)$, c'est-à-dire au sommet de la courbe. Une droite horizontale a un coefficient directeur nul, donc 
    $$\boxed{f'(0)=0}$$

    **4.** $f'(-4)=2$ est positif ; $f'(2)=-1$ et $f'(4)=-2$ sont négatifs ; $f'(0)=0$. 
    $$\boxed{\begin{array}{l} \text{un nombre dérivé positif correspond à une tangente qui \textbf{monte} ;} \\[1mm] \text{un nombre dérivé négatif à une tangente qui \textbf{descend}.} \end{array}}$$

    **5.** Sur $[-6\,;0]$, la courbe **monte**. Les tangentes y montent donc également, et 
    $$\boxed{f'(x) \text{ semble positif sur } [-6\,;0].}$$
- id: "p-04-06"
  feuille: "f-p-04"
  numero: 6
  partie: "Taux de variation et nombre dérivé"
  etoiles: 1
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [nombre dérivé, tangente]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    On donne ci-dessous la courbe représentative d'une fonction $g$ définie sur $[-1\,;3]$, ainsi que ses tangentes en trois points.

    ![Figure](documents/figures/8742ed2b6b219265.svg)

    **1.** Déterminer par lecture graphique $g(0)$, $g(1)$ et $g(2)$.

    **2.** Déterminer de même $g'(0)$, $g'(1)$ et $g'(2)$.

    **3.** En quels points la tangente est-elle horizontale ?

    **4.** Le nombre dérivé $g'(0{,}5)$ est-il positif ou négatif ? Justifier en observant l'allure de la courbe, sans aucun calcul.

    **5.** Même question pour $g'(3)$.
  corrige: |
    **1.** $\boxed{g(0)=2 \qquad g(1)=0 \qquad g(2)=-2}$

    **2.** Les tangentes en $0$ et en $2$ sont horizontales ; celle en $1$ passe par les points $(1\,;0)$ et $(0\,;3)$, d'où un coefficient directeur $\dfrac{3-0}{0-1}=-3$ : 
    $$\boxed{g'(0)=0 \qquad g'(1)=-3 \qquad g'(2)=0}$$

    **3.** La tangente est horizontale aux points d'abscisses $\boxed{0 \text{ et } 2}$, c'est-à-dire aux points $(0\,;2)$ et $(2\,;-2)$.

    **4.** Entre $0$ et $2$, la courbe **descend** : les tangentes y descendent aussi. Comme $0{,}5$ appartient à cet intervalle, 
    $$\boxed{g'(0{,}5)<0}$$

    **5.** Après $x=2$, la courbe **remonte** nettement, donc 
    $$\boxed{g'(3)>0}$$
     *Ces deux conjectures seront vérifiées par le calcul à l'exercice 15.*
- id: "p-04-07"
  feuille: "f-p-04"
  numero: 7
  partie: "Fonction dérivée : calculs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Pour chacune des fonctions suivantes, définie sur $\mathbb{R}$, donner la fonction dérivée.

    **a)** $f(x)=5$

    **b)** $f(x)=3x+5$

    **c)** $f(x)=-2x^{2}+3x+2$

    **d)** $f(x)=x^{3}-4x^{2}+7x-1$

    **e)** $f(x)=-5x^{3}+4x^{2}-9x-5$

    **f)** $f(x)=-\dfrac{1}{2}x^{4}+3x^{3}+\sqrt{3}\,x-1$

    **g)** $f(x)=\dfrac{x^{3}+12x-1}{2}$

    **h)** $f(x)=x^{5}$

    **i)** $f(x)=7x^{4}-\dfrac{x^{2}}{2}$

    **j)** $f(x)=\dfrac{2x-3}{5}$

    **k)** $f(x)=4x^{3}-6x^{2}+2x$

    **l)** $f(x)=-x^{6}+2x^{3}-x$

    *Attention à la question f) :* $\sqrt{3}$ est un nombre, pas une fonction.
  corrige: |
    *On applique les dérivées usuelles ainsi que $(u+v)'=u'+v'$ et $(ku)'=ku'$. Toutes ces fonctions sont des polynômes : elles sont dérivables sur $\mathbb{R}$.*

    **a)** $\boxed{f'(x)=0}$

    **b)** $\boxed{f'(x)=3}$

    **c)** $\boxed{f'(x)=-4x+3}$

    **d)** $\boxed{f'(x)=3x^{2}-8x+7}$

    **e)** $\boxed{f'(x)=-15x^{2}+8x-9}$

    **f)** $\boxed{f'(x)=-2x^{3}+9x^{2}+\sqrt{3}}$

    **g)** $\boxed{f'(x)=\dfrac{3x^{2}+12}{2}}$

    **h)** $\boxed{f'(x)=5x^{4}}$

    **i)** $\boxed{f'(x)=28x^{3}-x}$

    **j)** $\boxed{f'(x)=\dfrac{2}{5}}$

    **k)** $\boxed{f'(x)=12x^{2}-12x+2}$

    **l)** $\boxed{f'(x)=-6x^{5}+6x^{2}-1}$

    **Détail de la question f).** On écrit $f(x)=-\frac{1}{2}x^{4}+3x^{3}+\sqrt{3}\,x-1$. Le terme $\sqrt{3}\,x$ est de la forme $kx$ avec $k=\sqrt{3}$ : sa dérivée vaut $\sqrt{3}$, et non $\frac{1}{2\sqrt{3}}$. Le nombre $\sqrt{3}$ est une *constante*, pas une fonction. De même, le terme $-1$ disparaît. D'où : 
    $$f'(x)=-\frac{1}{2}\times 4x^{3}+3\times 3x^{2}+\sqrt{3}=-2x^{3}+9x^{2}+\sqrt{3}$$

    **Détail de la question g).** On écrit $f(x)=\frac{1}{2}\left(x^{3}+12x-1\right)$, produit par le réel $\frac{1}{2}$ : 
    $$f'(x)=\frac{1}{2}\left(3x^{2}+12\right)=\frac{3x^{2}+12}{2}$$
- id: "p-04-08"
  feuille: "f-p-04"
  numero: 8
  partie: "Fonction dérivée : calculs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Pour chacune des fonctions suivantes, donner son ensemble de définition, son ensemble de dérivabilité, puis la fonction dérivée.

    **a)** $f(x)=\dfrac{1}{x}-2x$

    **b)** $f(x)=5\sqrt{x}+\dfrac{x^{3}}{3}$

    **c)** $f(x)=-\dfrac{4}{x^{3}}$

    **d)** $f(x)=\dfrac{\sqrt{x}}{2}-\dfrac{2}{5x}$

    **e)** $f(x)=\dfrac{3}{x^{2}}$

    **f)** $f(x)=2\sqrt{x}-\dfrac{3}{x}$

    **g)** $f(x)=x^{2}+\dfrac{1}{x}$

    **h)** $f(x)=\dfrac{1}{x^{4}}+\sqrt{x}$

    **i)** $f(x)=-6\sqrt{x}+5$

    **j)** $f(x)=\dfrac{2}{x}-\dfrac{1}{3x^{2}}$
  corrige: |
    *On rappelle les ensembles du cours : $\dfrac{1}{x^{n}}$ est définie et dérivable sur $\mathbb{R}^{*}$, tandis que $\sqrt{x}$ est définie sur $[0\,;+\infty[$ mais dérivable seulement sur $]0\,;+\infty[$.*

    **a)** $D_f=D_{f'}=\mathbb{R}^{*}$ et $\boxed{f'(x)=-\dfrac{1}{x^{2}}-2}$

    **b)** $D_f=[0\,;+\infty[$, $D_{f'}=]0\,;+\infty[$ et $\boxed{f'(x)=\dfrac{5}{2\sqrt{x}}+x^{2}}$

    **c)** $D_f=D_{f'}=\mathbb{R}^{*}$. On applique $\left(\dfrac{1}{x^{n}}\right)'=-\dfrac{n}{x^{n+1}}$ avec $n=3$ : 
    $$f'(x)=-4\times\left(-\dfrac{3}{x^{4}}\right)=\boxed{\dfrac{12}{x^{4}}}$$

    **d)** $D_f=D_{f'}=]0\,;+\infty[$ : la racine impose $x\geqslant 0$ et le quotient impose $x\neq 0$. 
    $$\boxed{f'(x)=\dfrac{1}{4\sqrt{x}}+\dfrac{2}{5x^{2}}}$$

    **e)** $D_f=D_{f'}=\mathbb{R}^{*}$ et $f'(x)=3\times\left(-\dfrac{2}{x^{3}}\right)=\boxed{-\dfrac{6}{x^{3}}}$

    **f)** $D_f=D_{f'}=]0\,;+\infty[$ et $\boxed{f'(x)=\dfrac{1}{\sqrt{x}}+\dfrac{3}{x^{2}}}$

    **g)** $D_f=D_{f'}=\mathbb{R}^{*}$ et $\boxed{f'(x)=2x-\dfrac{1}{x^{2}}}$

    **h)** $D_f=D_{f'}=]0\,;+\infty[$ et $\boxed{f'(x)=-\dfrac{4}{x^{5}}+\dfrac{1}{2\sqrt{x}}}$

    **i)** $D_f=[0\,;+\infty[$, $D_{f'}=]0\,;+\infty[$ et $f'(x)=-6\times\dfrac{1}{2\sqrt{x}}=\boxed{-\dfrac{3}{\sqrt{x}}}$

    **j)** $D_f=D_{f'}=\mathbb{R}^{*}$ et $f'(x)=2\times\left(-\dfrac{1}{x^{2}}\right)-\dfrac{1}{3}\times\left(-\dfrac{2}{x^{3}}\right) =\boxed{-\dfrac{2}{x^{2}}+\dfrac{2}{3x^{3}}}$

    *Piège classique* (questions f) et i)) : $2\sqrt{x}$ a pour dérivée $2\times\frac{1}{2\sqrt{x}}=\frac{1}{\sqrt{x}}$, et non $\frac{1}{2\sqrt{x}}$. Le facteur $2$ ne doit pas être oublié.
- id: "p-04-09"
  feuille: "f-p-04"
  numero: 9
  partie: "Fonction dérivée : calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, produit et quotient, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Chacune des fonctions suivantes est un **produit**. Après avoir posé $u$ et $v$, donner la fonction dérivée en précisant l'ensemble de dérivabilité.

    **a)** $f(x)=(2x-1)(x+3)$

    **b)** $f(x)=x\sqrt{x}$

    **c)** $f(x)=2\sqrt{x}\,(x^{2}+3x)$

    **d)** $f(x)=(x^{2}+1)(\sqrt{x}-2x)$

    **e)** $f(x)=(3x-2)(x^{2}+x+1)$

    **f)** $f(x)=(2x-1)(2x-1)$

    **g)** $f(x)=\sqrt{x}\,(x-4)$

    **h)** $f(x)=(x^{2}+2)\times\dfrac{1}{x}$

    Pour la question f), vérifier le résultat en développant d'abord l'expression de $f$.
  corrige: |
    *On utilise la formule du produit : $f'(x)=u'(x)v(x)+u(x)v'(x)$.*

    **a)** $f(x)=(2x-1)(x+3)$, dérivable sur $\mathbb{R}$. On pose :

    $$\left\{\begin{array}{l} u(x)=2x-1 \\[2mm] v(x)=x+3 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=2\times(x+3)+(2x-1)\times 1=2x+6+2x-1=\boxed{4x+5}$$
     *Vérification* en développant d'abord : $f(x)=2x^{2}+5x-3$, donc $f'(x)=4x+5$.

    **b)** $f(x)=x\sqrt{x}$, définie sur $[0\,;+\infty[$ et dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x \\[2mm] v(x)=\sqrt{x} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=\dfrac{1}{2\sqrt{x}} \end{array}\right.$$

    $$f'(x)=1\times\sqrt{x}+x\times\dfrac{1}{2\sqrt{x}} =\sqrt{x}+\dfrac{x}{2\sqrt{x}} =\dfrac{2x}{2\sqrt{x}}+\dfrac{x}{2\sqrt{x}} =\boxed{\dfrac{3x}{2\sqrt{x}}=\dfrac{3\sqrt{x}}{2}}$$
     en utilisant $\sqrt{x}=\dfrac{x}{\sqrt{x}}$ pour réduire au même dénominateur.

    **c)** $f(x)=2\sqrt{x}\,(x^{2}+3x)$, dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=2\sqrt{x} \\[2mm] v(x)=x^{2}+3x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{\sqrt{x}} \\[2mm] v'(x)=2x+3 \end{array}\right.$$

    $$f'(x)=\dfrac{1}{\sqrt{x}}\times(x^{2}+3x)+2\sqrt{x}\times(2x+3) =\dfrac{x^{2}+3x}{\sqrt{x}}+\dfrac{2x(2x+3)}{\sqrt{x}}$$

    $$=\dfrac{x^{2}+3x+4x^{2}+6x}{\sqrt{x}}=\boxed{\dfrac{5x^{2}+9x}{\sqrt{x}} =\sqrt{x}\,(5x+9)}$$
     en ayant écrit $2\sqrt{x}=\dfrac{2x}{\sqrt{x}}$.

    **d)** $f(x)=(x^{2}+1)(\sqrt{x}-2x)$, dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+1 \\[2mm] v(x)=\sqrt{x}-2x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=\dfrac{1}{2\sqrt{x}}-2 \end{array}\right.$$

    $$\boxed{f'(x)=2x\left(\sqrt{x}-2x\right)+(x^{2}+1)\left(\dfrac{1}{2\sqrt{x}}-2\right)}$$

    **e)** $f(x)=(3x-2)(x^{2}+x+1)$, dérivable sur $\mathbb{R}$. On pose :

    $$\left\{\begin{array}{l} u(x)=3x-2 \\[2mm] v(x)=x^{2}+x+1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=3 \\[2mm] v'(x)=2x+1 \end{array}\right.$$

    $$f'(x)=3(x^{2}+x+1)+(3x-2)(2x+1)=3x^{2}+3x+3+6x^{2}+3x-4x-2=\boxed{9x^{2}+2x+1}$$

    **f)** $f(x)=(2x-1)(2x-1)$, dérivable sur $\mathbb{R}$. On pose :

    $$\left\{\begin{array}{l} u(x)=2x-1 \\[2mm] v(x)=2x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2 \\[2mm] v'(x)=2 \end{array}\right.$$

    $$f'(x)=2(2x-1)+(2x-1)\times 2=4(2x-1)=\boxed{8x-4}$$
     *Vérification en développant d'abord :* $f(x)=4x^{2}-4x+1$, donc $f'(x)=8x-4$.

    **g)** $f(x)=\sqrt{x}\,(x-4)$, dérivable sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=\sqrt{x} \\[2mm] v(x)=x-4 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{2\sqrt{x}} \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{x-4}{2\sqrt{x}}+\sqrt{x} =\dfrac{x-4}{2\sqrt{x}}+\dfrac{2x}{2\sqrt{x}}=\boxed{\dfrac{3x-4}{2\sqrt{x}}}$$

    **h)** $f(x)=(x^{2}+2)\times\dfrac{1}{x}$, dérivable sur $\mathbb{R}^{*}$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+2 \\[2mm] v(x)=\dfrac{1}{x} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=-\dfrac{1}{x^{2}} \end{array}\right.$$

    $$f'(x)=2x\times\dfrac{1}{x}+(x^{2}+2)\times\left(-\dfrac{1}{x^{2}}\right) =2-\dfrac{x^{2}+2}{x^{2}}=2-1-\dfrac{2}{x^{2}}=\boxed{1-\dfrac{2}{x^{2}}}$$
     *Vérification :* $f(x)=x+\dfrac{2}{x}$, donc $f'(x)=1-\dfrac{2}{x^{2}}$.
- id: "p-04-10"
  feuille: "f-p-04"
  numero: 10
  partie: "Fonction dérivée : calculs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, racine carrée]
