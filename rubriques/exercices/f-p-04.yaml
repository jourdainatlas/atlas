  enonce: |
    Pour chacune des fonctions suivantes, définie sur $\mathbb{R}$ : calculer $f'$, étudier son signe, dresser le tableau de variations de $f$, puis préciser l'extremum obtenu.

    **a)** $f(x)=x^{2}-4x+3$

    **b)** $f(x)=-2x^{2}+8x-5$

    **c)** $f(x)=3x^{2}+6x+1$

    **d)** $f(x)=-x^{2}+6x$
  corrige: |
    **a)** $f'(x)=2x-4$, qui s'annule en $2$ et est positive après.

    ![Figure](documents/figures/c42fd6201c9784e2.svg)

    $\boxed{\text{Minimum } -1 \text{ atteint en } x=2.}$

    **b)** $f'(x)=-4x+8$, qui s'annule en $2$ et est *négative* après.

    ![Figure](documents/figures/b4c9404250e1a603.svg)

    $\boxed{\text{Maximum } 3 \text{ atteint en } x=2.}$

    **c)** $f'(x)=6x+6$, qui s'annule en $-1$ : $\boxed{\text{minimum } -2 \text{ atteint en } x=-1}$, $f$ décroissante sur $]-\infty\,;-1]$ puis croissante sur $[-1\,;+\infty[$.

    **d)** $f'(x)=-2x+6$, qui s'annule en $3$ : $\boxed{\text{maximum } 9 \text{ atteint en } x=3}$, $f$ croissante puis décroissante.
- id: "p-04-24"
  feuille: "f-p-04"
  numero: 24
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Pour chacune des fonctions suivantes, définie sur $\mathbb{R}$ : calculer $f'$, la **factoriser**, étudier son signe, puis dresser le tableau de variations de $f$ en précisant les extremums locaux.

    **a)** $f(x)=x^{3}-3x^{2}+2$

    **b)** $f(x)=2x^{3}-9x^{2}+12x$

    **c)** $f(x)=x^{3}-12x+5$

    **d)** $f(x)=x^{3}+3x^{2}+3x+1$

    *La question d) réserve une surprise : on commentera soigneusement le résultat obtenu.*
  corrige: |
    **a)** $f'(x)=3x^{2}-6x=\boxed{3x(x-2)}$, produit dont les racines sont $0$ et $2$. Un trinôme de coefficient dominant positif est négatif *entre* ses racines :

    ![Figure](documents/figures/e12342cabe35ef2c.svg)

    $\boxed{\text{Maximum local } 2 \text{ en } 0 \quad;\quad \text{minimum local } -2 \text{ en } 2.}$

    **b)** $f'(x)=6x^{2}-18x+12=\boxed{6(x-1)(x-2)}$ :

    ![Figure](documents/figures/7c5883d877cc0f7d.svg)

    $\boxed{\text{Maximum local } 5 \text{ en } 1 \quad;\quad \text{minimum local } 4 \text{ en } 2.}$

    **c)** $f'(x)=3x^{2}-12=\boxed{3(x-2)(x+2)}$ :

    ![Figure](documents/figures/441afdec875bb337.svg)

    $\boxed{\text{Maximum local } 21 \text{ en } -2 \quad;\quad \text{minimum local } -11 \text{ en } 2.}$

    **d)** $f'(x)=3x^{2}+6x+3=3(x^{2}+2x+1)=\boxed{3(x+1)^{2}}$.

    **Voilà la surprise :** un carré est toujours positif ou nul. La dérivée s'annule en $-1$, mais **sans changer de signe**.

    ![Figure](documents/figures/c25562693ee50356.svg)

    $$\boxed{f \text{ est croissante sur } \mathbb{R} \text{ tout entier et n'admet aucun extremum.}}$$
     *Commentaire.* L'annulation de la dérivée est une condition **nécessaire** mais non suffisante pour un extremum : il faut de plus un changement de signe. En $x=-1$, la courbe admet une tangente horizontale, qu'elle traverse aussitôt sans changer de sens de variation.
- id: "p-04-25"
  feuille: "f-p-04"
  numero: 25
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonction dérivée, produit et quotient, racine carrée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Même travail pour les fonctions suivantes, sur l'intervalle indiqué : calculer $f'$, la mettre sous forme d'un **quotient**, étudier son signe, dresser le tableau de variations de $f$ et préciser les extremums éventuels.

    *Conseil.* Pour une fonction rationnelle, la dérivée s'écrit toujours $f'(x)=\dfrac{N(x)}{\big(v(x)\big)^{2}}$. Le dénominateur étant un carré, il est strictement positif sur l'intervalle d'étude : **le signe de $f'$ est donc celui de son seul numérateur $N(x)$**, que l'on prendra soin de factoriser.

    **a)** $f(x)=x+\dfrac{4}{x}$ sur $]0\,;+\infty[$

    **b)** $f(x)=x^{2}+\dfrac{16}{x}$ sur $]0\,;+\infty[$

    **c)** $f(x)=\dfrac{x^{2}+1}{x}$ sur $]0\,;+\infty[$

    **d)** $f(x)=\dfrac{x^{2}-4}{x}$ sur $]0\,;+\infty[$

    **e)** $f(x)=\dfrac{x+1}{x-2}$ sur $]2\,;+\infty[$

    **f)** $f(x)=\dfrac{2x-1}{x+3}$ sur $]-3\,;+\infty[$

    **g)** $f(x)=\dfrac{3x+2}{2x-1}$ sur $\left]\frac{1}{2}\,;+\infty\right[$

    **h)** $f(x)=\dfrac{x^{2}+3}{x-1}$ sur $]1\,;+\infty[$

    **i)** $f(x)=\dfrac{x^{2}+2x+2}{x+1}$ sur $]-1\,;+\infty[$

    **j)** $f(x)=\dfrac{x^{2}-2x}{x-1}$ sur $]1\,;+\infty[$

    **k)** $f(x)=\dfrac{x-1}{x^{2}}$ sur $]0\,;+\infty[$

    **l)** $f(x)=x+\dfrac{1}{x}$ sur $]-\infty\,;0[$

    **m)** $f(x)=\sqrt{x}-x$ sur $]0\,;+\infty[$

    **n)** $f(x)=\dfrac{\sqrt{x}}{x+1}$ sur $]0\,;+\infty[$

    *Deux remarques pour finir.* Aux questions d) et j), le numérateur de $f'$ est un trinôme qui ne s'annule jamais : on le justifiera par son discriminant, et l'on en tirera une conclusion immédiate sur les variations. La question l) est la seule à porter sur un intervalle de réels **négatifs** : on prendra garde à ne conserver que la racine appartenant à cet intervalle.
  corrige: |
    *Dans tout cet exercice, le dénominateur de $f'$ est un carré, donc strictement positif : le signe de $f'$ est celui de son numérateur.*

    **a)** $f(x)=x+\dfrac{4}{x}$ sur $]0\,;+\infty[$ : 
    $$f'(x)=1-\dfrac{4}{x^{2}}=\dfrac{x^{2}-4}{x^{2}}=\boxed{\dfrac{(x-2)(x+2)}{x^{2}}}$$
     Sur $]0\,;+\infty[$, le facteur $x+2$ est positif : le signe de $f'$ est celui de $x-2$.

    ![Figure](documents/figures/2ca888161b0aafa1.svg)

    $\boxed{\text{Minimum } 4 \text{ atteint en } x=2.}$

    **b)** $f(x)=x^{2}+\dfrac{16}{x}$ sur $]0\,;+\infty[$ : 
    $$f'(x)=2x-\dfrac{16}{x^{2}}=\dfrac{2x^{3}-16}{x^{2}}=\boxed{\dfrac{2(x-2)(x^{2}+2x+4)}{x^{2}}}$$
     Le trinôme $x^{2}+2x+4$ a pour discriminant $\Delta=4-16=-12<0$ : il est toujours strictement positif. Le signe de $f'$ est donc celui de $x-2$, et 
    $$\boxed{\text{minimum } 12 \text{ atteint en } x=2.}$$

    **c)** $f(x)=\dfrac{x^{2}+1}{x}$ sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+1 \\[2mm] v(x)=x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{2x\times x-(x^{2}+1)}{x^{2}}=\dfrac{x^{2}-1}{x^{2}} =\boxed{\dfrac{(x-1)(x+1)}{x^{2}}}$$
     Sur $]0\,;+\infty[$, le signe est celui de $x-1$ :

    ![Figure](documents/figures/9e1d37aebad75cde.svg)

    $\boxed{\text{Minimum } 2 \text{ atteint en } x=1.}$

    **d)** $f(x)=\dfrac{x^{2}-4}{x}$ sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}-4 \\[2mm] v(x)=x \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{2x\times x-(x^{2}-4)}{x^{2}}=\boxed{\dfrac{x^{2}+4}{x^{2}}}$$
     Le numérateur $x^{2}+4$ est *toujours* strictement positif : 
    $$\boxed{f \text{ est strictement croissante sur } ]0\,;+\infty[,\ \text{sans extremum.}}$$

    **e)** $f(x)=\dfrac{x+1}{x-2}$ sur $]2\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x+1 \\[2mm] v(x)=x-2 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{1\times(x-2)-(x+1)\times 1}{(x-2)^{2}}=\boxed{\dfrac{-3}{(x-2)^{2}}}$$
     Le numérateur est la constante $-3<0$ : 
    $$\boxed{f \text{ est strictement décroissante sur } ]2\,;+\infty[,\ \text{sans extremum.}}$$

    **f)** $f(x)=\dfrac{2x-1}{x+3}$ sur $]-3\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=2x-1 \\[2mm] v(x)=x+3 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{2(x+3)-(2x-1)}{(x+3)^{2}}=\dfrac{2x+6-2x+1}{(x+3)^{2}} =\boxed{\dfrac{7}{(x+3)^{2}}}$$

    $$\boxed{f \text{ est strictement croissante sur } ]-3\,;+\infty[,\ \text{sans extremum.}}$$

    **g)** $f(x)=\dfrac{3x+2}{2x-1}$ sur $\left]\frac{1}{2}\,;+\infty\right[$. On pose :

    $$\left\{\begin{array}{l} u(x)=3x+2 \\[2mm] v(x)=2x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=3 \\[2mm] v'(x)=2 \end{array}\right.$$

    $$f'(x)=\dfrac{3(2x-1)-2(3x+2)}{(2x-1)^{2}}=\dfrac{6x-3-6x-4}{(2x-1)^{2}} =\boxed{\dfrac{-7}{(2x-1)^{2}}}$$

    $$\boxed{f \text{ est strictement décroissante sur } \left]\tfrac{1}{2}\,;+\infty\right[.}$$

    **h)** $f(x)=\dfrac{x^{2}+3}{x-1}$ sur $]1\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+3 \\[2mm] v(x)=x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{2x(x-1)-(x^{2}+3)}{(x-1)^{2}}=\dfrac{2x^{2}-2x-x^{2}-3}{(x-1)^{2}} =\dfrac{x^{2}-2x-3}{(x-1)^{2}}=\boxed{\dfrac{(x-3)(x+1)}{(x-1)^{2}}}$$
     Sur $]1\,;+\infty[$, le facteur $x+1$ est positif : le signe est celui de $x-3$.

    ![Figure](documents/figures/cd7441c49a246186.svg)

    $\boxed{\text{Minimum } 6 \text{ atteint en } x=3.}$

    **i)** $f(x)=\dfrac{x^{2}+2x+2}{x+1}$ sur $]-1\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}+2x+2 \\[2mm] v(x)=x+1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x+2 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{(2x+2)(x+1)-(x^{2}+2x+2)}{(x+1)^{2}} =\dfrac{2x^{2}+4x+2-x^{2}-2x-2}{(x+1)^{2}}=\boxed{\dfrac{x(x+2)}{(x+1)^{2}}}$$
     Sur $]-1\,;+\infty[$, le facteur $x+2$ est positif : le signe est celui de $x$.

    ![Figure](documents/figures/7fb0903fc9c36ed0.svg)

    $\boxed{\text{Minimum } 2 \text{ atteint en } x=0.}$

    **j)** $f(x)=\dfrac{x^{2}-2x}{x-1}$ sur $]1\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x^{2}-2x \\[2mm] v(x)=x-1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2x-2 \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{(2x-2)(x-1)-(x^{2}-2x)}{(x-1)^{2}} =\dfrac{2x^{2}-4x+2-x^{2}+2x}{(x-1)^{2}}=\boxed{\dfrac{x^{2}-2x+2}{(x-1)^{2}}}$$
     Le numérateur a pour discriminant $\Delta=4-8=-4<0$ : il ne s'annule jamais et reste du signe de son coefficient dominant, donc strictement positif. 
    $$\boxed{f \text{ est strictement croissante sur } ]1\,;+\infty[,\ \text{sans extremum.}}$$

    **k)** $f(x)=\dfrac{x-1}{x^{2}}$ sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=x-1 \\[2mm] v(x)=x^{2} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=2x \end{array}\right.$$

    $$f'(x)=\dfrac{1\times x^{2}-(x-1)\times 2x}{\left(x^{2}\right)^{2}} =\dfrac{x^{2}-2x^{2}+2x}{x^{4}}=\dfrac{x(2-x)}{x^{4}}=\boxed{\dfrac{2-x}{x^{3}}}$$
     Sur $]0\,;+\infty[$, on a $x^{3}>0$ : le signe est celui de $2-x$.

    ![Figure](documents/figures/91accf300131ed69.svg)

    $\boxed{\text{Maximum } \dfrac{1}{4} \text{ atteint en } x=2.}$

    **l)** $f(x)=x+\dfrac{1}{x}$ sur $]-\infty\,;0[$ : 
    $$f'(x)=1-\dfrac{1}{x^{2}}=\boxed{\dfrac{(x-1)(x+1)}{x^{2}}}$$
     **Attention :** la dérivée s'annule en $-1$ *et* en $1$, mais seule la valeur $-1$ appartient à l'intervalle d'étude. Sur $]-\infty\,;0[$, le facteur $x-1$ est négatif : le signe de $f'$ est l'*opposé* de celui de $x+1$.

    ![Figure](documents/figures/53bca6c01be2993f.svg)

    $\boxed{\text{Maximum } -2 \text{ atteint en } x=-1.}$

    **m)** $f(x)=\sqrt{x}-x$ sur $]0\,;+\infty[$ : 
    $$f'(x)=\dfrac{1}{2\sqrt{x}}-1=\dfrac{1-2\sqrt{x}}{2\sqrt{x}}$$
     Le dénominateur est positif ; le numérateur s'annule lorsque $\sqrt{x}=\frac{1}{2}$, c'est-à-dire $x=\frac{1}{4}$, et il est positif avant.

    ![Figure](documents/figures/dd8e6cae69c998f1.svg)

    $\boxed{\text{Maximum } \dfrac{1}{4} \text{ atteint en } x=\dfrac{1}{4}.}$

    **n)** $f(x)=\dfrac{\sqrt{x}}{x+1}$ sur $]0\,;+\infty[$. On pose :

    $$\left\{\begin{array}{l} u(x)=\sqrt{x} \\[2mm] v(x)=x+1 \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=\dfrac{1}{2\sqrt{x}} \\[2mm] v'(x)=1 \end{array}\right.$$

    $$f'(x)=\dfrac{\dfrac{x+1}{2\sqrt{x}}-\sqrt{x}}{(x+1)^{2}} =\dfrac{\dfrac{x+1-2x}{2\sqrt{x}}}{(x+1)^{2}}=\boxed{\dfrac{1-x}{2\sqrt{x}\,(x+1)^{2}}}$$
     Le dénominateur est positif : le signe est celui de $1-x$.

    ![Figure](documents/figures/bfb69eb14efde714.svg)

    $\boxed{\text{Maximum } \dfrac{1}{2} \text{ atteint en } x=1.}$
- id: "p-04-26"
  feuille: "f-p-04"
  numero: 26
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Dans chaque cas, la fonction est étudiée sur un intervalle **fermé**. Dresser son tableau de variations, puis déterminer son maximum et son minimum sur cet intervalle, en précisant en quelles valeurs ils sont atteints.

    **1.** $f(x)=x^{3}-6x^{2}+9x$ sur $[0\,;4]$

    **2.** $g(x)=-x^{3}+3x^{2}+1$ sur $[-1\,;3]$

    **3.** $h(x)=x+\dfrac{4}{x}$ sur $[1\,;5]$

    *On prendra garde à ne pas oublier les valeurs aux bornes de l'intervalle : un extremum global peut fort bien être atteint en une borne, là où la dérivée ne s'annule pas.*
  corrige: |
    **1.** $f'(x)=3x^{2}-12x+9=3(x-1)(x-3)$, et $f(0)=0$, $f(1)=4$, $f(3)=0$, $f(4)=4$.

    ![Figure](documents/figures/c058885b201ca911.svg)

    $$\boxed{\text{Maximum } 4,\ \text{atteint \textbf{deux fois}, en } x=1 \text{ et en } x=4 \quad;\quad \text{minimum } 0,\ \text{en } x=0 \text{ et } x=3.}$$
     *On remarque que* le maximum est atteint à la fois en un point où $f'$ s'annule et en une **borne** de l'intervalle, où $f'$ ne s'annule pas.

    **2.** $g'(x)=-3x^{2}+6x=-3x(x-2)$, et $g(-1)=5$, $g(0)=1$, $g(2)=5$, $g(3)=1$.

    ![Figure](documents/figures/881faed4c8b8857f.svg)

    $$\boxed{\text{Maximum } 5 \text{ en } x=-1 \text{ et } x=2 \quad;\quad \text{minimum } 1 \text{ en } x=0 \text{ et } x=3.}$$

    **3.** $h'(x)=1-\dfrac{4}{x^{2}}=\dfrac{(x-2)(x+2)}{x^{2}}$. Sur $[1\,;5]$, le signe est celui de $x-2$. De plus $h(1)=5$, $h(2)=4$ et $h(5)=5+\frac{4}{5}=\frac{29}{5}$.

    ![Figure](documents/figures/b03ddbf594334df1.svg)

    $$\boxed{\text{Minimum } 4 \text{ en } x=2 \quad;\quad \text{maximum } \dfrac{29}{5}=5{,}8 \text{ en } x=5.}$$
     *Ici le maximum est atteint en une borne*, et non en un point d'annulation de la dérivée.
- id: "p-04-27"
  feuille: "f-p-04"
  numero: 27
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [produit et quotient, variations, optimisation]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 10
  page_corrige: 24
  enonce: |
    On dispose d'une plaque de carton carrée de $12$ cm de côté. On découpe à chaque coin un carré de côté $x$, exprimé en centimètres, puis on relève les bords pour former une boîte sans couvercle.

    ![Figure](documents/figures/6324b6b29544c890.svg)

    **1.** Justifier que $x$ appartient à l'intervalle $[0\,;6]$.

    **2.** Exprimer les dimensions de la boîte en fonction de $x$, puis montrer que son volume, en $\mathrm{cm}^{3}$, vaut $V(x)=x(12-2x)^{2}$.

    **3.** Développer $V(x)$, puis montrer que $V'(x)=12(x-2)(x-6)$.

    **4.** Étudier le signe de $V'$ sur $[0\,;6]$ et dresser le tableau de variations de $V$.

    **5.** En déduire la valeur de $x$ pour laquelle le volume est maximal, ainsi que ce volume maximal.
  corrige: |
    **1.** La longueur découpée est positive, donc $x\geqslant 0$. De plus, on retire $x$ à *chaque* extrémité d'un côté de $12$ cm, donc $12-2x\geqslant 0$, soit $x\leqslant 6$ : 
    $$\boxed{x\in[0\,;6]}$$

    **2.** La base est un carré de côté $12-2x$ et la hauteur vaut $x$, donc 
    $$\boxed{V(x)=x(12-2x)^{2}}$$

    **3.** $(12-2x)^{2}=144-48x+4x^{2}$, donc $V(x)=4x^{3}-48x^{2}+144x$ et 
    $$V'(x)=12x^{2}-96x+144=12\left(x^{2}-8x+12\right)=\boxed{12(x-2)(x-6)}$$
     *Vérification de la factorisation :* $(x-2)(x-6)=x^{2}-8x+12$.

    **4.** Le trinôme est positif à l'extérieur de ses racines $2$ et $6$, négatif entre elles.

    ![Figure](documents/figures/c763d19f80eaf917.svg)

    **5.** $V(2)=2\times(12-4)^{2}=2\times 64=128$ : 
    $$\boxed{\text{Le volume est maximal pour } x=2 \text{ cm, et vaut alors } 128 \text{ cm}^{3}.}$$
     La boîte a alors pour base un carré de $8$ cm de côté et pour hauteur $2$ cm.
- id: "p-04-28"
  feuille: "f-p-04"
  numero: 28
  partie: "Dérivée, variations et extremums"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [variations, optimisation]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 10
  page_corrige: 25
  enonce: |
    Une entreprise fabrique et vend $q$ centaines d'objets, avec $0\leqslant q\leqslant 20$. Le coût total de production, en centaines d'euros, est donné par : 
    $$C(q)=q^{3}-24q^{2}+245q+100$$
     Chaque centaine d'objets est vendue $200$ centaines d'euros.

    **1.** Exprimer la recette $R(q)$ en fonction de $q$.

    **2.** Montrer que le bénéfice $B(q)=R(q)-C(q)$ vaut $B(q)=-q^{3}+24q^{2}-45q-100$.

    **3.** Calculer $B'(q)$, puis montrer que $B'(q)=-3(q-1)(q-15)$.

    **4.** Étudier le signe de $B'$ sur $[0\,;20]$ et dresser le tableau de variations de $B$.

    **5.** En déduire la production qui rend le bénéfice maximal, ainsi que ce bénéfice maximal en euros.

    **6.** Calculer $B(0)$ et $B(1)$. L'entreprise a-t-elle intérêt à produire très peu ? Commenter.
  corrige: |
    **1.** $\boxed{R(q)=200q}$

    **2.** $B(q)=200q-\left(q^{3}-24q^{2}+245q+100\right)$, d'où 
    $$\boxed{B(q)=-q^{3}+24q^{2}-45q-100}$$

    **3.** $B'(q)=-3q^{2}+48q-45=-3\left(q^{2}-16q+15\right)=\boxed{-3(q-1)(q-15)}$

    *Vérification :* $(q-1)(q-15)=q^{2}-16q+15$.

    **4.** Le facteur $-3$ étant négatif, $B'$ est du signe *opposé* à celui de $(q-1)(q-15)$ : positive entre les racines, négative à l'extérieur. Avec $B(0)=-100$, $B(1)=-122$, $B(15)=1250$ et $B(20)=600$ :

    ![Figure](documents/figures/3f32d9392d14a67f.svg)

    **5.** Le bénéfice est maximal pour $q=15$, c'est-à-dire $1\,500$ objets. Il vaut alors $1\,250$ centaines d'euros : 
    $$\boxed{\text{Bénéfice maximal de } 125\,000~\text{€ pour } 1\,500 \text{ objets produits.}}$$

    **6.** $B(0)=-100$ et $B(1)=-122$ : dans les deux cas le bénéfice est **négatif**, et il est même *plus* mauvais pour $q=1$ que pour $q=0$. 
    $$\boxed{\text{Produire très peu est la pire stratégie : les frais fixes ne sont pas couverts.}}$$
     L'entreprise a intérêt à produire beaucoup, jusqu'à $1\,500$ objets — au-delà, le bénéfice diminue à nouveau.
- id: "p-04-29"
  feuille: "f-p-04"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction dérivée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    **1.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=ax^{2}+bx+c$, où $a$, $b$ et $c$ sont des réels. Sachant que $f'(x)=6x+7$ pour tout réel $x$ et que $f(1)=6$, déterminer $a$, $b$ et $c$.

    **2.** Soit $g$ définie sur $\mathbb{R}$ par $g(x)=ax^{3}+bx^{2}+cx$. Sachant que $g'(x)=6x^{2}-5x+1$ pour tout réel $x$, déterminer $a$, $b$ et $c$.

    **3.** Soit $h$ définie sur $\mathbb{R}$ par $h(x)=ax^{2}+bx+c$. Sachant que $h'(x)=-4x+\dfrac{1}{2}$ et que la courbe de $h$ passe par le point de coordonnées $(2\,;-9)$, déterminer $a$, $b$ et $c$.

    **4.** Soit $k$ définie sur $\mathbb{R}^{*}$ par $k(x)=ax+\dfrac{b}{x}$. Sachant que $k(1)=4$ et $k'(1)=0$, déterminer $a$ et $b$.
  corrige: |
    **1.** $f'(x)=2ax+b$. L'égalité $2ax+b=6x+7$ devant être vraie pour *tout* réel $x$, on identifie les coefficients : $2a=6$ et $b=7$, donc $a=3$ et $b=7$. Puis 
    $$f(1)=a+b+c=3+7+c=6 \iff c=-4$$

    $$\boxed{a=3,\quad b=7,\quad c=-4}$$

    **2.** $g'(x)=3ax^{2}+2bx+c$. Par identification avec $6x^{2}-5x+1$ : 
    $$3a=6,\quad 2b=-5,\quad c=1 \qquad\text{soit}\qquad \boxed{a=2,\quad b=-\dfrac{5}{2},\quad c=1}$$

    **3.** $h'(x)=2ax+b$. Par identification avec $-4x+\dfrac{1}{2}$ : $2a=-4$ et $b=\dfrac{1}{2}$, donc $a=-2$. La courbe passant par $(2\,;-9)$ : 
    $$h(2)=4a+2b+c=-8+1+c=-9 \iff c=-2$$

    $$\boxed{a=-2,\quad b=\dfrac{1}{2},\quad c=-2}$$

    **4.** $k(x)=ax+\dfrac{b}{x}$ donne $k'(x)=a-\dfrac{b}{x^{2}}$. Les deux conditions s'écrivent : 
    $$\begin{cases} k(1)=a+b=4 \\ k'(1)=a-b=0 \end{cases}$$
     En additionnant, $2a=4$ donc $a=2$, puis $b=2$ : 
    $$\boxed{a=2,\quad b=2}$$
- id: "p-04-30"
  feuille: "f-p-04"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [tangente, fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $f$ la fonction définie sur $[-3\,;5]$ par : 
    $$f(x)=x^{3}-3x^{2}-9x+5$$

    **1.** Calculer $f'(x)$, puis vérifier que $f'(x)=3(x-3)(x+1)$.

    **2.** Étudier le signe de $f'$ sur $[-3\,;5]$ et dresser le tableau de variations de $f$.

    **3.** Préciser les extremums locaux de $f$, ainsi que le maximum et le minimum de $f$ sur $[-3\,;5]$.

    **4.** Déterminer une équation de la tangente $T$ à la courbe de $f$ au point d'abscisse $0$.

    **5.** Déterminer les points de la courbe en lesquels la tangente est horizontale.

    **6.** Résoudre l'équation $f'(x)=-9$. Interpréter graphiquement le résultat obtenu.
  corrige: |
    **1.** $f'(x)=3x^{2}-6x-9=3\left(x^{2}-2x-3\right)$. Or $(x-3)(x+1)=x^{2}-2x-3$, donc 
    $$\boxed{f'(x)=3(x-3)(x+1)}$$

    **2.** Le trinôme est négatif entre ses racines $-1$ et $3$. Avec $f(-3)=-27-27+27+5=-22$, $f(-1)=-1-3+9+5=10$, $f(3)=27-27-27+5=-22$ et $f(5)=125-75-45+5=10$ :

    ![Figure](documents/figures/e4d38bb4757c0bf7.svg)

    **3.** $\boxed{\text{Maximum local } 10 \text{ en } -1 \quad;\quad \text{minimum local } -22 \text{ en } 3.}$

    Sur $[-3\,;5]$ tout entier, le maximum vaut $10$ (atteint en $-1$ et en $5$) et le minimum $-22$ (atteint en $-3$ et en $3$).

    **4.** $f(0)=5$ et $f'(0)=3\times(-3)\times 1=-9$, donc 
    $$y=-9(x-0)+5 \qquad\text{soit}\qquad \boxed{T : y=-9x+5}$$

    **5.** $f'(x)=0 \iff x=-1$ ou $x=3$ : 
    $$\boxed{\text{aux points } (-1\,;10) \text{ et } (3\,;-22).}$$

    **6.** $f'(x)=-9 \iff 3x^{2}-6x-9=-9 \iff 3x^{2}-6x=0 \iff 3x(x-2)=0$, donc 
    $$\boxed{x=0 \text{ ou } x=2}$$
     **Interprétation.** En ces deux points la tangente a le même coefficient directeur $-9$ que la tangente $T$ : les tangentes en $0$ et en $2$ sont donc **parallèles**. Comme $f(2)=8-12-18+5=-17$, la seconde a pour équation $y=-9(x-2)-17=-9x+1$ : elle est bien parallèle à $T$ sans lui être confondue.
- id: "p-04-31"
  feuille: "f-p-04"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [nombre dérivé, tangente, fonction dérivée, variations]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 11
  page_corrige: 27
  enonce: |
    Soit $f$ une fonction définie et dérivable sur $[-4\,;5]$. On dispose des seuls renseignements suivants : 
    $$f(-4)=-1 \quad f(-2)=3 \quad f(1)=-2 \quad f(3)=0 \quad f(5)=4$$

    $$f'(-2)=0 \qquad f'(1)=0 \qquad f'(3)=2$$

    **1.** Dans un repère orthonormé, placer les cinq points de la courbe dont on connaît les coordonnées.

    **2.** Que signifient graphiquement les égalités $f'(-2)=0$ et $f'(1)=0$ ? Tracer les deux tangentes correspondantes.

    **3.** Déterminer une équation de la tangente au point d'abscisse $3$, puis la tracer.

    **4.** En déduire un tableau de variations compatible avec toutes ces données.

    **5.** Tracer alors une courbe possible pour la fonction $f$.

    **6.** Combien l'équation $f(x)=1$ admet-elle de solutions ? Et l'équation $f(x)=-3$ ?

    *On prendra un repère allant de $-5$ à $6$ en abscisse et de $-3$ à $5$ en ordonnée.*
  corrige: |
    **1.** Les cinq points sont $(-4\,;-1)$, $(-2\,;3)$, $(1\,;-2)$, $(3\,;0)$ et $(5\,;4)$.

    **2.** Un nombre dérivé nul signifie que la tangente a un coefficient directeur nul : 
    $$\boxed{\text{les tangentes aux points d'abscisses } -2 \text{ et } 1 \text{ sont horizontales.}}$$
     Ce sont donc les droites d'équations $y=3$ et $y=-2$, tracées en pointillés violets ci-dessous.

    **3.** Avec $a=3$, $f(3)=0$ et $f'(3)=2$ : 
    $$y=2(x-3)+0 \qquad\text{soit}\qquad \boxed{y=2x-6}$$
     Pour la tracer, on part du point $(3\,;0)$ et l'on avance d'une unité vers la droite en montant de deux : on obtient le point $(4\,;2)$.

    **4.** En $-2$ et en $1$, la dérivée s'annule ; entre ces deux valeurs $f$ passe de $3$ à $-2$, elle y est donc décroissante. Ailleurs elle croît, ce que confirme $f'(3)=2>0$.

    ![Figure](documents/figures/336b013d710e2774.svg)

    **5.** Toute courbe respectant ce tableau et les trois tangentes convient. En voici une :

    ![Figure](documents/figures/1491e19a3e8f5fee.svg)

    **6.** La droite d'équation $y=1$, tracée en ocre, coupe la courbe une fois sur chacune des trois branches monotones : 
    $$\boxed{\text{l'équation } f(x)=1 \text{ admet } 3 \text{ solutions.}}$$
     En revanche, le minimum de $f$ sur $[-4\,;5]$ vaut $-2$, et $-3<-2$ : 
    $$\boxed{\text{l'équation } f(x)=-3 \text{ n'admet aucune solution.}}$$
- id: "p-04-32"
  feuille: "f-p-04"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [tangente, fonction dérivée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Soit $f$ la fonction définie sur $[-2\,;2]$ par : 
    $$f(x)=-x^{3}+3x+2$$

    **1.** Calculer $f'(x)$, puis le factoriser.

    **2.** Étudier le signe de $f'$ et dresser le tableau de variations de $f$ sur $[-2\,;2]$. On précisera les valeurs de $f$ aux bornes et aux extremums.

    **3.** Déterminer une équation de la tangente à la courbe de $f$ en chacun des points d'abscisses $-1$, $0$ et $1$.

    **4.** Dans un repère orthonormé, placer les trois points de contact, puis tracer les trois tangentes.

    **5.** Tracer alors la courbe de $f$, en s'appuyant sur le tableau de variations et sur les trois tangentes.

    **6.** Déterminer graphiquement le nombre de solutions de l'équation $f(x)=1$ sur $[-2\,;2]$, puis donner une valeur approchée de chacune d'elles.

    *On prendra un repère allant de $-2$ à $2$ en abscisse et de $-1$ à $5$ en ordonnée.*
  corrige: |
    **1.** $f(x)=-x^{3}+3x+2$ donne $f'(x)=-3x^{2}+3=-3\left(x^{2}-1\right)$, soit 
    $$\boxed{f'(x)=-3(x-1)(x+1)}$$

    **2.** Le coefficient $-3$ étant négatif, le trinôme est *positif* entre ses racines. On calcule les quatre valeurs utiles : 
    $$f(-2)=8-6+2=4 \qquad f(-1)=1-3+2=0 \qquad f(1)=-1+3+2=4 \qquad f(2)=-8+6+2=0$$

    ![Figure](documents/figures/9a5110a8c2faa88e.svg)

    $\boxed{\text{Minimum local } 0 \text{ en } -1 \quad;\quad \text{maximum local } 4 \text{ en } 1.}$

    **3.** On applique $y=f'(a)(x-a)+f(a)$ :

    • en $a=-1$ : $f(-1)=0$ et $f'(-1)=0$, donc $\boxed{y=0}$ (l'axe des abscisses) ;

    • en $a=0$ : $f(0)=2$ et $f'(0)=3$, donc $y=3(x-0)+2$, soit $\boxed{y=3x+2}$ ;

    • en $a=1$ : $f(1)=4$ et $f'(1)=0$, donc $\boxed{y=4}$.

    *Les deux tangentes horizontales correspondent bien aux deux extremums du tableau.*

    **** **4. et 5.** On place les points $(-1\,;0)$, $(0\,;2)$ et $(1\,;4)$, on trace les trois tangentes en violet, puis la courbe qui les épouse en chacun de ces points :

    ![Figure](documents/figures/47cf67365b302bd1.svg)

    **5.** La droite d'équation $y=1$ coupe la courbe une fois sur chacune des trois branches monotones : 
    $$\boxed{\text{l'équation } f(x)=1 \text{ admet } 3 \text{ solutions sur } [-2\,;2].}$$
     Par lecture graphique, ces solutions valent environ : 
    $$\boxed{x_{1}\approx -1{,}5 \qquad x_{2}\approx -0{,}35 \qquad x_{3}\approx 1{,}9}$$
     *Vérification :* $f(-1{,}5)=3{,}375-4{,}5+2=0{,}875$ et $f(1{,}9)=-6{,}859+5{,}7+2=0{,}841$, deux valeurs proches de $1$.
- id: "p-04-33"
  feuille: "f-p-04"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [taux de variation, nombre dérivé, fonction dérivée, produit et quotient, racine carrée, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. Si $f(x)=x^{5}$, alors $f'(x)$ vaut ¦ $5x^{4}$ ¦ $x^{4}$ ¦ $5x^{6}$
    2. La dérivée de $x\mapsto\dfrac{1}{x^{2}}$ sur $\mathbb{R}^{*}$ est ¦ $-\dfrac{1}{2x}$ ¦ $-\dfrac{2}{x^{3}}$ ¦ $\dfrac{2}{x^{3}}$
    3. La dérivée de $x\mapsto\sqrt{x}$ sur $]0\,;+\infty[$ est ¦ $\dfrac{1}{2\sqrt{x}}$ ¦ $2\sqrt{x}$ ¦ $-\dfrac{1}{2\sqrt{x}}$
    4. Si $f=uv$, alors $f'$ vaut ¦ $u'v'$ ¦ $u'v+uv'$ ¦ $u'v-uv'$
    5. Si $f'(x)<0$ sur un intervalle $I$, alors sur $I$ la fonction $f$ est ¦ croissante ¦ décroissante ¦ constante
    6. Pour $f(x)=x^{3}$, on a $f'(0)=0$. La fonction $f$ admet en $0$ ¦ un minimum ¦ un maximum ¦ aucun extremum
    7. Le taux de variation de $f$ entre $a$ et $a+h$ est ¦ $\dfrac{f(a+h)-f(a)}{h}$ ¦ $f(a+h)-f(a)$ ¦ $\dfrac{f(a+h)-f(a)}{a+h}$
    8. La dérivée de $x\mapsto(3x+1)^{5}$ est ¦ $5(3x+1)^{4}$ ¦ $15(3x+1)^{4}$ ¦ $3(3x+1)^{4}$
    9. La dérivée de $x\mapsto\sqrt{5x+2}$ est ¦ $\dfrac{1}{2\sqrt{5x+2}}$ ¦ $\dfrac{5}{2\sqrt{5x+2}}$ ¦ $\dfrac{5}{\sqrt{5x+2}}$
    ```
  corrige: |
    **1.** **Réponse A.** $\left(x^{n}\right)'=nx^{n-1}$, donc la dérivée de $x^{5}$ est $5x^{4}$. La réponse B oublie le facteur $5$, la réponse C *augmente* l'exposant au lieu de le diminuer.

    **2.** **Réponse B.** $\left(\dfrac{1}{x^{n}}\right)'=-\dfrac{n}{x^{n+1}}$ avec $n=2$ donne $-\dfrac{2}{x^{3}}$. La réponse C oublie le signe $-$.

    **3.** **Réponse A.** C'est la proposition 3 du cours.

    **4.** **Réponse B.** $(uv)'=u'v+uv'$. La réponse A est l'erreur la plus fréquente : la dérivée d'un produit n'est *pas* le produit des dérivées.

    **5.** **Réponse A.** La tangente a pour coefficient directeur $f'(a)$ et passe par le point $\big(a\,;f(a)\big)$. La réponse B échange les rôles de $f(a)$ et $f'(a)$.

    **6.** **Réponse B.** C'est la proposition 8 du cours.

    **7.** **Réponse C.** $f'(x)=3x^{2}$ s'annule en $0$ *sans changer de signe* : la fonction cube est croissante sur $\mathbb{R}$, et n'admet aucun extremum.

    **8.** **Réponse A.** C'est la définition du taux de variation, dont le dénominateur est $(a+h)-a=h$.

    **9.** **Réponse B.** $\left(u^{n}\right)'=n\,u'\,u^{n-1}$ avec $u(x)=3x+1$, $u'(x)=3$ et $n=5$ donne $5\times 3\times(3x+1)^{4}=15(3x+1)^{4}$. La réponse A oublie $u'$.

    **10.** **Réponse B.** $\left(\sqrt{u}\right)'=\dfrac{u'}{2\sqrt{u}}$ avec $u'(x)=5$ donne $\dfrac{5}{2\sqrt{5x+2}}$. La réponse A oublie encore $u'$.
- id: "p-04-34"
  feuille: "f-p-04"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [nombre dérivé, tangente, fonction dérivée, produit et quotient, variations, extremums]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 13
  page_corrige: 30
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Si $f'(a)=0$, alors $f$ admet un extremum local en $a$.

    **2.** Si $f$ est dérivable et admet un extremum local en $a$, alors $f'(a)=0$.

    **3.** La tangente à $\mathcal{C}_f$ au point d'abscisse $a$ a pour coefficient directeur $f(a)$.

    **4.** La dérivée d'un quotient est le quotient des dérivées.

    **5.** Si $f$ est dérivable et croissante sur un intervalle $I$, alors $f'(x)\geqslant 0$ sur $I$.

    **6.** La fonction inverse $x\mapsto\dfrac{1}{x}$ est décroissante sur $\mathbb{R}^{*}$.

    **7.** Si $f'$ est constante sur $I$, alors $f$ est une fonction affine sur $I$.
  corrige: |
    **1.** **Fausse**. *Contre-exemple :* $f(x)=x^{3}$ vérifie $f'(0)=0$, et pourtant $f$ est croissante sur $\mathbb{R}$ : il n'y a aucun extremum en $0$. *Énoncé correct :* il faut de plus que $f'$ **change de signe** en $a$.

    **2.** **Vraie**. C'est le premier point de la proposition 9 du cours.

    **3.** **Fausse**. Le coefficient directeur de la tangente est $f'(a)$ ; le nombre $f(a)$ est l'*ordonnée* du point de contact.

    **4.** **Fausse**. *Contre-exemple :* avec $u(x)=x^{2}$ et $v(x)=x$, on a $\frac{u}{v}(x)=x$ donc $\left(\frac{u}{v}\right)'(x)=1$, alors que $\frac{u'}{v'}(x)=\frac{2x}{1}=2x$. *Énoncé correct :* $\left(\dfrac{u}{v}\right)'=\dfrac{u'v-uv'}{v^{2}}$.

    **5.** **Vraie**. Si $f$ était strictement décroissante quelque part, sa dérivée y serait négative. Une fonction croissante a donc une dérivée positive ou nulle.

    **6.** **Fausse**. La fonction inverse est décroissante **sur chaque intervalle** de son ensemble de définition, mais pas sur $\mathbb{R}^{*}$ tout entier. *Contre-exemple :* $-1<1$ et pourtant $f(-1)=-1<1=f(1)$ : l'ordre est conservé, ce qui contredit la décroissance.

    **7.** **Vraie**. Si $f'(x)=k$ pour tout $x$ de $I$, alors $f$ est de la forme $x\mapsto kx+b$ : c'est une fonction affine. *On remarque que* la réciproque est également vraie.
- id: "p-04-35"
  feuille: "f-p-04"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [variations, optimisation]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 13
  page_corrige: 30
  enonce: |
    Le plan est muni d'un repère orthonormé. On considère la parabole $\mathcal{P}$ d'équation $y=9-x^{2}$. Pour tout réel $x$ de $]0\,;3[$, on construit le rectangle $MNPQ$ dont les sommets $M$ et $N$ appartiennent à l'axe des abscisses, d'abscisses respectives $-x$ et $x$, et dont les sommets $P$ et $Q$ appartiennent à $\mathcal{P}$.

    ![Figure](documents/figures/86375d82ed313938.svg)

    **1.** Exprimer la longueur $MN$ puis la hauteur $NP$ en fonction de $x$.

    **2.** En déduire que l'aire du rectangle vaut $A(x)=18x-2x^{3}$.

    **3.** Calculer $A'(x)$ et le factoriser.

    **4.** Étudier le signe de $A'$ sur $]0\,;3[$ et dresser le tableau de variations de $A$.

    **5.** En déduire la valeur exacte de $x$ pour laquelle l'aire est maximale, puis la valeur exacte de cette aire maximale. En donner une valeur approchée au centième.

    **6.** Déterminer alors les dimensions exactes du rectangle d'aire maximale.
  corrige: |
    **1.** Les points $M$ et $N$ ont pour abscisses $-x$ et $x$, donc 
    $$\boxed{MN=x-(-x)=2x}$$
     Le point $P$ appartient à $\mathcal{P}$ et a pour abscisse $x$, donc son ordonnée vaut $9-x^{2}$ : 
    $$\boxed{NP=9-x^{2}}$$

    **2.** L'aire du rectangle est le produit de ses deux dimensions : 
    $$A(x)=2x\left(9-x^{2}\right)=\boxed{18x-2x^{3}}$$

    **3.** $A'(x)=18-6x^{2}=6\left(3-x^{2}\right)=\boxed{6\left(\sqrt{3}-x\right) \left(\sqrt{3}+x\right)}$

    **4.** Sur $]0\,;3[$, le facteur $\sqrt{3}+x$ est positif : le signe de $A'$ est celui de $\sqrt{3}-x$, positif avant $\sqrt{3}$ et négatif après.

    ![Figure](documents/figures/3da128a049d2fba2.svg)

    **5.** L'aire est maximale pour $x=\sqrt{3}$, et vaut alors 
    $$A\left(\sqrt{3}\right)=2\sqrt{3}\left(9-3\right)=\boxed{12\sqrt{3}\approx 20{,}78}$$

    **6.** Les dimensions du rectangle sont alors : 
    $$MN=2\sqrt{3} \qquad\text{et}\qquad NP=9-3=6$$

    $$\boxed{\text{Le rectangle d'aire maximale mesure } 2\sqrt{3} \text{ sur } 6.}$$
     *Vérification :* $2\sqrt{3}\times 6=12\sqrt{3}$.
- id: "p-04-36"
  feuille: "f-p-04"
  numero: 36
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [racine carrée, variations, extremums]
  noeuds: [ar-deriv]
  notions: []
  page_enonce: 13
  page_corrige: 31
  enonce: |
    Pour tout réel $m$, on considère la fonction $f_{m}$ définie sur $\mathbb{R}$ par : 
    $$f_{m}(x)=x^{3}-3mx+1$$

    **1.** Calculer $f_{m}'(x)$ en fonction de $m$.

    **2.** **Premier cas.** On suppose $m\leqslant 0$. Étudier le signe de $f_{m}'$ et en déduire les variations de $f_{m}$ sur $\mathbb{R}$. La fonction admet-elle des extremums ?

    **3.** **Second cas.** On suppose $m>0$. Montrer que $f_{m}'$ s'annule en deux valeurs que l'on exprimera en fonction de $m$, puis dresser le tableau de variations de $f_{m}$.

    **4.** Montrer que, dans ce second cas, le maximum local de $f_{m}$ vaut $2m\sqrt{m}+1$ et son minimum local $-2m\sqrt{m}+1$.

    **5.** Déterminer la valeur de $m$ pour laquelle $f_{m}'(1)=0$. Pour cette valeur, préciser les deux extremums locaux de $f_{m}$.

    **6.** Montrer que toutes les courbes des fonctions $f_{m}$ passent par un même point, dont on donnera les coordonnées.
  corrige: |
    **1.** $f_{m}(x)=x^{3}-3mx+1$, où $m$ est une constante, donc 
    $$\boxed{f_{m}'(x)=3x^{2}-3m=3\left(x^{2}-m\right)}$$

    **2.** **Cas $m\leqslant 0$.** Alors $-m\geqslant 0$, donc $x^{2}-m\geqslant x^{2}\geqslant 0$ : la dérivée est positive sur $\mathbb{R}$, et ne s'annule qu'en $0$ dans le cas $m=0$. 
    $$\boxed{f_{m} \text{ est croissante sur } \mathbb{R} \text{ et n'admet aucun extremum.}}$$

    **3.** **Cas $m>0$.** Alors $\sqrt{m}$ existe et 
    $$x^{2}-m=\left(x-\sqrt{m}\right)\left(x+\sqrt{m}\right)$$
     La dérivée s'annule donc en $-\sqrt{m}$ et $\sqrt{m}$, et elle est négative entre ces deux valeurs.

    ![Figure](documents/figures/44e65909cf10d24c.svg)

    **4.** On calcule les deux extremums. Comme $\left(\sqrt{m}\right)^{3}=m\sqrt{m}$ : 
    $$f_{m}\left(-\sqrt{m}\right)=-m\sqrt{m}+3m\sqrt{m}+1=\boxed{2m\sqrt{m}+1} \qquad (\text{maximum local})$$

    $$f_{m}\left(\sqrt{m}\right)=m\sqrt{m}-3m\sqrt{m}+1=\boxed{-2m\sqrt{m}+1} \qquad (\text{minimum local})$$

    **5.** $f_{m}'(1)=3(1-m)=0 \iff \boxed{m=1}$. Pour cette valeur, les extremums sont atteints en $-1$ et $1$, et valent : 
    $$f_{1}(-1)=-1+3+1=\boxed{3} \qquad\text{et}\qquad f_{1}(1)=1-3+1=\boxed{-1}$$
     *Vérification par la formule de la question 4 :* $2\times 1\times 1+1=3$ et $-2\times 1\times 1+1=-1$.

    **6.** Pour toute valeur de $m$, on a : 
    $$f_{m}(0)=0^{3}-3m\times 0+1=1$$
     Le terme en $m$ disparaît, car il est multiplié par $x=0$. 
    $$\boxed{\text{Toutes les courbes passent par le point de coordonnées } (0\,;1).}$$

