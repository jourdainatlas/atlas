  enonce: |
    **Loxodromies du tore, cercles de Villarceau.** Soit $a > 0$, $\theta \in \, ]0, \dfrac{\pi}{2}[$ et $r = a\sin\theta$. Le tore $T$ engendré par la rotation autour de $Oz$ du cercle de centre $(a, 0, 0)$ et de rayon $r$ du plan $y = 0$ est paramétré par 
    $$P(\varphi, \psi) = \big((a + r\cos\psi)\cos\varphi, \ (a + r\cos\psi)\sin\varphi, \ r\sin\psi\big) .$$

    **1.** Calculer la première forme fondamentale de $T$. Les parallèles sont les courbes $\psi =$ constante.

    **2.** Soit $V \in \, ]0, \dfrac{\pi}{2}[$. Montrer qu'une courbe $\psi \mapsto P(\varphi(\psi), \psi)$ coupe tous les parallèles sous l'angle $V$ si et seulement si $\varphi'(\psi) = \dfrac{r}{(a + r\cos\psi)\tan V}$.

    **3.** En déduire, avec $k = \dfrac{\tan V}{\tan\theta}$ et $\lambda = \sqrt{\dfrac{1 - \sin\theta}{1 + \sin\theta}}$, que ces courbes sont données, pour $\psi \in \, ]{-\pi}, \pi[$, par 
    $$\tan\frac{k(\varphi - \varphi_{0})}{2} = \lambda\tan\frac{\psi}{2} .$$
     Quand $\psi$ décrit $]{-\pi}, \pi[$, de combien $\varphi$ augmente-t-il ? Montrer que la courbe se referme si et seulement si $k$ est rationnel.

    **4.** On suppose $V = \theta$, c'est-à-dire $k = 1$. En utilisant les coordonnées polaires $(\rho, \varphi)$ du plan $z = 0$, montrer que la projection de la courbe sur ce plan, d'équation polaire $\rho = a + r\cos\psi$, est une ellipse de foyer $O$ et d'excentricité $\sin\theta$. On admettra que la courbe elle-même est alors un cercle : c'est un *cercle de Villarceau*, contenu dans un plan bitangent au tore.
  corrige: |
    **1.** $P_{\varphi} = (a + r\cos\psi)(-\sin\varphi, \cos\varphi, 0)$ et $P_{\psi} = r(-\sin\psi\cos\varphi, -\sin\psi\sin\varphi, \cos\psi)$ sont orthogonaux : $E = (a + r\cos\psi)^{2}$, $F = 0$, $G = r^{2}$.

    **2.** La courbe $c(\psi) = P(\varphi(\psi), \psi)$ a pour vitesse $\varphi'P_{\varphi} + P_{\psi}$, de composantes orthogonales $\varphi'(a + r\cos\psi)$ selon la direction unitaire du parallèle et $r$ selon celle du méridien. L'angle $V$ avec le parallèle vérifie donc $\tan V = \dfrac{r}{(a + r\cos\psi)\varphi'}$, d'où la condition.

    **3.** Comme $a^{2} - r^{2} = a^{2}\cos^{2}\theta$ et $\dfrac{r}{a\cos\theta} = \tan\theta$, la primitive classique 
    $$\int\frac{\mathrm{d}\psi}{a + r\cos\psi} = \frac{2}{\sqrt{a^{2} - r^{2}}}\arctan\left(\sqrt{\frac{a - r}{a + r}}\tan\frac{\psi}{2}\right)$$
     (obtenue par $s = \tan\dfrac{\psi}{2}$) donne
    $$\varphi - \varphi_{0} = \frac{2\tan\theta}{\tan V}\arctan\left(\lambda\tan\frac{\psi}{2}\right) = \frac{2}{k}\arctan\left(\lambda\tan\frac{\psi}{2}\right) ,$$
     d'où la relation annoncée, avec $\dfrac{k(\varphi - \varphi_{0})}{2} \in \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$.

    Quand $\psi$ décrit $]{-\pi}, \pi[$, c'est-à-dire fait un tour du méridien, $\varphi$ augmente de $\dfrac{2\pi}{k}$. La courbe, prolongée par continuité, se referme après $q$ tours du méridien si et seulement si $\dfrac{2\pi q}{k} \in 2\pi\mathbb{Z}$, ce qui est possible si et seulement si $k$ est rationnel.

    **4.** Avec $k = 1$, $\varphi_{0} = 0$ et
    $$T = \tan\frac{\varphi}{2} = \lambda\tan\frac{\psi}{2} ,$$
     on a
    $$\cos\psi = \frac{\lambda^{2} - T^{2}}{\lambda^{2} + T^{2}}$$
     et
    $$T^{2} = \frac{1 - \cos\varphi}{1 + \cos\varphi} .$$
     Comme $\lambda^{2}(a + r) = a - r$, un calcul direct donne 
    $$\rho = a + r\cos\psi = \frac{a^{2} - r^{2}}{a - r\cos\varphi} = \boxed{\frac{a\cos^{2}\theta}{1 - \sin\theta\cos\varphi}} ,$$
     équation polaire d'une conique de foyer $O$, d'excentricité $\boxed{\sin\theta < 1}$ : une ellipse, de grand axe $2a$ (ses distances extrêmes au foyer sont $a - r$ et $a + r$).

    ![Figure](documents/figures/ac874533ad7cf05f.svg)

    Projections sur le plan $z = 0$ de deux loxodromies du tore $a = 1$, $\theta = 0{,}5$ (entre les cercles gris de rayons $a \pm r$) : pour $k = 1$, la projection du cercle de Villarceau est l'ellipse bleue, de foyer $O$ (en rouge) et de centre $(r, 0)$ ; pour $k = 3$, la courbe violette fait trois tours de méridien en un tour autour de l'axe, puis se referme.
