  page_corrige: 1
  enonce: |
    **La sphère et la projection de Mercator.** On considère l'application
    $$f : \, ]0, 2\pi[ \times \left]{-\frac{\pi}{2}}, \frac{\pi}{2}\right[ \to \mathbb{R}^{3}, \qquad f(\theta, \psi) = (\cos\psi\cos\theta, \cos\psi\sin\theta, \sin\psi) .$$

    **1.** Montrer que $f$ est une immersion injective, et déterminer son image.

    **2.** Calculer la première forme fondamentale de la sphère dans cette paramétrisation, et l'aire de la sphère.

    **3.** On suit la courbe $t \mapsto f(2\pi t, \psi_{0})$, $t \in \, ]0, 1[$, à $\psi_{0}$ fixé. La dessiner et calculer sa longueur.

    **4.** Même question pour $t \mapsto f\left(\theta_{0}, -\dfrac{\pi}{2} + \pi t\right)$, à $\theta_{0}$ fixé.

    **5.** Montrer que l'application $\phi(u, v) = \left(u, 2\arctan(\mathrm{e}^{v}) - \dfrac{\pi}{2}\right)$ est un difféomorphisme de $]0, 2\pi[ \times \mathbb{R}$ sur $]0, 2\pi[ \times \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$, et calculer la première forme fondamentale de la paramétrisation $f \circ \phi$.

    **6.** On suit dans la carte $(u, v)$ une droite. Montrer que la courbe obtenue sur la sphère coupe les méridiens et les parallèles sous un angle constant. Dessiner l'une de ces courbes, appelées *loxodromies*, et calculer sa longueur entre les deux pôles.
  corrige: |
    **1.** $f_{\theta} = \cos\psi(-\sin\theta, \cos\theta, 0)$ et $f_{\psi} = (-\sin\psi\cos\theta, -\sin\psi\sin\theta, \cos\psi)$ sont orthogonaux, de normes $\cos\psi > 0$ et $1$ : *$f$ est une immersion*. La troisième coordonnée détermine $\psi = \arcsin z$, puis $(\cos\theta, \sin\theta)$ détermine $\theta \in \, ]0, 2\pi[$ : $f$ est injective. Son image est *la sphère privée du demi-grand cercle fermé $\{y = 0, x \geq 0\}$*, qui contient les deux pôles.

    **2.** D'après le calcul précédent,
    $$\boxed{(g_{ij}) = \begin{pmatrix} \cos^{2}\psi & 0 \\ 0 & 1 \end{pmatrix}}$$
     et $\sqrt{EG - F^{2}} = \cos\psi$. Le demi-méridien retiré étant d'aire nulle, l'aire de la sphère vaut
    $$\int_{0}^{2\pi}\int_{-\pi/2}^{\pi/2}\cos\psi\,\mathrm{d}\psi\,\mathrm{d}\theta = \boxed{4\pi} .$$

    **3.** La vitesse de $t \mapsto f(2\pi t, \psi_{0})$ a pour carré $E\cdot(2\pi)^{2} = 4\pi^{2}\cos^{2}\psi_{0}$ : c'est le *parallèle* de latitude $\psi_{0}$, cercle de rayon $\cos\psi_{0}$, de longueur $\boxed{2\pi\cos\psi_{0}}$.

    **4.** La courbe $t \mapsto f(\theta_{0}, -\dfrac{\pi}{2} + \pi t)$ est un *demi-méridien* parcouru à vitesse $\pi$, de longueur $\boxed{\pi}$.

    **5.** La fonction $\Phi(v) = 2\arctan(\mathrm{e}^{v}) - \dfrac{\pi}{2}$ a pour dérivée
    $$\Phi'(v) = \frac{2\mathrm{e}^{v}}{1 + \mathrm{e}^{2v}} = \frac{1}{\operatorname{ch}v} > 0$$
     et tend vers $\pm\dfrac{\pi}{2}$ en $\pm\infty$ : c'est un $\mathcal{C}^{\infty}$-difféomorphisme de $\mathbb{R}$ sur $]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$, et $\phi = (\mathrm{id}, \Phi)$ aussi. De plus
    $$\cos\Phi(v) = \sin(2\arctan\mathrm{e}^{v}) = \frac{2\mathrm{e}^{v}}{1 + \mathrm{e}^{2v}} = \frac{1}{\operatorname{ch}v} .$$
     Par l'exercice 2, de jacobienne $\operatorname{diag}(1, \dfrac{1}{\operatorname{ch}v})$, 
    $$(g_{ij})_{f \circ \phi} = \begin{pmatrix} \cos^{2}\psi & 0 \\ 0 & \frac{1}{\operatorname{ch}^{2}v} \end{pmatrix} = \boxed{\frac{1}{\operatorname{ch}^{2}v}\,I_{2}} .$$
     La première forme est proportionnelle à l'identité : la paramétrisation de Mercator est *conforme*, elle conserve les angles (mais pas les longueurs).

    **6.** Pour deux vecteurs de la carte,
    $$g(X, Y) = \frac{1}{\operatorname{ch}^{2}v}\langle X, Y \rangle :$$
     l'angle sur la sphère entre leurs images est l'angle euclidien entre $X$ et $Y$. Une droite de la carte, de direction $(m, 1)$, fait donc un angle constant avec les directions $(1, 0)$ des parallèles et $(0, 1)$ des méridiens. La loxodromie $u = u_{0} + mv$ relie les deux pôles ($v \to \pm\infty$), et sa longueur vaut 
    $$\int_{-\infty}^{+\infty}\frac{\sqrt{m^{2} + 1}}{\operatorname{ch}v}\,\mathrm{d} v = \boxed{\pi\sqrt{1 + m^{2}}} ,$$
     puisque
    $$\int_{\mathbb{R}}\frac{\mathrm{d} v}{\operatorname{ch}v} = \big[2\arctan\mathrm{e}^{v}\big]_{-\infty}^{+\infty} = \pi .$$
     Elle tourne une infinité de fois autour de chaque pôle, mais sa longueur est finie, comme la spirale logarithmique de la feuille 1, dont elle est l'image par la projection stéréographique.

    ![Figure](documents/figures/2fd6b34fea17feae.svg)

    La loxodromie $u = 0{,}3 + 3v$ (en orange, en tirets sur la face cachée), qui coupe les méridiens et les parallèles (en gris) sous un angle constant et s'enroule autour des deux pôles. Sa longueur, $\pi\sqrt{10} \approx 9{,}93$, est finie. C'est la route à cap constant des navigateurs, une droite sur une carte de Mercator.
