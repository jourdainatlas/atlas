  noeuds: [sf-gauss, sf-courbures]
  notions: [courbure-gauss, courbure-moyenne, courbures-principales, point-critique]
  source: "Bordeaux 2016, feuille 4, exercice 6"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Graphe en un point critique.** Soit $\varphi : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ et $S$ la surface d'équation $z = \varphi(x, y)$, paramétrée par $f(x, y) = (x, y, \varphi(x, y))$. Montrer que, si $d\varphi(x_{0}, y_{0}) = 0$, la seconde forme fondamentale de $S$ en $f(x_{0}, y_{0})$ a pour matrice la hessienne de $\varphi$ en $(x_{0}, y_{0})$, et que $K$ est le déterminant de cette hessienne. Retrouver ainsi la nature (elliptique, hyperbolique, parabolique) de l'origine pour $z = x^{2} + 3y^{2}$, $z = x^{2} - y^{2}$, $z = x^{2}$.
  corrige: |
    $f_{x} = (1, 0, \varphi_{x})$, $f_{y} = (0, 1, \varphi_{y})$, et au point critique ces vecteurs valent $e_{1}$, $e_{2}$ : $(g_{ij}) = I_{2}$ et $V = e_{3}$. Comme $f_{xx} = (0, 0, \varphi_{xx})$, $f_{xy} = (0, 0, \varphi_{xy})$, $f_{yy} = (0, 0, \varphi_{yy})$, on obtient
    $$(h_{ij}) = \begin{pmatrix} \varphi_{xx} & \varphi_{xy} \\ \varphi_{xy} & \varphi_{yy} \end{pmatrix} ,$$
     la hessienne de $\varphi$, et $K = \det(h_{ij})$. C'est le cas particulier de la proposition 8 où la surface est un graphe au-dessus de son plan tangent. Pour $z = x^{2} + 3y^{2}$, la hessienne $\operatorname{diag}(2, 6)$ donne $K = 12 > 0$ : point *elliptique* ; pour $z = x^{2} - y^{2}$, $\operatorname{diag}(2, -2)$ et $K = -4$ : point *hyperbolique* ; pour $z = x^{2}$, $\operatorname{diag}(2, 0)$ et $K = 0$ avec $W \neq 0$ : point *parabolique*.
- id: "l3-gd-03-08"
  feuille: "f-l3-gd-03"
  numero: 8
  partie: "Seconde forme fondamentale, courbures"
  etoiles: 2
  types: [Calcul]
  mots_cles: [courbures, tore et caténoïde]
  noeuds: [sf-gauss, sf-courbures, sf-tore-catenoide]
  notions: [courbure-gauss, courbure-moyenne, courbures-principales]
  source: "Bordeaux 2016, feuille 4, exercice 5"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Le tore.** Soient $0 < r < R$ et $T$ le tore d'équation $\left(\sqrt{x^{2} + y^{2}} - R\right)^{2} + z^{2} = r^{2}$.

    **1.** Déterminer la partie de $T$ obtenue par la paramétrisation 
    $$\phi : \, ]0, 2\pi[ \times \, ]0, 2\pi[ \to \mathbb{R}^{3}, \qquad (u, v) \mapsto \big((R + r\sin v)\cos u, \ (R + r\sin v)\sin u, \ r\cos v\big) .$$

    **2.** Déterminer la première forme fondamentale associée à $\phi$.

    **3.** Donner la seconde forme fondamentale associée à $\phi$, et la courbure de Gauss.

    **4.** Déterminer l'ensemble des points du tore en lesquels la courbure de Gauss est strictement négative, nulle, strictement positive. Faire un dessin.

    **5.** Calculer $\mathop{\displaystyle \iint} K\sqrt{EG - F^{2}}\,\mathrm{d} u\,\mathrm{d} v$ sur $]0, 2\pi[^{2}$, et interpréter le résultat à l'aide de la proposition 10 du cours.
  corrige: |
    **1.** Avec $\rho = R + r\sin v$ et $z = r\cos v$, on a $(\rho - R)^{2} + z^{2} = r^{2}$ : $\phi$ est à valeurs dans $T$. Pour $(u, v) \in \, ]0, 2\pi[^{2}$, on obtient *$T$ privé du méridien $\{y = 0, x > 0\}$ ($u = 0$) et du parallèle supérieur $\{z = r, \rho = R\}$ ($v = 0$).*

    **2.** $\phi_{u} = (R + r\sin v)(-\sin u, \cos u, 0)$ et $\phi_{v} = r(\cos v\cos u, \cos v\sin u, -\sin v)$ sont orthogonaux :
    $$\boxed{(g_{ij}) = \begin{pmatrix} (R + r\sin v)^{2} & 0 \\ 0 & r^{2} \end{pmatrix}} .$$

    **3.** La normale unitaire
    $$V = \frac{\phi_{u} \wedge \phi_{v}}{\lVert \phi_{u} \wedge \phi_{v} \rVert} = -(\sin v\cos u, \sin v\sin u, \cos v)$$
     est dirigée vers l'âme du tore. Avec $\phi_{uu} = -(R + r\sin v)(\cos u, \sin u, 0)$, $\phi_{uv} = r\cos v(-\sin u, \cos u, 0)$ et $\phi_{vv} = -r(\sin v\cos u, \sin v\sin u, \cos v)$ : 
    $$(h_{ij}) = \begin{pmatrix} (R + r\sin v)\sin v & 0 \\ 0 & r \end{pmatrix}, \qquad \boxed{K = \frac{\sin v}{r(R + r\sin v)}} .$$

    **4.** Comme $R + r\sin v > 0$, $K$ a le signe de $\sin v$ : *$K > 0$ sur la moitié extérieure* ($\sin v > 0$, distance à l'axe $\rho > R$), *$K < 0$ sur la moitié intérieure* ($\rho < R$), et *$K = 0$ sur les parallèles supérieur et inférieur* $z = \pm r$, où le plan tangent est horizontal.

    ![Figure](documents/figures/02c46d6b5be0625a.svg)

    Coupe du tore $R = 2$, $r = 1$ par un plan contenant l'axe : la moitié extérieure (en bleu), en forme de ballon, a une courbure positive ; la moitié intérieure (en rouge), en forme de selle, une courbure négative ; elles se raccordent le long des parallèles $z = \pm 1$ (points noirs), où $K = 0$.

    **5.** On a
    $$K\sqrt{EG - F^{2}} = \frac{\sin v}{r(R + r\sin v)}\cdot r(R + r\sin v) = \sin v ,$$
     donc
    $$\iint K\sqrt{EG - F^{2}}\,\mathrm{d} u\,\mathrm{d} v = \int_{0}^{2\pi}\int_{0}^{2\pi}\sin v\,\mathrm{d} v\,\mathrm{d} u = \boxed{0} .$$
     Sur la moitié extérieure, l'application de Gauss est injective et son image recouvre la sphère (privée d'un ensemble d'aire nulle) : par la proposition 10,
    $$\iint_{\sin v > 0}K\,\mathrm{d} A = 4\pi ;$$
     de même, la moitié intérieure recouvre une seconde fois la sphère, avec
    $$\iint|K|\,\mathrm{d} A = 4\pi .$$
     Les deux contributions, de signes opposés, se compensent : la *courbure totale* du tore est nulle, alors que celle de la sphère vaut $4\pi$. Ce n'est pas un hasard : la formule de Gauss-Bonnet relie la courbure totale d'une surface compacte à sa forme globale (le nombre de « trous »).
- id: "l3-gd-03-09"
  feuille: "f-l3-gd-03"
  numero: 9
  partie: "Seconde forme fondamentale, courbures"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [courbures]
  noeuds: [sf-gauss, sf-courbures]
  notions: [courbure-gauss, courbure-moyenne, courbures-principales]
  source: "Bordeaux 2016, feuille 4, exercice 7"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Le paraboloïde hyperbolique.** Soit $\Sigma$ la surface d'équation $x^{2} - y^{2} = z$.

    **1.** On pose $u = x - y$ et $v = x + y$. En déduire une paramétrisation $\phi$ de $\Sigma$ par $(u, v)$, et montrer que c'est un plongement.

    **2.** Déterminer la première forme fondamentale associée à $\phi$.

    **3.** Donner la matrice de la seconde forme fondamentale dans cette paramétrisation.

    **4.** Montrer que l'endomorphisme de Weingarten a pour matrice dans la base $(\phi_{u}, \phi_{v})$ 
    $$\frac{2}{(1 + 2u^{2} + 2v^{2})^{3/2}}\begin{pmatrix} -2uv & 1 + 2u^{2} \\ 1 + 2v^{2} & -2uv \end{pmatrix} .$$

    **5.** Déterminer la courbure de Gauss et la courbure moyenne de $\Sigma$, et les courbures principales aux points de courbure moyenne nulle.

    **6.** Déterminer les directions principales au point $\phi(0, 0)$, et interpréter les courbes $u =$ constante et $v =$ constante.
  corrige: |
    **1.** De $x = \dfrac{u + v}{2}$, $y = \dfrac{v - u}{2}$, on tire $z = x^{2} - y^{2} = uv$, d'où
    $$\boxed{\phi(u, v) = \left(\frac{u + v}{2}, \frac{v - u}{2}, uv\right)} .$$
     C'est un plongement : c'est une immersion (voir la question 2), elle est injective, et son inverse $(x, y, z) \mapsto (x - y, x + y)$ est continu.

    **2.** On a
    $$\phi_{u} = \left(\frac{1}{2}, -\frac{1}{2}, v\right) ,$$

    $$\phi_{v} = \left(\frac{1}{2}, \frac{1}{2}, u\right) :$$
     $E = \dfrac{1}{2} + v^{2}$, $F = uv$, $G = \dfrac{1}{2} + u^{2}$, et
    $$EG - F^{2} = \frac{1}{4}(1 + 2u^{2} + 2v^{2}) = \frac{D}{4} > 0 ,$$
     en notant $D = 1 + 2u^{2} + 2v^{2}$.

    **3.** On a
    $$\phi_{u} \wedge \phi_{v} = \frac{1}{2}(-(u + v), v - u, 1) ,$$
     de norme $\dfrac{\sqrt{D}}{2}$, donc $V = \dfrac{(-(u + v), v - u, 1)}{\sqrt{D}}$. Comme $\phi_{uu} = \phi_{vv} = 0$ et $\phi_{uv} = (0, 0, 1)$ :
    $$\boxed{(h_{ij}) = \frac{1}{\sqrt{D}}\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}} .$$

    **4.** On a
    $$(g_{ij})^{-1} = \frac{4}{D}\begin{pmatrix} \frac{1}{2} + u^{2} & -uv \\ -uv & \frac{1}{2} + v^{2} \end{pmatrix} ,$$
     et
    $$(W) = (g_{ij})^{-1}(h_{ij}) = \frac{4}{D^{3/2}}\begin{pmatrix} -uv & \frac{1}{2} + u^{2} \\ \frac{1}{2} + v^{2} & -uv \end{pmatrix} ,$$
     qui est la matrice annoncée.

    **5.** On a
    $$K = \frac{\det(h_{ij})}{\det(g_{ij})} = \frac{-1/D}{D/4} = \boxed{-\frac{4}{(1 + 2u^{2} + 2v^{2})^{2}}}$$
     et
    $$H = \frac{1}{2}{}^{t}W = \boxed{-\frac{4uv}{(1 + 2u^{2} + 2v^{2})^{3/2}}} .$$
     La surface est partout hyperbolique. $H = 0$ si et seulement si $uv = 0$, c'est-à-dire sur les deux droites $z = 0$, $y = \pm x$ ; les courbures principales y valent $\pm\sqrt{-K} = \pm\dfrac{2}{D}$.

    **6.** En $(0, 0)$,
    $$(W) = 2\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix} ,$$
     de vecteurs propres $(1, 1)$ et $(1, -1)$ pour les valeurs propres $2$ et $-2$ : les directions principales sont $\phi_{u} + \phi_{v} = (1, 0, 0)$ et $\phi_{u} - \phi_{v} = (0, -1, 0)$, les axes $Ox$ et $Oy$, avec les courbures $2$ et $-2$ (exercice 7). Les courbes $u =$ constante et $v =$ constante sont des *droites* : $\phi(u_{0}, v)$ est affine en $v$. Ce sont des directions où $II$ s'annule ($h_{11} = h_{22} = 0$), dites *asymptotiques* : le paraboloïde hyperbolique est doublement réglé.

    ![Figure](documents/figures/a31f0ed6cac5fa31.svg)

    Le paraboloïde hyperbolique $z = x^{2} - y^{2}$ pour $(u, v) \in [-1, 1]^{2}$ (hauteur divisée par $2$) : les droites $u =$ constante (en bleu) et $v =$ constante (en orange). Bien que la surface soit courbée en selle en chaque point ($K < 0$), elle est entièrement formée de droites, comme l'hyperboloïde à une nappe de la feuille 2.
- id: "l3-gd-03-10"
  feuille: "f-l3-gd-03"
  numero: 10
  partie: "Seconde forme fondamentale, courbures"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [courbures]
  noeuds: [sf-gauss, sf-courbures]
  notions: [courbure-gauss, courbure-moyenne, courbures-principales]
  source: "Bordeaux 2016, feuille 4, exercice 8"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Surfaces de révolution, surfaces de même courbure.**

    **1.** Montrer que la surface paramétrée par $f(u, v) = (u\cos v, u\sin v, \ln u)$, $u > 0$, et l'hélicoïde $g(u, v) = (u\cos v, u\sin v, v)$ ont la même courbure de Gauss aux points $f(u, v)$ et $g(u, v)$, mais que leurs premières formes fondamentales en $(u, v)$ diffèrent. La courbure de Gauss ne suffit donc pas à déterminer la première forme fondamentale ; le chapitre 4 étudiera ce qu'elle en retient.

    **2.** Soit $\phi(\theta, t) = (g(t)\cos\theta, g(t)\sin\theta, h(t))$ une surface de révolution, où $g > 0$ et $h$ sont de classe $\mathcal{C}^{2}$, avec $g'^{2} + h'^{2} = 1$ et $h'$ ne s'annulant pas. Montrer que la courbure de Gauss au point de paramètres $(\theta, t)$ vaut $K = -\dfrac{g''(t)}{g(t)}$.

    **3.** Trouver les surfaces de révolution de courbure constante $K = 1$, puis $K = -1$. Pour $K = -1$, on pourra prendre $g(t) = \mathrm{e}^{-t}$, $t > 0$, et l'on décrira la surface obtenue, la *pseudosphère*, dont on dessinera le profil (une tractrice).
  corrige: |
    **1.** Pour $f$ : $f_{u} = (\cos v, \sin v, \dfrac{1}{u})$, $f_{v} = u(-\sin v, \cos v, 0)$, d'où
    $$(g_{ij}) = \operatorname{diag}\left(1 + \frac{1}{u^{2}}, u^{2}\right) .$$
     Pour l'hélicoïde $g$, $(g_{ij}) = \operatorname{diag}(1, 1 + u^{2})$. Un calcul analogue à celui de l'exercice 9 (vérifié aussi par calcul formel) donne dans les deux cas 
    $$K(u, v) = -\frac{1}{(1 + u^{2})^{2}} .$$
     L'application $f(u, v) \mapsto g(u, v)$ conserve donc la courbure de Gauss, mais pas la première forme fondamentale : elle ne conserve pas les longueurs (par exemple $f_{v}$ et $g_{v}$ n'ont pas la même norme).

    **2.** $\phi_{\theta} = g(-\sin\theta, \cos\theta, 0)$, $\phi_{t} = (g'\cos\theta, g'\sin\theta, h')$ : $E = g^{2}$, $F = 0$, $G = g'^{2} + h'^{2} = 1$. Le produit vectoriel vaut $g(h'\cos\theta, h'\sin\theta, -g')$, d'où $V = (h'\cos\theta, h'\sin\theta, -g')$. Avec $\phi_{\theta\theta} = -g(\cos\theta, \sin\theta, 0)$, $\phi_{\theta t} \perp V$ et $\phi_{tt} = (g''\cos\theta, g''\sin\theta, h'')$ : $h_{11} = -gh'$, $h_{12} = 0$, $h_{22} = h'g'' - g'h''$.

    En dérivant $g'^{2} + h'^{2} = 1$, $g'g'' = -h'h''$, d'où $h'(h'g'' - g'h'') = h'^{2}g'' + g'^{2}g'' = g''$, et 
    $$K = \frac{h_{11}h_{22}}{EG} = \frac{-gh'(h'g'' - g'h'')}{g^{2}} = \boxed{-\frac{g''}{g}} .$$

    **3.** $K = 1$ : $g'' + g = 0$, $g(t) = c\cos t$ (à translation de $t$ près), avec $|g'| \leq 1$. Pour $c = 1$, $h = \sin t$ et l'on retrouve la *sphère unité* ; pour $c < 1$, on obtient des surfaces en fuseau, pour $c > 1$ des tonneaux limités en hauteur, toutes de courbure $1$. $K = -1$ : $g'' = g$. Avec $g(t) = \mathrm{e}^{-t}$, $t > 0$, on a $h'(t) = \sqrt{1 - \mathrm{e}^{-2t}}$, et le profil $t \mapsto (\mathrm{e}^{-t}, h(t))$ est une *tractrice* : la longueur du segment de tangente entre le point et l'axe vaut toujours $1$. La *pseudosphère* est une trompette infinie qui s'effile le long de l'axe, d'aire finie
    $$2\pi\int_{0}^{+\infty}\mathrm{e}^{-t}\,\mathrm{d} t = 2\pi ,$$
     comme une demi-sphère unité.

    ![Figure](documents/figures/715eb99a579e0de4.svg)

    Le profil de la pseudosphère, la tractrice $(\pm\mathrm{e}^{-t}, h(t))$ (en bleu) : en chaque point, le segment de tangente qui rejoint l'axe (en orange, au point $t = 1$) a pour longueur $1$. Le bord $t = 0$, cercle de rayon $1$, est une arête singulière.
- id: "l3-gd-03-11"
  feuille: "f-l3-gd-03"
  numero: 11
  partie: "Problèmes"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [courbures]
  noeuds: [sf-courbures, sf-gauss]
  notions: [courbure-gauss, courbures-principales]
  source: "examen du 25/04/2016, exercice 3, questions 3 à 7"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **Surfaces de révolution localement plates.** Soit $\rho : [-1, 1] \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ et strictement positive, $f(\theta, z) = (\rho(z)\cos\theta, \rho(z)\sin\theta, z)$ et $S = f(\mathbb{R} \times \, ]{-1}, 1[)$, qui est une surface (feuille 2, exercice 13). On admet que $f$ restreinte à $U_{\theta_{0}} = \, ]\theta_{0}, \theta_{0} + 2\pi[ \times \, ]{-1}, 1[$ est une paramétrisation de $S$ pour tout $\theta_{0}$.

    **1.** Calculer la première forme fondamentale de $S$ dans $(U_{\theta_{0}}, f)$.

    **2.** En déduire que l'aire de $S$ vaut $2\pi\mathop{\displaystyle \int_{-1}^{1}}\rho(t)\sqrt{1 + \rho'(t)^{2}}\,\mathrm{d} t$.

    **3.** Calculer l'endomorphisme de Weingarten de $S$.

    **4.** En déduire que la courbure de Gauss est nulle si et seulement si $\rho'' = 0$.

    **5.** On suppose que $\rho'' = 0$, c'est-à-dire $\rho(z) = az + b$ pour des réels $a$, $b$.

    **(a)** Dessiner $S$, en distinguant les cas $a = 0$ et $a \neq 0$.

    **(b)** On suppose $a \neq 0$ et l'on effectue le changement de variable local 
    $$(\theta, z) = \phi(\beta, r) = \left(\frac{\sqrt{1 + a^{2}}}{a}\beta, \ \frac{1}{a}\left[\frac{a}{\sqrt{1 + a^{2}}}r - b\right]\right) .$$
     Montrer que la première forme fondamentale de $S$ pour la paramétrisation locale $f \circ \phi$ est $\begin{pmatrix} r^{2} & 0 \\ 0 & 1 \end{pmatrix}$.

    **(c)** On effectue un nouveau changement de variable $(\beta, r) = \psi(x, y)$, avec $x = r\cos\beta$ et $y = r\sin\beta$. Montrer que la première forme fondamentale de $S$ pour $f \circ \phi \circ \psi$ est $I_{2}$.

    **(d)** Que peut-on en conclure quant à la géométrie de $S$ ? Interpréter en « déroulant » le cône sur un plan.
  corrige: |
    **1.** $f_{\theta} = \rho(-\sin\theta, \cos\theta, 0)$, $f_{z} = (\rho'\cos\theta, \rho'\sin\theta, 1)$, orthogonaux :
    $$\boxed{(g_{ij}) = \begin{pmatrix} \rho^{2} & 0 \\ 0 & 1 + \rho'^{2} \end{pmatrix}} .$$

    **2.** $\sqrt{EG - F^{2}} = \rho\sqrt{1 + \rho'^{2}}$, et le méridien retiré est d'aire nulle : l'aire vaut
    $$\int_{\theta_{0}}^{\theta_{0} + 2\pi}\int_{-1}^{1}\rho(z)\sqrt{1 + \rho'(z)^{2}}\,\mathrm{d} z\,\mathrm{d}\theta = 2\pi\int_{-1}^{1}\rho(t)\sqrt{1 + \rho'(t)^{2}}\,\mathrm{d} t .$$

    **3.** On a
    $$V = \frac{(\cos\theta, \sin\theta, -\rho')}{\sqrt{1 + \rho'^{2}}} ,$$

    $$h_{11} = \langle V, f_{\theta\theta} \rangle = -\frac{\rho}{\sqrt{1 + \rho'^{2}}} ,$$
     $h_{12} = 0$, $h_{22} = \dfrac{\rho''}{\sqrt{1 + \rho'^{2}}}$, d'où 
    $$(W) = (g_{ij})^{-1}(h_{ij}) = \begin{pmatrix} -\frac{1}{\rho\sqrt{1 + \rho'^{2}}} & 0 \\ 0 & \frac{\rho''}{(1 + \rho'^{2})^{3/2}} \end{pmatrix} .$$
     Les directions principales sont celles des parallèles et des méridiens.

    **4.** On a
    $$K = \det W = -\frac{\rho''}{\rho(1 + \rho'^{2})^{2}} ,$$
     nulle si et seulement si $\boxed{\rho'' = 0}$ : on retrouve l'exercice 10 sous une autre paramétrisation du profil.

    **5.** (a) Pour $a = 0$, $S$ est un morceau du *cylindre* de rayon $b$ ; pour $a \neq 0$, un tronc de *cône* de sommet $(0, 0, -\dfrac{b}{a})$, situé hors de $S$ puisque $\rho > 0$ sur $[-1, 1]$.

    (b) $\phi$ a pour jacobienne $\operatorname{diag}\left(\dfrac{\sqrt{1 + a^{2}}}{a}, \dfrac{1}{\sqrt{1 + a^{2}}}\right)$, et
    $$\rho(z) = az + b = \frac{ar}{\sqrt{1 + a^{2}}} .$$
     Par l'exercice 2, 
    $$(g_{ij})_{f \circ \phi} = \begin{pmatrix} \frac{a^{2}r^{2}}{1 + a^{2}}\cdot\frac{1 + a^{2}}{a^{2}} & 0 \\ 0 & (1 + a^{2})\cdot\frac{1}{1 + a^{2}} \end{pmatrix} = \boxed{\begin{pmatrix} r^{2} & 0 \\ 0 & 1 \end{pmatrix}} .$$
     La variable $r$ est la distance au sommet du cône mesurée le long d'une génératrice, et $\beta$ l'angle du cône déroulé.

    (c) C'est la question 3 de l'exercice 2 lue à l'envers : en coordonnées polaires $(r, \beta)$, la métrique $\mathrm{d} r^{2} + r^{2}\mathrm{d}\beta^{2}$ est celle du plan, donc $\boxed{(g_{ij})_{f \circ \phi \circ \psi} = I_{2}}$.

    (d) Au voisinage de chaque point, $S$ admet une paramétrisation de même première forme fondamentale que le plan : les longueurs, les angles et les aires s'y mesurent comme dans le plan. On dira au chapitre 4 que *$S$ est localement isométrique au plan*. Concrètement, on découpe le cône le long d'une génératrice et on le déroule à plat, sans le déchirer ni l'étirer : $\beta$ décrit un intervalle de longueur $\dfrac{2\pi a}{\sqrt{1 + a^{2}}} < 2\pi$, et le tronc de cône devient un secteur de couronne. Pour le cylindre ($a = 0$), la paramétrisation $(\theta, z) \mapsto (b\theta, z)$ suffit.

    ![Figure](documents/figures/fe8d0359f99061fa.svg)

    Le tronc de cône $\rho = \dfrac{z}{2} + 1$, $z \in \, ]{-1}, 1[$, déroulé sur le plan : un secteur de couronne d'angle $\dfrac{2\pi}{\sqrt{5}} \approx 161^{\circ}$, de rayons $\dfrac{\sqrt{5}}{2}$ et $\dfrac{3\sqrt{5}}{2}$ (les longueurs des génératrices jusqu'au sommet). Les deux bords rectilignes du secteur se recollent sur le cône.
