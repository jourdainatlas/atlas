  enonce: |
    **Surfaces dont tous les points sont des ombilics.** Soit $S$ une surface connexe de $\mathbb{R}^{3}$, de classe $\mathcal{C}^{3}$, dont tous les points sont des *ombilics*, c'est-à-dire tels que les deux courbures principales y soient égales. On va montrer que $S$ est une portion de plan ou de sphère.

    **1.** Soit $\phi$ une paramétrisation de $S$ par des variables $(u, v)$ sur un ouvert connexe. Montrer que l'endomorphisme de Weingarten a pour matrice $\lambda I_{2}$ dans la base $(\phi_{u}, \phi_{v})$, où $\lambda$ est une fonction continue, et que $V_{u} = -\lambda\phi_{u}$, $V_{v} = -\lambda\phi_{v}$.

    **2.** En dérivant ces relations, montrer que $\lambda_{u}\phi_{v} = \lambda_{v}\phi_{u}$, puis que $\lambda$ est constante. En déduire que la courbure de Gauss est constante sur $S$.

    **3.** On suppose cette constante nulle. Montrer que $V$ est constant, puis que la surface est incluse dans un plan.

    **4.** Si la constante $K$ n'est pas nulle, montrer que $\phi + \dfrac{1}{\lambda}V$ est constant, et que la surface est incluse dans une sphère de rayon $\dfrac{1}{\sqrt{K}}$.
  corrige: |
    **1.** En chaque point, $W$ est un endomorphisme symétrique (prop. 5) dont les deux valeurs propres sont égales : $W = \lambda\,\mathrm{id}$, avec $\lambda = H$, fonction continue (et même de classe $\mathcal{C}^{1}$, $\phi$ étant de classe $\mathcal{C}^{3}$). Comme $W = -dN$, $V_{u} = dN(\phi_{u}) = -\lambda\phi_{u}$ et $V_{v} = -\lambda\phi_{v}$.

    **2.** En dérivant, $V_{uv} = -\lambda_{v}\phi_{u} - \lambda\phi_{uv}$ et $V_{vu} = -\lambda_{u}\phi_{v} - \lambda\phi_{vu}$. Par le lemme de Schwarz, ces deux quantités sont égales, d'où $\lambda_{v}\phi_{u} = \lambda_{u}\phi_{v}$. Les vecteurs $\phi_{u}$ et $\phi_{v}$ étant indépendants, $\lambda_{u} = \lambda_{v} = 0$ : $\lambda$ est constante sur l'ouvert connexe de paramétrisation. La fonction $H$ est donc localement constante sur $S$, connexe : elle est constante, et $K = \lambda^{2}$ aussi.

    **3.** Si $K = 0$, $\lambda = 0$ et $V_{u} = V_{v} = 0$ : $N$ est localement constante, donc constante sur $S$ connexe, égale à $n$. Alors $p \mapsto \langle p, n \rangle$ a une différentielle nulle le long de $S$ ($\langle \phi_{u}, n \rangle = \langle \phi_{v}, n \rangle = 0$), donc est constante : *$S$ est contenue dans un plan orthogonal à $n$.*

    **4.** Si $K \neq 0$, posons $c = \phi + \dfrac{1}{\lambda}V$ :
    $$c_{u} = \phi_{u} + \frac{1}{\lambda}V_{u} = \phi_{u} - \phi_{u} = 0 ,$$
     et de même $c_{v} = 0$. Le point $p + \dfrac{1}{\lambda}N(p)$ est localement constant sur $S$, donc constant, égal à $c$, et
    $$\lVert p - c \rVert = \frac{1}{|\lambda|} = \frac{1}{\sqrt{K}} :$$
     *$S$ est contenue dans la sphère de centre $c$ et de rayon $\dfrac{1}{\sqrt{K}}$.* Les seules surfaces connexes « également courbées dans toutes les directions » en chaque point sont donc les morceaux de plans et de sphères.

