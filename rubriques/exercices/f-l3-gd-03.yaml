  enonce: |
    **Le cylindre.** On paramètre le cylindre par $f(\theta, z) = (\cos\theta, \sin\theta, z)$.

    **1.** Calculer la première forme fondamentale associée à ce paramétrage.

    **2.** Expliciter $V = N \circ f$, puis $V_{\theta}$ et $V_{z}$, et en déduire la matrice de l'endomorphisme de Weingarten dans la base $(f_{\theta}, f_{z})$.

    **3.** En déduire la courbure de Gauss, la courbure moyenne et les directions principales en tout point, puis la matrice de la seconde forme fondamentale.

    **4.** Interpréter les courbures principales à l'aide des sections normales du cylindre par les plans contenant la normale.
  corrige: |
    **1.** $f_{\theta} = (-\sin\theta, \cos\theta, 0)$ et $f_{z} = (0, 0, 1)$ sont orthonormés : $\boxed{(g_{ij}) = I_{2}}$.

    **2.** $V = f_{\theta} \wedge f_{z} = (\cos\theta, \sin\theta, 0)$, la normale sortante. Alors $V_{\theta} = (-\sin\theta, \cos\theta, 0) = f_{\theta}$ et $V_{z} = 0$. Comme $W = -dN$, $W(f_{\theta}) = -f_{\theta}$ et $W(f_{z}) = 0$ :
    $$\boxed{(W) = \begin{pmatrix} -1 & 0 \\ 0 & 0 \end{pmatrix}} .$$

    **3.** $K = 0$, $H = -\dfrac{1}{2}$ ; les directions principales sont celles de $f_{\theta}$ (horizontale, courbure principale $-1$) et de $f_{z}$ (verticale, courbure $0$). Par la proposition 9,
    $$(h_{ij}) = (g_{ij})(W) = \begin{pmatrix} -1 & 0 \\ 0 & 0 \end{pmatrix} .$$
     On retrouve la ligne du tableau bilan du cours.

    **4.** La section normale par le plan horizontal est le cercle unité, qui tourne en s'éloignant de la normale sortante : courbure normale $-1$, par la proposition 6. La section par le plan vertical est une génératrice, droite de courbure $0$. Par la formule d'Euler, les autres sections normales, des ellipses, ont des courbures comprises entre $-1$ et $0$. Le signe dépend du choix de la normale : avec la normale rentrante, on trouverait $+1$ et $0$, et $K$, produit des deux, ne change pas.
- id: "l3-gd-03-07"
  feuille: "f-l3-gd-03"
  numero: 7
  partie: "Seconde forme fondamentale, courbures"
  etoiles: 1
  types: [Démonstration]
