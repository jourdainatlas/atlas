  enonce: |
    **Changement de paramétrisation.** Soit $f : U \to \Sigma$ une paramétrisation, $G = (g_{ij})$ sa première forme fondamentale, et $\phi : U' \to U$ un difféomorphisme.

    **1.** Montrer que la première forme fondamentale de $f \circ \phi$ est donnée en $x \in U'$ par la matrice ${(J_{x}\phi)}^{T}\,G_{\phi(x)}\,J_{x}\phi$.

    **2.** Retrouver ainsi le résultat de la question 5 de l'exercice 1, et montrer que l'aire ne dépend pas de la paramétrisation choisie.

    **3.** Exprimer la première forme fondamentale du plan $f(x, y) = (x, y, 0)$ en coordonnées polaires $(r, \theta)$, et retrouver l'aire d'un disque.
  corrige: |
    **1.** Par la règle de dérivation des composées, $J_{x}(f \circ \phi) = J_{\phi(x)}f\,J_{x}\phi$, et la proposition 2 donne 
    $${(J_{x}(f \circ \phi))}^{T}J_{x}(f \circ \phi) = {(J_{x}\phi)}^{T}\,{(J_{\phi(x)}f)}^{T}J_{\phi(x)}f\,J_{x}\phi = \boxed{{(J_{x}\phi)}^{T}\,G_{\phi(x)}\,J_{x}\phi} .$$

    **2.** C'est le calcul de l'exercice 1, question 5. En prenant les déterminants,
    $$\sqrt{\det(g_{ij})_{f \circ \phi}} = |\det J_{x}\phi|\sqrt{\det G_{\phi(x)}} ,$$
     et la formule de changement de variables dans les intégrales doubles donne l'égalité des deux intégrales d'aire : c'est la proposition 4.

    **3.** Pour $(x, y) = (r\cos\theta, r\sin\theta)$,
    $$J\phi = \begin{pmatrix} \cos\theta & -r\sin\theta \\ \sin\theta & r\cos\theta \end{pmatrix}$$
     et $G = I_{2}$, d'où $\boxed{\begin{pmatrix} 1 & 0 \\ 0 & r^{2} \end{pmatrix}}$ : c'est l'écriture $\mathrm{d} r^{2} + r^{2}\,\mathrm{d}\theta^{2}$ de la métrique du plan. L'aire du disque de rayon $\rho_{0}$ vaut
    $$\int_{0}^{2\pi}\int_{0}^{\rho_{0}}r\,\mathrm{d} r\,\mathrm{d}\theta = \pi\rho_{0}^{2} .$$
- id: "l3-gd-03-03"
