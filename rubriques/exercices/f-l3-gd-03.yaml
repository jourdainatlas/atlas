  enonce: |
    **De la caténoïde à l'hélicoïde.** On considère, pour $(u, v) \in U = \mathbb{R} \times \, ]0, 2\pi[$, 
    $$X_{0}(u, v) = (\operatorname{ch}u\cos v, \operatorname{ch}u\sin v, u), \qquad Y(u, v) = (u\cos v, u\sin v, v) .$$

    **1.** Prouver que $X_{0}(U)$ et $Y(U)$ sont des surfaces de $\mathbb{R}^{3}$. Sont-elles de révolution autour de l'axe $Oz$ ? L'image de $X_{0}$ s'appelle la *caténoïde*, celle de $Y$ l'*hélicoïde*.

    **2.** On les déforme continûment en posant, pour $t \in [0, \dfrac{\pi}{2}]$, 
    $$X_{t}(u, v) = \cos t\,X_{0}(u, v + t) + \sin t\,Y\left(\operatorname{sh}u, v + t - \frac{\pi}{2}\right) .$$
     Vérifier que $X_{\pi/2}$ et $Y$ ont la même image, au paramétrage près.

    **3.** Montrer que, pour tout $t \in [0, \dfrac{\pi}{2}]$, $X_{t}$ est une immersion.

    **4.** Montrer que la première forme fondamentale de $X_{t}$ ne dépend pas de $t$. Qu'en déduit-on sur les longueurs des courbes de la caténoïde et de l'hélicoïde qui se correspondent ? Le chapitre 4 dira que ces surfaces sont *localement isométriques*.
  corrige: |
    **1.** La caténoïde est l'ensemble $x^{2} + y^{2} = \operatorname{ch}^{2}z$, de gradient $(2x, 2y, -2\operatorname{ch}z\operatorname{sh}z)$ non nul puisque $(x, y) \neq 0$ : c'est une surface, et $X_{0}$ en est une paramétrisation sur le complémentaire d'un méridien. Elle est *de révolution* autour de $Oz$, engendrée par la chaînette $x = \operatorname{ch}z$. $Y(U)$ est un morceau de l'hélicoïde (feuille 2, exercice 14), qui *n'est pas de révolution* : il contient l'axe $\{x = y = 0, 0 < z < 2\pi\}$ et la rotation d'angle $\dfrac{\pi}{2}$ ne le conserve pas.

    **2.** Pour $t = \dfrac{\pi}{2}$, $X_{\pi/2}(u, v) = Y(\operatorname{sh}u, v)$, et $u \mapsto \operatorname{sh}u$ est un difféomorphisme de $\mathbb{R}$ : $X_{\pi/2}$ et $Y$ paramètrent la même surface.

    **3.** Posons $s = v + t$,
    $$A = \partial_{u}X_{0} = (\operatorname{sh}u\cos s, \operatorname{sh}u\sin s, 1)$$
     et $B = \partial_{v}X_{0} = \operatorname{ch}u(-\sin s, \cos s, 0)$. On calcule
    $$Y(\operatorname{sh}u, s - \frac{\pi}{2}) = (\operatorname{sh}u\sin s, -\operatorname{sh}u\cos s, s - \frac{\pi}{2}) ,$$
     dont les dérivées par rapport à $u$ et $v$ sont $-B$ et $A$. Donc 
    $$\partial_{u}X_{t} = \cos t\,A - \sin t\,B, \qquad \partial_{v}X_{t} = \cos t\,B + \sin t\,A .$$
     Or $\langle A, B \rangle = 0$ et $\lVert A \rVert^{2} = \lVert B \rVert^{2} = \operatorname{ch}^{2}u$.

    On en tire $E = G = \operatorname{ch}^{2}u$ et $F = \cos t\sin t(\lVert A \rVert^{2} - \lVert B \rVert^{2}) = 0$ : 
    $$(g_{ij})_{X_{t}} = \boxed{\operatorname{ch}^{2}u\;I_{2}} ,$$
     de déterminant non nul : *chaque $X_{t}$ est une immersion*.

    **4.** D'après le calcul précédent, la première forme fondamentale de $X_{t}$ ne dépend pas de $t$. Deux courbes $X_{0}(\gamma)$ et $X_{\pi/2}(\gamma)$, images d'une même courbe $\gamma$ de $U$, ont la même longueur
    $$\int\operatorname{ch}u\sqrt{u'^{2} + v'^{2}} :$$
     on peut déformer la caténoïde en l'hélicoïde sans étirer ni contracter aucune courbe. Les parallèles de la caténoïde deviennent les droites de l'hélicoïde, et ses méridiens (des chaînettes) les hélices.

    ![Figure](documents/figures/292ac935c3667684.svg)

    La surface $X_{t}(U)$ pour $(u, v) \in [-1, 1] \times [0, 2\pi]$ et $t = 0$, $\dfrac{\pi}{4}$, $\dfrac{\pi}{2}$ (de gauche à droite) : la caténoïde se fend le long d'un méridien et s'enroule en hélicoïde. Les courbes $u = \pm 1$ (traits épais) gardent la même longueur tout au long de la déformation.
