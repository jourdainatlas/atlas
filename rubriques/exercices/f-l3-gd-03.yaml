  enonce: |
    **Aires : graphes, triangles sphériques.**

    **1.** Soit $\varphi : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ et $S$ la surface d'équation $z = \varphi(x, y)$. Montrer que l'aire d'un compact $R \subset S$ vaut $\mathop{\displaystyle \iint_{Q}}\sqrt{1 + \varphi_{x}^{2} + \varphi_{y}^{2}}\,\mathrm{d} x\,\mathrm{d} y$, où $Q$ est la projection orthogonale de $R$ sur le plan $z = 0$. Application : aire de la calotte $\{x^{2} + y^{2} + z^{2} = 1, \ z \geq h\}$, pour $0 < h < 1$.

    **2.** Soit $F$ une isométrie linéaire de $\mathbb{R}^{3}$ et $D$ un compact de $\mathbb{S}^{2}$. Montrer que $F(D)$ a la même aire que $D$.

    **3.** Calculer l'aire d'un fuseau, portion de sphère comprise entre deux demi-méridiens faisant l'angle $\alpha \in \, ]0, \pi[$.

    **4.** Un triangle sphérique est la partie de $\mathbb{S}^{2}$ délimitée par trois arcs de grands cercles ; on note $\alpha$, $\beta$, $\gamma$ ses angles. En prolongeant les côtés en grands cercles, montrer que les trois fuseaux d'angles $\alpha$, $\beta$, $\gamma$ contenant le triangle, et leurs images par la symétrie $x \mapsto -x$, recouvrent la sphère, le triangle et son symétrique étant recouverts trois fois, et le reste une fois. En déduire la formule de Girard : l'aire du triangle vaut $\alpha + \beta + \gamma - \pi$.
  corrige: |
    **1.** Avec $f(x, y) = (x, y, \varphi(x, y))$, $E = 1 + \varphi_{x}^{2}$, $F = \varphi_{x}\varphi_{y}$, $G = 1 + \varphi_{y}^{2}$ et $EG - F^{2} = 1 + \varphi_{x}^{2} + \varphi_{y}^{2}$, d'où la formule, puisque $f^{-1}(R) = Q$. Pour la calotte, $\varphi = \sqrt{1 - x^{2} - y^{2}}$ sur le disque de rayon $\sqrt{1 - h^{2}}$,
    $$1 + \varphi_{x}^{2} + \varphi_{y}^{2} = \frac{1}{1 - \rho^{2}}$$
     en coordonnées polaires, et l'aire vaut 
    $$2\pi\int_{0}^{\sqrt{1 - h^{2}}}\frac{\rho\,\mathrm{d}\rho}{\sqrt{1 - \rho^{2}}} = 2\pi\left[-\sqrt{1 - \rho^{2}}\right]_{0}^{\sqrt{1 - h^{2}}} = \boxed{2\pi(1 - h)} .$$
     L'aire est proportionnelle à la hauteur $1 - h$ de la calotte : c'est le théorème d'Archimède sur la sphère et le cylindre circonscrit.

    **2.** Si $f$ paramètre un voisinage de $D$, $F \circ f$ paramètre un voisinage de $F(D)$, et $(F \circ f)_{u} = F(f_{u})$, $(F \circ f)_{v} = F(f_{v})$. Comme $F$ conserve le produit scalaire, les deux premières formes sont égales, donc les aires aussi (en découpant $D$ en morceaux paramétrés).

    **3.** Par la question 2, on peut placer le fuseau entre les demi-méridiens $\theta = 0$ et $\theta = \alpha$ ; son aire vaut
    $$\int_{0}^{\alpha}\int_{-\pi/2}^{\pi/2}\cos\psi\,\mathrm{d}\psi\,\mathrm{d}\theta = \boxed{2\alpha} .$$

    **4.** Les trois grands cercles qui portent les côtés découpent la sphère en huit triangles : $T$, son symétrique $T' = -T$, et six autres. Le fuseau $A$ d'angle $\alpha$ de sommet le sommet correspondant de $T$ est la réunion de $T$ et du triangle adjacent à $T$ par le côté opposé ; de même pour $B$ et $C$. Leurs symétriques $A'$, $B'$, $C'$ contiennent $T'$. On vérifie que les six triangles autres que $T$ et $T'$ sont chacun dans exactement un de ces six fuseaux.

    En additionnant les aires, 
    $$2(2\alpha + 2\beta + 2\gamma) = 4\pi + 2\mathcal{A}(T) + 2\mathcal{A}(T') = 4\pi + 4\mathcal{A}(T) , \qquad\text{d'où}\qquad \boxed{\mathcal{A}(T) = \alpha + \beta + \gamma - \pi} .$$
     La somme des angles d'un triangle sphérique dépasse $\pi$, d'autant plus que le triangle est grand : l'excès mesure l'aire.

    ![Figure](documents/figures/b5dabfe742b028d1.svg)

    Le triangle sphérique de l'octant $x, y, z \geq 0$ (en rouge), dont les trois angles sont droits. La formule de Girard donne l'aire $\dfrac{3\pi}{2} - \pi = \dfrac{\pi}{2}$, qui est bien le huitième de $4\pi$.
