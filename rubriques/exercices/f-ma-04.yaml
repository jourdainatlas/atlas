  enonce: |
    Déterminer les réels $m$ tels que l'équation $z^{3} + (3 + \mathrm{i})z^{2} - 3z - (m + \mathrm{i}) = 0$ admette au moins une solution réelle, et préciser alors cette solution.
  corrige: |
    Pour $x$ réel, $x^{3} + (3 + \mathrm{i})x^{2} - 3x - (m + \mathrm{i}) = (x^{3} + 3x^{2} - 3x - m) + \mathrm{i}(x^{2} - 1)$. Une solution réelle vérifie donc $x^{2} = 1$, puis $m = x^{3} + 3x^{2} - 3x$ : pour $x = 1$, $m = 1$ ; pour $x = -1$, $m = 5$. 
    $$\boxed{m = 1, \text{ solution réelle } x = 1 \qquad\text{ou}\qquad m = 5, \text{ solution réelle } x = -1}$$
- id: "ma-04-36"
  feuille: "f-ma-04"
  numero: 36
  partie: "Équations algébriques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations algébriques]
  noeuds: [c-racines-carrees]
  notions: [nombre-complexe]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Soit $z \in \mathbb{C} \setminus \mathbb{R}$. Trouver deux réels $p$ et $q$ tels que $z^{2} + pz + q = 0$. Sont-ils uniques ?

    **2.** Soit $p$ et $q$ deux complexes, avec $q \neq 0$, et $z_{1}$, $z_{2}$ les solutions, éventuellement confondues, de l'équation $z^{2} - pz + q^{2} = 0$. On suppose que $|z_{1}| = |z_{2}|$. Exprimer $\dfrac{p^{2}}{q^{2}}$ en fonction de $\dfrac{z_{1}}{z_{2}}$, et en déduire que $\dfrac{p}{q}$ est réel.
  corrige: |
    **1.** Le nombre $z$ est racine de $(X - z)(X - \overline{z}) = X^{2} - 2\operatorname{Re}(z)X + |z|^{2}$ : $\boxed{p = -2\operatorname{Re} z, \ q = |z|^{2}}$. Ils sont uniques : si $z^{2} + p'z + q' = 0$ avec $p'$, $q'$ réels, la différence donne $(p - p')z = q' - q$, et comme $z$ n'est pas réel, $p = p'$, puis $q = q'$.

    **2.** On a $z_{1} + z_{2} = p$ et $z_{1}z_{2} = q^{2} \neq 0$. Posons $u = \frac{z_{1}}{z_{2}}$, qui appartient à $\mathbb{U}$ puisque $|z_{1}| = |z_{2}|$ ; alors $\frac{z_{2}}{z_{1}} = \overline{u}$, et 
    $$\frac{p^{2}}{q^{2}} = \frac{(z_{1} + z_{2})^{2}}{z_{1}z_{2}} = \frac{z_{1}}{z_{2}} + 2 + \frac{z_{2}}{z_{1}} = \boxed{2 + u + \overline{u} = 2 + 2\operatorname{Re} u}.$$
     Ce nombre est un réel positif, puisque $\operatorname{Re} u \geqslant -1$. Un complexe dont le carré est un réel positif $r$ est l'une des deux racines carrées de $r$, $\pm\sqrt{r}$, donc il est réel : $\boxed{\frac{p}{q} \in \mathbb{R}}$
- id: "ma-04-37"
  feuille: "f-ma-04"
  numero: 37
  partie: "Équations algébriques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations algébriques, "racines de l'unité"]
  noeuds: [c-racines-carrees, cx-exponentielle]
  notions: [nombre-complexe]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    L'introduction du cours rapporte le calcul de Bombelli, $(2 + \mathrm{i})^{3} = 2 + 11\mathrm{i}$.

    **1.** Vérifier ce calcul, puis factoriser $z^{3} - (2 + 11\mathrm{i})$ par $z - (2 + \mathrm{i})$, et résoudre l'équation $z^{3} = 2 + 11\mathrm{i}$.

    **2.** Vérifier que les trois solutions s'obtiennent en multipliant $2 + \mathrm{i}$ par les trois racines cubiques de l'unité, ce que la partie suivante expliquera.
  corrige: |
    **1.** $(2 + \mathrm{i})^{3} = 8 + 12\mathrm{i} - 6 - \mathrm{i} = 2 + 11\mathrm{i}$ ✓. La factorisation de $a^{3} - b^{3}$ donne, avec $(2 + \mathrm{i})^{2} = 3 + 4\mathrm{i}$, 
    $$z^{3} - (2 + 11\mathrm{i}) = \big(z - (2 + \mathrm{i})\big)\big(z^{2} + (2 + \mathrm{i})z + 3 + 4\mathrm{i}\big).$$
     Le discriminant du trinôme vaut $(2 + \mathrm{i})^{2} - 4(2 + \mathrm{i})^{2} = -3(2 + \mathrm{i})^{2} = \big(\mathrm{i}\sqrt{3}(2 + \mathrm{i})\big)^{2}$, d'où $z = (2 + \mathrm{i})\,\frac{-1 \pm \mathrm{i}\sqrt{3}}{2}$. 
    $$\boxed{z \in \Big\{2 + \mathrm{i},\ \ -1 - \frac{\sqrt{3}}{2} + \mathrm{i}\Big(\sqrt{3} - \frac{1}{2}\Big),\ \ -1 + \frac{\sqrt{3}}{2} - \mathrm{i}\Big(\sqrt{3} + \frac{1}{2}\Big)\Big\}}$$

    **2.** Le calcul précédent montre directement que les deux autres solutions sont $(2 + \mathrm{i})j$ et $(2 + \mathrm{i})j^{2}$, où $j = \frac{-1 + \mathrm{i}\sqrt{3}}{2}$ : c'est la proposition 22 du cours, puisque les racines cubiques de $1$ sont $1$, $j$, $j^{2}$. Bombelli, qui ne connaissait que la solution $2 + \mathrm{i}$, n'en voyait qu'une sur trois.
