  enonce: |
    Résoudre dans $\mathbb{C}$ les équations suivantes, et représenter les solutions des deux premières dans le plan complexe.

    **(a)** $z^{3} = 1 - \mathrm{i}\sqrt{3}$

    **(b)** $z^{6} = \dfrac{-4}{1 + \mathrm{i}\sqrt{3}}$

    **(c)** $z^{8} = \dfrac{1 + \mathrm{i}}{\sqrt{3} - \mathrm{i}}$

    **(d)** $z^{4} = -7 + 24\mathrm{i}$, sous forme algébrique
  corrige: |
    On met le second membre sous forme trigonométrique $r\,\mathrm{e}^{\mathrm{i}\theta}$, puis l'on applique la proposition 22 du cours : les solutions sont les $r^{1/n}\,\mathrm{e}^{\mathrm{i}(\theta + 2k\pi)/n}$, $k \in [\![0\,;n-1]\!]$.

    • **(a)** $1 - \mathrm{i}\sqrt{3} = 2\,\mathrm{e}^{-\mathrm{i}\pi/3}$ : $\boxed{z = 2^{1/3}\,\mathrm{e}^{\mathrm{i}(-\pi/9 + 2k\pi/3)},\ k \in \{0, 1, 2\}}$

    • **(b)** $\dfrac{-4}{2\,\mathrm{e}^{\mathrm{i}\pi/3}} = -2\,\mathrm{e}^{-\mathrm{i}\pi/3} = 2\,\mathrm{e}^{2\mathrm{i}\pi/3}$ : $\boxed{z = 2^{1/6}\,\mathrm{e}^{\mathrm{i}(\pi/9 + k\pi/3)},\ k \in [\![0\,;5]\!]}$

    • **(c)** $\dfrac{\sqrt{2}\,\mathrm{e}^{\mathrm{i}\pi/4}}{2\,\mathrm{e}^{-\mathrm{i}\pi/6}} = 2^{-1/2}\,\mathrm{e}^{5\mathrm{i}\pi/12}$ : $\boxed{z = 2^{-1/16}\,\mathrm{e}^{\mathrm{i}(5\pi/96 + k\pi/4)},\ k \in [\![0\,;7]\!]}$

    • **(d)** On cherche d'abord $Z = z^{2}$ tel que $Z^{2} = -7 + 24\mathrm{i}$ : $Z = \pm(3 + 4\mathrm{i})$. Les racines carrées de $3 + 4\mathrm{i}$ sont $\pm(2 + \mathrm{i})$, celles de $-3 - 4\mathrm{i}$ sont $\pm(1 - 2\mathrm{i})$. 
    $$\boxed{z \in \{2 + \mathrm{i},\ -2 - \mathrm{i},\ 1 - 2\mathrm{i},\ -1 + 2\mathrm{i}\}}$$
     On constate que $1 - 2\mathrm{i} = -\mathrm{i}(2 + \mathrm{i})$ : les quatre solutions sont les produits de $2 + \mathrm{i}$ par les éléments de $\mathbb{U}_{4}$.

    ![Figure](documents/figures/25b8b8b52404573b.svg)

    ![Figure](documents/figures/a9b0d16452efd1b5.svg)

    Les solutions de (a) forment un triangle équilatéral, celles de (b) un hexagone régulier, inscrits dans les cercles de rayons $2^{1/3} \approx 1{,}26$ et $2^{1/6} \approx 1{,}12$ ; on passe d'une solution à la suivante par une rotation d'angle $\frac{2\pi}{n}$.
- id: "ma-04-39"
  feuille: "f-ma-04"
  numero: 39
  partie: "Racines $n$-ièmes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [racines n-ièmes]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [fonction-tangente]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Résoudre dans $\mathbb{C}$ les équations suivantes, où $n \geqslant 2$ est un entier.

    **(a)** $(z - 1)^{5} = (z + 1)^{5}$

    **(b)** $(z + \mathrm{i})^{n} = (z - \mathrm{i})^{n}$

    **(c)** $27(z - 1)^{6} + (z + 1)^{6} = 0$

    Pour la deuxième, montrer que toutes les solutions sont réelles, et les exprimer à l'aide de la fonction tangente.
  corrige: |
    **(a)** Le réel $z = 1$ n'est pas solution. Pour $z \neq 1$, l'équation s'écrit $w^{5} = 1$ avec $w = \frac{z + 1}{z - 1}$, et $w \neq 1$. Donc $w = \mathrm{e}^{2\mathrm{i} k\pi/5}$ avec $k \in [\![1\,;4]\!]$, et $z = \frac{w + 1}{w - 1}$ ; l'angle moitié donne $\frac{w + 1}{w - 1} = \frac{2\cos(k\pi/5)}{2\mathrm{i}\sin(k\pi/5)}$. 
    $$\boxed{z = -\mathrm{i}\,\frac{\cos(k\pi/5)}{\sin(k\pi/5)},\ k \in [\![1\,;4]\!]}$$
     Ce sont quatre imaginaires purs : l'équation est de degré $4$, puisque les termes en $z^{5}$ se simplifient.

    **(b)** De même, $z = \mathrm{i}$ n'est pas solution, et $w = \frac{z + \mathrm{i}}{z - \mathrm{i}}$ vérifie $w^{n} = 1$, $w \neq 1$, d'où $z = \mathrm{i}\,\frac{w + 1}{w - 1}$. Avec $w = \mathrm{e}^{2\mathrm{i} k\pi/n}$, on obtient 
    $$\boxed{z = \frac{\cos(k\pi/n)}{\sin(k\pi/n)} = \tan\Big(\frac{\pi}{2} - \frac{k\pi}{n}\Big),\ k \in [\![1\,;n-1]\!]}$$
     Toutes les solutions sont réelles, et elles sont distinctes, car la tangente est injective sur $]-\frac{\pi}{2}\,,\frac{\pi}{2}[$.

    **(c)** On a $\big(\frac{z + 1}{z - 1}\big)^{6} = -27 = 27\,\mathrm{e}^{\mathrm{i}\pi}$, donc $w = \frac{z + 1}{z - 1} = \sqrt{3}\,\mathrm{e}^{\mathrm{i}\varphi}$ avec $\varphi = \frac{\pi}{6} + \frac{k\pi}{3}$, $k \in [\![0\,;5]\!]$. Alors 
    $$z = \frac{w + 1}{w - 1} = \frac{(w + 1)(\overline{w} - 1)}{|w - 1|^{2}} = \frac{|w|^{2} - 1 - 2\mathrm{i}\operatorname{Im} w}{|w|^{2} - 2\operatorname{Re} w + 1} = \frac{1 - \mathrm{i}\sqrt{3}\sin\varphi}{2 - \sqrt{3}\cos\varphi},$$
     et les six valeurs de $\varphi$ donnent 
    $$\boxed{z \in \Big\{2 \pm \mathrm{i}\sqrt{3},\ \ \frac{1 \pm \mathrm{i}\sqrt{3}}{2},\ \ \frac{2 \pm \mathrm{i}\sqrt{3}}{7}\Big\}}$$

    *À retenir :* une équation de la forme $A^{n} = B^{n}$, ou $A^{n} = cB^{n}$, se ramène aux racines $n$-ièmes par le quotient $\frac{A}{B}$, après avoir écarté les valeurs qui annulent $B$.
- id: "ma-04-40"
  feuille: "f-ma-04"
  numero: 40
  partie: "Racines $n$-ièmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines n-ièmes]
  noeuds: [cx-exponentielle, cx-pi]
  notions: []
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Résoudre dans $\mathbb{C}$ l'équation $1 + 2z + 2z^{2} + \cdots + 2z^{n-1} + z^{n} = 0$.
  corrige: |
    En regroupant les termes, $1 + 2z + \cdots + 2z^{n-1} + z^{n} = \displaystyle\sum_{k=0}^{n-1} z^{k} + \sum_{k=1}^{n} z^{k} = (1 + z)\sum_{k=0}^{n-1} z^{k}$. Pour $z \neq 1$, la somme géométrique vaut $\frac{1 - z^{n}}{1 - z}$, nulle si et seulement si $z \in \mathbb{U}_{n}$ ; pour $z = 1$, elle vaut $n \neq 0$. 
    $$\boxed{\text{les solutions sont } -1 \text{ et les éléments de } \mathbb{U}_{n} \setminus \{1\}}$$
     Lorsque $n$ est pair, $-1$ appartient à $\mathbb{U}_{n}$ : c'est une racine double, et l'équation a $n - 1$ solutions distinctes ; lorsque $n$ est impair, elle en a $n$.
- id: "ma-04-41"
  feuille: "f-ma-04"
  numero: 41
  partie: "Racines $n$-ièmes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [racines n-ièmes, trigonométrie, équations du second degré]
  noeuds: [cx-exponentielle, cx-pi, c-racines-carrees]
  notions: [pi]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    On pose $\omega = \mathrm{e}^{2\mathrm{i}\pi/5}$.

    **1.** Montrer que $1 + \omega + \omega^{2} + \omega^{3} + \omega^{4} = 0$, et en déduire que $1 + 2\cos\dfrac{2\pi}{5} + 2\cos\dfrac{4\pi}{5} = 0$.

    **2.** En déduire une équation du second degré dont $\cos\dfrac{2\pi}{5}$ est solution, puis la valeur de $\cos\dfrac{2\pi}{5}$.

    **3.** Retrouver ainsi la valeur de $\cos\dfrac{\pi}{5}$ obtenue à l'exercice 11.
  corrige: |
    **1.** La somme des éléments de $\mathbb{U}_{5}$ est nulle (proposition 21 du cours). On prend la partie réelle, et l'on utilise $\cos\frac{8\pi}{5} = \cos\frac{2\pi}{5}$ et $\cos\frac{6\pi}{5} = \cos\frac{4\pi}{5}$, qui résultent de la parité et de la périodicité : 
    $$\boxed{1 + 2\cos\frac{2\pi}{5} + 2\cos\frac{4\pi}{5} = 0}$$

    **2.** Avec $c = \cos\frac{2\pi}{5}$ et $\cos\frac{4\pi}{5} = 2c^{2} - 1$, il vient $4c^{2} + 2c - 1 = 0$, dont les solutions sont $\frac{-1 \pm \sqrt{5}}{4}$. Comme $0 < \frac{2\pi}{5} < \frac{\pi}{2}$, on a $c > 0$. 
    $$\boxed{\cos\frac{2\pi}{5} = \frac{\sqrt{5} - 1}{4}}$$

    **3.** $\cos\frac{\pi}{5} = -\cos\frac{4\pi}{5} = 1 - 2c^{2} = 1 - \frac{3 - \sqrt{5}}{4} = \boxed{\frac{1 + \sqrt{5}}{4}}$, ce qui est la valeur de l'exercice 11 ✓. Les deux méthodes reposent sur la même idée : $\frac{\pi}{5}$ est un diviseur de $\pi$, et l'on exploite une relation algébrique entre ses multiples.
- id: "ma-04-42"
  feuille: "f-ma-04"
  numero: 42
  partie: "Racines $n$-ièmes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [racines n-ièmes, "racines de l'unité", groupe 𝕌]
  noeuds: [cx-exponentielle, cx-pi, c-calcul]
  notions: []
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $n \geqslant 1$ un entier.

    **1.** Calculer le produit des éléments de $\mathbb{U}_{n}$.

    **2.** On note $Q = \{\omega^{2} \mid \omega \in \mathbb{U}_{n}\}$. Montrer que $Q \subset \mathbb{U}_{n}$, puis que $Q = \mathbb{U}_{n}$ si et seulement si $n$ est impair. Lorsque $n$ est pair, décrire $Q$.
  corrige: |
    **1.** Le produit des $\mathrm{e}^{2\mathrm{i} k\pi/n}$ pour $k \in [\![0\,;n-1]\!]$ est l'exponentielle de la somme des arguments, $\frac{2\pi}{n}\cdot\frac{n(n-1)}{2} = (n - 1)\pi$. 
    $$\boxed{\prod_{\omega \in \mathbb{U}_{n}} \omega = \mathrm{e}^{\mathrm{i}(n-1)\pi} = (-1)^{n-1}}$$

    **2.** Si $\omega^{n} = 1$, alors $(\omega^{2})^{n} = (\omega^{n})^{2} = 1$ : $Q \subset \mathbb{U}_{n}$. Considérons l'application $\omega \mapsto \omega^{2}$ de $\mathbb{U}_{n}$ dans $\mathbb{U}_{n}$, d'image $Q$. Si $\omega^{2} = \omega'^{2}$, alors $\omega' = \pm\omega$.

    • Si $n$ est impair, $-\omega \notin \mathbb{U}_{n}$, puisque $(-\omega)^{n} = -1$ ; l'application est donc injective, et, $\mathbb{U}_{n}$ étant fini, elle est bijective d'après le chapitre 2 : $Q = \mathbb{U}_{n}$.

    • Si $n$ est pair, $\omega$ et $-\omega$ appartiennent à $\mathbb{U}_{n}$ et ont le même carré ; l'application n'est pas injective, donc pas surjective, et $Q \neq \mathbb{U}_{n}$. Plus précisément, $Q = \{\mathrm{e}^{4\mathrm{i} k\pi/n}\} = \mathbb{U}_{n/2}$.

    $$\boxed{Q = \mathbb{U}_{n} \iff n \text{ impair} \qquad\text{et}\qquad Q = \mathbb{U}_{n/2} \text{ si } n \text{ est pair}}$$
- id: "ma-04-43"
  feuille: "f-ma-04"
  numero: 43
  partie: "Racines $n$-ièmes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [racines n-ièmes, trigonométrie]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [pi, cosinus-sinus]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    On pose $\omega = \mathrm{e}^{2\mathrm{i}\pi/7}$, $A = \omega + \omega^{2} + \omega^{4}$ et $B = \omega^{3} + \omega^{5} + \omega^{6}$.

    **1.** Calculer $A + B$ et $AB$.

    **2.** Montrer que $\operatorname{Im} A > 0$. *On pourra écrire $\operatorname{Im} A$ à l'aide de sinus d'angles de $]0\,,\pi[$.*

    **3.** En déduire $A$ et $B$, puis la valeur de $\sin\dfrac{2\pi}{7} + \sin\dfrac{4\pi}{7} - \sin\dfrac{6\pi}{7}$.
  corrige: |
    **1.** La somme $A + B$ est celle des éléments de $\mathbb{U}_{7}$ différents de $1$ : $A + B = -1$. En développant le produit et en réduisant les exposants modulo $7$ grâce à $\omega^{7} = 1$, 
    $$AB = \omega^{4} + \omega^{6} + \omega^{7} + \omega^{5} + \omega^{7} + \omega^{8} + \omega^{7} + \omega^{9} + \omega^{10} = 3 + (\omega + \omega^{2} + \cdots + \omega^{6}) = 2.$$

    $$\boxed{A + B = -1 \qquad\text{et}\qquad AB = 2}$$

    **2.** On a $\operatorname{Im} A = \sin\frac{2\pi}{7} + \sin\frac{4\pi}{7} + \sin\frac{8\pi}{7} = \sin\frac{2\pi}{7} + \sin\frac{3\pi}{7} - \sin\frac{\pi}{7}$, en utilisant $\sin(\pi - x) = \sin x$ et $\sin(\pi + x) = -\sin x$. Le sinus étant strictement croissant sur $[0\,,\frac{\pi}{2}]$, $\sin\frac{3\pi}{7} > \sin\frac{\pi}{7}$, et $\sin\frac{2\pi}{7} > 0$ : $\boxed{\operatorname{Im} A > 0}$

    **3.** Les nombres $A$ et $B$ sont les solutions de $z^{2} + z + 2 = 0$, de discriminant $-7$, et $A$ est celle de partie imaginaire positive. 
    $$\boxed{A = \frac{-1 + \mathrm{i}\sqrt{7}}{2} \qquad B = \frac{-1 - \mathrm{i}\sqrt{7}}{2} \qquad \sin\frac{2\pi}{7} + \sin\frac{4\pi}{7} - \sin\frac{6\pi}{7} = \operatorname{Im} A = \frac{\sqrt{7}}{2}}$$
     On a utilisé $\sin\frac{8\pi}{7} = -\sin\frac{\pi}{7} = -\sin\frac{6\pi}{7}$. Ce calcul est un cas particulier des *sommes de Gauss*, qui relient les racines de l'unité à l'arithmétique.
- id: "ma-04-44"
  feuille: "f-ma-04"
  numero: 44
  partie: "Racines $n$-ièmes"
  etoiles: 3
  types: [Calcul]
  mots_cles: [racines n-ièmes, trigonométrie, sommes trigonométriques]
  noeuds: [cx-exponentielle, cx-pi, n-sommes, pol-binome]
  notions: [pi, coefficient-binomial]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $j = \mathrm{e}^{2\mathrm{i}\pi/3}$. On pose 
    $$S_{0} = \sum_{0 \leqslant 3p \leqslant n} \binom{n}{3p}, \qquad S_{1} = \sum_{0 \leqslant 3p + 1 \leqslant n} \binom{n}{3p + 1}, \qquad S_{2} = \sum_{0 \leqslant 3p + 2 \leqslant n} \binom{n}{3p + 2}.$$

    **1.** Calculer $S_{0} + S_{1} + S_{2}$, $S_{0} + jS_{1} + j^{2}S_{2}$ et $S_{0} + j^{2}S_{1} + jS_{2}$ à l'aide de la formule du binôme.

    **2.** Mettre $1 + j$ et $1 + j^{2}$ sous forme trigonométrique, puis en déduire $S_{0}$, $S_{1}$ et $S_{2}$.

    **3.** Vérifier le résultat pour $n = 4$ en calculant directement les trois sommes.
  corrige: |
    **1.** La formule du binôme donne $(1 + 1)^{n} = \sum \binom{n}{k}$, et $(1 + j)^{n} = \sum \binom{n}{k}j^{k}$, où $j^{k}$ vaut $1$, $j$, $j^{2}$ selon que $k \equiv 0$, $1$, $2$ modulo $3$ ; de même pour $(1 + j^{2})^{n}$, avec $j^{2k}$ qui vaut $1$, $j^{2}$, $j$. 
    $$\boxed{S_{0} + S_{1} + S_{2} = 2^{n} \qquad S_{0} + jS_{1} + j^{2}S_{2} = (1 + j)^{n} \qquad S_{0} + j^{2}S_{1} + jS_{2} = (1 + j^{2})^{n}}$$

    **2.** On a $1 + j = -j^{2} = \mathrm{e}^{\mathrm{i}\pi/3}$ et $1 + j^{2} = -j = \mathrm{e}^{-\mathrm{i}\pi/3}$. En ajoutant les trois relations, et grâce à $1 + j + j^{2} = 0$, il reste $3S_{0}$. En les ajoutant après avoir multiplié la deuxième par $j^{2}$ et la troisième par $j$, il reste $3S_{1}$ ; avec $j$ et $j^{2}$, il reste $3S_{2}$. 
    $$3S_{0} = 2^{n} + \mathrm{e}^{\mathrm{i} n\pi/3} + \mathrm{e}^{-\mathrm{i} n\pi/3}, \quad 3S_{1} = 2^{n} + \mathrm{e}^{\mathrm{i}(n-2)\pi/3} + \mathrm{e}^{-\mathrm{i}(n-2)\pi/3}, \quad 3S_{2} = 2^{n} + \mathrm{e}^{\mathrm{i}(n+2)\pi/3} + \mathrm{e}^{-\mathrm{i}(n+2)\pi/3}.$$

    $$\boxed{S_{0} = \frac{2^{n} + 2\cos\frac{n\pi}{3}}{3} \qquad S_{1} = \frac{2^{n} + 2\cos\frac{(n-2)\pi}{3}}{3} \qquad S_{2} = \frac{2^{n} + 2\cos\frac{(n+2)\pi}{3}}{3}}$$

    **3.** Pour $n = 4$ : $S_{0} = \binom{4}{0} + \binom{4}{3} = 5$, $S_{1} = \binom{4}{1} + \binom{4}{4} = 5$, $S_{2} = \binom{4}{2} = 6$. Les formules donnent $\frac{16 - 1}{3} = 5$, $\frac{16 - 1}{3} = 5$ et $\frac{16 + 2}{3} = 6$ ✓.

    *À retenir :* les racines cubiques de l'unité « filtrent » les termes d'une somme selon le reste de l'indice modulo $3$ ; c'est l'idée de la transformée de Fourier discrète.
- id: "ma-04-45"
  feuille: "f-ma-04"
  numero: 45
  partie: "Racines $n$-ièmes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [racines n-ièmes]
  noeuds: [cx-exponentielle, cx-pi]
  notions: []
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $A$ un nombre complexe. On considère l'équation, d'inconnue $z \in \mathbb{C} \setminus \{-\mathrm{i}\}$, 
    $$\Big(\frac{1 + \mathrm{i} z}{1 - \mathrm{i} z}\Big)^{n} = A.$$

    **1.** Montrer que l'application $z \mapsto \dfrac{1 + \mathrm{i} z}{1 - \mathrm{i} z}$ est une bijection de $\mathbb{C} \setminus \{-\mathrm{i}\}$ sur $\mathbb{C} \setminus \{-1\}$, et donner sa réciproque.

    **2.** Montrer que, pour $z \in \mathbb{C} \setminus \{-\mathrm{i}\}$, le complexe $z$ est réel si et seulement si $\Big|\dfrac{1 + \mathrm{i} z}{1 - \mathrm{i} z}\Big| = 1$.

    **3.** En déduire une condition nécessaire et suffisante sur $A$ pour que l'équation ait des solutions et qu'elles soient toutes réelles.

    **4.** Résoudre l'équation lorsque $A = 1$ et $n = 4$.
  corrige: |
    **1.** Notons $\varphi(z) = \frac{1 + \mathrm{i} z}{1 - \mathrm{i} z}$, définie pour $z \neq -\mathrm{i}$. Pour $w \in \mathbb{C}$, l'équation $\varphi(z) = w$ équivaut à $1 + \mathrm{i} z = w - \mathrm{i} wz$, soit $\mathrm{i} z(1 + w) = w - 1$. Si $w = -1$, elle s'écrit $0 = -2$ et n'a pas de solution. Sinon, elle a l'unique solution $z = -\mathrm{i}\,\frac{w - 1}{w + 1}$, qui est différente de $-\mathrm{i}$ puisque $w - 1 \neq w + 1$. 
    $$\boxed{\varphi \text{ est une bijection de } \mathbb{C} \setminus \{-\mathrm{i}\} \text{ sur } \mathbb{C} \setminus \{-1\}, \quad \varphi^{-1}(w) = -\mathrm{i}\,\frac{w - 1}{w + 1}}$$

    **2.** On a $1 + \mathrm{i} z = \mathrm{i}(z - \mathrm{i})$ et $1 - \mathrm{i} z = -\mathrm{i}(z + \mathrm{i})$, donc $|\varphi(z)| = 1 \iff |z - \mathrm{i}| = |z + \mathrm{i}|$, ce qui signifie que $M(z)$ est sur la médiatrice du segment joignant $\mathrm{i}$ et $-\mathrm{i}$, c'est-à-dire sur l'axe réel. $\boxed{z \in \mathbb{R} \iff |\varphi(z)| = 1}$

    **3.** L'équation équivaut à $\varphi(z) \in R_{A}$, où $R_{A}$ désigne l'ensemble des racines $n$-ièmes de $A$ ; ses solutions sont les $\varphi^{-1}(w)$ pour $w \in R_{A} \setminus \{-1\}$. Si $A = 0$, la seule solution est $\varphi^{-1}(0) = \mathrm{i}$, qui n'est pas réelle. Si $A \neq 0$, les éléments de $R_{A}$ ont tous pour module $|A|^{1/n}$, et, d'après la question 2, les solutions sont toutes réelles si et seulement si $|A| = 1$. Il faut enfin qu'il y ait une solution : c'est automatique pour $n \geqslant 2$, où $R_{A}$ a au moins deux éléments, et cela exige $A \neq -1$ pour $n = 1$. 
    $$\boxed{|A| = 1, \ \text{ avec de plus } A \neq -1 \text{ si } n = 1}$$

    **4.** Pour $A = 1$ et $n = 4$, $w \in \{1, \mathrm{i}, -\mathrm{i}\}$, la valeur $-1$ étant exclue, et $\varphi^{-1}(1) = 0$, $\varphi^{-1}(\mathrm{i}) = 1$, $\varphi^{-1}(-\mathrm{i}) = -1$. 
    $$\boxed{z \in \{-1, 0, 1\}}$$
     Ce sont les nombres $\tan\frac{k\pi}{4}$ pour $k \in \{-1, 0, 1\}$ : comme à l'exercice 25, $\varphi(\tan\alpha) = \mathrm{e}^{2\mathrm{i}\alpha}$, et l'équation se lit $\mathrm{e}^{8\mathrm{i}\alpha} = 1$.
- id: "ma-04-46"
  feuille: "f-ma-04"
  numero: 46
  partie: "Exponentielle complexe"
  etoiles: 1
  types: [Calcul]
  mots_cles: [exponentielle complexe, module, conjugué, argument]
  noeuds: [cx-exponentielle, c-calcul, cx-pi]
  notions: [exponentielle, module-complexe]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Résoudre dans $\mathbb{C}$ les équations suivantes, d'inconnue $z$.

    **(a)** $\mathrm{e}^{z} = 3\sqrt{3} - 3\mathrm{i}$

    **(b)** $\mathrm{e}^{z} = \mathrm{i}$

    **(c)** $\mathrm{e}^{z} = 0$

    **(d)** $\mathrm{e}^{z} + \mathrm{e}^{-z} = 1$

    **(e)** $\mathrm{e}^{2z} + (\mathrm{i} - 2)\mathrm{e}^{z} = 2\mathrm{i}$

    **(f)** $\mathrm{e}^{z} = \mathrm{e}^{\overline{z}}$

    Soit ensuite $\theta \in \mathbb{R}$. Donner le module et un argument du complexe $\mathrm{e}^{\mathrm{e}^{\mathrm{i}\theta}}$.
  corrige: |
    On applique la proposition 24 du cours : si $a = |a|\,\mathrm{e}^{\mathrm{i}\alpha} \neq 0$, les solutions de $\mathrm{e}^{z} = a$ sont les $\ln|a| + \mathrm{i}(\alpha + 2k\pi)$, $k \in \mathbb{Z}$.

    • **(a)** $3\sqrt{3} - 3\mathrm{i} = 6\,\mathrm{e}^{-\mathrm{i}\pi/6}$ : $\boxed{z = \ln 6 + \mathrm{i}\Big(-\dfrac{\pi}{6} + 2k\pi\Big),\ k \in \mathbb{Z}}$

    • **(b)** $\mathrm{i} = \mathrm{e}^{\mathrm{i}\pi/2}$ : $\boxed{z = \mathrm{i}\Big(\dfrac{\pi}{2} + 2k\pi\Big),\ k \in \mathbb{Z}}$ **(c)** L'exponentielle ne s'annule pas : $\boxed{\text{aucune solution}}$

    • **(d)** On pose $w = \mathrm{e}^{z} \neq 0$ ; l'équation devient $w^{2} - w + 1 = 0$, de solutions $\mathrm{e}^{\pm\mathrm{i}\pi/3}$. 
    $$\boxed{z = \pm\mathrm{i}\dfrac{\pi}{3} + 2\mathrm{i} k\pi,\ k \in \mathbb{Z}}$$

    • **(e)** Avec $w = \mathrm{e}^{z}$, $w^{2} + (\mathrm{i} - 2)w - 2\mathrm{i} = (w - 2)(w + \mathrm{i}) = 0$. 
    $$\boxed{z = \ln 2 + 2\mathrm{i} k\pi \ \text{ ou } \ z = -\mathrm{i}\dfrac{\pi}{2} + 2\mathrm{i} k\pi,\ k \in \mathbb{Z}}$$

    • **(f)** D'après le cours, $\mathrm{e}^{z} = \mathrm{e}^{\overline{z}} \iff z - \overline{z} = 2\mathrm{i}\operatorname{Im} z \in 2\mathrm{i}\pi\mathbb{Z}$ : $\boxed{\text{l'ensemble des } z \text{ tels que } \operatorname{Im} z \in \pi\mathbb{Z}}$, réunion de droites horizontales.

    Enfin, $\mathrm{e}^{\mathrm{e}^{\mathrm{i}\theta}} = \mathrm{e}^{\cos\theta + \mathrm{i}\sin\theta} = \mathrm{e}^{\cos\theta}\,\mathrm{e}^{\mathrm{i}\sin\theta}$ : $\boxed{\text{module } \mathrm{e}^{\cos\theta}, \text{ argument } \sin\theta}$

    *Piège :* en (d), les solutions $w$ sont de module $1$, donc $\operatorname{Re} z = \ln 1 = 0$ ; on ne doit pas oublier la famille entière $2\mathrm{i} k\pi$.
- id: "ma-04-47"
  feuille: "f-ma-04"
  numero: 47
  partie: "Exponentielle complexe"
  etoiles: 2
  types: [Calcul]
  mots_cles: [exponentielle complexe, module]
  noeuds: [cx-exponentielle, c-calcul]
  notions: [exponentielle, module-complexe]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    **1.** Montrer que $|\mathrm{e}^{z}| \leqslant \mathrm{e}^{|z|}$ pour tout complexe $z$, et déterminer les cas d'égalité.

    **2.** Déterminer l'image par l'exponentielle complexe de la droite d'équation $\operatorname{Re} z = a$, puis de la droite d'équation $\operatorname{Im} z = b$, où $a$ et $b$ sont deux réels.

    **3.** Déterminer l'image par l'exponentielle de la bande $\{z \in \mathbb{C} \mid 0 \leqslant \operatorname{Im} z < 2\pi\}$. L'exponentielle est-elle injective sur cette bande ?
  corrige: |
    **1.** On a $|\mathrm{e}^{z}| = \mathrm{e}^{\operatorname{Re} z}$ et $\operatorname{Re} z \leqslant |\operatorname{Re} z| \leqslant |z|$ ; l'exponentielle réelle étant croissante, $\boxed{|\mathrm{e}^{z}| \leqslant \mathrm{e}^{|z|}}$. Par stricte croissance, il y a égalité si et seulement si $\operatorname{Re} z = |z|$, c'est-à-dire si $z$ est un réel positif.

    **2.** Les points de la droite $\operatorname{Re} z = a$ s'écrivent $a + \mathrm{i} y$, d'image $\mathrm{e}^{a}\,\mathrm{e}^{\mathrm{i} y}$ ; lorsque $y$ décrit $\mathbb{R}$, $\mathrm{e}^{\mathrm{i} y}$ décrit tout $\mathbb{U}$. Les points de la droite $\operatorname{Im} z = b$ s'écrivent $x + \mathrm{i} b$, d'image $\mathrm{e}^{x}\,\mathrm{e}^{\mathrm{i} b}$, et $\mathrm{e}^{x}$ décrit $]0\,,+\infty[$. 
    $$\boxed{\text{la droite } \operatorname{Re} z = a \text{ a pour image le cercle } |w| = \mathrm{e}^{a}}$$

    $$\boxed{\text{la droite } \operatorname{Im} z = b \text{ a pour image la demi-droite ouverte } \{r\,\mathrm{e}^{\mathrm{i} b} \mid r > 0\}}$$

    **3.** Tout complexe non nul $w$ s'écrit $|w|\,\mathrm{e}^{\mathrm{i}\alpha}$ avec un unique $\alpha \in [0\,,2\pi[$, et $w = \mathrm{e}^{\ln|w| + \mathrm{i}\alpha}$ : l'image est $\boxed{\mathbb{C}^{*}}$. Si $\mathrm{e}^{z} = \mathrm{e}^{z'}$ avec $z$, $z'$ dans la bande, alors $z - z' = 2\mathrm{i} k\pi$ ; mais $|\operatorname{Im} z - \operatorname{Im} z'| < 2\pi$, donc $k = 0$ : $\boxed{\text{l'exponentielle est injective sur la bande}}$, qui en est un « domaine fondamental ».
- id: "ma-04-48"
  feuille: "f-ma-04"
  numero: 48
  partie: "Interprétation géométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [géométrie complexe, module, conjugué]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Déterminer et représenter l'ensemble des points $M$ d'affixe $z$ vérifiant chacune des conditions suivantes.

    **(a)** $|z - \mathrm{i}| = |z + \mathrm{i}|$

    **(b)** $|(1 + \mathrm{i})z - 2\mathrm{i}| = 2$

    **(c)** $\arg(z - 2) \equiv \dfrac{\pi}{2}\ [2\pi]$

    **(d)** $\arg\Big(\dfrac{z - 2\mathrm{i}}{z - 1 + \mathrm{i}}\Big) \equiv \dfrac{\pi}{2}\ [\pi]$

    **(e)** $(z - 2)(\overline{z} + \mathrm{i}) \in \mathbb{R}$

    **(f)** $z + \overline{z} = |z|$
  corrige: |
    • **(a)** $M$ est équidistant des points d'affixes $\mathrm{i}$ et $-\mathrm{i}$ : $\boxed{\text{l'axe des réels}}$

    • **(b)** $|(1 + \mathrm{i})z - 2\mathrm{i}| = |1 + \mathrm{i}|\,|z - (1 + \mathrm{i})| = \sqrt{2}\,|z - (1 + \mathrm{i})|$, puisque $\frac{2\mathrm{i}}{1 + \mathrm{i}} = 1 + \mathrm{i}$ : 
    $$\boxed{\text{le cercle de centre } 1 + \mathrm{i} \text{ et de rayon } \sqrt{2}}$$
     Ce cercle passe par l'origine.

    • **(c)** $z - 2$ est un imaginaire pur de partie imaginaire strictement positive : 
    $$\boxed{\text{la demi-droite ouverte } \{2 + \mathrm{i} y \mid y > 0\}}$$

    • **(d)** Avec $A(2\mathrm{i})$ et $B(1 - \mathrm{i})$, la condition dit que $M \neq A, B$ et que $(MA) \perp (MB)$ : 
    $$\boxed{\text{le cercle de diamètre } [AB] \text{ privé de } A \text{ et } B}$$
     Son centre a pour affixe $\frac{1 + \mathrm{i}}{2}$, et son rayon vaut $\frac{\sqrt{10}}{2}$.

    • **(e)** Avec $z = x + \mathrm{i} y$, le produit s'écrit $(x - 2 + \mathrm{i} y)\big(x + \mathrm{i}(1 - y)\big)$, dont la partie imaginaire vaut $(x - 2)(1 - y) + xy$, soit $x + 2y - 2$ : 
    $$\boxed{\text{la droite d'équation } x + 2y = 2}$$

    • **(f)** $2x = \sqrt{x^{2} + y^{2}}$ équivaut à $x \geqslant 0$ et $y^{2} = 3x^{2}$ : $\boxed{\text{les deux demi-droites } y = \pm\sqrt{3}\,x,\ x \geqslant 0}$

    ![Figure](documents/figures/2ff8ae78a218ce2d.svg)

    ![Figure](documents/figures/10dffda81f54b990.svg)

    À gauche, les deux cercles (b) et (d), le second privé des points $A$ et $B$, marqués d'un rond vide. À droite, la demi-droite ouverte (c), la droite (e), qui passe par $2$ et par $\mathrm{i}$, et les deux demi-droites (f), qui font un angle de $\frac{\pi}{3}$ avec l'axe des réels ; l'ensemble (a) est l'axe des réels lui-même.
- id: "ma-04-49"
  feuille: "f-ma-04"
  numero: 49
  partie: "Interprétation géométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [géométrie complexe, similitudes]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 10
  page_corrige: 20
  enonce: |
    **1.** Déterminer la nature et les éléments caractéristiques des transformations dont l'écriture complexe suit.

    **(a)** $z \mapsto \mathrm{e}^{\mathrm{i}\pi/3}z + 1$

    **(b)** $z \mapsto z + 4 - 2\mathrm{i}$

    **(c)** $z \mapsto 3z + \mathrm{i}$

    **(d)** $z \mapsto (1 + \mathrm{i}\sqrt{3})z + \sqrt{3}(1 - \mathrm{i})$

    **2.** Donner l'écriture complexe de la rotation de centre $2 - \mathrm{i}$ et d'angle $\dfrac{\pi}{4}$, et celle de l'homothétie de centre $3 + 2\mathrm{i}$ et de rapport $-2$.

    **3.** Soit $r$ la rotation de centre $1$ et d'angle $\dfrac{\pi}{2}$, et $s$ la symétrie de centre $3 + \mathrm{i}$. Déterminer l'écriture complexe de $r \circ s$, puis sa nature et ses éléments caractéristiques.
  corrige: |
    **1.** On applique le théorème 5 du cours : pour $a \neq 1$, le centre a pour affixe $\frac{b}{1 - a}$.

    • **(a)** $a = \mathrm{e}^{\mathrm{i}\pi/3}$, de module $1$, et $1 - \mathrm{e}^{\mathrm{i}\pi/3} = \mathrm{e}^{-\mathrm{i}\pi/3}$ : 
    $$\boxed{\text{rotation d'angle } \frac{\pi}{3} \text{ et de centre } \mathrm{e}^{\mathrm{i}\pi/3} = \frac{1}{2} + \mathrm{i}\frac{\sqrt{3}}{2}}$$

    • **(b)** $\boxed{\text{translation de vecteur d'affixe } 4 - 2\mathrm{i}}$ **(c)** $\boxed{\text{homothétie de rapport } 3 \text{ et de centre } -\frac{\mathrm{i}}{2}}$

    • **(d)** $a = 1 + \mathrm{i}\sqrt{3} = 2\,\mathrm{e}^{\mathrm{i}\pi/3}$, et $\frac{\sqrt{3}(1 - \mathrm{i})}{-\mathrm{i}\sqrt{3}} = 1 + \mathrm{i}$ : 
    $$\boxed{\text{similitude de centre } 1 + \mathrm{i}, \text{ de rapport } 2 \text{ et d'angle } \frac{\pi}{3}}$$

    **2.** D'après les définitions du cours : 
    $$\boxed{z \mapsto 2 - \mathrm{i} + \mathrm{e}^{\mathrm{i}\pi/4}(z - 2 + \mathrm{i}) \qquad\text{et}\qquad z \mapsto 3 + 2\mathrm{i} - 2(z - 3 - 2\mathrm{i}) = -2z + 9 + 6\mathrm{i}}$$

    **3.** La symétrie de centre $3 + \mathrm{i}$ est l'homothétie de rapport $-1$ : $s(z) = 6 + 2\mathrm{i} - z$, et $r(z) = 1 + \mathrm{i}(z - 1)$. Alors 
    $$r\big(s(z)\big) = 1 + \mathrm{i}(5 + 2\mathrm{i} - z) = \boxed{-\mathrm{i} z - 1 + 5\mathrm{i}},$$
     une rotation d'angle $-\frac{\pi}{2}$, puisque $-\mathrm{i} = \mathrm{e}^{-\mathrm{i}\pi/2}$, de centre $\frac{-1 + 5\mathrm{i}}{1 + \mathrm{i}} = \boxed{2 + 3\mathrm{i}}$. Plus directement, $s$ est la rotation d'angle $\pi$ ; la composée de deux rotations d'angles $\pi$ et $\frac{\pi}{2}$ est une rotation d'angle $\frac{3\pi}{2} \equiv -\frac{\pi}{2}$, puisque les coefficients se multiplient ; seul le centre demande un calcul.
- id: "ma-04-50"
  feuille: "f-ma-04"
  numero: 50
  partie: "Interprétation géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [géométrie complexe]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    Déterminer les complexes $z$ tels que les points d'affixes $z$, $z^{2}$ et $z^{3}$ soient deux à deux distincts et forment un triangle rectangle. Représenter l'ensemble obtenu, en distinguant selon le sommet de l'angle droit.
  corrige: |
    Les points sont distincts si et seulement si $z \notin \{-1, 0, 1\}$. Pour un tel $z$, on examine l'angle droit en chacun des trois sommets, grâce à la proposition 25 du cours.

    • *En $z$ :* $\dfrac{z^{3} - z}{z^{2} - z} = z + 1$ est imaginaire pur si et seulement si $\operatorname{Re} z = -1$.

    • *En $z^{2}$ :* $\dfrac{z^{3} - z^{2}}{z - z^{2}} = -z$ est imaginaire pur si et seulement si $\operatorname{Re} z = 0$.

    • *En $z^{3}$ :* $\dfrac{z - z^{3}}{z^{2} - z^{3}} = \dfrac{1 + z}{z} = 1 + \dfrac{1}{z}$ est imaginaire pur si et seulement si $\operatorname{Re}\frac{1}{z} = \frac{x}{x^{2} + y^{2}} = -1$, soit $x^{2} + y^{2} + x = 0$.

    Dans chaque cas le quotient est non nul, donc le triangle n'est pas aplati. 
    $$\boxed{\big(\{\operatorname{Re} z = -1\} \setminus \{-1\}\big) \ \cup \ \big(\mathrm{i}\mathbb{R} \setminus \{0\}\big) \ \cup \ \big(\mathcal{C} \setminus \{0, -1\}\big)}$$
     où $\mathcal{C}$ est le cercle de centre $-\frac{1}{2}$ et de rayon $\frac{1}{2}$.

    ![Figure](documents/figures/6acd6f63166c512d.svg)

    Les trois ensembles sont représentés avec la couleur du sommet de l'angle droit ; les points $-1$, $0$ et $1$, où deux des trois points sont confondus, sont exclus.
- id: "ma-04-51"
  feuille: "f-ma-04"
  numero: 51
  partie: "Interprétation géométrique"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [géométrie complexe, équations du second degré, groupe 𝕌]
  noeuds: [c-calcul, cx-exponentielle, c-racines-carrees]
  notions: [module-complexe]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    Soit $a$, $b$ et $c$ trois éléments de $\mathbb{U}$ tels que $a + b + c = 0$.

    **1.** Montrer que $\dfrac{b}{a} + \dfrac{c}{a} = -1$, puis que $\dfrac{b}{a}$ et $\dfrac{c}{a}$ sont les solutions d'une équation du second degré que l'on déterminera.

    **2.** En déduire que le triangle de sommets $a$, $b$ et $c$ est équilatéral.
  corrige: |
    **1.** On divise $a + b + c = 0$ par $a \neq 0$ : $\frac{b}{a} + \frac{c}{a} = -1$. Les nombres $u = \frac{b}{a}$ et $v = \frac{c}{a}$ sont de module $1$ ; en conjuguant, $\frac{1}{u} + \frac{1}{v} = -1$, soit $\frac{u + v}{uv} = -1$, d'où $uv = 1$. Ils sont donc solutions de 
    $$\boxed{z^{2} + z + 1 = 0}, \qquad\text{c'est-à-dire}\qquad \{u, v\} = \{j, j^{2}\}.$$

    **2.** Ainsi $\{b, c\} = \{aj, aj^{2}\}$ : le triangle est l'image du triangle de sommets $1$, $j$, $j^{2}$ par la rotation $z \mapsto az$. Ce dernier est équilatéral, puisque ses sommets sont ceux d'un polygone régulier, et une rotation conserve les distances. 
    $$\boxed{\text{le triangle de sommets } a, b, c \text{ est équilatéral}}$$
     Géométriquement : le centre du cercle circonscrit, $O$, est aussi le centre de gravité $\frac{a + b + c}{3}$, ce qui n'arrive que pour un triangle équilatéral.
- id: "ma-04-52"
  feuille: "f-ma-04"
  numero: 52
  partie: "Interprétation géométrique"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [géométrie complexe]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    On note $j = \mathrm{e}^{2\mathrm{i}\pi/3}$. Un triangle $ABC$ est dit *équilatéral direct* si $AB = AC$ et si $\frac{\pi}{3}$ est une mesure de l'angle orienté $(\overrightarrow{AB}, \overrightarrow{AC})$.

    **1.** Soit $A$, $B$, $C$ trois points distincts d'affixes $a$, $b$, $c$. Montrer que $ABC$ est équilatéral direct si et seulement si $c - a = -j^{2}(b - a)$, puis si et seulement si $a + jb + j^{2}c = 0$.

    **2.** *Théorème de Napoléon.* On construit extérieurement au triangle direct $ABC$ trois triangles équilatéraux $ABC'$, $BCA'$ et $CAB'$, de centres respectifs $G_{C}$, $G_{A}$ et $G_{B}$, comme sur la figure. Exprimer $c'$, $a'$ et $b'$ en fonction de $a$, $b$, $c$ et $j$, puis montrer que le triangle $G_{A}G_{B}G_{C}$ est équilatéral.

    ![Figure](documents/figures/7b8baf32e4526a22.svg)
  corrige: |
    **1.** D'après la proposition 25 du cours, $ABC$ est équilatéral direct si et seulement si $\frac{c - a}{b - a}$ a pour module $1$ et pour argument $\frac{\pi}{3}$, c'est-à-dire $c - a = \mathrm{e}^{\mathrm{i}\pi/3}(b - a)$. Or $-j^{2} = \mathrm{e}^{\mathrm{i}\pi}\mathrm{e}^{4\mathrm{i}\pi/3} = \mathrm{e}^{\mathrm{i}\pi/3}$. Ensuite, avec $1 + j^{2} = -j$, 
    $$c = a(1 + j^{2}) - j^{2}b = -ja - j^{2}b \iff j^{2}c = -a - jb \iff \boxed{a + jb + j^{2}c = 0},$$
     la multiplication par $j^{2}$ étant inversible.

    **2.** Le triangle $AC'B$ est équilatéral direct, puisque $C'$ est du côté opposé à $C$ : la question 1 donne $a + jc' + j^{2}b = 0$, d'où, en multipliant par $j^{2}$, $c' = -j^{2}a - jb$. De même, avec les triangles directs $BA'C$ et $CB'A$ : 
    $$\boxed{c' = -j^{2}a - jb \qquad a' = -j^{2}b - jc \qquad b' = -j^{2}c - ja}$$
     Les centres sont les isobarycentres, par exemple $3g_{C} = a + b + c' = (1 - j^{2})a + (1 - j)b$, et de même $3g_{A} = (1 - j^{2})b + (1 - j)c$, $3g_{B} = (1 - j^{2})c + (1 - j)a$. On calcule $3(g_{A} + jg_{B} + j^{2}g_{C})$ coefficient par coefficient : 
    $$a : \ j(1 - j) + j^{2}(1 - j^{2}) = j - j^{4} = 0, \qquad b : \ (1 - j^{2}) + j^{2}(1 - j) = 1 - j^{3} = 0,$$

    $$c : \ (1 - j) + j(1 - j^{2}) = 1 - j^{3} = 0.$$
     Donc $g_{A} + jg_{B} + j^{2}g_{C} = 0$, et la question 1 conclut : $\boxed{\text{le triangle } G_{A}G_{B}G_{C} \text{ est équilatéral direct}}$ Sur la figure de l'énoncé, construite avec $A(0)$, $B(4)$ et $C(1{,}2 + 2{,}6\,\mathrm{i})$, les trois côtés du triangle bleu pétrole mesurent tous $3{,}531$ à $10^{-3}$ près ✓.
- id: "ma-04-53"
  feuille: "f-ma-04"
  numero: 53
  partie: "Interprétation géométrique"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [géométrie complexe, similitudes]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    Dans le plan complexe, on note $A_{0}$ le point d'affixe $6$ et $S$ la similitude directe de centre $O$, de rapport $\frac{\sqrt{3}}{2}$ et d'angle $\frac{\pi}{6}$. On définit les points $A_{n}$ par la relation $A_{n+1} = S(A_{n})$ pour tout $n \in \mathbb{N}$.

    ![Figure](documents/figures/95ed22fff5a73779.svg)

    **1.** Déterminer l'affixe $a_{n}$ du point $A_{n}$, et vérifier que $A_{12}$ appartient à la demi-droite des réels positifs.

    **2.** Montrer que, pour tout $n$, le triangle $OA_{n}A_{n+1}$ est rectangle en $A_{n+1}$.

    **3.** Calculer la longueur $A_{n}A_{n+1}$, puis la longueur de la ligne brisée $A_{0}A_{1}\dots A_{12}$.
  corrige: |
    **1.** La similitude $S$ a pour écriture complexe $z \mapsto qz$ avec $q = \frac{\sqrt{3}}{2}\,\mathrm{e}^{\mathrm{i}\pi/6} = \frac{3}{4} + \mathrm{i}\frac{\sqrt{3}}{4}$, donc 
    $$\boxed{a_{n} = 6q^{n} = 6\Big(\frac{\sqrt{3}}{2}\Big)^{n}\mathrm{e}^{\mathrm{i} n\pi/6}}, \qquad a_{12} = 6\Big(\frac{3}{4}\Big)^{6}\mathrm{e}^{2\mathrm{i}\pi} = \frac{2187}{2048} > 0.$$

    **2.** On calcule le quotient de la proposition 25, au sommet $A_{n+1}$ : 
    $$\frac{a_{n} - a_{n+1}}{0 - a_{n+1}} = \frac{1 - q}{-q} = 1 - \frac{1}{q} = 1 - \frac{2}{\sqrt{3}}\,\mathrm{e}^{-\mathrm{i}\pi/6} = 1 - \Big(1 - \frac{\mathrm{i}}{\sqrt{3}}\Big) = \frac{\mathrm{i}}{\sqrt{3}},$$
     qui est imaginaire pur : $\boxed{(A_{n+1}A_{n}) \perp (A_{n+1}O)}$

    **3.** On a $|1 - q| = \big|\frac{1}{4} - \mathrm{i}\frac{\sqrt{3}}{4}\big| = \frac{1}{2}$, donc $A_{n}A_{n+1} = |a_{n}|\,|q - 1| = \boxed{3\Big(\frac{\sqrt{3}}{2}\Big)^{n}}$. La longueur de la ligne brisée est une somme géométrique : 
    $$L = \sum_{n=0}^{11} 3\Big(\frac{\sqrt{3}}{2}\Big)^{n} = 3\,\frac{1 - (3/4)^{6}}{1 - \sqrt{3}/2} = \frac{6 \times 3367/4096}{2 - \sqrt{3}} = \boxed{\frac{10101\,(2 + \sqrt{3})}{2048} \approx 18{,}41}$$

    *À retenir :* une similitude de centre $O$ transforme une suite de points en suite géométrique d'affixes ; les longueurs forment alors une suite géométrique de raison le rapport.
- id: "ma-04-54"
  feuille: "f-ma-04"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [trigonométrie, module, conjugué, équations du second degré, similitudes, géométrie complexe]
  noeuds: [cx-pi, c-calcul, c-racines-carrees]
  notions: [pi, module-complexe]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    **Vrai ou faux.** Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse et justifier la réponse par une démonstration ou un contre-exemple.

    **1.** Pour tout complexe $z$, $|z|^{2} = z^{2}$.

    **2.** Pour tout réel $x$, $\cos(3x) = 4\cos^{3} x - 3\cos x$.

    **3.** Le nombre $(1 + \mathrm{i})^{2026}$ est imaginaire pur.

    **4.** Pour tous complexes $z$ et $z'$, $\operatorname{Re}(zz') = \operatorname{Re} z \times \operatorname{Re} z'$.

    **5.** Les racines carrées de $-2\mathrm{i}$ sont $1 - \mathrm{i}$ et $-1 + \mathrm{i}$.

    **6.** Pour tout complexe $z$, $\mathrm{e}^{\overline{z}} = \overline{\mathrm{e}^{z}}$.

    **7.** Si le discriminant d'une équation du second degré à coefficients complexes est un réel strictement négatif, ses deux solutions sont conjuguées.

    **8.** Pour tous réels $a$ et $b$, $|\mathrm{e}^{\mathrm{i} a} - \mathrm{e}^{\mathrm{i} b}| = 2\Big|\sin\dfrac{a - b}{2}\Big|$.

    **9.** L'application $z \mapsto \mathrm{i}\overline{z}$ est une similitude directe.

    **10.** Les points d'affixes $1$, $\mathrm{i}$ et $-1$ forment un triangle rectangle.
  corrige: |
    **1.** **Fausse**. Pour $z = \mathrm{i}$, $|z|^{2} = 1$ et $z^{2} = -1$. La bonne formule est $|z|^{2} = z\overline{z}$.

    **2.** **Vraie**. C'est la méthode de Moivre, appliquée dans le cours, section 4.4.

    **3.** **Vraie**. $(1 + \mathrm{i})^{2} = 2\mathrm{i}$, donc $(1 + \mathrm{i})^{2026} = (2\mathrm{i})^{1013} = 2^{1013}\,\mathrm{i}^{1013} = 2^{1013}\,\mathrm{i}$, puisque $1013 \equiv 1\ [4]$.

    **4.** **Fausse**. Pour $z = z' = \mathrm{i}$, $\operatorname{Re}(zz') = -1$, alors que $\operatorname{Re} z \times \operatorname{Re} z' = 0$. En général, 
    $$\operatorname{Re}(zz') = \operatorname{Re} z\,\operatorname{Re} z' - \operatorname{Im} z\,\operatorname{Im} z'.$$

    **5.** **Vraie**. $(1 - \mathrm{i})^{2} = 1 - 2\mathrm{i} - 1 = -2\mathrm{i}$, et les deux racines carrées sont opposées.

    **6.** **Vraie**. C'est la proposition 23 du cours : $\mathrm{e}^{\overline{z}} = \mathrm{e}^{\operatorname{Re} z}\,\mathrm{e}^{-\mathrm{i}\operatorname{Im} z} = \overline{\mathrm{e}^{\operatorname{Re} z}\mathrm{e}^{\mathrm{i}\operatorname{Im} z}}$.

    **7.** **Fausse**. L'équation $z^{2} + 2\mathrm{i} z = 0$ a pour discriminant $-4$, et pour solutions $0$ et $-2\mathrm{i}$, qui ne sont pas conjuguées. La propriété n'est vraie que pour des coefficients réels.

    **8.** **Vraie**. L'angle moitié donne $\mathrm{e}^{\mathrm{i} a} - \mathrm{e}^{\mathrm{i} b} = 2\mathrm{i}\sin\frac{a - b}{2}\,\mathrm{e}^{\mathrm{i}(a + b)/2}$, dont on prend le module.

    **9.** **Fausse**. Si l'on avait $\mathrm{i}\overline{z} = \alpha z + \beta$ pour tout $z$, la valeur en $0$ donnerait $\beta = 0$, la valeur en $1$ donnerait $\alpha = \mathrm{i}$, et la valeur en $\mathrm{i}$ donnerait $1 = -1$. Cette application change les angles orientés en leurs opposés.

    **10.** **Vraie**. Au sommet $\mathrm{i}$, $\frac{-1 - \mathrm{i}}{1 - \mathrm{i}} = -\mathrm{i}$ est imaginaire pur : le triangle est rectangle en $\mathrm{i}$, et même isocèle.

    *Bilan :* six affirmations vraies (2, 3, 5, 6, 8, 10) et quatre fausses (1, 4, 7, 9).
- id: "ma-04-55"
  feuille: "f-ma-04"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["racines de l'unité", module]
  noeuds: [c-calcul, cx-exponentielle]
  notions: [module-complexe]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    On note $j = \mathrm{e}^{2\mathrm{i}\pi/3}$ et $E = \{a^{2} - ab + b^{2} \mid (a, b) \in \mathbb{Z}^{2}\}$.

    **1.** Montrer que, pour tous entiers $a$ et $b$, $a^{2} - ab + b^{2} = |a + bj^{2}|^{2}$.

    **2.** Montrer que, pour tous entiers $a$, $b$, $c$, $d$, il existe deux entiers $e$ et $f$ tels que 
    $$(a + bj^{2})(c + dj^{2}) = e + fj^{2}.$$
     *On pourra utiliser la relation $1 + j + j^{2} = 0$.*

    **3.** En déduire que $E$ est stable par produit, et comparer avec l'exercice 19.
  corrige: |
    **1.** Comme $\overline{j^{2}} = j$ et $j + j^{2} = -1$, $j^{3} = 1$, 
    $$|a + bj^{2}|^{2} = (a + bj^{2})(a + bj) = a^{2} + ab(j + j^{2}) + b^{2}j^{3} = \boxed{a^{2} - ab + b^{2}}.$$

    **2.** On développe, puis l'on remplace $j^{4} = j$ par $-1 - j^{2}$ : 
    $$(a + bj^{2})(c + dj^{2}) = ac + (ad + bc)j^{2} + bd\,j = \boxed{(ac - bd) + (ad + bc - bd)\,j^{2}}.$$

    **3.** Si $s = |a + bj^{2}|^{2}$ et $s' = |c + dj^{2}|^{2}$ sont deux éléments de $E$, alors $ss' = |e + fj^{2}|^{2} = e^{2} - ef + f^{2}$ avec $e$, $f$ entiers : $\boxed{E \text{ est stable par produit}}$. C'est le même argument qu'à l'exercice 19, où l'on remplace $\mathrm{i}$ par $j^{2}$, et l'ensemble $\{a + b\mathrm{i}\}$ des entiers de Gauss par celui des entiers d'Eisenstein. Par exemple, $3 = 1 + 1 + 1 = 2^{2} - 2 + 1$ appartient à $E$, alors qu'il n'appartient pas à $S$.
- id: "ma-04-56"
  feuille: "f-ma-04"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équations du second degré]
  noeuds: [c-racines-carrees]
  notions: []
  page_enonce: 12
  page_corrige: 23
  enonce: |
    On considère l'application $f : \mathbb{C} \setminus \{2\mathrm{i}\} \to \mathbb{C}$ définie par $f(z) = \dfrac{z^{2}}{z - 2\mathrm{i}}$.

    **1.** Déterminer les racines carrées de $8 - 6\mathrm{i}$, puis les antécédents de $1 + \mathrm{i}$ par $f$.

    **2.** L'application $f$ est-elle injective ? Montrer qu'elle est surjective, au sens du chapitre 2.

    **3.** Déterminer les complexes $w$ qui ont un unique antécédent par $f$.
  corrige: |
    **1.** Les racines carrées de $8 - 6\mathrm{i}$ sont $\pm(3 - \mathrm{i})$ (exercice 31). L'équation $f(z) = 1 + \mathrm{i}$ équivaut, pour $z \neq 2\mathrm{i}$, à $z^{2} - (1 + \mathrm{i})z + 2\mathrm{i}(1 + \mathrm{i}) = 0$, de discriminant $(1 + \mathrm{i})^{2} - 8\mathrm{i}(1 + \mathrm{i}) = 8 - 6\mathrm{i}$. 
    $$z = \frac{1 + \mathrm{i} \pm (3 - \mathrm{i})}{2}, \qquad \boxed{\text{les antécédents de } 1 + \mathrm{i} \text{ sont } 2 \text{ et } -1 + \mathrm{i}}$$
     On vérifie : $f(2) = \frac{4}{2 - 2\mathrm{i}} = 1 + \mathrm{i}$ ✓.

    **2.** Le nombre $1 + \mathrm{i}$ a deux antécédents : 
    $$\boxed{f \text{ n'est pas injective}}$$
     Soit $w \in \mathbb{C}$ ; l'équation $z^{2} - wz + 2\mathrm{i} w = 0$ a au moins une solution d'après le théorème 4 du cours, et cette solution n'est pas $2\mathrm{i}$, puisque $(2\mathrm{i})^{2} - 2\mathrm{i} w + 2\mathrm{i} w = -4 \neq 0$. C'est donc un antécédent de $w$ : 
    $$\boxed{f \text{ est surjective}}$$

    **3.** Le nombre $w$ a un unique antécédent si et seulement si le discriminant $w^{2} - 8\mathrm{i} w = w(w - 8\mathrm{i})$ est nul. 
    $$\boxed{w = 0, \text{ d'antécédent } 0, \qquad\text{et}\qquad w = 8\mathrm{i}, \text{ d'antécédent } 4\mathrm{i}}$$
     On vérifie que $f(4\mathrm{i}) = \frac{-16}{2\mathrm{i}} = 8\mathrm{i}$ ✓. Cet exercice reprend le corrigé de l'exercice 7 du chapitre 2, où l'existence d'une racine carrée complexe avait été admise.
- id: "ma-04-57"
  feuille: "f-ma-04"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [trigonométrie, module, sommes trigonométriques]
  noeuds: [cx-pi, c-calcul, n-sommes]
  notions: [pi, module-complexe]
  page_enonce: 12
  page_corrige: 24
  enonce: |
    Soit $n \in \mathbb{N}$ et $z_{1}, \dots, z_{2n+1}$ des nombres complexes de module $1$, de parties réelles positives ou nulles. On veut montrer que 
    $$\Big|\sum_{k=1}^{2n+1} z_{k}\Big| \geqslant 1.$$

    **1.** Justifier qu'on peut écrire $z_{k} = \mathrm{e}^{\mathrm{i}\theta_{k}}$ avec $-\dfrac{\pi}{2} \leqslant \theta_{1} \leqslant \theta_{2} \leqslant \cdots \leqslant \theta_{2n+1} \leqslant \dfrac{\pi}{2}$.

    **2.** Montrer que $z_{1} + z_{2n+1} = 2\cos\dfrac{\theta_{2n+1} - \theta_{1}}{2}\,\mathrm{e}^{\mathrm{i}\varphi}$, avec $\varphi = \dfrac{\theta_{1} + \theta_{2n+1}}{2}$.

    **3.** Soit $S' = z_{2} + \cdots + z_{2n}$. Montrer que $\operatorname{Re}\big(S'\,\mathrm{e}^{-\mathrm{i}\varphi}\big) \geqslant 0$, puis que $|S' + z_{1} + z_{2n+1}| \geqslant |S'|$.

    **4.** Conclure par récurrence sur $n$. L'hypothèse sur le nombre de termes est-elle indispensable ?
  corrige: |
    **1.** Un complexe de module $1$ s'écrit $\mathrm{e}^{\mathrm{i}\theta}$ avec $\theta \in \,]-\pi\,,\pi]$, et sa partie réelle $\cos\theta$ est positive si et seulement si $\theta \in [-\frac{\pi}{2}\,,\frac{\pi}{2}]$. On numérote ensuite les $z_{k}$ par arguments croissants.

    **2.** C'est la proposition 14 du cours : $\mathrm{e}^{\mathrm{i} p} + \mathrm{e}^{\mathrm{i} q} = 2\cos\frac{p - q}{2}\,\mathrm{e}^{\mathrm{i}(p + q)/2}$, avec $p = \theta_{2n+1}$, $q = \theta_{1}$. Notons que $\frac{\theta_{2n+1} - \theta_{1}}{2} \in [0\,,\frac{\pi}{2}]$, donc ce cosinus est positif.

    **3.** Pour $k \in [\![2\,;2n]\!]$, $\theta_{1} \leqslant \theta_{k} \leqslant \theta_{2n+1}$, donc $|\theta_{k} - \varphi| \leqslant \frac{\theta_{2n+1} - \theta_{1}}{2} \leqslant \frac{\pi}{2}$, et $\operatorname{Re}(z_{k}\mathrm{e}^{-\mathrm{i}\varphi}) = \cos(\theta_{k} - \varphi) \geqslant 0$. En sommant, $\operatorname{Re}(S'\mathrm{e}^{-\mathrm{i}\varphi}) \geqslant 0$. Alors, avec $s = z_{1} + z_{2n+1} = \rho\,\mathrm{e}^{\mathrm{i}\varphi}$, $\rho \geqslant 0$, 
    $$|S' + s|^{2} = |S'|^{2} + |s|^{2} + 2\rho\,\operatorname{Re}\big(S'\mathrm{e}^{-\mathrm{i}\varphi}\big) \geqslant |S'|^{2}, \qquad\text{donc}\qquad \boxed{|S' + z_{1} + z_{2n+1}| \geqslant |S'|}.$$

    **4.** Pour $n = 0$, $|z_{1}| = 1$. Si le résultat est vrai pour $2n - 1$ termes, il s'applique à $S'$, qui en compte $2n - 1 = 2(n - 1) + 1$, de parties réelles positives : $|S'| \geqslant 1$, puis $\big|\sum z_{k}\big| \geqslant |S'| \geqslant 1$. $\boxed{\Big|\sum_{k=1}^{2n+1} z_{k}\Big| \geqslant 1}$

    L'hypothèse sur la parité est indispensable : avec deux termes, $\mathrm{i} + (-\mathrm{i}) = 0$.
- id: "ma-04-58"
  feuille: "f-ma-04"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes trigonométriques]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 12
  page_corrige: 24
  enonce: |
    Soit $z_{1}, \dots, z_{n}$ des nombres complexes. On veut montrer qu'il existe une partie $I$ de $[\![1\,;n]\!]$ telle que 
    $$\Big|\sum_{k \in I} z_{k}\Big| \geqslant \frac{1}{4}\sum_{k=1}^{n} |z_{k}|.$$

    **1.** On note $P_{+}$ la somme des parties réelles strictement positives des $z_{k}$, $P_{-}$ la somme des opposés des parties réelles strictement négatives, et l'on définit de même $Q_{+}$ et $Q_{-}$ avec les parties imaginaires. Montrer que $P_{+} + P_{-} + Q_{+} + Q_{-} \geqslant \displaystyle\sum_{k=1}^{n} |z_{k}|$.

    **2.** On suppose par exemple que $P_{+}$ est le plus grand des quatre nombres. Montrer que la partie $I = \{k \mid \operatorname{Re} z_{k} > 0\}$ convient, et conclure.

    **3.** Donner un exemple qui montre que l'on ne peut pas remplacer $\frac{1}{4}$ par $1$.
  corrige: |
    **1.** L'exercice 16 donne $|z_{k}| \leqslant |\operatorname{Re} z_{k}| + |\operatorname{Im} z_{k}|$. On somme, en remarquant que $\sum |\operatorname{Re} z_{k}| = P_{+} + P_{-}$ et que $\sum |\operatorname{Im} z_{k}| = Q_{+} + Q_{-}$ : 
    $$\boxed{P_{+} + P_{-} + Q_{+} + Q_{-} \geqslant \sum |z_{k}|}$$

    **2.** Le plus grand des quatre nombres est au moins le quart de leur somme. Si c'est $P_{+}$, alors, avec $I = \{k \mid \operatorname{Re} z_{k} > 0\}$, 
    $$\Big|\sum_{k \in I} z_{k}\Big| \geqslant \operatorname{Re}\Big(\sum_{k \in I} z_{k}\Big) = P_{+} \geqslant \frac{1}{4}\sum_{k=1}^{n} |z_{k}|.$$
     Dans les trois autres cas, on prend de même les indices de partie réelle négative, ou de partie imaginaire positive, ou négative, en minorant le module par $-\operatorname{Re}$, $\operatorname{Im}$ ou $-\operatorname{Im}$. $\boxed{\text{une telle partie } I \text{ existe}}$

    **3.** Avec $z_{1} = 1$ et $z_{2} = -1$, les sommes partielles valent $0$, $1$ ou $-1$, de module au plus $1$, alors que $\sum |z_{k}| = 2$ : la constante $1$ est impossible, et même toute constante supérieure à $\frac{1}{2}$.

    L'exercice 60 montre que la meilleure constante possible est $\frac{1}{\pi} \approx 0{,}318$ ; la constante $\frac{1}{4}$ obtenue ici n'en est pas loin, pour un raisonnement beaucoup plus simple.
- id: "ma-04-59"
  feuille: "f-ma-04"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [trigonométrie, module, géométrie complexe]
  noeuds: [cx-pi, c-calcul]
  notions: [pi, module-complexe]
  page_enonce: 12
  page_corrige: 24
  enonce: |
    On note $G$ l'ensemble des nombres complexes de module $1$ dont la partie réelle et la partie imaginaire sont rationnelles.

    **1.** À l'aide des formules du cours exprimant $\cos\theta$ et $\sin\theta$ en fonction de $t = \tan\frac{\theta}{2}$, montrer que $G$ est infini. Donner quatre éléments de $G$ qui ne sont ni réels ni imaginaires purs.

    **2.** Montrer que le produit de deux éléments de $G$ appartient à $G$, et que $\{z^{2} \mid z \in G\}$ est infini.

    **3.** Soit $u = \mathrm{e}^{\mathrm{i}\alpha}$ et $v = \mathrm{e}^{\mathrm{i}\beta}$ deux éléments de $G$. Montrer que $|u^{2} - v^{2}| = 2|\sin(\alpha - \beta)|$ est rationnel.

    **4.** En déduire que, pour tout entier $n \geqslant 3$, il existe $n$ points du plan, non tous alignés, dont les distances mutuelles sont toutes des entiers.
  corrige: |
    **1.** Pour $t \in \mathbb{Q}$, le complexe $\frac{1 - t^{2}}{1 + t^{2}} + \mathrm{i}\,\frac{2t}{1 + t^{2}} = \frac{1 + \mathrm{i} t}{1 - \mathrm{i} t}$ est de module $1$, et ses parties réelle et imaginaire sont rationnelles. D'après l'exercice 45, l'application $t \mapsto \frac{1 + \mathrm{i} t}{1 - \mathrm{i} t}$ est injective ; comme $\mathbb{Q}$ est infini, $\boxed{G \text{ est infini}}$. Avec $t = \frac{1}{2}$, $\frac{1}{3}$, $\frac{1}{4}$, $\frac{1}{5}$ : 
    $$\boxed{\frac{3}{5} + \frac{4}{5}\mathrm{i},\quad \frac{4}{5} + \frac{3}{5}\mathrm{i},\quad \frac{15}{17} + \frac{8}{17}\mathrm{i},\quad \frac{12}{13} + \frac{5}{13}\mathrm{i}}$$

    **2.** Si $z = a + \mathrm{i} b$ et $z' = c + \mathrm{i} d$ sont dans $G$, alors $zz' = (ac - bd) + \mathrm{i}(ad + bc)$ a des parties rationnelles et un module égal à $1$. L'application $z \mapsto z^{2}$ de $G$ dans $G$ a des fibres d'au plus deux éléments, puisque $z^{2} = z'^{2}$ implique $z' = \pm z$ ; si son image était finie, de cardinal $m$, $G$ aurait au plus $2m$ éléments, d'après le lemme des bergers du chapitre 2. $\boxed{\{z^{2} \mid z \in G\} \text{ est infini}}$

    **3.** L'angle moitié, comme à l'exercice 54, donne $|\mathrm{e}^{2\mathrm{i}\alpha} - \mathrm{e}^{2\mathrm{i}\beta}| = 2|\sin(\alpha - \beta)|$, et 
    $$\sin(\alpha - \beta) = \sin\alpha\cos\beta - \cos\alpha\sin\beta \in \mathbb{Q},$$
     puisque les quatre nombres $\cos\alpha$, $\sin\alpha$, $\cos\beta$, $\sin\beta$ sont rationnels. $\boxed{|u^{2} - v^{2}| \in \mathbb{Q}}$

    **4.** On choisit $n$ éléments distincts $w_{1} = u_{1}^{2}, \dots, w_{n} = u_{n}^{2}$ de $\{z^{2} \mid z \in G\}$, ce qui est possible d'après la question 2. Leurs distances mutuelles $|w_{k} - w_{\ell}|$ sont des rationnels, d'après la question 3 ; soit $D$ un dénominateur commun à ces $\frac{n(n-1)}{2}$ rationnels. Les points d'affixes $Dw_{1}, \dots, Dw_{n}$ ont alors des distances mutuelles entières. Ils sont situés sur le cercle de centre $O$ et de rayon $D$, et trois points distincts d'un cercle ne sont jamais alignés, car une droite coupe un cercle en au plus deux points. 
    $$\boxed{\text{pour tout } n \geqslant 3, \text{ il existe } n \text{ points non alignés à distances mutuelles entières}}$$
     Par exemple, avec $t = \frac{1}{2}$ et $t = \frac{1}{3}$, les carrés $\big(\frac{3 + 4\mathrm{i}}{5}\big)^{2} = \frac{-7 + 24\mathrm{i}}{25}$ et $\big(\frac{4 + 3\mathrm{i}}{5}\big)^{2} = \frac{7 + 24\mathrm{i}}{25}$ sont à distance $\frac{14}{25}$ ; avec $1 = 1^{2}$, les trois distances valent $\frac{14}{25}$, $\frac{6}{5}$ et $\frac{8}{5}$, et le facteur $D = 25$ donne un triangle de côtés $14$, $30$ et $40$. Un théorème d'Erdős affirme qu'une telle famille ne peut pas être infinie si les points ne sont pas alignés : la construction de l'exercice ne fonctionne que pour un nombre fini de points.
- id: "ma-04-60"
  feuille: "f-ma-04"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration, Calcul]
  mots_cles: [trigonométrie, module, "racines de l'unité", argument, groupe 𝕌, sommes trigonométriques]
  noeuds: [cx-pi, c-calcul, cx-exponentielle, n-sommes]
  notions: [pi, module-complexe]
  page_enonce: 13
  page_corrige: 25
  enonce: |
    Cet exercice prolonge l'exercice 58 : on montre que la meilleure constante possible est $\frac{1}{\pi}$. On fixe un entier pair $N = 2p \geqslant 2$, on pose $\theta_{m} = \dfrac{2m\pi}{N}$ pour $m \in \mathbb{Z}$, et, pour un réel $x$, $x^{+} = \max(x, 0)$.

    **1.** Soit $\alpha$ un réel.

    **(a)** Justifier l'existence d'un entier $r$ tel que $\theta_{r} \in \Big[\alpha - \dfrac{\pi}{2}\,,\alpha - \dfrac{\pi}{2} + \dfrac{\pi}{p}\Big[$, puis déterminer le signe de $\cos(\alpha - \theta_{r+k})$ selon que $k \in [\![0\,;p-1]\!]$ ou $k \in [\![p\,;2p-1]\!]$.

    **(b)** En déduire, à l'aide de la proposition 15 du cours, que 
    $$\sum_{m=0}^{N-1} \cos^{+}(\alpha - \theta_{m}) = \frac{\sin\psi}{\sin(\pi/N)}, \qquad\text{où}\qquad \psi = \alpha - \theta_{r} + \frac{\pi}{N},$$
     puis l'encadrement 
    $$\frac{\cos(\pi/N)}{\sin(\pi/N)} \leqslant \sum_{m=0}^{N-1} \cos^{+}(\alpha - \theta_{m}) \leqslant \frac{1}{\sin(\pi/N)}.$$

    **2.** Soit $z_{1}, \dots, z_{n}$ des complexes, que l'on écrit $z_{k} = |z_{k}|\,\mathrm{e}^{\mathrm{i}\alpha_{k}}$, et $S = \sum |z_{k}|$. Pour $m \in [\![0\,;N-1]\!]$, on note $I_{m} = \{k \mid \operatorname{Re}(z_{k}\mathrm{e}^{-\mathrm{i}\theta_{m}}) > 0\}$.

    **(a)** Montrer qu'il existe un entier $m$ tel que $\Big|\displaystyle\sum_{k \in I_{m}} z_{k}\Big| \geqslant c_{N}\,S$, avec $c_{N} = \dfrac{\cos(\pi/N)}{N\sin(\pi/N)}$.

    **(b)** Déterminer la limite de $c_{N}$ lorsque $N$ tend vers $+\infty$. En remarquant que $[\![1\,;n]\!]$ n'a qu'un nombre fini de parties, en déduire qu'il existe une partie $I$ telle que $\Big|\displaystyle\sum_{k \in I} z_{k}\Big| \geqslant \dfrac{S}{\pi}$.

    **3.** On prend pour $z_{1}, \dots, z_{N}$ les éléments de $\mathbb{U}_{N}$.

    **(a)** Montrer que le module de toute somme partielle est au plus $\dfrac{1}{\sin(\pi/N)}$. *On pourra multiplier une somme partielle non nulle par $\mathrm{e}^{-\mathrm{i}\alpha}$, où $\alpha$ est l'un de ses arguments.*

    **(b)** En déduire qu'aucune constante strictement supérieure à $\frac{1}{\pi}$ ne convient dans l'exercice 58.

    **(c)** Pour $N = 6$, déterminer la plus grande somme partielle des éléments de $\mathbb{U}_{6}$, et la comparer aux bornes obtenues.
  corrige: |
    **1. (a)** Les $\theta_{m}$ sont espacés de $\frac{\pi}{p}$, et l'intervalle proposé, de longueur $\frac{\pi}{p}$, contient donc exactement un $\theta_{r}$. Pour $k \in [\![0\,;2p-1]\!]$, on a $\theta_{r+k} = \theta_{r} + \frac{k\pi}{p}$.

    • Si $k \in [\![0\,;p-1]\!]$, alors $\theta_{r+k} \in [\alpha - \frac{\pi}{2}\,,\alpha + \frac{\pi}{2}[$, donc $\alpha - \theta_{r+k} \in \,]-\frac{\pi}{2}\,,\frac{\pi}{2}]$ et $\boxed{\cos(\alpha - \theta_{r+k}) \geqslant 0}$

    • Si $k \in [\![p\,;2p-1]\!]$, alors $\alpha - \theta_{r+k} \in \,]-\frac{3\pi}{2}\,,-\frac{\pi}{2}]$ et $\boxed{\cos(\alpha - \theta_{r+k}) \leqslant 0}$

    **(b)** Les indices $r, \dots, r + N - 1$ décrivent tous les restes modulo $N$, et $\theta_{m + N} = \theta_{m} + 2\pi$ : la somme ne change pas si l'on fait varier $m$ de $r$ à $r + N - 1$. D'après (a), seuls les $p$ premiers termes sont non nuls, et la somme géométrique, avec $\mathrm{e}^{-\mathrm{i} p\pi/p} = -1$, puis l'angle moitié $1 - \mathrm{e}^{-\mathrm{i}\pi/p} = 2\mathrm{i}\sin\frac{\pi}{N}\,\mathrm{e}^{-\mathrm{i}\pi/N}$, donne 
    $$\sum_{k=0}^{p-1} \cos\Big(\alpha - \theta_{r} - \frac{k\pi}{p}\Big) = \operatorname{Re}\Big(\mathrm{e}^{\mathrm{i}(\alpha - \theta_{r})}\,\frac{1 - \mathrm{e}^{-\mathrm{i}\pi}}{1 - \mathrm{e}^{-\mathrm{i}\pi/p}}\Big) = \operatorname{Re}\Big(\frac{\mathrm{e}^{\mathrm{i}\psi}}{\mathrm{i}\sin(\pi/N)}\Big).$$

    $$\boxed{\sum_{m=0}^{N-1} \cos^{+}(\alpha - \theta_{m}) = \frac{\sin\psi}{\sin(\pi/N)}}$$
     Le choix de $r$ donne $\alpha - \theta_{r} \in \,]\frac{\pi}{2} - \frac{2\pi}{N}\,,\frac{\pi}{2}]$, donc $\psi \in \,]\frac{\pi}{2} - \frac{\pi}{N}\,,\frac{\pi}{2} + \frac{\pi}{N}]$, et $\cos\frac{\pi}{N} \leqslant \sin\psi \leqslant 1$, d'où l'encadrement annoncé.

    **2. (a)** Comme à la question 2 de l'exercice 58, on minore le module par la partie réelle après rotation : 
    $$\Big|\sum_{k \in I_{m}} z_{k}\Big| \geqslant \operatorname{Re}\Big(\mathrm{e}^{-\mathrm{i}\theta_{m}}\sum_{k \in I_{m}} z_{k}\Big) = \sum_{k=1}^{n} |z_{k}|\cos^{+}(\alpha_{k} - \theta_{m}),$$
     les termes d'indice hors de $I_{m}$ ayant un $\cos^{+}$ nul. En sommant sur $m$, en intervertissant les deux sommes, puis en appliquant la question 1 à chaque $\alpha_{k}$, 
    $$\sum_{m=0}^{N-1} \Big|\sum_{k \in I_{m}} z_{k}\Big| \geqslant \sum_{k=1}^{n} |z_{k}|\sum_{m=0}^{N-1} \cos^{+}(\alpha_{k} - \theta_{m}) \geqslant \frac{\cos(\pi/N)}{\sin(\pi/N)}\,S.$$
     L'un des $N$ termes de la somme de gauche est au moins égal à leur moyenne : 
    $$\boxed{\Big|\sum_{k \in I_{m}} z_{k}\Big| \geqslant c_{N}S \ \text{ pour un } m}$$

    **(b)** On écrit $c_{N} = \frac{1}{\pi}\cdot\frac{\pi/N}{\sin(\pi/N)}\cdot\cos\frac{\pi}{N}$ ; la proposition 6 du cours donne $\frac{\sin x}{x} \to 1$ et $\cos x \to 1$ quand $x \to 0$, d'où $\boxed{c_{N} \xrightarrow[N \to +\infty]{} \frac{1}{\pi}}$

    Pour chaque $N$ pair, la question précédente fournit une partie $J_{N}$ de $[\![1\,;n]\!]$ telle que $\big|\sum_{k \in J_{N}} z_{k}\big| \geqslant c_{N}S$. Ces parties sont en nombre fini, $2^{n}$ au plus, alors que les $N$ pairs sont en nombre infini : l'une d'elles, $I$, est égale à $J_{N}$ pour une infinité de valeurs de $N$. Si l'on avait $\big|\sum_{k \in I} z_{k}\big| < \frac{S}{\pi}$, on aurait aussi $\big|\sum_{k \in I} z_{k}\big| < c_{N}S$ pour tout $N$ assez grand, puisque $c_{N}S$ tend vers $\frac{S}{\pi}$, ce qui contredit le choix de $I$. 
    $$\boxed{\text{il existe } I \subset [\![1\,;n]\!] \text{ tel que } \Big|\sum_{k \in I} z_{k}\Big| \geqslant \frac{1}{\pi}\sum_{k=1}^{n} |z_{k}|}$$
     *À retenir :* ce raisonnement par finitude permet de passer d'une famille de constantes qui s'approchent de $\frac{1}{\pi}$ à la constante $\frac{1}{\pi}$ elle-même. Le chapitre 7 le formalisera par le passage à la limite dans les inégalités.

    **3. (a)** Ici $z_{k} = \mathrm{e}^{\mathrm{i}\theta_{k}}$, et $S = N$. Soit $I$ une partie de somme $\sigma \neq 0$, que l'on écrit $\sigma = |\sigma|\,\mathrm{e}^{\mathrm{i}\alpha}$. Chaque terme vérifie $\operatorname{Re}(z_{k}\mathrm{e}^{-\mathrm{i}\alpha}) = \cos(\theta_{k} - \alpha) \leqslant \cos^{+}(\alpha - \theta_{k})$, et la question 1 donne 
    $$|\sigma| = \operatorname{Re}\Big(\mathrm{e}^{-\mathrm{i}\alpha}\sum_{k \in I} z_{k}\Big) \leqslant \sum_{m=0}^{N-1} \cos^{+}(\alpha - \theta_{m}) \leqslant \boxed{\frac{1}{\sin(\pi/N)}}.$$

    **(b)** Le rapport $\frac{|\sigma|}{S}$ est donc au plus $\frac{1}{N\sin(\pi/N)}$, qui tend vers $\frac{1}{\pi}$. Pour une constante $c > \frac{1}{\pi}$, on choisit $N$ pair assez grand pour que $\frac{1}{N\sin(\pi/N)} < c$ : la famille $\mathbb{U}_{N}$ n'a aucune partie de somme au moins égale à $cS$. $\boxed{\text{la meilleure constante est } \frac{1}{\pi}}$

    **(c)** Les bornes valent $\frac{\cos(\pi/6)}{\sin(\pi/6)} = \sqrt{3} \approx 1{,}73$ et $\frac{1}{\sin(\pi/6)} = 2$. Trois racines consécutives donnent $1 + \mathrm{e}^{\mathrm{i}\pi/3} + \mathrm{e}^{2\mathrm{i}\pi/3} = 1 + \mathrm{i}\sqrt{3}$, de module $2$, ce qui atteint la borne supérieure : 
    $$\boxed{\max_{I} \Big|\sum_{k \in I} z_{k}\Big| = 2 = \frac{S}{3}} \qquad\text{avec}\qquad \frac{1}{3} > \frac{1}{\pi} \approx 0{,}318.$$
     Plus généralement, la plus grande somme partielle de $\mathbb{U}_{N}$ est atteinte par $\frac{N}{2}$ racines consécutives et vaut exactement $\frac{1}{\sin(\pi/N)}$ ; pour $N = 12$, le rapport vaut déjà $0{,}322$. Le facteur $\frac{1}{\pi}$ est la valeur moyenne de $\cos^{+}$ sur une période, que le chapitre 18 écrira $\frac{1}{2\pi}\int_{-\pi/2}^{\pi/2} \cos t\,\mathrm{d}t$ : la démonstration en est une version discrète.

