  enonce: |
    Soit $n \geqslant 2$ un entier. Montrer que 
    $$\sum_{k=1}^{n-1} \sin\frac{k\pi}{n} = \frac{\cos\dfrac{\pi}{2n}}{\sin\dfrac{\pi}{2n}}.$$
     Vérifier la formule pour $n = 2$ et $n = 3$.
  corrige: |
    On applique la proposition 15 du cours avec $n - 1$ termes non nuls et l'angle $t = \frac{\pi}{n} \not\equiv 0\ [2\pi]$ ; le terme d'indice $0$ est nul. 
    $$\sum_{k=1}^{n-1} \sin\frac{k\pi}{n} = \frac{\sin\frac{(n-1)\pi}{2n}\,\sin\frac{\pi}{2}}{\sin\frac{\pi}{2n}} = \boxed{\frac{\cos\frac{\pi}{2n}}{\sin\frac{\pi}{2n}}},$$
     puisque $\sin(\frac{\pi}{2} - \frac{\pi}{2n}) = \cos\frac{\pi}{2n}$. Pour $n = 2$, les deux membres valent $1$ ; pour $n = 3$, ils valent $\sin\frac{\pi}{3} + \sin\frac{2\pi}{3} = \sqrt{3} = \frac{\cos(\pi/6)}{\sin(\pi/6)}$ ✓.
- id: "ma-04-24"
  feuille: "f-ma-04"
  numero: 24
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["formules d'Euler et de Moivre", trigonométrie, groupe 𝕌]
  noeuds: [cx-exponentielle, cx-pi, c-calcul]
  notions: [exponentielle, pi]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $u$, $v$ et $w$ trois éléments de $\mathbb{U}$. Montrer que $|u + v + w| = |uv + vw + wu|$.

    **2.** Soit $x$, $y$ et $z$ trois réels tels que $\mathrm{e}^{\mathrm{i} x} + \mathrm{e}^{\mathrm{i} y} + \mathrm{e}^{\mathrm{i} z} = 0$. Montrer que $\mathrm{e}^{2\mathrm{i} x} + \mathrm{e}^{2\mathrm{i} y} + \mathrm{e}^{2\mathrm{i} z} = 0$, puis que 
    $$\cos(2x) + \cos(2y) + \cos(2z) = 0 \qquad\text{et}\qquad \cos^{2} x + \cos^{2} y + \cos^{2} z = \frac{3}{2}.$$
  corrige: |
    **1.** Pour $u \in \mathbb{U}$, $\frac{1}{u} = \overline{u}$. En factorisant par $uvw$, de module $1$, 
    $$|uv + vw + wu| = |uvw|\,\Big|\frac{1}{w} + \frac{1}{u} + \frac{1}{v}\Big| = |\overline{u} + \overline{v} + \overline{w}| = \boxed{|u + v + w|}.$$

    **2.** Avec $u = \mathrm{e}^{\mathrm{i} x}$, $v = \mathrm{e}^{\mathrm{i} y}$, $w = \mathrm{e}^{\mathrm{i} z}$, on a $u + v + w = 0$, donc $uv + vw + wu = 0$ par la question 1, et 
    $$u^{2} + v^{2} + w^{2} = (u + v + w)^{2} - 2(uv + vw + wu) = \boxed{0}.$$
     La partie réelle donne $\cos(2x) + \cos(2y) + \cos(2z) = 0$, puis, avec $\cos^{2} a = \frac{1 + \cos(2a)}{2}$, 
    $$\boxed{\cos^{2} x + \cos^{2} y + \cos^{2} z = \frac{3}{2}}$$
     On verra à l'exercice 51 que $u$, $v$, $w$ sont alors les sommets d'un triangle équilatéral, ce qui rend ce résultat visible.
- id: "ma-04-25"
  feuille: "f-ma-04"
  numero: 25
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["formules d'Euler et de Moivre", trigonométrie, argument, groupe 𝕌]
  noeuds: [cx-exponentielle, cx-pi, c-calcul]
  notions: [exponentielle, pi]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $z$ et $z'$ deux éléments de $\mathbb{U}$ tels que $zz' \neq -1$. Montrer que $\dfrac{z + z'}{1 + zz'}$ est réel.

    **2.** Soit $z \in \mathbb{U} \setminus \{1\}$. Montrer que $\mathrm{i}\,\dfrac{1 + z}{1 - z}$ est réel.

    **3.** Réciproquement, soit $z \in \mathbb{U} \setminus \{-1\}$. Montrer qu'il existe un unique réel $a$ tel que $z = \dfrac{1 + \mathrm{i} a}{1 - \mathrm{i} a}$, et l'exprimer à l'aide d'un argument de $z$. Relier ce résultat aux formules en $t = \tan\frac{\theta}{2}$ du cours.
  corrige: |
    **1.** Un complexe est réel s'il est égal à son conjugué. Avec $\overline{z} = \frac{1}{z}$ et $\overline{z'} = \frac{1}{z'}$, 
    $$\overline{\Big(\frac{z + z'}{1 + zz'}\Big)} = \frac{\frac{1}{z} + \frac{1}{z'}}{1 + \frac{1}{zz'}} = \frac{z' + z}{zz' + 1}, \qquad\text{donc}\qquad \boxed{\frac{z + z'}{1 + zz'} \in \mathbb{R}}.$$

    **2.** On écrit $z = \mathrm{e}^{\mathrm{i}\theta}$ avec $\theta \not\equiv 0\ [2\pi]$, et l'angle moitié donne 
    $$\frac{1 + z}{1 - z} = \frac{2\cos\frac{\theta}{2}\;\mathrm{e}^{\mathrm{i}\theta/2}}{-2\mathrm{i}\sin\frac{\theta}{2}\;\mathrm{e}^{\mathrm{i}\theta/2}} = \mathrm{i}\,\frac{\cos(\theta/2)}{\sin(\theta/2)}, \qquad \boxed{\mathrm{i}\,\frac{1 + z}{1 - z} = -\frac{\cos(\theta/2)}{\sin(\theta/2)} \in \mathbb{R}}.$$

    **3.** Pour $z \neq -1$, l'équation $z = \frac{1 + \mathrm{i} a}{1 - \mathrm{i} a}$ équivaut à $z - 1 = \mathrm{i} a(z + 1)$, soit à $a = \frac{z - 1}{\mathrm{i}(z + 1)}$, ce qui prouve l'unicité. Avec $z = \mathrm{e}^{\mathrm{i}\theta}$, $\theta \in \,]-\pi\,,\pi[$, l'angle moitié donne $\frac{z - 1}{z + 1} = \mathrm{i}\tan\frac{\theta}{2}$. 
    $$\boxed{a = \tan\frac{\theta}{2} \in \mathbb{R}}$$
     On retrouve les formules de la proposition 8 du cours : $\frac{1 + \mathrm{i} a}{1 - \mathrm{i} a} = \frac{(1 + \mathrm{i} a)^{2}}{1 + a^{2}} = \frac{1 - a^{2}}{1 + a^{2}} + \mathrm{i}\,\frac{2a}{1 + a^{2}}$, dont les parties réelle et imaginaire sont $\cos\theta$ et $\sin\theta$ exprimés en fonction de $t = a = \tan\frac{\theta}{2}$.
- id: "ma-04-26"
  feuille: "f-ma-04"
  numero: 26
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 2
