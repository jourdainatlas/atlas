  page_enonce: 6
  page_corrige: 11
  enonce: |
    Montrer que l'ensemble des complexes non nuls $z$ tels que $z + \dfrac{1}{z}$ est réel est la réunion $\mathbb{U} \cup \mathbb{R}^{*}$.
  corrige: |
    Pour $z \neq 0$, $z + \frac{1}{z}$ est réel si et seulement s'il est égal à son conjugué : 
    $$z + \frac{1}{z} = \overline{z} + \frac{1}{\overline{z}} \iff (z - \overline{z}) - \frac{z - \overline{z}}{z\overline{z}} = 0 \iff (z - \overline{z})\Big(1 - \frac{1}{|z|^{2}}\Big) = 0.$$
     Le premier facteur est nul si et seulement si $z$ est réel, le second si et seulement si $|z| = 1$. 
    $$\boxed{\Big\{z \in \mathbb{C}^{*} \ \Big|\ z + \frac{1}{z} \in \mathbb{R}\Big\} = \mathbb{U} \cup \mathbb{R}^{*}}$$
     Pour $z = \mathrm{e}^{\mathrm{i}\theta} \in \mathbb{U}$, on a d'ailleurs $z + \frac{1}{z} = 2\cos\theta$ : c'est la formule d'Euler.
- id: "ma-04-27"
  feuille: "f-ma-04"
  numero: 27
  partie: "Forme trigonométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [forme trigonométrique, trigonométrie]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [module-complexe, pi]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Écrire les nombres complexes suivants sous forme trigonométrique ($x$ est un réel).

    **(a)** $1 + \mathrm{i}\sqrt{3}$

    **(b)** $-3$

    **(c)** $9\mathrm{i}$

    **(d)** $\dfrac{-\mathrm{i}\sqrt{2}}{1 + \mathrm{i}}$

    **(e)** $\dfrac{(1 + \mathrm{i}\sqrt{3})^{3}}{(1 - \mathrm{i})^{5}}$

    **(f)** $\sin x + \mathrm{i}\cos x$
  corrige: |
    On calcule le module, puis l'on reconnaît un angle connu ; pour les produits et les quotients, on combine modules et arguments.

    • **(a)** $\boxed{1 + \mathrm{i}\sqrt{3} = 2\,\mathrm{e}^{\mathrm{i}\pi/3}}$ **(b)** $\boxed{-3 = 3\,\mathrm{e}^{\mathrm{i}\pi}}$ **(c)** $\boxed{9\mathrm{i} = 9\,\mathrm{e}^{\mathrm{i}\pi/2}}$

    • **(d)** $\dfrac{\sqrt{2}\,\mathrm{e}^{-\mathrm{i}\pi/2}}{\sqrt{2}\,\mathrm{e}^{\mathrm{i}\pi/4}}$ : $\boxed{\dfrac{-\mathrm{i}\sqrt{2}}{1 + \mathrm{i}} = \mathrm{e}^{-3\mathrm{i}\pi/4}}$

    • **(e)** $\dfrac{8\,\mathrm{e}^{\mathrm{i}\pi}}{(\sqrt{2})^{5}\,\mathrm{e}^{-5\mathrm{i}\pi/4}} = \sqrt{2}\,\mathrm{e}^{9\mathrm{i}\pi/4}$ : $\boxed{\dfrac{(1 + \mathrm{i}\sqrt{3})^{3}}{(1 - \mathrm{i})^{5}} = \sqrt{2}\,\mathrm{e}^{\mathrm{i}\pi/4}}$, c'est-à-dire $1 + \mathrm{i}$.

    • **(f)** $\sin x + \mathrm{i}\cos x = \mathrm{i}(\cos x - \mathrm{i}\sin x) = \mathrm{e}^{\mathrm{i}\pi/2}\mathrm{e}^{-\mathrm{i} x}$ : $\boxed{\sin x + \mathrm{i}\cos x = \mathrm{e}^{\mathrm{i}(\pi/2 - x)}}$

    *Piège :* en (f), on est tenté de lire « module $1$, argument $x$ » ; c'est faux, les rôles du cosinus et du sinus étant échangés.
- id: "ma-04-28"
  feuille: "f-ma-04"
  numero: 28
  partie: "Forme trigonométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [forme trigonométrique]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [module-complexe]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    **1.** Écrire sous forme algébrique $(1 + \mathrm{i})^{18}$, $\Big(\dfrac{1 + \mathrm{i}\sqrt{3}}{1 - \mathrm{i}}\Big)^{20}$ et $\dfrac{(1 - \mathrm{i})^{10}(\sqrt{3} + \mathrm{i})^{5}}{(-1 - \mathrm{i}\sqrt{3})^{10}}$.

    **2.** Déterminer les entiers naturels $n$ tels que $(1 + \mathrm{i}\sqrt{3})^{n}$ soit un réel positif, puis ceux tels que $(\sqrt{3} + \mathrm{i})^{n}$ soit imaginaire pur.
  corrige: |
    **1.** On passe en forme trigonométrique avant d'élever à la puissance. 
    $$(1 + \mathrm{i})^{18} = 2^{9}\,\mathrm{e}^{18\mathrm{i}\pi/4} = 2^{9}\,\mathrm{e}^{\mathrm{i}\pi/2}, \qquad \Big(\frac{2\,\mathrm{e}^{\mathrm{i}\pi/3}}{\sqrt{2}\,\mathrm{e}^{-\mathrm{i}\pi/4}}\Big)^{20} = 2^{10}\,\mathrm{e}^{35\mathrm{i}\pi/3} = 2^{10}\,\mathrm{e}^{-\mathrm{i}\pi/3},$$

    $$\frac{2^{5}\,\mathrm{e}^{-5\mathrm{i}\pi/2} \times 2^{5}\,\mathrm{e}^{5\mathrm{i}\pi/6}}{2^{10}\,\mathrm{e}^{-20\mathrm{i}\pi/3}} = \mathrm{e}^{\mathrm{i}(-5\pi/2 + 5\pi/6 + 20\pi/3)} = \mathrm{e}^{5\mathrm{i}\pi}.$$

    $$\boxed{(1 + \mathrm{i})^{18} = 512\,\mathrm{i} \qquad \Big(\frac{1 + \mathrm{i}\sqrt{3}}{1 - \mathrm{i}}\Big)^{20} = 512 - 512\sqrt{3}\,\mathrm{i} \qquad \frac{(1 - \mathrm{i})^{10}(\sqrt{3} + \mathrm{i})^{5}}{(-1 - \mathrm{i}\sqrt{3})^{10}} = -1}$$

    **2.** On a $(1 + \mathrm{i}\sqrt{3})^{n} = 2^{n}\,\mathrm{e}^{\mathrm{i} n\pi/3}$, réel positif si et seulement si $\frac{n\pi}{3} \equiv 0\ [2\pi]$ ; et $(\sqrt{3} + \mathrm{i})^{n} = 2^{n}\,\mathrm{e}^{\mathrm{i} n\pi/6}$, imaginaire pur si et seulement si $\frac{n\pi}{6} \equiv \frac{\pi}{2}\ [\pi]$. 
    $$\boxed{n \equiv 0\ [6] \qquad\text{et}\qquad n \equiv 3\ [6]}$$
- id: "ma-04-29"
  feuille: "f-ma-04"
  numero: 29
  partie: "Forme trigonométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [forme trigonométrique, trigonométrie]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [module-complexe, pi]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $a$ et $b$ deux réels de l'intervalle $]0\,,\pi[$ et $\theta$ un réel tel que $\theta \not\equiv \pi\ [2\pi]$.

    **1.** Écrire sous forme trigonométrique $1 + \mathrm{e}^{\mathrm{i} a}$, $1 - \mathrm{e}^{\mathrm{i} a}$, $\mathrm{e}^{\mathrm{i} a} + \mathrm{e}^{\mathrm{i} b}$ et $\dfrac{1 + \mathrm{e}^{\mathrm{i} a}}{1 + \mathrm{e}^{\mathrm{i} b}}$, en vérifiant le signe des facteurs réels obtenus.

    **2.** Simplifier $\dfrac{1 + \cos\theta + \mathrm{i}\sin\theta}{1 + \cos\theta - \mathrm{i}\sin\theta}$.
  corrige: |
    **1.** On factorise par l'exponentielle de l'angle moyen. Comme $\frac{a}{2}$, $\frac{b}{2} \in \,]0\,,\frac{\pi}{2}[$ et $\frac{a - b}{2} \in \,]-\frac{\pi}{2}\,,\frac{\pi}{2}[$, les cosinus et sinus qui apparaissent sont strictement positifs, et les écritures suivantes sont bien des formes trigonométriques. 
    $$\boxed{1 + \mathrm{e}^{\mathrm{i} a} = 2\cos\frac{a}{2}\,\mathrm{e}^{\mathrm{i} a/2} \qquad 1 - \mathrm{e}^{\mathrm{i} a} = 2\sin\frac{a}{2}\,\mathrm{e}^{\mathrm{i}(a - \pi)/2} \qquad \mathrm{e}^{\mathrm{i} a} + \mathrm{e}^{\mathrm{i} b} = 2\cos\frac{a - b}{2}\,\mathrm{e}^{\mathrm{i}(a + b)/2}}$$

    $$\boxed{\frac{1 + \mathrm{e}^{\mathrm{i} a}}{1 + \mathrm{e}^{\mathrm{i} b}} = \frac{\cos(a/2)}{\cos(b/2)}\,\mathrm{e}^{\mathrm{i}(a - b)/2}}$$
     Pour la deuxième, on a écrit $-\mathrm{i} = \mathrm{e}^{-\mathrm{i}\pi/2}$.

    **2.** Le numérateur est $1 + \mathrm{e}^{\mathrm{i}\theta}$ et le dénominateur son conjugué ; comme $\cos\frac{\theta}{2} \neq 0$, 
    $$\frac{1 + \mathrm{e}^{\mathrm{i}\theta}}{1 + \mathrm{e}^{-\mathrm{i}\theta}} = \frac{2\cos\frac{\theta}{2}\,\mathrm{e}^{\mathrm{i}\theta/2}}{2\cos\frac{\theta}{2}\,\mathrm{e}^{-\mathrm{i}\theta/2}} = \boxed{\mathrm{e}^{\mathrm{i}\theta}}.$$
- id: "ma-04-30"
  feuille: "f-ma-04"
  numero: 30
  partie: "Forme trigonométrique"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [forme trigonométrique]
  noeuds: [cx-exponentielle, cx-pi]
  notions: [module-complexe]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **1.** Soit $n \in \mathbb{N}$. Calculer $(1 + \mathrm{i}\sqrt{3})^{n} + (1 - \mathrm{i}\sqrt{3})^{n}$, et en déduire que ce nombre est un entier relatif divisible par $2^{n}$.

    **2.** Montrer, sans développer, que $(2 + \mathrm{i}\sqrt{5})^{7} + (2 - \mathrm{i}\sqrt{5})^{7}$ est réel.

    **3.** Montrer que, pour tout $n \in \mathbb{N}$, $\Big(\dfrac{19 + 7\mathrm{i}}{9 - \mathrm{i}}\Big)^{n} + \Big(\dfrac{20 + 5\mathrm{i}}{7 + 6\mathrm{i}}\Big)^{n}$ est réel.
  corrige: |
    **1.** Les deux termes sont conjugués : $(1 + \mathrm{i}\sqrt{3})^{n} + (1 - \mathrm{i}\sqrt{3})^{n} = 2\operatorname{Re}\big(2^{n}\,\mathrm{e}^{\mathrm{i} n\pi/3}\big)$. 
    $$\boxed{(1 + \mathrm{i}\sqrt{3})^{n} + (1 - \mathrm{i}\sqrt{3})^{n} = 2^{n+1}\cos\frac{n\pi}{3} = 2^{n} \times 2\cos\frac{n\pi}{3}}$$
     Le nombre $2\cos\frac{n\pi}{3}$ ne prend que les valeurs $2$, $1$, $-1$, $-2$ : c'est un entier, et le résultat est un multiple entier de $2^{n}$.

    **2.** Le conjugué de $(2 + \mathrm{i}\sqrt{5})^{7}$ est $(2 - \mathrm{i}\sqrt{5})^{7}$, et $z + \overline{z} = 2\operatorname{Re} z$ est réel. Le développement donne d'ailleurs $4036$.

    **3.** On calcule $\frac{19 + 7\mathrm{i}}{9 - \mathrm{i}} = \frac{(19 + 7\mathrm{i})(9 + \mathrm{i})}{82} = 2 + \mathrm{i}$ et $\frac{20 + 5\mathrm{i}}{7 + 6\mathrm{i}} = \frac{(20 + 5\mathrm{i})(7 - 6\mathrm{i})}{85} = 2 - \mathrm{i}$, qui sont conjugués. La somme vaut donc $2\operatorname{Re}\big((2 + \mathrm{i})^{n}\big)$ : $\boxed{\text{elle est réelle}}$

    *À retenir :* pour montrer qu'un nombre est réel, on cherche à l'écrire $z + \overline{z}$, ou à vérifier qu'il est égal à son conjugué ; le calcul est presque toujours plus court que le développement.
- id: "ma-04-31"
  feuille: "f-ma-04"
  numero: 31
  partie: "Équations algébriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations algébriques, trigonométrie, équations du second degré]
  noeuds: [c-racines-carrees, cx-pi]
  notions: [nombre-complexe, pi]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Déterminer, sous forme algébrique, les racines carrées des nombres complexes suivants.

    **(a)** $\mathrm{i}$

    **(b)** $3 - 4\mathrm{i}$

    **(c)** $8 - 6\mathrm{i}$

    **(d)** $24 - 10\mathrm{i}$

    **(e)** $1 + 2\mathrm{i}$

    Calculer de même les racines carrées de $\mathrm{e}^{\mathrm{i}\pi/4} = \dfrac{\sqrt{2}}{2}(1 + \mathrm{i})$, en déduire $\cos\dfrac{\pi}{8}$ et $\sin\dfrac{\pi}{8}$, et comparer avec l'exercice 5.
  corrige: |
    On résout le système de la proposition 20 du cours, $x^{2} - y^{2} = a$, $x^{2} + y^{2} = |w|$, $2xy = b$.

    • **(a)** $x^{2} = y^{2} = \frac{1}{2}$ et $xy > 0$ : $\boxed{\pm\dfrac{\sqrt{2}}{2}(1 + \mathrm{i})}$

    • **(b)** $|w| = 5$, $x^{2} = 4$, $y^{2} = 1$, $xy < 0$ : $\boxed{\pm(2 - \mathrm{i})}$ **(c)** $|w| = 10$, $x^{2} = 9$, $y^{2} = 1$, $xy < 0$ : $\boxed{\pm(3 - \mathrm{i})}$

    • **(d)** $|w| = 26$, $x^{2} = 25$, $y^{2} = 1$, $xy < 0$ : $\boxed{\pm(5 - \mathrm{i})}$

    • **(e)** $|w| = \sqrt{5}$, $x^{2} = \frac{\sqrt{5} + 1}{2}$, $y^{2} = \frac{\sqrt{5} - 1}{2}$, $xy > 0$ : $\boxed{\pm\Big(\sqrt{\dfrac{\sqrt{5} + 1}{2}} + \mathrm{i}\sqrt{\dfrac{\sqrt{5} - 1}{2}}\Big)}$

    Pour $w = \mathrm{e}^{\mathrm{i}\pi/4}$, on a $|w| = 1$ et $a = b = \frac{\sqrt{2}}{2}$, d'où $x^{2} = \frac{2 + \sqrt{2}}{4}$, $y^{2} = \frac{2 - \sqrt{2}}{4}$ et $xy > 0$. Or les racines carrées de $w$ sont aussi $\pm\mathrm{e}^{\mathrm{i}\pi/8}$, et $\mathrm{e}^{\mathrm{i}\pi/8}$ est celle dont la partie réelle est positive. 
    $$\boxed{\cos\frac{\pi}{8} = \frac{\sqrt{2 + \sqrt{2}}}{2} \qquad \sin\frac{\pi}{8} = \frac{\sqrt{2 - \sqrt{2}}}{2}}$$
     Le quotient vaut $\sqrt{\frac{2 - \sqrt{2}}{2 + \sqrt{2}}} = \sqrt{\frac{(2 - \sqrt{2})^{2}}{2}} = \sqrt{2} - 1$, ce qui est la valeur de $\tan\frac{\pi}{8}$ obtenue à l'exercice 5 ✓.
- id: "ma-04-32"
  feuille: "f-ma-04"
  numero: 32
  partie: "Équations algébriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations algébriques, trigonométrie]
  noeuds: [c-racines-carrees, cx-pi]
  notions: [nombre-complexe, pi]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Résoudre dans $\mathbb{C}$ les équations suivantes, d'inconnue $z$.

    **(a)** $z^{2} + z + 1 = 0$

    **(b)** $z^{2} - 2\mathrm{i} z + 2 - 4\mathrm{i} = 0$

    **(c)** $4z^{2} - 16z + 11 - 12\mathrm{i} = 0$

    **(d)** $\mathrm{i} z^{2} + (4\mathrm{i} - 3)z + \mathrm{i} - 5 = 0$

    **(e)** $z^{4} - (5 - 14\mathrm{i})z^{2} - 2(5\mathrm{i} + 12) = 0$

    **(f)** $z^{2} - 2\mathrm{e}^{\mathrm{i}\theta}z + 2\mathrm{i}\sin\theta\,\mathrm{e}^{\mathrm{i}\theta} = 0$, $\theta \in \mathbb{R}$
  corrige: |
    On calcule le discriminant, l'une de ses racines carrées, puis l'on applique le théorème 4 du cours.

    • **(a)** $\Delta = -3 = (\mathrm{i}\sqrt{3})^{2}$ : $\boxed{z = \dfrac{-1 \pm \mathrm{i}\sqrt{3}}{2}}$, c'est-à-dire $j$ et $j^{2}$.

    • **(b)** $\Delta = -4 - 4(2 - 4\mathrm{i}) = -12 + 16\mathrm{i} = \big(2(1 + 2\mathrm{i})\big)^{2}$ : $\boxed{z = 1 + 3\mathrm{i} \ \text{ ou } \ z = -1 - \mathrm{i}}$

    • **(c)** Avec le discriminant réduit, $\Delta' = 64 - 4(11 - 12\mathrm{i}) = 20 + 48\mathrm{i} = (6 + 4\mathrm{i})^{2}$ : $z = \frac{8 \pm (6 + 4\mathrm{i})}{4}$, d'où $\boxed{z = \dfrac{7}{2} + \mathrm{i} \ \text{ ou } \ z = \dfrac{1}{2} - \mathrm{i}}$

    • **(d)** $\Delta = (4\mathrm{i} - 3)^{2} - 4\mathrm{i}(\mathrm{i} - 5) = -3 - 4\mathrm{i} = (1 - 2\mathrm{i})^{2}$, puis $z = \frac{3 - 4\mathrm{i} \pm (1 - 2\mathrm{i})}{2\mathrm{i}}$ : 
    $$\boxed{z = -3 - 2\mathrm{i} \ \text{ ou } \ z = -1 - \mathrm{i}}$$

    • **(e)** On pose $Z = z^{2}$. Le discriminant de $Z^{2} - (5 - 14\mathrm{i})Z - 2(5\mathrm{i} + 12)$ vaut $-75 - 100\mathrm{i} = \big(5(1 - 2\mathrm{i})\big)^{2}$, d'où $Z = 5 - 12\mathrm{i}$ ou $Z = -2\mathrm{i}$. Les racines carrées de ces nombres sont $\pm(3 - 2\mathrm{i})$ et $\pm(1 - \mathrm{i})$. 
    $$\boxed{z \in \{3 - 2\mathrm{i},\ -3 + 2\mathrm{i},\ 1 - \mathrm{i},\ -1 + \mathrm{i}\}}$$

    • **(f)** Le discriminant réduit vaut $\mathrm{e}^{2\mathrm{i}\theta} - 2\mathrm{i}\sin\theta\,\mathrm{e}^{\mathrm{i}\theta} = \mathrm{e}^{\mathrm{i}\theta}(\cos\theta - \mathrm{i}\sin\theta) = 1$ : 
    $$\boxed{z = \mathrm{e}^{\mathrm{i}\theta} + 1 \ \text{ ou } \ z = \mathrm{e}^{\mathrm{i}\theta} - 1}$$

    On contrôle par la somme et le produit : en (b), $(1 + 3\mathrm{i}) + (-1 - \mathrm{i}) = 2\mathrm{i}$ et $(1 + 3\mathrm{i})(-1 - \mathrm{i}) = 2 - 4\mathrm{i}$ ✓.
- id: "ma-04-33"
  feuille: "f-ma-04"
  numero: 33
  partie: "Équations algébriques"
  etoiles: 1
  types: [Calcul]
