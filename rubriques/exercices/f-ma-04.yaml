  noeuds: [c-racines-carrees]
  notions: [nombre-complexe]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Déterminer les couples $(x, y)$ de nombres complexes tels que 
    $$\text{(a)}\ \left\{ \begin{array}{l} x + y = 3 + 4\mathrm{i} \\ xy = 5 + 15\mathrm{i} \end{array} \right. \qquad\qquad \text{(b)}\ \left\{ \begin{array}{l} x + y = 3\mathrm{i} \\ xy = -1 - 3\mathrm{i} \end{array} \right. \qquad\qquad \text{(c)}\ \left\{ \begin{array}{l} x + y = 2 \\ xy = 2 \end{array} \right.$$
  corrige: |
    D'après le cours, $x$ et $y$ sont les solutions de $z^{2} - sz + p = 0$, où $s$ est la somme et $p$ le produit ; chaque système a donc pour solutions les deux couples obtenus en échangeant ces solutions.

    • **(a)** $\Delta = (3 + 4\mathrm{i})^{2} - 4(5 + 15\mathrm{i}) = -27 - 36\mathrm{i} = (3 - 6\mathrm{i})^{2}$ : $\boxed{\{x, y\} = \{5\mathrm{i},\ 3 - \mathrm{i}\}}$

    • **(b)** $\Delta = -9 + 4(1 + 3\mathrm{i}) = -5 + 12\mathrm{i} = (2 + 3\mathrm{i})^{2}$ : $\boxed{\{x, y\} = \{1 + 3\mathrm{i},\ -1\}}$

    • **(c)** $\Delta = -4 = (2\mathrm{i})^{2}$ : $\boxed{\{x, y\} = \{1 + \mathrm{i},\ 1 - \mathrm{i}\}}$
- id: "ma-04-34"
  feuille: "f-ma-04"
  numero: 34
  partie: "Équations algébriques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équations algébriques]
  noeuds: [c-racines-carrees]
  notions: [nombre-complexe]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Montrer que l'équation $z^{3} + (1 + \mathrm{i})z^{2} + (\mathrm{i} - 1)z - \mathrm{i} = 0$ admet une solution imaginaire pure, puis la résoudre complètement.

    **2.** Résoudre l'équation $4\mathrm{i} z^{3} + 2(1 + 3\mathrm{i})z^{2} - (5 + 4\mathrm{i})z + 3(1 - 7\mathrm{i}) = 0$, sachant qu'elle admet une solution réelle.
  corrige: |
    **1.** On cherche $z = \mathrm{i} y$ avec $y$ réel. En développant, $(\mathrm{i} y)^{3} + (1 + \mathrm{i})(\mathrm{i} y)^{2} + (\mathrm{i} - 1)\mathrm{i} y - \mathrm{i} = 0$ s'écrit 
    $$(-y^{2} - y) + \mathrm{i}(-y^{3} - y^{2} - y - 1) = 0,$$
     soit $y(y + 1) = 0$ et $(y + 1)(y^{2} + 1) = 0$, d'où $y = -1$ : $z = -\mathrm{i}$ est solution. La factorisation par $z + \mathrm{i}$ (proposition 19 du cours) donne 
    $$z^{3} + (1 + \mathrm{i})z^{2} + (\mathrm{i} - 1)z - \mathrm{i} = (z + \mathrm{i})(z^{2} + z - 1).$$

    $$\boxed{z \in \Big\{-\mathrm{i},\ \frac{-1 + \sqrt{5}}{2},\ \frac{-1 - \sqrt{5}}{2}\Big\}}$$

    **2.** Une solution réelle $x$ annule la partie réelle, $2x^{2} - 5x + 3 = (x - 1)(2x - 3)$, et la partie imaginaire, $4x^{3} + 6x^{2} - 4x - 21$. Seul $x = \frac{3}{2}$ convient : $4 \times \frac{27}{8} + 6 \times \frac{9}{4} - 6 - 21 = 0$. On factorise : 
    $$4\mathrm{i} z^{3} + 2(1 + 3\mathrm{i})z^{2} - (5 + 4\mathrm{i})z + 3(1 - 7\mathrm{i}) = (2z - 3)\big(2\mathrm{i} z^{2} + (1 + 6\mathrm{i})z - 1 + 7\mathrm{i}\big),$$
     et le trinôme a pour discriminant $(1 + 6\mathrm{i})^{2} - 8\mathrm{i}(-1 + 7\mathrm{i}) = 21 + 20\mathrm{i} = (5 + 2\mathrm{i})^{2}$. 
    $$\boxed{z \in \Big\{\frac{3}{2},\ -1 - \mathrm{i},\ -2 + \frac{3}{2}\mathrm{i}\Big\}}$$

    *À retenir :* pour trouver une racine réelle d'une équation à coefficients complexes, on annule séparément partie réelle et partie imaginaire ; les deux conditions réelles se contrôlent l'une l'autre.
