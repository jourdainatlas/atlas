- id: "ma-04-01"
  feuille: "f-ma-04"
  numero: 1
  partie: "Trigonométrie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle, tg-tangente]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Calculer les valeurs exactes de $\cos\dfrac{538\pi}{3}$, $\sin\dfrac{123\pi}{6}$ et $\tan\Big(-\dfrac{77\pi}{4}\Big)$.

    **2.** Soit $x$ un réel tel que $\cos x = -\dfrac{4}{5}$. Calculer $\cos(x - \pi)$, $\cos(-\pi - x)$ et $\sin\Big(x + \dfrac{\pi}{2}\Big)$. Peut-on calculer $\sin x$ ? Le calculer lorsque $\pi \leqslant x < 2\pi$, puis en déduire $\tan x$.
  corrige: |
    **1.** On retire à chaque angle un multiple de la période, $2\pi$ pour le cosinus et le sinus, $\pi$ pour la tangente. On a $\frac{538\pi}{3} = 178\pi + \frac{4\pi}{3}$, $\frac{123\pi}{6} = 20\pi + \frac{\pi}{2}$ et $-\frac{77\pi}{4} = -20\pi + \frac{3\pi}{4}$. 
    $$\boxed{\cos\frac{538\pi}{3} = \cos\frac{4\pi}{3} = -\frac{1}{2} \qquad \sin\frac{123\pi}{6} = \sin\frac{\pi}{2} = 1 \qquad \tan\Big(-\frac{77\pi}{4}\Big) = \tan\frac{3\pi}{4} = -1}$$

    **2.** Les angles associés (proposition 1 du cours) donnent : 
    $$\boxed{\cos(x - \pi) = \frac{4}{5} \qquad \cos(-\pi - x) = \cos(\pi + x) = \frac{4}{5} \qquad \sin\Big(x + \frac{\pi}{2}\Big) = \cos x = -\frac{4}{5}}$$
     La relation $\cos^{2} x + \sin^{2} x = 1$ donne $\sin^{2} x = \frac{9}{25}$, donc $\sin x = \pm\frac{3}{5}$ : le cosinus seul ne détermine pas le sinus, puisque $x$ et $-x$ ont le même cosinus. Lorsque $\pi \leqslant x < 2\pi$, le point $M(x)$ est sur le demi-cercle inférieur, et $\sin x \leqslant 0$. 
    $$\boxed{\sin x = -\frac{3}{5} \qquad\text{et}\qquad \tan x = \frac{-3/5}{-4/5} = \frac{3}{4}}$$
- id: "ma-04-02"
  feuille: "f-ma-04"
  numero: 2
  partie: "Trigonométrie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trigonométrie, géométrie complexe]
  noeuds: [tg-cercle, tg-tangente, c-calcul]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes, en s'aidant du cercle trigonométrique, puis représenter sur le cercle les points associés aux solutions.

    **(a)** $\sin x = \dfrac{1}{2}$

    **(b)** $\tan x = \sqrt{3}$

    **(c)** $\sin(3x) = 1$

    **(d)** $\cos(4x) = -2$

    **(e)** $\cos x = -\dfrac{1}{2}$ et $\sin x = \dfrac{\sqrt{3}}{2}$

    **(f)** $\cos^{2} x = \dfrac{3}{4}$
  corrige: |
    On lit chaque équation sur le cercle, puis l'on applique la proposition 4 du cours ; pour (c), on n'oublie pas de diviser aussi la période par $3$.

    • **(a)** Les points d'ordonnée $\frac{1}{2}$ sont $M(\frac{\pi}{6})$ et $M(\frac{5\pi}{6})$ : $\boxed{x \equiv \frac{\pi}{6}\ [2\pi] \ \text{ ou } \ x \equiv \frac{5\pi}{6}\ [2\pi]}$

    • **(b)** La tangente est $\pi$-périodique et $\tan\frac{\pi}{3} = \sqrt{3}$ : $\boxed{x \equiv \frac{\pi}{3}\ [\pi]}$

    • **(c)** $3x \equiv \frac{\pi}{2}\ [2\pi]$, soit $\boxed{x \equiv \frac{\pi}{6}\ \Big[\frac{2\pi}{3}\Big]}$, ce qui donne trois points sur le cercle, $M(\frac{\pi}{6})$, $M(\frac{5\pi}{6})$ et $M(\frac{3\pi}{2})$.

    • **(d)** Un cosinus est compris entre $-1$ et $1$ : $\boxed{\text{aucune solution}}$

    • **(e)** Un seul point du cercle a ces coordonnées, $M(\frac{2\pi}{3})$ : $\boxed{x \equiv \frac{2\pi}{3}\ [2\pi]}$

    • **(f)** $\cos x = \frac{\sqrt{3}}{2}$ ou $\cos x = -\frac{\sqrt{3}}{2}$, ce qui donne les quatre points $M(\pm\frac{\pi}{6})$ et $M(\pi \pm \frac{\pi}{6})$ : $\boxed{x \equiv \frac{\pi}{6}\ [\pi] \ \text{ ou } \ x \equiv -\frac{\pi}{6}\ [\pi]}$

    *Piège :* en (e), chacune des deux équations a deux familles de solutions, mais une seule leur est commune ; c'est le point du cercle qui a ces deux coordonnées.
- id: "ma-04-03"
  feuille: "f-ma-04"
  numero: 3
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle, tg-addition, tg-tangente]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes. On donnera les solutions appartenant à $[0\,,2\pi[$ pour les deux dernières.

    **(a)** $\sin(5x) = \sin\Big(\dfrac{2\pi}{3} + x\Big)$

    **(b)** $\cos\Big(x + \dfrac{\pi}{4}\Big) = \cos(2x)$

    **(c)** $\cos(3x) = \sin x$

    **(d)** $\tan x = 2\sin x$

    **(e)** $\cos(2x) + \cos x = 0$

    **(f)** $\cos x - \cos(2x) = \sin(3x)$
  corrige: |
    **(a)** La proposition 4 donne $5x \equiv \frac{2\pi}{3} + x\ [2\pi]$ ou $5x \equiv \pi - \frac{2\pi}{3} - x\ [2\pi]$, c'est-à-dire $4x \equiv \frac{2\pi}{3}\ [2\pi]$ ou $6x \equiv \frac{\pi}{3}\ [2\pi]$. 
    $$\boxed{x \equiv \frac{\pi}{6}\ \Big[\frac{\pi}{2}\Big] \ \text{ ou } \ x \equiv \frac{\pi}{18}\ \Big[\frac{\pi}{3}\Big]}$$

    **(b)** On a $2x \equiv x + \frac{\pi}{4}\ [2\pi]$ ou $2x \equiv -x - \frac{\pi}{4}\ [2\pi]$. 
    $$\boxed{x \equiv \frac{\pi}{4}\ [2\pi] \ \text{ ou } \ x \equiv -\frac{\pi}{12}\ \Big[\frac{2\pi}{3}\Big]}$$

    **(c)** On écrit $\sin x = \cos(\frac{\pi}{2} - x)$, d'où $3x \equiv \frac{\pi}{2} - x\ [2\pi]$ ou $3x \equiv x - \frac{\pi}{2}\ [2\pi]$. 
    $$\boxed{x \equiv \frac{\pi}{8}\ \Big[\frac{\pi}{2}\Big] \ \text{ ou } \ x \equiv -\frac{\pi}{4}\ [\pi]}$$

    **(d)** L'équation n'a de sens que si $\cos x \neq 0$. Elle s'écrit alors $\sin x\,\big(\frac{1}{\cos x} - 2\big) = 0$, c'est-à-dire $\sin x = 0$ ou $\cos x = \frac{1}{2}$. 
    $$\boxed{x \equiv 0\ [\pi] \ \text{ ou } \ x \equiv \frac{\pi}{3}\ [2\pi] \ \text{ ou } \ x \equiv -\frac{\pi}{3}\ [2\pi]}$$

    *Attention :* on ne divise pas par $\sin x$, ce qui ferait perdre les solutions $x \equiv 0\ [\pi]$.

    **(e)** On écrit $-\cos x = \cos(\pi - x)$, de sorte que l'équation devient $\cos(2x) = \cos(\pi - x)$, d'où $2x \equiv \pi - x\ [2\pi]$ ou $2x \equiv x - \pi\ [2\pi]$, soit $x \equiv \frac{\pi}{3}\ [\frac{2\pi}{3}]$ ou $x \equiv \pi\ [2\pi]$ ; la seconde famille est contenue dans la première, puisque $\pi = \frac{\pi}{3} + \frac{2\pi}{3}$. On peut aussi factoriser $2\cos^{2} x + \cos x - 1 = (2\cos x - 1)(\cos x + 1)$. 
    $$\boxed{x \equiv \frac{\pi}{3}\ \Big[\frac{2\pi}{3}\Big], \quad\text{soit, dans } [0\,,2\pi[ : \ \frac{\pi}{3},\ \pi,\ \frac{5\pi}{3}}$$

    **(f)** On factorise les deux membres par $\sin\frac{3x}{2}$, à l'aide d'une formule de factorisation et de la formule de duplication : 
    $$\cos x - \cos(2x) = 2\sin\frac{3x}{2}\sin\frac{x}{2} \qquad\text{et}\qquad \sin(3x) = 2\sin\frac{3x}{2}\cos\frac{3x}{2}.$$
     L'équation équivaut donc à $\sin\frac{3x}{2} = 0$ ou $\sin\frac{x}{2} = \cos\frac{3x}{2} = \sin(\frac{\pi}{2} - \frac{3x}{2})$. La première condition donne $x \equiv 0\ [\frac{2\pi}{3}]$ ; la seconde donne $\frac{x}{2} \equiv \frac{\pi}{2} - \frac{3x}{2}\ [2\pi]$ ou $\frac{x}{2} \equiv \frac{\pi}{2} + \frac{3x}{2}\ [2\pi]$, c'est-à-dire $x \equiv \frac{\pi}{4}\ [\pi]$ ou $x \equiv -\frac{\pi}{2}\ [2\pi]$. 
    $$\boxed{\text{solutions dans } [0\,,2\pi[ : \quad 0,\ \frac{\pi}{4},\ \frac{2\pi}{3},\ \frac{5\pi}{4},\ \frac{4\pi}{3},\ \frac{3\pi}{2}}$$
     On vérifie par exemple en $\frac{3\pi}{2}$ : $\cos\frac{3\pi}{2} - \cos(3\pi) = 0 + 1 = 1$ et $\sin\frac{9\pi}{2} = 1$ ✓.
- id: "ma-04-04"
  feuille: "f-ma-04"
  numero: 4
  partie: "Trigonométrie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle, tg-tangente]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Démontrer les égalités suivantes, en précisant pour quels réels $x$ elles ont un sens.

    **1.** $\dfrac{1 - \cos x}{\sin x} = \tan\dfrac{x}{2}$.

    **2.** $\sin\Big(x - \dfrac{2\pi}{3}\Big) + \sin x + \sin\Big(x + \dfrac{2\pi}{3}\Big) = 0$.

    **3.** $\dfrac{1}{\tan x} - \tan x = \dfrac{2}{\tan(2x)}$.
  corrige: |
    **1.** L'expression a un sens pour $\sin x \neq 0$, c'est-à-dire $x \not\equiv 0\ [\pi]$ ; alors $\cos\frac{x}{2} \neq 0$. Avec les formules de duplication en $\frac{x}{2}$, 
    $$\frac{1 - \cos x}{\sin x} = \frac{2\sin^{2}\frac{x}{2}}{2\sin\frac{x}{2}\cos\frac{x}{2}} = \boxed{\tan\frac{x}{2}}.$$

    **2.** L'égalité a un sens pour tout réel $x$. La formule $\sin(x - a) + \sin(x + a) = 2\sin x\cos a$, avec $a = \frac{2\pi}{3}$ et $\cos\frac{2\pi}{3} = -\frac{1}{2}$, donne $-\sin x$ pour la somme des termes extrêmes, d'où le résultat. Géométriquement, ce sont les ordonnées des sommets d'un triangle équilatéral centré en $O$, dont la somme est nulle.

    **3.** Il faut que $\tan x$ et $\tan(2x)$ existent et soient non nuls, c'est-à-dire $x \not\equiv 0\ [\frac{\pi}{4}]$. Alors 
    $$\frac{1}{\tan x} - \tan x = \frac{1 - \tan^{2} x}{\tan x} = \frac{2}{\dfrac{2\tan x}{1 - \tan^{2} x}} = \boxed{\frac{2}{\tan(2x)}},$$
     grâce à la formule de duplication de la tangente.
- id: "ma-04-05"
  feuille: "f-ma-04"
  numero: 5
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie, équations du second degré]
  noeuds: [tg-cercle, tg-addition, tg-tangente, c-racines-carrees]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Calculer $\cos\dfrac{\pi}{12}$ et $\sin\dfrac{\pi}{12}$ en écrivant $\dfrac{\pi}{12} = \dfrac{\pi}{3} - \dfrac{\pi}{4}$.

    **2.** Calculer à nouveau $\cos\dfrac{\pi}{12}$ en écrivant $\dfrac{\pi}{12} = \dfrac{1}{2} \times \dfrac{\pi}{6}$ et en utilisant une formule de duplication. Les deux résultats n'ont pas la même forme : montrer directement qu'ils sont égaux. Quelle méthode préférer, et pourquoi ?

    **3.** Calculer $\tan\dfrac{\pi}{8}$, en choisissant une formule qui évite les racines carrées emboîtées.
  corrige: |
    **1.** Les formules d'addition donnent 
    $$\boxed{\cos\frac{\pi}{12} = \frac{1}{2}\cdot\frac{\sqrt{2}}{2} + \frac{\sqrt{3}}{2}\cdot\frac{\sqrt{2}}{2} = \frac{\sqrt{6} + \sqrt{2}}{4} \qquad \sin\frac{\pi}{12} = \frac{\sqrt{3}}{2}\cdot\frac{\sqrt{2}}{2} - \frac{1}{2}\cdot\frac{\sqrt{2}}{2} = \frac{\sqrt{6} - \sqrt{2}}{4}}$$

    **2.** La formule $\cos^{2} a = \frac{1 + \cos(2a)}{2}$ donne $\cos^{2}\frac{\pi}{12} = \frac{2 + \sqrt{3}}{4}$, et $\cos\frac{\pi}{12} > 0$. 
    $$\boxed{\cos\frac{\pi}{12} = \frac{\sqrt{2 + \sqrt{3}}}{2}}$$
     Les deux nombres sont positifs, et leurs carrés sont égaux, puisque $\big(\frac{\sqrt{6} + \sqrt{2}}{4}\big)^{2} = \frac{8 + 2\sqrt{12}}{16} = \frac{2 + \sqrt{3}}{4}$ : ils sont donc égaux. La première méthode est préférable, car elle donne directement une forme sans radicaux emboîtés, plus facile à manipuler ; la seconde exige un contrôle de signe et laisse une expression qu'il faut ensuite simplifier.

    **3.** La formule $\tan\frac{x}{2} = \frac{1 - \cos x}{\sin x}$ de l'exercice 4, avec $x = \frac{\pi}{4}$, évite toute racine carrée emboîtée : 
    $$\tan\frac{\pi}{8} = \frac{1 - \frac{\sqrt{2}}{2}}{\frac{\sqrt{2}}{2}} = \boxed{\sqrt{2} - 1}.$$
- id: "ma-04-06"
  feuille: "f-ma-04"
  numero: 6
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle, tg-addition, tg-tangente]
  notions: [pi, cosinus-sinus, fonction-tangente]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre les inéquations suivantes sur l'intervalle indiqué.

    **(a)** $\sin x \geqslant \dfrac{1}{2}$, sur $[0\,,2\pi]$, puis sur $[-\pi\,,\pi]$, puis sur $\mathbb{R}$.

    **(b)** $2\sin^{2} x \leqslant 1$, sur $\mathbb{R}$.

    **(c)** $\cos^{2} x \geqslant \cos(2x)$, sur $\mathbb{R}$.

    **(d)** $2\cos^{2} x - 9\cos x + 4 \geqslant 0$, sur $\mathbb{R}$.

    **(e)** $\tan x \geqslant 2\sin x$, sur $]-\pi\,,\pi]$.
  corrige: |
    **(a)** Les points d'ordonnée au moins $\frac{1}{2}$ forment l'arc allant de $M(\frac{\pi}{6})$ à $M(\frac{5\pi}{6})$ par le haut. 
    $$\boxed{\Big[\frac{\pi}{6}\,,\frac{5\pi}{6}\Big] \text{ sur } [0\,,2\pi] \text{ comme sur } [-\pi\,,\pi], \qquad \bigcup_{k \in \mathbb{Z}} \Big[\frac{\pi}{6} + 2k\pi\,,\frac{5\pi}{6} + 2k\pi\Big] \text{ sur } \mathbb{R}}$$

    **(b)** On a $2\sin^{2} x \leqslant 1 \iff \cos(2x) \geqslant 0 \iff 2x \in [-\frac{\pi}{2} + 2k\pi\,,\frac{\pi}{2} + 2k\pi]$ pour un $k \in \mathbb{Z}$. 
    $$\boxed{\bigcup_{k \in \mathbb{Z}} \Big[-\frac{\pi}{4} + k\pi\,,\frac{\pi}{4} + k\pi\Big]}$$

    **(c)** Comme $\cos(2x) = 2\cos^{2} x - 1$, l'inéquation équivaut à $\cos^{2} x \leqslant 1$, toujours vraie : 
    $$\boxed{\text{l'ensemble des solutions est } \mathbb{R}}$$

    **(d)** Le trinôme $2X^{2} - 9X + 4$ a pour racines $\frac{1}{2}$ et $4$, et l'inéquation s'écrit $(2\cos x - 1)(\cos x - 4) \geqslant 0$. Le second facteur est toujours strictement négatif, donc l'inéquation équivaut à $\cos x \leqslant \frac{1}{2}$. 
    $$\boxed{\bigcup_{k \in \mathbb{Z}} \Big[\frac{\pi}{3} + 2k\pi\,,\frac{5\pi}{3} + 2k\pi\Big]}$$

    **(e)** L'inéquation a un sens pour $x \neq \pm\frac{\pi}{2}$, et elle s'écrit $\dfrac{\sin x\,(1 - 2\cos x)}{\cos x} \geqslant 0$. On dresse le tableau de signes sur $]-\pi\,,\pi]$.

    ![Figure](documents/figures/5249f390e644431d.svg)

    $$\boxed{\Big]-\pi\,,-\frac{\pi}{2}\Big[ \ \cup \ \Big[-\frac{\pi}{3}\,,0\Big] \ \cup \ \Big[\frac{\pi}{3}\,,\frac{\pi}{2}\Big[ \ \cup \ \{\pi\}}$$

    *Piège :* on ne multiplie pas les deux membres par $\cos x$, dont le signe varie ; c'est l'erreur la plus répandue sur ce type d'inéquation.
- id: "ma-04-07"
  feuille: "f-ma-04"
  numero: 7
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle]
  notions: [pi, cosinus-sinus]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Pour quelles valeurs du réel $m$ l'équation $\sqrt{3}\cos x - \sin x = m$ admet-elle des solutions réelles ? Les déterminer lorsque $m = \sqrt{2}$.

    **2.** Résoudre dans $\mathbb{R}$ l'équation $\cos x = \sqrt{3}\sin x + 1$.
  corrige: |
    **1.** Comme $\sqrt{3} - \mathrm{i} = 2\,\mathrm{e}^{-\mathrm{i}\pi/6}$, la proposition 18 du cours donne $\sqrt{3}\cos x - \sin x = 2\cos(x + \frac{\pi}{6})$, qui décrit exactement $[-2\,,2]$ lorsque $x$ décrit $\mathbb{R}$. 
    $$\boxed{\text{l'équation a des solutions si et seulement si } m \in [-2\,,2]}$$
     Pour $m = \sqrt{2}$, l'équation s'écrit $\cos(x + \frac{\pi}{6}) = \cos\frac{\pi}{4}$, d'où $x + \frac{\pi}{6} \equiv \pm\frac{\pi}{4}\ [2\pi]$. 
    $$\boxed{x \equiv \frac{\pi}{12}\ [2\pi] \ \text{ ou } \ x \equiv -\frac{5\pi}{12}\ [2\pi]}$$

    **2.** L'équation s'écrit $\cos x - \sqrt{3}\sin x = 1$, soit $2\cos(x + \frac{\pi}{3}) = 1$, puisque $1 - \mathrm{i}\sqrt{3} = 2\,\mathrm{e}^{-\mathrm{i}\pi/3}$. Alors $x + \frac{\pi}{3} \equiv \pm\frac{\pi}{3}\ [2\pi]$. 
    $$\boxed{x \equiv 0\ [2\pi] \ \text{ ou } \ x \equiv -\frac{2\pi}{3}\ [2\pi]}$$
- id: "ma-04-08"
  feuille: "f-ma-04"
  numero: 8
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle]
  notions: [pi, cosinus-sinus]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Déterminer les couples $(x, y) \in [-\pi\,,\pi]^{2}$ tels que 
    $$\left\{ \begin{array}{rcrcl} 2\cos x & + & 3\sin y & = & \sqrt{2} - \dfrac{3}{2} \\[3mm] 4\cos x & + & \sin y & = & 2\sqrt{2} - \dfrac{1}{2} \end{array} \right.$$
     *On pourra commencer par résoudre un système linéaire, comme au chapitre 3.*
  corrige: |
    On pose $u = \cos x$ et $v = \sin y$, qui vérifient le système linéaire $2u + 3v = \sqrt{2} - \frac{3}{2}$, $4u + v = 2\sqrt{2} - \frac{1}{2}$. L'opération $L_{1} \leftarrow 3L_{2} - L_{1}$, puis la remontée, donnent 
    $$10u = 6\sqrt{2} - \frac{3}{2} - \sqrt{2} + \frac{3}{2} = 5\sqrt{2}, \qquad u = \frac{\sqrt{2}}{2}, \qquad v = 2\sqrt{2} - \frac{1}{2} - 4u = -\frac{1}{2}.$$
     Dans $[-\pi\,,\pi]$, $\cos x = \frac{\sqrt{2}}{2}$ équivaut à $x = \pm\frac{\pi}{4}$, et $\sin y = -\frac{1}{2}$ à $y = -\frac{\pi}{6}$ ou $y = -\frac{5\pi}{6}$. 
    $$\boxed{(x, y) \in \Big\{\Big(\frac{\pi}{4}, -\frac{\pi}{6}\Big), \Big(\frac{\pi}{4}, -\frac{5\pi}{6}\Big), \Big(-\frac{\pi}{4}, -\frac{\pi}{6}\Big), \Big(-\frac{\pi}{4}, -\frac{5\pi}{6}\Big)\Big\}}$$

    *À retenir :* le système n'est pas linéaire en $x$ et $y$, mais il l'est en $\cos x$ et $\sin y$ ; le changement d'inconnues ramène à la méthode du pivot du chapitre 3.
- id: "ma-04-09"
  feuille: "f-ma-04"
  numero: 9
  partie: "Trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle]
  notions: [pi, cosinus-sinus]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On considère la fonction $f$ définie par $f(x) = \dfrac{\sin x}{2 + \cos x}$.

    **1.** Déterminer son ensemble de définition. Calculer $f(x + 2\pi)$ et $f(-x)$, et en déduire qu'il suffit d'étudier $f$ sur $[0\,,\pi]$.

    **2.** Montrer que $f'(x) = \dfrac{1 + 2\cos x}{(2 + \cos x)^{2}}$, puis dresser le tableau de variations de $f$ sur $[0\,,\pi]$.

    **3.** Déterminer le maximum de $f$ sur $\mathbb{R}$ et les réels où il est atteint, puis tracer l'allure de la courbe de $f$ sur $[-2\pi\,,2\pi]$.
  corrige: |
    **1.** Comme $2 + \cos x \geqslant 1 > 0$, $f$ est définie sur $\mathbb{R}$. Elle est $2\pi$-périodique, et impaire puisque $\sin$ est impaire et $\cos$ paire : sa courbe est symétrique par rapport à l'origine, et il suffit d'étudier $f$ sur $[0\,,\pi]$, la périodicité permettant ensuite de reconstituer la courbe sur $\mathbb{R}$.

    **2.** La formule de dérivation d'un quotient donne 
    $$f'(x) = \frac{\cos x\,(2 + \cos x) + \sin^{2} x}{(2 + \cos x)^{2}} = \boxed{\frac{1 + 2\cos x}{(2 + \cos x)^{2}}},$$
     qui est du signe de $1 + 2\cos x$ : positive sur $[0\,,\frac{2\pi}{3}]$, négative sur $[\frac{2\pi}{3}\,,\pi]$. On calcule $f(\frac{2\pi}{3}) = \frac{\sqrt{3}/2}{3/2} = \frac{\sqrt{3}}{3}$.

    ![Figure](documents/figures/150de0022b214731.svg)

    **3.** Par imparité et périodicité, le maximum de $f$ sur $\mathbb{R}$ vaut $\boxed{\frac{\sqrt{3}}{3}}$, atteint exactement aux réels $\boxed{x \equiv \frac{2\pi}{3}\ [2\pi]}$, et le minimum vaut $-\frac{\sqrt{3}}{3}$, atteint en $x \equiv -\frac{2\pi}{3}\ [2\pi]$.

    ![Figure](documents/figures/982d3612fad623ba.svg)

    La courbe oscille entre les deux droites en pointillé ; elle n'est pas sinusoïdale : la montée de $0$ à $\frac{2\pi}{3}$ est plus lente que la descente de $\frac{2\pi}{3}$ à $\pi$.
- id: "ma-04-10"
  feuille: "f-ma-04"
  numero: 10
  partie: "Trigonométrie"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle]
  notions: [pi, cosinus-sinus]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Démontrer par récurrence que, pour tout entier $n \geqslant 1$ et tout réel $x$, $|\sin(nx)| \leqslant n\,|\sin x|$.

    **2.** Soit $a \in \,]0\,,\pi[$. Montrer que, pour tout entier $n \geqslant 1$, $\sin\dfrac{a}{2^{n}} \neq 0$ et 
    $$\prod_{k=1}^{n} \cos\frac{a}{2^{k}} = \frac{\sin a}{2^{n}\sin\dfrac{a}{2^{n}}}.$$
     *On pourra reconnaître un produit télescopique, comme au chapitre 3.*

    **3.** Par une méthode analogue, calculer $\cos\dfrac{\pi}{7}\cos\dfrac{2\pi}{7}\cos\dfrac{4\pi}{7}$.
  corrige: |
    **1.** Pour $n = 1$, il y a égalité. Si l'inégalité est vraie au rang $n$, la formule d'addition et l'inégalité triangulaire donnent 
    $$|\sin((n+1)x)| = |\sin(nx)\cos x + \cos(nx)\sin x| \leqslant |\sin(nx)| + |\sin x| \leqslant (n + 1)|\sin x|,$$
     puisque $|\cos x| \leqslant 1$ et $|\cos(nx)| \leqslant 1$. $\boxed{|\sin(nx)| \leqslant n\,|\sin x| \text{ pour tout } n \geqslant 1}$

    **2.** On a $\frac{a}{2^{n}} \in \,]0\,,\pi[$, donc $\sin\frac{a}{2^{n}} > 0$. La formule $\sin(2u) = 2\sin u\cos u$, avec $u = \frac{a}{2^{k}}$, donne 
    $$\cos\frac{a}{2^{k}} = \frac{1}{2}\cdot\frac{\sin(a/2^{k-1})}{\sin(a/2^{k})},$$
     et le produit est télescopique, au sens du chapitre 3 : 
    $$\prod_{k=1}^{n} \cos\frac{a}{2^{k}} = \frac{1}{2^{n}}\prod_{k=1}^{n} \frac{\sin(a/2^{k-1})}{\sin(a/2^{k})} = \boxed{\frac{\sin a}{2^{n}\sin(a/2^{n})}}.$$

    **3.** On note $P$ le produit cherché et l'on applique trois fois la formule de duplication, chaque angle étant le double du précédent : 
    $$8\sin\frac{\pi}{7}\,P = 4\sin\frac{2\pi}{7}\cos\frac{2\pi}{7}\cos\frac{4\pi}{7} = 2\sin\frac{4\pi}{7}\cos\frac{4\pi}{7} = \sin\frac{8\pi}{7} = -\sin\frac{\pi}{7}.$$
     Comme $\sin\frac{\pi}{7} \neq 0$, on obtient $\boxed{\cos\dfrac{\pi}{7}\cos\dfrac{2\pi}{7}\cos\dfrac{4\pi}{7} = -\dfrac{1}{8}}$

    *À retenir :* la méthode est la même qu'à la question 2, lue dans l'autre sens : on multiplie par le sinus du plus petit angle pour déclencher les duplications successives.
- id: "ma-04-11"
  feuille: "f-ma-04"
  numero: 11
  partie: "Trigonométrie"
  etoiles: 3
  types: [Calcul]
  mots_cles: [trigonométrie]
  noeuds: [tg-cercle]
  notions: [pi, cosinus-sinus]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On se propose de déterminer les réels $t$ tels que $\cos t = \dfrac{1 + \sqrt{5}}{4}$.

    **1.** Exprimer $\cos(4t)$ en fonction de $c = \cos t$.

    **2.** On pose $c = \cos\dfrac{\pi}{5}$. Justifier que $\cos\dfrac{4\pi}{5} = -c$, et en déduire que $c$ est racine de $8c^{4} - 8c^{2} + c + 1$. Factoriser cette expression par $(c + 1)(2c - 1)$.

    **3.** En déduire que $\cos\dfrac{\pi}{5} = \dfrac{1 + \sqrt{5}}{4}$, en justifiant soigneusement l'élimination des autres valeurs.

    **4.** Résoudre l'équation proposée.
  corrige: |
    **1.** En appliquant deux fois la formule $\cos(2u) = 2\cos^{2} u - 1$ : 
    $$\boxed{\cos(4t) = 2(2c^{2} - 1)^{2} - 1 = 8c^{4} - 8c^{2} + 1}$$

    **2.** On a $\cos\frac{4\pi}{5} = \cos(\pi - \frac{\pi}{5}) = -c$, donc $8c^{4} - 8c^{2} + 1 = -c$, c'est-à-dire $8c^{4} - 8c^{2} + c + 1 = 0$. En développant, on vérifie que 
    $$\boxed{8c^{4} - 8c^{2} + c + 1 = (c + 1)(2c - 1)(4c^{2} - 2c - 1)}$$

    **3.** Les racines sont $-1$, $\frac{1}{2}$ et $\frac{1 \pm \sqrt{5}}{4}$. Or le cosinus est strictement décroissant sur $[0\,,\pi]$, puisque sa dérivée $-\sin$ y est négative et ne s'annule qu'aux bornes ; comme $0 < \frac{\pi}{5} < \frac{\pi}{3}$, on a $c > \cos\frac{\pi}{3} = \frac{1}{2}$. Cela élimine $-1$, $\frac{1}{2}$ et $\frac{1 - \sqrt{5}}{4}$, qui est négatif. 
    $$\boxed{\cos\frac{\pi}{5} = \frac{1 + \sqrt{5}}{4}}$$

    **4.** L'équation s'écrit $\cos t = \cos\frac{\pi}{5}$, et la proposition 4 conclut : $\boxed{t \equiv \frac{\pi}{5}\ [2\pi] \ \text{ ou } \ t \equiv -\frac{\pi}{5}\ [2\pi]}$

    *À retenir :* le nombre $\frac{1 + \sqrt{5}}{2} = 2\cos\frac{\pi}{5}$ est le nombre d'or ; on le retrouvera avec les racines cinquièmes de l'unité à l'exercice 41.
- id: "ma-04-12"
  feuille: "f-ma-04"
  numero: 12
  partie: "Le corps des nombres complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [calcul dans ℂ, module]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Écrire chacun des nombres complexes suivants sous forme algébrique, et calculer son module.

    **(a)** $\dfrac{1}{\mathrm{i}}$

    **(b)** $\dfrac{1 + \mathrm{i}}{1 - \mathrm{i}}$

    **(c)** $\dfrac{(2 + 3\mathrm{i})^{2}}{4 - 2\mathrm{i}}$

    **(d)** $\dfrac{1 + 2\mathrm{i}}{1 - 3\mathrm{i}}$

    **(e)** $\Big(\dfrac{1 + \mathrm{i}}{2 - \mathrm{i}}\Big)^{2}$

    **(f)** $\dfrac{2 + 5\mathrm{i}}{1 - \mathrm{i}} + \dfrac{2 - 5\mathrm{i}}{1 + \mathrm{i}}$

    **(g)** $\dfrac{1 + \mathrm{i}\sqrt{3}}{\sqrt{3} - \mathrm{i}}$

    **(h)** $\dfrac{2}{1 - \mathrm{i}\sqrt{3}}$

    **(i)** $\dfrac{(5 - \mathrm{i})^{6}}{(3 + 2\mathrm{i})^{5}}$

    Pour le dernier, on cherchera à éviter le développement des puissances.
  corrige: |
    Pour un quotient, on multiplie par le conjugué du dénominateur ; le module d'un quotient est le quotient des modules, ce qui fournit un contrôle.

    • **(a)** $\dfrac{1}{\mathrm{i}} = -\mathrm{i}$, de module $1$. **(b)** $\dfrac{(1 + \mathrm{i})^{2}}{2} = \mathrm{i}$, de module $1$.

    • **(c)** $\dfrac{(-5 + 12\mathrm{i})(4 + 2\mathrm{i})}{20} = \dfrac{-44 + 38\mathrm{i}}{20}$ : $\boxed{-\dfrac{11}{5} + \dfrac{19}{10}\mathrm{i}}$, de module $\dfrac{|2 + 3\mathrm{i}|^{2}}{|4 - 2\mathrm{i}|} = \dfrac{13}{2\sqrt{5}} = \dfrac{13\sqrt{5}}{10}$.

    • **(d)** $\dfrac{(1 + 2\mathrm{i})(1 + 3\mathrm{i})}{10} = \dfrac{-5 + 5\mathrm{i}}{10}$ : $\boxed{-\dfrac{1}{2} + \dfrac{1}{2}\mathrm{i}}$, de module $\dfrac{\sqrt{2}}{2}$.

    • **(e)** $\dfrac{1 + \mathrm{i}}{2 - \mathrm{i}} = \dfrac{(1 + \mathrm{i})(2 + \mathrm{i})}{5} = \dfrac{1 + 3\mathrm{i}}{5}$, dont le carré est $\boxed{-\dfrac{8}{25} + \dfrac{6}{25}\mathrm{i}}$, de module $\dfrac{2}{5}$.

    • **(f)** Les deux termes sont conjugués, donc la somme vaut $2\operatorname{Re}\Big(\dfrac{(2 + 5\mathrm{i})(1 + \mathrm{i})}{2}\Big) = \operatorname{Re}(-3 + 7\mathrm{i})$ : $\boxed{-3}$, de module $3$.

    • **(g)** $\dfrac{(1 + \mathrm{i}\sqrt{3})(\sqrt{3} + \mathrm{i})}{4} = \dfrac{4\mathrm{i}}{4} = \boxed{\mathrm{i}}$, de module $1$. **(h)** $\dfrac{2(1 + \mathrm{i}\sqrt{3})}{4} = \boxed{\dfrac{1}{2} + \dfrac{\sqrt{3}}{2}\mathrm{i}}$, de module $1$.

    • **(i)** On remarque que $(3 + 2\mathrm{i})(1 - \mathrm{i}) = 5 - \mathrm{i}$, d'où, avec $(1 - \mathrm{i})^{2} = -2\mathrm{i}$, 
    $$\frac{(5 - \mathrm{i})^{6}}{(3 + 2\mathrm{i})^{5}} = (3 + 2\mathrm{i})(1 - \mathrm{i})^{6} = (3 + 2\mathrm{i})(-2\mathrm{i})^{3} = 8\mathrm{i}(3 + 2\mathrm{i}) = \boxed{-16 + 24\mathrm{i}},$$
     de module $8\sqrt{13}$.

    *À retenir :* avant de développer une puissance élevée, on cherche une factorisation. Le module permettait de contrôler le résultat : $\frac{26^{3}}{13^{5/2}} = 8\sqrt{13}$.
- id: "ma-04-13"
  feuille: "f-ma-04"
  numero: 13
  partie: "Le corps des nombres complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [calcul dans ℂ, conjugué]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Résoudre dans $\mathbb{C}$ les équations suivantes, d'inconnue $z$.

    **(a)** $2z + \mathrm{i} = \overline{z} + 1$

    **(b)** $2z + 6\overline{z} = 3 + 2\mathrm{i}$

    **(c)** $2z + 2\overline{z} = 2 + 3\mathrm{i}$

    **(d)** $(3 + 2\mathrm{i})(z - 1) = \mathrm{i}$
  corrige: |
    On écrit $z = x + \mathrm{i} y$ avec $x$ et $y$ réels, et l'on identifie parties réelles et imaginaires.

    • **(a)** $2x + \mathrm{i}(2y + 1) = x + 1 - \mathrm{i} y$, d'où $x = 1$ et $3y = -1$ : $\boxed{z = 1 - \dfrac{\mathrm{i}}{3}}$

    • **(b)** $8x - 4\mathrm{i} y = 3 + 2\mathrm{i}$ : $\boxed{z = \dfrac{3}{8} - \dfrac{\mathrm{i}}{2}}$

    • **(c)** $2z + 2\overline{z} = 4x$ est réel, alors que $2 + 3\mathrm{i}$ ne l'est pas : $\boxed{\text{aucune solution}}$

    • **(d)** Pas besoin de $x$ et $y$ ici : $z = 1 + \dfrac{\mathrm{i}}{3 + 2\mathrm{i}} = 1 + \dfrac{\mathrm{i}(3 - 2\mathrm{i})}{13}$, d'où $\boxed{z = \dfrac{15 + 3\mathrm{i}}{13}}$

    *Piège :* une équation où figure $\overline{z}$ n'est pas une équation du premier degré en $z$ ; le passage aux parties réelle et imaginaire est la méthode sûre, et l'équation (c) montre qu'il peut n'y avoir aucune solution.
- id: "ma-04-14"
  feuille: "f-ma-04"
  numero: 14
  partie: "Le corps des nombres complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [calcul dans ℂ, sommes trigonométriques]
  noeuds: [c-calcul, n-sommes]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Calculer les nombres suivants, en distinguant des cas selon le reste de la division de $n$ par un entier que l'on choisira avec soin : 
    $$\mathrm{i}^{n}, \qquad \sum_{k=0}^{n} \mathrm{i}^{k} \qquad\text{et}\qquad \prod_{k=1}^{n} \mathrm{i}^{k}.$$
  corrige: |
    Les puissances de $\mathrm{i}$ se répètent de quatre en quatre : $\mathrm{i}^{n}$ vaut $1$, $\mathrm{i}$, $-1$, $-\mathrm{i}$ selon que $n \equiv 0$, $1$, $2$, $3$ modulo $4$. La somme est géométrique, de raison $\mathrm{i} \neq 1$ : 
    $$\sum_{k=0}^{n} \mathrm{i}^{k} = \frac{1 - \mathrm{i}^{n+1}}{1 - \mathrm{i}} \qquad\text{vaut}\qquad \boxed{1,\ \ 1 + \mathrm{i},\ \ \mathrm{i},\ \ 0} \quad\text{pour } n \equiv 0, 1, 2, 3 \ [4].$$
     Le produit vaut $\mathrm{i}^{1 + 2 + \cdots + n} = \mathrm{i}^{n(n+1)/2}$. Le reste de $\frac{n(n+1)}{2}$ modulo $4$ dépend du reste de $n$ modulo $8$ : pour $n \equiv 0, 1, \dots, 7$, l'exposant est congru à $0$, $1$, $3$, $2$, $2$, $3$, $1$, $0$ modulo $4$. 
    $$\boxed{\prod_{k=1}^{n} \mathrm{i}^{k} = 1,\ \mathrm{i},\ -\mathrm{i},\ -1,\ -1,\ -\mathrm{i},\ \mathrm{i},\ 1 \quad\text{pour } n \equiv 0, 1, \dots, 7 \ [8]}$$
     On vérifie pour $n = 2$ : $\mathrm{i} \times \mathrm{i}^{2} = \mathrm{i}^{3} = -\mathrm{i}$ ✓.
- id: "ma-04-15"
  feuille: "f-ma-04"
  numero: 15
  partie: "Le corps des nombres complexes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [calcul dans ℂ, module, géométrie complexe]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Chacun des raisonnements suivants contient une erreur. La localiser, l'expliquer, et corriger la conclusion lorsque c'est possible.

    **(a)** « On a $\mathrm{i} > 0$, donc, en multipliant par $\mathrm{i} > 0$, $\mathrm{i}^{2} > 0$, c'est-à-dire $-1 > 0$. »

    **(b)** « Pour tout complexe $z$, $|z|^{2} = z^{2}$, donc l'équation $|z|^{2} = -1$ a les solutions $\mathrm{i}$ et $-\mathrm{i}$. »

    **(c)** « Pour $a$ et $b$ réels non nuls, $\dfrac{1}{a + \mathrm{i} b} = \dfrac{1}{a} + \dfrac{1}{\mathrm{i} b} = \dfrac{1}{a} - \dfrac{\mathrm{i}}{b}$. »

    **(d)** « Pour tout complexe $z$, $|z + \mathrm{i}| = |z| + 1$, donc le cercle $|z + \mathrm{i}| = 2$ est le cercle de centre $0$ et de rayon $1$. »
  corrige: |
    • **(a)** L'écriture $\mathrm{i} > 0$ n'a pas de sens : le cours montre qu'il n'existe aucune relation d'ordre sur $\mathbb{C}$ compatible avec les opérations, et le « raisonnement » proposé en est précisément la démonstration par l'absurde. Il n'y a rien à corriger dans la conclusion, sinon qu'elle prouve que l'hypothèse est absurde.

    • **(b)** L'égalité $|z|^{2} = z^{2}$ est fausse dès que $z$ n'est pas réel ; la bonne relation est $|z|^{2} = z\overline{z}$. Comme $|z|^{2} \geqslant 0$, l'équation $|z|^{2} = -1$ n'a **aucune solution** ; d'ailleurs $|\mathrm{i}|^{2} = 1$.

    • **(c)** L'inverse d'une somme n'est pas la somme des inverses, déjà dans $\mathbb{R}$. La bonne formule est $\dfrac{1}{a + \mathrm{i} b} = \dfrac{a - \mathrm{i} b}{a^{2} + b^{2}}$.

    • **(d)** L'inégalité triangulaire donne seulement $|z + \mathrm{i}| \leqslant |z| + 1$. L'ensemble $|z + \mathrm{i}| = 2$ est le cercle de **centre** $-\mathrm{i}$ et de **rayon** $2$, puisque $|z + \mathrm{i}| = |z - (-\mathrm{i})|$.
- id: "ma-04-16"
  feuille: "f-ma-04"
  numero: 16
  partie: "Le corps des nombres complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [calcul dans ℂ, module]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $z$ et $z'$ deux nombres complexes.

    **1.** Démontrer l'*identité du parallélogramme* $|z + z'|^{2} + |z - z'|^{2} = 2\big(|z|^{2} + |z'|^{2}\big)$, et en donner une interprétation géométrique.

    **2.** Montrer que $|z| + |z'| \leqslant |z + z'| + |z - z'|$, et étudier le cas d'égalité.

    **3.** Montrer que $\dfrac{|\operatorname{Re} z| + |\operatorname{Im} z|}{\sqrt{2}} \leqslant |z| \leqslant |\operatorname{Re} z| + |\operatorname{Im} z|$, et préciser les cas d'égalité.
  corrige: |
    **1.** D'après le cours, $|z \pm z'|^{2} = |z|^{2} + |z'|^{2} \pm 2\operatorname{Re}(z\overline{z'})$ ; on ajoute les deux égalités. 
    $$\boxed{|z + z'|^{2} + |z - z'|^{2} = 2\big(|z|^{2} + |z'|^{2}\big)}$$
     Dans le parallélogramme construit sur les vecteurs d'affixes $z$ et $z'$, les diagonales ont pour longueurs $|z + z'|$ et $|z - z'|$ : la somme des carrés des diagonales est égale à la somme des carrés des quatre côtés.

    **2.** On écrit $2z = (z + z') + (z - z')$ et $2z' = (z + z') - (z - z')$ ; l'inégalité triangulaire donne 
    $$2|z| \leqslant |z + z'| + |z - z'| \qquad\text{et}\qquad 2|z'| \leqslant |z + z'| + |z - z'|,$$
     et l'on ajoute. L'égalité exige l'égalité dans les deux inégalités. Si $u = z + z'$ et $v = z - z'$ étaient tous deux non nuls, on aurait $v = \lambda u$ et $-v = \mu u$ avec $\lambda, \mu > 0$, d'où $(\lambda + \mu)u = 0$, ce qui est impossible. Donc $u = 0$ ou $v = 0$, et réciproquement ces cas donnent l'égalité. 
    $$\boxed{\text{égalité si et seulement si } z' = z \ \text{ ou } \ z' = -z}$$

    **3.** Avec $z = a + \mathrm{i} b$, l'inégalité triangulaire donne $|z| \leqslant |a| + |\mathrm{i} b| = |a| + |b|$, avec égalité si et seulement si $a = 0$ ou $b = 0$, car $\mathrm{i} b$ et $a$ ne sont positivement proportionnels que si l'un est nul. Pour l'autre inégalité, entre réels positifs, 
    $$\frac{(|a| + |b|)^{2}}{2} \leqslant a^{2} + b^{2} \iff 0 \leqslant (|a| - |b|)^{2}.$$

    $$\boxed{\frac{|\operatorname{Re} z| + |\operatorname{Im} z|}{\sqrt{2}} \leqslant |z| \leqslant |\operatorname{Re} z| + |\operatorname{Im} z|}$$
     avec égalité à gauche si et seulement si $|a| = |b|$, et à droite si et seulement si $z$ est réel ou imaginaire pur.
- id: "ma-04-17"
  feuille: "f-ma-04"
  numero: 17
  partie: "Le corps des nombres complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [calcul dans ℂ, sommes trigonométriques]
  noeuds: [c-calcul, n-sommes]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $n \geqslant 2$ et $z_{1}, \dots, z_{n}$ des complexes non nuls. Démontrer que 
    $$\Big|\sum_{k=1}^{n} z_{k}\Big| = \sum_{k=1}^{n} |z_{k}|$$
     si et seulement s'il existe des réels $\lambda_{2}, \dots, \lambda_{n}$ strictement positifs tels que $z_{k} = \lambda_{k} z_{1}$ pour tout $k \in [\![2\,;n]\!]$. Interpréter géométriquement.
  corrige: |
    La condition est suffisante : si $z_{k} = \lambda_{k}z_{1}$ avec $\lambda_{1} = 1$ et $\lambda_{k} > 0$, alors $\big|\sum z_{k}\big| = \big(\sum \lambda_{k}\big)|z_{1}| = \sum |z_{k}|$.

    Réciproquement, supposons l'égalité, et notons $S = \sum z_{k}$. On a $|S| = \sum |z_{k}| > 0$, donc $S \neq 0$ ; posons $u = \frac{S}{|S|} \in \mathbb{U}$. Alors 
    $$\sum_{k=1}^{n} |z_{k}| = |S| = \operatorname{Re}\big(S\,\overline{u}\big) = \sum_{k=1}^{n} \operatorname{Re}\big(z_{k}\overline{u}\big) \leqslant \sum_{k=1}^{n} |z_{k}\overline{u}| = \sum_{k=1}^{n} |z_{k}|.$$
     Il y a donc égalité terme à terme : $\operatorname{Re}(z_{k}\overline{u}) = |z_{k}\overline{u}|$, ce qui signifie, comme dans la démonstration du théorème 3 du cours, que $z_{k}\overline{u}$ est un réel positif, à savoir $|z_{k}|$. Ainsi $z_{k} = |z_{k}|\,u$ pour tout $k$, et 
    $$\boxed{z_{k} = \lambda_{k}z_{1} \quad\text{avec}\quad \lambda_{k} = \frac{|z_{k}|}{|z_{1}|} > 0}$$
     Géométriquement, l'égalité a lieu si et seulement si tous les vecteurs ont même direction et même sens : la ligne brisée qui les met bout à bout est un segment.
- id: "ma-04-18"
  feuille: "f-ma-04"
  numero: 18
  partie: "Le corps des nombres complexes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [calcul dans ℂ, module]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $a$ un complexe tel que $|a| < 1$.

    **1.** Montrer que $1 - \overline{a}z \neq 0$ pour tout complexe $z$ tel que $|z| \leqslant 1$.

    **2.** Établir, pour tout complexe $z$ tel que $\overline{a}z \neq 1$, l'identité 
    $$1 - \Big|\frac{z - a}{1 - \overline{a}z}\Big|^{2} = \frac{(1 - |a|^{2})(1 - |z|^{2})}{|1 - \overline{a}z|^{2}}.$$

    **3.** En déduire que, si $|z| < 1$, alors $\Big|\dfrac{z - a}{1 - \overline{a}z}\Big| < 1$, et que, si $|z| = 1$, ce module vaut $1$.
  corrige: |
    **1.** Si $|z| \leqslant 1$, alors $|\overline{a}z| = |a|\,|z| \leqslant |a| < 1$, donc $\overline{a}z \neq 1$ : $\boxed{1 - \overline{a}z \neq 0}$

    **2.** On développe les deux carrés de modules par la formule $|u - v|^{2} = |u|^{2} + |v|^{2} - 2\operatorname{Re}(u\overline{v})$ : 
    $$|1 - \overline{a}z|^{2} = 1 + |a|^{2}|z|^{2} - 2\operatorname{Re}(\overline{a}z) \qquad\text{et}\qquad |z - a|^{2} = |z|^{2} + |a|^{2} - 2\operatorname{Re}(z\overline{a}).$$
     Les termes en $\operatorname{Re}$ sont égaux, et la différence vaut $1 + |a|^{2}|z|^{2} - |z|^{2} - |a|^{2} = (1 - |a|^{2})(1 - |z|^{2})$. On divise par $|1 - \overline{a}z|^{2} > 0$. 
    $$\boxed{1 - \Big|\frac{z - a}{1 - \overline{a}z}\Big|^{2} = \frac{(1 - |a|^{2})(1 - |z|^{2})}{|1 - \overline{a}z|^{2}}}$$

    **3.** Si $|z| < 1$, le membre de droite est strictement positif ; si $|z| = 1$, il est nul. 
    $$\boxed{|z| < 1 \Rightarrow \Big|\frac{z - a}{1 - \overline{a}z}\Big| < 1 \qquad\text{et}\qquad |z| = 1 \Rightarrow \Big|\frac{z - a}{1 - \overline{a}z}\Big| = 1}$$

    *À retenir :* l'application $z \mapsto \frac{z - a}{1 - \overline{a}z}$ envoie le disque unité ouvert dans lui-même et le cercle unité dans lui-même, en envoyant $a$ sur $0$ ; ces applications jouent un grand rôle en analyse complexe.
- id: "ma-04-19"
  feuille: "f-ma-04"
  numero: 19
  partie: "Le corps des nombres complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [calcul dans ℂ, module]
  noeuds: [c-calcul]
  notions: [nombre-complexe, module-complexe]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On note $S = \{n^{2} + m^{2} \mid (n, m) \in \mathbb{Z}^{2}\}$ l'ensemble des entiers sommes de deux carrés.

    **1.** Montrer que $3 \notin S$.

    **2.** En interprétant $n^{2} + m^{2}$ comme le carré du module d'un nombre complexe, montrer que le produit de deux éléments de $S$ appartient à $S$. Écrire ainsi $13 \times 17 = 221$ comme somme de deux carrés.

    **3.** On note $S' = \{n^{2} + m^{2} + p^{2} \mid (n, m, p) \in \mathbb{Z}^{3}\}$. Montrer que $3$ et $5$ appartiennent à $S'$, mais pas $15$. Pourquoi la méthode de la question 2 ne s'applique-t-elle pas ?
  corrige: |
    **1.** Si $n^{2} + m^{2} = 3$, alors $n^{2} \leqslant 3$ et $m^{2} \leqslant 3$, donc $n, m \in \{-1, 0, 1\}$, et $n^{2} + m^{2} \leqslant 2$ : contradiction. $\boxed{3 \notin S}$

    **2.** Si $s = n^{2} + m^{2} = |n + \mathrm{i} m|^{2}$ et $s' = p^{2} + q^{2} = |p + \mathrm{i} q|^{2}$, alors, par multiplicativité du module, 
    $$ss' = |(n + \mathrm{i} m)(p + \mathrm{i} q)|^{2} = (np - mq)^{2} + (nq + mp)^{2},$$
     et $np - mq$, $nq + mp$ sont des entiers : $\boxed{ss' \in S}$. Avec $13 = |2 + 3\mathrm{i}|^{2}$ et $17 = |1 + 4\mathrm{i}|^{2}$, on obtient $(2 + 3\mathrm{i})(1 + 4\mathrm{i}) = -10 + 11\mathrm{i}$, et, en remplaçant $1 + 4\mathrm{i}$ par son conjugué, $(2 + 3\mathrm{i})(1 - 4\mathrm{i}) = 14 - 5\mathrm{i}$. 
    $$\boxed{221 = 10^{2} + 11^{2} = 14^{2} + 5^{2}}$$

    **3.** On a $3 = 1 + 1 + 1$ et $5 = 4 + 1 + 0$. Les carrés inférieurs à $15$ sont $0$, $1$, $4$, $9$, et aucune somme de trois d'entre eux ne vaut $15$ : avec $9$, il faudrait $6 = a + b$ avec $a, b \in \{0, 1, 4\}$, impossible ; sans $9$, la somme est au plus $12$. $\boxed{15 \notin S', \text{ donc } S' \text{ n'est pas stable par produit}}$

    La méthode de la question 2 repose sur une multiplication de $\mathbb{R}^{2}$, celle de $\mathbb{C}$, qui vérifie $|zz'| = |z|\,|z'|$ ; il n'existe pas de multiplication analogue sur $\mathbb{R}^{3}$, et le contre-exemple $3 \times 5 = 15$ le montre à sa manière.
- id: "ma-04-20"
  feuille: "f-ma-04"
  numero: 20
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["formules d'Euler et de Moivre", trigonométrie, linéarisation]
  noeuds: [tg-cercle]
  notions: [exponentielle, pi, cosinus-sinus]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Linéariser les expressions suivantes, c'est-à-dire les écrire comme des sommes de termes $\cos(kx)$ et $\sin(kx)$ avec $k$ entier.

    **(a)** $\cos^{4} x$

    **(b)** $\sin^{5} x$

    **(c)** $\cos^{2} x\,\sin^{3} x$

    **(d)** $\cos^{3} x\,\sin(3x)$
  corrige: |
    On remplace $\cos x$ et $\sin x$ par les formules d'Euler, on développe par la formule du binôme, et l'on regroupe les termes conjugués.

    • **(a)** $\cos^{4} x = \dfrac{\mathrm{e}^{4\mathrm{i} x} + 4\mathrm{e}^{2\mathrm{i} x} + 6 + 4\mathrm{e}^{-2\mathrm{i} x} + \mathrm{e}^{-4\mathrm{i} x}}{16}$, d'où $\boxed{\cos^{4} x = \dfrac{\cos(4x) + 4\cos(2x) + 3}{8}}$

    • **(b)** $(2\mathrm{i})^{5} = 32\mathrm{i}$ et $\sin^{5} x = \dfrac{(\mathrm{e}^{\mathrm{i} x} - \mathrm{e}^{-\mathrm{i} x})^{5}}{32\mathrm{i}} = \dfrac{2\mathrm{i}\sin(5x) - 10\mathrm{i}\sin(3x) + 20\mathrm{i}\sin x}{32\mathrm{i}}$, d'où 
    $$\boxed{\sin^{5} x = \frac{\sin(5x) - 5\sin(3x) + 10\sin x}{16}}$$

    • **(c)** On écrit $\cos^{2} x\sin^{3} x = (1 - \sin^{2} x)\sin^{3} x$, ou l'on développe directement ; on trouve 
    $$\boxed{\cos^{2} x\,\sin^{3} x = \frac{2\sin x + \sin(3x) - \sin(5x)}{16}}$$

    • **(d)** On linéarise $\cos^{3} x = \frac{\cos(3x) + 3\cos x}{4}$, puis l'on utilise $\sin a\cos b = \frac{\sin(a + b) + \sin(a - b)}{2}$ : 
    $$\cos^{3} x\sin(3x) = \frac{\sin(6x)}{8} + \frac{3\big(\sin(4x) + \sin(2x)\big)}{8},$$

    $$\boxed{\cos^{3} x\,\sin(3x) = \frac{\sin(6x) + 3\sin(4x) + 3\sin(2x)}{8}}$$

    On contrôle chaque formule en une valeur particulière : en $x = \frac{\pi}{2}$, (b) donne $\frac{1 + 5 + 10}{16} = 1$ ✓.
- id: "ma-04-21"
  feuille: "f-ma-04"
  numero: 21
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["formules d'Euler et de Moivre", trigonométrie]
  noeuds: [tg-cercle]
  notions: [exponentielle, pi, cosinus-sinus]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Exprimer $\cos(4x)$ et $\sin(4x)$ en fonction de $\cos x$ et $\sin x$.

    **2.** Montrer que $\cos(5x) = 16\cos^{5} x - 20\cos^{3} x + 5\cos x$ pour tout réel $x$.

    **3.** En appliquant la question 2 à $x = \dfrac{\pi}{10}$, calculer $\cos\dfrac{\pi}{10}$. Quelle propriété du cosinus permet de choisir la bonne valeur parmi celles que donne le calcul ?
  corrige: |
    **1.** Avec $c = \cos x$ et $s = \sin x$, la formule de Moivre et celle du binôme donnent 
    $$(c + \mathrm{i} s)^{4} = c^{4} + 4\mathrm{i} c^{3}s - 6c^{2}s^{2} - 4\mathrm{i} cs^{3} + s^{4}.$$

    $$\boxed{\cos(4x) = c^{4} - 6c^{2}s^{2} + s^{4} \qquad \sin(4x) = 4c^{3}s - 4cs^{3}}$$

    **2.** La partie réelle de $(c + \mathrm{i} s)^{5}$ est $c^{5} - 10c^{3}s^{2} + 5cs^{4}$. On remplace $s^{2}$ par $1 - c^{2}$ : 
    $$c^{5} - 10c^{3}(1 - c^{2}) + 5c(1 - c^{2})^{2} = \boxed{16c^{5} - 20c^{3} + 5c}.$$

    **3.** Pour $x = \frac{\pi}{10}$, $\cos(5x) = 0$, et $c = \cos\frac{\pi}{10} \neq 0$ vérifie $16c^{4} - 20c^{2} + 5 = 0$, d'où $c^{2} = \frac{5 \pm \sqrt{5}}{8}$. Le cosinus étant décroissant sur $[0\,,\pi]$ et $\frac{\pi}{10} < \frac{\pi}{6}$, on a $c^{2} > \frac{3}{4} = \frac{6}{8}$, ce qui élimine $\frac{5 - \sqrt{5}}{8} < \frac{3}{8}$ ; enfin $c > 0$. 
    $$\boxed{\cos\frac{\pi}{10} = \sqrt{\frac{5 + \sqrt{5}}{8}}}$$
- id: "ma-04-22"
  feuille: "f-ma-04"
  numero: 22
  partie: "Nombres complexes de module 1 et trigonométrie"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["formules d'Euler et de Moivre", trigonométrie, sommes trigonométriques]
  noeuds: [tg-cercle, n-sommes, pol-binome]
  notions: [exponentielle, pi, coefficient-binomial, cosinus-sinus]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $x$ un réel. Calculer les sommes suivantes, en précisant les valeurs de $x$ à écarter.

    **(a)** $\displaystyle\sum_{k=0}^{n} \binom{n}{k}\cos(kx)$ et $\displaystyle\sum_{k=0}^{n} \binom{n}{k}\sin(kx)$.

    **(b)** $\displaystyle\sum_{k=0}^{n} \cos^{2}(kx)$ et $\displaystyle\sum_{k=0}^{n} \sin^{2}(kx)$.

    **(c)** $\displaystyle\sum_{k=0}^{n} \frac{(-1)^{k}\cos(kx)}{2^{k}}$.

    **(d)** $\displaystyle\sum_{k=0}^{n} \cos^{k} x\,\cos(kx)$.
  corrige: |
    Dans chaque cas, on reconnaît la partie réelle, ou imaginaire, d'une somme d'exponentielles que l'on sait calculer.

    **(a)** La formule du binôme, puis l'angle moitié donnent, pour tout réel $x$, 
    $$\sum_{k=0}^{n} \binom{n}{k}\mathrm{e}^{\mathrm{i} kx} = (1 + \mathrm{e}^{\mathrm{i} x})^{n} = 2^{n}\cos^{n}\frac{x}{2}\;\mathrm{e}^{\mathrm{i} nx/2}.$$

    $$\boxed{\sum_{k=0}^{n} \binom{n}{k}\cos(kx) = 2^{n}\cos^{n}\frac{x}{2}\cos\frac{nx}{2} \qquad \sum_{k=0}^{n} \binom{n}{k}\sin(kx) = 2^{n}\cos^{n}\frac{x}{2}\sin\frac{nx}{2}}$$

    **(b)** On linéarise, $\cos^{2}(kx) = \frac{1 + \cos(2kx)}{2}$, et l'on applique la proposition 15 du cours avec l'angle $2x$, lorsque $x \not\equiv 0\ [\pi]$ : 
    $$\boxed{\sum_{k=0}^{n} \cos^{2}(kx) = \frac{n + 1}{2} + \frac{\cos(nx)\sin((n+1)x)}{2\sin x} \qquad \sum_{k=0}^{n} \sin^{2}(kx) = \frac{n + 1}{2} - \frac{\cos(nx)\sin((n+1)x)}{2\sin x}}$$
     la seconde s'obtenant en retranchant la première de $n + 1$. Si $x \equiv 0\ [\pi]$, les deux sommes valent $n + 1$ et $0$.

    **(c)** C'est la partie réelle de la somme géométrique de raison $q = -\frac{\mathrm{e}^{\mathrm{i} x}}{2}$, qui n'est jamais égale à $1$ puisque $|q| = \frac{1}{2}$ ; aucune valeur de $x$ n'est à écarter. On multiplie numérateur et dénominateur par le conjugué de $1 - q = \frac{2 + \mathrm{e}^{\mathrm{i} x}}{2}$, dont le carré du module vaut $\frac{5 + 4\cos x}{4}$ : 
    $$\sum_{k=0}^{n} q^{k} = \frac{1 - q^{n+1}}{1 - q} = \frac{2\big(2 + \mathrm{e}^{-\mathrm{i} x}\big)\Big(1 + \dfrac{(-1)^{n}}{2^{n+1}}\mathrm{e}^{\mathrm{i}(n+1)x}\Big)}{5 + 4\cos x}.$$

    $$\boxed{\sum_{k=0}^{n} \frac{(-1)^{k}\cos(kx)}{2^{k}} = \frac{2(2 + \cos x) + \dfrac{(-1)^{n}}{2^{n}}\big(2\cos((n+1)x) + \cos(nx)\big)}{5 + 4\cos x}}$$
     Pour $n = 0$, on trouve $\frac{4 + 2\cos x + 2\cos x + 1}{5 + 4\cos x} = 1$ ✓.

    **(d)** C'est la partie réelle de la somme géométrique de raison $q = \cos x\,\mathrm{e}^{\mathrm{i} x}$. Si $x \equiv 0\ [\pi]$, chaque terme vaut $(\pm 1)^{k}(\pm 1)^{k} = 1$, et la somme vaut $n + 1$. Sinon $|q| = |\cos x| < 1$, donc $q \neq 1$, et 
    $$1 - q = 1 - \cos^{2} x - \mathrm{i}\sin x\cos x = -\mathrm{i}\sin x\,\mathrm{e}^{\mathrm{i} x}, \qquad \sum_{k=0}^{n} q^{k} = \frac{\mathrm{i}\big(\mathrm{e}^{-\mathrm{i} x} - \cos^{n+1} x\;\mathrm{e}^{\mathrm{i} nx}\big)}{\sin x}.$$

    $$\boxed{\sum_{k=0}^{n} \cos^{k} x\cos(kx) = 1 + \frac{\cos^{n+1} x\,\sin(nx)}{\sin x} \quad\text{pour } x \not\equiv 0\ [\pi]}$$

    *Piège :* la partie réelle d'un quotient n'est pas le quotient des parties réelles ; on simplifie d'abord le quotient, puis on prend la partie réelle.
