    On lance trois fois de suite un dé équilibré à six faces. Déterminer la probabilité d'obtenir au moins un six, puis exactement un six, puis au moins deux résultats égaux, puis au moins deux résultats égaux et une somme des résultats paire.
  corrige: |
    On prend $\Omega = \llbracket 1\,,6 \rrbracket^{3}$, ensemble des triplets de résultats des dés pris dans l'ordre des lancers, muni de la probabilité uniforme : $|\Omega| = 216$. On compte les cas favorables.

    • *Au moins un six.* Le contraire, « aucun six », correspond à $\llbracket 1\,,5 \rrbracket^{3}$, qui a $125$ éléments (proposition 2 (iv)) : la probabilité vaut $1 - \frac{125}{216}$.

    • *Exactement un six.* On choisit le rang du six, de $3$ façons, puis les deux autres résultats dans $\llbracket 1\,,5 \rrbracket$, de $25$ façons : $75$ issues.

    • *Au moins deux résultats égaux.* Le contraire, « trois résultats distincts », compte $A_{6}^{3} = 120$ issues (théorème 1).

    • *Au moins deux égaux et somme paire.* Les triplets constants $(a, a, a)$ ont une somme $3a$ paire si et seulement si $a$ est pair : $3$ issues. Les triplets ayant exactement deux résultats égaux s'écrivent, à l'ordre près, $a$, $a$, $b$ avec $b \neq a$ ; leur somme $2a + b$ est paire si et seulement si $b$ est pair. On choisit $b$ pair ($3$ façons), $a \neq b$ ($5$ façons) et le rang de $b$ ($3$ façons) : $45$ issues, soit $48$ en tout.

    $$\boxed{\mathrm{P}(\text{au moins un six}) = \frac{91}{216}, \qquad \mathrm{P}(\text{un seul six}) = \frac{25}{72}}$$

    $$\boxed{\mathrm{P}(\text{deux résultats égaux}) = \frac{4}{9}, \qquad \mathrm{P}(\text{deux résultats égaux, somme paire}) = \frac{2}{9}}$$
     Une énumération des $216$ issues confirme ces quatre valeurs ✓. Parmi les issues ayant deux résultats égaux, la moitié exactement ont une somme paire ($48$ sur $96$).

    *Piège.* Pour « au moins un six », l'erreur la plus répandue est d'additionner les probabilités $\frac{1}{6}$ des trois lancers, ce qui donne $\frac{1}{2}$ : les événements « le $i$-ième lancer donne six » ne sont pas incompatibles, et $\frac{1}{2}$ n'est qu'un majorant (sous-additivité, proposition 7 (iv)). On passe par le contraire, comme le recommande la méthode de la section 21.2.6.
