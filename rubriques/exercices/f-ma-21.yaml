  etoiles: 2
  types: [Calcul]
  mots_cles: [variables aléatoires, probabilités, tirages]
  noeuds: [p-variables, p-espace, pol-binome]
  notions: [variable-aleatoire, probabilite, coefficient-binomial]
  page_enonce: 15
  page_corrige: 55
  enonce: |
    Une urne contient $b$ boules blanches et $r \geqslant 1$ boules rouges. On tire successivement toutes les boules, sans remise, tous les ordres de sortie étant également probables, et l'on note $N$ le numéro du tirage au cours duquel la première boule rouge sort. Déterminer la loi de $N$. Quelle identité entre coefficients binomiaux obtient-on en écrivant que la somme des probabilités vaut $1$ ?
  corrige: |
    *Modèle.* On numérote les boules et l'on munit l'ensemble des $(b + r)!$ ordres de sortie de la probabilité uniforme. L'ensemble des rangs de sortie des boules rouges est une partie à $r$ éléments de $\llbracket 1\,,b + r \rrbracket$, et chacune de ces parties correspond au même nombre $r!\,b!$ d'ordres (on permute les rouges entre elles et les blanches entre elles) : par le lemme des bergers, cette partie suit la loi uniforme sur les $\binom{b + r}{r}$ parties à $r$ éléments. Le rang $N$ est le plus petit élément de cette partie, et $N \in \llbracket 1\,,b + 1 \rrbracket$, puisque les $b + 1$ premiers tirages ne peuvent pas être tous blancs.

    *Loi de $N$.* Soit $k \in \llbracket 1\,,b + 1 \rrbracket$. L'événement $(N = k)$ est formé des parties qui contiennent $k$, ne contiennent aucun élément de $\llbracket 1\,,k - 1 \rrbracket$, et contiennent $r - 1$ éléments de $\llbracket k + 1\,,b + r \rrbracket$, ensemble à $b + r - k$ éléments : 
    $$\boxed{\mathrm{P}(N = k) = \frac{\binom{b + r - k}{r - 1}}{\binom{b + r}{r}}, \qquad k \in \llbracket 1\,,b + 1 \rrbracket}$$
     On retrouve ce résultat par les probabilités composées (proposition 9), en tirant d'abord $k - 1$ boules blanches, puis une rouge : 
    $$\mathrm{P}(N = k) = \frac{b}{b + r} \cdot \frac{b - 1}{b + r - 1} \cdots \frac{b - k + 2}{b + r - k + 2} \cdot \frac{r}{b + r - k + 1},$$
     et les deux formules coïncident, comme on le vérifie en simplifiant les factorielles. Par exemple, pour $b = 3$ et $r = 2$, la loi de $N$ est $\big(\frac{4}{10}, \frac{3}{10}, \frac{2}{10}, \frac{1}{10}\big)$ sur $\llbracket 1\,,4 \rrbracket$ : elle décroît, puisqu'il est d'autant moins probable d'attendre longtemps.

    *Identité.* Les probabilités $\mathrm{P}(N = k)$, pour $k \in \llbracket 1\,,b + 1 \rrbracket$, ont pour somme $1$. En posant $j = b + r - k$, qui parcourt $\llbracket r - 1\,,b + r - 1 \rrbracket$, on obtient 
    $$\boxed{\sum_{k=1}^{b+1} \binom{b + r - k}{r - 1} = \sum_{j=r-1}^{b+r-1} \binom{j}{r - 1} = \binom{b + r}{r}}$$
     C'est la formule de la crosse de hockey, utilisée dans l'exercice 35 de la feuille du chapitre 3, avec $p = r - 1$ et $n = b + r - 1$. Elle reçoit ici une démonstration probabiliste : on classe les parties à $r$ éléments de $\llbracket 1\,,b + r \rrbracket$ selon leur plus petit élément.
- id: "ma-21-59"
  feuille: "f-ma-21"
  numero: 59
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variables aléatoires]
  noeuds: [p-variables]
  notions: [variable-aleatoire]
  page_enonce: 15
  page_corrige: 55
  enonce: |
    Soit $n \in \mathbb{N}^{*}$, $p \in \left]0\,,1\right[$ et $X \sim \mathcal{B}(n,p)$. Quelles sont les valeurs les plus probables de $X$ ? On étudiera le quotient $\frac{\mathrm{P}(X = k + 1)}{\mathrm{P}(X = k)}$, et l'on comparera avec l'exercice 28 de la feuille du chapitre 3.
  corrige: |
    On note $q = 1 - p$ et $\pi_{k} = \mathrm{P}(X = k) = \binom{n}{k}p^{k}q^{n-k} > 0$ pour $k \in \llbracket 0\,,n \rrbracket$. Pour $k \in \llbracket 0\,,n - 1 \rrbracket$, la relation $\binom{n}{k+1} = \frac{n - k}{k + 1}\binom{n}{k}$ donne 
    $$\boxed{\frac{\pi_{k+1}}{\pi_{k}} = \frac{(n - k)p}{(k + 1)q}} \qquad\text{et}\qquad \frac{\pi_{k+1}}{\pi_{k}} > 1 \iff (n - k)p > (k + 1)(1 - p) \iff k < (n + 1)p - 1,$$
     avec égalité du quotient à $1$ si et seulement si $k = (n + 1)p - 1$. On note $m = \lfloor (n + 1)p \rfloor$, qui appartient à $\llbracket 0\,,n \rrbracket$ puisque $0 < (n + 1)p < n + 1$.

    • Pour $k \geqslant m$, on a $k > (n + 1)p - 1$, donc $\pi_{k+1} < \pi_{k}$ : la suite $(\pi_{k})$ est strictement décroissante sur $\llbracket m\,,n \rrbracket$.

    • Pour $k \leqslant m - 1$, on a $k \leqslant (n + 1)p - 1$, donc $\pi_{k+1} \geqslant \pi_{k}$, avec égalité seulement si $k = m - 1$ et $(n + 1)p = m$.

    La suite $(\pi_{k})$ croît donc jusqu'au rang $m$, puis décroît strictement : 
    $$\boxed{\begin{array}{l} \text{si } (n + 1)p \notin \mathbb{N}, \text{ la valeur la plus probable est } \lfloor (n + 1)p \rfloor ; \\[2pt] \text{si } (n + 1)p \in \mathbb{N}, \text{ il y en a deux}, \ (n + 1)p - 1 \text{ et } (n + 1)p \end{array}}$$
     Dans le second cas, $(n + 1)p$ appartient à $\llbracket 1\,,n \rrbracket$, et les deux valeurs sont dans $\llbracket 0\,,n \rrbracket$. Pour $\mathcal{B}(10,0{,}3)$, on a $(n + 1)p = 3{,}3$ et la valeur la plus probable est $3$, comme sur la figure de la section 21.5.3 ; pour $\mathcal{B}(9,\frac{1}{2})$, on a $(n + 1)p = 5$, et $4$ et $5$ sont également probables.

    Pour $p = \frac{1}{2}$, on a $\pi_{k} = \frac{1}{2^{n}}\binom{n}{k}$, et l'on retrouve le résultat de l'exercice 28 de la feuille du chapitre 3 : les coefficients $\binom{n}{k}$ croissent puis décroissent, avec un maximum en $\frac{n}{2}$ si $n$ est pair, et deux maxima égaux en $\frac{n - 1}{2}$ et $\frac{n + 1}{2}$ si $n$ est impair. Le facteur $\big(\frac{p}{q}\big)^{k}$ décale le maximum de $\frac{n}{2}$ vers $np$ : de $(n + 1)p - 1 \leqslant m \leqslant (n + 1)p$, on tire $np - q \leqslant m \leqslant np + p$, et la valeur la plus probable est à moins de $1$ de $np$, nombre que la section 21.6 identifiera à l'espérance.
- id: "ma-21-60"
  feuille: "f-ma-21"
  numero: 60
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variables aléatoires, indépendance, lois de Bernoulli et binomiale]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, independance]
  page_enonce: 15
  page_corrige: 56
  enonce: |
    Soit $p \in \left]0\,,1\right[$ et $k \in \mathbb{N}$. Pour $n \geqslant 1$, on considère une variable aléatoire $X_{n}$ de loi $\mathcal{B}(n,p)$. Montrer que la suite $\big(\mathrm{P}(X_{n} \geqslant k)\big)_{n \geqslant 1}$ est croissante. On pourra réaliser simultanément $X_{n}$ et $X_{n+1}$ à l'aide de variables de Bernoulli indépendantes, grâce à la proposition 17 et au théorème 8 du cours.
  corrige: |
    *Couplage.* Soit $n \geqslant 1$. Par la proposition 17, il existe un espace probabilisé fini, par exemple $\{0, 1\}^{n+1}$ muni de la probabilité produit, portant des variables $B_{1}$, …, $B_{n+1}$ mutuellement indépendantes de loi $\mathcal{B}(p)$. On pose 
    $$Y_{n} = B_{1} + \cdots + B_{n}, \qquad Y_{n+1} = Y_{n} + B_{n+1}.$$
     Par le théorème 8, $Y_{n} \sim \mathcal{B}(n,p)$ et $Y_{n+1} \sim \mathcal{B}(n + 1,p)$. Comme $B_{n+1} \geqslant 0$, on a $Y_{n} \leqslant Y_{n+1}$ en chaque issue, donc $(Y_{n} \geqslant k) \subset (Y_{n+1} \geqslant k)$, et, par croissance de la probabilité (proposition 7 (iii)), $\mathrm{P}(Y_{n} \geqslant k) \leqslant \mathrm{P}(Y_{n+1} \geqslant k)$.

    *Retour aux $X_{n}$.* La probabilité $\mathrm{P}(X_{n} \geqslant k)$ ne dépend que de la loi de $X_{n}$, qui est celle de $Y_{n}$ ; de même pour $X_{n+1}$ et $Y_{n+1}$. Donc 
    $$\boxed{\mathrm{P}(X_{n} \geqslant k) = \mathrm{P}(Y_{n} \geqslant k) \leqslant \mathrm{P}(Y_{n+1} \geqslant k) = \mathrm{P}(X_{n+1} \geqslant k)}$$
     et la suite $\big(\mathrm{P}(X_{n} \geqslant k)\big)_{n \geqslant 1}$ est croissante.

    Le couplage donne même l'accroissement. On a $(Y_{n+1} \geqslant k) \setminus (Y_{n} \geqslant k) = (Y_{n} = k - 1) \cap (B_{n+1} = 1)$, et $Y_{n}$ est indépendante de $B_{n+1}$ par le lemme des coalitions (théorème 7), d'où, pour $k \geqslant 1$, 
    $$\boxed{\mathrm{P}(X_{n+1} \geqslant k) - \mathrm{P}(X_{n} \geqslant k) = \binom{n}{k - 1}p^{k}(1 - p)^{n-k+1} \geqslant 0}$$
     avec la convention $\binom{n}{k-1} = 0$ si $k - 1 > n$ ; pour $k = 0$, la suite est constante, égale à $1$.

    *Piège.* Les variables $X_{n}$ de l'énoncé sont données séparément, peut-être sur des espaces probabilisés différents, et l'inégalité $X_{n} \leqslant X_{n+1}$ n'a aucun sens. L'erreur la plus répandue est de l'écrire quand même. Le couplage contourne la difficulté : on construit, sur un même univers, des variables ayant les lois voulues et comparables issue par issue, ce qui suffit pour conclure, puisque l'énoncé ne porte que sur des lois. La comparaison directe des sommes $\sum_{j \geqslant k} \binom{n}{j}p^{j}q^{n-j}$ serait nettement plus pénible.
- id: "ma-21-61"
  feuille: "f-ma-21"
  numero: 61
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variables aléatoires, indépendance, loi uniforme, tirages]
  noeuds: [p-variables, p-independance, p-espace]
  notions: [variable-aleatoire, independance]
  page_enonce: 15
  page_corrige: 57
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $r \geqslant 2$. On choisit des parties $X_{1}$, …, $X_{r}$ de $\llbracket 1\,,n \rrbracket$ indépendantes et de loi uniforme sur $\mathcal{P}(\llbracket 1\,,n \rrbracket)$.

    **1.** Calculer $\mathrm{P}(X_{1} \subset X_{2})$, $\mathrm{P}(X_{1} \cap X_{2} = \varnothing)$ et $\mathrm{P}\big(|X_{1} \cap X_{2}| = 1\big)$, en utilisant l'exercice 10 et l'exercice 39 de la feuille du chapitre 1.

    **2.** Déterminer la loi de $|X_{1} \cap X_{2} \cap \cdots \cap X_{r}|$.

    **3.** On choisit maintenant le couple $(A, B)$ selon la loi uniforme sur l'ensemble des couples de parties *distinctes* de $\llbracket 1\,,n \rrbracket$, ce qui revient à un tirage sans remise. Calculer $\mathrm{P}(A \subset B)$ et comparer avec la question 1.
  corrige: |
    *Modèle.* On note $E = \llbracket 1\,,n \rrbracket$. Par indépendance (proposition 15), le $r$-uplet $(X_{1}, \dots, X_{r})$ suit la loi uniforme sur $\mathcal{P}(E)^{r}$, chaque $r$-uplet ayant la probabilité $\big(\frac{1}{2^{n}}\big)^{r}$.

    **1.** Le couple $(X_{1}, X_{2})$ suit la loi uniforme sur les $4^{n}$ couples de parties de $E$. L'exercice 39 de la feuille du chapitre 1 a dénombré $3^{n}$ couples $(X, Y)$ tels que $X \subset Y$, et $3^{n}$ tels que $X \cap Y = \varnothing$ ; la question 3 de l'exercice 10 en a dénombré $n\,3^{n-1}$ tels que $X \cap Y$ soit un singleton. D'où 
    $$\boxed{\mathrm{P}(X_{1} \subset X_{2}) = \Big(\frac{3}{4}\Big)^{n}, \qquad \mathrm{P}(X_{1} \cap X_{2} = \varnothing) = \Big(\frac{3}{4}\Big)^{n}, \qquad \mathrm{P}\big(|X_{1} \cap X_{2}| = 1\big) = \frac{n\,3^{n-1}}{4^{n}}}$$
     Les deux premières probabilités sont égales, ce qui s'explique : $X_{2} \mapsto E \setminus X_{2}$ est une bijection de $\mathcal{P}(E)$, qui conserve la loi uniforme, et $X_{1} \subset X_{2}$ équivaut à $X_{1} \cap (E \setminus X_{2}) = \varnothing$. Toutes trois tendent vers $0$ : deux parties prises au hasard sont rarement emboîtées.

    **2.** L'application $X \mapsto (\mathbf{1}_{X}(1), \dots, \mathbf{1}_{X}(n))$ est une bijection de $\mathcal{P}(E)$ sur $\{0, 1\}^{n}$ (chapitre 2). La loi uniforme sur $\mathcal{P}(E)^{r}$ correspond donc à la loi uniforme sur $\{0, 1\}^{nr}$, et, par la proposition 17, les $nr$ variables $\mathbf{1}_{X_{j}}(i)$, pour $i \in E$ et $j \in \llbracket 1\,,r \rrbracket$, sont mutuellement indépendantes de loi $\mathcal{B}(\frac{1}{2})$. Pour $i \in E$, on pose 
    $$Z_{i} = \mathbf{1}_{X_{1} \cap \cdots \cap X_{r}}(i) = \prod_{j=1}^{r} \mathbf{1}_{X_{j}}(i).$$
     Chaque $Z_{i}$ vaut $1$ si et seulement si les $r$ facteurs valent $1$, avec la probabilité $2^{-r}$ par indépendance : $Z_{i} \sim \mathcal{B}(2^{-r})$. Les variables $Z_{1}$, …, $Z_{n}$ sont des fonctions des paquets disjoints $\big(\mathbf{1}_{X_{j}}(i)\big)_{1 \leqslant j \leqslant r}$, donc mutuellement indépendantes par le lemme des coalitions (théorème 7). Enfin $|X_{1} \cap \cdots \cap X_{r}| = Z_{1} + \cdots + Z_{n}$, et le théorème 8 conclut : 
    $$\boxed{|X_{1} \cap X_{2} \cap \cdots \cap X_{r}| \sim \mathcal{B}(n,2^{-r})}$$
     Pour $r = 2$, on retrouve $\mathrm{P}(|X_{1} \cap X_{2}| = 0) = \big(\frac{3}{4}\big)^{n}$ et $\mathrm{P}(|X_{1} \cap X_{2}| = 1) = n \cdot \frac{1}{4}\big(\frac{3}{4}\big)^{n-1}$, conformément à la question 1 ✓. Avec $r = 1$, le même raisonnement montre que le cardinal d'une partie uniforme suit la loi $\mathcal{B}(n,\frac{1}{2})$.

    **3.** Il y a $4^{n} - 2^{n}$ couples de parties distinctes, et, parmi les $3^{n}$ couples tels que $A \subset B$, les $2^{n}$ couples $(A, A)$ sont exclus : 
    $$\boxed{\mathrm{P}(A \subset B) = \frac{3^{n} - 2^{n}}{4^{n} - 2^{n}}}$$
     Pour $n = 1$, on obtient $\frac{1}{2}$, contre $\frac{3}{4}$ à la question 1, et pour $n = 4$, $\frac{13}{48} \approx 0{,}271$ contre $\frac{81}{256} \approx 0{,}316$. Cette probabilité est toujours strictement inférieure à $\big(\frac{3}{4}\big)^{n}$, puisque 
    $$4^{n}(3^{n} - 2^{n}) - 3^{n}(4^{n} - 2^{n}) = 6^{n} - 8^{n} < 0 :$$
     le tirage sans remise exclut les couples $(A, A)$, qui réalisent tous l'inclusion. Le rapport des deux probabilités tend vers $1$, puisque $\frac{2^{n}}{3^{n}}$ et $\frac{2^{n}}{4^{n}}$ tendent vers $0$ : pour $n$ grand, tirer avec ou sans remise revient presque au même, car deux tirages avec remise coïncident rarement.
- id: "ma-21-62"
  feuille: "f-ma-21"
  numero: 62
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variables aléatoires, indépendance]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, independance]
  page_enonce: 16
  page_corrige: 58
  enonce: |
    Soit $X$ et $Y$ deux variables aléatoires à valeurs dans $\llbracket 1\,,n \rrbracket$. On note $M \in \mathcal{M}_{n}(\mathbb{R})$ la matrice de coefficients $m_{i,j} = \mathrm{P}(X = i, Y = j)$. Montrer que $M$ est de rang $1$ si et seulement si $X$ et $Y$ sont indépendantes. On utilisera la caractérisation des matrices de rang $1$ établie dans l'exercice 43 de la feuille du chapitre 16 : une matrice est de rang $1$ si et seulement si elle s'écrit $UV^{T}$, où $U$ et $V$ sont deux colonnes non nulles.
  corrige: |
    On note $a_{i} = \mathrm{P}(X = i)$ et $b_{j} = \mathrm{P}(Y = j)$ pour $i$, $j \in \llbracket 1\,,n \rrbracket$, et $a$, $b$ les colonnes correspondantes. La proposition 15, appliquée aux valeurs $(i, j) \in \llbracket 1\,,n \rrbracket^{2}$, donne 
    $$X \perp\!\!\!\perp Y \iff m_{i,j} = a_{i}b_{j} \text{ pour tous } i, j \iff \boxed{M = a\,b^{T}}$$
     On peut remplacer $X(\Omega) \times Y(\Omega)$ par $\llbracket 1\,,n \rrbracket^{2}$ : si $a_{i} = 0$, alors $0 \leqslant m_{i,j} \leqslant a_{i}$ donne $m_{i,j} = 0 = a_{i}b_{j}$, et de même si $b_{j} = 0$.

    *Condition nécessaire.* Si $X$ et $Y$ sont indépendantes, $M = ab^{T}$, et les colonnes $a$ et $b$ sont non nulles, puisque leurs coefficients ont pour somme $1$. Par l'exercice 43 de la feuille du chapitre 16, $M$ est de rang $1$.

    *Condition suffisante.* Si $M$ est de rang $1$, l'exercice 43 fournit deux colonnes non nulles $U$ et $V$ telles que $M = UV^{T}$, soit $m_{i,j} = u_{i}v_{j}$. On note $\sigma_{U} = \sum_{i} u_{i}$ et $\sigma_{V} = \sum_{j} v_{j}$. Par la proposition 14, les lois marginales sont les sommes des lignes et des colonnes de $M$ : 
    $$a_{i} = \sum_{j=1}^{n} u_{i}v_{j} = \sigma_{V}\,u_{i}, \qquad b_{j} = \sigma_{U}\,v_{j}, \qquad 1 = \sum_{i,j} m_{i,j} = \sigma_{U}\sigma_{V}.$$
     Donc $a_{i}b_{j} = \sigma_{U}\sigma_{V}\,u_{i}v_{j} = m_{i,j}$ pour tous $i$, $j$, et $X$ et $Y$ sont indépendantes. 
    $$\boxed{\mathrm{rg}(M) = 1 \iff X \perp\!\!\!\perp Y}$$
     Le rang de $M$ n'est jamais nul, puisque la somme de ses coefficients vaut $1$ : la dépendance se traduit donc par un rang au moins égal à $2$. Dans l'exemple de la section 21.5.4, la loi conjointe du tirage avec remise est la matrice dont tous les coefficients valent $\frac{1}{9}$, de rang $1$, et celle du tirage sans remise, de coefficients $0$ sur la diagonale et $\frac{1}{6}$ ailleurs, est de rang $3$ ✓.

    *Piège.* Les colonnes $U$ et $V$ fournies par l'exercice 43 ne sont pas les lois marginales : elles ne sont définies qu'à un facteur près, puisque $UV^{T} = (\lambda U)(\lambda^{-1}V)^{T}$, et peuvent avoir des coefficients négatifs. C'est la normalisation $\sigma_{U}\sigma_{V} = 1$, imposée par la somme des probabilités, qui permet de revenir aux marges.
- id: "ma-21-63"
  feuille: "f-ma-21"
  numero: 63
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variables aléatoires, probabilités, loi uniforme]
  noeuds: [p-variables, p-espace]
  notions: [variable-aleatoire, probabilite]
  page_enonce: 16
  page_corrige: 58
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. On choisit quatre entiers $a$, $b$, $c$, $d$ dans $\llbracket -n\,,n \rrbracket$, indépendamment et selon la loi uniforme, et l'on note $p(n)$ la probabilité que la matrice $\begin{pmatrix} a & b \\ c & d \end{pmatrix}$ soit inversible. Montrer que $1 - p(n) \leqslant \frac{2}{2n + 1}$, et en déduire la limite de $p(n)$. On pourra distinguer selon que $a$ est nul ou non.
  corrige: |
    *Modèle.* On munit $\Omega = \llbracket -n\,,n \rrbracket^{4}$ de la probabilité uniforme, chaque quadruplet $(a, b, c, d)$ ayant la probabilité $\frac{1}{(2n + 1)^{4}}$ ; c'est le modèle de la proposition 17 pour quatre tirages indépendants uniformes. La matrice n'est pas inversible si et seulement si son déterminant $ad - bc$ est nul (chapitre 17).

    *Majoration.* L'événement $(ad = bc)$ est contenu dans la réunion des événements $(a = 0)$ et $(a \neq 0,\ ad = bc)$. Le premier a la probabilité $\frac{(2n + 1)^{3}}{(2n + 1)^{4}} = \frac{1}{2n + 1}$. Pour le second, on fixe $(a, b, c)$ avec $a \neq 0$ : l'égalité $ad = bc$ impose $d = \frac{bc}{a}$, et il y a au plus un $d$ convenable. Il y a $2n(2n + 1)^{2}$ triplets $(a, b, c)$ avec $a \neq 0$, donc l'événement contient au plus $2n(2n + 1)^{2}$ issues, et 
    $$\mathrm{P}(a \neq 0,\ ad = bc) \leqslant \frac{2n(2n + 1)^{2}}{(2n + 1)^{4}} = \frac{2n}{(2n + 1)^{2}} \leqslant \frac{1}{2n + 1}.$$
     Par la sous-additivité (proposition 7 (iv)), 
    $$\boxed{1 - p(n) = \mathrm{P}(ad - bc = 0) \leqslant \frac{2}{2n + 1}} \qquad\text{d'où}\qquad 1 - \frac{2}{2n + 1} \leqslant p(n) \leqslant 1, \qquad \boxed{\lim_{n \to +\infty} p(n) = 1}$$
     par encadrement. Les valeurs exactes, obtenues par énumération, confirment la majoration : $1 - p(n)$ vaut $\frac{11}{27} \approx 0{,}407$ pour $n = 1$ (majorant $\frac{2}{3}$), $\frac{129}{625} \approx 0{,}206$ pour $n = 2$ (majorant $0{,}4$) et $\frac{833}{14\,641} \approx 0{,}057$ pour $n = 5$ (majorant $\frac{2}{11} \approx 0{,}18$).

    *À retenir.* Une matrice à coefficients entiers pris au hasard dans un grand intervalle est presque sûrement inversible : être non inversible impose une relation entre les coefficients, qui détermine l'un d'eux en fonction des autres. La distinction selon $a$ sert à pouvoir diviser par $a$ ; sans elle, l'équation $0 \cdot d = bc$ laisserait $d$ libre, et la majoration par « au plus une valeur de $d$ » tomberait.
- id: "ma-21-64"
  feuille: "f-ma-21"
  numero: 64
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variables aléatoires, probabilités, indépendance, loi uniforme, jeux de hasard]
  noeuds: [p-variables, p-espace, p-independance]
  notions: [variable-aleatoire, probabilite, independance]
  page_enonce: 16
  page_corrige: 59
  enonce: |
    **1.** Soit $a$, $b$, $c$, $d$ et $\lambda$ cinq réels strictement positifs. Montrer qu'on ne peut pas avoir simultanément $ab = \lambda$, $cd = \lambda$ et $ac + bd \leqslant \lambda$.

    **2.** Soit $n \geqslant 1$. Existe-t-il deux variables aléatoires indépendantes, à valeurs dans $\llbracket 0\,,n \rrbracket$, dont la somme suive la loi uniforme sur $\llbracket 0\,,2n \rrbracket$ ? On pourra examiner les probabilités que la somme vaille $0$, $n$ et $2n$.

    **3.** En déduire qu'on ne peut pas piper deux dés à six faces de sorte que la somme des deux résultats suive la loi uniforme sur $\llbracket 2\,,12 \rrbracket$.
  corrige: |
    **1.** Supposons $ab = cd = \lambda$. Comme $(ac - bd)^{2} \geqslant 0$, on a 
    $$(ac + bd)^{2} = (ac - bd)^{2} + 4abcd \geqslant 4(ab)(cd) = 4\lambda^{2}, \qquad\text{d'où}\qquad \boxed{ac + bd \geqslant 2\lambda > \lambda}$$
     puisque $ac + bd > 0$ et $\lambda > 0$. Les trois conditions sont donc incompatibles.

    **2.** Supposons que $X$ et $Y$, indépendantes et à valeurs dans $\llbracket 0\,,n \rrbracket$, aient une somme $S = X + Y$ de loi uniforme sur $\llbracket 0\,,2n \rrbracket$, et notons $\lambda = \frac{1}{2n + 1}$. On pose 
    $$a = \mathrm{P}(X = 0), \qquad d = \mathrm{P}(X = n), \qquad b = \mathrm{P}(Y = 0), \qquad c = \mathrm{P}(Y = n).$$

    • La somme vaut $0$ si et seulement si $X = Y = 0$, d'où $\lambda = \mathrm{P}(S = 0) = ab$ par indépendance.

    • La somme vaut $2n$ si et seulement si $X = Y = n$, d'où $\lambda = \mathrm{P}(S = 2n) = dc$.

    • Les événements $(X = 0, Y = n)$ et $(X = n, Y = 0)$ sont incompatibles, puisque $n \geqslant 1$, et contenus dans $(S = n)$ : $\lambda = \mathrm{P}(S = n) \geqslant ac + db$.

    Les deux premières égalités montrent que $a$, $b$, $c$, $d$ sont strictement positifs, et les trois conditions contredisent la question 1. 
    $$\boxed{\text{il n'existe pas de variables indépendantes à valeurs dans } \llbracket 0\,,n \rrbracket \text{ de somme uniforme sur } \llbracket 0\,,2n \rrbracket}$$

    **3.** Si deux dés pipés donnaient des résultats $D_{1}$ et $D_{2}$, indépendants, de somme uniforme sur $\llbracket 2\,,12 \rrbracket$, les variables $X = D_{1} - 1$ et $Y = D_{2} - 1$ seraient indépendantes (proposition 16), à valeurs dans $\llbracket 0\,,5 \rrbracket$, et leur somme $D_{1} + D_{2} - 2$ suivrait la loi uniforme sur $\llbracket 0\,,10 \rrbracket$, ce que la question 2, avec $n = 5$, interdit. 
    $$\boxed{\text{on ne peut pas piper deux dés pour que la somme suive la loi uniforme sur } \llbracket 2\,,12 \rrbracket}$$
     Le résultat vaut que les deux dés soient pipés de la même façon ou non. Une recherche numérique sur $20\,000$ couples de lois tirés au hasard le confirme : pour chacun, l'une des onze probabilités de la somme s'écarte de $\frac{1}{11}$ de plus de $0{,}05$ ✓.

    *À retenir.* L'argument n'utilise que les trois valeurs extrêmes et centrale : les valeurs $0$ et $2n$ ne s'obtiennent que d'une façon, ce qui force $ab$ et $cd$ à être grands, et rend alors trop probable la valeur $n$. Il dépend de ce que $X$ et $Y$ ont le même intervalle de valeurs : si $X$ suit la loi uniforme sur $\{0, 1\}$ et $Y$ la loi uniforme sur $\{0, 2\}$, indépendantes, la somme suit la loi uniforme sur $\llbracket 0\,,3 \rrbracket$.
- id: "ma-21-65"
  feuille: "f-ma-21"
  numero: 65
  partie: "Variables aléatoires et lois"
