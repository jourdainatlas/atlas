  noeuds: [p-variables, p-espace, p-independance]
  notions: [variable-aleatoire, probabilite, probabilite-conditionnelle]
  page_enonce: 16
  page_corrige: 59
  enonce: |
    *L'urne de Pólya.* Une urne contient initialement une boule blanche et une boule noire. On répète l'expérience suivante : on tire une boule au hasard dans l'urne, puis on la remet en ajoutant une boule de la même couleur. Pour $k \in \mathbb{N}$, on note $N_{k}$ le nombre de boules blanches dans l'urne après $k$ tirages. Montrer par récurrence, à l'aide de la formule des probabilités totales, que $N_{k}$ suit la loi uniforme sur $\llbracket 1\,,k + 1 \rrbracket$ pour tout $k \in \mathbb{N}$.
  corrige: |
    *Modèle.* Après $k$ tirages, l'urne contient $k + 2$ boules, dont $N_{k}$ blanches. L'énoncé se traduit par $N_{0} = 1$ et, pour $j \in \llbracket 1\,,k + 1 \rrbracket$ tel que $\mathrm{P}(N_{k} = j) > 0$, 
    $$\mathrm{P}_{(N_{k} = j)}(N_{k+1} = j + 1) = \frac{j}{k + 2}, \qquad \mathrm{P}_{(N_{k} = j)}(N_{k+1} = j) = \frac{k + 2 - j}{k + 2},$$
     selon que la boule tirée est blanche ou noire.

    *Récurrence.* Pour $k = 0$, $N_{0} = 1$ suit la loi uniforme sur $\llbracket 1\,,1 \rrbracket = \{1\}$. Supposons que $N_{k}$ suive la loi uniforme sur $\llbracket 1\,,k + 1 \rrbracket$. Comme $N_{k+1} \in \{N_{k}, N_{k} + 1\}$, la variable $N_{k+1}$ prend ses valeurs dans $\llbracket 1\,,k + 2 \rrbracket$. Soit $j \in \llbracket 1\,,k + 2 \rrbracket$. La formule des probabilités totales, appliquée au système complet $\big((N_{k} = i)\big)_{1 \leqslant i \leqslant k + 1}$, ne fait intervenir que $i = j - 1$ et $i = j$ : 
    $$\mathrm{P}(N_{k+1} = j) = \frac{j - 1}{k + 2} \cdot \frac{1}{k + 1} + \frac{k + 2 - j}{k + 2} \cdot \frac{1}{k + 1} = \frac{k + 1}{(k + 2)(k + 1)}, \qquad \boxed{\mathrm{P}(N_{k+1} = j) = \frac{1}{k + 2}}$$
     Aux bords, la formule reste exacte : pour $j = 1$, le terme $i = 0$ n'existe pas, mais son coefficient $\frac{j - 1}{k + 2}$ est nul ; pour $j = k + 2$, le terme $i = k + 2$ n'existe pas, et son coefficient $\frac{k + 2 - j}{k + 2}$ est nul. La récurrence est établie : 
    $$\boxed{N_{k} \sim \mathcal{U}(\llbracket 1\,,k + 1 \rrbracket) \quad \text{pour tout } k \in \mathbb{N}}$$

    ![Figure](documents/figures/131232917ea7894d.svg)

    Chaque colonne représente les valeurs possibles de $N_{k}$, et chaque flèche ocre porte la probabilité de transition ; on lit la récurrence sur un nœud, par exemple $N_{3} = 2$, atteint depuis $N_{2} = 1$ avec la probabilité $\frac{1}{4}$ et depuis $N_{2} = 2$ avec la probabilité $\frac{2}{4}$, d'où $\frac{1}{3}\big(\frac{1}{4} + \frac{2}{4}\big) = \frac{1}{4}$.

    *À retenir.* Le résultat contredit l'intuition : on s'attendrait à ce que la proportion de boules blanches se stabilise autour de $\frac{1}{2}$, puisque l'urne part équilibrée. Au contraire, la proportion $\frac{N_{k}}{k + 2}$ suit la loi uniforme sur l'ensemble des fractions $\frac{j}{k + 2}$, pour $j \in \llbracket 1\,,k + 1 \rrbracket$ : les premiers tirages, amplifiés par les ajouts, décident d'une proportion qui peut prendre presque n'importe quelle valeur. Après $n$ tirages tous blancs, l'urne contient $n + 1$ blanches parmi $n + 2$ boules, et le tirage suivant est blanc avec la probabilité $\frac{n + 1}{n + 2}$ : c'est exactement la limite trouvée dans l'exercice 53 pour la loi de succession de Laplace. Les deux expériences sont en effet très proches : dans l'urne de Pólya comme dans le choix d'une urne au hasard, la proportion de boules blanches est inconnue et uniforme, et chaque tirage en informe.
- id: "ma-21-66"
  feuille: "f-ma-21"
  numero: 66
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variables aléatoires, probabilités, indépendance, loi uniforme]
  noeuds: [p-variables, p-espace, p-independance]
  notions: [variable-aleatoire, probabilite, independance]
  page_enonce: 16
  page_corrige: 60
  enonce: |
    Soit $n \geqslant 2$ et $\Sigma$ une variable aléatoire de loi uniforme sur $\mathfrak{S}_{n}$.

    **1.** **(a)** Calculer $\mathrm{P}\big(\Sigma(1) < \Sigma(2)\big)$.

    **(b)** Donner les lois de $\Sigma(1)$ et de $\Sigma(2)$, ainsi que leur loi conjointe. Ces variables sont-elles indépendantes ?

    **(c)** Calculer la probabilité que $\Sigma(1)$ et $\Sigma(2)$ soient des entiers consécutifs.

    **2.** On s'intéresse aux orbites de $\Sigma$, au sens du chapitre 17.

    **(a)** Soit $C$ une partie non vide de $\llbracket 1\,,n \rrbracket$, à $k$ éléments. Calculer la probabilité que $C$ soit une orbite de $\Sigma$.

    **(b)** Calculer la probabilité que $1$ et $2$ appartiennent à la même orbite de $\Sigma$.

    **(c)** Déterminer la loi du nombre d'éléments de l'orbite de $\Sigma$ qui contient $1$.
  corrige: |
    Comme dans le troisième exemple de la section 21.5.7, $\Sigma$ est une variable aléatoire de loi uniforme sur $\mathfrak{S}_{n}$ : chaque permutation a la probabilité $\frac{1}{n!}$, et calculer une probabilité revient à dénombrer des permutations.

    **1.(a)** L'application $\sigma \mapsto \sigma \circ (1\ 2)$ est une bijection de $\mathfrak{S}_{n}$ sur lui-même, qui échange les valeurs $\sigma(1)$ et $\sigma(2)$ ; elle échange donc les ensembles $\{\sigma \mid \sigma(1) < \sigma(2)\}$ et $\{\sigma \mid \sigma(1) > \sigma(2)\}$, qui ont le même cardinal et forment une partition de $\mathfrak{S}_{n}$, puisque $\sigma(1) \neq \sigma(2)$. 
    $$\boxed{\mathrm{P}\big(\Sigma(1) < \Sigma(2)\big) = \frac{1}{2}}$$

    **(b)** L'exemple du cours donne $\mathrm{P}(\Sigma(1) = i) = \frac{1}{n}$ : $\Sigma(1)$ et $\Sigma(2)$ suivent la loi uniforme sur $\llbracket 1\,,n \rrbracket$. Pour $i \neq j$, les permutations telles que $\sigma(1) = i$ et $\sigma(2) = j$ sont en bijection avec les bijections de $\llbracket 3\,,n \rrbracket$ sur $\llbracket 1\,,n \rrbracket \setminus \{i, j\}$, qui sont au nombre de $(n - 2)!$ (théorème 1) ; pour $i = j$, il n'y en a aucune, par injectivité. Donc 
    $$\boxed{\mathrm{P}\big(\Sigma(1) = i, \Sigma(2) = j\big) = \begin{cases} \frac{1}{n(n - 1)} & \text{si } i \neq j \\ 0 & \text{si } i = j \end{cases}}$$
     Comme $\mathrm{P}(\Sigma(1) = 1, \Sigma(2) = 1) = 0 \neq \frac{1}{n^{2}} = \mathrm{P}(\Sigma(1) = 1)\mathrm{P}(\Sigma(2) = 1)$, les variables $\Sigma(1)$ et $\Sigma(2)$ ne sont pas indépendantes. C'est la loi conjointe de deux tirages sans remise dans une urne de $n$ boules numérotées, dont le cas $n = 3$ figure dans la section 21.5.4.

    **(c)** Les couples $(i, j)$ d'entiers consécutifs de $\llbracket 1\,,n \rrbracket$, c'est-à-dire tels que $|i - j| = 1$, sont au nombre de $2(n - 1)$ : $(i, i + 1)$ et $(i + 1, i)$ pour $i \in \llbracket 1\,,n - 1 \rrbracket$. Par la question précédente, 
    $$\boxed{\mathrm{P}\big(|\Sigma(1) - \Sigma(2)| = 1\big) = \frac{2(n - 1)}{n(n - 1)} = \frac{2}{n}}$$
     Pour $n = 2$, on trouve $1$, ce qui est attendu, puisque $\{\Sigma(1), \Sigma(2)\} = \{1, 2\}$.

    **2.(a)** Rappelons que les orbites de $\sigma$ sont les classes de la relation « $j = \sigma^{p}(i)$ pour un $p \in \mathbb{Z}$ » (chapitre 17, démonstration du théorème 1), et que $\sigma$ agit sur une orbite à $k \geqslant 2$ éléments comme un $k$-cycle. La partie $C$ est une orbite de $\sigma$ si et seulement si $\sigma(C) \subset C$, ce qui entraîne $\sigma(C) = C$ par injectivité et $\sigma(E \setminus C) = E \setminus C$, où $E = \llbracket 1\,,n \rrbracket$, et si la restriction $\sigma_{|C}$, qui est une permutation de $C$, a pour seule orbite $C$.

    L'application $\sigma \mapsto (\sigma_{|C}, \sigma_{|E \setminus C})$ est une bijection de l'ensemble des permutations qui stabilisent $C$ sur $\mathfrak{S}_{C} \times \mathfrak{S}_{E \setminus C}$. Il reste à dénombrer les permutations de $C$ ayant une seule orbite. Soit $c$ le plus petit élément de $C$ ; une telle permutation $\tau$ est déterminée par la suite $\big(\tau(c), \tau^{2}(c), \dots, \tau^{k-1}(c)\big)$, qui est une liste ordonnée des $k - 1$ éléments de $C \setminus \{c\}$, et toute liste de ce type provient d'une unique telle permutation, le cycle $\big(c\ \tau(c)\ \cdots\ \tau^{k-1}(c)\big)$. Il y en a donc $(k - 1)!$, y compris pour $k = 1$, où seule l'identité de $C$ convient. Ainsi $C$ est une orbite de $(k - 1)!\,(n - k)!$ permutations : 
    $$\boxed{\mathrm{P}(C \text{ est une orbite de } \Sigma) = \frac{(k - 1)!\,(n - k)!}{n!} = \frac{1}{k\binom{n}{k}}}$$
     Pour $k = n$, on obtient la probabilité $\frac{1}{n}$ que $\Sigma$ soit un $n$-cycle ; pour $k = 1$, la probabilité $\frac{1}{n}$ que l'élément de $C$ soit un point fixe.

    **(b)** Les entiers $1$ et $2$ sont dans la même orbite si et seulement si celle-ci est l'une des parties $C$ contenant $1$ et $2$ ; pour une permutation donnée, une seule partie convient, donc les événements « $C$ est une orbite », pour ces parties $C$, sont deux à deux incompatibles. Il y a $\binom{n - 2}{k - 2}$ parties à $k$ éléments contenant $1$ et $2$, pour $k \in \llbracket 2\,,n \rrbracket$, et 
    $$\binom{n - 2}{k - 2}\,\frac{(k - 1)!\,(n - k)!}{n!} = \frac{(n - 2)!}{(k - 2)!\,(n - k)!} \cdot \frac{(k - 1)!\,(n - k)!}{n!} = \frac{k - 1}{n(n - 1)}.$$
     En sommant sur $k$, avec $\sum_{k=2}^{n} (k - 1) = \frac{n(n - 1)}{2}$, 
    $$\boxed{\mathrm{P}(1 \text{ et } 2 \text{ appartiennent à la même orbite de } \Sigma) = \frac{1}{2}}$$

    **(c)** Soit $L$ le nombre d'éléments de l'orbite de $\Sigma$ qui contient $1$, et $k \in \llbracket 1\,,n \rrbracket$. L'événement $(L = k)$ est la réunion disjointe, sur les $\binom{n - 1}{k - 1}$ parties $C$ à $k$ éléments contenant $1$, des événements « $C$ est une orbite de $\Sigma$ » : 
    $$\mathrm{P}(L = k) = \binom{n - 1}{k - 1}\frac{(k - 1)!\,(n - k)!}{n!} = \frac{(n - 1)!}{n!}, \qquad \boxed{L \sim \mathcal{U}(\llbracket 1\,,n \rrbracket)}$$
     Le calcul a été contrôlé par énumération de $\mathfrak{S}_{n}$ pour $n \leqslant 6$ ✓.

    *À retenir.* Ces résultats surprennent : on s'attendrait à ce que les petites orbites soient plus probables, alors que l'orbite de $1$ a une longueur uniforme, et qu'il y a une chance sur deux que $1$ et $2$ soient dans la même orbite, quel que soit $n$. Le cas $k = n$, où $\Sigma$ est un $n$-cycle avec la probabilité $\frac{1}{n}$, sera retrouvé dans l'exercice 69, qui utilise aussi les parties stables, et la question 2(a) prolonge l'exercice 17, où les parties stables par une permutation étaient les réunions d'orbites.
- id: "ma-21-67"
  feuille: "f-ma-21"
  numero: 67
  partie: "Variables aléatoires et lois"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [variables aléatoires, indépendance]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, independance]
  page_enonce: 17
  page_corrige: 62
  enonce: |
    Soit $p \in \left]0\,,1\right[$ et $X_{1}$, …, $X_{n}$ des variables mutuellement indépendantes, à valeurs dans $\{-1, 1\}$, telles que $\mathrm{P}(X_{k} = 1) = p$ pour tout $k$. Pour $k \in \llbracket 1\,,n \rrbracket$, on pose $\Pi_{k} = X_{1}X_{2}\cdots X_{k}$, $u_{k} = \mathrm{P}(\Pi_{k} = 1)$ et $v_{k} = \mathrm{P}(\Pi_{k} = -1)$.

    **1.** Montrer que $u_{k+1} = p\,u_{k} + (1 - p)\,v_{k}$ et $v_{k+1} = (1 - p)\,u_{k} + p\,v_{k}$ pour tout $k \in \llbracket 1\,,n - 1 \rrbracket$.

    **2.** Expliciter $u_{k}$ et $v_{k}$ en fonction de $k$. Que se passe-t-il lorsque $k$ devient grand ?

    **3.** Déterminer une condition nécessaire et suffisante sur $p$ pour que les variables $\Pi_{1}$ et $\Pi_{2}$ soient indépendantes.

    **4.** On suppose cette condition remplie. Montrer que les variables $\Pi_{1}$, …, $\Pi_{n}$ sont mutuellement indépendantes.
  corrige: |
    Les variables $X_{1}$, …, $X_{n}$ sont données par l'énoncé ; on n'a pas besoin de décrire l'univers (section 21.5.6). On note $q = 1 - p$.

    **1.** Soit $k \in \llbracket 1\,,n - 1 \rrbracket$. Comme $\Pi_{k+1} = \Pi_{k}X_{k+1}$ et que ces deux variables sont à valeurs dans $\{-1, 1\}$, le produit vaut $1$ si et seulement si les deux facteurs sont égaux : 
    $$(\Pi_{k+1} = 1) = (\Pi_{k} = 1,\ X_{k+1} = 1) \cup (\Pi_{k} = -1,\ X_{k+1} = -1),$$
     réunion de deux événements incompatibles. La variable $\Pi_{k}$ est une fonction de $(X_{1}, \dots, X_{k})$, donc elle est indépendante de $X_{k+1}$ par le lemme des coalitions (théorème 7). Par la proposition 7 (i), puis l'indépendance, 
    $$\boxed{u_{k+1} = p\,u_{k} + q\,v_{k}} \qquad\text{et, de même,}\qquad \boxed{v_{k+1} = q\,u_{k} + p\,v_{k}}$$
     la seconde formule venant de $(\Pi_{k+1} = -1) = (\Pi_{k} = 1, X_{k+1} = -1) \cup (\Pi_{k} = -1, X_{k+1} = 1)$.

    **2.** Comme $\Pi_{k}$ prend ses valeurs dans $\{-1, 1\}$, les événements $(\Pi_{k} = 1)$ et $(\Pi_{k} = -1)$ forment un système complet (proposition 11), et $u_{k} + v_{k} = 1$. En soustrayant les deux relations de la question 1, on obtient 
    $$u_{k+1} - v_{k+1} = (p - q)(u_{k} - v_{k}) = (2p - 1)(u_{k} - v_{k}).$$
     La suite $(u_{k} - v_{k})$ est géométrique de raison $2p - 1$, de premier terme $u_{1} - v_{1} = p - q = 2p - 1$, donc $u_{k} - v_{k} = (2p - 1)^{k}$. Avec $u_{k} + v_{k} = 1$, 
    $$\boxed{u_{k} = \frac{1 + (2p - 1)^{k}}{2}, \qquad v_{k} = \frac{1 - (2p - 1)^{k}}{2}}$$
     Comme $p \in \left]0\,,1\right[$, on a $|2p - 1| < 1$, et $(2p - 1)^{k}$ tend vers $0$ : lorsque $n$, puis $k$, deviennent grands, $\boxed{u_{k} \text{ et } v_{k} \text{ tendent vers } \tfrac{1}{2}}$. Le signe d'un long produit de signes aléatoires est presque équiprobable, quel que soit $p$ ; la convergence est géométrique, d'autant plus lente que $p$ est proche de $0$ ou de $1$. Pour $p$ proche de $0$, le signe change très probablement d'un rang au suivant, et $u_{k}$ oscille autour de $\frac{1}{2}$, puisque $2p - 1 < 0$, avant de s'en approcher.

    On pouvait aussi remarquer que $u_{k+1} = (2p - 1)u_{k} + q$ : la suite $(u_{k})$ est arithmético-géométrique (chapitre 7), de point fixe $\frac{1}{2}$. Matriciellement, la colonne $(u_{k}, v_{k})^{T}$ est multipliée à chaque étape par la matrice $\begin{pmatrix} p & q \\ q & p \end{pmatrix}$, comme dans l'exemple de la chaîne de Markov à deux états de la section 21.5.7.

    **3.** On suppose $n \geqslant 2$. Par la proposition 15, $\Pi_{1} = X_{1}$ et $\Pi_{2} = X_{1}X_{2}$ sont indépendantes si et seulement si $\mathrm{P}(\Pi_{1} = a, \Pi_{2} = b) = \mathrm{P}(\Pi_{1} = a)\mathrm{P}(\Pi_{2} = b)$ pour tous $a$, $b \in \{-1, 1\}$.

    *Condition nécessaire.* Pour $a = b = 1$, on a $(\Pi_{1} = 1, \Pi_{2} = 1) = (X_{1} = 1, X_{2} = 1)$, de probabilité $p^{2}$, tandis que $\mathrm{P}(\Pi_{1} = 1)\mathrm{P}(\Pi_{2} = 1) = p\,u_{2} = p(2p^{2} - 2p + 1)$. Comme $p \neq 0$, l'égalité équivaut à $p = 2p^{2} - 2p + 1$, c'est-à-dire à $2p^{2} - 3p + 1 = (2p - 1)(p - 1) = 0$, soit $p = \frac{1}{2}$, puisque $p \neq 1$.

    *Condition suffisante.* Si $p = \frac{1}{2}$, pour tous $a$, $b \in \{-1, 1\}$, l'événement $(\Pi_{1} = a, \Pi_{2} = b)$ est égal à $(X_{1} = a, X_{2} = ab)$, de probabilité $\frac{1}{4}$ par indépendance, et le produit $\mathrm{P}(\Pi_{1} = a)\mathrm{P}(\Pi_{2} = b)$ vaut aussi $\frac{1}{2} \times \frac{1}{2}$, puisque $u_{2} = v_{2} = \frac{1}{2}$. D'où 
    $$\boxed{\Pi_{1} \perp\!\!\!\perp \Pi_{2} \iff p = \tfrac{1}{2}}$$

    **4.** On suppose $p = \frac{1}{2}$. Soit $\varphi$ l'application de $\{-1, 1\}^{n}$ dans lui-même définie par 
    $$\varphi(x_{1}, \dots, x_{n}) = (x_{1}, x_{1}x_{2}, \dots, x_{1}x_{2}\cdots x_{n}).$$
     C'est une bijection : si $\pi = \varphi(x)$, on retrouve $x_{1} = \pi_{1}$ et $x_{k} = \pi_{k}\pi_{k-1}$ pour $k \geqslant 2$, puisque $\pi_{k-1}^{2} = 1$. Par indépendance, $\mathrm{P}(X_{1} = x_{1}, \dots, X_{n} = x_{n}) = \frac{1}{2^{n}}$ pour tout $x$, et, pour tout $\pi \in \{-1, 1\}^{n}$, 
    $$\mathrm{P}(\Pi_{1} = \pi_{1}, \dots, \Pi_{n} = \pi_{n}) = \mathrm{P}\big((X_{1}, \dots, X_{n}) = \varphi^{-1}(\pi)\big) = \frac{1}{2^{n}} = \prod_{k=1}^{n} \mathrm{P}(\Pi_{k} = \pi_{k}),$$
     puisque $u_{k} = v_{k} = \frac{1}{2}$ pour $p = \frac{1}{2}$. Par la proposition 15, 
    $$\boxed{\Pi_{1}, \dots, \Pi_{n} \text{ sont mutuellement indépendantes}}$$
     Ce résultat a été contrôlé par énumération pour $n = 4$, avec $p = \frac{1}{2}$, et son échec pour $p = \frac{1}{3}$ et $p = \frac{3}{4}$ ✓.

    *Piège.* Le lemme des coalitions ne s'applique pas ici : toutes les variables $\Pi_{k}$ dépendent de $X_{1}$, et les paquets ne sont pas disjoints. L'erreur la plus répandue est de croire que des fonctions de paquets qui se chevauchent sont « un peu » indépendantes ; la question 3 montre qu'elles ne le sont pas en général, et l'indépendance obtenue pour $p = \frac{1}{2}$ tient à la bijection $\varphi$, qui transporte la loi uniforme de $\{-1, 1\}^{n}$ sur elle-même.
- id: "ma-21-68"
