    On retire au hasard dix cartes d'un jeu de $52$ cartes, sans les regarder, puis on tire simultanément cinq cartes parmi les $42$ cartes restantes.

    **1.** Calculer la probabilité que l'as de trèfle figure parmi les cinq cartes tirées. Pouvait-on prévoir le résultat ?

    **2.** Montrer que la main des cinq cartes tirées suit la loi uniforme sur l'ensemble des parties à cinq éléments du jeu de $52$ cartes. On pourra dénombrer, pour une main $H$ fixée, les couples formés de dix cartes retirées et de cinq cartes tirées qui conduisent à $H$.

    **3.** En déduire la probabilité que les cinq cartes tirées n'aient que deux hauteurs différentes, puis qu'elles aient cinq hauteurs différentes.
  corrige: |
    Une issue est un couple $(R, H)$, où $R$ est la partie à $10$ éléments des cartes retirées et $H$ la partie à $5$ éléments des cartes tirées, avec $H \cap R = \varnothing$. Pour tout $R$, il y a $\binom{42}{5}$ choix de $H$ ; les deux choix étant faits au hasard, on munit l'ensemble $\Omega$ de ces couples de la probabilité uniforme, avec $|\Omega| = \binom{52}{10}\binom{42}{5}$ (lemme des bergers).

    **1.** Notons $a$ l'as de trèfle. Un couple favorable s'obtient en choisissant $R$ parmi les $51$ autres cartes, puis $H$ contenant $a$, c'est-à-dire ses quatre autres cartes parmi les $41$ cartes restantes autres que $a$. À l'aide des relations $\binom{51}{10} = \frac{42}{52}\binom{52}{10}$ et $\binom{41}{4} = \frac{5}{42}\binom{42}{5}$, 
    $$\mathrm{P}(a \in H) = \frac{\dbinom{51}{10}\dbinom{41}{4}}{\dbinom{52}{10}\dbinom{42}{5}} = \frac{42}{52} \times \frac{5}{42}, \qquad \boxed{\mathrm{P}(a \in H) = \frac{5}{52}}$$
     C'est la probabilité que l'as de trèfle figure dans une main de cinq cartes tirées directement dans le jeu de $52$ cartes. On pouvait le prévoir : les dix cartes retirées sans être regardées n'apportent aucune information, et l'on ne fait que « tirer cinq cartes au hasard » de façon détournée. La question suivante rend cet argument rigoureux.

    **2.** Soit $H$ une partie à cinq éléments du jeu. Les couples $(R, H)$ qui conduisent à $H$ correspondent aux parties $R$ à dix éléments du complémentaire de $H$, qui a $47$ éléments : il y en a $\binom{47}{10}$, nombre qui ne dépend pas de $H$. Ainsi 
    $$\mathrm{P}(\text{la main tirée est } H) = \frac{\dbinom{47}{10}}{\dbinom{52}{10}\dbinom{42}{5}} = \frac{1}{\dbinom{52}{5}},$$
     car, en simplifiant les factorielles, $\binom{52}{10}\binom{42}{5} = \frac{52!}{10!\,5!\,37!} = \binom{52}{5}\binom{47}{10}$. 
    $$\boxed{\text{la main tirée suit la loi uniforme sur les parties à } 5 \text{ éléments du jeu de } 52 \text{ cartes}}$$
     Les deux membres de l'identité comptent de deux façons les couples formés de dix cartes et de cinq autres cartes. Une énumération exhaustive sur un jeu de $9$ cartes, dont on retire $3$ avant d'en tirer $2$, confirme que chacune des $36$ paires est obtenue par exactement $\binom{7}{3} = 35$ couples ✓.

    **3.** On calcule donc dans le modèle de la main de cinq cartes parmi $52$, avec $\binom{52}{5} = 2\,598\,960$ issues. Une hauteur ne comporte que quatre cartes, donc cinq cartes ont au moins deux hauteurs ; elles en ont exactement deux lorsque la main est un carré (quatre cartes d'une hauteur, une d'une autre) ou un full (trois et deux). On choisit la hauteur du carré, puis la cinquième carte parmi les $48$ autres : $13 \times 48 = 624$ carrés ; on choisit la hauteur du brelan et ses trois cartes, puis celle de la paire et ses deux cartes : $13 \times 4 \times 12 \times 6 = 3\,744$ fulls, comme dans l'exemple de la section 21.2.6. Pour cinq hauteurs distinctes, on choisit les cinq hauteurs, puis une couleur pour chacune : 
    $$\boxed{\mathrm{P}(\text{deux hauteurs}) = \frac{624 + 3\,744}{2\,598\,960} = \frac{1}{595}, \qquad \mathrm{P}(\text{cinq hauteurs}) = \frac{\dbinom{13}{5} 4^{5}}{\dbinom{52}{5}} = \frac{2\,112}{4\,165} \approx 0{,}507}$$
     Une énumération des $2\,598\,960$ mains confirme les nombres $4\,368$ et $1\,317\,888$ de cas favorables ✓. Un peu plus d'une main sur deux ne contient aucune paire.

    *À retenir.* L'information qu'on ne connaît pas ne change pas les probabilités : retirer des cartes sans les regarder, ou couper le paquet, ne modifie pas la loi de la main. La question 2 en donne une preuve par le lemme des bergers ; l'erreur la plus répandue est de calculer dans le modèle compliqué des couples $(R, H)$, alors qu'une fois l'uniformité établie, le modèle simple suffit.
