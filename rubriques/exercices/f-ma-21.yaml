  enonce: |
    Soit $X$ et $Y$ deux variables aléatoires indépendantes de même loi $\mathcal{B}(n,\frac{1}{2})$, et $Z = X - Y$.

    **1.** Calculer l'espérance et la variance de $Z$.

    **2.** Déterminer la loi de $Z$. On pourra remarquer que $n - Y$ suit la même loi que $Y$.

    **3.** Calculer $\operatorname{Cov}(X, Z)$. Les variables $X$ et $Z$ sont-elles indépendantes ?
  corrige: |
    **1.** Par linéarité et la proposition 19, $\mathrm{E}(Z) = \frac{n}{2} - \frac{n}{2}$, soit $\boxed{\mathrm{E}(Z) = 0}$. Les variables $X$ et $-Y$ sont indépendantes (proposition 16), et le théorème 13, avec $\mathrm{V}(-Y) = \mathrm{V}(Y)$ (théorème 11 (ii)) et la proposition 21, donne 
    $$\boxed{\mathrm{V}(Z) = \mathrm{V}(X) + \mathrm{V}(Y) = \frac{n}{4} + \frac{n}{4} = \frac{n}{2}}$$

    **2.** Posons $W = n - Y$. Pour $k \in \llbracket 0\,,n \rrbracket$, $\mathrm{P}(W = k) = \mathrm{P}(Y = n - k) = \tbinom{n}{n-k}\frac{1}{2^{n}} = \tbinom{n}{k}\frac{1}{2^{n}}$, par symétrie des coefficients binomiaux : $W$ suit la loi $\mathcal{B}(n,\frac{1}{2})$, et elle est indépendante de $X$ (proposition 16). Pour $m \in \llbracket 0\,,2n \rrbracket$, la proposition 7 (v), appliquée au système complet $(X = k)_{k}$, puis l'indépendance, donnent 
    $$\mathrm{P}(X + W = m) = \sum_{k=0}^{n} \mathrm{P}(X = k, W = m - k) = \frac{1}{4^{n}}\sum_{k=0}^{n} \binom{n}{k}\binom{n}{m - k} = \frac{1}{4^{n}}\binom{2n}{m},$$
     par la formule de Vandermonde, démontrée par dénombrement après la proposition 4 (on convient que $\tbinom{n}{j} = 0$ si $j \notin \llbracket 0\,,n \rrbracket$). Ainsi $X + W \sim \mathcal{B}(2n,\frac{1}{2})$. Comme $Z = X + W - n$, 
    $$\boxed{\mathrm{P}(Z = k) = \mathrm{P}(X + W = n + k) = \frac{1}{4^{n}}\binom{2n}{n + k}, \qquad k \in \llbracket -n\,,n \rrbracket}$$
     La loi de $Z$ est symétrique autour de $0$, et sa variance $\frac{2n}{4} = \frac{n}{2}$, celle de la loi $\mathcal{B}(2n,\frac{1}{2})$, confirme la question 1 ✓.

    **3.** Par bilinéarité, et comme $\operatorname{Cov}(X, Y) = 0$ par indépendance (proposition 23 (iii)), 
    $$\operatorname{Cov}(X, Z) = \operatorname{Cov}(X, X) - \operatorname{Cov}(X, Y) = \mathrm{V}(X), \qquad \boxed{\operatorname{Cov}(X, Z) = \frac{n}{4} \neq 0}$$
     Par contraposée de la proposition 23 (iii), $\boxed{X \text{ et } Z \text{ ne sont pas indépendantes}}$. C'est naturel : lorsque $X$ est grand, $Z = X - Y$ a tendance à l'être aussi.
