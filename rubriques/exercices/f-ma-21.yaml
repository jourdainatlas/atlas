  enonce: |
    Soit $S$ un ensemble à $n \geqslant 1$ éléments et $A_{1}$, …, $A_{m}$ des parties de $S$ qui *séparent* les points de $S$ : pour tous $x \neq y$ dans $S$, il existe $i \in \llbracket 1\,,m \rrbracket$ tel que $A_{i}$ contienne l'un des deux éléments $x$ et $y$, mais pas l'autre. Montrer que $m \geqslant \dfrac{\ln n}{\ln 2}$. On pourra considérer l'application $x \mapsto \big(\mathbf{1}_{A_{1}}(x), \dots, \mathbf{1}_{A_{m}}(x)\big)$. Donner un exemple où l'égalité a lieu.
  corrige: |
    On considère l'application 
    $$\chi : S \to \{0, 1\}^{m}, \qquad x \mapsto \big(\mathbf{1}_{A_{1}}(x), \dots, \mathbf{1}_{A_{m}}(x)\big).$$
     Elle est injective : si $x \neq y$, il existe $i$ tel que $A_{i}$ contienne l'un des deux éléments et pas l'autre, c'est-à-dire tel que $\mathbf{1}_{A_{i}}(x) \neq \mathbf{1}_{A_{i}}(y)$, et les images de $x$ et de $y$ diffèrent par leur $i$-ième coordonnée. Par le chapitre 2, théorème 2, et la proposition 2 (iv), on a $n \leqslant 2^{m}$, et la croissance du logarithme donne $\ln n \leqslant m\ln 2$. 
    $$\boxed{m \geqslant \frac{\ln n}{\ln 2}}$$
     Pour l'égalité, on prend $S = \{0, 1\}^{m}$, qui a $n = 2^{m}$ éléments, et $A_{i} = \{x \in S \mid x_{i} = 1\}$ pour $i \in \llbracket 1\,,m \rrbracket$. Deux éléments distincts de $S$ diffèrent par une coordonnée $i$, et $A_{i}$ contient l'un et pas l'autre : les $A_{i}$ séparent les points, et $m = \frac{\ln n}{\ln 2}$. Pour $m = 3$, on sépare ainsi les huit éléments de $\{0, 1\}^{3}$ avec trois parties.

    On peut le lire comme un jeu de questions : pour identifier un élément inconnu de $S$, on pose les questions « appartient-il à $A_{i}$ ? », auxquelles on répond par oui ou non. Les parties séparent les points si et seulement si les réponses déterminent l'élément, et il faut au moins $\frac{\ln n}{\ln 2}$ questions, nombre de chiffres de l'écriture de $n$ en base $2$, à un près. C'est le principe de la recherche dichotomique, qui atteint ce minimum.
- id: "ma-21-14"
  feuille: "f-ma-21"
  numero: 14
  partie: "Dénombrement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dénombrement, tirages]
  noeuds: [n-fini, pol-binome, p-espace]
  notions: [cardinal]
  page_enonce: 4
  page_corrige: 12
  enonce: |
    *Grilles de Fleissner.* Une grille carrée de côté $n$ est partagée en $n^{2}$ cases, dans certaines desquelles on découpe un trou. On dit que c'est une *grille de Fleissner* si, lorsqu'on la pose sur un carré de $n^{2}$ cases puis qu'on la fait tourner d'un quart de tour, d'un demi-tour et de trois quarts de tour autour de son centre, chaque case du carré apparaît à travers un trou dans exactement une des quatre positions. On s'en sert pour chiffrer un message, en écrivant ses lettres dans les trous successifs.

    **1.** Combien une grille de Fleissner de côté $6$ comporte-t-elle de trous ? Combien y a-t-il de telles grilles ?

    **2.** Pour quelles valeurs de $n$ existe-t-il une grille de Fleissner de côté $n$, et combien y en a-t-il ?
  corrige: |
    On repère les cases par leurs coordonnées $(i, j) \in \llbracket 0\,,n - 1 \rrbracket^{2}$, ligne et colonne, et l'on note $\rho$ l'application qui envoie une case sur la case qu'elle occupe après un quart de tour, soit $\rho(i, j) = (j, n - 1 - i)$. C'est une permutation de l'ensemble des $n^{2}$ cases, et $\rho^{4} = \mathrm{id}$. Si $H$ est l'ensemble des trous, la grille tournée de $r$ quarts de tour laisse voir les cases de $\rho^{r}(H)$, pour $r \in \llbracket 0\,,3 \rrbracket$.

    $\triangleright$ *Orbites.* On a $\rho^{2}(i, j) = (n - 1 - i, n - 1 - j)$ : c'est la symétrie par rapport au centre. Une case est fixée par $\rho^{2}$ si et seulement si $2i = 2j = n - 1$, ce qui n'arrive que pour $n$ impair, et pour la seule case centrale. Si une case $c$ vérifiait $\rho(c) = c$ ou $\rho^{3}(c) = c$, elle vérifierait $\rho^{2}(c) = c$, en composant par $\rho$ ; ainsi, lorsque $n$ est pair, les cases $c$, $\rho(c)$, $\rho^{2}(c)$, $\rho^{3}(c)$ sont deux à deux distinctes, et les orbites de $\rho$, au sens du chapitre 17, ont toutes quatre éléments. Il y en a $\frac{n^{2}}{4}$.

    $\triangleright$ *Caractérisation.* Une case $c$ apparaît à travers un trou dans la position $r$ si et seulement si $c \in \rho^{r}(H)$, c'est-à-dire $\rho^{-r}(c) \in H$. Le nombre de positions où elle apparaît est donc le nombre d'éléments de $H$ parmi $c$, $\rho^{-1}(c)$, $\rho^{-2}(c)$, $\rho^{-3}(c)$, qui forment l'orbite de $c$. Lorsque $n$ est pair, la grille est une grille de Fleissner si et seulement si $H$ contient *exactement une* case de chaque orbite.

    ![Figure](documents/figures/c3169a4ad5b98fc9.svg)

    La figure numérote les cases d'une grille de côté $4$ selon leur orbite : les quatre coins forment l'orbite $1$, le carré central l'orbite $4$. Une grille de Fleissner choisit un trou portant chacun des numéros $1$ à $4$, par exemple le quart supérieur gauche, grisé en ocre ; le quart de tour $\rho$ envoie chaque case sur une case de même numéro.

    **1.** Pour $n = 6$, il y a $\frac{36}{4} = 9$ orbites, donc $9$ trous, et l'on choisit une case dans chaque orbite, de $4$ façons indépendamment (proposition 2 (iv)). 
    $$\boxed{9 \text{ trous, et } 4^{9} = 262\,144 \text{ grilles de Fleissner de côté } 6}$$

    **2.** Si $n$ est pair, le même raisonnement donne $\frac{n^{2}}{4}$ trous et $4^{n^{2}/4} = 2^{n^{2}/2}$ grilles. Si $n$ est impair, la case centrale $c_{0}$ est fixée par $\rho$ : elle apparaît dans les quatre positions si $c_{0} \in H$, et dans aucune sinon, jamais dans exactement une. 
    $$\boxed{\text{Il existe des grilles de Fleissner de côté } n \text{ si et seulement si } n \text{ est pair ; il y en a alors } 4^{n^{2}/4}}$$
     Une énumération exhaustive confirme les valeurs $4$ pour $n = 2$, $0$ pour $n = 3$ et $256$ pour $n = 4$. Le nombre de grilles croît très vite : une grille de côté $10$ se choisit parmi $4^{25} \approx 1{,}1 \cdot 10^{15}$, ce qui rend vaine la recherche de la grille par essais successifs.
- id: "ma-21-15"
  feuille: "f-ma-21"
  numero: 15
  partie: "Dénombrement"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [dénombrement, coefficients binomiaux, applications et dénombrement]
  noeuds: [n-fini, pol-binome, r-injections]
  notions: [cardinal, coefficient-binomial]
  page_enonce: 4
  page_corrige: 13
  enonce: |
    Pour $n$, $p \in \mathbb{N}^{*}$, on note $S(n, p)$ le nombre de surjections d'un ensemble à $n$ éléments sur un ensemble à $p$ éléments ; il ne dépend que de $n$ et $p$, par la proposition 1 du cours.

    **1.** Calculer $S(n, p)$ pour $p > n$, puis $S(n, n)$, $S(n, 1)$ et $S(n, 2)$.

    **2.** Calculer $S(n + 1, n)$.

    **3.** Montrer que $S(n, p) = p\big(S(n - 1, p) + S(n - 1, p - 1)\big)$ pour tous $n \geqslant 2$ et $p \geqslant 2$. On pourra distinguer les surjections de $\llbracket 1\,,n \rrbracket$ sur $\llbracket 1\,,p \rrbracket$ selon que leur restriction à $\llbracket 1\,,n - 1 \rrbracket$ est surjective ou non.

    **4.** En déduire un programme Python récursif qui calcule $S(n, p)$, et justifier qu'il se termine.

    **5.** Retrouver, par récurrence sur $n$, la formule de la proposition 6 du cours, qui s'écrit ici 
    $$S(n, p) = \sum_{k=0}^{p} (-1)^{p-k}\binom{p}{k}k^{n}.$$
  corrige: |
    On note $\mathrm{Surj}(E, F)$ l'ensemble des surjections de $E$ sur $F$. Si $\alpha : E' \to E$ et $\beta : F \to F'$ sont des bijections, l'application $f \mapsto \beta \circ f \circ \alpha$ est une bijection de $\mathrm{Surj}(E, F)$ sur $\mathrm{Surj}(E', F')$ (chapitre 2, proposition 6) : c'est pourquoi $S(n, p)$ ne dépend que des cardinaux, et l'on peut raisonner avec $E = \llbracket 1\,,n \rrbracket$ et $F = \llbracket 1\,,p \rrbracket$.

    **1.** S'il existe une surjection d'un ensemble à $n$ éléments sur un ensemble à $p$ éléments, alors $n \geqslant p$ (chapitre 2, théorème 2). Pour $p = n$, les surjections sont les bijections (proposition 1 (iii)), au nombre de $n!$ (théorème 1). Pour $p = 1$, la seule application est constante, et elle est surjective. Pour $p = 2$, une application de $\llbracket 1\,,n \rrbracket$ dans $\{1, 2\}$ est surjective si et seulement si elle n'est pas constante. 
    $$\boxed{S(n, p) = 0 \text{ si } p > n, \qquad S(n, n) = n!, \qquad S(n, 1) = 1, \qquad S(n, 2) = 2^{n} - 2}$$

    **2.** Soit $f$ une surjection de $\llbracket 1\,,n + 1 \rrbracket$ sur $\llbracket 1\,,n \rrbracket$. Ses $n$ fibres $f^{-1}(\{y\})$ sont non vides, deux à deux disjointes, et recouvrent $\llbracket 1\,,n + 1 \rrbracket$ : leurs cardinaux, tous au moins égaux à $1$, ont pour somme $n + 1$, et exactement une fibre a deux éléments, les autres étant des singletons. On note $P(f)$ cette fibre à deux éléments. Fixons une paire $\{i, j\}$ : les surjections telles que $P(f) = \{i, j\}$ sont celles qui prennent la même valeur en $i$ et en $j$ et des valeurs deux à deux distinctes, différentes de celle-là, aux $n - 1$ autres points. Elles correspondent aux bijections de l'ensemble à $n$ éléments $\big\{\{i, j\}\big\} \cup \big\{\{k\} \mid k \neq i, j\big\}$ sur $\llbracket 1\,,n \rrbracket$ : il y en a $n!$. Le lemme des bergers, appliqué à $f \mapsto P(f)$, donne 
    $$\boxed{S(n + 1, n) = \binom{n + 1}{2}\,n! = \frac{n\,(n + 1)!}{2}}$$
     Pour $n = 2$, on trouve $6 = 2^{3} - 2$, en accord avec la question 1 ✓.

    **3.** Soit $n \geqslant 2$, $p \geqslant 2$, et $f$ une surjection de $\llbracket 1\,,n \rrbracket$ sur $\llbracket 1\,,p \rrbracket$ ; on note $g$ sa restriction à $\llbracket 1\,,n - 1 \rrbracket$.

    • Si $g$ est surjective sur $\llbracket 1\,,p \rrbracket$, la valeur $f(n)$ est quelconque. Réciproquement, toute surjection $g$ de $\llbracket 1\,,n - 1 \rrbracket$ sur $\llbracket 1\,,p \rrbracket$, prolongée par une valeur quelconque, donne une surjection $f$. Il y a $p\,S(n - 1, p)$ telles surjections $f$ (proposition 2 (iv)).

    • Si $g$ n'est pas surjective, elle manque une valeur $y$ ; comme $f$ est surjective, $y$ est atteinte en $n$, donc $y = f(n)$, et $y$ est la seule valeur manquée. Ainsi $g$ est une surjection de $\llbracket 1\,,n - 1 \rrbracket$ sur $\llbracket 1\,,p \rrbracket \setminus \{f(n)\}$. Réciproquement, pour $y \in \llbracket 1\,,p \rrbracket$ et $g$ une surjection de $\llbracket 1\,,n - 1 \rrbracket$ sur cet ensemble à $p - 1$ éléments, le prolongement de $g$ par $f(n) = y$ est une surjection sur $\llbracket 1\,,p \rrbracket$ dont la restriction n'est pas surjective. Il y a $p\,S(n - 1, p - 1)$ telles surjections $f$.

    Les deux cas sont disjoints, et la proposition 2 (i) donne 
    $$\boxed{S(n, p) = p\big(S(n - 1, p) + S(n - 1, p - 1)\big) \quad \text{pour } n \geqslant 2 \text{ et } p \geqslant 2}$$

    **4.** Le programme suit la question 3, avec pour cas de base ceux de la question 1. 

    ```python
    def S(n, p):              # n >= 1 et p >= 1
        if p > n:
            return 0
        if p == 1:
            return 1
        return p * (S(n - 1, p) + S(n - 1, p - 1))

    print(S(5, 3))            # affiche 150
    ```

     Si un appel $S(n, p)$, avec $n \geqslant 1$ et $p \geqslant 1$, ne s'arrête pas dans l'un des deux tests, c'est que $2 \leqslant p \leqslant n$ : il provoque deux appels avec le premier argument $n - 1 \geqslant 1$ et des seconds arguments $p \geqslant 1$ et $p - 1 \geqslant 1$, de sorte que l'hypothèse $n, p \geqslant 1$ est préservée. Le premier argument diminue de $1$ à chaque appel et reste un entier au moins égal à $1$ : une chaîne d'appels emboîtés a donc au plus $n$ étages, et le programme se termine. Lorsque $n = 1$, on a soit $p > 1$, soit $p = 1$, et l'un des deux tests s'applique. La valeur $S(5, 3) = 150$ est celle que la remarque qui suit la proposition 6 a obtenue par la formule ✓.

    **5.** Notons $R(n, p) = \sum_{k=0}^{p} (-1)^{p-k}\binom{p}{k}k^{n}$, et montrons par récurrence sur $n \geqslant 1$ la propriété : $S(n, p) = R(n, p)$ pour tout $p \geqslant 1$.

    **Initialisation :** Pour $n = 1$, on utilise $k\binom{p}{k} = p\binom{p - 1}{k - 1}$ pour $k \geqslant 1$, puis la formule du binôme : 
    $$R(1, p) = \sum_{k=1}^{p} (-1)^{p-k}\,p\binom{p - 1}{k - 1} = p\sum_{j=0}^{p-1} (-1)^{p-1-j}\binom{p - 1}{j} = p\,(1 - 1)^{p-1},$$
     qui vaut $1$ si $p = 1$ et $0$ si $p \geqslant 2$ : c'est $S(1, p)$ par la question 1.

    **Hérédité :** Supposons la propriété vraie au rang $n - 1$, pour un entier $n \geqslant 2$. Si $p = 1$, alors $R(n, 1) = 1^{n} - 0^{n} = 1 = S(n, 1)$. Pour $p \geqslant 2$, la question 3 et l'hypothèse de récurrence donnent 
    $$S(n, p) = p\,R(n - 1, p) + p\,R(n - 1, p - 1), \qquad\text{soit}$$

    $$S(n, p) = \sum_{k=0}^{p} (-1)^{p-k}\,p\binom{p}{k}k^{n-1} - \sum_{k=0}^{p-1} (-1)^{p-k}\,p\binom{p - 1}{k}k^{n-1} = \sum_{k=0}^{p} (-1)^{p-k}\,p\bigg(\binom{p}{k} - \binom{p - 1}{k}\bigg)k^{n-1},$$
     avec la convention $\binom{p - 1}{p} = 0$. Par la formule de Pascal, $\binom{p}{k} - \binom{p - 1}{k} = \binom{p - 1}{k - 1}$ pour $k \geqslant 1$, et $p\binom{p - 1}{k - 1} = k\binom{p}{k}$ ; pour $k = 0$, le coefficient est nul. Ainsi 
    $$S(n, p) = \sum_{k=0}^{p} (-1)^{p-k}\,k\binom{p}{k}k^{n-1} = R(n, p).$$

    **Conclusion :** La formule est vraie pour tous $n, p \geqslant 1$. 
    $$\boxed{S(n, p) = \sum_{k=0}^{p} (-1)^{p-k}\binom{p}{k}k^{n}}$$
     La proposition 6 obtient la même formule en développant un produit, d'un seul coup ; la récurrence la retrouve sans la formule du crible, mais il faut connaître le résultat pour le démontrer. Les deux expressions ont été comparées à une énumération des surjections pour $n, p \leqslant 7$.
- id: "ma-21-16"
  feuille: "f-ma-21"
