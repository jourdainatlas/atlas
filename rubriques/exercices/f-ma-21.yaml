  enonce: |
    Soit $n \geqslant 2$, $q \in \left]0\,,1\right[$ et $p = 1 - q$. On considère un couple $(X, Y)$ de variables aléatoires, à valeurs dans $\llbracket 0\,,n \rrbracket \times \llbracket 1\,,n \rrbracket$, de loi conjointe donnée, pour $j \in \llbracket 0\,,n \rrbracket$ et $k \in \llbracket 1\,,n \rrbracket$, par 
    $$\mathrm{P}(X = j, Y = k) = \begin{cases} \dbinom{n}{k}p^{k}q^{n-k} & \text{si } k = j \text{ et } j \neq 0, \\[3mm] \dfrac{q^{n}}{n} & \text{si } j = 0, \\[2mm] 0 & \text{sinon.} \end{cases}$$

    **1.** Vérifier qu'il s'agit bien d'une loi conjointe, puis déterminer les lois marginales et les espérances de $X$ et de $Y$.

    **2.** Soit $j \in \llbracket 0\,,n \rrbracket$. Déterminer la loi conditionnelle de $Y$ sachant $(X = j)$, c'est-à-dire les probabilités $\mathrm{P}_{(X = j)}(Y = k)$, ainsi que la moyenne de cette loi.

    **3.** **(a)** Montrer que $\mathrm{P}(X = 1, Y = 1) \neq \mathrm{P}(X = 1)\,\mathrm{P}(Y = 1)$.

    **(b)** Calculer la covariance de $X$ et $Y$, et montrer qu'elle s'annule pour une unique valeur de $q \in \left]0\,,1\right[$.

    **(c)** Qu'en déduire ?
  corrige: |
    **1.** Les nombres de l'énoncé sont positifs. Pour calculer leur somme, on sépare la ligne $j = 0$, formée de $n$ termes égaux à $\frac{q^{n}}{n}$, et les couples $(k, k)$ avec $k \geqslant 1$ : 
    $$\sum_{j,k} \mathrm{P}(X = j, Y = k) = q^{n} + \sum_{k=1}^{n} \binom{n}{k}p^{k}q^{n-k} = q^{n} + (p + q)^{n} - q^{n} = 1,$$
     par la formule du binôme : il s'agit bien d'une loi conjointe.

    Par la proposition 14, on a $\mathrm{P}(X = 0) = n \times \frac{q^{n}}{n}$, soit $q^{n}$, et, pour $j \geqslant 1$, $\mathrm{P}(X = j) = \tbinom{n}{j}p^{j}q^{n-j}$ : 
    $$\boxed{X \sim \mathcal{B}(n,p), \qquad \mathrm{E}(X) = np}$$
     Pour $k \in \llbracket 1\,,n \rrbracket$, la colonne $k$ contient $\mathrm{P}(X = 0, Y = k) = \frac{q^{n}}{n}$ et $\mathrm{P}(X = k, Y = k)$ : 
    $$\boxed{\mathrm{P}(Y = k) = \binom{n}{k}p^{k}q^{n-k} + \frac{q^{n}}{n}}, \qquad \mathrm{E}(Y) = \sum_{k=1}^{n} k\binom{n}{k}p^{k}q^{n-k} + \frac{q^{n}}{n}\sum_{k=1}^{n} k,$$
     d'où, par la proposition 19 et la somme des entiers, 
    $$\boxed{\mathrm{E}(Y) = np + \frac{(n + 1)q^{n}}{2}}$$
     On peut décrire le couple ainsi : $X$ suit une loi binomiale, $Y = X$ lorsque $X \geqslant 1$, et lorsque $X = 0$, $Y$ est choisie uniformément dans $\llbracket 1\,,n \rrbracket$.

    **2.** Comme $p$ et $q$ sont dans $\left]0\,,1\right[$, $\mathrm{P}(X = j) > 0$ pour tout $j \in \llbracket 0\,,n \rrbracket$. Par définition, 
    $$\mathrm{P}_{(X = j)}(Y = k) = \frac{\mathrm{P}(X = j, Y = k)}{\mathrm{P}(X = j)}.$$
     Pour $j \geqslant 1$, ce quotient vaut $1$ si $k = j$ et $0$ sinon ; pour $j = 0$, il vaut $\frac{q^{n}/n}{q^{n}} = \frac{1}{n}$ pour tout $k$ : 
    $$\boxed{\mathrm{P}_{(X = j)}(Y = k) = \begin{cases} 1 \text{ si } k = j, \ 0 \text{ sinon} & (j \geqslant 1), \\ \frac{1}{n} & (j = 0). \end{cases}}$$
     Sachant $(X = j)$ avec $j \geqslant 1$, la variable $Y$ vaut $j$, et la moyenne de la loi conditionnelle est $\boxed{j}$ ; sachant $(X = 0)$, la loi conditionnelle de $Y$ est uniforme sur $\llbracket 1\,,n \rrbracket$, de moyenne $\boxed{\frac{n + 1}{2}}$ (proposition 19).

    **3. (a)** On a $\mathrm{P}(X = 1, Y = 1) = npq^{n-1} = \mathrm{P}(X = 1)$, et $\mathrm{P}(X = 1) > 0$. L'égalité de $\mathrm{P}(X = 1, Y = 1)$ et de $\mathrm{P}(X = 1)\mathrm{P}(Y = 1)$ équivaudrait donc à $\mathrm{P}(Y = 1) = 1$. Or, comme $n \geqslant 2$, on a $\mathrm{P}(Y = 2) \geqslant \tbinom{n}{2}p^{2}q^{n-2}$, qui est strictement positif, donc $\mathrm{P}(Y = 1) < 1$, et 
    $$\boxed{\mathrm{P}(X = 1, Y = 1) \neq \mathrm{P}(X = 1)\mathrm{P}(Y = 1)}$$
     Les variables $X$ et $Y$ ne sont donc pas indépendantes, quelle que soit la valeur de $q$.

    **(b)** Par la formule de transfert, les termes où $X = 0$ sont nuls, et ceux où $X = j \geqslant 1$ imposent $Y = j$ : 
    $$\mathrm{E}(XY) = \sum_{j=1}^{n} j^{2}\binom{n}{j}p^{j}q^{n-j} = \mathrm{E}(X^{2}) = npq + n^{2}p^{2},$$
     par la formule de König-Huygens et la proposition 21. D'où 
    $$\operatorname{Cov}(X, Y) = npq + n^{2}p^{2} - np\Big(np + \frac{(n + 1)q^{n}}{2}\Big), \qquad \boxed{\operatorname{Cov}(X, Y) = npq\Big(1 - \frac{(n + 1)q^{n-1}}{2}\Big)}$$
     Comme $npq > 0$, la covariance s'annule si et seulement si $q^{n-1} = \frac{2}{n + 1}$. Comme $n \geqslant 2$, $\frac{2}{n + 1} \in \left]0\,,1\right[$, et la fonction $q \mapsto q^{n-1}$ est une bijection strictement croissante de $\left]0\,,1\right[$ sur lui-même : il y a une unique solution, 
    $$\boxed{q_{0} = \Big(\frac{2}{n + 1}\Big)^{1/(n-1)}}$$
     Par exemple $q_{0} = \frac{2}{3}$ pour $n = 2$, et $q_{0} = \frac{1}{\sqrt{2}} \approx 0{,}707$ pour $n = 3$. La covariance est positive pour $q < q_{0}$ et négative pour $q > q_{0}$. Ces calculs ont été vérifiés avec `sympy` pour $n \leqslant 6$ ✓.

    **(c)** Pour $q = q_{0}$, les variables $X$ et $Y$ sont décorrélées, et la question (a) montre qu'elles ne sont pas indépendantes : $\boxed{\text{une covariance nulle n'entraîne pas l'indépendance}}$, même pour un couple où $Y$ est égale à $X$ dès que $X \geqslant 1$. Ici, la dépendance est même très forte : sachant $X = j \geqslant 1$, la valeur de $Y$ est connue.
