  enonce: |
    Soit $p$ un nombre premier. Combien le groupe $\mathfrak{S}_{2p}$ contient-il d'éléments d'ordre $p$ ? On utilisera l'exercice 7 de la feuille du chapitre 17, qui exprime l'ordre d'une permutation à l'aide des longueurs de ses cycles, et l'on vérifiera le résultat pour $p = 2$.
  corrige: |
    Par l'exercice 7 de la feuille du chapitre 17, l'ordre d'une permutation différente de l'identité est le ppcm des longueurs des cycles de sa décomposition (chapitre 17, théorème 1), et l'identité est d'ordre $1$. Une permutation $\sigma \in \mathfrak{S}_{2p}$ est donc d'ordre $p$ si et seulement si $\sigma \neq \mathrm{id}$ et le ppcm des longueurs de ses cycles vaut $p$. Chaque longueur divise alors $p$ et vaut au moins $2$ : comme $p$ est premier, tous les cycles sont de longueur $p$. Leurs supports étant disjoints dans un ensemble à $2p$ éléments, il y a un ou deux cycles. Réciproquement, une permutation formée d'un ou de deux $p$-cycles à supports disjoints est d'ordre $p$.

    $\triangleright$ *Nombre de $p$-cycles de support donné.* Soit $X$ un ensemble à $p$ éléments. L'application qui associe à une $p$-liste $(a_{1}, \dots, a_{p})$ d'éléments distincts de $X$ le cycle $(a_{1}\,a_{2}\,\cdots\,a_{p})$ est surjective sur l'ensemble des $p$-cycles de support $X$. Deux listes donnent le même cycle $c$ si et seulement si l'une se déduit de l'autre par une rotation, puisque $c$ impose $a_{i+1} = c(a_{i})$ : une fois le premier terme choisi parmi les $p$ éléments de $X$, toute la liste est déterminée. Les fibres ont $p$ éléments, et le lemme des bergers donne $\frac{p!}{p} = (p - 1)!$ cycles.

    $\triangleright$ *Un seul $p$-cycle.* On choisit son support, de $\binom{2p}{p}$ façons, puis le cycle, de $(p - 1)!$ façons : $\binom{2p}{p}(p - 1)!$ permutations.

    $\triangleright$ *Deux $p$-cycles.* Les deux supports forment une partition $\{X, \overline{X}\}$ de $\llbracket 1\,,2p \rrbracket$ en deux parties à $p$ éléments. L'application $X \mapsto \{X, \overline{X}\}$ a des fibres à deux éléments, $X$ et $\overline{X}$, qui sont distincts : il y a $\frac{1}{2}\binom{2p}{p}$ telles partitions. Pour chacune, on choisit un $p$-cycle sur chaque partie, de $(p - 1)!^{2}$ façons, et l'unicité de la décomposition en cycles (chapitre 17, théorème 1) assure que des choix différents donnent des permutations différentes. 
    $$\boxed{\binom{2p}{p}(p - 1)! + \frac{1}{2}\binom{2p}{p}(p - 1)!^{2} = \frac{(2p)!}{p\cdot p!} + \frac{(2p)!}{2p^{2}} \text{ éléments d'ordre } p}$$
     Pour $p = 2$, on trouve $\frac{24}{4} + \frac{24}{8} = 6 + 3 = 9$ : ce sont les $6$ transpositions et les $3$ doubles transpositions $(1\,2)(3\,4)$, $(1\,3)(2\,4)$, $(1\,4)(2\,3)$ de $\mathfrak{S}_{4}$ ✓. Pour $p = 3$, on trouve $40 + 40 = 80$, et pour $p = 5$, $6\,048 + 72\,576 = 78\,624$. Les valeurs pour $p = 2$ et $p = 3$ ont été confirmées par énumération de $\mathfrak{S}_{4}$ et de $\mathfrak{S}_{6}$.

    *Piège.* L'erreur la plus répandue est de compter $\binom{2p}{p}(p - 1)!^{2}$ permutations formées de deux $p$-cycles, en choisissant « le support du premier cycle » : les deux cycles commutent et jouent le même rôle, et chaque permutation est comptée deux fois. Pour $p = 2$, on trouverait $6$ doubles transpositions au lieu de $3$.
- id: "ma-21-20"
  feuille: "f-ma-21"
  numero: 20
  partie: "Dénombrement"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 6
  page_corrige: 19
  enonce: |
    *Théorème de Sperner.* Soit $n \geqslant 1$. Une *antichaîne* est un ensemble $\mathcal{A}$ de parties de $\llbracket 1\,,n \rrbracket$ dont aucune n'est incluse dans une autre. Une *chaîne complète* est une suite $(C_{0}, C_{1}, \dots, C_{n})$ de parties de $\llbracket 1\,,n \rrbracket$ telle que $C_{0} \subsetneq C_{1} \subsetneq \cdots \subsetneq C_{n}$.

    **1.** Donner des exemples d'antichaînes, en précisant leur cardinal.

    **2.** **(a)** Montrer que $|C_{k}| = k$ pour tout $k$, et dénombrer les chaînes complètes.

    **(b)** Soit $X$ une partie de $\llbracket 1\,,n \rrbracket$. Combien y a-t-il de chaînes complètes dont l'un des termes est $X$ ?

    **3.** En déduire que toute antichaîne $\mathcal{A}$ vérifie l'*inégalité de Lubell-Yamamoto-Meshalkin* 
    $$\sum_{A \in \mathcal{A}} |A|!\,\big(n - |A|\big)! \leqslant n!.$$

    **4.** Déterminer le cardinal maximal d'une antichaîne. Ce résultat a été publié par E. Sperner en 1928.
  corrige: |
    **1.** La famille $\{\varnothing\}$, ou toute famille réduite à une partie, est une antichaîne de cardinal $1$. La famille des singletons $\big\{\{1\}, \dots, \{n\}\big\}$ en est une de cardinal $n$, car aucun singleton n'est inclus dans un autre. Plus généralement, pour $k \in \llbracket 0\,,n \rrbracket$, la famille de toutes les parties à $k$ éléments est une antichaîne : si $A \subset B$ avec $|A| = |B|$, alors $A = B$ (proposition 1 (ii)). Son cardinal est $\binom{n}{k}$, maximal pour $k = \lfloor \frac{n}{2} \rfloor$ (exercice 28 de la feuille du chapitre 3). Pour $n = 4$, la famille $\big\{\{1, 2\}, \{1, 3\}, \{1, 4\}, \{2, 3\}, \{2, 4\}, \{3, 4\}\big\}$ est une antichaîne à $6$ éléments. On peut aussi mélanger les cardinaux, comme $\big\{\{1\}, \{2, 3\}\big\}$ pour $n = 3$.

    **2.(a)** Si $C_{k-1} \subsetneq C_{k}$, alors $|C_{k-1}| < |C_{k}|$ (proposition 1 (ii)), donc $|C_{k}| \geqslant |C_{k-1}| + 1$, puisque ce sont des entiers. Par récurrence, $|C_{k}| \geqslant |C_{0}| + k \geqslant k$ et $|C_{k}| \leqslant |C_{n}| - (n - k) \leqslant k$. 
    $$\boxed{|C_{k}| = k \text{ pour tout } k \in \llbracket 0\,,n \rrbracket}$$
     En particulier $C_{0} = \varnothing$ et $C_{n} = \llbracket 1\,,n \rrbracket$, et, pour $k \geqslant 1$, $C_{k} \setminus C_{k-1}$ est un singleton $\{x_{k}\}$. Les éléments $x_{1}$, …, $x_{n}$ sont deux à deux distincts, puisque $x_{k} \notin C_{k-1}$ alors que $x_{j} \in C_{k-1}$ pour $j < k$, et $C_{k} = \{x_{1}, \dots, x_{k}\}$. L'application qui associe à une chaîne complète la liste $(x_{1}, \dots, x_{n})$ est une bijection de l'ensemble des chaînes complètes sur l'ensemble des $n$-listes d'éléments distincts de $\llbracket 1\,,n \rrbracket$ : sa réciproque associe à une liste la chaîne des $C_{k} = \{x_{1}, \dots, x_{k}\}$. Par le théorème 1 : 
    $$\boxed{n! \text{ chaînes complètes}}$$
     On construit une chaîne en ajoutant les éléments un par un, dans un ordre choisi.

    **2.(b)** Soit $X$ une partie, de cardinal $k$. Par la question (a), $X$ ne peut être que le terme $C_{k}$ d'une chaîne, et $C_{k} = X$ si et seulement si $\{x_{1}, \dots, x_{k}\} = X$ : la liste commence par une énumération des éléments de $X$, en $k!$ ordres possibles, et se termine par une énumération de $\overline{X}$, en $(n - k)!$ ordres. 
    $$\boxed{|X|!\,\big(n - |X|\big)! \text{ chaînes complètes passent par } X}$$

    ![Figure](documents/figures/cb4c871d46251478.svg)

    La figure représente les parties de $\llbracket 1\,,3 \rrbracket$, chaque trait reliant une partie à une partie qui a un élément de plus. Une chaîne complète, en bleu, monte du bas vers le haut en ajoutant $2$, puis $3$, puis $1$ : il y en a $3! = 6$, une par ordre d'ajout. Elle traverse l'antichaîne des parties à deux éléments, en ocre, en un seul point, $\{2, 3\}$.

    **3.** Pour $A \in \mathcal{A}$, notons $\mathcal{K}_{A}$ l'ensemble des chaînes complètes qui passent par $A$. Si une chaîne passait par deux éléments distincts $A$ et $A'$ de $\mathcal{A}$, l'un serait inclus dans l'autre, puisque deux termes d'une chaîne sont toujours comparables pour l'inclusion : c'est exclu dans une antichaîne. Les ensembles $\mathcal{K}_{A}$, pour $A \in \mathcal{A}$, sont donc deux à deux disjoints, et leur réunion est contenue dans l'ensemble des $n!$ chaînes complètes. Les propositions 2 (i) et 1 (ii), avec la question 2, donnent 
    $$\boxed{\sum_{A \in \mathcal{A}} |A|!\,\big(n - |A|\big)! = \sum_{A \in \mathcal{A}} |\mathcal{K}_{A}| \leqslant n!}$$

    **4.** En divisant par $n!$, l'inégalité s'écrit $\sum_{A \in \mathcal{A}} \binom{n}{|A|}^{-1} \leqslant 1$. Posons $M = \binom{n}{\lfloor n/2 \rfloor}$. Par l'exercice 28 de la feuille du chapitre 3, $\binom{n}{k} \leqslant M$ pour tout $k \in \llbracket 0\,,n \rrbracket$, donc chaque terme de la somme est au moins égal à $\frac{1}{M}$, et $\frac{|\mathcal{A}|}{M} \leqslant 1$. La famille des parties à $\lfloor \frac{n}{2} \rfloor$ éléments est une antichaîne de cardinal $M$ (question 1) : la borne est atteinte. 
    $$\boxed{\text{Le cardinal maximal d'une antichaîne de parties de } \llbracket 1\,,n \rrbracket \text{ est } \binom{n}{\lfloor n/2 \rfloor}}$$
     Une recherche exhaustive parmi toutes les familles de parties confirme les maxima $1$, $2$, $3$ et $6$ pour $n = 1$, $2$, $3$, $4$.

    *À retenir.* La démonstration de Lubell, Yamamoto et Meshalkin est un double comptage : on compte les couples (chaîne, élément de l'antichaîne situé sur la chaîne), une fois selon la chaîne, chacune portant au plus un élément, une fois selon l'élément. On peut la lire en probabilités : si l'on choisit une chaîne complète au hasard, sous la probabilité uniforme, elle passe par $A$ avec probabilité $\binom{n}{|A|}^{-1}$, et les événements correspondants sont deux à deux incompatibles ; leur somme est donc au plus $1$.
- id: "ma-21-21"
  feuille: "f-ma-21"
  numero: 21
  partie: "Dénombrement"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [dénombrement, marches aléatoires et graphes]
  noeuds: [n-fini, pol-binome, p-variables]
  notions: [cardinal]
  page_enonce: 6
  page_corrige: 20
  enonce: |
    *Nombres de Catalan.* Un *chemin N/E* est un chemin entre deux points de $\mathbb{Z}^{2}$ formé de pas $E = (1, 0)$ et $N = (0, 1)$ ; il est codé par le mot formé de ses pas. La figure représente le chemin $EEENENNE$, qui relie $(0, 0)$ à $(5, 3)$.

    ![Figure](documents/figures/41bd4ad3fbe43988.svg)

    On y lit que ce chemin reste dans le secteur $S = \{(x, y) \in \mathbb{N}^{2} \mid x \geqslant y\}$, situé sous la diagonale en pointillés. Pour $n \in \mathbb{N}$, on note $C_{n}$ le nombre de chemins N/E reliant $(0, 0)$ à $(n, n)$ et restant dans $S$.

    **1.** Dénombrer les chemins N/E reliant $(0, 0)$ à $(a, b)$, pour $a$, $b \in \mathbb{N}$.

    **2.** Vérifier que $\dfrac{1}{n + 1}\dbinom{2n}{n} = \dfrac{1}{2n + 1}\dbinom{2n + 1}{n}$ pour tout $n \in \mathbb{N}$.

    **3.** On note $\mathcal{M}$ l'ensemble des mots $w = (w_{0}, w_{1}, \dots, w_{2n})$ formés de $n + 1$ lettres $E$ et de $n$ lettres $N$. Pour $i \in \llbracket 0\,,2n \rrbracket$, on note $\rho_{i}(w) = (w_{i}, w_{i+1}, \dots, w_{i+2n})$ le mot obtenu par rotation, les indices étant lus modulo $2n + 1$, et l'on dit que deux mots $w$ et $w'$ sont équivalents s'il existe $i$ tel que $w' = \rho_{i}(w)$ ; on admet que c'est une relation d'équivalence.

    **(a)** Montrer que chaque classe d'équivalence possède exactement $2n + 1$ éléments.

    **(b)** Montrer que chaque classe contient un unique mot $w$ tel que, pour tout $k \in \llbracket 0\,,2n \rrbracket$, le préfixe $(w_{0}, \dots, w_{k})$ contienne strictement plus de lettres $E$ que de lettres $N$. On pourra considérer le chemin infini obtenu en répétant indéfiniment le mot $w$.

    **(c)** En déduire que $C_{n} = \dfrac{1}{n + 1}\dbinom{2n}{n}$.
  corrige: |
    **1.** Un chemin N/E de $(0, 0)$ à $(a, b)$ fait $a$ pas $E$ et $b$ pas $N$, puisque chaque pas augmente de $1$ l'une des coordonnées ; réciproquement, tout mot formé de $a$ lettres $E$ et $b$ lettres $N$ code un tel chemin. Un tel mot est déterminé par l'ensemble des positions de ses lettres $E$, partie à $a$ éléments de $\llbracket 1\,,a + b \rrbracket$. 
    $$\boxed{\binom{a + b}{a} \text{ chemins N/E de } (0, 0) \text{ à } (a, b)}$$

    **2.** Pour $n \in \mathbb{N}$, on écrit les coefficients avec des factorielles : 
    $$\frac{1}{2n + 1}\binom{2n + 1}{n} = \frac{(2n + 1)!}{(2n + 1)\,n!\,(n + 1)!} = \frac{(2n)!}{n!\,(n + 1)!} = \frac{1}{n + 1} \cdot \frac{(2n)!}{n!\,n!}.$$

    $$\boxed{\frac{1}{n + 1}\binom{2n}{n} = \frac{1}{2n + 1}\binom{2n + 1}{n}}$$

    **3.(a)** On étend la définition de $\rho_{i}$ à tout $i \in \mathbb{Z}$, les indices étant lus modulo $2n + 1$. Alors $\rho_{i}\big(\rho_{j}(w)\big) = \rho_{i+j}(w)$, puisque la lettre d'indice $k$ des deux mots est $w_{i+j+k}$, et $\rho_{i} = \rho_{j}$ si $i \equiv j \pmod{2n + 1}$. La classe de $w$ est $\{\rho_{i}(w) \mid i \in \llbracket 0\,,2n \rrbracket\}$ ; elle a $2n + 1$ éléments si et seulement si les mots $\rho_{i}(w)$, pour $i \in \llbracket 0\,,2n \rrbracket$, sont deux à deux distincts. Or $\rho_{i}(w) = \rho_{j}(w)$ entraîne $\rho_{j-i}(w) = w$ en appliquant $\rho_{-i}$.

    Supposons qu'il existe $d \in \llbracket 1\,,2n \rrbracket$ tel que $\rho_{d}(w) = w$, et choisissons le plus petit. Écrivons la division euclidienne $2n + 1 = qd + r$, avec $0 \leqslant r < d$ (chapitre 12, théorème 1). Comme $\rho_{2n+1}(w) = w$ et $\rho_{qd}(w) = w$, on obtient $\rho_{r}(w) = w$, et la minimalité de $d$ impose $r = 0$ : $d$ divise $2n + 1$, et $q \geqslant 2$. La relation $w_{k+d} = w_{k}$ pour tout $k$ montre que $w$ est formé de $q$ copies du bloc $(w_{0}, \dots, w_{d-1})$. Si ce bloc contient $e$ lettres $E$ et $\nu$ lettres $N$, alors $n + 1 = qe$ et $n = q\nu$ : l'entier $q \geqslant 2$ divise $n + 1$ et $n$, donc leur différence $1$, ce qui est absurde. 
    $$\boxed{\text{Chaque classe possède exactement } 2n + 1 \text{ éléments}}$$
     C'est ici que sert le choix de $n + 1$ lettres $E$ et $n$ lettres $N$ : avec autant de lettres de chaque sorte, le mot $ENEN$ n'aurait que deux rotations distinctes.

    **3.(b)** Pour $k \in \mathbb{N}$, on note $h(k)$ le nombre de lettres $E$ moins le nombre de lettres $N$ parmi les $k$ premières lettres du mot infini $W = www\cdots$ obtenu en répétant $w$ ; ainsi $h(0) = 0$, $h(k + 1) - h(k) = \pm 1$, et, comme $w$ a une lettre $E$ de plus que de lettres $N$, $h(k + 2n + 1) = h(k) + 1$. Le préfixe de longueur $k + 1$ du mot $\rho_{i}(w)$ est formé des lettres d'indices $i$ à $i + k$ de $W$, et son nombre de $E$ moins son nombre de $N$ vaut $h(i + k + 1) - h(i)$. Le mot $\rho_{i}(w)$ a donc la propriété demandée si et seulement si 
    $$h(j) > h(i) \quad \text{pour tout } j \in \llbracket i + 1\,,i + 2n + 1 \rrbracket. \tag{$\ast$}$$

    $\triangleright$ *Existence.* Soit $m$ le minimum de $h$ sur $\llbracket 0\,,2n \rrbracket$, et $i$ le *plus grand* indice de $\llbracket 0\,,2n \rrbracket$ où il est atteint. Pour $j \in \llbracket i + 1\,,2n \rrbracket$, on a $h(j) \geqslant m$ et $h(j) \neq m$, donc $h(j) > h(i)$. Pour $j \in \llbracket 2n + 1\,,i + 2n + 1 \rrbracket$, on a $h(j) = h(j - 2n - 1) + 1 \geqslant m + 1 > h(i)$. Ainsi $(\ast)$ est vérifiée, et $\rho_{i}(w)$ a la propriété.

    $\triangleright$ *Unicité.* Soit $i < i'$ deux indices de $\llbracket 0\,,2n \rrbracket$ vérifiant $(\ast)$. Comme $i' \in \llbracket i + 1\,,i + 2n \rrbracket$, la propriété en $i$ donne $h(i') > h(i)$. Comme $i + 2n + 1 \in \llbracket i' + 1\,,i' + 2n + 1 \rrbracket$, la propriété en $i'$ donne $h(i + 2n + 1) > h(i')$, c'est-à-dire $h(i) + 1 > h(i')$. On aurait $h(i) < h(i') < h(i) + 1$ entre entiers, ce qui est impossible. Par la question (a), les $2n + 1$ rotations sont des mots distincts, et l'unicité de l'indice est celle du mot. 
    $$\boxed{\text{Chaque classe contient un unique mot dont tous les préfixes ont strictement plus de } E \text{ que de } N}$$

    ![Figure](documents/figures/e2ad2935a4531825.svg)

    La figure trace $h$ pour $n = 2$ et $w = NENEE$, sur deux périodes séparées par les pointillés. Le minimum $-1$ sur $\llbracket 0\,,4 \rrbracket$ est atteint en $1$ et en $3$ ; à partir du dernier, $i = 3$, la courbe reste strictement au-dessus de la droite en tirets sur toute la fenêtre ocre de longueur $5$. On lit le mot $\rho_{3}(w) = EENEN$, dont tous les préfixes ont plus de $E$ que de $N$. Partir de $i = 1$ échouerait, la courbe revenant à $-1$ en $k = 3$.

    **3.(c)** Notons $\mathcal{G}$ l'ensemble des mots de $\mathcal{M}$ dont tous les préfixes ont strictement plus de $E$ que de $N$. Les classes d'équivalence forment une partition de $\mathcal{M}$ (chapitre 2, théorème 4), chacune a $2n + 1$ éléments, et $|\mathcal{M}| = \binom{2n + 1}{n}$ par la question 1 : il y a $\frac{1}{2n + 1}\binom{2n + 1}{n}$ classes (lemme des bergers), et autant de mots dans $\mathcal{G}$ par la question (b).

    Un mot $w \in \mathcal{G}$ commence par $E$, puisque son préfixe de longueur $1$ doit contenir plus de $E$ que de $N$ ; on écrit $w = E\,v$, où $v$ a $n$ lettres $E$ et $n$ lettres $N$. Pour $k \in \llbracket 1\,,2n \rrbracket$, le préfixe de longueur $k + 1$ de $w$ a strictement plus de $E$ que de $N$ si et seulement si le préfixe de longueur $k$ de $v$ a au moins autant de $E$ que de $N$, c'est-à-dire si le chemin codé par $v$ est, après $k$ pas, en un point $(x, y)$ tel que $x \geqslant y$. L'application $w \mapsto v$ est donc une bijection de $\mathcal{G}$ sur l'ensemble des chemins N/E de $(0, 0)$ à $(n, n)$ qui restent dans $S$, de réciproque $v \mapsto Ev$. Avec la question 2 : 
    $$\boxed{C_{n} = |\mathcal{G}| = \frac{1}{2n + 1}\binom{2n + 1}{n} = \frac{1}{n + 1}\binom{2n}{n}}$$
     On trouve $C_{0}$, …, $C_{5}$ égaux à $1$, $1$, $2$, $5$, $14$, $42$, valeurs confirmées par énumération des chemins ; le lemme des rotations a lui aussi été vérifié classe par classe pour $n \leqslant 5$.

    *À retenir.* L'argument des rotations est un lemme des bergers : on ne sait pas compter directement les bons chemins, mais on sait compter les classes, et chaque classe en contient exactement un. La division par $2n + 1$ est légitime parce que toutes les classes ont la même taille, ce que garantit la question (a) ; c'est l'étape que l'on oublie le plus souvent.
- id: "ma-21-22"
  feuille: "f-ma-21"
  numero: 22
  partie: "Dénombrement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dénombrement, permutations, probabilités]
  noeuds: [n-fini, pol-binome, v-permutations, p-espace]
  notions: [cardinal, probabilite]
  page_enonce: 7
  page_corrige: 22
  enonce: |
    Soit $n \geqslant 1$. On note $a_{n}$ le nombre de permutations de $\llbracket 1\,,2n \rrbracket$ dont toutes les orbites ont au plus $n$ éléments.

    **1.** Soit $k \in \llbracket n + 1\,,2n \rrbracket$. Montrer qu'une permutation de $\llbracket 1\,,2n \rrbracket$ a au plus une orbite à $k$ éléments, et dénombrer les permutations qui en ont une.

    **2.** En déduire une expression de $a_{n}$, puis la limite de la suite $\Big(\dfrac{a_{n}}{(2n)!}\Big)_{n \geqslant 1}$, à l'aide du chapitre 20.

    **3.** Interpréter ce résultat en termes de probabilité, pour une permutation choisie au hasard.
  corrige: |
    **1.** Les orbites d'une permutation sont deux à deux disjointes (chapitre 17, théorème 1). Deux orbites distinctes à $k$ éléments contiendraient ensemble $2k \geqslant 2n + 2$ éléments de $\llbracket 1\,,2n \rrbracket$, ce qui est impossible : une permutation a au plus une orbite à $k$ éléments.

    Une permutation $\sigma$ qui a une orbite $O$ à $k$ éléments est déterminée par le triplet formé de $O$, de la restriction de $\sigma$ à $O$, qui est un $k$-cycle de support $O$, et de la restriction de $\sigma$ à $\overline{O}$, qui est une permutation de $\overline{O}$ ; réciproquement, tout tel triplet définit une permutation qui a $O$ pour orbite. Il y a $\binom{2n}{k}$ choix de $O$, $(k - 1)!$ cycles de support $O$ (exercice 19) et $(2n - k)!$ permutations de $\overline{O}$. 
    $$\boxed{\binom{2n}{k}(k - 1)!\,(2n - k)! = \frac{(2n)!}{k} \text{ permutations ont une orbite à } k \text{ éléments}}$$

    **2.** Les ensembles de permutations ayant une orbite à $k$ éléments, pour $k \in \llbracket n + 1\,,2n \rrbracket$, sont deux à deux disjoints : deux orbites à $k$ et $k'$ éléments, avec $k, k' > n$, contiendraient plus de $2n$ éléments. Une permutation a toutes ses orbites à au plus $n$ éléments si et seulement si elle n'appartient à aucun de ces ensembles, et la proposition 2 (i) et (ii) donne 
    $$a_{n} = (2n)! - \sum_{k=n+1}^{2n} \frac{(2n)!}{k}, \qquad\text{d'où}\qquad \boxed{\frac{a_{n}}{(2n)!} = 1 - \sum_{k=n+1}^{2n} \frac{1}{k} = 1 - \big(H_{2n} - H_{n}\big)}$$
     où $H_{m} = \sum_{k=1}^{m} \frac{1}{k}$. Par la proposition 7 du chapitre 20, on a $H_{m} = \ln m + \gamma + o(1)$, donc 
    $$H_{2n} - H_{n} = \ln(2n) - \ln n + o(1) = \ln 2 + o(1),$$
     comme le note la remarque qui suit cette proposition. 
    $$\boxed{\lim_{n \to +\infty} \frac{a_{n}}{(2n)!} = 1 - \ln 2 \approx 0{,}3069}$$
     Pour $n = 1$, $2$, $3$, $4$, la formule donne $\frac{1}{2}$, $\frac{5}{12}$, $\frac{23}{60}$ et $\frac{307}{840} \approx 0{,}365$, valeurs confirmées par énumération de $\mathfrak{S}_{2}$, $\mathfrak{S}_{4}$, $\mathfrak{S}_{6}$ et $\mathfrak{S}_{8}$. Pour $n = 1$, seule l'identité convient parmi les deux permutations de $\llbracket 1\,,2 \rrbracket$ ✓.

    **3.** On choisit une permutation $\sigma$ au hasard : $\Omega = \mathfrak{S}_{2n}$, muni de la probabilité uniforme. La probabilité que toutes les orbites de $\sigma$ aient au plus $n$ éléments vaut $\frac{a_{n}}{(2n)!}$, et la question 2 montre que la probabilité que $\sigma$ ait une orbite à $k$ éléments vaut $\frac{1}{k}$, pour chaque $k > n$. 
    $$\boxed{\mathrm{P}\big(\text{toutes les orbites de } \sigma \text{ ont au plus } n \text{ éléments}\big) \xrightarrow[n \to +\infty]{} 1 - \ln 2 \approx 0{,}31}$$
     Quel que soit $n$, une permutation de $2n$ éléments choisie au hasard a donc, avec probabilité voisine de $\ln 2 \approx 0{,}69$, une orbite qui contient plus de la moitié des éléments : une « grande » orbite est la règle, et non l'exception. Pour $2n = 100$, la probabilité de n'en avoir aucune vaut $1 - (H_{100} - H_{50}) \approx 0{,}312$. C'est le ressort de l'énigme dite des cent prisonniers, où une stratégie qui suit les orbites d'une permutation aléatoire réussit avec cette probabilité, alors que des choix indépendants n'auraient quasiment aucune chance. L'exercice 66 précisera la loi de la longueur de l'orbite d'un élément donné.

    *Piège.* L'erreur la plus répandue est d'appliquer le même raisonnement aux orbites de taille $k \leqslant n$ : une permutation peut en avoir plusieurs, les ensembles correspondants ne sont plus disjoints, et la somme des $\frac{(2n)!}{k}$ ne compte plus rien de simple. C'est l'hypothèse $k > n$ qui rend les événements incompatibles et le calcul exact.
- id: "ma-21-23"
  feuille: "f-ma-21"
  numero: 23
  partie: "Espaces probabilisés finis"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces probabilisés finis, probabilités]
  noeuds: [p-espace]
  notions: [espace-probabilise, probabilite]
  page_enonce: 7
  page_corrige: 23
  enonce: |
    Soit $A$ et $B$ deux événements.

    **1.** On suppose que $\mathrm{P}(A) = \frac{7}{10}$, $\mathrm{P}(B) = \frac{1}{2}$ et $\mathrm{P}(A \cup B) = \frac{9}{10}$. Calculer la probabilité que l'un exactement des deux événements soit réalisé.

    **2.** Montrer que, dans le cas général, 
    $$\mathrm{P}(A \cup B) + \mathrm{P}(A \cup \overline{B}) + \mathrm{P}(\overline{A} \cup B) + \mathrm{P}(\overline{A} \cup \overline{B}) = 3.$$

    **3.** On suppose que $\mathrm{P}(A) = p$ et $\mathrm{P}(B) = q$. Montrer que $\max(0, p + q - 1) \leqslant \mathrm{P}(A \cap B) \leqslant \min(p, q)$, et que toute valeur de cet intervalle est la probabilité de $A \cap B$ pour un espace probabilisé et des événements $A$ et $B$ convenables.
  corrige: |
    **1.** La formule de la proposition 7 (iv) donne d'abord la probabilité de l'intersection : 
    $$\mathrm{P}(A \cap B) = \mathrm{P}(A) + \mathrm{P}(B) - \mathrm{P}(A \cup B) = \frac{7}{10} + \frac{5}{10} - \frac{9}{10} = \frac{3}{10}.$$
     L'événement « l'un exactement des deux est réalisé » est $(A \cup B) \setminus (A \cap B)$, et $A \cap B \subset A \cup B$ ; la proposition 7 (ii) donne 
    $$\boxed{\mathrm{P}\big((A \cup B) \setminus (A \cap B)\big) = \mathrm{P}(A \cup B) - \mathrm{P}(A \cap B) = \frac{9}{10} - \frac{3}{10} = \frac{3}{5}}$$
     On le retrouve en écrivant cet événement comme la réunion des événements incompatibles $A \cap \overline{B}$ et $\overline{A} \cap B$, de probabilités $\frac{7}{10} - \frac{3}{10} = \frac{2}{5}$ et $\frac{5}{10} - \frac{3}{10} = \frac{1}{5}$ ✓.

    **2.** Les quatre événements $A \cap B$, $A \cap \overline{B}$, $\overline{A} \cap B$ et $\overline{A} \cap \overline{B}$ forment un système complet d'événements ; on note $x$, $y$, $z$, $w$ leurs probabilités, de sorte que $x + y + z + w = 1$ (proposition 7 (v)). Le contraire de chacune des quatre réunions est l'un de ces quatre « atomes », par les lois de De Morgan : par exemple, le contraire de $A \cup \overline{B}$ est $\overline{A} \cap B$. Par la proposition 7 (ii), 
    $$\mathrm{P}(A \cup B) + \mathrm{P}(A \cup \overline{B}) + \mathrm{P}(\overline{A} \cup B) + \mathrm{P}(\overline{A} \cup \overline{B}) = (1 - w) + (1 - z) + (1 - y) + (1 - x) = 4 - 1,$$

    $$\boxed{\mathrm{P}(A \cup B) + \mathrm{P}(A \cup \overline{B}) + \mathrm{P}(\overline{A} \cup B) + \mathrm{P}(\overline{A} \cup \overline{B}) = 3}$$
     Chaque atome est contenu dans exactement trois des quatre réunions : la somme compte trois fois la probabilité totale, ce qui est une autre façon de lire le résultat.

    **3.** Comme $A \cap B$ est inclus dans $A$ et dans $B$, la croissance (proposition 7 (iii)) donne $\mathrm{P}(A \cap B) \leqslant p$ et $\mathrm{P}(A \cap B) \leqslant q$. Une probabilité est positive, et $\mathrm{P}(A \cup B) \leqslant 1$, donc 
    $$\mathrm{P}(A \cap B) = p + q - \mathrm{P}(A \cup B) \geqslant p + q - 1.$$

    $$\boxed{\max(0, p + q - 1) \leqslant \mathrm{P}(A \cap B) \leqslant \min(p, q)}$$
     Réciproquement, soit $t$ dans cet intervalle. On prend $\Omega = \{1, 2, 3, 4\}$ et les quatre nombres 
    $$p_{1} = t, \qquad p_{2} = p - t, \qquad p_{3} = q - t, \qquad p_{4} = 1 - p - q + t.$$
     Ils sont positifs exactement parce que $t \leqslant p$, $t \leqslant q$ et $t \geqslant p + q - 1$, et leur somme vaut $1$ : c'est une distribution de probabilités, et le théorème 4 fournit une probabilité $\mathrm{P}$ sur $\Omega$ telle que $\mathrm{P}(\{i\}) = p_{i}$. Avec $A = \{1, 2\}$ et $B = \{1, 3\}$, on obtient $\mathrm{P}(A) = p$, $\mathrm{P}(B) = q$ et $\mathrm{P}(A \cap B) = t$. 
    $$\boxed{\text{toute valeur } t \in \big[\max(0, p + q - 1)\,,\min(p, q)\big] \text{ est atteinte}}$$

    ![Figure](documents/figures/8052c00f2aad9c30.svg)

    Les quatre atomes déterminent tout : la probabilité $t$ de la case pétrole fixe les trois autres, et la seule contrainte est que les quatre cases aient une probabilité positive. C'est exactement l'encadrement obtenu, que l'on retrouvera à l'exercice 55 pour la loi conjointe de deux variables de Bernoulli.

    *Piège.* L'erreur la plus répandue est d'écrire $\mathrm{P}(A \cap B) = pq$ : c'est l'indépendance, qui n'est qu'une valeur particulière de l'intervalle, et l'énoncé ne la suppose pas. Les bornes correspondent aux cas extrêmes : $t = \min(p, q)$ lorsque l'un des événements est (presque sûrement) inclus dans l'autre, $t = \max(0, p + q - 1)$ lorsqu'ils se chevauchent le moins possible.
- id: "ma-21-24"
  feuille: "f-ma-21"
  numero: 24
  partie: "Espaces probabilisés finis"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces probabilisés finis, probabilités]
  noeuds: [p-espace]
  notions: [espace-probabilise, probabilite]
  page_enonce: 7
  page_corrige: 24
  enonce: |
    Soit $n \in \mathbb{N}^{*}$.

    **1.** Déterminer la probabilité sur $\llbracket 1\,,n \rrbracket$ pour laquelle la probabilité de chaque singleton $\{k\}$ est proportionnelle à $k$.

    **2.** Déterminer la probabilité sur $\llbracket 1\,,n \rrbracket$ pour laquelle $\mathrm{P}(\llbracket 1\,,k \rrbracket)$ est proportionnelle à $k^{2}$ pour tout $k \in \llbracket 1\,,n \rrbracket$.

    **3.** À quelles conditions sur les réels $x$ et $y$ existe-t-il une probabilité $\mathrm{P}$ sur $\{1, 2, 3\}$ telle que $\mathrm{P}(\{1, 2\}) = x$ et $\mathrm{P}(\{2, 3\}) = y$ ?
  corrige: |
    **1.** On cherche $\mathrm{P}(\{k\}) = ck$, avec $c > 0$. D'après le théorème 4, une telle famille définit une probabilité si et seulement si ses termes sont positifs et de somme $1$ ; la somme vaut $c\,\frac{n(n + 1)}{2}$ (chapitre 3), d'où l'unique valeur de $c$ : 
    $$\boxed{\mathrm{P}(\{k\}) = \frac{2k}{n(n + 1)} \qquad\text{pour } k \in \llbracket 1\,,n \rrbracket}$$
     Pour $n = 3$, on trouve les probabilités $\frac{1}{6}$, $\frac{2}{6}$, $\frac{3}{6}$, de somme $1$ ✓.

    **2.** On cherche $\mathrm{P}(\llbracket 1\,,k \rrbracket) = ck^{2}$ pour tout $k$. Avec $k = n$, il vient $c = \frac{1}{n^{2}}$. L'intervalle $\llbracket 1\,,k \rrbracket$ est la réunion disjointe de $\llbracket 1\,,k - 1 \rrbracket$ et de $\{k\}$, avec $\llbracket 1\,,0 \rrbracket = \varnothing$, de probabilité nulle, ce qui est cohérent avec la formule $c \times 0^{2}$. Donc, nécessairement, 
    $$\mathrm{P}(\{k\}) = \frac{k^{2} - (k - 1)^{2}}{n^{2}}, \qquad \boxed{\mathrm{P}(\{k\}) = \frac{2k - 1}{n^{2}} \qquad\text{pour } k \in \llbracket 1\,,n \rrbracket}$$
     Réciproquement, ces nombres sont positifs et leur somme télescopique vaut $\frac{n^{2}}{n^{2}} = 1$ ; la probabilité qu'ils définissent (théorème 4) vérifie $\mathrm{P}(\llbracket 1\,,k \rrbracket) = \frac{k^{2}}{n^{2}}$ par le même télescopage. On a ainsi retrouvé que la somme des $k$ premiers nombres impairs vaut $k^{2}$.

    **3.** Notons $p_{i} = \mathrm{P}(\{i\})$. Par le théorème 4, une probabilité sur $\{1, 2, 3\}$ est la donnée de trois réels positifs de somme $1$, et les conditions s'écrivent 
    $$p_{1} + p_{2} = x, \qquad p_{2} + p_{3} = y, \qquad p_{1} + p_{2} + p_{3} = 1.$$
     Ce système a pour unique solution $p_{1} = 1 - y$, $p_{3} = 1 - x$ et $p_{2} = x + y - 1$. La probabilité cherchée existe si et seulement si ces trois nombres sont positifs : 
    $$\boxed{x \leqslant 1, \qquad y \leqslant 1, \qquad x + y \geqslant 1}$$
     et elle est alors unique. Ces conditions entraînent $x \geqslant 1 - y \geqslant 0$ et de même $y \geqslant 0$ : il n'est pas utile de les ajouter.

    ![Figure](documents/figures/4c184e5e8a40418a.svg)

    Les couples $(x, y)$ admissibles remplissent le triangle pétrole. Sur chaque côté, l'une des trois probabilités s'annule, et aux sommets la probabilité est concentrée sur un seul point ; on a noté $\delta_{i}$ la probabilité qui donne la probabilité $1$ au singleton $\{i\}$.
