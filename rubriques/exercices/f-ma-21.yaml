  enonce: |
    On mélange un jeu de $52$ cartes, comportant $26$ cartes rouges et $26$ cartes noires, dont quatre rois ; tous les ordres sont également probables.

    **1.** Quelle est la probabilité que deux cartes de même couleur, deux rouges ou deux noires, se retrouvent côte à côte ?

    **2.** Quelle est la probabilité que deux rois se retrouvent côte à côte ? On pourra dénombrer les ensembles de positions des quatre rois.
  corrige: |
    L'univers est l'ensemble des ordres des $52$ cartes, c'est-à-dire des bijections de $\llbracket 1\,,52 \rrbracket$ (les positions) sur l'ensemble des cartes, muni de la probabilité uniforme ; il a $52!$ éléments (théorème 1).

    **1.** Le contraire de l'événement étudié est « deux cartes voisines sont toujours de couleurs différentes » : les couleurs alternent, et la suite des couleurs est rouge, noire, rouge, … ou noire, rouge, noire, … Pour chacun de ces deux motifs, on place les $26$ cartes rouges dans les $26$ positions qui leur sont réservées, de $26!$ façons, et les noires de même. Ainsi 
    $$\boxed{\mathrm{P}(\text{deux cartes de même couleur côte à côte}) = 1 - \frac{2\,(26!)^{2}}{52!} = 1 - \frac{2}{\dbinom{52}{26}}}$$
     avec $2 \big/ \binom{52}{26} \approx 4{,}0 \times 10^{-15}$. L'événement est presque certain : une alternance parfaite des couleurs dans un jeu bien mélangé a une chance sur $250$ milliers de milliards. Sur un modèle réduit de six cartes, trois rouges et trois noires, la formule donne $1 - \frac{72}{720} = \frac{9}{10}$, valeur confirmée par énumération des $720$ ordres ✓.

    **2.** À chaque ordre, on associe l'ensemble $K$ des positions des quatre rois, partie à quatre éléments de $\llbracket 1\,,52 \rrbracket$. Pour une partie $K$ donnée, il y a $4!\,48!$ ordres qui lui correspondent (on place les quatre rois dans les positions de $K$, puis les $48$ autres cartes) : ce nombre ne dépend pas de $K$, et le lemme des bergers montre que $K$ suit la loi uniforme sur les $\binom{52}{4}$ parties à quatre éléments. Il suffit donc de compter les parties sans deux entiers consécutifs. Pour $a_{1} < a_{2} < a_{3} < a_{4}$, on pose $b_{i} = a_{i} - (i - 1)$ : 
    $$a_{i+1} - a_{i} \geqslant 2 \ \text{ pour tout } i \iff b_{1} < b_{2} < b_{3} < b_{4}, \qquad\text{avec}\qquad 1 \leqslant b_{1}, \quad b_{4} = a_{4} - 3 \leqslant 49.$$
     L'application $\{a_{1}, \dots, a_{4}\} \mapsto \{b_{1}, \dots, b_{4}\}$ est donc une bijection de l'ensemble des parties à quatre éléments de $\llbracket 1\,,52 \rrbracket$ sans entiers consécutifs sur l'ensemble des parties à quatre éléments de $\llbracket 1\,,49 \rrbracket$, de réciproque $b_{i} \mapsto b_{i} + i - 1$. Il y en a $\binom{49}{4}$, et 
    $$\boxed{\mathrm{P}(\text{deux rois côte à côte}) = 1 - \frac{\dbinom{49}{4}}{\dbinom{52}{4}} = 1 - \frac{211\,876}{270\,725} = \frac{1\,201}{5\,525} \approx 0{,}217}$$
     Sur un jeu de $8$ cartes contenant $3$ rois, la même méthode donne $1 - \binom{6}{3}\big/\binom{8}{3} = \frac{9}{14}$, valeur confirmée par énumération des $8!$ ordres ✓. La même bijection montre qu'il y a $\binom{n - r + 1}{r}$ parties à $r$ éléments de $\llbracket 1\,,n \rrbracket$ sans entiers consécutifs ; l'exercice 9 les avait dénombrées toutes tailles confondues.

    *Piège.* Les deux questions se ressemblent, mais leurs réponses sont opposées : il est presque certain que deux cartes de même couleur se touchent, et peu probable que deux rois se touchent. L'erreur la plus répandue est de travailler directement sur les $52!$ ordres pour la question 2 ; le passage à l'ensemble des positions, dont la loi est uniforme, réduit le problème à un dénombrement de parties.
