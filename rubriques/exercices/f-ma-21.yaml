  page_enonce: 17
  page_corrige: 63
  enonce: |
    *Les boîtes d'allumettes de Banach.* Un fumeur porte dans chacune de ses deux poches une boîte contenant initialement $n$ allumettes. Chaque fois qu'il veut une allumette, il choisit une poche au hasard, chacune avec la probabilité $\frac{1}{2}$, indépendamment des choix précédents, et prend une allumette dans la boîte correspondante. Il constate qu'une boîte est vide au moment où il cherche à y prendre une allumette, et non au moment où il prend la dernière. On note $X$ le nombre d'allumettes qui restent alors dans l'autre boîte.

    **1.** Justifier que la constatation a lieu au plus tard lors du $(2n + 1)$-ième choix de poche, et proposer un espace probabilisé fini qui modélise l'expérience.

    **2.** Soit $k \in \llbracket 0\,,n \rrbracket$. Montrer que $\mathrm{P}(X = k) = \dbinom{2n - k}{n}\dfrac{1}{2^{2n-k}}$.

    **3.** On suppose $n = 6$. Calculer le nombre moyen d'allumettes restantes, c'est-à-dire la somme des produits $k\,\mathrm{P}(X = k)$ pour $k$ allant de $0$ à $n$ ; la section suivante l'appellera l'espérance de $X$.
  corrige: |
    **1.** Tant que le fumeur n'a pas trouvé de boîte vide, chaque choix de poche lui fournit une allumette. Les deux boîtes en contiennent $2n$ au total : si les $2n$ premiers choix ont tous fourni une allumette, les deux boîtes sont vides, et le choix suivant tombe sur une boîte vide. La constatation a donc lieu $\boxed{\text{au plus tard au } (2n + 1)\text{-ième choix}}$.

    On prend pour univers $\Omega = \{G, D\}^{2n+1}$, muni de la probabilité uniforme : l'issue $\omega$, de coordonnées $\omega_{1}$, …, $\omega_{2n+1}$, donne les poches choisies, à gauche ou à droite, lors des choix successifs. Par la proposition 17, les coordonnées sont mutuellement indépendantes et de loi uniforme sur $\{G, D\}$, comme le demande l'énoncé. Les choix postérieurs à la constatation ne sont pas effectués ; on les ajoute, sans qu'ils influent sur rien, pour que toutes les issues aient la même longueur.

    **2.** Soit $k \in \llbracket 0\,,n \rrbracket$, et $G_{k}$ l'événement « la boîte de gauche est trouvée vide alors qu'il reste $k$ allumettes dans celle de droite ». Montrons que 
    $$G_{k} = \big\{\omega \in \Omega \ \big|\ \text{exactement } n \text{ des } 2n - k \text{ premiers choix sont } G, \text{ et } \omega_{2n-k+1} = G\big\}.$$
     Si $\omega$ appartient à $G_{k}$, la boîte de gauche a été vidée par $n$ choix $G$, celle de droite a fourni $n - k$ allumettes, et la constatation a lieu au choix suivant, qui est un choix $G$ : c'est le choix numéro $n + (n - k) + 1 = 2n - k + 1$, et les $2n - k$ précédents comportent $n$ choix $G$. Réciproquement, si $\omega$ est dans l'ensemble de droite, aucune constatation n'a lieu avant le choix $2n - k + 1$ : elle exigerait $n + 1$ choix d'une même poche parmi les $2n - k$ premiers, alors qu'il y a $n$ choix $G$ et $n - k \leqslant n$ choix $D$. Au choix $2n - k + 1$, la boîte de gauche a fourni ses $n$ allumettes, et il en reste $n - (n - k) = k$ à droite.

    On dénombre cet ensemble : on choisit les positions des $n$ choix $G$ parmi les $2n - k$ premiers, de $\tbinom{2n - k}{n}$ façons (théorème 2), le choix $2n - k + 1$ est imposé, et les $k$ derniers sont quelconques. Ainsi 
    $$\mathrm{P}(G_{k}) = \binom{2n - k}{n}\frac{2^{k}}{2^{2n+1}} = \binom{2n - k}{n}\frac{1}{2^{2n-k+1}}.$$
     L'échange de $G$ et de $D$ dans toutes les coordonnées est une bijection de $\Omega$ qui transforme $G_{k}$ en l'événement analogue $D_{k}$ pour la poche droite, donc $\mathrm{P}(D_{k}) = \mathrm{P}(G_{k})$. Les événements $G_{k}$ et $D_{k}$ sont incompatibles, puisque la constatation n'a lieu qu'une fois, et $(X = k) = G_{k} \cup D_{k}$ : 
    $$\boxed{\mathrm{P}(X = k) = \binom{2n - k}{n}\frac{1}{2^{2n-k}}, \qquad k \in \llbracket 0\,,n \rrbracket}$$
     Comme ces probabilités ont pour somme $1$ (proposition 11), on obtient au passage l'identité 
    $$\sum_{k=0}^{n} \binom{2n - k}{n}2^{k} = 4^{n},$$
     qu'il ne serait pas immédiat d'établir par le calcul.

    ![Figure](documents/figures/89a1e92fd3659b69.svg)

    La figure suit, pour $n = 6$ et $k = 2$, l'état $(a, b)$ des nombres d'allumettes prises à gauche et à droite : un choix $G$ est un pas vers la droite, un choix $D$ un pas vers le haut. Le chemin en bleu est l'un des $\tbinom{10}{6}$ chemins de $(0, 0)$ à $(6, 4)$ ; le onzième choix, en rouge, tente de franchir la barrière $a = 6$ : la boîte de gauche est trouvée vide, et il reste $k = 2$ allumettes à droite.

    **3.** Pour $n = 6$, les probabilités $\mathrm{P}(X = k) = \tbinom{12 - k}{6}2^{k - 12}$, pour $k = 0$, …, $6$, valent 
    $$\frac{231}{1024},\ \frac{231}{1024},\ \frac{105}{512},\ \frac{21}{128},\ \frac{7}{64},\ \frac{7}{128},\ \frac{1}{64},$$
     soit environ $0{,}226$, $0{,}226$, $0{,}205$, $0{,}164$, $0{,}109$, $0{,}055$ et $0{,}016$. Le nombre moyen d'allumettes restantes est 
    $$\sum_{k=0}^{6} k\,\mathrm{P}(X = k) = \frac{231 + 2 \times 210 + 3 \times 168 + 4 \times 112 + 5 \times 56 + 6 \times 16}{1024},$$
     soit 
    $$\boxed{\sum_{k=0}^{6} k\,\mathrm{P}(X = k) = \frac{1979}{1024} \approx 1{,}93}$$
     Il reste en moyenne près de deux allumettes dans l'autre boîte, et les valeurs $0$ et $1$ sont les plus probables, à égalité. Plus généralement, on peut montrer que cette moyenne vaut $\frac{2n + 1}{4^{n}}\tbinom{2n}{n} - 1$ ; ce résultat est admis ici, il a été vérifié par énumération exhaustive pour $n \leqslant 7$ ✓. Avec l'équivalent $\tbinom{2n}{n} \sim \frac{4^{n}}{\sqrt{\pi n}}$ que donnent les intégrales de Wallis du chapitre 18, elle est équivalente à $2\sqrt{\frac{n}{\pi}}$ : elle croît comme la racine carrée de $n$.

    *Piège.* L'erreur la plus répandue est de compter les suites de $2n - k$ choix comportant $n$ choix $G$ sans imposer que le choix suivant soit $G$ : on oublie que la boîte doit être *trouvée* vide, et non simplement vidée, et l'on obtient une formule fausse, dont la somme ne vaut pas $1$.
- id: "ma-21-69"
  feuille: "f-ma-21"
  numero: 69
  partie: "Variables aléatoires et lois"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [variables aléatoires, coefficients binomiaux, probabilités, indépendance, loi uniforme]
  noeuds: [p-variables, pol-binome, p-espace, p-independance]
  notions: [variable-aleatoire, probabilite, independance, coefficient-binomial]
  page_enonce: 17
  page_corrige: 65
  enonce: |
    Soit $n \geqslant 2$. Un sous-groupe $H$ de $\mathfrak{S}_{n}$ est dit *transitif* si, pour tous $x$, $y \in \llbracket 1\,,n \rrbracket$, il existe $\sigma \in H$ telle que $\sigma(x) = y$.

    **1.** Soit $\sigma \in \mathfrak{S}_{n}$. À quelle condition le sous-groupe engendré par $\sigma$ est-il transitif ?

    **2.** Soit $X_{n}$ une variable aléatoire de loi uniforme sur $\mathfrak{S}_{n}$. Calculer la probabilité $p_{n}$ que le sous-groupe engendré par $X_{n}$ soit transitif.

    **3.** Soit $X_{n}$ et $Y_{n}$ deux variables aléatoires indépendantes de loi uniforme sur $\mathfrak{S}_{n}$, et $q_{n}$ la probabilité que le sous-groupe engendré par $X_{n}$ et $Y_{n}$ soit transitif.

    **(a)** Montrer que ce sous-groupe n'est pas transitif si et seulement s'il existe une partie $A$ de $\llbracket 1\,,n \rrbracket$, avec $1 \leqslant |A| \leqslant \frac{n}{2}$, telle que $X_{n}(A) = A$ et $Y_{n}(A) = A$.

    **(b)** Pour une partie $A$ à $k$ éléments, calculer $\mathrm{P}\big(X_{n}(A) = A\big)$.

    **(c)** En déduire que $1 - q_{n} \leqslant \displaystyle\sum_{k=1}^{\lfloor n/2 \rfloor} \binom{n}{k}^{-1}$, puis que $q_{n}$ tend vers $1$ quand $n$ tend vers $+\infty$.
  corrige: |
    **1.** Le sous-groupe engendré par $\sigma$ est le plus petit sous-groupe de $\mathfrak{S}_{n}$ qui contient $\sigma$ (chapitre 11, remarque qui suit la proposition 8). C'est $H = \{\sigma^{k} \mid k \in \mathbb{Z}\}$ : cet ensemble contient $\sigma$, il est un sous-groupe, puisque $\mathrm{id} = \sigma^{0}$ et $\sigma^{a}(\sigma^{b})^{-1} = \sigma^{a-b}$, et tout sous-groupe qui contient $\sigma$ contient ses puissances. Pour $x \in \llbracket 1\,,n \rrbracket$, l'ensemble $\{h(x) \mid h \in H\} = \{\sigma^{k}(x) \mid k \in \mathbb{Z}\}$ est donc l'orbite de $x$ sous $\sigma$ au sens du chapitre 17 (démonstration du théorème 1). Le sous-groupe $H$ est transitif si et seulement si l'orbite de $1$ est $\llbracket 1\,,n \rrbracket$ tout entier, c'est-à-dire si $\sigma$ n'a qu'une orbite, sur laquelle elle agit comme un cycle : 
    $$\boxed{\langle \sigma \rangle \text{ est transitif} \iff \sigma \text{ est un cycle de longueur } n}$$

    **2.** Un cycle de longueur $n$ s'écrit de façon unique $(1\ a_{2}\ \cdots\ a_{n})$ en le commençant par $1$, avec $a_{k} = \sigma^{k-1}(1)$ ; la liste $(a_{2}, \dots, a_{n})$ est une permutation de $\llbracket 2\,,n \rrbracket$, et toute telle liste définit un cycle de longueur $n$. Il y a donc $(n - 1)!$ cycles de longueur $n$ (théorème 1), et, la loi de $X_{n}$ étant uniforme, 
    $$\boxed{p_{n} = \frac{(n - 1)!}{n!} = \frac{1}{n}}$$
     Une permutation aléatoire n'engendre presque jamais un sous-groupe transitif quand $n$ est grand.

    **3. (a)** Notons $H$ le sous-groupe engendré par $X_{n}$ et $Y_{n}$, pour une issue fixée.

    Supposons $H$ non transitif : il existe $x$, $y$ tels que $h(x) \neq y$ pour tout $h \in H$. Soit $O$ l'ensemble des $h(x)$, pour $h \in H$ ; il contient $x = \mathrm{id}(x)$ et pas $y$. Pour $h \in H$, $X_{n}h \in H$, donc $X_{n}(O) \subset O$ ; comme $X_{n}$ est injective et $O$ fini, $X_{n}(O)$ a autant d'éléments que $O$, et $X_{n}(O) = O$. De même $Y_{n}(O) = O$. Le complémentaire $O' = \llbracket 1\,,n \rrbracket \setminus O$ vérifie aussi $X_{n}(O') = O'$ et $Y_{n}(O') = O'$, puisque $X_{n}$ et $Y_{n}$ sont des bijections de $\llbracket 1\,,n \rrbracket$. Les parties $O$ et $O'$ sont non vides, l'une contenant $x$ et l'autre $y$, et leurs cardinaux ont pour somme $n$ : l'une d'elles, que l'on note $A$, vérifie $1 \leqslant |A| \leqslant \frac{n}{2}$.

    Réciproquement, soit $A$ une telle partie. L'ensemble $K = \{g \in \mathfrak{S}_{n} \mid g(A) = A\}$ est un sous-groupe de $\mathfrak{S}_{n}$ : il contient $\mathrm{id}$, et si $g(A) = h(A) = A$, alors $h^{-1}(A) = A$ et $gh^{-1}(A) = A$. Il contient $X_{n}$ et $Y_{n}$, donc il contient $H$. Soit $x \in A$ et $y \notin A$, qui existe puisque $|A| \leqslant \frac{n}{2} < n$ : pour tout $h \in H$, $h(x) \in A$, donc $h(x) \neq y$, et $H$ n'est pas transitif. 
    $$\boxed{H \text{ non transitif} \iff \exists A \subset \llbracket 1\,,n \rrbracket,\ 1 \leqslant |A| \leqslant \tfrac{n}{2},\ X_{n}(A) = A \text{ et } Y_{n}(A) = A}$$

    **(b)** Une permutation $\sigma$ vérifie $\sigma(A) = A$ si et seulement si elle induit une permutation de $A$ et une permutation de $\llbracket 1\,,n \rrbracket \setminus A$ ; elle est déterminée par ce couple, et tout couple convient. Il y a donc $k!\,(n - k)!$ telles permutations, et 
    $$\boxed{\mathrm{P}\big(X_{n}(A) = A\big) = \frac{k!\,(n - k)!}{n!} = \binom{n}{k}^{-1}}$$

    **(c)** Par indépendance de $X_{n}$ et $Y_{n}$ (définition de la section 21.5.5, avec la partie $\{\sigma \mid \sigma(A) = A\}$ de $\mathfrak{S}_{n}$), $\mathrm{P}\big(X_{n}(A) = A, Y_{n}(A) = A\big) = \tbinom{n}{k}^{-2}$ pour $|A| = k$. Par la question (a), l'événement « $H$ n'est pas transitif » est la réunion de ces événements, sur les parties $A$ telles que $1 \leqslant |A| \leqslant \frac{n}{2}$. La sous-additivité (proposition 7 (iv)), en regroupant les $\tbinom{n}{k}$ parties de cardinal $k$, donne 
    $$1 - q_{n} \leqslant \sum_{k=1}^{\lfloor n/2 \rfloor} \binom{n}{k}\binom{n}{k}^{-2}, \qquad \boxed{1 - q_{n} \leqslant \sum_{k=1}^{\lfloor n/2 \rfloor} \binom{n}{k}^{-1}}$$
     Soit $n \geqslant 4$. Le rapport $\tbinom{n}{k+1}\big/\tbinom{n}{k} = \frac{n - k}{k + 1}$ est au moins égal à $1$ pour $k \leqslant \frac{n - 1}{2}$ : les coefficients binomiaux croissent jusqu'à l'indice $\lfloor\frac{n}{2}\rfloor$, et $\tbinom{n}{k} \geqslant \tbinom{n}{2} = \frac{n(n - 1)}{2}$ pour $2 \leqslant k \leqslant \lfloor\frac{n}{2}\rfloor$. Il y a au plus $\frac{n}{2}$ tels indices, d'où 
    $$0 \leqslant 1 - q_{n} \leqslant \frac{1}{n} + \frac{n}{2} \times \frac{2}{n(n - 1)} = \frac{1}{n} + \frac{1}{n - 1}, \qquad\text{donc}\qquad \boxed{q_{n} \xrightarrow[n \to +\infty]{} 1}$$
     L'énumération exhaustive des couples donne $q_{2} = \frac{3}{4}$, $q_{3} = \frac{13}{18}$, $q_{4} = \frac{71}{96}$ et $q_{5} = \frac{461}{600}$, en accord avec la majoration ✓.

    *À retenir.* Une permutation seule engendre un sous-groupe transitif avec une probabilité $\frac{1}{n}$ qui tend vers $0$ ; deux permutations le font avec une probabilité qui tend vers $1$. La méthode est typique : on caractérise le mauvais événement comme une réunion d'événements simples, puis la sous-additivité, grossière mais sans hypothèse, suffit à montrer qu'il est rare.
- id: "ma-21-70"
  feuille: "f-ma-21"
  numero: 70
  partie: "Espérance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espérance, variables aléatoires]
  noeuds: [p-esperance, p-variables]
  notions: [esperance, variable-aleatoire]
  page_enonce: 18
  page_corrige: 66
  enonce: |
    **1.** Soit $X$ une variable aléatoire de loi $\mathcal{U}(\llbracket 1\,,n \rrbracket)$. Calculer $\mathrm{E}\big((X - 1)^{2}\big)$ et $\mathrm{E}\big(\mathrm{e}^{X}\big)$.

    **2.** Soit $X$ une variable aléatoire de loi $\mathcal{B}(n,p)$, avec $p \in \left]0\,,1\right]$. Calculer l'espérance de $Y = \dfrac{1}{X + 1}$. On pourra utiliser l'égalité $\dfrac{1}{k + 1}\dbinom{n}{k} = \dfrac{1}{n + 1}\dbinom{n + 1}{k + 1}$. A-t-on $\mathrm{E}(Y) = \dfrac{1}{\mathrm{E}(X) + 1}$ ?
  corrige: |
    **1.** Par la formule de transfert (théorème 10), puis la somme des carrés du chapitre 3, en posant $j = k - 1$, 
    $$\mathrm{E}\big((X - 1)^{2}\big) = \frac{1}{n}\sum_{k=1}^{n} (k - 1)^{2} = \frac{1}{n}\sum_{j=0}^{n-1} j^{2} = \frac{1}{n} \cdot \frac{(n - 1)n(2n - 1)}{6}, \qquad \boxed{\mathrm{E}\big((X - 1)^{2}\big) = \frac{(n - 1)(2n - 1)}{6}}$$
     De même, avec la somme géométrique de raison $\mathrm{e} \neq 1$, 
    $$\boxed{\mathrm{E}\big(\mathrm{e}^{X}\big) = \frac{1}{n}\sum_{k=1}^{n} \mathrm{e}^{k} = \frac{\mathrm{e}\,(\mathrm{e}^{n} - 1)}{n(\mathrm{e} - 1)}}$$
     Pour $n = 1$, on retrouve $\mathrm{E}\big((X - 1)^{2}\big) = 0$ et $\mathrm{E}(\mathrm{e}^{X}) = \mathrm{e}$, puisque $X = 1$ ✓.

    **2.** On note $q = 1 - p$. Par la formule de transfert, l'égalité de l'énoncé, puis le changement d'indice $j = k + 1$, 
    $$\mathrm{E}(Y) = \sum_{k=0}^{n} \frac{1}{k + 1}\binom{n}{k}p^{k}q^{n-k} = \frac{1}{n + 1}\sum_{k=0}^{n} \binom{n + 1}{k + 1}p^{k}q^{n-k} = \frac{1}{(n + 1)p}\sum_{j=1}^{n+1} \binom{n + 1}{j}p^{j}q^{n+1-j}.$$
     La dernière somme est celle de la formule du binôme (théorème 3), privée de son terme d'indice $j = 0$, qui vaut $q^{n+1}$ : 
    $$\boxed{\mathrm{E}\Big(\frac{1}{X + 1}\Big) = \frac{1 - (1 - p)^{n+1}}{(n + 1)p}}$$
     L'égalité de l'énoncé est la formule du pion (chapitre 3, proposition 9) : 
    $$\frac{1}{k + 1}\binom{n}{k} = \frac{n!}{(k + 1)!\,(n - k)!} = \frac{1}{n + 1}\binom{n + 1}{k + 1}.$$

    On n'a pas $\mathrm{E}(Y) = \frac{1}{\mathrm{E}(X) + 1}$ en général. Pour $n = 1$ et $p = \frac{1}{2}$, on trouve $\mathrm{E}(Y) = \frac{3}{4}$ et $\frac{1}{\mathrm{E}(X) + 1} = \frac{2}{3}$. Plus précisément, posons $m = \mathrm{E}(X) = np$. Pour $x > -1$, une mise au même dénominateur donne 
    $$\frac{1}{x + 1} - \frac{1}{m + 1} + \frac{x - m}{(m + 1)^{2}} = \frac{(x - m)^{2}}{(x + 1)(m + 1)^{2}} \geqslant 0 :$$
     la fonction $x \mapsto \frac{1}{x + 1}$, convexe, est au-dessus de sa tangente en $m$ (chapitre 9). En appliquant cette inégalité à $X$ et en prenant l'espérance (théorème 9 (i) et (ii)), le terme $\frac{\mathrm{E}(X) - m}{(m + 1)^{2}}$ disparaît, et 
    $$\boxed{\mathrm{E}\Big(\frac{1}{X + 1}\Big) \geqslant \frac{1}{\mathrm{E}(X) + 1}}$$
     avec égalité si et seulement si $\mathrm{E}\Big(\frac{(X - m)^{2}}{(X + 1)(m + 1)^{2}}\Big) = 0$, c'est-à-dire, la variable étant positive, si $\mathrm{P}(X = m) = 1$. Pour $p \in \left]0\,,1\right[$, la variable $X$ n'est pas constante, puisque $\mathrm{P}(X = 0) = q^{n}$ et $\mathrm{P}(X = n) = p^{n}$ sont non nuls : l'inégalité est stricte. L'égalité n'a lieu que pour $p = 1$, où $X = n$.

    *Piège.* C'est la mise en garde qui suit le théorème 10 : $\mathrm{E}\big(f(X)\big) \neq f\big(\mathrm{E}(X)\big)$ dès que $f$ n'est pas affine. L'erreur la plus répandue est d'écrire $\mathrm{E}\big(\frac{1}{X}\big) = \frac{1}{\mathrm{E}(X)}$ ; l'inégalité de Jensen du chapitre 9 (proposition 7), appliquée avec les coefficients $\mathrm{P}(X = x)$, donne le sens de l'écart pour une fonction convexe.
- id: "ma-21-71"
  feuille: "f-ma-21"
