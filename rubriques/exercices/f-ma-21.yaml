  enonce: |
    *La loi hypergéométrique.* Une urne contient $n$ boules, dont $p$ sont blanches, avec $1 \leqslant p \leqslant n - 1$. On tire simultanément $s \in \llbracket 1\,,n \rrbracket$ boules, et l'on note $X$ le nombre de boules blanches tirées.

    **1.** Déterminer la loi de $X$.

    **2.** On numérote les boules blanches de $1$ à $p$ et l'on note $A_{k}$ l'événement « la boule blanche numéro $k$ est tirée ». Exprimer $X$ à l'aide des indicatrices $\mathbf{1}_{A_{k}}$, et en déduire $\mathrm{E}(X)$ puis $\mathrm{V}(X)$.

    **3.** Comparer avec l'espérance et la variance de la loi $\mathcal{B}(s,\frac{p}{n})$, et interpréter lorsque $n$ et $p$ sont grands, avec $\frac{p}{n}$ fixé.
  corrige: |
    On numérote les boules de $1$ à $n$, les blanches portant les numéros $1$ à $p$, et l'on prend pour univers l'ensemble des parties à $s$ éléments de $\llbracket 1\,,n \rrbracket$, muni de la probabilité uniforme : il a $\tbinom{n}{s}$ éléments.

    **1.** Une partie qui contient exactement $k$ boules blanches est formée de $k$ blanches choisies parmi $p$ et de $s - k$ noires choisies parmi $n - p$. Par le lemme des bergers et le théorème 2, 
    $$\boxed{\mathrm{P}(X = k) = \frac{\binom{p}{k}\binom{n - p}{s - k}}{\binom{n}{s}}, \qquad k \in \llbracket 0\,,s \rrbracket}$$
     avec la convention $\tbinom{a}{j} = 0$ si $j > a$ ; la probabilité est non nulle exactement lorsque $k \leqslant \min(p, s)$ et $k \geqslant \max(0, s - n + p)$. La somme de ces probabilités vaut $1$ : c'est encore la formule de Vandermonde.

    **2.** On a $X = \sum_{k=1}^{p} \mathbf{1}_{A_{k}}$. Une partie favorable à $A_{k}$ contient la boule $k$ et $s - 1$ des $n - 1$ autres, donc $\mathrm{P}(A_{k}) = \tbinom{n - 1}{s - 1}\big/\tbinom{n}{s} = \frac{s}{n}$, et 
    $$\boxed{\mathrm{E}(X) = \frac{ps}{n}}$$
     Pour $k \neq \ell$, de même, $\mathrm{P}(A_{k} \cap A_{\ell}) = \tbinom{n - 2}{s - 2}\big/\tbinom{n}{s} = \frac{s(s - 1)}{n(n - 1)}$, ce qui reste vrai pour $s = 1$, et 
    $$\operatorname{Cov}(\mathbf{1}_{A_{k}}, \mathbf{1}_{A_{\ell}}) = \frac{s(s - 1)}{n(n - 1)} - \frac{s^{2}}{n^{2}} = -\frac{s(n - s)}{n^{2}(n - 1)}.$$
     Par le théorème 13, avec $p$ variances $\frac{s}{n}\big(1 - \frac{s}{n}\big)$ et $p(p - 1)$ covariances, 
    $$\mathrm{V}(X) = p\,\frac{s(n - s)}{n^{2}} - p(p - 1)\frac{s(n - s)}{n^{2}(n - 1)} = \frac{ps(n - s)}{n^{2}} \cdot \frac{n - p}{n - 1}, \qquad \boxed{\mathrm{V}(X) = s\,\frac{p}{n}\Big(1 - \frac{p}{n}\Big)\frac{n - s}{n - 1}}$$
     Ces formules ont été vérifiées par énumération sur cinq urnes ✓. Les covariances sont négatives : tirer une boule blanche donnée rend les autres un peu moins probables, puisque le nombre de places est fixé.

    **3.** Pour la loi $\mathcal{B}(s,\frac{p}{n})$, qui est celle du nombre de boules blanches en $s$ tirages *avec remise* (théorème 8), l'espérance vaut $s\frac{p}{n}$ et la variance $s\frac{p}{n}\big(1 - \frac{p}{n}\big)$ (propositions 19 et 21). Les espérances sont égales, et 
    $$\boxed{\mathrm{V}(X) = \frac{n - s}{n - 1}\,\mathrm{V}(B), \qquad B \sim \mathcal{B}(s,\tfrac{p}{n})}$$
     Le facteur $\frac{n - s}{n - 1}$ est au plus égal à $1$ : un tirage sans remise est moins dispersé qu'un tirage avec remise, et il ne l'est plus du tout pour $s = n$, où l'on tire toute l'urne et $X = p$. Lorsque $n$ et $p$ tendent vers $+\infty$, avec $\frac{p}{n} = \theta$ et $s$ fixés, ce facteur tend vers $1$. La loi elle-même converge : pour $k \in \llbracket 0\,,s \rrbracket$, en développant les coefficients binomiaux, 
    $$\mathrm{P}(X = k) = \binom{s}{k}\,\frac{p(p - 1)\cdots(p - k + 1)\,(n - p)\cdots(n - p - s + k + 1)}{n(n - 1)\cdots(n - s + 1)} \xrightarrow[n \to +\infty]{} \binom{s}{k}\theta^{k}(1 - \theta)^{s-k},$$
     chacun des $k$ premiers facteurs, divisé par le facteur correspondant du dénominateur, tendant vers $\theta$, et chacun des $s - k$ suivants vers $1 - \theta$. Dans une urne très grande, tirer sans remise ou avec remise revient presque au même : c'est ce qui justifie l'usage de la loi binomiale dans les sondages.
- id: "ma-21-90"
