  enonce: |
    Soit $n \geqslant 2$ et $E$ une partie aléatoire de $\llbracket 1\,,n \rrbracket$, de loi uniforme sur $\mathcal{P}(\llbracket 1\,,n \rrbracket)$. Pour $i \in \llbracket 1\,,n \rrbracket$, on note $A_{i}$ l'événement $(i \in E)$.

    **1.** Déterminer la loi des indicatrices $\mathbf{1}_{A_{i}}$, et montrer qu'elles sont mutuellement indépendantes.

    **2.** Exprimer $N = |E|$ à l'aide de ces indicatrices, et en déduire sa loi, son espérance et sa variance.

    **3.** On pose $T = \sum_{i \in E} i$, avec $T = 0$ si $E$ est vide. Exprimer $T$ à l'aide des indicatrices, puis calculer son espérance et sa variance.
  corrige: |
    La loi de $E$ est uniforme sur $\mathcal{P}(\llbracket 1\,,n \rrbracket)$, qui a $2^{n}$ éléments (proposition 3) : $\mathrm{P}(E = S) = \frac{1}{2^{n}}$ pour toute partie $S$.

    **1.** Les parties qui contiennent $i$ s'écrivent $\{i\} \cup S'$, avec $S' \subset \llbracket 1\,,n \rrbracket \setminus \{i\}$ ; il y en a $2^{n-1}$, donc $\mathrm{P}(A_{i}) = \frac{1}{2}$ et $\boxed{\mathbf{1}_{A_{i}} \sim \mathcal{B}(\tfrac{1}{2})}$. Soit $(\varepsilon_{1}, \dots, \varepsilon_{n}) \in \{0, 1\}^{n}$. L'application $S \mapsto \mathbf{1}_{S}$ est une bijection de $\mathcal{P}(\llbracket 1\,,n \rrbracket)$ sur $\{0, 1\}^{n}$ (démonstration de la proposition 3) : il existe une unique partie $S$ telle que $\mathbf{1}_{S}(i) = \varepsilon_{i}$ pour tout $i$, et 
    $$\mathrm{P}(\mathbf{1}_{A_{1}} = \varepsilon_{1}, \dots, \mathbf{1}_{A_{n}} = \varepsilon_{n}) = \mathrm{P}(E = S) = \frac{1}{2^{n}} = \prod_{i=1}^{n} \mathrm{P}(\mathbf{1}_{A_{i}} = \varepsilon_{i}).$$
     Par la proposition 15, $\boxed{\text{les indicatrices } \mathbf{1}_{A_{1}}, \dots, \mathbf{1}_{A_{n}} \text{ sont mutuellement indépendantes}}$. Choisir une partie au hasard revient à décider, pour chaque élément, à pile ou face, s'il en fait partie.

    **2.** On a $N = \sum_{i=1}^{n} \mathbf{1}_{A_{i}}$. Par le théorème 8 et les propositions 19 et 21, 
    $$\boxed{N \sim \mathcal{B}(n,\tfrac{1}{2}), \qquad \mathrm{E}(N) = \frac{n}{2}, \qquad \mathrm{V}(N) = \frac{n}{4}}$$
     On retrouve que $\mathcal{P}(\llbracket 1\,,n \rrbracket)$ contient $\tbinom{n}{k}$ parties à $k$ éléments.

    **3.** Pour toute issue, $T = \sum_{i=1}^{n} i\,\mathbf{1}_{A_{i}}$, y compris si $E$ est vide. Par linéarité, puis par le théorème 13, les variables $i\,\mathbf{1}_{A_{i}}$ étant mutuellement indépendantes (proposition 16), et par le théorème 11 (ii), 
    $$\boxed{\mathrm{E}(T) = \frac{1}{2}\sum_{i=1}^{n} i = \frac{n(n + 1)}{4}}, \qquad \boxed{\mathrm{V}(T) = \sum_{i=1}^{n} i^{2}\,\frac{1}{4} = \frac{n(n + 1)(2n + 1)}{24}}$$
     Ces valeurs ont été vérifiées par énumération des $2^{n}$ parties pour $n \leqslant 6$ ✓. L'espérance est la moitié de la somme totale $\frac{n(n + 1)}{2}$, ce que l'on voit aussi par symétrie : $S \mapsto \llbracket 1\,,n \rrbracket \setminus S$ est une bijection qui échange $T$ et $\frac{n(n + 1)}{2} - T$.
