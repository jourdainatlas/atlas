  noeuds: [p-independance, p-variables, p-espace]
  notions: [probabilite-conditionnelle, independance, variable-aleatoire]
  page_enonce: 14
  page_corrige: 50
  enonce: |
    *La loi de succession de Laplace.* Soit $r \geqslant 1$ et $n \geqslant 1$ deux entiers. On dispose de $r + 1$ urnes numérotées de $0$ à $r$ ; l'urne numéro $k$ contient $k$ boules rouges et $r - k$ boules blanches. On choisit une urne au hasard, puis on effectue $n + 1$ tirages avec remise dans cette urne ; sachant l'urne choisie, les tirages sont mutuellement indépendants. On note $R_{j}$ l'événement « la $j$-ième boule tirée est rouge ».

    **1.** Calculer $\mathrm{P}_{R_{1}}(R_{2})$ puis, pour $n \geqslant 2$, $p_{n,r} = \mathrm{P}(R_{n+1} \mid R_{1} \cap \cdots \cap R_{n})$.

    **2.** Déterminer la limite de $p_{n,r}$ quand $r$ tend vers $+\infty$, à l'aide du chapitre 18. Comparer avec $\mathrm{P}(R_{1})$.
  corrige: |
    *Modèle.* On note $U$ le numéro de l'urne choisie, de loi uniforme sur $\llbracket 0\,,r \rrbracket$. Sachant $(U = k)$, les tirages sont indépendants et chacun donne une boule rouge avec la probabilité $\frac{k}{r}$ ; pour $m \in \llbracket 1\,,n + 1 \rrbracket$, on a donc $\mathrm{P}_{(U = k)}(R_{1} \cap \cdots \cap R_{m}) = \big(\frac{k}{r}\big)^{m}$. La formule des probabilités totales, avec le système complet $\big((U = k)\big)_{0 \leqslant k \leqslant r}$, donne 
    $$\pi_{m} = \mathrm{P}(R_{1} \cap \cdots \cap R_{m}) = \frac{1}{r + 1}\sum_{k=0}^{r} \Big(\frac{k}{r}\Big)^{m} = \frac{s_{m}}{(r + 1)\,r^{m}}, \qquad s_{m} = \sum_{k=0}^{r} k^{m}.$$
     Ces probabilités sont strictement positives, grâce au terme $k = r$.

    **1.** Avec $s_{1} = \frac{r(r + 1)}{2}$ et $s_{2} = \frac{r(r + 1)(2r + 1)}{6}$ (chapitre 3), on obtient $\pi_{1} = \frac{1}{2}$ et $\pi_{2} = \frac{2r + 1}{6r}$, d'où 
    $$\boxed{\mathrm{P}(R_{1}) = \frac{1}{2}, \qquad \mathrm{P}_{R_{1}}(R_{2}) = \frac{\mathrm{P}(R_{1} \cap R_{2})}{\mathrm{P}(R_{1})} = \frac{2r + 1}{3r}}$$
     Pour $n \geqslant 2$, la définition de la probabilité conditionnelle donne de même 
    $$\boxed{p_{n,r} = \mathrm{P}(R_{n+1} \mid R_{1} \cap \cdots \cap R_{n}) = \frac{\pi_{n+1}}{\pi_{n}} = \frac{s_{n+1}}{r\,s_{n}} = \frac{\sum_{k=0}^{r} k^{n+1}}{r\sum_{k=0}^{r} k^{n}}}$$
     formule qui redonne $\mathrm{P}_{R_{1}}(R_{2})$ pour $n = 1$. Pour $r = 3$ et $n = 2$, on trouve $p_{2,3} = \frac{36}{3 \times 14} = \frac{6}{7}$.

    **2.** Pour $m \geqslant 1$, le terme d'indice $k = 0$ est nul, et 
    $$\frac{s_{m}}{r^{m+1}} = \frac{1}{r}\sum_{k=1}^{r} \Big(\frac{k}{r}\Big)^{m}$$
     est la somme de Riemann $R'_{r}(f)$ de la fonction continue $f : t \mapsto t^{m}$ sur $[0\,,1]$, pour la subdivision régulière en $r$ intervalles. Par le théorème 9 du chapitre 18, elle tend vers $\int_{0}^{1} t^{m}\,\mathrm{d} t = \frac{1}{m + 1}$ quand $r$ tend vers $+\infty$. On écrit alors 
    $$p_{n,r} = \frac{s_{n+1}/r^{n+2}}{s_{n}/r^{n+1}} \xrightarrow[r \to +\infty]{} \frac{1/(n + 2)}{1/(n + 1)}, \qquad \boxed{\lim_{r \to +\infty} p_{n,r} = \frac{n + 1}{n + 2}}$$
     Pour $r = 1\,000$ et $n = 3$, on trouve $p_{3,1000} \approx 0{,}8004$, contre $\frac{4}{5}$ ✓.

    *Comparaison.* On a $\mathrm{P}(R_{1}) = \frac{1}{2}$, alors que la probabilité de tirer une boule rouge après $n$ boules rouges vaut à peu près $\frac{n + 1}{n + 2}$, qui croît vers $1$. Les tirages ne sont pas indépendants : ils le sont sachant l'urne, mais l'urne est inconnue, et chaque boule rouge rend plus probables les urnes riches en boules rouges. C'est la loi de succession de Laplace : n'ayant aucune information sur la proportion de boules rouges, sinon qu'elle est « uniforme », on estime la probabilité d'un nouveau succès après $n$ succès par $\frac{n + 1}{n + 2}$, et non par $1$.

    *Piège.* L'erreur la plus répandue est de croire que les $R_{j}$ sont indépendants, puisque les tirages ont lieu avec remise, et d'en conclure que $p_{n,r} = \mathrm{P}(R_{1}) = \frac{1}{2}$. L'indépendance sachant $(U = k)$, pour chaque $k$, n'entraîne pas l'indépendance sous $\mathrm{P}$ : déjà pour $n = 1$, $\mathrm{P}_{R_{1}}(R_{2}) = \frac{2r + 1}{3r} > \frac{1}{2}$. L'exercice 65 retrouvera exactement le nombre $\frac{n + 1}{n + 2}$ avec l'urne de Pólya.
- id: "ma-21-54"
