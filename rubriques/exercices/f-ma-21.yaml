  page_enonce: 22
  page_corrige: 81
  enonce: |
    Soit $1 \leqslant r \leqslant n$ deux entiers. On choisit une partie $Y$ de $\llbracket 1\,,n \rrbracket$ à $r$ éléments, toutes les parties à $r$ éléments étant également probables, et l'on pose $X = \max Y$. On peut aussi voir $X$ comme la plus grande valeur obtenue en découvrant les $r$ premières cartes d'un paquet de $n$ cartes numérotées de $1$ à $n$, mélangé au hasard.

    **1.** Déterminer la loi de $X$. Quelle identité entre coefficients binomiaux obtient-on ? La comparer à la formule de l'exercice 35 de la feuille du chapitre 3.

    **2.** Calculer $\mathrm{E}(X)$. On pourra utiliser l'égalité $k\binom{k - 1}{r - 1} = r\binom{k}{r}$.

    **3.** Calculer $\mathrm{V}(X)$.
  corrige: |
    L'univers est l'ensemble des parties à $r$ éléments de $\llbracket 1\,,n \rrbracket$, muni de la probabilité uniforme. Pour le paquet de cartes, chaque ensemble de $r$ premières cartes correspond à $r!\,(n - r)!$ ordres du paquet, le même nombre pour tous (lemme des bergers) : l'ensemble des $r$ premières cartes suit bien la loi uniforme sur les parties à $r$ éléments, et les deux descriptions donnent la même loi pour $X$.

    **1.** La variable $X$ prend ses valeurs dans $\llbracket r\,,n \rrbracket$. Pour $k \in \llbracket r\,,n \rrbracket$, une partie $Y$ vérifie $\max Y = k$ si et seulement si $k \in Y$ et $Y \setminus \{k\}$ est une partie à $r - 1$ éléments de $\llbracket 1\,,k - 1 \rrbracket$ ; l'application $Y \mapsto Y \setminus \{k\}$ est une bijection entre ces parties et celles à $r - 1$ éléments de $\llbracket 1\,,k - 1 \rrbracket$ : 
    $$\boxed{\mathrm{P}(X = k) = \frac{\binom{k - 1}{r - 1}}{\binom{n}{r}}, \qquad k \in \llbracket r\,,n \rrbracket}$$
     La somme de ces probabilités vaut $1$ (proposition 11), d'où l'identité 
    $$\boxed{\sum_{k=r}^{n} \binom{k - 1}{r - 1} = \binom{n}{r}}$$
     C'est la formule de la crosse de hockey de l'exercice 35 de la feuille du chapitre 3, $\sum_{k=p}^{N} \tbinom{k}{p} = \tbinom{N + 1}{p + 1}$, avec $p = r - 1$ et $N = n - 1$. Le chapitre 3 l'obtenait par télescopage de la formule de Pascal (proposition 10) ; elle est ici démontrée en comptant les parties à $r$ éléments selon leur plus grand élément.

    **2.** Avec l'égalité suggérée, qui est la formule du pion, puis la crosse de hockey avec $p = r$ et $N = n$, 
    $$\mathrm{E}(X) = \frac{1}{\binom{n}{r}}\sum_{k=r}^{n} k\binom{k - 1}{r - 1} = \frac{r}{\binom{n}{r}}\sum_{k=r}^{n} \binom{k}{r} = r\,\frac{\binom{n + 1}{r + 1}}{\binom{n}{r}}, \qquad \boxed{\mathrm{E}(X) = \frac{r(n + 1)}{r + 1}}$$
     Pour $r = 1$, on retrouve l'espérance $\frac{n + 1}{2}$ de la loi uniforme, et pour $r = n$, $\mathrm{E}(X) = n$. Tout se passe comme si les $r$ nombres choisis découpaient $\llbracket 0\,,n + 1 \rrbracket$ en $r + 1$ intervalles de même longueur moyenne $\frac{n + 1}{r + 1}$ : le maximum se trouve en moyenne à une telle longueur de $n + 1$, puisque $\mathrm{E}(X) = (n + 1) - \frac{n + 1}{r + 1}$.

    **3.** On calcule $\mathrm{E}\big(X(X + 1)\big)$. Par la formule du pion, appliquée deux fois, 
    $$k(k + 1)\binom{k - 1}{r - 1} = r(k + 1)\binom{k}{r} = r(r + 1)\binom{k + 1}{r + 1},$$
     et par la crosse de hockey, 
    $$\mathrm{E}\big(X(X + 1)\big) = \frac{r(r + 1)}{\binom{n}{r}}\sum_{k=r}^{n} \binom{k + 1}{r + 1} = r(r + 1)\frac{\binom{n + 2}{r + 2}}{\binom{n}{r}} = \frac{r(n + 1)(n + 2)}{r + 2}.$$
     Par la formule de König-Huygens, $\mathrm{V}(X) = \mathrm{E}\big(X(X + 1)\big) - \mathrm{E}(X) - \mathrm{E}(X)^{2}$, et une réduction au même dénominateur donne 
    $$\boxed{\mathrm{V}(X) = \frac{r(n - r)(n + 1)}{(r + 1)^{2}(r + 2)}}$$
     Pour $r = 1$, on retrouve la variance $\frac{n^{2} - 1}{12}$ de la loi uniforme (proposition 21), et pour $r = n$, $\mathrm{V}(X) = 0$. La loi, l'espérance et la variance ont été vérifiées par énumération pour $n \leqslant 8$ et tous les $r$, ainsi que l'équivalence avec la version des cartes pour $n \leqslant 5$ ✓.

    *À retenir.* Pour une variable dont la loi s'écrit avec $\tbinom{k - 1}{r - 1}$, on calcule les espérances de $X$, de $X(X + 1)$, …, dont les coefficients se simplifient par la formule du pion, plutôt que $\mathrm{E}(X^{2})$ ; c'est la démarche de la proposition 21 pour la loi binomiale, avec $\mathrm{E}\big(X(X - 1)\big)$.
- id: "ma-21-91"
  feuille: "f-ma-21"
  numero: 91
  partie: "Variance et covariance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variance et covariance, variables aléatoires, espérance, variance, tirages]
  noeuds: [p-esperance, p-variables, p-espace]
  notions: [variance, covariance, variable-aleatoire, esperance]
  page_enonce: 22
  page_corrige: 82
  enonce: |
    On tire successivement et sans remise les boules d'une urne qui contient $n$ boules rouges et $n$ boules noires, tous les ordres de sortie étant également probables, jusqu'à ce que toutes les boules rouges soient sorties. On note $X$ le nombre de boules noires qui restent alors dans l'urne.

    **1.** Déterminer la loi de $X$.

    **2.** Calculer l'espérance de $X$. On pourra introduire, pour chaque boule noire, l'événement « elle sort après toutes les boules rouges ».

    **3.** Calculer la variance de $X$.
  corrige: |
    On numérote les boules, et l'on prend pour univers l'ensemble des $(2n)!$ ordres de sortie, muni de la probabilité uniforme. L'ensemble $R$ des rangs de sortie des boules rouges est une partie à $n$ éléments de $\llbracket 1\,,2n \rrbracket$ ; chacune correspond à $n!\,n!$ ordres, donc $R$ suit la loi uniforme sur les parties à $n$ éléments de $\llbracket 1\,,2n \rrbracket$.

    **1.** La dernière boule rouge sort au rang $\max R$, et il reste alors $X = 2n - \max R$ boules noires. Pour $k \in \llbracket 0\,,n \rrbracket$, $(X = k)$ est réalisé si et seulement si la boule de rang $2n - k$ est rouge et les $n - 1$ autres rouges ont des rangs dans $\llbracket 1\,,2n - k - 1 \rrbracket$, d'où 
    $$\boxed{\mathrm{P}(X = k) = \frac{\binom{2n - k - 1}{n - 1}}{\binom{2n}{n}}, \qquad k \in \llbracket 0\,,n \rrbracket}$$
     C'est l'exercice 90 avec $r = n$ et $2n$ au lieu de $n$, appliqué à $\max R = 2n - X$.

    **2.** Pour chaque boule noire $b$, soit $B_{b}$ l'événement « $b$ sort après toutes les boules rouges ». Alors $X = \sum_{b} \mathbf{1}_{B_{b}}$, somme de $n$ indicatrices. Considérons les $n + 1$ boules formées des rouges et de $b$. Pour une boule rouge $\rho$, l'échange des rangs de $b$ et de $\rho$ est une bijection de l'univers, qui préserve la probabilité uniforme et transforme $B_{b}$ en l'événement « $\rho$ sort après les autres boules de ce groupe ». Ces $n + 1$ événements, un par boule du groupe, forment un système complet et ont la même probabilité, comme dans l'exemple des records de la section 21.6.3 : 
    $$\mathrm{P}(B_{b}) = \frac{1}{n + 1}, \qquad \boxed{\mathrm{E}(X) = \frac{n}{n + 1}}$$
     Il reste en moyenne moins d'une boule noire dans l'urne, quel que soit $n$. On retrouve ce résultat avec l'exercice 90 : $\mathrm{E}(X) = 2n - \frac{n(2n + 1)}{n + 1} = \frac{n}{n + 1}$ ✓.

    **3.** Soit $b \neq b'$ deux boules noires. L'événement $B_{b} \cap B_{b'}$ est réalisé si et seulement si, parmi les $n + 2$ boules formées des rouges, de $b$ et de $b'$, les deux dernières à sortir sont $b$ et $b'$. Le même argument d'échange montre que la paire des deux dernières boules de ce groupe est uniforme parmi les $\tbinom{n + 2}{2}$ paires possibles : $\mathrm{P}(B_{b} \cap B_{b'}) = \frac{2}{(n + 1)(n + 2)}$, et 
    $$\operatorname{Cov}(\mathbf{1}_{B_{b}}, \mathbf{1}_{B_{b'}}) = \frac{2}{(n + 1)(n + 2)} - \frac{1}{(n + 1)^{2}} = \frac{n}{(n + 1)^{2}(n + 2)}.$$
     Par le théorème 13, avec $n$ variances $\frac{1}{n + 1} \cdot \frac{n}{n + 1}$ et $n(n - 1)$ covariances, 
    $$\mathrm{V}(X) = \frac{n^{2}}{(n + 1)^{2}} + \frac{n^{2}(n - 1)}{(n + 1)^{2}(n + 2)}, \qquad \boxed{\mathrm{V}(X) = \frac{n^{2}(2n + 1)}{(n + 1)^{2}(n + 2)}}$$
     ce qui coïncide avec la variance de l'exercice 90 pour $r = n$ et $2n$ boules ✓. La loi, l'espérance et la variance ont été vérifiées par énumération pour $n \leqslant 5$, et $\mathrm{P}(B_{b} \cap B_{b'})$ sur les $720$ ordres de sortie pour $n = 3$. Quand $n$ tend vers $+\infty$, $\mathrm{E}(X) \to 1$ et $\mathrm{V}(X) \to 2$.

    *Piège.* Les événements $B_{b}$ ne sont pas indépendants, et leurs covariances sont positives : si une boule noire sort après toutes les rouges, c'est que la dernière rouge est sortie tôt, ce qui favorise les autres noires. L'erreur la plus répandue est d'écrire $\mathrm{V}(X) = n\frac{1}{n + 1}\big(1 - \frac{1}{n + 1}\big)$, comme pour une loi binomiale.
- id: "ma-21-92"
  feuille: "f-ma-21"
  numero: 92
  partie: "Variance et covariance"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [variance et covariance, indépendance, variables aléatoires, loi uniforme, tirages]
  noeuds: [p-esperance, p-independance, p-variables, p-espace]
  notions: [variance, covariance, independance, variable-aleatoire]
  page_enonce: 22
  page_corrige: 83
  enonce: |
    On rappelle que $\sum_{k=1}^{n} k^{3} = \frac{n^{2}(n + 1)^{2}}{4}$. Soit $N \geqslant 2$. Une urne contient $N - 2$ boules blanches et $2$ boules noires. On tire successivement et sans remise les $N$ boules de l'urne. On note $X_{1}$ le numéro du tirage qui donne la première boule noire, et $X_{2}$ le numéro de celui qui donne la seconde.

    **1.** Proposer un espace probabilisé fini qui modélise cette expérience.

    **2.** Montrer que, pour $i$, $j \in \llbracket 1\,,N \rrbracket$, on a $\mathrm{P}(X_{1} = i, X_{2} = j) = \dfrac{2}{N(N - 1)}$ si $i < j$, et $0$ sinon. En déduire les lois de $X_{1}$ et de $X_{2}$. Ces variables sont-elles indépendantes ?

    **3.** **(a)** Montrer que $N + 1 - X_{2}$ a la même loi que $X_{1}$.

    **(b)** Déterminer la loi de $X_{2} - X_{1}$ et la comparer à celle de $X_{1}$.

    **(c)** Calculer $\mathrm{E}(X_{1})$ et $\mathrm{E}(X_{2})$.

    **(d)** Montrer que $\mathrm{V}(X_{1}) = \mathrm{V}(X_{2})$, puis que $2\operatorname{Cov}(X_{1}, X_{2}) = \mathrm{V}(X_{1})$.

    **4.** Calculer $\mathrm{V}(X_{1})$, puis $\operatorname{Cov}(X_{1}, X_{2})$.

    **5.** Soit $X$ et $Y$ deux variables indépendantes de loi uniforme sur $\llbracket 1\,,N \rrbracket$. On note $D$ l'événement $(X \neq Y)$, et $Z_{1} = \min(X, Y)$, $Z_{2} = \max(X, Y)$. Calculer $\mathrm{P}(D)$, puis $\mathrm{P}_{D}(Z_{1} = i, Z_{2} = j)$ pour $i$, $j \in \llbracket 1\,,N \rrbracket$, et comparer avec la question 2.
  corrige: |
    **1.** On numérote les boules. Les $N!$ ordres de sortie sont équiprobables ; l'ensemble des rangs des deux boules noires, partie à $2$ éléments de $\llbracket 1\,,N \rrbracket$, correspond à $2!\,(N - 2)!$ ordres, le même nombre pour toutes les parties. On peut donc prendre pour univers 
    $$\boxed{\Omega = \big\{\{i, j\} \ \big|\ 1 \leqslant i < j \leqslant N\big\}, \text{ muni de la probabilité uniforme, } |\Omega| = \binom{N}{2}}$$
     avec $X_{1}(\{i, j\}) = i$ et $X_{2}(\{i, j\}) = j$ lorsque $i < j$.

    **2.** Pour $i < j$, l'événement $(X_{1} = i, X_{2} = j)$ est le singleton $\{\{i, j\}\}$, et pour $i \geqslant j$ il est vide : 
    $$\boxed{\mathrm{P}(X_{1} = i, X_{2} = j) = \frac{2}{N(N - 1)} \ \text{ si } i < j, \qquad 0 \text{ sinon}}$$
     Par la proposition 14, en comptant les $N - i$ valeurs de $j > i$ et les $j - 1$ valeurs de $i < j$, 
    $$\boxed{\mathrm{P}(X_{1} = i) = \frac{2(N - i)}{N(N - 1)}, \qquad \mathrm{P}(X_{2} = j) = \frac{2(j - 1)}{N(N - 1)}, \qquad i, j \in \llbracket 1\,,N \rrbracket}$$
     Si $N \geqslant 3$, les variables ne sont pas indépendantes : $\mathrm{P}(X_{1} = 2, X_{2} = 2) = 0$, alors que le produit $\mathrm{P}(X_{1} = 2)\mathrm{P}(X_{2} = 2)$ vaut $\frac{4(N - 2)}{N^{2}(N - 1)^{2}} > 0$. Si $N = 2$, en revanche, $X_{1} = 1$ et $X_{2} = 2$ sont constantes, donc indépendantes.

    ![Figure](documents/figures/207e1b719952ccd8.svg)

    Pour $N = 6$, les $15$ issues sont les points $(i, j)$ situés au-dessus de la diagonale, tous de même probabilité. La colonne $X_{1} = 2$, encadrée en bleu, et la diagonale $X_{2} - X_{1} = 2$, en ocre, contiennent chacune $N - 2 = 4$ points : c'est la question 3 (b). Le point $(2, 4)$, commun aux deux, est en bleu pétrole.

    **3. (a)** Pour $i \in \llbracket 1\,,N \rrbracket$, $\mathrm{P}(N + 1 - X_{2} = i) = \mathrm{P}(X_{2} = N + 1 - i) = \frac{2(N - i)}{N(N - 1)} = \mathrm{P}(X_{1} = i)$ : $\boxed{N + 1 - X_{2} \sim X_{1}}$. C'est le tirage lu à l'envers : le rang de la dernière noire, compté depuis la fin, a la loi du rang de la première.

    **(b)** La variable $X_{2} - X_{1}$ prend ses valeurs dans $\llbracket 1\,,N - 1 \rrbracket$. Pour $d$ dans cet intervalle, les couples $(i, i + d)$ avec $1 \leqslant i$ et $i + d \leqslant N$ sont au nombre de $N - d$ : 
    $$\boxed{\mathrm{P}(X_{2} - X_{1} = d) = \frac{2(N - d)}{N(N - 1)} = \mathrm{P}(X_{1} = d)}, \qquad X_{2} - X_{1} \sim X_{1}.$$

    **(c)** Les trois variables $X_{1}$, $X_{2} - X_{1}$ et $N + 1 - X_{2}$ ont la même loi, donc la même espérance $m$, et leur somme vaut $N + 1$. Par linéarité, $3m = N + 1$ : 
    $$\boxed{\mathrm{E}(X_{1}) = \frac{N + 1}{3}}, \qquad \mathrm{E}(X_{2}) = N + 1 - \mathrm{E}(N + 1 - X_{2}) = N + 1 - m, \qquad \boxed{\mathrm{E}(X_{2}) = \frac{2(N + 1)}{3}}$$
     Les deux boules noires partagent en moyenne la suite des tirages en trois parts égales, comme à l'exercice 83.

    **(d)** Par la question (a) et le théorème 11 (ii), $\mathrm{V}(X_{1}) = \mathrm{V}(N + 1 - X_{2}) = \mathrm{V}(X_{2})$. Par la question (b), $\mathrm{V}(X_{2} - X_{1}) = \mathrm{V}(X_{1})$, et par bilinéarité de la covariance, 
    $$\mathrm{V}(X_{1}) = \mathrm{V}(X_{2} - X_{1}) = \mathrm{V}(X_{2}) + \mathrm{V}(X_{1}) - 2\operatorname{Cov}(X_{1}, X_{2}) = 2\mathrm{V}(X_{1}) - 2\operatorname{Cov}(X_{1}, X_{2}),$$
     d'où $\boxed{\mathrm{V}(X_{1}) = \mathrm{V}(X_{2})}$ et $\boxed{2\operatorname{Cov}(X_{1}, X_{2}) = \mathrm{V}(X_{1})}$.

    **4.** Par la formule de transfert, avec les sommes de $i^{2}$ et de $i^{3}$ pour $i \in \llbracket 1\,,N - 1 \rrbracket$, 
    $$\mathrm{E}(X_{1}^{2}) = \frac{2}{N(N - 1)}\sum_{i=1}^{N-1} (Ni^{2} - i^{3}) = \frac{2}{N(N - 1)}\Big(\frac{N^{2}(N - 1)(2N - 1)}{6} - \frac{N^{2}(N - 1)^{2}}{4}\Big) = \frac{N(N + 1)}{6}.$$
     Par la formule de König-Huygens, puis la question 3 (d), 
    $$\mathrm{V}(X_{1}) = \frac{N(N + 1)}{6} - \frac{(N + 1)^{2}}{9}, \qquad \boxed{\mathrm{V}(X_{1}) = \frac{(N + 1)(N - 2)}{18}}$$
     et 
    $$\boxed{\operatorname{Cov}(X_{1}, X_{2}) = \frac{(N + 1)(N - 2)}{36}}$$
     Pour $N = 2$, on retrouve une variance et une covariance nulles. La covariance est positive : quand la première noire sort tard, la seconde aussi. Le coefficient de corrélation vaut $\frac{1}{2}$ pour tout $N \geqslant 3$. Toutes ces valeurs ont été vérifiées par énumération pour $N \leqslant 8$ ✓.

    **5.** On a $\mathrm{P}(X = Y) = \sum_{k=1}^{N} \mathrm{P}(X = k)\mathrm{P}(Y = k) = \frac{N}{N^{2}}$, donc $\boxed{\mathrm{P}(D) = 1 - \frac{1}{N} = \frac{N - 1}{N}}$. Pour $i < j$, l'événement $(Z_{1} = i, Z_{2} = j) \cap D$ est la réunion des événements incompatibles $(X = i, Y = j)$ et $(X = j, Y = i)$, de probabilité $\frac{2}{N^{2}}$ ; pour $i \geqslant j$, il est vide, puisque $Z_{1} < Z_{2}$ sur $D$. Ainsi 
    $$\mathrm{P}_{D}(Z_{1} = i, Z_{2} = j) = \frac{2/N^{2}}{(N - 1)/N}, \qquad \boxed{\mathrm{P}_{D}(Z_{1} = i, Z_{2} = j) = \frac{2}{N(N - 1)} \ \text{ si } i < j, \quad 0 \text{ sinon}}$$
     Sachant $D$, le couple $(Z_{1}, Z_{2})$ a la loi du couple $(X_{1}, X_{2})$ de la question 2. Deux tirages indépendants uniformes, conditionnés à être distincts et rangés dans l'ordre, se comportent exactement comme les positions des deux boules noires.

    *À retenir.* La question 3 évite tout calcul de somme : les symétries du problème, lecture à l'envers et translation des écarts, donnent l'égalité des lois, puis la linéarité de l'espérance et la bilinéarité de la covariance font le reste. Le seul calcul véritable est celui de $\mathrm{E}(X_{1}^{2})$.
