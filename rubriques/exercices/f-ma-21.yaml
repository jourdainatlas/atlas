  enonce: |
    *L'inégalité de Cantelli.* Soit $X$ une variable aléatoire réelle et $a > 0$.

    **1.** Montrer que, pour tout réel $t \geqslant 0$, $\mathrm{P}\big(X - \mathrm{E}(X) \geqslant a\big) \leqslant \dfrac{t^{2} + \mathrm{V}(X)}{(a + t)^{2}}$. On pourra appliquer l'inégalité de Markov à la variable $\big(X - \mathrm{E}(X) + t\big)^{2}$.

    **2.** En choisissant bien $t$, en déduire que $\mathrm{P}\big(X - \mathrm{E}(X) \geqslant a\big) \leqslant \dfrac{\mathrm{V}(X)}{\mathrm{V}(X) + a^{2}}$.

    **3.** En déduire que $\mathrm{P}\big(|X - \mathrm{E}(X)| \geqslant a\big) \leqslant \dfrac{2\mathrm{V}(X)}{\mathrm{V}(X) + a^{2}}$, et comparer avec l'inégalité de Bienaymé-Tchebychev selon les valeurs de $a$.
  corrige: |
    On note $V = \mathrm{V}(X)$ et $Y = X - \mathrm{E}(X)$, variable centrée de variance $V$.

    **1.** Soit $t \geqslant 0$. Comme $a + t > 0$, si $Y \geqslant a$, alors $Y + t \geqslant a + t > 0$, et donc $(Y + t)^{2} \geqslant (a + t)^{2}$. Par croissance, puis par l'inégalité de Markov (théorème 14) appliquée à la variable positive $(Y + t)^{2}$, 
    $$\mathrm{P}(Y \geqslant a) \leqslant \mathrm{P}\big((Y + t)^{2} \geqslant (a + t)^{2}\big) \leqslant \frac{\mathrm{E}\big((Y + t)^{2}\big)}{(a + t)^{2}}.$$
     Par linéarité, $\mathrm{E}\big((Y + t)^{2}\big) = \mathrm{E}(Y^{2}) + 2t\,\mathrm{E}(Y) + t^{2} = V + t^{2}$, d'où 
    $$\boxed{\mathrm{P}\big(X - \mathrm{E}(X) \geqslant a\big) \leqslant \frac{t^{2} + V}{(a + t)^{2}} \quad\text{pour tout } t \geqslant 0}$$

    **2.** On minimise $g(t) = \frac{t^{2} + V}{(a + t)^{2}}$ sur $\mathbb{R}_{+}$. Le calcul de la dérivée donne 
    $$g'(t) = \frac{2t(a + t) - 2(t^{2} + V)}{(a + t)^{3}} = \frac{2(at - V)}{(a + t)^{3}},$$
     du signe de $at - V$ : $g$ décroît sur $\big[0\,,\frac{V}{a}\big]$ et croît ensuite, et son minimum est atteint en $t = \frac{V}{a}$. En ce point, 
    $$g\Big(\frac{V}{a}\Big) = \frac{\frac{V^{2}}{a^{2}} + V}{\big(a + \frac{V}{a}\big)^{2}} = \frac{V(V + a^{2})/a^{2}}{(a^{2} + V)^{2}/a^{2}}, \qquad\text{d'où}\qquad \boxed{\mathrm{P}\big(X - \mathrm{E}(X) \geqslant a\big) \leqslant \frac{V}{V + a^{2}}}$$
     Cette inégalité *unilatérale* est optimale : la variable qui vaut $a$ avec la probabilité $\frac{V}{V + a^{2}}$ et $-\frac{V}{a}$ avec la probabilité $\frac{a^{2}}{V + a^{2}}$ est centrée, de variance $\frac{a^{2}V + V^{2}}{V + a^{2}} = V$, et réalise l'égalité ✓.

    **3.** La variable $-X$ a pour variance $V$ (théorème 11 (ii)), et la question 2, appliquée à $-X$, donne 
    $$\mathrm{P}\big(X - \mathrm{E}(X) \leqslant -a\big) = \mathrm{P}\big(-X - \mathrm{E}(-X) \geqslant a\big) \leqslant \frac{V}{V + a^{2}}.$$
     L'événement $\big(|X - \mathrm{E}(X)| \geqslant a\big)$ est la réunion de $\big(X - \mathrm{E}(X) \geqslant a\big)$ et de $\big(X - \mathrm{E}(X) \leqslant -a\big)$, et la sous-additivité (proposition 7 (iv)) donne 
    $$\boxed{\mathrm{P}\big(|X - \mathrm{E}(X)| \geqslant a\big) \leqslant \frac{2V}{V + a^{2}}}$$
     Comparons avec la borne $\frac{V}{a^{2}}$ de Bienaymé-Tchebychev, lorsque $V > 0$ : 
    $$\frac{2V}{V + a^{2}} < \frac{V}{a^{2}} \iff 2a^{2} < V + a^{2} \iff a^{2} < V.$$
     La nouvelle borne n'est donc meilleure que si $a < \sigma(X)$. Mais alors $\frac{V}{a^{2}} > 1$ et $\frac{2V}{V + a^{2}} > 1$ : les deux majorations sont sans intérêt, puisqu'une probabilité est toujours au plus $1$. *La version bilatérale n'améliore jamais utilement l'inégalité de Bienaymé-Tchebychev.* L'intérêt de l'inégalité de Cantelli est la version unilatérale : pour $a = \sigma(X)$, elle donne $\frac{1}{2}$ là où Bienaymé-Tchebychev ne donne que $1$, et pour $a = 2\sigma(X)$, elle donne $\frac{1}{5}$ au lieu de $\frac{1}{4}$.

    ![Figure](documents/figures/ee22f0f37f552286.svg)

    Les trois majorants sont tracés en fonction de $\frac{a}{\sigma}$. Les courbes de Bienaymé-Tchebychev, en bleu, et de Cantelli bilatérale, en bleu pétrole, se coupent au point rouge, d'ordonnée $1$ : la seconde n'est en dessous de la première que là où toutes deux dépassent $1$. La borne unilatérale, en ocre, est partout la plus petite et reste inférieure à $1$.

    *Piège.* L'erreur la plus répandue est de comparer des bornes qui ne majorent pas la même probabilité : la borne de Cantelli unilatérale porte sur un seul côté de l'écart, et doit être doublée, comme à la question 3, pour être comparée honnêtement à Bienaymé-Tchebychev.
- id: "ma-21-100"
