  enonce: |
    *Le paradoxe de Simpson.* On dit que deux événements $A$ et $B$ sont *positivement corrélés* si $\mathrm{P}(A \cap B) > \mathrm{P}(A)\,\mathrm{P}(B)$, et *négativement corrélés* si $\mathrm{P}(A \cap B) < \mathrm{P}(A)\,\mathrm{P}(B)$.

    **1.** Soit $C$ un événement tel que $\mathrm{P}(C) > 0$. Traduire, sans probabilité conditionnelle, le fait que $A$ et $B$ soient positivement corrélés pour la probabilité $\mathrm{P}_{C}$ ; on dit alors qu'ils sont positivement corrélés sachant $C$.

    **2.** Construire un espace probabilisé fini et trois événements $A$, $B$, $C$, avec $0 < \mathrm{P}(C) < 1$, tels que $A$ et $B$ soient positivement corrélés, mais négativement corrélés sachant $C$ et négativement corrélés sachant $\overline{C}$.

    **3.** Imaginer une situation concrète où ce paradoxe peut induire en erreur.
  corrige: |
    **1.** Par définition de $\mathrm{P}_{C}$ (section 21.4.1), on a $\mathrm{P}_{C}(A) = \frac{\mathrm{P}(A \cap C)}{\mathrm{P}(C)}$, et de même pour $B$ et pour $A \cap B$. L'inégalité $\mathrm{P}_{C}(A \cap B) > \mathrm{P}_{C}(A)\,\mathrm{P}_{C}(B)$ s'écrit donc 
    $$\frac{\mathrm{P}(A \cap B \cap C)}{\mathrm{P}(C)} > \frac{\mathrm{P}(A \cap C)\,\mathrm{P}(B \cap C)}{\mathrm{P}(C)^{2}},$$
     soit, en multipliant par $\mathrm{P}(C)^{2} > 0$, 
    $$\boxed{\mathrm{P}(A \cap B \cap C)\,\mathrm{P}(C) > \mathrm{P}(A \cap C)\,\mathrm{P}(B \cap C)}$$
     La corrélation négative sachant $C$ s'écrit de même avec l'inégalité stricte dans l'autre sens. Pour $C = \Omega$, on retrouve la définition de l'énoncé.

    **2.** On prend $\Omega = \llbracket 1\,,9 \rrbracket$, muni de la probabilité uniforme, et 
    $$\boxed{A = \{1, 2, 3, 4\}, \qquad B = \{1, 2, 5, 6\}, \qquad C = \{3, 5, 7, 8, 9\}}$$
     *Sans conditionnement.* On a $\mathrm{P}(A) = \mathrm{P}(B) = \frac{4}{9}$ et $A \cap B = \{1, 2\}$, d'où 
    $$\mathrm{P}(A \cap B) = \frac{2}{9} = \frac{18}{81} > \frac{16}{81} = \mathrm{P}(A)\,\mathrm{P}(B) : \qquad A \text{ et } B \text{ sont positivement corrélés.}$$
     *Sachant $C$.* On a $\mathrm{P}(C) = \frac{5}{9} \in \left]0\,,1\right[$, $A \cap C = \{3\}$, $B \cap C = \{5\}$ et $A \cap B \cap C = \varnothing$. Le critère de la question 1 donne $0 \times \frac{5}{9} < \frac{1}{9} \times \frac{1}{9}$ : la corrélation est négative. En probabilités conditionnelles, $\mathrm{P}_{C}(A) = \mathrm{P}_{C}(B) = \frac{1}{5}$ et $\mathrm{P}_{C}(A \cap B) = 0$, et l'écart vaut $0 - \frac{1}{25} = -\frac{1}{25}$.

    *Sachant $\overline{C}$.* On a $\overline{C} = \{1, 2, 4, 6\}$, $A \cap \overline{C} = \{1, 2, 4\}$, $B \cap \overline{C} = \{1, 2, 6\}$ et $A \cap B \cap \overline{C} = \{1, 2\}$, d'où 
    $$\mathrm{P}_{\overline{C}}(A \cap B) = \frac{1}{2} = \frac{8}{16} < \frac{9}{16} = \frac{3}{4} \times \frac{3}{4} = \mathrm{P}_{\overline{C}}(A)\,\mathrm{P}_{\overline{C}}(B).$$

    $$\boxed{\begin{array}{l} \mathrm{P}(A \cap B) - \mathrm{P}(A)\mathrm{P}(B) = \frac{2}{81} > 0, \\[4pt] \mathrm{P}_{C}(A \cap B) - \mathrm{P}_{C}(A)\mathrm{P}_{C}(B) = -\frac{1}{25} < 0, \\[4pt] \mathrm{P}_{\overline{C}}(A \cap B) - \mathrm{P}_{\overline{C}}(A)\mathrm{P}_{\overline{C}}(B) = -\frac{1}{16} < 0 \end{array}}$$
     Le mécanisme se lit sur les chiffres : $A$ et $B$ sont tous deux rares sachant $C$ (probabilité $\frac{1}{5}$) et fréquents sachant $\overline{C}$ (probabilité $\frac{3}{4}$). Savoir que $A$ est réalisé rend $\overline{C}$ plus probable, donc $B$ aussi : c'est par l'intermédiaire de $C$ que $A$ et $B$ semblent liés positivement, alors qu'à $C$ fixé ils se repoussent.

    **3.** Considérons une population de malades, $C$ désignant l'événement « la forme de la maladie est grave », $A$ « le patient a reçu le traitement » et $B$ « le patient guérit ». Si les médecins réservent le traitement aux formes bénignes, qui guérissent souvent d'elles-mêmes, la situation peut être exactement celle de la question 2 : sur l'ensemble des patients, les traités guérissent plus souvent que les autres, et l'on conclurait à l'efficacité du traitement, alors que, parmi les formes graves comme parmi les formes bénignes, il diminue les chances de guérison.

    *Piège.* L'erreur la plus répandue est de croire qu'une corrélation observée sur toute une population se retrouve dans chacune des sous-populations d'un système complet $(C, \overline{C})$, ou l'inverse. La formule des probabilités totales (théorème 5) écrit bien $\mathrm{P}(A \cap B)$, $\mathrm{P}(A)$ et $\mathrm{P}(B)$ comme des moyennes pondérées par $\mathrm{P}(C)$ et $\mathrm{P}(\overline{C})$, mais le produit $\mathrm{P}(A)\,\mathrm{P}(B)$ n'est pas la moyenne des produits : c'est ce défaut de linéarité qui autorise le renversement.
- id: "ma-21-46"
  feuille: "f-ma-21"
  numero: 46
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance, indépendance, jeux de hasard]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance]
  page_enonce: 12
  page_corrige: 43
  enonce: |
    Soit $n \geqslant 2$. On lance $n$ fois une pièce équilibrée. On note $A_{0}$ l'événement « le nombre total de piles est pair » et, pour $k \in \llbracket 1\,,n \rrbracket$, $A_{k}$ l'événement « le $k$-ième lancer donne pile ». Montrer que les événements $A_{0}$, $A_{1}$, …, $A_{n}$ ne sont pas mutuellement indépendants, mais que toute sous-famille de $n$ d'entre eux est formée d'événements mutuellement indépendants. Comparer avec le second exemple du cours qui suit la proposition 10.
  corrige: |
    On modélise les $n$ lancers par $\Omega = \{0, 1\}^{n}$, muni de la probabilité uniforme, $1$ codant pile : c'est le modèle de la proposition 17, où chaque coordonnée $X_{k}$ suit la loi $\mathcal{B}(\frac{1}{2})$, et les $X_{k}$ sont mutuellement indépendantes. On a $A_{k} = (X_{k} = 1)$ pour $k \geqslant 1$, et $A_{0} = (X_{1} + \cdots + X_{n} \text{ pair})$.

    *Probabilités.* On a $\mathrm{P}(A_{k}) = \frac{1}{2}$ pour $k \geqslant 1$. L'application qui change la première coordonnée d'une issue est une bijection de $\Omega$ qui change la parité du nombre de piles : elle échange $A_{0}$ et $\overline{A_{0}}$, qui ont donc le même cardinal, et $\mathrm{P}(A_{0}) = \frac{1}{2}$.

    *La famille entière n'est pas indépendante.* L'événement $A_{1} \cap \cdots \cap A_{n}$ est réduit à l'issue $(1, \dots, 1)$, qui compte $n$ piles. Il est contenu dans $A_{0}$ si $n$ est pair, et disjoint de $A_{0}$ si $n$ est impair, d'où 
    $$\boxed{\mathrm{P}(A_{0} \cap A_{1} \cap \cdots \cap A_{n}) = \begin{cases} \frac{1}{2^{n}} & \text{si } n \text{ est pair} \\ 0 & \text{si } n \text{ est impair} \end{cases} \neq \frac{1}{2^{n+1}} = \mathrm{P}(A_{0})\,\mathrm{P}(A_{1}) \cdots \mathrm{P}(A_{n})}$$
     Les événements $A_{0}$, …, $A_{n}$ ne sont donc pas mutuellement indépendants : les résultats des $n$ lancers déterminent la parité du nombre de piles.

    *Les sous-familles de $n$ événements.* Une sous-famille de $n$ événements s'obtient en retirant l'un des $A_{j}$.

    • Si l'on retire $A_{0}$, il reste $A_{1}$, …, $A_{n}$, qui sont mutuellement indépendants par la proposition 15, puisque les $X_{k}$ le sont.

    • Si l'on retire $A_{j}$ avec $j \geqslant 1$, soit $J$ une partie de $\llbracket 0\,,n \rrbracket \setminus \{j\}$. Si $0 \notin J$, l'égalité demandée par la définition de l'indépendance mutuelle résulte encore de l'indépendance des $X_{k}$. Sinon, on écrit $J = \{0\} \cup J'$ avec $J' \subset \llbracket 1\,,n \rrbracket \setminus \{j\}$, et l'on note $m = |J'|$. Les issues de $\bigcap_{i \in J'} A_{i}$ ont leurs $m$ coordonnées d'indices dans $J'$ égales à $1$, les $n - m$ autres étant libres ; il y en a $2^{n - m}$. Parmi elles, celles de $A_{0}$ sont celles dont les coordonnées libres comptent un nombre de $1$ de la parité de $m$. Comme $j$ est l'un des indices libres, changer la coordonnée d'indice $j$ échange ces issues et les autres, qui sont donc en nombre égal : il y en a $2^{n - m - 1}$, et 
    $$\mathrm{P}\Big(A_{0} \cap \bigcap_{i \in J'} A_{i}\Big) = \frac{2^{n - m - 1}}{2^{n}} = \frac{1}{2^{m + 1}} = \mathrm{P}(A_{0}) \prod_{i \in J'} \mathrm{P}(A_{i}).$$

    $$\boxed{\text{toute sous-famille de } n \text{ événements parmi } A_{0}, \dots, A_{n} \text{ est mutuellement indépendante}}$$
     Pour $n = 2$, l'événement $A_{0}$, « deux piles ou deux faces », est l'événement $C$ « les deux pièces donnent le même côté » du second exemple qui suit la proposition 10 : on retrouve exactement cet exemple, avec trois événements deux à deux indépendants et non mutuellement indépendants. L'exercice le prolonge à $n + 1$ événements dont toutes les sous-familles strictes, et pas seulement les paires, sont indépendantes.

    *À retenir.* Contrôler l'indépendance de toutes les sous-familles strictes ne dispense pas de contrôler la famille entière : la définition de l'indépendance mutuelle porte sur toutes les parties $J$ de l'ensemble des indices, et une seule égalité manquante suffit à la mettre en défaut.
- id: "ma-21-47"
  feuille: "f-ma-21"
  numero: 47
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance, probabilités, indépendance, loi uniforme]
  noeuds: [p-independance, p-espace, p-variables]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 12
  page_corrige: 44
  enonce: |
    Soit $n \geqslant 2$ et $\Omega_{n} = \llbracket 1\,,n \rrbracket$, muni de la probabilité uniforme. Un événement est dit *non trivial* si sa probabilité appartient à $\left]0\,,1\right[$.

    **1.** On suppose $n$ premier. Montrer que deux événements non triviaux ne sont jamais indépendants.

    **2.** On suppose que $n$ n'est pas premier. Construire deux événements non triviaux indépendants.
  corrige: |
    Pour deux événements $A$ et $B$ de $\Omega_{n}$, muni de la probabilité uniforme, on a 
    $$A \text{ et } B \text{ indépendants} \iff \frac{|A \cap B|}{n} = \frac{|A|}{n} \cdot \frac{|B|}{n} \iff \boxed{n\,|A \cap B| = |A|\,|B|}$$
     et $A$ est non trivial si et seulement si $1 \leqslant |A| \leqslant n - 1$.

    **1.** Supposons $n$ premier, et soit $A$, $B$ deux événements non triviaux. Si $A$ et $B$ étaient indépendants, $n$ diviserait le produit $|A|\,|B|$, donc l'un des facteurs par le lemme d'Euclide (chapitre 12, proposition 9 (ii)). C'est impossible, puisque $|A|$ et $|B|$ appartiennent à $\llbracket 1\,,n - 1 \rrbracket$. 
    $$\boxed{n \text{ premier} \implies \text{deux événements non triviaux de } \Omega_{n} \text{ ne sont jamais indépendants}}$$

    **2.** Supposons $n = ab$ avec $a$, $b \geqslant 2$. On pose 
    $$\boxed{A = \{b, 2b, \dots, ab\} \quad (\text{les multiples de } b), \qquad B = \llbracket 1\,,b \rrbracket}$$
     On a $|A| = a$ et $|B| = b$, tous deux dans $\llbracket 1\,,n - 1 \rrbracket$ puisque $a$, $b \geqslant 2$, et $A \cap B = \{b\}$. Ainsi $n\,|A \cap B| = n = ab = |A|\,|B|$ : les événements $A$ et $B$, de probabilités $\frac{1}{b}$ et $\frac{1}{a}$, sont non triviaux et indépendants. Pour $n = 6$, avec $a = 3$ et $b = 2$, on obtient $A = \{2, 4, 6\}$ et $B = \{1, 2\}$ : « être pair » est indépendant de « être au plus $2$ ».

    L'idée de la construction est d'écrire chaque $k \in \llbracket 1\,,n \rrbracket$ de façon unique sous la forme $k = qb + s$, avec $q \in \llbracket 0\,,a - 1 \rrbracket$ et $s \in \llbracket 1\,,b \rrbracket$ (division euclidienne de $k - 1$ par $b$, chapitre 12, théorème 1) : sous la probabilité uniforme, le couple $(q, s)$ est uniforme sur $\llbracket 0\,,a - 1 \rrbracket \times \llbracket 1\,,b \rrbracket$, et deux événements qui ne portent l'un que sur $s$, l'autre que sur $q$, sont indépendants. L'événement $A$ est $(s = b)$ et l'événement $B$ est $(q = 0)$.

    *À retenir.* L'indépendance est une propriété numérique, $\mathrm{P}(A \cap B) = \mathrm{P}(A)\mathrm{P}(B)$, et elle dépend de l'arithmétique des cardinaux : sur un univers uniforme de cardinal premier, aucune paire d'événements non triviaux n'y satisfait. C'est la même dépendance que dans le premier exemple qui suit la proposition 10, où l'indépendance de « divisible par $2$ » et « divisible par $3$ » vaut sur $\llbracket 1\,,60 \rrbracket$ et pas sur $\llbracket 1\,,100 \rrbracket$.
- id: "ma-21-48"
  feuille: "f-ma-21"
  numero: 48
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance, probabilités, indépendance]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 12
  page_corrige: 44
  enonce: |
    Soit $A_{1}$, …, $A_{n}$ des événements mutuellement indépendants, dont les probabilités appartiennent à $\left]0\,,1\right[$.

    **1.** Pour tout $k$, on choisit $B_{k}$ égal à $A_{k}$ ou à $\overline{A_{k}}$. Montrer que $B_{1} \cap \cdots \cap B_{n} \neq \varnothing$.

    **2.** Montrer que deux choix différents de $(B_{1}, \dots, B_{n})$ conduisent à des intersections disjointes.

    **3.** En déduire que $|\Omega| \geqslant 2^{n}$. Donner un exemple où l'égalité a lieu.
  corrige: |
    **1.** Par la proposition 10 (iii), la famille $(B_{1}, \dots, B_{n})$, obtenue en remplaçant certains $A_{k}$ par leurs contraires, est formée d'événements mutuellement indépendants. Chaque $\mathrm{P}(B_{k})$ vaut $\mathrm{P}(A_{k})$ ou $1 - \mathrm{P}(A_{k})$, qui appartiennent à $\left]0\,,1\right[$. Donc 
    $$\mathrm{P}(B_{1} \cap \cdots \cap B_{n}) = \mathrm{P}(B_{1}) \cdots \mathrm{P}(B_{n}) > 0, \qquad\text{d'où}\qquad \boxed{B_{1} \cap \cdots \cap B_{n} \neq \varnothing}$$
     puisque $\mathrm{P}(\varnothing) = 0$.

    **2.** Soit $(B_{1}, \dots, B_{n})$ et $(B'_{1}, \dots, B'_{n})$ deux choix différents : il existe $k$ tel que $B_{k} \neq B'_{k}$, c'est-à-dire, quitte à échanger les rôles, $B_{k} = A_{k}$ et $B'_{k} = \overline{A_{k}}$. Les deux intersections sont contenues respectivement dans $A_{k}$ et dans $\overline{A_{k}}$, qui sont disjoints : 
    $$\boxed{(B_{1} \cap \cdots \cap B_{n}) \cap (B'_{1} \cap \cdots \cap B'_{n}) = \varnothing}$$

    **3.** Un choix est une application de $\llbracket 1\,,n \rrbracket$ dans un ensemble à deux éléments ; il y en a $2^{n}$ (proposition 3). Les $2^{n}$ intersections correspondantes sont des parties de $\Omega$ non vides (question 1) et deux à deux disjointes (question 2). En choisissant un élément dans chacune, on obtient $2^{n}$ éléments distincts de $\Omega$ : 
    $$\boxed{|\Omega| \geqslant 2^{n}}$$
     *Cas d'égalité.* On prend $\Omega = \{0, 1\}^{n}$, muni de la probabilité uniforme, et $A_{k} = \{\omega \in \Omega \mid \omega_{k} = 1\}$. Par la proposition 17, les coordonnées sont mutuellement indépendantes, de loi $\mathcal{B}(\frac{1}{2})$, donc les $A_{k}$ sont mutuellement indépendants (proposition 15), de probabilité $\frac{1}{2} \in \left]0\,,1\right[$, et $|\Omega| = 2^{n}$. Chaque intersection $B_{1} \cap \cdots \cap B_{n}$ y est réduite à une issue.

    *À retenir.* Les questions 1 et 2 montrent que les $2^{n}$ intersections forment un système complet d'événements, tous non vides : $n$ événements indépendants non triviaux « découpent » l'univers en au moins $2^{n}$ morceaux. Modéliser $n$ épreuves indépendantes et non déterministes demande donc un univers d'au moins $2^{n}$ issues ; c'est l'analogue probabiliste de l'exercice 13, où $m$ parties séparant $n$ points imposaient $n \leqslant 2^{m}$.
- id: "ma-21-49"
  feuille: "f-ma-21"
  numero: 49
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance, probabilités, jeux de hasard, marches aléatoires et graphes]
  noeuds: [p-independance, p-espace, p-variables]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 13
  page_corrige: 45
  enonce: |
    *Les singes dactylographes.* On lance $n$ fois un dé équilibré dont les dix faces sont numérotées de $0$ à $9$.

    **1.** Montrer que la probabilité qu'un $6$ apparaisse au moins une fois tend vers $1$ quand $n$ tend vers $+\infty$.

    **2.** Montrer que la probabilité que deux $6$ apparaissent au moins une fois lors de deux lancers consécutifs tend vers $1$ quand $n$ tend vers $+\infty$. On pourra considérer les lancers de rangs $2k - 1$ et $2k$.

    **3.** Expliquer le titre de l'exercice.
  corrige: |
    On modélise les $n$ lancers par des variables $X_{1}$, …, $X_{n}$ mutuellement indépendantes de loi uniforme sur $\llbracket 0\,,9 \rrbracket$, ce que permet la proposition 17.

    **1.** Les événements $(X_{k} \neq 6)$ sont mutuellement indépendants (proposition 15), de probabilité $\frac{9}{10}$. La probabilité qu'aucun $6$ n'apparaisse vaut donc $\big(\frac{9}{10}\big)^{n}$, qui tend vers $0$ (suite géométrique de raison appartenant à $\left]-1\,,1\right[$, chapitre 7). 
    $$\boxed{\mathrm{P}(\text{au moins un } 6) = 1 - \Big(\frac{9}{10}\Big)^{n} \xrightarrow[n \to +\infty]{} 1}$$
     Pour $n = 100$, la probabilité de n'obtenir aucun $6$ vaut déjà $0{,}9^{100} \approx 2{,}7 \cdot 10^{-5}$.

    **2.** On note $m = \lfloor \frac{n}{2} \rfloor$ et, pour $k \in \llbracket 1\,,m \rrbracket$, $B_{k} = (X_{2k-1} = 6) \cap (X_{2k} = 6)$. Par indépendance, $\mathrm{P}(B_{k}) = \frac{1}{100}$. L'événement $B_{k}$ s'écrit $(Z_{k} = 1)$, où $Z_{k}$ est l'indicatrice de $\{(6, 6)\}$ évaluée en $(X_{2k-1}, X_{2k})$ : c'est une fonction du paquet $(X_{2k-1}, X_{2k})$, et ces paquets sont disjoints. Par le lemme des coalitions (théorème 7), les variables $Z_{1}$, …, $Z_{m}$ sont mutuellement indépendantes, donc les événements $B_{1}$, …, $B_{m}$ aussi (proposition 15), ainsi que leurs contraires (proposition 10 (iii)).

    Si deux $6$ consécutifs n'apparaissent jamais, aucun $B_{k}$ n'est réalisé : 
    $$\mathrm{P}(\text{jamais deux } 6 \text{ consécutifs}) \leqslant \mathrm{P}\big(\overline{B_{1}} \cap \cdots \cap \overline{B_{m}}\big) = \Big(\frac{99}{100}\Big)^{m},$$

    $$\boxed{\mathrm{P}(\text{deux } 6 \text{ consécutifs au moins une fois}) \geqslant 1 - \Big(\frac{99}{100}\Big)^{\lfloor n/2 \rfloor} \xrightarrow[n \to +\infty]{} 1}$$
     puisque $\lfloor \frac{n}{2} \rfloor$ tend vers $+\infty$. Pour $n = 1\,000$, la minoration vaut $1 - 0{,}99^{500} \approx 0{,}9934$, et la valeur exacte, calculée en suivant à chaque rang si le dernier lancer est un $6$, vaut $0{,}9999$ : la minoration est grossière, mais elle suffit pour la limite.

    *Piège.* Les événements « les lancers $j$ et $j + 1$ donnent $6$ », pour $j \in \llbracket 1\,,n - 1 \rrbracket$, ne sont pas indépendants : deux d'entre eux d'indices consécutifs partagent un lancer, et la formule $\big(\frac{99}{100}\big)^{n-1}$ serait fausse. C'est pour obtenir des événements indépendants que l'on se restreint aux paquets disjoints $\{2k - 1, 2k\}$, en perdant de l'information, mais sans perdre la limite.

    **3.** Le même raisonnement s'applique à n'importe quelle suite de chiffres fixée à l'avance, de longueur $\ell$ : en découpant les lancers en $\lfloor \frac{n}{\ell} \rfloor$ paquets disjoints de $\ell$ lancers consécutifs, la probabilité qu'elle n'apparaisse jamais est au plus $\big(1 - 10^{-\ell}\big)^{\lfloor n/\ell \rfloor}$, qui tend vers $0$. Un singe tapant au hasard sur un clavier, chaque touche étant indépendante des précédentes, finit donc presque certainement par écrire n'importe quel texte donné, par exemple une œuvre de Shakespeare, codée en chiffres. L'image a été employée par Émile Borel en 1913, dans un article du *Journal de Physique* sur la mécanique statistique. Le calcul montre aussi pourquoi c'est sans conséquence pratique : il faut un nombre de lancers de l'ordre de $10^{\ell}$, astronomique dès que le texte a quelques dizaines de caractères.
- id: "ma-21-50"
  feuille: "f-ma-21"
  numero: 50
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 3
  types: [Algorithmique, Problème, Calcul]
  mots_cles: [conditionnement et indépendance, probabilités, probabilités conditionnelles, indépendance]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 13
  page_corrige: 46
  enonce: |
    Un joueur dispose de deux machines à sous : la machine $A$ fait gagner avec la probabilité $\frac{1}{5}$, la machine $B$ avec la probabilité $\frac{1}{10}$. Il choisit la première machine au hasard, chacune avec la probabilité $\frac{1}{2}$ ; ensuite, s'il gagne une partie, il rejoue sur la même machine, et s'il perd, il change de machine. Pour $k \geqslant 1$, on note $G_{k}$ l'événement « le joueur gagne la $k$-ième partie » et $A_{k}$ l'événement « la $k$-ième partie a lieu sur la machine $A$ » ; sachant la machine utilisée pour une partie, le résultat de celle-ci est indépendant des parties précédentes.

    **1.** Écrire une fonction Python `jouer(n)` qui simule $n$ parties et renvoie la proportion de parties gagnées.

    **2.** Calculer $\mathrm{P}(G_{1})$, puis $\mathrm{P}(G_{2})$.

    **3.** Sachant que le joueur a gagné la deuxième partie, quelle est la probabilité que la première ait eu lieu sur la machine $A$ ?

    **4.** Soit $k \geqslant 1$.

    **(a)** Exprimer $\mathrm{P}(G_{k})$ en fonction de $\mathrm{P}(A_{k})$.

    **(b)** Montrer que $\mathrm{P}(A_{k+1}) = -\frac{7}{10}\,\mathrm{P}(A_{k}) + \frac{9}{10}$.

    **(c)** En déduire $\mathrm{P}(A_{k})$, puis $\mathrm{P}(G_{k})$, en fonction de $k$.

    **5.** On pose $S_{n} = \mathrm{P}(G_{1}) + \cdots + \mathrm{P}(G_{n})$. Calculer $S_{n}$ et la limite de $\frac{S_{n}}{n}$, et comparer avec les valeurs renvoyées par `jouer(n)` pour de grandes valeurs de $n$.
  corrige: |
    *Modèle.* L'énoncé fixe les données : $\mathrm{P}(A_{1}) = \frac{1}{2}$ et, pour tout $k \geqslant 1$ et tout événement $H$ ne portant que sur les $k - 1$ premières parties, $\mathrm{P}(G_{k} \mid A_{k} \cap H) = \frac{1}{5}$ et $\mathrm{P}(G_{k} \mid \overline{A_{k}} \cap H) = \frac{1}{10}$ lorsque ces probabilités sont définies ; en particulier $\mathrm{P}_{A_{k}}(G_{k}) = \frac{1}{5}$ et $\mathrm{P}_{\overline{A_{k}}}(G_{k}) = \frac{1}{10}$. La règle de changement donne $A_{k+1} = (A_{k} \cap G_{k}) \cup (\overline{A_{k}} \cap \overline{G_{k}})$.

    **1.** On tire la première machine, puis, à chaque partie, on simule un succès de probabilité $0{,}2$ ou $0{,}1$ avec `random.random()`, qui suit la loi uniforme sur $[0\,,1[$ ; on change de machine en cas de perte. 

    ```python
    import random

    def jouer(n):
        machine = random.choice("AB")          # machine au hasard
        gains = 0
        for _ in range(n):
            p = 0.2 if machine == "A" else 0.1
            if random.random() < p:            # partie gagnee : on reste
                gains += 1
            else:                              # partie perdue : on change
                machine = "B" if machine == "A" else "A"
        return gains / n
    ```

    **2.** La formule des probabilités totales (théorème 5), appliquée au système complet $(A_{1}, \overline{A_{1}})$, donne 
    $$\mathrm{P}(G_{1}) = \mathrm{P}_{A_{1}}(G_{1})\mathrm{P}(A_{1}) + \mathrm{P}_{\overline{A_{1}}}(G_{1})\mathrm{P}(\overline{A_{1}}) = \frac{1}{5} \cdot \frac{1}{2} + \frac{1}{10} \cdot \frac{1}{2}, \qquad \boxed{\mathrm{P}(G_{1}) = \frac{3}{20}}$$
     Pour la deuxième partie, on calcule d'abord la probabilité de jouer sur $A$ : la deuxième partie a lieu sur $A$ si la première a été gagnée sur $A$ ou perdue sur $B$, d'où, par les probabilités composées, 
    $$\mathrm{P}(A_{2}) = \mathrm{P}(A_{1} \cap G_{1}) + \mathrm{P}(\overline{A_{1}} \cap \overline{G_{1}}) = \frac{1}{2} \cdot \frac{1}{5} + \frac{1}{2} \cdot \frac{9}{10} = \frac{11}{20},$$

    $$\mathrm{P}(G_{2}) = \frac{1}{5} \cdot \frac{11}{20} + \frac{1}{10} \cdot \frac{9}{20} = \frac{22 + 9}{200}, \qquad \boxed{\mathrm{P}(G_{2}) = \frac{31}{200}}$$

    ![Figure](documents/figures/c65068569ee4646a.svg)

    L'arbre décrit la première partie, et chaque feuille porte la probabilité de son chemin ; les branches bleues correspondent à la machine $A$ et les branches ocre à la machine $B$. Les quatre feuilles totalisent $\frac{2 + 8 + 1 + 9}{20} = 1$, et la couleur de la machine utilisée pour la deuxième partie se lit au bout de chaque chemin : elle est conservée après un gain et change après une perte.

    **3.** On cherche $\mathrm{P}_{G_{2}}(A_{1}) = \frac{\mathrm{P}(A_{1} \cap G_{2})}{\mathrm{P}(G_{2})}$. Les deux premières feuilles de l'arbre donnent, par les probabilités composées, 
    $$\mathrm{P}(A_{1} \cap G_{2}) = \mathrm{P}(A_{1} \cap G_{1} \cap G_{2}) + \mathrm{P}(A_{1} \cap \overline{G_{1}} \cap G_{2}) = \frac{1}{10} \cdot \frac{1}{5} + \frac{2}{5} \cdot \frac{1}{10} = \frac{3}{50},$$

    $$\text{d'où}\qquad \boxed{\mathrm{P}_{G_{2}}(A_{1}) = \frac{3/50}{31/200} = \frac{12}{31} \approx 0{,}387}$$
     Ce résultat est inférieur à $\frac{1}{2}$ : un gain à la deuxième partie rend plus probable un départ sur $B$, parce qu'un départ sur $B$, suivi d'une perte probable, conduit sur la bonne machine.

    **4.(a)** La formule des probabilités totales, avec le système complet $(A_{k}, \overline{A_{k}})$, donne 
    $$\mathrm{P}(G_{k}) = \frac{1}{5}\,\mathrm{P}(A_{k}) + \frac{1}{10}\big(1 - \mathrm{P}(A_{k})\big), \qquad \boxed{\mathrm{P}(G_{k}) = \frac{1 + \mathrm{P}(A_{k})}{10}}$$

    **(b)** L'égalité $A_{k+1} = (A_{k} \cap G_{k}) \cup (\overline{A_{k}} \cap \overline{G_{k}})$ est une réunion d'événements incompatibles, et chaque terme se calcule par les probabilités composées : 
    $$\mathrm{P}(A_{k+1}) = \frac{1}{5}\,\mathrm{P}(A_{k}) + \frac{9}{10}\big(1 - \mathrm{P}(A_{k})\big), \qquad \boxed{\mathrm{P}(A_{k+1}) = -\frac{7}{10}\,\mathrm{P}(A_{k}) + \frac{9}{10}}$$

    **(c)** La suite $a_{k} = \mathrm{P}(A_{k})$ est arithmético-géométrique (chapitre 7, proposition 15), de raison $-\frac{7}{10}$ et de point fixe $c$ solution de $c = -\frac{7}{10}c + \frac{9}{10}$, soit $c = \frac{9}{17}$. La suite $(a_{k} - c)$ est géométrique de raison $-\frac{7}{10}$, et $a_{1} - c = \frac{1}{2} - \frac{9}{17} = -\frac{1}{34}$ : 
    $$\boxed{\mathrm{P}(A_{k}) = \frac{9}{17} - \frac{1}{34}\Big(-\frac{7}{10}\Big)^{k-1}}, \qquad \boxed{\mathrm{P}(G_{k}) = \frac{13}{85} - \frac{1}{340}\Big(-\frac{7}{10}\Big)^{k-1}}$$
     On contrôle : $k = 1$ donne $\frac{52 - 1}{340} = \frac{3}{20}$, et $k = 2$ donne $\frac{13}{85} + \frac{7}{3\,400} = \frac{527}{3\,400} = \frac{31}{200}$ ✓.

    **5.** On somme la constante et la progression géométrique de raison $-\frac{7}{10} \neq 1$ : 
    $$S_{n} = \frac{13n}{85} - \frac{1}{340} \cdot \frac{1 - (-7/10)^{n}}{1 + 7/10}, \qquad \boxed{S_{n} = \frac{13n}{85} - \frac{1 - (-7/10)^{n}}{578}, \qquad \frac{S_{n}}{n} \xrightarrow[n \to +\infty]{} \frac{13}{85} \approx 0{,}1529}$$
     puisque $\big|1 - (-\frac{7}{10})^{n}\big| \leqslant 2$. Trois appels à `jouer(10**6)` ont renvoyé $0{,}1534$, $0{,}1523$ et $0{,}1528$ : la proportion de parties gagnées est proche de $\frac{13}{85}$, avec un écart de l'ordre de $10^{-3}$.

    *À retenir.* Le nombre $S_{n}$ est la somme des probabilités de gagner chaque partie ; la section 21.6 l'interprétera comme l'espérance du nombre de parties gagnées, et la loi faible des grands nombres (section 21.8) expliquera pourquoi une simulation en donne une valeur approchée. La limite $\frac{13}{85} = \frac{1}{10}\big(1 + \frac{9}{17}\big)$ s'interprète : à long terme, le joueur joue sur $A$ avec la probabilité $\frac{9}{17}$, soit environ neuf parties sur dix-sept, et la stratégie « on reste après un gain » fait un peu mieux que le choix d'une machine au hasard à chaque partie, qui donnerait $\frac{3}{20} = \frac{12{,}75}{85}$.
- id: "ma-21-51"
  feuille: "f-ma-21"
  numero: 51
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 3
  types: [Calcul]
  mots_cles: [conditionnement et indépendance, probabilités, probabilités conditionnelles]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 13
  page_corrige: 48
  enonce: |
    Un chat partage son temps entre trois activités, qu'il pratique par tranches de cinq minutes : manger ($M$), jouer ($J$) et dormir ($D$). Après une tranche de repas, il continue à manger avec la probabilité $\frac{1}{2}$, et se met à jouer sinon. Après une tranche de jeu, il mange avec la probabilité $\frac{1}{4}$, et va dormir sinon. Après une tranche de sommeil, il continue à dormir avec la probabilité $\frac{3}{4}$, et va manger sinon ; ces probabilités ne dépendent pas des tranches antérieures. Un matin, le chat passe les cinq premières minutes à manger. On note $m_{n}$, $j_{n}$ et $d_{n}$ les probabilités qu'il mange, qu'il joue et qu'il dorme dans la tranche $[5n\,,5n + 5]$, exprimée en minutes, et $\mu_{n} = (m_{n}, j_{n}, d_{n})$.

    **1.** Déterminer une matrice $T \in \mathcal{M}_{3}(\mathbb{R})$ telle que $\mu_{n+1} = \mu_{n}T$ pour tout $n \in \mathbb{N}$, en justifiant la relation par la formule des probabilités totales.

    **2.** Calculer $m_{n}$, $j_{n}$ et $d_{n}$ en fonction de $n$. On pourra chercher une matrice inversible $P$ telle que $P^{-1}TP$ soit diagonale.

    **3.** Déterminer les limites de ces trois suites et interpréter le résultat.
  corrige: |
    *Modèle.* On note $X_{n} \in \{M, J, D\}$ l'activité du chat dans la tranche $[5n\,,5n + 5]$, de sorte que $m_{n} = \mathrm{P}(X_{n} = M)$, et de même pour $j_{n}$ et $d_{n}$. L'énoncé donne $X_{0} = M$, soit $\mu_{0} = (1, 0, 0)$, et les probabilités de transition, par exemple $\mathrm{P}_{(X_{n} = M)}(X_{n+1} = J) = \frac{1}{2}$, qui ne dépendent pas des tranches antérieures.

    **1.** Les événements $(X_{n} = M)$, $(X_{n} = J)$ et $(X_{n} = D)$ forment un système complet (proposition 11). La formule des probabilités totales (théorème 5), avec la convention $\mathrm{P}_{B}(A)\mathrm{P}(B) = 0$ lorsque $\mathrm{P}(B) = 0$, donne 
    $$m_{n+1} = \sum_{s \in \{M, J, D\}} \mathrm{P}_{(X_{n} = s)}(X_{n+1} = M)\,\mathrm{P}(X_{n} = s) = \frac{1}{2}m_{n} + \frac{1}{4}j_{n} + \frac{1}{4}d_{n},$$
     et de même $j_{n+1} = \frac{1}{2}m_{n}$ et $d_{n+1} = \frac{3}{4}j_{n} + \frac{3}{4}d_{n}$. Ces trois égalités s'écrivent $\mu_{n+1} = \mu_{n}T$, la ligne d'indice $s$ de $T$ contenant les probabilités de passer de l'état $s$ aux états $M$, $J$, $D$ : 
    $$\boxed{T = \begin{pmatrix} \tfrac{1}{2} & \tfrac{1}{2} & 0 \\[2pt] \tfrac{1}{4} & 0 & \tfrac{3}{4} \\[2pt] \tfrac{1}{4} & 0 & \tfrac{3}{4} \end{pmatrix}}, \qquad \mu_{n} = \mu_{0}T^{n} \text{ pour tout } n \in \mathbb{N}.$$

    ![Figure](documents/figures/953d6cdd9d0b8359.svg)

    Le graphe de la chaîne porte sur chaque flèche une probabilité de transition, comme celui de la chaîne à deux états de la section 21.5.7 ; les flèches issues d'un même état totalisent $1$, ce qui traduit la somme $1$ de chaque ligne de $T$.

    **2.** On cherche les vecteurs colonnes $V$ tels que $TV = \lambda V$. Pour $\lambda = 1$, la colonne $(1, 1, 1)^{T}$ convient, puisque chaque ligne de $T$ a pour somme $1$. Les deux dernières lignes de $T$ sont égales : $T$ n'est pas inversible, et la résolution de $TV = 0$ donne $V = (3, -3, -1)^{T}$. Enfin, la première ligne du système $TV = \frac{1}{4}V$ s'écrit $\frac{1}{4}v_{1} + \frac{1}{2}v_{2} = 0$, la troisième $\frac{1}{4}v_{1} + \frac{1}{2}v_{3} = 0$, et la deuxième en découle : le système équivaut à $v_{2} = v_{3} = -\frac{v_{1}}{2}$, et admet la solution $V = (2, -1, -1)^{T}$. Avec ces trois colonnes, 
    $$P = \begin{pmatrix} 1 & 2 & 3 \\ 1 & -1 & -3 \\ 1 & -1 & -1 \end{pmatrix}, \qquad \det P = -6, \qquad P^{-1} = \begin{pmatrix} \tfrac{1}{3} & \tfrac{1}{6} & \tfrac{1}{2} \\[2pt] \tfrac{1}{3} & \tfrac{2}{3} & -1 \\[2pt] 0 & -\tfrac{1}{2} & \tfrac{1}{2} \end{pmatrix}, \qquad \boxed{P^{-1}TP = \Delta = \begin{pmatrix} 1 & 0 & 0 \\ 0 & \tfrac{1}{4} & 0 \\ 0 & 0 & 0 \end{pmatrix}}$$
     Ainsi $T = P\Delta P^{-1}$ et $T^{n} = P\Delta^{n}P^{-1}$ (chapitre 16, matrices semblables), avec $\Delta^{n} = \mathrm{diag}\big(1, 4^{-n}, 0\big)$ pour $n \geqslant 1$. Comme $\mu_{0} = (1, 0, 0)$, la ligne $\mu_{n}$ est la première ligne de $T^{n}$, c'est-à-dire la première ligne de $P$, multipliée par $\Delta^{n}$, puis par $P^{-1}$ : pour $n \geqslant 1$, 
    $$\mu_{n} = \big(1, 2 \cdot 4^{-n}, 0\big)P^{-1}, \qquad \boxed{m_{n} = \frac{1}{3} + \frac{2}{3} \cdot \frac{1}{4^{n}}, \quad j_{n} = \frac{1}{6} + \frac{4}{3} \cdot \frac{1}{4^{n}}, \quad d_{n} = \frac{1}{2} - \frac{2}{4^{n}} \qquad (n \geqslant 1)}$$
     On contrôle pour $n = 1$ : $\mu_{1} = \big(\frac{1}{2}, \frac{1}{2}, 0\big)$, première ligne de $T$ ✓.

    *Piège.* Ces formules sont fausses pour $n = 0$ : elles donneraient $m_{0} = 1$, mais $j_{0} = \frac{3}{2}$ et $d_{0} = -\frac{3}{2}$. La raison est la valeur propre $0$ : $0^{n}$ vaut $0$ pour $n \geqslant 1$, mais $1$ pour $n = 0$, et la composante de $\mu_{0}$ selon le troisième vecteur, qui disparaît dès le premier pas, n'a pas été comptée. L'erreur la plus répandue est d'écrire $\Delta^{n} = \mathrm{diag}(1, 4^{-n}, 0)$ sans préciser $n \geqslant 1$.

    **3.** Comme $4^{-n}$ tend vers $0$, 
    $$\boxed{(m_{n}, j_{n}, d_{n}) \xrightarrow[n \to +\infty]{} \Big(\frac{1}{3}, \frac{1}{6}, \frac{1}{2}\Big)}$$
     et l'on vérifie que la ligne $\mu = \big(\frac{1}{3}, \frac{1}{6}, \frac{1}{2}\big)$ satisfait $\mu T = \mu$ : c'est la loi stationnaire de la chaîne. À long terme, le chat mange avec la probabilité $\frac{1}{3}$, joue avec la probabilité $\frac{1}{6}$ et dort avec la probabilité $\frac{1}{2}$, ce que l'on interprète comme les fractions de son temps consacrées à chaque activité. La convergence est très rapide : au bout d'une heure, soit douze tranches, l'écart à la limite est au plus $2 \cdot 4^{-12} \approx 1{,}2 \cdot 10^{-7}$, et le chat a oublié qu'il avait commencé par manger, comme la chaîne à deux états de la section 21.5.7 oublie le temps du premier jour.
