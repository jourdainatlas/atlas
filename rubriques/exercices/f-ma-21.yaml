  enonce: |
    On dispose d'un dé équilibré $A$, dont les faces sont numérotées de $1$ à $6$, et de sept dés équilibrés $D_{1}$, …, $D_{7}$ : pour tout $i \in \llbracket 1\,,7 \rrbracket$, le dé $D_{i}$ a $i - 1$ faces blanches et $7 - i$ faces noires. On lance le dé $A$. Si le résultat $i$ vaut $2$, $3$, $4$, $5$ ou $6$, on choisit le dé $D_{i}$ ; s'il vaut $1$, on relance le dé $A$, et l'on choisit le dé $D_{1}$ si le second résultat vaut $1$, $2$ ou $3$, et le dé $D_{7}$ sinon. On lance ensuite plusieurs fois le dé choisi ; sachant ce dé, les lancers sont mutuellement indépendants. On note $N_{k}$ l'événement « le $k$-ième lancer donne une face noire ».

    **1.** Calculer $\mathrm{P}(N_{1})$.

    **2.** Calculer $\mathrm{P}(N_{3} \mid N_{1} \cap N_{2})$.

    **3.** Calculer $P_{2} = \mathrm{P}_{N_{1}}(N_{2})$ puis, pour $n \geqslant 3$, $P_{n} = \mathrm{P}(N_{n} \mid N_{1} \cap \cdots \cap N_{n-1})$.

    **4.** Déterminer la limite de $(P_{n})$ et interpréter le résultat.
  corrige: |
    On note $\Delta_{i}$ l'événement « le dé choisi est $D_{i}$ ». Les deux lancers éventuels du dé $A$ étant indépendants, la famille $(\Delta_{1}, \dots, \Delta_{7})$ est un système complet, avec 
    $$\mathrm{P}(\Delta_{i}) = \frac{1}{6} \ \text{ pour } 2 \leqslant i \leqslant 6, \qquad \mathrm{P}(\Delta_{1}) = \mathrm{P}(\Delta_{7}) = \frac{1}{6} \times \frac{1}{2} = \frac{1}{12},$$
     de somme $\frac{5}{6} + \frac{1}{6} = 1$ ✓. Le dé $D_{i}$ a $7 - i$ faces noires sur $6$ : le dé $D_{1}$ est entièrement noir, le dé $D_{7}$ entièrement blanc. L'hypothèse dit que, pour chaque probabilité $\mathrm{P}_{\Delta_{i}}$, les événements $N_{k}$ sont mutuellement indépendants, de probabilité $\frac{7 - i}{6}$. Pour $m \geqslant 1$, la formule des probabilités totales donne donc 
    $$a_{m} = \mathrm{P}(N_{1} \cap \cdots \cap N_{m}) = \sum_{i=1}^{7} \Big(\frac{7 - i}{6}\Big)^{m}\mathrm{P}(\Delta_{i}) = \frac{1}{12} + \frac{1}{6}\sum_{j=1}^{5} \Big(\frac{j}{6}\Big)^{m},$$
     le dé $D_{1}$ contribuant $\frac{1}{12}$ et le dé $D_{7}$ rien.

    **1.** Avec $m = 1$ et $1 + 2 + \cdots + 5 = 15$ : 
    $$\mathrm{P}(N_{1}) = a_{1} = \frac{1}{12} + \frac{1}{6} \times \frac{15}{6} = \frac{3}{36} + \frac{15}{36}, \qquad \boxed{\mathrm{P}(N_{1}) = \frac{1}{2}}$$
     Ce résultat se prévoit par symétrie : l'échange des couleurs transforme le dé $D_{i}$ en le dé $D_{8-i}$, qui a la même probabilité d'être choisi.

    **2.** Avec $1^{2} + \cdots + 5^{2} = 55$ et $1^{3} + \cdots + 5^{3} = 225$, 
    $$a_{2} = \frac{1}{12} + \frac{55}{216} = \frac{73}{216}, \qquad a_{3} = \frac{1}{12} + \frac{225}{1\,296} = \frac{333}{1\,296},$$

    $$\mathrm{P}(N_{3} \mid N_{1} \cap N_{2}) = \frac{\mathrm{P}(N_{1} \cap N_{2} \cap N_{3})}{\mathrm{P}(N_{1} \cap N_{2})} = \frac{a_{3}}{a_{2}} = \frac{333}{6 \times 73}, \qquad \boxed{\mathrm{P}(N_{3} \mid N_{1} \cap N_{2}) = \frac{111}{146} \approx 0{,}760}$$

    **3.** De même, $P_{2} = \frac{a_{2}}{a_{1}}$ et, pour $n \geqslant 3$, $P_{n} = \frac{a_{n}}{a_{n-1}}$, ces quotients étant définis puisque $a_{m} \geqslant \frac{1}{12} > 0$ : 
    $$\boxed{P_{2} = \mathrm{P}_{N_{1}}(N_{2}) = \frac{73}{108} \approx 0{,}676, \qquad P_{n} = \frac{a_{n}}{a_{n-1}} = \frac{\frac{1}{12} + \frac{1}{6}\sum_{j=1}^{5} \big(\frac{j}{6}\big)^{n}}{\frac{1}{12} + \frac{1}{6}\sum_{j=1}^{5} \big(\frac{j}{6}\big)^{n-1}}}$$
     La formule vaut aussi pour $n = 2$, et une énumération exacte de toutes les issues (deux lancers du dé $A$, trois lancers du dé choisi) confirme $\mathrm{P}(N_{1}) = \frac{1}{2}$ et $\frac{111}{146}$ ✓.

    **4.** Pour $1 \leqslant j \leqslant 5$, la suite géométrique $\big(\frac{j}{6}\big)^{n}$ tend vers $0$, donc $a_{n}$ et $a_{n-1}$ tendent vers $\frac{1}{12}$ : 
    $$\boxed{\lim_{n \to +\infty} P_{n} = 1}$$
     Numériquement, $P_{3} \approx 0{,}760$, $P_{5} \approx 0{,}852$, $P_{10} \approx 0{,}942$ et $P_{20} \approx 0{,}990$. Après une longue suite de faces noires, il devient presque certain que le dé choisi est le dé $D_{1}$, entièrement noir : la formule de Bayes donne $\mathrm{P}(\Delta_{1} \mid N_{1} \cap \cdots \cap N_{n}) = \frac{1/12}{a_{n}} \to 1$, et la face suivante est alors noire à coup sûr.

    *Piège.* L'erreur la plus répandue est de croire les lancers indépendants pour la probabilité $\mathrm{P}$, et de répondre 
    $$\mathrm{P}(N_{3} \mid N_{1} \cap N_{2}) = \mathrm{P}(N_{3}) = \frac{1}{2}.$$
     Ils ne le sont que sachant le dé : on a $\mathrm{P}(N_{1} \cap N_{2}) = \frac{73}{216} \neq \frac{1}{4} = \mathrm{P}(N_{1})\mathrm{P}(N_{2})$, parce que chaque face noire renseigne sur le dé choisi, comme les $6$ de l'exercice 37.
