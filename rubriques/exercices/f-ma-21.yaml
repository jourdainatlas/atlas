  notions: [probabilite, variable-aleatoire]
  page_enonce: 27
  page_corrige: 104
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on considère une variable aléatoire $X_{n}$ de loi $\mathcal{U}(\llbracket 1\,,n \rrbracket)$, et l'on note $p_{n}$ la probabilité que le premier chiffre après la virgule, dans l'écriture décimale de $\sqrt{X_{n}}$, soit égal à $1$. Déterminer la nature et l'éventuelle limite de la suite $(p_{n})_{n \geqslant 1}$.
  corrige: |
    *Idée.* On découpe $\mathbb{N}^{*}$ en blocs $\llbracket m^{2}\,,(m + 1)^{2} - 1 \rrbracket$, sur lesquels la partie entière de $\sqrt{k}$ vaut $m$. Dans un bloc, la première décimale de $\sqrt{k}$ vaut $1$ lorsque $(m + 0{,}1)^{2} \leqslant k < (m + 0{,}2)^{2}$ : environ $0{,}2m$ entiers sur les $2m + 1$ du bloc, soit un dixième. Le bloc en cours n'a qu'environ $2\sqrt{n}$ éléments, négligeable devant $n$.

    *Le cadre.* On a $p_{n} = \frac{N(n)}{n}$, où $N(n)$ est le nombre d'entiers $k \in \llbracket 1\,,n \rrbracket$ dont la première décimale de $\sqrt{k}$ vaut $1$, c'est-à-dire tels que $\sqrt{k} - \lfloor \sqrt{k} \rfloor \in [0{,}1\,,0{,}2[$.

    **Comptage dans un bloc.** Soit $m \geqslant 1$ et $c_{m}$ le nombre d'entiers $k$ tels que $\lfloor \sqrt{k} \rfloor = m$ et dont la première décimale de $\sqrt{k}$ vaut $1$. Par croissance stricte de la racine carrée, ce sont les entiers de l'intervalle 
    $$\big[(m + 0{,}1)^{2}\,,(m + 0{,}2)^{2}\big[ \; = \; \big[m^{2} + 0{,}2m + 0{,}01\,,m^{2} + 0{,}4m + 0{,}04\big[,$$
     de longueur $0{,}2m + 0{,}03$. Un intervalle $[\alpha\,,\beta[$ de longueur $\lambda$ contient $\lceil\beta\rceil - \lceil\alpha\rceil$ entiers, nombre compris strictement entre $\lambda - 1$ et $\lambda + 1$. Ainsi 
    $$\frac{m}{5} - 1 < c_{m} < \frac{m}{5} + 2,$$
     ce que confirme le calcul pour $m < 3\,000$ ✓.

    **Encadrement.** Soit $n \geqslant 1$ et $M = \lfloor \sqrt{n} \rfloor \geqslant 1$, de sorte que $M^{2} \leqslant n < (M + 1)^{2}$. Les blocs $m = 1$, …, $M - 1$ sont contenus dans $\llbracket 1\,,n \rrbracket$, et $\llbracket 1\,,n \rrbracket$ est contenu dans la réunion des blocs $m = 1$, …, $M$. Avec la somme des entiers du chapitre 3, 
    $$N(n) \geqslant \sum_{m=1}^{M-1} \Big(\frac{m}{5} - 1\Big) = \frac{M(M - 1)}{10} - (M - 1), \qquad N(n) \leqslant \sum_{m=1}^{M} \Big(\frac{m}{5} + 2\Big) = \frac{M(M + 1)}{10} + 2M.$$
     En divisant par $n$, avec $M^{2} \leqslant n < (M + 1)^{2}$, et pour $M \geqslant 10$, de sorte que le minorant de $N(n)$ soit positif, 
    $$\frac{M(M - 1) - 10(M - 1)}{10(M + 1)^{2}} \leqslant p_{n} \leqslant \frac{M(M + 1) + 20M}{10M^{2}}.$$

    **Conclusion.** Quand $n$ tend vers $+\infty$, $M > \sqrt{n} - 1$ tend vers $+\infty$, et les deux membres extrêmes tendent vers $\frac{1}{10}$. Par le théorème des gendarmes, 
    $$\boxed{\text{la suite } (p_{n}) \text{ converge, et } \lim_{n \to +\infty} p_{n} = \frac{1}{10}}$$
     Le calcul exact donne $p_{10^{3}} = 0{,}099$, $p_{10^{5}} = 0{,}100\,17$ et $p_{10^{6}} = 0{,}099\,9$ ✓. La suite n'est pas monotone : dans chaque bloc, elle augmente sur la portion favorable puis diminue, mais l'amplitude de ces oscillations est en $O\big(\frac{1}{M}\big)$.

    *Remarque.* Le même calcul montre que chacun des dix chiffres est, à la limite, la première décimale de $\sqrt{k}$ avec la probabilité $\frac{1}{10}$, puisque l'intervalle correspondant au chiffre $c$ a pour longueur $0{,}2m + \frac{2c + 1}{100}$. Ce n'est pas un phénomène général : la proportion des entiers de $\llbracket 1\,,n \rrbracket$ dont le *premier chiffre* vaut $1$ n'a pas de limite. Elle vaut environ $\frac{1}{9}$ pour $n = 10^{6} - 1$, et environ $\frac{5}{9}$ pour $n = 2 \times 10^{6} - 1$ ✓, car les blocs de nombres de même longueur ont des tailles qui croissent géométriquement : le dernier bloc n'est plus négligeable devant les précédents. Ici, c'est la croissance seulement linéaire de la longueur $2m + 1$ des blocs qui rend le bloc en cours négligeable.
- id: "ma-21-109"
  feuille: "f-ma-21"
  numero: 109
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [indépendance, variables aléatoires, lois de Bernoulli et binomiale, variance]
  noeuds: [p-independance, p-variables, p-esperance]
  notions: [independance, variable-aleatoire, variance]
  page_enonce: 27
  page_corrige: 105
  enonce: |
    *L'inégalité de Harris.* Soit $T_{1}$, …, $T_{n}$ des variables aléatoires mutuellement indépendantes, de lois de Bernoulli de paramètres quelconques. On munit $\{0, 1\}^{n}$ de l'ordre produit : $(x_{1}, \dots, x_{n}) \leqslant (y_{1}, \dots, y_{n})$ si $x_{i} \leqslant y_{i}$ pour tout $i$. On appelle *variable croissante* toute variable de la forme $f(T_{1}, \dots, T_{n})$, où $f : \{0, 1\}^{n} \to \mathbb{R}$ est croissante pour cet ordre. Montrer que deux variables croissantes ont une covariance positive.
  corrige: |
    *Idée.* Pour $n = 1$, un calcul direct donne $\operatorname{Cov}\big(f(T_{1}), g(T_{1})\big) = p(1 - p)\big(f(1) - f(0)\big)\big(g(1) - g(0)\big) \geqslant 0$. Pour passer de $n - 1$ à $n$, on fixe la dernière coordonnée : à $T_{n}$ fixé, les deux fonctions restent croissantes en les $n - 1$ premières variables, et leurs moyennes en ces variables sont des fonctions croissantes de la dernière.

    On note $p_{i}$ le paramètre de $T_{i}$, et l'on doit montrer que $\mathrm{E}(fg) \geqslant \mathrm{E}(f)\,\mathrm{E}(g)$, où $\mathrm{E}(f)$ abrège $\mathrm{E}\big(f(T_{1}, \dots, T_{n})\big)$ (proposition 23 (i)). Pour $t' \in \{0, 1\}^{n-1}$ et $x \in \{0, 1\}$, on note $(t', x)$ l'élément de $\{0, 1\}^{n}$ obtenu en ajoutant $x$ à la fin de $t'$.

    **Le cas $n = 1$.** Soit $f$ et $g$ croissantes sur $\{0, 1\}$, et $p = p_{1}$, $q = 1 - p$. La formule de transfert donne 
    $$\mathrm{E}(fg) - \mathrm{E}(f)\,\mathrm{E}(g) = p f(1)g(1) + q f(0)g(0) - \big(pf(1) + qf(0)\big)\big(pg(1) + qg(0)\big).$$
     En utilisant $p - p^{2} = q - q^{2} = pq$, on obtient 
    $$\mathrm{E}(fg) - \mathrm{E}(f)\,\mathrm{E}(g) = pq\big(f(1)g(1) + f(0)g(0) - f(1)g(0) - f(0)g(1)\big) = pq\big(f(1) - f(0)\big)\big(g(1) - g(0)\big),$$
     qui est positif, puisque $f(1) \geqslant f(0)$ et $g(1) \geqslant g(0)$.

    **Un lemme de « conditionnement ».** Soit $n \geqslant 2$, $T' = (T_{1}, \dots, T_{n-1})$ et $h : \{0, 1\}^{n} \to \mathbb{R}$. Les variables $T'$ et $T_{n}$ sont indépendantes (théorème 7), donc la loi du couple $(T', T_{n})$ est le produit de ses lois marginales (proposition 15), et la formule de transfert donne 
    $$\mathrm{E}\big(h(T', T_{n})\big) = \sum_{t', x} h(t', x)\,\mathrm{P}(T' = t')\,\mathrm{P}(T_{n} = x) = \sum_{x \in \{0, 1\}} \mathrm{P}(T_{n} = x)\,\mathrm{E}\big(h(T', x)\big). \tag{L}$$
     C'est une moyenne pondérée, sur les valeurs de $T_{n}$, d'espérances calculées à $T_{n}$ fixé.

    **Hérédité.** Soit $n \geqslant 2$ ; supposons le résultat vrai pour $n - 1$ variables de Bernoulli indépendantes quelconques. Soit $f$ et $g$ croissantes sur $\{0, 1\}^{n}$. Pour $x \in \{0, 1\}$, les fonctions $f_{x} : t' \mapsto f(t', x)$ et $g_{x} : t' \mapsto g(t', x)$ sont croissantes sur $\{0, 1\}^{n-1}$, et les variables $T_{1}$, …, $T_{n-1}$ sont mutuellement indépendantes (proposition 15). L'hypothèse de récurrence donne 
    $$\mathrm{E}\big(f_{x}(T')\,g_{x}(T')\big) \geqslant F(x)\,G(x), \qquad\text{où}\quad F(x) = \mathrm{E}\big(f(T', x)\big), \quad G(x) = \mathrm{E}\big(g(T', x)\big).$$
     Les fonctions $F$ et $G$ sont croissantes sur $\{0, 1\}$ : pour tout $t'$, $(t', 0) \leqslant (t', 1)$, donc $f(t', 0) \leqslant f(t', 1)$, et la croissance de l'espérance donne $F(0) \leqslant F(1)$ ; de même pour $G$. Le lemme (L), appliqué à $h = fg$, puis l'hypothèse de récurrence, multipliée par les poids positifs $\mathrm{P}(T_{n} = x)$, donnent 
    $$\mathrm{E}(fg) = \sum_{x} \mathrm{P}(T_{n} = x)\,\mathrm{E}\big(f_{x}(T')\,g_{x}(T')\big) \geqslant \sum_{x} \mathrm{P}(T_{n} = x)\,F(x)G(x) = \mathrm{E}\big(F(T_{n})\,G(T_{n})\big).$$
     Le cas $n = 1$, appliqué à $F$, $G$ et à la variable $T_{n}$, donne ensuite 
    $$\mathrm{E}\big(F(T_{n})\,G(T_{n})\big) \geqslant \mathrm{E}\big(F(T_{n})\big)\,\mathrm{E}\big(G(T_{n})\big) = \mathrm{E}(f)\,\mathrm{E}(g),$$
     la dernière égalité étant le lemme (L) appliqué à $h = f$ et à $h = g$. Ainsi $\mathrm{E}(fg) \geqslant \mathrm{E}(f)\,\mathrm{E}(g)$, et, par récurrence sur $n$, 
    $$\boxed{\operatorname{Cov}\big(f(T_{1}, \dots, T_{n}), g(T_{1}, \dots, T_{n})\big) \geqslant 0 \ \text{ pour toutes } f, g \text{ croissantes}}$$
     L'inégalité a été testée sur $300$ couples de fonctions croissantes tirées au hasard, avec $n \leqslant 4$ et des paramètres quelconques ✓.

    *Remarques.*

    • L'hypothèse d'indépendance est indispensable. Si $T_{1}$ suit la loi $\mathcal{B}(\frac{1}{2})$ et $T_{2} = 1 - T_{1}$, les variables $T_{1}$ et $T_{2}$ sont croissantes, puisque ce sont les images de $(T_{1}, T_{2})$ par les deux projections, qui sont croissantes pour l'ordre produit. Mais $T_{1}T_{2} = 0$, et $\operatorname{Cov}(T_{1}, T_{2}) = 0 - \frac{1}{4} = -\frac{1}{4}$.

    • Avec des indicatrices, le résultat s'écrit $\mathrm{P}(A \cap B) \geqslant \mathrm{P}(A)\,\mathrm{P}(B)$ pour deux événements croissants, c'est-à-dire stables quand on fait passer des coordonnées de $0$ à $1$. Pour le graphe aléatoire de la section 21.6.3, dont les arêtes sont des variables de Bernoulli indépendantes, « le graphe contient un triangle » et « le graphe est connexe » sont croissants : ces deux événements sont positivement corrélés, sans aucun calcul.

    • Le cas $n = 1$ est celui de l'exemple du cours qui suit la proposition 23 : deux fonctions croissantes d'une même variable ont une covariance positive. L'inégalité de Harris l'étend à plusieurs variables indépendantes ; elle a été généralisée par Fortuin, Kasteleyn et Ginibre à des lois non produits (inégalité FKG).
- id: "ma-21-110"
  feuille: "f-ma-21"
  numero: 110
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [coefficients binomiaux]
  noeuds: [pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 27
  page_corrige: 106
  enonce: |
    Soit $n$ et $p$ deux entiers naturels non nuls. Démontrer, par un argument de dénombrement, que 
    $$\sum_{\substack{(i_{1}, \dots, i_{p}) \in \mathbb{N}^{p} \\ i_{1} + \cdots + i_{p} = n}} i_{1}i_{2}\cdots i_{p} = \binom{n + p - 1}{2p - 1}.$$
  corrige: |
    *Idée.* Le produit $i_{1} \cdots i_{p}$ compte les façons de marquer un objet dans chacun de $p$ blocs consécutifs de tailles $i_{1}$, …, $i_{p}$. On code un découpage de $n$ objets alignés, avec un objet marqué par bloc, en insérant $p - 1$ cases séparatrices : on obtient une rangée de $n + p - 1$ cases, dans laquelle les $p$ cases marquées et les $p - 1$ séparateurs forment $2p - 1$ cases qui alternent.

    *Les configurations.* Si l'un des $i_{k}$ est nul, le produit est nul : la somme porte en fait sur les $p$-uplets d'entiers $i_{k} \geqslant 1$ de somme $n$. Pour un tel $p$-uplet, le produit $i_{1} \cdots i_{p}$ est le nombre de $p$-uplets $(j_{1}, \dots, j_{p})$ tels que $1 \leqslant j_{k} \leqslant i_{k}$ (proposition 2 (iv)). Le membre de gauche est donc le cardinal de l'ensemble $\mathcal{C}$ des *configurations* $\big((i_{k}), (j_{k})\big)$, avec $i_{k} \geqslant 1$, $\sum i_{k} = n$ et $1 \leqslant j_{k} \leqslant i_{k}$ : on range $n$ objets en $p$ blocs consécutifs non vides de tailles $i_{1}$, …, $i_{p}$, et l'on marque l'objet de rang $j_{k}$ dans le bloc $k$.

    *Le codage.* On note $I_{k} = i_{1} + \cdots + i_{k}$, avec $I_{0} = 0$, et l'on associe à une configuration les entiers 
    $$c_{2k-1} = I_{k-1} + (k - 1) + j_{k} \quad (1 \leqslant k \leqslant p), \qquad c_{2k} = I_{k} + k \quad (1 \leqslant k \leqslant p - 1).$$
     Dans la rangée de $n + p - 1$ cases, où l'on a inséré une case séparatrice après chacun des $p - 1$ premiers blocs, $c_{2k}$ est la position du $k$-ième séparateur et $c_{2k-1}$ celle de l'objet marqué du bloc $k$. On a $1 \leqslant c_{1} = j_{1}$, $c_{2p-1} \leqslant I_{p} + p - 1 = n + p - 1$, et la suite est strictement croissante : 
    $$c_{2k-1} \leqslant I_{k} + k - 1 < I_{k} + k = c_{2k}, \qquad c_{2k} = I_{k} + k < I_{k} + k + j_{k+1} = c_{2k+1}.$$
     On définit ainsi une application $\Phi$ de $\mathcal{C}$ dans l'ensemble des parties à $2p - 1$ éléments de $\llbracket 1\,,n + p - 1 \rrbracket$.

    *La réciproque.* Soit $c_{1} < \cdots < c_{2p-1}$ des éléments de $\llbracket 1\,,n + p - 1 \rrbracket$, et $c_{0} = 0$, $c_{2p} = n + p$. On pose 
    $$i_{k} = c_{2k} - c_{2k-2} - 1, \qquad j_{k} = c_{2k-1} - c_{2k-2} \qquad (1 \leqslant k \leqslant p).$$
     Comme $c_{2k} - c_{2k-2} \geqslant 2$, on a $i_{k} \geqslant 1$ ; on a aussi $1 \leqslant j_{k} \leqslant c_{2k} - 1 - c_{2k-2} = i_{k}$, et la somme télescopique donne $\sum i_{k} = c_{2p} - c_{0} - p = n$. On obtient une configuration, et l'on vérifie que les deux constructions sont réciproques l'une de l'autre : partant d'une configuration, $c_{2k} - c_{2k-2} - 1 = i_{k}$ et $c_{2k-1} - c_{2k-2} = j_{k}$ ; partant des $c$, on retrouve $I_{k} + k = c_{2k}$ en sommant, puis $c_{2k-1}$. L'application $\Phi$ est une bijection (chapitre 2), et le théorème 2 donne 
    $$\boxed{\sum_{\substack{(i_{1}, \dots, i_{p}) \in \mathbb{N}^{p} \\ i_{1} + \cdots + i_{p} = n}} i_{1}i_{2}\cdots i_{p} = |\mathcal{C}| = \binom{n + p - 1}{2p - 1}}$$
     avec la convention $\binom{n + p - 1}{2p - 1} = 0$ lorsque $p > n$ : les deux membres sont alors nuls, puisque $p$ blocs non vides demandent au moins $p$ objets.

    ![Figure](documents/figures/cea927c6b1a5795e.svg)

    Pour $n = 7$ et $p = 3$, la configuration formée des blocs de tailles $(2, 3, 2)$ et des rangs marqués $(2, 1, 2)$ est codée par les cases $\{2, 3, 4, 7, 9\}$ parmi $9$ : les séparateurs, en bleu, occupent les cases $3$ et $7$, et les objets marqués, en ocre plein, les cases $2$, $4$ et $9$. Pour $n = 4$ et $p = 2$, on trouve $0 \times 4 + 1 \times 3 + 2 \times 2 + 3 \times 1 + 4 \times 0 = 10 = \binom{5}{3}$, et l'identité a été vérifiée pour $n \leqslant 10$ et $p \leqslant 5$, ainsi que la bijection pour quelques couples $(n, p)$ ✓.

    *À retenir.* Pour $p = 2$, on obtient $\sum_{i=0}^{n} i(n - i) = \binom{n + 1}{3}$, que l'on retrouve par le calcul avec les sommes du chapitre 3. Ranger des objets et des séparateurs dans une même rangée est aussi la façon de compter les $p$-uplets d'entiers naturels de somme $n$, au nombre de $\binom{n + p - 1}{n}$ : c'est la case hors programme du tableau de la section 21.2.6, où l'on choisit $n$ éléments parmi $p$, avec répétitions et sans ordre.

