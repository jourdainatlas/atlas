  enonce: |
    *Génotypes.* Un gène existe sous deux formes, ou *allèles*, $A$ et $B$ ; chaque individu porte deux allèles, et l'on distingue trois *génotypes* : $1$ pour $AA$, $2$ pour $AB$ et $3$ pour $BB$. Seuls les individus de génotype $3$ sont malades. Pour $n \in \mathbb{N}$, on note $u_{1}(n)$, $u_{2}(n)$ et $u_{3}(n)$ les proportions des trois génotypes à la génération $n$. On modélise la naissance d'un enfant de la génération $n + 1$ ainsi : les génotypes $P$ du père et $M$ de la mère sont deux variables indépendantes de loi $\big(u_{1}(n), u_{2}(n), u_{3}(n)\big)$, et, sachant les génotypes des parents, l'enfant reçoit un allèle de chacun d'eux, choisi au hasard parmi les deux allèles de ce parent, les deux choix étant indépendants. On note $E$ le génotype de l'enfant, et l'on admet que $u_{i}(n + 1) = \mathrm{P}(E = i)$.

    **1.** Calculer les probabilités $\mathrm{P}_{((P, M) = (i, j))}(E = 1)$ pour $i$, $j \in \{1, 2, 3\}$.

    **2.** En déduire la loi de $E$ en fonction des $u_{i}(n)$.

    **3.** On pose $\theta(n) = u_{1}(n) + \frac{1}{2}u_{2}(n)$, proportion de l'allèle $A$ à la génération $n$. Exprimer $u_{1}(n + 1)$, $u_{2}(n + 1)$ et $u_{3}(n + 1)$ en fonction de $\theta(n)$.

    **4.** Montrer que $\theta(n + 1) = \theta(n)$, puis que les proportions des trois génotypes, et en particulier la proportion de malades, sont les mêmes à toutes les générations $n \geqslant 1$.
  corrige: |
    On note $\alpha_{1} = 1$, $\alpha_{2} = \frac{1}{2}$ et $\alpha_{3} = 0$ : pour un parent de génotype $i$, l'allèle transmis, choisi au hasard parmi ses deux allèles, est $A$ avec la probabilité $\alpha_{i}$ (deux allèles $A$, un seul, ou aucun), et $B$ avec la probabilité $1 - \alpha_{i}$.

    **1.** L'enfant est de génotype $1$ si et seulement s'il reçoit l'allèle $A$ de chacun de ses parents. Sachant $(P, M) = (i, j)$, les deux choix sont indépendants, d'où $\mathrm{P}_{((P, M) = (i, j))}(E = 1) = \alpha_{i}\alpha_{j}$ : 
    $$\boxed{\begin{array}{c|ccc} \mathrm{P}_{((P, M) = (i, j))}(E = 1) & j = 1 & j = 2 & j = 3 \\ \hline i = 1 & 1 & \tfrac{1}{2} & 0 \\[2pt] i = 2 & \tfrac{1}{2} & \tfrac{1}{4} & 0 \\[2pt] i = 3 & 0 & 0 & 0 \end{array}}$$
     De même, l'enfant est de génotype $3$ s'il reçoit $B$ de chacun, avec la probabilité $(1 - \alpha_{i})(1 - \alpha_{j})$, et de génotype $2$ dans les autres cas, avec la probabilité $\alpha_{i}(1 - \alpha_{j}) + (1 - \alpha_{i})\alpha_{j}$.

    **2.** Les événements $\big((P, M) = (i, j)\big)$, pour $(i, j) \in \{1, 2, 3\}^{2}$, forment un système complet (proposition 11), et $\mathrm{P}\big((P, M) = (i, j)\big) = u_{i}(n)u_{j}(n)$ par indépendance de $P$ et $M$. On abrège $u_{i}(n)$ en $u_{i}$. La formule des probabilités totales donne, en reconnaissant le développement d'un carré, 
    $$\mathrm{P}(E = 1) = \sum_{i=1}^{3}\sum_{j=1}^{3} \alpha_{i}\alpha_{j}u_{i}u_{j} = \Big(\sum_{i=1}^{3} \alpha_{i}u_{i}\Big)^{2},$$
     et de même pour les autres valeurs, avec $\sum_{i} (1 - \alpha_{i})u_{i} = u_{3} + \frac{1}{2}u_{2}$ : 
    $$\boxed{\mathrm{P}(E = 1) = \Big(u_{1} + \frac{u_{2}}{2}\Big)^{2}, \qquad \mathrm{P}(E = 2) = 2\Big(u_{1} + \frac{u_{2}}{2}\Big)\Big(u_{3} + \frac{u_{2}}{2}\Big), \qquad \mathrm{P}(E = 3) = \Big(u_{3} + \frac{u_{2}}{2}\Big)^{2}}$$
     La somme vaut $\big(u_{1} + u_{2} + u_{3}\big)^{2} = 1$ ✓.

    **3.** Comme $u_{1} + u_{2} + u_{3} = 1$, on a $u_{3} + \frac{1}{2}u_{2} = 1 - \theta(n)$. En notant $\theta = \theta(n)$, 
    $$\boxed{u_{1}(n + 1) = \theta^{2}, \qquad u_{2}(n + 1) = 2\theta(1 - \theta), \qquad u_{3}(n + 1) = (1 - \theta)^{2}}$$
     Ce sont les probabilités de la loi $\mathcal{B}(2,\theta)$ pour le nombre d'allèles $A$ de l'enfant, qui vaut $2$, $1$ ou $0$ selon que son génotype est $1$, $2$ ou $3$ : tout se passe comme si l'enfant recevait deux allèles tirés indépendamment dans le stock de la génération $n$, où la proportion de $A$ est $\theta$.

    **4.** On calcule 
    $$\theta(n + 1) = u_{1}(n + 1) + \frac{1}{2}u_{2}(n + 1) = \theta^{2} + \theta(1 - \theta), \qquad \boxed{\theta(n + 1) = \theta(n)}$$
     La suite $(\theta(n))$ est donc constante, égale à $\theta(0)$, et la question 3 donne, pour tout $n \geqslant 1$, 
    $$\boxed{u(n) = \Big(\theta(0)^{2},\ 2\theta(0)\big(1 - \theta(0)\big),\ \big(1 - \theta(0)\big)^{2}\Big), \qquad \text{proportion de malades } u_{3}(n) = \big(1 - \theta(0)\big)^{2}}$$
     Les proportions sont les mêmes à toutes les générations $n \geqslant 1$, mais pas forcément à la génération $0$. Par exemple, si $u(0) = \big(\frac{1}{2}, 0, \frac{1}{2}\big)$, alors $\theta(0) = \frac{1}{2}$ et $u(n) = \big(\frac{1}{4}, \frac{1}{2}, \frac{1}{4}\big)$ pour tout $n \geqslant 1$ : la moitié de la population initiale est malade, mais un quart seulement des générations suivantes.

    *À retenir.* Ce résultat, publié indépendamment par G. H. Hardy et W. Weinberg en 1908, est connu sous le nom d'équilibre de Hardy-Weinberg : dans ce modèle, le hasard des unions ne fait ni disparaître ni progresser une maladie récessive, et l'équilibre est atteint dès la première génération. Le calcul repose sur l'indépendance des deux parents et des deux transmissions ; il cesse de valoir si les malades ont moins d'enfants, ou si les unions ne se font pas au hasard.
- id: "ma-21-53"
  feuille: "f-ma-21"
  numero: 53
