  page_enonce: 12
  page_corrige: 41
  enonce: |
    Deux joueurs $A$ et $B$ jouent au plus $2n$ parties, alternativement, $A$ jouant la première. Lorsque c'est son tour, $A$ gagne la partie avec la probabilité $a \in \left]0\,,1\right[$, et $B$ gagne la sienne avec la probabilité $b \in \left]0\,,1\right[$, les parties étant indépendantes. Le premier qui gagne une partie remporte le jeu ; si aucune des $2n$ parties n'est gagnée, le jeu est nul.

    **1.** Quelle est la probabilité que le jeu soit nul ?

    **2.** Quelles sont les probabilités que $A$ remporte le jeu, que $B$ le remporte ?

    **3.** À quelle condition le jeu est-il équitable, c'est-à-dire les deux joueurs ont-ils la même probabilité de gagner ? Interpréter cette condition.
  corrige: |
    On modélise les parties par des événements $W_{1}$, …, $W_{2n}$ mutuellement indépendants, où $W_{k}$ signifie « le joueur dont c'est le tour gagnerait la $k$-ième partie, si elle avait lieu », avec $\mathrm{P}(W_{k}) = a$ pour $k$ impair (tour de $A$) et $\mathrm{P}(W_{k}) = b$ pour $k$ pair (tour de $B$). Un tel modèle existe : la proposition 17 (section 21.5.6) le fournit sur $\Omega = \{0, 1\}^{2n}$. On note $r = (1 - a)(1 - b) \in \left]0\,,1\right[$, probabilité qu'un tour complet, formé d'une partie de $A$ et d'une partie de $B$, ne donne aucun vainqueur.

    ![Figure](documents/figures/88534e7ba3bd96ea.svg)

    Le jeu se lit le long de la chaîne : à chaque partie, le joueur gagne et le jeu s'arrête, ou il perd et la main passe. Chaque tour complet sans vainqueur multiplie par $r$ la probabilité du chemin.

    **1.** Le jeu est nul si aucune des $2n$ parties n'est gagnée, c'est-à-dire si $\overline{W_{1}} \cap \cdots \cap \overline{W_{2n}}$ est réalisé. Par la proposition 10 (iii), 
    $$\boxed{\mathrm{P}(\text{jeu nul}) = (1 - a)^{n}(1 - b)^{n} = r^{n}}$$

    **2.** Le joueur $A$ remporte le jeu si la première partie gagnée est une partie d'indice impair $2j + 1$, avec $0 \leqslant j \leqslant n - 1$, c'est-à-dire si l'un des événements deux à deux incompatibles $\overline{W_{1}} \cap \cdots \cap \overline{W_{2j}} \cap W_{2j+1}$ est réalisé ; ce dernier a pour probabilité $r^{j}a$. De même, $B$ gagne à la partie $2j + 2$ avec la probabilité $r^{j}(1 - a)b$. En sommant les suites géométriques de raison $r \neq 1$, 
    $$\boxed{\mathrm{P}(A \text{ gagne}) = a\,\frac{1 - r^{n}}{1 - r}, \qquad \mathrm{P}(B \text{ gagne}) = (1 - a)b\,\frac{1 - r^{n}}{1 - r}}$$
     On contrôle que les trois probabilités totalisent $1$ : comme $1 - r = a + b - ab = a + (1 - a)b$, la somme des deux premières vaut $1 - r^{n}$ ✓. Une énumération exacte pour $n = 2$, $a = \frac{1}{3}$, $b = \frac{1}{5}$ confirme les trois formules.

    **3.** Le jeu est équitable si et seulement si $\mathrm{P}(A \text{ gagne}) = \mathrm{P}(B \text{ gagne})$, c'est-à-dire, puisque $1 - r^{n} > 0$, 
    $$\boxed{a = (1 - a)\,b, \qquad\text{soit}\qquad b = \frac{a}{1 - a}}$$
     Cette condition ne dépend pas de $n$, et elle impose $\frac{a}{1 - a} < 1$, c'est-à-dire $a < \frac{1}{2}$ ; par exemple, $a = \frac{1}{3}$ et $b = \frac{1}{2}$. Elle dit que $A$ et $B$ ont la même probabilité de gagner lors du premier tour : $A$ gagne d'emblée avec la probabilité $a$, tandis que $B$ ne joue que si $A$ a perdu, et gagne alors avec la probabilité $(1 - a)b$. Chaque tour suivant reproduit la même situation, à un facteur $r$ près, ce qui explique que $n$ n'intervienne pas. L'avantage de jouer en premier doit être compensé par une meilleure probabilité de succès pour le second joueur, $b > a$ ; si $a \geqslant \frac{1}{2}$, aucune valeur de $b$ ne compense cet avantage.

    *À retenir.* Pour un jeu « au premier qui réussit », on découpe l'événement selon le rang du premier succès : ces événements sont incompatibles, et chacun est une intersection d'événements indépendants. C'est la même décomposition qu'à la question 3 de l'exercice 30, où l'on découpait selon le rang du $(n + 1)$-ième pile.
- id: "ma-21-45"
  feuille: "f-ma-21"
