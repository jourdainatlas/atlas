  page_enonce: 15
  page_corrige: 52
  enonce: |
    **1.** Soit $X_{1}$ et $X_{2}$ deux variables indépendantes, de lois $\mathcal{B}(p_{1})$ et $\mathcal{B}(p_{2})$. Montrer que $X_{1}^{2}$, $1 - X_{1}$ et $X_{1}X_{2}$ suivent des lois de Bernoulli, dont on précisera les paramètres.

    **2.** Soit $p$, $q \in [0\,,1]$. Déterminer toutes les lois conjointes possibles d'un couple $(X, Y)$ tel que $X \sim \mathcal{B}(p)$ et $Y \sim \mathcal{B}(q)$. On les paramétrera par $t = \mathrm{P}(X = 1, Y = 1)$, dont on précisera l'ensemble des valeurs possibles à l'aide de l'exercice 23. Pour quelle valeur de $t$ les variables $X$ et $Y$ sont-elles indépendantes ?
  corrige: |
    **1.** Les variables $X_{1}$ et $X_{2}$ prennent leurs valeurs dans $\{0, 1\}$.

    • Comme $0^{2} = 0$ et $1^{2} = 1$, on a $X_{1}^{2} = X_{1}$, et $\boxed{X_{1}^{2} \sim \mathcal{B}(p_{1})}$.

    • La variable $1 - X_{1}$ est à valeurs dans $\{0, 1\}$, et $\mathrm{P}(1 - X_{1} = 1) = \mathrm{P}(X_{1} = 0) = 1 - p_{1}$ : $\boxed{1 - X_{1} \sim \mathcal{B}(1 - p_{1})}$.

    • Le produit $X_{1}X_{2}$ est à valeurs dans $\{0, 1\}$, et il vaut $1$ si et seulement si $X_{1} = X_{2} = 1$ ; par indépendance, $\mathrm{P}(X_{1}X_{2} = 1) = \mathrm{P}(X_{1} = 1)\mathrm{P}(X_{2} = 1)$, et $\boxed{X_{1}X_{2} \sim \mathcal{B}(p_{1}p_{2})}$.

    En termes d'événements, ces trois variables sont les indicatrices de $A_{1}$, de $\overline{A_{1}}$ et de $A_{1} \cap A_{2}$, où $A_{i} = (X_{i} = 1)$.

    **2.** Soit $t = \mathrm{P}(X = 1, Y = 1)$. Par la proposition 14, les lois marginales s'obtiennent en sommant les lignes et les colonnes de la loi conjointe, ce qui détermine les trois autres cases : 
    $$\boxed{\begin{array}{c|cc|c} & Y = 0 & Y = 1 & \\ \hline X = 0 & 1 - p - q + t & q - t & 1 - p \\ X = 1 & p - t & t & p \\ \hline & 1 - q & q & 1 \end{array}}$$
     Ces quatre nombres doivent être positifs, ce qui donne $t \geqslant 0$, $t \leqslant p$, $t \leqslant q$ et $t \geqslant p + q - 1$ : 
    $$\boxed{\max(0, p + q - 1) \leqslant t \leqslant \min(p, q)}$$
     C'est l'encadrement de l'exercice 23, appliqué aux événements $(X = 1)$ et $(Y = 1)$. Réciproquement, pour tout $t$ de cet intervalle, les quatre nombres du tableau forment une distribution de probabilités sur $\{0, 1\}^{2}$, de somme $1$ ; en munissant $\Omega = \{0, 1\}^{2}$ de la probabilité qu'elle définit (théorème 4) et en prenant pour $X$ et $Y$ les deux projections, on obtient un couple qui a cette loi conjointe. Toutes ces lois conjointes sont donc possibles.

    Par la proposition 15, $X$ et $Y$ sont indépendantes si et seulement si chaque case est le produit des marges, et la case $(1, 1)$ impose $t = pq$. Réciproquement, pour $t = pq$, les trois autres cases valent $p(1 - q)$, $(1 - p)q$ et $(1 - p)(1 - q)$, produits des marges, et 
    $$\boxed{X \perp\!\!\!\perp Y \iff t = pq}$$
     Cette valeur appartient bien à l'intervalle : $pq \leqslant \min(p, q)$, et $pq - (p + q - 1) = (1 - p)(1 - q) \geqslant 0$. L'exemple illustre la remarque de la section 21.5.4 : les lois marginales $\mathcal{B}(p)$ et $\mathcal{B}(q)$ sont compatibles avec toute une famille de lois conjointes, à un paramètre, dont une seule rend les variables indépendantes.
