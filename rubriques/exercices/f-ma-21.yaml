  enonce: |
    Chaque étudiant d'un groupe étudie exactement une langue, l'anglais ou l'allemand, et suit exactement une option, parmi l'informatique, la chimie et l'astronomie. On sait que $12$ étudiants suivent l'astronomie, $15$ la chimie, et que $16$ étudient l'allemand ; parmi eux, $8$ suivent l'astronomie et étudient l'anglais, $3$ suivent l'informatique et étudient l'anglais, et $6$ suivent la chimie et étudient l'allemand. Dresser le tableau de la répartition des étudiants selon leur langue et leur option, puis déterminer l'effectif du groupe.
  corrige: |
    Chaque étudiant a exactement une langue et exactement une option : les six ensembles d'étudiants définis par un couple (langue, option) sont deux à deux disjoints et recouvrent le groupe. On note $a_{\mathrm{I}}$, $a_{\mathrm{C}}$, $a_{\mathrm{A}}$ les effectifs des étudiants d'anglais qui suivent l'informatique, la chimie et l'astronomie, et $g_{\mathrm{I}}$, $g_{\mathrm{C}}$, $g_{\mathrm{A}}$ ceux des étudiants d'allemand. Par la proposition 2 (i), l'effectif d'une option est la somme des effectifs de ses deux cases, et celui d'une langue la somme de ses trois cases. Les données s'écrivent 
    $$a_{\mathrm{A}} = 8, \quad a_{\mathrm{I}} = 3, \quad g_{\mathrm{C}} = 6, \quad a_{\mathrm{A}} + g_{\mathrm{A}} = 12, \quad a_{\mathrm{C}} + g_{\mathrm{C}} = 15, \quad g_{\mathrm{I}} + g_{\mathrm{C}} + g_{\mathrm{A}} = 16,$$
     d'où successivement $g_{\mathrm{A}} = 12 - 8 = 4$, $a_{\mathrm{C}} = 15 - 6 = 9$ et $g_{\mathrm{I}} = 16 - 6 - 4 = 6$.

    $$\begin{array}{|l|c|c|c|c|} \hline  & \text{Informatique} & \text{Chimie} & \text{Astronomie} & \text{Total} \\ \hline \text{Anglais} & 3 & 9 & 8 & 20 \\ \hline \text{Allemand} & 6 & 6 & 4 & 16 \\ \hline \text{Total} & 9 & 15 & 12 & \mathbf{36} \\ \hline \end{array}$$

    On lit dans la dernière case l'effectif du groupe, obtenu en sommant indifféremment la dernière ligne ou la dernière colonne. 
    $$\boxed{\text{Le groupe compte } 36 \text{ étudiants, dont } 20 \text{ étudient l'anglais}}$$
     *Piège.* Sans l'hypothèse « exactement une langue et exactement une option », le problème n'a pas de solution unique : un étudiant qui suivrait deux options serait compté deux fois dans les effectifs des options. C'est l'hypothèse de partition qui autorise l'addition des cases.
- id: "ma-21-05"
  feuille: "f-ma-21"
  numero: 5
  partie: "Dénombrement"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Le *diamètre* d'une partie non vide $A$ de $\llbracket 1\,,n \rrbracket$ est l'entier $\max A - \min A$. Pour tout $k \in \mathbb{N}$, déterminer le nombre de parties de $\llbracket 1\,,n \rrbracket$ de diamètre $k$. On vérifiera que la somme de ces nombres vaut $2^{n} - 1$.
  corrige: |
    On note $N_{k}$ le nombre de parties de $\llbracket 1\,,n \rrbracket$ de diamètre $k$. Le diamètre d'une partie non vide est compris entre $0$ et $n - 1$, donc $N_{k} = 0$ pour $k \geqslant n$. Une partie de diamètre $0$ a son minimum égal à son maximum : c'est un singleton, et $N_{0} = n$.

    Soit $k \in \llbracket 1\,,n - 1 \rrbracket$. Une partie $A$ de diamètre $k$ est déterminée par son minimum $a$ et par l'ensemble $A \cap \llbracket a + 1\,,a + k - 1 \rrbracket$ de ses éléments compris strictement entre $a$ et $a + k$. Réciproquement, pour $a \in \llbracket 1\,,n - k \rrbracket$ et $B$ une partie quelconque de l'intervalle $\llbracket a + 1\,,a + k - 1 \rrbracket$, qui a $k - 1$ éléments, la partie $\{a\} \cup B \cup \{a + k\}$ est contenue dans $\llbracket 1\,,n \rrbracket$ et a pour diamètre $k$. On a ainsi une bijection entre les parties de diamètre $k$ et les couples $(a, B)$ ; il y a $n - k$ choix de $a$ et, pour chacun, $2^{k-1}$ choix de $B$ (proposition 3). 
    $$\boxed{N_{0} = n, \qquad N_{k} = (n - k)\,2^{k-1} \text{ pour } 1 \leqslant k \leqslant n - 1, \qquad N_{k} = 0 \text{ pour } k \geqslant n}$$
     Pour la vérification, on écrit $n - k = \sum_{j=k}^{n-1} 1$ et l'on intervertit les sommes (chapitre 3, proposition 8) : 
    $$\sum_{k=1}^{n-1} (n - k)2^{k-1} = \sum_{j=1}^{n-1}\,\sum_{k=1}^{j} 2^{k-1} = \sum_{j=1}^{n-1} \big(2^{j} - 1\big) = \big(2^{n} - 2\big) - (n - 1) = 2^{n} - n - 1.$$

    $$\boxed{\sum_{k \geqslant 0} N_{k} = n + 2^{n} - n - 1 = 2^{n} - 1}$$
     C'est bien le nombre de parties non vides de $\llbracket 1\,,n \rrbracket$ (proposition 3) ✓ : les parties non vides se répartissent selon leur diamètre en morceaux disjoints. Lu dans l'autre sens, ce dénombrement est une démonstration combinatoire de l'identité $\sum_{k=1}^{n-1} (n - k)2^{k-1} = 2^{n} - n - 1$.
- id: "ma-21-06"
  feuille: "f-ma-21"
  numero: 6
  partie: "Dénombrement"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Un jeu de $32$ cartes comporte quatre couleurs, cœur, carreau, trèfle et pique, et huit hauteurs, $7$, $8$, $9$, $10$, valet, dame, roi et as. Une *main* est un ensemble de cinq cartes de ce jeu. Combien y a-t-il de mains

    **(a)** formées de cinq cœurs ou de cinq trèfles ?

    **(b)** formées de deux cœurs et de trois trèfles ?

    **(c)** contenant au plus un as ?

    **(d)** contenant exactement deux as et exactement trois cœurs ?

    **(e)** contenant exactement un as et au moins trois carreaux ?

    **(f)** contenant au plus un cœur et au moins deux rois ?

    Pour les questions (d), (e) et (f), on prendra garde aux cartes qui satisfont à deux conditions à la fois.
  corrige: |
    Une main est une partie à cinq éléments du jeu de $32$ cartes ; il y en a $\binom{32}{5} = 201\,376$ (théorème 2). Pour chaque question, on découpe l'ensemble des mains à compter en morceaux disjoints, et l'on compte chaque morceau en choisissant séparément les cartes de chaque catégorie, ce que justifie la proposition 2 (iv). Dans le jeu, une couleur compte $8$ cartes, une hauteur $4$ cartes.

    **(a)** Les mains de cinq cœurs et celles de cinq trèfles forment deux ensembles disjoints, de $\binom{8}{5}$ éléments chacun. 
    $$\boxed{2\binom{8}{5} = 112}$$

    **(b)** On choisit deux cœurs parmi huit, puis trois trèfles parmi huit. 
    $$\boxed{\binom{8}{2}\binom{8}{3} = 28 \times 56 = 1\,568}$$

    **(c)** On sépare les mains sans as, qui sont des parties à cinq éléments des $28$ cartes qui ne sont pas des as, et celles qui ont exactement un as, choisi de $4$ façons, avec quatre autres cartes prises parmi les $28$. 
    $$\boxed{\binom{28}{5} + 4\binom{28}{4} = 98\,280 + 81\,900 = 180\,180}$$

    **(d)** L'as de cœur est à la fois un as et un cœur : on distingue selon qu'il figure dans la main. On note qu'il y a $3$ as qui ne sont pas des cœurs, $7$ cœurs qui ne sont pas des as, et $32 - 4 - 7 = 21$ cartes qui ne sont ni l'un ni l'autre.

    • Si l'as de cœur figure dans la main, il faut un autre as, parmi $3$, deux autres cœurs, parmi $7$, et une dernière carte, ni as ni cœur, parmi $21$ : $3 \times \binom{7}{2} \times 21 = 1\,323$ mains.

    • Sinon, il faut deux as parmi $3$ et trois cœurs parmi $7$, ce qui fait déjà cinq cartes : $\binom{3}{2}\binom{7}{3} = 105$ mains.

    $$\boxed{1\,323 + 105 = 1\,428}$$

    **(e)** On procède de même avec l'as de carreau ; il y a $7$ carreaux qui ne sont pas des as et $21$ cartes qui ne sont ni des as ni des carreaux.

    • Si l'as de carreau figure dans la main, c'est le seul as, et il faut au moins deux autres carreaux parmi les quatre autres cartes : $\sum_{j=2}^{4} \binom{7}{j}\binom{21}{4 - j} = 4\,410 + 735 + 35 = 5\,180$ mains.

    • Sinon, on choisit l'as parmi les $3$ autres, puis au moins trois carreaux parmi les quatre autres cartes : $3\Big(\binom{7}{3} \times 21 + \binom{7}{4}\Big) = 3 \times 770 = 2\,310$ mains.

    $$\boxed{5\,180 + 2\,310 = 7\,490}$$

    **(f)** Le roi de cœur est à la fois un roi et un cœur. Il y a $3$ autres rois, $7$ cœurs qui ne sont pas des rois, et $21$ cartes qui ne sont ni des rois ni des cœurs.

    • Si le roi de cœur figure dans la main, aucun autre cœur n'est permis, et il faut au moins un autre roi : $\sum_{j=1}^{3} \binom{3}{j}\binom{21}{4 - j} = 3\,990 + 630 + 21 = 4\,641$ mains.

    • Sinon, il faut $j \in \{2, 3\}$ rois parmi $3$ et $h \in \{0, 1\}$ cœur parmi $7$, le reste parmi $21$, soit 
    $$\sum_{j=2}^{3}\,\sum_{h=0}^{1} \binom{3}{j}\binom{7}{h}\binom{21}{5 - j - h} = 3 \times 2\,800 + 357 = 8\,757 \text{ mains.}$$

    $$\boxed{4\,641 + 8\,757 = 13\,398}$$
     Une énumération exhaustive des $201\,376$ mains confirme les six résultats.

    *Piège.* L'erreur la plus répandue, en (d), est de multiplier $\binom{4}{2}$ par $\binom{8}{3}$, en choisissant les as parmi les quatre et les cœurs parmi les huit : l'as de cœur peut alors être choisi deux fois, une fois comme as et une fois comme cœur, et l'on obtient des « mains » de quatre cartes, tandis que les vraies mains contenant l'as de cœur, qui ont une cinquième carte ni as ni cœur, sont oubliées. Le nombre $6 \times 56 = 336$ ainsi obtenu ne compte rien. Le découpage selon la carte « double » rend les catégories disjointes.
- id: "ma-21-07"
  feuille: "f-ma-21"
  numero: 7
  partie: "Dénombrement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    **1.** On reprend le jeu de $32$ cartes de l'exercice 6. Combien de mains contiennent au moins deux cartes de même hauteur ? Combien contiennent au moins deux paires de hauteurs différentes, c'est-à-dire deux cartes d'une hauteur et deux cartes d'une autre hauteur, les fulls étant comptés ?

    **2.** Un jeu de $52$ cartes comporte les quatre mêmes couleurs et treize hauteurs, as, $2$, $3$, …, $10$, valet, dame et roi. Une *quinte* est une main formée de cinq cartes de hauteurs consécutives, l'as pouvant compter avant le $2$ ou après le roi : as-$2$-$3$-$4$-$5$ et $10$-valet-dame-roi-as sont deux quintes. Une *quinte flush* est une quinte dont les cinq cartes ont la même couleur. Dénombrer les mains de cinq cartes de ce jeu qui sont

    **(a)** des quintes flush ;

    **(b)** des *carrés*, formés de quatre cartes de même hauteur ;

    **(c)** des *fulls*, formés de trois cartes d'une hauteur et de deux cartes d'une autre ;

    **(d)** des quintes qui ne sont pas des quintes flush ;

    **(e)** des *brelans*, formés de trois cartes d'une hauteur et de deux cartes de deux autres hauteurs différentes.
  corrige: |
    **1.** On compte le complémentaire : une main dont les cinq cartes ont des hauteurs deux à deux distinctes est déterminée par l'ensemble de ses cinq hauteurs, choisi parmi $8$, et par la couleur de chacune des cinq cartes, soit $4^{5}$ choix (proposition 3). 
    $$\boxed{\binom{32}{5} - \binom{8}{5}4^{5} = 201\,376 - 57\,344 = 144\,032}$$
     Pour la seconde question, on regroupe les cartes d'une main par hauteur : les effectifs des hauteurs présentes forment l'une des répartitions $1 + 1 + 1 + 1 + 1$, $2 + 1 + 1 + 1$, $2 + 2 + 1$, $3 + 1 + 1$, $3 + 2$ ou $4 + 1$. Une main contient deux paires de hauteurs différentes exactement pour les répartitions $2 + 2 + 1$ et $3 + 2$.

    • Répartition $2 + 2 + 1$ : on choisit l'*ensemble* des deux hauteurs des paires, de $\binom{8}{2}$ façons, deux cartes de chacune, de $\binom{4}{2}^{2}$ façons, puis la cinquième carte parmi les $32 - 8 = 24$ cartes des autres hauteurs, soit $28 \times 36 \times 24 = 24\,192$ mains.

    • Répartition $3 + 2$ : ce sont les fulls, au nombre de $8 \times \binom{4}{3} \times 7 \times \binom{4}{2} = 1\,344$ (exemple de la section 21.2.6).

    $$\boxed{24\,192 + 1\,344 = 25\,536}$$
     *Piège.* Pour les deux paires, l'erreur la plus répandue est de choisir « la hauteur de la première paire, puis celle de la seconde », de $8 \times 7$ façons : les deux paires jouent le même rôle, et chaque main est alors comptée deux fois. Pour un full, au contraire, le brelan et la paire jouent des rôles différents, et le produit $8 \times 7$ est juste.

    **2.** Il y a $\binom{52}{5} = 2\,598\,960$ mains. On numérote les hauteurs de $1$ (as) à $13$ (roi). Les quintes ont pour ensembles de hauteurs les dix ensembles $\{h, h + 1, \dots, h + 4\}$ pour $h \in \llbracket 1\,,9 \rrbracket$, et $\{10, 11, 12, 13, 1\}$.

    **(a)** Une quinte flush est déterminée par sa suite de hauteurs, parmi $10$, et sa couleur, parmi $4$ : 
    $$\boxed{10 \times 4 = 40 \text{ quintes flush}}$$

    **(b)** Un carré est déterminé par la hauteur des quatre cartes, parmi $13$, et la cinquième carte, parmi $48$ : 
    $$\boxed{13 \times 48 = 624 \text{ carrés}}$$

    **(c)** On choisit la hauteur du brelan et ses trois cartes, puis la hauteur de la paire, différente, et ses deux cartes : 
    $$\boxed{13\binom{4}{3} \times 12\binom{4}{2} = 13 \times 4 \times 12 \times 6 = 3\,744 \text{ fulls}}$$

    **(d)** Une quinte est déterminée par sa suite de hauteurs et par la couleur de chacune des cinq cartes, soit $10 \times 4^{5}$ mains, dont $40$ quintes flush : 
    $$\boxed{10\big(4^{5} - 4\big) = 10\,200 \text{ quintes qui ne sont pas des quintes flush}}$$

    **(e)** On choisit la hauteur du brelan, ses trois cartes, puis l'*ensemble* des deux autres hauteurs, de $\binom{12}{2}$ façons, et une carte de chacune : 
    $$\boxed{13 \times 4 \times \binom{12}{2} \times 4^{2} = 54\,912 \text{ brelans}}$$
     Les cinq nombres ont été confirmés par une énumération exhaustive des $2\,598\,960$ mains. Rapportés au nombre total de mains, ils donnent la hiérarchie du poker : une quinte flush apparaît environ une fois sur $65\,000$ donnes, un carré une fois sur $4\,165$, un brelan une fois sur $47$ ; plus une combinaison est rare, plus elle est forte.
- id: "ma-21-08"
  feuille: "f-ma-21"
  numero: 8
  partie: "Dénombrement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal, coefficient-binomial]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Au bridge, les $52$ cartes du jeu de l'exercice 7 sont distribuées entre quatre joueurs appelés Nord, Sud, Est et Ouest, qui en reçoivent treize chacun ; Nord et Sud sont partenaires, ainsi qu'Est et Ouest. Une *donne* est une telle distribution. On donnera les résultats à l'aide de factorielles et de coefficients binomiaux.

    **1.** Combien y a-t-il de donnes ?

    **2.** Combien y en a-t-il dans lesquelles chaque joueur n'a que des cartes d'une seule couleur ?

    **3.** Combien y en a-t-il dans lesquelles exactement deux joueurs n'ont que des cartes d'une seule couleur ?

    **4.** Combien y en a-t-il dans lesquelles deux partenaires, Nord et Sud ou bien Est et Ouest, n'ont chacun que des cartes d'une seule couleur, les deux autres joueurs ayant des cartes quelconques ?
  corrige: |
    **1.** Une donne est une suite $(N, S, E, O)$ de quatre parties à $13$ éléments du jeu, deux à deux disjointes. On choisit la main de Nord parmi les $52$ cartes, puis celle de Sud parmi les $39$ restantes, puis celle d'Est parmi les $26$ restantes, et Ouest reçoit les $13$ dernières ; le nombre de choix à chaque étape ne dépend pas des choix précédents. 
    $$\boxed{\binom{52}{13}\binom{39}{13}\binom{26}{13} = \frac{52!}{(13!)^{4}} \approx 5{,}36 \cdot 10^{28} \text{ donnes}}$$
     C'est le nombre d'anagrammes d'un mot formé de treize lettres N, treize S, treize E et treize O (exercice 3) : on écrit, sous chacune des $52$ cartes rangées dans un ordre fixé, l'initiale du joueur qui la reçoit.

    **2.** Si chaque joueur n'a que des cartes d'une couleur, il a les treize cartes de cette couleur, et les quatre joueurs ont des couleurs deux à deux distinctes. Une telle donne est donc déterminée par une bijection de l'ensemble des joueurs sur l'ensemble des couleurs, et réciproquement toute bijection en fournit une. 
    $$\boxed{4! = 24 \text{ donnes}}$$

    **3.** Disons qu'un joueur est *unicolore* s'il n'a que des cartes d'une couleur ; il possède alors toute cette couleur. Pour une donne où exactement deux joueurs sont unicolores, on choisit ces deux joueurs, de $\binom{4}{2} = 6$ façons, puis leurs couleurs, distinctes, de $4 \times 3 = 12$ façons. Il reste $26$ cartes, de deux couleurs, à partager en deux mains de $13$ entre les deux autres joueurs, de $\binom{26}{13}$ façons, dont exactement deux rendent ces joueurs unicolores : celles où l'un reçoit la première couleur entière et l'autre la seconde. 
    $$\boxed{6 \times 12 \times \bigg(\binom{26}{13} - 2\bigg) = 748\,843\,056 \text{ donnes}}$$

    **4.** Notons $\mathcal{N}$ l'ensemble des donnes où Nord et Sud sont tous deux unicolores, et $\mathcal{E}$ celui où Est et Ouest le sont. Comme à la question 3, $|\mathcal{N}| = 12\binom{26}{13}$ : on choisit les couleurs de Nord et de Sud, puis la main d'Est parmi les $26$ cartes restantes, sans contrainte. De même $|\mathcal{E}| = 12\binom{26}{13}$, et $\mathcal{N} \cap \mathcal{E}$ est l'ensemble des $24$ donnes de la question 2. La proposition 2 (iii) donne 
    $$\boxed{|\mathcal{N} \cup \mathcal{E}| = 2 \times 12\binom{26}{13} - 24 = 249\,614\,376 \text{ donnes}}$$
     Ces formules ont été contrôlées par une énumération exhaustive sur un jeu réduit de quatre couleurs de $2$ ou de $3$ cartes, distribuées à quatre joueurs. Pour des couleurs de $2$ cartes, par exemple, on trouve $2\,520$ donnes, dont $24$, $288$ et $120$ satisfont les conditions des questions 2, 3 et 4, comme le prévoient les formules avec $\binom{4}{2} = 6$ au lieu de $\binom{26}{13}$.

    *Piège.* L'erreur la plus répandue, à la question 4, est d'additionner $|\mathcal{N}|$ et $|\mathcal{E}|$ : les $24$ donnes entièrement unicolores sont comptées deux fois. À la question 3, c'est d'oublier de retirer les deux partages unicolores des $26$ dernières cartes, qui donneraient quatre joueurs unicolores et non deux.
- id: "ma-21-09"
  feuille: "f-ma-21"
  numero: 9
  partie: "Dénombrement"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Un *mot* de longueur $n$ est un élément de $\{a, b\}^{n}$, que l'on écrit sans parenthèses ni virgules : $aaaabba$ est le $7$-uplet $(a, a, a, a, b, b, a)$. Un *facteur* d'un mot est un mot formé de lettres consécutives de celui-ci : tous les mots de longueur $2$ sont des facteurs de $aaaabba$, mais $aba$ n'en est pas un. On note $(F_{n})_{n \in \mathbb{N}}$ la suite de Fibonacci, définie par $F_{0} = 0$, $F_{1} = 1$ et $F_{n+2} = F_{n+1} + F_{n}$.

    **1.** Soit $u_{n}$ le nombre de mots de longueur $n$ dont $aa$ n'est pas un facteur. Calculer $u_{1}$ et $u_{2}$, montrer que $u_{n+2} = u_{n+1} + u_{n}$ pour tout $n \geqslant 1$, et en déduire $u_{n}$ en fonction des termes de la suite de Fibonacci.

    **2.** Dénombrer les mots de longueur $n$ dont $ab$ n'est pas un facteur, puis ceux dont $aab$ n'est pas un facteur.

    **3.** En déduire le nombre de parties de $\llbracket 1\,,n \rrbracket$ qui ne contiennent pas deux entiers consécutifs.

    **4.** Un concours comporte $20$ questions, et l'on code les résultats d'un candidat par une liste de $20$ termes égaux à $1$ pour une bonne réponse et à $0$ sinon. Écrire une fonction Python qui calcule $u_{n}$. Parmi $17\,712$ candidats, aucun n'a donné de bonnes réponses à deux questions consécutives. Peut-on affirmer que deux candidats ont obtenu exactement les mêmes résultats ?
  corrige: |
    **1.** Les mots de longueur $1$ sont $a$ et $b$, et ceux de longueur $2$ sans facteur $aa$ sont $ab$, $ba$ et $bb$ : $u_{1} = 2$ et $u_{2} = 3$. Soit $n \geqslant 1$, et $w$ un mot de longueur $n + 2$ sans facteur $aa$. On distingue selon sa dernière lettre.

    • Si $w$ se termine par $b$, alors $w = w'b$, où $w'$ est un mot de longueur $n + 1$ sans facteur $aa$ ; réciproquement, pour tout tel mot $w'$, le mot $w'b$ n'a pas de facteur $aa$, puisqu'un tel facteur se trouverait dans $w'$. Il y a $u_{n+1}$ tels mots.

    • Si $w$ se termine par $a$, son avant-dernière lettre est $b$, et $w = w''ba$, où $w''$ est un mot de longueur $n$ sans facteur $aa$ ; réciproquement, tout mot $w''ba$ de ce type convient. Il y a $u_{n}$ tels mots.

    Les deux cas sont disjoints, et la proposition 2 (i) donne 
    $$\boxed{u_{n+2} = u_{n+1} + u_{n} \text{ pour tout } n \geqslant 1}$$
     Comme $u_{1} = 2 = F_{3}$ et $u_{2} = 3 = F_{4}$, une récurrence double montre que $u_{n} = F_{n+2}$ pour tout $n \geqslant 1$ : si $u_{n} = F_{n+2}$ et $u_{n+1} = F_{n+3}$, alors $u_{n+2} = F_{n+3} + F_{n+2} = F_{n+4}$. 
    $$\boxed{u_{n} = F_{n+2} \text{ pour tout } n \geqslant 1}$$
     La formule vaut aussi pour $n = 0$, si l'on convient que le mot vide compte : $u_{0} = 1 = F_{2}$.

    **2.** Un mot $w = w_{1}\cdots w_{n}$ n'a pas de facteur $ab$ si et seulement si aucune lettre $a$ n'est suivie, plus loin, d'une lettre $b$. En effet, s'il existe $i < j$ tels que $w_{i} = a$ et $w_{j} = b$, notons $j'$ le plus petit indice $j' > i$ tel que $w_{j'} = b$ : les lettres $w_{i}$, …, $w_{j'-1}$ sont des $a$, et $w_{j'-1}w_{j'} = ab$ est un facteur. Les mots sans facteur $ab$ sont donc les mots $b^{k}a^{n-k}$, formés de $k$ lettres $b$ suivies de $n - k$ lettres $a$, avec $k \in \llbracket 0\,,n \rrbracket$, et ils sont deux à deux distincts. 
    $$\boxed{n + 1 \text{ mots sans facteur } ab}$$
     Pour $aab$, on sépare les mots qui n'ont pas de facteur $aa$, au nombre de $u_{n} = F_{n+2}$, et ceux qui en ont un. Soit $w$ un mot sans facteur $aab$ qui contient le facteur $aa$, et $i$ la position de la première occurrence de ce facteur. Toutes les lettres qui suivent sont des $a$ : sinon, la première lettre $b$ située après la position $i$ serait précédée de deux $a$ au moins. Le mot $w$ s'écrit donc $a^{n}$, ou bien $vba^{m}$ avec $m \in \llbracket 2\,,n - 1 \rrbracket$ et $v$ un mot de longueur $n - 1 - m$ sans facteur $aa$ ; réciproquement, ces mots n'ont pas de facteur $aab$ et contiennent $aa$. Pour $n \geqslant 2$, il y en a donc, en posant $j = n - 1 - m$ et avec $u_{0} = F_{2} = 1$, 
    $$1 + \sum_{m=2}^{n-1} u_{n-1-m} = 1 + \sum_{j=0}^{n-3} F_{j+2} = 1 + \big(F_{n+1} - 2\big) = F_{n+1} - 1,$$
     puisque $\sum_{i=0}^{N} F_{i} = F_{N+2} - 1$ : les égalités $F_{i} = F_{i+2} - F_{i+1}$ donnent une somme télescopique (chapitre 3, proposition 3), égale à $F_{N+2} - F_{1}$. Au total, $F_{n+2} + F_{n+1} - 1 = F_{n+3} - 1$, valeur qui reste juste pour $n = 1$, où les deux mots conviennent. 
    $$\boxed{F_{n+3} - 1 \text{ mots sans facteur } aab}$$
     Les trois formules ont été vérifiées par énumération pour $n \leqslant 14$. Pour $n = 4$, on trouve $8$, $5$ et $12$ mots.

    **3.** À une partie $A$ de $\llbracket 1\,,n \rrbracket$, on associe le mot $w_{1}\cdots w_{n}$ défini par $w_{i} = a$ si $i \in A$ et $w_{i} = b$ sinon : c'est l'indicatrice de $A$, écrite avec les lettres $a$ et $b$, et cette application est une bijection de $\mathcal{P}\big(\llbracket 1\,,n \rrbracket\big)$ sur $\{a, b\}^{n}$ (démonstration de la proposition 3). La partie $A$ contient deux entiers consécutifs $i$ et $i + 1$ si et seulement si $w_{i}w_{i+1} = aa$. La bijection envoie donc les parties cherchées sur les mots sans facteur $aa$. 
    $$\boxed{F_{n+2} \text{ parties de } \llbracket 1\,,n \rrbracket \text{ sans deux entiers consécutifs}}$$

    **4.** La fonction suivante calcule $u_{n}$ par la récurrence de la question 1, à partir de $u_{0} = 1$ et $u_{1} = 2$. 

    ```python
    def u(n):
        a, b = 1, 2           # a = u_k, b = u_(k+1), pour k = 0
        for _ in range(n):    # on passe de k a k + 1
            a, b = b, a + b
        return a

    print(u(20))              # affiche 17711
    ```

     Les résultats d'un candidat forment un mot de longueur $20$ sur l'alphabet $\{0, 1\}$, et la condition « jamais deux bonnes réponses consécutives » signifie que $11$ n'en est pas un facteur : il y a $u_{20} = F_{22} = 17\,711$ listes de résultats possibles. Si les $17\,712$ candidats avaient des résultats deux à deux distincts, l'application qui associe à chaque candidat sa liste serait une injection d'un ensemble à $17\,712$ éléments dans un ensemble à $17\,711$ éléments, ce qu'interdit le principe des tiroirs (chapitre 2, théorème 2). 
    $$\boxed{\text{Oui : deux candidats au moins ont exactement les mêmes résultats}}$$
     *À retenir.* Les mots sans facteur $aa$ reviennent sous de nombreux déguisements : parties sans entiers consécutifs, pavages d'une bande par des dominos et des carrés, montées d'un escalier une ou deux marches à la fois. Chaque fois, la décomposition selon la fin de l'objet donne la récurrence de Fibonacci. C'est cette décomposition, et non la formule, qu'il faut retenir.
- id: "ma-21-10"
  feuille: "f-ma-21"
  numero: 10
  partie: "Dénombrement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 3
  page_corrige: 9
  enonce: |
    Soit $E$ un ensemble fini à $n$ éléments. L'exercice 39 de la feuille du chapitre 1 a dénombré les couples $(X, Y)$ de parties de $E$ tels que $X \subset Y$, puis ceux tels que $X \cap Y = \varnothing$, puis ceux tels que $X \cup Y = E$.

    **1.** Soit $C$ une partie de $E$. Combien y a-t-il de couples $(A, B)$ de parties de $E$ tels que $A \cap B = C$ ?

    **2.** Combien y a-t-il de triplets $(X, Y, Z)$ de parties de $E$ tels que $X \subset Y \subset Z$ ?

    **3.** Combien y a-t-il de couples $(X, Y)$ de parties de $E$ tels que $X \cap Y$ soit un singleton ?
  corrige: |
    La méthode est celle de la démonstration de la proposition 3 : à un couple $(A, B)$ de parties de $E$, on associe l'application $x \mapsto \big(\mathbf{1}_{A}(x), \mathbf{1}_{B}(x)\big)$ de $E$ dans $\{0, 1\}^{2}$. C'est une bijection de $\mathcal{P}(E)^{2}$ sur l'ensemble des applications de $E$ dans $\{0, 1\}^{2}$, puisqu'une partie est déterminée par son indicatrice. Une condition sur le couple $(A, B)$ qui se lit élément par élément devient une contrainte sur la valeur prise en chaque point $x$, et l'on compte les applications qui la respectent.

    **1.** On a $A \cap B = C$ si et seulement si, pour tout $x \in C$, $x$ appartient à $A$ et à $B$, et, pour tout $x \notin C$, $x$ n'appartient pas aux deux. La valeur en $x$ est donc imposée, égale à $(1, 1)$, pour $x \in C$, et choisie librement parmi les trois couples $(0, 0)$, $(1, 0)$, $(0, 1)$ pour $x \in E \setminus C$. Par la proposition 3, appliquée à l'ensemble $E \setminus C$, qui a $n - |C|$ éléments, 
    $$\boxed{\big|\{(A, B) \in \mathcal{P}(E)^{2} \mid A \cap B = C\}\big| = 3^{\,n - |C|}}$$
     Avec $C = \varnothing$, on retrouve les $3^{n}$ couples de parties disjointes de l'exercice 39 de la feuille du chapitre 1 ✓.

    **2.** On associe de même à un triplet $(X, Y, Z)$ de parties de $E$ l'application 
    $$x \mapsto \big(\mathbf{1}_{X}(x), \mathbf{1}_{Y}(x), \mathbf{1}_{Z}(x)\big),$$
     qui définit une bijection de $\mathcal{P}(E)^{3}$ sur l'ensemble des applications de $E$ dans $\{0, 1\}^{3}$. On a $X \subset Y \subset Z$ si et seulement si la valeur en chaque point est l'un des quatre triplets $(0, 0, 0)$, $(0, 0, 1)$, $(0, 1, 1)$ et $(1, 1, 1)$ : chaque élément de $E$ est hors de $Z$, dans $Z \setminus Y$, dans $Y \setminus X$ ou dans $X$. 
    $$\boxed{4^{n} \text{ triplets } (X, Y, Z) \text{ tels que } X \subset Y \subset Z}$$
     Avec deux parties, le même raisonnement donne les $3^{n}$ couples tels que $X \subset Y$ de l'exercice 39 du chapitre 1 ; avec $k$ parties emboîtées, on trouverait $(k + 1)^{n}$ suites.

    **3.** Les couples $(X, Y)$ tels que $X \cap Y$ soit un singleton se répartissent, selon la valeur $\{c\}$ de ce singleton, en $n$ ensembles deux à deux disjoints, dont chacun a $3^{n-1}$ éléments par la question 1. 
    $$\boxed{n\,3^{n-1} \text{ couples } (X, Y) \text{ tels que } X \cap Y \text{ soit un singleton}}$$
     Les trois résultats ont été vérifiés par énumération pour $n \leqslant 5$.
- id: "ma-21-11"
  feuille: "f-ma-21"
  numero: 11
  partie: "Dénombrement"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dénombrement]
  noeuds: [n-fini, pol-binome]
  notions: [cardinal]
  page_enonce: 3
  page_corrige: 10
  enonce: |
    Soit $E$ un ensemble fini à $n$ éléments. Calculer les sommes suivantes, où $A$, $B$, $X$, $Y$ décrivent $\mathcal{P}(E)$. 
    $$\sum_{A} |A|, \qquad \sum_{(A, B)} |A \cap B|, \qquad \sum_{(A, B)} |A \cup B|, \qquad \sum_{\substack{(X, Y) \\ X \cap Y = \varnothing}} \big(|X| + |Y|\big).$$
     On pourra compter de deux façons les couples $(x, A)$ tels que $x \in A$, et procéder de même pour les autres sommes.
  corrige: |
    Les quatre sommes se calculent par double comptage : on écrit le cardinal comme une somme d'indicatrices, $|A| = \sum_{x \in E} \mathbf{1}_{A}(x)$, et l'on intervertit les sommes (chapitre 3, proposition 6). Pour un élément $x$ fixé, il reste à compter les parties, ou les couples de parties, qui le contiennent.

    *Première somme.* Pour $x \in E$, les parties qui contiennent $x$ s'écrivent $\{x\} \cup A'$ avec $A' \subset E \setminus \{x\}$ : il y en a $2^{n-1}$. Ainsi 
    $$\sum_{A \in \mathcal{P}(E)} |A| = \sum_{A}\,\sum_{x \in E} \mathbf{1}_{A}(x) = \sum_{x \in E} \big|\{A \mid x \in A\}\big| = \sum_{x \in E} 2^{n-1}, \qquad \boxed{\sum_{A} |A| = n\,2^{n-1}}$$
     On a compté de deux façons l'ensemble des couples $(x, A)$ tels que $x \in A$. On peut aussi regrouper les parties selon leur cardinal, et l'on retrouve l'identité $\sum_{k=0}^{n} k\binom{n}{k} = n2^{n-1}$ (chapitre 3, proposition 10).

    *Deuxième somme.* Pour $x \in E$, les couples $(A, B)$ tels que $x \in A \cap B$ sont formés de deux parties qui contiennent $x$ : il y en a $2^{n-1} \times 2^{n-1} = 4^{n-1}$. 
    $$\boxed{\sum_{(A, B)} |A \cap B| = n\,4^{n-1}}$$

    *Troisième somme.* Pour $x \in E$, les couples tels que $x \notin A \cup B$ sont formés de deux parties de $E \setminus \{x\}$ : il y en a $4^{n-1}$, et il y a donc $4^{n} - 4^{n-1} = 3 \times 4^{n-1}$ couples tels que $x \in A \cup B$. 
    $$\boxed{\sum_{(A, B)} |A \cup B| = 3n\,4^{n-1}}$$
     On contrôle par la proposition 2 (iii), puisque $\sum_{(A, B)} |A| = 2^{n} \times n2^{n-1} = 2n4^{n-1}$ : 
    $$\sum_{(A, B)} |A \cup B| = \sum_{(A, B)} |A| + \sum_{(A, B)} |B| - \sum_{(A, B)} |A \cap B| = 2 \times 2n4^{n-1} - n4^{n-1} = 3n4^{n-1} \ \checkmark$$

    *Quatrième somme.* Pour $X$ et $Y$ disjoints, $|X| + |Y| = |X \cup Y|$ (proposition 2 (i)). Pour $x \in E$, les couples de parties disjointes tels que $x \in X \cup Y$ s'obtiennent en plaçant $x$ dans $X$ ou dans $Y$, de deux façons, puis en choisissant un couple de parties disjointes de $E \setminus \{x\}$, de $3^{n-1}$ façons (exercice 10). 
    $$\boxed{\sum_{X \cap Y = \varnothing} \big(|X| + |Y|\big) = 2n\,3^{n-1}}$$
     Les quatre formules ont été vérifiées par énumération pour $n \leqslant 5$. Pour $n = 2$, par exemple, la première somme vaut $0 + 1 + 1 + 2 = 4 = 2 \times 2^{1}$ ✓.

    *À retenir.* Le double comptage transforme une somme de cardinaux, difficile à organiser, en une somme sur les éléments, où tous les termes sont égaux par symétrie. C'est l'ancêtre de la méthode des indicatrices de la section 21.6.3 : si $A$ est une partie de $E$ choisie au hasard sous la probabilité uniforme, la première somme montre que $|A|$ vaut $\frac{n}{2}$ en moyenne.
