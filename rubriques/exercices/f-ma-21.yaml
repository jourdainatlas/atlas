  enonce: |
    Soit $n \geqslant 1$ et $(X_{i,j})_{1 \leqslant i,j \leqslant n}$ des variables aléatoires mutuellement indépendantes, de loi uniforme sur $\{-1, 1\}$. On considère la matrice aléatoire $M = (X_{i,j})_{1 \leqslant i,j \leqslant n}$, c'est-à-dire la variable aléatoire qui à $\omega$ associe la matrice $\big(X_{i,j}(\omega)\big)$.

    **1.** Déterminer la loi de la trace $\operatorname{tr}(M)$, puis calculer son espérance et sa variance.

    **2.** Calculer la probabilité que $M$ soit de rang $1$.

    **3.** Déterminer l'espérance et la variance de $\det(M)$. On utilisera l'expression du déterminant comme somme sur $\mathfrak{S}_{n}$ du chapitre 17.
  corrige: |
    Les $n^{2}$ variables sont centrées : $\mathrm{E}(X_{i,j}) = 0$, et $X_{i,j}^{2} = 1$, donc $\mathrm{V}(X_{i,j}) = 1$.

    **1.** On a $\operatorname{tr}(M) = \sum_{i=1}^{n} X_{i,i}$. Les variables $B_{i} = \frac{X_{i,i} + 1}{2}$ sont mutuellement indépendantes (proposition 16), de loi $\mathcal{B}(\frac{1}{2})$, et $\frac{\operatorname{tr}(M) + n}{2} = \sum_{i} B_{i}$ suit la loi $\mathcal{B}(n,\frac{1}{2})$ (théorème 8). D'où 
    $$\boxed{\mathrm{P}\big(\operatorname{tr}(M) = 2k - n\big) = \binom{n}{k}\frac{1}{2^{n}}, \qquad k \in \llbracket 0\,,n \rrbracket}$$
     Par linéarité et par le théorème 13, les $X_{i,i}$ étant indépendantes, 
    $$\boxed{\mathrm{E}\big(\operatorname{tr}(M)\big) = 0, \qquad \mathrm{V}\big(\operatorname{tr}(M)\big) = n}$$
     C'est la marche aléatoire de la section 21.5.7 : la trace est la position d'un marcheur après $n$ pas.

    **2.** Comme tous les coefficients sont non nuls, $M \neq 0$ et $\mathrm{rg}(M) \geqslant 1$. La matrice est de rang $1$ si et seulement si toutes ses colonnes sont proportionnelles à la première, $C_{1}$, qui est non nulle (chapitre 16). Une colonne $C_{j}$ à coefficients $\pm 1$ s'écrit $\lambda C_{1}$ si et seulement si $\lambda = \pm 1$, puisque les coefficients de $\lambda C_{1}$ sont $\pm\lambda$. Ainsi $\mathrm{rg}(M) = 1$ si et seulement si $C_{j} \in \{C_{1}, -C_{1}\}$ pour tout $j \in \llbracket 2\,,n \rrbracket$. La matrice $M$ suit la loi uniforme sur les $2^{n^{2}}$ matrices à coefficients $\pm 1$, par indépendance, et il y a $2^{n}$ choix de $C_{1}$ et $2$ choix pour chacune des $n - 1$ autres colonnes : 
    $$\mathrm{P}\big(\mathrm{rg}(M) = 1\big) = \frac{2^{n} \times 2^{n-1}}{2^{n^{2}}}, \qquad \boxed{\mathrm{P}\big(\mathrm{rg}(M) = 1\big) = \frac{1}{2^{(n-1)^{2}}}}$$
     Pour $n = 1$, on trouve $1$, et pour $n = 2$, $\frac{1}{2}$ : une matrice $2 \times 2$ à coefficients $\pm 1$ est inversible une fois sur deux.

    **3.** Par la définition du déterminant (chapitre 17), 
    $$\det(M) = \sum_{\sigma \in \mathfrak{S}_{n}} \varepsilon(\sigma)\,T_{\sigma}, \qquad T_{\sigma} = \prod_{j=1}^{n} X_{\sigma(j),j}.$$
     Le produit $T_{\sigma}$ porte sur $n$ coefficients de positions distinctes $(\sigma(j), j)$, donc mutuellement indépendants : par la proposition 20, $\mathrm{E}(T_{\sigma}) = 0$, et, par linéarité, $\boxed{\mathrm{E}\big(\det(M)\big) = 0}$.

    Soit $\sigma \neq \tau$. Dans le produit $T_{\sigma}T_{\tau}$, le facteur de la colonne $j$ vaut $X_{\sigma(j),j}^{2} = 1$ si $\sigma(j) = \tau(j)$, et $X_{\sigma(j),j}X_{\tau(j),j}$ sinon. Ainsi $T_{\sigma}T_{\tau}$ est le produit des coefficients situés aux positions $(\sigma(j), j)$ et $(\tau(j), j)$, pour les $j$ tels que $\sigma(j) \neq \tau(j)$ ; ces positions sont deux à deux distinctes, et il y en a au moins deux, puisque $\sigma \neq \tau$. Par la proposition 20, $\mathrm{E}(T_{\sigma}T_{\tau}) = 0$, donc $\operatorname{Cov}(T_{\sigma}, T_{\tau}) = 0$, alors que $\mathrm{V}(T_{\sigma}) = \mathrm{E}(T_{\sigma}^{2}) = 1$. Les $n!$ variables $\varepsilon(\sigma)T_{\sigma}$ sont deux à deux décorrélées, et le théorème 13 donne 
    $$\boxed{\mathrm{V}\big(\det(M)\big) = \sum_{\sigma \in \mathfrak{S}_{n}} \varepsilon(\sigma)^{2}\mathrm{V}(T_{\sigma}) = n!}$$
     Pour $n = 2$, $\det(M)$ vaut $0$ avec la probabilité $\frac{1}{2}$, et $\pm 2$ avec la probabilité $\frac{1}{4}$ chacun : la variance vaut bien $2$. Pour $n = 3$, l'énumération des $512$ matrices donne $\mathrm{P}(\det M = 0) = \frac{5}{8}$ et $\mathrm{P}(\det M = \pm 4) = \frac{3}{16}$ chacun, de variance $6$ ✓.

    *Piège.* Les variables $T_{\sigma}$ ne sont pas indépendantes : deux d'entre elles partagent en général des coefficients. Le théorème 13 n'a besoin que de leur décorrélation deux à deux, qui se vérifie par la proposition 20 appliquée aux coefficients, eux indépendants. L'erreur la plus répandue est d'invoquer une indépendance qui n'existe pas.

    *À retenir.* L'écart type de $\det(M)$ vaut $\sqrt{n!}$ : le déterminant d'une matrice aléatoire à coefficients $\pm 1$ est en moyenne nul, mais il est typiquement de l'ordre de $\sqrt{n!}$, bien plus petit que $n!$, nombre de termes de la somme, en raison des compensations entre termes de signes opposés.
- id: "ma-21-94"
  feuille: "f-ma-21"
  numero: 94
  partie: "Variance et covariance"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [variance et covariance, variables aléatoires, variance]
  noeuds: [p-esperance, p-variables]
  notions: [variance, covariance, variable-aleatoire]
  page_enonce: 23
  page_corrige: 86
  enonce: |
    Soit $X_{1}$, …, $X_{n}$ des variables aléatoires réelles et $C = \big(\operatorname{Cov}(X_{i}, X_{j})\big)_{1 \leqslant i,j \leqslant n} \in \mathcal{M}_{n}(\mathbb{R})$ leur *matrice de covariance*.

    **1.** Montrer que, pour toute colonne $\Lambda = (\lambda_{1}, \dots, \lambda_{n})^{T}$ de $\mathbb{R}^{n}$, on a $\Lambda^{T}C\Lambda = \mathrm{V}(\lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n})$.

    **2.** Montrer que $C$ est inversible si et seulement s'il n'existe pas de réels $\lambda_{1}$, …, $\lambda_{n}$ non tous nuls et de réel $c$ tels que $\mathrm{P}(\lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n} = c) = 1$. Comparer avec les matrices de Gram du chapitre 19.
  corrige: |
    **1.** Par définition du produit matriciel, puis par la bilinéarité de la covariance (proposition 23 (ii)), appliquée à chaque argument, 
    $$\Lambda^{T}C\Lambda = \sum_{i=1}^{n}\sum_{j=1}^{n} \lambda_{i}\lambda_{j}\operatorname{Cov}(X_{i}, X_{j}) = \operatorname{Cov}\Big(\sum_{i=1}^{n} \lambda_{i}X_{i}, \sum_{j=1}^{n} \lambda_{j}X_{j}\Big), \qquad \boxed{\Lambda^{T}C\Lambda = \mathrm{V}(\lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n})}$$
     par la proposition 23 (i). En particulier $\Lambda^{T}C\Lambda \geqslant 0$ pour toute colonne $\Lambda$ : la matrice symétrique $C$ est positive.

    **2.** Pour $\Lambda \in \mathbb{R}^{n}$, on note $Z_{\Lambda} = \lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n}$. Par bilinéarité, la $i$-ième coordonnée de $C\Lambda$ est 
    $$(C\Lambda)_{i} = \sum_{j=1}^{n} \operatorname{Cov}(X_{i}, X_{j})\lambda_{j} = \operatorname{Cov}(X_{i}, Z_{\Lambda}).$$

    *Si $C$ n'est pas inversible*, il existe une colonne $\Lambda \neq 0$ telle que $C\Lambda = 0$ (chapitre 16). Alors $\mathrm{V}(Z_{\Lambda}) = \Lambda^{T}C\Lambda = 0$, et le théorème 11 (iii) donne $\mathrm{P}\big(Z_{\Lambda} = \mathrm{E}(Z_{\Lambda})\big) = 1$ : il existe des réels non tous nuls et un réel $c = \mathrm{E}(Z_{\Lambda})$ tels que $\mathrm{P}(\lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n} = c) = 1$.

    *Réciproquement*, supposons $\Lambda \neq 0$ et $\mathrm{P}(Z_{\Lambda} = c) = 1$. Alors $Z_{\Lambda}(\omega) = c$ pour toute issue $\omega$ de probabilité non nulle, donc $\mathrm{E}(Z_{\Lambda}) = c$ (proposition 18), et, pour tout $i$, la proposition 18 donne 
    $$(C\Lambda)_{i} = \operatorname{Cov}(X_{i}, Z_{\Lambda}) = \sum_{\omega \in \Omega} \big(X_{i}(\omega) - \mathrm{E}(X_{i})\big)\big(Z_{\Lambda}(\omega) - c\big)\mathrm{P}(\{\omega\}) = 0,$$
     chaque terme étant nul. Ainsi $C\Lambda = 0$ avec $\Lambda \neq 0$, et $C$ n'est pas inversible. Par contraposée, 
    $$\boxed{\begin{array}{c} C \text{ inversible} \iff \text{aucune combinaison } \lambda_{1}X_{1} + \cdots + \lambda_{n}X_{n}, \text{ à coefficients non tous nuls,} \\ \text{n'est constante avec probabilité } 1 \end{array}}$$
     Par exemple, les nombres de boules $X_{1}$, …, $X_{n}$ des tiroirs de l'exercice 80 ont une somme constante égale à $r$ : leur matrice de covariance n'est pas inversible, et la colonne $(1, \dots, 1)^{T}$ est dans son noyau. Pour $n = 3$ et $r = 2$, on trouve 
    $$C = \frac{2}{9}\begin{pmatrix} 2 & -1 & -1 \\ -1 & 2 & -1 \\ -1 & -1 & 2 \end{pmatrix}, \qquad \det C = 0 \ \checkmark.$$

    *Comparaison avec le chapitre 19.* La matrice de Gram d'une famille $(x_{1}, \dots, x_{n})$ de vecteurs d'un espace euclidien de dimension $n$ est inversible si et seulement si la famille est libre (chapitre 19, proposition 9 (ii)). Ici, $C$ est la matrice des $\mathrm{E}(U_{i}U_{j})$, où $U_{i} = X_{i} - \mathrm{E}(X_{i})$ sont les variables centrées : c'est une « matrice de Gram » pour la forme bilinéaire symétrique $(U, V) \mapsto \mathrm{E}(UV)$ sur l'espace $\mathbb{R}^{\Omega}$. Cette forme est positive, mais elle n'est pas définie dès qu'une issue a une probabilité nulle, ce qui explique qu'on ne puisse conclure qu'à une égalité avec probabilité $1$. Si toutes les issues ont une probabilité non nulle, c'est un produit scalaire, et le résultat dit exactement que $C$ est inversible si et seulement si la famille $(U_{1}, \dots, U_{n})$ des variables centrées est libre.

    *À retenir.* Une matrice de covariance est toujours symétrique et positive ; elle est inversible si et seulement si les variables ne sont liées par aucune relation affine certaine. C'est la même dichotomie qu'au chapitre 19, avec la variance à la place du carré de la norme.
- id: "ma-21-95"
  feuille: "f-ma-21"
  numero: 95
  partie: "Inégalités probabilistes et loi faible des grands nombres"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [inégalités et loi faible, coefficients binomiaux, variables aléatoires, variance]
  noeuds: [p-esperance, p-loi-faible, pol-binome, p-variables]
  notions: [variable-aleatoire, variance, coefficient-binomial]
  page_enonce: 23
  page_corrige: 87
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on considère une variable aléatoire $X_{n}$ de loi $\mathcal{B}(4n,\frac{1}{2})$.

    **1.** Calculer la variance de $X_{n}$.

    **2.** Montrer que $\mathrm{P}\big(|X_{n} - 2n| \geqslant n\big)$ tend vers $0$ quand $n$ tend vers $+\infty$.

    **3.** En déduire que $\mathrm{P}\big(|X_{n} - 2n| \leqslant n\big)$ tend vers $1$, puis que $x_{n} = \displaystyle\sum_{k=n}^{3n} \binom{4n}{k}$ est équivalent à $16^{n}$ quand $n$ tend vers $+\infty$.
  corrige: |
    **1.** Par la proposition 19, $X_{n}$ a pour espérance $4n \times \frac{1}{2} = 2n$, et par la proposition 21, sa variance vaut 
    $$\boxed{\mathrm{V}(X_{n}) = 4n \times \frac{1}{2} \times \frac{1}{2} = n}$$

    **2.** On applique l'inégalité de Bienaymé-Tchebychev (théorème 15) à $X_{n}$, avec $\varepsilon = n > 0$ : 
    $$\mathrm{P}\big(|X_{n} - 2n| \geqslant n\big) \leqslant \frac{\mathrm{V}(X_{n})}{n^{2}} = \frac{1}{n}, \qquad\text{d'où}\qquad \boxed{\mathrm{P}\big(|X_{n} - 2n| \geqslant n\big) \xrightarrow[n \to +\infty]{} 0}$$
     L'écart toléré, $n$, est proportionnel au nombre $4n$ d'épreuves, alors que l'écart type $\sqrt{n}$ n'en est qu'une racine carrée : c'est ce décalage d'échelle que traduit la loi faible des grands nombres.

    **3.** L'événement $\big(|X_{n} - 2n| < n\big)$ est le contraire de l'événement de la question 2, et il est inclus dans $\big(|X_{n} - 2n| \leqslant n\big)$. Par croissance et passage au contraire (proposition 7 (ii) et (iii)), 
    $$1 \geqslant \mathrm{P}\big(|X_{n} - 2n| \leqslant n\big) \geqslant 1 - \mathrm{P}\big(|X_{n} - 2n| \geqslant n\big) \geqslant 1 - \frac{1}{n},$$
     et le théorème des gendarmes donne $\boxed{\mathrm{P}\big(|X_{n} - 2n| \leqslant n\big) \xrightarrow[n \to +\infty]{} 1}$. Or l'événement $\big(|X_{n} - 2n| \leqslant n\big)$ est $(n \leqslant X_{n} \leqslant 3n)$, et la loi binomiale donne 
    $$\mathrm{P}\big(|X_{n} - 2n| \leqslant n\big) = \sum_{k=n}^{3n} \binom{4n}{k}\frac{1}{2^{k}}\,\frac{1}{2^{4n-k}} = \frac{x_{n}}{16^{n}}.$$
     Le quotient $\frac{x_{n}}{16^{n}}$ tend donc vers $1$, c'est-à-dire 
    $$\boxed{x_{n} = \sum_{k=n}^{3n} \binom{4n}{k} \underset{n \to +\infty}{\sim} 16^{n}}$$
     Pour $n = 1$, on trouve $x_{1} = 4 + 6 + 4 = 14$, et $\frac{x_{1}}{16} = 0{,}875$ ; puis $\frac{x_{5}}{16^{5}} \approx 0{,}988$ et $\frac{x_{20}}{16^{20}} \approx 0{,}999\,997$ ✓. Comme $16^{n} = 2^{4n}$ est le nombre total de parties d'un ensemble à $4n$ éléments, le résultat dit que presque toutes ces parties ont entre le quart et les trois quarts des éléments.

    *Piège.* Un équivalent se démontre par un quotient qui tend vers $1$, pas par une différence qui tend vers $0$ : ici $16^{n} - x_{n}$ tend vers $+\infty$, et pourtant $x_{n} \sim 16^{n}$. L'erreur la plus répandue est d'écrire $x_{n} - 16^{n} \to 0$, qui est faux.
- id: "ma-21-96"
  feuille: "f-ma-21"
  numero: 96
  partie: "Inégalités probabilistes et loi faible des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalités et loi faible, variables aléatoires, loi uniforme]
  noeuds: [p-esperance, p-loi-faible, p-variables]
  notions: [variable-aleatoire]
  page_enonce: 23
  page_corrige: 88
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on choisit un vecteur $X_{n}$ de $\{0, 1\}^{n} \subset \mathbb{R}^{n}$ selon la loi uniforme, et l'on note $\lVert X_{n} \rVert$ sa norme euclidienne. Montrer que, pour tout $\varepsilon > 0$, 
    $$\mathrm{P}\Big(\Big|\frac{\lVert X_{n} \rVert}{\sqrt{n}} - \frac{\sqrt{2}}{2}\Big| \geqslant \varepsilon\Big) \xrightarrow[n \to +\infty]{} 0.$$
     Interpréter géométriquement : où se trouvent, pour la plupart, les sommets du cube $[0\,,1]^{n}$ ?
  corrige: |
    On prend pour univers $\Omega = \{0, 1\}^{n}$, muni de la probabilité uniforme, et $X_{n}(\omega) = \omega$. Chaque issue a la probabilité $\frac{1}{2^{n}} = \prod_{i=1}^{n} \frac{1}{2}$ : c'est la probabilité produit de la proposition 17, construite avec $n$ fois la distribution uniforme sur $\{0, 1\}$. Les coordonnées $C_{1}$, …, $C_{n}$ de $X_{n}$ sont donc mutuellement indépendantes, de loi $\mathcal{B}(\frac{1}{2})$. Comme $C_{i}^{2} = C_{i}$, 
    $$\lVert X_{n} \rVert^{2} = \sum_{i=1}^{n} C_{i}^{2} = \sum_{i=1}^{n} C_{i} = N_{n}, \qquad N_{n} \sim \mathcal{B}(n,\tfrac{1}{2})$$
     par le théorème 8 : le carré de la norme est le nombre de coordonnées égales à $1$.

    *Comparaison des racines carrées.* Pour $u \geqslant 0$, on a $\sqrt{u} + \sqrt{\frac{1}{2}} \geqslant \frac{\sqrt{2}}{2} > 0$, donc 
    $$\Big|\sqrt{u} - \frac{\sqrt{2}}{2}\Big| = \frac{\big|u - \frac{1}{2}\big|}{\sqrt{u} + \sqrt{\frac{1}{2}}} \leqslant \sqrt{2}\,\Big|u - \frac{1}{2}\Big|.$$

    *Conclusion.* Avec $u = \frac{N_{n}}{n}$, on a $\frac{\lVert X_{n} \rVert}{\sqrt{n}} = \sqrt{u}$. Soit $\varepsilon > 0$. Par l'inégalité précédente, l'événement étudié est inclus dans $\big(\big|\frac{N_{n}}{n} - \frac{1}{2}\big| \geqslant \frac{\varepsilon}{\sqrt{2}}\big)$, et la loi faible des grands nombres (théorème 16, cas binomial, avec $p(1 - p) = \frac{1}{4}$) donne 
    $$\mathrm{P}\Big(\Big|\frac{\lVert X_{n} \rVert}{\sqrt{n}} - \frac{\sqrt{2}}{2}\Big| \geqslant \varepsilon\Big) \leqslant \mathrm{P}\Big(\Big|\frac{N_{n}}{n} - \frac{1}{2}\Big| \geqslant \frac{\varepsilon}{\sqrt{2}}\Big) \leqslant \frac{1/4}{n\,\varepsilon^{2}/2},$$

    $$\boxed{\mathrm{P}\Big(\Big|\frac{\lVert X_{n} \rVert}{\sqrt{n}} - \frac{\sqrt{2}}{2}\Big| \geqslant \varepsilon\Big) \leqslant \frac{1}{2n\varepsilon^{2}} \xrightarrow[n \to +\infty]{} 0}$$
     Pour $\varepsilon = 0{,}05$ et $n = 1\,000$, la majoration vaut $0{,}2$, alors que la valeur exacte, calculée avec la loi binomiale, est de l'ordre de $9 \times 10^{-6}$ ✓.

    *Interprétation.* Les sommets du cube $[0\,,1]^{n}$ sont les $2^{n}$ points de $\{0, 1\}^{n}$, et $X_{n}$ est un sommet choisi au hasard. Le résultat dit que, pour $n$ grand, la plupart des sommets sont à une distance de l'origine voisine de $\sqrt{\frac{n}{2}}$, à un facteur $1 \pm \varepsilon\sqrt{2}$ près : *ils se concentrent près de la sphère de centre $O$ et de rayon $\sqrt{\frac{n}{2}}$*, alors que les distances possibles s'étalent de $0$ à $\sqrt{n}$. On peut aussi le lire avec les angles du chapitre 19 : le cosinus de l'angle entre un sommet $x \neq 0$ et la grande diagonale $(1, \dots, 1)$ vaut $\frac{N_{n}}{\lVert x \rVert\sqrt{n}} = \frac{\lVert x \rVert}{\sqrt{n}}$, qui est proche de $\frac{\sqrt{2}}{2}$ : vus de l'origine, presque tous les sommets font un angle voisin de $\frac{\pi}{4}$ avec la diagonale. Les deux extrémités de la diagonale, $0$ et $(1, \dots, 1)$, sont des sommets tout à fait atypiques.
- id: "ma-21-97"
  feuille: "f-ma-21"
  numero: 97
  partie: "Inégalités probabilistes et loi faible des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalités et loi faible, indépendance, variables aléatoires, espérance, loi faible des grands nombres]
  noeuds: [p-esperance, p-loi-faible, p-independance, p-variables]
  notions: [independance, variable-aleatoire, esperance]
  page_enonce: 23
  page_corrige: 89
  enonce: |
    Soit $X_{1}$, …, $X_{n}$ des variables aléatoires réelles mutuellement indépendantes, de même loi, et $m$ leur espérance commune. On pose $Y_{i} = X_{i} - m$, $\sigma^{2} = \mathrm{E}(Y_{1}^{2})$, $\mu_{4} = \mathrm{E}(Y_{1}^{4})$, et $S_{n} = Y_{1} + \cdots + Y_{n}$.

    **1.** Soit $\varepsilon > 0$. Montrer que $\mathrm{P}\Big(\Big|\dfrac{S_{n}}{n}\Big| \geqslant \varepsilon\Big) \leqslant \dfrac{\mathrm{E}(S_{n}^{4})}{\varepsilon^{4}n^{4}}$.

    **2.** En développant $S_{n}^{4}$, montrer que $\mathrm{E}(S_{n}^{4}) = n\mu_{4} + 3n(n - 1)\sigma^{4}$. En déduire que la série $\sum_{n \geqslant 1} \frac{\mathrm{E}(S_{n}^{4})}{n^{4}}$ converge, la loi commune des $X_{i}$ étant fixée.

    **3.** Comparer, pour $n$ grand, la majoration de la question 1 avec celle de la loi faible des grands nombres du cours.
  corrige: |
    Les variables $Y_{i} = X_{i} - m$ sont mutuellement indépendantes (proposition 16) et de même loi (proposition 13), et centrées par linéarité.

    **1.** Comme $x \mapsto x^{4}$ est strictement croissante sur $\mathbb{R}_{+}$, les événements $\big(|S_{n}| \geqslant n\varepsilon\big)$ et $\big(S_{n}^{4} \geqslant n^{4}\varepsilon^{4}\big)$ sont égaux. L'inégalité de Markov (théorème 14), appliquée à la variable positive $S_{n}^{4}$ avec $a = n^{4}\varepsilon^{4} > 0$, donne 
    $$\boxed{\mathrm{P}\Big(\Big|\frac{S_{n}}{n}\Big| \geqslant \varepsilon\Big) \leqslant \frac{\mathrm{E}(S_{n}^{4})}{\varepsilon^{4}n^{4}}}$$
     C'est la démonstration de l'inégalité de Bienaymé-Tchebychev, avec la puissance $4$ au lieu de la puissance $2$.

    **2.** On développe le produit de quatre sommes (chapitre 3), puis on applique la linéarité de l'espérance : 
    $$S_{n}^{4} = \sum_{(i,j,k,\ell) \in \llbracket 1\,,n \rrbracket^{4}} Y_{i}Y_{j}Y_{k}Y_{\ell}, \qquad \mathrm{E}(S_{n}^{4}) = \sum_{(i,j,k,\ell)} \mathrm{E}(Y_{i}Y_{j}Y_{k}Y_{\ell}).$$
     Dans un quadruplet $(i, j, k, \ell)$, regroupons les indices égaux : si $a_{1}$, …, $a_{r}$ sont les valeurs distinctes, de multiplicités $m_{1}$, …, $m_{r}$, de somme $4$, le produit vaut $Y_{a_{1}}^{m_{1}} \cdots Y_{a_{r}}^{m_{r}}$. Ces $r$ facteurs sont mutuellement indépendants (propositions 15 et 16), et la proposition 20 donne 
    $$\mathrm{E}(Y_{i}Y_{j}Y_{k}Y_{\ell}) = \mathrm{E}\big(Y_{a_{1}}^{m_{1}}\big) \cdots \mathrm{E}\big(Y_{a_{r}}^{m_{r}}\big).$$
     Dès qu'une multiplicité vaut $1$, le facteur correspondant est $\mathrm{E}(Y_{a}) = 0$. Il ne reste que deux types de quadruplets :

    • les quatre indices égaux, ce qui donne $n$ quadruplets, de contribution $\mu_{4}$ chacun ;

    • deux valeurs distinctes, chacune deux fois : on choisit la paire de valeurs, de $\binom{n}{2}$ façons, puis les deux positions qui portent la plus petite, de $\binom{4}{2} = 6$ façons ; ces $6\binom{n}{2} = 3n(n - 1)$ quadruplets contribuent chacun $\mathrm{E}(Y_{a}^{2})\,\mathrm{E}(Y_{b}^{2}) = \sigma^{4}$.

    $$\boxed{\mathrm{E}(S_{n}^{4}) = n\mu_{4} + 3n(n - 1)\sigma^{4}}$$
     La formule a été vérifiée exactement pour $n \leqslant 4$, sur une loi à trois valeurs ✓. On en déduit 
    $$0 \leqslant \frac{\mathrm{E}(S_{n}^{4})}{n^{4}} = \frac{\mu_{4}}{n^{3}} + \frac{3(n - 1)\sigma^{4}}{n^{3}} \leqslant \frac{\mu_{4} + 3\sigma^{4}}{n^{2}},$$
     et la série de Riemann $\sum \frac{1}{n^{2}}$ converge (chapitre 20, théorème 5) : $\boxed{\text{la série } \sum_{n \geqslant 1} \frac{\mathrm{E}(S_{n}^{4})}{n^{4}} \text{ converge}}$ par comparaison.

    **3.** La loi faible des grands nombres (théorème 16) majore la même probabilité par $\frac{\sigma^{2}}{n\varepsilon^{2}}$, qui est en $O\big(\frac{1}{n}\big)$, alors que la question 1 donne un majorant en $O\big(\frac{1}{n^{2}}\big)$. Si $\sigma > 0$, le rapport du second au premier est équivalent à $\frac{3\sigma^{2}}{n\varepsilon^{2}}$, qui tend vers $0$ : *pour $n$ grand, la majoration par le moment d'ordre $4$ est bien meilleure*. Elle est moins bonne pour $n$ petit. Pour des variables de loi $\mathcal{B}(\frac{1}{2})$, on a $\sigma^{2} = \frac{1}{4}$ et $\mu_{4} = \frac{1}{16}$ ; avec $\varepsilon = 0{,}1$, les deux majorants valent 
    $$\frac{25}{n} \qquad\text{et}\qquad \frac{625(3n - 2)}{n^{3}},$$
     et le second devient le meilleur à partir de $n = 75$ ✓ ; pour $n = 1\,000$, ils valent $0{,}025$ et environ $0{,}0019$.

    *À retenir.* Plus on utilise un moment d'ordre élevé dans l'inégalité de Markov, plus la décroissance obtenue est rapide ; la proposition 24 et l'exercice 101 poussent l'idée jusqu'au bout avec l'exponentielle. La convergence de la série de la question 2 est le point de départ de la démonstration de la loi *forte* des grands nombres, qui porte sur une suite infinie de variables et dépasse le cadre des univers finis.
