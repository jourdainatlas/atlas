  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 1
  types: [Modélisation]
  mots_cles: [conditionnement et indépendance, dénombrement, probabilités, indépendance]
  noeuds: [p-independance, n-fini, p-espace]
  notions: [probabilite-conditionnelle, independance, cardinal, probabilite]
  page_enonce: 10
  page_corrige: 37
  enonce: |
    Un livre contient quatre erreurs. À chaque relecture, chacune des erreurs qui subsistent est corrigée avec la probabilité $\frac{1}{3}$. On modélise $n$ relectures par des événements $C_{i,j}$, pour $i \in \llbracket 1\,,4 \rrbracket$ et $j \in \llbracket 1\,,n \rrbracket$, mutuellement indépendants et de probabilité $\frac{1}{3}$, où $C_{i,j}$ signifie que la $j$-ième relecture corrigerait l'erreur $i$ si elle subsistait encore.

    **1.** Quelle est la probabilité que l'erreur numéro $1$ ne soit pas corrigée à l'issue de la $n$-ième relecture ?

    **2.** Quelle est la probabilité que le livre ne contienne plus aucune erreur à l'issue de la $n$-ième relecture ? Combien de relectures faut-il pour que cette probabilité dépasse $0{,}9$ ?
  corrige: |
    **1.** L'erreur $i$ subsiste après la $j$-ième relecture si et seulement si elle subsistait avant cette relecture et si $C_{i,j}$ n'est pas réalisé. Par récurrence sur $j$, l'erreur $i$ subsiste après $n$ relectures si et seulement si l'événement $\overline{C_{i,1}} \cap \cdots \cap \overline{C_{i,n}}$ est réalisé. Ces contraires sont mutuellement indépendants (proposition 10 (iii)), de probabilité $\frac{2}{3}$ : 
    $$\boxed{\mathrm{P}(\text{l'erreur } 1 \text{ subsiste après } n \text{ relectures}) = \Big(\frac{2}{3}\Big)^{n}}$$

    **2.** Notons $S_{i} = \overline{C_{i,1}} \cap \cdots \cap \overline{C_{i,n}}$ l'événement « l'erreur $i$ subsiste ». Pour toute partie $I$ de $\llbracket 1\,,4 \rrbracket$, l'intersection des $S_{i}$ pour $i \in I$ est l'intersection des $\overline{C_{i,j}}$ pour $i \in I$ et $j \in \llbracket 1\,,n \rrbracket$, d'où, par l'indépendance mutuelle des $\overline{C_{i,j}}$, 
    $$\mathrm{P}\Big(\bigcap_{i \in I} S_{i}\Big) = \Big(\frac{2}{3}\Big)^{n|I|} = \prod_{i \in I} \mathrm{P}(S_{i}) :$$
     les événements $S_{1}$, …, $S_{4}$ sont mutuellement indépendants, donc aussi leurs contraires. Le livre ne contient plus d'erreur lorsque $\overline{S_{1}} \cap \cdots \cap \overline{S_{4}}$ est réalisé : 
    $$\boxed{\mathrm{P}(\text{plus aucune erreur après } n \text{ relectures}) = \Big(1 - \Big(\frac{2}{3}\Big)^{n}\Big)^{4}}$$
     Cette probabilité croît avec $n$. Un calcul exact en nombres rationnels donne 
    $$\Big(1 - \Big(\frac{2}{3}\Big)^{9}\Big)^{4} \approx 0{,}89994 < 0{,}9 < \Big(1 - \Big(\frac{2}{3}\Big)^{10}\Big)^{4} \approx 0{,}93242, \qquad \boxed{\text{il faut } 10 \text{ relectures}}$$

    *Piège.* La valeur obtenue pour $n = 9$ est à moins de $10^{-4}$ du seuil : en résolvant $\big(\frac{2}{3}\big)^{n} < 1 - 0{,}9^{1/4}$ par logarithmes, on trouve $n > 9{,}0015$, et une valeur approchée trop grossière de $0{,}9^{1/4}$ conduirait à la réponse fausse $n = 9$. Dans un tel cas, on contrôle les deux entiers voisins par un calcul exact. L'erreur la plus répandue, sur le fond, est de répondre $\big(\frac{2}{3}\big)^{4n}$ ou $1 - \big(\frac{2}{3}\big)^{4n}$ en mélangeant les quatre erreurs et les $n$ relectures.
- id: "ma-21-40"
  feuille: "f-ma-21"
  numero: 40
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [conditionnement et indépendance]
  noeuds: [p-independance]
  notions: [probabilite-conditionnelle, independance]
  page_enonce: 11
  page_corrige: 37
  enonce: |
    Soit $A$ et $B$ deux événements tels que $\mathrm{P}(A) > 0$. Montrer que 
    $$\mathrm{P}_{A \cup B}(A \cap B) \leqslant \mathrm{P}_{A}(A \cap B),$$
     et interpréter cette inégalité : quelle est l'information la plus favorable à la réalisation simultanée de $A$ et de $B$ ?
  corrige: |
    Comme $A \subset A \cup B$, on a $\mathrm{P}(A \cup B) \geqslant \mathrm{P}(A) > 0$, et les deux probabilités conditionnelles sont définies. Comme $(A \cap B) \cap (A \cup B) = A \cap B$ et $(A \cap B) \cap A = A \cap B$, 
    $$\mathrm{P}_{A \cup B}(A \cap B) = \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(A \cup B)} \leqslant \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(A)} = \mathrm{P}_{A}(A \cap B), \qquad \boxed{\mathrm{P}_{A \cup B}(A \cap B) \leqslant \mathrm{P}_{A}(A \cap B)}$$
     avec égalité si et seulement si $\mathrm{P}(A \cap B) = 0$ ou $\mathrm{P}(A \cup B) = \mathrm{P}(A)$, c'est-à-dire $\mathrm{P}(B \setminus A) = 0$.

    *Interprétation.* Les informations « $A$ est réalisé » et « $A$ ou $B$ est réalisé » ne sont pas aussi riches : la première est plus précise, et elle est plus favorable à la réalisation simultanée de $A$ et de $B$. Si $\mathrm{P}(B) > 0$, l'inégalité vaut aussi en échangeant $A$ et $B$, et 
    $$\mathrm{P}_{A}(A \cap B) = \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(A)}, \qquad \mathrm{P}_{B}(A \cap B) = \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(B)} :$$
     parmi les trois informations « $A$ », « $B$ » et « $A$ ou $B$ », la plus favorable est donc la réalisation de celui des deux événements qui est le *moins* probable, et la moins favorable est « $A$ ou $B$ ».

    C'est exactement l'exemple qui suit la proposition 8 : avec $A$ « l'aîné est un garçon » et $B$ « le cadet est un garçon », on a $A \cup B = U$ et $A \cap B = D$, et l'on y a trouvé $\mathrm{P}_{U}(D) = \frac{1}{3}$, contre $\mathrm{P}_{A}(D) = \frac{1}{2}$.

    *Piège.* L'erreur la plus répandue est de penser qu'en apprenant « $A$ ou $B$ », on apprend « au moins autant » qu'en apprenant « $A$ » : c'est l'inverse, puisque $A \cup B$ est un événement plus grand, donc une information plus pauvre. On retrouvera ce phénomène à l'exercice 42.
