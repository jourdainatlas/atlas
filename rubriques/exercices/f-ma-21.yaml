  enonce: |
    Soit $n \geqslant 2$ et $r \in \llbracket 2\,,2n \rrbracket$. Sur l'arche d'Utnapishtim se trouvent $2n$ animaux, deux pour chacune des $n$ espèces représentées. Pour visiter une île, il choisit $r$ animaux parmi les $2n$, tous les choix étant également probables. On note $N$ le nombre d'espèces dont les deux représentants font partie des animaux choisis. Calculer $\mathrm{E}(N)$, sans déterminer la loi de $N$.
  corrige: |
    On prend pour univers l'ensemble des parties à $r$ éléments de l'ensemble des $2n$ animaux, muni de la probabilité uniforme ; il a $\tbinom{2n}{r}$ éléments (théorème 2). On applique la méthode des indicatrices (section 21.6.3). Pour $i \in \llbracket 1\,,n \rrbracket$, soit $A_{i}$ l'événement « les deux animaux de l'espèce $i$ sont choisis ». Alors $N = \sum_{i=1}^{n} \mathbf{1}_{A_{i}}$. Une partie favorable à $A_{i}$ est formée des deux animaux de l'espèce $i$ et de $r - 2$ animaux choisis parmi les $2n - 2$ autres : 
    $$\mathrm{P}(A_{i}) = \frac{\binom{2n - 2}{r - 2}}{\binom{2n}{r}} = \frac{(2n - 2)!}{(r - 2)!\,(2n - r)!} \cdot \frac{r!\,(2n - r)!}{(2n)!} = \frac{r(r - 1)}{2n(2n - 1)}.$$
     Par linéarité (théorème 9 (i) et (iv)), 
    $$\boxed{\mathrm{E}(N) = n\,\frac{r(r - 1)}{2n(2n - 1)} = \frac{r(r - 1)}{2(2n - 1)}}$$
     Pour $r = 2n$, tous les animaux sont choisis, et l'on retrouve $\mathrm{E}(N) = n$ ; pour $r = 2$, $\mathrm{E}(N) = \frac{1}{2n - 1}$, probabilité que le second animal soit le partenaire du premier. Les valeurs ont été vérifiées par énumération pour $n \leqslant 4$ et tous les $r$ ✓.

    *À retenir.* Les événements $A_{i}$ ne sont pas indépendants, et la loi de $N$ est compliquée ; la linéarité de l'espérance n'en demande pas tant. C'est tout l'intérêt de la méthode des indicatrices.
- id: "ma-21-74"
  feuille: "f-ma-21"
  numero: 74
  partie: "Espérance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, indépendance, variables aléatoires]
  noeuds: [p-esperance, p-independance, p-variables]
  notions: [esperance, independance, variable-aleatoire]
  page_enonce: 18
  page_corrige: 68
  enonce: |
    Soit $p \in [0\,,1]$, $n \in \mathbb{N}^{*}$, $X_{1}$, …, $X_{n}$ des variables de loi $\mathcal{B}(p)$ et $N$ une variable à valeurs dans $\llbracket 1\,,n \rrbracket$, les variables $X_{1}$, …, $X_{n}$, $N$ étant mutuellement indépendantes. On pose $S = \sum_{i=1}^{N} X_{i}$, c'est-à-dire $S(\omega) = \sum_{i=1}^{N(\omega)} X_{i}(\omega)$ pour toute issue $\omega$. Calculer $\mathrm{E}(S)$ en fonction de $p$ et de $\mathrm{E}(N)$. On pourra écrire $S = \sum_{i=1}^{n} X_{i}\,\mathbf{1}_{(N \geqslant i)}$.
  corrige: |
    Soit $\omega$ une issue. Comme $N(\omega) \in \llbracket 1\,,n \rrbracket$, l'indicatrice $\mathbf{1}_{(N \geqslant i)}(\omega)$ vaut $1$ pour $i \leqslant N(\omega)$ et $0$ pour $i > N(\omega)$, d'où l'égalité suggérée : 
    $$S = \sum_{i=1}^{n} X_{i}\,\mathbf{1}_{(N \geqslant i)}.$$
     Pour chaque $i$, la variable $\mathbf{1}_{(N \geqslant i)}$ est une fonction de $N$, donc elle est indépendante de $X_{i}$ (proposition 16). Par la proposition 20, $\mathrm{E}\big(X_{i}\,\mathbf{1}_{(N \geqslant i)}\big) = \mathrm{E}(X_{i})\mathrm{P}(N \geqslant i) = p\,\mathrm{P}(N \geqslant i)$, et la linéarité donne 
    $$\mathrm{E}(S) = p\sum_{i=1}^{n} \mathrm{P}(N \geqslant i).$$
     Enfin, en appliquant le même raisonnement à la constante $1$ au lieu des $X_{i}$, $N = \sum_{i=1}^{n} \mathbf{1}_{(N \geqslant i)}$, donc $\mathrm{E}(N) = \sum_{i=1}^{n} \mathrm{P}(N \geqslant i)$. Ainsi 
    $$\boxed{\mathrm{E}(S) = p\,\mathrm{E}(N)}$$
     Pour $n = 3$, avec $\mathrm{P}(N = 1) = \frac{1}{2}$, $\mathrm{P}(N = 2) = \frac{1}{3}$ et $\mathrm{P}(N = 3) = \frac{1}{6}$, le calcul exact sur l'univers produit donne $\mathrm{E}(S) = \frac{5}{3}p$ pour $p = \frac{1}{3}$ et $p = \frac{1}{2}$ ✓.

    Le résultat est intuitif : on effectue en moyenne $\mathrm{E}(N)$ épreuves, qui réussissent chacune avec la probabilité $p$. Il n'est pourtant pas évident, puisque le nombre de termes de la somme est lui-même aléatoire.

    *Piège.* L'erreur la plus répandue est d'écrire $\mathrm{E}(S) = \sum_{i=1}^{\mathrm{E}(N)} \mathrm{E}(X_{i})$, ce qui n'a pas de sens si $\mathrm{E}(N)$ n'est pas entier, ou d'appliquer la linéarité à une somme dont le nombre de termes dépend de $\omega$. L'écriture avec les indicatrices ramène $S$ à une somme d'un nombre *fixe* de termes. L'indépendance entre $N$ et les $X_{i}$ est indispensable : si l'on arrête les épreuves au premier succès, $N$ dépend des $X_{i}$, et le résultat tombe en défaut.
- id: "ma-21-75"
  feuille: "f-ma-21"
  numero: 75
  partie: "Espérance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espérance, variables aléatoires]
  noeuds: [p-esperance, p-variables]
  notions: [esperance, variable-aleatoire]
  page_enonce: 18
  page_corrige: 69
  enonce: |
    **1.** Soit $X$ une variable aléatoire à valeurs dans $\llbracket 1\,,n \rrbracket$. Montrer que la loi de $X$ est déterminée par les nombres $\mathrm{E}(X^{k})$, pour $k \in \llbracket 0\,,n - 1 \rrbracket$. On pourra utiliser le déterminant de Vandermonde du chapitre 17.

    **2.** Soit $X$ et $Y$ deux variables aléatoires réelles telles que $\mathrm{E}(X^{k}) = \mathrm{E}(Y^{k})$ pour tout $k \in \mathbb{N}$. Montrer que $X$ et $Y$ ont la même loi. On pourra utiliser les polynômes interpolateurs de Lagrange du chapitre 13.
  corrige: |
    **1.** On note $p_{j} = \mathrm{P}(X = j)$ pour $j \in \llbracket 1\,,n \rrbracket$, et $m_{k} = \mathrm{E}(X^{k})$. Par la formule de transfert, 
    $$m_{k} = \sum_{j=1}^{n} j^{k}p_{j}, \qquad k \in \llbracket 0\,,n - 1 \rrbracket.$$
     C'est un système linéaire de $n$ équations aux $n$ inconnues $p_{1}$, …, $p_{n}$, dont la matrice $\big(j^{k}\big)_{0 \leqslant k \leqslant n-1,\ 1 \leqslant j \leqslant n}$ est la transposée de la matrice de Vandermonde des réels $1$, $2$, …, $n$. Son déterminant, égal à celui de sa transposée (chapitre 17, théorème 6 (iv)), vaut $\prod_{1 \leqslant i < j \leqslant n} (j - i) \neq 0$ (chapitre 17, proposition 12), puisque ces réels sont distincts. La matrice est inversible, et le système a une unique solution : $\boxed{\text{la loi de } X \text{ est déterminée par } \mathrm{E}(X^{0}), \dots, \mathrm{E}(X^{n-1})}$. Deux variables à valeurs dans $\llbracket 1\,,n \rrbracket$ qui ont les mêmes moments d'ordre $0$ à $n - 1$ ont la même loi.

    **2.** Soit $x_{1}$, …, $x_{m}$ les éléments, deux à deux distincts, de l'ensemble fini $X(\Omega) \cup Y(\Omega')$, où $\Omega'$ est l'univers sur lequel $Y$ est définie. Soit $i \in \llbracket 1\,,m \rrbracket$, et $L_{i}$ le polynôme interpolateur de Lagrange tel que $L_{i}(x_{j}) = 1$ si $j = i$ et $0$ sinon (chapitre 13, théorème 13). Par la formule de transfert, en sommant sur les $x_{j}$ et en ajoutant des termes nuls, 
    $$\mathrm{E}\big(L_{i}(X)\big) = \sum_{j=1}^{m} L_{i}(x_{j})\mathrm{P}(X = x_{j}) = \mathrm{P}(X = x_{i}),$$
     et de même $\mathrm{E}\big(L_{i}(Y)\big) = \mathrm{P}(Y = x_{i})$. Si $L_{i} = \sum_{k} a_{k}X^{k}$, la linéarité de l'espérance et l'hypothèse donnent 
    $$\mathrm{E}\big(L_{i}(X)\big) = \sum_{k} a_{k}\mathrm{E}(X^{k}) = \sum_{k} a_{k}\mathrm{E}(Y^{k}) = \mathrm{E}\big(L_{i}(Y)\big).$$
     Ainsi $\mathrm{P}(X = x_{i}) = \mathrm{P}(Y = x_{i})$ pour tout $i$, et 
    $$\boxed{X \text{ et } Y \text{ ont la même loi}}$$
     On n'a utilisé que les moments d'ordre au plus $m - 1$, puisque $\deg L_{i} \leqslant m - 1$.

    *Piège.* Les premiers moments ne suffisent pas. Supposons que $X$ suive la loi uniforme sur $\{-1, 1\}$, et que $Y$ prenne les valeurs $-\sqrt{2}$ et $\sqrt{2}$ avec la probabilité $\frac{1}{4}$ et la valeur $0$ avec la probabilité $\frac{1}{2}$. Alors $\mathrm{E}(X) = \mathrm{E}(Y) = 0$ et $\mathrm{E}(X^{2}) = \mathrm{E}(Y^{2}) = 1$, mais $\mathrm{E}(X^{4}) = 1 \neq 2 = \mathrm{E}(Y^{4})$. L'erreur la plus répandue est de croire que l'espérance et la variance déterminent la loi ; il faut autant de moments que de valeurs possibles, moins une.
- id: "ma-21-76"
  feuille: "f-ma-21"
  numero: 76
  partie: "Espérance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, permutations, variables aléatoires, loi uniforme]
  noeuds: [p-esperance, v-permutations, p-variables]
  notions: [esperance, variable-aleatoire]
  page_enonce: 19
  page_corrige: 70
  enonce: |
    Soit $n \geqslant 2$ et $\Sigma$ une variable aléatoire de loi uniforme sur $\mathfrak{S}_{n}$, comme dans l'exercice 66.

    **1.** Une *inversion* d'une permutation $\sigma$ est un couple $(i, j)$ tel que $i < j$ et $\sigma(i) > \sigma(j)$. Calculer l'espérance du nombre d'inversions de $\Sigma$, à l'aide de l'exercice 66.

    **2.** La *première montée* d'une permutation $\sigma$ est le plus grand intervalle d'entiers de la forme $\llbracket 1\,,k \rrbracket$ sur lequel $\sigma$ est croissante ; on note $L$ la longueur $k$ de la première montée de $\Sigma$. Calculer $\mathrm{P}(L \geqslant k)$ pour $k \in \llbracket 1\,,n \rrbracket$, puis la loi de $L$.

    **3.** Montrer que $\mathrm{E}(L) = \displaystyle\sum_{k=1}^{n} \mathrm{P}(L \geqslant k)$, puis calculer $\mathrm{E}(L)$ et sa limite quand $n$ tend vers $+\infty$.
  corrige: |
    **1.** Soit $i < j$. L'application $\sigma \mapsto \sigma \circ (i\ j)$ est une bijection de $\mathfrak{S}_{n}$ sur lui-même, qui préserve donc la loi uniforme, et elle échange les événements $\big(\Sigma(i) < \Sigma(j)\big)$ et $\big(\Sigma(i) > \Sigma(j)\big)$. Ces deux événements, incompatibles et de réunion $\Omega$ puisque $\Sigma(i) \neq \Sigma(j)$, ont donc la même probabilité $\frac{1}{2}$ ; c'est le calcul de l'exercice 66 (question 1 (a)), fait pour $i = 1$ et $j = 2$. Le nombre d'inversions est $I = \sum_{i<j} \mathbf{1}_{(\Sigma(i) > \Sigma(j))}$, somme de $\tbinom{n}{2}$ indicatrices, et 
    $$\boxed{\mathrm{E}(I) = \frac{1}{2}\binom{n}{2} = \frac{n(n - 1)}{4}}$$
     Une permutation aléatoire a en moyenne la moitié du nombre maximal $\tbinom{n}{2}$ d'inversions, atteint par la permutation $k \mapsto n + 1 - k$. Les inversions sont les « dérangements » de Cramer évoqués au chapitre 17, dont la parité donne la signature (chapitre 17, démonstration de la proposition 4).

    **2.** Soit $k \in \llbracket 1\,,n \rrbracket$. La permutation $\Sigma$ est croissante sur $\llbracket 1\,,L \rrbracket$, donc sur $\llbracket 1\,,k \rrbracket$ si $L \geqslant k$ ; réciproquement, si elle est croissante sur $\llbracket 1\,,k \rrbracket$, le plus grand intervalle de cette forme sur lequel elle l'est a au moins $k$ éléments. Ainsi $(L \geqslant k) = \big(\Sigma(1) < \Sigma(2) < \cdots < \Sigma(k)\big)$. Une permutation de cet événement est déterminée par l'ensemble $\{\sigma(1), \dots, \sigma(k)\}$, que l'on choisit de $\tbinom{n}{k}$ façons, l'ordre étant alors imposé, et par la bijection de $\llbracket k + 1\,,n \rrbracket$ sur les $n - k$ valeurs restantes, choisie de $(n - k)!$ façons : 
    $$\mathrm{P}(L \geqslant k) = \frac{1}{n!}\binom{n}{k}(n - k)!, \qquad \boxed{\mathrm{P}(L \geqslant k) = \frac{1}{k!}}$$
     Comme $(L = k) = (L \geqslant k) \setminus (L \geqslant k + 1)$, avec $(L \geqslant k + 1) \subset (L \geqslant k)$, la proposition 7 (ii) donne 
    $$\boxed{\mathrm{P}(L = k) = \frac{1}{k!} - \frac{1}{(k + 1)!} = \frac{k}{(k + 1)!} \ \text{ pour } k \in \llbracket 1\,,n - 1 \rrbracket, \qquad \mathrm{P}(L = n) = \frac{1}{n!}}$$

    **3.** Comme $L$ est à valeurs dans $\llbracket 1\,,n \rrbracket$, on a, pour toute issue, $L = \sum_{k=1}^{n} \mathbf{1}_{(L \geqslant k)}$ : la somme compte les entiers $k \in \llbracket 1\,,n \rrbracket$ tels que $k \leqslant L$, qui sont au nombre de $L$. La linéarité donne 
    $$\mathrm{E}(L) = \sum_{k=1}^{n} \mathrm{P}(L \geqslant k), \qquad \boxed{\mathrm{E}(L) = \sum_{k=1}^{n} \frac{1}{k!} \xrightarrow[n \to +\infty]{} \mathrm{e} - 1}$$
     par la série exponentielle du chapitre 20. La convergence est très rapide : pour $n = 6$, $\mathrm{E}(L) \approx 1{,}71806$, contre $\mathrm{e} - 1 \approx 1{,}71828$. Les résultats ont été vérifiés par énumération pour $n \leqslant 6$ ✓.

    *À retenir.* La formule $\mathrm{E}(L) = \sum_{k \geqslant 1} \mathrm{P}(L \geqslant k)$, pour une variable à valeurs entières positives, est souvent plus commode que la définition : ici, les probabilités $\mathrm{P}(L \geqslant k)$ sont plus simples que les $\mathrm{P}(L = k)$. Elle resservira dans les exercices 83 et 90.
- id: "ma-21-77"
  feuille: "f-ma-21"
  numero: 77
  partie: "Espérance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance, probabilités, indépendance, variables aléatoires, jeux de hasard]
  noeuds: [p-esperance, p-espace, p-independance, p-variables]
  notions: [esperance, probabilite, independance, variable-aleatoire]
  page_enonce: 19
  page_corrige: 70
  enonce: |
    Soit $n \geqslant 2$ et $p \in \left]0\,,1\right[$, et $q = 1 - p$. On lance $n$ fois une pièce qui donne pile avec la probabilité $p$, les lancers étant indépendants. Pour $k \in \llbracket 1\,,n \rrbracket$, on appelle *$k$-chaîne de piles* une suite de $k$ lancers consécutifs ayant tous donné pile, précédée d'un face ou placée au début, et suivie d'un face ou placée à la fin. On note $Y_{k}$ le nombre de $k$-chaînes de piles obtenues ; par exemple, pour $n = 11$ et la suite de résultats $PPFFPPPFPFP$, on a $Y_{1} = 2$, $Y_{2} = 1$ et $Y_{3} = 1$.

    **1.** Déterminer la loi de $Y_{n}$ et son espérance.

    **2.** Montrer que $\mathrm{P}(Y_{n-1} = 1) = 2qp^{n-1}$, et en déduire $\mathrm{E}(Y_{n-1})$.

    **3.** Soit $k \in \llbracket 1\,,n - 2 \rrbracket$. Pour $i \in \llbracket 1\,,n - k + 1 \rrbracket$, on note $X_{i,k}$ la variable qui vaut $1$ si une $k$-chaîne de piles commence au $i$-ième lancer, et $0$ sinon.

    **(a)** Calculer $\mathrm{P}(X_{1,k} = 1)$ et $\mathrm{P}(X_{n-k+1,k} = 1)$, puis montrer que $\mathrm{P}(X_{i,k} = 1) = q^{2}p^{k}$ pour $i \in \llbracket 2\,,n - k \rrbracket$.

    **(b)** Exprimer $Y_{k}$ à l'aide des variables $X_{i,k}$, puis calculer $\mathrm{E}(Y_{k})$.
  corrige: |
    On modélise les $n$ lancers par l'univers $\Omega = \{P, F\}^{n}$, muni de la probabilité qui donne à une suite comportant $j$ piles la probabilité $p^{j}q^{n-j}$ : par la proposition 17, les résultats des lancers sont alors mutuellement indépendants, et chacun donne pile avec la probabilité $p$.

    **1.** Une $n$-chaîne de piles occupe tous les lancers ; elle existe si et seulement si tous les lancers donnent pile. Ainsi $Y_{n}$ prend les valeurs $0$ et $1$, et $\mathrm{P}(Y_{n} = 1) = p^{n}$ : 
    $$\boxed{Y_{n} \sim \mathcal{B}(p^{n}), \qquad \mathrm{E}(Y_{n}) = p^{n}}$$

    **2.** Deux chaînes distinctes sont séparées par au moins un face ; deux $(n - 1)$-chaînes occuperaient donc au moins $2(n - 1) + 1 = 2n - 1 > n$ lancers. Il y a donc au plus une $(n - 1)$-chaîne, et $Y_{n-1}$ prend les valeurs $0$ et $1$. Une $(n - 1)$-chaîne occupe soit les lancers $1$ à $n - 1$, et elle est suivie d'un face au lancer $n$, soit les lancers $2$ à $n$, et elle est précédée d'un face au lancer $1$. Ces deux cas sont les issues $P \cdots PF$ et $FP \cdots P$, distinctes, d'où 
    $$\boxed{\mathrm{P}(Y_{n-1} = 1) = 2qp^{n-1}} \qquad\text{et}\qquad \boxed{\mathrm{E}(Y_{n-1}) = 2qp^{n-1}}$$

    **3. (a)** Soit $k \in \llbracket 1\,,n - 2 \rrbracket$. Une $k$-chaîne commence au lancer $1$ si et seulement si les lancers $1$ à $k$ donnent pile et le lancer $k + 1$, qui existe puisque $k + 1 \leqslant n$, donne face. De même, une $k$-chaîne commence au lancer $n - k + 1$ si et seulement si les $k$ derniers lancers donnent pile et le lancer $n - k \geqslant 1$ donne face. Par indépendance, 
    $$\boxed{\mathrm{P}(X_{1,k} = 1) = \mathrm{P}(X_{n-k+1,k} = 1) = qp^{k}}$$
     Pour $i \in \llbracket 2\,,n - k \rrbracket$, une $k$-chaîne commence au lancer $i$ si et seulement si le lancer $i - 1$ donne face, les lancers $i$ à $i + k - 1$ donnent pile, et le lancer $i + k \leqslant n$ donne face : $\boxed{\mathrm{P}(X_{i,k} = 1) = q^{2}p^{k}}$.

    **(b)** Chaque $k$-chaîne a un premier lancer, d'indice $i \in \llbracket 1\,,n - k + 1 \rrbracket$, et deux chaînes distinctes commencent à des lancers distincts : $Y_{k} = \sum_{i=1}^{n-k+1} X_{i,k}$. Les variables $X_{i,k}$ suivent des lois de Bernoulli, et la linéarité donne, avec les deux extrémités et les $n - k - 1$ positions intérieures, 
    $$\boxed{\mathrm{E}(Y_{k}) = 2qp^{k} + (n - k - 1)q^{2}p^{k}, \qquad k \in \llbracket 1\,,n - 2 \rrbracket}$$
     Pour l'exemple de l'énoncé, l'issue $PPFFPPPFPFP$ a bien $X_{1,2} = 1$, $X_{5,3} = 1$, $X_{9,1} = 1$ et $X_{11,1} = 1$, d'où $Y_{2} = Y_{3} = 1$ et $Y_{1} = 2$. Les trois formules ont été vérifiées par énumération pour $n \leqslant 7$, avec $p = \frac{1}{3}$ et $p = \frac{1}{2}$ ✓. La formule de la question 3 reste vraie pour $k = n - 1$, où le second terme est nul, mais pas pour $k = n$, puisqu'une $n$-chaîne n'est entourée d'aucun face.

    *Piège.* L'erreur la plus répandue est d'oublier les effets de bord : une chaîne placée au début ou à la fin n'a besoin que d'un face pour être délimitée, d'où le facteur $q$ au lieu de $q^{2}$.
- id: "ma-21-78"
  feuille: "f-ma-21"
  numero: 78
  partie: "Espérance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [espérance, probabilités, variables aléatoires]
  noeuds: [p-esperance, p-espace, p-variables]
  notions: [esperance, probabilite, variable-aleatoire]
  page_enonce: 19
  page_corrige: 71
  enonce: |
    Dans un troupeau, chaque vache est atteinte d'une maladie avec la probabilité $p = 0{,}15$, indépendamment des autres. Pour dépister la maladie chez $n \geqslant 2$ vaches, on dispose de deux méthodes. Dans la première, on analyse le lait de chaque vache, ce qui demande $n$ analyses. Dans la seconde, on analyse le mélange des laits des $n$ vaches : si le résultat est négatif, aucune vache n'est malade et l'on s'arrête ; sinon, on analyse le lait de chaque vache. On note $X_{n}$ le nombre d'analyses effectuées avec la seconde méthode, et $Y_{n} = \frac{X_{n}}{n}$ le nombre moyen d'analyses par vache.

    **1.** Déterminer la loi de $Y_{n}$, et montrer que $\mathrm{E}(Y_{n}) = 1 + \frac{1}{n} - (0{,}85)^{n}$.

    **2.** On pose $a = \ln(0{,}85)$ et $f(x) = ax + \ln x$ pour $x > 0$. Étudier les variations de $f$, et déterminer les entiers $n \geqslant 2$ tels que $f(n) > 0$.

    **3.** Montrer que $f(n) > 0$ si et seulement si $\mathrm{E}(Y_{n}) < 1$. Pour quels effectifs la seconde méthode est-elle avantageuse en moyenne ? Quel effectif minimise le nombre moyen d'analyses par vache ?
  corrige: |
    Pour $i \in \llbracket 1\,,n \rrbracket$, soit $M_{i}$ l'indicatrice de l'événement « la vache $i$ est malade » ; les $M_{i}$ sont mutuellement indépendantes, de loi $\mathcal{B}(0{,}15)$, et l'on n'a pas besoin de décrire l'univers (proposition 17).

    **1.** Si aucune vache n'est malade, la seconde méthode demande une analyse ; sinon, elle en demande $1 + n$. L'événement « aucune vache n'est malade » est $(M_{1} = 0, \dots, M_{n} = 0)$, de probabilité $0{,}85^{n}$ par indépendance. La variable $Y_{n}$ prend donc deux valeurs : 
    $$\boxed{\mathrm{P}\Big(Y_{n} = \frac{1}{n}\Big) = 0{,}85^{n}, \qquad \mathrm{P}\Big(Y_{n} = 1 + \frac{1}{n}\Big) = 1 - 0{,}85^{n}}$$
     et 
    $$\mathrm{E}(Y_{n}) = \frac{1}{n}\,0{,}85^{n} + \Big(1 + \frac{1}{n}\Big)(1 - 0{,}85^{n}), \qquad \boxed{\mathrm{E}(Y_{n}) = 1 + \frac{1}{n} - 0{,}85^{n}}$$

    **2.** La fonction $f$ est dérivable sur $\left]0\,,+\infty\right[$, et $f'(x) = a + \frac{1}{x}$, du signe de $1 + ax$, puisque $x > 0$. Comme $a < 0$, $f'$ s'annule en $x_{0} = -\frac{1}{a} \approx 6{,}15$, et 
    $$\boxed{f \text{ croît sur } \left]0\,,x_{0}\right] \text{ et décroît sur } \left[x_{0}\,,+\infty\right[, \qquad x_{0} = -\frac{1}{\ln(0{,}85)} \approx 6{,}15}$$
     De plus $f(x) \to -\infty$ quand $x \to 0$, et aussi quand $x \to +\infty$, puisque $\ln x = o(x)$ (chapitre 10) ; le maximum vaut $f(x_{0}) = -1 + \ln(x_{0}) \approx 0{,}817 > 0$. Par stricte monotonie de part et d'autre de $x_{0}$, l'ensemble des $x$ tels que $f(x) > 0$ est un intervalle ouvert qui contient $x_{0}$. Or $f(n) > 0$ équivaut à $n\,0{,}85^{n} > 1$, et 
    $$2 \times 0{,}85^{2} = 1{,}445 > 1, \qquad 17 \times 0{,}85^{17} \approx 1{,}073 > 1, \qquad 18 \times 0{,}85^{18} \approx 0{,}966 < 1.$$
     Comme $2 < x_{0} < 17$, la monotonie de $f$ sur $[2\,,x_{0}]$ et sur $[x_{0}\,,17]$ donne $f(x) \geqslant \min\big(f(2), f(17)\big) > 0$ sur $[2\,,17]$, puis $f(n) \leqslant f(18) < 0$ pour $n \geqslant 18$, par décroissance : 
    $$\boxed{f(n) > 0 \iff n \in \llbracket 2\,,17 \rrbracket}$$

    **3.** Par la question 1, $\mathrm{E}(Y_{n}) < 1 \iff \frac{1}{n} < 0{,}85^{n} \iff -\ln n < n\ln(0{,}85) \iff f(n) > 0$, la fonction $\ln$ étant strictement croissante. La seconde méthode demande en moyenne moins d'une analyse par vache, et elle est donc avantageuse en moyenne, $\boxed{\text{pour les troupeaux de } 2 \text{ à } 17 \text{ vaches}}$.

    Pour l'effectif optimal, on calcule 
    $$\begin{array}{c|cccccc} n & 2 & 3 & 4 & 5 & 6 & 7 \\ \hline \mathrm{E}(Y_{n}) & 0{,}7775 & 0{,}7192 & 0{,}7280 & 0{,}7563 & 0{,}7895 & 0{,}8223 \end{array}$$
     les valeurs autres que la première étant arrondies. Pour $n \geqslant 8$, on a $0{,}85^{n} \leqslant 0{,}85^{8}$, donc 
    $$\mathrm{E}(Y_{n}) > 1 - 0{,}85^{n} \geqslant 1 - 0{,}85^{8} \approx 0{,}7275 > \mathrm{E}(Y_{3}).$$
     Ainsi l'effectif $n = 3$ minimise le nombre moyen d'analyses par vache : 
    $$\boxed{n = 3, \qquad \mathrm{E}(Y_{3}) = 1 + \frac{1}{3} - 0{,}85^{3} \approx 0{,}719}$$
     En regroupant les vaches par trois, on économise en moyenne $28\,\%$ des analyses.

    ![Figure](documents/figures/51301de07b9d246c.svg)

    Les points bleus, de $n = 2$ à $n = 17$, sont sous la droite rouge d'ordonnée $1$, qui représente la première méthode : le regroupement y est avantageux ; à partir de $n = 18$, en ocre, il ne l'est plus. Le minimum, entouré, est atteint pour $n = 3$, bien avant le maximum $x_{0} \approx 6{,}15$ de $f$, qui ne mesure que le signe de $1 - \mathrm{E}(Y_{n})$, et non sa valeur.

    *Piège.* L'erreur la plus répandue est de chercher l'effectif optimal en maximisant $f$, ce qui donnerait $n = 6$ : la fonction $f$ ne sert qu'à comparer $\mathrm{E}(Y_{n})$ à $1$, et la quantité à minimiser est $\frac{1}{n} - 0{,}85^{n}$, qui n'a pas les mêmes variations.
- id: "ma-21-79"
  feuille: "f-ma-21"
  numero: 79
  partie: "Espérance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espérance, probabilités, variables aléatoires, loi uniforme]
  noeuds: [p-esperance, p-espace, p-variables]
  notions: [esperance, probabilite, variable-aleatoire]
  page_enonce: 19
  page_corrige: 73
  enonce: |
    *Entropie.* Soit $X$ une variable aléatoire qui prend les valeurs distinctes $x_{1}$, …, $x_{n}$ avec les probabilités $p_{1}$, …, $p_{n}$. Son *entropie* est le réel $H(X) = -\sum_{i=1}^{n} p_{i}\ln p_{i}$, avec la convention $0\ln 0 = 0$. Lorsque tous les $p_{i}$ sont non nuls, c'est l'espérance de la variable $-\ln f(X)$, où $f$ est définie par $f(x_{i}) = p_{i}$.

    **1.** Montrer que $H(X) \geqslant 0$, avec égalité si et seulement s'il existe $i$ tel que $p_{i} = 1$.

    **2.** Montrer que $-x\ln x \leqslant 1 - x$ pour tout $x \geqslant 0$, avec la même convention, et avec égalité si et seulement si $x = 1$. En déduire que $-np_{k}\ln(np_{k}) \leqslant 1 - np_{k}$ pour tout $k$.

    **3.** En déduire que $H(X) \leqslant \ln n$, avec égalité si et seulement si $X$ suit la loi uniforme sur l'ensemble de ses valeurs.
  corrige: |
    **1.** Pour chaque $i$, $p_{i} \in [0\,,1]$, donc $\ln p_{i} \leqslant 0$ si $p_{i} > 0$, et $-p_{i}\ln p_{i} \geqslant 0$, ce qui reste vrai, avec la convention, si $p_{i} = 0$. Ainsi $\boxed{H(X) \geqslant 0}$, comme somme de termes positifs. Elle est nulle si et seulement si chaque terme est nul, c'est-à-dire si $p_{i} \in \{0, 1\}$ pour tout $i$ ; comme $\sum p_{i} = 1$, cela signifie qu'un des $p_{i}$ vaut $1$ et les autres $0$ : 
    $$\boxed{H(X) = 0 \iff \exists i,\ p_{i} = 1}$$
     Une variable d'entropie nulle prend une valeur avec la probabilité $1$ : il n'y a aucune incertitude sur sa valeur.

    **2.** Soit $\varphi(x) = 1 - x + x\ln x$ pour $x > 0$, et $\varphi(0) = 1$, conformément à la convention. Sur $\left]0\,,+\infty\right[$, $\varphi'(x) = -1 + \ln x + 1 = \ln x$ : $\varphi$ est strictement décroissante sur $\left]0\,,1\right]$ et strictement croissante sur $[1\,,+\infty[$, de minimum $\varphi(1) = 0$. Donc $\varphi(x) > 0$ pour $x > 0$, $x \neq 1$, et $\varphi(0) = 1 > 0$ : 
    $$\boxed{-x\ln x \leqslant 1 - x \ \text{ pour tout } x \geqslant 0, \text{ avec égalité si et seulement si } x = 1}$$
     Pour $x = np_{k} \geqslant 0$, on obtient $\boxed{-np_{k}\ln(np_{k}) \leqslant 1 - np_{k}}$, avec égalité si et seulement si $p_{k} = \frac{1}{n}$.

    **3.** Si $p_{k} > 0$, $-np_{k}\ln(np_{k}) = -np_{k}\ln n - np_{k}\ln p_{k}$, et cette égalité reste vraie, avec la convention, si $p_{k} = 0$, les trois termes étant nuls. En sommant les inégalités de la question 2 sur $k$, et comme $\sum_{k} p_{k} = 1$, 
    $$-n\ln n + nH(X) = \sum_{k=1}^{n} \big(-np_{k}\ln(np_{k})\big) \leqslant \sum_{k=1}^{n} (1 - np_{k}) = n - n = 0, \qquad\text{d'où}\qquad \boxed{H(X) \leqslant \ln n}$$
     Il y a égalité si et seulement si chacune des $n$ inégalités est une égalité, c'est-à-dire si $p_{k} = \frac{1}{n}$ pour tout $k$ : 
    $$\boxed{H(X) = \ln n \iff X \text{ suit la loi uniforme sur } \{x_{1}, \dots, x_{n}\}}$$
     La majoration a été contrôlée sur $1\,000$ lois tirées au hasard, dont certaines ont des probabilités nulles ✓.

    L'entropie mesure l'incertitude sur la valeur de $X$ : elle est nulle pour une variable constante, et maximale pour la loi uniforme, où aucune valeur n'est privilégiée. Elle ne dépend que des probabilités, et non des valeurs $x_{i}$ ; pour la loi uniforme sur $2^{m}$ valeurs, $H = m\ln 2$, soit $m$ « bits » d'information.

    *Piège.* Certaines probabilités $p_{k}$ peuvent être nulles : c'est pourquoi l'inégalité de la question 2 est demandée pour $x \geqslant 0$, et non seulement pour $x > 0$. L'erreur la plus répandue est d'écrire $\ln(np_{k})$ sans vérifier que $p_{k} > 0$.
- id: "ma-21-80"
  feuille: "f-ma-21"
  numero: 80
  partie: "Espérance"
  etoiles: 3
  types: [Calcul]
  mots_cles: [espérance, indépendance, variables aléatoires, tirages]
  noeuds: [p-esperance, p-independance, p-variables, p-espace]
  notions: [esperance, independance, variable-aleatoire]
  page_enonce: 20
  page_corrige: 73
  enonce: |
    Soit $n \geqslant 2$ et $r \geqslant 1$ deux entiers. On place $r$ boules numérotées de $1$ à $r$ dans $n$ tiroirs numérotés de $1$ à $n$, chaque boule étant placée dans un tiroir choisi au hasard, toutes les répartitions étant également probables. Pour $k \in \llbracket 1\,,n \rrbracket$, on note $X_{k}$ le nombre de boules placées dans le tiroir $k$, et l'on note $V$ le nombre de tiroirs restés vides.

    **1.** Déterminer la loi de $X_{k}$ et son espérance.

    **2.** Les variables $X_{1}$, …, $X_{n}$ sont-elles indépendantes ?

    **3.** Calculer $\mathrm{E}(V)$ par la méthode des indicatrices. Lorsque $r = n$, déterminer la limite de la proportion moyenne $\frac{\mathrm{E}(V)}{n}$ de tiroirs vides quand $n$ tend vers $+\infty$.

    **4.** Déterminer la loi de $V$ à l'aide de l'exercice 15.
  corrige: |
    On prend pour univers $\Omega = \llbracket 1\,,n \rrbracket^{r}$, ensemble des $r$-listes $\omega = (T_{1}, \dots, T_{r})$, où $T_{j}$ est le tiroir de la boule $j$, muni de la probabilité uniforme ; il a $n^{r}$ éléments (proposition 3). Par la proposition 17, les variables $T_{1}$, …, $T_{r}$ sont mutuellement indépendantes, de loi uniforme sur $\llbracket 1\,,n \rrbracket$.

    **1.** Pour $k \in \llbracket 1\,,n \rrbracket$, on a $X_{k} = \sum_{j=1}^{r} \mathbf{1}_{(T_{j} = k)}$. Les indicatrices $\mathbf{1}_{(T_{j} = k)}$, fonctions des $T_{j}$, sont mutuellement indépendantes (proposition 16), de loi $\mathcal{B}(\frac{1}{n})$. Par le théorème 8, 
    $$\boxed{X_{k} \sim \mathcal{B}(r,\tfrac{1}{n}), \qquad \mathrm{E}(X_{k}) = \frac{r}{n}}$$

    **2.** Les variables $X_{1}$, …, $X_{n}$ ont pour somme $r$, et ne sont pas indépendantes. Par exemple, comme $n \geqslant 2$ et $r \geqslant 1$, l'événement $(X_{1} = r, X_{2} = r)$ est impossible, puisque $X_{1} + X_{2} \leqslant r < 2r$, alors que $\mathrm{P}(X_{1} = r)\mathrm{P}(X_{2} = r) = \frac{1}{n^{2r}} > 0$. Par la proposition 15, déjà $\boxed{X_{1} \text{ et } X_{2} \text{ ne sont pas indépendantes}}$, et la famille ne l'est pas non plus.

    **3.** On a $V = \sum_{k=1}^{n} \mathbf{1}_{(X_{k} = 0)}$, et $\mathrm{P}(X_{k} = 0) = \big(1 - \frac{1}{n}\big)^{r}$ par la question 1. Par la méthode des indicatrices, 
    $$\boxed{\mathrm{E}(V) = n\Big(1 - \frac{1}{n}\Big)^{r}}$$
     Pour $r = n$, $\frac{\mathrm{E}(V)}{n} = \big(1 - \frac{1}{n}\big)^{n} = \exp\big(n\ln(1 - \frac{1}{n})\big)$, et $n\ln(1 - \frac{1}{n}) = n\big(-\frac{1}{n} + o(\frac{1}{n})\big) \to -1$ (chapitre 10), d'où 
    $$\boxed{\frac{\mathrm{E}(V)}{n} \xrightarrow[n \to +\infty]{} \frac{1}{\mathrm{e}} \approx 0{,}368}$$
     Quand on répartit au hasard $n$ boules dans $n$ tiroirs, plus d'un tiroir sur trois reste vide en moyenne, alors qu'une répartition équitable n'en laisserait aucun. Pour $n = 100$, la proportion moyenne vaut déjà $0{,}366$. On retrouve la même limite $\frac{1}{\mathrm{e}}$ que pour la probabilité qu'une permutation aléatoire n'ait aucun point fixe (remarque de la section 21.6.3).

    **4.** Soit $j \in \llbracket 0\,,n \rrbracket$ et $J$ une partie de $\llbracket 1\,,n \rrbracket$ à $j$ éléments. Les répartitions pour lesquelles l'ensemble des tiroirs vides est exactement $J$ sont les applications de $\llbracket 1\,,r \rrbracket$ dans $\llbracket 1\,,n \rrbracket$ dont l'image est $\llbracket 1\,,n \rrbracket \setminus J$, c'est-à-dire les surjections de $\llbracket 1\,,r \rrbracket$ sur cet ensemble à $n - j$ éléments : il y en a $S(r, n - j)$, avec les notations de l'exercice 15. En regroupant selon $J$, qui se choisit de $\tbinom{n}{j}$ façons, 
    $$\boxed{\mathrm{P}(V = j) = \frac{1}{n^{r}}\binom{n}{j}S(r, n - j) = \frac{1}{n^{r}}\binom{n}{j}\sum_{i=0}^{n-j} (-1)^{n-j-i}\binom{n - j}{i}i^{r}, \qquad j \in \llbracket 0\,,n \rrbracket}$$
     par la formule de l'exercice 15 (proposition 6 du cours), avec $S(r, 0) = 0$ puisque $r \geqslant 1$ : on a toujours $V \leqslant n - 1$. Comme $S(r, p) = 0$ pour $p > r$, on a aussi $V \geqslant n - r$, ce qui est clair : $r$ boules occupent au plus $r$ tiroirs. Les lois de $X_{1}$ et de $V$, et l'espérance de $V$, ont été vérifiées par énumération pour $n \leqslant 4$ et $r \leqslant 4$ ✓.

    *À retenir.* La question 3 donne l'espérance de $V$ en une ligne, alors que sa loi, à la question 4, demande le nombre de surjections, qui n'a pas d'expression simple. C'est l'exemple type de la méthode des indicatrices : les événements $(X_{k} = 0)$ ne sont pas indépendants, et la linéarité n'en a pas besoin.
- id: "ma-21-81"
  feuille: "f-ma-21"
  numero: 81
  partie: "Variance et covariance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variance et covariance, indépendance, variables aléatoires, variance]
  noeuds: [p-esperance, p-independance, p-variables]
  notions: [variance, covariance, independance, variable-aleatoire]
  page_enonce: 20
  page_corrige: 74
  enonce: |
    Soit $X$ et $Y$ deux variables indépendantes de même loi $\mathcal{B}(p)$, avec $p \in \left]0\,,1\right[$. On pose $U = X + Y$ et $V = X - Y$. Déterminer la loi du couple $(U, V)$, la covariance de $U$ et $V$, et dire si $U$ et $V$ sont indépendantes.
  corrige: |
    On note $q = 1 - p$. Le couple $(X, Y)$ prend les quatre valeurs de $\{0, 1\}^{2}$, avec les probabilités $q^{2}$, $pq$, $qp$, $p^{2}$ par indépendance, et le couple $(U, V) = (X + Y, X - Y)$ prend les valeurs $(0, 0)$, $(1, 1)$, $(1, -1)$ et $(2, 0)$, deux à deux distinctes. On en déduit la loi conjointe, en lisant $u$ en ligne et $v$ en colonne : 
    $$\begin{array}{c|ccc|c} & v = -1 & v = 0 & v = 1 & \mathrm{P}(U = u) \\ \hline u = 0 & 0 & q^{2} & 0 & q^{2} \\ u = 1 & pq & 0 & pq & 2pq \\ u = 2 & 0 & p^{2} & 0 & p^{2} \\ \hline \mathrm{P}(V = v) & pq & p^{2} + q^{2} & pq & 1 \end{array}$$
     Par la bilinéarité et la symétrie de la covariance (proposition 23), 
    $$\operatorname{Cov}(U, V) = \operatorname{Cov}(X, X) - \operatorname{Cov}(X, Y) + \operatorname{Cov}(Y, X) - \operatorname{Cov}(Y, Y) = \mathrm{V}(X) - \mathrm{V}(Y),$$
     d'où $\boxed{\operatorname{Cov}(U, V) = 0}$, puisque $X$ et $Y$ ont la même loi. Pourtant $\mathrm{P}(U = 1, V = 0) = 0$, alors que le produit $\mathrm{P}(U = 1)\mathrm{P}(V = 0)$ vaut $2pq(p^{2} + q^{2}) > 0$ : 
    $$\boxed{U \text{ et } V \text{ sont décorrélées, mais pas indépendantes}}$$
     On le lit sur le tableau : la case centrale est vide, alors que sa ligne et sa colonne ne le sont pas. Savoir que $U = 1$ force $V = \pm 1$.

    *Piège.* C'est le phénomène de la remarque qui suit la proposition 20 : l'indépendance entraîne la décorrélation (proposition 23 (iii)), et la réciproque est fausse. L'erreur la plus répandue est de conclure à l'indépendance à partir d'une covariance nulle.
- id: "ma-21-82"
  feuille: "f-ma-21"
  numero: 82
  partie: "Variance et covariance"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [variance et covariance, variables aléatoires]
  noeuds: [p-esperance, p-variables]
  notions: [variance, covariance, variable-aleatoire]
  page_enonce: 20
  page_corrige: 75
  enonce: |
    Soit $X$ une variable aléatoire réelle et $a$, $b$ deux réels tels que $X$ et $aX + b$ aient la même loi.

    **1.** On suppose $a \notin \{-1, 1\}$. Montrer qu'il existe un réel $c$ tel que $\mathrm{P}(X = c) = 1$.

    **2.** Montrer que le cas $a = 1$ et $b \neq 0$ est impossible.

    **3.** Dans le cas $a = -1$, donner un exemple où $X$ n'est pas constante.
  corrige: |
    L'espérance et la variance ne dépendent que de la loi (section 21.6.1) : comme $X$ et $aX + b$ ont la même loi, $\mathrm{E}(X) = a\mathrm{E}(X) + b$ et $\mathrm{V}(X) = \mathrm{V}(aX + b) = a^{2}\mathrm{V}(X)$ (théorème 11 (ii)).

    **1.** Si $a \notin \{-1, 1\}$, alors $1 - a^{2} \neq 0$, et $(1 - a^{2})\mathrm{V}(X) = 0$ donne $\mathrm{V}(X) = 0$. Par le théorème 11 (iii), $\mathrm{P}\big(X = \mathrm{E}(X)\big) = 1$, et comme $a \neq 1$, la relation $\mathrm{E}(X) = a\mathrm{E}(X) + b$ donne $\mathrm{E}(X) = \frac{b}{1 - a}$ : 
    $$\boxed{\mathrm{P}(X = c) = 1, \qquad c = \frac{b}{1 - a}}$$
     Réciproquement, une variable égale à $c$ avec la probabilité $1$ convient, puisque $ac + b = c$.

    **2.** Si $a = 1$, la relation $\mathrm{E}(X) = \mathrm{E}(X) + b$ donne $b = 0$ : $\boxed{\text{le cas } a = 1,\ b \neq 0 \text{ est impossible}}$. On peut aussi raisonner sans espérance : la plus grande valeur prise avec une probabilité non nulle serait la même pour $X$ et pour $X + b$, ce qui impose $b = 0$.

    **3.** Si $a = -1$ et $b \neq 0$, soit $X$ de loi uniforme sur $\{0, b\}$ : la variable $b - X$ prend les valeurs $b$ et $0$, chacune avec la probabilité $\frac{1}{2}$, donc $b - X \sim X$, et $X$ n'est pas constante. Si $b = 0$, $X$ de loi uniforme sur $\{-1, 1\}$ convient. Plus généralement, toute variable dont la loi est symétrique par rapport à $\frac{b}{2}$ convient : 
    $$\boxed{X \sim \mathcal{U}(\{0, b\}) \ \text{ si } b \neq 0, \qquad X \sim \mathcal{U}(\{-1, 1\}) \ \text{ si } b = 0}$$
     Dans ce cas, la relation entre espérances impose seulement $\mathrm{E}(X) = \frac{b}{2}$, et la relation entre variances est toujours vraie.

    *Piège.* L'énoncé dit que $X$ et $aX + b$ ont la même *loi*, et non qu'elles sont égales : on ne peut pas écrire $X = aX + b$ et résoudre. C'est la mise en garde de la remarque qui suit la proposition 13.
- id: "ma-21-83"
  feuille: "f-ma-21"
  numero: 83
  partie: "Variance et covariance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variance et covariance, indépendance, variables aléatoires, espérance]
  noeuds: [p-esperance, p-independance, p-variables]
  notions: [variance, covariance, independance, variable-aleatoire, esperance]
  page_enonce: 20
  page_corrige: 75
  enonce: |
    Soit $n \geqslant 2$, et $X$, $Y$ deux variables indépendantes de loi $\mathcal{U}(\llbracket 1\,,n \rrbracket)$. On pose $N = \min(X, Y)$ et $M = \max(X, Y)$.

    **1.** Calculer $\mathrm{P}(M \leqslant k)$ pour $k \in \llbracket 0\,,n \rrbracket$, puis en déduire la loi de $M$ et son espérance.

    **2.** Calculer $\mathrm{E}(N)$ par linéarité de l'espérance.

    **3.** Montrer que $\mathrm{E}(N) = \displaystyle\sum_{k=1}^{n} \mathrm{P}(N \geqslant k)$, et retrouver ainsi la valeur de $\mathrm{E}(N)$.

    **4.** Calculer $\mathrm{V}(M)$.
  corrige: |
    **1.** Soit $k \in \llbracket 0\,,n \rrbracket$. On a $(M \leqslant k) = (X \leqslant k) \cap (Y \leqslant k)$, et, par indépendance, 
    $$\boxed{\mathrm{P}(M \leqslant k) = \mathrm{P}(X \leqslant k)\mathrm{P}(Y \leqslant k) = \frac{k^{2}}{n^{2}}}$$
     Pour $k \in \llbracket 1\,,n \rrbracket$, $(M = k) = (M \leqslant k) \setminus (M \leqslant k - 1)$, d'où 
    $$\boxed{\mathrm{P}(M = k) = \frac{k^{2} - (k - 1)^{2}}{n^{2}} = \frac{2k - 1}{n^{2}}}$$
     Avec les sommes usuelles du chapitre 3, 
    $$\mathrm{E}(M) = \frac{1}{n^{2}}\sum_{k=1}^{n} (2k^{2} - k) = \frac{1}{n^{2}}\Big(\frac{n(n + 1)(2n + 1)}{3} - \frac{n(n + 1)}{2}\Big), \qquad \boxed{\mathrm{E}(M) = \frac{(n + 1)(4n - 1)}{6n}}$$

    **2.** Pour toute issue, $\{M, N\} = \{X, Y\}$ en tant que valeurs, donc $M + N = X + Y$. Par linéarité, et avec $\mathrm{E}(X) = \mathrm{E}(Y) = \frac{n + 1}{2}$ (proposition 19), 
    $$\mathrm{E}(N) = (n + 1) - \frac{(n + 1)(4n - 1)}{6n}, \qquad \boxed{\mathrm{E}(N) = \frac{(n + 1)(2n + 1)}{6n}}$$

    **3.** Comme $N$ est à valeurs dans $\llbracket 1\,,n \rrbracket$, $N = \sum_{k=1}^{n} \mathbf{1}_{(N \geqslant k)}$ pour toute issue, comme à l'exercice 76, d'où $\boxed{\mathrm{E}(N) = \sum_{k=1}^{n} \mathrm{P}(N \geqslant k)}$. Or $(N \geqslant k) = (X \geqslant k) \cap (Y \geqslant k)$, de probabilité $\big(\frac{n - k + 1}{n}\big)^{2}$, et, en posant $j = n - k + 1$, 
    $$\mathrm{E}(N) = \frac{1}{n^{2}}\sum_{j=1}^{n} j^{2} = \frac{(n + 1)(2n + 1)}{6n},$$
     ce qui confirme la question 2 ✓.

    **4.** Par la formule de transfert et la somme des cubes, 
    $$\mathrm{E}(M^{2}) = \frac{1}{n^{2}}\sum_{k=1}^{n} (2k^{3} - k^{2}) = \frac{1}{n^{2}}\Big(\frac{n^{2}(n + 1)^{2}}{2} - \frac{n(n + 1)(2n + 1)}{6}\Big) = \frac{(n + 1)(3n^{2} + n - 1)}{6n}.$$
     La formule de König-Huygens (théorème 11 (i)) donne, après réduction au dénominateur $36n^{2}$, 
    $$\mathrm{V}(M) = \frac{(n + 1)(3n^{2} + n - 1)}{6n} - \frac{(n + 1)^{2}(4n - 1)^{2}}{36n^{2}}, \qquad \boxed{\mathrm{V}(M) = \frac{(n^{2} - 1)(2n^{2} + 1)}{36n^{2}}}$$
     Pour $n = 1$, on trouve $\mathrm{V}(M) = 0$, puisque $M = 1$. Les quatre résultats ont été vérifiés par énumération pour $n \leqslant 7$ ✓. Quand $n$ est grand, $\mathrm{E}(M) \sim \frac{2n}{3}$ et $\mathrm{E}(N) \sim \frac{n}{3}$ : les deux tirages partagent l'intervalle en trois parts égales en moyenne, ce que l'exercice 92 retrouvera.

    *Piège.* L'erreur la plus répandue est d'écrire que la probabilité $\mathrm{P}(M = k)$ vaut $\mathrm{P}(X = k)\mathrm{P}(Y = k)$, ou bien $\mathrm{P}(X = k) + \mathrm{P}(Y = k)$. L'événement $(M = k)$ ne s'écrit pas simplement en termes de $X$ et de $Y$ ; c'est l'événement $(M \leqslant k)$ qui est une intersection, d'où le passage par les probabilités $\mathrm{P}(M \leqslant k)$.
