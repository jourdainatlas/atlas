  enonce: |
    On considère un dé pipé à six faces, tel que la probabilité d'obtenir la face numérotée $k$ soit proportionnelle à $k$. On note $X$ le résultat d'un lancer.

    **1.** Déterminer la loi de $X$ et son espérance. Comparer avec un dé équilibré.

    **2.** On pose $Y = \frac{1}{X}$. Déterminer la loi de $Y$ et son espérance. Comparer $\mathrm{E}(Y)$ et $\frac{1}{\mathrm{E}(X)}$.
  corrige: |
    **1.** Il existe $c > 0$ tel que $\mathrm{P}(X = k) = ck$ pour $k \in \llbracket 1\,,6 \rrbracket$. La somme des probabilités vaut $1$, donc $21c = 1$ : 
    $$\boxed{\mathrm{P}(X = k) = \frac{k}{21}, \quad k \in \llbracket 1\,,6 \rrbracket}, \qquad \mathrm{E}(X) = \sum_{k=1}^{6} \frac{k^{2}}{21} = \frac{91}{21}, \qquad \boxed{\mathrm{E}(X) = \frac{13}{3} \approx 4{,}33}$$
     Pour un dé équilibré, l'espérance vaut $\frac{7}{2} = 3{,}5$ (proposition 19) : le dé pipé favorise les grandes faces, et sa moyenne est plus élevée.

    **2.** La variable $Y = \frac{1}{X}$ prend les valeurs $\frac{1}{k}$, deux à deux distinctes, et $(Y = \frac{1}{k}) = (X = k)$ (proposition 13) : 
    $$\boxed{\mathrm{P}\Big(Y = \frac{1}{k}\Big) = \frac{k}{21}, \quad k \in \llbracket 1\,,6 \rrbracket}, \qquad \mathrm{E}(Y) = \sum_{k=1}^{6} \frac{1}{k} \cdot \frac{k}{21} = \frac{6}{21}, \qquad \boxed{\mathrm{E}(Y) = \frac{2}{7}}$$
     On a $\frac{2}{7} \approx 0{,}286$ et $\frac{1}{\mathrm{E}(X)} = \frac{3}{13} \approx 0{,}231$ : $\boxed{\mathrm{E}\big(\tfrac{1}{X}\big) > \tfrac{1}{\mathrm{E}(X)}}$. C'est le phénomène de l'exercice 70, pour la fonction convexe $x \mapsto \frac{1}{x}$ sur $\left]0\,,+\infty\right[$ : l'identité $\frac{1}{x} - \frac{1}{m} + \frac{x - m}{m^{2}} = \frac{(x - m)^{2}}{xm^{2}}$, avec $m = \frac{13}{3}$, donne l'inégalité, stricte puisque $X$ n'est pas constante.
- id: "ma-21-72"
  feuille: "f-ma-21"
  numero: 72
  partie: "Espérance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espérance, variables aléatoires]
  noeuds: [p-esperance, p-variables]
  notions: [esperance, variable-aleatoire]
  page_enonce: 18
  page_corrige: 67
  enonce: |
    Soit $p \in \left]0\,,1\right[$, $n \in \mathbb{N}^{*}$ et $X$ une variable aléatoire de loi $\mathcal{B}(2n,p)$. On pose $Y = \lfloor \frac{X}{2} \rfloor$.

    **1.** Calculer $\mathrm{E}\big((-1)^{X}\big)$.

    **2.** Exprimer $Y$ à l'aide de $X$ et de $(-1)^{X}$, puis en déduire $\mathrm{E}(Y)$ par linéarité.
  corrige: |
    **1.** On note $q = 1 - p$. Par la formule de transfert, puis la formule du binôme, 
    $$\mathrm{E}\big((-1)^{X}\big) = \sum_{k=0}^{2n} (-1)^{k}\binom{2n}{k}p^{k}q^{2n-k} = (q - p)^{2n}, \qquad \boxed{\mathrm{E}\big((-1)^{X}\big) = (1 - 2p)^{2n}}$$
     Comme $(-1)^{X} = \mathbf{1}_{(X \text{ pair})} - \mathbf{1}_{(X \text{ impair})}$, on en déduit $\mathrm{P}(X \text{ pair}) = \frac{1 + (1 - 2p)^{2n}}{2}$, toujours au moins égal à $\frac{1}{2}$, puisque l'exposant $2n$ est pair.

    **2.** Si $X$ est pair, $Y = \frac{X}{2}$ ; si $X$ est impair, $Y = \frac{X - 1}{2}$. Dans les deux cas, $Y = \frac{1}{2}\big(X - \frac{1 - (-1)^{X}}{2}\big)$, puisque $\frac{1 - (-1)^{X}}{2}$ vaut $0$ si $X$ est pair et $1$ sinon : 
    $$\boxed{Y = \frac{X}{2} - \frac{1}{4} + \frac{(-1)^{X}}{4}}$$
     Par linéarité de l'espérance (théorème 9 (i)), avec $\mathrm{E}(X) = 2np$ (proposition 19) et la question 1, 
    $$\boxed{\mathrm{E}(Y) = np - \frac{1 - (1 - 2p)^{2n}}{4}}$$
     Pour $p = \frac{1}{2}$, on trouve $\mathrm{E}(Y) = \frac{n}{2} - \frac{1}{4}$. Ces formules ont été vérifiées sur la loi exacte pour $n \leqslant 4$ et trois valeurs de $p$ ✓.

    *Piège.* L'erreur la plus répandue est d'écrire $\mathrm{E}\big(\lfloor\frac{X}{2}\rfloor\big) = \lfloor\frac{\mathrm{E}(X)}{2}\rfloor = \lfloor np \rfloor$ : la partie entière n'est pas linéaire. L'astuce consiste à exprimer la partie entière comme une fonction affine de $X$ et de $(-1)^{X}$, dont on sait calculer les espérances.
