  enonce: |
    Soit $n \geqslant 2$. Une urne contient trois boules rouges, deux boules noires et $n$ boules blanches. On tire simultanément deux boules, tous les tirages étant également probables.

    **1.** Calculer la probabilité $P_{n}$ que les deux boules soient de la même couleur, puis la probabilité $Q_{n}$ qu'elles soient de couleurs différentes.

    **2.** Déterminer $n$ pour que la probabilité de tirer deux boules blanches vaille $\frac{1}{6}$, et calculer alors $P_{n}$.
  corrige: |
    L'univers est l'ensemble des parties à deux éléments de l'ensemble des $n + 5$ boules, supposées discernables, muni de la probabilité uniforme ; il a $\binom{n + 5}{2} = \frac{(n + 5)(n + 4)}{2}$ éléments.

    **1.** Deux boules de la même couleur forment une paire de rouges, de noires ou de blanches, ces trois événements étant incompatibles : il y a $\binom{3}{2} + \binom{2}{2} + \binom{n}{2} = 4 + \frac{n(n - 1)}{2}$ cas favorables, et 
    $$\boxed{P_{n} = \frac{n^{2} - n + 8}{(n + 4)(n + 5)}, \qquad Q_{n} = 1 - P_{n} = \frac{2(5n + 6)}{(n + 4)(n + 5)}}$$
     On contrôle $Q_{n}$ directement : une paire bicolore est formée d'une rouge et d'une noire, d'une rouge et d'une blanche, ou d'une noire et d'une blanche, d'où $6 + 3n + 2n = 5n + 6$ cas favorables, à diviser par $\frac{(n + 4)(n + 5)}{2}$ ✓.

    **2.** La probabilité de tirer deux blanches vaut $\frac{n(n - 1)}{(n + 4)(n + 5)}$. Elle vaut $\frac{1}{6}$ si et seulement si $6n^{2} - 6n = n^{2} + 9n + 20$, soit $5n^{2} - 15n - 20 = 0$, c'est-à-dire $(n - 4)(n + 1) = 0$. Seule la racine $n = 4$ est un entier naturel : 
    $$\boxed{n = 4, \qquad P_{4} = \frac{16 - 4 + 8}{8 \times 9} = \frac{5}{18}}$$
     Avec $9$ boules, il y a $36$ paires, dont $3 + 1 + 6 = 10$ unicolores ✓. Lorsque $n$ tend vers $+\infty$, $P_{n}$ tend vers $1$ : presque toutes les boules sont blanches.
