  enonce: |
    Soit $A$ et $B$ deux événements. Montrer que $\big|\mathrm{P}(A \cap B) - \mathrm{P}(A)\,\mathrm{P}(B)\big| \leqslant \frac{1}{4}$, et caractériser les cas d'égalité. On pourra appliquer l'inégalité de Cauchy-Schwarz du cours aux indicatrices de $A$ et de $B$.
  corrige: |
    On note $a = \mathrm{P}(A)$, $b = \mathrm{P}(B)$ et $c = \mathrm{P}(A \cap B)$. Comme $\mathbf{1}_{A}\mathbf{1}_{B} = \mathbf{1}_{A \cap B}$, la proposition 23 (i) et le théorème 9 (iv) donnent 
    $$\operatorname{Cov}(\mathbf{1}_{A}, \mathbf{1}_{B}) = \mathrm{E}(\mathbf{1}_{A \cap B}) - \mathrm{E}(\mathbf{1}_{A})\mathrm{E}(\mathbf{1}_{B}) = c - ab.$$
     Les indicatrices suivent les lois $\mathcal{B}(a)$ et $\mathcal{B}(b)$, de variances $a(1 - a)$ et $b(1 - b)$ (proposition 21). Par l'inégalité de Cauchy-Schwarz (théorème 12), puis la majoration $x(1 - x) = \frac{1}{4} - \big(x - \frac{1}{2}\big)^{2} \leqslant \frac{1}{4}$, 
    $$|c - ab| \leqslant \sqrt{a(1 - a)}\,\sqrt{b(1 - b)} \leqslant \frac{1}{2} \times \frac{1}{2}, \qquad \boxed{\big|\mathrm{P}(A \cap B) - \mathrm{P}(A)\mathrm{P}(B)\big| \leqslant \frac{1}{4}}$$

    *Cas d'égalité.* S'il y a égalité, les deux inégalités sont des égalités, donc $a(1 - a) = b(1 - b) = \frac{1}{4}$, c'est-à-dire $a = b = \frac{1}{2}$, et $\big|c - \frac{1}{4}\big| = \frac{1}{4}$, soit $c = \frac{1}{2}$ ou $c = 0$.

    • Si $c = \frac{1}{2}$, alors $\mathrm{P}(A \setminus B) = a - c = 0$ et $\mathrm{P}(B \setminus A) = b - c = 0$ (proposition 7 (ii)) : les événements $A$ et $B$ ne diffèrent que par un événement de probabilité nulle, et $\operatorname{Cov}(\mathbf{1}_{A}, \mathbf{1}_{B}) = \frac{1}{4}$.

    • Si $c = 0$, alors $\mathrm{P}(A \cup B) = a + b - c = 1$ : l'événement $\overline{B}$ ne diffère de $A$ que par un événement de probabilité nulle, puisque $\mathrm{P}(A \cap B) = 0$ et $\mathrm{P}(\overline{A} \cap \overline{B}) = 1 - \mathrm{P}(A \cup B) = 0$, et $\operatorname{Cov}(\mathbf{1}_{A}, \mathbf{1}_{B}) = -\frac{1}{4}$.

    Réciproquement, ces deux situations donnent l'égalité. Ainsi 
    $$\boxed{\text{égalité} \iff \mathrm{P}(A) = \mathrm{P}(B) = \tfrac{1}{2} \text{ et } \big(\mathrm{P}(A \cap \overline{B}) = \mathrm{P}(\overline{A} \cap B) = 0 \ \text{ ou } \ \mathrm{P}(A \cap B) = \mathrm{P}(\overline{A} \cap \overline{B}) = 0\big)}$$
     Pour un lancer de pièce équilibrée, $A = B =$ « pile » donne $\frac{1}{2} - \frac{1}{4} = \frac{1}{4}$, et $A =$ « pile », $B =$ « face » donne $0 - \frac{1}{4} = -\frac{1}{4}$.

    *À retenir.* La quantité $\mathrm{P}(A \cap B) - \mathrm{P}(A)\mathrm{P}(B)$ mesure l'écart à l'indépendance ; elle est bornée par $\frac{1}{4}$, et cette borne n'est atteinte que dans le cas le plus dépendant qui soit, celui où chaque événement détermine l'autre. La borne $\frac{1}{4}$ vient de la proposition 22, qui majore par $\frac{1}{4}$ la variance d'une variable à valeurs dans $[0\,,1]$, ici celle de chaque indicatrice.
