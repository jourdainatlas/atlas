  page_enonce: 10
  page_corrige: 36
  enonce: |
    **1.** Montrer que deux événements $A$ et $B$ sont indépendants si et seulement si 
    $$\mathrm{P}(A \cap B)\,\mathrm{P}(\overline{A} \cap \overline{B}) = \mathrm{P}(A \cap \overline{B})\,\mathrm{P}(\overline{A} \cap B).$$

    **2.** Soit $A \subset B$ deux événements indépendants. Montrer que $\mathrm{P}(A) = 0$ ou $\mathrm{P}(B) = 1$. Quels sont les événements indépendants d'eux-mêmes ?

    **3.** Montrer qu'il n'existe pas d'événements $A_{1}$, …, $A_{n}$ mutuellement indépendants, de même probabilité $p < 1$, dont la réunion soit $\Omega$.
  corrige: |
    **1.** On note $x = \mathrm{P}(A \cap B)$, $y = \mathrm{P}(A \cap \overline{B})$, $z = \mathrm{P}(\overline{A} \cap B)$, $w = \mathrm{P}(\overline{A} \cap \overline{B})$ les probabilités des quatre atomes de l'exercice 23, avec $x + y + z + w = 1$. Alors $\mathrm{P}(A) = x + y$ et $\mathrm{P}(B) = x + z$, d'où 
    $$\mathrm{P}(A)\,\mathrm{P}(B) - \mathrm{P}(A \cap B) = x^{2} + xz + xy + yz - x = x(x + y + z - 1) + yz = yz - xw.$$

    $$\boxed{A \text{ et } B \text{ indépendants} \iff \mathrm{P}(A \cap B)\,\mathrm{P}(\overline{A} \cap \overline{B}) = \mathrm{P}(A \cap \overline{B})\,\mathrm{P}(\overline{A} \cap B)}$$
     La condition est symétrique en $A$ et $B$, et inchangée si l'on remplace $A$ par $\overline{A}$ : on retrouve la proposition 10 (ii). Dans le tableau des quatre atomes, elle dit que le « déterminant » $xw - yz$ est nul ; l'exercice 62 généralisera cette remarque.

    **2.** Si $A \subset B$, alors $A \cap B = A$, et l'indépendance s'écrit $\mathrm{P}(A) = \mathrm{P}(A)\,\mathrm{P}(B)$, c'est-à-dire 
    $$\mathrm{P}(A)\big(1 - \mathrm{P}(B)\big) = 0.$$

    $$\boxed{A \subset B \text{ et } A, B \text{ indépendants} \implies \mathrm{P}(A) = 0 \text{ ou } \mathrm{P}(B) = 1}$$
     Avec $B = A$, l'événement $A$ est indépendant de lui-même si et seulement si $\mathrm{P}(A) = \mathrm{P}(A)^{2}$ : 
    $$\boxed{A \text{ est indépendant de lui-même} \iff \mathrm{P}(A) \in \{0, 1\}}$$
     Si toutes les issues ont une probabilité strictement positive, ce sont exactement $\varnothing$ et $\Omega$ ; sinon, un événement non vide peut être de probabilité nulle. Un événement indépendant de lui-même est « certain ou impossible » : savoir qu'il est réalisé n'apprend rien, parce qu'on le savait déjà.

    **3.** Supposons $A_{1}$, …, $A_{n}$ mutuellement indépendants, de probabilité $p < 1$, et de réunion $\Omega$. Par la proposition 10 (iii), les contraires $\overline{A_{1}}$, …, $\overline{A_{n}}$ sont mutuellement indépendants, et 
    $$\mathrm{P}\big(\overline{A_{1}} \cap \cdots \cap \overline{A_{n}}\big) = (1 - p)^{n} > 0.$$
     Or cet événement est le contraire de $A_{1} \cup \cdots \cup A_{n} = \Omega$, c'est-à-dire $\varnothing$, de probabilité nulle : contradiction. 
    $$\boxed{\text{il n'existe pas de tels événements}}$$
     Des événements indépendants ne peuvent pas « se partager » l'univers : quel que soit leur nombre, il reste une probabilité $(1 - p)^{n}$ qu'aucun ne soit réalisé. Au contraire, des événements incompatibles de probabilité $\frac{1}{n}$ peuvent recouvrir $\Omega$, ce qui illustre une fois de plus la différence entre indépendance et incompatibilité.
- id: "ma-21-39"
  feuille: "f-ma-21"
