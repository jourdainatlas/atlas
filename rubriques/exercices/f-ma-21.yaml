  page_enonce: 15
  page_corrige: 53
  enonce: |
    **1.** On lance deux dés équilibrés. Quelle est la probabilité d'obtenir deux résultats égaux ?

    **2.** On lance deux dés pipés de la même façon : chacun donne la face $i$ avec la probabilité $p_{i}$, pour $i \in \llbracket 1\,,6 \rrbracket$, et les deux lancers sont indépendants. Montrer que la probabilité d'obtenir deux résultats égaux est au moins égale à celle de la question précédente, et étudier le cas d'égalité.
  corrige: |
    **1.** On prend $\Omega = \llbracket 1\,,6 \rrbracket^{2}$, muni de la probabilité uniforme. L'événement « résultats égaux » contient les six couples $(i, i)$ : 
    $$\boxed{\mathrm{P}(D_{1} = D_{2}) = \frac{6}{36} = \frac{1}{6}}$$

    **2.** Les résultats $D_{1}$ et $D_{2}$ sont indépendants et de même loi $(p_{i})$. L'événement $(D_{1} = D_{2})$ est la réunion disjointe des événements $(D_{1} = i, D_{2} = i)$, d'où 
    $$\mathrm{P}(D_{1} = D_{2}) = \sum_{i=1}^{6} \mathrm{P}(D_{1} = i)\mathrm{P}(D_{2} = i) = \sum_{i=1}^{6} p_{i}^{2}.$$
     En développant les carrés et en utilisant $\sum_{i} p_{i} = 1$, 
    $$\sum_{i=1}^{6} \Big(p_{i} - \frac{1}{6}\Big)^{2} = \sum_{i=1}^{6} p_{i}^{2} - \frac{2}{6}\sum_{i=1}^{6} p_{i} + \frac{6}{36} = \sum_{i=1}^{6} p_{i}^{2} - \frac{1}{6}, \qquad\text{d'où}\qquad \boxed{\mathrm{P}(D_{1} = D_{2}) = \frac{1}{6} + \sum_{i=1}^{6} \Big(p_{i} - \frac{1}{6}\Big)^{2} \geqslant \frac{1}{6}}$$
     Il y a égalité si et seulement si tous les $p_{i}$ valent $\frac{1}{6}$, c'est-à-dire si les dés sont équilibrés. On peut aussi appliquer l'inégalité de Cauchy-Schwarz dans $\mathbb{R}^{6}$ muni du produit scalaire canonique (chapitre 19, théorème 1) aux vecteurs $(p_{1}, \dots, p_{6})$ et $(1, \dots, 1)$ : elle donne $1 = \big(\sum p_{i}\big)^{2} \leqslant 6\sum p_{i}^{2}$, avec égalité si et seulement si les deux vecteurs sont colinéaires, ce qui conduit au même cas d'égalité.

    *À retenir.* Piper deux dés de la même façon augmente toujours la probabilité d'un double. L'identité obtenue dit plus : l'excès de probabilité est exactement la somme des carrés des écarts à la loi uniforme, et il est d'autant plus grand que les dés sont fortement pipés. Si les dés sont pipés différemment, le résultat tombe : un dé qui ne donne que des $1$ et un dé qui ne donne que des $2$ ne font jamais de double.
- id: "ma-21-57"
  feuille: "f-ma-21"
  numero: 57
  partie: "Variables aléatoires et lois"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [variables aléatoires, indépendance]
  noeuds: [p-variables, p-independance]
  notions: [variable-aleatoire, independance]
  page_enonce: 15
  page_corrige: 54
  enonce: |
    Soit $X : \Omega \to \mathbb{R}$ une variable aléatoire telle que $X$ et $-X$ aient la même loi.

    **1.** Montrer qu'il existe un espace probabilisé fini $(\Omega', \mathrm{P}')$ et deux variables aléatoires $Y : \Omega' \to \mathbb{R}_{+}$ et $\varepsilon : \Omega' \to \{-1, 1\}$, indépendantes, telles que $X$ et $\varepsilon Y$ aient la même loi.

    **2.** Peut-on toujours choisir $(\Omega', \mathrm{P}') = (\Omega, \mathrm{P})$ ? On pourra examiner le cas où $\Omega$ a trois issues équiprobables.
  corrige: |
    L'hypothèse $X \sim -X$ donne, pour tout réel $x$, $\mathrm{P}(X = -x) = \mathrm{P}(-X = x) = \mathrm{P}(X = x)$.

    **1.** La variable $|X|$ prend ses valeurs dans une partie finie $F$ de $\mathbb{R}_{+}$. On munit $\Omega' = F \times \{-1, 1\}$ de la probabilité définie par la distribution $p_{(y, e)} = \frac{1}{2}\,\mathrm{P}(|X| = y)$ (proposition 17, avec la loi de $|X|$ sur $F$ et la loi uniforme sur $\{-1, 1\}$), et l'on note $Y$ et $\varepsilon$ les deux projections. Par la proposition 17, $Y$ et $\varepsilon$ sont indépendantes, $Y \sim |X|$ et $\varepsilon$ suit la loi uniforme sur $\{-1, 1\}$. Comparons les lois de $\varepsilon Y$ et de $X$.

    • Pour $x \neq 0$, on a $(\varepsilon Y = x) = (Y = |x|) \cap (\varepsilon = \operatorname{signe}(x))$, puisque $Y \geqslant 0$. Par indépendance, et grâce à la symétrie de la loi de $X$, 
    $$\mathrm{P}'(\varepsilon Y = x) = \frac{1}{2}\mathrm{P}(|X| = |x|) = \frac{1}{2}\big(\mathrm{P}(X = x) + \mathrm{P}(X = -x)\big) = \mathrm{P}(X = x).$$

    • Pour $x = 0$, on a $\mathrm{P}'(\varepsilon Y = 0) = \mathrm{P}'(Y = 0) = \mathrm{P}(|X| = 0) = \mathrm{P}(X = 0)$.

    Les deux variables ont les mêmes probabilités $\mathrm{P}(\,\cdot = x)$ pour tout réel $x$, donc la même loi (proposition 12) : 
    $$\boxed{(\Omega', \mathrm{P}') = \big(F \times \{-1, 1\},\ \mathrm{P}' \big), \qquad Y = |X| \text{ en loi}, \quad \varepsilon \text{ uniforme sur } \{-1, 1\}, \quad Y \perp\!\!\!\perp \varepsilon, \qquad \varepsilon Y \sim X}$$
     Une variable de loi symétrique s'obtient donc en tirant sa valeur absolue, puis un signe au hasard, indépendamment.

    **2.** La réponse est non. Soit $\Omega = \{\omega_{1}, \omega_{2}, \omega_{3}\}$, muni de la probabilité uniforme, et $X$ définie par $X(\omega_{1}) = 0$, $X(\omega_{2}) = 1$, $X(\omega_{3}) = -1$ : $X$ suit la loi uniforme sur $\{-1, 0, 1\}$, et $X \sim -X$. Supposons qu'il existe $Y : \Omega \to \mathbb{R}_{+}$ et $\varepsilon : \Omega \to \{-1, 1\}$ indépendantes telles que $\varepsilon Y \sim X$. Comme $Y \geqslant 0$, on a $(\varepsilon Y = 1) = (\varepsilon = 1, Y = 1)$ et $(\varepsilon Y = -1) = (\varepsilon = -1, Y = 1)$, d'où, par indépendance, 
    $$\mathrm{P}(\varepsilon = 1)\,\mathrm{P}(Y = 1) = \frac{1}{3} = \mathrm{P}(\varepsilon = -1)\,\mathrm{P}(Y = 1).$$
     Ainsi $\mathrm{P}(Y = 1) \neq 0$, et $\mathrm{P}(\varepsilon = 1) = \mathrm{P}(\varepsilon = -1) = \frac{1}{2}$. Or toute probabilité d'un événement de $\Omega$ est un multiple de $\frac{1}{3}$ : c'est impossible. 
    $$\boxed{\text{on ne peut pas toujours choisir } (\Omega', \mathrm{P}') = (\Omega, \mathrm{P})}$$
     Une recherche exhaustive sur les $2^{3} \times 3^{3}$ couples $(\varepsilon, Y)$, avec $Y$ à valeurs dans $\{0, 1, 2\}$, confirme qu'aucun ne convient ✓.

    *Piège.* L'erreur la plus répandue est de prendre $Y = |X|$ et $\varepsilon = \operatorname{signe}(X)$ sur $\Omega$ lui-même : on a bien $X = \varepsilon|X|$ là où $X \neq 0$, mais $\varepsilon$ et $|X|$ ne sont pas indépendantes en général. Dans l'exemple de la question 2, en posant par exemple $\varepsilon(\omega_{1}) = 1$, on obtient $\mathrm{P}(\varepsilon = 1, |X| = 0) = \frac{1}{3}$ alors que $\mathrm{P}(\varepsilon = 1)\mathrm{P}(|X| = 0) = \frac{2}{3} \cdot \frac{1}{3}$ ; plus profondément, l'univers est trop pauvre pour porter un signe de probabilité $\frac{1}{2}$. C'est pour cette raison que la question 1 agrandit l'univers, comme le permet la proposition 17.
- id: "ma-21-58"
  feuille: "f-ma-21"
