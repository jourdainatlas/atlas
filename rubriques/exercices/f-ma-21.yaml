  enonce: |
    Soit $n \in \mathbb{N}^{*}$. On joue $2n + 1$ fois à pile ou face avec une pièce équilibrée.

    **1.** Calculer la probabilité d'obtenir au total strictement plus de piles que de faces.

    **2.** Soit $k \in \llbracket 1\,,2n + 1 \rrbracket$. Calculer la probabilité que le $(n + 1)$-ième pile apparaisse au $k$-ième lancer.

    **3.** En déduire que $\displaystyle\sum_{k=n+1}^{2n+1} \frac{1}{2^{k}}\binom{k - 1}{n} = \frac{1}{2}$.
  corrige: |
    L'univers est $\Omega = \{\mathrm{P}, \mathrm{F}\}^{2n+1}$, ensemble des suites de résultats, muni de la probabilité uniforme puisque la pièce est équilibrée : $|\Omega| = 2^{2n+1}$.

    **1.** L'application $s$ qui échange pile et face dans chaque lancer est une bijection de $\Omega$ sur lui-même, égale à sa réciproque. Elle échange l'événement $G$ « strictement plus de piles que de faces » et l'événement $G'$ « strictement plus de faces que de piles », qui ont donc le même cardinal (proposition 1 (i)). Comme $2n + 1$ est impair, il ne peut y avoir autant de piles que de faces : $G$ et $G'$ forment un système complet, et $\mathrm{P}(G) + \mathrm{P}(G') = 1$. 
    $$\boxed{\mathrm{P}(G) = \frac{1}{2}}$$

    **2.** Le $(n + 1)$-ième pile apparaît au $k$-ième lancer si et seulement si le $k$-ième lancer donne pile et si les $k - 1$ premiers en donnent exactement $n$. On choisit les rangs de ces $n$ piles parmi les $k - 1$ premiers, de $\binom{k - 1}{n}$ façons (théorème 2), puis les $2n + 1 - k$ derniers résultats librement : 
    $$\boxed{\mathrm{P}(\text{le } (n+1)\text{-ième pile apparaît au } k\text{-ième lancer}) = \frac{\dbinom{k - 1}{n}\,2^{2n+1-k}}{2^{2n+1}} = \frac{1}{2^{k}}\dbinom{k - 1}{n}}$$
     Cette probabilité est nulle pour $k \leqslant n$, ce qui est attendu : il faut au moins $n + 1$ lancers pour obtenir $n + 1$ piles.

    **3.** L'événement $G$ signifie « au moins $n + 1$ piles », c'est-à-dire « le $(n + 1)$-ième pile apparaît au cours des $2n + 1$ lancers ». C'est la réunion des événements de la question 2 pour $k \in \llbracket n+1\,,2n+1 \rrbracket$, qui sont deux à deux incompatibles puisque le rang du $(n + 1)$-ième pile est unique. La proposition 7 (i) et la question 1 donnent 
    $$\boxed{\sum_{k=n+1}^{2n+1} \frac{1}{2^{k}}\dbinom{k - 1}{n} = \mathrm{P}(G) = \frac{1}{2}}$$
     Pour $n = 1$, on trouve $\frac{1}{4} + \frac{2}{8} = \frac{1}{2}$ ✓ ; l'identité a été vérifiée par énumération jusqu'à $n = 5$.

    *À retenir.* C'est un exemple de démonstration probabiliste d'une identité : on calcule de deux façons la probabilité d'un même événement. Une démonstration purement calculatoire de cette identité n'est pas immédiate ; ici, la symétrie de la question 1 fait tout le travail.
- id: "ma-21-31"
  feuille: "f-ma-21"
  numero: 31
  partie: "Espaces probabilisés finis"
  etoiles: 2
  types: [Calcul]
  mots_cles: [espaces probabilisés finis, probabilités, tirages]
  noeuds: [p-espace]
  notions: [espace-probabilise, probabilite]
  page_enonce: 8
  page_corrige: 29
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. On organise un tirage au sort entre $n$ équipes de première division et $n$ équipes de deuxième division : les $2n$ équipes sont réparties en $n$ matchs de deux équipes, toutes les répartitions étant également probables.

    **1.** Dénombrer les répartitions des $2n$ équipes en $n$ matchs.

    **2.** Calculer la probabilité $p_{n}$ que tous les matchs opposent une équipe de première division à une équipe de deuxième division.

    **3.** Calculer la probabilité $q_{n}$ que tous les matchs opposent deux équipes de la même division.

    **4.** Montrer que $\dfrac{2^{2n-1}}{n} \leqslant \dbinom{2n}{n} \leqslant 2^{2n}$ pour tout $n \geqslant 1$, puis déterminer les limites de $(p_{n})$ et de $(q_{n})$.
  corrige: |
    **1.** Notons $E$ l'ensemble des $2n$ équipes et $\mathcal{R}$ l'ensemble des répartitions, c'est-à-dire des partitions de $E$ en $n$ paires. À toute bijection $\sigma : \llbracket 1\,,2n \rrbracket \to E$, on associe la répartition formée des paires $\{\sigma(2i - 1), \sigma(2i)\}$ pour $i \in \llbracket 1\,,n \rrbracket$. Toute répartition est obtenue, et les bijections qui donnent une répartition fixée s'obtiennent en choisissant l'ordre des $n$ matchs, de $n!$ façons, puis l'ordre des deux équipes dans chaque match, de $2^{n}$ façons. Par le lemme des bergers, 
    $$\boxed{|\mathcal{R}| = \frac{(2n)!}{2^{n}\,n!} = 1 \times 3 \times 5 \times \cdots \times (2n - 1)}$$
     On trouve $1$, $3$, $15$, $105$ répartitions pour $n = 1$, $2$, $3$, $4$, valeurs confirmées par énumération ✓. L'univers est $\mathcal{R}$, muni de la probabilité uniforme, comme le fixe l'énoncé.

    **2.** Dans une répartition favorable, chaque équipe de première division rencontre une équipe de deuxième division, et deux équipes de première division n'ont pas le même adversaire : une répartition favorable est déterminée par une bijection de l'ensemble des équipes de première division sur celui des équipes de deuxième division, et réciproquement. Il y en a $n!$ (théorème 1), d'où 
    $$\boxed{p_{n} = \frac{n!\,2^{n}\,n!}{(2n)!} = \frac{2^{n}}{\dbinom{2n}{n}}}$$
     On trouve $p_{1} = 1$, $p_{2} = \frac{2}{3}$, $p_{3} = \frac{2}{5}$, $p_{4} = \frac{8}{35}$ ✓.

    **3.** Si tous les matchs opposent deux équipes de la même division, les $n$ équipes de première division sont réparties en paires, ce qui impose $n$ pair. Pour $n = 2m$, une répartition favorable est formée d'une répartition des $2m$ équipes de première division et d'une répartition de celles de deuxième division, d'où $\Big(\frac{(2m)!}{2^{m}m!}\Big)^{2}$ cas favorables, et, en simplifiant, 
    $$\boxed{q_{n} = 0 \ \text{ si } n \text{ est impair}, \qquad q_{2m} = \Big(\frac{(2m)!}{2^{m}m!}\Big)^{2}\frac{2^{2m}(2m)!}{(4m)!} = \frac{(2m)!^{3}}{m!^{2}\,(4m)!} = \frac{\dbinom{2m}{m}}{\dbinom{4m}{2m}}}$$
     On trouve $q_{2} = \frac{2}{6} = \frac{1}{3}$ et $q_{4} = \frac{6}{70} = \frac{3}{35}$, valeurs confirmées par énumération ✓.

    **4.** Pour $0 \leqslant k \leqslant 2n - 1$, on a $\binom{2n}{k+1} \big/ \binom{2n}{k} = \frac{2n - k}{k + 1}$, qui est supérieur ou égal à $1$ si et seulement si $k \leqslant n - \frac{1}{2}$, c'est-à-dire $k \leqslant n - 1$ : les coefficients croissent jusqu'à $\binom{2n}{n}$, puis décroissent, et $\binom{2n}{n}$ est le plus grand. La somme des $2n + 1$ coefficients vaut $2^{2n}$ (théorème 3), donc $\binom{2n}{n} \leqslant 2^{2n}$. Pour la minoration, on regroupe les deux coefficients extrêmes, $\binom{2n}{0} + \binom{2n}{2n} = 2 \leqslant \binom{2n}{n}$ pour $n \geqslant 1$, et l'on majore chacun des $2n - 1$ autres par $\binom{2n}{n}$ : 
    $$2^{2n} = 2 + \sum_{k=1}^{2n-1} \dbinom{2n}{k} \leqslant \dbinom{2n}{n} + (2n - 1)\dbinom{2n}{n} = 2n\dbinom{2n}{n}, \qquad \boxed{\frac{2^{2n-1}}{n} \leqslant \dbinom{2n}{n} \leqslant 2^{2n}}$$
     On en déduit $p_{n} = \frac{2^{n}}{\binom{2n}{n}} \leqslant \frac{2^{n} \times n}{2^{2n-1}} = \frac{2n}{2^{n}}$. De même, pour $n = 2m$, la minoration au rang $2m$ et la majoration au rang $m$ donnent $q_{2m} \leqslant \frac{2^{2m} \times 2m}{2^{4m-1}} = \frac{2n}{2^{n}}$. Comme $\frac{2n}{2^{n}}$ tend vers $0$ (croissances comparées), 
    $$\boxed{0 \leqslant p_{n} \leqslant \frac{2n}{2^{n}}, \quad 0 \leqslant q_{n} \leqslant \frac{2n}{2^{n}}, \qquad \lim_{n \to +\infty} p_{n} = \lim_{n \to +\infty} q_{n} = 0}$$
     L'équivalent $\binom{2n}{n} \sim \frac{4^{n}}{\sqrt{\pi n}}$, tiré de la formule de Stirling (chapitre 10, théorème 6, et chapitre 18, théorème 10), précise la vitesse : $p_{n} \sim \frac{\sqrt{\pi n}}{2^{n}}$. Pour $n = 10$, on a déjà $p_{10} \approx 0{,}0055$ et $q_{10} \approx 0{,}0014$ : un tirage intégral « première contre deuxième division », ou sans aucun match entre divisions, est un événement très rare.
- id: "ma-21-32"
  feuille: "f-ma-21"
  numero: 32
  partie: "Espaces probabilisés finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [espaces probabilisés finis]
  noeuds: [p-espace]
  notions: [espace-probabilise, probabilite]
  page_enonce: 9
  page_corrige: 31
  enonce: |
    Soit $A_{1}$, …, $A_{n}$ des événements, avec $n \geqslant 2$.

    **1.** Montrer par récurrence que $\mathrm{P}(A_{1} \cap \cdots \cap A_{n}) \geqslant \mathrm{P}(A_{1}) + \cdots + \mathrm{P}(A_{n}) - (n - 1)$.

    **2.** *Inégalité de Bonferroni.*

    **(a)** Soit $\omega \in \Omega$. Montrer que 
    $$\sum_{i=1}^{n} \mathbf{1}_{A_{i}}(\omega) - \sum_{1 \leqslant i < j \leqslant n} \mathbf{1}_{A_{i} \cap A_{j}}(\omega) \leqslant \mathbf{1}_{A_{1} \cup \cdots \cup A_{n}}(\omega).$$
     On pourra exprimer le premier membre à l'aide du nombre $m$ d'indices $i$ tels que $\omega \in A_{i}$.

    **(b)** En déduire que $\mathrm{P}(A_{1} \cup \cdots \cup A_{n}) \geqslant \displaystyle\sum_{i=1}^{n} \mathrm{P}(A_{i}) - \sum_{1 \leqslant i < j \leqslant n} \mathrm{P}(A_{i} \cap A_{j})$.

    **3.** *Inégalité de Kounias.* En imitant la méthode précédente, montrer que, pour tout $j \in \llbracket 1\,,n \rrbracket$, 
    $$\mathrm{P}(A_{1} \cup \cdots \cup A_{n}) \leqslant \sum_{i=1}^{n} \mathrm{P}(A_{i}) - \sum_{\substack{i = 1 \\ i \neq j}}^{n} \mathrm{P}(A_{i} \cap A_{j}).$$
  corrige: |
    **1.** Pour $n = 2$, la proposition 7 (iv) et $\mathrm{P}(A_{1} \cup A_{2}) \leqslant 1$ donnent 
    $$\mathrm{P}(A_{1} \cap A_{2}) = \mathrm{P}(A_{1}) + \mathrm{P}(A_{2}) - \mathrm{P}(A_{1} \cup A_{2}) \geqslant \mathrm{P}(A_{1}) + \mathrm{P}(A_{2}) - 1.$$
     Supposons l'inégalité vraie pour $n$ événements quelconques, et soit $A_{1}$, …, $A_{n+1}$. On applique le cas $n = 2$ aux deux événements $B = A_{1} \cap \cdots \cap A_{n}$ et $A_{n+1}$, puis l'hypothèse de récurrence à $B$ : 
    $$\mathrm{P}(B \cap A_{n+1}) \geqslant \mathrm{P}(B) + \mathrm{P}(A_{n+1}) - 1 \geqslant \sum_{i=1}^{n} \mathrm{P}(A_{i}) - (n - 1) + \mathrm{P}(A_{n+1}) - 1.$$

    $$\boxed{\mathrm{P}(A_{1} \cap \cdots \cap A_{n}) \geqslant \mathrm{P}(A_{1}) + \cdots + \mathrm{P}(A_{n}) - (n - 1)}$$
     C'est la sous-additivité appliquée aux contraires : $\mathrm{P}\big(\overline{A_{1}} \cup \cdots \cup \overline{A_{n}}\big) \leqslant \sum \big(1 - \mathrm{P}(A_{i})\big)$. Elle sert lorsque les $\mathrm{P}(A_{i})$ sont proches de $1$ : si chacun de $10$ composants fonctionne avec la probabilité $0{,}99$, tous fonctionnent avec une probabilité au moins $0{,}9$, sans aucune hypothèse d'indépendance.

    **2. (a)** Soit $m$ le nombre d'indices $i$ tels que $\omega \in A_{i}$. La première somme vaut $m$, et la seconde compte les paires $\{i, j\}$ d'indices tels que $\omega \in A_{i} \cap A_{j}$, c'est-à-dire les paires d'indices parmi les $m$ précédents : elle vaut $\binom{m}{2}$. Le second membre vaut $0$ si $m = 0$ et $1$ si $m \geqslant 1$. Pour $m = 0$, les deux membres sont nuls. Pour $m \geqslant 1$, 
    $$1 - \Big(m - \frac{m(m - 1)}{2}\Big) = \frac{m^{2} - 3m + 2}{2} = \frac{(m - 1)(m - 2)}{2} \geqslant 0,$$
     puisqu'aucun entier n'est strictement compris entre $1$ et $2$. 
    $$\boxed{\sum_{i=1}^{n} \mathbf{1}_{A_{i}}(\omega) - \sum_{1 \leqslant i < j \leqslant n} \mathbf{1}_{A_{i} \cap A_{j}}(\omega) \leqslant \mathbf{1}_{A_{1} \cup \cdots \cup A_{n}}(\omega)}$$
     avec égalité si et seulement si $\omega$ appartient à au plus deux des $A_{i}$.

    **(b)** Pour tout événement $A$, le théorème 4 donne $\mathrm{P}(A) = \sum_{\omega \in A} \mathrm{P}(\{\omega\}) = \sum_{\omega \in \Omega} \mathrm{P}(\{\omega\})\,\mathbf{1}_{A}(\omega)$. On multiplie l'inégalité de (a) par le réel positif $\mathrm{P}(\{\omega\})$, on somme sur $\omega \in \Omega$ et l'on intervertit les sommes finies (chapitre 3) : 
    $$\boxed{\mathrm{P}(A_{1} \cup \cdots \cup A_{n}) \geqslant \sum_{i=1}^{n} \mathrm{P}(A_{i}) - \sum_{1 \leqslant i < j \leqslant n} \mathrm{P}(A_{i} \cap A_{j})}$$

    **3.** On fixe $j$ et l'on montre l'inégalité ponctuelle 
    $$\mathbf{1}_{A_{1} \cup \cdots \cup A_{n}}(\omega) \leqslant \sum_{i=1}^{n} \mathbf{1}_{A_{i}}(\omega) - \sum_{i \neq j} \mathbf{1}_{A_{i} \cap A_{j}}(\omega).$$
     Avec $m$ défini comme en (a) : si $\omega \notin A_{j}$, la seconde somme est nulle et le second membre vaut $m$, qui est supérieur ou égal à $\mathbf{1}_{A_{1} \cup \cdots \cup A_{n}}(\omega)$ ; si $\omega \in A_{j}$, la seconde somme vaut $m - 1$, le second membre vaut $m - (m - 1) = 1$, et le premier aussi. On conclut comme en 2 (b) : 
    $$\boxed{\mathrm{P}(A_{1} \cup \cdots \cup A_{n}) \leqslant \sum_{i=1}^{n} \mathrm{P}(A_{i}) - \sum_{i \neq j} \mathrm{P}(A_{i} \cap A_{j})}$$
     On peut aussi l'obtenir en écrivant la réunion comme celle de $A_{j}$ et des $A_{i} \setminus A_{j}$, pour $i \neq j$, puis en appliquant la sous-additivité et $\mathrm{P}(A_{i} \setminus A_{j}) = \mathrm{P}(A_{i}) - \mathrm{P}(A_{i} \cap A_{j})$. Des tests exacts sur $500$ familles d'événements tirées au hasard confirment les trois inégalités ✓.

    *À retenir.* Les questions 2 et 3 encadrent la probabilité d'une réunion à l'aide des probabilités des intersections deux à deux : tronquer la formule du crible (section 21.2.5) après le terme d'ordre $2$ donne un minorant. L'outil est le passage des indicatrices aux probabilités : une inégalité vraie en chaque issue devient une inégalité entre probabilités, exactement comme l'exemple de la section 21.2.2 transformait une égalité de fonctions en égalité de cardinaux.
- id: "ma-21-33"
  feuille: "f-ma-21"
  numero: 33
  partie: "Espaces probabilisés finis"
  etoiles: 3
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [espaces probabilisés finis, probabilités]
  noeuds: [p-espace]
  notions: [espace-probabilise, probabilite]
  page_enonce: 9
  page_corrige: 32
  enonce: |
    Soit $k$ et $n$ deux entiers naturels non nuls. On range $k$ objets dans $n$ tiroirs, chaque objet étant placé dans un tiroir choisi au hasard, et toutes les répartitions étant également probables.

    **1.** Quelle est la probabilité $q_{k,n}$ que les $k$ objets se trouvent dans des tiroirs deux à deux distincts ?

    **2.** Le cours a calculé la probabilité que deux personnes au moins, parmi $k$, aient la même date d'anniversaire. À l'aide d'un programme Python, déterminer le plus petit $k$ pour lequel elle dépasse $0{,}5$, puis $0{,}9$.

    **3.** Soit $t > 0$. Pour $n \geqslant 1$, on pose $k_{n} = \lfloor t\sqrt{n} \rfloor$, et l'on suppose $k_{n} \geqslant 1$.

    **(a)** Montrer que $-x - x^{2} \leqslant \ln(1 - x) \leqslant -x$ pour tout $x \in \big[0\,,\frac{1}{2}\big]$.

    **(b)** En déduire la limite de $q_{k_{n},n}$ quand $n$ tend vers $+\infty$. Interpréter le résultat pour $n = 365$.
  corrige: |
    **1.** Une répartition est une application de l'ensemble des $k$ objets dans l'ensemble des $n$ tiroirs ; l'univers est l'ensemble de ces $n^{k}$ applications (proposition 3), muni de la probabilité uniforme. Les répartitions favorables sont les injections, au nombre de $A_{n}^{k}$ si $k \leqslant n$, et de $0$ sinon (théorème 1) : 
    $$\boxed{q_{k,n} = \frac{A_{n}^{k}}{n^{k}} = \prod_{i=0}^{k-1} \Big(1 - \frac{i}{n}\Big)}$$
     la formule restant vraie pour $k > n$, puisque le produit contient alors le facteur nul $1 - \frac{n}{n}$.

    **2.** La probabilité d'au moins une coïncidence vaut $1 - q_{k,365}$, comme dans l'exemple du cours (section 21.3.2). On la calcule en flottants, et l'on augmente $k$ jusqu'à dépasser le seuil : 

    ```python
    def q(k, n):
        p = 1.0
        for i in range(k):
            p *= (n - i) / n
        return p

    def seuil(s, n=365):
        k = 1
        while 1 - q(k, n) <= s:
            k += 1
        return k

    print(seuil(0.5), seuil(0.9))   # affiche 23 41
    ```

     On obtient $1 - q_{22,365} \approx 0{,}476$, $1 - q_{23,365} \approx 0{,}507$, puis $1 - q_{40,365} \approx 0{,}891$ et $1 - q_{41,365} \approx 0{,}903$ : 
    $$\boxed{k = 23 \text{ pour le seuil } 0{,}5, \qquad k = 41 \text{ pour le seuil } 0{,}9}$$

    **3. (a)** On pose $f(x) = \ln(1 - x) + x$ et $g(x) = \ln(1 - x) + x + x^{2}$, dérivables sur $\big[0\,,\frac{1}{2}\big]$, avec 
    $$f'(x) = 1 - \frac{1}{1 - x} = -\frac{x}{1 - x} \leqslant 0, \qquad g'(x) = 1 + 2x - \frac{1}{1 - x} = \frac{x(1 - 2x)}{1 - x} \geqslant 0.$$
     La fonction $f$ décroît et $g$ croît sur $\big[0\,,\frac{1}{2}\big]$, et $f(0) = g(0) = 0$, d'où $f \leqslant 0 \leqslant g$ : 
    $$\boxed{-x - x^{2} \leqslant \ln(1 - x) \leqslant -x \qquad\text{pour tout } x \in \Big[0\,,\frac{1}{2}\Big]}$$
     L'inégalité de droite est l'inégalité de concavité du logarithme (chapitre 9) ; celle de gauche cesse d'être vraie près de $1$, où $\ln(1 - x)$ tend vers $-\infty$, d'où la restriction à $\big[0\,,\frac{1}{2}\big]$.

    **(b)** On note $k = k_{n}$. Comme $t\sqrt{n} - 1 < k \leqslant t\sqrt{n}$, on a $\frac{k}{\sqrt{n}} \to t$ par encadrement. Pour $n \geqslant 4t^{2}$ et $0 \leqslant i \leqslant k - 1$, on a $\frac{i}{n} \leqslant \frac{t\sqrt{n}}{n} = \frac{t}{\sqrt{n}} \leqslant \frac{1}{2}$ : la question (a) s'applique à chaque facteur, en particulier $k \leqslant n$ et $q_{k,n} > 0$. En sommant, 
    $$-\sum_{i=0}^{k-1} \frac{i}{n} - \sum_{i=0}^{k-1} \frac{i^{2}}{n^{2}} \leqslant \ln q_{k,n} \leqslant -\sum_{i=0}^{k-1} \frac{i}{n}, \qquad\text{avec}\qquad \sum_{i=0}^{k-1} \frac{i}{n} = \frac{k(k - 1)}{2n} = \frac{1}{2} \cdot \frac{k}{\sqrt{n}} \cdot \frac{k - 1}{\sqrt{n}}.$$
     Cette dernière quantité tend vers $\frac{t^{2}}{2}$, et la somme des $\frac{i^{2}}{n^{2}}$, qui a $k$ termes majorés par $\frac{k^{2}}{n^{2}}$, est majorée par $\frac{k^{3}}{n^{2}} \leqslant \frac{t^{3}}{\sqrt{n}}$, qui tend vers $0$. Par encadrement, $\ln q_{k_{n},n}$ tend vers $-\frac{t^{2}}{2}$, et, par continuité de l'exponentielle, 
    $$\boxed{\lim_{n \to +\infty} q_{k_{n},n} = \mathrm{e}^{-t^{2}/2}}$$
     Pour $n = 10^{6}$ et $t = 1$, on calcule $q_{1000,\,10^{6}} \approx 0{,}6067$, pour $\mathrm{e}^{-1/2} \approx 0{,}6065$ ✓.

    *Interprétation pour $n = 365$.* Avec $k = t\sqrt{365}$, la probabilité que les $k$ anniversaires soient distincts vaut environ $\mathrm{e}^{-k^{2}/730}$. Elle vaut $\frac{1}{2}$ pour $k = \sqrt{730\ln 2} \approx 22{,}5$, et $\frac{1}{10}$ pour $k = \sqrt{730\ln 10} \approx 41{,}0$ : l'approximation retrouve les deux seuils de la question 2. Le nombre de personnes nécessaire pour une coïncidence probable est de l'ordre de $\sqrt{n}$, et non de $n$, parce que $\frac{k^{2}}{2n}$ est à peu près le nombre $\binom{k}{2}$ de paires de personnes, multiplié par la probabilité $\frac{1}{n}$ de coïncidence pour chaque paire.

    *Piège.* L'erreur la plus répandue est d'écrire $\ln q_{k,n} \approx -\sum \frac{i}{n}$ sans contrôler l'erreur : chacun des $k$ termes commet une erreur de l'ordre de $\frac{i^{2}}{n^{2}}$, et c'est leur somme, de l'ordre de $\frac{k^{3}}{n^{2}}$, qu'il faut rendre négligeable. Elle tend vers $0$ parce que $k$ est de l'ordre de $\sqrt{n}$ ; pour $k$ de l'ordre de $n^{2/3}$, elle ne tendrait plus vers $0$.
- id: "ma-21-34"
  feuille: "f-ma-21"
  numero: 34
  partie: "Espaces probabilisés finis"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces probabilisés finis, coefficients binomiaux, applications et dénombrement, probabilités]
  noeuds: [p-espace, pol-binome, r-injections]
  notions: [espace-probabilise, probabilite, coefficient-binomial]
  page_enonce: 9
  page_corrige: 33
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $E = \llbracket 1\,,n \rrbracket$. On choisit une application $f : E \to E$ au hasard, toutes les applications étant également probables, et l'on note $p_{n}$ la probabilité que $f \circ f = f$.

    **1.** Montrer que $f \circ f = f$ si et seulement si $f(y) = y$ pour tout $y \in f(E)$, comme dans l'exercice 18 de la feuille du chapitre 2.

    **2.** En déduire que $\displaystyle p_{n} = \frac{1}{n^{n}}\sum_{k=1}^{n} \binom{n}{k}k^{n-k}$.

    **3.** Montrer que $p_{n}$ tend vers $0$ quand $n$ tend vers $+\infty$. On pourra utiliser la majoration $\binom{n}{k} \leqslant \frac{n^{k}}{k!}$, et séparer les indices $k \leqslant \frac{n}{2}$ des autres.
  corrige: |
    L'univers est l'ensemble $E^{E}$ des applications de $E$ dans $E$, de cardinal $n^{n}$ (proposition 3), muni de la probabilité uniforme.

    **1.** Supposons $f \circ f = f$ et soit $y \in f(E)$, de la forme $y = f(x)$. Alors $f(y) = f(f(x)) = f(x) = y$. Réciproquement, si $f(y) = y$ pour tout $y \in f(E)$, alors, pour tout $x \in E$, l'élément $f(x)$ appartient à $f(E)$, donc $f(f(x)) = f(x)$. 
    $$\boxed{f \circ f = f \iff f(y) = y \ \text{ pour tout } y \in f(E)}$$
     C'est la question 2 de l'exercice 18 de la feuille du chapitre 2, avec sa réciproque.

    **2.** On classe les applications $f$ telles que $f \circ f = f$ selon leur image $F = f(E)$, qui est une partie non vide de $E$, puisque $E$ ne l'est pas. Soit $F$ une partie à $k \geqslant 1$ éléments. D'après la question 1, une application $f$ telle que $f \circ f = f$ et $f(E) = F$ vaut l'identité sur $F$, et envoie chacun des $n - k$ éléments de $E \setminus F$ dans $F$. Réciproquement, une telle application a pour image $F$ (elle contient $F$, puisque $f$ fixe les points de $F$, et elle est contenue dans $F$), et vérifie donc $f \circ f = f$ par la question 1. Il y en a autant que d'applications de $E \setminus F$ dans $F$, soit $k^{n-k}$ (proposition 3). Il y a $\binom{n}{k}$ parties $F$ à $k$ éléments (théorème 2), et la proposition 2 (i) donne 
    $$\boxed{\big|\{f \in E^{E} \mid f \circ f = f\}\big| = \sum_{k=1}^{n} \dbinom{n}{k}k^{n-k}, \qquad p_{n} = \frac{1}{n^{n}}\sum_{k=1}^{n} \dbinom{n}{k}k^{n-k}}$$
     Pour $n = 1$, …, $6$, on trouve $1$, $3$, $10$, $41$, $196$, $1\,057$ applications, nombres confirmés par une énumération des $n^{n}$ applications ✓. Pour $n = 3$, ce sont l'identité, les $3$ applications constantes, et les $6$ applications d'image à deux éléments.

    **3.** Soit $n \geqslant 2$. Comme $\binom{n}{k} = \frac{n(n - 1)\cdots(n - k + 1)}{k!} \leqslant \frac{n^{k}}{k!}$, le terme d'indice $k$ de $p_{n}$ vérifie 
    $$0 \leqslant u_{k} = \frac{1}{n^{n}}\dbinom{n}{k}k^{n-k} \leqslant \frac{n^{k}k^{n-k}}{k!\,n^{n}} = \frac{1}{k!}\Big(\frac{k}{n}\Big)^{n-k}.$$

    • Si $k \leqslant \frac{n}{2}$, alors $\frac{k}{n} \leqslant \frac{1}{2}$ et $n - k \geqslant \frac{n}{2}$, donc $u_{k} \leqslant \frac{1}{k!}\,2^{-n/2}$. En sommant, et comme $\sum_{k \geqslant 1} \frac{1}{k!} = \mathrm{e} - 1$ (chapitre 20, théorème 2), la somme de ces termes est majorée par $(\mathrm{e} - 1)\,2^{-n/2}$.

    • Si $k > \frac{n}{2}$, alors $k \geqslant m$, avec $m = \lfloor n/2 \rfloor + 1$, et $\big(\frac{k}{n}\big)^{n-k} \leqslant 1$, donc $u_{k} \leqslant \frac{1}{m!}$. Il y a au plus $n \leqslant 2m$ tels termes, de somme majorée par $\frac{2m}{m!} = \frac{2}{(m - 1)!}$.

    $$\boxed{0 \leqslant p_{n} \leqslant (\mathrm{e} - 1)\,2^{-n/2} + \frac{2}{\lfloor n/2 \rfloor!} \xrightarrow[n \to +\infty]{} 0}$$
     Numériquement, $p_{5} \approx 0{,}063$, $p_{10} \approx 2{,}2 \times 10^{-4}$ et $p_{20} \approx 2{,}6 \times 10^{-10}$ : la décroissance est bien plus rapide que ne le dit le majorant, qui ne sert qu'à établir la limite.

    *Piège.* Majorer chaque terme par une quantité qui tend vers $0$ ne suffit pas, puisque le nombre de termes augmente avec $n$ : l'erreur la plus répandue est d'oublier ce nombre. La séparation en deux paquets répond à deux difficultés distinctes. Pour $k$ petit, c'est le facteur $\big(\frac{k}{n}\big)^{n-k}$ qui est minuscule, et la série exponentielle contrôle la somme des $\frac{1}{k!}$ ; pour $k$ grand, ce facteur peut être proche de $1$, mais $\frac{1}{k!}$ écrase le nombre $n$ de termes.
- id: "ma-21-35"
  feuille: "f-ma-21"
  numero: 35
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [conditionnement et indépendance, probabilités]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 10
  page_corrige: 34
  enonce: |
    Les clients d'une compagnie d'assurance se répartissent en trois catégories : $R_{1}$, les bons risques, qui forment $20\,\%$ de la clientèle, $R_{2}$, les risques moyens, qui en forment $50\,\%$, et $R_{3}$, les mauvais risques. La probabilité qu'un client ait un accident dans l'année vaut $0{,}05$ dans la catégorie $R_{1}$, $0{,}15$ dans la catégorie $R_{2}$ et $0{,}30$ dans la catégorie $R_{3}$.

    **1.** Quelle est la probabilité qu'un client choisi au hasard ait un accident dans l'année ?

    **2.** Un client n'a pas eu d'accident cette année. Quelle est la probabilité qu'il soit un bon risque ?
  corrige: |
    On choisit un client au hasard dans un espace probabilisé fini $(\Omega, \mathrm{P})$. Les événements $R_{1}$, $R_{2}$, $R_{3}$ forment un système complet, avec $\mathrm{P}(R_{1}) = 0{,}2$, $\mathrm{P}(R_{2}) = 0{,}5$ et $\mathrm{P}(R_{3}) = 0{,}3$. On note $A$ l'événement « le client a un accident dans l'année » ; les données sont $\mathrm{P}_{R_{1}}(A) = 0{,}05$, $\mathrm{P}_{R_{2}}(A) = 0{,}15$ et $\mathrm{P}_{R_{3}}(A) = 0{,}30$.

    **1.** La formule des probabilités totales (théorème 5) donne 
    $$\mathrm{P}(A) = 0{,}05 \times 0{,}2 + 0{,}15 \times 0{,}5 + 0{,}30 \times 0{,}3 = 0{,}01 + 0{,}075 + 0{,}09, \qquad \boxed{\mathrm{P}(A) = 0{,}175 = \frac{7}{40}}$$

    **2.** On cherche $\mathrm{P}_{\overline{A}}(R_{1})$. Par la proposition 8, $\mathrm{P}_{R_{1}}(\overline{A}) = 1 - 0{,}05 = 0{,}95$, et $\mathrm{P}(\overline{A}) = 0{,}825$. La formule de Bayes (théorème 6) donne 
    $$\mathrm{P}_{\overline{A}}(R_{1}) = \frac{\mathrm{P}_{R_{1}}(\overline{A})\,\mathrm{P}(R_{1})}{\mathrm{P}(\overline{A})} = \frac{0{,}95 \times 0{,}2}{0{,}825} = \frac{0{,}19}{0{,}825}, \qquad \boxed{\mathrm{P}_{\overline{A}}(R_{1}) = \frac{38}{165} \approx 0{,}230}$$

    ![Figure](documents/figures/8978cd181ba54de5.svg)

    Les trois chemins qui mènent à $\overline{A}$ ont pour probabilités $0{,}19$, $0{,}425$ et $0{,}21$, de somme $0{,}825$ ; la formule de Bayes mesure la part du chemin bleu dans cette somme. Les deux autres parts donnent $\mathrm{P}_{\overline{A}}(R_{2}) = \frac{17}{33}$ et $\mathrm{P}_{\overline{A}}(R_{3}) = \frac{14}{55}$, et les trois probabilités totalisent $\frac{38 + 85 + 42}{165} = 1$ ✓.

    L'absence d'accident fait passer la probabilité d'être un bon risque de $0{,}2$ à $0{,}23$ seulement : une année sans accident est le cas de loin le plus fréquent dans toutes les catégories, et elle n'apporte qu'une information faible. C'est pourquoi un assureur révise ses tarifs sur plusieurs années.
- id: "ma-21-36"
  feuille: "f-ma-21"
  numero: 36
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [conditionnement et indépendance, probabilités, probabilités conditionnelles]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 10
  page_corrige: 35
  enonce: |
    Dans un questionnaire à choix multiples, chaque question propose $m \geqslant 2$ réponses, dont une seule est exacte. Un candidat connaît la réponse à une question avec la probabilité $p \in \left]0\,,1\right]$ ; s'il ne la connaît pas, il choisit une réponse au hasard. Sachant qu'il a donné la bonne réponse, quelle est la probabilité qu'il la connaisse vraiment ? Calculer cette probabilité pour $m = 4$ et $p = \frac{1}{2}$, et commenter son évolution lorsque $m$ augmente.
  corrige: |
    On note $C$ l'événement « le candidat connaît la réponse » et $E$ l'événement « il donne la réponse exacte ». Les données sont $\mathrm{P}(C) = p$, $\mathrm{P}_{C}(E) = 1$ et, s'il répond au hasard parmi les $m$ réponses, $\mathrm{P}_{\overline{C}}(E) = \frac{1}{m}$.

    ![Figure](documents/figures/ce2f9e09000fba36.svg)

    On lit sur l'arbre les deux chemins qui mènent à $E$, de probabilités $p$ et $\frac{1 - p}{m}$ ; la réponse cherchée est la part du premier dans leur somme.

    Par la formule des probabilités totales, $\mathrm{P}(E) = p + \frac{1 - p}{m} > 0$, puis, par la formule de Bayes, 
    $$\mathrm{P}_{E}(C) = \frac{\mathrm{P}_{C}(E)\,\mathrm{P}(C)}{\mathrm{P}(E)} = \frac{p}{p + \frac{1 - p}{m}}, \qquad \boxed{\mathrm{P}_{E}(C) = \frac{mp}{1 + (m - 1)p}}$$
     Pour $m = 4$ et $p = \frac{1}{2}$ : 
    $$\boxed{\mathrm{P}_{E}(C) = \frac{2}{1 + \frac{3}{2}} = \frac{4}{5}}$$
     À $p$ fixé dans $\left]0\,,1\right[$, la fonction $m \mapsto \frac{mp}{1 - p + mp}$ est croissante, de dérivée $\frac{p(1 - p)}{(1 - p + mp)^{2}} > 0$, et tend vers $1$ quand $m$ tend vers $+\infty$ : pour $p = \frac{1}{2}$, elle vaut $\frac{2}{3}$ pour $m = 2$ et $\frac{10}{11}$ pour $m = 10$. Plus il y a de réponses proposées, moins une bonne réponse peut être due au hasard, et plus elle témoigne d'une connaissance réelle. Pour $p = 1$, la probabilité vaut $1$ quel que soit $m$.

    *Piège.* L'erreur la plus répandue est de confondre $\mathrm{P}_{E}(C)$, qui est demandée, et $\mathrm{P}_{C}(E) = 1$ : un candidat qui sait répond juste, mais un candidat qui répond juste ne sait pas forcément. C'est la confusion signalée dans la remarque qui suit l'exemple du test de dépistage (section 21.4.1).
- id: "ma-21-37"
  feuille: "f-ma-21"
  numero: 37
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [conditionnement et indépendance, probabilités, probabilités conditionnelles, indépendance, jeux de hasard]
  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 10
  page_corrige: 35
  enonce: |
    On dispose de $100$ dés, dont $25$ sont pipés : pour un dé pipé, la probabilité d'obtenir $6$ vaut $\frac{1}{2}$, et les autres dés sont équilibrés.

    **1.** On choisit un dé au hasard, on le lance, et l'on obtient $6$. Quelle est la probabilité que ce dé soit pipé ?

    **2.** On lance $n$ fois le dé choisi, les lancers étant indépendants sachant le dé choisi, et l'on obtient $n$ fois le $6$. Calculer la probabilité $p_{n}$ que le dé soit pipé, puis la limite de $(p_{n})$, et interpréter.
  corrige: |
    On note $T$ l'événement « le dé choisi est pipé », de probabilité $\mathrm{P}(T) = \frac{25}{100} = \frac{1}{4}$, et $S_{n}$ l'événement « les $n$ premiers lancers donnent $6$ ». L'hypothèse d'indépendance sachant le dé choisi signifie que, pour la probabilité $\mathrm{P}_{T}$ comme pour la probabilité $\mathrm{P}_{\overline{T}}$, les événements « le $i$-ième lancer donne $6$ » sont mutuellement indépendants, de probabilités respectives $\frac{1}{2}$ et $\frac{1}{6}$. Ainsi 
    $$\mathrm{P}_{T}(S_{n}) = \frac{1}{2^{n}}, \qquad \mathrm{P}_{\overline{T}}(S_{n}) = \frac{1}{6^{n}}.$$

    **1.** C'est le cas $n = 1$ de la question suivante : par la formule de Bayes, 
    $$\mathrm{P}_{S_{1}}(T) = \frac{\frac{1}{2} \times \frac{1}{4}}{\frac{1}{2} \times \frac{1}{4} + \frac{1}{6} \times \frac{3}{4}} = \frac{\frac{1}{8}}{\frac{1}{8} + \frac{1}{8}}, \qquad \boxed{\mathrm{P}_{S_{1}}(T) = \frac{1}{2}}$$

    **2.** De même, par les théorèmes 5 et 6, 
    $$p_{n} = \mathrm{P}_{S_{n}}(T) = \frac{\frac{1}{4} \cdot \frac{1}{2^{n}}}{\frac{1}{4} \cdot \frac{1}{2^{n}} + \frac{3}{4} \cdot \frac{1}{6^{n}}} = \frac{1}{1 + 3 \cdot \frac{2^{n}}{6^{n}}}, \qquad \boxed{p_{n} = \frac{3^{n}}{3^{n} + 3} \xrightarrow[n \to +\infty]{} 1}$$
     On trouve $p_{0} = \frac{1}{4}$, $p_{1} = \frac{1}{2}$, $p_{2} = \frac{3}{4}$, $p_{3} = \frac{9}{10}$, $p_{4} = \frac{27}{28}$ ✓. Chaque nouveau $6$ multiplie par $3$ le rapport $\frac{p_{n}}{1 - p_{n}} = 3^{n-1}$, qui est le rapport des chances « pipé contre équilibré » : c'est le rapport $\frac{1/2}{1/6}$ des probabilités d'obtenir $6$ avec les deux sortes de dés. Une longue série de $6$ rend la culpabilité du dé presque certaine, bien qu'un dé équilibré puisse aussi la produire.

    *Piège.* Les lancers sont indépendants sachant le dé, mais pas pour la probabilité $\mathrm{P}$ : l'événement « le premier lancer donne $6$ », de probabilité $\frac{1}{4}$, rend le dé plus suspect et le second $6$ plus probable. L'erreur la plus répandue est d'écrire $\mathrm{P}(S_{n}) = \mathrm{P}(S_{1})^{n}$ ; on calcule $\mathrm{P}(S_{n})$ par la formule des probabilités totales, comme le fera l'exercice 43.
- id: "ma-21-38"
