    **1.** Soit $A_{1}$, …, $A_{n}$ des événements mutuellement indépendants, de probabilités $p_{1}$, …, $p_{n}$. Exprimer $\mathrm{P}(A_{1} \cup \cdots \cup A_{n})$ en fonction des $p_{i}$. Application : une personne effectue $n$ expériences indépendantes, et chacune provoque un accident avec la probabilité $p$ ; quelle est la probabilité qu'il se produise au moins un accident ?

    **2.** Un circuit comporte trois composants $C_{1}$, $C_{2}$, $C_{3}$, qui fonctionnent avec les probabilités $p_{1}$, $p_{2}$, $p_{3}$, indépendamment les uns des autres. Calculer la probabilité que le circuit fonctionne lorsque les composants sont montés en série, puis en parallèle, puis lorsque $C_{1}$ est monté en série avec le bloc formé de $C_{2}$ et $C_{3}$ montés en parallèle.

    **3.** Un avion $A$ a quatre moteurs et un avion $B$ en a deux. Chaque moteur tombe en panne avec la probabilité $p \in \left]0\,,1\right[$, indépendamment des autres, et un avion arrive à destination si strictement moins de la moitié de ses moteurs tombent en panne. Selon la valeur de $p$, quel avion choisir ?
  corrige: |
    **1.** Le contraire de $A_{1} \cup \cdots \cup A_{n}$ est $\overline{A_{1}} \cap \cdots \cap \overline{A_{n}}$, et les $\overline{A_{i}}$ sont mutuellement indépendants (proposition 10 (iii)) : 
    $$\boxed{\mathrm{P}(A_{1} \cup \cdots \cup A_{n}) = 1 - \prod_{i=1}^{n} (1 - p_{i})}$$
     Pour $n$ expériences provoquant chacune un accident avec la probabilité $p$, il vient 
    $$\boxed{\mathrm{P}(\text{au moins un accident}) = 1 - (1 - p)^{n} \xrightarrow[n \to +\infty]{} 1 \quad\text{si } p > 0}$$
     Pour $p = 0{,}01$ et $n = 100$, la probabilité vaut déjà $1 - 0{,}99^{100} \approx 0{,}634$. Un risque faible, répété souvent, finit presque sûrement par se réaliser.

    **2.** On note $F_{i}$ l'événement « le composant $C_{i}$ fonctionne », ces trois événements étant mutuellement indépendants.

    ![Figure](documents/figures/1abf0f6647e8efe0.svg)

    Le courant passe à travers un montage en série si tous les composants fonctionnent, à travers un montage en parallèle si l'un au moins fonctionne : la série est une intersection, le parallèle une réunion.

    • *En série*, le circuit fonctionne si $F_{1} \cap F_{2} \cap F_{3}$ est réalisé, avec la probabilité $p_{1}p_{2}p_{3}$.

    • *En parallèle*, il fonctionne si $F_{1} \cup F_{2} \cup F_{3}$ est réalisé, avec la probabilité $1 - (1 - p_{1})(1 - p_{2})(1 - p_{3})$ par la question 1.

    • *Montage mixte.* Il fonctionne si $F_{1} \cap (F_{2} \cup F_{3}) = (F_{1} \cap F_{2}) \cup (F_{1} \cap F_{3})$ est réalisé. Par la proposition 7 (iv) et l'indépendance mutuelle, sa probabilité vaut $p_{1}p_{2} + p_{1}p_{3} - p_{1}p_{2}p_{3}$.

    $$\boxed{\mathrm{P}_{\text{série}} = p_{1}p_{2}p_{3}, \qquad \mathrm{P}_{\text{parallèle}} = 1 - (1 - p_{1})(1 - p_{2})(1 - p_{3}), \qquad \mathrm{P}_{\text{mixte}} = p_{1}(p_{2} + p_{3} - p_{2}p_{3})}$$
     Le résultat du montage mixte est le produit de $p_{1}$ et de la probabilité $1 - (1 - p_{2})(1 - p_{3})$ que le bloc parallèle fonctionne : le calcul par le crible a évité d'avoir à justifier l'indépendance de $F_{1}$ et de $F_{2} \cup F_{3}$, que le lemme des coalitions (théorème 7), appliqué aux indicatrices, donnerait directement.

    **3.** On note $M_{1}$, …, $M_{4}$ les événements « le moteur $i$ tombe en panne », mutuellement indépendants de probabilité $p$. L'avion $A$ arrive si au plus un moteur tombe en panne, c'est-à-dire si l'un des cinq événements deux à deux incompatibles $\overline{M_{1}} \cap \cdots \cap \overline{M_{4}}$ et $M_{i} \cap \bigcap_{j \neq i} \overline{M_{j}}$, pour $i \in \llbracket 1\,,4 \rrbracket$, est réalisé ; par la proposition 10 (iii), ils ont pour probabilités $(1 - p)^{4}$ et $p(1 - p)^{3}$. L'avion $B$ arrive si aucun de ses deux moteurs ne tombe en panne. Ainsi 
    $$\mathrm{P}(A \text{ arrive}) = (1 - p)^{4} + 4p(1 - p)^{3}, \qquad \mathrm{P}(B \text{ arrive}) = (1 - p)^{2},$$
     et, en factorisant par $(1 - p)^{2}$, 
    $$\mathrm{P}(A \text{ arrive}) - \mathrm{P}(B \text{ arrive}) = (1 - p)^{2}\big[(1 - p)^{2} + 4p(1 - p) - 1\big] = (1 - p)^{2}(2p - 3p^{2}),$$

    $$\boxed{\mathrm{P}(A \text{ arrive}) - \mathrm{P}(B \text{ arrive}) = p(1 - p)^{2}(2 - 3p)}$$

    $$\boxed{\text{on choisit l'avion } A \text{ si } p < \frac{2}{3}, \quad \text{l'avion } B \text{ si } p > \frac{2}{3}, \quad \text{indifféremment si } p = \frac{2}{3}}$$
     Pour $p = \frac{1}{4}$, l'avion $A$ arrive avec la probabilité $\frac{189}{256} \approx 0{,}74$ contre $\frac{9}{16} \approx 0{,}56$ pour $B$ ; pour $p = \frac{2}{3}$, les deux probabilités valent $\frac{1}{9}$ ✓. Lorsque les moteurs sont fiables, avoir quatre moteurs, dont un peut lâcher, protège mieux que d'en avoir deux, dont aucun ne peut lâcher ; lorsqu'ils sont très peu fiables, les deux avions sont dangereux, et il vaut mieux exposer moins de moteurs à la panne.
- id: "ma-21-42"
  feuille: "f-ma-21"
  numero: 42
  partie: "Probabilités conditionnelles et indépendance"
  etoiles: 2
  types: [Modélisation]
