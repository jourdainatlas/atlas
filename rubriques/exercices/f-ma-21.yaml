  page_enonce: 24
  page_corrige: 92
  enonce: |
    Soit $n \geqslant 2$ et $\Sigma$ une variable aléatoire de loi uniforme sur $\mathfrak{S}_{n}$. Comme dans le cours, on dit que $i \in \llbracket 1\,,n \rrbracket$ est un *record* de $\Sigma$ si $\Sigma(i) > \Sigma(j)$ pour tout $j < i$ ; on note $I_{i}$ l'indicatrice de l'événement « $i$ est un record », et $R_{n} = I_{1} + \cdots + I_{n}$. Le cours a montré que $\mathrm{P}(I_{i} = 1) = \frac{1}{i}$ et $\mathrm{E}(R_{n}) = H_{n} = \sum_{i=1}^{n} \frac{1}{i}$.

    **1.** Soit $i < j$. Montrer que $\mathrm{P}(I_{i} = 1, I_{j} = 1) = \frac{1}{ij}$. On pourra dénombrer les permutations dont $i$ et $j$ sont des records, en choisissant d'abord les valeurs prises sur $\llbracket 1\,,j \rrbracket$.

    **2.** En déduire la variance de $R_{n}$, et montrer que $\mathrm{V}(R_{n}) \leqslant H_{n}$.

    **3.** Montrer que, pour tout $\varepsilon > 0$, $\mathrm{P}\Big(\Big|\dfrac{R_{n}}{\ln n} - 1\Big| > \varepsilon\Big)$ tend vers $0$ quand $n$ tend vers $+\infty$.
  corrige: |
    L'univers est $\mathfrak{S}_{n}$, muni de la probabilité uniforme. L'entier $i$ est un record de $\Sigma$ si et seulement si $\Sigma(i) = \max \Sigma\big(\llbracket 1\,,i \rrbracket\big)$ : cette condition ne fait intervenir que les valeurs prises sur $\llbracket 1\,,i \rrbracket$.

    **1.** Soit $i < j$. On construit une permutation $\sigma$ dont $i$ et $j$ sont des records par choix successifs, dont le nombre ne dépend pas des choix précédents (lemme des bergers) :

    • on choisit l'ensemble $A = \sigma\big(\llbracket 1\,,j \rrbracket\big)$, partie à $j$ éléments de $\llbracket 1\,,n \rrbracket$ : $\binom{n}{j}$ façons ;

    • on choisit la restriction de $\sigma$ à $\llbracket j + 1\,,n \rrbracket$, bijection sur le complémentaire de $A$ : $(n - j)!$ façons (théorème 1) ;

    • $j$ est un record si et seulement si $\sigma(j) = \max A$ : une seule façon ;

    • il reste à placer les $j - 1$ valeurs de $A' = A \setminus \{\max A\}$ sur $\llbracket 1\,,j - 1 \rrbracket$. On choisit l'ensemble $B = \sigma\big(\llbracket 1\,,i \rrbracket\big) \subset A'$, de $\binom{j - 1}{i}$ façons ; $i$ est un record si et seulement si $\sigma(i) = \max B$ ; on place les autres valeurs de $B$ sur $\llbracket 1\,,i - 1 \rrbracket$, de $(i - 1)!$ façons, et celles de $A' \setminus B$ sur $\llbracket i + 1\,,j - 1 \rrbracket$, de $(j - 1 - i)!$ façons.

    Chaque permutation de l'événement est obtenue exactement une fois, puisque tous les choix se lisent sur $\sigma$. Le nombre de ces permutations vaut 
    $$\binom{n}{j}(n - j)!\,\binom{j - 1}{i}(i - 1)!\,(j - 1 - i)! = \frac{n!}{j!} \cdot \frac{(j - 1)!}{i!\,(j - 1 - i)!}\,(i - 1)!\,(j - 1 - i)! = \frac{n!}{j}\cdot\frac{1}{i},$$
     et, en divisant par $n!$, 
    $$\boxed{\mathrm{P}(I_{i} = 1, I_{j} = 1) = \frac{1}{ij} = \mathrm{P}(I_{i} = 1)\,\mathrm{P}(I_{j} = 1)}$$
     Le résultat a été contrôlé par énumération de $\mathfrak{S}_{n}$ pour $n \leqslant 7$ ✓.

    **2.** Les indicatrices $I_{i}$ suivent les lois $\mathcal{B}(\frac{1}{i})$, et, pour $i < j$, la question 1 et la proposition 23 (i) donnent 
    $$\operatorname{Cov}(I_{i}, I_{j}) = \mathrm{E}(I_{i}I_{j}) - \mathrm{E}(I_{i})\,\mathrm{E}(I_{j}) = \frac{1}{ij} - \frac{1}{i}\cdot\frac{1}{j} = 0.$$
     Les $I_{i}$ sont deux à deux décorrélées, et le théorème 13, avec la proposition 21, donne 
    $$\boxed{\mathrm{V}(R_{n}) = \sum_{i=1}^{n} \frac{1}{i}\Big(1 - \frac{1}{i}\Big) = H_{n} - \sum_{i=1}^{n} \frac{1}{i^{2}} \leqslant H_{n}}$$
     Pour $n = 100$, on trouve $\mathrm{E}(R_{100}) \approx 5{,}19$ et $\mathrm{V}(R_{100}) \approx 3{,}55$, soit un écart type d'environ $1{,}9$.

    **3.** D'après le chapitre 20, $H_{n} - \ln n$ tend vers la constante d'Euler $\gamma$, donc $\frac{H_{n} - \ln n}{\ln n}$ tend vers $0$, et $H_{n} \sim \ln n$. Soit $\varepsilon > 0$, et $n_{0} \geqslant 2$ tel que $|H_{n} - \ln n| \leqslant \frac{\varepsilon}{2}\ln n$ pour $n \geqslant n_{0}$. Pour un tel $n$, l'inégalité triangulaire donne 
    $$\Big|\frac{R_{n}}{\ln n} - 1\Big| \leqslant \frac{|R_{n} - H_{n}|}{\ln n} + \frac{|H_{n} - \ln n|}{\ln n} \leqslant \frac{|R_{n} - H_{n}|}{\ln n} + \frac{\varepsilon}{2}.$$
     L'événement étudié est donc inclus dans $\big(|R_{n} - H_{n}| \geqslant \frac{\varepsilon}{2}\ln n\big)$. Comme $\mathrm{E}(R_{n}) = H_{n}$, l'inégalité de Bienaymé-Tchebychev et la question 2 donnent 
    $$\mathrm{P}\Big(\Big|\frac{R_{n}}{\ln n} - 1\Big| > \varepsilon\Big) \leqslant \frac{4\mathrm{V}(R_{n})}{\varepsilon^{2}(\ln n)^{2}} \leqslant \frac{4H_{n}}{\varepsilon^{2}(\ln n)^{2}} \underset{n \to +\infty}{\sim} \frac{4}{\varepsilon^{2}\ln n},$$

    $$\boxed{\mathrm{P}\Big(\Big|\frac{R_{n}}{\ln n} - 1\Big| > \varepsilon\Big) \xrightarrow[n \to +\infty]{} 0}$$

    *À retenir.* La variable $R_{n}$ n'est pas une somme de variables de même loi, et la loi faible des grands nombres ne s'applique pas telle quelle ; on refait sa démonstration, qui n'utilise que l'espérance, la variance et la décorrélation. La convergence est très lente : la majoration décroît comme $\frac{1}{\ln n}$, et les fluctuations de $R_{n}$ autour de $\ln n$ sont de l'ordre de $\sqrt{\ln n}$.
- id: "ma-21-101"
  feuille: "f-ma-21"
  numero: 101
  partie: "Inégalités probabilistes et loi faible des grands nombres"
  etoiles: 3
  types: [Calcul]
  mots_cles: [inégalités et loi faible, variables aléatoires, lois de Bernoulli et binomiale, jeux de hasard]
  noeuds: [p-esperance, p-loi-faible, p-variables, p-espace]
  notions: [variable-aleatoire]
  page_enonce: 24
  page_corrige: 93
  enonce: |
    *L'inégalité de Hoeffding pour la loi binomiale.* La proposition 24 du cours traite le cas d'une pièce équilibrée ; on étend ici le résultat à une pièce quelconque. Soit $p \in \left]0\,,1\right[$ et $S_{n}$ une variable de loi $\mathcal{B}(n,p)$.

    **1.** Soit $a \in \left]p\,,1\right]$. Montrer que, pour tout réel $s \geqslant 0$, 
    $$\mathrm{P}\Big(\frac{S_{n}}{n} \geqslant a\Big) \leqslant \mathrm{e}^{-nsa}\big(1 - p + p\,\mathrm{e}^{s}\big)^{n}.$$

    **2.** Pour $a \in \left]p\,,1\right[$, déterminer la meilleure de ces majorations, et l'exprimer à l'aide de 
    $$D(a, p) = (1 - a)\ln\Big(\frac{1 - a}{1 - p}\Big) + a\ln\Big(\frac{a}{p}\Big).$$

    **3.** Pour $0 < q < r < 1$, exprimer $D(r, q)$ comme l'intégrale sur $[q\,,r]$ de la fonction $t \mapsto \frac{r - t}{t(1 - t)}$, et en déduire que $D(r, q) \geqslant 2(r - q)^{2}$.

    **4.** En déduire que $\mathrm{P}\Big(\Big|\dfrac{S_{n}}{n} - p\Big| \geqslant \varepsilon\Big) \leqslant 2\,\mathrm{e}^{-2n\varepsilon^{2}}$ pour tout $\varepsilon > 0$, et comparer avec la proposition 24.
  corrige: |
    **1.** Soit $s \geqslant 0$. Si $s = 0$, le majorant vaut $1$, et l'inégalité est évidente. Si $s > 0$, la fonction $x \mapsto \mathrm{e}^{sx}$ est strictement croissante, et les événements $\big(\frac{S_{n}}{n} \geqslant a\big)$ et $\big(\mathrm{e}^{sS_{n}} \geqslant \mathrm{e}^{nsa}\big)$ sont égaux. L'inégalité de Markov, appliquée à la variable positive $\mathrm{e}^{sS_{n}}$, donne 
    $$\mathrm{P}\Big(\frac{S_{n}}{n} \geqslant a\Big) \leqslant \mathrm{e}^{-nsa}\,\mathrm{E}\big(\mathrm{e}^{sS_{n}}\big).$$
     La formule de transfert (théorème 10) et la formule du binôme donnent 
    $$\mathrm{E}\big(\mathrm{e}^{sS_{n}}\big) = \sum_{k=0}^{n} \mathrm{e}^{sk}\binom{n}{k}p^{k}(1 - p)^{n-k} = \sum_{k=0}^{n} \binom{n}{k}\big(p\,\mathrm{e}^{s}\big)^{k}(1 - p)^{n-k} = \big(1 - p + p\,\mathrm{e}^{s}\big)^{n},$$

    $$\boxed{\mathrm{P}\Big(\frac{S_{n}}{n} \geqslant a\Big) \leqslant \mathrm{e}^{-nsa}\big(1 - p + p\,\mathrm{e}^{s}\big)^{n} \quad\text{pour tout } s \geqslant 0}$$

    *Piège.* L'hypothèse $s \geqslant 0$ est indispensable : pour $s < 0$, l'exponentielle est décroissante et l'inclusion change de sens. Pour $n = 10$, $p = \frac{1}{2}$ et $a = \frac{1}{4}$, l'énoncé étendu à $s < 0$ donnerait un majorant d'environ $0{,}27$, alors que $\mathrm{P}(S_{10} \geqslant 2{,}5) \approx 0{,}945$ ✓.

    **2.** Minimiser le majorant revient à minimiser son logarithme divisé par $n$, 
    $$h(s) = -sa + \ln\big(1 - p + p\,\mathrm{e}^{s}\big), \qquad h'(s) = -a + \frac{p\,\mathrm{e}^{s}}{1 - p + p\,\mathrm{e}^{s}} = -a + 1 - \frac{1 - p}{1 - p + p\,\mathrm{e}^{s}}.$$
     La fonction $h'$ est strictement croissante, $h'(0) = p - a < 0$, et $h'(s)$ tend vers $1 - a > 0$ en $+\infty$. Elle s'annule en un unique point $s^{*}$, défini par $p\,\mathrm{e}^{s^{*}}(1 - a) = a(1 - p)$ : 
    $$\mathrm{e}^{s^{*}} = \frac{a(1 - p)}{p(1 - a)} > 1,$$
     puisque $a(1 - p) - p(1 - a) = a - p > 0$. La fonction $h$ décroît sur $[0\,,s^{*}]$ et croît ensuite : son minimum sur $\mathbb{R}_{+}$ est $h(s^{*})$. Or $1 - p + p\,\mathrm{e}^{s^{*}} = (1 - p)\big(1 + \frac{a}{1 - a}\big) = \frac{1 - p}{1 - a}$, d'où 
    $$h(s^{*}) = -a\ln\frac{a(1 - p)}{p(1 - a)} + \ln\frac{1 - p}{1 - a} = -a\ln\frac{a}{p} - (1 - a)\ln\frac{1 - a}{1 - p} = -D(a, p).$$

    $$\boxed{\text{la meilleure majoration est } \mathrm{P}\Big(\frac{S_{n}}{n} \geqslant a\Big) \leqslant \mathrm{e}^{-nD(a, p)}}$$

    **3.** Pour $t \in [q\,,r]$, la décomposition en éléments simples (chapitre 13) donne 
    $$\frac{r - t}{t(1 - t)} = \frac{r}{t} + \frac{r - 1}{1 - t},$$
     ce que l'on vérifie en réduisant au même dénominateur : $r(1 - t) + (r - 1)t = r - t$. Comme $0 < q \leqslant t \leqslant r < 1$, 
    $$\int_{q}^{r} \frac{r - t}{t(1 - t)}\,\mathrm{d} t = r\ln\frac{r}{q} + (r - 1)\big[-\ln(1 - t)\big]_{q}^{r} = r\ln\frac{r}{q} + (1 - r)\ln\frac{1 - r}{1 - q},$$

    $$\boxed{D(r, q) = \int_{q}^{r} \frac{r - t}{t(1 - t)}\,\mathrm{d} t}$$
     Pour $t \in [q\,,r]$, on a $0 < t(1 - t) \leqslant \frac{1}{4}$ et $r - t \geqslant 0$, donc $\frac{r - t}{t(1 - t)} \geqslant 4(r - t)$. Par croissance de l'intégrale (chapitre 18), les bornes étant dans l'ordre croissant, 
    $$\boxed{D(r, q) \geqslant 4\int_{q}^{r} (r - t)\,\mathrm{d} t = 2(r - q)^{2}}$$

    **4.** Soit $\varepsilon > 0$ et $a = p + \varepsilon$. Montrons d'abord que $\mathrm{P}\big(\frac{S_{n}}{n} - p \geqslant \varepsilon\big) \leqslant \mathrm{e}^{-2n\varepsilon^{2}}$.

    • Si $a > 1$, l'événement est impossible, puisque $S_{n} \leqslant n$.

    • Si $a < 1$, les questions 2 et 3, avec $r = a$ et $q = p$, donnent $\mathrm{e}^{-nD(a, p)} \leqslant \mathrm{e}^{-2n\varepsilon^{2}}$.

    • Si $a = 1$, l'événement est $(S_{n} = n)$, de probabilité $p^{n} = \mathrm{e}^{-n\ln(1/p)}$, et le calcul de la question 3 avec $r = 1$ s'applique encore : $\ln\frac{1}{p} = \int_{p}^{1} \frac{\mathrm{d} t}{t} \geqslant \int_{p}^{1} 4(1 - t)\,\mathrm{d} t = 2(1 - p)^{2}$, puisque $\frac{1}{t} = \frac{1 - t}{t(1 - t)} \geqslant 4(1 - t)$.

    Pour l'autre côté, la variable $n - S_{n}$ suit la loi $\mathcal{B}(n,1 - p)$, puisque 
    $$\mathrm{P}(n - S_{n} = k) = \mathrm{P}(S_{n} = n - k) = \binom{n}{k}(1 - p)^{k}p^{n-k}.$$
     Le résultat précédent, qui ne dépend que de la loi, appliqué à $n - S_{n}$ et au paramètre $1 - p$, donne 
    $$\mathrm{P}\Big(\frac{S_{n}}{n} - p \leqslant -\varepsilon\Big) = \mathrm{P}\Big(\frac{n - S_{n}}{n} - (1 - p) \geqslant \varepsilon\Big) \leqslant \mathrm{e}^{-2n\varepsilon^{2}}.$$
     L'événement $\big(\big|\frac{S_{n}}{n} - p\big| \geqslant \varepsilon\big)$ est la réunion des deux, et la sous-additivité conclut : 
    $$\boxed{\mathrm{P}\Big(\Big|\frac{S_{n}}{n} - p\Big| \geqslant \varepsilon\Big) \leqslant 2\,\mathrm{e}^{-2n\varepsilon^{2}}}$$
     Pour $p = \frac{1}{2}$, c'est exactement la proposition 24, obtenue ici sans la majoration du cosinus hyperbolique, et le résultat vaut maintenant pour tout $p$. La forme intermédiaire $\mathrm{e}^{-nD(a, p)}$ est même bien meilleure loin de $\frac{1}{2}$, où $t(1 - t)$ est petit devant $\frac{1}{4}$. Pour $n = 1\,000$, $p = 0{,}1$ et $\varepsilon = 0{,}05$, la probabilité exacte vaut environ $4{,}5 \times 10^{-7}$ ; la somme des deux majorants $\mathrm{e}^{-nD}$ vaut environ $4{,}9 \times 10^{-6}$, la borne $2\,\mathrm{e}^{-2n\varepsilon^{2}}$ environ $0{,}013$, et la borne $\frac{p(1 - p)}{n\varepsilon^{2}}$ du théorème 16 vaut $0{,}036$ ✓.

    *À retenir.* La méthode est celle de la proposition 24 : l'inégalité de Markov appliquée à $\mathrm{e}^{sS_{n}}$, puis l'optimisation en $s$. Le choix de l'exponentielle transforme la somme de variables indépendantes en produit, dont l'espérance se calcule par la proposition 20 ou, comme ici, par la formule du binôme.
- id: "ma-21-102"
  feuille: "f-ma-21"
  numero: 102
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [applications et dénombrement, probabilités, indépendance, variables aléatoires, espérance, variance, inégalités de concentration]
  noeuds: [r-injections, p-espace, p-independance, p-variables, p-esperance]
  notions: [probabilite, independance, variable-aleatoire, esperance, variance]
  page_enonce: 25
  page_corrige: 95
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. Les variables aléatoires sont réelles et définies sur un espace probabilisé fini.

    **1.** Deux événements incompatibles, de probabilités strictement positives, ne sont jamais indépendants.

    **2.** Si trois événements sont deux à deux indépendants, ils sont mutuellement indépendants.

    **3.** Si $X$ et $Y$ ont la même loi, alors $X^{2}$ et $Y^{2}$ ont la même loi, et $\mathrm{E}(X^{3}) = \mathrm{E}(Y^{3})$.

    **4.** Si $X$ et $Y$ ont la même loi, alors $X + Y$ et $2X$ ont la même loi.

    **5.** Si $\mathrm{E}(XY) = \mathrm{E}(X)\,\mathrm{E}(Y)$, alors $X$ et $Y$ sont indépendantes.

    **6.** Pour toutes variables aléatoires $X$ et $Y$, on a $\mathrm{V}(X + Y) = \mathrm{V}(X) + \mathrm{V}(Y)$.

    **7.** Si $X$ et $Y$ sont indépendantes, de lois $\mathcal{B}(n,p)$ et $\mathcal{B}(m,p)$, alors $X + Y$ suit la loi $\mathcal{B}(n + m,p)$.

    **8.** Si $A$ et $B$ sont deux événements tels que $\mathrm{P}(A \cap B) > 0$, alors $\mathrm{P}_{B}(A) = \mathrm{P}_{A}(B)$ si et seulement si $\mathrm{P}(A) = \mathrm{P}(B)$.

    **9.** Il existe une variable aléatoire $X$, d'espérance nulle et de variance $1$, telle que $\mathrm{P}\big(|X| \geqslant 2\big) = \frac{1}{4}$ ; l'inégalité de Bienaymé-Tchebychev ne peut donc pas être améliorée sans autre hypothèse.

    **10.** Il y a plus de surjections de $\llbracket 1\,,5 \rrbracket$ sur $\llbracket 1\,,3 \rrbracket$ que d'injections de $\llbracket 1\,,3 \rrbracket$ dans $\llbracket 1\,,5 \rrbracket$.
  corrige: |
    **1. Vrai.** Si $A$ et $B$ sont incompatibles, $\mathrm{P}(A \cap B) = \mathrm{P}(\varnothing) = 0 < \mathrm{P}(A)\,\mathrm{P}(B)$. C'est la première remarque qui suit la proposition 10 : savoir que l'un est réalisé apprend que l'autre ne l'est pas.

    **2. Faux.** On lance deux pièces équilibrées, avec $\Omega = \{P, F\}^{2}$ muni de la probabilité uniforme ; $A$ est « la première donne pile », $B$ « la seconde donne pile », $C$ « les deux donnent le même côté ». Chacun a la probabilité $\frac{1}{2}$, chaque intersection de deux d'entre eux est réduite à $\{(P, P)\}$, de probabilité $\frac{1}{4}$ : ils sont deux à deux indépendants. Mais $\mathrm{P}(A \cap B \cap C) = \frac{1}{4} \neq \frac{1}{8}$. C'est le second exemple qui suit la proposition 10.

    **3. Vrai.** Si $X \sim Y$, alors $X^{2} \sim Y^{2}$ par la proposition 13 avec $f(x) = x^{2}$. La formule de transfert exprime $\mathrm{E}(X^{3}) = \sum_{x} x^{3}\,\mathrm{P}(X = x)$ à l'aide de la seule loi de $X$, donc $\mathrm{E}(X^{3}) = \mathrm{E}(Y^{3})$.

    **4. Faux.** Soit $D$ le résultat d'un dé équilibré, $X = D$ et $Y = 7 - D$. Les variables $X$ et $Y$ suivent la loi uniforme sur $\llbracket 1\,,6 \rrbracket$, mais $X + Y = 7$ est constante alors que $2X$ prend six valeurs. C'est la remarque qui suit la proposition 13.

    **5. Faux.** Soit $X$ de loi uniforme sur $\{-1, 0, 1\}$ et $Y = X^{2}$. Alors 
    $$\mathrm{E}(XY) = \mathrm{E}(X^{3}) = 0 = \mathrm{E}(X)\,\mathrm{E}(Y), \qquad\text{mais}\qquad \mathrm{P}(X = 0, Y = 1) = 0 \neq \mathrm{P}(X = 0)\,\mathrm{P}(Y = 1) = \frac{2}{9}.$$
     C'est la remarque qui suit la proposition 20 : la relation $\mathrm{E}(XY) = \mathrm{E}(X)\mathrm{E}(Y)$ exprime seulement la décorrélation.

    **6. Faux.** Soit $X$ de loi $\mathcal{B}(\frac{1}{2})$ et $Y = X$. Alors $\mathrm{V}(X + Y) = \mathrm{V}(2X) = 4\mathrm{V}(X) = 1$, alors que $\mathrm{V}(X) + \mathrm{V}(Y) = \frac{1}{2}$. Le théorème 13 exige que les variables soient deux à deux décorrélées.

    **7. Vrai.** Par l'indépendance et la proposition 15, la loi du couple $(X, Y)$ est le produit de ses lois marginales ; elle ne dépend que des lois $\mathcal{B}(n,p)$ et $\mathcal{B}(m,p)$, et la loi de $X + Y$ aussi (proposition 13). Il suffit donc de la calculer sur un modèle commode. La proposition 17 fournit des variables $B_{1}$, …, $B_{n+m}$ mutuellement indépendantes de loi $\mathcal{B}(p)$ ; les sommes $U = B_{1} + \cdots + B_{n}$ et $W = B_{n+1} + \cdots + B_{n+m}$ suivent les lois $\mathcal{B}(n,p)$ et $\mathcal{B}(m,p)$ (théorème 8) et sont indépendantes (théorème 7). Le couple $(U, W)$ a donc même loi que $(X, Y)$, et $X + Y$ a même loi que $U + W = B_{1} + \cdots + B_{n+m}$, qui suit la loi $\mathcal{B}(n + m,p)$ par le théorème 8. On peut aussi calculer directement, avec la formule de Vandermonde de la remarque qui suit la proposition 4 : 
    $$\mathrm{P}(X + Y = k) = \sum_{j} \binom{n}{j}\binom{m}{k - j}p^{k}(1 - p)^{n+m-k} = \binom{n + m}{k}p^{k}(1 - p)^{n+m-k}.$$

    **8. Vrai.** Comme $A \cap B \subset A$ et $A \cap B \subset B$, la croissance donne $\mathrm{P}(A) > 0$ et $\mathrm{P}(B) > 0$ : les deux probabilités conditionnelles sont définies. Alors 
    $$\mathrm{P}_{B}(A) = \mathrm{P}_{A}(B) \iff \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(B)} = \frac{\mathrm{P}(A \cap B)}{\mathrm{P}(A)} \iff \mathrm{P}(A) = \mathrm{P}(B),$$
     la dernière équivalence venant de $\mathrm{P}(A \cap B) \neq 0$. Sans cette hypothèse, l'équivalence tombe : deux événements incompatibles de probabilités $\frac{1}{3}$ et $\frac{1}{2}$ vérifient $\mathrm{P}_{B}(A) = \mathrm{P}_{A}(B) = 0$.

    **9. Vrai.** Soit $X$ une variable qui prend les valeurs $-2$, $0$ et $2$ avec les probabilités $\frac{1}{8}$, $\frac{3}{4}$ et $\frac{1}{8}$. Alors 
    $$\mathrm{E}(X) = 0, \qquad \mathrm{V}(X) = \mathrm{E}(X^{2}) = 4 \times \frac{1}{4} = 1, \qquad \mathrm{P}\big(|X| \geqslant 2\big) = \frac{1}{4} = \frac{\mathrm{V}(X)}{2^{2}}.$$
     L'inégalité de Bienaymé-Tchebychev est une égalité pour cette variable : aucune majoration de la probabilité d'un écart à la moyenne au moins égal à $\varepsilon$, qui ne dépendrait que de la variance et de $\varepsilon$, ne peut être meilleure.

    **10. Vrai.** Par la proposition 6 pour les surjections de $\llbracket 1\,,5 \rrbracket$ sur $\llbracket 1\,,3 \rrbracket$, et par le théorème 1 pour les injections de $\llbracket 1\,,3 \rrbracket$ dans $\llbracket 1\,,5 \rrbracket$, ces nombres valent respectivement 
    $$3^{5} - 3 \times 2^{5} + 3 \times 1^{5} = 243 - 96 + 3 = 150 \qquad\text{et}\qquad A_{5}^{3} = 5 \times 4 \times 3 = 60.$$

    $$\boxed{\text{Vrai : } 1, 3, 7, 8, 9, 10 ; \qquad \text{Faux : } 2, 4, 5, 6}$$
     *Piège.* Les assertions 4, 5 et 6 commettent la même faute : elles traitent des variables comme si leurs lois suffisaient à tout décrire. Or $X + Y$, $\mathrm{E}(XY)$ et $\mathrm{V}(X + Y)$ dépendent de la loi *conjointe* du couple, que les lois marginales ne déterminent pas ; l'indépendance est précisément l'hypothèse qui fait de la loi conjointe le produit des marginales (proposition 15), et c'est elle qui rend vraie l'assertion 7.
- id: "ma-21-103"
  feuille: "f-ma-21"
  numero: 103
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [probabilités, indépendance, variables aléatoires, loi uniforme]
  noeuds: [p-espace, p-independance, p-variables]
  notions: [probabilite, independance, variable-aleatoire]
  page_enonce: 25
  page_corrige: 96
  enonce: |
    *L'indicatrice d'Euler par les probabilités.* Pour $n \geqslant 1$, on note $\varphi(n)$ le nombre d'entiers de $\llbracket 1\,,n \rrbracket$ premiers avec $n$. Soit $n \geqslant 2$, de diviseurs premiers $p_{1}$, …, $p_{r}$. On choisit un entier $x$ au hasard dans $\llbracket 1\,,n \rrbracket$, selon la loi uniforme ; pour $m \in \llbracket 1\,,n \rrbracket$, on note $A_{m}$ l'événement « $m$ divise $x$ », et $B$ l'événement « $x$ est premier avec $n$ ».

    **1.** Exprimer $B$ à l'aide des événements $A_{p_{1}}$, …, $A_{p_{r}}$.

    **2.** Calculer $\mathrm{P}(A_{m})$ lorsque $m$ divise $n$.

    **3.** Montrer que les événements $A_{p_{1}}$, …, $A_{p_{r}}$ sont mutuellement indépendants. Le premier exemple du cours qui suit la proposition 10 traitait le cas $n = 60$.

    **4.** En déduire $\mathrm{P}(B)$, puis la formule 
    $$\varphi(n) = n\prod_{k=1}^{r} \Big(1 - \frac{1}{p_{k}}\Big).$$

    **5.** Que vaut $\varphi(n)$ lorsque $n$ est un nombre premier, ou une puissance d'un nombre premier ? Retrouver directement ces valeurs.
  corrige: |
    L'univers est $\llbracket 1\,,n \rrbracket$, muni de la probabilité uniforme : $\mathrm{P}(E) = \frac{|E|}{n}$ pour toute partie $E$.

    **1.** D'après le chapitre 12, $x$ et $n$ ne sont pas premiers entre eux si et seulement s'ils ont un diviseur premier commun, c'est-à-dire si et seulement si l'un des $p_{k}$ divise $x$, puisque les diviseurs premiers de $n$ sont exactement $p_{1}$, …, $p_{r}$. Ainsi 
    $$\boxed{B = \bigcap_{k=1}^{r} \overline{A_{p_{k}}}}$$

    **2.** Si $m$ divise $n$, les multiples de $m$ dans $\llbracket 1\,,n \rrbracket$ sont $m$, $2m$, …, $\frac{n}{m}\,m$ ; il y en a $\frac{n}{m}$, et 
    $$\boxed{\mathrm{P}(A_{m}) = \frac{1}{m}}$$

    **3.** Soit $J$ une partie non vide de $\llbracket 1\,,r \rrbracket$ et $m_{J} = \prod_{k \in J} p_{k}$. Les $p_{k}$ étant des nombres premiers distincts, donc premiers entre eux deux à deux, un entier est divisible par chacun d'eux si et seulement s'il est divisible par leur produit (chapitre 12). Ainsi $\bigcap_{k \in J} A_{p_{k}} = A_{m_{J}}$, et $m_{J}$ divise $n$ ; la question 2 donne 
    $$\mathrm{P}\Big(\bigcap_{k \in J} A_{p_{k}}\Big) = \frac{1}{m_{J}} = \prod_{k \in J} \frac{1}{p_{k}} = \prod_{k \in J} \mathrm{P}(A_{p_{k}}).$$

    $$\boxed{A_{p_{1}}, \dots, A_{p_{r}} \text{ sont mutuellement indépendants}}$$
     Pour $n = 60 = 2^{2} \times 3 \times 5$, on retrouve l'exemple du cours. L'hypothèse que les $p_{k}$ divisent $n$ est essentielle : sur $\llbracket 1\,,100 \rrbracket$, le cours a montré que $A_{2}$ et $A_{3}$ ne sont pas indépendants, puisque $\mathrm{P}(A_{2} \cap A_{3}) = \mathrm{P}(A_{6}) = \frac{16}{100}$ diffère de $\mathrm{P}(A_{2})\,\mathrm{P}(A_{3}) = \frac{50}{100} \times \frac{33}{100}$.

    **4.** Par la proposition 10 (iii), les contraires $\overline{A_{p_{1}}}$, …, $\overline{A_{p_{r}}}$ sont mutuellement indépendants, de probabilités $1 - \frac{1}{p_{k}}$. La question 1 donne 
    $$\boxed{\mathrm{P}(B) = \prod_{k=1}^{r} \Big(1 - \frac{1}{p_{k}}\Big)}$$
     et, comme $\mathrm{P}(B) = \frac{|B|}{n} = \frac{\varphi(n)}{n}$, 
    $$\boxed{\varphi(n) = n\prod_{k=1}^{r} \Big(1 - \frac{1}{p_{k}}\Big)}$$
     Pour $n = 60$, on trouve $\varphi(60) = 60 \times \frac{1}{2} \times \frac{2}{3} \times \frac{4}{5} = 16$, et la formule a été contrôlée pour $2 \leqslant n \leqslant 300$ ✓.

    **5.** Si $n = p$ est premier, $r = 1$ et $\boxed{\varphi(p) = p - 1}$ : directement, les entiers $1$, …, $p - 1$ sont premiers avec $p$, et $p$ ne l'est pas. Si $n = p^{\alpha}$ avec $\alpha \geqslant 1$, on a encore $r = 1$, et 
    $$\boxed{\varphi(p^{\alpha}) = p^{\alpha}\Big(1 - \frac{1}{p}\Big) = p^{\alpha} - p^{\alpha - 1}}$$
     Directement, un entier n'est pas premier avec $p^{\alpha}$ si et seulement s'il est multiple de $p$, et il y a $p^{\alpha - 1}$ multiples de $p$ dans $\llbracket 1\,,p^{\alpha} \rrbracket$.

    *À retenir.* Une formule d'arithmétique devient une conséquence de l'indépendance : être divisible par $2$ et être divisible par $3$ sont deux « informations indépendantes » sur un entier tiré au hasard dans $\llbracket 1\,,n \rrbracket$, dès que $6$ divise $n$. La formule montre aussi que $\varphi(ab) = \varphi(a)\varphi(b)$ lorsque $a$ et $b$ sont premiers entre eux, puisque les diviseurs premiers de $ab$ sont alors ceux de $a$ et ceux de $b$, sans répétition. La fonction $\varphi$ intervenait déjà dans l'exercice 62 de la feuille du chapitre 20.
- id: "ma-21-104"
  feuille: "f-ma-21"
  numero: 104
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [probabilités conditionnelles, variables aléatoires, espérance]
  noeuds: [p-independance, p-variables, p-esperance]
  notions: [probabilite-conditionnelle, variable-aleatoire, esperance]
  page_enonce: 25
  page_corrige: 97
  enonce: |
    *Faut-il changer d'avis ?* Dans un jeu, $g$ numéros parmi $n$ sont gagnants ; ils sont choisis à l'avance par le meneur de jeu, qui est seul à les connaître, et l'on suppose $1 \leqslant g \leqslant \frac{n}{3}$. Dans une première phase, le joueur tire $g$ numéros au hasard ; le meneur dévoile alors $g$ numéros perdants, choisis au hasard parmi les numéros perdants que le joueur n'a pas tirés. Dans une seconde phase, le joueur a le choix entre deux stratégies : garder les $g$ numéros qu'il a tirés, ou les échanger contre $g$ numéros tirés au hasard parmi les $n - 2g$ numéros qui n'ont été ni tirés ni dévoilés.

    **1.** On note $G_{1}$ le nombre de numéros gagnants obtenus à l'issue de la première phase. Déterminer la loi de $G_{1}$ et son espérance, à l'aide de l'exercice 89.

    **2.** On suppose que le joueur adopte la seconde stratégie, et l'on note $G_{2}$ le nombre de numéros gagnants qu'il obtient à la fin du jeu.

    **(a)** Soit $k \in \llbracket 0\,,g \rrbracket$. Justifier que le meneur peut toujours dévoiler $g$ numéros perdants, et déterminer la loi conditionnelle de $G_{2}$ sachant $(G_{1} = k)$.

    **(b)** On note $E_{k}$ la moyenne de cette loi conditionnelle, c'est-à-dire $E_{k} = \sum_{j} j\,\mathrm{P}_{(G_{1} = k)}(G_{2} = j)$. Calculer $E_{k}$, puis montrer que $\mathrm{E}(G_{2}) = \sum_{k=0}^{g} E_{k}\,\mathrm{P}(G_{1} = k)$.

    **(c)** En déduire que $\mathrm{E}(G_{2}) = \dfrac{g^{2}(n - g)}{n(n - 2g)}$.

    **3.** Comparer les deux stratégies. Que donne le cas $n = 3$ et $g = 1$, connu sous le nom de problème de Monty Hall ?
  corrige: |
    *Le modèle.* On note $W$ l'ensemble des $g$ numéros gagnants, fixé, et l'on décrit le jeu par trois parties aléatoires de $\llbracket 1\,,n \rrbracket$ à $g$ éléments : $T$, tirée par le joueur ; $R$, dévoilée par le meneur ; $T'$, tirée dans la seconde phase. Comme pour les tirages successifs de l'exemple qui suit la proposition 9, l'énoncé fixe les probabilités conditionnelles :

    • $T$ suit la loi uniforme sur les parties à $g$ éléments de $\llbracket 1\,,n \rrbracket$ ;

    • sachant $(T = t)$, $R$ suit la loi uniforme sur les parties à $g$ éléments de l'ensemble $L_{t}$ des numéros perdants non tirés ;

    • sachant $(T = t) \cap (R = \rho)$, $T'$ suit la loi uniforme sur les parties à $g$ éléments de $\llbracket 1\,,n \rrbracket \setminus (t \cup \rho)$.

    La formule des probabilités composées (proposition 9) donne alors la probabilité de chaque triplet $(t, \rho, t')$. On pose $G_{1} = |T \cap W|$ et $G_{2} = |T' \cap W|$.

    **1.** Le tirage de $T$ est celui de l'exercice 89, avec $n$ boules, dont $g$ « blanches », les numéros gagnants, et $g$ boules tirées ; l'hypothèse $1 \leqslant g \leqslant n - 1$ de cet exercice est satisfaite, puisque $g \leqslant \frac{n}{3}$. Donc 
    $$\boxed{\mathrm{P}(G_{1} = k) = \frac{\dbinom{g}{k}\dbinom{n - g}{g - k}}{\dbinom{n}{g}} \ \ (0 \leqslant k \leqslant g), \qquad \mathrm{E}(G_{1}) = g \times \frac{g}{n} = \frac{g^{2}}{n}}$$
     Toutes ces probabilités sont strictement positives, puisque $n - g \geqslant g \geqslant g - k$.

    **2.(a)** Soit $t$ une partie à $g$ éléments telle que $|t \cap W| = k$. Parmi les $n - g$ numéros perdants, $g - k$ ont été tirés, donc 
    $$|L_{t}| = n - g - (g - k) = n - 2g + k \geqslant n - 2g \geqslant g,$$
     puisque $n \geqslant 3g$ : le meneur peut toujours dévoiler $g$ numéros perdants. Soit $\rho \subset L_{t}$ à $g$ éléments. L'ensemble $\llbracket 1\,,n \rrbracket \setminus (t \cup \rho)$ a $n - 2g$ éléments ; il contient les $g - k$ numéros gagnants non tirés, puisque $\rho$ ne contient que des perdants, et $n - 3g + k$ numéros perdants. Le nombre de ses parties à $g$ éléments contenant exactement $j$ gagnants est $\binom{g - k}{j}\binom{n - 3g + k}{g - j}$ (théorème 2 et lemme des bergers), d'où 
    $$\mathrm{P}\big(G_{2} = j \mid (T = t) \cap (R = \rho)\big) = h_{k}(j) = \frac{\dbinom{g - k}{j}\dbinom{n - 3g + k}{g - j}}{\dbinom{n - 2g}{g}}.$$
     Ce nombre ne dépend que de $k$. L'événement $(G_{1} = k)$ est la réunion disjointe des événements $(T = t) \cap (R = \rho)$, pour les couples tels que $|t \cap W| = k$ ; en sommant, 
    $$\mathrm{P}(G_{1} = k, G_{2} = j) = \sum_{(t, \rho)} \mathrm{P}\big((T = t) \cap (R = \rho)\big)\,h_{k}(j) = \mathrm{P}(G_{1} = k)\,h_{k}(j),$$

    $$\boxed{\mathrm{P}_{(G_{1} = k)}(G_{2} = j) = \frac{\dbinom{g - k}{j}\dbinom{n - 3g + k}{g - j}}{\dbinom{n - 2g}{g}}, \qquad 0 \leqslant j \leqslant g - k}$$
     C'est la loi de l'exercice 89, avec $n - 2g$ boules, dont $g - k$ blanches, et $g$ boules tirées.

    **2.(b)** Pour une urne de $N$ boules dont $w$ blanches, dont on tire $s$ boules, la formule du pion $j\binom{w}{j} = w\binom{w - 1}{j - 1}$ (chapitre 3, proposition 9) et la formule de Vandermonde donnent 
    $$\sum_{j} j\binom{w}{j}\binom{N - w}{s - j} = w\sum_{j} \binom{w - 1}{j - 1}\binom{N - w}{s - j} = w\binom{N - 1}{s - 1} = \frac{sw}{N}\binom{N}{s},$$
     ce qui redonne la moyenne $\frac{sw}{N}$ de l'exercice 89, y compris dans les cas extrêmes $w = 0$ et $w = N$. Avec $N = n - 2g$, $w = g - k$ et $s = g$, 
    $$\boxed{E_{k} = \frac{g(g - k)}{n - 2g}}$$
     Les événements $(G_{1} = k)$, pour $k \in \llbracket 0\,,g \rrbracket$, forment un système complet d'événements de probabilités non nulles. Par la formule des probabilités totales (théorème 5), puis en échangeant les deux sommes finies, 
    $$\begin{aligned} \mathrm{E}(G_{2}) = \sum_{j} j\,\mathrm{P}(G_{2} = j) &= \sum_{j} j\sum_{k=0}^{g} \mathrm{P}(G_{1} = k)\,\mathrm{P}_{(G_{1} = k)}(G_{2} = j) \\ &= \sum_{k=0}^{g} \mathrm{P}(G_{1} = k)\sum_{j} j\,\mathrm{P}_{(G_{1} = k)}(G_{2} = j), \end{aligned}$$

    $$\boxed{\mathrm{E}(G_{2}) = \sum_{k=0}^{g} E_{k}\,\mathrm{P}(G_{1} = k)}$$

    **2.(c)** Comme $E_{k}$ est une fonction affine de $k$, la linéarité de l'espérance, sous la forme de la formule de transfert, donne 
    $$\mathrm{E}(G_{2}) = \frac{g}{n - 2g}\sum_{k=0}^{g} (g - k)\,\mathrm{P}(G_{1} = k) = \frac{g}{n - 2g}\big(g - \mathrm{E}(G_{1})\big) = \frac{g}{n - 2g}\Big(g - \frac{g^{2}}{n}\Big),$$

    $$\boxed{\mathrm{E}(G_{2}) = \frac{g^{2}(n - g)}{n(n - 2g)}}$$
     Les formules de $\mathrm{E}(G_{1})$ et $\mathrm{E}(G_{2})$ ont été vérifiées exactement, par énumération de tous les déroulements du jeu, pour plusieurs couples $(n, g)$ ✓.

    **3.** Le rapport des deux espérances vaut 
    $$\frac{\mathrm{E}(G_{2})}{\mathrm{E}(G_{1})} = \frac{n - g}{n - 2g} > 1 :$$
     *il faut changer*. Pour $n = 3$ et $g = 1$, on a $\mathrm{E}(G_{1}) = \frac{1}{3}$ et $\boxed{\mathrm{E}(G_{2}) = \frac{2}{3}}$. Comme $G_{1}$ et $G_{2}$ ne prennent que les valeurs $0$ et $1$, ce sont les probabilités de gagner : changer de porte double les chances. L'arbre suivant décrit ce cas.

    ![Figure](documents/figures/7faba3ec2ce2e70c.svg)

    Si le joueur a d'abord choisi la bonne porte, ce qui arrive une fois sur trois, changer le fait perdre ; sinon, le meneur, qui doit ouvrir une porte perdante, ouvre la seule qui reste, et changer fait gagner à coup sûr.

    *Piège.* L'erreur la plus répandue est de dire qu'« il reste deux portes, donc une chance sur deux pour chacune ». Le choix du meneur n'est pas indépendant de celui du joueur : il ne dévoile jamais un gagnant ni un numéro tiré. C'est cette information qui rend la réserve des $n - 2g$ numéros restants plus riche en gagnants que l'urne de départ ; le gain relatif, $\frac{n - g}{n - 2g}$, est d'autant plus grand que $g$ est proche de $\frac{n}{3}$.
