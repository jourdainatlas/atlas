    On tire quatre cartes d'un jeu de $52$ cartes, qui comporte treize cartes de chacune des quatre couleurs. Calculer la probabilité d'obtenir exactement deux trèfles et deux piques, lorsque les quatre cartes sont tirées simultanément, puis successivement sans remise, puis successivement avec remise. Pourquoi les deux premiers résultats sont-ils égaux ?
  corrige: |
    On note $T$ l'événement « exactement deux trèfles et deux piques ». Dans les trois cas, l'univers est muni de la probabilité uniforme.

    *Tirage simultané.* L'univers est l'ensemble des parties à $4$ éléments du jeu, qui en compte $\binom{52}{4}$, soit $270\,725$. Une main favorable est formée de deux des treize trèfles et de deux des treize piques : 
    $$\mathrm{P}(T) = \frac{\dbinom{13}{2}^{2}}{\dbinom{52}{4}} = \frac{6\,084}{270\,725}, \qquad \boxed{\mathrm{P}(T) = \frac{468}{20\,825} \approx 0{,}0225}$$

    *Tirage successif sans remise.* L'univers est l'ensemble des $4$-listes de cartes distinctes, de cardinal $A_{52}^{4} = 6\,497\,400$ (théorème 1). On choisit les deux rangs des trèfles, de $\binom{4}{2} = 6$ façons, puis la liste ordonnée des deux trèfles, de $13 \times 12$ façons, et celle des deux piques, de $13 \times 12$ façons : 
    $$\boxed{\mathrm{P}(T) = \frac{6 \times 156^{2}}{A_{52}^{4}} = \frac{146\,016}{6\,497\,400} = \frac{468}{20\,825}}$$

    *Tirage successif avec remise.* L'univers est l'ensemble des $4$-listes de cartes, de cardinal $52^{4}$ (proposition 3). On choisit les rangs des trèfles, puis chacune des quatre cartes dans sa couleur : 
    $$\boxed{\mathrm{P}(T) = \frac{6 \times 13^{4}}{52^{4}} = \frac{6}{4^{4}} = \frac{3}{128} \approx 0{,}0234}$$

    *Pourquoi les deux premiers résultats sont égaux.* L'application qui oublie l'ordre envoie chaque $4$-liste de cartes distinctes sur la partie formée de ses termes, et chaque partie est l'image de exactement $4! = 24$ listes : c'est l'argument du lemme des bergers dans la démonstration du théorème 2. Elle envoie les listes favorables sur les mains favorables, puisque l'événement $T$ ne dépend pas de l'ordre. Les cas favorables et les cas possibles sont donc tous deux multipliés par $24$ : $146\,016 = 24 \times 6\,084$ et $6\,497\,400 = 24 \times 270\,725$ ✓. Avec remise, les tirages ne sont plus équivalents : une carte peut sortir deux fois, et les couleurs ne s'épuisent pas, ce qui rend $T$ un peu plus probable.

    *À retenir.* Pour un événement qui ne dépend pas de l'ordre, on peut toujours choisir le modèle ordonné ou le modèle non ordonné, à condition de rester cohérent : compter les cas favorables avec ordre et les cas possibles sans ordre est l'erreur la plus répandue, et donne ici un résultat $24$ fois trop grand.
