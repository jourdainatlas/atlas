  enonce: |
    *Surréservation.* Un avion compte $150$ places. Chaque personne qui a acheté un billet se présente à l'embarquement avec la probabilité $p = 0{,}75$, indépendamment des autres. La compagnie vend $n$ billets, avec $150 < n$ et $np < 150$, et note $S_{n}$ le nombre de personnes qui se présentent.

    **1.** Quelle est la loi de $S_{n}$ ?

    **2.** Montrer que $\mathrm{P}(S_{n} \geqslant 150) \leqslant \dfrac{np(1 - p)}{(150 - np)^{2}}$, en remarquant que l'événement $(S_{n} \geqslant 150)$ est inclus dans $\big(|S_{n} - np| \geqslant 150 - np\big)$.

    **3.** Résoudre sur $\left]0\,,150\right[$ l'inéquation $\dfrac{x(1 - p)}{(150 - x)^{2}} \leqslant 0{,}05$.

    **4.** Combien de billets la compagnie peut-elle vendre en étant sûre, par cette majoration, que la probabilité que plus de $150$ personnes se présentent soit au plus $0{,}05$ ? Calculer, à l'aide d'un programme Python, la probabilité exacte correspondante, et commenter.
  corrige: |
    **1.** On note $B_{i}$ l'indicatrice de l'événement « la personne $i$ se présente », pour $i \in \llbracket 1\,,n \rrbracket$. L'énoncé dit que $B_{1}$, …, $B_{n}$ sont mutuellement indépendantes, de loi $\mathcal{B}(p)$ ; leur somme $S_{n}$ suit donc la loi binomiale (théorème 8) : 
    $$\boxed{S_{n} \sim \mathcal{B}(n,0{,}75)}$$

    **2.** Par les propositions 19 et 21, $\mathrm{E}(S_{n}) = np$ et $\mathrm{V}(S_{n}) = np(1 - p)$. Si $S_{n} \geqslant 150$, alors 
    $$S_{n} - np \geqslant 150 - np > 0, \qquad\text{donc}\qquad |S_{n} - np| \geqslant 150 - np :$$
     c'est l'inclusion de l'énoncé. Par croissance, puis par l'inégalité de Bienaymé-Tchebychev (théorème 15) avec $\varepsilon = 150 - np > 0$, 
    $$\boxed{\mathrm{P}(S_{n} \geqslant 150) \leqslant \mathrm{P}\big(|S_{n} - np| \geqslant 150 - np\big) \leqslant \frac{np(1 - p)}{(150 - np)^{2}}}$$
     L'hypothèse $np < 150$ est indispensable : sans elle, $\varepsilon$ ne serait pas strictement positif.

    **3.** Sur $\left]0\,,150\right[$, on a $(150 - x)^{2} > 0$ et $1 - p = \frac{1}{4}$ ; l'inéquation équivaut à $\frac{x}{4} \leqslant \frac{(150 - x)^{2}}{20}$, c'est-à-dire à 
    $$x^{2} - 305x + 22\,500 \geqslant 0.$$
     Le discriminant vaut $305^{2} - 90\,000 = 3\,025 = 55^{2}$, et les racines sont $\frac{305 \pm 55}{2}$, soit $125$ et $180$. Le trinôme est positif à l'extérieur des racines : 
    $$\boxed{\text{l'ensemble des solutions dans } \left]0\,,150\right[ \text{ est } \left]0\,,125\right]}$$

    **4.** « Plus de $150$ personnes se présentent » est l'événement $(S_{n} > 150)$, inclus dans $(S_{n} \geqslant 150)$. Par les questions 2 et 3 avec $x = np = \frac{3n}{4}$, la probabilité est au plus $0{,}05$ dès que $\frac{3n}{4} \leqslant 125$, c'est-à-dire $n \leqslant \frac{500}{3} \approx 166{,}7$. La compagnie peut donc vendre 
    $$\boxed{n = 166 \text{ billets}}$$
     et la majoration vaut alors $\frac{124{,}5 \times 0{,}25}{25{,}5^{2}} \approx 0{,}048$. Le programme suivant calcule la probabilité exacte, puis cherche le plus grand nombre de billets pour lequel elle reste au plus $0{,}05$.

    ```python
    from math import comb

    def proba_trop(n, p=0.75, places=150):
        # P(S_n > places) pour S_n de loi B(n, p)
        return sum(comb(n, k) * p**k * (1 - p)**(n - k)
                   for k in range(places + 1, n + 1))

    print(proba_trop(166))          # environ 1.42e-07
    n = 151
    while proba_trop(n + 1) <= 0.05:
        n += 1
    print(n, proba_trop(n), proba_trop(n + 1))
    ```

    On obtient $\mathrm{P}(S_{166} > 150) \approx 1{,}4 \times 10^{-7}$, au lieu du $0{,}05$ garanti, et le plus grand nombre de billets admissible est en réalité $187$, avec $\mathrm{P}(S_{187} > 150) \approx 0{,}039$, alors que $\mathrm{P}(S_{188} > 150) \approx 0{,}052$ ✓.

    *À retenir.* L'inégalité de Bienaymé-Tchebychev ne connaît de la loi que son espérance et sa variance : elle est universelle, donc très pessimiste pour une loi particulière. Ici, elle coûterait à la compagnie $21$ billets. L'exercice 101 montre qu'une inégalité exponentielle, adaptée aux sommes de variables indépendantes, réduit beaucoup cet écart.
