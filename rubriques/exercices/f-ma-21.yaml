  noeuds: [p-independance, p-espace]
  notions: [probabilite-conditionnelle, independance, probabilite]
  page_enonce: 11
  page_corrige: 39
  enonce: |
    **1.** Un paquet contient quatre cartes : les rois de cœur et de carreau, et les dames de cœur et de carreau. On tire successivement, sans remise, deux cartes de ce paquet.

    **(a)** Proposer un espace probabilisé fini qui modélise cette expérience.

    **(b)** Sachant que l'une au moins des deux cartes tirées est une dame, quelle est la probabilité que les deux le soient ?

    **(c)** Sachant que l'une des deux cartes tirées est la dame de cœur, quelle est la probabilité que l'autre soit une dame ?

    **2.** Une de vos connaissances a deux enfants, dont vous ignorez le sexe. Vous la croisez accompagnée de l'un de ses deux enfants, un garçon. Quelle est la probabilité que son autre enfant soit une fille ? On construira un espace probabilisé fini en explicitant les hypothèses de modélisation, et l'on comparera avec l'exemple du cours qui suit la proposition 8.
  corrige: |
    **1. (a)** On note $R_{\heartsuit}$, $R_{\diamondsuit}$, $D_{\heartsuit}$, $D_{\diamondsuit}$ les quatre cartes. On prend pour univers l'ensemble $\Omega$ des $2$-listes de cartes distinctes (première carte, seconde carte), muni de la probabilité uniforme : les tirages successifs au hasard rendent ces $A_{4}^{2} = 12$ issues également probables. 
    $$\boxed{\Omega = \{(c_{1}, c_{2}) \mid c_{1}, c_{2} \in \{R_{\heartsuit}, R_{\diamondsuit}, D_{\heartsuit}, D_{\diamondsuit}\},\ c_{1} \neq c_{2}\}, \qquad |\Omega| = 12, \qquad \mathrm{P} \text{ uniforme}}$$

    **(b)** Soit $U$ l'événement « au moins une dame » et $DD$ l'événement « deux dames ». Le contraire de $U$ est « deux rois », qui contient les $2$ issues $(R_{\heartsuit}, R_{\diamondsuit})$ et $(R_{\diamondsuit}, R_{\heartsuit})$, donc $|U| = 10$ ; l'événement $DD$, inclus dans $U$, contient $2$ issues. Ainsi 
    $$\boxed{\mathrm{P}_{U}(DD) = \frac{|DD \cap U|}{|U|} = \frac{2}{10} = \frac{1}{5}}$$

    **(c)** Soit $H$ l'événement « l'une des deux cartes est la dame de cœur ». Il contient $3$ issues où $D_{\heartsuit}$ sort en premier et $3$ où elle sort en second, soit $6$ issues, dont $2$ réalisent $DD$ : 
    $$\boxed{\mathrm{P}_{H}(DD) = \frac{2}{6} = \frac{1}{3}}$$
     Savoir *quelle* dame a été tirée fait passer la probabilité de $\frac{1}{5}$ à $\frac{1}{3}$ : l'événement $H$ est plus petit que $U$, donc plus informatif, et il élimine davantage d'issues défavorables, ce qui est le phénomène de l'exercice 40. Sachant $H$, l'autre carte est l'une des trois autres cartes, prise au hasard, et une seule est une dame.

    **2.** Les hypothèses de modélisation sont les suivantes : les sexes des deux enfants sont indépendants et chacun vaut G ou F avec la probabilité $\frac{1}{2}$, et l'enfant qui accompagne le parent est choisi au hasard, avec la probabilité $\frac{1}{2}$ pour chacun, indépendamment des sexes. On prend donc 
    $$\Omega = \{G, F\}^{2} \times \{1, 2\},$$
     muni de la probabilité uniforme, une issue $(s_{1}, s_{2}, c)$ donnant les sexes de l'aîné et du cadet et le rang $c$ de l'enfant rencontré. L'événement $V$ « l'enfant rencontré est un garçon » est formé des issues telles que $s_{c} = G$ : 
    $$V = \{(G, G, 1), (G, G, 2), (G, F, 1), (F, G, 2)\}, \qquad \mathrm{P}(V) = \frac{4}{8} = \frac{1}{2}.$$
     Parmi elles, l'autre enfant est une fille pour $(G, F, 1)$ et $(F, G, 2)$ : 
    $$\boxed{\mathrm{P}_{V}(\text{l'autre enfant est une fille}) = \frac{2}{4} = \frac{1}{2}}$$
     Dans l'exemple qui suit la proposition 8, l'information était « la famille compte au moins un garçon », et la probabilité que la famille compte aussi une fille valait $1 - \frac{1}{3} = \frac{2}{3}$. Ici, on a vu un garçon *déterminé*, comme si l'on savait que l'aîné est un garçon ; la probabilité vaut alors $\frac{1}{2}$.

    *Piège.* La réponse dépend de la façon dont l'information a été obtenue, et pas seulement de son contenu apparent : l'erreur la plus répandue est d'oublier de modéliser ce mécanisme. Si l'on suppose au contraire que le parent se montre toujours avec un garçon lorsqu'il en a un, l'événement « on le croise avec un garçon » coïncide avec « au moins un garçon », et la probabilité que l'autre soit une fille redevient $\frac{2}{3}$, valeur confirmée par énumération. Les deux réponses sont justes, chacune dans son modèle.
- id: "ma-21-43"
  feuille: "f-ma-21"
