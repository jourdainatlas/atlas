- id: "l3-hf-07-01"
  feuille: "f-l3-hf-07"
  numero: 1
  partie: "Transformées, convolution"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [transformée et convolution]
  noeuds: [fo-transformee]
  notions: [transformee-fourier, produit-convolution]
  source: "Mathovore, exercices L3, exercice 17"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $a > 0$ et $f = \mathbf{1}_{[-a, a]}$.

    **1.** Calculer $\hat{f}(\xi)$ pour tout $\xi \in \mathbb{R}$.

    **2.** Vérifier que $\hat{f}$ est continue, bornée par $\lVert f \rVert_{1}$, et tend vers $0$ à l'infini.

    **3.** Montrer que $\hat{f}$ n'est pas intégrable sur $\mathbb{R}$. Que peut-on en conclure sur l'image de $L^{1}(\mathbb{R})$ par la transformation de Fourier ?

    **4.** Retrouver la conclusion de la question 3 à l'aide du théorème d'inversion, sans calcul d'intégrale.
  corrige: |
    $\triangleright$ *1.* Pour $\xi \neq 0$, $\hat{f}(\xi) = \mathop{\displaystyle \int_{-a}^{a}} \mathrm{e}^{-\mathrm{i} x\xi} \, \mathrm{d} x = \dfrac{\mathrm{e}^{\mathrm{i} a\xi} - \mathrm{e}^{-\mathrm{i} a\xi}}{\mathrm{i}\xi}$, et $\hat{f}(0) = 2a$ : 
    $$\boxed{\hat{f}(\xi) = \frac{2\sin(a\xi)}{\xi} \quad (\xi \neq 0) , \qquad \hat{f}(0) = 2a .}$$

    $\triangleright$ *2.* La fonction $\dfrac{2\sin(a\xi)}{\xi}$ tend vers $2a$ en $0$ : $\hat{f}$ est continue. Comme $|\sin u| \leq |u|$, $|\hat{f}(\xi)| \leq 2a = \lVert f \rVert_{1}$ ; et $|\hat{f}(\xi)| \leq \dfrac{2}{|\xi|} \to 0$. On retrouve, sur cet exemple, la proposition 3 et le lemme de Riemann-Lebesgue.

    $\triangleright$ *3.* Sur l'intervalle $J_{k} = [\dfrac{k\pi}{a}, \dfrac{(k + 1)\pi}{a}]$, $|\xi| \leq \dfrac{(k + 1)\pi}{a}$ et $\mathop{\displaystyle \int_{J_{k}}} |\sin(a\xi)| \, \mathrm{d}\xi = \dfrac{2}{a}$, d'où 
    $$\int_{J_{k}} \frac{|2\sin(a\xi)|}{|\xi|} \, \mathrm{d}\xi \geq \frac{2a}{(k + 1)\pi} \cdot \frac{2}{a} = \frac{4}{(k + 1)\pi} ,$$
     terme général d'une série divergente : $\hat{f} \notin L^{1}(\mathbb{R})$. La transformation de Fourier n'envoie pas $L^{1}$ dans $L^{1}$ : la formule d'inversion, qui suppose $\hat{f}$ intégrable, ne s'applique pas à toutes les fonctions intégrables.

    $\triangleright$ *4.* Si $\hat{f}$ était intégrable, le théorème d'inversion montrerait que $f$ est égale presque partout à la fonction continue $x \mapsto \dfrac{1}{2\pi}\mathop{\displaystyle \int} \hat{f}(y)\mathrm{e}^{\mathrm{i} xy} \, \mathrm{d} y$. Or $\mathbf{1}_{[-a, a]}$ n'est égale presque partout à aucune fonction continue : une telle fonction vaudrait $1$ sur $]-a, a[$ et $0$ sur $]a, +\infty[$, par densité des points où l'égalité a lieu, ce qui est incompatible avec la continuité en $a$. Une discontinuité de $f$ empêche $\hat{f}$ d'être intégrable.

    1.5em

    ![Figure](documents/figures/4347cff6124bbb9e.svg)

    Pour $a = 1$, $\hat{f}(\xi) = \dfrac{2\sin\xi}{\xi}$ (orange) tend vers $0$ entre les enveloppes $\pm\dfrac{2}{|\xi|}$, mais trop lentement pour être intégrable : l'aire sous $|\hat{f}|$ se comporte comme une série harmonique.
- id: "l3-hf-07-02"
  feuille: "f-l3-hf-07"
  numero: 2
