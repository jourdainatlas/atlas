  enonce: |
    Soit $f \in L^{1}(\mathbb{R})$ telle que $\xi \mapsto \xi \hat{f}(\xi)$ soit intégrable. Montrer que $f$ coïncide presque partout avec une fonction $g$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, que l'on déterminera.
  corrige: |
    La fonction $\hat{f}$ est bornée par $\lVert f \rVert_{1}$, et $|\hat{f}(\xi)| \leq |\xi\hat{f}(\xi)|$ pour $|\xi| \geq 1$ : elle est donc intégrable. Par le théorème d'inversion, $f = g$ presque partout, avec 
    $$g(x) = \frac{1}{2\pi} \int_{\mathbb{R}} \hat{f}(\xi)\mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi .$$
     La dérivée en $x$ de l'intégrande, $\mathrm{i}\xi\hat{f}(\xi)\mathrm{e}^{\mathrm{i} x\xi}$, est majorée en module par $|\xi\hat{f}(\xi)|$, intégrable et indépendante de $x$. Le théorème de dérivation sous l'intégrale montre que $g$ est de classe $\mathcal{C}^{1}$, avec 
    $$\boxed{g'(x) = \frac{\mathrm{i}}{2\pi} \int_{\mathbb{R}} \xi\hat{f}(\xi)\mathrm{e}^{\mathrm{i} x\xi} \, \mathrm{d}\xi .}$$
     C'est la réciproque de la proposition 12 du cours : la décroissance de $\hat{f}$ se traduit par la régularité de $f$.
- id: "l3-hf-07-09"
