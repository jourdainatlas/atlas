  notions: [transformee-fourier, arc-tangente, cosinus-sinus]
  source: "Bordeaux 2015-2016, TD 6, exercice 4 ; TD 4 « Transformation de Fourier », exercice 8"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Un autre élément de $\mathcal{C}_{0}(\mathbb{R})$ qui n'est pas une transformée.** Soit $k(x) = \dfrac{\arctan x}{\ln(2 + x^{2})}$.

    **1.** Montrer que $k \in \mathcal{C}_{0}(\mathbb{R})$.

    **2.** On suppose que $k = \hat{f}$ avec $f \in L^{1}(\mathbb{R})$. Montrer que $f$ est impaire (presque partout).

    **3.** En utilisant la proposition 7 du cours, montrer que $k$ n'est pas la transformée de Fourier d'une fonction intégrable.
  corrige: |
    $\triangleright$ *1.* La fonction $k$ est continue, car $\ln(2 + x^{2}) \geq \ln 2 > 0$, et $|k(x)| \leq \dfrac{\pi/2}{\ln(2 + x^{2})} \to 0$ : $k \in \mathcal{C}_{0}(\mathbb{R})$.

    $\triangleright$ *2.* La fonction $k$ est impaire. Si $k = \hat{f}$, la fonction $\check{f} : x \mapsto f(-x)$ a pour transformée $\xi \mapsto \hat{f}(-\xi) = k(-\xi) = -k(\xi)$ (cours, prop. 4), qui est celle de $-f$. Par injectivité (prop. 10), $\check{f} = -f$ presque partout : $f$ est impaire.

    $\triangleright$ *3.* D'après la proposition 7 du cours (ii), l'intégrale $\mathop{\displaystyle \int_{1}^{+\infty}} [\hat{f}(x) - \hat{f}(-x)] \dfrac{\mathrm{d} x}{x} = 2\mathop{\displaystyle \int_{1}^{+\infty}} \dfrac{k(x)}{x} \, \mathrm{d} x$ serait convergente. Or, pour $x \geq 1$, $\arctan x \geq \dfrac{\pi}{4}$ et $\ln(2 + x^{2}) \leq \ln(3x^{2}) = \ln 3 + 2\ln x$, d'où 
    $$\int_{1}^{Y} \frac{k(x)}{x} \, \mathrm{d} x \geq \frac{\pi}{4} \int_{1}^{Y} \frac{\mathrm{d} x}{x(\ln 3 + 2\ln x)} = \frac{\pi}{8} \ln\Big( \frac{\ln 3 + 2\ln Y}{\ln 3} \Big) \xrightarrow[Y \to +\infty]{} +\infty .$$
     Contradiction : $k$ n'est pas une transformée de Fourier, bien qu'elle soit dans $\mathcal{C}_{0}(\mathbb{R})$. Comme la fonction $h$ du théorème 2, $k$ est impaire et ne décroît qu'en $\dfrac{1}{\ln|x|}$ : c'est cette lenteur, combinée à l'imparité, que la proposition 7 interdit.

    1.5em

    ![Figure](documents/figures/cf0091994bf9d86b.svg)

    La fonction $k$ tend vers $0$, mais si lentement (en $\dfrac{\pi}{4\ln|x|}$) qu'elle vaut encore $0{,}19$ en $x = 60$ : aucune fonction intégrable impaire n'a une transformée aussi lente à décroître.
