  enonce: |
    **1.** À l'aide de la transformation de Fourier, montrer que l'algèbre $L^{1}(\mathbb{R})$ n'a pas d'unité : il n'existe pas de $g \in L^{1}(\mathbb{R})$ telle que $f * g = f$ pour toute $f \in L^{1}(\mathbb{R})$.

    **2.** Résoudre dans $L^{1}(\mathbb{R})$ l'équation $f * f = f$.
  corrige: |
    $\triangleright$ *1.* Supposons $f * g = f$ pour toute $f \in L^{1}$. Par l'exercice 3, $\hat{f}\hat{g} = \hat{f}$. Avec $f(x) = \mathrm{e}^{-|x|}$, dont la transformée $\dfrac{2}{1 + \xi^{2}}$ ne s'annule pas, on obtient $\hat{g}(\xi) = 1$ pour tout $\xi$, ce qui contredit le lemme de Riemann-Lebesgue. $L^{1}(\mathbb{R})$ n'a pas d'unité. L'unité serait la « masse de Dirac » en $0$, qui n'est pas une fonction.

    $\triangleright$ *2.* Si $f * f = f$, alors $\hat{f}^{2} = \hat{f}$, donc $\hat{f}(\xi) \in \{0, 1\}$ pour tout $\xi$. La fonction $\hat{f}$ est continue sur $\mathbb{R}$, qui est connexe : elle est constante. Comme elle tend vers $0$ à l'infini, elle est nulle, et $f = 0$ par injectivité (prop. 10). La seule solution est $f = 0$. Le chapitre 8 montrera que, dans $L^{2}$, la même équation a une infinité de solutions.
- id: "l3-hf-07-06"
  feuille: "f-l3-hf-07"
