  source: "Bordeaux 2015-2016, TD 5, exercice 5 ; Mathovore, exercices L3, exercice 18 ; Mathovore, Contrôle L3, exercice 5 (a), (b), (d) ; TD 4 « Transformation de Fourier » (préparation à l'agrégation), exercice 1"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Deux transformées en miroir.**

    **1.** Soit $a > 0$. Déduire de la proposition 13 du cours la transformée de $x \mapsto \mathrm{e}^{-a x^{2}}$.

    **2.** Calculer $\mathrm{e}^{-|\cdot|} * \mathrm{e}^{-|\cdot|}$, et en déduire que la transformée de $\varphi(x) = (1 + |x|)\mathrm{e}^{-|x|}$ est $\hat{\varphi}(y) = \dfrac{4}{(1 + y^{2})^{2}}$.

    **3.** À l'aide du théorème d'inversion, calculer la transformée de $y \mapsto \dfrac{1}{(1 + y^{2})^{2}}$, puis $\mathop{\displaystyle \int_{\mathbb{R}}} \dfrac{\mathrm{d} y}{(1 + y^{2})^{2}}$ et, pour $x \in \mathbb{R}$, $\mathop{\displaystyle \int_{\mathbb{R}}} \dfrac{\cos(xy)}{(1 + y^{2})^{2}} \, \mathrm{d} y$.

    **4.** Soit $n \geq 1$, $\gamma_{1}, \dots, \gamma_{n} \in \mathbb{R}$, $b_{1}, \dots, b_{n} \geq 0$ et $a_{1}, \dots, a_{n} \in \mathbb{C}$ avec $|a_{k}| \leq b_{k}$. On pose $f(t) = \mathop{\displaystyle \sum_{k}} a_{k} \mathrm{e}^{\mathrm{i}\gamma_{k}t}$ et $g(t) = \mathop{\displaystyle \sum_{k}} b_{k} \mathrm{e}^{\mathrm{i}\gamma_{k}t}$. Montrer, en développant $|f(t)|^{2}$, que 
    $$\int_{\mathbb{R}} \frac{|f(t)|^{2}}{(t^{2} + 1)^{2}} \, \mathrm{d} t \leq \int_{\mathbb{R}} \frac{|g(t)|^{2}}{(t^{2} + 1)^{2}} \, \mathrm{d} t .$$
  corrige: |
    $\triangleright$ *1.* On a $\mathrm{e}^{-ax^{2}} = \mathrm{e}^{-x^{2}/(2\sigma^{2})}$ avec $\sigma^{2} = \dfrac{1}{2a}$. La proposition 13 du cours donne 
    $$\boxed{\widehat{\mathrm{e}^{-a x^{2}}}(\xi) = \sigma\sqrt{2\pi}\,\mathrm{e}^{-\sigma^{2}\xi^{2}/2} = \sqrt{\frac{\pi}{a}}\,\mathrm{e}^{-\xi^{2}/(4a)} .}$$
     Plus la gaussienne est étroite ($a$ grand), plus sa transformée est large : c'est le principe d'incertitude, que le chapitre 8 quantifiera.

    $\triangleright$ *2.* Pour $x \geq 0$, on découpe l'intégrale selon $t < 0$, $0 \leq t \leq x$ et $t > x$ : 
    $$\int_{\mathbb{R}} \mathrm{e}^{-|t|}\mathrm{e}^{-|x - t|} \, \mathrm{d} t = \int_{-\infty}^{0} \mathrm{e}^{t}\mathrm{e}^{t - x} \, \mathrm{d} t + \int_{0}^{x} \mathrm{e}^{-x} \, \mathrm{d} t + \int_{x}^{+\infty} \mathrm{e}^{-t}\mathrm{e}^{x - t} \, \mathrm{d} t = \frac{\mathrm{e}^{-x}}{2} + x\mathrm{e}^{-x} + \frac{\mathrm{e}^{-x}}{2} ,$$
     et par parité, $\mathrm{e}^{-|\cdot|} * \mathrm{e}^{-|\cdot|} = \varphi$. La fonction $\mathrm{e}^{-|x|}$ est intégrable et bornée ; la proposition 5 donne 
    $$\boxed{\hat{\varphi}(y) = \Big( \frac{2}{1 + y^{2}} \Big)^{2} = \frac{4}{(1 + y^{2})^{2}} .}$$

    $\triangleright$ *3.* La fonction $\varphi$ est continue, intégrable, et $\hat{\varphi}$ est intégrable. Par le théorème d'inversion, pour tout $x$, 
    $$(1 + |x|)\mathrm{e}^{-|x|} = \frac{1}{2\pi} \int_{\mathbb{R}} \frac{4}{(1 + y^{2})^{2}} \mathrm{e}^{\mathrm{i} xy} \, \mathrm{d} y , \qquad \text{d'où} \qquad \boxed{\int_{\mathbb{R}} \frac{\mathrm{e}^{-\mathrm{i} xy}}{(1 + y^{2})^{2}} \, \mathrm{d} y = \frac{\pi}{2}(1 + |x|)\mathrm{e}^{-|x|}}$$
     (en changeant $x$ en $-x$). C'est la transformée de $y \mapsto \dfrac{1}{(1 + y^{2})^{2}}$. En $x = 0$, et en prenant la partie réelle, 
    $$\int_{\mathbb{R}} \frac{\mathrm{d} y}{(1 + y^{2})^{2}} = \frac{\pi}{2} , \qquad \int_{\mathbb{R}} \frac{\cos(xy)}{(1 + y^{2})^{2}} \, \mathrm{d} y = \frac{\pi}{2}(1 + |x|)\mathrm{e}^{-|x|} .$$
     Le chapitre 8 retrouvera la première valeur par la formule de Plancherel ; le théorème d'inversion suffit ici.

    $\triangleright$ *4.* On a $|f(t)|^{2} = \mathop{\displaystyle \sum_{k, l}} a_{k}\overline{a_{l}}\mathrm{e}^{\mathrm{i}(\gamma_{k} - \gamma_{l})t}$. Notons $\psi(\gamma) = \mathop{\displaystyle \int_{\mathbb{R}}} \dfrac{\mathrm{e}^{\mathrm{i}\gamma t}}{(1 + t^{2})^{2}} \, \mathrm{d} t = \dfrac{\pi}{2}(1 + |\gamma|)\mathrm{e}^{-|\gamma|}$, d'après la question 3 : c'est un réel *strictement positif*. Alors 
    $$\int_{\mathbb{R}} \frac{|f(t)|^{2}}{(t^{2} + 1)^{2}} \, \mathrm{d} t = \sum_{k, l} a_{k}\overline{a_{l}} \, \psi(\gamma_{k} - \gamma_{l}) \leq \sum_{k, l} b_{k}b_{l} \, \psi(\gamma_{k} - \gamma_{l}) = \int_{\mathbb{R}} \frac{|g(t)|^{2}}{(t^{2} + 1)^{2}} \, \mathrm{d} t ,$$
     en majorant chaque terme par son module, avec $|a_{k}\overline{a_{l}}| \leq b_{k}b_{l}$ et $\psi > 0$. Tout repose sur la positivité de la transformée de $\dfrac{1}{(1 + t^{2})^{2}}$.

    1.5em

    ![Figure](documents/figures/db72359ca9961170.svg)

    La convolution $\varphi = \mathrm{e}^{-|\cdot|} * \mathrm{e}^{-|\cdot|}$ élève la transformée au carré (orange) : elle décroît en $\dfrac{1}{y^{4}}$ au lieu de $\dfrac{1}{y^{2}}$ (bleu), car $\varphi$ est de classe $\mathcal{C}^{1}$ alors que $\mathrm{e}^{-|x|}$ a un point anguleux.
- id: "l3-hf-07-03"
  feuille: "f-l3-hf-07"
  numero: 3
  partie: "Transformées, convolution"
  etoiles: 2
