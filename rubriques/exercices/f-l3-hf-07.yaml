  enonce: |
    Soit $f \in L^{1}(\mathbb{R})$ et $g \in L^{\infty}(\mathbb{R})$ telle que $g(x) \to 0$ quand $x \to +\infty$. Montrer que $f * g(x) \to 0$ quand $x \to +\infty$.
  corrige: |
    Soit $\varepsilon > 0$. On choisit $A > 0$ tel que $\mathop{\displaystyle \int_{|t| > A}} |f| \leq \varepsilon$, puis $X$ tel que $|g(u)| \leq \varepsilon$ pour $u \geq X$. Pour $x \geq X + A$ et $|t| \leq A$, on a $x - t \geq X$, donc $|g(x - t)| \leq \varepsilon$. Ainsi 
    $$|f * g(x)| \leq \int_{|t| \leq A} |f(t)| \, |g(x - t)| \, \mathrm{d} t + \int_{|t| > A} |f(t)| \, |g(x - t)| \, \mathrm{d} t \leq \varepsilon\lVert f \rVert_{1} + \varepsilon\lVert g \rVert_{\infty} ,$$
     pour tout $x \geq X + A$ : $f * g(x) \to 0$ quand $x \to +\infty$. La convolée « hérite » du comportement à l'infini de $g$, $f$ jouant le rôle d'une moyenne pondérée.
