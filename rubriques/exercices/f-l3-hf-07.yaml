  enonce: |
    **Translatés dans $L^{1}$.** Soit $f \in L^{1}(\mathbb{R})$. Pour $h \in \mathbb{R}$, on pose $f_{h}(x) = f(x + h)$, et l'on note $V$ le sous-espace de $L^{1}(\mathbb{R})$ engendré par les $f_{h}$.

    **1.** Calculer $\widehat{f_{h}}$ en fonction de $\hat{f}$.

    **2.** On suppose qu'il existe $a \in \mathbb{R}$ tel que $\hat{f}(a) = 0$. Montrer que $V$ n'est pas dense dans $L^{1}(\mathbb{R})$.
  corrige: |
    $\triangleright$ *1.* Par la proposition 4 du cours, $\widehat{f_{h}}(\xi) = \mathrm{e}^{\mathrm{i} h\xi}\hat{f}(\xi)$.

    $\triangleright$ *2.* La forme linéaire $\Lambda : v \mapsto \hat{v}(a)$ est continue sur $L^{1}$, puisque $|\hat{v}(a)| \leq \lVert v \rVert_{1}$. Elle s'annule sur chaque $f_{h}$, car $\widehat{f_{h}}(a) = \mathrm{e}^{\mathrm{i} ha}\hat{f}(a) = 0$, donc sur $V$, et par continuité sur $\overline{V}$. Mais $\Lambda$ n'est pas nulle : pour $v(x) = \mathrm{e}^{-x^{2}/2}$, $\hat{v}(a) = \sqrt{2\pi}\mathrm{e}^{-a^{2}/2} \neq 0$. Ainsi $\overline{V}$ est contenu dans l'hyperplan fermé $\ker\Lambda \neq L^{1}$ : $V$ n'est pas dense.

    *Remarque.* La réciproque est vraie, mais beaucoup plus difficile : si $\hat{f}$ ne s'annule pas, les translatés de $f$ sont denses dans $L^{1}(\mathbb{R})$ (théorème taubérien de Wiener). Dans $L^{2}$, l'analogue est accessible et sera traité au chapitre 8 ; sur le cercle, c'est l'exercice 15 de la feuille 5.
