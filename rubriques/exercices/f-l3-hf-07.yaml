  notions: [transformee-fourier, fonction-periodique]
  source: "TD 4 « Transformation de Fourier » (préparation à l'agrégation), exercice 2"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **Formule de Poisson par Fejér.** Soit $f \in L^{1}(\mathbb{R})$ et $\varphi(x) = \mathop{\displaystyle \sum_{k \in \mathbb{Z}}} f(x + 2k\pi)$.

    **1.** Montrer que la série définissant $\varphi(x)$ converge absolument pour presque tout $x$, que $\varphi$ est $2\pi$-périodique et intégrable sur $[0, 2\pi]$, et que $\mathop{\displaystyle \int_{0}^{2\pi}} |\varphi| \leq \mathop{\displaystyle \int_{\mathbb{R}}} |f|$.

    **2.** Montrer que $c_{n}(\varphi) = \dfrac{1}{2\pi} \hat{f}(n)$ pour tout $n \in \mathbb{Z}$.

    **3.** On suppose $f$ continue et telle que $|f(x)| \leq M(1 + |x|)^{-\alpha}$ pour tout $x$, avec $M > 0$ et $\alpha > 1$. Montrer que $\varphi$ est continue.

    **4.** On suppose de plus que $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |\hat{f}(n)| < +\infty$, ou bien que $\hat{f}(n) \geq 0$ pour tout $n$. Montrer la formule de Poisson 
    $$\sum_{k \in \mathbb{Z}} f(2\pi k) = \frac{1}{2\pi} \sum_{n \in \mathbb{Z}} \hat{f}(n) .$$

    **5.** Appliquer cette formule à $f(x) = \mathrm{e}^{-s x^{2}/2}$, $s > 0$, et en déduire l'identité 
    $$\sum_{k \in \mathbb{Z}} \mathrm{e}^{-2\pi^{2} s k^{2}} = \frac{1}{\sqrt{2\pi s}} \sum_{n \in \mathbb{Z}} \mathrm{e}^{-n^{2}/(2s)} .$$
  corrige: |
    $\triangleright$ *1.* Par Tonelli, $\mathop{\displaystyle \int_{0}^{2\pi}} \mathop{\displaystyle \sum_{k}} |f(x + 2k\pi)| \, \mathrm{d} x = \mathop{\displaystyle \sum_{k}} \mathop{\displaystyle \int_{2k\pi}^{2(k+1)\pi}} |f| = \mathop{\displaystyle \int_{\mathbb{R}}} |f| < +\infty$. La série $\mathop{\displaystyle \sum_{k}} |f(x + 2k\pi)|$ est donc finie pour presque tout $x \in [0, 2\pi]$ (donc pour presque tout $x \in \mathbb{R}$, par périodicité), $\varphi$ est définie presque partout, $2\pi$-périodique, et $\mathop{\displaystyle \int_{0}^{2\pi}} |\varphi| \leq \mathop{\displaystyle \int_{\mathbb{R}}} |f|$.

    $\triangleright$ *2.* La domination de la question 1 justifie l'interversion de la somme et de l'intégrale : 
    $$c_{n}(\varphi) = \frac{1}{2\pi} \sum_{k \in \mathbb{Z}} \int_{0}^{2\pi} f(x + 2k\pi)\mathrm{e}^{-\mathrm{i} n x} \, \mathrm{d} x = \frac{1}{2\pi} \sum_{k \in \mathbb{Z}} \int_{2k\pi}^{2(k+1)\pi} f(u)\mathrm{e}^{-\mathrm{i} n u} \, \mathrm{d} u = \frac{1}{2\pi}\hat{f}(n) ,$$
     car $\mathrm{e}^{-\mathrm{i} n(u - 2k\pi)} = \mathrm{e}^{-\mathrm{i} nu}$.

    $\triangleright$ *3.* Pour $x \in [-\pi, \pi]$ et $|k| \geq 1$, $|x + 2k\pi| \geq (2|k| - 1)\pi$, donc $|f(x + 2k\pi)| \leq M\big(1 + (2|k| - 1)\pi\big)^{-\alpha}$, terme général d'une série convergente indépendant de $x$. La série de fonctions continues converge normalement sur $[-\pi, \pi]$, donc partout par périodicité : $\varphi$ est continue.

    $\triangleright$ *4.* Si $\mathop{\displaystyle \sum} |\hat{f}(n)| < +\infty$, la série de Fourier de $\varphi$ converge absolument ; comme $\varphi$ est continue, elle est égale à sa somme en tout point (chapitre 6, th. 5). En $x = 0$ : 
    $$\sum_{k} f(2k\pi) = \varphi(0) = \sum_{n} c_{n}(\varphi) = \frac{1}{2\pi}\sum_{n} \hat{f}(n) .$$

    Si $\hat{f}(n) \geq 0$ pour tout $n$, le théorème de Fejér (chapitre 6, th. 2) donne, $\varphi$ étant continue, 
    $$\sigma_{\varphi, p}(0) = \frac{1}{2\pi} \sum_{|n| < p} \Big( 1 - \frac{|n|}{p} \Big) \hat{f}(n) \longrightarrow \varphi(0) .$$
     Les termes sont positifs, et les poids $(1 - \dfrac{|n|}{p})^{+}$ croissent vers $1$ quand $p \to +\infty$ : par convergence monotone (pour les séries), la limite est $\dfrac{1}{2\pi}\mathop{\displaystyle \sum_{n}} \hat{f}(n)$, qui est donc finie et égale à $\varphi(0)$. Dans les deux cas, 
    $$\boxed{\sum_{k \in \mathbb{Z}} f(2\pi k) = \frac{1}{2\pi} \sum_{n \in \mathbb{Z}} \hat{f}(n) .}$$
     Le théorème 4 du cours obtient la même formule sous l'hypothèse « $f$ lipschitzienne et $x^{2}f$ bornée ».

    $\triangleright$ *5.* La fonction $f(x) = \mathrm{e}^{-sx^{2}/2}$ est continue, à décroissance rapide, et $\hat{f}(y) = \sqrt{2\pi/s}\,\mathrm{e}^{-y^{2}/(2s)} > 0$ (prop. 13 avec $\sigma^{2} = 1/s$). La formule donne 
    $$\boxed{\sum_{k \in \mathbb{Z}} \mathrm{e}^{-2\pi^{2}sk^{2}} = \frac{1}{2\pi}\sqrt{\frac{2\pi}{s}} \sum_{n \in \mathbb{Z}} \mathrm{e}^{-n^{2}/(2s)} = \frac{1}{\sqrt{2\pi s}} \sum_{n \in \mathbb{Z}} \mathrm{e}^{-n^{2}/(2s)} ,}$$
     identité vérifiée numériquement pour $s = 0{,}7$ (les deux membres valent $1{,}0000020$). C'est l'équation fonctionnelle de la fonction thêta de Jacobi : elle relie une série qui converge très vite quand $s$ est grand à une série qui converge très vite quand $s$ est petit. Avec $f(x) = \mathrm{e}^{-a|x|}$, qui vérifie aussi $\hat{f} > 0$, on retrouve $\mathop{\displaystyle \sum_{n}} \dfrac{1}{n^{2} + a^{2}} = \dfrac{\pi}{a}\coth(\pi a)$ (feuille 5, exercice 8).

