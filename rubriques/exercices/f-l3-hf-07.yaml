  source: "Mathovore, exercices L3, exercice 19 ; Bordeaux 2015-2016, TD 5, exercice 7"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Convolution et fonctions triangles.**

    **1.** Soit $f, g \in L^{1}(\mathbb{R})$. Montrer que $f * g(x)$ est défini pour presque tout $x$, que $\lVert f * g \rVert_{1} \leq \lVert f \rVert_{1}\lVert g \rVert_{1}$ et que $\widehat{f * g} = \hat{f}\,\hat{g}$.

    **2.** Soit $I = \mathbf{1}_{[-1/2, 1/2]}$ et $\Delta(x) = \mathop{\displaystyle \max}(1 - |x|, 0)$. Montrer que $I * I = \Delta$, en déduire $\hat{\Delta}$, et vérifier le résultat par un calcul direct. Montrer que $\hat{\Delta}$ est positive et intégrable.

    **3.** Soit $f = \mathbf{1}_{[-1, 1]}$. Déterminer $T = f * f$ et $\hat{T}$, puis calculer $T * T(0)$. En appliquant le théorème d'inversion à $T * T$, calculer $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\sin^{4} t}{t^{4}} \, \mathrm{d} t$.
  corrige: |
    $\triangleright$ *1.* Par le théorème de Fubini-Tonelli et l'invariance de la mesure de Lebesgue par translation, 
    $$\int_{\mathbb{R}} \int_{\mathbb{R}} |f(t)| \, |g(x - t)| \, \mathrm{d} t \, \mathrm{d} x = \int_{\mathbb{R}} |f(t)| \Big( \int_{\mathbb{R}} |g(x - t)| \, \mathrm{d} x \Big) \mathrm{d} t = \lVert f \rVert_{1}\lVert g \rVert_{1} < +\infty .$$
     L'intégrale intérieure est donc finie pour presque tout $x$ : $f * g(x)$ est défini presque partout, et $\lVert f * g \rVert_{1} \leq \lVert f \rVert_{1}\lVert g \rVert_{1}$. L'intégrande $f(t)g(x - t)\mathrm{e}^{-\mathrm{i} x\xi}$ étant intégrable sur $\mathbb{R}^{2}$, Fubini donne 
    $$\widehat{f * g}(\xi) = \int_{\mathbb{R}} f(t)\mathrm{e}^{-\mathrm{i} t\xi} \Big( \int_{\mathbb{R}} g(x - t)\mathrm{e}^{-\mathrm{i}(x - t)\xi} \, \mathrm{d} x \Big) \mathrm{d} t = \hat{f}(\xi)\hat{g}(\xi) .$$
     C'est la proposition 5 du cours sans l'hypothèse « $g$ bornée ».

    $\triangleright$ *2.* Le produit $I(t)I(x - t)$ vaut $1$ si $t \in [-\dfrac{1}{2}, \dfrac{1}{2}] \cap [x - \dfrac{1}{2}, x + \dfrac{1}{2}]$ et $0$ sinon ; cette intersection a pour longueur $\mathop{\displaystyle \max}(1 - |x|, 0)$. Donc $I * I = \Delta$, et, puisque $\hat{I}(\xi) = \dfrac{2\sin(\xi/2)}{\xi}$ (exercice 1), 
    $$\boxed{\hat{\Delta}(\xi) = \frac{4\sin^{2}(\xi/2)}{\xi^{2}} .}$$
     Directement, par parité puis par parties, $\hat{\Delta}(\xi) = 2\mathop{\displaystyle \int_{0}^{1}} (1 - x)\cos(x\xi) \, \mathrm{d} x = \dfrac{2(1 - \cos\xi)}{\xi^{2}}$, ce qui est la même chose. Cette fonction est positive, majorée par $1$ et par $\dfrac{4}{\xi^{2}}$ : elle est intégrable.

    $\triangleright$ *3.* Comme en 2, $T = f * f$ vaut $\mathop{\displaystyle \max}(2 - |x|, 0)$, triangle de hauteur $2$, et $\hat{T}(\xi) = \dfrac{4\sin^{2}\xi}{\xi^{2}}$. La fonction $T * T$ est continue (cours, prop. 2), intégrable, et $\widehat{T * T} = \hat{T}^{2} = \dfrac{16\sin^{4}\xi}{\xi^{4}}$ est intégrable. Enfin 
    $$T * T(0) = \int_{\mathbb{R}} T(t)T(-t) \, \mathrm{d} t = \int_{\mathbb{R}} T^{2} = 2\int_{0}^{2} (2 - t)^{2} \, \mathrm{d} t = \frac{16}{3} .$$
     Le théorème d'inversion en $x = 0$ donne $\dfrac{16}{3} = \dfrac{1}{2\pi}\mathop{\displaystyle \int_{\mathbb{R}}} \dfrac{16\sin^{4}\xi}{\xi^{4}} \, \mathrm{d}\xi$, d'où, par parité, 
    $$\boxed{\int_{0}^{+\infty} \frac{\sin^{4} t}{t^{4}} \, \mathrm{d} t = \frac{\pi}{3} .}$$
     Appliqué à $T$ elle-même, le théorème d'inversion en $0$ donne de même $\mathop{\displaystyle \int_{0}^{+\infty}} \dfrac{\sin^{2} t}{t^{2}} \, \mathrm{d} t = \dfrac{\pi}{2}$.

    1.5em

    ![Figure](documents/figures/ae0854a21b6d038c.svg)

    À gauche, la convolée de deux créneaux est un triangle, continu ; à droite, sa transformée est le carré de celle du créneau : positive, nulle aux multiples non nuls de $2\pi$, et intégrable.
