  source: "Bordeaux 2015-2016, TD 5, exercice 4 ; TD 4 « Transformation de Fourier », exercice 9"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Une équation intégrale.** Soit $\beta \in \mathbb{R}$. On cherche les $u \in L^{1}(\mathbb{R})$ telles que, pour presque tout $x \in \mathbb{R}$, 
    $$u(x) = \mathrm{e}^{-|x|} + \beta \int_{\mathbb{R}} \mathrm{e}^{-|x - s|} u(s) \, \mathrm{d} s .$$

    **1.** Écrire cette équation à l'aide d'un produit de convolution.

    **2.** À l'aide de la transformation de Fourier, montrer qu'il existe une solution si et seulement si $\beta < \dfrac{1}{2}$, qu'elle est alors unique, et la déterminer.
  corrige: |
    $\triangleright$ *1.* En notant $e(x) = \mathrm{e}^{-|x|}$, l'équation s'écrit $u = e + \beta\, e * u$.

    $\triangleright$ *2.* Soit $u \in L^{1}$ une solution. En passant aux transformées (exercice 3), avec $\hat{e}(\xi) = \dfrac{2}{1 + \xi^{2}}$ : 
    $$\hat{u} = \frac{2}{1 + \xi^{2}} + \frac{2\beta}{1 + \xi^{2}}\hat{u} , \qquad \text{soit} \qquad (1 + \xi^{2} - 2\beta)\,\hat{u}(\xi) = 2 \quad \text{pour tout } \xi .$$

    Si $\beta \geq \dfrac{1}{2}$, le facteur $1 + \xi^{2} - 2\beta$ s'annule en $\xi_{0} = \sqrt{2\beta - 1}$, et l'égalité en $\xi_{0}$ donne $0 = 2$ : il n'y a pas de solution.

    Si $\beta < \dfrac{1}{2}$, posons $c = \sqrt{1 - 2\beta} > 0$. Alors nécessairement $\hat{u}(\xi) = \dfrac{2}{c^{2} + \xi^{2}} = \dfrac{1}{c} \cdot \dfrac{2c}{c^{2} + \xi^{2}}$, transformée de $\dfrac{1}{c}\mathrm{e}^{-c|x|}$. Par injectivité, $u = \dfrac{1}{c}\mathrm{e}^{-c|x|}$ presque partout : il y a au plus une solution. Réciproquement, cette fonction est intégrable, et les deux membres de l'équation sont intégrables de même transformée ; ils sont égaux presque partout (et même partout, étant continus). Donc 
    $$\boxed{\text{solution} \iff \beta < \frac{1}{2} , \qquad u(x) = \frac{\mathrm{e}^{-\sqrt{1 - 2\beta}\,|x|}}{\sqrt{1 - 2\beta}} .}$$
     En particulier, pour $\beta > 0$, il y a une solution si et seulement si $\beta \in ]0, \dfrac{1}{2}[$.

    1.5em

    ![Figure](documents/figures/05e9544c802cd986.svg)

    Quand $\beta$ croît vers $\dfrac{1}{2}$, la solution $u$ s'étale et grossit ($u(0) = \dfrac{1}{\sqrt{1 - 2\beta}}$) : sa masse $\mathop{\displaystyle \int} u = \dfrac{2}{1 - 2\beta}$ explose, et il n'y a plus de solution intégrable pour $\beta \geq \dfrac{1}{2}$.
