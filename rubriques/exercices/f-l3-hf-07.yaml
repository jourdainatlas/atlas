  enonce: |
    **L'algèbre de Wiener.** On note $W$ l'ensemble des $f \in L^{1}(\mathbb{R})$ telles que $\hat{f} \in L^{1}(\mathbb{R})$, et l'on pose $N(f) = \lVert f \rVert_{1} + \lVert \hat{f} \rVert_{1}$.

    **1.** Montrer que tout $f \in W$ coïncide presque partout avec une fonction continue bornée, et en déduire que $W \subset L^{p}(\mathbb{R})$ pour tout $p \in [1, +\infty]$. La réciproque est-elle vraie ?

    **2.** Montrer que, pour $f \in L^{1}(\mathbb{R})$, $f \in W$ si et seulement si $\hat{f} \in W$.

    **3.** Montrer que si $f, g \in W$, alors $f * g \in W$ et $fg \in W$, avec $\widehat{fg} = \dfrac{1}{2\pi} \hat{f} * \hat{g}$.

    **4.** Montrer que $N$ est une norme sur $W$, et que $(W, N)$ est un espace de Banach. On pourra montrer qu'une suite de Cauchy $(f_{n})$ converge dans $L^{1}$ vers une $f$, que $(\hat{f}_{n})$ converge uniformément vers $\hat{f}$ et dans $L^{1}$ vers une fonction $g$, puis que $\hat{f} = g$.

    **5.** Soit $h(x) = \mathrm{e}^{-\pi x^{2}}$ et $h_{n}(x) = n h(nx)$. Calculer $\hat{h}$. Montrer que, pour $f \in L^{1}(\mathbb{R})$, $f * h_{n}$ est continue et appartient à $W$, et que $\lVert f * h_{n} - f \rVert_{1} \to 0$. En déduire que $W$ est dense dans $L^{1}(\mathbb{R})$.
  corrige: |
    $\triangleright$ *1.* Si $f \in W$, le théorème d'inversion montre que $f$ est égale presque partout à la fonction 
    $$\tilde{f}(x) = \frac{1}{2\pi}\int \hat{f}(y)\mathrm{e}^{\mathrm{i} xy} \, \mathrm{d} y ,$$
     continue et bornée par $\dfrac{\lVert \hat{f} \rVert_{1}}{2\pi}$. Pour $p \in [1, +\infty[$, $|f|^{p} \leq \lVert \tilde{f} \rVert_{\infty}^{p - 1}|f|$ presque partout, qui est intégrable : $f \in L^{p}$ ; et $f \in L^{\infty}$. La réciproque est fausse : $\mathbf{1}_{[0, 1]}$ appartient à tous les $L^{p}$, mais sa transformée n'est pas intégrable (exercice 1). $W \subsetneq \mathop{\displaystyle \bigcap_{p}} L^{p}$.

    $\triangleright$ *2.* Si $f \in W$, alors $\hat{f} \in L^{1}$, et par inversion $\widehat{\hat{f}}(x) = \mathop{\displaystyle \int} \hat{f}(y)\mathrm{e}^{-\mathrm{i} xy} \, \mathrm{d} y = 2\pi\tilde{f}(-x)$, qui est intégrable puisque $\tilde{f} = f$ presque partout : $\hat{f} \in W$. Réciproquement, si $\hat{f} \in W$, en particulier $\hat{f} \in L^{1}$, et $f \in W$.

    $\triangleright$ *3.* Si $f, g \in W$, $f * g \in L^{1}$ et $\widehat{f * g} = \hat{f}\hat{g}$ (exercice 3), intégrable car $\hat{f}$ est bornée et $\hat{g}$ intégrable : $f * g \in W$.

    Pour le produit, $fg \in L^{1}$ car $f$ est (presque partout) bornée. En écrivant $f = \dfrac{1}{2\pi}\mathop{\displaystyle \int} \hat{f}(y)\mathrm{e}^{\mathrm{i}\cdot y} \, \mathrm{d} y$ et en appliquant Fubini (l'intégrande $|\hat{f}(y)g(x)|$ est intégrable sur $\mathbb{R}^{2}$), 
    $$\widehat{fg}(\xi) = \frac{1}{2\pi} \int_{\mathbb{R}} \hat{f}(y) \Big( \int_{\mathbb{R}} g(x)\mathrm{e}^{-\mathrm{i} x(\xi - y)} \, \mathrm{d} x \Big) \mathrm{d} y = \frac{1}{2\pi} \int_{\mathbb{R}} \hat{f}(y)\hat{g}(\xi - y) \, \mathrm{d} y = \frac{1}{2\pi}\hat{f} * \hat{g}(\xi) ,$$
     qui est intégrable comme convolée de deux fonctions intégrables : $fg \in W$. L'espace $W$ est donc une algèbre pour la convolution et pour le produit.

    $\triangleright$ *4.* $N$ est la somme de la norme $\lVert \cdot \rVert_{1}$ et de la semi-norme $f \mapsto \lVert \hat{f} \rVert_{1}$ : c'est une norme.

    Soit $(f_{n})$ une suite de Cauchy pour $N$. Elle est de Cauchy dans $L^{1}$, donc converge vers une $f \in L^{1}$ ; et $(\hat{f}_{n})$ est de Cauchy dans $L^{1}$, donc converge dans $L^{1}$ vers une fonction $g$. D'autre part, $\lVert \hat{f}_{n} - \hat{f} \rVert_{\infty} \leq \lVert f_{n} - f \rVert_{1} \to 0$ : $\hat{f}_{n} \to \hat{f}$ uniformément. Une sous-suite de $(\hat{f}_{n})$ converge presque partout vers $g$ (cours d'Intégration) : donc $\hat{f} = g$ presque partout. Ainsi $\hat{f} \in L^{1}$, $f \in W$, et $N(f_{n} - f) = \lVert f_{n} - f \rVert_{1} + \lVert \hat{f}_{n} - g \rVert_{1} \to 0$ : $(W, N)$ est un espace de Banach.

    $\triangleright$ *5.* On a $h(x) = \mathrm{e}^{-x^{2}/(2\sigma^{2})}$ avec $\sigma^{2} = \dfrac{1}{2\pi}$ : par la proposition 13, $\hat{h}(\xi) = \sigma\sqrt{2\pi}\,\mathrm{e}^{-\sigma^{2}\xi^{2}/2} = \mathrm{e}^{-\xi^{2}/(4\pi)}$. En particulier $\mathop{\displaystyle \int} h = \hat{h}(0) = 1$, et $h_{n} \geq 0$, $\mathop{\displaystyle \int} h_{n} = 1$, $\mathop{\displaystyle \int_{|x| \geq \delta}} h_{n} \to 0$ : $(h_{n})$ est une approximation de l'unité (cours, prop. 8).

    Pour $f \in L^{1}$, $f * h_{n}$ est continue ($h_{n}$ est bornée, prop. 2), intégrable, et $\widehat{f * h_{n}}(\xi) = \hat{f}(\xi)\mathrm{e}^{-\xi^{2}/(4\pi n^{2})}$ est intégrable, puisque $\hat{f}$ est bornée : $f * h_{n} \in W$. La proposition 8 donne $\lVert f * h_{n} - f \rVert_{1} \to 0$ : $W$ est dense dans $L^{1}(\mathbb{R})$.

    *Remarque.* Le même argument, avec la continuité des translations dans $L^{p}$ (cours d'Intégration), montre que $\lVert f * h_{n} - f \rVert_{p} \to 0$ pour $f \in L^{1} \cap L^{p}$, $p < +\infty$, puis que $W$ est dense dans $L^{p}(\mathbb{R})$ ; et pour $f \in L^{1} \cap \mathcal{C}_{0}$, la convergence est uniforme (chapitre 8, prop. 4).
- id: "l3-hf-07-12"
  feuille: "f-l3-hf-07"
