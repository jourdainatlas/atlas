  enonce: |
    **Inégalité de Bernstein.** Soit $m > 0$ et $f : \mathbb{R} \to \mathbb{C}$ continue et intégrable telle que $\hat{f}(t) = 0$ pour $|t| > m$.

    **1.** Prouver que $f$ est de classe $\mathcal{C}^{1}$ et que, pour tout $x \in \mathbb{R}$, $f'(x) = \dfrac{\mathrm{i}}{2\pi} \mathop{\displaystyle \int_{-m}^{m}} \hat{f}(t) \, t \, \mathrm{e}^{\mathrm{i} t x} \, \mathrm{d} t$.

    Soit $g : \mathbb{R} \to \mathbb{C}$ intégrable telle que $\hat{g}$ soit intégrable et que $g(x) = x$ pour tout $x \in [-m, m]$.

    **2.** Montrer que $f * \hat{g}(x) = 2\mathrm{i}\pi f'(x)$ pour tout $x \in \mathbb{R}$. On pourra utiliser la proposition 9 du cours.

    **3.** En déduire l'inégalité $2\pi \lVert f' \rVert_{\infty} \leq \lVert f \rVert_{\infty} \mathop{\displaystyle \int_{\mathbb{R}}} |\hat{g}(t)| \, \mathrm{d} t$.

    **4.** Justifier l'existence d'une telle fonction $g$, en la cherchant continue, affine par morceaux et à support compact. On pourra utiliser l'exercice 3.
  corrige: |
    $\triangleright$ *1.* La fonction $\hat{f}$ est continue et nulle hors de $[-m, m]$ : elle est intégrable. Comme $f$ est continue, le théorème d'inversion donne, pour tout $x$, $f(x) = \dfrac{1}{2\pi}\mathop{\displaystyle \int_{-m}^{m}} \hat{f}(t)\mathrm{e}^{\mathrm{i} tx} \, \mathrm{d} t$. L'intégrande est dérivable en $x$, de dérivée $\mathrm{i} t\hat{f}(t)\mathrm{e}^{\mathrm{i} tx}$, majorée par $m\lVert \hat{f} \rVert_{\infty}$ sur le segment $[-m, m]$ : par dérivation sous l'intégrale, $f$ est de classe $\mathcal{C}^{1}$ et 
    $$f'(x) = \frac{\mathrm{i}}{2\pi} \int_{-m}^{m} \hat{f}(t) \, t \, \mathrm{e}^{\mathrm{i} tx} \, \mathrm{d} t .$$

    $\triangleright$ *2.* Par la proposition 9 du cours, puis parce que $\hat{f}$ est nulle hors de $[-m, m]$ et que $g(-t) = -t$ sur cet intervalle, 
    $$f * \hat{g}(x) = \int_{\mathbb{R}} \hat{f}(t)g(-t)\mathrm{e}^{\mathrm{i} xt} \, \mathrm{d} t = -\int_{-m}^{m} \hat{f}(t) \, t \, \mathrm{e}^{\mathrm{i} xt} \, \mathrm{d} t = -\frac{2\pi}{\mathrm{i}} f'(x) = 2\mathrm{i}\pi f'(x) .$$

    $\triangleright$ *3.* Pour tout $x$, 
    $$2\pi|f'(x)| = |f * \hat{g}(x)| \leq \int_{\mathbb{R}} |f(x - t)| \, |\hat{g}(t)| \, \mathrm{d} t \leq \lVert f \rVert_{\infty} \lVert \hat{g} \rVert_{1} ,$$
     d'où $2\pi\lVert f' \rVert_{\infty} \leq \lVert f \rVert_{\infty} \mathop{\displaystyle \int_{\mathbb{R}}} |\hat{g}|$. Une fonction dont le spectre est limité à $[-m, m]$ ne peut pas varier plus vite que $C_{m}\lVert f \rVert_{\infty}$.

    $\triangleright$ *4.* Prenons $g$ impaire, égale à $x$ sur $[0, m]$, à $2m - x$ sur $[m, 2m]$, et nulle au-delà de $2m$. Elle est continue, affine par morceaux, à support compact, donc intégrable. Sa dérivée $h = g'$ (définie sauf en quatre points) vaut $1$ sur $]-m, m[$, $-1$ sur $]m, 2m[$ et sur $]-2m, -m[$, $0$ ailleurs. Pour $\xi \neq 0$, une intégration par parties ($g$ continue, à support compact) donne $\hat{g}(\xi) = \dfrac{1}{\mathrm{i}\xi}\hat{h}(\xi)$, et le calcul direct de $\hat{h}$ (somme de transformées d'indicatrices, exercice 1) conduit à 
    $$\hat{g}(\xi) = -\mathrm{i} \, \frac{4\sin(m\xi) - 2\sin(2m\xi)}{\xi^{2}} .$$
     Le numérateur est $O(\xi^{3})$ en $0$ et borné par $6$ : $\hat{g}$ est continue, bornée près de $0$ et majorée par $\dfrac{6}{\xi^{2}}$ à l'infini, donc intégrable. Une telle $g$ existe donc, comme le suggère l'exercice 3 : une fonction continue affine par morceaux est une combinaison de triangles, dont les transformées décroissent en $\dfrac{1}{\xi^{2}}$.

    *Remarque.* Le calcul de $\lVert \hat{g} \rVert_{1}$ donne une constante explicite, mais non optimale : l'inégalité de Bernstein, $\lVert f' \rVert_{\infty} \leq m\lVert f \rVert_{\infty}$, est le meilleur résultat, atteint pour $f(x) = \sin(mx)$ (qui n'est pas intégrable, mais que l'on peut approcher).

    1.5em

    ![Figure](documents/figures/94d9ef50638b51e5.svg)

    La fonction $g$ (orange) coïncide avec $x$ sur $[-m, m]$ (pointillés violets), puis redescend linéairement jusqu'à $0$ en $\pm 2m$ : continue et à support compact, elle a une transformée intégrable.
- id: "l3-hf-07-10"
  feuille: "f-l3-hf-07"
