  notions: [compact]
  source: "Bordeaux 2016, feuille 2, exercice 9"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Le compactifié d'Alexandrov de $\mathbb{R}$.** Soit $X = \mathbb{R} \cup \{\infty\}$, où $\infty$ est un point supplémentaire. Une partie $U$ de $X$ est déclarée ouverte si c'est un ouvert de $\mathbb{R}$, ou si $\infty \in U$ et si $\mathbb{R} \setminus U$ est une partie fermée et bornée de $\mathbb{R}$.

    **1.** Vérifier que l'on définit ainsi une topologie sur $X$, qui induit sur $\mathbb{R}$ sa topologie usuelle.

    **2.** Montrer que $X$ est compact.

    **3.** Montrer que $X$ est homéomorphe au cercle $\mathbb{S}^{1}$. On pourra utiliser la projection stéréographique depuis le pôle nord $(0, 1)$.
  corrige: |
    **1.** L'ensemble vide est un ouvert de $\mathbb{R}$, et $X$ convient puisque $\mathbb{R} \setminus X = \varnothing$. Une réunion d'ouverts de $\mathbb{R}$ en est un ; si la réunion contient $\infty$, son complémentaire dans $\mathbb{R}$ est contenu dans le fermé borné $\mathbb{R} \setminus U_{0}$, où $U_{0}$ est un des ouverts contenant $\infty$, et il est fermé, comme intersection de fermés de $\mathbb{R}$ (pour un ouvert $U$ de $\mathbb{R}$, $\mathbb{R} \setminus U$ est fermé). Il est donc fermé et borné. L'intersection de deux ouverts contenant $\infty$ a pour complémentaire dans $\mathbb{R}$ une réunion de deux fermés bornés ; l'intersection d'un ouvert de $\mathbb{R}$ et d'un ouvert contenant $\infty$ est $U \cap (V \cap \mathbb{R})$, ouvert de $\mathbb{R}$. Enfin, si $\infty \in V$, $V \cap \mathbb{R} = \mathbb{R} \setminus K$ avec $K$ fermé, ce qui montre que la topologie induite sur $\mathbb{R}$ est la topologie usuelle.

    **2.** $\triangleright$ *Séparation.* Deux réels sont séparés par des ouverts de $\mathbb{R}$. Un réel $x$ et $\infty$ sont séparés par $]x - 1, x + 1[$ et $X \setminus [x - 1, x + 1]$.

    $\triangleright$ *Borel-Lebesgue.* Soit $(U_{i})$ un recouvrement ouvert de $X$ et $U_{i_{0}}$ un ouvert contenant $\infty$. Le fermé borné $K = \mathbb{R} \setminus U_{i_{0}}$ est compact (cours, th. 5) et recouvert par les ouverts $U_{i} \cap \mathbb{R}$ de $\mathbb{R}$ : un nombre fini suffit. Avec $U_{i_{0}}$, on obtient un sous-recouvrement fini de $X$.

    **3.** Notons $N = (0, 1)$ le pôle nord. La droite passant par $N$ et par le point $(x, 0)$ recoupe le cercle en un second point. En écrivant ce point $N + t\big((x, 0) - N\big) = (tx, 1 - t)$ et en imposant $t^{2}x^{2} + (1 - t)^{2} = 1$, on trouve $t = \dfrac{2}{1 + x^{2}}$, d'où 
    $$\varphi(x) = \Big(\frac{2x}{1 + x^{2}}, \frac{x^{2} - 1}{x^{2} + 1}\Big) , \qquad \varphi(\infty) = N .$$
     L'application $\varphi$ est bijective de $X$ sur $\mathbb{S}^{1}$ : la projection stéréographique $(u, v) \mapsto \dfrac{u}{1 - v}$ est la réciproque de $\varphi$ sur $\mathbb{S}^{1} \setminus \{N\}$. Elle est continue sur l'ouvert $\mathbb{R}$ de $X$. En $\infty$, soit $V$ un ouvert du cercle contenant $N$ ; comme $\varphi(x) \to N$ quand $|x| \to +\infty$, il existe $A > 0$ tel que $\varphi(x) \in V$ pour $|x| > A$. Alors $\varphi^{-1}(V) \cap \mathbb{R}$ est un ouvert de $\mathbb{R}$, dont le complémentaire est fermé et contenu dans $[-A, A]$ : $\varphi^{-1}(V)$ est un ouvert de $X$. Ainsi $\varphi$ est une bijection continue du compact $X$ sur le séparé $\mathbb{S}^{1}$ : c'est un homéomorphisme (cours, th. 4).

    ![Figure](documents/figures/b4216a64919e8293.svg)

    La projection stéréographique depuis $N$ envoie la droite sur le cercle privé de $N$ ; quand $x$ part à l'infini dans un sens ou dans l'autre, $\varphi(x)$ tend vers $N$, qui est l'image du point ajouté. Le chapitre 4 utilisera la même construction pour la sphère $\mathbb{S}^{2}$.

