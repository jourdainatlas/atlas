  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs, localement-connexe-par-arcs]
  source: "Bordeaux 2016, feuille 3, exercice 5"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Composantes d'un ouvert.**

    **1.** Montrer que les composantes connexes d'un espace localement connexe sont ouvertes.

    **2.** Soit $U$ un ouvert de $\mathbb{R}^{n}$. Montrer que les composantes connexes de $U$ sont des ouverts de $\mathbb{R}^{n}$, et qu'elles sont en nombre fini ou dénombrable.

    **3.** En déduire que tout ouvert de $\mathbb{R}$ est réunion d'une famille finie ou dénombrable d'intervalles ouverts deux à deux disjoints.

    **4.** L'ensemble triadique de Cantor $K$ s'obtient en retirant de $[0, 1]$ l'intervalle $]\dfrac{1}{3}, \dfrac{2}{3}[$, puis le tiers central ouvert de chacun des deux segments restants, et ainsi de suite indéfiniment ; c'est un fermé de $[0, 1]$. Décrire les composantes connexes de l'ouvert $]0, 1[ \setminus K$, puis celles de $K$.
  corrige: |
    **1.** Soient $C$ une composante connexe de $X$ et $x \in C$. Il existe un voisinage connexe $V$ de $x$ ; la réunion $V \cup C$ est connexe, car $V$ et $C$ contiennent $x$, donc contenue dans la composante $C$ : $V \subset C$. Ainsi $C$ est voisinage de chacun de ses points, donc ouverte.

    **2.** Les boules ouvertes de $\mathbb{R}^{n}$ sont convexes, donc connexes, et celles qui sont contenues dans $U$ forment une base de voisinages de chaque point de $U$ : $U$ est localement connexe. Par la question 1, ses composantes connexes sont ouvertes dans $U$, donc dans $\mathbb{R}^{n}$. Chacune est un ouvert non vide et contient un point de $\mathbb{Q}^{n}$ ; en choisissant un tel point dans chaque composante, on obtient une application injective de l'ensemble des composantes dans $\mathbb{Q}^{n}$, puisqu'elles sont disjointes. Elles sont donc en nombre fini ou dénombrable.

    **3.** Pour $n = 1$, les composantes connexes de $U$ sont des parties connexes et ouvertes de $\mathbb{R}$, c'est-à-dire des intervalles ouverts (cours, th. 2). Elles sont deux à deux disjointes, de réunion $U$, en nombre fini ou dénombrable.

    **4.** À l'étape $k \geq 1$, on retire $2^{k-1}$ intervalles ouverts de longueur $3^{-k}$. L'ouvert $]0, 1[ \setminus K$ est la réunion de tous ces intervalles retirés, qui sont deux à deux disjoints. Leurs extrémités ne sont jamais retirées par la suite : elles sont dans $K$. Un intervalle retiré est donc une partie connexe maximale de $]0, 1[ \setminus K$, puisque tout intervalle strictement plus grand contiendrait une de ses extrémités. *Les composantes connexes de $]0, 1[ \setminus K$ sont les intervalles retirés,* en nombre dénombrable, conformément à la question 3.

    Après l'étape $k$, $K$ est contenu dans une réunion de $2^{k}$ segments disjoints de longueur $3^{-k}$. Une partie connexe de $K$, qui est un intervalle, est contenue dans l'un d'eux, donc de longueur au plus $3^{-k}$, et cela pour tout $k$ : c'est un point. *Les composantes connexes de $K$ sont les singletons,* et $K$ est totalement discontinu comme $\mathbb{Q}$, bien qu'il soit compact et indénombrable.

    ![Figure](documents/figures/f2d7c11a75e61c89.svg)

    Les quatre premières étapes de la construction de $K$ : en bleu les segments qui restent, en orange les intervalles ouverts retirés, qui sont les composantes connexes de $]0, 1[ \setminus K$.
- id: "l3-gt-02-06"
  feuille: "f-l3-gt-02"
  numero: 6
