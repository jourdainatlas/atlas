  page_corrige: 7
  enonce: |
    **La propriété de Borel-Lebesgue sans séparation.** On dit qu'une partie $Y$ d'un espace topologique vérifie la propriété (C) si, de tout recouvrement de $Y$ par des ouverts de $Y$, on peut extraire un sous-recouvrement fini.

    **1.** Soient $X_{1}$ et $X_{2}$ deux parties d'un espace $X$ vérifiant (C). Montrer que $X_{1} \cup X_{2}$ vérifie (C).

    **2.** Soit $X = [0, 1] \cup \{0'\}$, où $0'$ est un point supplémentaire. On décrète qu'une partie $U$ de $X$ est ouverte si $U \cap [0, 1]$ est un ouvert de $[0, 1]$ et si, lorsque $0' \in U$, il existe $\varepsilon > 0$ tel que $]0, \varepsilon[ \, \subset U$. Montrer qu'on définit ainsi une topologie, que $X_{1} = [0, 1]$ et $X_{2} = \, ]0, 1] \cup \{0'\}$ vérifient (C), mais que $X_{1} \cap X_{2}$ ne la vérifie pas.

    **3.** Pourquoi un tel exemple est-il impossible dans un espace séparé ?
  corrige: |
    **1.** Soit $(U_{i})_{i \in I}$ un recouvrement de $X_{1} \cup X_{2}$ par des ouverts de $X_{1} \cup X_{2}$. Les traces $U_{i} \cap X_{1}$ sont des ouverts de $X_{1}$ qui le recouvrent : un nombre fini d'entre elles suffit, d'indices dans une partie finie $F_{1}$ de $I$. De même pour $X_{2}$, avec $F_{2}$. La famille $(U_{i})_{i \in F_{1} \cup F_{2}}$ est un sous-recouvrement fini.

    **2.** $\triangleright$ *Topologie.* Les parties $\varnothing$ et $X$ conviennent. Si les $U_{k}$ sont ouverts, $\big(\mathop{\displaystyle \bigcup} U_{k}\big) \cap [0, 1]$ est ouvert dans $[0, 1]$, et si $0'$ est dans la réunion, il est dans un $U_{k}$, qui contient déjà un intervalle $]0, \varepsilon[$. Pour une intersection de deux ouverts contenant $0'$, on prend le plus petit des deux $\varepsilon$.

    $\triangleright$ *Les parties $X_{1}$ et $X_{2}$.* La topologie induite sur $X_{1} = [0, 1]$ est sa topologie usuelle : $X_{1}$ vérifie (C) par le théorème 3 du cours. L'application $h : [0, 1] \to X_{2}$ qui envoie $0$ sur $0'$ et fixe les autres points est un homéomorphisme, car les voisinages de $0'$ dans $X_{2}$ sont exactement les parties contenant un ensemble $\{0'\} \cup \, ]0, \varepsilon[ \, = h([0, \varepsilon[)$. Donc $X_{2}$ vérifie aussi (C).

    $\triangleright$ *L'intersection.* $X_{1} \cap X_{2} = \, ]0, 1]$, avec sa topologie usuelle ; le recouvrement par les ouverts $]\dfrac{1}{n}, 1]$ n'admet pas de sous-recouvrement fini.

    ![Figure](documents/figures/9708d460fbd79e7f.svg)

    Le segment à origine dédoublée, où la partie grise $]0, 1]$ est commune et où l'écart entre $0$ et $0'$ n'est qu'un artifice de dessin : $0$ et $0'$ ont les mêmes « voisins » à droite, si bien que tout voisinage de $0$ rencontre tout voisinage de $0'$. Les deux segments $X_{1}$ et $X_{2}$ sont compacts au sens de (C), mais leur partie commune $]0, 1]$ ne l'est pas.

    **3.** Dans un espace séparé, une partie vérifiant (C) est compacte au sens du cours, donc fermée (cours, prop. 10). Alors $X_{1} \cap X_{2}$ est un fermé du compact $X_{1}$, donc compact. L'exemple de la question 2 n'est pas séparé : $0$ et $0'$ ne peuvent pas être séparés. C'est la raison pour laquelle le cours inclut la séparation dans la définition de la compacité.
