  enonce: |
    **Une bijection continue qui n'est pas un homéomorphisme.** On considère 
    $$f : \mathbb{R}^{+} \to \mathbb{R}^{2} , \qquad f(x) = \Big(\cos\frac{2\pi x}{x + 1}, \sin\frac{2\pi x}{x + 1}\Big) .$$

    **1.** Montrer que $f$ est continue et injective, et déterminer son image $Y$.

    **2.** L'application $f$ est-elle un homéomorphisme de $\mathbb{R}^{+}$ sur $Y$, muni de la topologie induite par celle de $\mathbb{R}^{2}$ ?
  corrige: |
    **1.** Posons $\theta(x) = \dfrac{2\pi x}{x + 1}$. On a $\theta'(x) = \dfrac{2\pi}{(x + 1)^{2}} > 0$, $\theta(0) = 0$ et $\theta(x) \to 2\pi$ quand $x \to +\infty$ : $\theta$ est une bijection continue strictement croissante de $\mathbb{R}^{+}$ sur $[0, 2\pi[$. Comme $t \mapsto (\cos t, \sin t)$ est continue et injective sur $[0, 2\pi[$, $f$ est continue et injective, et *son image est le cercle $\mathbb{S}^{1}$ tout entier.*

    **2.** Non. Le cercle $Y = \mathbb{S}^{1}$ est compact, alors que $\mathbb{R}^{+}$, non borné, ne l'est pas ; ils ne sont pas homéomorphes. Concrètement, $f(n) \to (1, 0) = f(0)$ quand $n \to +\infty$, alors que $n$ ne tend pas vers $0$ : $f^{-1}$ n'est pas continue en $(1, 0)$.

    ![Figure](documents/figures/243ff70722afb080.svg)

    Les points $f(n)$ (en orange) parcourent le cercle dans le sens direct et reviennent vers le point de départ $f(0)$ sans jamais l'atteindre : la bijection $f$ recolle les deux bouts de $\mathbb{R}^{+}$, l'un fini et l'autre infini.
- id: "l3-gt-02-13"
  feuille: "f-l3-gt-02"
