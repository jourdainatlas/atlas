  enonce: |
    **La diagonale.** Soient $X$ un espace topologique et $D = \{(x, x) \mid x \in X\} \subset X \times X$.

    **1.** Montrer que $X$ est compact si et seulement si $D$ est compact.

    **2.** Montrer que $X$ est séparé si et seulement si $D$ est fermé dans $X \times X$.
  corrige: |
    **1.** L'application $\delta : X \to D$, $x \mapsto (x, x)$, est continue, puisque ses deux composantes sont l'identité, et bijective. Sa réciproque est la restriction à $D$ de la première projection, qui est continue. Donc $\delta$ est un homéomorphisme, et $X$ est compact si et seulement si $D$ l'est, puisque la compacité se conserve par homéomorphisme.

    **2.** Le complémentaire de $D$ est ouvert si et seulement si tout point $(x, y)$ avec $x \neq y$ possède un voisinage élémentaire $U \times V$ disjoint de $D$. Or $(U \times V) \cap D = \varnothing$ signifie exactement $U \cap V = \varnothing$. *$D$ est fermé si et seulement si deux points distincts peuvent être séparés par des ouverts disjoints.* Le chapitre 3 utilisera cette caractérisation pour la séparation des quotients.
