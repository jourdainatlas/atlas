- id: "l3-gt-02-01"
  feuille: "f-l3-gt-02"
  numero: 1
  partie: "Connexité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [connexité]
  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs]
  source: "Bordeaux 2016, feuille 3, exercice 2"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Espaces totalement discontinus.** Déterminer les composantes connexes :

    **1.** d'un espace discret ;

    **2.** de $\mathbb{Q}$, muni de la topologie induite par celle de $\mathbb{R}$ ;

    **3.** de $\mathbb{R} \setminus \mathbb{Q}$, muni de la topologie induite.

    Ces trois espaces ont les mêmes composantes connexes, des singletons ; sont-ils pour autant tous discrets ?
  corrige: |
    **1.** Dans un espace discret, une partie $C$ contenant deux points $x \neq y$ n'est pas connexe : $\{x\}$ et $C \setminus \{x\}$ sont deux ouverts disjoints non vides qui la recouvrent. *Les composantes connexes sont les singletons.*

    **2.** Soit $C$ une partie de $\mathbb{Q}$ contenant deux rationnels $x < y$, et $z$ un irrationnel compris entre eux. Les parties 
    $$C \cap \, ]-\infty, z[ \qquad \text{et} \qquad C \cap \, ]z, +\infty[$$
     sont ouvertes dans $C$, disjointes, non vides (elles contiennent $x$ et $y$) et recouvrent $C$ puisque $z \notin C$. Une partie connexe de $\mathbb{Q}$ a donc au plus un point : *les composantes connexes de $\mathbb{Q}$ sont les singletons.*

    **3.** Le même raisonnement, avec un rationnel $z$ compris entre deux irrationnels, montre que *les composantes connexes de $\mathbb{R} \setminus \mathbb{Q}$ sont les singletons.*

    Seul le premier espace est discret. Dans $\mathbb{Q}$, le singleton $\{0\}$ n'est pas ouvert, car tout intervalle ouvert centré en $0$ contient d'autres rationnels ; de même dans $\mathbb{R} \setminus \mathbb{Q}$. On dit de ces espaces, dont les composantes connexes sont des points, qu'ils sont *totalement discontinus* ; cela n'entraîne pas que la topologie soit discrète. L'ensemble de Cantor de l'exercice 5 en est un autre exemple.
- id: "l3-gt-02-02"
  feuille: "f-l3-gt-02"
  numero: 2
  partie: "Connexité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [connexité, connexité locale]
  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs, localement-connexe-par-arcs]
  source: "Bordeaux 2016, feuille 3, exercice 6"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Connexité locale, quatre exemples.**

    **1.** L'espace $\mathbb{Q}$ est-il localement connexe ?

    **2.** Soit $X$ un espace connexe. Montrer que toute application continue $f : X \to \mathbb{Q}$ est constante.

    **3.** Montrer que $\mathbb{R}^{2} \setminus \mathbb{Q}^{2}$ est connexe par arcs et localement connexe par arcs.

    **4.** Soit $C = \big(\{0\} \times \mathbb{R}\big) \cup \big(\mathbb{R} \times \mathbb{Q}\big)$. Montrer que $C$ est connexe par arcs, mais qu'il n'est pas localement connexe.
  corrige: |
    **1.** Non. Par l'exercice 1, les parties connexes de $\mathbb{Q}$ sont les singletons et l'ensemble vide. Un voisinage de $0$ dans $\mathbb{Q}$ contient un ensemble $\mathbb{Q} \cap \, ]-\varepsilon, \varepsilon[$, qui a une infinité de points : aucun voisinage de $0$ n'est connexe.

    **2.** L'image $f(X)$ est une partie connexe de $\mathbb{Q}$ (cours, prop. 1), donc un singleton : $f$ est constante.

    **3.** Notons $E = \mathbb{R}^{2} \setminus \mathbb{Q}^{2}$ : ce sont les points dont l'une au moins des coordonnées est irrationnelle. Si $a \notin \mathbb{Q}$, toute la droite verticale $\{a\} \times \mathbb{R}$ est dans $E$ ; si $b \notin \mathbb{Q}$, toute la droite horizontale $\mathbb{R} \times \{b\}$ l'est aussi.

    Soient $p = (x_{1}, y_{1})$ et $q = (x_{2}, y_{2})$ dans $E$, et $a$, $c$ deux irrationnels. Si $x_{1} \notin \mathbb{Q}$, le segment vertical de $p$ à $(x_{1}, c)$ est dans $E$. Si $y_{1} \notin \mathbb{Q}$, on suit l'horizontale de $p$ à $(a, y_{1})$, puis la verticale de $(a, y_{1})$ à $(a, c)$. Dans les deux cas, $p$ est relié dans $E$ à un point de la droite $\mathbb{R} \times \{c\}$, et $q$ aussi ; on conclut en suivant cette droite. *L'espace $E$ est connexe par arcs.*

    Le même argument fonctionne dans un carré ouvert $Q = \, ]x_{1} - r, x_{1} + r[ \times ]y_{1} - r, y_{1} + r[$ centré en $p$, en choisissant $a$ et $c$ irrationnels dans $]x_{1} - r, x_{1} + r[$ et dans $]y_{1} - r, y_{1} + r[$ : les segments horizontaux et verticaux utilisés restent dans le carré, qui est convexe. Ainsi $Q \cap E$ est connexe par arcs, et ces voisinages forment une base de voisinages de $p$ dans $E$ : *$E$ est localement connexe par arcs.*

    **4.** Un point $(x, r)$ de $C$, avec $r \in \mathbb{Q}$, est relié à $(0, r)$ par le segment horizontal $[0, x] \times \{r\} \subset C$, et deux points de l'axe vertical sont reliés le long de cet axe. Donc $C$ est connexe par arcs.

    Montrons que $C$ n'est pas localement connexe en $p = (1, 0)$. Soit $W$ un voisinage de $p$ dans $C$ contenu dans $B(p, \dfrac{1}{2})$, et supposons-le connexe. Les points de $W$ ont une abscisse strictement positive, donc ne sont pas sur l'axe : $W \subset \mathbb{R} \times \mathbb{Q}$. La seconde projection envoie alors continûment le connexe $W$ dans $\mathbb{Q}$ ; par la question 2, elle est constante, égale à $0$. Mais $W$, voisinage de $p$ dans $C$, contient des points $(1, r)$ avec $r$ rationnel non nul et petit : contradiction.

    ![Figure](documents/figures/59851a7e8fac208c.svg)

    L'ensemble $C$ : l'axe vertical et, en bleu clair, quelques-unes des droites horizontales de hauteur rationnelle, qui sont en réalité denses. Près de $p$ (en orange), $C$ n'est qu'une famille de segments horizontaux : la connexité de $C$ passe par l'axe, loin de $p$, et aucun petit voisinage de $p$ n'est connexe.
- id: "l3-gt-02-03"
  feuille: "f-l3-gt-02"
  numero: 3
