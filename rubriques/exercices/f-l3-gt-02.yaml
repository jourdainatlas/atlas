  etoiles: 3
  types: [Démonstration]
  mots_cles: [connexité, connexité locale]
  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs, localement-connexe-par-arcs, cosinus-sinus]
  source: "Bordeaux 2016, feuille 3, exercice 7"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Autour du sinus du topologue.**

    **1.** Déterminer les composantes connexes par arcs de $S$.

    **2.** Montrer que $\Gamma \cup \{(0, 0)\}$ est connexe, mais n'est pas connexe par arcs.

    **3.** Montrer que $S$ n'est pas localement connexe.

    **4.** *Le cercle de Varsovie.* On referme $S$ par la ligne polygonale $L$ qui joint $(1, \sin 1)$ à $(1, -2)$, puis à $(0, -2)$, puis à $(0, -1)$, et l'on pose $W = S \cup L$. Montrer que $W$ est compact et connexe par arcs, mais qu'il n'est pas localement connexe.
  corrige: |
    **1.** Le graphe $\Gamma$ est l'image de $]0, 1]$ par une application continue, donc connexe par arcs ; le segment $J$ aussi. La démonstration de la proposition 4 du cours établit qu'aucun chemin de $S$ ne joint $(0, 0)$ à un point de $\Gamma$. S'il existait un chemin de $S$ joignant un point $j \in J$ à un point de $\Gamma$, on le ferait précéder du segment de $(0, 0)$ à $j$, contenu dans $J$ : contradiction. *Les composantes connexes par arcs de $S$ sont $\Gamma$ et $J$.*

    **2.** On a $\Gamma \subset \Gamma \cup \{(0, 0)\} \subset \overline{\Gamma} = S$, et $\Gamma$ est connexe : par la proposition 2 du cours, $\Gamma \cup \{(0, 0)\}$ est connexe. Un chemin de $(0, 0)$ à un point de $\Gamma$ dans cet ensemble serait un chemin dans $S$, ce que la question 1 interdit.

    **3.** Plaçons-nous dans le rectangle ouvert $Q = \, ]-\dfrac{1}{4}, \dfrac{1}{4}[ \times ]-\dfrac{1}{2}, \dfrac{1}{2}[$ et montrons qu'il ne contient aucun voisinage connexe de $(0, 0)$ dans $S$. L'ensemble des $x \in \, ]0, \dfrac{1}{4}[$ tels que $|\sin\dfrac{1}{x}| < \dfrac{1}{2}$ est un ouvert de $\mathbb{R}$, réunion d'intervalles ouverts disjoints $I_{k}$ (exercice 5). Aux extrémités de $I_{k}$, on a $|\sin\dfrac{1}{x}| = \dfrac{1}{2}$ (le point $\dfrac{1}{4}$ n'en est pas une extrémité, car $|\sin 4| > \dfrac{1}{2}$), et ces extrémités sont strictement positives. Notons $\Gamma_{k}$ la partie de $\Gamma$ au-dessus de $I_{k}$. Alors 
    $$S \cap Q = (J \cap Q) \cup \bigcup_{k}\Gamma_{k} .$$
     Chaque arc $\Gamma_{k}$ est ouvert dans $S \cap Q$, car $\Gamma_{k} = (S \cap Q) \cap (I_{k} \times \mathbb{R})$, et fermé dans $S \cap Q$, car les points de $S$ au-dessus des extrémités de $I_{k}$ ont une ordonnée de valeur absolue $\dfrac{1}{2}$ et sortent de $Q$. Une partie connexe de $S \cap Q$ contenant $(0, 0)$ ne rencontre donc aucun $\Gamma_{k}$ : elle est contenue dans $J$. Or $J \cap Q$ n'est pas un voisinage de $(0, 0)$ dans $S$, puisque les points $\big(\dfrac{1}{k\pi}, 0\big)$ de $\Gamma$ tendent vers $(0, 0)$.

    **4.** L'ensemble $S$ est fermé, comme adhérence de $\Gamma$, et borné ; la ligne $L$ est compacte. Donc $W = S \cup L$ est fermé et borné dans $\mathbb{R}^{2}$, donc compact (cours, th. 5). Il est connexe par arcs : on va d'un point de $J$ à $(0, -1)$ le long de $J$, puis à $(1, \sin 1)$ le long de $L$, puis à tout point de $\Gamma$ le long de $\Gamma$. Enfin, $L$ ne rencontre pas le rectangle $Q$, donc $W \cap Q = S \cap Q$, et l'argument de la question 3 montre que $W$ n'est pas localement connexe en $(0, 0)$.

    ![Figure](documents/figures/9fc82c719cfb59a2.svg)

    Le cercle de Varsovie $W$ : le sinus du topologue (graphe $\Gamma$ en bleu, segment $J$ en orange) refermé par la ligne $L$ (en vert). On peut aller de $J$ à $\Gamma$ par $L$, mais jamais à travers le rectangle $Q$ : un chemin ne peut pas faire le tour de $W$. L'échelle verticale est dilatée.
- id: "l3-gt-02-07"
  feuille: "f-l3-gt-02"
  numero: 7
  partie: "Connexité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [connexité]
  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs]
  source: "Bordeaux 2016, feuille 2, exercice 8"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Injections continues d'un intervalle.** Soit $f : \, ]0, 1[ \, \to \mathbb{R}$ une application continue et injective, et $Y = f(]0, 1[)$.

    **1.** Montrer que $f$ est strictement monotone. On pourra raisonner par l'absurde et utiliser le théorème des valeurs intermédiaires.

    **2.** Montrer que $Y$ est un intervalle ouvert et que $f^{-1} : Y \to \, ]0, 1[$ est continue.
  corrige: |
    **1.** L'ensemble $T = \{(x, y) \mid 0 < x < y < 1\}$ est convexe, donc connexe. L'application $\varphi(x, y) = f(y) - f(x)$ est continue sur $T$ et ne s'annule pas, puisque $f$ est injective. Son image est une partie connexe de $\mathbb{R}^{*}$, c'est-à-dire un intervalle ne contenant pas $0$ : $\varphi$ garde un signe constant. Si ce signe est positif, $f$ est strictement croissante ; sinon, strictement décroissante.

    Cette preuve remplace un raisonnement par l'absurde avec trois points $a < b < c$ et le théorème des valeurs intermédiaires ; elle illustre comment la connexité d'un espace auxiliaire donne un résultat sur $f$.

    **2.** Supposons $f$ strictement croissante, l'autre cas s'en déduisant en changeant $f$ en $-f$. L'image $Y$ est connexe, donc un intervalle (cours, th. 2). Elle n'a pas de plus grand élément : si $f(x_{0})$ en était un, on aurait $f(x) > f(x_{0})$ pour $x \in \, ]x_{0}, 1[$. De même, elle n'a pas de plus petit élément : $Y$ est un intervalle ouvert.

    L'application $g = f^{-1} : Y \to \, ]0, 1[$ est strictement croissante. Soient $y_{0} \in Y$, $x_{0} = g(y_{0})$ et $\varepsilon > 0$ assez petit pour que $x_{0} \pm \varepsilon \in \, ]0, 1[$. Posons $y_{\pm} = f(x_{0} \pm \varepsilon)$, de sorte que $y_{-} < y_{0} < y_{+}$. Pour $y \in \, ]y_{-}, y_{+}[$, la croissance de $g$ donne $g(y) \in \, ]x_{0} - \varepsilon, x_{0} + \varepsilon[$ : $g$ est continue en $y_{0}$.

    Le résultat analogue en dimension quelconque, qui affirme qu'une injection continue d'un ouvert de $\mathbb{R}^{n}$ dans $\mathbb{R}^{n}$ est un homéomorphisme sur son image, ouverte, est le théorème d'invariance du domaine de Brouwer, beaucoup plus difficile ; le chapitre 4 en admet une conséquence, l'invariance de la dimension. L'exercice 12 montre que l'hypothèse « intervalle ouvert de $\mathbb{R}$ vers $\mathbb{R}$ » ne peut pas être affaiblie à la légère.
