  enonce: |
    **Fermés emboîtés.** Soit $X$ un espace compact et $(K_{n})_{n \in \mathbb{N}}$ une suite décroissante de fermés non vides de $X$.

    **1.** Montrer que $\mathop{\displaystyle \bigcap_{n \in \mathbb{N}}}K_{n} \neq \varnothing$.

    **2.** En déduire que l'intersection d'une suite décroissante de segments $[a_{n}, b_{n}]$ de $\mathbb{R}$ est non vide. Montrer par des exemples que la conclusion tombe si l'on remplace les segments par des intervalles fermés non bornés, ou par des intervalles bornés non fermés.
  corrige: |
    **1.** Supposons $\mathop{\displaystyle \bigcap_{n}}K_{n} = \varnothing$. Les ouverts $X \setminus K_{n}$ recouvrent alors $X$ ; par compacité, un nombre fini d'entre eux suffit, et comme ils croissent avec $n$, l'un d'eux, $X \setminus K_{N}$, est égal à $X$. Alors $K_{N} = \varnothing$, ce qui contredit l'hypothèse.

    **2.** Les segments $[a_{n}, b_{n}]$ sont des fermés non vides du compact $[a_{0}, b_{0}]$ (cours, th. 3), et leur suite est décroissante : la question 1 s'applique. Avec des intervalles fermés non bornés, $\mathop{\displaystyle \bigcap_{n}}[n, +\infty[ \, = \varnothing$ ; avec des intervalles bornés non fermés, $\mathop{\displaystyle \bigcap_{n \geq 1}}\,]0, \dfrac{1}{n}] = \varnothing$. Dans les deux cas, c'est la compacité qui manque.
