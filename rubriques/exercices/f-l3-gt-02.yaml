  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Boules, sphères, matrices.**

    **1.** Montrer que toute boule ouverte euclidienne de $\mathbb{R}^{n}$ est homéomorphe à $\mathbb{R}^{n}$.

    **2.** Montrer que $\mathbb{R}^{n} \setminus \{0\}$ est connexe par arcs pour $n \geq 2$.

    **3.** En déduire que la sphère $\mathbb{S}^{n}$ est connexe par arcs pour $n \geq 1$.

    **4.** Montrer que le groupe $\mathrm{GL}_{n}(\mathbb{R})$ des matrices inversibles, vu comme partie de $\mathcal{M}_{n}(\mathbb{R}) \simeq \mathbb{R}^{n^{2}}$, n'est pas connexe.
  corrige: |
    **1.** Par translation, il suffit de traiter la boule $B(0, r)$. Les applications 
    $$h : B(0, r) \to \mathbb{R}^{n} , \; h(x) = \frac{x}{r - \lVert x \rVert} \qquad \text{et} \qquad g : \mathbb{R}^{n} \to B(0, r) , \; g(y) = \frac{ry}{1 + \lVert y \rVert}$$
     sont continues. On a bien $\lVert g(y) \rVert = \dfrac{r\lVert y \rVert}{1 + \lVert y \rVert} < r$, puis 
    $$h\big(g(y)\big) = \frac{ry/(1 + \lVert y \rVert)}{r - r\lVert y \rVert/(1 + \lVert y \rVert)} = \frac{ry/(1 + \lVert y \rVert)}{r/(1 + \lVert y \rVert)} = y ,$$
     et l'on vérifie de même que $g\big(h(x)\big) = x$ ; $h$ est un homéomorphisme.

    **2.** Soient $x$ et $y$ non nuls. Si $0 \notin [x, y]$, le segment convient. Sinon, $x$ et $y$ sont sur une même droite vectorielle $\mathbb{R} x$ ; comme $n \geq 2$, il existe $z \notin \mathbb{R} x$, et la ligne brisée $[x, z] \cup [z, y]$ évite $0$, car $0 \in [x, z]$ forcerait $z \in \mathbb{R} x$.

    **3.** L'application $x \mapsto \dfrac{x}{\lVert x \rVert}$ est continue et surjective de $\mathbb{R}^{n+1} \setminus \{0\}$ sur $\mathbb{S}^{n}$. Pour $n \geq 1$, on a $n + 1 \geq 2$ : par la question 2 et la proposition 3 du cours, $\mathbb{S}^{n}$ est connexe par arcs.

    **4.** Le déterminant est une fonction polynomiale des coefficients, donc continue, et il envoie $\mathrm{GL}_{n}(\mathbb{R})$ sur $\mathbb{R}^{*}$ tout entier, puisque $\det\big(\mathrm{diag}(t, 1, \dots, 1)\big) = t$. Si $\mathrm{GL}_{n}(\mathbb{R})$ était connexe, $\mathbb{R}^{*}$ le serait (cours, prop. 1), ce qui contredit le théorème 2. On verra à l'exercice 8 un phénomène voisin pour le groupe orthogonal.
- id: "l3-gt-02-04"
  feuille: "f-l3-gt-02"
  numero: 4
  partie: "Connexité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [connexité]
  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs]
  source: "Bordeaux 2016, feuille 3, exercice 4, question 1"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Chaînes de connexes.**

    **1.** Soit $(S_{i})_{i \in I}$ une famille de parties connexes d'un espace $X$. On suppose que, pour tout couple d'indices $(i, j)$, il existe des indices $i_{0} = i, i_{1}, \dots, i_{n} = j$ tels que $S_{i_{k}} \cap S_{i_{k+1}} \neq \varnothing$ pour $0 \leq k < n$. Montrer que $\mathop{\displaystyle \bigcup_{i \in I}}S_{i}$ est connexe. Retrouver le cas où $\mathop{\displaystyle \bigcap_{i \in I}}S_{i} \neq \varnothing$.

    **2.** Soit $D$ une partie dénombrable de $\mathbb{R}^{2}$. Montrer que $\mathbb{R}^{2} \setminus D$ est connexe par arcs. On pourra, pour deux points $x \neq y$ de $\mathbb{R}^{2} \setminus D$, considérer les lignes brisées $[x, m] \cup [m, y]$, où $m$ décrit la médiatrice de $[x, y]$.
  corrige: |
    **1.** Soit $S = \mathop{\displaystyle \bigcup_{i}}S_{i}$ et $f : S \to \{0, 1\}$ continue. Sa restriction à chaque connexe $S_{i}$ est constante, de valeur notée $c_{i}$. Si $S_{i} \cap S_{j} \neq \varnothing$, un point commun montre que $c_{i} = c_{j}$ ; par la condition de chaîne, $c_{i} = c_{j}$ pour tous $i$ et $j$. Ainsi $f$ est constante, et $S$ est connexe (cours, th. 1). Si les $S_{i}$ ont un point commun, deux d'entre eux se rencontrent toujours : la chaîne $i_{0} = i$, $i_{1} = j$ suffit, et l'on retrouve la proposition 2 du cours.

    **2.** Soient $x \neq y$ deux points de $\mathbb{R}^{2} \setminus D$ et $\Delta$ la médiatrice de $[x, y]$. Pour $m \in \Delta$, notons $\ell_{m} = [x, m] \cup [m, y]$. Deux lignes $\ell_{m}$ et $\ell_{m'}$, pour $m \neq m'$, n'ont en commun que $x$ et $y$. En effet, $[x, m]$ est contenu, en dehors de $m$, dans le demi-plan ouvert de $x$ délimité par $\Delta$, et $[m', y]$ dans celui de $y$ : ils ne peuvent se couper que sur $\Delta$, ce qui exige $m = m'$. Quant à $[x, m]$ et $[x, m']$, ils sont portés par deux droites distinctes issues de $x$, puisque $x \notin \Delta$.

    Tout point de $D$ est donc sur au plus une ligne $\ell_{m}$ (les points $x$ et $y$ ne sont pas dans $D$). Comme $D$ est dénombrable, seules un nombre dénombrable de lignes rencontrent $D$ ; or $\Delta$ est indénombrable. Il existe donc $m$ tel que $\ell_{m}$ évite $D$ : c'est un chemin de $x$ à $y$ dans $\mathbb{R}^{2} \setminus D$.

    ![Figure](documents/figures/8e7a56e6c6f5087a.svg)

    Les lignes brisées $\ell_{m}$ ne se rencontrent qu'en $x$ et $y$. Les points de $D$ (croix) en condamnent au plus une chacun (en pointillés rouges) ; il en reste une infinité indénombrable, dont celle tracée en vert.
- id: "l3-gt-02-05"
  feuille: "f-l3-gt-02"
  numero: 5
