  noeuds: [t-connexe, t-connexe-prop, tr-connexes]
  notions: [connexe, connexe-par-arcs, composante-connexe-par-arcs]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **Groupes classiques.** On note $\mathrm{O}(n) = \{A \in \mathcal{M}_{n}(\mathbb{R}) \mid {A}^{T}A = I_{n}\}$, $\mathrm{SO}(n) = \mathrm{O}(n) \cap \{\det = 1\}$, et, dans $\mathcal{M}_{n}(\mathbb{C}) \simeq \mathbb{R}^{2n^{2}}$, $\mathrm{U}(n) = \{A \mid A^{*}A = I_{n}\}$ et $\mathrm{SU}(n) = \mathrm{U}(n) \cap \{\det = 1\}$. On admet que toute matrice orthogonale s'écrit $PRP^{-1}$, où $P \in \mathrm{O}(n)$ et $R$ est diagonale par blocs, de blocs $(\pm 1)$ et $\begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}$, et que toute matrice unitaire s'écrit $PDP^{-1}$, où $P \in \mathrm{U}(n)$ et $D$ est diagonale.

    **1.** Montrer que $\mathrm{O}(n)$, $\mathrm{SO}(n)$, $\mathrm{U}(n)$ et $\mathrm{SU}(n)$ sont compacts.

    **2.** Montrer que $\mathrm{SO}(n)$, $\mathrm{U}(n)$ et $\mathrm{SU}(n)$ sont connexes par arcs.

    **3.** Montrer que $\mathrm{O}(n)$ a exactement deux composantes connexes. Les décrire pour $n = 2$.
  corrige: |
    **1.** L'application $A \mapsto {A}^{T}A$ est continue, donc $\mathrm{O}(n)$, image réciproque du fermé $\{I_{n}\}$, est fermé. Il est borné, car les colonnes d'une matrice orthogonale sont de norme $1$, d'où $\mathop{\displaystyle \sum_{i, j}}a_{ij}^{2} = n$. Il est donc compact (cours, th. 5). $\mathrm{SO}(n) = \mathrm{O}(n) \cap \det^{-1}(\{1\})$ est un fermé du compact $\mathrm{O}(n)$, donc compact. Les mêmes arguments, avec $A \mapsto A^{*}A$, s'appliquent à $\mathrm{U}(n)$ et $\mathrm{SU}(n)$ dans $\mathcal{M}_{n}(\mathbb{C}) \simeq \mathbb{R}^{2n^{2}}$.

    **2.** $\triangleright$ *$\mathrm{SO}(n)$.* Soit $A \in \mathrm{SO}(n)$, écrite $A = PRP^{-1}$. Le nombre de blocs $(-1)$ de $R$ est pair, puisque $\det R = \det A = 1$ ; on les regroupe deux par deux, et chaque paire forme le bloc de rotation d'angle $\pi$. On peut donc supposer que $R$ n'a que des blocs $(1)$ et des blocs de rotation d'angles $\theta_{1}, \dots, \theta_{p}$. Notons $R_{t}$ la matrice obtenue en remplaçant chaque $\theta_{k}$ par $t\theta_{k}$. Alors $t \mapsto PR_{t}P^{-1}$ est un chemin continu dans $\mathrm{SO}(n)$, de $I_{n}$ à $A$.

    $\triangleright$ *$\mathrm{U}(n)$.* Soit $A = PDP^{-1}$ avec $D = \mathrm{diag}(\mathrm{e}^{\mathrm{i}\theta_{1}}, \dots, \mathrm{e}^{\mathrm{i}\theta_{n}})$, les valeurs propres d'une matrice unitaire étant de module $1$. Le chemin $t \mapsto P\,\mathrm{diag}(\mathrm{e}^{\mathrm{i} t\theta_{1}}, \dots, \mathrm{e}^{\mathrm{i} t\theta_{n}})\,P^{-1}$ reste dans $\mathrm{U}(n)$, puisque $P^{-1} = P^{*}$, et joint $I_{n}$ à $A$.

    $\triangleright$ *$\mathrm{SU}(n)$.* Si de plus $\det A = 1$, alors $\theta_{1} + \dots + \theta_{n} \in 2\pi\mathbb{Z}$ ; en retranchant ce multiple de $2\pi$ à $\theta_{n}$, ce qui ne change pas $D$, on se ramène à $\mathop{\displaystyle \sum}\theta_{k} = 0$. Le chemin précédent est alors de déterminant $\mathrm{e}^{\mathrm{i} t\sum\theta_{k}} = 1$ : il reste dans $\mathrm{SU}(n)$.

    **3.** Le déterminant envoie continûment $\mathrm{O}(n)$ sur $\{-1, 1\}$, et il prend les deux valeurs : $\mathrm{O}(n)$ n'est pas connexe. Soit $S = \mathrm{diag}(-1, 1, \dots, 1)$. L'ensemble $\mathrm{O}^{-}(n)$ des matrices orthogonales de déterminant $-1$ est l'image de $\mathrm{SO}(n)$ par l'application continue $A \mapsto SA$ : il est connexe. Ainsi $\mathrm{O}(n) = \mathrm{SO}(n) \sqcup \mathrm{O}^{-}(n)$ est réunion de deux connexes disjoints, tous deux ouverts et fermés dans $\mathrm{O}(n)$ comme images réciproques de points par le déterminant : ce sont ses deux composantes connexes.

    Pour $n = 2$, $\mathrm{SO}(2)$ est formé des rotations $R(\theta) = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}$, et $\theta \mapsto R(\theta)$ induit un homéomorphisme de $\mathbb{S}^{1}$ sur $\mathrm{SO}(2)$ ; $\mathrm{O}^{-}(2)$ est formé des réflexions $S(\theta) = \begin{pmatrix} \cos\theta & \sin\theta \\ \sin\theta & -\cos\theta \end{pmatrix}$. *$\mathrm{O}(2)$ est la réunion disjointe de deux cercles.* Le chapitre 5 calculera le groupe fondamental de $\mathrm{SO}(2)$.

    ![Figure](documents/figures/9e4de36d3e31c122.svg)

    Le groupe $\mathrm{O}(2)$ a deux composantes, chacune homéomorphe à un cercle : les rotations (en bleu), qui forment un sous-groupe, et les réflexions (en orange), qui n'en forment pas un. Aucun chemin continu ne passe de l'une à l'autre, car le déterminant devrait sauter de $1$ à $-1$.
