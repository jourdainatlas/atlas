  partie: "Chapitre 4 - Les boucles"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [boucles]
  noeuds: [n-recdef]
  notions: [suite]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Prédire ce qu'affiche chacune des boucles suivantes, puis vérifier à la machine.

    ```python
    for i in range(5):
        print(i)
    ```

    ```python
    for i in range(1, 5):
        print(i)
    ```

    ```python
    for i in range(0, 10, 3):
        print(i)
    ```

    ```python
    for i in range(5, 0, -1):
        print(i)
    ```

    ```python
    for i in range(3):
        print("*", end="")
    ```

    Combien de valeurs `range(a, b)` produit-elle, en fonction de `a` et `b` ?
  corrige: |
    ```tableau
    **Boucle** ¦ **Affichage**
    `range(5)` ¦ $0$, $1$, $2$, $3$, $4$ (un par ligne)
    `range(1, 5)` ¦ $1$, $2$, $3$, $4$
    `range(0, 10, 3)` ¦ $0$, $3$, $6$, $9$
    `range(5, 0, -1)` ¦ $5$, $4$, $3$, $2$, $1$
    `range(3)` avec `end=""` ¦ `***` sur une seule ligne
    ```

    **Trois points à retenir.** La borne de départ vaut $0$ par défaut ; la borne d'arrivée est toujours *exclue* ; un pas négatif permet de compter à rebours, mais il faut alors que le départ soit supérieur à l'arrivée. 
    $$\boxed{\texttt{range(a, b)} \text{ produit } b-a \text{ valeurs, de } a \text{ à } b-1.}$$

    C'est la source d'erreur la plus fréquente : pour parcourir $1$ à $10$, il faut écrire `range(1, 11)`.
