  page_enonce: 8
  page_corrige: 14
  enonce: |
    Les deux boucles suivantes parcourent la même liste.

    ```python
    for note in notes:
        print(note)
    ```

    ```python
    for i in range(len(notes)):
        print(notes[i])
    ```

    **1.** Affichent-elles la même chose ?

    **2.** On souhaite maintenant afficher `"La note numéro 3 vaut 15"` pour chaque note. Laquelle des deux boucles faut-il utiliser ? Écrire le programme.

    **3.** On souhaite ajouter $1$ point à chaque note. Écrire le programme. Laquelle des deux boucles convient ?

    **4.** Énoncer une règle simple permettant de choisir entre les deux formes.
  corrige: |
    **1.** Oui, les deux boucles affichent exactement la même chose.

    **2.** Il faut la seconde, car le numéro de la note est l'*indice* :

    ```python
    for i in range(len(notes)):
        print("La note numero", i, "vaut", notes[i])
    ```

    **3.** Il faut également la seconde : pour *modifier* la liste, il faut désigner la case à changer.

    ```python
    for i in range(len(notes)):
        notes[i] = notes[i] + 1
    ```

    La boucle `for note in notes` ne conviendrait pas : `note` est une copie de la valeur, et écrire `note = note + 1` ne modifierait pas la liste.

    **4.** 
    $$\boxed{\begin{array}{l} \text{Parcours par élément : quand on a seulement besoin des \emph{valeurs}.} \\[1mm] \text{Parcours par indice : quand on a besoin de la \emph{position}, ou qu'on veut \emph{modifier}.} \end{array}}$$
- id: "py-01-31"
  feuille: "f-py-01"
  numero: 31
  partie: "Chapitre 6 - Les listes"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [listes]
  noeuds: [r-familles]
  notions: []
  page_enonce: 9
  page_corrige: 15
  enonce: |
    On exécute le programme suivant.

    ```python
    a = [1, 2, 3]
    b = a
    b.append(4)
    print(a)
    print(b)
    ```

    **1.** Prédire l'affichage, puis vérifier à la machine. Expliquer.

    **2.** Modifier le programme pour que `a` reste inchangée.

    **3.** Même question avec le programme suivant. Y a-t-il un piège ? 

    ```python
    x = 5
    y = x
    y = y + 1
    print(x)
    ```

    **4.** Pourquoi le comportement diffère-t-il entre les deux programmes ?
  corrige: |
    **1.** 

    ```sortie
    [1, 2, 3, 4]
    [1, 2, 3, 4]
    ```

    L'instruction `b = a` ne crée pas une nouvelle liste : elle donne un *second nom* à la même liste. Modifier `b` revient donc à modifier `a`.

    **2.** Il faut demander explicitement une copie :

    ```python
    b = a[:]          # ou bien : b = list(a)
    ```

    On obtient alors `[1, 2, 3]` et `[1, 2, 3, 4]`.

    **3.** Le second programme affiche $5$ : aucun piège ici.

    **4.** La différence tient à la nature des objets. Un entier est *immuable* : `y = y + 1` ne modifie pas l'ancien nombre, elle fabrique un nouveau nombre et redirige `y` vers lui, laissant `x` intact. Une liste est *modifiable* : `b.append(4)` transforme la liste elle-même, que tous ses noms voient changer. 
    $$\boxed{\text{Le piège ne concerne que les objets modifiables : listes, et non nombres ou chaînes.}}$$
- id: "py-01-32"
  feuille: "f-py-01"
  numero: 32
  partie: "Chapitre 6 - Les listes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [listes, tri et recherche]
  noeuds: [r-familles, z-ordre]
  notions: []
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Écrire, sans utiliser les fonctions `sum`, `max`, `min` ni `len`, les fonctions suivantes, chacune prenant une liste de nombres en paramètre.

    **1.** `somme(L)`, qui renvoie la somme des éléments.

    **2.** `longueur(L)`, qui renvoie le nombre d'éléments.

    **3.** `moyenne(L)`, qui renvoie la moyenne, en réutilisant les deux précédentes.

    **4.** `minimum(L)`, qui renvoie le plus petit élément.

    **5.** `compte(L, x)`, qui renvoie le nombre d'occurrences de `x` dans `L`.

    **6.** `inverse(L)`, qui renvoie une *nouvelle* liste contenant les éléments de `L` dans l'ordre inverse.
  corrige: |
    ```python
    def somme(L):
        s = 0
        for x in L:
            s = s + x
        return s

    def longueur(L):
        n = 0
        for x in L:
            n = n + 1
        return n

    def moyenne(L):
        return somme(L) / longueur(L)

    def minimum(L):
        m = L[0]
        for x in L:
            if x < m:
                m = x
        return m

    def compte(L, x):
        c = 0
        for element in L:
            if element == x:
                c = c + 1
        return c

    def inverse(L):
        resultat = []
        for i in range(longueur(L) - 1, -1, -1):
            resultat.append(L[i])
        return resultat
    ```

    *Vérification sur* `[3, 7, 3, 1, 9]` : somme $23$, longueur $5$, moyenne $4{,}6$, minimum $1$, `compte(L, 3)` vaut $2$, et `inverse(L)` vaut `[9, 1, 3, 7, 3]`.

    **Deux remarques.** Dans `minimum`, on initialise avec `L[0]` et non avec $0$ : une liste peut ne contenir que des nombres négatifs. Et `inverse` construit une *nouvelle* liste, conformément à l'énoncé : la liste de départ n'est pas touchée.
