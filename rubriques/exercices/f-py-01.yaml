  enonce: |
    **1.** Écrire, selon l'algorithme du tri par sélection, une fonction `tri_selection(L)` qui trie une liste par ordre croissant.

    **2.** Faire afficher la liste après chaque échange, et vérifier le déroulement sur `[5, 2, 8, 1, 9, 3]`.

    **3.** Combien de comparaisons le tri effectue-t-il sur une liste de $n$ éléments ? Vérifier sur des listes de tailles $5$, $10$ et $20$ en ajoutant un compteur.

    **4.** Modifier la fonction pour qu'elle trie dans l'ordre décroissant.
  corrige: |
    **1.** À chaque tour, on cherche le minimum de la partie non encore triée et on l'échange avec le premier élément de cette partie :

    ```python
    def tri_selection(L):
        for i in range(len(L) - 1):
            imin = i
            for j in range(i + 1, len(L)):
                if L[j] < L[imin]:
                    imin = j
            L[i], L[imin] = L[imin], L[i]
        return L
    ```

    **2.** En ajoutant `print(L)` après l'échange, on suit le déroulement sur `[5, 2, 8, 1, 9, 3]` :

    ```sortie
    [1, 2, 8, 5, 9, 3]
    [1, 2, 8, 5, 9, 3]
    [1, 2, 3, 5, 9, 8]
    [1, 2, 3, 5, 9, 8]
    [1, 2, 3, 5, 8, 9]
    ```

    On observe que certains tours n'échangent rien : c'est le cas lorsque le minimum est déjà à sa place, l'échange se faisant alors d'un élément avec lui-même.

    **3.** Le premier tour effectue $n-1$ comparaisons, le deuxième $n-2$, et ainsi de suite : 
    $$(n-1)+(n-2)+\dots+2+1=\frac{n(n-1)}{2}$$

    $$\begin{array}{|c|c|c|} \hline n & \text{Comparaisons mesurées} & \dfrac{n(n-1)}{2} \\ \hline 5 & 10 & 10 \\ \hline 10 & 45 & 45 \\ \hline 20 & 190 & 190 \\ \hline \end{array}$$

    Ce nombre ne dépend pas de la liste : le tri par sélection effectue toujours le même nombre de comparaisons, que la liste soit déjà triée ou non.

    **4.** Il suffit d'inverser le test, en cherchant le maximum au lieu du minimum :

    ```python
    if L[j] > L[imax]:
    ```
- id: "py-01-38"
