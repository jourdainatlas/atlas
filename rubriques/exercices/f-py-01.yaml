  enonce: |
    **Le nombre mystère.** L'ordinateur choisit au hasard un entier compris entre $1$ et $100$, et l'utilisateur doit le deviner.

    **1.** Écrire un programme qui choisit le nombre, puis demande des propositions à l'utilisateur en répondant « trop grand », « trop petit » ou « gagné », jusqu'à ce qu'il trouve.

    **2.** Ajouter un compteur de tentatives, affiché à la fin.

    **3.** Limiter le nombre de tentatives à sept. Afficher le nombre cherché si l'utilisateur échoue.

    **4.** *Inverser les rôles.* Écrire un programme dans lequel c'est l'*ordinateur* qui devine un nombre choisi par l'utilisateur, celui-ci répondant par `"+"`, `"-"` ou `"="`. Quelle stratégie l'ordinateur doit-il suivre pour gagner à coup sûr en au plus sept coups ?

    **5.** Justifier le nombre sept, en reprenant le raisonnement de la dichotomie.
  corrige: |
    **1.** 

    ```python
    from random import randint

    secret = randint(1, 100)
    proposition = int(input("Votre proposition : "))

    while proposition != secret:
        if proposition > secret:
            print("Trop grand")
        else:
            print("Trop petit")
        proposition = int(input("Votre proposition : "))

    print("Gagne !")
    ```

    La première lecture doit avoir lieu *avant* la boucle, sinon la condition porterait sur une variable inexistante. La seconde, à la fin du corps, prépare le tour suivant.

    **2.** 

    ```python
    coups = 1
    while proposition != secret:
        ...
        proposition = int(input("Votre proposition : "))
        coups = coups + 1

    print("Gagne en", coups, "coups !")
    ```

    **3.** On ajoute une seconde condition d'arrêt :

    ```python
    while proposition != secret and coups < 7:
        ...

    if proposition == secret:
        print("Gagne en", coups, "coups !")
    else:
        print("Perdu ! Le nombre etait", secret)
    ```

    **4.** L'ordinateur doit couper l'intervalle en deux à chaque coup :

    ```python
    a = 1
    b = 100
    reponse = ""

    while reponse != "=":
        milieu = (a + b) // 2
        print("Est-ce", milieu, "?")
        reponse = input("Tapez +, - ou = : ")
        if reponse == "+":
            a = milieu + 1        # le nombre est plus grand
        elif reponse == "-":
            b = milieu - 1        # il est plus petit

    print("Trouve :", milieu)
    ```

    **Attention** aux `+ 1` et `- 1` : sans eux, le milieu déjà testé resterait dans l'intervalle et la boucle pourrait ne jamais s'arrêter.

    **5.** À chaque question, le nombre de candidats est divisé par deux. En partant de $100$ candidats : 
    $$100 \to 50 \to 25 \to 13 \to 7 \to 4 \to 2 \to 1$$
     Il faut donc au plus sept questions. On peut aussi raisonner par les puissances de $2$ : 
    $$2^6=64<100 \leqslant 128=2^7$$

    $$\boxed{\text{Sept questions suffisent, et six ne suffiraient pas toujours.}}$$
     Un programme testant les cent valeurs possibles confirme que le pire cas vaut exactement sept coups.
- id: "py-01-40"
  feuille: "f-py-01"
  numero: 40
  partie: "Problèmes"
  etoiles: 3
  types: [Algorithmique]
  mots_cles: [chiffrement]
  noeuds: [z-zn]
  notions: []
  page_enonce: 11
  page_corrige: 20
  enonce: |
    **Le chiffre de César.** Pour chiffrer un message, on décale chaque lettre de $k$ rangs dans l'alphabet, en revenant au début après `z`.

    **1.** Les fonctions `ord` et `chr` convertissent une lettre en son code et réciproquement. Que valent `ord("a")` et `chr(100)` ?

    **2.** Écrire une fonction `decale(lettre, k)` qui renvoie la lettre décalée de `k` rangs. On ne traitera que les minuscules, et l'on prendra garde au retour au début de l'alphabet.

    **3.** Écrire une fonction `chiffre(message, k)` qui chiffre un message entier. Les caractères qui ne sont pas des minuscules seront laissés inchangés.

    **4.** Écrire la fonction `dechiffre(message, k)`. Comment s'écrit-elle en une ligne à partir de la précédente ?

    **5.** Le message `"dpvu tvs mf uspof"` a été chiffré avec $k=1$. Le déchiffrer.

    **6.** *Casser le code.* Écrire un programme qui, ne connaissant pas $k$, affiche les $25$ déchiffrements possibles d'un message. Tester sur `"yhql ylgl ylfl"`.
  corrige: |
    **1.** `ord("a")` vaut $97$, et `chr(100)` vaut `"d"`. Les vingt-six minuscules occupent les codes $97$ à $122$, dans l'ordre alphabétique.

    **2.** On se ramène à un rang entre $0$ et $25$, on décale, puis on revient à une lettre :

    ```python
    def decale(lettre, k):
        if "a" <= lettre <= "z":
            rang = ord(lettre) - ord("a")     # entre 0 et 25
            nouveau = (rang + k) % 26         # le modulo referme l'alphabet
            return chr(nouveau + ord("a"))
        return lettre
    ```

    C'est le `% 26` qui fait revenir au début : avec $k=1$, la lettre `z` a pour rang $25$, et $(25+1) \bmod 26=0$, c'est-à-dire `a`.

    **3.** 

    ```python
    def chiffre(message, k):
        resultat = ""
        for lettre in message:
            resultat = resultat + decale(lettre, k)
        return resultat
    ```

    Les espaces et la ponctuation traversent `decale` sans être modifiés, grâce au `return lettre` final.

    **4.** Déchiffrer revient à décaler dans l'autre sens :

    ```python
    def dechiffre(message, k):
        return chiffre(message, -k)
    ```

    Le `% 26` accepte les valeurs négatives et referme l'alphabet de la même façon.

    **5.** 

    ```sortie
    >>> dechiffre("dpvu tvs mf uspof", 1)
    'cout sur le trone'
    ```

    **6.** Il n'y a que vingt-cinq clés possibles : on peut toutes les essayer.

    ```python
    message = "yhql ylgl ylfl"
    for k in range(1, 26):
        print(k, ":", dechiffre(message, k))
    ```

    La clé $k=3$ donne un texte qui a un sens :

    ```sortie
    3 : veni vidi vici
    ```

    $$\boxed{\text{Le chiffre de César ne résiste pas : vingt-cinq essais suffisent à le casser.}}$$
     C'est la faiblesse de fond de cette méthode : la clé appartient à un ensemble minuscule, que l'on parcourt entièrement en une fraction de seconde.
