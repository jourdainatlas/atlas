  enonce: |
    Le programme suivant devrait afficher la mention obtenue au baccalauréat, mais il comporte *quatre* erreurs.

    ```python
    note = input("Votre note : ")
    if note >= 16
        print("Mention très bien")
    elif note >= 14:
    print("Mention bien")
    elif note >= 12:
        print("Mention assez bien")
    else:
        print("Pas de mention")
    ```

    **1.** Repérer les quatre erreurs et préciser, pour chacune, le message que Python afficherait.

    **2.** Écrire la version corrigée.

    **3.** Tester avec les notes $16$, $14$, $12$ et $8$. Que se passe-t-il avec la note $20$ ? Et avec $-3$ ?

    **4.** Ajouter un test qui refuse les notes hors de l'intervalle $[0\,;20]$.
  corrige: |
    **1.** Les quatre erreurs :

    ```tableau
    **Ligne** ¦ **Erreur** ¦ **Message**
    1 ¦ `input` renvoie du texte ¦ `TypeError` à la comparaison
    2 ¦ deux-points manquants ¦ `SyntaxError`
    5 ¦ `print` non indenté ¦ `IndentationError`
    --- ¦ aucun contrôle de validité ¦ pas d'erreur, mais un résultat faux
    ```

    **2.** 

    ```python
    note = float(input("Votre note : "))

    if note >= 16:
        print("Mention tres bien")
    elif note >= 14:
        print("Mention bien")
    elif note >= 12:
        print("Mention assez bien")
    else:
        print("Pas de mention")
    ```

    **3.** Les notes $16$, $14$ et $12$ donnent respectivement les trois mentions, et $8$ n'en donne aucune. La note $20$ affiche « Mention très bien », ce qui est correct ; mais $-3$ affiche « Pas de mention », sans signaler que la note est absurde.

    **4.** 

    ```python
    note = float(input("Votre note : "))

    if note < 0 or note > 20:
        print("Note invalide")
    elif note >= 16:
        print("Mention tres bien")
    elif note >= 14:
        print("Mention bien")
    elif note >= 12:
        print("Mention assez bien")
    else:
        print("Pas de mention")
    ```

    Le test de validité doit venir *en premier* : placé à la fin, il ne serait jamais atteint, puisque l'une des branches précédentes aurait déjà été exécutée.
- id: "py-01-14"
  feuille: "f-py-01"
