  enonce: |
    **1.** Écrire un programme qui affiche la table de multiplication de $7$, de $7\times 1$ à $7\times 10$.

    **2.** Le modifier pour qu'il demande à l'utilisateur la table qu'il souhaite afficher.

    **3.** Écrire un programme qui calcule et affiche la somme des entiers de $1$ à $100$.

    **4.** Écrire un programme qui calcule le produit des entiers de $1$ à $10$, c'est-à-dire $10!$.
  corrige: |
    **1.** 

    ```python
    for i in range(1, 11):
        print(7, "x", i, "=", 7 * i)
    ```

    **2.** 

    ```python
    table = int(input("Quelle table ? "))
    for i in range(1, 11):
        print(table, "x", i, "=", table * i)
    ```

    **3.** On utilise un *accumulateur*, initialisé à $0$ avant la boucle :

    ```python
    somme = 0
    for i in range(1, 101):
        somme = somme + i
    print("La somme vaut", somme)
    ```

    ```sortie
    La somme vaut 5050
    ```

    **4.** Pour un produit, l'accumulateur s'initialise à $1$ et non à $0$ :

    ```python
    produit = 1
    for i in range(1, 11):
        produit = produit * i
    print("10! =", produit)
    ```

    ```sortie
    10! = 3628800
    ```

    **Le piège.** Initialiser le produit à $0$ donnerait $0$, puisque tout produit par zéro est nul. L'élément neutre dépend de l'opération : $0$ pour une somme, $1$ pour un produit.
- id: "py-01-18"
  feuille: "f-py-01"
  numero: 18
  partie: "Chapitre 4 - Les boucles"
  etoiles: 2
  types: [Algorithmique, Calcul]
  mots_cles: [boucles, suites récurrentes]
  noeuds: [n-recdef]
  notions: [suite]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On considère la suite définie par $u_0=3$ et, pour tout entier $n$, $u_{n+1}=2u_n-5$.

    **1.** Calculer à la main $u_1$, $u_2$ et $u_3$.

    **2.** Écrire un programme qui affiche les dix premiers termes de la suite.

    **3.** Modifier le programme pour qu'il demande $n$ à l'utilisateur et affiche uniquement $u_n$.

    **4.** La suite semble-t-elle croissante ? Que se passe-t-il si l'on remplace $u_0=3$ par $u_0=5$ ? Par $u_0=6$ ? Commenter.
  corrige: |
    **1.** $u_1=2\times 3-5=1$, puis $u_2=2\times 1-5=-3$, puis $u_3=2\times(-3)-5=-11$.

    **2.** 

    ```python
    u = 3
    for n in range(10):
        print("u", n, "=", u)
        u = 2 * u - 5
    ```

    L'ordre est essentiel : on affiche $u_n$ *avant* de calculer $u_{n+1}$, faute de quoi le premier terme n'apparaîtrait jamais.

    **3.** 

    ```python
    n = int(input("Quel rang ? "))
    u = 3
    for i in range(n):
        u = 2 * u - 5
    print("u", n, "=", u)
    ```

    **4.** Les dix premiers termes valent : 
    $$3 \,;\, 1 \,;\, -3 \,;\, -11 \,;\, -27 \,;\, -59 \,;\, -123 \,;\, -251 \,;\, -507 \,;\, -1019$$
     La suite est donc *décroissante*, et semble tendre vers $-\infty$.

    Avec $u_0=5$, tous les termes valent $5$ : la suite est constante, car $2\times 5-5=5$. Le nombre $5$ est un *point fixe* de la relation.

    Avec $u_0=6$, la suite croît : $6$, $7$, $9$, $13$, $21$, $37$, … 
    $$\boxed{\text{Le comportement dépend entièrement de la position de } u_0 \text{ par rapport à } 5.}$$
