  enonce: |
    **1.** Écrire une fonction `pgcd(a, b)` renvoyant le PGCD de deux entiers positifs, en appliquant l'algorithme d'Euclide.

    **2.** Écrire une fonction `ppcm(a, b)`, en utilisant la relation $\mathrm{pgcd}(a\,;b)\times\mathrm{ppcm}(a\,;b)=a\times b$.

    **3.** Écrire une fonction `simplifie(a, b)` qui renvoie les deux termes de la fraction $\dfrac{a}{b}$ rendue irréductible.

    **4.** Tester avec $\dfrac{252}{300}$, puis avec $\dfrac{1001}{1430}$.

    **5.** Écrire une fonction `sont_premiers_entre_eux(a, b)` en réutilisant `pgcd`.
  corrige: |
    **1.** L'algorithme d'Euclide remplace le couple $(a\,;b)$ par $(b\,;a \bmod b)$ jusqu'à ce que le reste soit nul :

    ```python
    def pgcd(a, b):
        while b != 0:
            a, b = b, a % b
        return a
    ```

    **2.** 

    ```python
    def ppcm(a, b):
        return a * b // pgcd(a, b)
    ```

    On utilise `//` et non `/` : le quotient est exact, et l'on souhaite un entier.

    **3.** 

    ```python
    def simplifie(a, b):
        d = pgcd(a, b)
        return a // d, b // d
    ```

    **4.** 

    ```sortie
    >>> simplifie(252, 300)
    (21, 25)
    >>> simplifie(1001, 1430)
    (7, 10)
    ```

    Les PGCD valent respectivement $12$ et $143$.

    **5.** 

    ```python
    def sont_premiers_entre_eux(a, b):
        return pgcd(a, b) == 1
    ```

    **L'intérêt des fonctions apparaît ici.** Les quatre dernières s'appuient toutes sur `pgcd`, écrite une seule fois. Si l'on découvrait une erreur dans l'algorithme d'Euclide, une seule correction suffirait à réparer l'ensemble.
