  enonce: |
    **1.** Écrire un programme qui demande trois longueurs et indique si elles peuvent être celles des côtés d'un triangle. On rappelle que c'est le cas lorsque chaque longueur est inférieure à la somme des deux autres.

    **2.** Compléter le programme pour qu'il précise, le cas échéant, si le triangle est rectangle, en utilisant la réciproque du théorème de Pythagore.

    **3.** Le compléter encore pour qu'il indique si le triangle est isocèle ou équilatéral.

    **4.** Tester avec $(3\,;4\,;5)$, $(2\,;2\,;2)$, $(1\,;1\,;5)$ et $(5\,;5\,;7)$.
  corrige: |
    ```python
    a = float(input("Premier cote : "))
    b = float(input("Deuxieme cote : "))
    c = float(input("Troisieme cote : "))

    if a < b + c and b < a + c and c < a + b:
        print("Ces longueurs forment un triangle.")

        # triangle rectangle : reciproque de Pythagore
        if a**2 == b**2 + c**2 or b**2 == a**2 + c**2 or c**2 == a**2 + b**2:
            print("Il est rectangle.")

        # cas particuliers
        if a == b and b == c:
            print("Il est equilateral.")
        elif a == b or b == c or a == c:
            print("Il est isocele.")
    else:
        print("Ces longueurs ne forment pas un triangle.")
    ```

    $$\begin{array}{|c|l|} \hline \text{Test} & \text{Réponse} \\ \hline (3\,;4\,;5) & \text{triangle, rectangle} \\ \hline (2\,;2\,;2) & \text{triangle, équilatéral} \\ \hline (1\,;1\,;5) & \text{pas un triangle, car }5 > 1+1 \\ \hline (5\,;5\,;7) & \text{triangle, isocèle} \\ \hline \end{array}$$

    **Attention** à l'ordre du dernier test : `elif` garantit qu'un triangle équilatéral n'est pas aussi annoncé comme isocèle. Avec deux `if` indépendants, les deux messages s'afficheraient.
- id: "py-01-15"
  feuille: "f-py-01"
  numero: 15
  partie: "Chapitre 3 - Tests et conditions"
  etoiles: 3
