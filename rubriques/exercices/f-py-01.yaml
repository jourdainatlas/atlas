- id: "py-01-01"
  feuille: "f-py-01"
  numero: 1
  partie: "Chapitre 1 - Découvrir Python"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [premiers programmes, erreurs]
  noeuds: [l-syntaxe]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacun des programmes suivants, Python affiche un message d'erreur. Donner le *type* de l'erreur, indiquer la ligne fautive, puis proposer une correction.

    ```python
    # programme a
    print("Bonjour)
    ```

    ```python
    # programme b
    age = 15
    print("Vous avez", agee, "ans")
    ```

    ```python
    # programme c
    n = input("Un entier : ")
    print(n + 1)
    ```

    ```python
    # programme d
    if 3 > 2:
    print("Trois est plus grand")
    ```

    ```python
    # programme e
    a = 10
    b = 0
    print(a / b)
    ```
  corrige: |
    ```tableau
     ¦ **Type d'erreur** ¦ **Cause**
    **a** ¦ `SyntaxError` ¦ guillemet fermant manquant
    **b** ¦ `NameError` ¦ la variable `agee` n'existe pas
    **c** ¦ `TypeError` ¦ `input` renvoie du texte, pas un nombre
    **d** ¦ `IndentationError` ¦ le bloc du `if` n'est pas indenté
    **e** ¦ `ZeroDivisionError` ¦ division par zéro
    ```

    Les corrections :

    ```python
    print("Bonjour")                  # a : on ferme le guillemet

    age = 15                          # b : on corrige la faute de frappe
    print("Vous avez", age, "ans")

    n = int(input("Un entier : "))    # c : on convertit en entier
    print(n + 1)

    if 3 > 2:                         # d : on indente le bloc
        print("Trois est plus grand")
    ```

    Pour **e**, il n'y a pas de correction *syntaxique* : il faut décider ce que le programme doit faire lorsque `b` vaut $0$, par exemple afficher un message.

    **À retenir.** Les trois premières erreurs sont détectées à des moments différents : `SyntaxError` avant même l'exécution, les deux autres pendant. C'est pourquoi le programme **b** affiche parfois quelque chose avant de s'arrêter.
- id: "py-01-02"
  feuille: "f-py-01"
  numero: 2
  partie: "Chapitre 1 - Découvrir Python"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [premiers programmes]
  noeuds: [l-syntaxe]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Prédire, *sans machine*, ce que chacune de ces instructions affiche. On distinguera bien les guillemets.

    ```python
    print(3 + 4)
    print("3 + 4")
    print("3" + "4")
    print(2 * 5)
    print("2" * 5)
    print("Bonjour", "Marie")
    print("Bonjour" + "Marie")
    ```

    Vérifier ensuite les réponses à la machine, et expliquer les deux résultats qui surprennent le plus.
  corrige: |
    ```sortie
    7
    3 + 4
    34
    10
    22222
    Bonjour Marie
    BonjourMarie
    ```

    **1.** Sans guillemets, `3 + 4` est un *calcul* : Python affiche $7$. Avec guillemets, `"3 + 4"` est un *texte* : Python le recopie tel quel.

    **2.** Les deux résultats qui surprennent sont `"3" + "4"`, qui donne `34` et non $7$, et `"2" * 5`, qui donne `22222` et non $10$.

    Sur les chaînes de caractères, le signe `+` ne signifie pas « additionner » mais « coller bout à bout », et `*` signifie « répéter ». Le même symbole a donc deux sens, selon le *type* de ce qui l'entoure.

    On notera aussi la différence entre la virgule et le `+` dans `print` : la virgule insère automatiquement une espace, pas le `+`.
- id: "py-01-03"
  feuille: "f-py-01"
  numero: 3
  partie: "Chapitre 1 - Découvrir Python"
  etoiles: 1
  types: [Algorithmique, Démonstration]
  mots_cles: [premiers programmes]
  noeuds: [l-syntaxe]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Le programme suivant calcule le prix TTC d'un article, mais il est illisible.

    ```python
    p=45.9
    t=0.2
    r=p*(1+t)
    print(r)
    ```

    **1.** Exécuter le programme et noter ce qu'il affiche.

    **2.** Le réécrire en donnant aux variables des noms explicites, en ajoutant des commentaires utiles, et en rendant l'affichage compréhensible pour l'utilisateur.

    **3.** Combien de commentaires avez-vous écrits ? Un commentaire tel que `# on multiplie p par 1+t` vous paraît-il utile ? Justifier.
  corrige: |
    **1.** Le programme affiche `55.08`, sans aucune indication de ce que ce nombre représente.

    **2.** Une réécriture possible :

    ```python
    # Calcul du prix TTC d'un article a partir de son prix hors taxes

    prix_ht = 45.9          # prix hors taxes, en euros
    taux_tva = 0.2          # taux de TVA : 20 %

    prix_ttc = prix_ht * (1 + taux_tva)

    print("Prix TTC :", prix_ttc, "euros")
    ```

    **3.** Trois commentaires suffisent : un pour dire ce que fait le programme, deux pour préciser l'unité et la signification des données. 
    $$\boxed{\text{Le commentaire } \texttt{\# on multiplie p par 1+t} \text{ est inutile.}}$$
     Il ne fait que répéter en français ce que le code dit déjà. Un bon commentaire explique le *pourquoi*, pas le *comment* : ici, que $1+t$ correspond au prix augmenté de la TVA.
- id: "py-01-04"
  feuille: "f-py-01"
  numero: 4
  partie: "Chapitre 1 - Découvrir Python"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [premiers programmes]
  noeuds: [l-syntaxe]
  notions: []
  page_enonce: 2
  page_corrige: 2
  enonce: |
    On travaille d'abord dans la *console*, puis dans un *script*.

    **1.** Dans la console, on saisit successivement les trois lignes suivantes. Qu'affiche la console à chaque fois ? 

    ```python
    2 + 3
    x = 7
    x * 2
    ```

    **2.** On écrit maintenant ces trois mêmes lignes dans un script, que l'on exécute. Qu'affiche l'écran ? Expliquer la différence.

    **3.** Modifier le script pour qu'il affiche les mêmes résultats que la console.

    **4.** Dans quel cas la console est-elle préférable au script ? Et l'inverse ?
  corrige: |
    **1.** Dans la console, chaque ligne saisie qui produit une valeur voit son résultat affiché automatiquement :

    ```sortie
    >>> 2 + 3
    5
    >>> x = 7
    >>> x * 2
    14
    ```

    La ligne `x = 7` n'affiche rien : une affectation ne *produit* pas de valeur, elle range une valeur quelque part.

    **2.** Exécuté comme script, le programme n'affiche *rien du tout*. Les calculs sont bien effectués, mais rien ne demande de les montrer. 
    $$\boxed{\text{Dans un script, seul } \texttt{print} \text{ affiche quelque chose.}}$$

    **3.** 

    ```python
    print(2 + 3)
    x = 7
    print(x * 2)
    ```

    **4.** La console convient pour tester une idée, vérifier une syntaxe ou faire un calcul ponctuel : la réponse est immédiate et rien n'est conservé. Le script convient dès qu'un programme doit être relu, corrigé, réexécuté ou transmis.
- id: "py-01-05"
  feuille: "f-py-01"
  numero: 5
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [variables et calculs]
  noeuds: [z-division]
  notions: [division-euclidienne, trace]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Recopier et compléter le tableau de trace du programme ci-dessous, en indiquant la valeur de chaque variable après chaque ligne.

    ```python
    a = 5
    b = 3
    a = a + b
    b = a - b
    a = a - b
    print(a, b)
    ```

    $$\begin{array}{|c|c|c|} \hline \text{Ligne} & \text{a} & \text{b} \\ \hline \text{1} & 5 & \text{---} \\ \hline \text{2} &  &  \\ \hline \text{3} &  &  \\ \hline \text{4} &  &  \\ \hline \text{5} &  &  \\ \hline \end{array}$$

    Que réalise ce programme ? Écrire une version plus courte qui produit le même effet.
  corrige: |
    ```tableau
    **Ligne** ¦ **Instruction** ¦ **a** ¦ **b**
    1 ¦ `a = 5` ¦ $5$ ¦ ---
    2 ¦ `b = 3` ¦ $5$ ¦ $3$
    3 ¦ `a = a + b` ¦ $8$ ¦ $3$
    4 ¦ `b = a - b` ¦ $8$ ¦ $5$
    5 ¦ `a = a - b` ¦ $3$ ¦ $5$
    ```

    Le programme affiche `3 5` : il a *échangé* le contenu des deux variables, sans utiliser de variable auxiliaire. L'astuce consiste à stocker temporairement la somme dans `a`.

    Version plus courte, propre à Python :

    ```python
    a, b = b, a
    ```

    **Le piège.** L'ordre des lignes 3 à 5 est impératif. Le débutant écrit souvent `a = b` puis `b = a`, ce qui perd la valeur initiale de `a` dès la première ligne : les deux variables valent alors $3$.
- id: "py-01-06"
  feuille: "f-py-01"
  numero: 6
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 1
  types: [Algorithmique, Démonstration]
  mots_cles: [variables et calculs]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Parmi les noms suivants, lesquels sont des noms de variables valides en Python ? Pour les autres, préciser pourquoi.

    `prix` `2eme_note` `note2` `prix total` `prix_total` `print` `Prix` `if` `_x`

    **2.** Parmi les noms valides, lesquels sont de *bons* noms pour stocker la moyenne d'un élève ? Justifier.

    **3.** Que se passe-t-il si l'on écrit `print = 5` puis `print("Bonjour")` ?
  corrige: |
    **1.**

    ```tableau
    **Nom** ¦ **Valide ?** ¦ **Raison**
    `prix` ¦ oui ¦ 
    `2eme_note` ¦ **non** ¦ commence par un chiffre
    `note2` ¦ oui ¦ un chiffre est permis, mais pas en tête
    `prix total` ¦ **non** ¦ contient une espace
    `prix_total` ¦ oui ¦ 
    `print` ¦ valide, mais à proscrire ¦ masque la fonction `print`
    `Prix` ¦ oui ¦ différent de `prix` : la casse compte
    `if` ¦ **non** ¦ mot réservé du langage
    `_x` ¦ oui ¦ le tiret bas est autorisé en tête
    ```

    **2.** `moyenne` serait le meilleur nom. Parmi ceux proposés, aucun n'est explicite : `prix` et `note2` induiraient le lecteur en erreur.

    **3.** Après `print = 5`, le nom `print` ne désigne plus la fonction d'affichage mais l'entier $5$. L'instruction `print("Bonjour")` provoque alors :

    ```sortie
    TypeError: 'int' object is not callable
    ```

    Python tente en effet d'« appeler » le nombre $5$ comme une fonction. L'erreur est d'autant plus déroutante qu'elle survient sur une ligne parfaitement correcte.
- id: "py-01-07"
  feuille: "f-py-01"
  numero: 7
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [variables et calculs]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Donner, sans machine, le type de chacune des expressions suivantes, puis sa valeur.

    ```python
    7 / 2
    7 // 2
    7 % 2
    7.0 // 2
    2 ** 10
    int("12") + 3
    float("3.5") * 2
    str(12) + "3"
    int(7 / 2)
    round(7 / 2)
    ```

    Deux de ces expressions donnent la même valeur mais pas le même type : lesquelles ?
  corrige: |
    ```tableau
    **Expression** ¦ **Type** ¦ **Valeur** ¦ **Expression** ¦ **Type** ¦ **Valeur**
    `7 / 2` ¦ `float` ¦ $3.5$ ¦ `int("12") + 3` ¦ `int` ¦ $15$
    `7 // 2` ¦ `int` ¦ $3$ ¦ `float("3.5") * 2` ¦ `float` ¦ $7.0$
    `7 % 2` ¦ `int` ¦ $1$ ¦ `str(12) + "3"` ¦ `str` ¦ `"123"`
    `7.0 // 2` ¦ `float` ¦ $3.0$ ¦ `int(7 / 2)` ¦ `int` ¦ $3$
    `2 ** 10` ¦ `int` ¦ $1024$ ¦ `round(7 / 2)` ¦ `int` ¦ $4$
    ```

    **Les deux expressions de même valeur mais de types différents** sont `7 // 2`, qui vaut $3$ (entier), et `7.0 // 2`, qui vaut $3.0$ (flottant). Dès qu'un flottant intervient, le résultat est flottant, même si la valeur est entière.

    **Deux pièges.**

    • `int(7 / 2)` vaut $3$ et `round(7 / 2)` vaut $4$ : `int` *tronque* vers zéro, `round` *arrondit*. Ils diffèrent dès que la partie décimale atteint $0{,}5$.

    • `str(12) + "3"` donne `"123"` et non `"15"` : une fois convertis en texte, les nombres se collent au lieu de s'ajouter.
- id: "py-01-08"
  feuille: "f-py-01"
  numero: 8
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [variables et calculs, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Écrire un programme qui demande à l'utilisateur un nombre de minutes, puis affiche la conversion en heures et minutes. Par exemple, pour $200$ minutes, il affichera `3 h 20 min`.

    **2.** Adapter le programme pour qu'il traite un nombre de secondes et affiche des heures, des minutes et des secondes.

    **3.** Tester avec $3\,725$ secondes. Le résultat attendu est `1 h 2 min 5 s`.
  corrige: |
    **1.** La division entière donne les heures, le reste donne les minutes :

    ```python
    minutes = int(input("Nombre de minutes : "))

    heures = minutes // 60
    reste = minutes % 60

    print(heures, "h", reste, "min")
    ```

    ```sortie
    Nombre de minutes : 200
    3 h 20 min
    ```

    **2.** On applique deux fois le même principe : d'abord les heures, puis les minutes sur ce qui reste.

    ```python
    total = int(input("Nombre de secondes : "))

    heures = total // 3600
    reste = total % 3600
    minutes = reste // 60
    secondes = reste % 60

    print(heures, "h", minutes, "min", secondes, "s")
    ```

    **3.** 

    ```sortie
    Nombre de secondes : 3725
    1 h 2 min 5 s
    ```

    *Vérification :* $3\,725=1\times 3600+2\times 60+5$ ✓
- id: "py-01-09"
  feuille: "f-py-01"
  numero: 9
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [variables et calculs]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Écrire un programme qui demande les coordonnées de deux points $A$ et $B$ du plan, puis affiche la distance $AB$. On importera le module `math`.

    **2.** Améliorer l'affichage pour n'afficher que deux décimales.

    **3.** Ajouter le calcul et l'affichage des coordonnées du milieu de $[AB]$.

    **4.** Tester avec $A(1\,;2)$ et $B(4\,;6)$ : la distance doit valoir $5$.
  corrige: |
    ```python
    from math import sqrt

    xa = float(input("xA : "))
    ya = float(input("yA : "))
    xb = float(input("xB : "))
    yb = float(input("yB : "))

    distance = sqrt((xb - xa) ** 2 + (yb - ya) ** 2)

    print("AB =", round(distance, 2))
    print("Milieu :", (xa + xb) / 2, ";", (ya + yb) / 2)
    ```

    ```sortie
    xA : 1
    yA : 2
    xB : 4
    yB : 6
    AB = 5.0
    Milieu : 2.5 ; 4.0
    ```

    On utilise `float` et non `int` : les coordonnées peuvent être décimales. La fonction `round(x, 2)` arrondit à deux décimales.

    **Attention** à ne pas écrire `sqrt(xb - xa ** 2 + ...)` : les parenthèses sont indispensables, car `**` est prioritaire sur la soustraction.
- id: "py-01-10"
  feuille: "f-py-01"
  numero: 10
  partie: "Chapitre 2 - Variables, types et calculs"
  etoiles: 3
  types: [Algorithmique, Démonstration]
  mots_cles: [variables et calculs]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un commerçant applique deux remises successives sur un article : d'abord $20\,\%$, puis $10\,\%$ sur le prix déjà réduit.

    **1.** Écrire un programme qui demande le prix initial et affiche le prix final.

    **2.** Un client affirme que cela revient à une remise de $30\,\%$. A-t-il raison ? Modifier le programme pour qu'il affiche également le pourcentage de remise *global*.

    **3.** Ce pourcentage global dépend-il du prix initial ? Tester avec plusieurs valeurs, puis le justifier par le calcul.

    **4.** Modifier le programme pour qu'il demande les deux taux de remise à l'utilisateur.
  corrige: |
    **1.** Une remise de $20\,\%$ revient à multiplier par $0{,}8$, une remise de $10\,\%$ à multiplier par $0{,}9$.

    ```python
    prix = float(input("Prix initial : "))

    apres_1 = prix * 0.8
    prix_final = apres_1 * 0.9

    print("Prix final :", round(prix_final, 2))
    ```

    **2.** Le client a tort. On ajoute le calcul de la remise globale :

    ```python
    remise = (1 - prix_final / prix) * 100
    print("Remise globale :", round(remise, 2), "%")
    ```

    ```sortie
    Prix initial : 100
    Prix final : 72.0
    Remise globale : 28.0 %
    ```

    **3.** Non, le pourcentage global ne dépend pas du prix initial : on obtient $28\,\%$ pour $100$ euros comme pour $45{,}90$ euros. En effet, le prix final vaut : 
    $$p \times 0{,}8 \times 0{,}9 = 0{,}72\,p$$
     Le prix initial $p$ se simplifie dans le calcul de la remise, qui vaut donc toujours $1-0{,}72=0{,}28$. 
    $$\boxed{\text{Deux remises de } 20\,\% \text{ et } 10\,\% \text{ équivalent à une seule remise de } 28\,\%.}$$
     Les pourcentages de remise ne s'additionnent pas : ils se *composent*, par multiplication des coefficients.

    **4.** 

    ```python
    prix = float(input("Prix initial : "))
    t1 = float(input("Premiere remise, en % : "))
    t2 = float(input("Seconde remise, en % : "))

    prix_final = prix * (1 - t1 / 100) * (1 - t2 / 100)
    remise = (1 - prix_final / prix) * 100

    print("Prix final :", round(prix_final, 2))
    print("Remise globale :", round(remise, 2), "%")
    ```
- id: "py-01-11"
  feuille: "f-py-01"
  numero: 11
  partie: "Chapitre 3 - Tests et conditions"
  etoiles: 1
  types: [Algorithmique, Calcul]
  mots_cles: [tests et conditions, connecteurs logiques]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Donner la valeur — `True` ou `False` — de chacune des expressions suivantes, sachant que `a = 5`, `b = 12` et `mot = "python"`.

    ```python
    a < b
    a == 5
    a != b
    a > 3 and b > 15
    a > 3 or b > 15
    not (a == b)
    a < b < 20
    mot == "Python"
    len(mot) == 6
    a % 2 == 0
    ```

    Deux de ces lignes surprennent souvent : `mot == "Python"` et `a < b < 20`. Expliquer la valeur de chacune.
  corrige: |
    ```tableau
    **Expression** ¦ **Valeur** ¦ **Expression** ¦ **Valeur**
    `a < b` ¦ `True` ¦ `not (a == b)` ¦ `True`
    `a == 5` ¦ `True` ¦ `a < b < 20` ¦ `True`
    `a != b` ¦ `True` ¦ `mot == "Python"` ¦ `False`
    `a > 3 and b > 15` ¦ `False` ¦ `len(mot) == 6` ¦ `True`
    `a > 3 or b > 15` ¦ `True` ¦ `a % 2 == 0` ¦ `False`
    ```

    **Première surprise : ** `mot == "Python"` vaut `False`. Python distingue les majuscules des minuscules : la chaîne `"python"` n'est pas la chaîne `"Python"`. C'est une source d'erreur fréquente lorsqu'on compare une réponse saisie par l'utilisateur.

    **Seconde surprise : ** `a < b < 20` vaut `True`. Cette écriture, calquée sur la notation mathématique $a<b<20$, signifie `a < b and b < 20`. Peu de langages l'autorisent, et l'on y gagne en lisibilité.

    On notera au passage que `len(mot) == 6` vaut `True` : la fonction `len` compte les *caractères* d'une chaîne, et `"python"` en possède six.

    Enfin `a % 2 == 0` teste la parité : ici $5$ est impair, d'où `False`.
- id: "py-01-12"
  feuille: "f-py-01"
  numero: 12
  partie: "Chapitre 3 - Tests et conditions"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [tests et conditions, division euclidienne]
  noeuds: [l-connecteurs, z-division]
  notions: [division-euclidienne]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Écrire un programme qui demande un nombre à l'utilisateur et affiche s'il est positif, négatif ou nul.

    **2.** Écrire un programme qui demande un entier et affiche s'il est pair ou impair.

    **3.** Écrire un programme qui demande trois nombres et affiche le plus grand. On n'utilisera *pas* la fonction `max`.
  corrige: |
    **1.** 

    ```python
    x = float(input("Un nombre : "))

    if x > 0:
        print("positif")
    elif x < 0:
        print("negatif")
    else:
        print("nul")
    ```

    **2.** 

    ```python
    n = int(input("Un entier : "))

    if n % 2 == 0:
        print("pair")
    else:
        print("impair")
    ```

    **3.** On compare le premier aux deux autres, puis le deuxième au troisième :

    ```python
    a = float(input("a : "))
    b = float(input("b : "))
    c = float(input("c : "))

    if a >= b and a >= c:
        plus_grand = a
    elif b >= c:
        plus_grand = b
    else:
        plus_grand = c

    print("Le plus grand est", plus_grand)
    ```

    Le `elif b >= c` n'a pas besoin de retester `b >= a` : si l'on y arrive, c'est que la première condition était fausse.
- id: "py-01-13"
  feuille: "f-py-01"
  numero: 13
