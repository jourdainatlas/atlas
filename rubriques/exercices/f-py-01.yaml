    **2.** Écrire une fonction `somme_chiffres(n)` qui renvoie la somme des chiffres d'un entier positif. On pourra utiliser les opérateurs `%` et `//`.

    **3.** Écrire une fonction `est_divisible_par_3(n)` qui utilise la fonction précédente, plutôt que l'opérateur `%`.

    **4.** Vérifier sur les entiers de $1$ à $50$ que cette fonction donne le même résultat que le test `n % 3 == 0`.
  corrige: |
    ```python
    def est_pair(n):
        return n % 2 == 0

    def somme_chiffres(n):
        somme = 0
        while n > 0:
            somme = somme + n % 10     # le chiffre des unites
            n = n // 10                # on supprime ce chiffre
        return somme

    def est_divisible_par_3(n):
        return somme_chiffres(n) % 3 == 0
    ```

    *Vérification :* `somme_chiffres(1234)` vaut $10$, puisque $1+2+3+4=10$.

    On notera que `est_pair` s'écrit en une ligne : la comparaison `n % 2 == 0` produit déjà un booléen, il suffit de le renvoyer. Écrire `if ... : return True else: return False` serait redondant.

    **4.** 

    ```python
