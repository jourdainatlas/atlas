    On pose `notes = [12, 8, 15, 6, 17, 9]`.

    **1.** Que valent `notes[0]`, `notes[3]` et `notes[-1]` ?

    **2.** Que vaut `len(notes)` ? Quel est l'indice du dernier élément ?

    **3.** Que se passe-t-il si l'on écrit `notes[6]` ?

    **4.** Que valent `notes[1:4]`, `notes[:3]` et `notes[3:]` ?

    **5.** Après `notes[1] = 14`, que contient la liste ? Et après `notes.append(11)` ?
  corrige: |
    **1.** `notes[0]` vaut $12$, `notes[3]` vaut $6$, et `notes[-1]` vaut $9$ : l'indice $-1$ désigne le dernier élément.

    **2.** `len(notes)` vaut $6$, et le dernier indice est donc $5$. 
    $$\boxed{\text{Les indices vont de } 0 \text{ à } \texttt{len(L)} - 1.}$$

    **3.** `notes[6]` provoque une erreur :

    ```sortie
    IndexError: list index out of range
    ```

    **4.** `notes[1:4]` vaut `[8, 15, 6]`, `notes[:3]` vaut `[12, 8, 15]`, et `notes[3:]` vaut `[6, 17, 9]`. La borne de gauche est incluse, celle de droite exclue — comme pour `range`.

    **5.** Après `notes[1] = 14`, la liste vaut :

    `[12, 14, 15, 6, 17, 9]`

    Après `notes.append(11)`, elle vaut `[12, 14, 15, 6, 17, 9, 11]` et compte sept éléments.
