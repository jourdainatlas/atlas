  enonce: |
    Une année est bissextile lorsqu'elle est divisible par $4$, *sauf* si elle est divisible par $100$ sans l'être par $400$.

    **1.** Les années $1900$, $2000$, $2023$ et $2024$ sont-elles bissextiles ? Répondre à la main.

    **2.** Écrire un programme qui demande une année et affiche si elle est bissextile, en utilisant une suite de `if` et `elif`.

    **3.** Écrire une seconde version qui n'utilise qu'*un seul* test, à l'aide des opérateurs `and`, `or` et `not`.

    **4.** Vérifier que les deux versions donnent les mêmes réponses sur les quatre années de la question 1, puis sur toutes les années de $1890$ à $1910$.
  corrige: |
    **1.** $1900$ est divisible par $100$ mais pas par $400$ : elle n'est pas bissextile. $2000$ est divisible par $400$ : elle l'est. $2023$ n'est pas divisible par $4$ : elle ne l'est pas. $2024$ est divisible par $4$ sans l'être par $100$ : elle l'est.

    **2.** On teste les cas du plus particulier au plus général :

    ```python
    annee = int(input("Une annee : "))

    if annee % 400 == 0:
        print("bissextile")
    elif annee % 100 == 0:
        print("non bissextile")
    elif annee % 4 == 0:
        print("bissextile")
    else:
        print("non bissextile")
    ```

    **3.** En un seul test :

    ```python
    if (annee % 4 == 0 and annee % 100 != 0) or annee % 400 == 0:
        print("bissextile")
    else:
        print("non bissextile")
    ```

    La condition traduit mot pour mot la règle : « divisible par $4$ mais pas par $100$ », *ou bien* « divisible par $400$ ».

    **4.** Les deux versions donnent les mêmes réponses sur $1900$, $2000$, $2023$ et $2024$, ainsi que sur toutes les années de $1890$ à $1910$. On peut le vérifier automatiquement :

    ```python
    for annee in range(1890, 1911):
        v1 = version_1(annee)
        v2 = version_2(annee)
        if v1 != v2:
            print("Desaccord en", annee)
    print("Verification terminee")
    ```

    Aucun désaccord n'apparaît — et l'on peut pousser la vérification de l'an $1$ à l'an $3\,000$ sans trouver de contre-exemple. C'est une bonne habitude : plutôt que de comparer deux programmes à la main sur quelques cas, on fait comparer la machine sur des milliers.
- id: "py-01-16"
