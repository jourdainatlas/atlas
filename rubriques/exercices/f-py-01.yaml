  enonce: |
    **1.** Écrire un programme qui simule $1\,000$ lancers d'un dé à six faces et affiche la fréquence d'apparition de chaque face. On utilisera `from random import randint`.

    **2.** Les six fréquences sont-elles égales ? Relancer plusieurs fois le programme et commenter.

    **3.** Reprendre avec $100\,000$ lancers. Que constate-t-on ?

    **4.** Écrire un programme qui simule le lancer de *deux* dés et estime la probabilité d'obtenir une somme égale à $7$. Comparer à la valeur théorique $\dfrac{1}{6}$.
  corrige: |
    **1.** 

    ```python
    from random import randint

    n = 1000
    effectifs = [0] * 7          # on ignore la case 0

    for lancer in range(n):
        face = randint(1, 6)
        effectifs[face] = effectifs[face] + 1

    for face in range(1, 7):
        print("Face", face, ":", effectifs[face] / n)
    ```

    **2.** Non, les six fréquences ne sont pas égales. Sur un essai, on obtient par exemple : 
    $$0{,}160 \quad 0{,}166 \quad 0{,}165 \quad 0{,}163 \quad 0{,}183 \quad 0{,}163$$
     Elles varient d'un essai à l'autre, et tournent autour de $\dfrac{1}{6} \approx 0{,}167$.

    **3.** Avec $100\,000$ lancers, les fréquences se resserrent nettement : 
    $$0{,}1664 \quad 0{,}1673 \quad 0{,}1653 \quad 0{,}1685 \quad 0{,}1670 \quad 0{,}1654$$

    $$\boxed{\text{C'est la loi des grands nombres : les fréquences se rapprochent des probabilités.}}$$

    **4.** 

    ```python
    from random import randint

    n = 100000
    succes = 0

    for essai in range(n):
        if randint(1, 6) + randint(1, 6) == 7:
            succes = succes + 1

    print("Frequence :", succes / n)
    ```

    On obtient environ $0{,}166$, à comparer à $\dfrac{1}{6} \approx 0{,}1667$. La somme $7$ est en effet la plus probable : elle s'obtient de six façons sur les trente-six lancers possibles.
- id: "py-01-39"
  feuille: "f-py-01"
  numero: 39
  partie: "Problèmes"
  etoiles: 3
  types: [Algorithmique, Démonstration]
