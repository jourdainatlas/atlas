  enonce: |
    **1.** Écrire une fonction `aire_rectangle(L, l)` qui renvoie l'aire d'un rectangle.

    **2.** Écrire une fonction `perimetre_cercle(r)` qui renvoie le périmètre d'un cercle de rayon `r`.

    **3.** Écrire une fonction `celsius_vers_fahrenheit(c)`, sachant que $f=\dfrac{9c}{5}+32$.

    **4.** Tester les trois fonctions, puis les utiliser dans un petit programme qui dialogue avec l'utilisateur.
  corrige: |
    ```python
    from math import pi

    def aire_rectangle(L, l):
        return L * l

    def perimetre_cercle(r):
        return 2 * pi * r

    def celsius_vers_fahrenheit(c):
        return 9 * c / 5 + 32
    ```

    Un programme qui les utilise :

    ```python
    longueur = float(input("Longueur : "))
    largeur = float(input("Largeur : "))
    print("Aire :", aire_rectangle(longueur, largeur))

    temperature = float(input("Temperature en degres Celsius : "))
    print("Soit", celsius_vers_fahrenheit(temperature), "degres Fahrenheit")
    ```

    *Vérifications :* `aire_rectangle(3, 4)` vaut $12$, `perimetre_cercle(1)` vaut environ $6{,}283$, et `celsius_vers_fahrenheit(100)` vaut $212$.
- id: "py-01-24"
  feuille: "f-py-01"
  numero: 24
  partie: "Chapitre 5 - Les fonctions"
  etoiles: 1
  types: [Algorithmique]
  mots_cles: [fonctions]
  noeuds: [r-application]
  notions: [application]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    On considère les deux fonctions suivantes.

    ```python
    def double_a(x):
        return 2 * x

    def double_b(x):
        print(2 * x)
    ```

    **1.** Qu'affiche `print(double_a(5))` ? Et `print(double_b(5))` ?

    **2.** Que vaut `double_a(5) + 1` ? Et `double_b(5) + 1` ?

    **3.** Laquelle des deux fonctions est réutilisable dans un calcul ? Pourquoi ?

    **4.** Que renvoie une fonction qui ne contient aucun `return` ?
  corrige: |
    **1.** `print(double_a(5))` affiche $10$. En revanche `print(double_b(5))` affiche *deux* lignes :

    ```sortie
    10
    None
    ```

    La fonction affiche $10$ elle-même, puis `print` affiche ce qu'elle a renvoyé, c'est-à-dire `None`.

    **2.** `double_a(5) + 1` vaut $11$. Mais `double_b(5) + 1` provoque une erreur :

    ```sortie
    TypeError: unsupported operand type(s) for +: 'NoneType' and 'int'
    ```

    **3.** Seule `double_a` est réutilisable, car elle *renvoie* une valeur, que l'on peut ensuite stocker, additionner ou passer à une autre fonction. La seconde se contente d'afficher : le résultat est perdu dès qu'il est écrit à l'écran. 
    $$\boxed{\texttt{return} \text{ transmet une valeur au programme ; } \texttt{print} \text{ l'écrit à l'écran.}}$$

    **4.** Une fonction sans `return` renvoie `None`, une valeur spéciale signifiant « rien ».
- id: "py-01-25"
  feuille: "f-py-01"
  numero: 25
  partie: "Chapitre 5 - Les fonctions"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [fonctions]
