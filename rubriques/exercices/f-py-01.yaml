  enonce: |
    **La suite de Syracuse.** On part d'un entier $u_0 \geqslant 1$, puis : si $u_n$ est pair, on pose $u_{n+1}=\dfrac{u_n}{2}$ ; sinon $u_{n+1}=3u_n+1$. On admet que la suite finit toujours par atteindre $1$.

    **1.** Calculer à la main les termes de la suite pour $u_0=6$, jusqu'à atteindre $1$.

    **2.** Écrire une fonction `syracuse(n)` qui renvoie la liste des termes, de $u_0=n$ jusqu'au premier $1$.

    **3.** Le *temps de vol* est le nombre d'étapes nécessaires pour atteindre $1$, et l'*altitude maximale* est le plus grand terme rencontré. Écrire deux fonctions les calculant.

    **4.** Déterminer, pour $n$ variant de $1$ à $1\,000$, la valeur de $n$ dont le temps de vol est le plus grand, ainsi que ce temps de vol.

    **5.** Même question pour l'altitude maximale. La valeur de $n$ trouvée est-elle la même ?

    **6.** Tracer, ou décrire, l'allure du nuage de points donnant le temps de vol en fonction de $n$. Que remarque-t-on de surprenant ?
  corrige: |
    **1.** En partant de $6$ : 
    $$6 \to 3 \to 10 \to 5 \to 16 \to 8 \to 4 \to 2 \to 1$$

    **2.** 

    ```python
    def syracuse(n):
        termes = [n]
        while n != 1:
            if n % 2 == 0:
                n = n // 2
            else:
                n = 3 * n + 1
            termes.append(n)
        return termes
    ```

    On utilise `//` et non `/` : la division exacte produirait des flottants, et le test `n != 1` finirait par comparer $1.0$ à $1$.

    **3.** 

    ```python
    def temps_de_vol(n):
        return len(syracuse(n)) - 1

    def altitude_max(n):
        return max(syracuse(n))
    ```

    On retranche $1$ car la liste contient $u_0$ en plus des étapes effectuées. Pour $n=6$, le temps de vol vaut $8$ et l'altitude maximale $16$.

    **4.** 

    ```python
    meilleur = 1
    for n in range(1, 1001):
        if temps_de_vol(n) > temps_de_vol(meilleur):
            meilleur = n
    print(meilleur, "avec un temps de vol de", temps_de_vol(meilleur))
    ```

    ```sortie
    871 avec un temps de vol de 178
    ```

    **5.** Le même programme, avec `altitude_max`, donne :

    ```sortie
    703 avec une altitude de 250504
    ```

    $$\boxed{\text{Non, ce n'est pas le même entier : } 871 \text{ pour le temps, } 703 \text{ pour l'altitude.}}$$
     Un vol peut donc être long sans monter très haut, et inversement. On notera l'ampleur du second nombre : parti de $703$, la suite atteint plus de $250\,000$ avant de redescendre.

    **6.** Le nuage de points est d'une irrégularité frappante : deux entiers voisins peuvent avoir des temps de vol très différents — $27$ demande $111$ étapes, alors que $28$ n'en demande que $18$. On distingue toutefois des alignements de points, car les entiers d'une même « famille » finissent par rejoindre la même trajectoire.

    **Une conjecture ouverte.** Personne n'a démontré que la suite atteint toujours $1$. Le programme le vérifie pour tous les entiers testés, mais vérifier n'est pas démontrer : c'est la conjecture de Syracuse, ouverte depuis les années $1930$.
- id: "py-01-42"
  feuille: "f-py-01"
  numero: 42
  partie: "Problèmes"
  etoiles: 4
  types: [Algorithmique]
  mots_cles: [simulation]
  noeuds: [p-loi-faible]
  notions: [somme-riemann]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    **Estimer $\pi$ par la méthode de Monte-Carlo.** On tire au hasard des points dans le carré $[0\,;1]\times[0\,;1]$, et l'on compte ceux qui tombent dans le quart de disque de centre l'origine et de rayon $1$.

    **1.** Quelle est l'aire du carré ? Celle du quart de disque ? En déduire la proportion attendue de points tombant dans le quart de disque.

    **2.** Écrire un programme qui tire $n$ points au hasard à l'aide de `random()`, compte ceux qui vérifient $x^2+y^2 \leqslant 1$, et en déduit une estimation de $\pi$.

    **3.** Tester avec $n=100$, $n=10\,000$ puis $n=1\,000\,000$. Combien de décimales exactes obtient-on à chaque fois ?

    **4.** Relancer trois fois le programme avec $n=10\,000$. Les estimations sont-elles identiques ? Commenter.

    **5.** On souhaite obtenir $\pi$ à $10^{-3}$ près. Cette méthode vous paraît-elle efficace ? Comparer avec la méthode des rectangles du cours.
  corrige: |
    **1.** Le carré a pour aire $1$, et le quart de disque de rayon $1$ a pour aire $\dfrac{\pi \times 1^2}{4}=\dfrac{\pi}{4}$. Un point tiré au hasard dans le carré tombe donc dans le quart de disque avec la probabilité : 
    $$\frac{\pi/4}{1}=\frac{\pi}{4} \approx 0{,}785$$

    **2.** On en déduit $\pi \approx 4 \times \dfrac{\text{points dans le disque}}{\text{points tirés}}$ :

    ```python
    from random import random

    n = int(input("Combien de points ? "))
    dedans = 0

    for tirage in range(n):
        x = random()
        y = random()
        if x * x + y * y <= 1:
            dedans = dedans + 1

    print("Estimation de pi :", 4 * dedans / n)
    ```

    **3.**

    $$\begin{array}{|c|c|c|} \hline n & \text{Estimation} & \text{Décimales exactes} \\ \hline 100 & 3{,}000000 & \text{aucune} \\ \hline 10\,000 & 3{,}136800 & \text{une} \\ \hline 1\,000\,000 & 3{,}140964 & \text{deux} \\ \hline \end{array}$$

    Multiplier le nombre de points par $100$ ne fait gagner qu'*une* décimale.

    **4.** Non, trois exécutions avec $n=10\,000$ donnent par exemple $3{,}1292$, $3{,}1608$ et $3{,}1568$. Le résultat change à chaque fois, puisque les tirages sont aléatoires. 
    $$\boxed{\text{Une méthode probabiliste ne donne pas un résultat, mais une estimation.}}$$

    **5.** Pour gagner une décimale, il faut environ multiplier $n$ par $100$ : obtenir $\pi$ à $10^{-3}$ près demanderait de l'ordre de cent millions de tirages, sans aucune garantie. 
    $$\boxed{\text{La méthode est très inefficace pour calculer } \pi.}$$
     La méthode des rectangles du cours atteint la même précision en quelques milliers d'itérations, et surtout elle est *déterministe* : elle donne toujours la même réponse, et l'on sait majorer l'erreur. L'intérêt de Monte-Carlo est ailleurs : elle s'applique encore quand le domaine est trop compliqué pour être découpé en rectangles.
