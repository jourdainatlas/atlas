    **1.** Écrire une fonction `effectifs(notes)` qui renvoie une liste de $21$ nombres, celui d'indice $k$ donnant le nombre d'élèves ayant obtenu la note $k$.

    **2.** Écrire une fonction `mediane(notes)` qui renvoie la médiane. On pourra commencer par trier la liste.

    **3.** Écrire une fonction `au_dessus(notes)` qui renvoie le nombre d'élèves dont la note est strictement supérieure à la moyenne de la classe.

    **4.** Tester l'ensemble sur la liste `[12, 8, 15, 6, 17, 9, 11, 14, 5, 13]`.

    **5.** Le nombre d'élèves au-dessus de la moyenne peut-il dépasser la moitié de l'effectif ? Donner un exemple ou démontrer que c'est impossible.
  corrige: |
    **1.** 

    ```python
    def effectifs(notes):
        eff = [0] * 21          # 21 cases, d'indice 0 a 20
        for n in notes:
            eff[n] = eff[n] + 1
        return eff
    ```

    L'astuce consiste à utiliser la note elle-même comme *indice* de la case à incrémenter.

    **2.** 

    ```python
    def mediane(notes):
        triee = sorted(notes)
        n = len(triee)
        if n % 2 == 1:
            return triee[n // 2]
        else:
            return (triee[n // 2 - 1] + triee[n // 2]) / 2
    ```

    **3.** 

    ```python
    def au_dessus(notes):
        m = moyenne(notes)
        c = 0
        for n in notes:
            if n > m:
                c = c + 1
        return c
    ```

    **4.** Sur la liste proposée :

    ```sortie
    Liste triee : [5, 6, 8, 9, 11, 12, 13, 14, 15, 17]
    Moyenne : 11.0
    Mediane : 11.5
    Au-dessus de la moyenne : 5 eleves sur 10
    ```

    **5.** Oui, c'est possible. Il suffit qu'une valeur très basse tire la moyenne vers le bas : avec `[0, 10, 10, 10, 10]`, la moyenne vaut $8$ et *quatre* élèves sur cinq sont au-dessus. 
    $$\boxed{\text{La moyenne n'est pas la médiane : elle est sensible aux valeurs extrêmes.}}$$
     C'est exactement ce que mesure la médiane, qui coupe l'effectif en deux parts égales par construction.
- id: "py-01-34"
  feuille: "f-py-01"
  numero: 34
  partie: "Chapitre 7 - Quelques algorithmes classiques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [algorithmes classiques, tri et recherche]
  noeuds: [z-ordre]
  notions: []
  page_enonce: 10
  page_corrige: 16
  enonce: |
    **1.** Écrire une fonction `maximum(L)` qui renvoie le plus grand élément d'une liste non vide.

    **2.** Modifier la fonction pour qu'elle renvoie non pas le maximum, mais son *indice*.

    **3.** Que doit renvoyer la fonction si le maximum apparaît plusieurs fois ? Préciser le choix fait par votre programme.

    **4.** Écrire une fonction `deux_plus_grands(L)` qui renvoie les deux plus grandes valeurs d'une liste, sans trier la liste et en ne la parcourant qu'une seule fois.
  corrige: |
    **1.** 

    ```python
    def maximum(L):
        m = L[0]
        for x in L:
            if x > m:
                m = x
        return m
    ```

    **2.** On mémorise l'indice plutôt que la valeur :

    ```python
    def indice_maximum(L):
        imax = 0
        for i in range(len(L)):
            if L[i] > L[imax]:
                imax = i
        return imax
    ```

    **3.** Le test étant `>` strict, l'indice ne change pas en cas d'égalité : 
    $$\boxed{\text{La fonction renvoie l'indice de la \emph{première} occurrence du maximum.}}$$
     Avec `>=`, elle renverrait celui de la dernière. Ce choix doit être explicite : c'est exactement le genre de détail qui provoque des désaccords entre deux programmes pourtant tous deux « corrects ».

    **4.** On maintient deux variables, mises à jour dans le bon ordre :

    ```python
    def deux_plus_grands(L):
        if L[0] >= L[1]:
            m1, m2 = L[0], L[1]
        else:
            m1, m2 = L[1], L[0]
        for x in L[2:]:
            if x > m1:
                m2 = m1        # l'ancien premier devient deuxieme
                m1 = x
            elif x > m2:
                m2 = x
        return m1, m2
    ```

    *Vérifications :* sur `[3, 7, 3, 1, 9]` la fonction renvoie $(9\,;7)$, et sur `[5, 2, 8, 1, 9, 3]` elle renvoie $(9\,;8)$.

    **Le point délicat** est la ligne `m2 = m1`, qui doit précéder `m1 = x` : dans l'ordre inverse, l'ancien maximum serait perdu.
