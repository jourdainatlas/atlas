  enonce: |
    Prédire l'affichage de chacun de ces programmes, *sans machine*, puis vérifier.

    ```python
    # programme a
    x = 10
    def f():
        x = 3
        print(x)
    f()
    print(x)
    ```

    ```python
    # programme b
    def g(n):
        n = n + 1
        return n
    a = 5
    g(a)
    print(a)
    ```

    ```python
    # programme c
    def h():
        print(y)
    y = 7
    h()
    ```

    Expliquer chaque résultat en une phrase, en utilisant le mot *portée*.
  corrige: |
    **Programme a.** 

    ```sortie
    3
    10
    ```

    L'affectation `x = 3` dans la fonction crée une variable *locale*, qui n'existe que pendant l'appel. Le `x` global, qui vaut $10$, n'est pas touché.

    **Programme b.** 

    ```sortie
    5
    ```

    Le paramètre `n` est une copie : le modifier ne change pas `a`. De plus, la valeur renvoyée par `g(a)` n'est ni stockée ni affichée : elle est perdue.

    **Programme c.** 

    ```sortie
    7
    ```

    Ici aucune variable locale `y` n'est créée : Python va donc chercher `y` dans la portée *globale*, où elle vaut $7$. Une fonction peut lire une variable globale, mais elle ne peut pas la modifier par une simple affectation. 
    $$\boxed{\text{Une variable créée dans une fonction est locale : elle disparaît à la fin de l'appel.}}$$
