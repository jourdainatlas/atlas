  enonce: |
    On reprend l'équation $x^3+x-1=0$ sur $[0\,;1]$, cette fois par dichotomie.

    **1.** Écrire une fonction `dichotomie(a, b, precision)` qui renvoie un encadrement de la solution d'amplitude inférieure à `precision`.

    **2.** Combien d'étapes sont nécessaires pour une précision de $10^{-6}$ ? Comparer avec le nombre d'itérations du balayage de l'exercice 35.

    **3.** Modifier la fonction pour qu'elle affiche également le nombre d'étapes effectuées.

    **4.** L'amplitude est divisée par $2$ à chaque étape. En déduire, *par le calcul*, le nombre d'étapes nécessaires pour passer de $1$ à $10^{-6}$, puis vérifier avec le programme.
  corrige: |
    **1.** À chaque étape, on coupe l'intervalle en deux et l'on conserve la moitié qui contient la solution, repérée par un changement de signe :

    ```python
    def dichotomie(a, b, precision):
        while b - a > precision:
            m = (a + b) / 2
            if f(a) * f(m) <= 0:
                b = m            # la solution est dans [a ; m]
            else:
                a = m            # elle est dans [m ; b]
        return a, b
    ```

    **2.** 

    ```sortie
    >>> dichotomie(0, 1, 1e-6)
    (0.6823273, 0.6823282)
    ```

    Le programme effectue $20$ étapes, contre $682\,300$ itérations pour le balayage. 
    $$\boxed{\text{La dichotomie est environ } 34\,000 \text{ fois plus rapide.}}$$

    **3.** 

    ```python
    def dichotomie(a, b, precision):
        etapes = 0
        while b - a > precision:
            m = (a + b) / 2
            if f(a) * f(m) <= 0:
                b = m
            else:
                a = m
            etapes = etapes + 1
        print("Nombre d'etapes :", etapes)
        return a, b
    ```

    **4.** L'amplitude vaut $1$ au départ et se divise par $2$ à chaque étape : après $n$ étapes, elle vaut $\dfrac{1}{2^n}$. On cherche donc le plus petit $n$ tel que : 
    $$\frac{1}{2^n} < 10^{-6} \qquad\text{soit}\qquad 2^n > 10^{6}$$
     L'exercice 20 a établi que le plus petit tel $n$ vaut $20$, ce que le programme confirme.

    **L'intérêt de la dichotomie** tient à cette division par $2$ : gagner une décimale supplémentaire coûte trois ou quatre étapes, alors que le balayage doit multiplier ses itérations par dix.
