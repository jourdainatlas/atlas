  noeuds: [c-tvi]
  notions: []
  page_enonce: 10
  page_corrige: 17
  enonce: |
    On cherche une valeur approchée de la solution de $x^3+x-1=0$ sur l'intervalle $[0\,;1]$.

    **1.** Vérifier que la fonction $f : x \mapsto x^3+x-1$ est croissante sur $[0\,;1]$, et que $f(0)<0<f(1)$.

    **2.** Écrire un programme qui balaie $[0\,;1]$ avec un pas de $0{,}01$ et affiche un encadrement de la solution.

    **3.** Modifier le programme pour que le pas soit demandé à l'utilisateur.

    **4.** Combien d'itérations le balayage effectue-t-il pour obtenir un encadrement d'amplitude $10^{-6}$ ?
  corrige: |
    **1.** La fonction $f : x \mapsto x^3+x-1$ est une somme de fonctions croissantes sur $[0\,;1]$. De plus $f(0)=-1<0$ et $f(1)=1>0$ : la solution est donc unique et située dans $]0\,;1[$.

    **2.** 

    ```python
    def f(x):
        return x**3 + x - 1

    x = 0
    pas = 0.01
    while f(x) < 0:
        x = x + pas

    print("La solution est entre", round(x - pas, 4), "et", round(x, 4))
    ```

    ```sortie
    La solution est entre 0.68 et 0.69
    ```

    **3.** 

    ```python
    pas = float(input("Quel pas ? "))
    ```

    **4.** La solution vaut environ $0{,}6823$. Avec un pas de $10^{-6}$, il faut parcourir l'intervalle depuis $0$, soit environ : 
    $$\frac{0{,}6823}{10^{-6}} \approx 682\,300 \text{ itérations}$$

    $$\boxed{\text{Le balayage est simple, mais très coûteux dès que la précision augmente.}}$$
- id: "py-01-36"
  feuille: "f-py-01"
  numero: 36
  partie: "Chapitre 7 - Quelques algorithmes classiques"
  etoiles: 3
  types: [Calcul]
