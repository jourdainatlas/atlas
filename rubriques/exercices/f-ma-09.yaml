  enonce: |
    *Équations fonctionnelles et dérivabilité.*

    **1.** Déterminer les fonctions dérivables $f : \mathbb{R} \to \mathbb{R}$ telles que $f(x + y) = f(x) + f(y)$ pour tous réels $x$ et $y$. On dérivera par rapport à $y$, sans utiliser l'exemple du chapitre 8.

    **2.** Déterminer les fonctions $f : [0\,,+\infty[ \,\to \mathbb{R}$, dérivables, telles que $f(2x) = 2f(x)$ pour tout $x \geqslant 0$. On pourra étudier $\frac{f(x)}{x}$ et utiliser la dérivabilité en $0$.
  corrige: |
    **1.** Soit $f$ une solution. En prenant $x = y = 0$, on obtient $f(0) = 2f(0)$, donc $f(0) = 0$. À $x$ fixé, on dérive par rapport à $y$ les deux membres de l'égalité $f(x + y) = f(x) + f(y)$ : $f'(x + y) = f'(y)$. En $y = 0$, il vient $f'(x) = f'(0)$ pour tout $x$. On pose $a = f'(0)$. La fonction $x \mapsto f(x) - ax$ a une dérivée nulle sur l'intervalle $\mathbb{R}$, elle est donc constante (théorème 7), égale à sa valeur $f(0) = 0$ en $0$. Réciproquement, les fonctions linéaires conviennent. 
    $$\boxed{\text{les solutions sont les fonctions } x \mapsto ax, \ a \in \mathbb{R}}$$
     Le chapitre 8 avait obtenu le même résultat sous la seule hypothèse de continuité, au prix d'un passage par les rationnels : la dérivabilité raccourcit nettement la démonstration.

    **2.** Soit $f$ une solution. En $x = 0$, on obtient $f(0) = 0$. Pour $x > 0$, on pose $g(x) = \frac{f(x)}{x}$, qui vérifie $g(2x) = \frac{2f(x)}{2x} = g(x)$, donc, par récurrence, $g(x) = g\big(\frac{x}{2^{n}}\big)$ pour tout $n$. Or $g(t) = \frac{f(t) - f(0)}{t}$ tend vers $f'(0)$ quand $t$ tend vers $0^{+}$, et $\frac{x}{2^{n}}$ tend vers $0$ : par composition, $g(x) = f'(0)$. Ainsi $f(x) = f'(0)\,x$ pour tout $x \geqslant 0$, et les fonctions linéaires conviennent. 
    $$\boxed{\text{les solutions sont les fonctions } x \mapsto ax, \ a \in \mathbb{R}}$$
     La dérivabilité n'a servi qu'en $0$ : il suffisait de supposer $f$ dérivable à droite en $0$.
- id: "ma-09-09"
  feuille: "f-ma-09"
  numero: 9
  partie: "Dérivabilité en un point"
  etoiles: 3
  types: [Calcul]
  mots_cles: [dérivabilité en un point, inégalités]
  noeuds: [de-derivee, de-operations, de-monotonie]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f$ une fonction définie au voisinage de $0$, continue en $0$, telle que 
    $$\lim_{x \to 0} \frac{f(2x) - f(x)}{x} = 3.$$

    **1.** Soit $\varepsilon > 0$ et $\delta > 0$ tel que $\big|f(2t) - f(t) - 3t\big| \leqslant \varepsilon|t|$ pour $|t| \leqslant \delta$. Soit $x$ tel que $0 < |x| \leqslant \delta$. En sommant ces inégalités pour $t = \frac{x}{2^{k}}$, $1 \leqslant k \leqslant n$, majorer $\Big|f(x) - f\big(\frac{x}{2^{n}}\big) - 3x\big(1 - \frac{1}{2^{n}}\big)\Big|$.

    **2.** En déduire que $f$ est dérivable en $0$, et que $f'(0) = 3$.

    **3.** L'hypothèse de continuité en $0$ est-elle nécessaire ? On pourra écrire $f(x) = 3x + g(x)$, où $g$ vérifie $g(2x) = g(x)$ pour tout $x$.
  corrige: |
    **1.** Pour $1 \leqslant k \leqslant n$, le réel $t = \frac{x}{2^{k}}$ vérifie $|t| \leqslant \delta$, et $2t = \frac{x}{2^{k-1}}$. L'hypothèse donne 
    $$\Big|f\Big(\frac{x}{2^{k-1}}\Big) - f\Big(\frac{x}{2^{k}}\Big) - \frac{3x}{2^{k}}\Big| \leqslant \varepsilon\,\frac{|x|}{2^{k}}.$$
     On somme ces inégalités pour $k$ allant de $1$ à $n$. La somme des $f\big(\frac{x}{2^{k-1}}\big) - f\big(\frac{x}{2^{k}}\big)$ est télescopique et vaut $f(x) - f\big(\frac{x}{2^{n}}\big)$, et la somme géométrique $\sum_{k=1}^{n} \frac{1}{2^{k}}$ vaut $1 - \frac{1}{2^{n}}$. L'inégalité triangulaire donne alors 
    $$\boxed{\Big|f(x) - f\Big(\frac{x}{2^{n}}\Big) - 3x\Big(1 - \frac{1}{2^{n}}\Big)\Big| \leqslant \varepsilon|x|\Big(1 - \frac{1}{2^{n}}\Big) \leqslant \varepsilon|x|}$$

    **2.** On fait tendre $n$ vers $+\infty$ à $x$ fixé : par continuité de $f$ en $0$, $f\big(\frac{x}{2^{n}}\big)$ tend vers $f(0)$, et l'on obtient 
    $$\big|f(x) - f(0) - 3x\big| \leqslant \varepsilon|x|, \qquad\text{soit}\qquad \Big|\frac{f(x) - f(0)}{x} - 3\Big| \leqslant \varepsilon \quad\text{pour } 0 < |x| \leqslant \delta.$$
     C'est exactement la définition de la limite. 
    $$\boxed{f \text{ est dérivable en } 0, \text{ et } f'(0) = 3}$$

    **3.** L'hypothèse est nécessaire. La fonction $f$ définie par $f(0) = 0$ et $f(x) = 3x + 1$ pour $x \neq 0$ est de la forme suggérée, avec $g$ égale à $1$ sur $\mathbb{R}^{*}$ et nulle en $0$, qui vérifie bien $g(2x) = g(x)$. Pour $x \neq 0$, on a $\frac{f(2x) - f(x)}{x} = \frac{6x + 1 - 3x - 1}{x} = 3$, mais $f$ n'est pas continue en $0$, donc pas dérivable (proposition 1). 
    $$\boxed{\text{sans continuité en } 0, \text{ la conclusion est fausse}}$$
     L'hypothèse ne compare $f$ qu'à elle-même, aux points $x$ et $2x$ : elle ne voit pas un saut placé en $0$, que seule la continuité interdit.
- id: "ma-09-10"
  feuille: "f-ma-09"
  numero: 10
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivabilité en un point, "dérivée d'une réciproque"]
  noeuds: [de-derivee, de-operations, de-reciproque]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Dérivée d'une réciproque.*

    **1.** Montrer que $f : x \mapsto \mathrm{e}^{x} + x$ est une bijection de $\mathbb{R}$ sur $\mathbb{R}$. Justifier que $f^{-1}$ est dérivable, et calculer $(f^{-1})'(1)$, puis $(f^{-1})''(1)$, sans expliciter $f^{-1}$.

    **2.** Montrer que $g : x \mapsto \ln(1 + x + x^{2})$ réalise une bijection de $[0\,,+\infty[$ sur un intervalle que l'on précisera. Déterminer $g^{-1}$, et vérifier sur cet exemple la formule de dérivation d'une réciproque.
  corrige: |
    **1.** La fonction $f$ est dérivable sur $\mathbb{R}$, avec $f'(x) = \mathrm{e}^{x} + 1 > 0$ : elle est strictement croissante et continue, de limites $-\infty$ et $+\infty$ en $-\infty$ et $+\infty$. Par le théorème de la bijection continue du chapitre 8, elle réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$. Comme $f'$ ne s'annule pas, le théorème 3 assure que $f^{-1}$ est dérivable sur $\mathbb{R}$, avec $(f^{-1})' = \frac{1}{f' \circ f^{-1}}$. Puisque $f(0) = 1$, on a $f^{-1}(1) = 0$, et 
    $$\boxed{(f^{-1})'(1) = \frac{1}{f'(0)} = \frac{1}{2}}$$
     La fonction $(f^{-1})' = \frac{1}{f' \circ f^{-1}}$ est elle-même dérivable, comme inverse d'une composée de fonctions dérivables, et 
    $$(f^{-1})'' = -\frac{(f'' \circ f^{-1}) \times (f^{-1})'}{(f' \circ f^{-1})^{2}} = -\frac{f'' \circ f^{-1}}{(f' \circ f^{-1})^{3}}.$$
     Avec $f''(0) = 1$ et $f'(0) = 2$, on obtient 
    $$\boxed{(f^{-1})''(1) = -\frac{1}{8}}$$

    **2.** Pour $x \geqslant 0$, on a $1 + x + x^{2} \geqslant 1$, donc $g$ est bien définie, et 
    $$g'(x) = \frac{2x + 1}{x^{2} + x + 1} > 0.$$
     La fonction $g$ est continue et strictement croissante sur $[0\,,+\infty[$, avec $g(0) = 0$ et une limite infinie en $+\infty$ : elle réalise une bijection de $[0\,,+\infty[$ sur lui-même. Pour $y \geqslant 0$, l'équation $g(x) = y$ s'écrit $x^{2} + x + 1 - \mathrm{e}^{y} = 0$, de discriminant $4\mathrm{e}^{y} - 3 > 0$, dont la seule racine positive est 
    $$\boxed{g^{-1}(y) = \frac{-1 + \sqrt{4\mathrm{e}^{y} - 3}}{2}}$$
     En dérivant directement, $(g^{-1})'(y) = \dfrac{\mathrm{e}^{y}}{\sqrt{4\mathrm{e}^{y} - 3}}$. Par ailleurs, si $x = g^{-1}(y)$, on a $x^{2} + x + 1 = \mathrm{e}^{y}$ et $2x + 1 = \sqrt{4\mathrm{e}^{y} - 3}$, donc 
    $$\frac{1}{g'(x)} = \frac{x^{2} + x + 1}{2x + 1} = \frac{\mathrm{e}^{y}}{\sqrt{4\mathrm{e}^{y} - 3}},$$
     et les deux calculs donnent bien le même résultat, conformément au théorème 3.

    *À retenir.* Le théorème 3 donne la dérivée d'une réciproque sans connaître celle-ci : c'est tout son intérêt dans la question 1, où $f^{-1}$ n'a pas d'expression à l'aide des fonctions usuelles.
- id: "ma-09-11"
  feuille: "f-ma-09"
  numero: 11
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 1
  types: [Calcul]
  mots_cles: [Rolle et accroissements finis, extrema]
  noeuds: [de-rolle, de-taf, de-iaf, de-extremum]
  notions: [derivable, extremum-local]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Déterminer le plus grand élément de l'ensemble $\{n^{1/n} \mid n \in \mathbb{N}^{*}\}$.

    **2.** Déterminer les extrema locaux de $x \mapsto x^{3} - 3x$ sur $\mathbb{R}$, puis ses extrema globaux sur $[-3\,,2]$.

    **3.** Soit $f : [0\,,1] \to \mathbb{R}$ dérivable, admettant un minimum local en $0$. Que peut-on dire de $f'(0)$ ?
  corrige: |
    **1.** On a $n^{1/n} = \exp\big(\varphi(n)\big)$ avec $\varphi(x) = \frac{\ln x}{x}$, dérivable sur $]0\,,+\infty[$, de dérivée $\varphi'(x) = \frac{1 - \ln x}{x^{2}}$. Ainsi $\varphi$ est croissante sur $]0\,,\mathrm{e}]$ et décroissante sur $[\mathrm{e}\,,+\infty[$ (théorème 7). Parmi les entiers, le maximum est donc atteint en $2$ ou en $3$, qui encadrent $\mathrm{e}$. Or $(2^{1/2})^{6} = 8 < 9 = (3^{1/3})^{6}$. 
    $$\boxed{\text{le plus grand élément est } 3^{1/3} \approx 1{,}442}$$
     L'étude de la fonction continue $\varphi$ ne donne que l'encadrement par $2$ et $3$ : la comparaison finale entre ces deux entiers est indispensable, car le maximum réel, atteint en $\mathrm{e}$, n'est pas un entier.

    **2.** La fonction $f : x \mapsto x^{3} - 3x$ a pour dérivée $3(x - 1)(x + 1)$. Par la proposition 2, ses extrema locaux sont à chercher parmi $-1$ et $1$. Le signe de $f'$ montre que $f$ croît sur $]-\infty\,,-1]$, décroît sur $[-1\,,1]$ et croît sur $[1\,,+\infty[$ : $f$ a un maximum local en $-1$, de valeur $2$, et un minimum local en $1$, de valeur $-2$. Ces extrema ne sont pas globaux sur $\mathbb{R}$, puisque $f$ tend vers $\pm\infty$ en $\pm\infty$.

    Sur le segment $[-3\,,2]$, $f$ atteint ses bornes (chapitre 8), en des points critiques ou aux extrémités. On compare donc $f(-3) = -18$, $f(-1) = 2$, $f(1) = -2$ et $f(2) = 2$. 
    $$\boxed{\text{sur } [-3\,,2], \ \max f = 2, \text{ atteint en } -1 \text{ et } 2, \quad \min f = -18, \text{ atteint en } -3}$$

    **3.** Pour $0 < x$ assez petit, on a $f(x) \geqslant f(0)$, donc le taux d'accroissement $\frac{f(x) - f(0)}{x}$ est positif, et sa limite aussi : $\boxed{f'(0) \geqslant 0}$. On ne peut pas dire mieux : $x \mapsto x$ a un minimum en $0$ sur $[0\,,1]$, avec une dérivée égale à $1$.

    *Piège.* La proposition 2 exige un point *intérieur* à l'intervalle. En une extrémité, un extremum n'impose qu'une inégalité sur la dérivée, et c'est pourquoi on teste toujours séparément les bornes d'un segment.
- id: "ma-09-12"
  feuille: "f-ma-09"
  numero: 12
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $a$, $b$ et $c$ trois réels. Montrer qu'il existe $x \in \,]0\,,1[$ tel que 
    $$4ax^{3} + 3bx^{2} + 2cx = a + b + c.$$
  corrige: |
    Le membre de gauche est la dérivée de $x \mapsto ax^{4} + bx^{3} + cx^{2}$, qui vaut $a + b + c$ en $1$ et $0$ en $0$. On pose donc 
    $$F(x) = ax^{4} + bx^{3} + cx^{2} - (a + b + c)x.$$
     La fonction $F$ est polynomiale, donc dérivable, et $F(0) = F(1) = 0$. Le théorème de Rolle fournit $x \in \,]0\,,1[$ tel que $F'(x) = 0$, c'est-à-dire 
    $$\boxed{4ax^{3} + 3bx^{2} + 2cx = a + b + c \text{ pour un } x \in \,]0\,,1[}$$
     On ne pouvait pas conclure par le théorème des valeurs intermédiaires, car on ne connaît pas le signe de $F'$ en $0$ et en $1$ : c'est en remontant à une primitive qu'on fait apparaître deux valeurs égales.
- id: "ma-09-13"
  feuille: "f-ma-09"
  numero: 13
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, dérivées successives, racines de polynômes]
  noeuds: [de-rolle, de-taf, de-iaf, de-taylor]
  notions: [derivable, derivee-successive, classe-ck]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Pas trop de racines.* Soit $n \geqslant 2$, $p$ et $q$ deux réels, et $P : x \mapsto x^{n} + px + q$.

    **1.** Montrer que $P$ s'annule au plus trois fois sur $\mathbb{R}$.

    **2.** Si $n$ est pair, montrer que $P$ s'annule au plus deux fois sur $\mathbb{R}$.

    **3.** Soit $n \geqslant 1$ et $f$ une fonction $n$ fois dérivable sur un intervalle $I$, qui s'annule en $n + 1$ points distincts de $I$. Montrer que $f^{(n)}$ s'annule au moins une fois sur $I$.
  corrige: |
    Tout repose sur le principe suivant, conséquence du théorème de Rolle : si une fonction dérivable sur un intervalle s'annule en $m$ points distincts $t_{1} < \cdots < t_{m}$, sa dérivée s'annule en au moins $m - 1$ points distincts, un dans chaque intervalle $]t_{i}\,,t_{i+1}[$.

    **1.** On a $P''(x) = n(n - 1)x^{n-2}$, qui ne s'annule qu'en $0$ (ou jamais si $n = 2$). Si $P$ avait quatre zéros distincts, $P'$ en aurait trois et $P''$ deux, ce qui est impossible. 
    $$\boxed{P \text{ s'annule au plus trois fois}}$$

    **2.** Si $n$ est pair, $P'(x) = nx^{n-1} + p$ avec $n - 1$ impair : la fonction $x \mapsto x^{n-1}$ est une bijection strictement croissante de $\mathbb{R}$ sur $\mathbb{R}$, donc $P'$ s'annule exactement une fois. Si $P$ avait trois zéros, $P'$ en aurait deux. 
    $$\boxed{\text{si } n \text{ est pair, } P \text{ s'annule au plus deux fois}}$$
     Pour $n$ impair, la borne $3$ est atteinte : $x^{3} - x$ s'annule en $-1$, $0$ et $1$.

    **3.** On montre par récurrence finie que, pour $0 \leqslant k \leqslant n$, la fonction $f^{(k)}$ s'annule en au moins $n + 1 - k$ points distincts de $I$. C'est l'hypothèse pour $k = 0$. Si c'est vrai pour un $k < n$, le principe ci-dessus, appliqué à $f^{(k)}$, qui est dérivable puisque $k < n$, donne $n - k$ zéros distincts de $f^{(k+1)}$. Pour $k = n$, on obtient 
    $$\boxed{f^{(n)} \text{ s'annule au moins une fois sur } I}$$
     C'est ce que les questions 1 et 2 utilisaient, avec $f = P$ et $f^{(2)}$ ou $f'$.
- id: "ma-09-14"
  feuille: "f-ma-09"
  numero: 14
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, théorème de Rolle, limite de la dérivée]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Rolle à l'infini.*

    **1.** Soit $f : [0\,,+\infty[ \,\to \mathbb{R}$ continue, dérivable sur $]0\,,+\infty[$, telle que $\lim\limits_{x \to +\infty} f(x) = f(0)$. On suppose $f$ non constante. En considérant un réel $c > 0$ tel que $f(c) \neq f(0)$, montrer qu'il existe $a < c < b$ tels que $f(a) = f(b)$, et en déduire que $f'$ s'annule sur $]0\,,+\infty[$.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable, admettant la même limite finie en $-\infty$ et en $+\infty$. Montrer que $f'$ s'annule, en appliquant le théorème de Rolle à $\varphi : t \mapsto f(\tan t)$, prolongée sur $\big[-\frac{\pi}{2}\,,\frac{\pi}{2}\big]$.
  corrige: |
    **1.** Supposons par exemple $f(c) > f(0)$, l'autre cas se traitant de même, et soit $\lambda$ un réel tel que $f(0) < \lambda < f(c)$, par exemple $\lambda = \frac{f(0) + f(c)}{2}$.

    • Sur $[0\,,c]$, $f$ est continue et $f(0) < \lambda < f(c)$ : le théorème des valeurs intermédiaires fournit $a \in \,]0\,,c[$ tel que $f(a) = \lambda$.

    • Comme $f$ tend vers $f(0) < \lambda$ en $+\infty$, il existe $X > c$ tel que $f(X) < \lambda$. Sur $[c\,,X]$, on obtient de même $b \in \,]c\,,X[$ tel que $f(b) = \lambda$.

    Ainsi $0 < a < c < b$ et $f(a) = f(b)$. Le théorème de Rolle, appliqué sur $[a\,,b]$, fournit $\xi \in \,]a\,,b[$ tel que $f'(\xi) = 0$. Si $f$ est constante, sa dérivée est nulle partout. 
    $$\boxed{f' \text{ s'annule sur } ]0\,,+\infty[}$$

    **2.** Notons $L$ la limite commune. La fonction $\varphi : t \mapsto f(\tan t)$ est continue et dérivable sur $\big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$, et tend vers $L$ en $\pm\frac{\pi}{2}$ par composition des limites. On la prolonge par continuité en posant $\varphi\big(\pm\frac{\pi}{2}\big) = L$ : le théorème de Rolle s'applique, et fournit $c \in \big]-\frac{\pi}{2}\,,\frac{\pi}{2}\big[$ tel que 
    $$\varphi'(c) = (1 + \tan^{2}c)\,f'(\tan c) = 0.$$

    $$\boxed{f' \text{ s'annule en } \tan c}$$
     Le changement de variable $x = \tan t$ ramène l'intervalle infini $\mathbb{R}$ à un intervalle borné : c'est la même idée que dans la question 1, réalisée d'un seul coup.
- id: "ma-09-15"
  feuille: "f-ma-09"
  numero: 15
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, tangente, théorème de Rolle]
  noeuds: [de-rolle, de-taf, de-iaf, de-dl1]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Une tangente passant par un point donné.* Soit $f : [a\,,b] \to \mathbb{R}$ continue, dérivable sur $]a\,,b[$, telle que $f(a) = f(b) = 0$, et $d$ un réel extérieur à $[a\,,b]$. Montrer qu'il existe une tangente à la courbe de $f$ qui passe par le point $(d, 0)$. On pourra appliquer le théorème de Rolle à $x \mapsto \frac{f(x)}{x - d}$.
  corrige: |
    La fonction $\varphi : x \mapsto \frac{f(x)}{x - d}$ est définie, continue sur $[a\,,b]$ et dérivable sur $]a\,,b[$, puisque $d \notin [a\,,b]$. Elle vérifie $\varphi(a) = \varphi(b) = 0$. Le théorème de Rolle fournit $c \in \,]a\,,b[$ tel que 
    $$\varphi'(c) = \frac{f'(c)(c - d) - f(c)}{(c - d)^{2}} = 0, \qquad\text{soit}\qquad f(c) + f'(c)(d - c) = 0.$$
     Or la tangente au point d'abscisse $c$ a pour équation $y = f(c) + f'(c)(x - c)$ : l'égalité obtenue dit qu'elle passe par le point $(d, 0)$. 
    $$\boxed{\text{la tangente au point d'abscisse } c \text{ passe par } (d, 0)}$$
     La quantité $\varphi(x)$ est la pente de la droite joignant $(d, 0)$ au point $(x, f(x))$. On cherche la position où cette pente est extrémale : la droite y est tangente à la courbe, comme un rayon lumineux issu de $(d, 0)$ qui effleure la courbe.
- id: "ma-09-16"
  feuille: "f-ma-09"
  numero: 16
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, théorème de Rolle, racines de polynômes]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $P$ une fonction polynomiale. Montrer que l'équation $P(x) = \mathrm{e}^{x}$ n'a qu'un nombre fini de solutions réelles. On raisonnera par récurrence sur le degré de $P$, en appliquant le théorème de Rolle à $x \mapsto P(x)\mathrm{e}^{-x} - 1$.
  corrige: |
    Si $P = 0$, l'équation n'a pas de solution. Sinon, soit $d$ le degré de $P$, et $h : x \mapsto P(x)\mathrm{e}^{-x} - 1$, dont les zéros sont exactement les solutions de l'équation. La fonction $h$ est dérivable sur $\mathbb{R}$, et 
    $$h'(x) = \big(P'(x) - P(x)\big)\mathrm{e}^{-x}.$$
     Le polynôme $P - P'$ a le même terme dominant que $P$ : il est de degré $d$, non nul, et s'annule donc au plus $d$ fois (chapitre 3). Ainsi $h'$ s'annule au plus $d$ fois. Si $h$ s'annulait en $d + 2$ points distincts, le théorème de Rolle fournirait $d + 1$ zéros distincts de $h'$, ce qui est impossible. 
    $$\boxed{\text{l'équation } P(x) = \mathrm{e}^{x} \text{ a au plus } d + 1 \text{ solutions}}$$
     L'énoncé suggérait une récurrence sur le degré ; l'application directe du théorème de Rolle à $h$ la rend inutile, et donne en outre une borne explicite. La borne est atteinte pour $d = 1$ : l'équation $3x = \mathrm{e}^{x}$ a deux solutions, car la fonction $x \mapsto 3x\mathrm{e}^{-x}$ croît de $0$ à $\frac{3}{\mathrm{e}} > 1$ sur $[0\,,1]$ puis décroît vers $0$.
