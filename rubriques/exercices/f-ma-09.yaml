  enonce: |
    *Un polynôme qui rencontre trop souvent le cosinus.* Soit $P$ une fonction polynomiale telle que l'équation $P(x) = \cos x$ ait une infinité de solutions réelles. On veut montrer que $P$ est constante. On suppose le contraire, et l'on note $d \geqslant 1$ le degré de $P$ et $g = P - \cos$.

    **1.** Montrer que $|P(x)| > 1$ pour $|x|$ assez grand. En déduire que les solutions sont toutes dans un segment, et qu'il existe une suite $(x_{n})$ de solutions deux à deux distinctes qui converge vers un réel $c$. On utilisera le théorème de Bolzano-Weierstrass.

    **2.** Montrer par récurrence sur $k$, à l'aide du théorème de Rolle, que pour tout $k \in \mathbb{N}$ la fonction $g^{(k)}$ s'annule en une suite de points deux à deux distincts qui converge vers $c$, et en déduire que $g^{(k)}(c) = 0$.

    **3.** Conclure, en considérant $g^{(d+1)}(c)$ et $g^{(d+2)}(c)$.
  corrige: |
    **1.** Écrivons $P(x) = a_{d}x^{d}\big(1 + \frac{a_{d-1}}{a_{d}x} + \cdots + \frac{a_{0}}{a_{d}x^{d}}\big)$ : comme $d \geqslant 1$, $|P(x)|$ tend vers $+\infty$ quand $|x|$ tend vers $+\infty$. Il existe donc $A > 0$ tel que $|P(x)| > 1$ pour $|x| > A$. Une solution $x$ vérifie $|P(x)| = |\cos x| \leqslant 1$, donc $|x| \leqslant A$ : toutes les solutions sont dans le segment $[-A\,,A]$.

    L'ensemble $S$ des solutions est infini : on peut y choisir une suite $(s_{n})$ de solutions deux à deux distinctes, en prenant pour $s_{n}$ un élément de $S \setminus \{s_{0}, \dots, s_{n-1}\}$, qui est non vide. Cette suite est bornée ; par le théorème de Bolzano-Weierstrass, elle admet une sous-suite $(x_{n})$ convergeant vers un réel $c$, et les $x_{n}$ sont encore deux à deux distincts. 
    $$\boxed{\text{il existe des solutions } x_{n} \text{ deux à deux distinctes, avec } \lim\limits_{n \to +\infty} x_{n} = c}$$

    **2.** La fonction $g$ est de classe $\mathcal{C}^{\infty}$. Montrons par récurrence sur $k$ que $g^{(k)}$ s'annule en une suite de points deux à deux distincts convergeant vers $c$. Pour $k = 0$, c'est la question 1.

    Supposons que $g^{(k)}$ s'annule en des points $y_{n}$ deux à deux distincts, de limite $c$. Au plus un des $y_{n}$ est égal à $c$, donc une infinité d'entre eux sont du même côté de $c$, disons strictement supérieurs, l'autre cas étant symétrique. On en extrait une suite strictement décroissante $(y'_{n})$ : on choisit $y'_{0} > c$ parmi eux, puis, $y'_{n} > c$ étant choisi, un terme $y_{m}$ vérifiant $c < y_{m} < y'_{n}$, qui existe puisque $(y_{m})$ tend vers $c$ et qu'une infinité de termes sont strictement supérieurs à $c$. Le théorème de Rolle, appliqué à $g^{(k)}$ sur $[y'_{n+1}\,,y'_{n}]$, fournit $z_{n} \in \,]y'_{n+1}\,,y'_{n}[$ tel que $g^{(k+1)}(z_{n}) = 0$. Les intervalles étant disjoints, les $z_{n}$ sont deux à deux distincts, et $c < z_{n} < y'_{n}$ montre que $(z_{n})$ tend vers $c$.

    Enfin, $g^{(k)}$ est continue, donc $g^{(k)}(c) = \lim\limits_{n \to +\infty} g^{(k)}(y_{n}) = 0$. 
    $$\boxed{g^{(k)}(c) = 0 \text{ pour tout } k \in \mathbb{N}}$$

    **3.** Pour $k \geqslant d + 1$, on a $P^{(k)} = 0$, donc $g^{(k)} = -\cos^{(k)}$. Or $\cos^{(k)}(c) = \cos\big(c + \frac{k\pi}{2}\big)$, donc 
    $$g^{(d+1)}(c)^{2} + g^{(d+2)}(c)^{2} = \cos^{2}\Big(c + \frac{(d + 1)\pi}{2}\Big) + \sin^{2}\Big(c + \frac{(d + 1)\pi}{2}\Big) = 1,$$
     puisque $\cos\big(\theta + \frac{\pi}{2}\big) = -\sin\theta$. Ces deux nombres ne peuvent pas être nuls tous les deux, ce qui contredit la question 2. 
    $$\boxed{P \text{ est constant}}$$
     Réciproquement, si $P$ est une constante de $[-1\,,1]$, l'équation $P = \cos x$ a bien une infinité de solutions, par périodicité. La question 2 montre plus généralement que si les zéros d'une fonction de classe $\mathcal{C}^{\infty}$ s'accumulent en un point $c$, toutes ses dérivées s'annulent en $c$ : c'est le germe du principe des zéros isolés, que l'on retrouvera pour les séries entières. La fonction plate de l'exercice 30 montre que cela n'oblige pas la fonction à être nulle.

