- id: "ma-09-01"
  feuille: "f-ma-09"
  numero: 1
  partie: "Dérivabilité en un point"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivabilité en un point]
  noeuds: [de-derivee, de-operations]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    En reconnaissant un taux d'accroissement, calculer les limites suivantes.

    **(a)** $\lim\limits_{x \to 0} \dfrac{\mathrm{e}^{3x + 2} - \mathrm{e}^{2}}{x}$

    **(b)** $\lim\limits_{x \to 1} \dfrac{\ln(2 - x)}{x - 1}$

    **(c)** $\lim\limits_{x \to \pi/2} \dfrac{\exp(\cos x) - 1}{x - \frac{\pi}{2}}$

    **(d)** $\lim\limits_{x \to 0} \dfrac{\operatorname{Arctan}(1 + x) - \frac{\pi}{4}}{x}$

    **(e)** $\lim\limits_{x \to 1} \dfrac{x^{100} - 1}{x - 1}$

    **(f)** $\lim\limits_{x \to 0} \dfrac{\sqrt[3]{1 + 2x} - 1}{x}$
  corrige: |
    Chaque quotient est le taux d'accroissement $\frac{\varphi(x) - \varphi(a)}{x - a}$ d'une fonction $\varphi$ dérivable en $a$ : sa limite est $\varphi'(a)$, que l'on calcule avec les formules du cours.

    **(a)** Avec $\varphi(x) = \mathrm{e}^{3x + 2}$ et $a = 0$, on a $\varphi'(x) = 3\mathrm{e}^{3x + 2}$, d'où $\boxed{3\mathrm{e}^{2}}$.

    **(b)** Avec $\varphi(x) = \ln(2 - x)$ et $a = 1$, on a $\varphi(1) = 0$ et $\varphi'(x) = -\frac{1}{2 - x}$, d'où $\boxed{-1}$.

    **(c)** Avec $\varphi(x) = \exp(\cos x)$ et $a = \frac{\pi}{2}$, on a $\varphi\big(\frac{\pi}{2}\big) = 1$ et $\varphi'(x) = -\sin x\,\exp(\cos x)$, d'où $\boxed{-1}$.

    **(d)** Avec $\varphi = \operatorname{Arctan}$ et $a = 1$, puisque $\operatorname{Arctan} 1 = \frac{\pi}{4}$ et $\operatorname{Arctan}'(1) = \frac{1}{1 + 1^{2}}$, la limite vaut $\boxed{\tfrac{1}{2}}$.

    **(e)** Avec $\varphi(x) = x^{100}$ et $a = 1$, la limite vaut $\boxed{100}$. On évite ainsi la factorisation de $x^{100} - 1$ par $x - 1$ du chapitre 3, qui donnerait la somme de cent termes égaux à $1$.

    **(f)** Avec $\varphi(x) = (1 + 2x)^{1/3}$ et $a = 0$, on a $\varphi'(x) = \frac{2}{3}(1 + 2x)^{-2/3}$, d'où $\boxed{\tfrac{2}{3}}$.

    *À retenir.* Reconnaître un taux d'accroissement remplace un calcul de limite par un calcul de dérivée. Il faut seulement vérifier que le numérateur s'annule bien au point considéré.
- id: "ma-09-02"
  feuille: "f-ma-09"
  numero: 2
  partie: "Dérivabilité en un point"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivabilité en un point]
  noeuds: [de-derivee, de-operations]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Préciser le domaine de définition des fonctions suivantes, puis étudier leur dérivabilité aux points indiqués, ou en tout point du domaine.

    **(a)** $f : x \mapsto \dfrac{x}{1 + |x|}$ en $0$, et $g : x \mapsto |x|\sin x$ en $0$.

    **(b)** $h$ définie par $h(x) = x - 1$ si $x \leqslant 1$, et $h(x) = (x - 1)^{2}$ si $x > 1$, en $1$.

    **(c)** $x \mapsto \sqrt{x^{2} - x^{3}}$, sur son domaine de définition.

    **(d)** $x \mapsto (x^{2} - 1)\operatorname{Arccos}(x^{2})$, sur son domaine de définition.

    **(e)** $x \mapsto \cos\sqrt{x}$, en $0$.
  corrige: |
    **(a)** La fonction $f$ est définie sur $\mathbb{R}$, puisque $1 + |x| > 0$, et $f(0) = 0$. Pour $x \neq 0$, le taux d'accroissement en $0$ vaut 
    $$\frac{f(x) - f(0)}{x} = \frac{1}{1 + |x|} \xrightarrow[x \to 0]{} 1,$$
     par continuité de la valeur absolue. De même, $g$ est définie sur $\mathbb{R}$ et 
    $$\frac{g(x) - g(0)}{x} = |x|\,\frac{\sin x}{x} \xrightarrow[x \to 0]{} 0 \times 1 = 0.$$

    $$\boxed{f \text{ et } g \text{ sont dérivables en } 0, \text{ avec } f'(0) = 1 \text{ et } g'(0) = 0}$$
     La valeur absolue, qui n'est pas dérivable en $0$, n'empêche donc pas la dérivabilité d'un produit ou d'un quotient où elle apparaît.

    **(b)** La fonction $h$ est définie sur $\mathbb{R}$ et continue en $1$, avec $h(1) = 0$. À gauche, le taux d'accroissement vaut $\frac{x - 1}{x - 1} = 1$ ; à droite, il vaut $\frac{(x - 1)^{2}}{x - 1} = x - 1$, qui tend vers $0$. Ainsi $h'_{g}(1) = 1$ et $h'_{d}(1) = 0$. 
    $$\boxed{h \text{ n'est pas dérivable en } 1}$$
     Sa courbe présente en $1$ un point anguleux, comme celle de la valeur absolue en $0$.

    **(c)** On a $x^{2} - x^{3} = x^{2}(1 - x)$, positif si et seulement si $x \leqslant 1$ : le domaine est $]-\infty\,,1]$. Sur $]-\infty\,,1[$ privé de $0$, la quantité sous la racine est strictement positive, et la fonction est dérivable par composition (théorème 2). Aux deux points restants, on revient au taux d'accroissement, en écrivant $\sqrt{x^{2}(1 - x)} = |x|\sqrt{1 - x}$.

    • En $0$, le taux vaut $\frac{|x|}{x}\sqrt{1 - x}$, qui tend vers $1$ à droite et vers $-1$ à gauche : la fonction n'est pas dérivable en $0$, où sa courbe a un point anguleux.

    • En $1$, pour $0 < x < 1$, le taux vaut $\dfrac{x\sqrt{1 - x}}{x - 1} = -\dfrac{x}{\sqrt{1 - x}}$, qui tend vers $-\infty$ : la fonction n'est pas dérivable en $1$, où sa courbe a une tangente verticale.

    $$\boxed{\text{dérivable exactement sur } ]-\infty\,,0[ \,\cup\, ]0\,,1[}$$

    **(d)** La fonction $\operatorname{Arccos}$ est définie sur $[-1\,,1]$, donc le domaine est l'ensemble des $x$ tels que $x^{2} \leqslant 1$, soit $[-1\,,1]$. Comme $\operatorname{Arccos}$ est dérivable sur $]-1\,,1[$, la fonction est dérivable sur $]-1\,,1[$ par composition et produit. En $1$, où elle s'annule, le taux d'accroissement vaut 
    $$\frac{(x^{2} - 1)\operatorname{Arccos}(x^{2})}{x - 1} = (x + 1)\operatorname{Arccos}(x^{2}) \xrightarrow[x \to 1^{-}]{} 2\operatorname{Arccos}(1) = 0,$$
     par continuité de $\operatorname{Arccos}$. La fonction étant paire, il en va de même en $-1$. 
    $$\boxed{\text{dérivable sur } [-1\,,1], \text{ avec une dérivée nulle en } \pm 1}$$
     Le facteur $x^{2} - 1$ compense la tangente verticale de $\operatorname{Arccos}$ en $1$ : c'est le phénomène inverse de celui de la question (c).

    **(e)** La fonction est définie sur $[0\,,+\infty[$. On pose $u = \sqrt{x}$, qui tend vers $0^{+}$ avec $x$, et l'on utilise $1 - \cos u = 2\sin^{2}\frac{u}{2}$ : 
    $$\frac{\cos\sqrt{x} - 1}{x} = \frac{\cos u - 1}{u^{2}} = -\frac{1}{2}\Big(\frac{\sin(u/2)}{u/2}\Big)^{2} \xrightarrow[u \to 0^{+}]{} -\frac{1}{2}.$$

    $$\boxed{\text{dérivable (à droite) en } 0, \text{ avec une dérivée égale à } -\tfrac{1}{2}}$$

    *Piège.* La formule de dérivation d'une composée ne s'applique pas en $0$, puisque la racine carrée n'y est pas dérivable : elle donnerait l'expression $-\frac{\sin\sqrt{x}}{2\sqrt{x}}$, qui n'a pas de sens en $0$. Seul le retour au taux d'accroissement permet de conclure, et la composée est dérivable bien que l'une des fonctions composées ne le soit pas.
- id: "ma-09-03"
  feuille: "f-ma-09"
  numero: 3
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivabilité en un point]
  noeuds: [de-derivee, de-operations]
  notions: [derivable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Dérivabilité de $|f|$.* Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable, et $a \in \mathbb{R}$.

    **1.** On suppose $f(a) \neq 0$. Montrer que $|f|$ est dérivable en $a$, et calculer $|f|'(a)$.

    **2.** On suppose $f(a) = 0$. Montrer que $|f|$ est dérivable en $a$ si et seulement si $f'(a) = 0$.

    **3.** Énoncer le résultat obtenu, puis l'appliquer aux fonctions $x \mapsto |\sin x|$ et $x \mapsto |x^{3} - x|$.

    **4.** Soit $f$ et $g$ dérivables sur $\mathbb{R}$. Donner une condition nécessaire et suffisante pour que $\max(f, g)$ soit dérivable en un point $x_{0}$.
  corrige: |
    **1.** Supposons $f(a) > 0$. Comme $f$ est continue en $a$ (proposition 1), elle reste strictement positive sur un voisinage de $a$, où $|f| = f$. La dérivabilité étant une propriété locale, $|f|$ est dérivable en $a$ et $|f|'(a) = f'(a)$. Si $f(a) < 0$, on obtient de même $|f|'(a) = -f'(a)$. 
    $$\boxed{|f|'(a) = \operatorname{signe}\big(f(a)\big)\,f'(a)}$$

    **2.** Si $f(a) = 0$, on a, pour $x \neq a$, 
    $$\frac{|f(x)| - |f(a)|}{x - a} = \Big|\frac{f(x) - f(a)}{x - a}\Big| \times \frac{|x - a|}{x - a}.$$
     Le premier facteur tend vers $|f'(a)|$, et le second vaut $1$ à droite et $-1$ à gauche. Ainsi $|f|'_{d}(a) = |f'(a)|$ et $|f|'_{g}(a) = -|f'(a)|$, qui sont égales si et seulement si $f'(a) = 0$. 
    $$\boxed{\text{si } f(a) = 0, \ |f| \text{ est dérivable en } a \iff f'(a) = 0}$$

    **3.** En résumé, $|f|$ est dérivable en $a$ si et seulement si $f(a) \neq 0$ ou $f'(a) = 0$ : les seuls points à problème sont les zéros de $f$ en lesquels la dérivée ne s'annule pas, où la courbe de $f$ traverse l'axe des abscisses avec une pente non nulle.

    • La fonction $\sin$ s'annule en $k\pi$, où $\cos(k\pi) = (-1)^{k} \neq 0$ : $|\sin|$ est dérivable exactement sur $\mathbb{R} \setminus \pi\mathbb{Z}$.

    • La fonction $x \mapsto x^{3} - x$ s'annule en $-1$, $0$ et $1$, où sa dérivée $3x^{2} - 1$ vaut $2$, $-1$ et $2$ : $x \mapsto |x^{3} - x|$ est dérivable exactement sur $\mathbb{R} \setminus \{-1, 0, 1\}$.

    **4.** On a $\max(f, g) = \frac{1}{2}\big(f + g + |f - g|\big)$. Comme $f + g$ est dérivable, $\max(f, g)$ est dérivable en $x_{0}$ si et seulement si $|f - g|$ l'est, et la question 3 appliquée à $f - g$ donne la condition. 
    $$\boxed{\max(f, g) \text{ dérivable en } x_{0} \iff f(x_{0}) \neq g(x_{0}) \text{ ou } f'(x_{0}) = g'(x_{0})}$$
     Géométriquement, aux points où les courbes se croisent, elles doivent avoir la même tangente pour que leur enveloppe supérieure n'ait pas de point anguleux.
- id: "ma-09-04"
  feuille: "f-ma-09"
  numero: 4
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivabilité en un point, "dérivée d'une réciproque"]
  noeuds: [de-derivee, de-operations, de-reciproque]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ et $a \in \mathbb{R}$.

    **1.** On suppose $f$ dérivable en $a$. Montrer que 
    $$\lim_{h \to 0} \frac{f(a + h) - f(a - h)}{2h} = f'(a).$$

    **2.** La réciproque est-elle vraie ?

    **3.** On suppose encore $f$ dérivable en $a$. Déterminer $\lim\limits_{x \to a} \dfrac{xf(a) - af(x)}{x - a}$.
  corrige: |
    **1.** On fait apparaître deux taux d'accroissement en $a$ : pour $h \neq 0$, 
    $$\frac{f(a + h) - f(a - h)}{2h} = \frac{1}{2}\bigg(\frac{f(a + h) - f(a)}{h} + \frac{f(a - h) - f(a)}{-h}\bigg).$$
     Les deux quotients tendent vers $f'(a)$ quand $h$ tend vers $0$, le second par composition avec $h \mapsto -h$. 
    $$\boxed{\lim\limits_{h \to 0} \frac{f(a + h) - f(a - h)}{2h} = f'(a)}$$

    **2.** La réciproque est fausse. Pour $f = |\cdot|$ et $a = 0$, le quotient vaut $\frac{|h| - |-h|}{2h} = 0$ pour tout $h \neq 0$, et sa limite existe, alors que $f$ n'est pas dérivable en $0$. 
    $$\boxed{\text{la réciproque est fausse}}$$
     Le quotient symétrique ne voit pas la différence entre les pentes à gauche et à droite : il en fait la moyenne, ici $\frac{1}{2}(1 + (-1)) = 0$. Il ne voit même pas la continuité : la fonction indicatrice de $\{0\}$ donne aussi un quotient nul.

    **3.** On ajoute et l'on retranche $af(a)$ au numérateur : pour $x \neq a$, 
    $$\frac{xf(a) - af(x)}{x - a} = \frac{(x - a)f(a) - a\big(f(x) - f(a)\big)}{x - a} = f(a) - a\,\frac{f(x) - f(a)}{x - a}.$$

    $$\boxed{\lim\limits_{x \to a} \frac{xf(a) - af(x)}{x - a} = f(a) - af'(a)}$$
- id: "ma-09-05"
  feuille: "f-ma-09"
  numero: 5
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivabilité en un point]
  noeuds: [de-derivee, de-operations]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable en $0$, avec $f(0) = 0$. Montrer que la suite de terme général 
    $$u_{n} = \sum_{k=1}^{n} f\Big(\frac{k}{n^{2}}\Big)$$
     converge, et déterminer sa limite. On pourra écrire $f(x) = x\big(f'(0) + \varepsilon(x)\big)$, avec $\lim\limits_{x \to 0} \varepsilon(x) = 0$.
  corrige: |
    La dérivabilité en $0$ avec $f(0) = 0$ signifie que $\frac{f(x)}{x}$ tend vers $f'(0)$. On pose donc $\varepsilon(x) = \frac{f(x)}{x} - f'(0)$ pour $x \neq 0$ et $\varepsilon(0) = 0$, de sorte que $f(x) = x\big(f'(0) + \varepsilon(x)\big)$ pour tout $x$, avec $\lim\limits_{x \to 0} \varepsilon(x) = 0$. Alors 
    $$u_{n} = f'(0)\sum_{k=1}^{n} \frac{k}{n^{2}} + \sum_{k=1}^{n} \frac{k}{n^{2}}\,\varepsilon\Big(\frac{k}{n^{2}}\Big), \qquad\text{avec}\qquad \sum_{k=1}^{n} \frac{k}{n^{2}} = \frac{n(n + 1)}{2n^{2}} = \frac{n + 1}{2n}.$$
     Soit $\eta > 0$, et $\delta > 0$ tel que $|\varepsilon(t)| \leqslant \eta$ pour $|t| \leqslant \delta$. Pour $n \geqslant \frac{1}{\delta}$, tous les points $\frac{k}{n^{2}}$, avec $k \leqslant n$, sont dans $\big[0\,,\frac{1}{n}\big] \subset [0\,,\delta]$, et le second terme est majoré en valeur absolue par $\eta\,\frac{n + 1}{2n} \leqslant \eta$ : il tend vers $0$. 
    $$\boxed{\lim\limits_{n \to +\infty} u_{n} = \frac{f'(0)}{2}}$$
     Par exemple, pour $f = \sin$, on obtient $\lim\limits_{n \to +\infty} \sum\limits_{k=1}^{n} \sin\frac{k}{n^{2}} = \frac{1}{2}$ : la somme se comporte comme celle des $\frac{k}{n^{2}}$, car tous les arguments sont proches de $0$.

    *Piège.* Il ne suffit pas de dire que chaque terme $\frac{k}{n^{2}}\varepsilon\big(\frac{k}{n^{2}}\big)$ est négligeable : le nombre de termes augmente avec $n$. Il faut une majoration *uniforme* de $|\varepsilon|$ sur $\big[0\,,\frac{1}{n}\big]$, que fournit la définition de la limite.
- id: "ma-09-06"
  feuille: "f-ma-09"
  numero: 6
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivabilité en un point]
  noeuds: [de-derivee, de-operations]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Que peut-on dire de la dérivée d'une fonction dérivable paire ? impaire ? périodique ?

    **2.** Soit $f : [0\,,1] \to \mathbb{R}$ dérivable, telle que $f(0) = f(1)$. On définit $g$ sur $[0\,,1]$ par $g(x) = f(2x)$ si $x \leqslant \frac{1}{2}$, et $g(x) = f(2x - 1)$ sinon. Montrer que $g$ est continue. À quelle condition sur $f$ est-elle dérivable sur $[0\,,1]$ ?
  corrige: |
    **1.** Si $f$ est paire, on dérive l'égalité $f(-x) = f(x)$ à l'aide du théorème 2 : $-f'(-x) = f'(x)$, donc $f'$ est impaire. De même, la dérivée d'une fonction impaire est paire, et la dérivée d'une fonction $T$-périodique, obtenue en dérivant $f(x + T) = f(x)$, est $T$-périodique. 
    $$\boxed{f \text{ paire} \Rightarrow f' \text{ impaire}, \quad f \text{ impaire} \Rightarrow f' \text{ paire}, \quad f \ T\text{-périodique} \Rightarrow f' \ T\text{-périodique}}$$
     Une seule réciproque est vraie : si $f'$ est impaire, la fonction $x \mapsto f(x) - f(-x)$ a pour dérivée $f'(x) + f'(-x) = 0$, elle est donc constante, égale à sa valeur $0$ en $0$, et $f$ est paire. Les deux autres sont fausses : $x \mapsto x + 1$ a une dérivée paire sans être impaire, et $x \mapsto x$ a une dérivée périodique sans être périodique ; dans les deux cas, c'est la constante d'intégration qui fait défaut.

    **2.** Sur $\big[0\,,\frac{1}{2}\big]$ et sur $\big]\frac{1}{2}\,,1\big]$, la fonction $g$ est continue comme composée de fonctions continues. En $\frac{1}{2}$, on a $g\big(\frac{1}{2}\big) = f(1)$, et la limite à droite vaut $\lim\limits_{x \to 1/2^{+}} f(2x - 1) = f(0)$, égale à $f(1)$ par hypothèse : $g$ est continue sur $[0\,,1]$.

    Sur $\big[0\,,\frac{1}{2}\big[$ et sur $\big]\frac{1}{2}\,,1\big]$, $g$ est dérivable, avec $g'(x) = 2f'(2x)$ et $g'(x) = 2f'(2x - 1)$ respectivement. En $\frac{1}{2}$, la dérivée à gauche vaut $2f'(1)$, et, pour $x > \frac{1}{2}$, en posant $h = 2x - 1$, 
    $$\frac{g(x) - g\big(\frac{1}{2}\big)}{x - \frac{1}{2}} = \frac{f(2x - 1) - f(0)}{x - \frac{1}{2}} = 2\,\frac{f(h) - f(0)}{h} \xrightarrow[x \to 1/2^{+}]{} 2f'(0).$$
     On a utilisé $g\big(\frac{1}{2}\big) = f(1) = f(0)$. 
    $$\boxed{g \text{ est dérivable sur } [0\,,1] \iff f'(0) = f'(1)}$$
     Si l'on prolonge $f$ par $1$-périodicité, la courbe de $g$ est celle de $f$ parcourue deux fois en accéléré : le raccord est lisse si et seulement si les pentes aux deux bouts coïncident.
- id: "ma-09-07"
  feuille: "f-ma-09"
  numero: 7
  partie: "Dérivabilité en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivabilité en un point, tangente]
  noeuds: [de-derivee, de-operations, de-dl1]
  notions: [derivable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Tangentes.*

    **1.** Montrer que les courbes d'équations $y = x^{2}$ et $y = \frac{1}{x}$ admettent une unique tangente commune, et en donner une équation.

    **2.** Pour tout réel $\lambda$, on note $\mathcal{C}_{\lambda}$ la courbe de $f_{\lambda} : x \mapsto \dfrac{x + \lambda}{x^{2} + 1}$. Montrer que les tangentes aux courbes $\mathcal{C}_{\lambda}$ au point d'abscisse $0$ sont parallèles, et que les tangentes au point d'abscisse $1$ sont concourantes.
  corrige: |
    **1.** La tangente à la parabole au point d'abscisse $a$ a pour équation $y = 2ax - a^{2}$, et la tangente à l'hyperbole au point d'abscisse $b \neq 0$ a pour équation $y = -\frac{x}{b^{2}} + \frac{2}{b}$. Une tangente commune correspond à un couple $(a, b)$ tel que ces deux droites coïncident, c'est-à-dire 
    $$2a = -\frac{1}{b^{2}} \qquad\text{et}\qquad -a^{2} = \frac{2}{b}.$$
     La première équation donne $a = -\frac{1}{2b^{2}}$, et la seconde devient $-\frac{1}{4b^{4}} = \frac{2}{b}$, soit $8b^{3} = -1$. On trouve $b = -\frac{1}{2}$, puis $a = -2$ : le couple est unique. 
    $$\boxed{\text{l'unique tangente commune est la droite } y = -4x - 4}$$
     Elle touche la parabole en $(-2, 4)$ et l'hyperbole en $\big(-\frac{1}{2}, -2\big)$.

    ![Figure](documents/figures/2b6167ab30abaef1.svg)

    La droite bleu pétrole touche la parabole bleue sur sa branche gauche et la branche négative de l'hyperbole ocre, sans couper ni l'une ni l'autre au voisinage des points de contact.

    **2.** La fonction $f_{\lambda}$ est dérivable sur $\mathbb{R}$, avec 
    $$f_{\lambda}'(x) = \frac{(x^{2} + 1) - 2x(x + \lambda)}{(x^{2} + 1)^{2}} = \frac{1 - x^{2} - 2\lambda x}{(x^{2} + 1)^{2}}.$$
     En $0$, on a $f_{\lambda}'(0) = 1$ pour tout $\lambda$ : les tangentes en $0$ ont toutes la pente $1$, et elles sont parallèles. En $1$, on a $f_{\lambda}(1) = \frac{1 + \lambda}{2}$ et $f_{\lambda}'(1) = -\frac{\lambda}{2}$, d'où la tangente 
    $$y = \frac{1 + \lambda}{2} - \frac{\lambda}{2}(x - 1) = \frac{1}{2} + \frac{\lambda}{2}(2 - x).$$
     Pour $x = 2$, on trouve $y = \frac{1}{2}$, quel que soit $\lambda$. 
    $$\boxed{\text{les tangentes en } 1 \text{ passent toutes par le point } \big(2, \tfrac{1}{2}\big)}$$
     On trouve ce point en écrivant l'équation de la tangente sous la forme $A(x, y) + \lambda B(x, y) = 0$ : le point commun est la solution du système $A = B = 0$.
