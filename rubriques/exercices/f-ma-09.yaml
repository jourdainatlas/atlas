  numero: 44
  partie: "Fonctions convexes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions convexes, dérivabilité en un point, dérivée et monotonie, convexité]
  noeuds: [de-monotonie, de-taf, de-derivee]
  notions: [derivable]
  page_enonce: 10
  page_corrige: 25
  enonce: |
    *Une fonction convexe est continue.* Soit $f$ convexe sur un intervalle ouvert $I$, et $a \in I$. On note $\tau_{a} : x \mapsto \frac{f(x) - f(a)}{x - a}$ le taux d'accroissement de $f$ en $a$, défini sur $I \setminus \{a\}$. Comme dans le cours, on dit que $f$ est dérivable à gauche en $a$ si $\tau_{a}$ admet une limite finie à gauche en $a$, notée 
    $$f'_{g}(a) = \lim\limits_{x \to a^{-}} \tau_{a}(x), \qquad\text{et de même}\qquad f'_{d}(a) = \lim\limits_{x \to a^{+}} \tau_{a}(x)$$
     pour la dérivée à droite.

    **1.** Soit $u < a < v$ dans $I$. À l'aide du lemme des trois pentes, montrer que $\tau_{a}$ est borné sur $[u\,,v] \setminus \{a\}$.

    **2.** En déduire que $f$ est continue en $a$, puis que $f$ est dérivable à gauche et à droite en $a$, avec $f'_{g}(a) \leqslant f'_{d}(a)$. On utilisera la monotonie de $\tau_{a}$ et le théorème de la limite monotone.

    **3.** Montrer par un exemple qu'une fonction convexe sur un segment n'est pas nécessairement continue aux extrémités.
  corrige: |
    **1.** D'après le lemme des trois pentes, $\tau_{a}$ est croissante sur $I \setminus \{a\}$. Pour $x \in [u\,,v] \setminus \{a\}$, on a donc $\tau_{a}(u) \leqslant \tau_{a}(x) \leqslant \tau_{a}(v)$. 
    $$\boxed{|\tau_{a}| \leqslant K = \max\big(|\tau_{a}(u)|, |\tau_{a}(v)|\big) \text{ sur } [u\,,v] \setminus \{a\}}$$
     Il est essentiel que $a$ soit intérieur à $I$ pour trouver $u$ et $v$ de part et d'autre : c'est là que sert l'hypothèse d'intervalle ouvert.

    **2.** Pour $x \in [u\,,v]$, on a $|f(x) - f(a)| \leqslant K|x - a|$, qui tend vers $0$ : $f$ est continue en $a$. Sur $]a\,,v]$, la fonction $\tau_{a}$ est croissante et minorée par $\tau_{a}(u)$ ; par le théorème de la limite monotone du chapitre 8, elle admet en $a^{+}$ une limite finie, égale à sa borne inférieure. De même, sur $[u\,,a[$, elle est croissante et majorée par $\tau_{a}(v)$, et admet en $a^{-}$ une limite finie, égale à sa borne supérieure. Ainsi $f$ est dérivable à gauche et à droite en $a$. Enfin, pour $x < a < y$, on a $\tau_{a}(x) \leqslant \tau_{a}(y)$, et le passage à la limite donne $f'_{g}(a) \leqslant f'_{d}(a)$. 
    $$\boxed{f \text{ est continue en } a, \text{ dérivable à gauche et à droite, avec } f'_{g}(a) \leqslant f'_{d}(a)}$$
     L'inégalité peut être stricte : pour $x \mapsto |x|$ en $0$, on a $f'_{g}(0) = -1 < 1 = f'_{d}(0)$. Une fonction convexe peut avoir des points anguleux, mais toujours « vers le bas ».

    **3.** Soit $f$ définie sur $[0\,,1]$ par $f(0) = f(1) = 1$ et $f(x) = 0$ pour $0 < x < 1$. Pour $x < y$ dans $[0\,,1]$ et $\lambda \in \,]0\,,1[$, le point $(1 - \lambda)x + \lambda y$ est dans $]0\,,1[$, où $f$ est nulle, et le membre de droite de l'inégalité de convexité est positif ; pour $\lambda \in \{0, 1\}$ ou $x = y$, l'inégalité est une égalité. Ainsi 
    $$\boxed{f \text{ est convexe sur } [0\,,1] \text{ mais discontinue en } 0 \text{ et en } 1}$$
     Aux extrémités, une fonction convexe ne peut que « sauter vers le haut ».
- id: "ma-09-45"
  feuille: "f-ma-09"
  numero: 45
  partie: "Fonctions convexes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions convexes, inégalités]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 11
  page_corrige: 25
  enonce: |
    *Inégalités de Young et de Hölder.* Soit $p$ et $q$ deux réels strictement supérieurs à $1$ tels que $\frac{1}{p} + \frac{1}{q} = 1$.

    **1.** Montrer que, pour tous réels $x$, $y > 0$, $xy \leqslant \dfrac{x^{p}}{p} + \dfrac{y^{q}}{q}$, en utilisant la concavité de $\ln$.

    **2.** Soit $a_{1}, \dots, a_{n}$, $b_{1}, \dots, b_{n}$ des réels strictement positifs tels que $\sum a_{i}^{p} = \sum b_{i}^{q} = 1$. Montrer que $\sum\limits_{i=1}^{n} a_{i}b_{i} \leqslant 1$.

    **3.** En déduire l'inégalité de Hölder, pour tous réels strictement positifs $a_{i}$ et $b_{i}$ : 
    $$\sum_{i=1}^{n} a_{i}b_{i} \leqslant \Big(\sum_{i=1}^{n} a_{i}^{p}\Big)^{1/p}\Big(\sum_{i=1}^{n} b_{i}^{q}\Big)^{1/q}.$$
     Que donne le cas $p = q = 2$ ?
  corrige: |
    **1.** Par concavité de $\ln$ avec les coefficients $\frac{1}{p}$ et $\frac{1}{q}$, de somme $1$, 
    $$\ln\Big(\frac{x^{p}}{p} + \frac{y^{q}}{q}\Big) \geqslant \frac{1}{p}\ln(x^{p}) + \frac{1}{q}\ln(y^{q}) = \ln x + \ln y = \ln(xy),$$
     et la croissance de $\exp$ conclut. 
    $$\boxed{xy \leqslant \frac{x^{p}}{p} + \frac{y^{q}}{q}}$$

    **2.** On applique la question 1 à chaque couple $(a_{i}, b_{i})$ et l'on somme : 
    $$\sum_{i=1}^{n} a_{i}b_{i} \leqslant \frac{1}{p}\sum_{i=1}^{n} a_{i}^{p} + \frac{1}{q}\sum_{i=1}^{n} b_{i}^{q} = \frac{1}{p} + \frac{1}{q}, \qquad\text{soit}\qquad \boxed{\sum_{i=1}^{n} a_{i}b_{i} \leqslant 1}$$

    **3.** On pose 
    $$A = \Big(\sum_{i=1}^{n} a_{i}^{p}\Big)^{1/p} > 0 \qquad\text{et}\qquad B = \Big(\sum_{i=1}^{n} b_{i}^{q}\Big)^{1/q} > 0.$$
     Les réels $\frac{a_{i}}{A}$ et $\frac{b_{i}}{B}$ vérifient $\sum \big(\frac{a_{i}}{A}\big)^{p} = \sum \big(\frac{b_{i}}{B}\big)^{q} = 1$, et la question 2 donne $\sum \frac{a_{i}b_{i}}{AB} \leqslant 1$, soit 
    $$\boxed{\sum_{i=1}^{n} a_{i}b_{i} \leqslant \Big(\sum_{i=1}^{n} a_{i}^{p}\Big)^{1/p}\Big(\sum_{i=1}^{n} b_{i}^{q}\Big)^{1/q}}$$
     Pour $p = q = 2$, on obtient $\sum a_{i}b_{i} \leqslant \sqrt{\sum a_{i}^{2}}\sqrt{\sum b_{i}^{2}}$ : c'est l'inégalité de Cauchy-Schwarz, que le chapitre sur les espaces préhilbertiens démontrera par une autre voie.

    *À retenir.* La normalisation de la question 3 est un procédé classique : on démontre d'abord une inégalité homogène dans un cas normalisé, puis on se ramène à ce cas en divisant par la bonne quantité.
- id: "ma-09-46"
  feuille: "f-ma-09"
  numero: 46
  partie: "Fonctions convexes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions convexes, convexité]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $f : \,]0\,,+\infty[ \,\to \mathbb{R}$ deux fois dérivable. Montrer que $x \mapsto x\,f(x)$ est convexe si et seulement si $x \mapsto f\big(\frac{1}{x}\big)$ est convexe. Application : montrer que $x \mapsto x\ln x$ et $x \mapsto -\ln x$ sont convexes, et relier les deux résultats.
  corrige: |
    Notons $g(x) = xf(x)$ et $k(x) = f\big(\frac{1}{x}\big)$, deux fois dérivables sur $]0\,,+\infty[$. On a 
    $$g''(y) = 2f'(y) + yf''(y), \qquad k'(x) = -\frac{1}{x^{2}}f'\Big(\frac{1}{x}\Big), \qquad k''(x) = \frac{2}{x^{3}}f'\Big(\frac{1}{x}\Big) + \frac{1}{x^{4}}f''\Big(\frac{1}{x}\Big).$$
     En comparant avec $g''\big(\frac{1}{x}\big) = 2f'\big(\frac{1}{x}\big) + \frac{1}{x}f''\big(\frac{1}{x}\big)$, on obtient la relation 
    $$\boxed{k''(x) = \frac{1}{x^{3}}\,g''\Big(\frac{1}{x}\Big) \text{ pour tout } x > 0}$$
     Comme $x^{3} > 0$ et que $x \mapsto \frac{1}{x}$ est une bijection de $]0\,,+\infty[$ sur lui-même, $k''$ est positive sur $]0\,,+\infty[$ si et seulement si $g''$ l'est. Le théorème 11 conclut : $x \mapsto xf(x)$ est convexe si et seulement si $x \mapsto f\big(\frac{1}{x}\big)$ l'est.

    **Application.** Pour $f = \ln$, on a $g(x) = x\ln x$, de dérivée seconde $\frac{1}{x} > 0$, donc convexe, et $k(x) = \ln\frac{1}{x} = -\ln x$. L'équivalence montre que la convexité de $x \mapsto x\ln x$ et celle de $x \mapsto -\ln x$, c'est-à-dire la concavité de $\ln$, sont une seule et même propriété.
- id: "ma-09-47"
  feuille: "f-ma-09"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [dérivabilité en un point, extrema, dérivée et monotonie, convexité]
  noeuds: [de-derivee, de-extremum, de-monotonie]
  notions: [derivable, extremum-local]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Si $f$ est dérivable en $a$, alors $f$ est continue sur un voisinage de $a$.

    **2.** Si $f$ est continue sur $I$, dérivable sur $I \setminus \{a\}$, et si $\lim\limits_{x \to a} f'(x) = \ell \in \mathbb{R}$, alors $f$ est dérivable en $a$ et $f'(a) = \ell$.

    **3.** Une fonction dérivable sur $\mathbb{R}$, de dérivée bornée, est uniformément continue sur $\mathbb{R}$.

    **4.** Si $f$ est dérivable et strictement croissante sur un intervalle $I$, alors $f' > 0$ sur $I$.

    **5.** La dérivée d'une fonction dérivable et paire est impaire.

    **6.** Si $f$ est dérivable sur $\mathbb{R}$ et si $\lim\limits_{x \to +\infty} f(x) = 0$, alors $\lim\limits_{x \to +\infty} f'(x) = 0$.

    **7.** Si $f$ est convexe et dérivable sur $\mathbb{R}$, et si $f'(a) = 0$, alors $f$ admet en $a$ un minimum global.

    **8.** Le produit de deux fonctions convexes sur $\mathbb{R}$ est convexe.

    **9.** Si $f$ est deux fois dérivable sur $\mathbb{R}$ et si $f'' > 0$, alors $f$ a au plus un point critique.

    **10.** Si $f$ est dérivable sur $[a\,,b]$ et si $f(a) = f(b)$, il existe $c \in \,]a\,,b[$ tel que $f'(c) = 0$.
  corrige: |
    **1. Faux.** La fonction $f : x \mapsto x^{2}\mathbb{1}_{\mathbb{Q}}(x)$, qui vaut $x^{2}$ sur $\mathbb{Q}$ et $0$ ailleurs, vérifie $\big|\frac{f(x) - f(0)}{x}\big| \leqslant |x|$ : elle est dérivable en $0$, avec $f'(0) = 0$. Mais elle n'est continue en aucun point $a \neq 0$ : par densité de $\mathbb{Q}$ et de $\mathbb{R} \setminus \mathbb{Q}$ (chapitre 7), il existe des suites de rationnels et d'irrationnels tendant vers $a$, le long desquelles $f$ tend vers $a^{2}$ et vers $0$ respectivement. La dérivabilité en un point n'apporte rien au voisinage de ce point.

    **2. Vrai.** C'est le théorème 8, de la limite de la dérivée. L'hypothèse de continuité en $a$ est indispensable : la fonction indicatrice de $]0\,,+\infty[$ a une dérivée nulle sur $\mathbb{R}^{*}$, mais elle n'est pas dérivable en $0$.

    **3. Vrai.** Si $|f'| \leqslant M$, l'inégalité des accroissements finis donne $|f(x) - f(y)| \leqslant M|x - y|$ : $f$ est lipschitzienne, donc uniformément continue (chapitre 8), avec $\delta = \frac{\varepsilon}{M}$ si $M > 0$.

    **4. Faux.** La fonction $x \mapsto x^{3}$ est strictement croissante sur $\mathbb{R}$, et sa dérivée s'annule en $0$. Le théorème 7 donne seulement $f' \geqslant 0$ ; la stricte croissance autorise des zéros isolés de la dérivée.

    **5. Vrai.** C'est l'exercice 6 : on dérive l'égalité $f(-x) = f(x)$.

    **6. Faux.** Soit $f(x) = \frac{\sin(x^{2})}{x}$ pour $x \neq 0$ et $f(0) = 0$. Elle tend vers $0$ en $+\infty$. Elle est dérivable sur $\mathbb{R}^{*}$, et en $0$, puisque $\frac{f(x)}{x} = \frac{\sin(x^{2})}{x^{2}}$ tend vers $1$. Pour $x \neq 0$, $f'(x) = 2\cos(x^{2}) - \frac{\sin(x^{2})}{x^{2}}$, qui vaut $2$ en $x = \sqrt{2n\pi}$ : $f'$ ne tend pas vers $0$. Une fonction peut tendre vers $0$ en oscillant de plus en plus vite.

    **7. Vrai.** Par le théorème 10, la courbe de $f$ est au-dessus de sa tangente en $a$, qui est horizontale : $f(x) \geqslant f(a) + f'(a)(x - a) = f(a)$ pour tout $x$. Pour une fonction convexe dérivable, la condition nécessaire de la proposition 2 devient suffisante.

    **8. Faux.** Les fonctions $x \mapsto x$ et $x \mapsto x^{2}$ sont convexes, mais leur produit $x \mapsto x^{3}$ ne l'est pas, puisque sa dérivée seconde $6x$ est négative sur $]-\infty\,,0[$.

    **9. Vrai.** Si $f'' > 0$, la dérivée $f'$ est strictement croissante (théorème 7), donc injective : elle s'annule au plus une fois.

    **10. Vrai.** Une fonction dérivable sur $[a\,,b]$ y est continue (proposition 1), et dérivable sur $]a\,,b[$ : ce sont les hypothèses du théorème de Rolle, et même un peu plus.

    $$\boxed{\text{vrais : } 2, 3, 5, 7, 9, 10 ; \quad \text{faux : } 1, 4, 6, 8}$$
- id: "ma-09-48"
  feuille: "f-ma-09"
  numero: 48
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [accroissements finis]
  noeuds: [de-taf, de-iaf]
  notions: []
  page_enonce: 11
  page_corrige: 27
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable telle que $f(x)^{2} + \big(1 + f'(x)\big)^{2} \leqslant 1$ pour tout réel $x$. On veut montrer que $f$ est nulle.

    **1.** Montrer que $|f| \leqslant 1$ et que $-2 \leqslant f' \leqslant 0$. En déduire que $f$ admet des limites finies $L$ et $L'$ en $+\infty$ et en $-\infty$.

    **2.** Montrer qu'il existe une suite $(c_{n})$ tendant vers $+\infty$ telle que $\lim\limits_{n \to +\infty} f'(c_{n}) = 0$. On appliquera l'égalité des accroissements finis sur $[n\,,n + 1]$.

    **3.** En déduire que $L = 0$, puis, de même, que $L' = 0$, et conclure.
  corrige: |
    **1.** Les deux termes de la somme sont positifs, donc chacun est inférieur à $1$. De $f(x)^{2} \leqslant 1$, on tire $|f(x)| \leqslant 1$ ; de $\big(1 + f'(x)\big)^{2} \leqslant 1$, on tire $-1 \leqslant 1 + f'(x) \leqslant 1$, soit 
    $$\boxed{|f| \leqslant 1 \qquad\text{et}\qquad -2 \leqslant f' \leqslant 0}$$
     Ainsi $f$ est décroissante (théorème 7) et bornée : par le théorème de la limite monotone du chapitre 8, elle admet des limites finies $L$ en $+\infty$ et $L'$ en $-\infty$, avec $L \leqslant f \leqslant L'$.

    **2.** Pour tout $n \in \mathbb{N}$, le théorème des accroissements finis fournit un réel $c_{n} \in \,]n\,,n + 1[$ tel que 
    $$f'(c_{n}) = f(n + 1) - f(n).$$
     On a $c_{n} \geqslant n$, donc $c_{n}$ tend vers $+\infty$, et $f(n + 1) - f(n)$ tend vers $L - L = 0$. 
    $$\boxed{\lim\limits_{n \to +\infty} f'(c_{n}) = 0}$$

    **3.** L'hypothèse en $c_{n}$ donne $f(c_{n})^{2} \leqslant 1 - \big(1 + f'(c_{n})\big)^{2}$. Quand $n$ tend vers $+\infty$, le membre de droite tend vers $1 - 1 = 0$, et le membre de gauche vers $L^{2}$, par composition des limites. Ainsi $L^{2} \leqslant 0$, et $L = 0$. Le même raisonnement, sur les segments $[-n - 1\,,-n]$, donne $L' = 0$. Finalement $0 = L \leqslant f(x) \leqslant L' = 0$ pour tout $x$. 
    $$\boxed{f = 0}$$
     Réciproquement, la fonction nulle vérifie l'hypothèse avec égalité. Géométriquement, le point de coordonnées $f(x)$ et $1 + f'(x)$ est dans le disque unité fermé ; la seule façon d'y rester sur tout $\mathbb{R}$ est d'être immobile en son point $(0, 1)$.
- id: "ma-09-49"
  feuille: "f-ma-09"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [extrema, dérivées successives, racines de polynômes]
  noeuds: [de-extremum, de-taylor, de-rolle]
  notions: [extremum-local, derivee-successive, classe-ck]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Soit $P$ une fonction polynomiale de degré $n \geqslant 1$, à valeurs positives sur $\mathbb{R}$, et 
    $$Q = P + P' + P'' + \cdots + P^{(n)}.$$
     On veut montrer que $Q$ est aussi à valeurs positives.

    **1.** Montrer que $n$ est pair, que le coefficient dominant de $P$ est positif, et que $\lim\limits_{x \to \pm\infty} Q(x) = +\infty$.

    **2.** En déduire que $Q$ admet un minimum global en un point $x_{0}$.

    **3.** Calculer $Q - Q'$, et conclure.
  corrige: |
    **1.** Soit $a$ le coefficient dominant de $P$. En $+\infty$, $P(x)$ a le signe de $a$ pour $x$ assez grand, et tend vers $\pm\infty$ ; comme $P \geqslant 0$, on a $a > 0$. En $-\infty$, $P(x)$ a le signe de $(-1)^{n}a$, d'où $(-1)^{n} > 0$ : $n$ est pair. Enfin, $Q = P + P' + \cdots + P^{(n)}$ a le même terme dominant $ax^{n}$ que $P$, puisque les dérivées sont de degré strictement inférieur. Avec $n$ pair et $a > 0$, 
    $$\boxed{n \text{ est pair}, \ a > 0, \ \lim\limits_{x \to \pm\infty} Q(x) = +\infty}$$

    **2.** D'après la question 1, il existe $A > 0$ tel que $Q(x) > Q(0)$ pour $|x| > A$. La fonction continue $Q$ atteint son minimum sur le segment $[-A\,,A]$ en un point $x_{0}$ (chapitre 8), et $Q(x_{0}) \leqslant Q(0) < Q(x)$ pour $|x| > A$ : $\boxed{Q \text{ admet en } x_{0} \text{ un minimum global}}$.

    **3.** Comme $P^{(n+1)} = 0$, la différence est télescopique : 
    $$Q - Q' = \big(P + P' + \cdots + P^{(n)}\big) - \big(P' + P'' + \cdots + P^{(n+1)}\big) = P.$$
     Le minimum $x_{0}$ est intérieur à $\mathbb{R}$, donc $Q'(x_{0}) = 0$ par la proposition 2, et $Q(x_{0}) = P(x_{0}) \geqslant 0$. Pour tout réel $x$, $Q(x) \geqslant Q(x_{0}) \geqslant 0$. 
    $$\boxed{Q \geqslant 0 \text{ sur } \mathbb{R}}$$
     L'idée est de regarder $Q$ là où il est le plus petit : en ce point, la relation $Q = P + Q'$ se réduit à $Q = P$, dont on connaît le signe.
- id: "ma-09-50"
  feuille: "f-ma-09"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [théorème de Rolle, dérivées successives]
  noeuds: [de-rolle, de-taylor]
  notions: [derivee-successive, classe-ck]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    *Les dérivées secondes contrôlent les dérivées premières.* Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, telle que $f$ et $f''$ soient bornées. On note $M_{0} = \sup_{\mathbb{R}} |f|$ et $M_{2} = \sup_{\mathbb{R}} |f''|$.

    **1.** Soit $x \in \mathbb{R}$ et $h > 0$. On choisit le réel $K$ tel que la fonction 
    $$\varphi : t \mapsto f(x + t) - f(x) - t\,f'(x) - \frac{t^{2}}{2}\,K$$
     s'annule en $t = h$. En appliquant deux fois le théorème de Rolle, montrer qu'il existe $c \in \,]x\,,x + h[$ tel que $K = f''(c)$, c'est-à-dire 
    $$f(x + h) = f(x) + h\,f'(x) + \frac{h^{2}}{2}\,f''(c).$$

    **2.** Établir de même une égalité analogue pour $f(x - h)$, puis en déduire que $|f'(x)| \leqslant \dfrac{M_{0}}{h} + \dfrac{h\,M_{2}}{2}$.

    **3.** En déduire que $f'$ est bornée et, si $M_{2} > 0$, que $\sup_{\mathbb{R}} |f'| \leqslant \sqrt{2M_{0}M_{2}}$, en choisissant $h$ au mieux.

    **4.** Que dire si $M_{2} = 0$ ?
  corrige: |
    **1.** On choisit $K = \frac{2}{h^{2}}\big(f(x + h) - f(x) - hf'(x)\big)$, de sorte que $\varphi(h) = 0$. La fonction $\varphi$ est de classe $\mathcal{C}^{2}$ sur $[0\,,h]$, avec 
    $$\varphi(0) = 0, \qquad \varphi'(t) = f'(x + t) - f'(x) - tK, \qquad \varphi'(0) = 0, \qquad \varphi''(t) = f''(x + t) - K.$$

    • Comme $\varphi(0) = \varphi(h) = 0$, le théorème de Rolle fournit $t_{1} \in \,]0\,,h[$ tel que $\varphi'(t_{1}) = 0$.

    • Comme $\varphi'(0) = \varphi'(t_{1}) = 0$, le théorème de Rolle appliqué à $\varphi'$ fournit $t_{2} \in \,]0\,,t_{1}[$ tel que $\varphi''(t_{2}) = 0$.

    Avec $c = x + t_{2} \in \,]x\,,x + h[$, on a $K = f''(c)$, et l'égalité $\varphi(h) = 0$ s'écrit 
    $$\boxed{f(x + h) = f(x) + hf'(x) + \frac{h^{2}}{2}f''(c)}$$
     C'est le cas $n = 2$ de l'exercice 32, déguisé : $\varphi$ s'annule en $0$ avec sa dérivée, et en $h$.

    **2.** On applique la question 1 à la fonction $u : t \mapsto f(-t)$, de classe $\mathcal{C}^{2}$, au point $-x$ : il existe $c' \in \,]x - h\,,x[$ tel que 
    $$f(x - h) = f(x) - hf'(x) + \frac{h^{2}}{2}f''(c').$$
     En soustrayant les deux égalités, $f(x + h) - f(x - h) = 2hf'(x) + \frac{h^{2}}{2}\big(f''(c) - f''(c')\big)$, donc 
    $$2h|f'(x)| \leqslant |f(x + h)| + |f(x - h)| + \frac{h^{2}}{2}\big(|f''(c)| + |f''(c')|\big) \leqslant 2M_{0} + h^{2}M_{2}.$$
     On divise par $2h$ : 
    $$\boxed{|f'(x)| \leqslant \frac{M_{0}}{h} + \frac{hM_{2}}{2}}$$

    **3.** Le membre de droite ne dépend pas de $x$ : avec $h = 1$, $f'$ est bornée par $M_{0} + \frac{M_{2}}{2}$. Si $M_{0} = 0$, $f$ est nulle et le résultat est évident. Sinon, on étudie $\psi : h \mapsto \frac{M_{0}}{h} + \frac{hM_{2}}{2}$ sur $]0\,,+\infty[$. Sa dérivée $-\frac{M_{0}}{h^{2}} + \frac{M_{2}}{2}$ s'annule en $h_{0} = \sqrt{\frac{2M_{0}}{M_{2}}}$, en passant du négatif au positif : $\psi$ y atteint son minimum, 
    $$\psi(h_{0}) = M_{0}\sqrt{\frac{M_{2}}{2M_{0}}} + \frac{M_{2}}{2}\sqrt{\frac{2M_{0}}{M_{2}}} = \sqrt{\frac{M_{0}M_{2}}{2}} + \sqrt{\frac{M_{0}M_{2}}{2}} = \sqrt{2M_{0}M_{2}}.$$

    $$\boxed{\sup_{\mathbb{R}} |f'| \leqslant \sqrt{2M_{0}M_{2}}}$$

    **4.** Si $M_{2} = 0$, la question 2 donne $|f'(x)| \leqslant \frac{M_{0}}{h}$ pour tout $h > 0$, et en faisant tendre $h$ vers $+\infty$, $f' = 0$ : $\boxed{f \text{ est constante}}$. On le voit aussi directement : $f'' = 0$, donc $f$ est affine, et une fonction affine bornée sur $\mathbb{R}$ est constante.

    *À retenir.* Cette inégalité, dite de Landau, dit que la taille d'une fonction et celle de sa dérivée seconde contrôlent celle de sa dérivée première. Pour $f = \sin$, on a $M_{0} = M_{2} = 1$ et $\sup |f'| = 1 \leqslant \sqrt{2}$ : l'ordre de grandeur $\sqrt{M_{0}M_{2}}$ est le bon. La méthode, qui choisit le pas $h$ pour équilibrer deux erreurs de sens contraires, se retrouve en analyse numérique dans le choix du pas d'une dérivée approchée.
