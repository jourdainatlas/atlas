  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Inégalités par les accroissements finis.* Démontrer les inégalités suivantes.

    **(a)** Pour tous réels $x$ et $y$, $|\operatorname{Arctan} x - \operatorname{Arctan} y| \leqslant |x - y|$.

    **(b)** Pour tout $x \geqslant 0$, $x \leqslant \mathrm{e}^{x} - 1 \leqslant x\mathrm{e}^{x}$.

    **(c)** Pour tous $0 < x < y$, $\dfrac{y - x}{1 + y^{2}} < \operatorname{Arctan} y - \operatorname{Arctan} x < \dfrac{y - x}{1 + x^{2}}$.

    Majorer ensuite l'erreur commise dans les approximations $\sqrt{10\,001} \approx 100$ et $\dfrac{1}{0{,}999^{2}} \approx 1$.
  corrige: |
    **(a)** La fonction $\operatorname{Arctan}$ est dérivable sur $\mathbb{R}$, de dérivée $\frac{1}{1 + x^{2}} \in \,]0\,,1]$. L'inégalité des accroissements finis (théorème 6) donne $\boxed{|\operatorname{Arctan} x - \operatorname{Arctan} y| \leqslant |x - y|}$ : la fonction $\operatorname{Arctan}$ est $1$-lipschitzienne.

    **(b)** Pour $x > 0$, le théorème des accroissements finis appliqué à $\exp$ sur $[0\,,x]$ fournit $c \in \,]0\,,x[$ tel que $\mathrm{e}^{x} - 1 = x\mathrm{e}^{c}$. Comme $1 \leqslant \mathrm{e}^{c} \leqslant \mathrm{e}^{x}$, on obtient $\boxed{x \leqslant \mathrm{e}^{x} - 1 \leqslant x\mathrm{e}^{x}}$, et l'inégalité est une égalité pour $x = 0$.

    **(c)** Le théorème des accroissements finis appliqué à $\operatorname{Arctan}$ sur $[x\,,y]$ fournit $c \in \,]x\,,y[$ tel que $\operatorname{Arctan} y - \operatorname{Arctan} x = \frac{y - x}{1 + c^{2}}$. Comme $0 < x < c < y$, on a $\frac{1}{1 + y^{2}} < \frac{1}{1 + c^{2}} < \frac{1}{1 + x^{2}}$, d'où 
    $$\boxed{\frac{y - x}{1 + y^{2}} < \operatorname{Arctan} y - \operatorname{Arctan} x < \frac{y - x}{1 + x^{2}}}$$

    **Approximations.** Pour la racine carrée sur $[10\,000\,,10\,001]$, il existe $c$ dans cet intervalle tel que 
    $$\sqrt{10\,001} - 100 = \frac{1}{2\sqrt{c}}, \qquad\text{donc}\qquad 0 < \sqrt{10\,001} - 100 < \frac{1}{2\sqrt{10\,000}} = \boxed{5 \cdot 10^{-3}}.$$
     La valeur exacte de l'erreur est $4{,}99987 \cdot 10^{-3}$ : la majoration est presque optimale, car la dérivée varie très peu sur l'intervalle. Pour $u : t \mapsto \frac{1}{t^{2}}$, de dérivée $-\frac{2}{t^{3}}$, il existe $c \in \,]0{,}999\,,1[$ tel que 
    $$\frac{1}{0{,}999^{2}} - 1 = \frac{2}{c^{3}} \times 10^{-3}, \qquad\text{donc}\qquad 0 < \frac{1}{0{,}999^{2}} - 1 < \frac{2 \cdot 10^{-3}}{0{,}999^{3}} < \boxed{2{,}01 \cdot 10^{-3}}.$$
     La valeur exacte est $2{,}0030 \cdot 10^{-3}$.
- id: "ma-09-18"
  feuille: "f-ma-09"
  numero: 18
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Montrer que, pour tout $x > 0$, $\dfrac{1}{x + 1} < \ln(x + 1) - \ln x < \dfrac{1}{x}$.

    **2.** Soit $v_{n} = \sum\limits_{k=n+1}^{2n} \dfrac{1}{k}$. Montrer que $\ln(2n + 1) - \ln(n + 1) < v_{n} < \ln(2n) - \ln n$, et en déduire $\lim\limits_{n \to +\infty} v_{n}$.

    **3.** Montrer de même que $\lim\limits_{n \to +\infty} \dfrac{1}{\ln n}\displaystyle\sum_{k=1}^{n} \dfrac{1}{k} = 1$.
  corrige: |
    **1.** Le théorème des accroissements finis appliqué à $\ln$ sur $[x\,,x + 1]$ fournit $c \in \,]x\,,x + 1[$ tel que $\ln(x + 1) - \ln x = \frac{1}{c}$. Comme $x < c < x + 1$, 
    $$\boxed{\frac{1}{x + 1} < \ln(x + 1) - \ln x < \frac{1}{x}}$$

    **2.** Pour $k \geqslant 2$, la question 1 avec $x = k$, puis avec $x = k - 1$, donne 
    $$\ln(k + 1) - \ln k < \frac{1}{k} < \ln k - \ln(k - 1).$$
     On somme pour $k$ allant de $n + 1$ à $2n$ : les sommes sont télescopiques, et 
    $$\ln(2n + 1) - \ln(n + 1) < v_{n} < \ln(2n) - \ln n = \ln 2.$$
     Le minorant vaut $\ln\frac{2n + 1}{n + 1}$, qui tend vers $\ln 2$ par continuité du logarithme. Par encadrement, 
    $$\boxed{\lim\limits_{n \to +\infty} v_{n} = \ln 2}$$

    **3.** De même, en sommant de $k = 1$ à $n$ la minoration, puis de $k = 2$ à $n$ la majoration, on obtient 
    $$\ln(n + 1) < \sum_{k=1}^{n} \frac{1}{k} < 1 + \ln n.$$
     Pour $n \geqslant 2$, on divise par $\ln n > 0$ : le minorant $\frac{\ln(n + 1)}{\ln n} = 1 + \frac{\ln(1 + 1/n)}{\ln n}$ et le majorant $1 + \frac{1}{\ln n}$ tendent tous deux vers $1$. 
    $$\boxed{\lim\limits_{n \to +\infty} \frac{1}{\ln n}\sum_{k=1}^{n} \frac{1}{k} = 1}$$
     La somme harmonique tend donc vers $+\infty$ à la vitesse du logarithme, ce que le chapitre 7 n'avait pas pu préciser.
- id: "ma-09-19"
  feuille: "f-ma-09"
  numero: 19
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [Rolle et accroissements finis, limite de la dérivée, dérivées successives]
  noeuds: [de-rolle, de-taf, de-iaf, de-taylor]
  notions: [derivable, derivee-successive, classe-ck]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, telle que $f(0) = 0$ et $f'(x) > 0$ pour tout $x \in [0\,,1]$.

    **1.** Montrer qu'il existe $m > 0$ tel que $f(x) \geqslant mx$ pour tout $x \in [0\,,1]$.

    **2.** Le résultat subsiste-t-il si l'on suppose seulement $f$ dérivable ? On pourra étudier la fonction $x \mapsto \frac{f(x)}{x}$, prolongée en $0$.
  corrige: |
    **1.** La fonction $f'$ est continue sur le segment $[0\,,1]$ : elle y atteint son minimum $m$ (chapitre 8), et $m > 0$ puisque ce minimum est une valeur de $f'$. Pour $x \in \,]0\,,1]$, le théorème des accroissements finis fournit $c \in \,]0\,,x[$ tel que $f(x) = f(x) - f(0) = xf'(c) \geqslant mx$, et l'inégalité est une égalité en $0$. 
    $$\boxed{f(x) \geqslant mx \text{ sur } [0\,,1], \text{ avec } m = \min_{[0,1]} f' > 0}$$

    **2.** Le résultat subsiste. Soit $g$ définie par $g(x) = \frac{f(x)}{x}$ pour $x \in \,]0\,,1]$ et $g(0) = f'(0)$. Elle est continue sur $]0\,,1]$, et en $0$ par définition de $f'(0)$, puisque $f(0) = 0$. Pour $x > 0$, le théorème des accroissements finis donne $f(x) = xf'(c) > 0$, donc $g(x) > 0$, et $g(0) = f'(0) > 0$. La fonction continue $g$ atteint son minimum $m$ sur le segment $[0\,,1]$, et $m > 0$. 
    $$\boxed{\text{le résultat subsiste, avec } m = \min_{[0,1]} g}$$
     *Piège.* Dans la question 1, il est tentant de poser $m = \inf f'$ sans justifier qu'il est strictement positif. Une fonction strictement positive peut avoir une borne inférieure nulle, comme $x \mapsto x$ sur $]0\,,1]$ : c'est le théorème des bornes atteintes, sur un segment, qui garantit $m > 0$. Dans la question 2, on ne peut plus l'appliquer à $f'$, qui peut être discontinue, d'où le recours à $g$.
- id: "ma-09-20"
  feuille: "f-ma-09"
  numero: 20
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, "dérivée d'une réciproque", accroissements finis, inégalités]
  noeuds: [de-rolle, de-taf, de-iaf, de-reciproque, de-monotonie]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    *Comportement à l'infini.* Soit $f : \,]0\,,+\infty[ \,\to \mathbb{R}$ dérivable.

    **1.** On suppose $\lim\limits_{x \to +\infty} f'(x) = \ell$, avec $\ell$ réel. Montrer que $\lim\limits_{x \to +\infty} \dfrac{f(x)}{x} = \ell$. On traitera d'abord le cas $\ell = 0$, en appliquant l'inégalité des accroissements finis sur $[A\,,x]$.

    **2.** La réciproque est-elle vraie ?

    **3.** On suppose $\lim\limits_{x \to +\infty} f'(x) = +\infty$. Montrer que $\lim\limits_{x \to +\infty} f(x) = +\infty$.

    **4.** On suppose $f$ bornée et $\lim\limits_{x \to +\infty} f'(x) = \ell$. Montrer que $\ell = 0$. Une fonction bornée dérivable a-t-elle nécessairement une dérivée de limite nulle en $+\infty$ ?
  corrige: |
    **1.** Supposons d'abord $\ell = 0$. Soit $\varepsilon > 0$, et $A > 0$ tel que $|f'(t)| \leqslant \varepsilon$ pour $t \geqslant A$. Pour $x > A$, l'inégalité des accroissements finis sur $[A\,,x]$ donne $|f(x) - f(A)| \leqslant \varepsilon(x - A) \leqslant \varepsilon x$, d'où 
    $$\Big|\frac{f(x)}{x}\Big| \leqslant \frac{|f(A)|}{x} + \varepsilon \leqslant 2\varepsilon \qquad\text{pour } x \geqslant \max\Big(A, \frac{|f(A)|}{\varepsilon}\Big).$$
     Ainsi $\frac{f(x)}{x}$ tend vers $0$. Dans le cas général, on applique ce résultat à $g : x \mapsto f(x) - \ell x$, dont la dérivée $f' - \ell$ tend vers $0$ : $\frac{f(x)}{x} - \ell$ tend vers $0$. 
    $$\boxed{\lim\limits_{x \to +\infty} \frac{f(x)}{x} = \ell}$$

    **2.** La réciproque est fausse : $f : x \mapsto \sin(x^{2})$ vérifie $\big|\frac{f(x)}{x}\big| \leqslant \frac{1}{x}$, mais $f'(x) = 2x\cos(x^{2})$ vaut $2\sqrt{2n\pi}$ en $\sqrt{2n\pi}$ et $0$ en $\sqrt{2n\pi + \frac{\pi}{2}}$ : elle n'a pas de limite. $\boxed{\text{La réciproque est fausse.}}$

    **3.** Soit $A > 0$ tel que $f'(t) \geqslant 1$ pour $t \geqslant A$. Le théorème des accroissements finis sur $[A\,,x]$ donne $f(x) \geqslant f(A) + (x - A)$, qui tend vers $+\infty$ : par minoration, $\boxed{\lim\limits_{x \to +\infty} f(x) = +\infty}$.

    **4.** Si $f$ est bornée par $M$, alors $\big|\frac{f(x)}{x}\big| \leqslant \frac{M}{x}$, qui tend vers $0$. La question 1 et l'unicité de la limite donnent $\boxed{\ell = 0}$. En revanche, une fonction bornée dérivable n'a pas nécessairement une dérivée de limite nulle : l'exemple $x \mapsto \sin(x^{2})$ de la question 2 est borné, et sa dérivée n'a pas de limite. La question 4 suppose l'existence de la limite de $f'$ ; elle n'en détermine que la valeur.
- id: "ma-09-21"
  feuille: "f-ma-09"
  numero: 21
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Calcul]
  mots_cles: [Rolle et accroissements finis, suites récurrentes]
  noeuds: [de-rolle, de-taf, de-iaf, ar-suites]
  notions: [derivable, suite]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Suites récurrentes.* Étudier la convergence des suites suivantes, et, lorsque c'est possible, majorer $|u_{n} - \ell|$ par une suite géométrique.

    **(a)** $u_{0} \in [0\,,1]$ et $u_{n+1} = \dfrac{\mathrm{e}^{u_{n}}}{\mathrm{e}^{u_{n}} + 1}$.

    **(b)** $u_{0} = 2$ et $u_{n+1} = \sqrt{1 + u_{n}}$.

    **(c)** $u_{0} = 1$ et $u_{n+1} = u_{n}\mathrm{e}^{-u_{n}}$. Peut-on, ici, appliquer la méthode du point fixe attractif ?
  corrige: |
    On applique la méthode du point fixe attractif (proposition 3) : on trouve un intervalle stable $J$ sur lequel $|\varphi'| \leqslant k < 1$, et l'inégalité des accroissements finis donne $|u_{n+1} - \ell| = |\varphi(u_{n}) - \varphi(\ell)| \leqslant k|u_{n} - \ell|$, d'où $|u_{n} - \ell| \leqslant k^{n}|u_{0} - \ell|$.

    **(a)** La fonction $\varphi : x \mapsto \frac{\mathrm{e}^{x}}{\mathrm{e}^{x} + 1}$ est dérivable, avec 
    $$\varphi'(x) = \frac{\mathrm{e}^{x}}{(\mathrm{e}^{x} + 1)^{2}} > 0.$$
     Comme $\varphi$ est croissante, $\varphi([0\,,1]) = \big[\frac{1}{2}\,,\frac{\mathrm{e}}{\mathrm{e} + 1}\big] \subset [0\,,1]$ : l'intervalle $[0\,,1]$ est stable. Par ailleurs, en posant $s = \mathrm{e}^{x}$, on a $\varphi'(x) = \frac{s}{(1 + s)^{2}} \leqslant \frac{1}{4}$, puisque $(1 + s)^{2} - 4s = (1 - s)^{2} \geqslant 0$. La fonction $x \mapsto \varphi(x) - x$ est continue, strictement décroissante puisque sa dérivée est inférieure à $\frac{1}{4} - 1$, positive en $0$ et négative en $1$ : elle s'annule en un unique point $\ell \in [0\,,1]$. Ainsi 
    $$\boxed{(u_{n}) \text{ converge vers l'unique point fixe } \ell \approx 0{,}6590, \text{ avec } |u_{n} - \ell| \leqslant \frac{1}{4^{n}}}$$

    **(b)** Soit $\varphi(x) = \sqrt{1 + x}$. L'intervalle $J = [1\,,+\infty[$ est stable, et pour $x \geqslant 1$, 
    $$0 < \varphi'(x) = \frac{1}{2\sqrt{1 + x}} \leqslant \frac{1}{2\sqrt{2}}.$$
     Le point fixe vérifie $\ell^{2} = 1 + \ell$ et $\ell \geqslant 1$, donc $\ell = \frac{1 + \sqrt{5}}{2}$, le nombre d'or. 
    $$\boxed{(u_{n}) \text{ converge vers } \tfrac{1 + \sqrt{5}}{2}, \text{ avec } |u_{n} - \ell| \leqslant \frac{2 - \ell}{(2\sqrt{2})^{n}} \leqslant \frac{0{,}39}{(2\sqrt{2})^{n}}}$$

    **(c)** Par récurrence, $u_{n} > 0$ pour tout $n$, donc $u_{n+1} = u_{n}\mathrm{e}^{-u_{n}} < u_{n}$ : la suite est décroissante et minorée par $0$, elle converge vers un réel $\ell \geqslant 0$. Par continuité de $\varphi : x \mapsto x\mathrm{e}^{-x}$, on a $\ell = \ell\mathrm{e}^{-\ell}$, donc $\ell = 0$. On a $\boxed{\lim\limits_{n \to +\infty} u_{n} = 0}$.

    La méthode du point fixe attractif ne s'applique pas, car $\varphi'(0) = 1$ : aucun intervalle contenant $0$ ne vérifie $|\varphi'| \leqslant k < 1$. Et la conclusion de la méthode est effectivement fausse ici. Si l'on avait $u_{n} \leqslant Cq^{n}$ avec $0 < q < 1$, on pourrait choisir $q'$ tel que $q < q' < 1$. Puisque $\frac{u_{n+1}}{u_{n}} = \mathrm{e}^{-u_{n}}$ tend vers $1$, on aurait $u_{n+1} \geqslant q'u_{n}$ à partir d'un rang $N$, donc $u_{n} \geqslant u_{N}q'^{\,n-N}$, et $\big(\frac{q'}{q}\big)^{n}$ serait bornée, ce qui est absurde. La convergence est plus lente que toute suite géométrique ; on observe numériquement que $nu_{n}$ est proche de $1$ pour $n$ grand.
- id: "ma-09-22"
  feuille: "f-ma-09"
  numero: 22
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Fonctions höldériennes.* Soit $\alpha > 1$ et $f : I \to \mathbb{R}$, où $I$ est un intervalle, telle qu'il existe $C > 0$ vérifiant $|f(x) - f(y)| \leqslant C|x - y|^{\alpha}$ pour tous $x$, $y \in I$. Montrer que $f$ est constante. Que dire si $\alpha = 1$ ? si $0 < \alpha < 1$ ?
  corrige: |
    Soit $x \in I$. Pour $y \in I$ distinct de $x$, 
    $$\Big|\frac{f(y) - f(x)}{y - x}\Big| \leqslant C|y - x|^{\alpha - 1} \xrightarrow[y \to x]{} 0,$$
     puisque $\alpha - 1 > 0$. Ainsi $f$ est dérivable en $x$, avec $f'(x) = 0$. La dérivée étant nulle sur l'intervalle $I$, le théorème 7 conclut. 
    $$\boxed{\text{si } \alpha > 1, \ f \text{ est constante}}$$
     Pour $\alpha = 1$, ce sont les fonctions lipschitziennes : il en existe de nombreuses non constantes, comme $x \mapsto x$, et même non dérivables, comme $x \mapsto |x|$. Pour $0 < \alpha < 1$, la racine carrée est $\frac{1}{2}$-höldérienne sur $[0\,,+\infty[$ : pour $0 \leqslant y \leqslant x$, on a $\big(\sqrt{y} + \sqrt{x - y}\big)^{2} = x + 2\sqrt{y(x - y)} \geqslant x$, donc $\sqrt{x} - \sqrt{y} \leqslant \sqrt{x - y}$. Elle n'est pourtant pas lipschitzienne, puisque son taux d'accroissement en $0$ tend vers $+\infty$. L'hypothèse avec $\alpha > 1$ est donc très forte : elle impose une pente nulle partout.
- id: "ma-09-23"
  feuille: "f-ma-09"
  numero: 23
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, extrema, limite de la dérivée]
  noeuds: [de-rolle, de-taf, de-iaf, de-extremum]
  notions: [derivable, extremum-local]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Théorème de Darboux.* Soit $I$ un intervalle et $f : I \to \mathbb{R}$ dérivable.

    **1.** Soit $a < b$ dans $I$ tels que $f'(a) < 0 < f'(b)$. Montrer que $f$ atteint son minimum sur $[a\,,b]$ en un point de $]a\,,b[$, et en déduire que $f'$ s'annule sur $]a\,,b[$.

    **2.** En déduire que $f'(I)$ est un intervalle : une dérivée vérifie la propriété des valeurs intermédiaires, même si elle n'est pas continue.

    **3.** Montrer qu'aucune fonction dérivable sur $\mathbb{R}$ n'a pour dérivée la partie entière. La fonction $g : x \mapsto x^{2}\sin\frac{1}{x}$, prolongée par $g(0) = 0$, fournit-elle un contre-exemple au résultat de la question 2 ?
  corrige: |
    **1.** La fonction $f$ est continue sur le segment $[a\,,b]$, puisqu'elle y est dérivable : elle y atteint son minimum en un point $c$. Comme $\frac{f(x) - f(a)}{x - a}$ tend vers $f'(a) < 0$ quand $x$ tend vers $a^{+}$, il existe $x \in \,]a\,,b[$ tel que $f(x) < f(a)$ : le minimum n'est pas atteint en $a$. De même, $\frac{f(x) - f(b)}{x - b}$ tend vers $f'(b) > 0$ quand $x$ tend vers $b^{-}$, donc il existe $x < b$ tel que $f(x) < f(b)$, et le minimum n'est pas atteint en $b$. Ainsi $c \in \,]a\,,b[$ est un point intérieur, et la proposition 2 donne $\boxed{f'(c) = 0}$.

    **2.** Soit $a < b$ dans $I$ et $\lambda$ un réel strictement compris entre $f'(a)$ et $f'(b)$. Si $f'(a) < \lambda < f'(b)$, la fonction $g : x \mapsto f(x) - \lambda x$ vérifie $g'(a) < 0 < g'(b)$, et la question 1 fournit $c \in \,]a\,,b[$ tel que $g'(c) = 0$, soit $f'(c) = \lambda$. Si $f'(a) > \lambda > f'(b)$, on applique ce qui précède à $-f$. Ainsi $f'(I)$ contient tout réel compris entre deux de ses éléments : c'est un intervalle, d'après la caractérisation des intervalles du chapitre 7. 
    $$\boxed{f'(I) \text{ est un intervalle}}$$

    **3.** L'image de $\mathbb{R}$ par la partie entière est $\mathbb{Z}$, qui n'est pas un intervalle : elle contient $0$ et $1$, mais pas $\frac{1}{2}$. Par la question 2, $\boxed{\text{la partie entière n'est la dérivée d'aucune fonction}}$.

    La fonction $g$ est dérivable sur $\mathbb{R}$, avec $g'(0) = \lim\limits_{x \to 0} x\sin\frac{1}{x} = 0$ et $g'(x) = 2x\sin\frac{1}{x} - \cos\frac{1}{x}$ pour $x \neq 0$. Cette dérivée n'a pas de limite en $0$, elle n'est donc pas continue. Ce n'est pas un contre-exemple : le théorème de Darboux affirme justement que $g'$, bien que discontinue, vérifie la propriété des valeurs intermédiaires, et c'est le cas, puisque $g'$ oscille entre des valeurs proches de $-1$ et de $1$ au voisinage de $0$, en passant par $0$. $\boxed{\text{Ce n'est pas un contre-exemple.}}$

    *À retenir.* Une dérivée peut être discontinue, mais pas n'importe comment : elle ne peut pas faire de saut. C'est pourquoi une fonction présentant un saut, comme la partie entière, n'a pas de primitive sur $\mathbb{R}$ ; le chapitre sur l'intégration le confirmera.
- id: "ma-09-24"
  feuille: "f-ma-09"
  numero: 24
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [Rolle et accroissements finis, théorème de Rolle, accroissements finis]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Accroissements finis généralisés.* Soit $f$ et $g$ continues sur $[a\,,b]$, dérivables sur $]a\,,b[$, telles que $g'$ ne s'annule pas sur $]a\,,b[$.

    **1.** Montrer que $g(b) \neq g(a)$, et qu'il existe $c \in \,]a\,,b[$ tel que 
    $$\frac{f(b) - f(a)}{g(b) - g(a)} = \frac{f'(c)}{g'(c)}.$$
     On appliquera le théorème de Rolle à une combinaison bien choisie de $f$ et de $g$.

    **2.** *Règle de L'Hospital.* On suppose de plus que $\lim\limits_{x \to a} \dfrac{f'(x)}{g'(x)} = \ell$. Montrer que $\lim\limits_{x \to a} \dfrac{f(x) - f(a)}{g(x) - g(a)} = \ell$.

    **3.** Application : déterminer $\lim\limits_{x \to 0^{+}} \dfrac{\cos x - \mathrm{e}^{x}}{(x + 1)\mathrm{e}^{x} - 1}$.
  corrige: |
    **1.** Si l'on avait $g(a) = g(b)$, le théorème de Rolle ferait s'annuler $g'$ sur $]a\,,b[$ : ainsi $g(b) \neq g(a)$. On pose 
    $$\varphi(x) = \big(f(b) - f(a)\big)g(x) - \big(g(b) - g(a)\big)f(x).$$
     La fonction $\varphi$ est continue sur $[a\,,b]$, dérivable sur $]a\,,b[$, et un calcul direct donne 
    $$\varphi(a) = \varphi(b) = f(b)g(a) - f(a)g(b).$$
     Le théorème de Rolle fournit $c \in \,]a\,,b[$ tel que $\varphi'(c) = 0$, c'est-à-dire 
    $$\big(f(b) - f(a)\big)g'(c) = \big(g(b) - g(a)\big)f'(c).$$
     On divise par le produit $g'(c)\big(g(b) - g(a)\big)$, qui est non nul. 
    $$\boxed{\frac{f(b) - f(a)}{g(b) - g(a)} = \frac{f'(c)}{g'(c)} \text{ pour un } c \in \,]a\,,b[}$$
     Pour $g(x) = x$, on retrouve le théorème des accroissements finis.

    **2.** Pour $x \in \,]a\,,b]$, on applique la question 1 sur $[a\,,x]$ : il existe $c_{x} \in \,]a\,,x[$ tel que 
    $$\frac{f(x) - f(a)}{g(x) - g(a)} = \frac{f'(c_{x})}{g'(c_{x})}.$$
     Soit $\varepsilon > 0$, et $\delta > 0$ tel que $\big|\frac{f'(t)}{g'(t)} - \ell\big| \leqslant \varepsilon$ pour $a < t < a + \delta$. Pour $a < x < a + \delta$, on a $a < c_{x} < a + \delta$, donc le quotient étudié est à distance au plus $\varepsilon$ de $\ell$. 
    $$\boxed{\lim\limits_{x \to a} \frac{f(x) - f(a)}{g(x) - g(a)} = \ell}$$

    **3.** On pose $f(x) = \cos x - \mathrm{e}^{x}$ et $g(x) = (x + 1)\mathrm{e}^{x} - 1$ sur $[0\,,1]$. On a $f(0) = g(0) = 0$, $f'(x) = -\sin x - \mathrm{e}^{x}$, et $g'(x) = (x + 2)\mathrm{e}^{x}$, qui ne s'annule pas sur $]0\,,1[$. Comme 
    $$\frac{f'(x)}{g'(x)} = \frac{-\sin x - \mathrm{e}^{x}}{(x + 2)\mathrm{e}^{x}} \xrightarrow[x \to 0^{+}]{} \frac{-1}{2},$$
     la question 2 donne 
    $$\boxed{\lim\limits_{x \to 0^{+}} \frac{\cos x - \mathrm{e}^{x}}{(x + 1)\mathrm{e}^{x} - 1} = -\frac{1}{2}}$$
     *Piège.* La règle de L'Hospital donne la limite du quotient *si* celle des dérivées existe. La réciproque est fausse : avec $f(x) = x^{2}\sin\frac{1}{x}$ et $g(x) = x$ en $0$, le quotient $\frac{f(x)}{g(x)}$ tend vers $0$, alors que $\frac{f'(x)}{g'(x)}$ n'a pas de limite. Dans ce cours, on préférera reconnaître un taux d'accroissement, ou attendre les développements limités du chapitre 10.
- id: "ma-09-25"
  feuille: "f-ma-09"
  numero: 25
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis, tangente, extrema, dérivées successives]
  noeuds: [de-rolle, de-taf, de-iaf, de-dl1, de-extremum, de-taylor]
  notions: [derivable, extremum-local, derivee-successive, classe-ck]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Corde et tangente.* Soit $f : [0\,,1] \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, telle que $f(0) = f'(0) = f'(1) = 0$. On veut montrer qu'il existe $c \in \,]0\,,1]$ tel que $f'(c) = \dfrac{f(c)}{c}$.

    **1.** Interpréter géométriquement la conclusion, à l'aide de la tangente au point d'abscisse $c$ et de la corde joignant l'origine à ce point.

    **2.** On pose $g(x) = \frac{f(x)}{x}$ pour $x \in \,]0\,,1]$, et $g(0) = 0$. Montrer que $g$ est continue sur $[0\,,1]$ et dérivable sur $]0\,,1]$, et calculer $g'$.

    **3.** Conclure si $f(1) = 0$. Si $f(1) > 0$, montrer que $g'(1) < 0$, en déduire que $g$ atteint son maximum en un point de $]0\,,1[$, et conclure. Traiter enfin le cas $f(1) < 0$.
  corrige: |
    **1.** La tangente au point d'abscisse $c$ a pour pente $f'(c)$, et la corde joignant l'origine, qui est sur la courbe puisque $f(0) = 0$, au point $(c, f(c))$ a pour pente $\frac{f(c)}{c}$. La conclusion dit que ces deux droites, qui passent par le point $(c, f(c))$, ont la même pente : 
    $$\boxed{\text{la tangente au point d'abscisse } c \text{ passe par l'origine}}$$
     Elle est alors confondue avec la corde.

    **2.** La fonction $g$ est continue et dérivable sur $]0\,,1]$ comme quotient, et continue en $0$ puisque $\frac{f(x)}{x} = \frac{f(x) - f(0)}{x}$ tend vers $f'(0) = 0 = g(0)$. Pour $x \in \,]0\,,1]$, 
    $$\boxed{g'(x) = \frac{xf'(x) - f(x)}{x^{2}}}$$
     La conclusion cherchée équivaut donc à l'annulation de $g'$ en un point $c \in \,]0\,,1]$.

    **3.** Si $f(1) = 0$, alors $g(0) = g(1) = 0$, et le théorème de Rolle fournit $c \in \,]0\,,1[$ tel que $g'(c) = 0$.

    Si $f(1) > 0$, on a $g'(1) = f'(1) - f(1) = -f(1) < 0$. Comme $\frac{g(x) - g(1)}{x - 1}$ tend vers $g'(1) < 0$ quand $x$ tend vers $1^{-}$, il existe $x < 1$ tel que $g(x) > g(1)$. De plus $g(1) = f(1) > 0 = g(0)$. La fonction continue $g$ atteint son maximum sur $[0\,,1]$ en un point $c$, qui n'est ni $0$, puisque $g(1) > g(0)$, ni $1$, puisque $g(x) > g(1)$. Ainsi $c \in \,]0\,,1[$ est intérieur, et $g'(c) = 0$ par la proposition 2.

    Si $f(1) < 0$, on applique ce qui précède à $-f$, qui vérifie les mêmes hypothèses. Dans tous les cas, 
    $$\boxed{\text{il existe } c \in \,]0\,,1[ \text{ tel que } f'(c) = \frac{f(c)}{c}}$$
     Ce résultat est connu sous le nom de théorème de Flett (1958). L'hypothèse $f'(0) = f'(1)$ y joue le rôle de l'hypothèse $f(a) = f(b)$ du théorème de Rolle.
- id: "ma-09-26"
  feuille: "f-ma-09"
  numero: 26
  partie: "Extrema, théorèmes de Rolle et des accroissements finis"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Rolle et accroissements finis]
  noeuds: [de-rolle, de-taf, de-iaf]
  notions: [derivable]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $n \geqslant 1$ et $f : [0\,,1] \to \mathbb{R}$ dérivable, telle que $f(0) = 0$ et $f(1) = 1$.

    **1.** Montrer qu'il existe des réels $0 = y_{0} < y_{1} < \cdots < y_{n} = 1$ tels que $f(y_{k}) = \frac{k}{n}$ pour tout $k \in [\![0\,;n]\!]$.

    **2.** En déduire l'existence de réels $x_{1} < x_{2} < \cdots < x_{n}$ de $]0\,,1[$ tels que 
    $$\sum_{k=1}^{n} \frac{1}{f'(x_{k})} = n.$$

    **3.** Montrer de même qu'il existe des réels $z_{1} < \cdots < z_{n}$ de $]0\,,1[$ tels que $\sum\limits_{k=1}^{n} f'(z_{k}) = n$.
  corrige: |
    **1.** On construit les $y_{k}$ de proche en proche. On pose $y_{0} = 0$ et $y_{n} = 1$. Si $y_{k-1} < 1$ est construit avec $f(y_{k-1}) = \frac{k - 1}{n}$, où $1 \leqslant k \leqslant n - 1$, on a $f(y_{k-1}) < \frac{k}{n} < 1 = f(1)$. Le théorème des valeurs intermédiaires, appliqué à la fonction continue $f$ sur $[y_{k-1}\,,1]$, fournit $y_{k} \in \,]y_{k-1}\,,1[$ tel que $f(y_{k}) = \frac{k}{n}$. 
    $$\boxed{0 = y_{0} < y_{1} < \cdots < y_{n} = 1, \quad f(y_{k}) = \tfrac{k}{n}}$$

    **2.** Pour $1 \leqslant k \leqslant n$, le théorème des accroissements finis sur $[y_{k-1}\,,y_{k}]$ fournit $x_{k} \in \,]y_{k-1}\,,y_{k}[$ tel que 
    $$f'(x_{k})(y_{k} - y_{k-1}) = f(y_{k}) - f(y_{k-1}) = \frac{1}{n}.$$
     En particulier $f'(x_{k}) \neq 0$, et $\frac{1}{f'(x_{k})} = n(y_{k} - y_{k-1})$. La somme est télescopique : 
    $$\boxed{\sum_{k=1}^{n} \frac{1}{f'(x_{k})} = n\sum_{k=1}^{n} (y_{k} - y_{k-1}) = n(y_{n} - y_{0}) = n}$$
     Les $x_{k}$ sont strictement croissants, car ils sont dans les intervalles disjoints $]y_{k-1}\,,y_{k}[$.

    **3.** On découpe cette fois l'intervalle de départ, et non l'intervalle d'arrivée. Pour $1 \leqslant k \leqslant n$, le théorème des accroissements finis fournit $z_{k} \in \big]\frac{k - 1}{n}\,,\frac{k}{n}\big[$ tel que 
    $$f\Big(\frac{k}{n}\Big) - f\Big(\frac{k - 1}{n}\Big) = \frac{1}{n}f'(z_{k}).$$
     En sommant ces $n$ égalités, 
    $$\boxed{\sum_{k=1}^{n} f'(z_{k}) = n\big(f(1) - f(0)\big) = n}$$
     Les deux questions sont symétriques : la première découpe les ordonnées en parts égales, la seconde les abscisses.
- id: "ma-09-27"
  feuille: "f-ma-09"
  numero: 27
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions de classe Cᵏ]
  noeuds: [de-taylor]
  notions: [classe-ck, derivee-successive]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Calculer, pour tout $n \in \mathbb{N}$, la dérivée $n$-ième des fonctions suivantes, en choisissant à chaque fois la méthode la plus adaptée.

    **(a)** $x \mapsto a^{x}$, avec $a > 0$

    **(b)** $x \mapsto \dfrac{1}{x}$ sur $\mathbb{R}^{*}$

    **(c)** $x \mapsto x^{2}\mathrm{e}^{3x}$

    **(d)** $x \mapsto (x^{3} + 2x - 7)\,\mathrm{e}^{x}$

    **(e)** $x \mapsto \dfrac{1}{21 + 5x - 4x^{2}}$

    **(f)** $x \mapsto \cos^{3}x$

    Pour (e), on écrira la fonction comme combinaison linéaire de $x \mapsto \frac{1}{3 - x}$ et $x \mapsto \frac{1}{4x + 7}$ ; pour (f), on linéarisera $\cos^{3}$, comme au chapitre 4.
  corrige: |
    Toutes ces fonctions sont de classe $\mathcal{C}^{\infty}$ sur leur domaine, par les opérations de la proposition 4. Les formules ci-dessous s'établissent par une récurrence immédiate, ou par la formule de Leibniz (théorème 9), et ont été contrôlées par le calcul formel pour $n \leqslant 5$.

    **(a)** On écrit $a^{x} = \mathrm{e}^{x\ln a}$, et chaque dérivation fait sortir un facteur $\ln a$ : 
    $$\boxed{(a^{x})^{(n)} = (\ln a)^{n}\,a^{x}}$$

    **(b)** On raisonne par récurrence : la dérivée de $(-1)^{n}n!\,x^{-n-1}$ est 
    $$(-1)^{n}n!\,(-n - 1)x^{-n-2} = (-1)^{n+1}(n + 1)!\,x^{-n-2},$$
     et 
    $$\boxed{\Big(\frac{1}{x}\Big)^{(n)} = \frac{(-1)^{n}n!}{x^{n+1}}}$$

    **(c)** La formule de Leibniz ne comporte que trois termes non nuls, puisque les dérivées de $x^{2}$ d'ordre au moins $3$ sont nulles, et $(\mathrm{e}^{3x})^{(j)} = 3^{j}\mathrm{e}^{3x}$ : 
    $$(x^{2}\mathrm{e}^{3x})^{(n)} = x^{2} \cdot 3^{n}\mathrm{e}^{3x} + n \cdot 2x \cdot 3^{n-1}\mathrm{e}^{3x} + \binom{n}{2} \cdot 2 \cdot 3^{n-2}\mathrm{e}^{3x},$$

    $$\boxed{(x^{2}\mathrm{e}^{3x})^{(n)} = 3^{n-2}\,\mathrm{e}^{3x}\big(9x^{2} + 6nx + n(n - 1)\big)}$$
     La formule reste juste pour $n = 0$ et $n = 1$, où les termes en $\binom{n}{2}$ ou en $n$ sont nuls.

    **(d)** Avec $P(x) = x^{3} + 2x - 7$, de dérivées $P' = 3x^{2} + 2$, $P'' = 6x$ et $P''' = 6$, la formule de Leibniz donne 
    $$\boxed{\big(P(x)\mathrm{e}^{x}\big)^{(n)} = \mathrm{e}^{x}\big(x^{3} + 2x - 7 + n(3x^{2} + 2) + 3n(n - 1)x + n(n - 1)(n - 2)\big)}$$
     Les coefficients $\binom{n}{2}P''$ et $\binom{n}{3}P'''$ valent $3n(n - 1)x$ et $n(n - 1)(n - 2)$.

    **(e)** On a $21 + 5x - 4x^{2} = (3 - x)(4x + 7)$. La décomposition 
    $$\frac{1}{(3 - x)(4x + 7)} = \frac{1}{19}\Big(\frac{1}{3 - x} + \frac{4}{4x + 7}\Big)$$
     se vérifie en réduisant au même dénominateur, puisque $(4x + 7) + 4(3 - x) = 19$. Or $\big(\frac{1}{3 - x}\big)^{(n)} = \frac{n!}{(3 - x)^{n+1}}$ et $\big(\frac{1}{4x + 7}\big)^{(n)} = \frac{(-1)^{n}n!\,4^{n}}{(4x + 7)^{n+1}}$, comme en (b), d'où, pour $x \notin \big\{3, -\frac{7}{4}\big\}$, 
    $$\boxed{\Big(\frac{1}{21 + 5x - 4x^{2}}\Big)^{(n)} = \frac{n!}{19}\Big(\frac{1}{(3 - x)^{n+1}} + \frac{(-1)^{n}4^{n+1}}{(4x + 7)^{n+1}}\Big)}$$

    **(f)** La formule de Moivre, ou les formules d'Euler du chapitre 4, donnent $\cos^{3}x = \frac{3\cos x + \cos(3x)}{4}$. Comme $\cos^{(n)}(x) = \cos\big(x + \frac{n\pi}{2}\big)$, 
    $$\boxed{(\cos^{3})^{(n)}(x) = \frac{1}{4}\Big(3\cos\Big(x + \frac{n\pi}{2}\Big) + 3^{n}\cos\Big(3x + \frac{n\pi}{2}\Big)\Big)}$$
     *À retenir.* La formule de Leibniz est efficace quand l'un des facteurs est polynomial : la somme s'arrête après quelques termes. Pour une fraction rationnelle, on la décompose d'abord en éléments simples, dont les dérivées successives se calculent à vue. Pour une puissance de $\cos$ ou de $\sin$, on linéarise.
- id: "ma-09-28"
  feuille: "f-ma-09"
  numero: 28
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonctions de classe Cᵏ, dérivées successives]
  noeuds: [de-taylor]
  notions: [classe-ck, derivee-successive]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Soit $n \geqslant 1$.

    **1.** Pour $0 \leqslant k \leqslant n$, calculer les dérivées $k$-ièmes de $x \mapsto x^{n-1}$ et de $x \mapsto \ln(1 + x)$.

    **2.** En déduire, à l'aide de la formule de Leibniz, la dérivée $n$-ième de $x \mapsto x^{n-1}\ln(1 + x)$ sur $]-1\,,+\infty[$, et l'écrire sous forme d'un seul quotient.
  corrige: |
    **1.** Pour $0 \leqslant k \leqslant n - 1$, on a $(x^{n-1})^{(k)} = \frac{(n - 1)!}{(n - 1 - k)!}x^{n-1-k}$, et la dérivée $n$-ième est nulle. Pour le logarithme, $\ln(1 + x)' = \frac{1}{1 + x}$, puis, comme à l'exercice 27(b), pour $k \geqslant 1$, 
    $$\boxed{\big(\ln(1 + x)\big)^{(k)} = \frac{(-1)^{k-1}(k - 1)!}{(1 + x)^{k}}}$$

    **2.** La formule de Leibniz ne fait intervenir que les termes $k \leqslant n - 1$ pour le premier facteur, donc des dérivées du logarithme d'ordre $n - k \geqslant 1$ : 
    $$\big(x^{n-1}\ln(1 + x)\big)^{(n)} = \sum_{k=0}^{n-1} \binom{n}{k}\frac{(n - 1)!}{(n - 1 - k)!}x^{n-1-k} \times \frac{(-1)^{n-k-1}(n - k - 1)!}{(1 + x)^{n-k}}.$$
     Les factorielles $(n - 1 - k)!$ se simplifient. On pose $j = n - k$, qui varie de $1$ à $n$, et l'on utilise $\binom{n}{n - j} = \binom{n}{j}$ : 
    $$\big(x^{n-1}\ln(1 + x)\big)^{(n)} = (n - 1)!\sum_{j=1}^{n} \binom{n}{j}\frac{(-1)^{j-1}x^{j-1}}{(1 + x)^{j}}.$$
     Pour $x \neq 0$, on factorise par $-\frac{1}{x}$ et l'on reconnaît la formule du binôme, privée de son terme $j = 0$ : 
    $$\sum_{j=1}^{n} \binom{n}{j}(-1)^{j-1}\frac{x^{j-1}}{(1 + x)^{j}} = -\frac{1}{x}\bigg(\Big(1 - \frac{x}{1 + x}\Big)^{n} - 1\bigg) = \frac{1}{x}\Big(1 - \frac{1}{(1 + x)^{n}}\Big).$$

    $$\boxed{\big(x^{n-1}\ln(1 + x)\big)^{(n)} = \frac{(n - 1)!\,\big((1 + x)^{n} - 1\big)}{x(1 + x)^{n}} \quad\text{pour } x \neq 0}$$
     En $0$, la somme vaut $(n - 1)!\binom{n}{1} = n!$, qui est aussi la limite du membre de droite, puisque $\frac{(1 + x)^{n} - 1}{x}$ tend vers la dérivée $n$ de $x \mapsto (1 + x)^{n}$ en $0$. Pour $n = 2$, on trouve $\frac{x + 2}{(1 + x)^{2}}$, résultat confirmé par le calcul formel.

    *Piège.* L'erreur la plus répandue est d'oublier que la dérivée $n$-ième de $x^{n-1}$ est nulle, et de conserver un terme $k = n$ qui ferait intervenir la « dérivée d'ordre $0$ » du logarithme : la somme s'arrête à $k = n - 1$, ce qui fait disparaître le logarithme du résultat.
- id: "ma-09-29"
  feuille: "f-ma-09"
  numero: 29
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonctions de classe Cᵏ, limite de la dérivée, dérivées successives]
  noeuds: [de-taylor, de-taf]
  notions: [classe-ck, derivee-successive]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Prolonger si nécessaire par continuité les fonctions suivantes, puis déterminer la plus grande classe $\mathcal{C}^{k}$ de la fonction obtenue.

    **(a)** $x \mapsto x^{2}\sin\frac{1}{x}$ et $x \mapsto x^{3}\sin\frac{1}{x}$ sur $\mathbb{R}^{*}$.

    **(b)** $x \mapsto \dfrac{\cos x - 1}{\sin x}$ sur $\big]0\,,\frac{\pi}{2}\big]$.

    **(c)** $x \mapsto (x - \lfloor x \rfloor)(x - \lfloor x \rfloor - 1)$ sur $\mathbb{R}$.

    **(d)** $x \mapsto x + a + b\,\mathrm{e}^{x}$ sur $[0\,,+\infty[$ et $x \mapsto \cos x - x$ sur $]-\infty\,,0[$, où $a$ et $b$ sont deux réels à choisir pour que la fonction soit de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. Est-elle alors de classe $\mathcal{C}^{2}$ ?
  corrige: |
    **(a)** Les deux fonctions tendent vers $0$ en $0$, comme produits d'une fonction bornée par une fonction de limite nulle : on les prolonge par $0$. Notons $f$ et $g$ les prolongements.

    • Le taux d'accroissement de $f$ en $0$ est $x\sin\frac{1}{x}$, qui tend vers $0$ : $f$ est dérivable sur $\mathbb{R}$, avec $f'(0) = 0$ et $f'(x) = 2x\sin\frac{1}{x} - \cos\frac{1}{x}$ pour $x \neq 0$. Cette dérivée n'a pas de limite en $0$, car $\cos\frac{1}{x}$ vaut $1$ en $\frac{1}{2k\pi}$ et $-1$ en $\frac{1}{(2k + 1)\pi}$.

    • Le taux d'accroissement de $g$ en $0$ est $x^{2}\sin\frac{1}{x}$, qui tend vers $0$, et $g'(x) = 3x^{2}\sin\frac{1}{x} - x\cos\frac{1}{x}$ tend vers $0$ : $g$ est de classe $\mathcal{C}^{1}$. Le taux d'accroissement de $g'$ en $0$ vaut $3x\sin\frac{1}{x} - \cos\frac{1}{x}$, qui n'a pas de limite : $g$ n'est pas deux fois dérivable en $0$.

    $$\boxed{f \text{ est dérivable mais pas de classe } \mathcal{C}^{1} ; \quad g \text{ est de classe } \mathcal{C}^{1} \text{ mais pas deux fois dérivable}}$$

    **(b)** Avec $1 - \cos x = 2\sin^{2}\frac{x}{2}$ et $\sin x = 2\sin\frac{x}{2}\cos\frac{x}{2}$, on obtient, pour $x \in \big]0\,,\frac{\pi}{2}\big]$, 
    $$\frac{\cos x - 1}{\sin x} = -\frac{\sin(x/2)}{\cos(x/2)} = -\tan\frac{x}{2}.$$
     Le prolongement par $0$ en $0$ est la fonction $x \mapsto -\tan\frac{x}{2}$ sur $\big[0\,,\frac{\pi}{2}\big]$. 
    $$\boxed{\text{le prolongement est de classe } \mathcal{C}^{\infty}}$$
     Le quotient n'avait qu'une indétermination apparente : la formule de l'angle moitié la fait disparaître.

    **(c)** La fonction $f$ est $1$-périodique, puisque $\lfloor x + 1 \rfloor = \lfloor x \rfloor + 1$, et vaut $(x - n)(x - n - 1)$ sur $[n\,,n + 1[$. Elle est de classe $\mathcal{C}^{\infty}$ sur chaque intervalle $]n\,,n + 1[$. En l'entier $n + 1$, la limite à gauche vaut $1 \times 0 = 0 = f(n + 1)$ : elle est continue sur $\mathbb{R}$. Sur $]n\,,n + 1[$, sa dérivée vaut $2(x - n) - 1$, qui tend vers $-1$ à droite de $n$ et vers $1$ à gauche de $n + 1$. Par le théorème de la limite de la dérivée, appliqué de chaque côté, $f'_{d}(n) = -1$ et $f'_{g}(n) = 1$. 
    $$\boxed{f \text{ est continue sur } \mathbb{R} \text{ mais n'est pas dérivable aux entiers}}$$
     La courbe est une suite d'arches de parabole, qui se raccordent aux entiers avec des pentes opposées.

    **(d)** Notons $f$ la fonction obtenue. Elle est de classe $\mathcal{C}^{\infty}$ sur $]-\infty\,,0[$ et sur $]0\,,+\infty[$.

    • La continuité en $0$ demande que la limite à gauche, $1$, soit égale à $f(0) = a + b$.

    • On a $f'(x) = 1 + b\mathrm{e}^{x}$ pour $x > 0$, de limite $1 + b$, et $f'(x) = -\sin x - 1$ pour $x < 0$, de limite $-1$. Par le théorème de la limite de la dérivée, $f$ est de classe $\mathcal{C}^{1}$ si et seulement si $1 + b = -1$.

    On obtient $b = -2$ et $a = 3$. Alors $f''(x) = -2\mathrm{e}^{x}$ tend vers $-2$ à droite, et $f''(x) = -\cos x$ tend vers $-1$ à gauche : par le théorème de la limite de la dérivée appliqué à $f'$ de chaque côté, $f'$ a en $0$ une dérivée à droite égale à $-2$ et une dérivée à gauche égale à $-1$. 
    $$\boxed{a = 3, \ b = -2 ; \ f \text{ est de classe } \mathcal{C}^{1} \text{ mais n'est pas deux fois dérivable en } 0}$$
- id: "ma-09-30"
  feuille: "f-ma-09"
  numero: 30
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions de classe Cᵏ, limite de la dérivée, dérivées successives, racines de polynômes]
  noeuds: [de-taylor, de-taf, de-rolle]
  notions: [classe-ck, derivee-successive]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Une fonction plate.* Soit $f : \mathbb{R} \to \mathbb{R}$ définie par $f(x) = \mathrm{e}^{-1/x}$ si $x > 0$, et $f(x) = 0$ si $x \leqslant 0$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ sur $]0\,,+\infty[$, et qu'il existe pour tout $n$ une fonction polynomiale $P_{n}$ telle que $f^{(n)}(x) = P_{n}\big(\frac{1}{x}\big)\mathrm{e}^{-1/x}$ pour $x > 0$.

    **2.** Montrer par récurrence, à l'aide du théorème de la limite de la dérivée, que $f$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, avec $f^{(n)}(0) = 0$ pour tout $n$.

    **3.** Construire une fonction $g$ de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, nulle sur $]-\infty\,,0]$ et égale à $1$ sur $[1\,,+\infty[$. On pourra considérer $\dfrac{f(x)}{f(x) + f(1 - x)}$.

    **4.** Construire une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, non nulle, et nulle en dehors d'un segment $[a\,,b]$ donné.

    Toutes les dérivées de $f$ en $0$ sont nulles, alors que $f$ n'est nulle sur aucun voisinage de $0$ : on verra plus tard dans l'année que $f$ n'est donc pas approchée en $0$ par les polynômes construits à partir de ses dérivées successives.
  corrige: |
    **1.** Sur $]0\,,+\infty[$, $f$ est de classe $\mathcal{C}^{\infty}$ comme composée de fonctions de classe $\mathcal{C}^{\infty}$. On montre l'existence de $P_{n}$ par récurrence, avec $P_{0} = 1$. Si $f^{(n)}(x) = P_{n}\big(\frac{1}{x}\big)\mathrm{e}^{-1/x}$, la dérivation d'une composée et d'un produit donne 
    $$f^{(n+1)}(x) = \Big(-\frac{1}{x^{2}}P_{n}'\Big(\frac{1}{x}\Big) + \frac{1}{x^{2}}P_{n}\Big(\frac{1}{x}\Big)\Big)\mathrm{e}^{-1/x},$$
     et l'on pose 
    $$\boxed{P_{n+1}(X) = X^{2}\big(P_{n}(X) - P_{n}'(X)\big)}$$
     qui est polynomiale. On trouve $P_{1} = X^{2}$ et $P_{2} = X^{4} - 2X^{3}$.

    **2.** Pour tout polynôme $P$, $\lim\limits_{x \to 0^{+}} P\big(\frac{1}{x}\big)\mathrm{e}^{-1/x} = \lim\limits_{u \to +\infty} P(u)\mathrm{e}^{-u} = 0$, par croissances comparées (chapitre 5) et composition. On montre par récurrence sur $n$ la propriété : « $f$ est de classe $\mathcal{C}^{n}$ sur $\mathbb{R}$, et $f^{(k)}(0) = 0$ pour $k \leqslant n$ ».

    Pour $n = 0$, $f$ est continue en $0$ puisque $\mathrm{e}^{-1/x}$ tend vers $0$ quand $x$ tend vers $0^{+}$. Supposons la propriété vraie au rang $n$. La fonction $f^{(n)}$ est continue sur $\mathbb{R}$, dérivable sur $\mathbb{R}^{*}$, et sa dérivée $f^{(n+1)}$ tend vers $0$ en $0$ : à droite d'après ce qui précède, à gauche puisqu'elle y est nulle. Le théorème de la limite de la dérivée (théorème 8) montre que $f^{(n)}$ est dérivable en $0$, avec $f^{(n+1)}(0) = 0$, et que $f^{(n+1)}$ est continue en $0$. 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{\infty} \text{ sur } \mathbb{R}, \text{ et } f^{(n)}(0) = 0 \text{ pour tout } n}$$

    **3.** Pour tout réel $x$, on a $x > 0$ ou $1 - x > 0$, donc $f(x) + f(1 - x) > 0$ : la fonction $g$ est bien définie et de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, comme quotient. Pour $x \leqslant 0$, $f(x) = 0$, donc $g(x) = 0$ ; pour $x \geqslant 1$, $f(1 - x) = 0$, donc $g(x) = 1$. 
    $$\boxed{g(x) = \frac{f(x)}{f(x) + f(1 - x)} \text{ convient}}$$

    **4.** La fonction $h : x \mapsto f(x - a)\,f(b - x)$ est de classe $\mathcal{C}^{\infty}$, strictement positive sur $]a\,,b[$, et nulle en dehors, puisque l'un des deux facteurs s'y annule. $\boxed{h \text{ convient.}}$

    ![Figure](documents/figures/126b16969d907bac.svg)

    La fonction $f$, en bleu, quitte l'axe des abscisses en $0$ de façon si plate qu'aucune dérivée ne le détecte, et la fonction $g$, en ocre, réalise un passage de $0$ à $1$ sans aucun point anguleux, contrairement à une fonction affine par morceaux.
- id: "ma-09-31"
  feuille: "f-ma-09"
  numero: 31
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [fonctions de classe Cᵏ, racines de polynômes]
  noeuds: [de-taylor, de-rolle]
  notions: [classe-ck, derivee-successive]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    On définit sur $]0\,,1[$ une suite de fonctions par $f_{0}(x) = \dfrac{1}{1 - x}$ et $f_{n+1}(x) = x\,f_{n}'(x)$.

    **1.** Calculer $f_{1}$ et $f_{2}$.

    **2.** Montrer que, pour tout $n$, il existe une fonction polynomiale $P_{n}$, de degré $n$, à coefficients entiers naturels, de coefficient dominant $1$, telle que $f_{n}(x) = \dfrac{P_{n}(x)}{(1 - x)^{n+1}}$. On exprimera $P_{n+1}$ en fonction de $P_{n}$ et $P_{n}'$.

    **3.** En déduire que chaque $f_{n}$ est strictement positive sur $]0\,,1[$.
  corrige: |
    **1.** On a $f_{0}'(x) = \frac{1}{(1 - x)^{2}}$, donc $f_{1}(x) = \frac{x}{(1 - x)^{2}}$. Puis 
    $$f_{1}'(x) = \frac{(1 - x)^{2} + 2x(1 - x)}{(1 - x)^{4}} = \frac{1 + x}{(1 - x)^{3}}, \qquad\text{donc}\qquad \boxed{f_{1}(x) = \frac{x}{(1 - x)^{2}}, \quad f_{2}(x) = \frac{x + x^{2}}{(1 - x)^{3}}}$$

    **2.** On raisonne par récurrence, avec $P_{0} = 1$. Si $f_{n} = \frac{P_{n}}{(1 - x)^{n+1}}$, alors 
    $$f_{n}' = \frac{P_{n}'}{(1 - x)^{n+1}} + \frac{(n + 1)P_{n}}{(1 - x)^{n+2}} = \frac{(1 - x)P_{n}' + (n + 1)P_{n}}{(1 - x)^{n+2}},$$
     donc $f_{n+1} = \frac{P_{n+1}}{(1 - x)^{n+2}}$ avec 
    $$\boxed{P_{n+1} = x\big((1 - x)P_{n}' + (n + 1)P_{n}\big)}$$
     Écrivons $P_{n} = \sum_{k=0}^{n} p_{k}x^{k}$, avec $p_{k} \in \mathbb{N}$ et $p_{n} = 1$. Le coefficient de $x^{k+1}$ dans $P_{n+1}$ provient des termes $x \cdot (k + 1)p_{k+1}x^{k}$, $-x \cdot x \cdot kp_{k}x^{k-1}$ et $x \cdot (n + 1)p_{k}x^{k}$ ; il vaut 
    $$(k + 1)p_{k+1} + (n + 1 - k)p_{k},$$
     avec la convention $p_{n+1} = 0$. C'est un entier naturel, puisque $k \leqslant n$. Le terme constant de $P_{n+1}$ est nul, et le coefficient de $x^{n+1}$ vaut $(n + 1 - n)p_{n} = 1$ : $P_{n+1}$ est de degré $n + 1$, de coefficient dominant $1$, à coefficients entiers naturels.

    **3.** Pour $x \in \,]0\,,1[$, tous les termes de $P_{n}(x)$ sont positifs, et le terme dominant vaut $x^{n} > 0$, donc $P_{n}(x) > 0$. Comme $(1 - x)^{n+1} > 0$, on a $\boxed{f_{n} > 0 \text{ sur } ]0\,,1[}$.

    On trouve $P_{3} = x + 4x^{2} + x^{3}$ et $P_{4} = x + 11x^{2} + 11x^{3} + x^{4}$. Ces coefficients symétriques sont les *nombres eulériens*, qui comptent les permutations de $[\![1\,;n]\!]$ selon leur nombre de montées ; la somme des coefficients de $P_{n}$ vaut d'ailleurs $n!$, comme on le vérifie sur ces exemples.
- id: "ma-09-32"
  feuille: "f-ma-09"
  numero: 32
  partie: "Fonctions de classe $\\mathcal{C}^{k}$"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions de classe Cᵏ, théorème de Rolle, dérivées successives]
  noeuds: [de-taylor, de-rolle]
  notions: [classe-ck, derivee-successive]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    *Rolle et dérivées successives.*

    **1.** Soit $f$ de classe $\mathcal{C}^{2}$ sur $[a\,,b]$, telle que $f(a) = f'(a)$ et $f(b) = f'(b)$. Montrer qu'il existe $c \in \,]a\,,b[$ tel que $f''(c) = f(c)$. On pourra introduire $h : x \mapsto \mathrm{e}^{x}\big(f'(x) - f(x)\big)$.

    **2.** Soit $n \geqslant 1$ et $f$ une fonction $n$ fois dérivable sur $[a\,,b]$, telle que $f(b) = 0$ et 
    $$f(a) = f'(a) = \cdots = f^{(n-1)}(a) = 0.$$
     Montrer qu'il existe $c \in \,]a\,,b[$ tel que $f^{(n)}(c) = 0$.
  corrige: |
    **1.** La fonction $h : x \mapsto \mathrm{e}^{x}\big(f'(x) - f(x)\big)$ est dérivable sur $[a\,,b]$, puisque $f$ est de classe $\mathcal{C}^{2}$, et 
    $$h'(x) = \mathrm{e}^{x}\big(f'(x) - f(x)\big) + \mathrm{e}^{x}\big(f''(x) - f'(x)\big) = \mathrm{e}^{x}\big(f''(x) - f(x)\big).$$
     Les hypothèses donnent $h(a) = h(b) = 0$. Le théorème de Rolle fournit $c \in \,]a\,,b[$ tel que $h'(c) = 0$, et comme $\mathrm{e}^{c} \neq 0$, 
    $$\boxed{f''(c) = f(c) \text{ pour un } c \in \,]a\,,b[}$$
     Le facteur $\mathrm{e}^{x}$ est choisi pour que $h'$ fasse apparaître $f'' - f$ : c'est le facteur intégrant des équations différentielles du chapitre 6, appliqué à $y' - y$.

    **2.** On construit par récurrence des réels $b = c_{0} > c_{1} > \cdots > c_{n} > a$ tels que $f^{(k)}(c_{k}) = 0$. On pose $c_{0} = b$. Si $c_{k}$ est construit, avec $k \leqslant n - 1$, la fonction $f^{(k)}$ est dérivable sur $[a\,,c_{k}]$ et vérifie $f^{(k)}(a) = 0 = f^{(k)}(c_{k})$. Le théorème de Rolle fournit $c_{k+1} \in \,]a\,,c_{k}[$ tel que $f^{(k+1)}(c_{k+1}) = 0$. Pour $k = n$, on obtient 
    $$\boxed{f^{(n)}(c) = 0 \text{ avec } c = c_{n} \in \,]a\,,b[}$$
     À chaque étape, on utilise un nouveau zéro en $a$ : c'est pourquoi il faut que $f$ et ses $n - 1$ premières dérivées s'annulent en $a$.
- id: "ma-09-33"
  feuille: "f-ma-09"
  numero: 33
  partie: "Fonctions à valeurs complexes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions à valeurs complexes, dérivées successives]
  noeuds: [de-operations, de-taylor]
  notions: [derivable, derivee-successive, classe-ck]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $f : x \mapsto \mathrm{e}^{x\sqrt{3}}\sin x$. En écrivant $f$ comme la partie imaginaire d'une fonction à valeurs complexes, montrer que 
    $$\forall n \in \mathbb{N},\ \forall x \in \mathbb{R}, \qquad f^{(n)}(x) = 2^{n}\,\mathrm{e}^{x\sqrt{3}}\sin\Big(x + \frac{n\pi}{6}\Big).$$
     Retrouver ce résultat par récurrence, sans les nombres complexes.
  corrige: |
    On a $f = \operatorname{Im}(\varphi)$ avec $\varphi(x) = \mathrm{e}^{x\sqrt{3}}\mathrm{e}^{\mathrm{i} x} = \mathrm{e}^{(\sqrt{3} + \mathrm{i})x}$. Par la proposition 5, $\varphi^{(n)}(x) = (\sqrt{3} + \mathrm{i})^{n}\mathrm{e}^{(\sqrt{3} + \mathrm{i})x}$, et la dérivation commute avec la partie imaginaire. Or $\sqrt{3} + \mathrm{i} = 2\mathrm{e}^{\mathrm{i}\pi/6}$, donc 
    $$\varphi^{(n)}(x) = 2^{n}\mathrm{e}^{x\sqrt{3}}\mathrm{e}^{\mathrm{i}(x + n\pi/6)}, \qquad\text{et}\qquad \boxed{f^{(n)}(x) = 2^{n}\mathrm{e}^{x\sqrt{3}}\sin\Big(x + \frac{n\pi}{6}\Big)}$$
     **Sans les nombres complexes.** Pour tout réel $\theta$, la dérivée de $x \mapsto \mathrm{e}^{x\sqrt{3}}\sin(x + \theta)$ est 
    $$\mathrm{e}^{x\sqrt{3}}\big(\sqrt{3}\sin(x + \theta) + \cos(x + \theta)\big) = 2\mathrm{e}^{x\sqrt{3}}\Big(\cos\frac{\pi}{6}\sin(x + \theta) + \sin\frac{\pi}{6}\cos(x + \theta)\Big) = 2\mathrm{e}^{x\sqrt{3}}\sin\Big(x + \theta + \frac{\pi}{6}\Big),$$
     et une récurrence immédiate conclut. Chaque dérivation multiplie l'amplitude par le module $2$ de $\sqrt{3} + \mathrm{i}$ et décale la phase de son argument $\frac{\pi}{6}$.
- id: "ma-09-34"
  feuille: "f-ma-09"
  numero: 34
  partie: "Fonctions à valeurs complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions à valeurs complexes, accroissements finis, fonctions lipschitziennes, dérivées successives, inégalités]
  noeuds: [de-operations, de-taf, de-iaf, de-taylor, de-monotonie]
  notions: [derivable, contractante, derivee-successive, classe-ck]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    **1.** Montrer que, pour tous réels $s$ et $t$, $|\mathrm{e}^{\mathrm{i} t} - \mathrm{e}^{\mathrm{i} s}| \leqslant |t - s|$. Interpréter géométriquement cette inégalité.

    **2.** Soit $f : \mathbb{R} \to \mathbb{C}$ de classe $\mathcal{C}^{1}$ et périodique. Montrer que $f$ est lipschitzienne.

    **3.** Montrer que l'égalité des accroissements finis est fausse pour $t \mapsto \mathrm{e}^{\mathrm{i} t}$ sur $[0\,,\pi]$, et non seulement sur $[0\,,2\pi]$.
  corrige: |
    **1.** La fonction $\varphi : t \mapsto \mathrm{e}^{\mathrm{i} t}$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, avec $|\varphi'(t)| = |\mathrm{i}\mathrm{e}^{\mathrm{i} t}| = 1$. L'inégalité des accroissements finis pour les fonctions à valeurs complexes (proposition 6) donne 
    $$\boxed{|\mathrm{e}^{\mathrm{i} t} - \mathrm{e}^{\mathrm{i} s}| \leqslant |t - s|}$$
     Le membre de gauche est la longueur de la corde joignant les points du cercle unité d'angles $s$ et $t$, le membre de droite la longueur d'un arc qui les joint : la corde est plus courte que l'arc.

    **2.** Soit $T > 0$ une période de $f$. La fonction réelle $|f'|$ est continue sur le segment $[0\,,T]$ : elle y atteint sa borne supérieure $M$ (chapitre 8). Par $T$-périodicité de $f'$ (exercice 6), elle est bornée par $M$ sur $\mathbb{R}$. La proposition 6 donne alors $|f(x) - f(y)| \leqslant M|x - y|$ pour tous réels $x$ et $y$. 
    $$\boxed{f \text{ est } M\text{-lipschitzienne, avec } M = \max_{[0,T]} |f'|}$$

    **3.** On a $\mathrm{e}^{\mathrm{i}\pi} - \mathrm{e}^{0} = -2$. S'il existait $c \in \,]0\,,\pi[$ tel que $-2 = \pi\varphi'(c) = \mathrm{i}\pi\mathrm{e}^{\mathrm{i} c}$, on aurait en prenant les modules $2 = \pi$, ce qui est faux. 
    $$\boxed{\text{aucun } c \in \,]0\,,\pi[ \text{ ne vérifie } \mathrm{e}^{\mathrm{i}\pi} - 1 = \pi\,\varphi'(c)}$$
     Sur $[0\,,2\pi]$, l'échec est encore plus visible, puisque le membre de gauche est nul alors que $|\varphi'| = 1$. Le contre-exemple ne vient donc pas de la périodicité : c'est la proposition 6, et non le théorème des accroissements finis, qui s'étend aux fonctions complexes.
- id: "ma-09-35"
  feuille: "f-ma-09"
  numero: 35
  partie: "Fonctions convexes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions convexes, tangente, inégalités]
  noeuds: [de-monotonie, de-taf, de-dl1]
  notions: []
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Démontrer les inégalités suivantes, en reconnaissant chaque fois la position d'une courbe par rapport à une tangente ou à une corde.

    **(a)** *Bernoulli.* Pour tout $n \geqslant 2$ et tout $x \geqslant -1$, $(1 + x)^{n} \geqslant 1 + nx$.

    **(b)** Pour tout $x \in [-1\,,1]$ et tout réel $\lambda$, $\mathrm{e}^{\lambda x} \leqslant \operatorname{ch}\lambda + x\operatorname{sh}\lambda$.

    **(c)** Pour tous $a$, $b > 0$, $\sqrt{ab} \leqslant \dfrac{a + b}{2}$, et $\dfrac{2}{\frac{1}{a} + \frac{1}{b}} \leqslant \sqrt{ab}$.

    **(d)** Pour tout $x \in \big[0\,,\frac{\pi}{2}\big]$, $\cos x \geqslant 1 - \dfrac{2x}{\pi}$.
  corrige: |
    **(a)** La fonction $\varphi : x \mapsto (1 + x)^{n}$ est deux fois dérivable sur $[-1\,,+\infty[$, avec 
    $$\varphi''(x) = n(n - 1)(1 + x)^{n-2} \geqslant 0 :$$
     elle est convexe (théorème 11). Sa courbe est au-dessus de sa tangente en $0$, d'équation $y = 1 + nx$ (théorème 10). 
    $$\boxed{(1 + x)^{n} \geqslant 1 + nx \text{ pour } x \geqslant -1}$$

    **(b)** À $\lambda$ fixé, $x \mapsto \mathrm{e}^{\lambda x}$ est convexe, de dérivée seconde $\lambda^{2}\mathrm{e}^{\lambda x} \geqslant 0$. On écrit $x \in [-1\,,1]$ sous la forme $x = (1 - \mu)(-1) + \mu \cdot 1$, avec $\mu = \frac{1 + x}{2} \in [0\,,1]$. La définition de la convexité donne 
    $$\mathrm{e}^{\lambda x} \leqslant \frac{1 - x}{2}\,\mathrm{e}^{-\lambda} + \frac{1 + x}{2}\,\mathrm{e}^{\lambda} = \frac{\mathrm{e}^{\lambda} + \mathrm{e}^{-\lambda}}{2} + x\,\frac{\mathrm{e}^{\lambda} - \mathrm{e}^{-\lambda}}{2},$$

    $$\boxed{\mathrm{e}^{\lambda x} \leqslant \operatorname{ch}\lambda + x\operatorname{sh}\lambda \text{ pour } x \in [-1\,,1]}$$
     Le membre de droite est l'ordonnée sur la corde joignant les points d'abscisses $-1$ et $1$.

    **(c)** Par concavité de $\ln$, $\ln\frac{a + b}{2} \geqslant \frac{1}{2}\ln a + \frac{1}{2}\ln b = \ln\sqrt{ab}$, et la croissance de $\exp$ donne $\sqrt{ab} \leqslant \frac{a + b}{2}$. On applique ce résultat à $\frac{1}{a}$ et $\frac{1}{b}$ : $\frac{1}{\sqrt{ab}} \leqslant \frac{1}{2}\big(\frac{1}{a} + \frac{1}{b}\big)$, et l'on passe aux inverses. 
    $$\boxed{\frac{2}{\frac{1}{a} + \frac{1}{b}} \leqslant \sqrt{ab} \leqslant \frac{a + b}{2}}$$
     La moyenne harmonique est inférieure à la moyenne géométrique, elle-même inférieure à la moyenne arithmétique.

    **(d)** La fonction $\cos$ est concave sur $\big[0\,,\frac{\pi}{2}\big]$, où $\cos'' = -\cos \leqslant 0$. Sa courbe est au-dessus de sa corde joignant $(0, 1)$ à $\big(\frac{\pi}{2}, 0\big)$, d'équation $y = 1 - \frac{2x}{\pi}$. 
    $$\boxed{\cos x \geqslant 1 - \frac{2x}{\pi} \text{ sur } \big[0\,,\tfrac{\pi}{2}\big]}$$
     C'est l'inégalité de Jordan du cours, après le changement de variable $x \mapsto \frac{\pi}{2} - x$.
- id: "ma-09-36"
  feuille: "f-ma-09"
  numero: 36
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions convexes, convexité, inégalités]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 8
  page_corrige: 20
  enonce: |
    *Avec l'inégalité de Jensen.*

    **1.** Étudier la convexité de $\varphi : t \mapsto \dfrac{1}{1 + \mathrm{e}^{t}}$ sur $\mathbb{R}$. En déduire que, pour tous réels $x_{1}, \dots, x_{n} \geqslant 1$, 
    $$\sum_{k=1}^{n} \frac{1}{1 + x_{k}} \geqslant \frac{n}{1 + \sqrt[n]{x_{1} \cdots x_{n}}}.$$

    **2.** Soit $x_{1}, \dots, x_{n}$ des réels strictement positifs. Montrer que $\dfrac{x_{1}}{x_{2}} + \dfrac{x_{2}}{x_{3}} + \cdots + \dfrac{x_{n-1}}{x_{n}} + \dfrac{x_{n}}{x_{1}} \geqslant n$.
  corrige: |
    **1.** La fonction $\varphi$ est de classe $\mathcal{C}^{\infty}$, avec 
    $$\varphi'(t) = -\frac{\mathrm{e}^{t}}{(1 + \mathrm{e}^{t})^{2}}, \qquad \varphi''(t) = \frac{\mathrm{e}^{t}(\mathrm{e}^{t} - 1)}{(1 + \mathrm{e}^{t})^{3}}.$$
     Ainsi $\boxed{\varphi \text{ est concave sur } ]-\infty\,,0] \text{ et convexe sur } [0\,,+\infty[}$, avec un point d'inflexion en $\big(0, \frac{1}{2}\big)$ (proposition 10).

    Soit $x_{1}, \dots, x_{n} \geqslant 1$ et $t_{k} = \ln x_{k} \geqslant 0$. L'inégalité de Jensen (proposition 7) pour $\varphi$, convexe sur $[0\,,+\infty[$, avec les coefficients $\frac{1}{n}$, donne 
    $$\varphi\Big(\frac{t_{1} + \cdots + t_{n}}{n}\Big) \leqslant \frac{1}{n}\sum_{k=1}^{n} \varphi(t_{k}) = \frac{1}{n}\sum_{k=1}^{n} \frac{1}{1 + x_{k}}.$$
     Or $\exp\big(\frac{t_{1} + \cdots + t_{n}}{n}\big) = \sqrt[n]{x_{1} \cdots x_{n}}$, d'où 
    $$\boxed{\sum_{k=1}^{n} \frac{1}{1 + x_{k}} \geqslant \frac{n}{1 + \sqrt[n]{x_{1} \cdots x_{n}}}}$$
     *Piège.* L'hypothèse $x_{k} \geqslant 1$ est indispensable : elle place les $t_{k}$ dans l'intervalle où $\varphi$ est convexe. Pour $n = 2$, $x_{1} = \frac{1}{100}$ et $x_{2} = 1$, l'inégalité est fausse : le membre de gauche vaut environ $1{,}490$, et le membre de droite $\frac{2}{1 + 0{,}1} \approx 1{,}818$.

    **2.** Par l'inégalité arithmético-géométrique, démontrée dans le cours par la concavité de $\ln$, 
    $$\frac{1}{n}\Big(\frac{x_{1}}{x_{2}} + \cdots + \frac{x_{n-1}}{x_{n}} + \frac{x_{n}}{x_{1}}\Big) \geqslant \sqrt[n]{\frac{x_{1}}{x_{2}} \cdots \frac{x_{n-1}}{x_{n}} \cdot \frac{x_{n}}{x_{1}}} = 1.$$

    $$\boxed{\frac{x_{1}}{x_{2}} + \cdots + \frac{x_{n-1}}{x_{n}} + \frac{x_{n}}{x_{1}} \geqslant n}$$
     Le produit télescopique vaut $1$ : c'est ce qui rend la moyenne géométrique si simple ici.
- id: "ma-09-37"
  feuille: "f-ma-09"
  numero: 37
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions convexes, convexité]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 9
  page_corrige: 20
  enonce: |
    **1.** Montrer que $f : x \mapsto \ln(1 + \mathrm{e}^{x})$ est convexe sur $\mathbb{R}$.

    **2.** En déduire que, pour tous réels $x_{1}, \dots, x_{n}$ strictement positifs, 
    $$1 + \Big(\prod_{k=1}^{n} x_{k}\Big)^{1/n} \leqslant \Big(\prod_{k=1}^{n} (1 + x_{k})\Big)^{1/n}.$$

    **3.** En déduire que, pour tous réels $a_{1}, \dots, a_{n}$, $b_{1}, \dots, b_{n}$ strictement positifs, 
    $$\Big(\prod_{k=1}^{n} a_{k}\Big)^{1/n} + \Big(\prod_{k=1}^{n} b_{k}\Big)^{1/n} \leqslant \Big(\prod_{k=1}^{n} (a_{k} + b_{k})\Big)^{1/n}.$$
  corrige: |
    **1.** On a $f'(x) = \frac{\mathrm{e}^{x}}{1 + \mathrm{e}^{x}}$ et $f''(x) = \frac{\mathrm{e}^{x}}{(1 + \mathrm{e}^{x})^{2}} > 0$ : $\boxed{f \text{ est convexe sur } \mathbb{R}}$.

    **2.** On pose $t_{k} = \ln x_{k}$. L'inégalité de Jensen avec les coefficients $\frac{1}{n}$ donne 
    $$\ln\Big(1 + \exp\Big(\frac{1}{n}\sum_{k=1}^{n} t_{k}\Big)\Big) \leqslant \frac{1}{n}\sum_{k=1}^{n} \ln(1 + x_{k}) = \ln\Big(\prod_{k=1}^{n} (1 + x_{k})\Big)^{1/n}.$$
     Comme $\exp\big(\frac{1}{n}\sum t_{k}\big) = \big(\prod x_{k}\big)^{1/n}$, la croissance de $\exp$ donne 
    $$\boxed{1 + \Big(\prod_{k=1}^{n} x_{k}\Big)^{1/n} \leqslant \Big(\prod_{k=1}^{n} (1 + x_{k})\Big)^{1/n}}$$

    **3.** On applique la question 2 à $x_{k} = \frac{b_{k}}{a_{k}}$, puis on multiplie par $\big(\prod a_{k}\big)^{1/n}$ : 
    $$\Big(\prod_{k=1}^{n} a_{k}\Big)^{1/n}\bigg(1 + \Big(\prod_{k=1}^{n} \frac{b_{k}}{a_{k}}\Big)^{1/n}\bigg) \leqslant \Big(\prod_{k=1}^{n} a_{k}\Big)^{1/n}\Big(\prod_{k=1}^{n} \frac{a_{k} + b_{k}}{a_{k}}\Big)^{1/n},$$

    $$\boxed{\Big(\prod_{k=1}^{n} a_{k}\Big)^{1/n} + \Big(\prod_{k=1}^{n} b_{k}\Big)^{1/n} \leqslant \Big(\prod_{k=1}^{n} (a_{k} + b_{k})\Big)^{1/n}}$$
     C'est une inégalité triangulaire renversée pour la moyenne géométrique : la moyenne d'une somme dépasse la somme des moyennes.
- id: "ma-09-38"
  feuille: "f-ma-09"
  numero: 38
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions convexes, dérivée et monotonie, convexité]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Opérations sur les fonctions convexes.* Soit $I$ un intervalle.

    **1.** Soit $f : I \to \mathbb{R}$ convexe et $g : J \to \mathbb{R}$ convexe et croissante, où $J$ est un intervalle contenant $f(I)$. Montrer que $g \circ f$ est convexe. Montrer par un exemple que l'hypothèse de croissance est utile.

    **2.** Soit $f$ et $g$ convexes sur $I$. La fonction $\max(f, g)$ est-elle convexe ? et $\min(f, g)$ ? et $fg$ ?

    **3.** Soit $f : I \to \mathbb{R}$ continue, convexe et strictement croissante. Étudier la convexité de $f^{-1}$ sur l'intervalle $f(I)$.
  corrige: |
    **1.** Soit $x$, $y \in I$ et $\lambda \in [0\,,1]$. Par convexité de $f$, $f\big((1 - \lambda)x + \lambda y\big) \leqslant (1 - \lambda)f(x) + \lambda f(y)$, et ce dernier réel est dans $J$, qui est un intervalle contenant $f(x)$ et $f(y)$. La croissance de $g$, puis sa convexité, donnent 
    $$g\big(f((1 - \lambda)x + \lambda y)\big) \leqslant g\big((1 - \lambda)f(x) + \lambda f(y)\big) \leqslant (1 - \lambda)g\big(f(x)\big) + \lambda g\big(f(y)\big).$$

    $$\boxed{g \circ f \text{ est convexe}}$$
     L'hypothèse de croissance est utile : avec $f(x) = x^{2}$ et $g(t) = -t$, convexe car affine, mais décroissante, $g \circ f = -x^{2}$ est concave et non convexe. Ainsi $\mathrm{e}^{f}$ est convexe dès que $f$ l'est, mais pas $\frac{1}{f}$ en général.

    **2.** Soit $h = \max(f, g)$. Avec les mêmes notations, 
    $$f\big((1 - \lambda)x + \lambda y\big) \leqslant (1 - \lambda)f(x) + \lambda f(y) \leqslant (1 - \lambda)h(x) + \lambda h(y),$$
     et de même pour $g$ ; le maximum des deux membres de gauche vérifie donc la même inégalité : $\boxed{\max(f, g) \text{ est convexe}}$. En revanche, $\min(f, g)$ et $fg$ ne le sont pas en général : avec $f(x) = x$ et $g(x) = -x$, on obtient $\min(f, g) = -|x|$, qui est concave ; avec $f(x) = x$ et $g(x) = x^{2}$, on obtient $x^{3}$, qui n'est pas convexe sur $\mathbb{R}$. $\boxed{\min(f, g) \text{ et } fg \text{ ne sont pas convexes en général.}}$

    **3.** L'ensemble $f(I)$ est un intervalle, par le théorème des valeurs intermédiaires, et $f^{-1}$ est strictement croissante. Soit $u$, $v \in f(I)$, $x = f^{-1}(u)$, $y = f^{-1}(v)$ et $\lambda \in [0\,,1]$. Par convexité de $f$, 
    $$f\big((1 - \lambda)x + \lambda y\big) \leqslant (1 - \lambda)u + \lambda v,$$
     et l'on applique la fonction croissante $f^{-1}$ : 
    $$(1 - \lambda)f^{-1}(u) + \lambda f^{-1}(v) \leqslant f^{-1}\big((1 - \lambda)u + \lambda v\big).$$

    $$\boxed{f^{-1} \text{ est concave sur } f(I)}$$
     C'est la situation de $\exp$, convexe et croissante, et de $\ln$, concave : la symétrie par rapport à la première bissectrice échange le dessus et le dessous des cordes. Si $f$ était convexe et décroissante, $f^{-1}$ serait convexe, comme le montre $x \mapsto \frac{1}{x}$ sur $]0\,,+\infty[$.
- id: "ma-09-39"
  feuille: "f-ma-09"
  numero: 39
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions convexes, extrema, dérivée et monotonie, convexité]
  noeuds: [de-monotonie, de-taf, de-extremum]
  notions: [extremum-local]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Comportement global d'une fonction convexe.* Soit $f : \mathbb{R} \to \mathbb{R}$ convexe.

    **1.** Montrer que si $f$ admet un minimum local en $a$, c'est un minimum global. Que dire d'un maximum local ?

    **2.** On suppose $f$ croissante. Montrer que $f$ est constante, ou que $\lim\limits_{x \to +\infty} f(x) = +\infty$.

    **3.** On suppose $\lim\limits_{x \to +\infty} f(x) = 0$. Montrer que $f \geqslant 0$ sur $\mathbb{R}$, et que $f$ est décroissante.

    **4.** On suppose que la droite d'équation $y = \alpha x + \beta$ est asymptote à la courbe de $f$ en $+\infty$. Montrer que la courbe est au-dessus de cette asymptote.
  corrige: |
    **1.** Soit $\eta > 0$ tel que $f(a) \leqslant f(x)$ pour $|x - a| < \eta$, et $y$ un réel distinct de $a$. Pour $\lambda \in \,]0\,,1]$ assez petit, le point $x = (1 - \lambda)a + \lambda y$ vérifie $|x - a| = \lambda|y - a| < \eta$, donc 
    $$f(a) \leqslant f(x) \leqslant (1 - \lambda)f(a) + \lambda f(y), \qquad\text{d'où}\qquad \lambda f(a) \leqslant \lambda f(y).$$
     On divise par $\lambda > 0$ : $\boxed{f(a) \leqslant f(y) \text{ pour tout } y, \text{ le minimum est global}}$.

    Pour un maximum local en $a$, avec $f(a) \geqslant f(x)$ pour $|x - a| < \eta$, on écrit, pour $0 < h < \eta$, que $a$ est le milieu de $a - h$ et $a + h$ : 
    $$f(a) \leqslant \frac{f(a - h) + f(a + h)}{2} \leqslant f(a).$$
     Les deux valeurs $f(a \pm h)$ sont inférieures à $f(a)$ et de moyenne au moins $f(a)$ : elles sont égales à $f(a)$. Ainsi $\boxed{f \text{ est constante au voisinage de } a}$, mais ce maximum n'est pas nécessairement global : $x \mapsto \max(0, x)$, convexe par l'exercice 38, a un maximum local en $-1$, qui n'est pas global.

    **2.** Supposons $f$ croissante et non constante : il existe $x < y$ tels que $f(x) < f(y)$, et la pente $s = \frac{f(y) - f(x)}{y - x}$ est strictement positive. Par la proposition 9, la courbe est au-dessus de la sécante $(xy)$ en dehors de $[x\,,y]$ : pour $t > y$, $f(t) \geqslant f(y) + s(t - y)$, qui tend vers $+\infty$. 
    $$\boxed{f \text{ est constante, ou } \lim\limits_{x \to +\infty} f(x) = +\infty}$$

    **3.** Montrons que $f$ est décroissante. Sinon, il existe $x < y$ tels que $f(x) < f(y)$, et l'argument de la question 2, qui n'utilisait que cette inégalité, donne $\lim\limits_{+\infty} f = +\infty$, ce qui contredit l'hypothèse. Ainsi $f$ est décroissante, et pour tout réel $x$, $f(x) \geqslant \lim\limits_{t \to +\infty} f(t) = 0$. 
    $$\boxed{f \text{ est décroissante et positive}}$$
     Une fonction convexe qui tend vers $0$ en $+\infty$ y arrive donc par valeurs supérieures, en décroissant, comme $x \mapsto \mathrm{e}^{-x}$.

    **4.** La fonction $g : x \mapsto f(x) - \alpha x - \beta$ est convexe, comme somme d'une fonction convexe et d'une fonction affine, et tend vers $0$ en $+\infty$ par définition de l'asymptote. Par la question 3, $g \geqslant 0$ : 
    $$\boxed{\text{la courbe de } f \text{ est au-dessus de son asymptote en } +\infty}$$
     Par exemple, la courbe de $x \mapsto \sqrt{x^{2} + 1}$ est au-dessus de son asymptote $y = x$ en $+\infty$.
- id: "ma-09-40"
  feuille: "f-ma-09"
