  page_enonce: 9
  page_corrige: 22
  enonce: |
    *Majorer $f$ à l'aide de $f''$.* Soit $f : [a\,,b] \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ telle que $f(a) = f(b) = 0$. On note $M = \sup_{[a,b]} |f''|$ et, pour $x \in [a\,,b]$, 
    $$g(x) = f(x) - \frac{M}{2}(x - a)(b - x) \qquad\text{et}\qquad h(x) = f(x) + \frac{M}{2}(x - a)(b - x).$$

    **1.** Justifier l'existence de $M$, et montrer que $g$ est convexe et $h$ concave.

    **2.** En déduire que $|f(x)| \leqslant \dfrac{M}{2}(x - a)(b - x)$ pour tout $x \in [a\,,b]$, puis que $|f| \leqslant \dfrac{M(b - a)^{2}}{8}$.
  corrige: |
    **1.** La fonction $|f''|$ est continue sur le segment $[a\,,b]$ : elle y est bornée et atteint sa borne supérieure $M$ (chapitre 8). La fonction $q : x \mapsto (x - a)(b - x)$ a pour dérivée seconde $-2$, donc 
    $$g'' = f'' + M \geqslant 0 \qquad\text{et}\qquad h'' = f'' - M \leqslant 0.$$
     Par le théorème 11, $\boxed{g \text{ est convexe et } h \text{ est concave}}$.

    **2.** On a $g(a) = g(b) = 0$, et la courbe de la fonction convexe $g$ est au-dessous de sa corde joignant ces deux points, qui est le segment $[a\,,b]$ de l'axe des abscisses : $g \leqslant 0$. De même, $h(a) = h(b) = 0$ et $h$ est concave, donc $h \geqslant 0$. Ces deux inégalités s'écrivent 
    $$\boxed{|f(x)| \leqslant \frac{M}{2}(x - a)(b - x) \text{ pour } x \in [a\,,b]}$$
     Le maximum de $(x - a)(b - x)$ est atteint au milieu $\frac{a + b}{2}$, où il vaut $\frac{(b - a)^{2}}{4}$, d'où 
    $$\boxed{|f| \leqslant \frac{M(b - a)^{2}}{8}}$$
     La majoration est optimale : pour $f(x) = (x - a)(b - x)$, on a $M = 2$, et l'inégalité est une égalité au milieu du segment. Cette estimation sera utilisée pour majorer l'erreur commise lorsqu'on remplace une fonction par son interpolation affine.
- id: "ma-09-41"
  feuille: "f-ma-09"
  numero: 41
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions convexes, tangente, "points d'inflexion", racines de polynômes]
  noeuds: [de-monotonie, de-taf, de-dl1, de-rolle]
  notions: []
  page_enonce: 10
  page_corrige: 22
  enonce: |
    *La concentration d'un médicament.* La concentration d'un médicament dans le sang, $x$ heures après l'injection, est modélisée par $f(x) = (x + 2)\,\mathrm{e}^{-x/2}$, pour $x \geqslant 0$.

    **1.** Étudier les variations et la convexité de $f$. Montrer que sa courbe admet un point d'inflexion, donner la tangente en ce point, et tracer la courbe avec cette tangente.

    **2.** Au bout de combien de temps la baisse de la concentration commence-t-elle à ralentir ? Relier la réponse au point d'inflexion.

    **3.** Plus généralement, montrer que la courbe d'une fonction polynomiale de degré $3$ admet exactement un point d'inflexion $A$, et qu'elle est symétrique par rapport à $A$. On écrira le polynôme à l'aide des puissances de $x - a$, où $a$ est l'abscisse de $A$.
  corrige: |
    **1.** La fonction $f$ est de classe $\mathcal{C}^{\infty}$ sur $[0\,,+\infty[$, et 
    $$f'(x) = \mathrm{e}^{-x/2}\Big(1 - \frac{x + 2}{2}\Big) = -\frac{x}{2}\,\mathrm{e}^{-x/2}, \qquad f''(x) = \mathrm{e}^{-x/2}\Big(-\frac{1}{2} + \frac{x}{4}\Big) = \frac{x - 2}{4}\,\mathrm{e}^{-x/2}.$$
     La fonction $f$ est donc décroissante sur $[0\,,+\infty[$, de $f(0) = 2$ vers $0$, par croissances comparées. Elle est concave sur $[0\,,2]$ et convexe sur $[2\,,+\infty[$. Comme $f''$ s'annule en $2$ en changeant de signe, le point d'abscisse $2$ est un point d'inflexion, d'après la réciproque de la proposition 10. On a $f(2) = \frac{4}{\mathrm{e}} \approx 1{,}47$ et $f'(2) = -\frac{1}{\mathrm{e}}$, d'où la tangente $y = \frac{4}{\mathrm{e}} - \frac{x - 2}{\mathrm{e}}$. 
    $$\boxed{\text{point d'inflexion } \big(2, \tfrac{4}{\mathrm{e}}\big), \text{ de tangente } y = \frac{6 - x}{\mathrm{e}}}$$

    ![Figure](documents/figures/e8aadd3beb9f556a.svg)

    La courbe bleue est au-dessous de sa tangente rouge avant $2$, où elle est concave, et au-dessus après, où elle est convexe : elle la traverse au point d'inflexion.

    **2.** La vitesse de baisse de la concentration est $|f'(x)| = \frac{x}{2}\mathrm{e}^{-x/2}$. Sa dérivée est $-f''(x)$, positive sur $[0\,,2]$ et négative ensuite : la baisse s'accélère pendant deux heures, puis ralentit. 
    $$\boxed{\text{la baisse commence à ralentir au bout de deux heures}}$$
     C'est exactement l'abscisse du point d'inflexion : la pente $f'$, croissante sur la partie convexe et décroissante sur la partie concave, y atteint son minimum, c'est-à-dire la baisse la plus rapide, égale à $\frac{1}{\mathrm{e}} \approx 0{,}37$ unité par heure.

    **3.** Soit $P(x) = \alpha x^{3} + \beta x^{2} + \gamma x + \delta$, avec $\alpha \neq 0$. On a $P''(x) = 6\alpha x + 2\beta$, qui s'annule uniquement en $a = -\frac{\beta}{3\alpha}$, en changeant de signe. Par la réciproque de la proposition 10, le point $A = (a, P(a))$ est un point d'inflexion, et c'est le seul, puisque tout point d'inflexion annule $P''$. Développons ensuite $P(a + t)$ par la formule du binôme : c'est un polynôme de degré $3$ en $t$, qu'on écrit $\alpha t^{3} + bt^{2} + ct + P(a)$. Sa dérivée seconde en $t = 0$ vaut $2b$, et aussi $P''(a) = 0$, donc $b = 0$. Ainsi 
    $$P(a + t) = \alpha t^{3} + ct + P(a), \qquad\text{d'où}\qquad P(a + t) + P(a - t) = 2P(a) \text{ pour tout } t.$$

    $$\boxed{\text{la courbe d'un polynôme de degré } 3 \text{ a un unique point d'inflexion } A, \text{ dont elle est symétrique}}$$
     L'égalité obtenue dit que $A$ est le milieu des points d'abscisses $a + t$ et $a - t$ de la courbe.
- id: "ma-09-42"
  feuille: "f-ma-09"
  numero: 42
  partie: "Fonctions convexes"
  etoiles: 2
  types: [Algorithmique, Démonstration]
  mots_cles: [fonctions convexes, extrema, convexité]
  noeuds: [de-monotonie, de-taf, de-extremum]
  notions: [extremum-local]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    *Algorithme de trichotomie.* Soit $f : [a\,,b] \to \mathbb{R}$ convexe et continue. On pose $a_{1} = \frac{2a + b}{3}$, $a_{2} = \frac{a + 2b}{3}$, et $\mu = \dfrac{f(a_{2}) - f(a_{1})}{a_{2} - a_{1}}$.

    **1.** Si $\mu \geqslant 0$, montrer que $f$ atteint son minimum sur $[a\,,b]$ en un point de $[a\,,a_{2}]$. Si $\mu \leqslant 0$, montrer qu'il l'atteint en un point de $[a_{1}\,,b]$.

    **2.** Écrire une fonction Python `trichotomie(f, a, b, eps)` qui renvoie un encadrement d'amplitude inférieure à `eps` d'un point où $f$ atteint son minimum.

    **3.** Appliquer à $x \mapsto \mathrm{e}^{x} + x^{2}$ sur $[-1\,,0]$. Combien d'étapes faut-il pour une amplitude de $10^{-6}$ ?
  corrige: |
    **1.** Supposons $\mu \geqslant 0$, et soit $x \in \,]a_{2}\,,b]$. Le lemme des trois pentes (proposition 8), appliqué à $a_{1} < a_{2} < x$, donne 
    $$\frac{f(x) - f(a_{2})}{x - a_{2}} \geqslant \frac{f(a_{2}) - f(a_{1})}{a_{2} - a_{1}} = \mu \geqslant 0,$$
     donc $f(x) \geqslant f(a_{2})$. La fonction continue $f$ atteint son minimum sur le segment $[a\,,a_{2}]$ en un point $c$ (chapitre 8), et $f(c) \leqslant f(a_{2}) \leqslant f(x)$ pour tout $x > a_{2}$ : $c$ réalise le minimum sur $[a\,,b]$. Si $\mu \leqslant 0$, le lemme appliqué à $x < a_{1} < a_{2}$ donne de même $\frac{f(a_{1}) - f(x)}{a_{1} - x} \leqslant \mu \leqslant 0$, donc $f(x) \geqslant f(a_{1})$ pour $x < a_{1}$, et le minimum est atteint sur $[a_{1}\,,b]$. 
    $$\boxed{\mu \geqslant 0 : \text{minimum sur } [a\,,a_{2}] ; \quad \mu \leqslant 0 : \text{minimum sur } [a_{1}\,,b]}$$

    **2.** À chaque étape, on élimine un tiers du segment, et l'amplitude est multipliée par $\frac{2}{3}$. Le signe de $\mu$ est celui de $f(a_{2}) - f(a_{1})$ : 

    ```python
    def trichotomie(f, a, b, eps):
        n = 0                       # nombre d'etapes
        while b - a >= eps:
            a1 = (2*a + b) / 3
            a2 = (a + 2*b) / 3
            if f(a2) >= f(a1):      # mu >= 0 : minimum dans [a, a2]
                b = a2
            else:                   # mu < 0 : minimum dans [a1, b]
                a = a1
            n += 1
        return a, b, n
    ```

     L'invariant de boucle est « $f$ atteint son minimum sur $[a\,,b]$ en un point du segment courant », conservé d'après la question 1, et la boucle termine puisque l'amplitude tend vers $0$.

    **3.** La fonction $x \mapsto \mathrm{e}^{x} + x^{2}$ est convexe, de dérivée seconde $\mathrm{e}^{x} + 2 > 0$. Après $n$ étapes, l'amplitude vaut $\big(\frac{2}{3}\big)^{n}$, et 
    $$\Big(\frac{2}{3}\Big)^{n} < 10^{-6} \iff n > \frac{6\ln 10}{\ln 3 - \ln 2} \approx 34{,}07.$$

    $$\boxed{35 \text{ étapes}}$$
     L'appel `trichotomie(lambda x: exp(x) + x**2, -1, 0, 1e-6)` renvoie bien $35$ étapes et un encadrement de $-0{,}351734$, qui est la solution de $\mathrm{e}^{x} + 2x = 0$, où s'annule la dérivée. La dichotomie du chapitre 8 aurait demandé $20$ étapes : la trichotomie, qui n'élimine qu'un tiers à chaque fois, est plus lente, mais elle ne demande pas de connaître la dérivée.
- id: "ma-09-43"
  feuille: "f-ma-09"
  numero: 43
  partie: "Fonctions convexes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions convexes, convexité]
  noeuds: [de-monotonie, de-taf]
  notions: []
  page_enonce: 10
  page_corrige: 24
  enonce: |
    *Une hypothèse affaiblie.* Soit $f : \mathbb{R} \to \mathbb{R}$ continue, telle que 
    $$\forall (x, y) \in \mathbb{R}^{2}, \qquad f\Big(\frac{x + y}{2}\Big) \leqslant \frac{f(x) + f(y)}{2}.$$

    **1.** Montrer par récurrence sur $n$ que, pour tous réels $x$ et $y$ et tout entier $k \in [\![0\,;2^{n}]\!]$, on a 
    $$f\Big(\Big(1 - \frac{k}{2^{n}}\Big)x + \frac{k}{2^{n}}\,y\Big) \leqslant \Big(1 - \frac{k}{2^{n}}\Big)f(x) + \frac{k}{2^{n}}\,f(y).$$

    **2.** Montrer que tout réel $\lambda \in [0\,,1]$ est limite d'une suite de nombres de la forme $\frac{k}{2^{n}}$, avec $0 \leqslant k \leqslant 2^{n}$, et conclure que $f$ est convexe.
  corrige: |
    **1.** Notons $z_{k} = \big(1 - \frac{k}{2^{n}}\big)x + \frac{k}{2^{n}}y$ ; l'inégalité à établir est $f(z_{k}) \leqslant \big(1 - \frac{k}{2^{n}}\big)f(x) + \frac{k}{2^{n}}f(y)$. Pour $n = 0$, les seules valeurs sont $k = 0$ et $k = 1$, qui donnent les égalités $f(x) = f(x)$ et $f(y) = f(y)$. Supposons la propriété vraie au rang $n$, et soit $k \in [\![0\,;2^{n+1}]\!]$.

    • Si $k = 2j$ est pair, alors $\frac{k}{2^{n+1}} = \frac{j}{2^{n}}$ avec $j \in [\![0\,;2^{n}]\!]$, et c'est l'hypothèse de récurrence.

    • Si $k = 2j + 1$ est impair, avec $0 \leqslant j < 2^{n}$, le point de rang $n + 1$ associé à $k$ est le milieu des points de rang $n$ associés à $j$ et $j + 1$. L'hypothèse sur $f$, puis l'hypothèse de récurrence pour $j$ et $j + 1$, donnent une majoration par la moyenne des deux membres de droite, qui vaut 
    $$\Big(1 - \frac{2j + 1}{2^{n+1}}\Big)f(x) + \frac{2j + 1}{2^{n+1}}\,f(y).$$

    $$\boxed{\text{l'inégalité de convexité est vraie pour tout } \lambda = \tfrac{k}{2^{n}} \in [0\,,1]}$$

    **2.** Soit $\lambda \in [0\,,1]$, et $k_{n} = \lfloor 2^{n}\lambda \rfloor \in [\![0\,;2^{n}]\!]$. On a $0 \leqslant \lambda - \frac{k_{n}}{2^{n}} < \frac{1}{2^{n}}$, donc $\lambda_{n} = \frac{k_{n}}{2^{n}}$ tend vers $\lambda$ : c'est la suite des approximations dyadiques du chapitre 7. On écrit la question 1 avec $\lambda_{n}$ : 
    $$f\big((1 - \lambda_{n})x + \lambda_{n}y\big) \leqslant (1 - \lambda_{n})f(x) + \lambda_{n}f(y).$$
     Quand $n$ tend vers $+\infty$, le membre de gauche tend vers $f\big((1 - \lambda)x + \lambda y\big)$ par continuité de $f$, et l'inégalité passe à la limite. 
    $$\boxed{f \text{ est convexe}}$$
     *À retenir.* Sans l'hypothèse de continuité, le résultat est faux, mais les contre-exemples sont des fonctions très irrégulières, dont la construction repose sur l'axiome du choix : aucun ne peut être écrit explicitement.
