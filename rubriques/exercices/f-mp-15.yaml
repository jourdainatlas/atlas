  enonce: |
    On lance $3600$ fois un dé équilibré. À l'aide de l'inégalité de Bienaymé-Tchebychev, minorer la probabilité que le nombre d'apparitions du $1$ soit compris, au sens large, entre $480$ et $720$.
  corrige: |
    On applique l'inégalité de Bienaymé-Tchebychev à la variable binomiale, en passant à l'événement contraire.

    Le nombre $N$ de $1$ suit la loi $\mathcal{B}(3600, \frac{1}{6})$, d'espérance $600$ et de variance $3600 \times \frac{1}{6} \times \frac{5}{6} = 500$. L'événement $(480 \leqslant N \leqslant 720)$ est $\big(|N - 600| \leqslant 120\big)$, contraire de $\big(|N - 600| \geqslant 121\big)$, puisque $N$ est entière. 
    $$\mathbb{P}(480 \leqslant N \leqslant 720) \geqslant 1 - \frac{500}{121^{2}}, \qquad \boxed{\mathbb{P}(480 \leqslant N \leqslant 720) \geqslant 0{,}965}$$
     La probabilité exacte vaut environ $1 - 8{,}6 \cdot 10^{-8}$ : l'écart toléré représente plus de cinq écarts types, et la majoration universelle est très pessimiste.
