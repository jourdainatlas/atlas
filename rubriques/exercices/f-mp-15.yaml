  enonce: |
    *La grenouille.* Une grenouille monte un escalier en sautant à chaque fois, de façon équiprobable et indépendamment des sauts précédents, une ou deux marches. On note $X_{n}$ le nombre de marches franchies après $n$ sauts, et $Y_{n}$ le nombre de sauts d'une seule marche parmi ces $n$ sauts.

    **1.** Donner la loi de $Y_{n}$, et en déduire l'espérance et la variance de $X_{n}$.

    **2.** Pour $n \in \mathbb{N}$, on note $Z_{n}$ le nombre de sauts nécessaires pour atteindre ou dépasser la $n$-ième marche, avec $Z_{0} = 0$. Montrer que $\mathbb{E}(Z_{n}) = \frac{1}{2}\mathbb{E}(Z_{n - 1}) + \frac{1}{2}\mathbb{E}(Z_{n - 2}) + 1$ pour $n \geqslant 2$.

    **3.** Trouver $a$ tel que la suite de terme général $u_{n} = \mathbb{E}(Z_{n}) - na$ vérifie une relation de récurrence linéaire d'ordre $2$ homogène. En déduire $\mathbb{E}(Z_{n})$ et un équivalent quand $n \to +\infty$, et interpréter.
  corrige: |
    Le nombre de marches est une fonction affine d'une variable binomiale ; pour $Z_{n}$, on conditionne par le premier saut.

    **1.** Les sauts sont indépendants, chacun d'une marche avec la probabilité $\frac{1}{2}$ : $Y_{n} \sim \mathcal{B}(n, \frac{1}{2})$. Les $n - Y_{n}$ autres sauts franchissent deux marches, d'où $X_{n} = Y_{n} + 2(n - Y_{n}) = 2n - Y_{n}$. 
    $$\boxed{\mathbb{E}(X_{n}) = \frac{3n}{2}, \qquad \mathbb{V}(X_{n}) = \mathbb{V}(Y_{n}) = \frac{n}{4}}$$

    **2.** Soit $n \geqslant 2$. Si le premier saut franchit une marche, il reste à atteindre ou dépasser la marche $n - 1$ en partant de la première, avec des sauts indépendants du premier et de même loi : le nombre de sauts restants a la loi de $Z_{n - 1}$. De même avec $Z_{n - 2}$ si le premier saut franchit deux marches. La formule de l'espérance totale (exercice 9, question 3) donne : 
    $$\boxed{\mathbb{E}(Z_{n}) = 1 + \frac{1}{2}\mathbb{E}(Z_{n - 1}) + \frac{1}{2}\mathbb{E}(Z_{n - 2})}$$

    **3.** En reportant $\mathbb{E}(Z_{n}) = u_{n} + na$, on obtient $u_{n} = \frac{1}{2}u_{n - 1} + \frac{1}{2}u_{n - 2} + 1 - \frac{3a}{2}$ : il faut $a = \frac{2}{3}$. L'équation caractéristique $r^{2} = \frac{r}{2} + \frac{1}{2}$ a pour racines $1$ et $-\frac{1}{2}$, et les conditions $u_{0} = 0$, $u_{1} = \mathbb{E}(Z_{1}) - \frac{2}{3} = \frac{1}{3}$ donnent $u_{n} = \frac{2}{9} - \frac{2}{9}\big(-\frac{1}{2}\big)^{n}$. 
    $$\boxed{\mathbb{E}(Z_{n}) = \frac{2n}{3} + \frac{2}{9} - \frac{2}{9}\Big(-\frac{1}{2}\Big)^{n} \underset{n \to +\infty}{\sim} \frac{2n}{3}}$$
     Un saut franchit en moyenne $\frac{3}{2}$ marches : il en faut donc environ $\frac{n}{3/2}$ pour monter $n$ marches. La formule a été vérifiée pour $n \leqslant 4$ par la récurrence exacte.
