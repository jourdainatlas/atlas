  enonce: |
    *Les urnes d'Ehrenfest.* Deux urnes $A$ et $B$ contiennent en tout $2n$ boules ; l'urne $A$ en contient $r$ au départ. À chaque étape, on choisit une boule au hasard parmi les $2n$, et on la change d'urne. On note $X_{k}$ le nombre de boules dans l'urne $A$ après $k$ étapes, et $G_{k}$ la fonction génératrice de $X_{k}$.

    **1.** Donner la loi de $X_{1}$, son espérance et sa variance.

    **2.** Exprimer $\mathbb{P}(X_{k + 1} = j)$ à l'aide de $\mathbb{P}(X_{k} = j - 1)$ et $\mathbb{P}(X_{k} = j + 1)$.

    **3.** Montrer que $G_{k + 1}(t) = t\,G_{k}(t) + \dfrac{1 - t^{2}}{2n}\,G_{k}'(t)$ pour tout $t \in \mathbb{R}$.

    **4.** En déduire une relation entre $\mathbb{E}(X_{k + 1})$ et $\mathbb{E}(X_{k})$, puis $\mathbb{E}(X_{k})$ et sa limite quand $k \to +\infty$. Interpréter.
  corrige: |
    La loi de $X_{k + 1}$ se déduit de celle de $X_{k}$ par la formule des probabilités totales ; en fonctions génératrices, cela devient une relation différentielle qui donne l'espérance.

    **1.** On a $X_{0} = r$. La boule tirée est dans $A$ avec la probabilité $\frac{r}{2n}$. 
    $$\boxed{\mathbb{P}(X_{1} = r - 1) = \frac{r}{2n}, \quad \mathbb{P}(X_{1} = r + 1) = 1 - \frac{r}{2n}, \quad \mathbb{E}(X_{1}) = r + 1 - \frac{r}{n}, \quad \mathbb{V}(X_{1}) = \frac{r}{n}\Big(2 - \frac{r}{n}\Big)}$$
     La variance vient de $\mathbb{V}(X_{1}) = \mathbb{E}\big((X_{1} - r)^{2}\big) - (\mathbb{E}(X_{1}) - r)^{2} = 1 - \big(1 - \frac{r}{n}\big)^{2}$.

    **2.** Si $X_{k} = j + 1$, on passe à $j$ avec la probabilité $\frac{j + 1}{2n}$ ; si $X_{k} = j - 1$, on passe à $j$ avec la probabilité $\frac{2n - j + 1}{2n}$. 
    $$\boxed{\mathbb{P}(X_{k + 1} = j) = \frac{j + 1}{2n}\,\mathbb{P}(X_{k} = j + 1) + \frac{2n - j + 1}{2n}\,\mathbb{P}(X_{k} = j - 1)}$$

    **3.** Les fonctions génératrices sont des polynômes. Avec $\pi_{j} = \mathbb{P}(X_{k} = j)$, la formule des probabilités totales donne 
    $$G_{k + 1}(t) = \sum_{j} \pi_{j}\Big(\frac{j}{2n}t^{j - 1} + \Big(1 - \frac{j}{2n}\Big)t^{j + 1}\Big) = t\,G_{k}(t) + \frac{1}{2n}\sum_{j} j\pi_{j}(t^{j - 1} - t^{j + 1}),$$

    $$\boxed{G_{k + 1}(t) = t\,G_{k}(t) + \frac{1 - t^{2}}{2n}\,G_{k}'(t)}$$

    **4.** En dérivant et en évaluant en $1$, avec $G_{k}(1) = 1$ : $\mathbb{E}(X_{k + 1}) = 1 + \mathbb{E}(X_{k}) - \frac{1}{n}\mathbb{E}(X_{k})$, soit $\mathbb{E}(X_{k + 1}) - n = \big(1 - \frac{1}{n}\big)\big(\mathbb{E}(X_{k}) - n\big)$. 
    $$\boxed{\mathbb{E}(X_{k}) = n + (r - n)\Big(1 - \frac{1}{n}\Big)^{k} \xrightarrow[k \to +\infty]{} n}$$
     En moyenne, les boules se répartissent également entre les deux urnes, à une vitesse géométrique : c'est le modèle d'Ehrenfest (1907) de la diffusion d'un gaz entre deux récipients.
