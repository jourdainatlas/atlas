  enonce: |
    *Le permis à points.* Chaque jour, Rémi dépasse la vitesse autorisée avec la probabilité $\frac{1}{2}$ ; indépendamment, il passe devant un radar avec la probabilité $\frac{1}{10}$. Un excès de vitesse enregistré lui fait perdre un point, et les jours sont indépendants.

    **1.** Soit $S_{n}$ le nombre de points perdus pendant les $n$ premiers jours. Donner sa loi, son espérance et sa variance.

    **2.** Rémi a $6$ points. Soit $T$ le jour où il perd son dernier point. Déterminer la fonction génératrice de $T$, puis l'espérance et l'écart type de $T$.
  corrige: |
    Le nombre de points perdus est binomial ; le jour de la perte du sixième point est une somme de six temps d'attente géométriques indépendants, dont la fonction génératrice est un produit.

    **1.** Chaque jour, Rémi perd un point avec la probabilité $\frac{1}{2} \times \frac{1}{10} = \frac{1}{20}$, indépendamment des autres jours. 
    $$\boxed{S_{n} \sim \mathcal{B}(n, \tfrac{1}{20}), \qquad \mathbb{E}(S_{n}) = \frac{n}{20}, \qquad \mathbb{V}(S_{n}) = \frac{19n}{400}}$$

    **2.** Le jour $T$ de la perte du sixième point est la somme de six temps d'attente indépendants de loi $\mathcal{G}(\frac{1}{20})$ (exercice 33 de la feuille du chapitre 14). Le théorème 11 et la proposition 10 donnent : 
    $$\boxed{G_{T}(t) = \Big(\frac{t}{20 - 19t}\Big)^{6}, \qquad \mathbb{E}(T) = \frac{6}{1/20} = 120, \qquad \sigma(T) = \sqrt{6 \times \frac{19/20}{1/400}} = \sqrt{2280} \approx 47{,}7}$$
     Rémi conserve son permis environ quatre mois en moyenne, avec une forte dispersion.
