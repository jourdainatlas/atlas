  enonce: |
    *Attendre un motif.* On lance indéfiniment une pièce équilibrée, et l'on note $T$ le rang du lancer qui achève la première apparition du motif « pile, face ».

    **1.** Déterminer la loi de $T$. On pourra introduire le rang du premier pile.

    **2.** Déterminer la fonction génératrice de $T$.

    **3.** Calculer l'espérance et la variance de $T$.

    **4.** L'exercice 14 de la feuille du chapitre 14 donne, pour $p = \frac{1}{2}$, la loi du rang $T'$ de la première apparition du motif « pile, pile ». Calculer $\mathbb{E}(T')$ et comparer avec $\mathbb{E}(T)$. Expliquer pourquoi les deux motifs, qui ont la même probabilité d'apparaître en deux lancers donnés, ne se comportent pas de la même façon.
  corrige: |
    Le motif « pile, face » se lit en deux temps indépendants : attendre un pile, puis attendre un face. Le motif « pile, pile » ne se décompose pas ainsi, car un échec oblige à tout recommencer.

    **1.** Soit $A$ le rang du premier pile. Après lui, le premier face achève le motif, puisque tous les lancers intermédiaires sont des piles. Donc $T = A + B$, où $B$ est le nombre de lancers après $A$ jusqu'au premier face : $A$ et $B$ sont indépendantes de loi $\mathcal{G}(\frac{1}{2})$ (exercice 33 de la feuille du chapitre 14). 
    $$\boxed{\mathbb{P}(T = n) = \sum_{k = 1}^{n - 1} \frac{1}{2^{k}}\cdot\frac{1}{2^{n - k}} = \frac{n - 1}{2^{n}}, \qquad n \geqslant 2}$$

    **2.** Par le théorème 11 : 
    $$\boxed{G_{T}(t) = \Big(\frac{t}{2 - t}\Big)^{2}}$$

    **3.** Par linéarité et le théorème 5 : 
    $$\boxed{\mathbb{E}(T) = 2 + 2 = 4, \qquad \mathbb{V}(T) = 2 + 2 = 4}$$

    **4.** Pour $p = \frac{1}{2}$, la relation de l'exercice 14 du chapitre 14 s'écrit $a_{n + 2} = \frac{1}{2}a_{n + 1} + \frac{1}{4}a_{n}$, avec $a_{1} = 0$ et $a_{2} = \frac{1}{4}$. En multipliant par $t^{n + 2}$ et en sommant, la fonction génératrice $G$ de $T'$ vérifie $G(t) - \frac{t^{2}}{4} = \frac{t}{2}G(t) + \frac{t^{2}}{4}G(t)$, d'où 
    $$G(t) = \frac{t^{2}}{4 - 2t - t^{2}}, \qquad G'(1) = \frac{2 \times 1 - 1 \times (-4)}{1^{2}} = 6, \qquad \boxed{\mathbb{E}(T') = 6 > \mathbb{E}(T) = 4}$$
     Les deux motifs apparaissent avec la même fréquence à long terme, mais pas de la même façon : les occurrences de « pile, pile » se chevauchent et arrivent groupées (trois piles consécutifs en contiennent deux), de sorte que l'attente de la première est plus longue. Pour « pile, face », un pile n'est jamais perdu, alors qu'un face après un pile oblige à recommencer la recherche de « pile, pile ». L'exercice 42 retrouve $\mathbb{E}(T') = 6$.
