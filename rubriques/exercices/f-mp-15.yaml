  enonce: |
    *Pair ou impair.* Soit $a > 0$ et $X$ une variable de loi $\mathcal{P}(a)$. Si $X$ est impair, Pierre gagne $X$ euros ; si $X$ est pair et non nul, Quentin gagne $X$ euros ; si $X = 0$, la partie est nulle.

    **1.** Calculer $G_{X}(-1)$, et en déduire les probabilités $p$ et $q$ de gain de Pierre et de Quentin, en calculant $p + q$ et $p - q$. Lequel est avantagé ?

    **2.** Calculer l'espérance du gain de chacun des deux joueurs, et comparer.
  corrige: |
    La valeur de la fonction génératrice en $-1$ est la différence entre la probabilité d'un résultat pair et celle d'un résultat impair.

    **1.** On a $G_{X}(-1) = \sum_{k} (-1)^{k}\mathbb{P}(X = k) = \mathbb{P}(X \text{ pair}) - \mathbb{P}(X \text{ impair}) = \mathrm{e}^{-2a}$. Avec $p = \mathbb{P}(X \text{ impair})$ et $q = \mathbb{P}(X \text{ pair}) - \mathrm{e}^{-a}$, il vient $p + q = 1 - \mathrm{e}^{-a}$ et $p - q = \mathrm{e}^{-a} - \mathrm{e}^{-2a}$. 
    $$\boxed{p = \frac{1 - \mathrm{e}^{-2a}}{2}, \qquad q = \frac{1 + \mathrm{e}^{-2a}}{2} - \mathrm{e}^{-a}, \qquad p - q = \mathrm{e}^{-a}(1 - \mathrm{e}^{-a}) > 0}$$
     Pierre est avantagé : la valeur $0$, paire, est neutralisée.

    **2.** On a $G_{X}' = aG_{X}$, donc $G_{X}'(1) = a$ et $G_{X}'(-1) = a\,\mathrm{e}^{-2a}$ ; or $\sum_{k} k\,\mathbb{P}(X = k)$ sur les $k$ impairs vaut $\frac{G_{X}'(1) + G_{X}'(-1)}{2}$, et sur les $k$ pairs $\frac{G_{X}'(1) - G_{X}'(-1)}{2}$. 
    $$\boxed{\mathbb{E}(\text{gain de Pierre}) = a\,\mathrm{e}^{-a}\operatorname{ch} a, \qquad \mathbb{E}(\text{gain de Quentin}) = a\,\mathrm{e}^{-a}\operatorname{sh} a}$$
     Pierre est avantagé aussi en espérance, puisque $\operatorname{ch} a > \operatorname{sh} a$. Pour $a = 1$, on trouve $p \approx 0{,}432$, $q \approx 0{,}200$, et des gains moyens $0{,}568$ et $0{,}432$.
