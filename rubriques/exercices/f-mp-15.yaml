  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $(X_{i, j})_{1 \leqslant i, j \leqslant n}$ des variables aléatoires réelles mutuellement indépendantes, de même loi, d'espérance finie $m$. On considère la matrice aléatoire $M = (X_{i, j})$. Calculer, pour tout $\lambda \in \mathbb{R}$, l'espérance de $\chi_{M}(\lambda) = \det(\lambda I_{n} - M)$. On utilisera l'expression du déterminant comme somme sur les permutations, et l'on reconnaîtra le polynôme caractéristique d'une matrice simple (chapitre 2).
  corrige: |
    Dans la formule du déterminant comme somme sur les permutations, chaque produit fait intervenir des coefficients distincts, donc des variables indépendantes : l'espérance du produit est le produit des espérances.

    Par définition, 
    $$\chi_{M}(\lambda) = \sum_{\sigma \in \mathfrak{S}_{n}} \varepsilon(\sigma)\prod_{i = 1}^{n} \big(\lambda\delta_{\sigma(i), i} - X_{\sigma(i), i}\big).$$
     Pour $\sigma$ fixée, les positions $(\sigma(i), i)$ sont distinctes : les $n$ facteurs sont des fonctions de variables distinctes, donc mutuellement indépendants (lemme des coalitions), et d'espérance finie. Le théorème 3 donne 
    $$\mathbb{E}\Big(\prod_{i} (\lambda\delta_{\sigma(i), i} - X_{\sigma(i), i})\Big) = \prod_{i} (\lambda\delta_{\sigma(i), i} - m),$$
     et la linéarité conduit à 
    $$\mathbb{E}\big(\chi_{M}(\lambda)\big) = \det(\lambda I_{n} - mJ),$$
     où $J$ est la matrice dont tous les coefficients valent $1$. Cette matrice est de rang $1$, de trace $n$ : $mJ$ a pour valeurs propres $nm$, simple, et $0$, d'ordre $n - 1$ (chapitre 2). 
    $$\boxed{\mathbb{E}\big(\chi_{M}(\lambda)\big) = \lambda^{n - 1}(\lambda - nm)}$$
     Le résultat a été contrôlé par simulation pour $n = 3$. En général, $\mathbb{E}(\det M) \neq \det \mathbb{E}(M)$ ; l'égalité vaut ici parce que le déterminant est affine par rapport à chaque coefficient, et que les coefficients d'un même produit sont indépendants.
