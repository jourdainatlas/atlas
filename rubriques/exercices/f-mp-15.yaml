  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $X$ une variable aléatoire à valeurs dans $\mathbb{N}$ dont la fonction génératrice est donnée par 
    $$\forall t \in [-1, 1], \qquad G_{X}(t) = \frac{t}{2 - t^{2}}.$$

    **1.** Déterminer la loi de $X$.

    **2.** Reconnaître la loi de $Y = \dfrac{X + 1}{2}$, et en déduire $\mathbb{E}(X)$ et $\mathbb{V}(X)$.
  corrige: |
    On développe la fonction génératrice en série entière, et l'on lit la loi sur les coefficients (théorème 9).

    **1.** Pour $|t| < \sqrt{2}$, $\frac{t}{2 - t^{2}} = \frac{t}{2}\cdot\frac{1}{1 - t^{2}/2} = \sum_{k \geqslant 0} \frac{t^{2k + 1}}{2^{k + 1}}$. 
    $$\boxed{\mathbb{P}(X = 2k + 1) = \frac{1}{2^{k + 1}} \ (k \in \mathbb{N}), \qquad \mathbb{P}(X \text{ pair}) = 0}$$

    **2.** La variable $Y = \frac{X + 1}{2}$ vaut $k + 1$ avec la probabilité $\frac{1}{2^{k + 1}}$ : $Y \sim \mathcal{G}(\frac{1}{2})$, d'espérance $2$ et de variance $2$. Comme $X = 2Y - 1$ : 
    $$\boxed{\mathbb{E}(X) = 3, \qquad \mathbb{V}(X) = 4\mathbb{V}(Y) = 8}$$
     On peut contrôler : $G_{X}'(1) = \frac{2 - t^{2} + 2t^{2}}{(2 - t^{2})^{2}}\Big|_{t = 1} = 3$.
- id: "mp-15-32"
  feuille: "f-mp-15"
