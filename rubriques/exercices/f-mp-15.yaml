    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{G}(p)$. Pour $n \geqslant 1$, on pose 
    $$Y_{n} = \min(X_{1}, \dots, X_{n}), \qquad Z_{n} = \max(X_{1}, \dots, X_{n}).$$

    **1.** Déterminer la loi de $Y_{n}$, et calculer $\mathbb{E}(Y_{n})$.

    **2.** Montrer que $\mathbb{E}(Z_{n}) = \displaystyle\sum_{k = 0}^{+\infty} \big(1 - (1 - q^{k})^{n}\big)$.

    **3.** On pose $k_{n} = \lfloor \ln n / \ln(1/q) \rfloor$. En coupant la somme précédente au rang $k_{n}$, montrer que $\mathbb{E}(Z_{n}) \underset{n \to +\infty}{\sim} \dfrac{\ln n}{\ln(1/q)}$.
  corrige: |
    Le minimum d'une famille de lois géométriques indépendantes est géométrique ; le maximum s'étudie par les queues, en coupant la somme au rang où $q^{k}$ devient de l'ordre de $\frac{1}{n}$.

    **1.** Par indépendance, $\mathbb{P}(Y_{n} > k) = \prod_{i} \mathbb{P}(X_{i} > k) = (q^{n})^{k}$. 
    $$\boxed{Y_{n} \sim \mathcal{G}(1 - q^{n}), \qquad \mathbb{E}(Y_{n}) = \frac{1}{1 - q^{n}}}$$

    **2.** Par indépendance, $\mathbb{P}(Z_{n} \leqslant k) = (1 - q^{k})^{n}$, et la proposition 1 donne $\mathbb{E}(Z_{n}) = \sum_{k \geqslant 0} \mathbb{P}(Z_{n} > k)$. 
    $$\boxed{\mathbb{E}(Z_{n}) = \sum_{k = 0}^{+\infty} \big(1 - (1 - q^{k})^{n}\big)}$$

    **3.** Notons $L_{n} = \frac{\ln n}{\ln(1/q)}$, de sorte que $q^{L_{n}} = \frac{1}{n}$, et $u_{k} = 1 - (1 - q^{k})^{n} \in [0, 1]$.

    Majoration. Par l'inégalité de Bernoulli, $(1 - x)^{n} \geqslant 1 - nx$, donc $u_{k} \leqslant nq^{k}$. Ainsi 
    $$\mathbb{E}(Z_{n}) \leqslant \sum_{k = 0}^{k_{n}} 1 + n\sum_{k > k_{n}} q^{k} = k_{n} + 1 + \frac{nq^{k_{n} + 1}}{1 - q} \leqslant L_{n} + 1 + \frac{1}{p},$$
     puisque $k_{n} + 1 > L_{n}$ donne $nq^{k_{n} + 1} \leqslant nq^{L_{n}} = 1$.

    Minoration. Soit $\delta \in ]0, 1[$. Pour $k \leqslant (1 - \delta)L_{n}$, on a $q^{k} \geqslant n^{-(1 - \delta)}$, et 
    $$(1 - q^{k})^{n} \leqslant \exp(-nq^{k}) \leqslant \exp(-n^{\delta}).$$
     Donc 
    $$\mathbb{E}(Z_{n}) \geqslant \lfloor (1 - \delta)L_{n} \rfloor\big(1 - \exp(-n^{\delta})\big),$$
     et $\liminf \frac{\mathbb{E}(Z_{n})}{L_{n}} \geqslant 1 - \delta$ pour tout $\delta$. 
    $$\boxed{\mathbb{E}(Z_{n}) \underset{n \to +\infty}{\sim} \frac{\ln n}{\ln(1/q)}}$$
     Le minimum reste borné en moyenne, tandis que le maximum croît comme le logarithme de $n$ : c'est la même échelle logarithmique que pour le collectionneur de vignettes du cours.
- id: "mp-15-15"
  feuille: "f-mp-15"
