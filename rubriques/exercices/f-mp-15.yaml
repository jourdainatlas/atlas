  enonce: |
    *Concentration pour la loi de Poisson.* Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{P}(\lambda)$, et $S_{n} = X_{1} + \cdots + X_{n}$.

    **1.** Calculer $\mathbb{E}\big(\mathrm{e}^{tS_{n}}\big)$ pour $t \in \mathbb{R}$.

    **2.** Soit $\varepsilon > 0$. À l'aide de la proposition 8 du cours, montrer qu'il existe $\alpha > 0$ tel que 
    $$\forall n \in \mathbb{N}^{*}, \qquad \mathbb{P}\big(S_{n} \geqslant n(\lambda + \varepsilon)\big) \leqslant \mathrm{e}^{-n\alpha}.$$
     On pourra étudier la fonction $t \mapsto \lambda(\mathrm{e}^{t} - 1) - t(\lambda + \varepsilon)$ au voisinage de $0$.

    **3.** Établir de même une majoration de $\mathbb{P}\big(S_{n} \leqslant n(\lambda - \varepsilon)\big)$, et en déduire que la série $\sum \mathbb{P}\Big(\Big|\dfrac{S_{n}}{n} - \lambda\Big| \geqslant \varepsilon\Big)$ converge. Comparer avec ce que donne l'inégalité de Bienaymé-Tchebychev.
  corrige: |
    L'inégalité exponentielle donne une décroissance géométrique en $n$, qui rend la série des probabilités d'écart convergente ; c'est ce qui manque à l'inégalité de Bienaymé-Tchebychev pour passer à la convergence presque sûre.

    **1.** Par la formule de transfert, $\mathbb{E}(\mathrm{e}^{tX_{1}}) = \exp\big(\lambda(\mathrm{e}^{t} - 1)\big)$, et par indépendance (théorème 3) : 
    $$\boxed{\mathbb{E}\big(\mathrm{e}^{tS_{n}}\big) = \exp\big(n\lambda(\mathrm{e}^{t} - 1)\big)}$$

    **2.** Pour $t > 0$, la proposition 8 donne $\mathbb{P}\big(S_{n} \geqslant n(\lambda + \varepsilon)\big) \leqslant \exp\big(n\psi(t)\big)$, avec $\psi(t) = \lambda(\mathrm{e}^{t} - 1) - t(\lambda + \varepsilon)$. Comme $\psi(0) = 0$ et $\psi'(0) = -\varepsilon < 0$, il existe $t_{0} > 0$ tel que $\psi(t_{0}) < 0$ ; on pose $\alpha = -\psi(t_{0})$. 
    $$\boxed{\mathbb{P}\big(S_{n} \geqslant n(\lambda + \varepsilon)\big) \leqslant \mathrm{e}^{-n\alpha}}$$
     Le meilleur choix est $t_{0} = \ln(1 + \frac{\varepsilon}{\lambda})$, qui donne $\alpha = (\lambda + \varepsilon)\ln(1 + \frac{\varepsilon}{\lambda}) - \varepsilon$ ; pour $\lambda = 2$ et $\varepsilon = 1$, $\alpha \approx 0{,}216$.

    **3.** Pour $t > 0$, on applique la proposition 8 à $-S_{n}$ : $\mathbb{P}\big(S_{n} \leqslant n(\lambda - \varepsilon)\big) \leqslant \exp\big(n\chi(t)\big)$, avec $\chi(t) = \lambda(\mathrm{e}^{-t} - 1) + t(\lambda - \varepsilon)$, $\chi(0) = 0$ et $\chi'(0) = -\varepsilon$. On obtient de même $\beta > 0$ tel que la probabilité soit au plus $\mathrm{e}^{-n\beta}$, d'où 
    $$\mathbb{P}\Big(\Big|\frac{S_{n}}{n} - \lambda\Big| \geqslant \varepsilon\Big) \leqslant \mathrm{e}^{-n\alpha} + \mathrm{e}^{-n\beta}, \qquad \boxed{\sum \mathbb{P}\Big(\Big|\frac{S_{n}}{n} - \lambda\Big| \geqslant \varepsilon\Big) \text{ converge}}$$
     L'inégalité de Bienaymé-Tchebychev ne donne que $\frac{\lambda}{n\varepsilon^{2}}$, terme d'une série divergente. Avec le premier lemme de Borel-Cantelli, la convergence de la série entraîne la convergence presque sûre de $\frac{S_{n}}{n}$ vers $\lambda$, comme à l'exercice 44.
