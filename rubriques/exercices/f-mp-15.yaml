  enonce: |
    *Espérance conditionnelle.* Soit $X$ une variable aléatoire réelle et $A$ un événement de probabilité non nulle. Sous réserve d'existence, on pose $\mathbb{E}(X \mid A) = \displaystyle\sum_{x \in X(\Omega)} x\,\mathbb{P}_{A}(X = x)$.

    **1.** Montrer que si $X$ est d'espérance finie, $\mathbb{E}(X \mid A)$ est bien définie, et que $\mathbb{E}(X \mid A) = \dfrac{\mathbb{E}(\mathbf{1}_{A}X)}{\mathbb{P}(A)}$.

    **2.** Si $X \sim \mathcal{G}(p)$, calculer $\mathbb{E}(X \mid X > m)$ pour $m \in \mathbb{N}$, et interpréter.

    **3.** Soit $(A_{k})_{k \in \mathbb{N}}$ un système complet d'événements de probabilités non nulles. Montrer que si $X$ est d'espérance finie, alors $\mathbb{E}(X) = \displaystyle\sum_{k = 0}^{+\infty} \mathbb{P}(A_{k})\,\mathbb{E}(X \mid A_{k})$.
  corrige: |
    L'espérance conditionnelle est l'espérance pour la probabilité $\mathbb{P}_{A}$ ; la formule de l'espérance totale en est la version « probabilités totales ».

    **1.** Pour tout $x$, $|x|\,\mathbb{P}_{A}(X = x) \leqslant \frac{|x|\,\mathbb{P}(X = x)}{\mathbb{P}(A)}$, terme d'une famille sommable : $\mathbb{E}(X \mid A)$ est définie. Par la formule de transfert appliquée au couple $(X, \mathbf{1}_{A})$ et à la fonction $(x, e) \mapsto xe$, on a 
    $$\mathbb{E}(\mathbf{1}_{A}X) = \sum_{x} x\,\mathbb{P}\big((X = x) \cap A\big),$$
     d'où 
    $$\boxed{\mathbb{E}(X \mid A) = \frac{\mathbb{E}(\mathbf{1}_{A}X)}{\mathbb{P}(A)}}$$

    **2.** Par l'absence de mémoire (chapitre 14, proposition 13), $\mathbb{P}_{(X > m)}(X = m + k) = \mathbb{P}(X = k)$ pour $k \geqslant 1$ : sachant $(X > m)$, $X - m$ suit la loi $\mathcal{G}(p)$. 
    $$\boxed{\mathbb{E}(X \mid X > m) = m + \frac{1}{p}}$$
     Après $m$ échecs, il faut encore attendre en moyenne $\frac{1}{p}$ épreuves : le passé n'a rien « préparé ».

    **3.** La famille $\big(x\,\mathbb{P}((X = x) \cap A_{k})\big)_{(x, k)}$ est sommable : par $\sigma$-additivité, la somme des modules vaut $\mathbb{E}(|X|)$. Le théorème de Fubini pour les familles sommables donne 
    $$\sum_{k = 0}^{+\infty} \mathbb{P}(A_{k})\,\mathbb{E}(X \mid A_{k}) = \sum_{k}\ \sum_{x} x\,\mathbb{P}\big((X = x) \cap A_{k}\big) = \sum_{x} x\,\mathbb{P}(X = x),$$

    $$\boxed{\mathbb{E}(X) = \sum_{k = 0}^{+\infty} \mathbb{P}(A_{k})\,\mathbb{E}(X \mid A_{k})}$$
