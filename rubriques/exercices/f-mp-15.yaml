  source: "Feuille d'exercices #11 (Prost), exercice 8 ; données de l'exercice 32 de la feuille du chapitre 14"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On reprend les variables de l'exercice 32 de la feuille du chapitre 14 : $X$ et $Y$ sont indépendantes, de loi donnée par $\mathbb{P}(X = k) = pq^{k}$ pour $k \in \mathbb{N}$, et $U = \max(X, Y)$, $V = \min(X, Y)$.

    **1.** Calculer $\mathbb{E}(X)$ et $\mathbb{E}(X + Y)$.

    **2.** Calculer $\mathbb{E}(V)$, sachant que $V + 1$ suit la loi $\mathcal{G}(1 - q^{2})$.

    **3.** En déduire $\mathbb{E}(U)$ et $\mathbb{E}\big(|X - Y|\big)$ sans nouveau calcul de série.
  corrige: |
    Les identités $U + V = X + Y$ et $U - V = |X - Y|$ ramènent tout aux espérances de $X$ et de $V$, par linéarité.

    **1.** La variable $X + 1$ suit la loi $\mathcal{G}(p)$, donc $\mathbb{E}(X) = \frac{1}{p} - 1$. 
    $$\boxed{\mathbb{E}(X) = \frac{q}{p}, \qquad \mathbb{E}(X + Y) = \frac{2q}{p}}$$

    **2.** De même, $\mathbb{E}(V) = \frac{1}{1 - q^{2}} - 1$. 
    $$\boxed{\mathbb{E}(V) = \frac{q^{2}}{1 - q^{2}}}$$

    **3.** Comme $U + V = X + Y$ et $U - V = |X - Y|$, la linéarité donne, avec $1 - q^{2} = p(1 + q)$ : 
    $$\boxed{\mathbb{E}(U) = \frac{2q}{p} - \frac{q^{2}}{1 - q^{2}}, \qquad \mathbb{E}\big(|X - Y|\big) = \frac{2q}{p} - \frac{2q^{2}}{1 - q^{2}} = \frac{2q}{p(1 + q)}}$$
     Pour $p = 0{,}4$, on trouve $\mathbb{E}(U) = 2{,}4375$ et $\mathbb{E}(|X - Y|) = 1{,}875$, valeurs vérifiées par sommation directe sur la loi conjointe.
