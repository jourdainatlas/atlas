  page_corrige: 9
  enonce: |
    On effectue $n$ épreuves indépendantes, chacune ayant $k$ résultats possibles $r_{1}$, …, $r_{k}$, de probabilités $p_{1}$, …, $p_{k}$. On note $X_{i}$ le nombre de réalisations de $r_{i}$ au cours des $n$ épreuves.

    **1.** Montrer que $\mathbb{V}(X_{1} + \cdots + X_{k}) = 0$.

    **2.** Préciser la loi de $X_{i}$, puis celle de $X_{i} + X_{j}$ pour $i \neq j$. En déduire $\operatorname{Cov}(X_{i}, X_{j})$.

    **3.** Retrouver alors le résultat de la question 1, et expliquer le signe de la covariance.
  corrige: |
    La somme des $X_{i}$ est constante ; la covariance négative traduit la concurrence entre les résultats pour un nombre fixé d'épreuves.

    **1.** Chaque épreuve donne exactement un résultat, donc $X_{1} + \cdots + X_{k} = n$, constante, et la proposition 5 donne $\mathbb{V}(X_{1} + \cdots + X_{k}) = 0$.

    **2.** Chaque épreuve donne $r_{i}$ avec la probabilité $p_{i}$, indépendamment des autres : $X_{i} \sim \mathcal{B}(n, p_{i})$, et de même $X_{i} + X_{j}$, nombre de réalisations de $r_{i}$ ou $r_{j}$, suit la loi $\mathcal{B}(n, p_{i} + p_{j})$. Le théorème 5, appliqué à deux variables, donne 
    $$2\operatorname{Cov}(X_{i}, X_{j}) = n(p_{i} + p_{j})(1 - p_{i} - p_{j}) - np_{i}(1 - p_{i}) - np_{j}(1 - p_{j}) = -2np_{i}p_{j}.$$

    $$\boxed{\operatorname{Cov}(X_{i}, X_{j}) = -np_{i}p_{j} \quad (i \neq j)}$$

    **3.** Par le théorème 5, avec $\sum p_{i} = 1$ : 
    $$\mathbb{V}\Big(\sum_{i} X_{i}\Big) = n\sum_{i} p_{i}(1 - p_{i}) - n\sum_{i \neq j} p_{i}p_{j} = n\Big(\sum_{i} p_{i} - \Big(\sum_{i} p_{i}\Big)^{2}\Big) = 0.$$
     La covariance est négative parce que, le nombre total d'épreuves étant fixé, un excès de $r_{i}$ se fait au détriment des autres résultats.
