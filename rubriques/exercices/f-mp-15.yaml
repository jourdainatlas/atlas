  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $n \geqslant 2$ et $X$ une variable aléatoire de loi $\mathcal{G}(\frac{1}{n})$.

    **1.** Montrer que $\mathbb{P}(X \geqslant n^{2}) \leqslant \dfrac{1}{n}$.

    **2.** Montrer que $\mathbb{P}\big(|X - n| \geqslant n\big) \leqslant 1 - \dfrac{1}{n}$, et en déduire que $\mathbb{P}(X \geqslant 2n) \leqslant 1 - \dfrac{1}{n}$.

    **3.** Calculer exactement $\mathbb{P}(X \geqslant 2n)$ et sa limite quand $n \to +\infty$, et commenter la qualité des majorations.
  corrige: |
    Les deux inégalités du cours, appliquées à une loi géométrique, donnent des majorations correctes mais très éloignées des valeurs exactes.

    **1.** On a $\mathbb{E}(X) = n$, et l'inégalité de Markov donne $\mathbb{P}(X \geqslant n^{2}) \leqslant \frac{n}{n^{2}}$. 
    $$\boxed{\mathbb{P}(X \geqslant n^{2}) \leqslant \frac{1}{n}}$$

    **2.** On a $\mathbb{V}(X) = \frac{1 - 1/n}{1/n^{2}} = n^{2} - n$, et l'inégalité de Bienaymé-Tchebychev donne 
    $$\mathbb{P}\big(|X - n| \geqslant n\big) \leqslant \frac{n^{2} - n}{n^{2}}.$$
     Comme $(X \geqslant 2n) \subset (|X - n| \geqslant n)$ : 
    $$\boxed{\mathbb{P}\big(|X - n| \geqslant n\big) \leqslant 1 - \frac{1}{n}, \qquad \mathbb{P}(X \geqslant 2n) \leqslant 1 - \frac{1}{n}}$$

    **3.** On a $\mathbb{P}(X \geqslant k) = (1 - \frac{1}{n})^{k - 1}$, d'où 
    $$\boxed{\mathbb{P}(X \geqslant 2n) = \Big(1 - \frac{1}{n}\Big)^{2n - 1} \xrightarrow[n \to +\infty]{} \mathrm{e}^{-2} \approx 0{,}135}$$
     La majoration $1 - \frac{1}{n}$ tend vers $1$ : elle est sans intérêt. De même, $\mathbb{P}(X \geqslant n^{2}) = (1 - \frac{1}{n})^{n^{2} - 1}$ est de l'ordre de $\mathrm{e}^{-n}$, bien plus petit que $\frac{1}{n}$. Les inégalités de Markov et de Bienaymé-Tchebychev ne connaissent que l'espérance et la variance, et ne voient pas la décroissance exponentielle de la loi géométrique.
