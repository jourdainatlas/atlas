  enonce: |
    *De la loi géométrique à la loi exponentielle.* Soit $\lambda > 0$ et, pour tout entier $n > \lambda$, une variable $X_{n}$ de loi $\mathcal{G}(\frac{\lambda}{n})$.

    **1.** Calculer, pour $x \geqslant 0$, $F(x) = \lim\limits_{n \to +\infty} \mathbb{P}\Big(\dfrac{X_{n}}{n} \leqslant x\Big)$.

    **2.** Déterminer une fonction $f$ continue sur $\mathbb{R}_{+}$ telle que $F(x) = \displaystyle\int_{0}^{x} f(t)\,\mathrm{d} t$ pour tout $x \geqslant 0$.

    **3.** Comparer $\lim\limits_{n \to +\infty} \dfrac{\mathbb{E}(X_{n})}{n}$ et $\displaystyle\int_{0}^{+\infty} t f(t)\,\mathrm{d} t$, puis $\lim\limits_{n \to +\infty} \dfrac{\mathbb{E}(X_{n}^{2})}{n^{2}}$ et $\displaystyle\int_{0}^{+\infty} t^{2} f(t)\,\mathrm{d} t$.

    **4.** Soit $Y$ une variable aléatoire à valeurs dans $\mathbb{N}$ telle que $\mathbb{P}(Y = k) = F(k + 1) - F(k)$ pour tout $k \in \mathbb{N}$. Reconnaître la loi de $Y + 1$, et calculer $\mathbb{E}(Y)$ et $\mathbb{V}(Y)$.
  corrige: |
    Le temps d'attente géométrique, convenablement renormalisé, converge vers la loi exponentielle, qui est l'analogue continu de la loi géométrique.

    **1.** On a $\mathbb{P}(X_{n} \leqslant m) = 1 - (1 - \frac{\lambda}{n})^{m}$, donc $\mathbb{P}\big(\frac{X_{n}}{n} \leqslant x\big) = 1 - (1 - \frac{\lambda}{n})^{\lfloor nx \rfloor}$, et $\lfloor nx \rfloor\ln(1 - \frac{\lambda}{n}) \to -\lambda x$. 
    $$\boxed{F(x) = 1 - \mathrm{e}^{-\lambda x}}$$

    **2.** La fonction $F$ est de classe $\mathcal{C}^{1}$, nulle en $0$ : 
    $$\boxed{f(t) = \lambda\,\mathrm{e}^{-\lambda t}}$$

    **3.** Par les propositions 2 et 6, $\frac{\mathbb{E}(X_{n})}{n} = \frac{1}{\lambda}$ et $\frac{\mathbb{E}(X_{n}^{2})}{n^{2}} = \frac{1}{n^{2}}\big(\frac{1 - \lambda/n}{(\lambda/n)^{2}} + \frac{n^{2}}{\lambda^{2}}\big) = \frac{2 - \lambda/n}{\lambda^{2}}$. Les intégrales se calculent par intégration par parties. 
    $$\boxed{\lim \frac{\mathbb{E}(X_{n})}{n} = \frac{1}{\lambda} = \int_{0}^{+\infty} tf(t)\,\mathrm{d} t, \qquad \lim \frac{\mathbb{E}(X_{n}^{2})}{n^{2}} = \frac{2}{\lambda^{2}} = \int_{0}^{+\infty} t^{2}f(t)\,\mathrm{d} t}$$
     Les moments de la loi géométrique renormalisée convergent vers les « moments » de la densité $f$ : c'est le point de départ des variables à densité, hors programme.

    **4.** On a $\mathbb{P}(Y = k) = \mathrm{e}^{-\lambda k}(1 - \mathrm{e}^{-\lambda})$, donc $Y + 1 \sim \mathcal{G}(1 - \mathrm{e}^{-\lambda})$. 
    $$\boxed{\mathbb{E}(Y) = \frac{1}{1 - \mathrm{e}^{-\lambda}} - 1 = \frac{1}{\mathrm{e}^{\lambda} - 1}, \qquad \mathbb{V}(Y) = \frac{\mathrm{e}^{-\lambda}}{(1 - \mathrm{e}^{-\lambda})^{2}} = \frac{\mathrm{e}^{\lambda}}{(\mathrm{e}^{\lambda} - 1)^{2}}}$$
     La variable $Y$ est la partie entière d'une variable de densité $f$ : la loi géométrique est la version discrète de la loi exponentielle.
