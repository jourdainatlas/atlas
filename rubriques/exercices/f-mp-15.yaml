  enonce: |
    Soit $X$ une variable aléatoire à valeurs dans $\mathbb{N}$ telle que $X^{2}$ soit d'espérance finie. Pour $n \in \mathbb{N}^{*}$, on pose $S_{n} = \displaystyle\sum_{k = 1}^{n} \mathbb{P}(X < k)$.

    **1.** Montrer que $S_{n} = n - \mathbb{E}(X) + \displaystyle\sum_{k = n + 1}^{+\infty} \mathbb{P}(X \geqslant k)$.

    **2.** À l'aide de l'inégalité de Markov appliquée à $X^{2}$, en déduire que $S_{n} = n - \mathbb{E}(X) + O\Big(\dfrac{1}{n}\Big)$ quand $n \to +\infty$.
  corrige: |
    On réécrit $S_{n}$ à l'aide des queues de la loi, puis on majore le reste par l'inégalité de Markov appliquée à $X^{2}$.

    **1.** La variable $X$ est d'espérance finie (proposition 4). On a $\mathbb{P}(X < k) = 1 - \mathbb{P}(X \geqslant k)$, et la proposition 1 donne $\sum_{k \geqslant 1} \mathbb{P}(X \geqslant k) = \mathbb{E}(X)$, d'où 
    $$\boxed{S_{n} = n - \sum_{k = 1}^{n} \mathbb{P}(X \geqslant k) = n - \mathbb{E}(X) + \sum_{k = n + 1}^{+\infty} \mathbb{P}(X \geqslant k)}$$

    **2.** Pour $k \geqslant 1$, l'inégalité de Markov donne 
    $$\mathbb{P}(X \geqslant k) = \mathbb{P}(X^{2} \geqslant k^{2}) \leqslant \frac{\mathbb{E}(X^{2})}{k^{2}},$$
     et $\sum_{k > n} \frac{1}{k^{2}} \leqslant \sum_{k > n} \frac{1}{k(k - 1)} = \frac{1}{n}$. 
    $$\boxed{S_{n} = n - \mathbb{E}(X) + O\Big(\frac{1}{n}\Big)}$$
- id: "mp-15-27"
