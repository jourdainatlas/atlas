  enonce: |
    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables aléatoires à valeurs dans $\mathbb{N}$, de même loi, et $R_{n}$ le nombre de valeurs distinctes parmi $X_{1}$, …, $X_{n}$.

    **1.** Montrer que, pour tout $a \in \mathbb{N}$, $\mathbb{E}(R_{n}) \leqslant a + n\,\mathbb{P}(X_{1} \geqslant a)$.

    **2.** En déduire que $\mathbb{E}(R_{n}) = o(n)$ quand $n \to +\infty$.

    **3.** Si $X_{1} \sim \mathcal{G}(p)$, montrer que $\mathbb{E}(R_{n}) = O(\ln n)$.
  corrige: |
    On sépare les petites valeurs, qui sont au plus $a$, des grandes, qui sont rares.

    **1.** Les valeurs distinctes strictement inférieures à $a$ sont au plus $a$, et chaque $X_{k} \geqslant a$ apporte au plus une valeur nouvelle : $R_{n} \leqslant a + \sum_{k = 1}^{n} \mathbf{1}_{(X_{k} \geqslant a)}$. Par linéarité et puisque les $X_{k}$ ont la même loi : 
    $$\boxed{\mathbb{E}(R_{n}) \leqslant a + n\,\mathbb{P}(X_{1} \geqslant a)}$$

    **2.** Soit $\varepsilon > 0$. Comme $\mathbb{P}(X_{1} \geqslant a) \to 0$ quand $a \to +\infty$, on choisit $a$ tel que $\mathbb{P}(X_{1} \geqslant a) \leqslant \frac{\varepsilon}{2}$, puis $n_{0}$ tel que $\frac{a}{n} \leqslant \frac{\varepsilon}{2}$ pour $n \geqslant n_{0}$. Alors $\frac{\mathbb{E}(R_{n})}{n} \leqslant \varepsilon$ pour $n \geqslant n_{0}$. 
    $$\boxed{\mathbb{E}(R_{n}) = o(n)}$$

    **3.** Si $X_{1} \sim \mathcal{G}(p)$, $\mathbb{P}(X_{1} \geqslant a) = q^{a - 1}$. Avec $a = \lfloor \frac{\ln n}{\ln(1/q)} \rfloor + 2$, on a $q^{a - 1} \leqslant q^{\ln n/\ln(1/q)} = \frac{1}{n}$, d'où $\mathbb{E}(R_{n}) \leqslant \frac{\ln n}{\ln(1/q)} + 3$. 
    $$\boxed{\mathbb{E}(R_{n}) = O(\ln n)}$$
     Aucune indépendance n'a été utilisée : seule compte la loi commune des $X_{k}$.
