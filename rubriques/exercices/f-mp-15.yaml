  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $(A_{k})_{k \in \mathbb{N}}$ une suite d'événements telle que la série $\sum \mathbb{P}(A_{k})$ converge. On pose $X = \displaystyle\sum_{k = 0}^{+\infty} \mathbf{1}_{A_{k}}$, à valeurs dans $\mathbb{N} \cup \{+\infty\}$, et $X_{n} = \displaystyle\sum_{k = 0}^{n} \mathbf{1}_{A_{k}}$.

    **1.** Montrer que les $X_{n}$ et $X$ sont des variables aléatoires discrètes.

    **2.** Montrer que, pour tous $k$, $n \in \mathbb{N}$, 
    $$\sum_{j = 0}^{k} \mathbb{P}(X_{n} > j) \leqslant \sum_{j = 0}^{+\infty} \mathbb{P}(A_{j}),$$
     puis que $\mathbb{P}(X > j) = \lim\limits_{n \to +\infty} \mathbb{P}(X_{n} > j)$ pour tout $j$.

    **3.** En déduire que $X$ est d'espérance finie et que $\mathbb{E}(X) = \displaystyle\sum_{k = 0}^{+\infty} \mathbb{P}(A_{k})$. Retrouver le premier lemme de Borel-Cantelli (exercice 9 de la feuille du chapitre 14).
  corrige: |
    On obtient l'espérance de la somme infinie d'indicatrices par passage à la limite dans les sommes finies, à l'aide des queues de la loi.

    **1.** La variable $X_{n}$ est à valeurs dans $\llbracket 0\,,n + 1 \rrbracket$, et $(X_{n} = j)$ est une réunion finie d'intersections des $A_{k}$ et de leurs complémentaires : c'est une variable aléatoire discrète. Pour $X$, on a $(X > j) = \bigcup_{n} (X_{n} > j)$, réunion croissante d'événements ; donc $(X = j) = (X > j - 1) \setminus (X > j)$ et $(X = +\infty) = \bigcap_{j} (X > j)$ sont des événements.

    **2.** Par la proposition 1 et la linéarité, $\sum_{j = 0}^{k} \mathbb{P}(X_{n} > j) \leqslant \mathbb{E}(X_{n}) = \sum_{j = 0}^{n} \mathbb{P}(A_{j}) \leqslant \sum_{j = 0}^{+\infty} \mathbb{P}(A_{j})$. La continuité croissante donne $\mathbb{P}(X > j) = \lim_{n} \mathbb{P}(X_{n} > j)$.

    **3.** En faisant tendre $n$ vers $+\infty$, puis $k$, on obtient $\mathbb{E}(X) = \sum_{j \geqslant 0} \mathbb{P}(X > j) \leqslant \sum_{j} \mathbb{P}(A_{j})$. Inversement, $X \geqslant X_{n}$, d'où $\mathbb{E}(X) \geqslant \sum_{j = 0}^{n} \mathbb{P}(A_{j})$ pour tout $n$ (croissance de l'espérance dans $[0, +\infty]$). 
    $$\boxed{\mathbb{E}(X) = \sum_{k = 0}^{+\infty} \mathbb{P}(A_{k}) < +\infty}$$
     En particulier $\mathbb{P}(X = +\infty) = 0$ : presque sûrement, seul un nombre fini des $A_{k}$ se réalisent. C'est le premier lemme de Borel-Cantelli, démontré ici par la seule finitude d'une espérance.
- id: "mp-15-12"
