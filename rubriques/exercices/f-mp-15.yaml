  enonce: |
    *Perspective : le retour à l'origine d'une marche aléatoire.* Une particule part de $0$ et se déplace sur $\mathbb{Z}$ : à chaque instant, indépendamment du passé, elle fait un pas de $+1$ avec la probabilité $p \in ]0, 1[$ et de $-1$ avec la probabilité $q = 1 - p$. Pour $n \in \mathbb{N}$, on note $a_{n}$ la probabilité que la particule soit en $0$ à l'instant $n$ ; pour $n \in \mathbb{N}^{*}$, on note $b_{n}$ la probabilité qu'elle revienne en $0$ pour la première fois à l'instant $n$.

    **1.** Calculer $a_{2n}$ et $a_{2n + 1}$. Montrer que la série $\sum a_{n}$ diverge si et seulement si $p = q = \frac{1}{2}$.

    **2.** On pose $f(t) = \displaystyle\sum_{n = 0}^{+\infty} a_{n}t^{n}$ et $g(t) = \displaystyle\sum_{n = 1}^{+\infty} b_{n}t^{n}$. Justifier que $f$ et $g$ sont définies sur $[0, 1[$.

    **3.** En décomposant selon l'instant du premier retour en $0$, montrer que $a_{n} = \displaystyle\sum_{k = 1}^{n} b_{k}a_{n - k}$ pour $n \geqslant 1$, puis que $f(t) = 1 + f(t)g(t)$ pour $t \in [0, 1[$.

    **4.** Montrer que $f(t) = (1 - 4pq\,t^{2})^{-1/2}$ pour $t \in [0, 1[$, et en déduire $g(t)$.

    **5.** En utilisant le lemme de la démonstration du théorème 10, montrer que la probabilité que la particule revienne en $0$ vaut $1 - |p - q|$.

    **6.** On suppose $p = \frac{1}{2}$, et l'on note $R$ l'instant du premier retour en $0$. Montrer que $R$ est presque sûrement fini, mais que $R$ n'est pas d'espérance finie.
  corrige: |
    La décomposition selon le premier retour donne une relation de convolution, que les fonctions génératrices transforment en une équation algébrique ; le lemme de la démonstration du théorème 10 permet ensuite de passer à $t = 1$.

    **1.** Un retour en $0$ demande autant de pas $+1$ que de pas $-1$ : $a_{2n + 1} = 0$, et $a_{2n} = \binom{2n}{n}(pq)^{n}$. Par l'exercice 26 de la feuille du chapitre 14, $\binom{2n}{n} \sim \frac{4^{n}}{\sqrt{\pi n}}$, d'où $a_{2n} \sim \frac{(4pq)^{n}}{\sqrt{\pi n}}$. Or $4pq = 1 - (p - q)^{2}$ vaut $1$ si $p = \frac{1}{2}$, et est strictement inférieur à $1$ sinon. 
    $$\boxed{\sum a_{n} \text{ diverge} \iff p = q = \tfrac{1}{2}}$$

    **2.** Les $a_{n}$ et les $b_{n}$ sont dans $[0, 1]$ : les deux séries entières ont un rayon au moins égal à $1$.

    **3.** Pour $n \geqslant 1$, l'événement « en $0$ à l'instant $n$ » est la réunion disjointe, pour $k \in \llbracket 1\,,n \rrbracket$, des événements « premier retour à l'instant $k$ et déplacement nul entre les instants $k$ et $n$ ». Le premier ne dépend que des $k$ premiers pas, le second des pas suivants, et il a la probabilité $a_{n - k}$ ; le lemme des coalitions donne 
    $$a_{n} = \sum_{k = 1}^{n} b_{k}a_{n - k}.$$
     Pour $t \in [0, 1[$, le produit de Cauchy des séries absolument convergentes $f(t)$ et $g(t)$ (chapitre 9) donne $f(t) - 1 = \sum_{n \geqslant 1} a_{n}t^{n} = g(t)f(t)$. 
    $$\boxed{f(t) = 1 + f(t)g(t)}$$

    **4.** Le développement $\sum_{n} \binom{2n}{n}x^{n} = \frac{1}{\sqrt{1 - 4x}}$ pour $|x| < \frac{1}{4}$ (chapitre 9), appliqué à $x = pqt^{2}$, donne $f(t) = (1 - 4pqt^{2})^{-1/2}$. Comme $f(t) \geqslant 1 > 0$, on a $g = 1 - \frac{1}{f}$ : 
    $$\boxed{f(t) = \frac{1}{\sqrt{1 - 4pq\,t^{2}}}, \qquad g(t) = 1 - \sqrt{1 - 4pq\,t^{2}}}$$

    **5.** Les événements « premier retour à l'instant $n$ » sont incompatibles : la probabilité de retour est $\sum_{n} b_{n}$. Le lemme du théorème 10 donne $\sum b_{n} = \lim_{t \to 1^{-}} g(t) = 1 - \sqrt{1 - 4pq}$, et $1 - 4pq = (p - q)^{2}$. 
    $$\boxed{\mathbb{P}(\text{retour en } 0) = 1 - |p - q|}$$
     Si $p \neq \frac{1}{2}$, la particule dérive vers $\pm\infty$ et a une probabilité positive de ne jamais revenir.

    **6.** Pour $p = \frac{1}{2}$, la probabilité de retour vaut $1$ : $R$ est presque sûrement fini, de fonction génératrice $g(t) = 1 - \sqrt{1 - t^{2}}$. Le taux d'accroissement en $1$ vaut 
    $$\frac{g(1) - g(t)}{1 - t} = \frac{\sqrt{1 - t^{2}}}{1 - t} = \sqrt{\frac{1 + t}{1 - t}} \xrightarrow[t \to 1^{-}]{} +\infty,$$
     et la démonstration du théorème 10 montre que cette limite est $\mathbb{E}(R)$. 
    $$\boxed{R < +\infty \ \text{ presque sûrement}, \qquad \mathbb{E}(R) = +\infty}$$
     La particule revient presque sûrement à l'origine, mais le temps d'attente du retour est d'espérance infinie : c'est, comme pour le gain de Saint-Pétersbourg du cours, une variable finie d'espérance infinie. Le contraste avec la dimension $3$ de l'exercice 43 de la feuille du chapitre 14, où la particule ne repasse qu'un nombre fini de fois par l'origine, est le théorème de Pólya.

