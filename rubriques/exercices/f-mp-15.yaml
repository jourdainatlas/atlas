  source: "Feuille d'exercices #11 (Prost), exercice 11"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $m \in \mathbb{N}^{*}$ et $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{B}(p)$. On pose $S_{n} = X_{1} + \cdots + X_{n}$ et $M = \inf\{n \in \mathbb{N}^{*} \mid S_{n} \geqslant m\}$, avec $M = +\infty$ si cet ensemble est vide.

    **1.** Montrer que, pour tout $n \in \mathbb{N}^{*}$, $\mathbb{P}(M \geqslant n) = \displaystyle\sum_{k = 0}^{m - 1} \binom{n - 1}{k}p^{k}q^{n - 1 - k}$, et en déduire que $\mathbb{P}(M = +\infty) = 0$.

    **2.** À l'aide de la proposition 1 du cours et du développement en série entière de $x \mapsto (1 - x)^{-(k + 1)}$ (chapitre 9), montrer que $M$ est d'espérance finie, et calculer $\mathbb{E}(M)$.
  corrige: |
    L'événement $(M \geqslant n)$ dit qu'il y a eu moins de $m$ succès lors des $n - 1$ premières épreuves ; on somme ensuite les queues.

    **1.** On a $(M \geqslant n) = (S_{n - 1} \leqslant m - 1)$, et $S_{n - 1} \sim \mathcal{B}(n - 1, p)$. 
    $$\boxed{\mathbb{P}(M \geqslant n) = \sum_{k = 0}^{m - 1} \binom{n - 1}{k}p^{k}q^{n - 1 - k}}$$
     Chaque terme, de la forme $(\text{polynôme en } n) \times q^{n}$, tend vers $0$ ; la suite $(M \geqslant n)$ est décroissante d'intersection $(M = +\infty)$, d'où $\mathbb{P}(M = +\infty) = 0$ par continuité décroissante.

    **2.** Pour $|x| < 1$, la dérivée $k$-ième de $\frac{1}{1 - x}$ donne $\sum_{j \geqslant k} \binom{j}{k}x^{j - k} = \frac{1}{(1 - x)^{k + 1}}$ (chapitre 9). Par la proposition 1 et le théorème de Fubini pour les familles positives : 
    $$\mathbb{E}(M) = \sum_{n = 1}^{+\infty} \mathbb{P}(M \geqslant n) = \sum_{k = 0}^{m - 1} p^{k}\sum_{j = k}^{+\infty} \binom{j}{k}q^{j - k} = \sum_{k = 0}^{m - 1} \frac{p^{k}}{p^{k + 1}}, \qquad \boxed{\mathbb{E}(M) = \frac{m}{p}}$$
     On retrouve l'espérance de la loi de Pascal, somme de $m$ variables de loi $\mathcal{G}(p)$ (cours, section 15.5).
- id: "mp-15-11"
  feuille: "f-mp-15"
  numero: 11
