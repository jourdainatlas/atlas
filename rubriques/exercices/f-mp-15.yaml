  enonce: |
    *Fonction caractéristique.* Pour une variable aléatoire $X$ à valeurs dans $\mathbb{N}$, on pose $\varphi_{X}(t) = \mathbb{E}\big(\mathrm{e}^{\mathrm{i} tX}\big)$ pour $t \in \mathbb{R}$.

    **1.** Montrer que $\varphi_{X}$ est définie, continue et $2\pi$-périodique sur $\mathbb{R}$, et l'exprimer à l'aide de $G_{X}$.

    **2.** Calculer $\varphi_{X}$ lorsque $X$ suit la loi $\mathcal{B}(n, p)$, $\mathcal{G}(p)$ ou $\mathcal{P}(\lambda)$.

    **3.** En calculant $\dfrac{1}{2\pi}\displaystyle\int_{-\pi}^{\pi} \varphi_{X}(t)\,\mathrm{e}^{-\mathrm{i} kt}\,\mathrm{d} t$, montrer que $\varphi_{X}$ détermine la loi de $X$. Comparer avec le chapitre 11.

    **4.** On suppose $X$ d'espérance finie. Montrer que $\varphi_{X}$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et calculer $\varphi_{X}'(0)$.
  corrige: |
    La fonction caractéristique est la fonction génératrice sur le cercle unité ; ses coefficients de Fourier sont les probabilités $\mathbb{P}(X = k)$.

    **1.** Pour tout $t$, $|\mathrm{e}^{\mathrm{i} tk}\mathbb{P}(X = k)| = \mathbb{P}(X = k)$ : la série converge normalement sur $\mathbb{R}$, et sa somme est continue (chapitre 8) et $2\pi$-périodique comme chacun des termes. La proposition 9 donne : 
    $$\boxed{\varphi_{X}(t) = G_{X}\big(\mathrm{e}^{\mathrm{i} t}\big)}$$

    **2.** La proposition 10 donne : 
    $$\boxed{\varphi_{\mathcal{B}(n, p)}(t) = (q + p\,\mathrm{e}^{\mathrm{i} t})^{n}, \qquad \varphi_{\mathcal{G}(p)}(t) = \frac{p\,\mathrm{e}^{\mathrm{i} t}}{1 - q\,\mathrm{e}^{\mathrm{i} t}}, \qquad \varphi_{\mathcal{P}(\lambda)}(t) = \exp\big(\lambda(\mathrm{e}^{\mathrm{i} t} - 1)\big)}$$

    **3.** La convergence normale permet d'intégrer terme à terme sur $[-\pi, \pi]$, et $\frac{1}{2\pi}\int_{-\pi}^{\pi} \mathrm{e}^{\mathrm{i}(j - k)t}\,\mathrm{d} t$ vaut $1$ si $j = k$ et $0$ sinon. 
    $$\boxed{\frac{1}{2\pi}\int_{-\pi}^{\pi} \varphi_{X}(t)\,\mathrm{e}^{-\mathrm{i} kt}\,\mathrm{d} t = \mathbb{P}(X = k)}$$
     Les probabilités sont les coefficients de Fourier de $\varphi_{X}$ (chapitre 11) : deux variables de même fonction caractéristique ont la même loi.

    **4.** La série dérivée $\sum \mathrm{i} k\,\mathbb{P}(X = k)\,\mathrm{e}^{\mathrm{i} tk}$ converge normalement sur $\mathbb{R}$, car $\mathbb{E}(X) < +\infty$ : le théorème de dérivation terme à terme s'applique. 
    $$\boxed{\varphi_{X} \in \mathcal{C}^{1}(\mathbb{R}), \qquad \varphi_{X}'(0) = \mathrm{i}\,\mathbb{E}(X)}$$
