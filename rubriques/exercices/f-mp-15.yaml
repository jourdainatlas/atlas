  enonce: |
    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes, $X_{n}$ suivant la loi $\mathcal{B}(\frac{1}{n})$. On pose 
    $$T = \min\{n \in \mathbb{N}^{*} \mid X_{n} = 1, X_{n + 1} = 0\}.$$

    **1.** Déterminer la loi de $T$, et vérifier que $T$ est presque sûrement fini.

    **2.** Calculer $\mathbb{E}(T)$ et $\mathbb{V}(T)$.

    **3.** Pour $k$, $n \in \mathbb{N}^{*}$, calculer $\mathbb{P}_{(X_{k} = 1)}(T = n)$.
  corrige: |
    Comme $X_{1} = 1$ presque sûrement, $T$ est la longueur du premier bloc de $1$ ; sa loi fait apparaître des factorielles, et les moments sont des séries exponentielles.

    **1.** On a $\mathbb{P}(X_{1} = 1) = 1$. Presque sûrement, $(T = n)$ est l'événement 
    $$(X_{2} = \cdots = X_{n} = 1) \cap (X_{n + 1} = 0),$$
     d'où, par indépendance, 
    $$\mathbb{P}(T = n) = \Big(\prod_{k = 2}^{n} \frac{1}{k}\Big)\Big(1 - \frac{1}{n + 1}\Big), \qquad \boxed{\mathbb{P}(T = n) = \frac{n}{(n + 1)!}, \quad n \geqslant 1}$$
     Comme $\frac{n}{(n + 1)!} = \frac{1}{n!} - \frac{1}{(n + 1)!}$, la somme télescopique vaut $1$ : $T$ est presque sûrement fini.

    **2.** On écrit $n^{2} = (n + 1)n - (n + 1) + 1$ et $n^{3} = (n + 1)n(n - 1) + (n + 1) - 1$, et l'on reconnaît des séries exponentielles : 
    $$\mathbb{E}(T) = \sum_{n \geqslant 1} \frac{n^{2}}{(n + 1)!} = \mathrm{e} - (\mathrm{e} - 1) + (\mathrm{e} - 2), \qquad \mathbb{E}(T^{2}) = \sum_{n \geqslant 1} \frac{n^{3}}{(n + 1)!} = \mathrm{e} + (\mathrm{e} - 1) - (\mathrm{e} - 2) = \mathrm{e} + 1.$$

    $$\boxed{\mathbb{E}(T) = \mathrm{e} - 1, \qquad \mathbb{V}(T) = \mathrm{e} + 1 - (\mathrm{e} - 1)^{2} = 3\mathrm{e} - \mathrm{e}^{2} \approx 0{,}766}$$

    **3.** Pour $k = 1$, le conditionnement ne change rien. Pour $k \geqslant 2$, $\mathbb{P}(X_{k} = 1) = \frac{1}{k}$. Si $2 \leqslant k \leqslant n$, l'événement $(T = n)$ est inclus dans $(X_{k} = 1)$ ; si $k = n + 1$, il est incompatible avec lui ; si $k \geqslant n + 2$, $(T = n)$ ne dépend que de $X_{1}$, …, $X_{n + 1}$, donc est indépendant de $(X_{k} = 1)$. 
    $$\boxed{\mathbb{P}_{(X_{k} = 1)}(T = n) = \begin{cases} \dfrac{kn}{(n + 1)!} & \text{si } 2 \leqslant k \leqslant n, \\[2mm] 0 & \text{si } k = n + 1, \\[1mm] \dfrac{n}{(n + 1)!} & \text{si } k = 1 \text{ ou } k \geqslant n + 2. \end{cases}}$$
