  enonce: |
    *Perspective : la loi forte des grands nombres.* Soit $(X_{n})_{n \geqslant 1}$ une suite de variables aléatoires réelles indépendantes, de même loi, telles que $X_{1}^{4}$ soit d'espérance finie. On note $m = \mathbb{E}(X_{1})$, $\sigma^{2} = \mathbb{V}(X_{1})$, $V_{4} = \mathbb{E}\big((X_{1} - m)^{4}\big)$ et $S_{n} = X_{1} + \cdots + X_{n}$.

    **1.** Justifier que $m$, $\sigma^{2}$ et $V_{4}$ sont bien définis, et que $\sigma^{4} \leqslant V_{4}$.

    **2.** En développant $(S_{n} - nm)^{4}$ et en utilisant l'indépendance, montrer que 
    $$\mathbb{E}\big((S_{n} - nm)^{4}\big) = nV_{4} + 3n(n - 1)\sigma^{4}.$$

    **3.** En déduire que, pour tout $\varepsilon > 0$, $\mathbb{P}\Big(\Big|\dfrac{S_{n}}{n} - m\Big| \geqslant \varepsilon\Big) \leqslant \dfrac{3V_{4}}{\varepsilon^{4}n^{2}}$.

    **4.** À l'aide du premier lemme de Borel-Cantelli (exercice 9 de la feuille du chapitre 14), montrer que, pour tout $\varepsilon > 0$, presque sûrement, $\big|\frac{S_{n}}{n} - m\big| < \varepsilon$ à partir d'un certain rang. En prenant $\varepsilon = \frac{1}{j}$, $j \in \mathbb{N}^{*}$, en déduire que $\frac{S_{n}}{n}$ converge vers $m$ presque sûrement.

    **5.** Pourquoi l'inégalité de Bienaymé-Tchebychev ne suffisait-elle pas pour la question 4 ?
  corrige: |
    Avec un moment d'ordre $4$, la probabilité d'écart décroît en $\frac{1}{n^{2}}$, terme d'une série convergente ; le premier lemme de Borel-Cantelli transforme alors la loi faible en convergence presque sûre.

    **1.** Pour $k \leqslant 4$, $|x|^{k} \leqslant 1 + x^{4}$, donc $X_{1}$ et $X_{1}^{2}$ sont d'espérance finie par domination ; de même $(X_{1} - m)^{4} \leqslant 8(X_{1}^{4} + m^{4})$. L'inégalité de Cauchy-Schwarz, appliquée à $(X_{1} - m)^{2}$ et à $1$, donne 
    $$\boxed{\sigma^{4} = \mathbb{E}\big((X_{1} - m)^{2}\big)^{2} \leqslant \mathbb{E}\big((X_{1} - m)^{4}\big) = V_{4}}$$

    **2.** Posons $Y_{i} = X_{i} - m$, centrées, indépendantes et de même loi. Par linéarité, 
    $$\mathbb{E}\big((S_{n} - nm)^{4}\big) = \sum_{i, j, k, l} \mathbb{E}(Y_{i}Y_{j}Y_{k}Y_{l}).$$
     Si l'un des indices n'apparaît qu'une fois, le théorème 3 et le lemme des coalitions font apparaître un facteur $\mathbb{E}(Y_{i}) = 0$. Restent les quadruplets où les quatre indices sont égaux, au nombre de $n$, d'espérance $V_{4}$, et ceux formés de deux indices distincts apparaissant chacun deux fois : on choisit la paire d'indices, de $\frac{n(n - 1)}{2}$ façons, et leurs places, de $\binom{4}{2} = 6$ façons, chaque terme valant $\sigma^{4}$. 
    $$\boxed{\mathbb{E}\big((S_{n} - nm)^{4}\big) = nV_{4} + 3n(n - 1)\sigma^{4}}$$

    **3.** Par la question 1, $nV_{4} + 3n(n - 1)\sigma^{4} \leqslant (n + 3n^{2} - 3n)V_{4} \leqslant 3n^{2}V_{4}$. L'inégalité de Markov, appliquée à $(S_{n} - nm)^{4}$ et à $(n\varepsilon)^{4}$, donne 
    $$\boxed{\mathbb{P}\Big(\Big|\frac{S_{n}}{n} - m\Big| \geqslant \varepsilon\Big) \leqslant \frac{3n^{2}V_{4}}{n^{4}\varepsilon^{4}} = \frac{3V_{4}}{\varepsilon^{4}n^{2}}}$$

    **4.** La série $\sum \frac{1}{n^{2}}$ converge, et le premier lemme de Borel-Cantelli montre que, presque sûrement, seul un nombre fini des événements $\big(|\frac{S_{n}}{n} - m| \geqslant \varepsilon\big)$ se réalisent. Soit $\Omega_{j}$ l'événement, de probabilité $1$, obtenu pour $\varepsilon = \frac{1}{j}$. L'intersection dénombrable $\bigcap_{j} \Omega_{j}$ est de probabilité $1$ (sous-additivité appliquée aux complémentaires), et sur cet événement, $|\frac{S_{n}}{n} - m| < \frac{1}{j}$ à partir d'un certain rang, pour tout $j$. 
    $$\boxed{\frac{S_{n}}{n} \xrightarrow[n \to +\infty]{} m \ \text{ presque sûrement}}$$

    **5.** L'inégalité de Bienaymé-Tchebychev donne $\frac{\sigma^{2}}{n\varepsilon^{2}}$, terme d'une série divergente : le lemme de Borel-Cantelli ne s'applique pas. C'est le moment d'ordre $4$ qui accélère la décroissance. La loi forte est vraie sous la seule hypothèse $X_{1} \in L^{1}$ (théorème de Kolmogorov), mais sa démonstration est plus difficile.
