  enonce: |
    *Les deux premiers blocs.* Une urne contient des boules noires en proportion $p \in ]0, 1[$ et des boules blanches en proportion $q = 1 - p$. On effectue une suite infinie de tirages avec remise. On appelle *bloc* une suite maximale de tirages consécutifs de la même couleur ; on note $X$ la longueur du premier bloc et $Y$ celle du deuxième.

    **1.** Calculer $\mathbb{P}(X = i, Y = j)$ pour $i$, $j \in \mathbb{N}^{*}$, et en déduire les lois de $X$ et de $Y$.

    **2.** Montrer que $X$ est d'espérance finie, la calculer, et vérifier que $\mathbb{E}(X) \geqslant 2$.

    **3.** Montrer que $Y$ est d'espérance finie et que $\mathbb{E}(Y) = 2$, quel que soit $p$.

    **4.** Calculer $\mathbb{P}(X = Y)$.
  corrige: |
    Le premier bloc est de la couleur du premier tirage, et le second de l'autre couleur ; on décompose selon la couleur initiale.

    **1.** L'événement $(X = i, Y = j)$ signifie : $i$ boules d'une couleur, $j$ de l'autre, puis une boule de la première couleur. 
    $$\boxed{\mathbb{P}(X = i, Y = j) = p^{i + 1}q^{j} + q^{i + 1}p^{j}}$$
     Avec $\sum_{j \geqslant 1} q^{j} = \frac{q}{p}$ et $\sum_{i \geqslant 1} p^{i + 1} = \frac{p^{2}}{q}$, la proposition 11 du chapitre 14 donne 
    $$\boxed{\mathbb{P}(X = i) = p^{i}q + q^{i}p, \qquad \mathbb{P}(Y = j) = p^{2}q^{j - 1} + q^{2}p^{j - 1}}$$

    **2.** Avec $\sum_{i \geqslant 1} i\,x^{i} = \frac{x}{(1 - x)^{2}}$ pour $|x| < 1$ (chapitre 9) : 
    $$\mathbb{E}(X) = q\cdot\frac{p}{q^{2}} + p\cdot\frac{q}{p^{2}}, \qquad \boxed{\mathbb{E}(X) = \frac{p}{q} + \frac{q}{p} \geqslant 2}$$
     puisque $u + \frac{1}{u} \geqslant 2$ pour $u > 0$, avec égalité si et seulement si $p = q = \frac{1}{2}$.

    **3.** Avec $\sum_{j \geqslant 1} j\,x^{j - 1} = \frac{1}{(1 - x)^{2}}$ : $\mathbb{E}(Y) = p^{2}\cdot\frac{1}{p^{2}} + q^{2}\cdot\frac{1}{q^{2}}$. 
    $$\boxed{\mathbb{E}(Y) = 2}$$
     Le premier bloc est en moyenne plus long que le second : il est d'autant plus long que sa couleur est probable, et c'est la couleur du premier tirage, donc le plus souvent la couleur la plus fréquente.

    **4.** On somme la loi conjointe sur la diagonale : 
    $$\mathbb{P}(X = Y) = \sum_{n = 1}^{+\infty} (pq)^{n}(p + q), \qquad \boxed{\mathbb{P}(X = Y) = \frac{pq}{1 - pq}}$$
     Pour $p = 0{,}3$, toutes ces valeurs ont été vérifiées numériquement : $\mathbb{E}(X) \approx 2{,}762$ et $\mathbb{P}(X = Y) \approx 0{,}266$.
