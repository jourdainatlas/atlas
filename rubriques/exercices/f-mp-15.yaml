  enonce: |
    Soit $X$ et $Y$ deux variables aléatoires indépendantes, de lois $\mathcal{P}(\lambda)$ et $\mathcal{B}(p)$. On pose $Z = XY$.

    **1.** Montrer que $G_{Z} = G_{Y} \circ G_{X}$, en conditionnant par la valeur de $Y$.

    **2.** En déduire $\mathbb{E}(Z)$ et $\mathbb{V}(Z)$. Retrouver $\mathbb{E}(Z)$ par le théorème 3 du cours.
  corrige: |
    La variable $Z$ vaut $0$ ou $X$ selon la valeur de $Y$ ; c'est une somme aléatoire au sens de la proposition 12, avec un nombre de termes égal à $0$ ou $1$.

    **1.** Pour $t \in [-1, 1]$, la formule de transfert pour le couple $(X, Y)$ et l'indépendance donnent 
    $$G_{Z}(t) = \mathbb{E}\big(t^{XY}\big) = \mathbb{P}(Y = 0) + \mathbb{P}(Y = 1)\,\mathbb{E}\big(t^{X}\big) = q + p\,G_{X}(t), \qquad \boxed{G_{Z} = G_{Y} \circ G_{X}}$$

    **2.** On a $G_{Z}(t) = q + p\,\mathrm{e}^{\lambda(t - 1)}$, donc $G_{Z}'(1) = p\lambda$ et $G_{Z}''(1) = p\lambda^{2}$. 
    $$\boxed{\mathbb{E}(Z) = p\lambda, \qquad \mathbb{V}(Z) = p\lambda^{2} + p\lambda - p^{2}\lambda^{2} = p\lambda(1 + q\lambda)}$$
     Le théorème 3 donne directement $\mathbb{E}(XY) = \mathbb{E}(X)\,\mathbb{E}(Y) = \lambda p$. La variance dépasse celle d'une loi de Poisson de même espérance, $p\lambda$ : le mélange de la valeur $0$ et de la loi $\mathcal{P}(\lambda)$ ajoute de la dispersion.
