  source: "Feuille d'exercices #11 (Prost), exercice 3 ; BibM@th, Variables aléatoires discrètes, exercice 37 (question 2)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Le plus grand numéro.* Une urne contient $N$ boules numérotées de $1$ à $N$. On effectue $n$ tirages avec remise, et l'on note $X$ le plus grand numéro obtenu.

    **1.** Calculer $\mathbb{P}(X \leqslant k)$ pour $k \in \llbracket 0\,,N \rrbracket$, et en déduire la loi de $X$.

    **2.** Montrer que $\mathbb{E}(X) = N - \displaystyle\sum_{k = 0}^{N - 1} \Big(\frac{k}{N}\Big)^{n}$. On utilisera la proposition 1 du cours.

    **3.** Le nombre $n$ de tirages étant fixé, déterminer la limite de $\dfrac{\mathbb{E}(X)}{N}$ quand $N \to +\infty$, et interpréter.

    **4.** Dans le cas $n = N$, donner un équivalent de $\mathbb{E}(X)$, puis de $N - \mathbb{E}(X)$, quand $N \to +\infty$.
  corrige: |
    La fonction de répartition du maximum se calcule par indépendance ; l'espérance s'obtient par les queues, puis par une somme de Riemann.

    **1.** On a $(X \leqslant k) = \bigcap_{i} (\text{tirage } i \leqslant k)$, d'où $\mathbb{P}(X \leqslant k) = \big(\frac{k}{N}\big)^{n}$ par indépendance des tirages. 
    $$\boxed{\mathbb{P}(X = k) = \Big(\frac{k}{N}\Big)^{n} - \Big(\frac{k - 1}{N}\Big)^{n}, \qquad k \in \llbracket 1\,,N \rrbracket}$$

    **2.** Par la proposition 1, $\mathbb{E}(X) = \sum_{k \geqslant 1} \mathbb{P}(X \geqslant k) = \sum_{k = 0}^{N - 1} \mathbb{P}(X > k) = \sum_{k = 0}^{N - 1} \big(1 - (\frac{k}{N})^{n}\big)$. 
    $$\boxed{\mathbb{E}(X) = N - \sum_{k = 0}^{N - 1} \Big(\frac{k}{N}\Big)^{n}}$$

    **3.** La somme $\frac{1}{N}\sum_{k = 0}^{N - 1} \big(\frac{k}{N}\big)^{n}$ est une somme de Riemann de $x \mapsto x^{n}$ sur $[0, 1]$ ; elle tend vers $\frac{1}{n + 1}$. 
    $$\boxed{\frac{\mathbb{E}(X)}{N} \xrightarrow[N \to +\infty]{} \frac{n}{n + 1}}$$
     Le plus grand de $n$ nombres tirés uniformément dans $[0, 1]$ vaut en moyenne $\frac{n}{n + 1}$ : les $n$ points découpent en moyenne le segment en $n + 1$ morceaux de même longueur.

    **4.** Pour $n = N$, on pose $j = N - k$ : $\sum_{k = 0}^{N - 1} \big(\frac{k}{N}\big)^{N} = \sum_{j = 1}^{N} \big(1 - \frac{j}{N}\big)^{N}$. Chaque terme tend vers $\mathrm{e}^{-j}$ et est majoré par $\mathrm{e}^{-j}$, puisque $\ln(1 - x) \leqslant -x$ ; le théorème de convergence dominée pour les séries (exercice 15, question 1, ou chapitre 13) donne la limite $\sum_{j \geqslant 1} \mathrm{e}^{-j} = \frac{1}{\mathrm{e} - 1}$. 
    $$\boxed{\mathbb{E}(X) \underset{N \to +\infty}{\sim} N, \qquad N - \mathbb{E}(X) \xrightarrow[N \to +\infty]{} \frac{1}{\mathrm{e} - 1} \approx 0{,}582}$$
     Pour $N = 1000$, on trouve $N - \mathbb{E}(X) \approx 0{,}581$.
