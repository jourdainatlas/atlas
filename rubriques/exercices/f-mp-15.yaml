  page_corrige: 2
  enonce: |
    *Le concierge.* Un concierge rentre chez lui avec un trousseau de $n$ clés, dont une seule ouvre sa porte. Déterminer le nombre moyen d'essais nécessaires pour ouvrir la porte dans chacun des cas suivants.

    **1.** Il essaie les clés au hasard, en mettant de côté chaque clé essayée.

    **2.** Il essaie à chaque fois une clé au hasard dans tout le trousseau, sans mettre de côté les clés déjà essayées.
  corrige: |
    On reconnaît une loi uniforme dans le premier cas, et une loi géométrique dans le second.

    **1.** Toutes les positions de la bonne clé dans l'ordre des essais sont équiprobables : le nombre d'essais $X$ suit la loi uniforme sur $\llbracket 1\,,n \rrbracket$. 
    $$\boxed{\mathbb{E}(X) = \frac{1}{n}\sum_{k = 1}^{n} k = \frac{n + 1}{2}}$$

    **2.** Chaque essai réussit avec la probabilité $\frac{1}{n}$, indépendamment des autres : le nombre d'essais $Y$ suit la loi $\mathcal{G}(\frac{1}{n})$ (chapitre 14, théorème 8). 
    $$\boxed{\mathbb{E}(Y) = n}$$
     Ne pas mettre de côté les clés essayées coûte presque deux fois plus d'essais en moyenne.
