  source: "Feuille d'exercices #11 (Prost), exercice 12"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $X$, $Y$ deux variables aléatoires à valeurs dans $\llbracket 0\,,n \rrbracket$ telles que, pour tout $k \in \llbracket 0\,,n \rrbracket$ tel que $\mathbb{P}(Y = k) > 0$, la loi conditionnelle de $X$ sachant $(Y = k)$ soit la loi uniforme sur $\llbracket 0\,,k \rrbracket$.

    **1.** Déterminer la loi du couple $(X, Y)$, puis la loi de $X$, en fonction de celle de $Y$.

    **2.** Exprimer $\mathbb{E}(X)$ en fonction de $\mathbb{E}(Y)$.
  corrige: |
    On écrit la loi conjointe à l'aide des lois conditionnelles, puis l'on calcule l'espérance de $X$ en sommant d'abord à $Y$ fixé.

    **1.** Pour $0 \leqslant j \leqslant k \leqslant n$, on a $\mathbb{P}(X = j, Y = k) = \mathbb{P}(Y = k)\,\mathbb{P}_{(Y = k)}(X = j) = \frac{\mathbb{P}(Y = k)}{k + 1}$, cette égalité restant vraie si $\mathbb{P}(Y = k) = 0$ ; la probabilité est nulle si $j > k$. 
    $$\boxed{\mathbb{P}(X = j, Y = k) = \frac{\mathbb{P}(Y = k)}{k + 1} \ (j \leqslant k), \qquad \mathbb{P}(X = j) = \sum_{k = j}^{n} \frac{\mathbb{P}(Y = k)}{k + 1}}$$

    **2.** Par la formule de transfert appliquée au couple, en sommant d'abord en $j$ : 
    $$\mathbb{E}(X) = \sum_{k = 0}^{n} \frac{\mathbb{P}(Y = k)}{k + 1}\sum_{j = 0}^{k} j = \sum_{k = 0}^{n} \frac{k}{2}\,\mathbb{P}(Y = k), \qquad \boxed{\mathbb{E}(X) = \frac{\mathbb{E}(Y)}{2}}$$
     À $Y = k$ fixé, $X$ vaut en moyenne $\frac{k}{2}$ ; c'est la formule de l'espérance totale de l'exercice 9.
