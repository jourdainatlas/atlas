  noeuds: [p-esperance, p-loi-faible, p-independance]
  notions: [esperance, variance, independance]
  source: "Feuille d'exercices #11 (Prost), exercice 39"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    *Une loi faible sans indépendance.* Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{B}(p)$. On pose $Y_{n} = X_{n}X_{n + 1}$ et $Z_{n} = Y_{1} + \cdots + Y_{n}$.

    **1.** Déterminer la loi, l'espérance et la variance de $Y_{n}$.

    **2.** Calculer $\operatorname{Cov}(Y_{i}, Y_{j})$ pour $i < j$, en distinguant les cas $j = i + 1$ et $j \geqslant i + 2$, puis la variance de $Z_{n}$.

    **3.** Soit $\varepsilon > 0$. Montrer que $\mathbb{P}\Big(\Big|\dfrac{Z_{n}}{n} - p^{2}\Big| \geqslant \varepsilon\Big) \to 0$ quand $n \to +\infty$.
  corrige: |
    Les $Y_{n}$ ne sont pas indépendantes, mais seules les variables voisines sont corrélées : la variance de $Z_{n}$ reste d'ordre $n$, ce qui suffit pour la démonstration du théorème 8.

    **1.** La variable $Y_{n}$ vaut $1$ si $X_{n} = X_{n + 1} = 1$, et $0$ sinon. 
    $$\boxed{Y_{n} \sim \mathcal{B}(p^{2}), \qquad \mathbb{E}(Y_{n}) = p^{2}, \qquad \mathbb{V}(Y_{n}) = p^{2}(1 - p^{2})}$$

    **2.** On a $Y_{i}Y_{i + 1} = X_{i}X_{i + 1}X_{i + 2}$, d'espérance $p^{3}$. Si $j \geqslant i + 2$, $Y_{i}$ et $Y_{j}$ sont fonctions de variables disjointes, donc indépendantes (lemme des coalitions). 
    $$\boxed{\operatorname{Cov}(Y_{i}, Y_{i + 1}) = p^{3} - p^{4}, \qquad \operatorname{Cov}(Y_{i}, Y_{j}) = 0 \ (j \geqslant i + 2)}$$

    $$\boxed{\mathbb{V}(Z_{n}) = np^{2}(1 - p^{2}) + 2(n - 1)(p^{3} - p^{4})}$$

    **3.** Par l'inégalité de Bienaymé-Tchebychev, avec $\mathbb{E}(\frac{Z_{n}}{n}) = p^{2}$, 
    $$\mathbb{P}\Big(\Big|\frac{Z_{n}}{n} - p^{2}\Big| \geqslant \varepsilon\Big) \leqslant \frac{\mathbb{V}(Z_{n})}{n^{2}\varepsilon^{2}} \leqslant \frac{p^{2}(1 - p^{2}) + 2p^{3}(1 - p)}{n\varepsilon^{2}}, \qquad \boxed{\mathbb{P}\Big(\Big|\frac{Z_{n}}{n} - p^{2}\Big| \geqslant \varepsilon\Big) \xrightarrow[n \to +\infty]{} 0}$$
     La fréquence des « doubles succès » consécutifs tend vers $p^{2}$.
