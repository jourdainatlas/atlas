  enonce: |
    Soit $U$ et $V$ deux variables aléatoires indépendantes de loi $\mathcal{B}(2, \frac{1}{2})$. On pose $S = (U - 1)^{2} + (V - 1)^{2}$ et $T = (U - 1)(V - 1)$.

    **1.** Déterminer la loi de $S$ et son écart type.

    **2.** Déterminer la loi de $T$, puis calculer $\mathbb{E}(ST)$ et $\operatorname{Cov}(S, T)$.

    **3.** Les variables $S$ et $T$ sont-elles indépendantes ?
  corrige: |
    C'est l'exemple type de deux variables décorrélées mais non indépendantes : une covariance nulle ne dit rien de plus qu'une relation entre espérances.

    **1.** La variable $(U - 1)^{2}$ vaut $1$ si $U \in \{0, 2\}$, de probabilité $\frac{1}{4} + \frac{1}{4}$, et $0$ sinon : elle suit la loi $\mathcal{B}(\frac{1}{2})$. Les deux termes de $S$ sont indépendants (lemme des coalitions). 
    $$\boxed{S \sim \mathcal{B}(2, \tfrac{1}{2}), \qquad \sigma(S) = \sqrt{2 \times \tfrac{1}{2} \times \tfrac{1}{2}} = \frac{\sqrt{2}}{2}}$$

    **2.** Les variables $U - 1$ et $V - 1$ valent $-1$, $0$, $1$ avec les probabilités $\frac{1}{4}$, $\frac{1}{2}$, $\frac{1}{4}$. Le produit $T$ est non nul si et seulement si les deux facteurs le sont, et vaut alors $1$ ou $-1$ selon que leurs signes sont égaux ou non. 
    $$\boxed{\mathbb{P}(T = -1) = \mathbb{P}(T = 1) = \frac{1}{8}, \qquad \mathbb{P}(T = 0) = \frac{3}{4}}$$
     Lorsque $T \neq 0$, on a $S = 2$ ; donc $ST = 2T$, et $\mathbb{E}(ST) = 2\,\mathbb{E}(T) = 0$. Comme $\mathbb{E}(T) = 0$ : 
    $$\boxed{\mathbb{E}(ST) = 0, \qquad \operatorname{Cov}(S, T) = \mathbb{E}(ST) - \mathbb{E}(S)\mathbb{E}(T) = 0}$$

    **3.** On a $\mathbb{P}(S = 0, T = 1) = 0$, alors que $\mathbb{P}(S = 0)\mathbb{P}(T = 1) = \frac{1}{4} \times \frac{1}{8} \neq 0$. 
    $$\boxed{S \text{ et } T \text{ ne sont pas indépendantes}}$$
- id: "mp-15-17"
