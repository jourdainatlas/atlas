  source: "BibM@th, Variables aléatoires discrètes, exercice 19"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *Une politique de natalité.* Dans un pays, chaque naissance donne un garçon avec la probabilité $\frac{1}{2}$, indépendamment des autres. Chaque couple a des enfants jusqu'à la naissance d'un garçon, puis s'arrête. On considère $N$ couples, dont les nombres d'enfants $X_{1}$, …, $X_{N}$ sont indépendants.

    **1.** Donner la loi de $X_{1}$, son espérance et sa variance.

    **2.** Exprimer la proportion $R_{N}$ de garçons parmi les enfants de ces $N$ couples à l'aide des $X_{i}$.

    **3.** Montrer que, pour tout $\varepsilon > 0$, $\mathbb{P}\Big(\Big|\dfrac{X_{1} + \cdots + X_{N}}{N} - 2\Big| \geqslant \varepsilon\Big) \to 0$, puis que $\mathbb{P}\Big(\Big|R_{N} - \dfrac{1}{2}\Big| \geqslant \varepsilon\Big) \to 0$ quand $N \to +\infty$. Cette politique modifie-t-elle la proportion de garçons ?
  corrige: |
    Chaque couple a exactement un garçon ; la proportion de garçons est donc l'inverse du nombre moyen d'enfants par couple, qui tend vers $2$ par la loi faible des grands nombres.

    **1.** La variable $X_{1}$ est le rang du premier garçon : 
    $$\boxed{X_{1} \sim \mathcal{G}(\tfrac{1}{2}), \qquad \mathbb{E}(X_{1}) = 2, \qquad \mathbb{V}(X_{1}) = 2}$$

    **2.** Il y a $N$ garçons parmi $X_{1} + \cdots + X_{N}$ enfants. 
    $$\boxed{R_{N} = \frac{N}{X_{1} + \cdots + X_{N}}}$$

    **3.** Notons $M_{N} = \frac{X_{1} + \cdots + X_{N}}{N}$. Le théorème 8 donne $\mathbb{P}\big(|M_{N} - 2| \geqslant \eta\big) \leqslant \frac{2}{N\eta^{2}} \to 0$ pour tout $\eta > 0$. Si $|M_{N} - 2| < \eta \leqslant 1$, alors $M_{N} > 1$ et 
    $$\Big|R_{N} - \frac{1}{2}\Big| = \frac{|2 - M_{N}|}{2M_{N}} < \frac{\eta}{2}.$$
     Avec $\eta = \min(1, 2\varepsilon)$, on obtient $\mathbb{P}\big(|R_{N} - \frac{1}{2}| \geqslant \varepsilon\big) \leqslant \mathbb{P}\big(|M_{N} - 2| \geqslant \eta\big)$. 
    $$\boxed{\mathbb{P}\Big(\Big|R_{N} - \frac{1}{2}\Big| \geqslant \varepsilon\Big) \xrightarrow[N \to +\infty]{} 0}$$
     La politique ne modifie pas la proportion de garçons : chaque naissance reste un pile ou face équilibré, et l'arrêt choisi par les familles ne peut pas changer la fréquence des résultats. Elle ne fait que modifier la composition des familles.
- id: "mp-15-28"
  feuille: "f-mp-15"
  numero: 28
  partie: "Inégalités probabilistes et loi faible des grands nombres"
