  page_corrige: 2
  enonce: |
    Soit $n \in \mathbb{N}^{*}$, $p \in ]0, 1[$ et $X$ une variable aléatoire de loi $\mathcal{B}(n, p)$. Calculer $\mathbb{E}\Big(\dfrac{1}{X + 1}\Big)$.
  corrige: |
    La formule de transfert ramène le calcul à une somme binomiale, que l'on reconnaît grâce à l'identité $\frac{1}{k + 1}\binom{n}{k} = \frac{1}{n + 1}\binom{n + 1}{k + 1}$.

    Par transfert, puis par la formule du binôme appliquée à $(p + q)^{n + 1}$, dont il manque le terme d'indice $0$ : 
    $$\mathbb{E}\Big(\frac{1}{X + 1}\Big) = \sum_{k = 0}^{n} \frac{1}{k + 1}\binom{n}{k}p^{k}q^{n - k} = \frac{1}{(n + 1)p}\sum_{j = 1}^{n + 1} \binom{n + 1}{j}p^{j}q^{n + 1 - j} = \frac{1 - q^{n + 1}}{(n + 1)p}.$$

    $$\boxed{\mathbb{E}\Big(\frac{1}{X + 1}\Big) = \frac{1 - q^{n + 1}}{(n + 1)p}}$$
     *Piège.* L'erreur la plus répandue est d'écrire $\mathbb{E}\big(\frac{1}{X + 1}\big) = \frac{1}{\mathbb{E}(X) + 1} = \frac{1}{np + 1}$ : l'espérance ne commute pas avec une fonction non affine. Pour $n = 7$ et $p = 0{,}3$, on trouve $0{,}393$, contre $0{,}323$.
