  page_corrige: 2
  enonce: |
    Soit $X$ et $Y$ deux variables aléatoires indépendantes, de même loi, à valeurs strictement positives. Montrer que $\mathbb{E}\Big(\dfrac{X}{Y}\Big) \geqslant 1$, l'espérance pouvant être infinie. On pourra comparer $\dfrac{X}{Y}$ et $\dfrac{Y}{X}$.
  corrige: |
    Par symétrie, $\frac{X}{Y}$ et $\frac{Y}{X}$ ont la même loi, et leur somme est toujours au moins égale à $2$.

    Les couples $(X, Y)$ et $(Y, X)$ ont la même loi, puisque $X$ et $Y$ sont indépendantes et de même loi (théorème 6 du chapitre 14) ; donc $\frac{X}{Y}$ et $\frac{Y}{X}$ ont la même loi, et la même espérance dans $[0, +\infty]$. Si cette espérance est infinie, il n'y a rien à démontrer. Sinon, la linéarité donne 
    $$2\,\mathbb{E}\Big(\frac{X}{Y}\Big) = \mathbb{E}\Big(\frac{X}{Y} + \frac{Y}{X}\Big) \geqslant 2,$$
     puisque $u + \frac{1}{u} \geqslant 2$ pour tout $u > 0$, ce qui équivaut à $(u - 1)^{2} \geqslant 0$. 
    $$\boxed{\mathbb{E}\Big(\frac{X}{Y}\Big) \geqslant 1}$$
     *Piège.* On ne peut pas écrire $\mathbb{E}\big(\frac{X}{Y}\big) = \frac{\mathbb{E}(X)}{\mathbb{E}(Y)} = 1$ : par indépendance, $\mathbb{E}\big(\frac{X}{Y}\big) = \mathbb{E}(X)\,\mathbb{E}\big(\frac{1}{Y}\big)$, et $\mathbb{E}\big(\frac{1}{Y}\big) \geqslant \frac{1}{\mathbb{E}(Y)}$ par l'inégalité de Jensen (exercice 25), avec égalité seulement si $Y$ est presque sûrement constante.
- id: "mp-15-05"
  feuille: "f-mp-15"
