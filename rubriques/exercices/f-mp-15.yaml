  enonce: |
    *Transformée de Laplace.* Soit $X$ une variable aléatoire réelle discrète. Sous réserve d'existence, on pose $L_{X}(t) = \mathbb{E}\big(\mathrm{e}^{tX}\big)$.

    **1.** Calculer $L_{X}$ lorsque $X \sim \mathcal{P}(\lambda)$, et lorsque $X \sim \mathcal{G}(p)$, en précisant le domaine de définition.

    **2.** On suppose que $L_{X}$ est définie sur un intervalle $]-a, a[$, avec $a > 0$. Montrer que $X$ admet des moments de tout ordre, que $L_{X}$ est de classe $\mathcal{C}^{\infty}$ sur $]-a, a[$, et que $\mathbb{E}(X^{n}) = L_{X}^{(n)}(0)$ pour tout $n \in \mathbb{N}$.

    **3.** Montrer que si $X$ et $Y$ sont indépendantes et si $L_{X}$ et $L_{Y}$ sont définies sur $]-a, a[$, alors $L_{X + Y} = L_{X}L_{Y}$ sur cet intervalle. Retrouver ainsi la variance d'une variable de loi $\mathcal{B}(n, p)$.
  corrige: |
    La transformée de Laplace joue, pour une variable réelle quelconque, le rôle de la fonction génératrice en $\mathrm{e}^{t}$ ; ses dérivées en $0$ sont les moments.

    **1.** Par transfert : $L_{X}(t) = \exp\big(\lambda(\mathrm{e}^{t} - 1)\big)$ pour tout $t$ si $X \sim \mathcal{P}(\lambda)$, et $L_{X}(t) = \sum_{k \geqslant 1} pq^{k - 1}\mathrm{e}^{tk}$, qui converge si et seulement si $q\mathrm{e}^{t} < 1$, si $X \sim \mathcal{G}(p)$. 
    $$\boxed{L_{\mathcal{P}(\lambda)}(t) = \mathrm{e}^{\lambda(\mathrm{e}^{t} - 1)} \ (t \in \mathbb{R}), \qquad L_{\mathcal{G}(p)}(t) = \frac{p\,\mathrm{e}^{t}}{1 - q\,\mathrm{e}^{t}} \ \Big(t < \ln\frac{1}{q}\Big)}$$

    **2.** Soit $0 < b < s < a$. Comme $\mathrm{e}^{s|x|} \leqslant \mathrm{e}^{sx} + \mathrm{e}^{-sx}$, la famille $\big(\mathrm{e}^{s|x|}\mathbb{P}(X = x)\big)$ est sommable. Pour $n \in \mathbb{N}$, la fonction $u \mapsto u^{n}\mathrm{e}^{-(s - b)u}$ est bornée sur $\mathbb{R}_{+}$ par une constante $C_{n}$, d'où, pour $|t| \leqslant b$, 
    $$\big|x^{n}\mathrm{e}^{tx}\big| \leqslant |x|^{n}\mathrm{e}^{b|x|} \leqslant C_{n}\,\mathrm{e}^{s|x|}.$$
     En énumérant les valeurs de $X$, la série de fonctions $t \mapsto \sum_{x} \mathrm{e}^{tx}\mathbb{P}(X = x)$ et toutes ses séries dérivées convergent normalement sur $[-b, b]$ : $L_{X}$ est de classe $\mathcal{C}^{\infty}$ sur $]-a, a[$ (chapitre 8), avec $L_{X}^{(n)}(t) = \sum_{x} x^{n}\mathrm{e}^{tx}\mathbb{P}(X = x)$. Le cas $t = 0$ donne l'existence des moments et leur valeur. 
    $$\boxed{\mathbb{E}(X^{n}) = L_{X}^{(n)}(0)}$$

    **3.** Les variables positives $\mathrm{e}^{tX}$ et $\mathrm{e}^{tY}$ sont indépendantes et d'espérance finie, et le théorème 3 donne $L_{X + Y}(t) = L_{X}(t)L_{Y}(t)$. Pour $X \sim \mathcal{B}(n, p)$, somme de $n$ variables de Bernoulli indépendantes, $L_{X}(t) = (q + p\,\mathrm{e}^{t})^{n}$, d'où $L_{X}'(0) = np$ et $L_{X}''(0) = n(n - 1)p^{2} + np$. 
    $$\boxed{\mathbb{V}(X) = n(n - 1)p^{2} + np - n^{2}p^{2} = np(1 - p)}$$
- id: "mp-15-41"
  feuille: "f-mp-15"
  numero: 41
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, espérance, variance, fonction génératrice, indépendance]
  noeuds: [p-esperance, p-variables, cx-series-entieres, p-independance]
  notions: [esperance, variance, independance]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Les variables aléatoires sont discrètes.

    **1.** Si $X$ est à valeurs dans $[0, +\infty]$ et $\mathbb{E}(X) < +\infty$, alors $\mathbb{P}(X = +\infty) = 0$.

    **2.** Toute variable aléatoire réelle d'espérance finie admet une variance.

    **3.** Si $X$ et $Y$ sont indépendantes et de carré d'espérance finie, alors $\mathbb{V}(X + Y) = \mathbb{V}(X) + \mathbb{V}(Y)$.

    **4.** Si $\mathbb{E}(XY) = \mathbb{E}(X)\,\mathbb{E}(Y)$, alors $X$ et $Y$ sont indépendantes.

    **5.** Si $X$ est à valeurs dans $\mathbb{N}$, alors $\mathbb{E}(X) = \displaystyle\sum_{n = 0}^{+\infty} \mathbb{P}(X > n)$, dans $[0, +\infty]$.

    **6.** Si $X$ est à valeurs dans $\mathbb{N}$, alors $G_{2X} = G_{X}^{2}$.

    **7.** Si $G_{X}$ et $G_{Y}$ coïncident sur $\big[0, \frac{1}{2}\big]$, alors $X$ et $Y$ ont la même loi.

    **8.** Une variable aléatoire réelle bornée admet des moments de tout ordre.

    **9.** La fonction génératrice d'une variable de loi $\mathcal{G}(p)$ est définie sur $\mathbb{R}$ tout entier.

    **10.** Si $X$ est positive et $\mathbb{E}(X) = 1$, alors $\mathbb{P}(X \geqslant 2) \leqslant \frac{1}{2}$.
  corrige: |
    Six affirmations sont vraies (1, 3, 5, 7, 8, 10) et quatre sont fausses (2, 4, 6, 9).

    **1. Vrai.** Si $\mathbb{P}(X = +\infty) > 0$, le terme $(+\infty) \times \mathbb{P}(X = +\infty)$ rend l'espérance infinie.

    **2. Faux.** Si $\mathbb{P}(X = n) = \frac{1}{\zeta(3)n^{3}}$ pour $n \geqslant 1$, alors $\mathbb{E}(X) = \frac{\zeta(2)}{\zeta(3)}$ est fini, mais $\mathbb{E}(X^{2}) = +\infty$, puisque $\sum \frac{1}{n}$ diverge (voir aussi l'exercice 1).

    **3. Vrai.** Des variables indépendantes sont décorrélées (proposition 7), et le théorème 5 conclut.

    **4. Faux.** Si $X$ suit la loi uniforme sur $\{-1, 0, 1\}$ et $Y = X^{2}$, alors $\mathbb{E}(XY) = 0 = \mathbb{E}(X)\mathbb{E}(Y)$, mais $X$ et $Y$ ne sont pas indépendantes (proposition 7).

    **5. Vrai.** C'est la proposition 1, puisque $\mathbb{P}(X > n) = \mathbb{P}(X \geqslant n + 1)$.

    **6. Faux.** On a $G_{2X}(t) = \mathbb{E}(t^{2X}) = G_{X}(t^{2})$. Pour $X \sim \mathcal{B}(\frac{1}{2})$, $G_{X}(t^{2}) = \frac{1 + t^{2}}{2}$, alors que $G_{X}(t)^{2} = \frac{(1 + t)^{2}}{4}$ ; l'égalité $G_{X + Y} = G_{X}G_{Y}$ demande l'indépendance, et $X$ n'est pas indépendante d'elle-même.

    **7. Vrai.** C'est le théorème 9 : les coefficients d'une série entière sont déterminés par sa somme sur un intervalle $]0, r[$.

    **8. Vrai.** Si $|X| \leqslant M$, alors $|X^{k}| \leqslant M^{k}$, et la domination (théorème 2 (iv)) s'applique.

    **9. Faux.** Le rayon de convergence de $\sum pq^{k - 1}t^{k}$ est $\frac{1}{q}$, fini ; la série diverge grossièrement pour $t \geqslant \frac{1}{q}$.

    **10. Vrai.** C'est l'inégalité de Markov : $\mathbb{P}(X \geqslant 2) \leqslant \frac{\mathbb{E}(X)}{2}$.
- id: "mp-15-42"
  feuille: "f-mp-15"
