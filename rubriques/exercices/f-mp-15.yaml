  enonce: |
    *Perspective : l'extinction des familles.* Chaque individu d'une population a un nombre aléatoire d'enfants, de même loi qu'une variable $\xi$ à valeurs dans $\mathbb{N}$, indépendamment des autres. On note $G = G_{\xi}$, on suppose que $m = \mathbb{E}(\xi)$ est fini et que $0 < \mathbb{P}(\xi = 0) < 1$. On part d'un ancêtre, $Z_{0} = 1$, et $Z_{n}$ désigne la taille de la $n$-ième génération : $Z_{n + 1}$ est la somme de $Z_{n}$ variables indépendantes de même loi que $\xi$, indépendantes de $Z_{n}$.

    **1.** À l'aide de la proposition 12 du cours, montrer que $G_{Z_{n}} = G \circ \cdots \circ G$, composée $n$ fois, et que $\mathbb{E}(Z_{n}) = m^{n}$.

    **2.** On pose $x_{n} = \mathbb{P}(Z_{n} = 0)$. Montrer que $x_{n + 1} = G(x_{n})$, que $(x_{n})$ est croissante, et que sa limite $x$ est la probabilité de l'événement « la famille s'éteint ».

    **3.** Montrer que $x$ est le plus petit point fixe de $G$ sur $[0, 1]$.

    **4.** On suppose $m \leqslant 1$ et $\mathbb{P}(\xi = 1) < 1$. En étudiant la fonction $t \mapsto G(t) - t$, dont on montrera qu'elle est convexe sur $[0, 1]$, montrer que $x = 1$. Si $m < 1$, montrer de plus que $\mathbb{P}(Z_{n} \neq 0) \leqslant m^{n}$.

    **5.** On suppose $m > 1$. Montrer que $G$ a un unique point fixe dans $[0, 1[$, et que $x < 1$.

    **6.** On suppose que $\xi$ suit la loi $\mathcal{B}(2, p)$. Calculer la probabilité d'extinction en fonction de $p$, et la valeur obtenue pour $p = \frac{3}{4}$.
  corrige: |
    Toute l'étude repose sur la proposition 12 et sur la convexité de $G$ : la probabilité d'extinction est le plus petit point fixe de $G$, et la position de la tangente en $1$, de pente $m$, décide s'il est égal à $1$.

    **1.** La proposition 12, appliquée avec $N = Z_{n}$ et des variables de même loi que $\xi$, donne 
    $$G_{Z_{n + 1}} = G_{Z_{n}} \circ G, \qquad \mathbb{E}(Z_{n + 1}) = \mathbb{E}(Z_{n})\,m.$$
     Par récurrence, avec $G_{Z_{0}}(t) = t$ : 
    $$\boxed{G_{Z_{n}} = \underbrace{G \circ \cdots \circ G}_{n \text{ fois}}, \qquad \mathbb{E}(Z_{n}) = m^{n}}$$

    **2.** On a $x_{n} = G_{Z_{n}}(0)$, d'où $x_{n + 1} = G(x_{n})$. Si $Z_{n} = 0$, alors $Z_{n + 1} = 0$ : la suite d'événements $(Z_{n} = 0)$ est croissante, et sa réunion est l'événement « la famille s'éteint ». La continuité croissante donne : 
    $$\boxed{x_{n + 1} = G(x_{n}), \qquad x_{n} \uparrow x = \mathbb{P}(\text{extinction})}$$

    **3.** La fonction $G$ est continue sur $[0, 1]$, donc $x = G(x)$. Elle est croissante sur $[0, 1]$, ses coefficients étant positifs. Si $y \in [0, 1]$ vérifie $G(y) = y$, alors $x_{0} = 0 \leqslant y$, et si $x_{n} \leqslant y$, alors $x_{n + 1} = G(x_{n}) \leqslant G(y) = y$. Par récurrence et passage à la limite : 
    $$\boxed{x = \min\{y \in [0, 1] \mid G(y) = y\}}$$

    **4.** La fonction $G$ est de classe $\mathcal{C}^{1}$ sur $[0, 1]$, puisque $\xi$ est d'espérance finie (théorème 10 et remarque qui suit), et de classe $\mathcal{C}^{2}$ sur $[0, 1[$, avec $G'' \geqslant 0$ : $\varphi : t \mapsto G(t) - t$ est convexe sur $[0, 1]$. Cas $\mathbb{P}(\xi \geqslant 2) = 0$. Alors $G(t) = \mathbb{P}(\xi = 0) + \mathbb{P}(\xi = 1)t$, et $\varphi(t) = \mathbb{P}(\xi = 0)(1 - t) > 0$ pour $t < 1$. Cas $\mathbb{P}(\xi \geqslant 2) > 0$. Alors $G'' > 0$ sur $]0, 1[$, $G'$ est strictement croissante, et $G'(t) < G'(1) = m \leqslant 1$ pour $t < 1$ : $\varphi$ est strictement décroissante sur $[0, 1]$, et $\varphi(1) = 0$, donc $\varphi > 0$ sur $[0, 1[$. Dans les deux cas, $1$ est le seul point fixe de $G$ dans $[0, 1]$. Si $m < 1$, l'inégalité de Markov donne $\mathbb{P}(Z_{n} \neq 0) = \mathbb{P}(Z_{n} \geqslant 1) \leqslant \mathbb{E}(Z_{n})$. 
    $$\boxed{m \leqslant 1 \Longrightarrow x = 1, \qquad m < 1 \Longrightarrow \mathbb{P}(Z_{n} \neq 0) \leqslant m^{n}}$$

    **5.** On a $\varphi(0) = \mathbb{P}(\xi = 0) > 0$, $\varphi(1) = 0$ et $\varphi'(1) = m - 1 > 0$ ; donc $\varphi < 0$ sur un intervalle $]1 - \eta, 1[$, et le théorème des valeurs intermédiaires donne un zéro dans $]0, 1[$. Comme $m > 1$, $\mathbb{P}(\xi \geqslant 2) > 0$ et $\varphi$ est strictement convexe : elle a au plus deux zéros, dont $1$. 
    $$\boxed{m > 1 \Longrightarrow G \text{ a un unique point fixe } x \in ]0, 1[, \text{ et } \mathbb{P}(\text{extinction}) = x < 1}$$

    **6.** Avec $G(t) = (q + pt)^{2}$ et $m = 2p$, l'équation $(q + pt)^{2} = t$ s'écrit $p^{2}t^{2} + (2pq - 1)t + q^{2} = 0$ ; elle a pour racine $1$, et le produit des racines vaut $\frac{q^{2}}{p^{2}}$. 
    $$\boxed{\mathbb{P}(\text{extinction}) = 1 \ \text{ si } p \leqslant \tfrac{1}{2}, \qquad \mathbb{P}(\text{extinction}) = \Big(\frac{q}{p}\Big)^{2} \ \text{ si } p > \tfrac{1}{2}}$$
     Pour $p = \frac{3}{4}$, la probabilité d'extinction vaut $\frac{1}{9}$. Même dans le cas favorable, où chaque génération est en moyenne une fois et demie plus nombreuse que la précédente, la lignée s'éteint avec une probabilité non négligeable, presque toujours dès les premières générations.
