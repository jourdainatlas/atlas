  enonce: |
    *L'inégalité de Jensen.* Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable, de dérivée croissante, et $X$ une variable aléatoire réelle telle que $X$ et $f(X)$ soient d'espérance finie.

    **1.** Montrer que, pour tout réel $x$, $f(x) \geqslant f\big(\mathbb{E}(X)\big) + f'\big(\mathbb{E}(X)\big)\big(x - \mathbb{E}(X)\big)$.

    **2.** En déduire que $\mathbb{E}\big(f(X)\big) \geqslant f\big(\mathbb{E}(X)\big)$. Que retrouve-t-on pour $f : x \mapsto x^{2}$ ?

    **3.** Application : montrer que si $X$ est à valeurs dans $\mathbb{R}_{+}^{*}$ et d'espérance finie, alors $\mathbb{E}\big(\mathrm{e}^{-X}\big) \geqslant \mathrm{e}^{-\mathbb{E}(X)}$.
  corrige: |
    Une fonction convexe est au-dessus de ses tangentes ; on applique cette inégalité à $X$, puis on prend l'espérance.

    **1.** Soit $a = \mathbb{E}(X)$ et $x \neq a$. L'égalité des accroissements finis donne $c$ strictement compris entre $a$ et $x$ tel que $f(x) - f(a) = f'(c)(x - a)$. Si $x > a$, alors $f'(c) \geqslant f'(a)$ et $x - a > 0$ ; si $x < a$, alors $f'(c) \leqslant f'(a)$ et $x - a < 0$. Dans les deux cas $f'(c)(x - a) \geqslant f'(a)(x - a)$. 
    $$\boxed{f(x) \geqslant f\big(\mathbb{E}(X)\big) + f'\big(\mathbb{E}(X)\big)\big(x - \mathbb{E}(X)\big)}$$

    **2.** On applique l'inégalité à $x = X(\omega)$, puis on prend l'espérance : par croissance et linéarité, le terme $f'(a)\big(\mathbb{E}(X) - a\big)$ est nul. 
    $$\boxed{\mathbb{E}\big(f(X)\big) \geqslant f\big(\mathbb{E}(X)\big)}$$
     Pour $f(x) = x^{2}$, on retrouve $\mathbb{E}(X^{2}) \geqslant \mathbb{E}(X)^{2}$, c'est-à-dire $\mathbb{V}(X) \geqslant 0$.

    **3.** La fonction $x \mapsto \mathrm{e}^{-x}$ a pour dérivée $x \mapsto -\mathrm{e}^{-x}$, croissante, et $\mathrm{e}^{-X}$ est bornée par $1$, donc d'espérance finie. 
    $$\boxed{\mathbb{E}\big(\mathrm{e}^{-X}\big) \geqslant \mathrm{e}^{-\mathbb{E}(X)}}$$
