  enonce: |
    **1.** Soit $X$ une variable aléatoire réelle de $L^{2}$. Montrer que $\mathbb{E}\big(|X - \mathbb{E}(X)|\big) \leqslant \sigma(X)$.

    **2.** Soit $X \sim \mathcal{B}(n, p)$. En déduire, à l'aide de l'inégalité de Markov, que pour tout $\varepsilon > 0$, 
    $$\mathbb{P}\Big(\Big|\frac{X}{n} - p\Big| \geqslant \varepsilon\Big) \leqslant \frac{\sqrt{p(1 - p)}}{\varepsilon\sqrt{n}},$$
     et comparer avec la majoration donnée par l'inégalité de Bienaymé-Tchebychev.
  corrige: |
    L'écart absolu moyen est majoré par l'écart type ; l'inégalité de Markov appliquée à $|X - \mathbb{E}(X)|$ donne alors une majoration en $\frac{1}{\sqrt{n}}$, moins bonne que celle de Bienaymé-Tchebychev.

    **1.** L'inégalité de Cauchy-Schwarz, appliquée à $|X - \mathbb{E}(X)|$ et à la constante $1$, donne 
    $$\mathbb{E}\big(|X - \mathbb{E}(X)|\big)^{2} \leqslant \mathbb{E}\big((X - \mathbb{E}(X))^{2}\big).$$

    $$\boxed{\mathbb{E}\big(|X - \mathbb{E}(X)|\big) \leqslant \sigma(X)}$$

    **2.** L'inégalité de Markov appliquée à $|X - np|$ et la question 1 donnent 
    $$\mathbb{P}\big(|X - np| \geqslant n\varepsilon\big) \leqslant \frac{\mathbb{E}(|X - np|)}{n\varepsilon} \leqslant \frac{\sqrt{np(1 - p)}}{n\varepsilon}, \qquad \boxed{\mathbb{P}\Big(\Big|\frac{X}{n} - p\Big| \geqslant \varepsilon\Big) \leqslant \frac{\sqrt{p(1 - p)}}{\varepsilon\sqrt{n}}}$$
     L'inégalité de Bienaymé-Tchebychev donne la majoration $\frac{p(1 - p)}{n\varepsilon^{2}}$, qui est le carré de la précédente : elle est meilleure dès que les majorations sont inférieures à $1$, c'est-à-dire dès qu'elles ont un intérêt.
