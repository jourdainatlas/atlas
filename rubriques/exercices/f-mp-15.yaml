  page_corrige: 16
  enonce: |
    *L'inégalité de Hoeffding.*

    **1.** Soit $X$ une variable aléatoire centrée telle que $|X| \leqslant 1$.

    **(a)** Montrer que, pour tous $t \in \mathbb{R}$ et $x \in [-1, 1]$, $\mathrm{e}^{tx} \leqslant \dfrac{1 + x}{2}\,\mathrm{e}^{t} + \dfrac{1 - x}{2}\,\mathrm{e}^{-t}$.

    **(b)** En déduire que $\mathbb{E}\big(\mathrm{e}^{tX}\big) \leqslant \operatorname{ch} t \leqslant \mathrm{e}^{t^{2}/2}$ pour tout $t \in \mathbb{R}$.

    **2.** Soit $X_{1}$, …, $X_{n}$ des variables centrées, mutuellement indépendantes, et $c_{1}$, …, $c_{n} > 0$ tels que $|X_{k}| \leqslant c_{k}$. On pose $S_{n} = X_{1} + \cdots + X_{n}$ et $C = c_{1}^{2} + \cdots + c_{n}^{2}$.

    **(a)** Montrer que $\mathbb{E}\big(\mathrm{e}^{tS_{n}}\big) \leqslant \exp\Big(\dfrac{Ct^{2}}{2}\Big)$ pour tout $t \in \mathbb{R}$.

    **(b)** En déduire que, pour tout $\varepsilon > 0$, $\mathbb{P}(S_{n} \geqslant \varepsilon) \leqslant \exp\Big(-\dfrac{\varepsilon^{2}}{2C}\Big)$, puis majorer $\mathbb{P}\big(|S_{n}| \geqslant \varepsilon\big)$.

    **3.** On lance $n$ fois une pièce équilibrée, et l'on note $F_{n}$ la fréquence des piles. Majorer $\mathbb{P}\big(|F_{n} - \frac{1}{2}| \geqslant \varepsilon\big)$, et comparer avec l'inégalité de Bienaymé-Tchebychev pour $n = 10\,000$ et $\varepsilon = 0{,}02$.
  corrige: |
    La convexité de l'exponentielle majore la transformée de Laplace d'une variable centrée bornée par celle d'une variable uniforme sur $\{-1, 1\}$ ; l'indépendance transforme la somme en produit.

    **1.** (a) Pour $x \in [-1, 1]$, $tx = \frac{1 + x}{2}\,t + \frac{1 - x}{2}\,(-t)$ est une combinaison convexe de $t$ et $-t$, et l'exponentielle est convexe : 
    $$\boxed{\mathrm{e}^{tx} \leqslant \frac{1 + x}{2}\,\mathrm{e}^{t} + \frac{1 - x}{2}\,\mathrm{e}^{-t}}$$
     (b) On applique l'inégalité à $x = X(\omega)$, puis on prend l'espérance ; comme $X$ est centrée, il reste $\frac{\mathrm{e}^{t} + \mathrm{e}^{-t}}{2} = \operatorname{ch} t$. Enfin $(2k)! \geqslant 2^{k}k!$, d'où 
    $$\operatorname{ch} t = \sum_{k = 0}^{+\infty} \frac{t^{2k}}{(2k)!} \leqslant \sum_{k = 0}^{+\infty} \frac{(t^{2}/2)^{k}}{k!}.$$

    $$\boxed{\mathbb{E}\big(\mathrm{e}^{tX}\big) \leqslant \operatorname{ch} t \leqslant \mathrm{e}^{t^{2}/2}}$$

    **2.** (a) La variable $\frac{X_{k}}{c_{k}}$ vérifie les hypothèses de la question 1, d'où $\mathbb{E}(\mathrm{e}^{tX_{k}}) \leqslant \mathrm{e}^{c_{k}^{2}t^{2}/2}$. Les $\mathrm{e}^{tX_{k}}$ sont indépendantes et bornées, et le théorème 3 donne 
    $$\boxed{\mathbb{E}\big(\mathrm{e}^{tS_{n}}\big) = \prod_{k = 1}^{n} \mathbb{E}\big(\mathrm{e}^{tX_{k}}\big) \leqslant \exp\Big(\frac{Ct^{2}}{2}\Big)}$$
     (b) La proposition 8 donne $\mathbb{P}(S_{n} \geqslant \varepsilon) \leqslant \exp\big(-t\varepsilon + \frac{Ct^{2}}{2}\big)$ pour tout $t > 0$ ; le minimum est atteint en $t = \frac{\varepsilon}{C}$. En appliquant le résultat à $-S_{n}$ : 
    $$\boxed{\mathbb{P}(S_{n} \geqslant \varepsilon) \leqslant \exp\Big(-\frac{\varepsilon^{2}}{2C}\Big), \qquad \mathbb{P}\big(|S_{n}| \geqslant \varepsilon\big) \leqslant 2\exp\Big(-\frac{\varepsilon^{2}}{2C}\Big)}$$

    **3.** Avec $X_{k} = 2B_{k} - 1$, où $B_{k}$ indique un pile, on a $c_{k} = 1$, $C = n$ et $S_{n} = 2nF_{n} - n$ ; l'événement $\big(|F_{n} - \frac{1}{2}| \geqslant \varepsilon\big)$ est $\big(|S_{n}| \geqslant 2n\varepsilon\big)$. 
    $$\boxed{\mathbb{P}\Big(\Big|F_{n} - \frac{1}{2}\Big| \geqslant \varepsilon\Big) \leqslant 2\,\mathrm{e}^{-2n\varepsilon^{2}}}$$
     Pour $n = 10\,000$ et $\varepsilon = 0{,}02$, cette borne vaut $2\,\mathrm{e}^{-8} \approx 6{,}7 \cdot 10^{-4}$, alors que l'inégalité de Bienaymé-Tchebychev donne $\frac{1}{4n\varepsilon^{2}} = 0{,}0625$. La probabilité exacte vaut environ $6{,}6 \cdot 10^{-5}$.
- id: "mp-15-31"
