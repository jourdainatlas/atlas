  page_enonce: 8
  page_corrige: 17
  enonce: |
    **1.** Soit $a > 0$ et $k \in \mathbb{R}$. À quelle condition sur $k$ la suite $p_{n} = k\Big(\dfrac{a}{a + 1}\Big)^{n}$, $n \in \mathbb{N}$, est-elle la loi d'une variable aléatoire $X$ à valeurs dans $\mathbb{N}$ ? Calculer alors $G_{X}$, puis $\mathbb{E}(X)$ et $\mathbb{V}(X)$.

    **2.** Soit $\lambda > 0$ et $a \in \mathbb{R}$. On suppose qu'une variable $Y$ à valeurs dans $\mathbb{N}$ vérifie $\mathbb{P}(Y = k) = a\,k^{2}\dfrac{\lambda^{k}}{k!}$ pour tout $k \in \mathbb{N}$. Calculer $G_{Y}$ en écrivant $k^{2} = k(k - 1) + k$, et en déduire $a$, puis $\mathbb{E}(Y)$.
  corrige: |
    On reconnaît une loi géométrique décalée dans la première question ; dans la seconde, les moments factoriels font apparaître l'exponentielle.

    **1.** La raison $r = \frac{a}{a + 1}$ est dans $]0, 1[$, et $\sum_{n} p_{n} = k(a + 1)$ ; il faut $k \geqslant 0$ et $k(a + 1) = 1$. 
    $$\boxed{k = \frac{1}{a + 1}, \qquad G_{X}(t) = \frac{1}{1 + a - at} \ \Big(|t| < \frac{a + 1}{a}\Big)}$$
     Alors $G_{X}'(t) = \frac{a}{(1 + a - at)^{2}}$ et $G_{X}''(t) = \frac{2a^{2}}{(1 + a - at)^{3}}$, d'où $G_{X}'(1) = a$ et $G_{X}''(1) = 2a^{2}$ (théorème 10 et proposition 11). 
    $$\boxed{\mathbb{E}(X) = a, \qquad \mathbb{V}(X) = 2a^{2} + a - a^{2} = a(a + 1)}$$

    **2.** Avec $x = \lambda t$, on a $\sum_{k} k(k - 1)\frac{x^{k}}{k!} = x^{2}\mathrm{e}^{x}$ et $\sum_{k} k\frac{x^{k}}{k!} = x\mathrm{e}^{x}$, d'où 
    $$\boxed{G_{Y}(t) = a\,(\lambda^{2}t^{2} + \lambda t)\,\mathrm{e}^{\lambda t}}$$
     La condition $G_{Y}(1) = 1$ donne $a = \frac{\mathrm{e}^{-\lambda}}{\lambda^{2} + \lambda}$. Ensuite $G_{Y}'(t) = a\big(2\lambda^{2}t + \lambda + \lambda^{3}t^{2} + \lambda^{2}t\big)\mathrm{e}^{\lambda t}$, et 
    $$\boxed{a = \frac{\mathrm{e}^{-\lambda}}{\lambda(\lambda + 1)}, \qquad \mathbb{E}(Y) = G_{Y}'(1) = \frac{\lambda^{3} + 3\lambda^{2} + \lambda}{\lambda^{2} + \lambda} = \frac{\lambda^{2} + 3\lambda + 1}{\lambda + 1}}$$
     La valeur a été vérifiée numériquement pour $\lambda = 1{,}7$.
