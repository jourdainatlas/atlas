  enonce: |
    *De la loi de Poisson à la loi normale.* Pour $\lambda > 0$, soit $X_{\lambda}$ une variable de loi $\mathcal{P}(\lambda)$, et $Z_{\lambda} = \dfrac{X_{\lambda} - \lambda}{\sqrt{\lambda}}$.

    **1.** Vérifier que $Z_{\lambda}$ est centrée et réduite.

    **2.** Calculer $\mathbb{E}\big(\mathrm{e}^{\mathrm{i} tZ_{\lambda}}\big)$ pour $t \in \mathbb{R}$, à l'aide de l'exercice 37.

    **3.** Montrer que $\mathbb{E}\big(\mathrm{e}^{\mathrm{i} tZ_{\lambda}}\big) \to \mathrm{e}^{-t^{2}/2}$ quand $\lambda \to +\infty$, pour tout $t \in \mathbb{R}$.
  corrige: |
    On calcule la fonction caractéristique de la variable centrée réduite à l'aide de celle de la loi de Poisson, puis l'on fait un développement limité de l'exposant.

    **1.** On a $\mathbb{E}(X_{\lambda}) = \mathbb{V}(X_{\lambda}) = \lambda$, et la proposition 5 donne : 
    $$\boxed{\mathbb{E}(Z_{\lambda}) = 0, \qquad \mathbb{V}(Z_{\lambda}) = \frac{\lambda}{\lambda} = 1}$$

    **2.** Avec $u = \frac{t}{\sqrt{\lambda}}$, on a $\mathrm{e}^{\mathrm{i} tZ_{\lambda}} = \mathrm{e}^{-\mathrm{i} t\sqrt{\lambda}}\mathrm{e}^{\mathrm{i} uX_{\lambda}}$, et l'exercice 37 donne 
    $$\boxed{\mathbb{E}\big(\mathrm{e}^{\mathrm{i} tZ_{\lambda}}\big) = \exp\Big(\lambda\big(\mathrm{e}^{\mathrm{i} t/\sqrt{\lambda}} - 1\big) - \mathrm{i} t\sqrt{\lambda}\Big)}$$

    **3.** L'inégalité de Taylor-Lagrange, appliquée aux parties réelle et imaginaire de $u \mapsto \mathrm{e}^{\mathrm{i} u}$, donne $\big|\mathrm{e}^{\mathrm{i} u} - 1 - \mathrm{i} u + \frac{u^{2}}{2}\big| \leqslant \frac{|u|^{3}}{3}$. Avec $u = \frac{t}{\sqrt{\lambda}}$, l'exposant vaut 
    $$\lambda\Big(\mathrm{i} u - \frac{u^{2}}{2} + O(|u|^{3})\Big) - \mathrm{i} t\sqrt{\lambda} = -\frac{t^{2}}{2} + O\Big(\frac{|t|^{3}}{\sqrt{\lambda}}\Big),$$
     et la continuité de l'exponentielle complexe donne 
    $$\boxed{\mathbb{E}\big(\mathrm{e}^{\mathrm{i} tZ_{\lambda}}\big) \xrightarrow[\lambda \to +\infty]{} \mathrm{e}^{-t^{2}/2}}$$
     La limite $\mathrm{e}^{-t^{2}/2}$ est la fonction caractéristique de la loi normale centrée réduite : c'est un cas particulier du théorème central limite, qui dépasse le programme.
