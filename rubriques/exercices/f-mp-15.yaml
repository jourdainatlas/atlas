  page_enonce: 10
  page_corrige: 22
  enonce: |
    *Le temps d'attente d'une série.* On reprend les notations de l'exercice 41 de la feuille du chapitre 14 : $(X_{n})$ est une suite de variables indépendantes de loi $\mathcal{B}(p)$, $r \in \mathbb{N}^{*}$, et $T_{r}$ est le rang où s'achève la première série de $r$ succès consécutifs. On a montré que $T_{r}$ est presque sûrement fini, et que $\mathbb{P}(T_{r} = n + r + 1) = q\,p^{r}\,\mathbb{P}(T_{r} > n)$ pour tout $n \in \mathbb{N}$.

    **1.** Montrer que $\displaystyle\sum_{n = 0}^{+\infty} \mathbb{P}(T_{r} = n + r + 1) = 1 - p^{r}$.

    **2.** En déduire, à l'aide de la proposition 1 du cours, que $T_{r}$ est d'espérance finie et que 
    $$\mathbb{E}(T_{r}) = \frac{1 - p^{r}}{q\,p^{r}}.$$

    **3.** Vérifier le résultat pour $r = 1$, et pour $r = 2$, $p = \frac{1}{2}$ à l'aide de l'exercice 36. Combien faut-il en moyenne de lancers d'une pièce équilibrée pour obtenir dix piles consécutifs ?
  corrige: |
    La relation de l'exercice 41 du chapitre 14, sommée sur $n$, fait apparaître la somme des queues de la loi, c'est-à-dire l'espérance.

    **1.** La variable $T_{r}$ est presque sûrement finie et au moins égale à $r$, et $(T_{r} = r)$ est l'événement « les $r$ premières épreuves sont des succès ». Les événements $(T_{r} = n + r + 1)$, $n \in \mathbb{N}$, sont incompatibles, de réunion $(r + 1 \leqslant T_{r} < +\infty)$ : 
    $$\boxed{\sum_{n = 0}^{+\infty} \mathbb{P}(T_{r} = n + r + 1) = 1 - \mathbb{P}(T_{r} = r) = 1 - p^{r}}$$

    **2.** La relation de l'énoncé donne $qp^{r}\sum_{n \geqslant 0} \mathbb{P}(T_{r} > n) = 1 - p^{r}$, et la proposition 1 identifie la somme des queues à l'espérance. 
    $$\boxed{\mathbb{E}(T_{r}) = \sum_{n = 0}^{+\infty} \mathbb{P}(T_{r} > n) = \frac{1 - p^{r}}{q\,p^{r}}}$$

    **3.** Pour $r = 1$, on trouve $\frac{1 - p}{qp} = \frac{1}{p}$, l'espérance de la loi $\mathcal{G}(p)$. Pour $r = 2$ et $p = \frac{1}{2}$, on trouve $\frac{3/4}{1/8} = 6$, comme à l'exercice 36. Pour dix piles consécutifs avec une pièce équilibrée : 
    $$\boxed{\mathbb{E}(T_{10}) = \frac{1 - 2^{-10}}{2^{-11}} = 2^{11} - 2 = 2046}$$
     L'attente est de l'ordre de $\frac{1}{p^{r}}$, et croît donc exponentiellement avec la longueur de la série cherchée.
- id: "mp-15-43"
  feuille: "f-mp-15"
  numero: 43
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse, loi faible des grands nombres, indépendance]
  noeuds: [p-loi-faible, p-independance, pol-binome]
  notions: [independance, coefficient-binomial]
  source: "Feuille d'exercices #11 (Prost), exercice 44"
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Perspective : une lecture probabiliste des polynômes de Bernstein.* Soit $f : [0, 1] \to \mathbb{R}$ continue, $n \in \mathbb{N}^{*}$ et $x \in [0, 1]$. On considère des variables $X_{1}$, …, $X_{n}$ indépendantes de loi $\mathcal{B}(x)$, et l'on pose $S_{n} = X_{1} + \cdots + X_{n}$ et 
    $$B_{n}(f)(x) = \mathbb{E}\Big(f\Big(\frac{S_{n}}{n}\Big)\Big).$$

    **1.** Montrer que $B_{n}(f)(x) = \displaystyle\sum_{k = 0}^{n} \binom{n}{k}x^{k}(1 - x)^{n - k}f\Big(\frac{k}{n}\Big)$, de sorte que $B_{n}(f)$ est une fonction polynomiale.

    **2.** Montrer que, pour tout $\alpha > 0$, $\mathbb{P}\big(|S_{n} - nx| \geqslant n\alpha\big) \leqslant \dfrac{1}{4n\alpha^{2}}$.

    **3.** Soit $\varepsilon > 0$, et $\alpha > 0$ associé à $\varepsilon$ par l'uniforme continuité de $f$ (théorème de Heine, chapitre 5). En séparant les cas $\big|\frac{S_{n}}{n} - x\big| < \alpha$ et $\big|\frac{S_{n}}{n} - x\big| \geqslant \alpha$, montrer que 
    $$\big|B_{n}(f)(x) - f(x)\big| \leqslant \varepsilon + \frac{2\lVert f \rVert_{\infty}}{4n\alpha^{2}}.$$

    **4.** En déduire que $\big(B_{n}(f)\big)$ converge uniformément vers $f$ sur $[0, 1]$. Comparer avec la démonstration du théorème de Weierstrass donnée au chapitre 8 : quel rôle y joue la loi faible des grands nombres ?
  corrige: |
    La valeur $B_{n}(f)(x)$ est la moyenne de $f$ en la fréquence d'une suite de $n$ épreuves de paramètre $x$ ; la loi faible des grands nombres dit que cette fréquence est proche de $x$, et la continuité uniforme de $f$ fait le reste.

    **1.** La variable $S_{n}$ suit la loi $\mathcal{B}(n, x)$ ; la formule de transfert donne 
    $$\boxed{B_{n}(f)(x) = \sum_{k = 0}^{n} \binom{n}{k}x^{k}(1 - x)^{n - k}f\Big(\frac{k}{n}\Big)}$$
     qui est une fonction polynomiale de $x$, de degré au plus $n$.

    **2.** On a $\mathbb{V}(S_{n}) = nx(1 - x) \leqslant \frac{n}{4}$, et l'inégalité de Bienaymé-Tchebychev donne 
    $$\boxed{\mathbb{P}\big(|S_{n} - nx| \geqslant n\alpha\big) \leqslant \frac{nx(1 - x)}{n^{2}\alpha^{2}} \leqslant \frac{1}{4n\alpha^{2}}}$$

    **3.** Par linéarité et inégalité triangulaire, $|B_{n}(f)(x) - f(x)| \leqslant \mathbb{E}\big(|f(\frac{S_{n}}{n}) - f(x)|\big)$. On sépare selon l'événement $D = \big(|\frac{S_{n}}{n} - x| \geqslant \alpha\big)$ : sur le complémentaire de $D$, $|f(\frac{S_{n}}{n}) - f(x)| \leqslant \varepsilon$ ; sur $D$, cette quantité est au plus $2\lVert f \rVert_{\infty}$. Par croissance de l'espérance : 
    $$\boxed{\big|B_{n}(f)(x) - f(x)\big| \leqslant \varepsilon + 2\lVert f \rVert_{\infty}\,\mathbb{P}(D) \leqslant \varepsilon + \frac{2\lVert f \rVert_{\infty}}{4n\alpha^{2}}}$$

    **4.** La majoration ne dépend pas de $x$ ; pour $n \geqslant \frac{\lVert f \rVert_{\infty}}{2\alpha^{2}\varepsilon}$, elle est inférieure à $2\varepsilon$. 
    $$\boxed{B_{n}(f) \xrightarrow[n \to +\infty]{\ \mathrm{CU}\ } f \text{ sur } [0, 1]}$$
     La démonstration de Bernstein du chapitre 8 repose sur les mêmes calculs : l'identité 
    $$\sum_{k = 0}^{n} \binom{n}{k}x^{k}(1 - x)^{n - k}\Big(\frac{k}{n} - x\Big)^{2} = \frac{x(1 - x)}{n}$$
     y exprime la variance de $\frac{S_{n}}{n}$, et la majoration de la somme sur les $k$ « éloignés » de $nx$ est l'inégalité de Bienaymé-Tchebychev. La loi faible des grands nombres en est le moteur : $\frac{S_{n}}{n}$ se concentre autour de $x$, uniformément en $x$.
