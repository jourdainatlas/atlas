  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Les théorèmes de convergence pour l'espérance.* Soit $X$ une variable aléatoire à valeurs dans $\mathbb{N}$.

    **1.** *Convergence dominée.* Soit $(f_{n})$ une suite de fonctions de $\mathbb{N}$ dans $\mathbb{R}$ qui converge simplement vers $f$. On suppose qu'il existe $h : \mathbb{N} \to \mathbb{R}_{+}$ telle que $h(X)$ soit d'espérance finie et $|f_{n}(k)| \leqslant h(k)$ pour tous $k$ et $n$. Montrer que $f(X)$ est d'espérance finie et que $\mathbb{E}\big(f_{n}(X)\big) \to \mathbb{E}\big(f(X)\big)$. On pourra appliquer le théorème de convergence dominée du chapitre 13 à des fonctions en escalier bien choisies.

    **2.** *Convergence monotone.* Soit $(Y_{n})$ une suite de variables aléatoires à valeurs dans $\mathbb{N}$ telle que, pour tout $\omega$, la suite $\big(Y_{n}(\omega)\big)$ soit croissante et converge vers $Y(\omega) \in \mathbb{N} \cup \{+\infty\}$. Montrer que $\mathbb{E}(Y_{n}) \to \mathbb{E}(Y)$ dans $[0, +\infty]$. On utilisera la proposition 1 du cours.

    **3.** Application : soit $X \sim \mathcal{P}(\lambda)$. Déterminer $\lim\limits_{n \to +\infty} \mathbb{E}\Big(\Big(1 + \dfrac{1}{n}\Big)^{X}\Big)$ et $\lim\limits_{n \to +\infty} \mathbb{E}\big(\min(X, n)^{2}\big)$.
  corrige: |
    Les deux théorèmes se ramènent, l'un au théorème de convergence dominée du chapitre 13, l'autre à la continuité croissante, via la proposition 1.

    **1.** Comme $|f(k)| = \lim |f_{n}(k)| \leqslant h(k)$, la domination (théorème 2 (iv)) montre que $f(X)$ est d'espérance finie. Soit $\varphi_{n}(t) = f_{n}(\lfloor t \rfloor)\,\mathbb{P}(X = \lfloor t \rfloor)$ et $\varphi(t) = f(\lfloor t \rfloor)\,\mathbb{P}(X = \lfloor t \rfloor)$ sur $[0, +\infty[$ : ce sont des fonctions en escalier, $\varphi_{n} \to \varphi$ simplement, et $|\varphi_{n}| \leqslant \psi$, avec $\psi(t) = h(\lfloor t \rfloor)\,\mathbb{P}(X = \lfloor t \rfloor)$, intégrable puisque $\int_{0}^{+\infty} \psi = \mathbb{E}\big(h(X)\big)$. Par transfert, $\int_{0}^{+\infty} \varphi_{n} = \mathbb{E}\big(f_{n}(X)\big)$, et le théorème 1 du chapitre 13 donne : 
    $$\boxed{\mathbb{E}\big(f_{n}(X)\big) \xrightarrow[n \to +\infty]{} \mathbb{E}\big(f(X)\big)}$$

    **2.** Pour $k \in \mathbb{N}$, la suite d'événements $(Y_{n} > k)$ est croissante, de réunion $(Y > k)$ : si $Y(\omega) > k$, alors $Y_{n}(\omega) > k$ à partir d'un certain rang, puisque les $Y_{n}(\omega)$ sont des entiers qui croissent vers $Y(\omega)$. Donc $\mathbb{P}(Y_{n} > k) \uparrow \mathbb{P}(Y > k)$. Par la proposition 1, $\mathbb{E}(Y_{n}) = \sum_{k} \mathbb{P}(Y_{n} > k) \leqslant \mathbb{E}(Y)$, et pour tout $K$, $\liminf \mathbb{E}(Y_{n}) \geqslant \sum_{k \leqslant K} \mathbb{P}(Y > k)$. 
    $$\boxed{\mathbb{E}(Y_{n}) \xrightarrow[n \to +\infty]{} \mathbb{E}(Y) \ \text{ dans } [0, +\infty]}$$

    **3.** Les fonctions $f_{n}(k) = (1 + \frac{1}{n})^{k}$ tendent vers $1$ et sont majorées par $h(k) = 2^{k}$, avec $\mathbb{E}(2^{X}) = \mathrm{e}^{\lambda}$ fini : la limite vaut $1$, ce que confirme le calcul direct $\mathbb{E}\big((1 + \frac{1}{n})^{X}\big) = G_{X}(1 + \frac{1}{n}) = \mathrm{e}^{\lambda/n}$. Les variables $\min(X, n)^{2}$ croissent vers $X^{2}$, et la question 2 donne la limite $\mathbb{E}(X^{2}) = \lambda + \lambda^{2}$. 
    $$\boxed{\lim \mathbb{E}\Big(\Big(1 + \frac{1}{n}\Big)^{X}\Big) = 1, \qquad \lim \mathbb{E}\big(\min(X, n)^{2}\big) = \lambda + \lambda^{2}}$$
