  enonce: |
    Pour $A \subset \mathbb{R}$, on pose $\lambda^{*}(A) = \mathop{\displaystyle \inf}\Big\{\displaystyle\mathop{\displaystyle \sum_{i}}(b_{i} - a_{i}) \,;\, A \subset \mathop{\displaystyle \bigcup_{i}}\,]a_{i}, b_{i}[\Big\}$, la borne inférieure portant sur les suites d'intervalles ouverts bornés qui recouvrent $A$ ; c'est la mesure extérieure du cours en dimension $1$.

    **1.** Montrer directement que $\lambda^{*}$ est une mesure extérieure au sens de l'exercice 15.

    **2.** Soit $a \in \mathbb{R}$. Montrer que $]a, +\infty[$ est $\lambda^{*}$-mesurable : pour $Q \subset \mathbb{R}$ et un recouvrement de $Q$ par des intervalles $]a_{i}, b_{i}[$, comparer $\mathop{\displaystyle \sum}(b_{i} - a_{i})$ aux longueurs des intervalles $]a_{i}, b_{i}[ \cap ]a, +\infty[$ et $]a_{i}, b_{i}[ \cap ]-\infty, a]$ (on pourra élargir légèrement ces derniers).

    **3.** En déduire que $\mathcal{B}(\mathbb{R}) \subset \mathcal{M}_{\lambda^{*}}$, puis que la restriction de $\lambda^{*}$ à $\mathcal{B}(\mathbb{R})$ est la mesure de Lebesgue.
  corrige: |
    **1.** $\emptyset$ est recouvert par des intervalles de longueur totale arbitrairement petite : $\lambda^{*}(\emptyset) = 0$. Un recouvrement de $B$ est un recouvrement de toute partie $A \subset B$ : $\lambda^{*}$ est croissante. Pour la $\sigma$-sous-additivité, on peut supposer $\mathop{\displaystyle \sum}\lambda^{*}(A_{i}) < +\infty$ ; pour $\varepsilon > 0$, on recouvre chaque $A_{i}$ par des intervalles de longueur totale au plus $\lambda^{*}(A_{i}) + \varepsilon 2^{-i}$, et la réunion de ces recouvrements (dénombrable) recouvre $\mathop{\displaystyle \bigcup} A_{i}$ avec une longueur totale au plus $\mathop{\displaystyle \sum}\lambda^{*}(A_{i}) + \varepsilon$. C'est la proposition 2 du cours en dimension $1$.

    **2.** Soit $Q \subset \mathbb{R}$ ; on peut supposer $\lambda^{*}(Q) < +\infty$. Soit $\varepsilon > 0$ et $(]a_{i}, b_{i}[)$ un recouvrement de $Q$ avec $\mathop{\displaystyle \sum}(b_{i} - a_{i}) \leqslant \lambda^{*}(Q) + \varepsilon$. L'intervalle $]a_{i}, b_{i}[$ se coupe en $I'_{i} = ]a_{i}, b_{i}[ \cap ]a, +\infty[$, ouvert, et $I''_{i} = ]a_{i}, b_{i}[ \cap ]-\infty, a]$, de longueurs $\ell'_{i} + \ell''_{i} = b_{i} - a_{i}$. On élargit $I''_{i}$ en un intervalle ouvert $J_{i}$ de longueur $\ell''_{i} + \varepsilon 2^{-i}$. Les $I'_{i}$ recouvrent $Q \cap ]a, +\infty[$ et les $J_{i}$ recouvrent $Q \cap ]-\infty, a]$, donc 
    $$\lambda^{*}(Q \cap ]a, +\infty[) + \lambda^{*}(Q \cap ]-\infty, a]) \leqslant \sum_{i}\ell'_{i} + \sum_{i}\ell''_{i} + \varepsilon \leqslant \lambda^{*}(Q) + 2\varepsilon.$$

    ![Figure](documents/figures/a1efb94d41b3e0ab.svg)

    Un recouvrement de $Q$ (en gris) est coupé au point $a$ : les morceaux de droite (bleu pétrole) recouvrent $Q \cap ]a, +\infty[$, ceux de gauche (ocre), élargis d'une longueur négligeable (tirets) pour redevenir ouverts, recouvrent $Q \cap ]-\infty, a]$. La longueur totale ne change presque pas, ce qui est exactement l'inégalité de Carathéodory.

    **3.** Par l'exercice 15, $\mathcal{M}_{\lambda^{*}}$ est une tribu ; elle contient les demi-droites $]a, +\infty[$, qui engendrent $\mathcal{B}(\mathbb{R})$ (chapitre 1, prop. 10) : $\mathcal{B}(\mathbb{R}) \subset \mathcal{M}_{\lambda^{*}}$. La restriction de $\lambda^{*}$ à $\mathcal{B}(\mathbb{R})$ est une mesure (exercice 15, question 3) qui vaut $b - a$ sur les intervalles $]a, b[$ (cours, prop. 3) : c'est $\lambda$, par l'unicité du théorème 2. Comme $\mathcal{M}_{\lambda^{*}}$ est complète et contient $\mathcal{B}(\mathbb{R})$, elle contient aussi sa complétée, la tribu de Lebesgue (cours, prop. 16) ; on montre qu'il y a en fait égalité. La méthode de Carathéodory construit donc la même mesure que le cours, par une voie plus abstraite, qui s'applique telle quelle à toute mesure extérieure : c'est celle qu'on suivra pour construire des mesures sur d'autres espaces.

