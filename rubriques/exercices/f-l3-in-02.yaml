  page_corrige: 3
  enonce: |
    Soit $B$ un borélien de $\mathbb{R}$ tel que $\lambda(B) > 0$, et $\varepsilon > 0$. Montrer qu'il existe un borélien $A \subset B$ tel que $0 < \lambda(A) < \varepsilon$.

    *Indication : découper $\mathbb{R}$ en intervalles disjoints de longueur inférieure à $\varepsilon$.*
  corrige: |
    Les intervalles $J_{k} = \big[k\dfrac{\varepsilon}{2}, (k + 1)\dfrac{\varepsilon}{2}\big[$, $k \in \mathbb{Z}$, forment une partition de $\mathbb{R}$, et $\lambda(B) = \mathop{\displaystyle \sum_{k}}\lambda(B \cap J_{k}) > 0$. L'un des termes est non nul, et il est au plus $\dfrac{\varepsilon}{2} < \varepsilon$ : on prend $A = B \cap J_{k}$. Le découpage de $\mathbb{R}$ en morceaux de petite mesure est un procédé constant pour localiser une mesure.
- id: "l3-in-02-06"
  feuille: "f-l3-in-02"
  numero: 6
  partie: "Premières propriétés"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [mesure de Lebesgue]
  noeuds: [m-lebesgue]
  notions: [mesure-lebesgue, mesure-lebesgue-rn]
  source: "Lyon 1 (TD05 2020), exercice 8 (a) et (c)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On rappelle (cours, prop. 12) que $\lambda_{n}(rA + a) = |r|^{n}\lambda_{n}(A)$ pour toute partie mesurable $A$, tout réel $r \neq 0$ et tout $a \in \mathbb{R}^{n}$. On note $B(a, r)$ et $B_{f}(a, r)$ les boules ouverte et fermée pour une norme $\lVert \cdot \rVert$ de $\mathbb{R}^{n}$.

    **1.** Montrer que $\lambda\big(B(a, r)\big) = r^{n}\lambda\big(B(0, 1)\big)$, et que $\lambda\big(B_{f}(a, r)\big) = \lambda\big(B(a, r)\big)$. En déduire que la sphère $\{x \,;\, \lVert x - a \rVert = r\}$ est de mesure nulle.

    **2.** Soit $H$ un hyperplan vectoriel de $\mathbb{R}^{n}$. Que donne la comparaison de $H$ et de $2H$ ? Soit $u \notin H$. En considérant les translatés $\big(H \cap B(0, 1)\big) + tu$, $t \in [0, 1]$, montrer que $\lambda\big(H \cap B(0, 1)\big) = 0$, puis que $\lambda(H) = 0$.

    **3.** Soit $A$ une partie mesurable bornée de $\mathbb{R}^{n}$ telle que $rA \subset A$ pour un $r \in ]0, 1[$ et que $\lambda(A \setminus rA) = c$. Calculer $\lambda(A)$. Application : $A = B(0, 1)$, et l'on retrouve que les couronnes $B(0, 1) \setminus B_{f}(0, r)$ « portent presque toute la masse » de la boule quand $n$ est grand.
  corrige: |
    **1.** $B(a, r) = rB(0, 1) + a$, donc $\lambda(B(a, r)) = r^{n}\lambda(B(0, 1))$ par la proposition 12 ; cette mesure est finie (la boule est bornée) et non nulle (exercice 2). Pour $r' > r$, $B(a, r) \subset B_{f}(a, r) \subset B(a, r')$, donc $r^{n}\lambda(B(0, 1)) \leqslant \lambda(B_{f}(a, r)) \leqslant r'^{n}\lambda(B(0, 1))$, et l'on fait tendre $r'$ vers $r$. La sphère est la différence de la boule fermée et de la boule ouverte, de mesures finies et égales : elle est de mesure nulle.

    **2.** Comme $2H = H$, la proposition 12 donne $\lambda(H) = 2^{n}\lambda(H)$, donc seulement $\lambda(H) \in \{0, +\infty\}$. Soit $C = H \cap B(0, 1)$ et $u \notin H$ avec $\lVert u \rVert \leqslant 1$. Les translatés $C + tu$, $t \in [0, 1]$, sont contenus dans des hyperplans affines parallèles distincts, donc deux à deux disjoints, et tous contenus dans $B(0, 2)$. Pour $N$ valeurs distinctes de $t$, l'invariance par translation donne $N\lambda(C) \leqslant \lambda(B(0, 2)) < +\infty$ ; $N$ étant arbitraire, $\lambda(C) = 0$. Enfin $H = \mathop{\displaystyle \bigcup_{k}}kC$, avec $\lambda(kC) = k^{n}\lambda(C) = 0$ : 
    $$\boxed{\text{tout hyperplan de } \mathbb{R}^{n} \text{ est de mesure nulle}}\text{.}$$
     On retrouvera ce résultat au chapitre 6 (une application linéaire non inversible écrase $\mathbb{R}^{n}$ sur un hyperplan) et au chapitre 7 (par Fubini).

    **3.** $\lambda(A) = \lambda(rA) + \lambda(A \setminus rA) = r^{n}\lambda(A) + c$, et $\lambda(A)$ est finie puisque $A$ est bornée : 
    $$\boxed{\lambda(A) = \frac{c}{1 - r^{n}}}\text{.}$$
     Pour $A = B(0, 1)$, la couronne $B(0, 1) \setminus B(0, r)$ porte la fraction $1 - r^{n}$ de la masse de la boule. Pour $r = 0{,}9$, cette fraction vaut $0{,}271$ en dimension $3$ et $0{,}99997$ en dimension $100$ : en grande dimension, presque tout le volume d'une boule est près de son bord.
- id: "l3-in-02-07"
  feuille: "f-l3-in-02"
  numero: 7
  partie: "Négligeables, presque partout, complétion"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["négligeables, presque partout", parties négligeables]
  noeuds: [m-lebesgue]
  notions: [negligeable, presque-partout, mesure-complete]
  source: "Lyon 1 (TD02 2020), exercices 50 et 52 ; Exo7 (fic00141), exercice 5 (1)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Prouver ou réfuter les assertions suivantes.

    **1.** Une partie d'un ensemble négligeable est négligeable.

    **2.** Une réunion au plus dénombrable d'ensembles négligeables est négligeable.

    **3.** Une réunion quelconque d'ensembles négligeables est négligeable.

    **4.** Une partie de $\mathbb{R}$ est négligeable si et seulement si, pour tout $\varepsilon > 0$, elle est contenue dans une réunion dénombrable d'intervalles ouverts dont la somme des longueurs est au plus $\varepsilon$.

    **5.** Une partie d'une partie Lebesgue-mesurable de $\mathbb{R}^{n}$ est Lebesgue-mesurable.
  corrige: |
    **1.** Vrai : la partie est contenue dans le même ensemble mesurable de mesure nulle.

    **2.** Vrai : si $N_{k} \subset Z_{k}$ avec $\lambda(Z_{k}) = 0$, alors $\mathop{\displaystyle \bigcup} N_{k} \subset \mathop{\displaystyle \bigcup} Z_{k}$, de mesure nulle par $\sigma$-sous-additivité.

    **3.** Faux : $\mathbb{R} = \mathop{\displaystyle \bigcup_{x \in \mathbb{R}}}\{x\}$.

    **4.** Vrai. Si $N \subset Z$ avec $\lambda(Z) = 0$, alors $\lambda^{*}(N) = 0$, et la définition de $\lambda^{*}$ fournit, pour tout $\varepsilon > 0$, un recouvrement de $N$ par des intervalles ouverts bornés de longueur totale au plus $\varepsilon$. Inversement, si cette condition est vérifiée, chaque recouvrement donne un ouvert $U_{k} \supset N$ de mesure au plus $\dfrac{1}{k}$, et $Z = \mathop{\displaystyle \bigcap_{k}}U_{k}$ est un borélien de mesure nulle contenant $N$.

    **5.** Faux : l'ensemble de Vitali (cours, prop. 14, ou exercice 10) est contenu dans $[0, 1]$ sans être mesurable. Seules les parties des ensembles de mesure *nulle* sont automatiquement mesurables (la tribu de Lebesgue est complète).
- id: "l3-in-02-08"
  feuille: "f-l3-in-02"
  numero: 8
  partie: "Négligeables, presque partout, complétion"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["négligeables, presque partout", parties négligeables]
  noeuds: [m-lebesgue]
  notions: [negligeable, presque-partout, mesure-complete]
  source: "Lyon 1 (TD02 2020), exercices 51, 53 et 54 ; M61B TD3, exercice 13"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $(\Omega, \mathcal{T}, \mu)$ un espace mesuré. Montrer que la relation « $f = g$ $\mu$-p.p. » est une relation d'équivalence sur les fonctions de $\Omega$ dans $\mathbb{R}$.

    **2.** Soit $f$, $g : \mathbb{R} \to \mathbb{R}$ continues. Montrer que $f = g$ p.p. si et seulement si $f = g$. En particulier, une fonction continue $f : [0, 1] \to \mathbb{R}$ telle que $\lambda\big(f^{-1}(\{0\})\big) = 1$ est nulle. Le résultat subsiste-t-il pour une fonction quelconque ? Étendre le résultat aux fonctions continues sur une partie $A$ de $\mathbb{R}^{n}$ contenue dans l'adhérence de son intérieur.

    **3.** On considère les propriétés suivantes d'une fonction $f : \mathbb{R} \to \mathbb{R}$ : (P1) $f$ est continue p.p. ; (P2) il existe $g : \mathbb{R} \to \mathbb{R}$ continue telle que $f = g$ p.p. Montrer qu'aucune de ces propriétés n'entraîne l'autre.

    **4.** Soit $(\Omega, \mathcal{T}, \mu)$ un espace mesuré, $(\Omega, \widetilde{\mathcal{T}}, \widetilde{\mu})$ son complété (cours, prop. 15). Montrer qu'une partie est $\mu$-négligeable si et seulement si elle est $\widetilde{\mu}$-négligeable, que $\widetilde{\mathcal{T}}$ est complète pour $\widetilde{\mu}$ et que le complété de $(\Omega, \widetilde{\mathcal{T}}, \widetilde{\mu})$ est lui-même.
  corrige: |
    **1.** La relation est réflexive et symétrique ; elle est transitive car $\{f \neq h\} \subset \{f \neq g\} \cup \{g \neq h\}$, réunion de deux parties négligeables.

    **2.** Si $f(x) \neq g(x)$, la continuité donne un intervalle ouvert non vide autour de $x$ sur lequel $f \neq g$ ; il est de mesure non nulle (exercice 2), donc $\{f \neq g\}$ n'est pas négligeable. Ainsi $f = g$ p.p. entraîne $f = g$. Pour $f : [0, 1] \to \mathbb{R}$ continue, $\{f \neq 0\}$ est un ouvert relatif de $[0, 1]$, de mesure nulle ; s'il était non vide, il contiendrait un intervalle de longueur non nulle : il est vide. Pour une fonction quelconque, c'est faux : $\chi_{\{1/2\}}$ est nulle sur $[0, 1] \setminus \{\dfrac{1}{2}\}$. Si $A \subset \overline{\mathring{A}}$ et $f(x) \neq g(x)$ pour un $x \in A$, il existe un voisinage $V$ de $x$ tel que $f \neq g$ sur $V \cap A$ ; comme $x$ est adhérent à $\mathring{A}$, l'ouvert $V \cap \mathring{A}$ est non vide, donc de mesure non nulle.

    **3.** $f = \chi_{[0, +\infty[}$ est continue hors de $0$, donc vérifie (P1). Si $g$ continue vérifiait $f = g$ p.p., on aurait $g = 0$ sur $]-\infty, 0[$ et $g = 1$ sur $]0, +\infty[$ par la question 2 appliquée à ces intervalles, ce qui contredit la continuité en $0$ : (P1) n'entraîne pas (P2). À l'inverse, $\chi_{\mathbb{Q}}$ est égale à la fonction nulle p.p., mais n'est continue en aucun point : (P2) n'entraîne pas (P1). *Il ne faut pas confondre* « égale p.p. à une fonction continue » et « continue p.p. ».

    **4.** Rappelons que $\widetilde{\mathcal{T}}$ est formée des $A \cup N$, $A \in \mathcal{T}$, $N$ $\mu$-négligeable, et que $\widetilde{\mu}(A \cup N) = \mu(A)$. Une partie $\mu$-négligeable $N$ est dans $\widetilde{\mathcal{T}}$, de mesure $\widetilde{\mu}(N) = 0$. Inversement, si $N \subset A \cup N'$ avec $\widetilde{\mu}(A \cup N') = \mu(A) = 0$ et $N' \subset Z$, $\mu(Z) = 0$, alors $N \subset A \cup Z$, de $\mu$-mesure nulle. Les deux mesures ont donc les mêmes parties négligeables. Une partie $\widetilde{\mu}$-négligeable est donc $\mu$-négligeable, et appartient à $\widetilde{\mathcal{T}}$ : la tribu complétée est complète. Pour la même raison, le complété de $(\Omega, \widetilde{\mathcal{T}}, \widetilde{\mu})$ n'ajoute aucune partie : compléter deux fois ne sert à rien.
- id: "l3-in-02-09"
