- id: "l3-in-02-01"
  feuille: "f-l3-in-02"
  numero: 1
  partie: "Premières propriétés"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [mesure de Lebesgue]
  noeuds: [m-lebesgue]
  notions: [mesure-lebesgue, mesure-lebesgue-rn]
  source: "TD2 Paris-Dauphine 2021-2022, exercice 2 ; Lyon 1 (TD02 2020), exercice 55 (a) ; M61B TD3, exercice 8 (1) et (2)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Montrer que $\lambda_{n}$ est $\sigma$-finie et que $\lambda_{n}(K) < +\infty$ pour tout compact $K$ de $\mathbb{R}^{n}$.

    **2.** Un ouvert de $\mathbb{R}$ de mesure finie est-il borné ? Même question pour un fermé.

    **3.** Construire une partie dense de $\mathbb{R}$ de mesure nulle.

    **4.** Soit $\varepsilon > 0$. En utilisant une énumération $(r_{k})$ de $\mathbb{Q}$, construire un ouvert dense de $\mathbb{R}$ de mesure au plus $\varepsilon$.

    **5.** Construire un ouvert dense de $\mathbb{R}$ de mesure égale à $3$.
  corrige: |
    **1.** $\mathbb{R}^{n} = \mathop{\displaystyle \bigcup_{k}}[-k, k]^{n}$, réunion de pavés de mesures finies $(2k)^{n}$ : $\lambda_{n}$ est $\sigma$-finie. Un compact est borné, donc contenu dans l'un de ces pavés, et de mesure finie.

    **2.** Non : l'ouvert $\mathop{\displaystyle \bigcup_{n \geqslant 0}}\,]n, n + 2^{-n}[$ est de mesure $2$ (exercice 3) et n'est pas borné. De même, $F = \mathop{\displaystyle \bigcup_{n \geqslant 1}}[n, n + 2^{-n}]$ est de mesure $1$ et non borné ; il est fermé, car une suite convergente de points de $F$ reste dans une réunion finie de ces segments, qui est fermée.

    **3.** $\mathbb{Q}$ est dense et dénombrable, donc de mesure nulle (exercice 3).

    **4.** Soit $U = \mathop{\displaystyle \bigcup_{k \in \mathbb{N}}}\,\big]r_{k} - \varepsilon 2^{-k-2}, r_{k} + \varepsilon 2^{-k-2}\big[$. C'est un ouvert qui contient $\mathbb{Q}$, donc dense, et, par $\sigma$-sous-additivité, 
    $$\lambda(U) \leqslant \sum_{k \geqslant 0}\varepsilon 2^{-k-1} = \varepsilon.$$
     *Un ouvert dense peut donc être « petit » au sens de la mesure* : la densité est une notion topologique, que la mesure ne voit pas.

    **5.** Soit $U$ l'ouvert de la question 4 pour $\varepsilon = 1$, et $\varphi(a) = \lambda\big(U \cup ]0, a[\big)$ pour $a \geqslant 0$. La fonction $\varphi$ est croissante, $\varphi(0) = \lambda(U) \leqslant 1$, $\varphi(a) \geqslant a$, et, pour $a < b$, $U \cup ]0, b[ = \big(U \cup ]0, a[\big) \cup [a, b[$ donne $0 \leqslant \varphi(b) - \varphi(a) \leqslant b - a$ : $\varphi$ est continue. Par le théorème des valeurs intermédiaires, il existe $a$ tel que $\varphi(a) = 3$, et $V = U \cup ]0, a[$ est un ouvert dense de mesure $3$.
- id: "l3-in-02-02"
  feuille: "f-l3-in-02"
  numero: 2
  partie: "Premières propriétés"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [mesure de Lebesgue]
  noeuds: [m-lebesgue]
  notions: [mesure-lebesgue, mesure-lebesgue-rn]
  source: "Lyon 1 (TD02 2020), exercices 45 et 46 ; M61B TD3, exercices 8 (3) et 9 ; Bibmath (F. Bayart), « Produit de convolution », exercice 18 (1)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Montrer qu'un ouvert $U$ de $\mathbb{R}^{n}$ vérifie $\lambda(U) = 0$ si et seulement si $U = \emptyset$. En déduire qu'une partie mesurable de mesure nulle est d'intérieur vide.

    **2.** Montrer qu'une partie mesurable qui contient un ouvert non vide est de mesure non nulle.

    **3.** Que vaut $\lambda([0, 1] \setminus \mathbb{Q})$ ? Cette partie contient-elle un ouvert non vide ? Conclure qu'une partie mesurable de mesure non nulle peut être d'intérieur vide.

    **4.** Prouver ou réfuter : une partie borélienne de $\mathbb{R}$ de mesure finie est bornée.
  corrige: |
    **1.** Un ouvert non vide contient une boule, donc un pavé ouvert non dégénéré $P$, et l'on a $\lambda(U) \geqslant \operatorname{vol}(P) > 0$ (cours, prop. 3). Si une partie mesurable $A$ de mesure nulle avait un intérieur non vide, elle contiendrait un ouvert non vide de mesure strictement positive.

    **2.** C'est la même observation : $\lambda(A) \geqslant \lambda(U) > 0$.

    **3.** $\lambda([0, 1] \setminus \mathbb{Q}) = \lambda([0, 1]) - \lambda([0, 1] \cap \mathbb{Q}) = 1$. Un intervalle ouvert non vide contient des rationnels, donc $[0, 1] \setminus \mathbb{Q}$ ne contient aucun ouvert non vide : 
    $$\boxed{\text{une partie de mesure non nulle peut être d'intérieur vide}}\text{.}$$
     La réciproque de la question 2 est donc fausse. L'exercice 9 en donne un exemple compact.

    **4.** Faux : $\mathop{\displaystyle \bigcup_{n}}\,]n, n + 2^{-n}[$ (exercice 3). *L'erreur la plus répandue* est d'associer « mesure finie » et « borné » : une partie de mesure finie peut s'étendre jusqu'à l'infini, pourvu qu'elle s'y amincisse.
- id: "l3-in-02-03"
  feuille: "f-l3-in-02"
