  page_corrige: 4
  enonce: |
    **1.** *Un Cantor décimal.* Pour $n \geqslant 1$, soit $A_{n}$ l'ensemble des $x \in [0, 1[$ dont les $n$ premiers chiffres décimaux appartiennent à $\{1, 5\}$. Calculer $\lambda(A_{n})$, puis $\lambda\big(\mathop{\displaystyle \bigcap_{n}}A_{n}\big)$.

    **2.** *Des Cantor de mesure positive.* Soit $(d_{n})_{n \geqslant 1}$ une suite de $]0, 1[$. On pose $K_{0} = [0, 1]$ et, $K_{n-1}$ étant une réunion de $2^{n-1}$ segments disjoints de même longueur, on obtient $K_{n}$ en retirant de chacun d'eux l'intervalle ouvert de même centre dont la longueur est $d_{n}$ fois la sienne. Soit $K = \mathop{\displaystyle \bigcap_{n}}K_{n}$.

    **(a)** Montrer que $K$ est un compact non vide d'intérieur vide, sans point isolé.

    **(b)** Montrer que $K$ n'est pas dénombrable (on pourra coder chaque point de $K$ par la suite de ses choix « gauche » ou « droite »).

    **(c)** Montrer que $\lambda(K) = \displaystyle\mathop{\displaystyle \lim_{n \to +\infty}}\mathop{\displaystyle \prod_{k=1}^{n}}(1 - d_{k})$. Calculer $\lambda(K)$ lorsque $d_{n} = \dfrac{1}{3}$ pour tout $n$, puis lorsque $d_{n} = \dfrac{1}{(n + 1)^{2}}$.

    **(d)** En déduire qu'il existe un compact d'intérieur vide de mesure strictement positive, et qu'un compact d'intérieur vide peut avoir une mesure aussi proche de $1$ qu'on le veut.

    **3.** Pour $d_{n} = \dfrac{1}{3}$, vérifier que $K = \Big\{\displaystyle\mathop{\displaystyle \sum_{n \geqslant 1}}\dfrac{a_{n}}{3^{n}} \,;\, (a_{n}) \in \{0, 2\}^{\mathbb{N}^{*}}\Big\}$ : c'est l'ensemble de Cantor du cours (prop. 13).
  corrige: |
    **1.** $A_{n}$ est la réunion des $2^{n}$ intervalles $[0{,}u_{1}\dots u_{n}, 0{,}u_{1}\dots u_{n} + 10^{-n}[$, avec $u_{i} \in \{1, 5\}$, deux à deux disjoints et de longueur $10^{-n}$ ; l'ambiguïté des développements décimaux ne porte que sur un ensemble dénombrable, donc négligeable. Ainsi $\lambda(A_{n}) = 2^{n}10^{-n} = 5^{-n}$, et, par continuité décroissante, $\lambda\big(\mathop{\displaystyle \bigcap} A_{n}\big) = \mathop{\displaystyle \lim} 5^{-n} = 0$.

    **2. (a)** Les $K_{n}$ sont des compacts non vides décroissants, donc $K$ est un compact non vide. Les segments de $K_{n}$ ont tous la longueur $\ell_{n} = \dfrac{1 - d_{n}}{2}\ell_{n-1} \leqslant 2^{-n}$ ; $K$ ne contient donc aucun intervalle de longueur non nulle, et il est d'intérieur vide. Les extrémités des segments ne sont jamais retirées (on retire des intervalles ouverts situés strictement à l'intérieur), donc elles sont dans $K$. Si $x \in K$, il est dans un segment de $K_{n}$, dont une extrémité au moins est distincte de $x$ et à distance au plus $2^{-n}$ : $x$ n'est pas isolé.

    **(b)** À une suite $(c_{n}) \in \{G, D\}^{\mathbb{N}^{*}}$ on associe la suite décroissante de segments obtenue en choisissant, à l'étape $n$, le segment gauche ou droit ; leur intersection est un point de $K$. Deux suites distinctes conduisent à des segments disjoints à partir du premier choix différent, donc à des points distincts, et tout point de $K$ est obtenu. Ainsi $K$ est en bijection avec $\{0, 1\}^{\mathbb{N}}$, qui n'est pas dénombrable (feuille 1, exercice 6).

    **(c)** $\lambda(K_{n}) = 2^{n}\ell_{n} = \mathop{\displaystyle \prod_{k=1}^{n}}(1 - d_{k})$, et la continuité décroissante donne $\lambda(K) = \mathop{\displaystyle \lim}\lambda(K_{n})$. Pour $d_{n} = \dfrac{1}{3}$, $\lambda(K) = \mathop{\displaystyle \lim}\big(\dfrac{2}{3}\big)^{n} = 0$. Pour $d_{n} = \dfrac{1}{(n + 1)^{2}}$, le produit est télescopique : 
    $$\prod_{k=1}^{n}\Big(1 - \frac{1}{(k + 1)^{2}}\Big) = \prod_{k=1}^{n}\frac{k}{k + 1}\cdot\frac{k + 2}{k + 1} = \frac{1}{n + 1}\cdot\frac{n + 2}{2} \xrightarrow[n \to +\infty]{} \boxed{\frac{1}{2}}\text{.}$$

    ![Figure](documents/figures/a4a670ed94009b30.svg)

    Les cinq premières étapes des deux constructions, avec la mesure de $K_{n}$ à droite de chaque ligne. À gauche, on retire chaque fois le tiers central et la mesure tend vers $0$. À droite, les trous rétrécissent assez vite pour que la mesure décroisse seulement vers $\dfrac{1}{2}$, alors que les segments deviennent, là aussi, de plus en plus courts.

    **(d)** Le second exemple est un compact d'intérieur vide de mesure $\dfrac{1}{2}$. Plus généralement, pour $\varepsilon \in ]0, 1[$ et $d_{n} = \varepsilon 2^{-n}$, l'inégalité $\mathop{\displaystyle \prod}(1 - d_{k}) \geqslant 1 - \mathop{\displaystyle \sum} d_{k}$ (récurrence immédiate) donne $\lambda(K) \geqslant 1 - \varepsilon$. Son complémentaire dans $[0, 1]$ est alors un ouvert dense de $[0, 1]$ de mesure au plus $\varepsilon$, comme à l'exercice 1.

    **3.** Par récurrence, $K_{n}$ est la réunion des segments 
    $$\Big[\sum_{k \leqslant n}a_{k}3^{-k}, \sum_{k \leqslant n}a_{k}3^{-k} + 3^{-n}\Big], \qquad (a_{1}, \dots, a_{n}) \in \{0, 2\}^{n}\text{ :}$$
     retirer le tiers central de $[c, c + 3^{1-n}]$ laisse $[c, c + 3^{-n}]$ et $[c + 2 \cdot 3^{-n}, c + 3^{1-n}]$, ce qui revient à choisir le chiffre $a_{n} = 0$ ou $2$. Un point est dans tous les $K_{n}$ si et seulement s'il s'écrit $\mathop{\displaystyle \sum} a_{k}3^{-k}$ avec tous les $a_{k}$ dans $\{0, 2\}$.
- id: "l3-in-02-10"
  feuille: "f-l3-in-02"
  numero: 10
  partie: "Deux ensembles remarquables"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Cantor et Vitali, ensemble de Vitali]
  noeuds: [m-vitali]
  notions: [ensemble-cantor]
  source: "M61B TD3, exercice 12 ; J. Féjoz (exosIntegration), exercice 1.18"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Pour $x$, $y \in \mathbb{R}$, on pose $x \mathrel{\mathcal{R}} y$ si $x - y \in \mathbb{Q}$. Montrer que $\mathcal{R}$ est une relation d'équivalence, et que chaque classe rencontre $[0, 1]$.

    **2.** En admettant l'axiome du choix, en déduire l'existence d'une partie $E \subset [0, 1]$ qui contient exactement un élément de chaque classe.

    **3.** Soit $G = \mathop{\displaystyle \bigcup_{r \in \mathbb{Q} \cap [-1, 1]}}(E + r)$. Montrer que $[0, 1] \subset G \subset [-1, 2]$, et que les translatés $E + r$, $r \in \mathbb{Q}$, sont deux à deux disjoints.

    **4.** En raisonnant par l'absurde, montrer que $E$ n'est pas Lebesgue-mesurable, donc pas borélien.

    **5.** Plus généralement, montrer qu'il n'existe aucune mesure $\mu$ définie sur $\mathcal{P}(\mathbb{R})$, invariante par translation, telle que $0 < \mu([0, 1]) < +\infty$. Que dire d'une mesure $\mu$ sur $\mathcal{P}(\mathbb{R})$ invariante par translation et telle que $\mu([0, 1]) = 0$ ?
  corrige: |
    **1.** $x - x = 0 \in \mathbb{Q}$, $x - y \in \mathbb{Q} \Rightarrow y - x \in \mathbb{Q}$, et une somme de rationnels est rationnelle. La classe de $x$ est $x + \mathbb{Q}$, qui rencontre $[0, 1]$ puisque $\mathbb{Q}$ est dense.

    **2.** L'axiome du choix permet de choisir un élément dans chacune des parties non vides $(x + \mathbb{Q}) \cap [0, 1]$.

    **3.** Si $x \in [0, 1]$, il existe $e \in E$ équivalent à $x$, et $r = x - e \in \mathbb{Q} \cap [-1, 1]$ puisque $x$ et $e$ sont dans $[0, 1]$ : $x \in E + r$. L'inclusion $G \subset [-1, 2]$ est claire. Si $e + r = e' + s$ avec $e$, $e' \in E$ et $r$, $s \in \mathbb{Q}$, alors $e \mathrel{\mathcal{R}} e'$, donc $e = e'$ et $r = s$.

    **4.** Si $E$ était mesurable, l'invariance par translation (cours, th. 2) et la $\sigma$-additivité donneraient $\lambda(G) = \mathop{\displaystyle \sum_{r \in \mathbb{Q} \cap [-1, 1]}}\lambda(E)$, qui vaut $0$ ou $+\infty$, alors que $1 \leqslant \lambda(G) \leqslant 3$. Donc $E$ n'est pas mesurable, et pas borélien puisque $\mathcal{B}(\mathbb{R}) \subset \mathcal{M}(\mathbb{R})$.

    **5.** Le même raisonnement s'applique à $\mu$, puisque seules l'invariance par translation et la $\sigma$-additivité ont servi : $\mu(G)$ vaut $0$ ou $+\infty$, alors que $\mu([0, 1]) \leqslant \mu(G) \leqslant \mu([-1, 2]) \leqslant 3\mu([0, 1])$, en découpant $[-1, 2]$ en trois translatés de $[0, 1]$. C'est impossible si $0 < \mu([0, 1]) < +\infty$ : 
    $$\boxed{\text{la mesure de Lebesgue ne se prolonge pas à } \mathcal{P}(\mathbb{R}) \text{ en une mesure invariante par translation}}\text{.}$$
     Si $\mu([0, 1]) = 0$, alors $\mu(\mathbb{R}) \leqslant \mathop{\displaystyle \sum_{k \in \mathbb{Z}}}\mu([k, k + 1]) = 0$ : $\mu$ est nulle. Le cas $\mu([0, 1]) = +\infty$ est possible : la mesure de comptage. C'est la raison pour laquelle la théorie de la mesure renonce à mesurer toutes les parties de $\mathbb{R}$.
- id: "l3-in-02-11"
  feuille: "f-l3-in-02"
  numero: 11
  partie: "Unicité et régularité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [unicité et régularité]
  noeuds: [m-regularite, m-lebesgue]
  notions: [mesure-reguliere]
  source: "Lyon 1 (TD02 2020), exercices 48 et 49 ; TD2 Paris-Dauphine, exercice 4 ; M61B TD3, exercice 7"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Soit $\mu$ une mesure sur $(\mathbb{R}^{n}, \mathcal{B}(\mathbb{R}^{n}))$, invariante par translation (c'est-à-dire $\mu(A + x) = \mu(A)$ pour tout borélien $A$ et tout $x$), telle que $\mu([0, 1[^{n}) = 1.$

    **(a)** Montrer que $\mu\big([0, \dfrac{1}{k}[^{n}\big) = k^{-n}$ pour tout entier $k \geqslant 1$, puis que $\mu(Q) = \operatorname{vol}(Q)$ pour tout cube dyadique semi-ouvert $Q$.

    **(b)** En déduire que $\mu(U) = \lambda(U)$ pour tout ouvert $U$ (chapitre 1, prop. 9), puis que $\mu = \lambda$ sur $\mathcal{B}(\mathbb{R}^{n})$.

    **2.** Prouver ou réfuter : une mesure borélienne sur $\mathbb{R}$ invariante par translation est un multiple $c\lambda$ de la mesure de Lebesgue, avec $c \in [0, +\infty[$. Quelle hypothèse faut-il ajouter ?

    **3.** Soit $\mu$ une mesure sur $(\mathbb{Z}, \mathcal{P}(\mathbb{Z}))$, non nulle et invariante par translation ($\mu(A + n) = \mu(A)$ pour tous $A \subset \mathbb{Z}$ et $n \in \mathbb{Z}$). Montrer qu'il existe $n_{0}$ tel que $\mu(\{n_{0}\}) \neq 0$, que $\mu(\{n\}) = \mu(\{n_{0}\})$ pour tout $n$, et en déduire que $\mu(\mathbb{Z}) = +\infty$. Quelles sont les mesures invariantes par translation sur $\mathbb{Z}$ ?
  corrige: |
    **1. (a)** $[0, 1[^{n}$ est la réunion disjointe des $k^{n}$ translatés $\dfrac{1}{k}(j_{1}, \dots, j_{n}) + [0, \dfrac{1}{k}[^{n}$, $0 \leqslant j_{i} < k$, qui ont tous la même mesure : $k^{n}\mu\big([0, \dfrac{1}{k}[^{n}\big) = 1$. Un cube dyadique semi-ouvert de côté $2^{-m}$ est un translaté de $[0, 2^{-m}[^{n}$, donc de mesure $2^{-mn} = \operatorname{vol}(Q)$.

    **(b)** Un ouvert est réunion dénombrable disjointe de cubes dyadiques (chapitre 1, prop. 9), donc $\mu(U) = \mathop{\displaystyle \sum}\operatorname{vol}(Q) = \lambda(U)$. Les ouverts forment un $\pi$-système qui engendre $\mathcal{B}(\mathbb{R}^{n})$, et les ouverts $]-k, k[^{n}$, de mesures finies, recouvrent $\mathbb{R}^{n}$ : la proposition 18 du chapitre 1 donne $\mu = \lambda$ sur $\mathcal{B}(\mathbb{R}^{n})$.

    **2.** Faux : la mesure de comptage sur $\mathbb{R}$ est invariante par translation sans être un multiple fini de $\lambda$. Il suffit d'ajouter $c = \mu([0, 1[) < +\infty$ : si $c > 0$, la question 1 appliquée à $\dfrac{1}{c}\mu$ donne $\mu = c\lambda$ ; si $c = 0$, $\mu(\mathbb{R}) \leqslant \mathop{\displaystyle \sum_{k}}\mu([k, k + 1[) = 0$, et $\mu = 0 \cdot \lambda$.

    **3.** Si $\mu \neq 0$, $\mu(\mathbb{Z}) = \mathop{\displaystyle \sum_{n}}\mu(\{n\}) > 0$, donc l'un des termes $\mu(\{n_{0}\})$ est non nul. Par invariance, $\mu(\{n\}) = \mu(\{n_{0}\} + n - n_{0}) = \mu(\{n_{0}\})$, d'où $\mu(\mathbb{Z}) = \mathop{\displaystyle \sum_{n \in \mathbb{Z}}}\mu(\{n_{0}\}) = +\infty$. Plus précisément, $\mu(A) = \mathop{\displaystyle \sum_{n \in A}}\mu(\{n\}) = c\operatorname{card} A$ : 
    $$\boxed{\text{les mesures invariantes sur } \mathbb{Z} \text{ sont les } c \cdot \operatorname{card}, \ c \in [0, +\infty]}\text{.}$$
     Aucune n'est finie et non nulle : c'est le pendant discret de l'exercice précédent, où la normalisation $\mu([0, 1[) = 1$ était possible parce que $\mathbb{R}$ peut être découpé en morceaux arbitrairement petits.
