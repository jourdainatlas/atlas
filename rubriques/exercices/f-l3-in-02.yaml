  source: "Rubenthaler, exercices 2.6 et 2.7 ; M61B TD3, exercice 10"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Calculer $\lambda(\{x\})$ pour $x \in \mathbb{R}$, puis $\lambda\big(\{x_{k} \,;\, k \in \mathbb{N}\}\big)$ pour une suite réelle $(x_{k})$. En déduire $\lambda(\mathbb{Q})$ et $\lambda([0, 1] \setminus \mathbb{Q})$.

    **2.** Soit $A = \mathop{\displaystyle \bigcup_{n \in \mathbb{N}}}\,]n, n + 2^{-n}[$. Justifier que $A$ est borélien et calculer $\lambda(A)$. Retrouver la réponse à la question 4 de l'exercice 2.
  corrige: |
    **1.** Pour tout $\varepsilon > 0$, $\{x\} \subset [x - \varepsilon, x + \varepsilon]$, donc $\lambda(\{x\}) \leqslant 2\varepsilon$, et $\lambda(\{x\}) = 0$. Par $\sigma$-sous-additivité, un ensemble au plus dénombrable est de mesure nulle : 
    $$\boxed{\lambda(\mathbb{Q}) = 0, \qquad \lambda([0, 1] \setminus \mathbb{Q}) = 1}\text{.}$$

    **2.** $A$ est une réunion d'ouverts, donc un ouvert. Les intervalles sont deux à deux disjoints, puisque $n + 2^{-n} \leqslant n + 1$ ; par $\sigma$-additivité, $\lambda(A) = \mathop{\displaystyle \sum_{n \geqslant 0}}2^{-n} = 2$. L'ouvert $A$ est de mesure finie et non borné.
- id: "l3-in-02-04"
  feuille: "f-l3-in-02"
  numero: 4
  partie: "Premières propriétés"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [mesure de Lebesgue]
  noeuds: [m-lebesgue]
  notions: [mesure-lebesgue, mesure-lebesgue-rn]
  source: "M61B TD3, exercice 11"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $(a_{n})_{n \geqslant 1}$ une suite réelle et $A = \{x \in \mathbb{R} \,;\, \text{il existe } n \geqslant 1 \text{ tel que } |x - a_{n}| \leqslant 2^{-n}\}$.

    **1.** Justifier que $A$ est borélien.

    **2.** Montrer que $1 \leqslant \lambda(A) \leqslant 2$.

    **3.** Que vaut $\lambda({A}^{c})$ ?

    **4.** Calculer $\lambda(A)$ lorsque $a_{n} = 0$ pour tout $n$, puis lorsque $a_{n} = n$ pour tout $n$.

    **5.** Peut-on choisir $(a_{n})$ de sorte que $\lambda(A)$ prenne une valeur donnée de $[1, 2]$ ?
  corrige: |
    Notons $I_{n} = [a_{n} - 2^{-n}, a_{n} + 2^{-n}]$, de longueur $2^{1-n}$, de sorte que $A = \mathop{\displaystyle \bigcup_{n \geqslant 1}}I_{n}$.

    **1.** $A$ est une réunion dénombrable de fermés.

    **2.** $\lambda(A) \geqslant \lambda(I_{1}) = 1$ et $\lambda(A) \leqslant \mathop{\displaystyle \sum_{n \geqslant 1}}2^{1-n} = 2$.

    **3.** $\lambda(\mathbb{R}) = \lambda(A) + \lambda({A}^{c})$, avec $\lambda(A) \leqslant 2$ : $\boxed{\lambda({A}^{c}) = +\infty}$.

    **4.** Si $a_{n} = 0$, les $I_{n}$ sont emboîtés et $A = I_{1} = [-\dfrac{1}{2}, \dfrac{1}{2}]$ : $\lambda(A) = 1$. Si $a_{n} = n$, les $I_{n}$ sont deux à deux disjoints, puisque $n + 2^{-n} < (n + 1) - 2^{-n-1}$, et $\lambda(A) = \mathop{\displaystyle \sum} 2^{1-n} = 2$. Les deux bornes de la question 2 sont atteintes.

    ![Figure](documents/figures/93a311fdf6a5ad88.svg)

    En ocre, pour $a_{n} = 0$, les intervalles $I_{1} \supset I_{2} \supset I_{3}$ sont emboîtés et $A$ se réduit à $I_{1}$, de longueur $1$. En bleu ardoise, pour $a_{n} = n$, les intervalles centrés en $1$, $2$, $3$, … sont disjoints, et les longueurs $1$, $\dfrac{1}{2}$, $\dfrac{1}{4}$, … s'additionnent jusqu'à $2$.

    **5.** Oui. Pour $t \in [0, 1]$, soit $A_{t}$ l'ensemble obtenu avec $a_{n} = tn$, et $g(t) = \lambda(A_{t})$, de sorte que $g(0) = 1$ et $g(1) = 2$. Pour $N \geqslant 1$, notons 
    $$A_{t}^{N} = I_{1}(t) \cup \dots \cup I_{N}(t).$$
     D'une part $0 \leqslant g(t) - \lambda(A_{t}^{N}) \leqslant \mathop{\displaystyle \sum_{n > N}}2^{1-n} = 2^{1-N}$ ; d'autre part, 
    $$|\lambda(A_{t}^{N}) - \lambda(A_{s}^{N})| \leqslant \sum_{n \leqslant N}\lambda\big(I_{n}(t)\,\triangle\,I_{n}(s)\big) \leqslant \sum_{n \leqslant N}2n|t - s|,$$
     de sorte que $t \mapsto \lambda(A_{t}^{N})$ est continue. Limite uniforme de fonctions continues, $g$ est continue, et prend toutes les valeurs de $[1, 2]$.
