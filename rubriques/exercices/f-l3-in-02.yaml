  enonce: |
    Montrer que $\lambda_{n}$ est l'unique mesure sur la tribu de Lebesgue $\mathcal{M}(\mathbb{R}^{n})$ qui vérifie $\lambda_{n}(P) = \operatorname{vol}(P)$ pour tout pavé ouvert borné $P$ de $\mathbb{R}^{n}$ (on pourra utiliser la proposition 18 du chapitre 1 et la proposition 16 du cours).
  corrige: |
    Soit $\mu$ une telle mesure. Les pavés ouverts bornés, complétés par $\emptyset$, forment un $\pi$-système (l'intersection de deux pavés ouverts est un pavé ouvert, éventuellement vide) qui engendre $\mathcal{B}(\mathbb{R}^{n})$ (chapitre 1, prop. 10), et les pavés $]-k, k[^{n}$ recouvrent $\mathbb{R}^{n}$ avec des mesures finies : $\mu = \lambda$ sur $\mathcal{B}(\mathbb{R}^{n})$ (chapitre 1, prop. 18). Soit $A \in \mathcal{M}(\mathbb{R}^{n})$ ; par la proposition 16, $A = B \cup N$ avec $B$ borélien et $N = A \setminus B$ contenu dans un borélien $Z$ de mesure nulle. Alors $\mu(N) \leqslant \mu(Z) = \lambda(Z) = 0$, et $\mu(A) = \mu(B) = \lambda(B) = \lambda(A)$.
- id: "l3-in-02-13"
  feuille: "f-l3-in-02"
  numero: 13
  partie: "Unicité et régularité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [unicité et régularité]
  noeuds: [m-regularite, m-lebesgue]
  notions: [mesure-reguliere]
  source: "M61B TD3, exercice 5"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $\mu$ une mesure finie sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$. On veut montrer que, pour tout borélien $A$, 
    $$\mu(A) = \sup\{\mu(F) \,;\, F \text{ fermé}, F \subset A\} = \inf\{\mu(U) \,;\, U \text{ ouvert}, A \subset U\}.$$

    **1.** Montrer qu'il suffit de prouver que tout borélien $A$ vérifie la propriété (P) : pour tout $\varepsilon > 0$, il existe un fermé $F$ et un ouvert $U$ tels que $F \subset A \subset U$ et $\mu(U \setminus F) \leqslant \varepsilon$.

    **2.** Soit $\mathcal{G}$ l'ensemble des boréliens qui vérifient (P).

    **(a)** Montrer que $\mathcal{G}$ contient les ouverts. Pour un ouvert $A$, on considérera les fermés $F_{p} = \{x \,;\, d(x, {A}^{c}) \geqslant 1/p\}$, $p \geqslant 1$.

    **(b)** Montrer que $\mathcal{G}$ est stable par passage au complémentaire et par réunion dénombrable.

    **(c)** Conclure.

    **3.** La mesure de Lebesgue n'est pas finie. Montrer cependant que la conclusion vaut pour $\lambda$, et comparer avec la proposition 11 du cours. Peut-on remplacer « fermé » par « compact » ?
  corrige: |
    **1.** Si $F \subset A \subset U$ et $\mu(U \setminus F) \leqslant \varepsilon$, alors $\mu(A) - \varepsilon \leqslant \mu(F) \leqslant \mu(A) \leqslant \mu(U) \leqslant \mu(A) + \varepsilon$, toutes ces quantités étant finies.

    **2. (a)** Soit $A$ ouvert (si $A = \mathbb{R}$, on prend $F = U = \mathbb{R}$). Les $F_{p}$ sont fermés, puisque $x \mapsto d(x, {A}^{c})$ est continue ; ils sont contenus dans $A$, croissants, et leur réunion est $A$, car tout point de l'ouvert $A$ est à distance non nulle de ${A}^{c}$. Par continuité croissante, $\mu(A \setminus F_{p}) \to 0$, et l'on prend $U = A$, $F = F_{p}$ pour $p$ assez grand.

    **(b)** Si $F \subset A \subset U$, alors ${U}^{c} \subset {A}^{c} \subset {F}^{c}$, avec ${U}^{c}$ fermé, ${F}^{c}$ ouvert et ${F}^{c} \setminus {U}^{c} = U \setminus F$. Soit $(A_{n})$ une suite de $\mathcal{G}$ et $F_{n} \subset A_{n} \subset U_{n}$ avec $\mu(U_{n} \setminus F_{n}) \leqslant \varepsilon 2^{-n-2}$. L'ouvert $U = \mathop{\displaystyle \bigcup} U_{n}$ contient $A = \mathop{\displaystyle \bigcup} A_{n}$. La réunion $\mathop{\displaystyle \bigcup} F_{n}$ n'est pas fermée en général, mais, par continuité croissante, il existe $N$ tel que $F = F_{0} \cup \dots \cup F_{N}$, qui est fermé, vérifie $\mu\big(\mathop{\displaystyle \bigcup_{n}}F_{n} \setminus F\big) \leqslant \dfrac{\varepsilon}{2}$. Alors $U \setminus F \subset \mathop{\displaystyle \bigcup_{n}}(U_{n} \setminus F_{n}) \cup \big(\mathop{\displaystyle \bigcup_{n}}F_{n} \setminus F\big)$, de mesure au plus $\varepsilon$.

    **(c)** $\mathcal{G}$ est une tribu qui contient les ouverts : elle contient $\mathcal{B}(\mathbb{R})$. C'est encore la méthode des bons ensembles.

    **3.** Soit $A$ un borélien, $\varepsilon > 0$ et $A_{k} = A \cap [k, k + 1[$, $k \in \mathbb{Z}$. La mesure finie $\mu_{k} = \lambda(\,\cdot\, \cap ]k - 1, k + 2[)$ fournit un ouvert $U_{k} \supset A_{k}$ avec $\mu_{k}(U_{k} \setminus A_{k}) \leqslant \varepsilon 2^{-|k|-2}$ ; quitte à le remplacer par $U_{k} \cap ]k - 1, k + 2[$, on a $\lambda(U_{k} \setminus A_{k}) \leqslant \varepsilon 2^{-|k|-2}$. L'ouvert $U = \mathop{\displaystyle \bigcup} U_{k}$ contient $A$ et $\lambda(U \setminus A) \leqslant \varepsilon$. En appliquant ceci à ${A}^{c}$, on obtient un fermé $F = {U'}^{c} \subset A$ avec $\lambda(A \setminus F) \leqslant \varepsilon$. Enfin, $F \cap [-k, k]$ est compact et $\lambda(F \cap [-k, k]) \to \lambda(F)$ : on peut remplacer « fermé » par « compact », même si $\lambda(A) = +\infty$. On retrouve la proposition 11 du cours, démontrée là par la construction de $\lambda$, ici par la seule méthode des bons ensembles.
- id: "l3-in-02-14"
  feuille: "f-l3-in-02"
  numero: 14
  partie: "Unicité et régularité"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [unicité et régularité, parties négligeables]
  noeuds: [m-regularite, m-lebesgue]
  notions: [mesure-reguliere, negligeable]
  source: "TD2 Paris-Dauphine, exercice 13"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $\mu$ une mesure sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$. Son *support* est 
    $$S = \big\{x \in \mathbb{R} \,;\, \mu([x - r, x + r]) > 0 \text{ pour tout } r > 0\big\}.$$

    **1.** Montrer que $S$ est fermé et que $\mu(\mathbb{R} \setminus S) = 0$ (on pourra recouvrir $\mathbb{R} \setminus S$ par des intervalles à extrémités rationnelles).

    **2.** Montrer que, pour tout fermé $F$ strictement contenu dans $S$, $\mu(S \setminus F) = \mu(\mathbb{R} \setminus F) > 0$ : $S$ est le plus petit fermé de complémentaire négligeable.

    **3.** Déterminer le support de $\delta_{a}$, de $\lambda$, de la mesure $\mathop{\displaystyle \sum_{k \geqslant 1}}2^{-k}\delta_{1/k}$, et de la mesure $\mathop{\displaystyle \sum_{k}}2^{-k}\delta_{r_{k}}$, où $(r_{k})$ est une énumération de $\mathbb{Q}$.
  corrige: |
    **1.** Si $x \notin S$, il existe $r > 0$ tel que $\mu([x - r, x + r]) = 0$, et pour $|y - x| < \dfrac{r}{2}$, $[y - \dfrac{r}{2}, y + \dfrac{r}{2}] \subset [x - r, x + r]$ : $y \notin S$. Donc ${S}^{c}$ est ouvert. Chaque $x \notin S$ appartient à un intervalle $]p, q[$ à extrémités rationnelles contenu dans un tel $[x - r, x + r]$, donc de mesure nulle ; il n'y a qu'une infinité dénombrable de tels intervalles, et leur réunion, qui contient ${S}^{c}$, est de mesure nulle.

    **2.** $\mathbb{R} \setminus F$ est la réunion disjointe de $S \setminus F$ et de ${S}^{c} \setminus F$, ce dernier de mesure nulle : $\mu(S \setminus F) = \mu(\mathbb{R} \setminus F)$. Soit $x \in S \setminus F$ ; l'ouvert $\mathbb{R} \setminus F$ contient un segment $[x - r, x + r]$, de mesure non nulle puisque $x \in S$. Si $F$ est un fermé de complémentaire négligeable, $F \cap S$ est un fermé contenu dans $S$ et de complémentaire négligeable ; il ne peut être strictement contenu dans $S$, donc $S \subset F$.

    ![Figure](documents/figures/02e9dab1531c0752.svg)

    La mesure $\mathop{\displaystyle \sum_{k \geqslant 1}}2^{-k}\delta_{1/k}$ : chaque point $\dfrac{1}{k}$ porte la masse $2^{-k}$ (hauteur des traits). Le point $0$, en carmin, ne porte aucune masse, mais toute fenêtre autour de lui contient des points $\dfrac{1}{k}$ chargés : il appartient au support.

    **3.** Le support de $\delta_{a}$ est $\{a\}$, celui de $\lambda$ est $\mathbb{R}$ (exercice 2). Celui de $\mathop{\displaystyle \sum_{k \geqslant 1}}2^{-k}\delta_{1/k}$ est $\{\dfrac{1}{k} \,;\, k \geqslant 1\} \cup \{0\}$ : le point $0$ y figure alors que $\mu(\{0\}) = 0$. Celui de $\mathop{\displaystyle \sum_{k}}2^{-k}\delta_{r_{k}}$ est $\mathbb{R}$ tout entier, puisque tout intervalle contient des rationnels, alors que la mesure est portée par l'ensemble dénombrable $\mathbb{Q}$ : le support est le plus petit *fermé* portant la mesure, pas la plus petite partie.
- id: "l3-in-02-15"
  feuille: "f-l3-in-02"
  numero: 15
  partie: "Le point de vue de Carathéodory"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [Carathéodory, mesure extérieure]
  noeuds: [m-caratheodory]
  notions: [mesure-exterieure]
  source: "Exo7, B. Tumpach (fic00143), exercices 1 et 3"
  page_enonce: 5
  page_corrige: 7
  enonce: |
    Une *mesure extérieure* sur $\Omega$ est une application $m^{*} : \mathcal{P}(\Omega) \to [0, +\infty]$ telle que $m^{*}(\emptyset) = 0$, croissante, et $\sigma$-sous-additive : $m^{*}\big(\mathop{\displaystyle \bigcup_{i}}A_{i}\big) \leqslant \mathop{\displaystyle \sum_{i}}m^{*}(A_{i})$. Une partie $A$ est *$m^{*}$-mesurable* si 
    $$m^{*}(Q) \geqslant m^{*}(Q \cap A) + m^{*}(Q \cap {A}^{c}) \qquad \text{pour toute partie } Q \subset \Omega.$$
     On note $\mathcal{M}_{m^{*}}$ l'ensemble des parties $m^{*}$-mesurables. Le *théorème de Carathéodory* affirme que $\mathcal{M}_{m^{*}}$ est une tribu, que la restriction $m$ de $m^{*}$ à $\mathcal{M}_{m^{*}}$ est une mesure, et que l'espace mesuré $(\Omega, \mathcal{M}_{m^{*}}, m)$ est complet.

    **1.** Justifier qu'on a en fait l'égalité $m^{*}(Q) = m^{*}(Q \cap A) + m^{*}(Q \cap {A}^{c})$ pour $A$ mesurable. Montrer que $\emptyset$, $\Omega \in \mathcal{M}_{m^{*}}$ et que $\mathcal{M}_{m^{*}}$ est stable par complémentaire.

    **2.** Soit $(A_{i})_{i \geqslant 1}$ une suite de parties $m^{*}$-mesurables, $B_{1} = \emptyset$ et $B_{j} = A_{1} \cup \dots \cup A_{j-1}$ pour $j \geqslant 2$. Soit $Q \subset \Omega$.

    **(a)** Montrer par récurrence que, pour tout $k \geqslant 1$, 
    $$m^{*}(Q) = m^{*}(Q \cap {B_{k+1}}^{c}) + \sum_{j=1}^{k}m^{*}(Q \cap {B_{j}}^{c} \cap A_{j}).$$

    **(b)** Soit $A = \mathop{\displaystyle \bigcup_{j}}A_{j}$. En déduire que $m^{*}(Q) \geqslant m^{*}(Q \cap {A}^{c}) + \mathop{\displaystyle \sum_{j \geqslant 1}}m^{*}(Q \cap {B_{j}}^{c} \cap A_{j})$.

    **(c)** En remarquant que $Q \cap A = \mathop{\displaystyle \bigcup_{j}}(Q \cap {B_{j}}^{c} \cap A_{j})$, montrer que $A \in \mathcal{M}_{m^{*}}$, puis que $\mathcal{M}_{m^{*}}$ est une tribu.

    **3.** En appliquant la question 2 (b) à $Q = A$ et à une suite disjointe, montrer que $m$ est une mesure.

    **4.** Montrer que toute partie $N$ telle que $m^{*}(N) = 0$ est $m^{*}$-mesurable. En déduire que l'espace mesuré $(\Omega, \mathcal{M}_{m^{*}}, m)$ est complet.

    **5.** *Exemple.* Soit $m^{*}(A) = 0$ si $A = \emptyset$ et $m^{*}(A) = 1$ sinon. Montrer que $m^{*}$ est une mesure extérieure et déterminer $\mathcal{M}_{m^{*}}$ (distinguer selon le nombre d'éléments de $\Omega$). Vérifier le théorème sur cet exemple.
  corrige: |
    **1.** $Q = (Q \cap A) \cup (Q \cap {A}^{c})$, donc la sous-additivité donne l'inégalité inverse, et il y a égalité. Pour $A = \emptyset$ ou $\Omega$, l'un des deux termes est $m^{*}(\emptyset) = 0$. La définition est symétrique en $A$ et ${A}^{c}$.

    **2. (a)** Pour $k = 1$ ($B_{1} = \emptyset$, $B_{2} = A_{1}$), c'est la mesurabilité de $A_{1}$ appliquée à $Q$. Si la formule est vraie au rang $k$, on applique la mesurabilité de $A_{k+1}$ à $Q \cap {B_{k+1}}^{c}$ : 
    $$m^{*}(Q \cap {B_{k+1}}^{c}) = m^{*}(Q \cap {B_{k+1}}^{c} \cap A_{k+1}) + m^{*}(Q \cap {B_{k+2}}^{c}),$$
     puisque ${B_{k+1}}^{c} \cap {A_{k+1}}^{c} = {B_{k+2}}^{c}$ ; on obtient le rang $k + 1$.

    **(b)** ${B_{k+1}}^{c} \supset {A}^{c}$, donc $m^{*}(Q \cap {B_{k+1}}^{c}) \geqslant m^{*}(Q \cap {A}^{c})$ ; on fait tendre $k$ vers $+\infty$ dans l'inégalité obtenue.

    **(c)** Un point de $Q \cap A$ est dans un premier $A_{j}$, donc dans $Q \cap {B_{j}}^{c} \cap A_{j}$. Par $\sigma$-sous-additivité, $m^{*}(Q \cap A) \leqslant \mathop{\displaystyle \sum_{j}}m^{*}(Q \cap {B_{j}}^{c} \cap A_{j})$, et (b) donne $m^{*}(Q) \geqslant m^{*}(Q \cap {A}^{c}) + m^{*}(Q \cap A)$ : $A$ est mesurable. Avec la question 1, $\mathcal{M}_{m^{*}}$ est une tribu.

    **3.** Si les $A_{j}$ sont deux à deux disjoints, ${B_{j}}^{c} \cap A_{j} = A_{j}$. Pour $Q = A$, la question 2 (b) donne 
    $$m^{*}(A) \geqslant m^{*}(\emptyset) + \sum_{j}m^{*}(A_{j}),$$
     et la $\sigma$-sous-additivité l'inégalité inverse : $m$ est $\sigma$-additive.

    **4.** Si $m^{*}(N) = 0$, alors $m^{*}(Q \cap N) + m^{*}(Q \cap {N}^{c}) \leqslant 0 + m^{*}(Q)$ par croissance : $N$ est mesurable. Si $E \in \mathcal{M}_{m^{*}}$ vérifie $m(E) = 0$ et $N \subset E$, alors $m^{*}(N) = 0$ et $N$ est mesurable : l'espace est complet.

    **5.** $m^{*}$ est croissante (une partie contenant une partie non vide est non vide) et $\sigma$-sous-additive (si la réunion est non vide, l'une des parties l'est, et la somme vaut au moins $1$). Si $A$ et ${A}^{c}$ sont non vides, $Q = \Omega$ donne $m^{*}(Q \cap A) + m^{*}(Q \cap {A}^{c}) = 2 > 1 = m^{*}(\Omega)$ : $A$ n'est pas mesurable. Ainsi $\mathcal{M}_{m^{*}} = \{\emptyset, \Omega\}$ (qui est $\mathcal{P}(\Omega)$ si $\Omega$ a au plus un élément), et $m(\Omega) = 1$ si $\Omega \neq \emptyset$. C'est bien une tribu, $m$ une mesure, et l'espace est complet, puisque la seule partie de mesure nulle est $\emptyset$. Lorsque $\Omega$ a au moins deux points, $m^{*}$ n'est pas additive : la tribu de Carathéodory élimine exactement les parties qui empêchaient $m^{*}$ d'être une mesure.
