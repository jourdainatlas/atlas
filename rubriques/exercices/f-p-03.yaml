  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel, famille-libre]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    On souhaite automatiser les tests de colinéarité et le calcul du point d'intersection de deux droites. On dispose de la fonction suivante :

    ```python
    def determinant(x, y, xp, yp):
        return x*yp - xp*y
    ```

    **1.** Que renvoie l'appel `determinant(3, -2, -6, 4)` ? Interpréter ce résultat.

    **2.** Écrire une fonction `sont_colineaires(x, y, xp, yp)` qui renvoie `True` si les deux vecteurs sont colinéaires, et `False` sinon. On réutilisera la fonction `determinant`.

    **3.** Écrire une fonction `alignes(xA, yA, xB, yB, xC, yC)` qui renvoie `True` si les trois points sont alignés. Quelles coordonnées de vecteurs faut-il calculer au préalable ?

    **4.** Tester cette fonction sur les quatre triplets de points de l'exercice 16.

    **5.** Recopier et compléter la fonction suivante, qui renvoie les coordonnées du point d'intersection des droites d'équations $ax+by+c=0$ et $a'x+b'y+c'=0$, ou `None` si ce point n'existe pas :

    ```python
    def intersection(a, b, c, ap, bp, cp):
        d = determinant(a, b, ap, bp)
        if ... :
            return None
        x = (b*cp - bp*c) / d
        y = (ap*c - a*cp) / d
        return (x, y)
    ```

    **6.** Tester cette fonction sur les trois cas de l'exercice 24.

    **7.** Le test d'égalité à $0$ est délicat lorsque les coefficients sont des nombres décimaux. Expliquer pourquoi, et proposer une amélioration du test.
  corrige: |
    **1.** L'appel calcule $3\times 4-(-6)\times(-2)=12-12$, donc 
    $$\boxed{\texttt{determinant(3, -2, -6, 4)} \text{ renvoie } 0}$$
     Le déterminant étant nul, les vecteurs $\begin{pmatrix}3\\-2\end{pmatrix}$ et $\begin{pmatrix}-6\\4\end{pmatrix}$ sont colinéaires — c'est le cas a) de l'exercice 14.

    **2.** 

    ```python
    def sont_colineaires(x, y, xp, yp):
        return determinant(x, y, xp, yp) == 0
    ```

     *On n'écrit pas* `if ... : return True else: return False` : le test `== 0` produit déjà directement un booléen.

    **3.** Il faut d'abord calculer les coordonnées de $\overrightarrow{AB}$ et $\overrightarrow{AC}$, c'est-à-dire les différences des coordonnées, puis tester leur colinéarité : 

    ```python
    def alignes(xA, yA, xB, yB, xC, yC):
        return sont_colineaires(xB - xA, yB - yA, xC - xA, yC - yA)
    ```

    **4.** On obtient successivement : 
    $$\texttt{False} \qquad \texttt{True} \qquad \texttt{False} \qquad \texttt{True}$$
     ce qui correspond bien aux réponses de l'exercice 16 : seuls les triplets b) et d) sont alignés.

    **5.** La condition manquante teste la nullité du déterminant, c'est-à-dire le parallélisme : 

    ```python
    def intersection(a, b, c, ap, bp, cp):
        d = determinant(a, b, ap, bp)
        if d == 0:
            return None
        x = (b*cp - bp*c) / d
        y = (ap*c - a*cp) / d
        return (x, y)
    ```

    **6.** Pour les cas 1 et 2 de l'exercice 24, la fonction renvoie `None`. Pour le cas 3 : 
    $$\texttt{intersection(28, 95, -6286, 45, -1, -3648)} \longrightarrow \texttt{(82.0, 42.0)}$$

    $$\boxed{\text{On retrouve bien le point } (82\,;42).}$$
     *Limite du programme :* il ne distingue pas les droites strictement parallèles des droites confondues, alors que le premier cas n'a aucune solution et le second une infinité. Il faudrait pour cela tester en plus si un point de la première droite vérifie la seconde équation.

    **7.** Les nombres décimaux sont stockés de façon approchée en machine : un calcul qui devrait donner exactement $0$ peut produire une valeur minuscule mais non nulle, comme $1{,}1\times 10^{-16}$. Le test `d == 0` serait alors faux, et le programme conclurait à tort que les droites sont sécantes. On remplace donc l'égalité stricte par un test de proximité : 

    ```python
        if abs(d) < 1e-10:
            return None
    ```
- id: "p-03-30"
  feuille: "f-p-03"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées, norme et distance, parallélisme, parallélogramme, équations de droite, "systèmes d'équations", intersection de droites]
  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel]
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Le plan est muni d'un repère $\left(O\,;\vec{\imath},\vec{\jmath}\right)$. On considère les points 
    $$A(-3\,;1) \qquad B(1\,;3) \qquad C(5\,;-1) \qquad D(1\,;-3)$$

    **Partie A : nature du quadrilatère $ABCD$**

    **1.** Déterminer les coordonnées des vecteurs $\overrightarrow{AB}$ et $\overrightarrow{DC}$. Que peut-on en déduire pour le quadrilatère $ABCD$ ?

    **2.** Calculer les longueurs $AB$ et $BC$. Le quadrilatère $ABCD$ est-il un losange ?

    **3.** Calculer les longueurs des diagonales $AC$ et $BD$. Le quadrilatère $ABCD$ est-il un rectangle ?

    **4.** Déterminer les coordonnées du centre $I$ de ce parallélogramme.

    **Partie B : équations de droites**

    **5.** Déterminer une équation cartésienne de la droite $(AB)$.

    **6.** Déterminer une équation cartésienne de la droite $(CD)$, et retrouver ainsi le parallélisme établi à la question 1.

    **7.** Déterminer une équation cartésienne de chacune des droites $(AC)$ et $(BD)$.

    **8.** Le point $E(9\,;7)$ appartient-il à la droite $(AB)$ ? Et le point $F(2\,;4)$ ?

    **9.** Déterminer les coordonnées du point de la droite $(AB)$ dont l'ordonnée est nulle.

    **Partie C : intersection des diagonales**

    **10.** Justifier que les droites $(AC)$ et $(BD)$ sont sécantes.

    **11.** Résoudre le système formé par leurs deux équations cartésiennes.

    **12.** Comparer le résultat obtenu avec celui de la question 4, et conclure.
  corrige: |
    **Partie A : nature du quadrilatère $ABCD$**

    ![Figure](documents/figures/63c45528e5b1c524.svg)

    **1.** $\overrightarrow{AB}\begin{pmatrix}1-(-3)\\3-1\end{pmatrix}=\begin{pmatrix}4\\2\end{pmatrix}$ et $\overrightarrow{DC}\begin{pmatrix}5-1\\-1-(-3)\end{pmatrix}=\begin{pmatrix}4\\2\end{pmatrix}$.

    On constate que $\overrightarrow{AB}=\overrightarrow{DC}$, donc $\boxed{ABCD \text{ est un parallélogramme.}}$

    **2.** $AB=\sqrt{4^{2}+2^{2}}=\sqrt{20}=2\sqrt{5}\approx 4{,}47$ et, avec $\overrightarrow{BC}\begin{pmatrix}4\\-4\end{pmatrix}$, $\;BC=\sqrt{32}=4\sqrt{2}\approx 5{,}66$.

    Ces deux côtés consécutifs n'ont pas la même longueur : 
    $$\boxed{ABCD \text{ n'est pas un losange.}}$$

    **3.** $\overrightarrow{AC}\begin{pmatrix}8\\-2\end{pmatrix}$ donne $AC=\sqrt{68}=2\sqrt{17}\approx 8{,}25$, et $\overrightarrow{BD}\begin{pmatrix}0\\-6\end{pmatrix}$ donne $BD=6$.

    Les diagonales n'ont pas la même longueur : 
    $$\boxed{ABCD \text{ n'est pas un rectangle : c'est un parallélogramme quelconque.}}$$

    **4.** Le centre est le milieu de $[AC]$ : 
    $$I\left(\frac{-3+5}{2}\,;\frac{1-1}{2}\right)=\boxed{I(1\,;0)}$$
     *Vérification* avec $[BD]$ : $\left(\frac{1+1}{2}\,;\frac{3-3}{2}\right)=(1\,;0)$.

    **Partie B : équations de droites**

    **5.** $\overrightarrow{AB}\begin{pmatrix}4\\2\end{pmatrix}$ se simplifie en $\begin{pmatrix}2\\1\end{pmatrix}$, donc $b=-2$ et $a=1$ : l'équation est $x-2y+c=0$. Avec $A(-3\,;1)$ : 
    $$-3-2+c=0 \iff c=5 \qquad\text{soit}\qquad \boxed{(AB) : x-2y+5=0}$$
     *Vérification* avec $B(1\,;3)$ : $1-6+5=0$.

    **6.** $\overrightarrow{DC}=\overrightarrow{AB}$, donc $(CD)$ a le même vecteur directeur et son équation est de la forme $x-2y+c=0$. Avec $D(1\,;-3)$ : 
    $$1+6+c=0 \iff c=-7 \qquad\text{soit}\qquad \boxed{(CD) : x-2y-7=0}$$
     Les deux équations ont les mêmes coefficients $a$ et $b$ mais des constantes différentes ($5\neq -7$) : 
    $$\boxed{(AB) \text{ et } (CD) \text{ sont strictement parallèles.}}$$
     On retrouve bien le parallélisme des côtés opposés du parallélogramme.

    **7.** $\overrightarrow{AC}\begin{pmatrix}8\\-2\end{pmatrix}$ se simplifie en $\begin{pmatrix}4\\-1\end{pmatrix}$, donc $b=-4$ et $a=-1$ : l'équation est $-x-4y+c=0$. Avec $A(-3\,;1)$ : $3-4+c=0$, donc $c=1$ : 
    $$\boxed{(AC) : x+4y-1=0}$$
     $B$ et $D$ ont la même abscisse $1$ : la droite est verticale. 
    $$\boxed{(BD) : x-1=0}$$

    **8.** $E(9\,;7)$ : $\;9-14+5=0$, donc $\boxed{E\in(AB)}$.

    $F(2\,;4)$ : $\;2-8+5=-1\neq 0$, donc $\boxed{F\notin(AB)}$.

    **9.** On cherche le point de $(AB)$ tel que $y=0$ : 
    $$x-2\times 0+5=0 \iff x=-5 \qquad\text{soit}\qquad \boxed{(-5\,;0)}$$

    **Partie C : intersection des diagonales**

    **10.** Notons $\vec{u}\begin{pmatrix}4\\-1\end{pmatrix}$ un vecteur directeur de $(AC)$ et $\vec{v}\begin{pmatrix}0\\1\end{pmatrix}$ un vecteur directeur de $(BD)$ : 
    $$\det\left(\vec{u}\,;\vec{v}\right)=4\times 1-0\times(-1)=4\neq 0 \qquad\Longrightarrow\qquad \boxed{\text{les droites sont sécantes.}}$$

    **11.** Le système s'écrit $\begin{cases}x+4y-1=0\\x-1=0\end{cases}$. La seconde équation donne directement $x=1$, et en reportant dans la première : 
    $$1+4y-1=0 \iff 4y=0 \iff y=0$$

    $$\boxed{\text{Le point d'intersection est } (1\,;0).}$$

    **12.** C'est exactement le point $I$ trouvé à la question 4 : 
    $$\boxed{\text{les diagonales d'un parallélogramme se coupent en leur milieu.}}$$
     La résolution du système et le calcul du milieu constituent donc deux méthodes indépendantes qui se confirment mutuellement.
- id: "p-03-31"
  feuille: "f-p-03"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Algorithmique, Calcul]
  mots_cles: [vecteurs, coordonnées, équations de droite, vecteur directeur, intersection de droites]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 10
  page_corrige: 25
  enonce: |
    **Partie A : trois droites**

    On considère les droites suivantes : 
    $$d : 3x+2y-12=0 \qquad d' : x-4y+10=0 \qquad d'' : 6x+4y+5=0$$

    **1.** Donner un vecteur directeur de chacune de ces trois droites.

    **2.** Démontrer que $d$ et $d'$ sont sécantes, puis déterminer les coordonnées de leur point d'intersection $K$.

    **3.** Étudier la position relative de $d$ et $d''$. Sont-elles confondues ?

    **4.** Déterminer une équation cartésienne de la droite passant par $K$ et de vecteur directeur $\vec{n}\begin{pmatrix}1\\1\end{pmatrix}$.

    **Partie B : une application**

    Un club de sport propose deux formules :

    • **Formule A** : $12$ € d'inscription, puis $3$ € par séance ;

    • **Formule B** : $30$ € d'inscription, puis $1{,}50$ € par séance.

    On note $n$ le nombre de séances effectuées dans l'année.

    **5.** Exprimer, en fonction de $n$, le coût annuel $y_A$ de la formule A et le coût annuel $y_B$ de la formule B.

    **6.** Interpréter chacune de ces deux expressions comme l'équation réduite d'une droite. Ces deux droites sont-elles sécantes ? Justifier à l'aide de vecteurs directeurs.

    **7.** Déterminer, par le calcul, le nombre de séances pour lequel les deux formules reviennent au même prix, ainsi que ce prix.

    **8.** Quelle formule conseiller à un adhérent prévoyant $20$ séances dans l'année ?
  corrige: |
    **Partie A : trois droites**

    **1.** On lit $\begin{pmatrix}-b\\a\end{pmatrix}$ sur chaque équation : 
    $$d : \boxed{\begin{pmatrix}-2\\3\end{pmatrix}} \qquad d' : \boxed{\begin{pmatrix}4\\1\end{pmatrix}} \qquad d'' : \boxed{\begin{pmatrix}-4\\6\end{pmatrix}}$$

    **2.** $\det\left(\begin{pmatrix}-2\\3\end{pmatrix};\begin{pmatrix}4\\1\end{pmatrix}\right) =-2\times 1-4\times 3=-14\neq 0$, donc $\boxed{d \text{ et } d' \text{ sont sécantes.}}$

    La seconde équation donne $x=4y-10$. En reportant dans la première : 
    $$3(4y-10)+2y-12=0 \iff 12y-30+2y-12=0 \iff 14y=42 \iff y=3$$
     puis $x=4\times 3-10=2$. 
    $$\boxed{K(2\,;3)}$$
     *Vérification :* $3\times 2+2\times 3-12=6+6-12=0$.

    **3.** $\det\left(\begin{pmatrix}-2\\3\end{pmatrix};\begin{pmatrix}-4\\6\end{pmatrix}\right) =-2\times 6-(-4)\times 3=-12+12=0$ : les droites $d$ et $d''$ sont **parallèles**.

    Sont-elles confondues ? En multipliant l'équation de $d$ par $2$, on obtient $6x+4y-24=0$, alors que $d''$ a pour équation $6x+4y+5=0$. Les constantes diffèrent, donc 
    $$\boxed{d \text{ et } d'' \text{ sont strictement parallèles.}}$$

    **4.** Le vecteur $\begin{pmatrix}1\\1\end{pmatrix}$ impose $b=-1$ et $a=1$ : l'équation est $x-y+c=0$. Avec $K(2\,;3)$ : 
    $$2-3+c=0 \iff c=1 \qquad\text{soit}\qquad \boxed{x-y+1=0}$$

    **Partie B : une application**

    **5.** Le coût est composé d'une part fixe et d'une part proportionnelle au nombre de séances : 
    $$\boxed{y_A=3n+12} \qquad\text{et}\qquad \boxed{y_B=1{,}5n+30}$$

    **6.** Ce sont deux équations réduites de droites, de coefficients directeurs respectifs $3$ et $1{,}5$, donc de vecteurs directeurs $\vec{u}\begin{pmatrix}1\\3\end{pmatrix}$ et $\vec{v}\begin{pmatrix}1\\1{,}5\end{pmatrix}$ : 
    $$\det\left(\vec{u}\,;\vec{v}\right)=1\times 1{,}5-1\times 3=-1{,}5\neq 0 \qquad\Longrightarrow\qquad \boxed{\text{les droites sont sécantes.}}$$

    **7.** Les deux formules coûtent le même prix lorsque $y_A=y_B$ : 
    $$3n+12=1{,}5n+30 \iff 1{,}5n=18 \iff n=12$$
     puis $y_A=3\times 12+12=48$. 
    $$\boxed{\text{Les deux formules reviennent au même pour } 12 \text{ séances, soit } 48~\text{€.}}$$

    ![Figure](documents/figures/b9ac6672151e6d6a.svg)

    **8.** Pour $n=20$ séances : 
    $$y_A=3\times 20+12=72~\text{€} \qquad\text{et}\qquad y_B=1{,}5\times 20+30=60~\text{€}$$

    $$\boxed{\text{Il faut conseiller la formule B, moins chère de } 12~\text{€.}}$$
     *Lecture graphique :* au-delà de $12$ séances, la droite de la formule B passe en dessous de celle de la formule A. La formule A n'est intéressante que pour une pratique occasionnelle.
- id: "p-03-32"
  feuille: "f-p-03"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [vecteurs, coordonnées, norme et distance, colinéarité, alignement, parallélisme, équations de droite, vecteur directeur]
  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel, famille-libre]
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. Les vecteurs $\vec{u}\begin{pmatrix}2\\-5\end{pmatrix}$ et $\vec{v}\begin{pmatrix}-6\\15\end{pmatrix}$ sont ¦ colinéaires ¦ non colinéaires ¦ de même sens
    2. Si $A(1\,;2)$ et $B(4\,;8)$, alors $\overrightarrow{AB}$ a pour coordonnées ¦ $(3\,;6)$ ¦ $(5\,;10)$ ¦ $(-3\,;-6)$
    3. La norme du vecteur $\vec{u}\begin{pmatrix}-3\\4\end{pmatrix}$ vaut ¦ $1$ ¦ $5$ ¦ $7$
    4. Un vecteur directeur de la droite d'équation $5x-2y+1=0$ est ¦ $\begin{pmatrix}5\\-2\end{pmatrix}$ ¦ $\begin{pmatrix}2\\5\end{pmatrix}$ ¦ $\begin{pmatrix}-2\\5\end{pmatrix}$
    5. La droite d'équation $y=4$ est ¦ parallèle à $(Ox)$ ¦ parallèle à $(Oy)$ ¦ passe par l'origine
    6. Le système $\begin{cases} x+y=5 \\ 2x+2y=10\end{cases}$ admet ¦ une unique solution ¦ aucune solution ¦ une infinité de solutions
    7. Les points $A(1\,;1)$, $B(3\,;5)$ et $C(0\,;-1)$ sont ¦ alignés ¦ non alignés ¦ confondus
    8. Si $\det\left(\vec{u}\,;\vec{v}\right)=7$, alors deux droites de vecteurs directeurs $\vec{u}$ et $\vec{v}$ sont ¦ parallèles ¦ sécantes ¦ confondues
    ```
  corrige: |
    **1.** **Réponse A.** $\det\left(\vec{u}\,;\vec{v}\right)=2\times 15-(-6)\times(-5)=30-30=0$ : les vecteurs sont colinéaires. La réponse C est fausse car $\vec{v}=-3\vec{u}$ : le coefficient étant négatif, ils sont de *sens contraire*.

    **2.** **Réponse A.** $\overrightarrow{AB}\begin{pmatrix}4-1\\8-2\end{pmatrix} =\begin{pmatrix}3\\6\end{pmatrix}$. La réponse B additionne les coordonnées au lieu de les soustraire, la réponse C inverse le sens du vecteur.

    **3.** **Réponse B.** $\|\vec{u}\|=\sqrt{(-3)^{2}+4^{2}}=\sqrt{9+16}=\sqrt{25}=5$.

    **4.** **Réponse B.** Avec $a=5$ et $b=-2$, le vecteur directeur est $\begin{pmatrix}-b\\a\end{pmatrix}=\begin{pmatrix}2\\5\end{pmatrix}$. La réponse A est le piège classique (lire $\begin{pmatrix}a\\b\end{pmatrix}$).

    **5.** **Réponse A.** Tous les points de cette droite ont la même ordonnée $4$ : la droite est horizontale, donc parallèle à l'axe des abscisses. Elle ne passe pas par l'origine, puisque $0\neq 4$.

    **6.** **Réponse C.** La seconde équation est exactement le double de la première : les deux droites sont confondues, et tout point de la droite $x+y=5$ est solution.

    **7.** **Réponse A.** $\overrightarrow{AB}\begin{pmatrix}2\\4\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}-1\\-2\end{pmatrix}$ donnent $\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=2\times(-2)-(-1)\times 4=-4+4=0$ : les points sont alignés.

    **8.** **Réponse B.** Un déterminant non nul signifie que les vecteurs directeurs ne sont pas colinéaires, donc que les droites ne sont pas parallèles : elles sont sécantes.
- id: "p-03-33"
  feuille: "f-p-03"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["systèmes d'équations", identité remarquable]
  noeuds: [v-determinant]
  notions: []
  page_enonce: 11
  page_corrige: 27
  enonce: |
    **1.** Montrer l'égalité, valable pour tous réels $x$ et $y$ : 
    $$(x+y)^{2}=(x-y)^{2}+4xy$$

    **2.** La différence de deux nombres $x$ et $y$ est $6$ et leur produit $216$. Quels sont ces nombres ? *On prendra garde à ne pas oublier de solution.*

    **3.** Trouver les dimensions d'un terrain rectangulaire de périmètre $44$ m et d'aire $120$ m$^{2}$. *On pourra utiliser l'égalité de la question 1 sous la forme $(x-y)^{2}=(x+y)^{2}-4xy$.*

    **4.** Existe-t-il un terrain rectangulaire de périmètre $44$ m et d'aire $150$ m$^{2}$ ? Justifier à l'aide de la même méthode.
  corrige: |
    **1.** On développe le membre de droite : 
    $$(x-y)^{2}+4xy=x^{2}-2xy+y^{2}+4xy=x^{2}+2xy+y^{2}=\boxed{(x+y)^{2}}$$
     L'égalité est donc vraie pour tous réels $x$ et $y$.

    **2.** On sait que $x-y=6$ et $xy=216$. L'égalité précédente donne : 
    $$(x+y)^{2}=(x-y)^{2}+4xy=6^{2}+4\times 216=36+864=900$$
     Donc $x+y=30$ **ou** $x+y=-30$ : un carré égal à $900$ admet deux racines opposées.

    **Premier cas :** $\begin{cases}x+y=30\\x-y=6\end{cases}$ donne $2x=36$, soit $x=18$ et $y=12$.

    **Second cas :** $\begin{cases}x+y=-30\\x-y=6\end{cases}$ donne $2x=-24$, soit $x=-12$ et $y=-18$. 
    $$\boxed{\text{Les deux couples solutions sont } (18\,;12) \text{ et } (-12\,;-18).}$$
     *Vérification du second :* $(-12)-(-18)=6$ et $(-12)\times(-18)=216$.

    *Piège classique :* oublier la racine négative revient à perdre la moitié des solutions.

    **3.** Notons $x$ et $y$ les dimensions du terrain. Le périmètre donne $2(x+y)=44$, soit $x+y=22$, et l'aire donne $xy=120$. On utilise l'égalité sous la forme annoncée : 
    $$(x-y)^{2}=(x+y)^{2}-4xy=22^{2}-4\times 120=484-480=4$$
     Donc $x-y=2$ (on peut choisir $x\geqslant y$, ce qui écarte la valeur $-2$). Il reste : 
    $$\begin{cases}x+y=22\\x-y=2\end{cases} \iff \begin{cases}x=12\\y=10\end{cases}$$

    $$\boxed{\text{Le terrain mesure } 12~\text{m sur } 10~\text{m.}}$$
     *Vérification :* périmètre $2\times 22=44$ m et aire $12\times 10=120$ m$^{2}$.

    **4.** On procède de la même manière avec $x+y=22$ et $xy=150$ : 
    $$(x-y)^{2}=484-4\times 150=484-600=-116$$
     Or un carré ne peut pas être négatif : 
    $$\boxed{\text{Un tel terrain n'existe pas.}}$$
     **Interprétation.** À périmètre fixé, l'aire d'un rectangle est maximale lorsqu'il est *carré*. Ici, le carré de périmètre $44$ m a pour côté $11$ m et pour aire $121$ m$^{2}$ : aucune aire supérieure n'est atteignable, et $150>121$.
