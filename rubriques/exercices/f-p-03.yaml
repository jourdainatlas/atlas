- id: "p-03-01"
  feuille: "f-p-03"
  numero: 1
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    ![Figure](documents/figures/ddb140b40c0ca379.svg)

    D'après le repère $\left(O\,;\vec{\imath},\vec{\jmath}\right)$ ci-dessus, déterminer :

    **1.** Les coordonnées des points $A$, $B$, $C$, $D$, $E$, $F$, $G$ et $H$.

    **2.** Les coordonnées des vecteurs $\vec{u}$, $\vec{v}$, $\vec{w}$ et $\vec{z}$.

    **3.** Les coordonnées des vecteurs $\vec{u}+\vec{v}$, $\;2\vec{w}+\vec{u}$ et $\;\vec{z}-2\vec{v}$.

    **4.** Lire sur la figure les coordonnées du vecteur $\overrightarrow{GD}$, puis les retrouver par le calcul.
  corrige: |
    **1.** On lit les coordonnées en se déplaçant *le long du quadrillage* : d'abord un nombre de « pas » parallèlement à $\vec{\imath}$, puis parallèlement à $\vec{\jmath}$.

    • $A(2\,;-1)$

    • $B(3\,;1)$

    • $C(4\,;2)$

    • $D(1\,;2)$

    • $E(0\,;2)$

    • $F(2\,;0)$

    • $G(-2\,;1)$

    • $H(-1\,;-2)$

    *On remarque que* $E$ est situé sur l'axe des ordonnées (son abscisse est nulle) et $F$ sur l'axe des abscisses (son ordonnée est nulle). Le repère n'étant pas orthonormé, il ne faut surtout pas lire les coordonnées « à l'horizontale et à la verticale ».

    **2.** Les coordonnées d'un vecteur $\overrightarrow{AB}$ s'obtiennent par $\overrightarrow{AB}\begin{pmatrix}x_B-x_A\\y_B-y_A\end{pmatrix}$, ou directement par lecture du déplacement : 
    $$\boxed{\vec{u}\begin{pmatrix}1\\2\end{pmatrix}} \qquad \boxed{\vec{v}\begin{pmatrix}2\\-1\end{pmatrix}} \qquad \boxed{\vec{w}\begin{pmatrix}-1\\1\end{pmatrix}} \qquad \boxed{\vec{z}\begin{pmatrix}3\\0\end{pmatrix}}$$
     Par exemple $\vec{u}=\overrightarrow{AB}$ avec $A(2\,;-1)$ et $B(3\,;1)$, ce qui donne bien $(3-2\,;1-(-1))=(1\,;2)$.

    **3.** On additionne coordonnée par coordonnée, et l'on multiplie chaque coordonnée par le réel : 
    $$\vec{u}+\vec{v}=\begin{pmatrix}1+2\\2-1\end{pmatrix}=\boxed{\begin{pmatrix}3\\1\end{pmatrix}}$$

    $$2\vec{w}+\vec{u}=\begin{pmatrix}-2\\2\end{pmatrix}+\begin{pmatrix}1\\2\end{pmatrix} =\boxed{\begin{pmatrix}-1\\4\end{pmatrix}}$$

    $$\vec{z}-2\vec{v}=\begin{pmatrix}3\\0\end{pmatrix}-\begin{pmatrix}4\\-2\end{pmatrix} =\boxed{\begin{pmatrix}-1\\2\end{pmatrix}}$$
     *Piège classique :* dans $\vec{z}-2\vec{v}$, le facteur $2$ multiplie **les deux** coordonnées de $\vec{v}$, et le signe $-$ porte ensuite sur les deux résultats.

    **4.** Par lecture : pour aller de $G$ à $D$, on avance de $3$ pas parallèlement à $\vec{\imath}$ et de $1$ pas parallèlement à $\vec{\jmath}$. Par le calcul : 
    $$\overrightarrow{GD}\begin{pmatrix}1-(-2)\\2-1\end{pmatrix}=\boxed{\begin{pmatrix}3\\1\end{pmatrix}}$$
     On retrouve d'ailleurs $\overrightarrow{GD}=\vec{u}+\vec{v}$.
- id: "p-03-02"
  feuille: "f-p-03"
  numero: 2
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [vecteurs, relation de Chasles, parallélogramme]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Simplifier les écritures suivantes en utilisant la relation de Chasles :

    **a)** $\vec{u}=\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CA}$

    **b)** $\vec{v}=\overrightarrow{AB}-\overrightarrow{AC}+\overrightarrow{BC}-\overrightarrow{BA}$

    **c)** $\vec{w}=\overrightarrow{MA}-\overrightarrow{MB}-\overrightarrow{AB}$

    **d)** $\vec{t}=\overrightarrow{RS}+\overrightarrow{TR}-\overrightarrow{US}+\overrightarrow{UT}$

    **2.** Démontrer que pour tous les points $A$, $B$ et $C$ : 
    $$\overrightarrow{OA}-\overrightarrow{OB}+\overrightarrow{AC}=\overrightarrow{BC}$$

    **3.** $ABCD$ est un parallélogramme et $M$ un point quelconque. Montrer que : 
    $$\overrightarrow{MA}-\overrightarrow{MB}+\overrightarrow{MC}-\overrightarrow{MD}=\vec{0}$$
  corrige: |
    **1.** On utilise la relation de Chasles $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}$, ainsi que $\overrightarrow{XY}=-\overrightarrow{YX}$.

    **(a)** $\vec{u}=\underbrace{\overrightarrow{AB}+\overrightarrow{BC}}_{=\overrightarrow{AC}}+\overrightarrow{CA} =\overrightarrow{AC}+\overrightarrow{CA}=\overrightarrow{AA}=\boxed{\vec{0}}$

    **(b)** On regroupe astucieusement. D'une part $\overrightarrow{AB}-\overrightarrow{AC}=\overrightarrow{CB}$, d'autre part $-\overrightarrow{BA}=\overrightarrow{AB}$ : 
    $$\vec{v}=\underbrace{\overrightarrow{CB}+\overrightarrow{BC}}_{=\vec{0}}+\overrightarrow{AB}=\boxed{\overrightarrow{AB}}$$

    **(c)** $\overrightarrow{MA}-\overrightarrow{MB}=\overrightarrow{BA}$, donc 
    $$\vec{w}=\overrightarrow{BA}-\overrightarrow{AB}=-\overrightarrow{AB}-\overrightarrow{AB}=\boxed{-2\overrightarrow{AB}=2\overrightarrow{BA}}$$
     *Attention :* $\overrightarrow{MA}-\overrightarrow{MB}$ vaut $\overrightarrow{BA}$ et non $\overrightarrow{AB}$ ; l'ordre compte.

    **(d)** On réordonne : $\overrightarrow{TR}+\overrightarrow{RS}=\overrightarrow{TS}$ et $\overrightarrow{UT}-\overrightarrow{US}=\overrightarrow{ST}$, donc 
    $$\vec{t}=\overrightarrow{TS}+\overrightarrow{ST}=\boxed{\vec{0}}$$

    **2.** On part du membre de gauche : 
    $$\overrightarrow{OA}-\overrightarrow{OB}+\overrightarrow{AC}=\underbrace{\overrightarrow{BA}}_{=\overrightarrow{OA}-\overrightarrow{OB}}+\overrightarrow{AC} =\overrightarrow{BC}$$
     Ce qui nous donne bien l'égalité demandée. *On remarque que* le point $O$ disparaît : le résultat ne dépend pas du point choisi.

    **3.** On regroupe deux par deux : 
    $$\overrightarrow{MA}-\overrightarrow{MB}+\overrightarrow{MC}-\overrightarrow{MD}=\underbrace{\left(\overrightarrow{MA}-\overrightarrow{MB}\right)}_{=\overrightarrow{BA}} +\underbrace{\left(\overrightarrow{MC}-\overrightarrow{MD}\right)}_{=\overrightarrow{DC}}=\overrightarrow{BA}+\overrightarrow{DC}$$
     Or $ABCD$ est un parallélogramme, donc $\overrightarrow{AB}=\overrightarrow{DC}$, c'est-à-dire $\overrightarrow{DC}=-\overrightarrow{BA}$. On en déduit donc : 
    $$\overrightarrow{BA}+\overrightarrow{DC}=\overrightarrow{BA}-\overrightarrow{BA}=\boxed{\vec{0}}$$
- id: "p-03-03"
  feuille: "f-p-03"
  numero: 3
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs, milieu]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Soit $ABC$ un triangle quelconque.

    **1.** Construire le point $D$ tel que $\overrightarrow{AD}=\overrightarrow{AB}+\overrightarrow{AC}$. Montrer que $[AD]$ et $[BC]$ ont le même milieu.

    **2.** Construire le point $E$ tel que $\overrightarrow{AE}=\overrightarrow{BC}$. Montrer que $C$ est le milieu de $[ED]$.

    **3.** On considère les points $M$ et $N$ tels que : 
    $$3\overrightarrow{AM}-2\overrightarrow{BM}=\vec{0} \qquad\text{et}\qquad -2\overrightarrow{NA}+3\overrightarrow{NB}=\vec{0}$$

    **(a)** Exprimer $\overrightarrow{AM}$ en fonction de $\overrightarrow{AB}$, puis placer le point $M$.

    **(b)** En utilisant la même méthode, placer le point $N$.

    **(c)** Soit $I$ le milieu de $[AB]$. Exprimer $\overrightarrow{IM}$ et $\overrightarrow{IN}$ en fonction de $\overrightarrow{AB}$, et en déduire que $I$ est aussi le milieu de $[MN]$.
  corrige: |
    ![Figure](documents/figures/27207c3bff7416a0.svg)

    **1.** Notons $I_1$ le milieu de $[AD]$ et $J$ le milieu de $[BC]$. Alors : 
    $$\overrightarrow{AI_1}=\frac{1}{2}\overrightarrow{AD}=\frac{1}{2}\left(\overrightarrow{AB}+\overrightarrow{AC}\right)$$

    $$\overrightarrow{AJ}=\overrightarrow{AB}+\frac{1}{2}\overrightarrow{BC}=\overrightarrow{AB}+\frac{1}{2}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) =\frac{1}{2}\overrightarrow{AB}+\frac{1}{2}\overrightarrow{AC}$$
     Les deux vecteurs sont égaux, donc $I_1=J$ : 
    $$\boxed{[AD] \text{ et } [BC] \text{ ont le même milieu.}}$$
     *On reconnaît* la propriété des diagonales du parallélogramme $ABDC$.

    **2.** On calcule séparément les deux vecteurs, en passant à chaque fois par $A$ : 
    $$\overrightarrow{EC}=\overrightarrow{EA}+\overrightarrow{AC}=-\overrightarrow{BC}+\overrightarrow{AC} =-\left(\overrightarrow{AC}-\overrightarrow{AB}\right)+\overrightarrow{AC}=\overrightarrow{AB}$$

    $$\overrightarrow{CD}=\overrightarrow{CA}+\overrightarrow{AD}=-\overrightarrow{AC}+\overrightarrow{AB}+\overrightarrow{AC}=\overrightarrow{AB}$$
     On constate que $\overrightarrow{EC}=\overrightarrow{CD}$, donc 
    $$\boxed{C \text{ est le milieu de } [ED].}$$

    **3.** **(a)** On exprime tout à partir du point $A$ : $\overrightarrow{BM}=\overrightarrow{BA}+\overrightarrow{AM}=-\overrightarrow{AB}+\overrightarrow{AM}$. 
    $$3\overrightarrow{AM}-2\overrightarrow{BM}=\vec{0} \iff 3\overrightarrow{AM}-2\left(-\overrightarrow{AB}+\overrightarrow{AM}\right)=\vec{0} \iff \overrightarrow{AM}+2\overrightarrow{AB}=\vec{0}$$

    $$\boxed{\overrightarrow{AM}=-2\overrightarrow{AB}}$$
     Le point $M$ est donc situé sur la droite $(AB)$, du côté opposé à $B$, à une distance $2AB$ de $A$.

    **(b)** De même, $\overrightarrow{NA}=-\overrightarrow{AN}$ et $\overrightarrow{NB}=\overrightarrow{NA}+\overrightarrow{AB}=-\overrightarrow{AN}+\overrightarrow{AB}$ : 
    $$-2\overrightarrow{NA}+3\overrightarrow{NB}=\vec{0} \iff 2\overrightarrow{AN}-3\overrightarrow{AN}+3\overrightarrow{AB}=\vec{0} \iff -\overrightarrow{AN}+3\overrightarrow{AB}=\vec{0}$$

    $$\boxed{\overrightarrow{AN}=3\overrightarrow{AB}}$$

    **(c)** Comme $I$ est le milieu de $[AB]$, on a $\overrightarrow{AI}=\frac{1}{2}\overrightarrow{AB}$, donc $\overrightarrow{IA}=-\frac{1}{2}\overrightarrow{AB}$. Ce qui nous donne : 
    $$\overrightarrow{IM}=\overrightarrow{IA}+\overrightarrow{AM}=-\frac{1}{2}\overrightarrow{AB}-2\overrightarrow{AB}=\boxed{-\frac{5}{2}\overrightarrow{AB}}$$

    $$\overrightarrow{IN}=\overrightarrow{IA}+\overrightarrow{AN}=-\frac{1}{2}\overrightarrow{AB}+3\overrightarrow{AB}=\boxed{\frac{5}{2}\overrightarrow{AB}}$$
     On constate que $\overrightarrow{IM}=-\overrightarrow{IN}$, c'est-à-dire $\overrightarrow{IM}+\overrightarrow{IN}=\vec{0}$ : 
    $$\boxed{I \text{ est bien le milieu de } [MN].}$$
- id: "p-03-04"
  feuille: "f-p-03"
  numero: 4
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [vecteurs, relation de Chasles, alignement]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $ABC$ un triangle, $E$ un point tel que $\overrightarrow{AE}=\dfrac{1}{3}\overrightarrow{BC}$, $I$ un point tel que $\overrightarrow{CI}=\dfrac{2}{3}\overrightarrow{CB}$ et $F$ un point tel que $\overrightarrow{AF}=\dfrac{1}{3}\overrightarrow{AC}$.

    **1.** Faire une figure.

    **2.** Montrer à l'aide de la relation de Chasles que : 
    $$\overrightarrow{IE}=\overrightarrow{BA} \qquad\text{et}\qquad \overrightarrow{IF}=\dfrac{2}{3}\overrightarrow{BA}$$

    **3.** En déduire que les points $I$, $E$ et $F$ sont alignés.
  corrige: |
    **1.**

    ![Figure](documents/figures/062e93f86341325c.svg)

    *Construction :* $\overrightarrow{AE}=\frac{1}{3}\overrightarrow{BC}$ se reporte depuis $A$ ; $I$ se place sur $[CB]$ aux deux tiers en partant de $C$ ; $F$ se place sur $[AC]$ au tiers en partant de $A$.

    **2.** Le point de départ commun est $I$. On note d'abord que $\overrightarrow{IC}=-\overrightarrow{CI}=-\frac{2}{3}\overrightarrow{CB}=\frac{2}{3}\overrightarrow{BC}$.

    **Premier vecteur :** 
    $$\overrightarrow{IE}=\overrightarrow{IC}+\overrightarrow{CA}+\overrightarrow{AE} =\frac{2}{3}\overrightarrow{BC}+\overrightarrow{CA}+\frac{1}{3}\overrightarrow{BC} =\underbrace{\overrightarrow{BC}+\overrightarrow{CA}}_{\text{Chasles}}=\boxed{\overrightarrow{BA}}$$

    **Second vecteur :** 
    $$\overrightarrow{IF}=\overrightarrow{IC}+\overrightarrow{CA}+\overrightarrow{AF} =\frac{2}{3}\overrightarrow{BC}-\overrightarrow{AC}+\frac{1}{3}\overrightarrow{AC} =\frac{2}{3}\left(\overrightarrow{AC}-\overrightarrow{AB}\right)-\frac{2}{3}\overrightarrow{AC} =-\frac{2}{3}\overrightarrow{AB}=\boxed{\frac{2}{3}\overrightarrow{BA}}$$

    **3.** On constate que $\overrightarrow{IF}=\dfrac{2}{3}\overrightarrow{BA}=\dfrac{2}{3}\overrightarrow{IE}$. Les vecteurs $\overrightarrow{IE}$ et $\overrightarrow{IF}$ sont donc colinéaires, et comme ils ont le point $I$ en commun : 
    $$\boxed{\text{les points } I,\ E \text{ et } F \text{ sont alignés.}}$$
     La figure le confirme : ils appartiennent tous les trois à la droite tracée en pointillés violets.
- id: "p-03-05"
  feuille: "f-p-03"
  numero: 5
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [vecteurs, milieu]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Démontrer que, pour tous points $A$, $B$, $C$ et $D$ du plan : 
    $$\overrightarrow{AB}+\overrightarrow{CD}=\overrightarrow{AD}+\overrightarrow{CB}$$

    **2.** Soit $I$ le milieu de $[AB]$. Montrer que, pour tout point $M$ du plan : 
    $$\overrightarrow{MA}+\overrightarrow{MB}=2\,\overrightarrow{MI}$$

    **3.** Soit $ABC$ un triangle, et $G$ le point défini par $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$. Montrer que, pour tout point $M$ du plan : 
    $$\overrightarrow{MA}+\overrightarrow{MB}+\overrightarrow{MC}=3\,\overrightarrow{MG}$$

    **4.** En appliquant l'égalité précédente à un point bien choisi, exprimer $\overrightarrow{AG}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.
  corrige: |
    **1.** On décompose chacun des deux vecteurs de gauche en passant par un point bien choisi : 
    $$\overrightarrow{AB}+\overrightarrow{CD}=\left(\overrightarrow{AD}+\overrightarrow{DB}\right)+\left(\overrightarrow{CB}+\overrightarrow{BD}\right) =\overrightarrow{AD}+\overrightarrow{CB}+\underbrace{\left(\overrightarrow{DB}+\overrightarrow{BD}\right)}_{=\vec{0}} =\boxed{\overrightarrow{AD}+\overrightarrow{CB}}$$

    **2.** On introduit le point $I$ dans les deux vecteurs : 
    $$\overrightarrow{MA}+\overrightarrow{MB}=\left(\overrightarrow{MI}+\overrightarrow{IA}\right)+\left(\overrightarrow{MI}+\overrightarrow{IB}\right) =2\overrightarrow{MI}+\underbrace{\left(\overrightarrow{IA}+\overrightarrow{IB}\right)}_{=\vec{0} \text{ car } I \text{ milieu}} =\boxed{2\overrightarrow{MI}}$$

    **3.** On procède de la même manière, en introduisant cette fois le point $G$ : 
    $$\overrightarrow{MA}+\overrightarrow{MB}+\overrightarrow{MC} =3\overrightarrow{MG}+\underbrace{\left(\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}\right)}_{=\vec{0} \text{ par définition de } G} =\boxed{3\overrightarrow{MG}}$$

    **4.** L'égalité étant valable pour *tout* point $M$, on peut choisir $M=A$. Comme $\overrightarrow{AA}=\vec{0}$ : 
    $$\overrightarrow{AB}+\overrightarrow{AC}=3\overrightarrow{AG} \qquad\text{soit}\qquad \boxed{\overrightarrow{AG}=\frac{1}{3}\left(\overrightarrow{AB}+\overrightarrow{AC}\right)}$$
     *C'est la clé de l'exercice 34 :* ce point $G$ n'est autre que le centre de gravité du triangle $ABC$.
- id: "p-03-06"
  feuille: "f-p-03"
  numero: 6
  partie: "Calcul vectoriel et relation de Chasles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs, relation de Chasles, alignement, équations de droite]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On considère le triangle $ABC$ ci-dessous. Le point $R$ appartient à la droite $(AB)$, le point $S$ au segment $[AC]$ et le point $T$ au segment $[BC]$. Les points ocre marquent des partages en parts égales.

    ![Figure](documents/figures/4d8fe335a0be206e.svg)

    On veut montrer dans cet exercice que $R$, $S$ et $T$ sont alignés.

    **1.** À partir de la figure, déterminer les valeurs des réels $\alpha$, $\beta$ et $\gamma$ tels que : 
    $$\overrightarrow{AR}=\alpha\,\overrightarrow{AB} \qquad \overrightarrow{AS}=\beta\,\overrightarrow{AC} \qquad \overrightarrow{BT}=\gamma\,\overrightarrow{BC}$$
     *On prendra garde au signe de $\alpha$ : le point $R$ n'appartient pas au segment $[AB]$.*

    **2.** Montrer à l'aide de la relation de Chasles que :

    **(a)** $\overrightarrow{RS}=\dfrac{1}{2}\overrightarrow{AB}+\dfrac{1}{3}\overrightarrow{AC}$ ;

    **(b)** $\overrightarrow{AT}=\dfrac{2}{5}\overrightarrow{AB}+\dfrac{3}{5}\overrightarrow{AC}$.

    **3.** En déduire une expression du vecteur $\overrightarrow{RT}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.

    **4.** Vérifier que $\overrightarrow{RS}=\dfrac{5}{9}\overrightarrow{RT}$.

    **5.** Conclure.
  corrige: |
    **1.** Sur la figure, la droite $(AB)$ est partagée en parts égales de longueur $\frac{AB}{2}$, et le point $R$ se trouve à *une* de ces parts de $A$, mais **du côté opposé à $B$** : le coefficient est donc négatif. Le point $S$ est au tiers de $[AC]$, et $T$ aux trois cinquièmes de $[BC]$ : 
    $$\boxed{\alpha=-\frac{1}{2} \qquad \beta=\frac{1}{3} \qquad \gamma=\frac{3}{5}}$$

    **2.** **(a)** On passe par le point $A$ : 
    $$\overrightarrow{RS}=\overrightarrow{RA}+\overrightarrow{AS}=-\overrightarrow{AR}+\overrightarrow{AS} =-\left(-\frac{1}{2}\overrightarrow{AB}\right)+\frac{1}{3}\overrightarrow{AC} =\boxed{\frac{1}{2}\overrightarrow{AB}+\frac{1}{3}\overrightarrow{AC}}$$
     *C'est ici que le signe de $\alpha$ intervient :* c'est lui qui rend le premier coefficient positif.

    **(b)** On passe par le point $B$, puis l'on exprime $\overrightarrow{BC}$ à l'aide de $A$ : 
    $$\overrightarrow{AT}=\overrightarrow{AB}+\overrightarrow{BT}=\overrightarrow{AB}+\frac{3}{5}\overrightarrow{BC} =\overrightarrow{AB}+\frac{3}{5}\left(\overrightarrow{AC}-\overrightarrow{AB}\right) =\boxed{\frac{2}{5}\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC}}$$

    **3.** $\overrightarrow{RT}=\overrightarrow{RA}+\overrightarrow{AT}=\dfrac{1}{2}\overrightarrow{AB}+\dfrac{2}{5}\overrightarrow{AB} +\dfrac{3}{5}\overrightarrow{AC}$, et $\dfrac{1}{2}+\dfrac{2}{5}=\dfrac{5+4}{10}=\dfrac{9}{10}$ : 
    $$\boxed{\overrightarrow{RT}=\frac{9}{10}\overrightarrow{AB}+\frac{3}{5}\overrightarrow{AC}}$$

    **4.** On multiplie chaque coefficient par $\dfrac{5}{9}$ : 
    $$\frac{5}{9}\overrightarrow{RT}=\frac{5}{9}\times\frac{9}{10}\overrightarrow{AB}+\frac{5}{9}\times\frac{3}{5}\overrightarrow{AC} =\frac{1}{2}\overrightarrow{AB}+\frac{1}{3}\overrightarrow{AC}=\boxed{\overrightarrow{RS}}$$

    **5.** Les vecteurs $\overrightarrow{RS}$ et $\overrightarrow{RT}$ sont colinéaires et ont l'origine $R$ en commun, donc 
    $$\boxed{\text{les points } R,\ S \text{ et } T \text{ sont alignés.}}$$
- id: "p-03-07"
  feuille: "f-p-03"
  numero: 7
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Le plan est muni d'un repère $\left(O\,;\vec{\imath},\vec{\jmath}\right)$. On donne les points 
    $$A(2\,;-3) \qquad B(-1\,;4) \qquad C(5\,;0) \qquad D(-2\,;-2)$$

    **1.** Déterminer les coordonnées des vecteurs $\overrightarrow{AB}$, $\overrightarrow{AC}$, $\overrightarrow{BD}$ et $\overrightarrow{CD}$.

    **2.** Déterminer les coordonnées des vecteurs :

    **a)** $\overrightarrow{AB}+\overrightarrow{AC}$

    **b)** $2\overrightarrow{AB}-3\overrightarrow{CD}$

    **c)** $\dfrac{1}{2}\overrightarrow{AC}+\overrightarrow{BD}$

    **3.** Vérifier par le calcul que $\overrightarrow{AB}+\overrightarrow{BD}=\overrightarrow{AD}$. Quel résultat du cours retrouve-t-on ainsi ?
  corrige: |
    **1.** On applique $\overrightarrow{AB}\begin{pmatrix}x_B-x_A\\y_B-y_A\end{pmatrix}$ : 
    $$\overrightarrow{AB}\begin{pmatrix}-1-2\\4-(-3)\end{pmatrix}=\boxed{\begin{pmatrix}-3\\7\end{pmatrix}} \qquad \overrightarrow{AC}\begin{pmatrix}5-2\\0-(-3)\end{pmatrix}=\boxed{\begin{pmatrix}3\\3\end{pmatrix}}$$

    $$\overrightarrow{BD}\begin{pmatrix}-2-(-1)\\-2-4\end{pmatrix}=\boxed{\begin{pmatrix}-1\\-6\end{pmatrix}} \qquad \overrightarrow{CD}\begin{pmatrix}-2-5\\-2-0\end{pmatrix}=\boxed{\begin{pmatrix}-7\\-2\end{pmatrix}}$$
     *Piège classique :* c'est toujours « l'arrivée moins le départ », et les doubles signes doivent être écrits explicitement avant d'être simplifiés.

    **2.** **(a)** $\overrightarrow{AB}+\overrightarrow{AC}=\begin{pmatrix}-3+3\\7+3\end{pmatrix} =\boxed{\begin{pmatrix}0\\10\end{pmatrix}}$

    **(b)** $2\overrightarrow{AB}-3\overrightarrow{CD}=\begin{pmatrix}-6\\14\end{pmatrix}-\begin{pmatrix}-21\\-6\end{pmatrix} =\boxed{\begin{pmatrix}15\\20\end{pmatrix}}$

    **(c)** $\dfrac{1}{2}\overrightarrow{AC}+\overrightarrow{BD}=\begin{pmatrix}1{,}5\\1{,}5\end{pmatrix} +\begin{pmatrix}-1\\-6\end{pmatrix}=\boxed{\begin{pmatrix}0{,}5\\-4{,}5\end{pmatrix}}$

    **3.** $\overrightarrow{AB}+\overrightarrow{BD}=\begin{pmatrix}-3-1\\7-6\end{pmatrix} =\begin{pmatrix}-4\\1\end{pmatrix}$, et par ailleurs $\overrightarrow{AD}\begin{pmatrix}-2-2\\-2-(-3)\end{pmatrix}=\begin{pmatrix}-4\\1\end{pmatrix}$. 
    $$\boxed{\overrightarrow{AB}+\overrightarrow{BD}=\overrightarrow{AD} \text{ : on retrouve la relation de Chasles.}}$$
- id: "p-03-08"
  feuille: "f-p-03"
  numero: 8
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, norme et distance]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Calculer la norme de chacun des vecteurs suivants :

    **a)** $\vec{u}\begin{pmatrix}3\\-4\end{pmatrix}$

    **b)** $\vec{v}\begin{pmatrix}-1\\2\end{pmatrix}$

    **c)** $\vec{w}\begin{pmatrix}6\\8\end{pmatrix}$

    **d)** $\vec{z}\begin{pmatrix}-5\\-12\end{pmatrix}$

    **2.** On donne les points $A(1\,;2)$, $B(5\,;5)$ et $C(1\,;8)$. Calculer $AB$, $BC$ et $AC$, puis préciser la nature du triangle $ABC$.

    **3.** On donne les points $D(0\,;0)$, $E(4\,;2)$ et $F(2\,;6)$. Calculer $DE$, $EF$ et $DF$, puis, à l'aide de la réciproque du théorème de Pythagore, préciser la nature du triangle $DEF$.
  corrige: |
    **1.** On applique $\|\vec{u}\|=\sqrt{x^{2}+y^{2}}$ :

    **a)** $\|\vec{u}\|=\sqrt{3^{2}+(-4)^{2}}=\sqrt{25}=\boxed{5}$

    **b)** $\|\vec{v}\|=\sqrt{(-1)^{2}+2^{2}}=\boxed{\sqrt{5}}$

    **c)** $\|\vec{w}\|=\sqrt{36+64}=\sqrt{100}=\boxed{10}$

    **d)** $\|\vec{z}\|=\sqrt{25+144}=\sqrt{169}=\boxed{13}$

    *Attention :* les coordonnées sont élevées au carré, donc leur signe disparaît. Une norme est toujours positive.

    **2.** $\overrightarrow{AB}\begin{pmatrix}4\\3\end{pmatrix}$, $\overrightarrow{BC}\begin{pmatrix}-4\\3\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}0\\6\end{pmatrix}$, donc 
    $$AB=\sqrt{16+9}=\boxed{5} \qquad BC=\sqrt{16+9}=\boxed{5} \qquad AC=\sqrt{0+36}=\boxed{6}$$
     On constate que $AB=BC$, donc $\boxed{ABC \text{ est un triangle isocèle en } B.}$

    *Ce n'est pas un triangle rectangle :* $AB^{2}+BC^{2}=25+25=50$, alors que $AC^{2}=36$.

    **3.** $\overrightarrow{DE}\begin{pmatrix}4\\2\end{pmatrix}$, $\overrightarrow{EF}\begin{pmatrix}-2\\4\end{pmatrix}$ et $\overrightarrow{DF}\begin{pmatrix}2\\6\end{pmatrix}$, donc 
    $$DE=\sqrt{16+4}=\sqrt{20} \qquad EF=\sqrt{4+16}=\sqrt{20} \qquad DF=\sqrt{4+36}=\sqrt{40}$$
     D'une part $DE=EF=2\sqrt{5}$ : le triangle est isocèle en $E$. D'autre part : 
    $$DE^{2}+EF^{2}=20+20=40=DF^{2}$$
     D'après la réciproque du théorème de Pythagore, le triangle est rectangle en $E$ : 
    $$\boxed{DEF \text{ est un triangle rectangle isocèle en } E.}$$
     *On travaille sur les carrés des longueurs*, ce qui évite de manipuler les racines.
- id: "p-03-09"
  feuille: "f-p-03"
  numero: 9
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées, milieu, parallélogramme]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Dans un repère, on donne $A(-1\,;2)$, $B(3\,;1)$ et $C(0\,;-2)$.

    **1.** Déterminer les coordonnées du vecteur $\overrightarrow{AB}$.

    **2.** Déterminer les coordonnées du point $D$ tel que $ABDC$ soit un parallélogramme.

    **3.** Vérifier que les segments $[AD]$ et $[BC]$ ont le même milieu. Quelle propriété retrouve-t-on ?

    **4.** Calculer $AB$ et $AC$. Que peut-on en déduire sur la nature du quadrilatère $ABDC$ ?
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}3-(-1)\\1-2\end{pmatrix} =\boxed{\begin{pmatrix}4\\-1\end{pmatrix}}$

    **2.** D'après le cours, $ABDC$ est un parallélogramme si et seulement si $\overrightarrow{AB}=\overrightarrow{CD}$. En notant $D(x\,;y)$ : 
    $$\overrightarrow{CD}\begin{pmatrix}x-0\\y-(-2)\end{pmatrix}=\begin{pmatrix}4\\-1\end{pmatrix} \iff \begin{cases} x=4 \\ y+2=-1\end{cases} \iff \begin{cases} x=4 \\ y=-3\end{cases}$$

    $$\boxed{D(4\,;-3)}$$

    ![Figure](documents/figures/8029004acb82e586.svg)

    **3.** Milieu de $[AD]$ : $\left(\dfrac{-1+4}{2}\,;\dfrac{2-3}{2}\right)=(1{,}5\,;-0{,}5)$.

    Milieu de $[BC]$ : $\left(\dfrac{3+0}{2}\,;\dfrac{1-2}{2}\right)=(1{,}5\,;-0{,}5)$. 
    $$\boxed{\text{Les deux milieux coïncident : les diagonales se coupent en leur milieu.}}$$
     C'est la propriété caractéristique du parallélogramme (le point violet sur la figure).

    **4.** $AB=\sqrt{4^{2}+(-1)^{2}}=\sqrt{17}$, et $\overrightarrow{AC}\begin{pmatrix}1\\-4\end{pmatrix}$ donne $AC=\sqrt{1+16}=\sqrt{17}$.

    Or $[AB]$ et $[AC]$ sont deux côtés *consécutifs* du parallélogramme $ABDC$, et ils ont la même longueur : 
    $$\boxed{ABDC \text{ est un losange.}}$$
     On en déduit d'ailleurs que ses diagonales $(AD)$ et $(BC)$ sont perpendiculaires.
- id: "p-03-10"
  feuille: "f-p-03"
  numero: 10
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées, norme et distance]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Dans un repère, on donne les points $A(-2\,;1)$, $B(1\,;3)$, $C(3\,;0)$ et $D(0\,;-2)$.

    **1.** Déterminer les coordonnées de $\overrightarrow{AB}$ et de $\overrightarrow{DC}$. Que peut-on en déduire ?

    **2.** Calculer les longueurs $AB$, $BC$, $CD$ et $DA$. Préciser la nature du quadrilatère $ABCD$.

    **3.** Calculer les longueurs des diagonales $AC$ et $BD$. Affiner alors la réponse précédente.

    **4.** Déterminer les coordonnées du centre de ce quadrilatère.
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}1-(-2)\\3-1\end{pmatrix}=\begin{pmatrix}3\\2\end{pmatrix}$ et $\overrightarrow{DC}\begin{pmatrix}3-0\\0-(-2)\end{pmatrix}=\begin{pmatrix}3\\2\end{pmatrix}$.

    On constate que $\overrightarrow{AB}=\overrightarrow{DC}$, donc $\boxed{ABCD \text{ est un parallélogramme.}}$

    **2.** $\overrightarrow{BC}\begin{pmatrix}2\\-3\end{pmatrix}$, $\overrightarrow{CD}\begin{pmatrix}-3\\-2\end{pmatrix}$ et $\overrightarrow{DA}\begin{pmatrix}-2\\3\end{pmatrix}$, d'où : 
    $$AB=CD=\sqrt{9+4}=\sqrt{13} \qquad\text{et}\qquad BC=DA=\sqrt{4+9}=\sqrt{13}$$
     Les quatre côtés ont la même longueur : $\boxed{ABCD \text{ est un losange.}}$

    **3.** $\overrightarrow{AC}\begin{pmatrix}5\\-1\end{pmatrix}$ et $\overrightarrow{BD}\begin{pmatrix}-1\\-5\end{pmatrix}$, donc 
    $$AC=\sqrt{25+1}=\sqrt{26} \qquad\text{et}\qquad BD=\sqrt{1+25}=\sqrt{26}$$
     Un losange dont les diagonales ont la même longueur est un carré : 
    $$\boxed{ABCD \text{ est un carré.}}$$
     *Vérification :* pour un carré de côté $\sqrt{13}$, la diagonale doit valoir $\sqrt{13}\times\sqrt{2}=\sqrt{26}$.

    ![Figure](documents/figures/a4adda693c2b92ca.svg)

    **4.** Le centre est le milieu commun des deux diagonales : 
    $$\Omega\left(\frac{-2+3}{2}\,;\frac{1+0}{2}\right)=\boxed{\Omega(0{,}5\,;0{,}5)}$$
     *Vérification* avec l'autre diagonale : $\left(\frac{1+0}{2}\,;\frac{3-2}{2}\right) =(0{,}5\,;0{,}5)$.
- id: "p-03-11"
  feuille: "f-p-03"
  numero: 11
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs, coordonnées, alignement]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Dans un repère, on donne les points $M(0\,;-3)$, $N(2\,;3)$, $P(-9\,;0)$ et $Q(-1\,;-1)$.

    **1.** Calculer les coordonnées des points $A$ et $B$ tels que : 
    $$\overrightarrow{NA}=\dfrac{1}{2}\overrightarrow{MN} \qquad\text{et}\qquad \overrightarrow{MB}=3\overrightarrow{MQ}$$

    **2.** Déterminer les coordonnées des vecteurs $\overrightarrow{PA}$ et $\overrightarrow{PB}$.

    **3.** Démontrer que les points $P$, $A$ et $B$ sont alignés.
  corrige: |
    **1.** $\overrightarrow{MN}\begin{pmatrix}2\\6\end{pmatrix}$, donc $\dfrac{1}{2}\overrightarrow{MN}\begin{pmatrix}1\\3\end{pmatrix}$. En notant $A(x\,;y)$ : 
    $$\overrightarrow{NA}\begin{pmatrix}x-2\\y-3\end{pmatrix}=\begin{pmatrix}1\\3\end{pmatrix} \iff \begin{cases}x=3\\y=6\end{cases} \qquad\text{soit}\qquad \boxed{A(3\,;6)}$$
     $\overrightarrow{MQ}\begin{pmatrix}-1\\2\end{pmatrix}$, donc $3\overrightarrow{MQ}\begin{pmatrix}-3\\6\end{pmatrix}$. En notant $B(x\,;y)$ : 
    $$\overrightarrow{MB}\begin{pmatrix}x-0\\y+3\end{pmatrix}=\begin{pmatrix}-3\\6\end{pmatrix} \iff \begin{cases}x=-3\\y=3\end{cases} \qquad\text{soit}\qquad \boxed{B(-3\,;3)}$$

    **2.** $\overrightarrow{PA}\begin{pmatrix}3-(-9)\\6-0\end{pmatrix}=\boxed{\begin{pmatrix}12\\6\end{pmatrix}}$

    $\overrightarrow{PB}\begin{pmatrix}-3-(-9)\\3-0\end{pmatrix}=\boxed{\begin{pmatrix}6\\3\end{pmatrix}}$

    **3.** On calcule le déterminant : 
    $$\det\left(\overrightarrow{PA}\,;\overrightarrow{PB}\right)=12\times 3-6\times 6=36-36=0$$
     Les vecteurs $\overrightarrow{PA}$ et $\overrightarrow{PB}$ sont donc colinéaires, et comme ils partent du même point $P$ : 
    $$\boxed{\text{les points } P,\ A \text{ et } B \text{ sont alignés.}}$$
     On peut même préciser que $\overrightarrow{PA}=2\overrightarrow{PB}$ : le point $B$ est le milieu de $[PA]$.
- id: "p-03-12"
  feuille: "f-p-03"
  numero: 12
  partie: "Coordonnées, normes et distances"
  etoiles: 1
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [vecteurs, coordonnées]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Dans un repère, on donne les points $A(1\,;-1)$, $B(-1\,;-2)$ et $C(-2\,;2)$.

    **1.** Déterminer les coordonnées du point $G$ vérifiant : 
    $$\overrightarrow{GA}+2\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$$

    **2.** Déterminer les coordonnées du point $D$ vérifiant : 
    $$\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{BC}$$

    **3.** Faire une figure. Que peut-on conjecturer pour les points $B$, $G$ et $D$ ? Démontrer cette conjecture.
  corrige: |
    **1.** On note $G(x\,;y)$ et l'on écrit les trois vecteurs : 
    $$\overrightarrow{GA}\begin{pmatrix}1-x\\-1-y\end{pmatrix} \quad \overrightarrow{GB}\begin{pmatrix}-1-x\\-2-y\end{pmatrix} \quad \overrightarrow{GC}\begin{pmatrix}-2-x\\2-y\end{pmatrix}$$
     La relation $\overrightarrow{GA}+2\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$ se traduit par le système : 
    $$\begin{cases}(1-x)+2(-1-x)+(-2-x)=0 \\ (-1-y)+2(-2-y)+(2-y)=0\end{cases} \iff \begin{cases}-3-4x=0 \\ -3-4y=0\end{cases}$$

    $$\boxed{G\left(-\frac{3}{4}\,;-\frac{3}{4}\right)}$$

    **2.** $\overrightarrow{BA}\begin{pmatrix}2\\1\end{pmatrix}$ et $\overrightarrow{BC}\begin{pmatrix}-1\\4\end{pmatrix}$, donc $\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{BC}\begin{pmatrix}1\\5\end{pmatrix}$. En notant $D(x\,;y)$ : 
    $$\begin{cases}x-(-1)=1\\y-(-2)=5\end{cases} \qquad\text{soit}\qquad \boxed{D(0\,;3)}$$
     *On remarque que* $D$ est le quatrième sommet du parallélogramme $ABDC$.

    **3.**

    ![Figure](documents/figures/88e676692308108b.svg)

    **Conjecture :** les points $B$, $G$ et $D$ semblent alignés.

    **Démonstration.** On calcule les deux vecteurs : 
    $$\overrightarrow{BG}\begin{pmatrix}-\frac{3}{4}+1\\-\frac{3}{4}+2\end{pmatrix} =\begin{pmatrix}\frac{1}{4}\\\frac{5}{4}\end{pmatrix} \qquad\text{et}\qquad \overrightarrow{BD}\begin{pmatrix}1\\5\end{pmatrix}$$

    $$\det\left(\overrightarrow{BG}\,;\overrightarrow{BD}\right)=\frac{1}{4}\times 5-1\times\frac{5}{4} =\frac{5}{4}-\frac{5}{4}=0$$
     Les vecteurs sont colinéaires (on a même $\overrightarrow{BD}=4\overrightarrow{BG}$), donc 
    $$\boxed{\text{les points } B,\ G \text{ et } D \text{ sont alignés.}}$$
- id: "p-03-13"
  feuille: "f-p-03"
  numero: 13
  partie: "Coordonnées, normes et distances"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs, coordonnées, milieu, alignement]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Dans un repère, on donne les points $A(-3\,;2)$ et $B(5\,;-4)$.

    **1.** Déterminer les coordonnées du milieu $I$ de $[AB]$.

    **2.** Déterminer les coordonnées du point $A'$, symétrique de $A$ par rapport à $B$.

    **3.** Déterminer les coordonnées du point $M$ tel que $\overrightarrow{AM}=\dfrac{2}{3}\overrightarrow{AB}$.

    **4.** Déterminer les coordonnées du point $N$ tel que $2\overrightarrow{NA}+3\overrightarrow{NB}=\vec{0}$.

    **5.** Démontrer que les points $I$, $M$ et $N$ sont alignés. Pouvait-on le prévoir sans aucun calcul ?
  corrige: |
    **1.** $I\left(\dfrac{-3+5}{2}\,;\dfrac{2-4}{2}\right)=\boxed{I(1\,;-1)}$

    **2.** $A'$ est le symétrique de $A$ par rapport à $B$, c'est-à-dire que $B$ est le milieu de $[AA']$. En notant $A'(x\,;y)$ : 
    $$\begin{cases}\dfrac{-3+x}{2}=5\\[2mm] \dfrac{2+y}{2}=-4\end{cases} \iff \begin{cases}x=13\\y=-10\end{cases} \qquad\text{soit}\qquad \boxed{A'(13\,;-10)}$$

    **3.** $\overrightarrow{AB}\begin{pmatrix}8\\-6\end{pmatrix}$, donc $\dfrac{2}{3}\overrightarrow{AB}\begin{pmatrix}\frac{16}{3}\\-4\end{pmatrix}$, et 
    $$M\left(-3+\frac{16}{3}\,;2-4\right)=\boxed{M\left(\frac{7}{3}\,;-2\right)}$$

    **4.** En notant $N(x\,;y)$, la relation $2\overrightarrow{NA}+3\overrightarrow{NB}=\vec{0}$ donne : 
    $$\begin{cases}2(-3-x)+3(5-x)=0\\2(2-y)+3(-4-y)=0\end{cases} \iff \begin{cases}9-5x=0\\-8-5y=0\end{cases} \qquad\text{soit}\qquad \boxed{N\left(\frac{9}{5}\,;-\frac{8}{5}\right)}$$

    **5.** $\overrightarrow{IM}\begin{pmatrix}\frac{7}{3}-1\\-2+1\end{pmatrix} =\begin{pmatrix}\frac{4}{3}\\-1\end{pmatrix}$ et $\overrightarrow{IN}\begin{pmatrix}\frac{9}{5}-1\\-\frac{8}{5}+1\end{pmatrix} =\begin{pmatrix}\frac{4}{5}\\-\frac{3}{5}\end{pmatrix}$, d'où 
    $$\det\left(\overrightarrow{IM}\,;\overrightarrow{IN}\right) =\frac{4}{3}\times\left(-\frac{3}{5}\right)-\frac{4}{5}\times(-1) =-\frac{4}{5}+\frac{4}{5}=0$$

    $$\boxed{\text{les points } I,\ M \text{ et } N \text{ sont alignés.}}$$

    **Oui, on pouvait le prévoir.** Les quatre points $I$, $A'$, $M$ et $N$ sont définis par des relations vectorielles ne faisant intervenir que $A$ et $B$ : chacun s'écrit sous la forme $A+k\,\overrightarrow{AB}$, et appartient donc à la droite $(AB)$. Trois points d'une même droite sont nécessairement alignés — aucun calcul n'était nécessaire.
- id: "p-03-14"
  feuille: "f-p-03"
  numero: 14
  partie: "Colinéarité, alignement et parallélisme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, colinéarité]
  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel, famille-libre]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Dans chaque cas, calculer $\det\left(\vec{u}\,;\vec{v}\right)$ et dire si les vecteurs $\vec{u}$ et $\vec{v}$ sont colinéaires.

    **a)** $\vec{u}\begin{pmatrix}3\\-2\end{pmatrix}$, $\vec{v}\begin{pmatrix}-6\\4\end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix}5\\1\end{pmatrix}$, $\vec{v}\begin{pmatrix}2\\3\end{pmatrix}$

    **c)** $\vec{u}\begin{pmatrix}-4\\6\end{pmatrix}$, $\vec{v}\begin{pmatrix}6\\-9\end{pmatrix}$

    **d)** $\vec{u}\begin{pmatrix}\frac{1}{2}\\-3\end{pmatrix}$, $\vec{v}\begin{pmatrix}2\\-12\end{pmatrix}$

    **e)** $\vec{u}\begin{pmatrix}\sqrt{2}\\1\end{pmatrix}$, $\vec{v}\begin{pmatrix}2\\\sqrt{2}\end{pmatrix}$

    **f)** $\vec{u}\begin{pmatrix}0\\5\end{pmatrix}$, $\vec{v}\begin{pmatrix}0\\-3\end{pmatrix}$

    Pour les couples colinéaires, préciser le réel $\lambda$ tel que $\vec{v}=\lambda\vec{u}$, et dire si les deux vecteurs ont le même sens.
  corrige: |
    On rappelle que $\det\left(\vec{u}\,;\vec{v}\right)=xy'-x'y$, et que les vecteurs sont colinéaires si et seulement si ce déterminant est nul.

    **a)** $\det\left(\vec{u}\,;\vec{v}\right)=3\times 4-(-6)\times(-2)=12-12=\boxed{0}$ : colinéaires, avec $\vec{v}=-2\vec{u}$ (le coefficient est négatif, donc **sens contraire**).

    **b)** $\det\left(\vec{u}\,;\vec{v}\right)=5\times 3-2\times 1=\boxed{13\neq 0}$ : **non** colinéaires.

    **c)** $\det\left(\vec{u}\,;\vec{v}\right)=(-4)\times(-9)-6\times 6=36-36=\boxed{0}$ : colinéaires, avec $\vec{v}=-\dfrac{3}{2}\vec{u}$, donc de sens contraire.

    **d)** $\det\left(\vec{u}\,;\vec{v}\right)=\dfrac{1}{2}\times(-12)-2\times(-3)=-6+6=\boxed{0}$ : colinéaires, avec $\vec{v}=4\vec{u}$, donc de **même sens**.

    **e)** $\det\left(\vec{u}\,;\vec{v}\right)=\sqrt{2}\times\sqrt{2}-2\times 1=2-2=\boxed{0}$ : colinéaires, avec $\vec{v}=\sqrt{2}\,\vec{u}$, donc de même sens.

    **f)** $\det\left(\vec{u}\,;\vec{v}\right)=0\times(-3)-0\times 5=\boxed{0}$ : colinéaires, avec $\vec{v}=-\dfrac{3}{5}\vec{u}$, donc de sens contraire. *Ce sont deux vecteurs « verticaux »*, de même direction.
- id: "p-03-15"
  feuille: "f-p-03"
  numero: 15
  partie: "Colinéarité, alignement et parallélisme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteurs, colinéarité]
  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel, famille-libre]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Dans chaque cas, déterminer si les vecteurs $\vec{u}$ et $\vec{v}$ sont colinéaires :

    **a)** $\vec{u}\begin{pmatrix}2\\-3\end{pmatrix}$, $\vec{v}\begin{pmatrix}-1\\-\frac{1}{3}\end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix}\frac{1}{2}\\\frac{1}{3}\end{pmatrix}$, $\vec{v}\begin{pmatrix}\frac{6}{5}\\\frac{4}{5}\end{pmatrix}$

    **2.** Dans chaque cas, déterminer la ou les valeurs de $m$ pour lesquelles $\vec{u}$ et $\vec{v}$ sont colinéaires :

    **a)** $\vec{u}\begin{pmatrix}2\\6\end{pmatrix}$, $\vec{v}\begin{pmatrix}m\\3\end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix}-m\\0\end{pmatrix}$, $\vec{v}\begin{pmatrix}1\\-3\end{pmatrix}$

    **c)** $\vec{u}\begin{pmatrix}4\\m\end{pmatrix}$, $\vec{v}\begin{pmatrix}-2\\-3\end{pmatrix}$

    **d)** $\vec{u}\begin{pmatrix}27\\2m\end{pmatrix}$, $\vec{v}\begin{pmatrix}2m\\3\end{pmatrix}$
  corrige: |
    **1.** **(a)** $\det\left(\vec{u}\,;\vec{v}\right)=2\times\left(-\dfrac{1}{3}\right)-(-1)\times(-3)=-\dfrac{2}{3}-3 =\boxed{-\dfrac{11}{3}\neq 0}$ : non colinéaires.

    **(b)** $\det\left(\vec{u}\,;\vec{v}\right)=\dfrac{1}{2}\times\dfrac{4}{5}-\dfrac{6}{5}\times\dfrac{1}{3} =\dfrac{2}{5}-\dfrac{2}{5}=\boxed{0}$ : colinéaires, avec $\vec{v}=\dfrac{12}{5}\vec{u}$.

    **2.** On écrit à chaque fois que le déterminant est nul, puis on résout en $m$.

    **(a)** $\det\left(\vec{u}\,;\vec{v}\right)=2\times 3-m\times 6=6-6m=0 \iff \boxed{m=1}$

    **(b)** $\det\left(\vec{u}\,;\vec{v}\right)=(-m)\times(-3)-1\times 0=3m=0 \iff \boxed{m=0}$

    **(c)** $\det\left(\vec{u}\,;\vec{v}\right)=4\times(-3)-(-2)\times m=-12+2m=0 \iff \boxed{m=6}$

    **(d)** $\det\left(\vec{u}\,;\vec{v}\right)=27\times 3-2m\times 2m=81-4m^{2}=0 \iff m^{2}=\dfrac{81}{4} \iff \boxed{m=\dfrac{9}{2} \text{ ou } m=-\dfrac{9}{2}}$

    *Attention au dernier cas :* une équation du type $m^{2}=k$ avec $k>0$ admet **deux** solutions opposées ; oublier la négative est l'erreur la plus fréquente.
- id: "p-03-16"
  feuille: "f-p-03"
  numero: 16
  partie: "Colinéarité, alignement et parallélisme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [alignement, parallélisme, équations de droite]
  noeuds: [v-libre, v-espace]
  notions: []
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** On donne les points $A(-2\,;2)$, $B(1\,;5)$, $C(-1\,;-2)$ et $D(7\,;6)$. Les droites $(AB)$ et $(CD)$ sont-elles parallèles ? Sont-elles confondues ?

    **2.** Dans chacun des cas suivants, déterminer si les points $M$, $N$ et $P$ sont alignés :

    **(a)** $M(2\,;3)$, $N(5\,;7)$, $P(-6\,;-8)$

    **(b)** $M(4\,;-1)$, $N(7\,;-3)$, $P(-5\,;5)$

    **(c)** $M(-2\,;3)$, $N(-3\,;7)$, $P(-5\,;14)$

    **(d)** $M\left(2\,;-\frac{1}{3}\right)$, $N(3\,;-1)$, $P(0\,;1)$
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}3\\3\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}8\\8\end{pmatrix}$, donc 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{CD}\right)=3\times 8-8\times 3=0$$
     Les vecteurs directeurs sont colinéaires : $\boxed{(AB) \text{ et } (CD) \text{ sont parallèles.}}$

    Sont-elles confondues ? Il suffit de tester si $C$ appartient à $(AB)$. Or $\overrightarrow{AC}\begin{pmatrix}1\\-4\end{pmatrix}$ et 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=3\times(-4)-1\times 3=-15\neq 0$$

    $$\boxed{\text{Les droites sont \textbf{strictement} parallèles : elles ne sont pas confondues.}}$$

    **2.** On calcule à chaque fois $\det\left(\overrightarrow{MN}\,;\overrightarrow{MP}\right)$.

    **(a)** $\overrightarrow{MN}\begin{pmatrix}3\\4\end{pmatrix}$, $\overrightarrow{MP}\begin{pmatrix}-8\\-11\end{pmatrix}$ : $\;\det\left(\overrightarrow{MN}\,;\overrightarrow{MP}\right)=3\times(-11)-(-8)\times 4=-33+32=-1\neq 0$ $\boxed{\text{non alignés}}$

    **(b)** $\overrightarrow{MN}\begin{pmatrix}3\\-2\end{pmatrix}$, $\overrightarrow{MP}\begin{pmatrix}-9\\6\end{pmatrix}$ : $\;\det\left(\overrightarrow{MN}\,;\overrightarrow{MP}\right)=3\times 6-(-9)\times(-2)=18-18=0$ $\boxed{\text{alignés}}$

    **(c)** $\overrightarrow{MN}\begin{pmatrix}-1\\4\end{pmatrix}$, $\overrightarrow{MP}\begin{pmatrix}-3\\11\end{pmatrix}$ : $\;\det\left(\overrightarrow{MN}\,;\overrightarrow{MP}\right)=(-1)\times 11-(-3)\times 4=-11+12=1\neq 0$ $\boxed{\text{non alignés}}$

    **(d)** $\overrightarrow{MN}\begin{pmatrix}1\\-\frac{2}{3}\end{pmatrix}$, $\overrightarrow{MP}\begin{pmatrix}-2\\\frac{4}{3}\end{pmatrix}$ : $\;\det\left(\overrightarrow{MN}\,;\overrightarrow{MP}\right)=1\times\frac{4}{3}-(-2)\times\left(-\frac{2}{3}\right)=\frac{4}{3}-\frac{4}{3}=0$ $\boxed{\text{alignés}}$

    *On prendra garde* au cas c) : les valeurs sont proches de l'alignement (le déterminant vaut $1$), mais un déterminant non nul, aussi petit soit-il, suffit à conclure.
- id: "p-03-17"
  feuille: "f-p-03"
  numero: 17
  partie: "Colinéarité, alignement et parallélisme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [colinéarité, alignement, parallélisme, équations de droite]
  noeuds: [v-libre, v-determinant, v-espace]
  notions: [famille-libre]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** On donne $A(1\,;2)$, $B(4\,;-1)$ et $C(m\,;5)$. Déterminer la valeur de $m$ pour laquelle les points $A$, $B$ et $C$ sont alignés.

    **2.** Déterminer les valeurs de $m$ pour lesquelles $\vec{u}\begin{pmatrix}m\\2\end{pmatrix}$ et $\vec{v}\begin{pmatrix}3\\m\end{pmatrix}$ sont colinéaires.

    **3.** On donne $A(0\,;1)$, $B(2\,;5)$, $C(2\,;-1)$ et $D(m\,;3)$. Déterminer la valeur de $m$ pour laquelle les droites $(AB)$ et $(CD)$ sont parallèles.

    **4.** Pour cette valeur de $m$, les droites $(AB)$ et $(CD)$ sont-elles confondues ?
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}3\\-3\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}m-1\\3\end{pmatrix}$. Les points sont alignés si et seulement si : 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=3\times 3-(m-1)\times(-3)=9+3m-3=3m+6=0 \iff \boxed{m=-2}$$

    **2.** $\det\left(\vec{u}\,;\vec{v}\right)=m\times m-3\times 2=m^{2}-6=0 \iff m^{2}=6 \iff \boxed{m=\sqrt{6} \text{ ou } m=-\sqrt{6}}$

    **3.** $\overrightarrow{AB}\begin{pmatrix}2\\4\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}m-2\\4\end{pmatrix}$. Les droites sont parallèles si et seulement si : 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{CD}\right)=2\times 4-(m-2)\times 4=8-4m+8=16-4m=0 \iff \boxed{m=4}$$

    **4.** Pour $m=4$, on a $D(4\,;3)$. Testons si $C(2\,;-1)$ appartient à $(AB)$ : $\overrightarrow{AC}\begin{pmatrix}2\\-2\end{pmatrix}$ et 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=2\times(-2)-2\times 4=-12\neq 0$$

    $$\boxed{\text{Non : les droites sont strictement parallèles.}}$$
- id: "p-03-18"
  feuille: "f-p-03"
  numero: 18
  partie: "Colinéarité, alignement et parallélisme"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs, relation de Chasles, coordonnées, milieu, parallélogramme]
  noeuds: [v-espace]
  notions: [espace-vectoriel]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $ABC$ un triangle. On note $I$ le milieu de $[AB]$, $J$ le milieu de $[AC]$ et $K$ le milieu de $[BC]$.

    **Partie A : démonstration vectorielle**

    **1.** Exprimer $\overrightarrow{IA}$ et $\overrightarrow{AJ}$ en fonction de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.

    **2.** En déduire, à l'aide de la relation de Chasles, que $\overrightarrow{IJ}=\dfrac{1}{2}\overrightarrow{BC}$.

    **3.** Quel théorème de collège vient-on de redémontrer ?

    **Partie B : vérification dans un repère**

    On prend $A(-2\,;1)$, $B(4\,;3)$ et $C(0\,;-3)$.

    **4.** Calculer les coordonnées de $I$, $J$ et $K$.

    **5.** Vérifier par le calcul que $\overrightarrow{BC}=2\,\overrightarrow{IJ}$.

    **6.** Démontrer que le quadrilatère $AIKJ$ est un parallélogramme.
  corrige: |
    **Partie A : démonstration vectorielle**

    **1.** $I$ étant le milieu de $[AB]$, on a $\overrightarrow{AI}=\dfrac{1}{2}\overrightarrow{AB}$, donc 
    $$\boxed{\overrightarrow{IA}=-\frac{1}{2}\overrightarrow{AB}} \qquad\text{et de même}\qquad \boxed{\overrightarrow{AJ}=\frac{1}{2}\overrightarrow{AC}}$$

    **2.** On applique la relation de Chasles en passant par $A$ : 
    $$\overrightarrow{IJ}=\overrightarrow{IA}+\overrightarrow{AJ}=-\frac{1}{2}\overrightarrow{AB}+\frac{1}{2}\overrightarrow{AC} =\frac{1}{2}\left(\overrightarrow{AC}-\overrightarrow{AB}\right)=\boxed{\frac{1}{2}\overrightarrow{BC}}$$

    **3.** On vient de redémontrer le **théorème des milieux** : la droite qui joint les milieux de deux côtés d'un triangle est parallèle au troisième côté, et le segment correspondant mesure la moitié de ce côté. La version vectorielle a l'avantage de donner les deux informations (direction *et* longueur) d'un seul coup.

    **Partie B : vérification dans un repère**

    **4.** $I\left(\dfrac{-2+4}{2}\,;\dfrac{1+3}{2}\right)=\boxed{I(1\,;2)}$ $J\left(\dfrac{-2+0}{2}\,;\dfrac{1-3}{2}\right)=\boxed{J(-1\,;-1)}$

    $K\left(\dfrac{4+0}{2}\,;\dfrac{3-3}{2}\right)=\boxed{K(2\,;0)}$

    **5.** $\overrightarrow{IJ}\begin{pmatrix}-2\\-3\end{pmatrix}$ et $\overrightarrow{BC}\begin{pmatrix}-4\\-6\end{pmatrix}$, donc 
    $$2\overrightarrow{IJ}=\begin{pmatrix}-4\\-6\end{pmatrix}=\boxed{\overrightarrow{BC}}$$

    **6.** $\overrightarrow{AI}\begin{pmatrix}1-(-2)\\2-1\end{pmatrix}=\begin{pmatrix}3\\1\end{pmatrix}$ et $\overrightarrow{JK}\begin{pmatrix}2-(-1)\\0-(-1)\end{pmatrix}=\begin{pmatrix}3\\1\end{pmatrix}$.

    On constate que $\overrightarrow{AI}=\overrightarrow{JK}$, donc 
    $$\boxed{AIKJ \text{ est un parallélogramme.}}$$

    ![Figure](documents/figures/c257d0aa63666d45.svg)

    En ocre, le parallélogramme $AIKJ$ ; en violet, la droite des milieux $(IJ)$, parallèle à $(BC)$.
- id: "p-03-19"
  feuille: "f-p-03"
  numero: 19
  partie: "Équations de droite"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [vecteurs, coordonnées, colinéarité, équations de droite, vecteur directeur, intersection de droites]
  noeuds: [v-espace, v-libre, v-determinant]
  notions: [espace-vectoriel, famille-libre]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    On considère la droite $d$ d'équation cartésienne $\;3x-2y+6=0$.

    **1.** Les points $A(0\,;3)$, $B(2\,;6)$ et $C(-2\,;1)$ appartiennent-ils à $d$ ? Justifier par un calcul.

    **2.** Donner un vecteur directeur de $d$.

    **3.** Vérifier que $\overrightarrow{AB}$ est bien colinéaire à ce vecteur directeur.

    **4.** Déterminer les coordonnées des points d'intersection de $d$ avec les axes du repère.

    **5.** Donner un vecteur directeur de chacune des droites suivantes :

    **a)** $-x+4y-8=0$

    **b)** $y=5$

    **c)** $x=-2$
  corrige: |
    **1.** Un point appartient à $d$ si et seulement si ses coordonnées vérifient l'équation :

    • $A(0\,;3)$ : $\;3\times 0-2\times 3+6=-6+6=0$ $\boxed{A\in d}$

    • $B(2\,;6)$ : $\;3\times 2-2\times 6+6=6-12+6=0$ $\boxed{B\in d}$

    • $C(-2\,;1)$ : $\;3\times(-2)-2\times 1+6=-6-2+6=-2\neq 0$ $\boxed{C\notin d}$

    **2.** L'équation est de la forme $ax+by+c=0$ avec $a=3$ et $b=-2$. Le cours donne le vecteur directeur $\begin{pmatrix}-b\\a\end{pmatrix}$ : 
    $$\boxed{\vec{u}\begin{pmatrix}2\\3\end{pmatrix}}$$
     *Piège classique :* on ne lit pas $\begin{pmatrix}a\\b\end{pmatrix}$ mais bien $\begin{pmatrix}-b\\a\end{pmatrix}$ : les coefficients sont échangés, et l'un change de signe.

    **3.** $\overrightarrow{AB}\begin{pmatrix}2-0\\6-3\end{pmatrix}=\begin{pmatrix}2\\3\end{pmatrix}$ : c'est *exactement* le vecteur directeur trouvé, donc a fortiori colinéaire.

    **4.** Avec l'axe des ordonnées, on fait $x=0$ : $-2y+6=0$, donc $y=3$ et le point est $\boxed{(0\,;3)}$ (c'est le point $A$).

    Avec l'axe des abscisses, on fait $y=0$ : $3x+6=0$, donc $x=-2$ et le point est $\boxed{(-2\,;0)}$.

    **5.** **(a)** $-x+4y-8=0$ : $a=-1$, $b=4$, donc $\boxed{\begin{pmatrix}-4\\-1\end{pmatrix}}$ (ou $\begin{pmatrix}4\\1\end{pmatrix}$).

    **(b)** $y=5$ s'écrit $0x+1y-5=0$ : $a=0$, $b=1$, donc $\boxed{\begin{pmatrix}-1\\0\end{pmatrix}}$ : la droite est horizontale.

    **(c)** $x=-2$ s'écrit $1x+0y+2=0$ : $a=1$, $b=0$, donc $\boxed{\begin{pmatrix}0\\1\end{pmatrix}}$ : la droite est verticale.
- id: "p-03-20"
  feuille: "f-p-03"
  numero: 20
  partie: "Équations de droite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations de droite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Dans un repère d'origine $O$, on considère les points $A(1\,;5)$, $B(-2\,;4)$, $C(1\,;4)$ et $D(-3\,;5)$. Déterminer une équation cartésienne de :

    **1.** $(AB)$

    **2.** $(BC)$

    **3.** $(AC)$

    **4.** $(OD)$
  corrige: |
    **Méthode générale.** On calcule un vecteur directeur $\overrightarrow{XY}\begin{pmatrix}p\\q\end{pmatrix}$ de la droite ; comme le vecteur directeur associé à $ax+by+c=0$ est $\begin{pmatrix}-b\\a\end{pmatrix}$, on prend $a=q$ et $b=-p$. On détermine enfin $c$ en injectant les coordonnées d'un point de la droite.

    **1.** $\overrightarrow{AB}\begin{pmatrix}-3\\-1\end{pmatrix}$, donc $a=-1$ et $b=3$ : l'équation est de la forme $-x+3y+c=0$. Avec $A(1\,;5)$ : 
    $$-1+15+c=0 \iff c=-14$$

    $$\boxed{(AB) : -x+3y-14=0 \quad\text{ou}\quad x-3y+14=0}$$
     *Vérification* avec $B(-2\,;4)$ : $-2-12+14=0$.

    **2.** $B$ et $C$ ont la même ordonnée $4$ : la droite est horizontale. 
    $$\boxed{(BC) : y-4=0}$$

    **3.** $A$ et $C$ ont la même abscisse $1$ : la droite est verticale. 
    $$\boxed{(AC) : x-1=0}$$

    **4.** $\overrightarrow{OD}\begin{pmatrix}-3\\5\end{pmatrix}$, donc $a=5$ et $b=3$ : l'équation est de la forme $5x+3y+c=0$. Avec $O(0\,;0)$, on obtient immédiatement $c=0$ : 
    $$\boxed{(OD) : 5x+3y=0}$$
     *On remarque que* toute droite passant par l'origine a une équation sans terme constant.
- id: "p-03-21"
  feuille: "f-p-03"
  numero: 21
  partie: "Équations de droite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations de droite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 6
  page_corrige: 14
  enonce: |
    ![Figure](documents/figures/28a355d98d3defdf.svg)

    Associer chacune des droites à son équation :

    **a)** $y=\dfrac{2}{5}x-\dfrac{8}{5}$

    **b)** $y=5$

    **c)** $-3x+4y=0$

    **d)** $2x+2y=1$

    **e)** $y=2x-\dfrac{8}{5}$

    **f)** $x=-2$
  corrige: |
    On repère chaque droite à son **coefficient directeur** et à son **ordonnée à l'origine**, après avoir mis les équations sous forme réduite lorsque c'est possible : 
    $$\text{c)}\ -3x+4y=0 \iff y=\frac{3}{4}x \qquad\qquad \text{d)}\ 2x+2y=1 \iff y=-x+\frac{1}{2}$$

    ![Figure](documents/figures/d365b21b06355b10.svg)

    ```tableau
    Droite ¦ Équation ¦ Justification
    $d_1$ ¦ e) $y=2x-\dfrac{8}{5}$ ¦ la plus « raide » : coefficient directeur $2$
    $d_2$ ¦ c) $-3x+4y=0$ ¦ passe par l'origine, coefficient directeur $\frac{3}{4}$
    $d_3$ ¦ a) $y=\dfrac{2}{5}x-\dfrac{8}{5}$ ¦ même ordonnée à l'origine que $d_1$, pente plus faible
    $d_4$ ¦ b) $y=5$ ¦ horizontale
    $d_5$ ¦ d) $2x+2y=1$ ¦ seule droite *descendante* : coefficient directeur $-1$
    $d_6$ ¦ f) $x=-2$ ¦ verticale
    ```

    *On remarque que* $d_1$ et $d_3$ se coupent sur l'axe des ordonnées en $-\frac{8}{5}$ : c'est leur ordonnée à l'origine commune, ce qui permet de les distinguer des autres du premier coup d'œil.
- id: "p-03-22"
  feuille: "f-p-03"
  numero: 22
  partie: "Équations de droite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations de droite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Donner, lorsqu'elle existe, l'équation réduite de chacune des droites suivantes :

    **a)** $2x+3y-6=0$

    **b)** $-x+5y+10=0$

    **c)** $4x-8=0$

    **d)** $3y+9=0$

    Pour l'une d'entre elles, l'équation réduite n'existe pas : laquelle, et pourquoi ?

    **2.** Donner une équation cartésienne de chacune des droites suivantes :

    **a)** $y=3x-1$

    **b)** $y=-\dfrac{1}{2}x+4$

    **c)** $x=5$

    **3.** Tracer dans un même repère les droites des questions 1.a) et 1.b).
  corrige: |
    **1.** On isole $y$ à chaque fois.

    **(a)** $2x+3y-6=0 \iff 3y=-2x+6 \iff \boxed{y=-\dfrac{2}{3}x+2}$

    **(b)** $-x+5y+10=0 \iff 5y=x-10 \iff \boxed{y=\dfrac{1}{5}x-2}$

    **(c)** $4x-8=0 \iff \boxed{x=2}$

    **(d)** $3y+9=0 \iff \boxed{y=-3}$

    **C'est la droite c) qui n'admet pas d'équation réduite.** Son équation ne contient pas de $y$ : c'est une droite **verticale**, et $y$ ne peut pas s'exprimer en fonction de $x$ (à l'abscisse $2$ correspondent une infinité d'ordonnées).

    **2.** On ramène tout dans le membre de gauche.

    **(a)** $y=3x-1 \iff \boxed{3x-y-1=0}$

    **(b)** $y=-\dfrac{1}{2}x+4 \iff \dfrac{1}{2}x+y-4=0 \iff \boxed{x+2y-8=0}$ (on a multiplié par $2$ pour éviter les fractions)

    **(c)** $x=5 \iff \boxed{x-5=0}$

    **3.** Pour tracer, il suffit de deux points par droite. Pour $y=-\frac{2}{3}x+2$ : les points $(0\,;2)$ et $(3\,;0)$. Pour $y=\frac{1}{5}x-2$ : les points $(0\,;-2)$ et $(5\,;-1)$.

    ![Figure](documents/figures/6ca649b9dd7a54a5.svg)

    *On remarque que* les deux droites sont sécantes, puisque leurs coefficients directeurs $-\frac{2}{3}$ et $\frac{1}{5}$ sont différents.
- id: "p-03-23"
  feuille: "f-p-03"
  numero: 23
  partie: "Équations de droite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteurs, parallélisme, équations de droite, vecteur directeur]
  noeuds: [v-espace, v-libre]
  notions: [espace-vectoriel]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Déterminer une équation cartésienne de la droite passant par $A(2\,;-1)$ et de vecteur directeur $\vec{u}\begin{pmatrix}3\\5\end{pmatrix}$.

    **2.** Déterminer une équation cartésienne de la droite passant par $B(-1\,;4)$ et parallèle à la droite $d$ d'équation $2x-7y+1=0$.

    **3.** Déterminer une équation cartésienne de la droite $(CD)$, où $C(0\,;-3)$ et $D(4\,;5)$.

    **4.** En déduire une équation cartésienne de la droite passant par $E(1\,;1)$ et parallèle à $(CD)$.

    **5.** Le point $F(-2\,;-7)$ appartient-il à $(CD)$ ?
  corrige: |
    **1.** Le vecteur directeur $\begin{pmatrix}3\\5\end{pmatrix}$ doit être de la forme $\begin{pmatrix}-b\\a\end{pmatrix}$, donc $b=-3$ et $a=5$ : l'équation est $5x-3y+c=0$. Avec $A(2\,;-1)$ : 
    $$5\times 2-3\times(-1)+c=10+3+c=0 \iff c=-13$$

    $$\boxed{5x-3y-13=0}$$

    **2.** Deux droites parallèles ont le même vecteur directeur, donc les mêmes coefficients $a$ et $b$ : l'équation cherchée est de la forme $2x-7y+c=0$. Avec $B(-1\,;4)$ : 
    $$-2-28+c=0 \iff c=30$$

    $$\boxed{2x-7y+30=0}$$
     *C'est la méthode la plus rapide :* on recopie les deux premiers coefficients, et l'on ne recalcule que le troisième.

    **3.** $\overrightarrow{CD}\begin{pmatrix}4\\8\end{pmatrix}$, que l'on simplifie en $\begin{pmatrix}1\\2\end{pmatrix}$. Donc $b=-1$ et $a=2$ : l'équation est $2x-y+c=0$. Avec $C(0\,;-3)$ : 
    $$0+3+c=0 \iff c=-3$$

    $$\boxed{(CD) : 2x-y-3=0}$$
     *Vérification* avec $D(4\,;5)$ : $8-5-3=0$.

    **4.** Même direction, donc équation de la forme $2x-y+c=0$. Avec $E(1\,;1)$ : 
    $$2-1+c=0 \iff c=-1 \qquad\text{soit}\qquad \boxed{2x-y-1=0}$$

    **5.** $F(-2\,;-7)$ : $\;2\times(-2)-(-7)-3=-4+7-3=0$, donc $\boxed{F \text{ appartient bien à } (CD).}$
- id: "p-03-24"
  feuille: "f-p-03"
  numero: 24
  partie: "Équations de droite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations de droite, intersection de droites]
  noeuds: [v-espace]
  notions: []
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Dans chacun des cas suivants, préciser la position relative des droites $(AB)$ et $(CD)$, et déterminer leur point d'intersection lorsqu'il existe :

    **1.** $A(4\,;1)$, $B(5\,;7)$, $C(2\,;-6)$ et $D(4\,;6)$.

    **2.** $A(25\,;40)$, $B(15\,;30)$, $C(-20\,;-5)$ et $D(40\,;55)$.

    **3.** $A(462\,;-70)$, $B(177\,;14)$, $C(88\,;312)$ et $D(86\,;222)$.
  corrige: |
    **Méthode.** On compare d'abord les vecteurs directeurs $\overrightarrow{AB}$ et $\overrightarrow{CD}$ à l'aide du déterminant. S'il est non nul, les droites sont sécantes et l'on cherche le point d'intersection ; s'il est nul, on teste si $C$ appartient à $(AB)$ pour distinguer « strictement parallèles » de « confondues ».

    **1.** $\overrightarrow{AB}\begin{pmatrix}1\\6\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}2\\12\end{pmatrix}$ : $\;\det\left(\overrightarrow{AB}\,;\overrightarrow{CD}\right)=1\times 12-2\times 6=0$ : les droites sont parallèles.

    $\overrightarrow{AC}\begin{pmatrix}-2\\-7\end{pmatrix}$ : $\;\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=1\times(-7)-(-2)\times 6=5\neq 0$, donc $C\notin(AB)$. 
    $$\boxed{\text{Droites strictement parallèles : aucun point d'intersection.}}$$

    **2.** $\overrightarrow{AB}\begin{pmatrix}-10\\-10\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}60\\60\end{pmatrix}$ : $\;\det\left(\overrightarrow{AB}\,;\overrightarrow{CD}\right)=(-10)\times 60-60\times(-10)=0$ : les droites sont parallèles.

    $\overrightarrow{AC}\begin{pmatrix}-45\\-45\end{pmatrix}$ : $\;\det\left(\overrightarrow{AB}\,;\overrightarrow{AC}\right)=(-10)\times(-45)-(-45)\times(-10)=450-450=0$, donc $C\in(AB)$. 
    $$\boxed{\text{Droites confondues : elles ont une infinité de points communs.}}$$

    **3.** $\overrightarrow{AB}\begin{pmatrix}-285\\84\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}-2\\-90\end{pmatrix}$ : 
    $$\det\left(\overrightarrow{AB}\,;\overrightarrow{CD}\right)=(-285)\times(-90)-(-2)\times 84=25\,650+168=25\,818\neq 0$$
     $\boxed{\text{Les droites sont sécantes.}}$ Déterminons leur point d'intersection.

    **Équation de $(AB)$ :** on simplifie $\overrightarrow{AB}$ par $3$, ce qui donne $\begin{pmatrix}-95\\28\end{pmatrix}$, donc $a=28$ et $b=95$. Avec $A(462\,;-70)$ : 
    $$28\times 462+95\times(-70)+c=12\,936-6\,650+c=0 \iff c=-6\,286$$

    $$(AB) : 28x+95y-6\,286=0$$

    **Équation de $(CD)$ :** on simplifie $\overrightarrow{CD}$ par $-2$, ce qui donne $\begin{pmatrix}1\\45\end{pmatrix}$, donc $a=45$ et $b=-1$. Avec $C(88\,;312)$ : 
    $$45\times 88-312+c=3\,960-312+c=0 \iff c=-3\,648$$

    $$(CD) : 45x-y-3\,648=0$$

    **Résolution du système**, par substitution : la seconde équation donne $y=45x-3\,648$, d'où 
    $$28x+95(45x-3\,648)-6\,286=0 \iff 28x+4\,275x-346\,560-6\,286=0 \iff 4\,303x=352\,846$$

    $$x=\frac{352\,846}{4\,303}=82 \qquad\text{puis}\qquad y=45\times 82-3\,648=3\,690-3\,648=42$$

    $$\boxed{\text{Les droites se coupent au point } (82\,;42).}$$
     *Vérification* dans la première équation : $28\times 82+95\times 42=2\,296+3\,990=6\,286$.
- id: "p-03-25"
  feuille: "f-p-03"
  numero: 25
  partie: "Systèmes d'équations"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["systèmes d'équations"]
  noeuds: [v-determinant]
  notions: []
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Résoudre les systèmes suivants. On précisera à chaque fois la méthode employée (substitution ou combinaison linéaire).

    **1.** $\begin{cases} 2x+y=-2 \\ 5x+4y=1 \end{cases}$

    **2.** $\begin{cases} 4x-5y=2 \\ -x+3y=3 \end{cases}$

    **3.** $\begin{cases} -x+20y=1 \\ 2x-60y=-3 \end{cases}$

    **4.** $\begin{cases} 12x+7y=41 \\ 4x-15y=239 \end{cases}$

    **5.** $\begin{cases} 3x+5y=2 \\[1mm] x-\dfrac{5}{2}y=1 \end{cases}$

    **6.** $\begin{cases} \dfrac{1}{10}x+\dfrac{1}{20}y=1 \\[2mm] \dfrac{2}{5}x-\dfrac{1}{10}y=10 \end{cases}$
  corrige: |
    *On adopte les notations du cours : chaque équation est repérée par $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ ou $\textcolor{#00549f}{\textcircled{e_{2}}}$, et l'expression que l'on remplace est mise en couleur.*

    **1.** $\left\{\begin{array}{l} 2x+y=-2 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 5x+4y=1 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution** : dans $\textcolor{#c61e2d}{\textcircled{e_{1}}}$, le $y$ est seul, on l'isole. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff \textcolor{#9e0018}{y=-2-2x}$$
     On injecte cette expression dans $\textcolor{#00549f}{\textcircled{e_{2}}}$ : 
    $$5x+4\,\textcolor{#9e0018}{y}=1 \iff 5x+4\,\textcolor{#9e0018}{(-2-2x)}=1 \iff 5x-8-8x=1 \iff -3x=9 \iff x=-3$$
     On revient à l'expression isolée : $y=-2-2\times(-3)=4$. 
    $$\boxed{S=\{(-3\,;4)\}}$$

    **2.** $\left\{\begin{array}{l} 4x-5y=2 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ -x+3y=3 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution** : c'est le $x$ de $\textcolor{#00549f}{\textcircled{e_{2}}}$ qui est le plus simple à isoler. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}} \iff \textcolor{#2c5680}{x=3y-3}$$

    $$4\,\textcolor{#2c5680}{x}-5y=2 \iff 4\,\textcolor{#2c5680}{(3y-3)}-5y=2 \iff 12y-12-5y=2 \iff 7y=14 \iff y=2$$
     Puis $x=3\times 2-3=3$. 
    $$\boxed{S=\{(3\,;2)\}}$$

    **3.** $\left\{\begin{array}{l} -x+20y=1 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2x-60y=-3 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Combinaison linéaire** : en ajoutant *deux fois* $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ à $\textcolor{#00549f}{\textcircled{e_{2}}}$, les $x$ disparaissent. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}}+2\times\textcolor{#c61e2d}{\textcircled{e_{1}}} \quad\text{donne :}\quad \textcolor{#2c5680}{2x-60y}+2\times\textcolor{#9e0018}{(-x+20y)} =\textcolor{#2c5680}{(-3)}+2\times\textcolor{#9e0018}{1}$$

    $$\iff 2x-60y-2x+40y=-1 \iff -20y=-1 \iff y=\frac{1}{20}$$
     En reprenant $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ : $-x+20\times\frac{1}{20}=1 \iff -x+1=1 \iff x=0$. 
    $$\boxed{S=\left\{\left(0\,;\frac{1}{20}\right)\right\}}$$

    **4.** $\left\{\begin{array}{l} 12x+7y=41 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 4x-15y=239 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Combinaison linéaire** : $12=3\times 4$, donc retrancher trois fois $\textcolor{#00549f}{\textcircled{e_{2}}}$ élimine les $x$. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}}-3\times\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad \textcolor{#9e0018}{12x+7y}-3\times\textcolor{#2c5680}{(4x-15y)} =\textcolor{#9e0018}{41}-3\times\textcolor{#2c5680}{239}$$

    $$\iff 12x+7y-12x+45y=41-717 \iff 52y=-676 \iff y=-13$$
     En reprenant $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ : $12x+7\times(-13)=41 \iff 12x=132 \iff x=11$. 
    $$\boxed{S=\{(11\,;-13)\}}$$

    **5.** $\left\{\begin{array}{l} 3x+5y=2 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[1mm] x-\dfrac{5}{2}y=1 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution** : le $x$ de $\textcolor{#00549f}{\textcircled{e_{2}}}$ n'a pas de facteur. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}} \iff \textcolor{#2c5680}{x=1+\frac{5}{2}y}$$

    $$3\,\textcolor{#2c5680}{x}+5y=2 \iff 3\,\textcolor{#2c5680}{\left(1+\frac{5}{2}y\right)}+5y=2 \iff 3+\frac{15}{2}y+5y=2 \iff \frac{25}{2}y=-1 \iff y=-\frac{2}{25}$$
     Puis $x=1+\dfrac{5}{2}\times\left(-\dfrac{2}{25}\right)=1-\dfrac{1}{5}=\dfrac{4}{5}$. 
    $$\boxed{S=\left\{\left(\frac{4}{5}\,;-\frac{2}{25}\right)\right\}}$$

    **6.** $\left\{\begin{array}{l} \dfrac{1}{10}x+\dfrac{1}{20}y=1 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[2mm] \dfrac{2}{5}x-\dfrac{1}{10}y=10 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ On commence par **chasser les dénominateurs** : 
    $$20\times\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff 2x+y=20 \qquad\text{et}\qquad 10\times\textcolor{#00549f}{\textcircled{e_{2}}} \iff 4x-y=100$$
     **Combinaison linéaire** : les coefficients de $y$ sont déjà opposés, il suffit d'additionner. 
    $$\textcolor{#9e0018}{(2x+y)}+\textcolor{#2c5680}{(4x-y)} =\textcolor{#9e0018}{20}+\textcolor{#2c5680}{100} \iff 6x=120 \iff x=20$$
     Puis $2\times 20+y=20 \iff y=-20$. 
    $$\boxed{S=\{(20\,;-20)\}}$$
- id: "p-03-26"
  feuille: "f-p-03"
  numero: 26
  partie: "Systèmes d'équations"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["systèmes d'équations"]
  noeuds: [v-determinant]
  notions: []
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Résoudre les systèmes suivants.

    **7.** $\begin{cases} 2x-\sqrt{3}\,y=0 \\ \sqrt{3}\,x-3y=-1 \end{cases}$

    **8.** $\begin{cases} 0{,}2x+0{,}5y=4 \\ x-y=6 \end{cases}$

    **9.** $\begin{cases} 5x+2y=14 \\ 2x+5y=14 \end{cases}$

    **10.** $\begin{cases} 3x+5y-5=0 \\ 2x-3y=2 \end{cases}$

    **11.** $\begin{cases} 3x+y=5 \\ 6x+2y=10 \end{cases}$

    **12.** $\begin{cases} \dfrac{3}{2}x-\dfrac{5}{3}y=1 \\[2mm] \dfrac{x+2y}{7}=1 \end{cases}$

    Pour le système 11., interpréter géométriquement le résultat obtenu.
  corrige: |
    **7.** $\left\{\begin{array}{l} 2x-\sqrt{3}\,y=0 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ \sqrt{3}\,x-3y=-1 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution**. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff \sqrt{3}\,y=2x \iff \textcolor{#9e0018}{y=\frac{2x}{\sqrt{3}}}$$

    $$\sqrt{3}\,x-3\,\textcolor{#9e0018}{y}=-1 \iff \sqrt{3}\,x-3\times\textcolor{#9e0018}{\frac{2x}{\sqrt{3}}}=-1 \iff \sqrt{3}\,x-2\sqrt{3}\,x=-1$$
     en utilisant $\dfrac{3}{\sqrt{3}}=\sqrt{3}$. On obtient $-\sqrt{3}\,x=-1$, donc $x=\dfrac{1}{\sqrt{3}}=\dfrac{\sqrt{3}}{3}$, puis $y=\dfrac{2}{\sqrt{3}}\times\dfrac{\sqrt{3}}{3}=\dfrac{2}{3}$. 
    $$\boxed{S=\left\{\left(\frac{\sqrt{3}}{3}\,;\frac{2}{3}\right)\right\}}$$

    **8.** $\left\{\begin{array}{l} 0{,}2x+0{,}5y=4 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ x-y=6 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution** : $x$ est seul dans $\textcolor{#00549f}{\textcircled{e_{2}}}$. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}} \iff \textcolor{#2c5680}{x=y+6}$$

    $$0{,}2\,\textcolor{#2c5680}{x}+0{,}5y=4 \iff 0{,}2\,\textcolor{#2c5680}{(y+6)}+0{,}5y=4 \iff 0{,}7y=2{,}8 \iff y=4$$
     Puis $x=4+6=10$. 
    $$\boxed{S=\{(10\,;4)\}}$$

    **9.** $\left\{\begin{array}{l} 5x+2y=14 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2x+5y=14 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Combinaison linéaire** : le système est symétrique, la soustraction simplifie tout. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}}-\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad \textcolor{#9e0018}{(5x+2y)}-\textcolor{#2c5680}{(2x+5y)} =\textcolor{#9e0018}{14}-\textcolor{#2c5680}{14} \iff 3x-3y=0 \iff x=y$$
     En reportant dans $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ : $5x+2x=14 \iff 7x=14 \iff x=2$. 
    $$\boxed{S=\{(2\,;2)\}}$$

    **10.** $\left\{\begin{array}{l} 3x+5y=5 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2x-3y=2 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Combinaison linéaire** : pour éliminer $y$, on multiplie $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ par $3$ et $\textcolor{#00549f}{\textcircled{e_{2}}}$ par $5$. 
    $$3\times\textcolor{#c61e2d}{\textcircled{e_{1}}}+5\times\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad 3\times\textcolor{#9e0018}{(3x+5y)}+5\times\textcolor{#2c5680}{(2x-3y)} =3\times\textcolor{#9e0018}{5}+5\times\textcolor{#2c5680}{2}$$

    $$\iff 9x+15y+10x-15y=25 \iff 19x=25 \iff x=\frac{25}{19}$$
     En reprenant $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ : $5y=5-\dfrac{75}{19}=\dfrac{20}{19}$, donc $y=\dfrac{4}{19}$. 
    $$\boxed{S=\left\{\left(\frac{25}{19}\,;\frac{4}{19}\right)\right\}}$$

    **11.** $\left\{\begin{array}{l} 3x+y=5 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 6x+2y=10 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Combinaison linéaire**. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}}-2\times\textcolor{#c61e2d}{\textcircled{e_{1}}} \quad\text{donne :}\quad \textcolor{#2c5680}{(6x+2y)}-2\times\textcolor{#9e0018}{(3x+y)} =\textcolor{#2c5680}{10}-2\times\textcolor{#9e0018}{5} \iff 0=0$$
     L'égalité obtenue est toujours vraie : la seconde équation n'apporte aucune information nouvelle, elle est simplement le double de la première. Toute solution de $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ convient : 
    $$\boxed{S=\left\{(x\,;5-3x),\ x\in\mathbb{R}\right\}}$$
     **Interprétation géométrique :** les deux équations décrivent une *même* droite. Les droites sont **confondues**, et le système admet une infinité de solutions.

    **12.** $\left\{\begin{array}{l} \dfrac{3}{2}x-\dfrac{5}{3}y=1 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[2mm] \dfrac{x+2y}{7}=1 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution**, après avoir chassé le dénominateur de $\textcolor{#00549f}{\textcircled{e_{2}}}$. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}} \iff x+2y=7 \iff \textcolor{#2c5680}{x=7-2y}$$

    $$\frac{3}{2}\,\textcolor{#2c5680}{x}-\frac{5}{3}y=1 \iff \frac{3}{2}\,\textcolor{#2c5680}{(7-2y)}-\frac{5}{3}y=1 \iff \frac{21}{2}-3y-\frac{5}{3}y=1 \iff -\frac{14}{3}y=-\frac{19}{2}$$
     donc $y=\dfrac{19}{2}\times\dfrac{3}{14}=\dfrac{57}{28}$, puis $x=7-\dfrac{57}{14}=\dfrac{41}{14}$. 
    $$\boxed{S=\left\{\left(\frac{41}{14}\,;\frac{57}{28}\right)\right\}}$$
- id: "p-03-27"
  feuille: "f-p-03"
  numero: 27
  partie: "Systèmes d'équations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations de droite, "systèmes d'équations"]
  noeuds: [v-espace, v-determinant]
  notions: []
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Résoudre les systèmes suivants. Pour les deux premiers, on interprétera géométriquement le résultat en termes de droites.

    **1.** $\begin{cases} \dfrac{3}{2}x+\dfrac{9}{4}y=0 \\[2mm] \dfrac{1}{3}x+\dfrac{1}{2}y=\dfrac{17}{36} \end{cases}$

    **2.** $\begin{cases} \dfrac{5}{3}x-\dfrac{1}{4}y=\dfrac{35}{8} \\[2mm] \dfrac{1}{3}x-\dfrac{1}{20}y=\dfrac{7}{8} \end{cases}$

    **3.** $\begin{cases} x\sqrt{2}+y=4 \\ 2x-y\sqrt{2}=0 \end{cases}$

    **4.** $\begin{cases} 3x^{2}-y^{2}=3 \\ x^{2}+2y^{2}=22 \end{cases}$

    **5.** $\begin{cases} \dfrac{2}{x+1}-\dfrac{5}{y-2}=-4 \\[2mm] \dfrac{3}{x+1}+\dfrac{2}{y-2}=13 \end{cases}$
  corrige: |
    **1.** $\left\{\begin{array}{l} \dfrac{3}{2}x+\dfrac{9}{4}y=0 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[2mm] \dfrac{1}{3}x+\dfrac{1}{2}y=\dfrac{17}{36} \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ On simplifie d'abord les deux équations : 
    $$\frac{4}{3}\times\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff 2x+3y=0 \qquad\text{et}\qquad 6\times\textcolor{#00549f}{\textcircled{e_{2}}} \iff 2x+3y=\frac{17}{6}$$
     **Combinaison linéaire** : en soustrayant les deux équations obtenues, tout disparaît à gauche. 
    $$\textcolor{#2c5680}{(2x+3y)}-\textcolor{#9e0018}{(2x+3y)} =\textcolor{#2c5680}{\frac{17}{6}}-\textcolor{#9e0018}{0} \iff 0=\frac{17}{6}$$
     Cette égalité est fausse : le système n'a aucune solution. 
    $$\boxed{S=\varnothing}$$
     **Interprétation :** les deux droites ont le même vecteur directeur mais des ordonnées à l'origine différentes : elles sont **strictement parallèles**, donc sans point commun.

    **2.** $\left\{\begin{array}{l} \dfrac{5}{3}x-\dfrac{1}{4}y=\dfrac{35}{8} \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[2mm] \dfrac{1}{3}x-\dfrac{1}{20}y=\dfrac{7}{8} \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ On simplifie de la même manière : 
    $$\frac{3}{5}\times\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff x-\frac{3}{20}y=\frac{21}{8} \qquad\text{et}\qquad 3\times\textcolor{#00549f}{\textcircled{e_{2}}} \iff x-\frac{3}{20}y=\frac{21}{8}$$
     Les deux équations sont *identiques* : toute solution de l'une est solution de l'autre. 
    $$\boxed{S=\left\{\left(x\,;\frac{20}{3}\left(x-\frac{21}{8}\right)\right),\ x\in\mathbb{R}\right\}}$$
     **Interprétation :** les deux droites sont **confondues**, et le système admet une infinité de solutions.

    **3.** $\left\{\begin{array}{l} x\sqrt{2}+y=4 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2x-y\sqrt{2}=0 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ **Substitution**. 
    $$\textcolor{#00549f}{\textcircled{e_{2}}} \iff y\sqrt{2}=2x \iff \textcolor{#2c5680}{y=\frac{2x}{\sqrt{2}}=x\sqrt{2}}$$

    $$x\sqrt{2}+\textcolor{#2c5680}{y}=4 \iff x\sqrt{2}+\textcolor{#2c5680}{x\sqrt{2}}=4 \iff 2x\sqrt{2}=4 \iff x=\frac{2}{\sqrt{2}}=\sqrt{2}$$
     Puis $y=\sqrt{2}\times\sqrt{2}=2$. 
    $$\boxed{S=\left\{\left(\sqrt{2}\,;2\right)\right\}}$$

    **4.** $\left\{\begin{array}{l} 3x^{2}-y^{2}=3 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ x^{2}+2y^{2}=22 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ Ce système n'est pas linéaire, mais il le devient si l'on pose 
    $$X=x^{2} \qquad\text{et}\qquad Y=y^{2}$$
     Le système s'écrit alors $\left\{\begin{array}{l} 3X-Y=3 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ X+2Y=22 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$, que l'on résout par **combinaison linéaire** : 
    $$2\times\textcolor{#c61e2d}{\textcircled{e_{1}}}+\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad 2\times\textcolor{#9e0018}{(3X-Y)}+\textcolor{#2c5680}{(X+2Y)} =2\times\textcolor{#9e0018}{3}+\textcolor{#2c5680}{22}$$

    $$\iff 6X-2Y+X+2Y=28 \iff 7X=28 \iff X=4$$
     Puis $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ donne $Y=3\times 4-3=9$.

    Il reste à **revenir aux inconnues initiales** : $x^{2}=4$ donne $x=2$ ou $x=-2$, et $y^{2}=9$ donne $y=3$ ou $y=-3$. Toutes les combinaisons conviennent : 
    $$\boxed{S=\{(2\,;3)\,;\ (2\,;-3)\,;\ (-2\,;3)\,;\ (-2\,;-3)\}}$$
     *Piège classique :* chaque carré fournit **deux** valeurs, d'où quatre couples et non un seul.

    **5.** $\left\{\begin{array}{l} \dfrac{2}{x+1}-\dfrac{5}{y-2}=-4 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\[2mm] \dfrac{3}{x+1}+\dfrac{2}{y-2}=13 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$ Les valeurs $x=-1$ et $y=2$ sont interdites. On pose 
    $$X=\frac{1}{x+1} \qquad\text{et}\qquad Y=\frac{1}{y-2}$$
     Le système devient $\left\{\begin{array}{l} 2X-5Y=-4 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 3X+2Y=13 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$, résolu par **combinaison linéaire** : 
    $$2\times\textcolor{#c61e2d}{\textcircled{e_{1}}}+5\times\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad 2\times\textcolor{#9e0018}{(2X-5Y)}+5\times\textcolor{#2c5680}{(3X+2Y)} =2\times\textcolor{#9e0018}{(-4)}+5\times\textcolor{#2c5680}{13}$$

    $$\iff 4X-10Y+15X+10Y=57 \iff 19X=57 \iff X=3$$
     Puis $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ donne $2\times 3-5Y=-4$, soit $Y=2$.

    Retour aux inconnues : $\dfrac{1}{x+1}=3$ donne $x+1=\dfrac{1}{3}$, soit $x=-\dfrac{2}{3}$ ; et $\dfrac{1}{y-2}=2$ donne $y-2=\dfrac{1}{2}$, soit $y=\dfrac{5}{2}$. Ces deux valeurs sont bien autorisées. 
    $$\boxed{S=\left\{\left(-\frac{2}{3}\,;\frac{5}{2}\right)\right\}}$$
- id: "p-03-28"
  feuille: "f-p-03"
  numero: 28
  partie: "Systèmes d'équations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [norme et distance, "systèmes d'équations"]
  noeuds: [v-determinant]
  notions: []
  page_enonce: 8
  page_corrige: 21
  enonce: |
    Chacune des situations suivantes se traduit par un système de deux équations à deux inconnues. On précisera à chaque fois les inconnues choisies, on écrira le système, puis on le résoudra.

    **1.** Au cinéma, $3$ places adulte et $2$ places enfant coûtent $37$ €, tandis que $2$ places adulte et $5$ places enfant coûtent $43$ €. Quel est le prix de chaque place ?

    **2.** Un terrain rectangulaire a un périmètre de $34$ m, et sa longueur dépasse sa largeur de $5$ m. Quelles sont ses dimensions ?

    **3.** Une tirelire contient $60$ pièces, des pièces de $2$ € et des pièces de $5$ €, pour un total de $180$ €. Combien y a-t-il de pièces de chaque sorte ?

    **4.** Un père a aujourd'hui trois fois l'âge de son fils. Dans $12$ ans, il n'aura plus que le double de son âge. Quels sont leurs âges actuels ?
  corrige: |
    **1.** Notons $a$ le prix d'une place adulte et $e$ celui d'une place enfant, en euros. 
    $$\left\{\begin{array}{l} 3a+2e=37 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2a+5e=43 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$$
     **Combinaison linéaire** : pour éliminer $e$, on multiplie $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ par $5$ et $\textcolor{#00549f}{\textcircled{e_{2}}}$ par $2$. 
    $$5\times\textcolor{#c61e2d}{\textcircled{e_{1}}}-2\times\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad 5\times\textcolor{#9e0018}{(3a+2e)}-2\times\textcolor{#2c5680}{(2a+5e)} =5\times\textcolor{#9e0018}{37}-2\times\textcolor{#2c5680}{43}$$

    $$\iff 15a+10e-4a-10e=185-86 \iff 11a=99 \iff a=9$$
     En reprenant $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ : $2e=37-27=10$, donc $e=5$. 
    $$\boxed{\text{Une place adulte coûte } 9~\text{€, une place enfant } 5~\text{€.}}$$

    **2.** Notons $L$ la longueur et $\ell$ la largeur, en mètres. Le périmètre donne $2(L+\ell)=34$, soit $L+\ell=17$. 
    $$\left\{\begin{array}{l} L+\ell=17 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ L-\ell=5 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$$
     **Combinaison linéaire** : les coefficients de $\ell$ sont opposés. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}}+\textcolor{#00549f}{\textcircled{e_{2}}} \quad\text{donne :}\quad \textcolor{#9e0018}{(L+\ell)}+\textcolor{#2c5680}{(L-\ell)} =\textcolor{#9e0018}{17}+\textcolor{#2c5680}{5} \iff 2L=22 \iff L=11$$
     Puis $\ell=17-11=6$. 
    $$\boxed{\text{Le terrain mesure } 11~\text{m sur } 6~\text{m.}}$$

    **3.** Notons $x$ le nombre de pièces de $2$ € et $y$ celui de pièces de $5$ €. 
    $$\left\{\begin{array}{l} x+y=60 \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ 2x+5y=180 \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$$
     **Substitution** : $x$ s'isole immédiatement dans $\textcolor{#c61e2d}{\textcircled{e_{1}}}$. 
    $$\textcolor{#c61e2d}{\textcircled{e_{1}}} \iff \textcolor{#9e0018}{x=60-y}$$

    $$2\,\textcolor{#9e0018}{x}+5y=180 \iff 2\,\textcolor{#9e0018}{(60-y)}+5y=180 \iff 120-2y+5y=180 \iff 3y=60 \iff y=20$$
     Puis $x=60-20=40$. 
    $$\boxed{\text{Il y a } 40 \text{ pièces de } 2~\text{€ et } 20 \text{ pièces de } 5~\text{€.}}$$

    **4.** Notons $p$ l'âge du père et $f$ celui du fils, en années. 
    $$\left\{\begin{array}{l} p=3f \;\textcolor{#c61e2d}{\textcircled{e_{1}}} \\ p+12=2(f+12) \;\textcolor{#00549f}{\textcircled{e_{2}}} \end{array}\right.$$
     **Substitution** : $\textcolor{#c61e2d}{\textcircled{e_{1}}}$ donne déjà $p$ en fonction de $f$. 
    $$\textcolor{#9e0018}{p}+12=2(f+12) \iff \textcolor{#9e0018}{3f}+12=2f+24 \iff f=12$$
     Puis $p=3\times 12=36$. 
    $$\boxed{\text{Le fils a } 12 \text{ ans et le père } 36 \text{ ans.}}$$
     *Vérification :* dans $12$ ans, ils auront $24$ et $48$ ans, et l'on a bien $48=2\times 24$.
