  enonce: |
    **Les trois médianes d'un triangle sont concourantes.**

    Soit $ABC$ un triangle. On note $A'$ le milieu de $[BC]$, $B'$ le milieu de $[AC]$ et $C'$ le milieu de $[AB]$. Les droites $(AA')$, $(BB')$ et $(CC')$ sont les **médianes** du triangle.

    On définit le point $G$ par la relation : 
    $$\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$$

    **1.** Justifier, à l'aide de l'exercice 5, que pour tout point $M$ du plan : 
    $$\overrightarrow{MA}+\overrightarrow{MB}+\overrightarrow{MC}=3\,\overrightarrow{MG}$$

    **2.** En appliquant cette égalité au point $M=A$, montrer que $\overrightarrow{AB}+\overrightarrow{AC}=3\,\overrightarrow{AG}$.

    **3.** Justifier par ailleurs que $\overrightarrow{AB}+\overrightarrow{AC}=2\,\overrightarrow{AA'}$.

    **4.** En déduire que $\overrightarrow{AG}=\dfrac{2}{3}\overrightarrow{AA'}$, puis que le point $G$ appartient à la médiane $(AA')$.

    **5.** Expliquer pourquoi le même raisonnement, mené à partir de $M=B$ puis de $M=C$, montre que $G$ appartient aussi à $(BB')$ et à $(CC')$. Conclure.

    **6.** **Vérification dans un repère.** On prend $A(-2\,;1)$, $B(4\,;3)$ et $C(1\,;-4)$.

    **(a)** Déterminer les coordonnées de $G$.

    **(b)** Déterminer les coordonnées de $A'$, puis vérifier par le calcul que $\overrightarrow{AG}=\dfrac{2}{3}\overrightarrow{AA'}$.

    **(c)** Déterminer une équation cartésienne de la médiane $(AA')$ et vérifier que $G$ lui appartient.
  corrige: |
    **1.** C'est exactement la question 3 de l'exercice 5. On introduit le point $G$ dans chacun des trois vecteurs : 
    $$\overrightarrow{MA}+\overrightarrow{MB}+\overrightarrow{MC} =3\overrightarrow{MG}+\underbrace{\left(\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}\right)}_{=\vec{0}} =\boxed{3\overrightarrow{MG}}$$

    **2.** L'égalité étant valable pour tout point $M$, on choisit $M=A$. Comme $\overrightarrow{AA}=\vec{0}$ : 
    $$\vec{0}+\overrightarrow{AB}+\overrightarrow{AC}=3\overrightarrow{AG} \qquad\text{soit}\qquad \boxed{\overrightarrow{AB}+\overrightarrow{AC}=3\overrightarrow{AG}}$$

    **3.** Le point $A'$ étant le milieu de $[BC]$, on a $\overrightarrow{A'B}+\overrightarrow{A'C}=\vec{0}$. On introduit alors $A'$ dans les deux vecteurs : 
    $$\overrightarrow{AB}+\overrightarrow{AC}=\left(\overrightarrow{AA'}+\overrightarrow{A'B}\right)+\left(\overrightarrow{AA'}+\overrightarrow{A'C}\right) =2\overrightarrow{AA'}+\underbrace{\left(\overrightarrow{A'B}+\overrightarrow{A'C}\right)}_{=\vec{0}}=\boxed{2\overrightarrow{AA'}}$$

    **4.** En rapprochant les deux résultats : $3\overrightarrow{AG}=2\overrightarrow{AA'}$, donc 
    $$\boxed{\overrightarrow{AG}=\frac{2}{3}\overrightarrow{AA'}}$$
     Les vecteurs $\overrightarrow{AG}$ et $\overrightarrow{AA'}$ sont colinéaires et partent du même point $A$ : 
    $$\boxed{G \text{ appartient à la médiane } (AA').}$$

    **5.** La relation $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$ est **symétrique** : elle joue le même rôle pour les trois sommets. En reprenant exactement le même raisonnement avec $M=B$, on obtient $\overrightarrow{BG}=\frac{2}{3}\overrightarrow{BB'}$, donc $G\in(BB')$ ; puis avec $M=C$, $\overrightarrow{CG}=\frac{2}{3}\overrightarrow{CC'}$, donc $G\in(CC')$. 
    $$\boxed{\text{Les trois médianes passent toutes par } G \text{ : elles sont concourantes.}}$$
     Le point $G$ est le **centre de gravité** du triangle, situé aux deux tiers de chaque médiane en partant du sommet.

    **6.** **(a)** En notant $G(x\,;y)$, la relation $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$ donne : 
    $$\begin{cases}(-2-x)+(4-x)+(1-x)=0\\(1-y)+(3-y)+(-4-y)=0\end{cases} \iff \begin{cases}3-3x=0\\-3y=0\end{cases} \qquad\text{soit}\qquad \boxed{G(1\,;0)}$$
     *On retrouve* la formule usuelle : le centre de gravité a pour coordonnées les moyennes de celles des trois sommets.

    **(b)** $A'$ est le milieu de $[BC]$ : $A'\left(\dfrac{4+1}{2}\,;\dfrac{3-4}{2}\right)=\boxed{A'(2{,}5\,;-0{,}5)}$

    $\overrightarrow{AG}\begin{pmatrix}1-(-2)\\0-1\end{pmatrix}=\begin{pmatrix}3\\-1\end{pmatrix}$ et $\overrightarrow{AA'}\begin{pmatrix}4{,}5\\-1{,}5\end{pmatrix}$, donc 
    $$\frac{2}{3}\overrightarrow{AA'}=\begin{pmatrix}3\\-1\end{pmatrix}=\boxed{\overrightarrow{AG}}$$

    **(c)** $\overrightarrow{AA'}\begin{pmatrix}4{,}5\\-1{,}5\end{pmatrix}$ se simplifie en $\begin{pmatrix}3\\-1\end{pmatrix}$, donc $b=-3$ et $a=-1$ : l'équation est $-x-3y+c=0$. Avec $A(-2\,;1)$ : $2-3+c=0$, donc $c=1$ : 
    $$\boxed{(AA') : x+3y-1=0}$$
     On vérifie que $G(1\,;0)$ appartient bien à cette droite : $1+0-1=0$.

    ![Figure](documents/figures/092644742c0214eb.svg)

    Les trois médianes $(AA')$ en noir, $(BB')$ en ocre et $(CC')$ en violet se coupent bien au point $G(1\,;0)$.

