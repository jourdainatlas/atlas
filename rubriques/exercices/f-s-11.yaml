  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des études suivantes, préciser la population, les individus et le caractère étudié, puis dire si ce caractère est quantitatif ou qualitatif.

    **1.** On relève la taille, en centimètres, des $28$ élèves d'une classe de Seconde.

    **2.** On demande à $500$ automobilistes la couleur de leur voiture.

    **3.** On note le nombre de buts marqués par chacune des $20$ équipes d'un championnat.

    **4.** On interroge les $1\,200$ habitants d'un village sur leur moyen de transport habituel.

    **5.** On mesure la durée de vie, en heures, de $80$ ampoules sorties d'une usine.

    **6.** On recense la matière préférée des $150$ élèves d'un niveau.
  corrige: |
    ```tableau
     ¦ **Population** ¦ **Individus** ¦ **Caractère** ¦ **Nature**
    **1.** ¦ les $28$ élèves de la classe ¦ un élève ¦ la taille, en cm ¦ quantitatif
    **2.** ¦ les $500$ automobilistes ¦ un automobiliste ¦ la couleur de la voiture ¦ qualitatif
    **3.** ¦ les $20$ équipes ¦ une équipe ¦ le nombre de buts ¦ quantitatif
    **4.** ¦ les $1\,200$ habitants ¦ un habitant ¦ le moyen de transport ¦ qualitatif
    **5.** ¦ les $80$ ampoules ¦ une ampoule ¦ la durée de vie, en heures ¦ quantitatif
    **6.** ¦ les $150$ élèves du niveau ¦ un élève ¦ la matière préférée ¦ qualitatif
    ```

    *Piège :* un caractère peut être désigné par un nombre sans être quantitatif. Un numéro de maillot ou un code postal ne se moyenne pas : ce sont des étiquettes, donc des caractères qualitatifs.
- id: "s-11-02"
  feuille: "f-s-11"
  numero: 2
  partie: "Vocabulaire et représentations"
  etoiles: 1
