  enonce: |
    On a demandé à des élèves combien de livres ils avaient lus pendant les vacances. Le diagramme en bâtons ci-dessous résume les réponses.

    ![Figure](documents/figures/c8b03697eb9be809.svg)

    **1.** Dresser le tableau des effectifs de cette série.

    **2.** Déterminer l'effectif total.

    **3.** Calculer la fréquence de chaque valeur.

    **4.** Quel pourcentage d'élèves a lu au moins trois livres ?
  corrige: |
    **1.** On lit la hauteur de chaque bâton :

    ```tableau
    **Nombre de livres** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$ ¦ **Total**
    **Effectif** ¦ $2$ ¦ $6$ ¦ $8$ ¦ $5$ ¦ $3$ ¦ $1$ ¦ $25$
    ```

    **2.** On additionne les six effectifs : 
    $$2 + 6 + 8 + 5 + 3 + 1 = \boxed{25 \text{ élèves}}$$

    **3.** On divise chaque effectif par $25$ : 
    $$\boxed{\begin{array}{l} f = 0{,}08 \;;\; 0{,}24 \;;\; 0{,}32 \;;\; 0{,}20 \;;\; 0{,}12 \;;\; 0{,}04 \\[1mm] \text{et la somme vaut bien } 1. \end{array}}$$

    **4.** « Au moins trois livres » correspond aux valeurs $3$, $4$ et $5$ : 
    $$0{,}20 + 0{,}12 + 0{,}04 = 0{,}36 = \boxed{36\,\%}$$
- id: "s-11-06"
  feuille: "f-s-11"
  numero: 6
  partie: "Vocabulaire et représentations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vocabulaire statistique]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Un élève a recopié le tableau suivant, portant sur $80$ personnes.

    ```tableau
    **Valeur $x_{i}$** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$
    **Effectif $n_{i}$** ¦ $12$ ¦ $20$ ¦ $28$ ¦ $20$
    **Fréquence $f_{i}$** ¦ $0{,}15$ ¦ $0{,}25$ ¦ $0{,}30$ ¦ $0{,}25$
    ```

    **1.** Effectuer le contrôle recommandé par le cours sur la ligne des fréquences.

    **2.** Localiser l'erreur et corriger le tableau.
  corrige: |
    **1.** On additionne la ligne des fréquences : 
    $$0{,}15 + 0{,}25 + 0{,}30 + 0{,}25 = \boxed{0{,}95}$$
     Cette somme ne vaut pas $1$ : 
    $$\boxed{\text{Le tableau comporte donc une erreur.}}$$

    **2.** On recalcule chaque fréquence à partir de l'effectif, avec $N = 80$ : 
    $$\frac{12}{80} = 0{,}15 \qquad \frac{20}{80} = 0{,}25 \qquad \frac{28}{80} = 0{,}35 \qquad \frac{20}{80} = 0{,}25$$

    $$\boxed{\text{L'erreur porte sur la troisième fréquence : il faut lire } 0{,}35 \text{ et non } 0{,}30.}$$
     On vérifie alors que $0{,}15 + 0{,}25 + 0{,}35 + 0{,}25 = 1$.
- id: "s-11-07"
  feuille: "f-s-11"
  numero: 7
  partie: "Moyenne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [moyenne]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    Calculer la moyenne de chacune des séries suivantes.

    **1.** $4 \;;\; 7 \;;\; 9 \;;\; 12$

    **2.** $3 \;;\; 5 \;;\; 5 \;;\; 8 \;;\; 9$

    **3.** $12 \;;\; 15 \;;\; 11 \;;\; 14 \;;\; 13 \;;\; 7$

    **4.** $2{,}5 \;;\; 3{,}5 \;;\; 4 \;;\; 6$
  corrige: |
    On additionne les valeurs, puis on divise par leur nombre.

    $$\textbf{1.}\quad \overline{x} = \frac{4+7+9+12}{4} = \frac{32}{4} = \boxed{8} \qquad\qquad \textbf{2.}\quad \overline{x} = \frac{3+5+5+8+9}{5} = \frac{30}{5} = \boxed{6}$$

    $$\textbf{3.}\quad \overline{x} = \frac{12+15+11+14+13+7}{6} = \frac{72}{6} = \boxed{12} \qquad \textbf{4.}\quad \overline{x} = \frac{2{,}5+3{,}5+4+6}{4} = \frac{16}{4} = \boxed{4}$$
- id: "s-11-08"
  feuille: "f-s-11"
  numero: 8
  partie: "Moyenne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vocabulaire statistique, moyenne]
  noeuds: [n-sommes, p-esperance]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    Le tableau ci-dessous donne la durée, en minutes, de $40$ communications téléphoniques.

    ```tableau
    **Durée $x_{i}$** ¦ $5$ ¦ $10$ ¦ $15$ ¦ $20$
    **Effectif $n_{i}$** ¦ $6$ ¦ $14$ ¦ $14$ ¦ $6$
    ```

    **1.** Calculer la durée moyenne d'une communication.

    **2.** Combien de temps a-t-on passé au téléphone au total ?
  corrige: |
    **1.** On applique la formule de la moyenne d'une série donnée par un tableau d'effectifs : 
    $$\overline{x} = \frac{6 \times 5 + 14 \times 10 + 14 \times 15 + 6 \times 20}{40} = \frac{30 + 140 + 210 + 120}{40} = \frac{500}{40} = \boxed{12{,}5 \text{ minutes}}$$

    *Piège :* le dénominateur est l'effectif total $40$, et non le nombre de valeurs différentes, qui vaut $4$.

    **2.** Le numérateur du calcul précédent est précisément la durée totale : 
    $$\boxed{500 \text{ minutes, soit } 8 \text{ h } 20 \text{ min}}$$
- id: "s-11-09"
  feuille: "f-s-11"
  numero: 9
  partie: "Moyenne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [moyenne, moyenne pondérée]
  noeuds: [p-esperance, n-sommes]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    Un élève obtient les notes suivantes au premier trimestre.

    ```tableau
    **Matière** ¦ Maths ¦ Français ¦ Anglais ¦ Sport
    **Note $x_{i}$** ¦ $14$ ¦ $8$ ¦ $11$ ¦ $16$
    **Coefficient $c_{i}$** ¦ $3$ ¦ $4$ ¦ $2$ ¦ $1$
    ```

    Calculer sa moyenne pondérée.
  corrige: |
    On applique la formule de la moyenne pondérée, dont le dénominateur est la somme des coefficients : 
    $$\overline{x} = \frac{3 \times 14 + 4 \times 8 + 2 \times 11 + 1 \times 16}{3+4+2+1} = \frac{42 + 32 + 22 + 16}{10} = \frac{112}{10} = \boxed{11{,}2}$$
- id: "s-11-10"
  feuille: "f-s-11"
  numero: 10
  partie: "Moyenne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [moyenne, moyenne pondérée]
  noeuds: [p-esperance, n-sommes]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un candidat passe trois épreuves : il obtient $16$ à l'épreuve d'entretien (coefficient $1$), $6$ à l'épreuve écrite (coefficient $5$) et $12$ à l'épreuve pratique (coefficient $4$).

    **1.** Calculer la moyenne des trois notes sans tenir compte des coefficients.

    **2.** Calculer la moyenne pondérée du candidat.

    **3.** Comparer les deux résultats et expliquer l'écart obtenu.
  corrige: |
    **1.** Sans les coefficients, on fait la moyenne des trois notes : 
    $$\frac{16 + 6 + 12}{3} = \frac{34}{3} \approx \boxed{11{,}33}$$

    **2.** Avec les coefficients : 
    $$\overline{x} = \frac{1 \times 16 + 5 \times 6 + 4 \times 12}{1+5+4} = \frac{16 + 30 + 48}{10} = \frac{94}{10} = \boxed{9{,}4}$$

    **3.** La moyenne pondérée est nettement plus basse que la moyenne simple. 
    $$\boxed{\text{La plus mauvaise note, } 6, \text{ porte le plus fort coefficient : elle tire la moyenne vers le bas.}}$$
     À l'inverse, le $16$ ne compte que pour un dixième du total. C'est exactement ce que traduit la figure du cours, où la largeur de chaque bloc mesure le poids de la note.
- id: "s-11-11"
  feuille: "f-s-11"
  numero: 11
  partie: "Moyenne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne, moyenne pondérée]
  noeuds: [p-esperance, n-sommes]
  notions: [esperance]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un élève a déjà obtenu $12$ (coefficient $2$), $9$ (coefficient $3$) et $14$ (coefficient $1$). Il reste un dernier devoir, de coefficient $4$.

    **1.** Quelle note doit-il obtenir à ce dernier devoir pour avoir exactement $12$ de moyenne ?

    **2.** Quelle est la meilleure moyenne qu'il puisse espérer ?

    **3.** Peut-il encore atteindre $15$ de moyenne ?
  corrige: |
    **1.** Les trois premières notes apportent $2 \times 12 + 3 \times 9 + 1 \times 14 = 24 + 27 + 14 = 65$ points, pour une somme de coefficients de $6$. En notant $x$ la note du dernier devoir, de coefficient $4$, la somme des coefficients devient $6 + 4 = 10$ et la moyenne s'écrit : 
    $$\frac{65 + 4x}{10} = 12 \quad\Longleftrightarrow\quad 65 + 4x = 120 \quad\Longleftrightarrow\quad 4x = 55 \quad\Longleftrightarrow\quad x = \boxed{13{,}75}$$

    **2.** La meilleure note possible est $20$ : 
    $$\overline{x} = \frac{65 + 4 \times 20}{10} = \frac{145}{10} = \boxed{14{,}5}$$

    **3.** La moyenne maximale atteignable est $14{,}5$, qui est inférieure à $15$ : 
    $$\boxed{\text{Non, il ne peut plus atteindre } 15 \text{ de moyenne.}}$$
- id: "s-11-12"
  feuille: "f-s-11"
  numero: 12
  partie: "Moyenne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne, contexte économique]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 4
  enonce: |
    Dans chaque cas, déterminer la nouvelle moyenne sans recalculer la série.

    **1.** Une série a pour moyenne $12{,}5$ et l'on ajoute $1{,}5$ à chacune de ses valeurs.

    **2.** Une série a pour moyenne $12{,}5$ et l'on multiplie chacune de ses valeurs par $2$.

    **3.** Une série a pour moyenne $12{,}5$ ; on multiplie chaque valeur par $3$, puis on retranche $5$ au résultat.

    **4.** Le prix moyen des articles d'un magasin est de $40$ € et tous les prix augmentent de $5\,\%$.

    **5.** La température moyenne d'une ville est de $20$ degrés Celsius. On la convertit en degrés Fahrenheit à l'aide de la formule $F = 1{,}8\,C + 32$.
  corrige: |
    On utilise la propriété 1 du cours : la moyenne subit la même transformation que les valeurs.

    **1.** On ajoute $1{,}5$ à la moyenne : 
    $$\overline{x} = 12{,}5 + 1{,}5 = \boxed{14}$$

    **2.** On multiplie la moyenne par $2$ : 
    $$\overline{x} = 12{,}5 \times 2 = \boxed{25}$$

    **3.** On applique la transformation à la moyenne : 
    $$\overline{x} = 3 \times 12{,}5 - 5 = 37{,}5 - 5 = \boxed{32{,}5}$$

    **4.** Augmenter de $5\,\%$ revient à multiplier par le coefficient multiplicateur $1{,}05$ : 
    $$\overline{x} = 40 \times 1{,}05 = \boxed{42 \text{ €}}$$

    **5.** La transformation est de la forme $ax + b$ avec $a = 1{,}8$ et $b = 32$ : 
    $$\overline{x} = 1{,}8 \times 20 + 32 = 36 + 32 = \boxed{68 \text{ degrés Fahrenheit}}$$
- id: "s-11-13"
  feuille: "f-s-11"
  numero: 13
  partie: "Moyenne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Un devoir commun a été donné à deux groupes d'élèves. Le groupe A compte $12$ élèves, de moyenne $13$. Le groupe B compte $18$ élèves, de moyenne $8$.

    **1.** Calculer la somme des notes du groupe A, puis celle du groupe B.

    **2.** En déduire la moyenne de l'ensemble des $30$ élèves.

    **3.** Un élève affirme que cette moyenne vaut $10{,}5$. Expliquer son erreur.
  corrige: |
    **1.** La somme des notes d'un groupe s'obtient en multipliant sa moyenne par son effectif : 
    $$\text{groupe A} : 12 \times 13 = \boxed{156} \qquad\qquad \text{groupe B} : 18 \times 8 = \boxed{144}$$

    **2.** On additionne les deux sommes et on divise par l'effectif total $12 + 18 = 30$ : 
    $$\overline{x} = \frac{156 + 144}{30} = \frac{300}{30} = \boxed{10}$$

    **3.** L'élève a calculé $\dfrac{13 + 8}{2} = 10{,}5$, c'est-à-dire la moyenne des deux moyennes. 
    $$\boxed{\text{Ce calcul supposerait que les deux groupes ont le même effectif, ce qui est faux ici.}}$$
     Le groupe B, plus nombreux, doit peser davantage : c'est une moyenne pondérée par les effectifs, et non une moyenne simple.
- id: "s-11-14"
  feuille: "f-s-11"
  numero: 14
  partie: "Moyenne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne, contexte économique]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Les salaires mensuels, en euros, des cinq employés d'une entreprise sont : 
    $$1\,500 \;;\; 1\,600 \;;\; 1\,700 \;;\; 1\,800 \;;\; 2\,000$$

    **1.** Calculer le salaire moyen de cette entreprise.

    **2.** Le salarié le mieux payé obtient une forte augmentation : son salaire passe de $2\,000$ à $9\,400$ euros. Calculer la nouvelle moyenne.

    **3.** Combien d'employés gagnent moins que ce nouveau salaire moyen ? Cet indicateur décrit-il bien l'entreprise ?
  corrige: |
    **1.** On additionne les cinq salaires et on divise par $5$ : 
    $$\overline{x} = \frac{1\,500 + 1\,600 + 1\,700 + 1\,800 + 2\,000}{5} = \frac{8\,600}{5} = \boxed{1\,720 \text{ €}}$$

    **2.** On procède de la même manière avec le nouveau salaire : 
    $$\overline{x} = \frac{1\,500 + 1\,600 + 1\,700 + 1\,800 + 9\,400}{5} = \frac{16\,000}{5} = \boxed{3\,200 \text{ €}}$$

    **3.** Les quatre premiers salariés gagnent tous moins de $3\,200$ € : 
    $$\boxed{\text{Quatre employés sur cinq gagnent moins que le salaire moyen.}}$$

    $$\boxed{\text{La moyenne décrit donc très mal cette entreprise.}}$$
     Une seule valeur extrême a presque doublé la moyenne : c'est le point d'équilibre du cours qui se déplace fortement dès qu'un poids s'éloigne. On reprend cette série à l'exercice 19 pour voir comment se comporte la médiane.
- id: "s-11-15"
  feuille: "f-s-11"
  numero: 15
  partie: "Médiane"
  etoiles: 1
  types: [Calcul]
  mots_cles: [médiane]
  noeuds: [p-variables]
  notions: []
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Déterminer la médiane de chacune des séries suivantes.

    **1.** $3 \;;\; 7 \;;\; 8 \;;\; 11 \;;\; 14$

    **2.** $2 \;;\; 5 \;;\; 6 \;;\; 9$

    **3.** $12 \;;\; 4 \;;\; 9 \;;\; 7 \;;\; 15 \;;\; 6$

    **4.** $10 \;;\; 10 \;;\; 12 \;;\; 15 \;;\; 18 \;;\; 20 \;;\; 21$
  corrige: |
    **1.** La série $3 \;;\; 7 \;;\; 8 \;;\; 11 \;;\; 14$ est déjà rangée et comporte $N = 5$ valeurs. Comme $N$ est impair, la médiane est la valeur de rang $\dfrac{5+1}{2} = 3$ : 
    $$M = \boxed{8}$$

    **2.** Ici $N = 4$ est pair : la médiane est la demi-somme des deuxième et troisième valeurs : 
    $$M = \frac{5 + 6}{2} = \boxed{5{,}5}$$

    **3.** On commence par ranger la série : $4 \;;\; 6 \;;\; 7 \;;\; 9 \;;\; 12 \;;\; 15$. Avec $N = 6$ : 
    $$M = \frac{7 + 9}{2} = \boxed{8}$$

    *Piège :* on ne peut pas déterminer une médiane sans avoir rangé la série. En prenant les valeurs dans l'ordre de l'énoncé, on aurait trouvé $\frac{9+7}{2} = 8$ par hasard, mais le raisonnement aurait été faux.

    **4.** Avec $N = 7$, impair, la médiane est la valeur de rang $\dfrac{7+1}{2} = 4$ : 
    $$M = \boxed{15}$$
- id: "s-11-16"
  feuille: "f-s-11"
  numero: 16
  partie: "Médiane"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vocabulaire statistique, moyenne, médiane]
  noeuds: [n-sommes, p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    On a relevé le nombre de langues étrangères parlées par $30$ employés d'une entreprise.

    ```tableau
    **Nombre de langues** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$
    **Effectif** ¦ $4$ ¦ $9$ ¦ $11$ ¦ $5$ ¦ $1$
    ```

    **1.** Vérifier que l'effectif total vaut $30$.

    **2.** Déterminer les rangs des deux valeurs centrales de la série.

    **3.** En déduire la médiane.

    **4.** Calculer la moyenne de cette série, arrondie au centième.
  corrige: |
    **1.** On additionne les effectifs : 
    $$4 + 9 + 11 + 5 + 1 = \boxed{30}$$

    **2.** L'effectif $N = 30$ est pair : les deux valeurs centrales sont celles de rangs $15$ et $16$. 
    $$\boxed{\text{Il s'agit des rangs } 15 \text{ et } 16.}$$

    **3.** On construit la ligne des effectifs cumulés :

    ```tableau
    **Nombre de langues** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$
    **Effectif** ¦ $4$ ¦ $9$ ¦ $11$ ¦ $5$ ¦ $1$
    **Effectif cumulé** ¦ $4$ ¦ $13$ ¦ $24$ ¦ $29$ ¦ $30$
    ```

    Les rangs $1$ à $13$ correspondent à des valeurs inférieures ou égales à $1$, et les rangs $14$ à $24$ à la valeur $2$. Les rangs $15$ et $16$ valent donc tous deux $2$ : 
    $$M = \frac{2 + 2}{2} = \boxed{2 \text{ langues}}$$

    **4.** On applique la formule de la moyenne : 
    $$\overline{x} = \frac{4 \times 0 + 9 \times 1 + 11 \times 2 + 5 \times 3 + 1 \times 4}{30} = \frac{0 + 9 + 22 + 15 + 4}{30} = \frac{50}{30} \approx \boxed{1{,}67 \text{ langue}}$$
- id: "s-11-17"
  feuille: "f-s-11"
  numero: 17
  partie: "Médiane"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [contexte économique]
  noeuds: [p-esperance]
  notions: []
  page_enonce: 5
  page_corrige: 6
  enonce: |
    Les salaires mensuels, en euros, des huit salariés d'une petite entreprise sont donnés ci-dessous, rangés dans l'ordre croissant : 
    $$1\,400 \;;\; 1\,450 \;;\; 1\,500 \;;\; 1\,500 \;;\; 1\,600 \;;\; 1\,650 \;;\; 1\,800 \;;\; 7\,100$$

    **1.** Calculer le salaire moyen.

    **2.** Déterminer le salaire médian.

    **3.** Le directeur veut recruter et annonce le salaire moyen dans son offre d'emploi. Un syndicat préfère communiquer le salaire médian. Expliquer l'intérêt de chacun pour celui qui l'utilise.

    **4.** Lequel des deux indicateurs décrit le mieux la situation des salariés ? Justifier.
  corrige: |
    **1.** On additionne les huit salaires : 
    $$\overline{x} = \frac{1\,400 + 1\,450 + 1\,500 + 1\,500 + 1\,600 + 1\,650 + 1\,800 + 7\,100}{8} = \frac{18\,000}{8} = \boxed{2\,250 \text{ €}}$$

    **2.** L'effectif $N = 8$ est pair : la médiane est la demi-somme des quatrième et cinquième valeurs : 
    $$M = \frac{1\,500 + 1\,600}{2} = \boxed{1\,550 \text{ €}}$$

    **3.** Les deux chiffres sont exacts, mais ne servent pas le même propos : 
    $$\boxed{\begin{array}{l} \text{Le directeur annonce } 2\,250 \text{ €, chiffre flatteur qui rend l'offre attractive.} \\[1mm] \text{Le syndicat annonce } 1\,550 \text{ €, chiffre qui décrit la situation réelle des salariés.} \end{array}}$$
     Les deux nombres sont exacts : c'est le choix de l'indicateur qui oriente le message.

    **4.** Sept salariés sur huit gagnent moins de $2\,250$ €. Le très haut salaire de $7\,100$ €, isolé, déplace fortement la moyenne mais laisse la médiane inchangée. 
    $$\boxed{\text{La médiane décrit bien mieux la situation des salariés.}}$$
- id: "s-11-18"
  feuille: "f-s-11"
  numero: 18
  partie: "Médiane"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [moyenne, médiane]
  noeuds: [p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    **1.** Donner une série de cinq nombres entiers dont la médiane est $12$ et la moyenne $14$.

    **2.** Donner une série de six nombres dont la médiane est $10$, sans qu'aucune valeur de la série ne soit égale à $10$.

    **3.** Est-il possible qu'une série ait une médiane strictement supérieure à toutes ses valeurs ? Justifier.
  corrige: |
    **1.** Il faut cinq entiers dont la troisième valeur, une fois rangés, vaut $12$, et dont la somme vaut $5 \times 14 = 70$. Par exemple : 
    $$\boxed{8 \;;\; 10 \;;\; 12 \;;\; 15 \;;\; 25}$$
     On vérifie : la médiane est bien la troisième valeur, $12$, et $\dfrac{8+10+12+15+25}{5} = \dfrac{70}{5} = 14$.

    D'autres réponses conviennent, par exemple $9 \;;\; 11 \;;\; 12 \;;\; 13 \;;\; 25$.

    **2.** Avec $N = 6$, la médiane est la demi-somme des troisième et quatrième valeurs : il suffit que ces deux-là soient symétriques autour de $10$ sans valoir $10$. Par exemple : 
    $$\boxed{8 \;;\; 9 \;;\; 9 \;;\; 11 \;;\; 12 \;;\; 15}$$
     On vérifie : $M = \dfrac{9 + 11}{2} = 10$, et aucune valeur de la série ne vaut $10$.

    **3.** Par définition, au moins la moitié des données sont supérieures ou égales à la médiane. Si $M$ était strictement supérieure à toutes les valeurs, aucune donnée ne lui serait supérieure ou égale. 
    $$\boxed{\text{Non, c'est impossible : la médiane est toujours comprise entre le minimum et le maximum.}}$$
- id: "s-11-19"
  feuille: "f-s-11"
  numero: 19
  partie: "Médiane"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne, médiane, contexte économique]
  noeuds: [p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    On reprend la série des cinq salaires de l'exercice 14 : 
    $$1\,500 \;;\; 1\,600 \;;\; 1\,700 \;;\; 1\,800 \;;\; 2\,000$$

    **1.** Déterminer la médiane de cette série.

    **2.** Déterminer la médiane de la série obtenue lorsque $2\,000$ est remplacé par $9\,400$.

    **3.** Comparer avec les moyennes calculées à l'exercice 14, et conclure sur la propriété de la médiane mise en évidence ici.
  corrige: |
    **1.** La série $1\,500 \;;\; 1\,600 \;;\; 1\,700 \;;\; 1\,800 \;;\; 2\,000$ est rangée et $N = 5$ est impair : la médiane est la valeur de rang $3$. 
    $$M = \boxed{1\,700 \text{ €}}$$

    **2.** La nouvelle série est $1\,500 \;;\; 1\,600 \;;\; 1\,700 \;;\; 1\,800 \;;\; 9\,400$, toujours rangée, et la valeur de rang $3$ n'a pas changé. 
    $$M = \boxed{1\,700 \text{ €}}$$

    **3.** On rassemble les résultats de l'exercice 14 et de celui-ci :

    $$\begin{array}{|c||c|c|} \hline  & \text{avant} & \text{après} \\ \hline \text{Moyenne} & 1\,720\text{ €} & 3\,200\text{ €} \\ \hline \text{Médiane} & 1\,700\text{ €} & 1\,700\text{ €} \\ \hline \end{array}$$

    $$\boxed{\text{La médiane est insensible aux valeurs extrêmes, contrairement à la moyenne.}}$$
     Seul le *rang* des valeurs intervient dans le calcul de la médiane : que la plus grande vaille $2\,000$ ou $9\,400$ ne change rien, tant qu'elle reste la plus grande.
- id: "s-11-20"
  feuille: "f-s-11"
  numero: 20
  partie: "Indicateurs de dispersion"
  etoiles: 1
  types: [Calcul]
  mots_cles: [étendue]
  noeuds: [p-variables]
  notions: []
  page_enonce: 5
  page_corrige: 7
  enonce: |
    Déterminer l'étendue de chacune des séries suivantes.

    **1.** $4 \;;\; 9 \;;\; 15 \;;\; 21$

    **2.** $-3 \;;\; 0 \;;\; 5 \;;\; 12$

    **3.** $2{,}5 \;;\; 8{,}1 \;;\; 3{,}7$

    **4.** les notes $8 \;;\; 8 \;;\; 8 \;;\; 8$
  corrige: |
    L'étendue est la différence entre la plus grande et la plus petite valeur.

    $$\textbf{1.}\quad 21 - 4 = \boxed{17} \qquad\qquad \textbf{2.}\quad 12 - (-3) = \boxed{15}$$

    $$\textbf{3.}\quad 8{,}1 - 2{,}5 = \boxed{5{,}6} \qquad\qquad \textbf{4.}\quad 8 - 8 = \boxed{0}$$

    Une étendue nulle signifie que toutes les valeurs de la série sont égales.
- id: "s-11-21"
  feuille: "f-s-11"
  numero: 21
  partie: "Indicateurs de dispersion"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vocabulaire statistique, médiane, quartiles, étendue]
  noeuds: [n-sommes, p-variables]
  notions: []
  page_enonce: 6
  page_corrige: 8
  enonce: |
    On considère la série suivante, déjà rangée dans l'ordre croissant : 
    $$3 \;;\; 5 \;;\; 6 \;;\; 8 \;;\; 9 \;;\; 9 \;;\; 11 \;;\; 12 \;;\; 13 \;;\; 15 \;;\; 16 \;;\; 20$$

    **1.** Déterminer l'effectif total, puis calculer $\dfrac{N}{4}$ et $\dfrac{3N}{4}$.

    **2.** En déduire $Q_{1}$ et $Q_{3}$.

    **3.** Déterminer la médiane de la série.

    **4.** Calculer l'étendue et l'écart interquartile.
  corrige: |
    **1.** La série comporte $N = 12$ valeurs : 
    $$\frac{N}{4} = \frac{12}{4} = \boxed{3} \qquad\text{et}\qquad \frac{3N}{4} = \frac{36}{4} = \boxed{9}$$

    **2.** Ces deux résultats étant entiers, $Q_{1}$ est la valeur de rang $3$ et $Q_{3}$ celle de rang $9$ : 
    $$Q_{1} = \boxed{6} \qquad\text{et}\qquad Q_{3} = \boxed{13}$$

    **3.** L'effectif $N = 12$ est pair : la médiane est la demi-somme des sixième et septième valeurs : 
    $$M = \frac{9 + 11}{2} = \boxed{10}$$

    **4.** On calcule les deux différences : 
    $$\text{étendue} = 20 - 3 = \boxed{17} \qquad\text{et}\qquad Q_{3} - Q_{1} = 13 - 6 = \boxed{7}$$
- id: "s-11-22"
  feuille: "f-s-11"
  numero: 22
  partie: "Indicateurs de dispersion"
  etoiles: 1
  types: [Calcul]
  mots_cles: [médiane, quartiles, étendue]
  noeuds: [p-variables]
  notions: []
  page_enonce: 6
  page_corrige: 8
  enonce: |
    Déterminer, pour chacune des deux séries suivantes, la médiane, les quartiles $Q_{1}$ et $Q_{3}$, l'étendue et l'écart interquartile.

    **1.** $2 \;;\; 4 \;;\; 5 \;;\; 7 \;;\; 8 \;;\; 10 \;;\; 11 \;;\; 13 \;;\; 15 \;;\; 18$

    **2.** $1 \;;\; 3 \;;\; 4 \;;\; 4 \;;\; 7 \;;\; 9 \;;\; 10 \;;\; 12 \;;\; 14$
  corrige: |
    **1.** La série comporte $N = 10$ valeurs, déjà rangées. 
    $$\frac{N}{4} = 2{,}5 \quad\text{n'est pas entier : on arrondit à } 3, \text{ donc } Q_{1} \text{ est la troisième valeur.}$$

    $$\frac{3N}{4} = 7{,}5 \quad\text{n'est pas entier : on arrondit à } 8, \text{ donc } Q_{3} \text{ est la huitième valeur.}$$

    $$\boxed{\begin{array}{l} M = \dfrac{8 + 10}{2} = 9 \quad;\quad Q_{1} = 5 \quad;\quad Q_{3} = 13 \\[2mm] \text{étendue} = 18 - 2 = 16 \quad;\quad Q_{3} - Q_{1} = 8 \end{array}}$$

    **2.** La série comporte $N = 9$ valeurs. 
    $$\frac{N}{4} = 2{,}25 \;\longrightarrow\; \text{rang } 3 \qquad\text{et}\qquad \frac{3N}{4} = 6{,}75 \;\longrightarrow\; \text{rang } 7$$
     L'effectif étant impair, la médiane est la valeur de rang $\dfrac{9+1}{2} = 5$. 
    $$\boxed{\begin{array}{l} M = 7 \quad;\quad Q_{1} = 4 \quad;\quad Q_{3} = 10 \\[2mm] \text{étendue} = 14 - 1 = 13 \quad;\quad Q_{3} - Q_{1} = 6 \end{array}}$$

    *Piège :* l'arrondi se fait toujours *à l'entier supérieur*, même lorsque la partie décimale vaut $0{,}25$. On ne procède pas à un arrondi au plus proche.
- id: "s-11-23"
  feuille: "f-s-11"
  numero: 23
  partie: "Indicateurs de dispersion"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vocabulaire statistique, moyenne, médiane, quartiles, étendue]
  noeuds: [n-sommes, p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 6
  page_corrige: 8
  enonce: |
    On reprend la série des livres lus de l'exercice 5, dont le tableau des effectifs est rappelé ci-dessous.

    ```tableau
    **Nombre de livres** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $2$ ¦ $6$ ¦ $8$ ¦ $5$ ¦ $3$ ¦ $1$
    ```

    **1.** Déterminer la médiane de cette série.

    **2.** Déterminer $Q_{1}$ et $Q_{3}$.

    **3.** Calculer l'étendue et l'écart interquartile.

    **4.** Calculer la moyenne de la série et la comparer à la médiane.
  corrige: |
    On construit d'abord la ligne des effectifs cumulés, qui servira à toutes les questions :

    ```tableau
    **Nombre de livres** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $2$ ¦ $6$ ¦ $8$ ¦ $5$ ¦ $3$ ¦ $1$
    **Effectif cumulé** ¦ $2$ ¦ $8$ ¦ $16$ ¦ $21$ ¦ $24$ ¦ $25$
    ```

    **1.** L'effectif total vaut $N = 25$, nombre impair : la médiane est la valeur de rang $\dfrac{25+1}{2} = 13$. Comme $8 < 13 \leqslant 16$, cette valeur est $2$ : 
    $$M = \boxed{2 \text{ livres}}$$

    **2.** On calcule les deux rangs : 
    $$\frac{N}{4} = 6{,}25 \;\longrightarrow\; \text{rang } 7 \qquad\text{et}\qquad \frac{3N}{4} = 18{,}75 \;\longrightarrow\; \text{rang } 19$$
     Comme $2 < 7 \leqslant 8$, la septième valeur est $1$ ; comme $16 < 19 \leqslant 21$, la dix-neuvième est $3$ : 
    $$Q_{1} = \boxed{1} \qquad\text{et}\qquad Q_{3} = \boxed{3}$$

    **3.** On calcule les deux différences : 
    $$\text{étendue} = 5 - 0 = \boxed{5} \qquad\text{et}\qquad Q_{3} - Q_{1} = 3 - 1 = \boxed{2}$$

    **4.** On applique la formule de la moyenne : 
    $$\overline{x} = \frac{2 \times 0 + 6 \times 1 + 8 \times 2 + 5 \times 3 + 3 \times 4 + 1 \times 5}{25} = \frac{0+6+16+15+12+5}{25} = \frac{54}{25} = \boxed{2{,}16}$$

    $$\boxed{\text{La moyenne } 2{,}16 \text{ est légèrement supérieure à la médiane } 2.}$$
     La série est en effet un peu étirée vers la droite : les quelques élèves ayant lu $4$ ou $5$ livres tirent la moyenne vers le haut, sans déplacer la médiane.
- id: "s-11-24"
  feuille: "f-s-11"
  numero: 24
  partie: "Indicateurs de dispersion"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vocabulaire statistique, moyenne, médiane, quartiles, étendue]
  noeuds: [n-sommes, p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    Chacune des quatre séries suivantes est donnée par son tableau d'effectifs. Déterminer dans chaque cas la moyenne, la médiane, les quartiles $Q_{1}$ et $Q_{3}$, l'étendue et l'écart interquartile.

    **a.** Nombre d'activités extrascolaires pratiquées par les $20$ élèves d'une classe.

    ```tableau
    **Nombre d'activités** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $2$ ¦ $5$ ¦ $6$ ¦ $4$ ¦ $3$
    ```

    **b.** Nombre de fautes relevées dans chacune des $24$ copies d'une dictée.

    ```tableau
    **Nombre de fautes** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$
    **Effectif** ¦ $3$ ¦ $5$ ¦ $8$ ¦ $5$ ¦ $3$
    ```

    **c.** Nombre de personnes présentes à bord de chacune des $150$ voitures contrôlées à un péage.

    ```tableau
    **Nombre de personnes** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $20$ ¦ $30$ ¦ $50$ ¦ $30$ ¦ $20$
    ```

    **d.** Nombre de réclamations reçues chaque jour par un service après-vente, sur $126$ jours.

    ```tableau
    **Nombre de réclamations** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $13$ ¦ $22$ ¦ $28$ ¦ $27$ ¦ $24$ ¦ $12$
    ```
  corrige: |
    Dans les quatre cas, on commence par la ligne des effectifs cumulés : c'est elle qui permet de retrouver la valeur d'un rang donné.

    **a.** Effectif total $N = 2+5+6+4+3 = 20$.

    ```tableau
    **Nombre d'activités** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $2$ ¦ $5$ ¦ $6$ ¦ $4$ ¦ $3$
    **Effectif cumulé** ¦ $2$ ¦ $7$ ¦ $13$ ¦ $17$ ¦ $20$
    ```

    $$\overline{x} = \frac{2 \times 1 + 5 \times 2 + 6 \times 3 + 4 \times 4 + 3 \times 5}{20} = \frac{2+10+18+16+15}{20} = \frac{61}{20} = \boxed{3{,}05}$$
     L'effectif $N = 20$ est pair : la médiane est la demi-somme des valeurs de rangs $10$ et $11$, toutes deux égales à $3$ puisque $7 < 10 \leqslant 13$ et $7 < 11 \leqslant 13$. Par ailleurs $\dfrac{N}{4} = 5$ et $\dfrac{3N}{4} = 15$ sont entiers. 
    $$\boxed{\begin{array}{l} M = 3 \quad;\quad Q_{1} = 2 \ (\text{rang } 5) \quad;\quad Q_{3} = 4 \ (\text{rang } 15) \\[2mm] \text{étendue} = 5 - 1 = 4 \quad;\quad Q_{3} - Q_{1} = 2 \end{array}}$$

    **b.** Effectif total $N = 3+5+8+5+3 = 24$.

    ```tableau
    **Nombre de fautes** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$
    **Effectif** ¦ $3$ ¦ $5$ ¦ $8$ ¦ $5$ ¦ $3$
    **Effectif cumulé** ¦ $3$ ¦ $8$ ¦ $16$ ¦ $21$ ¦ $24$
    ```

    $$\overline{x} = \frac{3 \times 0 + 5 \times 1 + 8 \times 2 + 5 \times 3 + 3 \times 4}{24} = \frac{0+5+16+15+12}{24} = \frac{48}{24} = \boxed{2}$$
     La médiane est la demi-somme des valeurs de rangs $12$ et $13$, toutes deux égales à $2$. Ici $\dfrac{N}{4} = 6$ et $\dfrac{3N}{4} = 18$ sont entiers. 
    $$\boxed{\begin{array}{l} M = 2 \quad;\quad Q_{1} = 1 \ (\text{rang } 6) \quad;\quad Q_{3} = 3 \ (\text{rang } 18) \\[2mm] \text{étendue} = 4 - 0 = 4 \quad;\quad Q_{3} - Q_{1} = 2 \end{array}}$$

    **c.** Effectif total $N = 20+30+50+30+20 = 150$.

    ```tableau
    **Nombre de personnes** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $20$ ¦ $30$ ¦ $50$ ¦ $30$ ¦ $20$
    **Effectif cumulé** ¦ $20$ ¦ $50$ ¦ $100$ ¦ $130$ ¦ $150$
    ```

    $$\overline{x} = \frac{20 \times 1 + 30 \times 2 + 50 \times 3 + 30 \times 4 + 20 \times 5}{150} = \frac{20+60+150+120+100}{150} = \frac{450}{150} = \boxed{3}$$
     L'effectif $N = 150$ est pair : la médiane est la demi-somme des valeurs de rangs $75$ et $76$. Comme $50 < 75 \leqslant 100$ et $50 < 76 \leqslant 100$, ces deux valeurs sont égales à $3$. 
    $$\frac{N}{4} = 37{,}5 \;\longrightarrow\; \text{rang } 38 \qquad\text{et}\qquad \frac{3N}{4} = 112{,}5 \;\longrightarrow\; \text{rang } 113$$
     Comme $20 < 38 \leqslant 50$, la trente-huitième valeur est $2$ ; comme $100 < 113 \leqslant 130$, la cent-treizième est $4$. 
    $$\boxed{\begin{array}{l} M = 3 \quad;\quad Q_{1} = 2 \quad;\quad Q_{3} = 4 \\[2mm] \text{étendue} = 5 - 1 = 4 \quad;\quad Q_{3} - Q_{1} = 2 \end{array}}$$

    **d.** Effectif total $N = 13+22+28+27+24+12 = 126$.

    ```tableau
    **Nombre de réclamations** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Effectif** ¦ $13$ ¦ $22$ ¦ $28$ ¦ $27$ ¦ $24$ ¦ $12$
    **Effectif cumulé** ¦ $13$ ¦ $35$ ¦ $63$ ¦ $90$ ¦ $114$ ¦ $126$
    ```

    $$\overline{x} = \frac{0 + 22 + 56 + 81 + 96 + 60}{126} = \frac{315}{126} = \boxed{2{,}5}$$
     L'effectif $N = 126$ est pair : la médiane est la demi-somme des valeurs de rangs $63$ et $64$. Or l'effectif cumulé atteint exactement $63$ à la valeur $2$ : la soixante-troisième valeur est donc $2$, et la soixante-quatrième est $3$. 
    $$M = \frac{2 + 3}{2} = 2{,}5$$

    *Piège :* la médiane n'est ici égale à aucune des valeurs du tableau. C'est normal : lorsque l'effectif est pair, elle est une demi-somme, et rien n'impose que les deux valeurs centrales coïncident.

    $$\frac{N}{4} = 31{,}5 \;\longrightarrow\; \text{rang } 32 \qquad\text{et}\qquad \frac{3N}{4} = 94{,}5 \;\longrightarrow\; \text{rang } 95$$
     Comme $13 < 32 \leqslant 35$, la trente-deuxième valeur est $1$ ; comme $90 < 95 \leqslant 114$, la quatre-vingt-quinzième est $4$. 
    $$\boxed{\begin{array}{l} M = 2{,}5 \quad;\quad Q_{1} = 1 \quad;\quad Q_{3} = 4 \\[2mm] \text{étendue} = 5 - 0 = 5 \quad;\quad Q_{3} - Q_{1} = 3 \end{array}}$$
- id: "s-11-25"
  feuille: "f-s-11"
  numero: 25
  partie: "Indicateurs de dispersion"
  etoiles: 2
  types: [Calcul]
  mots_cles: [moyenne, médiane, quartiles, étendue]
  noeuds: [p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Deux séries de six valeurs sont données ci-dessous. 
    $$\text{Série A :} \quad 8 \;;\; 9 \;;\; 10 \;;\; 10 \;;\; 11 \;;\; 12 \qquad\qquad \text{Série B :} \quad 2 \;;\; 5 \;;\; 9 \;;\; 11 \;;\; 15 \;;\; 18$$

    **1.** Calculer la moyenne de chaque série. Que constate-t-on ?

    **2.** Déterminer la médiane de chaque série. Que constate-t-on ?

    **3.** Calculer l'étendue et l'écart interquartile de chaque série.

    **4.** Ces deux séries se ressemblent-elles ? Que peut-on en conclure sur les indicateurs de position ?
  corrige: |
    **1.** Les deux séries comportent $N = 6$ valeurs. 
    $$\text{Série A} : \overline{x} = \frac{8+9+10+10+11+12}{6} = \frac{60}{6} = \boxed{10}$$

    $$\text{Série B} : \overline{x} = \frac{2+5+9+11+15+18}{6} = \frac{60}{6} = \boxed{10}$$

    $$\boxed{\text{Les deux séries ont exactement la même moyenne.}}$$

    **2.** L'effectif $6$ est pair : la médiane est la demi-somme des troisième et quatrième valeurs. 
    $$\text{Série A} : M = \frac{10+10}{2} = 10 \qquad;\qquad \text{Série B} : M = \frac{9+11}{2} = 10$$

    $$\boxed{\text{Elles ont aussi la même médiane.}}$$

    **3.** Ici $\dfrac{N}{4} = 1{,}5$ donne le rang $2$, et $\dfrac{3N}{4} = 4{,}5$ donne le rang $5$. 
    $$\boxed{\begin{array}{l} \text{Série A} : Q_{1} = 9 \;;\; Q_{3} = 11 \;;\; \text{étendue} = 4 \;;\; Q_{3}-Q_{1} = 2 \\[2mm] \text{Série B} : Q_{1} = 5 \;;\; Q_{3} = 15 \;;\; \text{étendue} = 16 \;;\; Q_{3}-Q_{1} = 10 \end{array}}$$

    **4.** Les valeurs de la série A sont toutes proches de $10$, celles de la série B sont très étalées, de $2$ à $18$. 
    $$\boxed{\text{Non : deux séries de mêmes moyenne et médiane peuvent être très différentes.}}$$

    $$\boxed{\text{Les indicateurs de position ne suffisent donc jamais à décrire une série.}}$$
- id: "s-11-26"
  feuille: "f-s-11"
  numero: 26
  partie: "Indicateurs de dispersion"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [quartiles]
  noeuds: [p-variables]
  notions: []
  page_enonce: 7
  page_corrige: 11
  enonce: |
    On a mesuré la durée d'attente, en minutes, de $200$ voyageurs dans une gare. On sait seulement que : 
    $$Q_{1} = 12 \qquad M = 18 \qquad Q_{3} = 27$$

    **1.** Calculer l'écart interquartile et interpréter ce nombre dans le contexte.

    **2.** Au moins combien de voyageurs ont attendu $12$ minutes ou moins ?

    **3.** Au moins combien de voyageurs ont attendu $18$ minutes ou plus ?

    **4.** Ces trois nombres permettent-ils de connaître la durée d'attente la plus longue ? Justifier.
  corrige: |
    **1.** L'écart interquartile est la différence des deux quartiles : 
    $$Q_{3} - Q_{1} = 27 - 12 = \boxed{15 \text{ minutes}}$$

    $$\boxed{\text{La moitié centrale des voyageurs a attendu entre } 12 \text{ et } 27 \text{ minutes.}}$$

    **2.** Par définition, au moins $25\,\%$ des données sont inférieures ou égales à $Q_{1}$ : 
    $$0{,}25 \times 200 = \boxed{50 \text{ voyageurs au moins}}$$

    **3.** Par définition, au moins la moitié des données sont supérieures ou égales à la médiane : 
    $$0{,}50 \times 200 = \boxed{100 \text{ voyageurs au moins}}$$

    **4.** Les quartiles et la médiane ne renseignent que sur des *rangs*, pas sur les valeurs extrêmes. 
    $$\boxed{\text{Non : il faudrait connaître le maximum, qui ne se déduit pas de ces trois nombres.}}$$
     C'est précisément pour cela que le diagramme en boîte affiche *cinq* nombres et non trois.
- id: "s-11-27"
  feuille: "f-s-11"
  numero: 27
  partie: "Diagramme en boîte"
  etoiles: 1
  types: [Calcul]
  mots_cles: [médiane, quartiles, étendue, diagramme en boîte, représentations graphiques]
  noeuds: [p-variables]
  notions: []
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Le diagramme en boîte ci-dessous résume les notes obtenues par une classe à un devoir.

    ![Figure](documents/figures/b8efe609ad04b174.svg)

    **1.** Lire le minimum, $Q_{1}$, la médiane, $Q_{3}$ et le maximum de cette série.

    **2.** Calculer l'étendue et l'écart interquartile.

    **3.** Quel pourcentage d'élèves a obtenu une note comprise entre $7$ et $15$ ?

    **4.** Peut-on connaître le nombre d'élèves de la classe à partir de ce diagramme ?
  corrige: |
    **1.** Les extrémités des moustaches donnent le minimum et le maximum, les bords de la boîte donnent les quartiles, et le trait intérieur la médiane : 
    $$\boxed{\text{min} = 3 \quad;\quad Q_{1} = 7 \quad;\quad M = 10 \quad;\quad Q_{3} = 15 \quad;\quad \text{max} = 19}$$

    **2.** On calcule les deux différences : 
    $$\text{étendue} = 19 - 3 = \boxed{16} \qquad\text{et}\qquad Q_{3} - Q_{1} = 15 - 7 = \boxed{8}$$

    **3.** L'intervalle $[7\,;15]$ est exactement la boîte, qui contient la moitié centrale des données : 
    $$\boxed{50\,\% \text{ des élèves}}$$

    **4.** Le diagramme ne représente que cinq nombres, tous exprimés en notes. 
    $$\boxed{\text{Non : l'effectif de la classe ne se lit pas sur un diagramme en boîte.}}$$
- id: "s-11-28"
  feuille: "f-s-11"
  numero: 28
  partie: "Diagramme en boîte"
  etoiles: 1
  types: [Calcul]
  mots_cles: [diagramme en boîte, représentations graphiques]
  noeuds: [p-variables]
  notions: []
  page_enonce: 8
  page_corrige: 12
  enonce: |
    On considère la série suivante, rangée dans l'ordre croissant : 
    $$4 \;;\; 6 \;;\; 6 \;;\; 8 \;;\; 9 \;;\; 11 \;;\; 12 \;;\; 14 \;;\; 15 \;;\; 17 \;;\; 18 \;;\; 20$$

    **1.** Déterminer les cinq nombres nécessaires à la construction du diagramme en boîte.

    **2.** Construire ce diagramme sur un axe gradué de $0$ à $20$, en prenant $1$ cm pour $2$ unités.
  corrige: |
    **1.** La série est déjà rangée et comporte $N = 12$ valeurs. Comme $\dfrac{N}{4} = 3$ et $\dfrac{3N}{4} = 9$ sont entiers, $Q_{1}$ est la troisième valeur et $Q_{3}$ la neuvième. L'effectif étant pair, la médiane est la demi-somme des sixième et septième valeurs : 
    $$M = \frac{11 + 12}{2} = 11{,}5$$

    $$\boxed{\text{min} = 4 \quad;\quad Q_{1} = 6 \quad;\quad M = 11{,}5 \quad;\quad Q_{3} = 15 \quad;\quad \text{max} = 20}$$

    **2.** On place ces cinq nombres sur un axe gradué de $0$ à $20$, à raison de $1$ cm pour $2$ unités :

    ![Figure](documents/figures/2b53aaeaf586815f.svg)
- id: "s-11-29"
  feuille: "f-s-11"
  numero: 29
  partie: "Diagramme en boîte"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [médiane, quartiles, étendue, diagramme en boîte, représentations graphiques]
  noeuds: [p-variables]
  notions: []
  page_enonce: 8
  page_corrige: 12
  enonce: |
    Deux clubs de sport ont relevé la durée hebdomadaire d'entraînement, en heures, de leurs adhérents. Les deux diagrammes en boîte sont représentés sur le même axe.

    ![Figure](documents/figures/68333fd04badfe55.svg)

    **1.** Dresser, pour chaque club, le tableau des cinq nombres lus sur le diagramme.

    **2.** Comparer les médianes des deux clubs.

    **3.** Comparer les écarts interquartiles, puis les étendues.

    **4.** Dans quel club les durées d'entraînement sont-elles les plus régulières ? Justifier.

    **5.** Un adhérent s'entraîne $12$ heures par semaine. Dans quel club est-il certain de ne pas se trouver ?
  corrige: |
    **1.** On lit les cinq nombres sur chaque diagramme :

    $$\begin{array}{|c||c|c|c|c|c|} \hline  & \text{min} & \boldsymbol{Q_{1}} & \text{médiane} & \boldsymbol{Q_{3}} & \text{max} \\ \hline \text{Club A} & 2 & 5 & 8 & 10 & 14 \\ \hline \text{Club B} & 6 & 7 & 8 & 9 & 11 \\ \hline \end{array}$$

    **2.** Le trait intérieur des deux boîtes se situe au même endroit : 
    $$\boxed{\text{Les deux clubs ont la même médiane : } 8 \text{ heures.}}$$

    **3.** On calcule les deux indicateurs pour chaque club : 
    $$\boxed{\begin{array}{l} \text{Club A} : Q_{3}-Q_{1} = 10 - 5 = 5 \quad;\quad \text{étendue} = 14 - 2 = 12 \\[2mm] \text{Club B} : Q_{3}-Q_{1} = 9 - 7 = 2 \quad;\quad \text{étendue} = 11 - 6 = 5 \end{array}}$$

    **4.** Les deux indicateurs de dispersion sont plus petits pour le club B. 
    $$\boxed{\text{Les durées sont plus régulières au club B, dont la boîte et les moustaches sont plus courtes.}}$$
     Au club A, on trouve à la fois des adhérents qui s'entraînent $2$ heures et d'autres $14$ heures : le club est très hétérogène, bien que sa médiane soit la même.

    **5.** Le maximum du club B vaut $11$ heures, alors que celui du club A vaut $14$ heures. 
    $$\boxed{\text{Cet adhérent n'appartient certainement pas au club B.}}$$
- id: "s-11-30"
  feuille: "f-s-11"
  numero: 30
  partie: "Diagramme en boîte"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [médiane, quartiles, étendue]
  noeuds: [p-variables]
  notions: []
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Pour chacun des résumés suivants, dire s'il peut correspondre à une série statistique. Justifier chaque réponse.

    **1.** minimum $4$, $Q_{1} = 9$, médiane $7$, $Q_{3} = 12$, maximum $18$.

    **2.** minimum $5$, $Q_{1} = 5$, médiane $8$, $Q_{3} = 12$, maximum $12$.

    **3.** une série d'étendue $10$ et d'écart interquartile $14$.

    **4.** minimum $0$, $Q_{1} = 3$, médiane $3$, $Q_{3} = 3$, maximum $20$.
  corrige: |
    On utilise le fait que, pour toute série, les cinq nombres du résumé sont rangés dans l'ordre : 
    $$\text{min} \;\leqslant\; Q_{1} \;\leqslant\; M \;\leqslant\; Q_{3} \;\leqslant\; \text{max}$$

    **1.** On aurait $Q_{1} = 9$ et $M = 7$, donc $M < Q_{1}$. 
    $$\boxed{\text{Impossible : la médiane ne peut pas être inférieure au premier quartile.}}$$

    **2.** Les cinq nombres $5 \leqslant 5 \leqslant 8 \leqslant 12 \leqslant 12$ sont bien rangés. 
    $$\boxed{\text{Possible.}}$$
     Rien n'interdit à $Q_{1}$ d'être égal au minimum : il suffit qu'au moins un quart des données valent $5$. La série $5\;;5\;;8\;;12\;;12$ convient, par exemple.

    **3.** L'écart interquartile $Q_{3} - Q_{1}$ est une différence entre deux valeurs comprises entre le minimum et le maximum : il ne peut donc pas dépasser l'étendue. 
    $$\boxed{\text{Impossible : on a toujours } Q_{3} - Q_{1} \leqslant \text{étendue}.}$$

    **4.** Les cinq nombres $0 \leqslant 3 \leqslant 3 \leqslant 3 \leqslant 20$ sont bien rangés. 
    $$\boxed{\text{Possible.}}$$
     Le diagramme aurait alors une boîte réduite à un simple trait et deux très longues moustaches : c'est le cas d'une série dont la grande majorité des valeurs vaut $3$, avec quelques valeurs extrêmes isolées.
- id: "s-11-31"
  feuille: "f-s-11"
  numero: 31
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [QCM, Démonstration]
  mots_cles: [vocabulaire statistique, moyenne, moyenne pondérée, médiane, quartiles, étendue, diagramme en boîte, représentations graphiques]
  noeuds: [n-sommes, p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    Pour chaque question, une seule réponse est exacte. La recopier sur la copie et la justifier.

    ```tableau
    Énoncé ¦ **a** ¦ **b** ¦ **c**
    **1.** La série $4 \;;\; 6 \;;\; 7 \;;\; 9 \;;\; 14$ a pour moyenne : ¦ $7$ ¦ $8$ ¦ $9$
    **2.** Cette même série a pour médiane : ¦ $6$ ¦ $7$ ¦ $8$
    **3.** Les notes $10$ et $16$ sont affectées des coefficients $3$ et $1$. La moyenne pondérée vaut : ¦ $11{,}5$ ¦ $12$ ¦ $13$
    **4.** Une série a pour moyenne $15$. On retranche $3$ à chacune de ses valeurs : la nouvelle moyenne vaut : ¦ $12$ ¦ $15$ ¦ $45$
    **5.** La somme des fréquences d'une série vaut toujours : ¦ $N$ ¦ $1$ ¦ $100$
    **6.** Dans une série de $20$ valeurs rangées, $Q_{1}$ est la valeur de rang : ¦ $4$ ¦ $5$ ¦ $6$
    **7.** Dans une série de $14$ valeurs rangées, $Q_{3}$ est la valeur de rang : ¦ $10$ ¦ $10{,}5$ ¦ $11$
    **8.** Une série vérifie $Q_{1} = 8$ et $Q_{3} = 17$. Son écart interquartile vaut : ¦ $9$ ¦ $12{,}5$ ¦ $25$
    **9.** La boîte d'un diagramme en boîte contient : ¦ $25\,\%$ des données ¦ $50\,\%$ des données ¦ $75\,\%$ des données
    **10.** Parmi ces indicateurs, celui qui est insensible aux valeurs extrêmes est : ¦ la moyenne ¦ l'étendue ¦ la médiane
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    **1.** ¦ **b** ¦ $\dfrac{4+6+7+9+14}{5} = \dfrac{40}{5} = 8$.
    **2.** ¦ **b** ¦ La série est rangée et $N = 5$ est impair : $M$ est la valeur de rang $3$, soit $7$.
    **3.** ¦ **a** ¦ $\dfrac{3 \times 10 + 1 \times 16}{3+1} = \dfrac{46}{4} = 11{,}5$.
    **4.** ¦ **a** ¦ D'après la propriété 1, la moyenne subit la même transformation : $15 - 3 = 12$.
    **5.** ¦ **b** ¦ La somme des fréquences vaut toujours $1$, c'est-à-dire $100\,\%$.
    **6.** ¦ **b** ¦ $\dfrac{N}{4} = \dfrac{20}{4} = 5$ est entier : $Q_{1}$ est la valeur de rang $5$.
    **7.** ¦ **c** ¦ $\dfrac{3N}{4} = \dfrac{42}{4} = 10{,}5$ n'est pas entier : on arrondit à $11$.
    **8.** ¦ **a** ¦ $Q_{3} - Q_{1} = 17 - 8 = 9$.
    **9.** ¦ **b** ¦ La boîte s'étend de $Q_{1}$ à $Q_{3}$ : elle contient la moitié centrale des données.
    **10.** ¦ **c** ¦ La médiane ne dépend que des rangs (voir l'exercice 19).
    ```

    *Piège de la question 7 :* la réponse **b** est le résultat du calcul $\dfrac{3N}{4}$, et non un rang. Un rang est toujours un nombre entier.
- id: "s-11-32"
  feuille: "f-s-11"
  numero: 32
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [vocabulaire statistique, moyenne, moyenne pondérée, médiane, quartiles, étendue, diagramme en boîte, représentations graphiques]
  noeuds: [n-sommes, p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse.

    **1.** La somme des effectifs d'une série est égale à l'effectif total $N$.

    **2.** La médiane d'une série est toujours l'une des valeurs de cette série.

    **3.** Si l'on ajoute $5$ à toutes les valeurs d'une série, sa médiane augmente de $5$.

    **4.** Pour toute série, on a $Q_{1} \leqslant M \leqslant Q_{3}$.

    **5.** L'écart interquartile d'une série peut être supérieur à son étendue.

    **6.** La moyenne d'une série est toujours comprise entre sa plus petite et sa plus grande valeur.

    **7.** Deux séries qui ont la même moyenne ont nécessairement la même médiane.

    **8.** La moyenne pondérée de plusieurs notes s'obtient en divisant la somme des produits par le nombre de notes.

    **9.** La couleur préférée d'un élève est un caractère qualitatif.

    **10.** Les moustaches d'un diagramme en boîte rejoignent les valeurs extrêmes de la série.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la définition même de l'effectif total : chaque individu est compté dans exactement une valeur.

    **2.** $\boxed{\textbf{Fausse}}$ Lorsque $N$ est pair, la médiane est une demi-somme, qui peut ne correspondre à aucune donnée. La série $8\;;9\;;9\;;11\;;12\;;15$ de l'exercice 18 a pour médiane $10$, valeur absente de la série.

    **3.** $\boxed{\textbf{Vraie}}$ Ajouter $5$ à toutes les valeurs ne change pas leur ordre : la ou les valeurs centrales restent les mêmes, augmentées de $5$.

    **4.** $\boxed{\textbf{Vraie}}$ Ces trois nombres découpent la série rangée en quatre parts successives : ils apparaissent donc dans cet ordre (voir l'exercice 30).

    **5.** $\boxed{\textbf{Fausse}}$ Comme $Q_{1}$ et $Q_{3}$ sont compris entre le minimum et le maximum, leur différence ne peut pas dépasser l'étendue.

    **6.** $\boxed{\textbf{Vraie}}$ La moyenne est le point d'équilibre de la série : elle ne peut pas se trouver en dehors des valeurs sur lesquelles la règle est posée.

    **7.** $\boxed{\textbf{Fausse}}$ Les deux séries de l'exercice 25 ont la même moyenne $10$ ; elles ont ici la même médiane, mais rien ne l'imposait. Ainsi $4\;;10\;;16$ et $9\;;10\;;11$ ont la même moyenne, et $1\;;2\;;12$ a pour moyenne $5$ et pour médiane $2$.

    **8.** $\boxed{\textbf{Fausse}}$ Le dénominateur est la *somme des coefficients*, pas le nombre de notes. C'est l'erreur travaillée à l'exercice 10.

    **9.** $\boxed{\textbf{Vraie}}$ Une couleur ne se mesure pas par un nombre.

    **10.** $\boxed{\textbf{Vraie}}$ C'est la définition du diagramme en boîte : les moustaches rejoignent le minimum et le maximum.
- id: "s-11-33"
  feuille: "f-s-11"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Calcul]
  mots_cles: [moyenne, médiane, quartiles, étendue, diagramme en boîte, représentations graphiques]
  noeuds: [p-esperance, p-variables]
  notions: [esperance]
  page_enonce: 10
  page_corrige: 15
  enonce: |
    On a relevé le temps de trajet, en minutes, des $20$ élèves d'une classe pour se rendre au lycée. Les résultats sont rangés dans l'ordre croissant : 
    $$5 \;;\; 8 \;;\; 10 \;;\; 10 \;;\; 12 \;;\; 12 \;;\; 15 \;;\; 15 \;;\; 15 \;;\; 18 \;;\; 20 \;;\; 20 \;;\; 22 \;;\; 25 \;;\; 25 \;;\; 30 \;;\; 30 \;;\; 35 \;;\; 40 \;;\; 53$$

    **Partie A**

    **1.** Calculer le temps de trajet moyen.

    **2.** Déterminer la médiane de la série.

    **3.** Déterminer $Q_{1}$ et $Q_{3}$ en détaillant les rangs utilisés.

    **4.** Calculer l'étendue et l'écart interquartile.

    **5.** Construire le diagramme en boîte de cette série sur un axe gradué de $0$ à $55$, en prenant $1$ cm pour $5$ minutes.

    **Partie B**

    L'élève qui met $53$ minutes déménage et quitte le lycée. On étudie la série des $19$ élèves restants.

    **1.** Calculer la nouvelle moyenne, arrondie au dixième.

    **2.** Déterminer la nouvelle médiane.

    **3.** Déterminer les nouveaux quartiles.

    **4.** Lequel des quatre indicateurs a été le plus modifié par ce départ ? Lequel n'a pas bougé du tout ? Expliquer.

    **Partie C**

    **1.** Le professeur principal écrit dans un compte rendu : « les élèves de la classe mettent en moyenne $21$ minutes pour venir au lycée ». Cette phrase est exacte, mais pourquoi donne-t-elle une image trompeuse de la classe ?

    **2.** Proposer une phrase de deux lignes qui résume honnêtement la série, en respectant le conseil donné à la fin du cours.
  corrige: |
    **Partie A**

    **1.** On additionne les vingt temps de trajet : 
    $$\overline{x} = \frac{420}{20} = \boxed{21 \text{ minutes}}$$

    **2.** L'effectif $N = 20$ est pair : la médiane est la demi-somme des dixième et onzième valeurs, soit $18$ et $20$ : 
    $$M = \frac{18 + 20}{2} = \boxed{19 \text{ minutes}}$$

    **3.** On calcule les deux rangs : 
    $$\frac{N}{4} = \frac{20}{4} = 5 \qquad\text{et}\qquad \frac{3N}{4} = \frac{60}{4} = 15$$
     Ces deux résultats étant entiers, $Q_{1}$ est la cinquième valeur et $Q_{3}$ la quinzième : 
    $$Q_{1} = \boxed{12 \text{ minutes}} \qquad\text{et}\qquad Q_{3} = \boxed{25 \text{ minutes}}$$

    **4.** On calcule les deux différences : 
    $$\text{étendue} = 53 - 5 = \boxed{48 \text{ minutes}} \qquad\text{et}\qquad Q_{3} - Q_{1} = 25 - 12 = \boxed{13 \text{ minutes}}$$

    **5.** On place les cinq nombres $5$, $12$, $19$, $25$ et $53$ sur un axe gradué de $0$ à $55$ :

    ![Figure](documents/figures/12d5f17288b7b6fc.svg)

    **Partie B**

    **1.** La somme des dix-neuf temps restants vaut $420 - 53 = 367$ : 
    $$\overline{x} = \frac{367}{19} \approx \boxed{19{,}3 \text{ minutes}}$$

    **2.** L'effectif $N = 19$ est impair : la médiane est la valeur de rang $\dfrac{19+1}{2} = 10$, soit $18$ : 
    $$M = \boxed{18 \text{ minutes}}$$

    **3.** On recalcule les rangs : 
    $$\frac{N}{4} = 4{,}75 \;\longrightarrow\; \text{rang } 5 \qquad\text{et}\qquad \frac{3N}{4} = 14{,}25 \;\longrightarrow\; \text{rang } 15$$
     Les cinquième et quinzième valeurs de la nouvelle série sont les mêmes qu'avant, le départ n'ayant retiré que la dernière : 
    $$Q_{1} = \boxed{12 \text{ minutes}} \qquad\text{et}\qquad Q_{3} = \boxed{25 \text{ minutes}}$$

    **4.** On compare les quatre indicateurs :

    $$\begin{array}{|c||c|c|c|c|} \hline  & \text{moyenne} & \text{médiane} & \boldsymbol{Q_{1}} & \boldsymbol{Q_{3}} \\ \hline 20\text{ élèves} & 21 & 19 & 12 & 25 \\ \hline 19\text{ élèves} & 19{,}3 & 18 & 12 & 25 \\ \hline \end{array}$$

    $$\boxed{\begin{array}{l} \text{La moyenne a le plus varié : elle perd } 1{,}7 \text{ minute.} \\[1mm] \text{Les quartiles n'ont pas bougé du tout.} \end{array}}$$
     La valeur $53$ intervenait dans la somme, donc dans la moyenne ; elle n'intervenait dans les quartiles que par son rang, le dernier, et son retrait ne modifie donc pas les rangs $5$ et $15$.

    **Partie C**

    **1.** La moyenne $21$ minutes est exacte, mais quatorze élèves sur vingt mettent moins de temps que cela : elle est gonflée par le seul élève qui met $53$ minutes. 
    $$\boxed{\text{La moyenne est tirée vers le haut par une valeur extrême et ne décrit presque personne.}}$$
     De plus, une moyenne seule ne dit rien de l'étalement, alors qu'il va ici de $5$ à $53$ minutes.

    **2.** On respecte le conseil du cours en donnant *au moins* un indicateur de position et un de dispersion. Par exemple : 
    $$\boxed{\begin{array}{l} \text{La moitié des élèves mettent moins de } 19 \text{ minutes pour venir au lycée, et la} \\[1mm] \text{moitié centrale de la classe met entre } 12 \text{ et } 25 \text{ minutes ; un élève met} \\[1mm] \text{toutefois près d'une heure.} \end{array}}$$
