  page_enonce: 2
  page_corrige: 2
  enonce: |
    Une étude porte sur $250$ personnes. On connaît seulement les fréquences des cinq valeurs relevées.

    ```tableau
    **Valeur $x_{i}$** ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    **Fréquence $f_{i}$** ¦ $0{,}12$ ¦ $0{,}28$ ¦ $0{,}36$ ¦ $0{,}16$ ¦ $0{,}08$
    ```

    **1.** Vérifier que ce tableau est cohérent.

    **2.** Retrouver l'effectif de chaque valeur.

    **3.** Contrôler le résultat obtenu.
  corrige: |
    **1.** On additionne les fréquences : 
    $$0{,}12 + 0{,}28 + 0{,}36 + 0{,}16 + 0{,}08 = \boxed{1}$$

    $$\boxed{\text{Le tableau est cohérent.}}$$

    **2.** On a $f_{i} = \dfrac{n_{i}}{N}$, donc $n_{i} = f_{i} \times N$ avec $N = 250$ : 
    $$\boxed{\begin{array}{l} n_{1} = 0{,}12 \times 250 = 30 \quad;\quad n_{2} = 0{,}28 \times 250 = 70 \quad;\quad n_{3} = 0{,}36 \times 250 = 90 \\[1mm] n_{4} = 0{,}16 \times 250 = 40 \quad;\quad n_{5} = 0{,}08 \times 250 = 20 \end{array}}$$

    **3.** On vérifie que la somme des effectifs redonne l'effectif total : 
    $$30 + 70 + 90 + 40 + 20 = \boxed{250}$$
- id: "s-11-05"
  feuille: "f-s-11"
  numero: 5
  partie: "Vocabulaire et représentations"
  etoiles: 2
