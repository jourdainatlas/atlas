  page_enonce: 1
  page_corrige: 1
  enonce: |
    On demande à $40$ foyers combien d'animaux domestiques ils possèdent. Les résultats sont donnés ci-dessous.

    ```tableau
    **Nombre $x_{i}$** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ **Total**
    **Effectif $n_{i}$** ¦ $14$ ¦ $16$ ¦ $8$ ¦ $2$ ¦ 
    **Fréquence $f_{i}$** ¦  ¦  ¦  ¦  ¦ 
    ```

    **1.** Vérifier que l'effectif total est bien $40$.

    **2.** Recopier et compléter la ligne des fréquences.

    **3.** Effectuer le contrôle indiqué dans le cours sur la somme obtenue.

    **4.** Quel pourcentage de foyers possède au moins deux animaux ?
  corrige: |
    **1.** On additionne les effectifs : 
    $$14 + 16 + 8 + 2 = \boxed{40}$$

    **2.** Chaque fréquence s'obtient en divisant l'effectif par $N = 40$ : 
    $$f_{1} = \frac{14}{40} = 0{,}35 \qquad f_{2} = \frac{16}{40} = 0{,}4 \qquad f_{3} = \frac{8}{40} = 0{,}2 \qquad f_{4} = \frac{2}{40} = 0{,}05$$

    ```tableau
    **Nombre $x_{i}$** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ **Total**
    **Effectif $n_{i}$** ¦ $14$ ¦ $16$ ¦ $8$ ¦ $2$ ¦ $40$
    **Fréquence $f_{i}$** ¦ $0{,}35$ ¦ $0{,}40$ ¦ $0{,}20$ ¦ $0{,}05$ ¦ $1$
    ```

    **3.** On additionne les fréquences obtenues : 
    $$0{,}35 + 0{,}40 + 0{,}20 + 0{,}05 = \boxed{1}$$
     Le contrôle est satisfait : le tableau ne comporte pas d'erreur.

    **4.** « Au moins deux animaux » correspond aux valeurs $2$ et $3$ : 
    $$0{,}20 + 0{,}05 = 0{,}25 = \boxed{25\,\%}$$
- id: "s-11-03"
  feuille: "f-s-11"
  numero: 3
  partie: "Vocabulaire et représentations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vocabulaire statistique]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Un sondage est réalisé auprès de $200$ personnes sur le nombre de voyages effectués dans l'année.

    ```tableau
    **Nombre de voyages** ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$
    **Effectif** ¦ $50$ ¦ $70$ ¦ $60$ ¦ $20$
    ```

    **1.** Calculer la fréquence de chaque valeur, exprimée en pourcentage.

    **2.** Quel pourcentage de personnes a effectué au moins un voyage ?

    **3.** Quel pourcentage de personnes a effectué au plus deux voyages ?
  corrige: |
    **1.** L'effectif total vaut $50 + 70 + 60 + 20 = 200$. On divise chaque effectif par $200$ : 
    $$\frac{50}{200} = \boxed{25\,\%} \qquad \frac{70}{200} = \boxed{35\,\%} \qquad \frac{60}{200} = \boxed{30\,\%} \qquad \frac{20}{200} = \boxed{10\,\%}$$
     On constate que la somme vaut bien $100\,\%$.

    **2.** « Au moins un voyage » est le contraire de « aucun voyage » : 
    $$100 - 25 = \boxed{75\,\%}$$

    **3.** « Au plus deux voyages » correspond aux valeurs $0$, $1$ et $2$ : 
    $$25 + 35 + 30 = \boxed{90\,\%}$$
     On pouvait aussi passer par le contraire : $100 - 10 = 90$.
- id: "s-11-04"
  feuille: "f-s-11"
  numero: 4
  partie: "Vocabulaire et représentations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vocabulaire statistique]
  noeuds: [n-sommes]
