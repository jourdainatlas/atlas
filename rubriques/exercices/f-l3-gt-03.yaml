  enonce: |
    **Espaces discrets et produits infinis.**

    **1.** Montrer qu'un sous-espace, un produit fini, une réunion disjointe et un quotient d'espaces discrets sont discrets.

    **2.** Soit $(X_{i})_{i \in I}$ une famille d'espaces topologiques. La topologie produit sur $\mathop{\displaystyle \prod_{i \in I}}X_{i}$ est celle qui a pour base les produits $\mathop{\displaystyle \prod_{i \in I}}U_{i}$, où chaque $U_{i}$ est un ouvert de $X_{i}$ et où $U_{i} = X_{i}$ sauf pour un nombre fini d'indices. On suppose que $I$ est infini et que chaque $X_{i}$ est discret et possède au moins deux points. Montrer que $\mathop{\displaystyle \prod_{i \in I}}X_{i}$ n'est pas discret.

    **3.** Pourquoi ne prend-on pas pour base tous les produits $\mathop{\displaystyle \prod_{i}}U_{i}$ d'ouverts ? On comparera les deux topologies du point de vue de la continuité des projections.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Toute partie d'un espace discret est ouverte. Pour un sous-espace $A$, $\{a\} = A \cap \{a\}$ est ouvert dans $A$. Pour un produit fini, $\{(x_{1}, \dots, x_{n})\} = \{x_{1}\} \times \dots \times \{x_{n}\}$ est un ouvert élémentaire. Pour une réunion disjointe, une partie est ouverte si et seulement si ses traces sur les morceaux le sont (cours, prop. 1), ce qui est toujours le cas. Pour un quotient, l'image réciproque de toute partie est ouverte, donc toute partie du quotient est ouverte. Dans les quatre cas, les singletons sont ouverts.

    **2.** Soit $x = (x_{i})$ un point du produit et $\mathop{\displaystyle \prod_{i}}U_{i}$ un ouvert de base contenant $x$. Comme $I$ est infini, il existe un indice $j$ avec $U_{j} = X_{j}$, et $X_{j}$ contient un point $y_{j} \neq x_{j}$. Le point obtenu en remplaçant $x_{j}$ par $y_{j}$ est encore dans $\mathop{\displaystyle \prod_{i}}U_{i}$ : aucun ouvert de base, donc aucun ouvert, n'est réduit à $\{x\}$. *Le produit n'est pas discret.* Par exemple, $\{0, 1\}^{\mathbb{N}}$ n'est pas discret, bien que chaque facteur le soit.

    **3.** Avec tous les produits d'ouverts, on obtiendrait une topologie (dite des boîtes) qui rend encore les projections continues, mais qui est plus fine ; pour des facteurs discrets, elle serait discrète. La topologie produit est, comme au chapitre 1 (exercice 12), la moins fine qui rende les projections continues : il suffit pour cela que les ouverts $p_{i}^{-1}(U_{i})$ et leurs intersections finies soient ouverts, ce qui donne exactement la base de l'énoncé.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-03-04"
  feuille: "f-l3-gt-03"
  numero: 4
  partie: "Topologie quotient"
  etoiles: 2
  types: [Démonstration]
