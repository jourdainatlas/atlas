  source: "Bordeaux 2016, feuille 3, exercice 1"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Écraser et recoller les côtés d'un carré.** Soient $X = [0, 1]^{2}$ et ses quatre côtés $I_{1} = \{0\} \times [0, 1]$, $I_{2} = \{1\} \times [0, 1]$, $I_{3} = [0, 1] \times \{0\}$ et $I_{4} = [0, 1] \times \{1\}$.

    **1.** Identifier les espaces $X/I_{1}$, $X/(I_{1} \cup I_{3})$, $X/(I_{1} \cup I_{2})$, $X/(I_{1} \cup I_{2} \cup I_{3})$ et $X/(I_{1} \cup I_{2} \cup I_{3} \cup I_{4})$, où chaque fois la réunion indiquée est écrasée en un seul point. Ces espaces sont-ils séparés ?

    **2.** Soit $X'$ une seconde copie de $X$, de côtés $I'_{1}, \dots, I'_{4}$. On recolle $X$ et $X'$ en identifiant chaque point de $I_{1}$ au point correspondant de $I'_{1}$, et chaque point de $I_{2}$ au point correspondant de $I'_{2}$. Quel espace obtient-on ? Même question en identifiant $I_{k}$ à $I'_{k}$ pour $k = 1, 2, 3, 4$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** $\triangleright$ *Un côté.* L'application $f(x, y) = (x, xy)$ envoie continûment $X$ sur le triangle $T$ de sommets $(0, 0)$, $(1, 0)$ et $(1, 1)$ ; elle est injective sur $]0, 1] \times [0, 1]$ et écrase $I_{1}$ sur le sommet $(0, 0)$. Par la proposition 4 du cours, $X/I_{1} \simeq T$, et un triangle est homéomorphe au disque $D^{2}$ par une application radiale comme celle de l'exercice 6.

    $\triangleright$ *Un arc du bord.* Les parties $I_{1} \cup I_{3}$ et $I_{1} \cup I_{2} \cup I_{3}$ sont, comme $I_{1}$, des arcs du bord du carré. Par l'exercice 6, le carré est homéomorphe au disque, son bord au cercle ; tout homéomorphisme du cercle qui envoie un arc sur un autre se prolonge au disque, en le prolongeant à chaque rayon (le disque est le cône sur le cercle, cours, prop. 12). On peut donc envoyer chacun de ces arcs sur $I_{1}$ par un homéomorphisme du carré, et *$X/(I_{1} \cup I_{3})$ et $X/(I_{1} \cup I_{2} \cup I_{3})$ sont homéomorphes au disque.*

    $\triangleright$ *Deux côtés opposés.* L'application 
    $$\Phi(x, y) = \big(1 + 2x(1 - x)y\big)\,(\cos 2\pi x, \sin 2\pi x)$$
     est continue, injective sur $]0, 1[ \times [0, 1]$, et envoie $I_{1}$ et $I_{2}$ sur le même point $(1, 0)$. Par la proposition 4, $X/(I_{1} \cup I_{2})$ est homéomorphe à son image, la région comprise entre le cercle unité et la courbe $r = 1 + 2s(1 - s)$, $\theta = 2\pi s$, qui le touche en $(1, 0)$ : *c'est un disque dont deux points du bord ont été identifiés.*

    $\triangleright$ *Tout le bord.* $X/\partial X \simeq D^{2}/\mathbb{S}^{1} \simeq \mathbb{S}^{2}$ par l'exercice 6 et la proposition 7 du cours.

    Tous ces espaces sont séparés, puisqu'ils sont homéomorphes à des parties de $\mathbb{R}^{2}$ ou de $\mathbb{R}^{3}$.

    ![Figure](documents/figures/9c32f15a65cc201c.svg)

    Les cinq quotients du carré : les côtés écrasés sont en rouge. Lorsqu'on écrase un arc du bord, on obtient encore un disque ; lorsqu'on écrase deux côtés opposés en un même point, on obtient la région de droite, un disque dont deux points du bord sont confondus en un seul (en rouge).

    **2.** $\triangleright$ *Deux côtés recollés.* Définissons $\Phi$ sur $X$ et $\Phi'$ sur $X'$ par 
    $$\Phi(x, y) = (\cos\pi x, \sin\pi x, y) , \qquad \Phi'(x, y) = (\cos\pi x, -\sin\pi x, y) .$$
     Elles coïncident sur $I_{1}$ et $I'_{1}$ (abscisse $0$) et sur $I_{2}$ et $I'_{2}$ (abscisse $1$), et sont injectives ailleurs ; elles définissent une surjection continue de la réunion disjointe compacte $X \sqcup X'$ sur le cylindre $\mathbb{S}^{1} \times [0, 1]$, dont les fibres sont les classes du recollement. Par la proposition 4, *on obtient un cylindre.*

    $\triangleright$ *Les quatre côtés recollés.* L'exercice 6 identifie $X$ et $X'$ à deux disques, et le recollement identifie leurs bords point par point : par la proposition 13 du cours, *on obtient la sphère $\mathbb{S}^{2}$.*

    0@10@ii@ii-@>@ii@ii>@-\@M
