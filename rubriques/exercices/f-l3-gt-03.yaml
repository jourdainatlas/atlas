    **Pincements.** Si $X$ et $Y$ sont deux espaces munis de points $x_{0}$ et $y_{0}$, on note $X \vee Y$ le quotient de la réunion disjointe $X \sqcup Y$ obtenu en identifiant $x_{0}$ et $y_{0}$.

    **1.** Montrer que le quotient de $\mathbb{S}^{2}$ obtenu en écrasant l'équateur en un point est homéomorphe à $\mathbb{S}^{2} \vee \mathbb{S}^{2}$, que l'on réalisera comme la réunion de deux sphères de $\mathbb{R}^{3}$ tangentes en un point.

    **2.** Montrer que le quotient de $[0, 1]$ obtenu en identifiant les trois points $0$, $\dfrac{1}{2}$ et $1$ est homéomorphe à $\mathbb{S}^{1} \vee \mathbb{S}^{1}$, réalisé comme la réunion de deux cercles du plan tangents en un point.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Notons $H_{+}$ et $H_{-}$ les hémisphères fermés nord et sud, et $S_{\pm}$ les sphères de rayon $\dfrac{1}{2}$ centrées en $(0, 0, \pm\dfrac{1}{2})$, tangentes en $O$. La projection verticale identifie $H_{+}$ au disque $D^{2}$, et la proposition 7 du cours fournit une surjection continue $e : D^{2} \to \mathbb{S}^{2}$ qui écrase le cercle en un point et est injective ailleurs ; une similitude envoie $\mathbb{S}^{2}$ sur $S_{+}$ et ce point sur $O$. On obtient $g_{+} : H_{+} \to S_{+}$ continue, surjective, envoyant l'équateur sur $O$ et injective ailleurs ; de même $g_{-} : H_{-} \to S_{-}$.

    Les deux applications valent $O$ sur l'équateur, qui est l'intersection des fermés $H_{+}$ et $H_{-}$ : elles se recollent en une application continue $g : \mathbb{S}^{2} \to S_{+} \cup S_{-}$. Elle est surjective, et ses fibres sont l'équateur et les singletons, car $S_{+} \setminus \{O\}$ et $S_{-} \setminus \{O\}$ sont disjoints. Par la proposition 4, le quotient est homéomorphe à $S_{+} \cup S_{-}$, qui est lui-même homéomorphe à $\mathbb{S}^{2} \vee \mathbb{S}^{2}$ par le même argument appliqué à $\mathbb{S}^{2} \sqcup \mathbb{S}^{2}$.

    **2.** Posons, pour $t \in [0, \dfrac{1}{2}]$, $c(t) = (-1 + \cos 4\pi t, \sin 4\pi t)$, et pour $t \in [\dfrac{1}{2}, 1]$, $d(t) = (1 - \cos 4\pi t, \sin 4\pi t)$. La première décrit une fois le cercle de centre $(-1, 0)$, la seconde celui de centre $(1, 0)$, tous deux de rayon $1$ ; elles valent l'origine en $0$, $\dfrac{1}{2}$ et $1$, et seulement là. L'application ainsi recollée est continue et surjective de $[0, 1]$ sur la réunion des deux cercles, de fibres $\{0, \dfrac{1}{2}, 1\}$ et les singletons : par la proposition 4, le quotient est le « huit » $\mathbb{S}^{1} \vee \mathbb{S}^{1}$.

    ![Figure](documents/figures/79f9651374c7abc8.svg)

    Les deux pincements : deux sphères tangentes en $O$, image de l'équateur, et le « huit », où les deux boucles se rejoignent au point image de $0$, $\dfrac{1}{2}$ et $1$.

