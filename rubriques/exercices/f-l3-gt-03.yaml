  enonce: |
    **Le cône sur une droite.** On considère le cône $C\mathbb{R} = (\mathbb{R} \times [0, 1])/(\mathbb{R} \times \{1\})$, dont on note $s$ le sommet, et la partie 
    $$\Gamma = \big(\mathbb{R} \times [0, 1[\big) \cup \{(0, 1)\}$$
     de $\mathbb{R}^{2}$. On définit $\varphi : C\mathbb{R} \to \Gamma$ par $\varphi([x, t]) = \big((1 - t)x, t\big)$.

    **1.** Montrer que $\varphi$ est bien définie, continue et bijective.

    **2.** Pour $n \geq 1$, on pose $q_{n} = \big[n, 1 - \dfrac{1}{n^{2}}\big] \in C\mathbb{R}$. Montrer que $\varphi(q_{n})$ tend vers $\varphi(s)$, mais que $q_{n}$ ne tend pas vers $s$ dans $C\mathbb{R}$. On pourra considérer l'image dans $C\mathbb{R}$ de l'ouvert $W = \big\{(x, t) \mid t > 1 - \dfrac{1}{1 + x^{4}}\big\}$.

    **3.** L'application $\varphi$ est-elle un homéomorphisme ? Que se passe-t-il si l'on remplace $\mathbb{R}$ par un segment $[-a, a]$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'application $\psi(x, t) = \big((1 - t)x, t\big)$ est continue sur $\mathbb{R} \times [0, 1]$ et constante, égale à $(0, 1)$, sur $\mathbb{R} \times \{1\}$ : par le théorème 1, elle induit $\varphi$ continue sur $C\mathbb{R}$. Son image est contenue dans $\Gamma$, et $\varphi$ est bijective : un point $(u, t)$ de $\Gamma$ avec $t < 1$ a pour unique antécédent $\big[\dfrac{u}{1 - t}, t\big]$, et $(0, 1)$ a pour unique antécédent $s$.

    **2.** On a $\varphi(q_{n}) = \big(\dfrac{1}{n}, 1 - \dfrac{1}{n^{2}}\big) \to (0, 1) = \varphi(s)$. L'ouvert $W$ contient $\mathbb{R} \times \{1\}$, puisque $1 > 1 - \dfrac{1}{1 + x^{4}}$ ; il est donc saturé, la seule classe non réduite à un point étant $\mathbb{R} \times \{1\}$, et $\pi(W)$ est un ouvert de $C\mathbb{R}$ contenant $s$. Or $q_{n} \in \pi(W)$ signifierait 
    $$1 - \frac{1}{n^{2}} > 1 - \frac{1}{1 + n^{4}} , \qquad \text{c'est-à-dire} \qquad 1 + n^{4} < n^{2} ,$$
     ce qui est faux. Aucun $q_{n}$ n'est dans le voisinage $\pi(W)$ de $s$ : $q_{n}$ ne tend pas vers $s$.

    **3.** Non : $\varphi(q_{n}) \to \varphi(s)$ sans que $q_{n} \to s$, donc $\varphi^{-1}$ n'est pas continue en $(0, 1)$. L'ouvert $\pi(W)$ « s'amincit » d'autant plus que $|x|$ est grand, ce qu'aucun voisinage du point $(0, 1)$ dans le plan ne peut faire. Si l'on remplace $\mathbb{R}$ par un segment $[-a, a]$, le cône $C[-a, a]$ est compact comme image du compact $[-a, a] \times [0, 1]$, et $\varphi$ est une bijection continue de ce compact sur le triangle de sommets $(\pm a, 0)$ et $(0, 1)$, qui est séparé : c'est un homéomorphisme. Le défaut vient de la non-compacité de $\mathbb{R}$, et c'est pourquoi le cours n'identifie le cône à une figure géométrique que pour des espaces compacts.

    ![Figure](documents/figures/3ea90f7c4a3cee2b.svg)

    Dans $\Gamma$ (en bleu clair), l'image du voisinage $\pi(W)$ du sommet (en orange) se resserre vers le point $(0, 1)$ en une pointe. Les points $\varphi(q_{n})$ (en rouge) tendent vers $(0, 1)$ en restant hors de cette pointe : pour la topologie du cône, ils ne tendent pas vers le sommet.

    0@10@ii@ii-@>@ii@ii>@-\@M
