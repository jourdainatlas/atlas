  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Quotients de $\mathbb{R}$ par un sous-groupe.** Soit $G$ un sous-groupe de $(\mathbb{R}, +)$. On note $\mathbb{R}/G$ le quotient de $\mathbb{R}$ par la relation $x \sim y \iff x - y \in G$.

    **1.** Montrer que la projection $\pi : \mathbb{R} \to \mathbb{R}/G$ est ouverte.

    **2.** Montrer que $\mathbb{R}/G$ est séparé si et seulement si $G$ est fermé dans $\mathbb{R}$.

    **3.** Montrer que si $G$ est dense dans $\mathbb{R}$, la topologie de $\mathbb{R}/G$ est grossière.

    **4.** Soit $a = \mathop{\displaystyle \inf}\big(G \cap \, ]0, +\infty[\big)$, lorsque $G \neq \{0\}$. Montrer que si $a > 0$, alors $G = a\mathbb{Z}$, et que si $a = 0$, alors $G$ est dense.

    **5.** En déduire que $\mathbb{R}/G$ est, soit homéomorphe à $\mathbb{R}$, soit homéomorphe à $\mathbb{S}^{1}$, soit grossier. Dans quel cas se trouve-t-on pour $G = \mathbb{Z} + \sqrt{2}\,\mathbb{Z}$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Pour $U$ ouvert de $\mathbb{R}$, $\pi^{-1}\big(\pi(U)\big) = U + G = \mathop{\displaystyle \bigcup_{g \in G}}(U + g)$ est une réunion d'ouverts. Par définition de la topologie quotient, $\pi(U)$ est ouvert.

    **2.** Par la question 1 et la proposition 11 du cours, $\mathbb{R}/G$ est séparé si et seulement si le graphe $\{(x, y) \mid x - y \in G\}$ est fermé dans $\mathbb{R}^{2}$. C'est l'image réciproque de $G$ par l'application continue $(x, y) \mapsto x - y$ : il est fermé si $G$ l'est. Réciproquement, s'il est fermé, $G = \{x \mid (x, 0) \in \text{graphe}\}$ est fermé.

    **3.** Soit $V$ un ouvert non vide de $\mathbb{R}/G$ ; $U = \pi^{-1}(V)$ est un ouvert non vide et $U + G = U$. Pour tout $x \in \mathbb{R}$, l'ouvert non vide $x - U$ rencontre $G$, qui est dense : il existe $u \in U$ et $g \in G$ avec $x = u + g \in U + G = U$. Donc $U = \mathbb{R}$ et $V = \mathbb{R}/G$ : les seuls ouverts sont $\varnothing$ et $\mathbb{R}/G$.

    **4.** Supposons $a > 0$. Si $a$ n'était pas dans $G$, il y aurait deux éléments $g_{1} > g_{2}$ de $G$ dans $]a, 2a[$, et $g_{1} - g_{2} \in G \cap \, ]0, a[$, ce qui contredit la définition de $a$. Donc $a \in G$. Pour $g \in G$, écrivons $g = ka + r$ avec $k \in \mathbb{Z}$ et $0 \leq r < a$ : alors $r = g - ka \in G$, donc $r = 0$, et $G = a\mathbb{Z}$.

    Supposons $a = 0$. Pour tout $\varepsilon > 0$, il existe $g \in G \cap \, ]0, \varepsilon[$, et les multiples $kg$, $k \in \mathbb{Z}$, sont dans $G$ et forment un ensemble dont deux points consécutifs sont distants de moins de $\varepsilon$. Tout intervalle de longueur $\varepsilon$ rencontre donc $G$ : $G$ est dense.

    **5.** Trois cas se présentent.

    • Si $G = \{0\}$, $\pi$ est un homéomorphisme et $\mathbb{R}/G \simeq \mathbb{R}$.

    • Si $G = a\mathbb{Z}$ avec $a > 0$, l'application $x \mapsto \mathrm{e}^{2\mathrm{i}\pi x/a}$ induit un homéomorphisme $\mathbb{R}/a\mathbb{Z} \simeq \mathbb{S}^{1}$, exactement comme dans la proposition 5 du cours.

    • Sinon, $G$ est dense et $\mathbb{R}/G$ est grossier.

    Pour $G = \mathbb{Z} + \sqrt{2}\,\mathbb{Z}$, si l'on avait $G = a\mathbb{Z}$, on aurait $1 = ka$ et $\sqrt{2} = la$ avec $k, l$ entiers, donc $\sqrt{2} = l/k$ rationnel. Le groupe $G$ est donc dense, et *$\mathbb{R}/(\mathbb{Z} + \sqrt{2}\,\mathbb{Z})$ est grossier*, comme $\mathbb{R}/\mathbb{Q}$ dans le cours. Le quotient est séparé exactement quand $G$ est fermé, ce qui illustre la question 2 : les sous-groupes fermés de $\mathbb{R}$ sont $\{0\}$, les $a\mathbb{Z}$ et $\mathbb{R}$ lui-même.

    ![Figure](documents/figures/2bf20f58cefcac0a.svg)

    Sur $[-2, 2]$, le sous-groupe fermé $\mathbb{Z}$ (en bleu) et les éléments $m + n\sqrt{2}$ de $\mathbb{Z} + \sqrt{2}\,\mathbb{Z}$ avec $|n| \leq 12$ (en orange) : ces derniers remplissent déjà l'intervalle, et le groupe entier est dense.

    0@10@ii@ii-@>@ii@ii>@-\@M
