  noeuds: [t-quotient, t-separe]
  notions: [topologie-quotient, ensemble-quotient, separe]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Quotients de groupes topologiques.** Un *groupe topologique* est un groupe $G$ muni d'une topologie pour laquelle les applications $(g, h) \mapsto gh$ et $g \mapsto g^{-1}$ sont continues. Soient $G$ un groupe topologique séparé et $H$ un sous-groupe de $G$ ; on note $G/H$ le quotient de $G$ par la relation $g \sim g' \iff g^{-1}g' \in H$, dont les classes sont les $gH$.

    **1.** Montrer que, pour tout $h \in G$, les translations $g \mapsto gh$ et $g \mapsto hg$ sont des homéomorphismes de $G$, et que la projection $\pi : G \to G/H$ est ouverte.

    **2.** Montrer que $G/H$ est séparé si et seulement si $H$ est fermé dans $G$.

    **3.** On suppose $H$ distingué, de sorte que $G/H$ est un groupe pour la loi $[g][g'] = [gg']$. Montrer que $G/H$ est un groupe topologique.

    **4.** Retrouver ainsi la structure de groupe topologique de $\mathbb{R}/\mathbb{Z}$ et de $\mathbb{S}^{1}$.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** La translation $g \mapsto gh$ est la composée de $g \mapsto (g, h)$, continue, et de la multiplication ; elle est continue, de réciproque continue $g \mapsto gh^{-1}$. De même à gauche. Pour $U$ ouvert de $G$, 
    $$\pi^{-1}\big(\pi(U)\big) = UH = \bigcup_{h \in H}Uh$$
     est une réunion d'images d'ouverts par des homéomorphismes, donc ouverte : $\pi$ est ouverte.

    **2.** Par la proposition 11 du cours, $G/H$ est séparé si et seulement si le graphe $\mathcal{R} = \{(g, g') \mid g^{-1}g' \in H\}$ est fermé dans $G \times G$. C'est l'image réciproque de $H$ par l'application continue $\psi(g, g') = g^{-1}g'$, donc il est fermé si $H$ l'est. Réciproquement, $H$ est l'image réciproque de $\mathcal{R}$ par l'application continue $h \mapsto (e, h)$ : il est fermé si $\mathcal{R}$ l'est.

    **3.** Notons $\bar{\mu}$ la multiplication de $G/H$, de sorte que $\bar{\mu} \circ (\pi \times \pi) = \pi \circ \mu$. L'application $\pi \times \pi$ est continue, surjective et ouverte, puisqu'elle envoie les ouverts élémentaires $U \times V$ sur les ouverts $\pi(U) \times \pi(V)$. Soit $W$ un ouvert de $G/H$ : $(\pi \times \pi)^{-1}\big(\bar{\mu}^{-1}(W)\big) = (\pi \circ \mu)^{-1}(W)$ est ouvert, et par surjectivité, 
    $$\bar{\mu}^{-1}(W) = (\pi \times \pi)\big((\pi \circ \mu)^{-1}(W)\big)$$
     est ouvert : $\bar{\mu}$ est continue. Le même argument, avec $\pi$ ouverte, donne la continuité de l'inverse. Il faut noter qu'un produit d'applications quotient n'est pas toujours une application quotient : c'est ici le caractère ouvert de $\pi$ qui sauve la situation.

    **4.** Le groupe $\mathbb{R}$ est abélien, $\mathbb{Z}$ est distingué et fermé : $\mathbb{R}/\mathbb{Z}$ est un groupe topologique séparé. L'homéomorphisme $\mathbb{R}/\mathbb{Z} \simeq \mathbb{S}^{1}$ induit par $x \mapsto \mathrm{e}^{2\mathrm{i}\pi x}$ (cours, prop. 5) est aussi un morphisme de groupes : la multiplication des complexes de module $1$ est donc continue, ce que l'on savait directement.

    0@16@ii@ii-@>@ii@ii>@-\@M
