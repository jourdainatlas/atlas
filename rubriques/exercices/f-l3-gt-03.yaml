- id: "l3-gt-03-01"
  feuille: "f-l3-gt-03"
  numero: 1
  partie: "Topologie quotient"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie quotient, séparation des quotients]
  noeuds: [t-quotient, t-separe]
  notions: [topologie-quotient, ensemble-quotient, separe]
  source: "examen du 25/04/2016, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Applications quotient.**

    **1.** Soit $p : X \to Y$ continue. Montrer que s'il existe $f : Y \to X$ continue telle que $p \circ f = \mathrm{id}_{Y}$, alors $p$ est une application quotient.

    **2.** Soient $A \subset X$ et $r : X \to A$ une rétraction, c'est-à-dire une application continue telle que $r(a) = a$ pour tout $a \in A$. Montrer que $r$ est une application quotient.

    **3.** Soit $A = \{(x, y) \in \mathbb{R}^{2} \mid x \geq 0 \text{ ou } y = 0\}$, et $p : A \to \mathbb{R}$ la restriction de la première projection. Montrer que $p$ est une application quotient qui n'est ni ouverte, ni fermée.

    **4.** On considère $p : X = [0, 1[ \, \cup \, [2, 3] \to Y = [0, 2]$ définie par $p(x) = x$ si $x \in [0, 1[$ et $p(x) = x - 1$ si $x \in [2, 3]$. Montrer que $p$ est continue et surjective, mais n'est pas une application quotient.

    **5.** Soit $p : X \to Y$ continue et surjective. Montrer que si $X$ est compact et $Y$ séparé, $p$ est une application quotient.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'égalité $p \circ f = \mathrm{id}_{Y}$ entraîne que $p$ est surjective. Si $U \subset Y$ est ouvert, $p^{-1}(U)$ est ouvert par continuité. Réciproquement, si $p^{-1}(U)$ est ouvert, alors 
    $$U = (p \circ f)^{-1}(U) = f^{-1}\big(p^{-1}(U)\big)$$
     est ouvert par continuité de $f$.

    **2.** On applique la question 1 à $p = r$ et à l'inclusion $f = i : A \to X$, qui est continue et vérifie $r \circ i = \mathrm{id}_{A}$.

    **3.** L'application $r(x, y) = (x, 0)$ est continue de $A$ dans $\mathbb{R} \times \{0\} \subset A$ et fixe les points de $\mathbb{R} \times \{0\}$ : c'est une rétraction, donc une application quotient par la question 2. Comme $p$ est la composée de $r$ et de l'homéomorphisme $(x, 0) \mapsto x$, c'est une application quotient.

    L'ensemble $V = A \cap \big(\mathbb{R} \times \, ]0, +\infty[\big)$ est ouvert dans $A$, mais son image $p(V) = [0, +\infty[$ n'est pas ouverte : $p$ n'est pas ouverte. La branche d'hyperbole $F = \{(x, \dfrac{1}{x}) \mid x > 0\}$ est fermée dans $\mathbb{R}^{2}$, donc dans $A$, mais $p(F) = \, ]0, +\infty[$ n'est pas fermée : $p$ n'est pas fermée.

    ![Figure](documents/figures/09eb8c2a2c650554.svg)

    La partie $A$ (en bleu) : le demi-plan fermé $x \geq 0$ et l'axe des abscisses. L'ouvert hachuré $V$ de $A$ se projette sur $[0, +\infty[$, qui n'est pas ouvert ; la branche d'hyperbole $F$ (en orange), fermée, se projette sur $]0, +\infty[$, qui n'est pas fermé.

    **4.** La restriction de $p$ à chacun des deux morceaux $[0, 1[$ et $[2, 3]$, qui sont ouverts dans $X$, est continue : $p$ est continue, et elle est surjective. La partie $[0, 1[$ de $Y$ n'est pas ouverte dans $Y = [0, 2]$, car tout voisinage de $1$ contient des points supérieurs à $1$. Pourtant $p^{-1}([0, 1[) = [0, 1[$ est ouvert dans $X$ : $p$ n'est pas une application quotient. Le « trou » de $X$ entre $1$ et $2$ est refermé par $p$ sans que la topologie de $X$ en garde trace.

    **5.** Montrons que $p$ est fermée. Un fermé $F$ de $X$ est compact, son image $p(F)$ est compacte, donc fermée dans le séparé $Y$. Soit alors $U \subset Y$ tel que $p^{-1}(U)$ soit ouvert. Le fermé $X \setminus p^{-1}(U) = p^{-1}(Y \setminus U)$ a pour image, par surjectivité, $Y \setminus U$, qui est donc fermé : $U$ est ouvert.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-03-02"
  feuille: "f-l3-gt-03"
