  enonce: |
    **La sphère $\mathbb{S}^{3}$ comme réunion de deux tores pleins.** Soient $p, q \geq 1$ et $n = p + q$. On écrit les points de $\mathbb{S}^{n} \subset \mathbb{R}^{p} \times \mathbb{R}^{q + 1}$ sous la forme $(x', x'')$, et l'on pose 
    $$A = \Big\{(x', x'') \in \mathbb{S}^{n} \;\Big|\; \lVert x' \rVert^{2} \geq \frac{1}{2}\Big\} , \qquad B = \Big\{(x', x'') \in \mathbb{S}^{n} \;\Big|\; \lVert x' \rVert^{2} \leq \frac{1}{2}\Big\} .$$

    **1.** Montrer que $A$ est homéomorphe à $\mathbb{S}^{p - 1} \times D^{q + 1}$ et que $B$ est homéomorphe à $D^{p} \times \mathbb{S}^{q}$.

    **2.** Décrire $A \cap B$. En déduire que la sphère $\mathbb{S}^{3}$ est réunion de deux tores pleins $\mathbb{S}^{1} \times D^{2}$ qui se rencontrent le long de leur bord commun, et préciser comment les bords sont identifiés.

    **3.** Que donne la construction pour $n = 2$, avec $p = q = 1$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Sur $A$, on a $\lVert x' \rVert^{2} \geq \dfrac{1}{2}$ et $\lVert x'' \rVert^{2} = 1 - \lVert x' \rVert^{2} \leq \dfrac{1}{2}$. Les applications 
    $$\alpha(x', x'') = \Big(\frac{x'}{\lVert x' \rVert}, \sqrt{2}\,x''\Big) , \qquad \beta(u, v) = \Big(\sqrt{1 - \tfrac{1}{2}\lVert v \rVert^{2}}\;u, \frac{v}{\sqrt{2}}\Big)$$
     sont continues, $\alpha$ de $A$ dans $\mathbb{S}^{p-1} \times D^{q+1}$ et $\beta$ en sens inverse : on vérifie que $\beta(u, v)$ est sur la sphère, avec $\lVert x' \rVert^{2} = 1 - \dfrac{1}{2}\lVert v \rVert^{2} \geq \dfrac{1}{2}$, et que $\alpha$ et $\beta$ sont réciproques. Par symétrie des rôles, $(x', x'') \mapsto \big(\sqrt{2}\,x', \dfrac{x''}{\lVert x'' \rVert}\big)$ est un homéomorphisme de $B$ sur $D^{p} \times \mathbb{S}^{q}$.

    **2.** $A \cap B$ est formé des points où $\lVert x' \rVert^{2} = \lVert x'' \rVert^{2} = \dfrac{1}{2}$ ; il est homéomorphe à $\mathbb{S}^{p-1} \times \mathbb{S}^{q}$, bord commun de $A$ et de $B$. Pour $n = 3$ et $p = 2$, $q = 1$, on écrit $\mathbb{S}^{3} = \{(z, w) \in \mathbb{C}^{2} \mid |z|^{2} + |w|^{2} = 1\}$ : $A \simeq \mathbb{S}^{1} \times D^{2}$ et $B \simeq D^{2} \times \mathbb{S}^{1}$ sont deux tores pleins, qui se rencontrent le long du tore $|z| = |w| = \dfrac{1}{\sqrt{2}}$.

    Un point $(z, w)$ de ce tore a pour coordonnées $\big(\dfrac{z}{|z|}, \dfrac{w}{|w|}\big)$ dans le bord $\mathbb{S}^{1} \times \mathbb{S}^{1}$ de $A$ ; dans $B$, écrit sous la forme $\mathbb{S}^{1} \times D^{2}$ en échangeant les facteurs, il a pour coordonnées $\big(\dfrac{w}{|w|}, \dfrac{z}{|z|}\big)$. *Le recollement échange les deux facteurs du tore :* un méridien de $A$, bord d'un disque $\{u\} \times D^{2}$, est recollé sur un parallèle de $B$, qui fait le tour de l'âme de $B$, et inversement.

    ![Figure](documents/figures/bf6ce8e58290f0a2.svg)

    Après projection stéréographique de $\mathbb{S}^{3}$ privée d'un point, $A$ devient un tore plein de $\mathbb{R}^{3}$ et $B$ son complémentaire augmenté du point à l'infini, dont l'âme est l'axe (en orange), refermé à l'infini. Un méridien de $A$ (en rouge) fait une fois le tour de l'âme de $B$ : c'est un parallèle de $B$.

    **3.** Pour $n = 2$ et $p = q = 1$, on a $\mathbb{S}^{2} \subset \mathbb{R} \times \mathbb{R}^{2}$, $A \simeq \mathbb{S}^{0} \times D^{2}$, réunion de deux calottes polaires, et $B \simeq D^{1} \times \mathbb{S}^{1}$, un cylindre : la sphère est un cylindre fermé par deux disques.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-03-10"
  feuille: "f-l3-gt-03"
  numero: 10
  partie: "Recollements et espaces classiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [recollements, séparation des quotients]
  noeuds: [t-quotient, cw-recollement, t-separe]
  notions: [topologie-quotient, espaces-homeomorphes, separe]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **Paires non ordonnées de points du cercle.** Le groupe à deux éléments agit sur $\mathbb{S}^{1} \times \mathbb{S}^{1}$ par échange des facteurs ; on note $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ le quotient de $\mathbb{S}^{1} \times \mathbb{S}^{1}$ par la relation $(z, w) \sim (w, z)$, c'est-à-dire l'ensemble des paires non ordonnées $\{z, w\}$ de points du cercle.

    **1.** Montrer que $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ est compact et séparé.

    **2.** On pose $G(u, v) = \big\{\mathrm{e}^{\mathrm{i}(u - v)/2}, \mathrm{e}^{\mathrm{i}(u + v)/2}\big\}$ pour $(u, v) \in [0, 2\pi]^{2}$. Montrer que $G(u, v) = G(u', v')$, avec $(u, v) \neq (u', v')$, si et seulement si $\{u, u'\} = \{0, 2\pi\}$ et $v' = 2\pi - v$. En déduire que $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ est homéomorphe au ruban de Möbius $M$, et que son bord correspond aux paires $\{z, z\}$.

    **3.** Soient $z = \mathrm{e}^{\mathrm{i} a}$ et $w = \mathrm{e}^{\mathrm{i} b}$, avec $0 < |b - a| < \pi$. Montrer que les tangentes au cercle en $z$ et en $w$ se coupent au point $\dfrac{\mathrm{e}^{\mathrm{i}(a + b)/2}}{\cos\frac{b - a}{2}}$. Que devient ce point quand la paire $\{z, w\}$ tend vers une paire de points antipodaux ? Interpréter.
  corrige: |
    **1.** Notons $\sigma(z, w) = (w, z)$ et $\pi$ la projection. L'espace $\mathbb{S}^{1} \times \mathbb{S}^{1}$ est compact, donc son image $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ vérifie la propriété de Borel-Lebesgue. La projection est ouverte, car $\pi^{-1}\big(\pi(U)\big) = U \cup \sigma(U)$ pour $U$ ouvert ; le graphe de la relation, $\Delta \cup \{(p, \sigma(p))\}$, est la réunion de la diagonale et du graphe de l'application continue $\sigma$, qui sont fermés puisque $\mathbb{S}^{1} \times \mathbb{S}^{1}$ est séparé. Par la proposition 11 du cours, $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ est séparé, donc compact.

    **2.** Posons $\alpha = \dfrac{u - v}{2}$ et $\beta = \dfrac{u + v}{2}$. Deux cas permettent l'égalité $G(u, v) = G(u', v')$.

    $\triangleright$ *Sans échange.* $\alpha' = \alpha + 2k\pi$ et $\beta' = \beta + 2l\pi$, donc $u' = u + 2(k + l)\pi$ et $v' = v + 2(l - k)\pi$. Comme $u, u', v, v' \in [0, 2\pi]$, les entiers $k + l$ et $l - k$, de même parité, sont dans $\{-1, 0, 1\}$ : ou bien ils sont nuls et $(u', v') = (u, v)$, ou bien $|u' - u| = |v' - v| = 2\pi$, ce qui donne $\{u, u'\} = \{v, v'\} = \{0, 2\pi\}$, et en particulier $v' = 2\pi - v$.

    $\triangleright$ *Avec échange.* $\alpha' = \beta + 2k\pi$ et $\beta' = \alpha + 2l\pi$, donc $u' = u + 2(k + l)\pi$ et $v' = -v + 2m\pi$ avec $m = l - k$ de même parité que $k + l$. Si $k + l = 0$, $m$ est pair et $v' = -v + 2m\pi \in [0, 2\pi]$ impose $v = v' \in \{0, 2\pi\}$ : c'est le même point. Si $k + l = \pm 1$, $m$ est impair, et seul $m = 1$ est compatible avec $v, v' \in [0, 2\pi]$ : $v' = 2\pi - v$ et $\{u, u'\} = \{0, 2\pi\}$.

    Réciproquement, $G(0, v) = \{\mathrm{e}^{-\mathrm{i} v/2}, \mathrm{e}^{\mathrm{i} v/2}\}$ et $G(2\pi, 2\pi - v) = \{\mathrm{e}^{\mathrm{i} v/2}, \mathrm{e}^{\mathrm{i}(2\pi - v/2)}\}$ sont la même paire. L'application $G$ est continue, comme composée de $(u, v) \mapsto (\mathrm{e}^{\mathrm{i}\alpha}, \mathrm{e}^{\mathrm{i}\beta})$ et de $\pi$, et surjective, puisque toute paire $\{\mathrm{e}^{\mathrm{i} a}, \mathrm{e}^{\mathrm{i} b}\}$ s'obtient avec $u = a + b$ et $v = b - a$ ramenés dans $[0, 2\pi]$ par le choix des représentants $a$ et $b$. Ses fibres sont exactement les classes de la relation $(0, v) \sim (2\pi, 2\pi - v)$ qui définit, après division des coordonnées par $2\pi$, le ruban de Möbius $M$. Par la proposition 4 du cours, *$\mathrm{Sp}^{2}(\mathbb{S}^{1})$ est homéomorphe à $M$.* Le bord de $M$ provient des côtés $v = 0$ et $v = 2\pi$, envoyés sur les paires $\{\mathrm{e}^{\mathrm{i} u/2}, \mathrm{e}^{\mathrm{i} u/2}\}$ et $\{-\mathrm{e}^{\mathrm{i} u/2}, -\mathrm{e}^{\mathrm{i} u/2}\}$ : ce sont les paires $\{z, z\}$. L'âme $v = \pi$ correspond aux paires de points antipodaux.

    **3.** La tangente au cercle en $\mathrm{e}^{\mathrm{i} a}$ est la droite des points $\zeta$ tels que $\mathcal{R}e(\zeta\mathrm{e}^{-\mathrm{i} a}) = 1$. Pour $\zeta_{0} = \dfrac{\mathrm{e}^{\mathrm{i}(a + b)/2}}{\cos\frac{b - a}{2}}$, on a $\mathcal{R}e(\zeta_{0}\mathrm{e}^{-\mathrm{i} a}) = \dfrac{\cos\frac{b - a}{2}}{\cos\frac{b - a}{2}} = 1$, et de même avec $b$ : $\zeta_{0}$ est sur les deux tangentes. Quand la paire tend vers une paire antipodale, $\cos\dfrac{b - a}{2} \to 0$ et $|\zeta_{0}| \to +\infty$ : les tangentes deviennent parallèles.

    On peut ainsi voir $\mathrm{Sp}^{2}(\mathbb{S}^{1})$ privé de l'âme comme l'extérieur fermé $\{|\zeta| \geq 1\}$ du disque, la paire $\{z, z\}$ correspondant au point $z$ du cercle. Les paires antipodales forment un cercle « à l'infini », où les deux directions opposées $\pm\mathrm{e}^{\mathrm{i}\varphi}$ de la même droite donnent la même paire : refermer une couronne en repliant ainsi l'un de ses bords sur lui-même redonne le ruban de Möbius.

    ![Figure](documents/figures/93a330d020cb5d8a.svg)

    À gauche, le domaine de $G$ : les côtés verticaux sont recollés en sens contraires (flèches), ce qui donne le ruban de Möbius ; les côtés horizontaux (en rouge) forment son bord, celui des paires $\{z, z\}$, et la ligne médiane (en tirets) son âme, celle des paires antipodales. À droite, une paire $\{z, w\}$ et le point d'intersection $\zeta_{0}$ des tangentes.

