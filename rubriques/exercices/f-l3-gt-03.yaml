  enonce: |
    **Le carré, le disque et la sphère.** On note $C$ le bord du carré $[-1, 1]^{2}$, $\mathbb{S}^{1}$ le cercle unité et $B = D^{2}$ le disque unité fermé de $\mathbb{R}^{2}$.

    **1.** Montrer que $h(x) = \dfrac{\lVert x \rVert_{\infty}}{\lVert x \rVert_{2}}\,x$, prolongée par $h(0) = 0$, définit un homéomorphisme de $[-1, 1]^{2}$ sur $B$, qui envoie $C$ sur $\mathbb{S}^{1}$.

    **2.** En déduire que le quotient $[-1, 1]^{2}/C$ est homéomorphe à la sphère $\mathbb{S}^{2}$.

    **3.** On définit sur $B$ la relation d'équivalence $\mathcal{R}_{2}$ qui identifie, pour tout $\theta$, les points $\mathrm{e}^{\mathrm{i}\theta}$ et $\mathrm{e}^{-\mathrm{i}\theta}$ du bord, et rien d'autre. Montrer que $B/\mathcal{R}_{2}$ est homéomorphe à $\mathbb{S}^{2}$. On pourra chercher une application $B \to \mathbb{S}^{2}$ qui envoie chaque segment vertical $\{c\} \times [-\sqrt{1 - c^{2}}, \sqrt{1 - c^{2}}]$ de $B$ sur le cercle $\mathbb{S}^{2} \cap \{x = c\}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Sur $[-1, 1]^{2} \setminus \{0\}$, $h$ est continue comme produit et quotient de fonctions continues, la norme euclidienne ne s'annulant pas. En $0$, $\lVert h(x) \rVert_{2} = \lVert x \rVert_{\infty} \to 0$. Comme $\lVert h(x) \rVert_{2} = \lVert x \rVert_{\infty} \leq 1$, $h$ est à valeurs dans $B$. L'application $k(y) = \dfrac{\lVert y \rVert_{2}}{\lVert y \rVert_{\infty}}\,y$, $k(0) = 0$, est continue de même, à valeurs dans le carré puisque $\lVert k(y) \rVert_{\infty} = \lVert y \rVert_{2}$, et réciproque de $h$ : chaque rayon issu de l'origine est conservé et dilaté. Enfin, $h(x) \in \mathbb{S}^{1}$ si et seulement si $\lVert x \rVert_{\infty} = 1$, c'est-à-dire $x \in C$.

    **2.** L'homéomorphisme $h$ respecte les relations « écraser $C$ » et « écraser $\mathbb{S}^{1}$ » : par le théorème 1, $h$ et $k$ passent aux quotients et donnent deux applications continues réciproques. Donc $[-1, 1]^{2}/C \simeq B/\mathbb{S}^{1} \simeq \mathbb{S}^{2}$ par la proposition 7 du cours.

    **3.** Pour $(x, y) \in B$ avec $|x| < 1$, posons $\rho = \sqrt{1 - x^{2}}$, de sorte que $|y| \leq \rho$, et 
    $$\Phi(x, y) = \Big(x, \; \rho\sin\frac{\pi y}{\rho}, \; -\rho\cos\frac{\pi y}{\rho}\Big) , \qquad \Phi(\pm 1, 0) = (\pm 1, 0, 0) .$$

    $\triangleright$ *Continuité.* Elle est claire là où $\rho > 0$. En un point $(\pm 1, 0)$, on a $\lVert \Phi(x, y) - (x, 0, 0) \rVert = \rho \to 0$.

    $\triangleright$ *Image.* Comme $x^{2} + \rho^{2} = 1$, $\Phi$ est à valeurs dans $\mathbb{S}^{2}$. Le segment vertical d'abscisse $c$ est envoyé sur le cercle $\mathbb{S}^{2} \cap \{x = c\}$, de rayon $\rho$, parcouru une fois quand $\dfrac{\pi y}{\rho}$ va de $-\pi$ à $\pi$ : $\Phi$ est surjective.

    $\triangleright$ *Fibres.* Sur ce segment, $\Phi$ n'identifie que les deux extrémités $(c, \pm\rho)$, qui sont les points $\mathrm{e}^{\pm\mathrm{i}\theta}$ du bord avec $\cos\theta = c$. Les fibres de $\Phi$ sont exactement les classes de $\mathcal{R}_{2}$.

    Par la proposition 4, $B/\mathcal{R}_{2} \simeq \mathbb{S}^{2}$. Le bord du disque, replié sur lui-même par la conjugaison, devient le demi-méridien $\{(c, 0, \rho)\}$ de la sphère.

    ![Figure](documents/figures/2d3d883a10f0ab27.svg)

    Chaque segment vertical du disque (en orange) s'enroule sur un cercle de la sphère, ses deux extrémités se rejoignant ; les points $\mathrm{e}^{\mathrm{i}\theta}$ et $\mathrm{e}^{-\mathrm{i}\theta}$ du bord sont envoyés sur le même point du demi-méridien rouge, image du bord.

