  feuille: "f-ma-22"
  numero: 27
  partie: "Extrema"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 7
  page_corrige: 30
  enonce: |
    Déterminer les extrema locaux et globaux des fonctions suivantes, définies sur $\mathbb{R}^{2}$. Dans les deux cas, la partie de degré $2$ de l'accroissement ne suffit pas à conclure en au moins un point critique. 
    $$\text{(a)}\ \ f(x, y) = x^{4} + y^{3} - 3y - 2 \qquad\qquad \text{(b)}\ \ f(x, y) = x^{3} + xy^{2} - x^{2}y - y^{3}$$
  corrige: |
    Les deux fonctions sont polynomiales, donc de classe $\mathcal{C}^{1}$ sur l'ouvert $\mathbb{R}^{2}$ (proposition 6) : par le théorème 5, leurs extrema locaux sont à chercher parmi leurs points critiques, et un extremum global, qui est en particulier local, aussi.

    **(a)** Les dérivées partielles valent 
    $$\frac{\partial f}{\partial x}(x, y) = 4x^{3} \qquad\text{et}\qquad \frac{\partial f}{\partial y}(x, y) = 3y^{2} - 3 = 3(y - 1)(y + 1),$$
     et elles s'annulent simultanément si et seulement si $x = 0$ et $y = \pm 1$ : les points critiques sont $\boxed{(0, 1) \text{ et } (0, -1)}$, où $f$ vaut $-4$ et $0$.

    *En $(0, 1)$.* Le développement de l'accroissement donne 
    $$\Delta(h, k) = f(h, 1 + k) - f(0, 1) = h^{4} + 3k^{2} + k^{3} = h^{4} + k^{2}(3 + k).$$
     Pour $\lVert (h, k) \rVert < 3$, on a $|k| < 3$ (proposition 1), donc $3 + k > 0$ et $\Delta(h, k) \geqslant 0$, avec égalité seulement si $h = k = 0$. Ainsi $\boxed{f \text{ admet en } (0, 1) \text{ un minimum local strict, égal à } -4}$. Il n'est pas global : $f(0, y) = y^{3} - 3y - 2$ tend vers $-\infty$ quand $y$ tend vers $-\infty$, et par exemple $f(0, -3) = -20 < -4$. C'est ici que la partie de degré $2$, $3k^{2}$, ne suffit pas : elle est nulle sur toute la droite $k = 0$, et c'est le terme $h^{4}$ qui décide, dans cette direction, du signe de $\Delta$.

    *En $(0, -1)$.* De même, 
    $$\Delta(h, k) = f(h, -1 + k) - f(0, -1) = h^{4} - 3k^{2} + k^{3}.$$
     Pour $h \neq 0$, $\Delta(h, 0) = h^{4} > 0$, et pour $0 < |k| < 3$, $\Delta(0, k) = k^{2}(k - 3) < 0$ : toute boule centrée en $(0, 0)$ contient des points où $\Delta$ prend chacun des deux signes, et $\boxed{(0, -1) \text{ est un col}}$. La partie de degré $2$, $-3k^{2}$, laissait croire à un maximum ; le terme $h^{4}$ le dément.

    *Bilan.* Comme $f(x, 0) = x^{4} - 2$ tend vers $+\infty$ quand $x$ tend vers $+\infty$, $f$ n'a pas de maximum global, et elle n'a pas non plus de minimum global, puisque son seul minimum local n'est pas global : 
    $$\boxed{\text{seul extremum : un minimum local strict } -4 \text{ en } (0, 1) \text{, qui n'est pas global}}$$

    **(b)** On factorise d'abord : $f(x, y) = x(x^{2} + y^{2}) - y(x^{2} + y^{2}) = (x - y)(x^{2} + y^{2})$. Les dérivées partielles sont 
    $$\frac{\partial f}{\partial x}(x, y) = 3x^{2} - 2xy + y^{2} = 2x^{2} + (x - y)^{2} \qquad\text{et}\qquad \frac{\partial f}{\partial y}(x, y) = 2xy - x^{2} - 3y^{2}.$$
     La première, somme de deux carrés, ne s'annule que si $x = 0$ et $x - y = 0$, c'est-à-dire en $(0, 0)$, où la seconde est bien nulle : $\boxed{(0, 0) \text{ est l'unique point critique}}$. Comme $f(t, 0) = t^{3}$ change de signe avec $t$, toute boule centrée en $(0, 0)$ contient des points où $f$ est strictement supérieure à $f(0, 0) = 0$ et d'autres où elle lui est strictement inférieure : 
    $$\boxed{f \text{ n'admet aucun extremum, ni local ni global}}$$
     Ici, la partie de degré $2$ de l'accroissement en $(0, 0)$ est nulle : la fonction est homogène de degré $3$ (exercice 19), et $f(tu) = t^{3}f(u)$ change de signe avec $t$ dès que $f(u) \neq 0$.

    *Piège.* L'erreur la plus répandue est de conclure à partir des seuls termes de degré $2$, comme on le ferait avec la dérivée seconde au chapitre 10. Un terme de degré $2$ qui ne contrôle pas toutes les directions, comme $3k^{2}$ en $(0, 1)$, ne prouve rien, et c'est le troisième exemple de la méthode de la section 22.5.2 qui l'annonçait avec $x^{2} + y^{4}$ et $x^{2} + y^{3}$.
- id: "ma-22-28"
  feuille: "f-ma-22"
  numero: 28
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [extrema]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 7
  page_corrige: 31
  enonce: |
    On considère la fonction $f : (x, y) \mapsto (y - x^{2})(y - 2x^{2})$, définie sur $\mathbb{R}^{2}$.

    **1.** Montrer que $(0, 0)$ est l'unique point critique de $f$, et que $f$ n'admet pas de maximum local en ce point.

    **2.** Montrer que, pour tout vecteur $u \in \mathbb{R}^{2}$, la fonction $t \mapsto f(tu)$ admet un minimum local en $0$.

    **3.** En étudiant $f$ le long d'une parabole bien choisie, montrer que $f$ n'admet pas d'extremum local en $(0, 0)$. Quelle intuition cet exemple contredit-il ?
  corrige: |
    En développant, $f(x, y) = y^{2} - 3x^{2}y + 2x^{4}$ : c'est une fonction polynomiale, de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et 
    $$\frac{\partial f}{\partial x}(x, y) = -6xy + 8x^{3} = 2x(4x^{2} - 3y) \qquad\text{et}\qquad \frac{\partial f}{\partial y}(x, y) = 2y - 3x^{2}.$$

    **1.** La seconde équation donne $y = \frac{3}{2}x^{2}$. Si $x \neq 0$, la première impose $4x^{2} = 3y = \frac{9}{2}x^{2}$, d'où $x = 0$, ce qui est contradictoire ; donc $x = 0$, puis $y = 0$, et $\boxed{(0, 0) \text{ est l'unique point critique de } f}$. Pour $t \neq 0$, on a $f(0, t) = t^{2} > 0 = f(0, 0)$ : toute boule centrée en $(0, 0)$ contient un point où $f$ dépasse strictement $f(0, 0)$, et $\boxed{f \text{ n'admet pas de maximum local en } (0, 0)}$.

    **2.** Soit $u = (u_{1}, u_{2}) \in \mathbb{R}^{2}$. Pour tout réel $t$, 
    $$f(tu) = t^{2}u_{2}^{2} - 3t^{3}u_{1}^{2}u_{2} + 2t^{4}u_{1}^{4}.$$
     Si $u_{2} \neq 0$, on écrit $f(tu) = t^{2}\big(u_{2}^{2} - 3tu_{1}^{2}u_{2} + 2t^{2}u_{1}^{4}\big)$ ; la parenthèse est une fonction continue de $t$, égale à $u_{2}^{2} > 0$ en $t = 0$, donc strictement positive sur un intervalle $\left]-\eta, \eta\right[$ (chapitre 8). Pour $0 < |t| < \eta$, on a alors $f(tu) > 0 = f(0)$. Si $u_{2} = 0$, on a $f(tu) = 2t^{4}u_{1}^{4} \geqslant 0$. Dans tous les cas, 
    $$\boxed{t \mapsto f(tu) \text{ admet un minimum local en } 0 \text{, strict dès que } u \neq 0}$$

    **3.** On factorise : $f$ est le produit de $y - x^{2}$ et de $y - 2x^{2}$, qui sont de signes contraires exactement entre les deux paraboles $y = x^{2}$ et $y = 2x^{2}$. On choisit la parabole intermédiaire $y = \frac{3}{2}x^{2}$ : 
    $$f\Big(x, \frac{3}{2}x^{2}\Big) = \frac{x^{2}}{2} \times \Big({-\frac{x^{2}}{2}}\Big), \qquad\text{soit}\qquad \boxed{f\Big(x, \frac{3}{2}x^{2}\Big) = -\frac{x^{4}}{4} < 0 \quad\text{pour } x \neq 0}$$
     Les points $\big(\frac{1}{n}, \frac{3}{2n^{2}}\big)$ tendent vers $(0, 0)$ et $f$ y est strictement négative ; les points $\big(0, \frac{1}{n}\big)$ tendent aussi vers $(0, 0)$, et $f$ y est strictement positive. Toute boule centrée en $(0, 0)$ contient des points des deux sortes : $\boxed{f \text{ n'admet pas d'extremum local en } (0, 0)}$.

    ![Figure](documents/figures/13281d7b3cbf4f18.svg)

    La bande colorée, entre les deux paraboles ocre, est l'ensemble où $f < 0$. Toute droite $y = mx$ avec $m \neq 0$, comme les deux droites bleues, traverse cette bande, mais loin de l'origine : la droite $y = mx$ ($m \neq 0$) n'y entre que pour $|x|$ compris entre $\frac{|m|}{2}$ et $|m|$. Au voisinage de $O$, elle reste dans la zone où $f > 0$, d'où le minimum local de la question 2. La parabole en pointillés, elle, reste dans la bande jusqu'à l'origine.

    *À retenir.* Cet exemple contredit l'intuition selon laquelle un point qui est un minimum local de $f$ le long de chaque droite passant par lui serait un minimum local de $f$. Les droites ne suffisent pas plus pour les extrema que pour la continuité : c'est la même leçon que la fonction $\frac{x^{2}y}{x^{4} + y^{2}}$ de la fin de la section 22.2, continue le long de chaque droite passant par l'origine sans y être continue, et, là aussi, une parabole met le défaut en évidence. Pour conclure à un extremum, il faut contrôler $\Delta$ sur toute une boule.
- id: "ma-22-29"
  feuille: "f-ma-22"
  numero: 29
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema, fonctions de classe C1, gradient]
  noeuds: [fq-points-critiques, gd-classe-ck, gd-differentielle]
  notions: [point-critique, extremum-local, gradient]
  page_enonce: 7
  page_corrige: 32
  enonce: |
    Soit $f$ une fonction de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ telle que 
    $$\forall p, q \in \mathbb{R}^{2}, \qquad \langle \nabla f(p) - \nabla f(q), p - q \rangle \geqslant 0.$$
     Montrer que tout point critique de $f$ est un minimum global de $f$. On pourra, pour $a$ point critique et $p \in \mathbb{R}^{2}$, étudier la fonction $g : t \mapsto f\big(a + t(p - a)\big)$ sur $[0, 1]$.
  corrige: |
    Soit $a$ un point critique de $f$, $p \in \mathbb{R}^{2}$, et $w = p - a$. L'arc $\gamma : t \mapsto a + tw$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, ses coordonnées étant affines, de vecteur dérivé $w$. Par la règle de la chaîne (théorème 3), $g = f \circ \gamma$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ et 
    $$g'(t) = \langle \nabla f(a + tw), w \rangle.$$
     Soit $t \in \left]0, 1\right]$. On applique l'hypothèse aux points $a + tw$ et $a$, dont la différence est $tw$, en utilisant $\nabla f(a) = 0$ : 
    $$t\,g'(t) = \langle \nabla f(a + tw) - \nabla f(a), tw \rangle \geqslant 0, \qquad\text{donc}\qquad g'(t) \geqslant 0,$$
     puisque $t > 0$. Comme de plus $g'(0) = \langle \nabla f(a), w \rangle = 0$, on a $g' \geqslant 0$ sur $[0, 1]$, et $g$ y est croissante (chapitre 9, théorème 7). Ainsi $f(p) = g(1) \geqslant g(0) = f(a)$, et ceci pour tout $p \in \mathbb{R}^{2}$ : 
    $$\boxed{\text{tout point critique de } f \text{ est un minimum global de } f}$$

    *Remarques.* En une variable, l'hypothèse s'écrit $\big(f'(p) - f'(q)\big)(p - q) \geqslant 0$ : elle dit que $f'$ est croissante, c'est-à-dire que $f$ est convexe (chapitre 9, théorème 10), et l'on retrouve le fait qu'un point où la dérivée d'une fonction convexe s'annule est un minimum global. L'hypothèse de l'exercice est la version en deux variables de la croissance de la dérivée ; par exemple, pour $f(x, y) = x^{2} + y^{2}$, on trouve $\langle \nabla f(p) - \nabla f(q), p - q \rangle = 2\lVert p - q \rVert^{2} \geqslant 0$. Deux limites du résultat méritent d'être notées. L'hypothèse ne garantit pas l'existence d'un point critique : $f(x, y) = x$ la vérifie, avec un produit scalaire toujours nul, et n'a aucun extremum. Elle ne garantit pas non plus l'unicité du minimum : $f(x, y) = x^{2}$ la vérifie aussi, et atteint son minimum en tout point de l'axe des ordonnées.
- id: "ma-22-30"
  feuille: "f-ma-22"
  numero: 30
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema, "problèmes géométriques d'optimisation"]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 7
  page_corrige: 32
  enonce: |
    *La boîte la plus économique.* On veut fabriquer une boîte en forme de parallélépipède rectangle, sans couvercle, de volume $\frac{1}{2}\,\mathrm{m}^{3}$, en utilisant le moins de matière possible, c'est-à-dire en minimisant la somme des aires de ses cinq faces. On note $x$ et $y$ les dimensions du fond et $z$ la hauteur, en mètres.

    **1.** Exprimer l'aire totale $S$ en fonction de $x$ et $y$ seulement, pour $(x, y) \in \left]0, +\infty\right[^{2}$.

    **2.** Déterminer les points critiques de $S$.

    **3.** Montrer que $S(x, y) \geqslant xy + \dfrac{2}{\sqrt{xy}}$, puis que $S(x, y) \geqslant 3$. Quelles dimensions faut-il choisir ?
  corrige: |
    **1.** Le volume vaut $xyz = \frac{1}{2}$, donc $z = \frac{1}{2xy}$. La boîte a un fond d'aire $xy$, deux faces d'aire $xz$ et deux faces d'aire $yz$ : 
    $$S = xy + 2xz + 2yz = xy + \frac{1}{y} + \frac{1}{x}, \qquad\text{soit}\qquad \boxed{S(x, y) = xy + \frac{1}{x} + \frac{1}{y}}$$

    **2.** La fonction $S$ est une fraction rationnelle dont le dénominateur ne s'annule pas sur l'ouvert $\left]0, +\infty\right[^{2}$ : elle y est de classe $\mathcal{C}^{1}$ (proposition 6), et 
    $$\frac{\partial S}{\partial x}(x, y) = y - \frac{1}{x^{2}} \qquad\text{et}\qquad \frac{\partial S}{\partial y}(x, y) = x - \frac{1}{y^{2}}.$$
     Un point critique vérifie $y = \frac{1}{x^{2}}$ et $x = \frac{1}{y^{2}} = x^{4}$, donc $x^{3} = 1$ puisque $x > 0$, puis $x = 1$ et $y = 1$ : $\boxed{\text{l'unique point critique est } (1, 1) \text{, où } S \text{ vaut } 3}$.

    **3.** Pour $x, y > 0$, on a $\Big(\frac{1}{\sqrt{x}} - \frac{1}{\sqrt{y}}\Big)^{2} \geqslant 0$, c'est-à-dire $\frac{1}{x} + \frac{1}{y} \geqslant \frac{2}{\sqrt{xy}}$, avec égalité si et seulement si $x = y$. D'où 
    $$\boxed{S(x, y) \geqslant xy + \frac{2}{\sqrt{xy}}}$$
     On pose $p = \sqrt{xy} > 0$ et $\varphi(p) = p^{2} + \frac{2}{p}$. La dérivée $\varphi'(p) = 2p - \frac{2}{p^{2}} = \frac{2(p^{3} - 1)}{p^{2}}$ est strictement négative sur $\left]0, 1\right[$ et strictement positive sur $\left]1, +\infty\right[$ : $\varphi$ décroît strictement sur $\left]0, 1\right]$ et croît strictement sur $\left[1, +\infty\right[$ (chapitre 9, théorème 7), et $\varphi(p) \geqslant \varphi(1) = 3$, avec égalité seulement pour $p = 1$. Ainsi 
    $$\boxed{S(x, y) \geqslant 3, \text{ avec égalité si et seulement si } x = y = 1}$$
     puisque l'égalité exige $x = y$ et $xy = 1$. Le point critique de la question 2 est donc le minimum global de $S$, et il faut choisir 
    $$\boxed{\text{un fond carré de } 1\,\mathrm{m} \text{ de côté et une hauteur de } 0{,}5\,\mathrm{m}, \text{ pour une aire de } 3\,\mathrm{m}^{2}}$$

    *Piège.* La question 2 ne fournit qu'un candidat : l'ouvert $\left]0, +\infty\right[^{2}$ n'est pas borné, et rien n'assure *a priori* que $S$ y atteigne un minimum. C'est l'inégalité de la question 3 qui le prouve, à la manière de l'exemple de la surface de l'introduction dans la section 22.5.2.

    *Remarque.* La hauteur vaut la moitié du côté du fond, et l'on peut le comprendre ainsi : deux boîtes identiques, collées par leurs ouvertures, forment une boîte fermée de dimensions $x$, $y$, $2z$, de volume $1$, dont l'aire totale $2xy + 4xz + 4yz$ vaut exactement $2S$. Minimiser $S$ revient donc à minimiser l'aire d'une boîte fermée de volume $1$, et l'on trouve le cube de côté $1$, coupé en deux.
- id: "ma-22-31"
