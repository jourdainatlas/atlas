  noeuds: [fq-points-critiques, tr-ouverts]
  notions: [point-critique, extremum-local, ouvert]
  page_enonce: 7
  page_corrige: 33
  enonce: |
    On considère la fonction $f : (x, y) \mapsto y^{2} - x^{2}y + x^{2}$ et la partie 
    $$D = \big\{(x, y) \in \mathbb{R}^{2} \mid x^{2} - 1 \leqslant y \leqslant 1 - x^{2}\big\}.$$

    **1.** Représenter $D$, et paramétrer les deux arcs de parabole qui forment son bord.

    **2.** Déterminer les points critiques de $f$ qui appartiennent à l'intérieur de $D$, c'est-à-dire à l'ouvert défini par les inégalités strictes $x^{2} - 1 < y < 1 - x^{2}$.

    **3.** Étudier les valeurs de $f$ sur le bord de $D$.

    **4.** Montrer que $0 \leqslant f \leqslant 1$ sur $D$. En déduire le minimum et le maximum de $f$ sur $D$, et tous les points où ils sont atteints.
  corrige: |
    **1.** Un point $(x, y)$ de $D$ vérifie $x^{2} - 1 \leqslant 1 - x^{2}$, donc $x^{2} \leqslant 1$ : la partie $D$ est la lentille comprise entre les deux paraboles $y = 1 - x^{2}$ et $y = x^{2} - 1$, pour $x \in [-1, 1]$. Son bord est formé des deux arcs 
    $$\boxed{\gamma_{1}(t) = (t, 1 - t^{2}) \quad\text{et}\quad \gamma_{2}(t) = (t, t^{2} - 1), \qquad t \in [-1, 1]}$$
     qui se rejoignent en $(-1, 0)$ et $(1, 0)$.

    ![Figure](documents/figures/6a3519642cebf451.svg)

    Sur l'arc supérieur, en ocre, $f$ varie entre $\frac{1}{2}$ et $1$ ; sur l'arc inférieur, en trait épais, elle vaut constamment $1$. Le minimum est atteint au seul point critique intérieur, et le maximum sur tout un arc du bord et en un point isolé.

    **2.** La fonction $f$ est polynomiale, et $\nabla f(x, y) = \big(2x(1 - y),\ 2y - x^{2}\big)$. Si $x = 0$, la seconde coordonnée impose $y = 0$ ; si $y = 1$, elle impose $x^{2} = 2$. Les points critiques de $f$ sur $\mathbb{R}^{2}$ sont donc $(0, 0)$ et $(\pm\sqrt{2}, 1)$ ; les seconds ne sont pas dans $D$, puisque $1 > 1 - 2$. Ainsi 
    $$\boxed{\text{le seul point critique intérieur à } D \text{ est } (0, 0) \text{, où } f \text{ vaut } 0}$$

    **3.** Sur l'arc supérieur, avec $s = t^{2} \in [0, 1]$, 
    $$f\big(\gamma_{1}(t)\big) = (1 - t^{2})^{2} - t^{2}(1 - t^{2}) + t^{2} = 1 - 2t^{2} + 2t^{4} = 2\Big(s - \frac{1}{2}\Big)^{2} + \frac{1}{2}.$$
     Elle varie donc entre $\frac{1}{2}$, atteint pour $t = \pm\frac{1}{\sqrt{2}}$, et $1$, atteint pour $s \in \{0, 1\}$, c'est-à-dire en $(0, 1)$ et en $(\pm 1, 0)$. Sur l'arc inférieur, 
    $$f\big(\gamma_{2}(t)\big) = (t^{2} - 1)^{2} - t^{2}(t^{2} - 1) + t^{2} = (t^{2} - 1)(t^{2} - 1 - t^{2}) + t^{2} = 1,$$

    $$\boxed{f\big(\gamma_{2}(t)\big) = 1 \text{ pour tout } t \in [-1, 1]}$$

    $$\boxed{\text{sur l'arc supérieur, } \frac{1}{2} \leqslant f \leqslant 1, \text{ avec } f = 1 \text{ seulement en } (0, 1) \text{ et } (\pm 1, 0)}$$

    **4.** On écrit $f(x, y) = y^{2} + x^{2}(1 - y)$.

    *Minoration.* Sur $D$, on a $y \leqslant 1 - x^{2} \leqslant 1$, donc $1 - y \geqslant 0$ et $f(x, y) \geqslant 0$. L'égalité impose $y^{2} = 0$, puis $x^{2} = 0$ puisque $1 - y = 1$ : elle n'a lieu qu'en $(0, 0)$.

    *Majoration.* Si $y \geqslant 0$, la condition $y \leqslant 1 - x^{2}$ donne $x^{2} \leqslant 1 - y$, et, comme $1 - y \geqslant 0$, 
    $$f(x, y) \leqslant y^{2} + (1 - y)^{2} = 1 - 2y(1 - y) \leqslant 1,$$
     car $y(1 - y) \geqslant 0$ pour $y \in [0, 1]$. Si $y < 0$, la condition $x^{2} - 1 \leqslant y$ donne $x^{2} \leqslant 1 + y$, et, comme $1 - y > 0$, 
    $$f(x, y) \leqslant y^{2} + (1 + y)(1 - y) = 1.$$
     On a donc $\boxed{0 \leqslant f \leqslant 1 \text{ sur } D}$. Pour $y < 0$, l'égalité $f = 1$ exige $x^{2} = 1 + y$ : c'est l'arc inférieur. Pour $y \geqslant 0$, elle exige $y(1 - y) = 0$ et $x^{2}(1 - y) = (1 - y)^{2}$, c'est-à-dire $y = 0$ et $x = \pm 1$, ou $y = 1$ et $x = 0$. Comme $f(0, 0) = 0$ et que $f$ vaut $1$ sur l'arc inférieur, 
    $$\boxed{\min_{D} f = 0, \text{ atteint en } (0, 0) \text{ seulement}}$$

    $$\boxed{\max_{D} f = 1, \text{ atteint en tout point de l'arc inférieur et en } (0, 1)}$$
     ce qui concorde avec la question 3, et avec un calcul de $f$ sur une grille fine de $D$ ✓.

    *Piège.* Le maximum est atteint en une infinité de points, dont aucun n'est un point critique : en $(0, 1)$, par exemple, $\nabla f(0, 1) = (0, 2)$. L'erreur la plus répandue est de croire qu'il suffit de comparer les valeurs de $f$ en un nombre fini de « points candidats » ; quand $f$ est constante sur un arc du bord, comme ici, tous ses points sont des points de maximum, et la description complète demande l'étude du cas d'égalité.
- id: "ma-22-32"
  feuille: "f-ma-22"
  numero: 32
  partie: "Extrema"
  etoiles: 2
  types: [Calcul]
  mots_cles: [extrema]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 7
  page_corrige: 34
  enonce: |
    **1.** Déterminer le maximum et le minimum de $f : (x, y) \mapsto x - y + x^{3} + y^{3}$ sur le carré $[0, 1]^{2}$.

    **2.** Déterminer le maximum de $g : (x, y) \mapsto \sin x\,\sin y\,\sin(x + y)$ sur le carré $\big[0, \frac{\pi}{2}\big]^{2}$, ainsi que les points où il est atteint. On cherchera d'abord les points critiques de $g$ à l'intérieur du carré, puis l'on majorera $\sin x \sin y$ à $x + y$ fixé.
  corrige: |
    **1.** La fonction se sépare en une somme d'une fonction de $x$ et d'une fonction de $y$ : 
    $$f(x, y) = u(x) + v(y), \qquad u(x) = x + x^{3}, \qquad v(y) = y^{3} - y.$$
     Sur $[0, 1]$, $u'(x) = 1 + 3x^{2} > 0$ : $u$ croît strictement de $u(0) = 0$ à $u(1) = 2$. La dérivée $v'(y) = 3y^{2} - 1$ est négative sur $\big[0, \frac{1}{\sqrt{3}}\big]$ et positive ensuite : $v$ décroît de $v(0) = 0$ à $v\big(\frac{1}{\sqrt{3}}\big) = \frac{1}{3\sqrt{3}} - \frac{1}{\sqrt{3}} = -\frac{2}{3\sqrt{3}}$, puis croît jusqu'à $v(1) = 0$. Ainsi $0 \leqslant u \leqslant 2$ et $-\frac{2}{3\sqrt{3}} \leqslant v \leqslant 0$, d'où, avec les cas d'égalité, 
    $$\boxed{\max_{[0,1]^{2}} f = 2, \text{ atteint en } (1, 0) \text{ et } (1, 1) ; \qquad \min_{[0,1]^{2}} f = -\frac{2}{3\sqrt{3}} = -\frac{2\sqrt{3}}{9} \approx -0{,}385, \text{ atteint en } \Big(0, \frac{1}{\sqrt{3}}\Big)}$$
     Ces extrema sont sur le bord du carré, ce qui était prévisible : $\frac{\partial f}{\partial x} = 1 + 3x^{2}$ ne s'annule jamais, et $f$ n'a aucun point critique (théorème 5).

    **2.** La fonction $g$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et la formule d'addition donne 
    $$\frac{\partial g}{\partial x}(x, y) = \sin y\,\big(\cos x \sin(x + y) + \sin x \cos(x + y)\big) = \sin y \sin(2x + y), \qquad \frac{\partial g}{\partial y}(x, y) = \sin x \sin(x + 2y).$$
     À l'intérieur du carré, $\sin x > 0$ et $\sin y > 0$ ; un point critique vérifie donc $\sin(2x + y) = 0$ et $\sin(x + 2y) = 0$. Or $2x + y$ et $x + 2y$ appartiennent à $\left]0, \frac{3\pi}{2}\right[$, donc $2x + y = x + 2y = \pi$, et 
    $$\boxed{\text{le seul point critique intérieur est } \Big(\frac{\pi}{3}, \frac{\pi}{3}\Big), \text{ où } g \text{ vaut } \Big(\frac{\sqrt{3}}{2}\Big)^{3} = \frac{3\sqrt{3}}{8}}$$
     Ce n'est qu'un candidat ; la majoration suivante conclut. Soit $(x, y) \in \big[0, \frac{\pi}{2}\big]^{2}$ et $s = x + y \in [0, \pi]$. Par les formules de trigonométrie du chapitre 4, 
    $$\sin x \sin y = \frac{\cos(x - y) - \cos s}{2} \leqslant \frac{1 - \cos s}{2},$$
     et, comme $\sin s \geqslant 0$, on obtient $g(x, y) \leqslant G(s)$, avec $G(s) = \frac{1}{2}\sin s\,(1 - \cos s)$. On étudie $G$ sur $[0, \pi]$ : 
    $$G'(s) = \frac{\cos s - \cos^{2} s + \sin^{2} s}{2} = \frac{1 + \cos s - 2\cos^{2} s}{2} = \frac{(1 - \cos s)(1 + 2\cos s)}{2}.$$
     Sur $\left]0, \pi\right]$, le facteur $1 - \cos s$ est strictement positif, et $1 + 2\cos s$ est strictement positif avant $\frac{2\pi}{3}$ et strictement négatif après : $G$ croît strictement sur $\big[0, \frac{2\pi}{3}\big]$ et décroît strictement sur $\big[\frac{2\pi}{3}, \pi\big]$, et son maximum est $G\big(\frac{2\pi}{3}\big) = \frac{1}{2} \cdot \frac{\sqrt{3}}{2} \cdot \frac{3}{2} = \frac{3\sqrt{3}}{8}$. Ainsi $g \leqslant \frac{3\sqrt{3}}{8}$ sur le carré. L'égalité exige $s = \frac{2\pi}{3}$, puis, comme $\sin s > 0$, l'égalité $\cos(x - y) = 1$, c'est-à-dire $x = y$, puisque $x - y \in \big[{-\frac{\pi}{2}}, \frac{\pi}{2}\big]$. D'où 
    $$\boxed{\max g = \frac{3\sqrt{3}}{8} \approx 0{,}650, \text{ atteint au seul point } \Big(\frac{\pi}{3}, \frac{\pi}{3}\Big)}$$
     résultat confirmé par une grille fine du carré ✓.

    *Remarque.* Avec $z = \pi - x - y$, on a $\sin(x + y) = \sin z$, et $g(x, y) = \sin x \sin y \sin z$ est le produit des sinus des angles d'un triangle d'angles $x$, $y$, $z$. Le maximum correspond au triangle équilatéral, comme le minimum d'aire que l'on obtiendra plus loin, à l'exercice 36 ; on y retrouvera la même technique, qui consiste à fixer une combinaison des variables, ici $x + y$, pour se ramener à une variable.
- id: "ma-22-33"
  feuille: "f-ma-22"
  numero: 33
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema, ouverts du plan]
  noeuds: [fq-points-critiques, tr-ouverts]
  notions: [point-critique, extremum-local, ouvert]
  page_enonce: 8
  page_corrige: 35
  enonce: |
    On note $T = \{(x, y) \in \mathbb{R}^{2} \mid x \geqslant 0,\ y \geqslant 0,\ x + y \leqslant 1\}$ et $f(x, y) = xy(1 - x - y)$.

    **1.** Déterminer les points critiques de $f$ à l'intérieur de $T$, c'est-à-dire sur l'ouvert défini par des inégalités strictes.

    **2.** Montrer que $f$ admet un maximum sur $T$ et le déterminer. On pourra, à $x \in [0, 1]$ fixé, maximiser la fonction $y \mapsto f(x, y)$ sur $[0, 1 - x]$.

    **3.** En déduire que, pour tous réels positifs $a$, $b$ et $c$, 
    $$abc \leqslant \Big(\frac{a + b + c}{3}\Big)^{3}.$$
  corrige: |
    **1.** La fonction polynomiale $f$ a pour dérivées partielles 
    $$\frac{\partial f}{\partial x}(x, y) = y(1 - 2x - y) \qquad\text{et}\qquad \frac{\partial f}{\partial y}(x, y) = x(1 - x - 2y).$$
     À l'intérieur de $T$, $x > 0$ et $y > 0$ ; un point critique vérifie donc $2x + y = 1$ et $x + 2y = 1$, d'où $x = y = \frac{1}{3}$, qui est bien intérieur : 
    $$\boxed{\text{le seul point critique intérieur est } \Big(\frac{1}{3}, \frac{1}{3}\Big), \text{ où } f \text{ vaut } \frac{1}{27}}$$

    **2.** Soit $x \in [0, 1]$ et $y \in [0, 1 - x]$. Les réels $y$ et $1 - x - y$ sont positifs, de somme $1 - x$, et 
    $$\Big(\frac{1 - x}{2}\Big)^{2} - y(1 - x - y) = \Big(y - \frac{1 - x}{2}\Big)^{2} \geqslant 0.$$
     En multipliant par $x \geqslant 0$, on obtient $f(x, y) \leqslant k(x)$, avec $k(x) = \frac{x(1 - x)^{2}}{4}$. La dérivée 
    $$k'(x) = \frac{(1 - x)^{2} - 2x(1 - x)}{4} = \frac{(1 - x)(1 - 3x)}{4}$$
     est positive sur $\big[0, \frac{1}{3}\big]$ et négative sur $\big[\frac{1}{3}, 1\big]$, et ne s'annule qu'en $\frac{1}{3}$ et en $1$ : $k$ atteint son maximum sur $[0, 1]$ au seul point $\frac{1}{3}$, où il vaut $\frac{1}{3} \cdot \frac{4}{9} \cdot \frac{1}{4} = \frac{1}{27}$. Ainsi $f \leqslant \frac{1}{27}$ sur $T$, avec égalité si et seulement si $x = \frac{1}{3}$ et $y = \frac{1 - x}{2} = \frac{1}{3}$ : 
    $$\boxed{\max_{T} f = \frac{1}{27}, \text{ atteint au seul point } \Big(\frac{1}{3}, \frac{1}{3}\Big)}$$
     C'est le point critique de la question 1 ; sur le bord de $T$, où l'un des trois facteurs est nul, $f$ s'annule.

    ![Figure](documents/figures/e370c9f0afde29c6.svg)

    Les lignes de niveau $0{,}01$, $0{,}02$ et $0{,}03$ de $f$ sont des courbes fermées emboîtées autour du point $\big(\frac{1}{3}, \frac{1}{3}\big)$, où $f$ atteint $\frac{1}{27} \approx 0{,}037$ ; plus on s'approche du bord du triangle, où $f$ est nulle, plus le niveau est bas.

    **3.** Soit $a$, $b$, $c$ des réels positifs et $s = a + b + c$. Si $s = 0$, les trois réels sont nuls et l'inégalité est une égalité. Sinon, le point $\big(\frac{a}{s}, \frac{b}{s}\big)$ appartient à $T$, puisque ses coordonnées sont positives et de somme $1 - \frac{c}{s} \leqslant 1$, et la question 2 donne 
    $$f\Big(\frac{a}{s}, \frac{b}{s}\Big) = \frac{a}{s} \cdot \frac{b}{s} \cdot \frac{c}{s} \leqslant \frac{1}{27}, \qquad\text{d'où}\qquad \boxed{abc \leqslant \Big(\frac{a + b + c}{3}\Big)^{3}}$$
     avec égalité si et seulement si $\frac{a}{s} = \frac{b}{s} = \frac{1}{3}$, c'est-à-dire $a = b = c$. C'est l'inégalité arithmético-géométrique pour trois réels ; la concavité du logarithme et l'inégalité de Jensen (chapitre 9, proposition 7) la donnaient aussi, et le même triangle $T$ servira de nouveau à l'exercice 37, pour une loi de probabilité sur trois valeurs.
- id: "ma-22-34"
  feuille: "f-ma-22"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [ouverts du plan, continuité, dérivées partielles, fonctions de classe C1, gradient, extrema, courbes définies implicitement]
  noeuds: [tr-ouverts, c-sequentielle, gd-differentielle, gd-classe-ck, fq-points-critiques]
  notions: [ouvert, derivee-partielle, gradient, point-critique, extremum-local]
  page_enonce: 8
  page_corrige: 36
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. Dans tout l'exercice, $U$ est un ouvert de $\mathbb{R}^{2}$, $a$ un point de $U$ et $f$ une fonction de $U$ dans $\mathbb{R}$.

    **1.** Si $f$ admet des dérivées partielles en $a$, alors $f$ est continue en $a$.

    **2.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $U$, alors $f$ est continue sur $U$.

    **3.** Si, pour tout vecteur $u \in \mathbb{R}^{2}$, la fonction $t \mapsto f(a + tu)$ est continue en $0$, alors $f$ est continue en $a$.

    **4.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ et si $f(x, y) = f(y, x)$ pour tous réels $x$ et $y$, alors on a l'égalité $\frac{\partial f}{\partial x}(t, t) = \frac{\partial f}{\partial y}(t, t)$ pour tout réel $t$.

    **5.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ et si $g(t) = f(t, t^{2})$ pour tout réel $t$, alors $g'(0) = \frac{\partial f}{\partial x}(0, 0)$.

    **6.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $U$ et admet un extremum local en $a$, alors $\nabla f(a) = 0$.

    **7.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $U$ et si $\nabla f(a) = 0$, alors $f$ admet un extremum local en $a$.

    **8.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ et si sa restriction au disque fermé $\overline{B}(0, 1)$ atteint son maximum en un point $a$ de ce disque, alors $\nabla f(a) = 0$.

    **9.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $U$ et si $\gamma$ est un arc de classe $\mathcal{C}^{1}$ de $U$, défini sur un intervalle $I$, le long duquel $f$ est constante, alors $\nabla f\big(\gamma(t)\big)$ est orthogonal à $\gamma'(t)$ pour tout $t \in I$.

    **10.** Si $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ et si son gradient y est nul en tout point, alors $f$ est constante.
  corrige: |
    **1. Faux.** La fonction $g$ de la proposition 5, définie par $g(x, y) = \frac{xy}{x^{2} + y^{2}}$ hors de l'origine et $g(0, 0) = 0$, admet des dérivées partielles en $(0, 0)$, toutes deux nulles, mais elle n'est pas continue en ce point, puisque $g\big(\frac{1}{n}, \frac{1}{n}\big) = \frac{1}{2}$ ne tend pas vers $g(0, 0) = 0$. Les dérivées partielles ne regardent que le long des axes.

    **2. Vrai.** C'est la proposition 7 : le développement limité à l'ordre $1$ (théorème 1) donne 
    $$|f(a + H) - f(a)| \leqslant \big(|p| + |q| + |\varepsilon(H)|\big)\lVert H \rVert,$$
     où $p$ et $q$ sont les dérivées partielles de $f$ en $a$ et où $\varepsilon(H)$ tend vers $0$ avec $H$ ; le majorant tend vers $0$.

    **3. Faux.** Reprenons la fonction de la fin de la section 22.2 : $\ell(x, y) = \frac{x^{2}y}{x^{4} + y^{2}}$ hors de l'origine, $\ell(0, 0) = 0$, avec $a = (0, 0)$. Pour $u = (u_{1}, u_{2})$ et $t \neq 0$, si $u_{2} \neq 0$, 
    $$\ell(tu) = \frac{t^{3}u_{1}^{2}u_{2}}{t^{4}u_{1}^{4} + t^{2}u_{2}^{2}} = \frac{t\,u_{1}^{2}u_{2}}{t^{2}u_{1}^{4} + u_{2}^{2}} \xrightarrow[t \to 0]{} 0 = \ell(0),$$
     et si $u_{2} = 0$, $\ell(tu) = 0$ : toutes les fonctions $t \mapsto \ell(tu)$ sont continues en $0$. Pourtant $\ell\big(\frac{1}{n}, \frac{1}{n^{2}}\big) = \frac{1}{2}$, et $\ell$ n'est pas continue en $(0, 0)$, le long de la parabole $y = x^{2}$ (voir aussi l'exercice 3).

    **4. Vrai.** Soit $t$ un réel. Les fonctions d'une variable $\varphi : s \mapsto f(s, t)$ et $\psi : s \mapsto f(t, s)$ sont égales par hypothèse, donc ont la même dérivée en $t$ ; or $\varphi'(t) = \frac{\partial f}{\partial x}(t, t)$ et $\psi'(t) = \frac{\partial f}{\partial y}(t, t)$ par définition des dérivées partielles. L'hypothèse $\mathcal{C}^{1}$ ne sert qu'à garantir leur existence. Sur la première bissectrice, le gradient d'une fonction symétrique est donc colinéaire à $(1, 1)$.

    **5. Vrai.** L'arc $\gamma(t) = (t, t^{2})$ est de classe $\mathcal{C}^{1}$, de vecteur dérivé $\gamma'(t) = (1, 2t)$, et la règle de la chaîne (théorème 3) donne 
    $$g'(0) = \frac{\partial f}{\partial x}(0, 0) \times 1 + \frac{\partial f}{\partial y}(0, 0) \times 0 = \frac{\partial f}{\partial x}(0, 0).$$
     La parabole est tangente en $(0, 0)$ à l'axe des abscisses, et seule la direction de la tangente intervient.

    **6. Vrai.** C'est le théorème 5 : $U$ est ouvert et $f$ de classe $\mathcal{C}^{1}$, donc un extremum local est un point critique.

    **7. Faux.** La fonction $f(x, y) = x^{2} - y^{2}$, sur $U = \mathbb{R}^{2}$, a un gradient nul en $(0, 0)$, et ce point est un col : $f(t, 0) = t^{2} > 0$ et $f(0, t) = -t^{2} < 0$ pour $t \neq 0$. C'est la première remarque qui suit le théorème 5.

    **8. Faux.** Pour $f(x, y) = x$, on a $x \leqslant \lVert (x, y) \rVert \leqslant 1$ sur le disque fermé, avec égalité seulement en $(1, 0)$ : la restriction de $f$ au disque atteint son maximum en $a = (1, 0)$, alors que $\nabla f(a) = (1, 0) \neq 0$. Le théorème 5 ne dit rien d'un point du bord, car le disque fermé n'est pas un ouvert ; c'est la seconde remarque qui suit ce théorème.

    **9. Vrai.** C'est la proposition 9, avec $c$ la valeur constante de $f$ le long de $\gamma$ : en dérivant $f\big(\gamma(t)\big) = c$ par la règle de la chaîne, on obtient $\langle \nabla f\big(\gamma(t)\big), \gamma'(t) \rangle = 0$.

    **10. Vrai.** Soit $a$ et $b$ deux points de $V = \mathbb{R}^{2} \setminus \{(0, 0)\}$.

    • Si le segment $[a, b]$ ne contient pas l'origine, l'arc $\gamma(t) = a + t(b - a)$, pour $t \in [0, 1]$, est de classe $\mathcal{C}^{1}$ dans $V$, et $f \circ \gamma$ a pour dérivée $\langle \nabla f\big(\gamma(t)\big), b - a \rangle = 0$ : elle est constante sur l'intervalle $[0, 1]$ (chapitre 9, théorème 7), et $f(a) = f(b)$.

    • Sinon, $b$ est colinéaire à $a$. Soit $c$ l'image de $a$ par la rotation d'angle $\frac{\pi}{2}$ : la famille $(a, c)$ est libre. Si l'origine appartenait au segment $[a, c]$, on aurait $(1 - s)a + sc = 0$ avec $s \in [0, 1]$, ce qui est impossible ; de même pour $[c, b]$, puisque $b$ est un multiple non nul de $a$. Le cas précédent donne $f(a) = f(c) = f(b)$.

    Ainsi $f$ est constante sur $V$. Ce qui compte n'est pas que l'ouvert soit sans trou, mais qu'il soit « d'un seul tenant » : deux de ses points peuvent toujours être reliés par un chemin qui reste dedans. L'ouvert $\{(x, y) \mid x \neq 0\}$ de l'exercice 8, question 4, n'a pas cette propriété, et une fonction de gradient nul peut y prendre deux valeurs. 
    $$\boxed{\text{Vrai : } 2, 4, 5, 6, 9, 10 ; \qquad \text{Faux : } 1, 3, 7, 8}$$
     *Piège.* Les assertions 1 et 3 commettent la même faute : elles prétendent contrôler une fonction de deux variables en ne regardant que dans un nombre fini de directions, ou le long de droites. Les assertions 7 et 8 commettent la faute symétrique sur le théorème 5, en lisant une condition nécessaire comme suffisante, ou en oubliant qu'elle n'est établie qu'en un point intérieur.
- id: "ma-22-35"
  feuille: "f-ma-22"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [ouverts du plan, fonctions de classe C1, gradient, extrema, "problèmes géométriques d'optimisation"]
  noeuds: [tr-ouverts, gd-classe-ck, gd-differentielle, fq-points-critiques]
  notions: [ouvert, gradient, point-critique, extremum-local]
  page_enonce: 8
  page_corrige: 37
  enonce: |
    *Le point de Fermat d'un triangle.* On identifie le plan à $\mathbb{R}^{2}$. Soit $A$, $B$, $C$ trois points non alignés, et $f(M) = AM + BM + CM$ pour tout point $M$, où $AM = \lVert M - A \rVert$. Pour $P \in \{A, B, C\}$ et $M \neq P$, on note $u_{P}(M) = \dfrac{M - P}{PM}$ le vecteur unitaire dirigé de $P$ vers $M$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur l'ouvert $\mathbb{R}^{2} \setminus \{A, B, C\}$, et que 
    $$\nabla f(M) = u_{A}(M) + u_{B}(M) + u_{C}(M).$$

    **2.** Soit $u$, $v$, $w$ trois vecteurs unitaires. Montrer que $u + v + w = 0$ si et seulement si 
    $$\langle u, v \rangle = \langle v, w \rangle = \langle w, u \rangle = -\frac{1}{2}.$$
     En déduire qu'un point $M$ distinct de $A$, $B$ et $C$ est un point critique de $f$ si et seulement si les trois angles $\widehat{AMB}$, $\widehat{BMC}$ et $\widehat{CMA}$ mesurent $\frac{2\pi}{3}$.

    **3.** On suppose qu'il existe un point $M_{0}$, distinct de $A$, $B$ et $C$, en lequel ces trois angles mesurent $\frac{2\pi}{3}$ ; on admet qu'un tel point existe, à l'intérieur du triangle, dès que les trois angles du triangle $ABC$ sont strictement inférieurs à $\frac{2\pi}{3}$. Montrer que, pour tout point $M$ du plan, $AM \geqslant \langle M - A, u_{A}(M_{0}) \rangle$, puis que $f$ admet en $M_{0}$ un minimum global.

    ![Figure](documents/figures/27b3c9aade86db20.svg)

    Pour le triangle de sommets $A = (0, 0)$, $B = (6, 0)$ et $C = (1{,}8\,;3{,}6)$, dont les angles sont inférieurs à $\frac{2\pi}{3}$, le point $M_{0} \approx (2{,}07\,;1{,}61)$ voit chacun des trois côtés sous un angle de $\frac{2\pi}{3}$ : c'est en ce point que la somme des distances aux trois sommets est la plus petite.
  corrige: |
    **1.** Soit $P = (p_{1}, p_{2})$ l'un des trois points. L'ensemble $\mathbb{R}^{2} \setminus \{P\} = \{M \mid \lVert M - P \rVert \neq 0\}$ est un ouvert, par la proposition 4 (v) appliquée à la fonction continue $M \mapsto \lVert M - P \rVert$, et $\mathbb{R}^{2} \setminus \{A, B, C\}$ est l'intersection de trois tels ouverts, donc un ouvert (proposition 2 (iii), appliquée deux fois). Sur $\mathbb{R}^{2} \setminus \{P\}$, la fonction polynomiale $(x, y) \mapsto (x - p_{1})^{2} + (y - p_{2})^{2}$ est de classe $\mathcal{C}^{1}$, à valeurs dans $\left]0, +\infty\right[$, où la racine carrée est de classe $\mathcal{C}^{1}$ ; par la proposition 6 (iii), $M \mapsto PM$ y est de classe $\mathcal{C}^{1}$, et 
    $$\frac{\partial }{\partial x}\big(PM\big) = \frac{2(x - p_{1})}{2\sqrt{(x - p_{1})^{2} + (y - p_{2})^{2}}} = \frac{x - p_{1}}{PM} \qquad\text{et}\qquad \frac{\partial }{\partial y}\big(PM\big) = \frac{y - p_{2}}{PM},$$
     soit $\nabla(PM) = u_{P}(M)$. Par somme (proposition 6 (ii)), $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2} \setminus \{A, B, C\}$, et 
    $$\boxed{\nabla f(M) = u_{A}(M) + u_{B}(M) + u_{C}(M)}$$
     Le gradient de la distance à $P$ est le vecteur unitaire qui s'éloigne de $P$ : pour augmenter le plus vite sa distance à $P$, on s'éloigne de $P$ en ligne droite, et la distance augmente alors à la vitesse $1$ (théorème 2).

    **2.** Si $u + v + w = 0$, alors $u + v = -w$, et $\lVert u + v \rVert^{2} = \lVert w \rVert^{2}$ s'écrit $1 + 2\langle u, v \rangle + 1 = 1$, soit $\langle u, v \rangle = -\frac{1}{2}$ ; les deux autres égalités s'obtiennent de même, en isolant $u$ puis $v$. Réciproquement, si les trois produits scalaires valent $-\frac{1}{2}$, 
    $$\lVert u + v + w \rVert^{2} = \lVert u \rVert^{2} + \lVert v \rVert^{2} + \lVert w \rVert^{2} + 2\big(\langle u, v \rangle + \langle v, w \rangle + \langle w, u \rangle\big) = 3 - 3 = 0,$$
     donc $u + v + w = 0$. On a ainsi établi l'équivalence 
    $$\boxed{u + v + w = 0 \iff \langle u, v \rangle = \langle v, w \rangle = \langle w, u \rangle = -\frac{1}{2}}$$
     Soit $M$ distinct de $A$, $B$, $C$. Le cosinus de l'angle $\widehat{AMB}$, de mesure $\theta \in [0, \pi]$, vaut 
    $$\cos\theta = \frac{\langle A - M, B - M \rangle}{MA \cdot MB} = \langle -u_{A}(M), -u_{B}(M) \rangle = \langle u_{A}(M), u_{B}(M) \rangle,$$
     et $\cos$ est une bijection de $[0, \pi]$ sur $[-1, 1]$ : on a $\langle u_{A}(M), u_{B}(M) \rangle = -\frac{1}{2}$ si et seulement si $\theta = \frac{2\pi}{3}$. Avec la question 1 et l'équivalence précédente, appliquée aux trois vecteurs unitaires $u_{A}(M)$, $u_{B}(M)$, $u_{C}(M)$, 
    $$\boxed{M \text{ est critique} \iff u_{A}(M) + u_{B}(M) + u_{C}(M) = 0 \iff \widehat{AMB} = \widehat{BMC} = \widehat{CMA} = \frac{2\pi}{3}}$$

    **3.** On note $u_{P} = u_{P}(M_{0})$ pour $P \in \{A, B, C\}$ ; par la question 2, $M_{0}$ est un point critique, et $u_{A} + u_{B} + u_{C} = 0$. Pour tout point $M$, l'inégalité de Cauchy-Schwarz (chapitre 19, théorème 1) donne 
    $$\langle M - A, u_{A} \rangle \leqslant \lVert M - A \rVert\,\lVert u_{A} \rVert = AM,$$
     et c'est une égalité pour $M = M_{0}$, puisque $\langle M_{0} - A, u_{A} \rangle = \langle AM_{0}\,u_{A}, u_{A} \rangle = AM_{0}$. En sommant les trois inégalités analogues, 
    $$f(M) \geqslant \langle M, u_{A} + u_{B} + u_{C} \rangle - \big(\langle A, u_{A} \rangle + \langle B, u_{B} \rangle + \langle C, u_{C} \rangle\big) = -\big(\langle A, u_{A} \rangle + \langle B, u_{B} \rangle + \langle C, u_{C} \rangle\big),$$
     et le minorant, qui ne dépend pas de $M$, est atteint pour $M = M_{0}$, où les trois inégalités sont des égalités : il vaut $f(M_{0})$. Ainsi 
    $$\boxed{f(M) \geqslant f(M_{0}) \text{ pour tout point } M : f \text{ admet en } M_{0} \text{ un minimum global}}$$
     Ce minimum est même strict. L'égalité $f(M) = f(M_{0})$ impose l'égalité dans les trois inégalités de Cauchy-Schwarz. Pour $A$, l'égalité $\langle M - A, u_{A} \rangle = \lVert M - A \rVert$ impose que $M - A$ soit un multiple positif de $u_{A}$ (cas d'égalité du théorème 1 du chapitre 19) : le point $M$ appartient à la droite $(AM_{0})$, et de même à la droite $(BM_{0})$. Ces deux droites sont distinctes, puisque l'angle $\widehat{AM_{0}B}$ mesure $\frac{2\pi}{3}$, et ne se coupent qu'en $M_{0}$ : donc $M = M_{0}$. Pour le triangle de la figure de l'énoncé, l'algorithme numérique donne $f(M_{0}) \approx 8{,}878$, à comparer à $f(A) \approx 10{,}025$, $f(B) \approx 11{,}532$ et $f(C) \approx 9{,}557$ ✓.

    ![Figure](documents/figures/f9efb702d51cc7d0.svg)

    En $M_{0}$, les trois vecteurs unitaires $u_{A}$, $u_{B}$, $u_{C}$, qui prolongent les segments issus des sommets, font entre eux des angles de $\frac{2\pi}{3}$ ; mis bout à bout, à droite, ils forment un triangle équilatéral fermé : leur somme, le gradient de $f$, est nulle.

    *À retenir.* Le minimum global a été obtenu sans aucun théorème d'existence, par une inégalité dont le cas d'égalité est le point critique : la condition $\nabla f(M_{0}) = 0$ fournit exactement les vecteurs qu'il faut mettre dans l'inégalité de Cauchy-Schwarz. Physiquement, si trois fils passent par des trous percés en $A$, $B$, $C$ dans une table, portent sous la table des masses égales et sont noués ensemble au point $M$, chacun tire le nœud avec une force de même intensité, dirigée de $M$ vers $A$, $B$ ou $C$ : l'équilibre, où la somme des forces $-\nabla f(M)$ est nulle, est atteint au point de Fermat. Lorsque l'un des angles du triangle atteint ou dépasse $\frac{2\pi}{3}$, on peut montrer que le minimum est atteint au sommet correspondant, où $f$ n'est pas dérivable ; ce cas n'est pas traité ici.
- id: "ma-22-36"
  feuille: "f-ma-22"
  numero: 36
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [ouverts du plan, fonctions de classe C1, plan tangent, extrema, "problèmes géométriques d'optimisation"]
  noeuds: [tr-ouverts, gd-classe-ck, gd-differentielle, fq-points-critiques]
  notions: [ouvert, plan-tangent, point-critique, extremum-local]
  page_enonce: 9
  page_corrige: 39
  enonce: |
    *Les triangles circonscrits d'aire minimale.* On considère l'ensemble 
    $$U = \Big\{(x, y) \in \Big]{-\frac{\pi}{2}}, \frac{\pi}{2}\Big[^{2} \ \Big|\ x < 0 < y \ \text{ et } \ y - x > \frac{\pi}{2}\Big\}$$
     et la fonction $f : (x, y) \mapsto \tan y - \tan x + \tan(x - y)$.

    **1.** Représenter $U$, montrer que c'est un ouvert, et que $f$ est de classe $\mathcal{C}^{1}$ sur $U$.

    **2.** Montrer que $f$ admet un unique point critique dans $U$, et le déterminer.

    **3.** Montrer que $\tan t \geqslant \sqrt{3} + 4\big(t - \frac{\pi}{3}\big)$ pour tout $t \in \big]0, \frac{\pi}{2}\big[$. En posant, pour $(x, y) \in U$, $a = y$, $b = -x$ et $c = \pi + x - y$, en déduire que $f$ admet en son point critique un minimum global sur $U$, dont on donnera la valeur.

    **4.** Soit $\mathcal{C}$ un cercle de centre $O$ et de rayon $R$, et $T_{1}$, $T_{2}$, $T_{3}$ trois points de $\mathcal{C}$ tels que les angles $\widehat{T_{1}OT_{2}}$, $\widehat{T_{2}OT_{3}}$ et $\widehat{T_{3}OT_{1}}$ mesurent $2a$, $2b$ et $2c$, avec $a$, $b$, $c$ dans $\big]0, \frac{\pi}{2}\big[$ et $a + b + c = \pi$. Les tangentes à $\mathcal{C}$ en ces trois points forment alors un triangle circonscrit à $\mathcal{C}$, et l'on admet que tout triangle circonscrit à $\mathcal{C}$ s'obtient ainsi. Montrer que l'aire de ce triangle vaut $R^{2}(\tan a + \tan b + \tan c)$, et en déduire quels sont les triangles circonscrits à $\mathcal{C}$ dont l'aire est minimale.

    ![Figure](documents/figures/fc4fd433d9a3ce6f.svg)

    Les rayons $OT_{1}$, $OT_{2}$, $OT_{3}$ et les segments, en pointillés, qui joignent $O$ aux sommets découpent le triangle en six triangles rectangles, deux à deux isométriques ; l'angle en $O$ de chacun d'eux est l'un des réels $a$, $b$ ou $c$.
  corrige: |
    **1.** Les contraintes $x > -\frac{\pi}{2}$ et $y - x > \frac{\pi}{2}$ entraînent $y > 0$, et les contraintes $y < \frac{\pi}{2}$ et $y - x > \frac{\pi}{2}$ entraînent $x < 0$. Ainsi 
    $$U = \Big\{(x, y) \ \Big|\ x > -\frac{\pi}{2},\ y < \frac{\pi}{2},\ y - x > \frac{\pi}{2}\Big\}$$
     est l'intérieur du triangle de sommets $\big({-\frac{\pi}{2}}, 0\big)$, $\big(0, \frac{\pi}{2}\big)$ et $\big({-\frac{\pi}{2}}, \frac{\pi}{2}\big)$. Chacun des trois demi-plans est un ouvert. Pour $\Pi = \{(x, y) \mid y - x > \frac{\pi}{2}\}$, par exemple, soit $a = (x_{0}, y_{0}) \in \Pi$ et $r = \frac{1}{2}\big(y_{0} - x_{0} - \frac{\pi}{2}\big) > 0$ ; pour $M = (x, y) \in B(a, r)$, la proposition 1 donne $|x - x_{0}| < r$ et $|y - y_{0}| < r$, donc 
    $$y - x - \frac{\pi}{2} > \Big(y_{0} - x_{0} - \frac{\pi}{2}\Big) - 2r = 0,$$
     et $B(a, r) \subset \Pi$. Les deux autres demi-plans se traitent de même, et $\boxed{U \text{ est un ouvert}}$, comme intersection de trois ouverts (proposition 2 (iii)). Sur $U$, on a $x \in \left]-\frac{\pi}{2}, 0\right[$, $y \in \left]0, \frac{\pi}{2}\right[$ et $x - y \in \left]-\pi, -\frac{\pi}{2}\right[$, intervalles sur lesquels $\tan$ est de classe $\mathcal{C}^{1}$ : par la proposition 6, $\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ sur } U}$.

    ![Figure](documents/figures/5e5aa4e8905918b4.svg)

    L'ouvert $U$ est le triangle coloré, bords exclus, dans le coin supérieur gauche du carré $\left]-\frac{\pi}{2}, \frac{\pi}{2}\right[^{2}$, au-dessus de la droite $y = x + \frac{\pi}{2}$ ; le point rouge est le point critique $\big({-\frac{\pi}{3}}, \frac{\pi}{3}\big)$ trouvé à la question 2.

    **2.** Avec $\tan' = 1 + \tan^{2}$, on trouve 
    $$\frac{\partial f}{\partial x}(x, y) = -\big(1 + \tan^{2}x\big) + \big(1 + \tan^{2}(x - y)\big) = \tan^{2}(x - y) - \tan^{2}x, \qquad \frac{\partial f}{\partial y}(x, y) = \tan^{2}y - \tan^{2}(x - y).$$
     Posons $a = y$, $b = -x$ et $c = \pi + x - y$ : ce sont trois réels de $\left]0, \frac{\pi}{2}\right[$, de somme $\pi$, et, par imparité et $\pi$-périodicité de $\tan$, $\tan x = -\tan b$ et $\tan(x - y) = \tan c$. Un point de $U$ est donc critique si et seulement si $\tan^{2}a = \tan^{2}b = \tan^{2}c$. Comme $\tan$ est strictement positive sur $\left]0, \frac{\pi}{2}\right[$ et injective, cela équivaut à $a = b = c$, puis, avec $a + b + c = \pi$, à $a = b = c = \frac{\pi}{3}$. Le point obtenu est bien dans $U$, puisque $y - x = \frac{2\pi}{3} > \frac{\pi}{2}$ : 
    $$\boxed{\text{l'unique point critique de } f \text{ est } \Big({-\frac{\pi}{3}}, \frac{\pi}{3}\Big), \text{ où } f \text{ vaut } \sqrt{3} + \sqrt{3} + \tan\Big({-\frac{2\pi}{3}}\Big) = 3\sqrt{3}}$$

    **3.** Soit $h(t) = \tan t - \sqrt{3} - 4\big(t - \frac{\pi}{3}\big)$ sur $\left]0, \frac{\pi}{2}\right[$. Alors 
    $$h'(t) = 1 + \tan^{2}t - 4 = (\tan t - \sqrt{3})(\tan t + \sqrt{3}),$$
     qui est strictement négatif sur $\left]0, \frac{\pi}{3}\right[$ et strictement positif sur $\left]\frac{\pi}{3}, \frac{\pi}{2}\right[$. La fonction $h$ décroît strictement puis croît strictement, et s'annule en $\frac{\pi}{3}$ : 
    $$\boxed{\tan t \geqslant \sqrt{3} + 4\Big(t - \frac{\pi}{3}\Big) \text{ pour tout } t \in \Big]0, \frac{\pi}{2}\Big[, \text{ avec égalité seulement pour } t = \frac{\pi}{3}}$$
     C'est la position de la courbe de la fonction convexe $\tan$ au-dessus de sa tangente en $\frac{\pi}{3}$ (chapitre 9, théorème 10). Pour $(x, y) \in U$, la question 2 donne $f(x, y) = \tan a + \tan b + \tan c$, et en sommant les trois inégalités, 
    $$f(x, y) \geqslant 3\sqrt{3} + 4(a + b + c - \pi) = 3\sqrt{3},$$
     avec égalité si et seulement si $a = b = c = \frac{\pi}{3}$, c'est-à-dire au point critique : 
    $$\boxed{f \text{ admet en } \Big({-\frac{\pi}{3}}, \frac{\pi}{3}\Big) \text{ un minimum global strict sur } U, \text{ égal à } 3\sqrt{3}}$$
     Une grille fine de $U$ le confirme ✓.

    **4.** Soit $V$ le point d'intersection des tangentes en $T_{1}$ et $T_{2}$. Une tangente au cercle est orthogonale au rayon : les triangles $OT_{1}V$ et $OT_{2}V$ sont rectangles en $T_{1}$ et $T_{2}$, ont la même hypoténuse $OV$, et $OT_{1} = OT_{2} = R$. Par le théorème de Pythagore, $T_{1}V = T_{2}V$ : ils sont isométriques, et leurs angles en $O$ sont égaux. Comme $(OV)$ est la bissectrice de l'angle $\widehat{T_{1}OT_{2}}$, qui mesure $2a$, chacun mesure $a$, et 
    $$T_{1}V = R\tan a, \qquad \text{aire}(OT_{1}V) = \text{aire}(OT_{2}V) = \frac{R \cdot R\tan a}{2}.$$
     Les six triangles rectangles ainsi obtenus, deux pour chacun des trois sommets, recouvrent le triangle circonscrit sans se chevaucher, comme le montre la figure de l'énoncé, d'où 
    $$\boxed{\text{aire} = 2 \times \frac{R^{2}}{2}(\tan a + \tan b + \tan c) = R^{2}(\tan a + \tan b + \tan c)}$$
     Réciproquement, si $a$, $b$, $c$ sont dans $\left]0, \frac{\pi}{2}\right[$, de somme $\pi$, le point $(x, y) = (-b, a)$ appartient à $U$, car $y - x = a + b = \pi - c > \frac{\pi}{2}$, et $c = \pi + x - y$ : l'aire vaut $R^{2}f(x, y)$. Par la question 3, l'aire d'un triangle circonscrit à $\mathcal{C}$ est au moins $3\sqrt{3}\,R^{2}$, avec égalité si et seulement si $a = b = c = \frac{\pi}{3}$. Dans le quadrilatère $OT_{1}VT_{2}$, les angles en $T_{1}$ et $T_{2}$ sont droits et l'angle en $O$ mesure $2a$ : l'angle du triangle en $V$ mesure $\pi - 2a$, et de même aux deux autres sommets. Les trois angles valent $\frac{\pi}{3}$ exactement quand $a = b = c = \frac{\pi}{3}$ : 
    $$\boxed{\text{les triangles circonscrits d'aire minimale sont les triangles équilatéraux circonscrits, d'aire } 3\sqrt{3}\,R^{2}}$$
     Pour le triangle de la figure de l'énoncé, avec $R = 1$, l'aire vaut $\tan 50^{\circ} + 2\tan 65^{\circ} \approx 5{,}481$, contre $3\sqrt{3} \approx 5{,}196$ pour le triangle équilatéral ✓.

    *Remarque.* L'inégalité de la question 3, sommée sur trois angles de somme $\pi$, n'est autre que l'inégalité de Jensen (chapitre 9, proposition 7) pour la fonction convexe $\tan$ : 
    $$\frac{1}{3}(\tan a + \tan b + \tan c) \geqslant \tan\frac{a + b + c}{3} = \sqrt{3}.$$
     L'étude en deux variables a désigné le candidat, la convexité a prouvé qu'il était le bon ; c'est le même partage des rôles que dans les exercices 30 et 32.
- id: "ma-22-37"
  feuille: "f-ma-22"
  numero: 37
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [optimisation et probabilités]
  noeuds: [p-espace, fq-points-critiques]
  notions: []
  page_enonce: 10
  page_corrige: 41
  enonce: |
    *Des dés qui donnent tous la même face.* Soit $n \geqslant 2$ un entier.

    **1.** Montrer que $t^{n} + (1 - t)^{n} \geqslant 2^{1 - n}$ pour tout $t \in [0, 1]$, avec égalité si et seulement si $t = \frac{1}{2}$.

    **2.** On note $T = \{(x, y) \in \mathbb{R}^{2} \mid x \geqslant 0,\ y \geqslant 0,\ x + y \leqslant 1\}$ et $\varphi(x, y) = x^{n} + y^{n} + (1 - x - y)^{n}$. Déterminer les points critiques de $\varphi$ à l'intérieur de $T$.

    **3.** Montrer que $\varphi(x, y) \geqslant 3^{1 - n}$ pour tout $(x, y) \in T$, avec égalité seulement en $\big(\frac{1}{3}, \frac{1}{3}\big)$. On pourra, à $x$ fixé, utiliser la première question.

    **4.** Soit $X_{1}$, …, $X_{n}$ des variables aléatoires mutuellement indépendantes et de même loi, à valeurs dans $\{1, 2, 3\}$. Montrer que 
    $$\mathrm{P}(X_{1} = X_{2} = \cdots = X_{n}) \geqslant \frac{1}{3^{n - 1}},$$
     avec égalité si et seulement si la loi commune est la loi uniforme. Interpréter ce résultat pour $n$ lancers d'un dé à trois faces, éventuellement truqué, et énoncer le résultat analogue que donne la première question pour une pièce.

    Les deux derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** Soit $\varphi(t) = t^{n} + (1 - t)^{n}$ sur $[0, 1]$. Sa dérivée est $\varphi'(t) = n\big(t^{n-1} - (1 - t)^{n-1}\big)$. Comme $n - 1 \geqslant 1$, la fonction $u \mapsto u^{n-1}$ est strictement croissante sur $\mathbb{R}_{+}$, et $\varphi'(t)$ a le signe de $t - (1 - t) = 2t - 1$ : $\varphi$ décroît strictement sur $\big[0, \frac{1}{2}\big]$ et croît strictement sur $\big[\frac{1}{2}, 1\big]$. D'où 
    $$\boxed{t^{n} + (1 - t)^{n} \geqslant \varphi\Big(\frac{1}{2}\Big) = \frac{2}{2^{n}} = 2^{1-n}, \text{ avec égalité si et seulement si } t = \frac{1}{2}}$$

    **2.** Sur $\mathbb{R}^{2}$, la fonction polynomiale $\varphi$ a pour dérivées partielles 
    $$\frac{\partial \varphi}{\partial x}(x, y) = n\big(x^{n-1} - (1 - x - y)^{n-1}\big) \qquad\text{et}\qquad \frac{\partial \varphi}{\partial y}(x, y) = n\big(y^{n-1} - (1 - x - y)^{n-1}\big).$$
     À l'intérieur de $T$, les trois réels $x$, $y$ et $z = 1 - x - y$ sont strictement positifs, et un point critique vérifie $x^{n-1} = y^{n-1} = z^{n-1}$, donc $x = y = z$ par stricte croissance de $u \mapsto u^{n-1}$ sur $\mathbb{R}_{+}$. Avec $x + y + z = 1$ : 
    $$\boxed{\text{le seul point critique intérieur à } T \text{ est } \Big(\frac{1}{3}, \frac{1}{3}\Big)}$$

    **3.** Soit $(x, y) \in T$ et $\sigma = 1 - x \geqslant 0$, de sorte que $0 \leqslant y \leqslant \sigma$. Si $\sigma > 0$, on écrit $y = \sigma t$ avec $t \in [0, 1]$, et la question 1 donne 
    $$y^{n} + (1 - x - y)^{n} = \sigma^{n}\big(t^{n} + (1 - t)^{n}\big) \geqslant 2^{1-n}\sigma^{n},$$
     avec égalité si et seulement si $y = \frac{\sigma}{2}$ ; si $\sigma = 0$, alors $y = 0$ et les deux membres sont nuls. Dans tous les cas, $\varphi(x, y) \geqslant \psi(x)$, avec $\psi(x) = x^{n} + 2^{1-n}(1 - x)^{n}$. Or 
    $$\psi'(x) = n\Big(x^{n-1} - 2^{1-n}(1 - x)^{n-1}\Big) = n\Big(x^{n-1} - \Big(\frac{1 - x}{2}\Big)^{n-1}\Big)$$
     a le signe de $x - \frac{1 - x}{2} = \frac{3x - 1}{2}$ : $\psi$ décroît strictement sur $\big[0, \frac{1}{3}\big]$ et croît strictement sur $\big[\frac{1}{3}, 1\big]$, et 
    $$\psi(x) \geqslant \psi\Big(\frac{1}{3}\Big) = \frac{1}{3^{n}} + \frac{1}{2^{n-1}} \cdot \frac{2^{n}}{3^{n}} = \frac{3}{3^{n}} = 3^{1-n}.$$
     Ainsi $\varphi(x, y) \geqslant 3^{1-n}$, avec égalité si et seulement si $x = \frac{1}{3}$ et $y = \frac{1 - x}{2} = \frac{1}{3}$ : 
    $$\boxed{\varphi(x, y) \geqslant 3^{1-n} \text{ sur } T, \text{ avec égalité seulement en } \Big(\frac{1}{3}, \frac{1}{3}\Big)}$$
     On retrouve le point critique de la question 2, ce qu'une grille de $T$ confirme pour $n \in \{2, 3, 4, 5\}$ ✓.

    **4.** On note $p_{k} = \mathrm{P}(X_{1} = k)$ pour $k \in \{1, 2, 3\}$, probabilités positives de somme $1$. L'événement $(X_{1} = \cdots = X_{n})$ est la réunion des trois événements deux à deux incompatibles $(X_{1} = k, \ldots, X_{n} = k)$, et, par l'indépendance mutuelle (chapitre 21, proposition 15) et l'égalité des lois, 
    $$\mathrm{P}(X_{1} = \cdots = X_{n}) = \sum_{k=1}^{3} \mathrm{P}(X_{1} = k) \cdots \mathrm{P}(X_{n} = k) = p_{1}^{n} + p_{2}^{n} + p_{3}^{n} = \varphi(p_{1}, p_{2}),$$
     puisque $p_{3} = 1 - p_{1} - p_{2}$. Le point $(p_{1}, p_{2})$ appartient à $T$, et la question 3 donne 
    $$\boxed{\mathrm{P}(X_{1} = X_{2} = \cdots = X_{n}) \geqslant \frac{1}{3^{n-1}}, \text{ avec égalité si et seulement si } p_{1} = p_{2} = p_{3} = \frac{1}{3}}$$
     c'est-à-dire si et seulement si la loi commune est uniforme. Pour $n$ lancers d'un dé à trois faces, la probabilité que tous les lancers donnent la même face est donc la plus petite quand le dé est équilibré : tout truquage, quel qu'il soit, l'augmente. Avec le dé de loi $\big(\frac{1}{2}, \frac{1}{4}, \frac{1}{4}\big)$ et $n = 3$, elle vaut $\frac{1}{8} + \frac{1}{64} + \frac{1}{64} = \frac{5}{32} \approx 0{,}156$, contre $\frac{1}{9} \approx 0{,}111$ pour le dé équilibré ✓. Pour une pièce qui donne pile avec la probabilité $p$, la première question, avec $t = p$, donne de même 
    $$\boxed{\mathrm{P}(\text{les } n \text{ lancers donnent le même côté}) = p^{n} + (1 - p)^{n} \geqslant \frac{1}{2^{n-1}}}$$
     avec égalité si et seulement si $p = \frac{1}{2}$, c'est-à-dire pour une pièce équilibrée.

    *À retenir.* Pour $n = 2$, la quantité $p_{1}^{2} + p_{2}^{2} + p_{3}^{2}$ est la probabilité que deux tirages indépendants coïncident, et l'inégalité $p_{1}^{2} + p_{2}^{2} + p_{3}^{2} \geqslant \frac{1}{3}$ découle directement de l'inégalité de Cauchy-Schwarz du chapitre 19, appliquée à $(p_{1}, p_{2}, p_{3})$ et $(1, 1, 1)$. Pour $n \geqslant 3$, la méthode de la question 3, qui fixe une variable puis minimise en l'autre, est celle des exercices 32 et 33, sur le même triangle $T$.
- id: "ma-22-38"
  feuille: "f-ma-22"
  numero: 38
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [fonctions de classe C1, lois de groupe différentiables]
  noeuds: [gd-classe-ck, a-groupe, gd-differentielle]
  notions: []
  page_enonce: 10
  page_corrige: 43
  enonce: |
    Soit $\ast$ une loi de groupe sur $\mathbb{R}$, d'élément neutre $e$, telle que la fonction $f : (x, y) \mapsto x \ast y$ soit de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$. Montrer qu'il existe une bijection $\varphi : \mathbb{R} \to \mathbb{R}$, de classe $\mathcal{C}^{1}$ et dont la réciproque est de classe $\mathcal{C}^{1}$, telle que 
    $$\forall x, y \in \mathbb{R}, \qquad \varphi(x \ast y) = \varphi(x) + \varphi(y).$$
     En particulier, le groupe $(\mathbb{R}, \ast)$ est commutatif et isomorphe à $(\mathbb{R}, +)$. On pourra dériver la relation d'associativité $(x \ast y) \ast z = x \ast (y \ast z)$ par rapport à $z$. Comparer avec l'exercice 11 de la feuille du chapitre 11, où une loi de groupe sur $\left]-1, 1\right[$ était obtenue par transport de l'addition.
  corrige: |
    *Idée.* On cherche $\varphi$ telle que $\varphi(x \ast y) = \varphi(x) + \varphi(y)$. En dérivant cette relation par rapport à $y$, puis en faisant $y = e$, on trouve que $\varphi'(x)$ doit valoir $\varphi'(e) \big/ \frac{\partial f}{\partial y}(x, e)$ : cela impose $\varphi(x) = \int_{e}^{x} \frac{\mathrm{d} t}{\rho(t)}$, avec $\rho(t) = \frac{\partial f}{\partial y}(t, e)$, en normalisant par $\varphi'(e) = 1$. Il reste à prouver que ce candidat convient, et la relation d'associativité dérivée par rapport à $z$ fournit exactement l'identité nécessaire.

    *Notations.* On note $\frac{\partial f}{\partial y}$ la dérivée partielle de $f$ par rapport à sa seconde variable, et $y^{-1}$ le symétrique de $y$ pour la loi $\ast$. Pour $x$ fixé, la fonction $y \mapsto x \ast y = f(x, y)$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, de dérivée $y \mapsto \frac{\partial f}{\partial y}(x, y)$, continue par la proposition 4 (iv).

    **Étape 1 : l'associativité dérivée.** Soit $x$ et $y$ fixés. Pour tout réel $z$, on a 
    $$f\big(f(x, y), z\big) = f\big(x, f(y, z)\big).$$
     Le membre de gauche est une application partielle de $f$, de dérivée $\frac{\partial f}{\partial y}\big(x \ast y, z\big)$ par rapport à $z$. Le membre de droite est $f \circ \gamma$, avec l'arc $\gamma(z) = \big(x, f(y, z)\big)$, de classe $\mathcal{C}^{1}$ et de vecteur dérivé $\big(0, \frac{\partial f}{\partial y}(y, z)\big)$ ; la règle de la chaîne (théorème 3) en donne la dérivée. Ainsi 
    $$\frac{\partial f}{\partial y}\big(x \ast y, z\big) = \frac{\partial f}{\partial y}\big(x, y \ast z\big)\,\frac{\partial f}{\partial y}(y, z), \qquad\text{et, pour } z = e, \qquad \boxed{\rho(x \ast y) = \frac{\partial f}{\partial y}(x, y)\,\rho(y)}$$
     où l'on a posé $\rho(t) = \frac{\partial f}{\partial y}(t, e)$ et utilisé $y \ast e = y$.

    **Étape 2 : $\rho$ ne s'annule pas.** Comme $e \ast z = z$ pour tout $z$, la dérivée de $z \mapsto f(e, z)$ vaut $1$, et $\rho(e) = \frac{\partial f}{\partial y}(e, e) = 1$. La relation encadrée, avec $x = y^{-1}$, donne 
    $$1 = \rho(e) = \frac{\partial f}{\partial y}\big(y^{-1}, y\big)\,\rho(y),$$
     donc $\rho(y) \neq 0$ pour tout réel $y$. La fonction $\rho$ est continue sur $\mathbb{R}$ (proposition 4 (iv)), ne s'annule pas et vaut $1$ en $e$ : par le théorème des valeurs intermédiaires (chapitre 8, théorème 8), $\boxed{\rho > 0 \text{ sur } \mathbb{R}}$.

    **Étape 3 : construction de $\varphi$.** La fonction $\frac{1}{\rho}$ est continue sur $\mathbb{R}$ ; par le théorème fondamental de l'analyse (chapitre 18, théorème 6), 
    $$\boxed{\varphi(x) = \int_{e}^{x} \frac{\mathrm{d} t}{\rho(t)}}$$
     définit une fonction de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, avec $\varphi' = \frac{1}{\rho} > 0$ et $\varphi(e) = 0$.

    **Étape 4 : $\varphi$ transforme $\ast$ en $+$.** Soit $x$ fixé et $\psi(y) = \varphi(x \ast y) - \varphi(x) - \varphi(y)$. Par la dérivée d'une composée (chapitre 9, théorème 2) et l'étape 1, 
    $$\psi'(y) = \frac{\frac{\partial f}{\partial y}(x, y)}{\rho(x \ast y)} - \frac{1}{\rho(y)} = \frac{\frac{\partial f}{\partial y}(x, y)}{\frac{\partial f}{\partial y}(x, y)\,\rho(y)} - \frac{1}{\rho(y)} = 0,$$
     le quotient étant licite puisque $\rho(x \ast y) \neq 0$, ce qui impose aussi $\frac{\partial f}{\partial y}(x, y) \neq 0$. La fonction $\psi$ est donc constante sur l'intervalle $\mathbb{R}$, égale à $\psi(e) = \varphi(x) - \varphi(x) - \varphi(e) = 0$ : 
    $$\boxed{\varphi(x \ast y) = \varphi(x) + \varphi(y) \quad\text{pour tous réels } x, y}$$

    **Étape 5 : $\varphi$ est une bijection de $\mathbb{R}$ sur $\mathbb{R}$.** Comme $\varphi' > 0$, la fonction $\varphi$ est strictement croissante (chapitre 9, théorème 7), donc injective. Son image $J = \varphi(\mathbb{R})$ est un intervalle (chapitre 8, théorème 9), qui contient $\varphi(e) = 0$. Il est stable par addition, puisque $\varphi(x) + \varphi(y) = \varphi(x \ast y)$, et par passage à l'opposé, puisque $\varphi(x) + \varphi(x^{-1}) = \varphi(e) = 0$. Comme $\varphi$ n'est pas constante, $J$ contient un réel non nul, donc, quitte à prendre son opposé, un réel $r > 0$ ; il contient alors $mr$ et $-mr$ pour tout entier $m \geqslant 1$, donc l'intervalle $[-mr, mr]$, et, $r$ étant strictement positif, la réunion de ces intervalles est $\mathbb{R}$. Ainsi $J = \mathbb{R}$, et $\varphi$ est une bijection de $\mathbb{R}$ sur $\mathbb{R}$. Sa réciproque est continue (chapitre 8, théorème 11), et, comme $\varphi'$ ne s'annule pas, elle est dérivable, de dérivée $\big(\varphi^{-1}\big)' = \frac{1}{\varphi' \circ \varphi^{-1}} = \rho \circ \varphi^{-1}$ (chapitre 9, théorème 3), qui est continue : 
    $$\boxed{\varphi \text{ est une bijection de classe } \mathcal{C}^{1} \text{ de } \mathbb{R} \text{ sur } \mathbb{R}, \text{ de réciproque de classe } \mathcal{C}^{1}, \text{ et } \varphi(x \ast y) = \varphi(x) + \varphi(y)}$$

    **Conséquences.** Pour tous $x$, $y$, on a $\varphi(x \ast y) = \varphi(x) + \varphi(y) = \varphi(y \ast x)$, et l'injectivité de $\varphi$ donne $x \ast y = y \ast x$ : le groupe $(\mathbb{R}, \ast)$ est commutatif, et $\varphi$ est un isomorphisme de $(\mathbb{R}, \ast)$ sur $(\mathbb{R}, +)$. Autrement dit, $x \ast y = \varphi^{-1}\big(\varphi(x) + \varphi(y)\big)$ : *toute loi de groupe de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ est obtenue en transportant l'addition*, ce qui est la réciproque de la construction de l'exercice 11 de la feuille du chapitre 11. Sur un exemple, pour la loi $x \ast y = \mathrm{argsh}(\operatorname{sh} x + \operatorname{sh} y)$, d'élément neutre $0$, on trouve $\rho(t) = \frac{1}{\operatorname{ch} t}$ et $\varphi = \operatorname{sh}$ ✓. La démonstration vaut sans changement sur un intervalle ouvert à la place de $\mathbb{R}$ : pour la loi $x \ast y = \frac{x + y}{1 + xy}$ de l'exercice 11 du chapitre 11, sur $\left]-1, 1\right[$, on trouve $\rho(t) = 1 - t^{2}$ et $\varphi(x) = \frac{1}{2}\ln\frac{1 + x}{1 - x}$, qui est la réciproque de la tangente hyperbolique, celle-là même qui avait servi au transport ✓.

    *À retenir.* L'hypothèse de classe $\mathcal{C}^{1}$ est exactement la bonne : si une bijection $\varphi$ de classe $\mathcal{C}^{1}$, de réciproque de classe $\mathcal{C}^{1}$, vérifie $\varphi(x \ast y) = \varphi(x) + \varphi(y)$, alors $f(x, y) = \varphi^{-1}\big(\varphi(x) + \varphi(y)\big)$ est de classe $\mathcal{C}^{1}$. Ainsi la loi $x \ast y = \sqrt[3]{x^{3} + y^{3}}$, transportée de l'addition par $x \mapsto x^{3}$, est une loi de groupe commutative sur $\mathbb{R}$, mais elle n'est pas de classe $\mathcal{C}^{1}$ : l'application partielle $x \mapsto \sqrt[3]{x^{3} - 1}$ n'est pas dérivable en $1$, et l'on ne peut pas l'écrire avec un $\varphi$ régulier.
