  enonce: |
    Soit $a > 0$ et $\Gamma = \big\{(x, y) \in \mathbb{R}^{2} \mid x^{3} + y^{3} + x + y = 4\big\}$. Déterminer les extrema locaux et globaux de la restriction à $\Gamma$ de la fonction $f : (x, y) \mapsto \exp(axy)$. On pourra se souvenir de l'exercice 22 de la feuille du chapitre 5.
  corrige: |
    *Idée.* La courbe $\Gamma$ s'écrit $h(x) + h(y) = 4$, avec $h(t) = t^{3} + t$, bijection croissante de $\mathbb{R}$ sur $\mathbb{R}$ (feuille du chapitre 5, exercice 22) : c'est le graphe de la fonction $Y = h^{-1} \circ (4 - h)$. Le long de $\Gamma$, $f$ devient une fonction d'une variable, $x \mapsto \exp\big(a\,x\,Y(x)\big)$, et, comme $a > 0$ et que l'exponentielle est strictement croissante, il suffit d'étudier $P(x) = x\,Y(x)$.

    **La courbe $\Gamma$ est un graphe.** La fonction $h$ est dérivable, de dérivée $h'(t) = 3t^{2} + 1 > 0$ : elle est strictement croissante, de limites $\pm\infty$ en $\pm\infty$, donc bijective de $\mathbb{R}$ sur $\mathbb{R}$ (chapitre 8, théorème 11), et sa réciproque est dérivable, de dérivée $\frac{1}{h' \circ h^{-1}}$, continue (chapitre 9, théorème 3) : $h^{-1}$ est de classe $\mathcal{C}^{1}$. Un point $(x, y)$ appartient à $\Gamma$ si et seulement si $h(y) = 4 - h(x)$, c'est-à-dire si et seulement si 
    $$y = Y(x), \qquad\text{avec}\qquad Y(x) = h^{-1}\big(4 - h(x)\big).$$
     La fonction $Y$ est de classe $\mathcal{C}^{1}$ et strictement décroissante sur $\mathbb{R}$, comme composée de $h^{-1}$, croissante, et de $4 - h$, décroissante. En dérivant $h\big(Y(x)\big) = 4 - h(x)$, on obtient $h'\big(Y(x)\big)\,Y'(x) = -h'(x)$, d'où 
    $$Y'(x) = -\frac{3x^{2} + 1}{3Y(x)^{2} + 1}.$$

    **Extrema locaux sur $\Gamma$ et extrema de $P$.** Pour $x \in \mathbb{R}$, $f\big(x, Y(x)\big) = \mathrm{e}^{aP(x)}$, avec $P(x) = x\,Y(x)$, et $u \mapsto \mathrm{e}^{au}$ est strictement croissante. Montrons que $f_{|\Gamma}$ admet un maximum local (respectivement un minimum local) en $m_{0} = \big(x_{0}, Y(x_{0})\big)$ si et seulement si $P$ en admet un en $x_{0}$. Si $P(x) \leqslant P(x_{0})$ pour $|x - x_{0}| < r$, alors, pour $M = \big(x, Y(x)\big) \in \Gamma \cap B(m_{0}, r)$, on a $|x - x_{0}| \leqslant \lVert M - m_{0} \rVert < r$ (proposition 1), donc $f(M) \leqslant f(m_{0})$. Réciproquement, si $f(M) \leqslant f(m_{0})$ pour $M \in \Gamma \cap B(m_{0}, r)$, la continuité de $Y$ en $x_{0}$ fournit $\delta \in \left]0, \frac{r}{2}\right]$ tel que $|Y(x) - Y(x_{0})| < \frac{r}{2}$ pour $|x - x_{0}| < \delta$ ; pour ces $x$, la proposition 1 donne $\lVert (x, Y(x)) - m_{0} \rVert \leqslant |x - x_{0}| + |Y(x) - Y(x_{0})| < r$, donc $P(x) \leqslant P(x_{0})$. Il en va de même pour les minima, et, plus simplement, pour les extrema globaux.

    **Étude de $P$.** La fonction $P$ est dérivable, et 
    $$P'(x) = Y(x) + x\,Y'(x) = \frac{Y(x)\big(3Y(x)^{2} + 1\big) - x(3x^{2} + 1)}{3Y(x)^{2} + 1} = \frac{k\big(Y(x)\big) - k(x)}{3Y(x)^{2} + 1}, \qquad k(t) = 3t^{3} + t.$$
     Comme $k$ est strictement croissante, $P'(x)$ a le signe de $Y(x) - x$. La fonction $x \mapsto Y(x) - x$ est strictement décroissante, et elle s'annule si et seulement si $Y(x) = x$, c'est-à-dire $2h(x) = 4$, soit $x = 1$, puisque $h(1) = 2$ et que $h$ est injective. Ainsi $P' > 0$ sur $\left]-\infty, 1\right[$ et $P' < 0$ sur $\left]1, +\infty\right[$ : $P$ croît strictement sur $\left]-\infty, 1\right]$ et décroît strictement sur $\left[1, +\infty\right[$. Elle admet en $1$ un maximum global strict, $P(1) = 1 \times Y(1) = 1$, et aucun autre extremum local : en $x_{0} \neq 1$, on a $P'(x_{0}) \neq 0$, ce qui exclut un extremum local en ce point intérieur (chapitre 9, proposition 2).

    **Comportement à l'infini.** Quand $x$ tend vers $+\infty$, $4 - h(x)$ tend vers $-\infty$, donc $Y(x)$ aussi, par le théorème 11 du chapitre 8, et $P(x) = x\,Y(x)$ tend vers $-\infty$ ; quand $x$ tend vers $-\infty$, $Y(x)$ tend vers $+\infty$, et $P(x)$ tend encore vers $-\infty$. La fonction $f_{|\Gamma}$, à valeurs strictement positives, prend donc des valeurs aussi proches de $0$ que l'on veut, sans jamais l'atteindre. 
    $$\boxed{f_{|\Gamma} \text{ admet en } (1, 1) \text{ un maximum global strict, égal à } \mathrm{e}^{a}, \text{ et aucun autre extremum local}}$$

    $$\boxed{f_{|\Gamma} \text{ n'a pas de minimum, et } \inf_{\Gamma} f = 0}$$
     Le calcul numérique du maximum de $xy$ sur $\Gamma$ donne $1{,}000\,000$, atteint en $x = 1$, avec un seul changement de sens de variation ✓.

    ![Figure](documents/figures/876e781c8abd9f38.svg)

    La courbe $\Gamma$, symétrique par rapport à la première bissectrice, ne rencontre l'hyperbole $xy = 1$ qu'au point $(1, 1)$, où elle lui est tangente, et reste partout ailleurs dans la région $xy < 1$ ; elle coupe en revanche les deux branches de l'hyperbole $xy = -1$, et tous les niveaux inférieurs. Au point $(1, 1)$, le gradient de $f$, égal à $a\,\mathrm{e}^{a}(1, 1)$, est orthogonal à $\Gamma$, dont la tangente est dirigée par $\big(1, Y'(1)\big) = (1, -1)$.

    *À retenir.* C'est la situation de la remarque qui clôt la section 22.5.3 : en un extremum de $f$ le long d'une courbe, le gradient est orthogonal à la courbe, sans être nul, et la ligne de niveau de $f$ est tangente à la courbe. La seconde année en fera la méthode des extrema sous contrainte ; ici, le paramétrage de $\Gamma$ comme un graphe, rendu possible par la bijectivité de $t \mapsto t^{3} + t$, a suffi. Le signe de $a$ compte : pour $a < 0$, le même calcul fait de $(1, 1)$ un minimum global, égal à $\mathrm{e}^{a}$, et $f$ n'a plus de maximum sur $\Gamma$, puisque $axy$ tend alors vers $+\infty$ aux deux bouts de la courbe.

