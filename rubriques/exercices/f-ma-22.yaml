  page_corrige: 25
  enonce: |
    Déterminer les extrema locaux et globaux des fonctions suivantes, définies sur $\mathbb{R}^{2}$.

    **(a)** $f(x, y) = 3x^{2} - 2xy + 3y^{2} - 8x + 8y$

    **(b)** $f(x, y) = x^{3} - y^{2} - x$

    **(c)** $f(x, y) = \cos x + y^{2}$

    **(d)** $f(x, y) = \exp\big(x\operatorname{Arctan} y\big)$

    **(e)** $f(x, y) = \mathrm{e}^{3x}y^{2} + \mathrm{e}^{x}y$
  corrige: |
    Les cinq fonctions sont de classe $\mathcal{C}^{1}$ sur l'ouvert $\mathbb{R}^{2}$ (proposition 6) : d'après le théorème 5, leurs extrema locaux sont à chercher parmi les points critiques, dont on étudie ensuite la nature par le signe de l'accroissement $\Delta(h, k) = f(x_{0} + h, y_{0} + k) - f(x_{0}, y_{0})$, comme dans la méthode de la section 22.5.2.

    **(a)** Les points critiques sont les solutions du système $6x - 2y - 8 = 0$, $-2x + 6y + 8 = 0$. La première équation donne $y = 3x - 4$, et la seconde devient $16x - 16 = 0$ : l'unique point critique est $(1, -1)$, où $f$ vaut $-8$. Comme $f$ est polynomiale de degré $2$, $\Delta$ est exactement sa partie quadratique : 
    $$\Delta(h, k) = 3h^{2} - 2hk + 3k^{2} = 2(h^{2} + k^{2}) + (h - k)^{2},$$
     positif, et nul seulement pour $h = k = 0$. 
    $$\boxed{f \text{ admet en } (1, -1) \text{ un minimum global strict, égal à } -8, \text{ et aucun autre extremum local}}$$
     La fonction n'a pas de maximum : $f(x, 0) = 3x^{2} - 8x$ tend vers $+\infty$.

    **(b)** On a $\frac{\partial f}{\partial x} = 3x^{2} - 1$ et $\frac{\partial f}{\partial y} = -2y$ : les points critiques sont $\big(\frac{1}{\sqrt{3}}, 0\big)$ et $\big(-\frac{1}{\sqrt{3}}, 0\big)$. En un point $(x_{0}, 0)$ tel que $3x_{0}^{2} = 1$, on développe : 
    $$\Delta(h, k) = (x_{0} + h)^{3} - (x_{0} + h) - x_{0}^{3} + x_{0} - k^{2} = (3x_{0}^{2} - 1)h + 3x_{0}h^{2} + h^{3} - k^{2} = h^{2}(3x_{0} + h) - k^{2}.$$

    • En $\big(\frac{1}{\sqrt{3}}, 0\big)$, $\Delta(h, k) = h^{2}(\sqrt{3} + h) - k^{2}$. Pour $0 < |h| < \sqrt{3}$, $\Delta(h, 0) > 0$, et pour $k \neq 0$, $\Delta(0, k) = -k^{2} < 0$ : toute boule centrée en ce point contient des points où $f$ est plus grande et d'autres où elle est plus petite. C'est un col.

    • En $\big(-\frac{1}{\sqrt{3}}, 0\big)$, $\Delta(h, k) = h^{2}(h - \sqrt{3}) - k^{2}$. Pour $|h| < \sqrt{3}$, les deux termes sont négatifs, et $\Delta(h, k) = 0$ impose $h = 0$ et $k = 0$ : sur la boule de rayon $\sqrt{3}$, $\Delta < 0$ hors du centre. C'est un maximum local strict, de valeur $f\big(-\frac{1}{\sqrt{3}}, 0\big) = -\frac{1}{3\sqrt{3}} + \frac{1}{\sqrt{3}} = \frac{2\sqrt{3}}{9} \approx 0{,}385$.

    $$\boxed{\text{maximum local strict } \tfrac{2\sqrt{3}}{9} \text{ en } \Big(-\tfrac{1}{\sqrt{3}}, 0\Big), \text{ non global} ; \quad \text{col en } \Big(\tfrac{1}{\sqrt{3}}, 0\Big)}$$
     Le maximum n'est pas global, puisque $f(x, 0) = x^{3} - x$ tend vers $+\infty$ quand $x$ tend vers $+\infty$, et il n'y a pas de minimum global, puisque $f(0, y) = -y^{2}$ tend vers $-\infty$.

    **(c)** On a $\nabla f(x, y) = (-\sin x, 2y)$ : les points critiques sont les points $(m\pi, 0)$, $m \in \mathbb{Z}$, en nombre infini. Comme $\cos x \geqslant -1$ et $y^{2} \geqslant 0$, on a $f \geqslant -1$, avec égalité si et seulement si $\cos x = -1$ et $y = 0$, c'est-à-dire en $\big((2p + 1)\pi, 0\big)$, $p \in \mathbb{Z}$. En $(2p\pi, 0)$, où $f$ vaut $1$, on a $\Delta(h, 0) = \cos h - 1 < 0$ pour $0 < |h| < 2\pi$ et $\Delta(0, k) = k^{2} > 0$ pour $k \neq 0$ : c'est un col. 
    $$\boxed{\text{minimum global } -1 \text{ en } \big((2p + 1)\pi, 0\big) ; \quad \text{col en } (2p\pi, 0), \quad p \in \mathbb{Z}}$$
     Ces minima sont stricts au sens local, puisque deux d'entre eux sont distants de $2\pi$ ; il n'y a pas de maximum, $f(0, y)$ tendant vers $+\infty$.

    **(d)** On a $\frac{\partial f}{\partial x}(x, y) = \operatorname{Arctan} y \; f(x, y)$ et $\frac{\partial f}{\partial y}(x, y) = \frac{x}{1 + y^{2}}\,f(x, y)$, et l'exponentielle ne s'annule pas : le gradient est nul si et seulement si $\operatorname{Arctan} y = 0$ et $x = 0$, c'est-à-dire en $(0, 0)$, où $f$ vaut $1$. Comme l'exponentielle est strictement croissante, $f(x, y) - 1$ a le signe de $x\operatorname{Arctan} y$. Pour $t \neq 0$, $t\operatorname{Arctan} t > 0$ et $t\operatorname{Arctan}(-t) = -t\operatorname{Arctan} t < 0$ : le long des deux bissectrices, $f$ prend, aussi près que l'on veut de l'origine, des valeurs supérieures et inférieures à $1$. 
    $$\boxed{f \text{ n'admet aucun extremum local}}$$
     Elle est d'ailleurs à valeurs dans $\left]0, +\infty\right[$, minorée par $0$ sans atteindre cette borne.

    **(e)** On factorise les dérivées partielles : 
    $$\frac{\partial f}{\partial x}(x, y) = 3\mathrm{e}^{3x}y^{2} + \mathrm{e}^{x}y = \mathrm{e}^{x}y\,(3\mathrm{e}^{2x}y + 1), \qquad \frac{\partial f}{\partial y}(x, y) = 2\mathrm{e}^{3x}y + \mathrm{e}^{x} = \mathrm{e}^{x}(2\mathrm{e}^{2x}y + 1).$$
     La seconde ne s'annule que pour $y = -\frac{1}{2}\mathrm{e}^{-2x}$, et la première que pour $y = 0$ ou $y = -\frac{1}{3}\mathrm{e}^{-2x}$ ; ces conditions sont incompatibles, puisque $\mathrm{e}^{-2x} \neq 0$. 
    $$\boxed{f \text{ n'a aucun point critique, donc aucun extremum local}}$$
     Elle n'est pas majorée, puisque $f(0, y) = y^{2} + y$ tend vers $+\infty$, ni minorée, puisque 
    $$f\Big(x, -\frac{1}{2}\mathrm{e}^{-2x}\Big) = -\frac{1}{4}\mathrm{e}^{-x} \xrightarrow[x \to -\infty]{} -\infty.$$
     Tous ces résultats ont été confirmés par sympy, et la nature des points critiques par l'étude de $\Delta$ sur une grille ✓.

    *Piège.* En (d), l'erreur la plus répandue est de conclure à un minimum en regardant seulement les axes, où $f$ vaut constamment $1$ : les applications partielles ne voient pas les directions obliques, où se trouvent les valeurs inférieures. En (c), il faut penser que $\sin x = 0$ a une infinité de solutions, et que les points critiques n'ont pas tous la même nature.
- id: "ma-22-24"
  feuille: "f-ma-22"
  numero: 24
  partie: "Extrema"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [extrema]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 6
  page_corrige: 26
  enonce: |
    Déterminer le maximum et le minimum de la fonction $f : (x, y) \mapsto x^{2} - y^{2} - 2y$ sur le disque fermé $\overline{B}(0, 1)$, ainsi que les points où ils sont atteints. On montrera d'abord que ces extrema ne peuvent pas être atteints à l'intérieur du disque.
  corrige: |
    *À l'intérieur du disque.* On a $\nabla f(x, y) = (2x, -2y - 2)$, qui ne s'annule qu'en $(0, -1)$. Ce point est sur le cercle unité, et non dans le disque ouvert $B(0, 1)$. Supposons que la restriction de $f$ au disque fermé atteigne son maximum en un point $a$ de $B(0, 1)$. Alors $f(M) \leqslant f(a)$ pour tout $M$ de l'ouvert $B(0, 1)$ : $f$, de classe $\mathcal{C}^{1}$ sur cet ouvert, y admet un maximum local en $a$, et le théorème 5 donne $\nabla f(a) = 0$, ce qui est impossible. Il en va de même pour le minimum : 
    $$\boxed{\text{le maximum et le minimum de } f \text{ sur } \overline{B}(0, 1), \text{ s'ils existent, sont atteints sur le cercle unité}}$$

    *Sur le cercle.* Tout point du cercle s'écrit $(\cos t, \sin t)$, et, avec $s = \sin t \in [-1, 1]$, 
    $$f(\cos t, \sin t) = \cos^{2}t - \sin^{2}t - 2\sin t = 1 - 2s - 2s^{2} = p(s).$$
     Le trinôme $p$, de dérivée $-2 - 4s$, croît sur $\big[-1, -\frac{1}{2}\big]$ et décroît sur $\big[-\frac{1}{2}, 1\big]$ : il atteint son maximum $p\big(-\frac{1}{2}\big) = \frac{3}{2}$, et son minimum sur $[-1, 1]$ en l'une des bornes, $p(-1) = 1$ ou $p(1) = -3$, donc $-3$.

    *Conclusion.* On compare maintenant tout point du disque au cercle, ce qui établit l'existence des extrema sans faire appel à un théorème général. Pour $(x, y) \in \overline{B}(0, 1)$, on a $x^{2} \leqslant 1 - y^{2}$ et $y \in [-1, 1]$, donc 
    $$f(x, y) \leqslant (1 - y^{2}) - y^{2} - 2y = p(y) \leqslant \frac{3}{2}, \qquad f(x, y) \geqslant -y^{2} - 2y = 1 - (y + 1)^{2} \geqslant 1 - 4 = -3.$$
     La première inégalité est une égalité si et seulement si $x^{2} = 1 - y^{2}$ et $y = -\frac{1}{2}$, c'est-à-dire en $\big(\pm\frac{\sqrt{3}}{2}, -\frac{1}{2}\big)$ ; la seconde si et seulement si $x = 0$ et $y = 1$. 
    $$\boxed{\max_{\overline{B}(0, 1)} f = \frac{3}{2}, \text{ atteint en } \Big(\frac{\sqrt{3}}{2}, -\frac{1}{2}\Big) \text{ et } \Big(-\frac{\sqrt{3}}{2}, -\frac{1}{2}\Big) ; \qquad \min_{\overline{B}(0, 1)} f = -3, \text{ atteint en } (0, 1)}$$
     Une grille de $801 \times 1601$ points du disque, en coordonnées polaires, donne un maximum $1{,}49999$ et un minimum $-3$ ✓.

    ![Figure](documents/figures/cf1e1fad24ceebab.svg)

    Les lignes de niveau de $f$ sont les hyperboles $x^{2} - (y + 1)^{2} = c - 1$, en pétrole, de centre le point critique $(0, -1)$, en ocre, qui est un col situé sur le bord. Le maximum et le minimum sont atteints aux points où le cercle est tangent à une ligne de niveau, celle de niveau $\frac{3}{2}$ en deux points, celle de niveau $-3$ au sommet ; en ces points, le gradient, en carmin, est porté par le rayon, comme dans le dernier exemple de la section 22.5.3.

    *Piège.* L'erreur la plus répandue est d'annoncer « l'unique point critique $(0, -1)$ est le minimum » : il n'est pas à l'intérieur du disque, et $f(0, -1) = 1$ n'est ni le maximum ni le minimum. Inversement, le maximum et le minimum ne sont pas des points critiques de $f$ : le théorème 5 ne s'applique qu'à l'intérieur, et le bord demande une étude à part.
- id: "ma-22-25"
  feuille: "f-ma-22"
  numero: 25
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema]
  noeuds: [fq-points-critiques]
  notions: [point-critique, extremum-local]
  page_enonce: 6
  page_corrige: 27
  enonce: |
    Déterminer les extrema locaux et globaux des fonctions suivantes.

    **(a)** $f(x, y) = y^{2} - x^{2} + \dfrac{x^{4}}{2}$ sur $\mathbb{R}^{2}$.

    **(b)** $f(x, y) = x^{4} + y^{4} - 4(x - y)^{2}$ sur $\mathbb{R}^{2}$ ; pour l'étude globale, on pourra d'abord établir l'inégalité 
    $$x^{4} + y^{4} \geqslant \frac{1}{8}(x - y)^{4}.$$

    **(c)** $f(x, y) = 2x^{3} + 6xy - 3y^{2} + 2$ sur $\mathbb{R}^{2}$.

    **(d)** $f(x, y) = y\big(x^{2} + (\ln y)^{2}\big)$ sur $\mathbb{R} \times \left]0, +\infty\right[$.
  corrige: |
    Les quatre fonctions sont de classe $\mathcal{C}^{1}$ sur un ouvert : $\mathbb{R}^{2}$, ou le demi-plan ouvert $\mathbb{R} \times \left]0, +\infty\right[$ en (d). On applique la méthode de la section 22.5.2.

    **(a)** On a $\nabla f(x, y) = \big(2x(x^{2} - 1), 2y\big)$ : les points critiques sont $(0, 0)$, $(1, 0)$ et $(-1, 0)$. On met $f$ sous forme canonique en $x^{2}$ : 
    $$f(x, y) = y^{2} + \frac{1}{2}(x^{2} - 1)^{2} - \frac{1}{2} \geqslant -\frac{1}{2},$$
     avec égalité si et seulement si $y = 0$ et $x^{2} = 1$. En $(0, 0)$, où $f$ vaut $0$, on a $f(t, 0) = t^{2}\big(\frac{t^{2}}{2} - 1\big) < 0$ pour $0 < |t| < \sqrt{2}$ et $f(0, t) = t^{2} > 0$ pour $t \neq 0$ : c'est un col. 
    $$\boxed{\text{minimum global } -\tfrac{1}{2} \text{ en } (1, 0) \text{ et } (-1, 0) ; \quad \text{col en } (0, 0) ; \quad \text{pas de maximum}}$$
     puisque $f(0, y) = y^{2}$ tend vers $+\infty$.

    ![Figure](documents/figures/c26fddcb46815dc4.svg)

    Les lignes de niveau $-0{,}4$ et $-0{,}25$ entourent chacun des deux minima, en carmin ; la ligne de niveau $0$, en forme de huit, se croise au col, en ocre, où deux régions de valeurs négatives se touchent ; au-delà, les lignes de niveau $0{,}3$ et $0{,}8$ font le tour des trois points critiques.

    **(b)** Les points critiques vérifient $4x^{3} - 8(x - y) = 0$ et $4y^{3} + 8(x - y) = 0$. En ajoutant, $x^{3} = (-y)^{3}$, donc $y = -x$ par stricte croissance de la fonction cube ; la première équation devient $4x^{3} - 16x = 4x(x^{2} - 4) = 0$. Les points critiques sont $(0, 0)$, $(2, -2)$ et $(-2, 2)$, où $f$ vaut $0$, $-32$ et $-32$.

    *Étude globale.* L'inégalité $a^{2} + b^{2} \geqslant \frac{1}{2}(a + b)^{2}$, qui équivaut à $(a - b)^{2} \geqslant 0$, appliquée deux fois, donne 
    $$x^{4} + y^{4} \geqslant \frac{1}{2}(x^{2} + y^{2})^{2} \geqslant \frac{1}{2}\Big(\frac{(x - y)^{2}}{2}\Big)^{2} = \frac{1}{8}(x - y)^{4},$$
     la seconde inégalité venant de $x^{2} + (-y)^{2} \geqslant \frac{1}{2}(x - y)^{2}$ ; les deux sont des égalités si et seulement si $x^{2} = y^{2}$ et $x = -y$, c'est-à-dire $y = -x$. Avec $w = (x - y)^{2}$, il vient 
    $$f(x, y) \geqslant \frac{w^{2}}{8} - 4w = \frac{(w - 16)^{2}}{8} - 32 \geqslant -32,$$
     avec égalité si et seulement si $y = -x$ et $(x - y)^{2} = 4x^{2} = 16$, c'est-à-dire en $(2, -2)$ et $(-2, 2)$. En $(0, 0)$, on a $f(t, t) = 2t^{4} > 0$ et $f(t, -t) = 2t^{4} - 16t^{2} = 2t^{2}(t^{2} - 8) < 0$ pour $0 < |t| < 2\sqrt{2}$ : c'est un col. 
    $$\boxed{\text{minimum global } -32 \text{ en } (2, -2) \text{ et } (-2, 2) ; \quad \text{col en } (0, 0) ; \quad \text{pas de maximum}}$$
     puisque $f(t, t) = 2t^{4}$ tend vers $+\infty$. Une grille de $[-4, 4]^{2}$ donne bien le minimum $-32$ ✓.

    **(c)** On a $\nabla f(x, y) = (6x^{2} + 6y, 6x - 6y)$ : les points critiques vérifient $y = x$ et $x^{2} + x = 0$, ce sont $(0, 0)$ et $(-1, -1)$, où $f$ vaut $2$ et $3$. En $(0, 0)$, $f(x, 0) - 2 = 2x^{3}$ change de signe avec $x$ : il n'y a pas d'extremum. En $(-1, -1)$, le développement donne 
    $$\Delta(h, k) = -6h^{2} + 6hk - 3k^{2} + 2h^{3} = -3\big(h^{2} + (h - k)^{2}\big) + 2h^{3}.$$
     Comme $2h^{3} \leqslant 2|h|\,h^{2}$, on obtient $\Delta(h, k) \leqslant -h^{2}(3 - 2|h|) - 3(h - k)^{2}$. Pour $|h| < \frac{3}{2}$, ce majorant est négatif, et nul seulement si $h = 0$ et $h = k$. Sur la boule de centre $(-1, -1)$ et de rayon $\frac{3}{2}$, où $|h| \leqslant \lVert (h, k) \rVert < \frac{3}{2}$, on a donc $\Delta < 0$ hors du centre. 
    $$\boxed{\text{maximum local strict } 3 \text{ en } (-1, -1), \text{ non global} ; \quad \text{col en } (0, 0)}$$
     Ce maximum n'est pas global, puisque $f(x, 0) = 2x^{3} + 2$ tend vers $+\infty$, et il n'y a pas de minimum, puisque $f(x, 0)$ tend vers $-\infty$ en $-\infty$.

    **(d)** L'ensemble $\mathbb{R} \times \left]0, +\infty\right[$ est un demi-plan ouvert, et 
    $$\frac{\partial f}{\partial x}(x, y) = 2xy, \qquad \frac{\partial f}{\partial y}(x, y) = x^{2} + (\ln y)^{2} + 2\ln y.$$
     Comme $y > 0$, la première s'annule si et seulement si $x = 0$, et la seconde devient $\ln y\,(\ln y + 2) = 0$ : les points critiques sont $(0, 1)$ et $(0, \mathrm{e}^{-2})$. Comme $y > 0$, on a $f \geqslant 0$, avec égalité si et seulement si $x = 0$ et $\ln y = 0$ : $f$ admet en $(0, 1)$ un minimum global strict, nul. En $(0, \mathrm{e}^{-2})$, où $f$ vaut $4\mathrm{e}^{-2}$, on a d'une part $f(h, \mathrm{e}^{-2}) = \mathrm{e}^{-2}(h^{2} + 4) > 4\mathrm{e}^{-2}$ pour $h \neq 0$. D'autre part, la fonction $q : s \mapsto f(0, s) = s(\ln s)^{2}$ a pour dérivée $\ln s\,(\ln s + 2)$, strictement positive sur $\left]0, \mathrm{e}^{-2}\right[$ et strictement négative sur $\left]\mathrm{e}^{-2}, 1\right[$ : $q$ admet en $\mathrm{e}^{-2}$ un maximum strict sur $\left]0, 1\right[$, et $f(0, s) < 4\mathrm{e}^{-2}$ pour $s \neq \mathrm{e}^{-2}$ voisin de $\mathrm{e}^{-2}$. 
    $$\boxed{\text{minimum global } 0 \text{ en } (0, 1) ; \quad \text{col en } (0, \mathrm{e}^{-2}) ; \quad \text{pas de maximum}}$$
     puisque $f(x, 1) = x^{2}$ tend vers $+\infty$.

    *Piège.* En (c), l'erreur la plus répandue est de négliger le terme $2h^{3}$ sans le contrôler : c'est la majoration $|h|^{3} \leqslant \lVert (h, k) \rVert\,h^{2}$, et la restriction à une boule de rayon $\frac{3}{2}$, qui permettent de conclure, comme dans l'exemple $x^{3} + y^{3} - 3xy$ du cours. En (b), l'inégalité donnée par l'énoncé fait tout le travail global, car l'étude locale ne dit rien sur le comportement loin des points critiques.
- id: "ma-22-26"
  feuille: "f-ma-22"
  numero: 26
  partie: "Extrema"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [extrema, fonctions de classe C1]
  noeuds: [fq-points-critiques, gd-classe-ck]
  notions: [point-critique, extremum-local]
  page_enonce: 6
  page_corrige: 29
  enonce: |
    On considère la fonction $f : (x, y) \mapsto x\,\mathrm{e}^{y} + y\,\mathrm{e}^{x}$, définie sur $\mathbb{R}^{2}$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ et qu'elle admet un unique point critique, que l'on déterminera. On pourra poser $s = y - x$.

    **2.** Montrer que $f$ n'admet aucun extremum local. On pourra étudier $f$ le long des deux droites de directions $(1, 1)$ et $(1, -1)$ qui passent par le point critique.
  corrige: |
    **1.** La fonction $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ par la proposition 6, comme somme de produits de fonctions de classe $\mathcal{C}^{1}$, et 
    $$\frac{\partial f}{\partial x}(x, y) = \mathrm{e}^{y} + y\,\mathrm{e}^{x}, \qquad \frac{\partial f}{\partial y}(x, y) = x\,\mathrm{e}^{y} + \mathrm{e}^{x}.$$
     Soit $(x, y)$ un point critique, et $s = y - x$. En divisant la première équation par $\mathrm{e}^{x}$ et la seconde par $\mathrm{e}^{y}$, on obtient 
    $$y = -\mathrm{e}^{y - x} = -\mathrm{e}^{s}, \qquad x = -\mathrm{e}^{x - y} = -\mathrm{e}^{-s}, \qquad\text{donc}\qquad s = y - x = \mathrm{e}^{-s} - \mathrm{e}^{s} = -2\operatorname{sh} s.$$
     La fonction $s \mapsto s + 2\operatorname{sh} s$ a pour dérivée $1 + 2\operatorname{ch} s > 0$ : elle est strictement croissante sur $\mathbb{R}$, et s'annule en $0$, donc seulement en $0$. Ainsi $s = 0$ et $x = y = -1$. Réciproquement, les deux dérivées partielles valent $\mathrm{e}^{-1} - \mathrm{e}^{-1} = 0$ en $(-1, -1)$. 
    $$\boxed{\text{l'unique point critique de } f \text{ est } (-1, -1), \text{ où } f(-1, -1) = -\frac{2}{\mathrm{e}}}$$

    **2.** Le long de la droite de direction $(1, 1)$, on a 
    $$\Delta(t, t) = f(-1 + t, -1 + t) + \frac{2}{\mathrm{e}} = 2(t - 1)\mathrm{e}^{t - 1} + \frac{2}{\mathrm{e}} = \frac{2}{\mathrm{e}}\big((t - 1)\mathrm{e}^{t} + 1\big).$$
     La fonction $q : t \mapsto (t - 1)\mathrm{e}^{t} + 1$ a pour dérivée $t\,\mathrm{e}^{t}$ : elle est strictement décroissante sur $\left]-\infty, 0\right]$ et strictement croissante sur $[0, +\infty[$, et $q(0) = 0$, donc $q(t) > 0$ pour $t \neq 0$. Le long de la droite de direction $(1, -1)$, 
    $$\Delta(t, -t) = (t - 1)\mathrm{e}^{-1 - t} - (t + 1)\mathrm{e}^{-1 + t} + \frac{2}{\mathrm{e}} = \frac{1}{\mathrm{e}}\big(-(\mathrm{e}^{t} + \mathrm{e}^{-t}) - t(\mathrm{e}^{t} - \mathrm{e}^{-t}) + 2\big) = -\frac{2}{\mathrm{e}}\big(\operatorname{ch} t - 1 + t\operatorname{sh} t\big),$$
     qui est strictement négatif pour $t \neq 0$, puisque $\operatorname{ch} t > 1$ et $t\operatorname{sh} t > 0$. Toute boule centrée en $(-1, -1)$ contient donc des points où $f$ est strictement supérieure à $-\frac{2}{\mathrm{e}}$ et d'autres où elle lui est strictement inférieure : $(-1, -1)$ est un col. Comme c'est le seul point critique, le théorème 5 conclut : 
    $$\boxed{f \text{ n'admet aucun extremum local sur } \mathbb{R}^{2}}$$

    ![Figure](documents/figures/ae56bcfb9c751cef.svg)

    L'accroissement $\Delta = f - f(-1, -1)$ est strictement positif le long de la droite de direction $(1, 1)$, en pétrole, et strictement négatif le long de la droite de direction $(1, -1)$, en ocre : le point critique est un minimum dans une direction et un maximum dans l'autre, comme le col de $x^{2} - y^{2}$ dans le cours. Une recherche numérique des zéros du gradient, à partir de $81$ points de départ, ne trouve que $(-1, -1)$ ✓.

    *À retenir.* La fonction est symétrique, $f(x, y) = f(y, x)$, ce qui explique que le point critique soit sur la première bissectrice et que les deux directions naturelles d'étude soient $(1, 1)$ et $(1, -1)$. Le changement d'inconnue $s = y - x$ ramène le système à une équation d'une variable, dont l'unicité de la solution vient de la stricte monotonie (chapitre 9, théorème 7).
