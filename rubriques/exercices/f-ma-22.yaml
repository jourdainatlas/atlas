  enonce: |
    On pose $f(x, y) = \sin(x^{2} - y^{2})$ et $F(x, y) = f(x + y, x - y)$ pour $(x, y) \in \mathbb{R}^{2}$. Calculer les dérivées partielles de $F$ de deux façons : en simplifiant d'abord l'expression de $F(x, y)$, puis à l'aide du théorème 4 du cours, sans simplifier. Vérifier que les résultats concordent.
  corrige: |
    Pour éviter toute confusion entre les variables de $f$ et celles de $F$, on écrit $f(X, Y) = \sin(X^{2} - Y^{2})$, de sorte que 
    $$\frac{\partial f}{\partial X}(X, Y) = 2X\cos(X^{2} - Y^{2}), \qquad \frac{\partial f}{\partial Y}(X, Y) = -2Y\cos(X^{2} - Y^{2}).$$

    *Première méthode : en simplifiant.* On a $(x + y)^{2} - (x - y)^{2} = 4xy$, donc $F(x, y) = \sin(4xy)$, et la dérivation d'une composée de fonctions d'une variable (proposition 6 (iii)) donne 
    $$\boxed{\frac{\partial F}{\partial x}(x, y) = 4y\cos(4xy), \qquad \frac{\partial F}{\partial y}(x, y) = 4x\cos(4xy)}$$

    *Seconde méthode : par le théorème 4.* On pose $\varphi(x, y) = x + y$ et $\psi(x, y) = x - y$, de dérivées partielles $1$, $1$ et $1$, $-1$. Au point $(X, Y) = (x + y, x - y)$, on a $X^{2} - Y^{2} = 4xy$, et le théorème 4 donne 
    $$\frac{\partial F}{\partial x}(x, y) = \frac{\partial f}{\partial X}(X, Y) \times 1 + \frac{\partial f}{\partial Y}(X, Y) \times 1 = \big(2(x + y) - 2(x - y)\big)\cos(4xy) = 4y\cos(4xy),$$

    $$\frac{\partial F}{\partial y}(x, y) = \frac{\partial f}{\partial X}(X, Y) \times 1 + \frac{\partial f}{\partial Y}(X, Y) \times (-1) = \big(2(x + y) + 2(x - y)\big)\cos(4xy) = 4x\cos(4xy).$$
     Les deux méthodes concordent ✓. La première est plus rapide ici, parce que $f$ est connue explicitement et que la composée se simplifie ; la seconde est la seule possible lorsque $f$ est une fonction inconnue, comme dans les exercices 14, 17 et 20.

    *Piège.* Dans la seconde méthode, l'erreur la plus répandue est d'évaluer $\frac{\partial f}{\partial X}$ en $(x, y)$, ce qui donnerait $2x\cos(x^{2} - y^{2})$ : le résultat ne concorde plus, et c'est précisément ce que la comparaison des deux méthodes permet de détecter.
- id: "ma-22-16"
  feuille: "f-ma-22"
  numero: 16
  partie: "Dérivées partielles et composées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, continuité, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck, c-sequentielle]
  notions: [gradient]
  page_enonce: 4
  page_corrige: 16
  enonce: |
    On pose $f(x, y) = \dfrac{x^{3}}{x^{2} + y^{2}}$ pour $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est continue en $(0, 0)$ et calculer ses dérivées partielles en ce point.

    **2.** Montrer que $f$ admet en $(0, 0)$ une dérivée selon tout vecteur $u = (u_{1}, u_{2})$, et la calculer.

    **3.** En déduire, sans calculer les dérivées partielles de $f$ hors de l'origine, que $f$ n'est pas de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.
  corrige: |
    **1.** Pour $(x, y) \neq (0, 0)$, on a $x^{2} \leqslant x^{2} + y^{2}$, donc 
    $$|f(x, y) - f(0, 0)| = |x|\,\frac{x^{2}}{x^{2} + y^{2}} \leqslant |x| \leqslant \lVert (x, y) \rVert$$
     par la proposition 1 (i), inégalité encore vraie en $(0, 0)$. Pour $\varepsilon > 0$, le réel $\delta = \varepsilon$ convient dans la définition de la continuité : 
    $$\boxed{f \text{ est continue en } (0, 0)}$$
     Les applications partielles en $(0, 0)$ sont $t \mapsto f(t, 0)$, qui vaut $\frac{t^{3}}{t^{2}} = t$ pour $t \neq 0$ et $0$ en $0$, c'est-à-dire $t \mapsto t$, et $t \mapsto f(0, t)$, identiquement nulle. Elles sont dérivables en $0$, de dérivées $1$ et $0$ : 
    $$\boxed{\frac{\partial f}{\partial x}(0, 0) = 1, \qquad \frac{\partial f}{\partial y}(0, 0) = 0}$$

    **2.** Soit $u = (u_{1}, u_{2})$. Si $u = 0$, la fonction $t \mapsto f(0 + t\,0)$ est constante et $D_{0}f(0, 0) = 0$. Si $u \neq 0$, pour $t \neq 0$, 
    $$f(tu) = \frac{t^{3}u_{1}^{3}}{t^{2}(u_{1}^{2} + u_{2}^{2})} = t\,\frac{u_{1}^{3}}{u_{1}^{2} + u_{2}^{2}},$$
     égalité encore vraie pour $t = 0$. La fonction $t \mapsto f(tu)$ est linéaire, donc dérivable en $0$, et 
    $$\boxed{D_{u}f(0, 0) = \frac{u_{1}^{3}}{u_{1}^{2} + u_{2}^{2}} \quad\text{pour } u \neq 0, \qquad D_{0}f(0, 0) = 0}$$
     Pour $u = (1, 0)$ et $u = (0, 1)$, on retrouve les dérivées partielles $1$ et $0$ ✓.

    **3.** Raisonnons par l'absurde. Si $f$ était de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, la proposition 8 donnerait, pour tout vecteur $u$, 
    $$D_{u}f(0, 0) = \langle \nabla f(0, 0), u \rangle = u_{1}\,\frac{\partial f}{\partial x}(0, 0) + u_{2}\,\frac{\partial f}{\partial y}(0, 0) = u_{1}.$$
     Or, pour $u = (1, 1)$, la question 2 donne $D_{u}f(0, 0) = \frac{1}{2}$, et non $1$. 
    $$\boxed{f \text{ n'est pas de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     On n'a calculé aucune dérivée partielle hors de l'origine : c'est le caractère non linéaire de $u \mapsto D_{u}f(0, 0)$ qui interdit la classe $\mathcal{C}^{1}$. La fonction $f$ est pourtant continue, et admet en $(0, 0)$ des dérivées selon tous les vecteurs.

    *À retenir.* La relation $f(tu) = t f(u)$ montre que la surface $z = f(x, y)$ est formée de droites passant par l'origine : c'est un cône de sommet $O$, comme le graphe de la norme dans le cours, et il n'a pas de plan tangent en $O$. Une fonction de classe $\mathcal{C}^{1}$ a des dérivées directionnelles qui dépendent *linéairement* de la direction (proposition 8) ; toute dépendance non linéaire, comme ici ou dans la remarque qui suit la proposition 8, est un certificat de non-régularité. L'exercice 19 reviendra sur ces fonctions homogènes.
- id: "ma-22-17"
  feuille: "f-ma-22"
  numero: 17
  partie: "Dérivées partielles et composées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [règle de la chaîne, dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [gradient, derivee-partielle]
  page_enonce: 4
  page_corrige: 17
  enonce: |
    À l'aide du changement de variables défini par $u = x + y$ et $v = x - y$, déterminer les fonctions $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ qui vérifient, en tout point $(x, y)$ de $\mathbb{R}^{2}$, 
    $$\text{(a)}\ \ \frac{\partial f}{\partial x}(x, y) - \frac{\partial f}{\partial y}(x, y) = 1 \qquad\text{puis}\qquad \text{(b)}\ \ \frac{\partial f}{\partial x}(x, y) - \frac{\partial f}{\partial y}(x, y) = 8x + 16y.$$
  corrige: |
    On suit la méthode de la section 22.4.5, avec le changement de variables de la proposition 11. Les relations $u = x + y$ et $v = x - y$ équivalent à $x = \frac{u + v}{2}$ et $y = \frac{u - v}{2}$ : l'application $(u, v) \mapsto \big(\frac{u + v}{2}, \frac{u - v}{2}\big)$ est une bijection de $\mathbb{R}^{2}$ sur lui-même. Soit $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et 
    $$F(u, v) = f\Big(\frac{u + v}{2}, \frac{u - v}{2}\Big), \qquad\text{de sorte que}\qquad f(x, y) = F(x + y, x - y).$$
     Par le théorème 4, $F$ est de classe $\mathcal{C}^{1}$, et 
    $$\frac{\partial F}{\partial v}(u, v) = \frac{1}{2}\,\frac{\partial f}{\partial x}(x, y) - \frac{1}{2}\,\frac{\partial f}{\partial y}(x, y), \qquad\text{où}\qquad (x, y) = \Big(\frac{u + v}{2}, \frac{u - v}{2}\Big).$$
     Comme tout point $(u, v)$ de $\mathbb{R}^{2}$ correspond à un point $(x, y)$, une équation portant sur $\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y}$ en tout point $(x, y)$ se traduit par une équation sur $\frac{\partial F}{\partial v}$ en tout point $(u, v)$, et réciproquement.

    **(a)** L'équation équivaut à $\frac{\partial F}{\partial v}(u, v) = \frac{1}{2}$ pour tout $(u, v)$. La fonction $G : (u, v) \mapsto F(u, v) - \frac{v}{2}$ vérifie alors $\frac{\partial G}{\partial v} = 0$ ; à $u$ fixé, $v \mapsto G(u, v)$ est de dérivée nulle sur l'intervalle $\mathbb{R}$, donc constante (chapitre 9, théorème 7) : $G(u, v) = G(u, 0) = g(u)$, avec $g(u) = F(u, 0) = f\big(\frac{u}{2}, \frac{u}{2}\big)$, de classe $\mathcal{C}^{1}$ par la règle de la chaîne. Ainsi $F(u, v) = \frac{v}{2} + g(u)$, et, en revenant aux variables $x$ et $y$, 
    $$\boxed{f(x, y) = \frac{x - y}{2} + g(x + y), \qquad g \text{ de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}}$$
     Réciproquement, une telle fonction est de classe $\mathcal{C}^{1}$ (proposition 6), et 
    $$\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = \Big(\frac{1}{2} + g'(x + y)\Big) - \Big(-\frac{1}{2} + g'(x + y)\Big) = 1 \quad \checkmark$$

    **(b)** Au point $(x, y)$ associé à $(u, v)$, le second membre vaut $8x + 16y = 4(u + v) + 8(u - v) = 12u - 4v$. L'équation équivaut donc à $\frac{\partial F}{\partial v}(u, v) = 6u - 2v$ pour tout $(u, v)$. La fonction $(u, v) \mapsto F(u, v) - 6uv + v^{2}$ a une dérivée partielle nulle par rapport à $v$, et, comme en (a), $F(u, v) = 6uv - v^{2} + g(u)$, avec $g$ de classe $\mathcal{C}^{1}$. Puisque $6(x + y)(x - y) - (x - y)^{2} = 5x^{2} + 2xy - 7y^{2}$, 
    $$\boxed{f(x, y) = 5x^{2} + 2xy - 7y^{2} + g(x + y), \qquad g \text{ de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}}$$
     Réciproquement, $\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = \big(10x + 2y + g'(x + y)\big) - \big(2x - 14y + g'(x + y)\big) = 8x + 16y$ ✓.

    *À retenir.* Les solutions de (b) sont la somme d'une solution particulière, $5x^{2} + 2xy - 7y^{2}$, et de la solution générale $g(x + y)$ de l'équation homogène, qui est celle de la proposition 11. C'est la structure des solutions des équations différentielles linéaires du chapitre 6, où la constante d'intégration est remplacée par une fonction arbitraire de $x + y$, quantité constante le long des droites de direction $(1, -1)$.
- id: "ma-22-18"
  feuille: "f-ma-22"
  numero: 18
  partie: "Dérivées partielles et composées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, dérivées partielles, fonctions de classe C1, "problèmes géométriques d'optimisation"]
  noeuds: [gd-differentielle, gd-classe-ck, fq-points-critiques]
  notions: [gradient, derivee-partielle]
  page_enonce: 4
  page_corrige: 18
  enonce: |
    Soit $U = \mathbb{R}^{2} \setminus \{(0, 0)\}$ et $f$ une fonction de classe $\mathcal{C}^{1}$ sur $U$. On dit que $f$ est *radiale* si elle est constante sur chaque cercle de centre $O$. On pose $F(r, \theta) = f(r\cos\theta, r\sin\theta)$ pour $(r, \theta) \in \left]0, +\infty\right[ \times \mathbb{R}$.

    **1.** Justifier que $F$ est de classe $\mathcal{C}^{1}$ et exprimer $\frac{\partial F}{\partial \theta}$ à l'aide des dérivées partielles de $f$.

    **2.** Montrer que $f$ est radiale si et seulement si $x\,\frac{\partial f}{\partial y}(x, y) - y\,\frac{\partial f}{\partial x}(x, y) = 0$ pour tout $(x, y) \in U$, et écrire alors $f$ à l'aide d'une fonction d'une variable.

    **3.** Le cours a résolu la même équation sur le plan privé d'une demi-droite. Expliquer pourquoi il n'est pas nécessaire, ici, de retirer une demi-droite.
  corrige: |
    **1.** L'ensemble $V = \left]0, +\infty\right[ \times \mathbb{R}$ est un ouvert, comme dans la démonstration de la proposition 10. Les fonctions $\varphi(r, \theta) = r\cos\theta$ et $\psi(r, \theta) = r\sin\theta$ sont de classe $\mathcal{C}^{1}$ sur $V$, de dérivées partielles $\cos\theta$, $-r\sin\theta$ et $\sin\theta$, $r\cos\theta$, et le point $\big(\varphi(r, \theta), \psi(r, \theta)\big)$, de norme $r > 0$, appartient à $U$. Le théorème 4 montre que $F$ est de classe $\mathcal{C}^{1}$ sur $V$ et, en notant $(x, y) = (r\cos\theta, r\sin\theta)$, 
    $$\boxed{\frac{\partial F}{\partial \theta}(r, \theta) = -r\sin\theta\,\frac{\partial f}{\partial x}(x, y) + r\cos\theta\,\frac{\partial f}{\partial y}(x, y) = x\,\frac{\partial f}{\partial y}(x, y) - y\,\frac{\partial f}{\partial x}(x, y)}$$
     C'est la formule de la proposition 10, démontrée de la même façon sur $U$ au lieu de $\mathbb{R}^{2}$.

    **2.** *Condition nécessaire.* Supposons $f$ radiale. Pour $r > 0$ fixé, les points $(r\cos\theta, r\sin\theta)$ sont sur le cercle de centre $O$ et de rayon $r$, donc $\theta \mapsto F(r, \theta)$ est constante, et $\frac{\partial F}{\partial \theta}(r, \theta) = 0$. Tout point $(x, y)$ de $U$ s'écrit $(r\cos\theta, r\sin\theta)$ avec $r = \lVert (x, y) \rVert > 0$ et $\theta$ un argument du complexe non nul $x + \mathrm{i} y$ (chapitre 4), et la question 1 donne $x\,\frac{\partial f}{\partial y}(x, y) - y\,\frac{\partial f}{\partial x}(x, y) = 0$.

    *Condition suffisante.* Supposons $x\,\frac{\partial f}{\partial y} - y\,\frac{\partial f}{\partial x} = 0$ sur $U$. La question 1 donne $\frac{\partial F}{\partial \theta} = 0$ sur $V$. Pour $r > 0$ fixé, la fonction $\theta \mapsto F(r, \theta)$ est de dérivée nulle sur l'intervalle $\mathbb{R}$, donc constante (chapitre 9, théorème 7) : $F(r, \theta) = F(r, 0) = f(r, 0)$. Tout point du cercle de rayon $r$ s'écrit $(r\cos\theta, r\sin\theta)$, donc $f$ y vaut $f(r, 0)$ : $f$ est radiale. On a alors, pour tout $(x, y) \in U$, 
    $$\boxed{f(x, y) = g\big(\sqrt{x^{2} + y^{2}}\big), \qquad\text{avec}\qquad g(r) = f(r, 0)}$$
     et $g$ est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$, comme application partielle de $f$, de dérivée $g'(r) = \frac{\partial f}{\partial x}(r, 0)$ continue. Réciproquement, pour toute fonction $g$ de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$, la fonction $(x, y) \mapsto g\big(\lVert (x, y) \rVert\big)$ est de classe $\mathcal{C}^{1}$ sur $U$ par la proposition 6 (iii), puisque la norme y est de classe $\mathcal{C}^{1}$ à valeurs dans $\left]0, +\infty\right[$, et elle est évidemment radiale.

    **3.** Dans l'exemple du cours, on voulait appliquer la méthode de la section 22.4.5, qui demande une *bijection* entre les nouvelles variables et les anciennes. Or $(r, \theta) \mapsto (r\cos\theta, r\sin\theta)$ n'est pas injective sur $\left]0, +\infty\right[ \times \mathbb{R}$, puisque $\theta$ n'est défini qu'à $2\pi$ près ; pour obtenir une bijection, il fallait restreindre $\theta$ à $\left]-\pi, \pi\right[$, et donc retirer de $\mathbb{R}^{2}$ la demi-droite des points d'argument $\pi$. Ici, la fonction $f$ est donnée, et $F$ est définie à partir d'elle : on n'a jamais besoin de remonter de $F$ à $f$, donc l'injectivité ne sert pas. Deux choses seulement sont utilisées : tout point de $U$ est atteint, et, à $r$ fixé, $\theta$ décrit un *intervalle*, ici $\mathbb{R}$ tout entier, ce qui permet d'appliquer le théorème 7 du chapitre 9. Autrement dit, on dérive $f$ le long de chaque cercle, parcouru par l'arc $\theta \mapsto (r\cos\theta, r\sin\theta)$, et ce cercle est tout entier contenu dans $U$.

    ![Figure](documents/figures/f3845084430fec87.svg)

    Pour une fonction radiale, les lignes de niveau sont les cercles de centre $O$, en pétrole. Le gradient, normal aux lignes de niveau (proposition 9), est porté par le rayon, donc orthogonal au vecteur $u_{\theta} = (-\sin\theta, \cos\theta)$ : c'est exactement la condition $\langle \nabla f(M), u_{\theta} \rangle = \frac{1}{r}\frac{\partial F}{\partial \theta} = 0$, c'est-à-dire $x\,\frac{\partial f}{\partial y} - y\,\frac{\partial f}{\partial x} = 0$.

    *Piège.* Le passage de « $f$ radiale » à « $f(x, y) = g\big(\sqrt{x^{2} + y^{2}}\big)$ » n'est pas une formalité : l'erreur la plus répandue est d'oublier de justifier que $g$ est de classe $\mathcal{C}^{1}$. On l'obtient ici gratuitement, car $g$ est une application partielle de $f$.
- id: "ma-22-19"
  feuille: "f-ma-22"
  numero: 19
  partie: "Dérivées partielles et composées"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [règle de la chaîne, dérivées partielles, fonctions de classe C1, équations aux dérivées partielles]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [gradient, derivee-partielle]
  page_enonce: 5
  page_corrige: 19
  enonce: |
    *Fonctions homogènes.* Soit $U = \mathbb{R}^{2} \setminus \{(0, 0)\}$ et $\alpha$ un réel. Une fonction $f$ de classe $\mathcal{C}^{1}$ sur $U$ est dite *homogène de degré $\alpha$* si $f(tx, ty) = t^{\alpha}f(x, y)$ pour tout $(x, y) \in U$ et tout réel $t > 0$.

    **1.** Montrer que, si $f$ est homogène de degré $\alpha$, ses dérivées partielles vérifient la même relation avec l'exposant $\alpha - 1$ : pour tout $(x, y) \in U$ et tout réel $t > 0$, $\frac{\partial f}{\partial x}(tx, ty) = t^{\alpha - 1}\,\frac{\partial f}{\partial x}(x, y)$, et de même pour $\frac{\partial f}{\partial y}$.

    **2.** Montrer que, si $f$ est homogène de degré $\alpha$, elle vérifie la relation d'Euler : 
    $$\forall (x, y) \in U, \qquad x\,\frac{\partial f}{\partial x}(x, y) + y\,\frac{\partial f}{\partial y}(x, y) = \alpha f(x, y).$$

    **3.** Réciproquement, on suppose que $f$ vérifie la relation d'Euler. Pour $(x, y) \in U$ fixé, on pose $\varphi(t) = f(tx, ty)$ pour $t > 0$. Former une équation différentielle vérifiée par $\varphi$ et en déduire que $f$ est homogène de degré $\alpha$.
  corrige: |
    **1.** Fixons $t > 0$. Les fonctions $(x, y) \mapsto tx$ et $(x, y) \mapsto ty$ sont de classe $\mathcal{C}^{1}$ sur $U$, et $(tx, ty) \in U$ pour $(x, y) \in U$. Par le théorème 4, la fonction $(x, y) \mapsto f(tx, ty)$ est de classe $\mathcal{C}^{1}$ sur $U$, de dérivée partielle par rapport à $x$ égale à $t\,\frac{\partial f}{\partial x}(tx, ty)$. Elle coïncide avec $(x, y) \mapsto t^{\alpha}f(x, y)$, dont la dérivée partielle par rapport à $x$ vaut $t^{\alpha}\,\frac{\partial f}{\partial x}(x, y)$. En égalant et en divisant par $t \neq 0$, puis en faisant de même pour $y$ : 
    $$\boxed{\forall (x, y) \in U,\ \forall t > 0, \qquad \frac{\partial f}{\partial x}(tx, ty) = t^{\alpha - 1}\,\frac{\partial f}{\partial x}(x, y), \qquad \frac{\partial f}{\partial y}(tx, ty) = t^{\alpha - 1}\,\frac{\partial f}{\partial y}(x, y)}$$

    *Attention.* On ne dit pas que les dérivées partielles sont « homogènes de degré $\alpha - 1$ » au sens de la définition de l'énoncé, qui exige la classe $\mathcal{C}^{1}$ : les dérivées partielles d'une fonction de classe $\mathcal{C}^{1}$ ne sont que continues. La relation démontrée est exactement celle que demande la question.

    **2.** Fixons $(x, y) \in U$. L'arc $\gamma : t \mapsto (tx, ty)$ est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$, à valeurs dans $U$, de dérivée $(x, y)$. La règle de la chaîne (théorème 3) permet de dériver le membre de gauche de $f(tx, ty) = t^{\alpha}f(x, y)$, et l'on dérive le membre de droite comme une fonction puissance : 
    $$x\,\frac{\partial f}{\partial x}(tx, ty) + y\,\frac{\partial f}{\partial y}(tx, ty) = \alpha\,t^{\alpha - 1}f(x, y).$$
     En $t = 1$, on obtient 
    $$\boxed{x\,\frac{\partial f}{\partial x}(x, y) + y\,\frac{\partial f}{\partial y}(x, y) = \alpha f(x, y)}$$

    **3.** Soit $(x, y) \in U$. Par la règle de la chaîne, comme à la question 2, $\varphi$ est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$ et 
    $$\varphi'(t) = x\,\frac{\partial f}{\partial x}(tx, ty) + y\,\frac{\partial f}{\partial y}(tx, ty).$$
     La relation d'Euler, écrite au point $(tx, ty)$ de $U$, donne $tx\,\frac{\partial f}{\partial x}(tx, ty) + ty\,\frac{\partial f}{\partial y}(tx, ty) = \alpha f(tx, ty)$, c'est-à-dire 
    $$\boxed{t\,\varphi'(t) = \alpha\,\varphi(t) \qquad\text{pour tout } t > 0}$$
     Sur l'intervalle $\left]0, +\infty\right[$, c'est l'équation différentielle linéaire homogène $\varphi' - \frac{\alpha}{t}\varphi = 0$ ; une primitive de $t \mapsto -\frac{\alpha}{t}$ est $-\alpha\ln t$, et le théorème 2 du chapitre 6 donne $\varphi(t) = \lambda\,\mathrm{e}^{\alpha\ln t} = \lambda t^{\alpha}$ pour une constante $\lambda$. En $t = 1$, $\lambda = \varphi(1) = f(x, y)$, donc 
    $$\boxed{f(tx, ty) = t^{\alpha}f(x, y) \qquad\text{pour tout } (x, y) \in U \text{ et tout } t > 0}$$
     et $f$ est homogène de degré $\alpha$. On peut aussi éviter le chapitre 6 : la fonction $t \mapsto t^{-\alpha}\varphi(t)$ a pour dérivée $t^{-\alpha - 1}\big(t\varphi'(t) - \alpha\varphi(t)\big) = 0$ sur un intervalle, donc elle est constante. Sur l'exemple $f(x, y) = \frac{x^{3} + y^{3}}{\sqrt{x^{2} + y^{2}}}$, homogène de degré $2$, sympy confirme la relation d'Euler et l'homogénéité de degré $1$ des dérivées partielles ✓.

    *À retenir.* La relation d'Euler dit que la dérivée de $f$ selon le vecteur $(x, y)$, c'est-à-dire dans la direction radiale, vaut $\alpha f(x, y)$ : la fonction croît le long de chaque demi-droite issue de $O$ comme $t \mapsto t^{\alpha}$. Le même schéma, dériver une identité par rapport à un paramètre puis l'évaluer en une valeur particulière, a servi à l'exercice 18. La fonction de l'exercice 16 est homogène de degré $1$ sur $U$, et ses dérivées partielles, homogènes de degré $0$, sont constantes sur chaque demi-droite issue de $O$ : elles ne peuvent avoir de limite en $O$ que si elles sont constantes, ce qui explique autrement que cette fonction ne soit pas de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.
- id: "ma-22-20"
  feuille: "f-ma-22"
  numero: 20
  partie: "Dérivées partielles et composées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [gradient, derivee-partielle]
  page_enonce: 5
  page_corrige: 20
  enonce: |
    On cherche les fonctions $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ qui vérifient l'équation 
    $$(E) \qquad 2\,\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = 0.$$

    **1.** Soit $a$, $b$, $c$, $d$ des réels tels que $ad - bc \neq 0$. Montrer que $\varphi : (x, y) \mapsto (ax + by, cx + dy)$ est une bijection de $\mathbb{R}^{2}$ sur lui-même, dont la réciproque est de la même forme. Pour $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, on pose $F = f \circ \varphi^{-1}$, de sorte que $f(x, y) = F(ax + by, cx + dy)$. Justifier que $F$ est de classe $\mathcal{C}^{1}$ et exprimer $2\,\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y}$ à l'aide des dérivées partielles de $F$.

    **2.** Choisir les réels $a$, $b$, $c$, $d$ pour que l'équation $(E)$ se traduise par $\frac{\partial F}{\partial v} = 0$, et résoudre $(E)$.

    **3.** Par la même méthode, déterminer les fonctions $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ telles que 
    $$\forall (x, y) \in \mathbb{R}^{2}, \qquad \frac{\partial f}{\partial x}(x, y) - 2\,\frac{\partial f}{\partial y}(x, y) = x.$$
  corrige: |
    **1.** Notons $\delta = ad - bc \neq 0$, et considérons l'application $\varphi' : (u, v) \mapsto \big(\frac{du - bv}{\delta}, \frac{-cu + av}{\delta}\big)$. Pour $(u, v) = (ax + by, cx + dy)$, on calcule 
    $$\frac{du - bv}{\delta} = \frac{(ad - bc)x + (db - bd)y}{\delta} = x, \qquad \frac{-cu + av}{\delta} = \frac{(-ca + ac)x + (ad - bc)y}{\delta} = y,$$
     donc $\varphi' \circ \varphi = \mathrm{Id}$, et le même calcul, avec les coefficients de $\varphi'$, donne $\varphi \circ \varphi' = \mathrm{Id}$. Ainsi $\varphi$ est une bijection de $\mathbb{R}^{2}$ sur lui-même, et 
    $$\boxed{\varphi^{-1}(u, v) = \Big(\frac{d}{\delta}u - \frac{b}{\delta}v,\ -\frac{c}{\delta}u + \frac{a}{\delta}v\Big)}$$
     qui est de la même forme, avec des coefficients de déterminant $\frac{ad - bc}{\delta^{2}} = \frac{1}{\delta} \neq 0$. C'est l'inverse d'une matrice $2 \times 2$ inversible, au sens du chapitre 16.

    La fonction $F = f \circ \varphi^{-1}$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ par le théorème 4, puisque les deux coordonnées de $\varphi^{-1}$ sont polynomiales. On a $f = F \circ \varphi$, c'est-à-dire $f(x, y) = F(ax + by, cx + dy)$, et le théorème 4, appliqué cette fois à $F$ composée avec $\varphi$, donne, les dérivées partielles de $F$ étant évaluées en $(ax + by, cx + dy)$, 
    $$\frac{\partial f}{\partial x} = a\,\frac{\partial F}{\partial u} + c\,\frac{\partial F}{\partial v}, \qquad \frac{\partial f}{\partial y} = b\,\frac{\partial F}{\partial u} + d\,\frac{\partial F}{\partial v}, \qquad \boxed{2\,\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = (2a - b)\,\frac{\partial F}{\partial u} + (2c - d)\,\frac{\partial F}{\partial v}}$$

    **2.** On veut annuler le coefficient de $\frac{\partial F}{\partial u}$ en gardant celui de $\frac{\partial F}{\partial v}$ non nul et $\delta \neq 0$ : on choisit $b = 2a$, par exemple 
    $$\boxed{a = 1, \quad b = 2, \quad c = 0, \quad d = 1}, \qquad u = x + 2y, \quad v = y,$$
     pour lesquels $\delta = 1$ et $2c - d = -1$. L'équation $(E)$ s'écrit alors $-\frac{\partial F}{\partial v}(x + 2y, y) = 0$ pour tout $(x, y)$ ; comme $\varphi$ est surjective, c'est équivalent à $\frac{\partial F}{\partial v} = 0$ sur $\mathbb{R}^{2}$. À $u$ fixé, $v \mapsto F(u, v)$ est de dérivée nulle sur $\mathbb{R}$, donc $F(u, v) = F(u, 0) = g(u)$, avec $g$ de classe $\mathcal{C}^{1}$ par la règle de la chaîne. Les solutions de $(E)$ sont donc 
    $$\boxed{f(x, y) = g(x + 2y), \qquad g \text{ de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}}$$
     Réciproquement, $2\,\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = 2g'(x + 2y) - 2g'(x + 2y) = 0$ ✓.

    ![Figure](documents/figures/efaa6b389c988579.svg)

    L'équation $(E)$ s'écrit $D_{(2, -1)}f = 0$ : $f$ est constante le long de chaque droite de direction $(2, -1)$, en pétrole, d'équation $x + 2y = c$, et $g(c)$ est la valeur qu'elle y prend. Le gradient $\nabla f = g'(x + 2y)\,(1, 2)$, en carmin, est orthogonal à ces droites, qui sont les lignes de niveau de $f$ (proposition 9).

    **3.** Le calcul de la question 1, avec les coefficients $1$ et $-2$ au lieu de $2$ et $-1$, donne 
    $$\frac{\partial f}{\partial x} - 2\,\frac{\partial f}{\partial y} = (a - 2b)\,\frac{\partial F}{\partial u} + (c - 2d)\,\frac{\partial F}{\partial v}.$$
     On choisit $a = 2b$ et $c - 2d \neq 0$, par exemple $a = 2$, $b = 1$, $c = 1$, $d = 0$, pour lesquels $\delta = -1 \neq 0$ et $c - 2d = 1$ : $u = 2x + y$ et $v = x$. L'équation s'écrit $\frac{\partial F}{\partial v}(2x + y, x) = x$ pour tout $(x, y)$, c'est-à-dire, $\varphi$ étant surjective, $\frac{\partial F}{\partial v}(u, v) = v$ pour tout $(u, v)$. La fonction $(u, v) \mapsto F(u, v) - \frac{v^{2}}{2}$ a une dérivée nulle par rapport à $v$, d'où $F(u, v) = \frac{v^{2}}{2} + g(u)$, avec $g$ de classe $\mathcal{C}^{1}$, et 
    $$\boxed{f(x, y) = \frac{x^{2}}{2} + g(2x + y), \qquad g \text{ de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}}$$
     Réciproquement, $\frac{\partial f}{\partial x} - 2\,\frac{\partial f}{\partial y} = x + 2g'(2x + y) - 2g'(2x + y) = x$ ✓.

    *Piège.* L'erreur la plus répandue, en question 3, est d'écrire $\frac{\partial F}{\partial v} = x$ et d'intégrer en $v$ en traitant $x$ comme une constante : le second membre doit être exprimé dans les nouvelles variables avant d'intégrer à $u$ fixé. Ici $x = v$, et l'on intègre $v$ ; si l'on avait choisi d'autres coefficients, $x$ aurait été une combinaison de $u$ et $v$, et la primitive aurait changé.
- id: "ma-22-21"
  feuille: "f-ma-22"
  numero: 21
  partie: "Dérivées partielles et composées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, ouverts du plan, fonctions de classe C1, gradient, "problèmes géométriques d'optimisation"]
  noeuds: [gd-differentielle, gd-classe-ck, tr-ouverts, fq-points-critiques]
  notions: [gradient, ouvert]
  page_enonce: 5
  page_corrige: 21
  enonce: |
    On identifie le plan à $\mathbb{R}^{2}$, muni de sa structure euclidienne canonique.

    **1.** Soit $D$ la droite passant par un point $A$ et de vecteur normal unitaire $n$. On rappelle (chapitre 19, proposition 13) que la distance d'un point $M$ à $D$ vaut $d(M, D) = |\langle M - A, n \rangle|$. Montrer que $f : M \mapsto d(M, D)$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2} \setminus D$, dont on justifiera qu'il est ouvert, et calculer son gradient. La fonction $f$ est-elle de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ ?

    **2.** Soit $ABC$ un triangle non aplati, et $T$ son intérieur : c'est l'ensemble des points $M$ qui sont, pour chacune des trois droites $(BC)$, $(CA)$ et $(AB)$, strictement du même côté de cette droite que le sommet opposé. Pour $M \in T$, on note $S(M)$ la somme des distances de $M$ aux trois droites $(BC)$, $(CA)$ et $(AB)$. Montrer que $T$ est un ouvert et que $\nabla S$ est constant sur $T$, égal à la somme de trois vecteurs unitaires que l'on précisera.

    **3.** En déduire que $S$ est constante sur $T$ si et seulement si le triangle $ABC$ est équilatéral, et calculer alors cette constante en fonction de la longueur $\ell$ des côtés.
  corrige: |
    **1.** Notons $g(M) = \langle M - A, n \rangle = n_{1}(x - x_{A}) + n_{2}(y - y_{A})$ pour $M = (x, y)$, où $n = (n_{1}, n_{2})$. La fonction $g$ est polynomiale de degré $1$, donc de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, de gradient constant $\nabla g = n$. La droite $D$ est l'ensemble des points $M$ tels que $M - A$ soit orthogonal à $n$, c'est-à-dire $D = \{g = 0\}$ (chapitre 19, proposition 12), et $f = |g|$.

    *$\mathbb{R}^{2} \setminus D$ est un ouvert.* Soit $a \notin D$ et $\rho = |g(a)| = d(a, D) > 0$. Pour $M \in B(a, \rho)$, l'inégalité de Cauchy-Schwarz (chapitre 19, théorème 1) donne 
    $$|g(M) - g(a)| = |\langle M - a, n \rangle| \leqslant \lVert M - a \rVert\,\lVert n \rVert < \rho = |g(a)|,$$
     donc $g(M)$ est non nul et du même signe que $g(a)$. Ainsi $B(a, \rho) \subset \mathbb{R}^{2} \setminus D$, et l'on a même mieux : les deux demi-plans ouverts $H_{+} = \{g > 0\}$ et $H_{-} = \{g < 0\}$ sont des ouverts, et $\mathbb{R}^{2} \setminus D$ est leur réunion. On retrouve aussi que $\mathbb{R}^{2} \setminus D = \{g \neq 0\}$ est ouvert par la proposition 4 (v).

    *Classe $\mathcal{C}^{1}$ et gradient.* Sur $H_{+}$, $f = g$, et sur $H_{-}$, $f = -g$. Soit $a \in H_{+}$, et $\rho > 0$ tel que $B(a, \rho) \subset H_{+}$. Pour $|t| < \rho$, les applications partielles de $f$ en $a$ coïncident avec celles de $g$, donc $f$ admet en $a$ les mêmes dérivées partielles que $g$ ; de même sur $H_{-}$ avec $-g$. Les dérivées partielles de $f$ sont constantes sur chacun des deux ouverts, donc continues sur leur réunion : 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2} \setminus D, \qquad \nabla f(M) = \varepsilon(M)\,n, \quad\text{où } \varepsilon(M) \text{ est le signe de } \langle M - A, n \rangle}$$
     Le gradient est le vecteur unitaire orthogonal à $D$ dirigé du côté de $M$ : la distance à $D$ croît le plus vite quand on s'éloigne perpendiculairement de $D$, à la vitesse $\lVert \nabla f(M) \rVert = 1$ (théorème 2).

    *En un point de $D$.* Soit $M_{0} \in D$. Pour tout réel $t$, $f(M_{0} + tn) = |\langle M_{0} - A, n \rangle + t\lVert n \rVert^{2}| = |t|$, qui n'est pas dérivable en $0$ : $f$ n'admet pas de dérivée selon $n$ en $M_{0}$. Si $f$ était de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, elle en admettrait une par la proposition 8 : 
    $$\boxed{f \text{ n'est pas de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     Le graphe de $f$ est un « toit » formé de deux demi-plans qui se rejoignent le long de $D$, en formant une arête.

    **2.** Notons $n_{A}$ le vecteur normal unitaire à la droite $(BC)$ dirigé du côté de $A$, c'est-à-dire tel que $\langle A - B, n_{A} \rangle > 0$, et définissons de même $n_{B}$, normal à $(CA)$ et dirigé du côté de $B$, et $n_{C}$, normal à $(AB)$ et dirigé du côté de $C$. Posons 
    $$g_{A}(M) = \langle M - B, n_{A} \rangle, \qquad g_{B}(M) = \langle M - C, n_{B} \rangle, \qquad g_{C}(M) = \langle M - A, n_{C} \rangle.$$
     Par la question 1, un point $M$ est strictement du même côté de $(BC)$ que $A$ si et seulement si $g_{A}(M)$ est du signe de $g_{A}(A) > 0$, et de même pour les deux autres droites. Ainsi 
    $$T = \{g_{A} > 0\} \cap \{g_{B} > 0\} \cap \{g_{C} > 0\}$$
     est l'intersection de trois demi-plans ouverts, donc un ouvert par la proposition 2 (iii), appliquée deux fois. Pour $M \in T$, on a $d\big(M, (BC)\big) = |g_{A}(M)| = g_{A}(M)$, et de même pour les autres côtés, donc 
    $$S(M) = g_{A}(M) + g_{B}(M) + g_{C}(M) \qquad\text{pour } M \in T.$$
     Sur $T$, $S$ est donc la restriction d'une fonction polynomiale de degré $1$, de classe $\mathcal{C}^{1}$, et 
    $$\boxed{\nabla S(M) = n_{A} + n_{B} + n_{C} \qquad\text{pour tout } M \in T}$$
     somme des trois vecteurs normaux unitaires aux côtés, dirigés vers l'intérieur du triangle.

    **3.** *Équivalence.* Si $S$ est constante sur l'ouvert $T$, ses applications partielles sont constantes au voisinage de chaque point, donc $\nabla S = 0$, et $n_{A} + n_{B} + n_{C} = 0$. Réciproquement, si $n_{A} + n_{B} + n_{C} = 0$, on a, pour $M \in T$, 
    $$S(M) = \langle M, n_{A} + n_{B} + n_{C} \rangle - \langle B, n_{A} \rangle - \langle C, n_{B} \rangle - \langle A, n_{C} \rangle = -\langle B, n_{A} \rangle - \langle C, n_{B} \rangle - \langle A, n_{C} \rangle,$$
     qui ne dépend pas de $M$. Il reste à traduire la condition $n_{A} + n_{B} + n_{C} = 0$ sur le triangle.

    *Somme nulle de trois vecteurs unitaires.* Si $n_{A} + n_{B} + n_{C} = 0$, alors $\lVert n_{B} + n_{C} \rVert^{2} = \lVert n_{A} \rVert^{2}$, soit $2 + 2\langle n_{B}, n_{C} \rangle = 1$, et $\langle n_{B}, n_{C} \rangle = -\frac{1}{2}$ ; de même pour les deux autres produits scalaires. Réciproquement, si les trois produits scalaires valent $-\frac{1}{2}$, alors $\lVert n_{A} + n_{B} + n_{C} \rVert^{2} = 3 + 2\big(-\frac{3}{2}\big) = 0$. C'est la question 2 de l'exercice 35.

    *Lien avec les angles du triangle.* Notons $e_{1} = \frac{B - A}{AB}$ et $e_{2} = \frac{C - A}{AC}$, et $\widehat{A} \in \left]0, \pi\right[$ l'angle en $A$, de sorte que $\langle e_{1}, e_{2} \rangle = \cos\widehat{A}$. Le vecteur $e_{2} - \cos\widehat{A}\,e_{1}$ est orthogonal à $e_{1}$, de norme $\sqrt{1 - \cos^{2}\widehat{A}} = \sin\widehat{A}$, et son produit scalaire avec $C - A$ vaut $AC\,\sin^{2}\widehat{A} > 0$ : c'est $\sin\widehat{A}\;n_{C}$. De même, $e_{1} - \cos\widehat{A}\,e_{2} = \sin\widehat{A}\;n_{B}$. On en déduit 
    $$\sin^{2}\widehat{A}\,\langle n_{B}, n_{C} \rangle = \langle e_{1} - \cos\widehat{A}\,e_{2}, e_{2} - \cos\widehat{A}\,e_{1} \rangle = \cos\widehat{A} - 2\cos\widehat{A} + \cos^{3}\widehat{A} = -\cos\widehat{A}\,\sin^{2}\widehat{A},$$

    $$\boxed{\langle n_{B}, n_{C} \rangle = -\cos\widehat{A}}$$
     et de même aux deux autres sommets. Ainsi $\langle n_{B}, n_{C} \rangle = -\frac{1}{2}$ si et seulement si $\cos\widehat{A} = \frac{1}{2}$, c'est-à-dire $\widehat{A} = \frac{\pi}{3}$. La fonction $S$ est donc constante sur $T$ si et seulement si les trois angles du triangle mesurent $\frac{\pi}{3}$. Un triangle équilatéral a ses trois angles égaux à $\frac{\pi}{3}$ ; réciproquement, si c'est le cas, en notant $a$, $b$, $c$ les longueurs des côtés opposés à $A$, $B$, $C$, la formule d'Al-Kashi donne $a^{2} = b^{2} + c^{2} - bc$ et $b^{2} = a^{2} + c^{2} - ac$, d'où, par différence, $(a - b)(2a + 2b - c) = 0$ ; comme $c < a + b$, on a $a = b$, et de même $b = c$. 
    $$\boxed{S \text{ est constante sur } T \iff ABC \text{ est équilatéral}}$$

    *Valeur de la constante.* Le centre de gravité $G = \frac{1}{3}(A + B + C)$ vérifie 
    $$g_{A}(G) = \frac{1}{3}\big(\langle A - B, n_{A} \rangle + \langle C - B, n_{A} \rangle\big) = \frac{1}{3}\langle A - B, n_{A} \rangle > 0,$$
     le vecteur $C - B$ étant orthogonal à $n_{A}$, et de même $g_{B}(G) > 0$ et $g_{C}(G) > 0$ : il appartient à $T$. Or $\langle A - B, n_{A} \rangle = d\big(A, (BC)\big)$ est la hauteur issue de $A$, qui vaut $\ell\sin\frac{\pi}{3} = \frac{\ell\sqrt{3}}{2}$ dans le triangle équilatéral. Chacune des trois distances de $G$ aux côtés vaut le tiers de la hauteur, et 
    $$\boxed{S(M) = \frac{\ell\sqrt{3}}{2} \qquad\text{pour tout } M \in T}$$
     La somme des distances aux trois côtés est égale à la hauteur du triangle, résultat connu sous le nom de théorème de Viviani. Le contrôle numérique, pour $\ell = 4$ et trois points de $T$, donne $3{,}4641 \approx 2\sqrt{3}$ ✓ ; pour le triangle quelconque de sommets $(0, 0)$, $(5, 0)$, $(1{,}3\,;2{,}9)$, $S$ prend des valeurs différentes en deux points de $T$.

    ![Figure](documents/figures/0a0a680b21b99091.svg)

    Dans le triangle équilatéral de côté $4$, les trois distances de $M = (1{,}6\,;1{,}1)$ aux côtés, en pétrole, valent environ $1{,}5285$, $0{,}8356$ et $1{,}1$, de somme $3{,}4641 = 2\sqrt{3}$, la hauteur. À droite, les trois normales intérieures mises bout à bout forment un triangle fermé : leur somme, qui est le gradient de $S$, est nulle, et $S$ ne varie pas quand $M$ se déplace.

    *À retenir.* Une fonction affine sur un ouvert est constante si et seulement si son gradient est nul. Tout le travail consiste ici à reconnaître que, *à l'intérieur* du triangle, les valeurs absolues disparaissent : c'est la question 1, où la distance à une droite n'est de classe $\mathcal{C}^{1}$ que loin de cette droite.
- id: "ma-22-22"
  feuille: "f-ma-22"
  numero: 22
  partie: "Dérivées partielles et composées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, ouverts du plan, dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck, tr-ouverts]
  notions: [gradient, ouvert, derivee-partielle]
  page_enonce: 6
  page_corrige: 24
  enonce: |
    *Fonctions harmoniques radiales.* Soit $f$ une fonction de classe $\mathcal{C}^{1}$ sur un ouvert $U$, dont les deux dérivées partielles sont elles-mêmes de classe $\mathcal{C}^{1}$ sur $U$. On pose 
    $$\Delta f = \frac{\partial }{\partial x}\Big(\frac{\partial f}{\partial x}\Big) + \frac{\partial }{\partial y}\Big(\frac{\partial f}{\partial y}\Big),$$
     et l'on dit que $f$ est *harmonique* sur $U$ si $\Delta f = 0$ sur $U$. On prend ici $U = \mathbb{R}^{2} \setminus \{(0, 0)\}$, et l'on considère une fonction $\varphi$ de classe $\mathcal{C}^{2}$ sur $\left]0, +\infty\right[$ et la fonction $f : (x, y) \mapsto \varphi(x^{2} + y^{2})$.

    **1.** Montrer que $f$ vérifie les hypothèses ci-dessus, et que $\Delta f(x, y) = 4s\,\varphi''(s) + 4\varphi'(s)$, où $s = x^{2} + y^{2}$.

    **2.** Déterminer toutes les fonctions $f$ de cette forme qui sont harmoniques sur $U$.
  corrige: |
    **1.** Notons $s(x, y) = x^{2} + y^{2}$, fonction polynomiale, de classe $\mathcal{C}^{1}$ sur $U$, à valeurs dans $\left]0, +\infty\right[$. Par la proposition 6 (iii), $f = \varphi \circ s$ est de classe $\mathcal{C}^{1}$ sur $U$, et 
    $$\frac{\partial f}{\partial x}(x, y) = 2x\,\varphi'(x^{2} + y^{2}), \qquad \frac{\partial f}{\partial y}(x, y) = 2y\,\varphi'(x^{2} + y^{2}).$$
     Comme $\varphi$ est de classe $\mathcal{C}^{2}$, $\varphi'$ est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$ ; la proposition 6 (iii), appliquée à $\varphi'$, puis la proposition 6 (ii), pour le produit par $2x$, montrent que $\frac{\partial f}{\partial x}$ est de classe $\mathcal{C}^{1}$ sur $U$, et de même pour $\frac{\partial f}{\partial y}$ : $f$ vérifie les hypothèses de l'énoncé. On dérive ces produits : 
    $$\frac{\partial }{\partial x}\Big(\frac{\partial f}{\partial x}\Big) = 2\varphi'(s) + 4x^{2}\varphi''(s), \qquad \frac{\partial }{\partial y}\Big(\frac{\partial f}{\partial y}\Big) = 2\varphi'(s) + 4y^{2}\varphi''(s),$$
     où $s = x^{2} + y^{2}$, et la somme donne 
    $$\boxed{\Delta f(x, y) = 4s\,\varphi''(s) + 4\varphi'(s), \qquad s = x^{2} + y^{2}}$$

    **2.** Quand $(x, y)$ décrit $U$, $s = x^{2} + y^{2}$ décrit $\left]0, +\infty\right[$ tout entier, puisque $s(\sqrt{\sigma}, 0) = \sigma$ pour $\sigma > 0$. La fonction $f$ est donc harmonique sur $U$ si et seulement si 
    $$\forall s > 0, \qquad s\,\psi'(s) + \psi(s) = 0, \qquad\text{où } \psi = \varphi'.$$
     Cette relation s'écrit $(s\psi)' = 0$ : sur l'intervalle $\left]0, +\infty\right[$, elle équivaut à $s\psi(s) = C$ pour une constante $C$ (chapitre 9, théorème 7), c'est-à-dire $\varphi'(s) = \frac{C}{s}$, puis à $\varphi(s) = C\ln s + D$, pour une autre constante $D$, par le même théorème appliqué à $\varphi - C\ln$. 
    $$\boxed{f(x, y) = C\ln(x^{2} + y^{2}) + D, \qquad C, D \in \mathbb{R}}$$
     Réciproquement, pour $\varphi(s) = C\ln s + D$, on a $4s\,\varphi''(s) + 4\varphi'(s) = -\frac{4C}{s} + \frac{4C}{s} = 0$ ✓.

    *À retenir.* À une constante multiplicative près, la seule fonction harmonique radiale non constante est $\ln\lVert (x, y) \rVert = \frac{1}{2}\ln(x^{2} + y^{2})$, qui tend vers $-\infty$ en $O$ : c'est pourquoi l'origine a été retirée. Les fonctions harmoniques radiales sur $\mathbb{R}^{2}$ tout entier sont donc les constantes. En physique, ce logarithme est le potentiel créé dans le plan par un fil rectiligne chargé ; la seconde année étudiera les dérivées partielles d'ordre $2$ en général.
