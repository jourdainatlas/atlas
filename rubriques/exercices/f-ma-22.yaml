- id: "ma-22-01"
  feuille: "f-ma-22"
  numero: 1
  partie: "Ouverts de $\\mathbb{R}^{2}$ et continuité"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [ouverts et continuité, ouverts du plan]
  noeuds: [tr-ouverts, c-sequentielle]
  notions: [ouvert, boule-ouverte]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Montrer que l'ensemble $\{(x, y) \in \mathbb{R}^{2} \mid y > \cos x\}$ est un ouvert de $\mathbb{R}^{2}$, d'abord en exhibant, autour de chacun de ses points, une boule qu'il contient, puis à l'aide d'une proposition du cours.

    **2.** Pour tout $n \in \mathbb{N}^{*}$, on pose $U_{n} = \big\{(x, y) \in \mathbb{R}^{2} \mid |y| < \frac{1}{n}\big\}$. Montrer que chaque $U_{n}$ est un ouvert de $\mathbb{R}^{2}$, mais que leur intersection $\bigcap_{n \geqslant 1} U_{n}$ n'en est pas un. Comparer avec la proposition 2 du cours.
  corrige: |
    **1.** Notons $U = \{(x, y) \in \mathbb{R}^{2} \mid y > \cos x\}$, et soit $a = (x_{0}, y_{0}) \in U$. On pose 
    $$r = \frac{y_{0} - \cos x_{0}}{2},$$
     qui est strictement positif. Soit $M = (x, y) \in B(a, r)$. Par la proposition 1, $|x - x_{0}| \leqslant \lVert M - a \rVert < r$ et $|y - y_{0}| < r$. L'inégalité des accroissements finis (chapitre 9, théorème 6), appliquée au cosinus, dont la dérivée est bornée par $1$, donne $|\cos x - \cos x_{0}| \leqslant |x - x_{0}| < r$. Ainsi 
    $$y - \cos x = (y_{0} - \cos x_{0}) + (y - y_{0}) - (\cos x - \cos x_{0}) > 2r - r - r = 0,$$
     donc $M \in U$. On a montré que $B(a, r) \subset U$ pour tout $a \in U$ : 
    $$\boxed{U = \{y > \cos x\} \text{ est un ouvert de } \mathbb{R}^{2}}$$

    ![Figure](documents/figures/e347d2a4365b03b6.svg)

    La boule de rayon $r$, en pointillés, reste au-dessus de la courbe : un déplacement de moins de $r$ fait baisser $y$ de moins de $r$ et monter $\cos x$ de moins de $r$, ce qui consomme au plus la moitié de la marge $y_{0} - \cos x_{0}$ dans chaque cas. Le rayon devient d'autant plus petit que le point, comme $a'$, est proche de la courbe.

    À l'aide du cours, la fonction $g : (x, y) \mapsto y - \cos x$ est continue sur $\mathbb{R}^{2}$, par la proposition 4 (i), (ii) et (iii). La proposition 4 (v) porte sur l'ensemble où une fonction continue *ne s'annule pas*, et non sur celui où elle est positive ; on l'applique à la fonction $g + |g|$, continue par la proposition 4 (ii) et (iii), puisque la valeur absolue est continue sur $\mathbb{R}$. Comme $g + |g|$ vaut $2g$ là où $g > 0$ et $0$ là où $g \leqslant 0$, on a 
    $$U = \{M \in \mathbb{R}^{2} \mid g(M) + |g(M)| \neq 0\},$$
     qui est un ouvert par la proposition 4 (v). Le même argument montre que, pour toute fonction $g$ continue sur $\mathbb{R}^{2}$, l'ensemble $\{g > 0\}$ est un ouvert.

    **2.** Soit $n \in \mathbb{N}^{*}$ et $a = (x_{0}, y_{0}) \in U_{n}$, de sorte que $r = \frac{1}{n} - |y_{0}| > 0$. Pour $M = (x, y) \in B(a, r)$, la proposition 1 donne $|y - y_{0}| < r$, donc 
    $$|y| \leqslant |y_{0}| + |y - y_{0}| < |y_{0}| + r = \frac{1}{n},$$
     et $M \in U_{n}$. Ainsi $B(a, r) \subset U_{n}$ : 
    $$\boxed{\text{chaque } U_{n} \text{ est un ouvert de } \mathbb{R}^{2}}$$
     Un point $(x, y)$ appartient à l'intersection si et seulement si $|y| < \frac{1}{n}$ pour tout $n \geqslant 1$. C'est le cas si $y = 0$ ; si $y \neq 0$, un entier $n > \frac{1}{|y|}$, qui existe parce que $\mathbb{R}$ est archimédien (chapitre 7), donne $|y| > \frac{1}{n}$. Donc 
    $$\boxed{\bigcap_{n \geqslant 1} U_{n} = \mathbb{R} \times \{0\}}$$
     C'est l'axe des abscisses, qui n'est pas un ouvert : pour tout $r > 0$, la boule $B\big((0, 0), r\big)$ contient le point $\big(0, \frac{r}{2}\big)$, qui n'est pas sur l'axe.

    *À retenir.* La proposition 2 (iii) affirme que l'intersection de *deux* ouverts est un ouvert, et donc, par récurrence, celle d'un nombre fini d'ouverts. Sa démonstration prend le plus petit des deux rayons, et c'est là que tout se joue : en $(0, 0)$, la plus grande boule contenue dans $U_{n}$ a pour rayon $\frac{1}{n}$, et ces rayons n'ont pas de minimum strictement positif. Pour une famille infinie d'ouverts, la borne inférieure des rayons peut être nulle, et la propriété tombe ; la réunion, elle, reste un ouvert quel que soit le nombre d'ouverts réunis.
- id: "ma-22-02"
  feuille: "f-ma-22"
  numero: 2
  partie: "Ouverts de $\\mathbb{R}^{2}$ et continuité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ouverts et continuité, continuité]
  noeuds: [tr-ouverts, c-sequentielle]
  notions: [ouvert, boule-ouverte]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Les fonctions suivantes, définies sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, peuvent-elles être prolongées en des fonctions continues sur $\mathbb{R}^{2}$ ? 
    $$\text{(a)}\ \ xy\cos\Big(\frac{1}{x^{2} + y^{2}}\Big) \qquad\quad \text{(b)}\ \ \frac{x^{2} - y^{2}}{x^{2} + y^{2}} \qquad\quad \text{(c)}\ \ \frac{|x + y|}{x^{2} + y^{2}}$$
  corrige: |
    Dans les trois cas, la fonction est continue sur l'ouvert $\mathbb{R}^{2} \setminus \{(0, 0)\}$, par la proposition 4 (i), (ii) et (iii), puisque $x^{2} + y^{2}$ ne s'y annule pas. La question ne porte donc que sur l'origine : un prolongement continu doit prendre en $(0, 0)$ une valeur $c$ telle que $f(M_{n})$ tende vers $c$ pour toute suite $(M_{n})$ de points non nuls qui tend vers $(0, 0)$ (proposition 3).

    **(a)** Comme $2|xy| \leqslant x^{2} + y^{2}$ et $|\cos| \leqslant 1$, on a, pour $(x, y) \neq (0, 0)$, 
    $$\Big|xy\cos\Big(\frac{1}{x^{2} + y^{2}}\Big)\Big| \leqslant |xy| \leqslant \frac{\rho^{2}}{2}.$$
     Prolongeons par $f(0, 0) = 0$, et soit $\varepsilon > 0$. Avec $\delta = \sqrt{2\varepsilon}$, tout point $M$ tel que $\lVert M \rVert \leqslant \delta$ vérifie $|f(M) - f(0, 0)| \leqslant \frac{\delta^{2}}{2} = \varepsilon$, l'inégalité étant évidente pour $M = (0, 0)$ : $\delta$ convient. 
    $$\boxed{\text{(a) se prolonge en une fonction continue sur } \mathbb{R}^{2}, \text{ par la valeur } 0 \text{ en } (0, 0)}$$
     Le cosinus oscille de plus en plus vite près de l'origine, mais il est multiplié par $xy$, qui tend vers $0$ : c'est le même mécanisme que pour $x \sin\frac{1}{x}$ au chapitre 8.

    **(b)** Pour $t \neq 0$, on a $f(t, 0) = 1$ et $f(0, t) = -1$. Si un prolongement continu de valeur $c$ en $(0, 0)$ existait, les suites $\big(\frac{1}{n}, 0\big)$ et $\big(0, \frac{1}{n}\big)$, qui tendent vers $(0, 0)$, donneraient $c = 1$ et $c = -1$. 
    $$\boxed{\text{(b) n'admet pas de prolongement continu à } \mathbb{R}^{2}}$$
     Plus précisément, sur la droite $y = mx$ privée de l'origine, $f$ vaut constamment $\frac{1 - m^{2}}{1 + m^{2}}$ : comme pour la fonction de la proposition 5, les lignes de niveau sont des droites passant par l'origine, et $f$ prend toutes les valeurs de $\left]-1, 1\right]$ aussi près de $(0, 0)$ que l'on veut.

    **(c)** Pour $t \neq 0$, on a $f(t, t) = \frac{2|t|}{2t^{2}} = \frac{1}{|t|}$. La suite $M_{n} = \big(\frac{1}{n}, \frac{1}{n}\big)$ tend vers $(0, 0)$, et $f(M_{n}) = n$ tend vers $+\infty$ : elle ne converge vers aucun réel $c$. 
    $$\boxed{\text{(c) n'admet pas de prolongement continu à } \mathbb{R}^{2}}$$
     *Piège.* En (c), la fonction est nulle sur la droite $y = -x$, et l'on pourrait croire qu'elle « tend vers $0$ » en se laissant guider par cette seule direction. L'erreur la plus répandue est de conclure à partir d'une direction d'approche particulière ; une direction suffit pour *réfuter* la continuité, jamais pour l'établir.
- id: "ma-22-03"
  feuille: "f-ma-22"
  numero: 3
  partie: "Ouverts de $\\mathbb{R}^{2}$ et continuité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ouverts et continuité, ouverts du plan, continuité, courbes définies implicitement]
  noeuds: [tr-ouverts, c-sequentielle, gd-differentielle]
  notions: [ouvert, boule-ouverte]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    **1.** On pose $f(x, y) = \dfrac{xy^{4}}{x^{4} + y^{6}}$ pour $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$. Montrer que, pour tout vecteur $u \in \mathbb{R}^{2}$, la fonction $t \mapsto f(tu)$ est continue en $0$, mais que $f$ n'est pas continue en $(0, 0)$. On pourra étudier $f$ le long de la courbe d'équation $x = y^{3/2}$, pour $y > 0$.

    **2.** On pose $g(x, y) = \dfrac{x^{3}y^{4}}{x^{8} + y^{6}}$ pour $(x, y) \neq (0, 0)$, et $g(0, 0) = 0$. Montrer que $g$ est continue sur $\mathbb{R}^{2}$. On pourra majorer $|x|$ et $|y|$ à l'aide de $x^{8} + y^{6}$.

    **3.** On pose $h(x, y) = \dfrac{1 - \cos(xy)}{xy^{2}}$ sur l'ouvert $\{(x, y) \in \mathbb{R}^{2} \mid xy \neq 0\}$. Montrer que $h$ se prolonge en une fonction continue sur $\mathbb{R}^{2}$ tout entier, et préciser les valeurs de ce prolongement sur les deux axes.
  corrige: |
    **1.** Soit $u = (u_{1}, u_{2}) \in \mathbb{R}^{2}$. Si $u_{1} = 0$, on a $f(tu) = f(0, tu_{2}) = 0$ pour tout $t$, et $t \mapsto f(tu)$ est constante. Si $u_{1} \neq 0$, le point $tu$ est non nul pour $t \neq 0$, et 
    $$f(tu) = \frac{t^{5}u_{1}u_{2}^{4}}{t^{4}u_{1}^{4} + t^{6}u_{2}^{6}} = \frac{t\,u_{1}u_{2}^{4}}{u_{1}^{4} + t^{2}u_{2}^{6}}.$$
     Le membre de droite est défini pour tout réel $t$, puisque son dénominateur est au moins égal à $u_{1}^{4} > 0$ ; il est continu en $t$ et vaut $0 = f(0, 0)$ en $t = 0$. Dans les deux cas : 
    $$\boxed{\text{pour tout } u \in \mathbb{R}^{2}, \ t \mapsto f(tu) \text{ est continue en } 0}$$
     Le long de la courbe $x = y^{3/2}$, pour $y > 0$, on a $x^{4} = y^{6}$, et 
    $$f\big(y^{3/2}, y\big) = \frac{y^{3/2}y^{4}}{2y^{6}} = \frac{1}{2\sqrt{y}}.$$
     La suite $M_{n} = \big(n^{-3/2}, \frac{1}{n}\big)$ tend vers $(0, 0)$, et $f(M_{n}) = \frac{\sqrt{n}}{2}$ tend vers $+\infty$ : par la proposition 3, 
    $$\boxed{f \text{ n'est pas continue en } (0, 0)}$$

    ![Figure](documents/figures/6a6e3b89376183b4.svg)

    La courbe $x = y^{3/2}$ arrive en l'origine tangentiellement à l'axe des ordonnées, puisque $\frac{x}{y} = \sqrt{y}$ tend vers $0$ : elle passe « entre » toutes les droites, le long desquelles $f$ tend vers $0$, et $f$ y prend les valeurs $\frac{1}{2}$, $1$, $2$ en $y = 1$, $\frac{1}{4}$, $\frac{1}{16}$, de plus en plus grandes à mesure que l'on approche de l'origine.

    **2.** La fonction $g$ est continue sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ par la proposition 4, puisque $N = x^{8} + y^{6}$ ne s'annule qu'en $(0, 0)$. Pour $(x, y) \neq (0, 0)$, on a $x^{8} \leqslant N$ et $y^{6} \leqslant N$, donc $|x| \leqslant N^{1/8}$ et $|y| \leqslant N^{1/6}$, et 
    $$|g(x, y)| = \frac{|x|^{3}y^{4}}{N} \leqslant \frac{N^{3/8}N^{4/6}}{N} = N^{\frac{3}{8} + \frac{2}{3} - 1} = N^{1/24}.$$
     Soit $\varepsilon > 0$. Pour $\lVert M \rVert \leqslant \delta \leqslant 1$, on a $|x|, |y| \leqslant \delta$ par la proposition 1, donc $N \leqslant \delta^{8} + \delta^{6} \leqslant 2\delta^{6}$, et $|g(M)| \leqslant 2^{1/24}\delta^{1/4}$. Le réel $\delta = \min\big(1, 2^{-1/6}\varepsilon^{4}\big)$ convient, puisqu'il donne $2^{1/24}\delta^{1/4} \leqslant \varepsilon$. 
    $$\boxed{g \text{ est continue sur } \mathbb{R}^{2}}$$
     *À retenir.* Les deux fonctions se comprennent en donnant à $x$ et à $y$ des « poids » qui équilibrent le dénominateur. Pour $f$, avec $x = \lambda^{3}$ et $y = \lambda^{2}$, les deux termes $x^{4}$ et $y^{6}$ valent $\lambda^{12}$, le numérateur $\lambda^{11}$, et $f(\lambda^{3}, \lambda^{2}) = \frac{1}{2\lambda}$ explose : c'est la courbe de l'indication. Pour $g$, avec $x = \lambda^{3}$ et $y = \lambda^{4}$, les deux termes valent $\lambda^{24}$, le numérateur $\lambda^{25}$, et $g(\lambda^{3}, \lambda^{4}) = \frac{\lambda}{2}$ tend vers $0$ ; l'exposant $\frac{1}{24}$ de la majoration est précisément la différence $25 - 24$ divisée par $24$. La fonction $f$ fournit le contre-exemple de l'assertion 3 de l'exercice 34.

    **3.** Notons $\psi(u) = \frac{1 - \cos u}{u^{2}}$ pour $u \neq 0$. Pour $xy \neq 0$, 
    $$x\,\psi(xy) = x \cdot \frac{1 - \cos(xy)}{x^{2}y^{2}} = \frac{1 - \cos(xy)}{xy^{2}} = h(x, y).$$
     Les axes, où le dénominateur $xy^{2}$ s'annule, ne posent donc pas de vraie difficulté : le numérateur s'y annule plus vite. La formule $1 - \cos u = 2\sin^{2}\frac{u}{2}$ donne, pour $u \neq 0$, 
    $$\psi(u) = \frac{1}{2}\bigg(\frac{\sin(u/2)}{u/2}\bigg)^{2},$$
     qui tend vers $\frac{1}{2}$ quand $u$ tend vers $0$, puisque $\frac{\sin v}{v}$ tend vers $\sin'(0) = 1$ (c'est aussi l'équivalent $1 - \cos u \sim \frac{u^{2}}{2}$ du chapitre 10). En posant $\psi(0) = \frac{1}{2}$, on obtient une fonction continue sur $\mathbb{R}$. La fonction 
    $$H : (x, y) \mapsto x\,\psi(xy)$$
     est alors continue sur $\mathbb{R}^{2}$ par la proposition 4 (i), (ii) et (iii), et elle coïncide avec $h$ sur l'ouvert $\{xy \neq 0\}$ : c'est un prolongement continu de $h$. Sur les axes, $xy = 0$ et $H(x, y) = \frac{x}{2}$. 
    $$\boxed{H(x, 0) = \frac{x}{2} \text{ pour tout } x \in \mathbb{R}, \qquad H(0, y) = 0 \text{ pour tout } y \in \mathbb{R}}$$
     Ce prolongement est le seul possible : tout point $(x_{0}, 0)$ est limite de la suite $\big(x_{0} + \frac{1}{n}, \frac{1}{n}\big)$, dont les termes sont, à partir d'un certain rang, dans l'ouvert $\{xy \neq 0\}$, et un prolongement continu doit y valoir la limite de $h\big(x_{0} + \frac{1}{n}, \frac{1}{n}\big) = H\big(x_{0} + \frac{1}{n}, \frac{1}{n}\big)$, c'est-à-dire $H(x_{0}, 0)$ ; de même sur l'axe des ordonnées. Numériquement, $h(3, 10^{-4}) \approx 1{,}5 = \frac{3}{2}$ ✓.

    *Piège.* L'erreur la plus répandue est de croire, à cause du facteur $y^{2}$ au dénominateur, que $h$ « explose » près de l'axe des abscisses. Il faut regarder le numérateur avant de conclure : un équivalent du numérateur, ici $\frac{x^{2}y^{2}}{2}$, dit souvent tout.
- id: "ma-22-04"
  feuille: "f-ma-22"
  numero: 4
  partie: "Ouverts de $\\mathbb{R}^{2}$ et continuité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ouverts et continuité, ouverts du plan, continuité, "problèmes géométriques d'optimisation"]
  noeuds: [tr-ouverts, c-sequentielle, fq-points-critiques]
  notions: [ouvert, boule-ouverte]
  page_enonce: 1
  page_corrige: 5
  enonce: |
    Soit $U$ un ouvert non vide de $\mathbb{R}^{2}$. Montrer qu'une fonction continue $f : U \to \mathbb{R}$ n'est jamais injective. On pourra considérer une boule contenue dans $U$, les deux demi-cercles qui joignent deux points diamétralement opposés de cette boule, et appliquer le théorème des valeurs intermédiaires le long de chacun d'eux.
  corrige: |
    Raisonnons par l'absurde, et supposons $f$ continue et injective sur $U$. Comme $U$ est un ouvert non vide, il contient un point $a = (x_{0}, y_{0})$ et une boule $B(a, r)$, avec $r > 0$. Posons $\delta = \frac{r}{2}$, et définissons, pour $t \in [0, \pi]$, 
    $$\gamma_{1}(t) = (x_{0} + \delta\cos t,\ y_{0} + \delta\sin t), \qquad \gamma_{2}(t) = (x_{0} + \delta\cos t,\ y_{0} - \delta\sin t).$$
     Ce sont les deux demi-cercles, supérieur et inférieur, de centre $a$ et de rayon $\delta$ ; ils sont tracés dans $B(a, r)$, donc dans $U$, puisque tous leurs points sont à la distance $\delta < r$ de $a$. Ils ont les mêmes extrémités, $p = \gamma_{1}(0) = \gamma_{2}(0) = (x_{0} + \delta, y_{0})$ et $q = \gamma_{1}(\pi) = \gamma_{2}(\pi) = (x_{0} - \delta, y_{0})$, deux points diamétralement opposés.

    Les fonctions $\varphi_{i} = f \circ \gamma_{i}$ sont continues sur l'intervalle $[0, \pi]$, par la proposition 4 (iv). Comme $p \neq q$ et que $f$ est injective, $f(p) \neq f(q)$, et le réel $c = \frac{f(p) + f(q)}{2}$ est strictement compris entre $f(p)$ et $f(q)$. Le théorème des valeurs intermédiaires (chapitre 8, théorème 8) fournit $t_{1} \in [0, \pi]$ tel que $\varphi_{1}(t_{1}) = c$, et $t_{1}$ n'est ni $0$ ni $\pi$, puisque $\varphi_{1}(0) = f(p) \neq c$ et $\varphi_{1}(\pi) = f(q) \neq c$. De même, il existe $t_{2} \in \left]0, \pi\right[$ tel que $\varphi_{2}(t_{2}) = c$. Les points $M_{1} = \gamma_{1}(t_{1})$ et $M_{2} = \gamma_{2}(t_{2})$ sont distincts, puisque leurs ordonnées vérifient 
    $$y_{0} + \delta\sin t_{1} > y_{0} > y_{0} - \delta\sin t_{2},$$
     et ils ont la même image $c$, ce qui contredit l'injectivité. 
    $$\boxed{\text{Une fonction continue sur un ouvert non vide de } \mathbb{R}^{2} \text{ n'est jamais injective}}$$

    ![Figure](documents/figures/aee639e63c621a03.svg)

    On a illustré la démonstration avec $f(x, y) = x + 0{,}3\,y^{2}$, $a = (0, 0)$ et $\delta = 1$, de sorte que $f(p) = 1$, $f(q) = -1$ et $c = 0$ : la ligne de niveau $0$, la parabole $x = -0{,}3\,y^{2}$, coupe chacun des deux demi-cercles, en $M_{1}$ et $M_{2} = (-0{,}2770 ; \pm 0{,}9609)$, coordonnées obtenues en résolvant $0{,}09\,y^{4} + y^{2} - 1 = 0$.

    *À retenir.* Sur un intervalle, au contraire, il existe des fonctions continues injectives, comme $x \mapsto x$, et ce sont exactement les fonctions strictement monotones (chapitre 8, proposition 17). La différence est topologique : dans un intervalle, on ne peut aller de $p$ à $q$ que d'une seule façon, alors que dans une boule du plan on peut le faire par deux chemins disjoints, hormis leurs extrémités, et chacun d'eux rencontre la ligne de niveau $c$. C'est pourquoi une fonction continue de deux variables a des lignes de niveau qui sont, en général, des courbes, et non des points isolés.

    *Piège.* Il faut appliquer le théorème des valeurs intermédiaires à une valeur $c$ *strictement* comprise entre $f(p)$ et $f(q)$ : avec $c = f(p)$, on trouverait $t_{1} = t_{2} = 0$, et l'on obtiendrait deux fois le même point $p$.
- id: "ma-22-05"
  feuille: "f-ma-22"
  numero: 5
  partie: "Dérivées partielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles, ouverts du plan, fonctions de classe C1, plan tangent]
  noeuds: [gd-differentielle, tr-ouverts, gd-classe-ck]
  notions: [derivee-partielle, ouvert, plan-tangent]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    **1.** Justifier que les fonctions suivantes sont de classe $\mathcal{C}^{1}$ sur l'ouvert indiqué, et calculer leurs dérivées partielles.

    **(a)** $\dfrac{x}{y}$ sur $\mathbb{R} \times \left]0, +\infty\right[$

    **(b)** $\dfrac{1}{xy^{2}}$ sur $\left]0, +\infty\right[^{2}$

    **(c)** $x\ln(xy)$ sur $\left]0, +\infty\right[^{2}$

    **(d)** $\mathrm{e}^{-x}\sin(x^{2} + y^{2})$ sur $\mathbb{R}^{2}$

    **(e)** $\mathrm{e}^{x}\cos y$ sur $\mathbb{R}^{2}$

    **(f)** $(x^{2} + y^{2})\cos(xy)$ sur $\mathbb{R}^{2}$

    **(g)** $\sqrt{1 + x^{2}y^{2}}$ sur $\mathbb{R}^{2}$

    **2.** Donner une équation du plan tangent à la surface d'équation $z = x\ln(xy)$ au point de coordonnées $(1, 1, 0)$.
  corrige: |
    **1.** Dans chaque cas, la fonction est construite à partir des fonctions coordonnées par sommes, produits, quotients dont le dénominateur ne s'annule pas sur l'ouvert indiqué, et compositions par des fonctions de classe $\mathcal{C}^{1}$ sur un intervalle qui contient les valeurs composées : elle est de classe $\mathcal{C}^{1}$ par la proposition 6. Pour (c), le logarithme est appliqué à $xy$, qui appartient à $\left]0, +\infty\right[$ sur $\left]0, +\infty\right[^{2}$ ; pour (g), la racine carrée est appliquée à $1 + x^{2}y^{2} \geqslant 1$, et elle est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[$. On dérive par rapport à une variable en traitant l'autre comme une constante.

    **(a)** Sur $\mathbb{R} \times \left]0, +\infty\right[$, on obtient : 
    $$\boxed{\frac{\partial f}{\partial x} = \frac{1}{y}, \qquad \frac{\partial f}{\partial y} = -\frac{x}{y^{2}}}$$

    **(b)** Sur $\left]0, +\infty\right[^{2}$, on dérive $\frac{1}{x} \cdot \frac{1}{y^{2}}$ : 
    $$\boxed{\frac{\partial f}{\partial x} = -\frac{1}{x^{2}y^{2}}, \qquad \frac{\partial f}{\partial y} = -\frac{2}{xy^{3}}}$$

    **(c)** Sur $\left]0, +\infty\right[^{2}$, on peut écrire $\ln(xy) = \ln x + \ln y$, ce qui évite de dériver une composée : 
    $$\boxed{\frac{\partial f}{\partial x} = \ln(xy) + 1, \qquad \frac{\partial f}{\partial y} = \frac{x}{y}}$$

    **(d)** Sur $\mathbb{R}^{2}$, on dérive un produit, puis une composée : 
    $$\boxed{\frac{\partial f}{\partial x} = \mathrm{e}^{-x}\big(2x\cos(x^{2} + y^{2}) - \sin(x^{2} + y^{2})\big), \qquad \frac{\partial f}{\partial y} = 2y\,\mathrm{e}^{-x}\cos(x^{2} + y^{2})}$$

    **(e)** Sur $\mathbb{R}^{2}$, on obtient : 
    $$\boxed{\frac{\partial f}{\partial x} = \mathrm{e}^{x}\cos y, \qquad \frac{\partial f}{\partial y} = -\mathrm{e}^{x}\sin y}$$

    **(f)** Sur $\mathbb{R}^{2}$, la dérivée de $x \mapsto \cos(xy)$ est $-y\sin(xy)$ : 
    $$\boxed{\frac{\partial f}{\partial x} = 2x\cos(xy) - y(x^{2} + y^{2})\sin(xy), \qquad \frac{\partial f}{\partial y} = 2y\cos(xy) - x(x^{2} + y^{2})\sin(xy)}$$

    **(g)** Sur $\mathbb{R}^{2}$, avec la dérivée $\frac{1}{2\sqrt{v}}$ de la racine carrée : 
    $$\boxed{\frac{\partial f}{\partial x} = \frac{xy^{2}}{\sqrt{1 + x^{2}y^{2}}}, \qquad \frac{\partial f}{\partial y} = \frac{x^{2}y}{\sqrt{1 + x^{2}y^{2}}}}$$
     Les quatorze dérivées partielles ont été contrôlées par un calcul formel.

    *Piège.* En (c), l'erreur la plus répandue est d'oublier, en dérivant la composée $x \mapsto \ln(xy)$, le facteur $y$ qui provient de la dérivée de $x \mapsto xy$ : on écrit alors $\frac{1}{xy}$ au lieu de $\frac{y}{xy} = \frac{1}{x}$, et l'on obtient la valeur fausse $\ln(xy) + \frac{1}{y}$. La décomposition $\ln x + \ln y$ évite le piège.

    **2.** La fonction $f(x, y) = x\ln(xy)$ est de classe $\mathcal{C}^{1}$ sur $\left]0, +\infty\right[^{2}$, et le point $(1, 1, 0)$ est sur la surface, puisque $f(1, 1) = \ln 1 = 0$. La question 1 (c) donne $\frac{\partial f}{\partial x}(1, 1) = 0 + 1 = 1$ et $\frac{\partial f}{\partial y}(1, 1) = 1$. Par la définition de la section 22.3.4, le plan tangent a pour équation $z - 0 = 1 \cdot (x - 1) + 1 \cdot (y - 1)$ : 
    $$\boxed{z = x + y - 2}$$
     Le vecteur $(1, 1, -1)$ est normal à ce plan. Au voisinage de $(1, 1)$, on a donc $x\ln(xy) \approx (x - 1) + (y - 1)$ : une petite augmentation de $x$ ou de $y$ fait croître $f$ à la même vitesse, alors que les rôles de $x$ et de $y$ dans la formule ne sont pas symétriques.
- id: "ma-22-06"
  feuille: "f-ma-22"
  numero: 6
  partie: "Dérivées partielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles, continuité, fonctions de classe C1]
  noeuds: [gd-differentielle, c-sequentielle, gd-classe-ck]
  notions: [derivee-partielle]
  page_enonce: 2
  page_corrige: 7
  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction continue. Montrer que la fonction $\varphi : (x, y) \mapsto \int_{x}^{y} f(t)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et calculer ses dérivées partielles.

    **2.** Même question pour la fonction $(x, y) \mapsto \int_{x - y}^{x + y} f(t)\,\mathrm{d} t$.
  corrige: |
    **1.** Comme $f$ est continue sur $\mathbb{R}$, le théorème fondamental de l'analyse (chapitre 18, théorème 6) dit que $F : x \mapsto \int_{0}^{x} f(t)\,\mathrm{d} t$ est une primitive de $f$, de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. La relation de Chasles donne, pour tous réels $x$ et $y$, 
    $$\varphi(x, y) = \int_{x}^{y} f(t)\,\mathrm{d} t = F(y) - F(x).$$
     À $y$ fixé, $x \mapsto F(y) - F(x)$ est dérivable, de dérivée $-f(x)$ ; à $x$ fixé, $y \mapsto F(y) - F(x)$ est dérivable, de dérivée $f(y)$. 
    $$\boxed{\frac{\partial \varphi}{\partial x}(x, y) = -f(x), \qquad \frac{\partial \varphi}{\partial y}(x, y) = f(y)}$$
     Ces deux fonctions sont continues sur $\mathbb{R}^{2}$, comme composées de $f$, continue, et d'une fonction coordonnée (proposition 4 (i) et (iii)) : $\varphi$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.

    **2.** De même, $\psi(x, y) = \int_{x - y}^{x + y} f(t)\,\mathrm{d} t = F(x + y) - F(x - y)$. À $y$ fixé, la dérivée d'une composée (chapitre 9, théorème 2) donne la dérivée $f(x + y) - f(x - y)$ ; à $x$ fixé, la dérivée de $y \mapsto x - y$ vaut $-1$, et l'on obtient $f(x + y) - f(x - y) \times (-1)$. 
    $$\boxed{\frac{\partial \psi}{\partial x}(x, y) = f(x + y) - f(x - y), \qquad \frac{\partial \psi}{\partial y}(x, y) = f(x + y) + f(x - y)}$$
     Ces fonctions sont continues sur $\mathbb{R}^{2}$ par la proposition 4, et $\psi$ est de classe $\mathcal{C}^{1}$. Pour $f = 1$, on a $\psi(x, y) = 2y$, de dérivées partielles $0$ et $2$ ✓.

    *Piège.* L'erreur la plus répandue est d'oublier le signe moins qui vient de la borne inférieure : dériver une intégrale par rapport à sa borne inférieure donne $-f$, et non $f$. Le second signe moins, celui de la dérivée de $x - y$ par rapport à $y$, compense le premier dans $\frac{\partial \psi}{\partial y}$.
- id: "ma-22-07"
  feuille: "f-ma-22"
  numero: 7
  partie: "Dérivées partielles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [dérivées partielles, continuité]
  noeuds: [gd-differentielle, c-sequentielle]
  notions: [derivee-partielle]
  page_enonce: 2
  page_corrige: 7
  enonce: |
    On pose $f(x, y) = \dfrac{x^{2}}{(x^{2} + y^{2})^{3/4}}$ pour $(x, y) \neq (0, 0)$.

    **1.** Montrer que $f$ se prolonge en une fonction continue sur $\mathbb{R}^{2}$ ; on note encore $f$ ce prolongement.

    **2.** La fonction $f$ admet-elle des dérivées partielles en $(0, 0)$ ?

    **3.** Comparer avec la proposition 5 du cours : que montrent ces deux exemples réunis ?
  corrige: |
    **1.** La fonction est continue sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ par la proposition 4. Pour $(x, y) \neq (0, 0)$, on a $x^{2} \leqslant \rho^{2}$, donc 
    $$|f(x, y)| \leqslant \frac{\rho^{2}}{\rho^{3/2}} = \rho^{1/2}.$$
     En posant $f(0, 0) = 0$, le réel $\delta = \varepsilon^{2}$ convient dans la définition de la continuité en $(0, 0)$. 
    $$\boxed{f \text{ se prolonge en une fonction continue sur } \mathbb{R}^{2}, \text{ avec } f(0, 0) = 0}$$

    **2.** Pour $t \neq 0$, on a $f(t, 0) = \frac{t^{2}}{|t|^{3/2}} = |t|^{1/2}$, et le taux d'accroissement 
    $$\frac{f(t, 0) - f(0, 0)}{t} = \frac{|t|^{1/2}}{t}$$
     vaut $\frac{1}{\sqrt{t}}$ pour $t > 0$ : il tend vers $+\infty$, et n'a pas de limite finie. En revanche, $f(0, t) = 0$ pour tout $t$. 
    $$\boxed{\frac{\partial f}{\partial x}(0, 0) \text{ n'existe pas}, \qquad \frac{\partial f}{\partial y}(0, 0) = 0}$$
     L'application partielle $t \mapsto |t|^{1/2}$ a une tangente verticale en $0$, comme la racine carrée en $0$ (chapitre 9).

    **3.** La proposition 5 exhibe une fonction qui admet des dérivées partielles en $(0, 0)$ sans y être continue ; la fonction $f$ de cet exercice est continue en $(0, 0)$ sans y admettre de dérivée partielle par rapport à $x$. 
    $$\boxed{\text{En deux variables, ni la continuité ni l'existence des dérivées partielles n'entraîne l'autre}}$$
     En une variable, au contraire, la dérivabilité entraîne la continuité (chapitre 9, proposition 1). La bonne hypothèse, en deux variables, est la classe $\mathcal{C}^{1}$, qui entraîne la continuité (proposition 7) : c'est elle qui joue le rôle de la dérivabilité, et non la simple existence des dérivées partielles. La fonction norme, continue et sans dérivées partielles en $(0, 0)$ (section 22.3.1), est un exemple du même type que $f$.
- id: "ma-22-08"
  feuille: "f-ma-22"
  numero: 8
  partie: "Dérivées partielles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [dérivées partielles, ouverts du plan, fonctions de classe C1, gradient, courbes définies implicitement]
  noeuds: [gd-differentielle, tr-ouverts, gd-classe-ck]
  notions: [derivee-partielle, ouvert, gradient]
  page_enonce: 2
  page_corrige: 8
  enonce: |
    Soit $f$ une fonction de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.

    **1.** Montrer que $\frac{\partial f}{\partial y} = 0$ sur $\mathbb{R}^{2}$ si et seulement s'il existe une fonction $h$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ telle que $f(x, y) = h(x)$ pour tout $(x, y) \in \mathbb{R}^{2}$.

    **2.** En déduire que, si $\nabla f = 0$ sur $\mathbb{R}^{2}$, alors $f$ est constante.

    **3.** Montrer de même que, si $\frac{\partial f}{\partial x}$ et $\frac{\partial f}{\partial y}$ sont constantes sur $\mathbb{R}^{2}$, alors $f$ est affine, c'est-à-dire de la forme $(x, y) \mapsto \alpha x + \beta y + \gamma$.

    **4.** Donner un exemple d'ouvert $U$ de $\mathbb{R}^{2}$ et de fonction $f$ de classe $\mathcal{C}^{1}$ sur $U$, non constante, telle que $\nabla f = 0$ sur $U$.
  corrige: |
    **1.** Supposons d'abord $f(x, y) = h(x)$, avec $h$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. À $x$ fixé, l'application partielle $y \mapsto h(x)$ est constante, de dérivée nulle : $\frac{\partial f}{\partial y} = 0$.

    Réciproquement, supposons $\frac{\partial f}{\partial y} = 0$ sur $\mathbb{R}^{2}$, et fixons $x \in \mathbb{R}$. L'application partielle $y \mapsto f(x, y)$ est dérivable sur l'*intervalle* $\mathbb{R}$, de dérivée $\frac{\partial f}{\partial y}(x, y) = 0$ ; par le chapitre 9, théorème 7 (i), elle est constante, et $f(x, y) = f(x, 0)$ pour tout $y$. Posons $h(x) = f(x, 0)$. L'application $h$ est l'application partielle de $f$ en $(x, 0)$ par rapport à la première variable : elle est dérivable, de dérivée $h'(x) = \frac{\partial f}{\partial x}(x, 0)$, qui est continue par la proposition 4 (iv), comme composée de la fonction continue $\frac{\partial f}{\partial x}$ et de $x \mapsto (x, 0)$. Ainsi $h$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. 
    $$\boxed{\frac{\partial f}{\partial y} = 0 \text{ sur } \mathbb{R}^{2} \iff \exists h \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R}),\ \forall (x, y) \in \mathbb{R}^{2},\ f(x, y) = h(x)}$$

    **2.** Si $\nabla f = 0$, la question 1 donne $f(x, y) = h(x)$, avec $h'(x) = \frac{\partial f}{\partial x}(x, 0) = 0$ pour tout $x$. Le théorème 7 (i) du chapitre 9, appliqué à $h$ sur $\mathbb{R}$, montre que $h$ est constante, donc $f$ aussi. 
    $$\boxed{\nabla f = 0 \text{ sur } \mathbb{R}^{2} \implies f \text{ constante}}$$

    **3.** Supposons $\frac{\partial f}{\partial x} = \alpha$ et $\frac{\partial f}{\partial y} = \beta$ sur $\mathbb{R}^{2}$, avec $\alpha$, $\beta$ réels. La fonction $g : (x, y) \mapsto f(x, y) - \alpha x - \beta y$ est de classe $\mathcal{C}^{1}$ par la proposition 6, et 
    $$\frac{\partial g}{\partial x} = \alpha - \alpha = 0, \qquad \frac{\partial g}{\partial y} = \beta - \beta = 0.$$
     Par la question 2, $g$ est constante, égale à un réel $\gamma$. 
    $$\boxed{f(x, y) = \alpha x + \beta y + \gamma \text{ pour tout } (x, y) \in \mathbb{R}^{2}}$$
     C'est l'analogue de l'énoncé du chapitre 9 selon lequel une fonction de dérivée constante sur un intervalle est affine ; on s'y est ramené en retranchant une solution particulière, $\alpha x + \beta y$.

    **4.** Prenons $U = \{(x, y) \in \mathbb{R}^{2} \mid x \neq 0\}$, le plan privé de l'axe des ordonnées, qui est un ouvert par la proposition 4 (v), et 
    $$f(x, y) = \begin{cases} 1 & \text{si } x > 0, \\ 0 & \text{si } x < 0. \end{cases}$$
     Soit $(x_{0}, y_{0}) \in U$, avec par exemple $x_{0} > 0$. L'application partielle $x \mapsto f(x, y_{0})$ vaut $1$ sur l'intervalle ouvert $\left]0, +\infty\right[$, qui contient $x_{0}$ : sa dérivée en $x_{0}$ est nulle. L'application partielle $y \mapsto f(x_{0}, y)$ est constante sur $\mathbb{R}$. Le cas $x_{0} < 0$ est identique. Les dérivées partielles sont donc nulles, donc continues, sur $U$ : 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ sur } U, \ \nabla f = 0 \text{ sur } U, \text{ et } f \text{ n'est pas constante}}$$
     *À retenir.* Les questions 1 et 2 utilisent, à travers le théorème 7 du chapitre 9, que $y$ décrit un *intervalle* à $x$ fixé, puis que $x$ décrit un intervalle. Sur un ouvert en deux morceaux, comme $U$, une fonction de gradient nul peut prendre une valeur différente sur chaque morceau, exactement comme la fonction égale à $1$ sur $\left]0, +\infty\right[$ et à $0$ sur $\left]-\infty, 0\right[$, de dérivée nulle sans être constante. L'assertion 10 de l'exercice 34 montrera que $\mathbb{R}^{2} \setminus \{(0, 0)\}$, qui est d'un seul tenant, se comporte comme $\mathbb{R}^{2}$.
- id: "ma-22-09"
  feuille: "f-ma-22"
  numero: 9
  partie: "Dérivées partielles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [derivee-partielle]
  page_enonce: 2
  page_corrige: 9
  enonce: |
    Déterminer, dans chacun des cas suivants, toutes les fonctions $f$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ qui vérifient, pour tout $(x, y) \in \mathbb{R}^{2}$, les deux égalités indiquées. 
    $$\text{(a)}\ \ \frac{\partial f}{\partial x} = xy^{2},\ \ \frac{\partial f}{\partial y} = x^{2}y \qquad\quad \text{(b)}\ \ \frac{\partial f}{\partial x} = y\,\mathrm{e}^{x},\ \ \frac{\partial f}{\partial y} = \mathrm{e}^{x} + 2y \qquad\quad \text{(c)}\ \ \frac{\partial f}{\partial x} = x^{2}y,\ \ \frac{\partial f}{\partial y} = xy^{2}$$
  corrige: |
    On cherche d'abord une solution particulière $f_{0}$, en intégrant la première équation par rapport à $x$, puis en ajustant à l'aide de la seconde. Si $f$ est une autre solution, la fonction $f - f_{0}$, de classe $\mathcal{C}^{1}$, a un gradient nul sur $\mathbb{R}^{2}$, et elle est constante par l'exercice 8, question 2 : les solutions sont exactement les fonctions $f_{0} + C$, avec $C$ réel.

    **(a)** Si $f$ convient, à $y$ fixé, la fonction $x \mapsto f(x, y) - \frac{x^{2}y^{2}}{2}$ a une dérivée nulle sur $\mathbb{R}$, donc elle est constante (chapitre 9, théorème 7) : $f(x, y) = \frac{x^{2}y^{2}}{2} + k(y)$, avec $k(y) = f(0, y)$. La fonction $k$ est dérivable, de dérivée $\frac{\partial f}{\partial y}(0, y)$, et la seconde équation devient $x^{2}y + k'(y) = x^{2}y$, d'où $k' = 0$. La fonction $f_{0} = \frac{x^{2}y^{2}}{2}$ convient, et l'on conclut par le principe ci-dessus. 
    $$\boxed{f(x, y) = \frac{x^{2}y^{2}}{2} + C, \quad C \in \mathbb{R}}$$

    **(b)** De même, la première équation donne $f(x, y) = y\,\mathrm{e}^{x} + k(y)$, et la seconde devient alors $\mathrm{e}^{x} + k'(y) = \mathrm{e}^{x} + 2y$, d'où $k'(y) = 2y$. La fonction $f_{0}$ définie par $f_{0}(x, y) = y\,\mathrm{e}^{x} + y^{2}$ convient : 
    $$\boxed{f(x, y) = y\,\mathrm{e}^{x} + y^{2} + C, \quad C \in \mathbb{R}}$$

    **(c)** Supposons qu'une fonction $f$ convienne. Comme en (a), la première équation donne l'existence d'une fonction $k$ dérivable telle que $f(x, y) = \frac{x^{3}y}{3} + k(y)$ pour tous $x$, $y$, et la seconde s'écrit 
    $$\frac{x^{3}}{3} + k'(y) = xy^{2} \quad \text{pour tous réels } x, y.$$
     Avec $y = 0$, on obtient $k'(0) = -\frac{x^{3}}{3}$ pour tout $x$, ce qui est absurde : $x = 0$ et $x = 1$ donnent $k'(0) = 0$ et $k'(0) = -\frac{1}{3}$. 
    $$\boxed{\text{(c) n'a aucune solution}}$$
     *Piège.* Un couple de fonctions $(P, Q)$ n'est pas toujours le gradient d'une fonction, contrairement à une fonction d'une variable continue, qui a toujours une primitive (chapitre 18). L'erreur la plus répandue est d'intégrer séparément chaque équation, d'écrire $f = \frac{x^{3}y}{3} + \frac{xy^{3}}{3}$ en « recollant » les morceaux, sans vérifier : cette fonction a pour dérivée partielle par rapport à $x$ la fonction $x^{2}y + \frac{y^{3}}{3}$, et non $x^{2}y$. Il faut toujours réinjecter la candidate dans les deux équations.
- id: "ma-22-10"
  feuille: "f-ma-22"
  numero: 10
  partie: "Dérivées partielles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [derivee-partielle]
  page_enonce: 3
  page_corrige: 10
  enonce: |
    Les fonctions $f$ définies ci-dessous sont-elles de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ ? On donne l'expression de $f(x, y)$ ; dans les quatre derniers cas, elle vaut pour $(x, y) \neq (0, 0)$, et l'on pose $f(0, 0) = 0$.

    **(a)** $|x|\,y$

    **(b)** $\lVert (x, y) \rVert\sin(x + y)$

    **(c)** $\dfrac{\sin(x^{3}y)}{x^{2} + y^{2}}$

    **(d)** $x^{2}y^{2}\ln(x^{2} + y^{2})$

    **(e)** $\dfrac{x(x^{2} - y^{2})}{x^{2} + y^{2}}$

    **(f)** $\exp\Big(-\dfrac{1}{x^{2} + y^{2}}\Big)$
  corrige: |
    **(a)** Soit $y_{0} \neq 0$. L'application partielle $t \mapsto f(t, y_{0}) = |t|\,y_{0}$ a, en $0$, un taux d'accroissement $\frac{|t|\,y_{0}}{t}$ égal à $y_{0}$ pour $t > 0$ et à $-y_{0}$ pour $t < 0$ : il n'a pas de limite, et $f$ n'admet pas de dérivée partielle par rapport à $x$ au point $(0, y_{0})$. 
    $$\boxed{\text{(a) n'est pas de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     Elle l'est en revanche sur l'ouvert $\{x \neq 0\}$, où $|x|$ coïncide localement avec $x$ ou $-x$ ; en $(0, 0)$, ses deux dérivées partielles existent et sont nulles, puisque $f(t, 0) = f(0, t) = 0$. Le défaut est sur l'axe des ordonnées privé de l'origine, et non à l'origine.

    **(b)** Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, la fonction est de classe $\mathcal{C}^{1}$ par la proposition 6, puisque la norme l'est (section 22.3.2), et 
    $$\frac{\partial f}{\partial x}(x, y) = \frac{x}{\rho}\sin(x + y) + \rho\cos(x + y), \qquad \frac{\partial f}{\partial y}(x, y) = \frac{y}{\rho}\sin(x + y) + \rho\cos(x + y).$$
     En $(0, 0)$, on a $f(t, 0) = |t|\sin t$, et le taux $\frac{|t|\sin t}{t}$ est majoré en valeur absolue par $|\sin t| \leqslant |t|$ : il tend vers $0$, et $\frac{\partial f}{\partial x}(0, 0) = 0$. De même, $\frac{\partial f}{\partial y}(0, 0) = 0$. Pour la continuité en $(0, 0)$, on utilise $|x| \leqslant \rho$, $|\sin u| \leqslant |u|$ et $|x + y| \leqslant |x| + |y| \leqslant 2\rho$ (proposition 1) : 
    $$\Big|\frac{\partial f}{\partial x}(x, y)\Big| \leqslant |\sin(x + y)| + \rho \leqslant 3\rho,$$
     qui tend vers $0$ avec $\rho$ ; de même pour $\frac{\partial f}{\partial y}$. 
    $$\boxed{\text{(b) est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     La norme seule n'admet pas de dérivées partielles en $(0, 0)$ ; le facteur $\sin(x + y)$, qui s'annule en ce point, « efface » la pointe du cône.

    **(c)** Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, la fonction est de classe $\mathcal{C}^{1}$, et 
    $$\frac{\partial f}{\partial x} = \frac{3x^{2}y\cos(x^{3}y)}{\rho^{2}} - \frac{2x\sin(x^{3}y)}{\rho^{4}}, \qquad \frac{\partial f}{\partial y} = \frac{x^{3}\cos(x^{3}y)}{\rho^{2}} - \frac{2y\sin(x^{3}y)}{\rho^{4}}.$$
     En $(0, 0)$, les applications partielles $t \mapsto f(t, 0)$ et $t \mapsto f(0, t)$ sont nulles, et les deux dérivées partielles sont nulles. Avec $|\sin(x^{3}y)| \leqslant |x|^{3}|y|$, $x^{2} \leqslant \rho^{2}$ et $x^{2}y^{2} \leqslant \rho^{4}$, on obtient 
    $$\Big|\frac{\partial f}{\partial x}\Big| \leqslant 3|y| + \frac{2x^{4}|y|}{\rho^{4}} \leqslant 5|y| \leqslant 5\rho, \qquad \Big|\frac{\partial f}{\partial y}\Big| \leqslant |x| + \frac{2|x|\,x^{2}y^{2}}{\rho^{4}} \leqslant 3|x| \leqslant 3\rho.$$

    $$\boxed{\text{(c) est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$

    **(d)** Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, la fonction est de classe $\mathcal{C}^{1}$, et 
    $$\frac{\partial f}{\partial x}(x, y) = 2xy^{2}\ln(x^{2} + y^{2}) + \frac{2x^{3}y^{2}}{x^{2} + y^{2}},$$
     l'expression de $\frac{\partial f}{\partial y}$ s'obtenant en échangeant $x$ et $y$, puisque $f(x, y) = f(y, x)$. En $(0, 0)$, les applications partielles sont nulles, et les dérivées partielles aussi. Avec $|x|, |y| \leqslant \rho$, $\ln(\rho^{2}) = 2\ln\rho$ et $y^{2} \leqslant \rho^{2}$, on a 
    $$\Big|\frac{\partial f}{\partial x}(x, y)\Big| \leqslant 4\rho^{3}|\ln\rho| + 2\rho^{3},$$
     qui tend vers $0$ quand $\rho$ tend vers $0$, par croissances comparées (chapitre 10, proposition 2). 
    $$\boxed{\text{(d) est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$

    **(e)** En $(0, 0)$, on a $f(t, 0) = t$ et $f(0, t) = 0$, donc $\frac{\partial f}{\partial x}(0, 0) = 1$ et $\frac{\partial f}{\partial y}(0, 0) = 0$. Hors de l'origine, le calcul donne 
    $$\frac{\partial f}{\partial x}(x, y) = \frac{x^{4} + 4x^{2}y^{2} - y^{4}}{(x^{2} + y^{2})^{2}}, \qquad\text{donc}\qquad \frac{\partial f}{\partial x}(0, y) = -1 \text{ pour } y \neq 0.$$
     La suite $\big(0, \frac{1}{n}\big)$ tend vers $(0, 0)$, et $\frac{\partial f}{\partial x}\big(0, \frac{1}{n}\big) = -1$ ne tend pas vers $\frac{\partial f}{\partial x}(0, 0) = 1$ : la dérivée partielle $\frac{\partial f}{\partial x}$ n'est pas continue en $(0, 0)$. 
    $$\boxed{\text{(e) n'est pas de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     La fonction est pourtant continue sur $\mathbb{R}^{2}$, puisque $|f(x, y)| \leqslant |x|$, et elle admet des dérivées partielles en tout point : c'est la continuité des dérivées partielles qui fait défaut.

    **(f)** En $(0, 0)$, on a $f(t, 0) = f(0, t) = \mathrm{e}^{-1/t^{2}}$, et, avec $v = \frac{1}{t^{2}}$, le taux d'accroissement vérifie $\Big|\frac{\mathrm{e}^{-1/t^{2}}}{t}\Big| = \sqrt{v}\,\mathrm{e}^{-v}$, qui tend vers $0$ quand $t$ tend vers $0$ par croissances comparées : les deux dérivées partielles sont nulles en $(0, 0)$. Hors de l'origine, 
    $$\frac{\partial f}{\partial x}(x, y) = \frac{2x}{\rho^{4}}\,\mathrm{e}^{-1/\rho^{2}}, \qquad\text{donc}\qquad \Big|\frac{\partial f}{\partial x}(x, y)\Big| \leqslant \frac{2}{\rho^{3}}\,\mathrm{e}^{-1/\rho^{2}} = 2w^{3/2}\mathrm{e}^{-w}, \quad w = \frac{1}{\rho^{2}},$$
     qui tend vers $0$ quand $\rho$ tend vers $0$, c'est-à-dire quand $w$ tend vers $+\infty$ ; de même pour $\frac{\partial f}{\partial y}$. 
    $$\boxed{\text{(f) est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
     C'est la version radiale de la fonction $x \mapsto \mathrm{e}^{-1/x^{2}}$, si plate en $0$ que toutes ses dérivées y sont nulles.

    *À retenir.* Dans les cas (b), (c), (d), (f), la majoration de la dérivée partielle par une fonction de $\rho$ qui tend vers $0$ établit à la fois que la limite existe et qu'elle vaut la dérivée partielle en $(0, 0)$, calculée séparément. L'erreur la plus répandue est de sauter ce calcul séparé, en « prolongeant par continuité » l'expression de $\frac{\partial f}{\partial x}$ obtenue hors de l'origine : en (e), on aurait obtenu une valeur sans signification, puisque cette expression n'a pas de limite en $(0, 0)$, et l'on manquait la vraie valeur, $1$.
- id: "ma-22-11"
  feuille: "f-ma-22"
  numero: 11
  partie: "Dérivées partielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivées partielles, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [derivee-partielle]
  page_enonce: 3
  page_corrige: 11
  enonce: |
    On pose $f(x, y) = (x^{2} + y^{2})\sin\Big(\dfrac{1}{\sqrt{x^{2} + y^{2}}}\Big)$ pour $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$.

    **1.** Montrer que $f$ admet des dérivées partielles en tout point de $\mathbb{R}^{2}$, et les calculer.

    **2.** Montrer que $f(h, k) = o\big(\lVert (h, k) \rVert\big)$ quand $(h, k)$ tend vers $(0, 0)$ : $f$ vérifie en $(0, 0)$ la conclusion du théorème 1 du cours.

    **3.** Montrer que $f$ n'est pourtant pas de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$. Quel exemple du chapitre 9 prolonge-t-on ainsi ?
  corrige: |
    **1.** Sur l'ouvert $\mathbb{R}^{2} \setminus \{(0, 0)\}$, la fonction est de classe $\mathcal{C}^{1}$ par la proposition 6, puisque $\rho$ y est de classe $\mathcal{C}^{1}$ et ne s'annule pas. Avec $\frac{\partial \rho}{\partial x} = \frac{x}{\rho}$, la dérivée de $x \mapsto \sin\frac{1}{\rho}$ vaut $-\frac{x}{\rho^{3}}\cos\frac{1}{\rho}$, et l'on obtient 
    $$\boxed{\frac{\partial f}{\partial x}(x, y) = 2x\sin\frac{1}{\rho} - \frac{x}{\rho}\cos\frac{1}{\rho}, \qquad \frac{\partial f}{\partial y}(x, y) = 2y\sin\frac{1}{\rho} - \frac{y}{\rho}\cos\frac{1}{\rho}}$$
     En $(0, 0)$, on a $f(t, 0) = t^{2}\sin\frac{1}{|t|}$ pour $t \neq 0$, et le taux d'accroissement $t\sin\frac{1}{|t|}$ est majoré en valeur absolue par $|t|$ : il tend vers $0$. Il en va de même pour $t \mapsto f(0, t)$. 
    $$\boxed{\frac{\partial f}{\partial x}(0, 0) = \frac{\partial f}{\partial y}(0, 0) = 0}$$

    **2.** Pour $H = (h, k) \neq (0, 0)$, on a $|f(H)| \leqslant \lVert H \rVert^{2}$, puisque $|\sin| \leqslant 1$. Posons $\varepsilon(H) = \frac{f(H)}{\lVert H \rVert}$ pour $H \neq 0$ et $\varepsilon(0) = 0$ : on a $|\varepsilon(H)| \leqslant \lVert H \rVert$, donc $\varepsilon$ est continue en $0$ et nulle en $0$, et $f(H) = \lVert H \rVert\,\varepsilon(H)$. Comme $f(0, 0) = 0$ et que les dérivées partielles sont nulles en $(0, 0)$, c'est exactement 
    $$\boxed{f(h, k) = f(0, 0) + \frac{\partial f}{\partial x}(0, 0)\,h + \frac{\partial f}{\partial y}(0, 0)\,k + o\big(\lVert (h, k) \rVert\big)}$$
     la conclusion du théorème 1 en $(0, 0)$.

    **3.** Pour $t > 0$, la question 1 donne 
    $$\frac{\partial f}{\partial x}(t, 0) = 2t\sin\frac{1}{t} - \cos\frac{1}{t}.$$
     Avec $t_{n} = \frac{1}{2n\pi}$, on obtient $\frac{\partial f}{\partial x}(t_{n}, 0) = -1$ ; avec $s_{n} = \frac{1}{(2n + 1)\pi}$, on obtient $\frac{\partial f}{\partial x}(s_{n}, 0) = 1$. Les deux suites de points $(t_{n}, 0)$ et $(s_{n}, 0)$ tendent vers $(0, 0)$, et les valeurs de $\frac{\partial f}{\partial x}$ ne tendent pas vers $\frac{\partial f}{\partial x}(0, 0) = 0$ : la dérivée partielle n'est pas continue en $(0, 0)$ (proposition 3). 
    $$\boxed{f \text{ n'est pas de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$

    ![Figure](documents/figures/01f22ee766df66a7.svg)

    La courbe représente $t \mapsto \frac{\partial f}{\partial x}(t, 0)$, fonction impaire de $t$ ; ses oscillations entre des valeurs proches de $-1$ et de $1$ deviennent infiniment rapides près de $0$, et la bande ocre, où l'on n'a pas tracé la courbe, est entièrement balayée. La valeur $0$ prise en $t = 0$ n'est la limite d'aucune de ces oscillations.

    Pour $x > 0$, l'application partielle $x \mapsto f(x, 0) = x^{2}\sin\frac{1}{x}$ est exactement la fonction $g$ du chapitre 9 (section 9.2, et remarque qui suit le théorème 8), dérivable en $0$ sans que sa dérivée $g'(x) = 2x\sin\frac{1}{x} - \cos\frac{1}{x}$ y ait de limite. La fonction $f$ est la « version radiale » de cet exemple : $f(x, y) = g(\rho)$.

    *À retenir.* Le théorème 1 donne une condition *suffisante*, la classe $\mathcal{C}^{1}$, pour que $f$ admette un développement limité à l'ordre 1 ; cet exemple montre qu'elle n'est pas nécessaire. La notion exacte, celle de fonction différentiable, sera étudiée en seconde année, comme l'annonce la dernière remarque de la section 22.3.3.
- id: "ma-22-12"
  feuille: "f-ma-22"
  numero: 12
  partie: "Dérivées partielles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivées partielles, continuité, fonctions de classe C1]
  noeuds: [gd-differentielle, c-sequentielle, gd-classe-ck]
  notions: [derivee-partielle]
  page_enonce: 3
  page_corrige: 13
  enonce: |
    On pose $f(x, y) = \dfrac{xy(x^{2} - y^{2})}{x^{2} + y^{2}}$ pour $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est continue sur $\mathbb{R}^{2}$.

    **2.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.

    **3.** Calculer les dérivées en $0$ de $y \mapsto \frac{\partial f}{\partial x}(0, y)$ et de $x \mapsto \frac{\partial f}{\partial y}(x, 0)$. Que constate-t-on ?
  corrige: |
    **1.** La fonction est continue sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$ par la proposition 4. Pour $(x, y) \neq (0, 0)$, on a $|x^{2} - y^{2}| \leqslant x^{2} + y^{2}$ et $|xy| \leqslant \frac{\rho^{2}}{2}$, donc 
    $$|f(x, y)| \leqslant |xy| \leqslant \frac{\rho^{2}}{2},$$
     qui tend vers $0$ avec $\rho$ : 
    $$\boxed{f \text{ est continue sur } \mathbb{R}^{2}}$$

    **2.** Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, la fonction est de classe $\mathcal{C}^{1}$ par la proposition 6, et le calcul donne 
    $$\frac{\partial f}{\partial x}(x, y) = \frac{y\,(x^{4} + 4x^{2}y^{2} - y^{4})}{(x^{2} + y^{2})^{2}}, \qquad \frac{\partial f}{\partial y}(x, y) = \frac{x\,(x^{4} - 4x^{2}y^{2} - y^{4})}{(x^{2} + y^{2})^{2}}.$$
     En $(0, 0)$, les applications partielles $t \mapsto f(t, 0)$ et $t \mapsto f(0, t)$ sont nulles, et les deux dérivées partielles sont nulles. Comme 
    $$x^{4} + 4x^{2}y^{2} + y^{4} = 2(x^{2} + y^{2})^{2} - (x^{4} + y^{4}) \leqslant 2\rho^{4},$$
     on a $\Big|\frac{\partial f}{\partial x}(x, y)\Big| \leqslant 2|y| \leqslant 2\rho$ et, de même, $\Big|\frac{\partial f}{\partial y}(x, y)\Big| \leqslant 2|x| \leqslant 2\rho$, qui tendent vers $0$ avec $\rho$ : les dérivées partielles sont continues en $(0, 0)$. 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$

    **3.** Pour $y \neq 0$, la formule de la question 2 donne $\frac{\partial f}{\partial x}(0, y) = \frac{y \cdot (-y^{4})}{y^{4}} = -y$, égalité encore vraie pour $y = 0$. De même, $\frac{\partial f}{\partial y}(x, 0) = \frac{x \cdot x^{4}}{x^{4}} = x$ pour tout $x$. Les deux fonctions $y \mapsto -y$ et $x \mapsto x$ sont dérivables en $0$ : 
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} y}\Big(\frac{\partial f}{\partial x}(0, y)\Big)\Big|_{y = 0} = -1, \qquad \frac{\mathrm{d}}{\mathrm{d} x}\Big(\frac{\partial f}{\partial y}(x, 0)\Big)\Big|_{x = 0} = 1}$$
     On constate que les deux nombres sont différents : dériver par rapport à $x$, puis par rapport à $y$, ne donne pas le même résultat que dériver dans l'ordre inverse.

    *À retenir.* Pour les fonctions usuelles, par exemple polynomiales, les deux calculs donnent le même nombre, et l'on serait tenté de croire que l'ordre des dérivations est indifférent. Cet exemple montre que ce n'est pas automatique, même pour une fonction de classe $\mathcal{C}^{1}$. Une hypothèse de régularité plus forte, étudiée en seconde année, garantit l'égalité ; l'exemple montre qu'elle n'est pas superflue.
- id: "ma-22-13"
  feuille: "f-ma-22"
  numero: 13
  partie: "Dérivées partielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivées partielles, fonctions de classe C1, gradient]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [derivee-partielle, gradient]
  page_enonce: 3
  page_corrige: 13
  enonce: |
    *Équations de Cauchy-Riemann.* Soit $P \in \mathbb{C}[X]$. On définit sur $\mathbb{R}^{2}$ les deux fonctions 
    $$f : (x, y) \mapsto \operatorname{Re} P(x + \mathrm{i} y) \qquad\text{et}\qquad g : (x, y) \mapsto \operatorname{Im} P(x + \mathrm{i} y).$$
     Montrer que $f$ et $g$ sont de classe $\mathcal{C}^{1}$ et vérifient, en tout point de $\mathbb{R}^{2}$, 
    $$\frac{\partial f}{\partial x} = \frac{\partial g}{\partial y} \qquad\text{et}\qquad \frac{\partial f}{\partial y} = -\frac{\partial g}{\partial x}.$$
     On pourra commencer par le cas où $P = X^{n}$, et dériver $t \mapsto (t + \mathrm{i} y)^{n}$ et $t \mapsto (x + \mathrm{i} t)^{n}$ comme des fonctions à valeurs complexes (chapitre 9). En déduire que les gradients de $f$ et de $g$ sont orthogonaux en tout point.
  corrige: |
    $\triangleright$ *Dérivées des puissances.* Soit $n \in \mathbb{N}$ et $y \in \mathbb{R}$ fixés. Montrons par récurrence sur $n$ que la fonction à valeurs complexes $t \mapsto (t + \mathrm{i} y)^{n}$ est dérivable sur $\mathbb{R}$, de dérivée $n(t + \mathrm{i} y)^{n-1}$, la dérivée étant nulle pour $n = 0$. C'est clair pour $n = 0$ et $n = 1$. Si c'est vrai au rang $n$, la dérivée d'un produit, valable pour les fonctions à valeurs complexes (chapitre 9, proposition 5 et théorème 1), donne 
    $$\big((t + \mathrm{i} y)^{n}(t + \mathrm{i} y)\big)' = n(t + \mathrm{i} y)^{n-1}(t + \mathrm{i} y) + (t + \mathrm{i} y)^{n} = (n + 1)(t + \mathrm{i} y)^{n}.$$
     De même, pour $x$ fixé, la fonction $t \mapsto x + \mathrm{i} t$ a pour dérivée $\mathrm{i}$, et la même récurrence montre que $t \mapsto (x + \mathrm{i} t)^{n}$ a pour dérivée $n\mathrm{i}(x + \mathrm{i} t)^{n-1}$.

    $\triangleright$ *Cas d'un polynôme quelconque.* Soit $P = \sum_{k=0}^{d} a_{k}X^{k}$ et $P' = \sum_{k=1}^{d} k a_{k}X^{k-1}$ son polynôme dérivé (chapitre 13). Par linéarité de la dérivation, en notant $z = x + \mathrm{i} y$, 
    $$\frac{\mathrm{d}}{\mathrm{d} t}P(t + \mathrm{i} y)\Big|_{t = x} = P'(z), \qquad \frac{\mathrm{d}}{\mathrm{d} t}P(x + \mathrm{i} t)\Big|_{t = y} = \mathrm{i} P'(z).$$
     Par définition de la dérivée d'une fonction à valeurs complexes, $(\operatorname{Re} \varphi)' = \operatorname{Re}(\varphi')$ et $(\operatorname{Im} \varphi)' = \operatorname{Im}(\varphi')$. Les applications partielles de $f$ et $g$ sont les parties réelle et imaginaire de $t \mapsto P(t + \mathrm{i} y)$ et $t \mapsto P(x + \mathrm{i} t)$, donc 
    $$\frac{\partial f}{\partial x} = \operatorname{Re} P'(z), \qquad \frac{\partial g}{\partial x} = \operatorname{Im} P'(z),$$

    $$\frac{\partial f}{\partial y} = \operatorname{Re}\big(\mathrm{i} P'(z)\big) = -\operatorname{Im} P'(z), \qquad \frac{\partial g}{\partial y} = \operatorname{Im}\big(\mathrm{i} P'(z)\big) = \operatorname{Re} P'(z).$$
     En développant $(x + \mathrm{i} y)^{k}$ par la formule du binôme, on voit que $f$ et $g$ sont des fonctions polynomiales en $x$ et $y$, à coefficients réels : elles sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ (proposition 6). En comparant les quatre formules : 
    $$\boxed{\frac{\partial f}{\partial x} = \frac{\partial g}{\partial y} = \operatorname{Re} P'(x + \mathrm{i} y), \qquad \frac{\partial f}{\partial y} = -\frac{\partial g}{\partial x} = -\operatorname{Im} P'(x + \mathrm{i} y)}$$
     Par exemple, pour $P = X^{3}$, on a $f = x^{3} - 3xy^{2}$ et $g = 3x^{2}y - y^{3}$, et l'on vérifie $\frac{\partial f}{\partial x} = 3x^{2} - 3y^{2} = \frac{\partial g}{\partial y}$ et $\frac{\partial f}{\partial y} = -6xy = -\frac{\partial g}{\partial x}$ ✓. Les équations ont été contrôlées par un calcul formel pour des polynômes de degrés $0$ à $5$ à coefficients complexes.

    $\triangleright$ *Orthogonalité des gradients.* En tout point, les équations de Cauchy-Riemann donnent 
    $$\langle \nabla f, \nabla g \rangle = \frac{\partial f}{\partial x}\frac{\partial g}{\partial x} + \frac{\partial f}{\partial y}\frac{\partial g}{\partial y} = \frac{\partial g}{\partial y}\frac{\partial g}{\partial x} - \frac{\partial g}{\partial x}\frac{\partial g}{\partial y} = 0.$$

    $$\boxed{\nabla f \text{ et } \nabla g \text{ sont orthogonaux en tout point de } \mathbb{R}^{2}}$$
     De plus, $\lVert \nabla f \rVert = \lVert \nabla g \rVert = |P'(z)|$ : le gradient de $g$ se déduit de celui de $f$ par la rotation d'angle $\frac{\pi}{2}$, puisque $\nabla g = \big(-\frac{\partial f}{\partial y}, \frac{\partial f}{\partial x}\big)$.

    ![Figure](documents/figures/874cd61ee733ddf3.svg)

    Pour $P = X^{2}$, on a $f = x^{2} - y^{2}$, dont les lignes de niveau sont les hyperboles en bleu, et $g = 2xy$, dont les lignes de niveau sont les hyperboles en ocre ; au point $(1, \frac{1}{2})$, situé sur les niveaux $f = \frac{3}{4}$ et $g = 1$ tracés en gras, les gradients $(2, -1)$ et $(1, 2)$, dessinés au facteur $0{,}4$, sont orthogonaux. Chaque gradient est orthogonal à la ligne de niveau de sa fonction (proposition 9), et donc tangent à la ligne de niveau de l'autre : les deux familles de courbes se coupent à angle droit, en tout point où $P'(z) \neq 0$.

    *À retenir.* Les équations de Cauchy-Riemann disent que les fonctions de deux variables réelles qui proviennent d'un polynôme complexe sont très particulières : $g$ est déterminée par $f$, à une constante près, puisque son gradient $\big(-\frac{\partial f}{\partial y}, \frac{\partial f}{\partial x}\big)$ est connu (exercice 8, question 2). Ce point de vue, celui des fonctions de la variable complexe $z$ et non des deux variables réelles $x$ et $y$, sera développé bien au-delà de la première année.
- id: "ma-22-14"
  feuille: "f-ma-22"
  numero: 14
  partie: "Dérivées partielles et composées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [règle de la chaîne, fonctions de classe C1]
  noeuds: [gd-differentielle, gd-classe-ck]
  notions: [gradient]
  page_enonce: 4
  page_corrige: 15
  enonce: |
    Soit $f$ une fonction de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$. Montrer que les fonctions suivantes sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ ou sur $\mathbb{R}^{2}$ selon le cas, et exprimer leur dérivée, ou leurs dérivées partielles, à l'aide des dérivées partielles de $f$.

    **(a)** $t \mapsto f(t^{2}, t^{3})$

    **(b)** $t \mapsto f(2 + 2t, t^{2})$

    **(c)** $t \mapsto f(t, t)$

    **(d)** $t \mapsto f\big(t, f(t, t)\big)$

    **(e)** $(x, y) \mapsto f(y, x)$

    **(f)** $(x, y) \mapsto f\big(y, f(x, x)\big)$

    **(g)** $(u, v) \mapsto f(uv, u^{2} + v^{2})$
  corrige: |
    Dans tout l'exercice, on note $\frac{\partial f}{\partial x}$ et $\frac{\partial f}{\partial y}$ les dérivées partielles de $f$ par rapport à sa première et à sa seconde place, quel que soit le nom des variables de la fonction composée. Pour les quatre premières fonctions, d'une variable, on applique la règle de la chaîne (théorème 3) à un arc $\gamma = (x, y)$ de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ ; pour les trois dernières, de deux variables, on applique le théorème 4 avec $U = V = \mathbb{R}^{2}$.

    **(a)** L'arc $\gamma(t) = (t^{2}, t^{3})$ a des coordonnées polynomiales, donc de classe $\mathcal{C}^{1}$, de dérivées $2t$ et $3t^{2}$. Le théorème 3 montre que $t \mapsto f(t^{2}, t^{3})$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et 
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} t} f(t^{2}, t^{3}) = 2t\,\frac{\partial f}{\partial x}(t^{2}, t^{3}) + 3t^{2}\,\frac{\partial f}{\partial y}(t^{2}, t^{3})}$$

    **(b)** De même, avec $\gamma(t) = (2 + 2t, t^{2})$, de dérivée $(2, 2t)$ : 
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} t} f(2 + 2t, t^{2}) = 2\,\frac{\partial f}{\partial x}(2 + 2t, t^{2}) + 2t\,\frac{\partial f}{\partial y}(2 + 2t, t^{2})}$$

    **(c)** Avec $\gamma(t) = (t, t)$, de dérivée $(1, 1)$, la fonction $c : t \mapsto f(t, t)$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et 
    $$\boxed{c'(t) = \frac{\partial f}{\partial x}(t, t) + \frac{\partial f}{\partial y}(t, t)}$$
     C'est la dérivée de $f$ en $(t, t)$ selon le vecteur $(1, 1)$ (proposition 8), ce qui est naturel : on parcourt la première bissectrice à vitesse $(1, 1)$.

    **(d)** La fonction étudiée est $t \mapsto f\big(t, c(t)\big)$, avec $c$ de la question (c). L'arc $\gamma(t) = \big(t, c(t)\big)$ est de classe $\mathcal{C}^{1}$, puisque $c$ l'est, de dérivée $\big(1, c'(t)\big)$. Le théorème 3 donne la classe $\mathcal{C}^{1}$ et 
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} t} f\big(t, f(t, t)\big) = \frac{\partial f}{\partial x}\big(t, f(t, t)\big) + \Big(\frac{\partial f}{\partial x}(t, t) + \frac{\partial f}{\partial y}(t, t)\Big)\,\frac{\partial f}{\partial y}\big(t, f(t, t)\big)}$$

    **(e)** On pose $F(x, y) = f\big(\varphi(x, y), \psi(x, y)\big)$ avec $\varphi(x, y) = y$ et $\psi(x, y) = x$, fonctions de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ (proposition 6 (i)), dont les dérivées partielles valent $0$, $1$ et $1$, $0$. Le théorème 4 montre que $F$ est de classe $\mathcal{C}^{1}$, et 
    $$\boxed{\frac{\partial F}{\partial x}(x, y) = \frac{\partial f}{\partial y}(y, x), \qquad \frac{\partial F}{\partial y}(x, y) = \frac{\partial f}{\partial x}(y, x)}$$

    **(f)** On prend cette fois $\varphi(x, y) = y$ et $\psi(x, y) = c(x) = f(x, x)$. La fonction $\psi$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ : ses applications partielles sont $x \mapsto c(x)$, dérivable de dérivée $c'(x)$, et $y \mapsto c(x)$, constante, et ses dérivées partielles $c'(x)$ et $0$ sont continues. Le théorème 4 donne la classe $\mathcal{C}^{1}$ et 
    $$\boxed{\frac{\partial F}{\partial x}(x, y) = \Big(\frac{\partial f}{\partial x}(x, x) + \frac{\partial f}{\partial y}(x, x)\Big)\,\frac{\partial f}{\partial y}\big(y, f(x, x)\big), \qquad \frac{\partial F}{\partial y}(x, y) = \frac{\partial f}{\partial x}\big(y, f(x, x)\big)}$$

    **(g)** Avec $\varphi(u, v) = uv$ et $\psi(u, v) = u^{2} + v^{2}$, de dérivées partielles $v$, $u$ et $2u$, $2v$, le théorème 4 donne la classe $\mathcal{C}^{1}$ et, les dérivées partielles de $f$ étant évaluées en $(uv, u^{2} + v^{2})$, 
    $$\boxed{\frac{\partial F}{\partial u}(u, v) = v\,\frac{\partial f}{\partial x} + 2u\,\frac{\partial f}{\partial y}, \qquad \frac{\partial F}{\partial v}(u, v) = u\,\frac{\partial f}{\partial x} + 2v\,\frac{\partial f}{\partial y}}$$
     Les sept formules ont été contrôlées avec sympy sur la fonction $f(x, y) = \sin x\,\mathrm{e}^{y} + xy^{2} + x^{3}$ ✓.

    *Piège.* L'erreur la plus répandue, en (e), est d'écrire $\frac{\partial F}{\partial x}(x, y) = \frac{\partial f}{\partial x}(y, x)$ : dériver $F$ par rapport à sa première variable $x$ revient à dériver $f$ par rapport à sa *seconde* place, puisque c'est là que $x$ est placé. La remarque qui suit le théorème 4 le dit autrement : on dérive chacune des deux places de $f$, et l'on évalue toujours ses dérivées partielles au point $\big(\varphi(x, y), \psi(x, y)\big)$, ici $(y, x)$, jamais en $(x, y)$.
