  enonce: |
    **L'hélicoïde.** Montrer que $V = \{(t\cos z, t\sin z, z) \mid t, z \in \mathbb{R}\}$ est une surface de $\mathbb{R}^{3}$, et en donner une équation. Soit $p : \mathbb{R}^{3} \to \mathbb{R}^{2}$, $(x, y, z) \mapsto (x, y)$, la projection canonique. La restriction $p_{|V}$ est-elle une submersion ? On calculera la différentielle de $p \circ h$, où $h(t, z) = (t\cos z, t\sin z, z)$, et l'on interprétera géométriquement le résultat.
  corrige: |
    Le point $(x, y, z)$ est dans $V$ si et seulement si le vecteur $(x, y)$ est colinéaire à $(\cos z, \sin z)$, soit *$x\sin z - y\cos z = 0$*. Le gradient $(\sin z, -\cos z, x\cos z + y\sin z)$ ne s'annule jamais : $V$ est une surface, l'*hélicoïde*. Avec $h(t, z) = (t\cos z, t\sin z, z)$, paramétrage global de $V$, on a $p \circ h(t, z) = (t\cos z, t\sin z)$, de jacobien
    $$\begin{vmatrix} \cos z & -t\sin z \\ \sin z & t\cos z \end{vmatrix} = t .$$
     Comme $d(p_{|V}) \circ d h = d(p \circ h)$ et que $dh$ est un isomorphisme sur l'espace tangent, *$p_{|V}$ est une submersion exactement hors de l'axe $Oz$* ($t \neq 0$). Sur l'axe, le plan tangent à $V$ est vertical, et sa projection sur le plan horizontal est une droite : la surface « se tient debout ».

    ![Figure](documents/figures/c00e73c73baa4933.svg)

    L'hélicoïde, réunion des droites horizontales qui s'appuient sur l'axe $Oz$ (en rouge) en tournant à vitesse constante quand on monte ; les deux hélices bleues sont ses bords pour $|t| \leq 1{,}2$ (hauteur comprimée d'un facteur $0{,}35$). Le long de l'axe, le plan tangent est vertical : la projection sur le plan horizontal n'y est pas une submersion.
