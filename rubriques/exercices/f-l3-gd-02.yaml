  source: "devoir surveillé du 18/03/2016, exercice 4 ; Bordeaux 2016, feuille 3, exercice 12"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **Le déterminant, $\mathrm{SL}_{n}(\mathbb{R})$, $\mathcal{O}(n)$ et $\mathrm{Sp}_{2g}(\mathbb{R})$.** Soit $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}$, $f(A) = \det A$.

    **1.** Justifier que $f$ est de classe $\mathcal{C}^{\infty}$.

    **2.** Calculer la dérivée de $t \mapsto f(I_{n} + tE_{i,j})$ en $0$, où $E_{i,j}$ est la matrice élémentaire. En déduire que $d_{I_{n}}f(A) = {}^{t}A$ pour toute $A \in \mathcal{M}_{n}(\mathbb{R})$.

    **3.** Soit $M$ inversible. Déduire de la question précédente que $d_{M}f(A) = \det(M){}^{t}(M^{-1}A)$.

    **4.** Montrer que $\mathrm{SL}_{n}(\mathbb{R}) = \{M \in \mathcal{M}_{n}(\mathbb{R}) \mid \det M = 1\}$ est une sous-variété de $\mathcal{M}_{n}(\mathbb{R})$. Quelle est sa dimension ? Montrer que $T_{I_{n}}\mathrm{SL}_{n}(\mathbb{R}) = \{A \mid {}^{t}A = 0\}$, puis que $T_{M}\mathrm{SL}_{n}(\mathbb{R}) = M\,T_{I_{n}}\mathrm{SL}_{n}(\mathbb{R})$.

    **5.** Montrer que les applications $(M, N) \mapsto MN$ et $M \mapsto M^{-1}$, de $\mathrm{SL}_{n}(\mathbb{R})^{2}$ et $\mathrm{SL}_{n}(\mathbb{R})$ dans $\mathcal{M}_{n}(\mathbb{R})$, sont de classe $\mathcal{C}^{\infty}$ et à valeurs dans $\mathrm{SL}_{n}(\mathbb{R})$. Pour $n = 2$, écrire $M^{-1}$ explicitement.

    **6.** Soit $g \geq 1$ et $J_{g} = \begin{pmatrix} 0 & I_{g} \\ -I_{g} & 0 \end{pmatrix}$. Montrer que $\mathrm{Sp}_{2g}(\mathbb{R}) = \{A \in \mathcal{M}_{2g}(\mathbb{R}) \mid {A}^{T}J_{g}A = J_{g}\}$ est une sous-variété de $\mathcal{M}_{2g}(\mathbb{R})$, de dimension $g(2g + 1)$. On pourra s'inspirer du cas de $\mathcal{O}(n)$ traité dans le cours, en remplaçant les matrices symétriques par les matrices antisymétriques.

    **7.** Parmi $\mathrm{SL}_{n}(\mathbb{R})$, $\mathcal{O}(n)$ et $\mathrm{Sp}_{2g}(\mathbb{R})$, lesquelles sont compactes ?
  corrige: |
    **1.** $\det A$ est un polynôme en les coefficients de $A$ : *$f$ est de classe $\mathcal{C}^{\infty}$.*

    **2.** $I_{n} + tE_{i,j}$ est triangulaire si $i \neq j$, de déterminant $1$, et diagonale si $i = j$, de déterminant $1 + t$. La dérivée en $0$ vaut donc $\delta_{i,j}$. Par linéarité de $d_{I_{n}}f$,
    $$d_{I_{n}}f(A) = \sum_{i,j}a_{i,j}\delta_{i,j} = \boxed{{}^{t}A} .$$

    **3.** $f(M + tA) = \det M\det(I_{n} + tM^{-1}A)$, d'où, en dérivant en $t = 0$,
    $$d_{M}f(A) = \det(M)\,d_{I_{n}}f(M^{-1}A) = \boxed{\det(M){}^{t}(M^{-1}A)} .$$

    **4.** Pour $M \in \mathrm{SL}_{n}(\mathbb{R})$, $d_{M}f(M) = n \neq 0$ : $d_{M}f$ est surjective, et *$\mathrm{SL}_{n}(\mathbb{R}) = f^{-1}(\{1\})$ est une sous-variété de dimension $n^{2} - 1$*. Par la proposition 1,
    $$T_{M}\mathrm{SL}_{n}(\mathbb{R}) = \mathrm{Ker}\, d_{M}f = \{A \mid {}^{t}(M^{-1}A) = 0\} = \{MB \mid {}^{t}B = 0\} ;$$
     en $M = I_{n}$, ce sont les matrices de trace nulle.

    **5.** Le produit est polynomial ; pour $\det M = 1$, $M^{-1} = {\operatorname{Com}(M)}^{T}$ est polynomial en les coefficients de $M$. Ces applications sont donc $\mathcal{C}^{\infty}$, et $\det(MN) = \det(M^{-1}) = 1$. Pour $n = 2$,
    $$\begin{pmatrix} a & b \\ c & d \end{pmatrix}^{-1} = \begin{pmatrix} d & -b \\ -c & a \end{pmatrix} .$$
     Un groupe qui est une sous-variété et dont les opérations sont lisses s'appelle un *groupe de Lie*.

    **6.** $g(A) = {A}^{T}J_{g}A - J_{g}$ est à valeurs dans l'espace $\mathcal{A}_{2g}$ des matrices antisymétriques, de dimension $g(2g - 1)$, puisque ${J_{g}}^{T} = -J_{g}$. Pour $A \in \mathrm{Sp}_{2g}(\mathbb{R})$, $d_{A}g(H) = {H}^{T}J_{g}A + {A}^{T}J_{g}H$. Soit $S$ antisymétrique ; avec $H = AK$, on obtient $d_{A}g(AK) = {K}^{T}J_{g} + J_{g}K$, et le choix $K = -\dfrac{1}{2}J_{g}S$ donne, puisque $J_{g}^{2} = -I_{2g}$, $J_{g}K = \dfrac{1}{2}S$ et
    $${K}^{T}J_{g} = -\frac{1}{2}{S}^{T}\,{J_{g}}^{T}J_{g} = \frac{1}{2}S :$$
     $d_{A}g(AK) = S$. La différentielle est surjective, et *$\mathrm{Sp}_{2g}(\mathbb{R})$ est une sous-variété de dimension $4g^{2} - g(2g - 1) = g(2g + 1)$.*

    **7.** $\mathcal{O}(n)$ est fermé et borné ($\lVert A \rVert^{2} = {}^{t}({A}^{T}A) = n$ pour la norme euclidienne) : *compact*. Pour $n \geq 2$, $\mathrm{SL}_{n}(\mathbb{R})$ contient $\operatorname{diag}(t, \dfrac{1}{t}, 1, \dots, 1)$, et $\mathrm{Sp}_{2g}(\mathbb{R})$ contient $\operatorname{diag}(tI_{g}, \dfrac{1}{t}I_{g})$ (on vérifie que ${A}^{T}J_{g}A = J_{g}$), pour tout $t > 0$ : *ils ne sont pas bornés, donc pas compacts.*
- id: "l3-gd-02-16"
  feuille: "f-l3-gd-02"
  numero: 16
