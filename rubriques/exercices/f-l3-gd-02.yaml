  enonce: |
    **Le cercle ne se plonge pas dans la droite.**

    **1.** Montrer qu'il n'existe pas d'application continue injective de $\mathbb{S}^{1}$ dans $\mathbb{R}$. On pourra utiliser le théorème des valeurs intermédiaires sur les deux arcs joignant deux points de $\mathbb{S}^{1}$.

    **2.** Existe-t-il une application $f : \mathbb{S}^{1} \to \mathbb{R}$ telle que $t \mapsto f(\cos t, \sin t)$ soit de classe $\mathcal{C}^{1}$ et de dérivée partout non nulle ?
  corrige: |
    **1.** Soit $f : \mathbb{S}^{1} \to \mathbb{R}$ continue injective, $a \neq b$ dans $\mathbb{S}^{1}$, avec $f(a) < f(b)$, et $c \in \, ]f(a), f(b)[$. Les deux arcs ouverts de $\mathbb{S}^{1}$ d'extrémités $a$ et $b$ sont connexes ; leurs adhérences ont pour image par $f$ des intervalles contenant $f(a)$ et $f(b)$, donc $c$, qui est atteint en un point intérieur de chacun des deux arcs. Ces deux points sont distincts et ont la même image : contradiction. *Il n'existe ni injection continue, ni plongement de $\mathbb{S}^{1}$ dans $\mathbb{R}$.*

    **2.** La fonction $g(t) = f(\cos t, \sin t)$ est $2\pi$-périodique et continue : elle atteint son maximum en un $t_{0}$, où $g'(t_{0}) = 0$. *Il n'existe pas d'immersion du cercle dans la droite.* Le même argument montre qu'une fonction différentiable sur une sous-variété compacte a toujours au moins deux points critiques, son maximum et son minimum (exercice 17).
- id: "l3-gd-02-20"
  feuille: "f-l3-gd-02"
  numero: 20
  partie: "Extrema liés, arguments globaux"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [extrema liés]
  noeuds: [cdiff-lagrange, gd-tangent-sm]
  notions: [espace-tangent-sv]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **La surface de Véronèse.** Soit $\varphi : \mathbb{R}^{3} \to \mathbb{R}^{6}$ définie par 
    $$\varphi(x, y, z) = \left(x^{2}, y^{2}, z^{2}, \sqrt{2}\,yz, \sqrt{2}\,zx, \sqrt{2}\,xy\right) ,$$
     et $V = \varphi(\mathbb{S}^{2})$.

    **1.** Montrer que $\lVert \varphi(p) \rVert = \lVert p \rVert^{2}$ et que $\varphi(p) = \varphi(q)$ si et seulement si $q = \pm p$. Interpréter $\varphi(p)$ comme la matrice symétrique $p\,{p}^{T}$, l'espace des matrices symétriques $3 \times 3$ étant muni d'une norme euclidienne convenable.

    **2.** Montrer que la restriction de $\varphi$ à $\mathbb{S}^{2}$ est une immersion, c'est-à-dire que $d_{p}\varphi$ est injective sur $T_{p}\mathbb{S}^{2}$ pour tout $p \in \mathbb{S}^{2}$.

    **3.** Soit $p \in \mathbb{S}^{2}$ et $C_{p} = \{q \in \mathbb{S}^{2} \mid \langle q, p \rangle > \dfrac{1}{2}\}$. Montrer que $\varphi(\mathbb{S}^{2} \setminus (C_{p} \cup -C_{p}))$ est un compact qui ne contient pas $\varphi(p)$, et en déduire qu'au voisinage de $\varphi(p)$, $V$ coïncide avec $\varphi(C_{p})$.

    **4.** En déduire que $V$ est une surface compacte de $\mathbb{R}^{6}$, contenue dans une sphère. Elle s'identifie à l'ensemble des droites vectorielles de $\mathbb{R}^{3}$, le *plan projectif réel*, qui, lui, ne peut pas être réalisé comme une surface de $\mathbb{R}^{3}$.
  corrige: |
    **1.** On a
    $$\lVert \varphi(p) \rVert^{2} = x^{4} + y^{4} + z^{4} + 2y^{2}z^{2} + 2z^{2}x^{2} + 2x^{2}y^{2} = (x^{2} + y^{2} + z^{2})^{2} .$$
     Munissons l'espace $\mathcal{S}_{3}$ des matrices symétriques du produit scalaire défini par $\langle S, S' \rangle = {}^{t}(SS')$, et identifions $S$ à $(s_{11}, s_{22}, s_{33}, \sqrt{2}s_{23}, \sqrt{2}s_{31}, \sqrt{2}s_{12}) \in \mathbb{R}^{6}$, ce qui est une isométrie. Alors *$\varphi(p)$ est la matrice $p\,{p}^{T}$*, de coefficients $p_{i}p_{j}$. Si $p\,{p}^{T} = q\,{q}^{T}$, en appliquant à $p$ : $\lVert p \rVert^{2}p = \langle q, p \rangle q$, donc $q$ est colinéaire à $p$, $q = \mu p$, et $\mu^{2} = 1$ : $q = \pm p$.

    **2.** $d_{p}\varphi(v) = p\,{v}^{T} + v\,{p}^{T}$. Pour $v \in T_{p}\mathbb{S}^{2} = p^{\perp}$, $(p\,{v}^{T} + v\,{p}^{T})p = \langle v, p \rangle p + \lVert p \rVert^{2}v = v$ : si $d_{p}\varphi(v) = 0$, alors $v = 0$. *La restriction à $\mathbb{S}^{2}$ est une immersion.*

    **3.** $K = \mathbb{S}^{2} \setminus (C_{p} \cup -C_{p})$ est fermé dans le compact $\mathbb{S}^{2}$, donc compact, et $\varphi(K)$ aussi. Il ne contient pas $\varphi(p)$, puisque les seuls antécédents de $\varphi(p)$ sont $\pm p \notin K$. Il existe donc une boule $B$ centrée en $\varphi(p)$ qui ne rencontre pas $\varphi(K)$, et $B \cap V = B \cap \varphi(C_{p} \cup -C_{p}) = B \cap \varphi(C_{p})$, car $\varphi(-q) = \varphi(q)$.

    **4.** Sur $C_{p}$, $\varphi$ est injective ($q$ et $-q$ ne sont pas tous deux dans $C_{p}$), immersive, et c'est un homéomorphisme sur son image : la restriction de $\varphi$ au compact $\overline{C_{p}}$, injective et continue, est un homéomorphisme sur son image. Composée avec une paramétrisation de la calotte $C_{p}$, elle fournit, par la question 3, une paramétrisation de $V$ au voisinage de $\varphi(p)$. *$V$ est une surface compacte de $\mathbb{R}^{6}$*, image du compact $\mathbb{S}^{2}$, contenue dans la sphère unité par la question 1.

    Comme $\varphi(p) = \varphi(-p)$, $V$ est en bijection avec les droites vectorielles de $\mathbb{R}^{3}$, la droite $\mathbb{R} p$ correspondant au projecteur orthogonal $p\,{p}^{T}$ sur elle. Ce *plan projectif réel* est une surface non orientable, comme le ruban de Möbius de l'exercice 12, qu'il contient ; un résultat de topologie, hors de portée ici, montre qu'aucune surface compacte de $\mathbb{R}^{3}$ n'est non orientable, d'où le recours à $\mathbb{R}^{6}$ (on peut d'ailleurs descendre jusqu'à $\mathbb{R}^{4}$).

