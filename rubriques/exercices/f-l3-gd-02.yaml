  source: "Bordeaux 2016, feuille 3, exercice 6"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **Extrema liés sur la sphère.** Soit $F : \mathbb{R}^{3} \to \mathbb{R}$, $F(x_{1}, x_{2}, x_{3}) = \left(x_{1} - \dfrac{1}{2}\right)^{2} + x_{2}^{2}$.

    **1.** Montrer que $\mathbb{S}^{2}$ est une sous-variété compacte de $\mathbb{R}^{3}$.

    **2.** Montrer que, pour tout $c \in \mathbb{R}$, $N_{c} = F^{-1}(\{c\})$ est une sous-variété de $\mathbb{R}^{3}$, dont on précisera la dimension, ou l'ensemble vide, ou une droite. Dessiner $N_{0}$ et $N_{1/4}$.

    **3.** Déterminer les points critiques de la restriction $F_{|\mathbb{S}^{2}}$, à l'aide du théorème 6 du cours. En déduire le maximum et le minimum de $F_{|\mathbb{S}^{2}}$, et interpréter avec les ensembles $N_{c}$.
  corrige: |
    **1.** $\mathbb{S}^{2}$ est une surface (exercice 10), fermée et bornée : *compacte*.

    **2.** $\nabla F = (2x_{1} - 1, 2x_{2}, 0)$ s'annule exactement sur la droite $D = \{x_{1} = \dfrac{1}{2}, x_{2} = 0\}$, où $F = 0$. Pour $c > 0$, $N_{c}$ ne rencontre pas $D$ : c'est une *surface*, le cylindre de révolution d'axe $D$ et de rayon $\sqrt{c}$. Pour $c = 0$, $N_{0} = D$, *une droite*, sous-variété de dimension $1$ bien que $F$ n'y soit pas une submersion. Pour $c < 0$, $N_{c} = \emptyset$.

    **3.** Par le théorème 6, en un point critique, $\nabla F = \lambda\nabla g$ avec $g = \lVert x \rVert^{2} - 1$ : $2x_{1} - 1 = 2\lambda x_{1}$, $2x_{2} = 2\lambda x_{2}$, $0 = 2\lambda x_{3}$. Si $\lambda = 0$ : $x_{1} = \dfrac{1}{2}$, $x_{2} = 0$, $x_{3} = \pm\dfrac{\sqrt{3}}{2}$, où $F = 0$. Si $\lambda \neq 0$ : $x_{3} = 0$ ; si $x_{2} \neq 0$, $\lambda = 1$ et $2x_{1} - 1 = 2x_{1}$, absurde, donc $x_{2} = 0$, $x_{1} = \pm 1$, où $F$ vaut $\dfrac{1}{4}$ et $\dfrac{9}{4}$.

    La fonction continue $F$ atteint ses bornes sur le compact $\mathbb{S}^{2}$, en des points critiques : *le minimum $0$ est atteint en $(\dfrac{1}{2}, 0, \pm\dfrac{\sqrt{3}}{2})$, le maximum $\dfrac{9}{4}$ en $(-1, 0, 0)$* ; le point $(1, 0, 0)$, critique de valeur $\dfrac{1}{4}$, est un col. Géométriquement, $F(x)$ est le carré de la distance de $x$ à $D$ : les cylindres $N_{c}$ sont tangents à la sphère aux points critiques, et le maximum est atteint au point de la sphère le plus éloigné de $D$.
- id: "l3-gd-02-18"
  feuille: "f-l3-gd-02"
  numero: 18
  partie: "Extrema liés, arguments globaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [extrema liés, plan tangent]
  noeuds: [cdiff-lagrange, gd-tangent-sm]
  notions: [espace-tangent-sv, plan-tangent]
  source: "Bordeaux 2016, feuille 3, exercice 7"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **Plans tangents d'une surface compacte.** Soit $\Sigma$ une surface compacte de $\mathbb{R}^{3}$ et $P$ un plan vectoriel. Montrer qu'il existe un point de $\Sigma$ dont le plan tangent vectoriel est égal à $P$. On pourra considérer un point $p \in \Sigma$ à distance maximale de $P$, et appliquer le théorème 6 du cours. Montrer par un exemple que l'hypothèse de compacité est nécessaire.
  corrige: |
    Soit $n$ un vecteur unitaire normal à $P$. La fonction continue $\ell(x) = \langle x, n \rangle$ atteint son maximum sur le compact $\Sigma$ en un point $p$, extremum de $\ell_{|\Sigma}$. Par le théorème 6, $n = \nabla\ell(p)$ est orthogonal à $T_{p}\Sigma$, donc $T_{p}\Sigma \subset n^{\perp} = P$, et l'égalité vient des dimensions. *Le plan tangent en $p$ est $P$.* Le point $p$ est à distance maximale de $P$, puisque $|\ell(x)|$ est la distance de $x$ à $P$, du côté de $n$. Sans compacité, c'est faux : les plans tangents du cylindre $x^{2} + y^{2} = 1$ sont tous verticaux, et aucun n'est le plan $z = 0$.
