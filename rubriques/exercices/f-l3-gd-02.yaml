  source: "Bibmath, géométrie différentielle, exercice 1 ; Bordeaux 2016, feuille 3, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Reconnaître une immersion, une submersion.**

    **1.** Déterminer les points où les applications suivantes sont des immersions, et ceux où elles sont des submersions :

    **(a)** $(x, y) \in \mathbb{R}^{2} \mapsto (x, y, 0) \in \mathbb{R}^{3}$ ;

    **(b)** $(x, y, z) \in \mathbb{R}^{3} \mapsto (y, z) \in \mathbb{R}^{2}$ ;

    **(c)** $(x, y, z) \in \mathbb{R}^{3} \mapsto xy + 2yz + 3xz \in \mathbb{R}$ ;

    **(d)** $t \in \mathbb{R} \mapsto (\sin 2t, \sin 3t) \in \mathbb{R}^{2}$, dont on tracera l'image ;

    **(e)** $(x, y, z) \in \mathbb{R}^{3} \mapsto (x^{2} + y^{2} + z^{2}, xy) \in \mathbb{R}^{2}$ ;

    **(f)** $(x, y) \in \mathbb{R}^{2} \mapsto (\mathrm{e}^{x}, \cos y, \sin y) \in \mathbb{R}^{3}$.

    **2.** Les applications suivantes $f : \mathbb{R}^{2} \to \mathbb{R}^{3}$ sont-elles des immersions ? Sont-elles injectives ? Si oui, sont-elles des plongements ? Lorsque $f$ est une immersion, donner une équation cartésienne du plan tangent affine à l'image en $f(u, v)$. Représenter $f(\mathbb{R}^{2})$ dans chaque cas.

    **(a)** $f(u, v) = (\cos u, \sin u, v)$ ;

    **(b)** $f(u, v) = (u, v, uv)$ ;

    **(c)** $f(u, v) = (u\cos v, u\sin v, \lambda v)$, où $\lambda \in \mathbb{R}$ ;

    **(d)** $f(u, v) = \big((2 + \cos v)\cos u, (2 + \cos v)\sin u, \sin v\big)$.
  corrige: |
    **1.** On calcule la matrice jacobienne $J$ ; l'application est une immersion là où $J$ est de rang égal à la dimension de départ, une submersion là où il est égal à la dimension d'arrivée.

    **(a)** $J$ est de rang $2$ partout : *immersion* en tout point, jamais submersion.

    **(b)** Projection linéaire surjective : *submersion* partout, jamais immersion.

    **(c)** $\nabla f = (y + 3z, x + 2z, 3x + 2y)$ ; le système linéaire correspondant a pour déterminant $12 \neq 0$, donc le gradient ne s'annule qu'en $0$. *Submersion sur $\mathbb{R}^{3} \setminus \{0\}$.*

    **(d)** $f'(t) = (2\cos 2t, 3\cos 3t)$. Si $\cos 2t = \cos 3t = 0$, alors
    $$t = \frac{\pi}{4} + \frac{k\pi}{2} = \frac{\pi}{6} + \frac{j\pi}{3} ,$$
     d'où $3 + 6k = 2 + 4j$, impossible pour une question de parité. *Immersion partout*, non injective ($f$ est $2\pi$-périodique et la courbe se recoupe).

    **(e)** 
    $$J = \begin{pmatrix} 2x & 2y & 2z \\ y & x & 0 \end{pmatrix}$$
     a pour mineurs $2(x^{2} - y^{2})$, $-2yz$, $-2xz$. Ils sont tous nuls si et seulement si $z = 0$ et $x = \pm y$, ou $x = y = 0$. *Submersion hors de l'axe $Oz$ et des droites $\{z = 0, x = \pm y\}$.*

    **(f)** $J$ a pour colonnes $(\mathrm{e}^{x}, 0, 0)$ et $(0, -\sin y, \cos y)$, indépendantes : *immersion partout*, non injective (périodique en $y$). L'image est le demi-cylindre $\{X > 0, Y^{2} + Z^{2} = 1\}$.

    ![Figure](documents/figures/151c0f7fa24a48b0.svg)

    La courbe de Lissajous $t \mapsto (\sin 2t, \sin 3t)$ (en bleu) : sa vitesse ne s'annule jamais, mais elle passe plusieurs fois par certains points, par exemple l'origine (en rouge), atteinte en $t = 0$ et $t = \pi$ avec des tangentes différentes. Une immersion n'est donc pas injective en général.

    **2.** (a) $\partial_{u}f = (-\sin u, \cos u, 0)$ et $\partial_{v}f = (0, 0, 1)$ : *immersion*, non injective ($2\pi$-périodique en $u$), donc pas un plongement ; l'image est le cylindre $x^{2} + y^{2} = 1$, et le plan tangent en $f(u, v)$ est $x\cos u + y\sin u = 1$.

    (b) $f$ est le paramétrage du graphe de $(u, v) \mapsto uv$ : immersion injective, d'inverse continu $(x, y, z) \mapsto (x, y)$, *donc un plongement*. L'image est la selle $z = xy$, et le plan tangent en $f(u, v)$ est $z = vx + uy - uv$.

    (c) $\partial_{u}f \wedge \partial_{v}f = (\lambda\sin v, -\lambda\cos v, u)$. Si $\lambda \neq 0$, il ne s'annule jamais : $f$ est une immersion ; elle est injective, car $z$ détermine $v$, puis $(x, y)$ détermine $u$, et son inverse $(x, y, z) \mapsto \left(x\cos\dfrac{z}{\lambda} + y\sin\dfrac{z}{\lambda}, \dfrac{z}{\lambda}\right)$ est continu : *plongement*, d'image l'hélicoïde (exercice 14). Plan tangent : $\lambda\sin v\,x - \lambda\cos v\,y + uz = \lambda uv$. Si $\lambda = 0$, $f$ n'est pas une immersion en $u = 0$ et n'est pas injective : c'est le paramétrage polaire du plan $z = 0$.

    (d) On reconnaît le tore de rayons $2$ et $1$ (exercice 11). Le vecteur $n = (\cos v\cos u, \cos v\sin u, \sin v)$ est normal, $\partial_{u}f \wedge \partial_{v}f = (2 + \cos v)\,n$ ne s'annule pas : *immersion*, non injective ($2\pi$-périodique en $u$ et en $v$). Plan tangent : $\cos v\cos u\,x + \cos v\sin u\,y + \sin v\,z = 2\cos v + 1$.
