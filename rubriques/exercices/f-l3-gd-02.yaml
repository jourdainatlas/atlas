  enonce: |
    **Immersion injective qui n'est pas un plongement ; la cuspide.**

    **1.** Pour $t \in \, ]{-\infty}, 1[$, on pose $f(t) = (t^{2}, t - t^{3})$. Montrer que $f$ est une immersion injective. Dessiner son image. Montrer que $f(t)$ tend vers $f(-1)$ quand $t \to 1$, et en déduire que $f$ n'est pas un plongement et que son image n'est pas une sous-variété de $\mathbb{R}^{2}$.

    **2.** On considère les parties $S_{1} = \{(t^{2}, t^{3}) \mid t > 0\}$, $S_{2} = \{(t^{2}, t^{3}) \mid t \geq 0\}$ et $S_{3} = \{(t^{2}, t^{3}) \mid t \in \mathbb{R}\}$ de $\mathbb{R}^{2}$. L'application $t \mapsto (t^{2}, t^{3})$ est-elle une immersion ? Lesquelles de ces trois parties sont des sous-variétés de $\mathbb{R}^{2}$ ? Pour $S_{3}$, on pourra montrer que $T_{0}S_{3}$, s'il existait, contiendrait les vecteurs $(1, 0)$ et $(0, 1)$, puis que $S_{3}$ n'est le graphe d'aucune fonction dérivable au voisinage de $0$.
  corrige: |
    **1.** $f'(t) = (2t, 1 - 3t^{2})$ ne s'annule pas, car $t = 0$ donne la seconde composante $1$ : *$f$ est une immersion.* Si $f(t) = f(s)$ avec $s \neq t$, alors $s = -t$ et $t - t^{3} = -t + t^{3}$, soit $t(1 - t^{2}) = 0$, donc $t = \pm 1$ et $\{s, t\} = \{-1, 1\}$, exclu puisque $1 \notin \, ]{-\infty}, 1[$ : *$f$ est injective.* Quand $t \to 1$, $f(t) \to (1, 0) = f(-1)$. Si $f$ était un plongement, $f^{-1}$ serait continue en $f(-1)$ et $t = f^{-1}(f(t))$ tendrait vers $-1$, ce qui est faux : *$f$ n'est pas un plongement.* L'image n'est pas une sous-variété : au voisinage de $(1, 0)$ elle contient l'arc passant par $f(-1)$ et l'extrémité de la branche qui vient s'y appuyer, et, privée de ce point, elle a trois composantes locales au lieu de deux.

    ![Figure](documents/figures/e44f8823986697a6.svg)

    À gauche, l'image de $f(t) = (t^{2}, t - t^{3})$, $t < 1$ : la branche $t \to 1^{-}$ vient buter sur le point $f(-1)$ (en rouge) sans l'atteindre, puisque $t = 1$ est exclu. À droite, la cuspide $S_{3}$ : en $0$, les deux branches arrivent tangentes à l'axe des $x$.

    **2.** $t \mapsto (t^{2}, t^{3})$ a pour dérivée $(2t, 3t^{2})$, nulle en $0$ seulement : *immersion sur $\mathbb{R}^{*}$, pas en $0$.* $S_{1}$ est le graphe de $x \mapsto x^{3/2}$ sur $]0, +\infty[$, de classe $\mathcal{C}^{\infty}$ : *sous-variété de dimension $1$.* $S_{2}$ n'en est pas une : au voisinage de $0$, $S_{2}$ privé de $0$ est l'arc connexe $\{(t^{2}, t^{3}) \mid 0 < t < \delta\}$, alors qu'une sous-variété de dimension $1$ privée d'un point en a deux (remarque initiale). $S_{3}$ n'en est pas une : au voisinage de $0$, ce n'est pas un graphe au-dessus de l'axe des $x$ (à $x > 0$ correspondent les deux valeurs $\pm x^{3/2}$), et au-dessus de l'axe des $y$, c'est le graphe de $y \mapsto y^{2/3}$, qui n'est pas dérivable en $0$. Le théorème 4, caractérisation (4), interdit donc à $S_{3}$ d'être une sous-variété de dimension $1$ ; elle n'est pas de dimension $0$ (pas de points isolés) ni $2$ (d'intérieur vide).
