  page_corrige: 12
  enonce: |
    **L'exponentielle et les paramétrisations des groupes.** Pour une matrice $u \in \mathcal{M}_{n}(\mathbb{R})$, on pose
    $$\exp u = \sum_{k \geq 0}\frac{u^{k}}{k!} ,$$
     série normalement convergente pour une norme d'algèbre.

    **1.** Montrer que $\exp(u + v) = \exp u \exp v$ si $u$ et $v$ commutent, et que $\det(\exp u) = \mathrm{e}^{{}^{t}u}$. On pourra trigonaliser $u$ dans $\mathcal{M}_{n}(\mathbb{R})$ à coefficients complexes.

    **2.** On admet que $\exp$ est de classe $\mathcal{C}^{\infty}$ sur $\mathcal{M}_{n}(\mathbb{R})$. Montrer que $d_{0}\exp = \mathrm{id}$, et en déduire qu'il existe un voisinage ouvert $V$ de $0$ dans $\mathcal{M}_{n}(\mathbb{R})$ et un voisinage ouvert $W$ de $I_{n}$ tels que $\exp$ soit un difféomorphisme de $V$ sur $W$.

    **3.** Soit $\mathfrak{sl}_{n} = \{u \mid {}^{t}u = 0\}$ et $\mathfrak{o}_{n} = \{u \mid {u}^{T} = -u\}$. Montrer que $\exp(\mathfrak{sl}_{n}) \subset \mathrm{SL}_{n}(\mathbb{R})$ et $\exp(\mathfrak{o}_{n}) \subset \mathcal{O}(n)$.

    **4.** Quitte à restreindre $V$ (on prendra $V$ stable par $u \mapsto {u}^{T}$ et $u \mapsto -u$), montrer que $\exp(V \cap \mathfrak{sl}_{n}) = W \cap \mathrm{SL}_{n}(\mathbb{R})$ et $\exp(V \cap \mathfrak{o}_{n}) = W \cap \mathcal{O}(n)$. En déduire des paramétrisations de $\mathrm{SL}_{n}(\mathbb{R})$ et de $\mathcal{O}(n)$ au voisinage de $I_{n}$, et retrouver leurs dimensions.
  corrige: |
    **1.** Si $uv = vu$, le produit de Cauchy des séries absolument convergentes, et la formule du binôme, donnent
    $$\exp u\exp v = \sum_{n}\sum_{k + l = n}\frac{u^{k}v^{l}}{k!\,l!} = \sum_{n}\frac{(u + v)^{n}}{n!} .$$
     Écrivons $u = PTP^{-1}$ avec $T$ triangulaire supérieure complexe de diagonale $(\lambda_{1}, \dots, \lambda_{n})$. Alors $\exp u = P\exp(T)P^{-1}$, et $\exp T$ est triangulaire de diagonale $(\mathrm{e}^{\lambda_{1}}, \dots, \mathrm{e}^{\lambda_{n}})$, donc 
    $$\det\exp u = \mathrm{e}^{\lambda_{1} + \dots + \lambda_{n}} = \boxed{\mathrm{e}^{{}^{t}u}} .$$

    **2.** On a
    $$\exp h = I_{n} + h + \sum_{k \geq 2}\frac{h^{k}}{k!}$$
     et
    $$\lVert \sum_{k \geq 2}\frac{h^{k}}{k!} \rVert \leq \lVert h \rVert^{2}\mathrm{e}^{\lVert h \rVert} ,$$
     donc $d_{0}\exp = \mathrm{id}$, inversible. Le théorème d'inversion locale (th. 1) donne $V$ et $W$.

    **3.** Si ${}^{t}u = 0$, $\det\exp u = \mathrm{e}^{0} = 1$. Si ${u}^{T} = -u$, ${(\exp u)}^{T} = \exp({u}^{T}) = \exp(-u)$ et, $u$ et $-u$ commutant, ${(\exp u)}^{T}\exp u = \exp(0) = I_{n}$.

    **4.** Prenons $V$ stable par transposition et par $u \mapsto -u$ (une boule pour la norme euclidienne), et $W = \exp(V)$. Pour $u \in V$ : $\exp u \in \mathrm{SL}_{n}(\mathbb{R})$ si et seulement si $\mathrm{e}^{{}^{t}u} = 1$, si et seulement si ${}^{t}u = 0$ ; et $\exp u \in \mathcal{O}(n)$ si et seulement si $\exp({u}^{T}) = \exp(-u)$, si et seulement si ${u}^{T} = -u$, par injectivité de $\exp$ sur $V$. Donc $\exp(V \cap \mathfrak{sl}_{n}) = W \cap \mathrm{SL}_{n}(\mathbb{R})$ et $\exp(V \cap \mathfrak{o}_{n}) = W \cap \mathcal{O}(n)$.

    La restriction de $\exp$ à l'ouvert $V \cap \mathfrak{sl}_{n}$ de l'espace vectoriel $\mathfrak{sl}_{n}$ est une immersion (restriction d'un difféomorphisme) et un homéomorphisme sur son image : c'est une *paramétrisation de $\mathrm{SL}_{n}(\mathbb{R})$ au voisinage de $I_{n}$*, de dimension $\dim\mathfrak{sl}_{n} = n^{2} - 1$ ; de même pour $\mathcal{O}(n)$, de dimension $\dim\mathfrak{o}_{n} = \dfrac{n(n - 1)}{2}$. On retrouve l'exercice 15 et l'exemple du cours, et l'on voit que l'espace tangent en $I_{n}$ est $\mathfrak{sl}_{n}$, respectivement $\mathfrak{o}_{n}$.
- id: "l3-gd-02-17"
  feuille: "f-l3-gd-02"
  numero: 17
  partie: "Extrema liés, arguments globaux"
