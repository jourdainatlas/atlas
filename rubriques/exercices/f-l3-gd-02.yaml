  enonce: |
    **Une droite dense dans le tore.** On note $T = \{(\cos t(2 + \cos s), \sin t(2 + \cos s), \sin s) \mid s, t \in \mathbb{R}\}$ le tore de révolution, et l'on considère l'application 
    $$h : t \in \mathbb{R} \longmapsto \big(\cos(\sqrt{2}\,t)(2 + \cos t), \ \sin(\sqrt{2}\,t)(2 + \cos t), \ \sin t\big) \in \mathbb{R}^{3} .$$

    **1.** Montrer que $h$ est une immersion injective à valeurs dans $T$.

    **2.** On admet que l'ensemble $\mathbb{Z} + \sqrt{2}\,\mathbb{Z}$ est dense dans $\mathbb{R}$, puisque $\sqrt{2}$ est irrationnel. Montrer que $h(\mathbb{R})$ est dense dans $T$.

    **3.** En déduire que $h(\mathbb{R})$ n'est pas une sous-variété de $\mathbb{R}^{3}$. On pourra raisonner par l'absurde : une sous-variété de dimension $1$ contenue dans $T$ serait, au voisinage de chacun de ses points, l'image d'un petit intervalle, donc d'intérieur vide dans $T$.
  corrige: |
    **1.** Notons
    $$F(s, \tau) = (\cos\tau(2 + \cos s), \sin\tau(2 + \cos s), \sin s)$$
     le paramétrage du tore, de sorte que $h(t) = F(t, \sqrt{2}\,t) \in T$. Les vecteurs
    $$\partial_{s}F = (-\sin s\cos\tau, -\sin s\sin\tau, \cos s), \qquad \partial_{\tau}F = (2 + \cos s)(-\sin\tau, \cos\tau, 0)$$
     sont orthogonaux, donc $\lVert h'(t) \rVert \geq \sqrt{2}\lVert \partial_{\tau}F \rVert \geq \sqrt{2}$ : *$h$ est une immersion*.

    Si $h(t) = h(t')$, la troisième coordonnée et la distance $2 + \cos t$ à l'axe donnent $t' = t + 2k\pi$ ; l'angle autour de l'axe donne alors $\sqrt{2}(t' - t) = 2k\sqrt{2}\,\pi \in 2\pi\mathbb{Z}$, donc $k\sqrt{2} \in \mathbb{Z}$ et $k = 0$ : *$h$ est injective.*

    **2.** Un point de $T$ s'écrit $F(s, \tau)$, avec $F(s, \tau) = (\cos\tau(2 + \cos s), \sin\tau(2 + \cos s), \sin s)$ continue et $2\pi$-périodique en chaque variable. Soit $\varepsilon > 0$. Pour $t = s + 2k\pi$, $h(t) = F(s, \sqrt{2}s + 2\sqrt{2}k\pi)$. L'ensemble $\{2\sqrt{2}k\pi \bmod 2\pi\} = 2\pi\{\sqrt{2}k \bmod 1\}$ est dense dans $[0, 2\pi]$, puisque $\mathbb{Z} + \sqrt{2}\mathbb{Z}$ est dense dans $\mathbb{R}$ : on peut choisir $k$ tel que $\sqrt{2}s + 2\sqrt{2}k\pi$ soit à moins de $\varepsilon$ de $\tau$ modulo $2\pi$. Par continuité uniforme de $F$, $h(\mathbb{R})$ est *dense dans $T$*.

    **3.** Supposons que $M = h(\mathbb{R})$ soit une sous-variété. Soit $a \in M$ et $U$ un voisinage de $a$ sur lequel un difféomorphisme redresse $M$ : $U \cap M$ est fermé dans $U$. Par densité, $U \cap T \subset \overline{U \cap M} \cap U = U \cap M$ : $M$ contient l'ouvert $U \cap T$ de $T$, donc un arc de parallèle $F(\{s_{0}\} \times \, ]\tau_{1}, \tau_{2}[)$, qui est non dénombrable. Mais $h(t)$ est sur le parallèle $F(\{s_{0}\} \times \mathbb{R})$ seulement si $t \in s_{0} + 2\pi\mathbb{Z}$ : $M$ rencontre chaque parallèle en un ensemble dénombrable.

    Cette contradiction montre que *$h(\mathbb{R})$ n'est pas une sous-variété*, bien que $h$ soit une immersion injective : c'est un exemple plus fort que celui de l'exercice 2, où le défaut n'était qu'en un point.
- id: "l3-gd-02-04"
  feuille: "f-l3-gd-02"
