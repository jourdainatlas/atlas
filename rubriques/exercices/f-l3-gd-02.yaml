  page_enonce: 5
  page_corrige: 10
  enonce: |
    **Le ruban de Möbius.** Soit $f : \, ]{-1}, 1[ \times \mathbb{R} \to \mathbb{R}^{3}$ définie par 
    $$f(u, v) = \big((2 + u\cos v)\cos 2v, \ (2 + u\cos v)\sin 2v, \ u\sin v\big) .$$

    **1.** Montrer que $f$ est une immersion, et que $f(u, v + \pi) = f(-u, v)$.

    **2.** Montrer que la restriction de $f$ à $]{-1}, 1[ \times \, ]v_{0}, v_{0} + \pi[$ est injective pour tout $v_{0}$.

    **3.** Prouver que l'image de $f$ est une surface. Faire un dessin.

    **4.** Le vecteur $N(u, v) = \dfrac{\partial_{u}f \wedge \partial_{v}f}{\lVert \partial_{u}f \wedge \partial_{v}f \rVert}$ est normal à la surface. Comparer $N(0, v + \pi)$ et $N(0, v)$, et interpréter.
  corrige: |
    Introduisons le repère orthonormé mobile $e_{1} = (\cos 2v, \sin 2v, 0)$, $e_{2} = (-\sin 2v, \cos 2v, 0)$, $e_{3} = (0, 0, 1)$, de sorte que $f = (2 + u\cos v)e_{1} + u\sin v\,e_{3}$.

    **1.** Avec $e_{1}' = 2e_{2}$ : 
    $$\partial_{u}f = \cos v\,e_{1} + \sin v\,e_{3}, \qquad \partial_{v}f = -u\sin v\,e_{1} + 2(2 + u\cos v)\,e_{2} + u\cos v\,e_{3} .$$
     La composante de $\partial_{v}f$ sur $e_{2}$ vaut au moins $2(2 - 1) = 2$, et $\partial_{u}f$, unitaire, n'en a pas : les deux vecteurs sont indépendants, *$f$ est une immersion.* Enfin
    $$f(u, v + \pi) = \big((2 - u\cos v)\cos 2v, (2 - u\cos v)\sin 2v, -u\sin v\big) = f(-u, v) .$$

    **2.** Si $f(u, v) = f(u', v')$, la projection horizontale $(2 + u\cos v)\,\mathrm{e}^{2\mathrm{i} v}$, de module strictement positif, donne $2v \equiv 2v' \pmod{2\pi}$, donc $v' = v$ si $|v - v'| < \pi$, puis $u\cos v = u'\cos v$ et $u\sin v = u'\sin v$, d'où $u = u'$.

    **3.** Sur la bande $B = \, ]{-1}, 1[ \times \, ]v_{0}, v_{0} + \pi[$, $f$ est une immersion injective, et son inverse est continu : l'angle $2v \in \, ]2v_{0}, 2v_{0} + 2\pi[$ est une fonction continue de la projection horizontale hors de la demi-droite d'angle $2v_{0}$, puis $u$ se lit sur les coordonnées. L'image $f(B)$ est l'image totale privée du segment $f(]{-1}, 1[ \times \{v_{0}\})$ (question 1), fermé dans l'image, donc $f(B)$ est un ouvert de l'image ; en faisant varier $v_{0}$, la caractérisation (3) du théorème 4 s'applique en tout point : *l'image est une surface*.

    ![Figure](documents/figures/1c8d0be73e6d75ee.svg)

    Le ruban de Möbius, image de $]{-1}, 1[ \times [0, \pi]$ : les bords $u = \pm 1$ (en bleu foncé), qui se raccordent en un seul bord, l'âme $u = 0$ (en rouge), le cercle de rayon $2$, et vingt-quatre segments $v =$ constante (en bleu clair). Le segment fait un demi-tour sur lui-même quand on parcourt l'âme.

    **4.** En $u = 0$, $\partial_{u}f = \cos v\,e_{1} + \sin v\,e_{3}$ et $\partial_{v}f = 4e_{2}$, donc $N(0, v) = \cos v\,e_{3} - \sin v\,e_{1}$, à un signe près fixé par l'orientation $(e_{1}, e_{2}, e_{3})$ ; comme $e_{1}$ et $e_{3}$ ne changent pas quand $v$ augmente de $\pi$, *$N(0, v + \pi) = -N(0, v)$*. Quand on fait un tour le long de l'âme, la normale revient opposée à elle-même : on ne peut pas choisir continûment un côté du ruban, *il n'est pas orientable*, il n'a qu'une face.
