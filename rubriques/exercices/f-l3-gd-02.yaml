  enonce: |
    **Surfaces de révolution.** Soit $\rho : [-1, 1] \to \mathbb{R}$ une fonction de classe $\mathcal{C}^{\infty}$ strictement positive, et $f : \mathbb{R} \times [-1, 1] \to \mathbb{R}^{3}$ définie par $f(\theta, z) = (\rho(z)\cos\theta, \rho(z)\sin\theta, z)$. On pose $U = \mathbb{R} \times \, ]{-1}, 1[$ et $S = f(U)$.

    **1.** Montrer que $S = \{(x, y, z) \in \mathbb{R}^{3} \mid x^{2} + y^{2} - \rho(z)^{2} = 0 \text{ et } -1 < z < 1\}$.

    **2.** Montrer que $S$ est une surface de classe $\mathcal{C}^{\infty}$.

    **3.** Montrer que la restriction de $f$ à $U_{\theta_{0}} = \, ]\theta_{0}, \theta_{0} + 2\pi[ \times \, ]{-1}, 1[$ est une paramétrisation de $S$ privée d'un méridien.
  corrige: |
    **1.** Pour $(\theta, z) \in U$, $x^{2} + y^{2} = \rho(z)^{2}$ et $-1 < z < 1$. Réciproquement, si $x^{2} + y^{2} = \rho(z)^{2} > 0$, écrivons $(x, y) = \rho(z)(\cos\theta, \sin\theta)$ : le point est $f(\theta, z)$.

    **2.** Sur l'ouvert $\mathbb{R}^{2} \times \, ]{-1}, 1[$, $g(x, y, z) = x^{2} + y^{2} - \rho(z)^{2}$ est $\mathcal{C}^{\infty}$ et $\nabla g = (2x, 2y, -2\rho\rho')$ ne s'annule pas sur $S$, où $(x, y) \neq 0$ puisque $\rho > 0$. *$S$ est une surface de classe $\mathcal{C}^{\infty}$.*

    **3.** $\partial_{\theta}f = \rho(z)(-\sin\theta, \cos\theta, 0)$ et $\partial_{z}f = (\rho'\cos\theta, \rho'\sin\theta, 1)$ sont indépendants (le premier est horizontal non nul, le second a une troisième composante $1$) ; $f$ est injective sur $U_{\theta_{0}}$, d'inverse $(x, y, z) \mapsto (\theta, z)$ continu hors du demi-plan méridien d'angle $\theta_{0}$, où l'angle polaire $\theta \in \, ]\theta_{0}, \theta_{0} + 2\pi[$ dépend continûment de $(x, y)$. C'est donc une paramétrisation de $S$ privée du méridien $f(\{\theta_{0}\} \times \, ]{-1}, 1[)$.
