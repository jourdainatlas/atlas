  enonce: |
    **Le parapluie de Cartan.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}^{3}$ définie par $f(u, v) = (u\cos v, u\sin v, u\cos^{3}v)$, et $M = f(\mathbb{R}^{2})$.

    **1.** Soit $U = \{(u, v) \in \mathbb{R}^{2} \mid u \neq 0\}$. Montrer que la restriction de $f$ à $U$ est une immersion. Déterminer $M \setminus f(U)$.

    **2.** Soit $h : \mathbb{R}^{3} \to \mathbb{R}$ définie par $h(x, y, z) = z(x^{2} + y^{2}) - x^{3}$, et $V = \{(x, y, z) \in \mathbb{R}^{3} \mid (x, y) \neq (0, 0)\}$. Montrer que $V$ est un ouvert de $\mathbb{R}^{3}$ et que la restriction de $h$ à $V$ est une submersion.

    **3.** Soit $P = h^{-1}(\{0\})$, le *parapluie de Cartan*. Montrer que $P \cap V$ est une sous-variété de dimension $2$ de $\mathbb{R}^{3}$, que $P \cap V = f(U)$, et déterminer $P \setminus f(U)$.

    **4.** Dessiner grossièrement $f(\{1\} \times \mathbb{R})$, en s'aidant de ses projections sur les plans $\{z = 0\}$ et $\{y = 0\}$, puis $f(\mathbb{R} \times \{0\})$. En déduire l'allure de $M$.

    **5.** Montrer que $M$ contient au moins trois droites passant par $0$ et non coplanaires.

    **6.** En déduire que $M$ n'est pas une sous-variété de dimension $2$ de $\mathbb{R}^{3}$, en regardant les vecteurs tangents à $M$ en $0$. Et $P$ ?
  corrige: |
    **1.** $\partial_{u}f = (\cos v, \sin v, \cos^{3}v)$, $\partial_{v}f = u(-\sin v, \cos v, -3\cos^{2}v\sin v)$. La troisième composante de leur produit vectoriel est $u(\cos^{2}v + \sin^{2}v) = u \neq 0$ sur $U$ : *immersion*. Comme $f(0, v) = 0$ et que $f(u, v) \neq 0$ pour $u \neq 0$ (sa projection horizontale $u(\cos v, \sin v)$ n'est pas nulle), $M \setminus f(U) = \{0\}$ et $M = f(U) \cup \{0\}$.

    **2.** $V$ est le complémentaire du fermé $\{x = y = 0\}$, donc ouvert. $\nabla h = (2xz - 3x^{2}, 2yz, x^{2} + y^{2})$ a une troisième composante non nulle sur $V$ : *submersion*.

    **3.** Par le théorème 4, caractérisation (2), l'ensemble $P \cap V$, image réciproque de $0$ par $h_{|V}$, est une *surface*. Pour $(u, v) \in U$, $z(x^{2} + y^{2}) = u\cos^{3}v\cdot u^{2} = x^{3}$, donc $f(U) \subset P \cap V$. Réciproquement, si $(x, y, z) \in P \cap V$, écrivons $(x, y) = u(\cos v, \sin v)$ avec $u \neq 0$ ; alors $z = \dfrac{x^{3}}{x^{2} + y^{2}} = u\cos^{3}v$. Enfin $P \setminus V = \{x = y = 0\}$ : tout l'axe $Oz$ est dans $P$, puisque $h(0, 0, z) = 0$. Donc *$P = f(U) \cup Oz$* : le parapluie a un « manche ».

    **4.** La courbe $f(\{1\} \times \mathbb{R})$, $(\cos v, \sin v, \cos^{3}v)$, se projette sur le cercle unité du plan $z = 0$ et, sur le plan $y = 0$, sur l'arc $z = x^{3}$, $x \in [-1, 1]$ : elle monte et descend deux fois en faisant le tour. $f(\mathbb{R} \times \{0\})$ est la droite $\mathbb{R}(1, 0, 1)$. Plus généralement, $f(\mathbb{R} \times \{v\})$ est la droite dirigée par $d_{v} = (\cos v, \sin v, \cos^{3}v)$, et $M$ est réunion de ces droites, comme une toile tendue sur la courbe précédente.

    **5.** Les vecteurs $d_{0} = (1, 0, 1)$, $d_{\pi/2} = (0, 1, 0)$ et
    $$d_{\pi/4} = \frac{\sqrt{2}}{2}\left(1, 1, \frac{1}{2}\right)$$
     ne sont pas coplanaires, car
    $$\det\left((1, 0, 1), (0, 1, 0), (1, 1, \tfrac{1}{2})\right) = -\frac{1}{2} \neq 0 .$$

    ![Figure](documents/figures/e0b0fc50239e3ceb.svg)

    Le parapluie de Cartan : seize des droites $f(\mathbb{R} \times \{v\})$ (en bleu), toutes issues de l'origine, la courbe $u = 1$ (en violet) qui fait deux fois l'aller et retour en hauteur, et le manche $Oz$ (en rouge), contenu dans $P$ mais pas dans $M$. En $0$, trop de droites passent pour qu'un plan tangent existe.

    **6.** Si $M$ était une surface, $T_{0}M$ contiendrait $d_{0}$, $d_{\pi/2}$, $d_{\pi/4}$, vitesses des courbes $t \mapsto t\,d_{v}$ tracées sur $M$ ; il serait de dimension $3$, contradiction avec le théorème 5. *$M$ n'est pas une surface*, et $P$, qui coïncide avec $M$ au voisinage de $0$ à l'axe $Oz$ près et contient les mêmes droites, non plus.
- id: "l3-gd-02-06"
  feuille: "f-l3-gd-02"
  numero: 6
  partie: "Reconnaître une sous-variété"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-variétés]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, espace-tangent-sv, point-critique]
  source: "Bordeaux 2016, feuille 3, exercice 3 ; devoir surveillé du 18/03/2016, exercice 3"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **Quadriques.**

    **1.** Les applications suivantes $f : \mathbb{R}^{3} \to \mathbb{R}$ sont-elles des submersions ? Peut-on les restreindre à un voisinage ouvert de $f^{-1}(\{0\})$ de sorte que la restriction soit une submersion ? Représenter $f^{-1}(\{0\})$.

    **(a)** $f(x, y, z) = x^{2} + y^{2} + z^{2} - a^{2}$, où $a > 0$ ;

    **(b)** $f(x, y, z) = x^{2} + y^{2} - z^{2}$ ;

    **(c)** $f(x, y, z) = x^{2} + y^{2} - z$.

    **2.** Soient $a, b > 0$. Montrer que l'hyperboloïde à une nappe $M = \left\{\dfrac{x^{2}}{a^{2}} + \dfrac{y^{2}}{a^{2}} - \dfrac{z^{2}}{b^{2}} = 1\right\}$ est une sous-variété de $\mathbb{R}^{3}$.

    **3.** Soit $L$ le demi-plan fermé $\{y = 0, \ x \geq 0\}$ et $S = M \setminus L$. Faire un dessin, et donner une paramétrisation $f : U \to S$ définie sur un ouvert $U$ de $\mathbb{R}^{2}$, bijective sur $S$.

    **4.** *Hyperquadriques.* Soit $A$ une matrice symétrique inversible de taille $d$, soit $b \in \mathbb{R}^{d}$, et $H = \{x \in \mathbb{R}^{d} \mid {x}^{T}Ax + \langle b, x \rangle = 1\}$. Déterminer les points de $\mathbb{R}^{d}$ où l'application $x \mapsto {x}^{T}Ax + \langle b, x \rangle$ n'est pas une submersion. En déduire que, si ${b}^{T}A^{-1}b \neq -4$, $H$ est vide ou est une sous-variété de dimension $d - 1$. Montrer que, si ${b}^{T}A^{-1}b = -4$ et $d \geq 2$, $H$ n'est pas une sous-variété de dimension $d - 1$ : on pourra écrire l'équation de $H$ en fonction de $x - x_{0}$, où $x_{0}$ est le point critique. Que dire de $x^{2} - y^{2} + 2y = 1$ ?
  corrige: |
    **1.** (a) $\nabla f = 2(x, y, z)$ ne s'annule qu'en $0$, qui n'est pas sur la sphère : la restriction à $\mathbb{R}^{3} \setminus \{0\}$ est une submersion, et *la sphère est une surface.* (b) $\nabla f = 2(x, y, -z)$ s'annule en $0 \in f^{-1}(\{0\})$ : aucune restriction à un voisinage de $f^{-1}(\{0\})$ n'est une submersion. Le cône n'est d'ailleurs pas une sous-variété (cours, prop. 2). (c) $\nabla f = (2x, 2y, -1)$ ne s'annule jamais : *submersion sur $\mathbb{R}^{3}$*, et le paraboloïde de révolution $z = x^{2} + y^{2}$ est une surface.

    **2.** Le gradient de
    $$g = \frac{x^{2} + y^{2}}{a^{2}} - \frac{z^{2}}{b^{2}} - 1$$
     ne s'annule qu'en $0$, et $g(0) = -1 \neq 0$ : *$M$ est une surface.*

    **3.** Posons
    $$f(\theta, t) = (a\operatorname{ch}t\cos\theta, a\operatorname{ch}t\sin\theta, b\operatorname{sh}t)$$
     sur $U = \, ]0, 2\pi[ \times \mathbb{R}$. Comme $\operatorname{ch}^{2} - \operatorname{sh}^{2} = 1$, $f(U) \subset M$ ; un point de $M$ a une distance à l'axe $a\sqrt{1 + z^{2}/b^{2}} = a\operatorname{ch}t$ pour un unique $t$, et un angle polaire $\theta$ unique dans $]0, 2\pi[$ hors de $L$ : *$f$ est une bijection de $U$ sur $S$*. C'est une immersion ($\partial_{\theta}f$ horizontal non nul, $\partial_{t}f$ de troisième composante $b\operatorname{ch}t \neq 0$) et un homéomorphisme, l'angle polaire étant continu hors de $L$.

    ![Figure](documents/figures/21a0db94ccb4f197.svg)

    L'hyperboloïde à une nappe ($a = b = 1$) : le cercle de gorge et deux cercles horizontaux (en bleu foncé), et seize de ses génératrices rectilignes (en bleu clair), car cette surface courbe est réunion de droites. Le demi-plan $L$ (en violet) est retiré pour que la paramétrisation soit bijective.

    **4.** $\nabla({x}^{T}Ax + \langle b, x \rangle) = 2Ax + b$ s'annule au seul point $x_{0} = -\dfrac{1}{2}A^{-1}b$, où la fonction vaut
    $${x_{0}}^{T}Ax_{0} + \langle b, x_{0} \rangle = \frac{1}{4}{b}^{T}A^{-1}b - \frac{1}{2}{b}^{T}A^{-1}b = -\frac{1}{4}{b}^{T}A^{-1}b .$$
     Si ${b}^{T}A^{-1}b \neq -4$, $x_{0} \notin H$, et $H$ est vide ou une sous-variété de dimension $d - 1$ par le théorème 4. Si ${b}^{T}A^{-1}b = -4$, l'équation de $H$ s'écrit, avec $y = x - x_{0}$, ${y}^{T}Ay = 0$ : si $A$ est définie (positive ou négative), $H = \{x_{0}\}$ est réduit à un point ; sinon, $H$ est un cône de sommet $x_{0}$, stable par les homothéties de centre $x_{0}$, et le raisonnement de la proposition 2 du cours montre que $T_{x_{0}}H$ contiendrait $H - x_{0}$, qui engendre $\mathbb{R}^{d}$.

    Dans les deux cas, *$H$ n'est pas une sous-variété de dimension $d - 1$*. Pour $x^{2} - y^{2} + 2y = 1$, $A = \operatorname{diag}(1, -1)$, $b = (0, 2)$ et ${b}^{T}A^{-1}b = -4$ : l'équation s'écrit $x^{2} = (y - 1)^{2}$, deux droites sécantes en $(0, 1)$. L'hypothèse « $A$ inversible » seule ne suffit donc pas.
- id: "l3-gd-02-07"
  feuille: "f-l3-gd-02"
  numero: 7
  partie: "Reconnaître une sous-variété"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-variétés]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, espace-tangent-sv]
  source: "Bordeaux 2016, feuille 3, exercice 4 ; Bibmath, exercice 8"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Sous-variétés définies par deux équations.**

    **1.** Montrer que la partie de $\mathbb{R}^{3}$ définie par les équations $x\cos z + y\sin z = 0$ et $x^{2} + y^{2} = 1$ est une sous-variété de dimension $1$. Faire un dessin, et reconnaître ses composantes.

    **2.** Montrer que $\mathcal{C} = \{(x, y, z) \in \mathbb{R}^{3} \mid 4xy + 2xz + 4y - z = 0 \text{ et } xy + 2x - z = 0\}$ est une sous-variété de $\mathbb{R}^{3}$, préciser sa dimension et déterminer sa tangente en $(0, 0, 0)$. On pourra éliminer $z$ et montrer que $\mathcal{C}$ est un graphe au-dessus de l'axe des $x$.
  corrige: |
    **1.** Sur l'ensemble, $(x, y) = (\cos\theta, \sin\theta)$ avec $\cos(\theta - z) = 0$, c'est-à-dire $(x, y) = \pm(-\sin z, \cos z)$. Les gradients $(\cos z, \sin z, -x\sin z + y\cos z)$ et $(2x, 2y, 0)$ sont indépendants : la troisième composante du premier vaut $\pm 1$, et $(x, y) \neq 0$. *C'est une sous-variété de dimension $1$*, réunion des deux hélices $(-\sin z, \cos z, z)$ et $(\sin z, -\cos z, z)$, tracées sur le cylindre et symétriques par rapport à l'axe.

    ![Figure](documents/figures/9b1652da5e8399d4.svg)

    Les deux hélices (en bleu et en orange) qui forment l'intersection du cylindre $x^{2} + y^{2} = 1$ (cercles gris) et de l'hélicoïde $x\cos z + y\sin z = 0$ ; l'axe vertical a été comprimé d'un facteur $0{,}35$.

    **2.** La seconde équation donne $z = xy + 2x$ ; en reportant dans la première,
    $$3xy + 2x^{2}y + 4x^{2} + 4y - 2x = 0 ,$$
     soit 
    $$y = \frac{2x - 4x^{2}}{2x^{2} + 3x + 4} ,$$
     le dénominateur, de discriminant $9 - 32 < 0$, ne s'annulant pas. Donc $\mathcal{C}$ est le graphe d'une application $\mathcal{C}^{\infty}$ $x \mapsto (y(x), z(x))$ : *sous-variété de dimension $1$*. En $0$, les gradients des deux équations sont $(0, 4, -1)$ et $(2, 0, -1)$, et la tangente est leur intersection orthogonale, dirigée par *$(0, 4, -1) \wedge (2, 0, -1) = (-4, -2, -8)$, soit $(2, 1, 4)$*.
- id: "l3-gd-02-08"
  feuille: "f-l3-gd-02"
  numero: 8
  partie: "Reconnaître une sous-variété"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-variétés, plan tangent]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, espace-tangent-sv, plan-tangent]
  source: "Bibmath, exercice 6 ; Bordeaux 2016, feuille 3, exercice 11"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **Plans tangents, contour apparent.**

    **1.** Montrer que $S = \{(x, y, z) \in \mathbb{R}^{3} \mid xy + xz + 2x + 2y - z = 0\}$ est une surface, et déterminer son plan tangent à l'origine.

    **2.** Soit $a, b, c > 0$, $G(x, y, z) = \dfrac{x^{2}}{a^{2}} + \dfrac{y^{2}}{b^{2}} + \dfrac{z^{2}}{c^{2}}$ et $\mathcal{E}$ l'ellipsoïde d'équation $G = 1$. Montrer que $\mathcal{E}$ est une surface, et donner une équation du plan tangent affine $H_{p}$ à $\mathcal{E}$ en un point $p$.

    **3.** Déterminer les points de $\mathcal{E}$ les plus proches et les plus éloignés de l'origine, lorsque $a < b < c$.

    **4.** Soit $q = (x_{0}, y_{0}, z_{0})$ un point extérieur à $\mathcal{E}$, c'est-à-dire tel que $G(q) > 1$. On note $C(q)$ l'ensemble des points $p \in \mathcal{E}$ tels que $H_{p}$ contienne $q$. Faire un dessin et expliquer pourquoi l'on appelle $C(q)$ le *contour apparent* de $\mathcal{E}$ vu depuis $q$.

    **5.** Démontrer que $C(q)$ est l'intersection de $\mathcal{E}$ avec un plan affine, et en déduire que c'est une ellipse.
  corrige: |
    **1.** $\nabla = (y + z + 2, x + 2, x - 1)$ ne s'annule jamais ($x = -2$ et $x = 1$ sont incompatibles) : *$S$ est une surface*, et son plan tangent à l'origine est orthogonal à $(2, 2, -1)$ : *$2x + 2y - z = 0$.*

    **2.** Le gradient
    $$\nabla G = 2\left(\frac{x}{a^{2}}, \frac{y}{b^{2}}, \frac{z}{c^{2}}\right)$$
     ne s'annule qu'en $0 \notin \mathcal{E}$ : surface. Le plan tangent en $p = (x_{p}, y_{p}, z_{p})$ est $\dfrac{x_{p}(x - x_{p})}{a^{2}} + \ldots = 0$, soit, puisque $G(p) = 1$, 
    $$H_{p} : \ \frac{x_{p}x}{a^{2}} + \frac{y_{p}y}{b^{2}} + \frac{z_{p}z}{c^{2}} = 1 .$$

    **3.** On cherche les extrema de $\lVert p \rVert^{2}$ sur le compact $\mathcal{E}$. Par le théorème 6, $p = \lambda\nabla G(p)$, donc $x_{p}(1 - \lambda/a^{2}) = 0$, etc. : comme $a, b, c$ sont distincts, $p$ est sur un axe, $p \in \{\pm a e_{1}, \pm b e_{2}, \pm c e_{3}\}$. *Les plus proches sont $\pm a e_{1}$ (distance $a$), les plus éloignés $\pm c e_{3}$ (distance $c$)* ; $\pm b e_{2}$ sont des points critiques qui ne sont pas des extrema (des cols de la distance).

    **4.** Les points de $C(q)$ sont ceux où le plan tangent passe par $q$, c'est-à-dire ceux où la droite issue de $q$ est tangente à $\mathcal{E}$ : vu depuis $q$, ce sont les points du bord apparent de l'ellipsoïde, la limite entre la partie visible et la partie cachée.

    **5.** $p \in C(q)$ si et seulement si $p \in \mathcal{E}$ et $q \in H_{p}$, c'est-à-dire
    $$\frac{x_{0}x_{p}}{a^{2}} + \frac{y_{0}y_{p}}{b^{2}} + \frac{z_{0}z_{p}}{c^{2}} = 1 ,$$
     équation symétrique en $p$ et $q$ : *$C(q)$ est l'intersection de $\mathcal{E}$ avec le plan $\Pi_{q}$ d'équation*
    $$\frac{x_{0}x}{a^{2}} + \frac{y_{0}y}{b^{2}} + \frac{z_{0}z}{c^{2}} = 1 ,$$
     le plan polaire de $q$. Ce plan contient le point $\dfrac{q}{G(q)}$, qui est intérieur à l'ellipsoïde puisque
    $$G\left(\frac{q}{G(q)}\right) = \frac{1}{G(q)} < 1 .$$
     L'intersection d'un ellipsoïde et d'un plan qui le coupe en plus d'un point est une ellipse : l'application linéaire $(x, y, z) \mapsto (x/a, y/b, z/c)$ envoie $\mathcal{E}$ sur la sphère unité et $\Pi_{q}$ sur un plan, qui passe par un point intérieur à la boule unité, et dont l'intersection avec la sphère est donc un cercle de rayon non nul ; l'image réciproque de ce cercle par cette application linéaire est *une ellipse*.
- id: "l3-gd-02-09"
  feuille: "f-l3-gd-02"
  numero: 9
  partie: "Reconnaître une sous-variété"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [sous-variétés]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, espace-tangent-sv]
  source: "Bibmath, exercice 5"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Produit de sous-variétés.** Soit $M_{1}$ une sous-variété de dimension $d_{1}$ de $\mathbb{R}^{n}$ et $M_{2}$ une sous-variété de dimension $d_{2}$ de $\mathbb{R}^{m}$. Montrer que $M_{1} \times M_{2}$ est une sous-variété de $\mathbb{R}^{n + m}$, de dimension $d_{1} + d_{2}$, et que $T_{(a_{1}, a_{2})}(M_{1} \times M_{2}) = T_{a_{1}}M_{1} \times T_{a_{2}}M_{2}$. Application : montrer que $\mathbb{S}^{1} \times \mathbb{S}^{1}$ est une surface compacte de $\mathbb{R}^{4}$.
  corrige: |
    Soit $a = (a_{1}, a_{2}) \in M_{1} \times M_{2}$. Par le théorème 4, il existe des voisinages $U_{i}$ de $a_{i}$ et des submersions $g_{1} : U_{1} \to \mathbb{R}^{n - d_{1}}$, $g_{2} : U_{2} \to \mathbb{R}^{m - d_{2}}$ telles que $U_{i} \cap M_{i} = g_{i}^{-1}(\{0\})$. Alors $G(x_{1}, x_{2}) = (g_{1}(x_{1}), g_{2}(x_{2}))$ est définie sur le voisinage $U_{1} \times U_{2}$ de $a$, de différentielle $d_{a}G(h_{1}, h_{2}) = (d_{a_{1}}g_{1}(h_{1}), d_{a_{2}}g_{2}(h_{2}))$ surjective, et $(U_{1} \times U_{2}) \cap (M_{1} \times M_{2}) = G^{-1}(\{0\})$. *$M_{1} \times M_{2}$ est une sous-variété de codimension $(n - d_{1}) + (m - d_{2})$, donc de dimension $d_{1} + d_{2}$*, et la proposition 1 donne
    $$T_{a}(M_{1} \times M_{2}) = \mathrm{Ker}\, d_{a}G = \mathrm{Ker}\, d_{a_{1}}g_{1} \times \mathrm{Ker}\, d_{a_{2}}g_{2} = T_{a_{1}}M_{1} \times T_{a_{2}}M_{2} .$$
     Comme $\mathbb{S}^{1}$ est une courbe compacte de $\mathbb{R}^{2}$, *$\mathbb{S}^{1} \times \mathbb{S}^{1}$ est une surface compacte de $\mathbb{R}^{4}$*, le « tore plat », produit de deux compacts.
- id: "l3-gd-02-10"
  feuille: "f-l3-gd-02"
  numero: 10
  partie: "Exemples classiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sous-variétés]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, plan-tangent]
  source: "Bordeaux 2016, feuille 3, exercice 8"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Sphères, projection stéréographique.**

    **1.** Montrer que $\mathbb{S}^{n}$ est une sous-variété de dimension $n$ de $\mathbb{R}^{n + 1}$, et que $T_{a}\mathbb{S}^{n} = a^{\perp}$.

    **2.** Soit $a \in \mathbb{S}^{n}$ dont la dernière coordonnée $a_{n + 1}$ est strictement positive. Donner une paramétrisation de $\mathbb{S}^{n}$ au voisinage de $a$ de la forme $(x_{1}, \dots, x_{n}) \mapsto (x_{1}, \dots, x_{n}, \varphi(x))$.

    **3.** On note $N = (0, \dots, 0, 1)$ le pôle nord. La *projection stéréographique* $\pi_{N}$ associe à $x \in \mathbb{S}^{n} \setminus \{N\}$ l'intersection de la droite $(Nx)$ avec l'hyperplan $\mathbb{R}^{n} \times \{0\}$. Montrer que 
    $$\pi_{N}(x) = \frac{(x_{1}, \dots, x_{n})}{1 - x_{n + 1}} , \qquad \pi_{N}^{-1}(y) = \left(\frac{2y}{1 + \lVert y \rVert^{2}}, \ \frac{\lVert y \rVert^{2} - 1}{\lVert y \rVert^{2} + 1}\right) \quad (y \in \mathbb{R}^{n}) ,$$
     et que $\pi_{N}^{-1}$ est une paramétrisation de $\mathbb{S}^{n} \setminus \{N\}$ définie sur $\mathbb{R}^{n}$ tout entier.

    **4.** Avec la projection $\pi_{S}$ depuis le pôle sud $S = -N$, montrer que deux paramétrisations suffisent à recouvrir $\mathbb{S}^{n}$, et calculer le changement de paramétrisation $\pi_{S} \circ \pi_{N}^{-1}$ sur $\mathbb{R}^{n} \setminus \{0\}$. Vérifier qu'il est de classe $\mathcal{C}^{\infty}$.

    **5.** Pour $n = 2$, vérifier de même que les changements de paramétrisation entre les six paramétrisations de la forme $(x, y) \mapsto (x, y, \pm\sqrt{1 - x^{2} - y^{2}})$, et celles obtenues en permutant les coordonnées, sont de classe $\mathcal{C}^{\infty}$ là où ils sont définis.
  corrige: |
    **1.** $g(x) = \lVert x \rVert^{2} - 1$ a pour gradient $2x$, non nul sur $\mathbb{S}^{n}$ : par le théorème 4, *$\mathbb{S}^{n}$ est une sous-variété de dimension $n$*, et $T_{a}\mathbb{S}^{n} = \mathrm{Ker}\, d_{a}g = \{v \mid \langle a, v \rangle = 0\} = a^{\perp}$ (proposition 1).

    **2.** Sur l'ouvert $\{x \in \mathbb{S}^{n} \mid x_{n + 1} > 0\}$, $x_{n + 1} = \sqrt{1 - x_{1}^{2} - \dots - x_{n}^{2}}$ : $\mathbb{S}^{n}$ y est le graphe de *$\varphi(x) = \sqrt{1 - \lVert x \rVert^{2}}$ sur la boule unité ouverte de $\mathbb{R}^{n}$*, et $(x_{1}, \dots, x_{n}) \mapsto (x, \varphi(x))$ est une paramétrisation au voisinage de $a$.

    **3.** La droite $(Nx)$ est formée des points $N + \lambda(x - N)$, de dernière coordonnée $1 + \lambda(x_{n + 1} - 1)$, nulle pour $\lambda = \dfrac{1}{1 - x_{n + 1}}$ : d'où
    $$\pi_{N}(x) = \frac{(x_{1}, \dots, x_{n})}{1 - x_{n + 1}} .$$
     Réciproquement, pour $y \in \mathbb{R}^{n}$, cherchons $x = N + \mu((y, 0) - N)$ sur la sphère : $\mu^{2}\lVert y \rVert^{2} + (1 - \mu)^{2} = 1$ donne $\mu = \dfrac{2}{1 + \lVert y \rVert^{2}}$ (l'autre solution $\mu = 0$ donne $N$), d'où la formule de $\pi_{N}^{-1}$.

    L'application $\pi_{N}^{-1}$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}^{n}$, bijective sur $\mathbb{S}^{n} \setminus \{N\}$ ; comme $\pi_{N} \circ \pi_{N}^{-1} = \mathrm{id}$ avec $\pi_{N}$ de classe $\mathcal{C}^{\infty}$ au voisinage de $\mathbb{S}^{n} \setminus \{N\}$, sa différentielle est injective, et son inverse $\pi_{N}$ est continu : *c'est une paramétrisation globale de la sphère privée d'un point.*

    ![Figure](documents/figures/c190c475b0a4149e.svg)

    La projection stéréographique depuis le pôle nord, dans une coupe par un plan contenant l'axe : le point $x = (0{,}8 ; 0{,}6)$ de l'hémisphère nord est envoyé hors de la boule, en $\pi_{N}(x) = 2$, le point $x' = (-0{,}6 ; -0{,}8)$ de l'hémisphère sud à l'intérieur, en $-\dfrac{1}{3}$. Quand $x$ s'approche de $N$, $\pi_{N}(x)$ part à l'infini.

    **4.** De même
    $$\pi_{S}(x) = \frac{(x_{1}, \dots, x_{n})}{1 + x_{n + 1}} ,$$
     et les deux paramétrisations $\pi_{N}^{-1}$, $\pi_{S}^{-1}$ recouvrent $\mathbb{S}^{n}$. Pour $y \neq 0$, 
    $$\pi_{S} \circ \pi_{N}^{-1}(y) = \frac{\frac{2y}{1 + \lVert y \rVert^{2}}}{1 + \frac{\lVert y \rVert^{2} - 1}{\lVert y \rVert^{2} + 1}} = \boxed{\frac{y}{\lVert y \rVert^{2}}} ,$$
     l'inversion de centre $0$ et de rapport $1$, de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}^{n} \setminus \{0\}$, et involutive.

    **5.** Par exemple, avec $h_{1}(x, y) = (x, y, \sqrt{1 - x^{2} - y^{2}})$ et $h_{2}(y, z) = (\sqrt{1 - y^{2} - z^{2}}, y, z)$, l'image commune est $\{x > 0, z > 0\}$ et $h_{2}^{-1} \circ h_{1}(x, y) = \left(y, \sqrt{1 - x^{2} - y^{2}}\right)$, de classe $\mathcal{C}^{\infty}$ sur $\{x > 0, x^{2} + y^{2} < 1\}$ puisque la racine y porte sur une quantité strictement positive. Les autres cas s'en déduisent par permutation des coordonnées et changement de signe. La proposition 1 du chapitre 3 montrera que les changements de paramétrisation d'une surface sont toujours des difféomorphismes.
- id: "l3-gd-02-11"
  feuille: "f-l3-gd-02"
  numero: 11
  partie: "Exemples classiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sous-variétés, plan tangent]
  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, plan-tangent]
  source: "Bordeaux 2016, feuille 3, exercice 9 ; Bibmath, exercice 7 (le tore R = 2, r = 1)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Le tore.** Soient $r, R > 0$ et
    $$T = \left\{(x, y, z) \in \mathbb{R}^{3} \;\middle|\; \left(\sqrt{x^{2} + y^{2}} - R\right)^{2} + z^{2} = r^{2}\right\} .$$

    **1.** Déterminer pour quelles valeurs de $r$ et $R$ la partie $T$ est une surface. Dessiner $T$ dans les différents cas.

    **2.** Montrer que, pour $r < R$, $T$ est aussi défini par l'équation $(x^{2} + y^{2} + z^{2} + R^{2} - r^{2})^{2} = 4R^{2}(x^{2} + y^{2})$. Que devient l'ensemble défini par cette équation quand $r \geq R$ ?

    **3.** Pour $R = 2$ et $r = 1$, montrer directement que $\{(x^{2} + y^{2} + z^{2} + 3)^{2} - 16(x^{2} + y^{2}) = 0\}$ est une surface, et déterminer son plan tangent en $(3, 0, 0)$.

    **4.** Donner une paramétrisation de $T$ au voisinage de chaque point.
  corrige: |
    Notons $\rho = \sqrt{x^{2} + y^{2}}$ la distance à l'axe ; $T$ est engendré par la rotation autour de $Oz$ du cercle de centre $(R, 0)$ et de rayon $r$ du demi-plan méridien $\{(\rho, z) \mid \rho \geq 0\}$.

    **1.** *Si $r < R$*, $T \subset \{\rho \geq R - r > 0\}$, où $g = (\rho - R)^{2} + z^{2} - r^{2}$ est $\mathcal{C}^{\infty}$, de gradient $2\left(\dfrac{(\rho - R)x}{\rho}, \dfrac{(\rho - R)y}{\rho}, z\right)$, nul seulement si $\rho = R$ et $z = 0$, hors de $T$ : *$T$ est une surface*, le tore de révolution. *Si $r = R$*, $T$ passe par l'origine, et près de $0$ il est formé des deux nappes $z = \pm\sqrt{2R\rho - \rho^{2}}$ qui se touchent en $0$ ; privé de $0$, il a deux composantes locales, alors qu'une surface, graphe au-dessus d'un disque, privée d'un point reste connexe localement : *ce n'est pas une surface.* *Si $r > R$*, le cercle méridien coupe l'axe en $(0, \pm\sqrt{r^{2} - R^{2}})$ ; en ces deux points, $T$ présente deux pointes, comme un cône, et *n'est pas une surface* pour la même raison.

    ![Figure](documents/figures/a10b49bddbd802c4.svg)

    Coupes de $T$ par un plan contenant l'axe $Oz$, pour $(R, r) = (2, 1)$, $(1, 1)$ et $(1 ; 1{,}5)$. Seul le premier cas donne une surface ; dans les deux autres, les points rouges, sur l'axe, sont des points singuliers où se rejoignent deux nappes.

    **2.** Pour $\rho \geq 0$, $(\rho - R)^{2} + z^{2} = r^{2}$ équivaut à $\rho^{2} + z^{2} + R^{2} - r^{2} = 2R\rho$, et en élevant au carré, $(x^{2} + y^{2} + z^{2} + R^{2} - r^{2})^{2} = 4R^{2}\rho^{2}$. Réciproquement, cette équation équivaut à $(\rho \mp R)^{2} + z^{2} = r^{2}$, et l'égalité avec le signe $+$ est impossible si $r < R$, puisque $(\rho + R)^{2} \geq R^{2} > r^{2}$. Si $r \geq R$, l'équation définit la réunion des deux surfaces obtenues avec les deux signes : la courbe méridienne est le cercle entier et son symétrique par rapport à l'axe.

    **3.** $F = (x^{2} + y^{2} + z^{2} + 3)^{2} - 16(x^{2} + y^{2})$ a pour gradient $4\big(x(\lVert p \rVert^{2} - 5), y(\lVert p \rVert^{2} - 5), z(\lVert p \rVert^{2} + 3)\big)$, nul seulement si $z = 0$ et ($x = y = 0$ ou $x^{2} + y^{2} = 5$) ; en ces points, $F$ vaut $9$ ou $-16$, donc ils ne sont pas sur la surface, qui est donc une *surface*. En $(3, 0, 0)$, le gradient vaut $(48, 0, 0)$ : *plan tangent $x = 3$.*

    **4.** L'application $F(s, \tau) = ((R + r\cos s)\cos\tau, (R + r\cos s)\sin\tau, r\sin s)$, restreinte à un carré $]s_{0}, s_{0} + 2\pi[ \times \, ]\tau_{0}, \tau_{0} + 2\pi[$, est une paramétrisation de $T$ privé d'un méridien et d'un parallèle ; ces carrés recouvrent $T$.
