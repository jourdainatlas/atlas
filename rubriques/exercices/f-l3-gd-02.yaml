  noeuds: [gd-sous-varietes, gd-tangent-sm]
  notions: [sous-variete, espace-tangent-sv]
  source: "Bibmath, exercices 2 et 3"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Sous-variété ou non ?** Pour chacune des parties suivantes, dire si c'est une sous-variété, en précisant sa dimension et, lorsqu'on le demande, le plus grand entier $p$ tel qu'elle soit de classe $\mathcal{C}^{p}$ :

    **(a)** $\{(x, y, z) \in \mathbb{R}^{3} \mid z = x - 2(x^{2} + y^{2})\}$ ;

    **(b)** $\{(t, t^{2}) \mid t \in \mathbb{R}\}$ ;

    **(c)** $\{(x, y) \in \mathbb{R}^{2} \mid xy = 0\}$ ;

    **(d)** $\{(x, y) \in \mathbb{R}^{2} \mid x > 0 \text{ et } y \geq 0\}$ ;

    **(e)** $\{(x, y) \in \mathbb{R}^{2} \mid x^{2} - y^{2} = \alpha\}$, selon la valeur du réel $\alpha$ ;

    **(f)** $\{(x, y, z) \in \mathbb{R}^{3} \mid x^{3} + y^{3} + z^{3} - 3xyz = 1\}$ ; on pourra remarquer que, si le gradient s'annule, alors $x^{2} + y^{2} + z^{2} - xy - yz - zx = 0$ ;

    **(g)** $\{(x, y, z) \in \mathbb{R}^{3} \mid x^{2} + y^{2} + z^{2} = 1 \text{ et } x^{2} + y^{2} - x = 0\}$ (fenêtre de Viviani) ;

    **(h)** $\{(t, t^{2}) \mid t \leq 0\} \cup \{(t, -t^{2}) \mid t \geq 0\}$, en donnant le plus grand $p$ possible ;

    **(i)** $\{(x, y) \in \mathbb{R}^{2} \mid y = |x|\}$ ;

    **(j)**
    $$\left\{\left(\cos t, \cos\frac{t}{3} + \sin\frac{t}{3}\right) \;\middle|\; t \in \left]0, 4\pi + \frac{3\pi}{4}\right[\right\} ;$$
    on pourra calculer la limite du point quand $t$ tend vers $4\pi + \dfrac{3\pi}{4}$.
  corrige: |
    **(a)** Graphe de la fonction $\mathcal{C}^{\infty}$ $(x, y) \mapsto x - 2(x^{2} + y^{2})$ : *sous-variété de dimension $2$, de classe $\mathcal{C}^{\infty}$* (c'est un paraboloïde).

    **(b)** Graphe de $t \mapsto t^{2}$ : *dimension $1$, classe $\mathcal{C}^{\infty}$.*

    **(c)** *Non.* Près de $0$, l'ensemble privé de $0$ a quatre composantes locales (les quatre demi-axes), alors qu'une sous-variété de dimension $1$ en a deux ; il n'est pas de dimension $2$ (intérieur vide) ni $0$.

    **(d)** *Non.* De dimension $2$, il serait ouvert (une sous-variété de dimension $n$ de $\mathbb{R}^{n}$ est un ouvert, par le redressement) ; or aucun voisinage de $(1, 0)$ n'y est contenu. De dimension $0$ ou $1$, il serait d'intérieur vide, alors qu'il contient $]0, +\infty[ \times \, ]0, +\infty[$.

    **(e)** Le gradient $(2x, -2y)$ ne s'annule qu'en $0$, qui est sur la courbe si et seulement si $\alpha = 0$. *Pour $\alpha \neq 0$, hyperbole, sous-variété de dimension $1$ ; pour $\alpha = 0$, deux droites sécantes, qui ne forment pas une sous-variété* (comme en (c)).

    **(f)** Si $\nabla g = 3(x^{2} - yz, y^{2} - zx, z^{2} - xy)$ est nul, la somme des composantes donne
    $$x^{2} + y^{2} + z^{2} - xy - yz - zx = \frac{1}{2}\big((x - y)^{2} + (y - z)^{2} + (z - x)^{2}\big) = 0 ,$$
     donc $x = y = z$, et $g(x, x, x) = 0 \neq 1$. *Surface de classe $\mathcal{C}^{\infty}$.*

    **(g)** Les gradients $(2x, 2y, 2z)$ et $(2x - 1, 2y, 0)$ ont pour produit vectoriel $(-4yz, 2z(2x - 1), 2y)$, nul sur l'ensemble seulement si $y = 0$ et $z(2x - 1) = 0$, c'est-à-dire au point $(1, 0, 0)$. Hors de ce point, *sous-variété de dimension $1$*. En $(1, 0, 0)$, la courbe, paramétrée par $(\cos^{2}t, \cos t\sin t, \sin t)$, passe deux fois, en $t = 0$ et $t = \pi$, avec les vitesses $(0, 1, 1)$ et $(0, 1, -1)$, qui ne sont pas colinéaires : elle y fait une croix, et, privée du point, elle a quatre composantes locales. *La fenêtre de Viviani n'est pas une sous-variété.*

    **(h)** C'est le graphe de $\varphi(t) = -t|t|$, de classe $\mathcal{C}^{1}$ et pas $\mathcal{C}^{2}$ en $0$ : *sous-variété de dimension $1$ de classe $\mathcal{C}^{1}$*. Si elle était de classe $\mathcal{C}^{2}$, elle serait au voisinage de $0$ le graphe d'une fonction $\mathcal{C}^{2}$ au-dessus de sa tangente, l'axe des $x$ ; cette fonction serait $\varphi$. *Le plus grand $p$ est $1$.*

    **(i)** *Non* : ce n'est pas un graphe au-dessus de l'axe des $y$ (deux antécédents $\pm y$), ni d'une fonction dérivable au-dessus de l'axe des $x$ ($|x|$).

    **(j)** L'application $t \mapsto (\cos t, \sqrt{2}\sin(\dfrac{t}{3} + \dfrac{\pi}{4}))$ est une immersion injective, mais quand $t \to 4\pi + \dfrac{3\pi}{4}$, le point tend vers $\left(-\dfrac{\sqrt{2}}{2}, -\dfrac{\sqrt{2}}{2}\right)$, valeur en $t = 2\pi + \dfrac{3\pi}{4}$, point intérieur de la courbe. Comme à l'exercice 2, *ce n'est pas une sous-variété* : la courbe a la forme d'un « 6 ».

    ![Figure](documents/figures/119bd51da981c7a6.svg)

    La courbe (j) : elle part du point $(1, 1)$, exclu (cercle blanc), et son extrémité finale vient buter en $\left(-\dfrac{\sqrt{2}}{2}, -\dfrac{\sqrt{2}}{2}\right)$ (en rouge), qu'elle a déjà traversé : au voisinage de ce point, l'ensemble est fait d'un arc et d'une demi-branche, ce qui n'est pas une sous-variété.
