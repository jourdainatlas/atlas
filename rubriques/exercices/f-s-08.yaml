- id: "s-08-01"
  feuille: "f-s-08"
  numero: 1
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [vecteur directeur, lecture graphique]
  noeuds: [v-libre, v-espace]
  notions: [famille-libre]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Sur le graphique ci-dessous sont tracées trois droites $d_{1}$, $d_{2}$ et $d_{3}$.

    ![Figure](documents/figures/fe73d42dc97aeb30.svg)

    **1.** Lire les coordonnées des deux points marqués sur $d_{1}$, puis en déduire un vecteur directeur de cette droite.

    **2.** Faire de même pour $d_{2}$.

    **3.** Donner un vecteur directeur de $d_{3}$. Que remarque-t-on ?

    **4.** Parmi les vecteurs suivants, lesquels sont des vecteurs directeurs de $d_{1}$ ? 
    $$\vec{u}\begin{pmatrix}2\\1\end{pmatrix} \qquad ; \qquad \vec{v}\begin{pmatrix}-4\\-2\end{pmatrix} \qquad ; \qquad \vec{w}\begin{pmatrix}1\\2\end{pmatrix} \qquad ; \qquad \vec{t}\begin{pmatrix}6\\3\end{pmatrix}$$

    **5.** Combien une droite admet-elle de vecteurs directeurs ? Justifier.
  corrige: |
    **1.** Les deux points marqués sur $d_{1}$ ont pour coordonnées $A(-3\,;-2)$ et $B(1\,;0)$. Le vecteur $\overrightarrow{AB}$ a pour coordonnées la différence des coordonnées : 
    $$\overrightarrow{AB}\begin{pmatrix} 1-(-3) \\ 0-(-2) \end{pmatrix} =\begin{pmatrix} 4 \\ 2 \end{pmatrix}$$

    $$\boxed{\overrightarrow{AB}\begin{pmatrix} 4 \\ 2 \end{pmatrix} \text{ est un vecteur directeur de } d_{1}}$$

    **2.** Sur $d_{2}$, les points marqués sont $C(0\,;3)$ et $D(2\,;-1)$ : 
    $$\boxed{\overrightarrow{CD}\begin{pmatrix} 2 \\ -4 \end{pmatrix} \text{ est un vecteur directeur de } d_{2}}$$

    **3.** La droite $d_{3}$ est verticale : tous ses points ont la même abscisse $3$. Deux de ses points sont par exemple $(3\,;0)$ et $(3\,;1)$ : 
    $$\boxed{\begin{pmatrix} 0 \\ 1 \end{pmatrix} \text{ est un vecteur directeur de } d_{3}}$$

    $$\boxed{\text{La première coordonnée est nulle : c'est la marque d'une droite verticale}}$$

    **4.** Un vecteur est directeur de $d_{1}$ s'il est colinéaire à $\overrightarrow{AB}\begin{pmatrix}4\\2\end{pmatrix}$, ce que l'on teste avec le déterminant.

    • $\vec{u}\begin{pmatrix}2\\1\end{pmatrix}$ : $4\times 1-2\times 2=0$ $\Longrightarrow$ **oui**

    • $\vec{v}\begin{pmatrix}-4\\-2\end{pmatrix}$ : $4\times(-2)-(-4)\times 2=0$ $\Longrightarrow$ **oui**

    • $\vec{w}\begin{pmatrix}1\\2\end{pmatrix}$ : $4\times 2-1\times 2=6\neq 0$ $\Longrightarrow$ **non**

    • $\vec{t}\begin{pmatrix}6\\3\end{pmatrix}$ : $4\times 3-6\times 2=0$ $\Longrightarrow$ **oui**

    $$\boxed{\vec{u}, \; \vec{v} \text{ et } \vec{t} \text{ sont des vecteurs directeurs de } d_{1}}$$

    **5.** Tout vecteur non nul colinéaire à $\overrightarrow{AB}$ convient, c'est-à-dire tout vecteur de la forme $k\,\overrightarrow{AB}$ avec $k\neq 0$. 
    $$\boxed{\text{Une droite admet une infinité de vecteurs directeurs}}$$
- id: "s-08-02"
  feuille: "f-s-08"
  numero: 2
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation cartésienne]
  noeuds: [v-espace]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On considère la droite $d$ d'équation cartésienne $3x-2y+5=0$.

    **1.** Les points suivants appartiennent-ils à $d$ ? Justifier chaque réponse par un calcul. 
    $$A(1\,;4) \quad ; \quad B(-1\,;1) \quad ; \quad C(2\,;5) \quad ; \quad D(3\,;7)$$

    **2.** Déterminer l'ordonnée $y$ du point $E(5\,;y)$ appartenant à $d$.

    **3.** Déterminer l'abscisse $x$ du point $F(x\,;-2)$ appartenant à $d$.

    **4.** Déterminer les coordonnées du point d'intersection de $d$ avec l'axe des ordonnées.
  corrige: |
    **1.** Un point appartient à $d$ si ses coordonnées vérifient l'équation. 
    $$\begin{aligned} A(1\,;4) &: \quad 3\times 1-2\times 4+5=3-8+5=0 &&\Longrightarrow \; \boxed{A\in d} \\ B(-1\,;1) &: \quad 3\times(-1)-2\times 1+5=-3-2+5=0 &&\Longrightarrow \; \boxed{B\in d} \\ C(2\,;5) &: \quad 3\times 2-2\times 5+5=6-10+5=1\neq 0 &&\Longrightarrow \; \boxed{C\notin d} \\ D(3\,;7) &: \quad 3\times 3-2\times 7+5=9-14+5=0 &&\Longrightarrow \; \boxed{D\in d} \end{aligned}$$

    **2.** On remplace $x$ par $5$ et l'on résout en $y$ : 
    $$3\times 5-2y+5=0 \iff 20-2y=0 \iff \boxed{y=10}$$

    **3.** On remplace $y$ par $-2$ : 
    $$3x-2\times(-2)+5=0 \iff 3x+9=0 \iff \boxed{x=-3}$$

    **4.** Un point de l'axe des ordonnées a une abscisse nulle. On pose donc $x=0$ : 
    $$-2y+5=0 \iff \boxed{y=\frac{5}{2}}$$

    $$\boxed{\text{Le point cherché a pour coordonnées } \left(0\,;\frac{5}{2}\right)}$$
- id: "s-08-03"
  feuille: "f-s-08"
  numero: 3
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteur directeur]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Pour chacune des droites suivantes, donner un vecteur directeur.

    **a)** $d_{1} : 2x+5y-3=0$

    **b)** $d_{2} : x-4y=0$

    **c)** $d_{3} : 3x+7=0$

    **d)** $d_{4} : -2y+6=0$

    **e)** $d_{5} : -x+y+2=0$

    **f)** $d_{6} : 4x-6y+1=0$

    Pour f), on donnera un vecteur directeur à coordonnées entières les plus petites possibles.
  corrige: |
    D'après la proposition 1 du cours, la droite d'équation $ax+by+c=0$ admet $\begin{pmatrix}-b\\a\end{pmatrix}$ pour vecteur directeur.

    **a)** $a=2$, $b=5$ : $\boxed{\begin{pmatrix}-5\\2\end{pmatrix}}$

    **b)** $a=1$, $b=-4$ : $\boxed{\begin{pmatrix}4\\1\end{pmatrix}}$

    **c)** $a=3$, $b=0$ : $\boxed{\begin{pmatrix}0\\3\end{pmatrix}}$

    **d)** $a=0$, $b=-2$ : $\boxed{\begin{pmatrix}2\\0\end{pmatrix}}$

    **e)** $a=-1$, $b=1$ : $\boxed{\begin{pmatrix}-1\\-1\end{pmatrix}}$

    **f)** $a=4$, $b=-6$ : $\begin{pmatrix}6\\4\end{pmatrix}$, que l'on simplifie en $\boxed{\begin{pmatrix}3\\2\end{pmatrix}}$

    En c), le vecteur directeur est vertical : la droite $d_{3}$ est parallèle à l'axe des ordonnées. En d), il est horizontal : $d_{4}$ est parallèle à l'axe des abscisses.
- id: "s-08-04"
  feuille: "f-s-08"
  numero: 4
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [vecteur directeur, équation cartésienne]
  noeuds: [v-libre, v-espace]
  notions: [famille-libre]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Dans chaque cas, déterminer une équation cartésienne de la droite $d$ passant par le point $A$ et de vecteur directeur $\vec{u}$.

    **1.** $A(1\,;2)$ et $\vec{u}\begin{pmatrix}3\\-1\end{pmatrix}$

    **2.** $A(-2\,;5)$ et $\vec{u}\begin{pmatrix}4\\3\end{pmatrix}$

    **3.** $A(0\,;-3)$ et $\vec{u}\begin{pmatrix}1\\2\end{pmatrix}$

    **4.** $A(4\,;1)$ et $\vec{u}\begin{pmatrix}0\\5\end{pmatrix}$

    **5.** $A(-1\,;-1)$ et $\vec{u}\begin{pmatrix}2\\0\end{pmatrix}$

    Pour d) et e), préciser la position particulière de la droite obtenue.
  corrige: |
    Méthode : si $\vec{u}\begin{pmatrix}\alpha\\\beta\end{pmatrix}$ est un vecteur directeur, alors en identifiant avec $\begin{pmatrix}-b\\a\end{pmatrix}$ on obtient $a=\beta$ et $b=-\alpha$. L'équation est donc de la forme $\beta x-\alpha y+c=0$, et l'on détermine $c$ en injectant les coordonnées du point.

    **1.** $\vec{u}\begin{pmatrix}3\\-1\end{pmatrix}$ donne $a=-1$ et $b=-3$, soit $-x-3y+c=0$. Avec $A(1\,;2)$ : 
    $$-1-6+c=0 \iff c=7$$

    $$\boxed{-x-3y+7=0, \text{ ou encore } x+3y-7=0}$$

    **2.** $\vec{u}\begin{pmatrix}4\\3\end{pmatrix}$ donne $3x-4y+c=0$. Avec $A(-2\,;5)$ : 
    $$-6-20+c=0 \iff c=26 \qquad \text{d'où} \qquad \boxed{3x-4y+26=0}$$

    **3.** $\vec{u}\begin{pmatrix}1\\2\end{pmatrix}$ donne $2x-y+c=0$. Avec $A(0\,;-3)$ : 
    $$0+3+c=0 \iff c=-3 \qquad \text{d'où} \qquad \boxed{2x-y-3=0}$$

    **4.** $\vec{u}\begin{pmatrix}0\\5\end{pmatrix}$ donne $5x+c=0$. Avec $A(4\,;1)$ : 
    $$20+c=0 \iff c=-20 \qquad \text{d'où} \qquad \boxed{5x-20=0, \text{ soit } x=4}$$

    $$\boxed{\text{La droite est verticale, parallèle à l'axe des ordonnées}}$$

    **5.** $\vec{u}\begin{pmatrix}2\\0\end{pmatrix}$ donne $-2y+c=0$. Avec $A(-1\,;-1)$ : 
    $$2+c=0 \iff c=-2 \qquad \text{d'où} \qquad \boxed{-2y-2=0, \text{ soit } y=-1}$$

    $$\boxed{\text{La droite est horizontale, parallèle à l'axe des abscisses}}$$
- id: "s-08-05"
  feuille: "f-s-08"
  numero: 5
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation cartésienne]
  noeuds: [v-espace]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer une équation cartésienne de la droite $(AB)$ dans chacun des cas suivants.

    **a)** $A(1\,;2)$ et $B(3\,;6)$

    **b)** $A(-2\,;1)$ et $B(4\,;-3)$

    **c)** $A(0\,;5)$ et $B(3\,;5)$

    **d)** $A(2\,;-1)$ et $B(2\,;4)$

    **e)** $A(-3\,;2)$ et $B(1\,;-2)$

    On vérifiera à chaque fois que les coordonnées de $A$ *et* celles de $B$ sont bien solutions de l'équation trouvée.
  corrige: |
    Méthode : on calcule d'abord $\overrightarrow{AB}$, qui est un vecteur directeur, puis on applique la méthode de l'exercice 4.

    **a)** $\overrightarrow{AB}\begin{pmatrix}2\\4\end{pmatrix}$, d'où l'équation $4x-2y+c=0$. Avec $A(1\,;2)$ : $4-4+c=0$, donc $c=0$. 
    $$\boxed{4x-2y=0, \text{ ou après simplification } 2x-y=0}$$
     Vérification : pour $B(3\,;6)$, $2\times 3-6=0$.

    **b)** $\overrightarrow{AB}\begin{pmatrix}6\\-4\end{pmatrix}$, d'où $-4x-6y+c=0$. Avec $A(-2\,;1)$ : $8-6+c=0$, donc $c=-2$. 
    $$-4x-6y-2=0 \qquad \text{soit, en divisant par } -2 : \qquad \boxed{2x+3y+1=0}$$
     Vérification : $A$ donne $-4+3+1=0$ et $B$ donne $8-9+1=0$.

    **c)** $\overrightarrow{AB}\begin{pmatrix}3\\0\end{pmatrix}$ : le vecteur est horizontal, la droite l'est aussi. Les deux points ont pour ordonnée $5$ : 
    $$\boxed{y-5=0, \text{ c'est-à-dire } y=5}$$

    **d)** $\overrightarrow{AB}\begin{pmatrix}0\\5\end{pmatrix}$ : la droite est verticale, les deux points ont pour abscisse $2$ : 
    $$\boxed{x-2=0, \text{ c'est-à-dire } x=2}$$

    **e)** $\overrightarrow{AB}\begin{pmatrix}4\\-4\end{pmatrix}$, d'où $-4x-4y+c=0$. Avec $A(-3\,;2)$ : $12-8+c=0$, donc $c=-4$. 
    $$-4x-4y-4=0 \qquad \text{soit, en divisant par } -4 : \qquad \boxed{x+y+1=0}$$
     Vérification : $A$ donne $-3+2+1=0$ et $B$ donne $1-2+1=0$.
- id: "s-08-06"
  feuille: "f-s-08"
  numero: 6
  partie: "Vecteur directeur et équation cartésienne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [vecteur directeur, colinéarité]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Déterminer le réel $m$ pour que le point $A(2\,;m)$ appartienne à la droite d'équation $3x-4y+2=0$.

    **2.** Déterminer le réel $k$ pour que la droite d'équation $kx+3y-6=0$ passe par le point $B(3\,;1)$.

    **3.** Déterminer le réel $m$ pour que les vecteurs $\vec{u}\begin{pmatrix}m\\4\end{pmatrix}$ et $\vec{v}\begin{pmatrix}3\\-2\end{pmatrix}$ soient colinéaires.

    **4.** Déterminer le réel $m$ pour que la droite d'équation $2x+my-5=0$ admette $\vec{u}\begin{pmatrix}3\\1\end{pmatrix}$ pour vecteur directeur.
  corrige: |
    **1.** On injecte les coordonnées de $A(2\,;m)$ dans l'équation : 
    $$3\times 2-4m+2=0 \iff 8-4m=0 \iff \boxed{m=2}$$

    **2.** On injecte $B(3\,;1)$ : 
    $$3k+3-6=0 \iff 3k=3 \iff \boxed{k=1}$$

    **3.** Deux vecteurs sont colinéaires si leur déterminant est nul : 
    $$m\times(-2)-3\times 4=0 \iff -2m-12=0 \iff \boxed{m=-6}$$

    **4.** La droite $2x+my-5=0$ admet $\begin{pmatrix}-m\\2\end{pmatrix}$ pour vecteur directeur. Il doit être colinéaire à $\vec{u}\begin{pmatrix}3\\1\end{pmatrix}$ : 
    $$(-m)\times 1-3\times 2=0 \iff -m-6=0 \iff \boxed{m=-6}$$
     Vérification : la droite $2x-6y-5=0$ admet $\begin{pmatrix}6\\2\end{pmatrix}$ pour vecteur directeur, qui est bien colinéaire à $\begin{pmatrix}3\\1\end{pmatrix}$ puisque $\begin{pmatrix}6\\2\end{pmatrix}=2\begin{pmatrix}3\\1\end{pmatrix}$.
- id: "s-08-07"
  feuille: "f-s-08"
  numero: 7
  partie: "Équation réduite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation réduite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Déterminer, lorsqu'elle existe, l'équation réduite de chacune des droites suivantes.

    **a)** $3x+2y-6=0$

    **b)** $x-y+4=0$

    **c)** $5x+y-2=0$

    **d)** $-2x+4y+6=0$

    **e)** $3x-6=0$

    **f)** $-y+7=0$
  corrige: |
    Méthode : on isole $y$, ce qui n'est possible que si son coefficient est non nul.

    **a)** 
    $$3x+2y-6=0 \iff 2y=-3x+6 \iff \boxed{y=-\frac{3}{2}x+3}$$

    **b)** 
    $$x-y+4=0 \iff -y=-x-4 \iff \boxed{y=x+4}$$

    **c)** 
    $$5x+y-2=0 \iff \boxed{y=-5x+2}$$

    **d)** 
    $$-2x+4y+6=0 \iff 4y=2x-6 \iff \boxed{y=\frac{1}{2}x-\frac{3}{2}}$$

    **e)** Le coefficient de $y$ est nul : on ne peut pas isoler $y$. L'équation se réduit à $3x=6$ : 
    $$\boxed{x=2 : \text{ cette droite verticale n'admet pas d'équation réduite}}$$

    **f)** 
    $$-y+7=0 \iff \boxed{y=7}$$
     C'est bien de la forme $y=mx+p$ avec $m=0$ et $p=7$.
- id: "s-08-08"
  feuille: "f-s-08"
  numero: 8
  partie: "Équation réduite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation cartésienne]
  noeuds: [v-espace]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Déterminer une équation cartésienne de chacune des droites suivantes.

    **a)** $y=2x-5$

    **b)** $y=-3x+1$

    **c)** $y=\dfrac{x}{3}+2$

    **d)** $y=-4$

    **e)** $y=-\dfrac{2}{5}x-\dfrac{1}{2}$

    Pour e), on multipliera d'abord les deux membres par $10$ afin d'obtenir des coefficients entiers.
  corrige: |
    Méthode : on ramène tous les termes dans le même membre.

    **a)** $y=2x-5 \iff \boxed{2x-y-5=0}$

    **b)** $y=-3x+1 \iff \boxed{3x+y-1=0}$

    **c)** $y=\dfrac{x}{3}+2 \iff \dfrac{x}{3}-y+2=0$, et en multipliant par $3$ : $\boxed{x-3y+6=0}$

    **d)** $y=-4 \iff \boxed{y+4=0}$

    **e)** On multiplie d'abord par $10$ pour éliminer les dénominateurs : 
    $$y=-\frac{2}{5}x-\frac{1}{2} \iff 10y=-4x-5 \iff \boxed{4x+10y+5=0}$$

    On rappelle qu'une équation cartésienne n'est pas unique : multiplier les trois coefficients par un même réel non nul donne une autre équation de la même droite.
- id: "s-08-09"
  feuille: "f-s-08"
  numero: 9
  partie: "Équation réduite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation réduite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour chacune des droites suivantes, donner le coefficient directeur $m$, l'ordonnée à l'origine $p$, préciser si la droite monte ou descend de gauche à droite, et donner les coordonnées de son point d'intersection avec l'axe des ordonnées.

    **a)** $y=3x-1$

    **b)** $y=-x+2$

    **c)** $y=\dfrac{x}{2}$

    **d)** $y=-5$

    **e)** $y=-\dfrac{2}{3}x+4$

    **f)** $y=7x$
  corrige: |
    ```tableau
    **Équation** ¦ $m$ ¦ $p$ ¦ **Sens** ¦ **Point sur l'axe des ordonnées**
    $y=3x-1$ ¦ $3$ ¦ $-1$ ¦ monte ¦ $(0\,;-1)$
    $y=-x+2$ ¦ $-1$ ¦ $2$ ¦ descend ¦ $(0\,;2)$
    $y=\dfrac{x}{2}$ ¦ $\dfrac{1}{2}$ ¦ $0$ ¦ monte ¦ $(0\,;0)$
    $y=-5$ ¦ $0$ ¦ $-5$ ¦ horizontale ¦ $(0\,;-5)$
    $y=-\dfrac{2}{3}x+4$ ¦ $-\dfrac{2}{3}$ ¦ $4$ ¦ descend ¦ $(0\,;4)$
    $y=7x$ ¦ $7$ ¦ $0$ ¦ monte ¦ $(0\,;0)$
    ```

    La droite monte lorsque $m>0$, descend lorsque $m<0$, et est horizontale lorsque $m=0$. Les droites c) et f) passent par l'origine, ce qui se lit directement sur $p=0$.
- id: "s-08-10"
  feuille: "f-s-08"
  numero: 10
  partie: "Équation réduite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation réduite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Déterminer, lorsqu'elle existe, l'équation réduite de la droite $(AB)$.

    **a)** $A(1\,;3)$ et $B(4\,;9)$

    **b)** $A(-2\,;5)$ et $B(2\,;-3)$

    **c)** $A(0\,;-1)$ et $B(3\,;1)$

    **d)** $A(-1\,;2)$ et $B(5\,;2)$

    **e)** $A(3\,;1)$ et $B(3\,;-4)$

    On rappelle que le coefficient directeur se calcule par $m=\dfrac{y_{B}-y_{A}}{x_{B}-x_{A}}$, ce qui suppose $x_{A}\neq x_{B}$.
  corrige: |
    Méthode : on calcule $m=\dfrac{y_{B}-y_{A}}{x_{B}-x_{A}}$, puis on détermine $p$ en injectant les coordonnées de l'un des deux points.

    **a)** 
    $$m=\frac{9-3}{4-1}=\frac{6}{3}=2$$
     Avec $A(1\,;3)$ : $3=2\times 1+p$, donc $p=1$. 
    $$\boxed{y=2x+1}$$
     Vérification avec $B$ : $2\times 4+1=9$.

    **b)** 
    $$m=\frac{-3-5}{2-(-2)}=\frac{-8}{4}=-2$$
     Avec $A(-2\,;5)$ : $5=-2\times(-2)+p=4+p$, donc $p=1$. 
    $$\boxed{y=-2x+1}$$

    **c)** 
    $$m=\frac{1-(-1)}{3-0}=\frac{2}{3}$$
     Le point $A(0\,;-1)$ étant sur l'axe des ordonnées, on lit directement $p=-1$. 
    $$\boxed{y=\frac{2}{3}x-1}$$

    **d)** 
    $$m=\frac{2-2}{5-(-1)}=0$$
     Le coefficient directeur est nul : la droite est horizontale. 
    $$\boxed{y=2}$$

    **e)** Ici $x_{A}=x_{B}=3$ : le dénominateur serait nul, le calcul est impossible. 
    $$\boxed{\text{La droite est verticale d'équation } x=3 \text{ : elle n'a pas d'équation réduite}}$$
- id: "s-08-11"
  feuille: "f-s-08"
  numero: 11
  partie: "Équation réduite"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [équation réduite]
  noeuds: [v-espace]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer une équation de chacune des droites suivantes.

    **1.** L'axe des abscisses, puis l'axe des ordonnées.

    **2.** La droite parallèle à l'axe des abscisses passant par $A(2\,;-3)$.

    **3.** La droite parallèle à l'axe des ordonnées passant par ce même point $A$.

    **4.** La droite passant par l'origine et par le point $B(1\,;1)$.

    Laquelle de ces droites n'admet pas d'équation réduite ? Justifier.
  corrige: |
    **1.** Tous les points de l'axe des abscisses ont une ordonnée nulle, et tous ceux de l'axe des ordonnées ont une abscisse nulle : 
    $$\boxed{\text{axe des abscisses : } y=0} \qquad ; \qquad \boxed{\text{axe des ordonnées : } x=0}$$

    **2.** Une parallèle à l'axe des abscisses est horizontale : tous ses points ont la même ordonnée, celle de $A$. 
    $$\boxed{y=-3}$$

    **3.** Une parallèle à l'axe des ordonnées est verticale : tous ses points ont la même abscisse. 
    $$\boxed{x=2}$$

    **4.** La droite passe par l'origine, donc $p=0$. Son coefficient directeur vaut $m=\dfrac{1-0}{1-0}=1$ : 
    $$\boxed{y=x}$$
     C'est la première bissectrice du repère.

    Seules les droites verticales n'admettent pas d'équation réduite, car on ne peut pas y exprimer $y$ en fonction de $x$ : à une même abscisse correspondrait une infinité d'ordonnées. Ici, il s'agit de l'axe des ordonnées et de la droite $x=2$.
- id: "s-08-12"
  feuille: "f-s-08"
  numero: 12
  partie: "Équation réduite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation réduite, positions relatives]
  noeuds: [v-espace, v-determinant]
  notions: [determinant]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Une droite passe par $A(2\,;5)$ et a pour coefficient directeur $3$. Déterminer son équation réduite.

    **2.** Une droite a pour ordonnée à l'origine $-2$ et passe par $B(4\,;6)$. Déterminer son équation réduite.

    **3.** Déterminer le réel $m$ pour que la droite d'équation $y=mx+2$ passe par $C(-3\,;8)$.

    **4.** Les droites d'équations $y=3x-1$ et $y=3x+5$ sont-elles sécantes ? Justifier sans calcul.
  corrige: |
    **1.** L'équation est de la forme $y=3x+p$. Avec $A(2\,;5)$ : 
    $$5=3\times 2+p \iff p=-1 \qquad \text{d'où} \qquad \boxed{y=3x-1}$$

    **2.** L'ordonnée à l'origine vaut $-2$, donc la droite passe par $(0\,;-2)$. Son coefficient directeur est : 
    $$m=\frac{6-(-2)}{4-0}=\frac{8}{4}=2 \qquad \text{d'où} \qquad \boxed{y=2x-2}$$

    **3.** On injecte $C(-3\,;8)$ dans $y=mx+2$ : 
    $$8=-3m+2 \iff -3m=6 \iff \boxed{m=-2}$$

    **4.** Les deux droites ont le même coefficient directeur $3$, mais des ordonnées à l'origine différentes ($-1$ et $5$). 
    $$\boxed{\text{Elles sont strictement parallèles, donc non sécantes}}$$
     Aucun calcul n'est nécessaire : deux droites de même coefficient directeur ont des vecteurs directeurs $\begin{pmatrix}1\\3\end{pmatrix}$ identiques, donc la même direction.
- id: "s-08-13"
  feuille: "f-s-08"
  numero: 13
  partie: "Lectures et tracés graphiques"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [équation réduite, lecture graphique]
  noeuds: [v-espace]
  notions: []
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Déterminer par lecture graphique l'équation réduite de chacune des quatre droites tracées ci-dessous. On expliquera la démarche pour la première : lecture de l'ordonnée à l'origine, puis du coefficient directeur.

    ![Figure](documents/figures/23592075a8688ec8.svg)
  corrige: |
    Méthode, détaillée sur $d_{1}$. On lit d'abord l'ordonnée du point où la droite coupe l'axe des ordonnées : ici $-1$, donc $p=-1$. On se place ensuite sur ce point et l'on avance de $1$ vers la droite : la droite monte alors de $2$ carreaux, donc $m=2$.

    ```tableau
    **Droite** ¦ $p$ ¦ $m$ ¦ **Équation réduite**
    $d_{1}$ ¦ $-1$ ¦ $2$ ¦ $y=2x-1$
    $d_{2}$ ¦ $3$ ¦ $-1$ ¦ $y=-x+3$
    $d_{3}$ ¦ $2$ ¦ $\dfrac{1}{2}$ ¦ $y=\dfrac{1}{2}x+2$
    $d_{4}$ ¦ $-3$ ¦ $0$ ¦ $y=-3$
    ```

    Pour $d_{3}$, le coefficient directeur n'est pas entier : en avançant de $1$ on ne monte que d'un demi-carreau, ce qui est délicat à lire. On préfère avancer de $2$ et constater que l'on monte de $1$, d'où $m=\dfrac{1}{2}$.

    Pour $d_{4}$, la droite est horizontale : on ne monte pas du tout, donc $m=0$.
- id: "s-08-14"
  feuille: "f-s-08"
  numero: 14
  partie: "Lectures et tracés graphiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation réduite, lecture graphique, modélisation]
  noeuds: [v-espace]
  notions: []
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Tracer, dans un même repère que l'on construira en prenant $1$ cm pour une unité sur chaque axe, les droites d'équations : 
    $$d_{1} : y=3x-2 \qquad ; \qquad d_{2} : y=-\dfrac{x}{2}+1 \qquad ; \qquad d_{3} : y=4 \qquad ; \qquad d_{4} : y=-2x$$

    Pour chaque droite, on précisera les deux points utilisés pour la construire. On pourra soit placer le point d'ordonnée à l'origine puis utiliser le coefficient directeur, soit choisir deux valeurs de $x$ et calculer les ordonnées correspondantes.

    Tracer enfin la droite $d_{5}$ d'équation $x=-3$. Pourquoi la méthode précédente ne s'applique-t-elle pas ?
  corrige: |
    Pour chaque droite, deux points suffisent. On peut soit placer le point $(0\,;p)$ puis appliquer le coefficient directeur, soit calculer deux ordonnées.

    ```tableau
    **Droite** ¦ **Premier point** ¦ **Second point**
    $d_{1} : y=3x-2$ ¦ $(0\,;-2)$ ¦ $(1\,;1)$
    $d_{2} : y=-\frac{x}{2}+1$ ¦ $(0\,;1)$ ¦ $(2\,;0)$
    $d_{3} : y=4$ ¦ $(0\,;4)$ ¦ $(1\,;4)$
    $d_{4} : y=-2x$ ¦ $(0\,;0)$ ¦ $(1\,;-2)$
    ```

    ![Figure](documents/figures/54e6eaa5f2cca636.svg)

    Pour $d_{5}$ d'équation $x=-3$, la méthode précédente ne s'applique pas : cette équation n'est pas de la forme $y=mx+p$, on ne peut donc lire ni coefficient directeur ni ordonnée à l'origine. 
    $$\boxed{\text{On trace directement la verticale passant par le point d'abscisse } -3}$$
- id: "s-08-15"
  feuille: "f-s-08"
  numero: 15
  partie: "Lectures et tracés graphiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lecture graphique]
  noeuds: [v-espace]
  notions: []
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Tracer, dans un même repère, les droites d'équations cartésiennes suivantes.

    **a)** $2x+y-4=0$

    **b)** $x-3y+3=0$

    **c)** $3x+2y=0$

    **d)** $2x-5=0$

    **e)** $-y+1=0$

    *Conseil :* pour a) et b), le plus rapide est de chercher les points d'intersection avec les deux axes, c'est-à-dire de calculer $y$ pour $x=0$, puis $x$ pour $y=0$. Cette méthode échoue pour c) : pourquoi ? Comment faire alors ?
  corrige: |
    ```tableau
    **Droite** ¦ **Point d'abscisse nulle** ¦ **Point d'ordonnée nulle**
    a) $2x+y-4=0$ ¦ $(0\,;4)$ ¦ $(2\,;0)$
    b) $x-3y+3=0$ ¦ $(0\,;1)$ ¦ $(-3\,;0)$
    c) $3x+2y=0$ ¦ $(0\,;0)$ ¦ $(0\,;0)$
    d) $2x-5=0$ ¦ aucun ¦ $\left(\frac{5}{2}\,;0\right)$
    e) $-y+1=0$ ¦ $(0\,;1)$ ¦ aucun
    ```

    ![Figure](documents/figures/2a1abdfd1e73af04.svg)

    Pour c), la méthode échoue : la droite passe par l'origine, donc les deux points cherchés se confondent en $(0\,;0)$ et l'on n'obtient qu'un seul point. 
    $$\boxed{\text{Il faut alors choisir une autre valeur de } x, \text{ par exemple } x=2 \text{ qui donne } y=-3}$$
- id: "s-08-16"
  feuille: "f-s-08"
  numero: 16
  partie: "Lectures et tracés graphiques"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [équation cartésienne, équation réduite, lecture graphique]
  noeuds: [v-espace]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Déterminer par lecture graphique une équation cartésienne de chacune des quatre droites ci-dessous.

    ![Figure](documents/figures/26444b631266919d.svg)

    Les points marqués sont à coordonnées entières. Pour $d_{1}$ et $d_{2}$, on prendra garde : l'une de ces deux droites n'admet pas d'équation réduite.
  corrige: |
    **$d_{1}$ :** La droite est verticale et tous ses points ont pour abscisse $-2$. 
    $$\boxed{x+2=0}$$
     *C'est celle des deux premières qui n'admet pas d'équation réduite.*

    **$d_{2}$ :** La droite est horizontale et tous ses points ont pour ordonnée $1$. 
    $$\boxed{y-1=0}$$
     Son équation réduite existe, c'est $y=1$, avec $m=0$.

    **$d_{3}$ :** Elle passe par $(0\,;0)$ et $(3\,;2)$, donc un vecteur directeur est $\begin{pmatrix}3\\2\end{pmatrix}$. L'équation est de la forme $2x-3y+c=0$, et l'origine donne $c=0$. 
    $$\boxed{2x-3y=0}$$
     Vérification avec $(3\,;2)$ : $6-6=0$.

    **$d_{4}$ :** Elle passe par $(-3\,;0)$ et $(0\,;-2)$, donc un vecteur directeur est $\begin{pmatrix}3\\-2\end{pmatrix}$. L'équation est de la forme $-2x-3y+c=0$. Avec $(0\,;-2)$ : $6+c=0$, donc $c=-6$. 
    $$-2x-3y-6=0 \qquad \text{soit} \qquad \boxed{2x+3y+6=0}$$
     Vérification avec $(-3\,;0)$ : $-6+0+6=0$.
- id: "s-08-17"
  feuille: "f-s-08"
  numero: 17
  partie: "Lectures et tracés graphiques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lecture graphique]
  noeuds: [v-espace]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Sur le graphique ci-dessous sont tracées quatre droites. Six équations sont proposées : associer à chaque droite l'équation qui lui correspond, et identifier les deux équations qui ne correspondent à aucune droite tracée.

    ![Figure](documents/figures/8ae8938b0c2b9d7c.svg)

    **1.** $2x+y-4=0$

    **2.** $y=x+2$

    **3.** $x-3=0$

    **4.** $y+1=0$

    **5.** $y=2x+4$

    **6.** $x+y-2=0$
  corrige: |
    ```tableau
    **Droite** ¦ **Équation** ¦ **Justification**
    $a$ ¦ **2.** $y=x+2$ ¦ Elle coupe l'axe des ordonnées en $2$ et monte de $1$ quand on avance de $1$.
    $b$ ¦ **1.** $2x+y-4=0$ ¦ Son équation réduite est $y=-2x+4$ : ordonnée à l'origine $4$, et la droite descend de $2$ quand on avance de $1$.
    $c$ ¦ **4.** $y+1=0$ ¦ C'est la droite horizontale d'ordonnée $-1$.
    $e$ ¦ **3.** $x-3=0$ ¦ C'est la droite verticale d'abscisse $3$.
    ```

    Les deux équations restantes ne correspondent à aucune droite tracée : 
    $$\boxed{\text{5. } y=2x+4 \qquad \text{et} \qquad \text{6. } x+y-2=0}$$
     La droite $y=2x+4$ aurait pour ordonnée à l'origine $4$, comme $b$, mais elle *monte* au lieu de descendre. Quant à $x+y-2=0$, son équation réduite est $y=-x+2$ : elle descend, mais coupe l'axe des ordonnées en $2$ et non en $4$.
- id: "s-08-18"
  feuille: "f-s-08"
  numero: 18
  partie: "Lectures et tracés graphiques"
  etoiles: 2
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [lecture graphique]
  noeuds: [v-espace]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** Tracer dans un même repère les droites d'équations : 
    $$d_{1} : y=x+1 \qquad ; \qquad d_{2} : y=-2x+7 \qquad ; \qquad d_{3} : y=3x-3$$

    **2.** Que semble-t-on pouvoir dire de ces trois droites ?

    **3.** Déterminer par le calcul les coordonnées du point d'intersection de $d_{1}$ et $d_{2}$.

    **4.** Vérifier que ce point appartient également à $d_{3}$. La conjecture est-elle démontrée ?

    **5.** Tracer enfin la droite $d_{4}$ d'équation $y=x-2$. Quelle est sa position par rapport à $d_{1}$ ? Justifier par le calcul.
  corrige: |
    **1.** Voici les trois droites, ainsi que $d_{4}$ ajoutée à la question 5.

    ![Figure](documents/figures/8900e39b27fb8e78.svg)

    **2.** 
    $$\boxed{\text{Les trois droites semblent passer par un même point : elles semblent concourantes}}$$

    **3.** On résout $d_{1}$ et $d_{2}$ en égalant les deux expressions de $y$ : 
    $$x+1=-2x+7 \iff 3x=6 \iff x=2$$
     puis $y=2+1=3$. 
    $$\boxed{I(2\,;3)}$$

    **4.** On calcule l'ordonnée du point de $d_{3}$ d'abscisse $2$ : 
    $$3\times 2-3=3$$
     C'est bien l'ordonnée de $I$. 
    $$\boxed{I \text{ appartient aux trois droites : elles sont concourantes en } I}$$
     La conjecture est maintenant **démontrée** : la lecture graphique seule ne suffisait pas, car deux droites très proches peuvent sembler se couper au même endroit.

    **5.** Les droites $d_{1}$ et $d_{4}$ ont le même coefficient directeur $1$, mais des ordonnées à l'origine différentes ($1$ et $-2$). 
    $$\boxed{d_{4} \text{ est strictement parallèle à } d_{1}}$$
     Par le calcul : leurs équations cartésiennes sont $x-y+1=0$ et $x-y-2=0$, et le critère donne $1\times(-1)-1\times(-1)=0$, ce qui confirme le parallélisme.
- id: "s-08-19"
  feuille: "f-s-08"
  numero: 19
  partie: "Positions relatives et systèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [positions relatives]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Dans chaque cas, déterminer si les deux droites sont sécantes ou parallèles, en utilisant le critère $ab'-a'b$.

    **1.** $d : 2x+3y-1=0$ et $d' : 4x+6y+5=0$

    **2.** $d : x-2y+3=0$ et $d' : 3x+y-2=0$

    **3.** $d : -x+4y=0$ et $d' : 2x-8y+1=0$

    **4.** $d : 5x+y-2=0$ et $d' : x-5y+3=0$

    **5.** $d : 3x-6=0$ et $d' : 2y+1=0$
  corrige: |
    On applique la proposition 2 : les droites sont sécantes si et seulement si $ab'-a'b\neq 0$.

    $$\begin{array}{|c||c|c|c|} \hline  & (a\,;b)\text{ \; et \; }(a'\,;b') & ab'-a'b & \text{Conclusion} \\ \hline \text{1.} & (2\,;3)\text{ et }(4\,;6) & 2\times 6-4\times 3=0 & \text{parallèles} \\ \hline \text{2.} & (1\,;-2)\text{ et }(3\,;1) & 1\times 1-3\times(-2)=7 & \text{sécantes} \\ \hline \text{3.} & (-1\,;4)\text{ et }(2\,;-8) & (-1)\times(-8)-2\times 4=0 & \text{parallèles} \\ \hline \text{4.} & (5\,;1)\text{ et }(1\,;-5) & 5\times(-5)-1\times 1=-26 & \text{sécantes} \\ \hline \text{5.} & (3\,;0)\text{ et }(0\,;2) & 3\times 2-0\times 0=6 & \text{sécantes} \\ \hline \end{array}$$

    Le cas 5 mérite un commentaire : $d$ est verticale d'équation $x=2$ et $d'$ est horizontale d'équation $y=-\frac{1}{2}$. Elles sont bien sécantes, au point $\left(2\,;-\frac{1}{2}\right)$.
- id: "s-08-20"
  feuille: "f-s-08"
  numero: 20
  partie: "Positions relatives et systèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["systèmes d'équations"]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Résoudre les systèmes suivants **par substitution**.

    **1.** $\left\{\begin{array}{l} x+2y-7=0 \\ 3x-y=0 \end{array}\right.$

    **2.** $\left\{\begin{array}{l} 2x+y-5=0 \\ x-y-1=0 \end{array}\right.$

    **3.** $\left\{\begin{array}{l} 4x+3y-10=0 \\ x-y+1=0 \end{array}\right.$
  corrige: |
    Méthode par substitution : on isole une inconnue dans l'une des équations, puis on l'injecte dans l'autre.

    **1.** La seconde équation donne immédiatement $y=3x$. On l'injecte dans la première : 
    $$\begin{aligned} x+2\times 3x-7 &= 0 \\ 7x-7 &= 0 \\ x &= 1 \end{aligned}$$
     puis $y=3\times 1=3$. 
    $$\boxed{S=\{(1\,;3)\}}$$
     Vérification : $1+6-7=0$ et $3-3=0$.

    **2.** La seconde équation donne $x=y+1$. On l'injecte dans la première : 
    $$\begin{aligned} 2(y+1)+y-5 &= 0 \\ 2y+2+y-5 &= 0 \\ 3y-3 &= 0 \\ y &= 1 \end{aligned}$$
     puis $x=1+1=2$. 
    $$\boxed{S=\{(2\,;1)\}}$$
     Vérification : $4+1-5=0$ et $2-1-1=0$.

    **3.** La seconde équation donne $x=y-1$. On l'injecte dans la première : 
    $$\begin{aligned} 4(y-1)+3y-10 &= 0 \\ 4y-4+3y-10 &= 0 \\ 7y-14 &= 0 \\ y &= 2 \end{aligned}$$
     puis $x=2-1=1$. 
    $$\boxed{S=\{(1\,;2)\}}$$
     Vérification : $4+6-10=0$ et $1-2+1=0$.
- id: "s-08-21"
  feuille: "f-s-08"
  numero: 21
  partie: "Positions relatives et systèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["systèmes d'équations"]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Résoudre les systèmes suivants **par combinaison linéaire**.

    **1.** $\left\{\begin{array}{l} 3x+2y-12=0 \\ 3x-4y+6=0 \end{array}\right.$

    **2.** $\left\{\begin{array}{l} 2x+5y-1=0 \\ 2x-3y-9=0 \end{array}\right.$

    **3.** $\left\{\begin{array}{l} 3x+y-1=0 \\ 3x-2y+11=0 \end{array}\right.$

    **4.** $\left\{\begin{array}{l} 2x+3y-16=0 \\ 3x-2y-11=0 \end{array}\right.$

    Pour le dernier, aucune inconnue ne disparaît directement : il faudra multiplier chaque équation par un facteur bien choisi avant de les additionner.
  corrige: |
    Méthode par combinaison linéaire : on ajoute ou l'on retranche les deux équations, éventuellement multipliées, de façon à faire disparaître une inconnue.

    **1.** 
    $$\left\{\begin{array}{ll} 3x+2y-12=0 & \textcircled{e_{1}} \\ 3x-4y+6=0 & \textcircled{e_{2}} \end{array}\right.$$
     Les coefficients de $x$ sont identiques : on effectue $\textcircled{e_{1}}- \textcircled{e_{2}}$. 
    $$\begin{aligned} (3x+2y-12)-(3x-4y+6) &= 0-0 \\ 3x+2y-12-3x+4y-6 &= 0 \\ 6y-18 &= 0 \\ y &= 3 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $3x+6-12=0$, donc $3x=6$ et $x=2$. 
    $$\boxed{S=\{(2\,;3)\}}$$
     Vérification : $6+6-12=0$ et $6-12+6=0$.

    **2.** 
    $$\left\{\begin{array}{ll} 2x+5y-1=0 & \textcircled{e_{1}} \\ 2x-3y-9=0 & \textcircled{e_{2}} \end{array}\right.$$
     Les coefficients de $x$ sont à nouveau identiques : on effectue $\textcircled{e_{1}}- \textcircled{e_{2}}$. 
    $$\begin{aligned} (2x+5y-1)-(2x-3y-9) &= 0 \\ 8y+8 &= 0 \\ y &= -1 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $2x-5-1=0$, donc $x=3$. 
    $$\boxed{S=\{(3\,;-1)\}}$$
     Vérification : $6-5-1=0$ et $6+3-9=0$.

    **3.** 
    $$\left\{\begin{array}{ll} 3x+y-1=0 & \textcircled{e_{1}} \\ 3x-2y+11=0 & \textcircled{e_{2}} \end{array}\right.$$
     On effectue $\textcircled{e_{1}}- \textcircled{e_{2}}$ : 
    $$\begin{aligned} (3x+y-1)-(3x-2y+11) &= 0 \\ 3y-12 &= 0 \\ y &= 4 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $3x+4-1=0$, donc $3x=-3$ et $x=-1$. 
    $$\boxed{S=\{(-1\,;4)\}}$$
     Vérification : $-3+4-1=0$ et $-3-8+11=0$.

    **4.** 
    $$\left\{\begin{array}{ll} 2x+3y-16=0 & \textcircled{e_{1}} \\ 3x-2y-11=0 & \textcircled{e_{2}} \end{array}\right.$$
     Cette fois aucune inconnue ne disparaît directement. Pour éliminer $y$, on remarque que les coefficients $3$ et $-2$ deviennent opposés si l'on multiplie $\textcircled{e_{1}}$ par $2$ et $\textcircled{e_{2}}$ par $3$. On effectue donc $2\times \textcircled{e_{1}}+3\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} 2(2x+3y-16)+3(3x-2y-11) &= 0 \\ 4x+6y-32+9x-6y-33 &= 0 \\ 13x-65 &= 0 \\ x &= 5 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $10+3y-16=0$, donc $3y=6$ et $y=2$. 
    $$\boxed{S=\{(5\,;2)\}}$$
     Vérification : $10+6-16=0$ et $15-4-11=0$.
- id: "s-08-22"
  feuille: "f-s-08"
  numero: 22
  partie: "Positions relatives et systèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [positions relatives, "systèmes d'équations"]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Pour chacun des systèmes suivants, prévoir d'abord le nombre de solutions à l'aide du critère $ab'-a'b$, puis résoudre.

    **1.** $\left\{\begin{array}{l} 2x+4y-6=0 \\ x+2y-3=0 \end{array}\right.$

    **2.** $\left\{\begin{array}{l} x-y+1=0 \\ 2x-2y-5=0 \end{array}\right.$

    **3.** $\left\{\begin{array}{l} 3x+y-2=0 \\ x-2y+4=0 \end{array}\right.$

    Interpréter géométriquement chacun des trois cas obtenus.
  corrige: |
    **1.** Prévision : $(a\,;b)=(2\,;4)$ et $(a'\,;b')=(1\,;2)$, donc $ab'-a'b=2\times 2-1\times 4=0$ : les droites sont parallèles.

    En divisant la première équation par $2$, on obtient exactement la seconde : les deux droites sont **confondues**. 
    $$\boxed{\text{Une infinité de solutions : tous les couples } (x\,;y) \text{ tels que } x+2y-3=0}$$
     Autrement dit, $S=\left\{(3-2y\,;y) \; ; \; y\in\mathbb{R}\right\}$. 
    $$\boxed{\text{Géométriquement : les deux droites sont confondues}}$$

    **2.** Prévision : $1\times(-2)-2\times(-1)=0$ : les droites sont parallèles.

    La première donne $x=y-1$. On l'injecte dans la seconde : 
    $$2(y-1)-2y-5=0 \iff 2y-2-2y-5=0 \iff -7=0$$
     ce qui est impossible. 
    $$\boxed{S=\varnothing} \qquad ; \qquad \boxed{\text{Géométriquement : les droites sont strictement parallèles}}$$

    **3.** Prévision : $3\times(-2)-1\times 1=-7\neq 0$ : les droites sont sécantes, il y a donc exactement une solution.

    La seconde donne $x=2y-4$. On l'injecte dans la première : 
    $$\begin{aligned} 3(2y-4)+y-2 &= 0 \\ 6y-12+y-2 &= 0 \\ 7y-14 &= 0 \\ y &= 2 \end{aligned}$$
     puis $x=2\times 2-4=0$. 
    $$\boxed{S=\{(0\,;2)\}} \qquad ; \qquad \boxed{\text{Géométriquement : les droites se coupent au point } (0\,;2)}$$
- id: "s-08-23"
  feuille: "f-s-08"
  numero: 23
  partie: "Positions relatives et systèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["systèmes d'équations"]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Résoudre les systèmes suivants par la méthode de votre choix. Chacun admet un unique couple solution, que l'on donnera sous la forme la plus simple possible.

    **1.** $\left\{\begin{array}{l} 4x-3y-5=0 \\ 2x+y-5=0 \end{array}\right.$

    **2.** $\left\{\begin{array}{l} 2x+3y=0 \\ 5x+4y-7=0 \end{array}\right.$

    **3.** $\left\{\begin{array}{l} 3x+2y-5=0 \\ 4x-5y+24=0 \end{array}\right.$

    **4.** $\left\{\begin{array}{l} 2x+3y-4=0 \\ 5x-y-3=0 \end{array}\right.$

    **5.** $\left\{\begin{array}{l} 3x-5y+2=0 \\ 4x+7y-6=0 \end{array}\right.$

    **6.** $\left\{\begin{array}{l} 6x+4y-5=0 \\ 2x-3y+1=0 \end{array}\right.$

    On vérifiera systématiquement le couple obtenu en le remplaçant dans les *deux* équations de départ.
  corrige: |
    **1.** 
    $$\left\{\begin{array}{ll} 4x-3y-5=0 & \textcircled{e_{1}} \\ 2x+y-5=0 & \textcircled{e_{2}} \end{array}\right.$$
     La seconde équation donne $y=5-2x$, que l'on injecte dans la première : 
    $$\begin{aligned} 4x-3(5-2x)-5 &= 0 \\ 4x-15+6x-5 &= 0 \\ 10x-20 &= 0 \\ x &= 2 \end{aligned}$$
     puis $y=5-4=1$. 
    $$\boxed{S=\{(2\,;1)\}}$$
     Vérification : $8-3-5=0$ et $4+1-5=0$.

    **2.** 
    $$\left\{\begin{array}{ll} 2x+3y=0 & \textcircled{e_{1}} \\ 5x+4y-7=0 & \textcircled{e_{2}} \end{array}\right.$$
     Pour éliminer $x$, on effectue $5\times \textcircled{e_{1}}-2\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} 5(2x+3y)-2(5x+4y-7) &= 0 \\ 10x+15y-10x-8y+14 &= 0 \\ 7y+14 &= 0 \\ y &= -2 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $2x-6=0$, donc $x=3$. 
    $$\boxed{S=\{(3\,;-2)\}}$$
     Vérification : $6-6=0$ et $15-8-7=0$.

    **3.** 
    $$\left\{\begin{array}{ll} 3x+2y-5=0 & \textcircled{e_{1}} \\ 4x-5y+24=0 & \textcircled{e_{2}} \end{array}\right.$$
     Pour éliminer $x$, on effectue $4\times \textcircled{e_{1}}-3\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} 4(3x+2y-5)-3(4x-5y+24) &= 0 \\ 12x+8y-20-12x+15y-72 &= 0 \\ 23y-92 &= 0 \\ y &= 4 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $3x+8-5=0$, donc $3x=-3$ et $x=-1$. 
    $$\boxed{S=\{(-1\,;4)\}}$$
     Vérification : $-3+8-5=0$ et $-4-20+24=0$.

    **4.** 
    $$\left\{\begin{array}{ll} 2x+3y-4=0 & \textcircled{e_{1}} \\ 5x-y-3=0 & \textcircled{e_{2}} \end{array}\right.$$
     Pour éliminer $y$, on effectue $\textcircled{e_{1}}+3\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} (2x+3y-4)+3(5x-y-3) &= 0 \\ 2x+3y-4+15x-3y-9 &= 0 \\ 17x-13 &= 0 \\ x &= \frac{13}{17} \end{aligned}$$
     On reporte dans $\textcircled{e_{2}}$ : 
    $$y=5x-3=\frac{65}{17}-\frac{51}{17}=\frac{14}{17}$$

    $$\boxed{S=\left\{\left(\frac{13}{17}\,;\frac{14}{17}\right)\right\}}$$
     Vérification dans $\textcircled{e_{1}}$ : $\dfrac{26}{17}+\dfrac{42}{17}-\dfrac{68}{17}=\dfrac{0}{17}=0$.

    **5.** 
    $$\left\{\begin{array}{ll} 3x-5y+2=0 & \textcircled{e_{1}} \\ 4x+7y-6=0 & \textcircled{e_{2}} \end{array}\right.$$
     Pour éliminer $x$, on effectue $4\times \textcircled{e_{1}}-3\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} 4(3x-5y+2)-3(4x+7y-6) &= 0 \\ 12x-20y+8-12x-21y+18 &= 0 \\ -41y+26 &= 0 \\ y &= \frac{26}{41} \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : 
    $$3x=5y-2=\frac{130}{41}-\frac{82}{41}=\frac{48}{41} \qquad \text{d'où} \qquad x=\frac{16}{41}$$

    $$\boxed{S=\left\{\left(\frac{16}{41}\,;\frac{26}{41}\right)\right\}}$$
     Vérification dans $\textcircled{e_{2}}$ : $\dfrac{64}{41}+\dfrac{182}{41}-\dfrac{246}{41}=0$.

    **6.** 
    $$\left\{\begin{array}{ll} 6x+4y-5=0 & \textcircled{e_{1}} \\ 2x-3y+1=0 & \textcircled{e_{2}} \end{array}\right.$$
     Pour éliminer $x$, on effectue $\textcircled{e_{1}}-3\times \textcircled{e_{2}}$ : 
    $$\begin{aligned} (6x+4y-5)-3(2x-3y+1) &= 0 \\ 6x+4y-5-6x+9y-3 &= 0 \\ 13y-8 &= 0 \\ y &= \frac{8}{13} \end{aligned}$$
     On reporte dans $\textcircled{e_{2}}$ : 
    $$2x=3y-1=\frac{24}{13}-\frac{13}{13}=\frac{11}{13} \qquad \text{d'où} \qquad x=\frac{11}{26}$$

    $$\boxed{S=\left\{\left(\frac{11}{26}\,;\frac{8}{13}\right)\right\}}$$
     On prendra garde ici à simplifier : le calcul brut donne $y=\dfrac{16}{26}$, qu'il faut réduire en $\dfrac{8}{13}$.

    Vérification dans $\textcircled{e_{1}}$ : $6\times\dfrac{11}{26}+4\times\dfrac{8}{13}-5=\dfrac{66}{26}+\dfrac{64}{26} -\dfrac{130}{26}=0$.

    Les trois derniers systèmes n'ont pas de solution entière. On remarquera que la substitution y serait beaucoup plus lourde : elle introduirait des fractions dès la première étape, alors que la combinaison linéaire ne les fait apparaître qu'à la toute fin.
- id: "s-08-24"
  feuille: "f-s-08"
  numero: 24
  partie: "Positions relatives et systèmes"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [lecture graphique, positions relatives]
  noeuds: [v-espace, v-determinant]
  notions: [determinant]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    On considère les droites $d : 2x-y-1=0$ et $d' : x+y-5=0$.

    **1.** Démontrer que $d$ et $d'$ sont sécantes.

    **2.** Déterminer par le calcul les coordonnées de leur point d'intersection.

    **3.** Tracer les deux droites dans un même repère et vérifier graphiquement le résultat précédent.
  corrige: |
    **1.** Les coefficients sont $(a\,;b)=(2\,;-1)$ et $(a'\,;b')=(1\,;1)$ : 
    $$ab'-a'b=2\times 1-1\times(-1)=2+1=3\neq 0$$

    $$\boxed{d \text{ et } d' \text{ sont sécantes}}$$

    **2.** 
    $$\left\{\begin{array}{ll} 2x-y-1=0 & \textcircled{e_{1}} \\ x+y-5=0 & \textcircled{e_{2}} \end{array}\right.$$
     Les coefficients de $y$ sont opposés : on effectue $\textcircled{e_{1}}+ \textcircled{e_{2}}$. 
    $$\begin{aligned} (2x-y-1)+(x+y-5) &= 0 \\ 3x-6 &= 0 \\ x &= 2 \end{aligned}$$
     On reporte dans $\textcircled{e_{2}}$ : $2+y-5=0$, donc $y=3$. 
    $$\boxed{\text{Le point d'intersection a pour coordonnées } (2\,;3)}$$

    **3.** Les équations réduites sont $y=2x-1$ et $y=-x+5$.

    ![Figure](documents/figures/0a42d6656e376890.svg)

    $$\boxed{\text{La lecture graphique confirme le résultat du calcul}}$$
- id: "s-08-25"
  feuille: "f-s-08"
  numero: 25
  partie: "Positions relatives et systèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["systèmes d'équations", modélisation]
  noeuds: [v-determinant]
  notions: [determinant]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Dans un cinéma, trois places adulte et deux places enfant coûtent $44$ euros. Deux places adulte et quatre places enfant coûtent $48$ euros.

    **1.** En notant $x$ le prix d'une place adulte et $y$ celui d'une place enfant, traduire l'énoncé par un système de deux équations.

    **2.** Résoudre ce système par la méthode de votre choix.

    **3.** Vérifier que les prix trouvés conviennent bien.
  corrige: |
    **1.** En notant $x$ le prix d'une place adulte et $y$ celui d'une place enfant : 
    $$\boxed{\left\{\begin{array}{ll} 3x+2y-44=0 & \textcircled{e_{1}} \\ 2x+4y-48=0 & \textcircled{e_{2}} \end{array}\right.}$$

    **2.** On remarque d'abord que $\textcircled{e_{2}}$ se simplifie par $2$ : $x+2y-24=0$. On effectue alors $\textcircled{e_{1}}- \textcircled{e_{2}}'$, où $\textcircled{e_{2}}'$ désigne cette équation simplifiée : 
    $$\begin{aligned} (3x+2y-44)-(x+2y-24) &= 0 \\ 2x-20 &= 0 \\ x &= 10 \end{aligned}$$
     On reporte dans $\textcircled{e_{2}}'$ : $10+2y-24=0$, donc $2y=14$ et $y=7$. 
    $$\boxed{\text{Une place adulte coûte } 10 \text{ euros, une place enfant } 7 \text{ euros}}$$

    **3.** Vérification dans les deux situations de l'énoncé : 
    $$3\times 10+2\times 7=30+14=44 \qquad \text{et} \qquad 2\times 10+4\times 7=20+28=48$$
     Les deux conditions sont bien respectées.
- id: "s-08-26"
  feuille: "f-s-08"
  numero: 26
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [vecteur directeur, équation réduite, positions relatives, "systèmes d'équations"]
  noeuds: [v-libre, v-espace, v-determinant]
  notions: [famille-libre, determinant]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. Un vecteur directeur de la droite $3x-5y+2=0$ est : ¦ $\begin{pmatrix}3\\-5\end{pmatrix}$ ¦ $\begin{pmatrix}5\\3\end{pmatrix}$ ¦ $\begin{pmatrix}2\\3\end{pmatrix}$
    2. L'équation réduite de $2x+4y-8=0$ est : ¦ $y=-\frac{x}{2}+2$ ¦ $y=2x-8$ ¦ $y=-2x+8$
    3. Le point $A(2\,;-1)$ appartient à la droite d'équation : ¦ $x+2y=0$ ¦ $x-2y-5=0$ ¦ $2x+y-5=0$
    4. La droite d'équation $x=4$ est : ¦ parallèle à l'axe des abscisses ¦ parallèle à l'axe des ordonnées ¦ passant par l'origine
    5. Les droites $y=3x-1$ et $y=3x+4$ sont : ¦ sécantes ¦ parallèles ¦ confondues
    6. Les droites $2x-y+1=0$ et $4x-2y+2=0$ sont : ¦ sécantes ¦ strictement parallèles ¦ confondues
    7. Le coefficient directeur de la droite passant par $A(1\,;2)$ et $B(3\,;8)$ est : ¦ $3$ ¦ $6$ ¦ $\frac{1}{3}$
    8. La droite d'équation $y=mx+p$ coupe l'axe des ordonnées au point de coordonnées : ¦ $(m\,;0)$ ¦ $(0\,;p)$ ¦ $(p\,;0)$
    9. Le système $\left\{\begin{array}{l} x+y-3=0 \\ x-y+1=0 \end{array}\right.$ a pour solution : & $(1\,;2)$ & $(2\,;1)$ & $(-1\,;2)$
    10. La droite d'équation $5y+10=0$ a pour équation réduite : ¦ $y=-2$ ¦ $y=2$ ¦ $x=-2$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **B** ¦ Pour $ax+by+c=0$, le vecteur directeur est $\binom{-b}{a}$, ici $\binom{5}{3}$. La réponse A donne $\binom{a}{b}$, qui est le vecteur *normal*.
    2 ¦ **A** ¦ $2x+4y-8=0 \iff 4y=-2x+8 \iff y=-\frac{x}{2}+2$.
    3 ¦ **A** ¦ $2+2\times(-1)=0$. Pour B, $2+2-5=-1\neq 0$ ; pour C, $4-1-5=-2\neq 0$.
    4 ¦ **B** ¦ Tous les points ont pour abscisse $4$ : la droite est verticale.
    5 ¦ **B** ¦ Même coefficient directeur $3$, mais ordonnées à l'origine différentes.
    6 ¦ **C** ¦ La seconde équation est le double de la première : c'est la même droite.
    7 ¦ **A** ¦ $m=\dfrac{8-2}{3-1}=\dfrac{6}{2}=3$.
    8 ¦ **B** ¦ Un point de l'axe des ordonnées a une abscisse nulle ; pour $x=0$, on obtient $y=p$.
    9 ¦ **A** ¦ $1+2-3=0$ et $1-2+1=0$.
    10 ¦ **A** ¦ $5y+10=0 \iff 5y=-10 \iff y=-2$.
    ```
- id: "s-08-27"
  feuille: "f-s-08"
  numero: 27
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [vecteur directeur, équation cartésienne, équation réduite, positions relatives, "systèmes d'équations"]
  noeuds: [v-libre, v-espace, v-determinant]
  notions: [famille-libre, determinant]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Toute droite du plan admet une équation cartésienne.

    **2.** Toute droite du plan admet une équation réduite.

    **3.** Une droite admet une infinité de vecteurs directeurs.

    **4.** Une droite admet une unique équation cartésienne.

    **5.** Si deux droites ont le même coefficient directeur, alors elles sont parallèles.

    **6.** Si deux droites sont parallèles, alors elles ont le même coefficient directeur.

    **7.** Le vecteur $\begin{pmatrix}-b\\a\end{pmatrix}$ est un vecteur directeur de la droite d'équation $ax+by+c=0$.

    **8.** Un système de deux équations à deux inconnues admet toujours exactement une solution.

    **9.** Les droites d'équations $2x+3y-1=0$ et $4x+6y-2=0$ sont confondues.

    **10.** Les coordonnées du point d'intersection de deux droites sécantes sont solutions du système formé par leurs deux équations.
  corrige: |
    **1.** **Vraie**. C'est la proposition 1 du cours : toute droite du plan admet une équation de la forme $ax+by+c=0$.

    **2.** **Fausse**. Les droites verticales font exception. Contre-exemple : la droite d'équation $x=3$ ne peut pas s'écrire $y=mx+p$, car à l'abscisse $3$ correspondent une infinité d'ordonnées.

    **3.** **Vraie**. Si $\vec{u}$ est un vecteur directeur, alors $k\,\vec{u}$ l'est aussi pour tout réel $k$ non nul, ce qui fournit une infinité de vecteurs.

    **4.** **Fausse**. En multipliant $a$, $b$ et $c$ par un même réel non nul, on obtient une autre équation de la même droite. Par exemple $x+y-1=0$ et $2x+2y-2=0$ décrivent la même droite.

    **5.** **Vraie**. Si les deux droites ont pour équations $y=mx+p$ et $y=mx+p'$, elles admettent toutes deux $\begin{pmatrix}1\\m\end{pmatrix}$ pour vecteur directeur : elles ont donc la même direction.

    **6.** **Fausse**. Deux droites verticales sont parallèles, et pourtant aucune des deux n'admet de coefficient directeur. Contre-exemple : $x=1$ et $x=4$.

    **7.** **Vraie**. C'est exactement l'énoncé de la proposition 1.

    **8.** **Fausse**. Il peut n'y avoir aucune solution (droites strictement parallèles) ou une infinité (droites confondues). L'exercice 22 en donne les trois cas.

    **9.** **Vraie**. La seconde équation s'obtient en multipliant la première par $2$ : les deux équations décrivent la même droite.

    **10.** **Vraie**. Le point d'intersection appartient aux deux droites, donc ses coordonnées vérifient les deux équations : c'est la définition d'une solution du système.
- id: "s-08-28"
  feuille: "f-s-08"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équation cartésienne, lecture graphique, modélisation]
  noeuds: [v-espace]
  notions: []
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Dans un repère orthonormé, on considère les points $A(-1\,;1)$, $B(5\,;3)$ et $C(1\,;-3)$.

    **1.** Placer ces trois points et tracer le triangle $ABC$.

    **2.** Déterminer une équation cartésienne de chacune des droites $(AB)$, $(AC)$ et $(BC)$.

    **3.** Le point $D(7\,;1)$ appartient-il à la droite $(BC)$ ? Justifier.

    **4.** Déterminer les coordonnées du milieu $M$ du segment $[BC]$, puis une équation cartésienne de la médiane issue de $A$.

    **5.** Tracer cette médiane sur la figure et vérifier la cohérence du résultat.
  corrige: |
    **1.** Voici la figure, complétée de la médiane obtenue à la question 4.

    ![Figure](documents/figures/fd3e9f501c3639fa.svg)

    **2.** Droite $(AB)$ : $\overrightarrow{AB}\begin{pmatrix}6\\2\end{pmatrix}$, d'où l'équation $2x-6y+c=0$. Avec $A(-1\,;1)$ : $-2-6+c=0$, donc $c=8$. 
    $$2x-6y+8=0 \qquad \text{soit, en divisant par } 2 : \qquad \boxed{x-3y+4=0}$$

    Droite $(AC)$ : $\overrightarrow{AC}\begin{pmatrix}2\\-4\end{pmatrix}$, d'où $-4x-2y+c=0$. Avec $A$ : $4-2+c=0$, donc $c=-2$. 
    $$-4x-2y-2=0 \qquad \text{soit} \qquad \boxed{2x+y+1=0}$$

    Droite $(BC)$ : $\overrightarrow{BC}\begin{pmatrix}-4\\-6\end{pmatrix}$, d'où $-6x+4y+c=0$. Avec $B(5\,;3)$ : $-30+12+c=0$, donc $c=18$. 
    $$-6x+4y+18=0 \qquad \text{soit} \qquad \boxed{3x-2y-9=0}$$

    **3.** On remplace les coordonnées de $D(7\,;1)$ dans l'équation de $(BC)$ : 
    $$3\times 7-2\times 1-9=21-2-9=10\neq 0$$

    $$\boxed{D \text{ n'appartient pas à la droite } (BC)}$$

    **4.** Le milieu de $[BC]$ a pour coordonnées la moyenne de celles de $B$ et $C$ : 
    $$M\left(\frac{5+1}{2}\,;\frac{3+(-3)}{2}\right)=\boxed{M(3\,;0)}$$
     La médiane issue de $A$ est la droite $(AM)$, avec $\overrightarrow{AM}\begin{pmatrix}4\\-1\end{pmatrix}$, d'où $-x-4y+c=0$. Avec $A(-1\,;1)$ : $1-4+c=0$, donc $c=3$. 
    $$-x-4y+3=0 \qquad \text{soit} \qquad \boxed{x+4y-3=0}$$
     Vérification avec $M(3\,;0)$ : $3+0-3=0$.

    **5.** Sur la figure, la médiane rejoint bien $A$ au milieu du côté $[BC]$, et le point $M$ est visuellement à égale distance de $B$ et de $C$.
- id: "s-08-29"
  feuille: "f-s-08"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [équation réduite, lecture graphique, modélisation]
  noeuds: [v-espace]
  notions: []
  page_enonce: 9
  page_corrige: 20
  enonce: |
    Un opérateur téléphonique propose deux forfaits. Le forfait $A$ coûte $12$ euros par mois, auxquels s'ajoutent $0{,}20$ euro par gigaoctet consommé. Le forfait $B$ coûte $20$ euros par mois, auxquels s'ajoutent $0{,}10$ euro par gigaoctet.

    **1.** On note $x$ le nombre de gigaoctets consommés dans le mois. Exprimer en fonction de $x$ le prix $y_{A}$ payé avec le forfait $A$, puis le prix $y_{B}$ payé avec le forfait $B$.

    **2.** Reconnaître deux équations réduites de droites. Donner leur coefficient directeur et leur ordonnée à l'origine, puis interpréter chacun de ces deux nombres dans le contexte.

    **3.** Tracer les deux droites dans un repère, en prenant $1$ cm pour $10$ gigaoctets en abscisse et $1$ cm pour $4$ euros en ordonnée, avec $0\leqslant x\leqslant 120$.

    **4.** Déterminer graphiquement à partir de combien de gigaoctets le forfait $B$ devient plus avantageux.

    **5.** Retrouver ce résultat par le calcul, en résolvant une équation.
  corrige: |
    **1.** Le prix se compose d'une part fixe et d'une part proportionnelle au nombre de gigaoctets : 
    $$\boxed{y_{A}=0{,}2x+12} \qquad ; \qquad \boxed{y_{B}=0{,}1x+20}$$

    **2.** Ce sont deux équations réduites de droites. 
    $$\boxed{\begin{array}{ll} \text{Forfait } A : & m=0{,}2 \text{ et } p=12 \\[1mm] \text{Forfait } B : & m=0{,}1 \text{ et } p=20 \end{array}}$$
     L'ordonnée à l'origine $p$ est le prix payé pour zéro gigaoctet, c'est-à-dire l'abonnement mensuel. Le coefficient directeur $m$ est le prix d'un gigaoctet supplémentaire. 
    $$\boxed{\text{Le forfait } A \text{ a un abonnement moins cher, mais un gigaoctet deux fois plus cher}}$$

    **3.** et 4.

    ![Figure](documents/figures/9b661415aa8beebc.svg)

    On lit que les deux droites se croisent pour $x=80$. 
    $$\boxed{\text{Au-delà de } 80 \text{ Go, le forfait } B \text{ devient plus avantageux}}$$
     En effet, à droite de ce point, la droite $B$ passe en dessous de la droite $A$ : elle correspond donc à un prix plus faible.

    **4.** On résout $y_{A}=y_{B}$ : 
    $$\begin{aligned} 0{,}2x+12 &= 0{,}1x+20 \\ 0{,}1x &= 8 \\ x &= 80 \end{aligned}$$

    $$\boxed{\text{Le calcul confirme la lecture graphique : le seuil est de } 80 \text{ Go}}$$
     Le prix payé est alors le même dans les deux cas : $0{,}2\times 80+12=28$ euros.
- id: "s-08-30"
  feuille: "f-s-08"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équation cartésienne, lecture graphique, positions relatives, modélisation]
  noeuds: [v-espace, v-determinant]
  notions: [determinant]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    Dans un repère, on considère les points $A(-2\,;-1)$, $B(2\,;1)$, $C(4\,;5)$ et $D(0\,;3)$.

    **1.** Placer ces quatre points et tracer le quadrilatère $ABCD$.

    **2.** Démontrer que $ABCD$ est un parallélogramme.

    **3.** Déterminer une équation cartésienne des droites $(AB)$ et $(DC)$, puis vérifier à l'aide du critère $ab'-a'b$ qu'elles sont bien parallèles.

    **4.** Déterminer de même une équation cartésienne des droites $(AD)$ et $(BC)$, et vérifier qu'elles sont parallèles.

    **5.** Déterminer les coordonnées du milieu de $[AC]$, puis celles du milieu de $[BD]$. Que constate-t-on ? Quelle propriété du parallélogramme retrouve-t-on ?

    **6.** Déterminer une équation cartésienne de la diagonale $(AC)$, puis vérifier par le calcul que le point trouvé à la question 5 lui appartient.
  corrige: |
    **1.** Voici la figure.

    ![Figure](documents/figures/0898502135f9ea20.svg)

    **2.** On calcule les deux vecteurs : 
    $$\overrightarrow{AB}\begin{pmatrix}2-(-2)\\1-(-1)\end{pmatrix}=\begin{pmatrix}4\\2\end{pmatrix} \qquad ; \qquad \overrightarrow{DC}\begin{pmatrix}4-0\\5-3\end{pmatrix}=\begin{pmatrix}4\\2\end{pmatrix}$$

    $$\overrightarrow{AB}=\overrightarrow{DC} \qquad \Longrightarrow \qquad \boxed{ABCD \text{ est un parallélogramme}}$$

    **3.** $(AB)$ : vecteur directeur $\begin{pmatrix}4\\2\end{pmatrix}$, d'où $2x-4y+c=0$. Avec $A(-2\,;-1)$ : $-4+4+c=0$, donc $c=0$. 
    $$2x-4y=0 \qquad \text{soit} \qquad \boxed{x-2y=0}$$
     $(DC)$ : même vecteur directeur, d'où $2x-4y+c=0$. Avec $D(0\,;3)$ : $-12+c=0$, donc $c=12$. 
    $$2x-4y+12=0 \qquad \text{soit} \qquad \boxed{x-2y+6=0}$$
     Critère : $(a\,;b)=(1\,;-2)$ et $(a'\,;b')=(1\,;-2)$, donc $ab'-a'b=1\times(-2)-1\times(-2)=0$. 
    $$\boxed{\text{Les droites } (AB) \text{ et } (DC) \text{ sont bien parallèles}}$$

    **4.** $\overrightarrow{AD}\begin{pmatrix}2\\4\end{pmatrix}$, d'où $4x-2y+c=0$. Avec $A$ : $-8+2+c=0$, donc $c=6$. 
    $$4x-2y+6=0 \qquad \text{soit} \qquad \boxed{2x-y+3=0}$$
     $\overrightarrow{BC}\begin{pmatrix}2\\4\end{pmatrix}$ également, d'où $2x-y+c=0$. Avec $B(2\,;1)$ : $4-1+c=0$, donc $c=-3$. 
    $$\boxed{2x-y-3=0}$$
     Critère : $2\times(-1)-2\times(-1)=0$. 
    $$\boxed{\text{Les droites } (AD) \text{ et } (BC) \text{ sont bien parallèles}}$$

    **5.** 
    $$\text{milieu de } [AC] : \left(\frac{-2+4}{2}\,;\frac{-1+5}{2}\right)=(1\,;2)$$

    $$\text{milieu de } [BD] : \left(\frac{2+0}{2}\,;\frac{1+3}{2}\right)=(1\,;2)$$

    $$\boxed{\text{Les deux milieux sont confondus au point } I(1\,;2)}$$

    $$\boxed{\text{On retrouve que les diagonales d'un parallélogramme se coupent en leur milieu}}$$

    **6.** $\overrightarrow{AC}\begin{pmatrix}6\\6\end{pmatrix}$, d'où $6x-6y+c=0$. Avec $A(-2\,;-1)$ : $-12+6+c=0$, donc $c=6$. 
    $$6x-6y+6=0 \qquad \text{soit} \qquad \boxed{x-y+1=0}$$
     Vérification avec $I(1\,;2)$ : $1-2+1=0$. 
    $$\boxed{I \text{ appartient bien à la diagonale } (AC)}$$
- id: "s-08-31"
  feuille: "f-s-08"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [lecture graphique, positions relatives]
  noeuds: [v-espace, v-determinant]
  notions: [determinant]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    On considère les droites $d_{1} : 2x-y+1=0$ et $d_{2} : x+y-4=0$, ainsi que la famille de droites $d_{3} : 3x-2y+m=0$, où $m$ est un réel.

    **1.** Démontrer que $d_{1}$ et $d_{2}$ sont sécantes, puis déterminer les coordonnées de leur point d'intersection $I$.

    **2.** Déterminer le réel $m$ pour que les trois droites soient concourantes, c'est-à-dire passent toutes les trois par le même point.

    **3.** On prend maintenant $m=0$. Déterminer les coordonnées du point d'intersection de $d_{1}$ et $d_{3}$, puis vérifier que ce point n'appartient pas à $d_{2}$.

    **4.** Que peut-on en conclure sur la figure formée par les trois droites lorsque $m=0$ ?

    **5.** Tracer les trois droites pour $m=0$ afin d'illustrer la conclusion précédente.
  corrige: |
    **1.** Les coefficients sont $(2\,;-1)$ et $(1\,;1)$ : 
    $$ab'-a'b=2\times 1-1\times(-1)=3\neq 0 \qquad \Longrightarrow \qquad \boxed{d_{1} \text{ et } d_{2} \text{ sont sécantes}}$$
     On résout ensuite : 
    $$\left\{\begin{array}{ll} 2x-y+1=0 & \textcircled{e_{1}} \\ x+y-4=0 & \textcircled{e_{2}} \end{array}\right.$$
     Les coefficients de $y$ sont opposés : on effectue $\textcircled{e_{1}}+ \textcircled{e_{2}}$. 
    $$\begin{aligned} (2x-y+1)+(x+y-4) &= 0 \\ 3x-3 &= 0 \\ x &= 1 \end{aligned}$$
     On reporte dans $\textcircled{e_{2}}$ : $1+y-4=0$, donc $y=3$. 
    $$\boxed{I(1\,;3)}$$

    **2.** Les trois droites sont concourantes si $d_{3}$ passe par $I$. On injecte donc les coordonnées de $I$ dans l'équation de $d_{3}$ : 
    $$3\times 1-2\times 3+m=0 \iff 3-6+m=0 \iff \boxed{m=3}$$

    **3.** Pour $m=0$, l'équation de $d_{3}$ est $3x-2y=0$. On résout avec $d_{1}$ : 
    $$\left\{\begin{array}{ll} 2x-y+1=0 & \textcircled{e_{1}} \\ 3x-2y=0 & \textcircled{e_{2}} \end{array}\right.$$
     On effectue $2\times \textcircled{e_{1}}- \textcircled{e_{2}}$ : 
    $$\begin{aligned} 2(2x-y+1)-(3x-2y) &= 0 \\ 4x-2y+2-3x+2y &= 0 \\ x+2 &= 0 \\ x &= -2 \end{aligned}$$
     On reporte dans $\textcircled{e_{1}}$ : $-4-y+1=0$, donc $y=-3$. Le point d'intersection est $J(-2\,;-3)$. On vérifie s'il appartient à $d_{2}$ : 
    $$-2+(-3)-4=-9\neq 0$$

    $$\boxed{J \text{ n'appartient pas à } d_{2}}$$

    **4.** Les trois droites sont deux à deux sécantes, mais ne passent pas par un même point : elles se coupent donc en trois points distincts. 
    $$\boxed{\text{Pour } m=0, \text{ les trois droites délimitent un triangle}}$$

    **5.** Voici la figure pour $m=0$.

    ![Figure](documents/figures/f4161aefde2e175c.svg)

    Le triangle est très aplati, ce qui explique pourquoi une lecture graphique seule aurait pu laisser croire que les trois droites étaient concourantes : seul le calcul permet de trancher.

