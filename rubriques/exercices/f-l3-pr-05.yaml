  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 5 ; Durand, exercice 1.38"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Une urne contient $n \geqslant 2$ boules numérotées de $1$ à $n$. On tire successivement et sans remise deux boules ; on note $X$ et $Y$ leurs numéros.

    **1.** Déterminer la loi du couple $(X, Y)$ et ses lois marginales. Les variables $X$ et $Y$ sont-elles indépendantes ?

    **2.** Déterminer la loi de $X + Y$.

    **3.** Calculer le coefficient de corrélation $\rho_{n}$ de $X$ et $Y$, et sa limite quand $n \to +\infty$. Interpréter. On pourra imaginer que l'on vide l'urne, en notant $Z_{1} = X$, $Z_{2} = Y$, $Z_{3}, \dots, Z_{n}$ les numéros successifs, et utiliser le fait que $Z_{1} + \dots + Z_{n}$ est constante.
  corrige: |
    **1.** Les $n(n - 1)$ couples de boules distinctes sont équiprobables : 
    $$\boxed{\mathbb{P}(X = i, Y = j) = \frac{\mathbf{1}_{i \neq j}}{n(n - 1)}}.$$
     En sommant une ligne ou une colonne, qui contient $n - 1$ cases non nulles, $X$ et $Y$ sont uniformes sur $\llbracket 1, n\rrbracket$. Elles ne sont pas indépendantes, car $\mathbb{P}(X = Y) = 0$, alors que pour des variables indépendantes de loi uniforme, $\mathbb{P}(X = Y) = \frac{1}{n}$.

    **2.** Pour $3 \leqslant s \leqslant 2n - 1$, on compte les couples $(i, s - i)$ de $\llbracket 1, n\rrbracket^{2}$, au nombre de $\min(s - 1, 2n + 1 - s)$ (exercice 5), et l'on retire le couple diagonal $(\frac{s}{2}, \frac{s}{2})$ lorsque $s$ est pair : 
    $$\boxed{\mathbb{P}(X + Y = s) = \frac{\min(s - 1, 2n + 1 - s) - \mathbf{1}_{s \text{ pair}}}{n(n - 1)}}.$$
     Par exemple, pour $n = 5$, les effectifs de $s = 3, \dots, 9$ sont $2, 2, 4, 4, 4, 2, 2$, de somme $20 = n(n - 1)$.

    **3.** Vidons l'urne : les numéros $Z_{1} = X, Z_{2} = Y, \dots, Z_{n}$ forment une permutation uniforme de $\llbracket 1, n\rrbracket$. Par symétrie, chaque $Z_{k}$ a la loi uniforme, de variance $\sigma^{2} = \frac{n^{2} - 1}{12}$, et chaque couple $(Z_{k}, Z_{l})$, $k \neq l$, a la loi de $(X, Y)$, donc la covariance $c = \operatorname{Cov}(X, Y)$. Comme $Z_{1} + \dots + Z_{n} = \frac{n(n + 1)}{2}$ est constante, la prop. 5 du cours donne 
    $$0 = n\sigma^{2} + n(n - 1)c, \qquad \text{d'où} \quad c = -\frac{\sigma^{2}}{n - 1} = -\frac{n + 1}{12} \quad\text{et}\quad \boxed{\rho_{n} = -\frac{1}{n - 1}} \xrightarrow[n \to +\infty]{} 0.$$
     *Interprétation.* Tirer une grande boule rend la suivante un peu plus petite en moyenne, d'où la corrélation négative ; quand $n$ est grand, retirer une boule modifie à peine l'urne, et deux tirages sans remise se comportent presque comme deux tirages indépendants. C'est le même argument « par la somme constante » que pour la loi hypergéométrique (cours, section 5.4).
- id: "l3-pr-05-16"
  feuille: "f-l3-pr-05"
