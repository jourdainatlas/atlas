  enonce: |
    Soient $X \sim \mathcal{B}(p)$ et $Y \sim \mathcal{P}(\lambda)$ indépendantes, et $Z = XY$. Calculer $\mathbb{E}[Z]$, puis déterminer la loi de $Z$ et sa variance.
  corrige: |
    Par indépendance (chapitre 3, th. 3), $\boxed{\mathbb{E}[Z] = \mathbb{E}[X]\mathbb{E}[Y] = p\lambda}$.

    La variable $Z$ vaut $0$ si $X = 0$, ou si $X = 1$ et $Y = 0$ ; elle vaut $k \geqslant 1$ si $X = 1$ et $Y = k$. Donc 
    $$\boxed{\mathbb{P}(Z = 0) = q + p\mathrm{e}^{-\lambda}, \qquad \mathbb{P}(Z = k) = p\,\mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!} \ (k \geqslant 1)}.$$
     Comme $X^{2} = X$, $\mathbb{E}[Z^{2}] = \mathbb{E}[X]\mathbb{E}[Y^{2}] = p(\lambda + \lambda^{2})$, et 
    $$\operatorname{Var}(Z) = p\lambda + p\lambda^{2} - p^{2}\lambda^{2} = \boxed{p\lambda(1 + q\lambda)}.$$
     La variance dépasse l'espérance : le mélange de la masse en $0$ et d'une loi de Poisson est plus dispersé qu'une loi de Poisson de même moyenne.
- id: "l3-pr-05-07"
  feuille: "f-l3-pr-05"
