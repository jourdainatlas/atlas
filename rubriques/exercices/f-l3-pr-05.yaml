  mots_cles: [lois conditionnelles]
  noeuds: [p-independance, p-variables]
  notions: [independance, probabilite-conditionnelle]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 22"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Un cirque s'installe dans une ville de $n$ habitants. Chaque soir, toute personne qui n'a pas encore vu le spectacle s'y rend avec probabilité $p$, indépendamment des autres. On note $X_{k}$ le nombre de spectateurs de la $k$-ième représentation.

    **1.** Donner la loi de $X_{1}$, puis celle du couple $(X_{1}, X_{2})$.

    **2.** En déduire les lois de $X_{2}$ et de $X_{1} + X_{2}$.

    **3.** Quelle est la loi de $X_{1} + \dots + X_{k}$ ? Retrouver ce résultat sans calcul.
  corrige: |
    **1.** Chaque habitant va à la première représentation avec probabilité $p$, indépendamment : $\boxed{X_{1} \sim \mathcal{B}(n, p)}$. Sachant $X_{1} = i$, les $n - i$ habitants restants y vont le second soir avec probabilité $p$ chacun, donc $X_{2}$ suit sachant $X_{1} = i$ la loi $\mathcal{B}(n - i, p)$, et 
    $$\boxed{\mathbb{P}(X_{1} = i, X_{2} = j) = \binom{n}{i}p^{i}q^{n - i}\binom{n - i}{j}p^{j}q^{n - i - j}}, \qquad i + j \leqslant n.$$

    **2.** Comme $\binom{n}{i}\binom{n - i}{j} = \binom{n}{j}\binom{n - j}{i}$, la somme sur $i$ donne, par la formule du binôme, 
    $$\mathbb{P}(X_{2} = j) = \binom{n}{j}(pq)^{j}\sum_{i = 0}^{n - j}\binom{n - j}{i}p^{i}(q^{2})^{n - j - i} = \binom{n}{j}(pq)^{j}(p + q^{2})^{n - j},$$
     et $p + q^{2} = 1 - pq$ : $\boxed{X_{2} \sim \mathcal{B}(n, pq)}$. De même, en posant $s = i + j$, la somme des $\mathbb{P}(X_{1} = i, X_{2} = s - i)$ vaut $\binom{n}{s}(p + pq)^{s}(q^{2})^{n - s}$, d'où $\boxed{X_{1} + X_{2} \sim \mathcal{B}(n, 1 - q^{2})}$.

    **3.** Un habitant donné a vu le spectacle au cours des $k$ premiers soirs, sauf s'il a refusé $k$ fois, ce qui arrive avec probabilité $q^{k}$ ; les habitants se comportent indépendamment. Donc 
    $$\boxed{X_{1} + \dots + X_{k} \sim \mathcal{B}(n, 1 - q^{k})}.$$
     Ce raisonnement direct redonne la question 2 sans calcul : $X_{1} + X_{2} \sim \mathcal{B}(n, 1 - q^{2})$, et $X_{2}$ compte les habitants dont la première acceptation a lieu le second soir, de probabilité $qp$.
- id: "l3-pr-05-10"
  feuille: "f-l3-pr-05"
  numero: 10
  partie: "Indépendance, lois conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lois conditionnelles]
  noeuds: [p-independance, p-variables]
  notions: [independance, probabilite-conditionnelle]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 25 (ESCP 2009)"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Une personne envoie des courriers électroniques par l'un de deux serveurs : le serveur $A$ est choisi avec probabilité $p$, le serveur $B$ sinon, les choix successifs étant indépendants. La suite des serveurs utilisés se découpe en séries de lettres identiques ; ainsi ABBBAB… commence par une série de longueur $1$, puis une de longueur $3$, puis une de longueur $1$. On note $L_{1}$, $L_{2}$, $L_{3}$ les longueurs des trois premières séries.

    **1.** Déterminer la loi de $L_{1}$, montrer qu'elle admet une variance et calculer $\mathbb{E}[L_{1}]$.

    **2.** Déterminer la loi du couple $(L_{1}, L_{2})$, puis la loi de $L_{2}$ et son espérance.

    **3.** Déterminer la loi de $L_{3}$.

    **4.** Justifier l'existence de $\operatorname{Cov}(L_{1}, L_{2})$, la calculer et préciser son signe. Pour quelle valeur de $p$ est-elle nulle ? Les variables $L_{1}$ et $L_{2}$ sont-elles alors indépendantes ?
  corrige: |
    **1.** La première série a la longueur $k$ si les $k$ premiers serveurs sont $A$ et le suivant $B$, ou l'inverse : 
    $$\boxed{\mathbb{P}(L_{1} = k) = p^{k}q + q^{k}p}, \qquad k \geqslant 1.$$
     Les séries $\sum k^{2}p^{k}$ et $\sum k^{2}q^{k}$ convergent ($0 < p, q < 1$), donc $L_{1}$ admet une variance. Avec $\sum_{k \geqslant 1}kx^{k} = \frac{x}{(1 - x)^{2}}$, on trouve $\boxed{\mathbb{E}[L_{1}] = \frac{p}{q} + \frac{q}{p}}$, qui vaut au moins $2$, avec égalité si et seulement si $p = \frac{1}{2}$.

    **2.** Si la première série est formée de $A$, la seconde est formée de $B$, et elle est suivie d'un $A$ : 
    $$\boxed{\mathbb{P}(L_{1} = k, L_{2} = l) = p^{k}q^{l}p + q^{k}p^{l}q}, \qquad k, l \geqslant 1.$$
     En sommant sur $k$, on obtient $\mathbb{P}(L_{2} = l) = p^{2}q^{l - 1} + q^{2}p^{l - 1}$. C'est le mélange $p\,\mathcal{G}(p) + q\,\mathcal{G}(q)$, d'où, quel que soit $p$, 
    $$\boxed{\mathbb{E}[L_{2}] = p \cdot \frac{1}{p} + q \cdot \frac{1}{q} = 2}.$$

    **3.** La troisième série est formée de la même lettre que la première ; en sommant sur $k$ et $l$, 
    $$\mathbb{P}(L_{3} = m) = \sum_{k, l \geqslant 1}\big(p^{k}q^{l}p^{m}q + q^{k}p^{l}q^{m}p\big) = \frac{p}{q} \cdot \frac{q}{p}\,p^{m}q + \frac{q}{p} \cdot \frac{p}{q}\,q^{m}p :$$
     $\boxed{L_{3} \text{ a la même loi que } L_{1}}$.

    **4.** La covariance existe, car $L_{1}$ et $L_{2}$ sont de carré intégrable (cours, th. 1). Puis 
    $$\mathbb{E}[L_{1}L_{2}] = p\Big(\sum_{k}kp^{k}\Big)\Big(\sum_{l}lq^{l}\Big) + q\Big(\sum_{k}kq^{k}\Big)\Big(\sum_{l}lp^{l}\Big) = p \cdot \frac{p}{q^{2}} \cdot \frac{q}{p^{2}} + q \cdot \frac{q}{p^{2}} \cdot \frac{p}{q^{2}} = \frac{1}{q} + \frac{1}{p} = \frac{1}{pq}.$$
     Donc, puisque $1 = (p + q)^{2}$, 
    $$\operatorname{Cov}(L_{1}, L_{2}) = \frac{1}{pq} - 2\Big(\frac{p}{q} + \frac{q}{p}\Big) = \frac{(p + q)^{2} - 2p^{2} - 2q^{2}}{pq} = \boxed{-\frac{(p - q)^{2}}{pq} \leqslant 0}.$$
     *Interprétation.* Si $p > q$, une longue première série est probablement une série de $A$, et la série suivante, de $B$, est alors courte.

    La covariance est nulle si et seulement si $\boxed{p = \frac{1}{2}}$. Dans ce cas, $\mathbb{P}(L_{1} = k, L_{2} = l)$ vaut $2 \cdot 2^{-(k + l + 1)} = 2^{-k}\,2^{-l}$, et les deux marginales sont $\mathcal{G}(\frac{1}{2})$ : $L_{1}$ et $L_{2}$ sont alors indépendantes. Ce n'était pas garanti par la seule nullité de la covariance.
- id: "l3-pr-05-11"
  feuille: "f-l3-pr-05"
