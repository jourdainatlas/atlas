- id: "l3-pr-05-01"
  feuille: "f-l3-pr-05"
  numero: 1
  partie: "Lois conjointes, lois marginales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois conjointes et marginales]
  noeuds: [p-variables]
  notions: [loi-variable]
  source: "Durand (Orsay), exercices 2.29 et 2.30"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Pour $a \in [0, 1]$, la loi d'un couple $(X, Y)$ à valeurs dans $\{1, 2, 3\}^{2}$ est donnée par le tableau ci-dessous, où la ligne $x$ et la colonne $y$ contiennent $\mathbb{P}(X = x, Y = y)$ : 
    $$\frac{1}{3}\begin{pmatrix} 0 & a & 1 - a \\ 1 - a & 0 & a \\ a & 1 - a & 0 \end{pmatrix}.$$
     Déterminer les lois marginales et $\mathbb{P}(X = Y)$. Pour quelles valeurs de $a$ les variables $X$ et $Y$ sont-elles indépendantes ? Calculer $\operatorname{Cov}(X, Y)$ et commenter.

    **2.** Le couple $(X, Y)$ prend ses valeurs dans $\{-1, 0, 1\} \times \{-1, 1\}$. Pour $Y = -1$, les probabilités des valeurs $X = -1, 0, 1$ sont $\frac{1}{12}$, $\frac{1}{3}$, $\frac{1}{12}$ ; pour $Y = 1$, elles valent toutes $\frac{1}{6}$. Vérifier que l'on définit ainsi une loi de probabilité, donner les lois marginales, puis les lois de $X + Y$ et de $XY$.
  corrige: |
    **1.** Chaque ligne et chaque colonne du tableau a pour somme $\frac{1}{3}(a + 1 - a) = \frac{1}{3}$ : les deux marginales sont uniformes sur $\{1, 2, 3\}$, quel que soit $a$. La diagonale est nulle, donc $\boxed{\mathbb{P}(X = Y) = 0}$.

    Si $X$ et $Y$ étaient indépendantes, on aurait $\mathbb{P}(X = 1, Y = 1) = \frac{1}{9} \neq 0$ : elles ne le sont pour aucune valeur de $a$.

    Calculons $\mathbb{E}[XY] = \frac{1}{3}\big[a(2 + 6 + 3) + (1 - a)(3 + 2 + 6)\big] = \frac{11}{3}$, d'où 
    $$\boxed{\operatorname{Cov}(X, Y) = \frac{11}{3} - 2 \times 2 = -\frac{1}{3}}, \qquad \rho(X, Y) = \frac{-1/3}{2/3} = -\frac{1}{2}.$$
     *Commentaire.* Toutes ces lois conjointes ont les mêmes marginales et la même covariance, et pourtant elles sont différentes (pour $a = 0$, $Y = X + 2$ modulo $3$ presque sûrement ; pour $a = 1$, $Y = X + 1$ modulo $3$). Ni les marginales, ni même les marginales et la covariance ne déterminent la loi d'un couple.

    **2.** Les masses sont positives et leur somme vaut $\frac{1}{12} + \frac{1}{3} + \frac{1}{12} + 3 \times \frac{1}{6} = 1$ : c'est une loi de probabilité. En sommant les colonnes et les lignes (cours, prop. 1), 
    $$\boxed{X : \Big(\tfrac{1}{4}, \tfrac{1}{2}, \tfrac{1}{4}\Big) \text{ sur } (-1, 0, 1)}, \qquad \boxed{Y \sim \mathcal{U}(\{-1, 1\})}.$$
     La variable $X + Y$ prend la valeur $-2$ pour $(-1, -1)$, $-1$ pour $(0, -1)$, $0$ pour $(1, -1)$ et $(-1, 1)$, $1$ pour $(0, 1)$, $2$ pour $(1, 1)$ : 
    $$\boxed{X + Y : \Big(\tfrac{1}{12}, \tfrac{1}{3}, \tfrac{1}{4}, \tfrac{1}{6}, \tfrac{1}{6}\Big) \text{ sur } (-2, -1, 0, 1, 2)}.$$
     De même $XY = -1$ pour $(1, -1)$ et $(-1, 1)$, $XY = 0$ lorsque $X = 0$, et $XY = 1$ pour $(-1, -1)$ et $(1, 1)$ : $\boxed{XY : \big(\tfrac{1}{4}, \tfrac{1}{2}, \tfrac{1}{4}\big) \text{ sur } (-1, 0, 1)}$, la même loi que $X$.

    On remarque que $X$ et $Y$ ne sont pas indépendantes, puisque $\mathbb{P}(X = 0, Y = -1) = \frac{1}{3} \neq \frac{1}{4}$.
- id: "l3-pr-05-02"
  feuille: "f-l3-pr-05"
  numero: 2
  partie: "Lois conjointes, lois marginales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois conjointes et marginales]
  noeuds: [p-variables]
  notions: [loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercices 3, 4 et 19"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Dans chacun des cas suivants, déterminer la constante pour que la famille définisse la loi d'un couple $(X, Y)$, puis donner les lois marginales et dire si $X$ et $Y$ sont indépendantes.

    **1.** $\mathbb{P}(X = i, Y = j) = \lambda\, i j$ pour $(i, j) \in \llbracket 1, n\rrbracket^{2}$. Calculer aussi $\mathbb{E}[X]$ et $\operatorname{Cov}(X, Y)$.

    **2.** $\mathbb{P}(X = i, Y = j) = \frac{a^{i}}{j!}$ pour $(i, j) \in \mathbb{N}^{*} \times \mathbb{N}$, avec $a > 0$. Calculer l'espérance et la variance de $X + Y$.

    **3.** $\mathbb{P}(X = i, Y = j) = \frac{(i + j)\,\lambda^{i + j}}{\mathrm{e}\; i!\, j!}$ pour $(i, j) \in \mathbb{N}^{2}$, avec $\lambda > 0$. Déterminer la loi de $X + Y$ et calculer $\mathbb{E}\big[2^{X + Y}\big]$.
  corrige: |
    **1.** La somme vaut $\lambda\big(\sum_{i = 1}^{n}i\big)^{2} = \lambda\frac{n^{2}(n + 1)^{2}}{4}$, d'où 
    $$\boxed{\lambda = \frac{4}{n^{2}(n + 1)^{2}}}.$$
     Alors $\mathbb{P}(X = i) = \lambda i\sum_{j}j = \frac{2i}{n(n + 1)}$, et $Y$ a la même loi.

    Comme $p_{i, j} = \mathbb{P}(X = i)\mathbb{P}(Y = j)$, les variables $X$ et $Y$ sont $\boxed{\text{indépendantes}}$, donc $\boxed{\operatorname{Cov}(X, Y) = 0}$ (cours, prop. 8). Enfin 
    $$\mathbb{E}[X] = \frac{2}{n(n + 1)}\sum_{i = 1}^{n}i^{2} = \frac{2}{n(n + 1)} \cdot \frac{n(n + 1)(2n + 1)}{6} = \boxed{\frac{2n + 1}{3}}.$$

    **2.** Il faut $a > 0$, et $\sum_{i \geqslant 1}\sum_{j \geqslant 0}\frac{a^{i}}{j!} = \mathrm{e}\sum_{i \geqslant 1}a^{i}$ ; la série converge si et seulement si $a < 1$, et vaut alors $\frac{\mathrm{e} a}{1 - a}$. La condition est $\frac{\mathrm{e} a}{1 - a} = 1$, soit $\boxed{a = \frac{1}{1 + \mathrm{e}}}$.

    Les marginales sont $\mathbb{P}(X = i) = \mathrm{e} a^{i} = \frac{\mathrm{e}}{1 + \mathrm{e}}\Big(\frac{1}{1 + \mathrm{e}}\Big)^{i - 1}$ et $\mathbb{P}(Y = j) = \frac{1}{j!}\sum_{i}a^{i} = \frac{\mathrm{e}^{-1}}{j!}$ : 
    $$\boxed{X \sim \mathcal{G}\Big(\frac{\mathrm{e}}{1 + \mathrm{e}}\Big), \qquad Y \sim \mathcal{P}(1)},$$
     et la masse conjointe est le produit des marginales : $X$ et $Y$ sont indépendantes. Par conséquent, avec $p = \frac{\mathrm{e}}{1 + \mathrm{e}}$, 
    $$\mathbb{E}[X + Y] = \frac{1}{p} + 1 = \boxed{2 + \mathrm{e}^{-1}}, \qquad \operatorname{Var}(X + Y) = \frac{1 - p}{p^{2}} + 1 = \boxed{\frac{1 + \mathrm{e} + \mathrm{e}^{2}}{\mathrm{e}^{2}}}.$$

    **3.** Regroupons selon $s = i + j$ : par la formule du binôme, $\sum_{i + j = s}\frac{1}{i!\,j!} = \frac{2^{s}}{s!}$, donc 
    $$\mathbb{P}(X + Y = s) = \frac{s\,(2\lambda)^{s}}{\mathrm{e}\; s!} \quad\text{et}\quad \sum_{s \geqslant 0}\frac{s(2\lambda)^{s}}{\mathrm{e}\, s!} = \frac{2\lambda\,\mathrm{e}^{2\lambda}}{\mathrm{e}}.$$
     La condition $2\lambda\,\mathrm{e}^{2\lambda} = \mathrm{e}$ est vérifiée par $\lambda = \frac{1}{2}$, et seulement par lui, car $u \mapsto u\mathrm{e}^{u}$ est strictement croissante sur $\mathbb{R}_{+}$ : $\boxed{\lambda = \frac{1}{2}}$.

    Les marginales s'obtiennent par sommation : 
    $$\mathbb{P}(X = i) = \frac{(1/2)^{i}}{\mathrm{e}\, i!}\sum_{j}\frac{(i + j)(1/2)^{j}}{j!} = \mathrm{e}^{-1/2}\,\frac{(1/2)^{i}}{i!}\Big(i + \frac{1}{2}\Big),$$
     et $Y$ a la même loi.

    Les variables ne sont pas indépendantes. En effet, $\mathbb{P}(X = 0, Y = 0) = 0$, alors que le produit $\mathbb{P}(X = 0)\mathbb{P}(Y = 0)$ vaut $\frac{1}{4\mathrm{e}}$.

    Pour $\lambda = \frac{1}{2}$, $\mathbb{P}(X + Y = s) = \frac{s}{\mathrm{e}\, s!} = \frac{\mathrm{e}^{-1}}{(s - 1)!}$ pour $s \geqslant 1$ : $\boxed{X + Y - 1 \sim \mathcal{P}(1)}$. Ainsi $\mathbb{E}\big[2^{X + Y}\big] = 2\,\mathbb{E}\big[2^{X + Y - 1}\big] = 2\sum_{m \geqslant 0}\mathrm{e}^{-1}\frac{2^{m}}{m!} = \boxed{2\mathrm{e}}$.
- id: "l3-pr-05-03"
  feuille: "f-l3-pr-05"
  numero: 3
  partie: "Lois conjointes, lois marginales"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lois conjointes et marginales]
  noeuds: [p-variables]
  notions: [loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 17 ; Durand, exercice 1.14 (cas n = 6, « dé à X faces »)"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    On dispose de $n$ urnes $U_{1}, \dots, U_{n}$ ; pour $k \in \llbracket 1, n\rrbracket$, l'urne $U_{k}$ contient $k$ boules numérotées de $1$ à $k$. On choisit une urne au hasard, puis on tire une boule dans cette urne. On note $X$ le numéro de l'urne et $Y$ celui de la boule.

    **1.** Déterminer la loi du couple $(X, Y)$, puis exprimer la loi de $Y$ à l'aide d'une somme. Les variables $X$ et $Y$ sont-elles indépendantes ?

    **2.** Calculer $\mathbb{E}[Y]$ et $\operatorname{Var}(Y)$ en fonction de $n$. On pourra calculer d'abord $\mathbb{E}[Y \mid X = k]$ et $\mathbb{E}[Y^{2} \mid X = k]$.

    **3.** Application : on lance un dé équilibré à six faces, de résultat $X$, puis un dé équilibré à $X$ faces. Quelle est la valeur la plus probable du second dé ? Calculer son espérance.
  corrige: |
    **1.** Par la formule des probabilités composées, pour $1 \leqslant l \leqslant k \leqslant n$, 
    $$\boxed{\mathbb{P}(X = k, Y = l) = \mathbb{P}(X = k)\mathbb{P}(Y = l \mid X = k) = \frac{1}{nk}},$$
     et la masse est nulle si $l > k$. En sommant sur $k$ (cours, prop. 1), $\boxed{\mathbb{P}(Y = l) = \frac{1}{n}\sum_{k = l}^{n}\frac{1}{k}}$ pour $1 \leqslant l \leqslant n$.

    Les variables ne sont pas indépendantes (pour $n \geqslant 2$) : $\mathbb{P}(X = 1, Y = 2) = 0$, alors que $\mathbb{P}(X = 1)\mathbb{P}(Y = 2) > 0$.

    **2.** Sachant $X = k$, la loi de $Y$ est uniforme sur $\llbracket 1, k\rrbracket$ ; donc 
    $$\mathbb{E}[Y \mid X = k] = \frac{k + 1}{2}, \qquad \mathbb{E}[Y^{2} \mid X = k] = \frac{(k + 1)(2k + 1)}{6}.$$
     Par la formule des probabilités totales, $\mathbb{E}[Y] = \sum_{k}\mathbb{P}(X = k)\mathbb{E}[Y \mid X = k] = \mathbb{E}\big[\frac{X + 1}{2}\big]$, d'où 
    $$\mathbb{E}[Y] = \frac{1}{2}\Big(\frac{n + 1}{2} + 1\Big) = \boxed{\frac{n + 3}{4}}.$$
     De même, $\mathbb{E}[Y^{2}] = \frac{1}{6}\mathbb{E}[2X^{2} + 3X + 1]$, et $\mathbb{E}[X^{2}] = \frac{(n + 1)(2n + 1)}{6}$. Le calcul donne 
    $$\mathbb{E}[Y^{2}] = \frac{4n^{2} + 15n + 17}{36},$$
     puis 
    $$\boxed{\operatorname{Var}(Y) = \frac{(n - 1)(7n + 13)}{144}}.$$

    **3.** C'est le cas $n = 6$. La suite $l \mapsto \mathbb{P}(Y = l)$ est décroissante, puisque la somme perd un terme positif quand $l$ augmente ; la valeur la plus probable est donc $\boxed{1}$, de probabilité $\frac{1}{6}\big(1 + \frac{1}{2} + \dots + \frac{1}{6}\big) = \frac{49}{120} \approx 0{,}41$, et $\boxed{\mathbb{E}[Y] = \frac{9}{4}}$.

    1.5em

    ![Figure](documents/figures/1f5f264124e31684.svg)

    La loi du second dé (orange) comparée à celle du premier (vert, uniforme) : le second dé favorise les petites valeurs, car $1$ est possible quel que soit $X$, et $6$ seulement si $X = 6$. Son espérance $\frac{9}{4}$ est très inférieure à $\frac{7}{2}$.
