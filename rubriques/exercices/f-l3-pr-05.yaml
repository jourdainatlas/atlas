  page_enonce: 2
  page_corrige: 4
  enonce: |
    On lance indéfiniment une pièce qui donne pile avec probabilité $p \in \,]0, 1[$. On note $X$ la longueur de la première série de piles et $Y$ celle de la première série de faces ; par exemple, pour FFPPF, on a $Y = 2$ et $X = 2$.

    **1.** Déterminer la loi du couple $(X, Y)$ et ses lois marginales. Les variables $X$ et $Y$ sont-elles indépendantes ? Le résultat était-il prévisible ?

    **2.** Calculer $\mathbb{P}(X = Y)$.
  corrige: |
    **1.** Distinguons selon le premier lancer. Si c'est pile, l'évènement $\{X = i, Y = j\}$ est réalisé si et seulement si les lancers commencent par $i$ piles, $j$ faces, puis un pile ; s'il commence par face, il faut $j$ faces, $i$ piles, puis une face. Par indépendance des lancers, 
    $$\mathbb{P}(X = i, Y = j) = p^{i}q^{j}p + q^{j}p^{i}q = \boxed{p^{i}q^{j}}, \qquad i, j \geqslant 1.$$
     C'est bien une loi : $\sum_{i, j \geqslant 1}p^{i}q^{j} = \frac{p}{q} \cdot \frac{q}{p} = 1$. En sommant, $\mathbb{P}(X = i) = p^{i}\frac{q}{1 - q} = q\,p^{i - 1}$ et $\mathbb{P}(Y = j) = p\,q^{j - 1}$ : 
    $$\boxed{X \sim \mathcal{G}(q), \qquad Y \sim \mathcal{G}(p)},$$
     et $\mathbb{P}(X = i, Y = j) = \mathbb{P}(X = i)\mathbb{P}(Y = j)$ : $X$ et $Y$ sont indépendantes.

    *Le résultat n'était pas évident.* Les lois marginales sont naturelles : une série de piles, une fois commencée, se prolonge à chaque lancer avec probabilité $p$, d'où $X \sim \mathcal{G}(q)$. L'indépendance l'est moins : l'ordre des deux séries dépend du premier lancer, et chacun des deux cas, pris seul, ne donne pas une masse produit ($p^{i + 1}q^{j}$ et $p^{i}q^{j + 1}$) ; c'est leur somme qui se factorise, parce que $p + q = 1$.

    **2.** $\mathbb{P}(X = Y) = \sum_{k \geqslant 1}(pq)^{k} = \boxed{\frac{pq}{1 - pq}}$, maximale pour $p = \frac{1}{2}$, où elle vaut $\frac{1}{3}$.
- id: "l3-pr-05-05"
  feuille: "f-l3-pr-05"
  numero: 5
  partie: "Lois conjointes, lois marginales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois conjointes et marginales]
  noeuds: [p-variables]
  notions: [loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 8"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soient $X$, $Y$, $Z$ trois variables indépendantes de loi uniforme sur $\llbracket 1, n\rrbracket$.

    **1.** Calculer l'espérance et la variance de $X + Y$.

    **2.** Déterminer la loi de $X + Y$, en distinguant $k \in \llbracket 2, n + 1\rrbracket$ et $k \in \llbracket n + 2, 2n\rrbracket$.

    **3.** En déduire $\mathbb{P}(X + Y = Z) = \frac{n - 1}{2n^{2}}$.
  corrige: |
    **1.** Par linéarité et par indépendance (chapitre 3, th. 4), avec $\mathbb{E}[X] = \frac{n + 1}{2}$ et $\operatorname{Var}(X) = \frac{n^{2} - 1}{12}$, 
    $$\boxed{\mathbb{E}[X + Y] = n + 1}, \qquad \boxed{\operatorname{Var}(X + Y) = \frac{n^{2} - 1}{6}}.$$

    **2.** Par la convolution discrète (cours, prop. 2), $\mathbb{P}(X + Y = k)$ vaut $\frac{1}{n^{2}}$ fois le nombre de couples $(i, k - i)$ de $\llbracket 1, n\rrbracket^{2}$, c'est-à-dire d'entiers $i$ tels que $\max(1, k - n) \leqslant i \leqslant \min(n, k - 1)$ : 
    $$\boxed{\mathbb{P}(X + Y = k) = \frac{k - 1}{n^{2}}} \ \text{si } 2 \leqslant k \leqslant n + 1, \qquad \boxed{\mathbb{P}(X + Y = k) = \frac{2n + 1 - k}{n^{2}}} \ \text{si } n + 2 \leqslant k \leqslant 2n.$$

    **3.** Par indépendance de $Z$ et du couple $(X, Y)$ (cours, prop. 3), et comme $Z \leqslant n$, 
    $$\mathbb{P}(X + Y = Z) = \sum_{k = 2}^{n}\mathbb{P}(X + Y = k)\mathbb{P}(Z = k) = \frac{1}{n^{3}}\sum_{k = 2}^{n}(k - 1) = \frac{n(n - 1)}{2n^{3}} = \boxed{\frac{n - 1}{2n^{2}}},$$
     équivalent à $\frac{1}{2n}$. La somme $X + Y$ ne tombe dans $\llbracket 1, n\rrbracket$, où vit $Z$, qu'avec probabilité $\frac{n - 1}{2n}$, et elle doit ensuite coïncider avec $Z$, ce qui coûte un facteur $\frac{1}{n}$.

    1.5em

    ![Figure](documents/figures/7db302f64e564ac1.svg)

    La loi triangulaire de $X + Y$ pour $n = 6$ (deux dés). Seules les barres foncées, $k \leqslant 6$, comptent dans $\mathbb{P}(X + Y = Z)$ ; leur masse totale est $\frac{15}{36}$, et chacune est multipliée par $\mathbb{P}(Z = k) = \frac{1}{6}$, d'où $\frac{15}{216} = \frac{5}{72}$.
