  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 15 (ESCP 2014)"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $a > 0$, et soient $X$ et $Y$ indépendantes, de même loi donnée par $\mathbb{P}(X = k) = \frac{a^{k}}{(1 + a)^{k + 1}}$ pour $k \in \mathbb{N}$.

    **1.** Vérifier que l'on définit une loi de probabilité, et la relier à une loi usuelle.

    **2.** Déterminer la loi de $Z = X + Y$, puis les espérances de $S = \frac{1}{1 + Z}$ et de $R = \frac{X}{1 + Z}$.

    **3.** Calculer $\mathbb{P}(X \geqslant n)$ pour $n \in \mathbb{N}$, puis montrer que $T = \min(X, Y)$ vérifie, pour $m \in \mathbb{N}$, 
    $$\mathbb{P}(T = m) = \frac{1 + 2a}{(1 + a)^{2}}\Big(\frac{a}{1 + a}\Big)^{2m}.$$
  corrige: |
    **1.** $\sum_{k \geqslant 0}\frac{a^{k}}{(1 + a)^{k + 1}} = \frac{1}{1 + a} \cdot \frac{1}{1 - a/(1 + a)} = 1$. Avec $r = \frac{a}{1 + a}$, $\mathbb{P}(X = k) = (1 - r)r^{k}$ : 
    $$\boxed{X + 1 \sim \mathcal{G}\big(\tfrac{1}{1 + a}\big)};$$
     c'est la loi géométrique sur $\mathbb{N}$, qui compte les échecs avant le premier succès.

    **2.** Par la convolution discrète, $\mathbb{P}(Z = n) = \sum_{k = 0}^{n}\frac{a^{k}a^{n - k}}{(1 + a)^{n + 2}} = \boxed{\frac{(n + 1)a^{n}}{(1 + a)^{n + 2}}}$. Le facteur $n + 1$ se simplifie dans $S$ : 
    $$\mathbb{E}[S] = \sum_{n \geqslant 0}\frac{a^{n}}{(1 + a)^{n + 2}} = \frac{1}{1 + a}\sum_{n \geqslant 0}\mathbb{P}(X = n) = \boxed{\frac{1}{1 + a}}.$$
     Par symétrie, $(X, Y)$ et $(Y, X)$ ont la même loi, donc $\mathbb{E}\big[\frac{X}{1 + Z}\big] = \mathbb{E}\big[\frac{Y}{1 + Z}\big]$ ; la somme vaut $\mathbb{E}\big[\frac{Z}{1 + Z}\big] = 1 - \mathbb{E}[S]$, d'où $\boxed{\mathbb{E}[R] = \frac{a}{2(1 + a)}}$.

    **3.** On a $\mathbb{P}(X \geqslant n) = (1 - r)\sum_{k \geqslant n}r^{k} = \boxed{r^{n}}$. Par indépendance, $\mathbb{P}(T \geqslant m) = r^{m} \cdot r^{m} = r^{2m}$, donc 
    $$\mathbb{P}(T = m) = r^{2m} - r^{2m + 2} = r^{2m}(1 - r^{2}) = \frac{1 + 2a}{(1 + a)^{2}}\Big(\frac{a}{1 + a}\Big)^{2m},$$
     puisque $1 - r^{2} = \frac{(1 + a)^{2} - a^{2}}{(1 + a)^{2}}$. Ainsi $T + 1$ suit la loi géométrique de paramètre $1 - r^{2}$, comme le minimum de deux variables géométriques indépendantes (feuille 3).
- id: "l3-pr-05-13"
  feuille: "f-l3-pr-05"
  numero: 13
  partie: "Covariance, corrélation"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [covariance]
  noeuds: [p-esperance]
  notions: [covariance, variance]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 1 ; Durand, exercice 2.47 (2), fin"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Soient $A$ et $B$ deux évènements, avec $\mathbb{P}(B) > 0$. Montrer que $\operatorname{Cov}(\mathbf{1}_{A}, \mathbf{1}_{B}) > 0$ si et seulement si $\mathbb{P}(A \mid B) > \mathbb{P}(A)$.

    **2.** Soient $X$ et $Y$ deux variables de Bernoulli. Montrer que $X$ et $Y$ sont indépendantes si et seulement si $\operatorname{Cov}(X, Y) = 0$. On pourra vérifier que $X$ et $Y$ sont indépendantes si et seulement si les évènements $\{X = 1\}$ et $\{Y = 1\}$ le sont.
  corrige: |
    **1.** Comme $\mathbb{E}[\mathbf{1}_{A}\mathbf{1}_{B}] = \mathbb{E}[\mathbf{1}_{A \cap B}] = \mathbb{P}(A \cap B)$, 
    $$\operatorname{Cov}(\mathbf{1}_{A}, \mathbf{1}_{B}) = \mathbb{P}(A \cap B) - \mathbb{P}(A)\mathbb{P}(B) = \mathbb{P}(B)\big[\mathbb{P}(A \mid B) - \mathbb{P}(A)\big],$$
     qui est $> 0$ si et seulement si $\boxed{\mathbb{P}(A \mid B) > \mathbb{P}(A)}$, puisque $\mathbb{P}(B) > 0$. Une covariance positive entre deux indicatrices signifie que la réalisation de $B$ rend $A$ plus probable.

    **2.** Si $X$ et $Y$ sont indépendantes, leur covariance est nulle (cours, prop. 8).

    Réciproquement, supposons $\operatorname{Cov}(X, Y) = 0$. Comme $X = \mathbf{1}_{\{X = 1\}}$ et $Y = \mathbf{1}_{\{Y = 1\}}$, la question 1 donne $\mathbb{P}(X = 1, Y = 1) = \mathbb{P}(X = 1)\mathbb{P}(Y = 1)$ : les évènements $\{X = 1\}$ et $\{Y = 1\}$ sont indépendants. Leurs complémentaires $\{X = 0\}$ et $\{Y = 0\}$ le sont alors aussi, dans toutes les combinaisons (chapitre 2, prop. 5), et les quatre égalités $\mathbb{P}(X = x, Y = y) = \mathbb{P}(X = x)\mathbb{P}(Y = y)$ montrent que $X$ et $Y$ sont indépendantes.

    *Piège.* C'est une propriété des variables à deux valeurs. Pour trois valeurs, elle tombe déjà : $X$ uniforme sur $\{-1, 0, 1\}$ et $X^{2}$ sont non corrélées sans être indépendantes (cours, section 5.6).
- id: "l3-pr-05-14"
  feuille: "f-l3-pr-05"
  numero: 14
  partie: "Covariance, corrélation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [covariance]
  noeuds: [p-esperance]
  notions: [covariance, variance]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercices 2, 9 et 26 (HEC 2009)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soient $X_{1}$ et $X_{2}$ indépendantes et de même loi, $U = X_{1} + X_{2}$ et $V = X_{1} - X_{2}$.

    **1.** Montrer que $\operatorname{Cov}(U, V) = 0$ dès que $X_{1}$ est de carré intégrable.

    **2.** On suppose $X_{1} \sim \mathcal{B}(p)$. Déterminer la loi du couple $(U, V)$. Les variables $U$ et $V$ sont-elles indépendantes ?

    **3.** On suppose $X_{1} \sim \mathcal{G}(p)$.

    **(a)** Déterminer la loi de $U$, puis la loi de $X_{1}$ sachant $U = n$ pour $n \geqslant 2$. Calculer $\mathbb{E}[X_{1} \mid U = n]$ et en déduire $\mathbb{E}[X_{1}]$.

    **(b)** Déterminer la loi de $V$ et celle de $W = \min(X_{1}, X_{2})$.

    **(c)** Les variables $U$ et $V$ sont-elles indépendantes ?
  corrige: |
    **1.** Par bilinéarité et symétrie, 
    $$\operatorname{Cov}(U, V) = \operatorname{Var}(X_{1}) - \operatorname{Cov}(X_{1}, X_{2}) + \operatorname{Cov}(X_{2}, X_{1}) - \operatorname{Var}(X_{2}) = \operatorname{Var}(X_{1}) - \operatorname{Var}(X_{2}) = \boxed{0},$$
     puisque $X_{1}$ et $X_{2}$ ont même loi. L'indépendance n'a même pas servi.

    **2.** Les quatre valeurs de $(X_{1}, X_{2})$ donnent 
    $$\boxed{\mathbb{P}(U = 0, V = 0) = q^{2}, \quad \mathbb{P}(U = 1, V = 1) = \mathbb{P}(U = 1, V = -1) = pq, \quad \mathbb{P}(U = 2, V = 0) = p^{2}}.$$
     Les variables $U$ et $V$, non corrélées, ne sont pas indépendantes : $\mathbb{P}(U = 1, V = 0) = 0$, alors que $\mathbb{P}(U = 1)\mathbb{P}(V = 0) = 2pq(p^{2} + q^{2}) > 0$.

    **3.(a)** Pour $n \geqslant 2$, $\mathbb{P}(U = n) = \sum_{k = 1}^{n - 1}pq^{k - 1}pq^{n - k - 1} = \boxed{(n - 1)p^{2}q^{n - 2}}$. Chaque terme de la somme vaut $p^{2}q^{n - 2}$, donc 
    $$\mathbb{P}(X_{1} = k \mid U = n) = \frac{p^{2}q^{n - 2}}{(n - 1)p^{2}q^{n - 2}} = \boxed{\frac{1}{n - 1}}, \qquad 1 \leqslant k \leqslant n - 1 :$$
     sachant $U = n$, $X_{1}$ est uniforme sur $\llbracket 1, n - 1\rrbracket$, et $\mathbb{E}[X_{1} \mid U = n] = \boxed{\frac{n}{2}}$.

    Par la formule des probabilités totales, $\mathbb{E}[X_{1}] = \sum_{n}\mathbb{P}(U = n)\frac{n}{2} = \frac{1}{2}\mathbb{E}[U]$. En dérivant deux fois $\sum_{m \geqslant 0}x^{m} = \frac{1}{1 - x}$, on obtient $\sum_{n \geqslant 2}n(n - 1)x^{n - 2} = \frac{2}{(1 - x)^{3}}$, donc $\mathbb{E}[U] = p^{2}\frac{2}{p^{3}} = \frac{2}{p}$, et $\boxed{\mathbb{E}[X_{1}] = \frac{1}{p}}$.

    **(b)** Pour $k \geqslant 0$, $\mathbb{P}(V = k) = \sum_{j \geqslant 1}\mathbb{P}(X_{1} = j + k)\mathbb{P}(X_{2} = j) = p^{2}q^{k}\sum_{j \geqslant 1}q^{2(j - 1)} = \frac{p^{2}q^{k}}{1 - q^{2}}$, et $V$ a une loi symétrique : 
    $$\boxed{\mathbb{P}(V = k) = \frac{p\,q^{|k|}}{1 + q}}, \qquad k \in \mathbb{Z}.$$
     Enfin $\mathbb{P}(W \geqslant m) = \mathbb{P}(X_{1} \geqslant m)^{2} = (q^{2})^{m - 1}$, donc $\boxed{W \sim \mathcal{G}(1 - q^{2})}$.

    **(c)** $\boxed{\text{Non}}$ : $\mathbb{P}(U = 2, V = 1) = 0$ (si $U = 2$, $X_{1} = X_{2} = 1$), alors que $\mathbb{P}(U = 2)\mathbb{P}(V = 1) > 0$. Comme à la question 2, la non-corrélation n'entraîne pas l'indépendance.
- id: "l3-pr-05-15"
