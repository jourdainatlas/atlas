  page_corrige: 12
  enonce: |
    Chacune de $n$ personnes choisit, indépendamment des autres, l'un de $r \geqslant 2$ hôtels $H_{1}, \dots, H_{r}$ ; l'hôtel $H_{i}$ est choisi avec probabilité $p_{i} > 0$, où $p_{1} + \dots + p_{r} = 1$. On note $X_{i}$ le nombre de personnes qui choisissent $H_{i}$.

    **1.** Déterminer la loi de $X_{i}$, puis celle de $\sum_{i \in J}X_{i}$ pour une partie $J$ de $\llbracket 1, r\rrbracket$.

    **2.** Montrer que la loi du vecteur $(X_{1}, \dots, X_{r})$ est donnée, pour des entiers $k_{i} \geqslant 0$ de somme $n$, par 
    $$\mathbb{P}(X_{1} = k_{1}, \dots, X_{r} = k_{r}) = \frac{n!}{k_{1}!\cdots k_{r}!}\,p_{1}^{k_{1}}\cdots p_{r}^{k_{r}}$$
     (loi *multinomiale*).

    **3.** Calculer $\operatorname{Var}(X_{1} + X_{2})$ et en déduire $\operatorname{Cov}(X_{1}, X_{2})$ ; retrouver ce résultat en écrivant $X_{1}$ et $X_{2}$ comme sommes d'indicatrices.

    **4.** On suppose les hôtels équiprobables. Calculer $\rho(X_{1}, X_{2})$. Que se passe-t-il pour $r = 2$ ? Expliquer.

    **5.** Événements rares. On fixe $r = 3$ et l'on suppose que $p_{1} = p_{n, 1}$ et $p_{2} = p_{n, 2}$ dépendent de $n$, avec $np_{n, 1} \to \lambda_{1} > 0$ et $np_{n, 2} \to \lambda_{2} > 0$. Montrer que, pour tous $k, l \in \mathbb{N}$, $\mathbb{P}(X_{1} = k, X_{2} = l)$ tend vers $\mathrm{e}^{-\lambda_{1}}\frac{\lambda_{1}^{k}}{k!}\,\mathrm{e}^{-\lambda_{2}}\frac{\lambda_{2}^{l}}{l!}$. Pourquoi faut-il une troisième catégorie ?
  corrige: |
    **1.** $X_{i}$ est la somme des $n$ indicatrices indépendantes « la personne $m$ choisit $H_{i}$ », de paramètre $p_{i}$ : $\boxed{X_{i} \sim \mathcal{B}(n, p_{i})}$. De même, la personne $m$ choisit un hôtel de $J$ avec probabilité $\sum_{i \in J}p_{i}$, donc $\boxed{\sum_{i \in J}X_{i} \sim \mathcal{B}\Big(n, \sum_{i \in J}p_{i}\Big)}$.

    **2.** Une suite de choix $(h_{1}, \dots, h_{n})$ comportant $k_{i}$ fois l'hôtel $H_{i}$ a pour probabilité $p_{1}^{k_{1}}\cdots p_{r}^{k_{r}}$, par indépendance ; il y a $\frac{n!}{k_{1}!\cdots k_{r}!}$ telles suites (anagrammes d'un mot). D'où la loi multinomiale annoncée.

    **3.** Par la question 1, $\operatorname{Var}(X_{1} + X_{2}) = n(p_{1} + p_{2})(1 - p_{1} - p_{2})$. En retranchant $\operatorname{Var}(X_{1}) + \operatorname{Var}(X_{2})$, qui vaut $np_{1}(1 - p_{1}) + np_{2}(1 - p_{2})$, il reste $-2np_{1}p_{2}$, donc 
    $$\boxed{\operatorname{Cov}(X_{1}, X_{2}) = -np_{1}p_{2}}.$$

    Par les indicatrices, la personne $m$ contribue $\operatorname{Cov}(\mathbf{1}_{A_{m}}, \mathbf{1}_{B_{m}}) = 0 - p_{1}p_{2}$, car elle ne peut choisir les deux hôtels, et deux personnes différentes sont indépendantes.

    **4.** Avec $p_{i} = \frac{1}{r}$, $\operatorname{Cov}(X_{1}, X_{2}) = -\frac{n}{r^{2}}$ et $\operatorname{Var}(X_{i}) = \frac{n(r - 1)}{r^{2}}$, donc $\boxed{\rho(X_{1}, X_{2}) = -\frac{1}{r - 1}}$, qui ne dépend pas de $n$.

    Pour $r = 2$, $\rho = -1$ : en effet $X_{2} = n - X_{1}$, relation affine de pente négative (cours, prop. 6). Quand $r$ est grand, la contrainte $X_{1} + \dots + X_{r} = n$ se répartit entre beaucoup d'hôtels, et deux d'entre eux sont presque non corrélés.

    **5.** Pour $k, l$ fixés et $n \geqslant k + l$, 
    $$\mathbb{P}(X_{1} = k, X_{2} = l) = \frac{n(n - 1)\cdots(n - k - l + 1)}{n^{k + l}} \cdot \frac{(np_{n, 1})^{k}}{k!} \cdot \frac{(np_{n, 2})^{l}}{l!} \cdot (1 - p_{n, 1} - p_{n, 2})^{n - k - l}.$$
     Le premier facteur tend vers $1$, les deux suivants vers $\frac{\lambda_{1}^{k}}{k!}$ et $\frac{\lambda_{2}^{l}}{l!}$, et le dernier vers $\mathrm{e}^{-(\lambda_{1} + \lambda_{2})}$, car $n\ln(1 - p_{n, 1} - p_{n, 2}) \sim -n(p_{n, 1} + p_{n, 2}) \to -(\lambda_{1} + \lambda_{2})$. La limite est le produit de deux lois de Poisson : les effectifs rares deviennent des Poisson indépendantes, alors que $\operatorname{Cov}(X_{1}, X_{2}) = -np_{n, 1}p_{n, 2} \to 0$.

    La troisième catégorie est indispensable : les effectifs ont pour somme $n$, et leurs espérances aussi ; elles ne peuvent donc pas toutes rester bornées. C'est elle qui absorbe presque toutes les personnes.
- id: "l3-pr-05-20"
  feuille: "f-l3-pr-05"
  numero: 20
  partie: "Covariance, corrélation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [covariance]
  noeuds: [p-esperance]
  notions: [covariance, variance]
  source: "Durand, exercices 2.8 et 2.39"
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Une population de $N \geqslant 2$ individus est partagée en $r \geqslant 2$ classes $C_{1}, \dots, C_{r}$ d'effectifs $n_{1}, \dots, n_{r}$. On choisit au hasard $k \in \llbracket 1, N\rrbracket$ individus distincts, et l'on note $X_{N, i}$ le nombre d'individus choisis dans la classe $C_{i}$.

    **1.** Déterminer la loi du vecteur $(X_{N, 1}, \dots, X_{N, r})$, puis ses lois marginales.

    **2.** Déterminer la loi de $X_{N, 1} + X_{N, 2}$. En déduire $\operatorname{Cov}(X_{N, 1}, X_{N, 2})$, à l'aide de la variance de la loi hypergéométrique (cours, section 5.4). Les variables $X_{N, 1}$ et $X_{N, 2}$ sont-elles indépendantes ?

    **3.** On fixe $k$, et l'on fait tendre $N$ vers $+\infty$ de sorte que $\frac{n_{i}}{N}$ tende vers $p_{i} > 0$ pour chaque $i$. Montrer que la loi de $X_{N, 1}$ converge vers $\mathcal{B}(k, p_{1})$, et celle du vecteur vers la loi multinomiale de l'exercice 19. Interpréter.
  corrige: |
    **1.** Les $\binom{N}{k}$ parties de $k$ individus sont équiprobables, et une partie qui contient $a_{i}$ individus de chaque classe $C_{i}$ se choisit de $\prod_{i}\binom{n_{i}}{a_{i}}$ façons : 
    $$\boxed{\mathbb{P}(X_{N, 1} = a_{1}, \dots, X_{N, r} = a_{r}) = \frac{\prod_{i}\binom{n_{i}}{a_{i}}}{\binom{N}{k}}}, \qquad a_{1} + \dots + a_{r} = k.$$
     En regroupant les classes autres que $C_{i}$ en une seule, d'effectif $N - n_{i}$, on obtient la marginale 
    $$\boxed{\mathbb{P}(X_{N, i} = a) = \binom{n_{i}}{a}\binom{N - n_{i}}{k - a}\Big/\binom{N}{k}},$$
     loi hypergéométrique.

    **2.** De même, $X_{N, 1} + X_{N, 2}$ suit la loi hypergéométrique de la classe $C_{1} \cup C_{2}$, d'effectif $n_{1} + n_{2}$. La variance d'une loi hypergéométrique pour une classe d'effectif $m$ est $V(m) = k\frac{m}{N}\big(1 - \frac{m}{N}\big)\frac{N - k}{N - 1}$ (cours, section 5.4), et 
    $$\operatorname{Cov}(X_{N, 1}, X_{N, 2}) = \frac{V(n_{1} + n_{2}) - V(n_{1}) - V(n_{2})}{2} = \boxed{-\frac{k(N - k)}{N - 1} \cdot \frac{n_{1}n_{2}}{N^{2}}}.$$
     Si $0 < k < N$ et si les deux classes sont non vides, la covariance est strictement négative, et les variables ne sont pas indépendantes ; dans les cas dégénérés ($k = N$, ou une classe vide), l'une des variables est constante.

    **3.** Pour $a$ fixé et $n \to +\infty$, $\binom{n}{a} = \frac{n(n - 1)\cdots(n - a + 1)}{a!} \sim \frac{n^{a}}{a!}$. Comme $n_{1} \sim p_{1}N$ et $N - n_{1} \sim (1 - p_{1})N$ tendent vers $+\infty$, 
    $$\mathbb{P}(X_{N, 1} = a) \sim \frac{(p_{1}N)^{a}}{a!} \cdot \frac{((1 - p_{1})N)^{k - a}}{(k - a)!} \cdot \frac{k!}{N^{k}} = \binom{k}{a}p_{1}^{a}(1 - p_{1})^{k - a} :$$
     la loi de $X_{N, 1}$ converge vers $\boxed{\mathcal{B}(k, p_{1})}$. Le même calcul sur le produit $\prod_{i}\binom{n_{i}}{a_{i}}$ donne la limite $\frac{k!}{a_{1}!\cdots a_{r}!}p_{1}^{a_{1}}\cdots p_{r}^{a_{r}}$ : la loi multinomiale de l'exercice 19.

    *Interprétation.* Interroger $k$ personnes distinctes dans une population immense revient presque à tirer avec remise : on ne risque guère de retomber sur la même personne. C'est ce qui justifie le modèle binomial des sondages (chapitre 9), et la covariance de la question 2 tend d'ailleurs vers $-kp_{1}p_{2}$, celle de l'exercice 19.
- id: "l3-pr-05-21"
  feuille: "f-l3-pr-05"
  numero: 21
  partie: "Synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: []
  noeuds: [p-esperance, p-independance]
  notions: [covariance]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 32 (QSP HEC 2023)"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    **1.** Soient $X_{1}$, $X_{2}$, $Y$ des variables indépendantes ; $X_{1}$ et $X_{2}$ ont même loi, $Y$ prend les valeurs $\pm 1$ et $\mathbb{P}(Y = 1) = p \in \,]0, 1[$. On pose $M = \begin{pmatrix} X_{1} & X_{2} \\ Y X_{2} & X_{1}\end{pmatrix}$.

    **(a)** On suppose que $X_{1} + 1 \sim \mathcal{G}(\frac{1}{3})$. Calculer la probabilité que $M$ soit inversible.

    **(b)** On suppose que $X_{1} \sim \mathcal{P}(\lambda)$. Calculer la probabilité que $M$ soit diagonalisable dans $\mathcal{M}_{2}(\mathbb{R})$, puis dans $\mathcal{M}_{2}(\mathbb{C})$.

    **2.** Soient $A$, $B$, $C$ trois variables indépendantes de loi $\mathcal{B}(n, p)$, et $M$ la matrice de $\mathcal{M}_{3}(\mathbb{R})$ dont les trois lignes sont égales à $(A, B, C)$. Déterminer la loi de $\operatorname{rg}(M)$ et celle de $\operatorname{tr}(M)$. Exprimer $M^{2}$ à l'aide de $M$, puis calculer la probabilité que $M$ soit une matrice de projection, et celle que $M$ soit nilpotente.
  corrige: |
    **1.(a)** $\det M = X_{1}^{2} - YX_{2}^{2}$. Ici $X_{1}$ et $X_{2}$ prennent leurs valeurs dans $\mathbb{N}$, avec $\mathbb{P}(X_{1} = k) = \frac{1}{3}\big(\frac{2}{3}\big)^{k}$.

    Sur $\{Y = 1\}$, $M$ est non inversible si et seulement si $X_{1} = X_{2}$, de probabilité $\sum_{k}\frac{1}{9}\big(\frac{4}{9}\big)^{k} = \frac{1}{5}$.

    Sur $\{Y = -1\}$, il faut $X_{1}^{2} + X_{2}^{2} = 0$, soit $X_{1} = X_{2} = 0$, de probabilité $\frac{1}{9}$. Par indépendance de $Y$ et de $(X_{1}, X_{2})$, 
    $$\mathbb{P}(M \text{ inversible}) = 1 - \frac{p}{5} - \frac{1 - p}{9} = \boxed{\frac{4(10 - p)}{45}}.$$

    **(b)** Le polynôme caractéristique est $(t - X_{1})^{2} - YX_{2}^{2}$.

    Si $X_{2} = 0$, $M = X_{1}I_{2}$ est diagonale.

    Si $X_{2} \neq 0$ et $Y = 1$, les valeurs propres $X_{1} \pm X_{2}$ sont réelles et distinctes : $M$ est diagonalisable dans $\mathcal{M}_{2}(\mathbb{R})$.

    Si $X_{2} \neq 0$ et $Y = -1$, le polynôme n'a pas de racine réelle : $M$ n'est pas diagonalisable dans $\mathcal{M}_{2}(\mathbb{R})$, mais ses valeurs propres $X_{1} \pm \mathrm{i}X_{2}$ sont distinctes, et elle l'est dans $\mathcal{M}_{2}(\mathbb{C})$. Donc 
    $$\mathbb{P}(M \text{ diagonalisable dans } \mathcal{M}_{2}(\mathbb{R})) = \boxed{p + (1 - p)\mathrm{e}^{-\lambda}}, \qquad \mathbb{P}(M \text{ diagonalisable dans } \mathcal{M}_{2}(\mathbb{C})) = \boxed{1}.$$

    **2.** Toutes les lignes de $M$ sont égales à $v = (A, B, C)$ : $M = u\,v$ où $u$ est la colonne dont les trois coefficients valent $1$. Donc $\operatorname{rg}(M) = 0$ si $A = B = C = 0$, et $1$ sinon : 
    $$\boxed{\mathbb{P}(\operatorname{rg}M = 0) = q^{3n}, \qquad \mathbb{P}(\operatorname{rg}M = 1) = 1 - q^{3n}}.$$
     La trace $A + B + C$ est une somme de $3n$ variables de Bernoulli indépendantes : $\boxed{\operatorname{tr}M \sim \mathcal{B}(3n, p)}$.

    Puis $M^{2} = u(vu)v = (A + B + C)\,uv$, soit $\boxed{M^{2} = \operatorname{tr}(M)\,M}$, et par récurrence $M^{k} = \operatorname{tr}(M)^{k - 1}M$.

    $M$ est une projection si et seulement si $M^{2} = M$, c'est-à-dire $(\operatorname{tr}M - 1)M = 0$ : $M = 0$ ou $\operatorname{tr}M = 1$. Ces deux évènements sont disjoints, d'où 
    $$\mathbb{P}(M \text{ projection}) = q^{3n} + 3npq^{3n - 1} = \boxed{q^{3n - 1}(q + 3np)}.$$
     $M$ est nilpotente si et seulement si $\operatorname{tr}M = 0$ ou $M = 0$ ; comme les coefficients sont positifs, $\operatorname{tr}M = 0$ force $M = 0$, et $\boxed{\mathbb{P}(M \text{ nilpotente}) = q^{3n}}$ : la seule matrice nilpotente de cette forme est la matrice nulle.
- id: "l3-pr-05-22"
  feuille: "f-l3-pr-05"
  numero: 22
  partie: "Synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: []
  noeuds: [p-esperance, p-independance]
  notions: [covariance]
  source: "Université de Bordeaux, L3 2015-2016, devoir maison 2, problème I"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Pour deux lois $\mu$ et $\nu$ sur $\mathbb{N}$, on appelle *distance en variation totale* le nombre 
    $$\|\mu - \nu\| = \sup_{A \subset \mathbb{N}}|\mu(A) - \nu(A)|.$$

    **1.** Montrer que $\|\mu - \nu\| = \frac{1}{2}\sum_{k \in \mathbb{N}}|\mu(\{k\}) - \nu(\{k\})|$ ; on pourra considérer $A_{0} = \{k : \mu(\{k\}) > \nu(\{k\})\}$.

    **2.** Soit $(X, Y)$ un couple de variables à valeurs dans $\mathbb{N}$, de lois marginales $\mu$ et $\nu$, non nécessairement indépendantes ; on dit que $(X, Y)$ est un *couplage* de $\mu$ et $\nu$. Montrer que, pour toute partie $A$ de $\mathbb{N}$, 
    $$|\mu(A) - \nu(A)| = |\mathbb{P}(X \in A,\ X \neq Y) - \mathbb{P}(Y \in A,\ X \neq Y)|,$$
     et en déduire que $\|\mu - \nu\| \leqslant \mathbb{P}(X \neq Y)$.

    **3.** Soit $\lambda \in \,]0, 1[$. On définit la loi d'un couple $(X, Y)$ à valeurs dans $\mathbb{N} \times \{0, 1\}$ par 
    $$\mathbb{P}(X = 0, Y = 0) = 1 - \lambda, \qquad \mathbb{P}(X = 0, Y = 1) = \mathrm{e}^{-\lambda} - (1 - \lambda),$$
     et, pour $k \geqslant 1$, $\mathbb{P}(X = k, Y = 0) = 0$ et $\mathbb{P}(X = k, Y = 1) = \mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!}$. Vérifier que l'on obtient une loi de probabilité, de marginales $\mathcal{P}(\lambda)$ et $\mathcal{B}(\lambda)$, puis montrer que 
    $$\|\mathcal{P}(\lambda) - \mathcal{B}(\lambda)\| \leqslant \lambda(1 - \mathrm{e}^{-\lambda}) \leqslant \lambda^{2}.$$

    **4.** Soient $p \in \,]0, 1[$, $n \in \mathbb{N}^{*}$ et $\lambda = np$. Soient $(X_{1}, Y_{1}), \dots, (X_{n}, Y_{n})$ des couples indépendants, chacun de la loi de la question 3 avec le paramètre $p$, et $X = X_{1} + \dots + X_{n}$, $Y = Y_{1} + \dots + Y_{n}$. Donner les lois de $X$ et de $Y$, puis montrer que 
    $$\|\mathcal{P}(\lambda) - \mathcal{B}(n, p)\| \leqslant \sum_{i = 1}^{n}\mathbb{P}(X_{i} \neq Y_{i}) \leqslant \frac{\lambda^{2}}{n}.$$
     Comparer avec l'approximation de la loi binomiale par la loi de Poisson vue au chapitre 3.
  corrige: |
    Notons $\mu_{k} = \mu(\{k\})$ et $\nu_{k} = \nu(\{k\})$.

    **1.** Soit $A \subset \mathbb{N}$. En retirant de $A$ les points de $A_{0}^{c}$, où $\mu_{k} - \nu_{k} \leqslant 0$, puis en ajoutant ceux de $A_{0} \setminus A$, où $\mu_{k} - \nu_{k} > 0$, on augmente $\mu(A) - \nu(A)$ : $\mu(A) - \nu(A) \leqslant \mu(A_{0}) - \nu(A_{0})$. De même $\nu(A) - \mu(A) \leqslant \nu(A_{0}^{c}) - \mu(A_{0}^{c})$.

    Or $\mu(A_{0}) + \mu(A_{0}^{c}) = 1 = \nu(A_{0}) + \nu(A_{0}^{c})$, donc les deux majorants sont égaux, et leur somme vaut $\sum_{k}|\mu_{k} - \nu_{k}|$. Ainsi 
    $$\boxed{\|\mu - \nu\| = \mu(A_{0}) - \nu(A_{0}) = \frac{1}{2}\sum_{k \in \mathbb{N}}|\mu_{k} - \nu_{k}|},$$
     et le supremum est atteint en $A_{0}$.

    **2.** On a $\mu(A) = \mathbb{P}(X \in A,\ X = Y) + \mathbb{P}(X \in A,\ X \neq Y)$, et de même pour $\nu$ avec $Y$. Sur $\{X = Y\}$, les évènements $\{X \in A\}$ et $\{Y \in A\}$ coïncident ; les premiers termes s'éliminent dans la différence, d'où l'égalité annoncée.

    Les deux probabilités restantes sont comprises entre $0$ et $\mathbb{P}(X \neq Y)$, donc leur différence est majorée en valeur absolue par $\mathbb{P}(X \neq Y)$, et en passant au supremum sur $A$, $\boxed{\|\mu - \nu\| \leqslant \mathbb{P}(X \neq Y)}$, *pour tout couplage*. Pour majorer une distance entre deux lois, il suffit de construire deux variables de ces lois qui coïncident le plus souvent possible.

    **3.** Les masses sont positives, car $\mathrm{e}^{-\lambda} \geqslant 1 - \lambda$ (convexité de l'exponentielle). Leur somme vaut $1 - \lambda + \mathrm{e}^{-\lambda} - 1 + \lambda + (1 - \mathrm{e}^{-\lambda}) = 1$.

    La marginale de $X$ : $\mathbb{P}(X = 0) = 1 - \lambda + \mathrm{e}^{-\lambda} - (1 - \lambda) = \mathrm{e}^{-\lambda}$, et $\mathbb{P}(X = k) = \mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!}$ pour $k \geqslant 1$ : $X \sim \mathcal{P}(\lambda)$. Celle de $Y$ : $\mathbb{P}(Y = 0) = 1 - \lambda$, donc $Y \sim \mathcal{B}(\lambda)$.

    L'évènement $\{X \neq Y\}$ est la réunion disjointe de $\{X = 0, Y = 1\}$ et de $\{X \geqslant 2\}$ (car $X \geqslant 1$ impose $Y = 1$), donc 
    $$\mathbb{P}(X \neq Y) = \mathrm{e}^{-\lambda} - 1 + \lambda + 1 - \mathrm{e}^{-\lambda} - \lambda\mathrm{e}^{-\lambda} = \lambda(1 - \mathrm{e}^{-\lambda}) \leqslant \lambda \cdot \lambda,$$
     puisque $1 - \mathrm{e}^{-\lambda} \leqslant \lambda$. Avec la question 2, $\boxed{\|\mathcal{P}(\lambda) - \mathcal{B}(\lambda)\| \leqslant \lambda(1 - \mathrm{e}^{-\lambda}) \leqslant \lambda^{2}}$.

    *Ce couplage est optimal.* Par la question 1, la distance est la demi-somme des trois termes $|\mathrm{e}^{-\lambda} - (1 - \lambda)| = \mathrm{e}^{-\lambda} - 1 + \lambda$ (en $0$), $|\lambda\mathrm{e}^{-\lambda} - \lambda| = \lambda(1 - \mathrm{e}^{-\lambda})$ (en $1$) et $1 - \mathrm{e}^{-\lambda} - \lambda\mathrm{e}^{-\lambda}$ (masse de $\mathcal{P}(\lambda)$ sur $\{k \geqslant 2\}$). Le total vaut $2\lambda(1 - \mathrm{e}^{-\lambda})$, donc $\|\mathcal{P}(\lambda) - \mathcal{B}(\lambda)\| = \lambda(1 - \mathrm{e}^{-\lambda})$ exactement : le couplage fait coïncider $X$ et $Y$ autant que les deux lois le permettent.

    **4.** Les $X_{i}$ sont indépendantes de loi $\mathcal{P}(p)$, donc $X \sim \mathcal{P}(np) = \mathcal{P}(\lambda)$ (cours, prop. 2 et exemple qui suit) ; les $Y_{i}$ sont indépendantes de loi $\mathcal{B}(p)$, donc $Y \sim \mathcal{B}(n, p)$. Le couple $(X, Y)$ est donc un couplage de $\mathcal{P}(\lambda)$ et $\mathcal{B}(n, p)$.

    Si $X \neq Y$, l'un au moins des $X_{i}$ diffère de $Y_{i}$ : $\{X \neq Y\} \subset \bigcup_{i}\{X_{i} \neq Y_{i}\}$. Par la question 2, puis la question 3 appliquée avec le paramètre $p$, 
    $$\|\mathcal{P}(\lambda) - \mathcal{B}(n, p)\| \leqslant \mathbb{P}(X \neq Y) \leqslant \sum_{i = 1}^{n}\mathbb{P}(X_{i} \neq Y_{i}) \leqslant np^{2} = \boxed{\frac{\lambda^{2}}{n}}.$$

    1.5em

    ![Figure](documents/figures/e7462d483e0988dd.svg)

    Les lois $\mathcal{B}(10\,;\,0{,}1)$ et $\mathcal{P}(1)$ : leur distance en variation totale, calculée par la question 1, vaut $0{,}0293$, sous la borne $np(1 - \mathrm{e}^{-p}) \approx 0{,}0952$ du couplage et sous $\frac{\lambda^{2}}{n} = 0{,}1$.

    *Comparaison avec le chapitre 3.* La prop. 6 du chapitre 3 affirme seulement que $\mathbb{P}(S_{n} = k) \to \mathrm{e}^{-\lambda}\frac{\lambda^{k}}{k!}$ pour chaque $k$, quand $p = \frac{\lambda}{n}$. La borne obtenue ici est quantitative ($\frac{\lambda^{2}}{n}$ explicite), uniforme en l'évènement $A$, et valable pour tout $n$ et tout $p$ : elle dit que l'approximation est bonne dès que $np^{2}$ est petit, même si $n$ n'est pas grand.

