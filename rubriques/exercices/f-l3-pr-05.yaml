  notions: [independance, probabilite-conditionnelle]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 16 (HEC 2014)"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soient $X_{1} \sim \mathcal{B}(n_{1}, p)$ et $X_{2} \sim \mathcal{B}(n_{2}, p)$ indépendantes. Pour $m \in \llbracket 0, n_{1} + n_{2}\rrbracket$, déterminer la loi de $X_{1}$ sachant $X_{1} + X_{2} = m$, et calculer l'espérance de cette loi. Cette loi dépend-elle de $p$ ? Interpréter.
  corrige: |
    La somme $X_{1} + X_{2}$ suit $\mathcal{B}(n_{1} + n_{2}, p)$ (somme de $n_{1} + n_{2}$ variables de Bernoulli indépendantes). Pour $0 \leqslant k \leqslant m$, par indépendance, 
    $$\mathbb{P}(X_{1} = k \mid X_{1} + X_{2} = m) = \frac{\mathbb{P}(X_{1} = k)\mathbb{P}(X_{2} = m - k)}{\mathbb{P}(X_{1} + X_{2} = m)},$$
     soit 
    $$\mathbb{P}(X_{1} = k \mid X_{1} + X_{2} = m) = \frac{\binom{n_{1}}{k}p^{k}q^{n_{1} - k}\binom{n_{2}}{m - k}p^{m - k}q^{n_{2} - m + k}}{\binom{n_{1} + n_{2}}{m}p^{m}q^{n_{1} + n_{2} - m}} = \boxed{\frac{\binom{n_{1}}{k}\binom{n_{2}}{m - k}}{\binom{n_{1} + n_{2}}{m}}}.$$
     C'est la loi hypergéométrique : celle du nombre de boules blanches parmi $m$ boules tirées sans remise dans une urne de $n_{1}$ blanches et $n_{2}$ noires. Son espérance est $\boxed{\frac{m\,n_{1}}{n_{1} + n_{2}}}$ (cours, section 5.4).

    Elle $\boxed{\text{ne dépend pas de } p}$. *Interprétation.* Sachant que $m$ succès ont eu lieu parmi les $n_{1} + n_{2}$ épreuves, toutes les positions possibles de ces succès sont équiprobables, puisque chaque suite de résultats comportant $m$ succès a la même probabilité $p^{m}q^{n_{1} + n_{2} - m}$. Le nombre de succès tombés dans le premier groupe est donc celui d'un tirage sans remise de $m$ positions parmi $n_{1} + n_{2}$.
