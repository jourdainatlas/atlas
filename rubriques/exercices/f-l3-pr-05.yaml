  enonce: |
    Soit $(X_{k})_{k \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{B}(p)$. On pose $Y_{k} = X_{k}X_{k + 1}$, $S_{n} = X_{1} + \dots + X_{n}$ et $V_{n} = Y_{1} + \dots + Y_{n}$.

    **1.** Déterminer la loi de $Y_{k}$, puis l'espérance et la variance de $S_{n}$, et l'espérance de $V_{n}$.

    **2.** Calculer $\operatorname{Cov}(Y_{i}, Y_{i + 1})$, puis $\operatorname{Cov}(Y_{i}, Y_{j})$ pour $j \geqslant i + 2$.

    **3.** En déduire $\operatorname{Var}(V_{n})$. Que vaut $\lim_{n}\frac{1}{n}\operatorname{Var}(V_{n})$ ?
  corrige: |
    **1.** $Y_{k}$ vaut $0$ ou $1$, et $\mathbb{P}(Y_{k} = 1) = \mathbb{P}(X_{k} = 1)\mathbb{P}(X_{k + 1} = 1) = p^{2}$ : $\boxed{Y_{k} \sim \mathcal{B}(p^{2})}$. Puis $\boxed{\mathbb{E}[S_{n}] = np}$, $\boxed{\operatorname{Var}(S_{n}) = npq}$, et $\boxed{\mathbb{E}[V_{n}] = np^{2}}$.

    **2.** $Y_{i}Y_{i + 1} = X_{i}X_{i + 1}X_{i + 2}$, donc $\operatorname{Cov}(Y_{i}, Y_{i + 1}) = p^{3} - p^{4} = \boxed{p^{3}q}$. Si $j \geqslant i + 2$, $Y_{i}$ et $Y_{j}$ sont fonctions des paquets disjoints $(X_{i}, X_{i + 1})$ et $(X_{j}, X_{j + 1})$, donc indépendantes (cours, prop. 3) : $\boxed{\operatorname{Cov}(Y_{i}, Y_{j}) = 0}$.

    **3.** Dans la formule de la variance d'une somme, il reste les $n$ variances et les $n - 1$ paires de voisins : 
    $$\boxed{\operatorname{Var}(V_{n}) = np^{2}(1 - p^{2}) + 2(n - 1)p^{3}q}, \qquad \frac{1}{n}\operatorname{Var}(V_{n}) \longrightarrow p^{2}(1 - p^{2}) + 2p^{3}q = \boxed{p^{2}q(1 + 3p)}.$$
     Les $Y_{k}$ ne sont pas indépendantes, mais la dépendance est à courte portée : la variance reste proportionnelle à $n$, avec une constante plus grande que dans le cas indépendant ($p^{2}(1 - p^{2})$), car deux voisins sont positivement corrélés. Cela suffit pour une loi des grands nombres (chapitre 9).
