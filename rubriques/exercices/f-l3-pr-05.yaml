  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $n \geqslant 3$. Une urne contient $n - 2$ boules noires et $2$ boules blanches ; on la vide en tirant les boules une à une sans remise. On note $X$ le rang de la première boule blanche et $Y$ celui de la seconde.

    **1.** Montrer que $\mathbb{P}(X = i, Y = j) = \frac{2}{n(n - 1)}$ si $1 \leqslant i < j \leqslant n$, et $0$ sinon.

    **2.** En déduire les lois de $X$ et de $Y$, ainsi que leurs espérances.

    **3.** Calculer $\operatorname{Var}(X)$, $\operatorname{Var}(Y)$ et $\mathbb{E}[XY]$, puis le coefficient de corrélation de $X$ et $Y$.
  corrige: |
    **1.** Toutes les dispositions des $n$ boules sont équiprobables, et l'ensemble $\{X, Y\}$ des rangs des deux blanches est une partie uniforme à deux éléments de $\llbracket 1, n\rrbracket$. Il y a $\binom{n}{2}$ telles parties, et $X < Y$ ; donc $\mathbb{P}(X = i, Y = j) = \frac{1}{\binom{n}{2}} = \frac{2}{n(n - 1)}$ si $i < j$, et $0$ sinon.

    **2.** En sommant, il y a $n - i$ valeurs de $j > i$ et $j - 1$ valeurs de $i < j$ : 
    $$\boxed{\mathbb{P}(X = i) = \frac{2(n - i)}{n(n - 1)}}, \qquad \boxed{\mathbb{P}(Y = j) = \frac{2(j - 1)}{n(n - 1)}},$$
     et le calcul des sommes donne $\boxed{\mathbb{E}[X] = \frac{n + 1}{3}}$, $\boxed{\mathbb{E}[Y] = \frac{2(n + 1)}{3}}$. Les deux blanches partagent l'urne en trois paquets de noires, de même taille moyenne $\frac{n - 2}{3}$.

    **3.** On calcule de même $\mathbb{E}[X^{2}] = \frac{n(n + 1)}{6}$. Pour $Y$, inutile de recommencer : $n + 1 - Y$ a la loi de $X$ (on lit l'urne à l'envers), donc $\operatorname{Var}(Y) = \operatorname{Var}(X)$, et 
    $$\boxed{\operatorname{Var}(X) = \operatorname{Var}(Y) = \frac{n(n + 1)}{6} - \frac{(n + 1)^{2}}{9} = \frac{(n + 1)(n - 2)}{18}}.$$
     Pour $\mathbb{E}[XY]$, on somme $\sum_{j}j\sum_{i < j}i = \sum_{j}\frac{j^{2}(j - 1)}{2}$, d'où $\boxed{\mathbb{E}[XY] = \frac{(n + 1)(3n + 2)}{12}}$, puis 
    $$\operatorname{Cov}(X, Y) = \frac{(n + 1)(3n + 2)}{12} - \frac{2(n + 1)^{2}}{9} = \frac{(n + 1)(n - 2)}{36}, \qquad \boxed{\rho(X, Y) = \frac{1}{2}},$$
     quel que soit $n \geqslant 3$. Pour $n = 3$, les couples $(1, 2)$, $(1, 3)$, $(2, 3)$ donnent bien $\mathbb{E}[XY] = \frac{2 + 3 + 6}{3} = \frac{11}{3}$.

    1.5em

    ![Figure](documents/figures/f7ffce5bd723a32b.svg)

    Le support de $(X, Y)$ pour $n = 7$ : les $21$ points $i < j$, équiprobables. Le nuage est « tiré » vers le haut quand $i$ augmente, d'où la corrélation positive ; la droite de régression de $Y$ en $X$ (cours, prop. 7), en orange, a pour pente $\rho\,\frac{\sigma_{Y}}{\sigma_{X}} = \frac{1}{2}$ et passe par le point moyen $(\frac{8}{3}, \frac{16}{3})$, en rouge : c'est la droite $j = 4 + \frac{i}{2}$.
