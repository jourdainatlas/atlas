  notions: [independance, probabilite-conditionnelle]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 31 (ESCP 2021)"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Une urne contient une boule blanche, une noire et une rouge. On effectue des tirages avec remise ; on note $X$ le rang du premier tirage d'une boule blanche, $Y$ celui de la première boule noire, et l'on pose $U = |X - Y|$ et $W = \min(X, Y)$.

    **1.** Déterminer la loi de $X$ et celle de $W$, avec leurs espérances et variances.

    **2.** Montrer que, pour tout $k \in \mathbb{N}^{*}$, la loi de $U$ sachant $W = k$ est la loi $\mathcal{G}(\frac{1}{3})$. Qu'en déduit-on sur la loi de $U$ et sur le couple $(U, W)$ ?

    **3.** Que représente $U + W$ ? En déduire une relation linéaire entre $U$, $W$, $X$ et $Y$.

    **4.** En déduire $\operatorname{Cov}(X, Y)$, et expliquer le signe obtenu.
  corrige: |
    **1.** Chaque tirage donne une blanche avec probabilité $\frac{1}{3}$, indépendamment : $\boxed{X \sim \mathcal{G}(\frac{1}{3})}$, $\mathbb{E}[X] = 3$, $\operatorname{Var}(X) = \frac{2/3}{1/9} = 6$. De même $W$ est le rang du premier tirage d'une boule blanche ou noire, de probabilité $\frac{2}{3}$ : $\boxed{W \sim \mathcal{G}(\frac{2}{3})}$, $\mathbb{E}[W] = \frac{3}{2}$, $\operatorname{Var}(W) = \frac{1/3}{4/9} = \frac{3}{4}$.

    **2.** Sachant $W = k$, le $k$-ième tirage a donné l'une des deux couleurs, et $U$ est le nombre de tirages supplémentaires nécessaires pour obtenir l'autre ; les tirages après le $k$-ième sont indépendants des $k$ premiers, et chacun donne la couleur attendue avec probabilité $\frac{1}{3}$. Précisément, pour $m \geqslant 1$, 
    $$\mathbb{P}(W = k, U = m) = 2 \cdot \Big(\frac{1}{3}\Big)^{k - 1}\frac{1}{3} \cdot \Big(\frac{2}{3}\Big)^{m - 1}\frac{1}{3} = \mathbb{P}(W = k) \cdot \Big(\frac{2}{3}\Big)^{m - 1}\frac{1}{3},$$
     le facteur $2$ comptant la couleur sortie la première. Donc la loi de $U$ sachant $W = k$ est $\boxed{\mathcal{G}(\tfrac{1}{3})}$, 
    $$\boxed{U \sim \mathcal{G}(\tfrac{1}{3})},$$
     et, comme cette loi conditionnelle ne dépend pas de $k$, $U$ et $W$ sont indépendantes.

    1.5em

    ![Figure](documents/figures/3acea23dd9622cf5.svg)

    Une réalisation : la première noire sort au tirage $3$, la première blanche au tirage $7$. Après le tirage $W$, il faut attendre la couleur manquante, ce qui prend un temps $U$ de loi $\mathcal{G}(\frac{1}{3})$, indépendant du passé.

    **3.** $U + W = \max(X, Y)$, rang auquel les deux couleurs sont sorties. Comme $\min + \max = X + Y$, on obtient $\boxed{X + Y = 2W + U}$.

    **4.** Par indépendance de $U$ et $W$, $\operatorname{Var}(X + Y) = 4\operatorname{Var}(W) + \operatorname{Var}(U) = 3 + 6 = 9$, et par la prop. 5 du cours, $\operatorname{Var}(X + Y) = 6 + 6 + 2\operatorname{Cov}(X, Y)$ ; donc $\boxed{\operatorname{Cov}(X, Y) = -\frac{3}{2}}$, soit $\rho(X, Y) = -\frac{1}{4}$.

    *Interprétation.* Un même tirage ne peut pas donner à la fois une blanche et une noire. Si la blanche tarde ($X$ grand), il y a eu beaucoup de tirages non blancs, dont environ la moitié de noirs : la noire a de bonnes chances d'être déjà sortie, et $Y$ tend à être petit.
- id: "l3-pr-05-12"
