  enonce: |
    Chacun de $n$ joueurs tire deux fois sur une cible ; chaque tir l'atteint avec probabilité $p$, et les tirs sont indépendants. On note $X$ le nombre de joueurs qui atteignent la cible au premier tir, $Z$ le nombre de joueurs qui l'atteignent au moins une fois, et $Y = Z - X$.

    **1.** Déterminer les lois, espérances et variances de $X$ et de $Z$.

    **2.** Que représente $Y$ ? Déterminer sa loi, son espérance et sa variance.

    **3.** Les variables $X$ et $Y$ sont-elles indépendantes ?

    **4.** À l'aide des variances de $X$, $Y$ et $Z$, montrer que $\operatorname{Cov}(X, Y) = -np^{2}q$. Retrouver ce résultat en écrivant $X$ et $Y$ comme sommes d'indicatrices.
  corrige: |
    **1.** Les joueurs sont indépendants. Chacun touche au premier tir avec probabilité $p$, et au moins une fois avec probabilité $1 - q^{2}$ : 
    $$\boxed{X \sim \mathcal{B}(n, p)}, \quad \mathbb{E}[X] = np, \quad \operatorname{Var}(X) = npq,$$

    $$\boxed{Z \sim \mathcal{B}(n, 1 - q^{2})}, \quad \mathbb{E}[Z] = n(1 - q^{2}), \quad \operatorname{Var}(Z) = n(1 - q^{2})q^{2}.$$

    **2.** $Y$ est le nombre de joueurs qui manquent le premier tir et touchent au second ; c'est une probabilité $qp$ par joueur : $\boxed{Y \sim \mathcal{B}(n, pq)}$, $\mathbb{E}[Y] = npq$, $\operatorname{Var}(Y) = npq(1 - pq)$.

    **3.** $\boxed{\text{Non}}$ : $X + Y = Z \leqslant n$, donc $\mathbb{P}(X = n, Y = 1) = 0$, alors que $\mathbb{P}(X = n)\mathbb{P}(Y = 1) > 0$.

    **4.** Par la prop. 5 du cours, $2\operatorname{Cov}(X, Y) = \operatorname{Var}(Z) - \operatorname{Var}(X) - \operatorname{Var}(Y)$. Comme $1 - q^{2} = p(1 + q)$, 
    $$2\operatorname{Cov}(X, Y) = npq\big[(1 + q)q - 1 - (1 - pq)\big] = npq\big[q + q(q + p) - 2\big] = npq(2q - 2) = -2np^{2}q,$$
     soit $\boxed{\operatorname{Cov}(X, Y) = -np^{2}q}$.

    Par les indicatrices : notons $A_{m}$ (le joueur $m$ touche au premier tir) et $B_{m}$ (il manque, puis touche). Les évènements $A_{m}$ et $B_{m}$ sont incompatibles, donc $\operatorname{Cov}(\mathbf{1}_{A_{m}}, \mathbf{1}_{B_{m}}) = 0 - p \cdot pq$, et les indicatrices de joueurs différents sont indépendantes. D'où $\operatorname{Cov}(X, Y) = \sum_{m}\operatorname{Cov}(\mathbf{1}_{A_{m}}, \mathbf{1}_{B_{m}}) = -np^{2}q$, sans calcul de variances.
