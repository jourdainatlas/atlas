  enonce: |
    Le nombre $N$ de personnes qui se présentent à un bureau de poste suit la loi $\mathcal{P}(\lambda)$, avec $\lambda > 0$. Chaque personne vient poster un envoi avec probabilité $p$, et pour une autre opération avec probabilité $q$, indépendamment des autres et du nombre $N$. On note $X$ le nombre de personnes qui viennent poster un envoi et $Y = N - X$.

    **1.** Justifier que, pour $0 \leqslant k \leqslant n$, $\mathbb{P}(N = n, X = k) = \frac{\mathrm{e}^{-\lambda}\lambda^{n}p^{k}q^{n - k}}{k!\,(n - k)!}$, et vérifier que l'on obtient une loi de probabilité sur $\mathbb{N}^{2}$.

    **2.** En déduire la loi de $X$, son espérance et sa variance. Les variables $N$ et $X$ sont-elles indépendantes ?

    **3.** Montrer que $X$ et $Y$ sont indépendantes.

    **4.** En utilisant $N = X + Y$, calculer $\operatorname{Cov}(X, N)$ et $\rho(X, N)$.

    **5.** La variable $N$ peut-elle être une fonction affine de $Y$ ?
  corrige: |
    **1.** Sachant $N = n$, les $n$ personnes font leurs choix indépendamment, donc $X$ suit $\mathcal{B}(n, p)$. D'où, pour $0 \leqslant k \leqslant n$, 
    $$\mathbb{P}(N = n, X = k) = \mathrm{e}^{-\lambda}\frac{\lambda^{n}}{n!}\binom{n}{k}p^{k}q^{n - k} = \frac{\mathrm{e}^{-\lambda}\lambda^{n}p^{k}q^{n - k}}{k!\,(n - k)!}.$$
     Ces masses sont positives, et leur somme sur $k$ vaut $\mathbb{P}(N = n)$, dont la somme sur $n$ vaut $1$ : c'est une loi de probabilité sur $\mathbb{N}^{2}$.

    **2.** Sommons sur $n \geqslant k$ en posant $l = n - k$ : 
    $$\mathbb{P}(X = k) = \mathrm{e}^{-\lambda}\frac{(\lambda p)^{k}}{k!}\sum_{l \geqslant 0}\frac{(\lambda q)^{l}}{l!} = \mathrm{e}^{-\lambda p}\frac{(\lambda p)^{k}}{k!},$$
     donc $\boxed{X \sim \mathcal{P}(\lambda p)}$, et $\boxed{\mathbb{E}[X] = \operatorname{Var}(X) = \lambda p}$. Les variables $N$ et $X$ ne sont pas indépendantes, puisque $X \leqslant N$ : $\mathbb{P}(N = 0, X = 1) = 0 \neq \mathbb{P}(N = 0)\mathbb{P}(X = 1)$.

    **3.** Pour $k, l \in \mathbb{N}$, l'évènement $\{X = k, Y = l\}$ est $\{N = k + l, X = k\}$, donc 
    $$\mathbb{P}(X = k, Y = l) = \frac{\mathrm{e}^{-\lambda}\lambda^{k + l}p^{k}q^{l}}{k!\,l!} = \mathrm{e}^{-\lambda p}\frac{(\lambda p)^{k}}{k!} \cdot \mathrm{e}^{-\lambda q}\frac{(\lambda q)^{l}}{l!}.$$
     La masse se factorise : $X$ et $Y$ sont indépendantes, et 
    $$\boxed{X \sim \mathcal{P}(\lambda p), \qquad Y \sim \mathcal{P}(\lambda q)}.$$
     C'est la propriété d'*amincissement* de la loi de Poisson ; le chapitre 6 en donnera la réciproque.

    **4.** Par bilinéarité et indépendance, $\operatorname{Cov}(X, N) = \operatorname{Cov}(X, X) + \operatorname{Cov}(X, Y) = \operatorname{Var}(X) = \boxed{\lambda p}$, et 
    $$\rho(X, N) = \frac{\lambda p}{\sqrt{\lambda p \cdot \lambda}} = \boxed{\sqrt{p}}.$$

    **5.** Supposons $N = aY + b$. Alors $X = N - Y = (a - 1)Y + b$ est une fonction de $Y$, et elle en est indépendante ; une variable indépendante d'elle-même est constante (car $\mathbb{P}(X = x) = \mathbb{P}(X = x)^{2} \in \{0, 1\}$). Or $\operatorname{Var}(X) = \lambda p > 0$ : $\boxed{\text{c'est impossible}}$. On le voit aussi sur les corrélations : $\rho(N, Y) = \sqrt{q} < 1$, alors qu'une relation affine non constante donnerait $|\rho| = 1$ (cours, prop. 6).
- id: "l3-pr-05-09"
  feuille: "f-l3-pr-05"
  numero: 9
