    Soit $f$ la fonction définie sur $[-2\,;4]$ par $f(x)=(x+2)\,\mathrm{e}^{-x}$, de courbe $\mathcal{C}_f$.

    **1.** Montrer que, pour tout $x$ de $[-2\,;4]$, $\quad f'(x)=(-x-1)\,\mathrm{e}^{-x}$.

    **2.** Étudier le signe de $f'(x)$, puis dresser le tableau de variations de $f$ sur $[-2\,;4]$. On donnera les valeurs exactes de $f(-2)$, $f(-1)$ et $f(4)$.

    **3.** Déterminer une équation de la tangente $T$ à $\mathcal{C}_f$ au point d'abscisse $0$.

    **4.** Montrer que $f''(x)=x\,\mathrm{e}^{-x}$, puis étudier la convexité de $f$ sur $[-2\,;4]$.

    **5.** Préciser les coordonnées du point d'inflexion de $\mathcal{C}_f$.

    **6.** Montrer que l'équation $f(x)=1$ admet exactement deux solutions sur $[-2\,;4]$, puis en donner un encadrement d'amplitude $10^{-2}$ à l'aide de la calculatrice.
  corrige: |
    **1.** $f(x)=(x+2)\mathrm{e}^{-x}$ est un produit $uv$ avec $u(x)=x+2$ et $v(x)=\mathrm{e}^{-x}$, donc $u'(x)=1$ et $v'(x)=-\mathrm{e}^{-x}$ : 
    $$f'(x)=1\times\mathrm{e}^{-x}+(x+2)\times\left(-\mathrm{e}^{-x}\right) =\mathrm{e}^{-x}\big(1-x-2\big)=\boxed{(-x-1)\,\mathrm{e}^{-x}}$$
     *Piège classique :* la dérivée de $\mathrm{e}^{-x}$ est $-\mathrm{e}^{-x}$, et non $\mathrm{e}^{-x}$ — c'est le facteur $u'=-1$.

    **2.** Comme $\mathrm{e}^{-x}>0$, le signe de $f'(x)$ est celui de $-x-1$, qui s'annule en $-1$ et est positif pour $x<-1$ :

    ![Figure](documents/figures/7a95f5153e706944.svg)

    avec $f(-2)=0\times\mathrm{e}^{2}=0$, $\ f(-1)=1\times\mathrm{e}^{1}=\mathrm{e}$ et $f(4)=6\,\mathrm{e}^{-4}$.

    **3.** $f(0)=2\times\mathrm{e}^{0}=2$ et $f'(0)=(-0-1)\mathrm{e}^{0}=-1$, donc : 
    $$y=-1\times(x-0)+2 \qquad\text{soit}\qquad \boxed{T : y=-x+2}$$

    **4.** On dérive $f'(x)=(-x-1)\mathrm{e}^{-x}$, encore un produit : 
    $$f''(x)=(-1)\times\mathrm{e}^{-x}+(-x-1)\times\left(-\mathrm{e}^{-x}\right) =\mathrm{e}^{-x}\big(-1+x+1\big)=\boxed{x\,\mathrm{e}^{-x}}$$
     Le signe de $f''$ est celui de $x$, d'où : 
    $$\boxed{f \text{ est concave sur } [-2\,;0] \text{ et convexe sur } [0\,;4].}$$

    **5.** La dérivée seconde s'annule en $0$ en changeant de signe, donc la courbe admet un point d'inflexion d'abscisse $0$, et $f(0)=2$ : 
    $$\boxed{\text{le point d'inflexion a pour coordonnées } (0\,;2).}$$
     *On remarque que* c'est précisément le point de contact de la tangente $T$ : en ce point, la courbe traverse sa tangente.

    **6.** On examine les deux branches, en gardant en tête que $\mathrm{e}\approx 2{,}718$ et $6\mathrm{e}^{-4}\approx 0{,}110$ :

    • Sur $[-2\,;-1]$, $f$ est continue et strictement croissante de $0$ à $\mathrm{e}$. Comme $1\in\,]0\,;\mathrm{e}[$, il existe une unique solution $\alpha$.

    • Sur $[-1\,;4]$, $f$ est continue et strictement décroissante de $\mathrm{e}$ à $6\mathrm{e}^{-4}$. Comme $1\in\,]6\mathrm{e}^{-4}\,;\mathrm{e}[$, il existe une unique solution $\beta$.

    $$\boxed{\text{l'équation } f(x)=1 \text{ admet exactement deux solutions sur } [-2\,;4].}$$
     À la calculatrice : 
    $$f(-1{,}85)\approx 0{,}954<1 \quad\text{et}\quad f(-1{,}84)\approx 1{,}007>1 \qquad\text{donc}\qquad \boxed{-1{,}85<\alpha<-1{,}84}$$

    $$f(1{,}14)\approx 1{,}004>1 \quad\text{et}\quad f(1{,}15)\approx 0{,}997<1 \qquad\text{donc}\qquad \boxed{1{,}14<\beta<1{,}15}$$
