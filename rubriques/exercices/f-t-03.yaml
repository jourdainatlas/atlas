  enonce: |
    On dispose d'une plaque de carton carrée de $20$ cm de côté. On découpe à chaque coin un carré de côté $x$, exprimé en centimètres, puis on relève les bords pour former une boîte sans couvercle.

    ![Figure](documents/figures/a1fc92c74296bae3.svg)

    **1.** Justifier que $x$ doit appartenir à l'intervalle $[0\,;10]$.

    **2.** Exprimer les dimensions de la boîte en fonction de $x$, puis montrer que son volume, en $\mathrm{cm}^{3}$, est donné par $V(x)=x(20-2x)^{2}$.

    **3.** Montrer que $V'(x)=(20-2x)(20-6x)$.

    **4.** Étudier le signe de $V'(x)$ sur $[0\,;10]$, puis dresser le tableau de variations de $V$.

    **5.** En déduire la valeur exacte de $x$ pour laquelle le volume est maximal, ainsi que la valeur exacte de ce volume maximal. On en donnera une valeur approchée au $\mathrm{cm}^{3}$ près.

    **6.** Montrer que l'équation $V(x)=400$ admet exactement deux solutions sur $[0\,;10]$, puis en donner un encadrement d'amplitude $10^{-1}$.

    **7.** Étudier la convexité de $V$ sur $[0\,;10]$ et préciser l'abscisse du point d'inflexion.
  corrige: |
    **1.** La longueur découpée doit être positive, donc $x\geqslant 0$. De plus, on découpe un carré de côté $x$ à *chaque* extrémité d'un côté de $20$ cm : il faut donc $2x\leqslant 20$, c'est-à-dire $x\leqslant 10$. D'où $\boxed{x\in[0\,;10].}$

    *On remarque que* les deux bornes correspondent à des cas dégénérés : pour $x=0$ la boîte est plate, pour $x=10$ il ne reste plus de fond. Dans les deux cas le volume est nul.

    **2.** Après découpe et pliage, la base est un carré de côté $20-2x$ et la hauteur vaut $x$ : 
    $$V(x)=\text{aire de la base}\times\text{hauteur}=\boxed{x(20-2x)^{2}}$$

    **3.** On dérive le produit $uv$ avec $u(x)=x$ et $v(x)=(20-2x)^{2}$. La dérivée de $v$ s'obtient par la formule $\left(u^{2}\right)'=2u'u$, avec ici une fonction intérieure de dérivée $-2$ : 
    $$v'(x)=2\times(-2)\times(20-2x)=-4(20-2x)$$
     Ce qui nous donne : 
    $$V'(x)=1\times(20-2x)^{2}+x\times\big(-4(20-2x)\big) =(20-2x)\Big[(20-2x)-4x\Big]=\boxed{(20-2x)(20-6x)}$$

    **4.** Sur $[0\,;10]$, on a $20-2x\geqslant 0$ (nul seulement en $x=10$), donc le signe de $V'$ est celui de $20-6x$, qui s'annule en $x=\dfrac{20}{6}=\dfrac{10}{3}$ :

    ![Figure](documents/figures/0caaad0cb7ca2ca0.svg)

    **5.** Le volume est maximal pour $\boxed{x=\dfrac{10}{3}\text{ cm}}$, et vaut alors : 
    $$V\!\left(\frac{10}{3}\right)=\frac{10}{3}\times\left(20-\frac{20}{3}\right)^{2} =\frac{10}{3}\times\left(\frac{40}{3}\right)^{2} =\frac{10}{3}\times\frac{1\,600}{9} =\boxed{\frac{16\,000}{27}\approx 593 \text{ cm}^{3}}$$

    **6.** Comme $400<\dfrac{16\,000}{27}\approx 592{,}6$, on applique le corollaire sur chaque branche :

    • sur $\left[0\,;\frac{10}{3}\right]$, $V$ est continue et strictement croissante de $0$ à $592{,}6$, et $400$ appartient à cet intervalle : une unique solution ;

    • sur $\left[\frac{10}{3}\,;10\right]$, $V$ est continue et strictement décroissante de $592{,}6$ à $0$ : une unique solution.

    $$\boxed{\text{l'équation } V(x)=400 \text{ admet exactement deux solutions.}}$$
     À la calculatrice, $V(1{,}3)\approx 393{,}6$ et $V(1{,}4)\approx 414{,}2$, puis $V(5{,}8)\approx 409{,}3$ et $V(5{,}9)\approx 396{,}8$ : 
    $$\boxed{1{,}3<x_{1}<1{,}4 \qquad\text{et}\qquad 5{,}8<x_{2}<5{,}9}$$

    **7.** En développant, $V(x)=x\left(400-80x+4x^{2}\right)=4x^{3}-80x^{2}+400x$, d'où : 
    $$V'(x)=12x^{2}-160x+400 \qquad\text{puis}\qquad V''(x)=24x-160$$
     *Vérification :* en développant $(20-2x)(20-6x)=400-120x-40x+12x^{2}=12x^{2}-160x+400$.

    $V''(x)$ s'annule en $x=\dfrac{160}{24}=\dfrac{20}{3}$, en changeant de signe : 
    $$\boxed{V \text{ est concave sur } \left[0\,;\tfrac{20}{3}\right],\ \text{convexe sur } \left[\tfrac{20}{3}\,;10\right],\ \text{point d'inflexion en } x=\dfrac{20}{3}.}$$
