- id: "t-03-01"
  feuille: "f-t-03"
  numero: 1
  partie: "Limites d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["limite en l'infini", racine carrée]
  noeuds: []
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer les limites suivantes, en citant à chaque fois la limite de référence utilisée.

    **a)** $\lim\limits_{x\to +\infty} x^{5}$

    **b)** $\lim\limits_{x\to -\infty} x^{4}$

    **c)** $\lim\limits_{x\to -\infty} x^{7}$

    **d)** $\lim\limits_{x\to +\infty} \sqrt{x}$

    **e)** $\lim\limits_{x\to +\infty} \dfrac{1}{x^{3}}$

    **f)** $\lim\limits_{x\to +\infty} \dfrac{1}{\sqrt{x}}$

    **g)** $\lim\limits_{x\to -\infty} \dfrac{1}{x^{2}}$

    **h)** $\lim\limits_{x\to -\infty} \dfrac{1}{x^{5}}$
  corrige: |
    On applique directement la proposition 1 du cours.

    **a)** $\lim\limits_{x\to +\infty} x^{5}=\boxed{+\infty}$ ($x^{n}\to+\infty$ en $+\infty$).

    **b)** $\lim\limits_{x\to -\infty} x^{4}=\boxed{+\infty}$ ($n=4$ est **pair**).

    **c)** $\lim\limits_{x\to -\infty} x^{7}=\boxed{-\infty}$ ($n=7$ est **impair**).

    **d)** $\lim\limits_{x\to +\infty} \sqrt{x}=\boxed{+\infty}$

    **e)** $\lim\limits_{x\to +\infty} \dfrac{1}{x^{3}}=\boxed{0}$

    **f)** $\lim\limits_{x\to +\infty} \dfrac{1}{\sqrt{x}}=\boxed{0}$

    **g)** $\lim\limits_{x\to -\infty} \dfrac{1}{x^{2}}=\boxed{0}$

    **h)** $\lim\limits_{x\to -\infty} \dfrac{1}{x^{5}}=\boxed{0}$

    *On remarque que* la parité de $n$ n'intervient que pour $x^{n}$ en $-\infty$ : pour $\dfrac{1}{x^{n}}$, la limite est $0$ dans tous les cas, que $n$ soit pair ou impair.
- id: "t-03-02"
  feuille: "f-t-03"
  numero: 2
  partie: "Limites d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [forme indéterminée]
  noeuds: []
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soient $f$ et $g$ deux fonctions admettant les limites indiquées en $\alpha$, où $\alpha$ désigne $-\infty$, un réel $a$ ou $+\infty$. Recopier et compléter le tableau suivant : on écrira la limite de $f+g$, de $fg$ et de $\dfrac{f}{g}$, ou bien « F.I. » s'il s'agit d'une forme indéterminée.

    $$\begin{array}{|c|c|c|c|c|c|} \hline  & \lim f & \lim g & \lim (f+g) & \lim (fg) & \lim \dfrac{f}{g} \\ \hline \text{1.} & 5 & +\infty &  &  &  \\ \hline \text{2.} & -\infty & +\infty &  &  &  \\ \hline \text{3.} & 0 & +\infty &  &  &  \\ \hline \text{4.} & -2 & 0 &  &  &  \\ \hline \text{5.} & +\infty & +\infty &  &  &  \\ \hline \text{6.} & 0 & 0 &  &  &  \\ \hline \end{array}$$

    Une case n'est pas une forme indéterminée mais demande cependant une information supplémentaire avant de conclure : la repérer et préciser laquelle.
  corrige: |
    $$\begin{array}{|c|c|c|c|c|c|} \hline  & \lim f & \lim g & \lim (f+g) & \lim (fg) & \lim \dfrac{f}{g} \\ \hline \text{1.} & 5 & +\infty & +\infty & +\infty & 0 \\ \hline \text{2.} & -\infty & +\infty & \text{F.I.} & -\infty & \text{F.I.} \\ \hline \text{3.} & 0 & +\infty & +\infty & \text{F.I.} & 0 \\ \hline \text{4.} & -2 & 0 & -2 & 0 & \pm\infty \\ \hline \text{5.} & +\infty & +\infty & +\infty & +\infty & \text{F.I.} \\ \hline \text{6.} & 0 & 0 & 0 & 0 & \text{F.I.} \\ \hline \end{array}$$

    **La case à repérer est celle de la ligne 4, colonne $\dfrac{f}{g}$.** Ce n'est pas une forme indéterminée : le numérateur tend vers $-2\neq 0$ et le dénominateur vers $0$, donc le quotient tend vers l'infini. Mais **le signe de cet infini dépend du signe de $g$ au voisinage du point considéré** : si $g$ reste positive, le quotient tend vers $-\infty$ ; si $g$ reste négative, il tend vers $+\infty$. C'est exactement pour cela que l'on distingue la limite à droite et la limite à gauche.

    *Piège classique :* on retiendra qu'il n'existe que quatre formes indéterminées, et que $\dfrac{\ell}{0}$ avec $\ell\neq 0$ n'en fait pas partie.
- id: "t-03-03"
  feuille: "f-t-03"
  numero: 3
  partie: "Limites d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["limite en l'infini", polynôme]
  noeuds: []
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer la limite de chacune des fonctions suivantes en $+\infty$, puis en $-\infty$. On factorisera à chaque fois par le terme de plus haut degré.

    **a)** $f(x)=x^{3}-5x^{2}+2$

    **b)** $g(x)=-2x^{4}+7x-3$

    **c)** $h(x)=-x^{5}+x^{3}+100x$

    **d)** $k(x)=4x^{2}-9x^{3}$
  corrige: |
    On factorise à chaque fois par le terme de plus haut degré.

    **a)** $f(x)=x^{3}-5x^{2}+2=x^{3}\left(1-\dfrac{5}{x}+\dfrac{2}{x^{3}}\right)$.

    La parenthèse tend vers $1$ en $+\infty$ comme en $-\infty$. Ce qui nous donne : 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{+\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} f(x)=\boxed{-\infty}$$

    **b)** $g(x)=-2x^{4}+7x-3=x^{4}\left(-2+\dfrac{7}{x^{3}}-\dfrac{3}{x^{4}}\right)$.

    La parenthèse tend vers $-2$, et $x^{4}\to+\infty$ des deux côtés : 
    $$\lim\limits_{x\to +\infty} g(x)=\boxed{-\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} g(x)=\boxed{-\infty}$$

    **c)** $h(x)=-x^{5}+x^{3}+100x=x^{5}\left(-1+\dfrac{1}{x^{2}}+\dfrac{100}{x^{4}}\right)$.

    La parenthèse tend vers $-1$ : 
    $$\lim\limits_{x\to +\infty} h(x)=\boxed{-\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} h(x)=\boxed{+\infty}$$

    **d)** $k(x)=4x^{2}-9x^{3}=x^{3}\left(\dfrac{4}{x}-9\right)$.

    La parenthèse tend vers $-9$ : 
    $$\lim\limits_{x\to +\infty} k(x)=\boxed{-\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} k(x)=\boxed{+\infty}$$

    *On retiendra la règle générale ainsi mise en évidence :* en $\pm\infty$, un polynôme a la même limite que son terme de plus haut degré.
- id: "t-03-04"
  feuille: "f-t-03"
  numero: 4
  partie: "Limites d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [forme indéterminée, "limite en l'infini"]
  noeuds: []
  notions: []
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Déterminer la limite de chacune des fonctions suivantes en $+\infty$, puis en $-\infty$.

    **a)** $f(x)=\dfrac{3x+1}{x-2}$

    **b)** $g(x)=\dfrac{x^{2}+3x}{2x^{2}-5}$

    **c)** $h(x)=\dfrac{4x-7}{x^{2}+1}$

    **d)** $k(x)=\dfrac{5x^{2}-1}{3-x}$
  corrige: |
    Dans chaque cas, numérateur et dénominateur tendent vers l'infini : il s'agit d'une forme indéterminée $\dfrac{\infty}{\infty}$, que l'on lève en factorisant haut et bas par le terme de plus haut degré.

    **a)** $f(x)=\dfrac{3x+1}{x-2} =\dfrac{x\left(3+\frac{1}{x}\right)}{x\left(1-\frac{2}{x}\right)} =\dfrac{3+\frac{1}{x}}{1-\frac{2}{x}}\longrightarrow \dfrac{3}{1}$, donc 
    $$\lim\limits_{x\to +\infty} f(x)=\lim\limits_{x\to -\infty} f(x)=\boxed{3}$$

    **b)** $g(x)=\dfrac{x^{2}+3x}{2x^{2}-5} =\dfrac{x^{2}\left(1+\frac{3}{x}\right)}{x^{2}\left(2-\frac{5}{x^{2}}\right)} =\dfrac{1+\frac{3}{x}}{2-\frac{5}{x^{2}}}\longrightarrow \dfrac{1}{2}$, donc 
    $$\lim\limits_{x\to +\infty} g(x)=\lim\limits_{x\to -\infty} g(x)=\boxed{\dfrac{1}{2}}$$

    **c)** $h(x)=\dfrac{4x-7}{x^{2}+1} =\dfrac{x\left(4-\frac{7}{x}\right)}{x^{2}\left(1+\frac{1}{x^{2}}\right)} =\dfrac{4-\frac{7}{x}}{x\left(1+\frac{1}{x^{2}}\right)}$.

    Le numérateur tend vers $4$ et le dénominateur vers $\pm\infty$, donc 
    $$\lim\limits_{x\to +\infty} h(x)=\lim\limits_{x\to -\infty} h(x)=\boxed{0}$$

    **d)** $k(x)=\dfrac{5x^{2}-1}{3-x} =\dfrac{x^{2}\left(5-\frac{1}{x^{2}}\right)}{x\left(\frac{3}{x}-1\right)} =\dfrac{x\left(5-\frac{1}{x^{2}}\right)}{\frac{3}{x}-1}$.

    Le dénominateur tend vers $-1$ et le numérateur se comporte comme $5x$, donc 
    $$\lim\limits_{x\to +\infty} k(x)=\boxed{-\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} k(x)=\boxed{+\infty}$$

    *On en déduit la règle pratique :* en $\pm\infty$, une fonction rationnelle a la même limite que le quotient des termes de plus haut degré. Ici : $\frac{3x}{x}$, $\frac{x^2}{2x^2}$, $\frac{4x}{x^{2}}$ et $\frac{5x^{2}}{-x}$.
- id: "t-03-05"
  feuille: "f-t-03"
  numero: 5
  partie: "Limites d'une fonction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [forme indéterminée, limite en un réel, fonction auxiliaire]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $f$ définie sur $\mathbb{R}\setminus\{1\}$ par $f(x)=\dfrac{2x+3}{x-1}$. Déterminer $\lim\limits_{x\to 1^{+}} f(x)$ et $\lim\limits_{x\to 1^{-}} f(x)$. La fonction $f$ admet-elle une limite en $1$ ?

    **2.** Soit $g$ définie sur $\mathbb{R}\setminus\{-2\}$ par $g(x)=\dfrac{x-4}{(x+2)^{2}}$. Déterminer la limite de $g$ en $-2$. Pourquoi n'est-il pas nécessaire ici de distinguer la limite à droite et la limite à gauche ?

    **3.** Soit $h$ définie sur $\mathbb{R}\setminus\{3\}$ par $h(x)=\dfrac{x^{2}-9}{x-3}$. Vérifier que l'on est en présence d'une forme indéterminée, puis lever cette indétermination.

    **4.** Soit $k$ définie sur $\mathbb{R}\setminus\{3\}$ par $k(x)=\dfrac{x+5}{3-x}$. Déterminer les limites de $k$ à droite et à gauche en $3$.
  corrige: |
    **1.** $f(x)=\dfrac{2x+3}{x-1}$. Lorsque $x$ tend vers $1$, le numérateur tend vers $5$, qui est **non nul** : ce n'est donc pas une forme indéterminée, mais il faut déterminer un signe.

    • Pour $x>1$, on a $x-1>0$, donc $x-1\to 0^{+}$ et $\displaystyle\lim_{x\to 1^{+}} f(x)=\boxed{+\infty}$

    • Pour $x<1$, on a $x-1<0$, donc $x-1\to 0^{-}$ et $\displaystyle\lim_{x\to 1^{-}} f(x)=\boxed{-\infty}$

    Ces deux limites étant différentes, $\boxed{f \text{ n'admet pas de limite en } 1.}$

    **2.** $g(x)=\dfrac{x-4}{(x+2)^{2}}$. Le numérateur tend vers $-6<0$, et le dénominateur est un **carré** : il tend vers $0$ *en restant strictement positif*, quel que soit le côté par lequel on approche $-2$. Il n'y a donc pas lieu de distinguer les deux côtés : 
    $$\lim_{x\to -2} g(x)=\boxed{-\infty}$$

    **3.** $h(x)=\dfrac{x^{2}-9}{x-3}$. En $3$, le numérateur *et* le dénominateur tendent vers $0$ : c'est bien la forme indéterminée $\dfrac{0}{0}$. On factorise le numérateur : 
    $$h(x)=\frac{x^{2}-9}{x-3}=\frac{(x-3)(x+3)}{x-3}=x+3 \qquad\text{pour } x\neq 3$$
     On en déduit donc que $\displaystyle\lim_{x\to 3} h(x)=\boxed{6}$.

    **4.** $k(x)=\dfrac{x+5}{3-x}$. Le numérateur tend vers $8>0$. *Attention au sens de la soustraction :*

    • Pour $x>3$, on a $3-x<0$, donc $\displaystyle\lim_{x\to 3^{+}} k(x)=\boxed{-\infty}$

    • Pour $x<3$, on a $3-x>0$, donc $\displaystyle\lim_{x\to 3^{-}} k(x)=\boxed{+\infty}$

    *Piège classique :* on écrit $3-x$ et non $x-3$ ; les signes sont donc inversés par rapport à la question 1.
- id: "t-03-06"
  feuille: "f-t-03"
  numero: 6
  partie: "Comparaison, gendarmes et asymptotes"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [limite en un réel, asymptote]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On donne ci-dessous la courbe représentative $\mathcal{C}_f$ d'une fonction $f$ définie sur $\mathbb{R}\setminus\{-2\}$, ainsi que ses deux asymptotes en pointillés.

    ![Figure](documents/figures/409225f303cc5418.svg)

    **1.** Déterminer par lecture graphique $\lim\limits_{x\to +\infty} f(x)$ et $\lim\limits_{x\to -\infty} f(x)$.

    **2.** Déterminer de même $\lim\limits_{x\to -2^{+}} f(x)$ et $\lim\limits_{x\to -2^{-}} f(x)$.

    **3.** Donner les équations des deux asymptotes à $\mathcal{C}_f$, en précisant leur nature.

    **4.** Sur quel intervalle la courbe est-elle située au-dessus de son asymptote horizontale ?

    **5.** On admet que $f(x)=\dfrac{x+4}{x+2}$. Retrouver par le calcul les quatre limites des questions 1. et 2.
  corrige: |
    **1.** Lorsque $x$ s'éloigne vers la droite comme vers la gauche, la courbe se rapproche de la droite horizontale d'ordonnée $1$ : 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{1}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} f(x)=\boxed{1}$$

    **2.** Au voisinage de $-2$, la courbe « part vers le haut » à droite et « vers le bas » à gauche : 
    $$\lim_{x\to -2^{+}} f(x)=\boxed{+\infty}\qquad\text{et}\qquad \lim_{x\to -2^{-}} f(x)=\boxed{-\infty}$$

    **3.** $\boxed{y=1 \text{ est asymptote \textbf{horizontale}}}$ (limite finie en $\pm\infty$) et $\boxed{x=-2 \text{ est asymptote \textbf{verticale}}}$ (limite infinie en un réel).

    **4.** Graphiquement, la courbe est au-dessus de la droite $y=1$ sur $\boxed{]-2\,;+\infty[}$, et en dessous sur $]-\infty\,;-2[$.

    **5.** Avec $f(x)=\dfrac{x+4}{x+2}$ : 
    $$f(x)=\frac{x\left(1+\frac{4}{x}\right)}{x\left(1+\frac{2}{x}\right)} =\frac{1+\frac{4}{x}}{1+\frac{2}{x}}\longrightarrow \frac{1}{1}=1 \qquad\text{en } +\infty \text{ comme en } -\infty$$
     En $-2$, le numérateur tend vers $2>0$ et le dénominateur vers $0$ : 
    $$\lim_{x\to -2^{+}} f(x)=+\infty \quad (x+2\to 0^{+}) \qquad\text{et}\qquad \lim_{x\to -2^{-}} f(x)=-\infty \quad (x+2\to 0^{-})$$
     Le calcul confirme la lecture graphique. On peut d'ailleurs vérifier la question 4. : 
    $$f(x)-1=\frac{x+4}{x+2}-\frac{x+2}{x+2}=\boxed{\frac{2}{x+2}}$$
     qui est strictement positif si et seulement si $x>-2$.
- id: "t-03-07"
  feuille: "f-t-03"
  numero: 7
  partie: "Comparaison, gendarmes et asymptotes"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["limite en l'infini", théorème de comparaison, fonction auxiliaire]
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Soit $f$ une fonction telle que $f(x)\geqslant x^{2}-5x$ pour tout $x\geqslant 0$. Déterminer $\lim\limits_{x\to +\infty} f(x)$ en justifiant soigneusement.

    **2.** Soit $g$ une fonction telle que $g(x)\leqslant -x^{3}+2$ pour tout $x\geqslant 1$. Déterminer $\lim\limits_{x\to +\infty} g(x)$.

    **3.** Soit $h$ définie sur $\mathbb{R}$ par $h(x)=x+\cos(x)$.

    **(a)** Justifier que $h(x)\geqslant x-1$ pour tout réel $x$.

    **(b)** En déduire $\lim\limits_{x\to +\infty} h(x)$.

    **(c)** Déterminer de même $\lim\limits_{x\to -\infty} h(x)$.
  corrige: |
    **1.** On sait que $f(x)\geqslant x^{2}-5x$ pour tout $x\geqslant 0$. Or 
    $$x^{2}-5x=x^{2}\left(1-\frac{5}{x}\right)\longrightarrow +\infty \quad\text{en } +\infty$$
     La fonction $f$ est donc minorée par une fonction qui tend vers $+\infty$. D'après le théorème de comparaison : 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{+\infty}$$

    **2.** On sait que $g(x)\leqslant -x^{3}+2$ pour $x\geqslant 1$, et $-x^{3}+2=x^{3}\left(-1+\frac{2}{x^{3}}\right)\to -\infty$ en $+\infty$. La fonction $g$ est donc majorée par une fonction qui tend vers $-\infty$, d'où : 
    $$\lim\limits_{x\to +\infty} g(x)=\boxed{-\infty}$$

    **3.** $h(x)=x+\cos(x)$.

    **(a)** Pour tout réel $x$, on a $-1\leqslant \cos(x)\leqslant 1$. En ajoutant $x$ aux trois membres : 
    $$x-1\leqslant x+\cos(x)\leqslant x+1 \qquad\text{soit}\qquad \boxed{h(x)\geqslant x-1 \ \text{ et } \ h(x)\leqslant x+1}$$

    **(b)** $\lim\limits_{x\to +\infty}(x-1)=+\infty$, donc par comparaison $\lim\limits_{x\to +\infty} h(x)=\boxed{+\infty}$.

    **(c)** $\lim\limits_{x\to -\infty}(x+1)=-\infty$, et $h(x)\leqslant x+1$, donc par comparaison $\lim\limits_{x\to -\infty} h(x)=\boxed{-\infty}$.

    *On remarque que* la fonction cosinus n'admet aucune limite en $\pm\infty$ ; c'est bien le fait qu'elle soit **bornée** qui permet de conclure, et non une limite qu'elle n'a pas.
- id: "t-03-08"
  feuille: "f-t-03"
  numero: 8
  partie: "Comparaison, gendarmes et asymptotes"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["limite en l'infini", théorème des gendarmes, racine carrée]
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Dans chaque cas, encadrer la fonction proposée par deux fonctions de même limite, puis conclure à l'aide du théorème des gendarmes.

    **1.** $f(x)=\dfrac{2+\sin(x)}{x}$ en $+\infty$.

    **2.** $g(x)=\dfrac{3x+\cos(x)}{x}$ en $+\infty$.

    **3.** $h(x)=\dfrac{\cos(x)}{x^{2}}$ en $+\infty$.

    **4.** $k(x)=\dfrac{\sin(x)}{\sqrt{x}}$ en $+\infty$.
  corrige: |
    **1.** Pour tout $x>0$ : $-1\leqslant \sin(x)\leqslant 1$ donne $1\leqslant 2+\sin(x)\leqslant 3$, puis, en divisant par $x>0$ (ce qui préserve l'ordre) : 
    $$\frac{1}{x}\leqslant f(x) \leqslant \frac{3}{x}$$
     Les deux fonctions encadrantes tendent vers $0$ en $+\infty$, donc d'après le théorème des gendarmes : 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{0}$$

    **2.** On commence par écrire $g(x)=\dfrac{3x+\cos(x)}{x}=3+\dfrac{\cos(x)}{x}$. Pour $x>0$ : 
    $$3-\frac{1}{x}\leqslant g(x) \leqslant 3+\frac{1}{x}$$
     Les deux encadrants tendent vers $3$, donc 
    $$\lim\limits_{x\to +\infty} g(x)=\boxed{3}$$

    **3.** Pour $x>0$ : $-\dfrac{1}{x^{2}}\leqslant h(x)\leqslant \dfrac{1}{x^{2}}$, et les deux encadrants tendent vers $0$, donc 
    $$\lim\limits_{x\to +\infty} h(x)=\boxed{0}$$

    **4.** Pour $x>0$ : $-\dfrac{1}{\sqrt{x}}\leqslant k(x)\leqslant \dfrac{1}{\sqrt{x}}$, et les deux encadrants tendent vers $0$, donc 
    $$\lim\limits_{x\to +\infty} k(x)=\boxed{0}$$

    *On procède de la même manière à chaque fois :* on part de l'encadrement de la fonction bornée ($\sin$ ou $\cos$ entre $-1$ et $1$), puis on effectue sur les trois membres les mêmes opérations que celles subies par cette fonction dans l'expression.
- id: "t-03-09"
  feuille: "f-t-03"
  numero: 9
  partie: "Comparaison, gendarmes et asymptotes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [limite en un réel, asymptote]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Pour chacune des fonctions suivantes, déterminer l'ensemble de définition, puis les asymptotes horizontales et verticales à sa courbe représentative. On justifiera chaque réponse par un calcul de limite.

    **1.** $f(x)=\dfrac{3x-1}{x+2}$

    **2.** $g(x)=5-\dfrac{4}{x-1}$

    **3.** $h(x)=\dfrac{2x^{2}+1}{x^{2}+3}$ (attention : le piège est volontaire)

    **4.** $k(x)=\dfrac{x+4}{x^{2}-1}$
  corrige: |
    *Dans les quatre figures qui suivent, la courbe est tracée en bleu ardoise et les asymptotes en pointillés violets.*

    **1.** $f(x)=\dfrac{3x-1}{x+2}$, définie sur $\boxed{\mathbb{R}\setminus\{-2\}}$.

    En $\pm\infty$ : $f(x)=\dfrac{3-\frac{1}{x}}{1+\frac{2}{x}}\to 3$, donc $\boxed{y=3 \text{ est asymptote horizontale.}}$

    En $-2$, le numérateur tend vers $-7<0$ : $\lim\limits_{x\to -2^{+}} f(x)=-\infty$ et $\lim\limits_{x\to -2^{-}} f(x)=+\infty$, donc $\boxed{x=-2 \text{ est asymptote verticale.}}$

    ![Figure](documents/figures/bea757129e467f31.svg)

    **2.** $g(x)=5-\dfrac{4}{x-1}$, définie sur $\boxed{\mathbb{R}\setminus\{1\}}$.

    En $\pm\infty$ : $\dfrac{4}{x-1}\to 0$, donc $g(x)\to 5$ et $\boxed{y=5 \text{ est asymptote horizontale.}}$

    En $1$ : $\lim\limits_{x\to 1^{+}} g(x)=-\infty$ et $\lim\limits_{x\to 1^{-}} g(x)=+\infty$, donc $\boxed{x=1 \text{ est asymptote verticale.}}$

    ![Figure](documents/figures/8603973ead6b59a5.svg)

    **3.** $h(x)=\dfrac{2x^{2}+1}{x^{2}+3}$. **Le piège est ici :** pour tout réel $x$, on a $x^{2}+3\geqslant 3>0$, le dénominateur ne s'annule *jamais*. Donc $\boxed{h \text{ est définie sur } \mathbb{R} \text{ tout entier.}}$

    En $\pm\infty$ : $h(x)=\dfrac{2+\frac{1}{x^{2}}}{1+\frac{3}{x^{2}}}\to 2$, donc 
    $$\boxed{y=2 \text{ est asymptote horizontale, et il n'y a aucune asymptote verticale.}}$$

    ![Figure](documents/figures/a938fca255d04dbd.svg)

    On voit sur la figure que la courbe se rapproche de la droite $y=2$ sans jamais l'atteindre, et qu'elle ne présente aucune branche verticale.

    **4.** $k(x)=\dfrac{x+4}{x^{2}-1}=\dfrac{x+4}{(x-1)(x+1)}$, définie sur $\boxed{\mathbb{R}\setminus\{-1\,;1\}}$.

    En $\pm\infty$ : le degré du dénominateur l'emporte, donc $k(x)\to 0$ et 
    $$\boxed{y=0 \text{ est asymptote horizontale.}}$$

    En $1$ : le numérateur tend vers $5>0$ et $x+1\to 2>0$, donc le signe est celui de $x-1$ : 
    $$\lim_{x\to 1^{+}} k(x)=+\infty \qquad\text{et}\qquad \lim_{x\to 1^{-}} k(x)=-\infty$$
     En $-1$ : le numérateur tend vers $3>0$ et $x-1\to -2<0$, donc le signe est *l'opposé* de celui de $x+1$ : 
    $$\lim_{x\to -1^{+}} k(x)=-\infty \qquad\text{et}\qquad \lim_{x\to -1^{-}} k(x)=+\infty$$

    $$\boxed{x=1 \text{ et } x=-1 \text{ sont asymptotes verticales.}}$$

    ![Figure](documents/figures/4f3ce82321ab0db1.svg)

    On distingue bien les **trois** branches de la courbe, séparées par les deux asymptotes verticales, et l'axe des abscisses comme asymptote horizontale.
- id: "t-03-10"
  feuille: "f-t-03"
  numero: 10
  partie: "Comparaison, gendarmes et asymptotes"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["limite en l'infini", limite en un réel, asymptote]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}\setminus\{1\}$ par $f(x)=\dfrac{2x-5}{x-1}$, de courbe $\mathcal{C}_f$.

    **1.** Vérifier que, pour tout $x\neq 1$, on a $f(x)=2-\dfrac{3}{x-1}$.

    **2.** En déduire les limites de $f$ en $+\infty$ et en $-\infty$, puis à droite et à gauche en $1$.

    **3.** Donner les équations des asymptotes à $\mathcal{C}_f$.

    **4.** Étudier le signe de $f(x)-2$, et en déduire la position de $\mathcal{C}_f$ par rapport à son asymptote horizontale.

    **5.** La courbe $\mathcal{C}_f$ coupe-t-elle son asymptote horizontale ?

    **6.** Tracer une courbe représentative possible pour la fonction $f$.
  corrige: |
    **1.** On réduit au même dénominateur : 
    $$2-\frac{3}{x-1}=\frac{2(x-1)}{x-1}-\frac{3}{x-1}=\frac{2x-2-3}{x-1} =\boxed{\frac{2x-5}{x-1}=f(x)}$$
     *Piège classique :* il faut bien distribuer le $2$ sur $x-1$, et non écrire $2x-1$.

    **2.** Sous cette forme, tout se lit sur le terme $\dfrac{3}{x-1}$ : 
    $$\lim\limits_{x\to +\infty} f(x)=\lim\limits_{x\to -\infty} f(x)=2-0=\boxed{2}$$

    $$\lim_{x\to 1^{+}} f(x)=2-(+\infty)=\boxed{-\infty}\qquad\text{et}\qquad \lim_{x\to 1^{-}} f(x)=2-(-\infty)=\boxed{+\infty}$$

    **3.** $\boxed{y=2 \text{ est asymptote horizontale, et } x=1 \text{ asymptote verticale.}}$

    **4.** $f(x)-2=-\dfrac{3}{x-1}$. Comme $-3<0$, ce quotient est du signe contraire de $x-1$ :

    • pour $x<1$ : $f(x)-2>0$, donc $\boxed{\mathcal{C}_f \text{ est au-dessus de son asymptote.}}$

    • pour $x>1$ : $f(x)-2<0$, donc $\boxed{\mathcal{C}_f \text{ est en dessous de son asymptote.}}$

    **5.** L'équation $f(x)=2$ équivaudrait à $-\dfrac{3}{x-1}=0$, ce qui est impossible : un quotient de numérateur non nul ne s'annule jamais. Donc 
    $$\boxed{\mathcal{C}_f \text{ ne coupe jamais son asymptote horizontale.}}$$
     *On remarquera* que ce n'est pas une règle générale : le cours rappelle qu'une courbe peut parfaitement traverser son asymptote, et même une infinité de fois, comme celle de $x\mapsto \frac{\sin x}{x}$.

    **6.** On rassemble tous les renseignements obtenus : deux asymptotes, d'équations $x=1$ et $y=2$ ; la courbe est au-dessus de l'asymptote horizontale à gauche de $1$, en dessous à droite, et ne la coupe jamais. On place enfin quelques points pour caler le tracé : 
    $$f(-5)=\frac{-15}{-6}=2{,}5 \qquad f(0)=\frac{-5}{-1}=5 \qquad f\left(\frac{5}{2}\right)=0 \qquad f(4)=\frac{3}{3}=1 \qquad f(7)=\frac{9}{6}=1{,}5$$

    ![Figure](documents/figures/372dbc6a7bb71ec5.svg)

    *On vérifie sur le tracé* tout ce qui précède : la branche de gauche reste strictement au-dessus de la droite $y=2$, celle de droite strictement en dessous, et aucune des deux ne la franchit. La courbe coupe en revanche l'axe des abscisses en $x=\frac{5}{2}$, seul point où $2x-5=0$.
- id: "t-03-11"
  feuille: "f-t-03"
  numero: 11
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Déterminer la fonction dérivée de chacune des fonctions suivantes, en précisant l'intervalle sur lequel on travaille.

    **a)** $f(x)=3x^{4}-2x^{3}+5x-1$

    **b)** $g(x)=(2x-1)(x^{2}+3)$

    **c)** $h(x)=\dfrac{x+2}{x-3}$

    **d)** $k(x)=5\sqrt{x}-\dfrac{1}{x}$

    **e)** $m(x)=x^{2}\mathrm{e}^{x}$

    **f)** $n(x)=(x-1)\mathrm{e}^{x}$
  corrige: |
    **a)** $f(x)=3x^{4}-2x^{3}+5x-1$ sur $\mathbb{R}$ : $\quad f'(x)=3\times 4x^{3}-2\times 3x^{2}+5=\boxed{12x^{3}-6x^{2}+5}$

    **b)** $g(x)=(2x-1)(x^{2}+3)$ sur $\mathbb{R}$, de la forme $uv$ : 
    $$g'(x)=2\times(x^{2}+3)+(2x-1)\times 2x=2x^{2}+6+4x^{2}-2x=\boxed{6x^{2}-2x+6}$$

    **c)** $h(x)=\dfrac{x+2}{x-3}$ sur $\mathbb{R}\setminus\{3\}$, de la forme $\dfrac{u}{v}$ : 
    $$h'(x)=\frac{1\times(x-3)-(x+2)\times 1}{(x-3)^{2}}=\frac{x-3-x-2}{(x-3)^{2}} =\boxed{\frac{-5}{(x-3)^{2}}}$$
     *Piège classique :* le signe $-$ devant la parenthèse porte sur $x$ *et* sur $2$.

    **d)** $k(x)=5\sqrt{x}-\dfrac{1}{x}$ sur $]0\,;+\infty[$ : 
    $$k'(x)=5\times\frac{1}{2\sqrt{x}}-\left(-\frac{1}{x^{2}}\right) =\boxed{\frac{5}{2\sqrt{x}}+\frac{1}{x^{2}}}$$

    **e)** $m(x)=x^{2}\mathrm{e}^{x}$ sur $\mathbb{R}$, de la forme $uv$ : 
    $$m'(x)=2x\,\mathrm{e}^{x}+x^{2}\mathrm{e}^{x}=\boxed{x(x+2)\,\mathrm{e}^{x}}$$

    **f)** $n(x)=(x-1)\mathrm{e}^{x}$ sur $\mathbb{R}$ : 
    $$n'(x)=1\times\mathrm{e}^{x}+(x-1)\mathrm{e}^{x}=\mathrm{e}^{x}\big(1+x-1\big) =\boxed{x\,\mathrm{e}^{x}}$$
- id: "t-03-12"
  feuille: "f-t-03"
  numero: 12
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivée, tangente, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Dans chaque cas, déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $a$.

    **a)** $f(x)=x^{3}-2x+1$ et $a=1$

    **b)** $f(x)=\sqrt{x}$ et $a=4$

    **c)** $f(x)=\mathrm{e}^{x}$ et $a=0$

    **d)** $f(x)=\dfrac{1}{x}$ et $a=-2$
  corrige: |
    On applique à chaque fois la formule $\; y=f'(a)(x-a)+f(a)$.

    **a)** $f(x)=x^{3}-2x+1$, $a=1$ : $f(1)=1-2+1=0$ et $f'(x)=3x^{2}-2$ donc $f'(1)=1$. 
    $$y=1\times(x-1)+0=\boxed{y=x-1}$$

    **b)** $f(x)=\sqrt{x}$, $a=4$ : $f(4)=2$ et $f'(x)=\dfrac{1}{2\sqrt{x}}$ donc $f'(4)=\dfrac{1}{4}$. 
    $$y=\frac{1}{4}(x-4)+2=\frac{x}{4}-1+2=\boxed{y=\frac{x}{4}+1}$$

    **c)** $f(x)=\mathrm{e}^{x}$, $a=0$ : $f(0)=1$ et $f'(0)=\mathrm{e}^{0}=1$. 
    $$y=1\times(x-0)+1=\boxed{y=x+1}$$

    **d)** $f(x)=\dfrac{1}{x}$, $a=-2$ : $f(-2)=-\dfrac{1}{2}$ et $f'(x)=-\dfrac{1}{x^{2}}$ donc $f'(-2)=-\dfrac{1}{4}$. 
    $$y=-\frac{1}{4}\big(x-(-2)\big)-\frac{1}{2}=-\frac{x}{4}-\frac{1}{2}-\frac{1}{2} =\boxed{y=-\frac{x}{4}-1}$$
     *Attention* au double signe $-$ : $x-a$ vaut ici $x+2$.
- id: "t-03-13"
  feuille: "f-t-03"
  numero: 13
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Pour chacune des fonctions suivantes, identifier la fonction intérieure $u$, puis calculer la dérivée.

    **a)** $f(x)=(2x-7)^{5}$

    **b)** $g(x)=(x^{2}+x+1)^{3}$

    **c)** $h(x)=\sqrt{3x+4}$

    **d)** $k(x)=\dfrac{1}{x^{2}+1}$

    **e)** $m(x)=\mathrm{e}^{5x-2}$

    **f)** $n(x)=\mathrm{e}^{-x^{2}}$

    **g)** $p(x)=\sqrt{x^{2}+9}$

    **h)** $q(x)=(1-x)^{4}$
  corrige: |
    On utilise les cas particuliers de la proposition 3, en n'oubliant jamais le facteur $u'(x)$.

    **a)** $u(x)=2x-7$, $u'(x)=2$, forme $u^{5}$ : $\quad f'(x)=5\times 2\times(2x-7)^{4}=\boxed{10(2x-7)^{4}}$

    **b)** $u(x)=x^{2}+x+1$, $u'(x)=2x+1$, forme $u^{3}$ : $\quad g'(x)=\boxed{3(2x+1)(x^{2}+x+1)^{2}}$

    **c)** $u(x)=3x+4$, $u'(x)=3$, forme $\sqrt{u}$, sur $\left]-\frac{4}{3}\,;+\infty\right[$ : $\quad h'(x)=\boxed{\dfrac{3}{2\sqrt{3x+4}}}$

    **d)** $u(x)=x^{2}+1$, $u'(x)=2x$, forme $\dfrac{1}{u}$ : $\quad k'(x)=-\dfrac{2x}{(x^{2}+1)^{2}}$, soit $\boxed{k'(x)=\dfrac{-2x}{(x^{2}+1)^{2}}}$

    **e)** $u(x)=5x-2$, $u'(x)=5$, forme $\mathrm{e}^{u}$ : $\quad m'(x)=\boxed{5\,\mathrm{e}^{5x-2}}$

    **f)** $u(x)=-x^{2}$, $u'(x)=-2x$, forme $\mathrm{e}^{u}$ : $\quad n'(x)=\boxed{-2x\,\mathrm{e}^{-x^{2}}}$

    **g)** $u(x)=x^{2}+9$, $u'(x)=2x$, forme $\sqrt{u}$ : $\quad p'(x)=\dfrac{2x}{2\sqrt{x^{2}+9}}=\boxed{\dfrac{x}{\sqrt{x^{2}+9}}}$

    **h)** $u(x)=1-x$, $u'(x)=-1$, forme $u^{4}$ : $\quad q'(x)=4\times(-1)\times(1-x)^{3}=\boxed{-4(1-x)^{3}}$

    *L'erreur la plus fréquente* consiste à oublier $u'(x)$ : on écrirait par exemple $5(2x-7)^{4}$ au lieu de $10(2x-7)^{4}$. Un bon réflexe de contrôle : sur un cas simple comme $(2x)^{2}=4x^{2}$, la dérivée vaut $8x$, et non $2\times 2x=4x$.
- id: "t-03-14"
  feuille: "f-t-03"
  numero: 14
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivée, racine carrée]
  noeuds: [ar-deriv]
  notions: [derivable]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Calculer la dérivée de chacune des fonctions suivantes, puis en donner une forme factorisée.

    **1.** $f(x)=x\sqrt{x+1}$ sur $]-1\,;+\infty[$

    **2.** $g(x)=(2x+1)^{3}(x-4)$ sur $\mathbb{R}$

    **3.** $h(x)=\dfrac{\mathrm{e}^{2x}}{x+1}$ sur $]-1\,;+\infty[$

    **4.** $k(x)=\dfrac{\sqrt{x^{2}+1}}{x}$ sur $]0\,;+\infty[$
  corrige: |
    **1.** $f(x)=x\sqrt{x+1}$ sur $]-1\,;+\infty[$, de la forme $uv$ avec $v=\sqrt{x+1}$ : 
    $$f'(x)=1\times\sqrt{x+1}+x\times\frac{1}{2\sqrt{x+1}} =\frac{2(x+1)}{2\sqrt{x+1}}+\frac{x}{2\sqrt{x+1}} =\boxed{\frac{3x+2}{2\sqrt{x+1}}}$$
     *On remarque que* pour additionner, on a écrit $\sqrt{x+1}=\dfrac{(x+1)}{\sqrt{x+1}}$.

    **2.** $g(x)=(2x+1)^{3}(x-4)$ sur $\mathbb{R}$ : 
    $$g'(x)=3\times 2\times(2x+1)^{2}(x-4)+(2x+1)^{3}\times 1 =(2x+1)^{2}\Big[6(x-4)+(2x+1)\Big]=\boxed{(2x+1)^{2}(8x-23)}$$

    **3.** $h(x)=\dfrac{\mathrm{e}^{2x}}{x+1}$ sur $]-1\,;+\infty[$ : 
    $$h'(x)=\frac{2\mathrm{e}^{2x}(x+1)-\mathrm{e}^{2x}\times 1}{(x+1)^{2}} =\frac{\mathrm{e}^{2x}\big(2x+2-1\big)}{(x+1)^{2}} =\boxed{\frac{(2x+1)\,\mathrm{e}^{2x}}{(x+1)^{2}}}$$

    **4.** $k(x)=\dfrac{\sqrt{x^{2}+1}}{x}$ sur $]0\,;+\infty[$ : 
    $$k'(x)=\frac{\dfrac{x}{\sqrt{x^{2}+1}}\times x-\sqrt{x^{2}+1}\times 1}{x^{2}} =\frac{\dfrac{x^{2}-(x^{2}+1)}{\sqrt{x^{2}+1}}}{x^{2}} =\boxed{\frac{-1}{x^{2}\sqrt{x^{2}+1}}}$$
     *Ce qui nous donne* au passage un résultat utile : $k$ est strictement décroissante sur $]0\,;+\infty[$.
- id: "t-03-15"
  feuille: "f-t-03"
  numero: 15
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["limite en l'infini", limite en un réel, asymptote, dérivée, tableau de variations]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}\setminus\{1\}$ par $f(x)=\dfrac{x^{2}+3}{x-1}$.

    **1.** Déterminer les limites de $f$ en $+\infty$ et en $-\infty$.

    **2.** Déterminer les limites de $f$ à droite et à gauche en $1$. Qu'en déduit-on pour la courbe de $f$ ?

    **3.** Montrer que, pour tout $x\neq 1$, $\quad f'(x)=\dfrac{(x-3)(x+1)}{(x-1)^{2}}$.

    **4.** Étudier le signe de $f'(x)$, puis dresser le tableau de variations complet de $f$.

    **5.** Préciser les valeurs de $f$ aux deux extremums locaux.
  corrige: |
    **1.** $f(x)=\dfrac{x^{2}+3}{x-1} =\dfrac{x^{2}\left(1+\frac{3}{x^{2}}\right)}{x\left(1-\frac{1}{x}\right)} =\dfrac{x\left(1+\frac{3}{x^{2}}\right)}{1-\frac{1}{x}}$.

    Le quotient des parenthèses tend vers $1$, donc $f(x)$ se comporte comme $x$ : 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{+\infty}\qquad\text{et}\qquad \lim\limits_{x\to -\infty} f(x)=\boxed{-\infty}$$

    **2.** En $1$, le numérateur tend vers $4>0$ : 
    $$\lim_{x\to 1^{+}} f(x)=\boxed{+\infty}\qquad\text{et}\qquad \lim_{x\to 1^{-}} f(x)=\boxed{-\infty}$$
     On en déduit donc que $\boxed{x=1 \text{ est asymptote verticale à la courbe de } f.}$

    **3.** Pour tout $x\neq 1$, avec $u=x^{2}+3$ et $v=x-1$ : 
    $$f'(x)=\frac{2x(x-1)-(x^{2}+3)\times 1}{(x-1)^{2}} =\frac{2x^{2}-2x-x^{2}-3}{(x-1)^{2}} =\frac{x^{2}-2x-3}{(x-1)^{2}} =\boxed{\frac{(x-3)(x+1)}{(x-1)^{2}}}$$
     *Vérification de la factorisation :* $(x-3)(x+1)=x^{2}+x-3x-3=x^{2}-2x-3$. ✓

    **4.** Le dénominateur $(x-1)^{2}$ est strictement positif pour $x\neq 1$ : le signe de $f'(x)$ est donc celui du produit $(x-3)(x+1)$.

    ![Figure](documents/figures/a03e1d5215148e63.svg)

    **5.** $f(-1)=\dfrac{(-1)^{2}+3}{-1-1}=\dfrac{4}{-2}=\boxed{-2}$ (maximum local)

    $f(3)=\dfrac{3^{2}+3}{3-1}=\dfrac{12}{2}=\boxed{6}$ (minimum local)

    *On remarque que* le maximum local $-2$ est ici *inférieur* au minimum local $6$ : c'est possible parce que la fonction n'est pas définie en $1$, et que ces extremums sont seulement **locaux**.
- id: "t-03-16"
  feuille: "f-t-03"
  numero: 16
  partie: "Dérivation"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [limite en un réel, dérivée, fonction composée, tangente, racine carrée]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable, composee]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse, en justifiant.

    **1.** La dérivée de $x\mapsto (x^{2}+1)^{5}$ est $x\mapsto 5(x^{2}+1)^{4}$.

    **2.** La dérivée de $x\mapsto \mathrm{e}^{3x}$ est $x\mapsto 3\,\mathrm{e}^{3x}$.

    **3.** La dérivée de $x\mapsto \dfrac{1}{u(x)}$ est $x\mapsto -\dfrac{1}{u'(x)}$.

    **4.** Si $u$ est dérivable et vérifie $u(x)\geqslant 0$ sur $I$, alors $\sqrt{u}$ est dérivable sur $I$.

    **5.** La fonction $x\mapsto \sqrt{x^{2}+1}$ est dérivable sur $\mathbb{R}$.

    **6.** Pour toutes fonctions $f$ et $u$ dérivables, $(f\circ u)'=f'\circ u'$.
  corrige: |
    **1.** **Fausse**. On oublie le facteur $u'$. Avec $u(x)=x^{2}+1$, on a $u'(x)=2x$ et 
    $$\left[(x^{2}+1)^{5}\right]'=5\times 2x\times (x^{2}+1)^{4}=\boxed{10x(x^{2}+1)^{4}}$$

    **2.** **Vraie**. Avec $u(x)=3x$, $u'(x)=3$, la formule $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}$ donne bien $3\,\mathrm{e}^{3x}$.

    **3.** **Fausse**. La formule correcte est $\left(\dfrac{1}{u}\right)'=-\dfrac{u'}{u^{2}}$. *Contre-exemple :* avec $u(x)=x$, la dérivée de $\frac{1}{x}$ est $-\frac{1}{x^{2}}$, alors que la formule proposée donnerait $-\frac{1}{1}=-1$.

    **4.** **Fausse**. Il faut $u(x)>0$ **strictement**. *Contre-exemple :* $u(x)=x$ sur $I=[0\,;+\infty[$ vérifie bien $u(x)\geqslant 0$, mais $\sqrt{x}$ n'est pas dérivable en $0$ (sa courbe y admet une tangente verticale).

    **5.** **Vraie**. Pour tout réel $x$, $x^{2}+1\geqslant 1>0$ : la condition $u>0$ est satisfaite sur $\mathbb{R}$ tout entier, et $\left(\sqrt{x^{2}+1}\right)'=\dfrac{x}{\sqrt{x^{2}+1}}$.

    **6.** **Fausse**. La formule correcte est $(f\circ u)'(x)=u'(x)\times f'\big(u(x)\big)$. *Contre-exemple :* avec $f(t)=t^{2}$ et $u(x)=2x$, on a $(f\circ u)(x)=4x^{2}$ donc $(f\circ u)'(x)=8x$ ; tandis que $f'\big(u'(x)\big)=f'(2)=4$. Les deux expressions n'ont même pas la même nature : l'une dépend de $x$, l'autre non.
- id: "t-03-17"
  feuille: "f-t-03"
  numero: 17
  partie: "Convexité"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [limite en un réel, dérivée, tableau de variations, convexité, "point d'inflexion", dérivée seconde]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    La courbe ci-dessous est celle de la fonction **dérivée** $f'$ d'une fonction $f$ définie et deux fois dérivable sur $\mathbb{R}$.

    ![Figure](documents/figures/a3c14bf422869eea.svg)

    **1.** Déterminer par lecture graphique le signe de $f'(x)$, puis dresser le tableau de variations de $f$.

    **2.** Sur quels intervalles la fonction $f'$ est-elle croissante ? décroissante ?

    **3.** En déduire les intervalles sur lesquels $f$ est convexe, puis ceux sur lesquels elle est concave.

    **4.** La courbe de $f$ admet-elle un point d'inflexion ? Si oui, préciser son abscisse.

    **5.** *Attention au piège :* les abscisses des extremums de $f$ et celle du point d'inflexion sont-elles les mêmes ? Expliquer.
  corrige: |
    La courbe donnée est celle de $f'$ : c'est une parabole tournée vers le haut, coupant l'axe des abscisses en $-1$ et en $3$, et de sommet d'abscisse $1$.

    **1.** Par lecture graphique, $f'(x)>0$ sur $]-\infty\,;-1[$ et sur $]3\,;+\infty[$, et $f'(x)<0$ sur $]-1\,;3[$.

    ![Figure](documents/figures/c97256971d8f5555.svg)

    $f$ admet donc un maximum local en $-1$ et un minimum local en $3$.

    **2.** Toujours graphiquement, $\boxed{f' \text{ est décroissante sur } ]-\infty\,;1] \text{ et croissante sur } [1\,;+\infty[.}$

    **3.** Le cours donne : $f$ est convexe si et seulement si $f'$ est croissante. On en déduit donc : 
    $$\boxed{f \text{ est concave sur } ]-\infty\,;1] \text{ et convexe sur } [1\,;+\infty[.}$$

    **4.** En $x=1$, $f'$ change de sens de variation, donc $f''$ y change de signe : la courbe de $f$ admet $\boxed{\text{un point d'inflexion d'abscisse } 1.}$

    **5.** **Non, ce ne sont pas les mêmes abscisses.** Les extremums de $f$ se lisent là où $f'$ *s'annule* ($x=-1$ et $x=3$), c'est-à-dire là où la parabole coupe l'axe des abscisses. Le point d'inflexion se lit là où $f'$ atteint son *extremum* ($x=1$), c'est-à-dire au sommet de la parabole. Confondre $f'(x)=0$ et $f''(x)=0$ est l'erreur la plus courante du chapitre.
