  enonce: |
    *Calcul d'une racine carrée par la méthode de Newton.*

    **Partie A**

    **1.** Soient $f$ une fonction dérivable sur un intervalle $I$, et $x_0$ un élément de $I$ tel que $f'(x_0)\neq 0$. Calculer l'abscisse $x_1$ du point en lequel la tangente à la courbe de $f$ au point d'abscisse $x_0$ coupe l'axe des abscisses.

    **2.** On suppose que $a$ est un réel positif, et que $f$ est la fonction définie sur $\mathbb{R}$ par $f(x)=x^{2}-a$. Avec les notations précédentes, vérifier que : 
    $$x_1=\frac{1}{2}\left(x_0+\frac{a}{x_0}\right)$$

    **Partie B**

    Soit $a$ un réel strictement positif. La suite $(u_n)$ est définie par son premier terme $u_0>0$ et par la relation de récurrence : 
    $$\text{pour tout } n\in\mathbb{N}, \qquad u_{n+1}=\frac{1}{2}\left(u_n+\frac{a}{u_n}\right) =f_a(u_n)$$
     où la fonction $f_a$ est définie sur $]0\,;+\infty[$ par $f_a(x)=\dfrac{1}{2}\left(x+\dfrac{a}{x}\right)$.

    **3.** Étudier $f_a$ et donner sommairement l'allure de sa courbe.

    **4.** Justifier que la suite $(u_n)$ est bien définie et à valeurs strictement positives.

    **5.** Établir les inégalités : 
    $$\text{pour tout } x>0, \quad f_a(x)\geqslant\sqrt{a} \qquad\text{et}\qquad \text{pour tout } x\geqslant\sqrt{a}, \quad f_a(x)\leqslant x$$

    **6.** Montrer que la suite $(u_n)_{n\geqslant 1}$ est décroissante, puis qu'elle converge vers $\sqrt{a}$.

    **7.** Pour tout entier naturel $n$, on pose $v_n=\dfrac{u_n-\sqrt{a}}{u_n+\sqrt{a}}$. Montrer que $v_{n+1}=v_n^{2}$ pour tout entier naturel $n$.

    **8.** Exprimer $v_n$ en fonction de $n$.

    **9.** Montrer que, pour tout $n\in\mathbb{N}^{*}$ : 
    $$0\leqslant u_n-\sqrt{a}\leqslant\left(u_1+\sqrt{a}\right) \left(\frac{u_0-\sqrt{a}}{u_0+\sqrt{a}}\right)^{2^{n}}$$
     Conclure que $(u_n)$ converge vers $\sqrt{a}$.

    **10.** On prend $a=2$ et $u_0=1$. Représenter graphiquement la fonction $f_2$ et les premiers termes de la suite $(u_n)$. Écrire l'inégalité de la question précédente dans ce cas. Comment choisir $n$ pour obtenir une valeur approchée de $\sqrt{2}$ à $10^{-5}$ près ? Faire les calculs correspondants.
  corrige: |
    **Partie A**

    **1.** La tangente au point d'abscisse $x_0$ a pour équation $y=f'(x_0)(x-x_0)+f(x_0)$. Elle coupe l'axe des abscisses au point où $y=0$, ce qui donne, puisque $f'(x_0)\neq 0$ : 
    $$\boxed{x_1=x_0-\frac{f(x_0)}{f'(x_0)}}$$

    **2.** Ici $f'(x)=2x$, et l'hypothèse $f'(x_0)\neq 0$ signifie $x_0\neq 0$. Alors : 
    $$x_1=x_0-\frac{x_0^{2}-a}{2x_0}=\frac{2x_0^{2}-x_0^{2}+a}{2x_0}=\frac{x_0^{2}+a}{2x_0} =\boxed{\frac{1}{2}\left(x_0+\frac{a}{x_0}\right)}$$
     Ainsi, la suite de la partie B consiste à remplacer chaque terme par l'abscisse où la tangente à la parabole $y=x^{2}-a$ coupe l'axe des abscisses, c'est-à-dire là où elle s'annule « si elle était droite ».

    **Partie B**

    **3.** La fonction $f_a$ est dérivable sur $]0\,;+\infty[$, et : 
    $$f_a'(x)=\frac{1}{2}\left(1-\frac{a}{x^{2}}\right)=\frac{x^{2}-a}{2x^{2}} =\frac{\left(x-\sqrt{a}\right)\left(x+\sqrt{a}\right)}{2x^{2}}$$
     dont le signe est celui de $x-\sqrt{a}$. Par ailleurs $\dfrac{a}{x}\to+\infty$ lorsque $x\to 0^{+}$, et $x\to+\infty$ lorsque $x\to+\infty$ ; enfin $f_a\left(\sqrt{a}\right)=\frac{1}{2}\left(\sqrt{a}+\sqrt{a}\right)=\sqrt{a}$.

    ![Figure](documents/figures/70d7a55a9e2210f0.svg)

    La courbe admet l'axe des ordonnées pour asymptote verticale. De plus, $f_a(x)-\dfrac{x}{2}=\dfrac{a}{2x}$ tend vers $0$ en $+\infty$ : comme à l'exercice 35, la courbe se rapproche indéfiniment de la droite d'équation $y=\frac{x}{2}$, en restant au-dessus.

    **4.** Par récurrence : $u_0>0$, et si $u_n>0$, alors $u_{n+1}=\frac{1}{2}\left(u_n+\frac{a}{u_n}\right)$ est bien défini, et strictement positif comme demi-somme de deux réels strictement positifs. 
    $$\boxed{(u_n) \text{ est bien définie et à valeurs dans } ]0\,;+\infty[.}$$

    **5.** La question 3 montre que $\sqrt{a}$ est le minimum de $f_a$, d'où la première inégalité. On peut aussi la retrouver par le calcul : 
    $$f_a(x)-\sqrt{a}=\frac{x^{2}-2\sqrt{a}\,x+a}{2x}=\frac{\left(x-\sqrt{a}\right)^{2}}{2x}\geqslant 0$$
     Pour la seconde, si $x\geqslant\sqrt{a}$, alors $x^{2}\geqslant a$, et : 
    $$f_a(x)-x=\frac{1}{2}\left(\frac{a}{x}-x\right)=\frac{a-x^{2}}{2x}\leqslant 0$$

    $$\boxed{f_a(x)\geqslant\sqrt{a} \text{ pour } x>0 \qquad\text{et}\qquad f_a(x)\leqslant x \text{ pour } x\geqslant\sqrt{a}}$$

    **6.** Pour $n\geqslant 1$, on a $u_n=f_a(u_{n-1})\geqslant\sqrt{a}$ par la première inégalité, puis $u_{n+1}=f_a(u_n)\leqslant u_n$ par la seconde. La suite $(u_n)_{n\geqslant 1}$ est donc décroissante et minorée par $\sqrt{a}$ : elle converge vers une limite $\ell\geqslant\sqrt{a}>0$. La fonction $f_a$ étant continue en $\ell$, le passage à la limite dans $u_{n+1}=f_a(u_n)$ donne, comme à l'exercice 33 : 
    $$\ell=\frac{1}{2}\left(\ell+\frac{a}{\ell}\right) \iff 2\ell^{2}=\ell^{2}+a \iff \ell^{2}=a$$
     Comme $\ell>0$ : 
    $$\boxed{(u_n) \text{ converge vers } \sqrt{a}.}$$
     *Remarque :* le premier terme $u_0$ peut être inférieur à $\sqrt{a}$ ; c'est pourquoi la décroissance n'est établie qu'à partir du rang $1$.

    **7.** On a obtenu à la question 5 l'égalité $u_{n+1}-\sqrt{a}=\dfrac{\left(u_n-\sqrt{a}\right)^{2}}{2u_n}$. De même, $u_{n+1}+\sqrt{a}=\dfrac{u_n^{2}+2\sqrt{a}\,u_n+a}{2u_n}=\dfrac{\left(u_n+\sqrt{a}\right)^{2}}{2u_n}$. En faisant le quotient, les $2u_n$ se simplifient : 
    $$\boxed{v_{n+1}=\frac{\left(u_n-\sqrt{a}\right)^{2}}{\left(u_n+\sqrt{a}\right)^{2}}=v_n^{2}}$$

    **8.** Par récurrence, $v_1=v_0^{2}$, $v_2=v_0^{4}$, $v_3=v_0^{8}$ et, si $v_n=v_0^{2^{n}}$, alors $v_{n+1}=\left(v_0^{2^{n}}\right)^{2}=v_0^{2^{n+1}}$ : 
    $$\boxed{v_n=v_0^{\,2^{n}}=\left(\frac{u_0-\sqrt{a}}{u_0+\sqrt{a}}\right)^{2^{n}}}$$

    **9.** Soit $n\geqslant 1$. De la définition de $v_n$, on tire $u_n-\sqrt{a}=v_n\left(u_n+\sqrt{a}\right)$. D'après la question 6, $u_n\geqslant\sqrt{a}$ et $u_n\leqslant u_1$, la suite étant décroissante à partir du rang $1$. Comme de plus $v_n=v_0^{2^{n}}\geqslant 0$, l'exposant $2^{n}$ étant pair : 
    $$\boxed{0\leqslant u_n-\sqrt{a}\leqslant\left(u_1+\sqrt{a}\right)\left(\frac{u_0-\sqrt{a}}{u_0+\sqrt{a}}\right)^{2^{n}}}$$
     Puisque $u_0>0$, on a $\left|u_0-\sqrt{a}\right|<u_0+\sqrt{a}$, donc $q=\left|v_0\right|<1$. Or $2^{n}\geqslant n$, donc $0\leqslant q^{2^{n}}\leqslant q^{n}$, et $q^{n}$ tend vers $0$. Le théorème des gendarmes montre à nouveau que $(u_n)$ converge vers $\sqrt{a}$, mais il fournit en plus une estimation de l'écart.

    **10.** Avec $a=2$ et $u_0=1$, on calcule $u_1=\frac{3}{2}$, $u_2=\frac{17}{12}$ et $u_3=\frac{577}{408}$. Le graphique ci-dessous représente la fonction $f_2$, la droite d'équation $y=x$, et la construction des premiers termes.

    ![Figure](documents/figures/fae260899ac843bc.svg)

    On part de $u_0$ sur l'axe des abscisses, on monte jusqu'à la courbe pour lire $u_1=f_2(u_0)$, puis on revient à la droite $y=x$ pour reporter $u_1$ en abscisse, et ainsi de suite. Dès le deuxième terme, la construction est indiscernable du point d'intersection de la courbe et de la droite, d'abscisse $\sqrt{2}$.

    Ici $v_0=\dfrac{1-\sqrt{2}}{1+\sqrt{2}}=-\left(\sqrt{2}-1\right)^{2}=-\left(3-2\sqrt{2}\right)$, et l'inégalité de la question 9 devient : 
    $$0\leqslant u_n-\sqrt{2}\leqslant\left(\frac{3}{2}+\sqrt{2}\right)\left(3-2\sqrt{2}\right)^{2^{n}}$$
     avec $3-2\sqrt{2}\approx 0{,}172$. Le majorant vaut environ $8{,}6\times 10^{-2}$ pour $n=1$, $2{,}5\times 10^{-3}$ pour $n=2$ et $2{,}2\times 10^{-6}$ pour $n=3$. Il suffit donc de prendre $n=3$ : 
    $$\boxed{u_3=\frac{577}{408}\approx 1{,}414\,216 \quad\text{approche } \sqrt{2} \text{ à } 10^{-5} \text{ près.}}$$
     En effet, $\sqrt{2}\approx 1{,}414\,214$, et l'écart réel vaut environ $2{,}1\times 10^{-6}$.

    *Remarque :* les écarts successifs $u_n-\sqrt{2}$ valent environ $8{,}6\times 10^{-2}$, $2{,}5\times 10^{-3}$, $2{,}1\times 10^{-6}$ puis $1{,}6\times 10^{-12}$ : le nombre de décimales exactes double à chaque étape. La dichotomie de l'exercice 27 n'en gagne qu'une toutes les trois ou quatre étapes. Cet algorithme, déjà connu de Héron d'Alexandrie, a été généralisé au XVIIᵉ siècle par Newton et Raphson à des équations quelconques, grâce à la construction de la partie A.

