  enonce: |
    Soient $a$ et $b$ deux réels tels que $a<b$, $K\in[0\,;1[$ et $f$ une fonction dérivable sur $[a\,;b]$, à valeurs dans $[a\,;b]$, telle que : 
    $$\text{pour tout } x\in[a\,;b], \qquad \left|f'(x)\right|\leqslant K$$
     On sait depuis l'exercice 41 que $f$ admet un point fixe $c\in[a\,;b]$. Soit $(u_n)$ la suite définie par $u_0\in[a\,;b]$ et, pour tout entier naturel $n$, $u_{n+1}=f(u_n)$. En utilisant l'exercice 43, montrer que, pour tout entier naturel $n$ : 
    $$\left|u_n-c\right|\leqslant K^{n}\left|u_0-c\right|$$
     Qu'en déduit-on sur la suite $(u_n)$ ?
  corrige: |
    **Préliminaires.** La fonction $f$ est dérivable, donc continue, sur $[a\,;b]$ ; elle est à valeurs dans $[a\,;b]$, et l'exercice 41 fournit un point fixe $c$. Une récurrence immédiate montre que tous les termes $u_n$ appartiennent à $[a\,;b]$ : c'est vrai pour $u_0$, et si $u_n\in[a\,;b]$, alors $u_{n+1}=f(u_n)\in[a\,;b]$. Enfin, l'exercice 43 s'applique avec la constante $K$ : pour tous $x$ et $y$ de $[a\,;b]$, on a $\left|f(y)-f(x)\right|\leqslant K\,|y-x|$.

    **Récurrence.** Pour $n=0$, l'inégalité $|u_0-c|\leqslant K^{0}|u_0-c|$ est une égalité. Supposons $|u_n-c|\leqslant K^{n}|u_0-c|$ pour un entier $n$. Comme $u_n$ et $c$ sont dans $[a\,;b]$ et que $c=f(c)$ : 
    $$\left|u_{n+1}-c\right|=\left|f(u_n)-f(c)\right|\leqslant K\,|u_n-c|\leqslant K\times K^{n}|u_0-c| =K^{n+1}|u_0-c|$$

    $$\boxed{\text{pour tout entier naturel } n, \quad |u_n-c|\leqslant K^{n}|u_0-c|}$$
     **Conclusion.** Comme $0\leqslant K<1$, la suite géométrique $\left(K^{n}\right)$ tend vers $0$. On a $0\leqslant|u_n-c|\leqslant K^{n}|u_0-c|$, et le théorème des gendarmes donne $|u_n-c|\to 0$. 
    $$\boxed{\text{La suite } (u_n) \text{ converge vers } c, \text{ et l'écart est divisé au moins par } \frac{1}{K} \text{ à chaque étape.}}$$
     *Remarque :* le point fixe est ici *unique*. Si $c'$ en était un autre, on aurait $|c-c'|=|f(c)-f(c')|\leqslant K|c-c'|$, soit $(1-K)|c-c'|\leqslant 0$, donc $c=c'$.

    *Application à l'exercice 33 :* la fonction $f:x\mapsto\sqrt{4x+5}$ est croissante et envoie $[0\,;5]$ dans $\left[\sqrt{5}\,;5\right]\subset[0\,;5]$, avec $f'(x)=\dfrac{2}{\sqrt{4x+5}}\leqslant\dfrac{2}{\sqrt{5}}=K\approx 0{,}894$. Son point fixe est $c=5$, et l'on obtient, pour $u_0=0$ : 
    $$|u_n-5|\leqslant 5\left(\frac{2}{\sqrt{5}}\right)^{n}$$
     Cette majoration garantit une précision de $10^{-3}$ dès $n=77$, alors que l'exercice 33 a constaté qu'elle est atteinte dès $n=10$. La majoration est pessimiste, car elle utilise la pente maximale $\frac{2}{\sqrt{5}}$ atteinte en $0$, alors qu'au voisinage de la limite la pente ne vaut plus que $f'(5)=\frac{2}{5}$. Elle a cependant un mérite que l'exercice 33 n'avait pas : elle donne une vitesse de convergence garantie, et non une simple convergence.
