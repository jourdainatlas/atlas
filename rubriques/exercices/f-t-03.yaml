  enonce: |
    Soit $f$ une fonction continue et deux fois dérivable sur $\mathbb{R}$, dont le tableau de variations est le suivant :

    ![Figure](documents/figures/894eabb1fa45c09c.svg)

    **1.** Déterminer le nombre de solutions de l'équation $f(x)=0$, en justifiant chaque branche par le corollaire du théorème des valeurs intermédiaires.

    **2.** Reprendre la question pour $f(x)=5$, puis pour $f(x)=-3$.

    **3.** Combien l'équation $f(x)=4$ admet-elle de solutions ? Attention, la réponse n'est pas $1$.

    **4.** Combien l'équation $f(x)=-2$ admet-elle de solutions ?

    **5.** Peut-on déterminer, à partir de ce seul tableau, le nombre de points d'inflexion de la courbe de $f$ ? Justifier.
  corrige: |
    On raisonne branche par branche. Sur chacune des trois branches, $f$ est continue et **strictement** monotone : le corollaire du théorème des valeurs intermédiaires s'applique, et l'équation $f(x)=k$ y admet une solution si et seulement si $k$ appartient à l'intervalle image, auquel cas cette solution est unique.

    Les trois intervalles images sont : 
    $$\text{branche 1 : } ]-\infty\,;4] \qquad \text{branche 2 : } [-2\,;4] \qquad \text{branche 3 : } [-2\,;+\infty[$$

    **1.** $k=0$ : on a $0\in\,]-\infty\,;4]$, $0\in[-2\,;4]$ et $0\in[-2\,;+\infty[$. Chaque branche fournit exactement une solution : 
    $$\boxed{\text{l'équation } f(x)=0 \text{ admet } 3 \text{ solutions.}}$$

    **2.** $k=5$ : $5>4$, donc $5$ n'appartient ni à l'image de la branche 1, ni à celle de la branche 2. Il appartient en revanche à $[-2\,;+\infty[$ : 
    $$\boxed{\text{l'équation } f(x)=5 \text{ admet } 1 \text{ solution.}}$$

    $k=-3$ : $-3<-2$, donc $-3$ n'appartient pas aux images des branches 2 et 3. Il appartient à $]-\infty\,;4]$ : 
    $$\boxed{\text{l'équation } f(x)=-3 \text{ admet } 1 \text{ solution.}}$$

    **3.** $k=4$ : la valeur $4$ est **atteinte**, en $x=-1$. Sur la branche 1, $f$ croît strictement de $-\infty$ jusqu'à $4$ : la valeur $4$ n'y est atteinte qu'à l'extrémité $x=-1$. Sur la branche 2, $f$ décroît de $4$ à $-2$ : elle vaut $4$ au point de départ, qui est *le même* $x=-1$ — cette solution ne doit pas être comptée deux fois. Sur la branche 3, $f$ croît de $-2$ à $+\infty$ et $4\in\,]-2\,;+\infty[$ : une solution supplémentaire. 
    $$\boxed{\text{l'équation } f(x)=4 \text{ admet } 2 \text{ solutions.}}$$

    **4.** $k=-2$ : cette valeur est le minimum, atteint en $x=3$, qui est commun aux branches 2 et 3 (donc une seule solution pour ces deux branches). Sur la branche 1, $-2\in\,]-\infty\,;4]$ donne une solution supplémentaire. 
    $$\boxed{\text{l'équation } f(x)=-2 \text{ admet } 2 \text{ solutions.}}$$

    **5.** **Non.** Le tableau de variations renseigne sur le *signe* de $f'$, mais absolument pas sur les *variations* de $f'$, donc pas sur le signe de $f''$. Or ce sont les changements de signe de $f''$ qui donnent les points d'inflexion. Pour répondre, il faudrait disposer du tableau de variations de $f'$, ou du tableau de signes de $f''$.

    *Piège classique :* on a envie de répondre « il y a un point d'inflexion entre le maximum et le minimum ». C'est vraisemblable, mais nullement démontrable à partir de ce seul tableau — et le nombre exact de points d'inflexion peut être bien plus grand.
- id: "t-03-26"
  feuille: "f-t-03"
  numero: 26
  titre: "Python"
  partie: "Continuité et théorème des valeurs intermédiaires"
  etoiles: 2
  types: [Algorithmique]
  mots_cles: [dichotomie, valeur approchée, Python]
  noeuds: [c-tvi]
  notions: []
  page_enonce: 8
  page_corrige: 19
  enonce: |
    On reprend la fonction $f$ de l'exercice 24, définie par $f(x)=x^{3}+3x-5$, et l'on cherche à approcher sa racine $\alpha$. On dispose du script suivant :

    ```python
    def f(x):
        return x**3 + 3*x - 5

    def balayage(a, b, p):
        x = a
        while f(x) < 0:
            x = x + p
        return x - p, x
    ```

    **1.** Que renvoie l'appel `balayage(1, 2, 0.1)` ? Interpréter le résultat.

    **2.** Pourquoi la boucle `while` s'arrête-t-elle nécessairement ? Quelle propriété de $f$ établie à l'exercice 24 le garantit ?

    **3.** Comment modifier l'appel pour obtenir un encadrement de $\alpha$ d'amplitude $10^{-3}$ ?

    **4.** Le paramètre `b` n'est jamais utilisé dans la fonction `balayage`. Proposer une modification du script qui l'utilise, de façon à éviter une boucle infinie si la fonction ne s'annulait pas sur $[a\,;b]$.

    **5.** Combien de valeurs de $x$ la fonction `balayage` teste-t-elle, au maximum, pour un pas $p=10^{-3}$ sur l'intervalle $[1\,;2]$ ? Et pour $p=10^{-6}$ ? Ce procédé vous semble-t-il économe ?
  corrige: |
    **1.** La variable `x` part de $1$ et progresse de $0{,}1$ tant que $f(x)$ reste strictement négative : 
    $$f(1)=-1<0 \quad\to\quad f(1{,}1)\approx -0{,}369<0 \quad\to\quad f(1{,}2)\approx 0{,}328>0 \ \text{ : arrêt}$$
     La fonction renvoie alors le couple $\texttt{(x - p, x)}$, soit : 
    $$\boxed{\texttt{balayage(1, 2, 0.1)} \text{ renvoie } (1{,}1\,;1{,}2)}$$
     ce qui signifie que $\alpha$ appartient à l'intervalle $[1{,}1\,;1{,}2]$.

    *Remarque d'informatique :* en pratique, Python affichera plutôt

    `(1.1000000000000003, 1.2000000000000004)`

    Les nombres décimaux sont codés de façon approchée en machine, et l'accumulation d'additions de $0{,}1$ fait apparaître ces écarts minuscules. Cela ne change rien à l'interprétation mathématique.

    **2.** La boucle s'arrête parce que $f$ est strictement croissante et tend vers $+\infty$ : au-delà de $\alpha$, $f$ est strictement positive. Comme `x` augmente de $p>0$ à chaque tour, elle finit par dépasser $\alpha$ en un nombre fini d'étapes, et la condition `f(x) < 0` devient alors fausse. **C'est la stricte croissance établie à l'exercice 24 qui garantit qu'une fois la condition devenue fausse, elle le reste** — sans elle, la boucle pourrait s'arrêter sur un changement de signe qui n'est pas le bon.

    **3.** Il suffit de réduire le pas : 
    $$\boxed{\texttt{balayage(1, 2, 0.001)}}$$

    **4.** On ajoute la condition d'arrêt sur `b` :

    ```python
    def balayage(a, b, p):
        x = a
        while f(x) < 0 and x <= b:
            x = x + p
        if x > b:
            return None      # aucun changement de signe detecte sur [a ; b]
        return x - p, x
    ```

    **5.** Sur $[1\,;2]$ avec un pas $p=10^{-3}$, la boucle teste au maximum 
    $$\frac{2-1}{10^{-3}}=\boxed{1\,000 \text{ valeurs}}$$
     et pour $p=10^{-6}$, jusqu'à $\boxed{1\,000\,000 \text{ valeurs}}$.

    **Ce procédé n'est pas économe du tout :** pour gagner un chiffre décimal, il faut multiplier le nombre de calculs par $10$. C'est précisément ce que la dichotomie va corriger.
- id: "t-03-27"
  feuille: "f-t-03"
  numero: 27
  titre: "Méthode de dichotomie"
  partie: "Continuité et théorème des valeurs intermédiaires"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [continuité, théorème des valeurs intermédiaires, dichotomie, valeur approchée, Python, exponentielle, polynôme, suite]
  noeuds: [continuite, c-tvi, cx-exponentielle, ar-suites]
  notions: [continuite, exponentielle, suite]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    On reprend encore la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=x^{3}+3x-5$, dont on a montré à l'exercice 24 qu'elle s'annule en un unique réel $\alpha$. Le balayage de l'exercice précédent est simple, mais coûteux. On va lui substituer une méthode bien plus rapide, qui repose sur une idée unique : *couper l'intervalle en deux, et ne conserver que la moitié qui contient $\alpha$*.

    **Partie A : le principe, à la main**

    **1.** Rappeler pourquoi $f(1)<0$ et $f(2)>0$ permettent d'affirmer que $\alpha\in\,]1\,;2[$.

    **2.** Calculer $f(1{,}5)$. En comparant son signe à celui de $f(1)$ et de $f(2)$, dire dans laquelle des deux moitiés $]1\,;1{,}5[$ ou $]1{,}5\,;2[$ se trouve $\alpha$. Quelle est l'amplitude du nouvel encadrement ?

    **3.** Recommencer avec le milieu de l'intervalle obtenu, et ainsi de suite. Recopier et compléter le tableau suivant, où $a_n$ et $b_n$ désignent les bornes de l'encadrement obtenu après $n$ étapes, et $m_n$ le milieu de $[a_n\,;b_n]$ :

    $$\begin{array}{|c|c|c|c|c|c|} \hline n & a_n & b_n & m_n & \text{signe de }f(m_n) & \text{amplitude }b_n-a_n \\ \hline 0 & 1 & 2 & 1{,}5 &  & 1 \\ \hline 1 &  &  &  &  &  \\ \hline 2 &  &  &  &  &  \\ \hline 3 &  &  &  &  &  \\ \hline 4 &  &  &  &  &  \\ \hline \end{array}$$

    **4.** Donner l'encadrement de $\alpha$ obtenu au bout de $4$ étapes, ainsi que son amplitude.

    **Partie B : pourquoi cela fonctionne, et à quelle vitesse**

    **5.** À chaque étape, on remplace $[a_n\,;b_n]$ par l'une de ses deux moitiés. Justifier que : 
    $$b_n-a_n=\dfrac{1}{2^{n}}$$

    **6.** Expliquer précisément à quel moment on utilise le théorème des valeurs intermédiaires, et à quel moment on utilise la stricte monotonie de $f$. Que resterait-il de la méthode si $f$ n'était pas continue ?

    **7.** Déterminer le plus petit entier $n$ tel que $b_n-a_n<10^{-2}$, puis celui tel que $b_n-a_n<10^{-3}$.

    **8.** Le balayage de pas $10^{-3}$ de l'exercice 26 demandait jusqu'à $1\,000$ calculs de $f$. Combien la dichotomie en demande-t-elle pour la même précision ? Commenter.

    **9.** Que se passerait-il si l'on appliquait la dichotomie à une fonction continue admettant *trois* racines dans $[a\,;b]$, avec $f(a)<0$ et $f(b)>0$ ? La méthode échouerait-elle, ou bien fournirait-elle l'une des racines ?

    **Partie C : mise en œuvre en Python**

    **10.** Recopier et compléter le script suivant, qui renvoie un encadrement de $\alpha$ d'amplitude strictement inférieure à `e` :

    ```python
    def dichotomie(a, b, e):
        while b - a >= e:
            m = (a + b) / 2
            if f(m) < 0:
                a = ...
            else:
                b = ...
        return a, b
    ```

    **11.** Justifier que la condition du `while` finit toujours par devenir fausse.

    **12.** Modifier ce script pour qu'il renvoie également le nombre d'étapes effectuées.
  corrige: |
    **Partie A : le principe, à la main**

    **1.** $f$ est continue sur $[1\,;2]$ (fonction polynôme) et $f(1)=-1<0<9=f(2)$. D'après le théorème des valeurs intermédiaires, l'équation $f(x)=0$ admet au moins une solution dans $]1\,;2[$ ; et comme $f$ est strictement croissante, cette solution est unique. Donc $\boxed{\alpha\in\,]1\,;2[.}$

    **2.** $f(1{,}5)=1{,}5^{3}+3\times 1{,}5-5=3{,}375+4{,}5-5=\boxed{2{,}875>0}$

    Cette valeur est du *même signe* que $f(2)$, et de signe contraire à $f(1)$ : le changement de signe a donc lieu entre $1$ et $1{,}5$. On en déduit donc que 
    $$\boxed{\alpha\in\,]1\,;1{,}5[ \qquad \text{amplitude : } 0{,}5}$$

    **3.** On poursuit, en calculant à chaque étape le milieu puis le signe de son image :

    $$\begin{array}{|c|c|c|c|c|c|} \hline n & a_n & b_n & m_n & \text{signe de }f(m_n) & \text{amplitude }b_n-a_n \\ \hline 0 & 1 & 2 & 1{,}5 & +\text{ \ \ }(2{,}875) & 1 \\ \hline 1 & 1 & 1{,}5 & 1{,}25 & +\text{ \ \ }(0{,}703) & 0{,}5 \\ \hline 2 & 1 & 1{,}25 & 1{,}125 & -\text{ \ \ }(-0{,}201) & 0{,}25 \\ \hline 3 & 1{,}125 & 1{,}25 & 1{,}1875 & +\text{ \ \ }(0{,}237) & 0{,}125 \\ \hline 4 & 1{,}125 & 1{,}1875 & 1{,}15625 & +\text{ \ \ }(0{,}015) & 0{,}0625 \\ \hline \end{array}$$

    *Règle de mise à jour :* si $f(m_n)<0$, alors $\alpha>m_n$ (car $f$ est croissante) et l'on remplace $a_n$ par $m_n$ ; si $f(m_n)>0$, alors $\alpha<m_n$ et l'on remplace $b_n$ par $m_n$.

    **4.** Après $4$ étapes : 
    $$\boxed{1{,}125<\alpha<1{,}1875 \qquad\text{d'amplitude}\qquad 0{,}0625=\frac{1}{16}}$$
     *Vérification :* on avait trouvé $\alpha\approx 1{,}155$ à l'exercice 24, ce qui appartient bien à cet intervalle. ✓

    **Partie B : pourquoi cela fonctionne, et à quelle vitesse**

    **5.** À chaque étape, on conserve exactement l'une des deux moitiés de $[a_n\,;b_n]$, donc 
    $$b_{n+1}-a_{n+1}=\frac{b_n-a_n}{2}$$
     La suite des amplitudes est donc géométrique de raison $\frac{1}{2}$ et de premier terme $b_0-a_0=2-1=1$. On en déduit donc que 
    $$\boxed{b_n-a_n=1\times\left(\frac{1}{2}\right)^{n}=\frac{1}{2^{n}}}$$

    **6.** **Le théorème des valeurs intermédiaires** sert à garantir qu'un changement de signe entraîne la présence d'une racine : c'est lui qui autorise, à chaque étape, à affirmer que la moitié conservée contient bien $\alpha$. **La stricte monotonie** sert à garantir que cette racine est *unique*, donc que les deux moitiés ne peuvent pas en contenir chacune une, et que l'intervalle conservé est bien le bon.

    Sans continuité, tout s'effondre : la fonction $x\mapsto \dfrac{1}{x}$ sur $[-1\,;1]$ vérifie $f(-1)=-1<0<1=f(1)$, et pourtant elle ne s'annule jamais. La dichotomie appliquée à cette fonction convergerait vers $0$, qui n'est pas une racine mais un point de discontinuité.

    **7.** On cherche le plus petit entier $n$ tel que $\dfrac{1}{2^{n}}<10^{-2}$, c'est-à-dire $2^{n}>100$. Or $2^{6}=64$ et $2^{7}=128$, donc $\boxed{n=7}$.

    De même, $\dfrac{1}{2^{n}}<10^{-3}$ équivaut à $2^{n}>1\,000$. Or $2^{9}=512$ et $2^{10}=1\,024$, donc $\boxed{n=10}$.

    **8.** La dichotomie demande $\boxed{10 \text{ calculs de } f}$ pour une précision de $10^{-3}$, contre jusqu'à $1\,000$ pour le balayage.

    **Commentaire.** Le balayage divise l'amplitude par $10$ au prix de $10$ fois plus de calculs : le coût est *proportionnel* à la précision. La dichotomie, elle, divise l'amplitude par $2$ à chaque calcul supplémentaire : gagner un chiffre décimal ne coûte que $3$ ou $4$ étapes de plus. C'est la différence entre une croissance linéaire et une croissance exponentielle du gain de précision.

    **9.** **La méthode n'échoue pas.** À chaque étape, le signe de $f(m_n)$ est soit celui de $f(a_n)$, soit celui de $f(b_n)$ : dans les deux cas, l'une au moins des deux moitiés présente encore un changement de signe, et c'est celle que l'on conserve. Le procédé converge donc vers *une* racine.

    En revanche, $\boxed{\text{on ne contrôle pas laquelle des trois racines on obtient}}$ : cela dépend entièrement des valeurs des milieux successifs. C'est bien la stricte monotonie, et elle seule, qui garantissait jusqu'ici que la racine trouvée était *la* racine.

    **Partie C : mise en œuvre en Python**

    **10.** Comme $f$ est croissante, $f(m)<0$ signifie $m<\alpha$ : c'est donc la borne *gauche* que l'on remonte. Dans le cas contraire, on abaisse la borne droite.

    ```python
    def dichotomie(a, b, e):
        while b - a >= e:
            m = (a + b) / 2
            if f(m) < 0:
                a = m
            else:
                b = m
        return a, b
    ```

    **11.** À chaque tour de boucle, la quantité `b - a` est divisée par $2$ : elle vaut $\dfrac{b_0-a_0}{2^{n}}$ après $n$ tours. Comme $\left(\frac{1}{2}\right)^{n}$ tend vers $0$, elle finit par devenir strictement inférieure à `e`, et la condition du `while` devient fausse. $\boxed{\text{La boucle se termine donc toujours.}}$

    **12.** Il suffit d'ajouter un compteur :

    ```python
    def dichotomie(a, b, e):
        n = 0
        while b - a >= e:
            m = (a + b) / 2
            if f(m) < 0:
                a = m
            else:
                b = m
            n = n + 1
        return a, b, n
    ```
