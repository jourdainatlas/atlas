  noeuds: [ar-deriv, continuite, c-tvi]
  notions: [derivable, continuite]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 168"
  page_enonce: 15
  page_corrige: 35
  enonce: |
    *Le nombre de racines réelles d'une équation de degré $3$.* Soient $p$ et $q$ deux réels et, pour $x$ réel, $f(x)=x^{3}+px+q$. On se propose de déterminer le nombre de réels $x$ tels que $f(x)=0$.

    **1.** On suppose $p\geqslant 0$. Dresser le tableau de variations de $f$ et conclure dans ce cas.

    **2.** On suppose $p<0$. Dresser le tableau de variations de $f$.

    **3.** On suppose $p<0$. Soient $x_1$ et $x_2$ les réels en lesquels $f'$ s'annule. Calculer $f(x_1)\times f(x_2)$ en fonction de $p$ et $q$.

    **4.** Déterminer, en fonction de la quantité 
    $$\Delta=-\left(4p^{3}+27q^{2}\right)$$
     le nombre de racines réelles de l'équation $f(x)=0$. On montrera en particulier que, si $\Delta<0$, l'équation admet une unique racine réelle.
  corrige: |
    La fonction $f$ est un polynôme, donc continue et dérivable sur $\mathbb{R}$, de dérivée $f'(x)=3x^{2}+p$. En factorisant par $x^{3}$, on obtient $\lim\limits_{x\to -\infty}f(x)=-\infty$ et $\lim\limits_{x\to +\infty}f(x)=+\infty$.

    **1.** **Si $p>0$**, alors $f'(x)\geqslant p>0$ pour tout $x$ : la fonction $f$ est strictement croissante sur $\mathbb{R}$. **Si $p=0$**, alors $f(x)=x^{3}+q$ est strictement croissante, comme $x\mapsto x^{3}$. Dans les deux cas :

    ![Figure](documents/figures/8497984aac7004ce.svg)

    La fonction est continue et strictement croissante sur $\mathbb{R}$, et $0$ est compris entre ses limites en $-\infty$ et en $+\infty$. D'après le corollaire du théorème des valeurs intermédiaires : 
    $$\boxed{\text{si } p\geqslant 0, \text{ l'équation } f(x)=0 \text{ admet une unique racine réelle.}}$$

    **2.** **Si $p<0$**, posons $s=\sqrt{-\dfrac{p}{3}}>0$. Alors $f'(x)=3\left(x^{2}-s^{2}\right) =3(x-s)(x+s)$ s'annule en $x_1=-s$ et $x_2=s$ ; elle est strictement positive à l'extérieur de $[x_1\,;x_2]$ et strictement négative à l'intérieur :

    ![Figure](documents/figures/32a9ad1305974d90.svg)

    La fonction $f$ admet un maximum local $f(x_1)$ et un minimum local $f(x_2)$, avec $f(x_1)>f(x_2)$ puisque $f$ est strictement décroissante sur $[x_1\,;x_2]$.

    **3.** On utilise $s^{2}=-\dfrac{p}{3}$ pour simplifier : 
    $$f(\pm s)=\pm s^{3}\pm ps+q=\pm s\left(s^{2}+p\right)+q=\pm s\times\frac{2p}{3}+q$$
     Le produit est donc de la forme $(q+A)(q-A)=q^{2}-A^{2}$, avec $A=\dfrac{2p}{3}s$ : 
    $$f(x_1)\,f(x_2)=q^{2}-\frac{4p^{2}}{9}\,s^{2}=q^{2}-\frac{4p^{2}}{9}\times\left(-\frac{p}{3}\right) \qquad\text{d'où}\qquad \boxed{f(x_1)\,f(x_2)=\frac{4p^{3}+27q^{2}}{27}=-\frac{\Delta}{27}}$$

    **4.** **Cas $p\geqslant 0$.** Alors $\Delta=-4p^{3}-27q^{2}\leqslant 0$, avec égalité seulement si $p=q=0$. La question 1 a montré qu'il y a toujours une unique racine.

    **Cas $p<0$.** On applique le corollaire du théorème des valeurs intermédiaires sur chacun des trois intervalles de stricte monotonie, en lisant le tableau.

    • Si $\Delta>0$, alors $f(x_1)f(x_2)<0$, donc $f(x_1)>0>f(x_2)$ : il y a une racine dans chacun des intervalles $]-\infty\,;x_1[$, $]x_1\,;x_2[$ et $]x_2\,;+\infty[$, soit trois racines.

    • Si $\Delta<0$, les deux extremums sont non nuls et de même signe. S'ils sont tous deux positifs, $f$ ne s'annule que sur $]-\infty\,;x_1[$ ; s'ils sont tous deux négatifs, seulement sur $]x_2\,;+\infty[$. Dans les deux cas, il y a une seule racine.

    • Si $\Delta=0$, l'un des extremums est nul, mais pas les deux puisque $f(x_1)>f(x_2)$. Si par exemple $f(x_1)=0$, alors $x_1$ est racine, $f$ ne s'annule pas ailleurs sur $]-\infty\,;x_2]$, et une seconde racine se trouve dans $]x_2\,;+\infty[$. Il y a deux racines distinctes.

    $$\begin{array}{|c|c|c|c|} \hline  & \Delta<0 & \Delta=0 & \Delta>0 \\ \hline \text{nombre de racines réelles} & 1 & 2\text{ \ (ou }1\text{ si }p=q=0\text{)} & 3 \\ \hline \end{array}$$

    $$\boxed{\text{si } \Delta<0, \text{ l'équation } x^{3}+px+q=0 \text{ admet une unique racine réelle.}}$$

    *Vérification :* pour $x^{3}-3x+1$, étudié à l'exercice 23, on a $p=-3$, $q=1$ et $\Delta=-(-108+27)=81>0$ : on retrouve bien trois racines. Pour $x^{3}+3x-5$, étudié à l'exercice 24, on a $p=3>0$ : une seule racine, ce qu'on avait établi. ✓

    *Remarque :* le signe moins dans la définition de $\Delta$ est choisi pour que, comme pour le trinôme du second degré, un discriminant strictement positif corresponde au nombre maximal de racines réelles.
- id: "t-03-41"
  feuille: "f-t-03"
  numero: 41
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [continuité, théorème des valeurs intermédiaires]
  noeuds: [continuite, c-tvi]
  notions: [continuite]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 172"
  page_enonce: 15
  page_corrige: 36
  enonce: |
    Soient $a$ et $b$ deux réels tels que $a<b$, et $f$ une fonction continue sur $[a\,;b]$ et à valeurs dans $[a\,;b]$. Montrer que $f$ admet un *point fixe*, c'est-à-dire qu'il existe $x$ dans $[a\,;b]$ tel que $f(x)=x$. On écrira cette équation sous la forme $g(x)=0$ pour une certaine fonction $g$.
  corrige: |
    Posons $g(x)=f(x)-x$ pour $x\in[a\,;b]$. La fonction $g$ est continue sur $[a\,;b]$, comme différence de deux fonctions continues, et les points fixes de $f$ sont exactement les solutions de $g(x)=0$.

    Comme $f$ est à valeurs dans $[a\,;b]$, on a $a\leqslant f(a)$ et $f(b)\leqslant b$, c'est-à-dire : 
    $$g(a)=f(a)-a\geqslant 0 \qquad\text{et}\qquad g(b)=f(b)-b\leqslant 0$$
     Le réel $0$ est donc compris entre $g(b)$ et $g(a)$. D'après le théorème des valeurs intermédiaires, il existe $c\in[a\,;b]$ tel que $g(c)=0$, soit $f(c)=c$. 
    $$\boxed{f \text{ admet au moins un point fixe dans } [a\,;b].}$$
     *Interprétation graphique :* la courbe de $f$ relie un point du bord gauche du carré $[a\,;b]\times[a\,;b]$ à un point de son bord droit sans en sortir ; elle coupe donc nécessairement la diagonale d'équation $y=x$.

    *Piège :* les deux hypothèses sont indispensables. Sans la continuité, la fonction qui vaut $1$ sur $\left[0\,;\frac{1}{2}\right]$ et $0$ sur $\left]\frac{1}{2}\,;1\right]$ envoie $[0\,;1]$ dans lui-même sans point fixe. Sans l'hypothèse sur les valeurs, la fonction $x\mapsto x+1$ est continue sur $[0\,;1]$ et n'a aucun point fixe. Enfin, le point fixe n'est pas forcément unique : pour l'identité, tous les points le sont. L'exercice 44 donne une condition qui assure l'unicité.
- id: "t-03-42"
  feuille: "f-t-03"
  numero: 42
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Calcul]
  mots_cles: [dérivée, tableau de variations, continuité, théorème des valeurs intermédiaires, polynôme]
  noeuds: [ar-deriv, continuite, c-tvi]
  notions: [derivable, continuite]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 153 et n° 170"
  page_enonce: 15
  page_corrige: 37
  enonce: |
    Si $f$ est une fonction dérivable sur un intervalle $I$ et qui ne s'annule pas sur $I$, on appelle *dérivée logarithmique* de $f$ la fonction $\dfrac{f'}{f}$.

    **1.** Soient $u$ et $v$ deux fonctions dérivables sur $I$ et qui ne s'annulent pas sur $I$. Exprimer la dérivée logarithmique de $uv$ en fonction de celles de $u$ et de $v$.

    **2.** Généraliser la question précédente à un produit de $n$ facteurs.

    **3.** Soient $n\in\mathbb{N}^{*}$, $a_1<a_2<\dots<a_n$ des nombres réels et $P$ la fonction polynôme définie par : 
    $$P(x)=(x-a_1)(x-a_2)\cdots(x-a_n)$$
     Calculer la dérivée logarithmique de $P$ sur chacun des intervalles où cette fonction est définie.

    **4.** Dresser le tableau de variations de $\dfrac{P'}{P}$.

    **5.** Pour $\alpha$ réel, quel est le nombre de racines de l'équation $P'(x)-\alpha P(x)=0$ ?
  corrige: |
    **1.** Le produit $uv$ ne s'annule pas sur $I$, et : 
    $$\frac{(uv)'}{uv}=\frac{u'v+uv'}{uv}=\boxed{\frac{u'}{u}+\frac{v'}{v}}$$
     La dérivée logarithmique transforme un produit en somme.

    **2.** Montrons par récurrence sur $n\geqslant 1$ que, si $u_1,\dots,u_n$ sont dérivables et ne s'annulent pas sur $I$, alors : 
    $$\frac{(u_1u_2\cdots u_n)'}{u_1u_2\cdots u_n}=\frac{u_1'}{u_1}+\frac{u_2'}{u_2}+\dots+\frac{u_n'}{u_n}$$
     Pour $n=1$, il n'y a rien à démontrer. Si la formule vaut pour $n$ facteurs, on applique la question 1 à $u=u_1\cdots u_n$, qui ne s'annule pas, et à $v=u_{n+1}$ : la dérivée logarithmique de $u_1\cdots u_{n+1}$ vaut celle de $u$, donnée par l'hypothèse de récurrence, augmentée de $\dfrac{u_{n+1}'}{u_{n+1}}$.

    **3.** Le polynôme $P$ s'annule exactement en $a_1,\dots,a_n$. Sa dérivée logarithmique est donc définie sur chacun des $n+1$ intervalles 
    $$]-\infty\,;a_1[\,, \quad ]a_1\,;a_2[\,, \quad \dots, \quad ]a_{n-1}\,;a_n[\,, \quad ]a_n\,;+\infty[$$
     On y applique la question 2 avec $u_k(x)=x-a_k$, qui vérifie $u_k'(x)=1$ : 
    $$\boxed{\frac{P'(x)}{P(x)}=\frac{1}{x-a_1}+\frac{1}{x-a_2}+\dots+\frac{1}{x-a_n}}$$

    **4.** **Sens de variation.** Chaque terme $x\mapsto\dfrac{1}{x-a_k}$ a pour dérivée $-\dfrac{1}{(x-a_k)^{2}}$, donc : 
    $$\left(\frac{P'}{P}\right)'(x)=-\frac{1}{(x-a_1)^{2}}-\dots-\frac{1}{(x-a_n)^{2}}<0$$
     La fonction $\dfrac{P'}{P}$ est strictement décroissante sur chacun des $n+1$ intervalles.

    **Limites.** En $\pm\infty$, chacun des $n$ termes tend vers $0$, donc la somme aussi. Au voisinage de $a_k$, le terme $\dfrac{1}{x-a_k}$ tend vers $+\infty$ à droite et vers $-\infty$ à gauche, tandis que les autres termes ont une limite finie. Ainsi :

    ![Figure](documents/figures/5b0e18647beb4f08.svg)

    Sur $]-\infty\,;a_1[$, la fonction décroît de la limite $0$ vers $-\infty$ : elle prend toutes les valeurs de $]-\infty\,;0[$. Sur chaque intervalle $]a_k\,;a_{k+1}[$, elle décroît de $+\infty$ à $-\infty$. Sur $]a_n\,;+\infty[$, elle décroît de $+\infty$ vers $0$ : elle prend toutes les valeurs de $]0\,;+\infty[$.

    **5.** **Les $a_k$ ne sont pas solutions.** On a $P(a_k)=0$. Écrivons $P(x)=(x-a_k)\,Q_k(x)$, où $Q_k$ est le produit des autres facteurs ; alors $P'(x)=Q_k(x)+(x-a_k)\,Q_k'(x)$, donc $P'(a_k)=Q_k(a_k)$, produit des $a_k-a_j$ pour $j\neq k$, qui est non nul. Ainsi $P'(a_k)-\alpha P(a_k)=P'(a_k)\neq 0$.

    **Réduction.** Les solutions de $P'(x)-\alpha P(x)=0$ sont donc les réels $x$ distincts des $a_k$ tels que $\dfrac{P'(x)}{P(x)}=\alpha$. Sur chaque intervalle, la fonction $\dfrac{P'}{P}$ est continue et strictement décroissante : d'après le corollaire du théorème des valeurs intermédiaires, étendu aux intervalles ouverts, la valeur $\alpha$ y est atteinte une fois si elle appartient à l'intervalle image, et jamais sinon.

    **Décompte.** Chacun des $n-1$ intervalles $]a_k\,;a_{k+1}[$ fournit exactement une solution, quel que soit $\alpha$. L'intervalle $]-\infty\,;a_1[$ en fournit une si $\alpha<0$, l'intervalle $]a_n\,;+\infty[$ en fournit une si $\alpha>0$. 
    $$\boxed{\text{L'équation } P'(x)-\alpha P(x)=0 \text{ admet } n \text{ racines réelles si } \alpha\neq 0, \text{ et } n-1 \text{ si } \alpha=0.}$$

    *Vérification :* pour $P(x)=x(x-1)(x-3)$, on trouve à la calculatrice trois racines réelles pour $\alpha=-2$, $\alpha=\frac{1}{2}$ et $\alpha=2$, et deux pour $\alpha=0$. ✓

    *Remarque :* le cas $\alpha=0$ dit que $P'$ s'annule exactement une fois entre deux racines consécutives de $P$. C'est un cas particulier du théorème de Rolle, qui sera démontré en première année d'études supérieures : entre deux points où une fonction dérivable prend la même valeur, sa dérivée s'annule.
- id: "t-03-43"
  feuille: "f-t-03"
  numero: 43
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dérivée]
  noeuds: [ar-deriv]
  notions: [derivable]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 179"
  page_enonce: 15
  page_corrige: 38
  enonce: |
    *Inégalité des accroissements finis.* Soient $a$ et $b$ deux réels tels que $a<b$, $m$ et $M$ deux réels, et $f$ une fonction dérivable sur $[a\,;b]$.

    **1.** On suppose que $m\leqslant f'(x)\leqslant M$ pour tout $x\in[a\,;b]$. Montrer que : 
    $$m(b-a)\leqslant f(b)-f(a)\leqslant M(b-a)$$
     On pourra considérer les fonctions $g : x\mapsto f(x)-Mx$ et $h : x\mapsto f(x)-mx$.

    **2.** Soit $K\geqslant 0$. On suppose que $\left|f'(x)\right|\leqslant K$ pour tout $x\in[a\,;b]$. Montrer que 
    $$\left|f(b)-f(a)\right|\leqslant K\,|b-a|$$
     puis que, pour tous $x$ et $y$ de $[a\,;b]$ : 
    $$\left|f(y)-f(x)\right|\leqslant K\,|y-x|$$
  corrige: |
    **1.** La fonction $g : x\mapsto f(x)-Mx$ est dérivable sur $[a\,;b]$, de dérivée $g'(x)=f'(x)-M\leqslant 0$. Elle est donc décroissante, et $g(b)\leqslant g(a)$ : 
    $$f(b)-Mb\leqslant f(a)-Ma \qquad\text{soit}\qquad f(b)-f(a)\leqslant M(b-a)$$
     De même, $h : x\mapsto f(x)-mx$ a pour dérivée $h'(x)=f'(x)-m\geqslant 0$. Elle est croissante, donc $h(b)\geqslant h(a)$, c'est-à-dire $f(b)-f(a)\geqslant m(b-a)$. 
    $$\boxed{m(b-a)\leqslant f(b)-f(a)\leqslant M(b-a)}$$

    **2.** L'hypothèse $\left|f'(x)\right|\leqslant K$ s'écrit $-K\leqslant f'(x)\leqslant K$. La question 1, avec $m=-K$ et $M=K$, donne $-K(b-a)\leqslant f(b)-f(a)\leqslant K(b-a)$. Comme $b-a=|b-a|$ : 
    $$\boxed{\left|f(b)-f(a)\right|\leqslant K\,|b-a|}$$
     Soient maintenant $x$ et $y$ dans $[a\,;b]$. Si $x=y$, l'inégalité est évidente. Si $x<y$, l'hypothèse sur $f'$ vaut en particulier sur $[x\,;y]$, et ce qui précède, appliqué à cet intervalle, donne $\left|f(y)-f(x)\right|\leqslant K\,|y-x|$. Si $x>y$, on échange les rôles de $x$ et $y$, les deux membres étant symétriques. 
    $$\boxed{\text{pour tous } x,y\in[a\,;b], \quad \left|f(y)-f(x)\right|\leqslant K\,|y-x|}$$

    *Interprétation :* si $f(t)$ désigne la position d'un mobile à l'instant $t$, la dérivée est sa vitesse. L'inégalité dit qu'un mobile dont la vitesse ne dépasse jamais $K$ ne peut parcourir, entre les instants $a$ et $b$, une distance supérieure à $K(b-a)$.

    *Remarque :* le nom vient du *théorème des accroissements finis*, étudié après le baccalauréat, qui affirme plus précisément l'existence d'un réel $c\in\,]a\,;b[$ tel que $f(b)-f(a)=f'(c)(b-a)$.
