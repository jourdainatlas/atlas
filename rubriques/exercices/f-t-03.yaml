  types: [Calcul]
  mots_cles: [limite en un réel, dérivée, convexité, "point d'inflexion", dérivée seconde]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Pour chacune des fonctions suivantes, définie sur $\mathbb{R}$, calculer $f''$, étudier son signe, puis préciser les intervalles de convexité et de concavité ainsi que les éventuels points d'inflexion.

    **a)** $f(x)=x^{3}-6x^{2}+5x-2$

    **b)** $f(x)=x^{4}-2x^{3}$

    **c)** $f(x)=-x^{3}+3x+1$

    **d)** $f(x)=x^{4}+2$

    Commenter tout particulièrement le dernier cas.
  corrige: |
    **a)** $f(x)=x^{3}-6x^{2}+5x-2$ : $f'(x)=3x^{2}-12x+5$ puis 
    $$f''(x)=6x-12=6(x-2)$$
     $f''$ est négative sur $]-\infty\,;2]$ et positive sur $[2\,;+\infty[$, en changeant de signe en $2$ : 
    $$\boxed{f \text{ concave sur } ]-\infty\,;2],\ \text{convexe sur } [2\,;+\infty[,\ \text{point d'inflexion en } x=2 \ \big(f(2)=-8\big).}$$

    **b)** $f(x)=x^{4}-2x^{3}$ : $f'(x)=4x^{3}-6x^{2}$ puis 
    $$f''(x)=12x^{2}-12x=12x(x-1)$$
     Ce produit est positif à l'extérieur des racines, négatif entre elles : 
    $$\boxed{f \text{ convexe sur } ]-\infty\,;0] \text{ et } [1\,;+\infty[,\ \text{concave sur } [0\,;1],\ \text{deux points d'inflexion en } 0 \text{ et } 1.}$$
     avec $f(0)=0$ et $f(1)=-1$.

    **c)** $f(x)=-x^{3}+3x+1$ : $f'(x)=-3x^{2}+3$ puis $f''(x)=-6x$, du signe contraire de $x$ : 
    $$\boxed{f \text{ convexe sur } ]-\infty\,;0],\ \text{concave sur } [0\,;+\infty[,\ \text{point d'inflexion en } 0 \ \big(f(0)=1\big).}$$

    **d)** $f(x)=x^{4}+2$ : $f'(x)=4x^{3}$ puis $f''(x)=12x^{2}$.

    Un carré étant toujours positif, $f''(x)\geqslant 0$ sur $\mathbb{R}$ : 
    $$\boxed{f \text{ est convexe sur } \mathbb{R}.}$$
     **Commentaire.** On a bien $f''(0)=0$, et pourtant la courbe n'admet **aucun point d'inflexion** : la dérivée seconde s'annule *sans changer de signe*. La condition du cours est bien « $f''$ s'annule **en changeant de signe** » — s'annuler ne suffit pas.
- id: "t-03-19"
  feuille: "f-t-03"
  numero: 19
  partie: "Convexité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [limite en un réel, dérivée, tangente, convexité, "point d'inflexion", dérivée seconde, racine carrée]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Étudier la convexité de chacune des fonctions suivantes sur l'intervalle indiqué, et préciser les points d'inflexion éventuels.

    **1.** $f(x)=x\,\mathrm{e}^{x}$ sur $\mathbb{R}$

    **2.** $g(x)=\sqrt{x}$ sur $]0\,;+\infty[$

    **3.** $h(x)=\dfrac{1}{x}$ sur $]0\,;+\infty[$, puis sur $]-\infty\,;0[$

    **4.** $k(x)=\mathrm{e}^{-x^{2}}$ sur $\mathbb{R}$
  corrige: |
    *Sur les quatre figures qui suivent, les portions convexes de la courbe sont tracées en bleu ardoise, les portions concaves en violet, et les points d'inflexion sont marqués d'un point noir.*

    **1.** $f(x)=x\,\mathrm{e}^{x}$ : $f'(x)=\mathrm{e}^{x}+x\,\mathrm{e}^{x}=(x+1)\mathrm{e}^{x}$, puis 
    $$f''(x)=\mathrm{e}^{x}+(x+1)\mathrm{e}^{x}=(x+2)\,\mathrm{e}^{x}$$
     Comme $\mathrm{e}^{x}>0$, le signe de $f''$ est celui de $x+2$ : 
    $$\boxed{f \text{ est concave sur } ]-\infty\,;-2] \text{ et convexe sur } [-2\,;+\infty[.}$$
     La courbe admet un point d'inflexion en $x=-2$, d'ordonnée $f(-2)=-2\mathrm{e}^{-2}$.

    ![Figure](documents/figures/7bac529445be7774.svg)

    **2.** $g(x)=\sqrt{x}$ sur $]0\,;+\infty[$ : $g'(x)=\dfrac{1}{2\sqrt{x}}=\dfrac{1}{2}\times \dfrac{1}{\sqrt{x}}$. On dérive $\dfrac{1}{u}$ avec $u=\sqrt{x}$ : 
    $$\left(\frac{1}{\sqrt{x}}\right)'=-\frac{\frac{1}{2\sqrt{x}}}{\left(\sqrt{x}\right)^{2}} =-\frac{1}{2x\sqrt{x}} \qquad\text{donc}\qquad g''(x)=\frac{1}{2}\times\left(-\frac{1}{2x\sqrt{x}}\right) =-\frac{1}{4x\sqrt{x}}$$
     Pour $x>0$, $g''(x)<0$ : 
    $$\boxed{g \text{ est concave sur } ]0\,;+\infty[,\ \text{sans point d'inflexion.}}$$

    ![Figure](documents/figures/acfc697a93e6f05e.svg)

    On a ajouté en pointillés gris la tangente au point d'abscisse $4$ : conformément à la définition, la courbe reste **en dessous** de sa tangente, ce qui est bien la traduction géométrique de la concavité.

    **3.** $h(x)=\dfrac{1}{x}$ : $h'(x)=-\dfrac{1}{x^{2}}$ puis $h''(x)=\dfrac{2}{x^{3}}$, du signe de $x$ : 
    $$\boxed{h \text{ est convexe sur } ]0\,;+\infty[ \text{ et concave sur } ]-\infty\,;0[.}$$
     *Attention :* il n'y a **pas** de point d'inflexion en $0$, car $0$ n'appartient pas à l'ensemble de définition. On ne peut pas parler de changement de convexité « en traversant » une valeur où la fonction n'existe pas.

    ![Figure](documents/figures/fbb73ce392819793.svg)

    La figure rend cette remarque très visible : les deux branches ne se rejoignent pas, il ne s'agit pas d'une courbe qui *traverse* sa tangente en changeant de convexité.

    **4.** $k(x)=\mathrm{e}^{-x^{2}}$ : $k'(x)=-2x\,\mathrm{e}^{-x^{2}}$, puis, avec la formule du produit : 
    $$k''(x)=-2\,\mathrm{e}^{-x^{2}}+(-2x)\times(-2x)\mathrm{e}^{-x^{2}} =\left(4x^{2}-2\right)\mathrm{e}^{-x^{2}}=2\left(2x^{2}-1\right)\mathrm{e}^{-x^{2}}$$
     Le signe est celui de $2x^{2}-1$, qui s'annule en $\pm\dfrac{\sqrt{2}}{2}$ : 
    $$\boxed{k \text{ convexe sur } \left]-\infty\,;-\tfrac{\sqrt{2}}{2}\right] \text{ et } \left[\tfrac{\sqrt{2}}{2}\,;+\infty\right[,\ \text{concave entre les deux.}}$$
     La courbe admet donc deux points d'inflexion, d'abscisses $\pm\dfrac{\sqrt{2}}{2}$, et d'ordonnée commune $\mathrm{e}^{-1/2}\approx 0{,}607$.

    ![Figure](documents/figures/c120b965ffe32218.svg)

    C'est la célèbre « courbe en cloche » : elle est concave au voisinage de son sommet, puis convexe de part et d'autre, les deux changements de convexité se produisant exactement aux abscisses $\pm\frac{\sqrt{2}}{2}$.
- id: "t-03-20"
  feuille: "f-t-03"
  numero: 20
  partie: "Convexité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [limite en un réel, théorème de comparaison, dérivée, tangente, tableau de variations, convexité, dérivée seconde, exponentielle]
  noeuds: [c-point, ar-deriv, cx-exponentielle]
  notions: [continuite-point, derivable, exponentielle]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Soit $f$ la fonction exponentielle, définie sur $\mathbb{R}$ par $f(x)=\mathrm{e}^{x}$.

    **1.** Calculer $f''$ et en déduire que $f$ est convexe sur $\mathbb{R}$.

    **2.** Déterminer une équation de la tangente $T$ à la courbe de $f$ au point d'abscisse $0$.

    **3.** Que peut-on en déduire, sans aucun calcul supplémentaire, sur la position de la courbe de $f$ par rapport à $T$ ?

    **4.** Retrouver ce résultat en étudiant les variations de la fonction $g$ définie sur $\mathbb{R}$ par $g(x)=\mathrm{e}^{x}-x-1$.

    **5.** En déduire un encadrement de $\mathrm{e}^{0,1}$ par un nombre décimal simple, puis comparer à la valeur donnée par la calculatrice.
  corrige: |
    **1.** $f(x)=\mathrm{e}^{x}$ donne $f'(x)=\mathrm{e}^{x}$ puis $f''(x)=\mathrm{e}^{x}$. Or l'exponentielle est strictement positive sur $\mathbb{R}$, donc $f''(x)>0$ et 
    $$\boxed{f \text{ est convexe sur } \mathbb{R}.}$$

    **2.** $f(0)=\mathrm{e}^{0}=1$ et $f'(0)=1$, donc : 
    $$y=1\times(x-0)+1 \qquad\text{soit}\qquad \boxed{T : y=x+1}$$

    **3.** Le cours définit une fonction convexe comme une fonction dont la courbe est située au-dessus de *chacune* de ses tangentes. On en déduit donc, sans aucun calcul : 
    $$\boxed{\text{pour tout réel } x,\quad \mathrm{e}^{x}\geqslant x+1}$$

    **4.** Posons $g(x)=\mathrm{e}^{x}-x-1$. Alors $g'(x)=\mathrm{e}^{x}-1$, et 
    $$g'(x)\geqslant 0 \iff \mathrm{e}^{x}\geqslant 1 \iff x\geqslant 0$$
     La fonction $g$ est donc décroissante sur $]-\infty\,;0]$ et croissante sur $[0\,;+\infty[$ : elle atteint son minimum en $0$, et 
    $$g(0)=\mathrm{e}^{0}-0-1=0$$
     Ainsi $g(x)\geqslant g(0)=0$ pour tout réel $x$, c'est-à-dire $\mathrm{e}^{x}-x-1\geqslant 0$ : on retrouve bien l'inégalité précédente.

    **5.** L'inégalité appliquée en $x=0{,}1$ donne une **minoration** : 
    $$\mathrm{e}^{0,1}\geqslant 1+0{,}1=1{,}1$$
     Pour obtenir une majoration, on applique la même inégalité en $x=-0{,}1$ : 
    $$\mathrm{e}^{-0,1}\geqslant 1-0{,}1=0{,}9 \quad\text{soit}\quad \frac{1}{\mathrm{e}^{0,1}}\geqslant 0{,}9 \quad\text{soit}\quad \mathrm{e}^{0,1}\leqslant \frac{1}{0{,}9}=\frac{10}{9}$$

    $$\boxed{1{,}1\leqslant \mathrm{e}^{0,1}\leqslant \frac{10}{9}\approx 1{,}111}$$
     La calculatrice donne $\mathrm{e}^{0,1}\approx 1{,}10517$ : l'encadrement est correct, et la minoration $1{,}1$ est déjà excellente (erreur inférieure à $6\times 10^{-3}$).
- id: "t-03-21"
  feuille: "f-t-03"
  numero: 21
  partie: "Convexité"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [limite en un réel, convexité, "point d'inflexion", polynôme]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Une entreprise fabrique $x$ centaines d'objets, avec $0\leqslant x\leqslant 30$. Le coût total de production, en centaines d'euros, est modélisé par : 
    $$C(x)=0{,}05x^{3}-1{,}5x^{2}+20x$$

    **1.** Calculer $C'(x)$, puis montrer que $C$ est croissante sur $[0\,;30]$. Interpréter.

    **2.** Calculer $C''(x)$ et étudier son signe.

    **3.** En déduire les intervalles de convexité et de concavité de $C$, ainsi que l'abscisse du point d'inflexion.

    **4.** Le coût marginal est modélisé par la fonction $C'$. Pour quelle production ce coût marginal est-il minimal ? Justifier en utilisant la question 3.

    **5.** Interpréter le point d'inflexion en termes économiques : que se passe-t-il, pour l'entreprise, avant puis après cette valeur ?
  corrige: |
    **1.** $C(x)=0{,}05x^{3}-1{,}5x^{2}+20x$ donne : 
    $$C'(x)=0{,}15x^{2}-3x+20$$
     C'est un trinôme du second degré de discriminant 
    $$\Delta=(-3)^{2}-4\times 0{,}15\times 20=9-12=-3<0$$
     Un trinôme de discriminant strictement négatif ne s'annule jamais et garde le signe de son coefficient dominant, ici $0{,}15>0$. Donc $C'(x)>0$ pour tout $x$, et 
    $$\boxed{C \text{ est strictement croissante sur } [0\,;30].}$$
     **Interprétation :** produire davantage coûte toujours plus cher au total, ce qui était attendu.

    **2.** $C''(x)=0{,}3x-3=0{,}3(x-10)$, qui s'annule en $10$ en changeant de signe.

    ![Figure](documents/figures/6ad12288b2a263f6.svg)

    **3.** On en déduit donc : 
    $$\boxed{C \text{ est concave sur } [0\,;10] \text{ et convexe sur } [10\,;30],\ \text{avec un point d'inflexion en } x=10.}$$
     On calcule $C(10)=0{,}05\times 1000-1{,}5\times 100+200=50-150+200=100$ : le point d'inflexion est le point de coordonnées $(10\,;100)$.

    **4.** D'après le tableau ci-dessus, $C'$ est décroissante puis croissante, et atteint donc son minimum en $x=10$ : 
    $$C'(10)=0{,}15\times 100-30+20=15-30+20=\boxed{5}$$
     Le coût marginal est minimal pour une production de $\boxed{10 \text{ centaines, soit } 1\,000 \text{ objets}}$, et vaut alors $5$ centaines d'euros par centaine d'objets supplémentaire.

    **5.** **Interprétation économique.** Avant $x=10$, la fonction coût est concave : chaque centaine d'objets supplémentaire coûte *moins cher* que la précédente — l'entreprise bénéficie de rendements croissants (les frais fixes se répartissent, l'organisation se rode). Après $x=10$, la fonction devient convexe : chaque centaine supplémentaire coûte *plus cher* que la précédente — heures supplémentaires, saturation des machines, rendements décroissants. Le point d'inflexion marque donc le seuil de production le plus efficace à la marge.
- id: "t-03-22"
  feuille: "f-t-03"
  numero: 22
  partie: "Continuité et théorème des valeurs intermédiaires"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [limite en un réel, dérivée, continuité, théorème des valeurs intermédiaires, partie entière]
  noeuds: [c-point, ar-deriv, continuite, c-tvi]
  notions: [continuite-point, derivable, continuite]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Toute fonction dérivable sur un intervalle $I$ est continue sur $I$.

    **2.** Toute fonction continue sur un intervalle $I$ est dérivable sur $I$.

    **3.** La fonction partie entière est continue sur $\mathbb{R}$.

    **4.** Une fonction rationnelle est continue sur chaque intervalle de son ensemble de définition.

    **5.** Si $f$ est continue sur $[a\,;b]$ et si $f(a)$ et $f(b)$ sont de signes contraires, alors l'équation $f(x)=0$ admet au moins une solution dans $[a\,;b]$.

    **6.** Si $f$ est continue sur $[a\,;b]$, alors pour tout réel $k$ compris entre $f(a)$ et $f(b)$, l'équation $f(x)=k$ admet exactement une solution.
  corrige: |
    **1.** **Vraie**. C'est la seconde partie de la proposition 4 du cours : la dérivabilité entraîne la continuité.

    **2.** **Fausse**. C'est la réciproque de la précédente, et elle est fausse. *Contre-exemple :* la fonction valeur absolue $x\mapsto |x|$ est continue sur $\mathbb{R}$, mais n'est pas dérivable en $0$ (point anguleux).

    **3.** **Fausse**. La fonction partie entière est discontinue en *chaque* entier : sa courbe est un escalier dont chaque marche impose de lever le crayon. Elle est en revanche continue sur tout intervalle $[n\,;n+1[$.

    **4.** **Vraie**. Une fonction rationnelle est continue sur chaque intervalle de son ensemble de définition. *Attention à la formulation :* $x\mapsto \frac{1}{x}$ est continue sur $]-\infty\,;0[$ et sur $]0\,;+\infty[$, mais il serait incorrect de dire qu'elle est continue « sur $\mathbb{R}^{*}$ » vu comme un seul bloc.

    **5.** **Vraie**. C'est le théorème des valeurs intermédiaires appliqué avec $k=0$ : si $f(a)$ et $f(b)$ sont de signes contraires, alors $0$ est compris entre $f(a)$ et $f(b)$.

    **6.** **Fausse**. Le théorème des valeurs intermédiaires garantit **au moins** une solution, jamais l'unicité. *Contre-exemple :* $f(x)=x^{3}-3x+1$ sur $[-2\,;2]$ avec $k=0$ admet trois solutions (voir l'exercice suivant). *Énoncé correct :* il faut ajouter que $f$ est strictement monotone sur $[a\,;b]$ — c'est le corollaire.
- id: "t-03-23"
  feuille: "f-t-03"
  numero: 23
  partie: "Continuité et théorème des valeurs intermédiaires"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivée, continuité, théorème des valeurs intermédiaires, polynôme]
  noeuds: [ar-deriv, continuite, c-tvi]
  notions: [derivable, continuite]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=x^{3}-3x+1$.

    **1.** Justifier que $f$ est continue sur $\mathbb{R}$.

    **2.** Calculer $f(-2)$, $f(0)$, $f(1)$ et $f(2)$.

    **3.** En appliquant le théorème des valeurs intermédiaires sur des intervalles bien choisis, montrer que l'équation $f(x)=0$ admet au moins trois solutions distinctes.

    **4.** Le théorème des valeurs intermédiaires permet-il d'affirmer qu'il n'y en a pas davantage ? Quel argument supplémentaire faudrait-il ?
  corrige: |
    **1.** $f$ est une fonction polynôme, donc $\boxed{f \text{ est continue sur } \mathbb{R}.}$

    **2.** On calcule :

    • $f(-2)=-8+6+1=\boxed{-1}$

    • $f(0)=\boxed{1}$

    • $f(1)=1-3+1=\boxed{-1}$

    • $f(2)=8-6+1=\boxed{3}$

    **3.** On applique trois fois le théorème des valeurs intermédiaires, sur trois intervalles distincts :

    • Sur $[-2\,;0]$ : $f$ est continue et $f(-2)=-1<0<1=f(0)$, donc il existe $c_{1}\in\,]-2\,;0[$ tel que $f(c_{1})=0$.

    • Sur $[0\,;1]$ : $f$ est continue et $f(1)=-1<0<1=f(0)$, donc il existe $c_{2}\in\,]0\,;1[$ tel que $f(c_{2})=0$.

    • Sur $[1\,;2]$ : $f$ est continue et $f(1)=-1<0<3=f(2)$, donc il existe $c_{3}\in\,]1\,;2[$ tel que $f(c_{3})=0$.

    Ces trois intervalles ouverts étant disjoints, les solutions $c_1$, $c_2$ et $c_3$ sont deux à deux distinctes : 
    $$\boxed{\text{l'équation } f(x)=0 \text{ admet au moins trois solutions.}}$$

    **4.** **Non.** Le théorème des valeurs intermédiaires est un théorème d'*existence* : il ne dit rien du nombre de solutions. Pour conclure qu'il y en a exactement trois, il faut invoquer le **corollaire**, donc établir la stricte monotonie de $f$ sur chaque intervalle. Ici : 
    $$f'(x)=3x^{2}-3=3(x-1)(x+1)$$
     donc $f$ est strictement croissante sur $]-\infty\,;-1]$, strictement décroissante sur $[-1\,;1]$, puis strictement croissante sur $[1\,;+\infty[$. Sur chacune de ces trois branches, l'équation $f(x)=0$ admet au plus une solution : il y en a donc exactement trois.
- id: "t-03-24"
  feuille: "f-t-03"
  numero: 24
  partie: "Continuité et théorème des valeurs intermédiaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["limite en l'infini", dérivée, tableau de variations, continuité, théorème des valeurs intermédiaires, valeur approchée, polynôme]
  noeuds: [ar-deriv, continuite, c-tvi]
  notions: [derivable, continuite]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=x^{3}+3x-5$.

    **1.** Justifier que $f$ est continue et dérivable sur $\mathbb{R}$, puis étudier ses variations.

    **2.** Déterminer les limites de $f$ en $-\infty$ et en $+\infty$.

    **3.** En rédigeant les trois vérifications de la méthode du cours, montrer que l'équation $f(x)=0$ admet une unique solution $\alpha$ dans $\mathbb{R}$.

    **4.** Montrer que $\alpha\in\,]1\,;2[$.

    **5.** À l'aide de la calculatrice, donner un encadrement de $\alpha$ d'amplitude $10^{-2}$.
  corrige: |
    **1.** $f$ est une fonction polynôme, donc continue et dérivable sur $\mathbb{R}$. De plus : 
    $$f'(x)=3x^{2}+3$$
     Comme $3x^{2}\geqslant 0$, on a $f'(x)\geqslant 3>0$ pour tout réel $x$, donc 
    $$\boxed{f \text{ est strictement croissante sur } \mathbb{R}.}$$

    **2.** $f(x)=x^{3}+3x-5=x^{3}\left(1+\dfrac{3}{x^{2}}-\dfrac{5}{x^{3}}\right)$, la parenthèse tendant vers $1$ : 
    $$\lim\limits_{x\to -\infty} f(x)=\boxed{-\infty}\qquad\text{et}\qquad \lim\limits_{x\to +\infty} f(x)=\boxed{+\infty}$$

    **3.** On rédige les trois vérifications de la méthode :

    **(a)** $f$ est **continue** sur $\mathbb{R}$ (fonction polynôme, donc dérivable donc continue).

    **(b)** $f$ est **strictement croissante** sur $\mathbb{R}$ (question 1.).

    **(c)** Le réel $0$ est **compris entre les limites** de $f$ aux bornes, à savoir $-\infty$ et $+\infty$.

    D'après le corollaire du théorème des valeurs intermédiaires : 
    $$\boxed{\text{l'équation } f(x)=0 \text{ admet une unique solution } \alpha \text{ dans } \mathbb{R}.}$$

    **4.** $f(1)=1+3-5=-1<0$ et $f(2)=8+6-5=9>0$. Comme $f$ est strictement croissante et s'annule en $\alpha$, on a nécessairement $\boxed{\alpha\in\,]1\,;2[.}$

    **5.** Balayage à la calculatrice, de pas $0{,}1$ puis $0{,}01$ : 
    $$f(1{,}1)\approx -0{,}369<0 \qquad\text{et}\qquad f(1{,}2)\approx 0{,}328>0 \qquad\text{donc}\qquad \alpha\in\,]1{,}1\,;1{,}2[$$

    $$f(1{,}15)\approx -0{,}029<0 \qquad\text{et}\qquad f(1{,}16)\approx 0{,}041>0$$

    $$\boxed{1{,}15<\alpha<1{,}16}$$
