    **Partie A : étude d'une fonction**

    Soit $f$ la fonction définie sur $[0\,;+\infty[$ par $f(x)=\sqrt{4x+5}$.

    **1.** Justifier que $f$ est dérivable sur $[0\,;+\infty[$, calculer $f'(x)$ et en déduire le sens de variation de $f$.

    **2.** Résoudre l'équation $f(x)=x$ sur $[0\,;+\infty[$.

    **3.** Montrer que, pour tout $x$ de $[0\,;5]$, on a $0\leqslant f(x)\leqslant 5$.

    **4.** Montrer que, pour tout $x>0$, $\quad f(x)-x=\dfrac{-(x-5)(x+1)}{\sqrt{4x+5}+x}$, puis en déduire le signe de $f(x)-x$ sur $[0\,;5]$.

    **5.** Montrer que $f''(x)=-\dfrac{4}{(4x+5)\sqrt{4x+5}}$ et en déduire la convexité de $f$.

    **Partie B : étude d'une suite**

    On considère la suite $(u_n)$ définie par $u_0=0$ et, pour tout entier naturel $n$, $u_{n+1}=\sqrt{4u_n+5}$, c'est-à-dire $u_{n+1}=f(u_n)$.

    **6.** Calculer $u_1$, $u_2$ et $u_3$, arrondis à $10^{-3}$. Que peut-on conjecturer ?

    **7.** Démontrer par récurrence que, pour tout entier naturel $n$ : 
    $$0\leqslant u_n\leqslant u_{n+1}\leqslant 5$$
     On utilisera les questions 1., 3. et 4. de la partie A.

    **8.** En déduire que la suite $(u_n)$ est convergente.

    **9.** On note $\ell$ sa limite. Justifier, à l'aide de la continuité de $f$, que $\ell$ vérifie $\ell=f(\ell)$, puis déterminer $\ell$.

    **10.** Recopier et compléter le script Python suivant, qui renvoie le plus petit entier $n$ tel que $u_n>s$ :

    ```python
    from math import sqrt

    def seuil(s):
        u = 0
        n = 0
        while ... :
            u = ...
            n = n + 1
        return n
    ```

    **11.** Que renvoie l'appel `seuil(4.999)` ? Pourquoi l'appel `seuil(5)` serait-il problématique ?
  corrige: |
    **Partie A : étude d'une fonction**

    **1.** Pour $x\geqslant 0$, on a $4x+5\geqslant 5>0$ : la fonction $u:x\mapsto 4x+5$ est strictement positive, donc $\sqrt{u}$ est dérivable, et 
    $$f'(x)=\frac{u'(x)}{2\sqrt{u(x)}}=\frac{4}{2\sqrt{4x+5}}=\boxed{\frac{2}{\sqrt{4x+5}}}$$
     Ce quotient est strictement positif, donc $\boxed{f \text{ est strictement croissante sur } [0\,;+\infty[.}$

    **2.** Pour $x\geqslant 0$, les deux membres de $\sqrt{4x+5}=x$ sont positifs, on peut donc élever au carré : 
    $$\sqrt{4x+5}=x \iff 4x+5=x^{2} \iff x^{2}-4x-5=0$$
     Le discriminant vaut $\Delta=16+20=36$, donc $\sqrt{\Delta}=6$ et 
    $$x=\frac{4-6}{2}=-1 \qquad\text{ou}\qquad x=\frac{4+6}{2}=5$$
     La valeur $-1$ est à rejeter car elle n'appartient pas à $[0\,;+\infty[$ : 
    $$\boxed{\mathcal{S}=\{5\}}$$

    **3.** Soit $x\in[0\,;5]$. Comme $f$ est croissante, on a $f(0)\leqslant f(x)\leqslant f(5)$, c'est-à-dire : 
    $$\sqrt{5}\leqslant f(x)\leqslant 5$$
     Or $\sqrt{5}\approx 2{,}24\geqslant 0$, donc a fortiori 
    $$\boxed{0\leqslant f(x)\leqslant 5}$$
     *Ce qui signifie que* l'intervalle $[0\,;5]$ est **stable** par $f$ : on ne peut pas en sortir en appliquant $f$.

    **4.** On multiplie par la quantité conjuguée, licite car $\sqrt{4x+5}+x>0$ pour $x>0$ : 
    $$f(x)-x=\sqrt{4x+5}-x =\frac{\left(\sqrt{4x+5}-x\right)\left(\sqrt{4x+5}+x\right)}{\sqrt{4x+5}+x} =\frac{(4x+5)-x^{2}}{\sqrt{4x+5}+x}$$
     Or $-x^{2}+4x+5=-\left(x^{2}-4x-5\right)=-(x-5)(x+1)$ d'après la question 2. Ce qui nous donne : 
    $$\boxed{f(x)-x=\frac{-(x-5)(x+1)}{\sqrt{4x+5}+x}}$$
     Sur $[0\,;5]$, on a $x-5\leqslant 0$ et $x+1>0$, donc $-(x-5)(x+1)\geqslant 0$ ; le dénominateur étant strictement positif : 
    $$\boxed{f(x)\geqslant x \text{ pour tout } x\in[0\,;5],\ \text{avec égalité seulement en } x=5.}$$

    **5.** $f'(x)=\dfrac{2}{\sqrt{4x+5}}=2\times\dfrac{1}{\sqrt{4x+5}}$. On dérive $\dfrac{1}{u}$ avec $u(x)=\sqrt{4x+5}$, dont la dérivée est $\dfrac{2}{\sqrt{4x+5}}$ et le carré $4x+5$ : 
    $$\left(\frac{1}{\sqrt{4x+5}}\right)'=-\frac{\frac{2}{\sqrt{4x+5}}}{4x+5} =-\frac{2}{(4x+5)\sqrt{4x+5}}$$

    $$f''(x)=2\times\left(-\frac{2}{(4x+5)\sqrt{4x+5}}\right) =\boxed{-\frac{4}{(4x+5)\sqrt{4x+5}}}$$
     Ce nombre est strictement négatif sur $[0\,;+\infty[$, donc $\boxed{f \text{ est concave sur } [0\,;+\infty[.}$

    **Partie B : étude d'une suite**

    **6.** $u_0=0$, puis : 
    $$u_1=\sqrt{4\times 0+5}=\sqrt{5}\approx \boxed{2{,}236}$$

    $$u_2=\sqrt{4u_1+5}\approx\sqrt{13{,}944}\approx \boxed{3{,}734} \qquad u_3=\sqrt{4u_2+5}\approx\sqrt{19{,}937}\approx \boxed{4{,}465}$$
     **Conjecture :** la suite $(u_n)$ semble croissante, majorée par $5$, et converger vers $5$.

    **7.** Considérons la propriété, définie pour tout entier naturel $n$ : 
    $$\forall n\in\mathbb{N},\quad P_n : «\,0\leqslant u_n\leqslant u_{n+1}\leqslant 5\,»$$

    **Initialisation :** Pour $n=0$, on a $u_0=0$ et $u_1=\sqrt{5}\approx 2{,}236$. On vérifie bien 
    $$0\leqslant 0\leqslant 2{,}236\leqslant 5$$
     donc $P_0$ est vraie.

    **Hérédité :** Soit $k\in\mathbb{N}$. Supposons $P_k$ vraie, c'est-à-dire $0\leqslant u_k\leqslant u_{k+1}\leqslant 5$.

    La fonction $f$ est croissante sur $[0\,;+\infty[$ (question 1.), donc elle conserve l'ordre : 
    $$f(0)\leqslant f(u_k)\leqslant f(u_{k+1})\leqslant f(5)$$
     c'est-à-dire, puisque $u_{n+1}=f(u_n)$ et $f(5)=5$ (question 2.) : 
    $$\sqrt{5}\leqslant u_{k+1}\leqslant u_{k+2}\leqslant 5$$
     Or $\sqrt{5}\geqslant 0$, donc a fortiori $0\leqslant u_{k+1}\leqslant u_{k+2}\leqslant 5$ : la propriété $P_{k+1}$ est vraie.

    **Conclusion :** Par principe de récurrence, la propriété $P_n$ est vraie pour tout entier naturel $n$ : 
    $$\boxed{\forall n\in\mathbb{N},\quad 0\leqslant u_n\leqslant u_{n+1}\leqslant 5}$$

    *Remarque :* on pouvait aussi obtenir $u_n\leqslant u_{n+1}$ directement par la question 4. : puisque $u_n\in[0\,;5]$, on a $f(u_n)\geqslant u_n$, c'est-à-dire $u_{n+1}\geqslant u_n$.

    **8.** D'après ce qui précède, la suite $(u_n)$ est **croissante** (car $u_n\leqslant u_{n+1}$) et **majorée par $5$**. D'après le théorème de la limite monotone (chapitre 1) : 
    $$\boxed{\text{la suite } (u_n) \text{ est convergente.}}$$

    **9.** Notons $\ell$ sa limite. Comme $0\leqslant u_n\leqslant 5$ pour tout $n$, on a par passage à la limite $\ell\in[0\,;5]$.

    D'une part, la suite $(u_{n+1})$ est extraite de $(u_n)$ et converge donc aussi vers $\ell$. D'autre part, $f$ est continue sur $[0\,;+\infty[$, donc en particulier en $\ell$ : la suite $\big(f(u_n)\big)$ converge vers $f(\ell)$. Or $u_{n+1}=f(u_n)$ pour tout $n$. Par unicité de la limite : 
    $$\ell=f(\ell)$$
     D'après la question 2., la seule solution de cette équation sur $[0\,;+\infty[$ est $5$, donc 
    $$\boxed{\lim_{n\to+\infty} u_n=5}$$
     **C'est ici que la continuité est indispensable :** sans elle, rien ne permettrait de faire « passer la limite à l'intérieur » de $f$.

    **10.** On boucle tant que le seuil n'est pas dépassé :

    ```python
    from math import sqrt

    def seuil(s):
        u = 0
        n = 0
        while u <= s:
            u = sqrt(4*u + 5)
            n = n + 1
        return n
    ```

    **11.** En poursuivant les calculs, on trouve $u_9\approx 4{,}99773$ et $u_{10}\approx 4{,}99909$. Le seuil $4{,}999$ est donc franchi au rang $10$ : 
    $$\boxed{\texttt{seuil(4.999)} \text{ renvoie } 10}$$
     En revanche, $\boxed{\texttt{seuil(5)} \text{ provoquerait une boucle infinie}}$ : la suite est strictement croissante et majorée par $5$, donc $u_n<5$ pour tout $n$ — la condition `u <= s` ne deviendrait jamais fausse. La limite est atteinte « à l'infini », jamais à un rang fini.

    *Nuance d'informatique :* en pratique, les arrondis de la machine finissent par renvoyer exactement $5{,}0$ et la boucle s'arrête tout de même. Mathématiquement, c'est bien d'une boucle infinie qu'il s'agit.
- id: "t-03-34"
  feuille: "f-t-03"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [dérivée, tableau de variations, convexité, "point d'inflexion", dérivée seconde, continuité, théorème des valeurs intermédiaires]
  noeuds: [ar-deriv, continuite, c-tvi]
  notions: [derivable, continuite]
  page_enonce: 13
  page_corrige: 30
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. $\lim\limits_{x\to +\infty} \dfrac{3x^{2}-x+2}{1-2x^{2}}$ vaut ¦ $-\dfrac{3}{2}$ ¦ $\dfrac{3}{2}$ ¦ $-\dfrac{1}{2}$
    2. $\lim\limits_{x\to 2^{-}} \dfrac{x+1}{x-2}$ vaut ¦ $+\infty$ ¦ $-\infty$ ¦ $0$
    3. La dérivée de $x\mapsto (x^{2}+1)^{3}$ est ¦ $3(x^{2}+1)^{2}$ ¦ $6x(x^{2}+1)^{2}$ ¦ $6x(x^{2}+1)^{3}$
    4. La dérivée de $x\mapsto \mathrm{e}^{-3x+1}$ est ¦ $-3\,\mathrm{e}^{-3x+1}$ ¦ $\mathrm{e}^{-3x+1}$ ¦ $-3\,\mathrm{e}^{-3}$
    5. Si $f''(x)=6x-12$ sur $\mathbb{R}$, alors la courbe de $f$ admet un point d'inflexion d'abscisse ¦ $0$ ¦ $2$ ¦ elle n'en admet pas
    6. La fonction $x\mapsto x^{4}$ est ¦ convexe sur $\mathbb{R}$ ¦ concave sur $\mathbb{R}$ ¦ concave puis convexe
    7. Le théorème des valeurs intermédiaires permet d'affirmer ¦ l'existence d'une solution ¦ l'unicité d'une solution ¦ l'existence et l'unicité
    8. Si $f$ est continue sur $[0\,;1]$ avec $f(0)=-1$ et $f(1)=3$, alors $f$ ¦ s'annule au moins une fois ¦ s'annule exactement une fois ¦ ne s'annule pas nécessairement
    ```
  corrige: |
    **1.** **Réponse A.** On factorise par $x^{2}$ : $\dfrac{3x^{2}-x+2}{1-2x^{2}}=\dfrac{3-\frac{1}{x}+\frac{2}{x^{2}}}{\frac{1}{x^{2}}-2} \longrightarrow \dfrac{3}{-2}=\boxed{-\dfrac{3}{2}}$

    **2.** **Réponse B.** Le numérateur tend vers $3>0$ et, pour $x<2$, on a $x-2<0$ donc $x-2\to 0^{-}$. Le quotient tend donc vers $\boxed{-\infty}$.

    **3.** **Réponse B.** Avec $u(x)=x^{2}+1$ et $u'(x)=2x$ : $\left(u^{3}\right)'=3u'u^{2}=\boxed{6x(x^{2}+1)^{2}}$. La réponse A est le résultat que l'on obtient en oubliant $u'$.

    **4.** **Réponse A.** Avec $u(x)=-3x+1$ et $u'(x)=-3$ : $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}=\boxed{-3\,\mathrm{e}^{-3x+1}}$.

    **5.** **Réponse B.** $f''(x)=6x-12$ s'annule en $x=2$ *en changeant de signe* (négative avant, positive après) : il y a bien un point d'inflexion d'abscisse $\boxed{2}$.

    **6.** **Réponse A.** Si $f(x)=x^{4}$, alors $f''(x)=12x^{2}\geqslant 0$ sur $\mathbb{R}$, donc $\boxed{f \text{ est convexe sur } \mathbb{R}}$. *Attention :* $f''(0)=0$ n'entraîne pas un changement de convexité, comme vu à l'exercice 18.

    **7.** **Réponse A.** Le théorème des valeurs intermédiaires est un théorème d'**existence** : il affirme qu'il existe *au moins* une solution. L'unicité relève du corollaire, qui exige en plus la stricte monotonie.

    **8.** **Réponse A.** $f$ est continue sur $[0\,;1]$ et $f(0)=-1<0<3=f(1)$ : d'après le théorème des valeurs intermédiaires, $f$ s'annule **au moins** une fois. Rien ne permet d'affirmer qu'elle ne s'annule qu'une fois, faute de connaître ses variations.
- id: "t-03-35"
  feuille: "f-t-03"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Lecture graphique, Démonstration]
  mots_cles: [forme indéterminée, asymptote, théorème des gendarmes, quantité conjuguée, racine carrée]
  noeuds: []
  notions: []
  page_enonce: 13
  page_corrige: 31
  enonce: |
    **Limites et expressions conjuguées.**

    **1.** Soit $x>0$. Montrer que $\quad \sqrt{x+1}-\sqrt{x}=\dfrac{1}{\sqrt{x+1}+\sqrt{x}}$.

    **2.** En déduire que, pour tout $x>0$ : 
    $$0<\sqrt{x+1}-\sqrt{x}\leqslant \dfrac{1}{\sqrt{x}}$$
     puis déterminer $\lim\limits_{x\to +\infty}\left(\sqrt{x+1}-\sqrt{x}\right)$.

    **3.** On pose $\varphi(x)=\sqrt{x^{2}+1}-x$ pour $x>0$.

    **(a)** Montrer que $\varphi(x)=\dfrac{1}{\sqrt{x^{2}+1}+x}$.

    **(b)** Justifier que $0<\varphi(x)<\dfrac{1}{x}$ pour tout $x>0$, puis déterminer $\lim\limits_{x\to +\infty}\varphi(x)$.

    **(c)** Interpréter graphiquement ce résultat, en comparant la courbe de $x\mapsto\sqrt{x^{2}+1}$ et la droite d'équation $y=x$.

    **4.** On pose $\psi(x)=\sqrt{x^{2}+x}-x$ pour $x>0$.

    **(a)** Montrer que $\psi(x)=\dfrac{x}{\sqrt{x^{2}+x}+x}$.

    **(b)** Justifier que, pour $x>0$, $\quad \sqrt{x^{2}+x}=x\sqrt{1+\dfrac{1}{x}}$, puis en déduire que $\psi(x)=\dfrac{1}{\sqrt{1+\frac{1}{x}}+1}$.

    **(c)** On admet que $\sqrt{1+\frac{1}{x}}$ tend vers $1$ lorsque $x$ tend vers $+\infty$. En déduire $\lim\limits_{x\to +\infty}\psi(x)$.

    **(d)** Comparer avec le résultat de la question 3. et commenter.
  corrige: |
    **1.** Soit $x>0$. On reconnaît le produit de deux expressions conjuguées : 
    $$\left(\sqrt{x+1}-\sqrt{x}\right)\left(\sqrt{x+1}+\sqrt{x}\right) =\left(\sqrt{x+1}\right)^{2}-\left(\sqrt{x}\right)^{2}=(x+1)-x=1$$
     Comme $\sqrt{x+1}+\sqrt{x}>0$, on peut diviser par cette quantité : 
    $$\boxed{\sqrt{x+1}-\sqrt{x}=\frac{1}{\sqrt{x+1}+\sqrt{x}}}$$

    **2.** Pour $x>0$, on a $\sqrt{x+1}>0$, donc $\sqrt{x+1}+\sqrt{x}>\sqrt{x}>0$. En passant aux inverses, ce qui renverse l'ordre : 
    $$0<\frac{1}{\sqrt{x+1}+\sqrt{x}}<\frac{1}{\sqrt{x}}$$
     c'est-à-dire, d'après la question 1. : 
    $$0<\sqrt{x+1}-\sqrt{x}\leqslant \frac{1}{\sqrt{x}}$$
     Or $\lim\limits_{x\to +\infty}\dfrac{1}{\sqrt{x}}=0$ (limite de référence) et la fonction nulle tend également vers $0$. D'après le théorème des gendarmes : 
    $$\boxed{\lim\limits_{x\to +\infty}\left(\sqrt{x+1}-\sqrt{x}\right)=0}$$

    **3.** **(a)** Même technique : 
    $$\left(\sqrt{x^{2}+1}-x\right)\left(\sqrt{x^{2}+1}+x\right)=(x^{2}+1)-x^{2}=1$$
     et $\sqrt{x^{2}+1}+x>0$ pour $x>0$, donc 
    $$\boxed{\varphi(x)=\frac{1}{\sqrt{x^{2}+1}+x}}$$

    **(b)** Pour $x>0$ : $\sqrt{x^{2}+1}>0$ donc $\sqrt{x^{2}+1}+x>x>0$, et en passant aux inverses : 
    $$0<\varphi(x)<\frac{1}{x}$$
     Comme $\lim\limits_{x\to +\infty}\dfrac{1}{x}=0$, le théorème des gendarmes donne : 
    $$\boxed{\lim\limits_{x\to +\infty}\varphi(x)=0}$$

    **(c)** L'écart vertical entre la courbe de $x\mapsto\sqrt{x^{2}+1}$ et la droite d'équation $y=x$ vaut exactement $\varphi(x)$, qui tend vers $0$. Autrement dit, 
    $$\boxed{\text{la courbe se rapproche indéfiniment de la droite } y=x \text{ quand } x\to+\infty.}$$
     De plus $\varphi(x)>0$ : la courbe reste toujours strictement *au-dessus* de cette droite, sans jamais la toucher.

    *Remarque de cours (hors programme du chapitre) :* on dit que la droite $y=x$ est **asymptote oblique** à la courbe. Le chapitre ne définit que les asymptotes horizontales et verticales, mais le principe est le même : c'est une droite dont la courbe se rapproche indéfiniment.

    **4.** **(a)** $\left(\sqrt{x^{2}+x}-x\right)\left(\sqrt{x^{2}+x}+x\right)=(x^{2}+x)-x^{2}=x$, donc 
    $$\boxed{\psi(x)=\frac{x}{\sqrt{x^{2}+x}+x}}$$

    **(b)** Pour $x>0$, on peut factoriser sous la racine : 
    $$\sqrt{x^{2}+x}=\sqrt{x^{2}\left(1+\frac{1}{x}\right)} =\sqrt{x^{2}}\times\sqrt{1+\frac{1}{x}}=x\sqrt{1+\frac{1}{x}}$$
     en utilisant $\sqrt{x^{2}}=|x|=x$ car $x>0$. *C'est ici le piège de l'exercice :* pour $x<0$ on aurait $\sqrt{x^{2}}=-x$, et tout le calcul changerait de signe.

    On factorise alors le dénominateur par $x$ : 
    $$\psi(x)=\frac{x}{x\sqrt{1+\frac{1}{x}}+x} =\frac{x}{x\left(\sqrt{1+\frac{1}{x}}+1\right)} =\boxed{\frac{1}{\sqrt{1+\frac{1}{x}}+1}}$$

    **(c)** Par hypothèse, $\sqrt{1+\frac{1}{x}}\to 1$, donc le dénominateur tend vers $1+1=2$ : 
    $$\boxed{\lim\limits_{x\to +\infty}\psi(x)=\frac{1}{2}}$$

    **(d)** Les deux situations se ressemblent beaucoup, et pourtant : 
    $$\sqrt{x^{2}+1}-x\longrightarrow 0 \qquad\text{tandis que}\qquad \sqrt{x^{2}+x}-x\longrightarrow \frac{1}{2}$$
     **Commentaire.** Sous la racine, le terme $+1$ est *négligeable* devant $x^{2}$ : la racine se comporte exactement comme $x$, et l'écart s'évanouit. Le terme $+x$, lui, grandit avec $x$ : même s'il reste négligeable devant $x^{2}$ (les deux fonctions ont bien la même « allure »), il laisse subsister un écart constant. La morale est qu'une forme indéterminée $\infty-\infty$ ne peut jamais se deviner : elle exige un calcul.
- id: "t-03-36"
  feuille: "f-t-03"
  numero: 36
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [limite en un réel, théorème de comparaison, dérivée, tangente, tableau de variations, convexité, racine carrée, fonction auxiliaire]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  page_enonce: 14
  page_corrige: 32
  enonce: |
    **Une inégalité obtenue par la convexité.**

    Soit $g$ la fonction définie sur $[0\,;+\infty[$ par $g(x)=\sqrt{1+x}$, de courbe $\mathcal{C}_g$.

    **1.** Montrer que, pour tout $x>0$, $\quad g'(x)=\dfrac{1}{2\sqrt{1+x}}$ puis $g''(x)=-\dfrac{1}{4(1+x)\sqrt{1+x}}$.

    **2.** En déduire que $g$ est concave sur $[0\,;+\infty[$.

    **3.** Déterminer une équation de la tangente $T$ à $\mathcal{C}_g$ au point d'abscisse $0$.

    **4.** En déduire, sans nouveau calcul, que pour tout $x\geqslant 0$ : 
    $$\sqrt{1+x}\leqslant 1+\dfrac{x}{2}$$

    **5.** Retrouver cette inégalité en étudiant les variations de la fonction $h$ définie sur $[0\,;+\infty[$ par $h(x)=1+\dfrac{x}{2}-\sqrt{1+x}$.

    **6.** **Application.** En prenant $x=0{,}02$, donner une majoration décimale de $\sqrt{1{,}02}$. Comparer à la valeur affichée par la calculatrice, et estimer l'erreur commise.

    **7.** L'inégalité reste-t-elle valable pour $-1\leqslant x<0$ ? Justifier à l'aide de la concavité.
  corrige: |
    **1.** Avec $u(x)=1+x$, donc $u'(x)=1$, et $u(x)>0$ pour $x>-1$ : 
    $$g'(x)=\frac{u'(x)}{2\sqrt{u(x)}}=\boxed{\frac{1}{2\sqrt{1+x}}}$$
     On dérive à nouveau, en écrivant $g'(x)=\dfrac{1}{2}\times\dfrac{1}{\sqrt{1+x}}$ et en appliquant $\left(\frac{1}{u}\right)'=-\frac{u'}{u^{2}}$ avec $u(x)=\sqrt{1+x}$ : 
    $$\left(\frac{1}{\sqrt{1+x}}\right)'=-\frac{\frac{1}{2\sqrt{1+x}}}{\left(\sqrt{1+x}\right)^{2}} =-\frac{1}{2(1+x)\sqrt{1+x}}$$

    $$g''(x)=\frac{1}{2}\times\left(-\frac{1}{2(1+x)\sqrt{1+x}}\right) =\boxed{-\frac{1}{4(1+x)\sqrt{1+x}}}$$

    **2.** Pour $x\geqslant 0$, on a $1+x>0$ et $\sqrt{1+x}>0$, donc le dénominateur est strictement positif et $g''(x)<0$. D'après le théorème de caractérisation de la convexité : 
    $$\boxed{g \text{ est concave sur } [0\,;+\infty[.}$$

    **3.** $g(0)=\sqrt{1}=1$ et $g'(0)=\dfrac{1}{2\sqrt{1}}=\dfrac{1}{2}$, donc : 
    $$y=\frac{1}{2}(x-0)+1 \qquad\text{soit}\qquad \boxed{T : y=\frac{x}{2}+1}$$

    **4.** Une fonction concave a sa courbe située *en dessous* de chacune de ses tangentes. En appliquant cela à la tangente $T$ : 
    $$\boxed{\text{pour tout } x\geqslant 0,\quad \sqrt{1+x}\leqslant 1+\frac{x}{2}}$$

    **5.** Posons $h(x)=1+\dfrac{x}{2}-\sqrt{1+x}$ sur $[0\,;+\infty[$. Alors 
    $$h'(x)=\frac{1}{2}-\frac{1}{2\sqrt{1+x}} =\frac{\sqrt{1+x}-1}{2\sqrt{1+x}}$$
     Pour $x\geqslant 0$, on a $1+x\geqslant 1$ donc $\sqrt{1+x}\geqslant 1$, et le numérateur est positif. Ainsi $h'(x)\geqslant 0$ : la fonction $h$ est croissante sur $[0\,;+\infty[$. Comme 
    $$h(0)=1+0-\sqrt{1}=0$$
     on en déduit que $h(x)\geqslant h(0)=0$ pour tout $x\geqslant 0$, c'est-à-dire 
    $$1+\frac{x}{2}-\sqrt{1+x}\geqslant 0 \qquad\text{soit}\qquad \sqrt{1+x}\leqslant 1+\frac{x}{2}$$
     On retrouve bien l'inégalité, cette fois par une étude de fonction.

    **6.** En prenant $x=0{,}02$ : 
    $$\sqrt{1{,}02}\leqslant 1+\frac{0{,}02}{2}=\boxed{1{,}01}$$
     La calculatrice donne $\sqrt{1{,}02}\approx 1{,}00995$, donc l'erreur commise vaut 
    $$1{,}01-1{,}00995\approx \boxed{5\times 10^{-5}}$$
     *On remarque que* l'approximation est excellente : la tangente épouse d'autant mieux la courbe que l'on reste proche du point de contact.

    **7.** **Oui, l'inégalité reste valable.** Le calcul de $g''$ est en effet valable pour tout $x>-1$, et non seulement pour $x\geqslant 0$ : la fonction $g$ est donc concave sur $]-1\,;+\infty[$ tout entier, et sa courbe y reste sous la tangente $T$. 
    $$\boxed{\text{pour tout } x\in\,]-1\,;+\infty[,\quad \sqrt{1+x}\leqslant 1+\frac{x}{2}}$$
     Le cas $x=-1$ se vérifie directement : $\sqrt{0}=0$ et $1-\frac{1}{2}=\frac{1}{2}$, et l'on a bien $0\leqslant \frac{1}{2}$. L'inégalité vaut donc sur $[-1\,;+\infty[$.

    *Remarque :* en $x=-1$, la fonction $g$ n'est pas dérivable (tangente verticale), ce qui explique que l'on doive traiter ce point à part.
- id: "t-03-37"
  feuille: "f-t-03"
  numero: 37
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Calcul]
  mots_cles: [limite en un réel, dérivée, tangente]
  noeuds: [c-point, ar-deriv]
  notions: [continuite-point, derivable]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 158"
  page_enonce: 14
  page_corrige: 34
  enonce: |
    Soient $f$ et $g$ deux fonctions définies sur $\mathbb{R}$ et dérivables en $0$. On suppose que les courbes représentatives des trois fonctions $f$, $g$ et $\dfrac{fg}{2}$ ont la même tangente au point d'abscisse $0$. Quelles sont les équations possibles pour cette tangente ?
  corrige: |
    **Traduction de l'hypothèse.** La tangente à la courbe de $f$ au point d'abscisse $0$ a pour équation $y=f'(0)\,x+f(0)$, et celle de $g$ a pour équation $y=g'(0)\,x+g(0)$. Deux droites non verticales sont confondues si et seulement si elles ont même coefficient directeur et même ordonnée à l'origine. Notons donc : 
    $$c=f(0)=g(0) \qquad\text{et}\qquad m=f'(0)=g'(0)$$
     **La troisième fonction.** Posons $h=\dfrac{fg}{2}$. La formule de dérivation d'un produit, établie en un point exactement comme sur un intervalle, donne : 
    $$h(0)=\frac{f(0)g(0)}{2}=\frac{c^{2}}{2} \qquad\text{et}\qquad h'(0)=\frac{f'(0)g(0)+f(0)g'(0)}{2}=\frac{mc+cm}{2}=mc$$
     La tangente à la courbe de $h$ en $0$ doit être la même droite, d'où deux conditions : 
    $$\frac{c^{2}}{2}=c \qquad\text{et}\qquad mc=m$$
     La première s'écrit $c(c-2)=0$, soit $c=0$ ou $c=2$. La seconde s'écrit $m(c-1)=0$ ; comme $c$ ne vaut pas $1$, elle impose $m=0$.

    **Réciproque.** Les deux cas se produisent : avec $f=g$ constantes égales à $0$, les trois courbes ont pour tangente commune la droite $y=0$ ; avec $f=g$ constantes égales à $2$, la fonction $h$ vaut aussi $2$, et la tangente commune est $y=2$. 
    $$\boxed{\text{La tangente commune a pour équation } y=0 \text{ ou } y=2.}$$
     *Remarque :* le résultat surprend, puisque l'hypothèse ne dit rien de la pente. C'est la formule du produit qui la contraint : elle impose $h'(0)=mc$, et comme l'ordonnée $c$ ne peut valoir que $0$ ou $2$, jamais $1$, l'égalité $mc=m$ n'est possible que pour une pente nulle.
- id: "t-03-38"
  feuille: "f-t-03"
  numero: 38
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dérivée, "point d'inflexion", dérivée seconde, racine carrée, polynôme]
  noeuds: [ar-deriv]
  notions: [derivable]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 150"
  page_enonce: 14
  page_corrige: 34
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\mathrm{e}^{-x^{2}}$. Pour tout entier naturel $n$, on note $f^{(n)}$ la dérivée $n$-ième de $f$, obtenue en dérivant $n$ fois la fonction $f$, avec la convention $f^{(0)}=f$. Montrer que, pour tout $n\in\mathbb{N}$, il existe un polynôme $P_n$ à coefficients réels tel que : 
    $$\text{pour tout réel } x, \qquad f^{(n)}(x)=P_n(x)\,\mathrm{e}^{-x^{2}}$$
     Expliciter $P_0$, $P_1$ et $P_2$.
  corrige: |
    On raisonne par récurrence sur $n$, avec la propriété $\mathcal{P}(n)$ : « il existe un polynôme $P_n$ tel que $f^{(n)}(x)=P_n(x)\,\mathrm{e}^{-x^{2}}$ pour tout réel $x$ ».

    **Initialisation :** $f^{(0)}(x)=\mathrm{e}^{-x^{2}}=1\times\mathrm{e}^{-x^{2}}$, donc $P_0=1$ convient.

    **Hérédité :** Supposons $\mathcal{P}(n)$ vraie pour un entier $n$. La fonction $x\mapsto P_n(x)\,\mathrm{e}^{-x^{2}}$ est dérivable sur $\mathbb{R}$, comme produit d'un polynôme et de $\mathrm{e}^{u}$ avec $u(x)=-x^{2}$. D'après la dérivée d'un produit, et puisque $\left(\mathrm{e}^{-x^{2}}\right)'=-2x\,\mathrm{e}^{-x^{2}}$ : 
    $$f^{(n+1)}(x)=P_n'(x)\,\mathrm{e}^{-x^{2}}+P_n(x)\times\left(-2x\,\mathrm{e}^{-x^{2}}\right) =\big(P_n'(x)-2x\,P_n(x)\big)\,\mathrm{e}^{-x^{2}}$$
     La fonction $P_{n+1}=P_n'-2xP_n$ est un polynôme, car la dérivée d'un polynôme et le produit de deux polynômes en sont encore : $\mathcal{P}(n+1)$ est vraie.

    **Conclusion :** Pour tout entier naturel $n$, il existe un polynôme $P_n$ tel que $f^{(n)}(x)=P_n(x)\,\mathrm{e}^{-x^{2}}$, et ces polynômes vérifient la relation de récurrence : 
    $$\boxed{P_0=1 \qquad\text{et}\qquad P_{n+1}(x)=P_n'(x)-2x\,P_n(x)}$$
     On en déduit successivement $P_1(x)=0-2x\times 1$, puis $P_2(x)=-2-2x\times(-2x)$ : 
    $$\boxed{P_0(x)=1 \qquad P_1(x)=-2x \qquad P_2(x)=4x^{2}-2}$$
     *Remarque :* on retrouve l'exercice 19. Comme $\mathrm{e}^{-x^{2}}>0$, le signe de $f''$ est celui de $P_2(x)=4x^{2}-2$, qui s'annule en $\pm\dfrac{\sqrt{2}}{2}$ en changeant de signe : ce sont les abscisses des deux points d'inflexion. La même récurrence montre que $P_n$ est de degré $n$, de coefficient dominant $(-2)^{n}$ ; par exemple $P_3(x)=-8x^{3}+12x$.
- id: "t-03-39"
  feuille: "f-t-03"
  numero: 39
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["limite en l'infini", théorème des gendarmes, dérivée]
  noeuds: [ar-deriv]
  notions: [derivable]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 189"
  page_enonce: 14
  page_corrige: 35
  enonce: |
    Soit $f$ une fonction définie sur $\mathbb{R}$ telle que, pour tous réels $x$ et $y$ : 
    $$\left|f(y)-f(x)\right|\leqslant (y-x)^{2}$$
     Montrer que $f$ est constante.
  corrige: |
    **La fonction $f$ est dérivable.** L'énoncé ne le suppose pas : il faut le démontrer. Fixons un réel $x$. Pour tout réel $h\neq 0$, l'hypothèse appliquée à $x$ et $y=x+h$ donne $\left|f(x+h)-f(x)\right|\leqslant h^{2}$, puis, en divisant par $|h|>0$ : 
    $$\left|\frac{f(x+h)-f(x)}{h}\right|\leqslant |h| \qquad\text{c'est-à-dire}\qquad -|h|\leqslant\frac{f(x+h)-f(x)}{h}\leqslant |h|$$
     Les deux fonctions encadrantes tendent vers $0$ lorsque $h$ tend vers $0$. D'après le théorème des gendarmes, énoncé dans le cours en $+\infty$ mais qui vaut de la même façon en un point, le taux d'accroissement tend vers $0$ : 
    $$\boxed{f \text{ est dérivable en tout réel } x, \text{ et } f'(x)=0.}$$
     **Conclusion.** Comme $f'\geqslant 0$ sur $\mathbb{R}$, la fonction $f$ est croissante ; comme $f'\leqslant 0$, elle est aussi décroissante. Pour $x<y$, on a donc à la fois $f(x)\leqslant f(y)$ et $f(x)\geqslant f(y)$, soit $f(x)=f(y)$. 
    $$\boxed{f \text{ est constante.}}$$
     *Piège :* c'est l'exposant $2$ qui fait tout. L'hypothèse $\left|f(y)-f(x)\right|\leqslant |y-x|$ serait insuffisante : la fonction $x\mapsto x$ la vérifie sans être constante. Le carré rend le taux d'accroissement aussi petit que l'on veut.
- id: "t-03-40"
  feuille: "f-t-03"
  numero: 40
  partie: "Pour aller plus loin"
