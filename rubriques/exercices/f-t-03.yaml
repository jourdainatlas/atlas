  enonce: |
    **1.** Soit $f$ la fonction définie sur $\mathbb{R}$ par : 
    $$f(x)=\begin{cases} x^{2}+1 & \text{si } x\leqslant 2 \\[2mm] ax-3 & \text{si } x>2\end{cases}$$

    **(a)** Justifier que $f$ est continue sur $]-\infty\,;2[$ et sur $]2\,;+\infty[$, quelle que soit la valeur du réel $a$.

    **(b)** Déterminer la valeur de $a$ pour laquelle $f$ est continue sur $\mathbb{R}$.

    **2.** Soit $g$ la fonction définie sur $\mathbb{R}$ par $g(x)=\dfrac{x^{2}-4}{x-2}$ pour $x\neq 2$ et $g(2)=m$, où $m$ est un réel.

    **(a)** Simplifier l'écriture de $g(x)$ pour $x\neq 2$.

    **(b)** Pour quelle valeur de $m$ la fonction $g$ est-elle continue en $2$ ?
  corrige: |
    **1.** **(a)** Sur $]-\infty\,;2[$, $f$ coïncide avec la fonction polynôme $x\mapsto x^{2}+1$, donc $f$ y est continue. Sur $]2\,;+\infty[$, $f$ coïncide avec la fonction affine $x\mapsto ax-3$, donc $f$ y est également continue, et ce $\boxed{\text{quelle que soit la valeur de } a.}$

    Le seul point susceptible de poser problème est donc $x=2$, où l'expression change.

    **(b)** D'une part, comme la première expression est valable pour $x\leqslant 2$ : 
    $$f(2)=2^{2}+1=5 \qquad\text{et}\qquad \lim_{x\to 2^{-}} f(x)=5$$
     D'autre part : 
    $$\lim_{x\to 2^{+}} f(x)=\lim_{x\to 2^{+}}(ax-3)=2a-3$$
     La fonction $f$ est continue en $2$ si et seulement si ces deux limites coïncident avec $f(2)$ : 
    $$2a-3=5 \iff 2a=8 \iff \boxed{a=4}$$

    **2.** **(a)** Pour $x\neq 2$ : 
    $$g(x)=\frac{x^{2}-4}{x-2}=\frac{(x-2)(x+2)}{x-2}=\boxed{x+2}$$

    **(b)** On en déduit que $\displaystyle\lim_{x\to 2} g(x)=4$. La fonction $g$ est continue en $2$ si et seulement si $g(2)=\lim\limits_{x\to 2} g(x)$, c'est-à-dire 
    $$\boxed{m=4}$$
     *On remarque que* l'on a ainsi « prolongé par continuité » la fonction : avec $m=4$, $g$ n'est autre que la fonction affine $x\mapsto x+2$ sur $\mathbb{R}$ tout entier.
- id: "t-03-29"
  feuille: "f-t-03"
  numero: 29
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [limite en un réel, asymptote, dérivée, tangente, tableau de variations, convexité, "point d'inflexion", dérivée seconde]
  noeuds: [c-point, ar-deriv, continuite, c-tvi]
  notions: [continuite-point, derivable, continuite]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\dfrac{4x}{x^{2}+1}$, de courbe représentative $\mathcal{C}_f$ dans un repère orthonormé.

    **Partie A : limites et variations**

    **1.** Justifier que $f$ est définie et dérivable sur $\mathbb{R}$ tout entier.

    **2.** Déterminer $\lim\limits_{x\to +\infty} f(x)$ et $\lim\limits_{x\to -\infty} f(x)$. En déduire l'existence d'une asymptote à $\mathcal{C}_f$, dont on précisera l'équation.

    **3.** Montrer que, pour tout réel $x$, $\quad f'(x)=\dfrac{4(1-x)(1+x)}{(x^{2}+1)^{2}}$.

    **4.** Dresser le tableau de variations de $f$ sur $\mathbb{R}$, limites comprises.

    **5.** Déterminer une équation de la tangente à $\mathcal{C}_f$ au point d'abscisse $0$.

    **Partie B : convexité**

    **6.** Montrer que, pour tout réel $x$, $\quad f''(x)=\dfrac{8x\left(x^{2}-3\right)}{(x^{2}+1)^{3}}$.

    **7.** Étudier le signe de $f''(x)$ sur $\mathbb{R}$.

    **8.** En déduire les intervalles de convexité et de concavité de $f$, puis le nombre de points d'inflexion de $\mathcal{C}_f$.

    **Partie C : une équation**

    **9.** Montrer que l'équation $f(x)=1$ admet exactement deux solutions dans $\mathbb{R}$.

    **10.** Résoudre algébriquement cette équation, et vérifier la cohérence avec la question précédente.
  corrige: |
    **Partie A : limites et variations**

    **1.** Pour tout réel $x$, $x^{2}+1\geqslant 1>0$ : le dénominateur ne s'annule jamais. La fonction $f$ est donc un quotient de fonctions polynômes dont le dénominateur ne s'annule pas, d'où 
    $$\boxed{f \text{ est définie et dérivable sur } \mathbb{R}.}$$

    **2.** On factorise par le terme de plus haut degré : 
    $$f(x)=\frac{4x}{x^{2}+1}=\frac{4x}{x^{2}\left(1+\frac{1}{x^{2}}\right)} =\frac{\frac{4}{x}}{1+\frac{1}{x^{2}}}\longrightarrow \frac{0}{1}=0$$

    $$\lim\limits_{x\to +\infty} f(x)=\lim\limits_{x\to -\infty} f(x)=\boxed{0}$$
     On en déduit donc que $\boxed{\text{la droite } y=0 \text{ (l'axe des abscisses) est asymptote horizontale à } \mathcal{C}_f.}$

    **3.** Avec $u(x)=4x$ et $v(x)=x^{2}+1$, donc $u'(x)=4$ et $v'(x)=2x$ : 
    $$f'(x)=\frac{4(x^{2}+1)-4x\times 2x}{(x^{2}+1)^{2}} =\frac{4x^{2}+4-8x^{2}}{(x^{2}+1)^{2}} =\frac{4-4x^{2}}{(x^{2}+1)^{2}} =\boxed{\frac{4(1-x)(1+x)}{(x^{2}+1)^{2}}}$$
     en utilisant $4-4x^{2}=4(1-x^{2})=4(1-x)(1+x)$.

    **4.** Le dénominateur est un carré strictement positif : le signe de $f'(x)$ est celui de $(1-x)(1+x)$, qui est positif *entre* ses racines $-1$ et $1$.

    ![Figure](documents/figures/4b6ef7e51c22a5c4.svg)

    avec $f(-1)=\dfrac{-4}{2}=-2$ et $f(1)=\dfrac{4}{2}=2$.

    **5.** $f(0)=0$ et $f'(0)=\dfrac{4\times 1\times 1}{1}=4$, donc la tangente en $0$ a pour équation : 
    $$y=4(x-0)+0 \qquad\text{soit}\qquad \boxed{y=4x}$$

    **Partie B : convexité**

    **6.** On dérive $f'(x)=\dfrac{4-4x^{2}}{(x^{2}+1)^{2}}$, avec $u(x)=4-4x^{2}$ et $v(x)=(x^{2}+1)^{2}$, donc $u'(x)=-8x$ et $v'(x)=2\times 2x\times(x^{2}+1)=4x(x^{2}+1)$ : 
    $$f''(x)=\frac{-8x(x^{2}+1)^{2}-(4-4x^{2})\times 4x(x^{2}+1)}{(x^{2}+1)^{4}}$$
     On factorise le numérateur par $(x^{2}+1)$, puis on simplifie : 
    $$f''(x)=\frac{(x^{2}+1)\Big[-8x(x^{2}+1)-4x(4-4x^{2})\Big]}{(x^{2}+1)^{4}} =\frac{-8x^{3}-8x-16x+16x^{3}}{(x^{2}+1)^{3}} =\boxed{\frac{8x\left(x^{2}-3\right)}{(x^{2}+1)^{3}}}$$

    **7.** Le dénominateur est strictement positif. Le signe de $f''(x)$ est donc celui de : 
    $$8x(x^{2}-3)=8x\left(x-\sqrt{3}\right)\left(x+\sqrt{3}\right)$$

    ![Figure](documents/figures/fde68bd745d5fd0f.svg)

    **8.** On en déduit donc : 
    $$\boxed{\begin{array}{l} f \text{ est concave sur } \left]-\infty\,;-\sqrt{3}\right] \text{ et sur } \left[0\,;\sqrt{3}\right] ; \\[1mm] f \text{ est convexe sur } \left[-\sqrt{3}\,;0\right] \text{ et sur } \left[\sqrt{3}\,;+\infty\right[. \end{array}}$$
     La dérivée seconde s'annule en changeant de signe en trois valeurs, donc 
    $$\boxed{\mathcal{C}_f \text{ admet trois points d'inflexion, d'abscisses } -\sqrt{3},\ 0 \text{ et } \sqrt{3}.}$$
     Leurs ordonnées sont respectivement $-\sqrt{3}$, $0$ et $\sqrt{3}$, car $f\left(\sqrt{3}\right)=\dfrac{4\sqrt{3}}{4}=\sqrt{3}$.

    **Partie C : une équation**

    **9.** On examine les trois branches du tableau de variations :

    • Sur $]-\infty\,;-1]$, $f$ décroît de $0$ à $-2$ : toutes les valeurs prises sont négatives ou nulles, donc $1$ n'est jamais atteint.

    • Sur $[-1\,;1]$, $f$ est continue et strictement croissante de $-2$ à $2$. Comme $1\in\,]-2\,;2[$, le corollaire du théorème des valeurs intermédiaires donne **exactement une** solution.

    • Sur $[1\,;+\infty[$, $f$ est continue et strictement décroissante de $2$ à $0$. Comme $1\in\,]0\,;2[$, il y a là encore **exactement une** solution.

    $$\boxed{\text{l'équation } f(x)=1 \text{ admet exactement deux solutions dans } \mathbb{R}.}$$

    **10.** Comme $x^{2}+1$ ne s'annule jamais, on peut multiplier les deux membres par ce dénominateur : 
    $$\frac{4x}{x^{2}+1}=1 \iff 4x=x^{2}+1 \iff x^{2}-4x+1=0$$
     Le discriminant vaut $\Delta=16-4=12>0$, et $\sqrt{12}=2\sqrt{3}$, d'où : 
    $$x=\frac{4-2\sqrt{3}}{2}=2-\sqrt{3} \qquad\text{ou}\qquad x=\frac{4+2\sqrt{3}}{2}=2+\sqrt{3}$$

    $$\boxed{\mathcal{S}=\left\{2-\sqrt{3}\ ;\ 2+\sqrt{3}\right\}}$$
     **Cohérence :** $2-\sqrt{3}\approx 0{,}27$ appartient bien à $]-1\,;1[$, et $2+\sqrt{3}\approx 3{,}73$ appartient bien à $]1\,;+\infty[$. On retrouve bien deux solutions, une par branche, conformément à la question 9.
