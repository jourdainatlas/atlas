    **Partie A : étude d'une fonction auxiliaire**

    Soit $g$ la fonction définie sur $[0\,;+\infty[$ par $g(x)=x^{3}+2x^{2}-2$.

    **1.** Calculer $g'(x)$ et montrer que $g$ est strictement croissante sur $[0\,;+\infty[$.

    **2.** Calculer $g(0)$ et déterminer $\lim\limits_{x\to +\infty} g(x)$.

    **3.** En déduire que l'équation $g(x)=0$ admet une unique solution $\alpha$ sur $[0\,;+\infty[$.

    **4.** Montrer que $\alpha\in\,]0{,}8\,;0{,}9[$, puis donner un encadrement de $\alpha$ d'amplitude $10^{-2}$.

    **5.** En déduire le signe de $g(x)$ sur $[0\,;+\infty[$, que l'on présentera dans un tableau.

    **Partie B : étude de la fonction $f$**

    Soit $f$ la fonction définie sur $]0\,;+\infty[$ par $f(x)=x^{2}+4x+\dfrac{4}{x}$, de courbe $\mathcal{C}_f$.

    **6.** Déterminer $\lim\limits_{x\to 0^{+}} f(x)$ et $\lim\limits_{x\to +\infty} f(x)$. Qu'en déduit-on pour $\mathcal{C}_f$ ?

    **7.** Montrer que, pour tout $x>0$, $\quad f'(x)=\dfrac{2\,g(x)}{x^{2}}$.

    **8.** En déduire le sens de variation de $f$, puis dresser son tableau de variations complet.

    **9.** Justifier que $f$ admet un minimum sur $]0\,;+\infty[$, atteint en $\alpha$, et en donner une valeur approchée à $10^{-1}$ près.

    **10.** Montrer que $f''(x)=2+\dfrac{8}{x^{3}}$, puis étudier la convexité de $f$ sur $]0\,;+\infty[$. La courbe $\mathcal{C}_f$ admet-elle un point d'inflexion ?

    **11.** Déterminer, en justifiant, le nombre de solutions de l'équation $f(x)=10$ sur $]0\,;+\infty[$.
  corrige: |
    **Partie A : étude d'une fonction auxiliaire**

    **1.** $g(x)=x^{3}+2x^{2}-2$ donne : 
    $$g'(x)=3x^{2}+4x=x(3x+4)$$
     Sur $[0\,;+\infty[$, on a $x\geqslant 0$ et $3x+4\geqslant 4>0$, donc $g'(x)\geqslant 0$, et $g'(x)=0$ uniquement en $x=0$. Ainsi 
    $$\boxed{g \text{ est strictement croissante sur } [0\,;+\infty[.}$$

    **2.** $g(0)=0+0-2=\boxed{-2}$, et 
    $$g(x)=x^{3}\left(1+\frac{2}{x}-\frac{2}{x^{3}}\right)\longrightarrow +\infty \qquad\text{donc}\qquad \lim\limits_{x\to +\infty} g(x)=\boxed{+\infty}$$

    **3.** $g$ est continue sur $[0\,;+\infty[$ (fonction polynôme), strictement croissante, et $0$ est compris entre $g(0)=-2$ et $\lim\limits_{x\to+\infty} g(x)=+\infty$. D'après le corollaire du théorème des valeurs intermédiaires : 
    $$\boxed{\text{l'équation } g(x)=0 \text{ admet une unique solution } \alpha \text{ sur } [0\,;+\infty[.}$$

    **4.** $g(0{,}8)=0{,}512+1{,}28-2=-0{,}208<0$ et $g(0{,}9)=0{,}729+1{,}62-2=0{,}349>0$, donc $\boxed{\alpha\in\,]0{,}8\,;0{,}9[.}$

    En affinant : $g(0{,}83)\approx -0{,}050<0$ et $g(0{,}84)\approx 0{,}004>0$, d'où 
    $$\boxed{0{,}83<\alpha<0{,}84}$$

    **5.** $g$ étant strictement croissante et s'annulant en $\alpha$ :

    ![Figure](documents/figures/f01ec7cf817bc194.svg)

    **Partie B : étude de la fonction $f$**

    **6.** Lorsque $x\to 0^{+}$ : $x^{2}+4x\to 0$ tandis que $\dfrac{4}{x}\to+\infty$ (numérateur $4>0$, dénominateur $\to 0^{+}$). Donc 
    $$\lim_{x\to 0^{+}} f(x)=\boxed{+\infty}$$
     Lorsque $x\to+\infty$ : $x^{2}+4x\to+\infty$ et $\dfrac{4}{x}\to 0$, donc 
    $$\lim\limits_{x\to +\infty} f(x)=\boxed{+\infty}$$
     On en déduit donc que $\boxed{\text{la droite } x=0 \text{ (l'axe des ordonnées) est asymptote verticale à } \mathcal{C}_f.}$

    **7.** $f(x)=x^{2}+4x+4x^{-1}$, dont la dérivée terme à terme donne : 
    $$f'(x)=2x+4-\frac{4}{x^{2}}$$
     On réduit au même dénominateur $x^{2}$ : 
    $$f'(x)=\frac{2x^{3}+4x^{2}-4}{x^{2}}=\frac{2\left(x^{3}+2x^{2}-2\right)}{x^{2}} =\boxed{\frac{2\,g(x)}{x^{2}}}$$

    **8.** Pour $x>0$, $x^{2}>0$ et $2>0$ : le signe de $f'(x)$ est donc **exactement celui de $g(x)$**, déterminé à la question 5.

    ![Figure](documents/figures/a52e9339f0e1dd63.svg)

    **9.** D'après ce tableau, $f$ est décroissante puis croissante : elle admet donc un **minimum global** sur $]0\,;+\infty[$, atteint en $\alpha$.

    Comme $0{,}83<\alpha<0{,}84$, on encadre : 
    $$f(0{,}83)\approx 8{,}828 \qquad\text{et}\qquad f(0{,}84)\approx 8{,}827$$

    $$\boxed{f(\alpha)\approx 8{,}8}$$

    **10.** On dérive $f'(x)=2x+4-4x^{-2}$. Pour le dernier terme, on applique $\left(\frac{1}{u}\right)'=-\frac{u'}{u^{2}}$ avec $u(x)=x^{2}$ : 
    $$\left(\frac{4}{x^{2}}\right)'=-\frac{4\times 2x}{x^{4}}=-\frac{8}{x^{3}} \qquad\text{donc}\qquad f''(x)=2-\left(-\frac{8}{x^{3}}\right)=\boxed{2+\frac{8}{x^{3}}}$$
     Pour $x>0$, on a $\dfrac{8}{x^{3}}>0$, donc $f''(x)>2>0$ : 
    $$\boxed{f \text{ est convexe sur } ]0\,;+\infty[,\ \text{et } \mathcal{C}_f \text{ n'admet aucun point d'inflexion.}}$$

    **11.** On sait que $f(1)=1+4+4=9$, et que $f(\alpha)$ est le minimum de $f$, donc $f(\alpha)\leqslant 9<10$. On applique alors le corollaire sur chaque branche :

    • sur $]0\,;\alpha]$, $f$ est continue et strictement décroissante de $+\infty$ à $f(\alpha)<10$ : une unique solution ;

    • sur $[\alpha\,;+\infty[$, $f$ est continue et strictement croissante de $f(\alpha)<10$ à $+\infty$ : une unique solution.

    $$\boxed{\text{l'équation } f(x)=10 \text{ admet exactement deux solutions sur } ]0\,;+\infty[.}$$
