  enonce: |
    On reprend l'exemple du cours : une puce saute d'un sommet à l'autre d'un triangle, sans jamais rester sur place, de façon équiprobable. On note $P$ la matrice de transition, $I$ la matrice identité d'ordre $3$ et $J$ la matrice carrée d'ordre $3$ dont tous les coefficients valent $1$.

    **1.** Vérifier que $P=\dfrac{1}{2}(J-I)$ et que $J^{2}=3J$.

    **2.** Montrer par récurrence que, pour tout $n\in\mathbb{N}$ : 
    $$P^{n}=\frac{1}{3}J+\left(-\frac{1}{2}\right)^{n}\left(I-\frac{1}{3}J\right)$$

    **3.** En déduire la probabilité $r_{n}$ que la puce soit revenue à son sommet de départ après $n$ sauts. Retrouver la valeur du cours pour $n=3$.

    **4.** Déterminer la limite de $r_{n}$, puis la distribution invariante de la chaîne. Interpréter.
  corrige: |
    **1.** $J-I$ a des $0$ sur la diagonale et des $1$ ailleurs : la moitié donne bien $P$. Chaque coefficient de $J^{2}$ est la somme de trois produits $1\times 1$, d'où $J^{2}=3J$.

    **2.** On note $\mathcal{P}_{n}$ l'égalité annoncée.

    **Initialisation :** Pour $n=0$ : $\frac{1}{3}J+I-\frac{1}{3}J=I=P^{0}$.

    **Hérédité :** Supposons $\mathcal{P}_{n}$ vraie. On calcule d'abord, à l'aide de $J^{2}=3J$ : 
    $$JP=\frac{1}{2}\left(J^{2}-J\right)=\frac{1}{2}(3J-J)=J$$

    $$\left(I-\tfrac{1}{3}J\right)P=P-\tfrac{1}{3}J=\tfrac{1}{2}J-\tfrac{1}{2}I-\tfrac{1}{3}J=-\tfrac{1}{2}\left(I-\tfrac{1}{3}J\right)$$
     Ainsi $P^{n+1}=P^{n}P=\frac{1}{3}J+\left(-\frac{1}{2}\right)^{n}\left(-\frac{1}{2}\right)\left(I-\frac{1}{3}J\right)$, ce qui est $\mathcal{P}_{n+1}$.

    **Conclusion :** L'égalité est vraie pour tout $n\in\mathbb{N}$.

    **3.** $r_{n}$ est un coefficient diagonal de $P^{n}$ (Chapman-Kolmogorov) : 
    $$\boxed{r_{n}=\frac{1}{3}+\left(-\frac{1}{2}\right)^{n}\left(1-\frac{1}{3}\right)=\frac{1}{3}+\frac{2}{3}\left(-\frac{1}{2}\right)^{n}}$$
     Pour $n=3$ : $r_{3}=\frac{1}{3}-\frac{2}{3}\times\frac{1}{8}=\frac{1}{3}-\frac{1}{12}=\frac{1}{4}$, c'est le coefficient $0{,}25$ calculé dans le cours. On vérifie aussi $r_{1}=0$ (la puce ne reste jamais sur place) et $r_{2}=\frac{1}{2}$.

    **4.** Comme $\left|-\frac{1}{2}\right|<1$, $\left(-\frac{1}{2}\right)^{n}\to 0$, d'où $\boxed{r_{n}\to\frac{1}{3}}$. Plus généralement $P^{n}\to\frac{1}{3}J$, dont toutes les lignes valent $\begin{pmatrix} \frac{1}{3} & \frac{1}{3} & \frac{1}{3} \end{pmatrix}$. Cette distribution est invariante, puisque $\frac{1}{3}\begin{pmatrix} 1 & 1 & 1 \end{pmatrix}P=\frac{1}{3}\begin{pmatrix} 1 & 1 & 1 \end{pmatrix}$, chaque colonne de $P$ ayant pour somme $1$. Elle est unique d'après la Proposition 3. 
    $$\boxed{\pi=\begin{pmatrix} \tfrac{1}{3} & \tfrac{1}{3} & \tfrac{1}{3} \end{pmatrix}}$$
     À long terme, la puce a autant de chances d'être sur chacun des trois sommets, ce que la symétrie du triangle laissait prévoir. La probabilité de retour oscille autour de $\frac{1}{3}$ en s'en rapprochant, à cause du signe alterné de $\left(-\frac{1}{2}\right)^{n}$. Ce calcul est celui du graphe complet $K_{3}$ (exercice 29 du chapitre 6), divisé par $2^{n}$.
