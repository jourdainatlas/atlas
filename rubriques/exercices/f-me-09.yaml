    **2.** $T=\begin{pmatrix} 0{,}6&0{,}4&0\\0{,}55&0{,}2 &0{,}25 \\0 &0{,}9&0{,}1 \end{pmatrix}$

    **3.** $T=\begin{pmatrix} 0{,}5&0&0{,}5 &0\\ 0{,}1 &0{,}2& 0{,}4 &0{,}3\\0& 1 &0 &0\\0{,}2& 0{,}3& 0{,}5& 0\end{pmatrix}$
