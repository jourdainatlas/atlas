- id: "me-09-05"
  feuille: "f-me-09"
  numero: 5
  titre: "Reconnaître une matrice stochastique"
  partie: "Graphes probabilistes et matrices de transition"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [matrice de transition, puissances de matrices]
  noeuds: [v-matrices]
  notions: [espace-matrices]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Parmi les matrices suivantes, lesquelles sont stochastiques ? Justifier. 
    $$M_{1}=\begin{pmatrix} 0{,}3 & 0{,}7 \\ 0{,}6 & 0{,}4 \end{pmatrix} \quad M_{2}=\begin{pmatrix} 0{,}5 & 0{,}5 \\ 0{,}2 & 0{,}7 \end{pmatrix} \quad M_{3}=\begin{pmatrix} 1{,}2 & -0{,}2 \\ 0{,}5 & 0{,}5 \end{pmatrix} \quad M_{4}=\begin{pmatrix} 0{,}2 & 0{,}5 \\ 0{,}8 & 0{,}5 \end{pmatrix}$$

    **2.** On note $U=\begin{pmatrix} 1 \\ 1 \end{pmatrix}$. Montrer qu'une matrice carrée d'ordre $2$ à coefficients positifs est stochastique si et seulement si $MU=U$.

    **3.** En déduire que le produit de deux matrices stochastiques d'ordre $2$ est stochastique, puis que toute puissance d'une matrice stochastique est stochastique. Quel résultat du cours retrouve-t-on ainsi ?
  corrige: |
    **1.** Une matrice est stochastique si ses coefficients sont dans $[0\,;1]$ et si la somme de chaque **ligne** vaut $1$.

    • $M_{1}$ : $0{,}3+0{,}7=1$ et $0{,}6+0{,}4=1$ : **stochastique**.

    • $M_{2}$ : $0{,}2+0{,}7=0{,}9\neq 1$ : **non stochastique**.

    • $M_{3}$ : les lignes ont bien pour somme $1$, mais $1{,}2$ et $-0{,}2$ ne sont pas des probabilités : **non stochastique**.

    • $M_{4}$ : $0{,}2+0{,}5=0{,}7\neq 1$ : **non stochastique**. Ce sont ses *colonnes* qui ont pour somme $1$. **L'erreur la plus répandue** est de vérifier les colonnes au lieu des lignes : la ligne $i$ regroupe les probabilités de sortie de l'état $i$, qui doivent totaliser $1$.

    **2.** Si $M=\begin{pmatrix} a & b \\ c & d \end{pmatrix}$, alors $MU=\begin{pmatrix} a+b \\ c+d \end{pmatrix}$, qui est égal à $U$ si et seulement si les deux lignes ont pour somme $1$. Les coefficients étant positifs, ils sont alors tous inférieurs ou égaux à $1$. $\boxed{M \text{ stochastique} \iff MU=U}$

    **3.** Si $M$ et $N$ sont stochastiques, $MN$ est à coefficients positifs, comme somme de produits de positifs, et $(MN)U=M(NU)=MU=U$ : $\boxed{MN \text{ est stochastique}}$. Par récurrence, $M^{n}U=U$ pour tout $n$ : toute puissance de $M$ est stochastique. On retrouve que $P^{n}$ est une matrice de transition, celle du passage en $n$ étapes (relation de Chapman-Kolmogorov). Le même raisonnement vaut pour des matrices de taille quelconque.
- id: "me-09-06"
  feuille: "f-me-09"
  numero: 6
  partie: "Calcul de distributions"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, probabilités conditionnelles, suites]
  noeuds: [v-matrices, p-variables, p-espace, n-recurrence]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Dans une usine, deux machines $A$ et $B$ peuvent tomber en panne de manière indépendante l’une de l’autre dans la journée avec une probabilité $\dfrac{1}{3}$. On suppose que si une machine tombe en panne, elle est réparée dans la nuit mais que l’on ne peut réparer qu’une seule machine en une nuit. On note $X_{n}$ le nombre de machines en panne au matin du $n$-ième jour.

    **1.** **(a)** Justifier que la suite $(X_{n})$ forme une chaîne de Markov homogène.

    **(b)** Pourquoi peut-on considérer deux états ? Quels sont-ils ?

    **2.** **(a)** On appelle $P_{A}$ et $P_{B}$ les événements correspondant à « la machine $A$ est en panne » et « la machine $B$ est en panne ». Compléter le tableau de probabilité double entrée suivant :

    2 
    $$\begin{array}{|c|c|c|c|} \hline  & P_{A} & \overline{P_{A}} & \text{Total} \\ \hline P_{B} &  &  & \dfrac{1}{3} \\ \hline \overline{P_{B}} &  &  &  \\ \hline \text{Total} &  &  & 1 \\ \hline \end{array}$$

    **(b)** En déduire la matrice de transition de cette chaîne de Markov.

    **(c)** Représenter le graphe de cette chaîne de Markov.
  corrige: |
    **1.** **(a)** L'état du système au matin du jour $n+1$ ne dépend que du nombre de machines en panne au matin du jour $n$ : les pannes de la journée sont indépendantes de ce qui s'est produit les jours précédents, et la réparation nocturne ne dépend que de l'état du soir. 
    $$\boxed{(X_{n}) \text{ est une chaîne de Markov}}$$
     De plus les probabilités de panne, égales à $\dfrac{1}{3}$, ne dépendent pas du jour considéré : 
    $$\boxed{\text{la chaîne est homogène}}$$

    **(b)** Au soir, il y a au plus $2$ machines en panne, et l'on en répare exactement une lorsqu'il y en a au moins une. Il reste donc au matin *au plus une* machine en panne. 
    $$\boxed{\text{Les états possibles sont } 0 \text{ et } 1}$$
     *L'état $2$ est inaccessible dès le deuxième matin : c'est ce qui permet de se limiter à deux états.*

    **2.** **(a)** Les deux pannes étant indépendantes, chaque case du tableau est le produit des deux probabilités marginales.

    $$\begin{array}{|c||c|c||c|} \hline  & P_{A} & \overline{P_{A}} & \text{Total} \\ \hline P_{B} & \dfrac{1}{9} & \dfrac{2}{9} & \dfrac{1}{3} \\ \hline \overline{P_{B}} & \dfrac{2}{9} & \dfrac{4}{9} & \dfrac{2}{3} \\ \hline \hline \text{Total} & \dfrac{1}{3} & \dfrac{2}{3} & 1 \\ \hline \end{array}$$

    **(b)** Depuis l'état $0$ (les deux machines fonctionnent le matin) : elles peuvent toutes deux tomber en panne dans la journée.

    • Aucune panne : probabilité $\dfrac{4}{9}$, rien à réparer, on repart de $0$.

    • Une seule panne : probabilité $\dfrac{2}{9}+\dfrac{2}{9}=\dfrac{4}{9}$, elle est réparée la nuit, on repart de $0$.

    • Deux pannes : probabilité $\dfrac{1}{9}$, une seule est réparée, on repart de $1$.

    $$P(0\to 0)=\frac{4}{9}+\frac{4}{9}=\frac{8}{9} \qquad ; \qquad P(0\to 1)=\frac{1}{9}$$

    Depuis l'état $1$ : une machine est déjà en panne, seule l'autre peut tomber. 
    $$P(1\to 0)=\frac{2}{3} \qquad \text{(l'autre tient : on répare la seule en panne)}$$

    $$P(1\to 1)=\frac{1}{3} \qquad \text{(l'autre tombe : deux pannes, une seule réparée)}$$

    $$\boxed{T=\begin{pmatrix} \dfrac{8}{9} & \dfrac{1}{9} \\[3mm] \dfrac{2}{3} & \dfrac{1}{3} \end{pmatrix}}$$

    **(c)**

    ![Figure](documents/figures/54231c42dac14ad1.svg)
- id: "me-09-07"
  feuille: "f-me-09"
  numero: 7
  partie: "Calcul de distributions"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, probabilités conditionnelles]
  noeuds: [v-matrices, p-variables, p-espace]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On considère une chaîne de Markov $(X_{n})$ admettant le graphe probabiliste ci-contre.

    **1.** On a $P(X_{0}=A)=0{,}2$ et $P(X_{0}=B)=0{,}5$.

    Déterminer les probabilités suivantes :

    **(a)** $P(X_{1}=A)$

    **(b)** $P(X_{1}=B)$

    **(c)** $P(X_{1}=C)$

    **(d)** $P(X_{2}=A)$

    **2.** Déterminer la matrice de transition $M$ associée à cette chaîne de Markov.

    ![Figure](documents/figures/2b7d9185810eda71.svg)
  corrige: |
    **1.** Comme $P(X_{0}=A)+P(X_{0}=B)+P(X_{0}=C)=1$, on a $P(X_{0}=C)=1-0{,}2-0{,}5=0{,}3$, d'où $\pi_{0}=\begin{pmatrix} 0{,}2 & 0{,}5 & 0{,}3 \end{pmatrix}$.

    On lit sur le graphe les probabilités d'arriver en chaque état, à l'aide de la formule des probabilités totales.

    **(a)** 
    $$P(X_{1}=A)=0{,}2\times 0{,}3+0{,}5\times 0{,}7+0{,}3\times 0{,}4 =0{,}06+0{,}35+0{,}12=\boxed{0{,}53}$$

    **(b)** 
    $$P(X_{1}=B)=0{,}2\times 0{,}5+0{,}5\times 0{,}3+0{,}3\times 0{,}6 =0{,}10+0{,}15+0{,}18=\boxed{0{,}43}$$

    **(c)** 
    $$P(X_{1}=C)=0{,}2\times 0{,}2+0{,}5\times 0+0{,}3\times 0=\boxed{0{,}04}$$
     On vérifie : $0{,}53+0{,}43+0{,}04=1$.

    **(d)** On repart de $\pi_{1}=\begin{pmatrix} 0{,}53 & 0{,}43 & 0{,}04 \end{pmatrix}$ : 
    $$P(X_{2}=A)=0{,}53\times 0{,}3+0{,}43\times 0{,}7+0{,}04\times 0{,}4 =0{,}159+0{,}301+0{,}016=\boxed{0{,}476}$$

    **2.** On lit les arêtes partant de chaque sommet : 
    $$\boxed{M=\begin{pmatrix} 0{,}3 & 0{,}5 & 0{,}2 \\ 0{,}7 & 0{,}3 & 0 \\ 0{,}4 & 0{,}6 & 0 \end{pmatrix}}$$
     Les deux zéros de la dernière colonne traduisent qu'aucune arête n'arrive en $C$ depuis $B$ ou depuis $C$ : une fois quitté, l'état $C$ ne peut être atteint que depuis $A$.

    On retrouve alors les résultats de la question 1 par le calcul matriciel : 
    $$\pi_{1}=\pi_{0}M=\begin{pmatrix} 0{,}53 & 0{,}43 & 0{,}04 \end{pmatrix} \qquad ; \qquad \pi_{2}=\pi_{1}M=\begin{pmatrix} 0{,}476 & 0{,}418 & 0{,}106 \end{pmatrix}$$
- id: "me-09-08"
  feuille: "f-me-09"
  numero: 8
  partie: "Calcul de distributions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [matrice de transition, chaînes de Markov]
  noeuds: [v-matrices, p-variables, p-espace]
  notions: [espace-matrices, variable-aleatoire]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On considère que la météo varie entre deux états beau et mauvais temps. Après un jour de beau temps, on a une chance sur deux que le temps change le jour suivant et le mauvais temps a trois fois plus de chance de durer d’un jour au jour suivant.

    **1.** Pourquoi peut-on dire que la situation peut être modélisée par une chaîne de Markov ?

    **2.** Donner sa matrice de transition.
  corrige: |
    **1.** Le temps d'un jour ne dépend que de celui de la veille, et les règles données ne dépendent pas de la date. 
    $$\boxed{\text{C'est une chaîne de Markov homogène, à deux états } B \text{ et } M}$$

    **2.** Depuis le beau temps. « Une chance sur deux que le temps change » signifie $P(B\to M)=\dfrac{1}{2}$, donc $P(B\to B)=\dfrac{1}{2}$.

    Depuis le mauvais temps. « Le mauvais temps a trois fois plus de chance de durer » signifie $P(M\to M)=3\,P(M\to B)$. Comme la somme vaut $1$ : 
    $$P(M\to B)+3\,P(M\to B)=1 \iff P(M\to B)=\frac{1}{4} \qquad \text{et} \qquad P(M\to M)=\frac{3}{4}$$

    $$\boxed{T=\begin{pmatrix} \dfrac{1}{2} & \dfrac{1}{2} \\[3mm] \dfrac{1}{4} & \dfrac{3}{4} \end{pmatrix}}$$

    ![Figure](documents/figures/2c0ff80f5fc1a58f.svg)
- id: "me-09-09"
  feuille: "f-me-09"
  numero: 9
  partie: "Calcul de distributions"
  etoiles: 1
  types: [Calcul]
  mots_cles: [graphes probabilistes, matrice de transition, probabilités conditionnelles, distributions, puissances de matrices]
  noeuds: [v-matrices, p-espace, p-variables]
  notions: [espace-matrices, espace-probabilise]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Deux marques de lessive $A$ et $B$ se partagent un marché. D'un mois sur l'autre, $80\,\%$ des clients de $A$ lui restent fidèles, tandis que $30\,\%$ des clients de $B$ passent à $A$. Au départ, chaque marque a la moitié des clients. On note $\pi_{n}=\begin{pmatrix} a_{n} & b_{n} \end{pmatrix}$ la répartition des clients au bout de $n$ mois.

    **1.** Représenter la situation par un graphe probabiliste et donner la matrice de transition $P$.

    **2.** Calculer $\pi_{1}$ puis $\pi_{2}$.

    **3.** Calculer $P^{2}$. Quelle est la probabilité qu'un client de $B$ soit client de $A$ deux mois plus tard ?
  corrige: |
    **1.** Depuis $A$ : $0{,}8$ vers $A$, donc $0{,}2$ vers $B$. Depuis $B$ : $0{,}3$ vers $A$, donc $0{,}7$ vers $B$.

    ![Figure](documents/figures/887154e40d5cdb56.svg)

    $$\boxed{P=\begin{pmatrix} 0{,}8 & 0{,}2 \\ 0{,}3 & 0{,}7 \end{pmatrix}}$$

    **2.** $\pi_{0}=\begin{pmatrix} 0{,}5 & 0{,}5 \end{pmatrix}$, puis : 
    $$\pi_{1}=\pi_{0}P=\begin{pmatrix} 0{,}4+0{,}15 & 0{,}1+0{,}35 \end{pmatrix}=\boxed{\begin{pmatrix} 0{,}55 & 0{,}45 \end{pmatrix}}$$

    $$\pi_{2}=\pi_{1}P=\begin{pmatrix} 0{,}44+0{,}135 & 0{,}11+0{,}315 \end{pmatrix}=\boxed{\begin{pmatrix} 0{,}575 & 0{,}425 \end{pmatrix}}$$
     La marque $A$ gagne des parts de marché.

    **3.** 
    $$P^{2}=\begin{pmatrix} 0{,}64+0{,}06 & 0{,}16+0{,}14 \\ 0{,}24+0{,}21 & 0{,}06+0{,}49 \end{pmatrix}=\begin{pmatrix} 0{,}7 & 0{,}3 \\ 0{,}45 & 0{,}55 \end{pmatrix}$$
     D'après la relation de Chapman-Kolmogorov, la probabilité de passer de $B$ à $A$ en deux mois est le coefficient en ligne $2$ et colonne $1$ de $P^{2}$ : $\boxed{0{,}45}$. On le vérifie en listant les deux trajets : $B\to A\to A$, de probabilité $0{,}3\times 0{,}8=0{,}24$, et $B\to B\to A$, de probabilité $0{,}7\times 0{,}3=0{,}21$.
