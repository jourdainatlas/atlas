  enonce: |
    Soient $p$ et $q$ deux réels de $]0\,;1[$, et $P=\begin{pmatrix} 1-p & p \\ q & 1-q \end{pmatrix}$. On pose $r=1-p-q$ et : 
    $$A=\frac{1}{p+q}\begin{pmatrix} q & p \\ q & p \end{pmatrix} \qquad \text{et} \qquad B=\frac{1}{p+q}\begin{pmatrix} p & -p \\ -q & q \end{pmatrix}$$

    **1.** Vérifier que $A+B=I_{2}$, $P=A+rB$, $A^{2}=A$, $B^{2}=B$ et $AB=BA=0$.

    **2.** Montrer par récurrence que, pour tout $n\in\mathbb{N}$, $P^{n}=A+r^{n}B$.

    **3.** Justifier que $-1<r<1$, puis déterminer la limite de chaque coefficient de $P^{n}$. Que représentent les lignes de la matrice limite ?

    **4.** Application : retrouver la distribution invariante de l'exemple du cours, $P=\begin{pmatrix} 0{,}8 & 0{,}2 \\ 0{,}4 & 0{,}6 \end{pmatrix}$, et donner l'expression de $P^{n}$.
  corrige: |
    **1.** On calcule, en factorisant par $\frac{1}{p+q}$ ou $\frac{1}{(p+q)^{2}}$ :

    • $A+B=\frac{1}{p+q}\begin{pmatrix} p+q & 0 \\ 0 & p+q \end{pmatrix}=I_{2}$ ;

    • $\begin{pmatrix} q & p \\ q & p \end{pmatrix}^{2}=\begin{pmatrix} q^{2}+pq & qp+p^{2} \\ q^{2}+pq & qp+p^{2} \end{pmatrix}=(p+q)\begin{pmatrix} q & p \\ q & p \end{pmatrix}$, d'où $A^{2}=A$ ; de même $\begin{pmatrix} p & -p \\ -q & q \end{pmatrix}^{2}=(p+q)\begin{pmatrix} p & -p \\ -q & q \end{pmatrix}$, d'où $B^{2}=B$ ;

    • $\begin{pmatrix} q & p \\ q & p \end{pmatrix}\begin{pmatrix} p & -p \\ -q & q \end{pmatrix}=\begin{pmatrix} qp-pq & -qp+pq \\ qp-pq & -qp+pq \end{pmatrix}=0$, et de même dans l'autre ordre : $AB=BA=0$ ;

    • le coefficient $(1,1)$ de $A+rB$ vaut $\frac{q+(1-p-q)p}{p+q}=\frac{(p+q)-p(p+q)}{p+q}=1-p$. De même pour les trois autres, on trouve $P=A+rB$.

    **2.** **Initialisation :** $P^{0}=I_{2}=A+B=A+r^{0}B$.

    **Hérédité :** Si $P^{n}=A+r^{n}B$, alors $P^{n+1}=(A+r^{n}B)(A+rB)=A^{2}+rAB+r^{n}BA+r^{n+1}B^{2}=A+r^{n+1}B$.

    **Conclusion :** $\boxed{P^{n}=A+r^{n}B}$ pour tout $n\in\mathbb{N}$.

    **3.** $0<p+q<2$, donc $-1<r=1-(p+q)<1$, et $r^{n}\to 0$. Ainsi : 
    $$P^{n}\xrightarrow[n\to+\infty]{}A=\begin{pmatrix} \frac{q}{p+q} & \frac{p}{p+q} \\[1mm] \frac{q}{p+q} & \frac{p}{p+q} \end{pmatrix}$$
     Les deux lignes de la limite sont égales à la distribution invariante $\pi=\left(\frac{q}{p+q},\frac{p}{p+q}\right)$ trouvée dans la démonstration de la Proposition 4. Quel que soit l'état de départ, la loi de $X_{n}$ tend vers $\pi$.

    **4.** Ici $p=0{,}2$, $q=0{,}4$ et $r=0{,}4$ : 
    $$\boxed{P^{n}=\begin{pmatrix} \frac{2}{3} & \frac{1}{3} \\[1mm] \frac{2}{3} & \frac{1}{3} \end{pmatrix}+0{,}4^{n}\begin{pmatrix} \frac{1}{3} & -\frac{1}{3} \\[1mm] -\frac{2}{3} & \frac{2}{3} \end{pmatrix}}$$
     On retrouve $\pi=\begin{pmatrix} \frac{2}{3} & \frac{1}{3} \end{pmatrix}$. Contrôle pour $n=1$ : $\frac{2}{3}+0{,}4\times\frac{1}{3}=\frac{2{,}4}{3}=0{,}8$. Cette décomposition joue le rôle de la diagonalisation de l'exercice 26 du chapitre 3 : $A$ et $B$ « séparent » les deux comportements, la partie stable $A$ et la partie qui s'éteint, $r^{n}B$.
- id: "me-09-23"
  feuille: "f-me-09"
  numero: 23
  titre: "Deux piles consécutifs"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Problème, Démonstration, Calcul]
  mots_cles: [matrice de transition, chaînes de Markov, probabilités conditionnelles, distributions, puissances de matrices, convergence, suites, dés et pièces]
  noeuds: [v-matrices, p-variables, p-espace, n-recurrence]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  source: "inspiré de poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 309 (modélisation par une chaîne de Markov)"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    On lance une pièce équilibrée de façon répétée. Pour $n\in\mathbb{N}^{*}$, on note $p_{n}$ la probabilité de n'avoir jamais observé deux piles consécutifs au cours des $n$ premiers lancers. On considère la chaîne de Markov $(X_{n})$ à trois états :

    • $0$ : « deux piles consécutifs ne sont pas encore apparus, et le dernier lancer est face (ou aucun lancer n'a eu lieu) » ;

    • $1$ : « deux piles consécutifs ne sont pas encore apparus, et le dernier lancer est pile » ;

    • $2$ : « deux piles consécutifs sont déjà apparus ».

    **1.** Donner la matrice de transition $T$ et la distribution initiale $\pi_{0}$. Calculer $p_{1}$ et $p_{2}$.

    **2.** On note $\pi_{n}=\begin{pmatrix} a_{n} & b_{n} & c_{n} \end{pmatrix}$. Exprimer $a_{n+1}$ et $b_{n+1}$ en fonction de $a_{n}$ et $b_{n}$, puis montrer que $p_{n}=a_{n}+b_{n}$ vérifie : 
    $$\forall n\in\mathbb{N}^{*}, \qquad p_{n+2}=\frac{p_{n+1}}{2}+\frac{p_{n}}{4}.$$

    **3.** La suite de Fibonacci est définie par $F_{1}=F_{2}=1$ et $F_{n+2}=F_{n+1}+F_{n}$. Montrer que, pour tout $n\in\mathbb{N}^{*}$, $p_{n}=\dfrac{F_{n+2}}{2^{n}}$.

    **4.** Montrer que, pour tout $n\in\mathbb{N}^{*}$, $F_{n}\leqslant\left(\dfrac{7}{4}\right)^{n}$, puis en déduire la limite de $(p_{n})$. Interpréter.
  corrige: |
    ![Figure](documents/figures/e63965196d94b159.svg)

    Un pile fait passer de $0$ à $1$, puis de $1$ à l'état absorbant $2$ ; un face ramène toujours en $0$, sauf depuis l'état $2$.

    **1.** 
    $$T=\begin{pmatrix} \frac{1}{2} & \frac{1}{2} & 0 \\[1mm] \frac{1}{2} & 0 & \frac{1}{2} \\[1mm] 0 & 0 & 1 \end{pmatrix} \qquad ; \qquad \pi_{0}=\begin{pmatrix} 1 & 0 & 0 \end{pmatrix}$$
     $\pi_{1}=\begin{pmatrix} \frac{1}{2} & \frac{1}{2} & 0 \end{pmatrix}$ et $\pi_{2}=\begin{pmatrix} \frac{1}{2} & \frac{1}{4} & \frac{1}{4} \end{pmatrix}$, donc $\boxed{p_{1}=1}$ et $\boxed{p_{2}=\frac{3}{4}}$ : sur quatre suites de deux lancers, seule $PP$ est exclue.

    **2.** $\pi_{n+1}=\pi_{n}T$ donne $a_{n+1}=\frac{1}{2}a_{n}+\frac{1}{2}b_{n}=\frac{1}{2}p_{n}$ et $b_{n+1}=\frac{1}{2}a_{n}$. Alors : 
    $$p_{n+2}=a_{n+2}+b_{n+2}=\frac{1}{2}p_{n+1}+\frac{1}{2}a_{n+1}=\frac{1}{2}p_{n+1}+\frac{1}{4}p_{n}$$

    **3.** Récurrence à deux termes. **Initialisation :** $\frac{F_{3}}{2}=\frac{2}{2}=1=p_{1}$ et $\frac{F_{4}}{4}=\frac{3}{4}=p_{2}$. **Hérédité :** Si la formule est vraie aux rangs $n$ et $n+1$ : 
    $$p_{n+2}=\frac{1}{2}\times\frac{F_{n+3}}{2^{n+1}}+\frac{1}{4}\times\frac{F_{n+2}}{2^{n}}=\frac{F_{n+3}+F_{n+2}}{2^{n+2}}=\frac{F_{n+4}}{2^{n+2}}$$
     **Conclusion :** $\boxed{p_{n}=\dfrac{F_{n+2}}{2^{n}}}$ pour tout $n\in\mathbb{N}^{*}$. Autrement dit, parmi les $2^{n}$ suites de $n$ lancers, exactement $F_{n+2}$ ne contiennent pas deux piles consécutifs.

    **4.** Récurrence à deux termes encore : $F_{1}=1\leqslant\frac{7}{4}$ et $F_{2}=1\leqslant\frac{49}{16}$. Si $F_{n}\leqslant\left(\frac{7}{4}\right)^{n}$ et $F_{n+1}\leqslant\left(\frac{7}{4}\right)^{n+1}$, alors : 
    $$F_{n+2}\leqslant\left(\frac{7}{4}\right)^{n}\left(1+\frac{7}{4}\right)=\left(\frac{7}{4}\right)^{n}\times\frac{44}{16}\leqslant\left(\frac{7}{4}\right)^{n}\times\frac{49}{16}=\left(\frac{7}{4}\right)^{n+2}$$
     On en déduit : 
    $$0\leqslant p_{n}\leqslant\frac{1}{2^{n}}\left(\frac{7}{4}\right)^{n+2}=\frac{49}{16}\left(\frac{7}{8}\right)^{n}$$
     Comme $0<\frac{7}{8}<1$, le majorant tend vers $0$, et par le théorème des gendarmes : $\boxed{\lim_{n\to+\infty}p_{n}=0}$. Deux piles consécutifs finissent par apparaître avec une probabilité aussi proche de $1$ que l'on veut : l'état $2$ absorbe la chaîne, comme dans l'exercice 20.

