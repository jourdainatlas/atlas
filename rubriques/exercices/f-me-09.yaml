  source: "inspiré de poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 266, 267 et 307 (modélisation par une chaîne de Markov)"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    On lance un dé non pipé de façon répétée. On note $X_{n}$ l'état après $n$ lancers : $X_{n}=0$ si aucun $6$ n'est encore sorti, $X_{n}=1$ sinon.

    **1.** Justifier que $(X_{n})$ est une chaîne de Markov homogène, et donner sa matrice de transition $T$. Quel est l'état absorbant ?

    **2.** Montrer par récurrence que, pour tout $n\in\mathbb{N}$, $T^{n}=\begin{pmatrix} \left(\frac{5}{6}\right)^{n} & 1-\left(\frac{5}{6}\right)^{n} \\ 0 & 1 \end{pmatrix}$.

    **3.** En déduire la probabilité $p_{n}$ d'obtenir au moins un $6$ en $n$ lancers, ainsi que sa limite.

    **4.** *Problème posé à Pascal par le chevalier de Méré.* La probabilité qu'en $4$ lancers le dé amène au moins un $6$ est-elle supérieure à $\dfrac{1}{2}$ ? Même question pour la probabilité d'obtenir au moins un double six en $24$ lancers de deux dés, en adaptant la chaîne.

    **5.** Pour $k\geqslant 1$, on note $T_{6}$ le rang du premier $6$. Calculer $P(T_{6}=k)$.
  corrige: |
    **1.** L'état après le lancer $n+1$ ne dépend que de l'état après le lancer $n$ et du résultat du lancer $n+1$, indépendant des précédents, avec les mêmes probabilités à chaque lancer : la chaîne est de Markov et homogène. 
    $$\boxed{T=\begin{pmatrix} \frac{5}{6} & \frac{1}{6} \\ 0 & 1 \end{pmatrix}}$$
     L'état $1$ est **absorbant** : une fois un $6$ sorti, on reste dans l'état $1$.

    **2.** **Initialisation :** $T^{0}=I_{2}$ correspond bien à la formule pour $n=0$.

    **Hérédité :** Si la formule est vraie au rang $n$, alors : 
    $$T^{n+1}=T^{n}T=\begin{pmatrix} \left(\frac{5}{6}\right)^{n}\times\frac{5}{6} & \left(\frac{5}{6}\right)^{n}\times\frac{1}{6}+1-\left(\frac{5}{6}\right)^{n} \\ 0 & 1 \end{pmatrix}=\begin{pmatrix} \left(\frac{5}{6}\right)^{n+1} & 1-\left(\frac{5}{6}\right)^{n+1} \\ 0 & 1 \end{pmatrix}$$
     car $\left(\frac{5}{6}\right)^{n}\left(\frac{1}{6}-1\right)=-\left(\frac{5}{6}\right)^{n+1}$.

    **Conclusion :** La formule est vraie pour tout $n\in\mathbb{N}$.

    **3.** On part de l'état $0$ : $p_{n}$ est le coefficient en ligne $1$ et colonne $2$ de $T^{n}$. 
    $$\boxed{p_{n}=1-\left(\frac{5}{6}\right)^{n}\xrightarrow[n\to+\infty]{}1}$$
     car $0<\frac{5}{6}<1$. Un événement de probabilité non nulle, répété indépendamment, finit par se produire avec une probabilité aussi proche de $1$ que l'on veut.

    **4.** $p_{4}=1-\frac{625}{1296}=\frac{671}{1296}\approx 0{,}518>\frac{1}{2}$ : **oui**. Pour le double six, la chaîne est la même avec $\frac{35}{36}$ et $\frac{1}{36}$ à la place de $\frac{5}{6}$ et $\frac{1}{6}$ : 
    $$1-\left(\frac{35}{36}\right)^{24}\approx 0{,}491<\frac{1}{2}$$
     **Non**. Le chevalier de Méré pensait, par une règle de proportionnalité, que les deux paris étaient équivalents : $4$ est à $6$ comme $24$ est à $36$. Le calcul montre que le premier est favorable et le second défavorable.

    **5.** L'événement $(T_{6}=k)$ signifie $X_{k-1}=0$ et $X_{k}=1$. D'après la question 2 et la propriété de Markov : 
    $$\boxed{P(T_{6}=k)=P(X_{k-1}=0)\times P_{(X_{k-1}=0)}(X_{k}=1)=\left(\frac{5}{6}\right)^{k-1}\times\frac{1}{6}}$$
     C'est la loi géométrique de paramètre $\frac{1}{6}$. Contrôle : $P(T_{6}=1)=\frac{1}{6}$, comme attendu.
- id: "me-09-21"
  feuille: "f-me-09"
  numero: 21
  titre: "Principe de Hardy-Weinberg"
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [probabilités conditionnelles]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 276 (coquilles corrigées : 2y_2=2(x_1+y_1)(y_1+z_1), et « n-ième génération » en b)"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Un gène possède deux allèles notés $a$ et $A$. Les trois génotypes possibles sont donc $aa$, $aA$, $AA$, avec des probabilités respectives $x_{1}$, $2y_{1}$, $z_{1}$. Chaque allèle $a$ et $A$ a une probabilité $\dfrac{1}{2}$ d'être transmis. Les parents sont sélectionnés indépendamment.

    **a)** On note $x_{2}$, $2y_{2}$ et $z_{2}$ les probabilités respectives des génotypes $aa$, $aA$, $AA$ à la seconde génération. Montrer que 
    $$x_{2}=(x_{1}+y_{1})^{2}, \qquad 2y_{2}=2(x_{1}+y_{1})(y_{1}+z_{1}), \qquad z_{2}=(y_{1}+z_{1})^{2}.$$

    **b)** Montrer que la probabilité de chaque génotype est constante à partir de la seconde génération, c'est-à-dire que, si on note $x_{n}$, $2y_{n}$ et $z_{n}$ les probabilités respectives des génotypes $aa$, $aA$, $AA$ à la $n$-ième génération, on a, pour tout entier $n\geqslant 2$, 
    $$x_{n}=x_{2}, \qquad y_{n}=y_{2}, \qquad z_{n}=z_{2}.$$
  corrige: |
    On suppose bien sûr $x_{1}+2y_{1}+z_{1}=1$.

    **a)** Un parent pris au hasard transmet l'allèle $a$ s'il est de génotype $aa$ (probabilité $x_{1}$, transmission certaine) ou s'il est de génotype $aA$ (probabilité $2y_{1}$, transmission avec probabilité $\frac{1}{2}$). Par la formule des probabilités totales, il transmet $a$ avec la probabilité $\alpha=x_{1}+2y_{1}\times\frac{1}{2}=x_{1}+y_{1}$, et $A$ avec la probabilité $\beta=y_{1}+z_{1}=1-\alpha$. Les deux parents étant indépendants : 
    $$\boxed{x_{2}=\alpha^{2}=(x_{1}+y_{1})^{2} \qquad z_{2}=\beta^{2}=(y_{1}+z_{1})^{2} \qquad 2y_{2}=2\alpha\beta=2(x_{1}+y_{1})(y_{1}+z_{1})}$$
     Le facteur $2$ du génotype $aA$ vient de ce que l'allèle $a$ peut venir du père ou de la mère.

    **b)** La probabilité de transmettre $a$ à la génération suivante vaut : 
    $$x_{2}+y_{2}=\alpha^{2}+\alpha\beta=\alpha(\alpha+\beta)=\alpha=x_{1}+y_{1}$$
     **La fréquence de l'allèle $a$ est conservée**. Le même calcul, appliqué entre les générations $n$ et $n+1$, montre par récurrence que $x_{n}+y_{n}=\alpha$ pour tout $n\geqslant 1$, et donc $y_{n}+z_{n}=\beta$. Pour $n\geqslant 2$, la question a) appliquée entre les générations $n-1$ et $n$ donne : 
    $$x_{n}=(x_{n-1}+y_{n-1})^{2}=\alpha^{2}=x_{2}, \qquad y_{n}=\alpha\beta=y_{2}, \qquad z_{n}=\beta^{2}=z_{2}$$

    $$\boxed{\text{la répartition des génotypes est stable dès la deuxième génération}}$$

    *Comme pour la Partie B de l'exercice 16, l'état d'équilibre est atteint en une seule étape. Ce n'est pas tout à fait une chaîne de Markov au sens du cours : les probabilités de la génération suivante dépendent ici de la répartition des génotypes de toute la population, et non d'une matrice fixe.*
