  enonce: |
    **1.** Construire la matrice de transition associée au graphe suivant :

    **2.** Construire le graphe orienté associé à la matrice : 
    $$\begin{pmatrix} 0{,}2 & 0 & 0 & 0{,}8 \\ 0 & 0{,}7 & 0{,}1 & 0{,}2 \\ 0{,}5 & 0{,}4 & 0{,}1 & 0 \\ 0{,}2 & 0{,}2 & 0{,}3 & 0{,}3 \end{pmatrix}$$

    ![Figure](documents/figures/23b43d9a697819bf.svg)
  corrige: |
    **1.** On lit sur le graphe, pour chaque sommet, les arêtes qui en *partent*. La ligne $i$ de la matrice regroupe les probabilités de transition depuis l'état $i$.

    ```tableau
    **Depuis** ¦ **Transitions lues sur le graphe**
    $A$ ¦ $A\to A$ : $0{,}2$ ; $A\to B$ : $0{,}3$ ; $A\to C$ : $0{,}5$
    $B$ ¦ $B\to A$ : $0{,}6$ ; $B\to C$ : $0{,}4$ ; pas de boucle en $B$
    $C$ ¦ $C\to B$ : $0{,}9$ ; $C\to C$ : $0{,}1$ ; pas d'arête $C\to A$
    ```

    $$\boxed{T=\begin{pmatrix} 0{,}2 & 0{,}3 & 0{,}5 \\ 0{,}6 & 0 & 0{,}4 \\ 0 & 0{,}9 & 0{,}1 \end{pmatrix}}$$
     On vérifie que chaque ligne a pour somme $1$ : la matrice est bien **stochastique**.

    **2.** Chaque coefficient non nul $t_{ij}$ donne une flèche de l'état $i$ vers l'état $j$, étiquetée par $t_{ij}$. Les états sont notés $A$, $B$, $C$, $D$ dans l'ordre des lignes.

    ![Figure](documents/figures/5ca79bba827e7c19.svg)

    *On prendra garde à ne pas oublier les coefficients nuls : ils correspondent simplement à une flèche absente.*
- id: "me-09-02"
  feuille: "f-me-09"
  numero: 2
  partie: "Graphes probabilistes et matrices de transition"
  etoiles: 1
  types: [Calcul]
  mots_cles: [graphes probabilistes, matrice de transition]
  noeuds: [v-matrices]
  notions: [espace-matrices]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Trois chaînes de télévision $A$, $B$, $C$ se partagent la diffusion de la coupe du monde de football. D’un match au suivant, elle évolue de la façon suivante :

    • 10% des téléspectateurs de $A$ passent sur $B$ et 10% sur $C$ ;

    • 20% des téléspectateurs de $B$ passent sur $A$ et 10% sur $C$ ;

    • 30% des téléspectateurs de $C$ passent sur $A$ et 10% sur $B$.

    **1.** Représenter cette évolution par un graphe.

    **2.** Pourquoi s’agit-il d’un graphe probabiliste ?

    **3.** Déterminer la matrice de transition $M$. (Dans l’ordre $A$, $B$, $C$)
  corrige: |
    **1.** On complète d'abord chaque ligne : les téléspectateurs qui ne changent pas de chaîne restent, ce qui donne la boucle. 
    $$A : \; 1-0{,}1-0{,}1=0{,}8 \qquad ; \qquad B : \; 1-0{,}2-0{,}1=0{,}7 \qquad ; \qquad C : \; 1-0{,}3-0{,}1=0{,}6$$

    ![Figure](documents/figures/39db6c647bd77064.svg)

    **2.** Un graphe est **probabiliste** lorsque chaque arête est étiquetée par un réel de $[0\,;1]$ et que, pour chaque sommet, la somme des étiquettes des arêtes qui en partent vaut $1$. 
    $$\boxed{\text{Ici : } 0{,}8+0{,}1+0{,}1=1 \; ; \; 0{,}2+0{,}7+0{,}1=1 \; ; \; 0{,}3+0{,}1+0{,}6=1}$$

    **3.** 
    $$\boxed{M=\begin{pmatrix} 0{,}8 & 0{,}1 & 0{,}1 \\ 0{,}2 & 0{,}7 & 0{,}1 \\ 0{,}3 & 0{,}1 & 0{,}6 \end{pmatrix}}$$
- id: "me-09-03"
  feuille: "f-me-09"
  numero: 3
  partie: "Graphes probabilistes et matrices de transition"
