  enonce: |
    On dispose de deux urnes $A$ et $B$.

    Initialement l’urne $A$ contient trois boules numérotées $1$, $2$, $3$. L’urne $B$ est vide. À chaque instant, on tire au hasard un nombre entre $1$ et $3$ et on change la boule portant le numéro choisi d’urne. On s’intéresse au nombre de boules contenu dans l’urne $A$ à l’instant $n$, que l’on consigne dans une variable aléatoire $(X_{n})$.

    **1.** **(a)** Quels sont les états possibles pour $(X_{n})$ ?

    **(b)** Justifier que $(X_{n})$ est une chaîne de Markov homogène.

    **(c)** Quelle est la répartition initiale $\pi_{0}$ associée au problème ?

    **(d)** Représenter le graphe de cette chaîne de Markov.

    **(e)** En déduire la matrice de transition $T$.

    **2.** Démontrer que la répartition stable $\pi$ correspond à la loi binomiale $\mathscr{B}\left(3,\dfrac{1}{2}\right)$.

    **3.** On note $p_n$, la probabilité qu’il y ait trois boules dans l’urne $A$ à l’instant $n$.

    **(a)** Démontrer que si $n$ est impair, $p_n = 0$.

    **(b)** Expliquer le graphe probabiliste ci-dessous, qui décrit l’évolution du nombre de boules dans l'urne $A$ entre l’étape $2k$ et l’étape $2k + 2$, où $k\in\mathbb{N}$.

    ![Figure](documents/figures/edeb3f0f85080742.svg)

    **(c)** En déduire que pour tout $k\in\mathbb{N}$ : $p_{2k+2}=\dfrac{1}{3}p_{2k}+\dfrac{2}{9}(1-p_{2k})$

    **(d)** On pose $u_k = p_{2k}$ et $v_k = u_k -\dfrac{1}{4}$.

    Montrer que la suite $(v_k)$ est géométrique dont on précisera la raison et le premier terme. En déduire $v_k$ en fonction de $k$ puis $p_{2k}$ en fonction de $k$.

    **(e)** Déterminer $\lim\limits_{k\to +\infty} p_{2k}$. Peut-on déterminer $\lim\limits_{n \to +\infty} p_{n}$ ?

    **(f)** Comment expliquer le résultat de la répartition stable de la question $2.$ ?

    **4.** On appelle $D$ la variable aléatoire qui indique le nombre d’étapes jusqu’au premier retour à l’état initial (trois boules dans A).

    **(a)** Démontrer que, si $n$ est impair, alors $P(D = n) = 0$.

    **(b)** Déterminer $P(D = 2)$ et $P(D = 4)$.

    **(c)** Quelle est la probabilité de revenir au moins une fois à l’état initial en moins de cinq étapes ?
  corrige: |
    **1.** **(a)** L'urne $A$ contient entre $0$ et $3$ boules : 
    $$\boxed{E=\{0\,;1\,;2\,;3\}}$$

    **(b)** À chaque instant on tire un numéro entre $1$ et $3$ de façon équiprobable, et la boule correspondante change d'urne. Le nombre de boules dans $A$ à l'instant $n+1$ ne dépend donc que de celui à l'instant $n$, et la règle du tirage est la même à chaque étape. 
    $$\boxed{(X_{n}) \text{ est une chaîne de Markov homogène}}$$

    **(c)** Initialement les trois boules sont dans $A$ : 
    $$\boxed{\pi_{0}=\begin{pmatrix} 0 & 0 & 0 & 1 \end{pmatrix}}$$

    **(d)** Supposons qu'il y ait $k$ boules dans $A$. Le numéro tiré désigne une boule de $A$ avec probabilité $\dfrac{k}{3}$, auquel cas cette boule part vers $B$ et l'on passe à $k-1$ ; il désigne une boule de $B$ avec probabilité $\dfrac{3-k}{3}$, et l'on passe à $k+1$. 
    $$\boxed{P(k\to k-1)=\frac{k}{3} \qquad ; \qquad P(k\to k+1)=\frac{3-k}{3}}$$

    ![Figure](documents/figures/589a57881a60a9f5.svg)

    *Aucune boucle : le nombre de boules change nécessairement à chaque étape.*

    **(e)** 
    $$\boxed{T=\begin{pmatrix} 0 & 1 & 0 & 0 \\[1mm] \dfrac{1}{3} & 0 & \dfrac{2}{3} & 0 \\[2mm] 0 & \dfrac{2}{3} & 0 & \dfrac{1}{3} \\[2mm] 0 & 0 & 1 & 0 \end{pmatrix}}$$

    **2.** La loi binomiale $\mathcal{B}\left(3,\dfrac{1}{2}\right)$ a pour coefficients $\dbinom{3}{k}\left(\dfrac{1}{2}\right)^{3}$, soit : 
    $$\pi=\begin{pmatrix} \dfrac{1}{8} & \dfrac{3}{8} & \dfrac{3}{8} & \dfrac{1}{8} \end{pmatrix}$$
     Il suffit de vérifier que $\pi T=\pi$, en calculant chaque coefficient du produit : 
    $$\begin{aligned} \text{coefficient } 0 &: \quad \frac{3}{8}\times\frac{1}{3}=\frac{1}{8} \\[1mm] \text{coefficient } 1 &: \quad \frac{1}{8}\times 1+\frac{3}{8}\times\frac{2}{3} =\frac{1}{8}+\frac{2}{8}=\frac{3}{8} \\[1mm] \text{coefficient } 2 &: \quad \frac{3}{8}\times\frac{2}{3}+\frac{1}{8}\times 1 =\frac{2}{8}+\frac{1}{8}=\frac{3}{8} \\[1mm] \text{coefficient } 3 &: \quad \frac{3}{8}\times\frac{1}{3}=\frac{1}{8} \end{aligned}$$
     On retrouve bien $\pi$, et la somme des coefficients vaut $1$. 
    $$\boxed{\pi=\mathcal{B}\left(3,\frac{1}{2}\right) \text{ est la répartition stable de la chaîne}}$$
     *Interprétation : à l'équilibre, chaque boule se trouve dans $A$ ou dans $B$ avec la même probabilité $\dfrac{1}{2}$, indépendamment des autres.*

    **3.** **(a)** À chaque étape, le nombre de boules dans $A$ augmente ou diminue de $1$ : sa **parité change à chaque étape**. Comme $X_{0}=3$ est impair, $X_{n}$ est impair si $n$ est pair, et pair si $n$ est impair. 
    $$\boxed{\text{Si } n \text{ est impair, } X_{n} \text{ est pair, donc } p_{n}=P(X_{n}=3)=0}$$

    **(b)** Aux instants pairs, la chaîne se trouve nécessairement dans un état impair, c'est-à-dire dans $\{1\,;3\}$. Le graphe proposé décrit donc les transitions *en deux étapes* entre ces deux états. On les retrouve par la formule des probabilités totales.

    Depuis $3$. On passe forcément en $2$, puis : 
    $$P(3\to 3 \text{ en } 2 \text{ étapes})=1\times\frac{1}{3}=\frac{1}{3} \qquad ; \qquad P(3\to 1)=1\times\frac{2}{3}=\frac{2}{3}$$

    Depuis $1$. On passe en $0$ avec probabilité $\dfrac{1}{3}$, ou en $2$ avec probabilité $\dfrac{2}{3}$. 
    $$P(1\to 1)=\underbrace{\frac{1}{3}\times 1}_{\text{via } 0} +\underbrace{\frac{2}{3}\times\frac{2}{3}}_{\text{via } 2} =\frac{3}{9}+\frac{4}{9}=\frac{7}{9}$$

    $$P(1\to 3)=\frac{2}{3}\times\frac{1}{3}=\frac{2}{9}$$

    $$\boxed{\text{Les quatre valeurs du graphe sont bien } \frac{7}{9},\ \frac{2}{9},\ \frac{2}{3} \text{ et } \frac{1}{3}}$$

    **(c)** À l'instant $2k$, la chaîne est en $3$ avec probabilité $p_{2k}$, et en $1$ avec probabilité $1-p_{2k}$. La formule des probabilités totales appliquée au graphe précédent donne : 
    $$\boxed{p_{2k+2}=\frac{1}{3}\,p_{2k}+\frac{2}{9}\left(1-p_{2k}\right)}$$

    **(d)** On pose $u_{k}=p_{2k}$. La relation précédente s'écrit : 
    $$u_{k+1}=\frac{1}{3}u_{k}+\frac{2}{9}-\frac{2}{9}u_{k} =\left(\frac{3}{9}-\frac{2}{9}\right)u_{k}+\frac{2}{9} =\frac{1}{9}u_{k}+\frac{2}{9}$$
     Alors, avec $v_{k}=u_{k}-\dfrac{1}{4}$ : 
    $$\begin{aligned} v_{k+1} &= u_{k+1}-\frac{1}{4}=\frac{1}{9}u_{k}+\frac{2}{9}-\frac{1}{4} \\ &= \frac{1}{9}\left(v_{k}+\frac{1}{4}\right)+\frac{2}{9}-\frac{1}{4} \\ &= \frac{1}{9}v_{k}+\frac{1}{36}+\frac{8}{36}-\frac{9}{36}=\frac{1}{9}v_{k} \end{aligned}$$

    $$\boxed{(v_{k}) \text{ est géométrique de raison } \frac{1}{9}}$$
     Son premier terme vaut $v_{0}=u_{0}-\dfrac{1}{4}=p_{0}-\dfrac{1}{4}=1-\dfrac{1}{4} =\dfrac{3}{4}$, puisque les trois boules sont initialement dans $A$. 
    $$\boxed{v_{k}=\frac{3}{4}\left(\frac{1}{9}\right)^{k}}$$

    $$\boxed{p_{2k}=u_{k}=v_{k}+\frac{1}{4}=\frac{1}{4} +\frac{3}{4}\left(\frac{1}{9}\right)^{k}}$$
     Vérification pour $k=1$ : $\dfrac{1}{4}+\dfrac{3}{4}\times\dfrac{1}{9} =\dfrac{1}{4}+\dfrac{1}{12}=\dfrac{1}{3}$, ce qui correspond bien à $P(X_{2}=3)=\dfrac{1}{3}$.

    **(e)** Comme $0<\dfrac{1}{9}<1$, on a $\displaystyle\lim_{k\to+\infty}\left(\dfrac{1}{9}\right)^{k}=0$ : 
    $$\boxed{\lim_{k\to+\infty}p_{2k}=\frac{1}{4}}$$
     En revanche, la suite $(p_{n})$ prend alternativement la valeur $0$ (pour $n$ impair) et des valeurs proches de $\dfrac{1}{4}$ (pour $n$ pair) : ses termes de rang impair tendent vers $0$ et ses termes de rang pair vers $\dfrac{1}{4}$, elle ne peut donc pas converger. 
    $$\boxed{\lim_{n\to+\infty}p_{n} \text{ n'existe pas}}$$

    **(f)** La répartition stable donne pourtant $\pi_{3}=\dfrac{1}{8}$, alors que $p_{2k}$ tend vers $\dfrac{1}{4}$. Il n'y a pas de contradiction : la chaîne est **périodique de période $2$**, donc $\pi_{n}$ ne converge pas vers $\pi$.

    La répartition stable s'interprète ici comme une *moyenne temporelle* : sur deux étapes consécutives, la proportion du temps passé en $3$ vaut 
    $$\frac{1}{2}\left(0+\frac{1}{4}\right)=\frac{1}{8}=\pi_{3}$$

    $$\boxed{\pi \text{ décrit la fréquence de visite à long terme, non la loi de } X_{n}}$$

    **4.** **(a)** Le raisonnement de parité de la question 3a s'applique : partant de $3$, la chaîne ne peut revenir en un état impair qu'après un nombre *pair* d'étapes. 
    $$\boxed{\text{Si } n \text{ est impair, } P(D=n)=0}$$

    **(b)** Cas $D=2$. Depuis $3$ on passe nécessairement en $2$, puis on revient en $3$ avec probabilité $\dfrac{1}{3}$ : 
    $$\boxed{P(D=2)=1\times\frac{1}{3}=\frac{1}{3}}$$

    Cas $D=4$. Il faut ne pas être revenu à l'étape $2$, puis revenir à l'étape $4$. Le seul chemin possible est $3\to 2\to 1\to 2\to 3$ :

    • $3\to 2$ : probabilité $1$ ;

    • $2\to 1$ : probabilité $\dfrac{2}{3}$ (il ne faut pas revenir en $3$) ;

    • $1\to 2$ : probabilité $\dfrac{2}{3}$ (par $0$, on arriverait en $1$ à l'étape $4$) ;

    • $2\to 3$ : probabilité $\dfrac{1}{3}$.

    $$\boxed{P(D=4)=1\times\frac{2}{3}\times\frac{2}{3}\times\frac{1}{3}=\frac{4}{27}}$$

    **(c)** Revenir au moins une fois en moins de cinq étapes signifie $D\leqslant 4$. Les valeurs $1$ et $3$ étant impossibles : 
    $$P(D\leqslant 4)=P(D=2)+P(D=4)=\frac{1}{3}+\frac{4}{27}=\frac{9}{27}+\frac{4}{27}$$

    $$\boxed{P(D\leqslant 4)=\frac{13}{27}\approx 0{,}481}$$
     Il y a donc un peu moins d'une chance sur deux de revoir les trois boules réunies dans l'urne $A$ au cours des quatre premières étapes.
