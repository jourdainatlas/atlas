  page_enonce: 7
  page_corrige: 18
  enonce: |
    Un joueur possède $1$ € et joue à pile ou face avec une pièce équilibrée : il gagne $1$ € s'il obtient pile, il perd $1$ € sinon. Il s'arrête lorsqu'il est ruiné ou lorsqu'il possède $3$ €. On note $X_{n}$ sa fortune après $n$ parties, à valeurs dans $\{0\,;1\,;2\,;3\}$.

    **1.** Représenter le graphe de cette chaîne de Markov et donner sa matrice de transition $P$. Que dire des états $0$ et $3$ ?

    **2.** On note $r_{k}$ la probabilité que le joueur finisse ruiné en partant d'une fortune de $k$ euros. On admet que $r_{0}=1$, $r_{3}=0$ et, en raisonnant sur la première partie, que $r_{1}=\dfrac{1}{2}r_{0}+\dfrac{1}{2}r_{2}$ et $r_{2}=\dfrac{1}{2}r_{1}+\dfrac{1}{2}r_{3}$. Calculer $r_{1}$ et $r_{2}$.

    **3.** À l'aide de la calculatrice, calculer $P^{20}$ et confronter au résultat précédent.

    **4.** Montrer que $\begin{pmatrix} p & 0 & 0 & 1-p \end{pmatrix}$ est une distribution invariante pour tout $p\in[0\,;1]$. Pourquoi ce résultat n'est-il pas en contradiction avec la Proposition 3 du cours ?
  corrige: |
    **1.**

    ![Figure](documents/figures/78a0357b0dea04a6.svg)

    $$\boxed{P=\begin{pmatrix} 1 & 0 & 0 & 0 \\ \frac{1}{2} & 0 & \frac{1}{2} & 0 \\ 0 & \frac{1}{2} & 0 & \frac{1}{2} \\ 0 & 0 & 0 & 1 \end{pmatrix}}$$
     Les états $0$ et $3$ ont une boucle de probabilité $1$ : une fois atteints, on ne les quitte plus. Ce sont des **états absorbants**.

    **2.** Avec $r_{0}=1$ et $r_{3}=0$ : $r_{1}=\frac{1}{2}+\frac{1}{2}r_{2}$ et $r_{2}=\frac{1}{2}r_{1}$. En reportant : $r_{1}=\frac{1}{2}+\frac{1}{4}r_{1}$, soit $\frac{3}{4}r_{1}=\frac{1}{2}$. 
    $$\boxed{r_{1}=\frac{2}{3} \qquad ; \qquad r_{2}=\frac{1}{3}}$$
     Partant de $1$ €, le joueur a deux chances sur trois d'être ruiné avant d'avoir atteint $3$ €.

    **3.** La calculatrice donne $P^{20}\approx\begin{pmatrix} 1 & 0 & 0 & 0 \\ 0{,}667 & 0 & 0 & 0{,}333 \\ 0{,}333 & 0 & 0 & 0{,}667 \\ 0 & 0 & 0 & 1 \end{pmatrix}$, à $10^{-3}$ près. La deuxième ligne donne la loi de $X_{20}$ en partant de $1$ : la chaîne est presque sûrement absorbée, en $0$ avec probabilité proche de $\frac{2}{3}=r_{1}$, en $3$ avec probabilité proche de $\frac{1}{3}$. Les deux méthodes concordent.

    **4.** $\begin{pmatrix} p & 0 & 0 & 1-p \end{pmatrix}P=\begin{pmatrix} p & 0 & 0 & 1-p \end{pmatrix}$, puisque les lignes $1$ et $4$ de $P$ sont celles de l'identité. Il y a donc **une infinité de distributions invariantes**. Ce n'est pas contradictoire avec la Proposition 3 : son hypothèse n'est pas vérifiée, car $P$ a des coefficients nuls hors de la diagonale. Une proposition qui donne une condition suffisante ne dit rien quand la condition n'est pas remplie.
