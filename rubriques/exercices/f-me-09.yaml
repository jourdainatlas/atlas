  page_enonce: 4
  page_corrige: 11
  enonce: |
    On considère une chaîne de Markov à deux états $A$ et $B$, de matrice de transition $P=\begin{pmatrix} 0{,}9 & 0{,}1 \\ 0{,}3 & 0{,}7 \end{pmatrix}$, et l'on note $\pi_{n}=\begin{pmatrix} x_{n} & 1-x_{n} \end{pmatrix}$ ses distributions. Initialement, la chaîne est dans l'état $B$.

    **1.** Représenter le graphe de la chaîne, puis déterminer sa distribution invariante $\pi$.

    **2.** Montrer que, pour tout $n\in\mathbb{N}$, $x_{n+1}=0{,}6\,x_{n}+0{,}3$.

    **3.** On pose $u_{n}=x_{n}-\dfrac{3}{4}$. Montrer que $(u_{n})$ est géométrique, puis exprimer $x_{n}$ en fonction de $n$.

    **4.** Déterminer la limite de $(\pi_{n})$, puis le plus petit entier $n$ à partir duquel $\left|x_{n}-\dfrac{3}{4}\right|<0{,}01$.
  corrige: |
    **1.**

    ![Figure](documents/figures/0e47ebfc1e6a0dd0.svg)

    On cherche $\pi=\begin{pmatrix} x & 1-x \end{pmatrix}$ avec $\pi P=\pi$ : $0{,}9x+0{,}3(1-x)=x$, soit $0{,}4x=0{,}3$ et $x=\frac{3}{4}$. $\boxed{\pi=\begin{pmatrix} \frac{3}{4} & \frac{1}{4} \end{pmatrix}}$. C'est la formule $\left(\frac{q}{p+q},\frac{p}{p+q}\right)$ du cours, avec $p=0{,}1$ et $q=0{,}3$.

    **2.** $\pi_{n+1}=\pi_{n}P$ donne, pour la première coordonnée : $x_{n+1}=0{,}9x_{n}+0{,}3(1-x_{n})=\boxed{0{,}6\,x_{n}+0{,}3}$.

    **3.** $u_{n+1}=0{,}6x_{n}+0{,}3-0{,}75=0{,}6x_{n}-0{,}45=0{,}6\left(x_{n}-0{,}75\right)=0{,}6\,u_{n}$ : $(u_{n})$ est géométrique de raison $0{,}6$. Comme la chaîne part de $B$, $x_{0}=0$ et $u_{0}=-\frac{3}{4}$, donc : 
    $$\boxed{x_{n}=\frac{3}{4}-\frac{3}{4}\times 0{,}6^{n}}$$

    **4.** Comme $0<0{,}6<1$, $0{,}6^{n}\to 0$, donc $x_{n}\to\frac{3}{4}$ et $\boxed{\pi_{n}\to\begin{pmatrix} \frac{3}{4} & \frac{1}{4} \end{pmatrix}=\pi}$, conformément à la Proposition 4.

    On cherche $\frac{3}{4}\times 0{,}6^{n}<0{,}01$. La suite $(0{,}6^{n})$ est décroissante, et $\frac{3}{4}\times 0{,}6^{8}\approx 0{,}0126$, tandis que $\frac{3}{4}\times 0{,}6^{9}\approx 0{,}0076$. $\boxed{n=9}$. Au bout de neuf étapes, la distribution est donc à moins d'un centième de la distribution invariante.
- id: "me-09-15"
  feuille: "f-me-09"
  numero: 15
  partie: "Distribution invariante"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [matrice de transition, chaînes de Markov, distributions, distribution invariante, puissances de matrices]
  noeuds: [v-matrices, p-variables, p-espace]
  notions: [espace-matrices, variable-aleatoire]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Une chaîne de Markov a pour matrice de transition $P=\begin{pmatrix} 0{,}5 & 0{,}3 & 0{,}2 \\ 0{,}2 & 0{,}6 & 0{,}2 \\ 0{,}1 & 0{,}3 & 0{,}6 \end{pmatrix}$.

    **1.** Justifier que cette chaîne admet une unique distribution invariante $\pi=\begin{pmatrix} a & b & c \end{pmatrix}$.

    **2.** Montrer que $a$, $b$ et $c$ sont solutions d'un système de trois équations, et le résoudre.

    **3.** À l'aide de la calculatrice, calculer $P^{20}$. Que constate-t-on ? Interpréter.
  corrige: |
    **1.** Aucun coefficient de $P$ hors de la diagonale n'est nul : d'après la Proposition 3, la chaîne admet une unique distribution invariante.

    **2.** $\pi P=\pi$ s'écrit, colonne par colonne, et en ajoutant la condition $a+b+c=1$ : 
    $$\left\{\begin{array}{l} 0{,}5a+0{,}2b+0{,}1c=a \\ 0{,}3a+0{,}6b+0{,}3c=b \\ 0{,}2a+0{,}2b+0{,}6c=c \\ a+b+c=1 \end{array}\right.$$
     La deuxième équation donne $0{,}3(a+c)=0{,}4b$, et avec $a+c=1-b$ : $0{,}3-0{,}3b=0{,}4b$, soit $b=\frac{3}{7}$. La troisième donne $0{,}2(a+b)=0{,}4c$, soit $a+b=2c$, et avec $a+b=1-c$ : $c=\frac{1}{3}$. Enfin $a=1-\frac{3}{7}-\frac{1}{3}=\frac{5}{21}$. La première équation est alors vérifiée : $0{,}5\times\frac{5}{21}+0{,}2\times\frac{9}{21}+0{,}1\times\frac{7}{21}=\frac{2{,}5+1{,}8+0{,}7}{21}=\frac{5}{21}=a$. 
    $$\boxed{\pi=\begin{pmatrix} \frac{5}{21} & \frac{3}{7} & \frac{1}{3} \end{pmatrix}\approx\begin{pmatrix} 0{,}238 & 0{,}429 & 0{,}333 \end{pmatrix}}$$
     **L'erreur la plus répandue** est d'oublier la condition $a+b+c=1$ : le système $\pi P=\pi$ seul a une infinité de solutions, toutes proportionnelles.

    **3.** La calculatrice donne $P^{20}\approx\begin{pmatrix} 0{,}238 & 0{,}429 & 0{,}333 \\ 0{,}238 & 0{,}429 & 0{,}333 \\ 0{,}238 & 0{,}429 & 0{,}333 \end{pmatrix}$ : **les trois lignes sont presque égales à $\pi$**. Quel que soit l'état de départ, la loi de $X_{20}$ est très proche de $\pi$ : la chaîne a « oublié » son point de départ. C'est ce qu'exprime $\pi_{20}=\pi_{0}P^{20}\approx\pi$ pour toute distribution initiale $\pi_{0}$.
- id: "me-09-16"
  feuille: "f-me-09"
  numero: 16
  partie: "Problèmes de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, probabilités conditionnelles, puissances de matrices, suites]
  noeuds: [v-matrices, p-variables, p-espace, n-recurrence]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Dans un village imaginaire isolé, une nouvelle maladie contagieuse mais non mortelle a fait son apparition. Les scientifiques ont découvert qu’un individu pouvait être dans l’un des trois états suivants :

    • $S$ : « l’individu est sain, c’est-à-dire non malade et non infecté »,

    • $I$ : « l’individu est porteur sain, c’est-à-dire non malade mais infecté »,

    • $M$ : « l’individu est malade et infecté ».

    **Partie A** Les scientifiques estiment qu’un seul individu est à l’origine de la maladie sur les $100$ personnes que compte la population et que, d’une semaine à la suivante, un individu change d’état suivant le processus suivant :

    • parmi les individus sains $S$, $\dfrac{1}{3}$ deviennent $I$ et $\dfrac{1}{3}$ deviennent $M$,

    • parmi les individus porteurs sains, $\dfrac{1}{2}$ deviennent $M$.

    • Ceux qui sont malades le restent.

    On note $P_{n} = \begin{pmatrix} s_n & i_n & m_n \end{pmatrix}$ la matrice ligne donnant l’état probabiliste au bout de $n$ semaines des états $S$, $I$ et $M$. On a alors $P_0 = \begin{pmatrix} 0{,}99 &0& 0{,}01\end{pmatrix}$.

    **1.** Justifier que l’état probabiliste $P_{n}$ obéit à une chaîne de Markov.

    **2.** Représenter le graphe de cette chaîne de Markov associée aux états $S$, $I$, $M$.

    **3.** Déterminer la matrice de transition $A$.

    **4.** Exprimer $P_n$ en fonction de $P_0$ et $A$.

    **5.** Déterminer l’état probabiliste au bout de quatre semaines (arrondir à $10^{-2}$). Quelle est la probabilité qu’un individu soit sain au bout de quatre semaines ?

    **Partie B** La maladie n’évolue en réalité pas selon le modèle précédent puisqu’au bout de 4 semaines de recherche, les scientifiques découvrent un vaccin qui permet d’enrayer l’endémie et traitent immédiatement l’ensemble de la population. L’évolution hebdomadaire de la maladie après vaccination est donnée par la matrice de transition :

    $$B=\begin{pmatrix} \dfrac{5}{12} & \dfrac{1}{4} & \dfrac{1}{3} \\ \dfrac{5}{12} & \dfrac{1}{4} & \dfrac{1}{3} \\ \dfrac{1}{6} & \dfrac{1}{2} & \dfrac{1}{3} \end{pmatrix}$$

    On note $Q_n$ la matrice ligne donnant l’état probabiliste au bout de $n$ semaines après la mise en place de ces nouvelles mesures de vaccination. Ainsi $Q_n = \begin{pmatrix} S_n & I_n & M_n \end{pmatrix}$ donne les états $S$, $I$, $M$ la $n$-ième semaine après la vaccination. Sachant que $Q_{0}=P_{4}$ :

    **1.** Exprimer $Q_n$ en fonction de $Q_0$ et $B$.

    **2.** **(a)** Déterminer $k\in\mathbb{R}$ tel que $B^{2} = kJ$ où $J$ est la matrice carrée d’ordre $3$ dont tous les coefficients sont égaux à $1$.

    On pourra, pour calculer la valeur exacte de $B^{2}$, calculer d’abord $(12B)^{2}$.

    **(b)** Montrer par récurrence que : $\forall n \geqslant 2$, $B^{n} = B^{2}$.

    **(c)** En déduire $Q_n$ pour tout $n \geqslant 2$.

    **(d)** Interpréter ce résultat en termes d’évolution de la maladie. Peut-on espérer éradiquer la maladie grâce au vaccin ?
  corrige: |
    **Partie A**

    **1.** L'état d'un individu la semaine $n+1$ ne dépend que de son état la semaine $n$, et les proportions de passage sont les mêmes chaque semaine. 
    $$\boxed{(P_{n}) \text{ obéit à une chaîne de Markov homogène}}$$

    **2.** Depuis $S$ : $\dfrac{1}{3}$ vers $I$, $\dfrac{1}{3}$ vers $M$, donc $\dfrac{1}{3}$ restent en $S$. Depuis $I$ : $\dfrac{1}{2}$ vers $M$, donc $\dfrac{1}{2}$ restent en $I$. Depuis $M$ : on reste en $M$.

    ![Figure](documents/figures/4823cd6c92dc3553.svg)

    **3.** 
    $$\boxed{A=\begin{pmatrix} \dfrac{1}{3} & \dfrac{1}{3} & \dfrac{1}{3} \\[3mm] 0 & \dfrac{1}{2} & \dfrac{1}{2} \\[3mm] 0 & 0 & 1 \end{pmatrix}}$$
     La matrice est triangulaire supérieure : on ne peut jamais revenir en arrière.

    **4.** 
    $$\boxed{P_{n}=P_{0}\,A^{n}}$$

    **5.** La calculatrice donne : 
    $$P_{4}=P_{0}A^{4}=\begin{pmatrix} \dfrac{11}{900} & \dfrac{143}{1440} & \dfrac{6397}{7200} \end{pmatrix}\approx \begin{pmatrix} 0{,}01 & 0{,}10 & 0{,}89 \end{pmatrix}$$

    $$\boxed{P(\text{être sain au bout de quatre semaines})\approx 0{,}01}$$
     En quatre semaines, la quasi-totalité de la population est donc contaminée, et près de $89\ \%$ est déjà malade.

    **Partie B**

    **1.** 
    $$\boxed{Q_{n}=Q_{0}\,B^{n}} \qquad \text{avec} \qquad Q_{0}=P_{4}$$

    **2.** **(a)** On calcule d'abord $12B$, dont tous les coefficients sont entiers : 
    $$12B=\begin{pmatrix} 5 & 3 & 4 \\ 5 & 3 & 4 \\ 2 & 6 & 4 \end{pmatrix}$$
     On élève au carré. La première ligne du produit vaut, colonne par colonne : 
    $$5\times 5+3\times 5+4\times 2=48 \quad ; \quad 5\times 3+3\times 3+4\times 6=48 \quad ; \quad 5\times 4+3\times 4+4\times 4=48$$
     La deuxième ligne est identique à la première. Pour la troisième : 
    $$2\times 5+6\times 5+4\times 2=48 \quad ; \quad 2\times 3+6\times 3+4\times 6=48 \quad ; \quad 2\times 4+6\times 4+4\times 4=48$$

    $$(12B)^{2}=48\,J \qquad \text{c'est-à-dire} \qquad 144\,B^{2}=48\,J$$

    $$\boxed{B^{2}=\frac{1}{3}\,J, \text{ donc } k=\frac{1}{3}}$$

    **(b)** Démontrons par récurrence la propriété $\mathcal{P}(n)$ : « $B^{n}=B^{2}$ », pour $n\geqslant 2$.

    **Initialisation :** Pour $n=2$, l'égalité est immédiate.

    **Hérédité :** Supposons $B^{n}=B^{2}$ pour un entier $n\geqslant 2$. Alors : 
    $$B^{n+1}=B^{n}\times B=B^{2}\times B=\frac{1}{3}\,J\,B$$
     Or le produit $J\,B$ a pour coefficients les sommes des colonnes de $B$, chacune répétée sur les trois lignes : 
    $$\frac{5}{12}+\frac{5}{12}+\frac{1}{6}=1 \quad ; \quad \frac{1}{4}+\frac{1}{4}+\frac{1}{2}=1 \quad ; \quad \frac{1}{3}+\frac{1}{3}+\frac{1}{3}=1$$
     donc $J\,B=J$, et $B^{n+1}=\dfrac{1}{3}J=B^{2}$ : la propriété est héréditaire.

    **Conclusion :** 
    $$\boxed{\forall n\geqslant 2, \; B^{n}=B^{2}=\frac{1}{3}\,J}$$

    **(c)** Pour $n\geqslant 2$ : 
    $$Q_{n}=Q_{0}B^{n}=Q_{0}\times\frac{1}{3}J$$
     Or $Q_{0}$ est une matrice ligne dont la somme des coefficients vaut $1$ : le produit $Q_{0}J$ vaut donc $\begin{pmatrix} 1 & 1 & 1 \end{pmatrix}$. 
    $$\boxed{\forall n\geqslant 2, \; Q_{n}=\begin{pmatrix} \dfrac{1}{3} & \dfrac{1}{3} & \dfrac{1}{3} \end{pmatrix}}$$

    **(d)** Dès la deuxième semaine après la vaccination, et quelle que soit la situation de départ, la population se répartit en trois tiers égaux. 
    $$\boxed{\text{L'état se stabilise immédiatement en } \left(\frac{1}{3},\frac{1}{3}, \frac{1}{3}\right)}$$

    $$\boxed{\text{Non, on ne peut pas espérer éradiquer la maladie}}$$
     La proportion de malades se stabilise en effet à $\dfrac{1}{3}$, et ne tend pas vers $0$. Le vaccin a enrayé l'épidémie — la proportion de malades chute de $89\ \%$ à $33\ \%$ — mais il ne l'élimine pas : la maladie devient *endémique*.
