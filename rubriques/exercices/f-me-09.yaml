  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit la matrice : 
    $$A=\begin{pmatrix} 0{,}2 & 0{,}3 & 0{,}5 \\ 0{,}4 & 0{,}2 & 0{,}4 \\ 0{,}1 & 0{,}7 & 0{,}2 \end{pmatrix}$$

    **1.** Pourquoi la matrice $A$ est-elle stochastique ?

    **2.** On admet que la matrice $A$ est la matrice de transition d’une chaîne de Markov homogène liée aux états $\{1, 2, 3\}$.

    **(a)** Que signifie le terme « homogène » pour une chaîne de Markov ?

    **(b)** Représenter le graphe associé à cette chaîne de Markov.

    **(c)** Donner les probabilités suivantes : 
    $$P_{(X_{n}=1)}(X_{n+1} = 3)\qquad ,\qquad P_{(X_{n}=3)}(X_{n+1} = 1)\qquad ,\qquad P_{(X_{n}=2)}(X_{n+1} = 2)$$
  corrige: |
    **1.** Tous les coefficients de $A$ appartiennent à $[0\,;1]$, et la somme de chaque ligne vaut $1$ : 
    $$0{,}2+0{,}3+0{,}5=1 \qquad ; \qquad 0{,}4+0{,}2+0{,}4=1 \qquad ; \qquad 0{,}1+0{,}7+0{,}2=1$$

    $$\boxed{A \text{ est une matrice stochastique}}$$

    **2.** **(a)** 
    $$\boxed{\begin{array}{l} \text{Une chaîne est \emph{homogène} lorsque les probabilités de transition ne dépendent pas} \\[1mm] \text{de l'instant } n : \text{ la matrice } A \text{ est la même à chaque étape.} \end{array}}$$

    **(b)**

    ![Figure](documents/figures/5447855a8118ec83.svg)

    **(c)** Chaque probabilité demandée se lit directement comme un coefficient de $A$ : 
    $$\boxed{P_{(X_{n}=1)}\left(X_{n+1}=3\right)=a_{13}=0{,}5}$$

    $$\boxed{P_{(X_{n}=3)}\left(X_{n+1}=1\right)=a_{31}=0{,}1}$$

    $$\boxed{P_{(X_{n}=2)}\left(X_{n+1}=2\right)=a_{22}=0{,}2}$$
     *L'ordre des indices est essentiel : le premier désigne l'état de départ, le second l'état d'arrivée.*
