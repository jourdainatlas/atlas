    ![Figure](documents/figures/a34201cb838b422d.svg)

    *L'état $A$ ne peut être quitté que vers $B$, et $C$ de même : la chaîne oscille autour de $B$.*

    **2.**

    ![Figure](documents/figures/5d74fd7da3ae3298.svg)

    *Il n'y a aucune arête entre $A$ et $C$ : les coefficients $t_{13}$ et $t_{31}$ sont nuls.*

    **3.**

    ![Figure](documents/figures/fc5d924f01974813.svg)

