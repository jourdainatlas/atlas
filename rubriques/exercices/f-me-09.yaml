    Un robot aspirateur passe d'une pièce à l'autre d'un appartement de trois pièces : le salon $S$, la cuisine $C$ et la chambre $H$. Toutes les dix minutes, il change de pièce ou reste sur place selon la matrice de transition, dans l'ordre $S$, $C$, $H$ : 
    $$P=\begin{pmatrix} 0{,}5 & 0{,}3 & 0{,}2 \\ 0{,}4 & 0{,}6 & 0 \\ 0{,}5 & 0 & 0{,}5 \end{pmatrix}$$
     Le robot part du salon.

    **1.** Construire l'arbre pondéré décrivant ses deux premiers déplacements.

    **2.** En déduire la probabilité qu'il soit dans la chambre au bout de vingt minutes.

    **3.** Calculer $P^{2}$ et retrouver ce résultat à l'aide de la relation de Chapman-Kolmogorov.

    **4.** S'il part de la chambre, quelle est la probabilité qu'il soit dans la cuisine au bout de vingt minutes ? Retrouver ce résultat en énumérant les trajets possibles.
  corrige: |
    **1.** Les branches de probabilité nulle ($C\to H$ et $H\to C$) sont omises.

    ![Figure](documents/figures/e0fa98db6888cd23.svg)

    Les deux chemins menant en $H$ au bout de deux déplacements sont signalés en bleu pétrole.

    **2.** Par la formule des probabilités totales, en suivant les deux chemins bleu pétrole : 
    $$P(X_{2}=H)=0{,}5\times 0{,}2+0{,}2\times 0{,}5=\boxed{0{,}2}$$

    **3.** 
    $$P^{2}=\begin{pmatrix} 0{,}47 & 0{,}33 & 0{,}2 \\ 0{,}44 & 0{,}48 & 0{,}08 \\ 0{,}5 & 0{,}15 & 0{,}35 \end{pmatrix}$$
     Le robot part du salon, état numéro $1$. La probabilité cherchée est le coefficient de $P^{2}$ en ligne $1$ et colonne $3$ : on retrouve $0{,}2$. Le calcul de ce coefficient, $0{,}5\times 0{,}2+0{,}3\times 0+0{,}2\times 0{,}5$, est exactement celui de l'arbre : **un coefficient de $P^{2}$ résume un arbre à deux niveaux**.

    **4.** On lit le coefficient en ligne $3$ et colonne $2$ de $P^{2}$ : $\boxed{0{,}15}$. Le seul trajet possible est $H\to S\to C$, de probabilité $0{,}5\times 0{,}3=0{,}15$, puisque le robot ne passe jamais directement de la chambre à la cuisine.
- id: "me-09-11"
  feuille: "f-me-09"
  numero: 11
  partie: "Calcul de distributions"
  etoiles: 1
  types: [Modélisation]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, probabilités conditionnelles, dés et pièces]
  noeuds: [v-matrices, p-variables, p-espace]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Un garagiste contrôle tous les mois l’état d’une pièce de moteur. Elle peut se trouver dans les états suivants : fonctionnelle (F), usée (U) ou défaillante (D). On considère que la situation peut se modéliser avec une chaîne de Markov dont la matrice de transition est donnée dans l’ordre F, U, D par : 
    $$T=\begin{pmatrix} 0{,}9 &0{,}1& 0\\0 &0{,}6& 0{,}4\\0 &0& 1\end{pmatrix}$$

    **1.** Expliquer les coefficients de la dernière ligne de la matrice $T$.

    **2.** Dresser le graphe correspondant à cette chaîne.

    **3.** Au début des contrôles, la pièce vient d’être changée pour une pièce neuve. Quelle est la probabilité pour qu’au bout de 6 mois, la pièce soit défaillante ?
  corrige: |
    **1.** La dernière ligne est $\begin{pmatrix} 0 & 0 & 1 \end{pmatrix}$ : depuis l'état $D$, on reste en $D$ avec probabilité $1$. 
    $$\boxed{\text{Une pièce défaillante le reste : l'état } D \text{ est \emph{absorbant}}}$$
     C'est cohérent avec l'énoncé : le garagiste constate l'état de la pièce mais ne la remplace pas.

    **2.**

    ![Figure](documents/figures/27317b7dd58a99bc.svg)

    *Le graphe est « à sens unique » : on ne peut que se dégrader, jamais s'améliorer.*

    **3.** La pièce étant neuve au départ, $\pi_{0}=\begin{pmatrix} 1 & 0 & 0 \end{pmatrix}$, et $\pi_{6}=\pi_{0}T^{6}$ est la première ligne de $T^{6}$.

    On peut aussi raisonner directement. Pour être encore fonctionnelle au bout de $6$ mois, la pièce doit ne jamais s'être usée : 
    $$P(X_{6}=F)=0{,}9^{6}\approx 0{,}531$$
     Pour être usée sans être défaillante, il faut choisir le mois où elle s'est usée. Enfin : 
    $$P(X_{6}=D)=1-P(X_{6}=F)-P(X_{6}=U)$$
     La calculatrice donne, en calculant $T^{6}$ : 
    $$\pi_{6}\approx\begin{pmatrix} 0{,}531 & 0{,}162 & 0{,}307 \end{pmatrix}$$

    $$\boxed{P(X_{6}=D)\approx 0{,}307}$$
     Il y a donc environ $31\ \%$ de risque que la pièce soit défaillante au bout de six mois.
- id: "me-09-12"
  feuille: "f-me-09"
  numero: 12
  partie: "Distribution invariante"
  etoiles: 2
  types: [Démonstration, Modélisation]
  mots_cles: [graphes probabilistes, chaînes de Markov, probabilités conditionnelles, distributions, distribution invariante, suites]
  noeuds: [p-variables, p-espace, n-recurrence]
  notions: [variable-aleatoire, espace-probabilise]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Dans une ville il peut venter, neiger ou grêler. Le vent et la grêle ne restent jamais deux jours de suite. S’il vente un jour donné, le lendemain il neige ou il grêle de manière équiprobable. S’il neige, il y a une chance sur trois qu’il vente le jour d’après et une chance sur deux qu’il continue à neiger le lendemain. Après un jour de grêle, il y a deux fois plus de chance d’avoir de la neige que du vent.

    **1.** Justifier la modélisation de la météo dans cette ville par une chaîne de Markov.

    **2.** Représenter le graphe puis donner la matrice $T$ de transition de cette chaîne de Markov associée aux états $V$, $N$ et $G$.

    **3.** Quelle est la probabilité, qu’après deux jours de neige, le vent souffle ?

    **4.** Quelle est la distribution invariante de cette chaîne de Markov ?
  corrige: |
    **1.** Le temps du lendemain ne dépend que du temps du jour, et les règles énoncées sont les mêmes chaque jour. 
    $$\boxed{\text{C'est une chaîne de Markov homogène, d'états } V, \; N, \; G}$$

    **2.** On traduit chaque phrase :

    • « le vent et la grêle ne restent jamais deux jours de suite » : $P(V\to V)=0$ et $P(G\to G)=0$ ;

    • après du vent, neige ou grêle de façon équiprobable : $P(V\to N)=P(V\to G)=\dfrac{1}{2}$ ;

    • après la neige : $P(N\to V)=\dfrac{1}{3}$ et $P(N\to N)=\dfrac{1}{2}$, d'où $P(N\to G)=1-\dfrac{1}{3}-\dfrac{1}{2}=\dfrac{1}{6}$ ;

    • après la grêle : $P(G\to N)=2\,P(G\to V)$ et $P(G\to G)=0$, donc $3\,P(G\to V)=1$, soit $P(G\to V)=\dfrac{1}{3}$ et $P(G\to N)=\dfrac{2}{3}$.

    ![Figure](documents/figures/efb6c0251f95c296.svg)

    $$\boxed{T=\begin{pmatrix} 0 & \dfrac{1}{2} & \dfrac{1}{2} \\[3mm] \dfrac{1}{3} & \dfrac{1}{2} & \dfrac{1}{6} \\[3mm] \dfrac{1}{3} & \dfrac{2}{3} & 0 \end{pmatrix}}$$

    **3.** Il s'agit de la probabilité de passer de $N$ à $V$ *en deux étapes*, c'est-à-dire du coefficient d'indice $(N,V)$ de $T^{2}$. La formule des probabilités totales donne : 
    $$\begin{aligned} P(N\to\ \cdot\ \to V) &= P(N\to V)P(V\to V)+P(N\to N)P(N\to V)+P(N\to G)P(G\to V) \\ &= \frac{1}{3}\times 0+\frac{1}{2}\times\frac{1}{3}+\frac{1}{6}\times\frac{1}{3} \\ &= \frac{1}{6}+\frac{1}{18}=\frac{3}{18}+\frac{1}{18}=\boxed{\frac{2}{9}} \end{aligned}$$

    **4.** On cherche $\pi=\begin{pmatrix} v & n & g \end{pmatrix}$ vérifiant $\pi T=\pi$ et $v+n+g=1$. Le système $\pi T=\pi$ s'écrit : 
    $$\left\{\begin{array}{l} \dfrac{1}{3}n+\dfrac{1}{3}g=v \\[2mm] \dfrac{1}{2}v+\dfrac{1}{2}n+\dfrac{2}{3}g=n \\[2mm] \dfrac{1}{2}v+\dfrac{1}{6}n=g \end{array}\right.$$
     La première équation donne $n+g=3v$, et comme $v+n+g=1$ il vient $v+3v=1$, soit $v=\dfrac{1}{4}$. La troisième donne alors $g=\dfrac{1}{8}+\dfrac{1}{6}n$, que l'on reporte dans $n+g=\dfrac{3}{4}$ : 
    $$n+\frac{1}{8}+\frac{1}{6}n=\frac{3}{4} \iff \frac{7}{6}n=\frac{5}{8} \iff n=\frac{15}{28}$$
     puis $g=\dfrac{3}{4}-\dfrac{15}{28}=\dfrac{21-15}{28}=\dfrac{6}{28}=\dfrac{3}{14}$. 
    $$\boxed{\pi=\begin{pmatrix} \dfrac{1}{4} & \dfrac{15}{28} & \dfrac{3}{14} \end{pmatrix}\approx\begin{pmatrix} 0{,}250 & 0{,}536 & 0{,}214 \end{pmatrix}}$$
     Vérification : $\dfrac{1}{4}+\dfrac{15}{28}+\dfrac{3}{14}=\dfrac{7+15+6}{28}=1$.

    À long terme, il neige donc un peu plus d'un jour sur deux dans cette ville.
- id: "me-09-13"
  feuille: "f-me-09"
  numero: 13
  partie: "Distribution invariante"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, probabilités conditionnelles, distributions, distribution invariante, suites]
  noeuds: [v-matrices, p-variables, p-espace, n-recurrence]
  notions: [espace-matrices, variable-aleatoire, espace-probabilise]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Un simulateur de jeux est programmé pour le niveau difficile de la façon suivante :

    • La personne a $15$% de chance de réussite au premier jeu, puis;

    • si la personne a gagné, elle a une chance sur quatre de gagner le jeu suivant;

    • si la personne a perdu, elle a deux chances sur cinq de gagner le jeu suivant.

    Soit $X_{n}$ la variable aléatoire correspondant à la réussite du joueur au $n$-ième jeu.

    **1.** **(a)** Justifier que la suite de variables aléatoires $(X_{n})$ est une chaîne de Markov dont on précisera l’espace des états.

    **(b)** Représenter le graphe puis donner la matrice de transition $P$ de cette chaîne.

    **2.** **(a)** Donner la distribution initiale $\pi_{0}$ de cette chaîne puis exprimer la distribution $\pi_{n}$ au $n$-ième jeu en fonction de $\pi_{0}$ et de $P$.

    **(b)** En déduire la probabilité qu’un joueur gagne le cinquième jeu.

    **(c)** Déterminer la distribution invariante $\pi$ de cette chaîne.

    **(d)** Comment programmer les chances de réussite initiales afin qu’un joueur ait les mêmes chances quel que soit le nombre de parties qu’il fait ?
  corrige: |
    **1.** **(a)** L'issue du jeu $n+1$ ne dépend que du résultat du jeu $n$ — gagné ou perdu — et non de l'historique complet. Les probabilités énoncées ne dépendent pas du numéro du jeu. 
    $$\boxed{(X_{n}) \text{ est une chaîne de Markov homogène d'espace des états } \{G\,;P\}}$$
     où $G$ signifie « le joueur gagne » et $P$ « le joueur perd ».

    **(b)** Si le joueur a gagné, il gagne le suivant avec probabilité $\dfrac{1}{4}$, donc il perd avec probabilité $\dfrac{3}{4}$. S'il a perdu, il gagne le suivant avec probabilité $\dfrac{2}{5}$, donc il perd avec probabilité $\dfrac{3}{5}$.

    ![Figure](documents/figures/a344ef8f21b530f3.svg)

    $$\boxed{P=\begin{pmatrix} \dfrac{1}{4} & \dfrac{3}{4} \\[3mm] \dfrac{2}{5} & \dfrac{3}{5} \end{pmatrix}}$$

    **2.** **(a)** Le premier jeu est réussi avec probabilité $0{,}15$ : 
    $$\boxed{\pi_{0}=\begin{pmatrix} 0{,}15 & 0{,}85 \end{pmatrix}}$$
     Chaque passage d'un jeu au suivant se traduit par une multiplication à droite par $P$ : 
    $$\boxed{\pi_{n}=\pi_{0}\,P^{n}}$$

    **(b)** Avec la convention précédente, $\pi_{0}$ décrit le *premier* jeu : le cinquième jeu correspond donc à $\pi_{4}$. 
    $$\pi_{4}=\pi_{0}\,P^{4}\approx\begin{pmatrix} 0{,}3477 & 0{,}6523 \end{pmatrix}$$

    $$\boxed{P(\text{gagner le cinquième jeu})\approx 0{,}348}$$

    **(c)** On cherche $\pi=\begin{pmatrix} g & p \end{pmatrix}$ tel que $\pi P=\pi$ et $g+p=1$. La première équation s'écrit : 
    $$\frac{1}{4}g+\frac{2}{5}p=g \iff \frac{2}{5}p=\frac{3}{4}g \iff p=\frac{15}{8}g$$
     En reportant dans $g+p=1$ : 
    $$g\left(1+\frac{15}{8}\right)=1 \iff \frac{23}{8}g=1 \iff g=\frac{8}{23}$$

    $$\boxed{\pi=\begin{pmatrix} \dfrac{8}{23} & \dfrac{15}{23} \end{pmatrix} \approx\begin{pmatrix} 0{,}348 & 0{,}652 \end{pmatrix}}$$
     On remarque que $\pi_{4}$ est déjà très proche de $\pi$ : la convergence est rapide.

    **(d)** Pour que les chances soient les mêmes quel que soit le nombre de parties, il faut que la distribution ne change plus d'un jeu au suivant, c'est-à-dire que $\pi_{0}$ soit déjà la distribution invariante. 
    $$\boxed{\text{Il faut programmer une probabilité de réussite initiale de } \frac{8}{23}\approx 34{,}8\ \%}$$
- id: "me-09-14"
  feuille: "f-me-09"
  numero: 14
  titre: "Vitesse de convergence"
  partie: "Distribution invariante"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [graphes probabilistes, matrice de transition, chaînes de Markov, distributions, distribution invariante, convergence, suites]
  noeuds: [v-matrices, p-variables, p-espace, n-recurrence]
