  enonce: |
    Soit $U = \{(u, v, w) \in \mathbb{R}^{3} ; u, v, w > 0,\ uv < 1,\ uw < 1,\ vw < 1\}$. Montrer que $U$ est un borélien, et calculer $I = \int_{U}uvw\,\mathrm{d} u\,\mathrm{d} v\,\mathrm{d} w$, en utilisant, après l'avoir justifié, le changement de variables $(x, y, z) = (\sqrt{vw}, \sqrt{wu}, \sqrt{uv})$.
  corrige: |
    $U$ est ouvert, donc borélien. Si $(u, v, w) \in U$, $x = \sqrt{vw}$, $y = \sqrt{wu}$ et $z = \sqrt{uv}$ sont dans $]0, 1[$ ; inversement, pour $(x, y, z) \in ]0, 1[^{3}$, $\Psi(x, y, z) = \big(\frac{yz}{x}, \frac{xz}{y}, \frac{xy}{z}\big)$ est dans $U$, puisque, par exemple, $uv = z^{2} < 1$. Ainsi $\Phi : U \to ]0, 1[^{3}$ est un $C^{1}$-difféomorphisme de réciproque $\Psi$, et l'on calcule $\det J_{\Psi} = 4$. Comme $uvw = xyz$, 
    $$I = \int_{]0, 1[^{3}}xyz\cdot 4\,\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z = 4\Big(\frac{1}{2}\Big)^{3} = \boxed{\frac{1}{2}}\text{.}$$
