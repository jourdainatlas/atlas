  source: "Lyon 1 (TD06 2020), exercice 10"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $\alpha$, $\beta$, $\gamma > 0$. À quelle condition $J = \int_{(\mathbb{R}_{+}^{*})^{3}}\frac{\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z}{1 + x^{\alpha} + y^{\beta} + z^{\gamma}}$ est-elle finie ? Répondre de deux façons : par le théorème de Tonelli, puis par la formule $(\ast\ast)$.
  corrige: |
    *Par Tonelli.* Avec $z = A^{1/\gamma}t$, $\int_{0}^{+\infty}\frac{\mathrm{d} z}{A + z^{\gamma}} = A^{\frac{1}{\gamma} - 1}\int_{0}^{+\infty}\frac{\mathrm{d} t}{1 + t^{\gamma}}$, finie si et seulement si $\gamma > 1$. On recommence en $y$, puis en $x$ : la condition finale est $\alpha\big(1 - \frac{1}{\beta} - \frac{1}{\gamma}\big) > 1$, qui contient les précédentes.

    *Par $(\ast\ast)$.* Le changement de variables $x = X^{1/\alpha}$, $y = Y^{1/\beta}$, $z = Z^{1/\gamma}$ donne 
    $$J = \frac{1}{\alpha\beta\gamma}\frac{\Gamma(\frac{1}{\alpha})\Gamma(\frac{1}{\beta})\Gamma(\frac{1}{\gamma})}{\Gamma(s)}\int_{0}^{+\infty}\frac{u^{s-1}}{1 + u}\,\mathrm{d} u, \qquad s = \frac{1}{\alpha} + \frac{1}{\beta} + \frac{1}{\gamma},$$
     et la dernière intégrale est finie si et seulement si $0 < s < 1$. Dans les deux cas, 
    $$\boxed{J < +\infty \iff \frac{1}{\alpha} + \frac{1}{\beta} + \frac{1}{\gamma} < 1}\text{.}$$
- id: "l3-in-06-21"
  feuille: "f-l3-in-06"
  numero: 21
  partie: "Intégrales eulériennes et asymptotiques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrales eulériennes]
  noeuds: [cv-changement, cv-gaussienne]
  notions: [jacobien]
  source: "Lyon 1 (TD06 2020), exercice 11"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $B = \{(x, y, z) ; x^{2} + y^{2} + z^{2} < 1\}$ et $a$, $b$, $c > 0$. Calculer $L = \int_{B}|x|^{a-1}|y|^{b-1}|z|^{c-1}\,\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z$ en coordonnées sphériques, puis à l'aide de $(\ast\ast)$. Que retrouve-t-on pour $a = b = c = 1$ ?
  corrige: |
    *En coordonnées sphériques*, l'intégrande est homogène de degré $a + b + c - 3$, et 
    $$L = \int_{0}^{1}r^{a+b+c-1}\,\mathrm{d} r\cdot K = \frac{K}{a + b + c},$$
     où $K$ est une intégrale sur les angles que l'on ne sait pas calculer directement.

    *Par $(\ast\ast)$.* Par symétrie, $L$ vaut $8$ fois l'intégrale sur l'octant positif, où l'on pose $X = x^{2}$, $Y = y^{2}$, $Z = z^{2}$ ; comme $x^{a-1}\,\mathrm{d} x = \frac{1}{2}X^{a/2 - 1}\,\mathrm{d} X$, on obtient $L = I_{a/2, b/2, c/2}$ avec $f = \chi_{]0, 1[}$, d'où 
    $$\boxed{L = \frac{2}{a + b + c}\,\frac{\Gamma(\frac{a}{2})\Gamma(\frac{b}{2})\Gamma(\frac{c}{2})}{\Gamma(\frac{a + b + c}{2})}}\text{,}$$
     ce qui calcule au passage $K$. Pour $a = b = c = 1$, $\Gamma(\frac{1}{2}) = \sqrt{\pi}$ et $\Gamma(\frac{3}{2}) = \frac{\sqrt{\pi}}{2}$ donnent $L = \frac{4\pi}{3}$ : le volume de la boule. Pour $a = b = c = 2$, $L = \frac{1}{6}$, valeur confirmée par une intégration numérique.
- id: "l3-in-06-22"
  feuille: "f-l3-in-06"
  numero: 22
  partie: "Intégrales eulériennes et asymptotiques"
