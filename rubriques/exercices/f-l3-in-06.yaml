  enonce: |
    Pour $\alpha > 0$, soit $J(\alpha) = \int_{(\mathbb{R}_{+}^{*})^{2}}\mathrm{e}^{-(xy^{2} + x/y^{2})}x^{\alpha - 1/2}\,\mathrm{d} x\,\mathrm{d} y$.

    **1.** À l'aide de l'exercice 22, montrer que $J(\alpha) = \frac{\sqrt{\pi}}{2^{\alpha + 1}}\Gamma(\alpha)$.

    **2.** À l'aide du changement de variables $u = xy^{2}$, $v = \frac{x}{y^{2}}$, que l'on justifiera, montrer que $J(\alpha) = \frac{1}{4}\Gamma\big(\frac{\alpha}{2}\big)\Gamma\big(\frac{\alpha + 1}{2}\big)$.

    **3.** En déduire la *formule de duplication* $\Gamma\big(\frac{\alpha}{2}\big)\Gamma\big(\frac{\alpha + 1}{2}\big) = \frac{\sqrt{\pi}}{2^{\alpha - 1}}\Gamma(\alpha)$.
  corrige: |
    **1.** Par Tonelli, en intégrant d'abord en $y$, l'intégrale intérieure est $H_{x}(x) = \frac{1}{2}\sqrt{\frac{\pi}{x}}\mathrm{e}^{-2x}$, et 
    $$J(\alpha) = \frac{\sqrt{\pi}}{2}\int_{0}^{+\infty}x^{\alpha - 1}\mathrm{e}^{-2x}\,\mathrm{d} x = \frac{\sqrt{\pi}}{2}\cdot\frac{\Gamma(\alpha)}{2^{\alpha}}.$$

    **2.** $(x, y) \mapsto (u, v) = (xy^{2}, \frac{x}{y^{2}})$ est un $C^{1}$-difféomorphisme de $(\mathbb{R}_{+}^{*})^{2}$ sur lui-même, de réciproque $x = \sqrt{uv}$, $y = (u/v)^{1/4}$, et de jacobien $-\frac{4x}{y}$. Donc $\mathrm{d} x\,\mathrm{d} y = \frac{y}{4x}\,\mathrm{d} u\,\mathrm{d} v$, et $x^{\alpha - 1/2}\frac{y}{4x} = \frac{1}{4}u^{\frac{\alpha + 1}{2} - 1}v^{\frac{\alpha}{2} - 1}$. Par Fubini, $J(\alpha) = \frac{1}{4}\Gamma\big(\frac{\alpha + 1}{2}\big)\Gamma\big(\frac{\alpha}{2}\big)$.

    **3.** En égalant, $\boxed{\Gamma\big(\frac{\alpha}{2}\big)\Gamma\big(\frac{\alpha + 1}{2}\big) = \frac{\sqrt{\pi}}{2^{\alpha - 1}}\Gamma(\alpha)}$ ; pour $\alpha = 1$, on retrouve $\Gamma(\frac{1}{2}) = \sqrt{\pi}$. Pour $\alpha = 1{,}7$, les deux membres valent $0{,}99139$.
- id: "l3-in-06-24"
  feuille: "f-l3-in-06"
  numero: 24
  partie: "Intégrales eulériennes et asymptotiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [intégrales eulériennes]
  noeuds: [cv-changement, cv-gaussienne]
  notions: [jacobien]
  source: "Féjoz (exosIntegration), exercices 3.5 et 3.6"
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** *Méthode de Laplace.* Soit $f : ]0, 1[ \to \mathbb{R}$ intégrable, ayant une limite $f(1^{-}) \neq 0$ en $1$, et $I_{n} = \int_{0}^{1}x^{n}f(x)\,\mathrm{d} x$.

    (a) Montrer que $I_{n} \to 0$, et que $nI_{n} \to f(1^{-})$ lorsque $f$ est de classe $C^{1}$ sur $[0, 1]$, par une intégration par parties.

    (b) Pourquoi ne peut-on pas en général appliquer le théorème de convergence dominée directement à $nI_{n}$ ?

    (c) Démontrer que $I_{n} \sim \frac{f(1^{-})}{n}$ dans le cas général, en coupant $[0, 1]$ en un voisinage de $1$, où $f$ est bornée et où l'on fera le changement de variable $y = x^{n}$, et son complémentaire.

    **2.** *Formule de Stirling.* (a) Montrer que $n! = \int_{0}^{+\infty}x^{n}\mathrm{e}^{-x}\,\mathrm{d} x = n^{n+1}\int_{0}^{+\infty}(u\mathrm{e}^{-u})^{n}\,\mathrm{d} u$.

    (b) Trouver un équivalent de $\int_{0}^{1}(u\mathrm{e}^{-u})^{n}\,\mathrm{d} u$, puis de $\int_{1}^{+\infty}(u\mathrm{e}^{-u})^{n}\,\mathrm{d} u$, et en déduire que $n! \sim \big(\frac{n}{\mathrm{e}}\big)^{n}\sqrt{2\pi n}$.
  corrige: |
    **1.** (a) $|x^{n}f(x)| \leqslant |f(x)|$ et $x^{n} \to 0$ sur $[0, 1[$ : $I_{n} \to 0$. Si $f$ est de classe $C^{1}$, une intégration par parties donne $nI_{n} = \frac{n}{n + 1}\big(f(1) - \int_{0}^{1}x^{n+1}f'(x)\,\mathrm{d} x\big) \to f(1)$, la dernière intégrale tendant vers $0$ comme $I_{n}$.

    (b) $nx^{n}f(x) \to 0$ sur $[0, 1[$. Une domination intégrable donnerait $nI_{n} \to 0$, ce que (a) contredit dès que $f(1) \neq 0$ : la masse de $nx^{n}$ se concentre en $1$.

    (c) Soit $\alpha \in ]0, 1[$ et $M$ tels que $|f| \leqslant M$ sur $[\alpha, 1[$. Sur $[0, \alpha]$, $|nx^{n}f| \leqslant n\alpha^{n}|f|$, et $n\alpha^{n} \to 0$ : cette partie tend vers $0$. Sur $[\alpha, 1[$, avec $y = x^{n}$, 
    $$\int_{\alpha}^{1}nx^{n}f(x)\,\mathrm{d} x = \int_{\alpha^{n}}^{1}y^{1/n}f(y^{1/n})\,\mathrm{d} y \longrightarrow f(1^{-}),$$
     par convergence dominée par $M$ sur $[0, 1]$, puisque $y^{1/n} \to 1$ pour $y \in ]0, 1]$. Donc $\boxed{I_{n} \sim \frac{f(1^{-})}{n}}$.

    **2.** (a) $\Gamma(n + 1) = n!$, et $x = nu$ donne la seconde égalité.

    (b) La fonction $\varphi(u) = u\mathrm{e}^{-u}$ atteint son maximum $\frac{1}{\mathrm{e}}$ en $1$. Avec $u = 1 + \frac{t}{\sqrt{n}}$, 
    $$\int_{0}^{+\infty}\varphi(u)^{n}\,\mathrm{d} u = \frac{\mathrm{e}^{-n}}{\sqrt{n}}\int_{-\sqrt{n}}^{+\infty}k_{n}(t)\,\mathrm{d} t, \qquad k_{n}(t) = \exp\Big(n\Big(\ln\Big(1 + \frac{t}{\sqrt{n}}\Big) - \frac{t}{\sqrt{n}}\Big)\Big) \longrightarrow \mathrm{e}^{-t^{2}/2}.$$
     Pour la domination, l'étude de $\ln(1 + h) - h + \frac{h^{2}}{2}$ et de $\ln(1 + h) - h + \frac{h^{2}}{2(1 + h)}$ montre que $\ln(1 + h) - h \leqslant -\frac{h^{2}}{2}$ pour $-1 < h \leqslant 0$ et $\leqslant -\frac{h^{2}}{2(1 + h)}$ pour $h \geqslant 0$. Donc $k_{n}(t) \leqslant \mathrm{e}^{-t^{2}/2}$ pour $t \leqslant 0$, et $k_{n}(t) \leqslant \mathrm{e}^{-t^{2}/(2(1 + t))}$ pour $t \geqslant 0$ : ces majorants sont intégrables. Chacune des deux moitiés, $\int_{0}^{1}$ et $\int_{1}^{+\infty}$, est donc équivalente à $\frac{\mathrm{e}^{-n}}{\sqrt{n}}\sqrt{\frac{\pi}{2}}$, et 
    $$n! \sim n^{n+1}\frac{\mathrm{e}^{-n}}{\sqrt{n}}\sqrt{2\pi} = \boxed{\Big(\frac{n}{\mathrm{e}}\Big)^{n}\sqrt{2\pi n}}\text{.}$$

    ![Figure](documents/figures/4d4e2039098d91bf.svg)

    Les fonctions $k_{2}$, $k_{10}$, $k_{100}$ (ocre, de plus en plus épaisses), qui décrivent $(\mathrm{e}\varphi)^{n}$ au voisinage de son maximum, à l'échelle $\frac{1}{\sqrt{n}}$, tendent vers la gaussienne $\mathrm{e}^{-t^{2}/2}$ (tirets carmin). Asymétriques pour $n$ petit, elles se symétrisent : c'est ce qui fait apparaître $\sqrt{2\pi}$ dans la formule de Stirling.

