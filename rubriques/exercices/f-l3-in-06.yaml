  page_corrige: 9
  enonce: |
    Pour $a > 0$ et $x \geqslant 0$, soit $H_{a}(x) = \int_{0}^{+\infty}\mathrm{e}^{-(at^{2} + x/t^{2})}\,\mathrm{d} t$. Montrer que $H_{a}$ est continue sur $[0, +\infty[$, calculer $H_{a}(0)$, montrer que $H_{a}$ est dérivable sur $]0, +\infty[$, et calculer $H_{a}'(x)$ en fonction de $H_{a}(x)$, à l'aide du changement de variable $t = \frac{\alpha}{s}$ pour un $\alpha$ convenable. En déduire que 
    $$H_{a}(x) = \frac{1}{2}\sqrt{\frac{\pi}{a}}\,\mathrm{e}^{-2\sqrt{ax}}.$$
  corrige: |
    L'intégrande est majoré par $\mathrm{e}^{-at^{2}}$ : $H_{a}$ est continue sur $[0, +\infty[$ et $H_{a}(0) = \frac{1}{2}\sqrt{\frac{\pi}{a}}$. Pour $x \geqslant c > 0$, la dérivée $-\frac{1}{t^{2}}\mathrm{e}^{-(at^{2} + x/t^{2})}$ est dominée par $\frac{1}{t^{2}}\mathrm{e}^{-c/t^{2}}\mathrm{e}^{-at^{2}}$, bornée près de $0$ et intégrable. Avec $t = \frac{\alpha}{s}$ et $\alpha = \sqrt{x/a}$, on a $at^{2} = \frac{x}{s^{2}}$ et $\frac{x}{t^{2}} = as^{2}$, d'où 
    $$H_{a}'(x) = -\int_{0}^{+\infty}\frac{\mathrm{e}^{-(at^{2} + x/t^{2})}}{t^{2}}\,\mathrm{d} t = -\frac{1}{\alpha}\int_{0}^{+\infty}\mathrm{e}^{-(as^{2} + x/s^{2})}\,\mathrm{d} s = -\sqrt{\frac{a}{x}}\,H_{a}(x).$$
     Donc $\big(\ln H_{a}\big)' = -\sqrt{a/x}$, $H_{a}(x) = H_{a}(0)\mathrm{e}^{-2\sqrt{ax}}$ par continuité en $0$, ce qui est la formule annoncée. C'est l'exercice 11 de la feuille 5, à un changement d'échelle près.
