  enonce: |
    Soit $f \in \mathcal{L}^{1}(\mathbb{R})$. Montrer que $\int_{\mathbb{R}}f(x)\,\mathrm{d} x = \int_{\mathbb{R}}f\Big(x - \frac{1}{x}\Big)\mathrm{d} x$. On pourra étudier séparément $x > 0$ et $x < 0$.
  corrige: |
    $\varphi(x) = x - \frac{1}{x}$ a pour dérivée $1 + \frac{1}{x^{2}} > 0$ ; elle réalise un $C^{1}$-difféomorphisme de $]0, +\infty[$ sur $\mathbb{R}$, et de même de $]-\infty, 0[$ sur $\mathbb{R}$. Les réciproques sont 
    $$\psi_{\pm}(y) = \frac{y \pm \sqrt{y^{2} + 4}}{2}, \qquad \psi_{+}'(y) + \psi_{-}'(y) = \frac{1}{2}\Big(1 + \frac{y}{\sqrt{y^{2} + 4}}\Big) + \frac{1}{2}\Big(1 - \frac{y}{\sqrt{y^{2} + 4}}\Big) = 1,$$
     les deux dérivées étant positives. Le changement de variables $x = \psi_{\pm}(y)$ sur chaque demi-droite, d'abord pour $|f|$ puis pour $f$, donne 
    $$\int_{\mathbb{R}}f\Big(x - \frac{1}{x}\Big)\mathrm{d} x = \int_{\mathbb{R}}f(y)\psi_{+}'(y)\,\mathrm{d} y + \int_{\mathbb{R}}f(y)\psi_{-}'(y)\,\mathrm{d} y = \boxed{\int_{\mathbb{R}}f(y)\,\mathrm{d} y}\text{.}$$
     Chaque valeur $y$ est atteinte deux fois, mais les deux « densités » $\psi_{\pm}'$ se partagent exactement la masse.
