- id: "l3-in-06-01"
  feuille: "f-l3-in-06"
  numero: 1
  partie: "En dimension 1"
  etoiles: 1
  types: [Calcul]
  mots_cles: [changement de variables en dimension 1]
  noeuds: [cv-changement]
  notions: [diffeomorphisme]
  source: "Lyon 1 (TD06 2020), exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On veut calculer $I = \int_{0}^{\pi}\frac{\mathrm{d} x}{1 + \cos^{2}x}$. Voici une « solution » : on écrit $I = \int_{0}^{\pi}\frac{1 + \tan^{2}x}{2 + \tan^{2}x}\,\mathrm{d} x$, puis, en posant $t = \tan x$, d'où $\mathrm{d} t = (1 + \tan^{2}x)\,\mathrm{d} x$, 
    $$I = \int_{\tan 0}^{\tan\pi}\frac{\mathrm{d} t}{2 + t^{2}} = \int_{0}^{0}\frac{\mathrm{d} t}{2 + t^{2}} = 0.$$
     Pourquoi est-ce manifestement faux ? Où est l'erreur ? Quelle est la valeur de $I$ ?
  corrige: |
    L'intégrande est continu et compris entre $\frac{1}{2}$ et $1$ : $I \in [\frac{\pi}{2}, \pi]$, et $I = 0$ est absurde. L'erreur est que $t = \tan x$ n'est pas un changement de variables sur $]0, \pi[$ : la tangente n'y est ni définie en $\frac{\pi}{2}$, ni continue, ni injective sur l'ensemble de ses valeurs. Sur chacun des intervalles $]0, \frac{\pi}{2}[$ et $]\frac{\pi}{2}, \pi[$, en revanche, $\tan$ est un $C^{1}$-difféomorphisme, sur $]0, +\infty[$ et sur $]-\infty, 0[$ respectivement. Le point $\frac{\pi}{2}$ étant négligeable, 
    $$I = \int_{0}^{+\infty}\frac{\mathrm{d} t}{2 + t^{2}} + \int_{-\infty}^{0}\frac{\mathrm{d} t}{2 + t^{2}} = \boxed{\frac{\pi}{\sqrt{2}} \approx 2{,}221}\text{.}$$

    ![Figure](documents/figures/488b3c3a1ee50234.svg)

    La tangente (ocre) part de $0$, explose en $\frac{\pi}{2}$ (pointillés carmin) et revient à $0$ par les valeurs négatives : elle parcourt deux fois $\mathbb{R}$, en deux morceaux. Écrire $\int_{\tan 0}^{\tan\pi}$ revient à oublier ces deux traversées, alors que l'aire sous $\frac{1}{1 + \cos^{2}x}$ (ardoise) est manifestement positive.
- id: "l3-in-06-02"
  feuille: "f-l3-in-06"
  numero: 2
  partie: "En dimension 1"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [changement de variables en dimension 1]
  noeuds: [cv-changement]
  notions: [diffeomorphisme]
  source: "Lyon 1 (TD06 2020), exercice 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Vrai ou faux : si $\Phi : ]a, b[ \to ]c, d[$ est un $C^{1}$-difféomorphisme et $f : ]c, d[ \to \mathbb{R}$ est mesurable, alors $\int_{c}^{d}f(x)\,\mathrm{d} x = \int_{a}^{b}f(\Phi(y))\Phi'(y)\,\mathrm{d} y$, au sens du théorème de changement de variables ?
  corrige: |
    Faux en général, pour deux raisons. Si $\Phi$ est décroissante, $\Phi' < 0$, et pour $f \geqslant 0$ le membre de droite est négatif, alors que celui de gauche est positif : la formule juste fait intervenir $|\Phi'|$. Ensuite, pour une fonction de signe quelconque, il faut supposer $f$ intégrable, ou positive, pour que les intégrales aient un sens. La formule correcte est 
    $$\int_{]c, d[}f\,\mathrm{d}\lambda = \int_{]a, b[}f(\Phi(y))\,|\Phi'(y)|\,\mathrm{d} y,$$
     pour $f$ mesurable positive, ou intégrable. Avec des intégrales orientées, $\int_{\Phi(a)}^{\Phi(b)}$, le signe de $\Phi'$ est absorbé par l'échange des bornes : c'est la forme apprise en première année.
- id: "l3-in-06-03"
  feuille: "f-l3-in-06"
  numero: 3
  partie: "En dimension 1"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [changement de variables en dimension 1]
  noeuds: [cv-changement]
  notions: [diffeomorphisme]
  source: "Lyon 1 (TD06 2020), exercice 16"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Le théorème en dimension 1.* Soit $\Phi : ]a, b[ \to ]c, d[$ une bijection de classe $C^{1}$ telle que $\Phi'$ ne s'annule pas.

    **1.** Montrer que $\Phi'$ est de signe constant. On suppose désormais $\Phi' > 0$, et l'on veut montrer que, pour $f : ]c, d[ \to \mathbb{R}$ borélienne et $g(y) = f(\Phi(y))\Phi'(y)$, $f$ est intégrable si et seulement si $g$ l'est, et qu'alors 
    $$\int_{]c, d[}f\,\mathrm{d}\lambda = \int_{]a, b[}g\,\mathrm{d}\lambda. \tag{$\ast$}$$

    **2.** Montrer $(\ast)$ pour $f = \chi_{I}$, où $I \subset ]c, d[$ est un intervalle.

    **3.** En déduire $(\ast)$ pour $f = \chi_{B}$, $B$ borélien de $]c, d[$, en comparant deux mesures (chapitre 1, prop. 18), puis pour $f$ borélienne positive, et conclure.

    **4.** Et si $f$ est seulement mesurable au sens de Lebesgue ? Et si $\Phi' < 0$ ?
  corrige: |
    **1.** $\Phi'$ est continue et ne s'annule pas sur l'intervalle $]a, b[$ : par le théorème des valeurs intermédiaires, elle est de signe constant.

    **2.** Si $I$ a pour extrémités $\alpha < \beta$, $\Phi^{-1}(I)$ est un intervalle d'extrémités $\Phi^{-1}(\alpha) < \Phi^{-1}(\beta)$, et $g = \chi_{\Phi^{-1}(I)}\Phi'$. Sur un segment intérieur, l'intégrale de $\Phi'$ est la variation de $\Phi$ ; par convergence monotone, $\int g = \Phi(\Phi^{-1}(\beta)) - \Phi(\Phi^{-1}(\alpha)) = \beta - \alpha = \int\chi_{I}$.

    **3.** $\nu(B) = \int\chi_{B}(\Phi(y))\Phi'(y)\,\mathrm{d} y$ définit une mesure sur les boréliens de $]c, d[$ (additivité dénombrable par convergence monotone), qui coïncide avec $\lambda$ sur les intervalles. Les intervalles forment un $\pi$-système qui engendre la tribu borélienne de $]c, d[$, et les deux mesures sont finies sur les segments $[c + \frac{1}{k}, d - \frac{1}{k}]$, qui croissent vers $]c, d[$ : elles sont égales (chapitre 1, prop. 18). La formule $(\ast)$ vaut donc pour les indicatrices de boréliens, puis pour les fonctions étagées positives par linéarité, puis pour les fonctions boréliennes positives par convergence monotone. Appliquée à $|f|$, elle donne l'équivalence des intégrabilités, et appliquée à $f^{+}$ et $f^{-}$, la formule pour $f$ intégrable.

    **4.** Si $f$ est mesurable au sens de Lebesgue, elle coïncide hors d'un négligeable $N$ avec une fonction borélienne $\tilde{f}$ (chapitre 3, prop. 6). Comme $\Phi^{-1}$ est de classe $C^{1}$, $\Phi^{-1}(N)$ est négligeable (cours, prop. 1) : $g$ et $\tilde{g}$ coïncident presque partout, et $(\ast)$ subsiste. Si $\Phi' < 0$, on applique ce qui précède à $y \mapsto \Phi(a + b - y)$, croissante : la formule devient $\int_{]c, d[}f = \int_{]a, b[}f(\Phi(y))\,|\Phi'(y)|\,\mathrm{d} y$, comme à l'exercice 2.
