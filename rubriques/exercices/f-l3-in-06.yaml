  page_corrige: 4
  enonce: |
    Soit $0 \leqslant a < b$ et $D = \{(x, y) \in \mathbb{R}^{2} ; 0 < x < y < \sqrt{x^{2} + 1},\ a < xy < b\}$. Montrer que $D$ est un borélien, puis, à l'aide du changement de variables $u = y^{2} - x^{2}$, $v = xy$, que l'on justifiera, calculer 
    $$I = \int_{D}(y^{2} - x^{2})^{xy}(x^{2} + y^{2})\,\mathrm{d} x\,\mathrm{d} y.$$
  corrige: |
    $D$ est défini par des inégalités strictes entre fonctions continues : c'est un ouvert, donc un borélien. Avec $z = x + \mathrm{i} y$, on a $-z^{2} = (y^{2} - x^{2}) - 2\mathrm{i} xy$, et $\Phi(x, y) = (y^{2} - x^{2}, xy)$ est injective sur le quart de plan ouvert $\{x, y > 0\}$, où $z \mapsto z^{2}$ l'est. Son jacobien vaut $\det\begin{pmatrix}-2x & 2y\\ y & x\end{pmatrix} = -2(x^{2} + y^{2}) \neq 0$ : par le théorème d'inversion locale, $\Phi$ est un $C^{1}$-difféomorphisme sur son image. Les conditions $0 < x < y < \sqrt{x^{2} + 1}$ et $a < xy < b$ s'écrivent $0 < u < 1$ et $a < v < b$ : $\Phi(D) = ]0, 1[ \times ]a, b[$. Comme $|J_{\Phi}| = 2(x^{2} + y^{2})$, 
    $$I = \int_{]0, 1[ \times ]a, b[}\frac{u^{v}}{2}\,\mathrm{d} u\,\mathrm{d} v = \frac{1}{2}\int_{a}^{b}\frac{\mathrm{d} v}{v + 1} = \boxed{\frac{1}{2}\ln\frac{b + 1}{a + 1}}\text{.}$$
     Le facteur $x^{2} + y^{2}$ de l'énoncé était choisi pour compenser exactement le jacobien.

    ![Figure](documents/figures/bed300b85a095127.svg)

    Pour $a = \frac{1}{2}$ et $b = 2$, le domaine $D$ (ardoise) est découpé dans la bande comprise entre la droite $y = x$ et l'hyperbole $y = \sqrt{x^{2} + 1}$ par les hyperboles $xy = a$ et $xy = b$ (ocre). L'application $z \mapsto -z^{2}$ redresse ces quatre courbes en les côtés du rectangle $]0, 1[ \times ]a, b[$.
