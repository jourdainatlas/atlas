  enonce: |
    **1.** On considère 
    $$A = \int_{(\mathbb{R}_{+})^{2}}\frac{\mathrm{d} s\,\mathrm{d} t}{\cosh s + \cosh t}, \qquad B = \int_{\mathbb{R}^{2}}\frac{\mathrm{d} s\,\mathrm{d} t}{\cosh s + \cosh t}, \qquad C = \int_{\mathbb{R}^{2}}\frac{\mathrm{d} u\,\mathrm{d} v}{\cosh u\cosh v}.$$
     Vérifier que $B = 4A$ et $C = \pi^{2}$. Calculer $B$, puis $A$, à l'aide du changement de variables $s = u - v$, $t = u + v$.

    **2.** Soit $H(x) = \int_{0}^{+\infty}\exp(-x\cosh t)\,\mathrm{d} t$ pour $x > 0$. Montrer que $H$ est décroissante et continue sur $]0, +\infty[$, et déterminer ses limites en $0$ et en $+\infty$. Vérifier que $\int_{0}^{+\infty}H(x)\,\mathrm{d} x = \frac{\pi}{2}$, et, à l'aide de $A$, que $\int_{0}^{+\infty}H(x)^{2}\,\mathrm{d} x = \frac{\pi^{2}}{4}$.
  corrige: |
    **1.** L'intégrande de $B$ est pair en $s$ et en $t$ : $B = 4A$. Par Fubini, $C = \big(\int_{\mathbb{R}}\frac{\mathrm{d} u}{\cosh u}\big)^{2} = \pi^{2}$, puisque $2\arctan\mathrm{e}^{u}$ est une primitive de $\frac{1}{\cosh u}$, qui croît de $0$ à $\pi$. Avec $s = u - v$, $t = u + v$, de jacobien $2$, et $\cosh(u - v) + \cosh(u + v) = 2\cosh u\cosh v$, 
    $$B = \int_{\mathbb{R}^{2}}\frac{2\,\mathrm{d} u\,\mathrm{d} v}{2\cosh u\cosh v} = C = \pi^{2}, \qquad \boxed{A = \frac{\pi^{2}}{4}}\text{.}$$

    **2.** $x \mapsto \mathrm{e}^{-x\cosh t}$ décroît : $H$ aussi. Pour $x \geqslant a > 0$, $\mathrm{e}^{-x\cosh t} \leqslant \mathrm{e}^{-a\mathrm{e}^{t}/2}$, intégrable : $H$ est continue (feuille 5) et tend vers $0$ en $+\infty$ par convergence dominée. Quand $x \to 0^{+}$, la convergence monotone donne $H(x) \to \int_{0}^{+\infty}1 = +\infty$. Par Tonelli, 
    $$\int_{0}^{+\infty}H(x)\,\mathrm{d} x = \int_{0}^{+\infty}\frac{\mathrm{d} t}{\cosh t} = \frac{\pi}{2},$$

    $$\int_{0}^{+\infty}H(x)^{2}\,\mathrm{d} x = \int_{(\mathbb{R}_{+})^{2}}\Big(\int_{0}^{+\infty}\mathrm{e}^{-x(\cosh s + \cosh t)}\,\mathrm{d} x\Big)\mathrm{d} s\,\mathrm{d} t = A = \frac{\pi^{2}}{4}.$$
- id: "l3-in-06-11"
