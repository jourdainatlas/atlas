  source: "Lyon 1 (TD05 2020), exercices 4 et 5 (b) ; Lyon 1 (TD06 2020), exercice 5 (Lyon 5.5 (b) et 6.5 (a) sont identiques)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Calculer l'aire d'un disque de rayon $R$, puis 
    $$\int_{\Delta}\frac{\mathrm{d} x\,\mathrm{d} y}{1 + x^{2} + y^{2}}, \qquad \Delta = \{(x, y) ; 0 \leqslant x, y \leqslant 1,\ 0 < x^{2} + y^{2} \leqslant 1\}.$$

    **2.** Pour $a$, $b > 0$, soit $D = \{(x, y) ; \frac{x^{2}}{a^{2}} + \frac{y^{2}}{b^{2}} \leqslant 1,\ x \geqslant 0,\ y \geqslant 0\}$. Calculer l'aire de $D$ et $\int_{D}(x^{2} + y^{2})\,\mathrm{d} x\,\mathrm{d} y$.

    **3.** Pour $a$, $b > 1$, calculer l'aire de l'ouvert $B$ délimité par les courbes d'équations $y = ax$, $y = \frac{x}{a}$, $y = \frac{b}{x}$, $y = \frac{1}{bx}$ et contenant le point $(1, 1)$.
  corrige: |
    **1.** En coordonnées polaires, l'aire du disque est $\pi R^{2}$ (cours, exemples). $\Delta$ est le quart de disque unité privé de l'origine ; l'intégrande ne dépendant que de $r$, la proposition 3 du cours suffit : 
    $$\int_{\Delta}\frac{\mathrm{d} x\,\mathrm{d} y}{1 + x^{2} + y^{2}} = \frac{\pi}{2}\int_{0}^{1}\frac{r\,\mathrm{d} r}{1 + r^{2}} = \boxed{\frac{\pi}{4}\ln 2 \approx 0{,}544}\text{.}$$

    **2.** Les coordonnées elliptiques $(x, y) = (ar\cos\theta, br\sin\theta)$, de jacobien $abr$, envoient $]0, 1[ \times ]0, \frac{\pi}{2}[$ sur l'intérieur de $D$, dont le bord est négligeable. L'aire est $ab\cdot\frac{\pi}{2}\cdot\frac{1}{2} = \boxed{\frac{\pi ab}{4}}$, et, par Fubini, 
    $$\int_{D}(x^{2} + y^{2}) = ab\int_{0}^{1}r^{3}\,\mathrm{d} r\int_{0}^{\pi/2}(a^{2}\cos^{2}\theta + b^{2}\sin^{2}\theta)\,\mathrm{d}\theta = \boxed{\frac{\pi ab(a^{2} + b^{2})}{16}}\text{.}$$

    **3.** L'application $(x, y) \mapsto (u, v) = (\frac{y}{x}, xy)$ est un $C^{1}$-difféomorphisme de $]0, +\infty[^{2}$ sur lui-même, de réciproque $x = \sqrt{v/u}$, $y = \sqrt{uv}$, et de jacobien $-\frac{2y}{x} = -2u$. Elle envoie $B$ sur le rectangle $]\frac{1}{a}, a[ \times ]\frac{1}{b}, b[$, d'où 
    $$\lambda(B) = \int_{1/a}^{a}\int_{1/b}^{b}\frac{\mathrm{d} u\,\mathrm{d} v}{2u} = \boxed{\ln a\,\Big(b - \frac{1}{b}\Big)}\text{.}$$

    ![Figure](documents/figures/96bf0c60a882833e.svg)

    Pour $a = b = 2$ : le domaine $B$ (ardoise) est un « quadrilatère courbe » bordé par deux droites et deux hyperboles (ocre), et contient le point $(1, 1)$ (carmin). Dans les coordonnées $(u, v) = (\frac{y}{x}, xy)$, ces quatre courbes deviennent les côtés d'un rectangle ; l'aire vaut $\ln 2 \cdot \frac{3}{2} \approx 1{,}040$.
- id: "l3-in-06-06"
