  enonce: |
    À l'aide du changement de variables $u = x + y$, $v = x - y$, calculer $\int_{\mathbb{R}^{2}}\mathrm{e}^{-(x+y)^{2}}\mathrm{e}^{-(x-y)^{2}}\,\mathrm{d} x\,\mathrm{d} y$.
  corrige: |
    $(x, y) \mapsto (x + y, x - y)$ est linéaire bijective, de déterminant $-2$ ; son inverse a pour jacobien $\frac{1}{2}$ en valeur absolue. Par Fubini, 
    $$\int_{\mathbb{R}^{2}}\mathrm{e}^{-(x+y)^{2}}\mathrm{e}^{-(x-y)^{2}}\,\mathrm{d} x\,\mathrm{d} y = \frac{1}{2}\int_{\mathbb{R}}\mathrm{e}^{-u^{2}}\,\mathrm{d} u\int_{\mathbb{R}}\mathrm{e}^{-v^{2}}\,\mathrm{d} v = \boxed{\frac{\pi}{2}}\text{.}$$
- id: "l3-in-06-10"
