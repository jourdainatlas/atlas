  enonce: |
    Pour $n \geqslant 1$, soit $U_{n} = \{x \in \mathbb{R}^{n} ; x_{1} > 0, \dots, x_{n} > 0,\ x_{1} + \dots + x_{n} < 1\}$ et $S_{n} = \lambda(U_{n})$. Établir une relation entre $S_{n}$ et $S_{n-1}$, et en déduire $S_{n}$.
  corrige: |
    Par Fubini, en intégrant d'abord en $(x_{1}, \dots, x_{n-1})$ à $x_{n} = t$ fixé, la section est $(1 - t)U_{n-1}$, de mesure $(1 - t)^{n-1}S_{n-1}$ (chapitre 2, prop. 12). Donc 
    $$S_{n} = S_{n-1}\int_{0}^{1}(1 - t)^{n-1}\,\mathrm{d} t = \frac{S_{n-1}}{n}, \qquad S_{1} = 1, \qquad \boxed{S_{n} = \frac{1}{n!}}\text{.}$$
     Les $n!$ simplexes obtenus en permutant les coordonnées, $\{x_{\sigma(1)} < \dots < x_{\sigma(n)}\}$ dans le cube, ont aussi le volume $\frac{1}{n!}$ : c'est la même géométrie vue autrement.
- id: "l3-in-06-07"
