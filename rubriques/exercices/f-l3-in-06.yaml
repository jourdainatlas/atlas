  enonce: |
    Soit $J = \int_{]0, 1[^{2}}\frac{\mathrm{d} x\,\mathrm{d} y}{1 - xy}$.

    **1.** Montrer que $J = \sum_{n \geqslant 1}\frac{1}{n^{2}}$.

    **2.** Effectuer le changement de variables $x = u - v$, $y = u + v$, et en déduire que $J = \int_{Q}\frac{2\,\mathrm{d} u\,\mathrm{d} v}{1 - u^{2} + v^{2}}$, où $Q$ est un carré du plan que l'on déterminera.

    **3.** Effectuer le changement de variable $u = \cos t$, et en déduire que $J = \frac{\pi^{2}}{6}$. On rappelle que $\frac{1 - \cos t}{\sin t} = \tan\frac{t}{2}$ pour $t \notin \pi\mathbb{Z}$.
  corrige: |
    **1.** Sur $]0, 1[^{2}$, $\frac{1}{1 - xy} = \sum_{n \geqslant 0}(xy)^{n}$, série de fonctions positives ; on intègre terme à terme et, par Fubini, $\int x^{n}y^{n} = \frac{1}{(n + 1)^{2}}$ : $J = \sum_{n \geqslant 1}\frac{1}{n^{2}}$.

    **2.** L'application $(u, v) \mapsto (u - v, u + v)$ a pour jacobien $2$, et $xy = u^{2} - v^{2}$. Le carré $]0, 1[^{2}$ correspond au carré $Q$ de sommets $(0, 0)$, $(\frac{1}{2}, \pm\frac{1}{2})$ et $(1, 0)$, c'est-à-dire $Q = \{0 < u < 1,\ |v| < \min(u, 1 - u)\}$, d'où la formule.

    **3.** Par symétrie en $v$, et avec $\int_{0}^{m}\frac{\mathrm{d} v}{c^{2} + v^{2}} = \frac{1}{c}\arctan\frac{m}{c}$, $c = \sqrt{1 - u^{2}}$, 
    $$J = 4\int_{0}^{1/2}\arctan\Big(\frac{u}{\sqrt{1 - u^{2}}}\Big)\frac{\mathrm{d} u}{\sqrt{1 - u^{2}}} + 4\int_{1/2}^{1}\arctan\Big(\frac{1 - u}{\sqrt{1 - u^{2}}}\Big)\frac{\mathrm{d} u}{\sqrt{1 - u^{2}}}.$$
     Avec $u = \cos t$, $\frac{u}{\sqrt{1 - u^{2}}} = \cot t$ donne $\arctan(\cot t) = \frac{\pi}{2} - t$, et $\frac{1 - u}{\sqrt{1 - u^{2}}} = \tan\frac{t}{2}$ donne $\frac{t}{2}$. Ainsi 
    $$J = 4\int_{\pi/3}^{\pi/2}\Big(\frac{\pi}{2} - t\Big)\mathrm{d} t + 4\int_{0}^{\pi/3}\frac{t}{2}\,\mathrm{d} t = \frac{\pi^{2}}{18} + \frac{\pi^{2}}{9} = \boxed{\frac{\pi^{2}}{6}}\text{.}$$
     On a ainsi démontré la formule d'Euler $\sum\frac{1}{n^{2}} = \frac{\pi^{2}}{6}$ par un simple changement de variables.

    ![Figure](documents/figures/9d0c995db94dc397.svg)

    L'image $Q$ du carré unité (ardoise) est un carré tourné de $45^{\circ}$, deux fois plus petit en aire, d'où le jacobien $2$. La droite $u = \frac{1}{2}$ (carmin) sépare les deux régimes $|v| < u$ et $|v| < 1 - u$, qui donnent les deux intégrales.
- id: "l3-in-06-12"
  feuille: "f-l3-in-06"
  numero: 12
  partie: "Dans le plan et dans l'espace"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["changement de variables dans le plan et l'espace"]
  noeuds: [cv-changement, cv-polaires]
  notions: [jacobien, matrice-jacobienne, diffeomorphisme]
  source: "Lyon 1 (TD06 2020), exercice 21"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Pour $F : \mathbb{R} \to \mathbb{R}$ borélienne et bornée, soit $I(F) = \int_{\mathbb{R}^{2}}\frac{F(x + y)}{\pi^{2}(1 + x^{2})(1 + y^{2})}\,\mathrm{d} x\,\mathrm{d} y$.

    **1.** Montrer que $I(F)$ est bien définie, et calculer $I(F)$ pour $F = \sin$.

    **2.** Montrer, par un changement de variables, que 
    $$\int_{\mathbb{R}^{2}}\frac{F(x + y)\,\mathrm{d} x\,\mathrm{d} y}{\pi^{2}(1 + x^{2})(1 + y^{2})} = 2\int_{\mathbb{R}}\frac{F(z)}{\pi(4 + z^{2})}\,\mathrm{d} z,$$
     en admettant que $\int_{\mathbb{R}}\frac{\mathrm{d} y}{(1 + y^{2})(1 + (z - y)^{2})} = \frac{2\pi}{4 + z^{2}}$.

    **3.** Pour $\lambda \in \mathbb{R}$, soit $F_{\lambda}(x) = \cos(\lambda x)$ et $G(\lambda) = I(F_{\lambda})$. Écrire $G$ comme la transformée de Fourier d'une fonction que l'on précisera, et calculer $G$ (feuille 5, exercice 15).

    **4.** Montrer que, pour toute $F$ borélienne bornée, $\int_{\mathbb{R}^{2}}F\Big(\frac{x}{y}\Big)\mathrm{e}^{-x^{2}/2 - y^{2}/2}\,\mathrm{d} x\,\mathrm{d} y = 2\int_{\mathbb{R}}\frac{F(z)}{1 + z^{2}}\,\mathrm{d} z$.
  corrige: |
    **1.** L'intégrande est majoré par $\frac{\sup|F|}{\pi^{2}(1 + x^{2})(1 + y^{2})}$, d'intégrale $\sup|F|$ par Fubini. Pour $F = \sin$, la symétrie $(x, y) \mapsto (-x, -y)$ conserve la mesure et la densité, et change l'intégrande en son opposé : $\boxed{I(\sin) = 0}$.

    **2.** Le cisaillement $(x, y) \mapsto (z, y) = (x + y, y)$ a pour jacobien $1$. Par Fubini, avec l'intégrale admise, 
    $$I(F) = \int_{\mathbb{R}}F(z)\Big(\int_{\mathbb{R}}\frac{\mathrm{d} y}{\pi^{2}(1 + (z - y)^{2})(1 + y^{2})}\Big)\mathrm{d} z = 2\int_{\mathbb{R}}\frac{F(z)}{\pi(4 + z^{2})}\,\mathrm{d} z.$$

    **3.** $G(\lambda) = \int\cos(\lambda z)h(z)\,\mathrm{d} z = \widehat{h}(\lambda)$, avec $h(z) = \frac{2}{\pi(4 + z^{2})}$, paire. Par la feuille 5, exercice 15, $\int_{\mathbb{R}}\frac{\cos(\mu w)}{1 + w^{2}}\,\mathrm{d} w = \pi\mathrm{e}^{-|\mu|}$ ; avec $z = 2w$, $\boxed{G(\lambda) = \mathrm{e}^{-2|\lambda|}}$. En probabilités, $\frac{1}{\pi(1 + x^{2})}$ est la densité de la loi de Cauchy, $I(F)$ est l'espérance de $F(X + Y)$ pour deux variables de Cauchy indépendantes, et la question 2 dit que $X + Y$ suit une loi de Cauchy d'échelle $2$.

    **4.** Sur chacun des demi-plans $\{y > 0\}$ et $\{y < 0\}$, $(x, y) \mapsto (z, y) = (\frac{x}{y}, y)$ est un $C^{1}$-difféomorphisme, de réciproque $x = zy$ et de jacobien $|y|$ ; la droite $y = 0$ est négligeable. Par Fubini, 
    $$\int_{\mathbb{R}^{2}}F\Big(\frac{x}{y}\Big)\mathrm{e}^{-\frac{x^{2} + y^{2}}{2}}\,\mathrm{d} x\,\mathrm{d} y = \int_{\mathbb{R}}F(z)\Big(\int_{\mathbb{R}}|y|\mathrm{e}^{-y^{2}(1 + z^{2})/2}\,\mathrm{d} y\Big)\mathrm{d} z = 2\int_{\mathbb{R}}\frac{F(z)}{1 + z^{2}}\,\mathrm{d} z.$$
     Le quotient de deux variables gaussiennes indépendantes suit donc, lui aussi, une loi de Cauchy.
- id: "l3-in-06-13"
  feuille: "f-l3-in-06"
  numero: 13
  partie: "Dans le plan et dans l'espace"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["changement de variables dans le plan et l'espace", coordonnées polaires]
  noeuds: [cv-changement, cv-polaires]
  notions: [jacobien, matrice-jacobienne, diffeomorphisme, produit-scalaire, coordonnees-polaires]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On munit $\mathbb{R}^{2}$ du produit scalaire usuel $(z | w)$ et de la norme associée, et l'on note $\mathbb{B}$ la boule unité fermée et $\mathbb{B}' = \mathbb{R}^{2} \setminus \mathbb{B}$. Soit $s$ un réel et, pour $w \in \mathbb{R}^{2} \setminus \{0\}$, 
    $$f_{w}(z) = \frac{|\mathrm{e}^{\mathrm{i}(z | w)} - 1|^{2}}{\lVert z \rVert^{2 + 2s}} \ \text{ si } z \neq 0, \qquad f_{w}(0) = 0.$$

    **1.** Montrer que $|\mathrm{e}^{\mathrm{i}\theta} - 1|^{2} = 4\sin^{2}\frac{\theta}{2} \leqslant \theta^{2}$ pour $\theta \in \mathbb{R}$.

    **2.** En passant en coordonnées polaires, montrer que $f_{w}\chi_{\mathbb{B}'}$ est intégrable si $s > 0$, et que $f_{w}\chi_{\mathbb{B}}$ l'est si $s < 1$.

    **3.** On suppose $s \in ]0, 1[$ et l'on pose $G(w) = \int_{\mathbb{R}^{2}}f_{w}$. Montrer que $G(Aw) = G(w)$ pour toute matrice orthogonale $A$.
  corrige: |
    **1.** $|\mathrm{e}^{\mathrm{i}\theta} - 1|^{2} = (\cos\theta - 1)^{2} + \sin^{2}\theta = 2 - 2\cos\theta = 4\sin^{2}\frac{\theta}{2} \leqslant \theta^{2}$, car $|\sin u| \leqslant |u|$.

    **2.** Sur $\mathbb{B}'$, $f_{w} \leqslant \frac{4}{\lVert z \rVert^{2 + 2s}}$, et en polaires (proposition 3 du cours, l'intégrande ne dépendant que de $r$), $\int_{\mathbb{B}'}\frac{4}{\lVert z \rVert^{2 + 2s}} = 8\pi\int_{1}^{+\infty}r^{-1-2s}\,\mathrm{d} r < +\infty$ si $s > 0$. Sur $\mathbb{B}$, la question 1 et l'inégalité de Cauchy-Schwarz donnent $f_{w}(z) \leqslant \frac{(z | w)^{2}}{\lVert z \rVert^{2 + 2s}} \leqslant \lVert w \rVert^{2}\lVert z \rVert^{-2s}$, et $2\pi\lVert w \rVert^{2}\int_{0}^{1}r^{1 - 2s}\,\mathrm{d} r < +\infty$ si $s < 1$.

    **3.** $(z | Aw) = (A^{t}z | w)$. Le changement de variable linéaire $z = Az'$, avec $|\det A| = 1$ et $\lVert Az' \rVert = \lVert z' \rVert$ (cours, th. 1), donne 
    $$G(Aw) = \int_{\mathbb{R}^{2}}\frac{|\mathrm{e}^{\mathrm{i}(z' | w)} - 1|^{2}}{\lVert z' \rVert^{2 + 2s}}\,\mathrm{d} z' = G(w).$$
     $G$ ne dépend donc que de $\lVert w \rVert$ ; une homothétie de rapport $\lVert w \rVert$ sur $z$ montre de plus que $G(w) = G(e_{1})\lVert w \rVert^{2s}$.
- id: "l3-in-06-14"
  feuille: "f-l3-in-06"
  numero: 14
  partie: "Coordonnées sphériques, fonctions radiales"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["coordonnées sphériques, fonctions radiales"]
  noeuds: [cv-changement, cv-polaires]
  notions: [jacobien]
  source: "Exo7 (fic00144), exercice 6 (i)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $p > 0$ et $f(x) = |x|^{-p}\chi_{\{|x| < 1\}}(x)$ sur $\mathbb{R}^{n}$. Calculer $\int_{\mathbb{R}^{n}}f(x)\,\mathrm{d} x$ en coordonnées sphériques.
  corrige: |
    Par la proposition 4 du cours, avec $nv_{n} = \frac{2\pi^{n/2}}{\Gamma(n/2)}$ (exercice 15), 
    $$\int_{\{|x| < 1\}}|x|^{-p}\,\mathrm{d} x = nv_{n}\int_{0}^{1}r^{n-1-p}\,\mathrm{d} r = \boxed{\frac{nv_{n}}{n - p} \text{ si } p < n, \qquad +\infty \text{ si } p \geqslant n}\text{.}$$
     En dimension $n$, la singularité $|x|^{-p}$ est intégrable près de $0$ si et seulement si $p < n$ : le volume $r^{n-1}\,\mathrm{d} r$ des couronnes compense une singularité d'autant plus forte que la dimension est grande.
- id: "l3-in-06-15"
  feuille: "f-l3-in-06"
  numero: 15
  partie: "Coordonnées sphériques, fonctions radiales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["coordonnées sphériques, fonctions radiales"]
  noeuds: [cv-changement, cv-polaires]
  notions: [jacobien]
  source: "Lyon 1 (TD06 2020), exercices 18 et 19"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $|\cdot|$ la norme euclidienne de $\mathbb{R}^{n}$ et $v_{n}$ le volume de sa boule unité. Par la proposition 4 du cours, $\int_{\mathbb{R}^{n}}f(|x|)\,\mathrm{d} x = nv_{n}\int_{0}^{+\infty}r^{n-1}f(r)\,\mathrm{d} r$ pour toute $f : ]0, +\infty[ \to [0, +\infty]$ borélienne.

    **1.** Expliquer pourquoi cette égalité garde un sens pour $f$ réelle telle que $r \mapsto r^{n-1}f(r)$ soit intégrable.

    **2.** En calculant de deux façons $\int_{\mathbb{R}^{n}}\mathrm{e}^{-|x|^{2}}\,\mathrm{d} x$, montrer que $nv_{n} = \frac{2\pi^{n/2}}{\Gamma(n/2)}$, et en déduire $v_{n}$. Comparer avec l'exercice 16.

    **3.** Soit $\lVert \cdot \rVert$ une norme quelconque sur $\mathbb{R}^{n}$ et $U = \{\lVert x \rVert > 1\}$. Pour $a \in \mathbb{R}$, quelle est la nature de $\int_{U}\lVert x \rVert^{-a}\,\mathrm{d} x$ ?
  corrige: |
    **1.** Si $r^{n-1}f(r)$ est intégrable, la formule appliquée à $f^{+}$ et $f^{-}$ donne deux intégrales finies, et $x \mapsto f(|x|)$ est intégrable ; on soustrait.

    **2.** Par Fubini, $\int_{\mathbb{R}^{n}}\mathrm{e}^{-|x|^{2}}\,\mathrm{d} x = \big(\int_{\mathbb{R}}\mathrm{e}^{-t^{2}}\,\mathrm{d} t\big)^{n} = \pi^{n/2}$. Par la formule, avec $t = r^{2}$, c'est aussi $nv_{n}\int_{0}^{+\infty}r^{n-1}\mathrm{e}^{-r^{2}}\,\mathrm{d} r = nv_{n}\frac{\Gamma(n/2)}{2}$. Donc 
    $$nv_{n} = \frac{2\pi^{n/2}}{\Gamma(n/2)}, \qquad \boxed{v_{n} = \frac{\pi^{n/2}}{\Gamma(\frac{n}{2} + 1)}}\text{,}$$
     soit $v_{2} = \pi$, $v_{3} = \frac{4\pi}{3}$, $v_{4} = \frac{\pi^{2}}{2}$, ce qu'on retrouve à l'exercice 16.

    **3.** La proposition 4 vaut pour toute norme : $\int_{U}\lVert x \rVert^{-a}\,\mathrm{d} x = nv\int_{1}^{+\infty}r^{n-1-a}\,\mathrm{d} r$, finie si et seulement si $\boxed{a > n}$. Seul le comportement à l'infini compte, et toutes les normes donnent le même seuil.
- id: "l3-in-06-16"
  feuille: "f-l3-in-06"
  numero: 16
  partie: "Coordonnées sphériques, fonctions radiales"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: ["coordonnées sphériques, fonctions radiales", ensembles négligeables]
  noeuds: [cv-changement, cv-polaires, m-lebesgue]
  notions: [jacobien, negligeable]
  source: "Exo7 (fic00149), exercice 5 ; Féjoz (exosIntegration), exercice 4.6"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** *Coordonnées sphériques dans $\mathbb{R}^{n}$.* Soit $\Omega' = \,]0, +\infty[\, \times \,]0, \pi[^{n-2} \times \,]0, 2\pi[$, et $S : \Omega' \to \mathbb{R}^{n}$ définie par 
    $$x_{1} = r\cos\theta_{1}, \quad x_{2} = r\sin\theta_{1}\cos\theta_{2}, \quad \dots$$

    $$x_{n-1} = r\sin\theta_{1}\cdots\sin\theta_{n-2}\cos\theta_{n-1}, \quad x_{n} = r\sin\theta_{1}\cdots\sin\theta_{n-1}.$$
     Montrer que $\Omega = \mathbb{R}^{n} \setminus \{x_{n} = 0, x_{n-1} \geqslant 0\}$ est un ouvert de complémentaire négligeable, que $S$ est un $C^{1}$-difféomorphisme de $\Omega'$ sur $\Omega$, de jacobien $r^{n-1}\sin^{n-2}\theta_{1}\sin^{n-3}\theta_{2}\cdots\sin\theta_{n-2}$, et en déduire le volume de la boule unité de $\mathbb{R}^{4}$.

    **2.** Calculer le volume de l'ellipsoïde plein $E = \{\frac{x^{2}}{a^{2}} + \frac{y^{2}}{b^{2}} + \frac{z^{2}}{c^{2}} \leqslant 1\}$, et son moment d'inertie $I_{z} = \int_{E}(x^{2} + y^{2})\,\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z$.

    **3.** *Théorème de Guldin.* Soit $A$ un borélien du demi-plan $\{(y, z) ; y > 0\}$, et $\widehat{A} \subset \mathbb{R}^{3}$ le solide obtenu en le faisant tourner autour de l'axe $Oz$. Montrer que $\widehat{A}$ est borélien et que $\lambda(\widehat{A}) = 2\pi\int_{A}y\,\mathrm{d} y\,\mathrm{d} z$. En déduire le volume du tore plein obtenu à partir du disque $(y - a)^{2} + z^{2} \leqslant r^{2}$, où $0 < r < a$.

    **4.** Calculer le volume de la boule unité de $\mathbb{R}^{n}$ par récurrence sur $n$.
  corrige: |
    **1.** Le complémentaire de $\Omega$ est un demi-hyperplan fermé, négligeable. On raisonne par récurrence sur $n$, le cas $n = 2$ étant celui des coordonnées polaires. On écrit $S = T_{2} \circ T_{1}$, où 
    $$T_{1}(r, \theta_{1}, \theta') = (r\cos\theta_{1}, r\sin\theta_{1}, \theta')$$
     est un changement polaire en $(r, \theta_{1})$, de jacobien $r$, et $T_{2}(x_{1}, \rho, \theta') = (x_{1}, S_{n-1}(\rho, \theta'))$ applique les coordonnées sphériques de $\mathbb{R}^{n-1}$, de jacobien $\rho^{n-2}\sin^{n-3}\theta_{2}\cdots$ par récurrence. La bijectivité se propage de même, et le jacobien est le produit 
    $$r\,(r\sin\theta_{1})^{n-2}\sin^{n-3}\theta_{2}\cdots\sin\theta_{n-2} = r^{n-1}\sin^{n-2}\theta_{1}\sin^{n-3}\theta_{2}\cdots\sin\theta_{n-2}.$$
     Pour $n = 4$, par Fubini, 
    $$v_{4} = \int_{0}^{1}r^{3}\,\mathrm{d} r\int_{0}^{\pi}\sin^{2}\theta_{1}\,\mathrm{d}\theta_{1}\int_{0}^{\pi}\sin\theta_{2}\,\mathrm{d}\theta_{2}\int_{0}^{2\pi}\mathrm{d}\theta_{3} = \frac{1}{4}\cdot\frac{\pi}{2}\cdot 2\cdot 2\pi = \boxed{\frac{\pi^{2}}{2}}\text{,}$$
     et l'aire de la sphère unité de $\mathbb{R}^{4}$ est $4v_{4} = 2\pi^{2}$.

    **2.** $E$ est l'image de la boule unité par $\operatorname{diag}(a, b, c)$ : $\lambda(E) = \boxed{\frac{4}{3}\pi abc}$ (cours, th. 1). Avec $(x, y, z) = (au, bv, cw)$, on a $I_{z} = abc\int_{B}(a^{2}u^{2} + b^{2}v^{2})$, et, par symétrie, 
    $$\int_{B}u^{2} = \frac{1}{3}\int_{B}|x|^{2} = \frac{4\pi}{3}\int_{0}^{1}r^{4}\,\mathrm{d} r = \frac{4\pi}{15}.$$
     Donc $\boxed{I_{z} = \frac{4\pi}{15}abc(a^{2} + b^{2})}$.

    **3.** $\widehat{A} = g^{-1}(A)$, où $g(x, y, z) = (\sqrt{x^{2} + y^{2}}, z)$ est continue : c'est un borélien. Les coordonnées cylindriques, de jacobien $\rho$, envoient $A \times ]0, 2\pi[$ sur $\widehat{A}$ privé d'un demi-plan négligeable, et par Fubini 
    $$\lambda(\widehat{A}) = \int_{0}^{2\pi}\int_{A}\rho\,\mathrm{d}\rho\,\mathrm{d} z\,\mathrm{d}\theta = 2\pi\int_{A}y\,\mathrm{d} y\,\mathrm{d} z.$$
     Pour le disque de centre $(a, 0)$, $\int y = \int(y - a) + a\pi r^{2} = a\pi r^{2}$, le premier terme étant nul par symétrie : $\boxed{\lambda(\text{tore}) = 2\pi^{2}ar^{2}}$, soit le produit de l'aire du disque par la longueur du cercle décrit par son centre.

    **4.** Par Fubini, la section de $B_{n}$ à $x_{n} = t$ est une boule de dimension $n - 1$ et de rayon $\sqrt{1 - t^{2}}$, donc $v_{n} = v_{n-1}W_{n}$, avec $W_{n} = \int_{-1}^{1}(1 - t^{2})^{(n-1)/2}\,\mathrm{d} t = 2\int_{0}^{\pi/2}\cos^{n}\theta\,\mathrm{d}\theta$. Les intégrales de Wallis vérifient $W_{n}W_{n-1} = \frac{2\pi}{n}$, d'où $v_{n} = \frac{2\pi}{n}v_{n-2}$, avec $v_{1} = 2$ et $v_{2} = \pi$ ; on retrouve la formule de l'exercice 15.
- id: "l3-in-06-17"
  feuille: "f-l3-in-06"
  numero: 17
  partie: "Coordonnées sphériques, fonctions radiales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["coordonnées sphériques, fonctions radiales"]
  noeuds: [cv-changement, cv-polaires]
  notions: [jacobien]
  source: "Exo7 (fic00149), exercice 6"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Théorème de Newton.* Soit $g : [0, +\infty[ \to [0, +\infty[$ borélienne et $f(x) = g(|x|)$ sur $\mathbb{R}^{3}$, où $|\cdot|$ est la norme euclidienne.

    **1.** Montrer que, pour $r = |x| > 0$, 
    $$\int_{\mathbb{R}^{3}}\frac{f(y)}{|x - y|}\,\mathrm{d} y = \frac{4\pi}{r}\int_{0}^{r}g(s)s^{2}\,\mathrm{d} s + 4\pi\int_{r}^{+\infty}g(s)s\,\mathrm{d} s.$$

    **2.** Qu'en déduire pour une distribution de masse $f(x) = g(|x|)$ lorsque $g$ est nulle hors de $[0, R]$ ?
  corrige: |
    **1.** La fonction $f$ est radiale, et une rotation, de déterminant $1$, permet de supposer $x = re_{3}$. En coordonnées sphériques $y = s(\cos\theta\sin\varphi, \sin\theta\sin\varphi, \cos\varphi)$, $|x - y|^{2} = r^{2} + s^{2} - 2rs\cos\varphi$, et, par Tonelli, 
    $$\int_{0}^{2\pi}\int_{0}^{\pi}\frac{\sin\varphi\,\mathrm{d}\varphi\,\mathrm{d}\theta}{\sqrt{r^{2} + s^{2} - 2rs\cos\varphi}} = 2\pi\Big[\frac{\sqrt{r^{2} + s^{2} - 2rs\cos\varphi}}{rs}\Big]_{0}^{\pi} = 2\pi\frac{(r + s) - |r - s|}{rs} = \frac{4\pi}{\max(r, s)}.$$
     Il reste $\int_{0}^{+\infty}g(s)s^{2}\frac{4\pi}{\max(r, s)}\,\mathrm{d} s$, qui est la formule annoncée.

    **2.** Si $g$ est nulle hors de $[0, R]$ et $r \geqslant R$, le second terme est nul et le premier vaut $\frac{M}{r}$, où $M = 4\pi\int_{0}^{R}g(s)s^{2}\,\mathrm{d} s = \int f$ est la masse totale. À l'extérieur, une distribution de masse à symétrie sphérique crée le même potentiel que toute sa masse concentrée au centre : c'est le théorème de Newton, qui justifie de traiter les planètes comme des points. De plus, une coquille creuse ($g = 0$ sur $[0, r]$) crée à l'intérieur un potentiel constant, donc aucune force.

    ![Figure](documents/figures/7cc4f15d065f8a68.svg)

    Pour la boule unité de densité $1$, de masse $M = \frac{4\pi}{3}$ : le potentiel $V(r)$ (ardoise) vaut $2\pi - \frac{2\pi r^{2}}{3}$ dans la boule (fond ardoise) et coïncide au-delà avec le potentiel $\frac{M}{r}$ de la masse ponctuelle (tirets ocre), qui seul explose en $0$.
