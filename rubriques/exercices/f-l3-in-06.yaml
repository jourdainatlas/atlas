  enonce: |
    Soit $f : \mathbb{R}^{3} \to \mathbb{R}$ radiale, $f(x) = h(|x|)$, avec $r \mapsto r^{2}h(r)$ intégrable sur $]0, +\infty[$. Montrer que $f \in \mathcal{L}^{1}(\mathbb{R}^{3})$ et que sa transformée de Fourier vaut, pour $\xi \neq 0$, 
    $$\widehat{f}(\xi) = \frac{4\pi}{|\xi|}\int_{0}^{+\infty}h(r)\,r\sin(|\xi|r)\,\mathrm{d} r.$$
  corrige: |
    Par la proposition 4, $\int|f| = 4\pi\int_{0}^{+\infty}r^{2}|h(r)|\,\mathrm{d} r < +\infty$. Si $A$ est une rotation, $f(Ax) = f(x)$ et $\langle\xi, Ax\rangle = \langle A^{t}\xi, x\rangle$ : on peut supposer $\xi = |\xi|e_{3}$. En coordonnées sphériques, puis par Fubini, 
    $$\widehat{f}(\xi) = \int_{0}^{+\infty}h(r)r^{2}\Big(2\pi\int_{0}^{\pi}\mathrm{e}^{-\mathrm{i}|\xi|r\cos\varphi}\sin\varphi\,\mathrm{d}\varphi\Big)\mathrm{d} r = \int_{0}^{+\infty}h(r)r^{2}\cdot 2\pi\frac{2\sin(|\xi|r)}{|\xi|r}\,\mathrm{d} r,$$
     soit la formule annoncée. La transformée de Fourier d'une fonction radiale est radiale, et se calcule par une seule intégrale.
- id: "l3-in-06-19"
  feuille: "f-l3-in-06"
  numero: 19
  partie: "Intégrales eulériennes et asymptotiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrales eulériennes]
  noeuds: [cv-changement, cv-gaussienne]
  notions: [jacobien]
  source: "Lyon 1 (TD06 2020), exercice 9"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Pour $x$, $y > 0$, soit $B(x, y) = \int_{0}^{1}t^{x-1}(1 - t)^{y-1}\,\mathrm{d} t$. Soit $f : ]0, +\infty[ \to [0, +\infty]$ borélienne, $a$, $b$, $c > 0$, et 
    $$I_{a, b, c} = \int_{(\mathbb{R}_{+}^{*})^{3}}x^{a-1}y^{b-1}z^{c-1}f(x + y + z)\,\mathrm{d} x\,\mathrm{d} y\,\mathrm{d} z.$$

    **1.** Soit $H(x, y, z) = (u, v, w)$ avec $u = x + y + z$, $v = \frac{x}{x + y}$, $w = \frac{x + y}{x + y + z}$. Montrer que $H$ est un $C^{1}$-difféomorphisme de $(\mathbb{R}_{+}^{*})^{3}$ sur un ouvert $U$ que l'on déterminera.

    **2.** En déduire que $I_{a, b, c} = B(a, b)B(a + b, c)\int_{0}^{+\infty}u^{a+b+c-1}f(u)\,\mathrm{d} u$, puis, en admettant que $B(x, y) = \frac{\Gamma(x)\Gamma(y)}{\Gamma(x + y)}$, que 
    $$I_{a, b, c} = \frac{\Gamma(a)\Gamma(b)\Gamma(c)}{\Gamma(a + b + c)}\int_{0}^{+\infty}u^{a+b+c-1}f(u)\,\mathrm{d} u. \tag{$\ast\ast$}$$
  corrige: |
    **1.** $H$ est de classe $C^{1}$ de $(\mathbb{R}_{+}^{*})^{3}$ dans $U = ]0, +\infty[ \times ]0, 1[^{2}$, et bijective, de réciproque de classe $C^{1}$ 
    $$(x, y, z) = \big(uvw,\ u(1 - v)w,\ u(1 - w)\big),$$
     puisque $x + y = uw$ et $x = v(x + y)$. Le jacobien de la réciproque vaut $u^{2}w$.

    **2.** Par le théorème 2 du cours, puis par Fubini, 
    $$\begin{aligned} I_{a, b, c} &= \int_{U}(uvw)^{a-1}(u(1 - v)w)^{b-1}(u(1 - w))^{c-1}f(u)\,u^{2}w\,\mathrm{d} u\,\mathrm{d} v\,\mathrm{d} w \\ &= B(a, b)\,B(a + b, c)\int_{0}^{+\infty}u^{a+b+c-1}f(u)\,\mathrm{d} u, \end{aligned}$$
     les exposants de $u$ et de $w$ étant $a + b + c - 1$ et $a + b - 1$. Avec $B(x, y) = \frac{\Gamma(x)\Gamma(y)}{\Gamma(x + y)}$, le facteur $\Gamma(a + b)$ se simplifie, ce qui donne $(\ast\ast)$.
- id: "l3-in-06-20"
