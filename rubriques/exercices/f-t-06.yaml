  enonce: |
    Soient $f$ une fonction continue sur $[0\,;+\infty[$, et $G$ la fonction définie sur $[0\,;+\infty[$ par $G(0)=f(0)$ et 
    $$\text{pour tout } x>0, \qquad G(x)=\frac{1}{x}\int_{0}^{x}f(t)\,\mathrm{d}t$$

    **1.** Montrer que $G$ est dérivable sur $]0\,;+\infty[$, et donner une expression de $G'(x)$ pour $x>0$.

    **2.** Montrer que $G$ est continue en $0$. On pourra reconnaître en $G(x)$ un taux d'accroissement.
  corrige: |
    Notons $F(x)=\displaystyle\int_{0}^{x}f(t)\,\mathrm{d}t$. D'après le cours, $F$ est la primitive de $f$ sur $[0\,;+\infty[$ qui s'annule en $0$ : elle est dérivable, de dérivée $f$.

    **1.** Sur $]0\,;+\infty[$, $G(x)=\dfrac{F(x)}{x}$ est un quotient de fonctions dérivables dont le dénominateur ne s'annule pas, donc $G$ est dérivable et 
    $$G'(x)=\frac{x\,f(x)-F(x)}{x^{2}}=\boxed{\frac{f(x)-G(x)}{x}}$$

    **2.** Pour $x>0$, comme $F(0)=0$ : 
    $$G(x)=\frac{F(x)-F(0)}{x-0}$$
     C'est le taux d'accroissement de $F$ entre $0$ et $x$. La fonction $F$ étant dérivable en $0$, il tend vers $F'(0)=f(0)=G(0)$ quand $x$ tend vers $0$. 
    $$\boxed{\lim_{x\to 0^{+}}G(x)=G(0) \text{ : } G \text{ est continue en } 0.}$$

    *Interprétation.* Pour $x>0$, $G(x)$ est la valeur moyenne de $f$ sur $[0\,;x]$ (exercice 25). La question 2 dit que la moyenne de $f$ sur un intervalle de plus en plus court tend vers la valeur de $f$ au point de départ, ce qui justifie la définition $G(0)=f(0)$.

    *Remarque.* La formule de la question 1 a une conséquence parlante. Si $f$ est croissante, alors $f(t)\leqslant f(x)$ pour $t\in[0\,;x]$, donc la moyenne $G(x)$ est inférieure à $f(x)$, et $G'(x)\geqslant 0$ : la moyenne d'une fonction croissante sur $[0\,;x]$ croît avec $x$, ce que l'intuition suggérait.
- id: "t-06-44"
