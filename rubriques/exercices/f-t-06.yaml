  enonce: |
    Calculer les intégrales suivantes.

    **a)** $\displaystyle\int_{0}^{2}\left(3x^{2}-2x+1\right)\,\mathrm{d}x$

    **b)** $\displaystyle\int_{1}^{3}(2x-5)\,\,\mathrm{d}x$

    **c)** $\displaystyle\int_{-1}^{1}\left(x^{3}+x\right)\,\mathrm{d}x$

    **d)** $\displaystyle\int_{1}^{4}\dfrac{1}{\sqrt{x}}\,\,\mathrm{d}x$

    **e)** $\displaystyle\int_{1}^{2}\dfrac{1}{x^{2}}\,\,\mathrm{d}x$

    **f)** $\displaystyle\int_{0}^{1}\mathrm{e}^{x}\,\,\mathrm{d}x$

    **g)** $\displaystyle\int_{1}^{\mathrm{e}}\dfrac{1}{x}\,\,\mathrm{d}x$

    **h)** $\displaystyle\int_{0}^{1}\left(x^{3}-2x+3\right)\,\mathrm{d}x$
  corrige: |
    On applique à chaque fois le théorème 3 : on cherche une primitive $F$, puis on calcule $F(b)-F(a)$.

    **a)** $\displaystyle\int_{0}^{2}\left(3x^{2}-2x+1\right)\mathrm{d}x =\left[x^{3}-x^{2}+x\right]_{0}^{2}=(8-4+2)-0=\boxed{6}$

    **b)** $\displaystyle\int_{1}^{3}(2x-5)\,\mathrm{d}x=\left[x^{2}-5x\right]_{1}^{3} =(9-15)-(1-5)=-6+4=\boxed{-2}$

    *L'intégrale est négative : c'est normal, la fonction $x\mapsto 2x-5$ est négative sur la plus grande partie de $[1\,;3]$.*

    **c)** $\displaystyle\int_{-1}^{1}\left(x^{3}+x\right)\mathrm{d}x =\left[\frac{x^{4}}{4}+\frac{x^{2}}{2}\right]_{-1}^{1} =\left(\frac{1}{4}+\frac{1}{2}\right)-\left(\frac{1}{4}+\frac{1}{2}\right)=\boxed{0}$

    *La fonction est impaire : les aires situées de part et d'autre de l'origine se compensent exactement.*

    **d)** $\displaystyle\int_{1}^{4}\frac{1}{\sqrt{x}}\,\mathrm{d}x =\left[2\sqrt{x}\right]_{1}^{4}=4-2=\boxed{2}$

    **e)** $\displaystyle\int_{1}^{2}\frac{1}{x^{2}}\,\mathrm{d}x =\left[-\frac{1}{x}\right]_{1}^{2}=-\frac{1}{2}+1=\boxed{\frac{1}{2}}$

    **f)** $\displaystyle\int_{0}^{1}\mathrm{e}^{x}\,\mathrm{d}x=\left[\mathrm{e}^{x}\right]_{0}^{1} =\mathrm{e}-1\approx\boxed{1{,}718}$

    **g)** $\displaystyle\int_{1}^{\mathrm{e}}\frac{1}{x}\,\mathrm{d}x=\left[\ln(x)\right]_{1}^{\mathrm{e}} =\ln(\mathrm{e})-\ln(1)=1-0=\boxed{1}$

    **h)** $\displaystyle\int_{0}^{1}\left(x^{3}-2x+3\right)\mathrm{d}x =\left[\frac{x^{4}}{4}-x^{2}+3x\right]_{0}^{1}=\frac{1}{4}-1+3=\boxed{\frac{9}{4}}$
- id: "t-06-17"
  feuille: "f-t-06"
  numero: 17
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Calculer les intégrales suivantes, en reconnaissant au préalable une forme composée.

    **a)** $\displaystyle\int_{0}^{1}2x\,\mathrm{e}^{x^{2}}\,\,\mathrm{d}x$

    **b)** $\displaystyle\int_{0}^{1}\dfrac{x}{x^{2}+1}\,\,\mathrm{d}x$

    **c)** $\displaystyle\int_{0}^{1}(2x+1)\left(x^{2}+x+1\right)^{2}\,\mathrm{d}x$

    **d)** $\displaystyle\int_{0}^{1}\mathrm{e}^{2x}\,\,\mathrm{d}x$

    **e)** $\displaystyle\int_{0}^{3}\dfrac{x}{\sqrt{x^{2}+16}}\,\,\mathrm{d}x$

    **f)** $\displaystyle\int_{1}^{2}\dfrac{1}{2x+1}\,\,\mathrm{d}x$

    **g)** $\displaystyle\int_{0}^{1}\dfrac{x+1}{x^{2}+2x+3}\,\,\mathrm{d}x$

    **h)** $\displaystyle\int_{0}^{1}\mathrm{e}^{-x}\,\,\mathrm{d}x$
  corrige: |
    **a)** Forme $u'\,\mathrm{e}^{u}$ avec $u(x)=x^{2}$ : 
    $$\int_{0}^{1}2x\,\mathrm{e}^{x^{2}}\,\mathrm{d}x=\left[\mathrm{e}^{x^{2}}\right]_{0}^{1} =\mathrm{e}^{1}-\mathrm{e}^{0}=\boxed{\mathrm{e}-1\approx 1{,}718}$$

    **b)** Forme $\dfrac{u'}{u}$ à un facteur $\dfrac{1}{2}$ près, avec $u(x)=x^{2}+1>0$ : 
    $$\int_{0}^{1}\frac{x}{x^{2}+1}\,\mathrm{d}x =\left[\frac{1}{2}\ln\left(x^{2}+1\right)\right]_{0}^{1} =\frac{1}{2}\ln(2)-\frac{1}{2}\ln(1)=\boxed{\frac{\ln(2)}{2}\approx 0{,}347}$$

    **c)** Forme $u'\,u^{2}$ avec $u(x)=x^{2}+x+1$ : 
    $$\int_{0}^{1}(2x+1)\left(x^{2}+x+1\right)^{2}\mathrm{d}x =\left[\frac{\left(x^{2}+x+1\right)^{3}}{3}\right]_{0}^{1} =\frac{27}{3}-\frac{1}{3}=\boxed{\frac{26}{3}}$$

    **d)** $\displaystyle\int_{0}^{1}\mathrm{e}^{2x}\,\mathrm{d}x =\left[\frac{\mathrm{e}^{2x}}{2}\right]_{0}^{1}=\frac{\mathrm{e}^{2}}{2}-\frac{1}{2} =\boxed{\frac{\mathrm{e}^{2}-1}{2}\approx 3{,}195}$

    **e)** Forme $\dfrac{u'}{\sqrt{u}}$ à un facteur $\dfrac{1}{2}$ près, avec $u(x)=x^{2}+16$ : 
    $$\int_{0}^{3}\frac{x}{\sqrt{x^{2}+16}}\,\mathrm{d}x =\left[\sqrt{x^{2}+16}\right]_{0}^{3}=\sqrt{25}-\sqrt{16}=5-4=\boxed{1}$$

    **f)** $\displaystyle\int_{1}^{2}\frac{1}{2x+1}\,\mathrm{d}x =\left[\frac{1}{2}\ln(2x+1)\right]_{1}^{2}=\frac{1}{2}\left(\ln(5)-\ln(3)\right) =\boxed{\frac{1}{2}\ln\!\left(\frac{5}{3}\right)\approx 0{,}255}$

    **g)** Avec $u(x)=x^{2}+2x+3=(x+1)^{2}+2>0$ et $u'(x)=2x+2$ : 
    $$\int_{0}^{1}\frac{x+1}{x^{2}+2x+3}\,\mathrm{d}x =\left[\frac{1}{2}\ln\left(x^{2}+2x+3\right)\right]_{0}^{1} =\frac{1}{2}\left(\ln(6)-\ln(3)\right)=\boxed{\frac{\ln(2)}{2}\approx 0{,}347}$$

    **h)** $\displaystyle\int_{0}^{1}\mathrm{e}^{-x}\,\mathrm{d}x=\left[-\mathrm{e}^{-x}\right]_{0}^{1} =-\mathrm{e}^{-1}+1=\boxed{1-\frac{1}{\mathrm{e}}\approx 0{,}632}$
- id: "t-06-18"
  feuille: "f-t-06"
  numero: 18
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale, aire, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **1.** Déterminer le réel $a>0$ tel que $\displaystyle\int_{0}^{a}(2x+1)\,\,\mathrm{d}x=6$.

    **2.** Déterminer le réel $a>1$ tel que $\displaystyle\int_{1}^{a}\dfrac{1}{x}\,\,\mathrm{d}x=2$.

    **3.** Déterminer le réel $m$ tel que $\displaystyle\int_{0}^{1}\left(x^{2}+m\right)\,\mathrm{d}x=2$.

    **4.** Soit $\mathcal{C}$ la courbe d'équation $y=\dfrac{1}{x^{2}}$. Déterminer le réel $b>1$ tel que l'aire du domaine situé sous $\mathcal{C}$ entre les droites d'équations $x=1$ et $x=b$ vaille $\dfrac{1}{2}$ unité d'aire.

    **5.** Existe-t-il un réel $a$ tel que $\displaystyle\int_{0}^{a}\mathrm{e}^{x}\,\,\mathrm{d}x=\dfrac{1}{2}$ ? Si oui, le déterminer.
  corrige: |
    **1.** $\displaystyle\int_{0}^{a}(2x+1)\,\mathrm{d}x=\left[x^{2}+x\right]_{0}^{a}=a^{2}+a$. On résout donc : 
    $$a^{2}+a=6 \iff a^{2}+a-6=0$$
     Le discriminant vaut $\Delta=1+24=25$, d'où $a=\dfrac{-1-5}{2}=-3$ ou $a=\dfrac{-1+5}{2}=2$. Comme $a>0$ : 
    $$\boxed{a=2}$$

    **2.** $\displaystyle\int_{1}^{a}\frac{1}{x}\,\mathrm{d}x=\left[\ln(x)\right]_{1}^{a}=\ln(a)$. On résout $\ln(a)=2$, soit : 
    $$\boxed{a=\mathrm{e}^{2}\approx 7{,}389}$$

    **3.** $\displaystyle\int_{0}^{1}\left(x^{2}+m\right)\mathrm{d}x =\left[\frac{x^{3}}{3}+mx\right]_{0}^{1}=\frac{1}{3}+m$. On résout $\dfrac{1}{3}+m=2$ : 
    $$\boxed{m=\frac{5}{3}}$$

    **4.** La fonction $x\mapsto\dfrac{1}{x^{2}}$ est positive sur $[1\,;b]$, l'aire cherchée est donc l'intégrale : 
    $$\int_{1}^{b}\frac{1}{x^{2}}\,\mathrm{d}x=\left[-\frac{1}{x}\right]_{1}^{b} =-\frac{1}{b}+1=1-\frac{1}{b}$$
     On résout $1-\dfrac{1}{b}=\dfrac{1}{2}$, soit $\dfrac{1}{b}=\dfrac{1}{2}$ : 
    $$\boxed{b=2}$$

    **5.** $\displaystyle\int_{0}^{a}\mathrm{e}^{x}\,\mathrm{d}x=\left[\mathrm{e}^{x}\right]_{0}^{a}=\mathrm{e}^{a}-1$. On résout $\mathrm{e}^{a}-1=\dfrac{1}{2}$, soit $\mathrm{e}^{a}=\dfrac{3}{2}$ : 
    $$\boxed{a=\ln\!\left(\frac{3}{2}\right)\approx 0{,}405}$$
     Un tel réel existe donc, et il est unique puisque la fonction exponentielle est strictement croissante.
- id: "t-06-19"
  feuille: "f-t-06"
  numero: 19
  partie: "Propriétés de l'intégrale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [intégrale, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    On donne $\displaystyle\int_{0}^{2}f(x)\,\mathrm{d}x=5$ et $\displaystyle\int_{0}^{2}g(x)\,\mathrm{d}x=-3$, où $f$ et $g$ sont deux fonctions continues sur $[0\,;2]$.

    **1.** Calculer, sans connaître $f$ ni $g$ :

    **(a)** $\displaystyle\int_{0}^{2}\left(f+g\right)(x)\,\mathrm{d}x$

    **(b)** $\displaystyle\int_{0}^{2}3f(x)\,\mathrm{d}x$

    **(c)** $\displaystyle\int_{0}^{2}\left(2f(x)-g(x)\right)\mathrm{d}x$

    **(d)** $\displaystyle\int_{0}^{2}\left(f(x)+4g(x)\right)\mathrm{d}x$

    **(e)** $\displaystyle\int_{0}^{2}\left(f(x)+1\right)\mathrm{d}x$

    **(f)** $\displaystyle\int_{2}^{0}f(x)\,\mathrm{d}x$

    **2.** Calculer directement $\displaystyle\int_{0}^{1}\left(3\mathrm{e}^{x}-2x\right)\mathrm{d}x$.

    **3.** Peut-on calculer $\displaystyle\int_{0}^{2}f(x)\,g(x)\,\mathrm{d}x$ à partir des données de l'énoncé ? Justifier.
  corrige: |
    **1.** On utilise la linéarité de l'intégrale.

    **(a)** $\displaystyle\int_{0}^{2}\left(f+g\right)(x)\,\mathrm{d}x =\int_{0}^{2}f+\int_{0}^{2}g=5+(-3)=\boxed{2}$

    **(b)** $\displaystyle\int_{0}^{2}3f(x)\,\mathrm{d}x=3\int_{0}^{2}f=3\times 5=\boxed{15}$

    **(c)** $\displaystyle\int_{0}^{2}\left(2f(x)-g(x)\right)\mathrm{d}x =2\times 5-(-3)=10+3=\boxed{13}$

    **(d)** $\displaystyle\int_{0}^{2}\left(f(x)+4g(x)\right)\mathrm{d}x =5+4\times(-3)=5-12=\boxed{-7}$

    **(e)** $\displaystyle\int_{0}^{2}\left(f(x)+1\right)\mathrm{d}x =\int_{0}^{2}f+\int_{0}^{2}1\,\mathrm{d}x=5+\left[x\right]_{0}^{2}=5+2=\boxed{7}$

    **(f)** $\displaystyle\int_{2}^{0}f(x)\,\mathrm{d}x=-\int_{0}^{2}f(x)\,\mathrm{d}x =\boxed{-5}$

    Le piège de (e) est d'oublier que $\displaystyle\int_{0}^{2}1\,\mathrm{d}x$ ne vaut pas $1$ mais $2$ : c'est l'aire d'un rectangle de hauteur $1$ et de base $2$.

    **2.** Par linéarité, puis en primitivant chaque terme : 
    $$\int_{0}^{1}\left(3\mathrm{e}^{x}-2x\right)\mathrm{d}x=\left[3\mathrm{e}^{x}-x^{2}\right]_{0}^{1} =(3\mathrm{e}-1)-(3-0)=\boxed{3\mathrm{e}-4\approx 4{,}155}$$

    **3.** Non. La linéarité porte sur les **sommes** et les **multiples**, pas sur les produits : 
    $$\boxed{\int_{a}^{b}f(x)g(x)\,\mathrm{d}x\neq \left(\int_{a}^{b}f\right)\times\left(\int_{a}^{b}g\right) \text{ en général}}$$
     Un contre-exemple suffit à s'en convaincre : avec $f(x)=g(x)=x$ sur $[0\,;1]$, le membre de gauche vaut $\displaystyle\int_{0}^{1}x^{2}\,\mathrm{d}x=\frac{1}{3}$, tandis que celui de droite vaut $\dfrac{1}{2}\times\dfrac{1}{2}=\dfrac{1}{4}$.
- id: "t-06-20"
  feuille: "f-t-06"
  numero: 20
  partie: "Propriétés de l'intégrale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [intégrale]
  noeuds: [ar-riemann]
  notions: [riemann-integrable]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Soit $f$ continue sur $[0\,;3]$ telle que $\displaystyle\int_{0}^{3}f(x)\,\mathrm{d}x=7$ et $\displaystyle\int_{0}^{1}f(x)\,\mathrm{d}x=2$. Déterminer $\displaystyle\int_{1}^{3}f(x)\,\mathrm{d}x$, puis $\displaystyle\int_{3}^{1}f(x)\,\mathrm{d}x$.

    **2.** Soit $g$ continue sur $[-2\,;5]$ telle que $\displaystyle\int_{-2}^{0}g(x)\,\mathrm{d}x=4$ et $\displaystyle\int_{0}^{5}g(x)\,\mathrm{d}x=-1$. Déterminer $\displaystyle\int_{-2}^{5}g(x)\,\mathrm{d}x$.

    **3.** Calculer $\displaystyle\int_{0}^{2}|x-1|\,\mathrm{d}x$ en découpant l'intervalle en deux.

    **4.** Soit $h$ la fonction définie sur $[0\,;2]$ par $h(x)=x$ si $x\in[0\,;1]$ et $h(x)=2-x$ si $x\in\left]1\,;2\right]$. Calculer $\displaystyle\int_{0}^{2}h(x)\,\mathrm{d}x$, puis retrouver ce résultat par une lecture géométrique.
  corrige: |
    **1.** La relation de Chasles donne $\displaystyle\int_{0}^{3}f=\int_{0}^{1}f+\int_{1}^{3}f$, d'où : 
    $$\int_{1}^{3}f(x)\,\mathrm{d}x=7-2=\boxed{5} \qquad \text{puis} \qquad \int_{3}^{1}f(x)\,\mathrm{d}x=\boxed{-5}$$

    **2.** De même : $\displaystyle\int_{-2}^{5}g=\int_{-2}^{0}g+\int_{0}^{5}g=4+(-1)=\boxed{3}$

    **3.** On sépare l'intervalle en $x=1$, là où l'expression change de forme. Pour $x\in[0\,;1]$, $|x-1|=1-x$ ; pour $x\in[1\,;2]$, $|x-1|=x-1$. 
    $$\begin{aligned} \int_{0}^{2}|x-1|\,\mathrm{d}x &= \int_{0}^{1}(1-x)\,\mathrm{d}x+\int_{1}^{2}(x-1)\,\mathrm{d}x \\ &= \left[x-\frac{x^{2}}{2}\right]_{0}^{1}+\left[\frac{x^{2}}{2}-x\right]_{1}^{2} \\ &= \left(1-\frac{1}{2}\right)+\left((2-2)-\left(\frac{1}{2}-1\right)\right) = \frac{1}{2}+\frac{1}{2}=\boxed{1} \end{aligned}$$

    **4.** Même découpage : 
    $$\int_{0}^{2}h(x)\,\mathrm{d}x=\int_{0}^{1}x\,\mathrm{d}x+\int_{1}^{2}(2-x)\,\mathrm{d}x =\left[\frac{x^{2}}{2}\right]_{0}^{1}+\left[2x-\frac{x^{2}}{2}\right]_{1}^{2} =\frac{1}{2}+\left(2-\frac{3}{2}\right)=\boxed{1}$$
     Géométriquement, la courbe de $h$ est formée de deux segments : le domaine sous la courbe est un triangle de base $2$ et de hauteur $1$, dont l'aire vaut bien $\dfrac{2\times 1}{2}=1$.
- id: "t-06-21"
  feuille: "f-t-06"
  numero: 21
  partie: "Propriétés de l'intégrale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [intégrale, exponentielle, logarithme]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle, logarithme]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Déterminer le signe de chacune des intégrales suivantes **sans la calculer**, en justifiant.

    **a)** $\displaystyle\int_{1}^{2}x^{3}\,\mathrm{d}x$

    **b)** $\displaystyle\int_{-2}^{-1}x^{3}\,\mathrm{d}x$

    **c)** $\displaystyle\int_{0}^{1}\mathrm{e}^{-x}\,\mathrm{d}x$

    **d)** $\displaystyle\int_{1}^{2}(1-x)\,\mathrm{d}x$

    **e)** $\displaystyle\int_{2}^{1}x^{2}\,\mathrm{d}x$

    **f)** $\displaystyle\int_{-1}^{1}x\,\mathrm{d}x$

    **g)** $\displaystyle\int_{0}^{1}\left(x^{2}-x\right)\mathrm{d}x$

    **h)** $\displaystyle\int_{0}^{\frac{1}{2}}\ln(x+1)\,\mathrm{d}x$

    Deux pièges sont dissimulés dans cette liste : l'un concerne l'ordre des bornes, l'autre une intégrale nulle. À vous de les repérer.
  corrige: |
    On rappelle que si $a\leqslant b$ et $f\geqslant 0$ sur $[a\,;b]$, alors $\displaystyle\int_{a}^{b}f\geqslant 0$. Il faut donc surveiller *deux* choses : le signe de la fonction, et l'ordre des bornes.

    **a)** $x^{3}>0$ sur $[1\,;2]$ et $1<2$ : $\boxed{\text{intégrale positive}}$

    **b)** $x^{3}<0$ sur $[-2\,;-1]$ et $-2<-1$ : $\boxed{\text{intégrale négative}}$

    **c)** $\mathrm{e}^{-x}>0$ partout et $0<1$ : $\boxed{\text{intégrale positive}}$

    **d)** $1-x<0$ sur $]1\,;2]$ et $1<2$ : $\boxed{\text{intégrale négative}}$

    **e)** $x^{2}>0$ sur $[1\,;2]$, mais **les bornes sont dans l'ordre décroissant** : $\displaystyle\int_{2}^{1}x^{2}\,\mathrm{d}x=-\int_{1}^{2}x^{2}\,\mathrm{d}x$, donc $\boxed{\text{intégrale négative}}$ *(premier piège)*

    **f)** La fonction $x\mapsto x$ est impaire et l'intervalle $[-1\,;1]$ est centré en $0$ : les aires situées de part et d'autre de l'origine se compensent exactement. $\boxed{\text{intégrale nulle}}$ *(second piège)*

    **g)** Sur $[0\,;1]$, on a $x^{2}\leqslant x$, donc $x^{2}-x\leqslant 0$ : $\boxed{\text{intégrale négative}}$

    **h)** Pour $x\in\left[0\,;\frac{1}{2}\right]$, $x+1\geqslant 1$ donc $\ln(x+1)\geqslant 0$ : $\boxed{\text{intégrale positive}}$
- id: "t-06-22"
  feuille: "f-t-06"
  numero: 22
  partie: "Propriétés de l'intégrale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégrale, encadrement, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Comparer $\displaystyle\int_{0}^{1}x^{2}\,\mathrm{d}x$ et $\displaystyle\int_{0}^{1}x^{3}\,\mathrm{d}x$ sans les calculer, puis vérifier par le calcul.

    **2.** Reprendre la question précédente sur l'intervalle $[1\,;2]$. Que constate-t-on ?

    **3.** Démontrer que pour tout $x$ de $[0\,;1]$, $1\leqslant\mathrm{e}^{x^{2}}\leqslant\mathrm{e}^{x}$. En déduire un encadrement de $\displaystyle\int_{0}^{1}\mathrm{e}^{x^{2}}\,\mathrm{d}x$.

    **4.** Démontrer que $\dfrac{1}{2}\leqslant\displaystyle\int_{1}^{2}\dfrac{1}{x}\,\mathrm{d}x \leqslant 1$, puis vérifier cet encadrement en calculant l'intégrale.
  corrige: |
    **1.** Pour tout $x$ de $[0\,;1]$, on a $0\leqslant x\leqslant 1$, donc en multipliant par $x^{2}\geqslant 0$ : $x^{3}\leqslant x^{2}$. La conservation de l'ordre donne alors : 
    $$\boxed{\int_{0}^{1}x^{3}\,\mathrm{d}x\leqslant\int_{0}^{1}x^{2}\,\mathrm{d}x}$$
     Vérification : $\displaystyle\int_{0}^{1}x^{3}=\left[\frac{x^{4}}{4}\right]_{0}^{1} =\frac{1}{4}$ et $\displaystyle\int_{0}^{1}x^{2}=\frac{1}{3}$. On a bien $\dfrac{1}{4}\leqslant\dfrac{1}{3}$.

    **2.** Sur $[1\,;2]$, l'inégalité **change de sens** : $x\geqslant 1$ donne $x^{3}\geqslant x^{2}$, d'où : 
    $$\boxed{\int_{1}^{2}x^{2}\,\mathrm{d}x\leqslant\int_{1}^{2}x^{3}\,\mathrm{d}x}$$
     Vérification : $\displaystyle\int_{1}^{2}x^{2}=\frac{8}{3}-\frac{1}{3}=\frac{7}{3} \approx 2{,}33$ et $\displaystyle\int_{1}^{2}x^{3}=4-\frac{1}{4}=\frac{15}{4}=3{,}75$. On constate que la comparaison de deux fonctions dépend entièrement de l'intervalle considéré : il ne faut jamais l'affirmer sans préciser où.

    **3.** Pour $x\in[0\,;1]$, on a $0\leqslant x^{2}\leqslant x$. La fonction exponentielle étant strictement croissante : 
    $$\mathrm{e}^{0}\leqslant\mathrm{e}^{x^{2}}\leqslant\mathrm{e}^{x} \qquad \text{soit} \qquad 1\leqslant\mathrm{e}^{x^{2}}\leqslant\mathrm{e}^{x}$$
     En intégrant sur $[0\,;1]$ (les bornes sont dans le bon ordre) : 
    $$\int_{0}^{1}1\,\mathrm{d}x\leqslant\int_{0}^{1}\mathrm{e}^{x^{2}}\,\mathrm{d}x \leqslant\int_{0}^{1}\mathrm{e}^{x}\,\mathrm{d}x$$

    $$\boxed{1\leqslant\int_{0}^{1}\mathrm{e}^{x^{2}}\,\mathrm{d}x\leqslant\mathrm{e}-1\approx 1{,}718}$$
     *On notera qu'aucune primitive de $x\mapsto\mathrm{e}^{x^{2}}$ n'est connue : la comparaison est ici le seul outil disponible.*

    **4.** Pour $x\in[1\,;2]$, on a $1\leqslant x\leqslant 2$, donc en passant aux inverses (ce qui renverse l'ordre) : $\dfrac{1}{2}\leqslant\dfrac{1}{x}\leqslant 1$. En intégrant sur $[1\,;2]$, intervalle de longueur $1$ : 
    $$\boxed{\frac{1}{2}\leqslant\int_{1}^{2}\frac{1}{x}\,\mathrm{d}x\leqslant 1}$$
     Or $\displaystyle\int_{1}^{2}\frac{1}{x}\,\mathrm{d}x=\left[\ln(x)\right]_{1}^{2} =\ln(2)\approx 0{,}693$, qui appartient bien à $\left[\frac{1}{2}\,;1\right]$.
- id: "t-06-23"
  feuille: "f-t-06"
  numero: 23
  partie: "Propriétés de l'intégrale"
  etoiles: 2
