    *La constante d'Euler.* On reprend les notations de l'exercice 37, où $H_{n}=1+\dfrac{1}{2}+\dots+\dfrac{1}{n}$. Montrer que la suite $\left(H_{n}-\ln(n)\right)_{n\geqslant 1}$ est décroissante. En déduire que cette suite est convergente.
  corrige: |
    Notons $u_{n}=H_{n}-\ln(n)$ pour $n\geqslant 1$. Alors 
    $$u_{n+1}-u_{n}=\frac{1}{n+1}-\left(\ln(n+1)-\ln(n)\right)$$
     D'après la question 3 de l'exercice 37 appliquée à $k=n$, on a $\frac{1}{n+1}\leqslant\ln(n+1)-\ln(n)$, donc $u_{n+1}-u_{n}\leqslant 0$. 
    $$\boxed{\text{La suite } (u_{n}) \text{ est décroissante.}}$$
     Par ailleurs, la question 4 de l'exercice 37 donne $H_{n}\geqslant\ln(n+1)>\ln(n)$, donc $u_{n}>0$ pour tout $n\geqslant 1$. La suite $(u_{n})$ est décroissante et minorée par $0$ : d'après le théorème de convergence monotone, elle converge. 
    $$\boxed{\text{La suite } \left(H_{n}-\ln(n)\right) \text{ converge, vers une limite comprise entre } 0 \text{ et } u_{1}=1.}$$

    ![Figure](documents/figures/f983f0ab066b1bac.svg)

    Sur cette figure, dont l'axe vertical commence à $0{,}5$, on voit les termes $u_{1}$ à $u_{12}$ décroître de plus en plus lentement vers leur limite, tracée en pointillés.

    Cette limite s'appelle la *constante d'Euler* et se note $\gamma$ ; elle vaut environ $0{,}577\,2$. On ne sait toujours pas si elle est rationnelle.

    *Remarque.* Le résultat se lit $H_{n}\approx\ln(n)+\gamma$ pour $n$ grand, ce qui est bien plus précis que l'encadrement de l'exercice 37. Pour $n=100$, on obtient $5{,}182$, pour une valeur exacte $H_{100}\approx 5{,}187$. Pour le rang $N$ à partir duquel $H_{N}>10$, cette approximation suggère $\ln(N)>10-\gamma$, soit $N>\mathrm{e}^{10-\gamma}\approx 12\,367$ : c'est exactement la valeur indiquée dans le corrigé de l'exercice 37, que l'encadrement par $\ln(n+1)$ et $1+\ln(n)$ ne permettait de situer qu'entre $8\,104$ et $22\,026$.
