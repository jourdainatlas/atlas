- id: "t-06-01"
  feuille: "f-t-06"
  numero: 1
  partie: "Primitives d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitive, exponentielle, logarithme]
  noeuds: [ar-tfa]
  notions: [exponentielle, logarithme]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, vérifier si la fonction $F$ est une primitive de la fonction $f$ sur l'intervalle $I$ indiqué. *L'une des six affirmations est fausse : on la corrigera.*

    **1.** $F(x)=x^{3}-2x+1$ et $f(x)=3x^{2}-2$ sur $I=\mathbb{R}$.

    **2.** $F(x)=(2x-1)\mathrm{e}^{x}$ et $f(x)=(2x+1)\mathrm{e}^{x}$ sur $I=\mathbb{R}$.

    **3.** $F(x)=x\ln(x)-x$ et $f(x)=\ln(x)$ sur $I=\left]0\,;+\infty\right[$.

    **4.** $F(x)=\sqrt{x^{2}+1}$ et $f(x)=\dfrac{x}{\sqrt{x^{2}+1}}$ sur $I=\mathbb{R}$.

    **5.** $F(x)=\ln\left(x^{2}+3\right)$ et $f(x)=\dfrac{2x}{x^{2}+3}$ sur $I=\mathbb{R}$.

    **6.** $F(x)=\dfrac{1}{x+1}$ et $f(x)=\dfrac{1}{(x+1)^{2}}$ sur $I=\left]-1\,;+\infty\right[$.
  corrige: |
    Il s'agit à chaque fois de dériver $F$ et de comparer le résultat à $f$.

    **1.** $F(x)=x^{3}-2x+1$ donne $F'(x)=3x^{2}-2=f(x)$ : 
    $$\boxed{F \text{ est bien une primitive de } f \text{ sur } \mathbb{R}}$$

    **2.** $F$ est un produit. On pose :

    $$\left\{\begin{array}{l} u(x)=2x-1 \\[2mm] v(x)=\mathrm{e}^{x} \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=2 \\[2mm] v'(x)=\mathrm{e}^{x} \end{array}\right.$$
     d'où : 
    $$F'(x)=2\mathrm{e}^{x}+(2x-1)\mathrm{e}^{x}=(2+2x-1)\mathrm{e}^{x}=(2x+1)\mathrm{e}^{x}=f(x)$$

    $$\boxed{F \text{ est bien une primitive de } f \text{ sur } \mathbb{R}}$$

    **3.** Là encore un produit, auquel s'ajoute $-x$ :

    $$\left\{\begin{array}{l} u(x)=x \\[2mm] v(x)=\ln(x) \end{array}\right. \qquad\text{ce qui donne :}\qquad \left\{\begin{array}{l} u'(x)=1 \\[2mm] v'(x)=\dfrac{1}{x} \end{array}\right.$$

    $$F'(x)=1\times\ln(x)+x\times\frac{1}{x}-1=\ln(x)+1-1=\ln(x)=f(x)$$

    $$\boxed{F \text{ est bien une primitive de } f \text{ sur } \left]0\,;+\infty\right[}$$

    **4.** $F$ est de la forme $\sqrt{u}$ avec $u(x)=x^{2}+1$, donc $F'=\dfrac{u'}{2\sqrt{u}}$ : 
    $$F'(x)=\frac{2x}{2\sqrt{x^{2}+1}}=\frac{x}{\sqrt{x^{2}+1}}=f(x)$$

    $$\boxed{F \text{ est bien une primitive de } f \text{ sur } \mathbb{R}}$$
     On notera que $x^{2}+1$ ne s'annule jamais : $F$ est bien dérivable sur $\mathbb{R}$ tout entier.

    **5.** $F$ est de la forme $\ln(u)$ avec $u(x)=x^{2}+3>0$, donc $F'=\dfrac{u'}{u}$ : 
    $$F'(x)=\frac{2x}{x^{2}+3}=f(x) \qquad \boxed{F \text{ est bien une primitive de } f \text{ sur } \mathbb{R}}$$

    **6.** $F$ est de la forme $\dfrac{1}{u}$ avec $u(x)=x+1$, donc $F'=-\dfrac{u'}{u^{2}}$ : 
    $$F'(x)=-\frac{1}{(x+1)^{2}}\neq f(x)$$

    $$\boxed{\text{C'est l'affirmation fausse : il manque un signe }-}$$
     Pour la corriger, deux possibilités : soit $F(x)=-\dfrac{1}{x+1}$ est une primitive de $f(x)=\dfrac{1}{(x+1)^{2}}$, soit $F(x)=\dfrac{1}{x+1}$ est une primitive de $f(x)=-\dfrac{1}{(x+1)^{2}}$.
- id: "t-06-02"
  feuille: "f-t-06"
  numero: 2
  partie: "Primitives d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitive]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer une primitive de chacune des fonctions suivantes sur $\mathbb{R}$.

    **a)** $f(x)=4x^{3}-6x+5$

    **b)** $f(x)=5$

    **c)** $f(x)=x^{5}-\dfrac{x^{2}}{3}+2$

    **d)** $f(x)=(2x-3)(x+1)$

    **e)** $f(x)=(x-1)^{2}$

    **f)** $f(x)=x\left(3x^{2}-4\right)$

    Pour d), e) et f), on commencera par développer : le tableau des primitives ne s'applique qu'à une somme de termes de la forme $x^{n}$.
  corrige: |
    On applique le tableau terme à terme : une primitive de $x^{n}$ est $\dfrac{x^{n+1}}{n+1}$.

    **a)** $\boxed{F(x)=x^{4}-3x^{2}+5x}$

    **b)** $\boxed{F(x)=5x}$

    **c)** $\boxed{F(x)=\dfrac{x^{6}}{6}-\dfrac{x^{3}}{9}+2x}$

    **d)** $f(x)=2x^{2}-x-3$, donc : 
    $$\boxed{F(x)=\dfrac{2x^{3}}{3}-\dfrac{x^{2}}{2}-3x}$$

    **e)** $f(x)=x^{2}-2x+1$, donc : 
    $$\boxed{F(x)=\dfrac{x^{3}}{3}-x^{2}+x}$$

    **f)** $f(x)=3x^{3}-4x$, donc : 
    $$\boxed{F(x)=\dfrac{3x^{4}}{4}-2x^{2}}$$

    On remarquera pour c) que $\dfrac{1}{3}\times\dfrac{x^{3}}{3}=\dfrac{x^{3}}{9}$ : le coefficient $\dfrac{1}{3}$ se conserve, et se multiplie au $\dfrac{1}{3}$ venant de l'exposant. Chacune de ces réponses peut bien sûr être augmentée d'une constante.
- id: "t-06-03"
  feuille: "f-t-06"
  numero: 3
  partie: "Primitives d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitive, exponentielle]
  noeuds: [ar-tfa]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer une primitive de chacune des fonctions suivantes sur $\left]0\,;+\infty\right[$.

    **a)** $f(x)=\dfrac{1}{x^{2}}$

    **b)** $f(x)=\dfrac{1}{\sqrt{x}}$

    **c)** $f(x)=\mathrm{e}^{x}$

    **d)** $f(x)=\dfrac{1}{x}$

    **e)** $f(x)=3\mathrm{e}^{x}-\dfrac{2}{x}+\dfrac{1}{x^{2}}$

    **f)** $f(x)=\dfrac{2}{\sqrt{x}}+5x$

    **g)** $f(x)=\dfrac{1}{x^{3}}$

    **h)** $f(x)=\dfrac{x^{2}+1}{x^{2}}$
  corrige: |
    **a)** $\boxed{F(x)=-\dfrac{1}{x}}$

    **b)** $\boxed{F(x)=2\sqrt{x}}$

    **c)** $\boxed{F(x)=\mathrm{e}^{x}}$

    **d)** $\boxed{F(x)=\ln(x)}$

    **e)** $\boxed{F(x)=3\mathrm{e}^{x}-2\ln(x)-\dfrac{1}{x}}$

    **f)** $\boxed{F(x)=4\sqrt{x}+\dfrac{5x^{2}}{2}}$

    **g)** $f(x)=x^{-3}$, donc $F(x)=\dfrac{x^{-2}}{-2}$ : 
    $$\boxed{F(x)=-\dfrac{1}{2x^{2}}}$$

    **h)** $f(x)=\dfrac{x^{2}}{x^{2}}+\dfrac{1}{x^{2}}=1+\dfrac{1}{x^{2}}$, donc : 
    $$\boxed{F(x)=x-\dfrac{1}{x}}$$

    Le piège de la question h) est de vouloir intégrer le numérateur et le dénominateur séparément : il faut d'abord **séparer la fraction** en deux termes.
- id: "t-06-04"
  feuille: "f-t-06"
  numero: 4
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitive]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Chacune des fonctions suivantes est de la forme $u'\,u^{n}$, éventuellement à un facteur constant près. Déterminer une primitive sur $\mathbb{R}$.

    **a)** $f(x)=2x\left(x^{2}+1\right)^{3}$

    **b)** $f(x)=(2x+3)\left(x^{2}+3x\right)^{5}$

    **c)** $f(x)=3(3x-1)^{4}$

    **d)** $f(x)=x\left(x^{2}-4\right)^{2}$

    **e)** $f(x)=(4x-1)^{3}$

    **f)** $f(x)=(2x+1)\left(x^{2}+x+1\right)^{2}$
  corrige: |
    Une primitive de $u'\,u^{n}$ est $\dfrac{u^{n+1}}{n+1}$. Toute la difficulté est de vérifier que le facteur placé devant est bien $u'$, et de rétablir la constante manquante sinon.

    **a)** $u(x)=x^{2}+1$ et $u'(x)=2x$ : la forme est exactement $u'\,u^{3}$. 
    $$\boxed{F(x)=\frac{\left(x^{2}+1\right)^{4}}{4}}$$

    **b)** $u(x)=x^{2}+3x$ et $u'(x)=2x+3$ : la forme est exactement $u'\,u^{5}$. 
    $$\boxed{F(x)=\frac{\left(x^{2}+3x\right)^{6}}{6}}$$

    **c)** $u(x)=3x-1$ et $u'(x)=3$ : la forme est exactement $u'\,u^{4}$. 
    $$\boxed{F(x)=\frac{(3x-1)^{5}}{5}}$$

    **d)** $u(x)=x^{2}-4$ et $u'(x)=2x$. Or le facteur présent est $x$, soit $\dfrac{1}{2}u'$ : 
    $$f(x)=\frac{1}{2}\times 2x\left(x^{2}-4\right)^{2} \qquad \text{d'où} \qquad \boxed{F(x)=\frac{1}{2}\times\frac{\left(x^{2}-4\right)^{3}}{3} =\frac{\left(x^{2}-4\right)^{3}}{6}}$$

    **e)** $u(x)=4x-1$ et $u'(x)=4$. Le facteur $4$ est absent, on le fait apparaître : 
    $$f(x)=\frac{1}{4}\times 4(4x-1)^{3} \qquad \text{d'où} \qquad \boxed{F(x)=\frac{(4x-1)^{4}}{16}}$$

    **f)** $u(x)=x^{2}+x+1$ et $u'(x)=2x+1$ : la forme est exactement $u'\,u^{2}$. 
    $$\boxed{F(x)=\frac{\left(x^{2}+x+1\right)^{3}}{3}}$$
- id: "t-06-05"
  feuille: "f-t-06"
  numero: 5
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitive]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer une primitive de chacune des fonctions suivantes, sur un intervalle où elle est définie que l'on précisera. On reconnaîtra une forme $\dfrac{u'}{u^{2}}$ ou $\dfrac{u'}{\sqrt{u}}$.

    **a)** $f(x)=\dfrac{2x}{\left(x^{2}+1\right)^{2}}$

    **b)** $f(x)=\dfrac{1}{(x+2)^{2}}$

    **c)** $f(x)=\dfrac{x}{\sqrt{x^{2}+4}}$

    **d)** $f(x)=\dfrac{3}{(3x-5)^{2}}$

    **e)** $f(x)=\dfrac{1}{\sqrt{2x+1}}$

    **f)** $f(x)=\dfrac{2x+2}{\left(x^{2}+2x+3\right)^{2}}$
  corrige: |
    On rappelle qu'une primitive de $\dfrac{u'}{u^{2}}$ est $-\dfrac{1}{u}$, et qu'une primitive de $\dfrac{u'}{\sqrt{u}}$ est $2\sqrt{u}$.

    **a)** $u(x)=x^{2}+1$, $u'(x)=2x$, et $u$ ne s'annule pas sur $\mathbb{R}$ : 
    $$\boxed{F(x)=-\frac{1}{x^{2}+1} \quad \text{sur } \mathbb{R}}$$

    **b)** $u(x)=x+2$, $u'(x)=1$, avec $u\neq 0$ pour $x\neq -2$ : 
    $$\boxed{F(x)=-\frac{1}{x+2} \quad \text{sur } \left]-2\,;+\infty\right[}$$

    **c)** $u(x)=x^{2}+4>0$ et $u'(x)=2x$. Le facteur présent est $\dfrac{1}{2}u'$ : 
    $$f(x)=\frac{1}{2}\times\frac{2x}{\sqrt{x^{2}+4}} \qquad \text{d'où} \qquad \boxed{F(x)=\frac{1}{2}\times 2\sqrt{x^{2}+4}=\sqrt{x^{2}+4} \quad \text{sur } \mathbb{R}}$$

    **d)** $u(x)=3x-5$ et $u'(x)=3$ : la forme est exacte. 
    $$\boxed{F(x)=-\frac{1}{3x-5} \quad \text{sur } \left]\frac{5}{3}\,;+\infty\right[}$$

    **e)** $u(x)=2x+1$ et $u'(x)=2$. On fait apparaître le facteur $2$ : 
    $$f(x)=\frac{1}{2}\times\frac{2}{\sqrt{2x+1}} \qquad \text{d'où} \qquad \boxed{F(x)=\sqrt{2x+1} \quad \text{sur } \left]-\frac{1}{2}\,;+\infty\right[}$$

    **f)** $u(x)=x^{2}+2x+3$ et $u'(x)=2x+2$ : la forme est exacte. De plus $x^{2}+2x+3=(x+1)^{2}+2>0$, donc $u$ ne s'annule pas. 
    $$\boxed{F(x)=-\frac{1}{x^{2}+2x+3} \quad \text{sur } \mathbb{R}}$$
- id: "t-06-06"
  feuille: "f-t-06"
  numero: 6
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [primitive, exponentielle, logarithme]
  noeuds: [ar-tfa]
  notions: [exponentielle, logarithme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Même consigne, en reconnaissant cette fois une forme $u'\,\mathrm{e}^{u}$ ou $\dfrac{u'}{u}$.

    **a)** $f(x)=2x\,\mathrm{e}^{x^{2}}$

    **b)** $f(x)=\mathrm{e}^{3x}$

    **c)** $f(x)=\mathrm{e}^{-x}$

    **d)** $f(x)=\dfrac{2x+1}{x^{2}+x+5}$

    **e)** $f(x)=\dfrac{1}{2x+1}$

    **f)** $f(x)=x\,\mathrm{e}^{x^{2}+1}$

    **g)** $f(x)=\dfrac{\mathrm{e}^{x}}{\mathrm{e}^{x}+1}$

    **h)** $f(x)=\dfrac{\ln(x)}{x}$

    Pour d), on justifiera au préalable que le dénominateur est strictement positif sur $\mathbb{R}$.
  corrige: |
    Une primitive de $u'\,\mathrm{e}^{u}$ est $\mathrm{e}^{u}$, et une primitive de $\dfrac{u'}{u}$ (avec $u>0$) est $\ln(u)$.

    **a)** $u(x)=x^{2}$, $u'(x)=2x$ : $\boxed{F(x)=\mathrm{e}^{x^{2}}}$

    **b)** $u(x)=3x$, $u'(x)=3$, absent : $f(x)=\dfrac{1}{3}\times 3\mathrm{e}^{3x}$, d'où $\boxed{F(x)=\dfrac{\mathrm{e}^{3x}}{3}}$

    **c)** $u(x)=-x$, $u'(x)=-1$ : $f(x)=-\left(-\mathrm{e}^{-x}\right)$, d'où $\boxed{F(x)=-\mathrm{e}^{-x}}$

    **d)** Le discriminant de $x^{2}+x+5$ vaut $\Delta=1-20=-19<0$ et le coefficient dominant est positif : ce trinôme est donc strictement positif sur $\mathbb{R}$. Avec $u(x)=x^{2}+x+5$ et $u'(x)=2x+1$ : 
    $$\boxed{F(x)=\ln\left(x^{2}+x+5\right) \quad \text{sur } \mathbb{R}}$$

    **e)** $u(x)=2x+1$, $u'(x)=2$ : $f(x)=\dfrac{1}{2}\times\dfrac{2}{2x+1}$, d'où $\boxed{F(x)=\dfrac{1}{2}\ln(2x+1) \quad \text{sur } \left]-\frac{1}{2}\,;+\infty\right[}$

    **f)** $u(x)=x^{2}+1$, $u'(x)=2x$ : $f(x)=\dfrac{1}{2}\times 2x\,\mathrm{e}^{x^{2}+1}$, d'où $\boxed{F(x)=\dfrac{1}{2}\mathrm{e}^{x^{2}+1}}$

    **g)** $u(x)=\mathrm{e}^{x}+1>0$ et $u'(x)=\mathrm{e}^{x}$ : la forme $\dfrac{u'}{u}$ est exacte. 
    $$\boxed{F(x)=\ln\left(\mathrm{e}^{x}+1\right) \quad \text{sur } \mathbb{R}}$$

    **h)** Ce n'est pas une des deux formes annoncées, mais la forme $u'\,u$ avec $u(x)=\ln(x)$ et $u'(x)=\dfrac{1}{x}$ : 
    $$\boxed{F(x)=\frac{\left(\ln(x)\right)^{2}}{2} \quad \text{sur } \left]0\,;+\infty\right[}$$
- id: "t-06-07"
  feuille: "f-t-06"
  numero: 7
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitive, exponentielle, logarithme]
  noeuds: [ar-tfa]
  notions: [exponentielle, logarithme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Cette fois la forme n'est pas annoncée : à chacun de la reconnaître. Déterminer une primitive de chacune des fonctions suivantes sur un intervalle que l'on précisera.

    **a)** $f(x)=\dfrac{2x-4}{x^{2}-4x+7}$

    **b)** $f(x)=4x^{3}\,\mathrm{e}^{x^{4}}$

    **c)** $f(x)=\dfrac{\left(\ln(x)\right)^{3}}{x}$

    **d)** $f(x)=\dfrac{3x^{2}+2}{\left(x^{3}+2x+1\right)^{2}}$

    **e)** $f(x)=\mathrm{e}^{x}\left(\mathrm{e}^{x}+1\right)^{3}$

    **f)** $f(x)=(2x+1)\,\mathrm{e}^{x^{2}+x}$

    **g)** $f(x)=\dfrac{x}{x^{2}+1}$

    **h)** $f(x)=\dfrac{6x}{\sqrt{3x^{2}+2}}$

    **i)** $f(x)=\dfrac{x+1}{x^{2}+2x+3}$

    **j)** $f(x)=\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{2x}+1}$
  corrige: |
    **a)** $x^{2}-4x+7=(x-2)^{2}+3>0$. Avec $u(x)=x^{2}-4x+7$ et $u'(x)=2x-4$, la forme $\dfrac{u'}{u}$ est exacte : 
    $$\boxed{F(x)=\ln\left(x^{2}-4x+7\right) \quad \text{sur } \mathbb{R}}$$

    **b)** $u(x)=x^{4}$ et $u'(x)=4x^{3}$, forme $u'\,\mathrm{e}^{u}$ : $\boxed{F(x)=\mathrm{e}^{x^{4}} \quad \text{sur } \mathbb{R}}$

    **c)** $u(x)=\ln(x)$ et $u'(x)=\dfrac{1}{x}$, forme $u'\,u^{3}$ : $\boxed{F(x)=\dfrac{\left(\ln(x)\right)^{4}}{4} \quad \text{sur } \left]0\,;+\infty\right[}$

    **d)** $u(x)=x^{3}+2x+1$ et $u'(x)=3x^{2}+2$, forme $\dfrac{u'}{u^{2}}$ : $\boxed{F(x)=-\dfrac{1}{x^{3}+2x+1} \quad \text{sur } \left]0\,;+\infty\right[}$

    **e)** $u(x)=\mathrm{e}^{x}+1$ et $u'(x)=\mathrm{e}^{x}$, forme $u'\,u^{3}$ : $\boxed{F(x)=\dfrac{\left(\mathrm{e}^{x}+1\right)^{4}}{4} \quad \text{sur } \mathbb{R}}$

    **f)** $u(x)=x^{2}+x$ et $u'(x)=2x+1$, forme $u'\,\mathrm{e}^{u}$ : $\boxed{F(x)=\mathrm{e}^{x^{2}+x} \quad \text{sur } \mathbb{R}}$

    **g)** $u(x)=x^{2}+1>0$ et $u'(x)=2x$ : le facteur présent est $\dfrac{1}{2}u'$. 
    $$\boxed{F(x)=\frac{1}{2}\ln\left(x^{2}+1\right) \quad \text{sur } \mathbb{R}}$$

    **h)** $u(x)=3x^{2}+2>0$ et $u'(x)=6x$, forme $\dfrac{u'}{\sqrt{u}}$ exacte : $\boxed{F(x)=2\sqrt{3x^{2}+2} \quad \text{sur } \mathbb{R}}$

    **i)** $x^{2}+2x+3=(x+1)^{2}+2>0$, $u'(x)=2x+2$ et le numérateur vaut $\dfrac{1}{2}u'$ : 
    $$\boxed{F(x)=\frac{1}{2}\ln\left(x^{2}+2x+3\right) \quad \text{sur } \mathbb{R}}$$

    **j)** $u(x)=\mathrm{e}^{2x}+1>0$ et $u'(x)=2\mathrm{e}^{2x}$ : le numérateur vaut $\dfrac{1}{2}u'$. 
    $$\boxed{F(x)=\frac{1}{2}\ln\left(\mathrm{e}^{2x}+1\right) \quad \text{sur } \mathbb{R}}$$

    Pour d), l'intervalle mérite attention : $x^{3}+2x+1$ s'annule une fois sur $\mathbb{R}$ (entre $-1$ et $0$), et la fonction n'est donc pas définie partout. Sur $\left]0\,;+\infty\right[$, le dénominateur est strictement positif, ce qui suffit.
- id: "t-06-08"
  feuille: "f-t-06"
  numero: 8
  partie: "Primitives d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitive, exponentielle]
  noeuds: [ar-tfa]
  notions: [exponentielle]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Dans chaque cas, déterminer la primitive $F$ de $f$ sur $I$ vérifiant la condition indiquée.

    **1.** $f(x)=2x-3$ sur $\mathbb{R}$, avec $F(1)=4$.

    **2.** $f(x)=3x^{2}+1$ sur $\mathbb{R}$, avec $F(0)=-2$.

    **3.** $f(x)=\mathrm{e}^{x}$ sur $\mathbb{R}$, avec $F(0)=3$.

    **4.** $f(x)=\dfrac{1}{x^{2}}$ sur $\left]0\,;+\infty\right[$, avec $F(1)=0$.

    **5.** $f(x)=\dfrac{1}{x}$ sur $\left]0\,;+\infty\right[$, avec $F(\mathrm{e})=1$.

    **6.** $f(x)=\dfrac{1}{\sqrt{x}}$ sur $\left]0\,;+\infty\right[$, avec $F(4)=5$.
  corrige: |
    On applique la méthode du cours : une primitive $F_{0}$, puis $F=F_{0}+k$, puis la condition.

    **1.** $F_{0}(x)=x^{2}-3x$, donc $F(x)=x^{2}-3x+k$. La condition $F(1)=4$ donne $1-3+k=4$, soit $k=6$ : 
    $$\boxed{F(x)=x^{2}-3x+6}$$

    **2.** $F_{0}(x)=x^{3}+x$, donc $F(x)=x^{3}+x+k$. La condition $F(0)=-2$ donne $k=-2$ : 
    $$\boxed{F(x)=x^{3}+x-2}$$

    **3.** $F(x)=\mathrm{e}^{x}+k$ et $F(0)=1+k=3$, soit $k=2$ : $\boxed{F(x)=\mathrm{e}^{x}+2}$

    **4.** $F(x)=-\dfrac{1}{x}+k$ et $F(1)=-1+k=0$, soit $k=1$ : $\boxed{F(x)=-\dfrac{1}{x}+1}$

    **5.** $F(x)=\ln(x)+k$ et $F(\mathrm{e})=\ln(\mathrm{e})+k=1+k=1$, soit $k=0$ : $\boxed{F(x)=\ln(x)}$

    **6.** $F(x)=2\sqrt{x}+k$ et $F(4)=2\times 2+k=4+k=5$, soit $k=1$ : $\boxed{F(x)=2\sqrt{x}+1}$
- id: "t-06-09"
  feuille: "f-t-06"
  numero: 9
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitive, exponentielle, logarithme]
  noeuds: [ar-tfa]
  notions: [exponentielle, logarithme]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Même consigne, avec des formes composées.

    **1.** $f(x)=2x\,\mathrm{e}^{x^{2}}$ sur $\mathbb{R}$, avec $F(0)=1$.

    **2.** $f(x)=\dfrac{2x+2}{x^{2}+2x+2}$ sur $\mathbb{R}$, avec $F(0)=\ln(2)$.

    **3.** $f(x)=\mathrm{e}^{-2x}$ sur $\mathbb{R}$, avec $F(0)=0$.

    **4.** $f(x)=\dfrac{x}{\sqrt{x^{2}+9}}$ sur $\mathbb{R}$, avec $F(0)=5$.

    **5.** $f(x)=3(3x+1)^{2}$ sur $\mathbb{R}$, avec $F(0)=2$.
  corrige: |
    **1.** $F_{0}(x)=\mathrm{e}^{x^{2}}$, donc $F(x)=\mathrm{e}^{x^{2}}+k$. Or $F(0)=\mathrm{e}^{0}+k=1+k=1$, d'où $k=0$ : 
    $$\boxed{F(x)=\mathrm{e}^{x^{2}}}$$

    **2.** $x^{2}+2x+2=(x+1)^{2}+1>0$, donc $F_{0}(x)=\ln\left(x^{2}+2x+2\right)$ et $F(x)=\ln\left(x^{2}+2x+2\right)+k$. Or $F(0)=\ln(2)+k=\ln(2)$, d'où $k=0$ : 
    $$\boxed{F(x)=\ln\left(x^{2}+2x+2\right)}$$

    **3.** $F_{0}(x)=-\dfrac{1}{2}\mathrm{e}^{-2x}$, donc $F(x)=-\dfrac{1}{2}\mathrm{e}^{-2x}+k$. Or $F(0)=-\dfrac{1}{2}+k=0$, d'où $k=\dfrac{1}{2}$ : 
    $$\boxed{F(x)=\frac{1-\mathrm{e}^{-2x}}{2}}$$

    **4.** $F_{0}(x)=\sqrt{x^{2}+9}$, donc $F(x)=\sqrt{x^{2}+9}+k$. Or $F(0)=\sqrt{9}+k=3+k=5$, d'où $k=2$ : 
    $$\boxed{F(x)=\sqrt{x^{2}+9}+2}$$

    **5.** $F_{0}(x)=\dfrac{(3x+1)^{3}}{3}$, donc $F(x)=\dfrac{(3x+1)^{3}}{3}+k$. Or $F(0)=\dfrac{1}{3}+k=2$, d'où $k=\dfrac{5}{3}$ : 
    $$\boxed{F(x)=\frac{(3x+1)^{3}}{3}+\frac{5}{3}}$$
- id: "t-06-10"
  feuille: "f-t-06"
  numero: 10
  partie: "Primitives d'une fonction"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [primitive]
  noeuds: [ar-tfa]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On a représenté ci-dessous, dans deux repères distincts, la courbe $\mathcal{C}_f$ d'une fonction $f$ définie sur $\mathbb{R}$ (à gauche), puis trois courbes $\mathcal{C}_{1}$, $\mathcal{C}_{2}$ et $\mathcal{C}_{3}$ (à droite).

    ![Figure](documents/figures/82135dd9c60797a8.svg)

    ![Figure](documents/figures/ca0ca15c61b2ad1f.svg)

    **1.** Justifier que les trois courbes de droite peuvent représenter trois primitives d'une même fonction.

    **2.** Déterminer graphiquement le signe de $f(x)$ selon les valeurs de $x$, puis vérifier que les variations lues à droite sont cohérentes avec ce signe.

    **3.** Ces trois courbes sont celles de primitives de $f$. Laquelle correspond à la primitive $F$ vérifiant $F(0)=0$ ? En notant $F$ cette primitive, exprimer les fonctions représentées par les deux autres courbes en fonction de $F$.

    **4.** On admet que $f(x)=x^{2}-1$. Déterminer par le calcul l'expression de $F$, puis vérifier la cohérence avec la lecture graphique en calculant $F(1)$ et $F(-1)$.
  corrige: |
    **1.** Les trois courbes se déduisent les unes des autres par **translation verticale** : elles ont exactement la même forme, décalée vers le haut ou vers le bas. Or deux primitives d'une même fonction diffèrent d'une constante, ce qui se traduit graphiquement par une telle translation. 
    $$\boxed{\text{Ces trois courbes peuvent donc représenter } F,\; F+k_{1} \text{ et } F+k_{2}}$$
     Elles ont d'ailleurs, pour chaque abscisse, des tangentes parallèles : c'est bien le signe que leurs dérivées coïncident.

    **2.** La courbe de gauche est une parabole coupant l'axe des abscisses en $-1$ et en $1$ : 
    $$\boxed{\begin{array}{l} f(x)>0 \text{ pour } x\in\left]-\infty\,;-1\right[\cup\left]1\,;+\infty\right[ \\[1mm] f(x)<0 \text{ pour } x\in\left]-1\,;1\right[ \\[1mm] f(x)=0 \text{ pour } x=-1 \text{ et } x=1 \end{array}}$$
     Les trois courbes de droite sont effectivement croissantes avant $-1$ et après $1$, et décroissantes entre $-1$ et $1$ : elles présentent un maximum local en $-1$ et un minimum local en $1$, exactement là où $f$ s'annule en changeant de signe. La cohérence est donc totale.

    **3.** La primitive cherchée est celle dont la courbe passe par l'origine : 
    $$\boxed{\text{c'est } \mathcal{C}_{2}}$$
     Les deux autres s'en déduisent par translation de $1{,}5$ vers le haut et vers le bas : 
    $$\boxed{\mathcal{C}_{1} \text{ représente } F+1{,}5 \qquad \text{et} \qquad \mathcal{C}_{3} \text{ représente } F-1{,}5}$$

    ![Figure](documents/figures/a4ad708067770104.svg)

    **4.** Une primitive de $f(x)=x^{2}-1$ est $F_{0}(x)=\dfrac{x^{3}}{3}-x$, donc $F(x)=\dfrac{x^{3}}{3}-x+k$. La condition $F(0)=0$ donne $k=0$ : 
    $$\boxed{F(x)=\frac{x^{3}}{3}-x}$$
     On calcule alors : 
    $$F(1)=\frac{1}{3}-1=\boxed{-\frac{2}{3}\approx -0{,}67} \qquad \text{et} \qquad F(-1)=-\frac{1}{3}+1=\boxed{\frac{2}{3}\approx 0{,}67}$$
     Ces deux valeurs sont bien celles que l'on lit sur $\mathcal{C}_{2}$ : un maximum local d'environ $0{,}7$ en $x=-1$, et un minimum local d'environ $-0{,}7$ en $x=1$.
- id: "t-06-11"
  feuille: "f-t-06"
  numero: 11
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [aire, encadrement, méthode des rectangles]
  noeuds: [ar-riemann]
  notions: [fonction-escalier]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On cherche à encadrer l'aire $\mathcal{A}$, en unités d'aire, du domaine situé sous la courbe de la fonction carré entre $0$ et $1$. On découpe pour cela $[0\,;1]$ en $n=4$ intervalles de même longueur.

    **1.** Faire une figure et y représenter les quatre rectangles inférieurs, puis les quatre rectangles supérieurs.

    **2.** Calculer la somme $s_{4}$ des aires des rectangles inférieurs, puis la somme $S_{4}$ des aires des rectangles supérieurs. On donnera des valeurs exactes.

    **3.** En déduire un encadrement de $\mathcal{A}$.

    **4.** Montrer que, pour un découpage en $n$ intervalles, la différence $S_{n}-s_{n}$ vaut $\dfrac{1}{n}$.

    *On pourra remarquer que les deux sommes ne diffèrent que par un terme à chaque extrémité.*

    **5.** En déduire le nombre minimal d'intervalles nécessaires pour obtenir un encadrement de $\mathcal{A}$ d'amplitude inférieure à $10^{-2}$.

    **6.** On admet que $\mathcal{A}=\dfrac{1}{3}$. Vérifier que l'encadrement de la question 3 est bien cohérent.
  corrige: |
    **1.** Les quatre intervalles sont $[0\,;0{,}25]$, $[0{,}25\,;0{,}5]$, $[0{,}5\,;0{,}75]$ et $[0{,}75\,;1]$. La fonction carré étant croissante sur $[0\,;1]$, la hauteur d'un rectangle inférieur se lit au **bord gauche**, celle d'un rectangle supérieur au **bord droit**.

    ![Figure](documents/figures/1484bdef6919eff9.svg)

    ![Figure](documents/figures/0b29acca615df52a.svg)

    **2.** Chaque rectangle a pour largeur $\dfrac{1}{4}$. On somme donc les hauteurs, puis on multiplie par $\dfrac{1}{4}$ : 
    $$\begin{aligned} s_{4} &= \frac{1}{4}\left(f(0)+f\!\left(\tfrac{1}{4}\right)+f\!\left(\tfrac{1}{2}\right) +f\!\left(\tfrac{3}{4}\right)\right) = \frac{1}{4}\left(0+\frac{1}{16}+\frac{4}{16}+\frac{9}{16}\right) \\ &= \frac{1}{4}\times\frac{14}{16}=\boxed{\frac{7}{32}=0{,}21875} \end{aligned}$$

    $$\begin{aligned} S_{4} &= \frac{1}{4}\left(f\!\left(\tfrac{1}{4}\right)+f\!\left(\tfrac{1}{2}\right) +f\!\left(\tfrac{3}{4}\right)+f(1)\right) = \frac{1}{4}\left(\frac{1}{16}+\frac{4}{16}+\frac{9}{16}+\frac{16}{16}\right) \\ &= \frac{1}{4}\times\frac{30}{16}=\boxed{\frac{15}{32}=0{,}46875} \end{aligned}$$

    **3.** Le domaine contient les rectangles inférieurs et est contenu dans les rectangles supérieurs : 
    $$\boxed{\frac{7}{32}\leqslant \mathcal{A}\leqslant\frac{15}{32}} \qquad \text{soit} \qquad 0{,}218\leqslant\mathcal{A}\leqslant 0{,}469$$

    **4.** Pour un découpage en $n$ intervalles de largeur $\dfrac{1}{n}$ : 
    $$s_{n}=\frac{1}{n}\sum_{k=0}^{n-1}f\!\left(\frac{k}{n}\right) \qquad \text{et} \qquad S_{n}=\frac{1}{n}\sum_{k=1}^{n}f\!\left(\frac{k}{n}\right)$$
     Ces deux sommes contiennent les mêmes termes, sauf que la première commence par $f(0)$ et s'arrête à $f\!\left(\frac{n-1}{n}\right)$, tandis que la seconde commence à $f\!\left(\frac{1}{n}\right)$ et se termine par $f(1)$. Tous les termes intermédiaires se simplifient dans la différence : 
    $$S_{n}-s_{n}=\frac{1}{n}\left(f(1)-f(0)\right)=\frac{1}{n}(1-0)=\boxed{\frac{1}{n}}$$

    **5.** On cherche le plus petit entier $n$ tel que $\dfrac{1}{n}<10^{-2}$, c'est-à-dire $n>100$ : 
    $$\boxed{n=101 \text{ intervalles suffisent}}$$

    **6.** On a bien $\dfrac{7}{32}\approx 0{,}219\leqslant\dfrac{1}{3}\approx 0{,}333 \leqslant\dfrac{15}{32}\approx 0{,}469$ : l'encadrement est cohérent, mais très large. Avec $n=4$ seulement, on ne connaît pas encore la première décimale de $\mathcal{A}$.
