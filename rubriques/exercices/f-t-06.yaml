    def approx_pi(N):
        c = 0
        for i in range(N):
            x = random()
            y = random()
            if ... :
                c = ...
        return ...
    ```

    **6.** Deux appels successifs à `approx_pi(1000)` renvoient des résultats différents. Est-ce normal ? Cela constituerait-il une erreur de programmation ?

    **7.** *Généralisation.* Soit $g$ une fonction continue et positive sur $[a\,;b]$, majorée par un réel $M>0$. On tire $N$ points au hasard dans le rectangle $[a\,;b]\times[0\,;M]$ et l'on note $c$ le nombre de points situés sous la courbe de $g$. Justifier que $\displaystyle\int_{a}^{b}g(x)\,\mathrm{d}x$ est approché par $(b-a)\,M\,\dfrac{c}{N}$.

    **8.** Deux simulations avec $N=1\,000$ donnent des approximations de $\pi$ dont les deux premières décimales diffèrent souvent. Cette méthode est-elle précise ? En pratique, il faut multiplier $N$ par $100$ pour gagner une décimale : comparer avec la méthode des milieux de l'exercice 38 et conclure.
  corrige: |
    **1.** Soit $M(x\,;y)$ un point de la courbe, avec $x\in[0\,;1]$. Alors $y=\sqrt{1-x^{2}}$, donc $y\geqslant 0$ et, en élevant au carré : 
    $$y^{2}=1-x^{2} \qquad \text{c'est-à-dire} \qquad x^{2}+y^{2}=1$$

    $$\boxed{\text{La courbe est le quart de cercle de centre } O \text{ et de rayon } 1 \text{ situé dans le premier quadrant}}$$
     Le domaine $\mathcal{D}$ situé sous cette courbe est donc un quart de disque de rayon $1$, dont l'aire vaut le quart de $\pi\times 1^{2}$ : 
    $$\boxed{\int_{0}^{1}\sqrt{1-x^{2}}\,\mathrm{d}x=\frac{\pi}{4}\approx 0{,}785}$$

    ![Figure](documents/figures/080c0dc54444486a.svg)

    Le domaine sous la courbe est bien le quart du disque de rayon $1$ : c'est ce que montre le cercle complet tracé en pointillés. Son aire, $\dfrac{\pi}{4}$, s'obtient donc sans aucune primitive — et c'est heureux, car aucune primitive de $x\mapsto\sqrt{1-x^{2}}$ ne figure au tableau du cours.

    **2.** **(a)** Le carré a pour aire $1\times 1=1$, donc : 
    $$\boxed{p=\frac{\text{aire de } \mathcal{D}}{\text{aire du carré}} =\frac{\pi/4}{1}=\frac{\pi}{4}\approx 0{,}785}$$

    **(b)** Comme $x\in[0\,;1]$ et $y\geqslant 0$, le point $P$ appartient à $\mathcal{D}$ si et seulement s'il est sous la courbe, c'est-à-dire $y\leqslant\sqrt{1-x^{2}}$. Les deux membres étant positifs, on peut élever au carré sans changer le sens : 
    $$y\leqslant\sqrt{1-x^{2}} \iff y^{2}\leqslant 1-x^{2} \iff \boxed{x^{2}+y^{2}\leqslant 1}$$
     C'est la traduction du fait que $P$ est à une distance de $O$ inférieure à $1$.

    **3.** La proportion $\dfrac{c}{N}$ de points tombés dans $\mathcal{D}$ est la **fréquence** de l'événement « le point est dans $\mathcal{D}$ ». Lorsque $N$ est grand, cette fréquence se rapproche de la probabilité $\dfrac{\pi}{4}$ : 
    $$\frac{c}{N}\approx\frac{\pi}{4} \qquad \text{d'où} \qquad \boxed{\pi\approx\frac{4c}{N}}$$

    ![Figure](documents/figures/ca5952e552acc3f7.svg)

    **4.** 
    $$\boxed{N=1\,000 \;:\; \pi\approx\frac{4\times 782}{1\,000}=3{,}128} \qquad \text{et} \qquad \boxed{N=10\,000 \;:\; \pi\approx\frac{4\times 7\,864}{10\,000}=3{,}1456}$$
     La première estimation donne une décimale exacte, la seconde deux. Rappelons que $\pi\approx 3{,}14159$.

    **5.** 

    ```python
    from random import random

    def approx_pi(N):
        c = 0
        for i in range(N):
            x = random()
            y = random()
            if x**2 + y**2 <= 1 :
                c = c + 1
        return 4 * c / N
    ```

    **6.** C'est parfaitement normal, et ce n'est **pas** une erreur de programmation : 
    $$\boxed{\text{la fonction repose sur des tirages aléatoires, donc son résultat varie}}$$
     Deux exécutions ne tirent pas les mêmes points et ne comptent donc pas le même nombre $c$. C'est la nature même de la méthode : elle ne fournit pas une valeur, mais une estimation.

    **7.** Le rectangle $[a\,;b]\times[0\,;M]$ a pour aire $(b-a)M$, et le domaine sous la courbe de $g$ y est entièrement contenu puisque $0\leqslant g\leqslant M$. La probabilité qu'un point tiré au hasard tombe sous la courbe vaut donc : 
    $$p=\frac{\displaystyle\int_{a}^{b}g(x)\,\mathrm{d}x}{(b-a)M}$$
     En remplaçant $p$ par la fréquence observée $\dfrac{c}{N}$ : 
    $$\boxed{\int_{a}^{b}g(x)\,\mathrm{d}x\approx(b-a)\,M\,\frac{c}{N}}$$

    **8.** Non, la méthode est **très peu précise**. Pour gagner une décimale il faut multiplier $N$ par $100$, donc effectuer cent fois plus de tirages.

    La comparaison est sans appel : avec $1\,000$ points, Monte-Carlo donne une ou deux décimales de $\pi$, alors que la méthode des milieux de l'exercice 38 en donnait sept avec $1\,000$ évaluations seulement. 
    $$\boxed{\text{Pour une intégrale en dimension } 1, \text{ Monte-Carlo n'est pas compétitive}}$$
     Son intérêt est ailleurs : en dimension élevée, découper l'espace en petits pavés devient impraticable, alors que tirer des points au hasard reste tout aussi simple.
