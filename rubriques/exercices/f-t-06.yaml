  enonce: |
    **1.** Soient $f$ une fonction continue sur un intervalle $I$, $u$ et $v$ deux fonctions dérivables sur un intervalle $J$ et à valeurs dans $I$. Calculer la dérivée de la fonction $G$ définie sur $J$ par 
    $$G(x)=\int_{u(x)}^{v(x)}f(t)\,\mathrm{d}t$$
     On notera que, si $F$ est une primitive de $f$ sur $I$, alors $G(x)=F\left(v(x)\right)- F\left(u(x)\right)$ pour tout $x\in J$.

    **2.** Montrer que, pour tout réel $x>0$ : 
    $$\int_{\frac{1}{x}}^{x}\frac{\ln(t)}{1+t^{2}}\,\mathrm{d}t=0$$
  corrige: |
    **1.** Avec $G(x)=F\left(v(x)\right)-F\left(u(x)\right)$, la dérivée d'une fonction composée et $F'=f$ donnent : 
    $$\boxed{G'(x)=v'(x)\,f\left(v(x)\right)-u'(x)\,f\left(u(x)\right)}$$

    **2.** Posons $f(t)=\dfrac{\ln(t)}{1+t^{2}}$, continue sur $I=]0\,;+\infty[$, et, pour $x>0$, $u(x)=\dfrac{1}{x}$, $v(x)=x$, qui sont dérivables et à valeurs dans $I$. Notons $G(x)=\displaystyle\int_{1/x}^{x}f(t)\,\mathrm{d}t$. D'après la question 1, avec $u'(x)=-\frac{1}{x^{2}}$ et $\ln\left(\frac{1}{x}\right)=-\ln(x)$ : 
    $$G'(x)=\frac{\ln(x)}{1+x^{2}}+\frac{1}{x^{2}}\times\frac{-\ln(x)}{1+\frac{1}{x^{2}}} =\frac{\ln(x)}{1+x^{2}}-\frac{\ln(x)}{x^{2}+1}=0$$
     La fonction $G$, de dérivée nulle sur l'intervalle $]0\,;+\infty[$, est constante. Or $G(1)=\displaystyle\int_{1}^{1}f(t)\,\mathrm{d}t=0$. 
    $$\boxed{\text{Pour tout } x>0,\quad\int_{1/x}^{x}\frac{\ln(t)}{1+t^{2}}\,\mathrm{d}t=0}$$

    *Remarque.* Aucune primitive de $t\mapsto\frac{\ln(t)}{1+t^{2}}$ ne s'exprime à l'aide des fonctions connues au lycée, et pourtant on a calculé ces intégrales : dériver par rapport à une borne permet de contourner le calcul de primitive. On peut aussi deviner le résultat : les aires situées sous l'axe, entre $\frac{1}{x}$ et $1$, et au-dessus, entre $1$ et $x$, se compensent exactement. Le changement de variable $t\mapsto\frac{1}{t}$, étudié après le baccalauréat, en donne la raison.
