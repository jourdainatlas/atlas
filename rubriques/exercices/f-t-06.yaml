  page_corrige: 39
  enonce: |
    Soit $\alpha$ un réel strictement positif. On utilise les fonctions puissances $x\mapsto x^{\alpha}$ de l'exercice 31 du chapitre 5. On pose, pour tout entier $n\geqslant 1$ : 
    $$S_{n}=\sum_{k=1}^{n}k^{\alpha}=1^{\alpha}+2^{\alpha}+\dots+n^{\alpha}$$
     Encadrer $S_{n}$ par la méthode des rectangles et en déduire que 
    $$\lim_{n\to+\infty}\frac{S_{n}}{n^{\alpha+1}}=\frac{1}{\alpha+1}$$
  corrige: |
    D'après l'exercice 31 du chapitre 5, la fonction $t\mapsto t^{\alpha+1}$ a pour dérivée $t\mapsto(\alpha+1)\,t^{\alpha}$ sur $]0\,;+\infty[$ : une primitive de $t\mapsto t^{\alpha}$ est donc $t\mapsto\frac{t^{\alpha+1}}{\alpha+1}$. De plus, comme $\alpha>0$, la fonction $t\mapsto t^{\alpha}$ est croissante.

    *Majoration.* Pour $k\geqslant 1$ et $t\in[k\,;k+1]$, on a $k^{\alpha}\leqslant t^{\alpha}$, et l'intégration sur cet intervalle de longueur $1$ donne $k^{\alpha}\leqslant\int_{k}^{k+1}t^{\alpha}\,\mathrm{d}t$. En sommant pour $k$ de $1$ à $n$, les intégrales se mettent bout à bout (relation de Chasles) : 
    $$S_{n}\leqslant\int_{1}^{n+1}t^{\alpha}\,\mathrm{d}t=\frac{(n+1)^{\alpha+1}-1}{\alpha+1}$$
     *Minoration.* Pour $k\geqslant 2$ et $t\in[k-1\,;k]$, on a de même $k^{\alpha}\geqslant\int_{k-1}^{k}t^{\alpha}\,\mathrm{d}t$, d'où, en sommant pour $k$ de $2$ à $n$ et en ajoutant le terme $1^{\alpha}=1$ : 
    $$S_{n}\geqslant 1+\int_{1}^{n}t^{\alpha}\,\mathrm{d}t\geqslant\frac{n^{\alpha+1}-1}{\alpha+1}$$
     *Conclusion.* En divisant par $n^{\alpha+1}>0$ : 
    $$\frac{1}{\alpha+1}\left(1-\frac{1}{n^{\alpha+1}}\right)\leqslant\frac{S_{n}}{n^{\alpha+1}} \leqslant\frac{1}{\alpha+1}\left(\left(1+\frac{1}{n}\right)^{\alpha+1}-\frac{1}{n^{\alpha+1}} \right)$$
     Comme $\alpha+1>0$, $\frac{1}{n^{\alpha+1}}\to 0$ (exercice 31 du chapitre 5), et $\left(1+\frac{1}{n}\right)^{\alpha+1}=\mathrm{e}^{(\alpha+1)\ln\left(1+\frac{1}{n}\right)}\to\mathrm{e}^{0}=1$. Les deux bornes tendent vers $\frac{1}{\alpha+1}$, et le théorème des gendarmes conclut : 
    $$\boxed{\lim_{n\to+\infty}\frac{S_{n}}{n^{\alpha+1}}=\frac{1}{\alpha+1}}$$
     *Vérification :* pour $\alpha=1$, $S_{n}=\frac{n(n+1)}{2}$ et $\frac{S_{n}}{n^{2}}\to\frac{1}{2}$ ; pour $\alpha=2$, $S_{n}=\frac{n(n+1)(2n+1)}{6}$ et $\frac{S_{n}}{n^{3}}\to\frac{1}{3}$, ce qui confirme le résultat sur deux formules classiques, que l'on démontre par récurrence.

    *Remarque.* On peut écrire $\frac{S_{n}}{n^{\alpha+1}}=\frac{1}{n}\sum_{k=1}^{n} \left(\frac{k}{n}\right)^{\alpha}$ : c'est la somme des aires des rectangles supérieurs pour la fonction $t\mapsto t^{\alpha}$ sur $[0\,;1]$, découpé en $n$ intervalles. Le résultat dit qu'elle tend vers $\int_{0}^{1}t^{\alpha}\,\mathrm{d}t=\frac{1}{\alpha+1}$, comme la méthode de l'exercice 36 le laissait prévoir.
- id: "t-06-47"
  feuille: "f-t-06"
  numero: 47
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [intégrale, encadrement, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 236"
  page_enonce: 19
  page_corrige: 40
  enonce: |
    Pour tout réel $x\neq 0$, on pose 
    $$f(x)=\int_{x}^{2x}\frac{\mathrm{e}^{t}}{t}\,\mathrm{d}t$$

    **1.** Étudier les variations de $f$ sur chacun des deux intervalles $]0\,;+\infty[$ et $]-\infty\,;0[$.

    **2.** Montrer que, pour tout réel $x>0$, $f(x)\geqslant\dfrac{\mathrm{e}^{x}}{2}$. En déduire la limite de $f$ en $+\infty$.

    **3.** Montrer, à l'aide d'un encadrement, que $f(x)$ tend vers $0$ lorsque $x$ tend vers $-\infty$.

    **4.** Trouver une constante $C>0$ telle que, pour tout $t\in[-1\,;1]$, $\left|\mathrm{e}^{t}-1\right|\leqslant C\,|t|$.

    **5.** Déduire de la question 4 la limite de $f$ en $0$.
  corrige: |
    La fonction $\varphi : t\mapsto\dfrac{\mathrm{e}^{t}}{t}$ est continue sur $]0\,;+\infty[$ et sur $]-\infty\,;0[$. Si $x>0$, les réels $x$ et $2x$ sont dans $]0\,;+\infty[$, et si $x<0$, ils sont dans $]-\infty\,;0[$ : dans les deux cas, $\varphi$ est continue entre les bornes, et $f(x)$ est bien défini.

    **1.** Sur chacun des deux intervalles, notons $\Phi$ une primitive de $\varphi$, de sorte que $f(x)=\Phi(2x)-\Phi(x)$. Comme à l'exercice 44 : 
    $$f'(x)=2\,\varphi(2x)-\varphi(x)=\frac{2\,\mathrm{e}^{2x}}{2x}-\frac{\mathrm{e}^{x}}{x} =\frac{\mathrm{e}^{x}\left(\mathrm{e}^{x}-1\right)}{x}$$
     Le facteur $\mathrm{e}^{x}-1$ a le signe de $x$ : le quotient est strictement positif pour tout $x\neq 0$. 
    $$\boxed{f \text{ est strictement croissante sur } ]-\infty\,;0[ \text{ et sur } ]0\,;+\infty[.}$$

    **2.** Soit $x>0$. Pour $t\in[x\,;2x]$, on a $\mathrm{e}^{t}\geqslant\mathrm{e}^{x}$ et $\frac{1}{t}\geqslant\frac{1}{2x}$, ces nombres étant positifs, donc $\varphi(t)\geqslant\frac{\mathrm{e}^{x}}{2x}$. L'intégration sur $[x\,;2x]$, de longueur $x$, donne 
    $$\boxed{f(x)\geqslant x\times\frac{\mathrm{e}^{x}}{2x}=\frac{\mathrm{e}^{x}}{2}}$$
     d'où, par comparaison, $\boxed{\displaystyle\lim_{x\to+\infty}f(x)=+\infty}$.

    **3.** Soit $x<0$. Les bornes $x$ et $2x$ sont alors dans le mauvais ordre ($2x<x$), et l'on écrit 
    $$f(x)=-\int_{2x}^{x}\frac{\mathrm{e}^{t}}{t}\,\mathrm{d}t=\int_{2x}^{x}\frac{\mathrm{e}^{t}}{|t|}\,\mathrm{d}t$$
     puisque $-t=|t|$ pour $t<0$. Pour $t\in[2x\,;x]$, on a $\mathrm{e}^{t}\leqslant\mathrm{e}^{x}$ et $|t|\geqslant|x|$, donc $0<\frac{\mathrm{e}^{t}}{|t|}\leqslant\frac{\mathrm{e}^{x}}{|x|}$. En intégrant sur $[2x\,;x]$, de longueur $|x|$ : 
    $$0\leqslant f(x)\leqslant|x|\times\frac{\mathrm{e}^{x}}{|x|}=\mathrm{e}^{x}$$
     Comme $\mathrm{e}^{x}\to 0$ en $-\infty$, le théorème des gendarmes donne $\boxed{\displaystyle\lim_{x\to-\infty}f(x)=0}$.

    **4.** On écrit $\mathrm{e}^{t}-1=\displaystyle\int_{0}^{t}\mathrm{e}^{s}\,\mathrm{d}s$. Si $t\in[0\,;1]$, on a $1\leqslant\mathrm{e}^{s}\leqslant\mathrm{e}$ sur $[0\,;t]$, donc $0\leqslant\mathrm{e}^{t}-1\leqslant\mathrm{e}\,t$. Si $t\in[-1\,;0]$, on a $\mathrm{e}^{s}\leqslant 1$ sur $[t\,;0]$, donc $0\leqslant 1-\mathrm{e}^{t}=\int_{t}^{0}\mathrm{e}^{s}\,\mathrm{d}s\leqslant|t|$. Dans tous les cas : 
    $$\boxed{\text{pour tout } t\in[-1\,;1],\quad\left|\mathrm{e}^{t}-1\right|\leqslant\mathrm{e}\,|t| \text{ : la constante } C=\mathrm{e} \text{ convient.}}$$

    **5.** On sépare $\varphi(t)=\dfrac{1}{t}+\dfrac{\mathrm{e}^{t}-1}{t}$. La première partie s'intègre : pour $x>0$, $\int_{x}^{2x}\frac{\mathrm{d}t}{t}=\ln(2x)-\ln(x)=\ln(2)$ ; pour $x<0$, la fonction $t\mapsto\ln(-t)$, de dérivée $\frac{1}{t}$, est une primitive de $t\mapsto\frac{1}{t}$ sur $]-\infty\,;0[$, et l'on obtient de même $\ln(-2x)-\ln(-x)=\ln(2)$. Ainsi 
    $$f(x)=\ln(2)+R(x)\qquad\text{avec}\qquad R(x)=\int_{x}^{2x}\frac{\mathrm{e}^{t}-1}{t}\,\mathrm{d}t$$
     Si $0<|x|\leqslant\frac{1}{2}$, tout $t$ compris entre $x$ et $2x$ vérifie $|t|\leqslant 1$, et la question 4 donne $-\mathrm{e}\leqslant\frac{\mathrm{e}^{t}-1}{t}\leqslant\mathrm{e}$. En intégrant sur l'intervalle d'extrémités $x$ et $2x$, de longueur $|x|$, on obtient $|R(x)|\leqslant\mathrm{e}\,|x|$, qui tend vers $0$. 
    $$\boxed{\lim_{x\to 0}f(x)=\ln(2)}$$

    ![Figure](documents/figures/144244e1e6b6091c.svg)

    La courbe, tracée à partir de valeurs calculées numériquement, montre les deux branches croissantes, la limite nulle en $-\infty$ et la croissance rapide en $+\infty$. Elle montre surtout que les deux branches se raccordent au point de coordonnées $(0\,;\ln 2)$, marqué d'un cercle vide car $f$ n'est pas définie en $0$.

    *Remarque.* Le résultat de la question 5 est surprenant : la fonction intégrée devient infinie près de $0$, et pourtant l'intégrale sur $[x\,;2x]$ a une limite finie. C'est que l'intervalle rétrécit en même temps, et que la partie $\frac{1}{t}$, responsable de l'explosion, a sur $[x\,;2x]$ une intégrale qui ne dépend pas de $x$. Le découpage $\varphi=\frac{1}{t}+\frac{\mathrm{e}^{t}-1}{t}$ isole précisément cette partie.
