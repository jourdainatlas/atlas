  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. Une primitive sur $\mathbb{R}$ de $f(x)=3x^{2}$ est : ¦ $6x$ ¦ $x^{3}-4$ ¦ $\dfrac{x^{3}}{3}$
    2. $\displaystyle\int_{0}^{1}2x\,\mathrm{d}x$ vaut : ¦ $1$ ¦ $2$ ¦ $\dfrac{1}{2}$
    3. Une primitive sur $\left]0\,;+\infty\right[$ de $f(x)=\dfrac{1}{x}$ est : ¦ $-\dfrac{1}{x^{2}}$ ¦ $\ln(x)$ ¦ $\dfrac{1}{2x^{2}}$
    4. Si $F$ est une primitive de $f$ sur $I$, les primitives de $f$ sur $I$ sont : ¦ $F$ uniquement ¦ $F+k$, $k\in\mathbb{R}$ ¦ $kF$, $k\in\mathbb{R}$
    5. $\displaystyle\int_{1}^{2}\dfrac{1}{x^{2}}\,\mathrm{d}x$ vaut : ¦ $\dfrac{1}{2}$ ¦ $-\dfrac{1}{2}$ ¦ $\ln(2)$
    6. Une primitive de $x\mapsto 2x\,\mathrm{e}^{x^{2}}$ est : ¦ $\mathrm{e}^{x^{2}}$ ¦ $x^{2}\mathrm{e}^{x^{2}}$ ¦ $2\mathrm{e}^{x^{2}}$
    7. Si $\displaystyle\int_{0}^{3}f=5$ et $\displaystyle\int_{0}^{1}f=2$, alors $\displaystyle\int_{1}^{3}f$ vaut : ¦ $7$ ¦ $3$ ¦ $-3$
    8. Si $f$ est continue sur $[0\,;1]$ et $\displaystyle\int_{0}^{1}f(x)\,\mathrm{d}x=0$, alors : ¦ $f$ est nulle sur $[0\,;1]$ ¦ $f$ est positive sur $[0\,;1]$ ¦ on ne peut rien conclure sur le signe de $f$
    9. La valeur moyenne de $f(x)=x$ sur $[0\,;4]$ est : ¦ $2$ ¦ $8$ ¦ $4$
    10. $\displaystyle\int_{0}^{1}x\,\mathrm{e}^{x}\,\mathrm{d}x$ vaut : ¦ $\mathrm{e}$ ¦ $1$ ¦ $\mathrm{e}-1$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **B** ¦ $\left(x^{3}-4\right)'=3x^{2}$. La réponse A est la *dérivée* de $f$, et $\left(\frac{x^{3}}{3}\right)'=x^{2}\neq 3x^{2}$.
    2 ¦ **A** ¦ $\left[x^{2}\right]_{0}^{1}=1$.
    3 ¦ **B** ¦ C'est la ligne du tableau des primitives : $\ln'(x)=\frac{1}{x}$ sur $\left]0\,;+\infty\right[$.
    4 ¦ **B** ¦ Théorème 1 : deux primitives d'une même fonction diffèrent d'une constante *additive*, non multiplicative.
    5 ¦ **A** ¦ $\left[-\frac{1}{x}\right]_{1}^{2}=-\frac{1}{2}+1=\frac{1}{2}$. La réponse B oublie le signe de la borne inférieure.
    6 ¦ **A** ¦ Forme $u'\mathrm{e}^{u}$ avec $u(x)=x^{2}$ : la primitive est $\mathrm{e}^{u}$, sans facteur supplémentaire.
    7 ¦ **B** ¦ Chasles : $\int_{1}^{3}f=\int_{0}^{3}f-\int_{0}^{1}f=5-2=3$.
    8 ¦ **C** ¦ Une intégrale nulle signifie seulement que les aires au-dessus et en dessous de l'axe se compensent. Contre-exemple : $f(x)=x-\frac{1}{2}$ sur $[0\,;1]$.
    9 ¦ **A** ¦ $\mu=\frac{1}{4}\left[\frac{x^{2}}{2}\right]_{0}^{4}=\frac{1}{4}\times 8=2$. La réponse B est l'intégrale, non la moyenne.
    10 ¦ **B** ¦ Intégration par parties : $\left[x\mathrm{e}^{x}\right]_{0}^{1}-\int_{0}^{1}\mathrm{e}^{x} =\mathrm{e}-(\mathrm{e}-1)=1$.
    ```
- id: "t-06-31"
  feuille: "f-t-06"
  numero: 31
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [primitive, intégrale, valeur moyenne, aire entre deux courbes]
  noeuds: [ar-tfa, ar-riemann]
  notions: [riemann-integrable]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Toute fonction continue sur un intervalle $I$ admet des primitives sur $I$.

    **2.** Une fonction continue sur un intervalle $I$ y admet une unique primitive.

    **3.** Si $F$ et $G$ sont deux primitives d'une même fonction sur $I$, alors $F-G$ est constante sur $I$.

    **4.** Si $f$ est positive sur $[a\,;b]$ avec $a<b$, alors $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x\geqslant 0$.

    **5.** Si $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x\geqslant 0$ avec $a<b$, alors $f$ est positive sur $[a\,;b]$.

    **6.** Pour toutes fonctions $f$ et $g$ continues sur $[a\,;b]$ : 
    $$\int_{a}^{b}f(x)g(x)\,\mathrm{d}x=\left(\int_{a}^{b}f(x)\,\mathrm{d}x\right) \times\left(\int_{a}^{b}g(x)\,\mathrm{d}x\right)$$

    **7.** Pour toute fonction $f$ continue sur un intervalle contenant $a$ et $b$ : $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x=-\int_{b}^{a}f(x)\,\mathrm{d}x$.

    **8.** La valeur moyenne d'une fonction continue sur $[a\,;b]$ est toujours comprise entre son minimum et son maximum sur cet intervalle.

    **9.** Si $f\leqslant g$ sur $[a\,;b]$ avec $a<b$, alors $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x\leqslant\int_{a}^{b}g(x)\,\mathrm{d}x$.

    **10.** Pour toute fonction $f$ continue sur $[0\,;2]$ : $\displaystyle\int_{0}^{2}f(x)\,\mathrm{d}x=2\,f(1)$.
  corrige: |
    **1.** **Vraie**. C'est le premier point du théorème 1 du cours : toute fonction continue sur un intervalle y admet des primitives. L'existence est garantie par le théorème fondamental de l'analyse, la fonction $x\mapsto\displaystyle\int_{a}^{x}f(t)\,\mathrm{d}t$ en étant une.

    **2.** **Fausse**. Si $F$ est une primitive de $f$, alors $F+1$, $F+2$, … en sont aussi. Une fonction continue admet donc une **infinité** de primitives. Par exemple, $x\mapsto x^{2}$ et $x\mapsto x^{2}+7$ sont toutes deux des primitives de $x\mapsto 2x$ sur $\mathbb{R}$.

    **3.** **Vraie**. Posons $H=F-G$. Comme $F'=G'=f$, on a $H'=F'-G'=f-f=0$ sur $I$. Or une fonction de dérivée nulle sur un *intervalle* est constante : 
    $$\boxed{F-G \text{ est constante sur } I}$$

    **4.** **Vraie**. C'est la propriété de positivité (proposition 4). Démonstration : soit $F$ une primitive de $f$ ; comme $F'=f\geqslant 0$, $F$ est croissante sur $[a\,;b]$, donc $F(a)\leqslant F(b)$, c'est-à-dire $\displaystyle\int_{a}^{b}f=F(b)-F(a)\geqslant 0$.

    **5.** **Fausse**. La réciproque est fausse : les parties situées au-dessus de l'axe peuvent compenser celles situées en dessous. Contre-exemple avec $f(x)=x$ sur $[-1\,;1]$ : 
    $$\int_{-1}^{1}x\,\mathrm{d}x=\left[\frac{x^{2}}{2}\right]_{-1}^{1}=0\geqslant 0$$
     et pourtant $f$ est strictement négative sur $[-1\,;0[$.

    **6.** **Fausse**. L'intégrale n'est pas multiplicative. Contre-exemple avec $f=g$ définies par $f(x)=x$ sur $[0\,;1]$ : 
    $$\int_{0}^{1}x^{2}\,\mathrm{d}x=\frac{1}{3} \qquad \text{alors que} \qquad \left(\int_{0}^{1}x\,\mathrm{d}x\right)^{2}=\left(\frac{1}{2}\right)^{2}=\frac{1}{4}$$

    **7.** **Vraie**. C'est la convention posée en section 6.3.5 du cours. Avec $F$ une primitive de $f$ : 
    $$\int_{b}^{a}f(x)\,\mathrm{d}x=F(a)-F(b)=-\left(F(b)-F(a)\right) =-\int_{a}^{b}f(x)\,\mathrm{d}x$$

    **8.** **Vraie**. Notons $m$ et $M$ le minimum et le maximum de $f$ sur $[a\,;b]$. L'inégalité de la moyenne donne $m(b-a)\leqslant\displaystyle\int_{a}^{b}f\leqslant M(b-a)$. En divisant par $b-a>0$ : 
    $$\boxed{m\leqslant\mu\leqslant M}$$

    **9.** **Vraie**. C'est la conservation de l'ordre (proposition 4). La fonction $g-f$ est continue et positive sur $[a\,;b]$, son intégrale est donc positive, et la linéarité permet de conclure.

    **10.** **Fausse**. Ce serait confondre la valeur moyenne avec la valeur au milieu de l'intervalle. Contre-exemple avec $f(x)=x^{2}$ sur $[0\,;2]$ : 
    $$\int_{0}^{2}x^{2}\,\mathrm{d}x=\frac{8}{3}\approx 2{,}67 \qquad \text{alors que} \qquad 2\,f(1)=2$$
- id: "t-06-32"
  feuille: "f-t-06"
