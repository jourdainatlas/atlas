  enonce: |
    *L'inégalité de Cauchy-Schwarz pour les intégrales.* Soient $a$ et $b$ deux réels tels que $a<b$, $f$ et $g$ deux fonctions continues sur $[a\,;b]$. On se propose d'établir l'inégalité : 
    $$\int_{a}^{b}f(t)\,g(t)\,\mathrm{d}t\leqslant\sqrt{\int_{a}^{b}f(t)^{2}\,\mathrm{d}t}\; \sqrt{\int_{a}^{b}g(t)^{2}\,\mathrm{d}t}$$
     Pour $x$ réel, on pose : 
    $$S(x)=\int_{a}^{b}\left(f(t)+x\,g(t)\right)^{2}\mathrm{d}t$$
     Vérifier que la fonction $S$ est polynomiale de degré inférieur ou égal à $2$ et à valeurs positives. Conclure en considérant le discriminant de ce trinôme.
  corrige: |
    Notons $A=\displaystyle\int_{a}^{b}g(t)^{2}\,\mathrm{d}t$, $B=\int_{a}^{b}f(t)\,g(t)\,\mathrm{d}t$ et $C=\int_{a}^{b}f(t)^{2}\,\mathrm{d}t$. En développant le carré et par linéarité de l'intégrale, pour tout réel $x$ : 
    $$S(x)=\int_{a}^{b}\left(f(t)^{2}+2x\,f(t)\,g(t)+x^{2}g(t)^{2}\right)\mathrm{d}t =A\,x^{2}+2B\,x+C$$
     La fonction $S$ est donc polynomiale de degré au plus $2$. Elle est à valeurs positives, comme intégrale, sur $[a\,;b]$ avec $a<b$, d'une fonction positive.

    *Cas $A>0$.* Un trinôme de coefficient dominant positif qui ne prend que des valeurs positives ne peut pas avoir deux racines distinctes, sans quoi il serait négatif entre elles. Son discriminant est donc négatif ou nul : 
    $$4B^{2}-4AC\leqslant 0 \iff B^{2}\leqslant AC \iff |B|\leqslant\sqrt{A}\,\sqrt{C}$$
     *Cas $A=0$.* Alors $S(x)=2Bx+C$. Une fonction affine qui ne prend que des valeurs positives sur $\mathbb{R}$ est constante, donc $B=0$, et l'inégalité $B\leqslant\sqrt{A}\sqrt{C}=0$ est vraie.

    Dans les deux cas, $B\leqslant|B|\leqslant\sqrt{A}\sqrt{C}$ : 
    $$\boxed{\int_{a}^{b}f(t)\,g(t)\,\mathrm{d}t\leqslant\sqrt{\int_{a}^{b}f(t)^{2}\,\mathrm{d}t}\; \sqrt{\int_{a}^{b}g(t)^{2}\,\mathrm{d}t}}$$
     *Vérification :* avec $f(t)=1$ et $g(t)=t$ sur $[0\,;1]$, le membre de gauche vaut $\frac{1}{2}$ et celui de droite $\sqrt{1}\times\sqrt{\frac{1}{3}}\approx 0{,}577$.

    *Remarque.* C'est mot pour mot la démonstration de l'exercice 35 du chapitre 4, pour les vecteurs de l'espace : l'intégrale $\int_{a}^{b}f\,g$ se comporte comme un produit scalaire entre les fonctions $f$ et $g$, et $\sqrt{\int_{a}^{b}f^{2}}$ comme une norme. Cette analogie entre fonctions et vecteurs est l'une des idées directrices des mathématiques après le baccalauréat.

    *Une conséquence.* Avec $g=1$, on obtient $\left(\int_{a}^{b}f\right)^{2}\leqslant(b-a)\int_{a}^{b}f^{2}$ : le carré de la valeur moyenne de $f$ est inférieur à la valeur moyenne de $f^{2}$.
- id: "t-06-50"
  feuille: "f-t-06"
  numero: 50
  partie: "Pour aller plus loin"
  etoiles: 4
