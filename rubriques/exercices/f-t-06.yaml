  page_enonce: 4
  page_corrige: 8
  enonce: |
    Ci-dessous est représentée, sur un quadrillage d'unité $1$, la courbe $\mathcal{C}_f$ d'une fonction $f$ continue et positive sur $[0\,;4]$.

    ![Figure](documents/figures/a4287151350505e3.svg)

    **1.** Combien de carreaux entiers sont-ils entièrement contenus dans le domaine colorié ? Combien de carreaux le domaine rencontre-t-il au total ?

    **2.** En déduire un encadrement de $\displaystyle\int_{0}^{4}f(x)\,\,\mathrm{d}x$.

    **3.** En évaluant à vue la part des carreaux incomplets, proposer une estimation de cette intégrale.

    **4.** On admet que $f(x)=-\dfrac{1}{2}x^{2}+2x+1$. Calculer la valeur exacte de l'intégrale, puis la comparer à l'encadrement et à l'estimation précédents.
  corrige: |
    **1.** Sur la figure ci-dessous, les six carreaux entièrement contenus dans le domaine sont coloriés en vert.

    ![Figure](documents/figures/d05c69be50c0a8c5.svg)

    $$\boxed{6 \text{ carreaux entiers} \qquad ; \qquad 12 \text{ carreaux rencontrés}}$$
     En effet, au-dessus de chacune des quatre colonnes, le domaine atteint la troisième rangée : il rencontre donc $4\times 3=12$ carreaux.

    **2.** Chaque carreau ayant une aire de $1$ unité d'aire : 
    $$\boxed{6\leqslant\int_{0}^{4}f(x)\,\mathrm{d}x\leqslant 12}$$

    **3.** Les six carreaux incomplets sont recouverts, à vue, à un peu plus de la moitié chacun. En comptant environ $3{,}5$ carreaux supplémentaires : 
    $$\boxed{\int_{0}^{4}f(x)\,\mathrm{d}x\approx 9{,}5}$$

    **4.** Une primitive de $f$ est $F(x)=-\dfrac{x^{3}}{6}+x^{2}+x$, donc : 
    $$\begin{aligned} \int_{0}^{4}f(x)\,\mathrm{d}x &= \left[-\frac{x^{3}}{6}+x^{2}+x\right]_{0}^{4} = \left(-\frac{64}{6}+16+4\right)-0 \\ &= -\frac{32}{3}+20=\frac{-32+60}{3}=\boxed{\frac{28}{3}\approx 9{,}33} \end{aligned}$$
     Ce nombre appartient bien à $[6\,;12]$, et l'estimation $9{,}5$ le prédisait à $0{,}2$ près : le comptage de carreaux donne un ordre de grandeur honnête, mais un encadrement très grossier.
- id: "t-06-13"
  feuille: "f-t-06"
  numero: 13
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 1
  types: [Calcul]
  mots_cles: [primitive, intégrale, aire]
  noeuds: [ar-tfa, ar-riemann]
  notions: [riemann-integrable]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Les intégrales suivantes se calculent sans primitive, en reconnaissant une aire élémentaire. Dans chaque cas, faire une figure et conclure.

    **a)** $\displaystyle\int_{0}^{3}(2x+1)\,\,\mathrm{d}x$

    **b)** $\displaystyle\int_{-1}^{4}3\,\,\mathrm{d}x$

    **c)** $\displaystyle\int_{0}^{2}(-x+2)\,\,\mathrm{d}x$

    **d)** $\displaystyle\int_{-2}^{2}|x|\,\,\mathrm{d}x$

    **e)** $\displaystyle\int_{-2}^{2}\sqrt{4-x^{2}}\,\,\mathrm{d}x$

    Pour e), on remarquera que la courbe d'équation $y=\sqrt{4-x^{2}}$ est un demi-cercle. C'est le seul de ces cinq calculs qu'on ne saurait pas mener avec le tableau des primitives.
  corrige: |
    ![Figure](documents/figures/1bf8a5c94b4f4ae2.svg)

    ![Figure](documents/figures/53abef6b2ed71f3e.svg)

    ![Figure](documents/figures/087bb7092495abfe.svg)

    ![Figure](documents/figures/73279bac45b4b8be.svg)

    ![Figure](documents/figures/bba52f5639bce6d3.svg)

    **a)** Trapèze de bases $f(0)=1$ et $f(3)=7$, de hauteur $3$ : $\boxed{\displaystyle\int_{0}^{3}(2x+1)\,\mathrm{d}x=12}$

    **b)** Rectangle de hauteur $3$ et de base $4-(-1)=5$ : $\boxed{\displaystyle\int_{-1}^{4}3\,\mathrm{d}x=15}$

    **c)** Triangle rectangle de base $2$ et de hauteur $2$ : $\boxed{\displaystyle\int_{0}^{2}(-x+2)\,\mathrm{d}x=2}$

    **d)** Deux triangles rectangles isocèles de côté $2$ : $\boxed{\displaystyle\int_{-2}^{2}|x|\,\mathrm{d}x=4}$

    **e)** Pour $y\geqslant 0$, $y=\sqrt{4-x^{2}}$ équivaut à $y^{2}=4-x^{2}$, c'est-à-dire $x^{2}+y^{2}=4$ : la courbe est le demi-cercle supérieur de centre $O$ et de rayon $2$. L'aire cherchée est celle d'un demi-disque de rayon $2$ : 
    $$\boxed{\int_{-2}^{2}\sqrt{4-x^{2}}\,\mathrm{d}x=\frac{\pi\times 2^{2}}{2}=2\pi \approx 6{,}28}$$

    On vérifie a) par le calcul : $\left[x^{2}+x\right]_{0}^{3}=9+3=12$. En revanche, aucune primitive de $x\mapsto\sqrt{4-x^{2}}$ ne figure au tableau : seule la lecture géométrique permet de conclure en e).
- id: "t-06-14"
  feuille: "f-t-06"
  numero: 14
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [intégrale, aire, encadrement]
  noeuds: [ar-riemann]
  notions: [riemann-integrable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    La courbe ci-dessous est celle d'une fonction $f$ continue et positive sur $[0\,;5]$. On sait que le domaine situé sous la courbe entre $0$ et $2$ a une aire de $4{,}2$ unités d'aire, et celui situé entre $2$ et $5$ une aire de $6{,}3$ unités d'aire.

    ![Figure](documents/figures/3b15a96e72551dbf.svg)

    **1.** Donner la valeur de $\displaystyle\int_{0}^{2}f(x)\,\,\mathrm{d}x$ et de $\displaystyle\int_{2}^{5}f(x)\,\,\mathrm{d}x$.

    **2.** En déduire $\displaystyle\int_{0}^{5}f(x)\,\,\mathrm{d}x$. Quelle propriété a-t-on utilisée ?

    **3.** Que vaut $\displaystyle\int_{3}^{3}f(x)\,\,\mathrm{d}x$ ? Justifier sans calcul.

    **4.** Lire sur le graphique deux réels $m$ et $M$ tels que $m\leqslant f(x)\leqslant M$ pour tout $x$ de $[0\,;5]$. En déduire un encadrement de $\displaystyle\int_{0}^{5}f(x)\,\,\mathrm{d}x$, puis vérifier qu'il est compatible avec la valeur trouvée à la question 2.

    **5.** Cet encadrement est-il précis ? Proposer un moyen de l'améliorer sans calculer l'intégrale.
  corrige: |
    **1.** La fonction étant positive, chaque intégrale est l'aire du domaine correspondant : 
    $$\boxed{\int_{0}^{2}f(x)\,\mathrm{d}x=4{,}2} \qquad \text{et} \qquad \boxed{\int_{2}^{5}f(x)\,\mathrm{d}x=6{,}3}$$

    **2.** Les deux domaines se recollent exactement en $x=2$ : 
    $$\int_{0}^{5}f(x)\,\mathrm{d}x=\int_{0}^{2}f(x)\,\mathrm{d}x+\int_{2}^{5}f(x)\,\mathrm{d}x =4{,}2+6{,}3=\boxed{10{,}5}$$

    $$\boxed{\text{On a utilisé la relation de Chasles}}$$

    **3.** Les deux bornes sont égales : le domaine se réduit à un segment, dont l'aire est nulle. 
    $$\boxed{\int_{3}^{3}f(x)\,\mathrm{d}x=0}$$

    **4.** On lit sur le graphique que la courbe reste comprise entre les deux droites en pointillés : 
    $$\boxed{m=1 \qquad \text{et} \qquad M=3}$$
     L'inégalité de la moyenne sur $[0\,;5]$, de longueur $5$, donne alors : 
    $$1\times 5\leqslant\int_{0}^{5}f(x)\,\mathrm{d}x\leqslant 3\times 5 \qquad \text{soit} \qquad \boxed{5\leqslant\int_{0}^{5}f(x)\,\mathrm{d}x\leqslant 15}$$
     La valeur $10{,}5$ trouvée à la question 2 appartient bien à cet intervalle.

    **5.** L'encadrement est très large : son amplitude vaut $10$, pour une intégrale d'environ $10{,}5$. On peut l'améliorer en **découpant l'intervalle** et en appliquant l'inégalité de la moyenne sur chaque morceau, avec des bornes lues localement. Sur $[0\,;2]$, on lit $1{,}2\leqslant f(x)\leqslant 3$, et sur $[2\,;5]$, $1{,}4\leqslant f(x)\leqslant 2{,}8$ : 
    $$\underbrace{2\times 1{,}2}_{=2{,}4}+\underbrace{3\times 1{,}4}_{=4{,}2} \leqslant\int_{0}^{5}f(x)\,\mathrm{d}x\leqslant \underbrace{2\times 3}_{=6}+\underbrace{3\times 2{,}8}_{=8{,}4}$$

    $$\boxed{6{,}6\leqslant\int_{0}^{5}f(x)\,\mathrm{d}x\leqslant 14{,}4}$$
     L'amplitude est passée de $10$ à $7{,}8$. Plus le découpage est fin, meilleur est l'encadrement : c'est exactement l'idée de la méthode des rectangles.
- id: "t-06-15"
  feuille: "f-t-06"
  numero: 15
  partie: "Intégrale d'une fonction continue sur un segment"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale, exponentielle, dérivée, tableau de variations]
  noeuds: [ar-riemann, ar-deriv]
  notions: [riemann-integrable, exponentielle, derivable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** On pose, pour tout réel $x\geqslant 1$, $\Phi(x)=\displaystyle\int_{1}^{x} \left(t^{2}+1\right)\,\mathrm{d}t$.

    **(a)** Justifier que $\Phi$ est dérivable et déterminer $\Phi'(x)$.

    **(b)** Que vaut $\Phi(1)$ ? En déduire les variations de $\Phi$.

    **(c)** Déterminer l'expression explicite de $\Phi(x)$, puis vérifier les deux réponses précédentes.

    **2.** On pose, pour tout réel $x\geqslant 0$, $G(x)=\displaystyle\int_{0}^{x} \mathrm{e}^{-t^{2}}\,\mathrm{d}t$.

    **(a)** Déterminer $G'(x)$ et en déduire les variations de $G$ sur $[0\,;+\infty[$.

    **(b)** On ne sait pas exprimer $G(x)$ à l'aide des fonctions usuelles. En quoi le théorème fondamental de l'analyse est-il malgré tout utile ici ?

    **3.** On pose, pour tout $x$ de $[0\,;3]$, $H(x)=\displaystyle\int_{0}^{x} \left(t^{2}-3t+2\right)\,\mathrm{d}t$.

    **(a)** Déterminer $H'(x)$ et étudier son signe sur $[0\,;3]$.

    **(b)** Dresser le tableau de variations de $H$ sur $[0\,;3]$, en y faisant figurer les valeurs exactes de $H(0)$, $H(1)$, $H(2)$ et $H(3)$.
  corrige: |
    **1.** **(a)** La fonction $t\mapsto t^{2}+1$ est continue et positive sur $[1\,;+\infty[$. D'après le théorème fondamental de l'analyse, $\Phi$ est dérivable et sa dérivée est la fonction intégrée : 
    $$\boxed{\Phi'(x)=x^{2}+1}$$

    **(b)** Les deux bornes sont égales lorsque $x=1$, donc $\boxed{\Phi(1)=0}$. Par ailleurs $\Phi'(x)=x^{2}+1>0$ pour tout $x$ : 
    $$\boxed{\Phi \text{ est strictement croissante sur } [1\,;+\infty[}$$

    **(c)** Une primitive de $t\mapsto t^{2}+1$ est $t\mapsto\dfrac{t^{3}}{3}+t$, donc : 
    $$\Phi(x)=\left[\frac{t^{3}}{3}+t\right]_{1}^{x} =\left(\frac{x^{3}}{3}+x\right)-\left(\frac{1}{3}+1\right) =\boxed{\frac{x^{3}}{3}+x-\frac{4}{3}}$$
     On vérifie : $\Phi'(x)=x^{2}+1$ et $\Phi(1)=\dfrac{1}{3}+1-\dfrac{4}{3}=0$. Les deux réponses précédentes sont bien confirmées.

    **2.** **(a)** La fonction $t\mapsto\mathrm{e}^{-t^{2}}$ est continue et strictement positive sur $[0\,;+\infty[$, donc : 
    $$\boxed{G'(x)=\mathrm{e}^{-x^{2}}>0} \qquad \text{d'où} \qquad \boxed{G \text{ est strictement croissante sur } [0\,;+\infty[}$$

    **(b)** C'est tout l'intérêt du théorème : **il donne accès à la dérivée d'une fonction dont on ne connaît pas l'expression**. On peut donc étudier les variations de $G$, la comparer, l'encadrer, alors même qu'aucune formule ne la décrit à l'aide des fonctions usuelles. La fonction $G$ est d'ailleurs fondamentale en probabilités : c'est elle qui gouverne la loi normale.

    **3.** **(a)** Le théorème fondamental donne $\boxed{H'(x)=x^{2}-3x+2}$. Ce trinôme a pour racines $1$ et $2$ (somme $3$, produit $2$), et son coefficient dominant est positif : 
    $$\boxed{H'(x)>0 \text{ sur } [0\,;1[\;\cup\;]2\,;3] \qquad ; \qquad H'(x)<0 \text{ sur } ]1\,;2[}$$

    **(b)** Une primitive de $t\mapsto t^{2}-3t+2$ est $t\mapsto\dfrac{t^{3}}{3}-\dfrac{3t^{2}}{2} +2t$, qui s'annule en $0$. Donc $H(x)=\dfrac{x^{3}}{3}-\dfrac{3x^{2}}{2}+2x$, d'où : 
    $$H(0)=0 \quad ; \quad H(1)=\frac{1}{3}-\frac{3}{2}+2=\frac{5}{6} \quad ; \quad H(2)=\frac{8}{3}-6+4=\frac{2}{3} \quad ; \quad H(3)=9-\frac{27}{2}+6=\frac{3}{2}$$

    ![Figure](documents/figures/a2e7c4e1c857d95e.svg)

    On remarquera que $H$ reste positive sur $[0\,;3]$ bien que la fonction intégrée soit négative sur $]1\,;2[$ : l'aire perdue entre $1$ et $2$ ne suffit pas à compenser celle gagnée avant.
