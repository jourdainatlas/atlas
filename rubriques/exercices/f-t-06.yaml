    On considère la fonction $f$ définie sur $[0\,;1]$ par $f(x)=\sqrt{1-x^{2}}$, et l'on note $\mathcal{D}$ le domaine situé sous sa courbe, au-dessus de l'axe des abscisses.

    **1.** Démontrer que la courbe de $f$ est un quart de cercle de centre $O$ et de rayon $1$. En déduire, sans aucun calcul d'intégrale, que $\displaystyle\int_{0}^{1}\sqrt{1-x^{2}}\, \mathrm{d}x=\dfrac{\pi}{4}$.

