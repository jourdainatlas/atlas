  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 260"
  page_enonce: 20
  page_corrige: 41
  enonce: |
    Soit $\alpha$ un réel strictement positif. Comme à l'exercice 46, on utilise les fonctions puissances de l'exercice 31 du chapitre 5. On pose, pour tout entier $n\geqslant 1$ : 
    $$S_{n}=\sum_{k=1}^{n}\frac{1}{k^{\alpha}}$$

    **1.** On suppose $\alpha>1$. Montrer que, pour tout entier $n\geqslant 1$, $S_{n}\leqslant\dfrac{\alpha}{\alpha-1}$.

    **2.** On suppose toujours $\alpha>1$. Montrer que la suite $(S_{n})$ est convergente et que sa limite appartient à l'intervalle $\left[\dfrac{1}{\alpha-1}\,;\dfrac{\alpha}{\alpha-1}\right]$.

    **3.** En utilisant l'exercice 37, montrer que, si $\alpha\in]0\,;1]$, la suite $(S_{n})$ tend vers $+\infty$.
  corrige: |
    D'après l'exercice 31 du chapitre 5, $\frac{1}{t^{\alpha}}=t^{-\alpha}$ et, pour $\alpha\neq 1$, une primitive de $t\mapsto t^{-\alpha}$ sur $]0\,;+\infty[$ est $t\mapsto\frac{t^{1-\alpha}}{1-\alpha}$. Comme $\alpha>0$, la fonction $t\mapsto\frac{1}{t^{\alpha}}$ est décroissante sur $]0\,;+\infty[$.

    **1.** Pour $k\geqslant 2$ et $t\in[k-1\,;k]$, on a $\frac{1}{k^{\alpha}}\leqslant\frac{1}{t^{\alpha}}$ ; l'intégration sur cet intervalle de longueur $1$ donne $\frac{1}{k^{\alpha}}\leqslant\int_{k-1}^{k}\frac{\mathrm{d}t}{t^{\alpha}}$. En sommant pour $k$ de $2$ à $n$ : 
    $$S_{n}-1\leqslant\int_{1}^{n}\frac{\mathrm{d}t}{t^{\alpha}} =\left[\frac{t^{1-\alpha}}{1-\alpha}\right]_{1}^{n}=\frac{1-n^{1-\alpha}}{\alpha-1} \leqslant\frac{1}{\alpha-1}$$
     car $n^{1-\alpha}>0$ et $\alpha-1>0$. Ainsi $S_{n}\leqslant 1+\dfrac{1}{\alpha-1}=\boxed{\dfrac{\alpha}{\alpha-1}}$.

    ![Figure](documents/figures/150fff95e18e7462.svg)

    Pour $\alpha=2$, cette figure montre les rectangles d'aires $\frac{1}{2^{2}}$, $\frac{1}{3^{2}}$, …, $\frac{1}{6^{2}}$ placés sous la courbe : leur aire totale $S_{6}-1$ est inférieure à l'aire sous la courbe entre $1$ et $6$, elle-même inférieure à $1$.

    **2.** On a $S_{n+1}-S_{n}=\frac{1}{(n+1)^{\alpha}}>0$ : la suite $(S_{n})$ est croissante. Elle est majorée par $\frac{\alpha}{\alpha-1}$ : d'après le théorème de convergence monotone, elle converge vers une limite $\ell\leqslant\frac{\alpha}{\alpha-1}$.

    Pour la minoration, on utilise cette fois les rectangles supérieurs : pour $k\geqslant 1$ et $t\in[k\,;k+1]$, $\frac{1}{k^{\alpha}}\geqslant\frac{1}{t^{\alpha}}$, d'où, en sommant pour $k$ de $1$ à $n$ : 
    $$S_{n}\geqslant\int_{1}^{n+1}\frac{\mathrm{d}t}{t^{\alpha}}=\frac{1-(n+1)^{1-\alpha}}{\alpha-1}$$
     Comme $1-\alpha<0$, $(n+1)^{1-\alpha}\to 0$, et le passage à la limite dans l'inégalité donne $\ell\geqslant\frac{1}{\alpha-1}$. 
    $$\boxed{(S_{n}) \text{ converge, et sa limite appartient à } \left[\frac{1}{\alpha-1}\,;\frac{\alpha}{\alpha-1}\right].}$$
     *Exemple.* Pour $\alpha=2$, la limite est comprise entre $1$ et $2$. Euler a démontré au XVIIIᵉ siècle qu'elle vaut exactement $\frac{\pi^{2}}{6}\approx 1{,}645$, un résultat célèbre et inattendu.

    **3.** Si $0<\alpha\leqslant 1$ et $k\geqslant 1$, alors $\alpha\ln(k)\leqslant\ln(k)$ car $\ln(k)\geqslant 0$, donc $k^{\alpha}=\mathrm{e}^{\alpha\ln(k)}\leqslant k$ et $\frac{1}{k^{\alpha}}\geqslant\frac{1}{k}$. En sommant, $S_{n}\geqslant H_{n}$, et $H_{n}\to+\infty$ d'après l'exercice 37. 
    $$\boxed{\text{Si } 0<\alpha\leqslant 1, \text{ la suite } (S_{n}) \text{ tend vers } +\infty.}$$

    *Remarque.* La valeur $\alpha=1$ est la frontière : la somme des $\frac{1}{k}$ devient infinie, celle des $\frac{1}{k^{1{,}01}}$ reste inférieure à $101$. C'est exactement la frontière observée pour les intégrales à l'exercice 41, et ce n'est pas un hasard : la comparaison entre somme et intégrale, utilisée tout au long de l'exercice, montre que la somme et l'intégrale ont le même comportement.
