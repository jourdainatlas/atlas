  enonce: |
    Soit $f$ une fonction continue sur $[1\,;+\infty[$ telle que, pour tout réel $t\geqslant 1$, $f(t)\geqslant\dfrac{1}{t}$. Montrer que 
    $$\lim_{x\to+\infty}\int_{1}^{x}f(t)\,\mathrm{d}t=+\infty$$
  corrige: |
    Soit $x\geqslant 1$. Sur l'intervalle $[1\,;x]$, on a $f(t)\geqslant\dfrac{1}{t}$, et les bornes sont dans le bon ordre : l'intégration conserve l'inégalité, donc 
    $$\int_{1}^{x}f(t)\,\mathrm{d}t\geqslant\int_{1}^{x}\frac{1}{t}\,\mathrm{d}t=\ln(x)$$
     Comme $\ln(x)\to+\infty$ quand $x\to+\infty$, le théorème de comparaison donne : 
    $$\boxed{\lim_{x\to+\infty}\int_{1}^{x}f(t)\,\mathrm{d}t=+\infty}$$
     *Remarque.* L'hypothèse $f(t)\geqslant\frac{1}{t}$ ne peut pas être affaiblie en $f(t)\geqslant\frac{1}{t^{2}}$ : on a $\int_{1}^{x}\frac{\mathrm{d}t}{t^{2}}=1-\frac{1}{x}$, qui tend vers $1$. La fonction $t\mapsto\frac{1}{t}$ est à la frontière entre les domaines infinis d'aire infinie et ceux d'aire finie, comme celui de l'exercice 35 ; l'exercice 48 précisera cette frontière pour les sommes.
