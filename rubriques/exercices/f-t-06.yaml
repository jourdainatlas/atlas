  page_corrige: 43
  enonce: |
    *L'inégalité de Tchebychev.* Soient $f$ et $g$ deux fonctions continues et croissantes sur $[0\,;1]$.

    **1.** Pour $x$ et $y$ dans $[0\,;1]$, quel est le signe de $\left(f(y)-f(x)\right)\left(g(y)-g(x)\right)$ ?

    **2.** En déduire que 
    $$\int_{0}^{1}f(t)\,\mathrm{d}t\times\int_{0}^{1}g(t)\,\mathrm{d}t\leqslant\int_{0}^{1} f(t)\,g(t)\,\mathrm{d}t$$

    **3.** Donner une version discrète, c'est-à-dire portant sur des sommes, de cette inégalité.
  corrige: |
    **1.** Si $x\leqslant y$, la croissance de $f$ et de $g$ donne $f(y)-f(x)\geqslant 0$ et $g(y)-g(x)\geqslant 0$ ; si $x\geqslant y$, ces deux nombres sont négatifs. Dans les deux cas, ils ont le même signe : 
    $$\boxed{\left(f(y)-f(x)\right)\left(g(y)-g(x)\right)\geqslant 0}$$

    **2.** Notons $I=\displaystyle\int_{0}^{1}f$, $J=\int_{0}^{1}g$ et $K=\int_{0}^{1}fg$. Fixons $y\in[0\,;1]$ et intégrons l'inégalité de la question 1 par rapport à $x$ sur $[0\,;1]$. En développant, et puisque $f(y)$ et $g(y)$ ne dépendent pas de $x$ : 
    $$\int_{0}^{1}\left(f(y)-f(x)\right)\left(g(y)-g(x)\right)\mathrm{d}x =f(y)g(y)-f(y)\,J-g(y)\,I+K\geqslant 0$$
     Cette inégalité est vraie pour tout $y\in[0\,;1]$, et son membre de gauche est une fonction continue de $y$. On l'intègre maintenant par rapport à $y$ sur $[0\,;1]$ : 
    $$K-I\,J-J\,I+K\geqslant 0 \iff 2K\geqslant 2IJ$$

    $$\boxed{\int_{0}^{1}f(t)\,\mathrm{d}t\times\int_{0}^{1}g(t)\,\mathrm{d}t\leqslant \int_{0}^{1}f(t)\,g(t)\,\mathrm{d}t}$$
     *Vérification :* avec $f(t)=g(t)=t$, on trouve $\frac{1}{2}\times\frac{1}{2}=\frac{1}{4} \leqslant\frac{1}{3}$.

    **3.** Si $a_1\leqslant a_2\leqslant\dots\leqslant a_n$ et $b_1\leqslant b_2\leqslant\dots \leqslant b_n$, alors 
    $$\boxed{\frac{a_1+\dots+a_n}{n}\times\frac{b_1+\dots+b_n}{n}\leqslant \frac{a_1b_1+\dots+a_nb_n}{n}}$$
     La démonstration est la même : on somme les $n^{2}$ produits $(a_i-a_j)(b_i-b_j)$, tous positifs, puis on développe, ce qui donne $2n\sum a_ib_i-2\sum a_i\sum b_i\geqslant 0$. Par exemple, avec $a=b=(1\,;2\,;3)$, on obtient $2\times 2=4\leqslant\frac{14}{3}$.

    *Remarque.* L'inégalité dit que, lorsque deux grandeurs varient dans le même sens, la moyenne de leur produit dépasse le produit de leurs moyennes. Si l'une est croissante et l'autre décroissante, le même raisonnement donne l'inégalité contraire. En probabilités, après le baccalauréat, on retrouvera cette idée sous le nom de covariance.

