  enonce: |
    Soit $f$ une fonction continue sur $[0\,;1]$. Pour tout entier naturel $n$, on pose 
    $$I_{n}=\int_{0}^{1}f(t)\,t^{n}\,\mathrm{d}t$$

    **1.** On suppose dans cette question que $f$ est à valeurs positives. Déterminer le signe de $I_{n}$, puis le sens de variation de la suite $(I_{n})$.

    **2.** On ne suppose plus $f$ positive, mais on admet qu'il existe un réel $M\geqslant 0$ tel que $|f(t)|\leqslant M$ pour tout $t\in[0\,;1]$. Majorer $|I_{n}|$ et montrer que la suite $(I_{n})$ converge vers $0$.
  corrige: |
    **1.** Pour $t\in[0\,;1]$, on a $f(t)\geqslant 0$ et $t^{n}\geqslant 0$ : la fonction intégrée est positive, et les bornes sont dans le bon ordre. 
    $$\boxed{I_{n}\geqslant 0}$$
     Par linéarité, $I_{n+1}-I_{n}=\displaystyle\int_{0}^{1}f(t)\,t^{n}(t-1)\,\mathrm{d}t$. Sur $[0\,;1]$, $f(t)\,t^{n}\geqslant 0$ et $t-1\leqslant 0$ : cette intégrale est négative. 
    $$\boxed{\text{La suite } (I_{n}) \text{ est décroissante.}}$$

    **2.** Pour $t\in[0\,;1]$, on a $t^{n}\geqslant 0$, donc, en multipliant l'encadrement $-M\leqslant f(t)\leqslant M$ par $t^{n}$ : 
    $$-M\,t^{n}\leqslant f(t)\,t^{n}\leqslant M\,t^{n}$$
     En intégrant sur $[0\,;1]$, et puisque $\displaystyle\int_{0}^{1}t^{n}\,\mathrm{d}t=\frac{1}{n+1}$ : 
    $$-\frac{M}{n+1}\leqslant I_{n}\leqslant\frac{M}{n+1} \qquad\text{soit}\qquad\boxed{|I_{n}|\leqslant\frac{M}{n+1}}$$
     Les deux bornes tendent vers $0$ : d'après le théorème des gendarmes, $\boxed{\displaystyle\lim_{n\to+\infty}I_{n}=0}$.

    *Remarque.* C'est la généralisation de l'exercice 29, où $f(t)=\mathrm{e}^{t}$ et $M=\mathrm{e}$. L'erreur la plus répandue est de raisonner ainsi : « $t^{n}$ tend vers $0$, donc l'intégrale tend vers $0$ ». Ce n'est pas une preuve, et d'ailleurs $t^{n}$ ne tend pas vers $0$ en $t=1$ : on ne peut pas faire entrer une limite sous le signe intégrale sans justification, et c'est l'encadrement qui la fournit.
- id: "t-06-43"
