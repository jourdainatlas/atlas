  page_enonce: 8
  page_corrige: 16
  enonce: |
    **1.** Soit $f(x)=\dfrac{1}{1+x}$ sur $[0\,;2]$.

    **(a)** Justifier que $f$ est décroissante sur $[0\,;2]$ et en déduire un encadrement de $f(x)$.

    **(b)** En déduire un encadrement de $\displaystyle\int_{0}^{2}\dfrac{1}{1+x}\,\mathrm{d}x$.

    **(c)** Calculer cette intégrale et vérifier l'encadrement.

    **2.** Encadrer $\displaystyle\int_{1}^{4}\sqrt{x}\,\mathrm{d}x$ à l'aide de l'inégalité de la moyenne sur $[1\,;4]$.

    **3.** On découpe maintenant $[1\,;4]$ en $[1\,;2]$ et $[2\,;4]$, et l'on applique l'inégalité de la moyenne sur chacun de ces deux intervalles.

    **(a)** Obtenir un nouvel encadrement de $\displaystyle\int_{1}^{4}\sqrt{x}\,\mathrm{d}x$, à $10^{-2}$ près.

    **(b)** Comparer les deux encadrements. Que peut-on en conclure sur l'intérêt du découpage ?

    **(c)** Calculer la valeur exacte de l'intégrale pour trancher.
  corrige: |
    **1.** **(a)** Pour $x\in[0\,;2]$, $1+x$ est strictement positif et croissant, donc son inverse est décroissant : $f$ est décroissante sur $[0\,;2]$. Elle est donc encadrée par ses valeurs aux bornes : 
    $$f(2)\leqslant f(x)\leqslant f(0) \qquad \text{soit} \qquad \boxed{\frac{1}{3}\leqslant\frac{1}{1+x}\leqslant 1}$$

    **(b)** L'inégalité de la moyenne sur $[0\,;2]$, intervalle de longueur $2$, donne : 
    $$\boxed{\frac{2}{3}\leqslant\int_{0}^{2}\frac{1}{1+x}\,\mathrm{d}x\leqslant 2}$$

    **(c)** Avec $u(x)=1+x>0$ et $u'(x)=1$ : 
    $$\int_{0}^{2}\frac{1}{1+x}\,\mathrm{d}x=\left[\ln(1+x)\right]_{0}^{2}=\ln(3)-\ln(1) =\boxed{\ln(3)\approx 1{,}099}$$
     On a bien $\dfrac{2}{3}\approx 0{,}67\leqslant 1{,}099\leqslant 2$.

    **2.** Sur $[1\,;4]$, la fonction racine est croissante, donc $1=\sqrt{1}\leqslant\sqrt{x}\leqslant\sqrt{4}=2$. L'intervalle a pour longueur $3$ : 
    $$\boxed{3\leqslant\int_{1}^{4}\sqrt{x}\,\mathrm{d}x\leqslant 6}$$

    **3.** **(a)** Sur $[1\,;2]$, de longueur $1$ : $1\leqslant\sqrt{x}\leqslant\sqrt{2}$, d'où $1\leqslant I_{1}\leqslant\sqrt{2}$.

    Sur $[2\,;4]$, de longueur $2$ : $\sqrt{2}\leqslant\sqrt{x}\leqslant 2$, d'où $2\sqrt{2}\leqslant I_{2}\leqslant 4$.

    La relation de Chasles donne $\displaystyle\int_{1}^{4}\sqrt{x}\,\mathrm{d}x=I_{1}+I_{2}$, d'où en additionnant les deux encadrements : 
    $$1+2\sqrt{2}\leqslant\int_{1}^{4}\sqrt{x}\,\mathrm{d}x\leqslant\sqrt{2}+4$$

    $$\boxed{3{,}82\leqslant\int_{1}^{4}\sqrt{x}\,\mathrm{d}x\leqslant 5{,}42}$$

    **(b)** L'amplitude est passée de $3$ à environ $1{,}59$ : elle a été divisée par presque $2$ avec un simple découpage en deux morceaux. 
    $$\boxed{\text{Découper l'intervalle améliore nettement l'encadrement}}$$
     C'est précisément le principe de la méthode des rectangles : plus le découpage est fin, plus l'encadrement se resserre.

    **(c)** Une primitive de $\sqrt{x}=x^{\frac{1}{2}}$ est $\dfrac{x^{\frac{3}{2}}}{\frac{3}{2}} =\dfrac{2}{3}x\sqrt{x}$, donc : 
    $$\int_{1}^{4}\sqrt{x}\,\mathrm{d}x=\left[\frac{2}{3}x\sqrt{x}\right]_{1}^{4} =\frac{2}{3}\times 8-\frac{2}{3}=\frac{16-2}{3}=\boxed{\frac{14}{3}\approx 4{,}667}$$
     Cette valeur appartient bien aux deux encadrements, mais le second la localise beaucoup mieux.
- id: "t-06-24"
  feuille: "f-t-06"
  numero: 24
  partie: "Propriétés de l'intégrale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale, aire, exponentielle]
  noeuds: [ar-riemann]
  notions: [riemann-integrable, exponentielle]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    **1.** Dans chaque cas, déterminer laquelle des deux courbes est au-dessus de l'autre sur l'intervalle indiqué, puis calculer l'aire du domaine compris entre elles.

    **(a)** $f(x)=x+2$ et $g(x)=x^{2}$ sur $[-1\,;2]$.

    **(b)** $f(x)=x^{2}$ et $g(x)=x^{3}$ sur $[0\,;1]$.

    **(c)** $f(x)=\mathrm{e}^{x}$ et $g(x)=1$ sur $[0\,;1]$.

    **2.** Calculer l'aire du domaine compris entre la courbe d'équation $y=4-x^{2}$ et l'axe des abscisses.

    **3.** Soit $f(x)=x^{2}-1$ sur $[0\,;2]$.

    **(a)** Calculer $\displaystyle\int_{0}^{2}\left(x^{2}-1\right)\mathrm{d}x$.

    **(b)** Calculer l'aire du domaine compris entre $\mathcal{C}_f$ et l'axe des abscisses sur $[0\,;2]$.

    **(c)** Comparer les deux résultats et expliquer la différence.
  corrige: |
    **1.** **(a)** On étudie le signe de $f(x)-g(x)=x+2-x^{2}$, trinôme de racines $-1$ et $2$ et de coefficient dominant négatif : il est donc positif entre ses racines, donc sur $[-1\,;2]$. **La courbe de $f$ est au-dessus de celle de $g$.** 
    $$\begin{aligned} \mathcal{A} &= \int_{-1}^{2}\left(x+2-x^{2}\right)\mathrm{d}x = \left[\frac{x^{2}}{2}+2x-\frac{x^{3}}{3}\right]_{-1}^{2} \\ &= \left(2+4-\frac{8}{3}\right)-\left(\frac{1}{2}-2+\frac{1}{3}\right) = \frac{10}{3}+\frac{7}{6}=\boxed{\frac{9}{2}=4{,}5} \end{aligned}$$

    **(b)** Sur $[0\,;1]$, $x^{3}\leqslant x^{2}$ : **la courbe de $f$ est au-dessus**. 
    $$\mathcal{A}=\int_{0}^{1}\left(x^{2}-x^{3}\right)\mathrm{d}x =\left[\frac{x^{3}}{3}-\frac{x^{4}}{4}\right]_{0}^{1}=\frac{1}{3}-\frac{1}{4} =\boxed{\frac{1}{12}}$$

    **(c)** Sur $[0\,;1]$, $\mathrm{e}^{x}\geqslant\mathrm{e}^{0}=1$ : **la courbe de $f$ est au-dessus**. 
    $$\mathcal{A}=\int_{0}^{1}\left(\mathrm{e}^{x}-1\right)\mathrm{d}x =\left[\mathrm{e}^{x}-x\right]_{0}^{1}=(\mathrm{e}-1)-1=\boxed{\mathrm{e}-2\approx 0{,}718}$$

    **2.** La parabole d'équation $y=4-x^{2}$ coupe l'axe des abscisses en $-2$ et $2$, et elle est au-dessus de cet axe entre ces deux valeurs : 
    $$\mathcal{A}=\int_{-2}^{2}\left(4-x^{2}\right)\mathrm{d}x =\left[4x-\frac{x^{3}}{3}\right]_{-2}^{2} =\left(8-\frac{8}{3}\right)-\left(-8+\frac{8}{3}\right)=16-\frac{16}{3} =\boxed{\frac{32}{3}\approx 10{,}67}$$

    **3.** **(a)** $\displaystyle\int_{0}^{2}\left(x^{2}-1\right)\mathrm{d}x =\left[\frac{x^{3}}{3}-x\right]_{0}^{2}=\frac{8}{3}-2=\boxed{\frac{2}{3}}$

    **(b)** La fonction change de signe en $x=1$ : elle est négative sur $[0\,;1]$ et positive sur $[1\,;2]$. L'aire s'obtient donc en découpant et en prenant l'opposé là où $f$ est négative : 
    $$\begin{aligned} \mathcal{A} &= \int_{0}^{1}\left(1-x^{2}\right)\mathrm{d}x + \int_{1}^{2}\left(x^{2}-1\right)\mathrm{d}x \\ &= \left[x-\frac{x^{3}}{3}\right]_{0}^{1}+\left[\frac{x^{3}}{3}-x\right]_{1}^{2} = \frac{2}{3}+\left(\frac{2}{3}-\left(-\frac{2}{3}\right)\right) \\ &= \frac{2}{3}+\frac{4}{3}=\boxed{2} \end{aligned}$$

    **(c)** Les deux résultats diffèrent : $\dfrac{2}{3}$ contre $2$. 
    $$\boxed{\text{L'intégrale compte négativement la partie située sous l'axe des abscisses}}$$
     Elle vaut ici $\dfrac{4}{3}-\dfrac{2}{3}=\dfrac{2}{3}$ : l'aire au-dessus de l'axe moins celle en dessous. L'aire géométrique, elle, additionne les deux. **Une intégrale n'est une aire que si la fonction garde un signe constant** : c'est le piège le plus fréquent du chapitre.
- id: "t-06-25"
  feuille: "f-t-06"
  numero: 25
  partie: "Propriétés de l'intégrale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [valeur moyenne, exponentielle]
  noeuds: []
  notions: [exponentielle]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Calculer la valeur moyenne de chacune des fonctions suivantes sur l'intervalle indiqué.

    **a)** $f(x)=x^{2}$ sur $[0\,;2]$

    **b)** $f(x)=2x+1$ sur $[1\,;4]$

    **c)** $f(x)=\mathrm{e}^{x}$ sur $[0\,;1]$

    **d)** $f(x)=\dfrac{1}{x}$ sur $[1\,;\mathrm{e}]$

    **e)** $f(x)=\sqrt{x}$ sur $[0\,;4]$

    **f)** $f(x)=x^{3}$ sur $[-1\,;1]$

    Déterminer enfin le réel $a>0$ tel que la valeur moyenne de la fonction $x\mapsto x$ sur $[0\,;a]$ soit égale à $3$.
  corrige: |
    On applique la définition $\mu=\dfrac{1}{b-a}\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$.

    **a)** $\mu=\dfrac{1}{2}\left[\dfrac{x^{3}}{3}\right]_{0}^{2}=\dfrac{1}{2}\times\dfrac{8}{3} =\boxed{\dfrac{4}{3}}$

    **b)** $\mu=\dfrac{1}{3}\left[x^{2}+x\right]_{1}^{4}=\dfrac{1}{3}(20-2)=\boxed{6}$

    **c)** $\mu=\dfrac{1}{1}\left[\mathrm{e}^{x}\right]_{0}^{1}=\boxed{\mathrm{e}-1\approx 1{,}718}$

    **d)** $\mu=\dfrac{1}{\mathrm{e}-1}\left[\ln(x)\right]_{1}^{\mathrm{e}}=\boxed{\dfrac{1}{\mathrm{e}-1}\approx 0{,}582}$

    **e)** $\mu=\dfrac{1}{4}\left[\dfrac{2}{3}x\sqrt{x}\right]_{0}^{4} =\dfrac{1}{4}\times\dfrac{16}{3}=\boxed{\dfrac{4}{3}}$

    **f)** $\mu=\dfrac{1}{2}\left[\dfrac{x^{4}}{4}\right]_{-1}^{1} =\dfrac{1}{2}\left(\dfrac{1}{4}-\dfrac{1}{4}\right)=\boxed{0}$

    Pour la dernière question, la valeur moyenne de $x\mapsto x$ sur $[0\,;a]$ vaut : 
    $$\mu=\frac{1}{a}\left[\frac{x^{2}}{2}\right]_{0}^{a}=\frac{1}{a}\times\frac{a^{2}}{2} =\frac{a}{2}$$
     On résout $\dfrac{a}{2}=3$, d'où $\boxed{a=6}$. C'est cohérent : sur $[0\,;6]$, la fonction varie linéairement de $0$ à $6$, sa moyenne est donc le milieu, $3$.
- id: "t-06-26"
  feuille: "f-t-06"
  numero: 26
  partie: "Propriétés de l'intégrale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [aire, exponentielle]
  noeuds: [ar-riemann]
  notions: [exponentielle]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Un mobile démarre à l'instant $t=0$ et sa vitesse, exprimée en mètres par seconde, est donnée pour $t\in[0\,;10]$ (en secondes) par : 
    $$v(t)=20-20\,\mathrm{e}^{-\frac{t}{2}}$$

    **1.** Calculer $v(0)$ et interpréter le résultat dans le contexte.

    **2.** Étudier les variations de $v$ sur $[0\,;10]$ et interpréter.

    **3.** L'axe des abscisses est gradué en secondes et celui des ordonnées en mètres par seconde. En quelle unité s'exprime alors l'aire sous la courbe de $v$ ? Que représente-t-elle ?

    **4.** Calculer la distance parcourue par le mobile pendant les dix premières secondes. On donnera la valeur exacte, puis une valeur approchée au centième.

    **5.** En déduire la vitesse moyenne du mobile sur $[0\,;10]$, arrondie au centième.

    **6.** Cette vitesse moyenne est-elle égale à $\dfrac{v(0)+v(10)}{2}$ ? Commenter.
  corrige: |
    **1.** $v(0)=20-20\mathrm{e}^{0}=20-20=\boxed{0 \text{ m}\cdot\text{s}^{-1}}$. C'est cohérent avec l'énoncé : **le mobile démarre à l'arrêt**, sa vitesse initiale est nulle.

    **2.** La fonction $t\mapsto\mathrm{e}^{-\frac{t}{2}}$ est décroissante, donc $-20\mathrm{e}^{-\frac{t}{2}}$ est croissante, et $v$ aussi : 
    $$\boxed{v \text{ est strictement croissante sur } [0\,;10]}$$
     Le mobile accélère continûment. On remarque de plus que $\mathrm{e}^{-\frac{t}{2}}$ tend vers $0$ : la vitesse se rapproche de $20$ m$\cdot$s$^{-1}$ sans jamais l'atteindre. C'est une vitesse limite.

    **3.** L'aire d'un rectangle du repère a pour dimensions $1$ seconde par $1$ m$\cdot$s$^{-1}$, soit $1$ mètre. 
    $$\boxed{\text{L'aire sous la courbe s'exprime en mètres : c'est la distance parcourue}}$$

    **4.** Une primitive de $v$ est $V(t)=20t+40\mathrm{e}^{-\frac{t}{2}}$, car la dérivée de $40\mathrm{e}^{-\frac{t}{2}}$ vaut $40\times\left(-\frac{1}{2}\right)\mathrm{e}^{-\frac{t}{2}} =-20\mathrm{e}^{-\frac{t}{2}}$. Donc : 
    $$\begin{aligned} d &= \int_{0}^{10}v(t)\,\mathrm{d}t=\left[20t+40\mathrm{e}^{-\frac{t}{2}}\right]_{0}^{10} \\ &= \left(200+40\mathrm{e}^{-5}\right)-\left(0+40\right) \\ &= \boxed{160+40\mathrm{e}^{-5}\approx 160{,}27 \text{ m}} \end{aligned}$$

    **5.** La valeur moyenne de $v$ sur $[0\,;10]$ est : 
    $$\mu=\frac{1}{10}\int_{0}^{10}v(t)\,\mathrm{d}t=\frac{160+40\mathrm{e}^{-5}}{10} \approx\boxed{16{,}03 \text{ m}\cdot\text{s}^{-1}}$$
     On retrouve la définition usuelle de la vitesse moyenne : distance parcourue divisée par durée.

    **6.** On calcule $v(10)=20-20\mathrm{e}^{-5}\approx 19{,}87$, donc : 
    $$\frac{v(0)+v(10)}{2}\approx\frac{0+19{,}87}{2}\approx 9{,}93\neq 16{,}03$$

    $$\boxed{\text{Non : la valeur moyenne n'est pas la moyenne des valeurs aux bornes}}$$
     Ce ne serait le cas que si $v$ était affine. Ici la vitesse croît très vite au début puis stagne près de $20$ : le mobile passe donc la majeure partie du trajet à une vitesse élevée, ce qui tire la moyenne vers le haut.
- id: "t-06-27"
  feuille: "f-t-06"
  numero: 27
  partie: "Intégration par parties"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale, intégration par parties, exponentielle, logarithme]
  noeuds: [ar-riemann, ar-tfa]
  notions: [riemann-integrable, exponentielle, logarithme]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Calculer les intégrales suivantes à l'aide d'une intégration par parties. On dressera à chaque fois le tableau des quatre fonctions $u$, $u'$, $v$ et $v'$.

    **a)** $\displaystyle\int_{0}^{1}x\,\mathrm{e}^{2x}\,\mathrm{d}x$

    **b)** $\displaystyle\int_{0}^{1}(x+1)\,\mathrm{e}^{x}\,\mathrm{d}x$

    **c)** $\displaystyle\int_{0}^{1}x\,\mathrm{e}^{-x}\,\mathrm{d}x$

    **d)** $\displaystyle\int_{1}^{2}x\ln(x)\,\mathrm{d}x$

    **e)** $\displaystyle\int_{0}^{1}(2x-1)\,\mathrm{e}^{x}\,\mathrm{d}x$
  corrige: |
    On rappelle la formule : $\displaystyle\int_{a}^{b}u(x)v'(x)\,\mathrm{d}x=\Big[u(x)v(x)\Big]_{a}^{b} -\int_{a}^{b}u'(x)v(x)\,\mathrm{d}x$.

    **a)** On choisit $u(x)=x$, qui se simplifie en dérivant. 
    $$\left\{\begin{array}{l} u(x)=x \\[2mm] u'(x)=1 \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{2x} \\[2mm] v(x)=\dfrac{\mathrm{e}^{2x}}{2} \end{array}\right.$$

    $$\begin{aligned} \int_{0}^{1}x\,\mathrm{e}^{2x}\,\mathrm{d}x &= \left[\frac{x\,\mathrm{e}^{2x}}{2}\right]_{0}^{1}-\int_{0}^{1}\frac{\mathrm{e}^{2x}}{2}\,\mathrm{d}x = \frac{\mathrm{e}^{2}}{2}-\left[\frac{\mathrm{e}^{2x}}{4}\right]_{0}^{1} \\ &= \frac{\mathrm{e}^{2}}{2}-\frac{\mathrm{e}^{2}}{4}+\frac{1}{4}=\boxed{\frac{\mathrm{e}^{2}+1}{4}\approx 2{,}097} \end{aligned}$$

    **b)** 
    $$\left\{\begin{array}{l} u(x)=x+1 \\[2mm] u'(x)=1 \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{x} \\[2mm] v(x)=\mathrm{e}^{x} \end{array}\right.$$

    $$\int_{0}^{1}(x+1)\mathrm{e}^{x}\,\mathrm{d}x=\Big[(x+1)\mathrm{e}^{x}\Big]_{0}^{1} -\int_{0}^{1}\mathrm{e}^{x}\,\mathrm{d}x=2\mathrm{e}-1-(\mathrm{e}-1)=\boxed{\mathrm{e}\approx 2{,}718}$$

    **c)** 
    $$\left\{\begin{array}{l} u(x)=x \\[2mm] u'(x)=1 \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{-x} \\[2mm] v(x)=-\mathrm{e}^{-x} \end{array}\right.$$

    $$\int_{0}^{1}x\,\mathrm{e}^{-x}\,\mathrm{d}x=\Big[-x\mathrm{e}^{-x}\Big]_{0}^{1} +\int_{0}^{1}\mathrm{e}^{-x}\,\mathrm{d}x=-\mathrm{e}^{-1}+\left(1-\mathrm{e}^{-1}\right) =\boxed{1-\frac{2}{\mathrm{e}}\approx 0{,}264}$$
     *Attention au double signe moins : $-\displaystyle\int u'v$ avec $v=-\mathrm{e}^{-x}$ redonne $+\displaystyle\int\mathrm{e}^{-x}$.*

    **d)** Ici c'est $\ln$ qu'il faut dériver : sa dérivée est bien plus simple que lui. 
    $$\left\{\begin{array}{l} u(x)=\ln(x) \\[2mm] u'(x)=\dfrac{1}{x} \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=x \\[2mm] v(x)=\dfrac{x^{2}}{2} \end{array}\right.$$

    $$\begin{aligned} \int_{1}^{2}x\ln(x)\,\mathrm{d}x &= \left[\frac{x^{2}}{2}\ln(x)\right]_{1}^{2}-\int_{1}^{2}\frac{1}{x}\times\frac{x^{2}}{2} \,\mathrm{d}x = 2\ln(2)-\int_{1}^{2}\frac{x}{2}\,\mathrm{d}x \\ &= 2\ln(2)-\left[\frac{x^{2}}{4}\right]_{1}^{2}=2\ln(2)-\left(1-\frac{1}{4}\right) = \boxed{2\ln(2)-\frac{3}{4}\approx 0{,}636} \end{aligned}$$

    **e)** 
    $$\left\{\begin{array}{l} u(x)=2x-1 \\[2mm] u'(x)=2 \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{x} \\[2mm] v(x)=\mathrm{e}^{x} \end{array}\right.$$

    $$\int_{0}^{1}(2x-1)\mathrm{e}^{x}\,\mathrm{d}x=\Big[(2x-1)\mathrm{e}^{x}\Big]_{0}^{1} -2\int_{0}^{1}\mathrm{e}^{x}\,\mathrm{d}x=\left(\mathrm{e}+1\right)-2(\mathrm{e}-1)=\boxed{3-\mathrm{e}\approx 0{,}282}$$
- id: "t-06-28"
  feuille: "f-t-06"
  numero: 28
  partie: "Intégration par parties"
  etoiles: 2
  types: [Calcul]
  mots_cles: [primitive, intégrale, exponentielle, logarithme]
  noeuds: [ar-tfa, ar-riemann]
  notions: [riemann-integrable, exponentielle, logarithme]
  page_enonce: 9
  page_corrige: 20
  enonce: |
    **1.** Calculer $\displaystyle\int_{1}^{3}\ln(x)\,\mathrm{d}x$. On écrira $\ln(x)=1\times\ln(x)$.

    **2.** En déduire une primitive de la fonction $\ln$ sur $\left]0\,;+\infty\right[$.

    **3.** Calculer $\displaystyle\int_{1}^{\mathrm{e}}\dfrac{\ln(x)}{x^{2}}\,\mathrm{d}x$.

    **4.** Calculer $\displaystyle\int_{1}^{\mathrm{e}}x^{2}\ln(x)\,\mathrm{d}x$.

    **5.** Que se passe-t-il, dans la question 4, si l'on choisit $u(x)=x^{2}$ et $v'(x)=\ln(x)$ ? Commenter.
  corrige: |
    **1.** En écrivant $\ln(x)=1\times\ln(x)$ : 
    $$\left\{\begin{array}{l} u(x)=\ln(x) \\[2mm] u'(x)=\dfrac{1}{x} \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=1 \\[2mm] v(x)=x \end{array}\right.$$

    $$\begin{aligned} \int_{1}^{3}\ln(x)\,\mathrm{d}x &= \Big[x\ln(x)\Big]_{1}^{3} -\int_{1}^{3}\frac{1}{x}\times x\,\mathrm{d}x = 3\ln(3)-0-\int_{1}^{3}1\,\mathrm{d}x \\ &= 3\ln(3)-\Big[x\Big]_{1}^{3}=3\ln(3)-2\approx\boxed{1{,}296} \end{aligned}$$

    **2.** Le calcul précédent montre qu'une primitive de $\ln$ est $x\mapsto x\ln(x)-x$. On le vérifie en dérivant : 
    $$\left(x\ln(x)-x\right)'=\ln(x)+x\times\frac{1}{x}-1=\ln(x)$$

    $$\boxed{\text{Une primitive de } \ln \text{ sur } \left]0\,;+\infty\right[ \text{ est } x\mapsto x\ln(x)-x}$$
     C'est le seul moyen d'obtenir cette primitive : elle ne figure dans aucun tableau.

    **3.** 
    $$\left\{\begin{array}{l} u(x)=\ln(x) \\[2mm] u'(x)=\dfrac{1}{x} \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\dfrac{1}{x^{2}} \\[2mm] v(x)=-\dfrac{1}{x} \end{array}\right.$$

    $$\begin{aligned} \int_{1}^{\mathrm{e}}\frac{\ln(x)}{x^{2}}\,\mathrm{d}x &= \left[-\frac{\ln(x)}{x}\right]_{1}^{\mathrm{e}}+\int_{1}^{\mathrm{e}}\frac{1}{x}\times\frac{1}{x} \,\mathrm{d}x = -\frac{1}{\mathrm{e}}+\left[-\frac{1}{x}\right]_{1}^{\mathrm{e}} \\ &= -\frac{1}{\mathrm{e}}-\frac{1}{\mathrm{e}}+1=\boxed{1-\frac{2}{\mathrm{e}}\approx 0{,}264} \end{aligned}$$

    **4.** 
    $$\left\{\begin{array}{l} u(x)=\ln(x) \\[2mm] u'(x)=\dfrac{1}{x} \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=x^{2} \\[2mm] v(x)=\dfrac{x^{3}}{3} \end{array}\right.$$

    $$\begin{aligned} \int_{1}^{\mathrm{e}}x^{2}\ln(x)\,\mathrm{d}x &= \left[\frac{x^{3}}{3}\ln(x)\right]_{1}^{\mathrm{e}}-\int_{1}^{\mathrm{e}}\frac{x^{2}}{3}\,\mathrm{d}x = \frac{\mathrm{e}^{3}}{3}-\left[\frac{x^{3}}{9}\right]_{1}^{\mathrm{e}} \\ &= \frac{\mathrm{e}^{3}}{3}-\frac{\mathrm{e}^{3}}{9}+\frac{1}{9}=\boxed{\frac{2\mathrm{e}^{3}+1}{9}\approx 4{,}575} \end{aligned}$$

    **5.** Avec $u(x)=x^{2}$ et $v'(x)=\ln(x)$, il faudrait d'abord trouver une primitive de $\ln$, soit $v(x)=x\ln(x)-x$, puis calculer : 
    $$\Big[x^{2}\left(x\ln(x)-x\right)\Big]_{1}^{\mathrm{e}} -\int_{1}^{\mathrm{e}}2x\left(x\ln(x)-x\right)\mathrm{d}x$$
     La nouvelle intégrale fait réapparaître un terme en $x^{2}\ln(x)$ : elle est **plus compliquée** que celle de départ. 
    $$\boxed{\text{Ce choix est mauvais : on complique au lieu de simplifier}}$$
     C'est la règle générale rappelée par le cours : on dérive le facteur qui se simplifie ($\ln$ ou un polynôme), on primitive l'autre.
- id: "t-06-29"
  feuille: "f-t-06"
  numero: 29
  partie: "Intégration par parties"
  etoiles: 3
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [intégrale, intégration par parties, exponentielle, "suite d'intégrales", limite]
  noeuds: [ar-riemann, ar-tfa, ar-suites]
  notions: [riemann-integrable, exponentielle, suite]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    **Partie A.**

    **1.** Calculer $\displaystyle\int_{0}^{1}x\,\mathrm{e}^{x}\,\mathrm{d}x$.

    **2.** En déduire, à l'aide d'une seconde intégration par parties, la valeur de $\displaystyle\int_{0}^{1}x^{2}\,\mathrm{e}^{x}\,\mathrm{d}x$.

    **Partie B.** On pose, pour tout entier naturel $n$ : 
    $$I_{n}=\int_{0}^{1}x^{n}\,\mathrm{e}^{x}\,\mathrm{d}x$$

    **1.** Calculer $I_{0}$.

    **2.** À l'aide d'une intégration par parties, démontrer que pour tout entier naturel $n$ : 
    $$I_{n+1}=\mathrm{e}-(n+1)\,I_{n}$$

    **3.** En déduire les valeurs exactes de $I_{1}$, $I_{2}$ et $I_{3}$, et vérifier la cohérence avec la partie A.

    **4.** Justifier que pour tout entier naturel $n$ et tout $x$ de $[0\,;1]$ : 
    $$0\leqslant x^{n}\,\mathrm{e}^{x}\leqslant \mathrm{e}\,x^{n}$$

    **5.** En déduire que $0\leqslant I_{n}\leqslant\dfrac{\mathrm{e}}{n+1}$, puis déterminer $\displaystyle\lim_{n\to+\infty}I_{n}$.

    **6.** Interpréter graphiquement ce résultat.
  corrige: |
    **Partie A.**

    **1.** 
    $$\left\{\begin{array}{l} u(x)=x \\[2mm] u'(x)=1 \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{x} \\[2mm] v(x)=\mathrm{e}^{x} \end{array}\right.$$

    $$\int_{0}^{1}x\,\mathrm{e}^{x}\,\mathrm{d}x=\Big[x\mathrm{e}^{x}\Big]_{0}^{1}-\int_{0}^{1}\mathrm{e}^{x}\,\mathrm{d}x =\mathrm{e}-(\mathrm{e}-1)=\boxed{1}$$

    **2.** On recommence avec $u(x)=x^{2}$ : 
    $$\int_{0}^{1}x^{2}\,\mathrm{e}^{x}\,\mathrm{d}x=\Big[x^{2}\mathrm{e}^{x}\Big]_{0}^{1} -\int_{0}^{1}2x\,\mathrm{e}^{x}\,\mathrm{d}x=\mathrm{e}-2\int_{0}^{1}x\,\mathrm{e}^{x}\,\mathrm{d}x =\mathrm{e}-2\times 1=\boxed{\mathrm{e}-2\approx 0{,}718}$$
     La première intégration par parties n'a pas suffi : elle a seulement abaissé l'exposant de $2$ à $1$. C'est la question 1 qui achève le calcul.

    **Partie B.**

    **1.** $\displaystyle I_{0}=\int_{0}^{1}x^{0}\,\mathrm{e}^{x}\,\mathrm{d}x=\int_{0}^{1}\mathrm{e}^{x}\, \mathrm{d}x=\Big[\mathrm{e}^{x}\Big]_{0}^{1}=\boxed{\mathrm{e}-1\approx 1{,}718}$

    **2.** Soit $n$ un entier naturel. On pose : 
    $$\left\{\begin{array}{l} u(x)=x^{n+1} \\[2mm] u'(x)=(n+1)x^{n} \end{array}\right. \qquad\qquad \left\{\begin{array}{l} v'(x)=\mathrm{e}^{x} \\[2mm] v(x)=\mathrm{e}^{x} \end{array}\right.$$

    $$\begin{aligned} I_{n+1}=\int_{0}^{1}x^{n+1}\mathrm{e}^{x}\,\mathrm{d}x &= \Big[x^{n+1}\mathrm{e}^{x}\Big]_{0}^{1}-\int_{0}^{1}(n+1)x^{n}\mathrm{e}^{x}\,\mathrm{d}x \\ &= \left(1^{n+1}\mathrm{e}-0\right)-(n+1)\int_{0}^{1}x^{n}\mathrm{e}^{x}\,\mathrm{d}x \end{aligned}$$

    $$\boxed{I_{n+1}=\mathrm{e}-(n+1)\,I_{n}}$$

    **3.** On applique la relation de proche en proche : 
    $$I_{1}=\mathrm{e}-1\times I_{0}=\mathrm{e}-(\mathrm{e}-1)=\boxed{1}$$

    $$I_{2}=\mathrm{e}-2\times I_{1}=\mathrm{e}-2=\boxed{\mathrm{e}-2\approx 0{,}718}$$

    $$I_{3}=\mathrm{e}-3\times I_{2}=\mathrm{e}-3(\mathrm{e}-2)=\boxed{6-2\mathrm{e}\approx 0{,}563}$$
     On retrouve exactement les deux valeurs de la partie A : $I_{1}=1$ et $I_{2}=\mathrm{e}-2$.

    **4.** Soit $x\in[0\,;1]$. D'une part $x^{n}\geqslant 0$ et $\mathrm{e}^{x}>0$, donc le produit est positif. D'autre part, la fonction exponentielle étant croissante et $x\leqslant 1$ : $\mathrm{e}^{x}\leqslant\mathrm{e}$. En multipliant par $x^{n}\geqslant 0$, ce qui conserve l'ordre : 
    $$\boxed{0\leqslant x^{n}\mathrm{e}^{x}\leqslant\mathrm{e}\,x^{n}}$$

    **5.** On intègre cet encadrement sur $[0\,;1]$, les bornes étant dans le bon ordre : 
    $$0\leqslant I_{n}\leqslant\int_{0}^{1}\mathrm{e}\,x^{n}\,\mathrm{d}x =\mathrm{e}\left[\frac{x^{n+1}}{n+1}\right]_{0}^{1}=\frac{\mathrm{e}}{n+1}$$

    $$\boxed{0\leqslant I_{n}\leqslant\frac{\mathrm{e}}{n+1}}$$
     Or $\displaystyle\lim_{n\to+\infty}\frac{\mathrm{e}}{n+1}=0$. Le théorème des gendarmes donne alors : 
    $$\boxed{\lim_{n\to+\infty}I_{n}=0}$$

    **6.** $I_{n}$ est l'aire du domaine situé sous la courbe de $x\mapsto x^{n}\mathrm{e}^{x}$ sur $[0\,;1]$. Or sur cet intervalle, $x^{n}$ tend vers $0$ pour tout $x<1$ lorsque $n$ grandit : la courbe s'écrase sur l'axe des abscisses, ne se relevant que sur un voisinage de plus en plus étroit de $1$. 
    $$\boxed{\text{L'aire sous la courbe tend donc vers } 0}$$
- id: "t-06-30"
