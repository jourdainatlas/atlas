    On cherche à approcher $\displaystyle I=\int_{1}^{2}\frac{1}{x}\,\mathrm{d}x$ en partageant $[1\,;2]$ en $n=4$ intervalles de même longueur $h=0{,}25$. On note $x_{0}=1$, $x_{1}=1{,}25$, $x_{2}=1{,}5$, $x_{3}=1{,}75$ et $x_{4}=2$.

    Quatre méthodes sont envisagées. Sur chaque petit intervalle $[x_{k}\,;x_{k+1}]$, on remplace le domaine sous la courbe par :

    • un rectangle de hauteur $f(x_{k})$ (méthode des rectangles **à gauche**) ;

    • un rectangle de hauteur $f(x_{k+1})$ (méthode des rectangles **à droite**) ;

    • un rectangle de hauteur $f\!\left(\dfrac{x_{k}+x_{k+1}}{2}\right)$ (méthode des **milieux**) ;

    • un trapèze de bases $f(x_{k})$ et $f(x_{k+1})$ (méthode des **trapèzes**).

    **1.** Faire un schéma illustrant chacune des quatre méthodes sur un seul intervalle.

    **2.** Calculer les approximations $G$ (rectangles à gauche) et $D$ (rectangles à droite) de $I$. On donnera des valeurs approchées au millième.

    **3.** Calculer l'approximation $M$ par la méthode des milieux. On donnera d'abord les valeurs exactes de $f$ aux quatre milieux.

    **4.** Démontrer que l'approximation $T$ par la méthode des trapèzes vérifie $T=\dfrac{G+D}{2}$, puis la calculer.

    *On rappelle que l'aire d'un trapèze de bases $b$ et $B$ et de hauteur $h$ vaut $\dfrac{(b+B)h}{2}$.*

    **5.** Calculer la valeur exacte de $I$, puis l'erreur commise par chacune des quatre méthodes. Les classer de la moins précise à la plus précise.

    **6.** Les méthodes des milieux et des trapèzes encadrent-elles $I$ ? Expliquer, à l'aide d'un schéma, pourquoi la méthode des milieux est ici bien meilleure que celle des rectangles : quelle compensation se produit sur chaque intervalle ?

    **7.** Recopier et compléter la fonction Python ci-dessous, qui renvoie l'approximation de $\displaystyle\int_{a}^{b}f(x)\,\mathrm{d}x$ obtenue par la méthode des milieux avec $n$ intervalles. Les pointillés sont à remplacer par les expressions manquantes.

    ```python
    def milieux(f, a, b, n):
        h = ...
        S = 0
        for k in range(n):
            m = ...
            S = S + f(m)
        return ...
    ```

    **8.** On définit en Python la fonction `g` par `def g(x): return 1/x`. Que renvoie l'appel `milieux(g, 1, 2, 4)` ? Et que renvoie, d'après vous, `milieux(g, 1, 2, 1000)` ?
  corrige: |
    **1.** Sur un intervalle $[x_{k}\,;x_{k+1}]$, les quatre constructions se comparent ainsi :

    ![Figure](documents/figures/0bb72dd00dbf6283.svg)

    On voit déjà que le rectangle de gauche déborde largement, celui de droite manque une bande tout aussi large, alors que le rectangle des milieux et le trapèze épousent la courbe de très près.

    **2.** Les cinq valeurs utiles sont $f(1)=1$, $f(1{,}25)=0{,}8$, $f(1{,}5)=\dfrac{2}{3}\approx 0{,}667$, $f(1{,}75)=\dfrac{4}{7}\approx 0{,}571$ et $f(2)=0{,}5$. Chaque rectangle ayant pour largeur $h=0{,}25$ : 
    $$G=0{,}25\times\left(1+0{,}8+\frac{2}{3}+\frac{4}{7}\right)\approx\boxed{0{,}760}$$

    $$D=0{,}25\times\left(0{,}8+\frac{2}{3}+\frac{4}{7}+0{,}5\right)\approx\boxed{0{,}635}$$

    **3.** Les quatre milieux sont $\dfrac{9}{8}$, $\dfrac{11}{8}$, $\dfrac{13}{8}$ et $\dfrac{15}{8}$, en lesquels $f$ vaut respectivement $\dfrac{8}{9}$, $\dfrac{8}{11}$, $\dfrac{8}{13}$ et $\dfrac{8}{15}$. 
    $$M=0{,}25\times\left(\frac{8}{9}+\frac{8}{11}+\frac{8}{13}+\frac{8}{15}\right) \approx\boxed{0{,}691}$$

    **4.** Sur $[x_{k}\,;x_{k+1}]$, le trapèze a pour bases $f(x_{k})$ et $f(x_{k+1})$ et pour hauteur $h$ : son aire vaut $\dfrac{\big(f(x_{k})+f(x_{k+1})\big)h}{2}$, c'est-à-dire la **moyenne** des aires des deux rectangles. En sommant sur les quatre intervalles : 
    $$\boxed{T=\frac{G+D}{2}}$$

    $$T=\frac{0{,}7595+0{,}6345}{2}\approx\boxed{0{,}697}$$

    **5.** $\displaystyle I=\int_{1}^{2}\frac{1}{x}\,\mathrm{d}x=\Big[\ln(x)\Big]_{1}^{2} =\ln(2)\approx 0{,}693147$. Les erreurs commises sont :

    ```tableau
    **Méthode** ¦ gauche ¦ droite ¦ trapèzes ¦ milieux
    **Valeur** ¦ $0{,}759524$ ¦ $0{,}634524$ ¦ $0{,}697024$ ¦ $0{,}691220$
    **Erreur** ¦ $+6{,}6\times 10^{-2}$ ¦ $-5{,}9\times 10^{-2}$ ¦ $+3{,}9\times 10^{-3}$ ¦ $-1{,}9\times 10^{-3}$
    ```

    $$\boxed{\text{De la moins précise à la plus précise : gauche, droite, trapèzes, milieux}}$$

    **6.** Oui : $M\approx 0{,}6912<\ln(2)<0{,}6970\approx T$, donc $\boxed{M\leqslant I\leqslant T}$. La fonction inverse étant convexe sur $[1\,;2]$, sa courbe est en dessous de chacune de ses cordes — d'où $T$ trop grand — et au-dessus de chacune de ses tangentes — d'où $M$ trop petit.

    Sur la figure de la question 1, le rectangle des milieux a la même aire que le trapèze construit sur la *tangente* au point milieu : la portion de courbe qui dépasse à gauche compense presque exactement celle qui manque à droite. 
    $$\boxed{\text{La méthode des milieux bénéficie d'une compensation, pas celle des rectangles}}$$
     C'est ce qui explique le facteur $30$ entre les deux erreurs, pour le même nombre de calculs.

    **7.** 

    ```python
    def milieux(f, a, b, n):
        h = (b - a) / n
        S = 0
        for k in range(n):
            m = a + (k + 0.5) * h
            S = S + f(m)
        return h * S
    ```

    **8.** L'appel `milieux(g, 1, 2, 4)` reprend exactement le calcul de la question 3 : 
    $$\boxed{\texttt{milieux(g, 1, 2, 4)} \approx 0{,}691\,220}$$
     Avec $n=1\,000$, le découpage est $250$ fois plus fin : 
    $$\boxed{\texttt{milieux(g, 1, 2, 1000)} \approx 0{,}693\,147\,1}$$
     soit $\ln(2)$ à $3\times 10^{-8}$ près.
