  page_enonce: 7
  page_corrige: 15
  enonce: |
    On pose $E = \{a \;;\; b \;;\; c \;;\; d\}$.

    **1.** Écrire $\mathcal{P}(E)$ en rangeant ses éléments par nombre d'éléments croissant, et vérifier le résultat annoncé dans le cours pour le nombre de parties.

    **2.** Combien de parties de $E$ contiennent l'élément $a$ ? Les décrire, puis expliquer le lien avec l'ensemble $\mathcal{P}\big(\{b \;;\; c \;;\; d\}\big)$.

    **3.** Dire si les propositions suivantes sont vraies ou fausses, en justifiant :

    **(a)** $\varnothing \in \mathcal{P}(E)$

    **(b)** $\varnothing \subset \mathcal{P}(E)$

    **(c)** $E \in \mathcal{P}(E)$

    **(d)** $a \in \mathcal{P}(E)$

    **(e)** $\{a\} \in \mathcal{P}(E)$

    **(f)** $\big\{\{a\}\big\} \subset \mathcal{P}(E)$
  corrige: |
    **1.** On range les parties par nombre d'éléments croissant : 
    $$\boxed{\begin{array}{ll} \text{à } 0 \text{ élément :} & \varnothing \\[1mm] \text{à } 1 \text{ élément :} & \{a\} \;;\; \{b\} \;;\; \{c\} \;;\; \{d\} \\[1mm] \text{à } 2 \text{ éléments :} & \{a\,;b\} \;;\; \{a\,;c\} \;;\; \{a\,;d\} \;;\; \{b\,;c\} \;;\; \{b\,;d\} \;;\; \{c\,;d\} \\[1mm] \text{à } 3 \text{ éléments :} & \{a\,;b\,;c\} \;;\; \{a\,;b\,;d\} \;;\; \{a\,;c\,;d\} \;;\; \{b\,;c\,;d\} \\[1mm] \text{à } 4 \text{ éléments :} & E \end{array}}$$
     On compte $1 + 4 + 6 + 4 + 1 = 16$ parties, et $2^{4} = 16$ : le résultat du cours est vérifié.

    **2.** Une partie de $E$ contenant $a$ s'écrit de façon unique $\{a\} \cup X$, où $X$ est une partie de $\{b \;;\; c \;;\; d\}$. En lisant la liste précédente, ce sont : 
    $$\{a\} \;;\; \{a\,;b\} \;;\; \{a\,;c\} \;;\; \{a\,;d\} \;;\; \{a\,;b\,;c\} \;;\; \{a\,;b\,;d\} \;;\; \{a\,;c\,;d\} \;;\; E$$

    $$\boxed{\text{Il y en a } 8, \text{ soit exactement le nombre d'éléments de } \mathcal{P}\big(\{b \;;\; c \;;\; d\}\big) = 2^{3}.}$$
     Le procédé « ajouter $a$ » associe à chaque partie de $\{b \;;\; c \;;\; d\}$ une et une seule partie de $E$ contenant $a$ : les deux collections ont donc le même nombre d'éléments.

    **3.** **(a)** $\boxed{\textbf{Vraie}}$ : $\varnothing$ est une partie de $E$, donc un élément de $\mathcal{P}(E)$.

    **(b)** $\boxed{\textbf{Vraie}}$ : l'ensemble vide est inclus dans tout ensemble, en particulier dans $\mathcal{P}(E)$.

    **(c)** $\boxed{\textbf{Vraie}}$ : $E$ est une partie de lui-même.

    **(d)** $\boxed{\textbf{Fausse}}$ : $a$ est un *élément* de $E$, pas une partie. C'est $\{a\}$ qui appartient à $\mathcal{P}(E)$.

    **(e)** $\boxed{\textbf{Vraie}}$ : $\{a\}$ est bien une partie de $E$.

    **(f)** $\boxed{\textbf{Vraie}}$ : l'unique élément de $\big\{\{a\}\big\}$ est $\{a\}$, qui appartient à $\mathcal{P}(E)$ d'après **(e)**.

    *Piège :* les affirmations **(a)** et **(b)** sont toutes deux vraies mais ne disent pas la même chose. Dans $\mathcal{P}(E)$, l'ensemble vide joue les deux rôles : il en est un élément, et il en est aussi une partie.
- id: "ap-01-28"
