- id: "ap-01-01"
  feuille: "f-ap-01"
  numero: 1
  partie: "Propositions et connecteurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [propositions]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacun des énoncés suivants, dire s'il s'agit d'une proposition. Le cas échéant, donner sa valeur de vérité en justifiant.

    **1.** $3 + 4 = 8$

    **2.** $x^{2} - 1$

    **3.** Tout entier naturel est positif ou nul.

    **4.** $\sqrt{2} \in \mathbb{Q}$

    **5.** Soit $n$ un entier naturel.

    **6.** $n^{2} \geqslant n$

    **7.** Pour tout entier naturel $n$, on a $n^{2} \geqslant n$.

    **8.** Pour tout réel $x$, on a $x^{2} \geqslant x$.
  corrige: |
    **1.** L'égalité $3 + 4 = 8$ peut être qualifiée de vraie ou de fausse : c'est une proposition. Or $3 + 4 = 7$, donc : 
    $$\boxed{\text{Proposition } \textbf{Fausse}}$$

    **2.** L'écriture $x^{2} - 1$ ne peut être ni vraie ni fausse. 
    $$\boxed{\text{Ce n'est pas une proposition, mais une expression.}}$$

    **3.** Tout entier naturel est supérieur ou égal à $0$ : 
    $$\boxed{\text{Proposition } \textbf{Vraie}}$$

    **4.** Le cours démontre que $\sqrt{2}$ est irrationnel : 
    $$\boxed{\text{Proposition } \textbf{Fausse}}$$

    **5.** « Soit $n$ un entier naturel » introduit une notation ; on ne peut pas lui attribuer de valeur de vérité. 
    $$\boxed{\text{Ce n'est pas une proposition.}}$$

    **6.** L'énoncé $n^{2} \geqslant n$ dépend de $n$, qui n'est ici ni fixé ni quantifié : il est vrai pour $n = 2$, faux pour $n = \frac{1}{2}$. 
    $$\boxed{\text{Ce n'est pas une proposition, mais un \emph{prédicat} : une proposition dépendant d'une variable.}}$$

    **7.** Le quantificateur fixe désormais le statut de $n$. Pour $n = 0$ et $n = 1$ on a $n^{2} = n$ ; pour $n \geqslant 2$, on a $n^{2} = n \times n \geqslant n \times 1 = n$. 
    $$\boxed{\text{Proposition } \textbf{Vraie}}$$

    **8.** On procède de la même manière, mais sur $\mathbb{R}$. Pour $x = \dfrac{1}{2}$ : 
    $$x^{2} = \frac{1}{4} < \frac{1}{2} = x$$

    $$\boxed{\text{Proposition } \textbf{Fausse}}$$

    *Piège :* les énoncés 6 et 7 diffèrent d'un seul mot. C'est le quantificateur qui transforme un prédicat en proposition ; sans lui, la question « est-ce vrai ? » n'a pas de sens.
- id: "ap-01-02"
  feuille: "f-ap-01"
  numero: 2
  partie: "Propositions et connecteurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [propositions, connecteurs et tables de vérité, implication, équivalence]
  noeuds: [l-connecteurs]
  notions: [connecteur]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soient $A$ et $B$ deux propositions. Dresser la table de vérité de chacune des propositions suivantes.

    **1.** $(\text{non } A) \text{ ou } B$

    **2.** $\text{non}(A \text{ et } (\text{non } B))$

    **3.** $(A \Rightarrow B) \text{ et } (B \Rightarrow A)$

    **4.** $A \text{ et } (\text{non } A)$

    **5.** Comparer les colonnes obtenues aux questions 1 et 2 avec celle de $A \Rightarrow B$, puis celle de la question 3 avec celle de $A \Leftrightarrow B$. Que peut-on en conclure ?

    **6.** Que remarque-t-on à la question 4 ?
  corrige: |
    On dresse les tables demandées, en y ajoutant les colonnes de $A \Rightarrow B$ et de $A \Leftrightarrow B$ nécessaires aux comparaisons. Les deux premières propositions donnent :

    $$\begin{array}{|c|c||c|c||c|c||c|} \hline A & B & \text{non } A & \text{non } B & (\text{non } A) \text{ ou } B & \text{non}(A \text{ et } \text{non } B) & A \Rightarrow B \\ \hline \text{V} & \text{V} & \text{F} & \text{F} & \text{V} & \text{V} & \text{V} \\ \hline \text{V} & \text{F} & \text{F} & \text{V} & \text{F} & \text{F} & \text{F} \\ \hline \text{F} & \text{V} & \text{V} & \text{F} & \text{V} & \text{V} & \text{V} \\ \hline \text{F} & \text{F} & \text{V} & \text{V} & \text{V} & \text{V} & \text{V} \\ \hline \end{array}$$

    puis les deux dernières :

    $$\begin{array}{|c|c||c|c|c||c||c|} \hline A & B & A \Rightarrow B & B \Rightarrow A & (A \Rightarrow B) \text{ et } (B \Rightarrow A) & A \Leftrightarrow B & A \text{ et } (\text{non } A) \\ \hline \text{V} & \text{V} & \text{V} & \text{V} & \text{V} & \text{V} & \text{F} \\ \hline \text{V} & \text{F} & \text{F} & \text{V} & \text{F} & \text{F} & \text{F} \\ \hline \text{F} & \text{V} & \text{V} & \text{F} & \text{F} & \text{F} & \text{F} \\ \hline \text{F} & \text{F} & \text{V} & \text{V} & \text{V} & \text{V} & \text{F} \\ \hline \end{array}$$

    **5.** Les colonnes des questions 1 et 2 sont identiques à celle de $A \Rightarrow B$, et celle de la question 3 est identique à celle de $A \Leftrightarrow B$ : 
    $$\boxed{\begin{array}{l} (A \Rightarrow B) \;\Leftrightarrow\; \big((\text{non } A) \text{ ou } B\big) \;\Leftrightarrow\; \text{non}(A \text{ et } \text{non } B) \\[1mm] (A \Leftrightarrow B) \;\Leftrightarrow\; \big((A \Rightarrow B) \text{ et } (B \Rightarrow A)\big) \end{array}}$$
     La seconde équivalence justifie le schéma de rédaction en deux temps donné dans le cours.

    **6.** La colonne de $A \text{ et } (\text{non } A)$ ne contient que des F : 
    $$\boxed{\text{Cette proposition est fausse quelles que soient les valeurs de vérité de } A.}$$
     Une proposition toujours fausse est appelée une *contradiction* ; une proposition toujours vraie, comme $A$ ou $(\text{non } A)$, est appelée une *tautologie*.
- id: "ap-01-03"
  feuille: "f-ap-01"
  numero: 3
  partie: "Propositions et connecteurs"
  etoiles: 1
