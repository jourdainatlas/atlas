  page_corrige: 2
  enonce: |
    Écrire la négation de chacune des propositions suivantes, en évitant toute formulation du type « il est faux que ».

    **1.** $x \geqslant 0$ et $y < 1$.

    **2.** L'entier $n$ est pair ou premier.

    **3.** Le réel $a$ est rationnel et strictement positif.

    **4.** $x \in [0\;;1]$.

    **5.** Le nombre $n$ est divisible par $2$ et par $3$.

    **6.** La suite $(u_{n})$ est croissante ou majorée.
  corrige: |
    On applique les lois de De Morgan : la négation échange le « et » et le « ou », et nie chacun des deux membres.

    $$\textbf{1.}\quad \boxed{x < 0 \;\text{ ou }\; y \geqslant 1} \qquad\qquad \textbf{2.}\quad \boxed{n \text{ est impair et } n \text{ n'est pas premier}}$$

    $$\textbf{3.}\quad \boxed{a \text{ est irrationnel ou } a \leqslant 0} \qquad\qquad \textbf{4.}\quad \boxed{x < 0 \;\text{ ou }\; x > 1}$$

    $$\textbf{5.}\quad \boxed{n \text{ n'est pas divisible par } 2 \text{ ou } n \text{ n'est pas divisible par } 3}$$

    $$\textbf{6.}\quad \boxed{(u_{n}) \text{ n'est pas croissante et n'est pas majorée}}$$

    *Piège :* la négation de « $x \geqslant 0$ » est « $x < 0$ », et non « $x \leqslant 0$ ». De même, la négation de « $x \in [0\;;1]$ » n'est pas « $x \in \;]0\;;1[$ ».
- id: "ap-01-04"
  feuille: "f-ap-01"
  numero: 4
  partie: "Propositions et connecteurs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [propositions, connecteurs et tables de vérité, négation, implication, équivalence]
  noeuds: [l-connecteurs, l-tautologies]
  notions: [connecteur, tautologie]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soient $A$ et $B$ deux propositions.

    **1.** Établir à l'aide d'une table de vérité l'équivalence $(A \Rightarrow B) \Leftrightarrow \big((\text{non } A) \text{ ou } B\big)$.

    **2.** En déduire, sans nouvelle table, que $\text{non}(A \Rightarrow B)$ équivaut à $\big(A \text{ et } (\text{non } B)\big)$.

    **3.** Vérifier ce dernier résultat par une table de vérité.

    **4.** Soit $x$ un réel fixé. Écrire la négation de la proposition « si $x > 2$, alors $x^{2} > 4$ ».

    **5.** Cette négation peut-elle être vraie pour un certain réel $x$ ? Qu'en conclure sur l'implication de départ ?
  corrige: |
    **1.** On dresse la table de vérité :

    $$\begin{array}{|c|c||c|c||c|c|} \hline A & B & \text{non } A & \text{non } B & (\text{non } A) \text{ ou } B & A \Rightarrow B \\ \hline \text{V} & \text{V} & \text{F} & \text{F} & \text{V} & \text{V} \\ \hline \text{V} & \text{F} & \text{F} & \text{V} & \text{F} & \text{F} \\ \hline \text{F} & \text{V} & \text{V} & \text{F} & \text{V} & \text{V} \\ \hline \text{F} & \text{F} & \text{V} & \text{V} & \text{V} & \text{V} \\ \hline \end{array}$$

    Les deux dernières colonnes coïncident, donc : 
    $$\boxed{(A \Rightarrow B) \;\Leftrightarrow\; \big((\text{non } A) \text{ ou } B\big)}$$

    **2.** On nie les deux membres de l'équivalence précédente, puis on applique De Morgan : 
    $$\text{non}(A \Rightarrow B) \;\Leftrightarrow\; \text{non}\big((\text{non } A) \text{ ou } B\big) \;\Leftrightarrow\; \big(\text{non}(\text{non } A)\big) \text{ et } (\text{non } B)$$
     Comme $\text{non}(\text{non } A)$ équivaut à $A$ : 
    $$\boxed{\text{non}(A \Rightarrow B) \;\Leftrightarrow\; \big(A \text{ et } (\text{non } B)\big)}$$

    **3.** La vérification est immédiate sur la table :

    $$\begin{array}{|c|c||c|c||c|} \hline A & B & A \Rightarrow B & \text{non}(A \Rightarrow B) & A \text{ et } (\text{non } B) \\ \hline \text{V} & \text{V} & \text{V} & \text{F} & \text{F} \\ \hline \text{V} & \text{F} & \text{F} & \text{V} & \text{V} \\ \hline \text{F} & \text{V} & \text{V} & \text{F} & \text{F} \\ \hline \text{F} & \text{F} & \text{V} & \text{F} & \text{F} \\ \hline \end{array}$$

    **4.** On applique la question 2 avec $A$ : « $x > 2$ » et $B$ : « $x^{2} > 4$ » : 
    $$\boxed{x > 2 \;\text{ et }\; x^{2} \leqslant 4}$$

    *Piège :* la négation d'une implication n'est *pas* une implication. Écrire « si $x > 2$ alors $x^{2} \leqslant 4$ » serait une faute de logique.

    **5.** Soit $x$ un réel tel que $x > 2$. La fonction carré étant strictement croissante sur $[0\;;+\infty[$, on obtient $x^{2} > 2^{2} = 4$, ce qui contredit $x^{2} \leqslant 4$. 
    $$\boxed{\text{La négation est fausse pour tout réel } x, \text{ donc l'implication de départ est vraie pour tout réel } x.}$$
     C'est la méthode générale : montrer qu'une implication est vraie, c'est montrer que « $A$ et non $B$ » est impossible.
- id: "ap-01-05"
  feuille: "f-ap-01"
  numero: 5
  partie: "Implication et équivalence"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [implication]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour chacune des implications suivantes, supposée vraie, compléter les deux phrases « … est une condition suffisante pour … » et « … est une condition nécessaire pour … », puis dire si la réciproque est vraie ou fausse.

    **1.** $n$ est un multiple de $6$ $\Rightarrow$ $n$ est un multiple de $3$.

    **2.** $x = 2$ $\Rightarrow$ $x^{2} = 4$.

    **3.** $ABCD$ est un carré $\Rightarrow$ $ABCD$ est un losange.

    **4.** $x > 0$ $\Rightarrow$ $x \geqslant 0$.

    **5.** $n$ est pair $\Rightarrow$ $n^{2}$ est pair.
  corrige: |
    Lorsque $A \Rightarrow B$ est vraie, $A$ est une condition *suffisante* pour $B$, et $B$ une condition *nécessaire* pour $A$.

    **1.** L'implication est vraie, donc : 
    $$\boxed{\begin{array}{l} \text{Être multiple de } 6 \text{ est suffisant pour être multiple de } 3. \\[1mm] \text{Être multiple de } 3 \text{ est nécessaire pour être multiple de } 6. \end{array}}$$
     Réciproque **Fausse** : $3$ est multiple de $3$ mais pas de $6$.

    **2.** On applique les deux définitions : 
    $$\boxed{\begin{array}{l} x = 2 \text{ est suffisant pour } x^{2} = 4. \\[1mm] x^{2} = 4 \text{ est nécessaire pour } x = 2. \end{array}}$$
     Réciproque **Fausse** : $x = -2$ vérifie $x^{2} = 4$ sans valoir $2$.

    **3.** On applique les deux définitions : 
    $$\boxed{\begin{array}{l} \text{Être un carré est suffisant pour être un losange.} \\[1mm] \text{Être un losange est nécessaire pour être un carré.} \end{array}}$$
     Réciproque **Fausse** : un losange dont les diagonales sont de longueurs différentes n'est pas un carré.

    **4.** On applique les deux définitions : 
    $$\boxed{\begin{array}{l} x > 0 \text{ est suffisant pour } x \geqslant 0. \\[1mm] x \geqslant 0 \text{ est nécessaire pour } x > 0. \end{array}}$$
     Réciproque **Fausse** : $x = 0$ vérifie $x \geqslant 0$ mais pas $x > 0$.

    **5.** On applique les deux définitions : 
    $$\boxed{\begin{array}{l} \text{Être pair est suffisant pour avoir un carré pair.} \\[1mm] \text{Avoir un carré pair est nécessaire pour être pair.} \end{array}}$$
     Réciproque **Vraie** : c'est le résultat démontré à la question 1 de l'exercice 8.
- id: "ap-01-06"
  feuille: "f-ap-01"
  numero: 6
  partie: "Implication et équivalence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [implication]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour chacune des implications suivantes, écrire la réciproque puis la contraposée. Dire ensuite si l'implication de départ est vraie, et si sa réciproque l'est.

    **1.** Si $n$ est un multiple de $4$, alors $n$ est pair.

    **2.** Si $x \geqslant 2$, alors $x^{2} \geqslant 4$.

    **3.** Si $n$ est un nombre premier strictement supérieur à $2$, alors $n$ est impair.

    **4.** Si $x$ et $y$ sont rationnels, alors $x + y$ est rationnel.
  corrige: |
    La réciproque de $A \Rightarrow B$ est $B \Rightarrow A$ ; sa contraposée est $(\text{non } B) \Rightarrow (\text{non } A)$.

    **1.** On échange et on nie les deux membres : 
    $$\boxed{\begin{array}{l} \text{Réciproque : si } n \text{ est pair, alors } n \text{ est un multiple de } 4. \\[1mm] \text{Contraposée : si } n \text{ est impair, alors } n \text{ n'est pas un multiple de } 4. \end{array}}$$
     L'implication est **Vraie** ; la réciproque est **Fausse**, comme le montre $n = 6$.

    **2.** On procède de la même manière : 
    $$\boxed{\begin{array}{l} \text{Réciproque : si } x^{2} \geqslant 4, \text{ alors } x \geqslant 2. \\[1mm] \text{Contraposée : si } x^{2} < 4, \text{ alors } x < 2. \end{array}}$$
     L'implication est **Vraie** ; la réciproque est **Fausse**, comme le montre $x = -3$.

    **3.** On procède de la même manière : 
    $$\boxed{\begin{array}{l} \text{Réciproque : si } n \text{ est impair, alors } n \text{ est premier et } n > 2. \\[1mm] \text{Contraposée : si } n \text{ est pair, alors } n \text{ n'est pas premier ou } n \leqslant 2. \end{array}}$$
     L'implication est **Vraie** ; la réciproque est **Fausse**, comme le montre $n = 9$.

    *Piège :* la contraposée nie *les deux* membres et les échange. Nier « $n$ premier et $n > 2$ » donne bien un « ou », d'après les lois de De Morgan.

    **4.** On procède de la même manière : 
    $$\boxed{\begin{array}{l} \text{Réciproque : si } x + y \text{ est rationnel, alors } x \text{ et } y \text{ sont rationnels.} \\[1mm] \text{Contraposée : si } x + y \text{ est irrationnel, alors } x \text{ ou } y \text{ est irrationnel.} \end{array}}$$
     L'implication est **Vraie** (question 1 de l'exercice 12) ; la réciproque est **Fausse** : $x = \sqrt{2}$ et $y = -\sqrt{2}$ sont irrationnels et $x + y = 0$ est rationnel.
- id: "ap-01-07"
  feuille: "f-ap-01"
  numero: 7
  partie: "Implication et équivalence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [connecteurs et tables de vérité, équivalence]
  noeuds: [l-connecteurs]
  notions: [connecteur]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Démontrer les équivalences suivantes en respectant le schéma de rédaction en deux temps du cours.

    **1.** Soient $x$ et $y$ deux réels. Montrer que $x^{2} + y^{2} = 0 \Leftrightarrow (x = 0 \text{ et } y = 0)$.

    **2.** Soient $a$ et $b$ deux réels. Montrer que $(a+b)^{2} = a^{2} + b^{2} \Leftrightarrow ab = 0$.

    **3.** Soit $x$ un réel. Montrer que $|x| \leqslant 3 \Leftrightarrow -3 \leqslant x \leqslant 3$.
  corrige: |
    **1.** *Montrons que $x^{2} + y^{2} = 0 \Rightarrow (x = 0$ et $y = 0)$.* Supposons $x^{2} + y^{2} = 0$. Alors $x^{2} = -y^{2}$. Or $x^{2} \geqslant 0$ et $-y^{2} \leqslant 0$, donc $x^{2} = 0$, c'est-à-dire $x = 0$. On en déduit $y^{2} = 0$, donc $y = 0$.

    *Réciproquement, montrons que $(x = 0$ et $y = 0) \Rightarrow x^{2} + y^{2} = 0$.* Si $x = 0$ et $y = 0$, alors $x^{2} + y^{2} = 0 + 0 = 0$. 
    $$\boxed{x^{2} + y^{2} = 0 \;\Longleftrightarrow\; (x = 0 \text{ et } y = 0)}$$

    **2.** *Montrons le sens direct.* Supposons $(a+b)^{2} = a^{2} + b^{2}$. En développant le membre de gauche : 
    $$a^{2} + 2ab + b^{2} = a^{2} + b^{2} \quad\text{donc}\quad 2ab = 0 \quad\text{donc}\quad ab = 0$$

    *Réciproquement*, si $ab = 0$, alors $(a+b)^{2} = a^{2} + 2ab + b^{2} = a^{2} + b^{2}$. 
    $$\boxed{(a+b)^{2} = a^{2} + b^{2} \;\Longleftrightarrow\; ab = 0}$$

    **3.** *Montrons que $|x| \leqslant 3 \Rightarrow -3 \leqslant x \leqslant 3$.* Supposons $|x| \leqslant 3$. Si $x \geqslant 0$, alors $x = |x| \leqslant 3$ et $x \geqslant 0 > -3$. Si $x < 0$, alors $-x = |x| \leqslant 3$, donc $x \geqslant -3$, et $x < 0 \leqslant 3$. Dans les deux cas, $-3 \leqslant x \leqslant 3$.

    *Réciproquement*, supposons $-3 \leqslant x \leqslant 3$. Si $x \geqslant 0$, alors $|x| = x \leqslant 3$. Sinon $|x| = -x \leqslant 3$ puisque $x \geqslant -3$. 
    $$\boxed{|x| \leqslant 3 \;\Longleftrightarrow\; -3 \leqslant x \leqslant 3}$$
- id: "ap-01-08"
  feuille: "f-ap-01"
  numero: 8
  partie: "Modes de raisonnement"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [implication]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Démontrer par contraposée les implications suivantes.

    **1.** Soit $n$ un entier relatif. Si $n^{2}$ est pair, alors $n$ est pair.

    **2.** Soient $a$ et $b$ deux réels. Si $a + b \geqslant 2$, alors $a \geqslant 1$ ou $b \geqslant 1$.

    **3.** Soit $n$ un entier relatif. Si $n^{2} - 1$ n'est pas divisible par $8$, alors $n$ est pair.
  corrige: |
    **1.** La contraposée s'énonce : *si $n$ est impair, alors $n^{2}$ est impair*. Démontrons-la. Supposons $n$ impair : il existe $k \in \mathbb{Z}$ tel que $n = 2k+1$. Alors : 
    $$n^{2} = (2k+1)^{2} = 4k^{2} + 4k + 1 = 2\big(2k^{2} + 2k\big) + 1$$
     Comme $2k^{2} + 2k \in \mathbb{Z}$, l'entier $n^{2}$ est impair. La contraposée étant établie : 
    $$\boxed{\text{Si } n^{2} \text{ est pair, alors } n \text{ est pair.}}$$

    **2.** La contraposée s'énonce : *si $a < 1$ et $b < 1$, alors $a + b < 2$*, la négation de « $a \geqslant 1$ ou $b \geqslant 1$ » étant un « et » d'après De Morgan. En additionnant membre à membre les inégalités strictes $a < 1$ et $b < 1$, on obtient $a + b < 2$. 
    $$\boxed{\text{Si } a + b \geqslant 2, \text{ alors } a \geqslant 1 \text{ ou } b \geqslant 1.}$$

    **3.** La contraposée s'énonce : *si $n$ est impair, alors $n^{2} - 1$ est divisible par $8$*. Supposons $n = 2k+1$ avec $k \in \mathbb{Z}$. Alors : 
    $$n^{2} - 1 = (n-1)(n+1) = 2k \times (2k+2) = 4k(k+1)$$
     Or, parmi les deux entiers consécutifs $k$ et $k+1$, l'un est pair : le produit $k(k+1)$ s'écrit donc $2m$ avec $m \in \mathbb{Z}$, d'où $n^{2} - 1 = 8m$. 
    $$\boxed{\text{Si } n^{2} - 1 \text{ n'est pas divisible par } 8, \text{ alors } n \text{ est pair.}}$$
- id: "ap-01-09"
  feuille: "f-ap-01"
  numero: 9
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["raisonnement par l'absurde"]
  noeuds: []
  notions: []
  page_enonce: 2
  page_corrige: 6
  enonce: |
    On admet le résultat suivant : *si $3$ divise $p^{2}$, alors $3$ divise $p$*.

    **1.** Démontrer par l'absurde que $\sqrt{3}$ est irrationnel, en reprenant la structure de la démonstration du cours.

    **2.** En admettant que $\sqrt{2}$ est irrationnel, démontrer que $\sqrt{8}$ l'est également.

    **3.** Où la démonstration de la question 1 échouerait-elle si l'on cherchait à établir que $\sqrt{4}$ est irrationnel ?
  corrige: |
    **1.** Supposons par l'absurde que $\sqrt{3}$ soit rationnel. On peut alors écrire : 
    $$\sqrt{3} = \frac{p}{q} \quad\text{avec}\quad p \in \mathbb{Z},\; q \in \mathbb{N}^{*} \text{ sans facteur commun}$$
     En élevant au carré, il vient $3q^{2} = p^{2}$. Ainsi $3$ divise $p^{2}$, donc $3$ divise $p$ d'après le résultat admis, et $p = 3p'$ avec $p' \in \mathbb{Z}$. En reportant : 
    $$3q^{2} = 9p'^{2} \quad\text{d'où}\quad q^{2} = 3p'^{2}$$
     Donc $3$ divise $q^{2}$, puis $3$ divise $q$. Mais alors $p$ et $q$ admettent $3$ comme facteur commun, ce qui contredit le choix de $p$ et $q$. 
    $$\boxed{\sqrt{3} \text{ est irrationnel.}}$$

    **2.** On remarque que $\sqrt{8} = \sqrt{4 \times 2} = 2\sqrt{2}$. Supposons par l'absurde $\sqrt{8}$ rationnel. Alors : 
    $$\sqrt{2} = \frac{\sqrt{8}}{2}$$
     serait le quotient de deux rationnels, donc un rationnel, ce qui contredit l'irrationalité de $\sqrt{2}$. 
    $$\boxed{\sqrt{8} \text{ est irrationnel.}}$$

    **3.** La démonstration de la question 1 reposerait sur l'implication *si $4$ divise $p^{2}$, alors $4$ divise $p$*. 
    $$\boxed{\text{Cette implication est fausse : } p = 2 \text{ vérifie } 4 \mid p^{2} = 4 \text{ sans que } 4 \mid 2.}$$
     Le raisonnement s'arrête donc dès la troisième ligne — et heureusement, puisque $\sqrt{4} = 2$ est rationnel.
- id: "ap-01-10"
  feuille: "f-ap-01"
  numero: 10
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [propositions, contre-exemple]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Chacune des propositions suivantes est fausse. Le démontrer en exhibant un contre-exemple.

    **1.** Tout entier naturel est la somme des carrés de deux entiers naturels.

    **2.** Pour tous réels $x$ et $y$, $\sqrt{x^{2} + y^{2}} = x + y$.

    **3.** Pour tout réel $x$, $x^{2} > x$.

    **4.** Si un entier est divisible par $2$ et par $4$, alors il est divisible par $8$.

    **5.** Pour tous réels $a$ et $b$, $|a + b| = |a| + |b|$.

    **6.** Tout nombre premier est impair.

    **7.** Pour tout entier naturel $n$, $n^{2} + n + 41$ est un nombre premier.
  corrige: |
    **1.** Les carrés d'entiers naturels inférieurs à $3$ sont $0$ et $1$, et les sommes possibles sont $0$, $1$ et $2$. Prenons $n = 3$ : 
    $$\boxed{n = 3 \text{ n'est pas somme de deux carrés d'entiers naturels.}}$$

    **2.** Prenons $x = y = 1$ : 
    $$\sqrt{1^{2} + 1^{2}} = \sqrt{2} \approx 1{,}414 \qquad\text{et}\qquad 1 + 1 = 2$$

    $$\boxed{x = y = 1 \text{ convient.}}$$

    **3.** Prenons $x = 1$ : on a $x^{2} = 1$, qui n'est pas strictement supérieur à $1$. 
    $$\boxed{x = 1 \text{ convient (ou tout } x \text{ de } [0\;;1]).}$$

    **4.** Prenons $n = 4$ : il est divisible par $2$ et par $4$, mais $4 = 8 \times 0{,}5$ n'est pas un multiple de $8$. 
    $$\boxed{n = 4 \text{ convient.}}$$

    **5.** Prenons $a = 1$ et $b = -1$ : 
    $$|a + b| = |0| = 0 \qquad\text{et}\qquad |a| + |b| = 1 + 1 = 2$$

    $$\boxed{a = 1 \text{ et } b = -1 \text{ conviennent.}}$$

    **6.** Le plus petit nombre premier est pair : 
    $$\boxed{2 \text{ est premier et pair.}}$$

    **7.** Prenons $n = 41$ : 
    $$41^{2} + 41 + 41 = 41 \times (41 + 1 + 1) = 41 \times 43 = 1\,763$$

    $$\boxed{n = 41 \text{ convient : } 1\,763 \text{ n'est pas premier.}}$$
     Cet exemple mérite d'être médité : $n^{2} + n + 41$ est premier pour *toutes* les valeurs de $n$ de $0$ à $40$. Quarante-et-un exemples successifs ne démontrent rien, alors qu'un seul contre-exemple suffit à conclure — c'est exactement l'asymétrie signalée par le cours.
- id: "ap-01-11"
  feuille: "f-ap-01"
  numero: 11
  partie: "Modes de raisonnement"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [implication, "raisonnement par l'absurde"]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Le cours établit par contraposée le résultat suivant : *si $x$ est un réel positif tel que $x \leqslant \varepsilon$ pour tout réel $\varepsilon > 0$, alors $x = 0$*.

    **1.** Rédiger une démonstration de ce même résultat par l'absurde.

    **2.** Montrer que l'hypothèse « $x$ positif » ne peut pas être supprimée, en donnant un réel $x$ strictement négatif vérifiant $x \leqslant \varepsilon$ pour tout $\varepsilon > 0$.

    **3.** Le résultat subsiste-t-il si l'on remplace « pour tout réel $\varepsilon > 0$ » par « il existe un réel $\varepsilon > 0$ » ? Justifier.
  corrige: |
    **1.** Supposons par l'absurde que $x \neq 0$. Comme $x \geqslant 0$, on a donc $x > 0$. Posons $\varepsilon = \dfrac{x}{2}$, qui est un réel strictement positif. L'hypothèse appliquée à ce $\varepsilon$ donne : 
    $$x \leqslant \frac{x}{2} \quad\text{donc}\quad \frac{x}{2} \leqslant 0 \quad\text{donc}\quad x \leqslant 0$$
     ce qui contredit $x > 0$. L'hypothèse $x \neq 0$ est donc fausse. 
    $$\boxed{x = 0}$$
     On remarque que le réel $\varepsilon = \frac{x}{2}$ est exactement celui qu'utilise le cours dans la démonstration par contraposée : les deux rédactions manipulent les mêmes objets, seule leur mise en scène diffère.

    **2.** Prenons $x = -1$. Pour tout réel $\varepsilon > 0$, on a $-1 < 0 < \varepsilon$, donc $x \leqslant \varepsilon$ ; pourtant $x \neq 0$. 
    $$\boxed{x = -1 \text{ convient : l'hypothèse } x \geqslant 0 \text{ est indispensable.}}$$

    **3.** Prenons $x = 1$ et $\varepsilon = 2$ : il existe bien un réel $\varepsilon > 0$ tel que $x \leqslant \varepsilon$, et $x \neq 0$. 
    $$\boxed{\text{Non, le résultat tombe en défaut.}}$$
     C'est le « pour tout » qui porte toute la force de l'hypothèse : il oblige $x$ à être plus petit que des réels arbitrairement proches de $0$.
- id: "ap-01-12"
  feuille: "f-ap-01"
  numero: 12
  partie: "Modes de raisonnement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [implication, "raisonnement par l'absurde"]
  noeuds: [l-connecteurs]
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On rappelle qu'un réel est *irrationnel* lorsqu'il n'appartient pas à $\mathbb{Q}$.

    **1.** Montrer que la somme et le produit de deux rationnels sont rationnels.

    **2.** Soient $r$ un rationnel et $x$ un irrationnel. Démontrer par l'absurde que $r + x$ est irrationnel.

    **3.** Soient $r$ un rationnel non nul et $x$ un irrationnel. Démontrer de même que $rx$ est irrationnel.

    **4.** La somme de deux irrationnels est-elle toujours irrationnelle ? Et leur produit ? Justifier.

    **5.** Pourquoi l'hypothèse $r \neq 0$ est-elle nécessaire à la question 3 ?
  corrige: |
    **1.** Soient $r$ et $r'$ deux rationnels : il existe $p, p' \in \mathbb{Z}$ et $q, q' \in \mathbb{N}^{*}$ tels que $r = \dfrac{p}{q}$ et $r' = \dfrac{p'}{q'}$. Alors : 
    $$r + r' = \frac{pq' + p'q}{qq'} \qquad\text{et}\qquad rr' = \frac{pp'}{qq'}$$
     Les numérateurs sont entiers et les dénominateurs sont des entiers naturels non nuls. 
    $$\boxed{\text{La somme et le produit de deux rationnels sont rationnels.}}$$

    **2.** Supposons par l'absurde que $r + x$ soit rationnel, et notons $s = r + x \in \mathbb{Q}$. Alors : 
    $$x = s - r$$
     est la somme des deux rationnels $s$ et $-r$, donc un rationnel d'après la question 1 : cela contredit l'irrationalité de $x$. 
    $$\boxed{r + x \text{ est irrationnel.}}$$

    **3.** On procède de la même manière. Supposons $rx = s$ avec $s \in \mathbb{Q}$. Comme $r \neq 0$, on peut écrire : 
    $$x = \frac{s}{r}$$
     qui est le produit des rationnels $s$ et $\dfrac{1}{r}$, donc un rationnel : contradiction. 
    $$\boxed{rx \text{ est irrationnel.}}$$

    **4.** Le nombre $\sqrt{2}$ est irrationnel, et $-\sqrt{2}$ l'est aussi d'après la question 3 appliquée à $r = -1$. Or : 
    $$\sqrt{2} + \big(-\sqrt{2}\big) = 0 \in \mathbb{Q} \qquad\text{et}\qquad \sqrt{2} \times \sqrt{2} = 2 \in \mathbb{Q}$$

    $$\boxed{\text{Non : ni la somme ni le produit de deux irrationnels ne sont nécessairement irrationnels.}}$$

    **5.** Si $r = 0$, alors $rx = 0$, qui est rationnel quel que soit $x$. 
    $$\boxed{\text{L'énoncé serait faux sans l'hypothèse } r \neq 0.}$$
     On retiendra la structure commune aux questions 2 et 3 : l'ensemble $\mathbb{Q}$ est stable par somme et par produit, ce qui permet de « revenir en arrière » et d'obtenir la contradiction.
- id: "ap-01-13"
  feuille: "f-ap-01"
  numero: 13
  partie: "Ensembles et quantificateurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [description des ensembles]
  noeuds: [zf-sep]
  notions: [ensemble]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Décrire en extension les ensembles suivants :

    **(a)** $\{x \in \mathbb{Z} \mid x^{2} \leqslant 9\}$

    **(b)** $\{n \in \mathbb{N} \mid n \text{ divise } 12\}$

    **(c)** $\{x \in \mathbb{R} \mid x^{2} = 2\}$

    **(d)** $\{x \in \mathbb{Q} \mid x^{2} = 2\}$

    **2.** Décrire en compréhension les ensembles suivants :

    **(a)** $\{1 \;;\; 4 \;;\; 9 \;;\; 16 \;;\; 25\}$

    **(b)** l'ensemble des entiers relatifs pairs

    **(c)** l'ensemble des réels dont la distance à $3$ est inférieure ou égale à $1$
  corrige: |
    **1.** On énumère les éléments : 
    $$\textbf{(a)}\; \boxed{\{-3 \;;\; -2 \;;\; -1 \;;\; 0 \;;\; 1 \;;\; 2 \;;\; 3\}} \qquad\qquad \textbf{(b)}\; \boxed{\{1 \;;\; 2 \;;\; 3 \;;\; 4 \;;\; 6 \;;\; 12\}}$$

    $$\textbf{(c)}\; \boxed{\big\{-\sqrt{2} \;;\; \sqrt{2}\big\}} \qquad\qquad \textbf{(d)}\; \boxed{\varnothing}$$
     Le cas **(d)** n'est autre que l'irrationalité de $\sqrt{2}$ : aucun rationnel n'a pour carré $2$.

    **2.** On donne une propriété caractéristique : 
    $$\textbf{(a)}\; \boxed{\big\{n^{2} \;\big|\; n \in \mathbb{N} \text{ et } 1 \leqslant n \leqslant 5\big\}} \qquad\qquad \textbf{(b)}\; \boxed{\{n \in \mathbb{Z} \mid \exists k \in \mathbb{Z},\; n = 2k\}}$$

    $$\textbf{(c)}\; \boxed{\big\{x \in \mathbb{R} \;\big|\; |x - 3| \leqslant 1\big\} = [2\;;4]}$$
- id: "ap-01-14"
  feuille: "f-ap-01"
  numero: 14
  partie: "Ensembles et quantificateurs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inclusion et égalité]
  noeuds: [zf-ext]
  notions: [ensemble]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On pose $E = \big\{1 \;;\; 2 \;;\; \{3\} \;;\; \{1 \;;\, 2\}\big\}$.

    Pour chacun des objets ci-dessous, dire s'il appartient à $E$, s'il est inclus dans $E$, s'il vérifie les deux, ou aucune des deux. Justifier.

    **1.** $1$

    **2.** $\{1\}$

    **3.** $3$

    **4.** $\{3\}$

    **5.** $\{1 \;;\, 2\}$

    **6.** $\varnothing$

    **7.** $\big\{\{3\}\big\}$

    **8.** $\big\{2 \;;\, \{3\}\big\}$
  corrige: |
    Le symbole $\in$ relie un élément à un ensemble, le symbole $\subset$ relie deux ensembles. Les éléments de $E$ sont $1$, $2$, $\{3\}$ et $\{1 \;; 2\}$.

    $$\textbf{1.}\; \boxed{1 \in E \text{ seulement}} \qquad \textbf{2.}\; \boxed{\{1\} \subset E \text{ seulement}} \qquad \textbf{3.}\; \boxed{3 \text{ : aucune des deux}}$$

    $$\textbf{4.}\; \boxed{\{3\} \in E \text{ seulement}} \qquad\qquad \textbf{5.}\; \boxed{\{1 \;; 2\} \in E \;\text{ et }\; \{1 \;; 2\} \subset E}$$

    $$\textbf{6.}\; \boxed{\varnothing \subset E \text{ seulement}} \qquad \textbf{7.}\; \boxed{\big\{\{3\}\big\} \subset E \text{ seulement}} \qquad \textbf{8.}\; \boxed{\big\{2 \;; \{3\}\big\} \subset E \text{ seulement}}$$

    Justifions les cas délicats.

    • **3.** L'entier $3$ n'est pas un élément de $E$ : seul l'ensemble $\{3\}$ l'est. Et $3$ n'étant pas un ensemble, l'écriture $3 \subset E$ n'a pas de sens.

    • **4.** On a $\{3\} \in E$ puisque $\{3\}$ figure dans la liste. En revanche $\{3\} \subset E$ signifierait $3 \in E$, ce qui est faux.

    • **5.** L'ensemble $\{1 \;; 2\}$ figure dans la liste, donc $\{1 \;; 2\} \in E$ ; et comme $1 \in E$ et $2 \in E$, on a aussi $\{1 \;; 2\} \subset E$. **Les deux relations sont vraies simultanément**, ce qui montre qu'elles sont indépendantes l'une de l'autre.

    • **6.** L'ensemble vide est inclus dans tout ensemble, mais il ne figure pas dans la liste des éléments de $E$.

    • **7.** On a $\big\{\{3\}\big\} \subset E$ car son unique élément, $\{3\}$, appartient à $E$.
- id: "ap-01-15"
  feuille: "f-ap-01"
  numero: 15
  partie: "Ensembles et quantificateurs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [propositions, quantificateurs]
  noeuds: [l-connecteurs, log]
  notions: [quantificateur]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Donner la valeur de vérité de chacune des propositions suivantes, en justifiant.

    **1.** $\forall x \in \mathbb{R},\; x^{2} + 1 > 0$

    **2.** $\exists x \in \mathbb{R},\; x^{2} + 1 = 0$

    **3.** $\forall n \in \mathbb{N},\; n \geqslant 1$

    **4.** $\exists n \in \mathbb{N},\; \forall m \in \mathbb{N},\; n \leqslant m$

    **5.** $\forall x \in \mathbb{R},\; \exists y \in \mathbb{R},\; x + y = 0$

    **6.** $\exists y \in \mathbb{R},\; \forall x \in \mathbb{R},\; x + y = 0$

    **7.** $\forall x \in \mathbb{R}^{*},\; \exists y \in \mathbb{R},\; xy = 1$

    **8.** $\exists x \in \mathbb{Q},\; x^{2} = 2$
  corrige: |
    **1.** Pour tout réel $x$, $x^{2} \geqslant 0$ donc $x^{2} + 1 \geqslant 1 > 0$ : $\boxed{\textbf{Vraie}}$

    **2.** D'après ce qui précède, $x^{2} + 1 \geqslant 1$ ne s'annule jamais : $\boxed{\textbf{Fausse}}$

    **3.** L'entier $n = 0$ appartient à $\mathbb{N}$ et vérifie $n < 1$ : $\boxed{\textbf{Fausse}}$

    **4.** Prenons $n = 0$ : tout entier naturel $m$ vérifie $0 \leqslant m$ : $\boxed{\textbf{Vraie}}$

    **5.** Soit $x \in \mathbb{R}$. Posons $y = -x$ : alors $x + y = 0$ : $\boxed{\textbf{Vraie}}$

    **6.** Supposons qu'un tel $y$ existe. Appliqué à $x = 0$, il donne $y = 0$ ; appliqué à $x = 1$, il donne $y = -1$. C'est contradictoire : $\boxed{\textbf{Fausse}}$

    **7.** Soit $x$ un réel non nul. Posons $y = \dfrac{1}{x}$ : alors $xy = 1$ : $\boxed{\textbf{Vraie}}$

    **8.** C'est l'irrationalité de $\sqrt{2}$, démontrée dans le cours : $\boxed{\textbf{Fausse}}$

    *Piège :* les propositions 5 et 6 ne diffèrent que par l'ordre des quantificateurs, et n'ont pourtant pas la même valeur de vérité. Dans la cinquième, $y$ peut dépendre de $x$ ; dans la sixième, un même $y$ devrait convenir pour tous les $x$.
- id: "ap-01-16"
  feuille: "f-ap-01"
  numero: 16
  partie: "Ensembles et quantificateurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [propositions, négation, implication, quantificateurs]
  noeuds: [l-connecteurs, l-tautologies, log]
  notions: [tautologie, quantificateur]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Écrire la négation de chacune des propositions suivantes, sous une forme où aucun « non » ne porte sur un quantificateur.

    **1.** $\forall x \in \mathbb{R},\; x^{2} \geqslant x$

    **2.** $\exists n \in \mathbb{N},\; n^{2} = 2$

    **3.** $\forall x \in \mathbb{R},\; \exists y \in \mathbb{R},\; y > x$

    **4.** $\exists M \in \mathbb{R},\; \forall n \in \mathbb{N},\; u_{n} \leqslant M$

    **5.** $\forall x \in E,\; \big(P(x) \Rightarrow Q(x)\big)$

    **6.** $\forall \varepsilon > 0,\; \exists N \in \mathbb{N},\; \forall n \geqslant N,\; |u_{n} - \ell| \leqslant \varepsilon$
  corrige: |
    On applique la propriété 2 du cours : nier échange $\forall$ et $\exists$, et fait descendre la négation sur la proposition finale.

    $$\textbf{1.}\; \boxed{\exists x \in \mathbb{R},\; x^{2} < x} \qquad\qquad \textbf{2.}\; \boxed{\forall n \in \mathbb{N},\; n^{2} \neq 2}$$

    $$\textbf{3.}\; \boxed{\exists x \in \mathbb{R},\; \forall y \in \mathbb{R},\; y \leqslant x} \qquad\qquad \textbf{4.}\; \boxed{\forall M \in \mathbb{R},\; \exists n \in \mathbb{N},\; u_{n} > M}$$

    $$\textbf{5.}\; \boxed{\exists x \in E,\; \big(P(x) \text{ et } \text{non } Q(x)\big)}$$

    $$\textbf{6.}\; \boxed{\exists \varepsilon > 0,\; \forall N \in \mathbb{N},\; \exists n \geqslant N,\; |u_{n} - \ell| > \varepsilon}$$

    La question 5 utilise la négation d'une implication établie à l'exercice 4 : $\text{non}(P \Rightarrow Q)$ équivaut à $P$ et $\text{non } Q$.

    La question 6 est la négation de « la suite $(u_{n})$ converge vers $\ell$ ». On observera que les quantificateurs se renversent *tous*, dans l'ordre où ils apparaissent, et que seule l'inégalité finale est niée. C'est le mécanisme le plus important du chapitre.
- id: "ap-01-17"
  feuille: "f-ap-01"
  numero: 17
  partie: "Ensembles et quantificateurs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [propositions, négation, quantificateurs]
  noeuds: [l-connecteurs, l-tautologies, log]
  notions: [tautologie, quantificateur]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ une application. Traduire à l'aide de quantificateurs les propositions suivantes, ainsi que leur négation.

    **1.** $f$ est majorée sur $\mathbb{R}$.

    **2.** $f$ ne s'annule jamais.

    **3.** $f$ n'est pas la fonction nulle.

    **4.** $f$ atteint toutes les valeurs de $\mathbb{N}$.

    **5.** $f$ n'est pas impaire.

    **6.** $f$ n'admet aucun minimum sur $\mathbb{R}$.
  corrige: |
    **1.** Dire que $f$ est majorée, c'est dire qu'il existe un réel qui majore *toutes* les valeurs de $f$ : 
    $$\boxed{\begin{array}{l} f \text{ majorée : } \exists M \in \mathbb{R},\; \forall x \in \mathbb{R},\; f(x) \leqslant M \\[1mm] \text{Négation : } \forall M \in \mathbb{R},\; \exists x \in \mathbb{R},\; f(x) > M \end{array}}$$

    **2.** La proposition porte sur *toutes* les valeurs de $f$ : 
    $$\boxed{\begin{array}{l} f \text{ ne s'annule jamais : } \forall x \in \mathbb{R},\; f(x) \neq 0 \\[1mm] \text{Négation : } \exists x \in \mathbb{R},\; f(x) = 0 \end{array}}$$

    **3.** La proposition porte au contraire sur *une* valeur de $f$ : 
    $$\boxed{\begin{array}{l} f \text{ n'est pas la fonction nulle : } \exists x \in \mathbb{R},\; f(x) \neq 0 \\[1mm] \text{Négation : } \forall x \in \mathbb{R},\; f(x) = 0 \end{array}}$$

    *Piège :* les propositions 2 et 3 sont souvent confondues, alors qu'elles sont la négation l'une de l'autre. « Ne s'annule jamais » porte un $\forall$, « n'est pas la fonction nulle » porte un $\exists$.

    **4.** Chaque entier naturel doit être atteint, par un antécédent qui peut dépendre de lui : 
    $$\boxed{\begin{array}{l} f \text{ atteint toutes les valeurs de } \mathbb{N} \text{ : } \forall n \in \mathbb{N},\; \exists x \in \mathbb{R},\; f(x) = n \\[1mm] \text{Négation : } \exists n \in \mathbb{N},\; \forall x \in \mathbb{R},\; f(x) \neq n \end{array}}$$

    **5.** La fonction $f$ est impaire lorsque $\forall x \in \mathbb{R},\; f(-x) = -f(x)$. Sa négation donne : 
    $$\boxed{\begin{array}{l} f \text{ n'est pas impaire : } \exists x \in \mathbb{R},\; f(-x) \neq -f(x) \\[1mm] \text{Négation : } \forall x \in \mathbb{R},\; f(-x) = -f(x) \end{array}}$$

    **6.** Dire que $f$ admet un minimum, c'est dire qu'il existe un réel $a$ en lequel $f$ prend une valeur inférieure à toutes les autres : 
    $$\boxed{\begin{array}{l} f \text{ n'admet aucun minimum : } \forall a \in \mathbb{R},\; \exists x \in \mathbb{R},\; f(x) < f(a) \\[1mm] \text{Négation : } \exists a \in \mathbb{R},\; \forall x \in \mathbb{R},\; f(a) \leqslant f(x) \end{array}}$$

    *Piège :* le minimum doit être *atteint*. Écrire $\exists m \in \mathbb{R}, \forall x \in \mathbb{R}, m \leqslant f(x)$ traduirait « $f$ est minorée », ce qui est plus faible : la fonction $x \mapsto \mathrm{e}^{x}$ est minorée par $0$ sans admettre de minimum.
- id: "ap-01-18"
  feuille: "f-ap-01"
  numero: 18
  partie: "Ensembles et quantificateurs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [propositions, implication, quantificateurs]
  noeuds: [l-connecteurs, log]
  notions: [quantificateur]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soient $x$ et $y$ des réels.

    **1.** On note $P(x\;;y)$ la proposition « $x + y = 0$ ». Donner la valeur de vérité de :

    **(a)** $\forall x \in \mathbb{R},\; \exists y \in \mathbb{R},\; P(x\;;y)$

    **(b)** $\exists y \in \mathbb{R},\; \forall x \in \mathbb{R},\; P(x\;;y)$

    **2.** Reprendre la question précédente avec $P(x\;;y)$ : « $xy = 0$ ».

    **3.** Les deux exemples précédents montrent qu'aucune règle générale ne relie ces deux propositions dans un sens. Démontrer en revanche que, pour toute proposition $P$, l'implication suivante est vraie : 
    $$\Big(\exists y \in \mathbb{R},\; \forall x \in \mathbb{R},\; P(x\;;y)\Big) \;\Longrightarrow\; \Big(\forall x \in \mathbb{R},\; \exists y \in \mathbb{R},\; P(x\;;y)\Big)$$

    **4.** Expliquer en une phrase pourquoi la réciproque est fausse.
  corrige: |
    **1.** **(a)** Soit $x \in \mathbb{R}$. Posons $y = -x$ : alors $x + y = 0$. La proposition est $\boxed{\textbf{Vraie}}$

    **(b)** Supposons qu'un tel $y$ convienne pour tous les $x$. Pour $x = 0$ il donnerait $y = 0$, pour $x = 1$ il donnerait $y = -1$ : c'est impossible. La proposition est $\boxed{\textbf{Fausse}}$

    **2.** **(a)** Soit $x \in \mathbb{R}$. Posons $y = 0$ : alors $xy = 0$. La proposition est $\boxed{\textbf{Vraie}}$

    **(b)** Posons $y = 0$. Pour tout réel $x$, on a $xy = 0$. La proposition est $\boxed{\textbf{Vraie}}$

    Ici, un *même* $y$ convient pour tous les $x$ : les deux propositions sont vraies. Avec la question 1, on dispose donc d'un exemple où elles diffèrent et d'un exemple où elles coïncident.

    **3.** Supposons $\exists y \in \mathbb{R},\; \forall x \in \mathbb{R},\; P(x\;;y)$, et notons $y_{0}$ un tel réel : on a donc $P(x\;;y_{0})$ pour tout $x \in \mathbb{R}$. Soit maintenant $x \in \mathbb{R}$. Le réel $y_{0}$ vérifie $P(x\;;y_{0})$, donc il existe bien un réel $y$ tel que $P(x\;;y)$. Ceci valant pour tout $x$ : 
    $$\boxed{\Big(\exists y \in \mathbb{R},\; \forall x \in \mathbb{R},\; P(x\;;y)\Big) \;\Longrightarrow\; \Big(\forall x \in \mathbb{R},\; \exists y \in \mathbb{R},\; P(x\;;y)\Big)}$$

    **4.** On conclut : 
    $$\boxed{\text{Dans } \forall x,\, \exists y, \text{ le réel } y \text{ peut dépendre de } x, \text{ alors que } \exists y,\, \forall x \text{ impose un même } y \text{ pour tous.}}$$
     La question 1 le montre : le seul $y$ possible est $y = -x$, qui change avec $x$.
- id: "ap-01-19"
  feuille: "f-ap-01"
  numero: 19
  partie: "Inclusion et égalité"
  etoiles: 1
  types: [Vrai ou faux, Démonstration]
  mots_cles: [propositions, inclusion et égalité]
  noeuds: [l-connecteurs, zf-ext]
  notions: [ensemble]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On note $\mathcal{M}_{k}$ l'ensemble des multiples de $k$ dans $\mathbb{Z}$.

    **1.** Justifier les inclusions $\mathcal{M}_{12} \subset \mathcal{M}_{6}$, $\mathcal{M}_{12} \subset \mathcal{M}_{4}$ et $\mathcal{M}_{6} \subset \mathcal{M}_{3}$.

    **2.** A-t-on $\mathcal{M}_{6} \subset \mathcal{M}_{4}$ ? Et $\mathcal{M}_{4} \subset \mathcal{M}_{6}$ ? Justifier.

    **3.** Plus généralement, à quelle condition sur les entiers $k$ et $\ell$ a-t-on $\mathcal{M}_{k} \subset \mathcal{M}_{\ell}$ ?

    **4.** Dire si les propositions suivantes sont vraies ou fausses, en justifiant :

    **(a)** $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{Q} \subset \mathbb{R}$

    **(b)** $[0\;;1] \subset [0\;;2]$

    **(c)** $\{0\} \subset \mathbb{N}$

    **(d)** $0 \subset \mathbb{N}$
  corrige: |
    **1.** Soit $n \in \mathcal{M}_{12}$ : il existe $k \in \mathbb{Z}$ tel que $n = 12k$. Alors $n = 6 \times (2k)$ et $n = 4 \times (3k)$, avec $2k$ et $3k$ entiers. De même, si $n = 6k$, alors $n = 3 \times (2k)$. 
    $$\boxed{\mathcal{M}_{12} \subset \mathcal{M}_{6} \quad;\quad \mathcal{M}_{12} \subset \mathcal{M}_{4} \quad;\quad \mathcal{M}_{6} \subset \mathcal{M}_{3}}$$

    **2.** On exhibe un contre-exemple dans chaque sens : $6 \in \mathcal{M}_{6}$ mais $6 \notin \mathcal{M}_{4}$, et $4 \in \mathcal{M}_{4}$ mais $4 \notin \mathcal{M}_{6}$. 
    $$\boxed{\text{Aucune des deux inclusions n'est vraie.}}$$

    **3.** Supposons $\mathcal{M}_{k} \subset \mathcal{M}_{\ell}$. Comme $k = k \times 1 \in \mathcal{M}_{k}$, on a $k \in \mathcal{M}_{\ell}$, donc $\ell$ divise $k$. Réciproquement, si $k = \ell m$ avec $m \in \mathbb{Z}$, alors tout $n = kq$ s'écrit $n = \ell(mq)$, donc $n \in \mathcal{M}_{\ell}$. 
    $$\boxed{\mathcal{M}_{k} \subset \mathcal{M}_{\ell} \;\Longleftrightarrow\; \ell \text{ divise } k}$$
     On notera l'inversion : plus $k$ est grand au sens de la divisibilité, plus $\mathcal{M}_{k}$ est petit.

    **4.** **(a)** $\boxed{\textbf{Vraie}}$ : tout entier naturel est un entier relatif, tout entier relatif $n$ s'écrit $\frac{n}{1}$, et tout rationnel est un réel.

    **(b)** $\boxed{\textbf{Vraie}}$ : si $0 \leqslant x \leqslant 1$, alors $0 \leqslant x \leqslant 2$.

    **(c)** $\boxed{\textbf{Vraie}}$ : l'unique élément de $\{0\}$ est $0$, qui appartient à $\mathbb{N}$.

    **(d)** $\boxed{\textbf{Fausse}}$ : $0$ est un élément et non un ensemble ; il faut écrire $0 \in \mathbb{N}$.
- id: "ap-01-20"
  feuille: "f-ap-01"
  numero: 20
  partie: "Inclusion et égalité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inclusion et égalité]
  noeuds: [zf-ext]
  notions: [ensemble]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Démontrer les égalités d'ensembles suivantes par double inclusion, en respectant le schéma de rédaction du cours.

    **1.** $\{x \in \mathbb{R} \mid |x - 1| \leqslant 2\} = [-1\;;3]$

    **2.** $\{n \in \mathbb{Z} \mid n^{2} \leqslant 4\} = \{-2 \;;\; -1 \;;\; 0 \;;\; 1 \;;\; 2\}$

    **3.** $\{x \in \mathbb{R} \mid x^{2} - 3x + 2 \leqslant 0\} = [1\;;2]$
  corrige: |
    **1.** Soit $x \in \mathbb{R}$ tel que $|x-1| \leqslant 2$. Alors $-2 \leqslant x - 1 \leqslant 2$, d'où $-1 \leqslant x \leqslant 3$ : donc $x \in [-1\;;3]$.

    Réciproquement, soit $x \in [-1\;;3]$. Alors $-1 \leqslant x \leqslant 3$, d'où $-2 \leqslant x-1 \leqslant 2$, c'est-à-dire $|x-1| \leqslant 2$. 
    $$\boxed{\{x \in \mathbb{R} \mid |x-1| \leqslant 2\} = [-1\;;3]}$$

    **2.** Soit $n \in \mathbb{Z}$ tel que $n^{2} \leqslant 4$. Si $|n| \geqslant 3$, alors $n^{2} \geqslant 9 > 4$ : on a donc $|n| \leqslant 2$, c'est-à-dire $n \in \{-2 \;;\; -1 \;;\; 0 \;;\; 1 \;;\; 2\}$.

    Réciproquement, chacun de ces cinq entiers vérifie $n^{2} \leqslant 4$, les carrés valant respectivement $4$, $1$, $0$, $1$ et $4$. 
    $$\boxed{\{n \in \mathbb{Z} \mid n^{2} \leqslant 4\} = \{-2 \;;\; -1 \;;\; 0 \;;\; 1 \;;\; 2\}}$$

    **3.** On factorise : $x^{2} - 3x + 2 = (x-1)(x-2)$.

    Soit $x \in \mathbb{R}$ tel que $(x-1)(x-2) \leqslant 0$. Si $x < 1$, alors $x - 1 < 0$ et $x - 2 < 0$, donc le produit est strictement positif. Si $x > 2$, les deux facteurs sont strictement positifs et le produit l'est aussi. Ces deux cas étant exclus, on a $1 \leqslant x \leqslant 2$.

    Réciproquement, si $1 \leqslant x \leqslant 2$, alors $x - 1 \geqslant 0$ et $x - 2 \leqslant 0$, donc le produit est négatif. 
    $$\boxed{\{x \in \mathbb{R} \mid x^{2} - 3x + 2 \leqslant 0\} = [1\;;2]}$$
- id: "ap-01-21"
  feuille: "f-ap-01"
  numero: 21
  partie: "Opérations sur les ensembles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [opérations ensemblistes, ensemble des parties]
  noeuds: [zf-operations, zf-parties]
  notions: []
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On pose $E = \{1 \;;\; 2 \;;\; 3 \;;\; 4 \;;\; 5 \;;\; 6 \;;\; 7 \;;\; 8\}$, puis $A = \{1 \;;\; 2 \;;\; 3 \;;\; 4\}$, $B = \{3 \;;\; 4 \;;\; 5 \;;\; 6\}$ et $C = \{2 \;;\; 4 \;;\; 6 \;;\; 8\}$. Les complémentaires sont pris dans $E$.

    **1.** Déterminer $A \cap B$, $A \cup B$, $A \setminus B$, $B \setminus A$ et $\overline{A}$.

    **2.** Déterminer $(A \cup B) \cap C$, $A \cap B \cap C$ et $(A \cap B) \cup C$.

    **3.** Vérifier sur cet exemple l'égalité $\overline{A \cup B} = \overline{A} \cap \overline{B}$.

    **4.** On pose maintenant $I = [-2\;;5]$ et $J = \;]1\;;+\infty[$, parties de $\mathbb{R}$. Déterminer $I \cap J$, $I \cup J$, $\mathbb{R} \setminus J$ et $I \setminus J$.
  corrige: |
    **1.** On applique les définitions des trois opérations : 
    $$\boxed{\begin{array}{l} A \cap B = \{3 \;;\; 4\} \quad;\quad A \cup B = \{1 \;;\; 2 \;;\; 3 \;;\; 4 \;;\; 5 \;;\; 6\} \\[1mm] A \setminus B = \{1 \;;\; 2\} \quad;\quad B \setminus A = \{5 \;;\; 6\} \quad;\quad \overline{A} = \{5 \;;\; 6 \;;\; 7 \;;\; 8\} \end{array}}$$
     On remarque au passage que $A \setminus B$ et $B \setminus A$ sont différents : la différence n'est pas symétrique.

    **2.** On procède de la même manière : 
    $$\boxed{(A \cup B) \cap C = \{2 \;;\; 4 \;;\; 6\} \quad;\quad A \cap B \cap C = \{4\} \quad;\quad (A \cap B) \cup C = \{2 \;;\; 3 \;;\; 4 \;;\; 6 \;;\; 8\}}$$

    **3.** On calcule séparément les deux membres : 
    $$\overline{A \cup B} = E \setminus \{1 \;;\; 2 \;;\; 3 \;;\; 4 \;;\; 5 \;;\; 6\} = \{7 \;;\; 8\}$$

    $$\overline{A} \cap \overline{B} = \{5 \;;\; 6 \;;\; 7 \;;\; 8\} \cap \{1 \;;\; 2 \;;\; 7 \;;\; 8\} = \{7 \;;\; 8\}$$

    $$\boxed{\text{Les deux ensembles coïncident, conformément aux lois de De Morgan.}}$$

    **4.** On raisonne sur les bornes des deux intervalles : 
    $$\boxed{I \cap J = \;]1\;;5] \quad;\quad I \cup J = [-2\;;+\infty[ \quad;\quad \mathbb{R} \setminus J = \;]-\infty\;;1] \quad;\quad I \setminus J = [-2\;;1]}$$

    *Piège :* la borne $1$ est exclue de $J$, donc elle appartient à $\mathbb{R} \setminus J$ et à $I \setminus J$ : les crochets se retournent au passage au complémentaire.
- id: "ap-01-22"
  feuille: "f-ap-01"
  numero: 22
  partie: "Opérations sur les ensembles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [opérations ensemblistes]
  noeuds: [zf-operations]
  notions: []
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Dans chacun des quatre diagrammes ci-dessous, $A$ et $B$ sont deux parties d'un ensemble $E$. Donner, pour chaque zone coloriée, une expression à l'aide des symboles $\cap$, $\cup$, $\setminus$ et du passage au complémentaire.

    ![Figure](documents/figures/1858cf66567dc390.svg)

    ![Figure](documents/figures/098a20176945ae47.svg)

    ![Figure](documents/figures/c08dbb85deeb6f95.svg)

    ![Figure](documents/figures/e4a7aa7165bcb7b7.svg)

    Pour le dernier diagramme, on donnera deux expressions différentes.
  corrige: |
    $$\textbf{(a)}\; \boxed{A \cap B} \qquad\qquad \textbf{(b)}\; \boxed{A \setminus B = A \cap \overline{B}} \qquad\qquad \textbf{(c)}\; \boxed{\overline{A \cup B} = \overline{A} \cap \overline{B}}$$

    $$\textbf{(d)}\; \boxed{(A \cup B) \setminus (A \cap B) \qquad\text{ou}\qquad (A \setminus B) \cup (B \setminus A)}$$

    Pour **(c)**, les deux écritures correspondent aux deux façons de lire la zone : « ce qui n'est pas dans la réunion » ou « ce qui est à la fois hors de $A$ et hors de $B$ ». Leur égalité est précisément la loi de De Morgan démontrée dans le cours.

    Pour **(d)**, la première écriture retire de la réunion la partie commune, la seconde réunit les deux « croissants ». Cet ensemble est étudié en détail à l'exercice 30.
- id: "ap-01-23"
  feuille: "f-ap-01"
  numero: 23
  partie: "Opérations sur les ensembles"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [inclusion et égalité, opérations ensemblistes]
  noeuds: [zf-ext, zf-operations]
  notions: [ensemble]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    On considère le diagramme ci-dessous, où $A$, $B$ et $C$ sont trois parties d'un ensemble $E$, et où $a$, $b$, $c$, $d$, $e$, $f$, $g$ et $h$ sont des éléments de $E$. Les complémentaires sont pris dans $E$.

    ![Figure](documents/figures/6e74211d8bff2653.svg)

    Dire si les assertions suivantes sont vraies ou fausses, en justifiant.

    **1.** $g \in A \cap \overline{B}$

    **2.** $g \in \overline{A} \cap \overline{B}$

    **3.** $g \in \overline{A} \cup \overline{B}$

    **4.** $f \in C \cap A$

    **5.** $e \in \overline{A} \cap \overline{B} \cap \overline{C}$

    **6.** $\{h \;;\, b\} \subset \overline{A} \cap \overline{B}$

    **7.** $\{a \;;\, f\} \subset A \cup C$
  corrige: |
    La lecture du diagramme donne : 
    $$A = \{a \;;\; d \;;\; e \;;\; f\} \qquad B = \{c \;;\; d \;;\; e \;;\; g\} \qquad C = \{e \;;\; f \;;\; g \;;\; h\}$$
     et donc, les complémentaires étant pris dans $E$ : 
    $$\overline{A} = \{b \;;\; c \;;\; g \;;\; h\} \qquad \overline{B} = \{a \;;\; b \;;\; f \;;\; h\} \qquad \overline{C} = \{a \;;\; b \;;\; c \;;\; d\}$$

    **1.** L'élément $g$ n'appartient pas à $A$, donc pas à $A \cap \overline{B}$ : $\boxed{\textbf{Fausse}}$

    **2.** L'élément $g$ appartient à $B$, donc pas à $\overline{B}$ : $\boxed{\textbf{Fausse}}$

    **3.** L'élément $g$ n'appartient pas à $A$, donc $g \in \overline{A}$, et il suffit d'appartenir à l'un des deux ensembles d'une réunion : $\boxed{\textbf{Vraie}}$

    **4.** L'élément $f$ appartient à la fois à $A$ et à $C$ : $\boxed{\textbf{Vraie}}$

    **5.** L'élément $e$ appartient aux trois ensembles $A$, $B$ et $C$ : $\boxed{\textbf{Fausse}}$

    **6.** Les éléments $h$ et $b$ n'appartiennent ni à $A$ ni à $B$ : $\boxed{\textbf{Vraie}}$

    **7.** On a $a \in A$ et $f \in A$, donc les deux appartiennent à $A \cup C$ : $\boxed{\textbf{Vraie}}$

    *Piège :* les assertions 1 et 2 sont fausses pour des raisons *différentes* — la première parce que $g \notin A$, la seconde parce que $g \in B$. Il ne suffit pas de constater qu'une assertion est fausse, il faut dire quel facteur la met en défaut.
- id: "ap-01-24"
  feuille: "f-ap-01"
  numero: 24
  partie: "Opérations sur les ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [équivalence, inclusion et égalité, opérations ensemblistes]
  noeuds: [l-connecteurs, zf-ext, zf-operations]
  notions: [ensemble]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soient $F$, $G$ et $H$ trois parties d'un ensemble $E$, les complémentaires étant pris dans $E$.

    **1.** Le cours démontre l'égalité $\overline{F \cup G} = \overline{F} \cap \overline{G}$ par équivalences successives. Rédiger de la même manière la démonstration de $\overline{F \cap G} = \overline{F} \cup \overline{G}$.

    **2.** Démontrer par double inclusion que $(F \cap G) \cup H = (F \cup H) \cap (G \cup H)$.

    **3.** Application : en notant $\mathcal{M}_{k}$ l'ensemble des multiples de $k$ dans $\mathbb{Z}$, démontrer que $\mathcal{M}_{2} \cap \mathcal{M}_{3} = \mathcal{M}_{6}$.
  corrige: |
    **1.** Soit $x \in E$. On enchaîne les équivalences : 
    $$\begin{aligned} x \in \overline{F \cap G} &\iff x \notin F \cap G \\ &\iff \text{non}\big(x \in F \text{ et } x \in G\big) \\ &\iff x \notin F \;\text{ ou }\; x \notin G \\ &\iff x \in \overline{F} \;\text{ ou }\; x \in \overline{G} \\ &\iff x \in \overline{F} \cup \overline{G} \end{aligned}$$
     la troisième équivalence provenant des lois de De Morgan de la propriété 1. 
    $$\boxed{\overline{F \cap G} = \overline{F} \cup \overline{G}}$$

    **2.** *Première inclusion.* Soit $x \in (F \cap G) \cup H$. Deux cas se présentent.

    • Si $x \in F \cap G$, alors $x \in F$ et $x \in G$, donc $x \in F \cup H$ et $x \in G \cup H$.

    • Si $x \in H$, alors $x \in F \cup H$ et $x \in G \cup H$.

    Dans les deux cas, $x \in (F \cup H) \cap (G \cup H)$.

    *Réciproquement*, soit $x \in (F \cup H) \cap (G \cup H)$. Si $x \in H$, alors $x \in (F \cap G) \cup H$. Sinon $x \notin H$ : de $x \in F \cup H$ on tire $x \in F$, et de $x \in G \cup H$ on tire $x \in G$, donc $x \in F \cap G$, et *a fortiori* $x \in (F \cap G) \cup H$. 
    $$\boxed{(F \cap G) \cup H = (F \cup H) \cap (G \cup H)}$$

    **3.** *Première inclusion.* Soit $n \in \mathcal{M}_{6}$ : il existe $k \in \mathbb{Z}$ tel que $n = 6k = 2(3k) = 3(2k)$, donc $n \in \mathcal{M}_{2} \cap \mathcal{M}_{3}$.

    *Réciproquement*, soit $n \in \mathcal{M}_{2} \cap \mathcal{M}_{3}$. Il existe $k \in \mathbb{Z}$ tel que $n = 3k$, et $n$ est pair. Si $k$ était impair, alors $n = 3k$ serait le produit de deux entiers impairs, donc impair : c'est exclu. Ainsi $k$ est pair, $k = 2m$ avec $m \in \mathbb{Z}$, et $n = 6m \in \mathcal{M}_{6}$. 
    $$\boxed{\mathcal{M}_{2} \cap \mathcal{M}_{3} = \mathcal{M}_{6}}$$
- id: "ap-01-25"
  feuille: "f-ap-01"
  numero: 25
  partie: "Opérations sur les ensembles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [propositions, implication, équivalence, inclusion et égalité, opérations ensemblistes]
  noeuds: [l-connecteurs, zf-ext, zf-operations]
  notions: [ensemble]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soient $A$ et $B$ deux parties d'un ensemble $E$. Démontrer que les quatre propositions suivantes sont équivalentes : 
    $$(i)\; A \subset B \qquad (ii)\; A \cap B = A \qquad (iii)\; A \cup B = B \qquad (iv)\; A \setminus B = \varnothing$$

    On pourra établir la chaîne d'implications $(i) \Rightarrow (ii) \Rightarrow (iii) \Rightarrow (iv) \Rightarrow (i)$ plutôt que de démontrer séparément chacune des équivalences.
  corrige: |
    Démontrer les six équivalences séparément demanderait douze implications ; la chaîne n'en demande que quatre.

    $\boldsymbol{(i) \Rightarrow (ii)}$ Supposons $A \subset B$. L'inclusion $A \cap B \subset A$ est toujours vraie. Réciproquement, soit $x \in A$ : alors $x \in B$ par hypothèse, donc $x \in A \cap B$. D'où $A \cap B = A$.

    $\boldsymbol{(ii) \Rightarrow (iii)}$ Supposons $A \cap B = A$. L'inclusion $B \subset A \cup B$ est toujours vraie. Réciproquement, soit $x \in A \cup B$. Si $x \in B$, c'est fini. Sinon $x \in A = A \cap B$, donc $x \in B$. D'où $A \cup B = B$.

    $\boldsymbol{(iii) \Rightarrow (iv)}$ Supposons $A \cup B = B$, et soit $x \in A \setminus B$. Alors $x \in A$, donc $x \in A \cup B = B$, ce qui contredit $x \notin B$. L'ensemble $A \setminus B$ n'a donc aucun élément.

    $\boldsymbol{(iv) \Rightarrow (i)}$ Supposons $A \setminus B = \varnothing$, et soit $x \in A$. Si $x \notin B$, alors $x \in A \setminus B = \varnothing$, ce qui est absurde. Donc $x \in B$, et $A \subset B$.

    $$\boxed{\text{Les quatre propositions } (i), (ii), (iii) \text{ et } (iv) \text{ sont équivalentes.}}$$
     La chaîne étant fermée, chacune entraîne toutes les autres en la parcourant : par exemple $(iii) \Rightarrow (ii)$ s'obtient en passant par $(iv)$ puis $(i)$.
- id: "ap-01-26"
  feuille: "f-ap-01"
  numero: 26
  partie: "Parties d'un ensemble et produit cartésien"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [connecteurs et tables de vérité, inclusion et égalité, opérations ensemblistes]
  noeuds: [l-connecteurs, zf-ext, zf-operations]
  notions: [connecteur, ensemble]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Soient $A$, $B$ et $C$ trois ensembles tels que $A \cup B = B \cap C$. Montrer que : 
    $$A \subset B \subset C$$

    **2.** Soient $A$, $B$ et $C$ trois ensembles. Montrer que : 
    $$\big(A \cup B \subset A \cup C \;\text{ et }\; A \cap B \subset A \cap C\big) \;\Longrightarrow\; B \subset C$$

    **3.** Soient $A$, $B$ et $C$ trois parties d'un ensemble $E$. Montrer que : 
    $$B \cap \overline{C} \subset A \;\Longrightarrow\; B \cap \overline{A} \subset C$$

    **4.** Soient $A$, $B$ et $C$ trois parties d'un ensemble $E$. Montrer que : 
    $$A \cap B = A \cap C \;\Longleftrightarrow\; A \cap \overline{B} = A \cap \overline{C}$$

    **5.** Soient $A$, $B$ et $C$ trois parties d'un ensemble $E$. Montrer que : 
    $$\big(A \cup B = A \cup C\big) \;\text{ et }\; \big(A \cap B = A \cap C\big) \;\Longrightarrow\; B = C$$

    **6.** Soient $A$, $B$, $C$ et $D$ quatre parties d'un ensemble $E$. Montrer que : 
    $$\left.\begin{array}{l} A \subset C \\ B \subset D \\ C \cap D = \varnothing \\ A \cup B = C \cup D \end{array}\right\} \;\Longrightarrow\; \left\{\begin{array}{l} A = C \\ B = D \end{array}\right.$$
  corrige: |
    **1.** On utilise les inclusions toujours vraies $A \subset A \cup B$ et $B \cap C \subset B$ : 
    $$A \;\subset\; A \cup B \;=\; B \cap C \;\subset\; B$$
     On procède de la même manière avec $B \subset A \cup B$ et $B \cap C \subset C$ : 
    $$B \;\subset\; A \cup B \;=\; B \cap C \;\subset\; C$$

    $$\boxed{A \subset B \subset C}$$

    **2.** Soit $x \in B$. Alors $x \in A \cup B \subset A \cup C$, donc $x \in A$ ou $x \in C$.

    • Si $x \in C$, la conclusion est acquise.

    • Si $x \in A$, alors $x \in A \cap B$ puisque $x \in B$. Or $A \cap B \subset A \cap C$, donc $x \in A \cap C$ et en particulier $x \in C$.

    $$\boxed{\big(A \cup B \subset A \cup C \text{ et } A \cap B \subset A \cap C\big) \;\Longrightarrow\; B \subset C}$$

    **3.** Supposons $B \cap \overline{C} \subset A$, et soit $x \in B \cap \overline{A}$ : on a $x \in B$ et $x \notin A$. Si $x \notin C$, alors $x \in B \cap \overline{C} \subset A$, donc $x \in A$ : c'est contradictoire. Donc $x \in C$. 
    $$\boxed{B \cap \overline{C} \subset A \;\Longrightarrow\; B \cap \overline{A} \subset C}$$

    **4.** *Sens direct.* Supposons $A \cap B = A \cap C$, et soit $x \in A \cap \overline{B}$ : on a $x \in A$ et $x \notin B$. Si $x \in C$, alors $x \in A \cap C = A \cap B$, donc $x \in B$ : c'est contradictoire. Donc $x \notin C$, c'est-à-dire $x \in A \cap \overline{C}$. On a montré $A \cap \overline{B} \subset A \cap \overline{C}$, et l'autre inclusion s'obtient en échangeant les rôles de $B$ et $C$.

    *Réciproque.* Le sens direct vient d'être établi pour *toutes* les parties $B$ et $C$ de $E$. Appliquons-le à $\overline{B}$ et $\overline{C}$ : de $A \cap \overline{B} = A \cap \overline{C}$, il vient $A \cap \overline{\overline{B}} = A \cap \overline{\overline{C}}$, c'est-à-dire $A \cap B = A \cap C$. 
    $$\boxed{A \cap B = A \cap C \;\Longleftrightarrow\; A \cap \overline{B} = A \cap \overline{C}}$$
     Cette réciproque « gratuite » mérite d'être notée : plutôt que de refaire la démonstration, on applique le sens direct à d'autres ensembles bien choisis.

    **5.** Soit $x \in B$. Alors $x \in A \cup B = A \cup C$, donc $x \in A$ ou $x \in C$.

    • Si $x \in C$, la conclusion est acquise.

    • Si $x \in A$, alors $x \in A \cap B = A \cap C$, donc $x \in C$.

    Ainsi $B \subset C$. Les hypothèses étant symétriques en $B$ et $C$, le même raisonnement donne $C \subset B$. 
    $$\boxed{\big(A \cup B = A \cup C\big) \text{ et } \big(A \cap B = A \cap C\big) \;\Longrightarrow\; B = C}$$
     On remarquera que chacune des deux hypothèses seule est insuffisante : avec $A = E$, la première est toujours vraie ; avec $A = \varnothing$, la seconde l'est aussi.

    **6.** *Montrons $C \subset A$.* Soit $x \in C$. Alors $x \in C \cup D = A \cup B$, donc $x \in A$ ou $x \in B$. Si $x \in B$, alors $x \in D$ puisque $B \subset D$, donc $x \in C \cap D = \varnothing$ : c'est absurde. Donc $x \in A$. Avec l'hypothèse $A \subset C$, on obtient $A = C$.

    *Montrons $D \subset B$.* Soit $x \in D$. Alors $x \in C \cup D = A \cup B$, donc $x \in A$ ou $x \in B$. Si $x \in A$, alors $x \in C$ puisque $A \subset C$, donc $x \in C \cap D = \varnothing$ : c'est absurde. Donc $x \in B$. Avec l'hypothèse $B \subset D$, on obtient $B = D$. 
    $$\boxed{A = C \quad\text{et}\quad B = D}$$
     C'est l'hypothèse $C \cap D = \varnothing$ qui fait tout le travail : elle interdit à un élément d'être à la fois dans $C$ et dans $D$, donc de « passer » d'un ensemble à l'autre.
- id: "ap-01-27"
