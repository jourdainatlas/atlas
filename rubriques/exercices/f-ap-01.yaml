  enonce: |
    On pose $E = \{1 \;;\; 2 \;;\; 3\}$ et $F = \{a \;;\; b\}$.

    **1.** Écrire $E \times F$ puis $F \times E$ en extension. Ces deux ensembles ont-ils le même nombre d'éléments ? Sont-ils égaux ?

    **2.** Déterminer $(E \times F) \cap (F \times E)$.

    **3.** Décrire géométriquement la partie $[0\;;2] \times [1\;;3]$ du plan.

    **4.** Soient $A$ et $B$ deux ensembles. Démontrer que $A \times B = \varnothing$ si et seulement si $A = \varnothing$ ou $B = \varnothing$.

    **5.** Soient $A \subset E$ et $B \subset F$. Démontrer que $A \times B \subset E \times F$.
  corrige: |
    **1.** On énumère tous les couples : 
    $$\boxed{\begin{array}{l} E \times F = \big\{(1\,;a) \;;\; (1\,;b) \;;\; (2\,;a) \;;\; (2\,;b) \;;\; (3\,;a) \;;\; (3\,;b)\big\} \\[1mm] F \times E = \big\{(a\,;1) \;;\; (a\,;2) \;;\; (a\,;3) \;;\; (b\,;1) \;;\; (b\,;2) \;;\; (b\,;3)\big\} \end{array}}$$
     Chacun compte $3 \times 2 = 6$ éléments. En revanche ils ne sont pas égaux : $(1\,;a) \in E \times F$ mais $(1\,;a) \notin F \times E$, car la première coordonnée d'un élément de $F \times E$ appartient à $F$. 
    $$\boxed{\text{Même nombre d'éléments, mais } E \times F \neq F \times E.}$$

    **2.** Un élément de $E \times F$ a sa première coordonnée dans $E$, un élément de $F \times E$ l'a dans $F$. Comme $E \cap F = \varnothing$, aucun couple ne peut appartenir aux deux : 
    $$\boxed{(E \times F) \cap (F \times E) = \varnothing}$$

    **3.** Un couple $(x\,;y)$ appartient à $[0\;;2] \times [1\;;3]$ lorsque $0 \leqslant x \leqslant 2$ et $1 \leqslant y \leqslant 3$. 
    $$\boxed{\text{C'est le rectangle plein de sommets } (0\,;1),\, (2\,;1),\, (2\,;3) \text{ et } (0\,;3), \text{ côtés compris.}}$$

    **4.** *Sens direct*, par contraposée. Supposons $A \neq \varnothing$ et $B \neq \varnothing$. On peut alors choisir $a \in A$ et $b \in B$, et le couple $(a\,;b)$ appartient à $A \times B$, qui n'est donc pas vide.

    *Réciproque.* Si $A = \varnothing$, il n'existe aucun $x \in A$, donc aucun couple $(x\,;y)$ avec $x \in A$ : le produit est vide. Il en va de même si $B = \varnothing$. 
    $$\boxed{A \times B = \varnothing \;\Longleftrightarrow\; \big(A = \varnothing \text{ ou } B = \varnothing\big)}$$

    **5.** Soit $(x\,;y) \in A \times B$. Alors $x \in A \subset E$, donc $x \in E$ ; et $y \in B \subset F$, donc $y \in F$. Ainsi $(x\,;y) \in E \times F$. 
    $$\boxed{A \times B \subset E \times F}$$
- id: "ap-01-29"
  feuille: "f-ap-01"
  numero: 29
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux, Démonstration]
  mots_cles: [propositions, négation, implication, quantificateurs, inclusion et égalité, opérations ensemblistes]
  noeuds: [l-connecteurs, l-tautologies, log, zf-ext, zf-operations]
  notions: [tautologie, quantificateur, ensemble]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $A$ et $B$ désignent des propositions, et $E$, $F$, $G$ des ensembles.

    **1.** Si $A$ est fausse, alors $A \Rightarrow B$ est vraie.

    **2.** La négation de « $x \geqslant 0$ et $y \geqslant 0$ » est « $x < 0$ et $y < 0$ ».

    **3.** Une implication et sa contraposée ont la même valeur de vérité.

    **4.** Une implication et sa réciproque ont la même valeur de vérité.

    **5.** Un exemple suffit à démontrer qu'une proposition commençant par « pour tout » est vraie.

    **6.** Pour tout ensemble $E$, on a $\varnothing \subset E$ et $\varnothing \in \mathcal{P}(E)$.

    **7.** Si $E$ possède $n$ éléments, alors $\mathcal{P}(E)$ en possède $2n$.

    **8.** Dans une proposition, deux quantificateurs de même nature peuvent être permutés sans changer sa valeur de vérité.

    **9.** Le « ou » des mathématiques est inclusif.

    **10.** Pour toutes parties $F$ et $G$ de $E$, on a $\overline{F \cup G} = \overline{F} \cap \overline{G}$.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ Les deux dernières lignes de la table de vérité de l'implication donnent V lorsque $A$ est fausse, quelle que soit $B$. Une hypothèse fausse permet de conclure n'importe quoi.

    **2.** $\boxed{\textbf{Fausse}}$ Les lois de De Morgan échangent le « et » et le « ou » : la négation est « $x < 0$ ou $y < 0$ ». Le couple $x = -1$, $y = 1$ met l'affirmation en défaut.

    **3.** $\boxed{\textbf{Vraie}}$ C'est le résultat du cours : démontrer une implication ou sa contraposée, c'est démontrer la même chose.

    **4.** $\boxed{\textbf{Fausse}}$ L'implication « si $n$ est multiple de $4$, alors $n$ est pair » est vraie, sa réciproque est fausse (exercice 6).

    **5.** $\boxed{\textbf{Fausse}}$ Un exemple ne démontre rien pour une proposition universelle. L'exercice 10 en donne l'illustration la plus frappante : $n^{2} + n + 41$ est premier pour $n$ allant de $0$ à $40$, et cesse de l'être en $41$.

    **6.** $\boxed{\textbf{Vraie}}$ L'ensemble vide est inclus dans tout ensemble, donc c'est une partie de $E$, donc un élément de $\mathcal{P}(E)$.

    **7.** $\boxed{\textbf{Fausse}}$ Il en possède $2^{n}$, et non $2n$. Pour $n = 4$, l'exercice 27 en dénombre $16$ et non $8$.

    **8.** $\boxed{\textbf{Vraie}}$ C'est la remarque finale du cours : deux $\forall$ consécutifs, ou deux $\exists$ consécutifs, peuvent être permutés. Seuls des quantificateurs de natures différentes ne le peuvent pas.

    **9.** $\boxed{\textbf{Vraie}}$ « $A$ ou $B$ » est vraie dès que l'une des deux l'est, y compris lorsque les deux le sont.

    **10.** $\boxed{\textbf{Vraie}}$ C'est la loi de De Morgan ensembliste, démontrée dans le cours et vérifiée sur un exemple à l'exercice 21.
- id: "ap-01-30"
  feuille: "f-ap-01"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [connecteurs et tables de vérité, inclusion et égalité, opérations ensemblistes]
  noeuds: [l-connecteurs, zf-ext, zf-operations]
  notions: [connecteur, ensemble]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soient $A$ et $B$ deux parties d'un ensemble $E$. On appelle *différence symétrique* de $A$ et $B$ l'ensemble : 
    $$A \,\Delta\, B = (A \setminus B) \cup (B \setminus A)$$

    **1.** Sur l'exemple de l'exercice 21, avec $A = \{1 \;;\; 2 \;;\; 3 \;;\; 4\}$ et $B = \{3 \;;\; 4 \;;\; 5 \;;\; 6\}$, déterminer $A \,\Delta\, B$.

    **2.** Auquel des quatre diagrammes de l'exercice 22 la différence symétrique correspond-elle ?

    **3.** Montrer que, pour tout $x \in E$ : 
    $$x \in A \,\Delta\, B \quad\Longleftrightarrow\quad \Big(\big(x \in A \text{ ou } x \in B\big) \text{ et } \text{non}\big(x \in A \text{ et } x \in B\big)\Big)$$

    **4.** En déduire l'égalité $A \,\Delta\, B = (A \cup B) \setminus (A \cap B)$.

    **5.** Déterminer $A \,\Delta\, A$, $A \,\Delta\, \varnothing$ et $A \,\Delta\, E$.

    **6.** Démontrer que $A \,\Delta\, B = \varnothing$ si et seulement si $A = B$.

    **7.** Le cours souligne que le « ou » des mathématiques est inclusif. Expliquer en quoi la question 3 fait apparaître le « ou » exclusif du langage courant, celui du « fromage ou dessert ».
  corrige: |
    **1.** On a $A \setminus B = \{1 \;;\; 2\}$ et $B \setminus A = \{5 \;;\; 6\}$, d'où : 
    $$\boxed{A \,\Delta\, B = \{1 \;;\; 2 \;;\; 5 \;;\; 6\}}$$

    **2.** C'est la zone formée des deux « croissants », c'est-à-dire la réunion privée de l'intersection : 
    $$\boxed{\text{Le diagramme } \textbf{(d)}.}$$

    **3.** Notons $P$ la proposition « $x \in A$ » et $Q$ la proposition « $x \in B$ ». Par définition de la réunion et de la différence : 
    $$x \in A \,\Delta\, B \iff \big(P \text{ et } \text{non } Q\big) \;\text{ ou }\; \big(Q \text{ et } \text{non } P\big)$$
     Comparons cette proposition à $\big(P \text{ ou } Q\big) \text{ et } \text{non}\big(P \text{ et } Q\big)$ par une table de vérité :

    $$\begin{array}{|c|c||c||c|c||c|} \hline P & Q & (P \text{ et } \text{non } Q) \text{ ou } (Q \text{ et } \text{non } P) & P \text{ ou } Q & \text{non}(P \text{ et } Q) & (P \text{ ou } Q) \text{ et } \text{non}(P \text{ et } Q) \\ \hline \text{V} & \text{V} & \text{F} & \text{V} & \text{F} & \text{F} \\ \hline \text{V} & \text{F} & \text{V} & \text{V} & \text{V} & \text{V} \\ \hline \text{F} & \text{V} & \text{V} & \text{V} & \text{V} & \text{V} \\ \hline \text{F} & \text{F} & \text{F} & \text{F} & \text{V} & \text{F} \\ \hline \end{array}$$

    Les deux colonnes encadrées coïncident, ce qui établit l'équivalence demandée : 
    $$\boxed{x \in A \,\Delta\, B \iff \Big(\big(x \in A \text{ ou } x \in B\big) \text{ et } \text{non}\big(x \in A \text{ et } x \in B\big)\Big)}$$

    **4.** On traduit chacun des deux membres du « et » : 
    $$\big(x \in A \text{ ou } x \in B\big) \iff x \in A \cup B \qquad\text{et}\qquad \text{non}\big(x \in A \text{ et } x \in B\big) \iff x \notin A \cap B$$
     La question 3 se relit donc : $x \in A \,\Delta\, B$ si et seulement si $x \in A \cup B$ et $x \notin A \cap B$, ce qui est la définition de la différence. 
    $$\boxed{A \,\Delta\, B = (A \cup B) \setminus (A \cap B)}$$

    **5.** On applique la question 4 : 
    $$A \,\Delta\, A = (A \cup A) \setminus (A \cap A) = A \setminus A = \varnothing$$

    $$A \,\Delta\, \varnothing = (A \cup \varnothing) \setminus (A \cap \varnothing) = A \setminus \varnothing = A$$

    $$A \,\Delta\, E = (A \cup E) \setminus (A \cap E) = E \setminus A = \overline{A}$$

    $$\boxed{A \,\Delta\, A = \varnothing \quad;\quad A \,\Delta\, \varnothing = A \quad;\quad A \,\Delta\, E = \overline{A}}$$

    **6.** *Sens direct.* Supposons $A \,\Delta\, B = \varnothing$. D'après la question 4, cela signifie $A \cup B \subset A \cap B$. Or les inclusions $A \cap B \subset A \subset A \cup B$ sont toujours vraies, donc : 
    $$A \cup B \subset A \cap B \subset A \subset A \cup B$$
     Toutes ces inclusions sont donc des égalités, et $A = A \cup B$. Le même raisonnement avec $B$ donne $B = A \cup B$, d'où $A = B$.

    *Réciproquement*, si $A = B$, alors $A \,\Delta\, B = A \,\Delta\, A = \varnothing$ d'après la question 5. 
    $$\boxed{A \,\Delta\, B = \varnothing \;\Longleftrightarrow\; A = B}$$

    **7.** La question 3 montre que $x$ appartient à $A \,\Delta\, B$ lorsque $x$ appartient à $A$ ou à $B$, *mais pas aux deux*. C'est exactement le sens du « ou » du langage courant dans « fromage ou dessert » : l'un des deux, à l'exclusion de l'autre. 
    $$\boxed{\begin{array}{l} \text{La réunion } A \cup B \text{ correspond au « ou » inclusif des mathématiques,} \\[1mm] \text{la différence symétrique } A \,\Delta\, B \text{ au « ou » exclusif du langage courant.} \end{array}}$$
     C'est pourquoi le cours prend soin de préciser que le « ou » mathématique est inclusif : le « ou » exclusif existe bien, mais il porte un autre nom et se note autrement.

