  enonce: |
    **Les géodésiques du cylindre.** Soit $C = \{x^{2} + y^{2} = 1\}$, paramétré par $f(\theta, z) = (\cos\theta, \sin\theta, z)$.

    **1.** Écrire les équations des géodésiques de $C$, et montrer que ce sont les courbes $f(a t + \theta_{0}, b t + z_{0})$ : hélices, génératrices et cercles horizontaux.

    **2.** Soient $p = f(0, 0)$ et $q = f(\pi, h)$, avec $h > 0$. Montrer qu'il existe une infinité de géodésiques joignant $p$ à $q$, et calculer leurs longueurs. Laquelle, ou lesquelles, réalisent la distance de $p$ à $q$ sur $C$ ?

    **3.** Montrer que deux points de $C$ qui ne sont pas sur une même génératrice sont joints par exactement deux géodésiques minimisantes lorsqu'ils sont diamétralement opposés sur leurs cercles horizontaux, et par une seule sinon. Le théorème 3 du cours est-il en défaut ?
  corrige: |
    **1.** $f_{\theta} = (-\sin\theta, \cos\theta, 0)$ et $f_{z} = (0, 0, 1)$ : $(g_{ij}) = I_{2}$, tous les $\Gamma_{ij}^{k}$ sont nuls et les équations s'écrivent $\theta'' = z'' = 0$. Les géodésiques sont donc les courbes $f(at + \theta_{0}, bt + z_{0})$ : *des hélices* si $ab \neq 0$, *des génératrices* si $a = 0$, *des cercles horizontaux* si $b = 0$. L'application $(\theta, z) \mapsto f(\theta, z)$, isométrie locale du plan sur le cylindre, enroule les droites du plan en ces courbes (figure du cours, section 4.5.1).

    **2.** Les géodésiques de $p$ à $q$ sont les images des segments joignant $(0, 0)$ à l'un des points $(\pi + 2k\pi, h)$, $k \in \mathbb{Z}$, qui représentent tous $q$. Elles sont *en nombre infini* et ont pour longueurs $\sqrt{(2k + 1)^{2}\pi^{2} + h^{2}}$. Toute courbe de $p$ à $q$ se relève en une courbe du plan joignant $(0, 0)$ à l'un de ces points (on relève l'angle par continuité), de même longueur : elle est au moins aussi longue que le segment correspondant (feuille 1, exercice 2). La distance vaut donc $\sqrt{\pi^{2} + h^{2}}$, et elle est réalisée par *deux géodésiques*, pour $k = 0$ et $k = -1$, qui tournent en sens contraires.

    ![Figure](documents/figures/72f476c803475849.svg)

    Le cylindre déroulé : la bande bleutée $-\pi \leq \theta \leq \pi$ en est une copie, et le point $q$ y a une infinité de représentants (en orange), aux abscisses $\pi + 2k\pi$. Les segments issus de $p$ donnent les géodésiques de $p$ à $q$ ; les deux plus courts (en rouge), symétriques, réalisent la distance.

    **3.** Pour deux points de paramètres $(\theta_{1}, z_{1})$ et $(\theta_{2}, z_{2})$, avec $\theta_{2} - \theta_{1} \equiv \delta \pmod{2\pi}$, $\delta \in \, ]0, 2\pi[$, les longueurs des géodésiques sont $\sqrt{(\delta + 2k\pi)^{2} + (z_{2} - z_{1})^{2}}$. Le minimum de $|\delta + 2k\pi|$ est atteint pour une seule valeur de $k$, sauf si $\delta = \pi$, où $k = 0$ et $k = -1$ donnent $\pi$ : *deux géodésiques minimisantes exactement pour les points diamétralement opposés sur leurs cercles horizontaux, une seule sinon*. Le théorème 3 n'est pas en défaut : il ne concerne que les points à une distance de $p$ inférieure au $\varepsilon$ du théorème 2, qui vaut ici au plus $\pi$.
