  enonce: |
    **Droites et grands cercles.**

    **1.** Soit $\Sigma$ une surface contenant un segment de droite $D$. Montrer que $D$, parcouru à vitesse constante, est une géodésique de $\Sigma$.

    **2.** Montrer qu'un grand cercle de $\mathbb{S}^{2}$, parcouru à vitesse constante, est une géodésique.

    **3.** En utilisant le théorème 1 du cours (existence et unicité), en déduire que les géodésiques de $\mathbb{S}^{2}$ sont exactement les grands cercles parcourus à vitesse constante, et les courbes constantes.
  corrige: |
    **1.** $c(t) = a + tb$ a une accélération nulle, donc normale : *c'est une géodésique.*

    **2.** Un grand cercle parcouru à vitesse $\omega$ s'écrit $c(t) = \cos(\omega t)a + \sin(\omega t)b$, avec $(a, b)$ orthonormée. Alors $c'' = -\omega^{2}c$ et, comme la normale à la sphère en $c(t)$ est $c(t)$, *$c''$ est normale*.

    **3.** Soit $p \in \mathbb{S}^{2}$ et $X \in T_{p}\mathbb{S}^{2} = p^{\perp}$ non nul. Le grand cercle $t \mapsto \cos(\lVert X \rVert t)p + \sin(\lVert X \rVert t)\dfrac{X}{\lVert X \rVert}$ est une géodésique de conditions initiales $(p, X)$ ; par l'unicité du théorème 1, toute géodésique de mêmes conditions initiales coïncide avec lui. Pour $X = 0$, la courbe constante est la seule. *Les géodésiques de la sphère sont les grands cercles parcourus à vitesse constante*, et les courbes constantes.
