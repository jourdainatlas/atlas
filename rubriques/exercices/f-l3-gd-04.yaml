  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [relation de Clairaut]
  noeuds: [sf-geodesiques, sf-christoffel]
  notions: [geodesique]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **La relation de Clairaut.** Soit $\Sigma$ la surface de révolution paramétrée par
    $$\phi(\theta, t) = (g(t)\cos\theta, g(t)\sin\theta, h(t)) ,$$
     où $g > 0$ et $g'^{2} + h'^{2} = 1$ (le profil est paramétré par longueur d'arc).

    **1.** Calculer la première forme fondamentale et les symboles de Christoffel, puis écrire les équations des géodésiques.

    **2.** Montrer que les méridiens $\theta =$ constante, parcourus à vitesse constante, sont des géodésiques, et qu'un parallèle $t = t_{0}$ en est une si et seulement si $g'(t_{0}) = 0$.

    **3.** Soit $c$ une géodésique parcourue à vitesse $1$, et $\varphi(s)$ l'angle entre $c'(s)$ et le parallèle passant par $c(s)$. Montrer que $g^{2}\theta'$ est constant, puis la *relation de Clairaut* : 
    $$g\big(t(s)\big)\cos\varphi(s) = \text{constante} .$$

    **4.** En déduire qu'une géodésique qui n'est pas un méridien reste dans la région où $g \geq |c_{0}|$, où $c_{0}$ est la constante de Clairaut, et qu'elle ne peut atteindre un parallèle où $g = |c_{0}|$ qu'en lui étant tangente.
  corrige: |
    **1.** Comme à la feuille 3, exercice 10, $\boxed{(g_{ij}) = \operatorname{diag}(g^{2}, 1)}$ dans les coordonnées $(\theta, t)$. La proposition 1 donne pour seuls symboles non nuls 
    $$\Gamma_{\theta t}^{\theta} = \Gamma_{t\theta}^{\theta} = \frac{g'}{g}, \qquad \Gamma_{\theta\theta}^{t} = -gg' ,$$
     et les équations des géodésiques sont 
    $$\theta'' + 2\frac{g'}{g}\theta't' = 0, \qquad t'' - gg'\theta'^{2} = 0 .$$

    **2.** Pour un méridien $\theta = \theta_{0}$, $t = as + b$, les deux équations sont satisfaites. Pour un parallèle $t = t_{0}$, $\theta = \omega s + \theta_{0}$ avec $\omega \neq 0$, la première l'est, et la seconde se réduit à $-g(t_{0})g'(t_{0})\omega^{2} = 0$ : *le parallèle est une géodésique si et seulement si $g'(t_{0}) = 0$*, c'est-à-dire si le rayon du parallèle est extrémal parmi ses voisins (un « équateur » ou un « col »).

    **3.** $(g^{2}\theta')' = g(g\theta'' + 2g't'\theta') = 0$ par la première équation. Le vecteur unitaire du parallèle est $e = \dfrac{\phi_{\theta}}{g}$, et $c' = \theta'\phi_{\theta} + t'\phi_{t}$ avec $\phi_{t} \perp \phi_{\theta}$, donc $\cos\varphi = \langle c', e \rangle = g\theta'$ et 
    $$\boxed{g\cos\varphi = g^{2}\theta' = c_{0}} \qquad \text{(relation de Clairaut).}$$

    **4.** $|c_{0}| = g|\cos\varphi| \leq g$ en tout point de la géodésique. Si $g(t(s)) = |c_{0}|$, alors $|\cos\varphi(s)| = 1$ : la géodésique est tangente au parallèle. Si $c_{0} \neq 0$, une géodésique ne peut donc pas s'approcher de l'axe à une distance inférieure à $|c_{0}|$ ; elle « rebondit » sur le parallèle de rayon $|c_{0}|$, à moins que ce parallèle soit lui-même une géodésique, auquel cas l'unicité du théorème 1 interdit de l'atteindre en lui étant tangent sans se confondre avec lui.
- id: "l3-gd-04-07"
  feuille: "f-l3-gd-04"
  numero: 7
