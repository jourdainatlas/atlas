  enonce: |
    **Le critère de Bernoulli.** Soit $c$ un arc birégulier tracé sur une surface $\Sigma$. Montrer que $c$ est porté par une géodésique de $\Sigma$, c'est-à-dire qu'une fois paramétré par longueur d'arc il en devient une, si et seulement si son plan osculateur contient en tout point la normale à $\Sigma$. Interpréter avec un fil tendu sur une surface lisse.
  corrige: |
    Paramétrons $c$ par longueur d'arc : $c'' = k\vec{\nu}$ avec $k > 0$, puisque l'arc est birégulier. La courbe est une géodésique si et seulement si $c''$, donc $\vec{\nu}$, est colinéaire à la normale $N$ à $\Sigma$. Le plan osculateur est $\mathrm{Vect}(\vec{\tau}, \vec{\nu})$, et $\vec{\tau} \perp N$ puisque $\vec{\tau}$ est tangent à $\Sigma$ ; ce plan contient $N$ si et seulement si $N = a\vec{\tau} + b\vec{\nu}$ avec $a = \langle N, \vec{\tau} \rangle = 0$, c'est-à-dire si et seulement si $N$ est colinéaire à $\vec{\nu}$. *Les deux conditions sont équivalentes.* Un fil tendu sur une surface lisse, sans frottement, n'est soumis qu'à sa tension, dirigée le long du fil, et à la réaction de la surface, normale ; à l'équilibre, la résultante sur un petit morceau, proportionnelle à la courbure du fil et dirigée selon $\vec{\nu}$, doit être normale : *un fil tendu suit une géodésique*. C'est l'observation de Jean Bernoulli rappelée dans l'introduction du chapitre 4.
- id: "l3-gd-04-03"
  feuille: "f-l3-gd-04"
