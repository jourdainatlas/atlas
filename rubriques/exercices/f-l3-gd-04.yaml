  enonce: |
    **Le plan en coordonnées polaires.** On paramètre le plan privé d'une demi-droite par $f(r, \theta) = (r\cos\theta, r\sin\theta, 0)$, $r > 0$.

    **1.** Calculer la première forme fondamentale, puis les symboles de Christoffel à l'aide de la proposition 1.

    **2.** Écrire les équations des géodésiques, et montrer que $r^{2}\theta'$ est constant le long d'une géodésique.

    **3.** Résoudre ces équations et vérifier que l'on retrouve les droites parcourues à vitesse constante. On pourra poser $w = \dfrac{1}{r}$ et dériver par rapport à $\theta$.
  corrige: |
    **1.** $f_{r} = (\cos\theta, \sin\theta, 0)$, $f_{\theta} = r(-\sin\theta, \cos\theta, 0)$ : $\boxed{(g_{ij}) = \operatorname{diag}(1, r^{2})}$. La proposition 1, avec $g_{11} = 1$, $g_{22} = r^{2}$, donne comme seuls symboles non nuls 
    $$\Gamma_{\theta\theta}^{r} = -\frac{1}{2}\partial_{r}(r^{2}) = -r, \qquad \Gamma_{r\theta}^{\theta} = \Gamma_{\theta r}^{\theta} = \frac{1}{2r^{2}}\partial_{r}(r^{2}) = \frac{1}{r} .$$

    **2.** Les équations sont $r'' - r\theta'^{2} = 0$ et $\theta'' + \dfrac{2}{r}r'\theta' = 0$. La seconde s'écrit $\dfrac{1}{r^{2}}(r^{2}\theta')' = 0$ : *$r^{2}\theta' = C$ est constant* (c'est la loi des aires de Kepler pour un mouvement sans force).

    **3.** Si $C = 0$, $\theta$ est constant et $r'' = 0$ : une demi-droite issue de l'origine, parcourue à vitesse constante. Sinon, $\theta$ est strictement monotone et l'on peut écrire $r$ en fonction de $\theta$. Avec $w = \dfrac{1}{r}$ et $\theta' = Cw^{2}$ :
    $$r' = -\frac{1}{w^{2}}\frac{\mathrm{d} w}{\mathrm{d}\theta}\theta' = -C\frac{\mathrm{d} w}{\mathrm{d}\theta} ,$$
     puis
    $$r'' = -C^{2}w^{2}\frac{\mathrm{d}^{2}w}{\mathrm{d}\theta^{2}} .$$
     La première équation devient 
    $$-C^{2}w^{2}\left(\frac{\mathrm{d}^{2}w}{\mathrm{d}\theta^{2}} + w\right) = 0 , \qquad\text{d'où}\qquad w = A\cos(\theta - \theta_{0}) ,$$
     soit $r\cos(\theta - \theta_{0}) = \dfrac{1}{A}$ : *c'est une droite*, à distance $\dfrac{1}{A}$ de l'origine.

    La vitesse $r'^{2} + r^{2}\theta'^{2}$ est constante, comme pour toute géodésique. On retrouve les droites par un calcul plus long, mais qui n'utilise que la première forme : c'est le principe des exercices suivants.
