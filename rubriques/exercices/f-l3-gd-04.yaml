  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Courbure d'une métrique conforme.** Soit $f : U \to \Sigma$ une paramétrisation dont la première forme fondamentale est $\lambda(u, v)\,I_{2}$, avec $\lambda > 0$.

    **1.** Déduire de la formule de Brioschi (proposition 6 du cours) que 
    $$K = -\frac{1}{2\lambda}\,\Delta(\ln\lambda), \qquad \Delta = \frac{\partial^{2}}{\partial u^{2}} + \frac{\partial^{2}}{\partial v^{2}} .$$

    **2.** *La sphère.* Retrouver $K = 1$ à l'aide de la paramétrisation de Mercator, de première forme $\dfrac{1}{\operatorname{ch}^{2}v}I_{2}$ (feuille 3, exercice 1).

    **3.** *La caténoïde.* Retrouver sa courbure à partir de la première forme $\operatorname{ch}^{2}u\,I_{2}$ de la feuille 3, exercice 5.

    **4.** *La pseudosphère.* Montrer que la pseudosphère de la feuille 3, exercice 10, de première forme $\mathrm{e}^{-2t}\mathrm{d}\theta^{2} + \mathrm{d} t^{2}$, admet, après le changement de variable $y = \mathrm{e}^{t}$, la première forme $\dfrac{1}{y^{2}}I_{2}$ dans les coordonnées $(\theta, y)$, et retrouver $K = -1$. Le demi-plan $\{y > 0\}$ muni de la métrique $\dfrac{\mathrm{d}\theta^{2} + \mathrm{d} y^{2}}{y^{2}}$ est le *demi-plan de Poincaré*.
  corrige: |
    **1.** Avec $E = G = \lambda$ et $F = 0$, la formule de Brioschi fait intervenir les déterminants 
    $$\begin{vmatrix} -\frac{1}{2}\Delta\lambda & \frac{1}{2}\lambda_{u} & -\frac{1}{2}\lambda_{v} \\ -\frac{1}{2}\lambda_{u} & \lambda & 0 \\ \frac{1}{2}\lambda_{v} & 0 & \lambda \end{vmatrix} = -\frac{\lambda^{2}}{2}\Delta\lambda + \frac{\lambda}{4}\left(\lambda_{u}^{2} + \lambda_{v}^{2}\right), \qquad \begin{vmatrix} 0 & \frac{1}{2}\lambda_{v} & \frac{1}{2}\lambda_{u} \\ \frac{1}{2}\lambda_{v} & \lambda & 0 \\ \frac{1}{2}\lambda_{u} & 0 & \lambda \end{vmatrix} = -\frac{\lambda}{4}\left(\lambda_{u}^{2} + \lambda_{v}^{2}\right) .$$
     Leur différence, divisée par $(EG - F^{2})^{2} = \lambda^{4}$, vaut 
    $$K = \frac{-\lambda\Delta\lambda + \lambda_{u}^{2} + \lambda_{v}^{2}}{2\lambda^{3}} = -\frac{1}{2\lambda}\left(\frac{\Delta\lambda}{\lambda} - \frac{\lambda_{u}^{2} + \lambda_{v}^{2}}{\lambda^{2}}\right) = \boxed{-\frac{1}{2\lambda}\Delta(\ln\lambda)} ,$$
     puisque
    $$\partial_{u}^{2}(\ln\lambda) = \frac{\lambda_{uu}}{\lambda} - \frac{\lambda_{u}^{2}}{\lambda^{2}} ,$$
     et de même en $v$. (Calcul vérifié par calcul formel.)

    **2.** $\ln\lambda = -2\ln\operatorname{ch}v$ et
    $$(\ln\operatorname{ch})'' = \frac{1}{\operatorname{ch}^{2}} ,$$
     donc
    $$\Delta\ln\lambda = -\frac{2}{\operatorname{ch}^{2}v}$$
     et
    $$K = -\frac{\operatorname{ch}^{2}v}{2}\cdot\left(-\frac{2}{\operatorname{ch}^{2}v}\right) = \boxed{1}.$$

    **3.** $\ln\lambda = 2\ln\operatorname{ch}u$,
    $$\Delta\ln\lambda = \frac{2}{\operatorname{ch}^{2}u}$$
     et $\boxed{K = -\dfrac{1}{\operatorname{ch}^{4}u}}$. Avec $U = \operatorname{sh}u$, on retrouve $-\dfrac{1}{(1 + U^{2})^{2}}$, la courbure de l'hélicoïde au point correspondant (feuille 3, exercice 10) : c'est bien ce qu'impose le Theorema egregium, puisque la caténoïde et l'hélicoïde sont localement isométriques (feuille 3, exercice 5).

    **4.** Avec $y = \mathrm{e}^{t}$, $\mathrm{d} t = \dfrac{\mathrm{d} y}{y}$ et $\mathrm{e}^{-2t} = \dfrac{1}{y^{2}}$ : la première forme devient $\dfrac{\mathrm{d}\theta^{2} + \mathrm{d} y^{2}}{y^{2}}$, soit $\lambda = \dfrac{1}{y^{2}}$ (pour $y > 1$). Alors $\Delta\ln\lambda = \dfrac{2}{y^{2}}$ et
    $$\boxed{K = -\frac{y^{2}}{2}\cdot\frac{2}{y^{2}} = -1} .$$
     La pseudosphère est donc localement isométrique à la bande $\{y > 1\}$ du demi-plan de Poincaré, la variable $\theta$ étant prise modulo $2\pi$ : c'est un modèle concret, dans $\mathbb{R}^{3}$, d'un morceau de géométrie hyperbolique.
- id: "l3-gd-04-11"
  feuille: "f-l3-gd-04"
  numero: 11
  partie: "Isométries et Theorema egregium"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [Theorema egregium]
  noeuds: [sf-egregium]
  notions: [courbure-gauss, surfaces-isometriques]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Même courbure, pas d'isométrie.** On reprend les surfaces $S_{1}$ et $S_{2}$ paramétrées par $f(u, v) = (u\cos v, u\sin v, \ln u)$, $u > 0$, et $g(u, v) = (u\cos v, u\sin v, v)$, $u > 0$, qui ont la même courbure $K = -\dfrac{1}{(1 + u^{2})^{2}}$ aux points de paramètres $(u, v)$ (feuille 3, exercice 10).

    **1.** Soit $\phi : S_{1} \to S_{2}$ une isométrie locale. Montrer que $u \circ \phi = u$, où $u$ désigne la première coordonnée de paramétrisation sur chaque surface.

    **2.** Pour une fonction $F$ sur une surface, on note $\nabla F$ son gradient intrinsèque, défini par $\langle \nabla F, X \rangle = dF(X)$ pour $X$ tangent. Montrer que, dans une paramétrisation orthogonale, $\lVert \nabla F \rVert^{2} = \dfrac{F_{u}^{2}}{E} + \dfrac{F_{v}^{2}}{G}$, et que $\lVert \nabla(K \circ \phi) \rVert = \lVert \nabla K \rVert \circ \phi$ pour une isométrie locale $\phi$.

    **3.** Calculer $\lVert \nabla K \rVert$ sur $S_{1}$ et sur $S_{2}$ en fonction de $u$, et conclure qu'il n'existe aucune isométrie locale de $S_{1}$ dans $S_{2}$, même définie sur un petit ouvert. La réciproque du Theorema egregium est donc fausse.
  corrige: |
    **1.** Par le Theorema egregium, $K_{2} \circ \phi = K_{1}$. Comme $u \mapsto -\dfrac{1}{(1 + u^{2})^{2}}$ est strictement croissante sur $]0, +\infty[$, donc injective, l'égalité des courbures au point de paramètre $u$ et en son image impose $\boxed{u \circ \phi = u}$.

    **2.** Écrivons $\nabla F = \alpha f_{u} + \beta f_{v}$ ; avec $F = 0$ dans la première forme, $\langle \nabla F, f_{u} \rangle = \alpha E = F_{u}$ et $\beta G = F_{v}$, d'où
    $$\lVert \nabla F \rVert^{2} = \alpha^{2}E + \beta^{2}G = \frac{F_{u}^{2}}{E} + \frac{F_{v}^{2}}{G} .$$
     Si $\phi$ est une isométrie locale et $F_{2}$ une fonction sur $S_{2}$, pour tout $X$ tangent en $p$ :
    $$\langle d_{p}\phi(\nabla(F_{2} \circ \phi)(p)), d_{p}\phi(X) \rangle = d(F_{2} \circ \phi)(X) = dF_{2}(d_{p}\phi(X)) = \langle \nabla F_{2}(\phi(p)), d_{p}\phi(X) \rangle .$$
     Comme $d_{p}\phi$ est une isométrie bijective (prop. 5), $d_{p}\phi(\nabla(F_{2} \circ \phi)(p)) = \nabla F_{2}(\phi(p))$, et les normes sont égales.

    **3.** $K_{u} = \dfrac{4u}{(1 + u^{2})^{3}}$. Sur $S_{1}$, $E = 1 + \dfrac{1}{u^{2}}$ et
    $$\lVert \nabla K \rVert^{2} = \frac{16u^{4}}{(1 + u^{2})^{7}} ;$$
     sur $S_{2}$, $E = 1$ et
    $$\lVert \nabla K \rVert^{2} = \frac{16u^{2}}{(1 + u^{2})^{6}} .$$
     Avec $F_{2} = K_{2}$, $K_{2} \circ \phi = K_{1}$ et $u \circ \phi = u$, la question 2 exigerait $\dfrac{u^{2}}{1 + u^{2}} = 1$ en tout point, ce qui est impossible. *Il n'existe aucune isométrie locale de $S_{1}$ dans $S_{2}$*, même entre petits ouverts : la courbure de Gauss est un invariant, mais elle ne caractérise pas la métrique. Le même raisonnement, avec la fonction $\lVert \nabla K \rVert$, fournit d'autres invariants, et c'est ainsi qu'on peut décider en général si deux surfaces sont localement isométriques.
- id: "l3-gd-04-12"
  feuille: "f-l3-gd-04"
  numero: 12
  partie: "Isométries et Theorema egregium"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [Theorema egregium]
  noeuds: [sf-egregium]
  notions: [courbure-gauss, surfaces-isometriques]
  source: "examen du 25/04/2016, exercice 3, question 6 (condition nécessaire)"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **Mettre une surface à plat.**

    **1.** Montrer qu'aucun ouvert de la sphère n'est localement isométrique à un ouvert du plan : aucune carte géographique, même d'une petite région, ne respecte exactement les distances.

    **2.** Montrer qu'une surface de révolution $\{x^{2} + y^{2} = \rho(z)^{2}\}$, où $\rho > 0$, ne peut être localement isométrique au plan que si $\rho'' = 0$ (on utilisera la feuille 3, exercice 11). Le cylindre et le cône sont-ils localement isométriques entre eux ?

    **3.** Deux sphères de rayons différents sont-elles localement isométriques ? Le tore de révolution est-il localement isométrique à une sphère ?

    **4.** À l'aide du théorème de Bertrand-Diguet-Puiseux, expliquer pourquoi on ne peut pas aplatir une écorce d'orange sans la déchirer, et pourquoi une calotte de pseudosphère, au contraire, « gondole » quand on essaie de la poser sur une table.
  corrige: |
    **1.** Une isométrie locale conserverait $K$ (théorème 5) ; or $K = 1$ sur la sphère et $K = 0$ dans le plan. Toute carte plane d'une région de la Terre déforme donc les distances : la projection de Mercator conserve les angles (feuille 3, exercice 1), d'autres projections conservent les aires, aucune ne conserve les deux.

    **2.** Par la feuille 3, exercice 11, $K = -\dfrac{\rho''}{\rho(1 + \rho'^{2})^{2}}$, qui doit être nulle : *$\rho'' = 0$*. Le cylindre et le cône sont chacun localement isométriques au plan, donc entre eux, en composant une isométrie locale avec l'inverse d'une autre (définie sur un petit ouvert).

    **3.** Les sphères de rayons $R_{1} \neq R_{2}$ ont des courbures constantes différentes, $\dfrac{1}{R_{1}^{2}}$ et $\dfrac{1}{R_{2}^{2}}$ : *non*. Le tore a une courbure $\dfrac{\sin v}{r(R + r\sin v)}$ (feuille 3, exercice 8) qui n'est constante sur aucun ouvert : *aucun ouvert du tore n'est localement isométrique à une sphère.*

    **4.** Par le théorème 6, sur une surface où $K > 0$, les petits cercles géodésiques sont plus courts que $2\pi r$. Pour aplatir un morceau d'écorce d'orange en conservant les distances radiales depuis un point, il faudrait étirer chaque cercle jusqu'à la longueur $2\pi r$ : l'écorce se déchire au bord. Sur la pseudosphère, $K = -1$ et les cercles sont plus longs que $2\pi r$ : posée à plat, la matière en trop sur chaque cercle forme des plis, comme une collerette.
