  enonce: |
    **Les géodésiques du cône.** Soit $C_{\alpha}$ le cône de révolution de sommet $O$, privé de $O$, dont les génératrices font l'angle $\alpha \in \, ]0, \dfrac{\pi}{2}[$ avec l'axe. On note $r$ la distance au sommet et $\theta$ l'angle polaire autour de l'axe.

    **1.** Montrer que la première forme fondamentale de $C_{\alpha}$ dans les coordonnées $(r, \theta)$ est la matrice $\operatorname{diag}(1, r^{2}\sin^{2}\alpha)$. En posant $\beta = \theta\sin\alpha$, en déduire que $C_{\alpha}$, découpé le long d'une génératrice, est isométrique à un secteur plan d'angle $2\pi\sin\alpha$ (comme à la feuille 3, exercice 11).

    **2.** En déduire que les géodésiques de $C_{\alpha}$ sont les images des droites du secteur, recollé le long de ses bords. Les génératrices sont-elles des géodésiques ? Et les cercles horizontaux ?

    **3.** On note $\omega = 2\pi\sin\alpha$. Montrer qu'une géodésique qui n'est pas une génératrice se recoupe elle-même exactement $N$ fois, où $N$ est le nombre d'entiers $k \geq 1$ tels que $k\omega < \pi$. Combien de fois se recoupe une géodésique du cône de demi-angle $\alpha = \dfrac{\pi}{6}$ ? de $\alpha = \dfrac{\pi}{18}$ ? Dessiner.
  corrige: |
    **1.** Le point de $C_{\alpha}$ à distance $r$ du sommet et d'angle polaire $\theta$ est
    $$F(r, \theta) = r(\sin\alpha\cos\theta, \sin\alpha\sin\theta, \cos\alpha) .$$
     Alors $F_{r}$ est unitaire, $F_{\theta} = r\sin\alpha(-\sin\theta, \cos\theta, 0)$ lui est orthogonal, et $\boxed{(g_{ij}) = \operatorname{diag}(1, r^{2}\sin^{2}\alpha)}$. Avec $\beta = \theta\sin\alpha$, on obtient $\operatorname{diag}(1, r^{2})$ : la première forme du plan en coordonnées polaires (exercice 3).

    L'application $(r, \beta) \mapsto (r\cos\beta, r\sin\beta)$ est donc une isométrie du cône découpé le long de la génératrice $\theta = 0$ ($\theta \in \, ]0, 2\pi[$) sur le secteur ouvert $0 < \beta < 2\pi\sin\alpha$.

    **2.** Par isométrie, les géodésiques du cône découpé sont les images des segments de droite du secteur. Quand une géodésique atteint la génératrice coupée, elle se prolonge (théorème 1) dans la copie du secteur tournée de $\omega = 2\pi\sin\alpha$ : *les géodésiques sont les images des droites du plan par l'enroulement $(r, \beta) \mapsto F(r, \dfrac{\beta}{\sin\alpha})$*. Les génératrices, images des rayons issus du sommet, *sont des géodésiques* ; les cercles horizontaux, images d'arcs de cercles centrés au sommet, *n'en sont pas*.

    **3.** Soit une géodésique image d'une droite $D$ à distance $d > 0$ du sommet $O$, de pied $H$. Deux points de $D$ ont la même image sur le cône si et seulement s'ils sont à la même distance de $O$, donc symétriques par rapport à $H$, aux angles $\pm\psi$ ($0 < \psi < \dfrac{\pi}{2}$) de part et d'autre de $(OH)$, et si leur écart angulaire $2\psi$ est un multiple $k\omega$ de $\omega$, $k \geq 1$. Pour chaque $k$ tel que $k\omega < \pi$, il y a exactement une telle paire ($\psi = \dfrac{k\omega}{2}$), et aucune sinon : *la géodésique se recoupe exactement $N = \operatorname{card}\{k \geq 1 \mid k\omega < \pi\}$ fois*.

    Pour $\alpha = \dfrac{\pi}{6}$, $\omega = \pi$ et $N = 0$ : les deux extrémités de la géodésique partent à l'infini dans la même direction, sans se croiser. Pour $\alpha = \dfrac{\pi}{18}$, $\omega = 2\pi\sin 10^{\circ} \approx 1{,}091$, et $N = 2$ ($k = 1, 2$).

    ![Figure](documents/figures/2db879f079cee146.svg)

    Le cône de demi-angle $10^{\circ}$ déroulé ($\omega \approx 62{,}5^{\circ}$) et une droite $D$ (en bleu). Les paires de points de $D$ vus de $O$ sous l'écart $\omega$ (en violet) et $2\omega$ (en orange) se superposent quand on enroule le plan sur le cône : la géodésique se recoupe deux fois.
- id: "l3-gd-04-06"
  feuille: "f-l3-gd-04"
