  enonce: |
    **Courbure et cercles géodésiques en coordonnées polaires géodésiques.**

    **1.** On rappelle (proposition 7 du cours) qu'en coordonnées polaires géodésiques, où la première forme s'écrit $\operatorname{diag}(1, J^{2})$, on a $K = -\dfrac{J_{rr}}{J}$. Déterminer $J$ lorsque $K$ est une constante $\kappa$, à l'aide de $J(0, \theta) = 0$ et $J_{r}(0, \theta) = 1$ (proposition 3).

    **2.** En déduire la longueur exacte du cercle géodésique de rayon $r$ sur une surface de courbure constante $\kappa > 0$, $\kappa = 0$, $\kappa < 0$, et comparer avec le développement du théorème 6.

    **3.** Sur une surface de courbure constante $\kappa > 0$, montrer que deux géodésiques issues d'un même point se recoupent à la distance $\dfrac{\pi}{\sqrt{\kappa}}$ (si elles sont définies jusque-là), en interprétant l'annulation de $J$.
  corrige: |
    **1.** L'équation $J_{rr} + \kappa J = 0$, avec $J(0) = 0$ et $J_{r}(0) = 1$, a pour solution 
    $$J(r) = \frac{\sin(\sqrt{\kappa}\,r)}{\sqrt{\kappa}} \ (\kappa > 0), \qquad J(r) = r \ (\kappa = 0), \qquad J(r) = \frac{\operatorname{sh}(\sqrt{-\kappa}\,r)}{\sqrt{-\kappa}} \ (\kappa < 0) .$$

    **2.** La longueur de $C(r)$ est
    $$\int_{0}^{2\pi}J(r, \theta)\,\mathrm{d}\theta = 2\pi J(r) ,$$
     soit $\dfrac{2\pi\sin(\sqrt{\kappa}r)}{\sqrt{\kappa}}$, $2\pi r$, $\dfrac{2\pi\operatorname{sh}(\sqrt{-\kappa}r)}{\sqrt{-\kappa}}$. Le développement $\sin x = x - \dfrac{x^{3}}{6} + o(x^{3})$ (ou celui de $\operatorname{sh}$) donne $2\pi r\left(1 - \dfrac{\kappa r^{2}}{6} + o(r^{2})\right)$ dans tous les cas, conformément au théorème 6.

    ![Figure](documents/figures/4263bf6b993cb56f.svg)

    Longueur du cercle géodésique de rayon $r$ pour les courbures $1$ (en bleu, $2\pi\sin r$), $0$ (en gris, $2\pi r$) et $-1$ (en rouge, $2\pi\operatorname{sh}r$). Les trois courbes partent tangentes, puis se séparent à l'ordre $3$ ; pour $\kappa = 1$, le cercle se referme en un point pour $r = \pi$.

    **3.** Pour $\kappa > 0$, $J(r, \theta)$ s'annule en $r = \dfrac{\pi}{\sqrt{\kappa}}$ pour tout $\theta$ : le cercle géodésique de ce rayon a une longueur nulle, il est réduit à un point, et toutes les géodésiques issues de $p$ se rejoignent en ce point, comme les méridiens de la sphère au pôle opposé (exercice 8). Le raisonnement est heuristique, car la proposition 7 n'est établie que pour $r < \varepsilon$ ; une démonstration complète passe par les *champs de Jacobi*, qui prolongent la fonction $J$ le long de chaque géodésique.

