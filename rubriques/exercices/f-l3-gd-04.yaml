  page_corrige: 4
  enonce: |
    **Applications : sphère, tore, caténoïde.**

    **1.** *La sphère.* Avec $g(t) = \cos t$, $h(t) = \sin t$, $t \in \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$, vérifier qu'un grand cercle d'inclinaison $i$ sur l'équateur satisfait la relation de Clairaut avec la constante $\cos i$, et qu'il atteint la latitude maximale $i$.

    **2.** *Le tore.* On considère le tore d'équation $\left(\sqrt{x^{2} + y^{2}} - R\right)^{2} + z^{2} = r^{2}$, avec $0 < r < R$. Montrer que les méridiens, parcourus à vitesse constante, sont des géodésiques. Parmi les quatre parallèles passant par les points $(R + r, 0, 0)$, $(R - r, 0, 0)$, $(R, 0, r)$ et $(R, 0, -r)$, lesquels sont des géodésiques ? Écrire les équations des géodésiques du tore dans la paramétrisation $\big((R + r\cos v)\cos u, (R + r\cos v)\sin u, r\sin v\big)$.

    **3.** *La caténoïde.* Elle est engendrée par la chaînette $x = \operatorname{ch}z$. Paramétrer son profil par longueur d'arc et montrer que $g(s) = \sqrt{1 + s^{2}}$. Décrire, selon la constante de Clairaut $c_{0} \geq 0$, le comportement d'une géodésique issue d'un point de la moitié inférieure $s < 0$ et montant vers le cercle de gorge : selon que $c_{0} < 1$, $c_{0} = 1$ ou $c_{0} > 1$, elle franchit le cercle de gorge, s'en approche indéfiniment en tournant, ou rebrousse chemin.
  corrige: |
    **1.** Le grand cercle d'inclinaison $i$ coupe l'équateur ($g = 1$) sous l'angle $i$ : $c_{0} = \cos i$. La relation de Clairaut $\cos t\cos\varphi = \cos i$ montre que la latitude $t$ est maximale quand $\cos\varphi = 1$, c'est-à-dire là où le grand cercle est tangent au parallèle : *$\cos t = \cos i$, d'où $t = i$*, ce que confirme la géométrie.

    **2.** En notant $v$ l'angle sur le méridien, le profil $(R + r\cos v, r\sin v)$ est paramétré par longueur d'arc par $t = rv$, avec $g = R + r\cos\dfrac{t}{r}$ et $g' = -\sin v$. Par l'exercice 6, *les méridiens sont des géodésiques*, et un parallèle en est une si et seulement si $\sin v = 0$ : *les parallèles de $(R + r, 0, 0)$ ($v = 0$, l'équateur extérieur) et de $(R - r, 0, 0)$ ($v = \pi$, l'équateur intérieur) sont des géodésiques ; ceux de $(R, 0, \pm r)$ ($v = \pm\dfrac{\pi}{2}$) n'en sont pas.* Dans la paramétrisation de l'énoncé, $(g_{ij}) = \operatorname{diag}((R + r\cos v)^{2}, r^{2})$,
    $$\Gamma_{uv}^{u} = -\frac{r\sin v}{R + r\cos v} ,$$

    $$\Gamma_{uu}^{v} = \frac{(R + r\cos v)\sin v}{r} ,$$
     et les géodésiques vérifient 
    $$u'' - \frac{2r\sin v}{R + r\cos v}u'v' = 0, \qquad v'' + \frac{(R + r\cos v)\sin v}{r}u'^{2} = 0 .$$

    ![Figure](documents/figures/719bb60163749d05.svg)

    Le tore $R = 2$, $r = 0{,}8$ : les équateurs extérieur et intérieur (en rouge) et un méridien (en violet) sont des géodésiques ; le parallèle supérieur (en tirets orange) n'en est pas une, car son accélération, dirigée vers l'axe, n'est pas normale au tore.

    **3.** Le profil $(\operatorname{ch}z, z)$ a pour abscisse curviligne
    $$s = \int_{0}^{z}\sqrt{\operatorname{sh}^{2} + 1} = \operatorname{sh}z ,$$
     d'où $\boxed{g(s) = \operatorname{ch}z = \sqrt{1 + s^{2}}}$ et $h(s) = \operatorname{argsh}s$. Par vitesse unité et Clairaut,
    $$s'^{2} = 1 - g^{2}\theta'^{2} = 1 - \frac{c_{0}^{2}}{1 + s^{2}} .$$
     Partons de $s_{0} < 0$ avec $s' > 0$.

    • Si $c_{0} < 1$, $s'^{2} \geq 1 - c_{0}^{2} > 0$ : $s$ croît à vitesse minorée, *la géodésique franchit le cercle de gorge* et part vers $s = +\infty$.

    • Si $c_{0} > 1$, $s'$ s'annule quand $1 + s^{2} = c_{0}^{2}$, en $s = -\sqrt{c_{0}^{2} - 1}$, où la géodésique est tangente au parallèle : *elle rebrousse chemin* et redescend (exercice 6, question 4).

    • Si $c_{0} = 1$, $s' = \dfrac{|s|}{\sqrt{1 + s^{2}}}$ ne s'annule qu'en $s = 0$, et $s'' = s\theta'^{2}$ montre que $s$ tend vers $0$ sans l'atteindre (on a $s' \leq |s|$, d'où une décroissance au plus exponentielle de $|s|$), pendant que $\theta' = \dfrac{1}{1 + s^{2}} \to 1$ : *la géodésique s'enroule indéfiniment autour du cercle de gorge*, qui est lui-même une géodésique de constante $1$, sans jamais l'atteindre, conformément à l'unicité.

    ![Figure](documents/figures/9405df6d19f11726.svg)

    Trois géodésiques de la caténoïde, issues du même point de la moitié inférieure, avec les constantes de Clairaut $c_{0} = 0{,}6$ (en rouge, elle franchit le cercle de gorge gris), $c_{0} = 1$ (en orange, elle s'enroule autour de lui) et $c_{0} = 1{,}4$ (en violet, elle rebrousse chemin au parallèle de rayon $1{,}4$). Calcul numérique par la méthode de Runge-Kutta.
- id: "l3-gd-04-08"
  feuille: "f-l3-gd-04"
  numero: 8
  partie: "Exponentielle, plus courts chemins"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [plus courts chemins]
  noeuds: [sf-exponentielle, sf-minimisation]
  notions: [geodesique]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **L'exponentielle de la sphère.** Soit $p \in \mathbb{S}^{2}$.

    **1.** Montrer que, pour $X \in T_{p}\mathbb{S}^{2}$ non nul, $\exp_{p}(X) = \cos\lVert X \rVert\,p + \sin\lVert X \rVert\,\dfrac{X}{\lVert X \rVert}$.

    **2.** Montrer que $\exp_{p}$ est définie sur tout $T_{p}\mathbb{S}^{2}$, injective sur la boule ouverte $B(0, \pi)$, et qu'elle envoie tout le cercle $\{\lVert X \rVert = \pi\}$ sur le seul point $-p$.

    **3.** Calculer la longueur du cercle géodésique $C(r) = \exp_{p}(\{\lVert X \rVert = r\})$, et vérifier sur cet exemple le théorème de Bertrand-Diguet-Puiseux.

    **4.** Une géodésique issue de $p$ est-elle minimisante au-delà de $-p$ ? Comparer avec le théorème 4 du cours.
  corrige: |
    **1.** Par l'exercice 1, la géodésique de conditions initiales $(p, X)$ est
    $$c_{X}(t) = \cos(\lVert X \rVert t)p + \sin(\lVert X \rVert t)\frac{X}{\lVert X \rVert} ,$$
     définie sur $\mathbb{R}$, et $\exp_{p}(X) = c_{X}(1)$.

    **2.** Elle est donc définie sur tout $T_{p}\mathbb{S}^{2}$. Soit $q \in \mathbb{S}^{2}$, $q \neq -p$ ; posons $\rho = \arccos\langle p, q \rangle \in [0, \pi[$. Si $q = p$, seul $X = 0$ convient dans $B(0, \pi)$. Sinon, $\exp_{p}(X) = q$ avec $\lVert X \rVert < \pi$ impose $\cos\lVert X \rVert = \langle p, q \rangle$, donc $\lVert X \rVert = \rho$, puis
    $$\frac{X}{\lVert X \rVert} = \frac{q - \cos\rho\,p}{\sin\rho} :$$
     *$\exp_{p}$ est injective sur $B(0, \pi)$*, et son image est $\mathbb{S}^{2} \setminus \{-p\}$. Pour $\lVert X \rVert = \pi$, $\exp_{p}(X) = -p$ : *tout le cercle de rayon $\pi$ est envoyé sur l'antipode.*

    **3.** $C(r)$ est le cercle $\{\cos r\,p + \sin r\,w \mid w \in p^{\perp}, \lVert w \rVert = 1\}$, de rayon $\sin r$ : sa longueur vaut 
    $$\boxed{2\pi\sin r} = 2\pi r\left(1 - \frac{r^{2}}{6} + o(r^{2})\right) ,$$
     et le théorème 6 donne bien $K = 1$.

    **4.** Au-delà de $-p$, la géodésique a parcouru une longueur $L > \pi$ sur un grand cercle, et l'autre arc du même grand cercle, de longueur $2\pi - L < L$, joint les mêmes points : *elle n'est plus minimisante*. Le théorème 4 ne dit pas le contraire : il n'affirme que la minimalité locale, sur de petits morceaux.
- id: "l3-gd-04-09"
  feuille: "f-l3-gd-04"
  numero: 9
  partie: "Exponentielle, plus courts chemins"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [plus courts chemins]
  noeuds: [sf-exponentielle, sf-minimisation]
  notions: [geodesique, courbe-parametree]
  source: "examen du 25/04/2016, exercice 4"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Première variation de la longueur.** Soit $\Sigma$ une surface de classe $\mathcal{C}^{\infty}$ paramétrée par $f : U \to \Sigma$, et $c : [0, \ell] \to \Sigma$ une courbe paramétrée par longueur d'arc. Une *variation* de $c$ est une famille $(c_{s})_{s \in \, ]{-\varepsilon}, \varepsilon[}$ de courbes $c_{s} : [0, \ell] \to \Sigma$ telle que $c_{0} = c$, $c_{s}(0) = c(0)$ et $c_{s}(\ell) = c(\ell)$ pour tout $s$, et que $(s, t) \mapsto c_{s}(t)$ soit de classe $\mathcal{C}^{\infty}$. On note $L(c_{s}) = \mathop{\displaystyle \int_{0}^{\ell}}\lVert c_{s}'(t) \rVert\,\mathrm{d} t$ et $c''_{T}$ la projection orthogonale de $c''$ sur l'espace tangent. On veut montrer : 
    $$(\ast) \qquad \frac{\mathrm{d}}{\mathrm{d} s}\Big|_{s = 0}L(c_{s}) = 0 \ \text{pour toute variation } (c_{s}) \text{ de } c \iff c \text{ est une géodésique.}$$

    **1.** Montrer que $\dfrac{\partial c_{s}}{\partial s}\big|_{s = 0}(t) \in T_{c(t)}\Sigma$, qu'il est nul en $t = 0$ et $t = \ell$, et que
    $$\langle \frac{\partial c_{s}}{\partial s}\Big|_{s = 0}, c'' \rangle = \langle \frac{\partial c_{s}}{\partial s}\Big|_{s = 0}, c''_{T} \rangle .$$

    **2.** Montrer que $\dfrac{\mathrm{d}}{\mathrm{d} s}\Big|_{s = 0}L(c_{s}) = -\mathop{\displaystyle \int_{0}^{\ell}}\langle \dfrac{\partial c_{s}}{\partial s}\Big|_{s = 0}(t), c''(t) \rangle\,\mathrm{d} t$. On dérivera sous l'intégrale, on utilisera le lemme de Schwarz et le fait que $\lVert c' \rVert = 1$.

    **3.** En déduire l'implication $\Leftarrow$ de $(\ast)$.

    **4.** Soit $\alpha : [0, \ell] \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ avec $\alpha(0) = \alpha(\ell) = 0$, et $X(t) = \alpha(t)c''_{T}(t)$. On écrit $c(t) = f(u(t), v(t))$.

    **(a)** Justifier qu'il existe des fonctions $a$, $b$ de classe $\mathcal{C}^{\infty}$, uniques, telles que $X(t) = a(t)f_{u} + b(t)f_{v}$, les dérivées partielles étant prises en $(u(t), v(t))$.

    **(b)** Pour $s$ voisin de $0$, on pose $c_{s}(t) = f\big(u(t) + sa(t), v(t) + sb(t)\big)$. Montrer que $(c_{s})$ est une variation de $c$ et que $\dfrac{\partial c_{s}}{\partial s}\big|_{s = 0} = X$.

    **5.** En choisissant $\alpha > 0$ sur $]0, \ell[$, déduire de la question 2 l'implication $\Rightarrow$ de $(\ast)$.

    **6.** En déduire que si $L(\gamma) \geq L(c)$ pour toute courbe $\gamma$ tracée sur $\Sigma$ joignant $c(0)$ à $c(\ell)$, alors $c$ est une géodésique. Comparer avec le théorème 4 du cours.
  corrige: |
    Notons
    $$Y(t) = \frac{\partial c_{s}}{\partial s}\big|_{s = 0}(t) ,$$
     le *champ de variation*. On suppose, comme l'énoncé le sous-entend, que $c([0, \ell]) \subset f(U)$.

    **1.** À $t$ fixé, $s \mapsto c_{s}(t)$ est une courbe tracée sur $\Sigma$, passant par $c(t)$ en $s = 0$ : sa vitesse $Y(t)$ est un vecteur tangent, $Y(t) \in T_{c(t)}\Sigma$. Comme $c_{s}(0)$ et $c_{s}(\ell)$ ne dépendent pas de $s$, $Y(0) = Y(\ell) = 0$. Enfin $c'' - c''_{T}$ est normal, donc orthogonal à $Y$.

    **2.** La fonction $(s, t) \mapsto \lVert c_{s}'(t) \rVert$ est de classe $\mathcal{C}^{\infty}$ au voisinage de $\{0\} \times [0, \ell]$, puisque $\lVert c' \rVert = 1$ ne s'annule pas ; on peut dériver sous l'intégrale sur le compact $[0, \ell]$ : 
    $$\frac{\mathrm{d}}{\mathrm{d} s}\Big|_{s = 0}L(c_{s}) = \int_{0}^{\ell}\frac{\langle \partial_{s}\partial_{t}c_{s}, c_{s}' \rangle}{\lVert c_{s}' \rVert}\Big|_{s = 0}\mathrm{d} t$$

    $$= \int_{0}^{\ell}\langle \partial_{t}Y, c' \rangle\,\mathrm{d} t ,$$
     par le lemme de Schwarz ($\partial_{s}\partial_{t} = \partial_{t}\partial_{s}$) et $\lVert c' \rVert = 1$.

    Une intégration par parties donne
    $$\big[\langle Y, c' \rangle\big]_{0}^{\ell} - \int_{0}^{\ell}\langle Y, c'' \rangle\,\mathrm{d} t ,$$
     et le crochet est nul par la question 1 :
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} s}\Big|_{s = 0}L(c_{s}) = -\int_{0}^{\ell}\langle Y, c'' \rangle\,\mathrm{d} t} .$$

    **3.** Si $c$ est une géodésique, $c''_{T} = 0$, donc $\langle Y, c'' \rangle = \langle Y, c''_{T} \rangle = 0$, et la dérivée est nulle pour toute variation.

    **4.** (a) $(f_{u}, f_{v})$ est une base de $T_{c(t)}\Sigma$, et $X(t)$ est tangent. Les coordonnées s'obtiennent par
    $$\begin{pmatrix} a \\ b \end{pmatrix} = (g_{ij})^{-1}\begin{pmatrix} \langle X, f_{u} \rangle \\ \langle X, f_{v} \rangle \end{pmatrix} ,$$
     de classe $\mathcal{C}^{\infty}$ comme $X$, $f_{u}$, $f_{v}$ et l'inverse d'une matrice inversible ; elles sont uniques. (b) Le compact $\{(u(t), v(t))\}$ est à une distance $\delta > 0$ du complémentaire de $U$, donc $(u + sa, v + sb) \in U$ pour
    $$|s| < \varepsilon = \frac{\delta}{1 + \max\lVert (a, b) \rVert} .$$
     La famille $(c_{s})$ est $\mathcal{C}^{\infty}$ en $(s, t)$, $c_{0} = c$, et $a$, $b$ s'annulent en $0$ et $\ell$ puisque $X$ s'y annule : les extrémités sont fixes. Enfin
    $$\frac{\partial c_{s}}{\partial s}\big|_{s = 0} = af_{u} + bf_{v} = X .$$

    **5.** Pour cette variation, la question 2 donne
    $$0 = -\int_{0}^{\ell}\alpha\langle c''_{T}, c'' \rangle\,\mathrm{d} t = -\int_{0}^{\ell}\alpha\lVert c''_{T} \rVert^{2}\,\mathrm{d} t .$$
     La fonction continue $\alpha\lVert c''_{T} \rVert^{2}$ est positive, d'intégrale nulle, donc nulle ; comme $\alpha > 0$ sur $]0, \ell[$, $c''_{T} = 0$ sur $]0, \ell[$, puis sur $[0, \ell]$ par continuité : *$c$ est une géodésique.*

    **6.** Si $c$ minimise la longueur, alors pour toute variation, $s \mapsto L(c_{s})$ admet un minimum en $s = 0$, où sa dérivée est nulle ; par $(\ast)$, $c$ est une géodésique. C'est une forme de l'implication (ii) $\Rightarrow$ (i) du théorème 4 (où la minimalité n'est que locale), obtenue par le *calcul des variations* d'Euler, sans passer par les coordonnées polaires géodésiques. La réciproque est fausse globalement (exercice 8).
- id: "l3-gd-04-10"
  feuille: "f-l3-gd-04"
  numero: 10
