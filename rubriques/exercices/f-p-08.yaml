  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=(x+2)\mathrm{e}^{-x}$.

    **1.** Démontrer que pour tout réel $x$, $f'(x)=-(x+1)\mathrm{e}^{-x}$.

    **2.** Dresser le tableau de variations de $f$.

    **3.** En déduire que $f$ admet un maximum sur $\mathbb{R}$, dont on donnera la valeur exacte.

    **4.** Déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $-1$. Que remarque-t-on ?

    **5.** Résoudre l'équation $f(x)=0$, puis déterminer le signe de $f(x)$.
  corrige: |
    **1.** Avec $u(x)=x+2$ et $v(x)=\mathrm{e}^{-x}$, dont la dérivée est $-\mathrm{e}^{-x}$ : 
    $$\begin{aligned} f'(x) &= 1\times\mathrm{e}^{-x}+(x+2)\times\left(-\mathrm{e}^{-x}\right) \\ &= \mathrm{e}^{-x}\big(1-x-2\big) = \boxed{-(x+1)\mathrm{e}^{-x}} \end{aligned}$$

    **2.** Comme $\mathrm{e}^{-x}>0$, le signe de $f'(x)$ est celui de $-(x+1)$, donc positif si $x<-1$.

    ![Figure](documents/figures/1306dfb867bb6d5a.svg)

    **3.** La fonction croît puis décroît : elle atteint son maximum en $-1$. 
    $$f(-1)=(-1+2)\mathrm{e}^{-(-1)}=1\times\mathrm{e} \qquad \text{d'où} \qquad \boxed{\text{le maximum de } f \text{ vaut } \mathrm{e}\approx 2{,}72}$$

    **4.** La tangente au point d'abscisse $-1$ a pour équation $y=f'(-1)(x+1)+f(-1)$. Or $f'(-1)=0$ : 
    $$\boxed{y=\mathrm{e}}$$

    $$\boxed{\text{La tangente est horizontale, ce qui est cohérent avec l'existence d'un maximum en } -1}$$

    **5.** Comme $\mathrm{e}^{-x}\neq 0$ : 
    $$f(x)=0 \iff x+2=0 \iff \boxed{x=-2}$$
     Le signe de $f(x)$ est celui de $x+2$ : 
    $$\boxed{f(x)<0 \text{ sur } \left]-\infty\,;-2\right[ \quad \text{et} \quad f(x)>0 \text{ sur } \left]-2\,;+\infty\right[}$$
- id: "p-08-23"
  feuille: "f-p-08"
  numero: 23
  titre: "QCM"
