  enonce: |
    L'objectif de cet exercice est de démontrer que la courbe de la fonction exponentielle se situe toujours au-dessus de sa tangente au point d'abscisse $0$.

    **Partie A : la démonstration.**

    Soit $g$ la fonction définie sur $\mathbb{R}$ par $g(x)=\mathrm{e}^{x}-x-1$.

    **1.** Calculer $g'(x)$.

    **2.** Étudier le signe de $g'(x)$ sur $\mathbb{R}$.

    **3.** Dresser le tableau de variations de $g$ et calculer $g(0)$.

    **4.** En déduire que pour tout réel $x$, $g(x)\geqslant 0$, puis que : 
    $$\mathrm{e}^{x}\geqslant x+1$$

    **5.** Interpréter graphiquement ce résultat, en reprenant la figure de l'exercice 14.

    **6.** Pour quelle valeur de $x$ y a-t-il égalité ?

    **Partie B : deux conséquences.**

    **7.** En déduire que pour tout réel $x$ strictement positif, $\mathrm{e}^{x}>x$.

    **8.** En appliquant l'inégalité de la question 4 au réel $-x$, démontrer que pour tout réel $x$ : 
    $$\mathrm{e}^{-x}\geqslant 1-x$$

    **9.** En déduire que pour tout réel $x$ strictement inférieur à $1$ : 
    $$\mathrm{e}^{x}\leqslant\dfrac{1}{1-x}$$

    *On justifiera soigneusement le passage à l'inverse, en précisant le signe des deux membres.*
  corrige: |
    **Partie A : la démonstration.**

    **1.** 
    $$\boxed{g'(x)=\mathrm{e}^{x}-1}$$

    **2.** Par stricte croissance de l'exponentielle : 
    $$g'(x)\geqslant 0 \iff \mathrm{e}^{x}\geqslant 1=\mathrm{e}^{0} \iff x\geqslant 0$$

    $$\boxed{g'(x)<0 \text{ sur } \left]-\infty\,;0\right[ \quad \text{et} \quad g'(x)>0 \text{ sur } \left]0\,;+\infty\right[}$$

    **3.**

    ![Figure](documents/figures/9124b21ce7387ee9.svg)

    $$g(0)=\mathrm{e}^{0}-0-1=1-1=\boxed{0}$$

    **4.** La fonction $g$ atteint son minimum en $0$, et ce minimum vaut $0$. Donc pour tout réel $x$, $g(x)\geqslant g(0)=0$ : 
    $$\mathrm{e}^{x}-x-1\geqslant 0 \qquad \text{d'où} \qquad \boxed{\mathrm{e}^{x}\geqslant x+1}$$

    **5.** L'inégalité signifie que l'ordonnée d'un point de $\mathcal{C}$ est toujours supérieure ou égale à celle du point de $T_{0}$ de même abscisse. 
    $$\boxed{\mathcal{C} \text{ est située au-dessus de sa tangente } T_{0} \text{ sur } \mathbb{R} \text{ tout entier}}$$
     C'est exactement ce que la figure de l'exercice 14 laissait deviner.

    **6.** L'égalité $g(x)=0$ n'a lieu qu'au minimum, atteint en $x=0$ : 
    $$\boxed{\text{L'égalité } \mathrm{e}^{x}=x+1 \text{ n'a lieu que pour } x=0}$$
     Géométriquement, c'est le point de contact entre $\mathcal{C}$ et $T_{0}$.

    **Partie B : deux conséquences.**

    **7.** Pour $x>0$, on a $x+1>x$, donc par transitivité : 
    $$\mathrm{e}^{x}\geqslant x+1>x \qquad \text{d'où} \qquad \boxed{\mathrm{e}^{x}>x}$$

    **8.** L'inégalité $\mathrm{e}^{X}\geqslant X+1$ est valable pour *tout* réel $X$. En l'appliquant à $X=-x$ : 
    $$\boxed{\mathrm{e}^{-x}\geqslant -x+1=1-x}$$

    **9.** Soit $x<1$. Alors $1-x>0$, et l'on sait par ailleurs que $\mathrm{e}^{-x}>0$. Les deux membres de l'inégalité $\mathrm{e}^{-x}\geqslant 1-x$ étant strictement positifs, on peut passer à l'inverse, ce qui **change le sens** de l'inégalité : 
    $$\frac{1}{\mathrm{e}^{-x}}\leqslant\frac{1}{1-x}$$
     Or $\dfrac{1}{\mathrm{e}^{-x}}=\mathrm{e}^{x}$ d'après la proposition 2 du cours : 
    $$\boxed{\mathrm{e}^{x}\leqslant\frac{1}{1-x} \qquad \text{pour tout } x<1}$$
     On dispose ainsi d'un encadrement de l'exponentielle sur $\left]-\infty\,;1\right[$ : 
    $$x+1\leqslant\mathrm{e}^{x}\leqslant\frac{1}{1-x}$$
