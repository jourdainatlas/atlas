  page_enonce: 7
  page_corrige: 13
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. $\mathrm{e}^{3}\times\mathrm{e}^{-5}$ est égal à : ¦ $\mathrm{e}^{-15}$ ¦ $\mathrm{e}^{-2}$ ¦ $\mathrm{e}^{8}$
    2. $\left(\mathrm{e}^{2x}\right)^{3}$ est égal à : ¦ $\mathrm{e}^{2x^{3}}$ ¦ $\mathrm{e}^{6x}$ ¦ $\mathrm{e}^{5x}$
    3. L'équation $\mathrm{e}^{x}=0$ admet : ¦ aucune solution ¦ une solution ¦ deux solutions
    4. L'équation $\mathrm{e}^{2x}=\mathrm{e}^{x+3}$ a pour solution : ¦ $x=3$ ¦ $x=1$ ¦ $x=-3$
    5. Pour tout réel $x$, le nombre $\mathrm{e}^{x}$ est : ¦ positif ou nul ¦ strictement positif ¦ de signe variable
    6. La dérivée de $x\mapsto\mathrm{e}^{-2x}$ est : ¦ $-2\mathrm{e}^{-2x}$ ¦ $\mathrm{e}^{-2x}$ ¦ $-\mathrm{e}^{-2x}$
    7. La dérivée de $x\mapsto x\mathrm{e}^{x}$ est : ¦ $\mathrm{e}^{x}$ ¦ $(x+1)\mathrm{e}^{x}$ ¦ $x\mathrm{e}^{x}$
    8. L'inéquation $\mathrm{e}^{x}<\mathrm{e}^{2}$ a pour solutions : ¦ $]-\infty\,;2[$ ¦ $]2\,;+\infty[$ ¦ $\mathbb{R}$
    9. La tangente à la courbe de $\exp$ au point d'abscisse $0$ a pour équation : ¦ $y=x$ ¦ $y=x+1$ ¦ $y=\mathrm{e} x$
    10. Une valeur approchée de $\mathrm{e}$ est : ¦ $2{,}718$ ¦ $3{,}142$ ¦ $1{,}618$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **B** ¦ $\mathrm{e}^{3}\times\mathrm{e}^{-5}=\mathrm{e}^{3-5}=\mathrm{e}^{-2}$. On additionne les exposants, on ne les multiplie pas.
    2 ¦ **B** ¦ $\left(\mathrm{e}^{2x}\right)^{3}=\mathrm{e}^{2x\times 3}=\mathrm{e}^{6x}$.
    3 ¦ **A** ¦ L'exponentielle est strictement positive sur $\mathbb{R}$ : elle ne s'annule jamais (proposition 4).
    4 ¦ **A** ¦ Par stricte croissance, $2x=x+3$, donc $x=3$.
    5 ¦ **B** ¦ C'est la proposition 4 : $\mathrm{e}^{x}=\left(\mathrm{e}^{\frac{x}{2}}\right)^{2}>0$, la valeur $0$ étant exclue puisque l'exponentielle ne s'annule pas.
    6 ¦ **A** ¦ Avec $u=-2x$ et $u'=-2$, la formule $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}$ donne $-2\mathrm{e}^{-2x}$.
    7 ¦ **B** ¦ Dérivée d'un produit : $1\times\mathrm{e}^{x}+x\times\mathrm{e}^{x}=(x+1)\mathrm{e}^{x}$.
    8 ¦ **A** ¦ Par stricte croissance, $\mathrm{e}^{x}<\mathrm{e}^{2}\iff x<2$.
    9 ¦ **B** ¦ $f(0)=f'(0)=1$, d'où $y=1\times x+1$. La réponse C est la tangente au point d'abscisse $1$.
    10 ¦ **A** ¦ $\mathrm{e}\approx 2{,}718$. La réponse B est $\pi$, la réponse C le nombre d'or.
    ```
- id: "p-08-24"
  feuille: "f-p-08"
  numero: 24
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [fonction exponentielle, dérivation, variations]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Pour tout réel $x$, $\mathrm{e}^{x}>0$.

    **2.** Il existe un réel $x$ tel que $\mathrm{e}^{x}=0$.

    **3.** Pour tous réels $a$ et $b$, $\mathrm{e}^{a+b}=\mathrm{e}^{a}+\mathrm{e}^{b}$.

    **4.** Pour tout réel $x$, $\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{2x}$.

    **5.** La fonction exponentielle est strictement croissante sur $\mathbb{R}$.

    **6.** $\mathrm{e}^{-2}<0$.

    **7.** Si $\mathrm{e}^{a}=\mathrm{e}^{b}$, alors $a=b$.

    **8.** La dérivée de la fonction $x\mapsto\mathrm{e}^{x^{2}}$ est la fonction $x\mapsto\mathrm{e}^{2x}$.

    **9.** La fonction exponentielle est égale à sa fonction dérivée.

    **10.** Pour tout réel $x$, $\mathrm{e}^{x}\geqslant x+1$.
  corrige: |
    **1.** **Vraie**. C'est la proposition 4 du cours : l'exponentielle est strictement positive sur $\mathbb{R}$.

    **2.** **Fausse**. C'est exactement la négation de l'affirmation précédente : l'exponentielle ne s'annule jamais. La proposition 2 le démontre en établissant que $\mathrm{e}^{x}\times\mathrm{e}^{-x}=1$, ce qui serait impossible si l'un des facteurs était nul.

    **3.** **Fausse**. La bonne formule est $\mathrm{e}^{a+b}=\mathrm{e}^{a}\times\mathrm{e}^{b}$ : l'exponentielle transforme les sommes en produits. Contre-exemple avec $a=b=0$ : 
    $$\mathrm{e}^{0+0}=\mathrm{e}^{0}=1 \qquad \text{alors que} \qquad \mathrm{e}^{0}+\mathrm{e}^{0}=1+1=2$$

    **4.** **Vraie**. C'est la règle $\left(\mathrm{e}^{a}\right)^{n}=\mathrm{e}^{na}$ appliquée avec $n=2$.

    **5.** **Vraie**. C'est la proposition 5. Elle découle du fait que $\exp'=\exp$ est strictement positive.

    **6.** **Fausse**. L'exponentielle est strictement positive quel que soit l'exposant : $\mathrm{e}^{-2}=\dfrac{1}{\mathrm{e}^{2}}\approx 0{,}135>0$.

    **7.** **Vraie**. C'est une conséquence de la stricte croissance, énoncée dans la proposition 5 : une fonction strictement croissante ne peut pas prendre deux fois la même valeur.

    **8.** **Fausse**. Avec $u=x^{2}$ et $u'=2x$, la formule donne $2x\,\mathrm{e}^{x^{2}}$ et non $\mathrm{e}^{2x}$. Contre-exemple en $x=1$ : la dérivée vaut $2\mathrm{e}$, alors que $\mathrm{e}^{2}\approx 7{,}39$ et $2\mathrm{e}\approx 5{,}44$.

    **9.** **Vraie**. C'est la propriété qui définit l'exponentielle dans la proposition 1 : $f'=f$ et $f(0)=1$.

    **10.** **Vraie**. C'est le résultat démontré à l'exercice 29 : il traduit le fait que la courbe de l'exponentielle se situe au-dessus de sa tangente au point d'abscisse $0$.
