  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=(x-1)\mathrm{e}^{x}$. On note $\mathcal{C}$ sa courbe représentative.

    **1.** Démontrer que pour tout réel $x$, $f'(x)=x\,\mathrm{e}^{x}$.

    **2.** Étudier le signe de $f'(x)$, puis dresser le tableau de variations de $f$.

    **3.** En déduire que $f$ admet un minimum sur $\mathbb{R}$, dont on précisera la valeur.

    **4.** Déterminer une équation de la tangente $T$ à $\mathcal{C}$ au point d'abscisse $0$. Que peut-on dire de cette tangente ?

    **5.** Résoudre l'équation $f(x)=0$, puis déterminer le signe de $f(x)$ selon les valeurs de $x$.

    **6.** Calculer $f(-1)$, $f(0)$, $f(1)$ et $f(2)$, en donnant une valeur approchée au centième.

    **7.** Tracer $\mathcal{C}$ et $T$ dans un repère, pour $-3\leqslant x\leqslant 2$.
  corrige: |
    **1.** Avec $u(x)=x-1$ et $v(x)=\mathrm{e}^{x}$ : 
    $$f'(x)=1\times\mathrm{e}^{x}+(x-1)\times\mathrm{e}^{x}=\mathrm{e}^{x}\big(1+x-1\big)=\boxed{x\,\mathrm{e}^{x}}$$

    **2.** Comme $\mathrm{e}^{x}>0$, le signe de $f'(x)$ est celui de $x$.

    ![Figure](documents/figures/a2fe0ac3c737214b.svg)

    **3.** La fonction décroît puis croît : elle atteint son minimum en $0$. 
    $$f(0)=(0-1)\mathrm{e}^{0}=-1 \qquad \text{d'où} \qquad \boxed{\text{le minimum de } f \text{ vaut } -1, \text{ atteint en } x=0}$$

    **4.** La tangente a pour équation $y=f'(0)(x-0)+f(0)$. Or $f'(0)=0\times\mathrm{e}^{0}=0$ : 
    $$\boxed{T : y=-1}$$

    $$\boxed{\text{Cette tangente est horizontale, ce qui est cohérent avec le minimum en } 0}$$

    **5.** Comme $\mathrm{e}^{x}\neq 0$ : 
    $$f(x)=0 \iff x-1=0 \qquad \text{d'où} \qquad \boxed{S=\{1\}}$$
     Le signe de $f(x)$ est celui de $x-1$ : 
    $$\boxed{f(x)<0 \text{ sur } \left]-\infty\,;1\right[ \quad \text{et} \quad f(x)>0 \text{ sur } \left]1\,;+\infty\right[}$$

    **6.**

    ```tableau
    $x$ ¦ $-3$ ¦ $-2$ ¦ $-1$ ¦ $0$ ¦ $1$ ¦ $2$
    $f(x)$ ¦ $-4\mathrm{e}^{-3}$ ¦ $-3\mathrm{e}^{-2}$ ¦ $-2\mathrm{e}^{-1}$ ¦ $-1$ ¦ $0$ ¦ $\mathrm{e}^{2}$
    **Valeur approchée** ¦ $-0{,}20$ ¦ $-0{,}41$ ¦ $-0{,}74$ ¦ $-1$ ¦ $0$ ¦ $7{,}39$
    ```

    **7.**

    ![Figure](documents/figures/06104d9a179ea9ae.svg)
- id: "p-08-26"
  feuille: "f-p-08"
  numero: 26
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Lecture graphique, Démonstration, Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations, dérivation, variations, tangente]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\left(x^{2}+1\right)\mathrm{e}^{-x}$.

    **1.** Démontrer que pour tout réel $x$, $f'(x)=-(x-1)^{2}\,\mathrm{e}^{-x}$.

    **2.** Justifier que $f'(x)\leqslant 0$ pour tout réel $x$, et préciser la seule valeur de $x$ pour laquelle $f'(x)=0$.

    **3.** En déduire le sens de variation de $f$ sur $\mathbb{R}$. La fonction $f$ admet-elle un extremum ?

    **4.** Déterminer le signe de $f(x)$ sur $\mathbb{R}$. L'équation $f(x)=0$ admet-elle des solutions ?

    **5.** Déterminer une équation de la tangente $T$ à la courbe de $f$ au point d'abscisse $1$.

    **6.** Interpréter graphiquement le résultat de la question 2 en ce point.
  corrige: |
    **1.** Avec $u(x)=x^{2}+1$ et $v(x)=\mathrm{e}^{-x}$, dont la dérivée est $-\mathrm{e}^{-x}$ : 
    $$\begin{aligned} f'(x) &= 2x\,\mathrm{e}^{-x}+\left(x^{2}+1\right)\times\left(-\mathrm{e}^{-x}\right) \\ &= \mathrm{e}^{-x}\left(2x-x^{2}-1\right) \\ &= -\mathrm{e}^{-x}\left(x^{2}-2x+1\right) \end{aligned}$$
     On reconnaît l'identité remarquable $x^{2}-2x+1=(x-1)^{2}$ : 
    $$\boxed{f'(x)=-(x-1)^{2}\,\mathrm{e}^{-x}}$$

    **2.** Le facteur $(x-1)^{2}$ est un carré, donc positif ou nul ; le facteur $\mathrm{e}^{-x}$ est strictement positif. Leur produit est donc positif ou nul, et son opposé est négatif ou nul. 
    $$\boxed{f'(x)\leqslant 0 \text{ pour tout réel } x}$$
     De plus $f'(x)=0$ si et seulement si $(x-1)^{2}=0$ : 
    $$\boxed{f'(x)=0 \text{ uniquement pour } x=1}$$

    **3.** La dérivée est négative sur $\mathbb{R}$ et ne s'annule qu'en un seul point, ce qui ne suffit pas à interrompre la décroissance.

    ![Figure](documents/figures/8a6f1d0499cbdf4c.svg)

    On prendra garde à ne tracer qu'**une seule flèche**, continue de part et d'autre de $1$ : la dérivée s'annule en ce point mais ne change pas de signe, la décroissance n'est donc pas interrompue. La valeur $f(1)=2\mathrm{e}^{-1}$ n'est qu'un point de passage, et non un extremum.

    $$\boxed{f \text{ est strictement décroissante sur } \mathbb{R}}$$

    $$\boxed{f \text{ n'admet donc ni maximum ni minimum}}$$

    **4.** Le facteur $x^{2}+1$ est strictement positif, car $x^{2}\geqslant 0$ ; le facteur $\mathrm{e}^{-x}$ l'est également. 
    $$\boxed{f(x)>0 \text{ pour tout réel } x}$$

    $$\boxed{\text{L'équation } f(x)=0 \text{ n'admet aucune solution}}$$

    **5.** On calcule $f(1)=\left(1+1\right)\mathrm{e}^{-1}=2\mathrm{e}^{-1}$ et $f'(1)=0$ : 
    $$y=0\times(x-1)+2\mathrm{e}^{-1} \qquad \text{d'où} \qquad \boxed{T : y=2\mathrm{e}^{-1}\approx 0{,}74}$$

    **6.** La tangente est horizontale au point d'abscisse $1$, alors même que $f$ n'y admet pas d'extremum : la courbe y présente un simple palier avant de poursuivre sa descente. 
    $$\boxed{\text{Une tangente horizontale ne signale pas toujours un extremum}}$$
     C'est le point important de cet exercice : la condition $f'(a)=0$ est nécessaire pour un extremum, mais elle n'est pas suffisante — il faut que la dérivée *change de signe*.
- id: "p-08-27"
  feuille: "f-p-08"
  numero: 27
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations, variations]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Une tasse de café est sortie d'une machine à $80$ °C et posée dans une pièce dont la température est de $20$ °C. On admet que la température du café, exprimée en degrés Celsius, $t$ minutes après avoir été servi, est donnée par : 
    $$T(t)=20+60\,\mathrm{e}^{-0,05\,t} \qquad \text{pour } t\geqslant 0$$

    **1.** Vérifier que $T(0)=80$. Interpréter ce résultat.

    **2.** Calculer $T(20)$, puis en donner une valeur approchée au dixième. Interpréter.

    **3.** Démontrer que $T'(t)=-3\,\mathrm{e}^{-0,05\,t}$, puis en déduire le sens de variation de $T$ sur $[0\,;+\infty[$. Ce résultat était-il prévisible ?

    **4.** Résoudre l'équation $T(t)=20+\dfrac{60}{\mathrm{e}}$. Interpréter le résultat obtenu.

    **5.** Démontrer que la température du café ne peut jamais atteindre $20$ °C. Interpréter physiquement.

    **6.** Le café est buvable lorsque sa température est inférieure ou égale à $20+60\,\mathrm{e}^{-1}$ degrés. Au bout de combien de temps peut-on le boire ?
  corrige: |
    **1.** 
    $$T(0)=20+60\,\mathrm{e}^{0}=20+60=\boxed{80}$$

    $$\boxed{\text{Au moment où il est servi, le café est bien à } 80 \text{ °C}}$$

    **2.** 
    $$T(20)=20+60\,\mathrm{e}^{-0,05\times 20}=20+60\,\mathrm{e}^{-1}\approx\boxed{42{,}1 \text{ °C}}$$

    $$\boxed{\text{Après } 20 \text{ minutes, le café est descendu à environ } 42 \text{ °C}}$$

    **3.** On dérive, avec $u(t)=-0{,}05\,t$ et $u'(t)=-0{,}05$ : 
    $$T'(t)=60\times(-0{,}05)\,\mathrm{e}^{-0,05\,t}=\boxed{-3\,\mathrm{e}^{-0,05\,t}}$$
     Comme l'exponentielle est strictement positive, $T'(t)<0$ pour tout $t$ : 
    $$\boxed{T \text{ est strictement décroissante sur } [0\,;+\infty[}$$

    $$\boxed{\text{C'était prévisible : un café posé dans une pièce plus froide refroidit}}$$

    **4.** 
    $$20+60\,\mathrm{e}^{-0,05\,t}=20+\frac{60}{\mathrm{e}} \iff 60\,\mathrm{e}^{-0,05\,t}=60\,\mathrm{e}^{-1} \iff \mathrm{e}^{-0,05\,t}=\mathrm{e}^{-1}$$
     Par stricte croissance de l'exponentielle : 
    $$-0{,}05\,t=-1 \qquad \text{d'où} \qquad \boxed{t=20 \text{ minutes}}$$
     On retrouve exactement la valeur calculée à la question 2.

    **5.** Pour tout $t\geqslant 0$, on a $\mathrm{e}^{-0,05\,t}>0$, donc $60\,\mathrm{e}^{-0,05\,t}>0$ et : 
    $$T(t)=20+\underbrace{60\,\mathrm{e}^{-0,05\,t}}_{>\,0}>20$$

    $$\boxed{\text{La température reste toujours strictement supérieure à } 20 \text{ °C}}$$

    $$\boxed{\text{Le café se rapproche de la température de la pièce sans jamais l'atteindre}}$$

    **6.** On résout l'inéquation $T(t)\leqslant 20+60\,\mathrm{e}^{-1}$ : 
    $$60\,\mathrm{e}^{-0,05\,t}\leqslant 60\,\mathrm{e}^{-1} \iff \mathrm{e}^{-0,05\,t}\leqslant\mathrm{e}^{-1} \iff -0{,}05\,t\leqslant -1$$
     En divisant par $-0{,}05$, qui est négatif, l'inégalité change de sens : 
    $$t\geqslant 20 \qquad \text{d'où} \qquad \boxed{\text{Le café est buvable à partir de } 20 \text{ minutes}}$$
