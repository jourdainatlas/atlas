  enonce: |
    Sur le graphique ci-dessous sont tracées quatre courbes, représentant dans le désordre les fonctions définies sur $\mathbb{R}$ par : 
    $$x\mapsto\mathrm{e}^{x} \qquad ; \qquad x\mapsto\mathrm{e}^{-x} \qquad ; \qquad x\mapsto\mathrm{e}^{2x} \qquad ; \qquad x\mapsto\mathrm{e}^{\frac{x}{2}}$$

    ![Figure](documents/figures/165ccfc30de22afa.svg)

    **1.** Justifier que les quatre courbes passent toutes par le point marqué en bleu pétrole, dont on donnera les coordonnées.

    **2.** Calculer le coefficient directeur de la tangente à chacune de ces quatre courbes au point d'abscisse $0$.

    **3.** En déduire l'association entre chaque courbe et son expression.

    **4.** Une seule de ces quatre fonctions est décroissante sur $\mathbb{R}$. Laquelle ? Le justifier par un calcul de dérivée.
  corrige: |
    **1.** Pour chacune des quatre fonctions, l'exposant s'annule en $x=0$, et $\mathrm{e}^{0}=1$ : 
    $$\mathrm{e}^{0}=1 \quad ; \quad \mathrm{e}^{-0}=1 \quad ; \quad \mathrm{e}^{2\times 0}=1 \quad ; \quad \mathrm{e}^{\frac{0}{2}}=1$$

    $$\boxed{\text{Les quatre courbes passent par le point de coordonnées } (0\,;1)}$$

    **2.** On applique $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}$, puis on évalue en $0$ :

    ```tableau
    **Fonction** ¦ **Dérivée** ¦ **Valeur en** $0$ ¦ **Courbe**
    $x\mapsto\mathrm{e}^{x}$ ¦ $\mathrm{e}^{x}$ ¦ $1$ ¦ $\mathcal{C}_{4}$
    $x\mapsto\mathrm{e}^{-x}$ ¦ $-\mathrm{e}^{-x}$ ¦ $-1$ ¦ $\mathcal{C}_{3}$
    $x\mapsto\mathrm{e}^{2x}$ ¦ $2\mathrm{e}^{2x}$ ¦ $2$ ¦ $\mathcal{C}_{2}$
    $x\mapsto\mathrm{e}^{\frac{x}{2}}$ ¦ $\dfrac{1}{2}\mathrm{e}^{\frac{x}{2}}$ ¦ $\dfrac{1}{2}$ ¦ $\mathcal{C}_{1}$
    ```

    **3.** Les quatre courbes se croisant toutes en $(0\,;1)$, c'est la *pente* en ce point qui permet de les distinguer : plus le coefficient directeur est grand, plus la courbe monte vite. 
    $$\boxed{\mathcal{C}_{1} : \mathrm{e}^{\frac{x}{2}} \quad ; \quad \mathcal{C}_{2} : \mathrm{e}^{2x} \quad ; \quad \mathcal{C}_{3} : \mathrm{e}^{-x} \quad ; \quad \mathcal{C}_{4} : \mathrm{e}^{x}}$$
     En effet $\mathcal{C}_{2}$ est la plus redressée, $\mathcal{C}_{1}$ la plus aplatie, et $\mathcal{C}_{3}$ est la seule à descendre.

    **4.** Une fonction est décroissante lorsque sa dérivée est négative. Or $\mathrm{e}^{-x}>0$, donc $-\mathrm{e}^{-x}<0$ : 
    $$\boxed{\text{Seule } x\mapsto\mathrm{e}^{-x} \text{ est décroissante sur } \mathbb{R}}$$
     Les trois autres dérivées sont de la forme $k\,\mathrm{e}^{u}$ avec $k>0$, donc strictement positives.
