- id: "p-08-01"
  feuille: "f-p-08"
  numero: 1
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Écrire chacun des nombres suivants sous la forme $\mathrm{e}^{k}$, où $k$ est un entier relatif.

    **a)** $\mathrm{e}^{3}\times\mathrm{e}^{5}$

    **b)** $\dfrac{\mathrm{e}^{7}}{\mathrm{e}^{2}}$

    **c)** $\left(\mathrm{e}^{2}\right)^{4}$

    **d)** $\mathrm{e}^{-3}\times\mathrm{e}^{6}$

    **e)** $\dfrac{\left(\mathrm{e}^{3}\right)^{2}\times\mathrm{e}^{-1}}{\mathrm{e}^{4}}$

    **f)** $\dfrac{1}{\mathrm{e}^{-5}}$

    **g)** $\left(\mathrm{e}^{-2}\right)^{-3}$

    **h)** $\dfrac{\mathrm{e}^{4}\times\mathrm{e}^{-4}}{\mathrm{e}^{-2}}$
  corrige: |
    On applique les règles de calcul du cours : $\mathrm{e}^{a+b}=\mathrm{e}^{a}\mathrm{e}^{b}$, $\dfrac{\mathrm{e}^{a}}{\mathrm{e}^{b}}=\mathrm{e}^{a-b}$ et $\left(\mathrm{e}^{a}\right)^{n}=\mathrm{e}^{na}$.

    **a)** $\mathrm{e}^{3}\times\mathrm{e}^{5}=\mathrm{e}^{3+5}=\boxed{\mathrm{e}^{8}}$

    **b)** $\dfrac{\mathrm{e}^{7}}{\mathrm{e}^{2}}=\mathrm{e}^{7-2}=\boxed{\mathrm{e}^{5}}$

    **c)** $\left(\mathrm{e}^{2}\right)^{4}=\mathrm{e}^{2\times 4}=\boxed{\mathrm{e}^{8}}$

    **d)** $\mathrm{e}^{-3}\times\mathrm{e}^{6}=\mathrm{e}^{-3+6}=\boxed{\mathrm{e}^{3}}$

    **e)** $\dfrac{\mathrm{e}^{6}\times\mathrm{e}^{-1}}{\mathrm{e}^{4}}=\mathrm{e}^{6-1-4}=\boxed{\mathrm{e}^{1}=\mathrm{e}}$

    **f)** $\dfrac{1}{\mathrm{e}^{-5}}=\mathrm{e}^{-(-5)}=\boxed{\mathrm{e}^{5}}$

    **g)** $\left(\mathrm{e}^{-2}\right)^{-3}=\mathrm{e}^{(-2)\times(-3)}=\boxed{\mathrm{e}^{6}}$

    **h)** $\dfrac{\mathrm{e}^{4}\times\mathrm{e}^{-4}}{\mathrm{e}^{-2}}=\dfrac{\mathrm{e}^{0}}{\mathrm{e}^{-2}}=\boxed{\mathrm{e}^{2}}$
- id: "p-08-02"
  feuille: "f-p-08"
  numero: 2
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, propriétés algébriques]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Simplifier les expressions suivantes, où $x$ désigne un réel quelconque.

    **a)** $\mathrm{e}^{x}\times\mathrm{e}^{2x}$

    **b)** $\dfrac{\mathrm{e}^{5x}}{\mathrm{e}^{2x}}$

    **c)** $\left(\mathrm{e}^{x}\right)^{3}$

    **d)** $\mathrm{e}^{x+1}\times\mathrm{e}^{-x}$

    **e)** $\dfrac{\mathrm{e}^{2x-1}}{\mathrm{e}^{x+3}}$

    **f)** $\left(\mathrm{e}^{x}\right)^{2}\times\mathrm{e}^{-3x}$

    **g)** $\mathrm{e}^{x}\times\mathrm{e}^{-x}$

    **h)** $\dfrac{\left(\mathrm{e}^{2x+1}\right)^{3}}{\mathrm{e}^{x}}$
  corrige: |
    **a)** $\mathrm{e}^{x}\times\mathrm{e}^{2x}=\boxed{\mathrm{e}^{3x}}$

    **b)** $\dfrac{\mathrm{e}^{5x}}{\mathrm{e}^{2x}}=\boxed{\mathrm{e}^{3x}}$

    **c)** $\left(\mathrm{e}^{x}\right)^{3}=\boxed{\mathrm{e}^{3x}}$

    **d)** $\mathrm{e}^{x+1}\times\mathrm{e}^{-x}=\mathrm{e}^{x+1-x}=\boxed{\mathrm{e}}$

    **e)** $\dfrac{\mathrm{e}^{2x-1}}{\mathrm{e}^{x+3}}=\mathrm{e}^{(2x-1)-(x+3)}=\boxed{\mathrm{e}^{x-4}}$

    **f)** $\left(\mathrm{e}^{x}\right)^{2}\times\mathrm{e}^{-3x}=\mathrm{e}^{2x-3x}=\boxed{\mathrm{e}^{-x}}$

    **g)** $\mathrm{e}^{x}\times\mathrm{e}^{-x}=\mathrm{e}^{0}=\boxed{1}$

    **h)** $\dfrac{\left(\mathrm{e}^{2x+1}\right)^{3}}{\mathrm{e}^{x}}=\dfrac{\mathrm{e}^{6x+3}}{\mathrm{e}^{x}} =\boxed{\mathrm{e}^{5x+3}}$

    On prendra garde en e) à bien mettre entre parenthèses l'exposant du dénominateur avant de le soustraire : l'erreur classique est d'écrire $2x-1-x+3$.
- id: "p-08-03"
  feuille: "f-p-08"
  numero: 3
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Écrire chacune des expressions suivantes sous la forme $\mathrm{e}^{ax+b}$, où $a$ et $b$ sont deux réels à préciser.

    **a)** $\mathrm{e}^{3x}\times\mathrm{e}^{-2}$

    **b)** $\left(\mathrm{e}^{x-1}\right)^{4}$

    **c)** $\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{5-x}}$

    **d)** $\mathrm{e}^{-x+2}\times\left(\mathrm{e}^{x}\right)^{3}$

    **e)** $\dfrac{1}{\mathrm{e}^{4x-1}}$

    **f)** $\dfrac{\mathrm{e}^{x}\times\mathrm{e}^{2}}{\left(\mathrm{e}^{x-1}\right)^{2}}$
  corrige: |
    **a)** $\mathrm{e}^{3x}\times\mathrm{e}^{-2}=\boxed{\mathrm{e}^{3x-2}}$ ($a=3$, $b=-2$)

    **b)** $\left(\mathrm{e}^{x-1}\right)^{4}=\boxed{\mathrm{e}^{4x-4}}$ ($a=4$, $b=-4$)

    **c)** $\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{5-x}}=\mathrm{e}^{2x-(5-x)}=\boxed{\mathrm{e}^{3x-5}}$ ($a=3$, $b=-5$)

    **d)** $\mathrm{e}^{-x+2}\times\mathrm{e}^{3x}=\boxed{\mathrm{e}^{2x+2}}$ ($a=2$, $b=2$)

    **e)** $\dfrac{1}{\mathrm{e}^{4x-1}}=\boxed{\mathrm{e}^{-4x+1}}$ ($a=-4$, $b=1$)

    **f)** $\dfrac{\mathrm{e}^{x+2}}{\mathrm{e}^{2x-2}}=\mathrm{e}^{(x+2)-(2x-2)}=\boxed{\mathrm{e}^{-x+4}}$ ($a=-1$, $b=4$)
- id: "p-08-04"
  feuille: "f-p-08"
  numero: 4
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Développer et réduire les expressions suivantes.

    **1.** $A=\left(\mathrm{e}^{x}+1\right)^{2}$

    **2.** $B=\left(\mathrm{e}^{x}-1\right)\left(\mathrm{e}^{x}+1\right)$

    **3.** $C=\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2}-\left(\mathrm{e}^{x}-\mathrm{e}^{-x}\right)^{2}$

    **4.** $D=\left(\mathrm{e}^{x}+2\right)\left(\mathrm{e}^{x}-3\right)$

    **5.** $E=\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)\left(\mathrm{e}^{x}-\mathrm{e}^{-x}\right)$

    On donnera le résultat le plus simple possible : certaines de ces expressions ne dépendent même plus de $x$.
  corrige: |
    **1.** On développe l'identité remarquable $(u+v)^{2}=u^{2}+2uv+v^{2}$ : 
    $$A=\left(\mathrm{e}^{x}\right)^{2}+2\mathrm{e}^{x}+1=\boxed{\mathrm{e}^{2x}+2\mathrm{e}^{x}+1}$$

    **2.** On reconnaît $(u-v)(u+v)=u^{2}-v^{2}$ : 
    $$B=\left(\mathrm{e}^{x}\right)^{2}-1^{2}=\boxed{\mathrm{e}^{2x}-1}$$

    **3.** On développe les deux carrés séparément : 
    $$\begin{aligned} \left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2} &= \mathrm{e}^{2x}+2\underbrace{\mathrm{e}^{x}\mathrm{e}^{-x}}_{=\,1}+\mathrm{e}^{-2x} = \mathrm{e}^{2x}+2+\mathrm{e}^{-2x} \\ \left(\mathrm{e}^{x}-\mathrm{e}^{-x}\right)^{2} &= \mathrm{e}^{2x}-2+\mathrm{e}^{-2x} \end{aligned}$$
     En soustrayant, tous les termes en $\mathrm{e}^{2x}$ et $\mathrm{e}^{-2x}$ disparaissent : 
    $$C=\left(\mathrm{e}^{2x}+2+\mathrm{e}^{-2x}\right)-\left(\mathrm{e}^{2x}-2+\mathrm{e}^{-2x}\right)=\boxed{4}$$

    $$\boxed{C \text{ est une constante : elle ne dépend pas de } x}$$

    **4.** 
    $$D=\mathrm{e}^{2x}-3\mathrm{e}^{x}+2\mathrm{e}^{x}-6=\boxed{\mathrm{e}^{2x}-\mathrm{e}^{x}-6}$$

    **5.** On reconnaît à nouveau $u^{2}-v^{2}$ : 
    $$E=\left(\mathrm{e}^{x}\right)^{2}-\left(\mathrm{e}^{-x}\right)^{2}=\boxed{\mathrm{e}^{2x}-\mathrm{e}^{-2x}}$$

    La clé de cet exercice est l'égalité $\mathrm{e}^{x}\times\mathrm{e}^{-x}=\mathrm{e}^{0}=1$, qui fait disparaître les doubles produits.
- id: "p-08-05"
  feuille: "f-p-08"
  numero: 5
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Factoriser les expressions suivantes.

    **a)** $\mathrm{e}^{2x}+\mathrm{e}^{x}$

    **b)** $\mathrm{e}^{2x}-\mathrm{e}^{x}$

    **c)** $x\mathrm{e}^{x}+\mathrm{e}^{x}$

    **d)** $\mathrm{e}^{2x}-1$

    **e)** $3\mathrm{e}^{x}-3$

    **f)** $x^{2}\mathrm{e}^{x}-4\mathrm{e}^{x}$

    Pour d), on pensera à écrire $\mathrm{e}^{2x}=\left(\mathrm{e}^{x}\right)^{2}$ et à reconnaître une identité remarquable.
  corrige: |
    **a)** Le facteur commun est $\mathrm{e}^{x}$, puisque $\mathrm{e}^{2x}=\mathrm{e}^{x}\times\mathrm{e}^{x}$ : 
    $$\boxed{\mathrm{e}^{2x}+\mathrm{e}^{x}=\mathrm{e}^{x}\left(\mathrm{e}^{x}+1\right)}$$

    **b)** 
    $$\boxed{\mathrm{e}^{2x}-\mathrm{e}^{x}=\mathrm{e}^{x}\left(\mathrm{e}^{x}-1\right)}$$

    **c)** 
    $$\boxed{x\mathrm{e}^{x}+\mathrm{e}^{x}=\mathrm{e}^{x}(x+1)}$$

    **d)** En écrivant $\mathrm{e}^{2x}=\left(\mathrm{e}^{x}\right)^{2}$, on reconnaît $u^{2}-v^{2}$ : 
    $$\boxed{\mathrm{e}^{2x}-1=\left(\mathrm{e}^{x}-1\right)\left(\mathrm{e}^{x}+1\right)}$$

    **e)** 
    $$\boxed{3\mathrm{e}^{x}-3=3\left(\mathrm{e}^{x}-1\right)}$$

    **f)** On factorise d'abord par $\mathrm{e}^{x}$, puis on reconnaît $x^{2}-4$ : 
    $$x^{2}\mathrm{e}^{x}-4\mathrm{e}^{x}=\mathrm{e}^{x}\left(x^{2}-4\right)=\boxed{\mathrm{e}^{x}(x-2)(x+2)}$$
- id: "p-08-06"
  feuille: "f-p-08"
  numero: 6
  partie: "Propriétés algébriques de l'exponentielle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Démontrer que, pour tout réel $x$, les égalités suivantes sont vraies.

    **1.** $\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2}=\mathrm{e}^{2x}+2+\mathrm{e}^{-2x}$

    **2.** $\dfrac{\mathrm{e}^{x}}{\mathrm{e}^{x}+1}=1-\dfrac{1}{\mathrm{e}^{x}+1}$

    **3.** $\dfrac{1}{1+\mathrm{e}^{-x}}=\dfrac{\mathrm{e}^{x}}{1+\mathrm{e}^{x}}$

    Pour la question 3, on pourra multiplier le numérateur et le dénominateur du membre de gauche par $\mathrm{e}^{x}$. On justifiera que les dénominateurs ne s'annulent jamais.
  corrige: |
    **1.** On développe le membre de gauche : 
    $$\left(\mathrm{e}^{x}+\mathrm{e}^{-x}\right)^{2}=\left(\mathrm{e}^{x}\right)^{2} +2\underbrace{\mathrm{e}^{x}\mathrm{e}^{-x}}_{=\,\mathrm{e}^{0}=1}+\left(\mathrm{e}^{-x}\right)^{2} =\boxed{\mathrm{e}^{2x}+2+\mathrm{e}^{-2x}}$$

    **2.** Le dénominateur $\mathrm{e}^{x}+1$ est toujours strictement positif, car $\mathrm{e}^{x}>0$ : il ne s'annule jamais et l'expression est bien définie sur $\mathbb{R}$. On part du membre de droite : 
    $$1-\frac{1}{\mathrm{e}^{x}+1}=\frac{\mathrm{e}^{x}+1}{\mathrm{e}^{x}+1}-\frac{1}{\mathrm{e}^{x}+1} =\boxed{\frac{\mathrm{e}^{x}}{\mathrm{e}^{x}+1}}$$

    **3.** Les deux dénominateurs $1+\mathrm{e}^{-x}$ et $1+\mathrm{e}^{x}$ sont strictement positifs, donc non nuls. On multiplie le numérateur et le dénominateur du membre de gauche par $\mathrm{e}^{x}$, qui est non nul : 
    $$\frac{1}{1+\mathrm{e}^{-x}}=\frac{1\times\mathrm{e}^{x}}{\left(1+\mathrm{e}^{-x}\right)\times\mathrm{e}^{x}} =\frac{\mathrm{e}^{x}}{\mathrm{e}^{x}+\underbrace{\mathrm{e}^{-x}\mathrm{e}^{x}}_{=\,1}} =\boxed{\frac{\mathrm{e}^{x}}{1+\mathrm{e}^{x}}}$$
- id: "p-08-07"
  feuille: "f-p-08"
  numero: 7
  partie: "Équations et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **a)** $\mathrm{e}^{x}=\mathrm{e}^{3}$

    **b)** $\mathrm{e}^{2x+1}=\mathrm{e}^{5}$

    **c)** $\mathrm{e}^{3x-2}=\mathrm{e}^{x+4}$

    **d)** $\mathrm{e}^{x^{2}}=\mathrm{e}^{4x-3}$

    **e)** $\mathrm{e}^{x}=1$

    **f)** $\mathrm{e}^{2x}=\mathrm{e}$

    **g)** $\mathrm{e}^{-x+1}=\mathrm{e}^{2x-5}$

    **h)** $\mathrm{e}^{x^{2}-1}=1$

    On rappelle que $1=\mathrm{e}^{0}$.
  corrige: |
    La fonction exponentielle étant strictement croissante sur $\mathbb{R}$, on a $\mathrm{e}^{a}=\mathrm{e}^{b}\iff a=b$ : il suffit donc d'identifier les exposants.

    **a)** $\mathrm{e}^{x}=\mathrm{e}^{3}\iff x=3$ : $\boxed{S=\{3\}}$

    **b)** $2x+1=5\iff 2x=4$ : $\boxed{S=\{2\}}$

    **c)** $3x-2=x+4\iff 2x=6$ : $\boxed{S=\{3\}}$

    **d)** $x^{2}=4x-3\iff x^{2}-4x+3=0$. Le discriminant vaut $\Delta=16-12=4$, d'où les racines $\dfrac{4-2}{2}=1$ et $\dfrac{4+2}{2}=3$ : $\boxed{S=\{1\,;3\}}$

    **e)** $\mathrm{e}^{x}=1=\mathrm{e}^{0}\iff x=0$ : $\boxed{S=\{0\}}$

    **f)** $\mathrm{e}^{2x}=\mathrm{e}^{1}\iff 2x=1$ : $\boxed{S=\left\{\dfrac{1}{2}\right\}}$

    **g)** $-x+1=2x-5\iff 6=3x$ : $\boxed{S=\{2\}}$

    **h)** $x^{2}-1=0\iff(x-1)(x+1)=0$ : $\boxed{S=\{-1\,;1\}}$
- id: "p-08-08"
  feuille: "f-p-08"
  numero: 8
  partie: "Équations et inéquations"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes. On justifiera à chaque fois l'utilisation de la positivité stricte de l'exponentielle.

    **a)** $\left(\mathrm{e}^{x}-1\right)\left(\mathrm{e}^{x}-\mathrm{e}\right)=0$

    **b)** $(x-2)\mathrm{e}^{x}=0$

    **c)** $x^{2}\mathrm{e}^{x}-\mathrm{e}^{x}=0$

    **d)** $(2x-1)\mathrm{e}^{x+1}=0$

    **e)** $\dfrac{\mathrm{e}^{x}-1}{\mathrm{e}^{x}+2}=0$

    **f)** $\mathrm{e}^{2x}-\mathrm{e}^{x+3}=0$
  corrige: |
    L'argument central est le suivant : **pour tout réel $x$, $\mathrm{e}^{x}>0$**, donc un facteur exponentiel ne peut jamais être nul et se « simplifie » dans une équation produit nul.

    **a)** Un produit est nul si et seulement si l'un des facteurs est nul : 
    $$\mathrm{e}^{x}-1=0 \; \text{ou} \; \mathrm{e}^{x}-\mathrm{e}=0 \iff \mathrm{e}^{x}=\mathrm{e}^{0} \; \text{ou} \; \mathrm{e}^{x}=\mathrm{e}^{1}$$

    $$\boxed{S=\{0\,;1\}}$$

    **b)** Comme $\mathrm{e}^{x}\neq 0$, le produit est nul si et seulement si $x-2=0$ : $\boxed{S=\{2\}}$

    **c)** On factorise d'abord : $x^{2}\mathrm{e}^{x}-\mathrm{e}^{x}=\mathrm{e}^{x}\left(x^{2}-1\right)$. Comme $\mathrm{e}^{x}\neq 0$ : 
    $$x^{2}-1=0 \qquad \text{d'où} \qquad \boxed{S=\{-1\,;1\}}$$

    **d)** $\mathrm{e}^{x+1}\neq 0$, donc $2x-1=0$ : $\boxed{S=\left\{\dfrac{1}{2}\right\}}$

    **e)** Le dénominateur $\mathrm{e}^{x}+2$ est strictement positif, donc jamais nul : le quotient est nul si et seulement si son numérateur l'est. 
    $$\mathrm{e}^{x}-1=0 \iff \mathrm{e}^{x}=\mathrm{e}^{0} \qquad \text{d'où} \qquad \boxed{S=\{0\}}$$

    **f)** On peut factoriser par $\mathrm{e}^{x}$, ou plus simplement écrire $\mathrm{e}^{2x}=\mathrm{e}^{x+3}$ et identifier les exposants : 
    $$2x=x+3 \qquad \text{d'où} \qquad \boxed{S=\{3\}}$$
- id: "p-08-09"
  feuille: "f-p-08"
  numero: 9
  partie: "Équations et inéquations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Résoudre dans $\mathbb{R}$ les inéquations suivantes.

    **a)** $\mathrm{e}^{x}>\mathrm{e}^{4}$

    **b)** $\mathrm{e}^{2x-1}\leqslant\mathrm{e}^{x+2}$

    **c)** $\mathrm{e}^{x}<1$

    **d)** $\mathrm{e}^{-3x+2}\geqslant\mathrm{e}$

    **e)** $\mathrm{e}^{x^{2}}\leqslant\mathrm{e}^{2x+3}$

    **f)** $\mathrm{e}^{x}\geqslant\mathrm{e}^{-x}$
  corrige: |
    La fonction exponentielle étant strictement croissante, on a $\mathrm{e}^{a}<\mathrm{e}^{b}\iff a<b$ : les inégalités entre exposants se transmettent *dans le même sens*.

    **a)** $x>4$ : $\boxed{S=\left]4\,;+\infty\right[}$

    **b)** $2x-1\leqslant x+2\iff x\leqslant 3$ : $\boxed{S=\left]-\infty\,;3\right]}$

    **c)** $\mathrm{e}^{x}<\mathrm{e}^{0}\iff x<0$ : $\boxed{S=\left]-\infty\,;0\right[}$

    **d)** $-3x+2\geqslant 1\iff -3x\geqslant -1$. En divisant par $-3$, qui est négatif, l'inégalité change de sens : 
    $$x\leqslant\frac{1}{3} \qquad \text{d'où} \qquad \boxed{S=\left]-\infty\,;\frac{1}{3}\right]}$$

    **e)** $x^{2}\leqslant 2x+3\iff x^{2}-2x-3\leqslant 0$. Le trinôme a pour racines $-1$ et $3$, et son coefficient dominant est positif : il est donc négatif entre les racines. 
    $$\boxed{S=[-1\,;3]}$$

    **f)** $x\geqslant -x\iff 2x\geqslant 0$ : $\boxed{S=\left[0\,;+\infty\right[}$
- id: "p-08-10"
  feuille: "f-p-08"
  numero: 10
  partie: "Équations et inéquations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Résoudre dans $\mathbb{R}$ les inéquations suivantes, en dressant un tableau de signes lorsque c'est nécessaire.

    **1.** $\left(\mathrm{e}^{x}-1\right)\left(\mathrm{e}^{x}-\mathrm{e}\right)\geqslant 0$

    **2.** $(x-1)\mathrm{e}^{x}<0$

    **3.** $\left(\mathrm{e}^{x}-\mathrm{e}^{2}\right)(x+3)\leqslant 0$

    **4.** $\mathrm{e}^{x}\left(x^{2}-4\right)>0$
  corrige: |
    **1.** Le premier facteur s'annule en $0$, le second en $1$. Comme l'exponentielle est croissante, $\mathrm{e}^{x}-1$ est négatif pour $x<0$ et positif pour $x>0$ ; de même $\mathrm{e}^{x}-\mathrm{e}$ est négatif pour $x<1$ et positif pour $x>1$.

    ![Figure](documents/figures/7c5cb174f2209cff.svg)

    $$\boxed{S=\left]-\infty\,;0\right]\cup\left[1\,;+\infty\right[}$$

    **2.** Comme $\mathrm{e}^{x}>0$, le produit est du signe de $x-1$ : 
    $$(x-1)\mathrm{e}^{x}<0 \iff x-1<0 \qquad \text{d'où} \qquad \boxed{S=\left]-\infty\,;1\right[}$$

    **3.** Le facteur $\mathrm{e}^{x}-\mathrm{e}^{2}$ s'annule en $2$, le facteur $x+3$ s'annule en $-3$.

    ![Figure](documents/figures/1667cea89670cdc5.svg)

    $$\boxed{S=[-3\,;2]}$$

    **4.** Comme $\mathrm{e}^{x}>0$, le produit est du signe de $x^{2}-4=(x-2)(x+2)$, qui est positif à l'extérieur des racines : 
    $$\boxed{S=\left]-\infty\,;-2\right[\cup\left]2\,;+\infty\right[}$$
- id: "p-08-11"
  feuille: "f-p-08"
  numero: 11
  partie: "Équations et inéquations"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On considère l'équation $(E) : \mathrm{e}^{2x}-(1+\mathrm{e})\,\mathrm{e}^{x}+\mathrm{e}=0$.

    **1.** Justifier que, pour tout réel $x$, $\mathrm{e}^{2x}=\left(\mathrm{e}^{x}\right)^{2}$.

    **2.** On pose $X=\mathrm{e}^{x}$. Montrer que $(E)$ équivaut à l'équation $X^{2}-(1+\mathrm{e})X+\mathrm{e}=0$.

    **3.** Vérifier que $X=1$ et $X=\mathrm{e}$ sont solutions de cette équation.

    **4.** En déduire les solutions de $(E)$.

    **5.** Résoudre de la même manière l'équation $\mathrm{e}^{2x}-\left(\mathrm{e}+\mathrm{e}^{2}\right)\mathrm{e}^{x}+\mathrm{e}^{3}=0$.
  corrige: |
    **1.** D'après la règle $\left(\mathrm{e}^{a}\right)^{n}=\mathrm{e}^{na}$ appliquée avec $a=x$ et $n=2$ : 
    $$\boxed{\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{2x}}$$

    **2.** En posant $X=\mathrm{e}^{x}$, on a $\mathrm{e}^{2x}=X^{2}$ et $\mathrm{e}^{x}=X$, donc : 
    $$\boxed{(E) \iff X^{2}-(1+\mathrm{e})X+\mathrm{e}=0}$$

    **3.** Pour $X=1$ : 
    $$1^{2}-(1+\mathrm{e})\times 1+\mathrm{e}=1-1-\mathrm{e}+\mathrm{e}=0$$
     Pour $X=\mathrm{e}$ : 
    $$\mathrm{e}^{2}-(1+\mathrm{e})\times\mathrm{e}+\mathrm{e}=\mathrm{e}^{2}-\mathrm{e}-\mathrm{e}^{2}+\mathrm{e}=0$$

    $$\boxed{X=1 \text{ et } X=\mathrm{e} \text{ sont bien solutions}}$$

    **4.** L'équation du second degré ayant au plus deux solutions, ce sont les seules. On revient alors à $x$ : 
    $$\mathrm{e}^{x}=1=\mathrm{e}^{0} \; \Longrightarrow \; x=0 \qquad ; \qquad \mathrm{e}^{x}=\mathrm{e}=\mathrm{e}^{1} \; \Longrightarrow \; x=1$$

    $$\boxed{S=\{0\,;1\}}$$

    **5.** On pose de même $X=\mathrm{e}^{x}$ : l'équation devient $X^{2}-\left(\mathrm{e}+\mathrm{e}^{2}\right)X+\mathrm{e}^{3}=0$. On vérifie que $X=\mathrm{e}$ et $X=\mathrm{e}^{2}$ conviennent : 
    $$\mathrm{e}^{2}-\left(\mathrm{e}+\mathrm{e}^{2}\right)\mathrm{e}+\mathrm{e}^{3}=\mathrm{e}^{2}-\mathrm{e}^{2}-\mathrm{e}^{3}+\mathrm{e}^{3}=0$$

    $$\mathrm{e}^{4}-\left(\mathrm{e}+\mathrm{e}^{2}\right)\mathrm{e}^{2}+\mathrm{e}^{3}=\mathrm{e}^{4}-\mathrm{e}^{3}-\mathrm{e}^{4}+\mathrm{e}^{3}=0$$
     D'où $\mathrm{e}^{x}=\mathrm{e}^{1}$ ou $\mathrm{e}^{x}=\mathrm{e}^{2}$ : 
    $$\boxed{S=\{1\,;2\}}$$

    On remarquera que ces équations ont été choisies pour que les solutions en $X$ soient des puissances entières de $\mathrm{e}$ : dans le cas général, revenir à $x$ nécessiterait la fonction logarithme, étudiée en Terminale.
- id: "p-08-12"
  feuille: "f-p-08"
  numero: 12
  partie: "Équations et inéquations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations et inéquations suivantes.

    **a)** $\mathrm{e}^{2x}=\mathrm{e}^{x}$

    **b)** $\mathrm{e}^{x}\times\mathrm{e}^{x-2}=\mathrm{e}^{4}$

    **c)** $\left(\mathrm{e}^{x}\right)^{2}=\mathrm{e}^{x+2}$

    **d)** $\mathrm{e}^{x+1}\leqslant\dfrac{1}{\mathrm{e}^{x}}$

    **e)** $\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{3}}>\mathrm{e}^{x}$

    **f)** $\mathrm{e}^{-x}\geqslant\mathrm{e}^{x^{2}}$
  corrige: |
    **a)** $2x=x\iff x=0$ : $\boxed{S=\{0\}}$

    **b)** $\mathrm{e}^{x}\times\mathrm{e}^{x-2}=\mathrm{e}^{2x-2}$, donc $2x-2=4$ : $\boxed{S=\{3\}}$

    **c)** $\mathrm{e}^{2x}=\mathrm{e}^{x+2}$, donc $2x=x+2$ : $\boxed{S=\{2\}}$

    **d)** $\dfrac{1}{\mathrm{e}^{x}}=\mathrm{e}^{-x}$, donc l'inéquation devient $\mathrm{e}^{x+1}\leqslant\mathrm{e}^{-x}$, c'est-à-dire $x+1\leqslant -x$, soit $2x\leqslant -1$ : 
    $$\boxed{S=\left]-\infty\,;-\frac{1}{2}\right]}$$

    **e)** $\dfrac{\mathrm{e}^{2x}}{\mathrm{e}^{3}}=\mathrm{e}^{2x-3}$, donc $2x-3>x$, soit $x>3$ : 
    $$\boxed{S=\left]3\,;+\infty\right[}$$

    **f)** $-x\geqslant x^{2}\iff x^{2}+x\leqslant 0\iff x(x+1)\leqslant 0$. Le trinôme a pour racines $-1$ et $0$, il est négatif entre les racines : 
    $$\boxed{S=[-1\,;0]}$$
- id: "p-08-13"
  feuille: "f-p-08"
  numero: 13
  partie: "Étude de la fonction exponentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, variations]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Comparer les nombres suivants, sans calculatrice, en justifiant par le sens de variation de la fonction exponentielle.

    **(a)** $\mathrm{e}^{2}$ et $\mathrm{e}^{3}$

    **(b)** $\mathrm{e}^{-1}$ et $\mathrm{e}^{-2}$

    **(c)** $\mathrm{e}^{\sqrt{2}}$ et $\mathrm{e}^{1,5}$

    **(d)** $\mathrm{e}^{\pi}$ et $\mathrm{e}^{3}$

    **(e)** $\mathrm{e}^{-3}$ et $0$

    **(f)** $\mathrm{e}^{0}$ et $1$

    **2.** Ranger dans l'ordre croissant les nombres suivants : 
    $$\mathrm{e}^{-2} \quad ; \quad \mathrm{e}^{0,5} \quad ; \quad 1 \quad ; \quad \mathrm{e}^{-1} \quad ; \quad \mathrm{e}^{3}$$
  corrige: |
    **1.** La fonction exponentielle étant **strictement croissante** sur $\mathbb{R}$, elle conserve l'ordre : comparer $\mathrm{e}^{a}$ et $\mathrm{e}^{b}$ revient à comparer $a$ et $b$.

    **(a)** $2<3$ donc $\boxed{\mathrm{e}^{2}<\mathrm{e}^{3}}$

    **(b)** $-2<-1$ donc $\boxed{\mathrm{e}^{-2}<\mathrm{e}^{-1}}$

    **(c)** $\sqrt{2}\approx 1{,}41<1{,}5$ donc $\boxed{\mathrm{e}^{\sqrt{2}}<\mathrm{e}^{1,5}}$

    **(d)** $\pi\approx 3{,}14>3$ donc $\boxed{\mathrm{e}^{\pi}>\mathrm{e}^{3}}$

    **(e)** L'exponentielle est strictement positive : $\boxed{\mathrm{e}^{-3}>0}$

    **(f)** Par définition, $\boxed{\mathrm{e}^{0}=1}$

    La question e) ne relève pas de la croissance mais de la *stricte positivité* : un exposant négatif ne rend jamais l'exponentielle négative.

    **2.** On range d'abord les exposants, en remarquant que $1=\mathrm{e}^{0}$ : 
    $$-2<-1<0<0{,}5<3$$
     La croissance de l'exponentielle donne alors : 
    $$\boxed{\mathrm{e}^{-2}<\mathrm{e}^{-1}<1<\mathrm{e}^{0,5}<\mathrm{e}^{3}}$$
     Numériquement : $0{,}14<0{,}37<1<1{,}65<20{,}09$.
- id: "p-08-14"
  feuille: "f-p-08"
  numero: 14
  partie: "Étude de la fonction exponentielle"
  etoiles: 1
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations, tangente]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Ci-dessous est tracée la courbe $\mathcal{C}$ de la fonction exponentielle, ainsi que sa tangente $T_{0}$ au point d'abscisse $0$.

    ![Figure](documents/figures/8763d75ba779c422.svg)

    **1.** Lire graphiquement une valeur approchée de $\mathrm{e}$, puis de $\mathrm{e}^{-1}$ et de $\mathrm{e}^{2}$.

    **2.** Quelle est l'ordonnée du point de $\mathcal{C}$ d'abscisse $0$ ? Quelle propriété du cours retrouve-t-on ?

    **3.** Résoudre graphiquement l'équation $\mathrm{e}^{x}=4$, puis l'inéquation $\mathrm{e}^{x}\leqslant 2$. On donnera des valeurs approchées.

    **4.** La courbe $\mathcal{C}$ coupe-t-elle l'axe des abscisses ? Justifier par le cours.

    **5.** Lire le coefficient directeur de $T_{0}$, puis en donner une équation. Retrouver ce résultat par le calcul.

    **6.** Quelle semble être la position de $\mathcal{C}$ par rapport à $T_{0}$ ?
  corrige: |
    **1.** On lit les ordonnées des points de $\mathcal{C}$ d'abscisses $1$, $-1$ et $2$ : 
    $$\boxed{\mathrm{e}\approx 2{,}7 \qquad ; \qquad \mathrm{e}^{-1}\approx 0{,}4 \qquad ; \qquad \mathrm{e}^{2}\approx 7{,}4}$$

    **2.** Le point de $\mathcal{C}$ d'abscisse $0$ a pour ordonnée $1$. 
    $$\boxed{\mathrm{e}^{0}=1}$$
     C'est la condition $f(0)=1$ qui caractérise l'exponentielle dans la proposition 1 du cours.

    **3.** On lit les abscisses des points de $\mathcal{C}$ d'ordonnée $4$, puis ceux dont l'ordonnée est inférieure ou égale à $2$ : 
    $$\boxed{\mathrm{e}^{x}=4 \text{ pour } x\approx 1{,}4} \qquad ; \qquad \boxed{\mathrm{e}^{x}\leqslant 2 \text{ pour } x\lesssim 0{,}7}$$
     Autrement dit $S\approx\left]-\infty\,;0{,}7\right]$ pour l'inéquation.

    **4.** La courbe reste toujours au-dessus de l'axe des abscisses, dont elle se rapproche sans jamais l'atteindre lorsque $x$ devient très négatif. 
    $$\boxed{\mathcal{C} \text{ ne coupe pas l'axe des abscisses, car } \mathrm{e}^{x}>0 \text{ pour tout } x}$$

    **5.** La droite $T_{0}$ passe par $(0\,;1)$ et par $(1\,;2)$ : en avançant de $1$, on monte de $1$, donc son coefficient directeur vaut $1$. 
    $$\boxed{T_{0} : y=x+1}$$
     Par le calcul : la tangente au point d'abscisse $0$ a pour équation $y=f'(0)(x-0)+f(0)$. Or $f'=f=\exp$, donc $f'(0)=f(0)=1$ : 
    $$y=1\times x+1=x+1$$

    **6.** Sur toute la fenêtre, la courbe se situe au-dessus de la droite, les deux ne se touchant qu'en un seul point. 
    $$\boxed{\mathcal{C} \text{ semble toujours au-dessus de } T_{0}, \text{ avec contact au point } (0\,;1)}$$
     Cette conjecture est démontrée à l'exercice 29.
- id: "p-08-15"
  feuille: "f-p-08"
  numero: 15
  partie: "Étude de la fonction exponentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations, dérivation, tangente]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On note $\mathcal{C}$ la courbe représentative de la fonction exponentielle.

    **1.** Rappeler la dérivée de la fonction exponentielle, ainsi que la valeur de $\mathrm{e}^{0}$.

    **2.** Déterminer une équation de la tangente à $\mathcal{C}$ au point d'abscisse $0$.

    **3.** Déterminer une équation de la tangente à $\mathcal{C}$ au point d'abscisse $1$.

    **4.** Déterminer une équation de la tangente à $\mathcal{C}$ au point d'abscisse $-1$.

    **5.** Tracer dans un même repère la courbe $\mathcal{C}$ et ces trois tangentes, en prenant $2$ cm pour une unité en abscisse et $1$ cm pour une unité en ordonnée, avec $-3\leqslant x\leqslant 2$.

    *On utilisera les valeurs approchées $\mathrm{e}\approx 2{,}7$ et $\mathrm{e}^{-1}\approx 0{,}37$.*
  corrige: |
    **1.** La fonction exponentielle est sa propre dérivée, et vaut $1$ en $0$ : 
    $$\boxed{\exp'=\exp \qquad \text{et} \qquad \mathrm{e}^{0}=1}$$

    **2.** La tangente au point d'abscisse $a$ a pour équation $y=f'(a)(x-a)+f(a)$. Pour $a=0$, avec $f(0)=f'(0)=1$ : 
    $$\boxed{T_{0} : y=x+1}$$

    **3.** Pour $a=1$, avec $f(1)=f'(1)=\mathrm{e}$ : 
    $$y=\mathrm{e}(x-1)+\mathrm{e}=\mathrm{e} x-\mathrm{e}+\mathrm{e} \qquad \text{d'où} \qquad \boxed{T_{1} : y=\mathrm{e} x}$$
     Cette tangente passe donc par l'origine.

    **4.** Pour $a=-1$, avec $f(-1)=f'(-1)=\mathrm{e}^{-1}$ : 
    $$y=\mathrm{e}^{-1}(x+1)+\mathrm{e}^{-1} \qquad \text{d'où} \qquad \boxed{T_{-1} : y=\mathrm{e}^{-1}x+2\mathrm{e}^{-1}}$$
     Numériquement, $y\approx 0{,}37x+0{,}74$.

    **5.** Voici la figure.

    ![Figure](documents/figures/13d33bc2cbbee38d.svg)

    On observe que les trois tangentes restent toutes en dessous de $\mathcal{C}$, ne la touchant qu'en leur point de contact.
- id: "p-08-16"
  feuille: "f-p-08"
  numero: 16
  partie: "Étude de la fonction exponentielle"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle]
  noeuds: [cx-exponentielle]
  notions: [exponentielle]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Déterminer le signe de chacune des expressions suivantes, selon les valeurs du réel $x$.

    **a)** $\mathrm{e}^{x}-1$

    **b)** $\mathrm{e}^{x}-\mathrm{e}^{2}$

    **c)** $1-\mathrm{e}^{-x}$

    **d)** $(x-1)\mathrm{e}^{x}$

    **e)** $\dfrac{\mathrm{e}^{x}}{x+2}$

    **f)** $x\mathrm{e}^{x}+\mathrm{e}^{x}$

    On rappellera à chaque fois l'argument utilisé : la stricte positivité de l'exponentielle, ou sa stricte croissance.
  corrige: |
    **a)** $\mathrm{e}^{x}-1\geqslant 0\iff\mathrm{e}^{x}\geqslant\mathrm{e}^{0}\iff x\geqslant 0$ par *stricte croissance*. 
    $$\boxed{\mathrm{e}^{x}-1 \text{ est négatif si } x<0, \text{ nul si } x=0, \text{ positif si } x>0}$$

    **b)** De même, $\mathrm{e}^{x}\geqslant\mathrm{e}^{2}\iff x\geqslant 2$ : 
    $$\boxed{\mathrm{e}^{x}-\mathrm{e}^{2} \text{ est négatif si } x<2, \text{ nul si } x=2, \text{ positif si } x>2}$$

    **c)** $1-\mathrm{e}^{-x}\geqslant 0\iff\mathrm{e}^{-x}\leqslant\mathrm{e}^{0}\iff -x\leqslant 0\iff x\geqslant 0$ : 
    $$\boxed{1-\mathrm{e}^{-x} \text{ est négatif si } x<0, \text{ nul si } x=0, \text{ positif si } x>0}$$

    **d)** Par *stricte positivité*, $\mathrm{e}^{x}>0$ : le produit est du signe de $x-1$. 
    $$\boxed{(x-1)\mathrm{e}^{x} \text{ est négatif si } x<1, \text{ nul si } x=1, \text{ positif si } x>1}$$

    **e)** Le numérateur $\mathrm{e}^{x}$ est strictement positif, donc le quotient est du signe du dénominateur $x+2$ — l'expression n'étant pas définie en $-2$. 
    $$\boxed{\dfrac{\mathrm{e}^{x}}{x+2} \text{ est négatif si } x<-2 \text{ et positif si } x>-2}$$

    **f)** On factorise : $x\mathrm{e}^{x}+\mathrm{e}^{x}=\mathrm{e}^{x}(x+1)$. Comme $\mathrm{e}^{x}>0$, l'expression est du signe de $x+1$. 
    $$\boxed{\mathrm{e}^{x}(x+1) \text{ est négatif si } x<-1, \text{ nul si } x=-1, \text{ positif si } x>-1}$$
- id: "p-08-17"
  feuille: "f-p-08"
  numero: 17
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, dérivation]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Déterminer la dérivée de chacune des fonctions suivantes, en précisant à chaque fois la fonction $u$ utilisée dans la formule $\left(\mathrm{e}^{u}\right)'=u'\mathrm{e}^{u}$.

    **a)** $f(x)=\mathrm{e}^{3x}$

    **b)** $f(x)=\mathrm{e}^{-x}$

    **c)** $f(x)=\mathrm{e}^{2x+1}$

    **d)** $f(x)=\mathrm{e}^{x^{2}}$

    **e)** $f(x)=\mathrm{e}^{-x^{2}+3x}$

    **f)** $f(x)=\mathrm{e}^{x^{3}-2x}$

    **g)** $f(x)=\mathrm{e}^{\frac{1}{x}}$ sur $]0\,;+\infty[$

    **h)** $f(x)=\mathrm{e}^{\sqrt{x}}$ sur $]0\,;+\infty[$
  corrige: |
    On applique la proposition 6 : $\left(\mathrm{e}^{u}\right)'=u'\,\mathrm{e}^{u}$.

    $$\begin{array}{|c||c|c|c|} \hline  & f(x) & u(x)\text{ \; et \; }u'(x) & f'(x) \\ \hline \text{a)} & \mathrm{e}^{3x} & u=3x\text{, }u'=3 & 3\mathrm{e}^{3x} \\ \hline \text{b)} & \mathrm{e}^{-x} & u=-x\text{, }u'=-1 & -\mathrm{e}^{-x} \\ \hline \text{c)} & \mathrm{e}^{2x+1} & u=2x+1\text{, }u'=2 & 2\mathrm{e}^{2x+1} \\ \hline \text{d)} & \mathrm{e}^{x^{2}} & u=x^{2}\text{, }u'=2x & 2x\,\mathrm{e}^{x^{2}} \\ \hline \text{e)} & \mathrm{e}^{-x^{2}+3x} & u=-x^{2}+3x\text{, }u'=-2x+3 & (-2x+3)\,\mathrm{e}^{-x^{2}+3x} \\ \hline \text{f)} & \mathrm{e}^{x^{3}-2x} & u=x^{3}-2x\text{, }u'=3x^{2}-2 & \left(3x^{2}-2\right)\mathrm{e}^{x^{3}-2x} \\ \hline \text{g)} & \mathrm{e}^{\frac{1}{x}} & u=\dfrac{1}{x}\text{, }u'=-\dfrac{1}{x^{2}} & -\dfrac{1}{x^{2}}\,\mathrm{e}^{\frac{1}{x}} \\ \hline \text{h)} & \mathrm{e}^{\sqrt{x}} & u=\sqrt{x}\text{, }u'=\dfrac{1}{2\sqrt{x}} & \dfrac{\mathrm{e}^{\sqrt{x}}}{2\sqrt{x}} \\ \hline \end{array}$$
- id: "p-08-18"
  feuille: "f-p-08"
  numero: 18
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction exponentielle, dérivation]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Déterminer la dérivée de chacune des fonctions suivantes, définies sur $\mathbb{R}$ sauf mention contraire. On factorisera le résultat par une exponentielle.

    **a)** $f(x)=x\mathrm{e}^{x}$

    **b)** $f(x)=(2x-3)\mathrm{e}^{x}$

    **c)** $f(x)=x^{2}\mathrm{e}^{x}$

    **d)** $f(x)=\dfrac{\mathrm{e}^{x}}{x}$ sur $]0\,;+\infty[$

    **e)** $f(x)=(x+1)\mathrm{e}^{-x}$

    **f)** $f(x)=x\mathrm{e}^{-x}$
  corrige: |
    On utilise la dérivée d'un produit, $(uv)'=u'v+uv'$, et celle d'un quotient, $\left(\dfrac{u}{v}\right)'=\dfrac{u'v-uv'}{v^{2}}$.

    **a)** 
    $$f'(x)=1\times\mathrm{e}^{x}+x\times\mathrm{e}^{x}=\boxed{(x+1)\mathrm{e}^{x}}$$

    **b)** 
    $$f'(x)=2\mathrm{e}^{x}+(2x-3)\mathrm{e}^{x}=\boxed{(2x-1)\mathrm{e}^{x}}$$

    **c)** 
    $$f'(x)=2x\,\mathrm{e}^{x}+x^{2}\mathrm{e}^{x}=\boxed{x(x+2)\mathrm{e}^{x}}$$

    **d)** 
    $$f'(x)=\frac{\mathrm{e}^{x}\times x-\mathrm{e}^{x}\times 1}{x^{2}}=\boxed{\frac{(x-1)\mathrm{e}^{x}}{x^{2}}}$$

    **e)** Ici $\left(\mathrm{e}^{-x}\right)'=-\mathrm{e}^{-x}$ : 
    $$f'(x)=1\times\mathrm{e}^{-x}+(x+1)\times\left(-\mathrm{e}^{-x}\right)=\mathrm{e}^{-x}\big(1-x-1\big) =\boxed{-x\,\mathrm{e}^{-x}}$$

    **f)** 
    $$f'(x)=\mathrm{e}^{-x}+x\times\left(-\mathrm{e}^{-x}\right)=\boxed{(1-x)\mathrm{e}^{-x}}$$
- id: "p-08-19"
  feuille: "f-p-08"
  numero: 19
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle, dérivation, variations]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Pour chacune des fonctions suivantes, définies sur $\mathbb{R}$ : calculer la dérivée, la factoriser, étudier son signe, puis dresser le tableau de variations de $f$ en précisant les extremums.

    **1.** $f(x)=(x-2)\mathrm{e}^{x}$

    **2.** $f(x)=\mathrm{e}^{-x^{2}}$

    **3.** $f(x)=x\mathrm{e}^{-x}$
  corrige: |
    **1.** $f(x)=(x-2)\mathrm{e}^{x}$. 
    $$f'(x)=\mathrm{e}^{x}+(x-2)\mathrm{e}^{x}=\boxed{(x-1)\mathrm{e}^{x}}$$
     Comme $\mathrm{e}^{x}>0$, $f'(x)$ est du signe de $x-1$.

    ![Figure](documents/figures/f82c5e7a0eea3dc4.svg)

    $$\boxed{f \text{ admet un minimum égal à } f(1)=-\mathrm{e}\approx -2{,}72, \text{ atteint en } x=1}$$

    **2.** $f(x)=\mathrm{e}^{-x^{2}}$, avec $u=-x^{2}$ et $u'=-2x$ : 
    $$f'(x)=\boxed{-2x\,\mathrm{e}^{-x^{2}}}$$
     Comme $\mathrm{e}^{-x^{2}}>0$, $f'(x)$ est du signe de $-2x$, donc positif si $x<0$.

    ![Figure](documents/figures/f752856d9053fdcb.svg)

    $$\boxed{f \text{ admet un maximum égal à } f(0)=\mathrm{e}^{0}=1, \text{ atteint en } x=0}$$

    **3.** $f(x)=x\mathrm{e}^{-x}$. 
    $$f'(x)=\mathrm{e}^{-x}-x\,\mathrm{e}^{-x}=\boxed{(1-x)\mathrm{e}^{-x}}$$
     Comme $\mathrm{e}^{-x}>0$, $f'(x)$ est du signe de $1-x$, donc positif si $x<1$.

    ![Figure](documents/figures/0ce5bddbbf3565bd.svg)

    $$\boxed{f \text{ admet un maximum égal à } f(1)=\mathrm{e}^{-1}\approx 0{,}37, \text{ atteint en } x=1}$$
- id: "p-08-20"
  feuille: "f-p-08"
  numero: 20
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction exponentielle, équations et inéquations, dérivation, tangente]
  noeuds: [cx-exponentielle, ar-deriv]
  notions: [exponentielle, derivable]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Dans chaque cas, déterminer une équation de la tangente à la courbe de $f$ au point d'abscisse $a$.

    **a)** $f(x)=\mathrm{e}^{2x}$ et $a=0$

    **b)** $f(x)=x\mathrm{e}^{x}$ et $a=0$

    **c)** $f(x)=\mathrm{e}^{-x}$ et $a=1$

    **d)** $f(x)=(x+1)\mathrm{e}^{x}$ et $a=0$

    On rappelle que la tangente au point d'abscisse $a$ a pour équation $y=f'(a)(x-a)+f(a)$.
  corrige: |
    **a)** $f(x)=\mathrm{e}^{2x}$ donne $f'(x)=2\mathrm{e}^{2x}$, d'où $f(0)=1$ et $f'(0)=2$ : 
    $$y=2(x-0)+1 \qquad \text{d'où} \qquad \boxed{y=2x+1}$$

    **b)** $f(x)=x\mathrm{e}^{x}$ donne $f'(x)=(x+1)\mathrm{e}^{x}$, d'où $f(0)=0$ et $f'(0)=1$ : 
    $$\boxed{y=x}$$

    **c)** $f(x)=\mathrm{e}^{-x}$ donne $f'(x)=-\mathrm{e}^{-x}$, d'où $f(1)=\mathrm{e}^{-1}$ et $f'(1)=-\mathrm{e}^{-1}$ : 
    $$y=-\mathrm{e}^{-1}(x-1)+\mathrm{e}^{-1}=-\mathrm{e}^{-1}x+\mathrm{e}^{-1}+\mathrm{e}^{-1}$$

    $$\boxed{y=-\mathrm{e}^{-1}x+2\mathrm{e}^{-1}}$$

    **d)** $f(x)=(x+1)\mathrm{e}^{x}$ donne $f'(x)=\mathrm{e}^{x}+(x+1)\mathrm{e}^{x}=(x+2)\mathrm{e}^{x}$, d'où $f(0)=1$ et $f'(0)=2$ : 
    $$\boxed{y=2x+1}$$

    On remarquera que les fonctions a) et d), bien que différentes, admettent la même tangente en $0$ : elles ont même valeur et même nombre dérivé en ce point.
