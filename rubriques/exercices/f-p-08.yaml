  enonce: |
    Soit $m$ un réel. On considère la fonction $f_{m}$ définie sur $\mathbb{R}$ par : 
    $$f_{m}(x)=(x+m)\,\mathrm{e}^{x}$$

    **1.** Démontrer que pour tout réel $x$, $f_{m}'(x)=(x+m+1)\,\mathrm{e}^{x}$.

    **2.** Étudier le signe de $f_{m}'(x)$ selon les valeurs de $x$, puis dresser le tableau de variations de $f_{m}$ en fonction de $m$.

    **3.** Démontrer que $f_{m}$ admet un minimum sur $\mathbb{R}$, et que ce minimum vaut $-\mathrm{e}^{-m-1}$.

    **4.** Démontrer que ce minimum est strictement négatif, quelle que soit la valeur de $m$.

    **5.** Déterminer la valeur de $m$ pour laquelle la tangente à la courbe de $f_{m}$ au point d'abscisse $0$ est horizontale.

    **6.** Déterminer la valeur de $m$ pour laquelle la courbe de $f_{m}$ passe par le point de coordonnées $(0\,;3)$.

    **7.** Dans le cas particulier $m=0$, dresser le tableau de variations de $f_{0}$ et donner la valeur exacte de son minimum.
  corrige: |
    **1.** Avec $u(x)=x+m$ et $v(x)=\mathrm{e}^{x}$ : 
    $$f_{m}'(x)=1\times\mathrm{e}^{x}+(x+m)\times\mathrm{e}^{x}=\boxed{(x+m+1)\,\mathrm{e}^{x}}$$

    **2.** Comme $\mathrm{e}^{x}>0$, le signe de $f_{m}'(x)$ est celui de $x+m+1$, qui s'annule en $x=-m-1$ : 
    $$f_{m}'(x)\geqslant 0 \iff x\geqslant -m-1$$

    ![Figure](documents/figures/497584ad39071605.svg)

    **3.** La fonction décroît puis croît : elle admet donc un minimum, atteint en $-m-1$. On le calcule : 
    $$\begin{aligned} f_{m}(-m-1) &= (-m-1+m)\,\mathrm{e}^{-m-1} \\ &= (-1)\times\mathrm{e}^{-m-1} = \boxed{-\mathrm{e}^{-m-1}} \end{aligned}$$

    **4.** L'exponentielle étant strictement positive, $\mathrm{e}^{-m-1}>0$, donc son opposé est strictement négatif : 
    $$\boxed{\text{Pour toute valeur de } m, \text{ le minimum } -\mathrm{e}^{-m-1} \text{ est strictement négatif}}$$
     Autrement dit, la courbe de $f_{m}$ passe toujours en dessous de l'axe des abscisses, quelle que soit la valeur du paramètre.

    **5.** La tangente est horizontale lorsque le nombre dérivé s'annule : 
    $$f_{m}'(0)=(0+m+1)\,\mathrm{e}^{0}=m+1$$

    $$m+1=0 \qquad \text{d'où} \qquad \boxed{m=-1}$$

    **6.** La courbe passe par $(0\,;3)$ si $f_{m}(0)=3$ : 
    $$f_{m}(0)=(0+m)\,\mathrm{e}^{0}=m \qquad \text{d'où} \qquad \boxed{m=3}$$

    **7.** Pour $m=0$, on a $f_{0}(x)=x\,\mathrm{e}^{x}$ et $f_{0}'(x)=(x+1)\mathrm{e}^{x}$, qui s'annule en $-1$.

    ![Figure](documents/figures/ed067be1e9b51af8.svg)

    $$\boxed{\text{Le minimum de } f_{0} \text{ vaut } -\mathrm{e}^{-1}\approx -0{,}37, \text{ atteint en } x=-1}$$
     C'est bien la valeur donnée par la formule générale de la question 3 avec $m=0$.

