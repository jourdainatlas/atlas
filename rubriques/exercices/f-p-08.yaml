  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=\left(x^{2}-3\right)\mathrm{e}^{x}$.

    **1.** Démontrer que pour tout réel $x$, $f'(x)=(x+3)(x-1)\mathrm{e}^{x}$.

    **2.** Étudier le signe de $f'(x)$ sur $\mathbb{R}$.

    **3.** Dresser le tableau de variations de $f$, en donnant les valeurs exactes des extremums locaux puis une valeur approchée au centième.

    **4.** Résoudre l'équation $f(x)=0$.

    **5.** En déduire le signe de $f(x)$ selon les valeurs de $x$.
  corrige: |
    **1.** On dérive le produit, avec $u(x)=x^{2}-3$ et $v(x)=\mathrm{e}^{x}$ : 
    $$\begin{aligned} f'(x) &= 2x\,\mathrm{e}^{x}+\left(x^{2}-3\right)\mathrm{e}^{x} \\ &= \left(x^{2}+2x-3\right)\mathrm{e}^{x} \end{aligned}$$
     Le trinôme $x^{2}+2x-3$ a pour discriminant $\Delta=4+12=16$, d'où les racines $\dfrac{-2-4}{2}=-3$ et $\dfrac{-2+4}{2}=1$ : 
    $$\boxed{f'(x)=(x+3)(x-1)\mathrm{e}^{x}}$$

    **2.** Comme $\mathrm{e}^{x}>0$, le signe de $f'(x)$ est celui du trinôme, positif à l'extérieur des racines : 
    $$\boxed{f'(x)>0 \text{ sur } \left]-\infty\,;-3\right[\cup\left]1\,;+\infty\right[ \quad \text{et} \quad f'(x)<0 \text{ sur } \left]-3\,;1\right[}$$

    **3.**

    ![Figure](documents/figures/05bb3621178f83f9.svg)

    $$f(-3)=\left(9-3\right)\mathrm{e}^{-3}=\boxed{6\mathrm{e}^{-3}\approx 0{,}30} \qquad ; \qquad f(1)=\left(1-3\right)\mathrm{e}=\boxed{-2\mathrm{e}\approx -5{,}44}$$

    **4.** Comme $\mathrm{e}^{x}\neq 0$ : 
    $$f(x)=0 \iff x^{2}-3=0 \iff \boxed{x=-\sqrt{3} \text{ ou } x=\sqrt{3}}$$

    **5.** Le signe de $f(x)$ est celui de $x^{2}-3$, positif à l'extérieur des racines : 
    $$\boxed{f(x)>0 \text{ sur } \left]-\infty\,;-\sqrt{3}\right[ \cup\left]\sqrt{3}\,;+\infty\right[ \quad \text{et} \quad f(x)<0 \text{ sur } \left]-\sqrt{3}\,;\sqrt{3}\right[}$$
     On vérifie la cohérence : $-\sqrt{3}\approx -1{,}73$ est bien situé entre $-3$ et $1$, dans la zone où $f$ décroît de $0{,}30$ à $-5{,}44$.
- id: "p-08-22"
  feuille: "f-p-08"
  numero: 22
  partie: "Dérivation"
