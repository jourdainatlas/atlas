  noeuds: [cx-series-entieres, as-usuels, cx-derivation-series]
  notions: [serie-entiere]
  source: "Séries numériques (Sainte-Geneviève), exercice 98, reporté de la feuille 6"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Moments de la loi de Poisson.*

    **1.** Pour $k \in \mathbb{N}$, calculer $\displaystyle \sum_{n = 0}^{+\infty} \frac{n(n - 1)\cdots(n - k + 1)}{n!}$, en dérivant $k$ fois $x \mapsto \mathrm{e}^{x} = \sum \frac{x^{n}}{n!}$.

    **2.** Exprimer $n^{4}$ dans la base $\big(1, n, n(n - 1), n(n - 1)(n - 2), n(n - 1)(n - 2)(n - 3)\big)$, et en déduire $\displaystyle \sum_{n = 0}^{+\infty} \frac{n^{4}}{n!}$.

    Le chapitre 15 interprétera ces sommes comme des moments d'une variable aléatoire de loi de Poisson.
  corrige: |
    **1.** En dérivant $k$ fois terme à terme (théorème 3), $\mathrm{e}^{x} = \sum_{n \geqslant k} \frac{n(n - 1)\cdots(n - k + 1)}{n!}x^{n - k}$ ; les termes d'indice $n < k$ du numérateur étant nuls, on peut sommer à partir de $0$ et prendre $x = 1$. 
    $$\boxed{\sum_{n = 0}^{+\infty} \frac{n(n - 1)\cdots(n - k + 1)}{n!} = \mathrm{e} \quad \text{pour tout } k}$$

    **2.** On identifie, en évaluant en $n = 1, 2, 3, 4$ : 
    $$n^{4} = n(n - 1)(n - 2)(n - 3) + 6n(n - 1)(n - 2) + 7n(n - 1) + n.$$

    $$\boxed{\sum_{n = 0}^{+\infty} \frac{n^{4}}{n!} = (1 + 6 + 7 + 1)\mathrm{e} = 15\mathrm{e}}$$
     Le coefficient $15$ est le nombre de partitions d'un ensemble à $4$ éléments : c'est la formule de Dobinski de l'exercice 42.
- id: "mp-09-11"
  feuille: "f-mp-09"
