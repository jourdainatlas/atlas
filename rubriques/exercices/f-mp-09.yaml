  types: [Problème, Démonstration]
  mots_cles: [synthèse, rayon de convergence, dérivation et intégration terme à terme, développements usuels, série de Taylor]
  noeuds: [cx-series-entieres, cx-derivation-series, as-usuels, de-taylor, pol-binome]
  notions: [serie-entiere, polynome-taylor, coefficient-binomial]
  source: "Séries entières (Prost, LLG), exercices 37 et 38"
  page_enonce: 13
  page_corrige: 26
  enonce: |
    *Un critère de développabilité.* Soit $f \in \mathcal{C}^{\infty}(\mathbb{R}, \mathbb{R})$. On veut montrer l'équivalence entre :

    **1.** $f$ est développable en série entière au voisinage de $0$ ;

    **2.** il existe $r > 0$, $M > 0$ et $c > 0$ tels que $|f^{(k)}(x)| \leqslant Mc^{k}k!$ pour tous $k \in \mathbb{N}$ et $x \in ]-r, r[$.

    **1.** Montrer (ii) $\Rightarrow$ (i) à l'aide de l'inégalité de Taylor-Lagrange, sur l'intervalle $]-\delta, \delta[$, avec $\delta = \min(r, \frac{1}{c})$.

    **2.** Montrer que, pour $|y| < 1$ et $k \in \mathbb{N}$, $\displaystyle \sum_{m = 0}^{+\infty} \binom{m + k}{k}y^{m} = \frac{1}{(1 - y)^{k + 1}}$, en dérivant $k$ fois la série géométrique.

    **3.** On suppose (i) : $f(x) = \sum c_{n}x^{n}$ sur $]-\rho_{0}, \rho_{0}[$. Soit $\rho \in ]0, \rho_{0}[$ et $C$ tel que $|c_{n}|\rho^{n} \leqslant C$. Montrer que, pour $|x| \leqslant \frac{\rho}{2}$, 
    $$|f^{(k)}(x)| \leqslant \sum_{n \geqslant k} \frac{n!}{(n - k)!}\frac{C}{\rho^{n}}\Big(\frac{\rho}{2}\Big)^{n - k} = 2C\,k!\Big(\frac{2}{\rho}\Big)^{k},$$
     et conclure.

    **4.** *Analyticité.* Soit $\sum a_{n}x^{n}$ de rayon $R > 0$ et de somme $S$, et $x_{0} \in ]-R, R[$. En adaptant la question 3 au voisinage de $x_{0}$ et la question 1 à la fonction $h \mapsto S(x_{0} + h)$, montrer que $S$ est développable en série entière au voisinage de $x_{0}$, c'est-à-dire qu'il existe $(b_{n})$ telle que $S(x) = \sum b_{n}(x - x_{0})^{n}$ pour $x$ proche de $x_{0}$.
  corrige: |
    **1.** Pour $|x| < \delta$, l'inégalité de Taylor-Lagrange, appliquée sur le segment d'extrémités $0$ et $x$, inclus dans $]-r, r[$, donne 
    $$\Big|f(x) - \sum_{k = 0}^{n} \frac{f^{(k)}(0)}{k!}x^{k}\Big| \leqslant \frac{Mc^{n + 1}(n + 1)!}{(n + 1)!}|x|^{n + 1} = M(c|x|)^{n + 1} \xrightarrow[n \to +\infty]{} 0,$$
     puisque $c|x| < 1$. Ainsi $f$ est la somme de sa série de Taylor sur $]-\delta, \delta[$.

    **2.** En dérivant $k$ fois la série géométrique (théorème 3), 
    $$\frac{k!}{(1 - y)^{k + 1}} = \sum_{m \geqslant k} \frac{m!}{(m - k)!}y^{m - k} = \sum_{m \geqslant 0} \frac{(m + k)!}{m!}y^{m},$$
     et l'on divise par $k!$.

    **3.** Par le théorème 3 et $|c_{n}| \leqslant C\rho^{-n}$, pour $|x| \leqslant \frac{\rho}{2}$ : 
    $$|f^{(k)}(x)| \leqslant \sum_{n \geqslant k} \frac{n!}{(n - k)!}\frac{C}{\rho^{n}}\Big(\frac{\rho}{2}\Big)^{n - k} = \frac{C}{\rho^{k}}\sum_{m \geqslant 0} \frac{(m + k)!}{m!}\cdot\frac{1}{2^{m}} = \frac{C}{\rho^{k}}\,k!\,2^{k + 1},$$
     par la question 2 avec $y = \frac{1}{2}$. On obtient (ii) avec $r = \frac{\rho}{2}$, $M = 2C$ et $c = \frac{2}{\rho}$. 
    $$\boxed{|f^{(k)}(x)| \leqslant 2C\,k!\Big(\frac{2}{\rho}\Big)^{k} \ \text{ sur } \big[-\tfrac{\rho}{2}, \tfrac{\rho}{2}\big] : \ \text{(i)} \iff \text{(ii)}}$$

    **4.** Soit $\rho$ tel que $|x_{0}| < \rho < R$, $C$ tel que $|a_{n}|\rho^{n} \leqslant C$, et $\rho' \in ]|x_{0}|, \rho[$. Le calcul de la question 3, avec $|x| \leqslant \rho'$ et $q = \frac{\rho'}{\rho}$, donne 
    $$|S^{(k)}(x)| \leqslant \frac{C}{\rho^{k}}\sum_{m \geqslant 0} \frac{(m + k)!}{m!}q^{m} = \frac{C}{1 - q}\,k!\,\Big(\frac{1}{\rho(1 - q)}\Big)^{k}.$$
     La fonction $g(h) = S(x_{0} + h)$ vérifie donc (ii) pour $|h| < \rho' - |x_{0}|$, et la question 1, dont la preuve n'utilise que des valeurs voisines de $0$, montre qu'elle est la somme de sa série de Taylor en $0$. 
    $$\boxed{S(x) = \sum_{n = 0}^{+\infty} \frac{S^{(n)}(x_{0})}{n!}(x - x_{0})^{n} \ \text{ pour } x \text{ proche de } x_{0}}$$
     La somme d'une série entière est ainsi développable au voisinage de chaque point de son intervalle de convergence : on dit qu'elle est *analytique*. C'est cette propriété, beaucoup plus forte que la classe $\mathcal{C}^{\infty}$, que les exemples du cours et de l'exercice 38 mettent en défaut.

