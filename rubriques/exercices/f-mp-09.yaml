  enonce: |
    *Produits de Cauchy.* Développer en série entière, en donnant les coefficients sous forme de sommes finies ou en forme close : 
    $$\text{(a) } \mathrm{e}^{x}\sin x ; \qquad \text{(b) } \frac{\mathrm{e}^{x}}{1 - x} ; \qquad \text{(c) } \ln^{2}(1 - x) ; \qquad \text{(d) } \frac{\ln(1 + x)}{1 + x}.$$
     Pour (a), on écrira $\mathrm{e}^{x}\sin x = \Im\big(\mathrm{e}^{(1 + \mathrm{i})x}\big)$ et l'on trouvera des coefficients $\frac{2^{n/2}\sin(n\pi/4)}{n!}$.
  corrige: |
    **(a)** On développe $\mathrm{e}^{(1 + \mathrm{i})x}$ en série entière et l'on prend la partie imaginaire, avec $(1 + \mathrm{i})^{n} = 2^{n/2}\mathrm{e}^{\mathrm{i} n\pi/4}$. 
    $$\boxed{\mathrm{e}^{x}\sin x = \sum_{n \geqslant 1} \frac{2^{n/2}\sin(n\pi/4)}{n!}x^{n}, \quad R = +\infty}$$

    **(b)** Produit de Cauchy de $\sum \frac{x^{k}}{k!}$ et de $\sum x^{k}$ ; les coefficients tendent vers $\mathrm{e}$, donc le rayon vaut $1$. 
    $$\boxed{\frac{\mathrm{e}^{x}}{1 - x} = \sum_{n \geqslant 0} \Big(\sum_{k = 0}^{n} \frac{1}{k!}\Big)x^{n}, \quad R = 1}$$

    **(c)** Le carré de $-\ln(1 - x) = \sum_{k \geqslant 1} \frac{x^{k}}{k}$ a pour coefficients $\sum_{k = 1}^{n - 1} \frac{1}{k(n - k)}$, et $\frac{1}{k(n - k)} = \frac{1}{n}\big(\frac{1}{k} + \frac{1}{n - k}\big)$. 
    $$\boxed{\ln^{2}(1 - x) = \sum_{n \geqslant 2} \frac{2H_{n - 1}}{n}x^{n}, \quad R = 1}$$

    **(d)** On remplace $x$ par $-x$ dans le développement de l'exercice 25. 
    $$\boxed{\frac{\ln(1 + x)}{1 + x} = \sum_{n \geqslant 1} (-1)^{n + 1}H_{n}x^{n}, \quad R = 1}$$
- id: "mp-09-29"
  feuille: "f-mp-09"
  numero: 29
  partie: "Fonctions développables en série entière"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développements en série entière, rayon de convergence, développements usuels, équation différentielle]
  noeuds: [as-usuels, de-taylor, cx-series-entieres, cx-derivation-series]
  notions: [polynome-taylor, serie-entiere]
  source: "BibM@th, Séries entières, exercice 28"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    *Méthode de l'équation différentielle.* Soit $\alpha \in \mathbb{R}$ et $f(x) = \cos(\alpha\operatorname{Arcsin} x)$ sur $]-1, 1[$.

    **1.** Montrer que $f$ est solution de $(1 - x^{2})y'' - xy' + \alpha^{2}y = 0$, avec $f(0) = 1$ et $f'(0) = 0$.

    **2.** Déterminer les séries entières de rayon non nul solutions de cette équation, et en déduire le développement de $f$. On admettra que le problème de Cauchy a une unique solution sur $]-1, 1[$ (chapitre 16).

    **3.** Que se passe-t-il lorsque $\alpha$ est un entier pair ? Interpréter.
  corrige: |
    **1.** On calcule $f'(x) = -\frac{\alpha\sin(\alpha\operatorname{Arcsin} x)}{\sqrt{1 - x^{2}}}$, puis 
    $$f''(x) = -\frac{\alpha^{2}\cos(\alpha\operatorname{Arcsin} x)}{1 - x^{2}} - \frac{\alpha x\sin(\alpha\operatorname{Arcsin} x)}{(1 - x^{2})^{3/2}}, \qquad\text{d'où}\qquad (1 - x^{2})f'' = -\alpha^{2}f + xf'.$$
     Les conditions initiales sont $f(0) = 1$ et $f'(0) = 0$.

    **2.** *Analyse.* Pour $y = \sum a_{n}x^{n}$ de rayon non nul, le coefficient de $x^{n}$ dans $(1 - x^{2})y'' - xy' + \alpha^{2}y$ vaut 
    $$(n + 2)(n + 1)a_{n + 2} - n(n - 1)a_{n} - na_{n} + \alpha^{2}a_{n} = (n + 2)(n + 1)a_{n + 2} - (n^{2} - \alpha^{2})a_{n}.$$
     Avec $a_{0} = 1$ et $a_{1} = 0$, les coefficients impairs sont nuls et $a_{2n} = \frac{1}{(2n)!}\prod_{k = 0}^{n - 1} (4k^{2} - \alpha^{2})$.

    *Synthèse.* Si aucun facteur ne s'annule, le quotient $\frac{a_{2n + 2}x^{2n + 2}}{a_{2n}x^{2n}}$ tend vers $x^{2}$ : le rayon vaut $1$. La somme résout l'équation sur $]-1, 1[$ avec les mêmes conditions initiales, donc coïncide avec $f$ (unicité admise). 
    $$\boxed{\cos(\alpha\operatorname{Arcsin} x) = 1 + \sum_{n \geqslant 1} \Big(\prod_{k = 0}^{n - 1} (4k^{2} - \alpha^{2})\Big)\frac{x^{2n}}{(2n)!}, \quad |x| < 1}$$

    **3.** Si $\alpha = 2m$, le facteur $k = m$ est nul, et $a_{2n} = 0$ pour $n > m$ : $f$ est un polynôme de degré $2m$. Avec $\theta = \operatorname{Arcsin} x$, cela traduit le fait que $\cos(2m\theta)$ est un polynôme en $\sin\theta$ ; par exemple $\cos(2\operatorname{Arcsin} x) = 1 - 2x^{2}$.
- id: "mp-09-30"
  feuille: "f-mp-09"
  numero: 30
  partie: "Fonctions développables en série entière"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [développements en série entière, développements usuels, équation différentielle]
  noeuds: [as-usuels, de-taylor, cx-derivation-series, pol-binome]
  notions: [polynome-taylor, coefficient-binomial]
  source: "BibM@th, Séries entières, exercice 29 ; Séries entières (Prost, LLG), exercice 32"
  page_enonce: 8
  page_corrige: 16
  enonce: |
    **1.** Soit $\lambda \in \mathbb{R}$. Montrer que $g(x) = \mathrm{e}^{\lambda\operatorname{Arcsin} x}$ vérifie $(1 - x^{2})y'' - xy' - \lambda^{2}y = 0$, puis développer $g$ en série entière, en admettant comme à l'exercice 29 l'unicité de la solution du problème de Cauchy.

    **2.** En déduire le développement en série entière de $\operatorname{sh}(\operatorname{Arcsin} x)$.

    **3.** Montrer que $h(x) = \operatorname{Arcsin}^{2}x$ vérifie $(1 - x^{2})y'' - xy' = 2$, et en déduire 
    $$\operatorname{Arcsin}^{2}x = \frac{1}{2}\sum_{n = 1}^{+\infty} \frac{(2x)^{2n}}{n^{2}\binom{2n}{n}}, \qquad |x| < 1.$$
  corrige: |
    **1.** On a $g' = \frac{\lambda g}{\sqrt{1 - x^{2}}}$ et $g'' = \frac{\lambda^{2}g}{1 - x^{2}} + \frac{\lambda xg}{(1 - x^{2})^{3/2}}$, d'où $(1 - x^{2})g'' - xg' - \lambda^{2}g = 0$, avec $g(0) = 1$, $g'(0) = \lambda$. Comme à l'exercice 29, la relation $(n + 2)(n + 1)a_{n + 2} = (n^{2} + \lambda^{2})a_{n}$ donne, avec un rayon égal à $1$ si $\lambda \neq 0$, 
    $$\boxed{a_{2n} = \frac{\prod_{k = 0}^{n - 1} (4k^{2} + \lambda^{2})}{(2n)!}, \qquad a_{2n + 1} = \lambda\frac{\prod_{k = 1}^{n} \big((2k - 1)^{2} + \lambda^{2}\big)}{(2n + 1)!}}$$

    **2.** On a $\operatorname{sh}(\operatorname{Arcsin} x) = \frac{1}{2}\big(\mathrm{e}^{\operatorname{Arcsin} x} - \mathrm{e}^{-\operatorname{Arcsin} x}\big)$. Changer $\lambda = 1$ en $\lambda = -1$ ne change pas les coefficients pairs et change le signe des impairs : il reste la partie impaire du développement pour $\lambda = 1$. 
    $$\boxed{\operatorname{sh}(\operatorname{Arcsin} x) = \sum_{n \geqslant 0} \frac{\prod_{k = 1}^{n} \big((2k - 1)^{2} + 1\big)}{(2n + 1)!}x^{2n + 1} = x + \frac{x^{3}}{3} + \frac{x^{5}}{6} + \cdots}$$

    **3.** On a $h' = \frac{2\operatorname{Arcsin} x}{\sqrt{1 - x^{2}}}$ et $(1 - x^{2})h'' = 2 + xh'$, avec $h(0) = h'(0) = 0$. La fonction $h$ est paire ; la relation devient $2a_{2} = 2$ et $(n + 2)(n + 1)a_{n + 2} = n^{2}a_{n}$ pour $n \geqslant 1$, soit $a_{2n + 2} = \frac{(2n)^{2}}{(2n + 1)(2n + 2)}a_{2n}$ et $a_{2} = 1$. On vérifie par récurrence que $a_{2n} = \frac{4^{n}}{2n^{2}\binom{2n}{n}}$, en utilisant $\binom{2n + 2}{n + 1} = \frac{2(2n + 1)}{n + 1}\binom{2n}{n}$. Le rayon vaut $1$, et l'unicité conclut. 
    $$\boxed{\operatorname{Arcsin}^{2}x = \frac{1}{2}\sum_{n \geqslant 1} \frac{(2x)^{2n}}{n^{2}\binom{2n}{n}}, \quad |x| < 1}$$
     Les trois formules ont été vérifiées sur les dix premiers coefficients.
- id: "mp-09-31"
  feuille: "f-mp-09"
  numero: 31
  partie: "Fonctions développables en série entière"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développements en série entière, dérivation et intégration terme à terme, développements usuels, équation différentielle, produit de Cauchy]
  noeuds: [as-usuels, de-taylor, cx-derivation-series, cx-series-entieres]
  notions: [polynome-taylor]
  source: "BibM@th, Séries entières, exercice 30"
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $\displaystyle f(x) = \mathrm{e}^{x^{2}/2}\int_{0}^{x} \mathrm{e}^{-t^{2}/2}\,\mathrm{d} t$.

    **1.** Étudier la parité de $f$, et montrer qu'elle est l'unique solution de $y' = xy + 1$ telle que $y(0) = 0$.

    **2.** Montrer que $f$ est développable en série entière sur $\mathbb{R}$, en utilisant un produit de Cauchy, puis déterminer son développement à l'aide de l'équation différentielle.
  corrige: |
    **1.** La fonction $x \mapsto \mathrm{e}^{x^{2}/2}$ est paire et $x \mapsto \int_{0}^{x} \mathrm{e}^{-t^{2}/2}\,\mathrm{d} t$ impaire : $f$ est impaire. En dérivant, $f'(x) = x\mathrm{e}^{x^{2}/2}\int_{0}^{x} \mathrm{e}^{-t^{2}/2}\,\mathrm{d} t + \mathrm{e}^{x^{2}/2}\mathrm{e}^{-x^{2}/2} = xf(x) + 1$, et $f(0) = 0$ ; l'unicité de la solution d'un problème de Cauchy linéaire du premier ordre (chapitre 6 de MPSI) conclut.

    **2.** Les fonctions $\mathrm{e}^{x^{2}/2} = \sum \frac{x^{2n}}{2^{n}n!}$ et $\int_{0}^{x} \mathrm{e}^{-t^{2}/2}\,\mathrm{d} t = \sum (-1)^{n}\frac{x^{2n + 1}}{2^{n}n!(2n + 1)}$ sont développables sur $\mathbb{R}$, la seconde par intégration terme à terme ; leur produit de Cauchy l'est aussi. Pour $f = \sum a_{n}x^{n}$, l'équation $f' = xf + 1$ donne $a_{1} = 1$ et $(n + 1)a_{n + 1} = a_{n - 1}$ pour $n \geqslant 1$ ; avec $a_{0} = 0$, les coefficients pairs sont nuls et $a_{2n + 1} = \frac{a_{2n - 1}}{2n + 1}$. 
    $$\boxed{f(x) = \sum_{n \geqslant 0} \frac{x^{2n + 1}}{1 \cdot 3 \cdots (2n + 1)} = \sum_{n \geqslant 0} \frac{2^{n}n!}{(2n + 1)!}x^{2n + 1}, \quad R = +\infty}$$
- id: "mp-09-32"
  feuille: "f-mp-09"
  numero: 32
  partie: "Fonctions développables en série entière"
  etoiles: 2
