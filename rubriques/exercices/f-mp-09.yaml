- id: "mp-09-01"
  feuille: "f-mp-09"
  numero: 1
  partie: "Entraînement : rayon et domaine de convergence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [rayon de convergence]
  noeuds: [cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 1 ; BibM@th, Séries entières, exercices 2 et 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer le rayon de convergence de la série entière $\sum a_{n}z^{n}$ dans chacun des cas suivants.

    ```tableau
    (a) $a_{n} = \dfrac{1}{\sqrt{n}}$ ; ¦ (b) $a_{n} = \operatorname{ch} n$ ; ¦ (c) $a_{n} = \ln(n!)$ ;
    (d) $a_{n} = \cos n$ ; ¦ (e) $a_{n} = \dfrac{n^{n}}{n!}$ ; ¦ (f) $a_{n} = \dfrac{n!}{n^{n}}$ ;
    (g) $a_{n} = \arccos\Big(1 - \dfrac{1}{n^{2}}\Big)$ ; ¦ (h) $a_{n} = \dbinom{2n}{n}$ ; ¦ (i) $a_{n} = n^{\ln n}$ ;
    (j) $a_{n} = 2^{n} + 3^{n}$ ; ¦ (k) $a_{n} = \Big(1 + \dfrac{1}{n}\Big)^{n^{2}}$ ; ¦ (l) $a_{n} = \mathrm{e}^{\sqrt{n}}$.
    ```
  corrige: |
    Dans chaque cas, on utilise la règle de d'Alembert (proposition 3) ou une comparaison (proposition 2).

    **(a)** Par la proposition 2 (iii) avec $\alpha = -\frac{1}{2}$ : $\boxed{R = 1}$.

    **(b)** On a $\operatorname{ch} n \sim \frac{\mathrm{e}^{n}}{2}$, et $\sum \frac{\mathrm{e}^{n}}{2}z^{n}$ est géométrique de rayon $\frac{1}{\mathrm{e}}$ : $\boxed{R = \frac{1}{\mathrm{e}}}$.

    **(c)** Pour $n \geqslant 2$, $\ln 2 \leqslant \ln(n!) \leqslant n\ln n \leqslant n^{2}$. La majoration donne $R \geqslant 1$ par comparaison avec $\sum n^{2}z^{n}$ ; la minoration montre que le terme général ne tend pas vers $0$ en $z = 1$, d'où $R \leqslant 1$ : $\boxed{R = 1}$.

    **(d)** La suite $(\cos n)$ est bornée, donc $R \geqslant 1$. Elle ne tend pas vers $0$ : sinon $\cos(2n) = 2\cos^{2}n - 1$ tendrait vers $-1$, alors que $(\cos 2n)$ est extraite de $(\cos n)$. La série diverge grossièrement en $1$ : $\boxed{R = 1}$.

    **(e)** Le quotient vaut $\frac{(n + 1)^{n + 1}}{(n + 1)!}\cdot\frac{n!}{n^{n}} = \big(1 + \frac{1}{n}\big)^{n} \to \mathrm{e}$ : $\boxed{R = \frac{1}{\mathrm{e}}}$. **(f)** Par le calcul inverse, $\boxed{R = \mathrm{e}}$.

    **(g)** Soit $\theta_{n} = \arccos(1 - \frac{1}{n^{2}}) \in [0, \frac{\pi}{2}]$. Alors $1 - \cos\theta_{n} = \frac{1}{n^{2}} \to 0$, donc $\theta_{n} \to 0$ et $\frac{\theta_{n}^{2}}{2} \sim \frac{1}{n^{2}}$, soit $\theta_{n} \sim \frac{\sqrt{2}}{n}$ : $\boxed{R = 1}$.

    **(h)** Le quotient $\frac{(2n + 2)(2n + 1)}{(n + 1)^{2}}$ tend vers $4$ : $\boxed{R = \frac{1}{4}}$.

    **(i)** On revient à la définition : $n^{\ln n}r^{n} = \exp\big(\ln^{2}n + n\ln r\big)$ tend vers $0$ si $r < 1$, car $\ln^{2}n = o(n)$, et vers $+\infty$ si $r > 1$ : $\boxed{R = 1}$.

    **(j)** On a $2^{n} + 3^{n} \sim 3^{n}$ : $\boxed{R = \frac{1}{3}}$.

    **(k)** Le développement $\ln a_{n} = n^{2}\ln(1 + \frac{1}{n}) = n - \frac{1}{2} + O(\frac{1}{n})$ donne $\ln\frac{a_{n + 1}}{a_{n}} = 1 + O(\frac{1}{n}) \to 1$, donc $\frac{a_{n + 1}}{a_{n}} \to \mathrm{e}$ : $\boxed{R = \frac{1}{\mathrm{e}}}$.

    **(l)** Le quotient vaut $\mathrm{e}^{\sqrt{n + 1} - \sqrt{n}}$, et $\sqrt{n + 1} - \sqrt{n} = \frac{1}{\sqrt{n + 1} + \sqrt{n}} \to 0$ : $\boxed{R = 1}$.

    *Piège.* En (i) et (l), les coefficients tendent vers $+\infty$ plus vite que toute puissance de $n$, mais moins vite que toute suite géométrique $q^{n}$ avec $q > 1$ : le rayon reste $1$.
- id: "mp-09-02"
  feuille: "f-mp-09"
  numero: 2
  partie: "Entraînement : rayon et domaine de convergence"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [rayon de convergence]
  noeuds: [cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 2 ; BibM@th, Séries entières, exercice 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer le rayon de convergence $R$, puis l'ensemble des réels $x$ pour lesquels la série converge, en étudiant soigneusement les cas $x = \pm R$.

    ```tableau
    (a) $\displaystyle\sum_{n \geqslant 1} \frac{x^{n}}{n(n + 2)}$ ; ¦ (b) $\displaystyle\sum_{n \geqslant 1} \frac{x^{n}}{\sqrt{n}}$ ; ¦ (c) $\displaystyle\sum_{n \geqslant 0} \frac{2n + 1}{(n + 1)!}x^{n}$ ;
    (d) $\displaystyle\sum_{n \geqslant 1} \frac{\operatorname{ch} n}{n}x^{n}$ ; ¦ (e) $\displaystyle\sum_{n \geqslant 1} \frac{4^{n}}{n}x^{2n}$ ; ¦ (f) $\displaystyle\sum_{n \geqslant 0} \frac{x^{3n}}{(3n)!}$ ;
    (g) $\displaystyle\sum_{n \geqslant 0} \frac{(n!)^{2}}{(2n)!}x^{n}$ ; ¦ (h) $\displaystyle\sum_{n \geqslant 1} \frac{(-1)^{n}}{n^{2} + 1}x^{n}$ ; ¦ (i) $\displaystyle\sum_{n \geqslant 2} \frac{x^{n}}{n\ln n}$.
    ```

    Pour (g), on montrera que $\frac{4^{n}(n!)^{2}}{(2n)!}$ ne tend pas vers $0$, en étudiant le quotient de deux termes consécutifs.
  corrige: |
    Pour chaque série, on calcule $R$, puis on étudie séparément les points $x = R$ et $x = -R$.

    **(a)** On a $\frac{1}{n(n + 2)} \sim \frac{1}{n^{2}}$ : $R = 1$, et la série converge absolument en $\pm 1$. $\boxed{D = [-1, 1]}$

    **(b)** On a $R = 1$. En $1$, la série de Riemann $\sum \frac{1}{\sqrt{n}}$ diverge ; en $-1$, la série alternée converge. $\boxed{D = [-1, 1[}$

    **(c)** Le quotient $\frac{2n + 3}{(n + 2)(2n + 1)}$ tend vers $0$. $\boxed{R = +\infty, \ D = \mathbb{R}}$

    **(d)** On a $\frac{\operatorname{ch} n}{n} \sim \frac{\mathrm{e}^{n}}{2n}$, donc $R = \frac{1}{\mathrm{e}}$. En $x = \frac{1}{\mathrm{e}}$, le terme vaut $\frac{1 + \mathrm{e}^{-2n}}{2n} \geqslant \frac{1}{2n}$ : divergence. En $x = -\frac{1}{\mathrm{e}}$, il vaut $\frac{(-1)^{n}}{2n} + \frac{(-1)^{n}\mathrm{e}^{-2n}}{2n}$, somme du terme d'une série alternée convergente et de celui d'une série absolument convergente. $\boxed{D = \big[-\tfrac{1}{\mathrm{e}}, \tfrac{1}{\mathrm{e}}\big[}$

    **(e)** La série est lacunaire : on applique la règle de d'Alembert au terme $u_{n} = \frac{4^{n}x^{2n}}{n}$, dont le quotient tend vers $4x^{2}$. Ainsi $R = \frac{1}{2}$, et en $\pm\frac{1}{2}$ on obtient la série harmonique. $\boxed{D = \big]-\tfrac{1}{2}, \tfrac{1}{2}\big[}$

    **(f)** Le quotient de deux termes consécutifs est $\frac{|x|^{3}}{(3n + 1)(3n + 2)(3n + 3)} \to 0$. $\boxed{D = \mathbb{R}}$

    **(g)** Le quotient $\frac{(n + 1)^{2}}{(2n + 1)(2n + 2)}$ tend vers $\frac{1}{4}$ : $R = 4$. En $x = \pm 4$, $|u_{n}| = v_{n} = \frac{4^{n}(n!)^{2}}{(2n)!}$ vérifie $\frac{v_{n + 1}}{v_{n}} = \frac{2n + 2}{2n + 1} > 1$, donc $v_{n} \geqslant v_{0} = 1$ : divergence grossière. $\boxed{D = ]-4, 4[}$

    **(h)** On a $R = 1$ et $\frac{1}{n^{2} + 1} \leqslant \frac{1}{n^{2}}$ : convergence absolue en $\pm 1$. $\boxed{D = [-1, 1]}$

    **(i)** On a $R = 1$. En $1$, la série de Bertrand $\sum \frac{1}{n\ln n}$ diverge, par comparaison avec l'intégrale 
    $$\int_{2}^{N} \frac{\mathrm{d} t}{t\ln t} = \ln\ln N - \ln\ln 2 \xrightarrow[N \to +\infty]{} +\infty.$$
     En $-1$, $\big(\frac{1}{n\ln n}\big)$ décroît vers $0$ et la série alternée converge. $\boxed{D = [-1, 1[}$
- id: "mp-09-03"
  feuille: "f-mp-09"
