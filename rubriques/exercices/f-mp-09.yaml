  page_corrige: 18
  enonce: |
    Pour $a \in ]0, 1[$, on pose $I_{a} = \displaystyle\int_{0}^{a} \frac{x + \ln(1 - x)}{x^{2}}\,\mathrm{d} x$.

    **1.** Justifier l'existence de $I_{a}$ et établir l'égalité $\displaystyle I_{a} = -\sum_{n = 1}^{+\infty} \frac{a^{n}}{n(n + 1)}$.

    **2.** En déduire $\lim_{a \to 1^{-}} I_{a}$.
  corrige: |
    **1.** Pour $|x| < 1$, $x + \ln(1 - x) = -\sum_{n \geqslant 2} \frac{x^{n}}{n}$, donc l'intégrande vaut $-\sum_{n \geqslant 2} \frac{x^{n - 2}}{n}$ sur $]0, a]$ ; cette série entière de rayon $1$ prolonge l'intégrande par continuité en $0$, avec la valeur $-\frac{1}{2}$. L'intégration terme à terme sur $[0, a]$ donne 
    $$\boxed{I_{a} = -\sum_{n \geqslant 2} \frac{a^{n - 1}}{n(n - 1)} = -\sum_{m = 1}^{+\infty} \frac{a^{m}}{m(m + 1)}}$$

    **2.** La série $\sum \frac{a^{m}}{m(m + 1)}$ converge normalement sur $[0, 1]$, de terme majoré par $\frac{1}{m(m + 1)}$ : sa somme est continue en $1$. 
    $$\boxed{\lim_{a \to 1^{-}} I_{a} = -\sum_{m \geqslant 1} \frac{1}{m(m + 1)} = -1}$$
     Par exemple, $I_{1/2} = -(1 - \ln 2)$, valeur confirmée par une intégration numérique ; on retrouve l'exercice 9 (d).
