  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 1 ; BibM@th, Séries entières, exercices 3 et 10"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    *Quand la règle de d'Alembert ne s'applique pas.* Déterminer le rayon de convergence de :

    **1.** $\sum \frac{\sin(n\alpha)}{3^{n}}z^{n}$, selon la valeur du réel $\alpha$ ;

    **2.** $\sum a_{n}z^{n}$ avec $\displaystyle a_{n} = \int_{0}^{1} (1 + t^{2})^{n}\,\mathrm{d} t$ ; on encadrera $a_{n}$ en minorant l'intégrale sur $[1 - \varepsilon, 1]$ ;

    **3.** $\sum 2^{n}z^{n^{2}}$ et $\sum z^{n!}$, séries dont la plupart des coefficients sont nuls ;

    **4.** $\sum \frac{z^{2n}}{n\,4^{n}}$ et $\sum \frac{(-1)^{n}}{2^{n}}z^{3n + 1}$.
  corrige: |
    **1.** On distingue selon que $\sin(n\alpha)$ s'annule toujours ou non. Si $\alpha \in \pi\mathbb{Z}$, tous les coefficients sont nuls et $R = +\infty$. Sinon, $|a_{n}| \leqslant 3^{-n}$ donne $R \geqslant 3$. Si $\sin(n\alpha)$ tendait vers $0$, alors 
    $$\sin((n + 1)\alpha) = \sin(n\alpha)\cos\alpha + \cos(n\alpha)\sin\alpha \to 0$$
     imposerait $\cos(n\alpha) \to 0$, puisque $\sin\alpha \neq 0$, ce qui contredit $\cos^{2} + \sin^{2} = 1$. Le terme général ne tend pas vers $0$ en $z = 3$, donc $R \leqslant 3$. 
    $$\boxed{R = 3 \text{ si } \alpha \notin \pi\mathbb{Z}, \qquad R = +\infty \text{ si } \alpha \in \pi\mathbb{Z}}$$

    **2.** On encadre $a_{n}$ par deux suites géométriques. D'une part $1 \leqslant a_{n} \leqslant 2^{n}$, d'où $R \geqslant \frac{1}{2}$. D'autre part, pour $\varepsilon \in ]0, 1[$, 
    $$a_{n} \geqslant \int_{1 - \varepsilon}^{1} (1 + t^{2})^{n}\,\mathrm{d} t \geqslant \varepsilon\big(1 + (1 - \varepsilon)^{2}\big)^{n},$$
     donc $R \leqslant \frac{1}{1 + (1 - \varepsilon)^{2}}$ pour tout $\varepsilon$, et en faisant tendre $\varepsilon$ vers $0$, $R \leqslant \frac{1}{2}$. 
    $$\boxed{R = \frac{1}{2}}$$

    **3.** On revient à la définition du rayon, la règle de d'Alembert étant inapplicable. Pour $\sum 2^{n}z^{n^{2}}$, les coefficients non nuls valent $2^{n}$ au rang $n^{2}$, et $2^{n}r^{n^{2}} = \exp(n\ln 2 + n^{2}\ln r)$ tend vers $0$ si $r < 1$ et vers $+\infty$ si $r \geqslant 1$. Pour $\sum z^{n!}$, les coefficients valent $0$ ou $1$ : la suite est bornée, et la série diverge grossièrement en $1$. 
    $$\boxed{R = 1 \text{ dans les deux cas}}$$

    **4.** On applique la règle de d'Alembert aux termes $u_{n}$ eux-mêmes : les quotients tendent vers $\frac{|z|^{2}}{4}$ et $\frac{|z|^{3}}{2}$. 
    $$\boxed{R = 2 \qquad\text{et}\qquad R = 2^{1/3}}$$
- id: "mp-09-04"
  feuille: "f-mp-09"
  numero: 4
  partie: "Entraînement : rayon et domaine de convergence"
  etoiles: 2
  types: [Calcul]
  mots_cles: [rayon de convergence]
  noeuds: [cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 4 ; BibM@th, Séries entières, exercices 6 et 10"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $\sum a_{n}z^{n}$ une série entière de rayon $R \in ]0, +\infty[$, et $k \in \mathbb{N}^{*}$. Déterminer le rayon de convergence des séries 
    $$\sum a_{n}z^{kn}, \qquad \sum a_{n}^{2}z^{n}, \qquad \sum \frac{a_{n}}{n!}z^{n}.$$
     Pour la dernière, on pourra comparer $\frac{|a_{n}|\rho^{n}}{n!}$ à $|a_{n}|r^{n}$ pour $r < R$ et $\rho > 0$ quelconque.
  corrige: |
    **Série $\sum a_{n}z^{kn}$.** Elle converge absolument si $|z|^{k} < R$, et son terme $a_{n}(z^{k})^{n}$ n'est pas borné si $|z|^{k} > R$ (théorème 1 appliqué en $z^{k}$). 
    $$\boxed{R' = R^{1/k}}$$

    **Série $\sum a_{n}^{2}z^{n}$.** Pour $r \geqslant 0$, la suite $(a_{n}^{2}r^{n}) = \big((a_{n}\sqrt{r}^{\,n})^{2}\big)$ est bornée si et seulement si $(a_{n}\sqrt{r}^{\,n})$ l'est, c'est-à-dire pour $\sqrt{r} < R$, et pas pour $\sqrt{r} > R$. 
    $$\boxed{R' = R^{2}}$$

    **Série $\sum \frac{a_{n}}{n!}z^{n}$.** Soit $\rho > 0$ et $r \in ]0, R[$, avec $|a_{n}|r^{n} \leqslant M$. Alors $\frac{|a_{n}|\rho^{n}}{n!} \leqslant M\frac{(\rho/r)^{n}}{n!} \to 0$ : la suite est bornée pour tout $\rho$. 
    $$\boxed{R' = +\infty}$$
