  source: "Séries entières (Prost, LLG), exercice 11"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $A \in \mathcal{M}_{p}(\mathbb{K})(\mathbb{C})$, de valeurs propres $\lambda_{1}, \dots, \lambda_{p}$ comptées avec multiplicité, et $\rho(A) = \max_{i} |\lambda_{i}|$.

    **1.** Montrer que $\displaystyle \operatorname{tr}(A^{n}) = \sum_{i} \lambda_{i}^{n}$ (chapitre 3), et en déduire que le rayon de $\sum \operatorname{tr}(A^{n})z^{n}$ vaut $\frac{1}{\rho(A)}$ si $A$ n'est pas nilpotente.

    **2.** Exprimer la somme à l'aide de $\chi_{A}$ et de sa dérivée, en remarquant que $\displaystyle \frac{\chi_{A}'}{\chi_{A}} = \sum_{i} \frac{1}{X - \lambda_{i}}$.

    **3.** Que se passe-t-il si $A$ est nilpotente ?
  corrige: |
    **1.** La matrice $A$ est trigonalisable sur $\mathbb{C}$ (chapitre 3) : $A = PTP^{-1}$ avec $T$ triangulaire de diagonale $(\lambda_{i})$, et $T^{n}$ est triangulaire de diagonale $(\lambda_{i}^{n})$, d'où $\operatorname{tr}(A^{n}) = \operatorname{tr}(T^{n}) = \sum_{i} \lambda_{i}^{n}$. Pour $|z| < \frac{1}{\rho(A)}$, chaque série géométrique converge et 
    $$\sum_{n \geqslant 0} \operatorname{tr}(A^{n})z^{n} = \sum_{i = 1}^{p} \frac{1}{1 - \lambda_{i}z},$$
     donc $R \geqslant \frac{1}{\rho(A)}$. Pour l'inégalité inverse, on regroupe les valeurs propres distinctes $\mu_{j}$, de multiplicités $m_{j}$, de sorte que la somme vaut $\sum_{j} \frac{m_{j}}{1 - \mu_{j}z}$, et l'on choisit $\mu_{1}$ de module $\rho(A)$. Pour $z_{t} = \frac{t}{\mu_{1}}$ avec $t \in [0, 1[$, le terme $\frac{m_{1}}{1 - t}$ tend vers $+\infty$ quand $t \to 1^{-}$, alors que les autres termes restent bornés, puisque $\mu_{j}z_{t} \to \frac{\mu_{j}}{\mu_{1}} \neq 1$. Si l'on avait $R > \frac{1}{\rho(A)}$, la somme serait continue sur le disque fermé de rayon $\frac{1}{\rho(A)}$ (théorème 2), donc bornée : contradiction. 
    $$\boxed{R = \frac{1}{\rho(A)}}$$

    **2.** Avec $\frac{\chi_{A}'}{\chi_{A}}(X) = \sum_{i} \frac{1}{X - \lambda_{i}}$, évalué en $X = \frac{1}{z}$, on obtient $\sum_{i} \frac{1}{1/z - \lambda_{i}} = z\sum_{i} \frac{1}{1 - \lambda_{i}z}$. 
    $$\boxed{\sum_{n = 0}^{+\infty} \operatorname{tr}(A^{n})z^{n} = \frac{\chi_{A}'(1/z)}{z\,\chi_{A}(1/z)}, \qquad 0 < |z| < \frac{1}{\rho(A)}}$$

    **3.** Si $A$ est nilpotente, toutes ses valeurs propres sont nulles : $\operatorname{tr}(A^{n}) = 0$ pour $n \geqslant 1$ et $\operatorname{tr}(A^{0}) = p$. 
    $$\boxed{\text{la somme est la constante } p, \quad R = +\infty}$$
