  enonce: |
    Soit $\displaystyle f(x) = \sum_{n \geqslant 2} \frac{(-1)^{n}}{n(n - 1)}x^{n}$. Préciser l'ensemble de définition de $f$, exprimer $f$ à l'aide de fonctions usuelles sur $]-1, 1[$, puis calculer $f(1)$ et $f(-1)$ en justifiant la continuité de $f$ sur $[-1, 1]$.
  corrige: |
    Le rayon vaut $1$, et $\big|\frac{(-1)^{n}x^{n}}{n(n - 1)}\big| \leqslant \frac{1}{n(n - 1)}$ sur $[-1, 1]$ : la convergence est normale sur $[-1, 1]$, et $f$ y est continue. Sur $]-1, 1[$, $f''(x) = \sum_{n \geqslant 2} (-1)^{n}x^{n - 2} = \frac{1}{1 + x}$ et $f(0) = f'(0) = 0$. 
    $$\boxed{D_{f} = [-1, 1], \qquad f(x) = (1 + x)\ln(1 + x) - x \ \text{ sur } ]-1, 1[}$$
     Par continuité, $f(1) = 2\ln 2 - 1$, et $f(-1) = \lim_{x \to -1} \big((1 + x)\ln(1 + x) - x\big) = 1$, ce que confirme le calcul direct $\sum \frac{1}{n(n - 1)} = 1$. 
    $$\boxed{f(1) = 2\ln 2 - 1, \qquad f(-1) = 1}$$
- id: "mp-09-21"
  feuille: "f-mp-09"
  numero: 21
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [régularité de la somme, rayon de convergence]
  noeuds: [cx-derivation-series, cx-series-entieres]
