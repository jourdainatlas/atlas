  source: "exercice composé pour la feuille (cours, proposition 9) ; BibM@th, Séries entières, exercice 33"
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Une fonction de classe $\mathcal{C}^{\infty}$ dont la série de Taylor diverge.* Soit $\displaystyle f(x) = \sum_{n = 1}^{+\infty} \mathrm{e}^{-n}\cos(n^{2}x)$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et calculer $f^{(2k)}(0)$.

    **2.** Montrer que $\frac{|f^{(2k)}(0)|}{(2k)!}r^{2k} \geqslant \Big(\frac{2kr}{\mathrm{e}}\Big)^{2k}$ pour tout $r > 0$, en ne gardant que le terme $n = 2k$.

    **3.** En déduire que la série de Taylor de $f$ en $0$ a un rayon nul. La fonction $f$ est-elle développable en série entière ?
  corrige: |
    **1.** Les dérivées $k$-ièmes des termes sont majorées par $n^{2k}\mathrm{e}^{-n}$, terme d'une série convergente : $f$ est de classe $\mathcal{C}^{\infty}$ et se dérive terme à terme. Les dérivées impaires du cosinus s'annulent en $0$. 
    $$\boxed{f^{(2k)}(0) = (-1)^{k}\sum_{n \geqslant 1} n^{4k}\mathrm{e}^{-n}}$$

    **2.** On ne garde que le terme $n = 2k$, et l'on utilise $(2k)! \leqslant (2k)^{2k}$ : 
    $$\frac{|f^{(2k)}(0)|}{(2k)!}r^{2k} \geqslant \frac{(2k)^{4k}\mathrm{e}^{-2k}r^{2k}}{(2k)^{2k}} = \Big(\frac{2kr}{\mathrm{e}}\Big)^{2k}.$$

    **3.** Pour tout $r > 0$, ce minorant tend vers $+\infty$ : la suite des termes de la série de Taylor en $r$ n'est pas bornée, donc son rayon est nul. Par la proposition 9, $f$ n'est développable en série entière sur aucun intervalle $]-r, r[$. 
    $$\boxed{f \in \mathcal{C}^{\infty}(\mathbb{R}), \ \text{série de Taylor de rayon nul, } f \text{ non DSE}}$$
     Contrairement à $\mathrm{e}^{-1/x^{2}}$ du cours, dont la série de Taylor converge vers la mauvaise fonction, la série de Taylor diverge ici en tout point non nul.
- id: "mp-09-39"
  feuille: "f-mp-09"
  numero: 39
  partie: "Séries génératrices et dénombrement"
  etoiles: 1
