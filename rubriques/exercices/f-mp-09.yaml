  source: "Séries entières (Prost, LLG), exercice 34"
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Soit $\lambda \in ]-1, 1[$ et $f \in \mathcal{C}^{1}(\mathbb{R})$ telle que $f'(x) = f(x) + f(\lambda x)$ pour tout $x \in \mathbb{R}$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$, et que, pour tous $k \in \mathbb{N}$ et $a > 0$, 
    $$\lVert f^{(k + 1)} \rVert_{\infty, [-a, a]} \leqslant 2\lVert f^{(k)} \rVert_{\infty, [-a, a]}.$$

    **2.** En déduire que $f$ est développable en série entière sur $\mathbb{R}$, et exprimer ses coefficients à l'aide de $f(0)$ et de $\lambda$.
  corrige: |
    **1.** Si $f$ est de classe $\mathcal{C}^{k}$, le membre de droite l'est aussi, donc $f' \in \mathcal{C}^{k}$ et $f \in \mathcal{C}^{k + 1}$ : par récurrence, $f$ est de classe $\mathcal{C}^{\infty}$. En dérivant $k$ fois, $f^{(k + 1)}(x) = f^{(k)}(x) + \lambda^{k}f^{(k)}(\lambda x)$, et $\lambda x \in [-a, a]$ si $x \in [-a, a]$ : 
    $$\boxed{\lVert f^{(k + 1)} \rVert_{\infty, [-a, a]} \leqslant (1 + |\lambda|^{k})\lVert f^{(k)} \rVert_{\infty, [-a, a]} \leqslant 2\lVert f^{(k)} \rVert_{\infty, [-a, a]}}$$

    **2.** Par récurrence, $\lVert f^{(n)} \rVert_{\infty, [-a, a]} \leqslant 2^{n}\lVert f \rVert_{\infty, [-a, a]}$, et le reste de Taylor-Lagrange en $x \in [-a, a]$ est majoré par $\frac{(2a)^{n + 1}}{(n + 1)!}\lVert f \rVert_{\infty, [-a, a]} \to 0$. Enfin, en $x = 0$, $f^{(k + 1)}(0) = (1 + \lambda^{k})f^{(k)}(0)$. 
    $$\boxed{f(x) = f(0)\sum_{n \geqslant 0} \frac{\prod_{k = 0}^{n - 1} (1 + \lambda^{k})}{n!}x^{n}, \quad R = +\infty}$$
- id: "mp-09-38"
