  source: "Séries entières (Prost, LLG), exercice 13 ; BibM@th, Séries entières, exercice 5"
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Soit $(a_{n})$ définie par $a_{0} = 0$, $a_{1} = a_{2} = 1$ et $a_{n} = a_{n - 1} + a_{n - 2} - a_{n - 3}$ pour $n \geqslant 3$.

    **1.** Montrer que $|a_{n}| \leqslant 2^{n}$, et en déduire que $\sum a_{n}z^{n}$ a un rayon au moins égal à $\frac{1}{2}$.

    **2.** Calculer la somme $A(z)$ de cette série, la décomposer en éléments simples, et en déduire une expression de $a_{n}$ et le rayon exact.
  corrige: |
    **1.** Par récurrence forte : $|a_{0}|, |a_{1}|, |a_{2}|$ sont majorés par $2^{0}, 2^{1}, 2^{2}$, et $|a_{n}| \leqslant 2^{n - 1} + 2^{n - 2} + 2^{n - 3} \leqslant 2^{n}$. Le rayon est au moins $\frac{1}{2}$ (proposition 2).

    **2.** Pour $|z| < \frac{1}{2}$, la relation de récurrence donne, en décalant les indices, 
    $$(1 - z - z^{2} + z^{3})A(z) = a_{0} + (a_{1} - a_{0})z + (a_{2} - a_{1} - a_{0})z^{2} = z,$$
     et $1 - z - z^{2} + z^{3} = (1 - z)^{2}(1 + z)$. En éléments simples, 
    $$A(z) = \frac{z}{(1 - z)^{2}(1 + z)} = -\frac{1}{4}\cdot\frac{1}{1 - z} + \frac{1}{2}\cdot\frac{1}{(1 - z)^{2}} - \frac{1}{4}\cdot\frac{1}{1 + z}.$$

    $$\boxed{a_{n} = \frac{2n + 1 - (-1)^{n}}{4} = \Big\lfloor\frac{n + 1}{2}\Big\rfloor, \qquad R = 1}$$
     Le rayon exact vaut $1$, distance de $0$ aux pôles $\pm 1$ ; la majoration de la question 1 était grossière.
- id: "mp-09-40"
  feuille: "f-mp-09"
  numero: 40
  partie: "Séries génératrices et dénombrement"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries génératrices, développements usuels]
  noeuds: [cx-series-entieres, as-usuels, pol-binome]
  notions: [coefficient-binomial]
  source: "Séries entières (Prost, LLG), exercice 14"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    *Nombres de Catalan.* Soit $(u_{n})$ définie par $u_{0} = 1$ et $\displaystyle u_{n + 1} = \sum_{k = 0}^{n} u_{k}u_{n - k}$.

    **1.** À l'aide du développement de $\frac{1}{\sqrt{1 - 4x}}$ (cours, section 9.5), développer $g(x) = \frac{1 - \sqrt{1 - 4x}}{2x}$ en série entière sur $\big]-\frac{1}{4}, \frac{1}{4}\big[$, avec $g(0) = 1$, et montrer que ses coefficients sont $c_{n} = \frac{1}{n + 1}\binom{2n}{n}$.

    **2.** Vérifier que $xg(x)^{2} - g(x) + 1 = 0$, et en déduire que $(c_{n})$ vérifie la même relation que $(u_{n})$.

    **3.** Conclure que $u_{n} = \frac{1}{n + 1}\binom{2n}{n}$ pour tout $n$.
  corrige: |
    **1.** On intègre le développement de la dérivée : $\frac{\mathrm{d}}{\mathrm{d} x}\sqrt{1 - 4x} = -\frac{2}{\sqrt{1 - 4x}} = -2\sum \binom{2n}{n}x^{n}$, d'où $\sqrt{1 - 4x} = 1 - 2\sum_{n \geqslant 0} \binom{2n}{n}\frac{x^{n + 1}}{n + 1}$ pour $|x| < \frac{1}{4}$. 
    $$\boxed{g(x) = \frac{1 - \sqrt{1 - 4x}}{2x} = \sum_{n \geqslant 0} \frac{1}{n + 1}\binom{2n}{n}x^{n}, \quad R = \frac{1}{4}}$$

    **2.** Avec $s = \sqrt{1 - 4x}$, on a $s^{2} = 1 - 4x$ et 
    $$xg^{2} = \frac{(1 - s)^{2}}{4x} = \frac{2 - 2s - 4x}{4x} = g - 1.$$
     Les coefficients de $xg^{2}$ et de $g - 1$ sont respectivement $\sum_{k \leqslant n} c_{k}c_{n - k}$ et $c_{n + 1}$, au rang $n + 1$ ; l'unicité des coefficients donne $c_{n + 1} = \sum_{k = 0}^{n} c_{k}c_{n - k}$, avec $c_{0} = 1$.

    **3.** Les suites $(u_{n})$ et $(c_{n})$ vérifient la même relation et ont le même premier terme : par récurrence forte, elles sont égales. 
    $$\boxed{u_{n} = \frac{1}{n + 1}\binom{2n}{n} : \ 1, 1, 2, 5, 14, 42, \dots}$$
- id: "mp-09-41"
  feuille: "f-mp-09"
  numero: 41
  partie: "Séries génératrices et dénombrement"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries génératrices]
  noeuds: [cx-series-entieres, pol-binome]
  notions: [coefficient-binomial]
  source: "Séries entières (Prost, LLG), exercice 15"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    *Dérangements.* Pour $n \in \mathbb{N}^{*}$, on note $d_{n}$ le nombre de permutations de $\displaystyle \llbracket 1\,,n \rrbracket$ sans point fixe, et $d_{0} = 1$. On pose $f(x) = \sum \frac{d_{n}}{n!}x^{n}$.

    **1.** Montrer que $f$ est définie sur $]-1, 1[$.

    **2.** En classant les permutations selon leur ensemble de points fixes, prouver que $\displaystyle n! = \sum_{k = 0}^{n} \binom{n}{k}d_{n - k}$.

    **3.** En déduire $\mathrm{e}^{x}f(x) = \frac{1}{1 - x}$, puis $\displaystyle d_{n} = n!\sum_{k = 0}^{n} \frac{(-1)^{k}}{k!}$. Quelle est la limite de $\frac{d_{n}}{n!}$ ?
  corrige: |
    **1.** On a $d_{n} \leqslant n!$, donc $\big|\frac{d_{n}}{n!}x^{n}\big| \leqslant |x|^{n}$ et $R \geqslant 1$.

    **2.** Une permutation est déterminée par son ensemble $F$ de points fixes, de cardinal $k$, et par une permutation sans point fixe du complémentaire, à $n - k$ éléments. 
    $$\boxed{n! = \sum_{k = 0}^{n} \binom{n}{k}d_{n - k}}$$

    **3.** En divisant par $n!$, $1 = \sum_{k} \frac{1}{k!}\cdot\frac{d_{n - k}}{(n - k)!}$ : c'est le coefficient du produit de Cauchy de $\mathrm{e}^{x}$ et de $f(x)$, d'où $\mathrm{e}^{x}f(x) = \sum x^{n} = \frac{1}{1 - x}$. Le produit de Cauchy de $\mathrm{e}^{-x}$ et de $\frac{1}{1 - x}$ donne ensuite les coefficients de $f$. 
    $$\boxed{f(x) = \frac{\mathrm{e}^{-x}}{1 - x}, \qquad d_{n} = n!\sum_{k = 0}^{n} \frac{(-1)^{k}}{k!}, \qquad \frac{d_{n}}{n!} \to \frac{1}{\mathrm{e}}}$$
     On trouve $d_{2}, \dots, d_{6} = 1, 2, 9, 44, 265$ : une permutation tirée au hasard n'a aucun point fixe avec une probabilité proche de $\frac{1}{\mathrm{e}} \approx 0{,}37$.
- id: "mp-09-42"
  feuille: "f-mp-09"
  numero: 42
  partie: "Séries génératrices et dénombrement"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries génératrices, rayon de convergence, exponentielle]
  noeuds: [cx-series-entieres, ex-exponentielle, pol-binome]
  notions: [serie-entiere, coefficient-binomial, exponentielle]
  source: "Séries entières (Prost, LLG), exercice 16"
  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Nombres de Bell.* Pour $n \in \mathbb{N}$, on note $B_{n}$ le nombre de partitions de $\displaystyle \llbracket 1\,,n \rrbracket$, avec $B_{0} = 1$.

    **1.** Montrer que $\displaystyle B_{n + 1} = \sum_{k = 0}^{n} \binom{n}{k}B_{k}$, en considérant la partie de la partition qui contient $n + 1$. Calculer $B_{1}, \dots, B_{5}$.

    **2.** Montrer que $B_{n} \leqslant n!$, et en déduire que $f(x) = \sum \frac{B_{n}}{n!}x^{n}$ est définie sur $]-1, 1[$.

    **3.** Montrer que $f' = \mathrm{e}^{x}f$, et en déduire $f(x) = \exp(\mathrm{e}^{x} - 1)$. Quel est le rayon de convergence ?

    **4.** En développant $\displaystyle \exp(\mathrm{e}^{x} - 1) = \frac{1}{\mathrm{e}}\sum_{k \geqslant 0} \frac{\mathrm{e}^{kx}}{k!}$ et en justifiant une interversion, établir la formule de Dobinski $\displaystyle B_{n} = \frac{1}{\mathrm{e}}\sum_{k = 0}^{+\infty} \frac{k^{n}}{k!}$. Comparer avec l'exercice 10.
  corrige: |
    **1.** On classe les partitions de $\llbracket 1\,,n + 1 \rrbracket$ selon la partie $P$ qui contient $n + 1$ : si $P$ contient $j$ autres éléments, on les choisit de $\binom{n}{j}$ façons, et les $n - j$ restants sont partitionnés de $B_{n - j}$ façons. En posant $k = n - j$ : 
    $$\boxed{B_{n + 1} = \sum_{k = 0}^{n} \binom{n}{k}B_{k}, \qquad B_{1}, \dots, B_{5} = 1, 2, 5, 15, 52}$$

    **2.** On vérifie $B_{n} \leqslant n!$ pour $n \leqslant 2$ ; ensuite, par récurrence, pour $n \geqslant 2$, 
    $$B_{n + 1} \leqslant \sum_{k = 0}^{n} \binom{n}{k}k! = n!\sum_{k = 0}^{n} \frac{1}{(n - k)!} \leqslant \mathrm{e}\,n! \leqslant (n + 1)!.$$
     Le rayon de $\sum \frac{B_{n}}{n!}x^{n}$ est au moins $1$.

    **3.** En dérivant, $f'(x) = \sum \frac{B_{n + 1}}{n!}x^{n} = \sum_{n} \Big(\sum_{k} \frac{B_{k}}{k!}\cdot\frac{1}{(n - k)!}\Big)x^{n} = f(x)\mathrm{e}^{x}$, avec $f(0) = 1$. 
    $$\boxed{f(x) = \exp(\mathrm{e}^{x} - 1)}$$

    **4.** Pour $x$ réel, la famille $\big(\frac{k^{n}x^{n}}{k!\,n!}\big)_{(k, n)}$ est sommable, car la somme des modules vaut 
    $$\sum_{k \geqslant 0} \frac{\mathrm{e}^{k|x|}}{k!} = \exp(\mathrm{e}^{|x|}) < +\infty.$$
     En sommant de deux façons, 
    $$\exp(\mathrm{e}^{x} - 1) = \frac{1}{\mathrm{e}}\sum_{k \geqslant 0} \frac{\mathrm{e}^{kx}}{k!} = \sum_{n \geqslant 0} \Big(\frac{1}{\mathrm{e}}\sum_{k \geqslant 0} \frac{k^{n}}{k!}\Big)\frac{x^{n}}{n!}$$
     pour tout $x \in \mathbb{R}$. Par unicité des coefficients sur $]-1, 1[$, on obtient la formule de Dobinski, et le rayon est infini. 
    $$\boxed{B_{n} = \frac{1}{\mathrm{e}}\sum_{k = 0}^{+\infty} \frac{k^{n}}{k!}, \qquad R = +\infty}$$
     Pour $n = 4$, on retrouve $\sum \frac{k^{4}}{k!} = 15\mathrm{e}$ (exercice 10).
