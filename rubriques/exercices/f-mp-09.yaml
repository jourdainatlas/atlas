  noeuds: [as-usuels, de-taylor, cx-derivation-series, tg-arctan]
  notions: [polynome-taylor, arc-tangente, cosinus-sinus]
  source: "Séries entières (Prost, LLG), exercice 32"
  page_enonce: 8
  page_corrige: 17
  enonce: |
    **1.** Soit $\theta \in \big]0, \frac{\pi}{2}\big]$. Développer en série entière $x \mapsto \operatorname{Arctan}\dfrac{x\sin\theta}{1 - x\cos\theta}$ au voisinage de $0$, en commençant par sa dérivée.

    **2.** Développer en série entière $x \mapsto \displaystyle\int_{0}^{x} \frac{1 - \cos t}{t}\,\mathrm{d} t$, après avoir justifié que l'intégrande se prolonge par continuité en $0$.
  corrige: |
    **1.** Le calcul de l'exercice 13 donne $F'(x) = \frac{\sin\theta}{1 - 2x\cos\theta + x^{2}}$, valable tant que $1 - x\cos\theta > 0$, en particulier sur $]-1, 1[$. Or, pour $|x| < 1$, 
    $$\frac{\sin\theta}{1 - 2x\cos\theta + x^{2}} = \Im\frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - x\mathrm{e}^{\mathrm{i}\theta}} = \sum_{n \geqslant 0} \sin\big((n + 1)\theta\big)x^{n}.$$
     On intègre, avec $F(0) = 0$ ; le rayon vaut $1$, car $(\sin(n\theta))$ ne tend pas vers $0$ (exercice 3). 
    $$\boxed{\operatorname{Arctan}\frac{x\sin\theta}{1 - x\cos\theta} = \sum_{n \geqslant 1} \frac{\sin(n\theta)}{n}x^{n}, \quad R = 1}$$

    **2.** On a $\frac{1 - \cos t}{t} = \sum_{n \geqslant 1} (-1)^{n + 1}\frac{t^{2n - 1}}{(2n)!}$ pour $t \neq 0$, et cette série entière de rayon infini vaut $0$ en $0$, ce qui prolonge l'intégrande. On intègre terme à terme. 
    $$\boxed{\int_{0}^{x} \frac{1 - \cos t}{t}\,\mathrm{d} t = \sum_{n \geqslant 1} \frac{(-1)^{n + 1}}{2n\,(2n)!}x^{2n}, \quad R = +\infty}$$
- id: "mp-09-34"
  feuille: "f-mp-09"
  numero: 34
