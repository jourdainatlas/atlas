  mots_cles: [synthèse, développements usuels, "théorème d'Abel"]
  noeuds: [as-usuels, cx-series-entieres]
  notions: []
  source: "exercice composé pour la feuille (lecture critique)"
  page_enonce: 12
  page_corrige: 24
  enonce: |
    *Perspective : lecture critique.* Chacun des raisonnements suivants contient une erreur. La localiser, et dire si la conclusion est vraie ou fausse.

    **1.** « Pour $\sum \frac{x^{n}}{n^{2}}$, le quotient $\frac{a_{n + 1}}{a_{n}}$ tend vers $1$, donc $R = 1$ et la série diverge pour $|x| = 1$. »

    **2.** « Pour $\sum \frac{x^{2n}}{4^{n}}$, on a $\frac{a_{n + 1}}{a_{n}} = \frac{1}{4}$, donc $R = 4$. »

    **3.** « La somme de $\sum (-1)^{n}x^{n}$ est $\frac{1}{1 + x}$, qui tend vers $\frac{1}{2}$ en $1$ ; par le théorème d'Abel radial, $\sum (-1)^{n} = \frac{1}{2}$. »

    **4.** « La fonction $x \mapsto \frac{1}{1 + x^{2}}$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$ ; son développement en série entière converge donc sur $\mathbb{R}$. »
  corrige: |
    **1.** L'erreur est de croire que $R = 1$ implique la divergence sur le cercle : le rayon ne dit rien en $|x| = 1$. La conclusion est **fausse** : $\big|\frac{x^{n}}{n^{2}}\big| = \frac{1}{n^{2}}$, et la série converge absolument sur tout le cercle.

    **2.** L'erreur est d'appliquer la proposition 3 à une série lacunaire : le terme en $x^{2n}$ n'est pas le $n$-ième coefficient. La conclusion est **fausse** : le quotient des termes vaut $\frac{|x|^{2}}{4}$, et $R = 2$.

    **3.** L'erreur est d'utiliser la réciproque du théorème 5, qui suppose la convergence de la série au bord. La conclusion est **fausse** : $\sum (-1)^{n}$ diverge grossièrement.

    **4.** L'erreur est de lire le rayon sur la régularité réelle. La conclusion est **fausse** : le développement $\sum (-1)^{n}x^{2n}$ a pour rayon $1$, à cause des points $\pm\mathrm{i}$ où la fonction cesse d'être définie dans $\mathbb{C}$.
- id: "mp-09-49"
  feuille: "f-mp-09"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse, rayon de convergence, développements usuels]
  noeuds: [cx-series-entieres, as-usuels, pol-binome]
  notions: [serie-entiere, coefficient-binomial]
  source: "Séries entières (Prost, LLG), exercice 35 ; BibM@th, Séries entières, exercice 37"
  page_enonce: 12
  page_corrige: 25
  enonce: |
    *Inverse d'une série entière et nombres de Bernoulli.* Soit $\displaystyle f(x) = 1 + \sum_{n \geqslant 1} a_{n}x^{n}$, de rayon $R > 0$.

    **1.** On suppose qu'il existe $g(x) = \sum b_{n}x^{n}$, de rayon non nul, telle que $f(x)g(x) = 1$ au voisinage de $0$. Montrer que $b_{0} = 1$ et $\displaystyle b_{n} = -\sum_{k = 1}^{n} a_{k}b_{n - k}$ pour $n \geqslant 1$.

    **2.** Réciproquement, on définit $(b_{n})$ par ces relations.

    **a)** Montrer qu'il existe $\alpha \geqslant 1$ tel que $|a_{n}| \leqslant \alpha^{n}$ pour tout $n \geqslant 1$.

    **b)** Montrer par récurrence que $|b_{n}| \leqslant (2\alpha)^{n}$, et en déduire que $\frac{1}{f}$ est développable en série entière au voisinage de $0$.

    **3.** *Application.* On définit les nombres de Bernoulli par $\displaystyle \frac{x}{\mathrm{e}^{x} - 1} = \sum_{n = 0}^{+\infty} \frac{\beta_{n}}{n!}x^{n}$ au voisinage de $0$. Justifier cette définition, établir la relation $\displaystyle \sum_{k = 0}^{n} \binom{n + 1}{k}\beta_{k} = 0$ pour $n \geqslant 1$, et calculer $\beta_{0}, \dots, \beta_{4}$.

    **4.** Montrer que $x \mapsto \frac{x}{\mathrm{e}^{x} - 1} + \frac{x}{2}$ est paire, et en déduire $\beta_{2k + 1} = 0$ pour $k \geqslant 1$.
  corrige: |
    **1.** Le produit de Cauchy de $f$ et $g$ vaut $1$ près de $0$ ; par unicité des coefficients (proposition 8), son coefficient d'indice $0$ vaut $1$ et les autres sont nuls. Comme $a_{0} = 1$ : 
    $$\boxed{b_{0} = 1, \qquad b_{n} = -\sum_{k = 1}^{n} a_{k}b_{n - k} \ (n \geqslant 1)}$$

    **2. a)** Soit $r \in ]0, R[$ et $M$ tel que $|a_{n}|r^{n} \leqslant M$. Avec $\alpha = \max\big(1, \frac{\max(M, 1)}{r}\big)$, on a $|a_{n}| \leqslant \frac{M}{r^{n}} \leqslant \alpha^{n}$ pour $n \geqslant 1$.

    **2. b)** On raisonne par récurrence forte. Si $|b_{j}| \leqslant (2\alpha)^{j}$ pour $j < n$, alors 
    $$|b_{n}| \leqslant \sum_{k = 1}^{n} \alpha^{k}(2\alpha)^{n - k} = (2\alpha)^{n}\sum_{k = 1}^{n} \frac{1}{2^{k}} \leqslant (2\alpha)^{n}.$$
     La série $\sum b_{n}x^{n}$ a donc un rayon au moins $\frac{1}{2\alpha}$, et, sur un voisinage de $0$, le produit de Cauchy de $f$ et de sa somme $g$ a pour coefficients $1, 0, 0, \dots$, par construction. 
    $$\boxed{\frac{1}{f} \text{ est développable en série entière au voisinage de } 0}$$

    **3.** La fonction $\frac{\mathrm{e}^{x} - 1}{x} = \sum_{n \geqslant 0} \frac{x^{n}}{(n + 1)!}$, prolongée par $1$ en $0$, est de la forme de $f$ avec $R = +\infty$ ; la question 2 justifie la définition des $\beta_{n}$. Le coefficient d'indice $n \geqslant 1$ du produit $\frac{\mathrm{e}^{x} - 1}{x}\cdot\frac{x}{\mathrm{e}^{x} - 1} = 1$ est nul : $\sum_{k = 0}^{n} \frac{\beta_{k}}{k!\,(n + 1 - k)!} = 0$, et l'on multiplie par $(n + 1)!$. 
    $$\boxed{\sum_{k = 0}^{n} \binom{n + 1}{k}\beta_{k} = 0, \qquad \beta_{0} = 1, \ \beta_{1} = -\frac{1}{2}, \ \beta_{2} = \frac{1}{6}, \ \beta_{3} = 0, \ \beta_{4} = -\frac{1}{30}}$$

    **4.** On réduit au même dénominateur : 
    $$\frac{x}{\mathrm{e}^{x} - 1} + \frac{x}{2} = \frac{x}{2}\cdot\frac{\mathrm{e}^{x} + 1}{\mathrm{e}^{x} - 1} = \frac{x}{2}\cdot\frac{\mathrm{e}^{x/2} + \mathrm{e}^{-x/2}}{\mathrm{e}^{x/2} - \mathrm{e}^{-x/2}},$$
     produit de deux fonctions impaires, donc paire. Ses coefficients impairs sont nuls (proposition 8 (iii)) ; le terme $\frac{x}{2}$ ne modifie que le coefficient d'indice $1$. 
    $$\boxed{\beta_{2k + 1} = 0 \text{ pour } k \geqslant 1}$$
     Les nombres de Bernoulli interviennent dans une formule d'Euler, que l'on ne démontrera pas ici, $\zeta(2k) = \frac{(-1)^{k + 1}(2\pi)^{2k}\beta_{2k}}{2(2k)!}$, qui redonnent $\zeta(2) = \frac{\pi^{2}}{6}$ et $\zeta(4) = \frac{\pi^{4}}{90}$.
