  noeuds: [cx-series-entieres, as-usuels]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 8"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On pose, sous réserve de convergence, $\displaystyle f(x) = \sum_{n = 0}^{+\infty} \dfrac{n!}{1 \cdot 3 \cdot 5 \cdots (2n + 1)}x^{2n + 1}$.

    **1.** Déterminer le rayon de convergence et l'ensemble de définition de $f$. On pourra écrire le coefficient à l'aide de $\frac{4^{n}(n!)^{2}}{(2n)!}$.

    **2.** À l'aide d'un exemple du cours (section 9.5), exprimer $f$ à l'aide de fonctions usuelles.
  corrige: |
    **1.** Le coefficient vaut $c_{n} = \frac{n!}{1 \cdot 3 \cdots (2n + 1)} = \frac{2^{n}(n!)^{2}}{(2n + 1)!}$, en complétant le produit des impairs par les pairs. Le quotient de deux termes consécutifs vaut $\frac{(n + 1)x^{2}}{2n + 3} \to \frac{x^{2}}{2}$ : $R = \sqrt{2}$. En $x = \pm\sqrt{2}$, 
    $$|c_{n}x^{2n + 1}| = \sqrt{2}\,\frac{4^{n}(n!)^{2}}{(2n + 1)!} = \frac{\sqrt{2}}{2n + 1}\cdot\frac{4^{n}(n!)^{2}}{(2n)!} \geqslant \frac{\sqrt{2}}{2n + 1}$$
     par l'exercice 2 (g), et les termes sont de signe constant : divergence. 
    $$\boxed{R = \sqrt{2}, \qquad D_{f} = ]-\sqrt{2}, \sqrt{2}[}$$

    **2.** Le cours (section 9.5) donne $\frac{\operatorname{Arcsin} y}{\sqrt{1 - y^{2}}} = \sum \frac{4^{n}(n!)^{2}}{(2n + 1)!}y^{2n + 1}$ pour $|y| < 1$. Avec $y = \frac{x}{\sqrt{2}}$, on a $4^{n}y^{2n + 1} = \frac{2^{n}x^{2n + 1}}{\sqrt{2}}$, d'où $f(x) = \sqrt{2}\frac{\operatorname{Arcsin}(x/\sqrt{2})}{\sqrt{1 - x^{2}/2}}$. 
    $$\boxed{f(x) = \frac{2\operatorname{Arcsin}(x/\sqrt{2})}{\sqrt{2 - x^{2}}}}$$
- id: "mp-09-12"
  feuille: "f-mp-09"
  numero: 12
  partie: "Somme dans le disque, exponentielle complexe"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [exponentielle complexe]
  noeuds: [cx-exponentielle]
  notions: [cosinus-sinus]
  source: "exercice composé pour la feuille (cours, proposition 6)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *Cosinus et sinus complexes.* Pour $z = x + \mathrm{i} y$ avec $x$, $y$ réels :

    **1.** Montrer que $\cos z = \cos x\operatorname{ch} y - \mathrm{i}\sin x\operatorname{sh} y$, puis que 
    $$|\cos z|^{2} = \cos^{2}x + \operatorname{sh}^{2}y \qquad\text{et}\qquad |\sin z|^{2} = \sin^{2}x + \operatorname{sh}^{2}y.$$

    **2.** En déduire que les zéros de $\cos$ et de $\sin$ dans $\mathbb{C}$ sont réels, et que $\cos$ n'est pas bornée sur $\mathbb{C}$.

    **3.** Résoudre dans $\mathbb{C}$ l'équation $\cos z = 2$.

    **4.** Montrer que $\mathrm{e}^{z} = 1$ si et seulement si $z \in 2\mathrm{i}\pi\mathbb{Z}$.
  corrige: |
    **1.** On part de $\cos z = \frac{\mathrm{e}^{\mathrm{i} z} + \mathrm{e}^{-\mathrm{i} z}}{2}$ (proposition 6), avec $\mathrm{e}^{\mathrm{i} z} = \mathrm{e}^{-y}\mathrm{e}^{\mathrm{i} x} = \mathrm{e}^{-y}(\cos x + \mathrm{i}\sin x)$ et $\mathrm{e}^{-\mathrm{i} z} = \mathrm{e}^{y}(\cos x - \mathrm{i}\sin x)$, par la proposition 5. En regroupant, 
    $$\boxed{\cos z = \cos x\operatorname{ch} y - \mathrm{i}\sin x\operatorname{sh} y}, \qquad \sin z = \sin x\operatorname{ch} y + \mathrm{i}\cos x\operatorname{sh} y.$$
     Avec $\operatorname{ch}^{2}y = 1 + \operatorname{sh}^{2}y$ : 
    $$\boxed{|\cos z|^{2} = \cos^{2}x + \operatorname{sh}^{2}y, \qquad |\sin z|^{2} = \sin^{2}x + \operatorname{sh}^{2}y}$$

    **2.** Si $\cos z = 0$, les deux termes positifs $\cos^{2}x$ et $\operatorname{sh}^{2}y$ sont nuls, donc $y = 0$ : $z$ est réel ; de même pour $\sin$. Enfin $|\cos(\mathrm{i} y)| = \operatorname{ch} y \to +\infty$. 
    $$\boxed{\text{zéros de } \cos, \sin \text{ réels} ; \ \cos \text{ non bornée sur } \mathbb{C}}$$

    **3.** On sépare parties réelle et imaginaire : $\cos x\operatorname{ch} y = 2$ et $\sin x\operatorname{sh} y = 0$. Si $\operatorname{sh} y = 0$, alors $y = 0$ et $\cos x = 2$, impossible ; donc $\sin x = 0$, $\cos x = \pm 1$, et $\cos x\operatorname{ch} y = 2 > 0$ impose $\cos x = 1$, $\operatorname{ch} y = 2$, soit $y = \pm\ln(2 + \sqrt{3})$. 
    $$\boxed{\cos z = 2 \iff z = 2k\pi \pm \mathrm{i}\ln(2 + \sqrt{3}), \ k \in \mathbb{Z}}$$

    **4.** On a $\mathrm{e}^{x + \mathrm{i} y} = \mathrm{e}^{x}(\cos y + \mathrm{i}\sin y)$, de module $\mathrm{e}^{x}$. L'égalité $\mathrm{e}^{z} = 1$ impose $\mathrm{e}^{x} = 1$, donc $x = 0$, puis $\cos y = 1$ et $\sin y = 0$. 
    $$\boxed{\mathrm{e}^{z} = 1 \iff z \in 2\mathrm{i}\pi\mathbb{Z}}$$
- id: "mp-09-13"
  feuille: "f-mp-09"
  numero: 13
  partie: "Somme dans le disque, exponentielle complexe"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [exponentielle complexe, dérivation et intégration terme à terme, "théorème d'Abel"]
  noeuds: [cx-exponentielle, cx-derivation-series, cx-series-entieres, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  source: "Séries entières (Prost, LLG), exercice 9"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $\theta \in ]0, 2\pi[$ et, pour $r \in [0, 1[$, $\displaystyle \varphi(r) = \sum_{n = 1}^{+\infty} \frac{r^{n}}{n}\mathrm{e}^{\mathrm{i} n\theta}$.

    **1.** Déterminer le domaine de convergence de la série entière $\displaystyle \sum_{n \geqslant 1} \frac{z^{n}}{n}$. On admettra que la série converge en tout point du cercle unité autre que $1$ (exercice 56 de la feuille 6).

    **2.** Montrer que $\varphi$ est dérivable sur $[0, 1[$ et que $\varphi'(r) = \frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - r\mathrm{e}^{\mathrm{i}\theta}}$. En séparant parties réelle et imaginaire, en déduire 
    $$\Re\varphi(r) = -\frac{1}{2}\ln(1 - 2r\cos\theta + r^{2}), \qquad \Im\varphi(r) = \operatorname{Arctan}\frac{r\sin\theta}{1 - r\cos\theta}.$$

    **3.** À l'aide du théorème d'Abel radial, en déduire 
    $$\sum_{n = 1}^{+\infty} \frac{\cos(n\theta)}{n} = -\ln\Big(2\sin\frac{\theta}{2}\Big), \qquad \sum_{n = 1}^{+\infty} \frac{\sin(n\theta)}{n} = \frac{\pi - \theta}{2}.$$

    La seconde formule est la série d'Abel de l'introduction du chapitre 8, dont le chapitre 11 donnera une autre preuve.
  corrige: |
    **1.** Le rayon vaut $1$ ; en $z = 1$, la série harmonique diverge. 
    $$\boxed{\text{domaine : } \{|z| \leqslant 1\} \setminus \{1\}}$$

    **2.** La fonction $\varphi$ est la somme de la série entière $\sum \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n}r^{n}$ de la variable réelle $r$, de rayon $1$. Par le théorème 3, 
    $$\varphi'(r) = \sum_{n \geqslant 1} \mathrm{e}^{\mathrm{i} n\theta}r^{n - 1} = \frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - r\mathrm{e}^{\mathrm{i}\theta}} = \frac{\mathrm{e}^{\mathrm{i}\theta} - r}{1 - 2r\cos\theta + r^{2}}.$$
     La partie réelle $\frac{\cos\theta - r}{1 - 2r\cos\theta + r^{2}}$ est la dérivée de $-\frac{1}{2}\ln(1 - 2r\cos\theta + r^{2})$. Pour la partie imaginaire, $u(r) = \frac{r\sin\theta}{1 - r\cos\theta}$ est bien définie, car $r\cos\theta < 1$, et 
    $$\frac{u'(r)}{1 + u(r)^{2}} = \frac{\sin\theta/(1 - r\cos\theta)^{2}}{(1 - 2r\cos\theta + r^{2})/(1 - r\cos\theta)^{2}} = \frac{\sin\theta}{1 - 2r\cos\theta + r^{2}}.$$
     Les deux fonctions sont nulles en $r = 0$, comme $\varphi$. 
    $$\boxed{\Re\varphi(r) = -\frac{1}{2}\ln(1 - 2r\cos\theta + r^{2}), \qquad \Im\varphi(r) = \operatorname{Arctan}\frac{r\sin\theta}{1 - r\cos\theta}}$$

    **3.** Les séries $\sum \frac{\cos(n\theta)}{n}$ et $\sum \frac{\sin(n\theta)}{n}$ convergent, comme parties réelle et imaginaire d'une série convergente (question 1). Le théorème 5, appliqué à chacune des deux séries entières réelles en $r$, donne les limites en $r \to 1^{-}$. Comme $2 - 2\cos\theta = 4\sin^{2}\frac{\theta}{2}$ et $\sin\frac{\theta}{2} > 0$, puis $\frac{\sin\theta}{1 - \cos\theta} = \operatorname{cotan}\frac{\theta}{2} = \tan\big(\frac{\pi}{2} - \frac{\theta}{2}\big)$ avec $\frac{\pi}{2} - \frac{\theta}{2} \in \big]-\frac{\pi}{2}, \frac{\pi}{2}\big[$, 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\cos(n\theta)}{n} = -\ln\Big(2\sin\frac{\theta}{2}\Big), \qquad \sum_{n = 1}^{+\infty} \frac{\sin(n\theta)}{n} = \frac{\pi - \theta}{2}}$$
     Pour $\theta = 1{,}1$, on trouve numériquement $-0{,}04438$ et $1{,}02080$ pour les deux sommes, en accord avec les formules.
- id: "mp-09-14"
