  page_enonce: 8
  page_corrige: 17
  enonce: |
    Développer en série entière $x \mapsto \sqrt{\dfrac{1 + x}{1 - x}}$ sur $]-1, 1[$. On écrira $\sqrt{\frac{1 + x}{1 - x}} = \frac{1 + x}{\sqrt{1 - x^{2}}}$.
  corrige: |
    On multiplie le développement de $(1 - x^{2})^{-1/2}$ (exercice 27 (j)) par $1 + x$. 
    $$\boxed{\sqrt{\frac{1 + x}{1 - x}} = \sum_{n \geqslant 0} \frac{\binom{2n}{n}}{4^{n}}\big(x^{2n} + x^{2n + 1}\big), \quad R = 1}$$
- id: "mp-09-33"
  feuille: "f-mp-09"
  numero: 33
  partie: "Fonctions développables en série entière"
  etoiles: 2
