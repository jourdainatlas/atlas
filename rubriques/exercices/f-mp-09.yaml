  enonce: |
    *Perspective : définir $\pi$ par les séries.* On *définit* ici $\cos$ et $\sin$ sur $\mathbb{R}$ par leurs séries entières (cours, section 9.3), sans utiliser les fonctions de MPSI.

    **1.** Montrer que $\cos' = -\sin$, $\sin' = \cos$, et $\cos^{2} + \sin^{2} = 1$.

    **2.** Montrer que $\cos 2 \leqslant 1 - 2 + \frac{2}{3} < 0$, en utilisant le critère des séries alternées à partir d'un rang convenable.

    **3.** En déduire que $\cos$ admet un plus petit zéro $x_{0}$ dans $]0, 2[$. On *définit* alors $\pi = 2x_{0}$.

    **4.** Montrer que $\sin$ est strictement croissante sur $\big[0, \frac{\pi}{2}\big]$, et que $\sin\frac{\pi}{2} = 1$.

    **5.** À l'aide de $\mathrm{e}^{\mathrm{i}(a + b)} = \mathrm{e}^{\mathrm{i} a}\mathrm{e}^{\mathrm{i} b}$, montrer que $\cos\big(x + \frac{\pi}{2}\big) = -\sin x$ et $\sin\big(x + \frac{\pi}{2}\big) = \cos x$, puis que $\cos$ et $\sin$ sont $2\pi$-périodiques.
  corrige: |
    **1.** Par dérivation terme à terme (théorème 3), $\cos' = \sum_{n \geqslant 1} (-1)^{n}\frac{x^{2n - 1}}{(2n - 1)!} = -\sin$ et $\sin' = \cos$. Alors $(\cos^{2} + \sin^{2})' = -2\cos\sin + 2\sin\cos = 0$, et la valeur en $0$ est $1$.

    **2.** Les termes $t_{n} = \frac{4^{n}}{(2n)!}$ valent $1$, $2$, $\frac{2}{3}$, $\frac{4}{45}$, …, et décroissent à partir de $n = 1$, car 
    $$\frac{t_{n + 1}}{t_{n}} = \frac{4}{(2n + 1)(2n + 2)} < 1 \quad (n \geqslant 1).$$
     La série alternée $\sum_{n \geqslant 1} (-1)^{n}t_{n}$ a une somme comprise entre ses deux premières sommes partielles, $-2$ et $-2 + \frac{2}{3}$. 
    $$\boxed{\cos 2 \leqslant 1 - 2 + \frac{2}{3} = -\frac{1}{3} < 0}$$

    **3.** L'ensemble des zéros de $\cos$ dans $[0, 2]$ est non vide, par le théorème des valeurs intermédiaires, et fermé, par continuité ; sa borne inférieure $x_{0}$ est donc un zéro, et $x_{0} > 0$ car $\cos 0 = 1$. C'est le plus petit zéro positif, et $\cos > 0$ sur $[0, x_{0}[$.

    **4.** On a $\sin' = \cos > 0$ sur $\big[0, \frac{\pi}{2}\big[$ : $\sin$ y est strictement croissante, donc $\sin\frac{\pi}{2} > \sin 0 = 0$, et $\sin^{2}\frac{\pi}{2} = 1 - \cos^{2}\frac{\pi}{2} = 1$. 
    $$\boxed{\sin\frac{\pi}{2} = 1}$$

    **5.** Pour $a$ réel, $\mathrm{e}^{\mathrm{i} a} = \cos a + \mathrm{i}\sin a$ (proposition 6), avec $\cos a$ et $\sin a$ réels. Ainsi $\mathrm{e}^{\mathrm{i}\pi/2} = \mathrm{i}$, et 
    $$\cos\Big(x + \frac{\pi}{2}\Big) + \mathrm{i}\sin\Big(x + \frac{\pi}{2}\Big) = \mathrm{e}^{\mathrm{i} x}\mathrm{e}^{\mathrm{i}\pi/2} = \mathrm{i}\cos x - \sin x.$$
     En identifiant parties réelle et imaginaire, puis en appliquant quatre fois ces formules : 
    $$\boxed{\cos\Big(x + \frac{\pi}{2}\Big) = -\sin x, \quad \sin\Big(x + \frac{\pi}{2}\Big) = \cos x, \quad \cos \text{ et } \sin \text{ sont } 2\pi\text{-périodiques}}$$
     On a ainsi construit $\pi$ et les fonctions circulaires sans géométrie ; il resterait à montrer que $2\pi$ est la plus petite période, et que $t \mapsto \mathrm{e}^{\mathrm{i} t}$ parcourt le cercle unité.
- id: "mp-09-48"
  feuille: "f-mp-09"
