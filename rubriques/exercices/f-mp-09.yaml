  source: "BibM@th, Séries entières, exercice 36"
  page_enonce: 12
  page_corrige: 26
  enonce: |
    *Théorème de Bernstein.* Soit $a > 0$ et $f \in \mathcal{C}^{\infty}(]-a, a[, \mathbb{R})$ telle que $f^{(n)}(x) \geqslant 0$ pour tout $n \in \mathbb{N}$ et tout $x \in [0, a[$.

    **1.** Pour $x \in [0, a[$, on note $\displaystyle R_{n}(x) = f(x) - \sum_{k = 0}^{n} \frac{f^{(k)}(0)}{k!}x^{k}$. Montrer, par la formule de Taylor avec reste intégral et le changement de variable $t = xu$, que 
    $$R_{n}(x) = \frac{x^{n + 1}}{n!}\int_{0}^{1} (1 - u)^{n}f^{(n + 1)}(xu)\,\mathrm{d} u.$$

    **2.** Soit $0 \leqslant x < y < a$. Montrer que $0 \leqslant R_{n}(x) \leqslant \big(\frac{x}{y}\big)^{n + 1}R_{n}(y) \leqslant \big(\frac{x}{y}\big)^{n + 1}f(y)$.

    **3.** En déduire que la série de Taylor de $f$ en $0$ converge vers $f(x)$ pour tout $x \in [0, a[$, et que son rayon est au moins $a$.

    **4.** *Application.* Montrer que les dérivées successives de $\tan$ sont des polynômes en $\tan$ à coefficients positifs. En déduire que $\tan$ est développable en série entière sur $\big]-\frac{\pi}{2}, \frac{\pi}{2}\big[$, en utilisant son imparité pour traiter $x < 0$.
  corrige: |
    **1.** La formule de Taylor avec reste intégral s'écrit $R_{n}(x) = \int_{0}^{x} \frac{(x - t)^{n}}{n!}f^{(n + 1)}(t)\,\mathrm{d} t$ ; le changement de variable $t = xu$, $\mathrm{d} t = x\,\mathrm{d} u$, donne la formule de l'énoncé.

    **2.** Comme $f^{(n + 1)} \geqslant 0$ sur $[0, a[$, $R_{n}(x) \geqslant 0$. Comme $f^{(n + 2)} \geqslant 0$, $f^{(n + 1)}$ est croissante, donc $f^{(n + 1)}(xu) \leqslant f^{(n + 1)}(yu)$ et $\frac{R_{n}(x)}{x^{n + 1}} \leqslant \frac{R_{n}(y)}{y^{n + 1}}$. Enfin $R_{n}(y) = f(y) - \sum_{k \leqslant n} \frac{f^{(k)}(0)}{k!}y^{k} \leqslant f(y)$, les termes de la somme étant positifs. 
    $$\boxed{0 \leqslant R_{n}(x) \leqslant \Big(\frac{x}{y}\Big)^{n + 1}R_{n}(y) \leqslant \Big(\frac{x}{y}\Big)^{n + 1}f(y)}$$

    **3.** Pour $x \in [0, a[$, on choisit $y \in ]x, a[$ : $R_{n}(x) \to 0$ géométriquement, et la série de Taylor converge vers $f(x)$. Elle converge en tout point de $[0, a[$, donc son rayon est au moins $a$ (théorème 1). 
    $$\boxed{f(x) = \sum_{n = 0}^{+\infty} \frac{f^{(n)}(0)}{n!}x^{n} \ \text{ sur } [0, a[, \qquad R \geqslant a}$$

    **4.** On a $\tan' = 1 + \tan^{2}$ ; si $\tan^{(n)} = P_{n}(\tan)$ avec $P_{n}$ à coefficients positifs, alors 
    $$\tan^{(n + 1)} = P_{n}'(\tan)\,(1 + \tan^{2}),$$
     et $P_{n}'(X)(1 + X^{2})$ est encore à coefficients positifs. Sur $\big[0, \frac{\pi}{2}\big[$, $\tan \geqslant 0$, donc toutes les dérivées y sont positives, et le théorème de Bernstein, avec $a = \frac{\pi}{2}$, donne le développement sur $\big[0, \frac{\pi}{2}\big[$, avec un rayon au moins $\frac{\pi}{2}$. Comme $\tan$ est impaire, ses dérivées paires sont nulles en $0$ et sa série de Taylor $T$ est impaire : pour $x \in \big]-\frac{\pi}{2}, 0\big[$, $T(x) = -T(-x) = -\tan(-x) = \tan x$. 
    $$\boxed{\tan \text{ est développable en série entière sur } \big]-\tfrac{\pi}{2}, \tfrac{\pi}{2}\big[}$$
     Le rayon vaut exactement $\frac{\pi}{2}$, puisque $\tan$ tend vers l'infini en $\frac{\pi}{2}$ alors que la somme d'une série de rayon plus grand y serait continue.
