  enonce: |
    *Surjections.* Pour $n$, $p \in \mathbb{N}^{*}$, on note $s_{p, n}$ le nombre de surjections de $\displaystyle \llbracket 1\,,n \rrbracket$ sur $\displaystyle \llbracket 1\,,p \rrbracket$, et $\displaystyle S_{p}(z) = \sum_{n \geqslant 1} \frac{s_{p, n}}{n!}z^{n}$.

    **1.** Que vaut $s_{p, n}$ pour $p > n$ ? Montrer que $s_{p, n} \leqslant p^{n}$, et en déduire que $S_{p}$ est définie sur $\mathbb{C}$.

    **2.** Montrer que $\displaystyle s_{p + 1, n} = \sum_{k = 1}^{n} \binom{n}{k}s_{p, n - k}$, avec la convention $s_{p, 0} = 0$.

    **3.** En déduire $S_{p}(z) = (\mathrm{e}^{z} - 1)^{p}$, puis $\displaystyle s_{p, n} = \sum_{k = 0}^{p} (-1)^{p - k}\binom{p}{k}k^{n}$.
  corrige: |
    **1.** Pour $p > n$, aucune application de $\llbracket 1\,,n \rrbracket$ dans $\llbracket 1\,,p \rrbracket$ n'est surjective : $s_{p, n} = 0$. Une surjection est en particulier une application : $s_{p, n} \leqslant p^{n}$, d'où $\big|\frac{s_{p, n}}{n!}z^{n}\big| \leqslant \frac{|pz|^{n}}{n!}$. 
    $$\boxed{s_{p, n} = 0 \ (p > n), \qquad R = +\infty}$$

    **2.** On classe les surjections sur $\llbracket 1\,,p + 1 \rrbracket$ selon l'ensemble des antécédents de $p + 1$, non vide, de cardinal $k$ : on le choisit de $\binom{n}{k}$ façons, et la restriction aux $n - k$ autres éléments est une surjection sur $\llbracket 1\,,p \rrbracket$, ce qui est impossible si $n - k = 0$, d'où la convention $s_{p, 0} = 0$.

    **3.** La relation de la question 2 est celle d'un produit de Cauchy : $S_{p + 1}(z) = (\mathrm{e}^{z} - 1)S_{p}(z)$, et $S_{1}(z) = \sum_{n \geqslant 1} \frac{z^{n}}{n!} = \mathrm{e}^{z} - 1$. En développant par la formule du binôme, $(\mathrm{e}^{z} - 1)^{p} = \sum_{k} \binom{p}{k}(-1)^{p - k}\mathrm{e}^{kz}$, puis en identifiant les coefficients de $z^{n}$ : 
    $$\boxed{S_{p}(z) = (\mathrm{e}^{z} - 1)^{p}, \qquad s_{p, n} = \sum_{k = 0}^{p} (-1)^{p - k}\binom{p}{k}k^{n}}$$
     Par exemple, $s_{3, 4} = 81 - 3 \cdot 16 + 3 = 36$, et $s_{3, 3} = 6 = 3!$, comme il se doit.
- id: "mp-09-45"
  feuille: "f-mp-09"
  numero: 45
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, rayon de convergence, développements usuels]
  noeuds: [cx-series-entieres, as-usuels]
  notions: [serie-entiere]
  source: "exercice composé pour la feuille (Vrai ou faux) ; BibM@th, Séries entières, exercice 1"
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Les séries $\sum a_{n}z^{n}$ et $\sum b_{n}z^{n}$ ont pour rayons $R_{a}$ et $R_{b}$.

    **1.** Si $R_{a} = R_{b}$, alors $\sum (a_{n} + b_{n})z^{n}$ a pour rayon $R_{a}$.

    **2.** Les séries $\sum a_{n}z^{n}$ et $\sum (-1)^{n}a_{n}z^{n}$ ont le même rayon.

    **3.** Si $\sum a_{n}$ converge, alors $R_{a} \geqslant 1$.

    **4.** Si $\sum a_{n}$ diverge, alors $R_{a} < 1$.

    **5.** La somme d'une série entière de rayon $R > 0$ est de classe $\mathcal{C}^{\infty}$ sur $]-R, R[$.

    **6.** Une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$ est développable en série entière au voisinage de $0$.

    **7.** Si $a_{n} \sim b_{n}$, alors $R_{a} = R_{b}$.

    **8.** Si $\sum a_{n}R_{a}^{n}$ converge, alors $\sum a_{n}x^{n}$ converge normalement sur $[0, R_{a}]$.

    **9.** Une série entière de rayon infini converge uniformément sur tout disque fermé de centre $0$.

    **10.** Si $f$ est développable en série entière sur $]-1, 1[$, alors $f'$ l'est aussi, sur le même intervalle.
  corrige: |
    **1.** **Faux** : avec $b_{n} = -a_{n}$, la série somme est nulle, de rayon infini. La proposition 4 ne garantit l'égalité que si $R_{a} \neq R_{b}$.

    **2.** **Vrai** : les coefficients ont le même module, et le rayon ne dépend que des modules.

    **3.** **Vrai** : $(a_{n})$ tend vers $0$, donc est bornée, et $1$ appartient à l'ensemble dont $R_{a}$ est la borne supérieure.

    **4.** **Faux** : pour $a_{n} = 1$, $\sum a_{n}$ diverge et $R_{a} = 1$. On peut seulement affirmer $R_{a} \leqslant 1$.

    **5.** **Vrai** : théorème 3.

    **6.** **Faux** : la fonction $\mathrm{e}^{-1/x^{2}}$ du cours, ou celle de l'exercice 38.

    **7.** **Vrai** : proposition 2 (ii).

    **8.** **Faux** : pour $\sum (-1)^{n}\frac{x^{n}}{n}$, de rayon $1$, la série converge en $1$, mais $\sup_{[0, 1]} \frac{x^{n}}{n} = \frac{1}{n}$ n'est pas sommable.

    **9.** **Vrai** : théorème 2, tout rayon $r$ étant strictement inférieur à $R = +\infty$.

    **10.** **Vrai** : proposition 7 et théorème 3.

    $$\boxed{\text{vraies : 2, 3, 5, 7, 9, 10 ; \quad fausses : 1, 4, 6, 8}}$$
