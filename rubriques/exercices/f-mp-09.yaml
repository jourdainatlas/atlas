  source: "Séries entières (Prost, LLG), exercice 20"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    On pose $\displaystyle f(x) = \sum_{n \geqslant 1} \frac{x^{n}}{\sqrt{n}}$.

    **1.** Déterminer le rayon $R$, et étudier la convergence en $1$ et en $-1$.

    **2.** Établir la continuité de $f$ en $-1$.

    **3.** Montrer que $f(x) \to +\infty$ quand $x \to 1^{-}$, en minorant $f(x)$ par une somme partielle.
  corrige: |
    **1.** Par la proposition 2 (iii), $R = 1$. En $1$, la série de Riemann diverge ; en $-1$, la série alternée converge.

    **2.** Pour $x \in [-1, 0]$, la série est alternée, de terme $\frac{|x|^{n}}{\sqrt{n}}$ décroissant vers $0$ ; son reste vérifie $|R_{n}(x)| \leqslant \frac{|x|^{n + 1}}{\sqrt{n + 1}} \leqslant \frac{1}{\sqrt{n + 1}}$. La convergence est uniforme sur $[-1, 0]$, et $f$ y est continue (chapitre 8). 
    $$\boxed{f \text{ est continue en } -1}$$

    **3.** Pour $x \in ]0, 1[$ et $N$ fixé, les termes étant positifs, $f(x) \geqslant \sum_{n = 1}^{N} \frac{x^{n}}{\sqrt{n}} \to \sum_{n = 1}^{N} \frac{1}{\sqrt{n}}$, somme partielle d'une série divergente à termes positifs, donc aussi grande que l'on veut. 
    $$\boxed{f(x) \xrightarrow[x \to 1^{-}]{} +\infty}$$
- id: "mp-09-22"
  feuille: "f-mp-09"
  numero: 22
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [régularité de la somme]
  noeuds: [cx-derivation-series]
  notions: []
  source: "Séries entières (Prost, LLG), exercice 21"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    On considère la série entière $\displaystyle \sum_{n \geqslant 1} \ln\big(1 + \frac{1}{n}\big)x^{n}$, de somme $f$.

    **1.** Déterminer son domaine de convergence.

    **2.** Montrer que la série converge uniformément sur $[-1, 0]$. Qu'en conclure ?

    **3.** On pose $b_{0} = 0$ et $b_{n} = \ln\big(1 + \frac{1}{n}\big)$ pour $n \geqslant 1$. Montrer que $\displaystyle (1 - x)f(x) = \sum_{n \geqslant 1} (b_{n} - b_{n - 1})x^{n}$ pour $|x| < 1$, et en déduire la limite de $(1 - x)f(x)$ quand $x \to 1^{-}$.
  corrige: |
    **1.** On a $b_{n} = \ln(1 + \frac{1}{n}) \sim \frac{1}{n}$ : $R = 1$. En $1$, la série diverge ; en $-1$, $(b_{n})$ décroît vers $0$ et la série alternée converge. 
    $$\boxed{D = [-1, 1[}$$

    **2.** Pour $x \in [-1, 0]$, le critère des séries alternées donne $|R_{n}(x)| \leqslant b_{n + 1}|x|^{n + 1} \leqslant b_{n + 1}$, indépendamment de $x$ : la convergence est uniforme, et $f$ est continue sur $[-1, 0]$, en particulier en $-1$. Le théorème d'Abel radial, appliqué à $x \mapsto f(-x)$, donnait la même conclusion. 
    $$\boxed{f(x) \xrightarrow[x \to -1^{+}]{} f(-1) = \sum_{n \geqslant 1} (-1)^{n}\ln\Big(1 + \frac{1}{n}\Big)}$$
     La formule de Wallis (MPSI) permet de calculer cette valeur : les sommes partielles d'ordre pair valent $\ln\prod_{k = 1}^{N} \frac{(2k - 1)(2k + 1)}{(2k)^{2}} \to \ln\frac{2}{\pi}$, valeur vérifiée numériquement.

    **3.** Le produit par $1 - x$ décale les coefficients : 
    $$(1 - x)f(x) = \sum_{n \geqslant 1} b_{n}x^{n} - \sum_{n \geqslant 1} b_{n}x^{n + 1} = \sum_{n \geqslant 1} (b_{n} - b_{n - 1})x^{n}.$$
     La série $\sum (b_{n} - b_{n - 1})$ est télescopique, de sommes partielles $b_{N} \to 0$ ; elle converge vers $0$, et le théorème 5 s'applique. 
    $$\boxed{(1 - x)f(x) \xrightarrow[x \to 1^{-}]{} 0}$$
- id: "mp-09-23"
