  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Rayon de convergence sans règle de calcul.* Déterminer le rayon de convergence de $\sum a_{n}z^{n}$ lorsque :

    **1.** $(a_{n})$ converge vers un réel $\ell \neq 0$ ;

    **2.** $(a_{n})$ est périodique et non nulle ;

    **3.** $a_{n}$ est le nombre de diviseurs positifs de $n$, pour $n \geqslant 1$ ;

    **4.** $a_{n}$ est la $n$-ième décimale de $\sqrt{2}$.
  corrige: |
    **1.** Si $a_{n} \to \ell \neq 0$, alors $a_{n} \sim \ell$, et la proposition 2 (ii) compare à $\sum \ell z^{n}$ : $\boxed{R = 1}$.

    **2.** Une suite périodique non nulle est bornée, donc $R \geqslant 1$, et ne tend pas vers $0$, car elle prend une infinité de fois une même valeur non nulle : $\boxed{R = 1}$.

    **3.** On a $1 \leqslant d(n) \leqslant n$, et les séries $\sum z^{n}$ et $\sum nz^{n}$ ont pour rayon $1$ : $\boxed{R = 1}$.

    **4.** Les décimales sont bornées par $9$, donc $R \geqslant 1$. Elles sont des entiers : si elles tendaient vers $0$, elles seraient nulles à partir d'un certain rang, et $\sqrt{2}$ aurait un développement décimal fini, donc serait rationnel. Elles ne tendent donc pas vers $0$ : $\boxed{R = 1}$.
- id: "mp-09-06"
  feuille: "f-mp-09"
  numero: 6
  partie: "Entraînement : rayon et domaine de convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [rayon de convergence]
  noeuds: [cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 3 ; BibM@th, Séries entières, exercice 8"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $\sum a_{n}z^{n}$ de rayon $R > 0$, et $R'$ le rayon de $\sum b_{n}z^{n}$, où $b_{n} = \frac{a_{n}}{1 + |a_{n}|}$.

    **1.** Comparer $|a_{n}|$ et $|b_{n}|$, et en déduire que $R' \geqslant \max(1, R)$.

    **2.** En distinguant les cas $R' = 1$ et $R' > 1$, et en exprimant $|a_{n}|$ en fonction de $|b_{n}|$, montrer que $R' = \max(1, R)$.
  corrige: |
    **1.** On compare les modules : $|b_{n}| = \frac{|a_{n}|}{1 + |a_{n}|}$ est majoré à la fois par $|a_{n}|$ et par $1$. Par la proposition 2, $R' \geqslant R$ et $R' \geqslant 1$. 
    $$\boxed{R' \geqslant \max(1, R)}$$

    **2.** Comme $|b_{n}| < 1$, on peut inverser la relation : $|a_{n}| = \frac{|b_{n}|}{1 - |b_{n}|}$. Si $R' = 1$, l'inégalité de la question 1 donne $\max(1, R) \leqslant 1 = R'$, d'où l'égalité. Si $R' > 1$, la série $\sum b_{n}$ converge absolument, donc $b_{n} \to 0$ et $|a_{n}| \leqslant 2|b_{n}|$ à partir d'un certain rang : $R \geqslant R'$, et $R' \leqslant R \leqslant \max(1, R)$. 
    $$\boxed{R' = \max(1, R)}$$
- id: "mp-09-07"
  feuille: "f-mp-09"
  numero: 7
  partie: "Entraînement : rayon et domaine de convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [rayon de convergence]
  noeuds: [cx-series-entieres]
  notions: [serie-entiere]
  source: "BibM@th, Séries entières, exercice 11"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $\sum a_{n}z^{n}$ de rayon $R > 0$, et $\displaystyle S_{n} = \sum_{k = 0}^{n} a_{k}$.

    **1.** Montrer que $\sum S_{n}z^{n}$ a un rayon au moins égal à $\min(1, R)$, et que, pour $|z| < \min(1, R)$, 
    $$\sum_{n = 0}^{+\infty} S_{n}z^{n} = \frac{1}{1 - z}\sum_{n = 0}^{+\infty} a_{n}z^{n}.$$

    **2.** Donner un exemple où le rayon de $\sum S_{n}z^{n}$ est strictement supérieur à $\min(1, R)$.
  corrige: |
    **1.** La suite $(S_{n})$ est le produit de Cauchy de $(a_{n})$ et de la suite constante égale à $1$ : $S_{n} = \sum_{k = 0}^{n} a_{k} \cdot 1$. La proposition 4 (iii), appliquée à $\sum a_{n}z^{n}$ et à $\sum z^{n}$, de rayons $R$ et $1$, donne 
    $$\boxed{R_{S} \geqslant \min(1, R), \qquad \sum_{n = 0}^{+\infty} S_{n}z^{n} = \frac{1}{1 - z}\sum_{n = 0}^{+\infty} a_{n}z^{n}}$$

    **2.** Avec $a_{0} = 1$, $a_{1} = -1$ et $a_{n} = 0$ pour $n \geqslant 2$, on a $R = +\infty$, $S_{0} = 1$ et $S_{n} = 0$ pour $n \geqslant 1$. 
    $$\boxed{R_{S} = +\infty > 1 = \min(1, R)}$$
     Ici, la somme $1 - z$ s'annule en $z = 1$ et compense la division par $1 - z$.
- id: "mp-09-08"
  feuille: "f-mp-09"
  numero: 8
  partie: "Entraînement : calcul de sommes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [calcul de sommes, rayon de convergence, dérivation et intégration terme à terme, développements usuels]
  noeuds: [cx-series-entieres, as-usuels, cx-derivation-series]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercices 5 et 6 ; BibM@th, Séries entières, exercices 25 et 26"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Déterminer le rayon de convergence, puis la somme, des séries entières de la variable réelle suivantes. On reconnaîtra des développements usuels, éventuellement après dérivation, intégration ou décomposition du coefficient.

    ```tableau
    (a) $\displaystyle\sum_{n \geqslant 0} \frac{n + 1}{n!}x^{n}$ ; ¦ (b) $\displaystyle\sum_{n \geqslant 0} \frac{x^{n}}{(2n)!}$ ; ¦ (c) $\displaystyle\sum_{n \geqslant 0} \frac{x^{n}}{2n + 1}$ ;
    (d) $\displaystyle\sum_{n \geqslant 1} \frac{x^{n}}{n(n + 1)}$ ; ¦ (e) $\displaystyle\sum_{n \geqslant 0} (n^{2} + n + 1)x^{n}$ ; ¦ (f) $\displaystyle\sum_{n \geqslant 0} \frac{n^{2} + 1}{n!}x^{n}$ ;
    (g) $\displaystyle\sum_{n \geqslant 0} \frac{x^{3n}}{(3n)!}$ ; ¦ (h) $\displaystyle\sum_{n \geqslant 0} \operatorname{ch}(n)\,x^{n}$ ; ¦ (i) $\displaystyle\sum_{n \geqslant 0} \cos\Big(\frac{2n\pi}{3}\Big)x^{n}$ ;
    (j) $\displaystyle\sum_{n \geqslant 2} \frac{(-1)^{n}}{n(n - 1)}x^{n}$ ; ¦ (k) $\displaystyle\sum_{n \geqslant 0} \frac{n}{n + 1}x^{n}$ ; ¦ (l) $\displaystyle\sum_{n \geqslant 0} \frac{x^{4n}}{(4n)!}$.
    ```

    Pour (b) et (c), on distinguera $x > 0$ et $x < 0$. Pour (g) et (l), on pourra introduire $j = \mathrm{e}^{2\mathrm{i}\pi/3}$ et $\mathrm{i}$, et utiliser $\displaystyle \sum_{k = 0}^{2} j^{kn} = 3$ si $3 \mid n$, $0$ sinon.
  corrige: |
    On donne le rayon, puis la somme, obtenue à partir des développements du théorème 4 du cours.

    **(a)** $R = +\infty$. On sépare $\frac{n + 1}{n!} = \frac{n}{n!} + \frac{1}{n!}$, et $\sum_{n \geqslant 1} \frac{x^{n}}{(n - 1)!} = x\mathrm{e}^{x}$. 
    $$\boxed{\sum_{n \geqslant 0} \frac{n + 1}{n!}x^{n} = (1 + x)\mathrm{e}^{x}}$$

    **(b)** $R = +\infty$. Pour $x = y^{2} \geqslant 0$, on reconnaît $\operatorname{ch} y$ ; pour $x = -y^{2} < 0$, on reconnaît $\cos y$. 
    $$\boxed{\operatorname{ch}\sqrt{x} \ (x \geqslant 0), \qquad \cos\sqrt{-x} \ (x < 0)}$$

    **(c)** $R = 1$. Pour $x = y^{2} \in ]0, 1[$, la série vaut $\frac{1}{y}\sum \frac{y^{2n + 1}}{2n + 1} = \frac{1}{2y}\ln\frac{1 + y}{1 - y}$ (exercice 27 (h)) ; pour $x = -y^{2} \in ]-1, 0[$, elle vaut $\frac{1}{y}\sum (-1)^{n}\frac{y^{2n + 1}}{2n + 1} = \frac{\operatorname{Arctan} y}{y}$ ; elle vaut $1$ en $0$. 
    $$\boxed{\frac{1}{2\sqrt{x}}\ln\frac{1 + \sqrt{x}}{1 - \sqrt{x}} \ (0 < x < 1), \qquad \frac{\operatorname{Arctan}\sqrt{-x}}{\sqrt{-x}} \ (-1 < x < 0)}$$

    **(d)** $R = 1$. Avec $\frac{1}{n(n + 1)} = \frac{1}{n} - \frac{1}{n + 1}$, $\sum_{n \geqslant 1} \frac{x^{n}}{n} = -\ln(1 - x)$ et $\sum_{n \geqslant 1} \frac{x^{n}}{n + 1} = \frac{-\ln(1 - x) - x}{x}$ pour $x \neq 0$. 
    $$\boxed{\sum_{n \geqslant 1} \frac{x^{n}}{n(n + 1)} = 1 + \frac{(1 - x)\ln(1 - x)}{x} \ \ (x \neq 0), \qquad 0 \text{ en } 0}$$

    **(e)** $R = 1$. On dérive la série géométrique : $\sum nx^{n} = \frac{x}{(1 - x)^{2}}$ et $\sum n^{2}x^{n} = \frac{x(1 + x)}{(1 - x)^{3}}$. En réduisant au même dénominateur, 
    $$\boxed{\sum_{n \geqslant 0} (n^{2} + n + 1)x^{n} = \frac{1 + x^{2}}{(1 - x)^{3}}}$$

    **(f)** $R = +\infty$. On écrit $n^{2} + 1 = n(n - 1) + n + 1$, et $\sum \frac{n(n - 1)}{n!}x^{n} = x^{2}\mathrm{e}^{x}$. 
    $$\boxed{\sum_{n \geqslant 0} \frac{n^{2} + 1}{n!}x^{n} = (x^{2} + x + 1)\mathrm{e}^{x}}$$

    **(g)** $R = +\infty$. Comme $\frac{1}{3}(1 + j^{n} + j^{2n})$ vaut $1$ si $3 \mid n$ et $0$ sinon, la somme est $\frac{1}{3}\big(\mathrm{e}^{x} + \mathrm{e}^{jx} + \mathrm{e}^{j^{2}x}\big)$, avec $j = -\frac{1}{2} + \mathrm{i}\frac{\sqrt{3}}{2}$. 
    $$\boxed{\sum_{n \geqslant 0} \frac{x^{3n}}{(3n)!} = \frac{1}{3}\Big(\mathrm{e}^{x} + 2\mathrm{e}^{-x/2}\cos\frac{\sqrt{3}\,x}{2}\Big)}$$

    **(h)** $R = \frac{1}{\mathrm{e}}$. On somme deux séries géométriques, de raisons $\mathrm{e} x$ et $\frac{x}{\mathrm{e}}$ : 
    $$\boxed{\sum_{n \geqslant 0} \operatorname{ch}(n)x^{n} = \frac{1}{2}\Big(\frac{1}{1 - \mathrm{e} x} + \frac{1}{1 - x/\mathrm{e}}\Big) = \frac{1 - x\operatorname{ch} 1}{1 - 2x\operatorname{ch} 1 + x^{2}}}$$

    **(i)** $R = 1$, la suite des coefficients étant bornée et non tendante vers $0$. On prend la partie réelle de la série géométrique de raison $jx$, avec $x$ réel : 
    $$\boxed{\sum_{n \geqslant 0} \cos\Big(\frac{2n\pi}{3}\Big)x^{n} = \Re\frac{1}{1 - jx} = \frac{1 + x/2}{1 + x + x^{2}}}$$

    **(j)** $R = 1$. La somme $f$ vérifie $f''(x) = \sum_{n \geqslant 2} (-1)^{n}x^{n - 2} = \frac{1}{1 + x}$ et $f(0) = f'(0) = 0$. 
    $$\boxed{f(x) = (1 + x)\ln(1 + x) - x}$$

    **(k)** $R = 1$. On écrit $\frac{n}{n + 1} = 1 - \frac{1}{n + 1}$ : 
    $$\boxed{\sum_{n \geqslant 0} \frac{n}{n + 1}x^{n} = \frac{1}{1 - x} + \frac{\ln(1 - x)}{x} \ \ (x \neq 0)}$$

    **(l)** $R = +\infty$. Comme $\frac{1}{4}(1 + \mathrm{i}^{n} + (-1)^{n} + (-\mathrm{i})^{n})$ vaut $1$ si $4 \mid n$ et $0$ sinon, 
    $$\boxed{\sum_{n \geqslant 0} \frac{x^{4n}}{(4n)!} = \frac{\mathrm{e}^{x} + \mathrm{e}^{\mathrm{i} x} + \mathrm{e}^{-x} + \mathrm{e}^{-\mathrm{i} x}}{4} = \frac{\operatorname{ch} x + \cos x}{2}}$$
     *Piège.* En (c), l'expression change selon le signe de $x$, et les deux formules se raccordent en $0$ avec la valeur $1$ : il ne faut pas oublier le cas $x \leqslant 0$.
- id: "mp-09-09"
  feuille: "f-mp-09"
  numero: 9
  partie: "Entraînement : calcul de sommes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [calcul de sommes, dérivation et intégration terme à terme, "théorème d'Abel"]
  noeuds: [cx-series-entieres, as-usuels, cx-derivation-series]
  notions: [serie-entiere]
  source: "exercice composé pour la feuille ; Séries entières (Prost, LLG), exercice 7"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Sommes de séries numériques.* À l'aide de séries entières bien choisies, calculer : 
    $$\text{(a) } \sum_{n = 1}^{+\infty} \frac{n^{2}}{2^{n}} ; \qquad \text{(b) } \sum_{n = 1}^{+\infty} \frac{n^{3}}{2^{n}} ; \qquad \text{(c) } \sum_{n = 0}^{+\infty} \frac{n + 1}{3^{n}\,n!} ; \qquad \text{(d) } \sum_{n = 1}^{+\infty} \frac{1}{n(n + 1)2^{n}} ; \qquad \text{(e) } \sum_{n = 1}^{+\infty} \frac{1}{n\,2^{n}}.$$
     Calculer enfin, à l'aide du théorème d'Abel radial et de l'intégrale $\displaystyle \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{3}}$, la somme $\displaystyle \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 1}$.
  corrige: |
    On évalue en un point les sommes de l'exercice 8 ou leurs variantes.

    **(a) et (b)** On dérive encore la série géométrique : $\sum n^{3}x^{n} = \frac{x(1 + 4x + x^{2})}{(1 - x)^{4}}$. En $x = \frac{1}{2}$, 
    $$\boxed{\sum_{n \geqslant 1} \frac{n^{2}}{2^{n}} = 6, \qquad \sum_{n \geqslant 1} \frac{n^{3}}{2^{n}} = 26}$$

    **(c) à (e)** On évalue $(1 + x)\mathrm{e}^{x}$ en $\frac{1}{3}$, la somme (d) de l'exercice 8 en $\frac{1}{2}$, et $-\ln(1 - x)$ en $\frac{1}{2}$ : 
    $$\boxed{\sum \frac{n + 1}{3^{n}n!} = \frac{4}{3}\mathrm{e}^{1/3}, \qquad \sum \frac{1}{n(n + 1)2^{n}} = 1 - \ln 2, \qquad \sum \frac{1}{n2^{n}} = \ln 2}$$

    **Dernière somme.** Pour $|x| < 1$, $\sum_{n \geqslant 0} (-1)^{n}\frac{x^{3n + 1}}{3n + 1} = \int_{0}^{x} \frac{\mathrm{d} t}{1 + t^{3}}$, par intégration terme à terme de $\frac{1}{1 + t^{3}} = \sum (-1)^{n}t^{3n}$. La série converge en $x = 1$ par le critère des séries alternées, et le théorème 5 donne la valeur. La décomposition 
    $$\frac{1}{1 + t^{3}} = \frac{1}{3(1 + t)} - \frac{1}{6}\cdot\frac{2t - 1}{t^{2} - t + 1} + \frac{1}{2}\cdot\frac{1}{(t - \frac{1}{2})^{2} + \frac{3}{4}}$$
     s'intègre sur $[0, 1]$ en $\frac{\ln 2}{3} - 0 + \frac{1}{2} \cdot \frac{2}{\sqrt{3}}\Big(\frac{\pi}{6} + \frac{\pi}{6}\Big)$. 
    $$\boxed{\sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 1} = \frac{\ln 2}{3} + \frac{\pi}{3\sqrt{3}} \approx 0{,}8356}$$
- id: "mp-09-10"
  feuille: "f-mp-09"
  numero: 10
  partie: "Entraînement : calcul de sommes"
  etoiles: 2
  types: [Calcul]
