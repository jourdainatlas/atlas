  enonce: |
    Montrer que $\operatorname{ch} x \leqslant \mathrm{e}^{x^{2}/2}$ pour tout réel $x$, en comparant les développements en série entière des deux membres.
  corrige: |
    Les deux membres sont développables sur $\mathbb{R}$ : $\operatorname{ch} x = \sum \frac{x^{2n}}{(2n)!}$ et $\mathrm{e}^{x^{2}/2} = \sum \frac{x^{2n}}{2^{n}n!}$. Or 
    $$(2n)! = \prod_{k = 1}^{n} (2k - 1)(2k) \geqslant \prod_{k = 1}^{n} 2k = 2^{n}n!,$$
     et $x^{2n} \geqslant 0$ : on compare terme à terme. 
    $$\boxed{\operatorname{ch} x \leqslant \mathrm{e}^{x^{2}/2} \text{ pour tout } x \in \mathbb{R}}$$
- id: "mp-09-36"
  feuille: "f-mp-09"
  numero: 36
  partie: "Fonctions développables en série entière"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [développements en série entière, développements usuels, série de Taylor]
  noeuds: [as-usuels, de-taylor]
  notions: [polynome-taylor]
  source: "Séries entières (Prost, LLG), exercice 33"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $a \in ]-1, 1[$ et $\displaystyle f(x) = \sum_{n = 0}^{+\infty} \sin(a^{n}x)$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$ et que $|f^{(p)}(x)| \leqslant \frac{1}{1 - |a|}$ pour tout $x \in \mathbb{R}$ et tout $p \in \mathbb{N}^{*}$.

    **2.** En déduire, à l'aide de l'inégalité de Taylor-Lagrange, que $f$ est développable en série entière sur $\mathbb{R}$, et donner son développement.
  corrige: |
    **1.** Sur $[-A, A]$, $|\sin(a^{n}x)| \leqslant |a|^{n}A$ : convergence normale. Pour $p \geqslant 1$, la dérivée $p$-ième du terme général vaut $a^{np}\sin^{(p)}(a^{n}x)$, majorée par $|a|^{np} \leqslant |a|^{n}$ sur $\mathbb{R}$ : convergence normale de toutes les séries dérivées (théorème 6 du chapitre 8). 
    $$\boxed{f \in \mathcal{C}^{\infty}(\mathbb{R}), \qquad |f^{(p)}(x)| \leqslant \sum_{n \geqslant 0} |a|^{n} = \frac{1}{1 - |a|}}$$

    **2.** L'inégalité de Taylor-Lagrange donne $\big|f(x) - \sum_{k \leqslant n} \frac{f^{(k)}(0)}{k!}x^{k}\big| \leqslant \frac{|x|^{n + 1}}{(n + 1)!(1 - |a|)} \to 0$ pour tout $x$. Les dérivées paires de $\sin$ s'annulent en $0$, et $f^{(2k + 1)}(0) = (-1)^{k}\sum_{n} a^{n(2k + 1)} = \frac{(-1)^{k}}{1 - a^{2k + 1}}$. 
    $$\boxed{f(x) = \sum_{k \geqslant 0} \frac{(-1)^{k}x^{2k + 1}}{(2k + 1)!\,(1 - a^{2k + 1})}, \quad R = +\infty}$$
- id: "mp-09-37"
  feuille: "f-mp-09"
  numero: 37
  partie: "Fonctions développables en série entière"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développements en série entière, développements usuels]
  noeuds: [as-usuels, de-taylor]
