  enonce: |
    *Inégalités de Cauchy.* Soit $f(z) = \sum a_{n}z^{n}$ de rayon $R > 0$.

    **1.** Pour $r \in [0, R[$ et $n \in \mathbb{N}$, calculer $\displaystyle \int_{0}^{2\pi} f(r\mathrm{e}^{\mathrm{i}\theta})\mathrm{e}^{-\mathrm{i} n\theta}\,\mathrm{d}\theta$, après avoir justifié une intégration terme à terme.

    **2.** En déduire que $|a_{n}| \leqslant \frac{M(r)}{r^{n}}$, où $M(r) = \sup_{|z| = r} |f(z)|$.

    **3.** *(Théorème de Liouville.)* On suppose $R = +\infty$ et $f$ bornée sur $\mathbb{C}$. Montrer que $f$ est constante. Retrouver ainsi que $\cos$ n'est pas bornée sur $\mathbb{C}$.
  corrige: |
    **1.** Pour $r < R$, la série $\sum a_{k}r^{k}\mathrm{e}^{\mathrm{i} k\theta}\mathrm{e}^{-\mathrm{i} n\theta}$ converge normalement en $\theta \in [0, 2\pi]$, de terme majoré par $|a_{k}|r^{k}$ ; on intègre terme à terme (théorème 6 du chapitre 8), avec $\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i}(k - n)\theta}\,\mathrm{d}\theta = 2\pi\delta_{k, n}$. 
    $$\boxed{\int_{0}^{2\pi} f(r\mathrm{e}^{\mathrm{i}\theta})\mathrm{e}^{-\mathrm{i} n\theta}\,\mathrm{d}\theta = 2\pi a_{n}r^{n}}$$

    **2.** On majore l'intégrale par $2\pi M(r)$, d'où 
    $$\boxed{|a_{n}| \leqslant \frac{M(r)}{r^{n}}}$$

    **3.** Si $|f| \leqslant M$ sur $\mathbb{C}$, alors $|a_{n}| \leqslant \frac{M}{r^{n}}$ pour tout $r > 0$ ; pour $n \geqslant 1$, on fait tendre $r$ vers $+\infty$ : $a_{n} = 0$. 
    $$\boxed{f = a_{0} \text{ est constante}}$$
     La fonction $\cos$, de rayon infini et non constante, n'est donc pas bornée sur $\mathbb{C}$, ce que l'exercice 12 avait vérifié directement.
- id: "mp-09-16"
  feuille: "f-mp-09"
  numero: 16
  partie: "Somme dans le disque, exponentielle complexe"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [exponentielle complexe, séries génératrices]
  noeuds: [cx-series-entieres]
  notions: []
  source: "Séries numériques (Sainte-Geneviève), exercices 99 et 103, reportés de la feuille 6"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *Séries de Lambert.* Soit $x \in ]-1, 1[$.

    **1.** Montrer que la famille $(x^{nk})_{(n, k) \in (\mathbb{N}^{*})^{2}}$ est sommable, et en déduire, en sommant de deux façons, que 
    $$\sum_{n = 1}^{+\infty} \frac{x^{n}}{1 - x^{n}} = \sum_{m = 1}^{+\infty} d(m)x^{m},$$
     où $d(m)$ est le nombre de diviseurs positifs de $m$.

    **2.** De même, établir $\displaystyle \sum_{n \geqslant 1} \frac{nx^{n}}{1 - x^{n}} = \sum_{m \geqslant 1} \sigma(m)x^{m} = \sum_{n \geqslant 1} \frac{x^{n}}{(1 - x^{n})^{2}}$, où $\sigma(m)$ est la somme des diviseurs de $m$.

    **3.** On note $\varphi$ l'indicatrice d'Euler, et l'on admet l'identité $\displaystyle \sum_{d \mid m} \varphi(d) = m$ (arithmétique de MPSI). Montrer que $\displaystyle \sum_{n \geqslant 1} \varphi(n)\frac{x^{n}}{1 - x^{n}} = \frac{x}{(1 - x)^{2}}$, et en déduire $\displaystyle \sum_{n = 1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1} = 2$.
  corrige: |
    **1.** La somme des modules, calculée par paquets selon $n$, vaut $\sum_{n} \frac{|x|^{n}}{1 - |x|^{n}} \leqslant \frac{1}{1 - |x|}\sum_{n} |x|^{n} < +\infty$ : la famille est sommable (chapitre 20 de MPSI). On somme alors par paquets de deux façons : à $n$ fixé, $\sum_{k \geqslant 1} x^{nk} = \frac{x^{n}}{1 - x^{n}}$ ; à $m = nk$ fixé, le nombre de couples $(n, k)$ est le nombre de diviseurs $n$ de $m$. 
    $$\boxed{\sum_{n \geqslant 1} \frac{x^{n}}{1 - x^{n}} = \sum_{m \geqslant 1} d(m)x^{m}}$$

    **2.** La famille $(n\,x^{nk})$ est sommable de la même façon, puisque $\sum_{n} \frac{n|x|^{n}}{1 - |x|^{n}} < +\infty$. À $m = nk$ fixé, on obtient $\sum_{n \mid m} n = \sigma(m)$ ; à $n$ fixé, $\frac{nx^{n}}{1 - x^{n}}$. Pour la troisième forme, on somme la famille $(k\,x^{nk})$ à $n$ fixé : $\sum_{k} k(x^{n})^{k} = \frac{x^{n}}{(1 - x^{n})^{2}}$, et à $m$ fixé, $\sum_{k \mid m} k = \sigma(m)$. 
    $$\boxed{\sum_{n \geqslant 1} \frac{nx^{n}}{1 - x^{n}} = \sum_{m \geqslant 1} \sigma(m)x^{m} = \sum_{n \geqslant 1} \frac{x^{n}}{(1 - x^{n})^{2}}}$$

    **3.** Comme $\varphi(n) \leqslant n$, la famille $(\varphi(n)x^{nk})$ est sommable. À $m$ fixé, le coefficient vaut $\sum_{n \mid m} \varphi(n) = m$, d'où $\sum m x^{m} = \frac{x}{(1 - x)^{2}}$. En $x = \frac{1}{2}$, $\frac{\varphi(n)2^{-n}}{1 - 2^{-n}} = \frac{\varphi(n)}{2^{n} - 1}$. 
    $$\boxed{\sum_{n \geqslant 1} \varphi(n)\frac{x^{n}}{1 - x^{n}} = \frac{x}{(1 - x)^{2}}, \qquad \sum_{n = 1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1} = 2}$$
     La valeur $2$ a été vérifiée numériquement sur les 300 premiers termes.
- id: "mp-09-17"
  feuille: "f-mp-09"
  numero: 17
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [régularité de la somme, rayon de convergence]
  noeuds: [cx-derivation-series, cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 10"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $(u_{n})$ une suite réelle bornée, et $\displaystyle S_{n} = \sum_{k = 0}^{n} u_{k}$.

    **1.** Quel est le rayon de convergence des séries $\sum \frac{u_{n}}{n!}x^{n}$ et $\sum \frac{S_{n}}{n!}x^{n}$ ? On note $f$ et $g$ leurs sommes.

    **2.** Établir une relation entre $f'$, $g$ et $g'$, puis exprimer $g$ à l'aide de $f$ et d'une intégrale.
  corrige: |
    **1.** Si $|u_{n}| \leqslant M$, alors $|S_{n}| \leqslant (n + 1)M$, et les termes sont majorés par $\frac{M|x|^{n}}{n!}$ et $\frac{(n + 1)M|x|^{n}}{n!}$, termes de séries convergentes pour tout $x$. 
    $$\boxed{R = +\infty \text{ pour les deux séries}}$$

    **2.** On dérive terme à terme et l'on utilise $S_{n + 1} = S_{n} + u_{n + 1}$ : 
    $$g'(x) = \sum_{n \geqslant 0} \frac{S_{n + 1}}{n!}x^{n} = \sum_{n \geqslant 0} \frac{S_{n}}{n!}x^{n} + \sum_{n \geqslant 0} \frac{u_{n + 1}}{n!}x^{n} = g(x) + f'(x).$$
     Ainsi $(\mathrm{e}^{-x}g)' = \mathrm{e}^{-x}f'$ et $g(0) = u_{0} = f(0)$ ; une intégration par parties donne 
    $$\boxed{g' = g + f', \qquad g(x) = f(x) + \mathrm{e}^{x}\int_{0}^{x} \mathrm{e}^{-t}f(t)\,\mathrm{d} t}$$
- id: "mp-09-18"
  feuille: "f-mp-09"
  numero: 18
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [régularité de la somme, rayon de convergence]
  noeuds: [cx-derivation-series, cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 12"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $(a_{n})$ définie par $a_{0} = a_{1} = 1$ et $a_{n + 2} = a_{n + 1} + \frac{2a_{n}}{n + 2}$.

    **1.** Montrer par récurrence que $1 \leqslant a_{n} \leqslant (n + 1)^{2}$, et en déduire que $\sum a_{n}x^{n}$ a pour rayon $1$.

    **2.** Montrer que la somme $f$ vérifie $(1 - x)f'(x) - (2x + 1)f(x) = 0$, et en déduire $f$.
  corrige: |
    **1.** Les termes sont positifs, et la suite est croissante, d'où $a_{n} \geqslant 1$. Pour la majoration, si $a_{n} \leqslant (n + 1)^{2}$ et $a_{n + 1} \leqslant (n + 2)^{2}$, alors 
    $$a_{n + 2} \leqslant (n + 2)^{2} + \frac{2(n + 1)^{2}}{n + 2} \leqslant (n + 2)^{2} + 2(n + 1) \leqslant (n + 3)^{2}.$$
     La minoration donne $R \leqslant 1$, la majoration $R \geqslant 1$ (proposition 2). 
    $$\boxed{R = 1}$$

    **2.** On développe les deux membres, avec $a_{-1} = 0$ : 
    $$(1 - x)f' = \sum \big((n + 1)a_{n + 1} - na_{n}\big)x^{n}, \qquad (2x + 1)f = \sum (a_{n} + 2a_{n - 1})x^{n}.$$
     L'égalité des coefficients équivaut à $(n + 1)(a_{n + 1} - a_{n}) = 2a_{n - 1}$, qui est la relation de récurrence au rang $n - 1$ pour $n \geqslant 1$, et $a_{1} = a_{0}$ pour $n = 0$. L'équation $\frac{y'}{y} = \frac{2x + 1}{1 - x} = -2 + \frac{3}{1 - x}$ se résout sur $]-1, 1[$, avec $f(0) = 1$. 
    $$\boxed{f(x) = \frac{\mathrm{e}^{-2x}}{(1 - x)^{3}}}$$
- id: "mp-09-19"
  feuille: "f-mp-09"
  numero: 19
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [régularité de la somme, rayon de convergence]
  noeuds: [cx-derivation-series, cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 36 ; BibM@th, Séries entières, exercices 12, 13 et 14"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Zéros d'une série entière.* Soit $f(x) = \sum a_{n}x^{n}$ de rayon $R > 0$, à coefficients non tous nuls.

    **1.** Soit $p$ le plus petit indice tel que $a_{p} \neq 0$. Montrer que $f(x) = x^{p}g(x)$ avec $g$ continue et $g(0) \neq 0$, et en déduire que $f$ ne s'annule pas sur un voisinage épointé de $0$.

    **2.** En déduire que si $f$ s'annule en une suite de points non nuls tendant vers $0$, alors $f$ est nulle. Retrouver l'unicité des coefficients.

    **3.** Soient deux séries entières de rayons strictement positifs dont le produit des sommes est nul au voisinage de $0$. Montrer que l'une des deux est nulle.
  corrige: |
    **1.** On factorise $x^{p}$ : $g(x) = \sum_{n \geqslant p} a_{n}x^{n - p}$ est la somme d'une série entière de rayon $R$, donc continue, avec $g(0) = a_{p} \neq 0$. Par continuité, $g$ ne s'annule pas sur un intervalle $]-\eta, \eta[$, et $f(x) = x^{p}g(x) \neq 0$ pour $0 < |x| < \eta$.

    **2.** Par contraposée de la question 1, une série entière dont la somme s'annule en des points non nuls arbitrairement proches de $0$ a tous ses coefficients nuls. 
    $$\boxed{f = 0}$$
     Si deux sommes coïncident sur $]0, \alpha]$, leur différence s'annule aux points $\frac{\alpha}{k}$, et l'on retrouve la proposition 8 (ii).

    **3.** Si la première série n'est pas nulle, sa somme ne s'annule pas sur $]-\eta, \eta[ \setminus \{0\}$ ; la somme de la seconde y est donc nulle, et la question 2 conclut. 
    $$\boxed{\text{l'une des deux séries est nulle}}$$
