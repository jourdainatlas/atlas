  enonce: |
    Soit $\displaystyle f(x) = \sum_{n \geqslant 1} \sin\Big(\frac{1}{\sqrt{n}}\Big)x^{n}$.

    **1.** Déterminer le rayon de convergence, et étudier la convergence en $1$ et en $-1$.

    **2.** Montrer que $f(x) \to +\infty$ quand $x \to 1^{-}$.

    **3.** Montrer que $(1 - x)f(x) \to 0$ quand $x \to 1^{-}$. On découpera la somme en deux et l'on utilisera $\sin\frac{1}{\sqrt{n}} \to 0$.
  corrige: |
    **1.** On a $\sin\frac{1}{\sqrt{n}} \sim \frac{1}{\sqrt{n}}$ : $R = 1$. En $1$, la série diverge par comparaison avec la série de Riemann ; en $-1$, la suite $\big(\sin\frac{1}{\sqrt{n}}\big)$ décroît vers $0$, car $\sin$ croît sur $[0, 1]$, et la série alternée converge. 
    $$\boxed{R = 1, \quad D = [-1, 1[}$$

    **2.** Comme à l'exercice 21, pour $x \in ]0, 1[$, $f(x) \geqslant \sum_{n \leqslant N} \sin\frac{1}{\sqrt{n}}x^{n} \to \sum_{n \leqslant N} \sin\frac{1}{\sqrt{n}}$, aussi grand que l'on veut.

    **3.** Soit $\varepsilon > 0$ et $N$ tel que $\sin\frac{1}{\sqrt{n}} \leqslant \varepsilon$ pour $n > N$. Pour $x \in [0, 1[$, 
    $$0 \leqslant (1 - x)f(x) \leqslant (1 - x)\sum_{n = 1}^{N} 1 + \varepsilon(1 - x)\sum_{n > N} x^{n} \leqslant N(1 - x) + \varepsilon \leqslant 2\varepsilon$$
     pour $x$ assez proche de $1$. 
    $$\boxed{(1 - x)f(x) \xrightarrow[x \to 1^{-}]{} 0}$$
     Les questions 2 et 3 précisent que $f$ tend vers $+\infty$, mais moins vite que $\frac{1}{1 - x}$ ; un calcul plus fin donnerait $f(x) \sim \sqrt{\frac{\pi}{1 - x}}$.
- id: "mp-09-24"
  feuille: "f-mp-09"
  numero: 24
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [régularité de la somme, rayon de convergence]
  noeuds: [cx-derivation-series, cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 25"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $(a_{n})$ une suite réelle telle que $\sum |a_{n + 1} - a_{n}|$ converge.

    **1.** Justifier que $(a_{n})$ converge vers un réel $\ell$. Qu'en déduire sur le rayon de $\sum a_{n}x^{n}$ ?

    **2.** Montrer que $\displaystyle (1 - x)\sum_{n = 0}^{+\infty} a_{n}x^{n} \to \ell$ quand $x \to 1^{-}$. On écrira 
    $$(1 - x)\sum_{n = 0}^{+\infty} a_{n}x^{n} = a_{0} + \sum_{n = 1}^{+\infty} (a_{n} - a_{n - 1})x^{n}.$$
  corrige: |
    **1.** La série $\sum (a_{n + 1} - a_{n})$ converge absolument, donc converge, et ses sommes partielles $a_{n} - a_{0}$ ont une limite : $(a_{n})$ converge vers un réel $\ell$. Étant bornée, elle donne $R \geqslant 1$ ; si $\ell \neq 0$, on a même $R = 1$ (exercice 5).

    **2.** Le produit par $1 - x$ donne $(1 - x)\sum a_{n}x^{n} = a_{0} + \sum_{n \geqslant 1} (a_{n} - a_{n - 1})x^{n}$ pour $|x| < 1$. La série de droite converge normalement sur $[-1, 1]$, de terme majoré par $|a_{n} - a_{n - 1}|$ ; sa somme est continue en $1$ (théorème 2), et vaut $a_{0} + \sum_{n \geqslant 1} (a_{n} - a_{n - 1}) = \ell$ en $x = 1$. 
    $$\boxed{(1 - x)\sum_{n = 0}^{+\infty} a_{n}x^{n} \xrightarrow[x \to 1^{-}]{} \ell}$$
- id: "mp-09-25"
  feuille: "f-mp-09"
  numero: 25
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [régularité de la somme, rayon de convergence, développements usuels, produit de Cauchy]
  noeuds: [cx-derivation-series, cx-series-entieres, as-usuels]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercices 23 et 28 ; BibM@th, Séries entières, exercice 27"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Nombres harmoniques.*

    **1.** Montrer que $\sum H_{n}x^{n}$ a pour rayon $1$ et que, pour $|x| < 1$, $\displaystyle \sum_{n = 1}^{+\infty} H_{n}x^{n} = -\frac{\ln(1 - x)}{1 - x}$. On utilisera un produit de Cauchy.

    **2.** En appliquant l'exercice 24 à $a_{n} = H_{n} - \ln n$, montrer que 
    $$\sum_{n = 1}^{+\infty} \ln(n)\,x^{n} \underset{x \to 1^{-}}{\sim} -\frac{\ln(1 - x)}{1 - x}.$$
     On vérifiera que $\sum |a_{n + 1} - a_{n}|$ converge grâce à un développement limité.
  corrige: |
    **1.** La suite $(H_{n})$ est le produit de Cauchy de $(\frac{1}{k})_{k \geqslant 1}$, complétée par $0$ en $k = 0$, et de la suite constante $1$ : pour $|x| < 1$, $\sum H_{n}x^{n} = \big(-\ln(1 - x)\big)\cdot\frac{1}{1 - x}$, et $R \geqslant 1$. Comme $H_{n} \geqslant 1$, $R \leqslant 1$. 
    $$\boxed{R = 1, \qquad \sum_{n = 1}^{+\infty} H_{n}x^{n} = -\frac{\ln(1 - x)}{1 - x}}$$

    **2.** Avec $a_{n} = H_{n} - \ln n$ pour $n \geqslant 1$ et $a_{0} = 0$, un développement limité donne 
    $$a_{n + 1} - a_{n} = \frac{1}{n + 1} - \ln\Big(1 + \frac{1}{n}\Big) = -\frac{1}{2n^{2}} + O\Big(\frac{1}{n^{3}}\Big),$$
     terme d'une série absolument convergente. L'exercice 24 donne $(1 - x)\sum a_{n}x^{n} \to \gamma$, donc 
    $$\sum_{n \geqslant 1} \ln(n)x^{n} = -\frac{\ln(1 - x)}{1 - x} - \frac{\gamma + o(1)}{1 - x}.$$
     Comme $-\ln(1 - x) \to +\infty$, le second terme est négligeable devant le premier. 
    $$\boxed{\sum_{n = 1}^{+\infty} \ln(n)x^{n} \underset{x \to 1^{-}}{\sim} -\frac{\ln(1 - x)}{1 - x}}$$
- id: "mp-09-26"
  feuille: "f-mp-09"
  numero: 26
  partie: "Régularité de la somme et comportement au bord"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [régularité de la somme, rayon de convergence, "théorème d'Abel"]
  noeuds: [cx-derivation-series, cx-series-entieres]
  notions: [serie-entiere]
  source: "Séries entières (Prost, LLG), exercice 26"
  page_enonce: 7
  page_corrige: 13
  enonce: |
    *Un théorème taubérien.* Soit $\sum a_{n}x^{n}$ de rayon $1$, de somme $f$, telle que $f(x) \to \ell$ quand $x \to 1^{-}$ et $a_{n} = o\big(\frac{1}{n}\big)$.

    **1.** Montrer que, pour $x \in [0, 1[$ et $n \in \mathbb{N}^{*}$, 
    $$\Big|\sum_{k = 0}^{n} a_{k} - f(x)\Big| \leqslant (1 - x)\sum_{k = 0}^{n} k|a_{k}| + \frac{1}{n(1 - x)}\sup_{k > n} k|a_{k}|.$$
     On utilisera $1 - x^{k} \leqslant k(1 - x)$.

    **2.** En choisissant $x = 1 - \frac{1}{n}$, montrer que $\sum a_{n}$ converge et que sa somme vaut $\ell$.

    **3.** Montrer par un exemple que l'hypothèse $a_{n} = o(\frac{1}{n})$ ne peut pas être supprimée.

    C'est le théorème de Tauber (1897), réciproque partielle du théorème d'Abel radial.
  corrige: |
    **1.** On sépare les indices $k \leqslant n$ et $k > n$ : 
    $$\sum_{k = 0}^{n} a_{k} - f(x) = \sum_{k = 0}^{n} a_{k}(1 - x^{k}) - \sum_{k > n} a_{k}x^{k}.$$
     Avec $1 - x^{k} = (1 - x)(1 + x + \cdots + x^{k - 1}) \leqslant k(1 - x)$, la première somme est majorée par $(1 - x)\sum_{k \leqslant n} k|a_{k}|$. Pour la seconde, $|a_{k}| = \frac{k|a_{k}|}{k} \leqslant \frac{1}{n}\sup_{k > n} k|a_{k}|$, et $\sum_{k > n} x^{k} \leqslant \frac{1}{1 - x}$.

    **2.** Pour $x_{n} = 1 - \frac{1}{n}$, la majoration devient 
    $$\Big|\sum_{k = 0}^{n} a_{k} - f(x_{n})\Big| \leqslant \frac{1}{n}\sum_{k = 0}^{n} k|a_{k}| + \sup_{k > n} k|a_{k}|.$$
     Le second terme tend vers $0$ par hypothèse, le premier par le théorème de Cesàro (chapitre 6), puisque $k|a_{k}| \to 0$. Comme $f(x_{n}) \to \ell$, 
    $$\boxed{\sum_{n = 0}^{+\infty} a_{n} = \ell}$$

    **3.** Pour $a_{n} = (-1)^{n}$, $f(x) = \frac{1}{1 + x} \to \frac{1}{2}$, mais $\sum (-1)^{n}$ diverge, et $a_{n}$ n'est pas un $o(\frac{1}{n})$.
- id: "mp-09-27"
  feuille: "f-mp-09"
  numero: 27
  partie: "Fonctions développables en série entière"
  etoiles: 1
  types: [Calcul]
  mots_cles: [développements en série entière, rayon de convergence, exponentielle, dérivation et intégration terme à terme]
  noeuds: [as-usuels, de-taylor, cx-series-entieres, cx-exponentielle, cx-derivation-series, tg-arctan]
  notions: [polynome-taylor, serie-entiere, arc-tangente, cosinus-sinus]
  source: "Séries entières (Prost, LLG), exercices 30 et 31 ; BibM@th, Séries entières, exercices 22 et 24"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Développer en série entière au voisinage de $0$ les fonctions suivantes, en précisant le rayon de convergence obtenu.

    ```tableau
    (a) $\dfrac{1 + x}{2 - x}$ ; ¦ (b) $\dfrac{1}{x^{2} - 5x + 6}$ ; ¦ (c) $\ln(x^{2} - 5x + 6)$ ;
    (d) $\ln(1 + x + x^{2})$ ; ¦ (e) $\dfrac{1}{1 + x + x^{2}}$ ; ¦ (f) $\operatorname{sh} x\cos x$ ;
    (g) $\cos x\operatorname{ch} x$ ; ¦ (h) $\ln\dfrac{1 + x}{1 - x}$ ; ¦ (i) $\operatorname{Arctan}\dfrac{1 + x}{1 - x}$ ;
    (j) $\dfrac{1}{\sqrt{1 - x^{2}}}$, puis $\operatorname{Arcsin} x$ ; ¦ (k) $\ln\big(x + \sqrt{1 + x^{2}}\big)$ ; ¦ (l) $\displaystyle\int_{0}^{x} \cos(t^{2})\,\mathrm{d} t$.
    ```

    Pour (d) et (e), on multipliera par $1 - x$ ; pour (f) et (g), on passera par l'exponentielle complexe ; pour (i), on dérivera.
  corrige: |
    Tous les développements ci-dessous ont été vérifiés coefficient par coefficient avec un logiciel de calcul formel.

    **(a)** On écrit $\frac{1 + x}{2 - x} = -1 + \frac{3}{2 - x} = -1 + \frac{3}{2}\sum \frac{x^{n}}{2^{n}}$. 
    $$\boxed{\frac{1 + x}{2 - x} = \frac{1}{2} + \sum_{n \geqslant 1} \frac{3}{2^{n + 1}}x^{n}, \quad R = 2}$$

    **(b)** En éléments simples, $\frac{1}{(x - 2)(x - 3)} = \frac{1}{2 - x} - \frac{1}{3 - x}$. 
    $$\boxed{\frac{1}{x^{2} - 5x + 6} = \sum_{n \geqslant 0} \Big(\frac{1}{2^{n + 1}} - \frac{1}{3^{n + 1}}\Big)x^{n}, \quad R = 2}$$

    **(c)** Pour $x < 2$, $\ln(x^{2} - 5x + 6) = \ln 6 + \ln(1 - \frac{x}{2}) + \ln(1 - \frac{x}{3})$. 
    $$\boxed{\ln(x^{2} - 5x + 6) = \ln 6 - \sum_{n \geqslant 1} \Big(\frac{1}{2^{n}} + \frac{1}{3^{n}}\Big)\frac{x^{n}}{n}, \quad R = 2}$$

    **(d)** Pour $|x| < 1$, $1 + x + x^{2} = \frac{1 - x^{3}}{1 - x}$, d'où $\ln(1 + x + x^{2}) = -\ln(1 - x) + \ln(1 - x^{3}) = \sum \frac{x^{n}}{n} - \sum \frac{x^{3n}}{n}$. 
    $$\boxed{\ln(1 + x + x^{2}) = \sum_{n \geqslant 1} a_{n}x^{n}, \quad a_{n} = \frac{1}{n} \text{ si } 3 \nmid n, \ a_{n} = -\frac{2}{n} \text{ si } 3 \mid n, \quad R = 1}$$

    **(e)** De même, $\frac{1}{1 + x + x^{2}} = \frac{1 - x}{1 - x^{3}} = \sum (x^{3n} - x^{3n + 1})$. 
    $$\boxed{a_{3n} = 1, \quad a_{3n + 1} = -1, \quad a_{3n + 2} = 0, \quad R = 1}$$

    **(f)** On écrit $\operatorname{sh} x\cos x = \frac{1}{2}\Re\big(\mathrm{e}^{(1 + \mathrm{i})x} - \mathrm{e}^{(-1 + \mathrm{i})x}\big)$, avec $(1 + \mathrm{i})^{n} = 2^{n/2}\mathrm{e}^{\mathrm{i} n\pi/4}$ et $(-1 + \mathrm{i})^{n} = 2^{n/2}\mathrm{e}^{3\mathrm{i} n\pi/4}$. La formule $\cos p - \cos q = -2\sin\frac{p + q}{2}\sin\frac{p - q}{2}$ donne 
    $$\boxed{\operatorname{sh} x\cos x = \sum_{n \geqslant 0} \frac{2^{n/2}\sin\frac{n\pi}{2}\sin\frac{n\pi}{4}}{n!}x^{n} = x - \frac{x^{3}}{3} - \frac{x^{5}}{30} + \cdots, \quad R = +\infty}$$

    **(g)** De même, $\cos x\operatorname{ch} x = \frac{1}{2}\Re\big(\mathrm{e}^{(1 + \mathrm{i})x} + \mathrm{e}^{(-1 + \mathrm{i})x}\big)$ a pour coefficients $\frac{2^{n/2}\cos\frac{n\pi}{2}\cos\frac{n\pi}{4}}{n!}$, non nuls seulement pour $n = 4k$. 
    $$\boxed{\cos x\operatorname{ch} x = \sum_{k \geqslant 0} \frac{(-4)^{k}}{(4k)!}x^{4k}, \quad R = +\infty}$$

    **(h)** On soustrait les développements de $\ln(1 + x)$ et $\ln(1 - x)$ : les termes pairs se compensent. 
    $$\boxed{\ln\frac{1 + x}{1 - x} = 2\sum_{n \geqslant 0} \frac{x^{2n + 1}}{2n + 1}, \quad R = 1}$$

    **(i)** Avec $u = \frac{1 + x}{1 - x}$, $u' = \frac{2}{(1 - x)^{2}}$ et $1 + u^{2} = \frac{2(1 + x^{2})}{(1 - x)^{2}}$ : la dérivée vaut $\frac{1}{1 + x^{2}}$, et la valeur en $0$ est $\frac{\pi}{4}$. 
    $$\boxed{\operatorname{Arctan}\frac{1 + x}{1 - x} = \frac{\pi}{4} + \sum_{n \geqslant 0} (-1)^{n}\frac{x^{2n + 1}}{2n + 1}, \quad R = 1}$$

    **(j)** Avec $\alpha = -\frac{1}{2}$ et $-x^{2}$, les coefficients sont $\binom{2n}{n}4^{-n}$ (cours, section 9.5) ; on intègre ensuite terme à terme. 
    $$\boxed{\frac{1}{\sqrt{1 - x^{2}}} = \sum_{n \geqslant 0} \frac{\binom{2n}{n}}{4^{n}}x^{2n}, \qquad \operatorname{Arcsin} x = \sum_{n \geqslant 0} \frac{\binom{2n}{n}}{4^{n}(2n + 1)}x^{2n + 1}, \quad R = 1}$$

    **(k)** La dérivée de $\ln(x + \sqrt{1 + x^{2}})$ est $\frac{1}{\sqrt{1 + x^{2}}}$, développée comme en (j) avec $+x^{2}$. 
    $$\boxed{\ln\big(x + \sqrt{1 + x^{2}}\big) = \sum_{n \geqslant 0} (-1)^{n}\frac{\binom{2n}{n}}{4^{n}(2n + 1)}x^{2n + 1}, \quad R = 1}$$

    **(l)** On développe $\cos(t^{2}) = \sum (-1)^{n}\frac{t^{4n}}{(2n)!}$, de rayon infini, puis on intègre. 
    $$\boxed{\int_{0}^{x} \cos(t^{2})\,\mathrm{d} t = \sum_{n \geqslant 0} \frac{(-1)^{n}x^{4n + 1}}{(2n)!\,(4n + 1)}, \quad R = +\infty}$$
     *Piège.* En (c), le rayon est $2$ et non $3$ : c'est la racine la plus proche de $0$ qui limite le développement, comme le cours l'a expliqué.
