  source: "exercice composé pour la feuille (démonstration du théorème 5 du cours) ; Séries entières (Prost, LLG), exercice 24"
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Perspective : démonstration du théorème d'Abel radial.* Soit $\sum a_{n}x^{n}$ de rayon $1$, telle que $\sum a_{n}$ converge, de somme $S$ sur $]-1, 1[$. On note $\displaystyle R_{n} = \sum_{k > n} a_{k}$ et $\displaystyle \sigma = \sum_{n = 0}^{+\infty} a_{n}$.

    **1.** Montrer que, pour $x \in ]-1, 1[$, la série $\sum R_{n}x^{n}$ converge et que $\displaystyle S(x) - \sigma = (x - 1)\sum_{n = 0}^{+\infty} R_{n}x^{n}$. On écrira $a_{n} = R_{n - 1} - R_{n}$ pour $n \geqslant 1$.

    **2.** Soit $\varepsilon > 0$ et $N$ tel que $|R_{n}| \leqslant \varepsilon$ pour $n \geqslant N$. Montrer que, pour $x \in [0, 1[$, 
    $$|S(x) - \sigma| \leqslant (1 - x)\sum_{n = 0}^{N - 1} |R_{n}| + \varepsilon.$$

    **3.** Conclure que $S(x) \to \sigma$ quand $x \to 1^{-}$.

    **4.** Le même calcul vaut pour $z$ complexe. En majorant $\frac{|1 - z|}{1 - |z|}$, montrer que $S(z) \to \sigma$ quand $z \to 1$ en restant dans un « angle de Stolz » $\{z \mid |z| < 1, \ |1 - z| \leqslant K(1 - |z|)\}$, avec $K > 0$ fixé.
  corrige: |
    **1.** La suite $(R_{n})$ tend vers $0$, donc est bornée : $\sum R_{n}x^{n}$ converge absolument pour $|x| < 1$. On décale l'indice : 
    $$(x - 1)\sum_{n \geqslant 0} R_{n}x^{n} = \sum_{n \geqslant 1} R_{n - 1}x^{n} - \sum_{n \geqslant 0} R_{n}x^{n} = -R_{0} + \sum_{n \geqslant 1} (R_{n - 1} - R_{n})x^{n} = -R_{0} + \sum_{n \geqslant 1} a_{n}x^{n}.$$
     Comme $\sigma = a_{0} + R_{0}$, 
    $$\boxed{S(x) - \sigma = (x - 1)\sum_{n = 0}^{+\infty} R_{n}x^{n}}$$

    **2.** On sépare les indices $n < N$ et $n \geqslant N$, avec $0 \leqslant x^{n} \leqslant 1$ : 
    $$|S(x) - \sigma| \leqslant (1 - x)\sum_{n < N} |R_{n}| + \varepsilon(1 - x)\sum_{n \geqslant N} x^{n} \leqslant (1 - x)\sum_{n < N} |R_{n}| + \varepsilon.$$

    **3.** Le premier terme tend vers $0$ quand $x \to 1^{-}$, donc $|S(x) - \sigma| \leqslant 2\varepsilon$ pour $x$ assez proche de $1$. 
    $$\boxed{S(x) \xrightarrow[x \to 1^{-}]{} \sigma}$$
     La clé est la transformation d'Abel de la question 1 : elle remplace les $a_{n}$, dont la série ne converge pas absolument, par les restes $R_{n}$, qui tendent vers $0$.

    **4.** Le calcul de la question 1 vaut pour $|z| < 1$, et, comme $\sum_{n \geqslant N} |z|^{n} \leqslant \frac{1}{1 - |z|}$, 
    $$|S(z) - \sigma| \leqslant |1 - z|\sum_{n < N} |R_{n}| + \varepsilon\frac{|1 - z|}{1 - |z|} \leqslant |1 - z|\sum_{n < N} |R_{n}| + K\varepsilon$$
     dans l'angle de Stolz. Le premier terme tend vers $0$ quand $z \to 1$. 
    $$\boxed{S(z) \to \sigma \text{ quand } z \to 1 \text{ dans un angle de Stolz}}$$
     Sans la condition d'angle, le rapport $\frac{|1 - z|}{1 - |z|}$ peut tendre vers $+\infty$, et le résultat tombe en défaut en général.
