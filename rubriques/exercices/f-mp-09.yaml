  enonce: |
    *Involutions.* Pour $n \in \mathbb{N}^{*}$, on note $i_{n}$ le nombre de permutations $\sigma$ de $\displaystyle \llbracket 1\,,n \rrbracket$ telles que $\sigma \circ \sigma = \mathrm{id}$, avec $i_{0} = 1$.

    **1.** Montrer que $\sum \frac{i_{n}}{n!}x^{n}$ a un rayon au moins égal à $1$.

    **2.** Montrer que $i_{n} = i_{n - 1} + (n - 1)i_{n - 2}$ pour $n \geqslant 2$, selon que $n$ est fixe ou non.

    **3.** En déduire la somme $\displaystyle f(x) = \sum_{n = 0}^{+\infty} \frac{i_{n}}{n!}x^{n}$, puis $\lim_{n \to +\infty} \frac{i_{n}}{n!}$.
  corrige: |
    **1.** On a $i_{n} \leqslant n!$, donc $R \geqslant 1$.

    **2.** Si $\sigma(n) = n$, la restriction de $\sigma$ à $\llbracket 1\,,n - 1 \rrbracket$ est une involution : $i_{n - 1}$ possibilités. Sinon, $\sigma(n) = j \neq n$ et $\sigma(j) = n$ : $n - 1$ choix pour $j$, et $\sigma$ induit une involution sur les $n - 2$ éléments restants. 
    $$\boxed{i_{n} = i_{n - 1} + (n - 1)i_{n - 2}}$$

    **3.** En dérivant, $f'(x) = \sum \frac{i_{n + 1}}{n!}x^{n} = \sum \frac{i_{n}}{n!}x^{n} + \sum \frac{n\,i_{n - 1}}{n!}x^{n} = f(x) + xf(x)$, avec $f(0) = 1$, d'où $f(x) = \mathrm{e}^{x + x^{2}/2}$ sur $]-1, 1[$. Or $\mathrm{e}^{x}\mathrm{e}^{x^{2}/2}$ est développable sur $\mathbb{R}$ comme produit de deux séries de rayon infini : par unicité des coefficients, la série $\sum \frac{i_{n}}{n!}x^{n}$ a un rayon infini, et converge en particulier en $x = 1$, ce qui force son terme général à tendre vers $0$. 
    $$\boxed{f(x) = \mathrm{e}^{x + x^{2}/2}, \qquad \frac{i_{n}}{n!} \to 0}$$
     On trouve $i_{0}, \dots, i_{6} = 1, 1, 2, 4, 10, 26, 76$.
