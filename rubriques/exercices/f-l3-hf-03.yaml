  enonce: |
    **Polynômes orthogonaux pour un poids.** Soit $]a, b[$ un intervalle de $\mathbb{R}$ (borné ou non) et $p : ]a, b[ \to \mathbb{R}$ une fonction continue strictement positive telle que $\int_{a}^{b} |t|^{n} p(t) \, \mathrm{d} t < +\infty$ pour tout $n \in \mathbb{N}$. On munit $\mathbb{R}[X]$ du produit scalaire $\langle P, Q \rangle = \int_{a}^{b} P(t) Q(t) p(t) \, \mathrm{d} t$.

    **1.** Montrer qu'il existe une unique suite $(P_{n})_{n \geq 0}$ de polynômes unitaires, deux à deux orthogonaux, avec $\deg P_{n} = n$.

    **2.** Dans le cas $]a, b[ = ]0, 1[$ et $p = 1$, montrer que $(P_{n} / \lVert P_{n} \rVert)$ est une base hilbertienne de $L^{2}([0, 1])$. On admettra la densité de $\mathcal{C}([0, 1])$ dans $L^{2}([0, 1])$ et le théorème d'approximation de Weierstrass.

    **3.** Montrer qu'il existe des réels $\lambda_{n}$ et $\mu_{n}$ tels que 
    $$P_{n+2} = (X + \lambda_{n}) P_{n+1} + \mu_{n} P_{n} \qquad (n \geq 0) ,$$
     et déterminer le signe de $\mu_{n}$. On pourra décomposer $P_{n+2} - X P_{n+1}$ sur $P_{0}, \dots, P_{n+1}$.

    **4.** Montrer que, pour $n \geq 1$, $P_{n}$ possède $n$ racines simples dans $]a, b[$. On pourra considérer les points de $]a, b[$ où $P_{n}$ change de signe.

    **5.** Expliciter la relation de la question 3 pour les polynômes de Legendre unitaires ($]a, b[ = ]-1, 1[$, $p = 1$), à l'aide de l'exercice 7.
  corrige: |
    $\triangleright$ *1.* Les moments $\int_{a}^{b} |t|^{n} p(t) \, \mathrm{d} t$ étant finis, $\langle P, Q \rangle$ est bien défini (développer $PQ$). La forme est bilinéaire, symétrique, positive, et définie : si $\int P^{2} p = 0$, la fonction continue positive $P^{2}p$ est nulle sur $]a, b[$, et $p > 0$ impose que $P$ ait une infinité de racines.

    Le procédé de Gram-Schmidt appliqué à $(1, X, X^{2}, \dots)$ donne une suite orthogonale $(Q_{n})$ avec $\deg Q_{n} = n$ ; en divisant par le coefficient dominant, on obtient des $P_{n}$ unitaires. Pour l'unicité, si $(P'_{n})$ est une autre telle suite, $P_{n} - P'_{n}$ est de degré $< n$, donc dans $\mathrm{Vect}(P_{0}, \dots, P_{n-1})$, et orthogonal à cet espace : il est nul.

    $\triangleright$ *2.* La suite $(P_{n} / \lVert P_{n} \rVert)$ est orthonormée, et son espace engendré est $\mathbb{R}[X]$. Soit $f \in L^{2}([0, 1])$ et $\varepsilon > 0$. Il existe $g$ continue avec $\lVert f - g \rVert_{2} < \varepsilon$, puis un polynôme $P$ avec $\sup_{[0,1]} |g - P| < \varepsilon$ (Weierstrass), d'où $\lVert g - P \rVert_{2} \leq \sup |g - P| < \varepsilon$ et $\lVert f - P \rVert_{2} < 2\varepsilon$. Les polynômes sont denses : c'est une base hilbertienne.

    $\triangleright$ *3.* Le polynôme $P_{n+2} - XP_{n+1}$ est de degré au plus $n + 1$, car les termes dominants se compensent. On le décompose dans la base orthogonale $(P_{0}, \dots, P_{n+1})$ de $\mathbb{R}_{n+1}[X]$ ; le coefficient de $P_{k}$ est 
    $$\frac{\langle P_{n+2} - XP_{n+1}, P_{k} \rangle}{\lVert P_{k} \rVert^{2}} = \frac{-\langle XP_{n+1}, P_{k} \rangle}{\lVert P_{k} \rVert^{2}} = \frac{-\langle P_{n+1}, XP_{k} \rangle}{\lVert P_{k} \rVert^{2}} \qquad (k \leq n) ,$$
     car $\langle XP, Q \rangle = \int t P(t) Q(t) p(t) \, \mathrm{d} t = \langle P, XQ \rangle$. Pour $k \leq n - 1$, $XP_{k}$ est de degré $\leq n$, donc orthogonal à $P_{n+1}$ : le coefficient est nul. Il ne reste que les termes en $P_{n+1}$ et $P_{n}$, ce qui donne la relation annoncée avec 
    $$\mu_{n} = -\frac{\langle P_{n+1}, XP_{n} \rangle}{\lVert P_{n} \rVert^{2}} .$$
     Or $XP_{n} = P_{n+1} + R$ avec $\deg R \leq n$, donc $\langle P_{n+1}, XP_{n} \rangle = \lVert P_{n+1} \rVert^{2}$, et $\mu_{n} = -\frac{\lVert P_{n+1} \rVert^{2}}{\lVert P_{n} \rVert^{2}} < 0$.

    $\triangleright$ *4.* Soit $x_{1} < \cdots < x_{k}$ les points de $]a, b[$ où $P_{n}$ change de signe ; ce sont des racines d'ordre impair, et il y en a au plus $n$. Le polynôme $Q = \prod_{i=1}^{k} (X - x_{i})$ change de signe aux mêmes points, donc $P_{n} Q$ garde un signe constant sur $]a, b[$, et n'est pas identiquement nul. Ainsi $\langle P_{n}, Q \rangle = \int P_{n} Q p \neq 0$.

    Si l'on avait $k < n$, $Q$ serait de degré $< n$, et orthogonal à $P_{n}$ : contradiction. Donc $k = n$ : $P_{n}$ a $n$ racines distinctes dans $]a, b[$, qui sont toutes ses racines, et elles sont donc simples.

    $\triangleright$ *5.* Pour Legendre, la parité ($P_{n}$ a la parité de $n$) impose $\lambda_{n} = 0$ : $P_{n+2} - XP_{n+1}$ a la parité de $n$, sans terme en $P_{n+1}$. Le polynôme unitaire est $\frac{2^{n} (n!)^{2}}{(2n)!} \times$ le polynôme $P_{n}$ de Rodrigues de l'exercice 7, dont la norme au carré est $\frac{2}{2n+1}$ ; le calcul donne 
    $$\boxed{P_{n+2} = X P_{n+1} - \frac{(n + 1)^{2}}{(2n + 1)(2n + 3)} \, P_{n} ,}$$
     soit par exemple $P_{2} = X^{2} - \frac{1}{3}$, $P_{3} = X^{3} - \frac{3}{5}X$ (on retrouve l'exercice 8 de la feuille 1), $P_{4} = X^{4} - \frac{6}{7}X^{2} + \frac{3}{35}$.

    1.5em

    ![Figure](documents/figures/7a492a041939a059.svg)

    Les trois racines de $P_{3}$ (bleu) et les quatre racines de $P_{4}$ (orange) sont simples, dans $]-1, 1[$, et s'entrelacent : entre deux racines consécutives de $P_{4}$ se trouve exactement une racine de $P_{3}$, conséquence classique de la relation de récurrence.

