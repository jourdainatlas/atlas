  noeuds: [f-bases-hilbertiennes]
  notions: [famille-orthonormee, espace-l2-suites]
  source: "Bibmath, Espaces de Hilbert, exercice 8"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Non-compacité de la boule unité.**

    **1.** Montrer que la boule unité fermée de $\ell^{2}(\mathbb{N}, \mathbb{C})$ n'est pas compacte.

    **2.** Montrer plus généralement que la boule unité fermée d'un espace de Hilbert de dimension infinie n'est pas compacte.
  corrige: |
    $\triangleright$ *1.* Les vecteurs $\varepsilon_{n}$ sont dans la boule unité, et pour $n \neq m$, $\lVert \varepsilon_{n} - \varepsilon_{m} \rVert^{2} = 2$ (Pythagore). Une sous-suite convergente serait de Cauchy, ce qui est impossible puisque ses termes restent à distance $\sqrt{2}$ les uns des autres. La boule unité fermée, partie d'un espace métrique, n'est donc pas compacte.

    $\triangleright$ *2.* Si $H$ est de dimension infinie, il contient une suite libre $(v_{n})$, construite par récurrence en choisissant $v_{n+1} \notin \mathrm{Vect}(v_{1}, \dots, v_{n})$. Le procédé de Gram-Schmidt en fait une suite orthonormée $(f_{n})$, et le même argument s'applique : $\lVert f_{n} - f_{m} \rVert = \sqrt{2}$ pour $n \neq m$.

    1.5em

    ![Figure](documents/figures/015b8bcef642bfc8.svg)

    Trois vecteurs d'une suite orthonormée, tous sur la sphère unité, sont deux à deux à distance $\sqrt{2}$ (triangle rouge) ; en dimension infinie, on peut en placer une infinité, qui ne s'accumulent nulle part.
- id: "l3-hf-03-04"
  feuille: "f-l3-hf-03"
  numero: 4
  partie: "Suites orthonormées, Bessel"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalité de Bessel, espace séparable]
  noeuds: [f-bases-hilbertiennes]
  notions: [famille-orthonormee, espace-l2-suites, espace-separable]
  source: "Bibmath, Espaces de Hilbert, exercice 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Familles de carré sommable.** Soit $I$ un ensemble. Pour une famille $x = (x_{\alpha})_{\alpha \in I}$ de nombres complexes, on pose 
    $$\lVert x \rVert = \sup \Big\{ \Big( \sum_{\alpha \in J} |x_{\alpha}|^{2} \Big)^{1/2} ; \ J \subset I \ \text{fini} \Big\} \in [0, +\infty] ,$$
     et l'on note $\ell^{2}(I)$ l'ensemble des familles telles que $\lVert x \rVert < +\infty$.

    **1.** Montrer que, pour $I = \mathbb{N}$, $\lVert x \rVert = \big( \sum_{n=0}^{+\infty} |x_{n}|^{2} \big)^{1/2}$.

    **2.** Soit $x \in \ell^{2}(I)$. Montrer que, pour tout $k \geq 1$, l'ensemble $\{ \alpha ; \ |x_{\alpha}| \geq 1/k \}$ est fini, de cardinal au plus $k^{2}\lVert x \rVert^{2}$. En déduire que $\{ \alpha ; \ x_{\alpha} \neq 0 \}$ est dénombrable.

    **3.** On admet que $\ell^{2}(I)$, muni de $\langle x, y \rangle = \sum_{\alpha} x_{\alpha} \overline{y_{\alpha}}$, est un espace de Hilbert. On prend $I = \mathbb{R}$, et l'on note $\delta_{t}$ la famille qui vaut $1$ en $t$ et $0$ ailleurs. Montrer que $(\delta_{t})_{t \in \mathbb{R}}$ est une famille orthonormée non dénombrable, et que $\ell^{2}(\mathbb{R})$ n'est pas séparable.
  corrige: |
    $\triangleright$ *1.* Pour $I = \mathbb{N}$ et $J$ fini, $J \subset \{0, \dots, N\}$ avec $N = \max J$, donc $\sum_{J} |x_{n}|^{2} \leq \sum_{n=0}^{N} |x_{n}|^{2} \leq \sum_{n=0}^{+\infty} |x_{n}|^{2}$. Inversement, les sommes partielles $\sum_{n=0}^{N} |x_{n}|^{2}$ sont des sommes sur les parties finies $\{0, \dots, N\}$. La borne supérieure des sommes finies est donc la limite des sommes partielles : $\lVert x \rVert^{2} = \sum_{n \geq 0} |x_{n}|^{2}$, finie ou non.

    $\triangleright$ *2.* Soit $J$ une partie finie de $A_{k} = \{\alpha ; \ |x_{\alpha}| \geq 1/k\}$. Alors $\operatorname{card} J / k^{2} \leq \sum_{\alpha \in J} |x_{\alpha}|^{2} \leq \lVert x \rVert^{2}$, donc $\operatorname{card} J \leq k^{2} \lVert x \rVert^{2}$. Toutes les parties finies de $A_{k}$ ayant un cardinal borné, $A_{k}$ est fini, de cardinal au plus $k^{2}\lVert x \rVert^{2}$. Enfin $\{\alpha ; \ x_{\alpha} \neq 0\} = \bigcup_{k \geq 1} A_{k}$ est une réunion dénombrable d'ensembles finis : le support de $x$ est dénombrable.

    $\triangleright$ *3.* On a $\langle \delta_{s}, \delta_{t} \rangle = 1$ si $s = t$ et $0$ sinon : la famille $(\delta_{t})_{t \in \mathbb{R}}$ est orthonormée, et elle est indexée par $\mathbb{R}$, non dénombrable.

    Pour $s \neq t$, $\lVert \delta_{s} - \delta_{t} \rVert = \sqrt{2}$, donc les boules ouvertes $B(\delta_{t}, \frac{\sqrt{2}}{2})$ sont deux à deux disjointes. Une partie dense rencontre chacune d'elles, en des points distincts : elle est au moins aussi grosse que $\mathbb{R}$, donc non dénombrable. $\ell^{2}(\mathbb{R})$ n'est pas séparable.

    *Remarque.* Le cours ne traite que les espaces séparables, où les bases hilbertiennes sont des suites (th. 3). Dans un espace comme $\ell^{2}(\mathbb{R})$, il faut des familles non dénombrables, et l'existence d'une base hilbertienne repose alors sur le lemme de Zorn, admis dans le cours. La question 2 explique pourtant pourquoi les sommes $\sum_{\alpha} |\langle x, e_{\alpha} \rangle|^{2}$ gardent un sens : seuls un nombre dénombrable de termes sont non nuls.
- id: "l3-hf-03-05"
  feuille: "f-l3-hf-03"
  numero: 5
  partie: "Bases hilbertiennes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [bases hilbertiennes, espace séparable]
  noeuds: [f-bases-hilbertiennes]
  notions: [base-hilbertienne, espace-separable]
  source: "ENS, Topologie, analyse et calcul différentiel, feuille 7 (13/11/2014), exercice 2"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Séparabilité.** Soit $H$ un espace de Hilbert.

    **1.** On suppose que $H$ possède une base hilbertienne $(e_{n})_{n \in \mathbb{N}}$. Montrer que l'ensemble des combinaisons linéaires finies des $e_{n}$ à coefficients dans $\mathbb{Q} + \mathrm{i} \mathbb{Q}$ est dénombrable et dense, donc que $H$ est séparable. Avec le théorème 3 du cours, que peut-on en conclure ?

    **2.** Soit $(e_{n})$ une base hilbertienne de $H$ et $x \in H$. Montrer que si $x = \sum_{n \geq 0} \alpha_{n} e_{n}$, la série convergeant dans $H$, alors $\alpha_{n} = \langle x, e_{n} \rangle$ pour tout $n$.

    **3.** On suppose $H$ séparable. Montrer que toute famille orthonormée $(f_{i})_{i \in I}$ de $H$ est dénombrable. On pourra considérer les boules ouvertes $B(f_{i}, \frac{\sqrt{2}}{2})$.
  corrige: |
    $\triangleright$ *1.* L'ensemble $D$ des combinaisons $\sum_{n \leq N} q_{n} e_{n}$, avec $N \in \mathbb{N}$ et $q_{n} \in \mathbb{Q} + \mathrm{i}\mathbb{Q}$, est une réunion dénombrable (sur $N$) d'ensembles dénombrables (images de $(\mathbb{Q} + \mathrm{i}\mathbb{Q})^{N+1}$) : il est dénombrable.

    Il est dense : soit $x \in H$ et $\varepsilon > 0$. Comme $\mathrm{Vect}(e_{n})$ est dense, il existe $y = \sum_{n \leq N} \alpha_{n} e_{n}$ avec $\lVert x - y \rVert < \varepsilon / 2$. On choisit $q_{n} \in \mathbb{Q} + \mathrm{i}\mathbb{Q}$ avec $|q_{n} - \alpha_{n}| < \frac{\varepsilon}{2(N + 1)}$ ; alors $z = \sum q_{n} e_{n} \in D$ vérifie $\lVert y - z \rVert \leq \sum |q_{n} - \alpha_{n}| < \varepsilon / 2$, et $\lVert x - z \rVert < \varepsilon$.

    Ainsi $H$ est séparable. Avec le théorème 3 du cours, on obtient l'équivalence : 
    $$\boxed{\text{un Hilbert de dimension infinie est séparable} \iff \text{il possède une base hilbertienne dénombrable.}}$$

    $\triangleright$ *2.* Pour $m$ fixé et $N \geq m$, $\langle \sum_{n \leq N} \alpha_{n} e_{n}, e_{m} \rangle = \alpha_{m}$. On fait tendre $N$ vers l'infini et l'on utilise la continuité du produit scalaire : $\langle x, e_{m} \rangle = \alpha_{m}$. Les coefficients d'un développement convergent sont donc les coefficients de Fourier $\langle x, e_{m} \rangle$.

    $\triangleright$ *3.* Soit $D$ une partie dénombrable dense de $H$. Pour $i \neq j$, $\lVert f_{i} - f_{j} \rVert = \sqrt{2}$, donc les boules $B(f_{i}, \frac{\sqrt{2}}{2})$ sont deux à deux disjointes. Chacune contient un point de $D$ ; en choisissant un tel point $d_{i}$ pour chaque $i$, on définit une application injective $i \mapsto d_{i}$ de $I$ dans $D$. Donc $I$ est dénombrable. C'est l'argument de l'exercice 4, question 3, lu dans l'autre sens.
- id: "l3-hf-03-06"
  feuille: "f-l3-hf-03"
  numero: 6
  partie: "Bases hilbertiennes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [bases hilbertiennes]
  noeuds: [f-bases-hilbertiennes]
  notions: [base-hilbertienne, espace-separable, cosinus-sinus]
  source: "Mathovore, exercices L3, exercice 12"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **La base des sinus.** On admet, ce que démontrera le chapitre 5, que la famille $\big(\frac{1}{\sqrt{2\pi}} \mathrm{e}^{\mathrm{i} n x}\big)_{n \in \mathbb{Z}}$ est une base hilbertienne de $L^{2}(]-\pi, \pi[, \mathbb{C})$. Pour $n \geq 1$, on pose $s_{n}(x) = \sqrt{2/\pi} \, \sin(nx)$.

    **1.** Montrer que $(s_{n})_{n \geq 1}$ est une suite orthonormée de $L^{2}(]0, \pi[, \mathbb{R})$.

    **2.** Soit $f \in L^{2}(]0, \pi[, \mathbb{R})$ orthogonale à tous les $s_{n}$, et $\tilde{f}$ son prolongement impair à $]-\pi, \pi[$. Montrer que $\tilde{f}$ est orthogonale à tous les $\mathrm{e}^{\mathrm{i} n x}$, et en déduire que $(s_{n})_{n \geq 1}$ est une base hilbertienne de $L^{2}(]0, \pi[, \mathbb{R})$.

    **3.** Développer la fonction constante $1$ dans cette base, et en déduire par la formule de Parseval la valeur de $\sum_{k \geq 0} \frac{1}{(2k + 1)^{2}}$.
  corrige: |
    $\triangleright$ *1.* Pour $n, m \geq 1$, on utilise $2 \sin(nx) \sin(mx) = \cos((n - m)x) - \cos((n + m)x)$ : 
    $$\langle s_{n}, s_{m} \rangle = \frac{1}{\pi} \int_{0}^{\pi} \big( \cos((n - m)x) - \cos((n + m)x) \big) \mathrm{d} x = \begin{cases} 1 & \text{si } n = m , \\ 0 & \text{si } n \neq m , \end{cases}$$
     car $\int_{0}^{\pi} \cos(kx) \, \mathrm{d} x = 0$ pour tout entier $k \neq 0$, et vaut $\pi$ pour $k = 0$.

    $\triangleright$ *2.* Le prolongement impair $\tilde{f}$ est défini par $\tilde{f}(x) = f(x)$ si $x > 0$ et $\tilde{f}(x) = -f(-x)$ si $x < 0$ ; il est de carré intégrable sur $]-\pi, \pi[$. Comme $\tilde{f}(x)\cos(nx)$ est impaire et $\tilde{f}(x) \sin(nx)$ paire, 
    $$\int_{-\pi}^{\pi} \tilde{f}(x) \mathrm{e}^{-\mathrm{i} n x} \, \mathrm{d} x = -\mathrm{i} \int_{-\pi}^{\pi} \tilde{f}(x) \sin(nx) \, \mathrm{d} x = -2\mathrm{i} \int_{0}^{\pi} f(x) \sin(nx) \, \mathrm{d} x = -2\mathrm{i} \sqrt{\pi/2} \, \langle f, s_{n} \rangle$$
     pour $n \geq 1$ ; pour $n \leq -1$, on obtient l'opposé de la valeur en $-n$, et pour $n = 0$ l'intégrale d'une fonction impaire, nulle. Si $f$ est orthogonale à tous les $s_{n}$, $\tilde{f}$ est orthogonale à tous les $\mathrm{e}^{\mathrm{i} n x}$ ; comme ceux-ci forment une base hilbertienne, $\tilde{f} = 0$, donc $f = 0$. La suite orthonormée $(s_{n})$ a un orthogonal nul : c'est une base hilbertienne (cours, prop. 1).

    $\triangleright$ *3.* Pour $n \geq 1$, 
    $$\langle 1, s_{n} \rangle = \sqrt{\frac{2}{\pi}} \int_{0}^{\pi} \sin(nx) \, \mathrm{d} x = \sqrt{\frac{2}{\pi}} \cdot \frac{1 - (-1)^{n}}{n} ,$$
     qui vaut $\frac{2}{n}\sqrt{\frac{2}{\pi}}$ si $n$ est impair et $0$ si $n$ est pair. Le développement de $1$ dans la base est 
    $$\boxed{1 = \frac{4}{\pi} \sum_{k \geq 0} \frac{\sin((2k + 1)x)}{2k + 1} \quad \text{dans } L^{2}(]0, \pi[) .}$$
     La formule de Parseval s'écrit $\lVert 1 \rVert^{2} = \pi = \sum_{k \geq 0} \frac{8}{\pi (2k + 1)^{2}}$, d'où 
    $$\boxed{\sum_{k \geq 0} \frac{1}{(2k + 1)^{2}} = \frac{\pi^{2}}{8} .}$$

    1.5em

    ![Figure](documents/figures/d89f6424ad72a8d5.svg)

    Les sommes partielles (orange) se rapprochent de $1$ en moyenne quadratique, mais restent nulles en $0$ et en $\pi$ et dépassent $1$ près des bords d'environ $18\,\%$ pour $10$ termes : c'est le phénomène de Gibbs, étudié au chapitre 6. La convergence dans $L^{2}$ n'est pas une convergence uniforme.
- id: "l3-hf-03-07"
  feuille: "f-l3-hf-03"
  numero: 7
  partie: "Polynômes orthogonaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [polynômes orthogonaux]
  noeuds: [f-bases-hilbertiennes]
  notions: [base-hilbertienne, famille-orthonormee]
  source: "Mathovore, exercices L3, exercice 21 (polynômes de Legendre)"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **Formule de Rodrigues.** Dans $H = L^{2}([-1, 1], \mathbb{R})$, muni de $\langle f, g \rangle = \int_{-1}^{1} fg$, on pose pour $n \geq 0$ 
    $$P_{n}(x) = \frac{1}{2^{n} n!} \, \frac{\mathrm{d}^{n}}{\mathrm{d} x^{n}} \big[ (x^{2} - 1)^{n} \big] .$$

    **1.** Calculer $P_{0}$, $P_{1}$, $P_{2}$. Montrer que $P_{n}$ est de degré $n$ et que $P_{n}(1) = 1$. On pourra écrire $(x^{2} - 1)^{n} = (x - 1)^{n}(x + 1)^{n}$ et utiliser la formule de Leibniz.

    **2.** Montrer que $\langle P_{n}, Q \rangle = 0$ pour tout polynôme $Q$ de degré strictement inférieur à $n$, en intégrant $n$ fois par parties. En déduire que $P_{n} / \lVert P_{n} \rVert$ est le $n$-ième polynôme de Legendre normalisé $e_{n}$ du cours.

    **3.** On pose $I_{n} = \int_{-1}^{1} (1 - x^{2})^{n} \, \mathrm{d} x$. Montrer que $I_{n} = \frac{2n}{2n + 1} I_{n-1}$, puis que $\lVert P_{n} \rVert^{2} = \frac{2}{2n + 1}$.

    **4.** Calculer $\langle f, P_{n} \rangle$ pour $f(x) = |x|$ et $n \leq 2$. Écrire la formule de Parseval pour $f$ dans la base $(e_{n})$ et en déduire, sans nouveau calcul d'intégrale, la distance de $f$ aux polynômes de degré au plus $2$.
  corrige: |
    $\triangleright$ *1.* On trouve $P_{0} = 1$, $P_{1} = \frac{1}{2} \cdot 2x = x$ et $P_{2} = \frac{1}{8} (x^{4} - 2x^{2} + 1)'' = \frac{1}{8}(12x^{2} - 4) = \frac{3x^{2} - 1}{2}$.

    Le polynôme $(x^{2} - 1)^{n}$ est de degré $2n$, de coefficient dominant $1$ ; sa dérivée $n$-ième est de degré $n$, de coefficient dominant $\frac{(2n)!}{n!}$. Donc $\deg P_{n} = n$.

    Par la formule de Leibniz appliquée à $(x - 1)^{n}(x + 1)^{n}$, la dérivée $n$-ième est une somme de termes $\binom{n}{k} \big[(x - 1)^{n}\big]^{(k)} \big[(x + 1)^{n}\big]^{(n-k)}$. En $x = 1$, seul le terme $k = n$ ne s'annule pas, car $(x - 1)^{n}$ a une racine d'ordre $n$ en $1$ ; il vaut $n! \cdot 2^{n}$. Donc $P_{n}(1) = \frac{n! \, 2^{n}}{2^{n} n!} = 1$.

    $\triangleright$ *2.* Notons $u = (x^{2} - 1)^{n}$. Comme $\pm 1$ sont racines d'ordre $n$ de $u$, les dérivées $u^{(j)}$ s'annulent en $\pm 1$ pour $j < n$. Soit $Q$ de degré $< n$. Une intégration par parties donne 
    $$\int_{-1}^{1} u^{(n)} Q = \big[ u^{(n-1)} Q \big]_{-1}^{1} - \int_{-1}^{1} u^{(n-1)} Q' = -\int_{-1}^{1} u^{(n-1)} Q' ,$$
     et en recommençant $n$ fois, $\int_{-1}^{1} u^{(n)} Q = (-1)^{n} \int_{-1}^{1} u \, Q^{(n)} = 0$, puisque $Q^{(n)} = 0$.

    Ainsi $P_{n}$ est orthogonal à $\mathbb{R}_{n-1}[X]$. La famille $(P_{0}, \dots, P_{n})$ est orthogonale et engendre $\mathbb{R}_{n}[X]$, avec $P_{n}(1) > 0$ ; le procédé de Gram-Schmidt appliqué à $(1, X, \dots)$ produit les mêmes droites, et son unicité (vecteurs de coefficient dominant positif) donne $e_{n} = P_{n} / \lVert P_{n} \rVert$. Le cours notait déjà $e_{k} = \sqrt{\frac{2k + 1}{2}} \, P_{k}$ : la question suivante le démontre.

    $\triangleright$ *3.* Pour $n \geq 1$, une intégration par parties, avec $\big((1 - x^{2})^{n}\big)' = -2nx(1 - x^{2})^{n-1}$, donne 
    $$I_{n} = \big[ x (1 - x^{2})^{n} \big]_{-1}^{1} + 2n \int_{-1}^{1} x^{2} (1 - x^{2})^{n-1} \, \mathrm{d} x = 2n (I_{n-1} - I_{n}) ,$$
     en écrivant $x^{2} = 1 - (1 - x^{2})$. D'où $I_{n} = \frac{2n}{2n + 1} I_{n-1}$, et avec $I_{0} = 2$, 
    $$I_{n} = 2 \prod_{k=1}^{n} \frac{2k}{2k + 1} = \frac{2^{2n+1} (n!)^{2}}{(2n + 1)!} .$$
     D'après la question 2 (intégrations par parties avec $Q = P_{n}$), et parce que $u^{(2n)} = (2n)!$, 
    $$\lVert P_{n} \rVert^{2} = \frac{1}{2^{n} n!} \int_{-1}^{1} u^{(n)} P_{n} = \frac{(-1)^{n}}{(2^{n} n!)^{2}} \int_{-1}^{1} u \, u^{(2n)} = \frac{(2n)!}{(2^{n} n!)^{2}} \, I_{n} = \boxed{\frac{2}{2n + 1} ,}$$
     où l'on a utilisé $(-1)^{n} u = (1 - x^{2})^{n}$.

    $\triangleright$ *4.* On calcule $\langle f, P_{0} \rangle = \int_{-1}^{1} |x| = 1$, puis $\langle f, P_{1} \rangle = 0$ (intégrande impaire) et 
    $$\langle f, P_{2} \rangle = 2\int_{0}^{1} x \, \frac{3x^{2} - 1}{2} \, \mathrm{d} x = \frac{3}{4} - \frac{1}{2} = \frac{1}{4} .$$

    Comme $\langle f, e_{n} \rangle^{2} = \frac{2n + 1}{2} \langle f, P_{n} \rangle^{2}$, la formule de Parseval (cours, th. 4 et prop. 3) s'écrit 
    $$\frac{2}{3} = \lVert f \rVert^{2} = \sum_{n \geq 0} \frac{2n + 1}{2} \langle f, P_{n} \rangle^{2} = \frac{1}{2} + \frac{5}{2} \cdot \frac{1}{16} + \sum_{n \geq 3} \frac{2n + 1}{2} \langle f, P_{n} \rangle^{2} .$$
     La somme des termes $n \geq 3$ est le carré de la distance de $f$ à $\mathbb{R}_{2}[X] = \mathrm{Vect}(e_{0}, e_{1}, e_{2})$. Donc 
    $$\boxed{d(f, \mathbb{R}_{2}[X])^{2} = \frac{2}{3} - \frac{1}{2} - \frac{5}{32} = \frac{1}{96} , \qquad d = \frac{1}{4\sqrt{6}} = \frac{\sqrt{6}}{24} ,}$$
     ce qui est la valeur trouvée au chapitre 1 du cours par un calcul direct.
