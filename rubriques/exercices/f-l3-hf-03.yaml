- id: "l3-hf-03-01"
  feuille: "f-l3-hf-03"
  numero: 1
  partie: "Suites orthonormées, Bessel"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [inégalité de Bessel]
  noeuds: [f-bases-hilbertiennes]
  notions: [famille-orthonormee, espace-l2-suites]
  source: "Mathovore, exercices L3, exercice 11 ; Bibmath, Espaces de Hilbert, exercice 5 (1), (2), (4)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On se place dans $H = \ell^{2}(\mathbb{N}, \mathbb{R})$ et l'on note $F = \overline{\mathrm{Vect}}(\varepsilon_{2n} ; n \in \mathbb{N})$.

    **1.** Montrer que $(\varepsilon_{2n})_{n \geq 0}$ est une suite orthonormée, mais n'est pas une base hilbertienne de $H$.

    **2.** Soit $x = (2^{-n})_{n \geq 0}$. Calculer $\lVert x \rVert^{2}$ et $\sum_{n \geq 0} \langle x, \varepsilon_{2n} \rangle^{2}$, et vérifier l'inégalité de Bessel.

    **3.** Exprimer $p_{F}(x)$ à l'aide du théorème 2 du cours, et calculer $d(x, F)$.

    **4.** Soit $G$ un sous-espace fermé de $H$, distinct de $H$. Montrer que, pour tout $y \in H$, 
    $$d(y, G) = \max \big\{ |\langle y, z \rangle| ; \ z \in G^{\perp}, \ \lVert z \rVert = 1 \big\} .$$
     Retrouver la valeur de $d(x, F)$ de la question 3.
  corrige: |
    $\triangleright$ *1.* On a $\langle \varepsilon_{2n}, \varepsilon_{2m} \rangle = 1$ si $n = m$ et $0$ sinon : la suite est orthonormée. Mais $\varepsilon_{1}$ est orthogonal à tous les $\varepsilon_{2n}$, donc à $\overline{\mathrm{Vect}}(\varepsilon_{2n})$, qui n'est pas $H$ : ce n'est pas une base hilbertienne.

    $\triangleright$ *2.* On a $\lVert x \rVert^{2} = \sum_{n \geq 0} 4^{-n} = \frac{4}{3}$ et $\langle x, \varepsilon_{2n} \rangle = 2^{-2n}$, d'où 
    $$\boxed{\sum_{n \geq 0} \langle x, \varepsilon_{2n} \rangle^{2} = \sum_{n \geq 0} 16^{-n} = \frac{16}{15} \leq \frac{4}{3} = \lVert x \rVert^{2} .}$$
     L'inégalité de Bessel est stricte, ce qui confirme que la suite n'est pas une base (cours, prop. 1).

    $\triangleright$ *3.* D'après le théorème 2 du cours, $p_{F}(x) = \sum_{n} \langle x, \varepsilon_{2n} \rangle \varepsilon_{2n}$ : c'est la suite qui vaut $2^{-k}$ aux indices pairs $k$ et $0$ aux indices impairs. Par Pythagore, 
    $$\boxed{d(x, F)^{2} = \lVert x \rVert^{2} - \lVert p_{F}(x) \rVert^{2} = \frac{4}{3} - \frac{16}{15} = \frac{4}{15} , \qquad d(x, F) = \frac{2}{\sqrt{15}} .}$$

    $\triangleright$ *4.* Comme $G$ est fermé, $y - p_{G}(y) \in G^{\perp}$ (cours, chapitre 2, th. 4). Pour $z \in G^{\perp}$ unitaire, $\langle p_{G}(y), z \rangle = 0$, donc 
    $$|\langle y, z \rangle| = |\langle y - p_{G}(y), z \rangle| \leq \lVert y - p_{G}(y) \rVert = d(y, G)$$
     par Cauchy-Schwarz. Si $y \notin G$, on a égalité pour $z = (y - p_{G}(y)) / \lVert y - p_{G}(y) \rVert$, qui est unitaire et dans $G^{\perp}$. Si $y \in G$, les deux membres sont nuls ; l'ensemble des $z$ n'est pas vide, car $G^{\perp} \neq \{0\}$ puisque $G \neq H$. Dans les deux cas, la borne supérieure est atteinte et vaut $d(y, G)$.

    Ici $F^{\perp}$ est l'adhérence de $\mathrm{Vect}(\varepsilon_{2n+1})$, et $x - p_{F}(x)$ est la partie impaire $(0, \frac{1}{2}, 0, \frac{1}{8}, \dots)$, de norme au carré $\sum_{n} 4^{-(2n+1)} = \frac{1}{4} \cdot \frac{16}{15} = \frac{4}{15}$ : on retrouve $d(x, F) = \frac{2}{\sqrt{15}}$.

    *Remarque.* La formule de la question 4 présente la distance à un sous-espace comme un problème « dual » : au lieu de minimiser sur $G$, on maximise sur les directions orthogonales à $G$. Elle anticipe la dualité du chapitre 4, où les formes linéaires $y \mapsto \langle y, z \rangle$ décrivent toutes les formes continues.
- id: "l3-hf-03-02"
  feuille: "f-l3-hf-03"
  numero: 2
  partie: "Suites orthonormées, Bessel"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalité de Bessel]
  noeuds: [f-bases-hilbertiennes]
  notions: [famille-orthonormee, espace-l2-suites, produit-scalaire]
  source: "Bordeaux 2015-2016, feuille 1, exercice 9"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **L'espace des polynômes n'est jamais un espace de Hilbert.** Soit $\langle \cdot, \cdot \rangle$ un produit scalaire sur $\mathbb{C}[X]$.

    **1.** Montrer qu'il existe une base orthonormée $(P_{n})_{n \geq 0}$ de l'espace vectoriel $\mathbb{C}[X]$ telle que $\deg P_{n} = n$ pour tout $n$.

    **2.** Soit $(a_{n})_{n \geq 0}$ une suite complexe telle que $\sum_{k \geq 0} |a_{k}|^{2}$ converge. Montrer que la suite $(Q_{n})$ définie par $Q_{n} = \sum_{k=0}^{n} a_{k} P_{k}$ est de Cauchy.

    **3.** En déduire que $\big(\mathbb{C}[X], \langle \cdot, \cdot \rangle\big)$ n'est pas un espace de Hilbert.
  corrige: |
    $\triangleright$ *1.* La suite $(1, X, X^{2}, \dots)$ est libre. Le procédé de Gram-Schmidt (cours, chapitre 1, th. 2, ou l'exercice 6 de la feuille 1) fournit une suite orthonormée $(P_{n})$ telle que, pour tout $n$, 
    $$\mathrm{Vect}(P_{0}, \dots, P_{n}) = \mathrm{Vect}(1, \dots, X^{n}) = \mathbb{C}_{n}[X] .$$
     En particulier $P_{n} \in \mathbb{C}_{n}[X] \setminus \mathbb{C}_{n-1}[X]$, donc $\deg P_{n} = n$, et $(P_{n})$ engendre $\bigcup_{n} \mathbb{C}_{n}[X] = \mathbb{C}[X]$ : c'est une base orthonormée de l'espace vectoriel $\mathbb{C}[X]$.

    $\triangleright$ *2.* Pour $m > n$, par Pythagore, 
    $$\lVert Q_{m} - Q_{n} \rVert^{2} = \Big\lVert \sum_{k = n+1}^{m} a_{k} P_{k} \Big\rVert^{2} = \sum_{k = n+1}^{m} |a_{k}|^{2} ,$$
     qui tend vers $0$ quand $n, m \to +\infty$ (reste d'une série convergente) : $(Q_{n})$ est de Cauchy.

    $\triangleright$ *3.* Prenons $a_{k} = \frac{1}{k + 1}$, de sorte que $\sum |a_{k}|^{2} < +\infty$ et que tous les $a_{k}$ sont non nuls. Supposons que $\mathbb{C}[X]$ soit complet : $Q_{n}$ converge vers un polynôme $Q$, de degré $d$. Par continuité du produit scalaire, pour tout $k$, 
    $$\langle Q, P_{k} \rangle = \lim_{n \to +\infty} \langle Q_{n}, P_{k} \rangle = a_{k} ,$$
     puisque $\langle Q_{n}, P_{k} \rangle = a_{k}$ dès que $n \geq k$. Mais $Q \in \mathrm{Vect}(P_{0}, \dots, P_{d})$ est orthogonal à $P_{d+1}$, d'où $a_{d+1} = 0$ : contradiction. $\mathbb{C}[X]$ n'est complet pour aucun produit scalaire.

    *Remarque.* Le même argument vaut pour tout espace préhilbertien de dimension infinie dénombrable : un espace de Hilbert de dimension infinie n'a jamais de base algébrique dénombrable. C'est pourquoi la notion utile en dimension infinie est celle de base *hilbertienne*, où l'on autorise les sommes infinies convergentes.
- id: "l3-hf-03-03"
  feuille: "f-l3-hf-03"
  numero: 3
  partie: "Suites orthonormées, Bessel"
  etoiles: 1
  types: [Démonstration]
