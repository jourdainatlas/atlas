  source: "Bordeaux, TD 4, exercice 9"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    On dit que $X$ suit la loi de Pareto $\mathrm{Par}(a, \theta)$, avec $a, \theta > 0$, si $X = \theta\mathrm{e}^{Y}$, où $Y \sim \mathcal{E}(a)$. Soit $(X_{n})$ une suite de variables indépendantes de loi $\mathrm{Par}(a, \theta)$, et $\widehat{\theta}_{n} = \mathop{\displaystyle \min}(X_{1}, \dots, X_{n})$.

    **1.** Déterminer la fonction de répartition de $X$, et vérifier que $\widehat{\theta}_{n} \sim \mathrm{Par}(na, \theta)$.

    **2.** Montrer, par le lemme de Borel-Cantelli, que $\widehat{\theta}_{n} \xrightarrow{\text{p.s.}} \theta$. Retrouver ce résultat par un argument de monotonie.

    **3.** Montrer que $n(\widehat{\theta}_{n} - \theta)$ converge en loi vers une loi exponentielle dont on précisera le paramètre.
  corrige: |
    **1.** Pour $x \geqslant \theta$, $\mathbb{P}(X \leqslant x) = \mathbb{P}(Y \leqslant \ln\dfrac{x}{\theta}) = \boxed{1 - \big(\dfrac{\theta}{x}\big)^{a}}$, et $0$ pour $x < \theta$. Par indépendance, $\mathbb{P}(\widehat{\theta}_{n} > x) = \big(\dfrac{\theta}{x}\big)^{na}$ : $\boxed{\widehat{\theta}_{n} \sim \mathrm{Par}(na, \theta)}$.

    **2.** $\widehat{\theta}_{n} \geqslant \theta$, et $\mathbb{P}(\widehat{\theta}_{n} > \theta + \varepsilon) = r^{n}$ avec $r = \big(\dfrac{\theta}{\theta + \varepsilon}\big)^{a} < 1$, terme d'une série convergente : par Borel-Cantelli et $\varepsilon = \dfrac{1}{j}$, $\boxed{\widehat{\theta}_{n} \xrightarrow{\text{p.s.}} \theta}$.

    Par monotonie : la suite $(\widehat{\theta}_{n})$ décroît et reste minorée par $\theta$, elle converge en tout point vers une limite $L \geqslant \theta$, et $\mathbb{P}(L > \theta + \varepsilon) \leqslant \mathbb{P}(\widehat{\theta}_{n} > \theta + \varepsilon) = r^{n} \to 0$, donc $L = \theta$ presque sûrement.

    **3.** Pour $t \geqslant 0$, $\mathbb{P}\big(n(\widehat{\theta}_{n} - \theta) > t\big) = \big(1 + \dfrac{t}{n\theta}\big)^{-na} \to \mathrm{e}^{-at/\theta}$ : $\boxed{n(\widehat{\theta}_{n} - \theta) \xrightarrow{\mathcal{L}} \mathcal{E}\big(\tfrac{a}{\theta}\big)}$. L'erreur de l'estimateur est de l'ordre de $\dfrac{1}{n}$, bien plus petite que l'ordre $\dfrac{1}{\sqrt{n}}$ d'une moyenne empirique : le minimum « colle » au bord du support.
- id: "l3-pr-08-19"
  feuille: "f-l3-pr-08"
  numero: 19
  partie: "Convergence en loi"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convergence en loi]
  noeuds: [p-convergences, fo-loi-esperances]
  notions: [convergence-loi]
  source: "Durand, exercices 4.15 et 4.34"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *(Lois des extrêmes.)* Soit $(X_{n})$ une suite de variables indépendantes de fonction de répartition $F$, et $M_{n} = \mathop{\displaystyle \max}(X_{1}, \dots, X_{n})$. Exprimer la fonction de répartition de $M_{n}$, puis déterminer la loi limite de :

    **1.** $\dfrac{M_{n}}{n^{1/\alpha}}$, lorsque $F(x) = (1 - x^{-\alpha})\mathbf{1}_{\{x \geqslant 1\}}$, $\alpha > 0$ (loi de Fréchet) ; plus généralement, $\dfrac{M_{n}}{n^{1/\lambda}}$ lorsque $x^{\lambda}\mathbb{P}(X_{1} > x) \to \alpha > 0$ ;

    **2.** $n^{1/\beta}M_{n}$, lorsque $F(x) = 1 - |x|^{\beta}$ sur $[-1, 0]$ et $F(x) = 1$ pour $x > 0$, $\beta > 0$ (loi de Weibull) ;

    **3.** $M_{n} - \ln n$, lorsque $X_{1} \sim \mathcal{E}(1)$ (loi de Gumbel) ; montrer aussi que $\dfrac{M_{n}}{\ln n} \xrightarrow{\mathbb{P}} 1$.

    *Application.* La quantité annuelle $X$ (en grammes) d'un contaminant absorbée par une personne vérifie $\mathbb{P}(X > x) \approx \alpha x^{-\lambda}$ pour $x$ grand, avec $\alpha = 3{,}54 \cdot 10^{-9}$ et $\lambda = 2{,}58$. Le seuil toxique est de $0{,}71$ microgramme par jour et par kilogramme, pour une personne de $70$ kg. Estimer la probabilité qu'au moins une personne dépasse le seuil dans un groupe de $225\,000$ personnes, puis dans un groupe de $100$ personnes, et la taille du groupe pour laquelle cette probabilité atteint $95\,\%$.
  corrige: |
    Par indépendance, $\boxed{F_{M_{n}} = F^{n}}$.

    **1.** Pour $x > 0$ et $n$ assez grand ($xn^{1/\alpha} \geqslant 1$), $\mathbb{P}(M_{n} \leqslant xn^{1/\alpha}) = \big(1 - \dfrac{x^{-\alpha}}{n}\big)^{n} \to \mathrm{e}^{-x^{-\alpha}}$, et la limite est $0$ pour $x \leqslant 0$ : $\dfrac{M_{n}}{n^{1/\alpha}}$ converge en loi vers la loi de Fréchet, de fonction de répartition $\boxed{\mathrm{e}^{-x^{-\alpha}}\mathbf{1}_{\{x > 0\}}}$. Plus généralement, si $x^{\lambda}\mathbb{P}(X_{1} > x) \to \alpha$, alors $\mathbb{P}(X_{1} > xn^{1/\lambda}) \sim \dfrac{\alpha x^{-\lambda}}{n}$, et $\mathbb{P}(M_{n} \leqslant xn^{1/\lambda}) \to \boxed{\mathrm{e}^{-\alpha x^{-\lambda}}}$ pour $x > 0$ (on utilise $(1 - \dfrac{u_{n}}{n})^{n} \to \mathrm{e}^{-u}$ si $u_{n} \to u$).

    **2.** Pour $x < 0$ et $n$ assez grand, $xn^{-1/\beta} \in [-1, 0]$ et $\mathbb{P}(n^{1/\beta}M_{n} \leqslant x) = \big(1 - \dfrac{|x|^{\beta}}{n}\big)^{n} \to \mathrm{e}^{-|x|^{\beta}}$ ; pour $x \geqslant 0$, la probabilité vaut $1$. Limite : la loi de Weibull, de fonction de répartition $\boxed{\mathrm{e}^{-|x|^{\beta}}}$ pour $x < 0$ et $1$ pour $x \geqslant 0$.

    **3.** Pour $x \in \mathbb{R}$ et $n > \mathrm{e}^{-x}$, $\mathbb{P}(M_{n} - \ln n \leqslant x) = \big(1 - \dfrac{\mathrm{e}^{-x}}{n}\big)^{n} \to \boxed{\exp(-\mathrm{e}^{-x})}$, fonction de répartition de la loi de Gumbel. Notons $G$ cette fonction. Pour $A > 0$ et $n$ tel que $\varepsilon\ln n \geqslant A$, 
    $$\mathbb{P}\big(|M_{n} - \ln n| > \varepsilon\ln n\big) \leqslant \mathbb{P}(M_{n} - \ln n > A) + \mathbb{P}(M_{n} - \ln n \leqslant -A),$$
     de limite $1 - G(A) + G(-A)$, arbitrairement petite pour $A$ grand : $\boxed{\dfrac{M_{n}}{\ln n} \xrightarrow{\mathbb{P}} 1}$.

    1.5em

    ![Figure](documents/figures/864ac8b56c2dc34f.svg)

    La fonction de répartition de $M_{n} - \ln n$ pour $n = 2$ et $n = 10$ exponentielles, et sa limite de Gumbel (en tirets). L'écart maximal vaut $0{,}16$ pour $n = 2$ et $0{,}028$ pour $n = 10$ : la convergence est rapide.

    *Application.* Le seuil annuel est $d = 0{,}71 \cdot 10^{-6} \times 70 \times 365 \approx 0{,}0181$ g, et la probabilité de dépassement pour une personne est $p = \mathbb{P}(X > d) \approx \alpha d^{-\lambda} \approx 1{,}10 \cdot 10^{-4}$. Pour un groupe de $N$ personnes, par la question 1 (ou directement), on a 
    $$\mathbb{P}(\max > d) = 1 - (1 - p)^{N} \approx 1 - \mathrm{e}^{-Np} :$$

    • pour $N = 225\,000$, $Np \approx 24{,}8$ et la probabilité vaut $\boxed{\text{pratiquement } 1}$ ;

    • pour $N = 100$, elle vaut $\boxed{\approx 0{,}011}$ ;

    • elle atteint $95\,\%$ pour $Np = \ln 20$, soit $\boxed{N \approx 27\,200}$ personnes.

    Un risque individuel négligeable devient une quasi-certitude à l'échelle d'une population.
