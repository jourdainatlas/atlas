  enonce: |
    **1.** Soit $(T_{k})_{k \geqslant 2}$ une suite de variables indépendantes, $T_{k}$ de loi exponentielle de paramètre $\ln k$. Calculer $\mathbb{P}(T_{k} \geqslant 1)$ et $\mathbb{P}(T_{k} \geqslant 1 + \varepsilon)$ pour $\varepsilon > 0$, puis montrer que $\mathop{\displaystyle \limsup_{k}}T_{k} = 1$ presque sûrement.

    **2.** Soit $\alpha > 1$, et $(X_{k})_{k \geqslant 1}$ indépendantes de densité $(\alpha - 1)x^{-\alpha}\mathbf{1}_{\{x \geqslant 1\}}$. Calculer $\mathbb{P}(X_{1} > x)$ pour $x \geqslant 1$, et montrer que $\mathop{\displaystyle \limsup_{k}}\dfrac{\ln X_{k}}{\ln k} = \dfrac{1}{\alpha - 1}$ presque sûrement.
  corrige: |
    **1.** $\mathbb{P}(T_{k} \geqslant 1) = \mathrm{e}^{-\ln k} = \boxed{\dfrac{1}{k}}$ et $\mathbb{P}(T_{k} \geqslant 1 + \varepsilon) = \boxed{k^{-1 - \varepsilon}}$.

    La série $\mathop{\displaystyle \sum}\dfrac{1}{k}$ diverge et les $T_{k}$ sont indépendantes : par Borel-Cantelli (ii), $T_{k} \geqslant 1$ pour une infinité de $k$, presque sûrement, donc $\mathop{\displaystyle \limsup} T_{k} \geqslant 1$. La série $\mathop{\displaystyle \sum} k^{-1 - \varepsilon}$ converge : par (i), $T_{k} < 1 + \varepsilon$ à partir d'un rang, donc $\mathop{\displaystyle \limsup} T_{k} \leqslant 1 + \varepsilon$. En prenant $\varepsilon = \dfrac{1}{j}$ pour tout $j$ (réunion dénombrable d'évènements négligeables), $\boxed{\mathop{\displaystyle \limsup_{k}}T_{k} = 1 \text{ p.s.}}$

    **2.** $\mathbb{P}(X_{1} > x) = \mathop{\displaystyle \int_{x}^{+\infty}}(\alpha - 1)u^{-\alpha}\,\mathrm{d} u = \boxed{x^{1 - \alpha}}$ pour $x \geqslant 1$. Pour $c > 0$, 
    $$\mathbb{P}\Big(\frac{\ln X_{k}}{\ln k} > c\Big) = \mathbb{P}(X_{k} > k^{c}) = k^{-c(\alpha - 1)},$$
     terme d'une série convergente si et seulement si $c(\alpha - 1) > 1$. Les deux lemmes de Borel-Cantelli donnent, comme à la question 1, $\mathop{\displaystyle \limsup} \leqslant c$ pour $c > \dfrac{1}{\alpha - 1}$ et $\mathop{\displaystyle \limsup} \geqslant c$ pour $c < \dfrac{1}{\alpha - 1}$ : $\boxed{\mathop{\displaystyle \limsup_{k}}\dfrac{\ln X_{k}}{\ln k} = \dfrac{1}{\alpha - 1} \text{ p.s.}}$ Plus la queue est lourde ($\alpha$ proche de $1$), plus les records sont grands : $X_{k}$ atteint infiniment souvent des valeurs de l'ordre de $k^{1/(\alpha - 1)}$.
- id: "l3-pr-08-05"
  feuille: "f-l3-pr-08"
  numero: 5
  partie: "Limites d'évènements, lemme de Borel-Cantelli"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lemme de Borel-Cantelli]
  noeuds: [p-borel-cantelli]
  notions: [convergence-presque-sure]
  source: "Durand, exercice 3.18"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $(X_{k})_{k \geqslant 1}$ une suite de variables indépendantes de loi $\mathcal{N}(0, 1)$, et $S_{n} = X_{1} + \dots + X_{n}$.

    **1.** Montrer que, pour $a > 0$, $\dfrac{a}{1 + a^{2}} \cdot \dfrac{\mathrm{e}^{-a^{2}/2}}{\sqrt{2\pi}} \leqslant \mathbb{P}(X_{1} > a) \leqslant \dfrac{1}{a} \cdot \dfrac{\mathrm{e}^{-a^{2}/2}}{\sqrt{2\pi}}$, et en déduire un équivalent de $\mathbb{P}(X_{1} > a)$ quand $a \to +\infty$.

    **2.** Donner la loi de $\dfrac{S_{n}}{\sqrt{n}}$. En déduire que, si $\dfrac{a_{n}}{\sqrt{n}} \to +\infty$, alors $\dfrac{S_{n}}{a_{n}} \xrightarrow{\mathbb{P}} 0$. Montrer que $\dfrac{S_{n}}{a_{n}} \xrightarrow{\text{p.s.}} 0$ lorsque $a_{n} = \sqrt{n}\,\ln n$.

    **3.** Montrer que $\mathop{\displaystyle \limsup_{n}}\dfrac{X_{n}}{\sqrt{2\ln n}} = 1$ et $\mathop{\displaystyle \limsup_{n}}\dfrac{|X_{n}|}{\sqrt{2\ln n}} = 1$ presque sûrement.
  corrige: |
    **1.** Notons $I(a) = \mathop{\displaystyle \int_{a}^{+\infty}}\mathrm{e}^{-x^{2}/2}\,\mathrm{d} x$. Une intégration par parties, avec $\mathrm{e}^{-x^{2}/2} = \dfrac{1}{x} \cdot x\mathrm{e}^{-x^{2}/2}$, donne 
    $$I(a) = \frac{\mathrm{e}^{-a^{2}/2}}{a} - \int_{a}^{+\infty}\frac{\mathrm{e}^{-x^{2}/2}}{x^{2}}\,\mathrm{d} x.$$
     La dernière intégrale est positive et majorée par $\dfrac{I(a)}{a^{2}}$. Donc $I(a) \leqslant \dfrac{\mathrm{e}^{-a^{2}/2}}{a}$, et $I(a)\big(1 + \dfrac{1}{a^{2}}\big) \geqslant \dfrac{\mathrm{e}^{-a^{2}/2}}{a}$, ce qui donne l'encadrement après division par $\sqrt{2\pi}$. Les deux bornes sont équivalentes : 
    $$\boxed{\mathbb{P}(X_{1} > a) \sim \frac{\mathrm{e}^{-a^{2}/2}}{a\sqrt{2\pi}}} \qquad (a \to +\infty).$$

    **2.** $S_{n} \sim \mathcal{N}(0, n)$ (chapitre 6, prop. 12), donc $\boxed{\dfrac{S_{n}}{\sqrt{n}} \sim \mathcal{N}(0, 1)}$ exactement. Si $\dfrac{a_{n}}{\sqrt{n}} \to +\infty$, $\mathbb{P}(|S_{n}| > \varepsilon a_{n}) = \mathbb{P}\big(|G| > \varepsilon\dfrac{a_{n}}{\sqrt{n}}\big) \to 0$ : $\boxed{\dfrac{S_{n}}{a_{n}} \xrightarrow{\mathbb{P}} 0}$.

    Pour $a_{n} = \sqrt{n}\ln n$, par la question 1, $\mathbb{P}(|S_{n}| > \varepsilon a_{n}) = \mathbb{P}(|G| > \varepsilon\ln n) \leqslant \mathrm{e}^{-\varepsilon^{2}(\ln n)^{2}/2}$ dès que $\varepsilon\ln n \geqslant 1$. Pour $n$ assez grand, $\dfrac{\varepsilon^{2}\ln n}{2} \geqslant 2$, et ce terme est majoré par $n^{-2}$ : la série converge, et le lemme de Borel-Cantelli, appliqué à $\varepsilon = \dfrac{1}{j}$, donne $\boxed{\dfrac{S_{n}}{\sqrt{n}\ln n} \xrightarrow{\text{p.s.}} 0}$.

    *Remarque.* La seule condition $\dfrac{a_{n}}{\sqrt{n}} \to +\infty$ ne suffit pas pour la convergence presque sûre : la loi du logarithme itéré, hors programme, montre que $\dfrac{S_{n}}{\sqrt{2n\ln\ln n}}$ a pour limite supérieure $1$.

    **3.** Par la question 1, pour $c > 0$, 
    $$\mathbb{P}\big(X_{n} > c\sqrt{2\ln n}\big) \sim \frac{\mathrm{e}^{-c^{2}\ln n}}{c\sqrt{2\ln n}\sqrt{2\pi}} = \frac{n^{-c^{2}}}{2c\sqrt{\pi\ln n}}.$$
     La série converge pour $c > 1$ et diverge pour $c < 1$. Les deux lemmes de Borel-Cantelli (les $X_{n}$ sont indépendantes) donnent $\boxed{\mathop{\displaystyle \limsup_{n}}\dfrac{X_{n}}{\sqrt{2\ln n}} = 1 \text{ p.s.}}$ Pour $|X_{n}|$, les probabilités sont doublées, ce qui ne change pas la nature des séries : la limite supérieure vaut encore $\boxed{1}$.

    1.5em

    ![Figure](documents/figures/a548110e5225d751.svg)

    Une simulation (graine $2026$) : les valeurs de $\dfrac{X_{n}}{\sqrt{2\ln n}}$ supérieures à $0{,}55$, pour $3 \leqslant n \leqslant 20\,000$, en échelle logarithmique en $n$. Ces valeurs restent presque toutes sous la droite rouge d'ordonnée $1$, qu'elles ne dépassent que rarement et de peu ($1{,}13$ au plus ici) : la normalisation $\sqrt{2\ln n}$ est la bonne, mais la limite supérieure est approchée très lentement.
