  enonce: |
    **1.** On suppose que $\mathbb{E}[\varphi(Z_{n})] \to \mathbb{E}[\varphi(G)]$ pour toute fonction $\varphi$ de classe $\mathcal{C}^{3}$ bornée à dérivées bornées, où $G \sim \mathcal{N}(0, 1)$. Montrer que $\mathbb{P}(Z_{n} \leqslant t) \to \Phi(t)$ pour tout réel $t$, en encadrant $\mathbf{1}_{]-\infty, t]}$ par de telles fonctions. Montrer que cette convergence est uniforme en $t$.

    **2.** Soit $X_{n} \xrightarrow{\mathcal{L}} X$, avec $\mathop{\displaystyle \sup_{n}}\mathbb{E}[|X_{n}|^{r}] < +\infty$ pour un $r > 0$. Montrer que $\mathbb{E}[|X|^{r}] < +\infty$, puis que $\mathbb{E}[f(X_{n})] \to \mathbb{E}[f(X)]$ pour toute $f$ continue telle que $f(x) = o(|x|^{r})$ quand $|x| \to +\infty$. En particulier, si $r > 1$, $\mathbb{E}[X_{n}] \to \mathbb{E}[X]$.
  corrige: |
    **1.** Soit $S(s) = 35s^{4} - 84s^{5} + 70s^{6} - 20s^{7}$ : $S(0) = 0$, $S(1) = 1$, et $S'$, $S''$, $S'''$ s'annulent en $0$ et en $1$ (vérifié par calcul formel). Pour $t \in \mathbb{R}$ et $\delta > 0$, la fonction 
    $$\varphi(x) = 1 \ (x \leqslant t), \qquad \varphi(x) = 1 - S\Big(\frac{x - t}{\delta}\Big) \ (t \leqslant x \leqslant t + \delta), \qquad \varphi(x) = 0 \ (x \geqslant t + \delta)$$
     est de classe $\mathcal{C}^{3}$, bornée à dérivées bornées, et $\mathbf{1}_{]-\infty, t]} \leqslant \varphi \leqslant \mathbf{1}_{]-\infty, t + \delta]}$. Donc 
    $$\limsup_{n}\mathbb{P}(Z_{n} \leqslant t) \leqslant \lim_{n}\mathbb{E}[\varphi(Z_{n})] = \mathbb{E}[\varphi(G)] \leqslant \Phi(t + \delta).$$
     De même, avec la fonction décalée de $-\delta$, $\mathop{\displaystyle \liminf_{n}}\mathbb{P}(Z_{n} \leqslant t) \geqslant \Phi(t - \delta)$. Comme $\Phi$ est continue, en faisant $\delta \to 0$, $\boxed{\mathbb{P}(Z_{n} \leqslant t) \to \Phi(t)}$.

    *Uniformité.* Soit $\varepsilon > 0$ et $t_{0} < t_{1} < \dots < t_{m}$ tels que $\Phi(t_{0}) \leqslant \varepsilon$, $\Phi(t_{m}) \geqslant 1 - \varepsilon$ et $\Phi(t_{j + 1}) - \Phi(t_{j}) \leqslant \varepsilon$. Notons $F_{n}$ la fonction de répartition de $Z_{n}$. Pour $t \in [t_{j}, t_{j + 1}]$, par croissance, 
    $$F_{n}(t) - \Phi(t) \leqslant F_{n}(t_{j + 1}) - \Phi(t_{j}) \leqslant |F_{n}(t_{j + 1}) - \Phi(t_{j + 1})| + \varepsilon,$$
     et de même en dessous ; pour $t < t_{0}$ ou $t > t_{m}$, on compare à $t_{0}$ ou $t_{m}$. Ainsi 
    $$\sup_{t}|F_{n}(t) - \Phi(t)| \leqslant \max_{j}|F_{n}(t_{j}) - \Phi(t_{j})| + 2\varepsilon,$$
     dont la limite supérieure est au plus $2\varepsilon$ : 
    $$\boxed{\text{la convergence est uniforme}}$$
     (théorème de Pólya). C'est ce qui permet d'écrire $\mathbb{P}(Z_{n} \leqslant t) \approx \Phi(t)$ avec une erreur indépendante de $t$.

    **2.** Soit $M = \mathop{\displaystyle \sup_{n}}\mathbb{E}[|X_{n}|^{r}]$. Pour $K > 0$, $h_{K}(x) = \mathop{\displaystyle \min}(|x|^{r}, K)$ est continue bornée, donc $\mathbb{E}[h_{K}(X)] = \mathop{\displaystyle \lim_{n}}\mathbb{E}[h_{K}(X_{n})] \leqslant M$ ; par convergence monotone ($K \to +\infty$), $\boxed{\mathbb{E}[|X|^{r}] \leqslant M}$.

    Soit $\varepsilon > 0$ et $A$ tel que $|f(x)| \leqslant \varepsilon|x|^{r}$ pour $|x| \geqslant A$. Soit $\chi$ continue, égale à $1$ sur $[-A, A]$, nulle hors de $[-A - 1, A + 1]$, à valeurs dans $[0, 1]$. La fonction $f\chi$ est continue bornée, donc $\mathbb{E}[(f\chi)(X_{n})] \to \mathbb{E}[(f\chi)(X)]$, et $|f(1 - \chi)| \leqslant \varepsilon|x|^{r}$, d'où 
    $$\limsup_{n}\big|\mathbb{E}[f(X_{n})] - \mathbb{E}[f(X)]\big| \leqslant \varepsilon M + \varepsilon\,\mathbb{E}[|X|^{r}] \leqslant 2\varepsilon M,$$
     pour tout $\varepsilon$ : $\boxed{\mathbb{E}[f(X_{n})] \to \mathbb{E}[f(X)]}$ (les espérances sont finies, car $|f| \leqslant \mathop{\displaystyle \sup_{[-A, A]}}|f| + \varepsilon|x|^{r}$). Pour $r > 1$, $f(x) = x$ convient : $\mathbb{E}[X_{n}] \to \mathbb{E}[X]$. Sans moment d'ordre $r > 1$ borné, c'est faux : $X_{n} = n$ avec probabilité $\dfrac{1}{n}$ et $0$ sinon converge en loi vers $0$, avec $\mathbb{E}[X_{n}] = 1$.

