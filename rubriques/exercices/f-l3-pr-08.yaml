  noeuds: [p-borel-cantelli]
  notions: [convergence-presque-sure]
  source: "Durand, exercice 3.13 ; Rubenthaler, chapitre 7, exercices 6 et 9"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Déterminer $\mathop{\displaystyle \bigcup_{n \geqslant 1}}[\dfrac{1}{n}, +\infty[$. Soient $B$ et $C$ deux évènements, et $A_{n} = B$ pour $n$ pair, $A_{n} = C$ pour $n$ impair. Déterminer $\mathop{\displaystyle \liminf_{n}}A_{n}$ et $\mathop{\displaystyle \limsup_{n}}A_{n}$.

    **2.** Montrer que $\overline{\mathop{\displaystyle \limsup_{n}}A_{n}} = \mathop{\displaystyle \liminf_{n}}\overline{A_{n}}$, que $\mathbf{1}_{\limsup A_{n}} = \mathop{\displaystyle \limsup_{n}}\mathbf{1}_{A_{n}}$, et que 
    $$\limsup_{n}(A_{n} \cup B_{n}) = \limsup_{n}A_{n} \cup \limsup_{n}B_{n}.$$
     A-t-on la même égalité avec des intersections ?

    **3.** Soit $(X_{n})$ une suite de variables telles que $\mathbb{E}[|X_{n}|] \leqslant \mathrm{e}^{-n}$. Montrer que $\mathbb{P}(|X_{n}| \geqslant \dfrac{1}{n}) \leqslant n\mathrm{e}^{-n}$, puis que presque sûrement $|X_{n}| < \dfrac{1}{n}$ à partir d'un certain rang. Conclure.
  corrige: |
    **1.** $\boxed{\mathop{\displaystyle \bigcup_{n \geqslant 1}}[\tfrac{1}{n}, +\infty[ \,= \,]0, +\infty[}$ : tout $x > 0$ dépasse un $\dfrac{1}{n}$, et $0$ n'est dans aucun intervalle.

    Un point est dans une infinité de $A_{n}$ s'il est dans $B$ ou dans $C$, et dans tous les $A_{n}$ à partir d'un rang s'il est dans $B$ et dans $C$ : $\boxed{\mathop{\displaystyle \liminf_{n}}A_{n} = B \cap C}$ et $\boxed{\mathop{\displaystyle \limsup_{n}}A_{n} = B \cup C}$.

    **2.** $\omega \notin \mathop{\displaystyle \limsup} A_{n}$ signifie que $\omega$ n'appartient qu'à un nombre fini de $A_{n}$, c'est-à-dire que $\omega \in \overline{A_{n}}$ à partir d'un certain rang : c'est $\omega \in \mathop{\displaystyle \liminf}\overline{A_{n}}$. La suite $(\mathbf{1}_{A_{n}}(\omega))$ ne prend que les valeurs $0$ et $1$ ; sa limite supérieure vaut $1$ si et seulement si elle vaut $1$ une infinité de fois, d'où $\mathbf{1}_{\limsup A_{n}} = \mathop{\displaystyle \limsup}\mathbf{1}_{A_{n}}$.

    Si $\omega$ est dans une infinité de $A_{n} \cup B_{n}$, il est dans une infinité de $A_{n}$ ou dans une infinité de $B_{n}$ (sinon il ne serait que dans un nombre fini des deux) ; l'inclusion inverse est claire : on a l'égalité.

    Pour les intersections, on n'a que $\mathop{\displaystyle \limsup}(A_{n} \cap B_{n}) \subset \mathop{\displaystyle \limsup} A_{n} \cap \mathop{\displaystyle \limsup} B_{n}$. L'inclusion est stricte en général : avec $B \cap C = \emptyset$, $A_{n}$ comme à la question 1 et $B_{n} = A_{n + 1}$, on a $A_{n} \cap B_{n} = \emptyset$ pour tout $n$, alors que $\mathop{\displaystyle \limsup} A_{n} \cap \mathop{\displaystyle \limsup} B_{n} = B \cup C$.

    **3.** Par Markov, $\mathbb{P}(|X_{n}| \geqslant \dfrac{1}{n}) \leqslant n\,\mathbb{E}[|X_{n}|] \leqslant \boxed{n\mathrm{e}^{-n}}$, terme général d'une série convergente. Par le lemme de Borel-Cantelli (i), presque sûrement $|X_{n}| \geqslant \dfrac{1}{n}$ n'a lieu que pour un nombre fini de $n$ : à partir d'un rang (aléatoire), $|X_{n}| < \dfrac{1}{n}$, et $\boxed{X_{n} \xrightarrow{\text{p.s.}} 0}$.
