  page_corrige: 4
  enonce: |
    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables indépendantes de même loi, de fonction de répartition $F$, et $b = \mathop{\displaystyle \inf}\{t \in \mathbb{R} : F(t) = 1\}$, avec $b = +\infty$ si cet ensemble est vide.

    **1.** Montrer que $F(b) = 1$ lorsque $b < +\infty$. Pour $t < b$, montrer que, presque sûrement, $X_{n} > t$ pour une infinité de $n$. En déduire que $\mathop{\displaystyle \limsup_{n}}X_{n} = b$ presque sûrement, puis que $M_{n} = \mathop{\displaystyle \max}(X_{1}, \dots, X_{n})$ converge presque sûrement vers $b$.

    **2.** Que peut-on dire d'une suite de variables indépendantes de même loi qui converge presque sûrement vers une limite réelle ?

    **3.** Montrer que $\mathbb{E}[|X_{1}|] < +\infty$ si et seulement si $\mathop{\displaystyle \sum_{n}}\mathbb{P}(|X_{n}| > n) < +\infty$. En déduire que, si $X_{1}$ est intégrable, $\dfrac{X_{n}}{n} \to 0$ presque sûrement, et que, si $\mathbb{E}[|X_{1}|] = +\infty$, alors $\mathop{\displaystyle \limsup_{n}}\dfrac{|X_{n}|}{n} = +\infty$ et $\mathop{\displaystyle \limsup_{n}}\dfrac{|X_{1} + \dots + X_{n}|}{n} = +\infty$ presque sûrement.
  corrige: |
    **1.** Si $b < +\infty$, $F(t) = 1$ pour tout $t > b$ (car $F$ croît et $b$ est une borne inférieure), et par continuité à droite $\boxed{F(b) = 1}$.

    Pour $t < b$, $\mathbb{P}(X_{n} > t) = 1 - F(t) > 0$ ne dépend pas de $n$ : la série $\mathop{\displaystyle \sum}\mathbb{P}(X_{n} > t)$ diverge, et par Borel-Cantelli (ii), presque sûrement, $X_{n} > t$ pour une infinité de $n$, donc $\mathop{\displaystyle \limsup} X_{n} \geqslant t$. En prenant $t$ dans une suite de rationnels qui croît vers $b$, $\mathop{\displaystyle \limsup} X_{n} \geqslant b$ p.s. Par ailleurs $X_{n} \leqslant b$ p.s. pour tout $n$ (car $F(b) = 1$). Donc $\boxed{\mathop{\displaystyle \limsup_{n}}X_{n} = b \text{ p.s.}}$, y compris si $b = +\infty$. La suite $(M_{n})$ est croissante, majorée par $b$, et $M_{n} \geqslant X_{n}$ : elle converge vers une limite comprise entre $\mathop{\displaystyle \limsup} X_{n} = b$ et $b$ : $\boxed{M_{n} \xrightarrow{\text{p.s.}} b}$, la borne supérieure essentielle de la loi.

    **2.** Le même raisonnement donne $\mathop{\displaystyle \liminf} X_{n} = a = \mathop{\displaystyle \sup}\{t : F(t) = 0\}$. Si la suite converge presque sûrement vers une limite réelle $L$, on a $a = L = b$ : la loi commune est 
    $$\boxed{\text{la masse de Dirac en } L}.$$
     Une suite de variables indépendantes de même loi non constante ne converge jamais presque sûrement.

    **3.** Par la prop. 6 du chapitre 4, $\mathbb{E}[|X_{1}|] = \mathop{\displaystyle \int_{0}^{+\infty}}\mathbb{P}(|X_{1}| > t)\,\mathrm{d} t$. La fonction $t \mapsto \mathbb{P}(|X_{1}| > t)$ décroît, d'où, par comparaison série-intégrale, 
    $$\sum_{n \geqslant 1}\mathbb{P}(|X_{1}| > n) \leqslant \mathbb{E}[|X_{1}|] \leqslant 1 + \sum_{n \geqslant 1}\mathbb{P}(|X_{1}| > n),$$
     et $\mathbb{P}(|X_{n}| > n) = \mathbb{P}(|X_{1}| > n)$ : d'où l'équivalence annoncée.

    Si $X_{1}$ est intégrable, $\dfrac{X_{1}}{\varepsilon}$ l'est aussi, donc $\mathop{\displaystyle \sum_{n}}\mathbb{P}(|X_{n}| > \varepsilon n) < +\infty$, et par Borel-Cantelli (i), $\dfrac{|X_{n}|}{n} \leqslant \varepsilon$ à partir d'un rang : $\boxed{\dfrac{X_{n}}{n} \xrightarrow{\text{p.s.}} 0}$.

    Si $\mathbb{E}[|X_{1}|] = +\infty$, pour tout $c > 0$, $\mathop{\displaystyle \sum_{n}}\mathbb{P}(|X_{n}| > cn) = +\infty$ ; par indépendance et Borel-Cantelli (ii), $|X_{n}| > cn$ une infinité de fois : $\boxed{\mathop{\displaystyle \limsup}\dfrac{|X_{n}|}{n} = +\infty}$. Enfin $|X_{n}| \leqslant |S_{n}| + |S_{n - 1}|$, avec $S_{n} = X_{1} + \dots + X_{n}$ ; si $\dfrac{|S_{n}|}{n}$ restait bornée, $\dfrac{|X_{n}|}{n}$ le serait aussi. Donc $\boxed{\mathop{\displaystyle \limsup}\dfrac{|S_{n}|}{n} = +\infty}$ : la moyenne empirique d'une suite non intégrable ne converge pas. C'est la réciproque de la loi forte des grands nombres (chapitre 9).
- id: "l3-pr-08-07"
  feuille: "f-l3-pr-08"
  numero: 7
  partie: "Limites d'évènements, lemme de Borel-Cantelli"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [lemme de Borel-Cantelli]
  noeuds: [p-borel-cantelli]
  notions: [convergence-presque-sure]
  source: "Durand, exercice 3.30"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Sur $\Omega = \,]0, 1[$ muni de la probabilité uniforme, on écrit $\omega = \mathop{\displaystyle \sum_{i \geqslant 1}}2^{-i}d_{i}(\omega)$, avec $d_{i} \in \{0, 1\}$, en choisissant le développement qui ne se termine pas par des $0$. Pour $n \geqslant 1$, soit $L_{n}$ la longueur de la plage de zéros qui commence au rang $n$ : 
    $$L_{n} = \max\{k \geqslant 0 : d_{n} = \dots = d_{n + k - 1} = 0\}, \qquad e_{n} = 2^{n - 1}\Big(\omega - \sum_{i < n}2^{-i}d_{i}\Big).$$

    **1.** On admet que les $d_{i}$ sont indépendantes de loi $\mathcal{B}(\dfrac{1}{2})$ (chapitre 3, prop. 9). Déterminer la loi de $L_{n}$, et montrer que $2^{-(L_{n} + 1)} \leqslant e_{n} \leqslant 2^{-L_{n}}$.

    **2.** Soit $\varepsilon > 0$. Montrer que, presque sûrement, $L_{n} \geqslant (1 + \varepsilon)\log_{2}n$ n'a lieu que pour un nombre fini de $n$.

    **3.** Soit $u_{n} = \lceil\log_{2}n\rceil$, et la suite définie par $n_{1} = 2$, $n_{k + 1} = n_{k} + u_{n_{k}}$. Montrer que $\mathop{\displaystyle \sum_{n \geqslant 2}}\dfrac{2^{-u_{n}}}{u_{n}} = +\infty$, puis que $\mathop{\displaystyle \sum_{k}}2^{-u_{n_{k}}} = +\infty$.

    **4.** En déduire que $L_{n} \geqslant \log_{2}n$ pour une infinité de $n$, presque sûrement, et conclure que $\mathop{\displaystyle \limsup_{n}}\dfrac{L_{n}}{\log_{2}n} = 1$ presque sûrement. Traduire ce résultat sur $e_{n}$.
  corrige: |
    **1.** $\{L_{n} \geqslant k\} = \{d_{n} = \dots = d_{n + k - 1} = 0\}$, de probabilité $2^{-k}$ par indépendance. Donc $\boxed{\mathbb{P}(L_{n} = k) = 2^{-(k + 1)}}$ pour $k \in \mathbb{N}$ : $L_{n} + 1$ suit la loi $\mathcal{G}(\dfrac{1}{2})$ (et $L_{n}$ est fini, puisque le développement ne se termine pas par des $0$).

    On a $e_{n} = \mathop{\displaystyle \sum_{i \geqslant n}}2^{n - 1 - i}d_{i} = \mathop{\displaystyle \sum_{j \geqslant 1}}2^{-j}d_{n - 1 + j}$ : c'est le nombre dont les chiffres binaires sont $d_{n}, d_{n + 1}, \dots$ Son premier chiffre non nul est le $(L_{n} + 1)$-ième, donc $e_{n} \geqslant 2^{-(L_{n} + 1)}$, et $e_{n} \leqslant \mathop{\displaystyle \sum_{j \geqslant L_{n} + 1}}2^{-j} = 2^{-L_{n}}$.

    **2.** $\mathbb{P}(L_{n} \geqslant (1 + \varepsilon)\log_{2}n) \leqslant 2^{-(1 + \varepsilon)\log_{2}n} = n^{-1 - \varepsilon}$, terme d'une série convergente : par Borel-Cantelli (i), l'évènement n'a lieu qu'un nombre fini de fois, presque sûrement.

    **3.** $u_{n} \leqslant \log_{2}n + 1$, donc $2^{-u_{n}} \geqslant \dfrac{1}{2n}$ et $\dfrac{2^{-u_{n}}}{u_{n}} \geqslant \dfrac{1}{2n(\log_{2}n + 1)}$, terme d'une série divergente (comparaison avec $\mathop{\displaystyle \int}\dfrac{\mathrm{d} x}{x\ln x}$).

    Regroupons les $n$ par blocs $[n_{k}, n_{k + 1}[$, de longueur $u_{n_{k}}$. Sur un bloc, $u_{n} \geqslant u_{n_{k}}$ (car $(u_{n})$ croît), donc 
    $$\sum_{n_{k} \leqslant n < n_{k + 1}}\frac{2^{-u_{n}}}{u_{n}} \leqslant u_{n_{k}} \cdot \frac{2^{-u_{n_{k}}}}{u_{n_{k}}} = 2^{-u_{n_{k}}},$$
     et en sommant, $\boxed{\mathop{\displaystyle \sum_{k}}2^{-u_{n_{k}}} = +\infty}$.

    **4.** Les évènements $A_{k} = \{L_{n_{k}} \geqslant u_{n_{k}}\} = \{d_{n_{k}} = \dots = d_{n_{k + 1} - 1} = 0\}$ portent sur des blocs de chiffres disjoints : ils sont indépendants (fonctions de paquets disjoints de variables indépendantes), de probabilités $2^{-u_{n_{k}}}$, de somme infinie. Par Borel-Cantelli (ii), une infinité d'entre eux se réalisent presque sûrement : $L_{n_{k}} \geqslant u_{n_{k}} \geqslant \log_{2}n_{k}$ pour une infinité de $k$.

    Donc $\mathop{\displaystyle \limsup}\dfrac{L_{n}}{\log_{2}n} \geqslant 1$, et la question 2 donne $\leqslant 1 + \varepsilon$ pour tout $\varepsilon$ : $\boxed{\mathop{\displaystyle \limsup_{n}}\dfrac{L_{n}}{\log_{2}n} = 1 \text{ p.s.}}$

    Sur $e_{n}$ : par l'encadrement de la question 1, presque sûrement, $e_{n} \leqslant 2^{-L_{n}} \leqslant \dfrac{1}{n}$ une infinité de fois, mais $e_{n} \geqslant 2^{-L_{n} - 1} > \dfrac{1}{2}n^{-1 - \varepsilon}$ à partir d'un rang. *Interprétation.* Le « reste » $e_{n}$ du développement dyadique d'un nombre tiré au hasard descend infiniment souvent jusqu'à $\dfrac{1}{n}$, presque jamais beaucoup plus bas : des plages de zéros de longueur $\log_{2}n$ apparaissent, pas de longueur $(1 + \varepsilon)\log_{2}n$.
- id: "l3-pr-08-08"
  feuille: "f-l3-pr-08"
  numero: 8
  partie: "Modes de convergence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 4, exercice 5 ; Durand, exercices 3.23 (2), (4) et 3.28"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Étudier les convergences presque sûre, dans $L^{1}$ et en probabilité vers $0$ des suites suivantes, formées de variables indépendantes :

    **1.** $\mathbb{P}(X_{n} = n^{2}) = p_{n}$ et $\mathbb{P}(X_{n} = 0) = 1 - p_{n}$, pour $p_{n} = \dfrac{1}{n}$, puis pour $p_{n} = \dfrac{1}{n^{2}}$ ; puis $\mathbb{P}(Z_{n} = n^{3}) = \dfrac{1}{n^{2}} = 1 - \mathbb{P}(Z_{n} = 0)$ ;

    **2.** $\mathbb{P}(Y_{n} = n) = \mathbb{P}(Y_{n} = -n) = \dfrac{1}{2n^{2}}$ et $\mathbb{P}(Y_{n} = 0) = 1 - \dfrac{1}{n^{2}}$ (étudier aussi la convergence dans $L^{2}$) ;

    **3.** $X_{n} \sim \mathcal{P}(\lambda_{n})$, avec $\lambda_{n} \to 0$ ;

    **4.** $X_{n} \sim \mathcal{B}(p_{n})$ : caractériser la convergence vers $0$ en probabilité, puis presque sûrement. Pour $p_{n} = \dfrac{1}{n}$, extraire une sous-suite qui converge presque sûrement.
  corrige: |
    On utilise : $\mathbb{P}(|X_{n}| > \varepsilon) = \mathbb{P}(X_{n} \neq 0)$ pour $\varepsilon$ petit, $\mathbb{E}[|X_{n}|]$ pour $L^{1}$, et les deux lemmes de Borel-Cantelli, avec l'indépendance, pour la convergence presque sûre : $X_{n} \to 0$ p.s. si et seulement si $\mathop{\displaystyle \sum}\mathbb{P}(X_{n} \neq 0) < +\infty$, lorsque les $X_{n}$ ne prennent que la valeur non nulle « grande ».

    **1.** Pour $p_{n} = \dfrac{1}{n}$ : $\mathbb{E}[X_{n}] = n \to +\infty$, pas de convergence dans $L^{1}$ ; $\mathbb{P}(X_{n} \neq 0) = \dfrac{1}{n} \to 0$, convergence en probabilité ; $\mathop{\displaystyle \sum}\dfrac{1}{n} = +\infty$, donc $X_{n} = n^{2}$ une infinité de fois, pas de convergence presque sûre.

    Pour $p_{n} = \dfrac{1}{n^{2}}$ : $\mathbb{E}[X_{n}] = 1$, pas de convergence dans $L^{1}$ ; convergence en probabilité ; $\mathop{\displaystyle \sum}\dfrac{1}{n^{2}} < +\infty$, convergence presque sûre. De même pour $Z_{n}$ : $\mathbb{E}[Z_{n}] = n$, mais convergence presque sûre et en probabilité.

    $$\begin{array}{|c|c|c|c|c|} \hline  & \text{p.s.} & L^{1} & L^{2} & \text{probabilité} \\ \hline X_{n}\text{, }p_{n} = \frac{1}{n} & \text{non} & \text{non} & \text{non} & \text{oui} \\ \hline X_{n}\text{, }p_{n} = \frac{1}{n^{2}} & \text{oui} & \text{non} & \text{non} & \text{oui} \\ \hline Z_{n} & \text{oui} & \text{non} & \text{non} & \text{oui} \\ \hline Y_{n} & \text{oui} & \text{oui} & \text{non} & \text{oui} \\ \hline \end{array}$$

    **2.** $\mathbb{E}[|Y_{n}|] = \dfrac{n}{n^{2}} = \dfrac{1}{n} \to 0$ : convergence dans $L^{1}$, donc en probabilité ; $\mathbb{E}[Y_{n}^{2}] = 1$ : pas de convergence dans $L^{2}$ ; $\mathop{\displaystyle \sum}\mathbb{P}(Y_{n} \neq 0) = \mathop{\displaystyle \sum}\dfrac{1}{n^{2}} < +\infty$ : convergence presque sûre. Ces exemples montrent qu'aucune implication n'existe entre convergence presque sûre et convergence dans $L^{p}$, et que $L^{1}$ n'entraîne pas $L^{2}$.

    **3.** $\mathbb{E}[X_{n}] = \lambda_{n} \to 0$ : convergence dans $L^{1}$, donc en probabilité. Comme $\mathbb{P}(X_{n} \neq 0) = 1 - \mathrm{e}^{-\lambda_{n}} \sim \lambda_{n}$, la convergence presque sûre a lieu si $\mathop{\displaystyle \sum}\lambda_{n} < +\infty$, et, par indépendance, n'a pas lieu si $\mathop{\displaystyle \sum}\lambda_{n} = +\infty$.

    **4.** $X_{n} \xrightarrow{\mathbb{P}} 0$ si et seulement si $\boxed{p_{n} \to 0}$, et $X_{n} \xrightarrow{\text{p.s.}} 0$ si et seulement si $\boxed{\mathop{\displaystyle \sum} p_{n} < +\infty}$ (les deux lemmes de Borel-Cantelli). Pour $p_{n} = \dfrac{1}{n}$, la sous-suite $(X_{k^{2}})$ converge presque sûrement, car $\mathop{\displaystyle \sum}\dfrac{1}{k^{2}} < +\infty$ : c'est le théorème 4 (v) sur un exemple.
- id: "l3-pr-08-09"
  feuille: "f-l3-pr-08"
  numero: 9
  partie: "Modes de convergence"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Bordeaux, TD 4, exercice 4"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $(X_{n})$ une suite de variables indépendantes de loi $\mathcal{P}(\lambda)$, $\lambda > 0$, et $P_{n} = X_{1}X_{2}\cdots X_{n}$. Montrer que $P_{n} \xrightarrow{\text{p.s.}} 0$. Calculer $\mathbb{E}[P_{n}]$, et en déduire que $(P_{n})$ ne converge pas vers $0$ dans $L^{1}$ lorsque $\lambda \geqslant 1$. Que se passe-t-il pour $\lambda < 1$ ?
  corrige: |
    $\mathbb{P}(X_{1} \neq 0, \dots, X_{n} \neq 0) = (1 - \mathrm{e}^{-\lambda})^{n} \to 0$ : presque sûrement, l'un des $X_{k}$ est nul, et alors $P_{n} = 0$ pour tout $n \geqslant k$. Donc $\boxed{P_{n} \xrightarrow{\text{p.s.}} 0}$, et la suite est même stationnaire.

    Par indépendance, $\boxed{\mathbb{E}[P_{n}] = \lambda^{n}}$. Si $\lambda \geqslant 1$, $\mathbb{E}[|P_{n} - 0|] = \lambda^{n} \geqslant 1$ : 
    $$\boxed{\text{pas de convergence dans } L^{1}}.$$
     Pour $\lambda > 1$, l'espérance tend même vers $+\infty$, portée par des évènements de plus en plus rares où tous les $X_{k}$ sont grands. Si $\lambda < 1$, $\mathbb{E}[P_{n}] = \lambda^{n} \to 0$ et $P_{n} \geqslant 0$ : $\boxed{P_{n} \xrightarrow{L^{1}} 0}$.
- id: "l3-pr-08-10"
  feuille: "f-l3-pr-08"
  numero: 10
  partie: "Modes de convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Durand, exercices 3.23 (1) et 3.29 ; Rubenthaler, chapitre 8, exercice 2"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Montrer que si $\mathop{\displaystyle \sum_{n}}\mathbb{P}(|X_{n} - X| \geqslant \varepsilon) < +\infty$ pour tout $\varepsilon > 0$, alors $X_{n} \xrightarrow{\text{p.s.}} X$. Cette condition est-elle nécessaire ? On pourra considérer $X_{n} = \dfrac{C}{n}$, où $C$ suit la loi de Cauchy.

    **2.** Soient $(X_{n})$, $(Y_{n})$, $X$, $Y$ des variables réelles. Montrer que $X_{n} \xrightarrow{\mathbb{P}} X$ et $Y_{n} \xrightarrow{\mathbb{P}} Y$ si et seulement si le vecteur $(X_{n}, Y_{n})$ converge en probabilité vers $(X, Y)$, c'est-à-dire $\mathbb{P}(\|(X_{n} - X, Y_{n} - Y)\| > \varepsilon) \to 0$ pour tout $\varepsilon > 0$. En déduire que $X_{n} + Y_{n} \xrightarrow{\mathbb{P}} X + Y$, puis que $f(X_{n}, Y_{n}) \xrightarrow{\mathbb{P}} f(X, Y)$ pour toute $f : \mathbb{R}^{2} \to \mathbb{R}$ continue ; on pourra commencer par le cas où $f$ est uniformément continue.

    **3.** Soit $f : \mathbb{R} \to \mathbb{R}$ telle que $|f(x) - f(y)| \leqslant C\mathop{\displaystyle \min}(1, |x - y|)$ pour tous $x, y$. Montrer que si $X_{n} \xrightarrow{\text{p.s.}} X$, alors $\mathbb{E}[f(X_{n})] \to \mathbb{E}[f(X)]$ et $\mathbb{P}(|f(X_{n}) - f(X)| \geqslant \varepsilon) \to 0$.
  corrige: |
    **1.** Par Borel-Cantelli (i), pour chaque $\varepsilon$, presque sûrement $|X_{n} - X| < \varepsilon$ à partir d'un rang ; en prenant $\varepsilon = \dfrac{1}{j}$, $j \geqslant 1$ (intersection dénombrable d'évènements presque sûrs), $X_{n} \to X$ presque sûrement.

    La condition n'est pas nécessaire : $\dfrac{C}{n} \to 0$ en tout point, mais 
    $$\mathbb{P}\Big(\frac{|C|}{n} \geqslant \varepsilon\Big) = \mathbb{P}(|C| \geqslant n\varepsilon) = 1 - \frac{2}{\pi}\arctan(n\varepsilon) \sim \frac{2}{\pi n\varepsilon},$$
     terme d'une série divergente. Les variables $\dfrac{C}{n}$ sont très dépendantes (toutes fonctions de $C$) : le lemme de Borel-Cantelli (ii) ne s'applique pas.

    **2.** Pour $(u, v) \in \mathbb{R}^{2}$, $|u| \leqslant \|(u, v)\| \leqslant |u| + |v|$. Donc 
    $$\mathbb{P}(|X_{n} - X| > \varepsilon) \leqslant \mathbb{P}\big(\|(X_{n} - X, Y_{n} - Y)\| > \varepsilon\big) \leqslant \mathbb{P}\big(|X_{n} - X| > \tfrac{\varepsilon}{2}\big) + \mathbb{P}\big(|Y_{n} - Y| > \tfrac{\varepsilon}{2}\big),$$
     ce qui donne l'équivalence. Puis $|X_{n} + Y_{n} - X - Y| \leqslant |X_{n} - X| + |Y_{n} - Y|$, et $\boxed{X_{n} + Y_{n} \xrightarrow{\mathbb{P}} X + Y}$.

    Notons $Z_{n} = (X_{n}, Y_{n})$ et $Z = (X, Y)$. Si $f$ est uniformément continue, soit $\delta$ tel que $\|z - z'\| \leqslant \delta$ entraîne $|f(z) - f(z')| \leqslant \varepsilon$ ; alors $\mathbb{P}(|f(Z_{n}) - f(Z)| > \varepsilon) \leqslant \mathbb{P}(\|Z_{n} - Z\| > \delta) \to 0$.

    Si $f$ est seulement continue, soit $K > 0$ : $f$ est uniformément continue sur la boule fermée de rayon $K + 1$, et il existe $\delta \in \,]0, 1]$ tel que, pour $\|z\| \leqslant K$ et $\|z - z'\| \leqslant \delta$, $|f(z) - f(z')| \leqslant \varepsilon$. Donc 
    $$\mathbb{P}(|f(Z_{n}) - f(Z)| > \varepsilon) \leqslant \mathbb{P}(\|Z\| > K) + \mathbb{P}(\|Z_{n} - Z\| > \delta),$$
     dont la limite supérieure est au plus $\mathbb{P}(\|Z\| > K)$, qui tend vers $0$ quand $K \to +\infty$ : $\boxed{f(Z_{n}) \xrightarrow{\mathbb{P}} f(Z)}$. En particulier, $X_{n}Y_{n} \xrightarrow{\mathbb{P}} XY$.

    **3.** La variable $|f(X_{n}) - f(X)| \leqslant C\mathop{\displaystyle \min}(1, |X_{n} - X|)$ tend vers $0$ presque sûrement et reste bornée par $C$ ; de plus $f$ est bornée, car $|f(x)| \leqslant |f(0)| + C$. Par convergence dominée, $\mathbb{E}[|f(X_{n}) - f(X)|] \to 0$, d'où $\boxed{\mathbb{E}[f(X_{n})] \to \mathbb{E}[f(X)]}$, et par Markov, $\mathbb{P}(|f(X_{n}) - f(X)| \geqslant \varepsilon) \leqslant \dfrac{1}{\varepsilon}\mathbb{E}[|f(X_{n}) - f(X)|] \to 0$.
- id: "l3-pr-08-11"
  feuille: "f-l3-pr-08"
  numero: 11
  partie: "Modes de convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Durand, exercice 3.9"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $(X_{n})$ une suite de variables positives intégrables, qui converge presque sûrement vers $X$, avec $\mathbb{E}[X_{n}] \to \mathbb{E}[X] < +\infty$. Montrer que $X_{n} \xrightarrow{L^{1}} X$ ; on pourra écrire $|x - y| = (x - y) + 2(y - x)^{+}$. Montrer par un exemple que l'hypothèse $\mathbb{E}[X_{n}] \to \mathbb{E}[X]$ ne peut pas être supprimée.
  corrige: |
    On a $|X_{n} - X| = (X_{n} - X) + 2(X - X_{n})^{+}$. L'espérance du premier terme tend vers $0$ par hypothèse. Le second est positif, majoré par $X$ (car $X_{n} \geqslant 0$), intégrable, et tend vers $0$ presque sûrement : par convergence dominée, son espérance tend vers $0$. Donc $\boxed{\mathbb{E}[|X_{n} - X|] \to 0}$.

    L'hypothèse sur les espérances est indispensable : sur $]0, 1]$ muni de la probabilité uniforme, $X_{n} = n\mathbf{1}_{]0, 1/n]}$ tend vers $0$ en tout point, mais $\mathbb{E}[X_{n}] = 1$ et $\mathbb{E}[|X_{n} - 0|] = 1$. La masse de $X_{n}$ s'échappe vers des valeurs de plus en plus grandes, ce que la convergence presque sûre ne voit pas (lemme de Scheffé, voir l'exercice 15).
- id: "l3-pr-08-12"
  feuille: "f-l3-pr-08"
  numero: 12
  partie: "Modes de convergence"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Durand, exercice 3.3"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *(Polynômes de Bernstein.)* Soit $f$ continue sur $[0, 1]$. Pour $x \in [0, 1]$, soit $S_{n}^{(x)}$ une variable de loi $\mathcal{B}(n, x)$, et $P_{n}(x) = \mathbb{E}\big[f\big(\dfrac{S_{n}^{(x)}}{n}\big)\big]$.

    **1.** Expliciter $P_{n}(x)$ : c'est un polynôme de degré au plus $n$.

    **2.** En découpant selon l'évènement $\{|\dfrac{S_{n}^{(x)}}{n} - x| \geqslant \delta\}$ et en utilisant l'inégalité de Bienaymé-Tchebychev, montrer que $\mathop{\displaystyle \sup_{x \in [0, 1]}}|P_{n}(x) - f(x)| \to 0$.

    **3.** En déduire le théorème de Weierstrass : toute fonction continue sur un segment est limite uniforme de polynômes.
  corrige: |
    **1.** Par la formule de transfert, 
    $$\boxed{P_{n}(x) = \sum_{k = 0}^{n}\binom{n}{k}x^{k}(1 - x)^{n - k}f\Big(\frac{k}{n}\Big)},$$
     polynôme de degré au plus $n$ (polynôme de Bernstein de $f$).

    **2.** Soit $\varepsilon > 0$ ; $f$ est uniformément continue sur $[0, 1]$ : il existe $\delta > 0$ tel que $|u - v| < \delta$ entraîne $|f(u) - f(v)| \leqslant \varepsilon$. Notons $\|f\| = \mathop{\displaystyle \sup}|f|$. Pour tout $x$, en découpant selon l'évènement $\{|\dfrac{S_{n}^{(x)}}{n} - x| \geqslant \delta\}$ et par Bienaymé-Tchebychev ($\operatorname{Var}(\dfrac{S_{n}^{(x)}}{n}) = \dfrac{x(1 - x)}{n} \leqslant \dfrac{1}{4n}$), 
    $$|P_{n}(x) - f(x)| \leqslant \mathbb{E}\Big[\Big|f\Big(\frac{S_{n}^{(x)}}{n}\Big) - f(x)\Big|\Big] \leqslant \varepsilon + 2\|f\|\,\mathbb{P}\Big(\Big|\frac{S_{n}^{(x)}}{n} - x\Big| \geqslant \delta\Big) \leqslant \varepsilon + \frac{\|f\|}{2n\delta^{2}}.$$
     La borne ne dépend pas de $x$ : $\mathop{\displaystyle \limsup_{n}}\mathop{\displaystyle \sup_{x}}|P_{n}(x) - f(x)| \leqslant \varepsilon$, d'où 
    $$\boxed{P_{n} \to f \text{ uniformément sur } [0, 1]}.$$

    **3.** Si $g$ est continue sur $[a, b]$, $f(x) = g(a + (b - a)x)$ est continue sur $[0, 1]$, et les polynômes $P_{n}\big(\dfrac{y - a}{b - a}\big)$ convergent uniformément vers $g$ sur $[a, b]$ : c'est le *théorème de Weierstrass*, démontré ici par une inégalité de probabilités.

    1.5em

    ![Figure](documents/figures/46353143adf221b4.svg)

    Les polynômes de Bernstein de $f(x) = |x - \dfrac{1}{2}|$ pour $n = 4$, $16$, $64$ : l'écart maximal, atteint au point anguleux, vaut $0{,}188$, $0{,}098$ et $0{,}050$, et décroît comme $\dfrac{1}{\sqrt{n}}$, l'ordre de l'écart-type de $\dfrac{S_{n}}{n}$.
- id: "l3-pr-08-13"
  feuille: "f-l3-pr-08"
  numero: 13
  partie: "Modes de convergence"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-presque-sure, convergence-probabilite, convergence-moyenne]
  source: "Durand, exercice 3.5"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *(Collectionneur de coupons.)* Chaque paquet contient un coupon choisi uniformément parmi $n$, indépendamment des autres paquets. Soit $\tau_{k}$ le nombre de paquets nécessaires pour obtenir $k$ coupons différents ($\tau_{0} = 0$), et $T_{n} = \tau_{n}$.

    **1.** Déterminer la loi de $\tau_{k} - \tau_{k - 1}$, et montrer que ces variables sont indépendantes. En déduire que $\mathbb{E}[T_{n}] \sim n\ln n$ et que $\operatorname{Var}(T_{n}) \leqslant \dfrac{\pi^{2}}{6}n^{2}$.

    **2.** À l'aide de l'inégalité de Bienaymé-Tchebychev, montrer que $\dfrac{T_{n}}{n\ln n} \xrightarrow{\mathbb{P}} 1$.
  corrige: |
    **1.** Quand $k - 1$ coupons différents sont déjà obtenus, chaque nouveau paquet apporte un coupon nouveau avec probabilité $p_{k} = \dfrac{n - k + 1}{n}$, indépendamment des paquets précédents : $\boxed{\tau_{k} - \tau_{k - 1} \sim \mathcal{G}\Big(\dfrac{n - k + 1}{n}\Big)}$. Plus précisément, l'évènement $\{\tau_{k} - \tau_{k - 1} = j_{k},\ 1 \leqslant k \leqslant n\}$ impose la nature (ancien ou nouveau) de chaque paquet, et sa probabilité est $\mathop{\displaystyle \prod_{k}}(1 - p_{k})^{j_{k} - 1}p_{k}$ : les écarts sont indépendants.

    Donc $\mathbb{E}[T_{n}] = \mathop{\displaystyle \sum_{k = 1}^{n}}\dfrac{n}{n - k + 1} = n\mathop{\displaystyle \sum_{j = 1}^{n}}\dfrac{1}{j} \sim \boxed{n\ln n}$, et 
    $$\operatorname{Var}(T_{n}) = \sum_{k = 1}^{n}\frac{1 - p_{k}}{p_{k}^{2}} \leqslant \sum_{j = 1}^{n}\frac{n^{2}}{j^{2}} \leqslant \boxed{\frac{\pi^{2}}{6}n^{2}}.$$

    **2.** Par Bienaymé-Tchebychev, pour $\varepsilon > 0$, 
    $$\mathbb{P}\big(|T_{n} - \mathbb{E}[T_{n}]| \geqslant \varepsilon n\ln n\big) \leqslant \frac{\pi^{2}n^{2}}{6\varepsilon^{2}n^{2}(\ln n)^{2}} \to 0,$$
     donc $\dfrac{T_{n} - \mathbb{E}[T_{n}]}{n\ln n} \xrightarrow{\mathbb{P}} 0$, et comme $\dfrac{\mathbb{E}[T_{n}]}{n\ln n} \to 1$, $\boxed{\dfrac{T_{n}}{n\ln n} \xrightarrow{\mathbb{P}} 1}$. Pour $n = 50$ coupons, il faut environ $225$ paquets en moyenne (feuille 3), et l'écart-type, au plus $\dfrac{\pi}{\sqrt{6}}n \approx 64$, est petit devant $n\ln n$ seulement pour $n$ grand.
- id: "l3-pr-08-14"
  feuille: "f-l3-pr-08"
  numero: 14
  partie: "Convergence en loi"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence en loi]
  noeuds: [p-convergences, fo-loi-esperances]
  notions: [convergence-loi]
  source: "Bordeaux, TD 4, exercice 2 ; Durand, exercice 4.20"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soient $X_{n}$ ($n \geqslant 1$) et $X$ des variables à valeurs dans $\mathbb{Z}$.

    **1.** Montrer que $X_{n} \xrightarrow{\mathcal{L}} X$ si et seulement si $\mathbb{P}(X_{n} = k) \to \mathbb{P}(X = k)$ pour tout $k \in \mathbb{Z}$.

    **2.** On suppose seulement que $\mathbb{P}(X_{n} = k) \to p_{k}$ pour tout $k$. Montrer que $\mathop{\displaystyle \sum_{k}}p_{k} \leqslant 1$, et donner un exemple où l'inégalité est stricte. Montrer que $\mathop{\displaystyle \sum_{k}}p_{k} = 1$ si et seulement si, pour tout $\varepsilon > 0$, il existe $K$ tel que $\mathbb{P}(|X_{n}| \leqslant K) \geqslant 1 - \varepsilon$ pour tout $n$.

    **3.** Si $\mathop{\displaystyle \sum_{k}}p_{k} = 1$, montrer que $\mathop{\displaystyle \sum_{k}}|\mathbb{P}(X_{n} = k) - p_{k}| \to 0$ (convergence en variation totale).

    **4.** Soient maintenant $Y_{n}$ à valeurs dans $\mathbb{Z}$ et $Y$ réelle, avec $Y_{n} \xrightarrow{\mathcal{L}} Y$. Montrer que $Y \in \mathbb{Z}$ presque sûrement ; on pourra utiliser $h(x) = \mathop{\displaystyle \min}(1, \operatorname{dist}(x, \mathbb{Z}))$.
  corrige: |
    **1.** Supposons $X_{n} \xrightarrow{\mathcal{L}} X$. Les points $k \pm \dfrac{1}{2}$ sont des points de continuité de $F_{X}$, qui est constante sur $[k, k + 1[$ ; donc 
    $$\mathbb{P}(X_{n} = k) = F_{X_{n}}\big(k + \tfrac{1}{2}\big) - F_{X_{n}}\big(k - \tfrac{1}{2}\big) \to F_{X}\big(k + \tfrac{1}{2}\big) - F_{X}\big(k - \tfrac{1}{2}\big) = \mathbb{P}(X = k).$$
     Réciproquement, soit $\varepsilon > 0$ et $K$ tel que $\mathbb{P}(|X| > K) \leqslant \varepsilon$. Par hypothèse, $\mathbb{P}(|X_{n}| \leqslant K)$ tend vers $\mathbb{P}(|X| \leqslant K) \geqslant 1 - \varepsilon$, donc $\mathbb{P}(|X_{n}| > K) \leqslant 2\varepsilon$ pour $n$ grand. Pour tout $t$, 
    $$|F_{X_{n}}(t) - F_{X}(t)| \leqslant \sum_{|k| \leqslant K}|\mathbb{P}(X_{n} = k) - \mathbb{P}(X = k)| + \mathbb{P}(|X_{n}| > K) + \mathbb{P}(|X| > K),$$
     dont la limite supérieure est au plus $3\varepsilon$ : $F_{X_{n}}(t) \to F_{X}(t)$ en tout point, et 
    $$\boxed{X_{n} \xrightarrow{\mathcal{L}} X}.$$

    **2.** Pour $K$ fixé, $\mathop{\displaystyle \sum_{|k| \leqslant K}}p_{k} = \mathop{\displaystyle \lim_{n}}\mathbb{P}(|X_{n}| \leqslant K) \leqslant 1$ ; en faisant $K \to +\infty$, $\boxed{\mathop{\displaystyle \sum_{k}}p_{k} \leqslant 1}$. Pour $X_{n} = n$, $p_{k} = 0$ pour tout $k$ : toute la masse s'échappe à l'infini.

    Si $\mathop{\displaystyle \sum} p_{k} = 1$, soit $K$ tel que $\mathop{\displaystyle \sum_{|k| \leqslant K}}p_{k} \geqslant 1 - \varepsilon$ : pour $n \geqslant N$, $\mathbb{P}(|X_{n}| \leqslant K) \geqslant 1 - 2\varepsilon$, et en augmentant $K$ on traite les $n < N$, en nombre fini. Réciproquement, si $\mathbb{P}(|X_{n}| \leqslant K) \geqslant 1 - \varepsilon$ pour tout $n$, $\mathop{\displaystyle \sum_{|k| \leqslant K}}p_{k} \geqslant 1 - \varepsilon$. Cette condition s'appelle la *tension* de la suite : aucune masse ne s'échappe.

    **3.** Avec $K$ comme ci-dessus, $\mathop{\displaystyle \sum_{k}}|\mathbb{P}(X_{n} = k) - p_{k}| \leqslant \mathop{\displaystyle \sum_{|k| \leqslant K}}|\mathbb{P}(X_{n} = k) - p_{k}| + \mathbb{P}(|X_{n}| > K) + \mathop{\displaystyle \sum_{|k| > K}}p_{k}$, dont la limite supérieure est au plus $3\varepsilon$. C'est la version discrète du lemme de Scheffé (exercice 15) : pour des lois sur $\mathbb{Z}$, convergence en loi et convergence en variation totale (feuille 5, exercice 22) coïncident.

    **4.** La fonction $h$ est continue, bornée, et nulle exactement sur $\mathbb{Z}$. Par le théorème 2, $\mathbb{E}[h(Y)]$ est la limite des $\mathbb{E}[h(Y_{n})]$, toutes nulles, donc $h(Y) = 0$ presque sûrement, et $\boxed{Y \in \mathbb{Z}}$ presque sûrement. La question 1 s'applique alors : les masses $\mathbb{P}(Y_{n} = k)$ convergent vers $\mathbb{P}(Y = k)$.
- id: "l3-pr-08-15"
  feuille: "f-l3-pr-08"
  numero: 15
  partie: "Convergence en loi"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence en loi]
  noeuds: [p-convergences, fo-loi-esperances]
  notions: [convergence-loi]
  source: "Durand, exercice 4.3 (et 4.20 (6))"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $X_{n}$ de densité $f_{n}$, et $f$ une densité telle que $f_{n}(x) \to f(x)$ pour presque tout $x$.

    **1.** *(Lemme de Scheffé.)* Montrer que $\mathop{\displaystyle \int_{\mathbb{R}}}|f_{n} - f| \to 0$, à l'aide de $|a - b| = a + b - 2\mathop{\displaystyle \min}(a, b)$. En déduire que $X_{n}$ converge en loi vers la loi de densité $f$.

    **2.** Soit $f_{n}(x) = (1 - \cos(2\pi nx))\mathbf{1}_{[0, 1]}(x)$. Montrer que la loi de densité $f_{n}$ converge vers la loi uniforme sur $[0, 1]$. La suite $(f_{n}(x))$ converge-t-elle pour $x \in \,]0, 1[$ ? Conclure.
  corrige: |
    **1.** Comme $\mathop{\displaystyle \int} f_{n} = \mathop{\displaystyle \int} f = 1$, $\mathop{\displaystyle \int}|f_{n} - f| = 2 - 2\mathop{\displaystyle \int}\mathop{\displaystyle \min}(f_{n}, f)$. La fonction $\mathop{\displaystyle \min}(f_{n}, f)$ tend vers $f$ presque partout et reste majorée par $f$, intégrable : par convergence dominée, $\mathop{\displaystyle \int}\mathop{\displaystyle \min}(f_{n}, f) \to 1$, et $\boxed{\mathop{\displaystyle \int}|f_{n} - f| \to 0}$. Pour tout borélien $B$, 
    $$\Big|\mathbb{P}(X_{n} \in B) - \int_{B}f\Big| \leqslant \int_{\mathbb{R}}|f_{n} - f| \to 0,$$
     en particulier pour $B = \,]-\infty, t]$ : $X_{n}$ converge en loi vers la loi de densité $f$, et même uniformément en $B$.

    **2.** $f_{n} \geqslant 0$ et $\mathop{\displaystyle \int_{0}^{1}}\cos(2\pi nx)\,\mathrm{d} x = 0$ : c'est une densité. Pour $t \in [0, 1]$, $F_{n}(t) = t - \dfrac{\sin(2\pi nt)}{2\pi n} \to t$ : 
    $$\boxed{\text{la loi converge vers } \mathcal{U}([0, 1])}.$$

    Mais $f_{n}(x)$ ne converge pour aucun $x \in \,]0, 1[$. Supposons que $c_{n} = \cos(2\pi nx)$ tende vers $\ell$. La relation $c_{n + 1} + c_{n - 1} = 2c_{n}\cos(2\pi x)$ donne à la limite $2\ell = 2\ell\cos(2\pi x)$, donc $\ell = 0$, car $\cos(2\pi x) \neq 1$. Mais $c_{2n} = 2c_{n}^{2} - 1$ tend alors vers $-1 \neq 0$ : contradiction. *Conclusion.* Le lemme de Scheffé donne une condition suffisante ; la convergence en loi, même vers une loi à densité, n'entraîne pas la convergence des densités.

    1.5em

    ![Figure](documents/figures/a6eac097704bdd7b.svg)

    La densité $f_{3}(x) = 1 - \cos(6\pi x)$ (en bleu) et la densité uniforme (en orange). Quand $n$ grandit, les oscillations se resserrent : les aires sur tout intervalle se rapprochent de celles de la loi uniforme, mais la valeur en un point continue d'osciller entre $0$ et $2$.
- id: "l3-pr-08-16"
  feuille: "f-l3-pr-08"
  numero: 16
  partie: "Convergence en loi"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence en loi]
  noeuds: [p-convergences, fo-loi-esperances]
  notions: [convergence-loi]
  source: "Bordeaux, TD 4, exercices 3 et 6 ; Durand, exercices 4.36 et 4.37"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Étudier la convergence en loi des suites suivantes.

    **1.** $P_{n} = X_{1}\cdots X_{n}$, où les $X_{k}$ sont indépendantes, $\mathbb{P}(X_{k} = 1) = p$ et $\mathbb{P}(X_{k} = -1) = 1 - p$, avec $0 < p < 1$.

    **2.** $Y_{n} = X_{n} - \lfloor X_{n}\rfloor$, où $X_{n}$ suit la loi exponentielle de paramètre $\dfrac{1}{n}$.

    **3.** La distance $D_{n}$ à l'axe des abscisses d'un sommet choisi uniformément parmi ceux du polygone régulier à $n$ côtés inscrit dans le cercle unité, avec un sommet en $(1, 0)$.

    **4.** $\dfrac{|X_{n} - Y_{n}|}{n}$, où $X_{n}$ et $Y_{n}$ sont indépendantes de loi uniforme sur $\llbracket 1, n\rrbracket$. *Application* : deux dépannages ont lieu en des points indépendants et uniformes d'une autoroute de $112$ km ; quelle est, approximativement, la probabilité qu'ils soient distants de plus de $70$ km ?
  corrige: |
    **1.** $\mathbb{E}[P_{n}] = (2p - 1)^{n}$ par indépendance, et $P_{n} \in \{-1, 1\}$, donc $\mathbb{P}(P_{n} = 1) = \dfrac{1 + (2p - 1)^{n}}{2} \to \dfrac{1}{2}$ : 
    $$\boxed{P_{n} \xrightarrow{\mathcal{L}} P},$$
     où $\mathbb{P}(P = 1) = \mathbb{P}(P = -1) = \dfrac{1}{2}$ (exercice 14). La pièce biaisée devient équilibrée pour la parité.

    **2.** $Y_{n} \in [0, 1[$, et pour $y \in [0, 1]$, 
    $$\mathbb{P}(Y_{n} \leqslant y) = \sum_{k \geqslant 0}\mathbb{P}(k \leqslant X_{n} \leqslant k + y) = \sum_{k \geqslant 0}\mathrm{e}^{-k/n}\big(1 - \mathrm{e}^{-y/n}\big) = \frac{1 - \mathrm{e}^{-y/n}}{1 - \mathrm{e}^{-1/n}} \xrightarrow[n \to +\infty]{} y :$$
     $\boxed{Y_{n} \xrightarrow{\mathcal{L}} \mathcal{U}([0, 1])}$. La loi de $X_{n}$ s'étale, et la partie fractionnaire d'une variable très étalée et régulière est presque uniforme.

    **3.** $D_{n} = |\sin\dfrac{2\pi K}{n}|$, avec $K$ uniforme sur $\llbracket 0, n - 1\rrbracket$. Pour $h$ continue bornée, 
    $$\mathbb{E}[h(D_{n})] = \frac{1}{n}\sum_{k = 0}^{n - 1}h\Big(\Big|\sin\frac{2\pi k}{n}\Big|\Big)$$
     est une somme de Riemann, qui tend vers $\mathop{\displaystyle \int_{0}^{1}}h(|\sin 2\pi u|)\,\mathrm{d} u = \mathbb{E}[h(|\sin 2\pi U|)]$, $U \sim \mathcal{U}([0, 1])$. Par le théorème 2, $D_{n} \xrightarrow{\mathcal{L}} |\sin 2\pi U|$. Pour $y \in [0, 1]$, $\mathbb{P}(|\sin 2\pi U| \leqslant y) = \dfrac{2}{\pi}\arcsin y$, d'où la densité limite $\boxed{\dfrac{2}{\pi\sqrt{1 - y^{2}}}\mathbf{1}_{[0, 1]}(y)}$ : celle de l'arc sinus (feuille 4, exercice 13), repliée sur $[0, 1]$.

    **4.** De même, $\mathbb{E}[h(\dfrac{|X_{n} - Y_{n}|}{n})] = \dfrac{1}{n^{2}}\mathop{\displaystyle \sum_{i, j}}h\big(\dfrac{|i - j|}{n}\big) \to \mathop{\displaystyle \iint_{[0, 1]^{2}}}h(|u - v|)\,\mathrm{d} u\,\mathrm{d} v$ (somme de Riemann double) : $\dfrac{|X_{n} - Y_{n}|}{n} \xrightarrow{\mathcal{L}} |U - V|$, $U$, $V$ indépendantes uniformes. Comme $\mathbb{P}(|U - V| > x) = (1 - x)^{2}$ (feuille 7, exercice 7), la densité limite est $\boxed{2(1 - x)\mathbf{1}_{[0, 1]}(x)}$. Pour l'autoroute, avec $x = \dfrac{70}{112} = \dfrac{5}{8}$, la probabilité vaut environ $\big(\dfrac{3}{8}\big)^{2} = \boxed{\dfrac{9}{64} \approx 0{,}14}$.
- id: "l3-pr-08-17"
  feuille: "f-l3-pr-08"
