  notions: [convergence-loi]
  source: "Bordeaux, TD 4, exercice 7 ; Durand, exercice 4.33"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soient $X_{1}, X_{2}, \dots$ indépendantes de loi de Cauchy de paramètre $c > 0$, et $S_{n} = X_{1} + \dots + X_{n}$.

    **1.** Étudier la convergence en loi et en probabilité de $\dfrac{S_{n}}{n^{2}}$, et la convergence en loi de $\dfrac{S_{n}}{\sqrt{n}}$.

    **2.** Déterminer la loi de $\dfrac{S_{2n}}{2n} - \dfrac{S_{n}}{n}$. En déduire que $\dfrac{S_{n}}{n}$ converge en loi, mais pas en probabilité. Y a-t-il contradiction avec la loi des grands nombres ?
  corrige: |
    **1.** Par la prop. 12 du chapitre 6, $\dfrac{S_{n}}{n}$ suit la loi de Cauchy de paramètre $c$ ; donc $\dfrac{S_{n}}{n^{2}}$ suit la loi de Cauchy de paramètre $\dfrac{c}{n}$, et $\mathbb{P}(|\dfrac{S_{n}}{n^{2}}| > \varepsilon) = 1 - \dfrac{2}{\pi}\arctan\dfrac{n\varepsilon}{c} \to 0$ : $\boxed{\dfrac{S_{n}}{n^{2}} \to 0}$ en probabilité, donc en loi.

    $\dfrac{S_{n}}{\sqrt{n}}$ suit la loi de Cauchy de paramètre $c\sqrt{n}$ : pour tout $t$, $F_{n}(t) = \dfrac{1}{2} + \dfrac{1}{\pi}\arctan\dfrac{t}{c\sqrt{n}} \to \dfrac{1}{2}$, limite qui n'est pas une fonction de répartition : 
    $$\boxed{\text{pas de convergence en loi}},$$
     la masse s'échappe des deux côtés. La normalisation $\sqrt{n}$ du théorème central limite est inadaptée sans variance.

    **2.** Soit $S'_{n} = X_{n + 1} + \dots + X_{2n}$, indépendante de $S_{n}$ et de même loi. Alors 
    $$\frac{S_{2n}}{2n} - \frac{S_{n}}{n} = \frac{1}{2}\Big(\frac{S'_{n}}{n} - \frac{S_{n}}{n}\Big).$$
     Les deux moyennes sont indépendantes de loi de Cauchy de paramètre $c$ ; la loi de Cauchy est symétrique, donc la différence est la somme de deux variables de Cauchy indépendantes, de loi de Cauchy de paramètre $2c$, et la demi-différence 
    $$\boxed{\text{suit la loi de Cauchy de paramètre } c},$$
     pour tout $n$.

    $\dfrac{S_{n}}{n}$ converge en loi, trivialement : sa loi ne dépend pas de $n$. Si elle convergeait en probabilité vers $L$, $\dfrac{S_{2n}}{2n} - \dfrac{S_{n}}{n}$ tendrait vers $0$ en probabilité (exercice 10), donc en loi vers $0$, ce qui est faux : 
    $$\boxed{\text{pas de convergence en probabilité}}.$$
     Il n'y a pas de contradiction avec la loi des grands nombres : celle-ci suppose $X_{1}$ intégrable, ce qui n'est pas le cas.
- id: "l3-pr-08-18"
  feuille: "f-l3-pr-08"
  numero: 18
