  enonce: |
    **1.** Montrer que la loi $\mathcal{N}(0, \sigma^{2})$ converge vers la masse de Dirac en $0$ quand $\sigma \to 0$, au sens où $Z_{\sigma} \xrightarrow{\mathcal{L}} 0$ si $Z_{\sigma} \sim \mathcal{N}(0, \sigma^{2})$.

    **2.** *(Lemme de Slutsky.)* Soit $Y_{n} \xrightarrow{\mathcal{L}} Y$ et $A_{n} \xrightarrow{\mathbb{P}} a$, où $a$ est une constante. Montrer que, pour $\varepsilon > 0$ et $v \in \mathbb{R}$, $|\mathrm{e}^{iA_{n}v} - \mathrm{e}^{iav}| \leqslant |v|\varepsilon + 2\cdot\mathbf{1}_{\{|A_{n} - a| > \varepsilon\}}$, puis que $\varphi_{Y_{n} + A_{n}}(t) \to \varphi_{Y}(t)\mathrm{e}^{iat}$ pour tout $t$. En déduire que $Y_{n} + A_{n} \xrightarrow{\mathcal{L}} Y + a$.
  corrige: |
    **1.** $Z_{\sigma} = \sigma G$, avec $G \sim \mathcal{N}(0, 1)$ : $\mathbb{P}(|Z_{\sigma}| > \varepsilon) = \mathbb{P}(|G| > \dfrac{\varepsilon}{\sigma}) \to 0$. Donc $Z_{\sigma} \to 0$ en probabilité, et en loi (th. 4 (iii)). Directement : $F_{Z_{\sigma}}(t) = \Phi(\dfrac{t}{\sigma})$ tend vers $0$ pour $t < 0$ et vers $1$ pour $t > 0$, et $0$ est le seul point de discontinuité de la fonction de répartition de $\delta_{0}$.

    **2.** Si $|A_{n} - a| \leqslant \varepsilon$, $|\mathrm{e}^{iA_{n}v} - \mathrm{e}^{iav}| \leqslant |v||A_{n} - a| \leqslant |v|\varepsilon$ ; sinon, le module est au plus $2$. Donc 
    $$\big|\varphi_{Y_{n} + A_{n}}(t) - \varphi_{Y_{n}}(t)\mathrm{e}^{iat}\big| = \big|\mathbb{E}\big[\mathrm{e}^{itY_{n}}(\mathrm{e}^{itA_{n}} - \mathrm{e}^{ita})\big]\big| \leqslant |t|\varepsilon + 2\,\mathbb{P}(|A_{n} - a| > \varepsilon),$$
     dont la limite supérieure est au plus $|t|\varepsilon$, pour tout $\varepsilon$. Par le théorème 2 (appliqué à $\cos$ et $\sin$), $\varphi_{Y_{n}}(t) \to \varphi_{Y}(t)$. Donc $\varphi_{Y_{n} + A_{n}}(t) \to \varphi_{Y}(t)\mathrm{e}^{iat} = \varphi_{Y + a}(t)$, et par le théorème de Lévy (th. 3), $\boxed{Y_{n} + A_{n} \xrightarrow{\mathcal{L}} Y + a}$.

    *Piège.* Si $A_{n}$ converge en probabilité vers une variable non constante $A$, la conclusion peut tomber : avec $Y_{n} = -A$ (suite constante) et $A_{n} = A$, $Y_{n} + A_{n} = 0$, alors que $Y + A$, avec $Y$ indépendante de $A$ et de même loi que $-A$, n'est pas nulle. La convergence en loi ne voit pas la dépendance entre les deux suites.
