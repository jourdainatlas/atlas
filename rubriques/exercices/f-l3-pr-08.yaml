- id: "l3-pr-08-01"
  feuille: "f-l3-pr-08"
  numero: 1
  partie: "Inégalités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [inégalités]
  noeuds: [p-esperance]
  notions: [esperance, variance]
  source: "Durand (Orsay), exercices 2.45 (1)-(2), 2.48 (1)-(3) et (4) premières questions, 1.25 (5) ; Rubenthaler, chapitre 6, exercice 7"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $X \geqslant 0$ telle que $\mathbb{E}[X] = 0$. Montrer que $X = 0$ presque sûrement. Si $a \leqslant X \leqslant b$ presque sûrement, montrer que $a \leqslant \mathbb{E}[X] \leqslant b$, et caractériser le cas $\mathbb{E}[X] = a$.

    **2.** M. Dupond attend son bus en moyenne $10$ minutes chaque matin. Majorer la probabilité qu'il attende plus de $20$ minutes. Si l'on sait de plus que la variance de l'attente vaut $100$, majorer la probabilité qu'il attende au moins $100$ minutes.

    **3.** La production quotidienne $X \in \mathbb{N}$ d'une usine a pour espérance $50$. Majorer $\mathbb{P}(X > 75)$, puis améliorer la borne si l'écart-type vaut $5$. Même question pour le nombre $Y$ de particules atteignant un détecteur, d'espérance $100$ : majorer $\mathbb{P}(Y > 1000)$, puis le faire si $\operatorname{Var}(Y) = 100$.

    **4.** *Méthode exponentielle.* Soit $Y \sim \mathcal{P}(m)$ et $a > 1$. Montrer que, pour tout $\theta > 0$, on a $\mathbb{P}(Y > am) \leqslant \mathrm{e}^{-\theta am}\,\mathbb{E}[\mathrm{e}^{\theta Y}]$, et en déduire, en optimisant en $\theta$, 
    $$\mathbb{P}(Y > am) \leqslant \exp\big(-m(1 - a + a\ln a)\big).$$
     Comparer les trois bornes (Markov, Bienaymé-Tchebychev, exponentielle) pour $\mathbb{P}(Y > 140)$ lorsque $m = 100$.
  corrige: |
    **1.** Par l'inégalité de Markov, $\mathbb{P}(X \geqslant \dfrac{1}{k}) \leqslant k\,\mathbb{E}[X] = 0$ pour tout $k \geqslant 1$, et $\{X > 0\} = \mathop{\displaystyle \bigcup_{k}}\{X \geqslant \dfrac{1}{k}\}$ : $\boxed{X = 0 \text{ p.s.}}$

    Si $a \leqslant X \leqslant b$, $X$ est bornée donc intégrable, et la croissance de l'espérance donne $a \leqslant \mathbb{E}[X] \leqslant b$. Si $\mathbb{E}[X] = a$, la variable positive $X - a$ est d'espérance nulle : $\boxed{X = a \text{ p.s.}}$, et réciproquement.

    **2.** Soit $T$ l'attente. Par Markov, $\mathbb{P}(T \geqslant 20) \leqslant \dfrac{10}{20} = \boxed{\dfrac{1}{2}}$. Avec $\operatorname{Var}(T) = 100$, Bienaymé-Tchebychev donne 
    $$\mathbb{P}(T \geqslant 100) \leqslant \mathbb{P}(|T - 10| \geqslant 90) \leqslant \frac{100}{90^{2}} = \boxed{\frac{1}{81}} \approx 0{,}012,$$
     dix fois mieux que la borne de Markov $\dfrac{10}{100}$ : connaître la variance renseigne sur la queue.

    **3.** Comme $X$ est entière, $\mathbb{P}(X > 75) = \mathbb{P}(X \geqslant 76) \leqslant \dfrac{50}{76} \approx \boxed{0{,}66}$. Avec un écart-type $5$, 
    $$\mathbb{P}(X \geqslant 76) \leqslant \mathbb{P}(|X - 50| \geqslant 26) \leqslant \frac{25}{26^{2}} \approx \boxed{0{,}037}.$$
     De même $\mathbb{P}(Y > 1000) \leqslant \dfrac{100}{1001} \approx \boxed{0{,}1}$, et, si $\operatorname{Var}(Y) = 100$, $\mathbb{P}(Y > 1000) \leqslant \dfrac{100}{901^{2}} \approx \boxed{1{,}2 \cdot 10^{-4}}$.

    **4.** La fonction $y \mapsto \mathrm{e}^{\theta y}$ est croissante, donc $\{Y > am\} \subset \{\mathrm{e}^{\theta Y} \geqslant \mathrm{e}^{\theta am}\}$, et l'inégalité de Markov appliquée à $\mathrm{e}^{\theta Y}$ donne la première majoration. Comme $\mathbb{E}[\mathrm{e}^{\theta Y}] = G_{Y}(\mathrm{e}^{\theta}) = \mathrm{e}^{m(\mathrm{e}^{\theta} - 1)}$ (chapitre 6), 
    $$\mathbb{P}(Y > am) \leqslant \exp\big(m(\mathrm{e}^{\theta} - 1 - a\theta)\big).$$
     La fonction $\theta \mapsto \mathrm{e}^{\theta} - 1 - a\theta$ est minimale en $\theta = \ln a > 0$, où elle vaut $a - 1 - a\ln a$ : d'où la borne annoncée.

    Pour $m = 100$ et $a = 1{,}4$ :

    $$\begin{array}{|l|c|} \hline \text{Markov : }\frac{100}{141} & 0{,}71 \\ \hline \text{Bienaymé-Tchebychev : }\frac{100}{41^{2}} & 0{,}059 \\ \hline \text{exponentielle : }\exp(-100(1{,}4\ln 1{,}4 - 0{,}4)) & 8{,}2 \cdot 10^{-4} \\ \hline \text{valeur exacte} & 6{,}4 \cdot 10^{-5} \\ \hline \end{array}$$

    Chaque inégalité utilise davantage d'information sur la loi (espérance, variance, toute la série génératrice), et la borne gagne en précision ; seule la borne exponentielle a le bon ordre de décroissance, exponentiel en $m$. Pour $a = 10$, elle donne $\mathbb{P}(Y > 1000) \leqslant \mathrm{e}^{-1402{,}6}$.
- id: "l3-pr-08-02"
  feuille: "f-l3-pr-08"
  numero: 2
  partie: "Inégalités"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [inégalités]
  noeuds: [p-esperance]
  notions: [esperance, variance]
  source: "Durand, exercices 3.1 et 3.4"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $X$ une variable de carré intégrable. Montrer que $x^{2}\mathbb{P}(|X| \geqslant x) \to 0$ quand $x \to +\infty$. Que donne l'inégalité de Markov appliquée à $X^{2}$ ?

    **2.** Soit $\phi(x) = \dfrac{x}{1 + x}$ pour $x \geqslant 0$. Montrer que $X_{n} \xrightarrow{\mathbb{P}} X$ si et seulement si $\mathbb{E}\big[\phi(|X_{n} - X|)\big] \to 0$. Pourquoi ne peut-on pas utiliser $\mathbb{E}[|X_{n} - X|]$ ?
  corrige: |
    **1.** Pour $x > 0$, $x^{2}\mathbf{1}_{\{|X| \geqslant x\}} \leqslant X^{2}\mathbf{1}_{\{|X| \geqslant x\}}$, donc 
    $$x^{2}\mathbb{P}(|X| \geqslant x) \leqslant \mathbb{E}\big[X^{2}\mathbf{1}_{\{|X| \geqslant x\}}\big] \xrightarrow[x \to +\infty]{} 0,$$
     par convergence dominée ($X^{2}$ est intégrable et l'indicatrice tend vers $0$). L'inégalité de Markov appliquée à $X^{2}$ donne seulement $x^{2}\mathbb{P}(|X| \geqslant x) \leqslant \mathbb{E}[X^{2}]$ : une borne, pas une limite nulle.

    **2.** La fonction $\phi$ est croissante, majorée par $1$ et par l'identité.

    Si $X_{n} \xrightarrow{\mathbb{P}} X$, pour $\varepsilon > 0$, en découpant selon $\{|X_{n} - X| > \varepsilon\}$, 
    $$\mathbb{E}\big[\phi(|X_{n} - X|)\big] \leqslant \phi(\varepsilon) + \mathbb{P}(|X_{n} - X| > \varepsilon) \leqslant \varepsilon + \mathbb{P}(|X_{n} - X| > \varepsilon),$$
     dont la limite supérieure est au plus $\varepsilon$ : l'espérance tend vers $0$.

    Réciproquement, par croissance de $\phi$ et Markov, $\mathbb{P}(|X_{n} - X| > \varepsilon) \leqslant \dfrac{\mathbb{E}[\phi(|X_{n} - X|)]}{\phi(\varepsilon)} \to 0$.

    On ne peut pas utiliser $\mathbb{E}[|X_{n} - X|]$, qui peut être infinie, ou ne pas tendre vers $0$ malgré la convergence en probabilité : sur $[0, 1]$, $X_{n} = n\mathbf{1}_{]0, 1/n]}$ tend vers $0$ en probabilité mais $\mathbb{E}[X_{n}] = 1$. La fonction bornée $\phi$ ignore les grandes valeurs rares. *Remarque.* $d(X, Y) = \mathbb{E}[\phi(|X - Y|)]$ est une distance sur les classes de variables égales presque sûrement ; la convergence en probabilité est la convergence pour cette distance.
- id: "l3-pr-08-03"
  feuille: "f-l3-pr-08"
