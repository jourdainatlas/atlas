  page_corrige: 11
  enonce: |
    Une entreprise fabrique des objets. Lorsqu'elle en produit $x$ centaines, son bénéfice, exprimé en milliers d'euros, est noté $B(x)$. La fonction $B$ est définie sur $[0\,;12]$ et admet le tableau de variations suivant.

    ![Figure](documents/figures/dcf4b18c2bbd6231.svg)

    **1.** Que représente concrètement le nombre $B(0)=-5$ ?

    **2.** Quelle production permet d'obtenir le bénéfice maximal ? Combien vaut alors ce bénéfice, en euros ?

    **3.** Le bénéfice augmente-t-il toujours lorsque la production augmente ? Justifier.

    **4.** Combien l'équation $B(x)=0$ admet-elle de solutions sur $[0\,;12]$ ? Interpréter ces solutions dans le contexte de l'exercice.

    **5.** Le tableau permet-il de connaître la valeur exacte de $B(3)$ ? Que peut-on tout de même en affirmer ?
  corrige: |
    **1.** $B(0)=-5$ signifie que pour une production nulle, le bénéfice vaut $-5$ milliers d'euros. 
    $$\boxed{\text{Sans rien produire, l'entreprise perd } 5\,000 \text{ euros}}$$
     Ce sont les frais fixes : loyer, machines, salaires…

    **2.** Le maximum du tableau est $23$, atteint pour $x=7$. Or $x$ est un nombre de *centaines* d'objets, et $B$ s'exprime en *milliers* d'euros : 
    $$\boxed{\text{Il faut produire } 700 \text{ objets ; le bénéfice vaut alors } 23\,000 \text{ euros}}$$

    **3.** Non. Le bénéfice augmente tant que $x$ reste inférieur à $7$, mais il diminue ensuite : $B$ est décroissante sur $[7\,;12]$. 
    $$\boxed{\text{Produire davantage ne garantit pas un bénéfice plus élevé}}$$

    **4.** Sur $[0\,;7]$, $B$ croît de $-5$ à $23$ : comme $0$ est compris entre ces deux valeurs, il y a une solution. Sur $[7\,;12]$, $B$ décroît de $23$ à $-1$ : là encore une solution. 
    $$\boxed{L'\text{équation } B(x)=0 \text{ admet } 2 \text{ solutions}}$$
     Ce sont les deux productions pour lesquelles le bénéfice est nul : l'entreprise ne gagne ni ne perd d'argent.

    **5.** Non : le tableau ne donne les valeurs de $B$ qu'en $0$, $7$ et $12$. En revanche, $3$ appartient à $[0\,;7]$ où $B$ est croissante, donc $B(0)\leqslant B(3)\leqslant B(7)$ : 
    $$\boxed{-5\leqslant B(3)\leqslant 23}$$
     Un tableau de variations ne donne jamais toutes les valeurs d'une fonction : il permet seulement de les encadrer.
- id: "s-07-19"
  feuille: "f-s-07"
  numero: 19
  partie: "Fonctions de référence"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [ensemble de définition, courbe représentative, variations, fonction carré, fonction racine carrée, fonction inverse, fonction cube]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Dans le repère ci-dessous sont tracées les courbes des quatre fonctions de référence, notées $\mathcal{C}_{1}$, $\mathcal{C}_{2}$, $\mathcal{C}_{3}$ et $\mathcal{C}_{4}$ dans le désordre.

    ![Figure](documents/figures/1bffef77205a00c3.svg)

    **1.** Associer à chaque courbe l'une des quatre fonctions $x\mapsto x^{2}$, $x\mapsto\sqrt{x}$, $x\mapsto\dfrac{1}{x}$ et $x\mapsto x^{3}$. On justifiera chaque réponse par au moins deux arguments (ensemble de définition, signe, allure, variations, points particuliers).

    **2.** Donner le nom de chacune de ces quatre courbes (parabole, hyperbole, …).

    **3.** Toutes ces courbes passent par un même point. Lequel ? Le vérifier par le calcul.

    **4.** Sur l'intervalle $]0\,;1[$, ranger les quatre courbes de la plus haute à la plus basse. Et sur $]1\,;+\infty[$ ?
  corrige: |
    **1.** On raisonne d'abord sur les ensembles de définition, puis sur l'allure.

    ```tableau
    **Courbe** ¦ **Fonction** ¦ **Justification**
    $\mathcal{C}_{1}$ ¦ $x\mapsto\dfrac{1}{x}$ ¦ C'est la seule courbe en deux morceaux, qui n'existe pas en $0$, et dont une partie est dans le troisième quadrant.
    $\mathcal{C}_{2}$ ¦ $x\mapsto x^{2}$ ¦ Elle est définie sur $\mathbb{R}$, toujours au-dessus de l'axe des abscisses, et symétrique par rapport à l'axe des ordonnées.
    $\mathcal{C}_{3}$ ¦ $x\mapsto x^{3}$ ¦ Elle est définie sur $\mathbb{R}$, croissante, et prend des valeurs négatives pour $x<0$ : c'est ce qui la distingue de $\mathcal{C}_{2}$.
    $\mathcal{C}_{4}$ ¦ $x\mapsto\sqrt{x}$ ¦ C'est la seule courbe qui n'existe pas pour $x<0$ ; elle croît lentement et reste sous la droite d'équation $y=x$ pour $x>1$.
    ```

    **2.** 
    $$\boxed{\begin{array}{l} \mathcal{C}_{1} \text{ est une \textbf{hyperbole}} \\[1mm] \mathcal{C}_{2} \text{ est une \textbf{parabole}} \\[1mm] \mathcal{C}_{3} \text{ est une \textbf{cubique}} \\[1mm] \mathcal{C}_{4} \text{ est une \textbf{demi-parabole}} \end{array}}$$

    **3.** Les quatre courbes se croisent au point de coordonnées $\boxed{(1\,;1)}$. On le vérifie : 
    $$1^{2}=1 \qquad ; \qquad \sqrt{1}=1 \qquad ; \qquad \frac{1}{1}=1 \qquad ; \qquad 1^{3}=1$$

    **4.** Sur $]0\,;1[$, c'est l'hyperbole qui domine (elle prend des valeurs supérieures à $1$), puis viennent la racine, puis $x^{2}$, puis $x^{3}$ : 
    $$\boxed{\text{sur } ]0\,;1[ \; : \; \frac{1}{x} \; > \; \sqrt{x} \; > \; x^{2} \; > \; x^{3}}$$
     Sur $]1\,;+\infty[$, l'ordre entre les trois dernières s'inverse, et l'hyperbole passe en dessous de tout le monde puisqu'elle devient inférieure à $1$ : 
    $$\boxed{\text{sur } ]1\,;+\infty[ \; : \; x^{3} \; > \; x^{2} \; > \; \sqrt{x} \; > \; \frac{1}{x}}$$
- id: "s-07-20"
  feuille: "f-s-07"
  numero: 20
  partie: "Fonctions de référence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variations, fonction carré, encadrement]
  noeuds: [ar-corps, c-racine-reelle, q-ordre]
  notions: [intervalle]
  page_enonce: 8
  page_corrige: 12
  enonce: |
    **1.** Calculer $4^{2}$, $(-4)^{2}$, $(0{,}5)^{2}$ et $\left(-\dfrac{1}{3}\right)^{2}$.

    **2.** Comparer, sans calculatrice et en justifiant par les variations de la fonction carré :

    **(a)** $2{,}5^{2}$ et $2{,}6^{2}$

    **(b)** $(-3{,}1)^{2}$ et $(-3{,}2)^{2}$

    **(c)** $(-2)^{2}$ et $1{,}9^{2}$

    **3.** On suppose que $2\leqslant x\leqslant 5$. Encadrer $x^{2}$.

    **4.** On suppose que $-3\leqslant x\leqslant -1$. Encadrer $x^{2}$.

    *Attention : sur cet intervalle, la fonction carré est décroissante.*

    **5.** On suppose que $-2\leqslant x\leqslant 3$. Peut-on encadrer $x^{2}$ de la même façon ? Que vaut le plus petit carré possible ? le plus grand ?
  corrige: |
    **1.** 
    $$4^{2}=\boxed{16} \quad ; \quad (-4)^{2}=\boxed{16} \quad ; \quad (0{,}5)^{2}=\boxed{0{,}25} \quad ; \quad \left(-\frac{1}{3}\right)^{2}=\boxed{\frac{1}{9}}$$
     Deux nombres opposés ont toujours le même carré.

    **2.** **(a)** $0\leqslant 2{,}5\leqslant 2{,}6$ et la fonction carré est croissante sur $[0\,;+\infty[$ : $\boxed{2{,}5^{2}<2{,}6^{2}}$

    **(b)** $-3{,}2\leqslant -3{,}1\leqslant 0$ et la fonction carré est décroissante sur $]-\infty\,;0]$ : $\boxed{(-3{,}1)^{2}<(-3{,}2)^{2}}$

    **(c)** Ici les deux nombres ne sont pas du même signe : on ne peut pas invoquer directement les variations. On passe par les opposés, $(-2)^{2}=2^{2}$, et $1{,}9\leqslant 2$ donne $1{,}9^{2}\leqslant 2^{2}$ : 
    $$\boxed{1{,}9^{2}<(-2)^{2}}$$

    **3.** Sur $[2\,;5]$, la fonction carré est croissante, donc elle conserve l'ordre : 
    $$2\leqslant x\leqslant 5 \; \Longrightarrow \; 2^{2}\leqslant x^{2}\leqslant 5^{2} \qquad \text{soit} \qquad \boxed{4\leqslant x^{2}\leqslant 25}$$

    **4.** Sur $[-3\,;-1]$, la fonction carré est **décroissante** : elle inverse l'ordre. 
    $$-3\leqslant x\leqslant -1 \; \Longrightarrow \; (-3)^{2}\geqslant x^{2}\geqslant (-1)^{2} \qquad \text{soit} \qquad \boxed{1\leqslant x^{2}\leqslant 9}$$
     C'est l'erreur la plus fréquente : écrire $9\leqslant x^{2}\leqslant 1$, ce qui n'a aucun sens.

    **5.** Non, car l'intervalle $[-2\,;3]$ contient $0$ : la fonction carré y est d'abord décroissante, puis croissante, et l'on ne peut pas appliquer la méthode précédente d'un seul coup. On raisonne alors directement : le plus petit carré est obtenu en $x=0$, et le plus grand à l'extrémité la plus éloignée de $0$, ici $3$. 
    $$\boxed{0\leqslant x^{2}\leqslant 9}$$
- id: "s-07-21"
  feuille: "f-s-07"
  numero: 21
  partie: "Fonctions de référence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonction inverse, encadrement]
  noeuds: [q-ordre]
  notions: [intervalle]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    **1.** Calculer $\dfrac{1}{4}$, $\dfrac{1}{-0{,}5}$ et $\dfrac{1}{\frac{2}{3}}$.

    **2.** Comparer, en justifiant :

    **(a)** $\dfrac{1}{3}$ et $\dfrac{1}{4}$

    **(b)** $\dfrac{1}{-3}$ et $\dfrac{1}{-4}$

    **(c)** $\dfrac{1}{-2}$ et $\dfrac{1}{5}$

    *La question c) mérite une attention particulière : les deux nombres sont-ils de même signe ?*

    **3.** On suppose que $2\leqslant x\leqslant 5$. Encadrer $\dfrac{1}{x}$.

    **4.** On suppose que $-4\leqslant x\leqslant -1$. Encadrer $\dfrac{1}{x}$.

    **5.** On suppose que $-2\leqslant x\leqslant 3$. Peut-on encadrer $\dfrac{1}{x}$ ? Expliquer.
  corrige: |
    **1.** 
    $$\frac{1}{4}=\boxed{0{,}25} \quad ; \quad \frac{1}{-0{,}5}=\boxed{-2} \quad ; \quad \frac{1}{\frac{2}{3}}=\boxed{\frac{3}{2}=1{,}5}$$
     On retiendra que l'inverse d'un quotient s'obtient en échangeant numérateur et dénominateur.

    **2.** **(a)** $0<3<4$ et la fonction inverse est décroissante sur $]0\,;+\infty[$ : $\boxed{\dfrac{1}{3}>\dfrac{1}{4}}$

    **(b)** $-4<-3<0$ et la fonction inverse est décroissante sur $]-\infty\,;0[$ : $\boxed{\dfrac{1}{-4}>\dfrac{1}{-3}}$

    **(c)** Ici les deux nombres $-2$ et $5$ sont de **signes contraires** : ils ne sont pas dans le même intervalle de monotonie, et l'on ne peut pas appliquer la propriété. On compare donc directement : 
    $$\frac{1}{-2}=-0{,}5 \quad \text{et} \quad \frac{1}{5}=0{,}2 \qquad \text{d'où} \qquad \boxed{\frac{1}{-2}<\frac{1}{5}}$$
     Un négatif est toujours plus petit qu'un positif. On observe au passage que l'ordre n'a *pas* été inversé, alors que $-2<5$ : c'est bien la preuve que la fonction inverse n'est pas décroissante sur $\mathbb{R}^{*}$ tout entier.

    **3.** Sur $[2\,;5]$, la fonction inverse est décroissante : 
    $$2\leqslant x\leqslant 5 \; \Longrightarrow \; \frac{1}{2}\geqslant\frac{1}{x}\geqslant \frac{1}{5} \qquad \text{soit} \qquad \boxed{\frac{1}{5}\leqslant\frac{1}{x}\leqslant \frac{1}{2}}$$

    **4.** Sur $[-4\,;-1]$, la fonction inverse est également décroissante : 
    $$-4\leqslant x\leqslant -1 \; \Longrightarrow \; -\frac{1}{4}\geqslant\frac{1}{x}\geqslant -1 \qquad \text{soit} \qquad \boxed{-1\leqslant\frac{1}{x}\leqslant -\frac{1}{4}}$$

    **5.** Non. L'intervalle $[-2\,;3]$ contient $0$, où la fonction inverse n'est même pas définie. De plus, en s'approchant de $0$, les valeurs de $\dfrac{1}{x}$ deviennent aussi grandes (ou aussi petites) que l'on veut. 
    $$\boxed{\text{Aucun encadrement n'est possible}}$$
- id: "s-07-22"
  feuille: "f-s-07"
  numero: 22
  partie: "Fonctions de référence"
  etoiles: 1
  types: [Calcul]
  mots_cles: [variations, fonction racine carrée, fonction cube]
  noeuds: [ar-corps, c-racine-reelle]
  notions: []
  page_enonce: 8
  page_corrige: 14
  enonce: |
    **1.** Calculer $\sqrt{0}$, $\sqrt{1}$, $\sqrt{49}$, $\sqrt{0{,}25}$ et $\sqrt{\dfrac{9}{16}}$.

    **2.** Comparer $\sqrt{5}$ et $\sqrt{7}$, puis $\sqrt{0{,}3}$ et $\sqrt{0{,}4}$.

    **3.** Résoudre les équations $\sqrt{x}=5$, $\sqrt{x}=0$ et $\sqrt{x}=-2$.

    **4.** Calculer $2^{3}$, $(-2)^{3}$, $(0{,}1)^{3}$ et $\left(-\dfrac{1}{2}\right)^{3}$.

    **5.** Comparer $(-2)^{3}$ et $(-1)^{3}$, puis $1{,}1^{3}$ et $1{,}2^{3}$.

    **6.** Résoudre les équations $x^{3}=8$ et $x^{3}=-27$. Combien chacune admet-elle de solutions ? Justifier à l'aide des variations de la fonction cube.
  corrige: |
    **1.** 
    $$\sqrt{0}=\boxed{0} \; ; \; \sqrt{1}=\boxed{1} \; ; \; \sqrt{49}=\boxed{7} \; ; \; \sqrt{0{,}25}=\boxed{0{,}5} \; ; \; \sqrt{\frac{9}{16}}=\boxed{\frac{3}{4}}$$

    **2.** La fonction racine carrée est croissante sur $[0\,;+\infty[$, donc elle conserve l'ordre : 
    $$5<7 \; \Longrightarrow \; \boxed{\sqrt{5}<\sqrt{7}} \qquad ; \qquad 0{,}3<0{,}4 \; \Longrightarrow \; \boxed{\sqrt{0{,}3}<\sqrt{0{,}4}}$$

    **3.** 
    $$\sqrt{x}=5 \iff x=5^{2} \iff \boxed{x=25} \qquad ; \qquad \sqrt{x}=0 \iff \boxed{x=0}$$

    $$\sqrt{x}=-2 : \boxed{\text{aucune solution}}, \text{ car une racine carrée est toujours positive}$$

    **4.** 
    $$2^{3}=\boxed{8} \; ; \; (-2)^{3}=\boxed{-8} \; ; \; (0{,}1)^{3}=\boxed{0{,}001} \; ; \; \left(-\frac{1}{2}\right)^{3}=\boxed{-\frac{1}{8}}$$
     Contrairement au carré, le cube conserve le signe.

    **5.** La fonction cube est croissante sur $\mathbb{R}$ : 
    $$-2<-1 \; \Longrightarrow \; \boxed{(-2)^{3}<(-1)^{3}} \qquad ; \qquad 1{,}1<1{,}2 \; \Longrightarrow \; \boxed{1{,}1^{3}<1{,}2^{3}}$$

    **6.** 
    $$x^{3}=8 \iff \boxed{x=2} \qquad ; \qquad x^{3}=-27 \iff \boxed{x=-3}$$

    $$\boxed{\text{Chaque équation admet exactement une solution}}$$
     En effet, la fonction cube étant *strictement croissante* sur $\mathbb{R}$, elle ne peut pas prendre deux fois la même valeur : contrairement à la fonction carré, il n'y a jamais deux antécédents.
- id: "s-07-23"
  feuille: "f-s-07"
  numero: 23
  partie: "Fonctions de référence"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction carré, fonction racine carrée, fonction inverse, fonction cube, encadrement]
  noeuds: [c-racine-reelle, q-ordre]
  notions: [intervalle]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    **1.** On suppose que $1\leqslant x\leqslant 4$. Encadrer successivement :

    **(a)** $x^{2}$

    **(b)** $\sqrt{x}$

    **(c)** $\dfrac{1}{x}$

    **(d)** $x^{3}$

    **(e)** $2x^{2}+1$

    **(f)** $3-\dfrac{1}{x}$

    **2.** On suppose que $-3\leqslant x\leqslant -1$. Encadrer $x^{2}$, $x^{3}$ et $\dfrac{1}{x}$. Pourquoi ne peut-on pas encadrer $\sqrt{x}$ ?

    **3.** On suppose que $0\leqslant x\leqslant 1$. Encadrer $x^{2}$ puis $5-3x^{2}$.
  corrige: |
    **1.** On suppose $1\leqslant x\leqslant 4$. Sur cet intervalle, les fonctions carré, racine carrée et cube sont croissantes, tandis que la fonction inverse est décroissante.

    **(a)** $\boxed{1\leqslant x^{2}\leqslant 16}$

    **(b)** $\boxed{1\leqslant\sqrt{x}\leqslant 2}$

    **(c)** L'ordre est inversé : $\boxed{\dfrac{1}{4}\leqslant\dfrac{1}{x}\leqslant 1}$

    **(d)** $\boxed{1\leqslant x^{3}\leqslant 64}$

    **(e)** On part de a) et l'on multiplie par $2$ (positif, l'ordre est conservé), puis on ajoute $1$ : 
    $$2\leqslant 2x^{2}\leqslant 32 \qquad \text{puis} \qquad \boxed{3\leqslant 2x^{2}+1\leqslant 33}$$

    **(f)** On part de c) et l'on multiplie par $-1$, ce qui **inverse** l'ordre, puis on ajoute $3$ : 
    $$-1\leqslant -\frac{1}{x}\leqslant -\frac{1}{4} \qquad \text{puis} \qquad \boxed{2\leqslant 3-\frac{1}{x}\leqslant\frac{11}{4}=2{,}75}$$

    **2.** On suppose $-3\leqslant x\leqslant -1$. La fonction carré est décroissante sur cet intervalle, la fonction cube y est croissante, et la fonction inverse décroissante : 
    $$\boxed{1\leqslant x^{2}\leqslant 9} \qquad ; \qquad \boxed{-27\leqslant x^{3}\leqslant -1} \qquad ; \qquad \boxed{-1\leqslant\frac{1}{x}\leqslant -\frac{1}{3}}$$
     Quant à $\sqrt{x}$ : $\boxed{\text{la racine carrée n'est pas définie pour } x<0}$

    **3.** On suppose $0\leqslant x\leqslant 1$. La fonction carré est croissante sur $[0\,;1]$ : 
    $$\boxed{0\leqslant x^{2}\leqslant 1}$$
     On multiplie par $-3$, ce qui inverse l'ordre, puis on ajoute $5$ : 
    $$-3\leqslant -3x^{2}\leqslant 0 \qquad \text{puis} \qquad \boxed{2\leqslant 5-3x^{2}\leqslant 5}$$
- id: "s-07-24"
  feuille: "f-s-07"
  numero: 24
  partie: "Fonctions de référence"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonction carré]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **a)** $x^{2}=36$

    **b)** $x^{2}=7$

    **c)** $x^{2}=0$

    **d)** $x^{2}=-4$

    **e)** $x^{2}=0{,}49$

    **f)** $(x-1)^{2}=16$

    **g)** $(x+3)^{2}=25$

    **h)** $x^{2}=2x$

    Pour la question h), on prendra garde à ne surtout pas diviser les deux membres par $x$ : que se passerait-il si $x$ valait $0$ ?
  corrige: |
    On applique la proposition 5 du cours : l'équation $x^{2}=a$ admet deux solutions si $a>0$, une seule si $a=0$, aucune si $a<0$.

    **a)** $\boxed{S=\{-6\,;6\}}$

    **b)** $\boxed{S=\left\{-\sqrt{7}\,;\sqrt{7}\right\}}$

    *Les solutions ne sont pas des entiers : on les laisse sous forme exacte.*

    **c)** $\boxed{S=\{0\}}$

    **d)** Un carré ne peut pas être négatif : $\boxed{S=\varnothing}$

    **e)** $\sqrt{0{,}49}=0{,}7$, donc $\boxed{S=\{-0{,}7\,;0{,}7\}}$

    **f)** L'équation $(x-1)^{2}=16$ signifie que $x-1$ a pour carré $16$, donc $x-1=4$ ou $x-1=-4$ : 
    $$\boxed{S=\{-3\,;5\}}$$

    **g)** De même, $x+3=5$ ou $x+3=-5$ : $\boxed{S=\{-8\,;2\}}$

    **h)** On ramène tout dans le même membre, puis on factorise : 
    $$x^{2}=2x \iff x^{2}-2x=0 \iff x(x-2)=0$$
     Par produit nul : $\boxed{S=\{0\,;2\}}$

    Si l'on avait divisé les deux membres de h) par $x$, on aurait obtenu $x=2$ et perdu la solution $x=0$. **On ne divise jamais par une expression susceptible d'être nulle** : on factorise.
- id: "s-07-25"
  feuille: "f-s-07"
  numero: 25
  partie: "Fonctions de référence"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonction carré, fonction racine carrée, fonction cube]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 9
  page_corrige: 16
  enonce: |
    **1.** Pour $x=0{,}25$, calculer $\sqrt{x}$, $x$, $x^{2}$ et $x^{3}$, puis ranger ces quatre nombres dans l'ordre croissant.

    **2.** Reprendre la question précédente pour $x=4$.

    **3.** Énoncer, à l'aide du théorème du cours, la règle générale permettant de comparer $\sqrt{x}$, $x$, $x^{2}$ et $x^{3}$ selon la position de $x$ par rapport à $1$.

    **4.** Sans aucun calcul, ranger dans l'ordre croissant :

    **(a)** $0{,}8$ ; $0{,}8^{2}$ ; $0{,}8^{3}$ ; $\sqrt{0{,}8}$

    **(b)** $1{,}3$ ; $1{,}3^{2}$ ; $1{,}3^{3}$ ; $\sqrt{1{,}3}$

    **5.** Soit $x$ un réel tel que $0<x<1$. Démontrer que $x^{2}<x$.

    *On pourra étudier le signe de $x^{2}-x$ après l'avoir factorisé.*
  corrige: |
    **1.** Pour $x=0{,}25$ : 
    $$\sqrt{0{,}25}=0{,}5 \quad ; \quad x=0{,}25 \quad ; \quad x^{2}=0{,}0625 \quad ; \quad x^{3}=0{,}015625$$

    $$\boxed{x^{3}<x^{2}<x<\sqrt{x}}$$

    **2.** Pour $x=4$ : 
    $$\sqrt{4}=2 \quad ; \quad x=4 \quad ; \quad x^{2}=16 \quad ; \quad x^{3}=64$$

    $$\boxed{\sqrt{x}<x<x^{2}<x^{3}}$$

    **3.** Les deux exemples précédents illustrent le théorème du cours : 
    $$\boxed{\begin{array}{ll} \text{si } 0<x<1 & : \; \sqrt{x}>x>x^{2}>x^{3} \\[1mm] \text{si } x>1 & : \; \sqrt{x}<x<x^{2}<x^{3} \\[1mm] \text{si } x=0 \text{ ou } x=1 & : \; \sqrt{x}=x=x^{2}=x^{3} \end{array}}$$
     Autrement dit, élever à une puissance *diminue* un nombre compris entre $0$ et $1$, mais *augmente* un nombre supérieur à $1$. Le point de bascule est $1$.

    **4.** **(a)** Comme $0<0{,}8<1$ : $\boxed{0{,}8^{3}<0{,}8^{2}<0{,}8<\sqrt{0{,}8}}$

    **(b)** Comme $1{,}3>1$ : $\boxed{\sqrt{1{,}3}<1{,}3<1{,}3^{2}<1{,}3^{3}}$

    **5.** Soit $x$ tel que $0<x<1$. On factorise la différence : 
    $$x^{2}-x=x(x-1)$$
     Le facteur $x$ est strictement positif, et le facteur $x-1$ est strictement négatif puisque $x<1$. Le produit d'un nombre positif par un nombre négatif étant négatif : 
    $$x^{2}-x<0 \qquad \text{c'est-à-dire} \qquad \boxed{x^{2}<x}$$
- id: "s-07-26"
  feuille: "f-s-07"
  numero: 26
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [QCM, Démonstration]
  mots_cles: [images et antécédents, ensemble de définition, variations, extremums, fonction carré, fonction racine carrée, fonction inverse]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 10
  page_corrige: 17
  enonce: |
    Pour chaque question, une seule réponse est exacte. La justifier.

    ```tableau
    **Question** ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. $f$ est définie par $f(x)=x^{2}-3$. L'image de $-2$ est : ¦ $1$ ¦ $7$ ¦ $-7$
    2. L'ensemble de définition de $x\mapsto\dfrac{1}{x-5}$ est : ¦ $\mathbb{R}$ ¦ $\mathbb{R}\setminus\{5\}$ ¦ $[5\,;+\infty[$
    3. L'ensemble de définition de $x\mapsto\sqrt{x+2}$ est : ¦ $[-2\,;+\infty[$ ¦ $[2\,;+\infty[$ ¦ $]-\infty\,;-2]$
    4. L'équation $x^{2}=10$ admet : ¦ aucune solution ¦ une solution ¦ deux solutions
    5. Si $2<x<6$, alors : ¦ $\dfrac{1}{2}<\dfrac{1}{x}<\dfrac{1}{6}$ ¦ $\dfrac{1}{6}<\dfrac{1}{x}<\dfrac{1}{2}$ ¦ on ne peut pas conclure
    6. La fonction inverse est : ¦ croissante sur $\mathbb{R}^{*}$ ¦ décroissante sur $\mathbb{R}^{*}$ ¦ décroissante sur $]-\infty\,;0[$ et sur $]0\,;+\infty[$
    7. Si $0<x<1$, alors : ¦ $x^{2}<x$ ¦ $x^{2}>x$ ¦ $x^{2}=x$
    8. Le maximum de $f$ sur $[0\,;5]$ vaut $7$ et est atteint en $3$. Cela signifie que : ¦ $f(7)=3$ ¦ $f(3)=7$ ¦ $f(3)=5$
    9. L'équation $\sqrt{x}=3$ admet : ¦ aucune solution ¦ une solution ¦ deux solutions
    10. Par une fonction $f$, un réel de l'ensemble de définition admet : ¦ exactement une image ¦ au plus un antécédent ¦ toujours deux antécédents
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    1 ¦ **A** ¦ $f(-2)=(-2)^{2}-3=4-3=1$. La réponse B viendrait de $-2^{2}$ mal interprété.
    2 ¦ **B** ¦ Le dénominateur $x-5$ s'annule pour $x=5$, et seulement pour cette valeur.
    3 ¦ **A** ¦ Il faut $x+2\geqslant 0$, c'est-à-dire $x\geqslant -2$.
    4 ¦ **C** ¦ $10>0$, donc l'équation admet deux solutions, $\sqrt{10}$ et $-\sqrt{10}$.
    5 ¦ **B** ¦ La fonction inverse est décroissante sur $]0\,;+\infty[$ : elle inverse l'ordre. La réponse A conserve l'ordre, ce qui est l'erreur classique.
    6 ¦ **C** ¦ Elle est décroissante sur chacun des deux intervalles, mais pas sur leur réunion : $-1<2$ alors que $\frac{1}{-1}=-1$ est plus petit que $\frac{1}{2}$.
    7 ¦ **A** ¦ C'est le théorème du cours : sur $]0\,;1[$, élever au carré diminue le nombre.
    8 ¦ **B** ¦ Le maximum est une *ordonnée* ($7$), atteinte en une *abscisse* ($3$).
    9 ¦ **B** ¦ $\sqrt{x}=3$ équivaut à $x=9$. Contrairement à $x^{2}=9$, il n'y a qu'une solution : la racine carrée est toujours positive.
    10 ¦ **A** ¦ C'est la définition même d'une fonction. La réponse B est fausse : une image peut avoir plusieurs antécédents.
    ```
- id: "s-07-27"
  feuille: "f-s-07"
  numero: 27
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [images et antécédents, ensemble de définition, courbe représentative, variations, extremums, fonction carré, fonction racine carrée, fonction cube]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 10
  page_corrige: 17
  enonce: |
    Chacune des affirmations suivantes est-elle vraie ou fausse ? Justifier la réponse : par une démonstration si l'affirmation est vraie, par un contre-exemple sinon.

    **1.** Toute fonction peut être décrite par une expression algébrique.

    **2.** Un nombre peut avoir plusieurs antécédents par une fonction.

    **3.** Un nombre peut avoir plusieurs images par une fonction.

    **4.** La fonction $x\mapsto\sqrt{x}$ est définie sur $\mathbb{R}$.

    **5.** Pour tout réel $x$, $x^{2}\geqslant 0$.

    **6.** Pour tout réel $x$, $x^{3}\geqslant 0$.

    **7.** Si $a<b$, alors $a^{2}<b^{2}$.

    **8.** Si $0<a<b$, alors $\dfrac{1}{a}>\dfrac{1}{b}$.

    **9.** Le maximum d'une fonction est l'abscisse du point le plus haut de sa courbe.

    **10.** La fonction carré est décroissante sur $]-\infty\,;0]$.
  corrige: |
    **1.** **Fausse**. Une courbe relevée par un capteur, ou un tableau de mesures, définissent parfaitement une fonction sans qu'aucune formule ne les décrive. C'est la remarque du cours.

    **2.** **Vraie**. Par exemple, avec la fonction carré, le nombre $9$ admet deux antécédents, $3$ et $-3$, puisque $3^{2}=(-3)^{2}=9$.

    **3.** **Fausse**. C'est précisément ce que la définition interdit : à chaque antécédent correspond **une unique** image. Graphiquement, une droite verticale ne coupe la courbe qu'en un point au plus.

    **4.** **Fausse**. La racine carrée n'est définie que pour les nombres positifs : $\sqrt{-4}$ n'existe pas. Son ensemble de définition est $[0\,;+\infty[$.

    **5.** **Vraie**. C'est la proposition 1 du cours : $x^{2}=x\times x$ est un produit de deux nombres de même signe, donc positif.

    **6.** **Fausse**. Contre-exemple avec $x=-2$ : 
    $$(-2)^{3}=-8<0$$
     Contrairement au carré, le cube conserve le signe de $x$.

    **7.** **Fausse**. Contre-exemple avec $a=-3$ et $b=1$ : on a bien $-3<1$, mais 
    $$a^{2}=9 \qquad \text{et} \qquad b^{2}=1 \qquad \text{donc} \qquad a^{2}>b^{2}$$
     L'implication n'est vraie que si $a$ et $b$ sont tous deux positifs.

    **8.** **Vraie**. Les réels $a$ et $b$ sont tous deux dans $]0\,;+\infty[$, où la fonction inverse est décroissante : elle inverse donc l'ordre. C'est exactement la remarque du cours.

    **9.** **Fausse**. Le maximum est l'**ordonnée** du point le plus haut, pas son abscisse. L'abscisse indique seulement *où* le maximum est atteint.

    **10.** **Vraie**. C'est la proposition 1 du cours. On peut le redémontrer : si $a<b\leqslant 0$, alors $a+b\leqslant 0$ et $a-b<0$, donc $(a-b)(a+b)\geqslant 0$, c'est-à-dire $a^{2}\geqslant b^{2}$ : l'ordre est bien inversé.
- id: "s-07-28"
  feuille: "f-s-07"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonction carré, "problème d'optimisation"]
  noeuds: [c-racine-reelle, ar-corps]
  notions: []
  page_enonce: 11
  page_corrige: 18
  enonce: |
    Un éleveur dispose de $40$ mètres de grillage pour construire un enclos rectangulaire le long d'un mur, le mur servant de quatrième côté. On note $x$ la largeur de l'enclos, en mètres.

    ![Figure](documents/figures/839c1bdafe6abdd4.svg)

    **1.** Justifier que la longueur de l'enclos vaut $40-2x$ mètres, puis que $x$ appartient nécessairement à l'intervalle $]0\,;20[$.

    **2.** Démontrer que l'aire de l'enclos, en m$^{2}$, est donnée par $\mathcal{A}(x)=x(40-2x)$.

    **3.** Calculer $\mathcal{A}(5)$, $\mathcal{A}(10)$ et $\mathcal{A}(15)$. Que remarque-t-on ?

    **4.** Développer $\mathcal{A}(x)$, puis vérifier que pour tout $x$ de $]0\,;20[$ : 
    $$\mathcal{A}(x)=-2(x-10)^{2}+200$$

    **5.** En utilisant le fait qu'un carré est toujours positif, démontrer que pour tout $x$ de $]0\,;20[$, $\mathcal{A}(x)\leqslant 200$.

    **6.** En déduire les dimensions de l'enclos d'aire maximale, ainsi que cette aire.
  corrige: |
    **1.** Le grillage ne couvre que trois côtés : les deux largeurs, de $x$ mètres chacune, et la longueur. La longueur vaut donc $40-2x$ mètres.

    Comme il s'agit de longueurs, on doit avoir $x>0$ et $40-2x>0$, c'est-à-dire $40>2x$, soit $x<20$ : 
    $$\boxed{x\in\left]0\,;20\right[}$$

    **2.** L'aire d'un rectangle est le produit de ses deux dimensions : 
    $$\boxed{\mathcal{A}(x)=x(40-2x)}$$

    **3.** 
    $$\mathcal{A}(5)=5\times 30=\boxed{150} \quad ; \quad \mathcal{A}(10)=10\times 20=\boxed{200} \quad ; \quad \mathcal{A}(15)=15\times 10=\boxed{150}$$
     Les valeurs en $5$ et en $15$ sont égales, et celle en $10$ leur est supérieure : l'aire semble maximale au milieu de l'intervalle.

    **4.** On développe : 
    $$\mathcal{A}(x)=x(40-2x)=40x-2x^{2}=\boxed{-2x^{2}+40x}$$
     On développe ensuite l'expression proposée : 
    $$\begin{aligned} -2(x-10)^{2}+200 &= -2\left(x^{2}-20x+100\right)+200 \\ &= -2x^{2}+40x-200+200 \\ &= -2x^{2}+40x \end{aligned}$$
     Les deux expressions coïncident : $\boxed{\mathcal{A}(x)=-2(x-10)^{2}+200}$

    **5.** Soit $x$ un réel quelconque de $]0\,;20[$. On sait que $(x-10)^{2}\geqslant 0$. En multipliant par $-2$, ce qui **inverse** l'inégalité : 
    $$-2(x-10)^{2}\leqslant 0$$
     Puis en ajoutant $200$ aux deux membres : 
    $$-2(x-10)^{2}+200\leqslant 200 \qquad \text{c'est-à-dire} \qquad \boxed{\mathcal{A}(x)\leqslant 200}$$

    **6.** L'aire ne dépasse donc jamais $200$ m$^{2}$. Or cette valeur est effectivement atteinte : $\mathcal{A}(10)=-2\times 0+200=200$, et $10$ appartient bien à $]0\,;20[$. 
    $$\boxed{\text{L'aire maximale vaut } 200 \text{ m}^{2}}$$
     Elle est obtenue pour une largeur de $10$ m et une longueur de $40-20=20$ m : 
    $$\boxed{\text{l'enclos optimal mesure } 10 \text{ m sur } 20 \text{ m}}$$
     On remarquera que, contrairement à l'exercice 8, le rectangle optimal n'est pas un carré : le mur change complètement le problème, puisqu'un des côtés est gratuit.
- id: "s-07-29"
  feuille: "f-s-07"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [images et antécédents, ensemble de définition, courbe représentative, variations, extremums, fonction carré]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 11
  page_corrige: 19
  enonce: |
    Soit $f$ la fonction définie sur $[-2\,;4]$ par $f(x)=x^{2}-2x-3$. C'est la fonction dont la courbe a été tracée à l'exercice 9.

    **Partie A : deux écritures utiles.**

    **1.** Démontrer que pour tout réel $x$, $f(x)=(x-1)^{2}-4$.

    **2.** Démontrer que pour tout réel $x$, $f(x)=(x+1)(x-3)$.

    **Partie B : extremum et signe.**

    **3.** À l'aide de la première écriture, démontrer que pour tout $x$ de $[-2\,;4]$, $f(x)\geqslant -4$. En déduire que $f$ admet un minimum, que l'on précisera, ainsi que la valeur de $x$ en laquelle il est atteint.

    **4.** À l'aide de la seconde écriture, déterminer les antécédents de $0$ par $f$.

    **5.** Calculer $f(0)$ et $f(2)$. Que remarque-t-on ? Interpréter ce résultat sur la courbe, en s'aidant de l'écriture obtenue à la question 1.

    **Partie C : variations.**

    **6.** Soient $x_{1}$ et $x_{2}$ deux réels tels que $1\leqslant x_{1}\leqslant x_{2}\leqslant 4$.

    **(a)** Démontrer que $f(x_{2})-f(x_{1})=(x_{2}-x_{1})(x_{2}+x_{1}-2)$.

    **(b)** Justifier que ce produit est positif, puis conclure quant au sens de variation de $f$ sur $[1\,;4]$.

    **7.** On admet que $f$ est décroissante sur $[-2\,;1]$. Dresser le tableau de variations de $f$ sur $[-2\,;4]$.

    **8.** Résoudre l'équation $f(x)=5$ en utilisant l'écriture de la question 1.

    **9.** Vérifier que tous les résultats obtenus sont cohérents avec la courbe de l'exercice 9.
  corrige: |
    **Partie A : deux écritures utiles.**

    **1.** On développe le membre de droite : 
    $$(x-1)^{2}-4=x^{2}-2\times x\times 1+1^{2}-4=x^{2}-2x+1-4=x^{2}-2x-3=f(x)$$

    $$\boxed{f(x)=(x-1)^{2}-4}$$

    **2.** On développe de même : 
    $$(x+1)(x-3)=x^{2}-3x+x-3=x^{2}-2x-3=f(x)$$

    $$\boxed{f(x)=(x+1)(x-3)}$$

    **Partie B : extremum et symétrie.**

    **3.** Pour tout réel $x$, $(x-1)^{2}\geqslant 0$. En retranchant $4$ aux deux membres : 
    $$(x-1)^{2}-4\geqslant -4 \qquad \text{c'est-à-dire} \qquad \boxed{f(x)\geqslant -4}$$
     De plus $f(1)=(1-1)^{2}-4=-4$, et $1$ appartient à $[-2\,;4]$ : la valeur $-4$ est bien atteinte. 
    $$\boxed{f \text{ admet pour minimum } -4 \text{ sur } [-2\,;4], \text{ atteint pour } x=1}$$

    **4.** Avec la seconde écriture, $f(x)=0$ équivaut à $(x+1)(x-3)=0$. Par produit nul : 
    $$\boxed{\text{Les antécédents de } 0 \text{ sont } -1 \text{ et } 3}$$

    **5.** 
    $$f(0)=(0-1)^{2}-4=1-4=\boxed{-3} \qquad ; \qquad f(2)=(2-1)^{2}-4=1-4=\boxed{-3}$$
     Les deux images sont égales. Ce n'est pas un hasard : dans l'écriture $f(x)=(x-1)^{2}-4$, seule compte la *distance* de $x$ à $1$, puisque le carré efface le signe. Or $0$ et $2$ sont tous deux à la distance $1$ de $1$. 
    $$\boxed{\text{La courbe est symétrique par rapport à la droite verticale d'équation } x=1}$$
     C'est bien ce que l'on observe sur la figure de l'exercice 9 : les couples d'antécédents trouvés, $(-1\,;3)$ et $(-2\,;4)$, sont eux aussi symétriques autour de $1$.

    **Partie C : variations.**

    **6.** **(a)** En utilisant l'écriture de la question 1 : 
    $$\begin{aligned} f(x_{2})-f(x_{1}) &= \left[(x_{2}-1)^{2}-4\right]-\left[(x_{1}-1)^{2}-4\right] \\ &= (x_{2}-1)^{2}-(x_{1}-1)^{2} \end{aligned}$$
     On reconnaît une différence de deux carrés, $A^{2}-B^{2}=(A-B)(A+B)$, avec $A=x_{2}-1$ et $B=x_{1}-1$ : 
    $$\begin{aligned} f(x_{2})-f(x_{1}) &= \left[(x_{2}-1)-(x_{1}-1)\right]\times\left[(x_{2}-1)+(x_{1}-1)\right] \\ &= \boxed{(x_{2}-x_{1})(x_{2}+x_{1}-2)} \end{aligned}$$

    **(b)** Le premier facteur est positif puisque $x_{1}\leqslant x_{2}$. Pour le second, on utilise $x_{1}\geqslant 1$ et $x_{2}\geqslant 1$, d'où $x_{1}+x_{2}\geqslant 2$, c'est-à-dire $x_{2}+x_{1}-2\geqslant 0$. Le produit de deux nombres positifs est positif : 
    $$f(x_{2})-f(x_{1})\geqslant 0 \qquad \text{donc} \qquad f(x_{1})\leqslant f(x_{2})$$

    $$\boxed{f \text{ est croissante sur } [1\,;4]}$$

    **7.** On complète avec les valeurs $f(-2)=5$, $f(1)=-4$ et $f(4)=5$ :

    ![Figure](documents/figures/abf63307e51c4be1.svg)

    **8.** En repartant de l'écriture de la question 1 : 
    $$f(x)=5 \iff (x-1)^{2}-4=5 \iff (x-1)^{2}=9$$
     Le nombre $x-1$ a donc pour carré $9$ : il vaut $3$ ou $-3$. 
    $$x-1=3 \; \Longrightarrow \; x=4 \qquad ; \qquad x-1=-3 \; \Longrightarrow \; x=-2$$

    $$\boxed{S=\{-2\,;4\}}$$

    **9.** Tout concorde avec la lecture graphique de l'exercice 9 :

    • le point le plus bas de la courbe a pour ordonnée $-4$ et pour abscisse $1$ (question 3) ;

    • la courbe coupe l'axe des abscisses en $-1$ et $3$ (question 4) ;

    • elle passe par les points $(0\,;-3)$ et $(2\,;-3)$, symétriques par rapport à la droite d'équation $x=1$ (question 5) ;

    • elle descend puis remonte, avec $f(-2)=f(4)=5$ aux deux extrémités (questions 6 et 7) ;

    • les antécédents de $5$ sont bien $-2$ et $4$ (question 8).

    $$\boxed{\text{Le calcul confirme entièrement ce que la courbe laissait deviner}}$$

