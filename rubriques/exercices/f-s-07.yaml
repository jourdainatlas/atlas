- id: "s-07-01"
  feuille: "f-s-07"
  numero: 1
  partie: "Notion de fonction, images et antécédents"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [images et antécédents, ensemble de définition]
  noeuds: [r-application]
  notions: [application]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $f$ une fonction définie sur $\mathbb{R}$ telle que : 
    $$f(2)=7 \qquad ; \qquad f(-3)=0 \qquad ; \qquad f(5)=7$$

    **1.** Quelle est l'image de $2$ par $f$ ?

    **2.** Donner un antécédent de $7$ par $f$. Y en a-t-il un autre ?

    **3.** Le nombre $0$ admet-il un antécédent par $f$ ? Si oui, lequel ?

    **4.** Recopier et compléter : « $7$ est …… de $2$ par $f$ » et « $-3$ est …… de $0$ par $f$ ».

    **5.** Traduire l'égalité $f(-3)=0$ par une phrase en français.

    **6.** Peut-on affirmer que $f(7)=2$ ? Justifier.
  corrige: |
    **1.** L'égalité $f(2)=7$ se lit directement : $\boxed{\text{l'image de } 2 \text{ est } 7}$

    **2.** Un antécédent de $7$ est un nombre dont l'image vaut $7$. Comme $f(2)=7$, le nombre $2$ convient. Mais on a aussi $f(5)=7$ : 
    $$\boxed{7 \text{ admet (au moins) deux antécédents : } 2 \text{ et } 5}$$

    **3.** Oui, puisque $f(-3)=0$ : $\boxed{-3 \text{ est un antécédent de } 0}$

    **4.** 
    $$\boxed{\begin{array}{l} \text{« } 7 \text{ est l'\textbf{image} de } 2 \text{ par } f \text{ »} \\[1mm] \text{« } -3 \text{ est un \textbf{antécédent} de } 0 \text{ par } f \text{ »} \end{array}}$$
     On retiendra que l'image est *la* valeur obtenue (elle est unique), alors qu'un antécédent est *un* nombre de départ possible : d'où l'article défini dans un cas, indéfini dans l'autre.

    **5.** 
    $$\boxed{\text{« L'image de } -3 \text{ par } f \text{ est } 0 \text{ »}}$$
     On peut aussi dire : « $-3$ a pour image $0$ », ou encore « $-3$ est un antécédent de $0$ ».

    **6.** Non. L'égalité $f(2)=7$ signifie que $2$ a pour image $7$, et non l'inverse. Rien dans l'énoncé ne renseigne sur l'image de $7$. 
    $$\boxed{\text{On ne peut rien affirmer sur } f(7)}$$
- id: "s-07-02"
  feuille: "f-s-07"
  numero: 2
  partie: "Notion de fonction, images et antécédents"
  etoiles: 1
  types: [Calcul]
  mots_cles: [images et antécédents, ensemble de définition, fonction carré, fonction racine carrée]
  noeuds: [r-application, c-racine-reelle]
  notions: [application]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les images demandées.

    **1.** $f$ est définie sur $\mathbb{R}$ par $f(x)=3x^{2}-5$. Calculer $f(0)$, $f(2)$, $f(-1)$ et $f\!\left(\dfrac{1}{2}\right)$.

    **2.** $g$ est définie sur $\mathbb{R}$ par $g(x)=(x-6)^{2}$. Calculer $g(2)$, $g(6)$, $g(0)$ et $g(-1)$.

    **3.** $h$ est définie par $h(x)=\dfrac{2x+1}{x-4}$. Calculer $h(0)$, $h(1)$ et $h(-2)$. Que se passe-t-il si l'on essaie de calculer $h(4)$ ?

    **4.** $k$ est définie par $k(x)=\sqrt{x-3}$. Calculer $k(3)$, $k(7)$ et $k(12)$. Peut-on calculer $k(1)$ ?
  corrige: |
    **1.** $f(x)=3x^{2}-5$ : 
    $$f(0)=3\times 0^{2}-5=\boxed{-5} \qquad ; \qquad f(2)=3\times 4-5=\boxed{7}$$

    $$f(-1)=3\times(-1)^{2}-5=3\times 1-5=\boxed{-2} \qquad ; \qquad f\!\left(\frac{1}{2}\right)=3\times\frac{1}{4}-5=\frac{3}{4}-\frac{20}{4} =\boxed{-\frac{17}{4}}$$
     Attention en calculant $f(-1)$ : c'est $(-1)^{2}=1$, et non $-1^{2}$.

    **2.** $g(x)=(x-6)^{2}$ : 
    $$g(2)=(2-6)^{2}=(-4)^{2}=\boxed{16} \qquad ; \qquad g(6)=0^{2}=\boxed{0}$$

    $$g(0)=(-6)^{2}=\boxed{36} \qquad ; \qquad g(-1)=(-7)^{2}=\boxed{49}$$

    **3.** $h(x)=\dfrac{2x+1}{x-4}$ : 
    $$h(0)=\frac{1}{-4}=\boxed{-\frac{1}{4}} \qquad ; \qquad h(1)=\frac{3}{-3}=\boxed{-1} \qquad ; \qquad h(-2)=\frac{-3}{-6}=\boxed{\frac{1}{2}}$$
     Pour $x=4$, le dénominateur vaut $4-4=0$ : 
    $$\boxed{h(4) \text{ n'existe pas : on ne peut pas diviser par } 0}$$

    **4.** $k(x)=\sqrt{x-3}$ : 
    $$k(3)=\sqrt{0}=\boxed{0} \qquad ; \qquad k(7)=\sqrt{4}=\boxed{2} \qquad ; \qquad k(12)=\sqrt{9}=\boxed{3}$$
     Pour $x=1$, on aurait $\sqrt{1-3}=\sqrt{-2}$ : 
    $$\boxed{k(1) \text{ n'existe pas : une racine carrée ne porte que sur un nombre positif}}$$
- id: "s-07-03"
  feuille: "f-s-07"
  numero: 3
  partie: "Notion de fonction, images et antécédents"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [images et antécédents, ensemble de définition, fonction carré]
  noeuds: [r-application, c-racine-reelle]
  notions: [application]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=-x^{2}+2x$.

    **1.** Recopier et compléter le tableau de valeurs suivant.

    $$\begin{array}{|c||c|c|c|c|c|c|c|} \hline x & -2 & -1 & 0 & 1 & 2 & 3 & 4 \\ \hline f(x) &  &  &  &  &  &  &  \\ \hline \end{array}$$

    **2.** Quels sont, parmi les nombres du tableau, ceux qui ont pour image $0$ ?

    **3.** Quel est le plus grand nombre figurant sur la deuxième ligne ? Pour quelle valeur de $x$ est-il atteint ?

    **4.** Deux nombres différents peuvent-ils avoir la même image ? Et deux nombres différents peuvent-ils être deux images d'un même nombre ? Justifier à l'aide du tableau.
  corrige: |
    **1.** On calcule chaque image, en prenant garde au carré d'un nombre négatif. Par exemple $f(-2)=-(-2)^{2}+2\times(-2)=-4-4=-8$.

    $$\begin{array}{|c||c|c|c|c|c|c|c|} \hline x & -2 & -1 & 0 & 1 & 2 & 3 & 4 \\ \hline f(x) & -8 & -3 & 0 & 1 & 0 & -3 & -8 \\ \hline \end{array}$$

    **2.** On lit sur la deuxième ligne les cases contenant $0$ : 
    $$\boxed{0 \text{ et } 2 \text{ ont pour image } 0}$$

    **3.** 
    $$\boxed{\text{Le plus grand nombre de la deuxième ligne est } 1, \text{ atteint pour } x=1}$$

    **4.** Oui pour la première question : $-1$ et $3$ ont tous deux pour image $-3$, de même que $-2$ et $4$ ont pour image $-8$. 
    $$\boxed{\text{Deux nombres différents peuvent avoir la même image}}$$
     Non pour la seconde : chaque colonne du tableau ne contient qu'une seule valeur en deuxième ligne. 
    $$\boxed{\text{Un nombre ne peut pas avoir deux images différentes}}$$
     C'est exactement ce qu'impose la définition d'une fonction : l'unicité n'est exigée que dans un sens.
- id: "s-07-04"
  feuille: "f-s-07"
  numero: 4
  partie: "Notion de fonction, images et antécédents"
  etoiles: 1
  types: [Calcul]
  mots_cles: [images et antécédents, fonction carré]
  noeuds: [r-application, c-racine-reelle]
  notions: [application]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Dans chaque cas, déterminer par le calcul les antécédents demandés. *Chercher un antécédent, c'est résoudre une équation.*

    **1.** $f(x)=2x-7$ : déterminer les antécédents de $3$, de $0$ et de $-7$.

    **2.** $g(x)=x^{2}$ : déterminer les antécédents de $9$, de $0$ et de $-4$.

    **3.** $h(x)=(x-1)(x+4)$ : déterminer les antécédents de $0$.

    **4.** $k(x)=\dfrac{3}{x}$ : déterminer les antécédents de $6$, puis de $0$.
  corrige: |
    **1.** $f(x)=2x-7$. Chercher l'antécédent de $3$, c'est résoudre $f(x)=3$ : 
    $$2x-7=3 \iff 2x=10 \iff \boxed{x=5}$$

    $$2x-7=0 \iff 2x=7 \iff \boxed{x=\frac{7}{2}=3{,}5} \qquad ; \qquad 2x-7=-7 \iff 2x=0 \iff \boxed{x=0}$$
     Chaque nombre admet ici un unique antécédent.

    **2.** $g(x)=x^{2}$ : 
    $$x^{2}=9 \iff \boxed{x=3 \text{ ou } x=-3}$$

    $$x^{2}=0 \iff \boxed{x=0}$$

    $$x^{2}=-4 : \boxed{\text{aucun antécédent}}, \text{ car un carré est toujours positif}$$
     On retrouve les trois cas de la proposition 5 du cours.

    **3.** $h(x)=(x-1)(x+4)$. Un produit est nul si et seulement si l'un de ses facteurs est nul : 
    $$(x-1)(x+4)=0 \iff x-1=0 \text{ ou } x+4=0 \iff \boxed{x=1 \text{ ou } x=-4}$$

    **4.** $k(x)=\dfrac{3}{x}$, définie pour $x\neq 0$ : 
    $$\frac{3}{x}=6 \iff 3=6x \iff \boxed{x=\frac{1}{2}}$$
     Pour $0$ : il faudrait $\dfrac{3}{x}=0$, donc $3=0\times x=0$, ce qui est absurde. 
    $$\boxed{0 \text{ n'admet aucun antécédent par } k}$$
     C'est le premier point de la proposition 3 du cours : un inverse n'est jamais nul.
- id: "s-07-05"
  feuille: "f-s-07"
  numero: 5
  partie: "Notion de fonction, images et antécédents"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ensemble de définition, fonction racine carrée, fonction cube]
  noeuds: [r-application, c-racine-reelle]
  notions: [application]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Déterminer l'ensemble de définition de chacune des fonctions suivantes.

    **a)** $f(x)=5x^{3}-2x+1$

    **b)** $f(x)=\dfrac{1}{x+3}$

    **c)** $f(x)=\sqrt{x+5}$

    **d)** $f(x)=\dfrac{2x}{x-7}$

    **e)** $f(x)=\sqrt{4-x}$

    **f)** $f(x)=\dfrac{x}{5}+3$
  corrige: |
    On cherche à chaque fois les valeurs de $x$ qui rendraient un calcul impossible : un dénominateur nul, ou une racine carrée portant sur un nombre négatif.

    **a)** Aucun dénominateur, aucune racine : $\boxed{D_{f}=\mathbb{R}}$

    **b)** Le dénominateur $x+3$ s'annule pour $x=-3$ : $\boxed{D_{f}=\mathbb{R}\setminus\{-3\}=\left]-\infty\,;-3\right[\cup\left]-3\,;+\infty\right[}$

    **c)** Il faut $x+5\geqslant 0$, c'est-à-dire $x\geqslant -5$ : $\boxed{D_{f}=[-5\,;+\infty[}$

    **d)** Le dénominateur $x-7$ s'annule pour $x=7$ : $\boxed{D_{f}=\mathbb{R}\setminus\{7\}}$

    **e)** Il faut $4-x\geqslant 0$, c'est-à-dire $4\geqslant x$ : $\boxed{D_{f}=\left]-\infty\,;4\right]}$

    **f)** C'est une expression du premier degré, sans obstacle : $\boxed{D_{f}=\mathbb{R}}$

    La question e) demande de l'attention : l'inconnue est précédée d'un signe $-$, et la condition $4-x\geqslant 0$ se traduit par $x\leqslant 4$, non par $x\geqslant 4$.
- id: "s-07-06"
  feuille: "f-s-07"
  numero: 6
  partie: "Notion de fonction, images et antécédents"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonction carré, fonction racine carrée, fonction inverse]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Même consigne, avec des expressions un peu plus délicates.

    **a)** $f(x)=\dfrac{1}{2x-6}$

    **b)** $f(x)=\sqrt{3x-9}$

    **c)** $f(x)=\dfrac{\sqrt{x}}{x-1}$

    **d)** $f(x)=\dfrac{1}{x}+\sqrt{x+2}$

    **e)** $f(x)=\dfrac{1}{x^{2}}$

    **f)** $f(x)=\dfrac{1}{x^{2}+1}$

    **g)** $f(x)=\dfrac{x+1}{(x-2)(x+5)}$

    **h)** $f(x)=\sqrt{x}+\sqrt{-x}$

    Pour f), on justifiera soigneusement qu'aucune valeur n'est à exclure. La question h) est un cas très particulier : que reste-t-il comme valeurs possibles ?
  corrige: |
    **a)** $2x-6=0$ pour $x=3$ : $\boxed{D_{f}=\mathbb{R}\setminus\{3\}}$

    **b)** Il faut $3x-9\geqslant 0$, soit $3x\geqslant 9$, soit $x\geqslant 3$ : $\boxed{D_{f}=[3\,;+\infty[}$

    **c)** Deux conditions cette fois : la racine impose $x\geqslant 0$, et le dénominateur impose $x\neq 1$. 
    $$\boxed{D_{f}=[0\,;1[\;\cup\;]1\,;+\infty[}$$

    **d)** Là encore deux conditions : $x\neq 0$ pour le quotient, et $x+2\geqslant 0$ soit $x\geqslant -2$ pour la racine. 
    $$\boxed{D_{f}=[-2\,;0[\;\cup\;]0\,;+\infty[}$$

    **e)** $x^{2}=0$ uniquement pour $x=0$ : $\boxed{D_{f}=\mathbb{R}\setminus\{0\}=\mathbb{R}^{*}}$

    **f)** Le dénominateur est $x^{2}+1$. Or pour tout réel $x$, $x^{2}\geqslant 0$, donc $x^{2}+1\geqslant 1$ : le dénominateur est toujours strictement positif, il ne s'annule jamais. 
    $$\boxed{D_{f}=\mathbb{R}}$$

    **g)** Le produit $(x-2)(x+5)$ s'annule si $x=2$ ou si $x=-5$ : $\boxed{D_{f}=\mathbb{R}\setminus\{-5\,;2\}}$

    **h)** La première racine impose $x\geqslant 0$, la seconde impose $-x\geqslant 0$, c'est-à-dire $x\leqslant 0$. Les deux conditions doivent être vérifiées *en même temps* : 
    $$\boxed{D_{f}=\{0\}}$$
     La fonction n'est définie qu'en un seul nombre, et l'on a $f(0)=\sqrt{0}+\sqrt{0}=0$. C'est inhabituel, mais parfaitement conforme à la définition : l'ensemble de définition n'est pas forcément un intervalle.
- id: "s-07-07"
  feuille: "f-s-07"
  numero: 7
  partie: "Notion de fonction, images et antécédents"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [images et antécédents, ensemble de définition, fonction carré, "problème d'optimisation"]
  noeuds: [r-application, c-racine-reelle, ar-corps]
  notions: [application]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On considère le programme de calcul suivant :

    $\bullet$ Choisir un nombre.

    $\bullet$ Lui soustraire $3$.

    $\bullet$ Élever le résultat au carré.

    $\bullet$ Ajouter $5$.

    **1.** Appliquer ce programme aux nombres $7$, $-1$ et $0$.

    **2.** On note $f(x)$ le résultat obtenu en partant du nombre $x$. Exprimer $f(x)$ en fonction de $x$, puis donner l'ensemble de définition de $f$.

    **3.** Existe-t-il un nombre dont l'image par $f$ vaut $5$ ? Si oui, lequel ?

    **4.** Le nombre $4$ admet-il un antécédent par $f$ ? Justifier.

    **5.** Camille propose un second programme : « choisir un nombre, l'élever au carré, soustraire six fois le nombre choisi, puis ajouter $14$ ». On note $g(x)$ le résultat obtenu. Démontrer que les deux programmes donnent toujours le même résultat.
  corrige: |
    **1.** En suivant les quatre étapes : 
    $$7 \to 7-3=4 \to 4^{2}=16 \to 16+5=\boxed{21}$$

    $$-1 \to -4 \to 16 \to \boxed{21} \qquad ; \qquad 0 \to -3 \to 9 \to \boxed{14}$$
     On remarque déjà que $7$ et $-1$ donnent le même résultat.

    **2.** En remplaçant le nombre choisi par $x$ : 
    $$\boxed{f(x)=(x-3)^{2}+5}$$
     Ni dénominateur ni racine carrée n'apparaissent : $\boxed{D_{f}=\mathbb{R}}$

    **3.** On résout $f(x)=5$ : 
    $$(x-3)^{2}+5=5 \iff (x-3)^{2}=0 \iff x-3=0 \iff \boxed{x=3}$$

    **4.** On résout $f(x)=4$ : 
    $$(x-3)^{2}+5=4 \iff (x-3)^{2}=-1$$
     Or un carré est toujours positif, donc cette égalité est impossible : 
    $$\boxed{4 \text{ n'admet aucun antécédent par } f}$$
     Le résultat de la question 3 s'éclaire : comme $(x-3)^{2}\geqslant 0$, on a toujours $f(x)\geqslant 5$. Le nombre $5$ est donc le minimum de $f$ sur $\mathbb{R}$.

    **5.** Le second programme donne $g(x)=x^{2}-6x+14$. On développe $f(x)$ : 
    $$f(x)=(x-3)^{2}+5=x^{2}-2\times x\times 3+3^{2}+5=x^{2}-6x+9+5=x^{2}-6x+14=g(x)$$

    $$\boxed{\text{Les deux programmes donnent toujours le même résultat}}$$
- id: "s-07-08"
  feuille: "f-s-07"
  numero: 8
  partie: "Notion de fonction, images et antécédents"
  etoiles: 2
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: ["problème d'optimisation"]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Un rectangle a pour périmètre $20$ cm. On note $x$ la longueur, en centimètres, de sa largeur.

    **1.** Justifier que $x$ appartient nécessairement à l'intervalle $]0\,;5]$.

    *On pourra remarquer que la largeur ne dépasse pas la longueur.*

    **2.** Exprimer la longueur du rectangle en fonction de $x$.

    **3.** En déduire que son aire, en cm$^{2}$, est donnée par $\mathcal{A}(x)=x(10-x)$.

    **4.** Calculer $\mathcal{A}(2)$, $\mathcal{A}(5)$ et $\mathcal{A}(4)$.

    **5.** Recopier et compléter le tableau de valeurs suivant, puis conjecturer la valeur de $x$ pour laquelle l'aire est maximale. Quelle est alors la nature du rectangle ?

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|c|c|} \hline x & 0{,}5 & 1 & 1{,}5 & 2 & 2{,}5 & 3 & 3{,}5 & 4 & 4{,}5 & 5 \\ \hline \mathcal{A}(x) &  &  &  &  &  &  &  &  &  &  \\ \hline \end{array}$$
  corrige: |
    **1.** Une largeur est une longueur strictement positive, donc $x>0$. De plus le demi-périmètre vaut $10$ cm, donc largeur $+$ longueur $=10$ : la longueur vaut $10-x$. Comme la largeur ne dépasse pas la longueur, $x\leqslant 10-x$, c'est-à-dire $2x\leqslant 10$, soit $x\leqslant 5$. 
    $$\boxed{x\in\left]0\,;5\right]}$$

    **2.** 
    $$\boxed{\text{longueur}=10-x}$$

    **3.** L'aire d'un rectangle est le produit de sa longueur par sa largeur : 
    $$\boxed{\mathcal{A}(x)=x(10-x)}$$

    **4.** 
    $$\mathcal{A}(2)=2\times 8=\boxed{16} \qquad ; \qquad \mathcal{A}(5)=5\times 5=\boxed{25} \qquad ; \qquad \mathcal{A}(4)=4\times 6=\boxed{24}$$

    **5.**

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|c|c|} \hline x & 0{,}5 & 1 & 1{,}5 & 2 & 2{,}5 & 3 & 3{,}5 & 4 & 4{,}5 & 5 \\ \hline \mathcal{A}(x) & 4{,}75 & 9 & 12{,}75 & 16 & 18{,}75 & 21 & 22{,}75 & 24 & 24{,}75 & 25 \\ \hline \end{array}$$

    Les valeurs augmentent régulièrement jusqu'à la dernière colonne : 
    $$\boxed{\text{L'aire semble maximale pour } x=5, \text{ et vaut alors } 25 \text{ cm}^{2}}$$
     La largeur vaut alors $5$ cm et la longueur $10-5=5$ cm : 
    $$\boxed{\text{le rectangle d'aire maximale est un carré de côté } 5 \text{ cm}}$$
- id: "s-07-09"
  feuille: "f-s-07"
  numero: 9
  partie: "Courbe représentative d'une fonction"
  etoiles: 1
  types: [Lecture graphique, Démonstration, Calcul]
  mots_cles: [images et antécédents, ensemble de définition, courbe représentative]
  noeuds: [r-application]
  notions: [application]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Ci-dessous est tracée la courbe $\mathcal{C}_f$ d'une fonction $f$.

    ![Figure](documents/figures/d880adad83ef3faf.svg)

    **1.** Quel est l'ensemble de définition de $f$ ?

    **2.** Lire graphiquement les images de $-2$, $0$, $1$ et $3$.

    **3.** Lire graphiquement les antécédents de $0$, puis ceux de $-4$, puis ceux de $5$.

    **4.** Le nombre $-5$ admet-il un antécédent par $f$ ? Justifier.

    **5.** Résoudre graphiquement l'équation $f(x)=-3$.

    **6.** Combien $0$ admet-il d'antécédents ? En quoi cela ne contredit-il pas la définition d'une fonction ?
  corrige: |
    **1.** La courbe est tracée pour $x$ variant de $-2$ à $4$ : $\boxed{D_{f}=[-2\,;4]}$

    **2.** On part de l'abscisse, on monte (ou on descend) jusqu'à la courbe, puis on lit l'ordonnée : 
    $$\boxed{f(-2)=5 \quad ; \quad f(0)=-3 \quad ; \quad f(1)=-4 \quad ; \quad f(3)=0}$$

    **3.** Cette fois on part de l'axe des ordonnées et l'on se déplace **horizontalement** : 
    $$\boxed{\begin{array}{l} 0 \text{ admet deux antécédents : } -1 \text{ et } 3 \\[1mm] -4 \text{ admet un seul antécédent : } 1 \\[1mm] 5 \text{ admet deux antécédents : } -2 \text{ et } 4 \end{array}}$$

    **4.** La droite horizontale d'ordonnée $-5$ passe entièrement en dessous de la courbe : elle ne la coupe pas. Le point le plus bas de la courbe a pour ordonnée $-4$. 
    $$\boxed{-5 \text{ n'admet aucun antécédent par } f}$$

    **5.** On cherche les points de la courbe d'ordonnée $-3$ : 
    $$\boxed{S=\{0\,;2\}}$$

    **6.** Le nombre $0$ admet **deux** antécédents, $-1$ et $3$. Cela ne contredit nullement la définition : celle-ci impose que chaque *antécédent* ait une unique image, pas l'inverse. 
    $$\boxed{\text{Une image peut être partagée par plusieurs antécédents}}$$
     Graphiquement, cela se traduit ainsi : toute droite *verticale* coupe la courbe en au plus un point, mais une droite *horizontale* peut la couper plusieurs fois.
- id: "s-07-10"
  feuille: "f-s-07"
  numero: 10
  partie: "Courbe représentative d'une fonction"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [ensemble de définition, courbe représentative, fonction carré]
  noeuds: [r-application, c-racine-reelle]
  notions: [application]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On considère la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=x^{2}-2x-3$, et l'on note $\mathcal{C}_f$ sa courbe représentative.

    **1.** Les points suivants appartiennent-ils à $\mathcal{C}_f$ ? Justifier chaque réponse par un calcul. 
    $$A(-2\,;5) \quad ; \quad B(1\,;-4) \quad ; \quad C(2\,;0) \quad ; \quad D(3\,;0) \quad ; \quad E(0\,;3)$$

    **2.** Déterminer le réel $y$ pour que le point $F(-1\,;y)$ appartienne à $\mathcal{C}_f$.

    **3.** Déterminer les réels $x$ pour que le point $G(x\,;12)$ appartienne à $\mathcal{C}_f$.
  corrige: |
    **1.** Un point $M(a\,;b)$ appartient à $\mathcal{C}_f$ si et seulement si $f(a)=b$. 
    $$\begin{aligned} f(-2) &= (-2)^{2}-2\times(-2)-3=4+4-3=5 & &\text{or } y_{A}=5 & &\boxed{A\in\mathcal{C}_f} \\ f(1) &= 1-2-3=-4 & &\text{or } y_{B}=-4 & &\boxed{B\in\mathcal{C}_f} \\ f(2) &= 4-4-3=-3 & &\text{or } y_{C}=0\neq -3 & &\boxed{C\notin\mathcal{C}_f} \\ f(3) &= 9-6-3=0 & &\text{or } y_{D}=0 & &\boxed{D\in\mathcal{C}_f} \\ f(0) &= -3 & &\text{or } y_{E}=3\neq -3 & &\boxed{E\notin\mathcal{C}_f} \end{aligned}$$
     Le point $E$ est un piège classique : $-3$ et $3$ ne sont pas le même nombre.

    **2.** L'ordonnée d'un point de $\mathcal{C}_f$ d'abscisse $-1$ est $f(-1)$ : 
    $$y=f(-1)=(-1)^{2}-2\times(-1)-3=1+2-3=\boxed{0}$$

    **3.** On cherche les $x$ tels que $f(x)=12$ : 
    $$x^{2}-2x-3=12 \iff x^{2}-2x-15=0$$
     On remarque que $x^{2}-2x-15=(x-5)(x+3)$, puisque $(x-5)(x+3)=x^{2}+3x-5x-15=x^{2}-2x-15$. Par produit nul : 
    $$\boxed{x=5 \text{ ou } x=-3}$$
     Il y a donc deux points de $\mathcal{C}_f$ d'ordonnée $12$ : $(5\,;12)$ et $(-3\,;12)$. Ils sortent toutefois de la fenêtre tracée à l'exercice 9.
- id: "s-07-11"
  feuille: "f-s-07"
  numero: 11
  partie: "Courbe représentative d'une fonction"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ensemble de définition, courbe représentative, variations, fonction cube]
  noeuds: [r-application, ar-corps]
  notions: [application]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $g$ la fonction définie sur $[-2\,;2]$ par $g(x)=x^{3}-3x$.

    **1.** Recopier et compléter le tableau de valeurs ci-dessous. On donnera des valeurs exactes.

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|c|} \hline x & -2 & -1{,}5 & -1 & -0{,}5 & 0 & 0{,}5 & 1 & 1{,}5 & 2 \\ \hline g(x) &  &  &  &  &  &  &  &  &  \\ \hline \end{array}$$

    **2.** Tracer un repère orthogonal en prenant $2$ cm pour une unité en abscisse et $1$ cm pour une unité en ordonnée, puis y placer les neuf points obtenus.

    **3.** Tracer une courbe passant par ces points. Sur quels intervalles la fonction semble-t-elle croissante ? décroissante ?

    **4.** Le point $H(1{,}2\,;-1{,}9)$ semble-t-il appartenir à la courbe ? Vérifier par le calcul.
  corrige: |
    **1.** On calcule par exemple $g(-1{,}5)=(-1{,}5)^{3}-3\times(-1{,}5)=-3{,}375+4{,}5=1{,}125$.

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|c|} \hline x & -2 & -1{,}5 & -1 & -0{,}5 & 0 & 0{,}5 & 1 & 1{,}5 & 2 \\ \hline g(x) & -2 & 1{,}125 & 2 & 1{,}375 & 0 & -1{,}375 & -2 & -1{,}125 & 2 \\ \hline \end{array}$$

    **2.** et 3. En plaçant les neuf points puis en les reliant par une courbe régulière, on obtient :

    ![Figure](documents/figures/3e91aadee59772b5.svg)

    $$\boxed{g \text{ semble croissante sur } [-2\,;-1] \text{ et sur } [1\,;2], \text{ décroissante sur } [-1\,;1]}$$

    **3.** Sur la courbe, le point d'abscisse $1{,}2$ paraît bien avoir une ordonnée voisine de $-1{,}9$. On vérifie : 
    $$g(1{,}2)=1{,}2^{3}-3\times 1{,}2=1{,}728-3{,}6=-1{,}872$$
     Or $-1{,}872\neq -1{,}9$ : 
    $$\boxed{H \text{ n'appartient pas à la courbe, même s'il en est très proche}}$$
     C'est toute la limite de la lecture graphique : elle suggère, elle ne démontre pas.
- id: "s-07-12"
  feuille: "f-s-07"
  numero: 12
  partie: "Courbe représentative d'une fonction"
  etoiles: 2
  types: [Lecture graphique, Calcul]
  mots_cles: [ensemble de définition, courbe représentative]
  noeuds: [r-application]
  notions: [application]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Sur le graphique ci-dessous sont tracées la courbe $\mathcal{C}_f$ de la fonction $f$ de l'exercice 9 et la droite $d$ d'équation $y=x-3$, représentation graphique de la fonction $g$ définie par $g(x)=x-3$.

    ![Figure](documents/figures/307c34302c24cd43.svg)

    **1.** Résoudre graphiquement les équations $f(x)=0$, $f(x)=5$ et $f(x)=-5$.

    **2.** Résoudre graphiquement l'équation $f(x)=g(x)$.

    **3.** Déterminer graphiquement le nombre de solutions de l'équation $f(x)=k$ pour $k=-4$, puis pour $k=-3$, puis pour $k=2$.

    **4.** Retrouver par le calcul le résultat de la question 2.
  corrige: |
    **1.** On cherche les points de $\mathcal{C}_f$ d'ordonnée donnée : 
    $$\boxed{f(x)=0 : S=\{-1\,;3\}} \qquad \boxed{f(x)=5 : S=\{-2\,;4\}} \qquad \boxed{f(x)=-5 : S=\varnothing}$$
     Pour la dernière, la courbe ne descend jamais en dessous de $-4$.

    **2.** Résoudre $f(x)=g(x)$, c'est chercher les abscisses des points où la courbe et la droite se coupent. On lit deux points d'intersection, d'abscisses $0$ et $3$ : 
    $$\boxed{S=\{0\,;3\}}$$

    **3.** On compte les points d'intersection de $\mathcal{C}_f$ avec la droite horizontale d'ordonnée $k$ : 
    $$\boxed{\begin{array}{l} k=-4 : 1 \text{ solution} \quad \text{(le sommet de la courbe)} \\[1mm] k=-3 : 2 \text{ solutions} \\[1mm] k=2 : 2 \text{ solutions} \end{array}}$$

    **4.** On résout l'équation $f(x)=g(x)$ : 
    $$\begin{aligned} x^{2}-2x-3=x-3 &\iff x^{2}-2x-3-x+3=0 \\ &\iff x^{2}-3x=0 \\ &\iff x(x-3)=0 \end{aligned}$$
     Par produit nul, $x=0$ ou $x=3$ : 
    $$\boxed{S=\{0\,;3\}}$$
     Le calcul confirme la lecture graphique. On notera qu'il ne fallait surtout pas simplifier par $x$ : on aurait perdu la solution $x=0$.
- id: "s-07-13"
  feuille: "f-s-07"
  numero: 13
  partie: "Variations et extremums"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ensemble de définition, courbe représentative, variations, extremums, fonction cube]
  noeuds: [r-application, ar-corps]
  notions: [application]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Ci-dessous est tracée la courbe $\mathcal{C}_{g}$ de la fonction $g$ définie sur $[-2\,;2]$ par $g(x)=x^{3}-3x$.

    ![Figure](documents/figures/727011e0d5b386bb.svg)

    **1.** Sur quels intervalles la fonction $g$ est-elle croissante ? décroissante ?

    **2.** Dresser le tableau de variations de $g$ sur $[-2\,;2]$.

    **3.** Donner le maximum de $g$ sur $[-2\,;2]$ ainsi que la ou les valeurs de $x$ en lesquelles il est atteint. Même question pour le minimum.

    **4.** Combien l'équation $g(x)=0$ admet-elle de solutions sur $[-2\,;2]$ ?

    **5.** Discuter, selon la valeur du réel $k$, le nombre de solutions de l'équation $g(x)=k$ sur $[-2\,;2]$.
  corrige: |
    **1.** En parcourant la courbe de la gauche vers la droite, on observe qu'elle monte, puis descend, puis remonte : 
    $$\boxed{g \text{ est croissante sur } [-2\,;-1] \text{ et sur } [1\,;2], \text{ décroissante sur } [-1\,;1]}$$

    **2.**

    ![Figure](documents/figures/9436dfd88685929a.svg)

    **3.** Le point le plus haut de la courbe a pour ordonnée $2$, et il y en a **deux** : celui d'abscisse $-1$ et celui d'abscisse $2$. 
    $$\boxed{\text{Maximum : } 2, \text{ atteint pour } x=-1 \text{ et pour } x=2}$$
     De même, le point le plus bas a pour ordonnée $-2$, atteint deux fois : 
    $$\boxed{\text{Minimum : } -2, \text{ atteint pour } x=-2 \text{ et pour } x=1}$$
     Un extremum est une *ordonnée* : rien n'interdit qu'il soit atteint en plusieurs abscisses.

    **4.** La courbe coupe l'axe des abscisses en trois points : 
    $$\boxed{L'\text{équation } g(x)=0 \text{ admet } 3 \text{ solutions sur } [-2\,;2]}$$
     Leurs valeurs approchées sont environ $-1{,}7$, $0$ et $1{,}7$.

    **5.** On fait glisser la droite horizontale d'ordonnée $k$ et l'on compte les intersections. Comme $g$ varie entre $-2$ et $2$ : 
    $$\boxed{\begin{array}{ll} \text{si } k<-2 \text{ ou } k>2 & : \; \text{aucune solution} \\[1mm] \text{si } k=-2 \text{ ou } k=2 & : \; 2 \text{ solutions} \\[1mm] \text{si } -2<k<2 & : \; 3 \text{ solutions} \end{array}}$$
- id: "s-07-14"
  feuille: "f-s-07"
  numero: 14
  partie: "Variations et extremums"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [ensemble de définition, variations, extremums]
  noeuds: [r-application, ar-corps]
  notions: [application]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Une fonction $f$ définie sur $[-5\,;10]$ admet le tableau de variations suivant.

    ![Figure](documents/figures/a5ae9e24405c6e02.svg)

    **1.** Sur quels intervalles $f$ est-elle croissante ? décroissante ?

    **2.** Donner $f(-5)$, $f(2)$, $f(4)$ et $f(10)$.

    **3.** Comparer $f(3)$ et $f(4)$, puis $f(0)$ et $f(1)$. Justifier à chaque fois.

    **4.** Peut-on comparer $f(0)$ et $f(6)$ ? Expliquer.

    **5.** Donner le maximum et le minimum de $f$ sur $[-5\,;10]$, en précisant en quelle valeur chacun est atteint.

    **6.** Combien l'équation $f(x)=5$ admet-elle de solutions sur $[-5\,;10]$ ?
  corrige: |
    **1.** Les flèches montantes indiquent la croissance : 
    $$\boxed{f \text{ est croissante sur } [2\,;4], \text{ décroissante sur } [-5\,;2] \text{ et sur } [4\,;10]}$$

    **2.** Les nombres inscrits aux extrémités des flèches sont les images des bornes : 
    $$\boxed{f(-5)=8 \quad ; \quad f(2)=1 \quad ; \quad f(4)=9 \quad ; \quad f(10)=3}$$

    **3.** Les réels $3$ et $4$ appartiennent tous deux à $[2\,;4]$, où $f$ est croissante. Comme $3\leqslant 4$, l'ordre est conservé : 
    $$\boxed{f(3)\leqslant f(4)}, \text{ c'est-à-dire } f(3)\leqslant 9$$
     Les réels $0$ et $1$ appartiennent à $[-5\,;2]$, où $f$ est décroissante. Comme $0\leqslant 1$, l'ordre est inversé : 
    $$\boxed{f(0)\geqslant f(1)}$$

    **4.** Non. Les réels $0$ et $6$ n'appartiennent pas au même intervalle de monotonie : le tableau ne donne aucune information sur la façon dont leurs images se comparent. 
    $$\boxed{\text{On ne peut pas comparer } f(0) \text{ et } f(6)}$$
     Tout au plus peut-on encadrer chacune : $1\leqslant f(0)\leqslant 8$ et $3\leqslant f(6)\leqslant 9$, ce qui ne permet pas de trancher.

    **5.** En comparant les quatre valeurs inscrites dans le tableau : 
    $$\boxed{\text{Maximum : } 9, \text{ atteint pour } x=4} \qquad ; \qquad \boxed{\text{Minimum : } 1, \text{ atteint pour } x=2}$$

    **6.** On examine chacun des trois intervalles de monotonie :

    • sur $[-5\,;2]$, $f$ décroît de $8$ à $1$, et $5$ est compris entre $1$ et $8$ : une solution ;

    • sur $[2\,;4]$, $f$ croît de $1$ à $9$, et $5$ est compris entre $1$ et $9$ : une solution ;

    • sur $[4\,;10]$, $f$ décroît de $9$ à $3$, et $5$ est compris entre $3$ et $9$ : une solution.

    $$\boxed{L'\text{équation } f(x)=5 \text{ admet } 3 \text{ solutions sur } [-5\,;10]}$$
- id: "s-07-15"
  feuille: "f-s-07"
  numero: 15
  partie: "Variations et extremums"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [ensemble de définition, extremums, fonction carré, fonction cube]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    **1.** On sait que la fonction $u$ admet sur $[0\,;6]$ un maximum égal à $11$, atteint pour $x=4$. Parmi les affirmations suivantes, lesquelles sont correctes ?

    **(a)** $u(11)=4$

    **(b)** $u(4)=11$

    **(c)** pour tout $x$ de $[0\,;6]$, $u(x)\leqslant 11$

    **(d)** pour tout $x$ de $[0\,;6]$, $u(x)\leqslant 4$

    **2.** Sur $[-3\,;3]$, la fonction $v$ est définie par $v(x)=x^{2}+2$. Démontrer que $v$ admet un minimum sur $[-3\,;3]$, préciser sa valeur et en quel réel il est atteint.

    *On pourra utiliser le fait que $x^{2}\geqslant 0$ pour tout réel $x$.*

    **3.** Sur $\mathbb{R}$, la fonction $w$ est définie par $w(x)=5-(x-2)^{2}$. Démontrer que $w$ admet un maximum sur $\mathbb{R}$ et le déterminer.

    **4.** La fonction cube admet-elle un maximum sur $\mathbb{R}$ ? Justifier.
  corrige: |
    **1.** Dire que le maximum vaut $11$ et qu'il est atteint pour $x=4$ signifie deux choses : $u(4)=11$, et $u(x)\leqslant 11$ pour tout $x$ de $[0\,;6]$. 
    $$\boxed{\text{Les affirmations correctes sont b) et c)}}$$
     L'affirmation a) inverse l'abscisse et l'ordonnée. L'affirmation d) confond la valeur du maximum avec l'abscisse en laquelle il est atteint : un extremum est toujours une *ordonnée*.

    **2.** Pour tout réel $x$, on sait que $x^{2}\geqslant 0$. En ajoutant $2$ aux deux membres : 
    $$x^{2}+2\geqslant 2 \qquad \text{c'est-à-dire} \qquad v(x)\geqslant 2$$
     De plus $v(0)=0^{2}+2=2$, et $0$ appartient bien à $[-3\,;3]$ : la valeur $2$ est donc effectivement atteinte. 
    $$\boxed{v \text{ admet pour minimum } 2 \text{ sur } [-3\,;3], \text{ atteint pour } x=0}$$

    **3.** Pour tout réel $x$, $(x-2)^{2}\geqslant 0$, donc $-(x-2)^{2}\leqslant 0$, et en ajoutant $5$ : 
    $$5-(x-2)^{2}\leqslant 5 \qquad \text{c'est-à-dire} \qquad w(x)\leqslant 5$$
     Or $w(2)=5-0=5$ : la valeur est atteinte. 
    $$\boxed{w \text{ admet pour maximum } 5 \text{ sur } \mathbb{R}, \text{ atteint pour } x=2}$$
     On notera le changement de sens de l'inégalité lorsqu'on multiplie par $-1$.

    **4.** Non. La fonction cube est croissante sur $\mathbb{R}$ et prend des valeurs aussi grandes que l'on veut : par exemple $10^{3}=1000$, $100^{3}=1\,000\,000$, et ainsi de suite. 
    $$\boxed{\text{La fonction cube n'admet pas de maximum sur } \mathbb{R}}$$
     Elle n'admet pas non plus de minimum, pour la même raison du côté des valeurs négatives.
- id: "s-07-16"
  feuille: "f-s-07"
  numero: 16
  partie: "Variations et extremums"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variations, fonction racine carrée]
  noeuds: [ar-corps, c-racine-reelle]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** La fonction $f$ est croissante sur $[0\,;10]$. Comparer $f(2)$ et $f(7)$, puis $f(0{,}5)$ et $f(1)$.

    **2.** La fonction $g$ est décroissante sur $[-3\,;5]$. Comparer $g(-1)$ et $g(4)$, puis $g(-2)$ et $g(0)$.

    **3.** La fonction $h$ est croissante sur $]-\infty\,;0]$ et décroissante sur $[0\,;+\infty[$. Peut-on comparer $h(-3)$ et $h(5)$ ? Expliquer.

    **4.** En utilisant les variations des fonctions de référence, comparer sans calculatrice :

    **(a)** $3{,}2^{2}$ et $3{,}3^{2}$

    **(b)** $(-4)^{2}$ et $(-5)^{2}$

    **(c)** $\sqrt{7}$ et $\sqrt{8}$

    **(d)** $\dfrac{1}{2{,}5}$ et $\dfrac{1}{2{,}7}$

    **(e)** $\dfrac{1}{-3}$ et $\dfrac{1}{-2}$

    **(f)** $(-1{,}2)^{3}$ et $(-1{,}1)^{3}$
  corrige: |
    **1.** $f$ est croissante sur $[0\,;10]$ : elle conserve l'ordre. 
    $$2\leqslant 7 \; \Longrightarrow \; \boxed{f(2)\leqslant f(7)} \qquad ; \qquad 0{,}5\leqslant 1 \; \Longrightarrow \; \boxed{f(0{,}5)\leqslant f(1)}$$

    **2.** $g$ est décroissante sur $[-3\,;5]$ : elle inverse l'ordre. 
    $$-1\leqslant 4 \; \Longrightarrow \; \boxed{g(-1)\geqslant g(4)} \qquad ; \qquad -2\leqslant 0 \; \Longrightarrow \; \boxed{g(-2)\geqslant g(0)}$$

    **3.** Non : $-3$ appartient à $]-\infty\,;0]$ et $5$ à $[0\,;+\infty[$. Les deux réels ne sont pas dans le même intervalle de monotonie. 
    $$\boxed{\text{On ne peut pas comparer } h(-3) \text{ et } h(5)}$$

    **4.** **(a)** $0\leqslant 3{,}2\leqslant 3{,}3$ et la fonction carré est croissante sur $[0\,;+\infty[$ : $\boxed{3{,}2^{2}<3{,}3^{2}}$

    **(b)** $-4$ et $-5$ sont négatifs, et la fonction carré est *décroissante* sur $]-\infty\,;0]$. Comme $-5\leqslant -4$ : $\boxed{(-5)^{2}>(-4)^{2}}$

    *On le vérifie : $25>16$. C'est le piège classique du carré des nombres négatifs.*

    **(c)** La fonction racine carrée est croissante et $5\leqslant 7$ : $\boxed{\sqrt{5}<\sqrt{7}}$

    **(d)** $0<2{,}5<2{,}7$ et la fonction inverse est décroissante sur $]0\,;+\infty[$ : $\boxed{\dfrac{1}{2{,}5}>\dfrac{1}{2{,}7}}$

    **(e)** $-4$ et $-3$ sont dans $]-\infty\,;0[$, où la fonction inverse est décroissante. Comme $-4\leqslant -3$ : $\boxed{\dfrac{1}{-4}>\dfrac{1}{-3}}$

    *On vérifie : $-0{,}25>-0{,}333\dots$*

    **(f)** La fonction cube est croissante sur $\mathbb{R}$ et $-1{,}2\leqslant -1{,}1$ : $\boxed{(-1{,}2)^{3}<(-1{,}1)^{3}}$
- id: "s-07-17"
  feuille: "f-s-07"
  numero: 17
  partie: "Variations et extremums"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ensemble de définition, variations, fonction carré]
  noeuds: [r-application, ar-corps, c-racine-reelle]
  notions: [application]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Dans cet exercice, on démontre des variations en revenant à la définition du cours.

    **1.** Soit $f$ définie sur $\mathbb{R}$ par $f(x)=3x+2$. Soient $x_{1}$ et $x_{2}$ deux réels tels que $x_{1}\leqslant x_{2}$.

    **(a)** Calculer $f(x_{2})-f(x_{1})$ et montrer que ce nombre est positif.

    **(b)** En déduire le sens de variation de $f$ sur $\mathbb{R}$.

    **2.** Soit $g$ définie sur $\mathbb{R}$ par $g(x)=-2x+5$. Démontrer de la même manière que $g$ est décroissante sur $\mathbb{R}$.

    **3.** Soit $h$ définie par $h(x)=x^{2}+1$.

    **(a)** Soient $x_{1}$ et $x_{2}$ tels que $0\leqslant x_{1}\leqslant x_{2}$. Démontrer que $h(x_{2})-h(x_{1})=(x_{2}-x_{1})(x_{2}+x_{1})$.

    **(b)** En déduire le sens de variation de $h$ sur $[0\,;+\infty[$.

    **(c)** Reprendre le raisonnement sur $]-\infty\,;0]$ et conclure.
  corrige: |
    **1.** **(a)** Soient $x_{1}\leqslant x_{2}$ deux réels. On calcule : 
    $$f(x_{2})-f(x_{1})=(3x_{2}+2)-(3x_{1}+2)=3x_{2}-3x_{1}=3\left(x_{2}-x_{1}\right)$$
     Comme $x_{1}\leqslant x_{2}$, on a $x_{2}-x_{1}\geqslant 0$, et $3$ est positif : 
    $$\boxed{f(x_{2})-f(x_{1})\geqslant 0}$$

    **(b)** Cette différence étant positive, on a $f(x_{1})\leqslant f(x_{2})$ : l'ordre est conservé. 
    $$\boxed{f \text{ est croissante sur } \mathbb{R}}$$

    **2.** Soient $x_{1}\leqslant x_{2}$. Alors : 
    $$g(x_{2})-g(x_{1})=(-2x_{2}+5)-(-2x_{1}+5)=-2\left(x_{2}-x_{1}\right)$$
     Ici $x_{2}-x_{1}\geqslant 0$ mais le facteur $-2$ est négatif, donc le produit est négatif : $g(x_{2})\leqslant g(x_{1})$. L'ordre est inversé. 
    $$\boxed{g \text{ est décroissante sur } \mathbb{R}}$$

    **3.** **(a)** Soient $0\leqslant x_{1}\leqslant x_{2}$. Alors : 
    $$h(x_{2})-h(x_{1})=\left(x_{2}^{2}+1\right)-\left(x_{1}^{2}+1\right)=x_{2}^{2}-x_{1}^{2}$$
     On reconnaît une différence de deux carrés : 
    $$\boxed{h(x_{2})-h(x_{1})=(x_{2}-x_{1})(x_{2}+x_{1})}$$

    **(b)** Le facteur $x_{2}-x_{1}$ est positif puisque $x_{1}\leqslant x_{2}$, et le facteur $x_{2}+x_{1}$ est positif comme somme de deux nombres positifs. Le produit de deux nombres positifs étant positif : 
    $$h(x_{2})-h(x_{1})\geqslant 0 \qquad \text{donc} \qquad \boxed{h \text{ est croissante sur } [0\,;+\infty[}$$

    **(c)** Soient maintenant $x_{1}\leqslant x_{2}\leqslant 0$. La factorisation reste valable, et le facteur $x_{2}-x_{1}$ est toujours positif ; en revanche $x_{2}+x_{1}$ est cette fois négatif, comme somme de deux nombres négatifs. Le produit est donc négatif : 
    $$\boxed{h \text{ est décroissante sur } ]-\infty\,;0]}$$
     On retrouve les variations de la fonction carré, simplement décalées de $1$ vers le haut.
