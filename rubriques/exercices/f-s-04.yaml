  types: [Calcul]
  mots_cles: [équation produit, équation quotient]
  noeuds: [z-anneau, ar-corps]
  notions: [anneau-integre]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Déterminer les valeurs interdites de chacun des quotients suivants.

    **a)** $\dfrac{2x-6}{x+1}$

    **b)** $\dfrac{x+4}{x-3}$

    **c)** $\dfrac{5x}{2x+8}$

    **d)** $\dfrac{x^{2}-1}{3x-9}$

    **e)** $\dfrac{x-2}{5x}$

    **f)** $\dfrac{4x+1}{x^{2}-4}$

    **g)** $\dfrac{x}{(x-1)(x+5)}$

    **h)** $\dfrac{3x-7}{4x+2}$

    **i)** $\dfrac{x+6}{x^{2}+1}$

    **j)** $\dfrac{2x}{7-x}$

    **k)** $\dfrac{5-x}{(2x+1)(x-4)}$

    **l)** $\dfrac{x+3}{x^{2}}$
  corrige: |
    *Une valeur interdite est une valeur de l'inconnue qui annule le dénominateur. On résout donc à chaque fois « dénominateur $=0$ ».*

    **a)** $x+1=0 \iff \boxed{x=-1}$

    **b)** $x-3=0 \iff \boxed{x=3}$

    **c)** $2x+8=0 \iff \boxed{x=-4}$

    **d)** $3x-9=0 \iff \boxed{x=3}$

    **e)** $5x=0 \iff \boxed{x=0}$

    **f)** $x^{2}-4=0 \iff (x-2)(x+2)=0 \iff \boxed{x=-2 \text{ ou } x=2}$

    **g)** $(x-1)(x+5)=0 \iff \boxed{x=-5 \text{ ou } x=1}$

    **h)** $4x+2=0 \iff \boxed{x=-\dfrac{1}{2}}$

    **i)** $x^{2}+1$ : un carré étant positif, $x^{2}+1\geqslant 1>0$. $\boxed{\text{Aucune valeur interdite.}}$

    **j)** $7-x=0 \iff \boxed{x=7}$

    **k)** $(2x+1)(x-4)=0 \iff \boxed{x=-\dfrac{1}{2} \text{ ou } x=4}$

    **l)** $x^{2}=0 \iff \boxed{x=0}$

    *La question i) est le piège de l'exercice :* il ne faut pas conclure qu'un dénominateur s'annule forcément. Ici il ne s'annule jamais, et le quotient est défini pour tout réel.
- id: "s-04-18"
  feuille: "f-s-04"
  numero: 18
  partie: "Équations quotient"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Résoudre les équations quotient suivantes. On rédigera en trois temps : valeurs interdites, numérateur nul, puis comparaison.

    **a)** $\dfrac{2x-6}{x+1}=0$

    **b)** $\dfrac{x+4}{x-3}=0$

    **c)** $\dfrac{3x}{x-2}=0$

    **d)** $\dfrac{5x+15}{2x-1}=0$

    **e)** $\dfrac{x-7}{4x}=0$

    **f)** $\dfrac{2x+1}{x+6}=0$

    **g)** $\dfrac{4-x}{3x+2}=0$

    **h)** $\dfrac{x+5}{x^{2}+2}=0$

    **i)** $\dfrac{6x-9}{x-5}=0$

    **j)** $\dfrac{x}{(x-1)(x+3)}=0$
  corrige: |
    *On rédige en trois temps, comme dans le cours.* Détaillons la première :

    **Valeurs interdites :** $x+1=0$ donne $x=-1$.

    **Numérateur nul :** $2x-6=0 \iff 2x=6 \iff x=3$.

    **Comparaison :** $3$ n'est pas la valeur interdite, elle est donc acceptée. 
    $$\boxed{S=\{3\}}$$

    **b)** V.I. : $3$. Numérateur : $x+4=0 \iff x=-4$, acceptée. $\boxed{S=\{-4\}}$

    **c)** V.I. : $2$. Numérateur : $3x=0 \iff x=0$, acceptée. $\boxed{S=\{0\}}$

    **d)** V.I. : $\frac{1}{2}$. Numérateur : $5x+15=0 \iff x=-3$, acceptée. $\boxed{S=\{-3\}}$

    **e)** V.I. : $0$. Numérateur : $x-7=0 \iff x=7$, acceptée. $\boxed{S=\{7\}}$

    **f)** V.I. : $-6$. Numérateur : $2x+1=0 \iff x=-\frac{1}{2}$, acceptée. $\boxed{S=\left\{-\dfrac{1}{2}\right\}}$

    **g)** V.I. : $-\frac{2}{3}$. Numérateur : $4-x=0 \iff x=4$, acceptée. $\boxed{S=\{4\}}$

    **h)** Aucune V.I. Numérateur : $x+5=0 \iff x=-5$, acceptée. $\boxed{S=\{-5\}}$

    **i)** V.I. : $5$. Numérateur : $6x-9=0 \iff x=\frac{3}{2}$, acceptée. $\boxed{S=\left\{\dfrac{3}{2}\right\}}$

    **j)** V.I. : $1$ et $-3$. Numérateur : $x=0$, acceptée. $\boxed{S=\{0\}}$
- id: "s-04-19"
  feuille: "f-s-04"
  numero: 19
  partie: "Équations quotient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Résoudre les équations quotient suivantes. *Dans chacune d'elles, la troisième étape est déterminante.*

    **a)** $\dfrac{x^{2}-4}{x-2}=0$

    **b)** $\dfrac{x^{2}-9}{x+3}=0$

    **c)** $\dfrac{(x-1)(x+5)}{x+5}=0$

    **d)** $\dfrac{x^{2}-5x}{x}=0$

    **e)** $\dfrac{(2x-6)(x+1)}{x-3}=0$

    **f)** $\dfrac{x^{2}-16}{(x-4)(x+1)}=0$

    **g)** $\dfrac{(x+2)^{2}}{x+2}=0$

    **h)** $\dfrac{3x^{2}-12}{x+2}=0$
  corrige: |
    *Dans chacune de ces équations, une valeur trouvée à l'étape 2 doit être rejetée à l'étape 3.*

    **a)** $\dfrac{x^{2}-4}{x-2}=0$ : V.I. $x=2$. Numérateur : $(x-2)(x+2)=0$ donne $x=2$ ou $x=-2$. La valeur $2$ est interdite, elle est **rejetée** : $\boxed{S=\{-2\}}$

    **b)** $\dfrac{x^{2}-9}{x+3}=0$ : V.I. $x=-3$. Numérateur : $x=3$ ou $x=-3$. On rejette $-3$ : $\boxed{S=\{3\}}$

    **c)** $\dfrac{(x-1)(x+5)}{x+5}=0$ : V.I. $x=-5$. Numérateur : $x=1$ ou $x=-5$. On rejette $-5$ : $\boxed{S=\{1\}}$

    **d)** $\dfrac{x^{2}-5x}{x}=0$ : V.I. $x=0$. Numérateur : $x(x-5)=0$ donne $x=0$ ou $x=5$. On rejette $0$ : $\boxed{S=\{5\}}$

    **e)** $\dfrac{(2x-6)(x+1)}{x-3}=0$ : V.I. $x=3$. Numérateur : $x=3$ ou $x=-1$. On rejette $3$ : $\boxed{S=\{-1\}}$

    **f)** $\dfrac{x^{2}-16}{(x-4)(x+1)}=0$ : V.I. $x=4$ et $x=-1$. Numérateur : $x=4$ ou $x=-4$. On rejette $4$ : $\boxed{S=\{-4\}}$

    **g)** $\dfrac{(x+2)^{2}}{x+2}=0$ : V.I. $x=-2$. Numérateur : $(x+2)^{2}=0$ donne $x=-2$, *seule* valeur possible. Elle est interdite, donc rejetée : 
    $$\boxed{S=\varnothing}$$
     *C'est le cas le plus frappant :* l'équation n'admet aucune solution, alors que le numérateur, lui, s'annule bien.

    **h)** $\dfrac{3x^{2}-12}{x+2}=0$ : V.I. $x=-2$. Numérateur : $3(x^{2}-4)=3(x-2)(x+2)=0$ donne $x=2$ ou $x=-2$. On rejette $-2$ : $\boxed{S=\{2\}}$

    *Ces huit équations montrent pourquoi la troisième étape n'est jamais facultative.* On serait tenté de simplifier d'emblée le quotient — par exemple d'écrire $\frac{(x-2)(x+2)}{x-2}=x+2$ à la question a) — mais cela suppose que $x-2$ n'est pas nul, ce qui est précisément la question posée.
- id: "s-04-20"
  feuille: "f-s-04"
  numero: 20
  partie: "Équations quotient"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Résoudre les équations quotient suivantes. Le numérateur devra à chaque fois être factorisé.

    **a)** $\dfrac{x^{2}-3x}{x+4}=0$

    **b)** $\dfrac{4x^{2}-25}{x-1}=0$

    **c)** $\dfrac{(x-2)(x+7)}{2x+1}=0$

    **d)** $\dfrac{x^{2}+6x}{x-6}=0$

    **e)** $\dfrac{(x+1)^{2}-9}{x}=0$

    **f)** $\dfrac{9x^{2}-1}{3x-1}=0$

    **g)** $\dfrac{5x^{2}-20}{x+5}=0$

    **h)** $\dfrac{(2x-1)(x+3)}{(x+3)(x-4)}=0$
  corrige: |
    **a)** V.I. $x=-4$. Numérateur : $x^{2}-3x=x(x-3)=0$ donne $x=0$ ou $x=3$, toutes deux acceptées : $\boxed{S=\{0\,;3\}}$

    **b)** V.I. $x=1$. Numérateur : $4x^{2}-25=(2x-5)(2x+5)=0$ : $\boxed{S=\left\{-\dfrac{5}{2}\,;\dfrac{5}{2}\right\}}$

    **c)** V.I. $x=-\frac{1}{2}$. Numérateur : $x=2$ ou $x=-7$ : $\boxed{S=\{-7\,;2\}}$

    **d)** V.I. $x=6$. Numérateur : $x^{2}+6x=x(x+6)=0$ : $\boxed{S=\{-6\,;0\}}$

    **e)** V.I. $x=0$. Numérateur : $(x+1)^{2}-9=(x+1-3)(x+1+3)=(x-2)(x+4)=0$ : $\boxed{S=\{-4\,;2\}}$

    **f)** V.I. $x=\frac{1}{3}$. Numérateur : $9x^{2}-1=(3x-1)(3x+1)=0$ donne $x=\frac{1}{3}$ ou $x=-\frac{1}{3}$. On rejette $\frac{1}{3}$ : $\boxed{S=\left\{-\dfrac{1}{3}\right\}}$

    **g)** V.I. $x=-5$. Numérateur : $5x^{2}-20=5(x-2)(x+2)=0$ : $\boxed{S=\{-2\,;2\}}$

    **h)** V.I. $x=-3$ et $x=4$. Numérateur : $x=\frac{1}{2}$ ou $x=-3$. On rejette $-3$ : $\boxed{S=\left\{\dfrac{1}{2}\right\}}$
- id: "s-04-21"
  feuille: "f-s-04"
  numero: 21
  partie: "Mise en équation et problèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, mise en équation]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Dans chaque cas, choisir une inconnue, traduire l'énoncé par une équation, la résoudre, puis répondre à la question posée par une phrase.

    **1.** Je pense à un nombre, je le multiplie par $5$ puis je retranche $8$ : j'obtiens $27$. Quel est ce nombre ?

    **2.** Le triple d'un nombre augmenté de $4$ est égal au double de ce nombre augmenté de $15$. Quel est ce nombre ?

    **3.** La somme de trois nombres entiers consécutifs vaut $87$. Quels sont ces nombres ?

    **4.** Le quart d'un nombre, augmenté de $6$, est égal au tiers de ce nombre. Quel est ce nombre ?

    **5.** La somme de deux nombres est $45$, et l'un des deux vaut le double de l'autre. Quels sont ces nombres ?
  corrige: |
    *On note $x$ le nombre cherché.*

    **1.** $5x-8=27 \iff 5x=35 \iff x=7$. 
    $$\boxed{\text{Le nombre cherché est } 7.}$$

    **2.** $3x+4=2x+15 \iff x=11$. 
    $$\boxed{\text{Le nombre cherché est } 11.}$$

    **3.** Les trois entiers consécutifs s'écrivent $x$, $x+1$ et $x+2$ : 
    $$x+(x+1)+(x+2)=87 \iff 3x+3=87 \iff 3x=84 \iff x=28$$

    $$\boxed{\text{Les trois nombres sont } 28,\ 29 \text{ et } 30.}$$
     *Vérification :* $28+29+30=87$.

    **4.** $\dfrac{x}{4}+6=\dfrac{x}{3}$. On multiplie les deux membres par $12$ : 
    $$3x+72=4x \iff 72=x \qquad \boxed{\text{Le nombre cherché est } 72.}$$

    **5.** Si l'un vaut $x$, l'autre vaut $2x$ : 
    $$x+2x=45 \iff 3x=45 \iff x=15 \qquad \boxed{\text{Les deux nombres sont } 15 \text{ et } 30.}$$
- id: "s-04-22"
  feuille: "f-s-04"
  numero: 22
  partie: "Mise en équation et problèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation x² = a, mise en équation, discussion selon un paramètre]
  noeuds: [c-racine-reelle, ar-corps]
  notions: []
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **1.** Un rectangle a une longueur qui dépasse sa largeur de $5$ cm, et un périmètre de $46$ cm. Déterminer ses dimensions.

    **2.** Un triangle isocèle a une base de $12$ cm et un périmètre de $40$ cm. Quelle est la longueur de ses deux côtés égaux ?

    **3.** Un rectangle a un périmètre de $60$ m, et sa longueur est le double de sa largeur. Déterminer ses dimensions.

    **4.** Un carré et un triangle équilatéral ont le même périmètre. Le côté du carré mesure $6$ cm de moins que celui du triangle. Déterminer les deux côtés, puis le périmètre commun.
  corrige: |
    **1.** Notons $x$ la largeur en cm ; la longueur vaut alors $x+5$. 
    $$2\big(x+(x+5)\big)=46 \iff 2(2x+5)=46 \iff 4x+10=46 \iff 4x=36 \iff x=9$$

    $$\boxed{\text{Le rectangle mesure } 9 \text{ cm sur } 14 \text{ cm.}}$$
     *Vérification :* $2\times(9+14)=46$.

    **2.** Notons $x$ la longueur d'un côté égal : $12+2x=40 \iff 2x=28 \iff x=14$. 
    $$\boxed{\text{Les deux côtés égaux mesurent } 14 \text{ cm.}}$$

    **3.** Notons $x$ la largeur ; la longueur vaut $2x$ : 
    $$2(x+2x)=60 \iff 6x=60 \iff x=10 \qquad \boxed{\text{Le rectangle mesure } 10 \text{ m sur } 20 \text{ m.}}$$

    **4.** Notons $x$ le côté du carré ; celui du triangle vaut $x+6$. Les périmètres valent $4x$ et $3(x+6)$ : 
    $$4x=3(x+6) \iff 4x=3x+18 \iff x=18$$

    $$\boxed{\text{Le carré a pour côté } 18 \text{ cm, le triangle } 24 \text{ cm ; le périmètre commun vaut } 72 \text{ cm.}}$$
- id: "s-04-23"
  feuille: "f-s-04"
  numero: 23
  partie: "Mise en équation et problèmes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [mise en équation]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 6
  page_corrige: 13
  enonce: |
    **1.** Paul a $12$ ans et son père $40$ ans. Dans combien d'années le père aura-t-il exactement le double de l'âge de Paul ?

    **2.** Une mère a $32$ ans de plus que sa fille. Dans $8$ ans, elle aura le triple de l'âge de sa fille. Quels sont leurs âges aujourd'hui ?

    **3.** La somme des âges de trois frères est de $42$ ans. Le deuxième a $3$ ans de plus que le premier, et le troisième $6$ ans de plus que le premier. Quels sont leurs âges ?
  corrige: |
    **1.** Notons $x$ le nombre d'années à attendre. Dans $x$ ans, Paul aura $12+x$ ans et son père $40+x$ ans : 
    $$40+x=2(12+x) \iff 40+x=24+2x \iff 16=x$$

    $$\boxed{\text{Il faudra attendre } 16 \text{ ans.}}$$
     *Vérification :* dans $16$ ans, Paul aura $28$ ans et son père $56=2\times 28$.

    **2.** Notons $x$ l'âge actuel de la fille ; la mère a $x+32$ ans. Dans $8$ ans : 
    $$(x+32)+8=3(x+8) \iff x+40=3x+24 \iff 16=2x \iff x=8$$

    $$\boxed{\text{La fille a } 8 \text{ ans et la mère } 40 \text{ ans.}}$$

    **3.** Notons $x$ l'âge du premier frère ; les deux autres ont $x+3$ et $x+6$ ans : 
    $$x+(x+3)+(x+6)=42 \iff 3x+9=42 \iff x=11$$

    $$\boxed{\text{Les trois frères ont } 11,\ 14 \text{ et } 17 \text{ ans.}}$$
- id: "s-04-24"
  feuille: "f-s-04"
  numero: 24
  partie: "Mise en équation et problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [mise en équation]
  noeuds: [ar-corps]
  notions: []
  page_enonce: 6
  page_corrige: 14
  enonce: |
    **1.** Un stylo et un cahier coûtent ensemble $7{,}50$ €. Le cahier coûte le double du stylo. Quel est le prix de chacun ?

    **2.** Un parking propose deux tarifs : le tarif A coûte $3$ € d'entrée puis $1{,}50$ € par heure ; le tarif B coûte $6$ € d'entrée puis $0{,}75$ € par heure. Pour quelle durée de stationnement les deux tarifs reviennent-ils au même prix ? Quel est alors ce prix ?

    **3.** Marie possède trois fois plus d'argent que Léo. Si Marie donne $20$ € à Léo, ils en auront autant l'un que l'autre. Combien chacun possède-t-il ?

    **4.** Un commerçant achète des tee-shirts $12$ € pièce et les revend $20$ €. Il a par ailleurs $240$ € de frais fixes. Combien doit-il en vendre pour que sa recette couvre exactement ses dépenses ?
  corrige: |
    **1.** Notons $x$ le prix du stylo en euros ; le cahier coûte $2x$ : 
    $$x+2x=7{,}50 \iff 3x=7{,}50 \iff x=2{,}50$$

    $$\boxed{\text{Le stylo coûte } 2{,}50~\text{€ et le cahier } 5~\text{€.}}$$

    **2.** Notons $t$ la durée en heures. Les deux tarifs valent $3+1{,}5t$ et $6+0{,}75t$ : 
    $$3+1{,}5t=6+0{,}75t \iff 0{,}75t=3 \iff t=4$$
     Le prix commun vaut alors $3+1{,}5\times 4=9$. 
    $$\boxed{\text{Les deux tarifs coïncident pour } 4 \text{ heures, au prix de } 9~\text{€.}}$$

    **3.** Notons $x$ la somme que possède Léo ; Marie possède $3x$. Après le don : 
    $$3x-20=x+20 \iff 2x=40 \iff x=20$$

    $$\boxed{\text{Léo a } 20~\text{€ et Marie } 60~\text{€.}}$$
     *Vérification :* après le don, Marie a $40$ € et Léo aussi.

    **4.** Notons $n$ le nombre de tee-shirts vendus. La recette vaut $20n$, les dépenses $12n+240$ : 
    $$20n=12n+240 \iff 8n=240 \iff n=30$$

    $$\boxed{\text{Il doit en vendre } 30.}$$
- id: "s-04-25"
  feuille: "f-s-04"
  numero: 25
  partie: "Mise en équation et problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équation x² = a, mise en équation]
  noeuds: [c-racine-reelle, ar-corps]
  notions: []
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Un rectangle a pour largeur $5$ cm et pour longueur $x$ cm. Son périmètre est égal à celui d'un carré de côté $7$ cm. Déterminer $x$.

    **2.** Dans un triangle $ABC$, on a $AB=2x+1$, $BC=x+4$ et $CA=3x-2$, exprimés en centimètres. Le périmètre vaut $27$ cm. Déterminer $x$, puis les trois longueurs.

    **3.** Un rectangle de longueur $x+3$ et de largeur $4$ a la même aire qu'un rectangle de longueur $x$ et de largeur $6$. Déterminer $x$.

    **4.** Un triangle de base $12$ cm et de hauteur $x$ cm a la même aire qu'un rectangle de côtés $4$ cm et $x+3$ cm. Déterminer $x$.
  corrige: |
    **1.** Le périmètre du carré vaut $4\times 7=28$ cm : 
    $$2(5+x)=28 \iff 5+x=14 \iff \boxed{x=9 \text{ cm.}}$$

    **2.** $AB+BC+CA=27$ donne : 
    $$(2x+1)+(x+4)+(3x-2)=27 \iff 6x+3=27 \iff 6x=24 \iff x=4$$

    $$\boxed{AB=9 \text{ cm},\quad BC=8 \text{ cm},\quad CA=10 \text{ cm.}}$$
     *Vérification :* $9+8+10=27$.

    **3.** Les deux aires valent $4(x+3)$ et $6x$ : 
    $$4(x+3)=6x \iff 4x+12=6x \iff 12=2x \iff \boxed{x=6.}$$

    **4.** L'aire du triangle vaut $\dfrac{12\times x}{2}=6x$, celle du rectangle $4(x+3)$ : 
    $$6x=4(x+3) \iff 6x=4x+12 \iff \boxed{x=6 \text{ cm.}}$$
- id: "s-04-26"
  feuille: "f-s-04"
  numero: 26
  partie: "Mise en équation et problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation x² = a, mise en équation]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $x$ un nombre réel. On considère l'expression : 
    $$A=(2x-5)^{2}-9$$

    **1.** Développer et réduire $A$.

    **2.** Factoriser $A$ en reconnaissant une différence de deux carrés.

    **3.** Calculer $A$ pour $x=0$, puis pour $x=3$.

    **4.** Résoudre l'équation $A=0$.

    **5.** Résoudre l'équation $A=16$.

    **6.** Pour chacune des questions 3, 4 et 5, préciser quelle forme de $A$ (développée ou factorisée) vous avez utilisée, et pourquoi.
  corrige: |
    **1.** $A=(2x-5)^{2}-9=4x^{2}-20x+25-9$, donc 
    $$\boxed{A=4x^{2}-20x+16}$$

    **2.** On reconnaît $a^{2}-b^{2}$ avec $a=2x-5$ et $b=3$ : 
    $$A=\big[(2x-5)-3\big]\big[(2x-5)+3\big]=(2x-8)(2x-2) \qquad \boxed{A=(2x-8)(2x-2)}$$

    **3.** Pour $x=0$ : $A=(0-5)^{2}-9=25-9=\boxed{16}$. Pour $x=3$ : $A=(6-5)^{2}-9=1-9=\boxed{-8}$.

    **4.** $A=0 \iff (2x-8)(2x-2)=0 \iff 2x-8=0$ ou $2x-2=0$ : 
    $$\boxed{S=\{1\,;4\}}$$

    **5.** $A=16 \iff (2x-5)^{2}-9=16 \iff (2x-5)^{2}=25 \iff (2x-5)^{2}-25=0$. On factorise : 
    $$(2x-5-5)(2x-5+5)=0 \iff (2x-10)\times 2x=0 \qquad \boxed{S=\{0\,;5\}}$$
     *Vérification :* on avait déjà trouvé $A=16$ pour $x=0$ à la question 3.

    **6.** **Question 3 :** la forme initiale $(2x-5)^{2}-9$ est la plus rapide pour un calcul numérique. **Question 4 :** la forme **factorisée** est indispensable, car seule l'équation produit se résout en Seconde. **Question 5 :** on repart de la forme initiale pour isoler le carré, puis on factorise à nouveau.

    $$\boxed{\text{Chaque forme a son usage : développée pour calculer, factorisée pour résoudre.}}$$
- id: "s-04-27"
  feuille: "f-s-04"
  numero: 27
  partie: "Mise en équation et problèmes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [équation x² = a, mise en équation]
  noeuds: [c-racine-reelle, ar-corps]
  notions: []
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On considère les trois programmes de calcul suivants.

    ```tableau
    **Programme A** ¦ **Programme B** ¦ **Programme C**
    $\bullet$ Choisir un nombre $\bullet$ Le multiplier par $4$ $\bullet$ Ajouter $6$ $\bullet$ Soustraire le double du nombre choisi ¦ $\bullet$ Choisir un nombre $\bullet$ Lui ajouter $3$ $\bullet$ Multiplier le résultat par $2$ ¦ $\bullet$ Choisir un nombre $\bullet$ L'élever au carré $\bullet$ Retrancher $4$ $\bullet$ Diviser par le nombre choisi augmenté de $2$
    ```

    **1.** Appliquer les programmes A et B au nombre $5$, puis au nombre $-2$. Que remarque-t-on ?

    **2.** On note $x$ le nombre choisi. Exprimer en fonction de $x$ le résultat du programme A, puis celui du programme B. Démontrer la remarque de la question 1.

    **3.** Quel nombre faut-il choisir pour que le programme A donne $0$ ?

    **4.** Le programme C ne peut pas être appliqué à tous les nombres. Lequel doit-on écarter, et pourquoi ?

    **5.** Montrer que, pour tous les autres nombres, le programme C revient simplement à retrancher $2$ au nombre choisi.

    **6.** Quel nombre faut-il choisir pour que le programme C donne $0$ ?
  corrige: |
    **1.** Avec $5$ : programme A donne $5\times 4=20$, puis $20+6=26$, puis $26-10=16$ ; programme B donne $5+3=8$, puis $8\times 2=16$.

    Avec $-2$ : A donne $-8+6=-2$, puis $-2-(-4)=2$ ; B donne $1\times 2=2$. 
    $$\boxed{\text{Les deux programmes semblent donner toujours le même résultat.}}$$

    **2.** Programme A : $4x+6-2x=\boxed{2x+6}$. Programme B : $2(x+3)=\boxed{2x+6}$.

    Les deux expressions sont identiques : les deux programmes donnent bien le même résultat, **quel que soit** le nombre choisi.

    **3.** $2x+6=0 \iff 2x=-6 \iff \boxed{x=-3}$

    **4.** Le programme C se termine par une division par $x+2$. Or $x+2=0$ pour $x=-2$ : 
    $$\boxed{\text{Le nombre } -2 \text{ doit être écarté : c'est la valeur interdite.}}$$

    **5.** Pour $x\neq -2$, le programme C donne $\dfrac{x^{2}-4}{x+2}$. En factorisant le numérateur : 
    $$\frac{x^{2}-4}{x+2}=\frac{(x-2)(x+2)}{x+2}=x-2$$
     la simplification étant légitime puisque $x+2\neq 0$. 
    $$\boxed{\text{Le programme C revient à retrancher } 2 \text{ au nombre choisi.}}$$

    **6.** Le programme C donne $0$ lorsque le numérateur s'annule sans que le dénominateur le fasse. Or $x-2=0 \iff x=2$, qui n'est pas la valeur interdite : 
    $$\boxed{x=2}$$
- id: "s-04-28"
  feuille: "f-s-04"
  numero: 28
  partie: "Mise en équation et problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation quotient]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    **La méthode de la fausse position.** Le papyrus Rhind, rédigé vers $1650$ av. J.-C., pose le problème suivant : « *une quantité et son septième font $19$* ».

    **1.** Traduire ce problème par une équation d'inconnue $x$.

    **2.** Résoudre cette équation par la méthode moderne du chapitre.

    **3.** **La méthode d'Ahmès.** Le scribe essaie d'abord la valeur commode $7$ : elle donne $7+1=8$ au lieu de $19$. Il multiplie alors sa valeur d'essai par $\dfrac{19}{8}$. Vérifier que l'on retrouve bien le résultat de la question 2.

    **4.** Appliquer les deux méthodes au problème : « une quantité et son cinquième font $24$ ».

    **5.** La méthode de la fausse position appliquée à l'équation $x+\dfrac{x}{7}+3=19$ donnerait un résultat faux. Le vérifier, puis expliquer pourquoi cette méthode échoue ici.
  corrige: |
    **1.** En notant $x$ la quantité cherchée, son septième vaut $\dfrac{x}{7}$ : 
    $$\boxed{x+\frac{x}{7}=19}$$

    **2.** On multiplie les deux membres par $7$ : 
    $$7x+x=133 \iff 8x=133 \iff \boxed{x=\frac{133}{8}=16{,}625}$$

    **3.** La valeur d'essai $7$ donne $7+1=8$ au lieu de $19$. En la multipliant par $\dfrac{19}{8}$ : 
    $$7\times\frac{19}{8}=\frac{133}{8}$$

    $$\boxed{\text{On retrouve exactement le résultat de la question 2.}}$$

    **4.** **Méthode moderne :** $x+\dfrac{x}{5}=24$. En multipliant par $5$ : 
    $$5x+x=120 \iff 6x=120 \iff \boxed{x=20}$$
     **Méthode d'Ahmès :** l'essai $5$ donne $5+1=6$ au lieu de $24$. Comme $6$ doit devenir $24$, on multiplie par $\dfrac{24}{6}=4$, ce qui donne $5\times 4=20$. Même résultat.

    **5.** **Méthode moderne :** $x+\dfrac{x}{7}+3=19 \iff \dfrac{8x}{7}=16 \iff 8x=112 \iff \boxed{x=14}$.

    **Méthode d'Ahmès :** l'essai $7$ donne $7+1+3=11$ au lieu de $19$, d'où la valeur $7\times\dfrac{19}{11}=\dfrac{133}{11}\approx 12{,}09$, qui est **fausse**.

    *Pourquoi la méthode échoue-t-elle ?* Elle repose sur une idée de proportionnalité : si l'on double la quantité d'essai, on double le résultat. C'est vrai pour $x+\frac{x}{7}$, mais plus du tout dès que l'on ajoute la constante $3$, qui, elle, ne double pas. La fausse position ne fonctionne donc que pour les situations **proportionnelles** — et c'est bien pourquoi il a fallu inventer une méthode générale.
- id: "s-04-29"
  feuille: "f-s-04"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient, équation x² = a]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Résoudre les équations suivantes. Elles sont de tous les types rencontrés dans le chapitre : il faut donc commencer par reconnaître à quel type on a affaire.

    **a)** $5(x-2)=3x+8$

    **b)** $(x-4)(2x+6)=0$

    **c)** $\dfrac{3x-1}{x+2}=0$

    **d)** $x^{2}=64$

    **e)** $\dfrac{x}{3}-2=\dfrac{x}{5}$

    **f)** $4x^{2}-9x=0$

    **g)** $\dfrac{x^{2}-25}{x-5}=0$

    **h)** $2(x+3)=2x+6$

    **i)** $(x+1)^{2}-4=0$

    **j)** $7-3x=3-3x$

    **k)** $(2x+1)(x-3)=(2x+1)(x+5)$

    **l)** $\dfrac{5x}{x^{2}+1}=0$
  corrige: |
    **a)** *Premier degré.* $5(x-2)=3x+8 \iff 5x-10=3x+8 \iff 2x=18 \iff \boxed{S=\{9\}}$

    **b)** *Équation produit.* $x-4=0$ ou $2x+6=0$ : $\boxed{S=\{-3\,;4\}}$

    **c)** *Équation quotient.* V.I. $x=-2$ ; numérateur $3x-1=0 \iff x=\frac{1}{3}$, acceptée : $\boxed{S=\left\{\dfrac{1}{3}\right\}}$

    **d)** *Produit après factorisation.* $x^{2}=64 \iff (x-8)(x+8)=0$ : $\boxed{S=\{-8\,;8\}}$

    **e)** *Premier degré avec fractions.* On multiplie par $15$ : $5x-30=3x \iff 2x=30 \iff \boxed{S=\{15\}}$

    **f)** *Facteur commun.* $4x^{2}-9x=0 \iff x(4x-9)=0$ : $\boxed{S=\left\{0\,;\dfrac{9}{4}\right\}}$

    **g)** *Quotient avec rejet.* V.I. $x=5$ ; numérateur $x^{2}-25=0$ donne $x=5$ ou $x=-5$ ; on rejette $5$ : $\boxed{S=\{-5\}}$

    **h)** *Cas particulier.* $2(x+3)=2x+6 \iff 0=0$ : $\boxed{S=\mathbb{R}}$

    **i)** *Identité remarquable.* $(x+1)^{2}-4=0 \iff (x-1)(x+3)=0$ : $\boxed{S=\{-3\,;1\}}$

    **j)** *Cas particulier.* $7-3x=3-3x \iff 7=3$, égalité fausse : $\boxed{S=\varnothing}$

    **k)** *Facteur commun.* $(2x+1)\big[(x-3)-(x+5)\big]=0 \iff (2x+1)\times(-8)=0$. Le facteur $-8$ ne s'annule jamais : $\boxed{S=\left\{-\dfrac{1}{2}\right\}}$

    **l)** *Quotient.* Aucune V.I. car $x^{2}+1>0$ ; numérateur $5x=0 \iff x=0$ : $\boxed{S=\{0\}}$
- id: "s-04-30"
  feuille: "f-s-04"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [équations, équation produit, équation quotient, équation x² = a]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. La solution de $3x-7=8$ est ¦ $5$ ¦ $\dfrac{1}{3}$ ¦ $15$
    2. Les solutions de $(x-2)(x+6)=0$ sont ¦ $2$ et $6$ ¦ $-2$ et $6$ ¦ $2$ et $-6$
    3. L'équation $x^{2}=16$ admet ¦ une solution ¦ deux solutions ¦ aucune solution
    4. L'équation $x^{2}=-9$ admet ¦ une solution ¦ deux solutions ¦ aucune solution
    5. La valeur interdite de $\dfrac{x+1}{2x-6}$ est ¦ $-1$ ¦ $3$ ¦ $6$
    6. L'équation $4x+1=4x+5$ admet ¦ une solution ¦ aucune solution ¦ une infinité de solutions
    7. L'équation $3(x-1)=3x-3$ admet ¦ une solution ¦ aucune solution ¦ une infinité de solutions
    8. Les solutions de $x(x+4)=0$ sont ¦ $0$ et $4$ ¦ $0$ et $-4$ ¦ $-4$ seulement
    ```
  corrige: |
    **1.** **Réponse A.** $3x-7=8 \iff 3x=15 \iff x=5$. La réponse C s'obtient en oubliant de diviser par $3$.

    **2.** **Réponse C.** $x-2=0$ donne $x=2$, et $x+6=0$ donne $x=-6$. Les solutions sont les *opposés* des nombres qui figurent dans les parenthèses.

    **3.** **Réponse B.** $x^{2}=16 \iff (x-4)(x+4)=0$ : les solutions sont $4$ et $-4$.

    **4.** **Réponse C.** Un carré est toujours positif ou nul, il ne peut pas valoir $-9$.

    **5.** **Réponse B.** La valeur interdite annule le dénominateur : $2x-6=0 \iff x=3$. La réponse A est le nombre qui annule le *numérateur*.

    **6.** **Réponse B.** En retranchant $4x$, il reste $1=5$, égalité fausse.

    **7.** **Réponse C.** En développant, $3x-3=3x-3$ : l'égalité est toujours vraie.

    **8.** **Réponse B.** $x=0$ ou $x+4=0$, c'est-à-dire $x=0$ ou $x=-4$. La réponse C oublie que $0$ est une solution à part entière.
- id: "s-04-31"
  feuille: "f-s-04"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient, équation x² = a]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Chacune des résolutions suivantes contient une erreur. La repérer, l'expliquer, puis rédiger la résolution correcte.

    **1.** « $3x+5=20$, donc $3x=25$, donc $x=\dfrac{25}{3}$. »

    **2.** « $(x-2)(x+3)=0$, donc $x=2$ **et** $x=-3$. »

    **3.** « $x^{2}=49$, donc $x=7$. »

    **4.** « $(x-1)(x+2)=6$, donc $x-1=6$ ou $x+2=6$, donc $x=7$ ou $x=4$. »

    **5.** « $\dfrac{x^{2}-9}{x-3}=0$, donc $x^{2}-9=0$, donc $x=3$ ou $x=-3$. »

    **6.** « $5x=3x$, on divise les deux membres par $x$ : $5=3$. L'équation n'a pas de solution. »
  corrige: |
    **1.** **Erreur :** on a *ajouté* $5$ au lieu de le retrancher.

    **Correction :** $3x+5=20 \iff 3x=15 \iff \boxed{x=5}$.

    **2.** **Erreur :** le mot « et » à la place de « ou ». Un nombre ne peut pas valoir à la fois $2$ et $-3$ ; ce sont deux solutions *distinctes*, dont chacune convient séparément.

    **Correction :** $x=2$ **ou** $x=-3$, donc $\boxed{S=\{-3\,;2\}}$.

    **3.** **Erreur :** on a oublié la solution négative.

    **Correction :** $x^{2}=49 \iff (x-7)(x+7)=0$, donc $\boxed{S=\{-7\,;7\}}$.

    **4.** **Erreur :** la règle du produit nul ne vaut que pour un produit égal à $\mathbf{0}$. Un produit égal à $6$ ne renseigne en rien sur ses facteurs : $6=1\times 6=2\times 3=12\times \frac{1}{2}$, etc.

    **Correction :** il faudrait développer et ramener à $0$, ce qui donne $x^{2}+x-8=0$ — une équation du second degré que l'on ne sait pas résoudre en Seconde. *L'énoncé était donc mal posé.*

    **5.** **Erreur :** on a oublié la troisième étape, la comparaison avec les valeurs interdites.

    **Correction :** V.I. $x=3$ ; le numérateur s'annule pour $x=3$ ou $x=-3$ ; on rejette $3$, donc $\boxed{S=\{-3\}}$.

    **6.** **Erreur :** on a divisé par $x$, alors que $x$ pourrait être nul — et il l'est justement.

    **Correction :** $5x=3x \iff 2x=0 \iff \boxed{x=0}$. L'équation admet bien une solution.
- id: "s-04-32"
  feuille: "f-s-04"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient, équation x² = a, mise en équation]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Soit $x$ un nombre réel. On considère l'expression : 
    $$E=(2x+1)^{2}-(x-3)^{2}$$

    **1.** Développer et réduire $E$.

    **2.** Factoriser $E$ en reconnaissant une différence de deux carrés.

    **3.** Vérifier la cohérence des deux résultats en développant la forme factorisée.

    **4.** Calculer $E$ pour $x=1$, de deux façons différentes.

    **5.** Résoudre l'équation $E=0$.

    **6.** Résoudre l'équation $E=-8$.

    **7.** Déterminer les valeurs interdites du quotient $\dfrac{E}{x+4}$, puis résoudre l'équation $\dfrac{E}{x+4}=0$.

    **8.** Comparer les solutions des questions 5 et 7, et commenter.
  corrige: |
    **1.** On développe chaque carré séparément : 
    $$E=(2x+1)^{2}-(x-3)^{2}=\big(4x^{2}+4x+1\big)-\big(x^{2}-6x+9\big)=4x^{2}+4x+1-x^{2}+6x-9$$

    $$\boxed{E=3x^{2}+10x-8}$$
     *Piège classique :* le signe $-$ devant le second carré porte sur ses **trois** termes.

    **2.** On reconnaît $a^{2}-b^{2}$ avec $a=2x+1$ et $b=x-3$ : 
    $$E=\big[(2x+1)-(x-3)\big]\big[(2x+1)+(x-3)\big]=(2x+1-x+3)(2x+1+x-3)$$

    $$\boxed{E=(x+4)(3x-2)}$$

    **3.** $(x+4)(3x-2)=3x^{2}-2x+12x-8=3x^{2}+10x-8$ : on retrouve bien la forme développée de la question 1.

    **4.** **Forme initiale :** $E=(2\times 1+1)^{2}-(1-3)^{2}=9-4=5$.

    **Forme factorisée :** $E=(1+4)(3\times 1-2)=5\times 1=5$. $\boxed{E=5}$

    **5.** $E=0 \iff (x+4)(3x-2)=0 \iff x+4=0$ ou $3x-2=0$ : 
    $$\boxed{S=\left\{-4\,;\dfrac{2}{3}\right\}}$$

    **6.** $E=-8 \iff 3x^{2}+10x-8=-8 \iff 3x^{2}+10x=0$. On factorise par $x$ : 
    $$x(3x+10)=0 \qquad \boxed{S=\left\{-\dfrac{10}{3}\,;0\right\}}$$
     *Ici c'est la forme développée qui sert*, car c'est elle qui fait apparaître le facteur commun après simplification du $-8$.

    **7.** **Valeurs interdites :** $x+4=0$ donne $x=-4$.

    **Numérateur nul :** $E=0$ donne $x=-4$ ou $x=\frac{2}{3}$ (question 5).

    **Comparaison :** on rejette $-4$, qui est la valeur interdite. 
    $$\boxed{S=\left\{\dfrac{2}{3}\right\}}$$

    **8.** L'équation $E=0$ a deux solutions, tandis que $\dfrac{E}{x+4}=0$ n'en a qu'une. 
    $$\boxed{\text{Le dénominateur n'apporte jamais de solution : il en retire.}}$$
     Ici, $-4$ annule à la fois le numérateur et le dénominateur ; le quotient n'existe donc pas en ce point, et la solution disparaît.
- id: "s-04-33"
  feuille: "f-s-04"
  numero: 33
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [équations, équation produit, mise en équation, discussion selon un paramètre]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Dans tout cet exercice, $m$ désigne un nombre réel fixé, et l'inconnue est $x$.

    **Partie A.** On considère l'équation $\;(E) : (m-2)x=6$.

    **1.** Résoudre $(E)$ dans le cas où $m=5$, puis dans le cas où $m=0$.

    **2.** Que devient $(E)$ lorsque $m=2$ ? Combien de solutions admet-elle alors ?

    **3.** Pour quelles valeurs de $m$ l'équation $(E)$ admet-elle une unique solution ? Exprimer alors cette solution en fonction de $m$.

    **4.** Déterminer la valeur de $m$ pour laquelle la solution de $(E)$ vaut $1$.

    **Partie B.** On considère l'équation $\;(F) : (m-1)x+3=m+2$.

    **5.** Montrer que $(F)$ peut s'écrire $(m-1)x=m-1$.

    **6.** Résoudre $(F)$ lorsque $m=4$, puis lorsque $m=-3$.

    **7.** Que devient $(F)$ lorsque $m=1$ ? Combien de solutions admet-elle alors ?

    **8.** Résoudre $(F)$ en discutant selon les valeurs de $m$.
  corrige: |
    **Partie A.** $(E) : (m-2)x=6$

    **1.** Pour $m=5$ : $(5-2)x=6$, soit $3x=6$, donc $\boxed{x=2}$.

    Pour $m=0$ : $(0-2)x=6$, soit $-2x=6$, donc $\boxed{x=-3}$.

    **2.** Pour $m=2$, l'équation devient $0\times x=6$, c'est-à-dire $0=6$. Cette égalité est fausse quel que soit $x$ : 
    $$\boxed{\text{Pour } m=2,\ (E) \text{ n'admet aucune solution.}}$$

    **3.** Dès que $m-2\neq 0$, on peut diviser les deux membres par $m-2$ : 
    $$\boxed{\text{Pour tout } m\neq 2,\ (E) \text{ admet l'unique solution } x=\frac{6}{m-2}.}$$

    **4.** On cherche $m$ tel que $\dfrac{6}{m-2}=1$, c'est-à-dire $6=m-2$ : 
    $$\boxed{m=8}$$
     *Vérification :* pour $m=8$, l'équation s'écrit $6x=6$, dont la solution est bien $1$.

    **Partie B.** $(F) : (m-1)x+3=m+2$

    **5.** On retranche $3$ aux deux membres : 
    $$(m-1)x+3=m+2 \iff (m-1)x=m+2-3 \iff \boxed{(m-1)x=m-1}$$

    **6.** Pour $m=4$ : $3x=3$, donc $\boxed{x=1}$. Pour $m=-3$ : $-4x=-4$, donc $\boxed{x=1}$.

    **7.** Pour $m=1$, l'équation devient $0\times x=0$, c'est-à-dire $0=0$. Cette égalité est vraie quel que soit $x$ : 
    $$\boxed{\text{Pour } m=1,\ \text{tous les réels sont solutions.}}$$

    **8.** On distingue donc deux cas : 
    $$\boxed{\begin{array}{l} \text{si } m\neq 1 : \text{ on divise par } m-1 \text{ et } (F) \text{ admet l'unique solution } x=1 ; \\[1mm] \text{si } m=1 : \text{ tous les réels sont solutions.} \end{array}}$$

    *On remarque que* la solution ne dépend pas de $m$ : c'est toujours $1$. C'était prévisible dès la question 5, puisque l'équation $(m-1)x=m-1$ est vérifiée par $x=1$ quelle que soit la valeur de $m$ — mais elle l'est alors par *tous* les réels lorsque $m-1$ s'annule.

