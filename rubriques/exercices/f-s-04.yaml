- id: "s-04-01"
  feuille: "f-s-04"
  numero: 1
  partie: "Vocabulaire et vérification"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation du premier degré]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des équations suivantes, préciser l'inconnue, le premier membre et le second membre.

    **a)** $4x+7=19$

    **b)** $3-2t=t+6$

    **c)** $y^{2}-1=8$

    **d)** $5(z+2)=3z$
  corrige: |
    $$\begin{array}{|c|c|c|c|} \hline \text{Équation} & \text{Inconnue} & \text{Premier membre} & \text{Second membre} \\ \hline \text{a) }4x+7=19 & x & 4x+7 & 19 \\ \hline \text{b) }3-2t=t+6 & t & 3-2t & t+6 \\ \hline \text{c) }y^{2}-1=8 & y & y^{2}-1 & 8 \\ \hline \text{d) }5(z+2)=3z & z & 5(z+2) & 3z \\ \hline \end{array}$$

    *On remarque que* l'inconnue n'est pas toujours notée $x$ : c'est la lettre qui figure dans l'équation, quelle qu'elle soit. Le premier membre est ce qui se trouve **à gauche** du signe $=$, le second ce qui se trouve à droite.
- id: "s-04-02"
  feuille: "f-s-04"
  numero: 2
  partie: "Vocabulaire et vérification"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [équations, équation produit, équation quotient, mise en équation]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dans chaque cas, dire si les nombres proposés sont ou non solutions de l'équation. On justifiera en calculant séparément les deux membres.

    **1.** $3x-5=7$ avec $x=4$, puis $x=-4$, puis $x=2$.

    **2.** $x^{2}-x=6$ avec $x=3$, puis $x=-2$, puis $x=2$.

    **3.** $(x-1)(x+4)=0$ avec $x=1$, puis $x=-4$, puis $x=4$.

    **4.** $\dfrac{2x+3}{x-5}=0$ avec $x=5$, puis $x=-\dfrac{3}{2}$, puis $x=0$.

    **5.** $2(x+3)=2x+6$ avec $x=0$, puis $x=7$, puis $x=-11$. Que remarque-t-on ?
  corrige: |
    *Méthode : on calcule séparément les deux membres, puis on compare.*

    **1.** $3x-5=7$

    • $x=4$ : premier membre $3\times 4-5=7$ ; second membre $7$. Égalité vraie : $\boxed{4 \text{ est solution.}}$

    • $x=-4$ : $3\times(-4)-5=-17\neq 7$. $\boxed{-4 \text{ n'est pas solution.}}$

    • $x=2$ : $3\times 2-5=1\neq 7$. $\boxed{2 \text{ n'est pas solution.}}$

    **2.** $x^{2}-x=6$

    • $x=3$ : $3^{2}-3=9-3=6$. $\boxed{3 \text{ est solution.}}$

    • $x=-2$ : $(-2)^{2}-(-2)=4+2=6$. $\boxed{-2 \text{ est solution.}}$

    • $x=2$ : $2^{2}-2=2\neq 6$. $\boxed{2 \text{ n'est pas solution.}}$

    *Attention aux signes :* $(-2)^{2}=4$ et non $-4$, et $-(-2)=+2$.

    **3.** $(x-1)(x+4)=0$

    • $x=1$ : $(1-1)(1+4)=0\times 5=0$. $\boxed{1 \text{ est solution.}}$

    • $x=-4$ : $(-4-1)(-4+4)=(-5)\times 0=0$. $\boxed{-4 \text{ est solution.}}$

    • $x=4$ : $(4-1)(4+4)=3\times 8=24\neq 0$. $\boxed{4 \text{ n'est pas solution.}}$

    **4.** $\dfrac{2x+3}{x-5}=0$

    • $x=5$ : le dénominateur vaut $5-5=0$, donc le quotient n'existe pas. 
    $$\boxed{5 \text{ n'est pas solution : c'est la valeur interdite.}}$$

    • $x=-\frac{3}{2}$ : le numérateur vaut $2\times\left(-\frac{3}{2}\right)+3=0$ et le dénominateur $-\frac{3}{2}-5=-\frac{13}{2}\neq 0$, donc le quotient vaut $0$. $\boxed{-\frac{3}{2} \text{ est solution.}}$

    • $x=0$ : le quotient vaut $\dfrac{3}{-5}\neq 0$. $\boxed{0 \text{ n'est pas solution.}}$

    **5.** $2(x+3)=2x+6$

    • $x=0$ : $2\times 3=6$ et $6$. Égalité vraie.

    • $x=7$ : $2\times 10=20$ et $14+6=20$. Égalité vraie.

    • $x=-11$ : $2\times(-8)=-16$ et $-22+6=-16$. Égalité vraie.

    $$\boxed{\text{Les trois nombres sont solutions.}}$$
     En développant le premier membre, on obtient $2x+6$ : les deux membres sont *identiques*. Cette égalité est donc vraie pour **tout** nombre, et pas seulement pour ceux que l'on a testés.
- id: "s-04-03"
  feuille: "f-s-04"
  numero: 3
  partie: "Vocabulaire et vérification"
  etoiles: 1
  types: [Vrai ou faux, Démonstration]
  mots_cles: [équations, équation du premier degré, mise en équation]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** On peut ajouter un même nombre aux deux membres d'une équation sans changer ses solutions.

    **2.** On peut multiplier les deux membres d'une équation par $0$ sans changer ses solutions.

    **3.** On peut diviser les deux membres d'une équation par l'inconnue $x$.

    **4.** Si l'inconnue disparaît au cours de la résolution, c'est que l'on a commis une erreur.

    **5.** Une équation du premier degré admet toujours exactement une solution.

    **6.** Vérifier qu'un nombre est solution suffit à prouver qu'il n'y en a pas d'autres.
  corrige: |
    **1.** **Vraie**. C'est le premier point de la propriété 1 du cours : c'est le principe de la balance, on fait subir le même traitement aux deux plateaux.

    **2.** **Fausse**. La propriété exige de multiplier par un nombre **non nul**. *Contre-exemple :* l'équation $x=3$ a pour unique solution $3$ ; en multipliant les deux membres par $0$, on obtient $0=0$, qui est vraie pour tout nombre. Les solutions ont donc changé.

    **3.** **Fausse**. Diviser par $x$ suppose que $x$ n'est pas nul, ce que l'on ignore justement. *Contre-exemple :* $5x=3x$ a pour unique solution $0$ ; en divisant par $x$, on obtiendrait $5=3$ et l'on conclurait à tort qu'il n'y a pas de solution.

    **4.** **Fausse**. C'est au contraire une situation prévue par le cours. *Énoncé correct :* lorsque l'inconnue disparaît, il faut regarder l'égalité restante — si elle est vraie, tous les réels sont solutions ; si elle est fausse, il n'y en a aucune.

    **5.** **Fausse**. *Contre-exemple :* $2x+5=2x+1$ n'a aucune solution, et $3(x+2)=3x+6$ en a une infinité.

    **6.** **Fausse**. Vérifier prouve qu'un nombre *est* solution, mais ne dit rien des autres. *Contre-exemple :* $4$ est solution de $x^{2}=16$, mais $-4$ l'est aussi. C'est précisément pour cela qu'il faut une méthode de résolution.
- id: "s-04-04"
  feuille: "f-s-04"
  numero: 4
  partie: "Équations du premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation quotient]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Résoudre les équations suivantes.

    **a)** $x+7=12$

    **b)** $x-4=9$

    **c)** $3x=21$

    **d)** $-5x=35$

    **e)** $\dfrac{x}{4}=3$

    **f)** $2x+5=17$

    **g)** $4x-9=11$

    **h)** $-3x+2=14$

    **i)** $6x+4=4$

    **j)** $5-2x=11$

    **k)** $4x+1=6$

    **l)** $10-6x=3$
  corrige: |
    *Détaillons entièrement la première, à la manière du cours : à droite de chaque ligne figure, en rouge, l'opération effectuée sur les deux membres.*

    $$\begin{array}{rcll} x+7 &=& 12 & \textcolor{#c61e2d}{\text{\small on retranche }{7}\text{ aux deux membres}} \\ x+7-7 &=& 12-7 & \textcolor{#c61e2d}{\text{\small le }{+7}\text{ disparaît à gauche}} \\ x &=& 5 & \end{array}$$

    $$\boxed{S=\{5\}}$$
     *Vérification :* $5+7=12$.

    On procède de la même manière pour les suivantes.

    **b)** $x-4=9 \iff x=9+4 \iff \boxed{x=13}$

    **c)** $3x=21 \iff x=\dfrac{21}{3} \iff \boxed{x=7}$

    **d)** $-5x=35 \iff x=\dfrac{35}{-5} \iff \boxed{x=-7}$

    **e)** $\dfrac{x}{4}=3 \iff x=3\times 4 \iff \boxed{x=12}$

    **f)** $2x+5=17 \iff 2x=12 \iff \boxed{x=6}$

    **g)** $4x-9=11 \iff 4x=20 \iff \boxed{x=5}$

    **h)** $-3x+2=14 \iff -3x=12 \iff \boxed{x=-4}$

    **i)** $6x+4=4 \iff 6x=0 \iff \boxed{x=0}$

    **j)** $5-2x=11 \iff -2x=6 \iff \boxed{x=-3}$

    **k)** $4x+1=6 \iff 4x=5 \iff \boxed{x=\dfrac{5}{4}}$

    **l)** $10-6x=3 \iff -6x=-7 \iff \boxed{x=\dfrac{7}{6}}$

    *Piège classique* (question i) : de $6x=0$ on tire $x=0$, et non « pas de solution ». Le nombre $0$ est une solution comme une autre.

    *Sur les deux dernières :* rien n'oblige une solution à être entière. On laisse alors le résultat sous forme de **fraction irréductible**, et surtout pas en écriture décimale approchée.
- id: "s-04-05"
  feuille: "f-s-04"
  numero: 5
  partie: "Équations du premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre les équations suivantes, dans lesquelles l'inconnue figure dans les deux membres.

    **a)** $7x-5=4x+7$

    **b)** $6x+1=2x+13$

    **c)** $9x-4=5x+16$

    **d)** $2x+8=5x-10$

    **e)** $10-x=3x-6$

    **f)** $-2x+5=4x-7$

    **g)** $3x-8=8x+7$

    **h)** $x+9=5x+1$

    **i)** $4x+3=6x+3$

    **j)** $11-2x=5-5x$

    **k)** $5x-1=3x+6$

    **l)** $4x+7=6x+2$
  corrige: |
    *Méthode : on regroupe les termes en $x$ dans un membre et les nombres seuls dans l'autre.* Détaillons la première :

    $$\begin{array}{rcll} 7x-5 &=& 4x+7 & \textcolor{#c61e2d}{\text{\small on retranche }{4x}\text{ aux deux membres}} \\ 3x-5 &=& 7 & \textcolor{#c61e2d}{\text{\small on ajoute }{5}\text{ aux deux membres}} \\ 3x &=& 12 & \textcolor{#c61e2d}{\text{\small on divise les deux membres par }{3}} \\ x &=& 4 & \end{array}$$

    $$\boxed{S=\{4\}}$$

    **b)** $6x+1=2x+13 \iff 4x=12 \iff \boxed{x=3}$

    **c)** $9x-4=5x+16 \iff 4x=20 \iff \boxed{x=5}$

    **d)** $2x+8=5x-10 \iff 18=3x \iff \boxed{x=6}$

    **e)** $10-x=3x-6 \iff 16=4x \iff \boxed{x=4}$

    **f)** $-2x+5=4x-7 \iff 12=6x \iff \boxed{x=2}$

    **g)** $3x-8=8x+7 \iff -15=5x \iff \boxed{x=-3}$

    **h)** $x+9=5x+1 \iff 8=4x \iff \boxed{x=2}$

    **i)** $4x+3=6x+3 \iff 0=2x \iff \boxed{x=0}$

    **j)** $11-2x=5-5x \iff 3x=-6 \iff \boxed{x=-2}$

    **k)** $5x-1=3x+6 \iff 2x=7 \iff \boxed{x=\dfrac{7}{2}}$

    **l)** $4x+7=6x+2 \iff 5=2x \iff \boxed{x=\dfrac{5}{2}}$

    *On remarque que* pour les questions d), e), f), g) et l), il était plus commode de regrouper l'inconnue dans le **second** membre : on évite ainsi de manipuler un coefficient négatif.
- id: "s-04-06"
  feuille: "f-s-04"
  numero: 6
  partie: "Équations du premier degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation produit, discussion selon un paramètre]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Résoudre les équations suivantes. On commencera par développer.

    **a)** $3(x+2)=15$

    **b)** $4(x-3)=8$

    **c)** $2(3x-1)=16$

    **d)** $5(2x+3)=55$

    **e)** $3(x+4)=5x-2$

    **f)** $2(x-5)=3(x-4)$

    **g)** $5(x+1)-2(x-3)=20$

    **h)** $4(2x-1)-3(x+2)=5$

    **i)** $-2(x-3)=4(1-x)$

    **j)** $3(2x-5)+4=5(x-1)$

    **k)** $(x+1)(x+5)=(x+2)(x+3)$

    **l)** $(2x+1)(x+3)=(2x-1)(x+5)$

    **m)** $(x+1)(x+8)=(x+4)(x+2)$

    **n)** $(2x+1)(x-1)=(x+2)(2x-3)$

    **o)** $(x+3)(x-2)=(x+1)(x-4)$

    **p)** $(x+2)(x+5)=(x+1)(x+3)$
  corrige: |
    **a)** $3(x+2)=15 \iff 3x+6=15 \iff 3x=9 \iff \boxed{x=3}$

    **b)** $4(x-3)=8 \iff 4x-12=8 \iff 4x=20 \iff \boxed{x=5}$

    **c)** $2(3x-1)=16 \iff 6x-2=16 \iff 6x=18 \iff \boxed{x=3}$

    **d)** $5(2x+3)=55 \iff 10x+15=55 \iff 10x=40 \iff \boxed{x=4}$

    **e)** $3(x+4)=5x-2 \iff 3x+12=5x-2 \iff 14=2x \iff \boxed{x=7}$

    **f)** $2(x-5)=3(x-4) \iff 2x-10=3x-12 \iff 2=x \iff \boxed{x=2}$

    **g)** $5(x+1)-2(x-3)=20 \iff 5x+5-2x+6=20 \iff 3x+11=20 \iff 3x=9 \iff \boxed{x=3}$

    *Piège classique :* le signe $-$ devant $2(x-3)$ porte sur les **deux** termes, ce qui donne $-2x\,\mathbf{+6}$ et non $-2x-6$.

    **h)** $4(2x-1)-3(x+2)=5 \iff 8x-4-3x-6=5 \iff 5x-10=5 \iff \boxed{x=3}$

    **i)** $-2(x-3)=4(1-x) \iff -2x+6=4-4x \iff 2x=-2 \iff \boxed{x=-1}$

    **j)** $3(2x-5)+4=5(x-1) \iff 6x-15+4=5x-5 \iff 6x-11=5x-5 \iff \boxed{x=6}$

    *Les six dernières demandent une double distributivité dans chaque membre.* Détaillons la première :

    $$\begin{array}{rcll} (x+1)(x+5) &=& (x+2)(x+3) & \textcolor{#c61e2d}{\text{\small on développe les deux membres}} \\ x^{2}+5x+x+5 &=& x^{2}+3x+2x+6 & \textcolor{#c61e2d}{\text{\small on réduit chaque membre}} \\ x^{2}+6x+5 &=& x^{2}+5x+6 & \textcolor{#c61e2d}{\text{\small on retranche }{x^{2}}\text{ aux deux membres}} \\ 6x+5 &=& 5x+6 & \textcolor{#c61e2d}{\text{\small on retranche }{5x}\text{ puis }{5}} \\ x &=& 1 & \end{array}$$

    $$\boxed{S=\{1\}}$$
     *Ce sont bien les termes en $x^{2}$ qui disparaissent*, laissant une équation du premier degré. Le reste s'obtient de la même manière.

    **l)** $(2x+1)(x+3)=(2x-1)(x+5) \iff 2x^{2}+7x+3=2x^{2}+9x-5 \iff 8=2x \iff \boxed{x=4}$

    **m)** $(x+1)(x+8)=(x+4)(x+2) \iff x^{2}+9x+8=x^{2}+6x+8 \iff 3x=0 \iff \boxed{x=0}$

    **n)** $(2x+1)(x-1)=(x+2)(2x-3) \iff 2x^{2}-x-1=2x^{2}+x-6 \iff 5=2x \iff \boxed{x=\dfrac{5}{2}}$

    **o)** $(x+3)(x-2)=(x+1)(x-4) \iff x^{2}+x-6=x^{2}-3x-4 \iff 4x=2 \iff \boxed{x=\dfrac{1}{2}}$

    **p)** $(x+2)(x+5)=(x+1)(x+3) \iff x^{2}+7x+10=x^{2}+4x+3 \iff 3x=-7 \iff \boxed{x=-\dfrac{7}{3}}$
- id: "s-04-07"
  feuille: "f-s-04"
  numero: 7
  partie: "Équations du premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation quotient, mise en équation]
  noeuds: [ar-corps]
  notions: [corps]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Résoudre les équations suivantes. On pourra commencer par multiplier les deux membres par un nombre bien choisi.

    **a)** $\dfrac{x}{3}=5$

    **b)** $\dfrac{2x}{5}=4$

    **c)** $\dfrac{x}{2}+3=7$

    **d)** $\dfrac{x}{4}-1=2$

    **e)** $\dfrac{x}{3}+\dfrac{x}{2}=5$

    **f)** $\dfrac{x}{2}-\dfrac{x}{5}=3$

    **g)** $\dfrac{x+1}{3}=4$

    **h)** $\dfrac{x}{4}+2=\dfrac{x+1}{3}$

    **i)** $\dfrac{2x-3}{5}=2$

    **j)** $\dfrac{x}{3}+\dfrac{x}{4}=1$
  corrige: |
    *Méthode : on multiplie d'emblée les deux membres par un multiple commun des dénominateurs.* Détaillons la question e) :

    $$\begin{array}{rcll} \dfrac{x}{3}+\dfrac{x}{2} &=& 5 & \textcolor{#c61e2d}{\text{\small on multiplie les deux membres par }{6}} \\[2mm] 6\times\dfrac{x}{3}+6\times\dfrac{x}{2} &=& 6\times 5 & \textcolor{#c61e2d}{\text{\small on simplifie chaque fraction}} \\[2mm] 2x+3x &=& 30 & \textcolor{#c61e2d}{\text{\small on réduit, puis on divise par }{5}} \\ x &=& 6 & \end{array}$$

    $$\boxed{S=\{6\}}$$

    **a)** $\dfrac{x}{3}=5 \iff x=15 \iff \boxed{x=15}$

    **b)** $\dfrac{2x}{5}=4 \iff 2x=20 \iff \boxed{x=10}$

    **c)** $\dfrac{x}{2}+3=7 \iff \dfrac{x}{2}=4 \iff \boxed{x=8}$

    **d)** $\dfrac{x}{4}-1=2 \iff \dfrac{x}{4}=3 \iff \boxed{x=12}$

    **** *(question e) traitée ci-dessus)*

    **f)** $\dfrac{x}{2}-\dfrac{x}{5}=3 \iff 5x-2x=30 \iff 3x=30 \iff \boxed{x=10}$ *(on a multiplié par $10$)*

    **g)** $\dfrac{x+1}{3}=4 \iff x+1=12 \iff \boxed{x=11}$

    **h)** $\dfrac{x}{4}+2=\dfrac{x+1}{3} \iff 3x+24=4(x+1) \iff 3x+24=4x+4 \iff \boxed{x=20}$ *(on a multiplié par $12$)*

    **i)** $\dfrac{2x-3}{5}=2 \iff 2x-3=10 \iff 2x=13 \iff \boxed{x=\dfrac{13}{2}}$

    **j)** $\dfrac{x}{3}+\dfrac{x}{4}=1 \iff 4x+3x=12 \iff 7x=12 \iff \boxed{x=\dfrac{12}{7}}$ *(on a multiplié par $12$)*

    *Attention :* lorsqu'on multiplie par un nombre, il faut multiplier **chaque** terme des deux membres, y compris ceux qui ne sont pas des fractions.
- id: "s-04-08"
  feuille: "f-s-04"
  numero: 8
  partie: "Équations du premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Résoudre les équations suivantes.

    **a)** $0{,}5x+1{,}2=3{,}7$

    **b)** $1{,}5x-2=0{,}5x+4$

    **c)** $0{,}2(x+5)=3$

    **d)** $2{,}4-0{,}8x=0$

    **e)** $5-\big[2x-(3x+1)\big]=8$

    **f)** $2\big[3(x-1)+4\big]=26$

    **g)** $3-2\big(x-(4-x)\big)=5$

    **h)** $0{,}4x+1=0{,}1x+2$
  corrige: |
    **a)** $0{,}5x+1{,}2=3{,}7 \iff 0{,}5x=2{,}5 \iff \boxed{x=5}$

    **b)** $1{,}5x-2=0{,}5x+4 \iff x=6 \iff \boxed{x=6}$

    **c)** $0{,}2(x+5)=3 \iff 0{,}2x+1=3 \iff 0{,}2x=2 \iff \boxed{x=10}$

    **d)** $2{,}4-0{,}8x=0 \iff 0{,}8x=2{,}4 \iff \boxed{x=3}$

    **e)** On supprime les parenthèses en partant de l'intérieur : 
    $$5-\big[2x-(3x+1)\big]=8 \iff 5-\big[2x-3x-1\big]=8 \iff 5-\big[-x-1\big]=8$$

    $$\iff 5+x+1=8 \iff x+6=8 \iff \boxed{x=2}$$
     *Le piège est le double signe :* $-(-x-1)=+x+1$.

    **f)** $2\big[3(x-1)+4\big]=26 \iff 2\big[3x+1\big]=26 \iff 6x+2=26 \iff \boxed{x=4}$

    **g)** $3-2\big(x-(4-x)\big)=5 \iff 3-2\big(2x-4\big)=5 \iff 3-4x+8=5 \iff -4x=-6 \iff \boxed{x=\dfrac{3}{2}}$

    **h)** $0{,}4x+1=0{,}1x+2 \iff 0{,}3x=1 \iff x=\dfrac{1}{0{,}3} \iff \boxed{x=\dfrac{10}{3}}$

    *Sur la dernière :* $\dfrac{1}{0{,}3}=\dfrac{10}{3}$. On peut aussi commencer par multiplier les deux membres par $10$, ce qui donne $4x+10=x+20$ et évite complètement les décimaux.
