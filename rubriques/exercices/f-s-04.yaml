  page_corrige: 5
  enonce: |
    Résoudre les équations suivantes. *Attention :* certaines n'ont aucune solution, d'autres admettent tous les nombres réels pour solutions, d'autres encore une unique solution.

    **a)** $2x+5=2x+1$

    **b)** $3(x+2)=3x+6$

    **c)** $5x+8=3x+8$

    **d)** $5(x-1)=5x+2$

    **e)** $2(3x+1)=6x+2$

    **f)** $3(2x-5)=6x-12$

    **g)** $5(x+2)=3x+7$

    **h)** $4(2x-1)=6x+1$
  corrige: |
    *Rappel du cours : lorsque l'inconnue disparaît, c'est l'égalité restante qu'il faut regarder.*

    **a)** $2x+5=2x+1$. On retranche $2x$ aux deux membres : $5=1$. Cette égalité est **fausse**, donc $\boxed{S=\varnothing \text{ : aucune solution.}}$

    **b)** $3(x+2)=3x+6 \iff 3x+6=3x+6 \iff 0=0$. Cette égalité est **toujours vraie**, donc $\boxed{S=\mathbb{R} \text{ : tous les réels sont solutions.}}$

    **c)** $5x+8=3x+8 \iff 2x=0 \iff \boxed{x=0}$

    *Attention :* ici l'inconnue *ne disparaît pas*. Il reste $2x=0$, qui admet l'unique solution $0$.

    **d)** $5(x-1)=5x+2 \iff 5x-5=5x+2 \iff -5=2$, égalité fausse : $\boxed{S=\varnothing}$

    **e)** $2(3x+1)=6x+2 \iff 6x+2=6x+2 \iff 0=0$ : $\boxed{S=\mathbb{R}}$

    **f)** $3(2x-5)=6x-12 \iff 6x-15=6x-12 \iff -15=-12$, égalité fausse : $\boxed{S=\varnothing}$

    **g)** $5(x+2)=3x+7 \iff 5x+10=3x+7 \iff 2x=-3 \iff \boxed{x=-\dfrac{3}{2}}$

    **h)** $4(2x-1)=6x+1 \iff 8x-4=6x+1 \iff 2x=5 \iff \boxed{x=\dfrac{5}{2}}$

    *Bilan.* Sur ces huit équations, trois n'ont aucune solution, trois en ont une infinité, et trois admettent une unique solution — dont deux fractionnaires. Il ne faut donc pas conclure trop vite : ce n'est pas parce qu'une équation *ressemble* à un cas particulier qu'elle en est un.
- id: "s-04-10"
  feuille: "f-s-04"
  numero: 10
  partie: "Équations du premier degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation quotient]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Résoudre les équations suivantes. Elles reprennent tous les cas rencontrés jusqu'ici.

    **a)** $8x-3=5x+12$

    **b)** $2(x-4)=3(x+1)-5$

    **c)** $\dfrac{x}{5}+2=4$

    **d)** $3(2x+1)=6x+3$

    **e)** $\dfrac{x+3}{2}=\dfrac{2x-1}{3}$

    **f)** $5-4x=4-4x$

    **g)** $0{,}3x-1{,}2=0{,}6$

    **h)** $4(x-2)+3(2-x)=5$

    **i)** $3(x-2)=5x+1$

    **j)** $\dfrac{x}{3}+\dfrac{x}{5}=2$
  corrige: |
    **a)** $8x-3=5x+12 \iff 3x=15 \iff \boxed{x=5}$

    **b)** $2(x-4)=3(x+1)-5 \iff 2x-8=3x-2 \iff -6=x \iff \boxed{x=-6}$

    **c)** $\dfrac{x}{5}+2=4 \iff \dfrac{x}{5}=2 \iff \boxed{x=10}$

    **d)** $3(2x+1)=6x+3 \iff 6x+3=6x+3$ : $\boxed{S=\mathbb{R}}$

    **e)** $\dfrac{x+3}{2}=\dfrac{2x-1}{3} \iff 3(x+3)=2(2x-1) \iff 3x+9=4x-2 \iff \boxed{x=11}$

    **f)** $5-4x=4-4x \iff 5=4$, égalité fausse : $\boxed{S=\varnothing}$

    **g)** $0{,}3x-1{,}2=0{,}6 \iff 0{,}3x=1{,}8 \iff \boxed{x=6}$

    **h)** $4(x-2)+3(2-x)=5 \iff 4x-8+6-3x=5 \iff x-2=5 \iff \boxed{x=7}$

    **i)** $3(x-2)=5x+1 \iff 3x-6=5x+1 \iff -7=2x \iff \boxed{x=-\dfrac{7}{2}}$

    **j)** $\dfrac{x}{3}+\dfrac{x}{5}=2 \iff 5x+3x=30 \iff 8x=30 \iff \boxed{x=\dfrac{15}{4}}$

    *Pour la dernière*, on a multiplié les deux membres par $15$, puis simplifié $\dfrac{30}{8}=\dfrac{15}{4}$ : une fraction se donne toujours sous forme irréductible.
- id: "s-04-11"
  feuille: "f-s-04"
  numero: 11
  partie: "Équations produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation produit]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Résoudre les équations produit suivantes. *On ne développera surtout pas.*

    **a)** $(x-3)(x+5)=0$

    **b)** $(2x-6)(x+1)=0$

    **c)** $(x+7)(3x-12)=0$

    **d)** $(5x+10)(x-8)=0$

    **e)** $x(x-4)=0$

    **f)** $(3x-1)(2x+5)=0$

    **g)** $(x-2)(x-2)=0$

    **h)** $4x(x+6)=0$

    **i)** $(x+1)(x-1)(x+2)=0$

    **j)** $(2x+7)(5-x)=0$

    **k)** $(-3x+9)(x+4)=0$

    **l)** $(x-0{,}5)(2x+3)=0$
  corrige: |
    *Rappel : un produit de facteurs est nul si et seulement si l'un au moins de ses facteurs est nul. On relie donc les équations obtenues par le mot* **ou**.

    Détaillons la première : 
    $$(x-3)(x+5)=0 \quad\text{équivaut à}\quad x-3=0 \ \text{ ou } \ x+5=0$$

    $$x-3=0 \iff x=3 \qquad ; \qquad x+5=0 \iff x=-5$$

    $$\boxed{S=\{-5\,;3\}}$$

    **b)** $2x-6=0$ ou $x+1=0$ : $\boxed{S=\{-1\,;3\}}$

    **c)** $x+7=0$ ou $3x-12=0$ : $\boxed{S=\{-7\,;4\}}$

    **d)** $5x+10=0$ ou $x-8=0$ : $\boxed{S=\{-2\,;8\}}$

    **e)** $x=0$ ou $x-4=0$ : $\boxed{S=\{0\,;4\}}$

    **f)** $3x-1=0$ ou $2x+5=0$ : $\boxed{S=\left\{-\dfrac{5}{2}\,;\dfrac{1}{3}\right\}}$

    **g)** $x-2=0$ ou $x-2=0$ : $\boxed{S=\{2\}}$

    **h)** $4x=0$ ou $x+6=0$ : $\boxed{S=\{-6\,;0\}}$

    **i)** $x+1=0$ ou $x-1=0$ ou $x+2=0$ : $\boxed{S=\{-2\,;-1\,;1\}}$

    **j)** $2x+7=0$ ou $5-x=0$ : $\boxed{S=\left\{-\dfrac{7}{2}\,;5\right\}}$

    **k)** $-3x+9=0$ ou $x+4=0$ : $\boxed{S=\{-4\,;3\}}$

    **l)** $x-0{,}5=0$ ou $2x+3=0$ : $\boxed{S=\left\{-\dfrac{3}{2}\,;0{,}5\right\}}$

    *Deux remarques.* À la question g), les deux facteurs sont identiques : l'équation n'admet qu'**une** solution. À la question h), le facteur $4x$ s'annule pour $x=0$ : le nombre $4$ ne fournit aucune solution, puisqu'il ne s'annule jamais.
- id: "s-04-12"
  feuille: "f-s-04"
  numero: 12
  partie: "Équations produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équations, équation du premier degré, équation produit]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Factoriser le premier membre en mettant en évidence un facteur commun, puis résoudre.

    **a)** $x^{2}-5x=0$

    **b)** $3x^{2}+6x=0$

    **c)** $5x^{2}-2x=0$

    **d)** $4x^{2}+x=0$

    **e)** $(x+1)(x-3)+(x+1)(2x+5)=0$

    **f)** $(2x-1)(x+4)-(2x-1)(3x-2)=0$

    **g)** $(x-5)(x+2)+(x-5)=0$

    **h)** $3(x+2)-x(x+2)=0$

    **i)** $(4x+3)^{2}-(4x+3)(x-1)=0$

    **j)** $2x(x-7)+3(x-7)=0$
  corrige: |
    *Méthode : on repère le facteur commun, on factorise, puis on applique la règle du produit nul.*

    **a)** $x^{2}-5x=0 \iff x(x-5)=0$, d'où $x=0$ ou $x=5$ : $\boxed{S=\{0\,;5\}}$

    **b)** $3x^{2}+6x=0 \iff 3x(x+2)=0$ : $\boxed{S=\{-2\,;0\}}$

    **c)** $5x^{2}-2x=0 \iff x(5x-2)=0$ : $\boxed{S=\left\{0\,;\dfrac{2}{5}\right\}}$

    **d)** $4x^{2}+x=0 \iff x(4x+1)=0$ : $\boxed{S=\left\{-\dfrac{1}{4}\,;0\right\}}$

    **e)** $(x+1)(x-3)+(x+1)(2x+5)=0$. Le facteur commun est $(x+1)$ : 
    $$(x+1)\big[(x-3)+(2x+5)\big]=0 \iff (x+1)(3x+2)=0 \qquad \boxed{S=\left\{-1\,;-\dfrac{2}{3}\right\}}$$

    **f)** $(2x-1)(x+4)-(2x-1)(3x-2)=0$. Facteur commun $(2x-1)$ : 
    $$(2x-1)\big[(x+4)-(3x-2)\big]=0 \iff (2x-1)(-2x+6)=0 \qquad \boxed{S=\left\{\dfrac{1}{2}\,;3\right\}}$$
     *Attention* au signe $-$ devant la seconde parenthèse : $-(3x-2)=-3x+2$.

    **g)** $(x-5)(x+2)+(x-5)=0$. Le second terme est $(x-5)\times 1$ : 
    $$(x-5)\big[(x+2)+1\big]=0 \iff (x-5)(x+3)=0 \qquad \boxed{S=\{-3\,;5\}}$$
     *Piège classique :* on oublie souvent le facteur $1$ et l'on écrit $(x-5)(x+2)=0$.

    **h)** $3(x+2)-x(x+2)=0 \iff (x+2)(3-x)=0$ : $\boxed{S=\{-2\,;3\}}$

    **i)** $(4x+3)^{2}-(4x+3)(x-1)=0$. Comme $(4x+3)^{2}=(4x+3)(4x+3)$ : 
    $$(4x+3)\big[(4x+3)-(x-1)\big]=0 \iff (4x+3)(3x+4)=0 \qquad \boxed{S=\left\{-\dfrac{4}{3}\,;-\dfrac{3}{4}\right\}}$$

    **j)** $2x(x-7)+3(x-7)=0 \iff (x-7)(2x+3)=0$ : $\boxed{S=\left\{-\dfrac{3}{2}\,;7\right\}}$
- id: "s-04-13"
  feuille: "f-s-04"
  numero: 13
  partie: "Équations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation du premier degré, équation produit]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Factoriser le premier membre à l'aide d'une identité remarquable, puis résoudre.

    **a)** $x^{2}-16=0$

    **b)** $x^{2}-49=0$

    **c)** $4x^{2}-9=0$

    **d)** $25x^{2}-1=0$

    **e)** $(x+2)^{2}-9=0$

    **f)** $(2x-1)^{2}-16=0$

    **g)** $(x+3)^{2}-(x-1)^{2}=0$

    **h)** $9x^{2}-4=0$

    **i)** $(3x+1)^{2}-(x+5)^{2}=0$

    **j)** $16x^{2}-81=0$
  corrige: |
    *On utilise l'identité $a^{2}-b^{2}=(a-b)(a+b)$.*

    **a)** $x^{2}-16=0 \iff (x-4)(x+4)=0$ : $\boxed{S=\{-4\,;4\}}$

    **b)** $x^{2}-49=0 \iff (x-7)(x+7)=0$ : $\boxed{S=\{-7\,;7\}}$

    **c)** $4x^{2}-9=0$. Ici $4x^{2}=(2x)^{2}$ et $9=3^{2}$ : 
    $$(2x-3)(2x+3)=0 \qquad \boxed{S=\left\{-\dfrac{3}{2}\,;\dfrac{3}{2}\right\}}$$

    **d)** $25x^{2}-1=0 \iff (5x-1)(5x+1)=0$ : $\boxed{S=\left\{-\dfrac{1}{5}\,;\dfrac{1}{5}\right\}}$

    **e)** $(x+2)^{2}-9=0$. On prend $a=x+2$ et $b=3$ : 
    $$\big[(x+2)-3\big]\big[(x+2)+3\big]=0 \iff (x-1)(x+5)=0 \qquad \boxed{S=\{-5\,;1\}}$$

    **f)** $(2x-1)^{2}-16=0 \iff (2x-1-4)(2x-1+4)=0 \iff (2x-5)(2x+3)=0$ : 
    $$\boxed{S=\left\{-\dfrac{3}{2}\,;\dfrac{5}{2}\right\}}$$

    **g)** $(x+3)^{2}-(x-1)^{2}=0$. On prend $a=x+3$ et $b=x-1$ : 
    $$\big[(x+3)-(x-1)\big]\big[(x+3)+(x-1)\big]=0 \iff 4\times(2x+2)=0$$
     Le facteur $4$ ne s'annule jamais, il reste $2x+2=0$ : $\boxed{S=\{-1\}}$

    *Une seule solution ici :* le premier facteur, une fois réduit, ne contient plus $x$.

    **h)** $9x^{2}-4=0 \iff (3x-2)(3x+2)=0$ : $\boxed{S=\left\{-\dfrac{2}{3}\,;\dfrac{2}{3}\right\}}$

    **i)** $(3x+1)^{2}-(x+5)^{2}=0 \iff \big[(3x+1)-(x+5)\big]\big[(3x+1)+(x+5)\big]=0$ 
    $$\iff (2x-4)(4x+6)=0 \qquad \boxed{S=\left\{-\dfrac{3}{2}\,;2\right\}}$$

    **j)** $16x^{2}-81=0 \iff (4x-9)(4x+9)=0$ : $\boxed{S=\left\{-\dfrac{9}{4}\,;\dfrac{9}{4}\right\}}$
- id: "s-04-14"
  feuille: "f-s-04"
  numero: 14
  partie: "Équations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit, équation x² = a, mise en équation]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Résoudre les équations suivantes. *On prendra garde au nombre de solutions.*

    **a)** $x^{2}=25$

    **b)** $x^{2}=36$

    **c)** $x^{2}=0$

    **d)** $x^{2}=-4$

    **e)** $3x^{2}=27$

    **f)** $x^{2}-11=5$

    **g)** $4x^{2}=100$

    **h)** $(x-1)^{2}=9$
  corrige: |
    *Méthode : on ramène tout dans le premier membre, puis on factorise.*

    **a)** $x^{2}=25 \iff x^{2}-25=0 \iff (x-5)(x+5)=0$ : $\boxed{S=\{-5\,;5\}}$

    **b)** $x^{2}=36 \iff (x-6)(x+6)=0$ : $\boxed{S=\{-6\,;6\}}$

    **c)** $x^{2}=0$. Un produit $x\times x$ est nul si et seulement si $x=0$ : $\boxed{S=\{0\}}$

    **d)** $x^{2}=-4$. Un carré est toujours **positif ou nul**, il ne peut jamais valoir $-4$ : 
    $$\boxed{S=\varnothing}$$

    **e)** $3x^{2}=27 \iff x^{2}=9 \iff (x-3)(x+3)=0$ : $\boxed{S=\{-3\,;3\}}$

    **f)** $x^{2}-11=5 \iff x^{2}=16 \iff (x-4)(x+4)=0$ : $\boxed{S=\{-4\,;4\}}$

    **g)** $4x^{2}=100 \iff x^{2}=25$ : $\boxed{S=\{-5\,;5\}}$

    **h)** $(x-1)^{2}=9 \iff (x-1)^{2}-9=0 \iff (x-1-3)(x-1+3)=0 \iff (x-4)(x+2)=0$ : 
    $$\boxed{S=\{-2\,;4\}}$$

    *L'erreur la plus courante* consiste à ne donner qu'une seule solution à $x^{2}=25$. Il y en a bien deux, $5$ et $-5$, car $(-5)^{2}=25$ également. Les deux seuls cas où il n'y en a pas deux sont $x^{2}=0$ (une seule) et $x^{2}=k$ avec $k<0$ (aucune).
- id: "s-04-15"
  feuille: "f-s-04"
  numero: 15
  partie: "Équations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation du premier degré, équation produit, équation x² = a]
  noeuds: [ar-corps, z-anneau, c-racine-reelle]
  notions: [corps, anneau-integre]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Les équations suivantes ne sont pas de la forme « produit $=0$ ». Commencer par tout ramener dans le premier membre, factoriser, puis résoudre.

    **a)** $x^{2}=7x$

    **b)** $3x^{2}=12x$

    **c)** $x^{2}+3x=4x$

    **d)** $(x+1)(x-3)=(x+1)(2x+4)$

    **e)** $(2x-3)(x+1)=(2x-3)(4-x)$

    **f)** $x(x+4)=3(x+4)$

    **g)** $(x-6)^{2}=4(x-6)$

    **h)** $9x^{2}=4$

    **i)** $(x+5)^{2}=16$

    **j)** $5x(x-2)=5x$
  corrige: |
    **a)** $x^{2}=7x \iff x^{2}-7x=0 \iff x(x-7)=0$ : $\boxed{S=\{0\,;7\}}$

    *Piège majeur :* on est tenté de « diviser par $x$ » pour obtenir $x=7$. On perdrait alors la solution $0$, et l'on diviserait par un nombre peut-être nul.

    **b)** $3x^{2}=12x \iff 3x^{2}-12x=0 \iff 3x(x-4)=0$ : $\boxed{S=\{0\,;4\}}$

    **c)** $x^{2}+3x=4x \iff x^{2}-x=0 \iff x(x-1)=0$ : $\boxed{S=\{0\,;1\}}$

    **d)** $(x+1)(x-3)=(x+1)(2x+4) \iff (x+1)\big[(x-3)-(2x+4)\big]=0 \iff (x+1)(-x-7)=0$ : 
    $$\boxed{S=\{-7\,;-1\}}$$

    **e)** $(2x-3)(x+1)=(2x-3)(4-x) \iff (2x-3)\big[(x+1)-(4-x)\big]=0 \iff (2x-3)(2x-3)=0$ : 
    $$\boxed{S=\left\{\dfrac{3}{2}\right\}}$$
     Les deux facteurs étant identiques, il n'y a qu'une solution.

    **f)** $x(x+4)=3(x+4) \iff (x+4)(x-3)=0$ : $\boxed{S=\{-4\,;3\}}$

    **g)** $(x-6)^{2}=4(x-6) \iff (x-6)\big[(x-6)-4\big]=0 \iff (x-6)(x-10)=0$ : $\boxed{S=\{6\,;10\}}$

    **h)** $9x^{2}=4 \iff 9x^{2}-4=0 \iff (3x-2)(3x+2)=0$ : $\boxed{S=\left\{-\dfrac{2}{3}\,;\dfrac{2}{3}\right\}}$

    **i)** $(x+5)^{2}=16 \iff (x+5)^{2}-16=0 \iff (x+5-4)(x+5+4)=0 \iff (x+1)(x+9)=0$ : 
    $$\boxed{S=\{-9\,;-1\}}$$

    **j)** $5x(x-2)=5x \iff 5x\big[(x-2)-1\big]=0 \iff 5x(x-3)=0$ : $\boxed{S=\{0\,;3\}}$
- id: "s-04-16"
  feuille: "f-s-04"
  numero: 16
  partie: "Équations produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations, équation produit]
  noeuds: [ar-corps, z-anneau]
  notions: [corps, anneau-integre]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Dans chaque cas, le facteur commun n'apparaît qu'après une première transformation. Factoriser, puis résoudre.

    **a)** $(x-4)(2x+1)+(x-4)^{2}=0$

    **b)** $(3x+2)(x-5)-(x-5)(x+1)=0$

    **c)** $(x+3)^{2}-(x+3)(2x-1)=0$

    **d)** $4(x-1)+(x-1)(x+6)=0$

    **e)** $(2x+5)(x-3)+(2x+5)=0$

    **f)** $x^{2}-9+(x-3)(x+1)=0$

    **g)** $4x^{2}-1+(2x-1)(x+4)=0$

    **h)** $25-x^{2}+(5+x)(2x-1)=0$
  corrige: |
    **a)** $(x-4)(2x+1)+(x-4)^{2}=0 \iff (x-4)\big[(2x+1)+(x-4)\big]=0 \iff (x-4)(3x-3)=0$ : 
    $$\boxed{S=\{1\,;4\}}$$

    **b)** $(3x+2)(x-5)-(x-5)(x+1)=0 \iff (x-5)\big[(3x+2)-(x+1)\big]=0 \iff (x-5)(2x+1)=0$ : 
    $$\boxed{S=\left\{-\dfrac{1}{2}\,;5\right\}}$$

    **c)** $(x+3)^{2}-(x+3)(2x-1)=0 \iff (x+3)\big[(x+3)-(2x-1)\big]=0 \iff (x+3)(-x+4)=0$ : 
    $$\boxed{S=\{-3\,;4\}}$$

    **d)** $4(x-1)+(x-1)(x+6)=0 \iff (x-1)\big[4+(x+6)\big]=0 \iff (x-1)(x+10)=0$ : 
    $$\boxed{S=\{-10\,;1\}}$$

    **e)** $(2x+5)(x-3)+(2x+5)=0 \iff (2x+5)\big[(x-3)+1\big]=0 \iff (2x+5)(x-2)=0$ : 
    $$\boxed{S=\left\{-\dfrac{5}{2}\,;2\right\}}$$

    **f)** $x^{2}-9+(x-3)(x+1)=0$. On factorise d'abord $x^{2}-9=(x-3)(x+3)$, ce qui fait apparaître le facteur commun $(x-3)$ : 
    $$(x-3)(x+3)+(x-3)(x+1)=0 \iff (x-3)\big[(x+3)+(x+1)\big]=0 \iff (x-3)(2x+4)=0$$

    $$\boxed{S=\{-2\,;3\}}$$

    **g)** $4x^{2}-1+(2x-1)(x+4)=0$. Ici $4x^{2}-1=(2x-1)(2x+1)$ : 
    $$(2x-1)\big[(2x+1)+(x+4)\big]=0 \iff (2x-1)(3x+5)=0 \qquad \boxed{S=\left\{-\dfrac{5}{3}\,;\dfrac{1}{2}\right\}}$$

    **h)** $25-x^{2}+(5+x)(2x-1)=0$. Ici $25-x^{2}=(5-x)(5+x)$ : 
    $$(5+x)\big[(5-x)+(2x-1)\big]=0 \iff (5+x)(x+4)=0 \qquad \boxed{S=\{-5\,;-4\}}$$

    *Ce qu'il faut retenir de cet exercice :* lorsqu'aucun facteur commun n'apparaît, on cherche s'il ne se cache pas dans une identité remarquable. C'est presque toujours le cas.
