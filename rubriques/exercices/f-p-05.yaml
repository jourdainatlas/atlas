  enonce: |
    Dans une ville, $30\,\%$ des habitants sont abonnés au réseau de transports en commun. Parmi les abonnés, $85\,\%$ utilisent le bus au moins une fois par semaine ; parmi les non-abonnés, cette proportion n'est que de $20\,\%$.

    On interroge un habitant au hasard. On note $A$ l'événement « l'habitant est abonné » et $U$ l'événement « l'habitant utilise le bus au moins une fois par semaine ».

    **1.** Construire un arbre pondéré décrivant la situation.

    **2.** Calculer la probabilité que l'habitant interrogé soit abonné et utilise le bus.

    **3.** Calculer $P(U)$.

    **4.** L'habitant interrogé utilise le bus au moins une fois par semaine. Quelle est la probabilité qu'il soit abonné ?

    **5.** L'habitant interrogé n'utilise pas le bus. Quelle est la probabilité qu'il soit tout de même abonné ?
  corrige: |
    **1.**

    ![Figure](documents/figures/e9d38307982745a2.svg)

    **2.** $P(A\cap U)=0{,}3\times 0{,}85=\boxed{0{,}255}$

    **3.** $P(U)=0{,}255+0{,}7\times 0{,}2=0{,}255+0{,}14=\boxed{0{,}395}$

    **4.** $P_{U}(A)=\dfrac{0{,}255}{0{,}395}=\boxed{\dfrac{51}{79}\approx 0{,}646}$

    **5.** $P(\overline{U})=1-0{,}395=0{,}605$ et $P(A\cap\overline{U})=0{,}3\times 0{,}15=0{,}045$, donc 
    $$P_{\overline{U}}(A)=\frac{0{,}045}{0{,}605}=\boxed{\frac{9}{121}\approx 0{,}074}$$
     *Interprétation :* parmi ceux qui n'utilisent pas le bus, moins de $8\,\%$ sont pourtant abonnés — un abonnement qu'ils n'utilisent guère.
- id: "p-05-16"
  feuille: "f-p-05"
  numero: 16
  partie: "Indépendance"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [probabilité conditionnelle, probabilités totales, tableau à double entrée, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    Voici la répartition de $200$ personnes selon deux caractères.

    ```tableau
     ¦ $B$ ¦ $\overline{B}$ ¦ *Total*
    $A$ ¦ $20$ ¦ $60$ ¦ $80$
    $\overline{A}$ ¦ $30$ ¦ $90$ ¦ $120$
    *Total* ¦ $50$ ¦ $150$ ¦ $200$
    ```

    **1.** Calculer $P(A)$, $P(B)$ et $P(A\cap B)$.

    **2.** Les événements $A$ et $B$ sont-ils indépendants ? Justifier par un calcul.

    **3.** Vérifier votre réponse en comparant cette fois $P_{A}(B)$ et $P(B)$.

    **4.** On remplace maintenant l'effectif $20$ par $25$, en ajustant les autres cases pour que les totaux des lignes et des colonnes soient inchangés. Recopier le nouveau tableau, puis dire si $A$ et $B$ sont encore indépendants.
  corrige: |
    **1.** $P(A)=\dfrac{80}{200}=\boxed{0{,}4}$ $P(B)=\dfrac{50}{200}=\boxed{0{,}25}$ $P(A\cap B)=\dfrac{20}{200}=\boxed{0{,}1}$

    **2.** $P(A)\times P(B)=0{,}4\times 0{,}25=0{,}1=P(A\cap B)$ : 
    $$\boxed{\text{les événements } A \text{ et } B \text{ sont indépendants.}}$$

    **3.** $P_{A}(B)=\dfrac{20}{80}=0{,}25=P(B)$ : on retrouve bien la même conclusion.

    *Autrement dit :* la proportion de $B$ est la même dans la ligne $A$ ($20$ sur $80$) que dans la population entière ($50$ sur $200$).

    **4.** En conservant les totaux, le nouveau tableau est :

    ```tableau
     ¦ $B$ ¦ $\overline{B}$ ¦ *Total*
    $A$ ¦ $25$ ¦ $55$ ¦ $80$
    $\overline{A}$ ¦ $25$ ¦ $95$ ¦ $120$
    *Total* ¦ $50$ ¦ $150$ ¦ $200$
    ```

    Cette fois $P(A\cap B)=\dfrac{25}{200}=0{,}125$, alors que $P(A)\times P(B)=0{,}1$ : 
    $$\boxed{\text{les événements ne sont plus indépendants.}}$$
     *Il a suffi de déplacer cinq personnes* pour rompre l'indépendance : celle-ci est une égalité exacte, et non une tendance.
- id: "p-05-17"
  feuille: "f-p-05"
  numero: 17
  partie: "Indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilité conditionnelle, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    Dans chaque cas, déterminer si les événements $A$ et $B$ sont indépendants.

    **1.** $P(A)=0{,}4$, $P(B)=0{,}5$ et $P(A\cap B)=0{,}2$.

    **2.** $P(A)=0{,}3$, $P(B)=0{,}6$ et $P(A\cap B)=0{,}2$.

    **3.** $P(A)=0{,}5$, $P(B)=0{,}3$ et $P_{A}(B)=0{,}3$.

    **4.** $P(A)=0{,}25$, $P(B)=0{,}8$ et $P(A\cup B)=0{,}85$.

    **5.** $P(A)=\dfrac{1}{4}$, $P(B)=\dfrac{2}{3}$ et $P(A\cap B)=\dfrac{1}{6}$.
  corrige: |
    **1.** $P(A)\times P(B)=0{,}4\times 0{,}5=0{,}2=P(A\cap B)$ : $\boxed{\text{indépendants}}$

    **2.** $P(A)\times P(B)=0{,}3\times 0{,}6=0{,}18\neq 0{,}2$ : $\boxed{\text{non indépendants}}$

    **3.** $P_{A}(B)=0{,}3=P(B)$ : $\boxed{\text{indépendants}}$

    **4.** On calcule d'abord l'intersection : 
    $$P(A\cap B)=P(A)+P(B)-P(A\cup B)=0{,}25+0{,}8-0{,}85=0{,}2$$
     et $P(A)\times P(B)=0{,}25\times 0{,}8=0{,}2$ : $\boxed{\text{indépendants}}$

    **5.** $P(A)\times P(B)=\dfrac{1}{4}\times\dfrac{2}{3}=\dfrac{1}{6}=P(A\cap B)$ : $\boxed{\text{indépendants}}$
- id: "p-05-18"
  feuille: "f-p-05"
  numero: 18
  partie: "Indépendance"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, indépendance, jeu et gain, urne]
  noeuds: [p-espace, p-independance, p-esperance]
  notions: [espace-probabilise, independance]
  page_enonce: 7
  page_corrige: 10
  enonce: |
    **1.** On donne $P(A)=0{,}4$ et $P(A\cap B)=0{,}1$. Déterminer la valeur de $P(B)$ pour laquelle les événements $A$ et $B$ sont indépendants.

    **2.** On donne $P(B)=0{,}6$ et $P(A\cap B)=0{,}18$. Déterminer $P(A)$ pour que $A$ et $B$ soient indépendants.

    **3.** Une urne contient $4$ boules rouges et $n$ boules vertes. On tire une boule au hasard. Un second tirage, indépendant du premier, est ensuite effectué après remise. Déterminer $n$ pour que la probabilité d'obtenir deux boules rouges soit égale à $\dfrac{1}{9}$.
  corrige: |
    **1.** L'indépendance s'écrit $P(A)\times P(B)=P(A\cap B)$, soit 
    $$0{,}4\times P(B)=0{,}1 \iff \boxed{P(B)=0{,}25}$$

    **2.** De même $P(A)\times 0{,}6=0{,}18$, d'où $\boxed{P(A)=0{,}3}$.

    **3.** L'urne contient $4+n$ boules, dont $4$ rouges. La probabilité de tirer une rouge vaut $\dfrac{4}{4+n}$. Les deux tirages étant indépendants, la probabilité d'obtenir deux rouges est le produit des deux probabilités : 
    $$\left(\frac{4}{4+n}\right)^{2}=\frac{1}{9}$$
     Les deux membres étant positifs, on peut passer à la racine : 
    $$\frac{4}{4+n}=\frac{1}{3} \iff 12=4+n \iff \boxed{n=8}$$
     *Vérification :* l'urne contient alors $12$ boules dont $4$ rouges, soit une probabilité de $\frac{1}{3}$, et $\left(\frac{1}{3}\right)^{2}=\frac{1}{9}$.
- id: "p-05-19"
  feuille: "f-p-05"
  numero: 19
  partie: "Indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [probabilités, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 7
  page_corrige: 10
  enonce: |
    Soient $A$ et $B$ deux événements **indépendants**, de probabilités non nulles.

    **1.** Justifier que $P(A\cap\overline{B})=P(A)-P(A\cap B)$.

    **2.** En déduire que $P(A\cap\overline{B})=P(A)\times P(\overline{B})$, puis conclure.

    **3.** **Application.** On donne $P(A)=0{,}3$ et $P(B)=0{,}6$, les deux événements étant indépendants. Calculer $P(A\cap B)$, $P(A\cap\overline{B})$, $P(\overline{A}\cap B)$ et $P(\overline{A}\cap\overline{B})$, puis vérifier que la somme vaut $1$.

    **4.** Calculer enfin $P(A\cup B)$.
  corrige: |
    **1.** Les événements $A\cap B$ et $A\cap\overline{B}$ sont incompatibles, et leur réunion est $A$ tout entier. Donc $P(A)=P(A\cap B)+P(A\cap\overline{B})$, d'où 
    $$\boxed{P(A\cap\overline{B})=P(A)-P(A\cap B)}$$

    **2.** Comme $A$ et $B$ sont indépendants, $P(A\cap B)=P(A)\times P(B)$, donc 
    $$P(A\cap\overline{B})=P(A)-P(A)\times P(B)=P(A)\big(1-P(B)\big)=P(A)\times P(\overline{B})$$

    $$\boxed{\text{Les événements } A \text{ et } \overline{B} \text{ sont donc indépendants eux aussi.}}$$
     *En appliquant deux fois ce résultat*, on obtient également l'indépendance de $\overline{A}$ et $B$, puis celle de $\overline{A}$ et $\overline{B}$.

    **3.** Avec $P(A)=0{,}3$ et $P(B)=0{,}6$ : 
    $$P(A\cap B)=0{,}3\times 0{,}6=\boxed{0{,}18} \qquad P(A\cap\overline{B})=0{,}3\times 0{,}4=\boxed{0{,}12}$$

    $$P(\overline{A}\cap B)=0{,}7\times 0{,}6=\boxed{0{,}42} \qquad P(\overline{A}\cap\overline{B})=0{,}7\times 0{,}4=\boxed{0{,}28}$$
     et la somme vaut $0{,}18+0{,}12+0{,}42+0{,}28=1$.

    **4.** $P(A\cup B)=P(A)+P(B)-P(A\cap B)=0{,}3+0{,}6-0{,}18=\boxed{0{,}72}$
- id: "p-05-20"
  feuille: "f-p-05"
  numero: 20
  partie: "Variable aléatoire et loi de probabilité"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités, tableau à double entrée, variable aléatoire, loi de probabilité, jeu et gain, urne]
  noeuds: [p-espace, p-variables, p-esperance]
  notions: [espace-probabilise, variable-aleatoire, loi-variable]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Dans chacune des situations suivantes, déterminer la loi de probabilité de la variable aléatoire $X$, que l'on présentera dans un tableau. On vérifiera à chaque fois que la somme des probabilités vaut $1$.

    **1.** On lance un dé équilibré à six faces et $X$ désigne le numéro obtenu.

    **2.** On lance un dé équilibré à six faces. Le joueur gagne $3$ € s'il obtient un $6$, gagne $1$ € s'il obtient $2$ ou $4$, et perd $1$ € sinon. $X$ désigne le gain algébrique du joueur.

    **3.** On lance deux fois une pièce équilibrée et $X$ désigne le nombre de « Face » obtenus.

    **4.** Une urne contient $3$ boules rouges, $2$ boules vertes et $1$ boule bleue. On tire une boule au hasard. Le joueur gagne $2$ € pour une rouge, $5$ € pour une verte et $10$ € pour la bleue. $X$ désigne le gain.
  corrige: |
    **1.** Le dé étant équilibré, chacune des six faces a la même probabilité $\dfrac{1}{6}$ :

    $$\begin{array}{|c|c|c|c|c|c|c|} \hline x_{i} & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline P(X=x_{i}) & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} & \frac{1}{6} \\ \hline \end{array}$$

    La somme vaut $6\times\dfrac{1}{6}=1$.

    **2.** Le gain vaut $3$ pour une seule face, $1$ pour deux faces ($2$ et $4$), et $-1$ pour les trois autres ($1$, $3$ et $5$) :

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & -1 & 1 & 3 \\ \hline P(X=x_{i}) & \frac{1}{2} & \frac{1}{3} & \frac{1}{6} \\ \hline \end{array}$$

    La somme vaut $\dfrac{3}{6}+\dfrac{2}{6}+\dfrac{1}{6}=1$.

    **3.** Les quatre issues $PP$, $PF$, $FP$, $FF$ sont équiprobables, de probabilité $\dfrac{1}{4}$, et $X$ vaut respectivement $0$, $1$, $1$ et $2$ :

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & 0 & 1 & 2 \\ \hline P(X=x_{i}) & \frac{1}{4} & \frac{1}{2} & \frac{1}{4} \\ \hline \end{array}$$

    **4.** L'urne contient $6$ boules : $3$ rouges, $2$ vertes et $1$ bleue.

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & 2 & 5 & 10 \\ \hline P(X=x_{i}) & \frac{1}{2} & \frac{1}{3} & \frac{1}{6} \\ \hline \end{array}$$

    *On remarque que* cette loi et celle de la question 2 portent les mêmes probabilités : seules les valeurs changent.
- id: "p-05-21"
  feuille: "f-p-05"
  numero: 21
  partie: "Variable aléatoire et loi de probabilité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, arbre pondéré, tableau à double entrée, loi de probabilité, jeu et gain]
  noeuds: [p-espace, p-variables, p-esperance]
  notions: [espace-probabilise, loi-variable]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Un jeu consiste à lancer deux fois de suite une pièce équilibrée. Le joueur gagne $4$ € pour chaque « Face » obtenue et perd $2$ € pour chaque « Pile ». On note $X$ le gain algébrique du joueur à l'issue des deux lancers.

    **1.** Construire un arbre décrivant les quatre issues possibles, en indiquant le gain associé à chacune.

    **2.** Quelles sont les valeurs prises par $X$ ?

    **3.** Déterminer la loi de probabilité de $X$ et la présenter dans un tableau.

    **4.** Calculer $P(X\geqslant 2)$, puis $P(X<0)$.
  corrige: |
    **1.** Chaque lancer donne $F$ ou $P$ avec la probabilité $\dfrac{1}{2}$, et l'on inscrit au bout de chaque chemin le gain correspondant :

    ![Figure](documents/figures/8a5405c5d5621e44.svg)

    **2.** Deux « Face » rapportent $8$ €, une seule rapporte $4-2=2$ €, et deux « Pile » font perdre $4$ € : 
    $$\boxed{X \text{ prend les valeurs } -4,\ 2 \text{ et } 8.}$$

    **3.** Un seul chemin mène à $8$, un seul à $-4$, mais deux mènent à $2$ :

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & -4 & 2 & 8 \\ \hline P(X=x_{i}) & \frac{1}{4} & \frac{1}{2} & \frac{1}{4} \\ \hline \end{array}$$

    **4.** $P(X\geqslant 2)=P(X=2)+P(X=8)=\dfrac{1}{2}+\dfrac{1}{4}=\boxed{\dfrac{3}{4}}$

    $P(X<0)=P(X=-4)=\boxed{\dfrac{1}{4}}$
- id: "p-05-22"
  feuille: "f-p-05"
  numero: 22
  partie: "Variable aléatoire et loi de probabilité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, variable aléatoire, loi de probabilité]
  noeuds: [p-espace, p-variables]
  notions: [espace-probabilise, variable-aleatoire, loi-variable]
  page_enonce: 8
  page_corrige: 12
  enonce: |
    Voici la loi de probabilité, incomplète, d'une variable aléatoire $X$.

    $$\begin{array}{|c|c|c|c|c|} \hline x_{i} & -2 & 0 & 1 & 4 \\ \hline P(X=x_{i}) & 0{,}15 & a & 0{,}3 & 0{,}25 \\ \hline \end{array}$$

    **1.** Déterminer la valeur du réel $a$. Quelle propriété permet de conclure ?

    **2.** Calculer $P(X\leqslant 0)$ et $P(X>0)$.

    **3.** Une autre variable aléatoire $Y$ prend les valeurs $-1$, $2$ et $x$ avec les probabilités respectives $0{,}5$, $0{,}3$ et $0{,}2$. Déterminer $x$ pour que l'on ait $E[Y]=1$.
  corrige: |
    **1.** La somme des probabilités d'une loi vaut $1$ : 
    $$0{,}15+a+0{,}3+0{,}25=1 \iff a+0{,}7=1 \iff \boxed{a=0{,}3}$$

    **2.** $P(X\leqslant 0)=P(X=-2)+P(X=0)=0{,}15+0{,}3=\boxed{0{,}45}$

    $P(X>0)=P(X=1)+P(X=4)=0{,}3+0{,}25=\boxed{0{,}55}$, ce qui vérifie bien $0{,}45+0{,}55=1$.

    **3.** On écrit l'espérance de $Y$ en fonction de $x$ : 
    $$E[Y]=(-1)\times 0{,}5+2\times 0{,}3+x\times 0{,}2=-0{,}5+0{,}6+0{,}2x=0{,}1+0{,}2x$$
     La condition $E[Y]=1$ donne : 
    $$0{,}1+0{,}2x=1 \iff 0{,}2x=0{,}9 \iff \boxed{x=4{,}5}$$
- id: "p-05-23"
  feuille: "f-p-05"
  numero: 23
  partie: "Variable aléatoire et loi de probabilité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, arbre pondéré, loi de probabilité, urne]
  noeuds: [p-espace, p-variables]
  notions: [espace-probabilise, loi-variable]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Une urne contient $5$ jetons numérotés $1$, $1$, $2$, $3$ et $3$. On tire un jeton au hasard, on note son numéro, on le remet dans l'urne, puis on en tire un second. On note $X$ la somme des deux numéros obtenus.

    **1.** Déterminer la loi de probabilité du numéro obtenu lors d'un tirage.

    **2.** Construire un arbre pondéré décrivant les deux tirages. *On pourra se limiter aux trois numéros possibles à chaque niveau.*

    **3.** Quelles sont les valeurs prises par $X$ ?

    **4.** Déterminer la loi de probabilité de $X$.

    **5.** Calculer $P(X=4)$ de deux façons différentes.
  corrige: |
    **1.** L'urne contient $5$ jetons : deux portent le $1$, un le $2$, deux le $3$.

    $$\begin{array}{|c|c|c|c|} \hline \text{Numéro} & 1 & 2 & 3 \\ \hline \text{Probabilité} & \frac{2}{5} & \frac{1}{5} & \frac{2}{5} \\ \hline \end{array}$$

    **2.** Le jeton étant remis, le second tirage suit exactement la même loi que le premier : les neuf chemins portent, au second niveau, les mêmes probabilités $\frac{2}{5}$, $\frac{1}{5}$ et $\frac{2}{5}$ qu'au premier.

    **3.** La somme de deux numéros compris entre $1$ et $3$ vaut au minimum $2$ et au maximum $6$ : 
    $$\boxed{X \text{ prend les valeurs } 2,\ 3,\ 4,\ 5 \text{ et } 6.}$$

    **4.** On additionne les probabilités des chemins conduisant à chaque valeur : 
    $$P(X=2)=\tfrac{2}{5}\times\tfrac{2}{5}=\tfrac{4}{25} \qquad P(X=3)=2\times\tfrac{2}{5}\times\tfrac{1}{5}=\tfrac{4}{25}$$

    $$P(X=4)=2\times\tfrac{2}{5}\times\tfrac{2}{5}+\tfrac{1}{5}\times\tfrac{1}{5} =\tfrac{8}{25}+\tfrac{1}{25}=\tfrac{9}{25}$$

    $$P(X=5)=2\times\tfrac{1}{5}\times\tfrac{2}{5}=\tfrac{4}{25} \qquad P(X=6)=\tfrac{2}{5}\times\tfrac{2}{5}=\tfrac{4}{25}$$

    $$\begin{array}{|c|c|c|c|c|c|} \hline x_{i} & 2 & 3 & 4 & 5 & 6 \\ \hline P(X=x_{i}) & \frac{4}{25} & \frac{4}{25} & \frac{9}{25} & \frac{4}{25} & \frac{4}{25} \\ \hline \end{array}$$

    La somme vaut $\dfrac{4+4+9+4+4}{25}=\dfrac{25}{25}=1$.

    **5.** **Première méthode :** en additionnant les chemins, comme ci-dessus, on trouve $\dfrac{9}{25}$.

    **Seconde méthode :** par événement contraire, $P(X=4)=1-\big(P(X=2)+P(X=3)+P(X=5) +P(X=6)\big)=1-\dfrac{16}{25}=\dfrac{9}{25}$. 
    $$\boxed{P(X=4)=\dfrac{9}{25}}$$
- id: "p-05-24"
  feuille: "f-p-05"
  numero: 24
  partie: "Espérance, variance et écart-type"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités, espérance, jeu et gain]
  noeuds: [p-espace, p-esperance]
  notions: [espace-probabilise, esperance]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    Pour chacune des lois de probabilité suivantes, calculer l'espérance $E[X]$.

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & 1 & 2 & 3 \\ \hline P(X=x_{i}) & 0{,}2 & 0{,}5 & 0{,}3 \\ \hline \end{array}$$

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & -5 & 0 & 10 \\ \hline P(X=x_{i}) & 0{,}4 & 0{,}35 & 0{,}25 \\ \hline \end{array}$$

    $$\begin{array}{|c|c|c|c|c|} \hline x_{i} & 0 & 1 & 2 & 3 \\ \hline P(X=x_{i}) & \frac{1}{8} & \frac{3}{8} & \frac{3}{8} & \frac{1}{8} \\ \hline \end{array}$$

    $$\begin{array}{|c|c|c|c|c|} \hline x_{i} & -3 & -1 & 2 & 6 \\ \hline P(X=x_{i}) & 0{,}1 & 0{,}4 & 0{,}3 & 0{,}2 \\ \hline \end{array}$$

    Interpréter le résultat obtenu pour la deuxième loi, en imaginant qu'il s'agit du gain d'un jeu.
  corrige: |
    *On applique $E[X]=p_{1}x_{1}+p_{2}x_{2}+\cdots+p_{n}x_{n}$ : on multiplie entre elles les deux valeurs de chaque colonne, puis on additionne le tout.*

    **1.** $E[X]=1\times 0{,}2+2\times 0{,}5+3\times 0{,}3=0{,}2+1+0{,}9=\boxed{2{,}1}$

    **2.** $E[X]=-5\times 0{,}4+0\times 0{,}35+10\times 0{,}25=-2+0+2{,}5=\boxed{0{,}5}$

    **3.** $E[X]=0\times\dfrac{1}{8}+1\times\dfrac{3}{8}+2\times\dfrac{3}{8}+3\times\dfrac{1}{8} =\dfrac{0+3+6+3}{8}=\dfrac{12}{8}=\boxed{1{,}5}$

    **4.** $E[X]=-3\times 0{,}1-1\times 0{,}4+2\times 0{,}3+6\times 0{,}2 =-0{,}3-0{,}4+0{,}6+1{,}2=\boxed{1{,}1}$

    **Interprétation de la deuxième loi.** Si $X$ représentait le gain d'un jeu, l'espérance $0{,}5$ signifierait qu'en répétant l'expérience un très grand nombre de fois, le joueur peut espérer gagner en moyenne $0{,}5$ € par partie. Le jeu serait donc favorable au joueur — et non à l'organisateur.
- id: "p-05-25"
  feuille: "f-p-05"
  numero: 25
  partie: "Espérance, variance et écart-type"
  etoiles: 2
  types: [Calcul]
  mots_cles: [tableau à double entrée, espérance, variance, écart-type]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    On reprend les quatre lois de l'exercice 24. Pour chacune d'elles :

    **1.** calculer $E[X^{2}]$ en ajoutant une ligne au tableau de la loi ;

    **2.** en déduire la variance $V(X)$ à l'aide de la formule de König-Huygens ;

    **3.** calculer l'écart-type $\sigma(X)$, arrondi au centième si nécessaire.

    Laquelle de ces quatre variables aléatoires est la plus « dispersée » autour de son espérance ?
  corrige: |
    *On ajoute une ligne $x_{i}^{2}$ au tableau, puis on applique $V(X)=E\left[X^{2}\right]-\left(E[X]\right)^{2}$.*

    **1.** $E\left[X^{2}\right]=1\times 0{,}2+4\times 0{,}5+9\times 0{,}3=0{,}2+2+2{,}7=4{,}9$ 
    $$V(X)=4{,}9-2{,}1^{2}=4{,}9-4{,}41=\boxed{0{,}49} \qquad\text{d'où}\qquad \sigma(X)=\sqrt{0{,}49}=\boxed{0{,}7}$$

    **2.** $E\left[X^{2}\right]=25\times 0{,}4+0+100\times 0{,}25=10+25=35$ 
    $$V(X)=35-0{,}5^{2}=\boxed{34{,}75} \qquad\text{d'où}\qquad \sigma(X)=\sqrt{34{,}75}\approx\boxed{5{,}89}$$

    **3.** $E\left[X^{2}\right]=0+1\times\dfrac{3}{8}+4\times\dfrac{3}{8}+9\times\dfrac{1}{8} =\dfrac{0+3+12+9}{8}=3$ 
    $$V(X)=3-1{,}5^{2}=3-2{,}25=\boxed{0{,}75} \qquad\text{d'où}\qquad \sigma(X)=\sqrt{0{,}75}\approx\boxed{0{,}87}$$

    **4.** $E\left[X^{2}\right]=9\times 0{,}1+1\times 0{,}4+4\times 0{,}3+36\times 0{,}2 =0{,}9+0{,}4+1{,}2+7{,}2=9{,}7$ 
    $$V(X)=9{,}7-1{,}1^{2}=9{,}7-1{,}21=\boxed{8{,}49} \qquad\text{d'où}\qquad \sigma(X)=\sqrt{8{,}49}\approx\boxed{2{,}91}$$

    $$\boxed{\text{La deuxième loi est de loin la plus dispersée : } \sigma\approx 5{,}89.}$$
     C'est cohérent avec ses valeurs, qui s'étalent de $-5$ à $10$, alors que la première ne prend que les valeurs $1$, $2$ et $3$.
- id: "p-05-26"
  feuille: "f-p-05"
  numero: 26
  partie: "Espérance, variance et écart-type"
  etoiles: 2
  types: [Calcul]
  mots_cles: [variable aléatoire, variance, écart-type]
  noeuds: [p-variables, p-esperance]
  notions: [variable-aleatoire]
  page_enonce: 9
  page_corrige: 14
  enonce: |
    Soit $X$ la variable aléatoire de loi :

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & -2 & 1 & 3 \\ \hline P(X=x_{i}) & 0{,}3 & 0{,}5 & 0{,}2 \\ \hline \end{array}$$

    **1.** Calculer $E[X]$.

    **2.** Calculer $V(X)$ en utilisant la **définition**, c'est-à-dire en calculant les écarts $x_{i}-E[X]$, en les élevant au carré, puis en les pondérant.

    **3.** Calculer $V(X)$ en utilisant cette fois la **formule de König-Huygens**.

    **4.** Comparer les deux méthodes en termes de rapidité et de risque d'erreur.

    **5.** En déduire $\sigma(X)$, arrondi au centième.
  corrige: |
    **1.** $E[X]=-2\times 0{,}3+1\times 0{,}5+3\times 0{,}2=-0{,}6+0{,}5+0{,}6=\boxed{0{,}5}$

    **2.** **Par la définition.** On calcule d'abord les écarts $x_{i}-E[X]$, puis leurs carrés : 
    $$-2-0{,}5=-2{,}5 \qquad 1-0{,}5=0{,}5 \qquad 3-0{,}5=2{,}5$$

    $$V(X)=0{,}3\times(-2{,}5)^{2}+0{,}5\times 0{,}5^{2}+0{,}2\times 2{,}5^{2}$$

    $$=0{,}3\times 6{,}25+0{,}5\times 0{,}25+0{,}2\times 6{,}25=1{,}875+0{,}125+1{,}25=\boxed{3{,}25}$$

    **3.** **Par König-Huygens.** 
    $$E\left[X^{2}\right]=4\times 0{,}3+1\times 0{,}5+9\times 0{,}2=1{,}2+0{,}5+1{,}8=3{,}5$$

    $$V(X)=E\left[X^{2}\right]-\left(E[X]\right)^{2}=3{,}5-0{,}5^{2}=3{,}5-0{,}25=\boxed{3{,}25}$$
     Les deux méthodes donnent bien le même résultat.

    **4.** La seconde méthode ne demande qu'une ligne supplémentaire au tableau, celle des $x_{i}^{2}$, alors que la première impose de soustraire l'espérance à chaque valeur puis d'élever au carré — soit trois soustractions et trois carrés de nombres décimaux. 
    $$\boxed{\text{König-Huygens est plus rapide et moins propice aux erreurs de signe.}}$$

    **5.** $\sigma(X)=\sqrt{3{,}25}\approx\boxed{1{,}80}$
- id: "p-05-27"
  feuille: "f-p-05"
  numero: 27
  partie: "Espérance, variance et écart-type"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, variable aléatoire, loi de probabilité, espérance, variance, jeu et gain]
  noeuds: [p-espace, p-variables, p-esperance]
  notions: [espace-probabilise, variable-aleatoire, loi-variable, esperance]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Soit $X$ une variable aléatoire telle que $E[X]=4$ et $V(X)=9$.

    **1.** Calculer, sans reconstruire aucune loi de probabilité :

    **a)** $E[3X]$

    **b)** $E[X+5]$

    **c)** $E[2X-1]$

    **d)** $E[-X]$

    **e)** $E[0{,}5X+3]$

    **f)** $E[10-2X]$

    **2.** Quelle propriété du cours a-t-on utilisée ? Pourquoi fait-elle gagner beaucoup de temps ?

    **3.** Un jeu de gain $X$ a pour espérance $E[X]=1{,}5$ €. L'organisateur décide de doubler tous les gains puis de prélever un droit d'entrée de $2$ €. On note $Y$ le nouveau gain. Exprimer $Y$ en fonction de $X$, puis calculer $E[Y]$.

    **4.** Quel droit d'entrée l'organisateur devrait-il prélever, après avoir doublé les gains, pour que le jeu soit **équitable**, c'est-à-dire d'espérance nulle ?

    **5.** Un élève affirme que $E[X^{2}]=\left(E[X]\right)^{2}=16$. Expliquer pourquoi c'est faux, et calculer la valeur exacte de $E[X^{2}]$.
  corrige: |
    **1.** On applique $E[aX+b]=a\,E[X]+b$ avec $E[X]=4$ :

    **a)** $E[3X]=3\times 4=\boxed{12}$

    **b)** $E[X+5]=4+5=\boxed{9}$

    **c)** $E[2X-1]=8-1=\boxed{7}$

    **d)** $E[-X]=-4=\boxed{-4}$

    **e)** $E[0{,}5X+3]=2+3=\boxed{5}$

    **f)** $E[10-2X]=10-8=\boxed{2}$

    **2.** C'est la **linéarité de l'espérance**, démontrée dans le cours. Elle évite de reconstruire entièrement le tableau de la loi de $aX+b$ : les valeurs changent, mais les probabilités restent les mêmes, ce qui permet de factoriser.

    **3.** Doubler les gains puis prélever $2$ € conduit à $\boxed{Y=2X-2}$, d'où 
    $$E[Y]=2\times E[X]-2=2\times 1{,}5-2=\boxed{1}$$
     Le joueur peut espérer gagner en moyenne $1$ € par partie.

    **4.** Avec un droit d'entrée $d$, le gain est $Y=2X-d$ et 
    $$E[Y]=2\times 1{,}5-d=3-d$$
     Le jeu est équitable lorsque $E[Y]=0$, soit $\boxed{d=3~\text{€}}$.

    **5.** C'est faux : la formule de König-Huygens montre précisément que ces deux nombres diffèrent, et que leur écart est la variance : 
    $$V(X)=E\left[X^{2}\right]-\left(E[X]\right)^{2} \iff E\left[X^{2}\right]=V(X)+\left(E[X]\right)^{2}$$

    $$\boxed{E\left[X^{2}\right]=9+16=25}$$
     L'égalité $E\left[X^{2}\right]=\left(E[X]\right)^{2}$ ne vaudrait que si $V(X)=0$, c'est-à-dire si $X$ ne prenait qu'une seule valeur.
- id: "p-05-28"
  feuille: "f-p-05"
  numero: 28
  partie: "Espérance, variance et écart-type"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, loi de probabilité, variance, écart-type, jeu et gain]
  noeuds: [p-espace, p-variables, p-esperance]
  notions: [espace-probabilise, loi-variable]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    Un jeu de fête foraine se déroule ainsi : le joueur lance un dé équilibré à six faces. S'il obtient un $6$, il gagne $10$ € ; s'il obtient un $5$, il gagne $4$ € ; dans tous les autres cas, il perd $2$ €. On note $X$ le gain algébrique du joueur avant paiement de la mise.

    **1.** Déterminer la loi de probabilité de $X$.

    **2.** Calculer $E[X]$ et interpréter ce résultat par une phrase.

    **3.** Calculer $V(X)$ puis $\sigma(X)$, arrondi au centième.

    **4.** Le joueur doit verser une mise de $m$ euros pour participer. On note $Y=X-m$ son gain net. Exprimer $E[Y]$ en fonction de $m$.

    **5.** Déterminer la mise $m$ pour que le jeu soit équitable.

    **6.** L'organisateur fixe finalement la mise à $2$ €. Quel bénéfice moyen par partie peut-il espérer réaliser sur un grand nombre de parties ?
  corrige: |
    **1.** Une seule face donne $10$, une seule donne $4$, et les quatre autres font perdre $2$ :

    $$\begin{array}{|c|c|c|c|} \hline x_{i} & -2 & 4 & 10 \\ \hline P(X=x_{i}) & \frac{2}{3} & \frac{1}{6} & \frac{1}{6} \\ \hline \end{array}$$

    **2.** $E[X]=-2\times\dfrac{4}{6}+4\times\dfrac{1}{6}+10\times\dfrac{1}{6} =\dfrac{-8+4+10}{6}=\dfrac{6}{6}=\boxed{1}$ 
    $$\boxed{\text{Avant paiement de la mise, le joueur gagne en moyenne } 1~\text{€ par partie.}}$$

    **3.** $E\left[X^{2}\right]=4\times\dfrac{4}{6}+16\times\dfrac{1}{6}+100\times\dfrac{1}{6} =\dfrac{16+16+100}{6}=\dfrac{132}{6}=22$ 
    $$V(X)=22-1^{2}=\boxed{21} \qquad\text{d'où}\qquad \sigma(X)=\sqrt{21}\approx\boxed{4{,}58}$$
     *L'écart-type est bien plus grand que l'espérance :* les gains sont très dispersés, le jeu est risqué à court terme.

    **4.** Par linéarité, $E[Y]=E[X-m]=E[X]-m$, soit 
    $$\boxed{E[Y]=1-m}$$

    **5.** Le jeu est équitable lorsque $E[Y]=0$, c'est-à-dire $\boxed{m=1~\text{€}}$.

    **6.** Avec $m=2$, on obtient $E[Y]=1-2=-1$ : le joueur perd en moyenne $1$ € par partie. 
    $$\boxed{\text{L'organisateur peut espérer gagner } 1~\text{€ par partie.}}$$
- id: "p-05-29"
  feuille: "f-p-05"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré, probabilités totales, tableau à double entrée, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 10
  page_corrige: 16
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. Si $P(A)=0{,}5$ et $P(A\cap B)=0{,}2$, alors $P_{A}(B)$ vaut ¦ $0{,}1$ ¦ $0{,}4$ ¦ $2{,}5$
    2. Si $P(A)=0{,}4$ et $P_{A}(B)=0{,}3$, alors $P(A\cap B)$ vaut ¦ $0{,}12$ ¦ $0{,}7$ ¦ $0{,}75$
    3. Sur un arbre pondéré, la somme des probabilités portées par les branches issues d'un même nœud vaut ¦ $0$ ¦ $1$ ¦ $P(A)$
    4. Si $A$ et $B$ sont indépendants avec $P(A)=0{,}3$ et $P(B)=0{,}5$, alors $P(A\cap B)$ vaut ¦ $0{,}8$ ¦ $0{,}15$ ¦ $0{,}2$
    5. La formule des probabilités totales s'écrit $P(B)=$ ¦ $P(A)+P(\overline{A})$ ¦ $P(A\cap B)+P(\overline{A}\cap B)$ ¦ $P_{A}(B)+P_{\overline{A}}(B)$
    6. Si $P_{A}(B)=0{,}7$, alors $P_{A}(\overline{B})$ vaut ¦ $0{,}3$ ¦ $0{,}7$ ¦ on ne peut pas savoir
    7. Si $P(A)=0{,}6$, $P(B)=0{,}2$ et $P(A\cap B)=0{,}12$, alors $A$ et $B$ sont ¦ indépendants ¦ incompatibles ¦ ni l'un ni l'autre
    8. Deux événements incompatibles de probabilités non nulles sont ¦ toujours indépendants ¦ jamais indépendants ¦ parfois indépendants
    9. Si $P(X=0)=0{,}4$ et $P(X=2)=0{,}6$, alors $E[X]$ vaut ¦ $1$ ¦ $1{,}2$ ¦ $2$
    10. Si $E[X]=3$, alors $E[2X+1]$ vaut ¦ $6$ ¦ $7$ ¦ $4$
    ```
  corrige: |
    **1.** **Réponse B.** $P_{A}(B)=\dfrac{0{,}2}{0{,}5}=0{,}4$. La réponse A multiplie au lieu de diviser, la réponse C inverse le quotient.

    **2.** **Réponse A.** $P(A\cap B)=P(A)\times P_{A}(B)=0{,}4\times 0{,}3=0{,}12$.

    **3.** **Réponse B.** C'est la loi des nœuds : depuis un nœud, l'une des branches est nécessairement empruntée.

    **4.** **Réponse B.** L'indépendance donne $P(A\cap B)=P(A)\times P(B)=0{,}3\times 0{,}5 =0{,}15$. La réponse C confondrait avec la réunion.

    **5.** **Réponse B.** $B$ se décompose selon que $A$ est réalisé ou non, et ces deux morceaux sont incompatibles. La réponse C additionne des probabilités conditionnelles, ce qui n'a pas de sens ici.

    **6.** **Réponse A.** Les branches $B$ et $\overline{B}$ partent du même nœud, donc $P_{A}(\overline{B})=1-0{,}7=0{,}3$.

    **7.** **Réponse A.** $P(A)\times P(B)=0{,}6\times 0{,}2=0{,}12=P(A\cap B)$. Ils ne sont pas incompatibles, puisque $P(A\cap B)\neq 0$.

    **8.** **Réponse B.** Si $A$ et $B$ sont incompatibles, $P(A\cap B)=0$, alors que $P(A)\times P(B)>0$ : l'égalité ne peut jamais être vérifiée.

    **9.** **Réponse B.** $E[X]=0\times 0{,}4+2\times 0{,}6=1{,}2$.

    **10.** **Réponse B.** $E[2X+1]=2\times 3+1=7$, par linéarité de l'espérance.
- id: "p-05-30"
  feuille: "f-p-05"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré, tableau à double entrée, indépendance, variable aléatoire, loi de probabilité, espérance]
  noeuds: [p-espace, p-independance, p-variables, p-esperance]
  notions: [espace-probabilise, independance, variable-aleatoire, loi-variable, esperance]
  page_enonce: 11
  page_corrige: 16
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Pour tous événements $A$ et $B$ de probabilités non nulles, $P_{A}(B)=P_{B}(A)$.

    **2.** Sur un arbre pondéré, le produit des probabilités portées par un chemin donne la probabilité de l'intersection des événements de ce chemin.

    **3.** Si $A$ et $B$ sont indépendants, alors $P(A\cap B)=P(A)+P(B)$.

    **4.** Si $A$ et $B$ sont incompatibles, alors $P(A\cap B)=0$.

    **5.** Pour tout événement $A$ de probabilité non nulle, $P_{A}(B)+P_{A}(\overline{B})=1$.

    **6.** Pour tous événements $A$ et $B$, $P_{A}(B)+P_{\overline{A}}(B)=1$.

    **7.** Si $P_{A}(B)=P(B)$, alors $A$ et $B$ sont indépendants.

    **8.** Si $A$ et $B$ sont indépendants, alors $\overline{A}$ et $\overline{B}$ le sont également.

    **9.** La somme des probabilités figurant dans le tableau d'une loi de probabilité vaut $1$.

    **10.** Pour toute variable aléatoire $X$, on a $E\left[X^{2}\right]=\left(E[X]\right)^{2}$.

    **11.** Une espérance nulle signifie que le joueur ne peut rien gagner.
  corrige: |
    **1.** **Fausse**. *Contre-exemple :* à l'exercice 1, $P_{C}(F)=0{,}4$ alors que $P_{F}(C)=\frac{4}{15}\approx 0{,}267$. Les deux quotients n'ont pas le même dénominateur.

    **2.** **Vraie**. C'est la seconde règle des arbres pondérés.

    **3.** **Fausse**. L'indépendance donne $P(A\cap B)=P(A)\times P(B)$ — un **produit**, non une somme. *Contre-exemple :* avec $P(A)=P(B)=0{,}5$ indépendants, $P(A\cap B)=0{,}25$ et non $1$.

    **4.** **Vraie**. Deux événements incompatibles ne peuvent pas se réaliser en même temps : leur intersection est vide.

    **5.** **Vraie**. Les événements $B$ et $\overline{B}$ partagent l'univers en deux, et cela reste vrai « sachant $A$ ». C'est la loi des nœuds.

    **6.** **Fausse**. Ces deux nombres portent sur des univers de référence différents et n'ont aucune raison de s'additionner à $1$. *Contre-exemple :* à l'exercice 9, $P_{A}(B)=0{,}8$ et $P_{\overline{A}}(B)=0{,}25$, dont la somme vaut $1{,}05$.

    **7.** **Vraie**. C'est la caractérisation de l'indépendance donnée par le cours : savoir que $A$ est réalisé ne change rien à la probabilité de $B$.

    **8.** **Vraie**. C'est le résultat démontré à l'exercice 19, appliqué deux fois.

    **9.** **Vraie**. C'est la définition même d'une loi de probabilité : l'une des valeurs est nécessairement prise.

    **10.** **Fausse**. Ces deux nombres diffèrent de la variance, d'après König-Huygens. *Contre-exemple :* à l'exercice 27, $E\left[X^{2}\right]=25$ alors que $\left(E[X]\right)^{2}=16$.

    **11.** **Fausse**. Une espérance nulle signifie que les gains et les pertes se compensent *en moyenne* sur un grand nombre de parties. *Contre-exemple :* un jeu où l'on gagne $10$ € avec probabilité $\frac{1}{2}$ et où l'on en perd $10$ avec probabilité $\frac{1}{2}$ a une espérance nulle, et le joueur peut pourtant gagner.
- id: "p-05-31"
  feuille: "f-p-05"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, arbre pondéré, test de dépistage]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 11
  page_corrige: 17
  enonce: |
    Une maladie touche $2\,\%$ de la population. On dispose d'un test de dépistage dont les performances sont les suivantes :

    • si une personne est malade, le test est positif dans $95\,\%$ des cas ;

    • si une personne n'est pas malade, le test est négatif dans $97\,\%$ des cas.

    On choisit une personne au hasard dans la population. On note $M$ l'événement « la personne est malade » et $T$ l'événement « le test est positif ».

    **1.** Traduire les données de l'énoncé, puis construire un arbre pondéré.

    **2.** Calculer $P(M\cap T)$ et $P(\overline{M}\cap T)$.

    **3.** En déduire $P(T)$.

    **4.** Une personne a un test positif. Calculer la probabilité qu'elle soit réellement malade. On donnera une valeur approchée au millième.

    **5.** Commenter ce résultat : il est bien inférieur à $95\,\%$. Expliquer, à l'aide de la question 2, d'où vient ce phénomène.

    **6.** Une personne a un test négatif. Calculer la probabilité qu'elle ne soit effectivement pas malade.
  corrige: |
    **1.** Les données se traduisent par $P(M)=0{,}02$, $P_{M}(T)=0{,}95$ et $P_{\overline{M}}(\overline{T})=0{,}97$, d'où $P_{\overline{M}}(T)=1-0{,}97=0{,}03$.

    ![Figure](documents/figures/db1881e36a3631d0.svg)

    **2.** $P(M\cap T)=0{,}02\times 0{,}95=\boxed{0{,}019}$ et $P(\overline{M}\cap T)=0{,}98\times 0{,}03=\boxed{0{,}0294}$

    **3.** $P(T)=0{,}019+0{,}0294=\boxed{0{,}0484}$

    **4.** $P_{T}(M)=\dfrac{0{,}019}{0{,}0484}=\boxed{\dfrac{95}{242}\approx 0{,}393}$

    **5.** Le test est pourtant fiable à $95\,\%$ pour les malades. Mais la question 2 montre que les **faux positifs sont plus nombreux que les vrais positifs** : $0{,}0294$ contre $0{,}019$. 
    $$\boxed{\begin{array}{l} \text{La maladie est rare } (2\,\%),\text{ donc les } 3\,\% \text{ d'erreurs commises sur les } 98\,\% \\[1mm] \text{de bien portants représentent davantage de cas que les vrais malades détectés.} \end{array}}$$
     Un test positif doit donc toujours être confirmé par un second examen.

    **6.** $P(\overline{T})=1-0{,}0484=0{,}9516$ et $P(\overline{M}\cap\overline{T})=0{,}98\times 0{,}97=0{,}9506$, donc 
    $$P_{\overline{T}}(\overline{M})=\frac{0{,}9506}{0{,}9516}\approx\boxed{0{,}999}$$
     *Un test négatif est en revanche très fiable :* c'est la situation inverse de la précédente.
- id: "p-05-32"
  feuille: "f-p-05"
  numero: 32
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré, indépendance, loi de probabilité, variance, écart-type, jeu et gain]
