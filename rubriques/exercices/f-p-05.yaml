  enonce: |
    Une librairie a enregistré $500$ achats. Le tableau ci-dessous, incomplet, croise le type d'ouvrage acheté et le moyen de paiement.

    ```tableau
     ¦ *Roman* ¦ *Autre* ¦ *Total*
    *Paiement par carte* ¦  ¦ $210$ ¦ 
    *Paiement en espèces* ¦ $60$ ¦  ¦ $140$
    *Total* ¦ $210$ ¦  ¦ $500$
    ```

    **1.** Recopier et compléter le tableau.

    **2.** On choisit un achat au hasard. On note $R$ l'événement « l'ouvrage acheté est un roman » et $C$ l'événement « le paiement a été fait par carte ». Calculer $P(R)$, $P(C)$ et $P(R\cap C)$.

    **3.** Calculer $P_{C}(R)$ puis $P_{R}(C)$.

    **4.** Un client vient de payer par carte. Est-il plus probable qu'il ait acheté un roman ou un autre ouvrage ?
  corrige: |
    **1.** On complète en utilisant les totaux, ligne par ligne et colonne par colonne.

    ```tableau
     ¦ *Roman* ¦ *Autre* ¦ *Total*
    *Paiement par carte* ¦ $\mathbf{150}$ ¦ $210$ ¦ $\mathbf{360}$
    *Paiement en espèces* ¦ $60$ ¦ $\mathbf{80}$ ¦ $140$
    *Total* ¦ $210$ ¦ $\mathbf{290}$ ¦ $500$
    ```

    *Ordre de remplissage :* le total « carte » vaut $500-140=360$ ; la case « carte et roman » vaut $210-60=150$ ; la case « espèces et autre » vaut $140-60=80$ ; le total « autre » vaut $500-210=290$, ce que confirme $210+80=290$.

    **2.** $P(R)=\dfrac{210}{500}=\boxed{0{,}42}$ $P(C)=\dfrac{360}{500}=\boxed{0{,}72}$ $P(R\cap C)=\dfrac{150}{500}=\boxed{0{,}3}$

    **3.** $P_{C}(R)=\dfrac{150}{360}=\boxed{\dfrac{5}{12}\approx 0{,}417}$ et $P_{R}(C)=\dfrac{150}{210}=\boxed{\dfrac{5}{7}\approx 0{,}714}$

    **4.** Parmi les $360$ paiements par carte, $150$ concernent un roman et $210$ un autre ouvrage : 
    $$\boxed{\text{il est plus probable qu'il ait acheté un autre ouvrage } \left(\tfrac{7}{12} \text{ contre } \tfrac{5}{12}\right).}$$
- id: "p-05-04"
  feuille: "f-p-05"
  numero: 4
  partie: "Tableaux à double entrée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilité conditionnelle, tableau à double entrée, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Une bibliothèque a enregistré $800$ emprunts sur un mois.

    ```tableau
     ¦ *Roman* ¦ *Bande dessinée* ¦ *Documentaire* ¦ *Total*
    *Adulte* ¦ $240$ ¦ $60$ ¦ $120$ ¦ $420$
    *Jeune* ¦ $100$ ¦ $210$ ¦ $70$ ¦ $380$
    *Total* ¦ $340$ ¦ $270$ ¦ $190$ ¦ $800$
    ```

    On choisit un emprunt au hasard. On note $A$ l'événement « l'emprunteur est un adulte », $J$ l'événement contraire, et $R$, $D$, $B$ les événements « l'ouvrage emprunté est un roman », « un documentaire », « une bande dessinée ».

    **1.** Calculer $P(A)$ et $P(R)$.

    **2.** Calculer $P_{A}(R)$ et $P_{J}(R)$. Donner les résultats sous forme de fractions irréductibles.

    **3.** Vérifier que $P(R)=P(A)\times P_{A}(R)+P(J)\times P_{J}(R)$.

    **4.** Calculer $P_{R}(A)$ et interpréter par une phrase.

    **5.** Calculer $P_{J}(B)$ et $P_{B}(J)$.

    **6.** Les événements $A$ et $D$ sont-ils indépendants ?
  corrige: |
    **1.** $P(A)=\dfrac{420}{800}=\boxed{0{,}525}$ et $P(R)=\dfrac{340}{800}=\boxed{0{,}425}$

    **2.** $P_{A}(R)=\dfrac{240}{420}=\boxed{\dfrac{4}{7}}$ et $P_{J}(R)=\dfrac{100}{380}=\boxed{\dfrac{5}{19}}$

    **3.** $P(A)\times P_{A}(R)+P(J)\times P_{J}(R) =\dfrac{21}{40}\times\dfrac{4}{7}+\dfrac{19}{40}\times\dfrac{5}{19} =\dfrac{3}{10}+\dfrac{1}{8}=\dfrac{12+5}{40}=\dfrac{17}{40}$ 
    $$\boxed{\dfrac{17}{40}=0{,}425=P(R)}$$

    **4.** $P_{R}(A)=\dfrac{240}{340}=\boxed{\dfrac{12}{17}\approx 0{,}706}$ 
    $$\boxed{\text{Parmi les emprunts de romans, environ } 70{,}6\,\% \text{ sont le fait d'adultes.}}$$

    **5.** $P_{J}(B)=\dfrac{210}{380}=\boxed{\dfrac{21}{38}\approx 0{,}553}$ et $P_{B}(J)=\dfrac{210}{270}=\boxed{\dfrac{7}{9}\approx 0{,}778}$

    **6.** $P(D)=\dfrac{190}{800}=0{,}2375$ et $P(A\cap D)=\dfrac{120}{800}=0{,}15$, alors que 
    $$P(A)\times P(D)=0{,}525\times 0{,}2375\approx 0{,}1247$$

    $$\boxed{0{,}1247\neq 0{,}15 \text{ : les événements } A \text{ et } D \text{ ne sont pas indépendants.}}$$
- id: "p-05-05"
  feuille: "f-p-05"
  numero: 5
  partie: "La formule des probabilités conditionnelles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *On utilisera la formule $P_{A}(B)=\dfrac{P(A\cap B)}{P(A)}$, que l'on pourra aussi écrire sous la forme $P(A\cap B)=P(A)\times P_{A}(B)$.*

    Dans chaque cas, déterminer la probabilité demandée.

    **a)** $P(A)=0{,}4$ et $P(A\cap B)=0{,}12$ ; calculer $P_{A}(B)$.

    **b)** $P(B)=0{,}5$ et $P(A\cap B)=0{,}35$ ; calculer $P_{B}(A)$.

    **c)** $P(A)=0{,}25$ et $P_{A}(B)=0{,}8$ ; calculer $P(A\cap B)$.

    **d)** $P(A\cap B)=0{,}18$ et $P_{A}(B)=0{,}6$ ; calculer $P(A)$.

    **e)** $P(A)=\dfrac{1}{3}$ et $P(A\cap B)=\dfrac{1}{12}$ ; calculer $P_{A}(B)$.

    **f)** $P(B)=\dfrac{3}{5}$ et $P_{B}(A)=\dfrac{2}{9}$ ; calculer $P(A\cap B)$.
  corrige: |
    **a)** $P_{A}(B)=\dfrac{P(A\cap B)}{P(A)}=\dfrac{0{,}12}{0{,}4}=\boxed{0{,}3}$

    **b)** $P_{B}(A)=\dfrac{P(A\cap B)}{P(B)}=\dfrac{0{,}35}{0{,}5}=\boxed{0{,}7}$

    **c)** $P(A\cap B)=P(A)\times P_{A}(B)=0{,}25\times 0{,}8=\boxed{0{,}2}$

    **d)** $P(A)=\dfrac{P(A\cap B)}{P_{A}(B)}=\dfrac{0{,}18}{0{,}6}=\boxed{0{,}3}$

    **e)** $P_{A}(B)=\dfrac{\frac{1}{12}}{\frac{1}{3}}=\dfrac{1}{12}\times 3=\boxed{\dfrac{1}{4}}$

    **f)** $P(A\cap B)=P(B)\times P_{B}(A)=\dfrac{3}{5}\times\dfrac{2}{9} =\boxed{\dfrac{2}{15}}$

    *Attention à ne pas confondre les deux écritures :* dans $P_{A}(B)$, c'est $P(A)$ qui figure au dénominateur — l'événement qui conditionne est celui qui sert de référence.
- id: "p-05-06"
  feuille: "f-p-05"
  numero: 6
  partie: "La formule des probabilités conditionnelles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilité conditionnelle]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 3
  page_corrige: 3
  enonce: |
    On donne $P(A)=0{,}7$ et $P_{A}(B)=0{,}4$.

    **1.** Déterminer $P_{A}(\overline{B})$. Quelle règle du cours permet de conclure immédiatement ?

    **2.** Calculer $P(A\cap B)$ puis $P(A\cap\overline{B})$.

    **3.** Vérifier que $P(A\cap B)+P(A\cap\overline{B})=P(A)$, et expliquer pourquoi c'était prévisible.

    **4.** On donne de plus $P(B)=0{,}55$. Calculer $P_{B}(A)$.

    **5.** En déduire $P(\overline{A}\cap B)$.

    **6.** Calculer enfin $P(\overline{A})$ puis $P_{\overline{A}}(B)$.
  corrige: |
    **1.** Les deux branches issues du nœud $A$ mènent à $B$ et à $\overline{B}$, et la somme des probabilités issues d'un même nœud vaut $1$ : 
    $$P_{A}(\overline{B})=1-P_{A}(B)=1-0{,}4=\boxed{0{,}6}$$

    **2.** $P(A\cap B)=P(A)\times P_{A}(B)=0{,}7\times 0{,}4=\boxed{0{,}28}$

    $P(A\cap\overline{B})=P(A)\times P_{A}(\overline{B})=0{,}7\times 0{,}6=\boxed{0{,}42}$

    **3.** $0{,}28+0{,}42=0{,}7=P(A)$. C'était prévisible : les événements $A\cap B$ et $A\cap\overline{B}$ sont incompatibles et leur réunion est exactement $A$, puisque $B$ est réalisé ou ne l'est pas.

    **4.** $P_{B}(A)=\dfrac{P(A\cap B)}{P(B)}=\dfrac{0{,}28}{0{,}55} =\boxed{\dfrac{28}{55}\approx 0{,}509}$

    **5.** $P(\overline{A}\cap B)=P(B)-P(A\cap B)=0{,}55-0{,}28=\boxed{0{,}27}$

    **6.** $P(\overline{A})=1-0{,}7=0{,}3$, donc $P_{\overline{A}}(B)=\dfrac{0{,}27}{0{,}3}=\boxed{0{,}9}$
- id: "p-05-07"
  feuille: "f-p-05"
  numero: 7
  partie: "La formule des probabilités conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *L'objectif de cet exercice est la formule de Bayes, rencontrée dans l'introduction historique du cours.*

    **1.** Écrire de deux façons différentes la probabilité $P(A\cap B)$, à l'aide de la formule des probabilités conditionnelles.

    **2.** En déduire que, si $P(A)\neq 0$ et $P(B)\neq 0$ : 
    $$P_{A}(B)=\frac{P(B)\times P_{B}(A)}{P(A)}$$

    **3.** Appliquer cette formule dans chacun des cas suivants :

    **(a)** $P(A)=0{,}4$, $P(B)=0{,}5$ et $P_{B}(A)=0{,}6$ ; calculer $P_{A}(B)$.

    **(b)** $P(A)=0{,}25$, $P(B)=0{,}2$ et $P_{B}(A)=0{,}5$ ; calculer $P_{A}(B)$.

    **(c)** $P(A)=0{,}6$, $P(B)=0{,}3$ et $P_{A}(B)=0{,}4$ ; calculer $P_{B}(A)$.

    **4.** Que devient cette formule lorsque $A$ et $B$ sont indépendants ?
  corrige: |
    **1.** En appliquant la formule dans les deux sens : 
    $$P(A\cap B)=P(A)\times P_{A}(B) \qquad\text{et}\qquad P(A\cap B)=P(B)\times P_{B}(A)$$

    **2.** Ces deux expressions désignent le même nombre, donc 
    $$P(A)\times P_{A}(B)=P(B)\times P_{B}(A)$$
     et en divisant les deux membres par $P(A)$, qui est non nul : 
    $$\boxed{P_{A}(B)=\frac{P(B)\times P_{B}(A)}{P(A)}}$$

    **3.** **(a)** $P_{A}(B)=\dfrac{0{,}5\times 0{,}6}{0{,}4}=\dfrac{0{,}3}{0{,}4}=\boxed{0{,}75}$

    **(b)** $P_{A}(B)=\dfrac{0{,}2\times 0{,}5}{0{,}25}=\dfrac{0{,}1}{0{,}25}=\boxed{0{,}4}$

    **(c)** $P_{B}(A)=\dfrac{0{,}6\times 0{,}4}{0{,}3}=\dfrac{0{,}24}{0{,}3}=\boxed{0{,}8}$

    **4.** Si $A$ et $B$ sont indépendants, alors $P_{B}(A)=P(A)$ et la formule devient 
    $$P_{A}(B)=\frac{P(B)\times P(A)}{P(A)}=P(B)$$

    $$\boxed{\text{On retrouve la caractérisation de l'indépendance : } P_{A}(B)=P(B).}$$
- id: "p-05-08"
  feuille: "f-p-05"
  numero: 8
  partie: "La formule des probabilités conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Dans une classe de $30$ élèves, $18$ étudient l'allemand, $12$ étudient le latin, et $7$ étudient les deux. On choisit un élève au hasard, et l'on note $A$ et $L$ les événements correspondants.

    **(a)** Calculer $P(A)$, $P(L)$ et $P(A\cap L)$.

    **(b)** Calculer $P_{A}(L)$ et $P_{L}(A)$.

    **(c)** Calculer $P(A\cup L)$, puis la probabilité qu'un élève n'étudie aucune de ces deux matières.

    **2.** Dans un groupe, $60\,\%$ des personnes possèdent un vélo, $35\,\%$ possèdent une voiture, et $20\,\%$ possèdent les deux.

    **(a)** Une personne possède un vélo. Quelle est la probabilité qu'elle possède aussi une voiture ?

    **(b)** Une personne possède une voiture. Quelle est la probabilité qu'elle possède aussi un vélo ?

    **(c)** Ces deux résultats sont-ils égaux ? Expliquer.
  corrige: |
    **1.** **(a)** $P(A)=\dfrac{18}{30}=\boxed{\dfrac{3}{5}}$ $P(L)=\dfrac{12}{30}=\boxed{\dfrac{2}{5}}$ $P(A\cap L)=\boxed{\dfrac{7}{30}}$

    **(b)** $P_{A}(L)=\dfrac{\frac{7}{30}}{\frac{18}{30}}=\boxed{\dfrac{7}{18}}$ et $P_{L}(A)=\dfrac{\frac{7}{30}}{\frac{12}{30}}=\boxed{\dfrac{7}{12}}$

    **(c)** $P(A\cup L)=P(A)+P(L)-P(A\cap L)=\dfrac{18}{30}+\dfrac{12}{30}-\dfrac{7}{30} =\boxed{\dfrac{23}{30}}$

    La probabilité de n'étudier aucune des deux matières est alors $1-\dfrac{23}{30}=\boxed{\dfrac{7}{30}}$.

    **2.** On note $V$ « posséder un vélo » et $C$ « posséder une voiture », avec $P(V)=0{,}6$, $P(C)=0{,}35$ et $P(V\cap C)=0{,}2$.

    **(a)** $P_{V}(C)=\dfrac{0{,}2}{0{,}6}=\boxed{\dfrac{1}{3}\approx 0{,}333}$

    **(b)** $P_{C}(V)=\dfrac{0{,}2}{0{,}35}=\boxed{\dfrac{4}{7}\approx 0{,}571}$

    **(c)** Non, ces deux résultats sont différents. Ils portent sur le même effectif d'intersection ($20\,\%$ de la population), mais rapporté à deux ensembles de tailles différentes : les possesseurs de vélo sont plus nombreux que les possesseurs de voiture, donc la proportion y est plus faible.
- id: "p-05-09"
  feuille: "f-p-05"
  numero: 9
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    On considère l'arbre pondéré incomplet ci-dessous.

    ![Figure](documents/figures/7e2c4c7c240a7e96.svg)

    **1.** Recopier et compléter l'arbre. On justifiera chacune des trois probabilités manquantes.

    **2.** Traduire par une phrase la probabilité $P_{A}(B)=0{,}8$.

    **3.** Calculer $P(A\cap B)$, $P(A\cap\overline{B})$, $P(\overline{A}\cap B)$ et $P(\overline{A}\cap\overline{B})$.

    **4.** Vérifier que la somme de ces quatre probabilités vaut $1$. Pourquoi était-ce prévisible ?

    **5.** En déduire $P(B)$.
  corrige: |
    **1.** Les trois probabilités manquantes s'obtiennent par la **loi des nœuds** : la somme des probabilités portées par les branches issues d'un même nœud vaut $1$. 
    $$P(\overline{A})=1-0{,}3=0{,}7 \qquad P_{A}(\overline{B})=1-0{,}8=0{,}2 \qquad P_{\overline{A}}(\overline{B})=1-0{,}25=0{,}75$$

    ![Figure](documents/figures/7509d64e745dad6f.svg)

    **2.** $P_{A}(B)=0{,}8$ signifie : $\boxed{\text{sachant que } A \text{ est réalisé, la probabilité que } B \text{ le soit aussi vaut } 0{,}8.}$

    **3.** Le produit des probabilités portées par un chemin donne la probabilité de l'intersection : 
    $$P(A\cap B)=0{,}3\times 0{,}8=\boxed{0{,}24} \qquad P(A\cap\overline{B})=0{,}3\times 0{,}2=\boxed{0{,}06}$$

    $$P(\overline{A}\cap B)=0{,}7\times 0{,}25=\boxed{0{,}175} \qquad P(\overline{A}\cap\overline{B})=0{,}7\times 0{,}75=\boxed{0{,}525}$$

    **4.** $0{,}24+0{,}06+0{,}175+0{,}525=1$.

    C'était prévisible : les quatre chemins correspondent à quatre événements incompatibles deux à deux, dont la réunion est l'univers tout entier — l'une des quatre situations se produit nécessairement.

    **5.** $P(B)=P(A\cap B)+P(\overline{A}\cap B)=0{,}24+0{,}175=\boxed{0{,}415}$
- id: "p-05-10"
  feuille: "f-p-05"
  numero: 10
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités, arbre pondéré]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Dans une usine, $60\,\%$ des pièces produites proviennent de la machine $A$, le reste de la machine $B$. On constate que $3\,\%$ des pièces issues de $A$ sont défectueuses, contre $5\,\%$ de celles issues de $B$.

    On prélève une pièce au hasard dans la production. On note $A$ l'événement « la pièce provient de la machine $A$ » et $D$ l'événement « la pièce est défectueuse ».

    **1.** Traduire les données de l'énoncé à l'aide des notations du cours.

    **2.** Construire un arbre pondéré décrivant la situation.

    **3.** Calculer la probabilité qu'une pièce provienne de $A$ et soit défectueuse.

    **4.** Calculer $P(\overline{A}\cap D)$.

    **5.** En déduire la probabilité qu'une pièce prélevée au hasard soit défectueuse.
  corrige: |
    **1.** $\boxed{P(A)=0{,}6 \qquad P_{A}(D)=0{,}03 \qquad P_{\overline{A}}(D)=0{,}05}$

    *Attention :* les taux de $3\,\%$ et $5\,\%$ portent sur les pièces *d'une machine donnée* : ce sont bien des probabilités conditionnelles, et non $P(A\cap D)$.

    **2.**

    ![Figure](documents/figures/cb07fb9c66a4dff2.svg)

    **3.** $P(A\cap D)=0{,}6\times 0{,}03=\boxed{0{,}018}$

    **4.** $P(\overline{A}\cap D)=0{,}4\times 0{,}05=\boxed{0{,}02}$

    **5.** D'après la formule des probabilités totales : 
    $$P(D)=P(A\cap D)+P(\overline{A}\cap D)=0{,}018+0{,}02=\boxed{0{,}038}$$

    $$\boxed{\text{Environ } 3{,}8\,\% \text{ des pièces produites sont défectueuses.}}$$
     *On remarque que* ce taux global est compris entre $3\,\%$ et $5\,\%$ : c'est une moyenne des deux taux, pondérée par les parts de production.
- id: "p-05-11"
  feuille: "f-p-05"
  numero: 11
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    On considère l'arbre pondéré ci-dessous.

    ![Figure](documents/figures/8bb3e58f9cb1e130.svg)

    **1.** Calculer les probabilités des quatre chemins de l'arbre.

    **2.** En déduire $P(B)$, puis $P(\overline{B})$ de deux façons différentes.

    **3.** Calculer $P_{B}(A)$.

    **4.** Comparer $P_{A}(B)$ et $P(B)$. Que peut-on en conclure sur les événements $A$ et $B$ ?
  corrige: |
    **1.** On multiplie le long de chaque chemin : 
    $$P(A\cap B)=0{,}45\times 0{,}6=\boxed{0{,}27} \qquad P(A\cap\overline{B})=0{,}45\times 0{,}4=\boxed{0{,}18}$$

    $$P(\overline{A}\cap B)=0{,}55\times 0{,}2=\boxed{0{,}11} \qquad P(\overline{A}\cap\overline{B})=0{,}55\times 0{,}8=\boxed{0{,}44}$$

    **2.** $P(B)=0{,}27+0{,}11=\boxed{0{,}38}$

    **Première méthode :** $P(\overline{B})=1-P(B)=1-0{,}38=0{,}62$.

    **Seconde méthode :** $P(\overline{B})=0{,}18+0{,}44=0{,}62$. Les deux méthodes concordent.

    **3.** $P_{B}(A)=\dfrac{P(A\cap B)}{P(B)}=\dfrac{0{,}27}{0{,}38} =\boxed{\dfrac{27}{38}\approx 0{,}711}$

    **4.** $P_{A}(B)=0{,}6$ tandis que $P(B)=0{,}38$ : 
    $$\boxed{P_{A}(B)\neq P(B) \text{ : les événements } A \text{ et } B \text{ ne sont pas indépendants.}}$$
     Savoir que $A$ est réalisé augmente nettement la probabilité de $B$.
- id: "p-05-12"
  feuille: "f-p-05"
  numero: 12
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, probabilités totales]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 5
  page_corrige: 6
  enonce: |
    Dans chacun des cas suivants, calculer $P(B)$ à l'aide de la formule des probabilités totales.

    **1.** $P(A)=0{,}3$, $P_{A}(B)=0{,}5$ et $P_{\overline{A}}(B)=0{,}2$.

    **2.** $P(A)=0{,}8$, $P_{A}(B)=0{,}15$ et $P_{\overline{A}}(B)=0{,}6$.

    **3.** $P(A)=0{,}25$, $P_{A}(B)=0{,}4$ et $P(\overline{A}\cap B)=0{,}3$.

    **4.** $P(A)=0{,}6$, $P(B)=0{,}5$ et $P_{A}(B)=0{,}7$. On demande ici de calculer $P_{\overline{A}}(B)$.
  corrige: |
    *On utilise $P(B)=P(A)\times P_{A}(B)+P(\overline{A})\times P_{\overline{A}}(B)$.*

    **1.** $P(B)=0{,}3\times 0{,}5+0{,}7\times 0{,}2=0{,}15+0{,}14=\boxed{0{,}29}$

    **2.** $P(B)=0{,}8\times 0{,}15+0{,}2\times 0{,}6=0{,}12+0{,}12=\boxed{0{,}24}$

    **3.** Ici le second terme est fourni directement : 
    $$P(B)=P(A\cap B)+P(\overline{A}\cap B)=0{,}25\times 0{,}4+0{,}3=0{,}1+0{,}3=\boxed{0{,}4}$$

    **4.** On calcule d'abord $P(A\cap B)=0{,}6\times 0{,}7=0{,}42$, puis 
    $$P(\overline{A}\cap B)=P(B)-P(A\cap B)=0{,}5-0{,}42=0{,}08$$
     et enfin, comme $P(\overline{A})=0{,}4$ : 
    $$P_{\overline{A}}(B)=\frac{0{,}08}{0{,}4}=\boxed{0{,}2}$$
- id: "p-05-13"
  feuille: "f-p-05"
  numero: 13
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [probabilités, arbre pondéré, probabilités totales]
