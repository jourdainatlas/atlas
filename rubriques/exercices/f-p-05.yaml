- id: "p-05-01"
  feuille: "f-p-05"
  numero: 1
  partie: "Tableaux à double entrée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilité conditionnelle, tableau à double entrée, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Une entreprise compte $400$ salariés, répartis selon le tableau suivant.

    ```tableau
     ¦ *Cadres* ¦ *Non-cadres* ¦ *Total*
    *Femmes* ¦ $48$ ¦ $132$ ¦ $180$
    *Hommes* ¦ $72$ ¦ $148$ ¦ $220$
    *Total* ¦ $120$ ¦ $280$ ¦ $400$
    ```

    On choisit un salarié au hasard et l'on considère les événements : 
    $$C : \text{« le salarié est un cadre »} \qquad\qquad F : \text{« le salarié est une femme »}$$

    **1.** Calculer $P(C)$, $P(F)$ et $P(C\cap F)$.

    **2.** Calculer $P_{C}(F)$ et interpréter le résultat par une phrase.

    **3.** Calculer $P_{F}(C)$. Pourquoi ce résultat est-il différent du précédent ?

    **4.** Calculer $P_{\overline{C}}(F)$.

    **5.** Les événements $C$ et $F$ sont-ils indépendants ? Justifier.
  corrige: |
    *Dans un tableau d'effectifs, une probabilité conditionnelle se lit comme une proportion : on se restreint à la ligne (ou à la colonne) correspondant à l'événement qui conditionne, et c'est son effectif qui devient le dénominateur.*

    **1.** On divise l'effectif concerné par l'effectif total, qui vaut $400$ : 
    $$P(C)=\frac{120}{400}=\boxed{0{,}3} \qquad P(F)=\frac{180}{400}=\boxed{0{,}45} \qquad P(C\cap F)=\frac{48}{400}=\boxed{0{,}12}$$

    **2.** On se restreint à la colonne des cadres, qui compte $120$ salariés : 
    $$P_{C}(F)=\frac{48}{120}=\boxed{0{,}4}$$

    $$\boxed{\text{Parmi les cadres de l'entreprise, } 40\,\% \text{ sont des femmes.}}$$

    **3.** On se restreint cette fois à la ligne des femmes, qui compte $180$ salariées : 
    $$P_{F}(C)=\frac{48}{180}=\boxed{\frac{4}{15}\approx 0{,}267}$$
     Les deux résultats diffèrent car ils ne portent pas sur la même population de référence : le premier compare $48$ femmes cadres aux $120$ cadres, le second aux $180$ femmes. 
    $$\boxed{\text{En général, } P_{C}(F)\neq P_{F}(C).}$$

    **4.** On se restreint à la colonne des non-cadres, qui compte $280$ salariés : 
    $$P_{\overline{C}}(F)=\frac{132}{280}=\boxed{\frac{33}{70}\approx 0{,}471}$$

    **5.** On compare $P(C\cap F)$ et $P(C)\times P(F)$ : 
    $$P(C)\times P(F)=0{,}3\times 0{,}45=0{,}135 \qquad\text{alors que}\qquad P(C\cap F)=0{,}12$$

    $$\boxed{0{,}135\neq 0{,}12 \text{ : les événements } C \text{ et } F \text{ ne sont pas indépendants.}}$$
     *On le voyait déjà aux questions 2 et 4 :* la proportion de femmes n'est pas la même chez les cadres ($40\,\%$) et chez les non-cadres ($47{,}1\,\%$).
- id: "p-05-02"
  feuille: "f-p-05"
  numero: 2
  partie: "Tableaux à double entrée"
  etoiles: 1
  types: [Calcul]
