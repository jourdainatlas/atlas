  enonce: |
    Pour se rendre à son travail, un employé prend le train $4$ jours sur $5$, et sa voiture les autres jours. Lorsqu'il prend le train, il arrive en retard une fois sur dix ; lorsqu'il prend sa voiture, une fois sur quatre.

    On choisit un jour au hasard. On note $T$ l'événement « l'employé prend le train » et $R$ l'événement « l'employé arrive en retard ».

    **1.** Construire un arbre pondéré décrivant la situation.

    **2.** Calculer la probabilité que l'employé prenne le train et arrive en retard.

    **3.** Calculer la probabilité qu'il arrive en retard.

    **4.** L'employé est arrivé en retard. Quelle est la probabilité qu'il ait pris sa voiture ?

    **5.** Sachant qu'il est arrivé à l'heure, quelle est la probabilité qu'il ait pris le train ?
  corrige: |
    **1.** Prendre le train $4$ jours sur $5$ donne $P(T)=0{,}8$ :

    ![Figure](documents/figures/00aa4a8371e1b9fa.svg)

    **2.** $P(T\cap R)=0{,}8\times 0{,}1=\boxed{0{,}08}$

    **3.** $P(R)=0{,}08+0{,}2\times 0{,}25=0{,}08+0{,}05=\boxed{0{,}13}$

    **4.** $P_{R}(\overline{T})=\dfrac{0{,}05}{0{,}13}=\boxed{\dfrac{5}{13}\approx 0{,}385}$ 
    $$\boxed{\begin{array}{l} \text{bien qu'il ne prenne la voiture qu'un jour sur cinq,} \\[1mm] \text{elle est responsable de près de } 38\,\% \text{ des retards.} \end{array}}$$

    **5.** $P(\overline{R})=1-0{,}13=0{,}87$ et $P(T\cap\overline{R})=0{,}8\times 0{,}9=0{,}72$, donc 
    $$P_{\overline{R}}(T)=\frac{0{,}72}{0{,}87}=\boxed{\frac{24}{29}\approx 0{,}828}$$
- id: "p-05-34"
  feuille: "f-p-05"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [probabilité conditionnelle, arbre pondéré, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 12
  page_corrige: 19
  enonce: |
    Soient $A$ et $B$ deux événements d'un univers $\Omega$ tels que 
    $$P(A)=0{,}4 \qquad P_{A}(B)=x \qquad P_{\overline{A}}(B)=0{,}2$$
     où $x$ désigne un nombre réel de l'intervalle $[0\,;1]$.

    **1.** Construire un arbre pondéré faisant apparaître $x$.

    **2.** Démontrer que $P(B)=0{,}4x+0{,}12$.

    **3.** Déterminer la valeur de $x$ pour laquelle $P(B)=0{,}3$.

    **4.** Déterminer la valeur de $x$ pour laquelle les événements $A$ et $B$ sont indépendants. Interpréter le résultat obtenu.

    **5.** Déterminer les valeurs de $x$ pour lesquelles $P(B)\geqslant 0{,}4$.

    **6.** Lorsque $x$ parcourt l'intervalle $[0\,;1]$, entre quelles valeurs $P(B)$ varie-t-il ?

    **7.** Exprimer $P_{B}(A)$ en fonction de $x$, pour $x\neq 0$.
  corrige: |
    **1.**

    ![Figure](documents/figures/c0f07103672bf281.svg)

    **2.** D'après la formule des probabilités totales : 
    $$P(B)=P(A)\times P_{A}(B)+P(\overline{A})\times P_{\overline{A}}(B)=0{,}4\,x+0{,}6\times 0{,}2$$

    $$\boxed{P(B)=0{,}4\,x+0{,}12}$$

    **3.** $0{,}4x+0{,}12=0{,}3 \iff 0{,}4x=0{,}18 \iff \boxed{x=0{,}45}$

    **4.** Les événements sont indépendants si et seulement si $P_{A}(B)=P(B)$, soit 
    $$x=0{,}4x+0{,}12 \iff 0{,}6x=0{,}12 \iff \boxed{x=0{,}2}$$
     *Interprétation :* on retrouve $x=P_{\overline{A}}(B)=0{,}2$. L'indépendance signifie exactement que la probabilité de $B$ est la même selon que $A$ est réalisé ou non — les deux branches de l'arbre portent alors la même valeur.

    **5.** $0{,}4x+0{,}12\geqslant 0{,}4 \iff 0{,}4x\geqslant 0{,}28 \iff \boxed{x\geqslant 0{,}7}$

    **6.** La fonction $x\mapsto 0{,}4x+0{,}12$ est affine de coefficient directeur $0{,}4>0$, donc croissante. Ses valeurs extrêmes sur $[0\,;1]$ sont atteintes aux bornes : 
    $$P(B)=0{,}12 \text{ pour } x=0 \qquad\text{et}\qquad P(B)=0{,}52 \text{ pour } x=1$$

    $$\boxed{P(B) \text{ varie dans l'intervalle } [0{,}12\,;0{,}52].}$$
     *On remarque que* $P(B)$ ne peut jamais dépasser $0{,}52$ : même si $B$ était certain sachant $A$, les $60\,\%$ de cas où $A$ n'est pas réalisé limiteraient le total.

    **7.** $P(A\cap B)=0{,}4x$, donc pour $x\neq 0$ : 
    $$\boxed{P_{B}(A)=\frac{0{,}4\,x}{0{,}4\,x+0{,}12}}$$
- id: "p-05-35"
  feuille: "f-p-05"
  numero: 35
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Calcul]
  mots_cles: [probabilités, arbre pondéré, indépendance, variable aléatoire, loi de probabilité, variance, écart-type]
  noeuds: [p-espace, p-independance, p-variables, p-esperance]
  notions: [espace-probabilise, independance, variable-aleatoire, loi-variable]
  page_enonce: 12
  page_corrige: 20
  enonce: |
    Une plateforme de streaming propose deux formules d'abonnement. On sait que $40\,\%$ des abonnés ont souscrit l'offre *Premium*. Parmi les abonnés Premium, $70\,\%$ regardent au moins un film par semaine ; cette proportion tombe à $45\,\%$ chez les autres abonnés.

    On interroge un abonné au hasard. On note $P$ l'événement « l'abonné a l'offre Premium » et $F$ l'événement « l'abonné regarde au moins un film par semaine ».

    **Partie A : étude de la situation**

    **1.** Construire un arbre pondéré décrivant la situation.

    **2.** Calculer $P(P\cap F)$ et $P(\overline{P}\cap F)$.

    **3.** En déduire que $P(F)=0{,}55$.

    **4.** L'abonné interrogé regarde au moins un film par semaine. Calculer la probabilité qu'il ait l'offre Premium. On donnera le résultat sous forme de fraction irréductible.

    **5.** L'abonné interrogé ne regarde pas de film chaque semaine. Calculer la probabilité qu'il ait tout de même l'offre Premium.

