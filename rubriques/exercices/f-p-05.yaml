  notions: [espace-probabilise, independance, loi-variable]
  page_enonce: 11
  page_corrige: 17
  enonce: |
    On dispose d'un dé équilibré à six faces et de deux urnes :

    • l'urne $U_{1}$ contient $3$ boules rouges et $2$ boules vertes ;

    • l'urne $U_{2}$ contient $1$ boule rouge et $4$ boules vertes.

    On lance le dé. Si l'on obtient un $6$, on tire une boule dans $U_{1}$ ; sinon, on tire une boule dans $U_{2}$.

    On note $S$ l'événement « le dé donne un $6$ » et $R$ l'événement « la boule tirée est rouge ».

    **1.** Déterminer $P(S)$, $P_{S}(R)$ et $P_{\overline{S}}(R)$.

    **2.** Construire un arbre pondéré. On écrira toutes les probabilités sous forme fractionnaire.

    **3.** Calculer $P(S\cap R)$ et $P(\overline{S}\cap R)$.

    **4.** En déduire la probabilité de tirer une boule rouge.

    **5.** La boule tirée est rouge. Quelle est la probabilité que le dé ait donné un $6$ ?

    **6.** Les événements $S$ et $R$ sont-ils indépendants ? Justifier.

    **7.** Le joueur gagne $5$ € si la boule tirée est rouge, et perd $1$ € sinon. On note $X$ son gain algébrique. Déterminer la loi de probabilité de $X$, puis calculer $E[X]$.

    **8.** Calculer $V(X)$ et $\sigma(X)$, arrondi au centième.
  corrige: |
    **1.** Le dé est équilibré, donc $P(S)=\dfrac{1}{6}$. Si le dé donne $6$, on tire dans $U_{1}$ qui contient $3$ rouges sur $5$ boules ; sinon dans $U_{2}$ qui en contient $1$ sur $5$ : 
    $$\boxed{P(S)=\frac{1}{6} \qquad P_{S}(R)=\frac{3}{5} \qquad P_{\overline{S}}(R)=\frac{1}{5}}$$

    **2.**

    ![Figure](documents/figures/7a091bdf62488f68.svg)

    **3.** $P(S\cap R)=\dfrac{1}{6}\times\dfrac{3}{5}=\boxed{\dfrac{1}{10}}$ et $P(\overline{S}\cap R)=\dfrac{5}{6}\times\dfrac{1}{5}=\boxed{\dfrac{1}{6}}$

    **4.** $P(R)=\dfrac{1}{10}+\dfrac{1}{6}=\dfrac{3}{30}+\dfrac{5}{30}=\dfrac{8}{30} =\boxed{\dfrac{4}{15}}$

    **5.** $P_{R}(S)=\dfrac{P(S\cap R)}{P(R)}=\dfrac{\frac{1}{10}}{\frac{4}{15}} =\dfrac{1}{10}\times\dfrac{15}{4}=\boxed{\dfrac{3}{8}}$

    **6.** $P(S)\times P(R)=\dfrac{1}{6}\times\dfrac{4}{15}=\dfrac{4}{90}=\dfrac{2}{45}$, alors que $P(S\cap R)=\dfrac{1}{10}=\dfrac{4{,}5}{45}$ : 
    $$\boxed{\text{les événements ne sont pas indépendants.}}$$
     C'est logique : la couleur dépend de l'urne, donc du résultat du dé.

    **7.** Le gain vaut $5$ si la boule est rouge, $-1$ sinon :

    $$\begin{array}{|c|c|c|} \hline x_{i} & -1 & 5 \\ \hline P(X=x_{i}) & \frac{11}{15} & \frac{4}{15} \\ \hline \end{array}$$

    $$E[X]=-1\times\frac{11}{15}+5\times\frac{4}{15}=\frac{-11+20}{15}=\frac{9}{15} =\boxed{\frac{3}{5}=0{,}6}$$

    **8.** $E\left[X^{2}\right]=1\times\dfrac{11}{15}+25\times\dfrac{4}{15}=\dfrac{111}{15} =\dfrac{37}{5}=7{,}4$, donc 
    $$V(X)=7{,}4-0{,}6^{2}=7{,}4-0{,}36=\boxed{7{,}04} \qquad\text{et}\qquad \sigma(X)=\sqrt{7{,}04}\approx\boxed{2{,}65}$$
- id: "p-05-33"
  feuille: "f-p-05"
