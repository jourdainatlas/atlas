  notions: [espace-probabilise, independance]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Un sondage a été mené auprès de $250$ personnes sur leur usage du vélo.

    ```tableau
     ¦ *Usage régulier* ¦ *Usage rare* ¦ *Total*
    *Habite en ville* ¦ $84$ ¦ $66$ ¦ $150$
    *Habite hors de la ville* ¦ $26$ ¦ $74$ ¦ $100$
    *Total* ¦ $110$ ¦ $140$ ¦ $250$
    ```

    On interroge au hasard une des personnes sondées. On note $V$ l'événement « la personne utilise régulièrement le vélo » et $U$ l'événement « la personne habite en ville ».

    **1.** Calculer $P(V)$, $P(U)$ et $P(U\cap V)$.

    **2.** Calculer $P_{U}(V)$ et $P_{\overline{U}}(V)$. Comparer ces deux nombres et commenter.

    **3.** Calculer $P_{V}(U)$.

    **4.** Vérifier que $P(V)=P(U)\times P_{U}(V)+P(\overline{U})\times P_{\overline{U}}(V)$.

    **5.** Les événements $U$ et $V$ sont-ils indépendants ?
  corrige: |
    **1.** $P(V)=\dfrac{110}{250}=\boxed{0{,}44}$ $P(U)=\dfrac{150}{250}=\boxed{0{,}6}$ $P(U\cap V)=\dfrac{84}{250}=\boxed{0{,}336}$

    **2.** $P_{U}(V)=\dfrac{84}{150}=\boxed{0{,}56}$ et $P_{\overline{U}}(V)=\dfrac{26}{100}=\boxed{0{,}26}$ 
    $$\boxed{\text{Les citadins sont bien plus nombreux, en proportion, à utiliser régulièrement le vélo.}}$$

    **3.** $P_{V}(U)=\dfrac{84}{110}=\boxed{\dfrac{42}{55}\approx 0{,}764}$

    **4.** $P(U)\times P_{U}(V)+P(\overline{U})\times P_{\overline{U}}(V) =0{,}6\times 0{,}56+0{,}4\times 0{,}26=0{,}336+0{,}104=0{,}44$ 
    $$\boxed{\text{On retrouve bien } P(V)=0{,}44.}$$
     *C'est la formule des probabilités totales*, que l'on démontrera au paragraphe suivant : la population se partage entre citadins et non-citadins.

    **5.** $P(U)\times P(V)=0{,}6\times 0{,}44=0{,}264$, alors que $P(U\cap V)=0{,}336$ : 
    $$\boxed{\text{les événements ne sont pas indépendants.}}$$
