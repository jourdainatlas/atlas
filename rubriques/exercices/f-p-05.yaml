  notions: [espace-probabilise]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    Une entreprise s'approvisionne en composants auprès de trois fournisseurs. Le fournisseur $F_{1}$ livre $50\,\%$ des composants, $F_{2}$ en livre $30\,\%$ et $F_{3}$ le reste. Les taux de pièces défectueuses sont respectivement de $2\,\%$, $4\,\%$ et $6\,\%$.

    On prélève un composant au hasard et l'on note $D$ l'événement « le composant est défectueux ».

    **1.** Justifier que les événements $F_{1}$, $F_{2}$ et $F_{3}$ forment une partition de l'univers.

    **2.** Construire un arbre pondéré décrivant la situation. *Il comportera trois branches au premier niveau.*

    **3.** Calculer $P(F_{1}\cap D)$, $P(F_{2}\cap D)$ et $P(F_{3}\cap D)$.

    **4.** En déduire $P(D)$ à l'aide de la formule des probabilités totales.

    **5.** Un composant prélevé se révèle défectueux. Calculer la probabilité qu'il provienne du fournisseur $F_{1}$, puis de $F_{2}$, puis de $F_{3}$.

    **6.** Vérifier que la somme des trois probabilités précédentes vaut $1$, et expliquer pourquoi.
  corrige: |
    **1.** Tout composant provient d'exactement un des trois fournisseurs : les événements $F_{1}$, $F_{2}$ et $F_{3}$ sont deux à deux incompatibles et leur réunion est l'univers. De plus $0{,}5+0{,}3+0{,}2=1$. 
    $$\boxed{\text{Ils forment bien une partition de } \Omega.}$$

    **2.**

    ![Figure](documents/figures/43c5fb2fddb6b9e1.svg)

    **3.** $P(F_{1}\cap D)=0{,}5\times 0{,}02=\boxed{0{,}01}$ $P(F_{2}\cap D)=0{,}3\times 0{,}04=\boxed{0{,}012}$

    $P(F_{3}\cap D)=0{,}2\times 0{,}06=\boxed{0{,}012}$

    **4.** $P(D)=0{,}01+0{,}012+0{,}012=\boxed{0{,}034}$

    **5.** On applique la formule des probabilités conditionnelles avec $P(D)=0{,}034$ : 
    $$P_{D}(F_{1})=\frac{0{,}01}{0{,}034}=\boxed{\frac{5}{17}\approx 0{,}294}$$

    $$P_{D}(F_{2})=\frac{0{,}012}{0{,}034}=\boxed{\frac{6}{17}\approx 0{,}353} \qquad P_{D}(F_{3})=\frac{0{,}012}{0{,}034}=\boxed{\frac{6}{17}\approx 0{,}353}$$

    **6.** $\dfrac{5}{17}+\dfrac{6}{17}+\dfrac{6}{17}=\dfrac{17}{17}=1$.

    C'est logique : sachant que le composant est défectueux, il provient nécessairement de l'un des trois fournisseurs. Les trois probabilités conditionnelles forment donc, elles aussi, une loi de probabilité. 
    $$\boxed{\begin{array}{l} \text{le fournisseur } F_{1} \text{ livre la moitié des composants,} \\[1mm] \text{mais n'est responsable que de } 29{,}4\,\% \text{ des défauts.} \end{array}}$$
- id: "p-05-14"
  feuille: "f-p-05"
  numero: 14
  partie: "Arbres pondérés et probabilités totales"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités, probabilité conditionnelle, arbre pondéré]
  noeuds: [p-espace]
  notions: [espace-probabilise]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    On reprend la situation de l'exercice 10 : $P(A)=0{,}6$, $P_{A}(D)=0{,}03$ et $P_{\overline{A}}(D)=0{,}05$.

    **1.** Rappeler la valeur de $P(D)$ obtenue à l'exercice 10.

    **2.** Une pièce prélevée au hasard se révèle défectueuse. Calculer la probabilité qu'elle provienne de la machine $A$. On donnera le résultat sous forme de fraction irréductible, puis une valeur approchée au millième.

    **3.** Calculer de même $P_{D}(\overline{A})$, et vérifier la cohérence des deux résultats.

    **4.** Une pièce prélevée n'est pas défectueuse. Calculer la probabilité qu'elle provienne de la machine $A$.

    **5.** Construire l'arbre « inversé », dont le premier niveau porte sur $D$ et $\overline{D}$, et le second sur $A$ et $\overline{A}$.

    **6.** Comparer $P_{D}(A)$ et $P(A)$. Le fait de savoir qu'une pièce est défectueuse modifie-t-il l'opinion que l'on a sur sa provenance ?
  corrige: |
    **1.** L'exercice 10 a donné $\boxed{P(D)=0{,}038}$.

    **2.** $P_{D}(A)=\dfrac{P(A\cap D)}{P(D)}=\dfrac{0{,}018}{0{,}038} =\boxed{\dfrac{9}{19}\approx 0{,}474}$

    **3.** $P_{D}(\overline{A})=\dfrac{0{,}02}{0{,}038}=\dfrac{10}{19}\approx 0{,}526$, et l'on vérifie que $\dfrac{9}{19}+\dfrac{10}{19}=1$ : une pièce défectueuse provient nécessairement de $A$ ou de $B$.

    **4.** $P(\overline{D})=1-0{,}038=0{,}962$ et $P(A\cap\overline{D})=0{,}6\times 0{,}97=0{,}582$, donc 
    $$P_{\overline{D}}(A)=\frac{0{,}582}{0{,}962}=\boxed{\frac{291}{481}\approx 0{,}605}$$

    **5.** L'arbre inversé porte $D$ et $\overline{D}$ au premier niveau :

    ![Figure](documents/figures/2b54186113408e0e.svg)

    **6.** $P_{D}(A)\approx 0{,}474$ alors que $P(A)=0{,}6$ : 
    $$\boxed{\text{Oui : savoir que la pièce est défectueuse rend la machine } A \text{ moins probable.}}$$
     C'est cohérent, puisque $A$ est la machine la plus fiable des deux. On passe de « six chances sur dix » à « un peu moins d'une sur deux ».
- id: "p-05-15"
  feuille: "f-p-05"
  numero: 15
