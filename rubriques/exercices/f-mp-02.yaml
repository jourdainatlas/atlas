  source: "Réduction (LLG), exercice 57"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On considère la matrice 
    $$A = \begin{pmatrix} 1 & 1 & 0 \\ -3 & -2 & 0 \\ 0 & 0 & 1 \end{pmatrix} \in \mathcal{M}_{3}(\mathbb{R}),$$
     et l'on note encore $A$ l'endomorphisme de $\mathbb{R}^{3}$ canoniquement associé.

    **1.** Déterminer les valeurs propres réelles de $A$ et ses droites stables.

    **2.** Calculer $A^{2} + A + I_{3}$. En déduire que le plan $P = \mathrm{Vect}(e_{1}, e_{2})$ est stable par $A$, et que c'est le seul plan stable.

    **3.** Déterminer tous les sous-espaces de $\mathbb{R}^{3}$ stables par $A$.

    **4.** Déterminer les matrices $M \in \mathcal{M}_{3}(\mathbb{R})$ telles que $AM = MA$. Quelle est la dimension de cet ensemble ?
  corrige: |
    **1.** La matrice est diagonale par blocs, avec un bloc $A' = \begin{pmatrix} 1 & 1 \\ -3 & -2 \end{pmatrix}$ et un bloc $(1)$. Par la proposition 10 (ou le calcul direct d'un déterminant triangulaire par blocs), 
    $$\chi_{A} = \chi_{A'}\,(X - 1) = (X^{2} + X + 1)(X - 1).$$
     Le discriminant de $X^{2} + X + 1$ vaut $-3 < 0$ : la seule valeur propre réelle est $1$, et $A - I_{3}$ a pour noyau $\mathbb{R} e_{3}$. Une droite est stable si et seulement si elle est engendrée par un vecteur propre. 
    $$\boxed{\operatorname{Sp}_{\mathbb{R}}(A) = \{1\}, \qquad \text{seule droite stable : } \mathbb{R} e_{3}}$$

    **2.** Le calcul donne 
    $$A^{2} + A + I_{3} = \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 3 \end{pmatrix}, \qquad\text{donc}\qquad \mathrm{Ker}\,(A^{2} + A + I_{3}) = P.$$
     Comme $A$ commute avec $A^{2} + A + I_{3}$, le noyau $P$ est stable par $A$ (proposition 6), ce que l'on lit aussi sur les blocs. Soit $F$ un plan stable distinct de $P$. Alors $F + P = \mathbb{R}^{3}$, et $F \cap P$ est une droite (formule de Grassmann), stable comme intersection de deux sous-espaces stables. C'est donc $\mathbb{R} e_{3}$, qui n'est pas contenue dans $P$ : contradiction. 
    $$\boxed{P = \mathrm{Vect}(e_{1}, e_{2}) \text{ est le seul plan stable.}}$$

    **3.** En réunissant les deux questions : 
    $$\boxed{\text{Sous-espaces stables : } \{0\}, \quad \mathbb{R} e_{3}, \quad \mathrm{Vect}(e_{1}, e_{2}), \quad \mathbb{R}^{3}.}$$

    **4.** Si $AM = MA$, alors $M$ laisse stables $\mathrm{Ker}\,(A - I_{3}) = \mathbb{R} e_{3}$ et $\mathrm{Ker}\,(A^{2} + A + I_{3}) = P$ (proposition 6). Elle est donc diagonale par blocs : $M = \operatorname{diag}(M', c)$, et la relation $AM = MA$ se réduit à $A'M' = M'A'$. Écrivons $M' = \begin{pmatrix} x & y \\ z & t \end{pmatrix}$ ; le calcul de $A'M' - M'A'$ donne les équations 
    $$z + 3y = 0 \qquad\text{et}\qquad x - t - 3y = 0 \quad (\text{les deux autres en découlent}),$$
     soit $M' = \begin{pmatrix} t + 3y & y \\ -3y & t \end{pmatrix} = (t + 2y)I_{2} + yA'$. Réciproquement, ces matrices conviennent. 
    $$\boxed{AM = MA \iff M = \begin{pmatrix} \alpha I_{2} + \beta A' & 0 \\ 0 & \gamma \end{pmatrix}, \quad (\alpha, \beta, \gamma) \in \mathbb{R}^{3} ; \quad \text{dimension } 3.}$$
     On constate que le commutant est formé des matrices $aI_{3} + bA + cA^{2}$, comme on le verra aussi à l'exercice 36 : c'est un fait général lorsque $\chi_{A}$ n'a que des racines simples, que le chapitre 3 expliquera.
- id: "mp-02-10"
