  noeuds: [rd-stables, v-valeurs-propres, rd-diagonalisable]
  notions: [sous-espace-stable, valeur-propre, vecteur-propre]
  source: "Réduction #1 (Prost), exercice 43"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On note $E$ l'espace des suites réelles $(u_{n})_{n \geqslant 1}$, et $T$ l'application qui à $u \in E$ associe la suite $v$ définie par 
    $$v_{n} = \frac{1}{n^{2}} \sum_{k = 1}^{n} k\,u_{k} \qquad (n \geqslant 1).$$
     Montrer que $T$ est un endomorphisme de $E$ et déterminer ses éléments propres.
  corrige: |
    La linéarité de $T$ est immédiate. Soit $\lambda \in \mathbb{R}$ et $u \neq 0$ tel que $T(u) = \lambda u$, c'est-à-dire 
    $$\sum_{k = 1}^{n} k\,u_{k} = \lambda n^{2}u_{n} \qquad (n \geqslant 1).$$
     En retranchant la relation au rang $n - 1$, on obtient, pour $n \geqslant 2$, 
    $$n\,u_{n} = \lambda n^{2}u_{n} - \lambda(n - 1)^{2}u_{n-1}, \qquad\text{soit}\qquad n(\lambda n - 1)\,u_{n} = \lambda(n - 1)^{2}u_{n-1}.$$
     Soit $N$ le plus petit indice tel que $u_{N} \neq 0$. La relation au rang $N$ (ou la définition si $N = 1$) donne $N u_{N} = \lambda N^{2}u_{N}$, donc $\lambda = \frac{1}{N}$. Réciproquement, pour $\lambda = \frac{1}{N}$, le facteur $\lambda n - 1$ ne s'annule que pour $n = N$ : la suite est déterminée par $u_{n} = 0$ pour $n < N$, la valeur de $u_{N}$, et pour $n > N$, 
    $$u_{n} = \frac{(n - 1)^{2}}{n(n - N)}\,u_{n-1}.$$
     Elle vérifie la relation de départ au rang $N$, puis à tous les rangs par récurrence. 
    $$\boxed{\operatorname{Sp}(T) = \Big\{\frac{1}{N} \;\Big|\; N \in \mathbb{N}^{*}\Big\}, \qquad \text{chaque } E_{1/N}(T) \text{ est une droite.}}$$
     Par exemple, pour $N = 3$ et $u_{3} = 1$, on trouve $u_{4} = \frac{9}{4}$, $u_{5} = \frac{18}{5}$, $u_{6} = 5$. Le spectre est infini, ce qui est impossible en dimension finie : c'est un phénomène propre à la dimension infinie, comme pour la dérivation.
- id: "mp-02-11"
