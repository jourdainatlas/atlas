  enonce: |
    Soit $n$ un entier impair, et $A \in \mathcal{M}_{n}(\mathbb{R})$ dont toutes les valeurs propres complexes sont de module $1$, et telle que $\det A = 1$. Montrer que $1$ est valeur propre de $A$. On pourra remarquer que les racines non réelles de $\chi_{A}$ se regroupent par paires conjuguées de même multiplicité.
  corrige: |
    Le polynôme $\chi_{A}$ est à coefficients réels : si $\lambda$ en est une racine non réelle de multiplicité $m$, alors $\bar\lambda$ en est une racine de même multiplicité, puisque $\chi_{A}(X) = (X - \lambda)^{m}Q$ donne, par conjugaison des coefficients, $\chi_{A} = (X - \bar\lambda)^{m}\bar{Q}$. Sur $\mathbb{C}$, $\det A$ est le produit des valeurs propres comptées avec multiplicité (proposition 16). Regroupons-les.

    • Chaque paire $\{\lambda, \bar\lambda\}$ de valeurs propres non réelles contribue $\lambda\bar\lambda = |\lambda|^{2} = 1$ ; ces valeurs propres sont en nombre pair.

    • Les valeurs propres réelles sont de module $1$, donc égales à $1$ ou à $-1$ ; leur nombre total $n - (\text{nombre pair})$ est impair.

    Le produit des valeurs propres réelles vaut donc $\det A = 1$ : le nombre de valeurs propres égales à $-1$ est pair. Comme il y a un nombre impair de valeurs propres réelles, l'une au moins vaut $1$. 
    $$\boxed{1 \in \operatorname{Sp}(A)}$$
     En dimension $3$, cela redonne un résultat de géométrie : une matrice orthogonale de déterminant $1$, c'est-à-dire une rotation, possède un axe de vecteurs fixes, ce que le chapitre 7 établira par une autre voie.
- id: "mp-02-46"
  feuille: "f-mp-02"
