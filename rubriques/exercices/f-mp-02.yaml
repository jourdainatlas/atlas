- id: "mp-02-01"
  feuille: "f-mp-02"
  numero: 1
  partie: "Compléments d'algèbre linéaire"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [algèbre linéaire, sommes directes]
  noeuds: [v-somme-directe]
  notions: [somme-directe]
  source: "exercice ajouté (projecteurs associés à une décomposition)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $E = E_{1} \oplus E_{2} \oplus E_{3}$ et $(p_{1}, p_{2}, p_{3})$ la famille des projecteurs associés à cette décomposition.

    **1.** Montrer que $p_{1} + p_{2}$ est un projecteur, et préciser son image et son noyau.

    **2.** On pose $u = p_{1} - p_{2}$. Exprimer $u^{2}$ et $u^{3}$ à l'aide des $p_{i}$. L'endomorphisme $u$ est-il un projecteur ? une symétrie ?

    **3.** Réciproquement, soit $q_{1}$, $q_{2}$ deux projecteurs de $E$ tels que $q_{1} \circ q_{2} = q_{2} \circ q_{1} = 0$. Montrer que $q_{1} + q_{2}$ est un projecteur, et que $E = \mathrm{Im}\, q_{1} \oplus \mathrm{Im}\, q_{2} \oplus \big(\mathrm{Ker}\, q_{1} \cap \mathrm{Ker}\, q_{2}\big)$.
  corrige: |
    **1.** La proposition 1 donne $p_{i} \circ p_{i} = p_{i}$ et $p_{i} \circ p_{j} = 0$ pour $i \neq j$. On développe : 
    $$(p_{1} + p_{2})^{2} = p_{1}^{2} + p_{1}p_{2} + p_{2}p_{1} + p_{2}^{2} = p_{1} + p_{2}.$$
     Pour $x = x_{1} + x_{2} + x_{3}$, on a $(p_{1} + p_{2})(x) = x_{1} + x_{2}$ : ce vecteur est nul si et seulement si $x \in E_{3}$, et il décrit $E_{1} \oplus E_{2}$. 
    $$\boxed{p_{1} + p_{2} \text{ est le projecteur sur } E_{1} \oplus E_{2} \text{ parallèlement à } E_{3}}$$

    **2.** Le même développement donne 
    $$\boxed{u^{2} = p_{1} + p_{2}, \qquad u^{3} = (p_{1} - p_{2})(p_{1} + p_{2}) = p_{1} - p_{2} = u.}$$
     Si $E_{2} \neq \{0\}$, alors $u^{2} \neq u$, puisque $u^{2} - u = 2p_{2} \neq 0$ : $u$ n'est pas un projecteur. Si $E_{3} \neq \{0\}$, alors $u^{2} = p_{1} + p_{2} \neq \mathrm{id}_{E}$ : $u$ n'est pas une symétrie. Dans le cas général, $u$ agit comme $1$ sur $E_{1}$, comme $-1$ sur $E_{2}$ et comme $0$ sur $E_{3}$ : c'est une symétrie de $E_{1} \oplus E_{2}$ « recollée » avec l'application nulle sur $E_{3}$ (proposition 2).

    **3.** On a $(q_{1} + q_{2})^{2} = q_{1} + q_{1}q_{2} + q_{2}q_{1} + q_{2} = q_{1} + q_{2}$ : c'est un projecteur. Pour la décomposition, on écrit tout $x \in E$ sous la forme 
    $$x = q_{1}(x) + q_{2}(x) + \big(x - q_{1}(x) - q_{2}(x)\big).$$
     Le dernier terme $z$ vérifie $q_{1}(z) = q_{1}(x) - q_{1}(x) - q_{1}q_{2}(x) = 0$, et de même $q_{2}(z) = 0$ : la somme $\mathrm{Im}\, q_{1} + \mathrm{Im}\, q_{2} + (\mathrm{Ker}\, q_{1} \cap \mathrm{Ker}\, q_{2})$ est égale à $E$. Elle est directe : si $q_{1}(a) + q_{2}(b) + z = 0$ avec $z \in \mathrm{Ker}\, q_{1} \cap \mathrm{Ker}\, q_{2}$, on applique $q_{1}$, ce qui donne $q_{1}(a) = 0$, puis $q_{2}$, ce qui donne $q_{2}(b) = 0$, et enfin $z = 0$. 
    $$\boxed{E = \mathrm{Im}\, q_{1} \oplus \mathrm{Im}\, q_{2} \oplus \big(\mathrm{Ker}\, q_{1} \cap \mathrm{Ker}\, q_{2}\big)}$$
     C'est la réciproque annoncée après la proposition 1 : une famille de projecteurs « orthogonaux » au sens $q_{i}q_{j} = 0$ et une décomposition en somme directe sont deux façons de dire la même chose.
- id: "mp-02-02"
  feuille: "f-mp-02"
  numero: 2
  partie: "Compléments d'algèbre linéaire"
  etoiles: 1
  types: [Calcul]
  mots_cles: [algèbre linéaire, matrices par blocs, déterminants]
  noeuds: [v-somme-directe, rd-stables, v-det-matrice]
  notions: [somme-directe, matrice-diagonale-blocs]
  source: "Réduction (LLG), exercice 50, questions 1 et 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. On considère les matrices de $\mathcal{M}_{2n}(\mathbb{K})$ définies par blocs 
    $$A = \begin{pmatrix} I_{n} & I_{n} \\ 0 & 0 \end{pmatrix}, \qquad B = \begin{pmatrix} 0 & I_{n} \\ I_{n} & 0 \end{pmatrix}, \qquad C = \begin{pmatrix} I_{n} & I_{n} \\ 0 & I_{n} \end{pmatrix}, \qquad D = \begin{pmatrix} 0 & I_{n} \\ -I_{n} & 0 \end{pmatrix}.$$

    **1.** Donner le rang de chacune de ces matrices.

    **2.** Lesquelles sont inversibles ? Calculer leur inverse par un calcul par blocs.

    **3.** Calculer le déterminant de $B$ et celui de $D$ en fonction de $n$.
  corrige: |
    **1.** Les $n$ premières colonnes de $A$ sont égales aux $n$ suivantes, et forment une famille libre : $\mathrm{rg} A = n$. Les matrices $B$, $C$ et $D$ sont inversibles, comme le montre la question suivante, donc de rang $2n$. 
    $$\boxed{\mathrm{rg} A = n, \qquad \mathrm{rg} B = \mathrm{rg} C = \mathrm{rg} D = 2n}$$

    **2.** La matrice $A$, de rang $n < 2n$, n'est pas inversible. Pour les autres, le produit par blocs (proposition 3) donne 
    $$B^{2} = \begin{pmatrix} I_{n} & 0 \\ 0 & I_{n} \end{pmatrix}, \qquad \begin{pmatrix} I_{n} & I_{n} \\ 0 & I_{n} \end{pmatrix}\begin{pmatrix} I_{n} & -I_{n} \\ 0 & I_{n} \end{pmatrix} = I_{2n}, \qquad D^{2} = -I_{2n},$$
     d'où les inverses : 
    $$\boxed{B^{-1} = B, \qquad C^{-1} = \begin{pmatrix} I_{n} & -I_{n} \\ 0 & I_{n} \end{pmatrix}, \qquad D^{-1} = -D = \begin{pmatrix} 0 & -I_{n} \\ I_{n} & 0 \end{pmatrix}.}$$

    **3.** On passe de $B$ à $I_{2n}$ en échangeant, pour $i \in \llbracket 1\,,n \rrbracket$, la colonne $i$ et la colonne $n + i$ : ce sont $n$ échanges, qui multiplient chacun le déterminant par $-1$. Pour $D$, les mêmes échanges conduisent à $\operatorname{diag}(I_{n}, -I_{n})$, de déterminant $(-1)^{n}$. 
    $$\boxed{\det B = (-1)^{n}, \qquad \det D = (-1)^{n}(-1)^{n} = 1}$$
     *Piège.* La formule « $\det A\det D - \det B\det C$ » appliquée aux blocs de $B$ donnerait $0 - 1 = -1$ pour toute valeur de $n$ : elle est fausse dès que $n$ est pair, comme le signale la remarque de la section 2.2.
- id: "mp-02-03"
  feuille: "f-mp-02"
  numero: 3
  partie: "Compléments d'algèbre linéaire"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [algèbre linéaire]
  noeuds: [v-somme-directe]
  notions: [somme-directe]
  source: "Réduction (LLG), exercice 12, question 1"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $A \in \mathcal{M}_{n,p}(\mathbb{K})$ et $B \in \mathcal{M}_{p,n}(\mathbb{K})$, avec $n \neq p$.

    **1.** Montrer que l'une au moins des matrices $AB \in \mathcal{M}_{n}(\mathbb{K})$ et $BA \in \mathcal{M}_{p}(\mathbb{K})$ n'est pas inversible.

    **2.** Donner un exemple, avec $n = 1$ et $p = 2$, où $AB$ est inversible. La conclusion de la première question peut-elle porter sur une matrice désignée à l'avance ?
  corrige: |
    **1.** Le rang d'un produit est majoré par le rang de chaque facteur, lui-même majoré par le nombre de lignes et de colonnes (chapitre 16 de MPSI) : 
    $$\mathrm{rg}(AB) \leqslant \min(n, p) \qquad\text{et}\qquad \mathrm{rg}(BA) \leqslant \min(n, p).$$
     Si $p < n$, la matrice $AB$, de taille $n$, a un rang au plus $p < n$ : elle n'est pas inversible. Si $p > n$, c'est $BA$, de taille $p$, qui a un rang au plus $n < p$. 
    $$\boxed{\text{La plus grande des deux matrices } AB, \ BA \text{ n'est jamais inversible.}}$$

    **2.** Avec $A = \begin{pmatrix} 1 & 0 \end{pmatrix}$ et $B = {\begin{pmatrix} 1 & 0 \end{pmatrix}}^{T}$, on obtient $AB = (1)$, inversible, et $BA = \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$, qui ne l'est pas. On ne peut donc pas désigner à l'avance $AB$ : c'est la matrice de plus grande taille qui est toujours singulière, conformément à la première question. Ce résultat éclaire le théorème 3 : si $p > n$, le facteur $X^{p-n}$ de $\chi_{BA} = X^{p-n}\chi_{AB}$ traduit exactement que $0$ est valeur propre de $BA$.
- id: "mp-02-04"
  feuille: "f-mp-02"
  numero: 4
  partie: "Compléments d'algèbre linéaire"
  etoiles: 2
  types: [Démonstration]
