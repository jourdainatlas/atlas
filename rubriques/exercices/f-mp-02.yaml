  source: "Réduction #1 (Prost), exercice 42 ; BibM@th, Réduction, exercice 30"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{K})$ et $\varphi$ l'endomorphisme de $\mathcal{M}_{n}(\mathbb{K})$ défini par $\varphi(M) = AM$.

    **1.** Montrer que $\lambda$ est valeur propre de $\varphi$ si et seulement si $\lambda$ est valeur propre de $A$, et décrire $E_{\lambda}(\varphi)$ à l'aide de $E_{\lambda}(A)$. On pourra raisonner colonne par colonne.

    **2.** Écrire la matrice de $\varphi$ dans une base de $\mathcal{M}_{n}(\mathbb{K})$ bien choisie, et en déduire que $\chi_{\varphi} = \chi_{A}^{n}$.

    **3.** Montrer que $\varphi$ est diagonalisable si et seulement si $A$ l'est.
  corrige: |
    **1.** Notons $C_{1}, \dots, C_{n}$ les colonnes de $M$. Les colonnes de $AM$ sont $AC_{1}, \dots, AC_{n}$, donc 
    $$AM = \lambda M \iff AC_{j} = \lambda C_{j} \text{ pour tout } j \iff \text{toutes les colonnes de } M \text{ sont dans } E_{\lambda}(A).$$
     Il existe une telle matrice $M$ non nulle si et seulement si $E_{\lambda}(A) \neq \{0\}$. 
    $$\boxed{\operatorname{Sp}(\varphi) = \operatorname{Sp}(A), \qquad E_{\lambda}(\varphi) = \{M \mid \text{colonnes dans } E_{\lambda}(A)\}, \qquad \dim E_{\lambda}(\varphi) = n\dim E_{\lambda}(A)}$$

    **2.** Rangeons la base canonique de $\mathcal{M}_{n}(\mathbb{K})$ colonne par colonne : $(E_{11}, E_{21}, \dots, E_{n1}, E_{12}, \dots, E_{nn})$. Le sous-espace des matrices nulles hors de la $j$-ième colonne est stable par $\varphi$, qui y agit comme $A$ sur la colonne. La matrice de $\varphi$ est diagonale par blocs (proposition 5), avec $n$ blocs égaux à $A$, et la proposition 4 donne le polynôme caractéristique. 
    $$\boxed{\mathrm{Mat}(\varphi) = \operatorname{diag}(A, A, \dots, A), \qquad \chi_{\varphi} = \chi_{A}^{n}}$$

    **3.** Si $\chi_{A} = \prod (X - \lambda)^{m_{\lambda}}$ est scindé, $\chi_{\varphi}$ l'est aussi, avec les multiplicités $n\,m_{\lambda}$, et inversement. La condition du théorème 5 s'écrit $n\dim E_{\lambda}(A) = n\,m_{\lambda}$ pour $\varphi$, et $\dim E_{\lambda}(A) = m_{\lambda}$ pour $A$ : ce sont les mêmes conditions. 
    $$\boxed{\varphi \text{ diagonalisable} \iff A \text{ diagonalisable}}$$
     L'endomorphisme $M \mapsto MA$ se traite de même en raisonnant sur les lignes, ou en transposant.
- id: "mp-02-33"
  feuille: "f-mp-02"
  numero: 33
  partie: "Diagonalisation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [diagonalisation]
  noeuds: [rd-diagonalisable]
  notions: [diagonalisable]
  source: "Réduction #1 (Prost), exercice 34, question 1"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Soit $E$ de dimension finie, $u \in \mathcal{L}(E)$ et $\alpha$, $\beta$ deux scalaires distincts tels que 
    $$(u - \alpha\,\mathrm{id}_{E}) \circ (u - \beta\,\mathrm{id}_{E}) = 0.$$

    **1.** Montrer que $\mathrm{Im}\,(u - \beta\,\mathrm{id}_{E}) \subset E_{\alpha}(u)$ et $\mathrm{Im}\,(u - \alpha\,\mathrm{id}_{E}) \subset E_{\beta}(u)$.

    **2.** En écrivant, pour $x \in E$, 
    $$(\alpha - \beta)x = (u - \beta\,\mathrm{id}_{E})(x) - (u - \alpha\,\mathrm{id}_{E})(x),$$
     montrer que $E = E_{\alpha}(u) + E_{\beta}(u)$, puis que $u$ est diagonalisable.

    **3.** Qu'obtient-on pour $\alpha = 1$ et $\beta = 0$ ? pour $\alpha = 1$ et $\beta = -1$ ?
  corrige: |
    **1.** Pour $y = (u - \beta\,\mathrm{id}_{E})(x)$, l'hypothèse donne $(u - \alpha\,\mathrm{id}_{E})(y) = 0$, donc $y \in E_{\alpha}(u)$. Comme $u - \alpha\,\mathrm{id}_{E}$ et $u - \beta\,\mathrm{id}_{E}$ commutent, le produit pris dans l'autre ordre est aussi nul, et l'on obtient de même la seconde inclusion. 
    $$\boxed{\mathrm{Im}\,(u - \beta\,\mathrm{id}_{E}) \subset E_{\alpha}(u), \qquad \mathrm{Im}\,(u - \alpha\,\mathrm{id}_{E}) \subset E_{\beta}(u)}$$

    **2.** L'égalité proposée se vérifie en développant le membre de droite. Divisée par $\alpha - \beta \neq 0$, elle écrit tout $x$ comme somme d'un vecteur de $E_{\alpha}(u)$ et d'un vecteur de $E_{\beta}(u)$ : 
    $$x = \frac{(u - \beta\,\mathrm{id}_{E})(x)}{\alpha - \beta} - \frac{(u - \alpha\,\mathrm{id}_{E})(x)}{\alpha - \beta}.$$
     Donc $E = E_{\alpha}(u) + E_{\beta}(u)$, et la somme est directe (théorème 1). 
    $$\boxed{E = E_{\alpha}(u) \oplus E_{\beta}(u), \qquad u \text{ est diagonalisable.}}$$
     Les deux termes de la décomposition sont les projecteurs associés, écrits comme polynômes en $u$.

    **3.** Pour $(\alpha, \beta) = (1, 0)$, l'hypothèse est $u^{2} = u$ : on retrouve qu'un projecteur est diagonalisable, de valeurs propres dans $\{0, 1\}$. Pour $(\alpha, \beta) = (1, -1)$, l'hypothèse est $u^{2} = \mathrm{id}_{E}$ : une symétrie est diagonalisable, de valeurs propres dans $\{-1, 1\}$, et la décomposition s'écrit $x = \frac{x + u(x)}{2} + \frac{x - u(x)}{2}$, comme au chapitre 14 de MPSI. 
    $$\boxed{\text{Projecteurs et symétries sont diagonalisables.}}$$
     Le chapitre 3 généralisera ce résultat : un endomorphisme annulé par un polynôme scindé à racines simples est diagonalisable.
- id: "mp-02-34"
  feuille: "f-mp-02"
  numero: 34
  partie: "Diagonalisation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [diagonalisation, sommes directes, trace]
  noeuds: [rd-diagonalisable, v-somme-directe, v-trace]
  notions: [diagonalisable, somme-directe]
  source: "BibM@th, Réduction, exercice 43"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension $n \geqslant 1$. Un endomorphisme $u$ de $E$ est dit *involutif* si $u^{2} = \mathrm{id}_{E}$.

    **1.** Soit $u$ involutif. Montrer que $E = E_{1}(u) \oplus E_{-1}(u)$, et exprimer $\operatorname{tr} u$ en fonction de $p = \dim E_{1}(u)$ et de $n$.

    **2.** Montrer que deux endomorphismes involutifs de $E$ sont semblables, c'est-à-dire ont la même matrice dans deux bases convenables, si et seulement s'ils ont la même trace.

    **3.** Combien y a-t-il de classes de similitude d'endomorphismes involutifs de $E$ ?
  corrige: |
    **1.** C'est le cas $(\alpha, \beta) = (1, -1)$ de l'exercice 33 : $E = E_{1}(u) \oplus E_{-1}(u)$. Dans une base adaptée, la matrice de $u$ est $\operatorname{diag}(I_{p}, -I_{n-p})$. 
    $$\boxed{\operatorname{tr} u = p - (n - p) = 2p - n}$$

    **2.** Si $u$ et $v$ sont semblables, ils ont la même trace. Réciproquement, si $\operatorname{tr} u = \operatorname{tr} v$, la première question donne $\dim E_{1}(u) = \dim E_{1}(v) = p$, et dans deux bases adaptées, $u$ et $v$ ont la même matrice $\operatorname{diag}(I_{p}, -I_{n-p})$. 
    $$\boxed{u, v \text{ involutifs sont semblables} \iff \operatorname{tr} u = \operatorname{tr} v}$$

    **3.** Une classe de similitude est déterminée par $p \in \llbracket 0\,,n \rrbracket$, et chaque valeur de $p$ est atteinte par $\operatorname{diag}(I_{p}, -I_{n-p})$. 
    $$\boxed{\text{Il y a } n + 1 \text{ classes de similitude d'endomorphismes involutifs.}}$$
     Les traces possibles sont $-n, -n + 2, \dots, n$ : elles ont toutes la parité de $n$, ce qui donne un moyen rapide de reconnaître qu'une matrice n'est pas une symétrie.
- id: "mp-02-35"
  feuille: "f-mp-02"
  numero: 35
