  enonce: |
    Soit $A \in \mathrm{GL}_{n}(\mathbb{K})$. Exprimer $\chi_{A^{-1}}$ à l'aide de $\chi_{A}$ et de $\det A$. Que peut-on en déduire sur les valeurs propres de $A^{-1}$ et leurs multiplicités ?
  corrige: |
    On calcule dans le corps $\mathbb{K}(X)$, en factorisant $A^{-1}$ puis $X$ : 
    $$\chi_{A^{-1}} = \det(XI_{n} - A^{-1}) = \det(A^{-1})\det(XA - I_{n}) = \frac{X^{n}}{\det A}\det\Big(A - \frac{1}{X}I_{n}\Big) = \frac{(-X)^{n}}{\det A}\,\chi_{A}\Big(\frac{1}{X}\Big).$$

    $$\boxed{\chi_{A^{-1}}(X) = \frac{(-1)^{n}X^{n}}{\det A}\,\chi_{A}\Big(\frac{1}{X}\Big)}$$
     Si $\chi_{A} = \prod (X - \lambda_{i})$ dans $\mathbb{C}[X]$, les $\lambda_{i}$ étant non nuls puisque $A$ est inversible, on obtient, avec $\det A = \prod \lambda_{i}$, 
    $$\chi_{A^{-1}} = \frac{(-1)^{n}}{\prod \lambda_{i}} \prod (1 - \lambda_{i}X) = \prod \Big(X - \frac{1}{\lambda_{i}}\Big).$$

    $$\boxed{\text{Les valeurs propres de } A^{-1} \text{ sont les } \tfrac{1}{\lambda}, \ \lambda \in \operatorname{Sp}(A), \text{ avec les mêmes multiplicités.}}$$
     On retrouve, avec les multiplicités en plus, ce que donne l'équation $AX = \lambda X \iff A^{-1}X = \frac{1}{\lambda}X$.
