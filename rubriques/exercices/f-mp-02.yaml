  source: "Réduction #1 (Prost), exercice 16"
  page_enonce: 11
  page_corrige: 28
  enonce: |
    Soit $N \in \mathcal{M}_{n}(\mathbb{K})$ une matrice nilpotente.

    **1.** Montrer que $I_{n} + N$ et $I_{n} - N$ sont inversibles, et exprimer leurs inverses à l'aide des puissances de $N$.

    **2.** Soit $P_{n}$ la partie régulière du développement limité à l'ordre $n$ en $0$ de $x \mapsto \sqrt{1 + x}$.

    **(a)** Montrer que le polynôme $1 + X - P_{n}^{2}$ est divisible par $X^{n+1}$.

    **(b)** En déduire une matrice $M \in \mathcal{M}_{n}(\mathbb{K})$ telle que $M^{2} = I_{n} + N$.

    **3.** Soit $p \geqslant 2$. Montrer de même qu'il existe $M \in \mathcal{M}_{n}(\mathbb{K})$ telle que $M^{p} = I_{n} + N$.
  corrige: |
    **1.** Par le théorème 7, $N^{n} = 0$. L'identité $(I_{n} - N)(I_{n} + N + \cdots + N^{n-1}) = I_{n} - N^{n} = I_{n}$, analogue à la somme des termes d'une suite géométrique, donne l'inverse de $I_{n} - N$ ; on remplace $N$ par $-N$, qui est encore nilpotente, pour $I_{n} + N$. 
    $$\boxed{(I_{n} - N)^{-1} = \sum_{k = 0}^{n-1} N^{k}, \qquad (I_{n} + N)^{-1} = \sum_{k = 0}^{n-1} (-1)^{k}N^{k}}$$

    **2.a.** Par définition, $\sqrt{1 + x} = P_{n}(x) + o(x^{n})$ au voisinage de $0$. En élevant au carré, et puisque $P_{n}(x)$ est borné au voisinage de $0$, 
    $$1 + x = P_{n}(x)^{2} + o(x^{n}).$$
     Le polynôme $R = 1 + X - P_{n}^{2}$ vérifie donc $R(x) = o(x^{n})$ ; si l'on note $j$ la plus petite puissance de $X$ dont le coefficient dans $R$ est non nul, on a $R(x) \sim c\,x^{j}$, ce qui impose $j > n$ (chapitre 10 de MPSI). 
    $$\boxed{X^{n+1} \mid 1 + X - P_{n}^{2}}$$

    **2.b.** On écrit $1 + X - P_{n}^{2} = X^{n+1}S$, et l'on évalue en $N$ : comme $N^{n+1} = 0$, 
    $$I_{n} + N - P_{n}(N)^{2} = N^{n+1}S(N) = 0.$$

    $$\boxed{M = P_{n}(N) = I_{n} + \frac{1}{2}N - \frac{1}{8}N^{2} + \frac{1}{16}N^{3} - \cdots \quad \text{vérifie } M^{2} = I_{n} + N.}$$
     Les coefficients sont ceux du développement de $(1 + x)^{1/2}$, à savoir $\binom{1/2}{k}$ ; le développement s'arrête de lui-même puisque $N^{n} = 0$.

    **3.** Le même raisonnement, avec la partie régulière $P_{n, p}$ du développement limité à l'ordre $n$ de $(1 + x)^{1/p}$, donne $X^{n+1} \mid 1 + X - P_{n, p}^{p}$, puis 
    $$\boxed{M = P_{n, p}(N) \quad \text{vérifie } M^{p} = I_{n} + N.}$$
     Les matrices « unipotentes » $I_{n} + N$ ont donc des racines de tous ordres. Le développement limité, outil d'analyse, devient ici une identité algébrique exacte, parce que les termes négligés sont multipliés par une puissance nulle de $N$.
