  page_corrige: 4
  enonce: |
    Soit $E$ un $\mathbb{C}$-espace vectoriel de dimension finie non nulle, et $u$, $v \in \mathcal{L}(E)$ qui commutent. Montrer que $u$ et $v$ ont un vecteur propre commun. Le résultat subsiste-t-il si l'on remplace $\mathbb{C}$ par $\mathbb{R}$ ?
  corrige: |
    Comme $E$ est un $\mathbb{C}$-espace vectoriel de dimension finie non nulle, $u$ admet une valeur propre $\lambda$ (proposition 12), et $F = E_{\lambda}(u)$ n'est pas réduit à $\{0\}$. Il est stable par $v$, puisque $u$ et $v$ commutent (proposition 7). L'endomorphisme $v_{F}$ induit par $v$ sur $F$ est un endomorphisme d'un $\mathbb{C}$-espace vectoriel de dimension finie non nulle : il admet à son tour un vecteur propre $x \in F$. 
    $$\boxed{x \text{ est vecteur propre de } v, \text{ et de } u \text{ puisque } x \in E_{\lambda}(u) \setminus \{0\}.}$$
     Sur $\mathbb{R}$, le résultat tombe en défaut : la rotation d'angle $\frac{\pi}{2}$ du plan commute avec elle-même et n'a aucun vecteur propre. L'argument a besoin, deux fois, de l'existence d'une valeur propre. L'exercice 51 réutilise exactement ce schéma : trouver un sous-espace stable par $g$ formé de vecteurs propres de $f$.
- id: "mp-02-09"
  feuille: "f-mp-02"
