  noeuds: [rd-diagonalisable, rd-stables, v-valeurs-propres]
  notions: [diagonalisable, sous-espace-stable, valeur-propre]
  source: "Réduction (LLG), exercice 102, questions 1 à 3 ; BibM@th, Réduction, exercice 21"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Soit $E$ de dimension finie $n$ et $f \in \mathcal{L}(E)$ diagonalisable, de valeurs propres distinctes $\lambda_{1}, \dots, \lambda_{p}$. On note $E_{j} = E_{\lambda_{j}}(f)$, $d_{j} = \dim E_{j}$, et $\mathcal{C}(f) = \{g \in \mathcal{L}(E) \mid f \circ g = g \circ f\}$ le *commutant* de $f$.

    **1.** Montrer que $g \in \mathcal{C}(f)$ si et seulement si $g$ laisse stable chacun des $E_{j}$.

    **2.** Soit $\mathcal{B}$ une base de $E$ obtenue en mettant bout à bout des bases des $E_{j}$. Caractériser les matrices dans $\mathcal{B}$ des éléments de $\mathcal{C}(f)$, et en déduire que $\dim \mathcal{C}(f) = d_{1}^{2} + \cdots + d_{p}^{2}$.

    **3.** Application : soit 
    $$A = \begin{pmatrix} 1 & 0 & -1 \\ 1 & 2 & 1 \\ 2 & 2 & 3 \end{pmatrix}.$$
     Diagonaliser $A$, puis montrer que les matrices qui commutent avec $A$ sont exactement les matrices $aI_{3} + bA + cA^{2}$, avec $(a, b, c) \in \mathbb{R}^{3}$.
  corrige: |
    **1.** Si $g$ commute avec $f$, chaque $E_{j}$ est stable par $g$ (proposition 7). Réciproquement, si chaque $E_{j}$ est stable par $g$, pour $x \in E_{j}$ on a $g(x) \in E_{j}$, donc 
    $$f\big(g(x)\big) = \lambda_{j}\,g(x) = g(\lambda_{j}x) = g\big(f(x)\big).$$
     Les applications linéaires $f \circ g$ et $g \circ f$ coïncident sur chaque $E_{j}$, donc sur $E = E_{1} \oplus \cdots \oplus E_{p}$. 
    $$\boxed{g \in \mathcal{C}(f) \iff g(E_{j}) \subset E_{j} \text{ pour tout } j}$$

    **2.** Par la proposition 5 (ii), la condition précédente équivaut à ce que $\mathrm{Mat}_{\mathcal{B}}(g)$ soit diagonale par blocs, avec des blocs de tailles $d_{1}, \dots, d_{p}$ quelconques. L'application $g \mapsto \mathrm{Mat}_{\mathcal{B}}(g)$ est un isomorphisme de $\mathcal{C}(f)$ sur l'espace de ces matrices, dont une base est formée des $E_{ab}$ avec $(a, b)$ dans un même bloc diagonal. 
    $$\boxed{\mathcal{C}(f) \simeq \mathcal{M}_{d_{1}}(\mathbb{K}) \times \cdots \times \mathcal{M}_{d_{p}}(\mathbb{K}), \qquad \dim \mathcal{C}(f) = d_{1}^{2} + \cdots + d_{p}^{2}}$$
     Les deux cas extrêmes sont instructifs : si $f$ est une homothétie, $p = 1$ et $\mathcal{C}(f) = \mathcal{L}(E)$, de dimension $n^{2}$ ; si $f$ a $n$ valeurs propres distinctes, $\mathcal{C}(f)$ est formé des endomorphismes diagonaux dans $\mathcal{B}$, de dimension $n$.

    **3.** Le calcul donne $\chi_{A} = (X - 1)(X - 2)(X - 3)$ et les sous-espaces propres 
    $$E_{1}(A) = \mathbb{R}(-1, 1, 0), \qquad E_{2}(A) = \mathbb{R}(-2, 1, 2), \qquad E_{3}(A) = \mathbb{R}(-1, 1, 2),$$
     d'où $A = P\,\operatorname{diag}(1, 2, 3)\,P^{-1}$ avec $P = \begin{pmatrix} -1 & -2 & -1 \\ 1 & 1 & 1 \\ 0 & 2 & 2 \end{pmatrix}$. Par la question 2, les matrices qui commutent avec $A$ sont les $P\,\operatorname{diag}(x, y, z)\,P^{-1}$, et forment un espace de dimension $3$. Les matrices $I_{3}$, $A$, $A^{2}$ commutent avec $A$ et s'écrivent $P\,\operatorname{diag}(1, 1, 1)P^{-1}$, $P\,\operatorname{diag}(1, 2, 3)P^{-1}$, $P\,\operatorname{diag}(1, 4, 9)P^{-1}$. La famille $(I_{3}, A, A^{2})$ est libre, car le déterminant 
    $$\begin{vmatrix} 1 & 1 & 1 \\ 1 & 2 & 3 \\ 1 & 4 & 9 \end{vmatrix} = 2$$
     est un déterminant de Vandermonde non nul (chapitre 17 de MPSI). Trois vecteurs libres dans un espace de dimension $3$ en forment une base. 
    $$\boxed{AM = MA \iff M = aI_{3} + bA + cA^{2}, \quad (a, b, c) \in \mathbb{R}^{3}}$$
     Concrètement, pour obtenir $P\,\operatorname{diag}(x, y, z)\,P^{-1}$, on cherche le polynôme $Q$ de degré au plus $2$ tel que $Q(1) = x$, $Q(2) = y$, $Q(3) = z$ : c'est l'interpolation de Lagrange (chapitre 13 de MPSI).
- id: "mp-02-37"
  feuille: "f-mp-02"
  numero: 37
  partie: "Diagonalisation"
