  source: "Réduction #1 (Prost), exercice 21"
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Soit $n \in \mathbb{N}^{*}$, $A \in \mathcal{M}_{n}(\mathbb{K})$ et 
    $$B = \begin{pmatrix} A & I_{n} \\ I_{n} & A \end{pmatrix} \in \mathcal{M}_{2n}(\mathbb{K}).$$

    **1.** Montrer que $\chi_{B}(X) = \chi_{A}(X + 1)\,\chi_{A}(X - 1)$. On pourra utiliser l'exemple de la section 2.2 du cours sur les déterminants par blocs.

    **2.** On suppose $A$ diagonalisable. Montrer que $B$ est diagonalisable.
  corrige: |
    **1.** L'exemple de la section 2.2 donne $\det\begin{pmatrix} U & V \\ V & U \end{pmatrix} = \det(U + V)\det(U - V)$ pour des blocs carrés de même taille, à coefficients dans un corps. On l'applique dans $\mathbb{K}(X)$ avec $U = XI_{n} - A$ et $V = -I_{n}$ : 
    $$\chi_{B} = \det\begin{pmatrix} XI_{n} - A & -I_{n} \\ -I_{n} & XI_{n} - A \end{pmatrix} = \det\big((X - 1)I_{n} - A\big)\det\big((X + 1)I_{n} - A\big).$$

    $$\boxed{\chi_{B}(X) = \chi_{A}(X - 1)\,\chi_{A}(X + 1)}$$

    **2.** Si $AY = \lambda Y$, alors, par calcul par blocs, 
    $$B\begin{pmatrix} Y \\ Y \end{pmatrix} = (\lambda + 1)\begin{pmatrix} Y \\ Y \end{pmatrix}, \qquad B\begin{pmatrix} Y \\ -Y \end{pmatrix} = (\lambda - 1)\begin{pmatrix} Y \\ -Y \end{pmatrix}.$$
     Soit $(Y_{1}, \dots, Y_{n})$ une base de vecteurs propres de $A$. Les $2n$ vecteurs ${(Y_{i}, Y_{i})}^{T}$ et ${(Y_{i}, -Y_{i})}^{T}$ sont propres pour $B$, et forment une base : une relation $\sum \alpha_{i}{(Y_{i}, Y_{i})}^{T} + \sum \beta_{i}{(Y_{i}, -Y_{i})}^{T} = 0$ donne, par somme et différence des deux blocs, $\sum \alpha_{i}Y_{i} = \sum \beta_{i}Y_{i} = 0$, donc tous les coefficients sont nuls. 
    $$\boxed{A \text{ diagonalisable} \implies B \text{ diagonalisable}}$$
     La réciproque est vraie aussi : on peut le montrer en remarquant que 
    $$B = S\,\operatorname{diag}(A + I_{n}, A - I_{n})\,S^{-1}, \qquad S = \begin{pmatrix} I_{n} & I_{n} \\ I_{n} & -I_{n} \end{pmatrix},$$
     puis en raisonnant sur les dimensions comme à l'exercice suivant.
- id: "mp-02-40"
  feuille: "f-mp-02"
  numero: 40
  partie: "Diagonalisation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [diagonalisation, matrices par blocs]
  noeuds: [rd-diagonalisable, rd-stables]
  notions: [diagonalisable, matrice-diagonale-blocs]
  source: "Réduction (LLG), exercice 46"
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ et 
    $$B = \begin{pmatrix} A & 2A \\ 0 & 3A \end{pmatrix}.$$

    **1.** Montrer que $B$ est semblable à la matrice diagonale par blocs $B' = \operatorname{diag}(A, 3A)$, en cherchant une matrice de passage de la forme 
    $$T = \begin{pmatrix} I_{n} & U \\ 0 & I_{n} \end{pmatrix}, \qquad U \in \mathcal{M}_{n}(\mathbb{C}).$$

    **2.** Montrer que $A$ est diagonalisable si et seulement si $B$ l'est.
  corrige: |
    **1.** Avec $T = \begin{pmatrix} I_{n} & U \\ 0 & I_{n} \end{pmatrix}$, le calcul par blocs donne 
    $$BT = \begin{pmatrix} A & AU + 2A \\ 0 & 3A \end{pmatrix}, \qquad TB' = \begin{pmatrix} A & 3UA \\ 0 & 3A \end{pmatrix}.$$
     L'égalité $BT = TB'$ se réduit à $AU + 2A = 3UA$, que $U = I_{n}$ vérifie. La matrice $T$ est inversible, d'inverse $\begin{pmatrix} I_{n} & -I_{n} \\ 0 & I_{n} \end{pmatrix}$. 
    $$\boxed{B = T\,\operatorname{diag}(A, 3A)\,T^{-1}, \qquad T = \begin{pmatrix} I_{n} & I_{n} \\ 0 & I_{n} \end{pmatrix}}$$

    **2.** Il suffit de traiter $B' = \operatorname{diag}(A, 3A)$. Si $A = PDP^{-1}$, alors 
    $$B' = \operatorname{diag}(P, P)\,\operatorname{diag}(D, 3D)\,\operatorname{diag}(P, P)^{-1}$$
     est diagonalisable. Réciproquement, supposons $B'$ diagonalisable. Son polynôme caractéristique, égal à $\chi_{A}\,\chi_{3A}$, est scindé, donc $\chi_{A}$ aussi. Pour $\lambda \in \mathbb{C}$, le sous-espace $E_{\lambda}(B')$ est $E_{\lambda}(A) \times E_{\lambda}(3A)$, et $E_{\lambda}(3A) = E_{\lambda/3}(A)$. En sommant sur $\lambda$, 
    $$2n = \sum_{\lambda} \dim E_{\lambda}(B') = \sum_{\lambda} \dim E_{\lambda}(A) + \sum_{\lambda} \dim E_{\lambda/3}(A) = 2\sum_{\mu} \dim E_{\mu}(A),$$
     donc $\sum_{\mu} \dim E_{\mu}(A) = n$, et $A$ est diagonalisable (théorème 4). 
    $$\boxed{A \text{ diagonalisable} \iff B \text{ diagonalisable}}$$
     Le coefficient $2$ du bloc supérieur n'est pas arbitraire : c'est la différence $3 - 1$ des coefficients diagonaux qui permet de résoudre $AU + 2A = 3UA$ par $U = I_{n}$. Avec le bloc $A$ au lieu de $2A$ et la même diagonale, on aurait $U = \frac{1}{2}I_{n}$ ; la situation change radicalement lorsque les deux blocs diagonaux sont égaux, comme le montre l'exercice suivant.
- id: "mp-02-41"
  feuille: "f-mp-02"
  numero: 41
  partie: "Diagonalisation"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [diagonalisation, polynôme caractéristique]
  noeuds: [rd-diagonalisable, rd-caracteristique]
  notions: [diagonalisable, polynome-caracteristique]
  source: "Réduction (LLG), exercice 47"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ et 
    $$B = \begin{pmatrix} A & A \\ 0 & A \end{pmatrix}.$$

    **1.** Exprimer $\chi_{B}$ à l'aide de $\chi_{A}$.

    **2.** Soit $\lambda \in \mathbb{C}$. Montrer que ${(X, Y)}^{T} \in E_{\lambda}(B)$ si et seulement si $Y \in E_{\lambda}(A)$ et $(A - \lambda I_{n})X = -\lambda Y$. En déduire que $\dim E_{\lambda}(B) \leqslant 2 \dim E_{\lambda}(A)$.

    **3.** On suppose $B$ diagonalisable. Montrer que $A$ est diagonalisable.

    **4.** Toujours en supposant $B$ diagonalisable, montrer que pour $\lambda \neq 0$, on a $E_{\lambda}(B) = E_{\lambda}(A) \times \{0\}$. En déduire que $A = 0$.

    **5.** Conclure : à quelle condition nécessaire et suffisante $B$ est-elle diagonalisable ?
  corrige: |
    **1.** La matrice $XI_{2n} - B$ est triangulaire supérieure par blocs, de blocs diagonaux $XI_{n} - A$ (proposition 4). 
    $$\boxed{\chi_{B} = \chi_{A}^{2}}$$

    **2.** Le calcul par blocs donne $B{(X, Y)}^{T} = {(AX + AY, AY)}^{T}$. L'égalité $B{(X, Y)}^{T} = \lambda{(X, Y)}^{T}$ équivaut à $AY = \lambda Y$ et $AX + AY = \lambda X$, c'est-à-dire, en remplaçant $AY$ par $\lambda Y$, à $(A - \lambda I_{n})X = -\lambda Y$. L'application linéaire ${(X, Y)}^{T} \mapsto Y$, de $E_{\lambda}(B)$ dans $E_{\lambda}(A)$, a pour noyau les ${(X, 0)}^{T}$ avec $X \in E_{\lambda}(A)$ ; le théorème du rang donne 
    $$\boxed{\dim E_{\lambda}(B) \leqslant \dim E_{\lambda}(A) + \dim E_{\lambda}(A) = 2\dim E_{\lambda}(A).}$$

    **3.** Si $B$ est diagonalisable, $\sum_{\lambda} \dim E_{\lambda}(B) = 2n$, donc $\sum_{\lambda} \dim E_{\lambda}(A) \geqslant n$, ce qui force l'égalité : $A$ est diagonalisable (théorème 4). 
    $$\boxed{B \text{ diagonalisable} \implies A \text{ diagonalisable}}$$

    **4.** Soit $\lambda \neq 0$ et ${(X, Y)}^{T} \in E_{\lambda}(B)$. Le vecteur $\lambda Y = -(A - \lambda I_{n})X$ appartient à $\mathrm{Im}\,(A - \lambda I_{n})$ et à $\mathrm{Ker}\,(A - \lambda I_{n})$. Or $A$ est diagonalisable : dans une base propre, $A - \lambda I_{n}$ est diagonale, son image est engendrée par les vecteurs propres associés aux autres valeurs propres, et 
    $$\mathrm{Im}\,(A - \lambda I_{n}) \cap \mathrm{Ker}\,(A - \lambda I_{n}) = \{0\}.$$
     Donc $Y = 0$, puis $X \in E_{\lambda}(A)$. 
    $$\boxed{E_{\lambda}(B) = E_{\lambda}(A) \times \{0\} \quad (\lambda \neq 0)}$$
     Si $\lambda \neq 0$ était valeur propre de $A$, de multiplicité $m$, elle serait valeur propre de $B$ de multiplicité $2m$ (question 1), avec $\dim E_{\lambda}(B) = \dim E_{\lambda}(A) = m < 2m$ : $B$ ne serait pas diagonalisable (théorème 5). Ainsi $\operatorname{Sp}(A) \subset \{0\}$, et $A$, diagonalisable, est semblable à la matrice nulle. 
    $$\boxed{A = 0}$$

    **5.** Réciproquement, si $A = 0$, alors $B = 0$ est diagonalisable. 
    $$\boxed{B \text{ est diagonalisable si et seulement si } A = 0.}$$
     *Piège.* L'intuition « $B$ triangulaire par blocs à blocs diagonaux diagonalisables est diagonalisable » est fausse : il faut tenir compte du bloc hors diagonale. Comparer avec l'exercice 40, où les blocs diagonaux $A$ et $3A$ diffèrent, ce qui permet d'annuler le bloc $2A$ par changement de base.
- id: "mp-02-42"
  feuille: "f-mp-02"
  numero: 42
  partie: "Diagonalisation"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [diagonalisation, éléments propres, polynôme caractéristique]
  noeuds: [rd-diagonalisable, v-valeurs-propres, rd-caracteristique]
  notions: [diagonalisable, valeur-propre, polynome-caracteristique]
  source: "Réduction #1 (Prost), exercice 22 ; Réduction (LLG), exercice 52 ; BibM@th, Réduction, exercice 17"
  page_enonce: 10
  page_corrige: 25
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ et 
    $$B = \begin{pmatrix} 0 & A \\ I_{n} & 0 \end{pmatrix} \in \mathcal{M}_{2n}(\mathbb{C}).$$

    **1.** Montrer que $\chi_{B}(X) = \chi_{A}(X^{2})$, et en déduire les valeurs propres de $B$ à partir de celles de $A$.

    **2.** Soit $\mu \in \mathbb{C}$. Montrer que $E_{\mu}(B) = \big\{{(\mu Y, Y)}^{T} \mid Y \in E_{\mu^{2}}(A)\big\}$, et en déduire $\dim E_{\mu}(B)$.

    **3.** Montrer que $B$ est diagonalisable si et seulement si $A$ est diagonalisable et inversible.

    **4.** Application : la matrice $B$ de l'exercice 2 est-elle diagonalisable ?
  corrige: |
    **1.** On calcule dans $\mathbb{C}(X)$, où $XI_{n}$ est inversible. Multiplier à droite par la transvection par blocs de bloc supérieur droit $X^{-1}A$, de déterminant $1$ (proposition 4), revient à ajouter à la seconde tranche de colonnes la première multipliée par $X^{-1}A$ : 
    $$\begin{pmatrix} XI_{n} & -A \\ -I_{n} & XI_{n} \end{pmatrix}\begin{pmatrix} I_{n} & X^{-1}A \\ 0 & I_{n} \end{pmatrix} = \begin{pmatrix} XI_{n} & 0 \\ -I_{n} & XI_{n} - X^{-1}A \end{pmatrix}.$$
     La matrice obtenue est triangulaire inférieure par blocs, d'où 
    $$\chi_{B} = \det(XI_{n})\det\big(XI_{n} - X^{-1}A\big) = X^{n} \cdot X^{-n}\det(X^{2}I_{n} - A) = \chi_{A}(X^{2}).$$

    $$\boxed{\chi_{B}(X) = \chi_{A}(X^{2}), \qquad \operatorname{Sp}(B) = \{\mu \in \mathbb{C} \mid \mu^{2} \in \operatorname{Sp}(A)\}}$$

    **2.** L'égalité $B{(X, Y)}^{T} = \mu{(X, Y)}^{T}$ s'écrit $AY = \mu X$ et $X = \mu Y$, c'est-à-dire $X = \mu Y$ et $AY = \mu^{2}Y$. L'application $Y \mapsto {(\mu Y, Y)}^{T}$ est injective. 
    $$\boxed{E_{\mu}(B) = \big\{{(\mu Y, Y)}^{T} \mid Y \in E_{\mu^{2}}(A)\big\}, \qquad \dim E_{\mu}(B) = \dim E_{\mu^{2}}(A)}$$

    **3.** *Si $A$ est diagonalisable et inversible*, chaque valeur propre $\lambda$ de $A$, non nulle, a deux racines carrées distinctes $\pm\mu$, et 
    $$\sum_{\mu \in \operatorname{Sp}(B)} \dim E_{\mu}(B) = \sum_{\lambda \in \operatorname{Sp}(A)} 2\dim E_{\lambda}(A) = 2n :$$
     $B$ est diagonalisable. *Si $B$ est diagonalisable*, regroupons les valeurs propres $\mu$ de $B$ selon $\lambda = \mu^{2}$. Pour $\lambda \neq 0$, les deux racines contribuent $2\dim E_{\lambda}(A)$ ; pour $\lambda = 0$, la seule racine $\mu = 0$ contribue $\dim E_{0}(A)$. On obtient 
    $$2n = 2\sum_{\lambda \neq 0} \dim E_{\lambda}(A) + \dim E_{0}(A) \leqslant 2\sum_{\lambda} \dim E_{\lambda}(A) \leqslant 2n.$$
     Les inégalités sont des égalités : $\sum_{\lambda} \dim E_{\lambda}(A) = n$, donc $A$ est diagonalisable, et $\dim E_{0}(A) = 0$, donc $A$ est inversible. 
    $$\boxed{B \text{ diagonalisable} \iff A \text{ diagonalisable et inversible}}$$

    **4.** La matrice $B$ de l'exercice 2 correspond à $A = I_{n}$, diagonalisable et inversible. 
    $$\boxed{\begin{pmatrix} 0 & I_{n} \\ I_{n} & 0 \end{pmatrix} \text{ est diagonalisable, de valeurs propres } 1 \text{ et } -1.}$$
     C'est la matrice d'une symétrie, ce que confirme $B^{2} = I_{2n}$ (exercice 33). Avec $A = \operatorname{diag}(4, 0)$, on obtiendrait au contraire une matrice $B$ non diagonalisable, bien que $A$ le soit : c'est l'inversibilité qui manque.
- id: "mp-02-43"
