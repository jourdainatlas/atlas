  enonce: |
    Soit $A$, $N \in \mathcal{M}_{n}(\mathbb{K})$, avec $N$ nilpotente et $NA = 0$.

    **1.** Calculer le produit $(XI_{n} - N)(XI_{n} - A)$ dans $\mathcal{M}_{n}(\mathbb{K}(X))$.

    **2.** En déduire que $\chi_{A+N} = \chi_{A}$.

    **3.** Le résultat subsiste-t-il si l'on suppose $AN = 0$ au lieu de $NA = 0$ ?

    **4.** Montrer par un exemple que l'on ne peut pas se passer d'hypothèse sur les produits $AN$ et $NA$.
  corrige: |
    **1.** Dans $\mathcal{M}_{n}(\mathbb{K}(X))$, en développant et en utilisant $NA = 0$ : 
    $$\boxed{(XI_{n} - N)(XI_{n} - A) = X^{2}I_{n} - XA - XN + NA = X\,(XI_{n} - A - N).}$$

    **2.** On passe au déterminant. Comme $N$ est nilpotente, $\chi_{N} = X^{n}$ (théorème 7), et le membre de droite a pour déterminant $X^{n}\chi_{A+N}$ : 
    $$X^{n}\,\chi_{A} = X^{n}\,\chi_{A+N}.$$
     Le polynôme $X^{n}$ est non nul, et $\mathbb{K}[X]$ est intègre : 
    $$\boxed{\chi_{A+N} = \chi_{A}}$$

    **3.** Si $AN = 0$, on calcule le produit dans l'autre ordre : 
    $$(XI_{n} - A)(XI_{n} - N) = X(XI_{n} - A - N) + AN = X(XI_{n} - A - N),$$
     et la même conclusion vaut. 
    $$\boxed{\text{Oui : } AN = 0 \text{ suffit aussi.}}$$

    **4.** Avec $A = E_{21}$ et $N = E_{12}$, nilpotente, on a $NA = E_{11} \neq 0$ et $AN = E_{22} \neq 0$, et 
    $$\chi_{A} = X^{2}, \qquad \chi_{A+N} = \chi_{\left(\begin{smallmatrix} 0 & 1 \\ 1 & 0 \end{smallmatrix}\right)} = X^{2} - 1.$$

    $$\boxed{\text{Sans hypothèse, } \chi_{A+N} \neq \chi_{A} \text{ en général.}}$$
     Ajouter une matrice nilpotente peut donc changer complètement le spectre ; l'hypothèse de produit nul impose que $N$ « n'interagit » pas avec $A$. Le résultat reste vrai lorsque $A$ et $N$ commutent, mais la démonstration demande de trigonaliser simultanément, ce qui dépasse ce chapitre.
