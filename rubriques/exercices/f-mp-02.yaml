  page_corrige: 17
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $\varphi$ l'application définie sur $\mathbb{R}_{n}[X]$ par $\varphi(P) = P - (X + 1)P'$. Montrer que $\varphi$ est un endomorphisme de $\mathbb{R}_{n}[X]$, écrire sa matrice dans la base canonique, et en déduire que $\varphi$ est diagonalisable.
  corrige: |
    Si $\deg P \leqslant n$, alors $\deg\big((X + 1)P'\big) \leqslant n$ : $\varphi$ envoie $\mathbb{R}_{n}[X]$ dans lui-même, et elle est linéaire. Pour $k \in \llbracket 0\,,n \rrbracket$, 
    $$\varphi(X^{k}) = X^{k} - kX^{k} - kX^{k-1} = (1 - k)X^{k} - kX^{k-1}.$$
     La matrice dans la base canonique est donc triangulaire supérieure ; ses coefficients diagonaux sont les entiers $1 - k$, deux à deux distincts. 
    $$\boxed{\mathrm{Mat}(\varphi) = \begin{pmatrix} 1 & -1 & & (0) \\ & 0 & -2 & \\ & & \ddots & -n \\ (0) & & & 1 - n \end{pmatrix}, \qquad \operatorname{Sp}(\varphi) = \{1 - k \mid 0 \leqslant k \leqslant n\}}$$
     Les $n + 1$ valeurs propres de cet endomorphisme d'un espace de dimension $n + 1$ sont distinctes : $\varphi$ est diagonalisable (proposition 14). On peut même expliciter les vecteurs propres : 
    $$\varphi\big((X + 1)^{k}\big) = (1 - k)(X + 1)^{k},$$
     et la base formée des $(X + 1)^{k}$ diagonalise $\varphi$.
- id: "mp-02-30"
  feuille: "f-mp-02"
  numero: 30
  partie: "Diagonalisation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [diagonalisation, éléments propres]
  noeuds: [rd-diagonalisable, v-valeurs-propres]
  notions: [diagonalisable, valeur-propre]
  source: "BibM@th, Réduction, exercice 27"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $f$ l'application définie sur $\mathbb{R}_{n}[X]$ par 
    $$f(P) = (X^{2} - 1)P' - (nX + 1)P.$$

    **1.** Montrer que $f$ est un endomorphisme de $\mathbb{R}_{n}[X]$.

    **2.** Soit $a \in \llbracket 0\,,n \rrbracket$ et $P_{a} = (X - 1)^{a}(X + 1)^{n-a}$. Montrer que $P_{a}$ est un vecteur propre de $f$ ; on pourra calculer $P_{a}'/P_{a}$ dans $\mathbb{R}(X)$.

    **3.** En déduire que $f$ est diagonalisable, et donner son spectre.

    **4.** Pour quelles valeurs de $n$ l'endomorphisme $f$ est-il bijectif ?
  corrige: |
    **1.** La linéarité est claire. Si $P = \sum_{k \leqslant n} c_{k}X^{k}$, le terme de degré $n + 1$ de $f(P)$ vient de $X^{2}P'$ et de $nXP$ : son coefficient est $nc_{n} - nc_{n} = 0$. 
    $$\boxed{f \in \mathcal{L}(\mathbb{R}_{n}[X])}$$

    **2.** Dans $\mathbb{R}(X)$, la dérivée logarithmique de $P_{a}$ est 
    $$\frac{P_{a}'}{P_{a}} = \frac{a}{X - 1} + \frac{n - a}{X + 1} = \frac{nX + (2a - n)}{X^{2} - 1}.$$
     Ainsi $(X^{2} - 1)P_{a}' = \big(nX + 2a - n\big)P_{a}$, et 
    $$\boxed{f(P_{a}) = (2a - n - 1)\,P_{a}.}$$

    **3.** Les $n + 1$ valeurs $2a - n - 1$, pour $a \in \llbracket 0\,,n \rrbracket$, sont deux à deux distinctes, et $\dim \mathbb{R}_{n}[X] = n + 1$. 
    $$\boxed{f \text{ est diagonalisable}, \qquad \operatorname{Sp}(f) = \{-n - 1, -n + 1, \dots, n - 3, n - 1\}}$$
     Les $P_{a}$, vecteurs propres associés à des valeurs propres distinctes, forment une base de $\mathbb{R}_{n}[X]$ (théorème 1).

    **4.** L'endomorphisme $f$ est bijectif si et seulement si $0 \notin \operatorname{Sp}(f)$, c'est-à-dire si $2a = n + 1$ n'a pas de solution entière. 
    $$\boxed{f \text{ est bijectif si et seulement si } n \text{ est pair.}}$$
     Pour $n$ impair, le noyau est la droite engendrée par $(X - 1)^{\frac{n+1}{2}}(X + 1)^{\frac{n-1}{2}}$. La dérivée logarithmique a remplacé une résolution d'équation différentielle : c'est l'outil naturel pour les opérateurs de la forme $P \mapsto AP' + BP$.
