  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $p \in \mathbb{Z}$ et $A = (a_{ij}) \in \mathcal{M}_{n}(\mathbb{K})$ une matrice à coefficients entiers telle que, pour tout $i \in \llbracket 1\,,n \rrbracket$, $\displaystyle\sum_{j = 1}^{n} a_{ij} = p$. Montrer que $p$ est valeur propre de $A$, puis que $p$ divise l'entier $\det A$.
  corrige: |
    Notons $U = {(1, \dots, 1)}^{T}$. La $i$-ième coordonnée de $AU$ est $\sum_{j} a_{ij} = p$ : on a $AU = pU$, avec $U \neq 0$. 
    $$\boxed{p \in \operatorname{Sp}(A), \quad \text{de vecteur propre } {(1, \dots, 1)}^{T}}$$
     Pour la divisibilité, on remplace la première colonne de $A$ par la somme de toutes les colonnes, ce qui ne change pas le déterminant (chapitre 17 de MPSI). La nouvelle première colonne est $pU$ ; par linéarité par rapport à cette colonne, $\det A = p \det A'$, où $A'$ est la matrice obtenue en remplaçant la première colonne de $A$ par $U$. Les coefficients de $A'$ sont entiers, donc $\det A'$ est un entier, développé comme somme de produits de coefficients. 
    $$\boxed{p \mid \det A}$$
     Ce petit argument, purement algébrique, a une conséquence arithmétique : par exemple, une matrice à coefficients entiers dont chaque ligne a pour somme $2$ a un déterminant pair.
- id: "mp-02-07"
  feuille: "f-mp-02"
  numero: 7
  partie: "Sous-espaces stables et éléments propres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [stables et éléments propres, sommes directes, sous-espaces stables]
  noeuds: [rd-stables, v-valeurs-propres, v-somme-directe]
  notions: [sous-espace-stable, valeur-propre, vecteur-propre, somme-directe]
  source: "BibM@th, Réduction, exercice 3"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $u$ et $v$ deux endomorphismes de $E$.

    **1.** On sait (proposition 6 du cours) que si $u$ et $v$ commutent, alors $\mathrm{Ker}\, u$ et $\mathrm{Im}\, u$ sont stables par $v$. Montrer par un exemple que la réciproque est fausse.

    **2.** On suppose que $u$ est un projecteur. Montrer que $u$ et $v$ commutent si et seulement si $\mathrm{Ker}\, u$ et $\mathrm{Im}\, u$ sont stables par $v$.
  corrige: |
    **1.** Prenons $E = \mathbb{K}^{2}$, $u$ de matrice $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $v$ de matrice $\operatorname{diag}(1, 2)$. On a $\mathrm{Ker}\, u = \mathrm{Im}\, u = \mathbb{K} e_{1}$, qui est stable par $v$ puisque $v(e_{1}) = e_{1}$. Pourtant, 
    $$uv = \begin{pmatrix} 0 & 2 \\ 0 & 0 \end{pmatrix} \neq \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix} = vu.$$

    $$\boxed{\text{La stabilité de } \mathrm{Ker}\, u \text{ et de } \mathrm{Im}\, u \text{ par } v \text{ n'entraîne pas } uv = vu.}$$

    **2.** Le sens direct est la proposition 6. Réciproquement, supposons $\mathrm{Ker}\, u$ et $\mathrm{Im}\, u$ stables par $v$. Comme $u$ est un projecteur, $E = \mathrm{Im}\, u \oplus \mathrm{Ker}\, u$ (chapitre 14 de MPSI), et il suffit de vérifier l'égalité $uv(x) = vu(x)$ sur chacun des deux sous-espaces. Si $x \in \mathrm{Im}\, u$, alors $u(x) = x$ et $v(x) \in \mathrm{Im}\, u$, donc $uv(x) = v(x) = vu(x)$. Si $x \in \mathrm{Ker}\, u$, alors $v(x) \in \mathrm{Ker}\, u$, donc $uv(x) = 0 = vu(x)$. 
    $$\boxed{\text{Pour un projecteur } u : \quad uv = vu \iff \mathrm{Ker}\, u \text{ et } \mathrm{Im}\, u \text{ sont stables par } v.}$$
     Le contre-exemple de la première question échoue justement parce que $\mathrm{Ker}\, u$ et $\mathrm{Im}\, u$ y sont confondus et ne décomposent pas $E$. L'exercice 36 généralisera ce résultat aux endomorphismes diagonalisables.
