  enonce: |
    Soit $E$ de dimension finie $n \geqslant 1$, et $u \in \mathcal{L}(E)$ nilpotent d'indice $k$, de rang $r$.

    **1.** Montrer que la suite $\big(\dim \mathrm{Ker}\, u^{j}\big)_{0 \leqslant j \leqslant k}$ est strictement croissante.

    **2.** En déduire que $k \leqslant r + 1$. Donner un exemple où l'égalité a lieu, pour tout $r \in \llbracket 0\,,n-1 \rrbracket$.
  corrige: |
    **1.** Les noyaux $\mathrm{Ker}\, u^{j}$ sont emboîtés : si $u^{j}(x) = 0$, alors $u^{j+1}(x) = 0$. Supposons $\mathrm{Ker}\, u^{j} = \mathrm{Ker}\, u^{j+1}$ pour un $j < k$. Alors $\mathrm{Ker}\, u^{j+1} = \mathrm{Ker}\, u^{j+2}$ : si $u^{j+2}(x) = 0$, le vecteur $u(x)$ est dans $\mathrm{Ker}\, u^{j+1} = \mathrm{Ker}\, u^{j}$, donc $u^{j+1}(x) = 0$. Par récurrence, la suite des noyaux est stationnaire à partir du rang $j$, d'où $\mathrm{Ker}\, u^{k-1} = \mathrm{Ker}\, u^{k} = E$, ce qui contredit la définition de l'indice $k$. 
    $$\boxed{\{0\} = \mathrm{Ker}\, u^{0} \subsetneq \mathrm{Ker}\, u \subsetneq \cdots \subsetneq \mathrm{Ker}\, u^{k} = E}$$

    **2.** Les dimensions forment une suite d'entiers strictement croissante, de $\dim \mathrm{Ker}\, u = n - r$ à $\dim \mathrm{Ker}\, u^{k} = n$ en $k - 1$ étapes, chacune d'au moins $1$ : 
    $$n \geqslant (n - r) + (k - 1), \qquad\text{soit}\qquad \boxed{k \leqslant r + 1.}$$
     L'égalité a lieu pour l'endomorphisme de $\mathbb{K}^{n}$ de matrice $J_{r+1} = \sum_{i = 1}^{r} E_{i, i+1}$, qui envoie $e_{i+1}$ sur $e_{i}$ pour $i \leqslant r$ et les autres vecteurs de base sur $0$ : il est de rang $r$, et d'indice $r + 1$, puisque $e_{r+1} \mapsto e_{r} \mapsto \cdots \mapsto e_{1} \mapsto 0$ est une chaîne de longueur $r + 1$. C'est la chaîne de la figure du cours, section 2.7. Pour $r = n - 1$, on retrouve l'indice maximal $n$ du théorème 7.
- id: "mp-02-50"
