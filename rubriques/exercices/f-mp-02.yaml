  noeuds: [v-somme-directe, rd-stables]
  notions: [somme-directe, matrice-diagonale-blocs]
  source: "BibM@th, Réduction, exercice 40 ; Réduction (LLG), exercice 113"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{K})$ une matrice non nulle telle que $A^{2} = 0$, et $r$ son rang.

    **1.** Montrer que $\mathrm{Im}\, A \subset \mathrm{Ker}\, A$, et en déduire que $2r \leqslant n$.

    **2.** Soit $(e_{1}, \dots, e_{r})$ une base de $\mathrm{Im}\, A$, et $f_{1}, \dots, f_{r}$ des vecteurs tels que $Af_{i} = e_{i}$. Montrer que l'on peut compléter $(e_{1}, \dots, e_{r})$ en une base $(e_{1}, \dots, e_{r}, g_{1}, \dots, g_{n-2r})$ de $\mathrm{Ker}\, A$, puis que 
    $$(e_{1}, \dots, e_{r}, f_{1}, \dots, f_{r}, g_{1}, \dots, g_{n-2r})$$
     est une base de $\mathbb{K}^{n}$.

    **3.** En déduire que $A$ est semblable à la matrice définie par blocs 
    $$N_{r} = \begin{pmatrix} 0 & I_{r} & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix},$$
     dont les tranches de lignes et de colonnes ont pour tailles $r$, $r$ et $n - 2r$.

    **4.** Soit $A$ et $B$ deux matrices de $\mathcal{M}_{2m}(\mathbb{K})$ telles que $A^{2} = B^{2} = 0$, $\mathrm{rg} A \geqslant m$ et $\mathrm{rg} B \geqslant m$. Montrer que $A$ et $B$ sont semblables.
  corrige: |
    **1.** Si $y = Ax$, alors $Ay = A^{2}x = 0$ : $\mathrm{Im}\, A \subset \mathrm{Ker}\, A$. En passant aux dimensions et en utilisant le théorème du rang, 
    $$r \leqslant n - r, \qquad\text{d'où}\qquad \boxed{2r \leqslant n.}$$

    **2.** La famille libre $(e_{1}, \dots, e_{r})$ de $\mathrm{Ker}\, A$ se complète en une base de $\mathrm{Ker}\, A$ par le théorème de la base incomplète ; comme $\dim \mathrm{Ker}\, A = n - r$, on ajoute $n - 2r$ vecteurs $g_{j}$. La famille obtenue en ajoutant les $f_{i}$ a $r + r + (n - 2r) = n$ vecteurs ; il suffit de montrer qu'elle est libre. Soit 
    $$\sum_{i} \alpha_{i}e_{i} + \sum_{i} \beta_{i}f_{i} + \sum_{j} \gamma_{j}g_{j} = 0.$$
     En appliquant $A$, qui annule les $e_{i}$ et les $g_{j}$, on obtient $\sum_{i} \beta_{i}e_{i} = 0$, donc tous les $\beta_{i}$ sont nuls ; la relation restante porte sur une base de $\mathrm{Ker}\, A$, et tous les coefficients sont nuls.

    **3.** Dans la base $\mathcal{B} = (e_{1}, \dots, e_{r}, f_{1}, \dots, f_{r}, g_{1}, \dots, g_{n-2r})$, l'endomorphisme canoniquement associé à $A$ envoie les $e_{i}$ et les $g_{j}$ sur $0$, et $f_{i}$ sur $e_{i}$ : sa matrice a pour seuls coefficients non nuls des $1$ en position $(i, r + i)$. 
    $$\boxed{A = PN_{r}P^{-1}, \qquad P \text{ étant la matrice de passage de la base canonique à } \mathcal{B}.}$$

    **4.** Par la première question, $\mathrm{rg} A \leqslant m$ ; avec l'hypothèse, $\mathrm{rg} A = m$, et de même $\mathrm{rg} B = m$. Les deux matrices sont semblables à $N_{m}$, qui a ici deux tranches de taille $m$ et une tranche vide, donc semblables entre elles. 
    $$\boxed{A \text{ et } B \text{ sont semblables à } \begin{pmatrix} 0 & I_{m} \\ 0 & 0 \end{pmatrix}.}$$
     Le rang classe donc entièrement les matrices de carré nul. Pour les matrices nilpotentes d'indice quelconque, il faudra connaître les rangs de toutes les puissances : c'est l'objet de la réduction de Jordan, qui dépasse le programme.
- id: "mp-02-05"
