    **1.** Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{C})$ telles que $B^{2} = A$. L'équivalence « $A$ est diagonalisable si et seulement si $B$ est diagonalisable » est-elle vraie ? Examiner chacune des deux implications.

    **2.** Soit 
    $$A = \begin{pmatrix} 11 & -5 & -5 \\ -5 & 3 & 3 \\ -5 & 3 & 3 \end{pmatrix}.$$
     Montrer que $A$ est semblable à une matrice diagonale $D$. Déterminer toutes les matrices complexes $C$ de taille $3$ telles que $C^{2} = D$, et en déduire toutes les matrices complexes $B$ telles que $B^{2} = A$.
  corrige: |
    **1.** *Si $B$ est diagonalisable, $A$ l'est* : de $B = PDP^{-1}$ on tire $A = B^{2} = PD^{2}P^{-1}$. *La réciproque est fausse* : pour $B = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, on a $A = B^{2} = 0$, diagonalisable, tandis que $B$, nilpotente non nulle, ne l'est pas. 
    $$\boxed{B \text{ diagonalisable} \implies A \text{ diagonalisable}, \quad \text{réciproque fausse.}}$$
     On verra cependant que si $A$ est diagonalisable et *inversible*, toute racine carrée $B$ de $A$ est diagonalisable sur $\mathbb{C}$ ; cela demande les polynômes annulateurs du chapitre 3.

    **2.** Le calcul donne $\chi_{A} = X(X - 1)(X - 16)$, et 
    $$A = PDP^{-1}, \qquad D = \operatorname{diag}(0, 1, 16), \qquad P = \begin{pmatrix} 0 & 1 & -2 \\ -1 & 1 & 1 \\ 1 & 1 & 1 \end{pmatrix}.$$
     Si $C^{2} = D$, alors $C$ commute avec $D$, qui a trois valeurs propres distinctes : comme à l'exercice 36, $C$ est diagonale. Ses coefficients vérifient $c_{1}^{2} = 0$, $c_{2}^{2} = 1$, $c_{3}^{2} = 16$. 
    $$C = \operatorname{diag}(0, \pm 1, \pm 4) : \quad 4 \text{ solutions.}$$
     Enfin, $B^{2} = A$ équivaut à $(P^{-1}BP)^{2} = D$, donc $B = PCP^{-1}$. Le calcul donne les quatre solutions 
    $$\boxed{\pm\begin{pmatrix} 3 & -1 & -1 \\ -1 & 1 & 1 \\ -1 & 1 & 1 \end{pmatrix}, \qquad \pm\frac{1}{3}\begin{pmatrix} 7 & -5 & -5 \\ -5 & 1 & 1 \\ -5 & 1 & 1 \end{pmatrix}.}$$
     Les deux premières correspondent à $C = \pm\operatorname{diag}(0, 1, 4)$, les deux autres à $C = \pm\operatorname{diag}(0, -1, 4)$. On vérifie que $\begin{pmatrix} 3 & -1 & -1 \\ -1 & 1 & 1 \\ -1 & 1 & 1 \end{pmatrix}^{2} = A$ ✓. Toutes les solutions sont réelles, bien que l'on ait cherché dans $\mathcal{M}_{3}(\mathbb{C})$ : les valeurs propres de $A$ sont positives.
- id: "mp-02-39"
  feuille: "f-mp-02"
  numero: 39
  partie: "Diagonalisation"
