  source: "Réduction #1 (Prost), exercice 26, questions 1 et 3 ; Réduction (LLG), exercices 119 et 120"
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$.

    **1.** On note $\lambda_{1}, \dots, \lambda_{n}$ les valeurs propres de $A$ répétées selon leur multiplicité. Montrer que, pour tout $k \in \mathbb{N}^{*}$, $\operatorname{tr}(A^{k}) = \lambda_{1}^{k} + \cdots + \lambda_{n}^{k}$.

    **2.** Montrer que $A$ est nilpotente si et seulement si $\operatorname{tr}(A^{k}) = 0$ pour tout $k \in \mathbb{N}^{*}$. Pour la réciproque, on supposera que $A$ admet des valeurs propres non nulles $\mu_{1}, \dots, \mu_{r}$, deux à deux distinctes, de multiplicités $m_{1}, \dots, m_{r}$, et l'on écrira le système vérifié par $(m_{1}, \dots, m_{r})$ pour $k \in \llbracket 1\,,r \rrbracket$.

    **3.** Soit $B \in \mathcal{M}_{n}(\mathbb{C})$ telle que $\operatorname{tr}(A^{k}) = \operatorname{tr}(B^{k})$ pour tout $k \in \mathbb{N}^{*}$. Montrer que $\chi_{A} = \chi_{B}$.
  corrige: |
    **1.** C'est l'exercice 44 avec $P = X^{k}$, sur $\mathbb{C}$ où $\chi_{A}$ est scindé. 
    $$\boxed{\operatorname{tr}(A^{k}) = \lambda_{1}^{k} + \cdots + \lambda_{n}^{k}}$$

    **2.** Si $A$ est nilpotente, toutes ses valeurs propres sont nulles (théorème 7), donc $\operatorname{tr}(A^{k}) = 0$. Réciproquement, supposons $\operatorname{tr}(A^{k}) = 0$ pour tout $k \geqslant 1$, et que $A$ ait des valeurs propres non nulles distinctes $\mu_{1}, \dots, \mu_{r}$, de multiplicités $m_{1}, \dots, m_{r} \geqslant 1$. Les valeurs propres nulles ne contribuent pas aux sommes de puissances, et la question 1 donne, pour $k = 1, \dots, r$, 
    $$\sum_{j = 1}^{r} m_{j}\,\mu_{j}^{k} = 0, \qquad\text{soit}\qquad \begin{pmatrix} \mu_{1} & \cdots & \mu_{r} \\ \mu_{1}^{2} & \cdots & \mu_{r}^{2} \\ \vdots & & \vdots \\ \mu_{1}^{r} & \cdots & \mu_{r}^{r} \end{pmatrix}\begin{pmatrix} m_{1} \\ \vdots \\ m_{r} \end{pmatrix} = 0.$$
     En factorisant $\mu_{j}$ dans chaque colonne, le déterminant de ce système vaut $\mu_{1} \cdots \mu_{r}$ fois un déterminant de Vandermonde construit sur des nombres distincts (chapitre 17 de MPSI) : il est non nul. Donc $m_{1} = \cdots = m_{r} = 0$, ce qui contredit $m_{j} \geqslant 1$. Ainsi $\operatorname{Sp}(A) = \{0\}$, $\chi_{A} = X^{n}$, et $A$ est nilpotente (théorème 7). 
    $$\boxed{A \text{ nilpotente} \iff \operatorname{tr}(A^{k}) = 0 \text{ pour tout } k \geqslant 1}$$
     *Piège.* L'argument divise implicitement par des entiers, puisque les $m_{j}$ sont vus comme des nombres complexes non nuls. Sur un corps comme $\mathbb{Z}/p\mathbb{Z}$, où $p \cdot 1 = 0$, l'équivalence tombe : la matrice $I_{p}$ à coefficients dans $\mathbb{Z}/p\mathbb{Z}$ a toutes ses traces de puissances nulles sans être nilpotente.

    **3.** Soit $\nu_{1}, \dots, \nu_{s}$ les valeurs complexes non nulles distinctes qui sont valeurs propres de $A$ ou de $B$, et $\alpha_{j}$, $\beta_{j}$ leurs multiplicités dans $\chi_{A}$ et $\chi_{B}$ (éventuellement nulles). L'égalité des traces donne $\sum_{j} (\alpha_{j} - \beta_{j})\nu_{j}^{k} = 0$ pour $k = 1, \dots, s$, et le même argument de Vandermonde donne $\alpha_{j} = \beta_{j}$ pour tout $j$. Les deux matrices ont donc les mêmes valeurs propres non nulles avec les mêmes multiplicités ; la multiplicité de $0$ est alors $n - \sum_{j} \alpha_{j}$ dans les deux cas. 
    $$\boxed{\chi_{A} = \chi_{B}}$$
     Les matrices $A$ et $B$ ne sont pas forcément semblables : $I_{2}$ et $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ ont les mêmes traces de puissances.
- id: "mp-02-51"
  feuille: "f-mp-02"
  numero: 51
  partie: "Endomorphismes nilpotents"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [nilpotents, sous-espaces stables, éléments propres]
  noeuds: [rd-nilpotents, rd-stables, v-valeurs-propres]
  notions: [endomorphisme-nilpotent, sous-espace-stable, valeur-propre]
  source: "Réduction #1 (Prost), exercice 50, question 1 ; Réduction (LLG), exercice 116 ; BibM@th, Réduction, exercice 29"
  page_enonce: 12
  page_corrige: 30
  enonce: |
    Soit $E$ un $\mathbb{C}$-espace vectoriel de dimension finie $n \geqslant 1$, et $f$, $g \in \mathcal{L}(E)$ tels que $f \circ g - g \circ f = f$.

    **1.** Montrer que, pour tout $k \in \mathbb{N}$, $f^{k} \circ g - g \circ f^{k} = k f^{k}$.

    **2.** On considère l'endomorphisme $\Phi$ de $\mathcal{L}(E)$ défini par $\Phi(h) = h \circ g - g \circ h$. En déduire que $f$ est nilpotent.

    **3.** Montrer que $\mathrm{Ker}\, f$ est stable par $g$, puis que $f$ et $g$ ont un vecteur propre commun.
  corrige: |
    **1.** Par récurrence sur $k$. Pour $k = 0$, les deux membres sont nuls. Si la formule vaut au rang $k$, on écrit 
    $$f^{k+1}g - gf^{k+1} = f\,(f^{k}g - gf^{k}) + (fg - gf)\,f^{k} = f \cdot kf^{k} + f \cdot f^{k} = (k + 1)f^{k+1}.$$

    $$\boxed{f^{k} \circ g - g \circ f^{k} = k\,f^{k}}$$

    **2.** La question 1 s'écrit $\Phi(f^{k}) = k\,f^{k}$. Si aucune puissance de $f$ n'était nulle, chaque entier $k \geqslant 1$ serait valeur propre de $\Phi$, de vecteur propre $f^{k}$. Mais $\Phi$ est un endomorphisme de l'espace $\mathcal{L}(E)$, de dimension finie $n^{2}$ : il a au plus $n^{2}$ valeurs propres (théorème 1). Contradiction. 
    $$\boxed{f \text{ est nilpotent}}$$
     L'argument est remarquable : on montre qu'un endomorphisme est nilpotent en étudiant le spectre d'un autre endomorphisme, agissant sur un espace plus gros.

    **3.** Si $f(y) = 0$, alors $f\big(g(y)\big) = g\big(f(y)\big) + f(y) = 0$ : $\mathrm{Ker}\, f$ est stable par $g$. Comme $f$ est nilpotent, il n'est pas injectif, et $\mathrm{Ker}\, f \neq \{0\}$. L'endomorphisme induit par $g$ sur $\mathrm{Ker}\, f$ admet un vecteur propre $x$, puisque $\mathrm{Ker}\, f$ est un $\mathbb{C}$-espace de dimension finie non nulle (proposition 12). 
    $$\boxed{x \in \mathrm{Ker}\, f \setminus \{0\} \text{ est vecteur propre de } f \text{ (pour } 0\text{) et de } g.}$$
     C'est le schéma de l'exercice 8, alors que $f$ et $g$ ne commutent pas : la relation $fg - gf = f$ suffit à rendre $\mathrm{Ker}\, f$ stable par $g$. En itérant l'argument sur des sous-espaces stables, on montrerait que $f$ et $g$ sont simultanément trigonalisables.
- id: "mp-02-52"
  feuille: "f-mp-02"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, éléments propres, polynôme caractéristique, diagonalisation, trigonalisation, nilpotents]
  noeuds: [v-valeurs-propres, rd-caracteristique, rd-diagonalisable, rd-trigonalisable, rd-nilpotents]
  notions: [valeur-propre, polynome-caracteristique, diagonalisable, endomorphisme-trigonalisable, endomorphisme-nilpotent]
  source: "exercice composé pour la feuille (Vrai ou faux)"
  page_enonce: 12
  page_corrige: 30
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Les matrices sont carrées de taille $n \geqslant 2$.

    **1.** Deux matrices qui ont le même polynôme caractéristique sont semblables.

    **2.** Si $n$ est impair, toute matrice de $\mathcal{M}_{n}(\mathbb{R})$ admet au moins une valeur propre réelle.

    **3.** Toute matrice de $\mathcal{M}_{n}(\mathbb{C})$ est trigonalisable.

    **4.** Si $A$ est diagonalisable et inversible, alors $A^{-1}$ est diagonalisable.

    **5.** Une matrice nilpotente non nulle n'est jamais diagonalisable.

    **6.** La somme de deux matrices diagonalisables est diagonalisable.

    **7.** Si $\lambda$ est valeur propre de $A$, alors $\lambda^{2}$ est valeur propre de $A^{2}$.

    **8.** Si $A^{2}$ est diagonalisable, alors $A$ est diagonalisable.

    **9.** Deux matrices semblables ont les mêmes sous-espaces propres.

    **10.** Pour $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$, les matrices $AB$ et $BA$ ont le même spectre.
  corrige: |
    **1. Faux.** Les matrices $I_{2}$ et $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ ont pour polynôme caractéristique $(X - 1)^{2}$, mais $I_{2}$ n'est semblable qu'à elle-même, puisque $PI_{2}P^{-1} = I_{2}$ : elles ne sont pas semblables (remarque après la proposition 10).

    **2. Vrai.** C'est la proposition 12 (ii) : $\chi_{A}$ est réel de degré impair, et le théorème des valeurs intermédiaires lui fournit une racine réelle.

    **3. Vrai.** Sur $\mathbb{C}$, tout polynôme est scindé (théorème de d'Alembert-Gauss), et le théorème 6 s'applique.

    **4. Vrai.** Si $A = PDP^{-1}$ avec $D$ diagonale inversible, alors $A^{-1} = PD^{-1}P^{-1}$, et $D^{-1}$ est diagonale. On peut aussi invoquer l'exercice 13 : $A$ et $A^{-1}$ ont les mêmes sous-espaces propres.

    **5. Vrai.** Une matrice nilpotente n'a que la valeur propre $0$ ; diagonalisable, elle serait semblable à la matrice nulle, donc nulle (remarque après le théorème 7).

    **6. Faux.** Les matrices $\begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix}$, qui a deux valeurs propres distinctes $1$ et $0$, et $\begin{pmatrix} -1 & 0 \\ 0 & 0 \end{pmatrix}$ sont diagonalisables, mais leur somme $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ est nilpotente non nulle.

    **7. Vrai.** Si $AX = \lambda X$ avec $X \neq 0$, alors $A^{2}X = \lambda AX = \lambda^{2}X$.

    **8. Faux.** La matrice $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ a un carré nul, donc diagonalisable, sans l'être elle-même (exercice 38).

    **9. Faux.** Les matrices $\operatorname{diag}(1, 2)$ et $\operatorname{diag}(2, 1)$ sont semblables (on échange les vecteurs de base), mais $E_{1}(\operatorname{diag}(1, 2)) = \mathbb{K} e_{1}$ tandis que $E_{1}(\operatorname{diag}(2, 1)) = \mathbb{K} e_{2}$. Seules les *dimensions* des sous-espaces propres sont des invariants de similitude : si $B = P^{-1}AP$, alors $E_{\lambda}(B) = P^{-1}E_{\lambda}(A)$.

    **10. Vrai.** C'est le théorème 3 : $\chi_{AB} = \chi_{BA}$ lorsque $A$ et $B$ sont carrées de même taille.

    $$\boxed{\text{Vrai : } 2, 3, 4, 5, 7, 10. \qquad \text{Faux : } 1, 6, 8, 9.}$$
     Les affirmations fausses ont un point commun : elles confondent une propriété des valeurs propres, qui ne voit que le polynôme caractéristique, avec une propriété des sous-espaces propres, qui seule décide de la diagonalisabilité.
- id: "mp-02-53"
  feuille: "f-mp-02"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [synthèse, éléments propres]
  noeuds: [v-valeurs-propres]
  notions: [valeur-propre]
  source: "Réduction (LLG), exercice 10"
  page_enonce: 13
  page_corrige: 31
  enonce: |
    Soit $n \geqslant 2$. Existe-t-il une forme linéaire $\Phi$ sur $\mathcal{M}_{n}(\mathbb{C})$ telle que, pour toute matrice $A$, le nombre $\Phi(A)$ soit une valeur propre de $A$ ? On pourra commencer par déterminer $\Phi(E_{ij})$ pour $i \neq j$, puis pour $i = j$. Que se passe-t-il pour $n = 1$ ?
  corrige: |
    Supposons qu'une telle forme $\Phi$ existe. Pour $i \neq j$, la matrice $E_{ij}$ est nilpotente, puisque $E_{ij}^{2} = 0$ : son seul élément propre est $0$, donc $\Phi(E_{ij}) = 0$. La matrice $E_{ii}$ est diagonale, de spectre $\{0, 1\}$, donc $\Phi(E_{ii}) \in \{0, 1\}$. Enfin $\Phi(I_{n}) = 1$, seule valeur propre de $I_{n}$, et par linéarité $\sum_{i} \Phi(E_{ii}) = 1$ : un unique indice $i_{0}$ vérifie $\Phi(E_{i_{0}i_{0}}) = 1$. Par linéarité, $\Phi$ est donc donnée par 
    $$\Phi(A) = a_{i_{0}i_{0}}.$$
     Choisissons $j \neq i_{0}$, ce qui est possible puisque $n \geqslant 2$, et la matrice $A = E_{i_{0}i_{0}} + E_{i_{0}j} + E_{ji_{0}} + E_{jj}$, qui agit sur $\mathrm{Vect}(e_{i_{0}}, e_{j})$ comme $\begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}$ et annule les autres vecteurs de base. Son spectre est $\{0, 2\}$, alors que $\Phi(A) = 1$. Contradiction. 
    $$\boxed{\text{Pour } n \geqslant 2, \text{ aucune forme linéaire ne choisit une valeur propre de chaque matrice.}}$$
     Pour $n = 1$, la forme $\Phi(a) = a$ convient évidemment. Le résultat dit que l'application « valeur propre », que l'on aimerait définir continûment sur $\mathcal{M}_{n}(\mathbb{C})$, ne peut pas être linéaire : les valeurs propres dépendent de la matrice de façon non linéaire, comme les racines d'un polynôme dépendent de ses coefficients.
- id: "mp-02-54"
  feuille: "f-mp-02"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, éléments propres, trace]
  noeuds: [v-valeurs-propres, v-trace]
  notions: [valeur-propre]
  source: "BibM@th, Réduction, exercice 44"
  page_enonce: 13
  page_corrige: 31
  enonce: |
    Soit $n \geqslant 1$ et $A \in \mathcal{M}_{n}(\mathbb{K})$ de trace nulle. On se propose de montrer que $A$ est semblable à une matrice dont tous les coefficients diagonaux sont nuls.

    **1.** Traiter le cas $n = 1$, puis le cas où $A$ est une matrice scalaire $\lambda I_{n}$.

    **2.** Soit $u \in \mathcal{L}(E)$, avec $E$ de dimension finie. Montrer que si tout vecteur non nul de $E$ est vecteur propre de $u$, alors $u$ est une homothétie. On pourra considérer deux vecteurs non colinéaires $x$, $y$ et le vecteur $x + y$.

    **3.** On suppose $n \geqslant 2$ et $A$ non scalaire. Montrer qu'il existe $x \in \mathbb{K}^{n}$ tel que $(x, Ax)$ soit libre, puis que $A$ est semblable à une matrice de la forme 
    $$\begin{pmatrix} 0 & L \\ C & A' \end{pmatrix}, \qquad A' \in \mathcal{M}_{n-1}(\mathbb{K}), \quad \operatorname{tr} A' = 0.$$

    **4.** Conclure par récurrence sur $n$.
  corrige: |
    **1.** Pour $n = 1$, la seule matrice de trace nulle est $(0)$. Si $A = \lambda I_{n}$ est de trace nulle, alors $n\lambda = 0$, donc $\lambda = 0$ et $A = 0$, qui convient. 
    $$\boxed{\text{Les cas } n = 1 \text{ et } A \text{ scalaire sont immédiats : } A = 0.}$$

    **2.** Soit $x$ et $y$ non colinéaires, avec $u(x) = \alpha x$, $u(y) = \beta y$ et $u(x + y) = \gamma(x + y)$. Alors $\alpha x + \beta y = \gamma x + \gamma y$, et la liberté de $(x, y)$ donne $\alpha = \gamma = \beta$. Deux vecteurs non colinéaires ont donc la même valeur propre ; pour deux vecteurs colinéaires non nuls, c'est évident. Ainsi $u(x) = \alpha x$ pour tout $x$. 
    $$\boxed{\text{Si tout vecteur non nul est propre, } u \text{ est une homothétie.}}$$
     Si $\dim E = 1$, tout endomorphisme est une homothétie, et l'énoncé est trivial.

    **3.** L'endomorphisme $u$ canoniquement associé à $A$ n'est pas une homothétie, donc, par la question 2, il existe $x \neq 0$ qui n'est pas vecteur propre : la famille $(x, Ax)$ est libre. On la complète en une base $\mathcal{B} = (x, Ax, e_{3}, \dots, e_{n})$. Dans cette base, la première colonne de la matrice de $u$ contient les coordonnées de $u(x) = Ax$, à savoir ${(0, 1, 0, \dots, 0)}^{T}$. La matrice s'écrit donc par blocs 
    $$A \sim \begin{pmatrix} 0 & L \\ C & A' \end{pmatrix}, \qquad C = {(1, 0, \dots, 0)}^{T}, \qquad A' \in \mathcal{M}_{n-1}(\mathbb{K}),$$
     et la trace, invariante par similitude, donne $\operatorname{tr} A' = \operatorname{tr} A - 0 = 0$. 
    $$\boxed{A \text{ est semblable à } \begin{pmatrix} 0 & L \\ C & A' \end{pmatrix} \text{ avec } \operatorname{tr} A' = 0.}$$

    **4.** Montrons par récurrence sur $n$ la propriété : toute matrice de $\mathcal{M}_{n}(\mathbb{K})$ de trace nulle est semblable à une matrice de diagonale nulle. Le cas $n = 1$ est la question 1. Supposons-la vraie au rang $n - 1$, et soit $A \in \mathcal{M}_{n}(\mathbb{K})$ de trace nulle. Si $A$ est scalaire, elle est nulle. Sinon, la question 3 donne $A = R\begin{pmatrix} 0 & L \\ C & A' \end{pmatrix}R^{-1}$, et l'hypothèse de récurrence fournit $Q \in \mathrm{GL}_{n-1}(\mathbb{K})$ telle que $Q^{-1}A'Q$ ait une diagonale nulle. Avec $S = \operatorname{diag}(1, Q)$, le calcul par blocs donne 
    $$S^{-1}\begin{pmatrix} 0 & L \\ C & A' \end{pmatrix}S = \begin{pmatrix} 0 & LQ \\ Q^{-1}C & Q^{-1}A'Q \end{pmatrix},$$
     dont la diagonale est nulle. 
    $$\boxed{\text{Toute matrice de trace nulle est semblable à une matrice de diagonale nulle.}}$$
     La réciproque est évidente, puisque la trace est un invariant de similitude : la trace nulle caractérise donc les classes de similitude qui contiennent une matrice de diagonale nulle. Ce résultat est la première étape d'un théorème classique : une matrice de trace nulle est un commutateur $XY - YX$.
- id: "mp-02-55"
  feuille: "f-mp-02"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [synthèse, éléments propres, polynôme caractéristique, diagonalisation, nilpotents, "puissances d'une matrice"]
  noeuds: [v-valeurs-propres, rd-caracteristique, rd-diagonalisable, rd-nilpotents, pol-binome]
  notions: [valeur-propre, polynome-caracteristique, diagonalisable, endomorphisme-nilpotent, coefficient-binomial]
  source: "Réduction #1 (Prost), exercice 33 ; Réduction (LLG), exercices 16 et 17"
  page_enonce: 13
  page_corrige: 32
  enonce: |
    *Le théorème de Kronecker.* Soit $P \in \mathbb{Z}[X]$ un polynôme unitaire de degré $n \geqslant 1$, dont toutes les racines complexes sont de module au plus $1$. On écrit $P = \prod_{i = 1}^{n} (X - \lambda_{i})$ dans $\mathbb{C}[X]$. On se propose de montrer que les racines non nulles de $P$ sont des racines de l'unité, résultat publié par Leopold Kronecker en 1857.

    **1.** En utilisant l'exercice 16, construire une matrice $M \in \mathcal{M}_{n}(\mathbb{Z})$ telle que $\chi_{M} = P$.

    **2.** Soit $q \in \mathbb{N}^{*}$. À l'aide de l'exercice 44, montrer que le polynôme $P_{q} = \prod_{i = 1}^{n} (X - \lambda_{i}^{q})$ est à coefficients entiers.

    **3.** Montrer, à l'aide des relations entre coefficients et racines, que le coefficient de $X^{n-k}$ dans $P_{q}$ est de valeur absolue au plus $\binom{n}{k}$. En déduire que l'ensemble $\{P_{q} \mid q \in \mathbb{N}^{*}\}$ est fini.

    **4.** En déduire que l'ensemble $\{\lambda_{i}^{q} \mid 1 \leqslant i \leqslant n,\ q \in \mathbb{N}^{*}\}$ est fini, puis que toute racine non nulle de $P$ est une racine de l'unité.

    **5.** L'hypothèse « $P$ unitaire à coefficients entiers » est-elle indispensable ? Examiner le polynôme $X^{2} - \frac{6}{5}X + 1$.

    **6.** Construire une matrice $A \in \mathcal{M}_{n}(\mathbb{Z})$ dont l'ensemble des valeurs propres complexes est $\mathbb{U}_{n}$. Est-elle diagonalisable sur $\mathbb{C}$ ?

    **7.** Soit $A \in \mathcal{M}_{n}(\mathbb{Z})$ dont toutes les valeurs propres complexes sont de module au plus $1$ et dont aucune n'est nulle. Montrer qu'il existe $k \in \mathbb{N}^{*}$ tel que $A^{k} - I_{n}$ soit nilpotente. On pourra utiliser l'exercice 44 avec $P = X^{k} - 1$.
  corrige: |
    **1.** On écrit $P = X^{n} - \sum_{k = 0}^{n-1} a_{k}X^{k}$ : les $a_{k}$ sont les opposés des coefficients de $P$, donc des entiers. La matrice compagnon $C(P)$ de l'exercice 16 est à coefficients entiers, et $\chi_{C(P)} = P$. 
    $$\boxed{M = C(P) \in \mathcal{M}_{n}(\mathbb{Z}), \qquad \chi_{M} = P}$$

    **2.** Le polynôme $\chi_{M} = P$ est scindé sur $\mathbb{C}$, de racines $\lambda_{1}, \dots, \lambda_{n}$. L'exercice 44, appliqué dans $\mathcal{M}_{n}(\mathbb{C})$ avec le polynôme $X^{q}$, donne $\chi_{M^{q}} = \prod_{i} (X - \lambda_{i}^{q}) = P_{q}$. Or $M^{q}$ est à coefficients entiers, et le polynôme caractéristique d'une matrice entière est à coefficients entiers, puisque c'est un déterminant développé comme somme de produits de coefficients de $XI_{n} - M^{q}$. 
    $$\boxed{P_{q} = \chi_{M^{q}} \in \mathbb{Z}[X]}$$

    **3.** Les relations entre coefficients et racines (chapitre 13 de MPSI) donnent pour coefficient de $X^{n-k}$ dans $P_{q}$ le nombre $(-1)^{k}\sigma_{k}$, où $\sigma_{k}$ est la somme des $\binom{n}{k}$ produits de $k$ racines $\lambda_{i}^{q}$ d'indices distincts. Chacun de ces produits est de module au plus $1$, puisque $|\lambda_{i}| \leqslant 1$. 
    $$\boxed{\big|\text{coefficient de } X^{n-k} \text{ dans } P_{q}\big| \leqslant \binom{n}{k}}$$
     Un polynôme unitaire de degré $n$ à coefficients entiers ainsi bornés est déterminé par $n$ entiers, le $k$-ième choisi dans un ensemble fini de $2\binom{n}{k} + 1$ valeurs : il y a au plus $\prod_{k = 1}^{n}\big(2\binom{n}{k} + 1\big)$ tels polynômes. 
    $$\boxed{\{P_{q} \mid q \in \mathbb{N}^{*}\} \text{ est fini.}}$$

    **4.** Chaque $\lambda_{i}^{q}$ est racine de $P_{q}$, qui appartient à un ensemble fini de polynômes non nuls ayant chacun au plus $n$ racines : l'ensemble des $\lambda_{i}^{q}$ est fini. Soit $\lambda = \lambda_{i} \neq 0$. La suite $(\lambda^{q})_{q \geqslant 1}$ prend un nombre fini de valeurs, donc il existe $q < q'$ avec $\lambda^{q} = \lambda^{q'}$ ; en simplifiant par $\lambda^{q} \neq 0$, on obtient $\lambda^{q' - q} = 1$. 
    $$\boxed{\text{Toute racine non nulle de } P \text{ est une racine de l'unité.}}$$
     C'est le théorème de Kronecker (1857). Il faut remarquer que l'algèbre linéaire n'a servi qu'à une chose : garantir, par $P_{q} = \chi_{M^{q}}$, que les polynômes $P_{q}$ sont à coefficients entiers ; l'exercice 44 remplace ici le théorème sur les polynômes symétriques.

    **5.** Le polynôme $X^{2} - \frac{6}{5}X + 1$ a un discriminant négatif et un produit des racines égal à $1$ : ses racines $z = \frac{3 \pm 4\mathrm{i}}{5}$ sont conjuguées et de module $1$. Mais $z$ n'est pas une racine de l'unité. Si l'on avait $z^{k} = 1$, on aurait $(3 + 4\mathrm{i})^{k} = 5^{k}$. Écrivons $(3 + 4\mathrm{i})^{k} = x_{k} + \mathrm{i} y_{k}$, avec $x_{k}$, $y_{k}$ entiers ; on a $x_{k+1} = 3x_{k} - 4y_{k}$ et $y_{k+1} = 4x_{k} + 3y_{k}$. Modulo $5$, partant de $(x_{1}, y_{1}) \equiv (3, 4)$, on trouve 
    $$(x_{2}, y_{2}) \equiv (9 - 16, 12 + 12) \equiv (3, 4),$$
     et la suite est constante modulo $5$ : $x_{k} \equiv 3$, alors que $5^{k} \equiv 0$. Contradiction. 
    $$\boxed{\text{L'hypothèse de coefficients entiers est indispensable.}}$$
     Le polynôme est unitaire, à racines de module $1$, mais ses coefficients ne sont pas entiers : la conclusion tombe en défaut.

    **6.** La matrice compagnon de $X^{n} - 1$, c'est-à-dire avec $a_{0} = 1$ et les autres $a_{k}$ nuls, est la matrice de la permutation circulaire $e_{k} \mapsto e_{k+1}$, $e_{n} \mapsto e_{1}$. Son polynôme caractéristique $X^{n} - 1$ a pour racines les $n$ éléments distincts de $\mathbb{U}_{n}$. 
    $$\boxed{A = C(X^{n} - 1) \in \mathcal{M}_{n}(\mathbb{Z}), \qquad \operatorname{Sp}(A) = \mathbb{U}_{n}, \qquad A \text{ diagonalisable sur } \mathbb{C}}$$
     La diagonalisabilité découle de la proposition 14, et l'on retrouve la matrice $J$ de l'exercice 27, à transposition près.

    **7.** Le polynôme $\chi_{A}$ est unitaire à coefficients entiers, ses racines sont de module au plus $1$ et non nulles : par la question 4, ce sont des racines de l'unité, $\lambda_{i}^{k_{i}} = 1$. Soit $k$ le ppcm des $k_{i}$. L'exercice 44, avec le polynôme $X^{k} - 1$, donne 
    $$\chi_{A^{k} - I_{n}} = \prod_{i = 1}^{n}\big(X - (\lambda_{i}^{k} - 1)\big) = X^{n}.$$

    $$\boxed{A^{k} - I_{n} \text{ est nilpotente (théorème 7).}}$$
     Ainsi une matrice entière dont le spectre est dans le disque unité fermé, sans valeur propre nulle, est « presque périodique » : une de ses puissances diffère de l'identité par une matrice nilpotente. Si de plus $A$ est diagonalisable, alors $A^{k} - I_{n}$, nilpotente et diagonalisable, est nulle : $A^{k} = I_{n}$.

