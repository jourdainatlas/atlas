  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $E = \mathcal{C}^{0}(\mathbb{R}_{+}, \mathbb{R})$. À $f \in E$, on associe la fonction $g = u(f)$ définie par 
    $$g(0) = f(0) \qquad\text{et}\qquad g(x) = \frac{1}{x} \int_{0}^{x} f(t)\,\mathrm{d} t \quad\text{pour } x > 0.$$
     Montrer que $u$ est un endomorphisme de $E$, puis déterminer ses valeurs propres et ses sous-espaces propres.
  corrige: |
    *$u$ est un endomorphisme.* Pour $f \in E$, la fonction $F : x \mapsto \int_{0}^{x} f$ est de classe $\mathcal{C}^{1}$ avec $F' = f$ ; $g$ est continue sur $\mathbb{R}_{+}^{*}$, et en $0$, $\frac{F(x)}{x} = \frac{F(x) - F(0)}{x} \to F'(0) = f(0) = g(0)$. La linéarité découle de celle de l'intégrale.

    *Le cas $\lambda = 0$.* Si $u(f) = 0$, alors $F = 0$ sur $\mathbb{R}_{+}^{*}$, donc $f = F' = 0$ : $0$ n'est pas valeur propre.

    *Le cas $\lambda \neq 0$.* Supposons $u(f) = \lambda f$ avec $f \neq 0$. Sur $\mathbb{R}_{+}^{*}$, on a $F(x) = \lambda x F'(x)$, équation différentielle linéaire du premier ordre (chapitre 6 de MPSI) dont les solutions sont 
    $$F(x) = C\,x^{1/\lambda}, \qquad\text{d'où}\qquad f(x) = F'(x) = \frac{C}{\lambda}\,x^{\frac{1}{\lambda} - 1} \quad (x > 0).$$
     Pour que $f$ soit non nulle et se prolonge continûment en $0$, il faut $C \neq 0$ et $\frac{1}{\lambda} - 1 \geqslant 0$, c'est-à-dire $0 < \lambda \leqslant 1$. Réciproquement, pour $a = \frac{1}{\lambda} - 1 \geqslant 0$, la fonction $f_{a} : x \mapsto x^{a}$ (prolongée par $f_{0} = 1$) vérifie $u(f_{a})(x) = \frac{x^{a}}{a + 1}$, donc $u(f_{a}) = \lambda f_{a}$, y compris en $0$. 
    $$\boxed{\operatorname{Sp}(u) = \,]0, 1], \qquad E_{\lambda}(u) = \mathbb{R}\,\big(x \mapsto x^{\frac{1}{\lambda} - 1}\big)}$$
     *Piège.* Les valeurs $\lambda > 1$ donnent des fonctions $x^{a}$ avec $-1 < a < 0$, dont l'intégrale converge mais qui ne sont pas continues en $0$ : elles ne sont pas dans $E$. Le spectre dépend de l'espace sur lequel on fait agir l'opérateur.
- id: "mp-02-12"
  feuille: "f-mp-02"
  numero: 12
  partie: "Sous-espaces stables et éléments propres"
  etoiles: 2
