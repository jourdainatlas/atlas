  noeuds: [rd-stables, v-valeurs-propres, rd-diagonalisable]
  notions: [sous-espace-stable, valeur-propre, vecteur-propre]
  source: "BibM@th, Réduction, exercice 2"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On note $E$ l'espace des suites complexes $(u_{n})_{n \in \mathbb{N}}$, et $\varphi$ l'application qui à $u \in E$ associe la suite $v$ définie par 
    $$v_{0} = u_{0} \qquad\text{et}\qquad v_{n} = \frac{u_{n} + u_{n-1}}{2} \quad\text{pour } n \geqslant 1.$$
     Montrer que $\varphi$ est un endomorphisme de $E$, puis déterminer ses valeurs propres et ses sous-espaces propres.
  corrige: |
    La suite $\varphi(u)$ dépend linéairement de $u$, terme à terme : $\varphi$ est un endomorphisme. Soit $\lambda \in \mathbb{C}$ et $u \neq 0$ tel que $\varphi(u) = \lambda u$, c'est-à-dire 
    $$u_{0} = \lambda u_{0} \qquad\text{et}\qquad u_{n} + u_{n-1} = 2\lambda u_{n} \quad (n \geqslant 1).$$

    *Cas $\lambda \neq 1$.* La première relation donne $u_{0} = 0$. La seconde s'écrit $(2\lambda - 1)u_{n} = u_{n-1}$. Si $\lambda = \frac{1}{2}$, elle donne $u_{n-1} = 0$ pour tout $n \geqslant 1$, donc $u = 0$. Sinon, $u_{n} = \frac{u_{n-1}}{2\lambda - 1}$, et une récurrence à partir de $u_{0} = 0$ donne $u = 0$. Dans les deux cas, $\lambda$ n'est pas valeur propre.

    *Cas $\lambda = 1$.* La seconde relation devient $u_{n} = u_{n-1}$ : $u$ est constante, et toute suite constante convient. 
    $$\boxed{\operatorname{Sp}(\varphi) = \{1\}, \qquad E_{1}(\varphi) = \{\text{suites constantes}\}}$$
     L'endomorphisme $\varphi$, qui remplace chaque terme par la moyenne avec le précédent, ne laisse invariantes que les suites qu'il ne modifie pas. En dimension infinie, on ne dispose pas de polynôme caractéristique : on résout directement l'équation aux éléments propres, comme pour la dérivation dans le cours.
