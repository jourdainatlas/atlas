  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $E$ un $\mathbb{R}$-espace vectoriel de dimension finie $n \geqslant 1$, et $f \in \mathcal{L}(E)$ tel que $f^{2} = -\mathrm{id}_{E}$.

    **1.** Donner un exemple d'un tel endomorphisme de $\mathbb{R}^{2}$.

    **2.** Montrer que $f$ n'a pas de valeur propre réelle, puis que $n$ est pair. On note $n = 2m$.

    **3.** Montrer que, pour tout $x \in E$, le sous-espace $P_{x} = \mathrm{Vect}\big(x, f(x)\big)$ est stable par $f$, et que c'est un plan si $x \neq 0$.

    **4.** Soit $F$ un sous-espace stable par $f$, et $x \notin F$. Montrer que $F \cap P_{x} = \{0\}$.

    **5.** En déduire qu'il existe des vecteurs $e_{1}, \dots, e_{m}$ tels que $\big(e_{1}, f(e_{1}), \dots, e_{m}, f(e_{m})\big)$ soit une base de $E$, et donner la matrice de $f$ dans cette base.
  corrige: |
    **1.** La rotation d'angle $\frac{\pi}{2}$ convient : 
    $$\boxed{R = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}, \qquad R^{2} = -I_{2}.}$$

    **2.** Si $f(x) = \lambda x$ avec $x \neq 0$ et $\lambda$ réel, alors $-x = f^{2}(x) = \lambda^{2}x$, d'où $\lambda^{2} = -1$, impossible. En passant au déterminant dans $f^{2} = -\mathrm{id}_{E}$, 
    $$(\det f)^{2} = \det(-\mathrm{id}_{E}) = (-1)^{n}.$$
     Le membre de gauche est positif ou nul, donc $(-1)^{n} = 1$. 
    $$\boxed{\operatorname{Sp}_{\mathbb{R}}(f) = \varnothing, \qquad n \text{ est pair}}$$

    **3.** On a $f(x) \in P_{x}$ et $f\big(f(x)\big) = -x \in P_{x}$ : $P_{x}$ est stable. Si $x \neq 0$, la famille $\big(x, f(x)\big)$ est libre, sinon $x$ serait vecteur propre, ce que la question précédente exclut. 
    $$\boxed{P_{x} \text{ est un plan stable par } f \text{ pour tout } x \neq 0.}$$

    **4.** Soit $y = \alpha x + \beta f(x) \in F \cap P_{x}$. Comme $F$ est stable, $f(y) = \alpha f(x) - \beta x \in F$. On combine les deux vecteurs de $F$ pour éliminer $f(x)$ : 
    $$\alpha y - \beta f(y) = (\alpha^{2} + \beta^{2})\,x \in F.$$
     Comme $x \notin F$, on obtient $\alpha^{2} + \beta^{2} = 0$, donc $\alpha = \beta = 0$ et $y = 0$. 
    $$\boxed{F \cap P_{x} = \{0\}}$$

    **5.** On construit les $e_{i}$ de proche en proche. Supposons construits $e_{1}, \dots, e_{k}$, avec $k < m$, tels que la famille $\big(e_{1}, f(e_{1}), \dots, e_{k}, f(e_{k})\big)$ soit libre, et notons $F_{k}$ le sous-espace qu'elle engendre, de dimension $2k < n$. Il est stable par $f$, comme somme des plans stables $P_{e_{i}}$. On choisit $e_{k+1} \notin F_{k}$ ; la question 4 donne $F_{k} \cap P_{e_{k+1}} = \{0\}$, de sorte que $F_{k+1} = F_{k} \oplus P_{e_{k+1}}$ est de dimension $2k + 2$. Pour $k = m$, on obtient une base de $E$, et dans cette base, 
    $$\boxed{\mathrm{Mat}(f) = \operatorname{diag}(R, R, \dots, R), \qquad R = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}}$$
     Tous les endomorphismes vérifiant $f^{2} = -\mathrm{id}_{E}$ sont donc semblables : c'est l'analogue réel de l'exercice 34, où une seule classe subsiste. Un tel $f$ permet de munir $E$ d'une structure de $\mathbb{C}$-espace vectoriel, en posant $\mathrm{i} \cdot x = f(x)$ : c'est l'explication profonde de la parité de la dimension.
- id: "mp-02-36"
  feuille: "f-mp-02"
  numero: 36
  partie: "Diagonalisation"
  etoiles: 2
