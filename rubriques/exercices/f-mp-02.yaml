  noeuds: [rd-trigonalisable, v-valeurs-propres, rd-caracteristique, rd-diagonalisable]
  notions: [endomorphisme-trigonalisable, valeur-propre, polynome-caracteristique, diagonalisable]
  source: "BibM@th, Réduction, exercice 24"
  page_enonce: 10
  page_corrige: 26
  enonce: |
    Soit 
    $$A = \begin{pmatrix} 1 & 0 & 1 \\ -1 & 2 & 1 \\ 1 & -1 & 1 \end{pmatrix}.$$

    **1.** Calculer $\chi_{A}$ et les sous-espaces propres de $A$. La matrice $A$ est-elle diagonalisable ?

    **2.** Soit $v_{1}$ un vecteur propre associé à la valeur propre double, et $v_{3}$ un vecteur propre associé à la valeur propre simple. Trouver un vecteur $v_{2}$ tel que $Av_{2} = v_{2} + v_{1}$, et vérifier que $(v_{1}, v_{2}, v_{3})$ est une base de $\mathbb{R}^{3}$.

    **3.** En déduire une matrice triangulaire supérieure $T$ semblable à $A$, en précisant la matrice de passage $P$, puis calculer $A^{k}$ pour tout $k \in \mathbb{N}$.
  corrige: |
    **1.** Le calcul donne $\chi_{A} = (X - 1)^{2}(X - 2)$. La matrice $A - I_{3} = \begin{pmatrix} 0 & 0 & 1 \\ -1 & 1 & 1 \\ 1 & -1 & 0 \end{pmatrix}$ est de rang $2$, de noyau $\mathbb{R}(1, 1, 0)$, et $E_{2}(A) = \mathbb{R}(1, 0, 1)$. 
    $$\boxed{\dim E_{1}(A) = 1 < 2 = m_{1} : \quad A \text{ n'est pas diagonalisable.}}$$

    **2.** Avec $v_{1} = {(1, 1, 0)}^{T}$ et $v_{3} = {(1, 0, 1)}^{T}$, on résout $(A - I_{3})v_{2} = v_{1}$ : la première ligne donne $z = 1$, la deuxième $-x + y + z = 1$, d'où les solutions ${(\tau, \tau, 1)}^{T}$. On prend $\tau = 0$ : 
    $$\boxed{v_{2} = {(0, 0, 1)}^{T}}$$
     Le déterminant de $(v_{1}, v_{2}, v_{3})$ vaut $1$ : c'est une base.

    **3.** Dans cette base, $Av_{1} = v_{1}$, $Av_{2} = v_{1} + v_{2}$ et $Av_{3} = 2v_{3}$ : 
    $$\boxed{A = PTP^{-1}, \qquad P = \begin{pmatrix} 1 & 0 & 1 \\ 1 & 0 & 0 \\ 0 & 1 & 1 \end{pmatrix}, \qquad T = \begin{pmatrix} 1 & 1 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 2 \end{pmatrix}}$$
     La matrice $T$ est diagonale par blocs ; le bloc $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ a pour puissance $k$-ième $\begin{pmatrix} 1 & k \\ 0 & 1 \end{pmatrix}$, par récurrence immédiate. Avec $P^{-1} = \begin{pmatrix} 0 & 1 & 0 \\ -1 & 1 & 1 \\ 1 & -1 & 0 \end{pmatrix}$, on obtient 
    $$\boxed{A^{k} = P\begin{pmatrix} 1 & k & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 2^{k} \end{pmatrix}P^{-1} = \begin{pmatrix} 2^{k} - k & k + 1 - 2^{k} & k \\ -k & k + 1 & k \\ 2^{k} - 1 & 1 - 2^{k} & 1 \end{pmatrix}}$$
     Pour $k = 1$, on retrouve $A$ ✓. La présence du terme $k$, à croissance polynomiale, est la trace du défaut de diagonalisabilité : pour une matrice diagonalisable, les coefficients de $A^{k}$ sont des combinaisons de puissances $\lambda^{k}$ seulement.
- id: "mp-02-44"
  feuille: "f-mp-02"
  numero: 44
  partie: "Trigonalisation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [trigonalisation, polynôme caractéristique, déterminants]
  noeuds: [rd-trigonalisable, rd-caracteristique, v-det-matrice]
  notions: [endomorphisme-trigonalisable, polynome-caracteristique]
  source: "Réduction #1 (Prost), exercice 23"
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $M \in \mathcal{M}_{n}(\mathbb{K})$ dont le polynôme caractéristique est scindé sur $\mathbb{K}$ : $\chi_{M} = \prod_{i = 1}^{n} (X - \lambda_{i})$, les $\lambda_{i}$ n'étant pas nécessairement distincts.

    **1.** Soit $T$ une matrice triangulaire supérieure de coefficients diagonaux $t_{1}, \dots, t_{n}$, et $k \in \mathbb{N}$. Montrer que $T^{k}$ est triangulaire supérieure, de coefficients diagonaux $t_{1}^{k}, \dots, t_{n}^{k}$.

    **2.** Soit $P \in \mathbb{K}[X]$. Montrer que $\chi_{P(M)} = \prod_{i = 1}^{n} \big(X - P(\lambda_{i})\big)$.

    **3.** En déduire $\operatorname{tr}(M^{k})$ et $\det(M^{k})$ en fonction des $\lambda_{i}$.
  corrige: |
    **1.** Par récurrence sur $k$, en utilisant que le produit de deux matrices triangulaires supérieures est triangulaire supérieure, et que le coefficient diagonal $(i, i)$ du produit est le produit des coefficients diagonaux $(i, i)$ (chapitre 16 de MPSI). 
    $$\boxed{T^{k} \text{ triangulaire supérieure, de diagonale } (t_{1}^{k}, \dots, t_{n}^{k})}$$
     Par combinaison linéaire, $Q(T)$ est triangulaire supérieure de diagonale $\big(Q(t_{1}), \dots, Q(t_{n})\big)$ pour tout polynôme $Q$.

    **2.** Comme $\chi_{M}$ est scindé, $M$ est trigonalisable (théorème 6) : $M = RTR^{-1}$, avec $T$ triangulaire supérieure de diagonale $(\lambda_{1}, \dots, \lambda_{n})$ (proposition 10). Alors $M^{k} = RT^{k}R^{-1}$ pour tout $k$, et par combinaison linéaire $P(M) = R\,P(T)\,R^{-1}$. La matrice $P(T)$ est triangulaire de diagonale $\big(P(\lambda_{i})\big)_{i}$, et deux matrices semblables ont le même polynôme caractéristique. 
    $$\boxed{\chi_{P(M)} = \prod_{i = 1}^{n}\big(X - P(\lambda_{i})\big)}$$

    **3.** Avec $P = X^{k}$ et la proposition 16 : 
    $$\boxed{\operatorname{tr}(M^{k}) = \sum_{i = 1}^{n} \lambda_{i}^{k}, \qquad \det(M^{k}) = \prod_{i = 1}^{n} \lambda_{i}^{k}}$$
     *Piège.* Le résultat porte sur les valeurs propres *avec multiplicité*. Il ne dit pas que les sous-espaces propres se correspondent : par exemple, $E_{1}(M^{2})$ contient à la fois $E_{1}(M)$ et $E_{-1}(M)$. Ce résultat sert aux exercices 50 et 55.
