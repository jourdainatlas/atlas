  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{K})$ non nulle, avec $n \geqslant 2$, et $f$ l'application définie sur $\mathcal{M}_{n}(\mathbb{K})$ par 
    $$f(M) = \operatorname{tr}(A)\,M - \operatorname{tr}(M)\,A.$$
     Montrer que $f$ est un endomorphisme de $\mathcal{M}_{n}(\mathbb{K})$, déterminer son noyau, son image et ses éléments propres, et dire s'il est diagonalisable. On distinguera les cas $\operatorname{tr} A \neq 0$ et $\operatorname{tr} A = 0$.
  corrige: |
    La linéarité de la trace donne celle de $f$. Notons $H = \mathrm{Ker}\,(\operatorname{tr})$, hyperplan de $\mathcal{M}_{n}(\mathbb{K})$ formé des matrices de trace nulle, de dimension $n^{2} - 1$. Deux calculs guident toute l'étude : 
    $$f(A) = \operatorname{tr}(A)A - \operatorname{tr}(A)A = 0, \qquad f(M) = \operatorname{tr}(A)\,M \quad \text{pour } M \in H.$$

    *Cas $\operatorname{tr} A \neq 0$.* Alors $A \notin H$, et $\mathcal{M}_{n}(\mathbb{K}) = H \oplus \mathbb{K} A$. L'endomorphisme $f$ vaut $\operatorname{tr}(A)\,\mathrm{id}$ sur $H$ et $0$ sur $\mathbb{K} A$ : il est diagonalisable, comme recollement de deux homothéties (proposition 2). 
    $$\boxed{\mathrm{Ker}\, f = \mathbb{K} A, \quad \mathrm{Im}\, f = H, \quad \operatorname{Sp}(f) = \{0, \operatorname{tr} A\}, \quad f \text{ diagonalisable}}$$
     Le sous-espace propre associé à $\operatorname{tr} A$ est $H$, de dimension $n^{2} - 1$.

    *Cas $\operatorname{tr} A = 0$.* Alors $f(M) = -\operatorname{tr}(M)A$ : l'image est la droite $\mathbb{K} A$, le noyau est $H$, et 
    $$f \circ f(M) = -\operatorname{tr}(M)\,f(A) = 0.$$
     L'endomorphisme $f$ est nilpotent et non nul, puisqu'il existe $M$ de trace non nulle. 
    $$\boxed{\mathrm{Ker}\, f = H, \quad \mathrm{Im}\, f = \mathbb{K} A, \quad \operatorname{Sp}(f) = \{0\}, \quad f \text{ non diagonalisable}}$$
     Dans le second cas, $f$ est de rang $1$ et de trace nulle : c'est la situation de l'exercice 25, transposée aux endomorphismes. Dans le premier, sa trace vaut $(n^{2} - 1)\operatorname{tr} A \neq 0$.
