  enonce: |
    Soit 
    $$A = \begin{pmatrix} 0 & 1 & 0 \\ -4 & 4 & 0 \\ -2 & 1 & 2 \end{pmatrix}.$$

    **1.** Montrer que $A$ n'est pas diagonalisable.

    **2.** On pose $N = A - 2I_{3}$. Calculer $N^{2}$, puis $A^{n}$ pour tout $n \in \mathbb{N}$.
  corrige: |
    **1.** En développant par rapport à la dernière colonne, on trouve 
    $$\chi_{A} = (X - 2)\big(X(X - 4) + 4\big) = (X - 2)^{3}.$$
     Si $A$ était diagonalisable, de seule valeur propre $2$, elle serait semblable, donc égale, à $2I_{3}$. 
    $$\boxed{A \neq 2I_{3} : \quad A \text{ n'est pas diagonalisable.}}$$

    **2.** On calcule 
    $$N = \begin{pmatrix} -2 & 1 & 0 \\ -4 & 2 & 0 \\ -2 & 1 & 0 \end{pmatrix}, \qquad \boxed{N^{2} = 0.}$$
     Les matrices $2I_{3}$ et $N$ commutent : la formule du binôme s'applique (chapitre 16 de MPSI), et tous les termes contenant $N^{2}$ disparaissent. 
    $$A^{n} = (2I_{3} + N)^{n} = 2^{n}I_{3} + n2^{n-1}N,$$

    $$\boxed{A^{n} = \begin{pmatrix} 2^{n}(1 - n) & n2^{n-1} & 0 \\ -n2^{n+1} & 2^{n}(1 + n) & 0 \\ -n2^{n} & n2^{n-1} & 2^{n} \end{pmatrix}}$$
     Pour $n = 1$, on retrouve $A$ ✓. La décomposition $A = 2I_{3} + N$, en une homothétie et une matrice nilpotente qui commutent, est l'outil le plus rapide dès qu'une matrice n'a qu'une valeur propre.
- id: "mp-02-47"
  feuille: "f-mp-02"
  numero: 47
  partie: "Endomorphismes nilpotents"
