  source: "Réduction #1 (Prost), exercice 7 ; BibM@th, Réduction, exercice 15"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $n \geqslant 2$ et $A \in \mathcal{M}_{n}(\mathbb{R})$ la matrice tridiagonale dont les coefficients sur-diagonaux et sous-diagonaux valent $1$, tous les autres étant nuls. Pour $\theta \in \,]0, \pi[$, on pose $D_{n}(\theta) = \det\big(A + 2\cos(\theta)\,I_{n}\big)$.

    **1.** Établir une relation de récurrence entre $D_{n}$, $D_{n-1}$ et $D_{n-2}$ pour $n \geqslant 3$, en convenant que $D_{1}(\theta) = 2\cos\theta$ et $D_{2}(\theta) = 4\cos^{2}\theta - 1$.

    **2.** En déduire que $D_{n}(\theta) = \dfrac{\sin\big((n+1)\theta\big)}{\sin\theta}$.

    **3.** Déterminer les valeurs propres de $A$. La matrice $A$ est-elle diagonalisable ?

    **4.** Pour $k \in \llbracket 1\,,n \rrbracket$, vérifier que le vecteur de coordonnées $\sin\big(\frac{jk\pi}{n+1}\big)$, $1 \leqslant j \leqslant n$, est un vecteur propre de $A$.
  corrige: |
    **1.** On développe $D_{n}(\theta)$ par rapport à la première ligne, qui contient $2\cos\theta$ et un $1$ ; le second mineur se développe à son tour par rapport à sa première colonne. Il vient 
    $$\boxed{D_{n} = 2\cos(\theta)\,D_{n-1} - D_{n-2} \qquad (n \geqslant 3).}$$
     Les valeurs $D_{1} = 2\cos\theta$ et $D_{2} = 4\cos^{2}\theta - 1$ sont les déterminants de taille $1$ et $2$, et la relation reste vraie pour $n = 2$ si l'on pose $D_{0} = 1$.

    **2.** La suite définie par $s_{n} = \frac{\sin((n + 1)\theta)}{\sin\theta}$ vérifie la même relation, d'après la formule (chapitre 4 de MPSI) 
    $$\sin\big((n + 1)\theta\big) + \sin\big((n - 1)\theta\big) = 2\sin(n\theta)\cos\theta,$$
     et les mêmes valeurs initiales $s_{0} = 1$ et $s_{1} = 2\cos\theta$. Par récurrence double : 
    $$\boxed{D_{n}(\theta) = \frac{\sin\big((n + 1)\theta\big)}{\sin\theta}}$$

    **3.** Pour $\theta \in \,]0, \pi[$, on a $D_{n}(\theta) = \det(A + 2\cos(\theta)I_{n}) = (-1)^{n}\chi_{A}(-2\cos\theta)$. Les nombres $\theta_{k} = \frac{k\pi}{n + 1}$, $1 \leqslant k \leqslant n$, annulent $D_{n}$, et les $-2\cos\theta_{k}$ sont $n$ réels distincts, puisque $\cos$ est injective sur $]0, \pi[$. Ce sont donc toutes les racines de $\chi_{A}$, de degré $n$. Comme $-\cos\theta_{k} = \cos\theta_{n+1-k}$, 
    $$\boxed{\operatorname{Sp}(A) = \Big\{2\cos\frac{k\pi}{n + 1} \;\Big|\; 1 \leqslant k \leqslant n\Big\}, \qquad A \text{ est diagonalisable.}}$$

    **4.** Soit $x_{j} = \sin\big(\frac{jk\pi}{n + 1}\big)$, en convenant que $x_{0} = x_{n+1} = 0$, ce qui est cohérent avec la formule. La $j$-ième coordonnée de $AX$ est $x_{j-1} + x_{j+1}$, et la formule de transformation somme-produit donne 
    $$x_{j-1} + x_{j+1} = 2\sin\Big(\frac{jk\pi}{n + 1}\Big)\cos\Big(\frac{k\pi}{n + 1}\Big) = 2\cos\Big(\frac{k\pi}{n + 1}\Big)\,x_{j}.$$

    $$\boxed{AX = 2\cos\Big(\frac{k\pi}{n + 1}\Big)\,X}$$
     Le vecteur $X$ est non nul, car $x_{1} = \sin\frac{k\pi}{n + 1} \neq 0$. Ces vecteurs sont les modes propres d'une corde vibrante discrétisée en $n$ points, fixée à ses deux extrémités : les coordonnées échantillonnent une sinusoïde.
