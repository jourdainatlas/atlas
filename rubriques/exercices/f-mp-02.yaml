  source: "Réduction (LLG), exercice 9, questions 1 et 2 ; Réduction #1 (Prost), exercice 12"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Une matrice $A = (a_{ij}) \in \mathcal{M}_{n}(\mathbb{R})$ est dite *stochastique* si ses coefficients sont positifs et si la somme des coefficients de chaque ligne vaut $1$ : pour tout $i$, $\sum_{j = 1}^{n} a_{ij} = 1$. Ces matrices décrivent les probabilités de passage d'un état à un autre dans une marche aléatoire à $n$ états.

    **1.** Montrer que $1$ est valeur propre de $A$.

    **2.** Soit $\lambda \in \mathbb{C}$ une valeur propre complexe de $A$, et $X \in \mathbb{C}^{n}$ un vecteur propre associé. En considérant un indice $i$ tel que $|x_{i}|$ soit maximal, montrer que $|\lambda| \leqslant 1$.

    **3.** On suppose de plus que tous les coefficients de $A$ sont strictement positifs. Montrer que si $|\lambda| = 1$, alors $\lambda = 1$, et que $E_{1}(A)$ est la droite engendrée par ${(1, 1, \dots, 1)}^{T}$.
  corrige: |
    **1.** Comme à l'exercice 6, avec $p = 1$ : $A\,{(1, \dots, 1)}^{T} = {(1, \dots, 1)}^{T}$. 
    $$\boxed{1 \in \operatorname{Sp}(A)}$$

    **2.** Soit $AX = \lambda X$ avec $X \neq 0$, et $i$ tel que $|x_{i}| = \max_{j} |x_{j}| > 0$. La $i$-ième ligne de l'égalité donne, par l'inégalité triangulaire et la positivité des $a_{ij}$, 
    $$|\lambda|\,|x_{i}| = \Big|\sum_{j} a_{ij}x_{j}\Big| \leqslant \sum_{j} a_{ij}|x_{j}| \leqslant \Big(\sum_{j} a_{ij}\Big)|x_{i}| = |x_{i}|.$$

    $$\boxed{|\lambda| \leqslant 1}$$

    **3.** Si $|\lambda| = 1$, les deux inégalités sont des égalités. La seconde, $\sum_{j} a_{ij}\big(|x_{i}| - |x_{j}|\big) = 0$, est une somme de termes positifs ou nuls, avec $a_{ij} > 0$ : tous les $|x_{j}|$ valent $|x_{i}|$. La première est un cas d'égalité de l'inégalité triangulaire : les nombres non nuls $a_{ij}x_{j}$ ont tous le même argument, donc les $x_{j}$, de même module, sont tous égaux. Ainsi $X$ est colinéaire à ${(1, \dots, 1)}^{T}$, et $\lambda X = AX = X$ donne $\lambda = 1$. Le même argument, appliqué à un vecteur propre quelconque associé à $1$, montre qu'il est colinéaire à ${(1, \dots, 1)}^{T}$. 
    $$\boxed{|\lambda| = 1 \implies \lambda = 1, \qquad E_{1}(A) = \mathbb{R}\,{(1, \dots, 1)}^{T}}$$
     *Piège.* Sans la stricte positivité, la conclusion est fausse : la matrice stochastique $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, qui fait alterner deux états, a pour valeurs propres $1$ et $-1$. Ce résultat est au cœur de l'étude des marches aléatoires : il explique que les puissances $A^{k}$ convergent lorsque tous les passages sont possibles.
