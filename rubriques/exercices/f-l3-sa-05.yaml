  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 3 (3)-(4) ; Exo7 (fic00031), exercice 18 ; devoir surveillé du 7/11/2014, exercice 2 (1)"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $P \in \mathbb{Z}[X]$ et $\frac{a}{b}$ une racine rationnelle de $P$, avec $a \wedge b = 1$. Montrer que $a - bk$ divise $P(k)$ pour tout $k \in \mathbb{Z}$. Déterminer les racines rationnelles de $X^{3} - 6X^{2} + 15X - 14$ et de $2X^{3} + 3X^{2} + 6X - 4$.

    **2.** Factoriser $X^{3} + X + 1$ et $2X^{3} + 12X^{2} + 13X + 15$ dans $A[X]$, pour $A = \mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ et $\mathbb{C}$.

    **3.** Pour $A = \mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ et $\mathbb{C}$, étudier l'irréductibilité dans $A[X]$ de 
    $$3X^{2} + 15X + 1, \quad X^{5} + 1, \quad 3X^{n} + 45X + 15 \ (n \geqslant 2), \quad X^{4} + X^{3} + X^{2} + X + 1, \quad 6X^{3} + 4X^{2} - 12.$$

    **4.** Les polynômes $t^{3} - t^{2} - 100$ et $t^{3} + t^{2} + 100$ sont-ils réductibles dans $\mathbb{Q}[t]$ ? dans $\mathbb{Z}[t]$ ?
  corrige: |
    **1.** Le polynôme $bX - a$ est primitif et divise $P$ dans $\mathbb{Q}[X]$, donc dans $\mathbb{Z}[X]$ (cours, prop. 5) : $P = (bX - a)Q$ avec $Q \in \mathbb{Z}[X]$, et $P(k) = (bk - a)Q(k)$.

    Pour $X^{3} - 6X^{2} + 15X - 14$, les racines rationnelles sont des diviseurs de $14$ (cours, prop. 8), et $2$ convient : $X^{3} - 6X^{2} + 15X - 14 = (X - 2)(X^{2} - 4X + 7)$, le second facteur ayant un discriminant $-12 < 0$. Seule racine rationnelle : $\boxed{2}$.

    Pour $2X^{3} + 3X^{2} + 6X - 4$, les candidats sont $\pm 1$, $\pm 2$, $\pm 4$, $\pm \frac{1}{2}$, et $\frac{1}{2}$ convient : 
    $$2X^{3} + 3X^{2} + 6X - 4 = (2X - 1)(X^{2} + 2X + 4).$$
     Seule racine rationnelle : $\boxed{\tfrac{1}{2}}$.

    **2.** On traite les deux polynômes l'un après l'autre.

    $\triangleright$ *$X^{3} + X + 1$.* Les candidats $\pm 1$ ne sont pas racines : le polynôme est irréductible dans $\mathbb{Q}[X]$, et dans $\mathbb{Z}[X]$ puisqu'il est unitaire. Sa dérivée $3X^{2} + 1 > 0$ montre qu'il a une seule racine réelle $r \approx -0{,}6823$, d'où, dans $\mathbb{R}[X]$, 
    $$X^{3} + X + 1 = (X - r)(X^{2} + rX + r^{2} + 1),$$
     car $r(r^{2} + 1) = -1$ ; le second facteur, de discriminant $-3r^{2} - 4 < 0$, est irréductible. Dans $\mathbb{C}[X]$, c'est le produit de trois facteurs de degré $1$, les deux racines non réelles étant $\approx 0{,}3412 \pm 1{,}1615\,\mathrm{i}$.

    1.5em

    ![Figure](documents/figures/b33a1fce46791888.svg)

    La fonction $x \mapsto x^{3} + x + 1$ est strictement croissante : son unique racine réelle $r$, en rouge, n'est pas rationnelle, ce qui suffit à l'irréductibilité sur $\mathbb{Q}$, mais donne un facteur de degré $1$ sur $\mathbb{R}$.

    $\triangleright$ *$2X^{3} + 12X^{2} + 13X + 15$.* La racine $-5$ donne $(X + 5)(2X^{2} + 2X + 3)$, le second facteur ayant un discriminant $-20 < 0$. C'est la factorisation dans $\mathbb{Z}[X]$ (facteurs primitifs irréductibles), dans $\mathbb{Q}[X]$ et dans $\mathbb{R}[X]$ ; dans $\mathbb{C}[X]$, $2X^{2} + 2X + 3 = 2\big(X - \frac{-1 + \mathrm{i}\sqrt{5}}{2}\big)\big(X - \frac{-1 - \mathrm{i}\sqrt{5}}{2}\big)$.

    **3.** On rappelle que, sur $\mathbb{R}$, les irréductibles sont de degré $\leqslant 2$, et sur $\mathbb{C}$ de degré $1$ (exercice 2).

    • $3X^{2} + 15X + 1$ : discriminant $213 > 0$, non carré. Irréductible dans $\mathbb{Z}[X]$ (primitif) et $\mathbb{Q}[X]$, réductible dans $\mathbb{R}[X]$ et $\mathbb{C}[X]$.

    • $X^{5} + 1 = (X + 1)(X^{4} - X^{3} + X^{2} - X + 1)$ : réductible dans les quatre anneaux.

    • $3X^{n} + 45X + 15 = 3(X^{n} + 15X + 5)$ : réductible dans $\mathbb{Z}[X]$ ($3$ n'est pas inversible) ; irréductible dans $\mathbb{Q}[X]$ (Eisenstein avec $p = 5$) ; réductible dans $\mathbb{C}[X]$, et dans $\mathbb{R}[X]$ (pour $n = 2$, discriminant $205 > 0$).

    • $X^{4} + X^{3} + X^{2} + X + 1 = \Phi_{5}$ : irréductible dans $\mathbb{Z}[X]$ et $\mathbb{Q}[X]$ (cours, prop. 9) ; réductible dans $\mathbb{R}[X]$, où il vaut $\big(X^{2} - 2\cos\frac{2\pi}{5}X + 1\big)\big(X^{2} - 2\cos\frac{4\pi}{5}X + 1\big)$, et dans $\mathbb{C}[X]$.

    • $6X^{3} + 4X^{2} - 12 = 2(3X^{3} + 2X^{2} - 6)$ : réductible dans $\mathbb{Z}[X]$ ; irréductible dans $\mathbb{Q}[X]$ (Eisenstein avec $p = 2$) ; réductible dans $\mathbb{R}[X]$ et $\mathbb{C}[X]$ (degré $3$).

    **4.** On trouve la racine $5$ de $t^{3} - t^{2} - 100$ et la racine $-5$ de $t^{3} + t^{2} + 100$ : 
    $$t^{3} - t^{2} - 100 = (t - 5)(t^{2} + 4t + 20), \qquad t^{3} + t^{2} + 100 = (t + 5)(t^{2} - 4t + 20).$$
     Les deux sont réductibles dans $\mathbb{Q}[t]$ et dans $\mathbb{Z}[t]$.
