  enonce: |
    **1.** Démontrer que $t^{5} - u^{2}$ est irréductible dans $\mathbb{R}[t, u]$. En déduire que $(t - 2)^{5} - (u + 5)^{2}$ est irréductible dans $\mathbb{R}[t, u]$.

    **2.** Prouver que les idéaux $\langle Y^{5} - YX^{7} + X \rangle$ et $\langle Y^{3} - X^{5} + 1 \rangle$ sont premiers dans $\mathbb{C}[X, Y]$.
  corrige: |
    **1.** Voyons $t^{5} - u^{2}$ comme polynôme en $u$ à coefficients dans l'anneau factoriel $A = \mathbb{R}[t]$ : $-u^{2} + t^{5}$, primitif puisque son coefficient dominant est inversible. Une factorisation en non-inversibles serait un produit de deux facteurs de degré $1$ en $u$, $(\alpha u + \beta)(\gamma u + \delta)$, avec $\alpha\gamma = -1$, donc $\alpha$ inversible : $a = -\beta/\alpha \in \mathbb{R}[t]$ vérifierait $a^{2} = t^{5}$, ce qui est impossible ($2\deg a = 5$).

    L'application $P(t, u) \mapsto P(t - 2, u + 5)$ est un automorphisme de $\mathbb{R}[t, u]$ (de réciproque $P(t, u) \mapsto P(t + 2, u - 5)$) ; elle préserve l'irréductibilité et envoie $t^{5} - u^{2}$ sur $(t - 2)^{5} - (u + 5)^{2}$. *C'est le polynôme de l'exercice 8 de la feuille 2, dont l'idéal est donc premier.*

    **2.** L'anneau $\mathbb{C}[X, Y]$ est factoriel (cours, prop. 6) ; un irréductible y est premier et engendre un idéal premier (chapitre 3, th. 1). Il suffit de prouver l'irréductibilité.

    • $Y^{5} - X^{7}Y + X$, polynôme unitaire en $Y$ sur $\mathbb{C}[X]$ : Eisenstein avec $p = X$, qui divise $-X^{7}$ et $X$, et dont le carré ne divise pas $X$.

    • $Y^{3} - (X^{5} - 1)$ : Eisenstein avec $p = X - 1$, qui divise $X^{5} - 1 = (X - 1)(X^{4} + X^{3} + X^{2} + X + 1)$ une seule fois, le second facteur valant $5$ en $1$.
- id: "l3-sa-05-14"
  feuille: "f-l3-sa-05"
  numero: 14
  partie: "Idéaux de Z[X]"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["idéaux de Z[X]"]
  noeuds: [a-premier-maximal, ac-gauss]
  notions: [ideal-premier, ideal-maximal]
  source: "Exo7 (fic00033), exercice 7"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Les idéaux $\langle 5, X^{2} + 3 \rangle$, $\langle X^{2} + 1, X + 2 \rangle$ et $\langle X^{3} - 1, X^{4} - 1 \rangle$ de $\mathbb{Z}[X]$ sont-ils principaux ?

    **2.** Les idéaux $\langle X, X + 1 \rangle$, $\langle 5, X^{2} + 4 \rangle$ et $\langle X^{2} + 1, X + 2 \rangle$ sont-ils premiers ? maximaux ?
  corrige: |
    On utilise $\mathbb{Z}[X]/\langle p, f \rangle \simeq \mathbb{F}_{p}[X]/\langle \bar{f} \rangle$ (feuille 2, exercice 7).

    **1.** On examine les trois idéaux.

    $\triangleright$ *$\langle 5, X^{2} + 3 \rangle$.* Un générateur $P$ diviserait $5$, donc serait constant, puis diviserait $X^{2} + 3$, donc vaudrait $\pm 1$. Or le quotient $\mathbb{F}_{5}[X]/\langle X^{2} + 3 \rangle$ n'est pas nul : l'idéal n'est pas principal.

    $\triangleright$ *$\langle X^{2} + 1, X + 2 \rangle$.* Comme $X^{2} + 1 = (X + 2)(X - 2) + 5$, il est égal à $\langle 5, X + 2 \rangle$, et le même raisonnement montre qu'il n'est pas principal (son quotient est $\mathbb{F}_{5}$).

    $\triangleright$ *$\langle X^{3} - 1, X^{4} - 1 \rangle$.* On a $X^{4} - 1 - X(X^{3} - 1) = X - 1$, et $X - 1$ divise $X^{3} - 1$ et $X^{4} - 1$ : l'idéal est $\boxed{\langle X - 1 \rangle}$, *principal*. L'énoncé d'origine, qui demandait de prouver le contraire, est erroné.

    **2.** On examine à nouveau les trois idéaux.

    $\triangleright$ *$\langle X, X + 1 \rangle$* contient $1$ : c'est $\mathbb{Z}[X]$, qui n'est ni premier ni maximal (par définition, ces idéaux sont stricts).

    $\triangleright$ *$\langle 5, X^{2} + 4 \rangle$.* Son quotient est $\mathbb{F}_{5}[X]/\langle X^{2} - 1 \rangle$, et $X^{2} - 1 = (X - 1)(X + 1)$ : le quotient n'est pas intègre, l'idéal n'est pas premier.

    $\triangleright$ *$\langle X^{2} + 1, X + 2 \rangle = \langle 5, X + 2 \rangle$.* Son quotient $\mathbb{F}_{5}[X]/\langle X + 2 \rangle \simeq \mathbb{F}_{5}$ est un corps : l'idéal est maximal, donc premier.
