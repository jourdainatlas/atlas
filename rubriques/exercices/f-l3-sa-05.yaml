  enonce: |
    Soit $a_{1}, \dots, a_{n} \in \mathbb{Z}$ deux à deux distincts, et 
    $$f = (X - a_{1})(X - a_{2})\cdots(X - a_{n}) - 1, \qquad g = (X - a_{1})^{2}(X - a_{2})^{2}\cdots(X - a_{n})^{2} + 1.$$
     Montrer que $f$ et $g$ sont irréductibles dans $\mathbb{Q}[X]$.
  corrige: |
    Par la prop. 5 du cours, il suffit de montrer l'irréductibilité dans $\mathbb{Z}[X]$, et un polynôme unitaire de $\mathbb{Z}[X]$ qui se factorise s'écrit comme produit de deux polynômes unitaires de $\mathbb{Z}[X]$ de degrés $\geqslant 1$.

    $\triangleright$ *Le polynôme $f$.* Supposons $f = gh$, $g$ et $h$ unitaires de degrés $\geqslant 1$. Pour chaque $i$, on a $g(a_{i})h(a_{i}) = f(a_{i}) = -1$ dans $\mathbb{Z}$, donc $g(a_{i}) = -h(a_{i}) = \pm 1$. Le polynôme $g + h$ s'annule aux $n$ points distincts $a_{i}$, et il est de degré $< n$, puisque $\deg g$, $\deg h < n$. Donc $g + h = 0$ et $f = -g^{2}$, dont le coefficient dominant est $-1$ : contradiction.

    $\triangleright$ *Le polynôme $g$.* Il est strictement positif sur $\mathbb{R}$. Supposons $g = PQ$, $P$ et $Q$ unitaires de degrés $\geqslant 1$. Ils n'ont pas de racine réelle et sont unitaires, donc strictement positifs sur $\mathbb{R}$. De $P(a_{i})Q(a_{i}) = 1$ on tire $P(a_{i}) = Q(a_{i}) = 1$.

    Si $\deg P < n$, $P - 1$ aurait $n$ racines, donc $P = 1$ : exclu. Ainsi $\deg P \geqslant n$, de même $\deg Q \geqslant n$, et comme $\deg P + \deg Q = 2n$, les deux sont de degré $n$. Alors $P - 1$ et $Q - 1$, unitaires de degré $n$ et nuls aux $a_{i}$, valent $\Pi = \prod(X - a_{i})$, d'où $g = (\Pi + 1)^{2} = \Pi^{2} + 2\Pi + 1$, soit $2\Pi = 0$ : contradiction.

    1.5em

    ![Figure](documents/figures/c69e60e0d7990a14.svg)

    Le cas $n = 2$, $a_{1} = 0$, $a_{2} = 1$ : $f$ vaut $-1$ et $g$ vaut $1$ aux points $a_{i}$ (en rouge). Ces valeurs, inversibles dans $\mathbb{Z}$, contraignent tellement les facteurs éventuels qu'elles les rendent impossibles.
