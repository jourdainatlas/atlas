- id: "l3-sa-05-01"
  feuille: "f-l3-sa-05"
  numero: 1
  partie: "L'anneau A[X]"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["l'anneau A[X]"]
  noeuds: [pol-anneau, pol-division, pol-racines]
  notions: [anneau-polynomes, degre-polynome]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 1 ; Exo7 (fic00031), exercices 1 (1) et 2 ; examen du 15/12/2014, exercice 4 (e)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $A$ un anneau. Montrer que $A[X]$ n'est jamais un corps.

    **2.** Soit $n \geqslant 2$. Montrer que l'idéal $\langle X, n \rangle$ de $\mathbb{Z}[X]$ n'est pas principal.

    **3.** Soit $A$ un anneau intègre. Montrer que les conditions suivantes sont équivalentes : $A[X]$ est euclidien ; $A[X]$ est principal ; $A$ est un corps.

    **4.** L'anneau $\mathbb{Z}[\mathrm{i}][t]$ est-il principal ? factoriel ?
  corrige: |
    **1.** Le polynôme $X$ n'est pas inversible : le terme constant de $XQ$ est nul, donc $XQ \neq 1$. Ainsi $A[X]$ n'est pas un corps, sans aucune hypothèse sur $A$.

    **2.** L'idéal $\langle X, n \rangle$ est formé des polynômes dont le terme constant est multiple de $n$. En effet, le terme constant de $XU + nV$ est $nV(0)$ ; réciproquement, $P = X\sum_{k \geqslant 1}p_{k}X^{k - 1} + p_{0}$ avec $n \mid p_{0}$ est dans l'idéal. En particulier $1 \notin \langle X, n \rangle$.

    Si l'on avait $\langle X, n \rangle = \langle P_{0} \rangle$, alors $P_{0} \mid n$ imposerait $\deg P_{0} = 0$, puis $P_{0} \mid X$ imposerait $P_{0} = \pm 1$, et l'idéal serait $\mathbb{Z}[X]$ : contradiction.

    **3.** Si $A$ est un corps, $A[X]$ est euclidien pour le degré, donc principal (chapitre 3, th. 3).

    Réciproquement, supposons $A[X]$ principal. L'idéal $\langle X \rangle$ est premier, car $A[X]/\langle X \rangle \simeq A$ est intègre (feuille 2, exercice 4), et non nul. Dans un anneau principal, un idéal premier non nul est maximal (chapitre 3, th. 2) : $A \simeq A[X]/\langle X \rangle$ est un corps.

    *C'est la promesse du chapitre 5 du cours.* La question 2 en est le cas $A = \mathbb{Z}$, $a = n$ non inversible.

    **4.** L'anneau $\mathbb{Z}[\mathrm{i}]$ est principal (feuille 3, exercice 7), donc factoriel, et $\mathbb{Z}[\mathrm{i}][t]$ est factoriel (cours, th. 2). Il n'est pas principal, par la question 3, puisque $\mathbb{Z}[\mathrm{i}]$ n'est pas un corps. Il est noethérien (feuille 4, exercice 1).
- id: "l3-sa-05-02"
  feuille: "f-l3-sa-05"
  numero: 2
  partie: "L'anneau A[X]"
