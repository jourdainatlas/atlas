  source: "Exo7 (fic00033), exercices 2 et 3 (2)-(3)"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $A$ un anneau factoriel, $\pi \in A$ irréductible et $f \in A[X]$ primitif de degré $\geqslant 1$, dont le coefficient dominant n'est pas divisible par $\pi$. On suppose que la réduction de $f$ modulo $\pi$ est irréductible dans $(A/\langle \pi \rangle)[X]$. Montrer que $f$ est irréductible dans $A[X]$.

    **2.** Montrer que $f = Y^{7} + Y^{6} + 7Y^{4} + XY^{3} + 3X^{2}Y^{2} - 5Y + X^{2} + X + 1$ est irréductible dans $\mathbb{Q}[X, Y]$. *On le verra comme un polynôme en $X$ à coefficients dans $\mathbb{Q}[Y]$.*

    **3.** Le polynôme $g = X^{2}Y^{3} + X^{2}Y^{2} + Y^{3} - 2XY^{2} + Y^{2} + X - 1$ est-il irréductible dans $\mathbb{C}[X, Y]$ ? dans $\mathbb{F}_{2}[X, Y]$ ?
  corrige: |
    **1.** Notons $\bar{h}$ la réduction modulo $\pi$. L'anneau $A/\langle \pi \rangle$ est intègre, $\pi$ étant premier ($A$ factoriel), et les inversibles de $(A/\langle \pi \rangle)[X]$ sont des constantes.

    Supposons $f = gh$ avec $g$, $h$ non inversibles. Comme $f$ est primitif, aucun facteur n'est une constante non inversible : $\deg g$, $\deg h \geqslant 1$. Le coefficient dominant de $f$, produit de ceux de $g$ et $h$, n'est pas divisible par $\pi$ ; ceux de $g$ et $h$ non plus, donc $\deg\bar{g} = \deg g \geqslant 1$ et $\deg\bar{h} = \deg h \geqslant 1$. Alors $\bar{f} = \bar{g}\bar{h}$ est réductible : contradiction.

    **2.** Prenons $A = \mathbb{Q}[Y]$, factoriel, et $\pi = Y$. Comme polynôme en $X$, 
    $$f = (3Y^{2} + 1)X^{2} + (Y^{3} + 1)X + (Y^{7} + Y^{6} + 7Y^{4} - 5Y + 1).$$

    • *$f$ est primitif.* Le polynôme $3Y^{2} + 1$ est irréductible dans $\mathbb{Q}[Y]$ (pas de racine), et il ne divise pas $Y^{3} + 1 = (3Y^{2} + 1)\frac{Y}{3} + 1 - \frac{Y}{3}$ : le contenu vaut $1$.

    • Le coefficient dominant $3Y^{2} + 1$ n'est pas divisible par $Y$.

    • La réduction modulo $Y$ est $X^{2} + X + 1 \in \mathbb{Q}[X]$, irréductible (pas de racine rationnelle).

    Par la question 1, $f$ est irréductible dans $\mathbb{Q}[Y][X] = \mathbb{Q}[X, Y]$.

    **3.** *Dans $\mathbb{C}[X, Y]$.* Comme polynôme en $Y$ à coefficients dans $\mathbb{C}[X]$, 
    $$g = (X^{2} + 1)Y^{3} + (X - 1)^{2}Y^{2} + (X - 1).$$
     Le critère d'Eisenstein s'applique avec l'irréductible $X - 1$ de $\mathbb{C}[X]$ : il ne divise pas $X^{2} + 1$ (qui vaut $2$ en $1$), il divise $(X - 1)^{2}$, le coefficient nul de $Y$ et le terme constant $X - 1$, dont le carré ne divise pas $X - 1$. Comme $g$ est primitif, il est irréductible.

    *Dans $\mathbb{F}_{2}[X, Y]$*, on a $X^{2} + 1 = (X + 1)^{2}$ et $-2XY^{2} = 0$, donc 
    $$g = (X + 1)^{2}Y^{2}(Y + 1) + (X + 1) = (X + 1)\big((X + 1)Y^{2}(Y + 1) + 1\big)$$
     est réductible. *Le critère d'Eisenstein tombe en défaut précisément parce que $X + 1$ divise le coefficient dominant.*
- id: "l3-sa-05-09"
  feuille: "f-l3-sa-05"
  numero: 9
  partie: "Critères d'irréductibilité"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["critères d'irréductibilité"]
  noeuds: [pol-eisenstein, pol-racines]
  notions: [polynome-irreductible]
  source: "TD Algèbre 4, feuille 4 (2014-15), exercice 3 (1)-(2) ; Exo7 (fic00031), exercices 5 (1), (2), (4) et 6 ; devoir surveillé du 7/11/2014, exercice 2 (3) (a)-(b)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Le critère de la prop. 7 du cours (degré $2$ ou $3$, pas de racine) reste-t-il vrai en degré $\geqslant 4$ ? Que devient-il dans $\mathbb{Z}[X]$ ?

    **2.** Déterminer les polynômes unitaires irréductibles de degré au plus $5$ de $\mathbb{F}_{2}[X]$. Le polynôme $X^{5} + X^{3} + 1$ est-il irréductible ? Factoriser $(X^{4} + X^{2} + 1)(X^{5} + X^{4} + X^{2} + 1)$ dans $\mathbb{F}_{2}[X]$.

    **3.** Déterminer les polynômes unitaires irréductibles de degré au plus $3$ de $\mathbb{F}_{3}[X]$, puis leur nombre en degré $4$. Décomposer $X^{2} + X + 1$, $X^{3} + X + 2$ et $X^{4} + X^{3} + X + 1$ en facteurs irréductibles dans $\mathbb{F}_{3}[X]$.
  corrige: |
    **1.** En degré $\geqslant 4$, le critère est faux : $(X^{2} + 1)^{2}$ n'a pas de racine dans $\mathbb{Q}$ et n'est pas irréductible. Dans $\mathbb{Z}[X]$, il faut tenir compte des constantes : $2X^{2} + 2 = 2(X^{2} + 1)$ n'a pas de racine rationnelle et n'est pas irréductible. La version juste est : *un polynôme primitif de degré $2$ ou $3$ de $\mathbb{Z}[X]$ est irréductible si et seulement s'il n'a pas de racine dans $\mathbb{Q}$* (cours, prop. 5 et 7).

    **2.** Un polynôme de $\mathbb{F}_{2}[X]$ n'a pas de racine si et seulement si son terme constant vaut $1$ (pas de racine $0$) et son nombre de termes est impair (pas de racine $1$).

    • Degré $1$ : $X$, $X + 1$.

    • Degré $2$ : $X^{2} + X + 1$.

    • Degré $3$ : $X^{3} + X + 1$, $X^{3} + X^{2} + 1$.

    • Degré $4$ : sans racine, il ne doit pas être le carré $(X^{2} + X + 1)^{2} = X^{4} + X^{2} + 1$ ; il reste $X^{4} + X + 1$, $X^{4} + X^{3} + 1$ et $X^{4} + X^{3} + X^{2} + X + 1$.

    • Degré $5$ : parmi les $8$ polynômes sans racine, on retire les deux produits 
    $$(X^{2} + X + 1)(X^{3} + X + 1) = X^{5} + X^{4} + 1, \qquad (X^{2} + X + 1)(X^{3} + X^{2} + 1) = X^{5} + X + 1.$$
     Il reste $X^{5} + X^{2} + 1$, $X^{5} + X^{3} + 1$, $X^{5} + X^{3} + X^{2} + X + 1$, $X^{5} + X^{4} + X^{2} + X + 1$, $X^{5} + X^{4} + X^{3} + X + 1$ et $X^{5} + X^{4} + X^{3} + X^{2} + 1$.

    En particulier, $X^{5} + X^{3} + 1$ est irréductible. Enfin, $X^{4} + X^{2} + 1 = (X^{2} + X + 1)^{2}$ et $X^{5} + X^{4} + X^{2} + 1$ a la racine $1$, avec $X^{5} + X^{4} + X^{2} + 1 = (X + 1)(X^{4} + X + 1)$ ; d'où 
    $$(X^{4} + X^{2} + 1)(X^{5} + X^{4} + X^{2} + 1) = \boxed{(X + 1)(X^{2} + X + 1)^{2}(X^{4} + X + 1)}.$$

    **3.** Dans $\mathbb{F}_{3}[X]$ :

    • degré $1$ : $X$, $X + 1$, $X + 2$ ;

    • degré $2$ (sans racine) : $X^{2} + 1$, $X^{2} + X + 2$, $X^{2} + 2X + 2$ ;

    • degré $3$ (sans racine) : $X^{3} + 2X + 1$, $X^{3} + 2X + 2$, $X^{3} + X^{2} + 2$, $X^{3} + X^{2} + X + 2$, $X^{3} + X^{2} + 2X + 1$, $X^{3} + 2X^{2} + 1$, $X^{3} + 2X^{2} + X + 1$, $X^{3} + 2X^{2} + 2X + 2$.

    *Degré $4$.* Parmi les $81$ polynômes unitaires, les réductibles se répartissent selon les degrés de leurs facteurs : quatre facteurs de degré $1$ ($15$ multiensembles de $4$ éléments parmi $3$), deux de degré $1$ et un de degré $2$ ($6 \times 3 = 18$), deux de degré $2$ ($6$), un de degré $1$ et un de degré $3$ ($3 \times 8 = 24$), soit $63$. Il y a donc $\boxed{18}$ irréductibles unitaires de degré $4$ ; le chapitre 8 donnera une formule générale.

    *Factorisations.* $X^{2} + X + 1 = (X - 1)^{2} = (X + 2)^{2}$ ; $X^{3} + X + 2 = (X + 1)(X^{2} + 2X + 2)$ ; et $X^{4} + X^{3} + X + 1 = (X + 1)(X^{3} + 1) = (X + 1)^{4}$, car $X^{3} + 1 = (X + 1)^{3}$ en caractéristique $3$.
