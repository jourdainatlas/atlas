  enonce: |
    *(Idéaux premiers de $\mathbb{Z}[X]$ et de $\mathbb{C}[X, Y]$.)*

    **1.** Soit $B$ un sous-anneau de $A$ et $I$ un idéal premier de $A$. Montrer que $B \cap I$ est un idéal premier de $B$. En déduire que, si $J$ est un idéal premier de $\mathbb{Z}[X]$, alors $J \cap \mathbb{Z} = \{0\}$ ou $p\mathbb{Z}$, avec $p$ premier.

    **2.** On suppose $J \cap \mathbb{Z} = \{0\}$ et $J \neq \{0\}$. Soit $\tilde{J} = J\mathbb{Q}[X]$ l'idéal engendré par $J$ dans $\mathbb{Q}[X]$. Montrer que $\tilde{J} \cap \mathbb{Z}[X] = J$, puis que $J = \langle f \rangle$, avec $f$ irréductible de degré $\geqslant 1$ et primitif.

    **3.** On suppose $J \cap \mathbb{Z} = p\mathbb{Z}$. Montrer que la réduction $r_{p}(J)$ est un idéal premier de $\mathbb{F}_{p}[X]$, puis que $J = \langle p \rangle$ ou $J = \langle p, g \rangle$, avec $g$ unitaire dont la réduction modulo $p$ est irréductible.

    **4.** En déduire la liste des idéaux premiers de $\mathbb{Z}[X]$ ; lesquels sont maximaux ?

    **5.** En s'inspirant de cette méthode, montrer que les idéaux premiers de $\mathbb{C}[X, Y]$ sont $\{0\}$, les idéaux $\langle f \rangle$ avec $f$ irréductible, et les idéaux $\langle X - a, Y - b \rangle$, $a$, $b \in \mathbb{C}$. Lesquels sont maximaux ? *On considérera $J \cap \mathbb{C}[X]$, qui joue le rôle de $J \cap \mathbb{Z}$.*
  corrige: |
    **1.** L'ensemble $B \cap I$ est un idéal de $B$, distinct de $B$ car $1 \notin I$. Si $a$, $b \in B$ et $ab \in B \cap I$, alors $a \in I$ ou $b \in I$ : il est premier. Pour $B = \mathbb{Z}$, $J \cap \mathbb{Z}$ est un idéal premier de $\mathbb{Z}$ : $\{0\}$ ou $p\mathbb{Z}$, $p$ premier.

    **2.** Les éléments de $\tilde{J}$ sont les $\sum q_{i}j_{i}$, $q_{i} \in \mathbb{Q}[X]$, $j_{i} \in J$ ; en réduisant au même dénominateur, ce sont les $\frac{j}{n}$, $j \in J$, $n \in \mathbb{N}^{*}$.

    $\triangleright$ *$\tilde{J} \cap \mathbb{Z}[X] = J$.* Si $P = \frac{j}{n} \in \mathbb{Z}[X]$, alors $nP = j \in J$, et $n \notin J$ (car $J \cap \mathbb{Z} = \{0\}$) : $J$ étant premier, $P \in J$.

    $\triangleright$ *$J$ est principal.* En particulier $1 \notin \tilde{J}$, et l'idéal $\tilde{J}$ de $\mathbb{Q}[X]$ s'écrit $\langle f \rangle$, avec $f \in \mathbb{Z}[X]$ primitif. Alors $f \in \tilde{J} \cap \mathbb{Z}[X] = J$. Pour $P \in J$, $f$ divise $P$ dans $\mathbb{Q}[X]$, donc dans $\mathbb{Z}[X]$ (cours, prop. 5) : $J = f\mathbb{Z}[X]$.

    $\triangleright$ *$f$ est irréductible.* $f$ est un élément premier, donc irréductible (chapitre 3, prop. 3), et il n'est pas constant, puisque $J \cap \mathbb{Z} = \{0\}$.

    **3.** Comme $p \in J$, $J$ contient $\mathrm{Ker}\, r_{p} = p\mathbb{Z}[X]$. La correspondance des idéaux (chapitre 2, th. 3) associe à $J$ l'idéal $r_{p}(J)$ de $\mathbb{F}_{p}[X]$, avec $\mathbb{Z}[X]/J \simeq \mathbb{F}_{p}[X]/r_{p}(J)$ : $r_{p}(J)$ est premier. Dans l'anneau principal $\mathbb{F}_{p}[X]$, c'est $\{0\}$ ou $\langle \bar{g} \rangle$, $\bar{g}$ irréductible unitaire. Dans le premier cas, $J = \mathrm{Ker}\, r_{p} = \langle p \rangle$ ; dans le second, en relevant $\bar{g}$ en $g$ unitaire, $J = r_{p}^{-1}(\langle \bar{g} \rangle) = \langle p, g \rangle$.

    **4.** Les idéaux premiers de $\mathbb{Z}[X]$ sont donc : 
    $$\{0\}, \qquad \langle p \rangle, \qquad \langle f \rangle \ (f \text{ primitif irréductible}, \deg f \geqslant 1), \qquad \langle p, g \rangle \ (\bar{g} \text{ irréductible dans } \mathbb{F}_{p}[X]).$$
     Seuls les $\langle p, g \rangle$ sont maximaux, de quotient $\mathbb{F}_{p}[X]/\langle \bar{g} \rangle$, un corps. Les autres ne le sont pas : $\mathbb{Z}[X]/\langle p \rangle \simeq \mathbb{F}_{p}[X]$ n'est pas un corps, et $\langle f \rangle \subsetneq \langle p, f \rangle \subsetneq \mathbb{Z}[X]$ pour $p$ premier ne divisant pas le coefficient dominant de $f$.

    1.5em

    ![Figure](documents/figures/5ef192491339a07f.svg)

    Une représentation des idéaux premiers de $\mathbb{Z}[X]$ : chaque nombre premier $p$ donne une verticale $\langle p \rangle$, sur laquelle sont posés les idéaux maximaux $\langle p, X - a \rangle$ (seuls ceux de degré $1$ sont dessinés). Un idéal $\langle f \rangle$ traverse toutes les verticales : $\langle X - a \rangle$ est contenu dans $\langle p, X - a \rangle$ pour tout $p$. Les idéaux $\langle p, g \rangle$ avec $\deg\bar{g} \geqslant 2$, comme $\langle 3, X^{2} + 1 \rangle$, ne sont pas représentés.

    **5.** Soit $J$ un idéal premier de $\mathbb{C}[X, Y]$. Par la question 1, $J \cap \mathbb{C}[X]$ est un idéal premier de l'anneau principal $\mathbb{C}[X]$, dont les irréductibles sont les $X - a$ : c'est $\{0\}$ ou $\langle X - a \rangle$.

    $\triangleright$ *Si $J \cap \mathbb{C}[X] = \{0\}$.* La question 2 s'adapte mot pour mot, avec l'anneau factoriel $\mathbb{C}[X]$ à la place de $\mathbb{Z}$ et son corps des fractions $\mathbb{C}(X)$ à la place de $\mathbb{Q}$ : $J = \{0\}$ ou $J = \langle f \rangle$, avec $f$ irréductible.

    $\triangleright$ *Si $J \cap \mathbb{C}[X] = \langle X - a \rangle$.* L'idéal $J$ contient le noyau $\langle X - a \rangle$ du morphisme surjectif $P \mapsto P(a, Y)$ de $\mathbb{C}[X, Y]$ sur $\mathbb{C}[Y]$. Son image est un idéal premier de $\mathbb{C}[Y]$, $\{0\}$ ou $\langle Y - b \rangle$ : donc $J = \langle X - a \rangle$, qui est de la forme $\langle f \rangle$, ou $J = \langle X - a, Y - b \rangle$.

    $\triangleright$ *Idéaux maximaux.* Les $\langle X - a, Y - b \rangle$ sont maximaux, de quotient $\mathbb{C}$. Un idéal $\langle f \rangle$, $f$ irréductible, ne l'est pas. En effet $f$ a un zéro $(a, b)$ : si $f$ ne dépend que de $X$, on prend une racine $a$ et $b$ quelconque ; sinon, on choisit $a$ qui n'annule pas le coefficient dominant en $Y$, et $b$ racine de $f(a, Y)$. Alors $\langle f \rangle \subset \langle X - a, Y - b \rangle$, et l'inclusion est stricte, ce dernier idéal n'étant pas principal (un générateur diviserait les irréductibles non associés $X - a$ et $Y - b$).

    *Ainsi les idéaux maximaux de $\mathbb{C}[X, Y]$ correspondent aux points de $\mathbb{C}^{2}$*, et les idéaux premiers $\langle f \rangle$ aux courbes irréductibles $f = 0$ : c'est le point de départ de la géométrie algébrique.

