  page_enonce: 3
  page_corrige: 6
  enonce: |
    Montrer que les polynômes suivants sont irréductibles dans $\mathbb{Q}[X]$, par réduction modulo un nombre premier bien choisi ou par le critère d'Eisenstein. Lesquels le sont aussi dans $\mathbb{Z}[X]$ ?

    **1.** $5X^{3} + 8X^{2} + 3X + 15$ et $X^{5} + 2X^{3} + 3X^{2} - 6X - 5$ ;

    **2.** $X^{5} - 6X^{3} + 2X^{2} - 4X + 5$ et $7X^{4} + 8X^{3} + 11X^{2} - 24X - 455$ *(on pourra combiner les réductions modulo $2$ et modulo $3$)* ;

    **3.** $X^{4} - 8X^{3} + 12X^{2} - 6X + 2$, $X^{5} - 12X^{3} + 36X - 12$ et $X^{4} - X^{3} + 2X + 1$ ;

    **4.** $X^{5} + 121X^{4} + 1221X^{3} + 12221X^{2} + 122221X + 222222$ ;

    **5.** $t^{2014} + 22t^{44} + 44t^{33} + 66$ et $2015t^{5} + 2014t^{4} + 2013t^{3} + 2012t^{2} + 2011$.
  corrige: |
    On utilise la prop. 10 du cours : si $p$ ne divise pas le coefficient dominant et si $\overline{P}$ est irréductible, $P$ est irréductible dans $\mathbb{Q}[X]$ ; il l'est dans $\mathbb{Z}[X]$ s'il est primitif. Tous les polynômes de l'exercice sont primitifs.

    **1.** Modulo $2$ : $5X^{3} + 8X^{2} + 3X + 15 \equiv X^{3} + X + 1$ et $X^{5} + 2X^{3} + 3X^{2} - 6X - 5 \equiv X^{5} + X^{2} + 1$, irréductibles (exercice 9).

    **2.** Aucune réduction n'est irréductible ; on combine les deux. Pour $P = X^{5} - 6X^{3} + 2X^{2} - 4X + 5$ : 
    $$\overline{P} = (X + 1)(X^{4} + X^{3} + X^{2} + X + 1) \text{ dans } \mathbb{F}_{2}[X], \qquad \overline{P} = (X^{2} + 1)(X^{3} + 2X + 2) \text{ dans } \mathbb{F}_{3}[X].$$
     Si $P = GH$ dans $\mathbb{Z}[X]$ avec $G$, $H$ unitaires de degrés $d$ et $5 - d$, $1 \leqslant d \leqslant 2$, les réductions de $G$ ont aussi le degré $d$. Modulo $2$, les diviseurs de $\overline{P}$ ont pour degrés $0$, $1$, $4$, $5$, ce qui exclut $d = 2$ ; modulo $3$, ce sont $0$, $2$, $3$, $5$, ce qui exclut $d = 1$. Donc $P$ est irréductible.

    1.5em

    ![Figure](documents/figures/dca53f9d95a0619f.svg)

    Degrés possibles d'un diviseur de $P = X^{5} - 6X^{3} + 2X^{2} - 4X + 5$, en bleu, modulo $2$ et modulo $3$. Un facteur de $P$ de degré $1$ ou $2$ (encadré rouge) devrait avoir un degré permis sur les deux lignes : il n'y en a pas.

    Pour $Q = 7X^{4} + 8X^{3} + 11X^{2} - 24X - 455$, dont le coefficient dominant $7$ n'est divisible ni par $2$ ni par $3$ : 
    $$\overline{Q} = (X^{2} + X + 1)^{2} \text{ dans } \mathbb{F}_{2}[X], \qquad \overline{Q} = (X + 2)(X^{3} + 2X + 2) \text{ dans } \mathbb{F}_{3}[X].$$
     Modulo $2$, les degrés des diviseurs sont $0$, $2$, $4$ ; modulo $3$, ils sont $0$, $1$, $3$, $4$. Aucun degré $1$, $2$ ou $3$ n'est commun : $Q$ est irréductible.

    **3.** $X^{4} - 8X^{3} + 12X^{2} - 6X + 2$ : Eisenstein avec $p = 2$ ($4 \nmid 2$). $X^{5} - 12X^{3} + 36X - 12$ : Eisenstein avec $p = 3$ ($9 \nmid 12$). $X^{4} - X^{3} + 2X + 1 \equiv X^{4} + X^{3} + 1 \pmod{2}$, irréductible (exercice 9).

    **4.** Eisenstein avec $p = 11$ : $121 = 11^{2}$, $1221 = 11 \times 111$, $12221 = 11 \times 1111$, $122221 = 11 \times 11111$, $222222 = 11 \times 20202$, et $121 \nmid 222222$, car $222222 = 121 \times 1836 + 66$.

    **5.** $t^{2014} + 22t^{44} + 44t^{33} + 66$ : Eisenstein avec $p = 2$ ($4 \nmid 66$). Pour le second, la réduction modulo $2$ est $t^{5} + t^{3} + 1$, irréductible (exercice 9), et $2 \nmid 2015$.
