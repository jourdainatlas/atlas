  enonce: |
    Soit $A = \mathbb{Z}[\mathrm{i}\sqrt{3}]$ et $K = \operatorname{Frac}(A)$. Montrer que $X^{2} - X + 1$ est irréductible dans $A[X]$, sans l'être dans $K[X]$. Expliquer la contradiction apparente avec la prop. 5 du cours.
  corrige: |
    Les racines de $X^{2} - X + 1$ sont $\omega = \frac{1 + \mathrm{i}\sqrt{3}}{2}$ et $\bar{\omega}$, qui sont dans $K = \mathbb{Q}(\mathrm{i}\sqrt{3})$ mais pas dans $A$. Dans $K[X]$, $X^{2} - X + 1 = (X - \omega)(X - \bar{\omega})$ est réductible.

    Dans $A[X]$, une factorisation en deux non-inversibles serait de l'une des formes suivantes.

    • Une constante $c$ fois un polynôme de degré $2$ : $c$ divise les coefficients $1$, $-1$, $1$, donc est inversible.

    • $(aX + b)(cX + d)$ : alors $ac = 1$, donc $a = \pm 1$, et $-b/a \in A$ serait une racine. Il n'y en a pas.

    Le polynôme est donc irréductible dans $A[X]$.

    *Il n'y a pas de contradiction* : la prop. 5 du cours suppose $A$ factoriel, et $\mathbb{Z}[\mathrm{i}\sqrt{3}]$ ne l'est pas, $2$ y étant irréductible sans être premier (cours, chapitre 3). Les racines $\omega$, $\bar{\omega}$ appartiennent à l'anneau plus gros $\mathbb{Z}[\omega]$, qui, lui, est factoriel.
- id: "l3-sa-05-08"
  feuille: "f-l3-sa-05"
  numero: 8
  partie: "Contenu, lemme de Gauss"
