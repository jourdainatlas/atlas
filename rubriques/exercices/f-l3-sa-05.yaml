  enonce: |
    **1.** Soit $K$ un corps de caractéristique nulle et $P \in K[X]$ non constant. Montrer que $P$ a un facteur irréductible multiple si et seulement si $P \wedge P' \neq 1$, et que $\frac{P}{P \wedge P'}$ est le produit des facteurs irréductibles unitaires distincts de $P$, à une constante près.

    **2.** Trouver les facteurs multiples des polynômes 
    $$X^{6} - 15X^{4} + 8X^{3} + 51X^{2} - 72X + 27 \qquad\text{et}\qquad X^{6} - 2X^{5} - X^{4} - 2X^{3} + 5X^{2} + 4X + 4.$$
  corrige: |
    **1.** Écrivons $P = c\prod_{i}Q_{i}^{e_{i}}$, les $Q_{i}$ irréductibles unitaires distincts. Alors 
    $$P' = c\sum_{i}e_{i}Q_{i}'Q_{i}^{e_{i} - 1}\prod_{j \neq i}Q_{j}^{e_{j}}.$$
     Chaque $Q_{i}^{e_{i} - 1}$ divise $P'$. En revanche $Q_{i}^{e_{i}}$ ne le divise pas : il faudrait que $Q_{i}$ divise $e_{i}Q_{i}'\prod_{j \neq i}Q_{j}^{e_{j}}$, donc $Q_{i}'$ (les $Q_{j}$ lui sont premiers entre eux, et $e_{i} \neq 0$ en caractéristique nulle), ce qui est impossible car $Q_{i}' \neq 0$ est de degré $< \deg Q_{i}$.

    Ainsi $P \wedge P' = \prod_{i}Q_{i}^{e_{i} - 1}$, qui est différent de $1$ si et seulement si un $e_{i}$ est $\geqslant 2$, et $\frac{P}{P \wedge P'} = c\prod_{i}Q_{i}$.

    **2.** L'algorithme d'Euclide donne, pour le premier polynôme, 
    $$P \wedge P' = X^{3} + X^{2} - 5X + 3 = (X - 1)^{2}(X + 3),$$
     d'où 
    $$X^{6} - 15X^{4} + 8X^{3} + 51X^{2} - 72X + 27 = \boxed{(X - 1)^{3}(X + 3)^{2}}(X - 3).$$
     Pour le second, $P \wedge P' = X^{3} - X^{2} - X - 2 = (X - 2)(X^{2} + X + 1)$, d'où 
    $$X^{6} - 2X^{5} - X^{4} - 2X^{3} + 5X^{2} + 4X + 4 = \boxed{(X - 2)^{2}(X^{2} + X + 1)^{2}}.$$
- id: "l3-sa-05-06"
  feuille: "f-l3-sa-05"
  numero: 6
  partie: "Contenu, lemme de Gauss"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["contenu, lemme de Gauss"]
  noeuds: [ac-contenu, ac-gauss]
  notions: [contenu-factoriel, polynome-primitif-factoriel]
  source: "Exo7 (fic00032), exercice 1 (4)-(5) ; Exo7 (fic00031), exercice 14"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $f$, $g \in \mathbb{Z}[X]$ primitifs, et $d = \alpha d_{0}$ un PGCD de $f$ et $g$ dans $\mathbb{Q}[X]$, avec $\alpha \in \mathbb{Q}$ et $d_{0} \in \mathbb{Z}[X]$ primitif. Montrer que $d_{0}$ est un PGCD de $f$ et $g$ dans $\mathbb{Z}[X]$.

    **2.** Soit $f = \mathrm{cont}(f)f_{0}$ et $g = \mathrm{cont}(g)g_{0}$ dans $\mathbb{Z}[X]$, non nuls. Montrer que 
    $$\mathrm{pgcd}_{\mathbb{Z}[X]}(f, g) = \mathrm{pgcd}_{\mathbb{Z}}\big(\mathrm{cont}(f), \mathrm{cont}(g)\big) \cdot \mathrm{pgcd}_{\mathbb{Z}[X]}(f_{0}, g_{0}).$$

    **3.** Déterminer le PGCD de $f = X^{4} + X^{3} - 3X^{2} - 4X - 1$ et $g = X^{3} + X^{2} - X - 1$ dans $\mathbb{Z}[X]$.
  corrige: |
    **1.** Le polynôme $d_{0}$, primitif, divise $f$ et $g$ dans $\mathbb{Q}[X]$, donc dans $\mathbb{Z}[X]$ (cours, prop. 5).

    Soit $e \in \mathbb{Z}[X]$ un diviseur commun de $f$ et $g$ dans $\mathbb{Z}[X]$. Son contenu divise celui de $f$, qui vaut $1$ : $e$ est primitif. Comme $e$ divise $f$ et $g$ dans $\mathbb{Q}[X]$, il divise leur PGCD $d$, donc $d_{0}$, dans $\mathbb{Q}[X]$, puis dans $\mathbb{Z}[X]$ par la prop. 5. Ainsi $d_{0}$ est un PGCD dans $\mathbb{Z}[X]$.

    **2.** L'anneau $\mathbb{Z}[X]$ est factoriel, et ses irréductibles sont les nombres premiers $p$ et les polynômes primitifs irréductibles $q$ de degré $\geqslant 1$ (cours, th. 2). Par le lemme de Gauss, $v_{p}(f) = v_{p}(\mathrm{cont}(f))$, et $v_{q}(f) = v_{q}(f_{0})$. Le PGCD se calcule avec les minima des valuations (chapitre 3, prop. 4) : les facteurs $p$ donnent $\mathrm{pgcd}(\mathrm{cont}(f), \mathrm{cont}(g))$, les facteurs $q$ donnent $\mathrm{pgcd}(f_{0}, g_{0})$.

    **3.** Les deux polynômes sont primitifs. On a $f - Xg = -2X^{2} - 3X - 1 = -(2X + 1)(X + 1)$, et $g = (X - 1)(X + 1)^{2}$. Comme $2X + 1$ ne divise pas $g$ ($g(-\frac{1}{2}) = -\frac{3}{8} \neq 0$), le PGCD dans $\mathbb{Q}[X]$ est $X + 1$, qui est primitif : c'est aussi le PGCD dans $\mathbb{Z}[X]$. On vérifie $f = (X + 1)(X^{3} - 3X - 1)$.
