  notions: [anneau-polynomes, degre-polynome]
  source: "Exo7 (fic00031), exercice 1 (2)-(4)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $A$ un anneau intègre. Montrer que les polynômes unitaires de degré $1$ de $A[X]$ sont irréductibles.

    **2.** Décrire les polynômes irréductibles de $\mathbb{C}[X]$ et de $\mathbb{R}[X]$. *On admet le théorème de d'Alembert-Gauss, démontré au chapitre 7.*

    **3.** Soit $K$ un corps. Montrer que $K[X]$ contient une infinité de polynômes unitaires irréductibles.
  corrige: |
    **1.** Le polynôme $X + a$ n'est pas inversible, les inversibles de $A[X]$ étant les constantes inversibles (cours, prop. 2). Si $X + a = PQ$, alors $\deg P + \deg Q = 1$, et l'un des facteurs, disons $P = c$, est constant ; comme $c$ multiplié par le coefficient dominant de $Q$ vaut $1$, $c$ est inversible.

    **2.** *Dans $\mathbb{C}[X]$*, tout polynôme de degré $\geqslant 2$ a une racine $z$ (d'Alembert-Gauss), donc le facteur $X - z$ : les irréductibles sont les polynômes de degré $1$.

    *Dans $\mathbb{R}[X]$*, les polynômes de degré $1$ et ceux de degré $2$ sans racine réelle (discriminant $< 0$) sont irréductibles (cours, prop. 7). Réciproquement, soit $P$ irréductible de degré $\geqslant 2$. Il n'a pas de racine réelle, mais une racine complexe $z \notin \mathbb{R}$, et $\bar{z}$ est aussi racine, $P$ étant réel. Le polynôme réel $(X - z)(X - \bar{z}) = X^{2} - 2\,\mathrm{Re}(z)X + |z|^{2}$ divise $P$ dans $\mathbb{C}[X]$, donc dans $\mathbb{R}[X]$ (le reste de la division dans $\mathbb{R}[X]$ est aussi celui dans $\mathbb{C}[X]$). Comme $P$ est irréductible, il lui est associé : il est de degré $2$.

    **3.** Il y a au moins un irréductible unitaire, $X$. Supposons qu'il n'y en ait qu'un nombre fini, $P_{1}, \dots, P_{k}$, et posons $P = P_{1}\cdots P_{k} + 1$, non constant. Il a un facteur irréductible unitaire ($K[X]$ est factoriel), égal à un $P_{i}$. Alors $P_{i}$ divise $P - P_{1}\cdots P_{k} = 1$ : contradiction. *C'est l'argument d'Euclide pour les nombres premiers.*
- id: "l3-sa-05-03"
  feuille: "f-l3-sa-05"
  numero: 3
  partie: "L'anneau A[X]"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["l'anneau A[X]"]
  noeuds: [pol-anneau, pol-division, pol-racines]
  notions: [anneau-polynomes, degre-polynome]
  source: "Exo7 (fic00031), exercices 3, 4 et 9"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $A$ un anneau et $f \in A[X]$ tel que $X - 1$ divise $f(X^{n})$. Montrer que $X^{n} - 1$ divise $f(X^{n})$.

    **2.** Pour $n$, $m \geqslant 2$, déterminer le reste de la division euclidienne de $(X - 2)^{m} + (X - 1)^{n} - 1$ par $(X - 1)(X - 2)$ dans $\mathbb{Z}[X]$.

    **3.** Soit $f$, $g \in \mathbb{Q}[X]$, $f$ irréductible. On suppose qu'il existe $\alpha \in \mathbb{C}$ tel que $f(\alpha) = g(\alpha) = 0$. Montrer que $f$ divise $g$.
  corrige: |
    **1.** En évaluant en $1$, $f(1) = 0$, donc $f = (X - 1)Q$ (cours, prop. 4), et $f(X^{n}) = (X^{n} - 1)Q(X^{n})$.

    **2.** Le diviseur est unitaire : la division existe dans $\mathbb{Z}[X]$ (cours, prop. 3), avec un reste $R = aX + b$. En évaluant en $1$ et en $2$ : 
    $$(-1)^{m} - 1 = a + b, \qquad 0 = 2a + b.$$
     D'où $\boxed{R = \big(1 - (-1)^{m}\big)(X - 2)}$ : $R = 0$ si $m$ est pair, $R = 2X - 4$ si $m$ est impair, quel que soit $n$.

    **3.** Si $f$ ne divisait pas $g$, alors, $f$ étant irréductible, $f \wedge g = 1$, et il existerait $u$, $v \in \mathbb{Q}[X]$ tels que $uf + vg = 1$. En évaluant en $\alpha$, on obtiendrait $0 = 1$. Donc $f \mid g$. *Un polynôme irréductible sur $\mathbb{Q}$ est déterminé, à une constante près, par n'importe laquelle de ses racines complexes* : c'est la notion de polynôme minimal du chapitre 7.
- id: "l3-sa-05-04"
  feuille: "f-l3-sa-05"
  numero: 4
  partie: "L'anneau A[X]"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["l'anneau A[X]"]
  noeuds: [pol-anneau, pol-division, pol-racines]
  notions: [anneau-polynomes, degre-polynome]
  source: "Exo7 (fic00031), exercices 17 et 19"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $P \in \mathbb{Z}[X]$.

    **1.** On suppose $P(0)$ et $P(1)$ impairs. Montrer que $P$ n'a pas de racine dans $\mathbb{Z}$. *On pourra réduire modulo $2$.* Plus généralement, soit $n \geqslant 1$ tel qu'aucun des entiers $P(0), \dots, P(n - 1)$ ne soit divisible par $n$ ; montrer que $P$ n'a pas de racine dans $\mathbb{Z}$.

    **2.** Soit $n \in \mathbb{N}$ et $m = P(n)$. Montrer que $m$ divise $P(n + km)$ pour tout $k \in \mathbb{Z}$. En déduire qu'aucun polynôme non constant $P \in \mathbb{Z}[X]$ ne prend que des valeurs premières sur $\mathbb{N}$.
  corrige: |
    **1.** Si $a \equiv b \pmod{n}$, alors $P(a) \equiv P(b) \pmod{n}$, car $a^{k} - b^{k}$ est multiple de $a - b$. Si $r$ était une racine entière, $P(r) = 0$ serait pair, alors que $P(r) \equiv P(0)$ ou $P(1)$ est impair. De même, $P(r) \equiv P(r_{0}) \pmod{n}$, où $r_{0} \in \{0, \dots, n - 1\}$ est le reste de $r$, et $P(r_{0})$ n'est pas multiple de $n$, alors que $P(r) = 0$ l'est.

    **2.** On a $n + km \equiv n \pmod{m}$, donc $P(n + km) \equiv P(n) = m \equiv 0 \pmod{m}$.

    Supposons que $P$ ne prenne que des valeurs premières sur $\mathbb{N}$, et soit $m = P(0)$, premier. Pour tout $k \in \mathbb{N}$, $P(km)$ est premier et multiple de $m$, donc égal à $m$. Le polynôme $P - m$ a alors une infinité de racines : il est nul, et $P$ est constant.
