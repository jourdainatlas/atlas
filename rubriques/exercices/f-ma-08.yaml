- id: "ma-08-01"
  feuille: "f-ma-08"
  numero: 1
  partie: "Limite d'une fonction en un point"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["limite d'une fonction", limites]
  noeuds: [de-limite]
  notions: [limite-fonction]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Étudier l'existence et donner la valeur éventuelle des limites suivantes.

    **(a)** $\dfrac{1}{1 - x} - \dfrac{2}{1 - x^{2}}$ en $1$

    **(b)** $\dfrac{\sqrt{x} - 1}{x - 1}$ en $1$

    **(c)** $\sqrt{x^{2} + 2x} - x$ en $+\infty$

    **(d)** $\sqrt{x + \sqrt{x}} - \sqrt{x}$ en $+\infty$

    **(e)** $\dfrac{\sqrt{2x^{2} + 5x + 9} - 3}{x}$ en $0$

    **(f)** $\dfrac{\sqrt{x + 3} - \sqrt{4x + 3}}{\sqrt{x + 4} - \sqrt{2x + 4}}$ en $+\infty$

    **(g)** $\dfrac{x + \cos x}{x + \sin x}$ en $+\infty$

    **(h)** $\dfrac{4\sin^{2}x + 3\cos(5x)}{x}$ en $+\infty$

    **(i)** $\dfrac{x\sin(x^{2})}{1 + x^{2}}$ en $+\infty$

    **(j)** $x^{5}\mathrm{e}^{-x^{2}}$ en $+\infty$

    **(k)** $\dfrac{\mathrm{e}^{3x} + 2x + 7}{\mathrm{e}^{x} + \mathrm{e}^{-x}}$ en $+\infty$

    **(l)** $\dfrac{\sqrt{x + \sqrt{x + \sqrt{x}}}}{\sqrt{x + 1}}$ en $+\infty$
  corrige: |
    Toutes ces limites se ramènent aux opérations du théorème 2 du cours, après une transformation qui lève la forme indéterminée : réduction au même dénominateur, quantité conjuguée, mise en facteur du terme dominant, ou encadrement.

    **(a)** On réduit au même dénominateur : pour $x \neq \pm 1$, 
    $$\frac{1}{1 - x} - \frac{2}{(1 - x)(1 + x)} = \frac{x - 1}{(1 - x)(1 + x)} = -\frac{1}{1 + x},$$
     qui tend vers $-\frac{1}{2}$ quand $x$ tend vers $1$ : $\boxed{\text{la limite vaut } -\frac{1}{2}}$. **(b)** On factorise $x - 1 = (\sqrt{x} - 1)(\sqrt{x} + 1)$ : l'expression vaut $\frac{1}{\sqrt{x} + 1}$, et 
    $$\boxed{\text{la limite vaut } \frac{1}{2}}.$$
     C'est aussi le taux d'accroissement de la racine carrée en $1$, de dérivée $\frac{1}{2\sqrt{1}}$.

    **(c)** Par la quantité conjuguée, pour $x > 0$, 
    $$\sqrt{x^{2} + 2x} - x = \frac{2x}{\sqrt{x^{2} + 2x} + x} = \frac{2}{\sqrt{1 + \frac{2}{x}} + 1} \xrightarrow[x \to +\infty]{} \boxed{1}.$$
     **(d)** De même, $\sqrt{x + \sqrt{x}} - \sqrt{x} = \dfrac{\sqrt{x}}{\sqrt{x + \sqrt{x}} + \sqrt{x}} = \dfrac{1}{\sqrt{1 + 1/\sqrt{x}} + 1}$, qui tend vers $\boxed{\frac{1}{2}}$.

    **(e)** On multiplie par la quantité conjuguée du numérateur : 
    $$\frac{\sqrt{2x^{2} + 5x + 9} - 3}{x} = \frac{2x^{2} + 5x}{x\big(\sqrt{2x^{2} + 5x + 9} + 3\big)} = \frac{2x + 5}{\sqrt{2x^{2} + 5x + 9} + 3} \xrightarrow[x \to 0]{} \boxed{\frac{5}{6}}.$$
     **(f)** On multiplie numérateur et dénominateur par les deux quantités conjuguées : 
    $$\sqrt{x + 3} - \sqrt{4x + 3} = \frac{-3x}{\sqrt{x + 3} + \sqrt{4x + 3}}, \qquad \sqrt{x + 4} - \sqrt{2x + 4} = \frac{-x}{\sqrt{x + 4} + \sqrt{2x + 4}}.$$
     Le quotient vaut donc $3\,\dfrac{\sqrt{x + 4} + \sqrt{2x + 4}}{\sqrt{x + 3} + \sqrt{4x + 3}}$ ; en divisant par $\sqrt{x}$ en haut et en bas, il tend vers $3 \times \frac{1 + \sqrt{2}}{1 + 2}$, soit $\boxed{1 + \sqrt{2}}$.

    **(g)** On factorise par $x$ : $\dfrac{1 + \frac{\cos x}{x}}{1 + \frac{\sin x}{x}}$, et $\frac{\cos x}{x}$, $\frac{\sin x}{x}$ tendent vers $0$ en $+\infty$, comme produits d'une fonction bornée par une fonction de limite nulle. La limite vaut $\boxed{1}$.

    **(h)** Le numérateur est borné par $4 + 3 = 7$ : l'expression est majorée en valeur absolue par $\frac{7}{x}$, et l'encadrement (théorème 5) donne $\boxed{0}$.

    **(i)** De même, $\Big|\dfrac{x\sin(x^{2})}{1 + x^{2}}\Big| \leqslant \dfrac{x}{1 + x^{2}} \leqslant \dfrac{1}{x}$ pour $x > 0$, d'où $\boxed{0}$. L'oscillation de $\sin(x^{2})$ ne gêne pas, car elle est écrasée par le facteur qui tend vers $0$.

    **(j)** On pose $t = x^{2}$ : $x^{5}\mathrm{e}^{-x^{2}} = t^{5/2}\mathrm{e}^{-t}$, qui tend vers $0$ quand $t \to +\infty$ par croissances comparées (chapitre 5). Par composition (théorème 3), 
    $$\boxed{\lim\limits_{x \to +\infty} x^{5}\mathrm{e}^{-x^{2}} = 0}.$$

    **(k)** On met en facteur les termes dominants : 
    $$\frac{\mathrm{e}^{3x} + 2x + 7}{\mathrm{e}^{x} + \mathrm{e}^{-x}} = \mathrm{e}^{2x}\,\frac{1 + (2x + 7)\mathrm{e}^{-3x}}{1 + \mathrm{e}^{-2x}},$$
     où la fraction tend vers $1$ : 
    $$\boxed{\text{la limite vaut } +\infty}.$$

    **(l)** On divise numérateur et dénominateur par $\sqrt{x}$ : 
    $$\frac{\sqrt{x + \sqrt{x + \sqrt{x}}}}{\sqrt{x + 1}} = \frac{\sqrt{1 + \sqrt{\frac{1}{x} + \frac{1}{x^{3/2}}}}}{\sqrt{1 + \frac{1}{x}}} \xrightarrow[x \to +\infty]{} \boxed{1}.$$

    *À retenir.* Toutes ces valeurs ont été vérifiées numériquement. Avant tout calcul, on identifie le type de forme indéterminée : c'est lui qui dicte la transformation.
- id: "ma-08-02"
  feuille: "f-ma-08"
  numero: 2
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["limite d'une fonction", limites, limites à gauche et à droite]
  noeuds: [de-limite]
  notions: [limite-fonction]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Calculer les limites suivantes, en faisant apparaître un taux d'accroissement ou une limite usuelle du cours.

    **(a)** $\Big(1 + \dfrac{1}{x}\Big)^{x}$ en $+\infty$

    **(b)** $(1 + x)^{1/x}$ en $0^{+}$

    **(c)** $x^{1/x}$ en $+\infty$

    **(d)** $\dfrac{\cos(3x) - \cos x}{\sin(x^{2})}$ en $0$

    **(e)** $\tan x \tan(2x)$ en $\dfrac{\pi}{2}$

    **(f)** $x\big(\mathrm{e}^{1/x} - \cos\frac{1}{x}\big)$ en $+\infty$

    **(g)** $\dfrac{1 - x}{\operatorname{Arccos} x}$ en $1^{-}$

    **(h)** $\dfrac{\sqrt{1 + x} - 1 - \frac{x}{2}}{x^{2}}$ en $0$

    Pour (h), on multipliera par une quantité conjuguée bien choisie.
  corrige: |
    Les quatre premières limites se ramènent à $\lim\limits_{u \to 0} \frac{\ln(1 + u)}{u} = 1$, qui est le taux d'accroissement du logarithme en $1$, sa dérivée y valant $1$. On écrit pour cela les puissances sous forme exponentielle, puis on conclut par continuité de $\exp$ et composition des limites.

    **(a)** Pour $x > 0$, $\big(1 + \frac{1}{x}\big)^{x} = \exp\Big(\dfrac{\ln(1 + u)}{u}\Big)$ avec $u = \frac{1}{x}$, qui tend vers $0$. La limite vaut $\boxed{\mathrm{e}}$.

    **(b)** De même, $(1 + x)^{1/x} = \exp\Big(\dfrac{\ln(1 + x)}{x}\Big) \xrightarrow[x \to 0^{+}]{} \boxed{\mathrm{e}}$. Les questions (a) et (b) sont la même limite, au changement de variable $u = \frac{1}{x}$ près.

    **(c)** On a $x^{1/x} = \exp\big(\frac{\ln x}{x}\big)$, et $\frac{\ln x}{x} \xrightarrow[x \to +\infty]{} 0$ par croissances comparées : la limite vaut $\boxed{1}$.

    **(d)** La formule de factorisation du chapitre 4 donne $\cos(3x) - \cos x = -2\sin(2x)\sin x$. Pour $x \neq 0$ voisin de $0$, 
    $$\frac{\cos(3x) - \cos x}{\sin(x^{2})} = -4 \times \frac{\sin(2x)}{2x} \times \frac{\sin x}{x} \times \frac{x^{2}}{\sin(x^{2})} \xrightarrow[x \to 0]{} \boxed{-4},$$
     chacun des trois quotients tendant vers $1$ par la limite $\frac{\sin u}{u} \xrightarrow[u \to 0]{} 1$ du cours et composition.

    **(e)** D'après la formule de duplication, $\tan(2x) = \frac{2\tan x}{1 - \tan^{2}x}$, donc 
    $$\tan x\tan(2x) = \frac{2\tan^{2}x}{1 - \tan^{2}x} = \frac{2}{\frac{1}{\tan^{2}x} - 1}.$$
     En $\frac{\pi}{2}$, $\tan^{2}x$ tend vers $+\infty$ : la limite vaut $\boxed{-2}$.

    **(f)** On pose $u = \frac{1}{x}$, qui tend vers $0^{+}$ : 
    $$x\Big(\mathrm{e}^{1/x} - \cos\frac{1}{x}\Big) = \frac{\mathrm{e}^{u} - 1}{u} + \frac{1 - \cos u}{u} \xrightarrow[u \to 0^{+}]{} 1 + 0 = \boxed{1},$$
     le premier quotient étant le taux d'accroissement de $\exp$ en $0$, et le second étant compris entre $0$ et $\frac{u}{2}$ puisque $0 \leqslant 1 - \cos u \leqslant \frac{u^{2}}{2}$ (cours, section 8.2).

    **(g)** On pose $t = \operatorname{Arccos} x$, qui tend vers $0^{+}$ quand $x$ tend vers $1^{-}$, par continuité de $\operatorname{Arccos}$ (théorème 11). Alors $x = \cos t$ et 
    $$\frac{1 - x}{\operatorname{Arccos} x} = \frac{1 - \cos t}{t} \in \Big[0\,,\frac{t}{2}\Big], \qquad\text{d'où}\qquad \boxed{\lim\limits_{x \to 1^{-}} \frac{1 - x}{\operatorname{Arccos} x} = 0}.$$
     Autrement dit, $\operatorname{Arccos} x$ tend vers $0$ beaucoup moins vite que $1 - x$ : la courbe de $\operatorname{Arccos}$ a une tangente verticale en $1$.

    **(h)** On multiplie par la quantité conjuguée $\sqrt{1 + x} + 1 + \frac{x}{2}$ : 
    $$\sqrt{1 + x} - 1 - \frac{x}{2} = \frac{(1 + x) - \big(1 + \frac{x}{2}\big)^{2}}{\sqrt{1 + x} + 1 + \frac{x}{2}} = \frac{-\frac{x^{2}}{4}}{\sqrt{1 + x} + 1 + \frac{x}{2}}.$$
     En divisant par $x^{2}$, on obtient 
    $$\boxed{\text{la limite } -\frac{1}{8}}.$$
     Le chapitre 10 retrouvera ce résultat par un développement limité : $\sqrt{1 + x} = 1 + \frac{x}{2} - \frac{x^{2}}{8} + \dots$
- id: "ma-08-03"
  feuille: "f-ma-08"
  numero: 3
  partie: "Limite d'une fonction en un point"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["limite d'une fonction", limites, limites à gauche et à droite, prolongement par continuité, continuité en un point, fonctions discontinues]
  noeuds: [de-limite, c-point]
  notions: [limite-fonction, continuite-point]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Étudier les limites à droite et à gauche en $0$ des fonctions 
    $$f : x \mapsto \Big\lfloor \frac{1}{x} \Big\rfloor, \qquad g : x \mapsto x\Big\lfloor \frac{1}{x} \Big\rfloor \qquad\text{et}\qquad h : x \mapsto x^{2}\Big\lfloor \frac{1}{x} \Big\rfloor.$$
     Les fonctions $g$ et $h$ sont-elles prolongeables par continuité en $0$ ?
  corrige: |
    On part de l'encadrement de la partie entière : pour $x \neq 0$, $\frac{1}{x} - 1 < \lfloor \frac{1}{x} \rfloor \leqslant \frac{1}{x}$.

    **Fonction $f$.** En $0^{+}$, $\lfloor \frac{1}{x} \rfloor > \frac{1}{x} - 1$ tend vers $+\infty$ ; en $0^{-}$, $\lfloor \frac{1}{x} \rfloor \leqslant \frac{1}{x}$ tend vers $-\infty$, par comparaison (théorème 5). 
    $$\boxed{\lim\limits_{x \to 0^{+}} f(x) = +\infty \qquad \lim\limits_{x \to 0^{-}} f(x) = -\infty}$$
     **Fonction $g$.** Pour $x > 0$, on multiplie l'encadrement par $x > 0$ : $1 - x < g(x) \leqslant 1$. Pour $x < 0$, la multiplication par $x$ renverse les inégalités : $1 \leqslant g(x) < 1 - x$. Dans les deux cas, l'encadrement donne 
    $$\boxed{\lim\limits_{x \to 0^{+}} g(x) = \lim\limits_{x \to 0^{-}} g(x) = 1}.$$
     **Fonction $h$.** On a $h(x) = x\,g(x)$, produit d'une fonction de limite nulle par une fonction de limite $1$ : $\boxed{\lim\limits_{x \to 0} h(x) = 0}$.

    Les deux limites latérales de $g$ étant égales, $g$ admet la limite $1$ en $0$ (proposition 5) : 
    $$\boxed{g \text{ se prolonge par continuité en } 0 \text{ par la valeur } 1},$$
     et 
    $$\boxed{h \text{ par la valeur } 0}.$$

    *Piège.* Il ne faut pas écrire $x\lfloor \frac{1}{x} \rfloor = 1$ en « simplifiant » : $g$ n'est pas constante, elle vaut par exemple $\frac{2}{3}$ en $x = \frac{2}{3}$. C'est seulement sa limite qui vaut $1$.
- id: "ma-08-04"
  feuille: "f-ma-08"
  numero: 4
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites]
  noeuds: [de-limite]
  notions: [limite-fonction]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Revenir à la définition.*

    **1.** Écrire avec des quantificateurs la phrase « $f$ ne tend pas vers $+\infty$ en $+\infty$ », puis montrer que la fonction $x \mapsto x\sin x$ ne tend pas vers $+\infty$ en $+\infty$, bien qu'elle ne soit majorée sur aucun intervalle $[A\,,+\infty[$.

    **2.** Montrer, en exhibant pour tout $\varepsilon > 0$ un $\delta$ explicite, que $\lim\limits_{x \to 2} x^{3} = 8$. On pourra se placer d'abord sur l'intervalle $[1\,,3]$.

    **3.** Montrer, en exhibant un $A$ explicite, que $\lim\limits_{x \to +\infty} \dfrac{2x + 1}{x - 1} = 2$.

    **4.** Soit $f$ une fonction telle que $\lim\limits_{x \to a} f(x) = \ell$, avec $\ell > 0$. Montrer que $f(x) > \frac{\ell}{2}$ au voisinage de $a$. Que dire si $\ell = 0$ ?
  corrige: |
    **1.** La phrase « $f$ tend vers $+\infty$ en $+\infty$ » s'écrit $\forall M \in \mathbb{R},\ \exists A \in \mathbb{R},\ \forall x \geqslant A,\ f(x) \geqslant M$. Sa négation est donc 
    $$\boxed{\exists M \in \mathbb{R},\ \forall A \in \mathbb{R},\ \exists x \geqslant A,\quad f(x) < M}.$$
     Pour $f : x \mapsto x\sin x$, prenons $M = 1$ : pour tout $A$, il existe un entier $k$ tel que $x = 2k\pi \geqslant A$, et $f(x) = 0 < 1$. Ainsi 
    $$\boxed{f \text{ ne tend pas vers } +\infty}.$$
     Pourtant $f\big(2k\pi + \frac{\pi}{2}\big) = 2k\pi + \frac{\pi}{2}$ prend des valeurs aussi grandes que l'on veut sur tout intervalle $[A\,,+\infty[$ : ne pas être majorée ne suffit pas à tendre vers $+\infty$.

    **2.** On factorise : $x^{3} - 8 = (x - 2)(x^{2} + 2x + 4)$. Pour $x \in [1\,,3]$, on a $0 < x^{2} + 2x + 4 \leqslant 9 + 6 + 4 = 19$, donc $|x^{3} - 8| \leqslant 19\,|x - 2|$. Soit $\varepsilon > 0$ ; posons 
    $$\boxed{\delta = \min\Big(1, \frac{\varepsilon}{19}\Big)}.$$
     Si $|x - 2| \leqslant \delta$, alors $x \in [1\,,3]$ et $|x^{3} - 8| \leqslant 19\delta \leqslant \varepsilon$. La restriction $\delta \leqslant 1$ sert à rester sur l'intervalle où le facteur $x^{2} + 2x + 4$ est contrôlé.

    **3.** Pour $x > 1$, $\dfrac{2x + 1}{x - 1} - 2 = \dfrac{3}{x - 1} > 0$. Soit $\varepsilon > 0$ : cette quantité est inférieure à $\varepsilon$ dès que $x - 1 \geqslant \frac{3}{\varepsilon}$, et $\boxed{A = 1 + \frac{3}{\varepsilon}}$ convient.

    **4.** On applique la définition avec $\varepsilon = \frac{\ell}{4} > 0$ : il existe un voisinage $W$ de $a$ sur lequel $|f(x) - \ell| \leqslant \frac{\ell}{4}$, donc $f(x) \geqslant \frac{3\ell}{4} > \frac{\ell}{2}$ pour $x \in W \cap I$. Le choix $\varepsilon = \frac{\ell}{2}$ ne donnerait que l'inégalité large. 
    $$\boxed{f > \frac{\ell}{2} \text{ au voisinage de } a}$$

    Si $\ell = 0$, on ne peut rien dire du signe : $x \mapsto x$ tend vers $0$ en $0$ en changeant de signe.
- id: "ma-08-05"
  feuille: "f-ma-08"
  numero: 5
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites, fonctions discontinues]
  noeuds: [de-limite, continuite]
  notions: [limite-fonction]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Montrer que les fonctions suivantes n'ont pas de limite en $+\infty$ : 
    $$x \mapsto \cos(x^{2}), \qquad x \mapsto x - \lfloor x \rfloor \qquad\text{et}\qquad x \mapsto \frac{x\cos x}{1 + |x|}.$$
     Montrer en revanche que $x \mapsto \dfrac{\cos(x^{2})}{x}$ admet une limite en $+\infty$.
  corrige: |
    Dans chaque cas, on applique la méthode du cours : deux suites qui tendent vers $+\infty$, dont les images ont des limites différentes, interdisent l'existence d'une limite (théorème 1).

    **Fonction $x \mapsto \cos(x^{2})$.** Avec $x_{n} = \sqrt{2n\pi}$ et $y_{n} = \sqrt{(2n + 1)\pi}$, qui tendent vers $+\infty$, on a $\cos(x_{n}^{2}) = 1$ et $\cos(y_{n}^{2}) = -1$. 
    $$\boxed{\text{pas de limite}}$$

    **Fonction $x \mapsto x - \lfloor x \rfloor$.** Avec $x_{n} = n$ et $y_{n} = n + \frac{1}{2}$, les images valent $0$ et $\frac{1}{2}$. 
    $$\boxed{\text{pas de limite}}$$

    **Fonction $x \mapsto \frac{x\cos x}{1 + |x|}$.** Avec $x_{n} = 2n\pi$ et $y_{n} = (2n + 1)\pi$, les images valent $\frac{2n\pi}{1 + 2n\pi}$, qui tend vers $1$, et $-\frac{(2n + 1)\pi}{1 + (2n + 1)\pi}$, qui tend vers $-1$. 
    $$\boxed{\text{pas de limite}}$$

    En revanche, $\big|\frac{\cos(x^{2})}{x}\big| \leqslant \frac{1}{x}$ pour $x > 0$, et l'encadrement donne 
    $$\boxed{\lim\limits_{x \to +\infty} \frac{\cos(x^{2})}{x} = 0}.$$
- id: "ma-08-06"
  feuille: "f-ma-08"
  numero: 6
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites, bijection continue]
  noeuds: [de-limite, c-bijection]
  notions: [limite-fonction]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ et $\ell \in \mathbb{R}$. Montrer que $\lim\limits_{x \to 0} f(x) = \ell$ si et seulement si $\lim\limits_{x \to 0} f(\sin x) = \ell$. On pourra utiliser la fonction $\operatorname{Arcsin}$ et sa continuité, établie par le théorème de la bijection continue.

    Le résultat subsiste-t-il si l'on remplace $\sin$ par $\cos$ et $0$ par $\frac{\pi}{2}$ ? par $x \mapsto x^{2}$ ?
  corrige: |
    **Sens direct.** Supposons $\lim\limits_{x \to 0} f(x) = \ell$. Comme $\lim\limits_{x \to 0} \sin x = 0$, la composition des limites (théorème 3) donne $\lim\limits_{x \to 0} f(\sin x) = \ell$.

    **Réciproque.** Supposons $\lim\limits_{x \to 0} f(\sin x) = \ell$, et notons $g : t \mapsto f(\sin t)$. Pour $x \in [-1\,,1]$, on a $\sin(\operatorname{Arcsin} x) = x$, donc $f(x) = g(\operatorname{Arcsin} x)$. La fonction $\operatorname{Arcsin}$ est continue en $0$ (théorème 11) et $\operatorname{Arcsin} 0 = 0$ : par composition, $f(x) = g(\operatorname{Arcsin} x)$ tend vers $\ell$ quand $x$ tend vers $0$. 
    $$\boxed{\text{les deux propriétés sont équivalentes}}$$

    **Avec $\cos$ en $\frac{\pi}{2}$.** Le résultat subsiste : $\cos$ tend vers $0$ en $\frac{\pi}{2}$, ce qui donne le sens direct, et $x = \cos(\operatorname{Arccos} x)$ avec $\operatorname{Arccos}$ continue en $0$ et $\operatorname{Arccos} 0 = \frac{\pi}{2}$ donne la réciproque.

    **Avec $x \mapsto x^{2}$.** Le sens direct subsiste, mais pas la réciproque, car $x^{2}$ ne prend que des valeurs positives : seules les valeurs de $f$ sur $[0\,,+\infty[$ interviennent. Par exemple, $f = \mathbf{1}_{[0,+\infty[}$ vérifie $f(x^{2}) = 1$ pour tout $x$, mais n'a pas de limite en $0$, ses limites à gauche et à droite valant $0$ et $1$. 
    $$\boxed{\text{faux pour } x \mapsto x^{2}}$$

    *À retenir.* Le changement de variable dans une limite n'est réversible que si la nouvelle variable parcourt tout un voisinage du point : c'est le rôle de la bijection réciproque continue.
- id: "ma-08-07"
  feuille: "f-ma-08"
  numero: 7
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites]
  noeuds: [de-limite]
  notions: [limite-fonction]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R} \to \,]0\,,+\infty[$ une fonction telle que $\lim\limits_{x \to 0} \Big(f(x) + \dfrac{1}{f(x)}\Big) = 2$. Montrer que $\lim\limits_{x \to 0} f(x) = 1$.

    On pourra commencer par montrer que $f$ est majorée au voisinage de $0$.
  corrige: |
    Notons $\varphi(x) = f(x) + \frac{1}{f(x)}$, qui tend vers $2$ en $0$.

    **La fonction $f$ est majorée près de $0$.** Il existe un voisinage $W$ de $0$ sur lequel $\varphi(x) \leqslant 3$ ; comme $\frac{1}{f(x)} > 0$, on en déduit $f(x) \leqslant 3$ sur $W$.

    **Conclusion.** Pour tout réel $t > 0$, on a $t + \frac{1}{t} - 2 = \frac{(t - 1)^{2}}{t}$. Ainsi, sur $W$, 
    $$\big(f(x) - 1\big)^{2} = f(x)\big(\varphi(x) - 2\big) \leqslant 3\big(\varphi(x) - 2\big) \xrightarrow[x \to 0]{} 0,$$
     puisque $\varphi(x) - 2 \geqslant 0$. L'encadrement donne $\lim\limits_{x \to 0} (f(x) - 1)^{2} = 0$, puis $|f(x) - 1| = \sqrt{(f(x) - 1)^{2}}$ tend vers $0$ par continuité de la racine carrée. $\boxed{\lim\limits_{x \to 0} f(x) = 1}$

    *Piège.* On ne peut pas « résoudre » l'équation limite $\ell + \frac{1}{\ell} = 2$, car rien ne dit a priori que $f$ admet une limite : c'est précisément ce qu'il faut démontrer. L'encadrement établit à la fois l'existence et la valeur.
