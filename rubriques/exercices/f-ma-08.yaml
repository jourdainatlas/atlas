  enonce: |
    *Limite monotone.*

    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ croissante, et $(\xi_{n})$ une suite telle que $\lim\limits_{n \to +\infty} \xi_{n} = +\infty$ et $\lim\limits_{n \to +\infty} f(\xi_{n}) = \ell \in \mathbb{R}$. Montrer que $\lim\limits_{x \to +\infty} f(x) = \ell$.

    **2.** Donner un contre-exemple lorsque $f$ n'est plus supposée croissante.

    **3.** Soit $f : \mathbb{R} \to \mathbb{R}$ une bijection croissante. Montrer que $\lim\limits_{x \to +\infty} f(x) = +\infty$.
  corrige: |
    **1.** La fonction $f$ est croissante sur $\mathbb{R}$ : d'après le théorème 6, elle admet en $+\infty$ une limite $L \in \,]-\infty\,,+\infty]$, égale à $\sup_{\mathbb{R}} f$. Par la caractérisation séquentielle (théorème 1), $\lim\limits_{n \to +\infty} f(\xi_{n}) = L$ ; l'unicité de la limite d'une suite donne $L = \ell$. 
    $$\boxed{\lim\limits_{x \to +\infty} f(x) = \ell}$$

    **2.** La fonction $f : x \mapsto \sin(\pi x)$ et la suite $\xi_{n} = n$ conviennent : $f(\xi_{n}) = 0$ pour tout $n$, mais $f$ n'a pas de limite en $+\infty$, puisque $f\big(n + \frac{1}{2}\big) = (-1)^{n}$. 
    $$\boxed{\text{l'hypothèse de croissance est indispensable}}$$

    **3.** Une bijection croissante est strictement croissante, puisqu'elle est injective. Par le théorème 6, $f$ admet en $+\infty$ la limite $\sup_{\mathbb{R}} f$ si $f$ est majorée, et $+\infty$ sinon. Or $f(\mathbb{R}) = \mathbb{R}$ n'est pas majoré. 
    $$\boxed{\lim\limits_{x \to +\infty} f(x) = +\infty}$$
- id: "ma-08-09"
  feuille: "f-ma-08"
  numero: 9
  partie: "Limite d'une fonction en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites, fonctions périodiques]
  noeuds: [de-limite]
  notions: [limite-fonction, fonction-periodique]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction périodique. Montrer que $f$ admet une limite finie en $+\infty$ si et seulement si $f$ est constante.

    Application : soit $a$ et $b$ deux réels tels que la fonction $x \mapsto a\cos x + b\cos(2x)$ admette une limite finie en $+\infty$. Montrer que $a = b = 0$.
  corrige: |
    Une fonction constante admet évidemment une limite finie. Réciproquement, soit $T > 0$ une période de $f$ et $\ell$ sa limite en $+\infty$. Soit $x \in \mathbb{R}$ : la suite $(x + nT)$ tend vers $+\infty$, donc $\lim\limits_{n \to +\infty} f(x + nT) = \ell$ par le théorème 1. Or $f(x + nT) = f(x)$ pour tout $n$ : la suite est constante, et sa limite est $f(x)$. Ainsi $f(x) = \ell$ pour tout réel $x$. 
    $$\boxed{f \text{ est constante}}$$

    **Application.** La fonction $g : x \mapsto a\cos x + b\cos(2x)$ est $2\pi$-périodique ; si elle admet une limite finie en $+\infty$, elle est constante, égale à un réel $c$. En évaluant en $0$, en $\pi$ et en $\frac{\pi}{2}$, on obtient 
    $$a + b = c, \qquad -a + b = c, \qquad -b = c.$$
     Les deux premières donnent $a = 0$ et $b = c$, la troisième $b = -c$, d'où $b = c = 0$. $\boxed{a = b = 0}$
- id: "ma-08-10"
  feuille: "f-ma-08"
  numero: 10
  partie: "Limite d'une fonction en un point"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites]
  noeuds: [de-limite]
  notions: [limite-fonction]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Une condition qui ne force pas la limite.* Soit $f : \mathbb{R} \to \mathbb{R}$ telle que $\lim\limits_{x \to 0} f(x)f(2x) = 0$.

    **1.** On suppose que $f$ admet une limite $\ell \in \overline{\mathbb{R}}$ en $0$. Montrer que $\ell = 0$.

    **2.** Soit $E = \bigcup\limits_{k \in \mathbb{N}} \big[2^{-2k-1}\,,2^{-2k}\big[$, et $f = \mathbf{1}_{E}$. Montrer que $f(x)f(2x) = 0$ pour tout réel $x$, mais que $f$ n'a pas de limite en $0$.
  corrige: |
    **1.** Si $\ell$ est réel, la composition des limites donne $\lim\limits_{x \to 0} f(2x) = \ell$, donc $\lim\limits_{x \to 0} f(x)f(2x) = \ell^{2}$, d'où $\ell^{2} = 0$. Si $\ell = \pm\infty$, le produit $f(x)f(2x)$ tend vers $+\infty$, ce qui contredit l'hypothèse. $\boxed{\ell = 0}$

    **2.** Soit $x$ réel. Si $x \notin E$, alors $f(x) = 0$. Si $x \in E$, il existe $k$ tel que $2^{-2k-1} \leqslant x < 2^{-2k}$, d'où $2^{-2k} \leqslant 2x < 2^{-2k+1}$ : le réel $2x$ tombe dans un « trou » entre deux intervalles de $E$, et $f(2x) = 0$. Dans tous les cas, $\boxed{f(x)f(2x) = 0}$.

    Pourtant $f$ n'a pas de limite en $0$ : les suites $x_{k} = 2^{-2k-1} \in E$ et $y_{k} = 2^{-2k-2} \notin E$ tendent vers $0$, avec $f(x_{k}) = 1$ et $f(y_{k}) = 0$.

    *À retenir.* L'hypothèse ne lie $f(x)$ qu'aux valeurs $f(2x)$, $f(4x)$, et ainsi de suite : la fonction peut alterner entre deux valeurs sur des bandes successives, de plus en plus fines. C'est la structure de $E$, faite d'intervalles $[2^{-j-1}\,,2^{-j}[$ pris un sur deux, qui le rend possible.
- id: "ma-08-11"
  feuille: "f-ma-08"
  numero: 11
  partie: "Limite d'une fonction en un point"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites, fonctions monotones, fonctions périodiques]
  noeuds: [de-limite, c-monotone]
  notions: [limite-fonction]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $f : [0\,,+\infty[ \,\to [0\,,+\infty[$ une fonction croissante telle que $\lim\limits_{x \to +\infty} \big(f(x + 1) - f(x)\big) = 0$.

    **1.** Soit $\varepsilon > 0$ et $A$ tel que $f(x + 1) - f(x) \leqslant \varepsilon$ pour $x \geqslant A$. Montrer que, pour tout $x \geqslant A$, on a $f(x) \leqslant f(A + 1) + \varepsilon\,(x - A)$.

    **2.** En déduire que $\lim\limits_{x \to +\infty} \dfrac{f(x)}{x} = 0$.

    **3.** Le résultat subsiste-t-il si $f$ n'est plus supposée croissante ? On pourra chercher un contre-exemple périodique.
  corrige: |
    **1.** Soit $x \geqslant A$ et $n = \lfloor x - A \rfloor$, de sorte que $A + n \leqslant x < A + n + 1$. Par croissance de $f$ et en sommant les accroissements sur les intervalles $[A + j\,,A + j + 1]$, pour $1 \leqslant j \leqslant n$, 
    $$f(x) \leqslant f(A + n + 1) = f(A + 1) + \sum_{j=1}^{n} \big(f(A + j + 1) - f(A + j)\big) \leqslant f(A + 1) + n\varepsilon,$$
     et $n \leqslant x - A$. 
    $$\boxed{f(x) \leqslant f(A + 1) + \varepsilon(x - A)}$$

    **2.** Pour $x \geqslant \max(A, 1)$, on obtient, puisque $f \geqslant 0$, 
    $$0 \leqslant \frac{f(x)}{x} \leqslant \frac{f(A + 1)}{x} + \varepsilon.$$
     Le premier terme est inférieur à $\varepsilon$ pour $x$ assez grand, donc $0 \leqslant \frac{f(x)}{x} \leqslant 2\varepsilon$ au voisinage de $+\infty$. 
    $$\boxed{\lim\limits_{x \to +\infty} \frac{f(x)}{x} = 0}$$

    **3.** Non. Soit $f$ définie par $f(x) = 0$ si $x$ est entier, et $f(x) = \frac{1}{x - \lfloor x \rfloor}$ sinon. Elle est positive et $1$-périodique, donc $f(x + 1) - f(x) = 0$ pour tout $x$ ; mais pour $x_{n} = n + \frac{1}{n^{2}}$, avec $n \geqslant 2$, 
    $$\frac{f(x_{n})}{x_{n}} = \frac{n^{2}}{n + \frac{1}{n^{2}}} \xrightarrow[n \to +\infty]{} +\infty.$$

    $$\boxed{\text{le résultat est faux sans la croissance}}$$
     La croissance sert, à la question 1, à contrôler $f$ entre deux points de la forme $A + j$.
- id: "ma-08-12"
  feuille: "f-ma-08"
  numero: 12
  partie: "Limite d'une fonction en un point"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["limite d'une fonction", limites, limites à gauche et à droite, fonctions discontinues, fonctions monotones, densité]
  noeuds: [de-limite, continuite, c-monotone, tr-dense]
  notions: [limite-fonction, partie-dense]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Discontinuités d'une fonction monotone.* Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction croissante, et $D$ l'ensemble des points en lesquels $f$ n'est pas continue.

    **1.** Pour $a \in D$, on note $f(a^{-})$ et $f(a^{+})$ les limites à gauche et à droite de $f$ en $a$, qui existent d'après le cours. Montrer que $f(a^{-}) < f(a^{+})$.

    **2.** Montrer que, si $a < b$ sont deux éléments de $D$, les intervalles $]f(a^{-})\,,f(a^{+})[$ et $]f(b^{-})\,,f(b^{+})[$ sont disjoints.

    **3.** En déduire qu'il existe une injection de $D$ dans $\mathbb{Q}$.

    **4.** Montrer que la fonction $x \mapsto \lfloor x \rfloor + \lfloor 2x \rfloor$ est croissante, et déterminer l'ensemble $D$ correspondant.
  corrige: |
    **1.** D'après la proposition 6 du cours, $f(a^{-}) \leqslant f(a) \leqslant f(a^{+})$. Si $f(a^{-}) = f(a^{+})$, les deux limites latérales valent $f(a)$, et $f$ est continue en $a$ par la proposition 7, ce qui est exclu. $\boxed{f(a^{-}) < f(a^{+})}$

    **2.** Soit $a < b$ dans $D$ et $c \in \,]a\,,b[$. D'après le théorème 6, $f(a^{+}) = \inf_{x > a} f(x) \leqslant f(c)$ et $f(b^{-}) = \sup_{x < b} f(x) \geqslant f(c)$. Ainsi $f(a^{+}) \leqslant f(b^{-})$, et l'intervalle $]f(a^{-})\,,f(a^{+})[$ est entièrement situé à gauche de $]f(b^{-})\,,f(b^{+})[$. 
    $$\boxed{\text{les intervalles sont disjoints}}$$

    **3.** Pour chaque $a \in D$, l'intervalle ouvert $]f(a^{-})\,,f(a^{+})[$ n'est pas vide : il contient un rationnel $r(a)$, par densité de $\mathbb{Q}$ (chapitre 7, théorème 2). Si $a \neq b$, les intervalles sont disjoints, donc $r(a) \neq r(b)$. 
    $$\boxed{a \mapsto r(a) \text{ est une injection de } D \text{ dans } \mathbb{Q}}$$

    Une fonction monotone n'a donc « pas plus » de discontinuités qu'il n'y a de rationnels : on dit qu'un tel ensemble est au plus dénombrable. Il peut néanmoins être infini, comme le montre la question suivante.

    **4.** Les fonctions $x \mapsto \lfloor x \rfloor$ et $x \mapsto \lfloor 2x \rfloor$ sont croissantes, ainsi que leur somme $f$. La première est discontinue exactement aux entiers, la seconde aux multiples de $\frac{1}{2}$. En un demi-entier non entier, seule la seconde saute, d'une hauteur $1$ ; en un entier, les deux sautent, et le saut total vaut $2$. Ailleurs, $f$ est localement constante. 
    $$\boxed{D = \Big\{\frac{k}{2} \;\Big|\; k \in \mathbb{Z}\Big\}}$$
- id: "ma-08-13"
  feuille: "f-ma-08"
  numero: 13
  partie: "Continuité en un point"
  etoiles: 1
  types: [Calcul]
  mots_cles: [continuité en un point, prolongement par continuité]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Déterminer le domaine de définition des fonctions suivantes, étudier leur continuité et leurs éventuels prolongements par continuité.

    **(a)** $x \mapsto \mathrm{e}^{-1/x^{2}}$

    **(b)** $x \mapsto \mathrm{e}^{-1/x}$

    **(c)** $x \mapsto \sin(x + 1)\ln|1 + x|$

    **(d)** $x \mapsto \dfrac{x\ln x}{x - 1}$

    **(e)** $x \mapsto \dfrac{x^{2} - 1}{|x - 1|}$

    **(f)** $x \mapsto \dfrac{(x^{2} - 1)^{2}}{|x - 1|}$

    **(g)** $x \mapsto \sin x\,\sin\dfrac{1}{x}$

    **(h)** $x \mapsto \cos x\,\cos\dfrac{1}{x}$
  corrige: |
    Chaque fonction est continue sur son ensemble de définition, comme composée, produit ou quotient de fonctions usuelles (proposition 9 du cours). Il reste à étudier les points où elle n'est pas définie.

    **(a)** Définie sur $\mathbb{R}^{*}$. En $0$, $-\frac{1}{x^{2}}$ tend vers $-\infty$, et $\mathrm{e}^{u}$ tend vers $0$ quand $u$ tend vers $-\infty$ : 
    $$\boxed{\text{prolongeable en } 0 \text{ par } 0}.$$

    **(b)** Définie sur $\mathbb{R}^{*}$. En $0^{+}$, la fonction tend vers $0$ ; en $0^{-}$, $-\frac{1}{x}$ tend vers $+\infty$ et la fonction vers $+\infty$. 
    $$\boxed{\text{non prolongeable}}$$
     Seule sa restriction à $]0\,,+\infty[$ l'est.

    **(c)** Définie sur $\mathbb{R} \setminus \{-1\}$. Avec $u = 1 + x$, qui tend vers $0$, on a $|\sin u\,\ln|u|| \leqslant |u\ln|u||$, qui tend vers $0$ par croissances comparées (chapitre 5). 
    $$\boxed{\text{prolongeable en } -1 \text{ par } 0}$$

    **(d)** Définie sur $]0\,,1[\, \cup \,]1\,,+\infty[$. En $0^{+}$, $x\ln x \to 0$ et $x - 1 \to -1$, donc la fonction tend vers $0$. En $1$, $\frac{\ln x}{x - 1}$ est le taux d'accroissement de $\ln$ en $1$, qui tend vers $\ln'(1) = 1$, et la fonction tend vers $1 \times 1$. 
    $$\boxed{\text{prolongeable par } 0 \text{ en } 0 \text{ et par } 1 \text{ en } 1}$$

    **(e)** Définie sur $\mathbb{R} \setminus \{1\}$, elle vaut $\frac{(x - 1)(x + 1)}{|x - 1|}$, soit $x + 1$ pour $x > 1$ et $-(x + 1)$ pour $x < 1$. Les limites latérales en $1$ valent $2$ et $-2$. 
    $$\boxed{\text{non prolongeable}}$$

    **(f)** Elle vaut $\frac{(x - 1)^{2}(x + 1)^{2}}{|x - 1|} = |x - 1|\,(x + 1)^{2}$, qui tend vers $0$ en $1$. 
    $$\boxed{\text{prolongeable en } 1 \text{ par } 0}$$
     La différence avec (e) tient au carré, qui « absorbe » la valeur absolue.

    **(g)** Définie sur $\mathbb{R}^{*}$, avec $|\sin x\sin\frac{1}{x}| \leqslant |\sin x| \leqslant |x|$. 
    $$\boxed{\text{prolongeable en } 0 \text{ par } 0}$$

    **(h)** Définie sur $\mathbb{R}^{*}$. Avec $x_{n} = \frac{1}{2n\pi}$ et $y_{n} = \frac{1}{2n\pi + \pi/2}$, qui tendent vers $0$, on obtient $\cos(x_{n}) \cdot 1 \to 1$ et $\cos(y_{n}) \cdot 0 = 0$. 
    $$\boxed{\text{non prolongeable}}$$

    *À retenir.* Un facteur de limite nulle rend la fonction prolongeable, comme en (g), alors qu'un facteur de limite non nulle laisse subsister l'oscillation, comme en (h).
- id: "ma-08-14"
  feuille: "f-ma-08"
  numero: 14
  partie: "Continuité en un point"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [continuité en un point, fonctions discontinues, bornes atteintes]
  noeuds: [continuite, c-bornes]
  notions: [continuite-point]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Étudier la continuité des fonctions suivantes sur $\mathbb{R}$, et tracer leur courbe sur $[-2\,,3]$. 
    $$f : x \mapsto \lfloor x \rfloor + (x - \lfloor x \rfloor)^{2} \qquad\text{et}\qquad g : x \mapsto \lfloor x \rfloor^{2} + \big(2\lfloor x \rfloor + 1\big)(x - \lfloor x \rfloor).$$
     Montrer que la courbe de $g$ est formée de segments dont les extrémités sont sur la parabole d'équation $y = x^{2}$.
  corrige: |
    **Fonction $f$.** Sur chaque intervalle $[n\,,n + 1[$, avec $n \in \mathbb{Z}$, on a $f(x) = n + (x - n)^{2}$ : la fonction $f$ est continue sur $]n\,,n + 1[$ et continue à droite en $n$, de valeur $f(n) = n$. Sa limite à gauche en $n$ se calcule sur $[n - 1\,,n[$ : 
    $$\lim\limits_{x \to n^{-}} f(x) = (n - 1) + \big(n - (n - 1)\big)^{2} = n = f(n).$$
     Ainsi $f$ est continue à gauche et à droite en chaque entier. 
    $$\boxed{f \text{ est continue sur } \mathbb{R}}$$

    **Fonction $g$.** Sur $[n\,,n + 1[$, $g(x) = n^{2} + (2n + 1)(x - n)$ est affine, et sa limite à gauche en $n$ vaut $(n - 1)^{2} + (2n - 1) = n^{2} = g(n)$. 
    $$\boxed{g \text{ est continue sur } \mathbb{R}}$$
     De plus, $g(n) = n^{2}$ pour tout entier $n$, et $g$ est affine entre deux entiers consécutifs : sa courbe est la ligne brisée qui joint les points $(n, n^{2})$ de la parabole, c'est-à-dire la réunion de cordes de la parabole. La pente $2n + 1$ de chaque corde est d'ailleurs le taux d'accroissement de $x \mapsto x^{2}$ entre $n$ et $n + 1$.

    ![Figure](documents/figures/f9becb6e8c28619e.svg)

    ![Figure](documents/figures/32dc12383d810707.svg)

    À gauche, la courbe de $f$ est formée d'arcs de parabole qui se raccordent en chaque point $(n, n)$ de la première bissectrice, en pointillés ; à droite, celle de $g$ est la ligne brisée inscrite dans la parabole, en ocre.
- id: "ma-08-15"
  feuille: "f-ma-08"
  numero: 15
  partie: "Continuité en un point"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [continuité en un point, bijection continue]
  noeuds: [c-point, c-bijection]
  notions: [continuite-point]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Montrer que si $f : I \to \mathbb{R}$ est continue en $a$, alors $|f|$ l'est aussi. Étudier la réciproque.

    **2.** Soit $f$ et $g$ deux fonctions continues sur $I$. Exprimer $\max(f, g)$ et $\min(f, g)$ à l'aide de $f + g$ et de $|f - g|$, et en déduire qu'elles sont continues sur $I$.

    **3.** Généraliser à $\max(f_{1}, \dots, f_{n})$ pour $n$ fonctions continues sur $I$.
  corrige: |
    **1.** L'inégalité triangulaire renversée donne $\big||f(x)| - |f(a)|\big| \leqslant |f(x) - f(a)|$ : si le second membre est inférieur à $\varepsilon$ pour $|x - a| \leqslant \delta$, le premier aussi. 
    $$\boxed{|f| \text{ est continue en } a}$$

    La réciproque est fausse : la fonction $f$ qui vaut $1$ sur $\mathbb{Q}$ et $-1$ ailleurs n'est continue en aucun point, pour la même raison que l'indicatrice de $\mathbb{Q}$ dans le cours, alors que $|f| = 1$ est constante.

    **2.** Selon que $f(x) \geqslant g(x)$ ou non, on vérifie 
    $$\boxed{\max(f, g) = \frac{f + g + |f - g|}{2} \qquad \min(f, g) = \frac{f + g - |f - g|}{2}}.$$
     Ces fonctions sont continues, par la question 1 et les opérations sur les fonctions continues.

    **3.** Par récurrence sur $n$, avec $\max(f_{1}, \dots, f_{n+1}) = \max\big(\max(f_{1}, \dots, f_{n}), f_{n+1}\big)$ ; de même pour le minimum.
- id: "ma-08-16"
  feuille: "f-ma-08"
  numero: 16
  partie: "Continuité en un point"
  etoiles: 2
  types: [Calcul]
  mots_cles: [continuité en un point]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Points de continuité.* Construire, en s'inspirant des fonctions de la section 8.3 du cours, une fonction $f : \mathbb{R} \to \mathbb{R}$

    **(a)** continue en $1$ et en $2$, et en aucun autre point ;

    **(b)** continue exactement en chaque entier ;

    **(c)** discontinue en chaque entier, et continue partout ailleurs ;

    **(d)** continue en $0$, discontinue partout ailleurs, et dérivable en $0$.
  corrige: |
    Le modèle est la fonction $x \mapsto x\,\mathbf{1}_{\mathbb{Q}}(x)$ du cours, continue en $0$ seulement : on multiplie $\mathbf{1}_{\mathbb{Q}}$ par une fonction continue qui s'annule exactement aux points voulus.

    **(a)** Soit $f : x \mapsto (x - 1)(x - 2)\,\mathbf{1}_{\mathbb{Q}}(x)$. En $a \in \{1, 2\}$, $|f(x)| \leqslant |(x - 1)(x - 2)|$, qui tend vers $0 = f(a)$. En $a \notin \{1, 2\}$, une suite de rationnels tendant vers $a$ a des images qui tendent vers $(a - 1)(a - 2) \neq 0$, et une suite d'irrationnels des images nulles. $\boxed{f = (x - 1)(x - 2)\,\mathbf{1}_{\mathbb{Q}}}$

    **(b)** De même, 
    $$\boxed{f : x \mapsto \sin(\pi x)\,\mathbf{1}_{\mathbb{Q}}(x)}$$
     est continue exactement aux zéros du sinus de $\pi x$, c'est-à-dire aux entiers.

    **(c)** La partie entière convient : elle est continue en tout point non entier et discontinue en chaque entier (cours, section 8.3). $\boxed{f = \lfloor \cdot \rfloor}$

    **(d)** Soit $f : x \mapsto x^{2}\,\mathbf{1}_{\mathbb{Q}}(x)$. Elle est continue en $0$ seulement, pour la même raison qu'en (a), et pour $x \neq 0$, 
    $$\Big|\frac{f(x) - f(0)}{x - 0}\Big| \leqslant |x| \xrightarrow[x \to 0]{} 0.$$

    $$\boxed{f = x^{2}\,\mathbf{1}_{\mathbb{Q}} \text{ est dérivable en } 0, \text{ de dérivée nulle}}$$
     Une fonction peut donc être dérivable en un point sans être continue en aucun autre.
- id: "ma-08-17"
  feuille: "f-ma-08"
  numero: 17
  partie: "Continuité en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité en un point, prolongement par continuité, fonctions monotones, densité]
  noeuds: [c-point, c-monotone, tr-dense]
  notions: [continuite-point, partie-dense]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Prolongement d'inégalités.* Soit $f$ et $g$ deux fonctions continues sur $\mathbb{R}$.

    **1.** On suppose que $f(x) < g(x)$ pour tout rationnel $x$. Montrer que $f(x) \leqslant g(x)$ pour tout réel $x$, et que l'inégalité n'est pas nécessairement stricte.

    **2.** On suppose que $f(x) < f(y)$ pour tous rationnels $x < y$. Montrer que $f$ est strictement croissante sur $\mathbb{R}$.
  corrige: |
    **1.** Soit $x$ réel et $(r_{n})$ une suite de rationnels qui tend vers $x$, qui existe par densité de $\mathbb{Q}$ (chapitre 7, proposition 12). On a $f(r_{n}) < g(r_{n})$ pour tout $n$ ; par continuité, $f(r_{n}) \to f(x)$ et $g(r_{n}) \to g(x)$, et le passage à la limite dans les inégalités larges (chapitre 7, théorème 5) donne $\boxed{f(x) \leqslant g(x)}$.

    L'inégalité n'est pas stricte en général : avec $f = 0$ et $g : x \mapsto (x - \sqrt{2})^{2}$, on a $f(r) < g(r)$ pour tout rationnel $r$, car $\sqrt{2}$ est irrationnel, mais $f(\sqrt{2}) = g(\sqrt{2})$. Comme pour les suites, les inégalités strictes ne passent pas à la limite.

    **2.** *Croissance au sens large.* Soit $x < y$ deux réels, et $(r_{n})$, $(s_{n})$ deux suites de rationnels qui tendent vers $x$ et $y$. À partir d'un certain rang, $r_{n} < s_{n}$, donc $f(r_{n}) < f(s_{n})$, et le passage à la limite donne $f(x) \leqslant f(y)$.

    *Croissance stricte.* Soit $x < y$. Par densité, il existe deux rationnels $r < s$ dans $]x\,,y[$. Par croissance au sens large, puis par hypothèse, 
    $$f(x) \leqslant f(r) < f(s) \leqslant f(y).$$

    $$\boxed{f \text{ est strictement croissante sur } \mathbb{R}}$$
     L'astuce consiste à intercaler deux rationnels, pour que l'inégalité stricte entre eux survive au passage aux réels.
- id: "ma-08-18"
  feuille: "f-ma-08"
  numero: 18
  partie: "Continuité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [continuité en un point, valeurs intermédiaires]
  noeuds: [c-point, c-tvi]
  notions: [continuite-point]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    *Trouver l'erreur.* Un élève veut montrer que toute fonction $f : \mathbb{R} \to \mathbb{R}$ continue en $0$ et telle que $f(2x) = f(x)$ pour tout réel $x$ est constante. Il écrit :

    > Soit $x \in \mathbb{R}$. Par récurrence, $f(x) = f\big(\frac{x}{2^{n}}\big)$ pour tout $n \in \mathbb{N}$. Quand $n$ tend vers $+\infty$, $\frac{x}{2^{n}}$ tend vers $0$, donc $f\big(\frac{x}{2^{n}}\big)$ tend vers $f(0)$ par continuité. Ainsi $f(x)$ tend vers $f(0)$, et $f$ est constante.

    **1.** La conclusion est-elle juste ? Repérer la maladresse de rédaction et récrire correctement la fin du raisonnement.

    **2.** Déterminer de même les fonctions $f : \mathbb{R} \to \mathbb{R}$ continues telles que $f(2x + 1) = f(x)$ pour tout réel $x$. On pourra introduire le point fixe de $x \mapsto 2x + 1$.

    **3.** Que dire d'une fonction continue en $0$ et en $1$ telle que $f(x) = f(x^{2})$ pour tout réel $x$ ? On traitera séparément les réels de $[0\,,1[$, de $]1\,,+\infty[$ et les réels négatifs.
  corrige: |
    **1.** La conclusion est juste, mais la phrase « $f(x)$ tend vers $f(0)$ » n'a pas de sens : $f(x)$ est un nombre fixé, qui ne dépend pas de $n$. La rédaction correcte est la suivante.

    > La suite $\big(f(\frac{x}{2^{n}})\big)_{n \in \mathbb{N}}$ est constante, égale à $f(x)$. Par continuité de $f$ en $0$ et le théorème 7, elle converge vers $f(0)$. Par unicité de la limite, $f(x) = f(0)$. Ceci vaut pour tout réel $x$ : $f$ est constante.

    **2.** La fonction $x \mapsto 2x + 1$ a pour point fixe $-1$. On pose $g(t) = f(t - 1)$, de sorte que 
    $$g(2t) = f(2t - 1) = f\big(2(t - 1) + 1\big) = f(t - 1) = g(t).$$
     La fonction $g$ est continue en $0$ et vérifie $g(2t) = g(t)$ : elle est constante par la question 1. 
    $$\boxed{f \text{ est constante}}$$
     Les fonctions constantes conviennent réciproquement.

    **3.** Soit $f$ continue en $0$ et en $1$ telle que $f(x) = f(x^{2})$ pour tout réel $x$.

    • Pour $x \in [0\,,1[$, une récurrence donne $f(x) = f(x^{2^{n}})$, et $x^{2^{n}} \to 0$ : comme à la question 1, $f(x) = f(0)$.

    • Pour $x > 1$, on a de même $f(x) = f(x^{1/2^{n}})$, et $x^{1/2^{n}} = \exp\big(\frac{\ln x}{2^{n}}\big) \to 1$ : donc $f(x) = f(1)$.

    • La continuité en $1$ et le premier point donnent $f(1) = \lim\limits_{x \to 1^{-}} f(x) = f(0)$.

    • Pour $x < 0$, $f(x) = f(x^{2})$ avec $x^{2} > 0$ : on se ramène aux cas précédents.

    $$\boxed{f \text{ est constante}}$$
     La continuité en $0$ et en $1$ est indispensable : ce sont les deux points fixes de $x \mapsto x^{2}$, vers lesquels convergent les suites itérées.
- id: "ma-08-19"
  feuille: "f-ma-08"
  numero: 19
  partie: "Continuité en un point"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [continuité en un point, valeurs intermédiaires]
  noeuds: [continuite, c-tvi]
