  page_enonce: 5
  page_corrige: 10
  enonce: |
    Déterminer les fonctions continues $f : \mathbb{R} \to \mathbb{R}$ telles que $f(2x) - f(x) = x$ pour tout réel $x$.

    **1.** Soit $f$ une telle fonction. Montrer que, pour tout réel $x$ et tout $n \geqslant 1$, 
    $$f(x) - f\Big(\frac{x}{2^{n}}\Big) = \sum_{k=1}^{n} \frac{x}{2^{k}}.$$

    **2.** Conclure.
  corrige: |
    **1.** L'hypothèse appliquée à $\frac{x}{2^{k}}$ donne $f\big(\frac{x}{2^{k-1}}\big) - f\big(\frac{x}{2^{k}}\big) = \frac{x}{2^{k}}$. En sommant pour $k$ de $1$ à $n$, les termes se télescopent : 
    $$\boxed{f(x) - f\Big(\frac{x}{2^{n}}\Big) = \sum_{k=1}^{n} \frac{x}{2^{k}} = x\Big(1 - \frac{1}{2^{n}}\Big)}.$$
     **2.** Quand $n$ tend vers $+\infty$, $\frac{x}{2^{n}} \to 0$, et par continuité en $0$ on obtient $f(x) - f(0) = x$. Réciproquement, $f : x \mapsto x + c$ vérifie $f(2x) - f(x) = 2x + c - x - c = x$. $\boxed{f(x) = x + c, \ c \in \mathbb{R}}$

    *À retenir.* La différence de deux solutions vérifie $h(2x) = h(x)$, l'équation de l'exercice 18 : il suffit donc de trouver une solution particulière, $x \mapsto x$, comme pour les équations différentielles linéaires du chapitre 6.
- id: "ma-08-20"
  feuille: "f-ma-08"
  numero: 20
  partie: "Continuité en un point"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité en un point, limites, limites à gauche et à droite, fonctions monotones]
  noeuds: [continuite, de-limite, c-monotone]
  notions: [continuite-point, limite-fonction]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $f : \,]0\,,+\infty[ \,\to \mathbb{R}$ une fonction croissante telle que $x \mapsto \dfrac{f(x)}{x}$ soit décroissante. Montrer que $f$ est continue.

    On pourra encadrer $f(x)$ pour $x$ proche d'un réel $a > 0$, de part et d'autre de $a$, et utiliser les limites à gauche et à droite données par le théorème de la limite monotone.
  corrige: |
    Soit $a > 0$. D'après le théorème 6, $f$ admet en $a$ des limites à gauche et à droite.

    **À droite.** Pour $x > a$, la croissance de $f$ et la décroissance de $x \mapsto \frac{f(x)}{x}$ donnent 
    $$f(a) \leqslant f(x) \qquad\text{et}\qquad \frac{f(x)}{x} \leqslant \frac{f(a)}{a}, \qquad\text{d'où}\qquad f(a) \leqslant f(x) \leqslant \frac{x}{a}f(a).$$
     Le majorant tend vers $f(a)$ quand $x \to a$ : l'encadrement donne $\lim\limits_{x \to a^{+}} f(x) = f(a)$.

    **À gauche.** Pour $0 < x < a$, on obtient de même $\frac{x}{a}f(a) \leqslant f(x) \leqslant f(a)$, d'où $\lim\limits_{x \to a^{-}} f(x) = f(a)$.

    $$\boxed{f \text{ est continue en tout } a > 0}$$
     Chacune des deux hypothèses interdit les sauts dans un seul sens : la croissance de $f$ interdit les sauts vers le bas, la décroissance de $\frac{f(x)}{x}$ les sauts vers le haut.
- id: "ma-08-21"
  feuille: "f-ma-08"
  numero: 21
  partie: "Continuité en un point"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [continuité en un point]
  noeuds: [c-point]
  notions: [continuite-point]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Équation de Jensen.* On cherche les fonctions continues $f : \mathbb{R} \to \mathbb{R}$ telles que 
    $$\forall (x, y) \in \mathbb{R}^{2}, \qquad f\Big(\frac{x + y}{2}\Big) = \frac{f(x) + f(y)}{2}.$$

    **1.** Vérifier que les fonctions affines conviennent. Soit $f$ une solution ; on pose $g = f - f(0)$. Montrer que $g$ est solution et que $g\big(\frac{x}{2}\big) = \frac{g(x)}{2}$ pour tout réel $x$.

    **2.** En déduire que $g(x + y) = g(x) + g(y)$ pour tous réels $x$ et $y$.

    **3.** Conclure à l'aide de l'exemple de la section 8.3 du cours. Montrer que la continuité en un seul point suffit.
  corrige: |
    **1.** Si $f(x) = \alpha x + \beta$, alors $f\big(\frac{x + y}{2}\big) = \alpha\frac{x + y}{2} + \beta = \frac{f(x) + f(y)}{2}$ : 
    $$\boxed{\text{les fonctions affines conviennent}}.$$
     Pour une solution $f$, la fonction $g = f - f(0)$ est encore solution, car la constante $-f(0)$ passe dans la moyenne. Avec $y = 0$, on obtient $g\big(\frac{x}{2}\big) = \frac{g(x) + g(0)}{2}$, avec $g(0) = 0$. 
    $$\boxed{g\Big(\frac{x}{2}\Big) = \frac{g(x)}{2}}$$

    **2.** En appliquant la question 1 à $x + y$, puis l'équation, 
    $$\boxed{g(x + y) = 2g\Big(\frac{x + y}{2}\Big) = g(x) + g(y)}.$$
     **3.** La fonction $g$ est continue et vérifie l'équation de Cauchy : d'après l'exemple de la section 8.3 du cours, $g(x) = cx$ avec $c = g(1)$. Ainsi $\boxed{f(x) = cx + f(0)}$ est affine.

    Si $f$ est seulement continue en un point $x_{0}$, alors $g$ aussi, et pour tous réels $x$ et $h$, 
    $$g(x + h) - g(x) = g(h) = g(x_{0} + h) - g(x_{0}),$$
     qui tend vers $0$ quand $h \to 0$ : $g$ est continue en tout point $x$, et la conclusion subsiste. 
    $$\boxed{\text{la continuité en un point suffit}}$$
- id: "ma-08-22"
  feuille: "f-ma-08"
  numero: 22
  partie: "Continuité en un point"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [continuité en un point, densité, fonctions périodiques]
  noeuds: [c-point, tr-dense]
  notions: [continuite-point, partie-dense]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *La fonction de Thomae.* On définit $f : \mathbb{R} \to \mathbb{R}$ par $f(x) = 0$ si $x$ est irrationnel, et $f\big(\frac{p}{q}\big) = \frac{1}{q}$ si $\frac{p}{q}$ est l'écriture irréductible d'un rationnel, avec $p \in \mathbb{Z}$ et $q \in \mathbb{N}^{*}$. La figure représente les points de la courbe d'abscisse rationnelle dans $[0\,,1]$, pour $q \leqslant 12$.

    ![Figure](documents/figures/1130c3470a07aa33.svg)

    **1.** Montrer que $f$ est $1$-périodique, et qu'elle n'est continue en aucun rationnel.

    **2.** Soit $a$ un irrationnel et $\varepsilon > 0$. Montrer que l'ensemble des rationnels $r \in [a - 1\,,a + 1]$ tels que $f(r) \geqslant \varepsilon$ est fini, et en déduire qu'il existe $\delta > 0$ tel que $f(x) < \varepsilon$ pour tout $x \in [a - \delta\,,a + \delta]$.

    **3.** Conclure : $f$ est continue en tout irrationnel. Interpréter la figure.
  corrige: |
    **1.** Si $\frac{p}{q}$ est irréductible, $\frac{p + q}{q}$ l'est aussi, avec le même dénominateur : $f(x + 1) = f(x)$ pour $x$ rationnel, et l'égalité est claire pour $x$ irrationnel. 
    $$\boxed{f \text{ est } 1\text{-périodique}}$$

    Soit $r = \frac{p}{q}$ rationnel. Une suite d'irrationnels qui tend vers $r$ a des images nulles, alors que $f(r) = \frac{1}{q} \neq 0$. 
    $$\boxed{f \text{ n'est continue en aucun rationnel}}$$

    **2.** Un rationnel $r = \frac{p}{q}$ de $[a - 1\,,a + 1]$ tel que $f(r) \geqslant \varepsilon$ a un dénominateur $q \leqslant \frac{1}{\varepsilon}$, et son numérateur vérifie $q(a - 1) \leqslant p \leqslant q(a + 1)$ : il n'y a qu'un nombre fini de couples $(p, q)$ possibles. 
    $$\boxed{\text{l'ensemble } F \text{ de ces rationnels est fini}}$$

    Comme $a$ est irrationnel, $a \notin F$ ; on pose $\delta = \frac{1}{2}\min\big(1, \min\limits_{r \in F} |r - a|\big)$, avec $\delta = \frac{1}{2}$ si $F$ est vide. C'est un réel strictement positif, car un minimum d'un nombre fini de réels strictement positifs l'est aussi, et l'intervalle $[a - \delta\,,a + \delta]$ ne contient aucun élément de $F$. Si $|x - a| \leqslant \delta$, alors ou bien $x$ est irrationnel et $f(x) = 0$, ou bien $x$ est un rationnel hors de $F$ et $f(x) < \varepsilon$. 
    $$\boxed{f(x) < \varepsilon \text{ sur } [a - \delta\,,a + \delta]}$$

    **3.** On a donc $|f(x) - f(a)| = f(x) < \varepsilon$ pour $|x - a| \leqslant \delta$. 
    $$\boxed{f \text{ est continue en tout irrationnel}}$$
     Sur la figure, au-dessus de toute hauteur $\varepsilon$, il n'y a qu'un nombre fini de points : près d'un irrationnel, la courbe reste aussi basse que l'on veut.
- id: "ma-08-23"
  feuille: "f-ma-08"
  numero: 23
  partie: "Fonctions continues sur un intervalle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions continues sur un intervalle]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f : x \mapsto x^{3} - 3x^{2} - 1$. Discuter, selon la valeur du réel $a$, le nombre de solutions réelles de l'équation $f(x) = a$.
  corrige: |
    La fonction $f$ est dérivable, de dérivée $f'(x) = 3x^{2} - 6x = 3x(x - 2)$, positive sur $]-\infty\,,0]$ et $[2\,,+\infty[$ et négative sur $[0\,,2]$, ne s'annulant qu'en $0$ et $2$. Ainsi $f$ est strictement croissante sur $]-\infty\,,0]$, strictement décroissante sur $[0\,,2]$, strictement croissante sur $[2\,,+\infty[$, avec 
    $$f(0) = -1, \qquad f(2) = -5, \qquad \lim\limits_{x \to -\infty} f(x) = -\infty, \qquad \lim\limits_{x \to +\infty} f(x) = +\infty.$$
     Par le théorème de la bijection continue, $f$ réalise une bijection de $]-\infty\,,0]$ sur $]-\infty\,,-1]$, de $[0\,,2]$ sur $[-5\,,-1]$ et de $[2\,,+\infty[$ sur $[-5\,,+\infty[$. Le nombre de solutions de $f(x) = a$ est le nombre de ces trois intervalles qui contiennent $a$, en prenant garde aux valeurs $-1$ et $-5$, atteintes en deux bornes communes. 
    $$\boxed{\begin{array}{c|c|c|c|c|c} a & a < -5 & a = -5 & -5 < a < -1 & a = -1 & a > -1 \\ \hline \text{nombre de solutions} & 1 & 2 & 3 & 2 & 1 \end{array}}$$
- id: "ma-08-24"
  feuille: "f-ma-08"
  numero: 24
  partie: "Fonctions continues sur un intervalle"
  etoiles: 1
  types: [Algorithmique, Démonstration]
  mots_cles: [fonctions continues sur un intervalle]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    **1.** Montrer que l'équation $x^{3} + x^{2} - 4x + 1 = 0$ admet exactement trois solutions réelles, et donner pour chacune un intervalle d'extrémités entières qui la contient.

    **2.** À l'aide de l'algorithme de dichotomie, donner un encadrement d'amplitude inférieure à $10^{-1}$ de la plus grande des trois solutions. Combien d'étapes faut-il, au plus, pour obtenir un encadrement d'amplitude $10^{-6}$ ?

    **3.** Écrire une fonction Python `dichotomie(f, a, b, eps)` qui renvoie un encadrement d'amplitude inférieure à `eps` d'une solution de $f(x) = 0$ dans $[a\,,b]$, lorsque $f$ est continue et que $f(a)f(b) \leqslant 0$.
  corrige: |
    **1.** Soit $P(x) = x^{3} + x^{2} - 4x + 1$. On calcule 
    $$P(-3) = -5, \qquad P(-2) = 5, \qquad P(0) = 1, \qquad P(1) = -1, \qquad P(2) = 5.$$
     Par le théorème des valeurs intermédiaires, $P$ s'annule dans chacun des intervalles $]-3\,,-2[$, $]0\,,1[$ et $]1\,,2[$, qui sont disjoints : il y a au moins trois solutions. Il n'y en a pas d'autre : la dérivée $P'(x) = 3x^{2} + 2x - 4$ a deux racines $x_{1} < x_{2}$, et $P$ est strictement monotone sur chacun des intervalles $]-\infty\,,x_{1}]$, $[x_{1}\,,x_{2}]$, $[x_{2}\,,+\infty[$, où elle s'annule donc au plus une fois. 
    $$\boxed{\text{trois solutions, dans } ]-3\,,-2[,\ ]0\,,1[ \text{ et } ]1\,,2[}$$

    **2.** On applique la dichotomie à partir de $[1\,,2]$, où $P(1) < 0 < P(2)$ : 
    $$\begin{array}{c|c|c|c} \text{segment} & \text{milieu } m & P(m) & \text{nouveau segment} \\ \hline \relax[1\,,2] & 1{,}5 & 0{,}625 > 0 & [1\,,1{,}5] \\ \relax[1\,,1{,}5] & 1{,}25 & \approx -0{,}48 < 0 & [1{,}25\,,1{,}5] \\ \relax[1{,}25\,,1{,}5] & 1{,}375 & \approx -0{,}010 < 0 & [1{,}375\,,1{,}5] \\ \relax[1{,}375\,,1{,}5] & 1{,}4375 & \approx 0{,}29 > 0 & [1{,}375\,,1{,}4375] \end{array}$$
     Après quatre étapes, 
    $$\boxed{1{,}375 \leqslant \alpha \leqslant 1{,}4375},$$
     encadrement d'amplitude $0{,}0625 < 10^{-1}$. Après $n$ étapes, l'amplitude vaut $\frac{1}{2^{n}}$, et $2^{-n} < 10^{-6}$ équivaut à $n \geqslant 20$, puisque $2^{19} = 524\,288 < 10^{6} < 2^{20} = 1\,048\,576$. 
    $$\boxed{20 \text{ étapes}}$$

    **3.** À chaque étape, on garde la moitié aux extrémités de laquelle $f$ prend des valeurs de signes contraires, au sens large : 

    ```python
    def dichotomie(f, a, b, eps):
        while b - a >= eps:
            m = (a + b) / 2
            if f(a) * f(m) <= 0:   # une solution dans [a, m]
                b = m
            else:                  # f(m) et f(b) de signes contraires
                a = m
        return a, b
    ```

     L'appel `dichotomie(lambda x: x**3 + x**2 - 4*x + 1, 1, 2, 1e-6)` renvoie un encadrement de $\alpha \approx 1{,}377202$. La terminaison est assurée par la division par deux de l'amplitude, et la correction par l'invariant $f(a)f(b) \leqslant 0$, qui est celui de la démonstration du théorème 8.
- id: "ma-08-25"
  feuille: "f-ma-08"
  numero: 25
  partie: "Fonctions continues sur un intervalle"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Montrer que l'équation $\cos x = \dfrac{1}{x}$ admet une infinité de solutions dans $]0\,,+\infty[$. On pourra chercher une solution dans chaque intervalle $\big[2k\pi\,,2k\pi + \frac{\pi}{2}\big]$, pour $k \geqslant 1$.
  corrige: |
    Soit $\varphi : x \mapsto \cos x - \frac{1}{x}$, continue sur $]0\,,+\infty[$. Pour $k \geqslant 1$, 
    $$\varphi(2k\pi) = 1 - \frac{1}{2k\pi} > 0 \qquad\text{et}\qquad \varphi\Big(2k\pi + \frac{\pi}{2}\Big) = -\frac{1}{2k\pi + \frac{\pi}{2}} < 0.$$
     Le théorème des valeurs intermédiaires fournit une solution dans chaque intervalle $\big]2k\pi\,,2k\pi + \frac{\pi}{2}\big[$ ; ces intervalles étant disjoints, les solutions sont distinctes. 
    $$\boxed{\text{une infinité de solutions}}$$
- id: "ma-08-26"
  feuille: "f-ma-08"
  numero: 26
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions continues sur un intervalle]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $a$ un réel. On considère l'équation $(E_{a})$ : $\ln x = ax$, d'inconnue $x > 0$.

    **1.** Montrer que, si $a \leqslant 0$, l'équation $(E_{a})$ admet une unique solution, et qu'elle appartient à $]0\,,1]$.

    **2.** Montrer que, si $0 < a < \frac{1}{\mathrm{e}}$, l'équation $(E_{a})$ admet exactement deux solutions.

    **3.** Étudier les cas $a = \frac{1}{\mathrm{e}}$ et $a > \frac{1}{\mathrm{e}}$.
  corrige: |
    Pour $x > 0$, l'équation $(E_{a})$ équivaut à $h(x) = a$, où $h(x) = \frac{\ln x}{x}$. La fonction $h$ est dérivable, de dérivée $h'(x) = \frac{1 - \ln x}{x^{2}}$ : elle est strictement croissante sur $]0\,,\mathrm{e}]$ et strictement décroissante sur $[\mathrm{e}\,,+\infty[$, avec 
    $$\lim\limits_{x \to 0^{+}} h(x) = -\infty, \qquad h(1) = 0, \qquad h(\mathrm{e}) = \frac{1}{\mathrm{e}}, \qquad \lim\limits_{x \to +\infty} h(x) = 0,$$
     la dernière limite par croissances comparées. D'après le théorème de la bijection continue, $h$ réalise une bijection de $]0\,,\mathrm{e}]$ sur $\big]-\infty\,,\frac{1}{\mathrm{e}}\big]$, et de $[\mathrm{e}\,,+\infty[$ sur $\big]0\,,\frac{1}{\mathrm{e}}\big]$, puisque $h > 0$ sur $]1\,,+\infty[$.

    **1.** Si $a \leqslant 0$, la valeur $a$ a un unique antécédent dans $]0\,,\mathrm{e}]$, qui est dans $]0\,,1]$ car $h(1) = 0 \geqslant a$, et aucun dans $[\mathrm{e}\,,+\infty[$. 
    $$\boxed{\text{une unique solution, dans } ]0\,,1]}$$

    **2.** Si $0 < a < \frac{1}{\mathrm{e}}$, la valeur $a$ a un antécédent dans $]1\,,\mathrm{e}[$ et un dans $]\mathrm{e}\,,+\infty[$. 
    $$\boxed{\text{deux solutions}}$$

    **3.** Si $a = \frac{1}{\mathrm{e}}$, la seule solution est $\boxed{x = \mathrm{e}}$ ; si $a > \frac{1}{\mathrm{e}}$, 
    $$\boxed{\text{il n'y a aucune solution}},$$
     puisque $\frac{1}{\mathrm{e}}$ est le maximum de $h$. Géométriquement, la droite d'équation $y = \frac{x}{\mathrm{e}}$ est tangente à la courbe du logarithme au point d'abscisse $\mathrm{e}$.
- id: "ma-08-27"
  feuille: "f-ma-08"
  numero: 27
  partie: "Fonctions continues sur un intervalle"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, valeurs intermédiaires]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $I$ un intervalle.

    **1.** Montrer que toute fonction continue $f : I \to \mathbb{Z}$ est constante.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue telle que $f(x)^{2} = 1$ pour tout réel $x$. Montrer que $f = 1$ ou $f = -1$.

    **3.** Soit $f$ et $g$ continues sur $I$, telles que $f$ ne s'annule pas et que $f^{2} = g^{2}$. Montrer que $f = g$ ou $f = -g$. Montrer que le résultat est faux si l'on supprime l'une des trois hypothèses : $f$ continue, $f$ ne s'annulant pas, $I$ intervalle.
  corrige: |
    **1.** D'après le théorème 9, $f(I)$ est un intervalle contenu dans $\mathbb{Z}$ ; or un intervalle contenant deux entiers distincts $m < n$ contient aussi $m + \frac{1}{2} \notin \mathbb{Z}$. Donc $f(I)$ est réduit à un point. 
    $$\boxed{f \text{ est constante}}$$

    **2.** La fonction $f$ est continue sur l'intervalle $\mathbb{R}$, à valeurs dans $\{-1, 1\}$ : le même argument montre que $f(\mathbb{R})$ est un singleton. 
    $$\boxed{f = 1 \text{ ou } f = -1}$$

    **3.** La fonction $h = \frac{g}{f}$ est continue sur $I$, puisque $f$ ne s'annule pas, et $h^{2} = 1$ : par la question 2, appliquée sur $I$, $h = 1$ ou $h = -1$. 
    $$\boxed{g = f \text{ ou } g = -f}$$
     Chaque hypothèse est nécessaire :

    • *sans continuité de $f$* : $f$ valant $1$ sur $\mathbb{Q}$ et $-1$ ailleurs, et $g = 1$ ;

    • *si $f$ s'annule* : $f : x \mapsto x$ et $g : x \mapsto |x|$ sur $\mathbb{R}$ ;

    • *si $I$ n'est pas un intervalle* : $f = 1$ et $g$ valant $1$ sur $]0\,,+\infty[$ et $-1$ sur $]-\infty\,,0[$, continue sur $\mathbb{R}^{*}$.
- id: "ma-08-28"
  feuille: "f-ma-08"
  numero: 28
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, caractérisation séquentielle]
  noeuds: [c-tvi, de-limite, su-convergence]
  notions: [continuite]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Moyennes.* Soit $f : [a\,,b] \to \mathbb{R}$ continue.

    **1.** Soit $p$ et $q$ deux réels strictement positifs. Montrer qu'il existe $c \in [a\,,b]$ tel que 
    $$pf(a) + qf(b) = (p + q)f(c).$$

    **2.** Soit $x_{1}, \dots, x_{n}$ des éléments de $[a\,,b]$. Montrer qu'il existe $c \in [a\,,b]$ tel que 
    $$f(c) = \frac{f(x_{1}) + \cdots + f(x_{n})}{n}.$$

    **3.** Le résultat de la question 1 subsiste-t-il si $p$ et $q$ sont de signes contraires ?
  corrige: |
    **1.** Le réel $y = \frac{pf(a) + qf(b)}{p + q}$ est une moyenne pondérée de $f(a)$ et $f(b)$, à poids positifs : il est compris entre eux, car par exemple, si $f(a) \leqslant f(b)$, 
    $$f(a) = \frac{pf(a) + qf(a)}{p + q} \leqslant y \leqslant \frac{pf(b) + qf(b)}{p + q} = f(b).$$
     Le théorème des valeurs intermédiaires fournit 
    $$\boxed{c \in [a\,,b] \text{ tel que } f(c) = y}.$$

    **2.** Soit $x_{i}$ et $x_{j}$ des points où $f(x_{i})$ est le plus petit et $f(x_{j})$ le plus grand des $f(x_{k})$. La moyenne est comprise entre $f(x_{i})$ et $f(x_{j})$, et le théorème des valeurs intermédiaires, appliqué sur le segment d'extrémités $x_{i}$ et $x_{j}$, conclut.

    **3.** Non. Avec $f = \mathrm{id}$ sur $[0\,,1]$, $p = 2$ et $q = -1$, on obtient $\frac{2f(0) - f(1)}{2 - 1} = -1$, qui n'est pas atteint. 
    $$\boxed{\text{faux si } pq < 0}$$
     La moyenne n'est plus alors entre $f(a)$ et $f(b)$.
- id: "ma-08-29"
  feuille: "f-ma-08"
  numero: 29
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites, valeurs intermédiaires, fonctions monotones]
  noeuds: [c-tvi, de-limite, c-monotone]
  notions: [continuite, limite-fonction]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *Points fixes.* Montrer que les fonctions suivantes admettent un point fixe.

    **1.** Une fonction continue $f : [a\,,b] \to \mathbb{R}$ telle que $[a\,,b] \subset f([a\,,b])$.

    **2.** Une fonction continue et décroissante $f : \mathbb{R} \to \mathbb{R}$ ; montrer de plus que ce point fixe est unique.

    **3.** Une fonction continue $f : [0\,,+\infty[ \,\to [0\,,+\infty[$ telle que $\lim\limits_{x \to +\infty} \dfrac{f(x)}{x} = \ell$, avec $\ell < 1$.

    **4.** Une fonction continue $f : I \to I$, où $I$ est un intervalle, telle que $f \circ f$ admette un point fixe. Le résultat subsiste-t-il si $f$ n'est plus supposée continue ?
  corrige: |
    Dans chaque cas, on étudie le signe de $g : x \mapsto f(x) - x$, continue, et l'on applique le théorème des valeurs intermédiaires.

    **1.** Il existe $u$ et $v$ dans $[a\,,b]$ tels que $f(u) = a$ et $f(v) = b$. Alors $g(u) = a - u \leqslant 0$ et $g(v) = b - v \geqslant 0$, et $g$ s'annule entre $u$ et $v$. 
    $$\boxed{f \text{ admet un point fixe}}$$

    **2.** La fonction $g$ est strictement décroissante, comme somme d'une fonction décroissante et d'une fonction strictement décroissante. Pour $x \leqslant 0$, $f(x) \geqslant f(0)$, donc $g(x) \geqslant f(0) - x$ tend vers $+\infty$ en $-\infty$ ; de même, $g(x) \leqslant f(0) - x$ pour $x \geqslant 0$. Ainsi $g$ prend des valeurs positives et négatives, s'annule par le théorème des valeurs intermédiaires, et une seule fois par stricte monotonie. 
    $$\boxed{\text{un unique point fixe}}$$

    **3.** On a $g(0) = f(0) \geqslant 0$. Comme $\frac{f(x)}{x} \to \ell < 1$, il existe $A > 0$ tel que $\frac{f(x)}{x} \leqslant \frac{1 + \ell}{2} < 1$ pour $x \geqslant A$ ; alors $g(A) < 0$. 
    $$\boxed{f \text{ admet un point fixe dans } [0\,,A]}$$

    **4.** Soit $x_{0}$ tel que $f(f(x_{0})) = x_{0}$, et $y_{0} = f(x_{0}) \in I$. Si $y_{0} = x_{0}$, c'est fini. Sinon, $g(x_{0}) = y_{0} - x_{0}$ et $g(y_{0}) = x_{0} - y_{0}$ sont de signes contraires, et $g$ s'annule entre $x_{0}$ et $y_{0}$, segment contenu dans l'intervalle $I$. 
    $$\boxed{f \text{ admet un point fixe}}$$

    Sans continuité, c'est faux : sur $I = [0\,,1]$, la fonction valant $1$ sur $\big[0\,,\frac{1}{2}\big]$ et $0$ sur $\big]\frac{1}{2}\,,1\big]$ vérifie $f(f(0)) = f(1) = 0$, mais n'a pas de point fixe, car $f(x) = x$ imposerait $x \in \{0, 1\}$.
- id: "ma-08-30"
  feuille: "f-ma-08"
  numero: 30
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions continues sur un intervalle, limites]
  noeuds: [c-tvi, de-limite]
  notions: [continuite, limite-fonction]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    *Une suite définie implicitement.*

    **1.** Montrer que, pour tout $n \in \mathbb{N}$, l'équation $\tan x = x$ admet une unique solution $x_{n}$ dans l'intervalle $\big]n\pi - \frac{\pi}{2}\,,n\pi + \frac{\pi}{2}\big[$.

    **2.** Montrer que $\lim\limits_{n \to +\infty} (x_{n} - n\pi) = \dfrac{\pi}{2}$.

    **3.** En déduire que $\lim\limits_{n \to +\infty} n\Big(\dfrac{\pi}{2} + n\pi - x_{n}\Big) = \dfrac{1}{\pi}$. On pourra exprimer $\tan\big(\frac{\pi}{2} + n\pi - x_{n}\big)$ à l'aide de $x_{n}$.
  corrige: |
    **1.** Sur $I_{n} = \big]n\pi - \frac{\pi}{2}\,,n\pi + \frac{\pi}{2}\big[$, la fonction $\varphi : x \mapsto \tan x - x$ est dérivable, de dérivée $\tan^{2}x \geqslant 0$, qui ne s'annule qu'en $n\pi$ : elle est strictement croissante. Ses limites aux bornes de $I_{n}$ valent $-\infty$ et $+\infty$, car $\tan$ y tend vers $\mp\infty$. Par le théorème de la bijection continue, $\varphi$ s'annule une et une seule fois sur $I_{n}$. 
    $$\boxed{x_{n} \text{ existe et est unique}}$$
     On a $x_{0} = 0$.

    **2.** Pour $n \geqslant 1$, on a $x_{n} > 0$, donc $\tan x_{n} = x_{n} > 0$, et $x_{n} \in \big]n\pi\,,n\pi + \frac{\pi}{2}\big[$. Posons 
    $$\varepsilon_{n} = n\pi + \frac{\pi}{2} - x_{n} \in \Big]0\,,\frac{\pi}{2}\Big[.$$
     Comme $\tan\big(\frac{\pi}{2} - \varepsilon\big) = \frac{1}{\tan\varepsilon}$, l'équation donne 
    $$\frac{1}{\tan\varepsilon_{n}} = x_{n}, \qquad\text{soit}\qquad \varepsilon_{n} = \operatorname{Arctan}\frac{1}{x_{n}}.$$
     Or $x_{n} > n\pi$ tend vers $+\infty$, et $\operatorname{Arctan}$ est continue en $0$ : $\varepsilon_{n} \to 0$. 
    $$\boxed{\lim\limits_{n \to +\infty} (x_{n} - n\pi) = \frac{\pi}{2}}$$

    **3.** On écrit $n\varepsilon_{n} = \dfrac{\operatorname{Arctan} u_{n}}{u_{n}} \times \dfrac{n}{x_{n}}$, avec $u_{n} = \frac{1}{x_{n}} \to 0$. Le premier facteur tend vers $\operatorname{Arctan}'(0) = 1$, comme taux d'accroissement ; le second tend vers $\frac{1}{\pi}$, puisque $\frac{x_{n}}{n} = \pi + \frac{\pi/2 - \varepsilon_{n}}{n} \to \pi$. 
    $$\boxed{\lim\limits_{n \to +\infty} n\Big(\frac{\pi}{2} + n\pi - x_{n}\Big) = \frac{1}{\pi}}$$

    Numériquement, pour $n = 1000$, $n\varepsilon_{n} \approx 0{,}31815$, contre $\frac{1}{\pi} \approx 0{,}31831$. Ce résultat se lit 
    $$x_{n} = n\pi + \frac{\pi}{2} - \frac{1}{n\pi} + \cdots$$
     C'est le début d'un développement asymptotique, que le chapitre 10 permettra de poursuivre.
- id: "ma-08-31"
  feuille: "f-ma-08"
  numero: 31
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites, bijection continue]
  noeuds: [c-tvi, de-limite, c-bijection]
  notions: [continuite, limite-fonction]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue telle que $\lim\limits_{x \to -\infty} f(x) = \lim\limits_{x \to +\infty} f(x) = \ell$, avec $\ell$ réel. Montrer que $f$ n'est pas injective.

    **2.** Même question pour $f : \,]a\,,b[ \,\to \mathbb{R}$ continue telle que $\lim\limits_{x \to a} f(x) = \lim\limits_{x \to b} f(x) = \ell$.

    **3.** Montrer qu'il n'existe pas de fonction continue $f : \mathbb{R} \to \mathbb{R}$ telle que $f \circ f = -\mathrm{id}_{\mathbb{R}}$. On commencera par montrer qu'une telle fonction serait injective.
  corrige: |
    **1.** Supposons $f$ injective. Continue et injective sur l'intervalle $\mathbb{R}$, elle est strictement monotone (proposition 17), disons strictement croissante, l'autre cas s'en déduisant en changeant $f$ en $-f$. D'après le théorème 6, $\lim\limits_{x \to +\infty} f(x) = \sup_{\mathbb{R}} f > f(1)$, puisque $f(2) > f(1)$, et de même $\lim\limits_{x \to -\infty} f(x) = \inf_{\mathbb{R}} f < f(0)$. On aurait $\ell > f(1) > f(0) > \ell$, ce qui est absurde. 
    $$\boxed{f \text{ n'est pas injective}}$$

    **2.** Même raisonnement sur l'intervalle $]a\,,b[$, en remplaçant $0$ et $1$ par deux points $c < d$ de $]a\,,b[$.

    **3.** Si $f \circ f = -\mathrm{id}_{\mathbb{R}}$, alors $f(x) = f(y)$ entraîne $-x = f(f(x)) = f(f(y)) = -y$ : $f$ est injective, donc strictement monotone. Mais alors $f \circ f$ est strictement croissante, la composée de deux fonctions strictement monotones de même sens étant croissante, alors que $-\mathrm{id}_{\mathbb{R}}$ est décroissante. 
    $$\boxed{\text{une telle fonction n'existe pas}}$$

    En revanche, il existe des fonctions non continues vérifiant $f \circ f = -\mathrm{id}_{\mathbb{R}}$ ; la continuité est donc ici essentielle.
- id: "ma-08-32"
  feuille: "f-ma-08"
  numero: 32
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, continuité en un point, valeurs intermédiaires, bijection continue]
  noeuds: [c-tvi, c-point, c-bijection]
  notions: [continuite, continuite-point]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    *La réciproque du théorème des valeurs intermédiaires est fausse.* Soit $f : [0\,,1] \to \mathbb{R}$ définie par $f(0) = 0$ et $f(x) = \sin\frac{1}{x}$ pour $x > 0$.

    **1.** Montrer que $f$ n'est pas continue en $0$.

    **2.** Soit $0 \leqslant a < b \leqslant 1$ et $y$ compris entre $f(a)$ et $f(b)$. Montrer qu'il existe $c \in [a\,,b]$ tel que $f(c) = y$, en traitant d'abord le cas $a > 0$.

    Ainsi $f$ vérifie la conclusion du théorème des valeurs intermédiaires sans être continue.
  corrige: |
    **1.** La suite $x_{n} = \frac{1}{2n\pi + \pi/2}$ tend vers $0$, et $f(x_{n}) = 1 \neq f(0)$. 
    $$\boxed{f \text{ n'est pas continue en } 0}$$

    **2.** *Cas $a > 0$.* La fonction $f$ est continue sur $[a\,,b]$, et le théorème des valeurs intermédiaires s'applique directement.

    *Cas $a = 0$.* On a $f(0) = 0$, et $y$ est compris entre $0$ et $f(b)$. Si $y = 0$, on prend $c = 0$. Sinon, choisissons un entier $n$ tel que $d = \frac{1}{n\pi} < b$ : alors $f(d) = \sin(n\pi) = 0$, et $y$ est compris entre $f(d)$ et $f(b)$, avec $f$ continue sur $[d\,,b]$. Le théorème des valeurs intermédiaires fournit $c \in [d\,,b]$. 
    $$\boxed{f \text{ vérifie la propriété des valeurs intermédiaires}}$$

    *À retenir.* La fonction $f$ prend une infinité de fois la valeur $f(0) = 0$ près de $0$ : c'est ce qui permet de recopier près de $0$ la valeur atteinte en $0$, sans continuité.
- id: "ma-08-33"
  feuille: "f-ma-08"
  numero: 33
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions continues sur un intervalle, limites, bornes atteintes]
  noeuds: [c-tvi, de-limite, c-bornes]
  notions: [continuite, limite-fonction]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $x_{1} < x_{2} < \cdots < x_{n}$ des réels, et $\varphi : x \mapsto \sum\limits_{k=1}^{n} |x - x_{k}|$.

    **1.** Montrer que $\varphi$ est continue, et que $\lim\limits_{x \to \pm\infty} \varphi(x) = +\infty$. En déduire que $\varphi$ admet un minimum sur $\mathbb{R}$, en appliquant le théorème des bornes atteintes sur un segment bien choisi.

    **2.** Montrer que $\varphi$ est affine sur chaque intervalle $[x_{k}\,,x_{k+1}]$, et déterminer sa pente.

    **3.** Déterminer l'ensemble des points en lesquels $\varphi$ atteint son minimum, en distinguant selon la parité de $n$.
  corrige: |
    **1.** La fonction $\varphi$ est continue comme somme de fonctions continues. Pour tout réel $x$, on a $|x - x_{k}| \geqslant |x| - |x_{k}|$, donc 
    $$\varphi(x) \geqslant n|x| - S, \qquad\text{avec}\qquad S = \sum_{k=1}^{n} |x_{k}|,$$
     et $\varphi$ tend vers $+\infty$ en $\pm\infty$. Il existe donc $R > 0$ tel que $\varphi(x) \geqslant \varphi(0)$ pour $|x| \geqslant R$. Sur le segment $[-R\,,R]$, $\varphi$ atteint un minimum $m \leqslant \varphi(0)$ (théorème 10), qui est alors un minimum sur $\mathbb{R}$. 
    $$\boxed{\varphi \text{ admet un minimum}}$$

    **2.** Sur $[x_{k}\,,x_{k+1}]$, les $k$ termes d'indice $j \leqslant k$ valent $x - x_{j}$ et les $n - k$ autres valent $x_{j} - x$ : $\varphi$ y est affine, de pente $\boxed{k - (n - k) = 2k - n}$. Elle est de pente $-n$ avant $x_{1}$ et $n$ après $x_{n}$.

    **3.** La pente $2k - n$ est négative tant que $k < \frac{n}{2}$ et positive dès que $k > \frac{n}{2}$ : $\varphi$ décroît, puis croît.

    • Si $n$ est impair, $n = 2p + 1$, aucune pente n'est nulle, et le minimum est atteint au seul point $\boxed{x_{p+1}}$, la *médiane* des $x_{k}$.

    • Si $n = 2p$ est pair, la pente est nulle sur $[x_{p}\,,x_{p+1}]$, et le minimum est atteint sur tout le segment $\boxed{[x_{p}\,,x_{p+1}]}$.

    La médiane minimise ainsi la somme des écarts absolus, comme la moyenne minimise la somme des carrés des écarts.
- id: "ma-08-34"
  feuille: "f-ma-08"
  numero: 34
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites, bornes atteintes, fonctions périodiques]
  noeuds: [c-tvi, de-limite, c-bornes]
  notions: [continuite, limite-fonction]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    *Bornes atteintes.*

    **1.** Soit $f$ et $g$ continues sur $[a\,,b]$, telles que $f(x) < g(x)$ pour tout $x \in [a\,,b]$. Montrer qu'il existe $\varepsilon > 0$ tel que $f(x) + \varepsilon \leqslant g(x)$ pour tout $x \in [a\,,b]$. Le résultat subsiste-t-il sur $]0\,,1]$ ?

    **2.** Montrer qu'une fonction continue et périodique sur $\mathbb{R}$ est bornée et atteint ses bornes.

    **3.** Soit $f : [0\,,+\infty[ \,\to \mathbb{R}$ continue, admettant une limite finie en $+\infty$. Montrer que $f$ est bornée. Atteint-elle nécessairement ses bornes ?

    **4.** Soit $f : \mathbb{R} \to \mathbb{R}$ bornée et $g : \mathbb{R} \to \mathbb{R}$ continue. Montrer que $g \circ f$ est bornée. Et $f \circ g$ ?
  corrige: |
    **1.** La fonction $g - f$ est continue et strictement positive sur le segment $[a\,,b]$ : elle y atteint son minimum $m = (g - f)(x_{0}) > 0$ (théorème 10), et $\boxed{\varepsilon = m}$ convient. Sur $]0\,,1]$, c'est faux : avec $f = 0$ et $g = \mathrm{id}$, on a $f < g$, mais $\inf (g - f) = 0$.

    **2.** Soit $T > 0$ une période. Sur le segment $[0\,,T]$, la fonction $f$ est bornée et atteint ses bornes, et l'on a $f(\mathbb{R}) = f([0\,,T])$ par périodicité. 
    $$\boxed{f \text{ est bornée et atteint ses bornes}}$$

    **3.** Il existe $A$ tel que $|f(x) - \ell| \leqslant 1$ pour $x \geqslant A$, et $f$ est bornée sur le segment $[0\,,A]$. 
    $$\boxed{f \text{ est bornée}}$$
     Elle n'atteint pas nécessairement ses bornes : $x \mapsto \frac{x}{1 + x}$ a pour borne supérieure $1$, qui n'est pas atteinte.

    **4.** Si $|f| \leqslant M$, alors $g \circ f$ prend ses valeurs dans $g([-M\,,M])$, qui est borné par le théorème 10. 
    $$\boxed{g \circ f \text{ est bornée}}$$
     Quant à $f \circ g$, elle est bornée par $M$ sans aucune hypothèse sur $g$ : c'est le piège de la question.
- id: "ma-08-35"
  feuille: "f-ma-08"
  numero: 35
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites, limites à gauche et à droite, fonctions monotones]
  noeuds: [c-tvi, de-limite, c-monotone]
  notions: [continuite, limite-fonction]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $f : [0\,,+\infty[ \,\to \mathbb{R}$ continue. Pour $x \geqslant 0$, on pose $M(x) = \sup\limits_{t \in [0,x]} f(t)$.

    **1.** Justifier l'existence de $M(x)$, et montrer que $M$ est croissante.

    **2.** Soit $a \geqslant 0$ et $x > a$. Montrer que $M(x) = \max\big(M(a), \max\limits_{[a,x]} f\big)$, et en déduire que $M$ est continue à droite en $a$.

    **3.** Montrer que $M$ est continue à gauche en tout $a > 0$, et conclure.
  corrige: |
    **1.** La fonction $f$ est continue sur le segment $[0\,,x]$ : elle y est bornée et atteint son maximum, donc $M(x)$ existe et c'est un maximum. Si $x \leqslant y$, alors $[0\,,x] \subset [0\,,y]$ et $M(x) \leqslant M(y)$. 
    $$\boxed{M \text{ est croissante}}$$

    **2.** Comme $[0\,,x] = [0\,,a] \cup [a\,,x]$, on a 
    $$\boxed{M(x) = \max\big(M(a), \max\limits_{[a,x]} f\big)}.$$
     Soit $\varepsilon > 0$ et $\delta > 0$ tel que $f(t) \leqslant f(a) + \varepsilon$ pour $t \in [a\,,a + \delta]$. Pour $a < x \leqslant a + \delta$, on obtient, puisque $f(a) \leqslant M(a)$, 
    $$M(a) \leqslant M(x) \leqslant \max\big(M(a), f(a) + \varepsilon\big) \leqslant M(a) + \varepsilon.$$

    $$\boxed{M \text{ est continue à droite en } a}$$

    **3.** Soit $a > 0$, $\varepsilon > 0$, et $\delta \in \,]0\,,a]$ tel que $|f(t) - f(a)| \leqslant \varepsilon$ pour $t \in [a - \delta\,,a]$. Pour $x \in [a - \delta\,,a[$, on a $M(a) = \max\big(M(x), \max_{[x,a]} f\big)$ et $M(x) \leqslant M(a)$. Si $M(a) = M(x)$, il n'y a rien à faire ; sinon, $M(a) = \max_{[x,a]} f \leqslant f(a) + \varepsilon$, et 
    $$M(x) \geqslant f(x) \geqslant f(a) - \varepsilon \geqslant M(a) - 2\varepsilon.$$
     Dans tous les cas, $M(a) - 2\varepsilon \leqslant M(x) \leqslant M(a)$. 
    $$\boxed{M \text{ est continue sur } [0\,,+\infty[}$$
- id: "ma-08-36"
  feuille: "f-ma-08"
  numero: 36
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites]
  noeuds: [c-tvi, de-limite]
  notions: [continuite, limite-fonction]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    *Deux fonctions qui se croisent.* Soit $f$ et $g$ deux fonctions continues sur $[a\,,b]$.

    **1.** On suppose que $\max\limits_{[a,b]} f = \max\limits_{[a,b]} g$. Montrer qu'il existe $x_{0} \in [a\,,b]$ tel que $f(x_{0}) = g(x_{0})$.

    **2.** On suppose que $f([a\,,b]) \subset g([a\,,b])$. Montrer la même conclusion.
  corrige: |
    Dans les deux questions, on cherche deux points où la fonction continue $h = f - g$ prend des valeurs de signes contraires.

    **1.** Soit $M$ le maximum commun, atteint par $f$ en $u$ et par $g$ en $v$. Alors $h(u) = M - g(u) \geqslant 0$ et $h(v) = f(v) - M \leqslant 0$. 
    $$\boxed{h \text{ s'annule entre } u \text{ et } v}$$

    **2.** Soit $v$ et $w$ des points où $g$ atteint son maximum et son minimum. Comme le maximum de $f$ appartient à $f([a\,,b])$, donc à $g([a\,,b])$, on a $\max f \leqslant g(v)$, donc $h(v) \leqslant 0$ ; de même, $\min f \geqslant g(w)$, donc $h(w) \geqslant 0$. 
    $$\boxed{h \text{ s'annule entre } v \text{ et } w}$$
- id: "ma-08-37"
  feuille: "f-ma-08"
  numero: 37
  partie: "Fonctions continues sur un intervalle"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [fonctions continues sur un intervalle, limites, fonctions monotones]
  noeuds: [c-tvi, de-limite, c-monotone]
  notions: [continuite, limite-fonction]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    *Le théorème de la corde universelle.* Soit $f : [0\,,1] \to \mathbb{R}$ continue telle que $f(0) = f(1)$.

    **1.** Soit $n \geqslant 2$ et $g : x \mapsto f\big(x + \frac{1}{n}\big) - f(x)$, définie sur $\big[0\,,1 - \frac{1}{n}\big]$. Calculer $\sum\limits_{k=0}^{n-1} g\big(\frac{k}{n}\big)$, et en déduire qu'il existe $c \in \big[0\,,1 - \frac{1}{n}\big]$ tel que $f\big(c + \frac{1}{n}\big) = f(c)$.

    **2.** Soit $\alpha \in \,]0\,,1[$ tel que $\frac{1}{\alpha}$ ne soit pas un entier. Montrer que la fonction 
    $$f : x \mapsto \cos\frac{2\pi x}{\alpha} - x\Big(\cos\frac{2\pi}{\alpha} - 1\Big)$$
     vérifie $f(0) = f(1)$, mais que $f(x + \alpha) \neq f(x)$ pour tout $x \in [0\,,1 - \alpha]$.

    **3.** Un cycliste parcourt $30$ km en une heure. Montrer qu'il existe un intervalle de dix minutes pendant lequel il a parcouru exactement $5$ km. Existe-t-il nécessairement un intervalle de quarante minutes pendant lequel il a parcouru exactement $20$ km ? On cherchera une distance parcourue de la forme $d(t) = ct + h\sin^{2}\big(\frac{3\pi t}{2}\big)$, qui soit bien croissante.
  corrige: |
    **1.** La somme est télescopique : 
    $$\sum_{k=0}^{n-1} g\Big(\frac{k}{n}\Big) = \sum_{k=0}^{n-1} \Big(f\Big(\frac{k + 1}{n}\Big) - f\Big(\frac{k}{n}\Big)\Big) = f(1) - f(0) = \boxed{0}.$$
     Une somme nulle de réels contient un terme positif et un terme négatif, ou n'a que des termes nuls. Dans le premier cas, le théorème des valeurs intermédiaires, appliqué à $g$ entre les deux points correspondants, fournit un zéro de $g$ ; dans le second, $\frac{k}{n}$ convient. 
    $$\boxed{\exists c \in \Big[0\,,1 - \frac{1}{n}\Big],\ f\Big(c + \frac{1}{n}\Big) = f(c)}$$

    **2.** On a $f(0) = 1$ et $f(1) = \cos\frac{2\pi}{\alpha} - \cos\frac{2\pi}{\alpha} + 1 = 1$. Pour $x \in [0\,,1 - \alpha]$, le cosinus étant $2\pi$-périodique, 
    $$f(x + \alpha) - f(x) = -\alpha\Big(\cos\frac{2\pi}{\alpha} - 1\Big).$$
     Comme $\frac{1}{\alpha}$ n'est pas entier, $\frac{2\pi}{\alpha} \notin 2\pi\mathbb{Z}$ et $\cos\frac{2\pi}{\alpha} \neq 1$ : cette différence ne s'annule jamais. 
    $$\boxed{\text{le résultat ne s'étend pas aux pas } \alpha \neq \tfrac{1}{n}}$$

    **3.** Notons $d(t)$ la distance parcourue à l'instant $t \in [0\,,1]$, en heures, fonction continue, avec $d(0) = 0$ et $d(1) = 30$. La fonction $f : t \mapsto d(t) - 30t$ vérifie $f(0) = f(1) = 0$ ; la question 1 avec $n = 6$ fournit $c$ tel que $f\big(c + \frac{1}{6}\big) = f(c)$, soit 
    $$d\Big(c + \frac{1}{6}\Big) - d(c) = \frac{30}{6} = 5.$$

    $$\boxed{\text{il existe dix minutes pendant lesquelles il parcourt } 5 \text{ km}}$$

    Pour quarante minutes, soit $\frac{2}{3}$ d'heure, ce n'est pas garanti, car $\frac{3}{2}$ n'est pas entier. Prenons $d(t) = 28{,}5\,t + 1{,}5\sin^{2}\big(\frac{3\pi t}{2}\big)$. On a $d(0) = 0$, $d(1) = 28{,}5 + 1{,}5 = 30$, et $d$ est croissante, car 
    $$d'(t) = 28{,}5 + 1{,}5 \times \frac{3\pi}{2}\sin(3\pi t) \geqslant 28{,}5 - \frac{9\pi}{4} > 0.$$
     Comme $\sin^{2}$ est $\pi$-périodique, $d\big(t + \frac{2}{3}\big) - d(t) = 28{,}5 \times \frac{2}{3} = 19$ pour tout $t \in \big[0\,,\frac{1}{3}\big]$. 
    $$\boxed{\text{non : ce cycliste parcourt exactement } 19 \text{ km en toute période de } 40 \text{ minutes}}$$
- id: "ma-08-38"
  feuille: "f-ma-08"
  numero: 38
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, fonctions périodiques]
  noeuds: [c-tvi]
  notions: [continuite]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    *Points antipodaux.* Soit $f : \mathbb{R} \to \mathbb{R}$ continue et $1$-périodique.

    **1.** Montrer qu'il existe $x_{0} \in \mathbb{R}$ tel que $f\big(x_{0} + \frac{1}{2}\big) = f(x_{0})$.

    **2.** En déduire qu'il existe, à chaque instant, deux points diamétralement opposés de l'équateur terrestre où la température est la même, en admettant que celle-ci varie continûment le long de l'équateur.
  corrige: |
    **1.** Soit $g : x \mapsto f\big(x + \frac{1}{2}\big) - f(x)$, continue. Par périodicité, 
    $$g\Big(\frac{1}{2}\Big) = f(1) - f\Big(\frac{1}{2}\Big) = f(0) - f\Big(\frac{1}{2}\Big) = -g(0).$$
     Les réels $g(0)$ et $g\big(\frac{1}{2}\big)$ sont opposés : $g$ s'annule sur $\big[0\,,\frac{1}{2}\big]$. 
    $$\boxed{\exists x_{0},\ f\Big(x_{0} + \frac{1}{2}\Big) = f(x_{0})}$$

    **2.** On repère un point de l'équateur par sa longitude $\theta$, mesurée en tours, et l'on note $T(\theta)$ la température en ce point. La fonction $T$ est continue et $1$-périodique, et deux points diamétralement opposés ont des longitudes qui diffèrent d'un demi-tour. La question 1 conclut. 
    $$\boxed{\text{deux points antipodaux ont même température}}$$
- id: "ma-08-39"
  feuille: "f-ma-08"
  numero: 39
  partie: "Fonctions continues sur un intervalle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions continues sur un intervalle, limites, bijection continue]
  noeuds: [c-tvi, de-limite, c-bijection]
  notions: [continuite, limite-fonction]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    Soit $f : x \mapsto \ln(\mathrm{e}^{x} + 2)$.

    **1.** Déterminer le domaine de définition de $f$, ses limites en $\pm\infty$ et son sens de variation.

    **2.** Montrer que $f$ réalise une bijection de $\mathbb{R}$ sur un intervalle $J$ que l'on précisera, et déterminer $f^{-1}$. Justifier sans calcul que $f^{-1}$ est continue.

    **3.** Montrer que $\lim\limits_{x \to +\infty} \big(f(x) - x\big) = 0$, et tracer sur une même figure les courbes de $f$ et de $f^{-1}$, avec leurs asymptotes.
  corrige: |
    **1.** Comme $\mathrm{e}^{x} + 2 > 0$, la fonction $f$ est définie sur $\boxed{\mathbb{R}}$. Composée de fonctions strictement croissantes, elle est strictement croissante, et 
    $$\lim\limits_{x \to -\infty} f(x) = \ln 2, \qquad \lim\limits_{x \to +\infty} f(x) = +\infty.$$
     **2.** Par le théorème de la bijection continue, $f$ réalise une bijection de $\mathbb{R}$ sur $\boxed{J = \,]\ln 2\,,+\infty[}$, et $f^{-1}$ est continue et strictement croissante. Pour $y > \ln 2$, on résout $y = \ln(\mathrm{e}^{x} + 2)$, soit $\mathrm{e}^{x} = \mathrm{e}^{y} - 2 > 0$ : 
    $$\boxed{f^{-1}(y) = \ln(\mathrm{e}^{y} - 2)}.$$
     **3.** On a $f(x) - x = \ln(\mathrm{e}^{x} + 2) - \ln(\mathrm{e}^{x}) = \ln(1 + 2\mathrm{e}^{-x}) \xrightarrow[x \to +\infty]{} \boxed{0}$ : la droite $y = x$ est asymptote à la courbe de $f$ en $+\infty$, et la courbe est au-dessus. La courbe de $f$ a aussi l'asymptote horizontale $y = \ln 2$ en $-\infty$. Par symétrie par rapport à la première bissectrice, la courbe de $f^{-1}$ a l'asymptote $y = x$ en $+\infty$, au-dessous, et l'asymptote verticale $x = \ln 2$.

    ![Figure](documents/figures/cfb7373724af0510.svg)

    Les deux courbes sont symétriques par rapport à la première bissectrice : l'asymptote horizontale de $f$ devient l'asymptote verticale de $f^{-1}$, et la droite $y = x$, invariante, est asymptote aux deux courbes, de part et d'autre.
- id: "ma-08-40"
  feuille: "f-ma-08"
  numero: 40
  partie: "Fonctions continues sur un intervalle"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, fonctions monotones]
  noeuds: [c-tvi, c-monotone]
  notions: [continuite]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Involutions continues.*

    **1.** Soit $f : [0\,,+\infty[ \,\to [0\,,+\infty[$ continue telle que $f \circ f = \mathrm{id}$. Montrer que $f$ est bijective et strictement monotone, puis que $f$ est croissante.

    **2.** Montrer qu'une fonction strictement croissante $f$ telle que $f \circ f = \mathrm{id}$ est l'identité. On pourra supposer $f(x) < x$ pour un réel $x$ et composer par $f$.

    **3.** Donner une fonction continue $f : \mathbb{R} \to \mathbb{R}$ telle que $f \circ f = \mathrm{id}$, distincte de l'identité. Qu'est-ce qui, dans la question 1, ne s'étend pas à $\mathbb{R}$ ?
  corrige: |
    **1.** La relation $f \circ f = \mathrm{id}$ montre que $f$ est bijective, de réciproque elle-même. Continue et injective sur l'intervalle $[0\,,+\infty[$, elle est strictement monotone (proposition 17). Si elle était décroissante, on aurait $f(x) \leqslant f(0)$ pour tout $x \geqslant 0$, et $f([0\,,+\infty[)$ serait borné, alors que $f$ est surjective sur $[0\,,+\infty[$. 
    $$\boxed{f \text{ est strictement croissante}}$$

    **2.** Supposons $f(x) < x$ pour un réel $x$. En composant par $f$, strictement croissante, on obtient $f(f(x)) < f(x)$, soit $x < f(x)$ : contradiction. De même, $f(x) > x$ est impossible. $\boxed{f = \mathrm{id}}$

    **3.** La fonction $\boxed{f : x \mapsto -x}$ convient sur $\mathbb{R}$, ainsi que $x \mapsto c - x$ pour tout réel $c$. L'argument de la question 1 utilisait l'existence d'un plus petit élément $0$ dans l'ensemble de départ : sur $\mathbb{R}$, une fonction décroissante peut être surjective.
- id: "ma-08-41"
  feuille: "f-ma-08"
  numero: 41
  partie: "Fonctions continues sur un intervalle"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions continues sur un intervalle, limites, fonctions discontinues, densité, fonctions périodiques]
  noeuds: [c-tvi, de-limite, continuite, tr-dense]
  notions: [continuite, limite-fonction, partie-dense]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Plus petite période.* Soit $f : \mathbb{R} \to \mathbb{R}$ une fonction continue, périodique et non constante. On note 
    $$A = \{\tau > 0 \mid \forall x \in \mathbb{R},\ f(x + \tau) = f(x)\}$$
     l'ensemble de ses périodes strictement positives.

    **1.** Justifier que $A$ admet une borne inférieure $T \geqslant 0$, et montrer qu'il existe une suite $(\tau_{n})$ d'éléments de $A$ telle que $\lim\limits_{n \to +\infty} \tau_{n} = T$.

    **2.** Montrer que $f(x + T) = f(x)$ pour tout réel $x$.

    **3.** On suppose $T = 0$. Soit $x$ et $y$ deux réels. Montrer que, pour tout $n$, il existe un entier $k_{n}$ tel que $|y - x - k_{n}\tau_{n}| \leqslant \tau_{n}$, et en déduire que $f(y) = f(x)$. Conclure que $T > 0$ est la plus petite période de $f$.

    **4.** Montrer que l'hypothèse de continuité est indispensable, à l'aide de l'indicatrice de $\mathbb{Q}$.
  corrige: |
    **1.** L'ensemble $A$ est non vide, car $f$ est périodique, et minoré par $0$ : il admet une borne inférieure $T \geqslant 0$. D'après la caractérisation séquentielle de la borne inférieure (chapitre 7, proposition 13), il existe 
    $$\boxed{(\tau_{n}) \in A^{\mathbb{N}} \text{ telle que } \lim\limits_{n \to +\infty} \tau_{n} = T}.$$

    **2.** Pour tout réel $x$ et tout $n$, $f(x + \tau_{n}) = f(x)$. Comme $x + \tau_{n} \to x + T$, la continuité de $f$ donne $\boxed{f(x + T) = f(x)}$.

    **3.** Supposons $T = 0$, et soit $x$ et $y$ deux réels. Pour chaque $n$, posons $k_{n} = \Big\lfloor \dfrac{y - x}{\tau_{n}} \Big\rfloor$, de sorte que $0 \leqslant y - x - k_{n}\tau_{n} < \tau_{n}$. Tout multiple entier relatif d'une période étant une période, $f(x + k_{n}\tau_{n}) = f(x)$. Or $x + k_{n}\tau_{n} \to y$, et la continuité de $f$ en $y$ donne $f(x) = f(y)$ : $f$ serait constante, ce qui est exclu. Donc $T > 0$, et $T$ est une période par la question 2 : c'est le plus petit élément de $A$. 
    $$\boxed{f \text{ admet une plus petite période } T > 0}$$

    **4.** Pour $f = \mathbf{1}_{\mathbb{Q}}$, tout rationnel $r > 0$ est une période, car $x + r$ est rationnel si et seulement si $x$ l'est. Ainsi $\inf A = 0$, alors que $0 \notin A$ : 
    $$\boxed{\mathbf{1}_{\mathbb{Q}} \text{ n'a pas de plus petite période}}.$$
     La question 2 échoue, faute de continuité.
- id: "ma-08-42"
  feuille: "f-ma-08"
  numero: 42
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [continuité uniforme, fonctions lipschitziennes]
  noeuds: [c-heine]
  notions: [continuite-uniforme, contractante]
  page_enonce: 9
  page_corrige: 20
  enonce: |
    Montrer que les fonctions suivantes sont lipschitziennes, et donner une constante de Lipschitz.

    **(a)** $x \mapsto \sqrt{1 + x^{2}}$ sur $\mathbb{R}$

    **(b)** $x \mapsto \dfrac{1}{x}$ sur $[1\,,+\infty[$

    **(c)** $x \mapsto \sin(3x) - 2\cos x$ sur $\mathbb{R}$

    **(d)** $x \mapsto \big|\,|x| - 1\big|$ sur $\mathbb{R}$

    Montrer que la composée de deux fonctions lipschitziennes est lipschitzienne, ainsi que leur somme.
  corrige: |
    **(a)** Pour tous réels $x$ et $y$, en multipliant par la quantité conjuguée, 
    $$\Big|\sqrt{1 + x^{2}} - \sqrt{1 + y^{2}}\Big| = \frac{|x - y|\,|x + y|}{\sqrt{1 + x^{2}} + \sqrt{1 + y^{2}}} \leqslant |x - y|,$$
     car $|x + y| \leqslant |x| + |y| < \sqrt{1 + x^{2}} + \sqrt{1 + y^{2}}$. $\boxed{k = 1}$

    **(b)** Pour $x$, $y \geqslant 1$, $\big|\frac{1}{x} - \frac{1}{y}\big| = \frac{|x - y|}{xy} \leqslant |x - y|$. $\boxed{k = 1}$

    **(c)** D'après le cours, $|\sin u - \sin v| \leqslant |u - v|$ et $|\cos u - \cos v| \leqslant |u - v|$, donc 
    $$\big|(\sin 3x - 2\cos x) - (\sin 3y - 2\cos y)\big| \leqslant 3|x - y| + 2|x - y|.$$
     $\boxed{k = 5}$

    **(d)** Par deux applications de l'inégalité triangulaire renversée, 
    $$\Big|\,\big||x| - 1\big| - \big||y| - 1\big|\,\Big| \leqslant \big||x| - |y|\big| \leqslant |x - y|. \qquad \boxed{k = 1}$$

    **Composée et somme.** Si $f$ est $k$-lipschitzienne et $g$ est $k'$-lipschitzienne, alors 
    $$|g(f(x)) - g(f(y))| \leqslant k'|f(x) - f(y)| \leqslant kk'|x - y| \quad\text{et}\quad |(f + g)(x) - (f + g)(y)| \leqslant (k + k')|x - y|.$$

    $$\boxed{g \circ f \text{ est } kk'\text{-lipschitzienne}, \ f + g \text{ est } (k + k')\text{-lipschitzienne}}$$
     On retrouve ainsi les constantes trouvées en (c) et (d).
- id: "ma-08-43"
  feuille: "f-ma-08"
  numero: 43
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité uniforme, bornes atteintes, fonctions lipschitziennes]
  noeuds: [c-heine, c-bornes]
  notions: [continuite-uniforme, contractante]
  page_enonce: 10
  page_corrige: 20
  enonce: |
    **1.** Montrer que le produit de deux fonctions lipschitziennes sur $[0\,,1]$ est lipschitzien.

    **2.** Le résultat subsiste-t-il sur $\mathbb{R}$ ? Et si l'on suppose de plus les deux fonctions bornées ?

    **3.** Montrer que la somme de deux fonctions uniformément continues sur $I$ est uniformément continue, mais que ce n'est pas le cas du produit en général.
  corrige: |
    **1.** Soit $f$ et $g$ lipschitziennes sur $[0\,,1]$, de constantes $k$ et $k'$. Elles sont bornées : pour tout $x \in [0\,,1]$, on a $|f(x)| \leqslant |f(0)| + k$, et de même pour $g$. Notons $M$ un majorant commun de $|f|$ et $|g|$. En faisant apparaître un terme intermédiaire, 
    $$f(x)g(x) - f(y)g(y) = f(x)\big(g(x) - g(y)\big) + g(y)\big(f(x) - f(y)\big),$$
     d'où $|fg(x) - fg(y)| \leqslant M(k + k')\,|x - y|$. 
    $$\boxed{fg \text{ est lipschitzienne}}$$

    **2.** Sur $\mathbb{R}$, c'est faux : $\mathrm{id}$ est $1$-lipschitzienne, mais $x \mapsto x^{2}$ ne l'est pas (cours, section 8.5). Ce qui manque, c'est la bornitude, que $[0\,,1]$ fournissait. Si les deux fonctions sont lipschitziennes *et bornées* sur $\mathbb{R}$, la démonstration précédente s'applique sans changement. 
    $$\boxed{\text{vrai si } f \text{ et } g \text{ sont bornées}}$$

    **3.** Pour la somme, on associe $\delta_{1}$ et $\delta_{2}$ à $\frac{\varepsilon}{2}$ pour $f$ et $g$, et $\delta = \min(\delta_{1}, \delta_{2})$ convient pour $f + g$. Pour le produit, $\mathrm{id}$ est uniformément continue sur $\mathbb{R}$, mais $\mathrm{id} \times \mathrm{id}$ ne l'est pas, d'après l'exemple de la section 8.5 du cours. 
    $$\boxed{\text{somme : oui ; produit : non en général}}$$
- id: "ma-08-44"
  feuille: "f-ma-08"
  numero: 44
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité uniforme, bornes atteintes]
  noeuds: [c-heine, c-bornes]
  notions: [continuite-uniforme]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    En appliquant la méthode du cours, montrer que les fonctions suivantes ne sont pas uniformément continues : 
    $$x \mapsto \sin(x^{2}) \text{ sur } \mathbb{R}, \qquad x \mapsto \ln x \text{ sur } ]0\,,1], \qquad x \mapsto \mathrm{e}^{x} \text{ sur } \mathbb{R}.$$
     La première est bornée : la bornitude ne suffit donc pas. Montrer en revanche que $x \mapsto x\sin\frac{1}{x}$ est uniformément continue sur $]0\,,1]$, alors que $x \mapsto \sin\frac{1}{x}$ ne l'est pas.
  corrige: |
    Dans chaque cas, on applique la méthode du cours : on se place là où la courbe devient raide, et l'on construit deux suites d'écart tendant vers $0$ dont les images restent écartées, ce qui contredit la continuité uniforme (proposition 19).

    **Fonction $x \mapsto \sin(x^{2})$.** La courbe oscille de plus en plus vite. Avec $y_{n} = \sqrt{n\pi}$ et $x_{n} = \sqrt{n\pi + \frac{\pi}{2}}$, 
    $$x_{n} - y_{n} = \frac{\pi/2}{\sqrt{n\pi + \pi/2} + \sqrt{n\pi}} \xrightarrow[n \to +\infty]{} 0 \qquad\text{et}\qquad |\sin(x_{n}^{2}) - \sin(y_{n}^{2})| = |\pm 1 - 0| = 1.$$

    $$\boxed{\text{non uniformément continue, avec } \varepsilon = 1}$$

    **Fonction $\ln$ sur $]0\,,1]$.** La courbe devient raide près de $0$. Avec $x_{n} = \frac{1}{n}$ et $y_{n} = \frac{1}{2n}$, l'écart $\frac{1}{2n}$ tend vers $0$, mais $\ln x_{n} - \ln y_{n} = \ln 2$. 
    $$\boxed{\text{non uniformément continue, avec } \varepsilon = \ln 2}$$

    **Fonction $\exp$ sur $\mathbb{R}$.** La courbe devient raide en $+\infty$. Avec $y_{n} = n$ et $x_{n} = n + \mathrm{e}^{-n}$, l'écart $\mathrm{e}^{-n}$ tend vers $0$, et, grâce à l'inégalité $\mathrm{e}^{u} - 1 \geqslant u$ du chapitre 5, 
    $$\mathrm{e}^{x_{n}} - \mathrm{e}^{y_{n}} = \mathrm{e}^{n}\big(\mathrm{e}^{\mathrm{e}^{-n}} - 1\big) \geqslant \mathrm{e}^{n} \times \mathrm{e}^{-n} = 1.$$

    $$\boxed{\text{non uniformément continue, avec } \varepsilon = 1}$$

    **Fonction $x \mapsto x\sin\frac{1}{x}$ sur $]0\,,1]$.** Elle se prolonge par continuité en $0$ par la valeur $0$ (cours, section 8.3). Le prolongement est continu sur le segment $[0\,,1]$, donc uniformément continu par le théorème de Heine, et sa restriction à $]0\,,1]$ l'est aussi. 
    $$\boxed{\text{uniformément continue}}$$

    **Fonction $x \mapsto \sin\frac{1}{x}$ sur $]0\,,1]$.** Avec $x_{n} = \frac{1}{2n\pi + \pi/2}$ et $y_{n} = \frac{1}{2n\pi}$, l'écart tend vers $0$ et les images valent $1$ et $0$. 
    $$\boxed{\text{non uniformément continue}}$$

    *À retenir.* Une fonction continue sur un intervalle borné $]a\,,b]$ qui se prolonge par continuité en $a$ est uniformément continue, par le théorème de Heine ; on peut montrer que la réciproque est vraie. C'est toute la différence entre $x\sin\frac{1}{x}$ et $\sin\frac{1}{x}$.
- id: "ma-08-45"
  feuille: "f-ma-08"
  numero: 45
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [continuité uniforme, limites, bornes atteintes]
  noeuds: [c-heine, de-limite, c-bornes]
  notions: [continuite-uniforme, limite-fonction]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    **1.** Soit $f : [0\,,+\infty[ \,\to \mathbb{R}$ continue, admettant une limite finie $\ell$ en $+\infty$. Montrer que $f$ est uniformément continue. On pourra séparer le cas de deux réels de $[0\,,A + 1]$ et celui de deux réels de $[A\,,+\infty[$, pour un $A$ bien choisi.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue, admettant des limites finies en $-\infty$ et en $+\infty$. Montrer que $f$ est bornée et uniformément continue.
  corrige: |
    **1.** Soit $\varepsilon > 0$. Il existe $A \geqslant 0$ tel que $|f(x) - \ell| \leqslant \frac{\varepsilon}{2}$ pour $x \geqslant A$ ; alors $|f(x) - f(y)| \leqslant \varepsilon$ pour tous $x$, $y \geqslant A$. Par le théorème de Heine sur le segment $[0\,,A + 1]$, il existe $\delta' > 0$ tel que $|f(x) - f(y)| \leqslant \varepsilon$ pour $x$, $y \in [0\,,A + 1]$ et $|x - y| \leqslant \delta'$. Posons $\delta = \min(\delta', 1)$, et soit $x \leqslant y$ tels que $y - x \leqslant \delta$. Ou bien $y \leqslant A + 1$, et les deux points sont dans $[0\,,A + 1]$ ; ou bien $y > A + 1$, et alors $x \geqslant y - 1 > A$. Dans les deux cas, $|f(x) - f(y)| \leqslant \varepsilon$. 
    $$\boxed{f \text{ est uniformément continue}}$$

    Le chevauchement des deux zones, de longueur $1$, est essentiel : il garantit que deux points proches sont toujours ensemble dans l'une d'elles.

    **2.** La bornitude s'obtient comme à l'exercice 34 : $f$ est proche de ses limites en dehors d'un segment $[-A\,,A]$, et bornée sur ce segment. Pour la continuité uniforme, on découpe $\mathbb{R}$ en trois zones qui se chevauchent, $]-\infty\,,-A]$, $[-A - 1\,,A + 1]$ et $[A\,,+\infty[$, et l'on raisonne de même. 
    $$\boxed{f \text{ est bornée et uniformément continue}}$$
- id: "ma-08-46"
  feuille: "f-ma-08"
  numero: 46
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [continuité uniforme, bijection continue]
  noeuds: [c-heine, c-bijection]
  notions: [continuite-uniforme]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    *Croissance au plus affine.* Soit $f : \mathbb{R} \to \mathbb{R}$ uniformément continue.

    **1.** Soit $\delta > 0$ associé à $\varepsilon = 1$ dans la définition de la continuité uniforme. Montrer que, pour tout réel $x$, on a $|f(x) - f(0)| \leqslant \dfrac{|x|}{\delta} + 1$.

    **2.** En déduire qu'il existe deux réels $\alpha$ et $\beta$ tels que $|f(x)| \leqslant \alpha|x| + \beta$ pour tout réel $x$.

    **3.** Retrouver ainsi que les fonctions $x \mapsto x^{2}$ et $\exp$ ne sont pas uniformément continues sur $\mathbb{R}$. La réciproque du résultat de la question 2 est-elle vraie ?
  corrige: |
    **1.** Soit $x > 0$ et $n = \lfloor \frac{x}{\delta} \rfloor + 1$, de sorte que $\frac{x}{n} < \delta$ et $n \leqslant \frac{x}{\delta} + 1$. Les points $\frac{kx}{n}$, pour $0 \leqslant k \leqslant n$, sont distants de $\frac{x}{n} \leqslant \delta$ ; en écrivant $f(x) - f(0)$ comme une somme télescopique, 
    $$|f(x) - f(0)| \leqslant \sum_{k=1}^{n} \Big|f\Big(\frac{kx}{n}\Big) - f\Big(\frac{(k - 1)x}{n}\Big)\Big| \leqslant n \leqslant \frac{x}{\delta} + 1.$$
     Le cas $x < 0$ est identique. 
    $$\boxed{|f(x) - f(0)| \leqslant \frac{|x|}{\delta} + 1}$$

    **2.** On en déduit $|f(x)| \leqslant |f(0)| + 1 + \frac{|x|}{\delta}$. 
    $$\boxed{\alpha = \frac{1}{\delta}, \ \beta = |f(0)| + 1}$$

    **3.** Pour tous réels $\alpha$ et $\beta$, on a $\frac{x^{2}}{\alpha x + \beta} \to +\infty$ et $\frac{\mathrm{e}^{x}}{\alpha x + \beta} \to +\infty$ en $+\infty$, par croissances comparées : aucune majoration affine n'est possible. 
    $$\boxed{x^{2} \text{ et } \exp \text{ ne sont pas uniformément continues sur } \mathbb{R}}$$

    La réciproque est fausse : $x \mapsto \sin(x^{2})$ est bornée, donc majorée par $0 \cdot |x| + 1$, mais n'est pas uniformément continue (exercice 44).
- id: "ma-08-47"
  feuille: "f-ma-08"
  numero: 47
  partie: "Continuité uniforme et fonctions lipschitziennes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [continuité uniforme, limites]
  noeuds: [c-heine, de-limite]
  notions: [continuite-uniforme, limite-fonction]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue. On pose, pour $n \geqslant 1$, 
    $$u_{n} = \frac{1}{n}\sum_{k=1}^{n} (-1)^{k} f\Big(\frac{k}{n}\Big).$$

    **1.** Calculer $u_{n}$ lorsque $f$ est constante, puis lorsque $f = \mathrm{id}$.

    **2.** Soit $\varepsilon > 0$, et $\delta$ associé à $\varepsilon$ par le théorème de Heine. Montrer que, pour $n \geqslant \frac{1}{\delta}$, on a $|u_{2n}| \leqslant \frac{\varepsilon}{2}$.

    **3.** Conclure que $\lim\limits_{n \to +\infty} u_{n} = 0$, en traitant aussi les indices impairs.
  corrige: |
    **1.** Si $f = c$ est constante, $u_{n} = \frac{c}{n}\sum_{k=1}^{n} (-1)^{k}$ vaut $0$ si $n$ est pair et $-\frac{c}{n}$ si $n$ est impair. Si $f = \mathrm{id}$, on groupe les termes deux par deux : 
    $$\boxed{u_{2p} = \frac{1}{(2p)^{2}}\sum_{j=1}^{p} \big(2j - (2j - 1)\big) = \frac{1}{4p}} \qquad\text{et}\qquad \boxed{u_{2p+1} = -\frac{p + 1}{(2p + 1)^{2}}}.$$
     Dans les deux cas, $u_{n} \to 0$ : les termes de signes alternés se compensent.

    **2.** On groupe de même les termes de $u_{2n}$ deux par deux : 
    $$u_{2n} = \frac{1}{2n}\sum_{j=1}^{n} \Big(f\Big(\frac{2j}{2n}\Big) - f\Big(\frac{2j - 1}{2n}\Big)\Big).$$
     Les deux points de chaque différence sont distants de $\frac{1}{2n} \leqslant \delta$ dès que $n \geqslant \frac{1}{\delta}$ ; chaque différence est alors majorée par $\varepsilon$ en valeur absolue, et 
    $$\boxed{|u_{2n}| \leqslant \frac{1}{2n} \times n\varepsilon = \frac{\varepsilon}{2}}.$$

    **3.** Pour les indices impairs, il reste un terme isolé : 
    $$u_{2n+1} = \frac{1}{2n + 1}\bigg(\sum_{j=1}^{n} \Big(f\Big(\frac{2j}{2n + 1}\Big) - f\Big(\frac{2j - 1}{2n + 1}\Big)\Big) - f(1)\bigg).$$
     Avec $M = \max |f|$, qui existe par le théorème 10, on obtient, pour $2n + 1 \geqslant \frac{1}{\delta}$, 
    $$|u_{2n+1}| \leqslant \frac{n\varepsilon + M}{2n + 1} \leqslant \frac{\varepsilon}{2} + \frac{M}{2n + 1}.$$
     Ainsi $|u_{n}| \leqslant \varepsilon$ pour $n$ assez grand, pair ou impair. $\boxed{\lim\limits_{n \to +\infty} u_{n} = 0}$

    *À retenir.* La continuité uniforme fournit un même $\delta$ pour tous les couples de points voisins : c'est exactement ce qu'il faut pour contrôler simultanément les $n$ différences. Le chapitre 18 utilisera le même argument pour montrer que les sommes de Riemann d'une fonction continue convergent.
- id: "ma-08-48"
  feuille: "f-ma-08"
  numero: 48
  partie: "Fonctions à valeurs complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions à valeurs complexes, limites]
  noeuds: [continuite, de-limite]
  notions: [continuite, limite-fonction]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Étudier l'existence des limites suivantes, en $0$. 
    $$\text{(a)} \ \frac{\mathrm{e}^{\mathrm{i} t} - 1}{t} \qquad \text{(b)} \ t\,\mathrm{e}^{\mathrm{i}/t} \qquad \text{(c)} \ \mathrm{e}^{\mathrm{i}/t} \qquad \text{(d)} \ \frac{\mathrm{e}^{\mathrm{i} t} - \mathrm{e}^{-\mathrm{i} t}}{\mathrm{e}^{t} - \mathrm{e}^{-t}}$$
  corrige: |
    D'après la proposition 20 du cours, on étudie séparément parties réelle et imaginaire.

    **(a)** On a $\dfrac{\mathrm{e}^{\mathrm{i} t} - 1}{t} = \dfrac{\cos t - 1}{t} + \mathrm{i}\,\dfrac{\sin t}{t}$, où le premier quotient tend vers $0$, car $|1 - \cos t| \leqslant \frac{t^{2}}{2}$, et le second vers $1$. 
    $$\boxed{\text{la limite vaut } \mathrm{i}}$$
     C'est la dérivée en $0$ de $t \mapsto \mathrm{e}^{\mathrm{i} t}$, qui vaut $\mathrm{i}\mathrm{e}^{\mathrm{i} \cdot 0}$.

    **(b)** Le module $|t\,\mathrm{e}^{\mathrm{i}/t}| = |t|$ tend vers $0$. 
    $$\boxed{\text{la limite vaut } 0}$$

    **(c)** La partie réelle $\cos\frac{1}{t}$ n'a pas de limite en $0$, comme $\sin\frac{1}{t}$ dans le cours. 
    $$\boxed{\text{pas de limite}}$$

    **(d)** Par les formules d'Euler, l'expression vaut 
    $$\frac{2\mathrm{i}\sin t}{2\operatorname{sh} t} = \mathrm{i}\,\frac{\sin t}{t} \times \frac{t}{\operatorname{sh} t},$$
     et $\frac{\operatorname{sh} t}{t}$ tend vers $\operatorname{sh}'(0) = \operatorname{ch} 0 = 1$. 
    $$\boxed{\text{la limite vaut } \mathrm{i}}$$
- id: "ma-08-49"
  feuille: "f-ma-08"
  numero: 49
  partie: "Fonctions à valeurs complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions à valeurs complexes, valeurs intermédiaires, bornes atteintes]
  noeuds: [c-tvi, c-bornes]
  notions: [continuite]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Soit $f : [a\,,b] \to \mathbb{C}$ continue.

    **1.** Montrer que $|f|$ est continue, que $f$ est bornée, et que $|f|$ atteint ses bornes.

    **2.** On suppose que $f$ ne s'annule pas. Montrer qu'il existe $m > 0$ tel que $|f(t)| \geqslant m$ pour tout $t \in [a\,,b]$, et que $\frac{1}{f}$ est continue.

    **3.** Soit $f : [a\,,b] \to \mathbb{C}$ continue, telle que $\operatorname{Re} f(a) < 0 < \operatorname{Re} f(b)$. Montrer à l'aide d'un exemple que $f$ ne s'annule pas nécessairement. Que peut-on affirmer en revanche ?
  corrige: |
    **1.** On a $|f| = \sqrt{(\operatorname{Re} f)^{2} + (\operatorname{Im} f)^{2}}$, continue comme composée de fonctions continues, puisque $\operatorname{Re} f$ et $\operatorname{Im} f$ le sont (proposition 20). Fonction réelle continue sur un segment, $|f|$ est bornée et atteint ses bornes (théorème 10). 
    $$\boxed{f \text{ est bornée, et } |f| \text{ atteint son minimum et son maximum}}$$

    **2.** Le minimum $m$ de $|f|$ est atteint en un point $t_{0}$, et $m = |f(t_{0})| > 0$ puisque $f$ ne s'annule pas. $\boxed{|f| \geqslant m > 0}$ De plus, $\frac{1}{f} = \frac{\overline{f}}{|f|^{2}}$ a pour parties réelle et imaginaire $\frac{\operatorname{Re} f}{|f|^{2}}$ et $-\frac{\operatorname{Im} f}{|f|^{2}}$, continues comme quotients de fonctions continues à dénominateur non nul : 
    $$\boxed{\frac{1}{f} \text{ est continue}}.$$

    **3.** La fonction $f : t \mapsto \mathrm{e}^{\mathrm{i}\pi(1 - t)}$ sur $[0\,,1]$ vérifie $\operatorname{Re} f(0) = \cos\pi = -1 < 0 < 1 = \operatorname{Re} f(1)$, mais $|f(t)| = 1$ pour tout $t$ : 
    $$\boxed{f \text{ ne s'annule pas}}.$$
     En revanche, $\operatorname{Re} f$ est une fonction réelle continue qui change de signe : 
    $$\boxed{\operatorname{Re} f \text{ s'annule}},$$
     par le théorème des valeurs intermédiaires. Le point $f(t)$ décrit un demi-cercle, et traverse l'axe imaginaire sans passer par l'origine.
- id: "ma-08-50"
  feuille: "f-ma-08"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [limites, continuité en un point, bornes atteintes, fonctions monotones, bijection continue, fonctions lipschitziennes, continuité uniforme, densité]
  noeuds: [de-limite, c-point, c-bornes, c-monotone, c-bijection, c-heine, tr-dense]
  notions: [limite-fonction, continuite-point, contractante, continuite-uniforme, partie-dense]
  page_enonce: 11
  page_corrige: 24
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Si $f$ admet une limite en $a$ et que $g$ n'en admet pas, alors $f + g$ n'admet pas de limite en $a$.

    **2.** Une fonction continue sur un segment et à valeurs dans $\mathbb{Q}$ est constante.

    **3.** L'image d'un intervalle ouvert par une fonction continue est un intervalle ouvert.

    **4.** Une fonction continue et injective sur un intervalle est strictement monotone.

    **5.** Si $|f|$ est continue en $a$, alors $f$ est continue en $a$.

    **6.** Une fonction monotone sur un intervalle, dont l'image est un intervalle, est continue.

    **7.** Toute fonction lipschitzienne est uniformément continue.

    **8.** Si $f$ est continue sur $\mathbb{R}$ et si $\lim\limits_{x \to -\infty} f(x) = \lim\limits_{x \to +\infty} f(x) = +\infty$, alors $f$ admet un minimum sur $\mathbb{R}$.

    **9.** Si $f$ est continue en $a$, alors $f$ est continue sur un voisinage de $a$.

    **10.** Une fonction continue et périodique sur $\mathbb{R}$ est uniformément continue.
  corrige: |
    Six affirmations sont vraies et quatre sont fausses.

    **1. Faux.** Avec $f : x \mapsto \frac{1}{x^{2}}$ et $g : x \mapsto \sin\frac{1}{x}$ en $0$, $f$ tend vers $+\infty$, $g$ n'a pas de limite, mais $f + g \geqslant \frac{1}{x^{2}} - 1$ tend vers $+\infty$ par comparaison. L'affirmation devient vraie si la limite de $f$ est *finie* : on écrit alors $g = (f + g) - f$.

    **2. Vrai.** L'image du segment est un intervalle (théorème 9) contenu dans $\mathbb{Q}$ ; s'il contenait deux rationnels distincts, il contiendrait un irrationnel entre eux, par densité (chapitre 7, théorème 2). Il est donc réduit à un point.

    **3. Faux.** Le sinus envoie l'intervalle ouvert $]0\,,2\pi[$ sur le segment $[-1\,,1]$. Seule la propriété d'être un intervalle est conservée (théorème 9), pas sa nature.

    **4. Vrai.** C'est la proposition 17 du cours.

    **5. Faux.** La fonction qui vaut $1$ sur $\mathbb{Q}$ et $-1$ ailleurs n'est continue nulle part, alors que sa valeur absolue est constante (exercice 15).

    **6. Vrai.** C'est la proposition 16 du cours : une discontinuité d'une fonction monotone est un saut, qui laisserait un trou dans l'image.

    **7. Vrai.** C'est la proposition 18 du cours, avec $\delta = \frac{\varepsilon}{k}$.

    **8. Vrai.** Il existe $A > 0$ tel que $f(x) \geqslant f(0)$ pour $|x| \geqslant A$. Sur le segment $[-A\,,A]$, qui contient $0$, $f$ atteint un minimum $m \leqslant f(0)$ (théorème 10), qui est un minimum sur $\mathbb{R}$. C'est l'argument de l'exercice 33.

    **9. Faux.** La fonction $x \mapsto x\,\mathbf{1}_{\mathbb{Q}}(x)$ est continue en $0$ et discontinue en tout autre point (cours, section 8.3). La continuité est une propriété ponctuelle, qui ne se propage pas au voisinage.

    **10. Vrai.** Soit $T$ une période et $\varepsilon > 0$. Par le théorème de Heine, $f$ est uniformément continue sur $[-T\,,2T]$ : il existe $\delta \in \,]0\,,T]$ convenant sur ce segment. Si $|x - y| \leqslant \delta$, on translate $x$ et $y$ d'un même multiple de $T$, ce qui ne change pas leurs images, de sorte que $x \in [0\,,T]$ ; alors $y \in [-T\,,2T]$, et $|f(x) - f(y)| \leqslant \varepsilon$.
- id: "ma-08-51"
  feuille: "f-ma-08"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [valeurs intermédiaires, fonctions monotones]
  noeuds: [c-tvi, c-monotone]
  notions: []
  page_enonce: 11
  page_corrige: 24
  enonce: |
    *Fonctions qui commutent.* Soit $f$ et $g$ deux fonctions continues de $[0\,,1]$ dans $[0\,,1]$ telles que $f \circ g = g \circ f$. On veut montrer qu'il existe $c \in [0\,,1]$ tel que $f(c) = g(c)$.

    **1.** Justifier que $f$ admet un point fixe $s$. On définit la suite $(u_{n})$ par $u_{0} = s$ et $u_{n+1} = g(u_{n})$. Montrer que chaque $u_{n}$ est un point fixe de $f$.

    **2.** On suppose que $(u_{n})$ est monotone. Montrer qu'elle converge, et conclure.

    **3.** On suppose que $(u_{n})$ n'est pas monotone. Montrer qu'il existe un entier $n$ tel que 
    $$(u_{n+1} - u_{n})(u_{n+2} - u_{n+1}) \leqslant 0,$$
     exprimer ces deux différences à l'aide de $f - g$, et conclure.
  corrige: |
    **1.** La fonction $f$ est continue de $[0\,,1]$ dans $[0\,,1]$ : elle admet un point fixe $s$ (proposition 14). Montrons par récurrence que $f(u_{n}) = u_{n}$. C'est vrai pour $n = 0$ ; si c'est vrai au rang $n$, alors, puisque $f$ et $g$ commutent, 
    $$f(u_{n+1}) = f\big(g(u_{n})\big) = g\big(f(u_{n})\big) = g(u_{n}) = u_{n+1}.$$

    $$\boxed{\text{chaque } u_{n} \text{ est un point fixe de } f}$$

    **2.** Monotone et bornée, la suite $(u_{n})$ converge vers un réel $\ell \in [0\,,1]$ (chapitre 7, théorème 8). Par continuité, le passage à la limite dans $f(u_{n}) = u_{n}$ et dans $u_{n+1} = g(u_{n})$ donne $f(\ell) = \ell$ et $g(\ell) = \ell$ (proposition 8). $\boxed{f(\ell) = g(\ell) = \ell}$

    **3.** Si les différences $u_{n+1} - u_{n}$ étaient toutes de même signe au sens large, la suite serait monotone : il existe donc $n$ tel que $u_{n+1} - u_{n}$ et $u_{n+2} - u_{n+1}$ soient de signes contraires, et leur produit est négatif ou nul. Or, d'après la question 1, 
    $$u_{n+1} - u_{n} = g(u_{n}) - f(u_{n}) \qquad\text{et}\qquad u_{n+2} - u_{n+1} = g(u_{n+1}) - f(u_{n+1}).$$
     La fonction continue $g - f$ prend en $u_{n}$ et $u_{n+1}$ des valeurs de signes contraires : elle s'annule entre ces deux points. 
    $$\boxed{\exists c \in [0\,,1],\ f(c) = g(c)}$$

    *Remarque.* Le résultat est faux sans l'hypothèse de commutation : $f = \frac{1}{2}$ et $g = \frac{1}{3}$ sont constantes et ne se croisent pas. L'hypothèse sert à faire de l'ensemble des points fixes de $f$ un ensemble stable par $g$.
- id: "ma-08-52"
  feuille: "f-ma-08"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [valeurs intermédiaires]
  noeuds: [c-tvi]
  notions: []
  page_enonce: 12
  page_corrige: 25
  enonce: |
    Soit $f : [0\,,1] \to \mathbb{R}$ continue telle que $f(0) = f(1) = 0$ et 
    $$\forall x \in \Big[0\,,\frac{7}{10}\Big], \qquad f\Big(x + \frac{3}{10}\Big) \neq f(x).$$

    **1.** Montrer que la fonction $x \mapsto f\big(x + \frac{3}{10}\big) - f(x)$ garde un signe constant sur $\big[0\,,\frac{7}{10}\big]$ ; on la suppose strictement positive.

    **2.** Déterminer le signe de $f$ en $\frac{1}{10}$, $\frac{3}{10}$, $\frac{4}{10}$, $\frac{6}{10}$, $\frac{7}{10}$ et $\frac{9}{10}$.

    **3.** En déduire que $f$ s'annule au moins sept fois sur $[0\,,1]$.
  corrige: |
    **1.** La fonction $h : x \mapsto f\big(x + \frac{3}{10}\big) - f(x)$ est continue et ne s'annule pas sur l'intervalle $\big[0\,,\frac{7}{10}\big]$ : elle garde un signe constant strict (proposition 15). Quitte à changer $f$ en $-f$, on la suppose strictement positive.

    **2.** On progresse de $\frac{3}{10}$ en $\frac{3}{10}$, à partir de $0$ vers la droite et à partir de $1$ vers la gauche : 
    $$0 = f(0) < f\Big(\frac{3}{10}\Big) < f\Big(\frac{6}{10}\Big) < f\Big(\frac{9}{10}\Big) \qquad\text{et}\qquad f\Big(\frac{1}{10}\Big) < f\Big(\frac{4}{10}\Big) < f\Big(\frac{7}{10}\Big) < f(1) = 0.$$

    $$\boxed{f > 0 \text{ en } \tfrac{3}{10},\ \tfrac{6}{10},\ \tfrac{9}{10} \qquad f < 0 \text{ en } \tfrac{1}{10},\ \tfrac{4}{10},\ \tfrac{7}{10}}$$

    **3.** Les signes en $\frac{1}{10}, \frac{3}{10}, \frac{4}{10}, \frac{6}{10}, \frac{7}{10}, \frac{9}{10}$ alternent : $-, +, -, +, -, +$. Le théorème des valeurs intermédiaires fournit un zéro dans chacun des cinq intervalles ouverts disjoints 
    $$\Big]\frac{1}{10}\,,\frac{3}{10}\Big[, \quad \Big]\frac{3}{10}\,,\frac{4}{10}\Big[, \quad \Big]\frac{4}{10}\,,\frac{6}{10}\Big[, \quad \Big]\frac{6}{10}\,,\frac{7}{10}\Big[, \quad \Big]\frac{7}{10}\,,\frac{9}{10}\Big[,$$
     auxquels s'ajoutent $0$ et $1$. 
    $$\boxed{f \text{ s'annule au moins sept fois}}$$

    *À retenir.* C'est une version quantitative de l'exercice 37 : si $f(x + \alpha) \neq f(x)$ pour tout $x$, la fonction est contrainte d'osciller. Le nombre $\frac{3}{10}$ n'étant pas l'inverse d'un entier, la situation n'est pas contradictoire.
- id: "ma-08-53"
  feuille: "f-ma-08"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [valeurs intermédiaires, surjectivité]
  noeuds: [c-tvi, c-bornes]
  notions: [continuite]
  page_enonce: 12
  page_corrige: 25
  enonce: |
    Soit $f : [0\,,+\infty[ \,\to \mathbb{R}$ continue et surjective. Montrer que $f$ prend chaque valeur réelle une infinité de fois. On pourra raisonner par l'absurde en considérant le plus grand antécédent d'une valeur $y$ prise un nombre fini de fois.

    Existe-t-il une fonction continue de $\mathbb{R}$ dans $\mathbb{R}$ qui prenne chaque valeur de son image exactement deux fois ? On pourra admettre le résultat de l'exercice suivant.
  corrige: |
    Supposons qu'un réel $y$ ne soit pris qu'un nombre fini de fois ; il l'est au moins une fois, par surjectivité. Soit $A$ le plus grand de ses antécédents. Sur l'intervalle $]A\,,+\infty[$, la fonction continue $f - y$ ne s'annule pas : elle garde un signe constant (proposition 15). Supposons par exemple $f > y$ sur $]A\,,+\infty[$. La fonction $f$ est continue sur le segment $[0\,,A]$ : elle y admet un minimum $m$ (théorème 10). Alors $f(x) \geqslant \min(m, y)$ pour tout $x \geqslant 0$, et les réels strictement inférieurs à $\min(m, y)$ ne sont pas atteints, ce qui contredit la surjectivité. Le cas $f < y$ se traite de même avec le maximum. 
    $$\boxed{f \text{ prend chaque valeur une infinité de fois}}$$

    Pour la seconde question, la réponse est non : une telle fonction aurait des valeurs à au plus deux antécédents, et l'exercice 54 montre qu'alors une valeur au moins a exactement un antécédent. 
    $$\boxed{\text{aucune fonction continue ne prend chaque valeur de son image exactement deux fois}}$$
- id: "ma-08-54"
  feuille: "f-ma-08"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [valeurs intermédiaires, bornes atteintes, bijection continue]
  noeuds: [c-tvi, c-bornes, c-bijection]
  notions: []
  page_enonce: 12
  page_corrige: 25
  enonce: |
    *Au plus deux antécédents.* Soit $f : \mathbb{R} \to \mathbb{R}$ continue telle que tout réel ait au plus deux antécédents par $f$. On veut montrer qu'un réel au moins a exactement un antécédent.

    **1.** Conclure si $f$ est injective. On suppose désormais qu'il existe $a < b$ tels que $f(a) = f(b)$.

    **2.** Montrer que $f$ n'est pas constante sur $[a\,,b]$, et qu'elle atteint sur ce segment un maximum ou un minimum en un point $c$ de $]a\,,b[$ ; on suppose, quitte à changer $f$ en $-f$, qu'il s'agit d'un maximum $M > f(a)$.

    **3.** On suppose que $M$ a un second antécédent $c' \neq c$. Montrer, à l'aide du théorème des valeurs intermédiaires, que tout réel $y$ de $]f(a)\,,M[$ suffisamment proche de $M$ a au moins trois antécédents. On distinguera selon que $c'$ appartient ou non à $[a\,,b]$.

    **4.** Conclure.
  corrige: |
    **1.** Si $f$ est injective, toute valeur de $f(\mathbb{R})$ a exactement un antécédent, et $f(\mathbb{R})$ n'est pas vide. 
    $$\boxed{\text{c'est fini}}$$

    **2.** Si $f$ était constante sur $[a\,,b]$, la valeur $f(a)$ aurait une infinité d'antécédents : il existe donc $t \in \,]a\,,b[$ tel que $f(t) \neq f(a)$. Si $f(t) > f(a)$, le maximum $M$ de $f$ sur $[a\,,b]$, qui existe par le théorème 10, vérifie $M \geqslant f(t) > f(a) = f(b)$ : il n'est atteint ni en $a$ ni en $b$, donc en un point $c \in \,]a\,,b[$. Si $f(t) < f(a)$, le même raisonnement s'applique au minimum, ce qui revient à changer $f$ en $-f$. 
    $$\boxed{M = f(c) > f(a), \ c \in \,]a\,,b[}$$

    **3.** Soit $c' \neq c$ un second antécédent de $M$. Pour $y$ compris entre $f(a)$ et $M$, le théorème des valeurs intermédiaires fournit un antécédent de $y$ dans $]a\,,c[$ et un dans $]c\,,b[$. On en cherche un troisième.

    • *Si $c' \notin [a\,,b]$*, par exemple $c' > b$ : comme $f(b) < M = f(c')$, tout $y \in \,]f(b)\,,M[$ a aussi un antécédent dans $]b\,,c'[$, ce qui en fait trois. Le cas $c' < a$ est symétrique.

    • *Si $c' \in [a\,,b]$*, alors $c' \in \,]a\,,b[$, et l'on peut supposer $c < c'$. Si $f$ était constante égale à $M$ sur $[c\,,c']$, la valeur $M$ aurait une infinité d'antécédents ; il existe donc $t \in \,]c\,,c'[$ tel que $f(t) < M$. Tout $y \in \,]\max(f(a), f(t))\,,M[$ a alors un antécédent dans chacun des intervalles $]a\,,c[$, $]c\,,t[$, $]t\,,c'[$ et $]c'\,,b[$, soit quatre.

    $$\boxed{\text{tout } y < M \text{ assez proche de } M \text{ a au moins trois antécédents}}$$

    **4.** La question 3 contredit l'hypothèse. Le maximum $M$ n'a donc pas de second antécédent : 
    $$\boxed{M \text{ a exactement un antécédent, } c}$$

    *À retenir.* L'idée directrice est qu'au voisinage d'un extremum local strict, les valeurs proches sont prises *deux* fois, de part et d'autre : un second antécédent de l'extremum crée nécessairement un troisième antécédent pour les valeurs voisines. C'est le théorème des valeurs intermédiaires, appliqué plusieurs fois, qui compte les antécédents.

