  enonce: |
    **Le groupe fondamental d'un groupe topologique est commutatif.** Soit $G$ un groupe topologique (chapitre 3, exercice 4), d'élément neutre $e$. Pour deux lacets $\alpha$ et $\beta$ basés en $e$, on pose $(\alpha \bullet \beta)(t) = \alpha(t)\beta(t)$.

    **1.** Montrer que si $\alpha \sim \alpha'$ et $\beta \sim \beta'$, alors $\alpha \bullet \beta \sim \alpha' \bullet \beta'$.

    **2.** Montrer que $(\alpha \cdot c_{e}) \bullet (c_{e} \cdot \beta) = \alpha \cdot \beta$ et que $(c_{e} \cdot \alpha) \bullet (\beta \cdot c_{e}) = \beta \cdot \alpha$.

    **3.** En déduire que $\pi_{1}(G, e)$ est commutatif. Que dire de $\pi_{1}(\mathrm{SO}(n), I_{n})$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $F$ et $G$ sont des homotopies à extrémités fixées de $\alpha$ à $\alpha'$ et de $\beta$ à $\beta'$, l'application $(t, s) \mapsto F(t, s)G(t, s)$ est continue, par continuité de la multiplication, et c'est une homotopie à extrémités fixées de $\alpha \bullet \beta$ à $\alpha' \bullet \beta'$, puisque $ee = e$.

    **2.** Pour $t \leq \dfrac{1}{2}$, $(\alpha \cdot c_{e})(t) = \alpha(2t)$ et $(c_{e} \cdot \beta)(t) = e$, dont le produit est $\alpha(2t)$ ; pour $t \geq \dfrac{1}{2}$, le produit est $e\,\beta(2t - 1) = \beta(2t - 1)$. On trouve bien $\alpha \cdot \beta$. Le second calcul est identique, les rôles étant échangés.

    ![Figure](documents/figures/1648618739e4891e.svg)

    Sur l'intervalle de temps $[0, 1]$ : en épais, les moments où le lacet bouge ($\alpha$ en bleu, $\beta$ en orange) ; en gris, ceux où il reste en $e$. Le produit point par point ne fait jamais se rencontrer les deux mouvements, et redonne la concaténation.

    **3.** Par le théorème 1 du cours, $\alpha \sim \alpha \cdot c_{e} \sim c_{e} \cdot \alpha$, et de même pour $\beta$. Par les questions 1 et 2, 
    $$\alpha \cdot \beta = (\alpha \cdot c_{e}) \bullet (c_{e} \cdot \beta) \sim \alpha \bullet \beta \sim (c_{e} \cdot \alpha) \bullet (\beta \cdot c_{e}) = \beta \cdot \alpha .$$
     Donc $[\alpha][\beta] = [\beta][\alpha]$ : *le groupe fondamental d'un groupe topologique est commutatif,* et les deux lois, concaténation et produit point par point, induisent la même opération sur $\pi_{1}(G, e)$. En particulier, $\pi_{1}\big(\mathrm{SO}(n), I_{n}\big)$ est commutatif ; le chapitre 6 montrera qu'il vaut $\mathbb{Z}$ pour $n = 2$ et $\mathbb{Z}/2\mathbb{Z}$ pour $n = 3$.

    0@10@ii@ii-@>@ii@ii>@-\@M
