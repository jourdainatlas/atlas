  enonce: |
    **Dépendance du chemin de changement de base.** Soient $X$ un espace connexe par arcs, $x, y \in X$, et $\gamma_{1}$, $\gamma_{2}$ deux chemins de $x$ à $y$. Montrer que $\Phi_{\gamma_{1}} = \Phi_{\gamma_{2}}$ si et seulement si la classe $[\gamma_{2} \cdot \overline{\gamma_{1}}]$ commute avec tous les éléments de $\pi_{1}(X, x)$. En déduire une condition nécessaire et suffisante pour que l'isomorphisme $\Phi_{\gamma} : \pi_{1}(X, x) \to \pi_{1}(X, y)$ ne dépende pas du choix du chemin $\gamma$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    Pour toute classe $[\alpha] \in \pi_{1}(X, x)$, l'égalité $\Phi_{\gamma_{1}}([\alpha]) = \Phi_{\gamma_{2}}([\alpha])$ s'écrit $[\overline{\gamma_{1}}][\alpha][\gamma_{1}] = [\overline{\gamma_{2}}][\alpha][\gamma_{2}]$. En multipliant à gauche par $[\gamma_{2}]$ et à droite par $[\overline{\gamma_{1}}]$, on obtient l'égalité équivalente 
    $$[\gamma_{2} \cdot \overline{\gamma_{1}}]\,[\alpha] = [\alpha]\,[\gamma_{2} \cdot \overline{\gamma_{1}}] ,$$
     où $\delta = \gamma_{2} \cdot \overline{\gamma_{1}}$ est un lacet en $x$ : il va de $x$ à $y$ par $\gamma_{2}$ et revient par $\gamma_{1}$ parcouru à l'envers. Donc $\Phi_{\gamma_{1}} = \Phi_{\gamma_{2}}$ si et seulement si $[\delta]$ est dans le centre de $\pi_{1}(X, x)$.

    Tout lacet $\delta$ en $x$ s'écrit ainsi, à homotopie près, avec $\gamma_{2} = \delta \cdot \gamma_{1}$. *L'isomorphisme $\Phi_{\gamma}$ ne dépend pas du chemin $\gamma$ si et seulement si $\pi_{1}(X, x)$ est commutatif.* Dans un espace à groupe fondamental commutatif, on peut donc identifier canoniquement les groupes fondamentaux en deux points, et parler « du » groupe fondamental.

    ![Figure](documents/figures/b5e3f773d7436e3d.svg)

    Deux chemins de $x$ à $y$ qui passent de part et d'autre d'un trou : le lacet $\gamma_{2} \cdot \overline{\gamma_{1}}$ fait le tour du trou. Les deux changements de point base coïncident exactement quand ce lacet commute avec tous les lacets en $x$.

    0@10@ii@ii-@>@ii@ii>@-\@M
