  enonce: |
    **Rétractions et produits.** Soient $r : X \to A$ une rétraction, $i : A \to X$ l'inclusion et $a \in A$. On note $i_{*}$ et $r_{*}$ les morphismes induits sur les groupes fondamentaux basés en $a$.

    **1.** Montrer que $i_{*}\big(\pi_{1}(A, a)\big) \cap \mathrm{Ker}\, r_{*} = \{1\}$, et que $\pi_{1}(X, a)$ est engendré par $i_{*}\big(\pi_{1}(A, a)\big)$ et $\mathrm{Ker}\, r_{*}$.

    **2.** On suppose $i_{*}\big(\pi_{1}(A, a)\big)$ distingué dans $\pi_{1}(X, a)$. Montrer que $\pi_{1}(X, a)$ est le produit direct de $i_{*}\big(\pi_{1}(A, a)\big)$ et de $\mathrm{Ker}\, r_{*}$.

    **3.** Illustrer avec le tore $X = \mathbb{S}^{1} \times \mathbb{S}^{1}$ et $A = \mathbb{S}^{1} \times \{1\}$.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Par la proposition 7 du cours, $r_{*} \circ i_{*} = (r \circ i)_{*} = \mathrm{id}$. Si $i_{*}(c) \in \mathrm{Ker}\, r_{*}$, alors $c = r_{*}i_{*}(c) = 1$, donc $i_{*}(c) = 1$ : l'intersection est triviale. Soit $g \in \pi_{1}(X, a)$ ; posons $h = i_{*}r_{*}(g)$ et $k = h^{-1}g$. Alors $r_{*}(k) = (r_{*}i_{*}r_{*}g)^{-1}\,r_{*}g = (r_{*}g)^{-1}r_{*}g = 1$. Ainsi $g = hk$ avec $h \in i_{*}\big(\pi_{1}(A, a)\big)$ et $k \in \mathrm{Ker}\, r_{*}$.

    **2.** Notons $I = i_{*}\big(\pi_{1}(A, a)\big)$ et $K = \mathrm{Ker}\, r_{*}$, tous deux distingués, $K$ comme noyau. Pour $h \in I$ et $k \in K$, le commutateur $hkh^{-1}k^{-1}$ est dans $I$, car $I$ est distingué, et dans $K$, pour la même raison : il vaut $1$. Les éléments de $I$ et de $K$ commutent, $I \cap K = \{1\}$ et $IK = \pi_{1}(X, a)$ : l'application $(h, k) \mapsto hk$ est un isomorphisme de $I \times K$ sur $\pi_{1}(X, a)$.

    **3.** L'application $r(z, w) = (z, 1)$ est une rétraction du tore sur $A$. Par la proposition 8 du cours, $\pi_{1}(\mathbb{S}^{1} \times \mathbb{S}^{1}) \simeq \pi_{1}(\mathbb{S}^{1}) \times \pi_{1}(\mathbb{S}^{1})$, qui est commutatif, donc $I$ est distingué : on retrouve la décomposition en produit, avec $I$ engendré par la classe du cercle $\mathbb{S}^{1} \times \{1\}$ et $K$ par celle du cercle $\{1\} \times \mathbb{S}^{1}$. Le chapitre 6 montrera que chaque facteur est $\mathbb{Z}$.

    0@16@ii@ii-@>@ii@ii>@-\@M
