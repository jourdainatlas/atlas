- id: "l3-gt-05-01"
  feuille: "f-l3-gt-05"
  numero: 1
  partie: "Homotopie et types d'homotopie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Composition et homotopie.** Soient $f_{1}, f_{2} : X \to Y$ et $g_{1}, g_{2} : Y \to Z$ continues.

    **1.** Si $f_{1} \simeq f_{2}$, montrer que $g_{1} \circ f_{1} \simeq g_{1} \circ f_{2}$.

    **2.** Si $f_{1} \simeq f_{2}$ et $g_{1} \simeq g_{2}$, montrer que $g_{1} \circ f_{1} \simeq g_{2} \circ f_{2}$.

    **3.** En déduire que la relation « avoir même type d'homotopie » est transitive.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $F : X \times [0, 1] \to Y$ est une homotopie de $f_{1}$ à $f_{2}$, alors $g_{1} \circ F$ est une homotopie de $g_{1} \circ f_{1}$ à $g_{1} \circ f_{2}$.

    **2.** Soit de plus $G : Y \times [0, 1] \to Z$ une homotopie de $g_{1}$ à $g_{2}$. L'application $(x, s) \mapsto G\big(F(x, s), s\big)$ est continue, comme composée de $(x, s) \mapsto \big(F(x, s), s\big)$ et de $G$, et c'est une homotopie de $g_{1} \circ f_{1}$ à $g_{2} \circ f_{2}$.

    **3.** Soient $f : X \to Y$, $g : Y \to X$ et $f' : Y \to Z$, $g' : Z \to Y$ des équivalences d'homotopie réciproques. Par la question 2, 
    $$(g \circ g') \circ (f' \circ f) = g \circ (g' \circ f') \circ f \simeq g \circ \mathrm{id}_{Y} \circ f = g \circ f \simeq \mathrm{id}_{X} ,$$
     et de même dans l'autre sens : $f' \circ f$ est une équivalence d'homotopie.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-02"
  feuille: "f-l3-gt-05"
  numero: 2
  partie: "Homotopie et types d'homotopie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **Même type d'homotopie.**

    **1.** Montrer que si $A$ est un rétracte par déformation de $X$, l'inclusion $A \to X$ est une équivalence d'homotopie.

    **2.** Montrer que le cercle $\mathbb{S}^{1}$ et la couronne $\{x \in \mathbb{R}^{2} \mid u \leq \lVert x \rVert \leq 1\}$, avec $u \in \, ]0, 1[$, ont même type d'homotopie.

    **3.** Montrer qu'un espace $X$ et le produit $X \times [0, 1]$ ont même type d'homotopie.

    **4.** Montrer que, pour $n \geq 1$, la sphère $\mathbb{S}^{n}$ privée de deux points distincts et la sphère $\mathbb{S}^{n-1}$ ont même type d'homotopie.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Soient $i : A \to X$ l'inclusion et $r$ une rétraction par déformation. Alors $r \circ i = \mathrm{id}_{A}$ et $i \circ r \simeq \mathrm{id}_{X}$ : $i$ et $r$ sont des équivalences d'homotopie réciproques.

    **2.** Notons $K_{u}$ la couronne. L'application $H(x, s) = (1 - s)x + s\dfrac{x}{\lVert x \rVert}$ reste dans $K_{u}$, car $\lVert H(x, s) \rVert$ est compris entre $\lVert x \rVert$ et $1$ ; elle fixe les points du cercle unité, et $H(\cdot, 1)$ est la rétraction radiale. Le cercle est un rétracte par déformation de $K_{u}$, et la question 1 conclut.

    ![Figure](documents/figures/1104c36f524ddc99.svg)

    La couronne (en bleu clair) se rétracte par déformation sur son cercle extérieur (en vert) en poussant chaque point le long de son rayon ; le disque intérieur, exclu de la couronne, n'est jamais traversé.

    **3.** Soient $f(x) = (x, 0)$ et $g$ la première projection. On a $g \circ f = \mathrm{id}_{X}$, et $H\big((x, t), s\big) = (x, st)$ est une homotopie de $f \circ g$ à $\mathrm{id}_{X \times [0, 1]}$.

    **4.** Par une rotation, on peut supposer que les deux points retirés sont $N$ et un autre point $p$. La projection stéréographique de pôle $N$ envoie $\mathbb{S}^{n} \setminus \{N, p\}$ homéomorphiquement sur $\mathbb{R}^{n}$ privé d'un point, qui se rétracte par déformation sur une sphère $\mathbb{S}^{n-1}$ centrée en ce point (exemple du cours après la proposition 10). Par la question 1, $\mathbb{S}^{n} \setminus \{N, p\}$ a le type d'homotopie de $\mathbb{S}^{n-1}$. Pour $n = 2$, la sphère privée de deux points est un cylindre, qui a le type d'homotopie du cercle.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-03"
  feuille: "f-l3-gt-05"
  numero: 3
  partie: "Homotopie et types d'homotopie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Connexité par arcs.** Soient $X$ et $Y$ deux espaces de même type d'homotopie. Montrer que si $X$ est connexe par arcs, $Y$ l'est aussi.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    Soient $f : X \to Y$ et $g : Y \to X$ avec $f \circ g \simeq \mathrm{id}_{Y}$ par une homotopie $H$, et $y, y' \in Y$. Il existe un chemin $c$ de $g(y)$ à $g(y')$ dans $X$, et $f \circ c$ joint $fg(y)$ à $fg(y')$. Le chemin $s \mapsto H(y, s)$ joint $fg(y)$ à $y$, et de même pour $y'$. En parcourant le premier à l'envers, puis $f \circ c$, puis le second, on joint $y$ à $y'$. Seule la relation $f \circ g \simeq \mathrm{id}_{Y}$ a servi.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-04"
  feuille: "f-l3-gt-05"
  numero: 4
  partie: "Homotopie et types d'homotopie"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Parties étoilées.**

    **1.** Montrer que le disque $D^{2}$ se rétracte par déformation sur son centre.

    **2.** Une partie $C$ de $\mathbb{R}^{n}$ est étoilée s'il existe $x_{0} \in C$ tel que le segment $[x_{0}, x]$ soit inclus dans $C$ pour tout $x \in C$. Montrer qu'une partie étoilée est contractile. Quel est son groupe fondamental ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'homotopie $H(x, s) = (1 - s)x$ reste dans $D^{2}$, fixe le centre, et vaut l'identité pour $s = 0$ et l'application constante nulle pour $s = 1$.

    **2.** L'homotopie $H(x, s) = (1 - s)x + sx_{0}$ reste dans $C$, puisque $H(x, s) \in [x_{0}, x]$ ; elle joint $\mathrm{id}_{C}$ à la constante $x_{0}$ et fixe $x_{0}$ : $C$ est contractile, et même rétractable par déformation sur $\{x_{0}\}$. Par la proposition 10 du cours, $\pi_{1}(C, x_{0}) \simeq \pi_{1}(\{x_{0}\}, x_{0})$ est trivial, et $C$, connexe par arcs, est simplement connexe. Cela généralise la proposition 2 du cours, qui traitait des convexes.

    ![Figure](documents/figures/63e2ca68fdff8dd9.svg)

    Une étoile, partie non convexe mais étoilée par rapport à $x_{0}$ : chaque point se ramène vers $x_{0}$ le long de son segment (en orange), qui reste dans la partie.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-05"
  feuille: "f-l3-gt-05"
  numero: 5
  partie: "Homotopie et types d'homotopie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  source: "Bordeaux 2016, feuille 6, exercice 4"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **Le cône est contractile.** Soit $X$ un espace topologique et $CX = (X \times [0, 1])/(X \times \{1\})$ le cône sur $X$, de sommet $\sigma$. Montrer que $H([x, t], s) = [x, t + s(1 - t)]$ définit une application continue $CX \times [0, 1] \to CX$, et en déduire que $CX$ est contractile. On prendra garde que $X$ n'est pas supposé compact.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    $\triangleright$ *Définition.* L'expression $[x, t + s(1 - t)]$ ne dépend que de $[x, t]$ : si $t = 1$, elle vaut $[x, 1] = \sigma$ quel que soit $x$. On a $H(\cdot, 0) = \mathrm{id}_{CX}$ et $H(\cdot, 1)$ est constante, égale à $\sigma$. Il reste à établir la continuité, qui ne découle pas immédiatement de celle de la formule, car le produit de la projection $\pi : X \times [0, 1] \to CX$ par $\mathrm{id}_{[0, 1]}$ n'est pas forcément une application quotient.

    $\triangleright$ *Hors du sommet.* L'ouvert saturé $X \times [0, 1[$ est envoyé homéomorphiquement par $\pi$ sur $CX \setminus \{\sigma\}$. Sur $(CX \setminus \{\sigma\}) \times [0, 1[$, $H$ se lit $\big((x, t), s\big) \mapsto (x, t + s(1 - t))$, avec $t + s(1 - t) < 1$ : elle est continue.

    $\triangleright$ *Aux points d'image $\sigma$.* Soit $W$ un ouvert de $CX$ contenant $\sigma$ et $O = \pi^{-1}(W)$, ouvert contenant $X \times \{1\}$. Posons 
    $$S = \big\{(x, t) \in X \times [0, 1] \mid \{x\} \times [t, 1] \subset O\big\} .$$
     Par le lemme du tube (chapitre 2), appliqué au compact $[t, 1]$, $S$ est ouvert ; il est saturé et contient $X \times \{1\}$, donc $N = \pi(S)$ est un voisinage ouvert de $\sigma$. Comme $t + s(1 - t) \geq t$, on a $H\big(N \times [0, 1]\big) \subset W$ : $H$ est continue aux points $(\sigma, s)$. Enfin, en un point $\big([x_{0}, t_{0}], 1\big)$ avec $t_{0} < 1$, l'ouvert $O$ contient un voisinage $U \times \, ]1 - \eta, 1]$ de $(x_{0}, 1)$ ; pour $x \in U$, $t$ quelconque et $s > 1 - \eta$, on a $1 - (1 - s)(1 - t) > 1 - \eta$, donc $H([x, t], s) \in W$.

    Ainsi $H$ est continue, et $\mathrm{id}_{CX}$ est homotope à une constante : *$CX$ est contractile.* Le point délicat est celui que révélait le cône sur $\mathbb{R}$ au chapitre 3 (exercice 8) : les voisinages du sommet peuvent « s'amincir » quand $x$ s'éloigne, et l'ouvert $S$ s'adapte à cet amincissement.

    ![Figure](documents/figures/498dc5903484e906.svg)

    L'homotopie $H$ fait glisser chaque point $[x, t]$ le long de sa génératrice vers le sommet $\sigma$, à la vitesse qui l'y amène à l'instant $s = 1$.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-06"
  feuille: "f-l3-gt-05"
  numero: 6
  partie: "Homotopie et types d'homotopie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Espaces contractiles et extension au disque.**

    **1.** Montrer qu'un espace est contractile si et seulement s'il a le type d'homotopie d'un point.

    **2.** Montrer que deux applications continues d'un espace $Y$ dans un espace contractile $X$ sont homotopes.

    **3.** Soient $D^{n+1}$ la boule unité fermée de $\mathbb{R}^{n+1}$, de bord $\mathbb{S}^{n}$, un point $x_{0} \in \mathbb{S}^{n}$ et $f : \mathbb{S}^{n} \to X$ continue. Montrer l'équivalence des propriétés suivantes :

    **(a)** $f$ est homotope à une application constante ;

    **(b)** $f$ se prolonge en une application continue $g : D^{n+1} \to X$ ;

    **(c)** $f$ est homotope à l'application constante de valeur $f(x_{0})$, relativement à $\{x_{0}\}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $\mathrm{id}_{X} \simeq c_{x_{0}}$, l'application $f : X \to \{x_{0}\}$ et l'inclusion $g : \{x_{0}\} \to X$ vérifient $f \circ g = \mathrm{id}$ et $g \circ f = c_{x_{0}} \simeq \mathrm{id}_{X}$. Réciproquement, si $f : X \to \{*\}$ et $g : \{*\} \to X$ sont des équivalences d'homotopie réciproques, $g \circ f$ est constante et homotope à $\mathrm{id}_{X}$.

    **2.** Soit $H$ une homotopie de $\mathrm{id}_{X}$ à la constante $c_{x_{0}}$. Pour $f : Y \to X$, $(y, s) \mapsto H\big(f(y), s\big)$ est une homotopie de $f$ à la constante $x_{0}$ ; de même pour $g$. Comme la relation d'homotopie est une équivalence, $f \simeq g$.

    **3.** $\triangleright$ *(b) $\Rightarrow$ (c).* Si $g$ prolonge $f$, posons $H(x, s) = g\big((1 - s)x + sx_{0}\big)$ pour $x \in \mathbb{S}^{n}$. Le point $(1 - s)x + sx_{0}$ est dans la boule, qui est convexe ; $H(\cdot, 0) = f$, $H(\cdot, 1)$ est la constante $g(x_{0}) = f(x_{0})$, et $H(x_{0}, s) = f(x_{0})$ pour tout $s$.

    $\triangleright$ *(c) $\Rightarrow$ (a)* est immédiat.

    $\triangleright$ *(a) $\Rightarrow$ (b).* Soit $H$ une homotopie de $f$ à une constante $c$. L'application $q : \mathbb{S}^{n} \times [0, 1] \to D^{n+1}$, $q(x, t) = tx$, est continue et surjective, d'un compact sur un séparé ; ses fibres sont $\mathbb{S}^{n} \times \{0\}$ et des singletons. C'est donc une application quotient (chapitre 3, prop. 4), qui réalise la boule comme un cône sur la sphère. L'application $(x, t) \mapsto H(x, 1 - t)$ est constante, égale à $c$, sur $\mathbb{S}^{n} \times \{0\}$ : elle induit une application continue $g$ sur la boule (chapitre 3, th. 1), avec $g(x) = H(x, 0) = f(x)$ sur la sphère.

    ![Figure](documents/figures/40e4dfa3069382bd.svg)

    Le prolongement $g$ lit l'homotopie sur des cercles concentriques : le bord porte $f$, le cercle de rayon $t$ porte l'étape $1 - t$, et le centre la constante finale. Le cours (th. 2) utilisait la même idée pour $n = 1$.

    L'équivalence avec (c) ne se généralise pas à n'importe quel espace : le peigne de l'exercice suivant est contractile, mais l'homotopie de l'identité à une constante ne peut pas fixer certains points. C'est la sphère, et plus précisément le prolongement à la boule, qui permet ici de fixer $x_{0}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-07"
  feuille: "f-l3-gt-05"
  numero: 7
  partie: "Homotopie et types d'homotopie"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [homotopie]
  noeuds: [ta-homotopie, vk-retractes]
  notions: [applications-homotopes]
  source: "Bordeaux 2016, feuille 6, exercice 5"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Le peigne.** On considère la partie suivante de $\mathbb{R}^{2}$ : 
    $$X = \big([0, 1] \times \{0\}\big) \cup \big(\{0\} \times [0, 1]\big) \cup \bigcup_{n \in \mathbb{N}}\big(\{2^{-n}\} \times [0, 1]\big) .$$
     Soient $x_{0} = (0, 1)$ et $f_{0} : X \to X$ l'application constante de valeur $x_{0}$.

    **1.** Montrer que $f_{0}$ est homotope à $\mathrm{id}_{X}$. En déduire que $X$ est contractile.

    **2.** Montrer que $X$ n'est pas localement connexe en $x_{0}$.

    **3.** En déduire, par exemple à l'aide du théorème de Heine, que $f_{0}$ n'est pas homotope à $\mathrm{id}_{X}$ relativement à $\{x_{0}\}$.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Trois homotopies successives restent dans $X$ : la descente verticale $\big((x, y), s\big) \mapsto (x, (1 - s)y)$ amène $\mathrm{id}_{X}$ sur la projection $(x, y) \mapsto (x, 0)$ ; le glissement $\big((x, y), s\big) \mapsto ((1 - s)x, 0)$ amène celle-ci sur la constante $(0, 0)$ ; la montée $\big((x, y), s\big) \mapsto (0, s)$ amène cette constante sur $f_{0}$. Par transitivité, $\mathrm{id}_{X} \simeq f_{0}$, et $X$ est contractile.

    **2.** Soit $B = B(x_{0}, \dfrac{1}{4})$. Les points de $X \cap B$ ont une ordonnée supérieure à $\dfrac{3}{4}$, donc sont sur les dents verticales : leur abscisse appartient à $E = \{0\} \cup \{2^{-n}, n \in \mathbb{N}\}$. Une partie connexe de $E$ est un point, puisque $E$ est une partie de $\mathbb{R}$ sans intervalle non trivial. Si $V \subset B$ était un voisinage connexe de $x_{0}$ dans $X$, l'abscisse, continue, serait constante sur $V$, égale à $0$ ; or $V$ contient des points $(2^{-n}, 1)$ pour $n$ grand. Le peigne n'est pas localement connexe en $x_{0}$.

    **3.** Supposons qu'une homotopie $H : X \times [0, 1] \to X$ relie $\mathrm{id}_{X}$ à $f_{0}$ en fixant $x_{0}$. Comme $X \times [0, 1]$ est compact, $H$ est uniformément continue (théorème de Heine) : il existe $\delta > 0$ tel que $\lVert p - p' \rVert < \delta$ entraîne $\lVert H(p, s) - H(p', s) \rVert < \dfrac{1}{4}$ pour tout $s$. Soit $p_{n} = (2^{-n}, 1)$ avec $2^{-n} < \delta$. Comme $H(x_{0}, s) = x_{0}$, le chemin $s \mapsto H(p_{n}, s)$ reste dans $B$ ; il va de $H(p_{n}, 0) = p_{n}$ à $H(p_{n}, 1) = x_{0}$. Son abscisse, continue à valeurs dans $E$, est constante, alors qu'elle passe de $2^{-n}$ à $0$ : contradiction.

    ![Figure](documents/figures/c42f84cef666e562.svg)

    Le peigne et la boule $B(x_{0}, \dfrac{1}{4})$ (en tirets) : à l'intérieur, $X$ n'est qu'une suite de morceaux de dents verticales qui s'accumulent sur la dent $x = 0$. Une homotopie fixant $x_{0}$ devrait faire passer $p_{n}$ d'une dent à l'autre sans sortir de la boule.

    0@16@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-08"
  feuille: "f-l3-gt-05"
  numero: 8
  partie: "Rétractions"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [rétractions]
  noeuds: [vk-retractes, ta-fonctorialite]
  notions: [retraction-espace, retracte-deformation]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Un rétracte est fermé.** Soient $X$ un espace séparé et $A \subset X$. Montrer que s'il existe une rétraction $r : X \to A$, alors $A$ est fermé dans $X$. Le disque ouvert est-il un rétracte du disque fermé ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    Notons $i$ l'inclusion. On a $A = \{x \in X \mid i\big(r(x)\big) = x\}$ : un point de $A$ est fixé par $r$, et un point fixé par $i \circ r$ est dans l'image $A$. C'est l'image réciproque de la diagonale de $X \times X$ par l'application continue $x \mapsto \big(x, i(r(x))\big)$. Comme $X$ est séparé, la diagonale est fermée (chapitre 2, exercice 9), donc $A$ est fermé. Le disque ouvert n'est pas fermé dans le disque fermé : ce n'en est pas un rétracte.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-09"
  feuille: "f-l3-gt-05"
  numero: 9
  partie: "Rétractions"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [rétractions]
  noeuds: [vk-retractes, ta-fonctorialite]
  notions: [retraction-espace, retracte-deformation]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **Le huit.** On note $\mathbb{S}^{1} \vee \mathbb{S}^{1}$ la réunion des cercles de rayon $1$ centrés en $(0, 0)$ et en $(2, 0)$, tangents en $(1, 0)$.

    **1.** Montrer que $\mathbb{S}^{1} \vee \mathbb{S}^{1}$ se rétracte sur le cercle centré en $(0, 0)$.

    **2.** On pose $X = (\mathbb{S}^{1} \vee \mathbb{S}^{1}) \setminus \{(-1, 0), (3, 0)\}$. Montrer que $\{(1, 0)\}$ est un rétracte par déformation de $X$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Notons $C_{1}$ et $C_{2}$ les cercles centrés en $(0, 0)$ et $(2, 0)$. L'application égale à l'identité sur $C_{1}$ et à la constante $(1, 0)$ sur $C_{2}$ est continue, car $C_{1}$ et $C_{2}$ sont deux fermés dont l'intersection $\{(1, 0)\}$ est fixée par les deux définitions. C'est une rétraction de $\mathbb{S}^{1} \vee \mathbb{S}^{1}$ sur $C_{1}$. Ce n'est pas un rétracte par déformation : on peut montrer, avec le théorème de Van Kampen, que $\pi_{1}(\mathbb{S}^{1} \vee \mathbb{S}^{1})$ n'est pas commutatif, alors que $\pi_{1}(\mathbb{S}^{1}) \simeq \mathbb{Z}$, ce qui contredirait la proposition 10 du cours.

    **2.** Paramétrons $C_{1} \setminus \{(-1, 0)\}$ par $\theta \mapsto \mathrm{e}^{\mathrm{i}\theta}$ et $C_{2} \setminus \{(3, 0)\}$ par $\varphi \mapsto (2 - \cos\varphi, \sin\varphi)$, avec $\theta, \varphi \in \, ]-\pi, \pi[$ ; ce sont des homéomorphismes, et l'angle $0$ correspond dans les deux cas au point de contact $(1, 0)$. Posons 
    $$H(\mathrm{e}^{\mathrm{i}\theta}, s) = \mathrm{e}^{\mathrm{i}(1 - s)\theta} , \qquad H\big((2 - \cos\varphi, \sin\varphi), s\big) = \big(2 - \cos((1 - s)\varphi), \sin((1 - s)\varphi)\big) .$$
     Les deux formules coïncident en $(1, 0)$, et définissent une homotopie continue sur $X$, qui fixe $(1, 0)$, part de l'identité et arrive sur la constante $(1, 0)$. Une fois retirés les deux points opposés au contact, chaque cercle n'est plus qu'un arc que l'on peut replier vers $(1, 0)$.

    ![Figure](documents/figures/19ecaa0963a169d3.svg)

    À gauche, le huit $\mathbb{S}^{1} \vee \mathbb{S}^{1}$ et son point de contact (en rouge). À droite, l'espace $X$ privé des deux points extrêmes (cercles vides) : chaque arc se replie vers le point de contact, dans le sens des flèches grises.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-05-10"
  feuille: "f-l3-gt-05"
  numero: 10
