  enonce: |
    **L'espace projectif complexe.** On note $\mathbb{P}^{n}(\mathbb{C})$ le quotient de $\mathbb{C}^{n+1} \setminus \{0\}$ par la relation $z \sim \lambda z$, $\lambda \in \mathbb{C}^{*}$, et $[z_{0} : \dots : z_{n}]$ la classe de $(z_{0}, \dots, z_{n})$.

    **1.** Montrer que le complémentaire d'un hyperplan affine complexe dans $\mathbb{C}^{n}$ est connexe par arcs. Comparer avec le cas réel.

    **2.** Montrer que $U = \{[z] \mid z_{0} \neq 0\}$ est un ouvert de $\mathbb{P}^{n}(\mathbb{C})$ homéomorphe à $\mathbb{C}^{n}$.

    **3.** Soit $V = \mathbb{P}^{n}(\mathbb{C}) \setminus \{[1 : 0 : \dots : 0]\}$. Montrer que $V$ se rétracte par déformation sur $\{[z] \mid z_{0} = 0\}$, qui est homéomorphe à $\mathbb{P}^{n-1}(\mathbb{C})$, et que $U \cap V$ est homéomorphe à $\mathbb{C}^{n} \setminus \{0\}$.

    **4.** En déduire, par récurrence et à l'aide du petit théorème de Van Kampen, que $\mathbb{P}^{n}(\mathbb{C})$ est simplement connexe.
  corrige: |
    **1.** Soient $H$ un hyperplan affine complexe et $x, y \notin H$. La droite complexe $L = \{x + \lambda(y - x) \mid \lambda \in \mathbb{C}\}$ n'est pas contenue dans $H$, puisque $x \notin H$ ; $L \cap H$ est donc vide ou réduit à un point, de paramètre $\lambda_{0}$. Comme $\mathbb{C}$ privé d'un point est connexe par arcs, il existe un chemin de $0$ à $1$ dans $\mathbb{C} \setminus \{\lambda_{0}\}$, d'où un chemin de $x$ à $y$ dans $L \setminus H$. Dans le cas réel, un hyperplan de $\mathbb{R}^{n}$ sépare l'espace en deux demi-espaces : l'hyperplan complexe est de codimension réelle $2$, comme un point dans le plan, et l'on peut le contourner.

    **2.** La projection $\pi : \mathbb{C}^{n+1} \setminus \{0\} \to \mathbb{P}^{n}(\mathbb{C})$ est ouverte, car $\pi^{-1}\big(\pi(O)\big) = \mathop{\displaystyle \bigcup_{\lambda \in \mathbb{C}^{*}}}\lambda O$ est une réunion d'images d'ouverts par des homéomorphismes. L'ensemble $\pi^{-1}(U) = \{z_{0} \neq 0\}$ est ouvert, donc $U$ aussi. L'application $[z] \mapsto \big(\dfrac{z_{1}}{z_{0}}, \dots, \dfrac{z_{n}}{z_{0}}\big)$ est bien définie et continue sur $U$ (chapitre 3, th. 1), de réciproque continue $w \mapsto [1 : w]$.

    **3.** Un point de $V$ s'écrit $[z_{0} : z']$ avec $z' \neq 0$. Posons $H\big([z_{0} : z'], s\big) = [(1 - s)z_{0} : z']$, bien défini puisque $z' \neq 0$ et que la formule est homogène. Elle est continue : la formule est continue sur $\{z' \neq 0\} \times [0, 1]$, et $\pi \times \mathrm{id}_{[0, 1]}$ est continue, surjective et ouverte, donc une application quotient. On a $H(\cdot, 0) = \mathrm{id}_{V}$, $H(\cdot, 1)$ est à valeurs dans $\{z_{0} = 0\}$, et les points de cet ensemble sont fixes : c'est une rétraction par déformation. L'application $[0 : z'] \mapsto [z']$ identifie $\{z_{0} = 0\}$ à $\mathbb{P}^{n-1}(\mathbb{C})$. Enfin, $U \cap V$ correspond, dans la carte de la question 2, à $\mathbb{C}^{n}$ privé de l'image de $[1 : 0 : \dots : 0]$, qui est $0$.

    **4.** Pour $n = 0$, $\mathbb{P}^{0}(\mathbb{C})$ est un point. Supposons $\mathbb{P}^{n-1}(\mathbb{C})$ simplement connexe, avec $n \geq 1$. Alors $V$, qui s'y rétracte par déformation, est connexe par arcs et de groupe fondamental trivial (cours, prop. 10) ; $U \simeq \mathbb{C}^{n}$ est convexe, donc simplement connexe ; $U \cap V \simeq \mathbb{C}^{n} \setminus \{0\} = \mathbb{R}^{2n} \setminus \{0\}$ est non vide et connexe par arcs, puisque $2n \geq 2$ (chapitre 2, exercice 3). Enfin $U \cup V = \mathbb{P}^{n}(\mathbb{C})$, car le point retiré de $V$ est dans $U$. Par le petit théorème de Van Kampen (cours, th. 3), *$\mathbb{P}^{n}(\mathbb{C})$ est simplement connexe.* Le contraste avec $\mathcal{P}^{n}$, de groupe fondamental $\mathbb{Z}/2\mathbb{Z}$ (chapitre 6), vient encore de la codimension : ici, $U \cap V$ est le complémentaire d'un point dans un espace de dimension réelle $2n \geq 2$.

