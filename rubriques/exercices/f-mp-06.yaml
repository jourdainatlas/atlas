  enonce: |
    *Transformation d'Abel.* Soit $(a_{n})_{n \geqslant 1}$ une suite complexe, $A_{n} = \sum_{k=1}^{n} a_{k}$, et $(b_{n})$ une suite réelle décroissante de limite nulle.

    **1.** Montrer que $\displaystyle\sum_{k=1}^{n} a_{k}b_{k} = A_{n}b_{n} + \sum_{k=1}^{n-1} A_{k}(b_{k} - b_{k+1})$.

    **2.** On suppose $(A_{n})$ bornée. Montrer que $\sum a_{n}b_{n}$ converge.

    **3.** Soit $\theta \in \mathbb{R} \setminus 2\pi\mathbb{Z}$. Montrer que $\Big|\sum_{k=1}^{n} \mathrm{e}^{\mathrm{i} k\theta}\Big| \leqslant \dfrac{1}{|\sin(\theta/2)|}$, et en déduire que $\sum \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n^{\alpha}}$ converge pour tout $\alpha > 0$.

    **4.** Montrer que $\sum \frac{\sin n}{n}$ converge, et que $\sum \frac{|\sin n|}{n}$ diverge, en utilisant $|\sin n| \geqslant \sin^{2}n$.
  corrige: |
    **1.** Avec $A_{0} = 0$ et $a_{k} = A_{k} - A_{k-1}$, on décale l'indice : 
    $$\sum_{k=1}^{n} a_{k}b_{k} = \sum_{k=1}^{n} A_{k}b_{k} - \sum_{k=1}^{n-1} A_{k}b_{k+1} = A_{n}b_{n} + \sum_{k=1}^{n-1} A_{k}(b_{k} - b_{k+1}).$$

    **2.** Soit $M$ un majorant de $|A_{n}|$. Le terme $A_{n}b_{n}$ tend vers $0$, et $|A_{k}(b_{k} - b_{k+1})| \leqslant M(b_{k} - b_{k+1})$, terme positif d'une série télescopique convergente : la série $\mathop{\displaystyle \sum} A_{k}(b_{k} - b_{k+1})$ converge absolument. 
    $$\boxed{\sum a_{n}b_{n} \text{ converge}}$$

    **3.** On somme la série géométrique : $\mathop{\displaystyle \sum_{k=1}^{n}} \mathrm{e}^{\mathrm{i} k\theta} = \mathrm{e}^{\mathrm{i}\theta}\dfrac{1 - \mathrm{e}^{\mathrm{i} n\theta}}{1 - \mathrm{e}^{\mathrm{i}\theta}}$, de module au plus $\dfrac{2}{|1 - \mathrm{e}^{\mathrm{i}\theta}|} = \dfrac{1}{|\sin(\theta/2)|}$ (exercice 42). On applique la question 2 avec $b_{n} = \dfrac{1}{n^{\alpha}}$.

    **4.** La série $\mathop{\displaystyle \sum} \dfrac{\sin n}{n}$ est la partie imaginaire de la série de la question 3 pour $\theta = 1$ et $\alpha = 1$. Par ailleurs, $\dfrac{|\sin n|}{n} \geqslant \dfrac{\sin^{2}n}{n} = \dfrac{1}{2n} - \dfrac{\cos 2n}{2n}$ ; la série $\mathop{\displaystyle \sum} \dfrac{\cos 2n}{n}$ converge ($\theta = 2$), et $\mathop{\displaystyle \sum} \dfrac{1}{2n}$ diverge. 
    $$\boxed{\sum \frac{\sin n}{n} \text{ converge}, \qquad \sum \frac{|\sin n|}{n} \text{ diverge}}$$
     La transformation d'Abel est l'analogue discret de l'intégration par parties ; elle n'est pas au programme, mais elle est souvent guidée dans les sujets.
