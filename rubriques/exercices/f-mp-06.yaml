  page_enonce: 11
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Si la série $\sum u_{n}$ converge, alors la série $\sum u_{n}^{2}$ converge.

    **2.** Si $u_{n} \geqslant 0$ et si $\sum u_{n}$ converge, alors $\sum u_{n}^{2}$ converge.

    **3.** Si $\big|\frac{u_{n+1}}{u_{n}}\big| \to 1$, alors la série $\sum u_{n}$ diverge.

    **4.** Si $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu| < 1$ pour une norme subordonnée, alors $I_{d} - A$ est inversible.

    **5.** Pour toute $A \in \mathcal{M}_{n}(\mathbb{C})$, la matrice $\exp(A)$ est inversible.

    **6.** Si $u_{n} \sim v_{n}$ et si $\sum v_{n}$ converge, alors $\sum u_{n}$ converge.

    **7.** Si $f : [0, 1] \to \mathbb{R}^{2}$ est dérivable et vérifie $f(0) = f(1)$, alors $f'$ s'annule sur $]0, 1[$.

    **8.** Si $E$ est euclidien et si $f : I \to E$ est dérivable de norme constante, alors $f'(t) \perp f(t)$ pour tout $t$.

    **9.** Une série de vecteurs de $\mathbb{R}^{d}$ dont toutes les séries coordonnées sont absolument convergentes est absolument convergente.

    **10.** Si $u_{n} \to +\infty$, alors $\frac{1}{n}(u_{1} + \cdots + u_{n}) \to +\infty$.
  corrige: |
    **1.** **Faux.** Pour $u_{n} = \dfrac{(-1)^{n}}{\sqrt{n}}$, la série converge (séries alternées) et $\mathop{\displaystyle \sum} u_{n}^{2} = \mathop{\displaystyle \sum} \dfrac{1}{n}$ diverge.

    **2.** **Vrai.** $u_{n} \to 0$, donc $0 \leqslant u_{n}^{2} \leqslant u_{n}$ à partir d'un certain rang.

    **3.** **Faux.** Pour $u_{n} = \dfrac{1}{n^{2}}$, le rapport tend vers $1$ et la série converge (théorème 2 : le cas $\ell = 1$ est indécis).

    **4.** **Vrai.** C'est la proposition 2.

    **5.** **Vrai.** Son déterminant vaut $\mathrm{e}^{\operatorname{tr} A} \neq 0$ (exercice 17), et son inverse est $\exp(-A)$ (exercice 19).

    **6.** **Faux.** Avec $v_{n} = \dfrac{(-1)^{n}}{\sqrt{n}}$ et $u_{n} = v_{n} + \dfrac{1}{n}$, on a $u_{n} \sim v_{n}$, $\mathop{\displaystyle \sum} v_{n}$ converge et $\mathop{\displaystyle \sum} u_{n}$ diverge : l'hypothèse de signe du théorème 3 manque.

    **7.** **Faux.** $f(t) = (\cos 2\pi t, \sin 2\pi t)$ vérifie $f(0) = f(1)$ et $\lVert f'(t) \rVert_{2} = 2\pi$ (cours, section 6.5).

    **8.** **Vrai.** $\lVert f \rVert^{2}$ est constante, de dérivée $2\langle f, f' \rangle$ (exercice 38).

    **9.** **Vrai.** $\lVert u_{n} \rVert_{1} = \mathop{\displaystyle \sum_{i}} |u_{n,i}|$ est le terme d'une série convergente, et les normes sont équivalentes.

    **10.** **Vrai.** C'est le théorème de Cesàro pour une limite infinie (théorème 4).

    $$\boxed{\text{Vrai : 2, 4, 5, 8, 9, 10 ; \quad Faux : 1, 3, 6, 7}}$$
- id: "mp-06-48"
  feuille: "f-mp-06"
