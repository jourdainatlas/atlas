  source: "cours, section 6.3 (exemple de la suite u_{n+1} = sin u_n, poursuivi)"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *Le terme suivant.* Soit $u_{0} \in \, ]0, \frac{\pi}{2}]$ et $u_{n+1} = \sin u_{n}$. Le cours a établi $u_{n} \sim \sqrt{3/n}$.

    **1.** Montrer que $\dfrac{1}{\sin^{2}x} = \dfrac{1}{x^{2}} + \dfrac{1}{3} + \dfrac{x^{2}}{15} + o(x^{2})$ quand $x \to 0$.

    **2.** En déduire que $\dfrac{1}{u_{n+1}^{2}} - \dfrac{1}{u_{n}^{2}} - \dfrac{1}{3} \sim \dfrac{1}{5n}$, puis que $\dfrac{1}{u_{n}^{2}} = \dfrac{n}{3} + \dfrac{\ln n}{5} + o(\ln n)$.

    **3.** Conclure que 
    $$u_{n} = \sqrt{\frac{3}{n}} - \frac{3\sqrt{3}}{10}\,\frac{\ln n}{n^{3/2}} + o\Big(\frac{\ln n}{n^{3/2}}\Big).$$
     Pour $u_{0} = 1$ et $n = 10^{6}$, on calcule $u_{n} \approx 1{,}732\,041\,5 \cdot 10^{-3}$ : comparer avec les approximations à un et à deux termes.
  corrige: |
    **1.** On élève au carré le développement de $\dfrac{\sin x}{x}$ : 
    $$\frac{\sin^{2}x}{x^{2}} = \Big(1 - \frac{x^{2}}{6} + \frac{x^{4}}{120} + o(x^{4})\Big)^{2} = 1 - \frac{x^{2}}{3} + \frac{2x^{4}}{45} + o(x^{4}),$$
     puis on inverse : $\dfrac{x^{2}}{\sin^{2}x} = 1 + \dfrac{x^{2}}{3} + \big(\dfrac{1}{9} - \dfrac{2}{45}\big)x^{4} + o(x^{4}) = 1 + \dfrac{x^{2}}{3} + \dfrac{x^{4}}{15} + o(x^{4})$.

    **2.** Avec $x = u_{n} \to 0$ et $u_{n}^{2} \sim \dfrac{3}{n}$ : 
    $$\frac{1}{u_{n+1}^{2}} - \frac{1}{u_{n}^{2}} - \frac{1}{3} = \frac{u_{n}^{2}}{15} + o(u_{n}^{2}) \sim \frac{1}{5n}.$$
     La série $\mathop{\displaystyle \sum} \dfrac{1}{5n}$, positive, diverge ; par le théorème 3 (ii), la somme de $0$ à $n - 1$ est équivalente à $\dfrac{1}{5}H_{n-1} \sim \dfrac{\ln n}{5}$. Cette somme est télescopique et vaut $\dfrac{1}{u_{n}^{2}} - \dfrac{1}{u_{0}^{2}} - \dfrac{n}{3}$. 
    $$\boxed{\frac{1}{u_{n}^{2}} = \frac{n}{3} + \frac{\ln n}{5} + o(\ln n)}$$

    **3.** On inverse et l'on prend la racine : 
    $$u_{n} = \sqrt{\frac{3}{n}}\Big(1 + \frac{3\ln n}{5n} + o\Big(\frac{\ln n}{n}\Big)\Big)^{-1/2} = \sqrt{\frac{3}{n}}\Big(1 - \frac{3\ln n}{10n} + o\Big(\frac{\ln n}{n}\Big)\Big).$$

    $$\boxed{u_{n} = \sqrt{\frac{3}{n}} - \frac{3\sqrt{3}}{10}\,\frac{\ln n}{n^{3/2}} + o\Big(\frac{\ln n}{n^{3/2}}\Big)}$$
     Pour $n = 10^{6}$, l'approximation à un terme vaut $1{,}732\,050\,8 \cdot 10^{-3}$, celle à deux termes $1{,}732\,043\,6 \cdot 10^{-3}$, pour une valeur exacte $1{,}732\,041\,5 \cdot 10^{-3}$. L'erreur passe de $9{,}3 \cdot 10^{-9}$ à $2{,}1 \cdot 10^{-9}$ ; elle ne diminue pas davantage, car le terme suivant est en $\dfrac{1}{n^{3/2}}$, à peine plus petit que $\dfrac{\ln n}{n^{3/2}}$, et dépend de $u_{0}$.
