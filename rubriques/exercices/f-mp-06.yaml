  source: "BibM@th, Séries numériques, exercice 10 ; Séries numériques et familles sommables (LLG), exercice 49 ; Séries numériques (Sainte-Geneviève), exercice 95"
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Série de Kempner.* Soit $A$ l'ensemble des entiers $n \geqslant 1$ dont l'écriture décimale ne comporte pas le chiffre $9$.

    **1.** Montrer que, pour $k \geqslant 1$, il y a exactement $8 \cdot 9^{k-1}$ éléments de $A$ qui s'écrivent avec $k$ chiffres.

    **2.** En déduire que la série $\sum_{n \in A} \frac{1}{n}$, c'est-à-dire la série de terme général $\frac{1}{n}\mathbf{1}_{A}(n)$, converge, et que sa somme est au plus $80$.

    **3.** Quelle est la nature de la série $\sum_{n \notin A} \frac{1}{n}$ ? Commenter : presque tous les grands entiers contiennent un $9$.
  corrige: |
    **1.** On dénombre chiffre par chiffre : le premier chiffre est dans $\{1, \dots, 8\}$, les $k - 1$ autres dans $\{0, \dots, 8\}$. 
    $$\boxed{8 \cdot 9^{k-1} \text{ éléments de } A \text{ à } k \text{ chiffres}}$$

    **2.** Un entier à $k$ chiffres est au moins $10^{k-1}$. Les sommes partielles de la série positive sont donc majorées par 
    $$\sum_{k=1}^{+\infty} \frac{8 \cdot 9^{k-1}}{10^{k-1}} = \frac{8}{1 - 9/10} = 80.$$

    $$\boxed{\sum_{n \in A} \frac{1}{n} \text{ converge, et sa somme est au plus } 80}$$

    **3.** Si $\mathop{\displaystyle \sum_{n \notin A}} \dfrac{1}{n}$ convergeait, la série harmonique, somme des deux, convergerait. 
    $$\boxed{\sum_{n \notin A} \frac{1}{n} \text{ diverge}}$$
     La proportion d'entiers à $k$ chiffres sans $9$ est $\dfrac{8 \cdot 9^{k-1}}{9 \cdot 10^{k-1}} = \dfrac{8}{9}\big(\dfrac{9}{10}\big)^{k-1}$, qui tend vers $0$ : la série harmonique, privée d'une partie « rare » de ses termes, devient convergente. La somme exacte, calculée par R. Baillie en 1979, vaut environ $22{,}92$.
- id: "mp-06-54"
  feuille: "f-mp-06"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, séries de Riemann]
  noeuds: [as-series]
  notions: [serie-riemann]
  source: "Séries numériques (Sainte-Geneviève), exercice 51 ; BibM@th, Séries numériques, exercice 15"
  page_enonce: 13
  page_corrige: 26
  enonce: |
    *Critère de condensation.* Soit $(u_{n})$ une suite décroissante de réels positifs.

    **1.** Montrer que, pour $k \geqslant 1$, on a $2^{k-1}u_{2^{k}} \leqslant \sum_{n=2^{k-1}+1}^{2^{k}} u_{n} \leqslant 2^{k-1}u_{2^{k-1}}$.

    **2.** En déduire que les séries $\sum u_{n}$ et $\sum 2^{k}u_{2^{k}}$ sont de même nature.

    **3.** Retrouver ainsi la nature des séries de Riemann, puis celle des séries $\sum \frac{1}{n(\ln n)^{b}}$ et $\sum \frac{1}{n\ln n\,(\ln\ln n)^{c}}$.
  corrige: |
    **1.** Le paquet $\llbracket 2^{k-1} + 1\,,2^{k} \rrbracket$ contient $2^{k-1}$ termes, tous compris entre $u_{2^{k}}$ et $u_{2^{k-1}}$ par décroissance.

    **2.** En sommant pour $k = 1, \dots, K$ : 
    $$\frac{1}{2}\sum_{k=1}^{K} 2^{k}u_{2^{k}} \leqslant \sum_{n=2}^{2^{K}} u_{n} \leqslant \sum_{j=0}^{K-1} 2^{j}u_{2^{j}}.$$
     Les deux séries sont positives, et chaque somme partielle de l'une est majorée par une somme partielle de l'autre. 
    $$\boxed{\sum u_{n} \text{ et } \sum 2^{k}u_{2^{k}} \text{ ont même nature}}$$

    **3.** Pour $u_{n} = \dfrac{1}{n^{\alpha}}$ avec $\alpha > 0$, $2^{k}u_{2^{k}} = (2^{1-\alpha})^{k}$ : série géométrique, convergente si et seulement si $\alpha > 1$ ; pour $\alpha \leqslant 0$, la divergence est grossière. Pour $u_{n} = \dfrac{1}{n(\ln n)^{b}}$ ($b > 0$, décroissante pour $n \geqslant 2$), $2^{k}u_{2^{k}} = \dfrac{1}{(\ln 2)^{b}k^{b}}$ : série de Riemann, convergente si et seulement si $b > 1$. Pour la dernière, $2^{k}u_{2^{k}} = \dfrac{1}{k\ln 2\,(\ln(k\ln 2))^{c}} \sim \dfrac{1}{\ln 2}\cdot\dfrac{1}{k(\ln k)^{c}}$ : série de Bertrand, convergente si et seulement si $c > 1$. 
    $$\boxed{\sum \frac{1}{n\ln n\,(\ln\ln n)^{c}} \text{ converge si et seulement si } c > 1}$$
     Chaque application de la condensation remplace $n$ par $k \approx \log_{2}n$ : on peut ainsi descendre d'un logarithme à chaque étape.
- id: "mp-06-55"
  feuille: "f-mp-06"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, comparaison série-intégrale]
  noeuds: [ri-integrable]
  notions: []
  source: "Séries numériques et familles sommables (LLG), exercice 39 ; BibM@th, Séries numériques, exercice 33"
  page_enonce: 13
  page_corrige: 26
  enonce: |
    Soit $(u_{n})$ une suite de réels strictement positifs telle que $\sum u_{n}$ diverge. On note $S_{n} = \sum_{k=0}^{n} u_{k}$, et $\alpha > 0$.

    **1.** On suppose $\alpha > 1$. Montrer que $\dfrac{u_{n}}{S_{n}^{\alpha}} \leqslant \displaystyle\int_{S_{n-1}}^{S_{n}} \frac{\mathrm{d} t}{t^{\alpha}}$ pour $n \geqslant 1$, et en déduire que $\sum \frac{u_{n}}{S_{n}^{\alpha}}$ converge.

    **2.** On suppose $\alpha = 1$. Montrer que $\sum \ln\frac{S_{n}}{S_{n-1}}$ diverge. En distinguant selon que $\frac{u_{n}}{S_{n}}$ tend ou non vers $0$, montrer que $\sum \frac{u_{n}}{S_{n}}$ diverge.

    **3.** Conclure pour $\alpha < 1$. Que retrouve-t-on avec $u_{n} = 1$ ?
  corrige: |
    **1.** La fonction $t \mapsto t^{-\alpha}$ décroît, et vaut au moins $S_{n}^{-\alpha}$ sur $[S_{n-1}, S_{n}]$, intervalle de longueur $u_{n}$. En sommant, 
    $$\sum_{n=1}^{N} \frac{u_{n}}{S_{n}^{\alpha}} \leqslant \int_{S_{0}}^{S_{N}} \frac{\mathrm{d} t}{t^{\alpha}} \leqslant \frac{S_{0}^{1-\alpha}}{\alpha - 1}.$$

    **2.** La somme télescopique $\mathop{\displaystyle \sum_{n=1}^{N}} \ln\dfrac{S_{n}}{S_{n-1}} = \ln\dfrac{S_{N}}{S_{0}}$ tend vers $+\infty$. On a $\ln\dfrac{S_{n}}{S_{n-1}} = -\ln\big(1 - \dfrac{u_{n}}{S_{n}}\big)$. Si $\dfrac{u_{n}}{S_{n}} \to 0$, ce terme est équivalent à $\dfrac{u_{n}}{S_{n}}$, positif, et $\mathop{\displaystyle \sum} \dfrac{u_{n}}{S_{n}}$ diverge. Sinon, la divergence est grossière.

    **3.** Pour $\alpha < 1$ et $n$ assez grand, $S_{n} \geqslant 1$, donc $\dfrac{u_{n}}{S_{n}^{\alpha}} \geqslant \dfrac{u_{n}}{S_{n}}$. 
    $$\boxed{\sum \frac{u_{n}}{S_{n}^{\alpha}} \text{ converge si et seulement si } \alpha > 1}$$
     Avec $u_{n} = 1$, $S_{n} = n + 1$ et l'on retrouve les séries de Riemann. Le résultat dit qu'une série divergente ne peut pas être « ralentie » au point de converger en divisant par $S_{n}$, mais qu'elle le peut en divisant par $S_{n}^{1 + \varepsilon}$.
