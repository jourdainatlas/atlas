- id: "mp-06-01"
  feuille: "f-mp-06"
  numero: 1
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  source: "Séries numériques et familles sommables (LLG), exercice 1 ; BibM@th, Séries numériques, exercices 1 et 2 ; Séries numériques (Sainte-Geneviève), exercice 35"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Séries à termes positifs.* Déterminer la nature de la série de terme général $u_{n}$, pour $n$ assez grand :

    ```tableau
    (a) $\ln\dfrac{1}{\sqrt{n}} - \ln\sin\dfrac{1}{\sqrt{n}}$ ; ¦ (b) $n^{1/n} - 1$ ; ¦ (c) $1 - \cos\dfrac{\pi}{n}$ ;
    (d) $\Big(1 - \dfrac{1}{\sqrt{n}}\Big)^{n}$ ; ¦ (e) $\dfrac{1}{n^{1 + 1/n}}$ ; ¦ (f) $\operatorname{Arccos}\Big(1 - \dfrac{1}{n^{2}}\Big)$ ;
    (g) $\mathrm{e} - \Big(1 + \dfrac{1}{n}\Big)^{n}$ ; ¦ (h) $\dfrac{n^{\ln n}}{(\ln n)^{n}}$ ; ¦ (i) $\dfrac{1}{(\ln n)^{\ln n}}$ ;
    (j) $\dfrac{1}{(\ln n)^{\ln\ln n}}$ ; ¦ (k) $\dfrac{\sqrt{n} + (-1)^{n}}{n^{2}}$ ; ¦ (l) $\sqrt{n^{2} + 1} - n$.
    ```

    Pour (h), (i) et (j), on écrira $u_{n}$ sous la forme $\mathrm{e}^{w_{n}}$ et l'on comparera $w_{n}$ à $-2\ln n$ ou à $-\ln n$.
  corrige: |
    Toutes les séries sont à termes positifs à partir d'un certain rang : on compare à une série de Riemann par équivalent, ou par majoration de $n^{2}u_{n}$ ou de $nu_{n}$.

    (a) Avec $x = \dfrac{1}{\sqrt{n}} \to 0$, $u_{n} = -\ln\dfrac{\sin x}{x} = -\ln\Big(1 - \dfrac{x^{2}}{6} + o(x^{2})\Big) \sim \dfrac{x^{2}}{6} = \dfrac{1}{6n}$ : divergente.

    (b) $u_{n} = \mathrm{e}^{\ln n/n} - 1 \sim \dfrac{\ln n}{n} \geqslant \dfrac{1}{n}$ pour $n \geqslant 3$ : divergente.

    (c) $u_{n} \sim \dfrac{\pi^{2}}{2n^{2}}$ : convergente.

    (d) $\ln u_{n} = n\ln\big(1 - \dfrac{1}{\sqrt{n}}\big) = -\sqrt{n} - \dfrac{1}{2} + o(1)$, donc $n^{2}u_{n} = \exp\big(2\ln n - \sqrt{n} - \dfrac{1}{2} + o(1)\big) \to 0$ : convergente.

    (e) $u_{n} = \dfrac{1}{n}\mathrm{e}^{-\ln n/n} \sim \dfrac{1}{n}$ : divergente.

    (f) $\operatorname{Arccos}(1 - h) \sim \sqrt{2h}$ quand $h \to 0^{+}$, puisque $\cos\theta = 1 - \dfrac{\theta^{2}}{2} + o(\theta^{2})$ ; ici $u_{n} \sim \dfrac{\sqrt{2}}{n}$ : divergente.

    (g) $n\ln\big(1 + \dfrac{1}{n}\big) = 1 - \dfrac{1}{2n} + O\big(\dfrac{1}{n^{2}}\big)$, donc $\big(1 + \dfrac{1}{n}\big)^{n} = \mathrm{e}\big(1 - \dfrac{1}{2n} + O(\dfrac{1}{n^{2}})\big)$ et $u_{n} \sim \dfrac{\mathrm{e}}{2n}$ : divergente.

    (h) $w_{n} = (\ln n)^{2} - n\ln\ln n$, et $w_{n} + 2\ln n \to -\infty$ car $n\ln\ln n$ l'emporte : $n^{2}u_{n} \to 0$, convergente.

    (i) $w_{n} = -\ln n\,\ln\ln n$, et $w_{n} + 2\ln n = \ln n\,(2 - \ln\ln n) \to -\infty$ : convergente.

    (j) $w_{n} = -(\ln\ln n)^{2}$, et $w_{n} + \ln n = \ln n - (\ln\ln n)^{2} \to +\infty$ : $nu_{n} \to +\infty$, donc $u_{n} \geqslant \dfrac{1}{n}$ à partir d'un certain rang, divergente.

    (k) $u_{n} \geqslant 0$ et $u_{n} \sim \dfrac{1}{n^{3/2}}$ : convergente.

    (l) $u_{n} = \dfrac{1}{\sqrt{n^{2} + 1} + n} \sim \dfrac{1}{2n}$ : divergente. 
    $$\boxed{\text{Convergent : (c), (d), (h), (i), (k) ; divergent : (a), (b), (e), (f), (g), (j), (l)}}$$
     *Piège.* Les termes (i) et (j) se ressemblent, mais $(\ln n)^{\ln n} = n^{\ln\ln n}$ croît plus vite que toute puissance de $n$, alors que $(\ln n)^{\ln\ln n} = \mathrm{e}^{(\ln\ln n)^{2}}$ croît moins vite que $n$. Écrire le terme sous forme exponentielle est le seul moyen sûr de comparer.
- id: "mp-06-02"
  feuille: "f-mp-06"
  numero: 2
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries numériques, "règle de d'Alembert"]
  noeuds: [as-series, as-dalembert-cauchy]
  notions: [regle-dalembert]
  source: "BibM@th, Séries numériques, exercices 2 et 6 ; Séries numériques et familles sommables (LLG), exercice 1 (2)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Règle de d'Alembert.* Déterminer la nature de la série de terme général : 
    $$\text{(a) } \frac{n^{n}}{(2n)!} ; \qquad \text{(b) } \frac{(n!)^{2}}{(2n)!} ; \qquad \text{(c) } \frac{1 \cdot 3 \cdot 5 \cdots (2n - 1)}{n!\,3^{n}} ; \qquad \text{(d) } \frac{n^{100}\,5^{n}}{n!} ; \qquad \text{(e) } \frac{2^{n}\,n!}{n^{n}}.$$
  corrige: |
    Les termes sont strictement positifs ; on calcule la limite du rapport $\dfrac{u_{n+1}}{u_{n}}$ (théorème 2).

    (a) $\dfrac{u_{n+1}}{u_{n}} = \Big(1 + \dfrac{1}{n}\Big)^{n}\dfrac{n + 1}{(2n + 1)(2n + 2)} \sim \dfrac{\mathrm{e}}{4n} \to 0$.

    (b) $\dfrac{u_{n+1}}{u_{n}} = \dfrac{(n + 1)^{2}}{(2n + 1)(2n + 2)} \to \dfrac{1}{4}$.

    (c) $u_{n} = \dfrac{(2n)!}{2^{n}n!\,n!\,3^{n}}$, et $\dfrac{u_{n+1}}{u_{n}} = \dfrac{(2n + 1)(2n + 2)}{2(n + 1)^{2}\cdot 3} = \dfrac{2n + 1}{3(n + 1)} \to \dfrac{2}{3}$.

    (d) $\dfrac{u_{n+1}}{u_{n}} = \Big(1 + \dfrac{1}{n}\Big)^{100}\dfrac{5}{n + 1} \to 0$.

    (e) $\dfrac{u_{n+1}}{u_{n}} = 2\Big(\dfrac{n}{n + 1}\Big)^{n} = 2\Big(1 + \dfrac{1}{n}\Big)^{-n} \to \dfrac{2}{\mathrm{e}} < 1$. 
    $$\boxed{\text{Les cinq séries convergent}}$$
- id: "mp-06-03"
  feuille: "f-mp-06"
  numero: 3
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  source: "BibM@th, Séries numériques, exercice 3 ; Séries numériques et familles sommables (LLG), exercice 1 (4)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Séries dépendant de paramètres.* Déterminer les réels $a$, $b$, $\alpha$, $\beta$, $\gamma$ pour lesquels converge la série de terme général :

    **1.** $\mathrm{e}^{1/n} - a - \dfrac{b}{n}$, puis $\cos\dfrac{1}{n} - a - \dfrac{b}{n}$ ;

    **2.** $\sqrt{n^{2} + n + 1} - \sqrt[3]{n^{3} + \alpha n^{2} + \beta n + \gamma}$ ;

    **3.** $\big(n\sin\frac{1}{n}\big)^{n^{\alpha}}$, avec $\alpha > 0$.

    Déterminer enfin la nature de la série de terme général $\frac{1}{\sqrt{n}} - \sqrt{\ln\big(1 + \frac{1}{n}\big)}$.
  corrige: |
    **1.** On développe à l'ordre $2$ en $\dfrac{1}{n}$ : 
    $$\mathrm{e}^{1/n} - a - \frac{b}{n} = (1 - a) + \frac{1 - b}{n} + \frac{1}{2n^{2}} + O\Big(\frac{1}{n^{3}}\Big), \qquad \cos\frac{1}{n} - a - \frac{b}{n} = (1 - a) - \frac{b}{n} - \frac{1}{2n^{2}} + O\Big(\frac{1}{n^{4}}\Big).$$
     Si $a \neq 1$, la divergence est grossière ; si $a = 1$ et que le coefficient de $\dfrac{1}{n}$ est non nul, le terme est équivalent à $\dfrac{c}{n}$, de signe constant, et la série diverge ; sinon le terme est équivalent à $\pm\dfrac{1}{2n^{2}}$. 
    $$\boxed{\text{première série : } a = b = 1 ; \qquad \text{seconde série : } a = 1, \ b = 0}$$

    **2.** On factorise par $n$ et l'on pose $h = \dfrac{1}{n}$ : 
    $$\sqrt{n^{2} + n + 1} = n + \frac{1}{2} + \frac{3}{8n} + O\Big(\frac{1}{n^{2}}\Big), \qquad \sqrt[3]{n^{3} + \alpha n^{2} + \beta n + \gamma} = n + \frac{\alpha}{3} + \Big(\frac{\beta}{3} - \frac{\alpha^{2}}{9}\Big)\frac{1}{n} + O\Big(\frac{1}{n^{2}}\Big).$$
     Le terme général vaut donc $\big(\dfrac{1}{2} - \dfrac{\alpha}{3}\big) + \big(\dfrac{3}{8} - \dfrac{\beta}{3} + \dfrac{\alpha^{2}}{9}\big)\dfrac{1}{n} + O\big(\dfrac{1}{n^{2}}\big)$. Comme à la question 1, la série converge si et seulement si les deux coefficients sont nuls : $\alpha = \dfrac{3}{2}$, puis $\dfrac{\beta}{3} = \dfrac{3}{8} + \dfrac{1}{4}$. 
    $$\boxed{\alpha = \frac{3}{2}, \quad \beta = \frac{15}{8}, \quad \gamma \text{ quelconque}}$$

    **3.** On écrit le terme sous forme exponentielle : $n\sin\dfrac{1}{n} = 1 - \dfrac{1}{6n^{2}} + O\big(\dfrac{1}{n^{4}}\big)$, d'où 
    $$\ln u_{n} = n^{\alpha}\ln\Big(1 - \frac{1}{6n^{2}} + O\Big(\frac{1}{n^{4}}\Big)\Big) = -\frac{n^{\alpha - 2}}{6} + O(n^{\alpha - 4}).$$
     Si $\alpha < 2$, $\ln u_{n} \to 0$ et $u_{n} \to 1$ ; si $\alpha = 2$, $u_{n} \to \mathrm{e}^{-1/6}$ : divergence grossière. Si $\alpha > 2$, alors 
    $$\ln u_{n} + 2\ln n \sim -\frac{n^{\alpha - 2}}{6} \to -\infty,$$
     donc $n^{2}u_{n} \to 0$. 
    $$\boxed{\text{convergence} \iff \alpha > 2}$$

    **Dernière série.** On a $\ln\big(1 + \dfrac{1}{n}\big) = \dfrac{1}{n}\big(1 - \dfrac{1}{2n} + O(\dfrac{1}{n^{2}})\big)$, donc $\sqrt{\ln(1 + \dfrac{1}{n})} = \dfrac{1}{\sqrt{n}}\big(1 - \dfrac{1}{4n} + O(\dfrac{1}{n^{2}})\big)$ et le terme général est équivalent à $\dfrac{1}{4n^{3/2}}$, positif. 
    $$\boxed{\text{La dernière série converge}}$$
- id: "mp-06-04"
  feuille: "f-mp-06"
  numero: 4
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries numériques, convergence absolue]
  noeuds: [as-series]
  notions: [serie-absolument-convergente]
  source: "Séries numériques et familles sommables (LLG), exercice 1 (7, 10, 12, 14) ; BibM@th, Séries numériques, exercices 19 et 20 ; Séries numériques (Sainte-Geneviève), exercice 57"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Séries de signe quelconque.* Déterminer la nature de la série de terme général $u_{n}$, pour $n \geqslant 2$ : 
    $$\text{(a) } \frac{(-1)^{n}}{\sqrt{n} + (-1)^{n}} ; \qquad \text{(b) } \frac{(-1)^{n}}{\sqrt[3]{n} + (-1)^{n}} ; \qquad \text{(c) } \ln\Big(1 + \frac{(-1)^{n}}{n^{\alpha}}\Big), \ \alpha > 0 ;$$

    $$\text{(d) } \sin\big(\pi\sqrt{n^{2} + 1}\big) ; \qquad \text{(e) } \cos\Big(\frac{\pi n^{2}}{n + 1}\Big) ; \qquad \text{(f) } \frac{(-1)^{n}}{n^{3/4}} + \frac{\sin n}{n^{2}}.$$
     On écrira, à l'aide d'un développement limité, $u_{n} = v_{n} + w_{n}$, où $\sum v_{n}$ relève du théorème des séries alternées et $w_{n}$ est de signe constant ou dominé par le terme général d'une série absolument convergente.
  corrige: |
    On applique la méthode suggérée ; on note $\varepsilon_{n} = (-1)^{n}$.

    (a) Avec $s = \dfrac{\varepsilon_{n}}{\sqrt{n}}$, $\dfrac{s}{1 + s} = s - s^{2} + \dfrac{s^{3}}{1 + s}$, donc $u_{n} = \dfrac{\varepsilon_{n}}{\sqrt{n}} - \dfrac{1}{n} + O\big(\dfrac{1}{n^{3/2}}\big)$. La série $\mathop{\displaystyle \sum} \dfrac{\varepsilon_{n}}{\sqrt{n}}$ converge (séries alternées), et $w_{n} = -\dfrac{1}{n} + O\big(\dfrac{1}{n^{3/2}}\big) \sim -\dfrac{1}{n}$ est de signe constant et de série divergente : $\mathop{\displaystyle \sum} u_{n}$ diverge.

    (b) Avec $s = \dfrac{\varepsilon_{n}}{n^{1/3}}$, $\dfrac{s}{1 + s} = s - s^{2} + s^{3} - \dfrac{s^{4}}{1 + s}$, donc 
    $$u_{n} = \frac{\varepsilon_{n}}{n^{1/3}} + \frac{\varepsilon_{n}}{n} - \frac{1}{n^{2/3}} + O\Big(\frac{1}{n^{4/3}}\Big).$$
     Les deux premiers termes donnent des séries alternées convergentes, et le reste est équivalent à $-\dfrac{1}{n^{2/3}}$ : divergente.

    (c) $\ln(1 + s) = s + w$ avec $w \sim -\dfrac{s^{2}}{2}$. Ici $s = \dfrac{\varepsilon_{n}}{n^{\alpha}}$ et $w_{n} \sim -\dfrac{1}{2n^{2\alpha}}$ est négatif à partir d'un certain rang. La série $\mathop{\displaystyle \sum} \dfrac{\varepsilon_{n}}{n^{\alpha}}$ converge, donc $\mathop{\displaystyle \sum} u_{n}$ a la nature de $\mathop{\displaystyle \sum} \dfrac{1}{n^{2\alpha}}$.

    (d) On a $\sqrt{n^{2} + 1} - n = \dfrac{1}{\sqrt{n^{2} + 1} + n}$, donc $\sin\big(\pi\sqrt{n^{2} + 1}\big) = \varepsilon_{n}\sin\dfrac{\pi}{\sqrt{n^{2} + 1} + n}$. Le sinus est celui d'un angle de $]0, \dfrac{\pi}{2}]$ qui décroît vers $0$ : la série est alternée et converge. Elle ne converge pas absolument, car $|u_{n}| \sim \dfrac{\pi}{2n}$.

    (e) $\dfrac{n^{2}}{n + 1} = n - 1 + \dfrac{1}{n + 1}$, donc $u_{n} = (-1)^{n-1}\cos\dfrac{\pi}{n + 1}$ et $|u_{n}| \to 1$ : divergence grossière.

    (f) La série alternée $\mathop{\displaystyle \sum} \dfrac{\varepsilon_{n}}{n^{3/4}}$ converge, et $\big|\dfrac{\sin n}{n^{2}}\big| \leqslant \dfrac{1}{n^{2}}$ : somme de deux séries convergentes. 
    $$\boxed{\text{(a), (b), (e) divergent ; (d), (f) convergent ; (c) converge si et seulement si } \alpha > \tfrac{1}{2}}$$
     *Piège.* Dans (a) et (b), $u_{n} \sim \dfrac{\varepsilon_{n}}{n^{\beta}}$, terme général d'une série convergente, et pourtant $\mathop{\displaystyle \sum} u_{n}$ diverge. L'équivalence ne transmet la nature que pour des séries de signe constant : c'est la remarque qui suit le théorème 3 du cours.
- id: "mp-06-05"
  feuille: "f-mp-06"
  numero: 5
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  source: "Séries numériques et familles sommables (LLG), exercice 1 (20) ; BibM@th, Séries numériques, exercice 25"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On note $N_{n} = \sum_{k=0}^{n} \frac{n!}{k!}$ et $r_{n} = \sum_{k=n+1}^{+\infty} \frac{n!}{k!}$, de sorte que $\mathrm{e}\,n! = N_{n} + r_{n}$.

    **1.** Montrer que $N_{n}$ est un entier de même parité que $n + 1$.

    **2.** Montrer que $\frac{1}{n + 1} \leqslant r_{n} \leqslant \frac{1}{n}$, puis que la suite $(r_{n})$ est décroissante.

    **3.** En déduire la nature de la série $\sum \sin(\pi\,\mathrm{e}\,n!)$. Converge-t-elle absolument ?
  corrige: |
    **1.** On regarde la parité de chaque terme de $N_{n}$. Pour $k \leqslant n - 2$, $\dfrac{n!}{k!} = n(n - 1)\cdots(k + 1)$ est un produit d'au moins deux entiers consécutifs, donc pair. Il reste $\dfrac{n!}{(n-1)!} + \dfrac{n!}{n!} = n + 1$. 
    $$\boxed{N_{n} \equiv n + 1 \pmod 2}$$

    **2.** On encadre le reste par son premier terme et par une série géométrique. Pour $k \geqslant n + 1$, $\dfrac{n!}{k!} = \dfrac{1}{(n + 1)\cdots k} \leqslant \dfrac{1}{(n + 1)^{k - n}}$, d'où 
    $$\frac{1}{n + 1} \leqslant r_{n} \leqslant \sum_{j=1}^{+\infty} \frac{1}{(n + 1)^{j}} = \frac{1}{n}.$$
     Ainsi $r_{n+1} \leqslant \dfrac{1}{n + 1} \leqslant r_{n}$ : la suite $(r_{n})$ est décroissante.

    **3.** On utilise la périodicité du sinus : 
    $$\sin(\pi\mathrm{e}\,n!) = \sin(\pi N_{n} + \pi r_{n}) = (-1)^{N_{n}}\sin(\pi r_{n}) = (-1)^{n+1}\sin(\pi r_{n}).$$
     Pour $n \geqslant 2$, $\pi r_{n} \in \, ]0, \dfrac{\pi}{2}]$ décroît vers $0$, donc $\sin(\pi r_{n})$ aussi : le théorème des séries alternées s'applique. Par concavité, $\sin x \geqslant \dfrac{2}{\pi}x$ sur $[0, \dfrac{\pi}{2}]$, d'où $|u_{n}| \geqslant 2r_{n} \geqslant \dfrac{2}{n + 1}$. 
    $$\boxed{\sum \sin(\pi\mathrm{e}\,n!) \text{ converge, mais pas absolument}}$$
     Le résultat traduit l'irrationalité de $\mathrm{e}$, et même davantage : $\mathrm{e}\,n!$ est à distance $r_{n} \sim \dfrac{1}{n}$ d'un entier.
- id: "mp-06-06"
  feuille: "f-mp-06"
  numero: 6
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries numériques, séries de Riemann, relations de comparaison]
  noeuds: [as-series, tg-arctan]
  notions: [serie-riemann, arc-tangente, cosinus-sinus]
  source: "BibM@th, Séries numériques, exercices 34 et 37 ; Séries numériques (Sainte-Geneviève), exercice 69"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Télescopages.* Montrer la convergence et calculer la somme : 
    $$\text{(a) } \sum_{n=1}^{+\infty} \frac{1}{n(n + 1)(n + 2)} ; \qquad \text{(b) } \sum_{n=2}^{+\infty} \ln\Big(1 - \frac{1}{n^{2}}\Big) ; \qquad \text{(c) } \sum_{n=0}^{+\infty} \operatorname{Arctan}\frac{1}{n^{2} + n + 1} ;$$

    $$\text{(d) } \sum_{n=1}^{+\infty} \frac{1}{n(2n + 1)} ; \qquad \text{(e) } \sum_{n=1}^{+\infty} \frac{n}{2^{n}} \quad\text{et}\quad \sum_{n=1}^{+\infty} \frac{n^{2}}{2^{n}}.$$
     Pour (c), on calculera $\tan\big(\operatorname{Arctan}(n + 1) - \operatorname{Arctan} n\big)$. Pour (d), on exprimera la somme partielle à l'aide de $H_{2N+1}$ et de $H_{N}$, et l'on utilisera $H_{n} = \ln n + \gamma + o(1)$. Pour (e), on comparera $S$ et $\frac{1}{2}S$.
  corrige: |
    On fait apparaître une différence de termes consécutifs.

    (a) $\dfrac{1}{n(n + 1)(n + 2)} = \dfrac{1}{2}\Big(\dfrac{1}{n(n + 1)} - \dfrac{1}{(n + 1)(n + 2)}\Big)$, de somme $\dfrac{1}{2}\cdot\dfrac{1}{2}$.

    (b) $\ln\big(1 - \dfrac{1}{n^{2}}\big) = \ln\dfrac{n - 1}{n} + \ln\dfrac{n + 1}{n}$, d'où $\mathop{\displaystyle \sum_{n=2}^{N}} = \ln\dfrac{1}{N} + \ln\dfrac{N + 1}{2} = \ln\dfrac{N + 1}{2N} \to -\ln 2$.

    (c) $\tan\big(\operatorname{Arctan}(n + 1) - \operatorname{Arctan} n\big) = \dfrac{(n + 1) - n}{1 + n(n + 1)}$, et la différence est dans $]0, \dfrac{\pi}{2}[$ : elle vaut $\operatorname{Arctan}\dfrac{1}{n^{2} + n + 1}$. La somme partielle jusqu'à $N$ est $\operatorname{Arctan}(N + 1) \to \dfrac{\pi}{2}$.

    (d) $\dfrac{1}{n(2n + 1)} = \dfrac{1}{n} - \dfrac{2}{2n + 1} = 2\Big(\dfrac{1}{2n} - \dfrac{1}{2n + 1}\Big)$. Comme $\mathop{\displaystyle \sum_{n=1}^{N}}\big(\dfrac{1}{2n} + \dfrac{1}{2n + 1}\big) = H_{2N+1} - 1$ et $\mathop{\displaystyle \sum_{n=1}^{N}} \dfrac{1}{2n} = \dfrac{1}{2}H_{N}$, la somme partielle vaut $2\big(1 + H_{N} - H_{2N+1}\big)$. Or $H_{2N+1} - H_{N} = \ln\dfrac{2N + 1}{N} + o(1) \to \ln 2$.

    (e) La série $S = \mathop{\displaystyle \sum} \dfrac{n}{2^{n}}$ converge (règle de d'Alembert), et en décalant l'indice, 
    $$S - \frac{S}{2} = \sum_{n \geqslant 1} \frac{n}{2^{n}} - \sum_{n \geqslant 2} \frac{n - 1}{2^{n}} = \frac{1}{2} + \sum_{n \geqslant 2} \frac{1}{2^{n}} = 1.$$
     De même, $T = \mathop{\displaystyle \sum} \dfrac{n^{2}}{2^{n}}$ vérifie $T - \dfrac{T}{2} = \mathop{\displaystyle \sum_{n \geqslant 1}} \dfrac{2n - 1}{2^{n}} = 2S - 1 = 3$. 
    $$\boxed{\text{(a) } \frac{1}{4} ; \quad \text{(b) } -\ln 2 ; \quad \text{(c) } \frac{\pi}{2} ; \quad \text{(d) } 2 - 2\ln 2 ; \quad \text{(e) } 2 \text{ et } 6}$$
     *Piège.* La manipulation $S - \dfrac{S}{2}$ suppose la convergence établie au préalable : appliquée à $\mathop{\displaystyle \sum} 2^{n}$, elle « donnerait » $S = -1$.
- id: "mp-06-07"
  feuille: "f-mp-06"
  numero: 7
