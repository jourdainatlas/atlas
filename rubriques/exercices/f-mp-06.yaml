  noeuds: [as-series]
  notions: []
  source: "BibM@th, Séries numériques, exercice 6 ; Séries numériques et familles sommables (LLG), exercice 1 (3)"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Déterminer, selon la valeur du paramètre, la nature de la série de terme général : 
    $$\text{(a) } \frac{a^{n}\,n!}{n^{n}}, \ a > 0 ; \qquad \text{(b) } \frac{(n!)^{a}}{(2n)!}, \ a > 0 ; \qquad \text{(c) } \frac{x^{n}}{n^{2} + 1}, \ x \in \mathbb{C}.$$
     Dans le cas (a) avec $a = \mathrm{e}$, on montrera que la suite $(u_{n})$ est croissante, en utilisant l'inégalité $\big(1 + \frac{1}{n}\big)^{n} < \mathrm{e}$.
  corrige: |
    (a) $\dfrac{u_{n+1}}{u_{n}} = a\big(1 + \dfrac{1}{n}\big)^{-n} \to \dfrac{a}{\mathrm{e}}$ : convergence pour $a < \mathrm{e}$, divergence grossière pour $a > \mathrm{e}$. Pour $a = \mathrm{e}$, le rapport vaut $\dfrac{\mathrm{e}}{(1 + 1/n)^{n}} > 1$ : la suite positive $(u_{n})$ croît et ne tend pas vers $0$.

    (b) $\dfrac{u_{n+1}}{u_{n}} = \dfrac{(n + 1)^{a}}{(2n + 1)(2n + 2)}$ tend vers $0$ si $a < 2$, vers $\dfrac{1}{4}$ si $a = 2$, vers $+\infty$ si $a > 2$.

    (c) Si $|x| \leqslant 1$, $|u_{n}| \leqslant \dfrac{1}{n^{2} + 1}$ ; si $|x| > 1$, $|u_{n}| \to +\infty$. 
    $$\boxed{\text{(a) } a < \mathrm{e} ; \qquad \text{(b) } a \leqslant 2 ; \qquad \text{(c) } |x| \leqslant 1}$$
     *Piège.* Dans le cas limite (a) avec $a = \mathrm{e}$, la règle de d'Alembert ne conclut pas : c'est la position du rapport par rapport à $1$, et non sa limite, qui tranche ici. La formule de Stirling (exercices 27 et 51) donne d'ailleurs $u_{n} \sim \sqrt{2\pi n}$.
- id: "mp-06-25"
  feuille: "f-mp-06"
  numero: 25
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [compléments sur les séries, séries de Riemann, "règle de d'Alembert", relations de comparaison]
  noeuds: [as-series, as-dalembert-cauchy]
  notions: [serie-riemann, regle-dalembert]
  source: "Séries numériques (Sainte-Geneviève), exercice 49 ; BibM@th, Séries numériques, exercice 16"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Règle de Raabe-Duhamel.* Soit $(u_{n})$ une suite de réels strictement positifs, et $\alpha \in \mathbb{R}$ tel que 
    $$\frac{u_{n+1}}{u_{n}} = 1 - \frac{\alpha}{n} + O\Big(\frac{1}{n^{2}}\Big).$$

    **1.** On pose $v_{n} = \ln(n^{\alpha}u_{n})$. Montrer que $v_{n+1} - v_{n} = O\big(\frac{1}{n^{2}}\big)$, et en déduire qu'il existe $C > 0$ tel que $u_{n} \sim \dfrac{C}{n^{\alpha}}$.

    **2.** Préciser la nature de la série $\sum u_{n}$ selon $\alpha$. La règle de d'Alembert permettait-elle de conclure ?

    **3.** *Application.* Soit $u_{n} = \dbinom{2n}{n}\dfrac{1}{4^{n}}$. Montrer que $\sum u_{n}$ diverge et que $\sum \frac{u_{n}}{n}$ converge.
  corrige: |
    **1.** On compare $\ln u_{n}$ à $-\alpha\ln n$ : 
    $$v_{n+1} - v_{n} = \alpha\ln\Big(1 + \frac{1}{n}\Big) + \ln\frac{u_{n+1}}{u_{n}} = \frac{\alpha}{n} + O\Big(\frac{1}{n^{2}}\Big) - \frac{\alpha}{n} + O\Big(\frac{1}{n^{2}}\Big) = O\Big(\frac{1}{n^{2}}\Big).$$
     La série $\mathop{\displaystyle \sum} (v_{n+1} - v_{n})$ converge absolument : $(v_{n})$ converge vers un réel $\ell$, et $n^{\alpha}u_{n} \to \mathrm{e}^{\ell}$. 
    $$\boxed{u_{n} \sim \frac{C}{n^{\alpha}}, \qquad C = \mathrm{e}^{\ell} > 0}$$

    **2.** Par comparaison aux séries de Riemann, $\mathop{\displaystyle \sum} u_{n}$ converge si et seulement si $\alpha > 1$. Le rapport $\dfrac{u_{n+1}}{u_{n}}$ tend vers $1$ quel que soit $\alpha$ : la règle de d'Alembert ne conclut jamais.

    **3.** On calcule $\dfrac{u_{n+1}}{u_{n}} = \dfrac{(2n + 2)(2n + 1)}{4(n + 1)^{2}} = \dfrac{2n + 1}{2n + 2} = 1 - \dfrac{1}{2n} + O\big(\dfrac{1}{n^{2}}\big)$, donc $u_{n} \sim \dfrac{C}{\sqrt{n}}$ et $\dfrac{u_{n}}{n} \sim \dfrac{C}{n^{3/2}}$. 
    $$\boxed{\sum u_{n} \text{ diverge}, \qquad \sum \frac{u_{n}}{n} \text{ converge}}$$
     L'exercice 51 montre que $C = \dfrac{1}{\sqrt{\pi}}$.
- id: "mp-06-26"
  feuille: "f-mp-06"
  numero: 26
  partie: "Compléments sur les séries numériques"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [compléments sur les séries, relations de comparaison]
  noeuds: [as-series]
  notions: []
  source: "Séries numériques (Sainte-Geneviève), exercice 73 ; exercice composé pour la feuille"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Sommation des relations de comparaison.*

    **1.** Montrer que $\dfrac{2^{k+1}}{k + 1} - \dfrac{2^{k}}{k} \sim \dfrac{2^{k}}{k}$, et en déduire que $\sum_{k=1}^{n} \dfrac{2^{k}}{k} \sim \dfrac{2^{n+1}}{n}$.

    **2.** Montrer de même que $\sum_{k=1}^{n} \dfrac{\mathrm{e}^{\sqrt{k}}}{\sqrt{k}} \sim 2\mathrm{e}^{\sqrt{n}}$.

    **3.** Montrer que $\sum_{k=1}^{n} k! \sim n!$, en majorant les $n - 1$ premiers termes.
  corrige: |
    **1.** On calcule la différence : $\dfrac{2^{k+1}}{k + 1} - \dfrac{2^{k}}{k} = 2^{k}\dfrac{2k - (k + 1)}{k(k + 1)} = \dfrac{2^{k}(k - 1)}{k(k + 1)} \sim \dfrac{2^{k}}{k}$. La série $\mathop{\displaystyle \sum} \dfrac{2^{k}}{k}$, positive, diverge ; le théorème 3 (ii) et le télescopage donnent 
    $$\sum_{k=1}^{n} \frac{2^{k}}{k} \sim \sum_{k=1}^{n}\Big(\frac{2^{k+1}}{k + 1} - \frac{2^{k}}{k}\Big) = \frac{2^{n+1}}{n + 1} - 2.$$

    **2.** Avec $g(k) = 2\mathrm{e}^{\sqrt{k}}$ : $\sqrt{k + 1} - \sqrt{k} = \dfrac{1}{\sqrt{k + 1} + \sqrt{k}} \sim \dfrac{1}{2\sqrt{k}}$, donc 
    $$g(k + 1) - g(k) = 2\mathrm{e}^{\sqrt{k}}\big(\mathrm{e}^{\sqrt{k+1} - \sqrt{k}} - 1\big) \sim \frac{\mathrm{e}^{\sqrt{k}}}{\sqrt{k}},$$
     et $\mathop{\displaystyle \sum_{k=1}^{n}} \dfrac{\mathrm{e}^{\sqrt{k}}}{\sqrt{k}} \sim g(n + 1) - g(1) \sim 2\mathrm{e}^{\sqrt{n}}$, car $\sqrt{n + 1} - \sqrt{n} \to 0$.

    **3.** On isole les deux derniers termes : 
    $$0 \leqslant \sum_{k=1}^{n-2} k! \leqslant (n - 2)(n - 2)! \leqslant (n - 1)!, \qquad\text{d'où}\qquad n! \leqslant \sum_{k=1}^{n} k! \leqslant n! + 2(n - 1)!.$$

    $$\boxed{\sum_{k=1}^{n} \frac{2^{k}}{k} \sim \frac{2^{n+1}}{n}, \qquad \sum_{k=1}^{n} \frac{\mathrm{e}^{\sqrt{k}}}{\sqrt{k}} \sim 2\mathrm{e}^{\sqrt{n}}, \qquad \sum_{k=1}^{n} k! \sim n!}$$
     Dans les trois cas, la somme est équivalente à une primitive discrète du terme général : la méthode consiste à deviner une suite $g$ dont la différence est équivalente au terme sommé.
- id: "mp-06-27"
