  enonce: |
    Soit $(u_{n})$ une suite réelle décroissante telle que $u_{n} + u_{n+1} \sim \dfrac{1}{n}$. Montrer que $u_{n} \geqslant 0$ pour tout $n$, puis encadrer $2u_{n}$ par $u_{n} + u_{n+1}$ et $u_{n-1} + u_{n}$, et en déduire un équivalent de $u_{n}$.
  corrige: |
    La suite décroît, donc a une limite $\ell \in [-\infty, +\infty[$ ; comme $u_{n} + u_{n+1} \to 0$, $2\ell = 0$. Une suite décroissante de limite nulle est positive. Par décroissance, 
    $$u_{n} + u_{n+1} \leqslant 2u_{n} \leqslant u_{n-1} + u_{n},$$
     et les deux bornes sont équivalentes à $\dfrac{1}{n}$ et $\dfrac{1}{n - 1} \sim \dfrac{1}{n}$. 
    $$\boxed{u_{n} \sim \frac{1}{2n}}$$
     *Piège.* Sans la monotonie, la conclusion tombe : $u_{n} = \dfrac{1}{2n} + (-1)^{n}$ vérifie $u_{n} + u_{n+1} \sim \dfrac{1}{n}$.
- id: "mp-06-31"
  feuille: "f-mp-06"
  numero: 31
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [compléments sur les séries, séries de Riemann]
  noeuds: [as-series]
  notions: [serie-riemann]
  source: "Séries numériques (Sainte-Geneviève), exercice 45 ; Séries numériques et familles sommables (LLG), exercice 29 ; BibM@th, Séries numériques, exercice 14"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    *Condition d'Abel-Pringsheim.*

    **1.** Soit $(u_{n})$ une suite décroissante de réels positifs telle que $\sum u_{n}$ converge. En minorant $\sum_{k=n+1}^{2n} u_{k}$, montrer que $nu_{n} \xrightarrow[n \to +\infty]{} 0$.

    **2.** Montrer que le résultat tombe en défaut sans l'hypothèse de décroissance, en considérant la suite définie par $u_{n} = \frac{1}{n}$ si $n$ est un carré, et $u_{n} = \frac{1}{n^{2}}$ sinon.

    **3.** La condition $nu_{n} \to 0$ suffit-elle à assurer la convergence de $\sum u_{n}$, lorsque $(u_{n})$ est décroissante et positive ?
  corrige: |
    **1.** Par décroissance, 
    $$0 \leqslant nu_{2n} \leqslant \sum_{k=n+1}^{2n} u_{k} = S_{2n} - S_{n} \to 0.$$
     Donc $2nu_{2n} \to 0$, et $(2n + 1)u_{2n+1} \leqslant (2n + 1)u_{2n} \to 0$. 
    $$\boxed{nu_{n} \xrightarrow[n \to +\infty]{} 0}$$

    **2.** La série converge, car ses termes sont majorés par ceux de $\mathop{\displaystyle \sum_{k \geqslant 1}} \dfrac{1}{k^{2}} + \mathop{\displaystyle \sum_{n \geqslant 1}} \dfrac{1}{n^{2}}$ (les termes d'indice $k^{2}$ valent $\dfrac{1}{k^{2}}$). Mais $nu_{n} = 1$ pour $n = k^{2}$ : $(nu_{n})$ ne tend pas vers $0$.

    **3.** Non : $u_{n} = \dfrac{1}{n\ln n}$ est décroissante, $nu_{n} = \dfrac{1}{\ln n} \to 0$, et la série diverge (exercice 21). 
    $$\boxed{\text{La condition } nu_{n} \to 0 \text{ est nécessaire (sous monotonie), pas suffisante}}$$
