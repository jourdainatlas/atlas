  notions: [serie-absolument-convergente]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $A \in \mathcal{M}_{d}(\mathbb{K})$ telle que $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu| < 1$.

    **1.** Montrer que $|\mkern-1.5mu|\mkern-1.5mu|(I_{d} - A)^{-1}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \dfrac{1}{1 - |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|}$ et que $|\mkern-1.5mu|\mkern-1.5mu|(I_{d} - A)^{-1} - I_{d} - A|\mkern-1.5mu|\mkern-1.5mu| \leqslant \dfrac{|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|^{2}}{1 - |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|}$.

    **2.** En déduire que l'application $B \mapsto B^{-1}$ est continue en $I_{d}$, puis qu'elle est continue sur $\mathrm{GL}_{d}(\mathbb{K})$, en écrivant 
    $$B = B_{0}\big(I_{d} - B_{0}^{-1}(B_{0} - B)\big).$$

    **3.** Montrer que l'application $B \mapsto B^{-1}$ admet en $I_{d}$ le développement 
    $$(I_{d} + H)^{-1} = I_{d} - H + O\big(|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}\big).$$
  corrige: |
    On note $a = |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$.

    **1.** On majore la série de Neumann terme à terme (théorème 1) : 
    $$|\mkern-1.5mu|\mkern-1.5mu|(I_{d} - A)^{-1}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sum_{k=0}^{+\infty} a^{k} = \frac{1}{1 - a}, \qquad |\mkern-1.5mu|\mkern-1.5mu|(I_{d} - A)^{-1} - I_{d} - A|\mkern-1.5mu|\mkern-1.5mu| = |\mkern-1.5mu|\mkern-1.5mu|\sum_{k=2}^{+\infty} A^{k}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{a^{2}}{1 - a}.$$

    **2.** On commence par $B$ voisine de $I_{d}$. Si $|\mkern-1.5mu|\mkern-1.5mu|I_{d} - B|\mkern-1.5mu|\mkern-1.5mu| < 1$, on pose $A = I_{d} - B$ : 
    $$|\mkern-1.5mu|\mkern-1.5mu|B^{-1} - I_{d}|\mkern-1.5mu|\mkern-1.5mu| = |\mkern-1.5mu|\mkern-1.5mu|\sum_{k=1}^{+\infty} A^{k}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{|\mkern-1.5mu|\mkern-1.5mu|I_{d} - B|\mkern-1.5mu|\mkern-1.5mu|}{1 - |\mkern-1.5mu|\mkern-1.5mu|I_{d} - B|\mkern-1.5mu|\mkern-1.5mu|} \xrightarrow[B \to I_{d}]{} 0.$$
     Soit ensuite $B_{0} \in \mathrm{GL}_{d}(\mathbb{K})$ et $C = B_{0}^{-1}(B_{0} - B)$, de sorte que 
    $$B = B_{0}(I_{d} - C), \qquad |\mkern-1.5mu|\mkern-1.5mu|C|\mkern-1.5mu|\mkern-1.5mu| \leqslant |\mkern-1.5mu|\mkern-1.5mu|B_{0}^{-1}|\mkern-1.5mu|\mkern-1.5mu|\,|\mkern-1.5mu|\mkern-1.5mu|B_{0} - B|\mkern-1.5mu|\mkern-1.5mu|.$$
     Pour $B$ assez proche de $B_{0}$, on a $|\mkern-1.5mu|\mkern-1.5mu|C|\mkern-1.5mu|\mkern-1.5mu| < 1$ ; alors $B$ est inversible, d'inverse $(I_{d} - C)^{-1}B_{0}^{-1}$, qui tend vers $B_{0}^{-1}$ par le cas précédent et la continuité du produit. 
    $$\boxed{B \mapsto B^{-1} \text{ est continue sur l'ouvert } \mathrm{GL}_{d}(\mathbb{K})}$$

    **3.** On applique la question 1 à $A = -H$ : pour $|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu| \leqslant \dfrac{1}{2}$, 
    $$|\mkern-1.5mu|\mkern-1.5mu|(I_{d} + H)^{-1} - I_{d} + H|\mkern-1.5mu|\mkern-1.5mu| \leqslant \frac{|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}}{1 - |\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|} \leqslant 2|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}.$$

    $$\boxed{(I_{d} + H)^{-1} = I_{d} - H + O\big(|\mkern-1.5mu|\mkern-1.5mu|H|\mkern-1.5mu|\mkern-1.5mu|^{2}\big)}$$
     C'est l'analogue de $\dfrac{1}{1 + h} = 1 - h + O(h^{2})$ ; au chapitre 17, ce sera la différentielle de l'inversion en $I_{d}$, à savoir $H \mapsto -H$.
- id: "mp-06-17"
  feuille: "f-mp-06"
  numero: 17
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Soit $T \in \mathcal{M}_{n}(\mathbb{C})$ triangulaire supérieure, de coefficients diagonaux $t_{1}, \dots, t_{n}$. Montrer que $\exp(T)$ est triangulaire supérieure, de coefficients diagonaux $\mathrm{e}^{t_{1}}, \dots, \mathrm{e}^{t_{n}}$.

    **2.** Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ et $P \in \mathrm{GL}_{n}(\mathbb{C})$. Montrer que $\exp(PAP^{-1}) = P\exp(A)P^{-1}$.

    **3.** En déduire que $\det\big(\exp(A)\big) = \mathrm{e}^{\operatorname{tr} A}$, et que $\exp(A)$ est toujours inversible.
  corrige: |
    **1.** Un produit de matrices triangulaires supérieures est triangulaire supérieur, de diagonale le produit des diagonales : $T^{k}$ est triangulaire supérieure, de coefficients diagonaux $t_{i}^{k}$. L'ensemble $\mathcal{T}$ des matrices triangulaires supérieures est un sous-espace, fermé car de dimension finie ; il contient les sommes partielles, donc $\exp(T)$. Enfin, la forme linéaire $M \mapsto m_{i,i}$ commute avec la somme (proposition 1 (iii)) : $\exp(T)_{i,i} = \mathop{\displaystyle \sum_{k}} \dfrac{t_{i}^{k}}{k!}$. 
    $$\boxed{\exp(T) \in \mathcal{T}, \qquad \exp(T)_{i,i} = \mathrm{e}^{t_{i}}}$$

    **2.** On a $(PAP^{-1})^{k} = PA^{k}P^{-1}$, et l'application $M \mapsto PMP^{-1}$ est linéaire (proposition 1 (iii)). 
    $$\boxed{\exp(PAP^{-1}) = P\exp(A)P^{-1}}$$

    **3.** Toute matrice complexe est trigonalisable (chapitre 3) : $A = PTP^{-1}$, avec les valeurs propres $\lambda_{1}, \dots, \lambda_{n}$ sur la diagonale de $T$. Par les deux questions, 
    $$\det\big(\exp(A)\big) = \det\big(\exp(T)\big) = \prod_{i=1}^{n} \mathrm{e}^{\lambda_{i}} = \mathrm{e}^{\lambda_{1} + \cdots + \lambda_{n}} = \mathrm{e}^{\operatorname{tr} A}.$$

    $$\boxed{\det\big(\exp(A)\big) = \mathrm{e}^{\operatorname{tr} A} \neq 0}$$
     Pour une matrice réelle, on raisonne dans $\mathcal{M}_{n}(\mathbb{C})$ : $\exp(A)$ est la même, puisque les sommes partielles sont réelles.
- id: "mp-06-18"
  feuille: "f-mp-06"
  numero: 18
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercice 9"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $A \in \mathcal{M}_{d}(\mathbb{K})$. On pose $a = |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$.

    **1.** Montrer que, pour $0 \leqslant k \leqslant p$, on a $0 \leqslant \dfrac{1}{k!} - \dbinom{p}{k}\dfrac{1}{p^{k}} \leqslant \dfrac{1}{k!}$.

    **2.** En déduire que $\Big\|\exp(A) - \Big(I_{d} + \dfrac{A}{p}\Big)^{p}\Big\| \leqslant \mathrm{e}^{a} - \Big(1 + \dfrac{a}{p}\Big)^{p}$, pour la norme $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|$.

    **3.** Conclure que $\Big(I_{d} + \dfrac{A}{p}\Big)^{p} \xrightarrow[p \to +\infty]{} \exp(A)$.
  corrige: |
    **1.** On écrit le coefficient binomial comme un produit : 
    $$\binom{p}{k}\frac{1}{p^{k}} = \frac{1}{k!}\prod_{j=0}^{k-1}\Big(1 - \frac{j}{p}\Big) \in \Big[0, \frac{1}{k!}\Big].$$

    **2.** Par la formule du binôme, $\big(I_{d} + \dfrac{A}{p}\big)^{p} = \mathop{\displaystyle \sum_{k=0}^{p}} \dbinom{p}{k}\dfrac{A^{k}}{p^{k}}$. On pose $c_{k} = \dfrac{1}{k!} - \dbinom{p}{k}\dfrac{1}{p^{k}}$, avec $\dbinom{p}{k} = 0$ pour $k > p$ ; par la question 1, $c_{k} \geqslant 0$, et 
    $$|\mkern-1.5mu|\mkern-1.5mu|\exp(A) - \Big(I_{d} + \frac{A}{p}\Big)^{p}|\mkern-1.5mu|\mkern-1.5mu| = |\mkern-1.5mu|\mkern-1.5mu|\sum_{k=0}^{+\infty} c_{k}A^{k}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sum_{k=0}^{+\infty} c_{k}a^{k} = \mathrm{e}^{a} - \Big(1 + \frac{a}{p}\Big)^{p}.$$

    **3.** Pour un réel $a$, $\big(1 + \dfrac{a}{p}\big)^{p} = \exp\big(p\ln(1 + \dfrac{a}{p})\big) \to \mathrm{e}^{a}$ (chapitre 7 de MPSI). 
    $$\boxed{\Big(I_{d} + \frac{A}{p}\Big)^{p} \xrightarrow[p \to +\infty]{} \exp(A)}$$
     La positivité des $c_{k}$ est le point clé : elle permet de majorer la norme d'une différence matricielle par la même différence pour le réel $a$, sans aucun calcul de limite double.
- id: "mp-06-19"
  feuille: "f-mp-06"
  numero: 19
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle, pol-binome]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercice 17 (première partie) ; chapitre 20 de MPSI, produit de Cauchy"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $A$, $B \in \mathcal{M}_{d}(\mathbb{K})$.

    **1.** On suppose $AB = BA$. Montrer que, pour tous indices $(i, j)$, la famille $\Big(\dfrac{(A^{k}B^{\ell})_{i,j}}{k!\,\ell!}\Big)_{(k, \ell) \in \mathbb{N}^{2}}$ est sommable, puis, à l'aide de la formule du binôme et d'une sommation par paquets, que $\exp(A + B) = \exp(A)\exp(B)$.

    **2.** En déduire que $\exp(A)$ est inversible, d'inverse $\exp(-A)$, et retrouver le résultat de l'exercice 17.

    **3.** Pour $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$, calculer $\exp(A)\exp(B)$ et $\exp(A + B)$ ; on pourra utiliser l'exercice 11. Conclure.
  corrige: |
    **1.** On note $a = |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$, $b = |\mkern-1.5mu|\mkern-1.5mu|B|\mkern-1.5mu|\mkern-1.5mu|$. Les formes linéaires coordonnées sont continues sur $\mathcal{M}_{d}(\mathbb{K})$ : il existe $c > 0$ tel que $|m_{i,j}| \leqslant c|\mkern-1.5mu|\mkern-1.5mu|M|\mkern-1.5mu|\mkern-1.5mu|$ pour toute $M$. Ainsi 
    $$\frac{|(A^{k}B^{\ell})_{i,j}|}{k!\,\ell!} \leqslant c\frac{a^{k}}{k!}\frac{b^{\ell}}{\ell!},$$
     famille sommable de somme $c\,\mathrm{e}^{a+b}$ (théorème de Fubini positif, chapitre 20 de MPSI). On somme par paquets $\{k + \ell = n\}$ ; comme $A$ et $B$ commutent, la formule du binôme donne $\mathop{\displaystyle \sum_{k+\ell=n}} \dfrac{A^{k}B^{\ell}}{k!\,\ell!} = \dfrac{(A + B)^{n}}{n!}$. Le coefficient $(i, j)$ de $\exp(A + B)$ est donc la somme de la famille. On somme ensuite par paquets $\{k\}\times\mathbb{N}$ : par continuité de $M \mapsto A^{k}M$, $\mathop{\displaystyle \sum_{\ell}} \dfrac{(A^{k}B^{\ell})_{i,j}}{\ell!} = \big(A^{k}\exp(B)\big)_{i,j}$, puis, par continuité de $M \mapsto M\exp(B)$, $\mathop{\displaystyle \sum_{k}} \dfrac{1}{k!}\big(A^{k}\exp(B)\big)_{i,j} = \big(\exp(A)\exp(B)\big)_{i,j}$. 
    $$\boxed{AB = BA \implies \exp(A + B) = \exp(A)\exp(B)}$$

    **2.** Les matrices $A$ et $-A$ commutent : $\exp(A)\exp(-A) = \exp(0) = I_{d}$. 
    $$\boxed{\exp(A) \in \mathrm{GL}_{d}(\mathbb{K}), \qquad \exp(A)^{-1} = \exp(-A)}$$
     On retrouve l'inversibilité obtenue à l'exercice 17 par le déterminant, sans trigonalisation.

    **3.** Comme $A^{2} = B^{2} = 0$, $\exp(A) = I_{2} + A$ et $\exp(B) = I_{2} + B$. Comme $(A + B)^{2} = I_{2}$, l'exercice 11 (b) donne $\exp(A + B)$. 
    $$\boxed{\exp(A)\exp(B) = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}, \qquad \exp(A + B) = \begin{pmatrix} \operatorname{ch} 1 & \operatorname{sh} 1 \\ \operatorname{sh} 1 & \operatorname{ch} 1 \end{pmatrix}}$$
     Les deux matrices diffèrent, puisque $\operatorname{ch} 1 \approx 1{,}543 \neq 2$ : ici $AB = \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix} \neq BA = \begin{pmatrix} 0 & 0 \\ 0 & 1 \end{pmatrix}$.

    *Piège.* La formule $\exp(A + B) = \exp(A)\exp(B)$ est l'erreur la plus répandue sur l'exponentielle de matrices : sans commutation, le binôme de Newton est faux, et la formule aussi.
- id: "mp-06-20"
  feuille: "f-mp-06"
  numero: 20
  partie: "Compléments sur les séries numériques"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [compléments sur les séries, comparaison série-intégrale, relations de comparaison]
  noeuds: [as-series, ri-integrable]
  notions: []
  source: "BibM@th, Séries numériques, exercices 26, 27 et 28"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    *Comparaison série-intégrale.* Établir, par un encadrement par des intégrales, les équivalents suivants quand $n \to +\infty$ : 
    $$\text{(a) } \sum_{k=1}^{n} \frac{1}{\sqrt{k}} \sim 2\sqrt{n} ; \qquad \text{(b) } \sum_{k=1}^{n} \ln k \sim n\ln n ; \qquad \text{(c) } \sum_{k=n+1}^{+\infty} \frac{1}{k^{3}} \sim \frac{1}{2n^{2}} ;$$

    $$\text{(d) } \sum_{k=1}^{n} k^{\alpha} \sim \frac{n^{\alpha+1}}{\alpha + 1} \ (\alpha > 0) ; \qquad \text{(e) } \sum_{k=n+1}^{+\infty} \frac{1}{k^{\alpha}} \sim \frac{1}{(\alpha - 1)n^{\alpha - 1}} \ (\alpha > 1).$$
     Dans le cas (d), la fonction est croissante : on adaptera l'encadrement du cours.
  corrige: |
    On applique l'encadrement de la proposition 3 ; pour une fonction croissante, les inégalités sont renversées.

    (a) $t \mapsto \dfrac{1}{\sqrt{t}}$ décroît : $\mathop{\displaystyle \int_{1}^{n+1}} \dfrac{\mathrm{d} t}{\sqrt{t}} \leqslant \mathop{\displaystyle \sum_{k=1}^{n}} \dfrac{1}{\sqrt{k}} \leqslant 1 + \mathop{\displaystyle \int_{1}^{n}} \dfrac{\mathrm{d} t}{\sqrt{t}}$, soit $2\sqrt{n + 1} - 2 \leqslant S_{n} \leqslant 2\sqrt{n} - 1$.

    (b) $\ln$ croît : $\mathop{\displaystyle \int_{1}^{n}} \ln t\,\mathrm{d} t \leqslant \mathop{\displaystyle \sum_{k=2}^{n}} \ln k \leqslant \mathop{\displaystyle \int_{2}^{n+1}} \ln t\,\mathrm{d} t$, soit $n\ln n - n + 1 \leqslant \ln(n!) \leqslant (n + 1)\ln(n + 1) - n$.

    (c) $\mathop{\displaystyle \int_{n+1}^{+\infty}} \dfrac{\mathrm{d} t}{t^{3}} \leqslant \mathop{\displaystyle \sum_{k > n}} \dfrac{1}{k^{3}} \leqslant \mathop{\displaystyle \int_{n}^{+\infty}} \dfrac{\mathrm{d} t}{t^{3}}$, soit $\dfrac{1}{2(n + 1)^{2}} \leqslant R_{n} \leqslant \dfrac{1}{2n^{2}}$.

    (d) $t \mapsto t^{\alpha}$ croît : $\mathop{\displaystyle \int_{0}^{n}} t^{\alpha}\,\mathrm{d} t \leqslant \mathop{\displaystyle \sum_{k=1}^{n}} k^{\alpha} \leqslant \mathop{\displaystyle \int_{1}^{n+1}} t^{\alpha}\,\mathrm{d} t$, soit $\dfrac{n^{\alpha+1}}{\alpha + 1} \leqslant S_{n} \leqslant \dfrac{(n + 1)^{\alpha+1} - 1}{\alpha + 1}$.

    (e) $\dfrac{1}{(\alpha - 1)(n + 1)^{\alpha - 1}} \leqslant \mathop{\displaystyle \sum_{k > n}} \dfrac{1}{k^{\alpha}} \leqslant \dfrac{1}{(\alpha - 1)n^{\alpha - 1}}$.

    Dans chaque cas, les deux bornes sont équivalentes, ce qui donne les équivalents annoncés. 
    $$\boxed{2\sqrt{n}, \quad n\ln n, \quad \frac{1}{2n^{2}}, \quad \frac{n^{\alpha+1}}{\alpha + 1}, \quad \frac{1}{(\alpha - 1)n^{\alpha - 1}}}$$
- id: "mp-06-21"
  feuille: "f-mp-06"
  numero: 21
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [compléments sur les séries, séries de Riemann, relations de comparaison]
  noeuds: [as-series]
  notions: [serie-riemann]
  source: "BibM@th, Séries numériques, exercice 29 ; Séries numériques (Sainte-Geneviève), exercice 51"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Séries de Bertrand.* Soit $a$, $b \in \mathbb{R}$. On étudie la série de terme général $u_{n} = \dfrac{1}{n^{a}(\ln n)^{b}}$, pour $n \geqslant 2$.

    **1.** On suppose $a > 1$. En comparant $u_{n}$ à $\frac{1}{n^{c}}$ pour un réel $c \in \, ]1, a[$, montrer que la série converge.

    **2.** On suppose $a < 1$. Montrer que la série diverge.

    **3.** On suppose $a = 1$. À l'aide de la fonction $t \mapsto \frac{1}{t(\ln t)^{b}}$, montrer que la série converge si et seulement si $b > 1$. Pour $b = 1$, donner un équivalent des sommes partielles ; pour $b > 1$, un équivalent du reste.
  corrige: |
    **1.** On compare à une série de Riemann d'exposant intermédiaire : $n^{c}u_{n} = \dfrac{n^{c-a}}{(\ln n)^{b}} \to 0$ car $c - a < 0$, donc $u_{n} \leqslant \dfrac{1}{n^{c}}$ pour $n$ grand.

    **2.** De même, $nu_{n} = \dfrac{n^{1-a}}{(\ln n)^{b}} \to +\infty$, donc $u_{n} \geqslant \dfrac{1}{n}$ pour $n$ grand.

    **3.** On distingue selon le signe de $b$. Si $b \leqslant 0$, $u_{n} \geqslant \dfrac{1}{n}$ pour $n \geqslant 3$. Si $b > 0$, $f : t \mapsto \dfrac{1}{t(\ln t)^{b}}$ est positive et décroissante sur $[2, +\infty[$, de primitive $\dfrac{(\ln t)^{1-b}}{1 - b}$ si $b \neq 1$ et $\ln\ln t$ si $b = 1$. Cette primitive a une limite finie en $+\infty$ si et seulement si $b > 1$ (proposition 3). L'encadrement donne alors 
    $$\boxed{\sum_{k=2}^{n} \frac{1}{k\ln k} \sim \ln\ln n, \qquad \sum_{k > n} \frac{1}{k(\ln k)^{b}} \sim \frac{1}{(b - 1)(\ln n)^{b-1}} \ (b > 1)}$$
     puisque $\ln(n + 1) \sim \ln n$. 
    $$\boxed{\sum \frac{1}{n^{a}(\ln n)^{b}} \text{ converge} \iff a > 1, \text{ ou } a = 1 \text{ et } b > 1}$$
- id: "mp-06-22"
  feuille: "f-mp-06"
  numero: 22
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [compléments sur les séries, comparaison série-intégrale]
  noeuds: [as-series, ri-integrable, tg-arctan]
  notions: [arc-tangente, cosinus-sinus]
  source: "BibM@th, Séries numériques, exercice 31"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Pour $a > 0$, on pose $S(a) = \sum_{n=1}^{+\infty} \dfrac{a}{n^{2} + a^{2}}$. Justifier l'existence de $S(a)$, puis montrer, par une comparaison série-intégrale, que 
    $$\frac{\pi}{2} - \operatorname{Arctan}\frac{1}{a} \leqslant S(a) \leqslant \frac{\pi}{2}.$$
     En déduire la limite de $S(a)$ quand $a \to +\infty$. Que vaut la limite quand $a \to 0^{+}$ ?
  corrige: |
    On a $0 < \dfrac{a}{n^{2} + a^{2}} \leqslant \dfrac{a}{n^{2}}$ : la série converge. La fonction $f : t \mapsto \dfrac{a}{t^{2} + a^{2}}$ décroît sur $[0, +\infty[$, de primitive $\operatorname{Arctan}\dfrac{t}{a}$. En sommant l'encadrement de la proposition 3 pour $n \geqslant 1$, 
    $$\int_{1}^{+\infty} f = \frac{\pi}{2} - \operatorname{Arctan}\frac{1}{a} \leqslant S(a) \leqslant \int_{0}^{+\infty} f = \frac{\pi}{2}.$$
     Quand $a \to +\infty$, $\operatorname{Arctan}\dfrac{1}{a} \to 0$ ; quand $a \to 0^{+}$, $S(a) \leqslant a\mathop{\displaystyle \sum} \dfrac{1}{n^{2}} = \dfrac{a\pi^{2}}{6}$. 
    $$\boxed{\lim_{a \to +\infty} S(a) = \frac{\pi}{2}, \qquad \lim_{a \to 0^{+}} S(a) = 0}$$
     La série est une somme de Riemann de pas $\dfrac{1}{a}$ pour la fonction $x \mapsto \dfrac{1}{1 + x^{2}}$ : $S(a) = \dfrac{1}{a}\mathop{\displaystyle \sum} \dfrac{1}{1 + (n/a)^{2}}$. La limite en $+\infty$ est donc l'intégrale de cette fonction sur $[0, +\infty[$, qui annonce les intégrales généralisées du chapitre 12.
- id: "mp-06-23"
  feuille: "f-mp-06"
  numero: 23
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [compléments sur les séries, comparaison série-intégrale, relations de comparaison]
  noeuds: [as-series, ri-integrable]
  notions: []
  source: "BibM@th, Séries numériques, exercice 30 ; Séries numériques (Sainte-Geneviève), exercice 58 (ii)"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On pose $S_{n} = \sum_{k=1}^{n} (\ln k)^{2}$.

    **1.** Calculer $\int_{1}^{x} (\ln t)^{2}\,\mathrm{d} t$, et montrer que $S_{n} \sim n(\ln n)^{2}$.

    **2.** En déduire la nature de la série $\sum_{n \geqslant 2} \frac{1}{S_{n}}$.
  corrige: |
    **1.** Deux intégrations par parties donnent 
    $$\int_{1}^{x} (\ln t)^{2}\,\mathrm{d} t = x(\ln x)^{2} - 2x\ln x + 2x - 2.$$
     Comme $(\ln)^{2}$ croît sur $[1, +\infty[$, $\mathop{\displaystyle \int_{1}^{n}} (\ln t)^{2}\,\mathrm{d} t \leqslant S_{n} \leqslant \mathop{\displaystyle \int_{1}^{n+1}} (\ln t)^{2}\,\mathrm{d} t$, et les deux bornes sont équivalentes à $n(\ln n)^{2}$. 
    $$\boxed{S_{n} \sim n(\ln n)^{2}}$$

    **2.** Par suite $\dfrac{1}{S_{n}} \sim \dfrac{1}{n(\ln n)^{2}}$, terme d'une série de Bertrand convergente (exercice 21, $a = 1$, $b = 2$). 
    $$\boxed{\sum \frac{1}{S_{n}} \text{ converge}}$$
- id: "mp-06-24"
  feuille: "f-mp-06"
  numero: 24
  partie: "Compléments sur les séries numériques"
