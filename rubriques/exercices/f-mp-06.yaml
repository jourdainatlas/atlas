  enonce: |
    **1.** À l'aide de l'inégalité de Taylor-Lagrange appliquée à $t \mapsto \mathrm{e}^{\mathrm{i} t}$, montrer que, pour $x \in \mathbb{R}$, 
    $$\Big|\mathrm{e}^{\mathrm{i} x} - \sum_{k=0}^{n} \frac{(\mathrm{i} x)^{k}}{k!}\Big| \leqslant \frac{|x|^{n+1}}{(n + 1)!}.$$
     En déduire que $\big|\cos x - 1 + \frac{x^{2}}{2}\big| \leqslant \frac{x^{4}}{24}$.

    **2.** Quel rang $n$ suffit pour obtenir $\mathrm{e}^{\mathrm{i}}$ à $10^{-6}$ près ?

    **3.** Soit $A \in \mathcal{M}_{d}(\mathbb{K})$ et $a = |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$. Montrer que $\Big\|\exp(A) - \displaystyle\sum_{k=0}^{N} \frac{A^{k}}{k!}\Big\| \leqslant \dfrac{a^{N+1}}{(N + 1)!}\,\mathrm{e}^{a}$ pour la norme $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|$, en majorant directement le reste de la série.
  corrige: |
    **1.** La fonction $f : t \mapsto \mathrm{e}^{\mathrm{i} t}$ est de classe $\mathcal{C}^{\infty}$, avec $f^{(k)}(t) = \mathrm{i}^{k}\mathrm{e}^{\mathrm{i} t}$, de module $1$. L'inégalité de Taylor-Lagrange entre $0$ et $x$, avec $M = 1$, donne l'inégalité demandée. Pour $n = 3$, la partie réelle de $\mathop{\displaystyle \sum_{k=0}^{3}} \dfrac{(\mathrm{i} x)^{k}}{k!}$ est $1 - \dfrac{x^{2}}{2}$, et le module d'un complexe majore celui de sa partie réelle. 
    $$\boxed{\Big|\cos x - 1 + \frac{x^{2}}{2}\Big| \leqslant \frac{x^{4}}{24}}$$

    **2.** Il faut $\dfrac{1}{(n + 1)!} \leqslant 10^{-6}$. Or $9! = 362\,880$ et $10! = 3\,628\,800$. 
    $$\boxed{n = 9}$$

    **3.** On majore le reste terme à terme (théorème 1) : 
    $$|\mkern-1.5mu|\mkern-1.5mu|\sum_{k > N} \frac{A^{k}}{k!}|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sum_{j=0}^{+\infty} \frac{a^{N+1+j}}{(N + 1 + j)!} \leqslant \frac{a^{N+1}}{(N + 1)!}\sum_{j=0}^{+\infty} \frac{a^{j}}{j!} = \frac{a^{N+1}}{(N + 1)!}\mathrm{e}^{a},$$
     car $(N + 1 + j)! \geqslant (N + 1)!\,j!$.
- id: "mp-06-47"
  feuille: "f-mp-06"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
