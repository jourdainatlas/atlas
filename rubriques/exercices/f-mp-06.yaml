  page_corrige: 24
  enonce: |
    *La constante de Stirling.* On pose $W_{n} = \displaystyle\int_{0}^{\pi/2} \cos^{n}t\,\mathrm{d} t$.

    **1.** Montrer, par une intégration par parties, que $(n + 2)W_{n+2} = (n + 1)W_{n}$. En déduire que $W_{2n} = \dbinom{2n}{n}\dfrac{\pi}{2^{2n+1}}$, et que $(n + 1)W_{n+1}W_{n} = \frac{\pi}{2}$.

    **2.** Montrer que $(W_{n})$ est décroissante et que $W_{n+1} \sim W_{n}$. En déduire $W_{n} \sim \sqrt{\dfrac{\pi}{2n}}$.

    **3.** En déduire $\dbinom{2n}{n}\dfrac{1}{4^{n}} \sim \dfrac{1}{\sqrt{\pi n}}$, ce qui précise l'exercice 25.

    **4.** À l'aide de l'exercice 27, exprimer $\dbinom{2n}{n}\frac{1}{4^{n}}$ en fonction de $\mathrm{e}^{C}$, et conclure que $n! \sim \sqrt{2\pi n}\Big(\dfrac{n}{\mathrm{e}}\Big)^{n}$.
  corrige: |
    **1.** On intègre par parties dans $W_{n+2} = \mathop{\displaystyle \int_{0}^{\pi/2}} \cos^{n+1}t\cos t\,\mathrm{d} t$ : 
    $$W_{n+2} = \big[\cos^{n+1}t\sin t\big]_{0}^{\pi/2} + (n + 1)\int_{0}^{\pi/2} \cos^{n}t\sin^{2}t\,\mathrm{d} t = (n + 1)(W_{n} - W_{n+2}).$$
     Avec $W_{0} = \dfrac{\pi}{2}$, on obtient 
    $$W_{2n} = \prod_{k=1}^{n} \frac{2k - 1}{2k}\cdot\frac{\pi}{2} = \frac{(2n)!}{(2^{n}n!)^{2}}\cdot\frac{\pi}{2}.$$
     Enfin, $v_{n} = (n + 1)W_{n+1}W_{n}$ vérifie 
    $$v_{n+1} = (n + 2)W_{n+2}W_{n+1} = (n + 1)W_{n}W_{n+1} = v_{n}, \qquad v_{0} = W_{1}W_{0} = \frac{\pi}{2}.$$

    $$\boxed{(n + 2)W_{n+2} = (n + 1)W_{n}, \qquad W_{2n} = \binom{2n}{n}\frac{\pi}{2^{2n+1}}, \qquad (n + 1)W_{n+1}W_{n} = \frac{\pi}{2}}$$

    **2.** Sur $[0, \dfrac{\pi}{2}]$, $0 \leqslant \cos^{n+1} \leqslant \cos^{n}$ : $(W_{n})$ décroît, et elle est strictement positive. Ainsi 
    $$\frac{n + 1}{n + 2} = \frac{W_{n+2}}{W_{n}} \leqslant \frac{W_{n+1}}{W_{n}} \leqslant 1,$$
     donc $W_{n+1} \sim W_{n}$. Alors $W_{n}^{2} \sim W_{n+1}W_{n} = \dfrac{\pi}{2(n + 1)} \sim \dfrac{\pi}{2n}$. 
    $$\boxed{W_{n} \sim \sqrt{\frac{\pi}{2n}}}$$

    **3.** Par les questions 1 et 2, $\dbinom{2n}{n}\dfrac{1}{4^{n}} = \dfrac{2}{\pi}W_{2n} \sim \dfrac{2}{\pi}\sqrt{\dfrac{\pi}{4n}}$. 
    $$\boxed{\binom{2n}{n}\frac{1}{4^{n}} \sim \frac{1}{\sqrt{\pi n}}}$$
     La constante $C$ de l'exercice 25 vaut donc $\dfrac{1}{\sqrt{\pi}}$.

    **4.** L'exercice 27 donne $(2n)! \sim \mathrm{e}^{C}\sqrt{2n}\big(\dfrac{2n}{\mathrm{e}}\big)^{2n}$ et $(n!)^{2} \sim \mathrm{e}^{2C}n\big(\dfrac{n}{\mathrm{e}}\big)^{2n}$, d'où $\dbinom{2n}{n}\dfrac{1}{4^{n}} \sim \dfrac{\sqrt{2}}{\mathrm{e}^{C}\sqrt{n}}$. En comparant avec la question 3, $\mathrm{e}^{C} = \sqrt{2\pi}$. 
    $$\boxed{n! \sim \sqrt{2\pi n}\Big(\frac{n}{\mathrm{e}}\Big)^{n}}$$
     Pour $n = 10$, la formule donne $3\,598\,696$ au lieu de $10! = 3\,628\,800$, soit une erreur relative de $0{,}83\,\%$, proche de $\dfrac{1}{12n}$ (exercice 27).
