  enonce: |
    *La série des inverses des nombres premiers.* Soit $N \geqslant 2$, et $p_{1} < \cdots < p_{r}$ les nombres premiers inférieurs ou égaux à $N$.

    **1.** Soit $m$ tel que $2^{m} > N$. Montrer, par la décomposition en facteurs premiers, que 
    $$\prod_{i=1}^{r} \Big(1 + \frac{1}{p_{i}} + \frac{1}{p_{i}^{2}} + \cdots + \frac{1}{p_{i}^{m}}\Big) \geqslant H_{N}, \qquad\text{puis}\qquad \prod_{i=1}^{r} \Big(1 - \frac{1}{p_{i}}\Big)^{-1} \geqslant \ln N.$$

    **2.** Montrer que $-\ln(1 - x) \leqslant x + x^{2}$ pour $x \in [0, \frac{1}{2}]$.

    **3.** En déduire que $\displaystyle\sum_{p \leqslant N} \frac{1}{p} \geqslant \ln\ln N - \Big(\frac{\pi^{2}}{6} - 1\Big)$, où la somme porte sur les nombres premiers, et conclure que la série des inverses des nombres premiers diverge.
  corrige: |
    **1.** En développant le produit, on obtient la somme des $\dfrac{1}{p_{1}^{e_{1}}\cdots p_{r}^{e_{r}}}$ pour $0 \leqslant e_{i} \leqslant m$. Tout entier $k \leqslant N$ s'écrit ainsi, de façon unique : ses facteurs premiers sont $\leqslant N$, et leurs exposants vérifient $2^{e_{i}} \leqslant p_{i}^{e_{i}} \leqslant N < 2^{m}$. Le produit majore donc $H_{N}$. Chaque facteur est majoré par $\mathop{\displaystyle \sum_{j \geqslant 0}} p_{i}^{-j} = \big(1 - \dfrac{1}{p_{i}}\big)^{-1}$, et $H_{N} \geqslant \mathop{\displaystyle \int_{1}^{N+1}} \dfrac{\mathrm{d} t}{t} > \ln N$.

    **2.** La fonction $g(x) = x + x^{2} + \ln(1 - x)$ vérifie $g(0) = 0$ et $g'(x) = 1 + 2x - \dfrac{1}{1 - x} = \dfrac{x(1 - 2x)}{1 - x} \geqslant 0$ sur $[0, \dfrac{1}{2}]$.

    **3.** On prend le logarithme de la question 1 et l'on applique la question 2 avec $x = \dfrac{1}{p} \leqslant \dfrac{1}{2}$ : 
    $$\ln\ln N \leqslant \sum_{p \leqslant N} -\ln\Big(1 - \frac{1}{p}\Big) \leqslant \sum_{p \leqslant N} \frac{1}{p} + \sum_{p \leqslant N} \frac{1}{p^{2}} \leqslant \sum_{p \leqslant N} \frac{1}{p} + \Big(\frac{\pi^{2}}{6} - 1\Big).$$

    $$\boxed{\sum_{p \leqslant N} \frac{1}{p} \geqslant \ln\ln N - \Big(\frac{\pi^{2}}{6} - 1\Big) \to +\infty}$$
     Le résultat, dû à Euler, est plus fort que l'infinitude des nombres premiers : ils ne sont pas trop rares, contrairement aux carrés, dont la série des inverses converge.
