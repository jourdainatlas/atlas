  page_corrige: 25
  enonce: |
    *Un nombre de Pisot.* On pose $a = 2 + \sqrt{3}$, $b = 2 - \sqrt{3}$ et $s_{n} = a^{n} + b^{n}$.

    **1.** Montrer que $s_{n+2} = 4s_{n+1} - s_{n}$, et en déduire que $s_{n}$ est un entier pair.

    **2.** En déduire que $\sin(\pi a^{n}) = -\sin(\pi b^{n})$, puis la nature de la série $\sum \sin(\pi a^{n})$.

    **3.** Montrer que la partie fractionnaire de $a^{n}$ tend vers $1$ : les puissances de $a$ s'approchent des entiers, par valeurs inférieures. Vérifier numériquement que $a^{5} \approx 723{,}998\,6$.
  corrige: |
    **1.** Les réels $a$ et $b$ sont les racines de $X^{2} - 4X + 1$, donc $a^{n+2} = 4a^{n+1} - a^{n}$, et de même pour $b$. Comme $s_{0} = 2$ et $s_{1} = 4$, une récurrence montre que $s_{n}$ est un entier pair.

    **2.** On écrit $a^{n} = s_{n} - b^{n}$, avec $s_{n} = 2m$ : 
    $$\sin(\pi a^{n}) = \sin(2m\pi - \pi b^{n}) = -\sin(\pi b^{n}), \qquad |\sin(\pi a^{n})| \leqslant \pi b^{n}.$$
     Comme $0 < b = 2 - \sqrt{3} \approx 0{,}268 < 1$, la série est dominée par une série géométrique convergente. 
    $$\boxed{\sum \sin(\pi a^{n}) \text{ converge absolument}}$$

    **3.** Pour $n \geqslant 1$, $0 < b^{n} < 1$, donc $\lfloor a^{n} \rfloor = s_{n} - 1$ et la partie fractionnaire de $a^{n}$ vaut $1 - b^{n} \to 1$. Les premiers termes $s_{2} = 14$, $s_{3} = 52$, $s_{4} = 194$, $s_{5} = 724$ donnent $a^{5} = 724 - b^{5} \approx 723{,}998\,6$. 
    $$\boxed{a^{n} = s_{n} - b^{n}, \text{ à distance } b^{n} \text{ de l'entier } s_{n}}$$
     Un nombre de Pisot est un entier algébrique $> 1$ dont les autres conjugués sont de module $< 1$ ; ses puissances s'approchent exponentiellement des entiers, ce qui explique la convergence.
- id: "mp-06-53"
