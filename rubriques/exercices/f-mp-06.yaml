  enonce: |
    *Formule de Stirling, à une constante près.* On pose $w_{n} = \ln(n!) - \big(n + \frac{1}{2}\big)\ln n + n$ pour $n \geqslant 1$.

    **1.** Montrer que $w_{n} - w_{n-1} = \big(n - \frac{1}{2}\big)\ln\big(1 - \frac{1}{n}\big) + 1 = -\dfrac{1}{12n^{2}} + O\Big(\dfrac{1}{n^{3}}\Big)$.

    **2.** En déduire que $(w_{n})$ converge vers un réel $C$, puis, par sommation des restes, que 
    $$w_{n} = C + \frac{1}{12n} + o\Big(\frac{1}{n}\Big).$$

    **3.** Conclure que $n! \sim \mathrm{e}^{C}\sqrt{n}\Big(\dfrac{n}{\mathrm{e}}\Big)^{n}$. L'exercice 51 montrera que $\mathrm{e}^{C} = \sqrt{2\pi}$.
  corrige: |
    **1.** Comme $\ln(n!) - \ln((n - 1)!) = \ln n$, 
    $$w_{n} - w_{n-1} = \ln n - \Big(n + \frac{1}{2}\Big)\ln n + \Big(n - \frac{1}{2}\Big)\ln(n - 1) + 1 = \Big(n - \frac{1}{2}\Big)\ln\Big(1 - \frac{1}{n}\Big) + 1.$$
     Avec $\ln(1 - h) = -h - \dfrac{h^{2}}{2} - \dfrac{h^{3}}{3} + O(h^{4})$ et $h = \dfrac{1}{n}$ : 
    $$\Big(n - \frac{1}{2}\Big)\ln\Big(1 - \frac{1}{n}\Big) = -1 - \frac{1}{2n} - \frac{1}{3n^{2}} + \frac{1}{2n} + \frac{1}{4n^{2}} + O\Big(\frac{1}{n^{3}}\Big) = -1 - \frac{1}{12n^{2}} + O\Big(\frac{1}{n^{3}}\Big).$$

    **2.** La série télescopique converge absolument : $(w_{n})$ a une limite $C$. Par le théorème 3 (i) et l'exercice 20 (e), 
    $$C - w_{n} = \sum_{k > n} (w_{k} - w_{k-1}) \sim -\frac{1}{12}\sum_{k > n} \frac{1}{k^{2}} \sim -\frac{1}{12n}.$$

    $$\boxed{w_{n} = C + \frac{1}{12n} + o\Big(\frac{1}{n}\Big)}$$

    **3.** On exponentie : $n! = \mathrm{e}^{w_{n}}n^{n + 1/2}\mathrm{e}^{-n}$ et $\mathrm{e}^{w_{n}} \to \mathrm{e}^{C}$. 
    $$\boxed{n! \sim \mathrm{e}^{C}\sqrt{n}\Big(\frac{n}{\mathrm{e}}\Big)^{n}}$$
     Le terme $\dfrac{1}{12n}$ est le début de la série de Stirling : $n! = \sqrt{2\pi n}\,(n/\mathrm{e})^{n}\big(1 + \dfrac{1}{12n} + o(\dfrac{1}{n})\big)$.
- id: "mp-06-28"
