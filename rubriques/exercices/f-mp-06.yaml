  enonce: |
    *Une réciproque du théorème de Cesàro.* Soit $(u_{n})_{n \geqslant 1}$ une suite réelle. On note $\sigma_{n} = \frac{1}{n}(u_{1} + \cdots + u_{n})$. On suppose que $\sigma_{n} \to \ell \in \mathbb{R}$ et qu'il existe $M > 0$ tel que $|u_{n} - u_{n-1}| \leqslant \frac{M}{n}$ pour tout $n \geqslant 2$. On veut montrer que $u_{n} \to \ell$.

    **1.** Pour $1 \leqslant n < m$, établir l'identité 
    $$\frac{1}{m - n}\sum_{k=n+1}^{m} u_{k} = \sigma_{m} + \frac{n}{m - n}(\sigma_{m} - \sigma_{n}).$$

    **2.** Montrer que $|u_{k} - u_{n}| \leqslant M\frac{m - n}{n}$ pour $n < k \leqslant m$.

    **3.** Soit $\varepsilon \in \, ]0, 1]$. On pose $m_{n} = n + \lfloor \varepsilon n \rfloor$. Montrer que, pour $n$ assez grand, 
    $$|u_{n} - \ell| \leqslant M\varepsilon + |\sigma_{m_{n}} - \ell| + \frac{2}{\varepsilon}|\sigma_{m_{n}} - \sigma_{n}|,$$
     et conclure.

    **4.** Montrer par un exemple que l'hypothèse sur $u_{n} - u_{n-1}$ ne peut pas être supprimée.

    **5.** *Application.* Soit $u_{n} = \sin(\ln n)$. Montrer que $|u_{n} - u_{n-1}| \leqslant \frac{1}{n - 1}$, puis que $(u_{n})$ diverge, en utilisant que $\ln(n + 1) - \ln n \to 0$ et $\ln n \to +\infty$. En déduire que la suite des moyennes $(\sigma_{n})$ diverge, bien que $(u_{n})$ soit bornée. Montrer enfin, par une comparaison avec $\frac{1}{n}\int_{1}^{n} \sin(\ln t)\,\mathrm{d} t$, que $\sigma_{n} - \frac{1}{2}\big(\sin(\ln n) - \cos(\ln n)\big) \to 0$.
  corrige: |
    **1.** On a $\mathop{\displaystyle \sum_{k=n+1}^{m}} u_{k} = m\sigma_{m} - n\sigma_{n} = (m - n)\sigma_{m} + n(\sigma_{m} - \sigma_{n})$, et l'on divise par $m - n$.

    **2.** On télescope : pour $n < k \leqslant m$, $|u_{k} - u_{n}| \leqslant \mathop{\displaystyle \sum_{j=n+1}^{k}} \dfrac{M}{j} \leqslant \dfrac{M(k - n)}{n + 1} \leqslant M\dfrac{m - n}{n}$.

    **3.** Soit $m = m_{n}$, de sorte que $m - n = \lfloor \varepsilon n \rfloor$. Par la question 2, la moyenne des $u_{k}$ pour $n < k \leqslant m$ est à distance au plus $M\dfrac{m - n}{n} \leqslant M\varepsilon$ de $u_{n}$. Pour $\varepsilon n \geqslant 2$, $m - n \geqslant \varepsilon n - 1 \geqslant \dfrac{\varepsilon n}{2}$, donc $\dfrac{n}{m - n} \leqslant \dfrac{2}{\varepsilon}$. La question 1 donne alors l'inégalité demandée. Quand $n \to +\infty$, $m_{n} \to +\infty$, donc $\sigma_{m_{n}} \to \ell$ et $\sigma_{m_{n}} - \sigma_{n} \to 0$ : 
    $$\limsup_{n \to +\infty} |u_{n} - \ell| \leqslant M\varepsilon \quad\text{pour tout } \varepsilon \in \, ]0, 1].$$

    $$\boxed{u_{n} \xrightarrow[n \to +\infty]{} \ell}$$

    **4.** La suite $u_{n} = (-1)^{n}$ a des moyennes qui tendent vers $0$ et diverge ; ici $|u_{n} - u_{n-1}| = 2$ n'est pas un $O\big(\dfrac{1}{n}\big)$.

    **5.** Par l'inégalité $|\sin x - \sin y| \leqslant |x - y|$ et l'encadrement $\ln n - \ln(n - 1) \leqslant \dfrac{1}{n - 1} \leqslant \dfrac{2}{n}$, l'hypothèse vaut avec $M = 2$. Les écarts $\ln(n + 1) - \ln n$ tendent vers $0$ et $\ln n \to +\infty$ : pour tout $k$, il existe $n_{k}$ tel que $\big|\ln n_{k} - \big(\dfrac{\pi}{2} + 2k\pi\big)\big| \leqslant \ln(n_{k} + 1) - \ln n_{k}$, donc $\sin(\ln n_{k}) \to 1$ ; de même avec $-\dfrac{\pi}{2} + 2k\pi$, une sous-suite tend vers $-1$. La suite $(u_{n})$ diverge ; si $(\sigma_{n})$ convergeait, les questions 1 à 3 donneraient la convergence de $(u_{n})$. 
    $$\boxed{(\sigma_{n}) \text{ diverge}}$$
     Pour l'équivalent, la fonction $\varphi(t) = \sin(\ln t)$ vérifie $|\varphi'(t)| \leqslant \dfrac{1}{t}$, donc $\big|\varphi(k) - \mathop{\displaystyle \int_{k}^{k+1}} \varphi\big| \leqslant \dfrac{1}{k}$, et 
    $$\Big|\sum_{k=1}^{n-1} \varphi(k) - \int_{1}^{n} \varphi\Big| \leqslant H_{n-1} = O(\ln n).$$
     Le changement de variable $t = \mathrm{e}^{s}$ donne $\mathop{\displaystyle \int_{1}^{n}} \sin(\ln t)\,\mathrm{d} t = \mathop{\displaystyle \int_{0}^{\ln n}} \mathrm{e}^{s}\sin s\,\mathrm{d} s = \dfrac{n}{2}\big(\sin(\ln n) - \cos(\ln n)\big) + \dfrac{1}{2}$. On divise par $n$ : 
    $$\boxed{\sigma_{n} - \frac{1}{2}\big(\sin(\ln n) - \cos(\ln n)\big) \xrightarrow[n \to +\infty]{} 0}$$
     Les moyennes oscillent entre $-\dfrac{\sqrt{2}}{2}$ et $\dfrac{\sqrt{2}}{2}$ : la moyenne de Cesàro lisse les oscillations de $(-1)^{n}$, trop rapides, mais pas celles de $\sin(\ln n)$, trop lentes. Le théorème de cet exercice, dû à Hardy (1910), est l'un des premiers théorèmes dits taubériens, du nom de A. Tauber qui en démontra un en 1897 pour une autre méthode de sommation.

