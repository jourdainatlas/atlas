  page_enonce: 9
  page_corrige: 20
  enonce: |
    Soit $f : [a, b] \to E$ de classe $\mathcal{C}^{1}$.

    **1.** Soit $F$ un sous-espace de $E$ tel que $f'(t) \in F$ pour tout $t$. Montrer que $f(b) - f(a) \in F$. On utilisera un supplémentaire $G$ de $F$ et le projecteur $p$ sur $G$ parallèlement à $F$.

    **2.** Montrer que $\lVert f(b) - f(a) - (b - a)f'(a) \rVert \leqslant (b - a)\sup\limits_{t \in [a, b]} \lVert f'(t) - f'(a) \rVert$.

    **3.** Soit $\lambda : [a, b] \to \mathbb{K}$ continue, de primitive $\Lambda$, telle que $f' = \lambda f$. En dérivant $t \mapsto \mathrm{e}^{-\Lambda(t)}f(t)$, montrer que $f(t) = \mathrm{e}^{\Lambda(t) - \Lambda(a)}f(a)$. En déduire que, si $f$ s'annule en un point, elle est identiquement nulle.
  corrige: |
    **1.** On compose par le projecteur $p$ sur $G$ parallèlement à $F$, linéaire : $(p \circ f)' = p \circ f' = 0$ (théorème 5 (ii)). Sur l'intervalle $[a, b]$, $p \circ f$ est constante, donc $p\big(f(b) - f(a)\big) = 0$. 
    $$\boxed{f(b) - f(a) \in \mathrm{Ker}\, p = F}$$

    **2.** On applique l'inégalité des accroissements finis (théorème 7) à $g(t) = f(t) - tf'(a)$, de dérivée $f'(t) - f'(a)$ : 
    $$\lVert g(b) - g(a) \rVert = \lVert f(b) - f(a) - (b - a)f'(a) \rVert \leqslant (b - a)\sup_{[a, b]} \lVert f' - f'(a) \rVert.$$
     Comme $f'$ est continue, ce majorant est un $o(b - a)$ quand $b \to a$ : c'est une forme uniforme du développement limité à l'ordre $1$.

    **3.** On dérive le produit d'une fonction scalaire par une fonction vectorielle (théorème 5 (i)) : 
    $$\big(\mathrm{e}^{-\Lambda}f\big)' = -\lambda\mathrm{e}^{-\Lambda}f + \mathrm{e}^{-\Lambda}\lambda f = 0.$$

    $$\boxed{f(t) = \mathrm{e}^{\Lambda(t) - \Lambda(a)}f(a)}$$
     Le même calcul, avec $a$ remplacé par un point $t_{0}$ où $f$ s'annule, donne $f(t) = \mathrm{e}^{\Lambda(t) - \Lambda(t_{0})}f(t_{0}) = 0$ pour tout $t$. En particulier, $f(t)$ reste sur la droite $\mathbb{K} f(a)$ : c'est une forme vectorielle de l'équation $y' = \lambda y$ de MPSI.
