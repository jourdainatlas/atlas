  enonce: |
    *Une somme de Riemann vectorielle.* On pose $G_{n} = \dfrac{1}{n}\displaystyle\sum_{k=0}^{n-1} \Big(\cos\frac{k\pi}{n}, \sin\frac{k\pi}{n}\Big)$.

    **1.** Déterminer la limite de $G_{n}$ à l'aide des sommes de Riemann.

    **2.** Retrouver ce résultat en calculant la somme géométrique complexe $\sum_{k=0}^{n-1} \mathrm{e}^{\mathrm{i} k\pi/n}$.

    **3.** Interpréter $G_{n}$ comme un centre de gravité, et le résultat comme celui d'un demi-cercle homogène.
  corrige: |
    **1.** Avec $g(x) = (\cos\pi x, \sin\pi x)$, continue sur $[0, 1]$, $G_{n}$ est une somme de Riemann (proposition 5 (iv)) : 
    $$G_{n} \to \int_{0}^{1} g = \Big(\Big[\frac{\sin\pi x}{\pi}\Big]_{0}^{1}, \Big[-\frac{\cos\pi x}{\pi}\Big]_{0}^{1}\Big) = \Big(0, \frac{2}{\pi}\Big).$$

    **2.** On identifie $\mathbb{R}^{2}$ à $\mathbb{C}$. Avec $\omega = \mathrm{e}^{\mathrm{i}\pi/n}$ et $\omega^{n} = -1$, 
    $$\sum_{k=0}^{n-1} \omega^{k} = \frac{2}{1 - \mathrm{e}^{\mathrm{i}\pi/n}} = \frac{2}{-2\mathrm{i}\sin\frac{\pi}{2n}\,\mathrm{e}^{\mathrm{i}\pi/(2n)}} = \frac{\mathrm{i}\,\mathrm{e}^{-\mathrm{i}\pi/(2n)}}{\sin\frac{\pi}{2n}},$$
     et $n\sin\dfrac{\pi}{2n} \to \dfrac{\pi}{2}$, donc $G_{n} = \dfrac{1}{n}\mathop{\displaystyle \sum} \omega^{k} \to \dfrac{2\mathrm{i}}{\pi}$.

    **3.** $G_{n}$ est le centre de gravité de $n$ points régulièrement espacés sur le demi-cercle supérieur, et sa limite celui d'un demi-cercle homogène. 
    $$\boxed{G_{n} \to \Big(0, \frac{2}{\pi}\Big) \approx (0;\ 0{,}637)}$$
