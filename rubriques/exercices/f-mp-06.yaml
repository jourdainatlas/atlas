  source: "BibM@th, Séries numériques, exercice 35"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    En décomposant le numérateur sur la famille $1$, $n$, $n(n - 1)$, $n(n - 1)(n - 2)$, calculer 
    $$\sum_{n=0}^{+\infty} \frac{n + 1}{n!}, \qquad \sum_{n=0}^{+\infty} \frac{n^{2}}{n!}, \qquad \sum_{n=0}^{+\infty} \frac{n^{3}}{n!}, \qquad \sum_{n=0}^{+\infty} \frac{n^{2} - 2}{n!}.$$
  corrige: |
    On utilise $\mathop{\displaystyle \sum_{n \geqslant p}} \dfrac{n(n - 1)\cdots(n - p + 1)}{n!} = \mathop{\displaystyle \sum_{n \geqslant p}} \dfrac{1}{(n - p)!} = \mathrm{e}$ pour tout $p$. Comme $n^{2} = n(n - 1) + n$ et $n^{3} = n(n - 1)(n - 2) + 3n(n - 1) + n$, 
    $$\sum \frac{n + 1}{n!} = \mathrm{e} + \mathrm{e}, \qquad \sum \frac{n^{2}}{n!} = \mathrm{e} + \mathrm{e}, \qquad \sum \frac{n^{3}}{n!} = \mathrm{e} + 3\mathrm{e} + \mathrm{e}, \qquad \sum \frac{n^{2} - 2}{n!} = 2\mathrm{e} - 2\mathrm{e}.$$

    $$\boxed{2\mathrm{e}, \quad 2\mathrm{e}, \quad 5\mathrm{e}, \quad 0}$$
     Les coefficients $1$, $2$, $5$ de $\mathop{\displaystyle \sum} \dfrac{n}{n!}$, $\mathop{\displaystyle \sum} \dfrac{n^{2}}{n!}$ et $\mathop{\displaystyle \sum} \dfrac{n^{3}}{n!}$ sont les nombres de Bell : $\mathop{\displaystyle \sum} \dfrac{n^{k}}{n!} = B_{k}\,\mathrm{e}$, où $B_{k}$ est le nombre de partitions d'un ensemble à $k$ éléments.
- id: "mp-06-08"
  feuille: "f-mp-06"
  numero: 8
  partie: "Entraînement : nature et somme de séries numériques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries numériques, séries de Riemann]
  noeuds: [as-series]
  notions: [serie-riemann]
  source: "Séries numériques et familles sommables (LLG), exercice 3"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    À l'aide de $\sum \frac{1}{n^{2}} = \frac{\pi^{2}}{6}$, calculer :

    **1.** $\displaystyle\sum_{n=0}^{+\infty} \frac{1}{(2n + 1)^{2}}$, en séparant les indices pairs et impairs ;

    **2.** $\displaystyle\sum_{n=1}^{+\infty} \frac{1}{n^{2}(n + 1)^{2}}$, en développant $\Big(\dfrac{1}{n} - \dfrac{1}{n + 1}\Big)^{2}$ ;

    **3.** $\displaystyle\sum_{\substack{n \geqslant 1 \\ n \neq p}} \frac{1}{n^{2} - p^{2}}$ pour $p \in \mathbb{N}^{*}$, en décomposant en éléments simples et en sommant jusqu'à un rang $N > 2p$.
  corrige: |
    **1.** On sépare les indices pairs et impairs dans la série absolument convergente $\mathop{\displaystyle \sum} \dfrac{1}{n^{2}}$ : 
    $$\frac{\pi^{2}}{6} = \sum_{n=1}^{+\infty} \frac{1}{(2n)^{2}} + \sum_{n=0}^{+\infty} \frac{1}{(2n + 1)^{2}} = \frac{\pi^{2}}{24} + S.$$

    $$\boxed{\sum_{n=0}^{+\infty} \frac{1}{(2n + 1)^{2}} = \frac{\pi^{2}}{8}}$$

    **2.** On développe : $\dfrac{1}{n^{2}(n + 1)^{2}} = \dfrac{1}{n^{2}} + \dfrac{1}{(n + 1)^{2}} - \dfrac{2}{n(n + 1)}$, et $\mathop{\displaystyle \sum_{n \geqslant 1}} \dfrac{2}{n(n + 1)} = 2$. 
    $$\boxed{\sum_{n=1}^{+\infty} \frac{1}{n^{2}(n + 1)^{2}} = \frac{\pi^{2}}{6} + \Big(\frac{\pi^{2}}{6} - 1\Big) - 2 = \frac{\pi^{2}}{3} - 3}$$

    **3.** On décompose : $\dfrac{1}{n^{2} - p^{2}} = \dfrac{1}{2p}\Big(\dfrac{1}{n - p} - \dfrac{1}{n + p}\Big)$. Pour $N > 2p$, 
    $$\sum_{\substack{n=1 \\ n \neq p}}^{N} \frac{1}{n - p} = -H_{p-1} + H_{N-p}, \qquad \sum_{\substack{n=1 \\ n \neq p}}^{N} \frac{1}{n + p} = H_{N+p} - H_{p} - \frac{1}{2p}.$$
     La différence vaut $H_{p} - H_{p-1} + \dfrac{1}{2p} + H_{N-p} - H_{N+p} = \dfrac{3}{2p} + H_{N-p} - H_{N+p}$, et $H_{N+p} - H_{N-p} \leqslant \dfrac{2p}{N - p} \to 0$. 
    $$\boxed{\sum_{\substack{n \geqslant 1 \\ n \neq p}} \frac{1}{n^{2} - p^{2}} = \frac{3}{4p^{2}}}$$
     Pour $p = 1$, une somme numérique jusqu'à $10^{6}$ donne $0{,}749\,999$.
- id: "mp-06-09"
  feuille: "f-mp-06"
  numero: 9
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles]
  noeuds: [as-series, f-evn]
  notions: [serie-absolument-convergente]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Montrer que la série de terme général $u_{n} = \Big(\dfrac{1}{2^{n}}, \dfrac{1}{(n + 1)(n + 2)}, \Big(-\dfrac{1}{3}\Big)^{n}\Big)$ converge absolument dans $\mathbb{R}^{3}$, et calculer sa somme.

    **2.** Soit $\theta \in \mathbb{R}$. Montrer la convergence dans $\mathbb{R}^{2}$ de la série de terme général $\big(\frac{\cos n\theta}{2^{n}}, \frac{\sin n\theta}{2^{n}}\big)$ et calculer sa somme, en l'identifiant à une série géométrique complexe.
  corrige: |
    **1.** On raisonne coordonnée par coordonnée (proposition 1 (ii)). Les trois séries 
    $$\sum \frac{1}{2^{n}}, \qquad \sum \frac{1}{(n + 1)(n + 2)}, \qquad \sum \Big(-\frac{1}{3}\Big)^{n}$$
     sont absolument convergentes, donc $\mathop{\displaystyle \sum} \lVert u_{n} \rVert_{1}$ converge, et toutes les normes sont équivalentes. La deuxième est télescopique : $\dfrac{1}{(n + 1)(n + 2)} = \dfrac{1}{n + 1} - \dfrac{1}{n + 2}$. 
    $$\boxed{\sum_{n=0}^{+\infty} u_{n} = \Big(2, 1, \frac{3}{4}\Big)}$$

    **2.** On identifie $\mathbb{R}^{2}$ à $\mathbb{C}$ par l'isomorphisme $\mathbb{R}$-linéaire $(x, y) \mapsto x + \mathrm{i} y$, qui transporte la convergence (proposition 1 (iii)). Le terme général devient $z^{n}$ avec $z = \dfrac{\mathrm{e}^{\mathrm{i}\theta}}{2}$, et $|z| = \dfrac{1}{2}$ : 
    $$\sum_{n=0}^{+\infty} z^{n} = \frac{2}{2 - \mathrm{e}^{\mathrm{i}\theta}} = \frac{2(2 - \mathrm{e}^{-\mathrm{i}\theta})}{|2 - \mathrm{e}^{\mathrm{i}\theta}|^{2}} = \frac{2(2 - \cos\theta) + 2\mathrm{i}\sin\theta}{5 - 4\cos\theta}.$$

    $$\boxed{\sum_{n=0}^{+\infty} \Big(\frac{\cos n\theta}{2^{n}}, \frac{\sin n\theta}{2^{n}}\Big) = \Big(\frac{2(2 - \cos\theta)}{5 - 4\cos\theta}, \frac{2\sin\theta}{5 - 4\cos\theta}\Big)}$$
- id: "mp-06-10"
  feuille: "f-mp-06"
  numero: 10
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercice 8 ; cours, proposition 2"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $N = \begin{pmatrix} 0 & 1 & 1 \\ 0 & 0 & 1 \\ 0 & 0 & 0 \end{pmatrix}$.

    **1.** Calculer $N^{2}$ et $N^{3}$. En déduire, sans calcul de déterminant, que $I_{3} - N$ est inversible, et calculer son inverse.

    **2.** Calculer $\exp(N)$, puis $\exp(tN)$ pour $t \in \mathbb{R}$.

    **3.** Plus généralement, si $N \in \mathcal{M}_{d}(\mathbb{K})$ est nilpotente d'indice $p$, exprimer $(I_{d} - N)^{-1}$ et $\exp(N)$ comme des sommes finies.
  corrige: |
    **1.** Le calcul donne $N^{2} = \begin{pmatrix} 0 & 0 & 1 \\ 0 & 0 & 0 \\ 0 & 0 & 0 \end{pmatrix}$ et $N^{3} = 0$. La somme est alors finie et télescopique : $(I_{3} - N)(I_{3} + N + N^{2}) = I_{3} - N^{3} = I_{3}$. 
    $$\boxed{(I_{3} - N)^{-1} = I_{3} + N + N^{2} = \begin{pmatrix} 1 & 1 & 2 \\ 0 & 1 & 1 \\ 0 & 0 & 1 \end{pmatrix}}$$

    **2.** La série exponentielle s'arrête au terme d'indice $2$ : 
    $$\boxed{\exp(tN) = I_{3} + tN + \frac{t^{2}}{2}N^{2} = \begin{pmatrix} 1 & t & t + \frac{t^{2}}{2} \\ 0 & 1 & t \\ 0 & 0 & 1 \end{pmatrix}, \qquad \exp(N) = \begin{pmatrix} 1 & 1 & \frac{3}{2} \\ 0 & 1 & 1 \\ 0 & 0 & 1 \end{pmatrix}}$$

    **3.** Le même calcul vaut pour un indice de nilpotence $p$ quelconque, puisque $N^{k} = 0$ pour $k \geqslant p$. 
    $$\boxed{(I_{d} - N)^{-1} = \sum_{k=0}^{p-1} N^{k}, \qquad \exp(N) = \sum_{k=0}^{p-1} \frac{N^{k}}{k!}}$$
     On n'a pas besoin ici de l'hypothèse $|\mkern-1.5mu|\mkern-1.5mu|N|\mkern-1.5mu|\mkern-1.5mu| < 1$ de la proposition 2 : la nilpotence rend toutes les séries finies.
- id: "mp-06-11"
  feuille: "f-mp-06"
  numero: 11
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries vectorielles, exponentielle, séries de matrices]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercices 5 et 6"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $A \in \mathcal{M}_{d}(\mathbb{K})$ et $t \in \mathbb{R}$. Calculer $\exp(tA)$ lorsque : 
    $$\text{(a) } A^{2} = -I_{d} ; \qquad \text{(b) } A^{2} = I_{d} ; \qquad \text{(c) } A^{2} = A.$$
     On séparera, dans la série, les termes d'indice pair et d'indice impair, et l'on exprimera le résultat à l'aide de $\cos$, $\sin$, $\operatorname{ch}$, $\operatorname{sh}$ ou $\mathrm{e}^{t}$. Donner un exemple de matrice réelle de taille $2$ dans chaque cas.
  corrige: |
    On sépare les termes pairs et impairs (proposition 1 (i)).

    (a) $(tA)^{2k} = (-1)^{k}t^{2k}I_{d}$ et $(tA)^{2k+1} = (-1)^{k}t^{2k+1}A$, d'où $\exp(tA) = \cos t\,I_{d} + \sin t\,A$.

    (b) $(tA)^{2k} = t^{2k}I_{d}$ et $(tA)^{2k+1} = t^{2k+1}A$, d'où $\exp(tA) = \operatorname{ch} t\,I_{d} + \operatorname{sh} t\,A$.

    (c) $A^{k} = A$ pour $k \geqslant 1$, d'où $\exp(tA) = I_{d} + \big(\mathop{\displaystyle \sum_{k \geqslant 1}} \dfrac{t^{k}}{k!}\big)A$. 
    $$\boxed{\text{(a) } \cos t\,I_{d} + \sin t\,A ; \qquad \text{(b) } \operatorname{ch} t\,I_{d} + \operatorname{sh} t\,A ; \qquad \text{(c) } I_{d} + (\mathrm{e}^{t} - 1)A}$$
     Exemples : $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ pour (a), $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$ pour (b), $\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$ pour (c). Dans le cas (c), on retrouve sur le noyau et l'image du projecteur les exponentielles $\mathrm{e}^{0} = 1$ et $\mathrm{e}^{t}$.
- id: "mp-06-12"
  feuille: "f-mp-06"
  numero: 12
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercice 1"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $A = \begin{pmatrix} 0 & 1 & 0 \\ 1 & 0 & 1 \\ 0 & 1 & 0 \end{pmatrix}$.

    **1.** Calculer $A^{2}$ et $A^{3}$, et vérifier que $A^{3} = 2A$.

    **2.** En déduire $A^{2k+1}$ et $A^{2k+2}$ pour $k \in \mathbb{N}$, puis montrer que 
    $$\exp(A) = I_{3} + \frac{\operatorname{sh}\sqrt{2}}{\sqrt{2}}\,A + \frac{\operatorname{ch}\sqrt{2} - 1}{2}\,A^{2}.$$
  corrige: |
    **1.** Le calcul direct donne 
    $$A^{2} = \begin{pmatrix} 1 & 0 & 1 \\ 0 & 2 & 0 \\ 1 & 0 & 1 \end{pmatrix}, \qquad A^{3} = \begin{pmatrix} 0 & 2 & 0 \\ 2 & 0 & 2 \\ 0 & 2 & 0 \end{pmatrix} = 2A.$$

    **2.** Par récurrence, $A^{2k+1} = 2^{k}A$ et $A^{2k+2} = 2^{k}A^{2}$ pour $k \in \mathbb{N}$. En séparant les termes, 
    $$\exp(A) = I_{3} + \Big(\sum_{k=0}^{+\infty} \frac{2^{k}}{(2k + 1)!}\Big)A + \Big(\sum_{k=0}^{+\infty} \frac{2^{k}}{(2k + 2)!}\Big)A^{2},$$
     et, avec $2^{k} = \dfrac{(\sqrt{2})^{2k+1}}{\sqrt{2}} = \dfrac{(\sqrt{2})^{2k+2}}{2}$, les deux sommes valent $\dfrac{\operatorname{sh}\sqrt{2}}{\sqrt{2}}$ et $\dfrac{\operatorname{ch}\sqrt{2} - 1}{2}$. 
    $$\boxed{\exp(A) = I_{3} + \frac{\operatorname{sh}\sqrt{2}}{\sqrt{2}}A + \frac{\operatorname{ch}\sqrt{2} - 1}{2}A^{2}}$$
     Le polynôme $X^{3} - 2X$ annule $A$ ; ses racines $0$, $\pm\sqrt{2}$ sont les valeurs propres, ce qui explique l'apparition de $\mathrm{e}^{\pm\sqrt{2}}$.
- id: "mp-06-13"
  feuille: "f-mp-06"
  numero: 13
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles, exponentielle]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercices 2 et 11"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Soit $A \in \mathcal{M}_{d}(\mathbb{K})$. Montrer que $\exp(A)$ appartient à $\mathbb{K}[A] = \{P(A) \mid P \in \mathbb{K}[X]\}$. On utilisera le fait qu'un sous-espace de dimension finie est fermé (chapitre 5).

    **2.** Soit $A = \begin{pmatrix} 3 & -2 \\ 1 & 0 \end{pmatrix}$. Vérifier que $A^{2} = 3A - 2I_{2}$. Montrer qu'il existe des suites $(a_{k})$ et $(b_{k})$ telles que $A^{k} = a_{k}I_{2} + b_{k}A$, et les calculer en évaluant en les racines de $X^{2} - 3X + 2$.

    **3.** En déduire que $\exp(A) = (2\mathrm{e} - \mathrm{e}^{2})I_{2} + (\mathrm{e}^{2} - \mathrm{e})A$, et vérifier ce résultat en diagonalisant $A$.
  corrige: |
    **1.** Les sommes partielles $\mathop{\displaystyle \sum_{k=0}^{n}} \dfrac{A^{k}}{k!}$ sont dans le sous-espace $\mathbb{K}[A]$ de $\mathcal{M}_{d}(\mathbb{K})$, qui est de dimension finie, donc fermé (chapitre 5, proposition 14). La limite $\exp(A)$ y appartient. 
    $$\boxed{\exp(A) \in \mathbb{K}[A]}$$

    **2.** On vérifie l'égalité par le calcul : 
    $$A^{2} = \begin{pmatrix} 7 & -6 \\ 3 & -2 \end{pmatrix} = 3A - 2I_{2}.$$
     La division euclidienne $X^{k} = Q_{k}(X)(X - 1)(X - 2) + a_{k} + b_{k}X$ donne $A^{k} = a_{k}I_{2} + b_{k}A$, et l'évaluation en $1$ et $2$ fournit $a_{k} + b_{k} = 1$ et $a_{k} + 2b_{k} = 2^{k}$. 
    $$\boxed{b_{k} = 2^{k} - 1, \qquad a_{k} = 2 - 2^{k}}$$

    **3.** On somme les coefficients : $\mathop{\displaystyle \sum} \dfrac{2 - 2^{k}}{k!} = 2\mathrm{e} - \mathrm{e}^{2}$ et $\mathop{\displaystyle \sum} \dfrac{2^{k} - 1}{k!} = \mathrm{e}^{2} - \mathrm{e}$. 
    $$\boxed{\exp(A) = (2\mathrm{e} - \mathrm{e}^{2})I_{2} + (\mathrm{e}^{2} - \mathrm{e})A = \begin{pmatrix} 2\mathrm{e}^{2} - \mathrm{e} & 2\mathrm{e} - 2\mathrm{e}^{2} \\ \mathrm{e}^{2} - \mathrm{e} & 2\mathrm{e} - \mathrm{e}^{2} \end{pmatrix}}$$
     *Vérification.* Les vecteurs $v_{1} = (1, 1)$ et $v_{2} = (2, 1)$ sont propres pour les valeurs propres $1$ et $2$. Le résultat envoie $v_{1}$ sur $(2\mathrm{e} - \mathrm{e}^{2} + \mathrm{e}^{2} - \mathrm{e})v_{1} = \mathrm{e}\,v_{1}$ et $v_{2}$ sur $(2\mathrm{e} - \mathrm{e}^{2} + 2\mathrm{e}^{2} - 2\mathrm{e})v_{2} = \mathrm{e}^{2}v_{2}$, comme $P\operatorname{diag}(\mathrm{e}, \mathrm{e}^{2})P^{-1}$.
- id: "mp-06-14"
  feuille: "f-mp-06"
  numero: 14
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles, exponentielle, séries de matrices]
  noeuds: [as-series, f-evn, li-exponentielle]
  notions: [serie-absolument-convergente, exponentielle-matrice]
  source: "Exponentielle matricielle (Prost, LLG), exercice 4"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $n \geqslant 2$, $a$, $b \in \mathbb{R}$ et $M \in \mathcal{M}_{n}(\mathbb{R})$ la matrice dont les coefficients diagonaux valent $a$ et les autres $b$. On note $J$ la matrice dont tous les coefficients valent $1$, et $P = \frac{1}{n}J$.

    **1.** Montrer que $P$ est un projecteur et que $M = \lambda(I_{n} - P) + \mu P$ avec $\lambda = a - b$ et $\mu = a + (n - 1)b$.

    **2.** En déduire $M^{k}$ pour $k \in \mathbb{N}$, puis $\exp(tM) = \mathrm{e}^{\lambda t}(I_{n} - P) + \mathrm{e}^{\mu t}P$ pour $t \in \mathbb{R}$.

    **3.** On suppose $a \geqslant 0$, $b > 0$ et $a + (n - 1)b = 1$. Déterminer la limite de $\mathrm{e}^{-t}\exp(tM)$ quand $t \to +\infty$.
  corrige: |
    **1.** Comme $J^{2} = nJ$, on a $P^{2} = \dfrac{n}{n^{2}}J = P$. Par ailleurs $M = (a - b)I_{n} + bJ = \lambda I_{n} + nbP$, et 
    $$\lambda(I_{n} - P) + \mu P = \lambda I_{n} + (\mu - \lambda)P = \lambda I_{n} + nbP = M.$$

    **2.** Les projecteurs $P$ et $Q = I_{n} - P$ vérifient $P^{2} = P$, $Q^{2} = Q$ et $PQ = QP = 0$, donc $M^{k} = \lambda^{k}Q + \mu^{k}P$, avec la convention $M^{0} = I_{n} = Q + P$. On somme par linéarité : 
    $$\boxed{M^{k} = \lambda^{k}(I_{n} - P) + \mu^{k}P, \qquad \exp(tM) = \mathrm{e}^{\lambda t}(I_{n} - P) + \mathrm{e}^{\mu t}P}$$

    **3.** Ici $\mu = 1$ et $\lambda = a - b = 1 - nb < 1$. Alors $\mathrm{e}^{-t}\exp(tM) = \mathrm{e}^{(\lambda - 1)t}(I_{n} - P) + P$. 
    $$\boxed{\mathrm{e}^{-t}\exp(tM) \xrightarrow[t \to +\infty]{} P = \frac{1}{n}J}$$
     La matrice $M$ a des coefficients positifs et des lignes de somme $1$ ; la limite est la matrice dont toutes les lignes sont la loi uniforme, ce qui s'interprète en termes de chaînes de Markov (hors programme).
- id: "mp-06-15"
  feuille: "f-mp-06"
  numero: 15
  partie: "Séries dans un espace vectoriel normé de dimension finie"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries vectorielles]
  noeuds: [as-series, f-evn]
  notions: [serie-absolument-convergente]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Un calcul d'erreur.* Soit $A = \begin{pmatrix} 0{,}2 & 0{,}1 \\ 0{,}3 & 0{,}2 \end{pmatrix}$. On munit $\mathbb{R}^{2}$ de $\lVert \cdot \rVert_{\infty}$, et $\mathcal{M}_{2}(\mathbb{R})$ de la norme subordonnée $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$, égale au maximum des sommes des valeurs absolues des coefficients d'une ligne (chapitre 5).

    **1.** Calculer $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty}$ et en déduire que $I_{2} - A$ est inversible.

    **2.** Montrer que $|\mkern-1.5mu|\mkern-1.5mu|(I_{2} - A)^{-1} - \sum_{k=0}^{n} A^{k}|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \leqslant 2^{-n}$ pour tout $n \in \mathbb{N}$. Pour quelle valeur de $n$ obtient-on une erreur inférieure à $10^{-6}$ ?

    **3.** Calculer $(I_{2} - A)^{-1}$ exactement et vérifier que ses coefficients sont positifs, ce que la série permettait de prévoir.
  corrige: |
    **1.** Les sommes des lignes sont $0{,}3$ et $0{,}5$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = \frac{1}{2} < 1, \text{ donc } I_{2} - A \text{ est inversible (proposition 2)}}$$

    **2.** On majore le reste de la série de Neumann : 
    $$|\mkern-1.5mu|\mkern-1.5mu|(I_{2} - A)^{-1} - \sum_{k=0}^{n} A^{k}|\mkern-1.5mu|\mkern-1.5mu|_{\infty} = |\mkern-1.5mu|\mkern-1.5mu|\sum_{k=n+1}^{+\infty} A^{k}|\mkern-1.5mu|\mkern-1.5mu|_{\infty} \leqslant \sum_{k=n+1}^{+\infty} \frac{1}{2^{k}} = \frac{1}{2^{n}}.$$
     Comme $2^{19} < 10^{6} < 2^{20} = 1\,048\,576$ : 
    $$\boxed{n = 20 \text{ suffit}}$$

    **3.** On a $I_{2} - A = \begin{pmatrix} 0{,}8 & -0{,}1 \\ -0{,}3 & 0{,}8 \end{pmatrix}$, de déterminant $0{,}61$. 
    $$\boxed{(I_{2} - A)^{-1} = \frac{1}{61}\begin{pmatrix} 80 & 10 \\ 30 & 80 \end{pmatrix}}$$
     La positivité était prévisible : chaque $A^{k}$ est à coefficients positifs, donc les sommes partielles aussi, et la limite également. C'est le principe du modèle de Leontief en économie, où $A$ décrit les consommations intermédiaires.
- id: "mp-06-16"
  feuille: "f-mp-06"
