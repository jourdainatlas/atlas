  enonce: |
    *Cas d'égalité dans l'inégalité triangulaire.* Soit $E$ un espace euclidien et $f : [a, b] \to E$ continue, avec $a < b$, telle que $\Big\|\displaystyle\int_{a}^{b} f\Big\| = \displaystyle\int_{a}^{b} \lVert f \rVert$ et $v = \displaystyle\int_{a}^{b} f \neq 0$. On pose $u = \frac{v}{\lVert v \rVert}$.

    **1.** Montrer que $\displaystyle\int_{a}^{b} \big(\lVert f(t) \rVert - \langle f(t), u \rangle\big)\,\mathrm{d} t = 0$, et en déduire que $\langle f(t), u \rangle = \lVert f(t) \rVert$ pour tout $t$.

    **2.** En déduire que $f(t) = \lVert f(t) \rVert\,u$ pour tout $t$ : la fonction garde une direction et un sens fixes.

    **3.** Le résultat subsiste-t-il pour la norme $\lVert \cdot \rVert_{\infty}$ de $\mathbb{R}^{2}$ ? On pourra considérer $f(t) = (1, t)$ sur $[0, 1]$.
  corrige: |
    **1.** La forme linéaire $x \mapsto \langle x, u \rangle$ commute avec l'intégrale (proposition 5 (i)) : 
    $$\int_{a}^{b} \langle f(t), u \rangle\,\mathrm{d} t = \langle v, u \rangle = \lVert v \rVert = \int_{a}^{b} \lVert f \rVert,$$
     d'où l'égalité demandée. L'intégrande $\lVert f(t) \rVert - \langle f(t), u \rangle$ est continu et positif par l'inégalité de Cauchy-Schwarz ; d'intégrale nulle, il est nul (chapitre 18 de MPSI).

    **2.** On calcule le carré de la distance de $f(t)$ à $\lVert f(t) \rVert u$ : 
    $$\lVert f(t) - \lVert f(t) \rVert u \rVert^{2} = \lVert f(t) \rVert^{2} - 2\lVert f(t) \rVert\langle f(t), u \rangle + \lVert f(t) \rVert^{2} = 0.$$

    $$\boxed{f(t) = \lVert f(t) \rVert\,u \text{ pour tout } t}$$

    **3.** Non. Prenons $f(t) = (1, t)$ sur $[0, 1]$, et la norme $\lVert \cdot \rVert_{\infty}$. Alors 
    $$\Big\|\int_{0}^{1} f\Big\|_{\infty} = \Big\|\Big(1, \frac{1}{2}\Big)\Big\|_{\infty} = 1 = \int_{0}^{1} \lVert f(t) \rVert_{\infty}\,\mathrm{d} t :$$
     il y a égalité, alors que la direction de $f(t)$ varie. 
    $$\boxed{\text{Le cas d'égalité de la question 2 est propre aux normes euclidiennes}}$$
     Il vaut plus généralement pour les normes dites strictement convexes, dont la sphère unité ne contient aucun segment ; la sphère de $\lVert \cdot \rVert_{\infty}$ est un carré.
