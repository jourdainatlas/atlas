  enonce: |
    *Une version multiplicative du théorème de Cesàro.*

    **1.** Soit $(u_{n})$ une suite réelle telle que $u_{n+1} - u_{n} \to \ell \in \mathbb{R} \cup \{\pm\infty\}$. Montrer que $\frac{u_{n}}{n} \to \ell$.

    **2.** Soit $(a_{n})$ une suite de réels strictement positifs telle que $\frac{a_{n+1}}{a_{n}} \to \ell > 0$. Montrer que $a_{n}^{1/n} \to \ell$.

    **3.** En déduire les limites de $\dfrac{(n!)^{1/n}}{n}$ et de $\dbinom{2n}{n}^{1/n}$. Comparer avec l'exercice 27.
  corrige: |
    **1.** Le théorème de Cesàro, appliqué à $a_{k} = u_{k} - u_{k-1}$, donne $\dfrac{u_{n} - u_{0}}{n} \to \ell$, puis $\dfrac{u_{n}}{n} \to \ell$ car $\dfrac{u_{0}}{n} \to 0$.

    **2.** On passe au logarithme : $\ln a_{n+1} - \ln a_{n} \to \ln\ell$, et la question 1 donne $\dfrac{\ln a_{n}}{n} \to \ln\ell$.

    **3.** Pour $a_{n} = \dfrac{n!}{n^{n}}$, le rapport tend vers $\dfrac{1}{\mathrm{e}}$ (exercice 24) ; pour $a_{n} = \dbinom{2n}{n}$, il vaut 
    $$\frac{(2n + 1)(2n + 2)}{(n + 1)^{2}} \to 4.$$

    $$\boxed{\frac{(n!)^{1/n}}{n} \to \frac{1}{\mathrm{e}}, \qquad \binom{2n}{n}^{1/n} \to 4}$$
     La formule de l'exercice 27 contient davantage : $(n!)^{1/n} = \dfrac{n}{\mathrm{e}}\big(\mathrm{e}^{C}\sqrt{n}\big)^{1/n}(1 + o(1)) = \dfrac{n}{\mathrm{e}} + \dfrac{\ln n}{2\mathrm{e}} + O(1)$, alors que la version multiplicative de Cesàro ne donne que le premier terme.
- id: "mp-06-35"
  feuille: "f-mp-06"
  numero: 35
  partie: "Dérivation des fonctions à valeurs vectorielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivation vectorielle, dérivation]
  noeuds: [de-derivee]
  notions: [derivable]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    *L'astroïde.* Soit $f : \mathbb{R} \to \mathbb{R}^{2}$, $f(t) = (\cos^{3}t, \sin^{3}t)$.

    **1.** Calculer $f'(t)$, et déterminer les réels $t$ tels que $f'(t) = 0$.

    **2.** Pour $t \notin \frac{\pi}{2}\mathbb{Z}$, montrer que la tangente en $f(t)$ est dirigée par $(-\cos t, \sin t)$, et qu'elle coupe les axes en deux points $P(t)$ et $Q(t)$ tels que $P(t)Q(t) = 1$.

    **3.** Pour quelles valeurs de $t$ la norme euclidienne de la vitesse est-elle maximale ?
  corrige: |
    **1.** On dérive coordonnée par coordonnée (proposition 4 (iii)) : 
    $$f'(t) = (-3\cos^{2}t\sin t, 3\sin^{2}t\cos t) = 3\sin t\cos t\,(-\cos t, \sin t).$$
     Le vecteur $(-\cos t, \sin t)$ est unitaire, donc $f'(t) = 0$ si et seulement si $\sin t\cos t = 0$. 
    $$\boxed{f'(t) = 0 \iff t \in \frac{\pi}{2}\mathbb{Z}}$$

    **2.** Pour $t \notin \dfrac{\pi}{2}\mathbb{Z}$, $f'(t)$ est un multiple non nul de $(-\cos t, \sin t)$, qui dirige donc la tangente. Ses points sont $\big(\cos^{3}t - s\cos t, \sin^{3}t + s\sin t\big)$, $s \in \mathbb{R}$. Pour $s = -\sin^{2}t$, l'ordonnée est nulle et l'abscisse vaut $\cos^{3}t + \sin^{2}t\cos t = \cos t$ ; pour $s = \cos^{2}t$, on obtient de même $(0, \sin t)$. 
    $$\boxed{P(t) = (\cos t, 0), \quad Q(t) = (0, \sin t), \quad P(t)Q(t) = \sqrt{\cos^{2}t + \sin^{2}t} = 1}$$
     L'astroïde est ainsi l'enveloppe d'une échelle de longueur $1$ qui glisse le long d'un mur.

    **3.** La norme de la vitesse est $\lVert f'(t) \rVert = 3|\sin t\cos t| = \dfrac{3}{2}|\sin 2t|$. 
    $$\boxed{\lVert f'(t) \rVert \text{ est maximale, égale à } \tfrac{3}{2}, \text{ pour } t \in \tfrac{\pi}{4} + \tfrac{\pi}{2}\mathbb{Z}}$$
- id: "mp-06-36"
  feuille: "f-mp-06"
  numero: 36
  partie: "Dérivation des fonctions à valeurs vectorielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [dérivation vectorielle, dérivation, formule de Leibniz]
  noeuds: [de-derivee]
  notions: [derivable, produit-vectoriel]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    *Calculs de dérivées.*

    **1.** Soit $u(t) = (t, t^{2}, t^{3})$ et $v(t) = (\cos t, \sin t, \mathrm{e}^{t})$. Calculer la dérivée de $t \mapsto \langle u(t), v(t) \rangle$ et celle de $t \mapsto u(t) \wedge v(t)$ en $t = 0$, où $\wedge$ est le produit vectoriel de $\mathbb{R}^{3}$, de deux façons : en développant d'abord, puis par la formule de dérivation d'une application bilinéaire.

    **2.** Soit $B \in \mathcal{M}_{n}(\mathbb{K})$. Montrer que la fonction $t \mapsto \det(I_{n} + tB)$ est dérivable en $0$, de dérivée $\operatorname{tr} B$, à l'aide de la $n$-linéarité du déterminant par rapport aux colonnes.

    **3.** Soit $A(t) = \begin{pmatrix} 0 & 1 \\ t & 0 \end{pmatrix}$. Calculer $(A^{2})'(t)$ et $2A(t)A'(t)$. Que retenir ? Montrer que $(A^{k})' = kA^{k-1}A'$ lorsque $A(t)$ et $A'(t)$ commutent pour tout $t$.
  corrige: |
    **1.** En développant, $\langle u, v \rangle = t\cos t + t^{2}\sin t + t^{3}\mathrm{e}^{t}$, de dérivée $1$ en $0$. Par la formule bilinéaire, $\langle u'(0), v(0) \rangle + \langle u(0), v'(0) \rangle = \langle (1, 0, 0), (1, 0, 1) \rangle + 0 = 1$. Pour le produit vectoriel, 
    $$u \wedge v = \big(t^{2}\mathrm{e}^{t} - t^{3}\sin t, \ t^{3}\cos t - t\mathrm{e}^{t}, \ t\sin t - t^{2}\cos t\big),$$
     dont la dérivée en $0$ est $(0, -1, 0)$. La formule bilinéaire donne, puisque $u(0) = 0$, 
    $$u'(0) \wedge v(0) = (1, 0, 0) \wedge (1, 0, 1) = (0, -1, 0).$$

    $$\boxed{\langle u, v \rangle'(0) = 1, \qquad (u \wedge v)'(0) = (0, -1, 0)}$$

    **2.** Les colonnes de $I_{n} + tB$ sont $e_{j} + tb_{j}$, où $b_{j}$ est la $j$-ième colonne de $B$. Par le théorème 5 (iv), appliqué au déterminant, $n$-linéaire, 
    $$\frac{\mathrm{d}}{\mathrm{d} t}\det(I_{n} + tB)\Big|_{t=0} = \sum_{j=1}^{n} \det(e_{1}, \dots, b_{j}, \dots, e_{n}) = \sum_{j=1}^{n} b_{j,j}.$$

    $$\boxed{\det(I_{n} + tB) = 1 + t\operatorname{tr} B + o(t)}$$

    **3.** Le calcul donne $A^{2} = tI_{2}$, donc $(A^{2})' = I_{2}$, alors que $A' = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$ et 
    $$2AA' = 2\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix} \neq I_{2}, \qquad A'A + AA' = \begin{pmatrix} 0 & 0 \\ 0 & 1 \end{pmatrix} + \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix} = I_{2}.$$
     En général, $(A^{k})' = \mathop{\displaystyle \sum_{j=0}^{k-1}} A^{j}A'A^{k-1-j}$, par récurrence avec la règle du produit ; si $A$ et $A'$ commutent, chaque terme vaut $A^{k-1}A'$. 
    $$\boxed{(A^{2})' = A'A + AA', \text{ et } (A^{k})' = kA^{k-1}A' \text{ seulement si } AA' = A'A}$$
- id: "mp-06-37"
  feuille: "f-mp-06"
  numero: 37
  partie: "Dérivation des fonctions à valeurs vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation vectorielle, dérivation]
  noeuds: [de-derivee]
  notions: [derivable]
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Soit $A : I \to \mathrm{GL}_{n}(\mathbb{K})$ dérivable.

    **1.** À l'aide de la formule $A^{-1} = \frac{1}{\det A}{\mathrm{Com}(A)}^{T}$, montrer que $t \mapsto A(t)^{-1}$ est dérivable.

    **2.** En dérivant la relation $A(t)A(t)^{-1} = I_{n}$, montrer que $(A^{-1})' = -A^{-1}A'A^{-1}$.

    **3.** Vérifier cette formule pour $A(t) = \begin{pmatrix} 1 & t \\ 0 & 1 \end{pmatrix}$, puis pour $A(t) = \begin{pmatrix} \cos t & -\sin t \\ \sin t & \cos t \end{pmatrix}$.
  corrige: |
    **1.** Les coefficients de $\mathrm{Com}(A(t))$ sont des polynômes en les coefficients de $A(t)$, donc des fonctions dérivables ; $\det A(t)$ aussi, et il ne s'annule pas. Chaque coefficient de $A(t)^{-1}$ est donc dérivable, et $A^{-1}$ aussi (proposition 4 (iii)).

    **2.** On dérive le produit $AA^{-1} = I_{n}$ par le théorème 5 (iii), appliqué au produit matriciel, qui est bilinéaire : $A'A^{-1} + A(A^{-1})' = 0$. On multiplie ensuite à gauche par $A^{-1}$. 
    $$\boxed{(A^{-1})' = -A^{-1}A'A^{-1}}$$

    **3.** Pour $A(t) = \begin{pmatrix} 1 & t \\ 0 & 1 \end{pmatrix}$, $A^{-1} = \begin{pmatrix} 1 & -t \\ 0 & 1 \end{pmatrix}$ a pour dérivée $\begin{pmatrix} 0 & -1 \\ 0 & 0 \end{pmatrix}$, et $A^{-1}A'A^{-1} = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ puisque $A' = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ est de carré nul. Pour la rotation $R(t)$, on a $R' = JR = RJ$ avec $J = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, et $R(t)^{-1} = R(-t)$ a pour dérivée $-JR(-t)$ ; la formule donne $-R(-t)R(t)JR(-t) = -JR(-t)$. Les deux vérifications concordent.
- id: "mp-06-38"
  feuille: "f-mp-06"
  numero: 38
  partie: "Dérivation des fonctions à valeurs vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation vectorielle, dérivation]
  noeuds: [de-derivee]
  notions: [derivable, derivee-successive]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $E$ un espace euclidien et $f : I \to E$ dérivable.

    **1.** Montrer que $\lVert f \rVert$ est constante si et seulement si $\langle f(t), f'(t) \rangle = 0$ pour tout $t \in I$.

    **2.** Montrer que $\lVert f \rVert$ est dérivable en tout point où $f$ ne s'annule pas, et calculer sa dérivée.

    **3.** *Conservation de l'énergie.* On suppose $f$ deux fois dérivable et $f'' = -\omega^{2}f$, avec $\omega > 0$. Montrer que $\lVert f' \rVert^{2} + \omega^{2}\lVert f \rVert^{2}$ est constante. Interpréter pour $f(t) = (\cos\omega t, 2\sin\omega t)$.
  corrige: |
    **1.** La fonction $\lVert f \rVert^{2} = \langle f, f \rangle$ est dérivable, de dérivée $2\langle f, f' \rangle$ (cours, exemple du produit scalaire). Elle est constante sur l'intervalle $I$ si et seulement si cette dérivée est nulle, et $\lVert f \rVert$ est constante si et seulement si $\lVert f \rVert^{2}$ l'est.

    **2.** Là où $f$ ne s'annule pas, $\lVert f \rVert = \sqrt{\lVert f \rVert^{2}}$ est la composée d'une fonction dérivable à valeurs dans $]0, +\infty[$ par la racine, dérivable sur cet intervalle. 
    $$\boxed{\lVert f \rVert' = \frac{\langle f, f' \rangle}{\lVert f \rVert}}$$

    **3.** On dérive l'énergie $\mathcal{E} = \lVert f' \rVert^{2} + \omega^{2}\lVert f \rVert^{2}$ : 
    $$\mathcal{E}' = 2\langle f', f'' \rangle + 2\omega^{2}\langle f, f' \rangle = 2\langle f', f'' + \omega^{2}f \rangle = 0.$$
     Pour $f(t) = (\cos\omega t, 2\sin\omega t)$, on a bien $f'' = -\omega^{2}f$, et 
    $$\lVert f' \rVert^{2} + \omega^{2}\lVert f \rVert^{2} = \omega^{2}(\sin^{2}\omega t + 4\cos^{2}\omega t) + \omega^{2}(\cos^{2}\omega t + 4\sin^{2}\omega t) = 5\omega^{2}.$$

    $$\boxed{\lVert f' \rVert^{2} + \omega^{2}\lVert f \rVert^{2} \text{ est constante} ; \text{ ici elle vaut } 5\omega^{2}}$$
     Le point parcourt une ellipse ; sa vitesse est maximale, égale à $2\omega$, aux sommets $(\pm 1, 0)$ les plus proches du centre, et minimale, égale à $\omega$, aux sommets $(0, \pm 2)$.
- id: "mp-06-39"
  feuille: "f-mp-06"
  numero: 39
  partie: "Dérivation des fonctions à valeurs vectorielles"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dérivation vectorielle, exponentielle, comparaison série-intégrale, dérivation]
  noeuds: [de-derivee, li-exponentielle, ri-integrable]
  notions: [derivable, exponentielle-matrice]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Formule de Liouville.* Soit $A : I \to \mathcal{M}_{n}(\mathbb{K})$ continue, et $x_{1}, \dots, x_{n} : I \to \mathbb{K}^{n}$ dérivables telles que $x_{j}'(t) = A(t)x_{j}(t)$ pour tout $j$ et tout $t$. On pose $w(t) = \det\big(x_{1}(t), \dots, x_{n}(t)\big)$.

    **1.** Soit $M \in \mathcal{M}_{n}(\mathbb{K})$. Montrer que l'application $(y_{1}, \dots, y_{n}) \mapsto \sum_{j=1}^{n} \det(y_{1}, \dots, My_{j}, \dots, y_{n})$ est $n$-linéaire alternée, et en déduire qu'elle vaut $\operatorname{tr}(M)\det(y_{1}, \dots, y_{n})$.

    **2.** Montrer que $w' = \operatorname{tr}(A)\,w$.

    **3.** En dérivant $t \mapsto \exp\big(-\int_{t_{0}}^{t} \operatorname{tr} A\big)w(t)$, en déduire que $w(t) = w(t_{0})\exp\Big(\displaystyle\int_{t_{0}}^{t} \operatorname{tr} A(s)\,\mathrm{d} s\Big)$. Que peut-on dire de la famille $\big(x_{1}(t), \dots, x_{n}(t)\big)$ si elle est libre pour une valeur de $t$ ? Le chapitre 16 reviendra sur ce résultat.
  corrige: |
    **1.** On vérifie la multilinéarité, puis le caractère alterné. Chaque terme est linéaire en chaque $y_{i}$, car $M$ est linéaire et $\det$ est $n$-linéaire. Supposons $y_{p} = y_{q} = y$ avec $p < q$. Les termes d'indice $j \notin \{p, q\}$ contiennent deux colonnes égales et sont nuls. Les deux termes restants sont $\det(\dots, My, \dots, y, \dots)$ et $\det(\dots, y, \dots, My, \dots)$, où $My$ est en position $p$, puis $q$ : ils sont opposés, puisque l'un se déduit de l'autre par l'échange des colonnes $p$ et $q$. Une forme $n$-linéaire alternée sur $\mathbb{K}^{n}$ est un multiple du déterminant (chapitre 17 de MPSI), et le facteur s'obtient sur la base canonique : $\det(e_{1}, \dots, Me_{j}, \dots, e_{n}) = m_{j,j}$, en développant selon la $j$-ième colonne. 
    $$\boxed{\sum_{j=1}^{n} \det(y_{1}, \dots, My_{j}, \dots, y_{n}) = \operatorname{tr}(M)\det(y_{1}, \dots, y_{n})}$$

    **2.** On dérive le déterminant (théorème 5 (iv)) et l'on applique la question 1 avec $M = A(t)$ : 
    $$w'(t) = \sum_{j=1}^{n} \det\big(x_{1}(t), \dots, A(t)x_{j}(t), \dots, x_{n}(t)\big) = \operatorname{tr} A(t)\,w(t).$$

    **3.** On pose $g(t) = \exp\big(-\mathop{\displaystyle \int_{t_{0}}^{t}} \operatorname{tr} A\big)w(t)$ ; la fonction $t \mapsto \mathop{\displaystyle \int_{t_{0}}^{t}} \operatorname{tr} A$ est une primitive de la fonction continue $\operatorname{tr} A$, et 
    $$g'(t) = -\operatorname{tr} A(t)\,g(t) + \exp\Big(-\int_{t_{0}}^{t} \operatorname{tr} A\Big)w'(t) = 0.$$

    $$\boxed{w(t) = w(t_{0})\exp\Big(\int_{t_{0}}^{t} \operatorname{tr} A(s)\,\mathrm{d} s\Big)}$$
     L'exponentielle ne s'annule pas : $w$ est soit identiquement nul, soit jamais nul. Si la famille est libre pour une valeur de $t$, elle l'est pour toutes. C'est la formule de Liouville, que le chapitre 16 utilisera pour les systèmes fondamentaux de solutions.
- id: "mp-06-40"
  feuille: "f-mp-06"
  numero: 40
  partie: "Intégration, accroissements finis, formules de Taylor"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [intégration et Taylor, comparaison série-intégrale]
  noeuds: [ri-integrable, de-taylor]
  notions: [polynome-taylor, trace]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    **1.** Calculer $\displaystyle\int_{0}^{\pi/2} (\cos t, \sin t, t)\,\mathrm{d} t$ et $\displaystyle\int_{0}^{1} \begin{pmatrix} t & t^{2} \\ \mathrm{e}^{t} & \frac{1}{1 + t} \end{pmatrix}\mathrm{d} t$.

    **2.** Vérifier sur le second exemple que la trace de l'intégrale est l'intégrale de la trace, et justifier ce fait en général.

    **3.** Calculer $\displaystyle\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t$ pour $n \in \mathbb{Z}$, et $\displaystyle\int_{0}^{\pi} \big(\cos(2t), \cos^{2}t\big)\,\mathrm{d} t$.
  corrige: |
    **1.** On intègre coordonnée par coordonnée, ce qui est la définition. 
    $$\boxed{\int_{0}^{\pi/2} (\cos t, \sin t, t)\,\mathrm{d} t = \Big(1, 1, \frac{\pi^{2}}{8}\Big), \qquad \int_{0}^{1} \begin{pmatrix} t & t^{2} \\ \mathrm{e}^{t} & \frac{1}{1 + t} \end{pmatrix}\mathrm{d} t = \begin{pmatrix} \frac{1}{2} & \frac{1}{3} \\ \mathrm{e} - 1 & \ln 2 \end{pmatrix}}$$

    **2.** La trace de la seconde intégrale est $\dfrac{1}{2} + \ln 2 = \mathop{\displaystyle \int_{0}^{1}} \big(t + \dfrac{1}{1 + t}\big)\,\mathrm{d} t$. En général, la trace est linéaire, et la proposition 5 (i) donne $\operatorname{tr}\mathop{\displaystyle \int} f = \mathop{\displaystyle \int} \operatorname{tr} f$.

    **3.** Pour $n \neq 0$, $t \mapsto \dfrac{\mathrm{e}^{\mathrm{i} nt}}{\mathrm{i} n}$ est une primitive $2\pi$-périodique de $\mathrm{e}^{\mathrm{i} nt}$ (théorème 6). Pour la dernière intégrale, $\cos^{2}t = \dfrac{1 + \cos 2t}{2}$. 
    $$\boxed{\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t = \begin{cases} 2\pi & \text{si } n = 0 \\ 0 & \text{sinon} \end{cases}, \qquad \int_{0}^{\pi} \big(\cos 2t, \cos^{2}t\big)\,\mathrm{d} t = \Big(0, \frac{\pi}{2}\Big)}$$
     La première formule est le point de départ des séries de Fourier, au chapitre 11.
