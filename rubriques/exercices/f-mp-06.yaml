  noeuds: [as-series, ri-integrable]
  notions: []
  source: "BibM@th, Séries numériques, exercice 23 ; Séries numériques (Sainte-Geneviève), exercice 60"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    *Reste de la série harmonique alternée.* On pose $R_{n} = \sum_{k=n+1}^{+\infty} \dfrac{(-1)^{k}}{k}$.

    **1.** Montrer que $\dfrac{(-1)^{k}}{k} = (-1)^{k}\displaystyle\int_{0}^{1} t^{k-1}\,\mathrm{d} t$, et en déduire que $R_{n} = (-1)^{n+1}\displaystyle\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t$.

    **2.** À l'aide d'une intégration par parties, montrer que $\displaystyle\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t \sim \frac{1}{2n}$, et en déduire un équivalent de $R_{n}$.

    **3.** Déterminer la nature de la série $\sum R_{n}$.
  corrige: |
    **1.** On écrit chaque terme comme une intégrale et l'on somme une série géométrique finie. Pour $N > n$, 
    $$\sum_{k=n+1}^{N} \frac{(-1)^{k}}{k} = \int_{0}^{1} \sum_{k=n+1}^{N} (-1)^{k}t^{k-1}\,\mathrm{d} t = (-1)^{n+1}\int_{0}^{1} \frac{t^{n}\big(1 - (-t)^{N-n}\big)}{1 + t}\,\mathrm{d} t.$$
     Le terme contenant $(-t)^{N-n}$ est majoré en valeur absolue par $\mathop{\displaystyle \int_{0}^{1}} t^{N}\,\mathrm{d} t = \dfrac{1}{N + 1} \to 0$. 
    $$\boxed{R_{n} = (-1)^{n+1}\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t}$$

    **2.** On intègre par parties, en intégrant $t^{n}$ : 
    $$I_{n} = \int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t = \frac{1}{2(n + 1)} + \frac{1}{n + 1}\int_{0}^{1} \frac{t^{n+1}}{(1 + t)^{2}}\,\mathrm{d} t, \qquad 0 \leqslant \int_{0}^{1} \frac{t^{n+1}}{(1 + t)^{2}}\,\mathrm{d} t \leqslant \frac{1}{n + 2}.$$

    $$\boxed{I_{n} \sim \frac{1}{2n}, \qquad R_{n} \sim \frac{(-1)^{n+1}}{2n}}$$

    **3.** La suite $(I_{n})$ décroît, puisque $t^{n+1} \leqslant t^{n}$ sur $[0, 1]$, et tend vers $0$ : $\mathop{\displaystyle \sum} R_{n} = \mathop{\displaystyle \sum} (-1)^{n+1}I_{n}$ relève du théorème des séries alternées. 
    $$\boxed{\sum R_{n} \text{ converge, mais pas absolument}}$$
     L'équivalent $R_{n} \sim \dfrac{(-1)^{n+1}}{2n}$ dit que la somme partielle d'une série alternée est, à l'ordre principal, à mi-chemin entre deux sommes partielles consécutives : la moyenne $S_{n} + \dfrac{(-1)^{n+1}}{2(n + 1)}$ approche bien mieux la somme que $S_{n}$.
- id: "mp-06-34"
  feuille: "f-mp-06"
  numero: 34
  partie: "Compléments sur les séries numériques"
  etoiles: 2
