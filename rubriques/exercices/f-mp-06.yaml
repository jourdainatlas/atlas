  enonce: |
    Soit $(u_{n})$ une suite de réels positifs.

    **1.** Montrer que les séries $\sum u_{n}$ et $\sum \frac{u_{n}}{1 + u_{n}}$ sont de même nature.

    **2.** On suppose que $\sum u_{n}$ converge. Montrer que $\sum \sqrt{u_{n}u_{n+1}}$ et $\sum \frac{\sqrt{u_{n}}}{n}$ convergent, à l'aide de l'inégalité $\sqrt{xy} \leqslant \frac{x + y}{2}$.

    **3.** Montrer que, si $(u_{n})$ est décroissante, la convergence de $\sum \sqrt{u_{n}u_{n+1}}$ entraîne celle de $\sum u_{n}$. Montrer que ce n'est plus vrai sans hypothèse de monotonie.
  corrige: |
    **1.** On compare $v_{n} = \dfrac{u_{n}}{1 + u_{n}}$ à $u_{n}$. On a $v_{n} \leqslant u_{n}$. Réciproquement, si $\mathop{\displaystyle \sum} v_{n}$ converge, $v_{n} \to 0$, donc $u_{n} = \dfrac{v_{n}}{1 - v_{n}} \to 0$ et $u_{n} \sim v_{n}$.

    **2.** On applique $\sqrt{xy} \leqslant \dfrac{x + y}{2}$ : $\sqrt{u_{n}u_{n+1}} \leqslant \dfrac{u_{n} + u_{n+1}}{2}$, et $\dfrac{\sqrt{u_{n}}}{n} = \sqrt{u_{n}\cdot\dfrac{1}{n^{2}}} \leqslant \dfrac{1}{2}\big(u_{n} + \dfrac{1}{n^{2}}\big)$.

    **3.** Si $(u_{n})$ décroît, $\sqrt{u_{n}u_{n+1}} \geqslant u_{n+1}$. Sans monotonie, on prend $u_{2k} = 1$ et $u_{2k+1} = \dfrac{1}{k^{4}}$ pour $k \geqslant 1$ : $\sqrt{u_{n}u_{n+1}} \leqslant \dfrac{1}{k^{2}}$ avec $k = \lfloor n/2 \rfloor$, d'où la convergence, alors que $\mathop{\displaystyle \sum} u_{n}$ diverge grossièrement. 
    $$\boxed{\text{Mêmes natures en 1 ; convergence en 2 ; la réciproque de 3 exige la décroissance}}$$
- id: "mp-06-33"
  feuille: "f-mp-06"
  numero: 33
  partie: "Compléments sur les séries numériques"
  etoiles: 2
  types: [Démonstration, Calcul]
