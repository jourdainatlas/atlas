  enonce: |
    *Étude locale par Taylor-Young.* On reprend l'astroïde $f(t) = (\cos^{3}t, \sin^{3}t)$ de l'exercice 35.

    **1.** Montrer que $f(t) = (1, 0) + t^{2}\Big(-\dfrac{3}{2}, 0\Big) + t^{3}(0, 1) + o(t^{3})$ quand $t \to 0$.

    **2.** En déduire que, pour $t$ voisin de $0$, $f(t)$ est à gauche de la droite $x = 1$, du côté $y > 0$ si $t > 0$ et du côté $y < 0$ si $t < 0$. Dessiner l'allure de la courbe près de $(1, 0)$ : c'est un point de rebroussement.

    **3.** Pour la courbe de Lissajous $g(t) = (\sin t, \sin 2t)$ du cours, donner de même le développement de $g$ en $t = 0$ et en $t = \pi$ à l'ordre $1$, et retrouver les deux tangentes à l'origine.
  corrige: |
    **1.** On compose les développements usuels : $\cos^{3}t = \big(1 - \dfrac{t^{2}}{2} + o(t^{3})\big)^{3} = 1 - \dfrac{3t^{2}}{2} + o(t^{3})$ et $\sin^{3}t = \big(t + o(t^{2})\big)^{3} = t^{3} + o(t^{4})$. 
    $$\boxed{f(t) = (1, 0) + t^{2}\Big(-\frac{3}{2}, 0\Big) + t^{3}(0, 1) + o(t^{3})}$$
     Ce développement est aussi celui de Taylor-Young (théorème 8 (iii)) : $f''(0) = (-3, 0)$ et $f'''(0) = (0, 6)$.

    **2.** L'abscisse vaut $1 - \dfrac{3t^{2}}{2} + o(t^{2}) < 1$ pour $t \neq 0$ voisin de $0$, et l'ordonnée $t^{3}(1 + o(1))$ a le signe de $t$. Les deux branches $t > 0$ et $t < 0$ arrivent en $(1, 0)$ depuis la gauche, tangentes à l'axe des abscisses, l'une au-dessus, l'autre au-dessous. 
    $$\boxed{(1, 0) \text{ est un point de rebroussement de première espèce}}$$
     Le premier vecteur dérivé non nul, d'ordre $p = 2$, donne la tangente ; le suivant non colinéaire, d'ordre $q = 3$, donne la position : $p$ pair et $q$ impair caractérisent ce rebroussement.

    **3.** On développe à l'ordre $1$ : $g(t) = (t, 2t) + o(t)$, et $g(\pi + h) = (-\sin h, \sin 2h) = (-h, 2h) + o(h)$. 
    $$\boxed{\text{Tangentes à l'origine : } y = 2x \ (t = 0) \text{ et } y = -2x \ (t = \pi)}$$
