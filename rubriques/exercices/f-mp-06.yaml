  source: "cours, section 6.5 (contre-exemple de l'égalité des accroissements finis)"
  page_enonce: 9
  page_corrige: 19
  enonce: |
    Soit $f(t) = \mathrm{e}^{\mathrm{i} t}$ et $\theta \in \, ]0, 2\pi]$.

    **1.** Montrer que $|f(\theta) - f(0)| = 2\big|\sin\frac{\theta}{2}\big| < \theta$.

    **2.** En déduire qu'il n'existe aucun $c \in \, ]0, \theta[$ tel que $f(\theta) - f(0) = \theta f'(c)$. Interpréter : la vitesse moyenne est strictement plus petite, en norme, que la vitesse instantanée.
  corrige: |
    **1.** On factorise l'angle moitié : 
    $$\mathrm{e}^{\mathrm{i}\theta} - 1 = \mathrm{e}^{\mathrm{i}\theta/2}\big(\mathrm{e}^{\mathrm{i}\theta/2} - \mathrm{e}^{-\mathrm{i}\theta/2}\big) = 2\mathrm{i}\sin\frac{\theta}{2}\,\mathrm{e}^{\mathrm{i}\theta/2},$$
     donc $|f(\theta) - f(0)| = 2\big|\sin\dfrac{\theta}{2}\big|$, et $|\sin x| < x$ pour $x > 0$.

    **2.** Pour tout $c$, $|\theta f'(c)| = \theta|\mathrm{i}\mathrm{e}^{\mathrm{i} c}| = \theta > |f(\theta) - f(0)|$. 
    $$\boxed{\text{Aucun } c \text{ ne vérifie } f(\theta) - f(0) = \theta f'(c)}$$
     La corde est strictement plus courte que l'arc : la vitesse moyenne, qui ne voit que les extrémités, sous-estime une vitesse instantanée de norme constante. L'inégalité des accroissements finis reste vraie ; seule l'égalité est perdue.
- id: "mp-06-43"
