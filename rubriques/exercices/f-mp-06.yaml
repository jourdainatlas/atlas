  enonce: |
    *Perspective : les suites de Cauchy.* Ce qui suit est hors programme : il éclaire la remarque du cours sur $\mathbb{R}[X]$. Une suite $(x_{n})$ d'un espace vectoriel normé $(F, \lVert \cdot \rVert)$ est dite *de Cauchy* si 
    $$\forall \varepsilon > 0, \ \exists N \in \mathbb{N}, \ \forall p, q \geqslant N, \quad \lVert x_{p} - x_{q} \rVert \leqslant \varepsilon.$$

    **1.** Montrer qu'une suite convergente est de Cauchy, et qu'une suite de Cauchy est bornée.

    **2.** On suppose $F$ de dimension finie. Soit $(x_{n})$ une suite de Cauchy. Montrer, à l'aide du théorème de Bolzano-Weierstrass (chapitre 5), qu'elle admet une valeur d'adhérence $\ell$, puis qu'elle converge vers $\ell$.

    **3.** On dit que $F$ est *complet* si toute suite de Cauchy de $F$ converge. Montrer que, dans un espace complet, toute série absolument convergente converge, en majorant $\lVert S_{q} - S_{p} \rVert$. On retrouve le théorème 1.

    **4.** Dans $\mathbb{R}[X]$ muni de $N_{\infty}$, montrer que les sommes partielles de $\sum \frac{X^{n}}{2^{n}}$ forment une suite de Cauchy qui ne converge pas. Quelle conclusion en tirer sur $(\mathbb{R}[X], N_{\infty})$ ?
  corrige: |
    **1.** Si $x_{n} \to \ell$, on choisit $N$ tel que $\lVert x_{n} - \ell \rVert \leqslant \dfrac{\varepsilon}{2}$ pour $n \geqslant N$, et $\lVert x_{p} - x_{q} \rVert \leqslant \lVert x_{p} - \ell \rVert + \lVert \ell - x_{q} \rVert \leqslant \varepsilon$. Si $(x_{n})$ est de Cauchy, on prend $\varepsilon = 1$ : pour $p \geqslant N$, $\lVert x_{p} \rVert \leqslant \lVert x_{N} \rVert + 1$, et les $N$ premiers termes sont en nombre fini.

    **2.** La suite est bornée : par le théorème de Bolzano-Weierstrass en dimension finie (chapitre 5), elle admet une sous-suite $(x_{\varphi(k)})$ convergeant vers un $\ell$. Soit $\varepsilon > 0$ et $N$ comme dans la définition. Pour $p \geqslant N$ et $k$ assez grand pour que $\varphi(k) \geqslant N$ et $\lVert x_{\varphi(k)} - \ell \rVert \leqslant \varepsilon$, 
    $$\lVert x_{p} - \ell \rVert \leqslant \lVert x_{p} - x_{\varphi(k)} \rVert + \lVert x_{\varphi(k)} - \ell \rVert \leqslant 2\varepsilon.$$

    $$\boxed{\text{Un espace vectoriel normé de dimension finie est complet}}$$

    **3.** Pour $q > p$, $\lVert S_{q} - S_{p} \rVert \leqslant \mathop{\displaystyle \sum_{k=p+1}^{q}} \lVert u_{k} \rVert \leqslant \mathop{\displaystyle \sum_{k > p}} \lVert u_{k} \rVert$, reste d'une série numérique convergente, qui tend vers $0$ : $(S_{n})$ est de Cauchy, donc converge. 
    $$\boxed{\text{Dans un espace complet, la convergence absolue entraîne la convergence}}$$

    **4.** Pour $q > p$, $N_{\infty}(S_{q} - S_{p}) = \mathop{\displaystyle \max_{p < k \leqslant q}} \dfrac{1}{2^{k}} = \dfrac{1}{2^{p+1}}$ : la suite est de Cauchy. La remarque du cours montre qu'elle ne converge pas : une limite $P$ aurait pour coefficients les $\dfrac{1}{2^{k}}$, tous non nuls. 
    $$\boxed{(\mathbb{R}[X], N_{\infty}) \text{ n'est pas complet}}$$
     C'est exactement la propriété qui manquait dans la remarque du cours. L'espace des suites tendant vers $0$, muni de la norme de la borne supérieure, complète $(\mathbb{R}[X], N_{\infty})$ : la « somme » de $\mathop{\displaystyle \sum} \dfrac{X^{n}}{2^{n}}$ y existe, c'est la suite $\big(\dfrac{1}{2^{n}}\big)$.
- id: "mp-06-49"
  feuille: "f-mp-06"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [synthèse, convergence absolue, exponentielle, "règle de d'Alembert", relations de comparaison]
  noeuds: [as-series, li-exponentielle, as-dalembert-cauchy]
  notions: [serie-absolument-convergente, exponentielle-matrice, regle-dalembert]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Perspective : lecture critique.* Chacun des raisonnements suivants contient une erreur. La localiser, et dire si la conclusion est vraie ou fausse.

    **1.** « On a $\dfrac{(-1)^{n}}{\sqrt{n} + (-1)^{n}} \sim \dfrac{(-1)^{n}}{\sqrt{n}}$, et $\sum \frac{(-1)^{n}}{\sqrt{n}}$ converge par le théorème des séries alternées ; donc la série $\sum \frac{(-1)^{n}}{\sqrt{n} + (-1)^{n}}$ converge. »

    **2.** « Pour tout $n$, on a $\frac{u_{n+1}}{u_{n}} < 1$, où $u_{n} = \frac{1}{n}$ ; d'après la règle de d'Alembert, $\sum u_{n}$ converge. »

    **3.** « La fonction $f : t \mapsto \mathrm{e}^{\mathrm{i} t}$ vérifie $f(0) = f(2\pi)$ ; par le théorème de Rolle, il existe $c$ tel que $f'(c) = 0$. »

    **4.** « Pour $A$, $B \in \mathcal{M}_{d}(\mathbb{K})$, on a $\exp(A + B) = \exp(A)\exp(B)$, comme pour l'exponentielle complexe. »

    **5.** « Dans $(\mathbb{R}[X], N_{\infty})$, la série $\sum \frac{X^{n}}{2^{n}}$ est absolument convergente, donc convergente. »
  corrige: |
    **1.** L'équivalence ne transmet la nature que pour des termes de signe constant (théorème 3, et sa remarque). La conclusion est fausse : la série diverge (exercice 4 (a)).

    **2.** La règle de d'Alembert porte sur la *limite* du rapport, qui doit être $< 1$ ; ici le rapport tend vers $1$. La conclusion est fausse : la série harmonique diverge.

    **3.** Le théorème de Rolle repose sur l'ordre de $\mathbb{R}$ et ne vaut pas pour une fonction à valeurs dans $\mathbb{C}$. La conclusion est fausse : $|f'(c)| = 1$ pour tout $c$.

    **4.** La formule demande que $A$ et $B$ commutent (exercice 19). La conclusion est fausse en général (exercice 19, question 3).

    **5.** Le théorème 1 suppose la dimension finie. La conclusion est fausse : la série ne converge pas (cours, remarque du théorème 1, et exercice 48).

    $$\boxed{\text{Les cinq conclusions sont fausses}}$$
- id: "mp-06-50"
  feuille: "f-mp-06"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [synthèse, séries de Riemann, relations de comparaison, dérivation]
  noeuds: [as-series, de-derivee]
  notions: [serie-riemann, derivable]
  source: "BibM@th, Séries numériques, exercice 41 ; cours, section 6.3 (série harmonique)"
  page_enonce: 12
  page_corrige: 23
  enonce: |
    *Perspective : calculer $\gamma$.*

    **1.** Montrer que $\dfrac{1}{k^{2}} - \Big(\dfrac{1}{k - 1} - \dfrac{1}{k}\Big) \sim -\dfrac{1}{k^{3}}$, et en déduire $\displaystyle\sum_{k=n+1}^{+\infty} \frac{1}{k^{2}} = \frac{1}{n} - \frac{1}{2n^{2}} + o\Big(\frac{1}{n^{2}}\Big)$.

    **2.** En reprenant l'exemple du cours avec un terme de plus, montrer que 
    $$H_{n} = \ln n + \gamma + \frac{1}{2n} - \frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big).$$

    **3.** On exécute le programme suivant, où `g` contient la valeur $\gamma \approx 0{,}577\,215\,664\,9$. 

    ```python
    from math import log
    g = 0.5772156649015329
    for n in [10, 100, 1000]:
        H = sum(1 / k for k in range(1, n + 1))
        g1 = H - log(n)
        g2 = g1 - 1 / (2 * n)
        g3 = g2 + 1 / (12 * n ** 2)
        print(n, g1 - g, g2 - g, g3 - g)
    ```

     Prévoir l'ordre de grandeur des trois erreurs affichées pour chaque valeur de $n$. On obtient, pour $n = 100$, environ $5 \cdot 10^{-3}$, $-8{,}3 \cdot 10^{-6}$ et $8{,}3 \cdot 10^{-11}$ : quelle est, d'après ces valeurs, la vitesse de décroissance de la dernière erreur ?
  corrige: |
    **1.** On calcule la différence : $\dfrac{1}{k^{2}} - \dfrac{1}{k(k - 1)} = -\dfrac{1}{k^{2}(k - 1)} \sim -\dfrac{1}{k^{3}}$. Le reste de la série télescopique vaut $\mathop{\displaystyle \sum_{k > n}} \big(\dfrac{1}{k - 1} - \dfrac{1}{k}\big) = \dfrac{1}{n}$, et par le théorème 3 (i) et l'exercice 20 (c), 
    $$\sum_{k > n} \frac{1}{k^{2}} = \frac{1}{n} - \sum_{k > n} \frac{1}{k^{2}(k - 1)} = \frac{1}{n} - \frac{1}{2n^{2}} + o\Big(\frac{1}{n^{2}}\Big).$$

    **2.** On reprend $a_{n} = H_{n} - \ln n$, avec un terme de plus : 
    $$a_{k} - a_{k-1} = \frac{1}{k} + \ln\Big(1 - \frac{1}{k}\Big) = -\frac{1}{2k^{2}} - \frac{1}{3k^{3}} + O\Big(\frac{1}{k^{4}}\Big).$$
     En sommant de $n + 1$ à $+\infty$, avec la question 1 et l'exercice 20 (c), 
    $$\gamma - a_{n} = -\frac{1}{2}\Big(\frac{1}{n} - \frac{1}{2n^{2}}\Big) - \frac{1}{3}\cdot\frac{1}{2n^{2}} + o\Big(\frac{1}{n^{2}}\Big) = -\frac{1}{2n} + \frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big).$$

    $$\boxed{H_{n} = \ln n + \gamma + \frac{1}{2n} - \frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big)}$$

    **3.** Les erreurs prévues sont $\dfrac{1}{2n}$ pour `g1`, $-\dfrac{1}{12n^{2}}$ pour `g2`, et un $o\big(\dfrac{1}{n^{2}}\big)$ pour `g3`. Le programme affiche :

    ```tableau
    $n$ ¦ `g1 - g` ¦ `g2 - g` ¦ `g3 - g`
    $10$ ¦ $4{,}9 \cdot 10^{-2}$ ¦ $-8{,}3 \cdot 10^{-4}$ ¦ $8{,}3 \cdot 10^{-7}$
    $100$ ¦ $5{,}0 \cdot 10^{-3}$ ¦ $-8{,}3 \cdot 10^{-6}$ ¦ $8{,}3 \cdot 10^{-11}$
    $1000$ ¦ $5{,}0 \cdot 10^{-4}$ ¦ $-8{,}3 \cdot 10^{-8}$ ¦ $8{,}8 \cdot 10^{-15}$
    ```

    Quand $n$ est multiplié par $10$, la dernière erreur est divisée par $10^{4}$ : elle est de la forme $\dfrac{c}{n^{4}}$, avec $c \approx 8{,}3 \cdot 10^{-3}$, c'est-à-dire $c \approx \dfrac{1}{120}$. Le terme en $\dfrac{1}{n^{3}}$ est donc nul, et le suivant vaut $\dfrac{1}{120n^{4}}$. 
    $$\boxed{\texttt{g3} - \gamma \approx \frac{1}{120n^{4}}}$$
     Pour $n = 1000$, la valeur affichée est faussée par la précision des flottants, voisine de $10^{-16}$ par opération : l'erreur théorique, $8{,}3 \cdot 10^{-15}$, est du même ordre que les erreurs d'arrondi accumulées dans la somme.
