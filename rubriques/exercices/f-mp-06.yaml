  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Suites récurrentes et théorème de Cesàro.* Dans chaque cas, montrer que la suite est bien définie et monotone, déterminer sa limite, puis un équivalent, en appliquant le théorème de Cesàro à une suite de la forme $\varphi(u_{n+1}) - \varphi(u_{n})$ :

    **1.** $u_{0} > 0$ et $u_{n+1} = u_{n} + \dfrac{1}{u_{n}}$, avec $\varphi(x) = x^{2}$ ;

    **2.** $u_{0} > 0$ et $u_{n+1} = u_{n}\mathrm{e}^{-u_{n}}$, avec $\varphi(x) = \frac{1}{x}$ ;

    **3.** $u_{0} > 0$ et $u_{n+1} = \ln(1 + u_{n})$ ;

    **4.** $u_{0} > 0$ et $u_{n+1} = \operatorname{th}(u_{n})$.

    Pour les deux derniers cas, on choisira $\varphi$ de la forme $x \mapsto x^{-p}$.
  corrige: |
    Dans chaque cas, une récurrence immédiate montre que $u_{n} > 0$.

    **1.** La suite croît. Si elle convergeait vers $\ell > 0$, on aurait $\ell = \ell + \dfrac{1}{\ell}$ : elle tend vers $+\infty$. Alors $u_{n+1}^{2} - u_{n}^{2} = 2 + \dfrac{1}{u_{n}^{2}} \to 2$, et le théorème de Cesàro donne $\dfrac{u_{n}^{2} - u_{0}^{2}}{n} \to 2$.

    **2.** Comme $\mathrm{e}^{-u_{n}} < 1$, la suite décroît vers $\ell \geqslant 0$ tel que $\ell = \ell\mathrm{e}^{-\ell}$, donc $\ell = 0$. Alors 
    $$\frac{1}{u_{n+1}} - \frac{1}{u_{n}} = \frac{\mathrm{e}^{u_{n}} - 1}{u_{n}} \to 1, \qquad\text{d'où}\qquad \frac{1}{nu_{n}} \to 1.$$

    **3.** Comme $\ln(1 + x) < x$ pour $x > 0$, la suite décroît vers $\ell = \ln(1 + \ell)$, donc $\ell = 0$. Le développement $\dfrac{1}{\ln(1 + x)} = \dfrac{1}{x} + \dfrac{1}{2} + O(x)$ donne $\dfrac{1}{u_{n+1}} - \dfrac{1}{u_{n}} \to \dfrac{1}{2}$.

    **4.** Comme $\operatorname{th} x < x$ pour $x > 0$, la suite décroît vers $0$. On a $\operatorname{th} x = x - \dfrac{x^{3}}{3} + o(x^{3})$, d'où $\dfrac{1}{\operatorname{th}^{2}x} = \dfrac{1}{x^{2}}\big(1 + \dfrac{2x^{2}}{3} + o(x^{2})\big)$ et $\dfrac{1}{u_{n+1}^{2}} - \dfrac{1}{u_{n}^{2}} \to \dfrac{2}{3}$. 
    $$\boxed{\text{1. } u_{n} \sim \sqrt{2n} ; \quad \text{2. } u_{n} \sim \frac{1}{n} ; \quad \text{3. } u_{n} \sim \frac{2}{n} ; \quad \text{4. } u_{n} \sim \sqrt{\frac{3}{2n}}}$$
     Le choix de $\varphi$ se fait en cherchant $p$ tel que $u_{n+1}^{-p} - u_{n}^{-p}$ ait une limite finie non nulle. Si la récurrence s'écrit $u_{n+1} = f(u_{n})$ avec 
    $$f(x) = x - ax^{q+1} + o(x^{q+1}),$$
     on prend $p = q$, et la limite vaut $aq$.
- id: "mp-06-29"
  feuille: "f-mp-06"
  numero: 29
  partie: "Compléments sur les séries numériques"
  etoiles: 3
