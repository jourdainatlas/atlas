  page_corrige: 2
  enonce: |
    Soit $u \in \mathcal{L}(E)$.

    **1.** Montrer que $\mathrm{Ker}\,(u^{*} \circ u) = \mathrm{Ker}\, u$, puis que $\mathrm{Im}\,(u^{*} \circ u) = \mathrm{Im}\, u^{*}$. Comparer les rangs de $u$, $u^{*}$, $u^{*} \circ u$ et $u \circ u^{*}$.

    **2.** Montrer que $u^{*} \circ u$ est autoadjoint et que $\langle u^{*}u(x), x \rangle \geqslant 0$ pour tout $x$.

    **3.** Traduire ces résultats pour une matrice $A \in \mathcal{M}_{n,p}(\mathbb{R})$ : rang de ${A}^{T}A$, et positivité.
  corrige: |
    **1.** On compare les noyaux, puis les dimensions. L'inclusion $\mathrm{Ker}\, u \subset \mathrm{Ker}\,(u^{*} \circ u)$ est claire ; réciproquement, si $u^{*}u(x) = 0$, alors $\lVert u(x) \rVert^{2} = \langle u^{*}u(x), x \rangle = 0$. Ainsi $\mathrm{rg}(u^{*} \circ u) = \mathrm{rg} u$ par le théorème du rang. Comme $\mathrm{Im}\,(u^{*} \circ u) \subset \mathrm{Im}\, u^{*}$ et que $\mathrm{rg}u^{*} = \mathrm{rg} u$ (proposition 2), les deux images sont égales. En appliquant ce qui précède à $u^{*}$, on obtient $\mathrm{rg}(u \circ u^{*}) = \mathrm{rg}u^{*}$. 
    $$\boxed{\mathrm{Ker}\,(u^{*}u) = \mathrm{Ker}\, u, \quad \mathrm{Im}\,(u^{*}u) = \mathrm{Im}\, u^{*}, \quad \mathrm{rg} u = \mathrm{rg}u^{*} = \mathrm{rg}(u^{*}u) = \mathrm{rg}(uu^{*})}$$

    **2.** On a $(u^{*} \circ u)^{*} = u^{*} \circ (u^{*})^{*} = u^{*} \circ u$, et $\langle u^{*}u(x), x \rangle = \lVert u(x) \rVert^{2} \geqslant 0$.

    **3.** On applique ces résultats à l'application linéaire $X \mapsto AX$ de $\mathbb{R}^{p}$ dans $\mathbb{R}^{n}$ ; les démonstrations s'étendent sans changement entre deux espaces euclidiens. 
    $$\boxed{\mathrm{rg}({A}^{T}A) = \mathrm{rg} A, \qquad {A}^{T}A \in \mathcal{S}_{p}^{+}(\mathbb{R})}$$
- id: "mp-07-06"
