  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 24"
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soient $a$, $b$ deux vecteurs unitaires non colinéaires, $c = \langle a, b \rangle$, et $u : x \mapsto \langle b, x \rangle a + \langle a, x \rangle b$.

    **1.** Montrer que $u$ est autoadjoint. Calculer $u(a + b)$ et $u(a - b)$, et en déduire les éléments propres de $u$.

    **2.** En déduire $\sup\limits_{\lVert x \rVert = 1} |\langle a, x \rangle\langle b, x \rangle|$ en fonction de $c$.
  corrige: |
    **1.** La forme $\langle u(x), y \rangle = \langle b, x \rangle\langle a, y \rangle + \langle a, x \rangle\langle b, y \rangle$ est symétrique en $x$, $y$. On calcule 
    $$u(a + b) = (c + 1)a + (1 + c)b = (1 + c)(a + b), \qquad u(a - b) = (c - 1)a + (1 - c)b = (c - 1)(a - b),$$
     et $u$ est nul sur $\mathrm{Vect}(a, b)^{\perp}$. Comme $a$ et $b$ ne sont pas colinéaires, $|c| < 1$ et les trois valeurs $1 + c > 0$, $c - 1 < 0$ et $0$ sont distinctes. 
    $$\boxed{\operatorname{Sp}(u) = \{1 + c, \ c - 1, \ 0\}, \quad \text{de sous-espaces propres } \mathbb{R}(a + b), \ \mathbb{R}(a - b), \ \mathrm{Vect}(a, b)^{\perp}}$$
     La dernière valeur propre n'apparaît que si $n \geqslant 3$.

    **2.** On a $\langle u(x), x \rangle = 2\langle a, x \rangle\langle b, x \rangle$. Par le théorème 5, sur la sphère unité, $\langle u(x), x \rangle$ décrit $[c - 1, 1 + c]$ (exercice 47), donc 
    $$\boxed{\sup_{\lVert x \rVert = 1} |\langle a, x \rangle\langle b, x \rangle| = \frac{1}{2}\max(1 + c, 1 - c) = \frac{1 + |c|}{2}}$$
     atteint en $\frac{a + b}{\lVert a + b \rVert}$ si $c \geqslant 0$, et en $\frac{a - b}{\lVert a - b \rVert}$ sinon.
- id: "mp-07-43"
  feuille: "f-mp-07"
  numero: 43
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 2
