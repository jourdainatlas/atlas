  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale, groupe-orthogonal, projection-orthogonale]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 7"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $u = (a, b, c)$ un vecteur unitaire de $\mathbb{R}^{3}$, et $f$ l'endomorphisme canoniquement associé à 
    $$A = \begin{pmatrix} a^{2} & ab - c & ac + b \\ ab + c & b^{2} & bc - a \\ ac - b & bc + a & c^{2} \end{pmatrix}.$$

    **1.** Montrer que $f = p + g$, où $p$ est la projection orthogonale sur $\mathbb{R} u$ et $g : x \mapsto u \wedge x$.

    **2.** En déduire que $f$ est une rotation dont on précisera l'axe et l'angle.
  corrige: |
    **1.** On identifie les deux termes : $A = U{U}^{T} + K$, où $U$ est la colonne $(a, b, c)$ et $K = \begin{pmatrix} 0 & -c & b \\ c & 0 & -a \\ -b & a & 0 \end{pmatrix}$ est la matrice de $x \mapsto u \wedge x$. La matrice $U{U}^{T}$, de coefficients $a^{2}$, $ab$, …, est celle de $p : x \mapsto \langle u, x \rangle u$, puisque $u$ est unitaire. 
    $$\boxed{f(x) = \langle u, x \rangle u + u \wedge x}$$

    **2.** On a $f(u) = u$. Pour $x \in u^{\perp}$, $f(x) = u \wedge x$, qui est, comme à l'exercice 28, la rotation d'angle $\frac{\pi}{2}$ de $u^{\perp}$ orienté par $u$. 
    $$\boxed{f \text{ est la rotation d'axe } \mathbb{R} u \text{ orienté par } u, \text{ d'angle } \frac{\pi}{2}}$$
     On vérifie que $\operatorname{tr} A = a^{2} + b^{2} + c^{2} = 1 = 1 + 2\cos\frac{\pi}{2}$, et la formule de Rodrigues avec $\theta = \frac{\pi}{2}$ donne exactement $A$.
