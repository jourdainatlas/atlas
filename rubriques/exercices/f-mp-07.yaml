  enonce: |
    Soit $f \in \mathcal{L}(E)$ et $P$, $Q \in \mathbb{R}[X]$ premiers entre eux. Montrer que $\mathrm{Ker}\, P(f)$ et $\mathrm{Ker}\, Q(f^{*})$ sont orthogonaux. En déduire que, si $\lambda \neq \mu$, les sous-espaces $\mathrm{Ker}\,(f - \lambda\mathrm{id}_{E})$ et $\mathrm{Ker}\,(f^{*} - \mu\mathrm{id}_{E})$ sont orthogonaux.
  corrige: |
    On utilise une relation de Bézout $UP + VQ = 1$, et l'égalité $P(f)^{*} = P(f^{*})$, conséquence de la proposition 2. Soient $x \in \mathrm{Ker}\, P(f)$ et $y \in \mathrm{Ker}\, Q(f^{*})$. Alors 
    $$y = U(f^{*})P(f^{*})(y) + V(f^{*})Q(f^{*})(y) = P(f^{*})\big(U(f^{*})(y)\big),$$
     et 
    $$\langle x, y \rangle = \Big\langle x, P(f)^{*}\big(U(f^{*})(y)\big) \Big\rangle = \Big\langle P(f)(x), U(f^{*})(y) \Big\rangle = 0.$$

    $$\boxed{\mathrm{Ker}\, P(f) \perp \mathrm{Ker}\, Q(f^{*}), \qquad \mathrm{Ker}\,(f - \lambda\mathrm{id}) \perp \mathrm{Ker}\,(f^{*} - \mu\mathrm{id}) \ \text{ si } \lambda \neq \mu}$$
     La seconde affirmation est le cas $P = X - \lambda$, $Q = X - \mu$. Pour $f$ autoadjoint, on retrouve l'orthogonalité des sous-espaces propres (proposition 11).
- id: "mp-07-07"
  feuille: "f-mp-07"
  numero: 7
  partie: "Adjoint d'un endomorphisme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint, isométries, projection orthogonale]
  noeuds: [me-produit-scalaire, f-autoadjoints, fq-orthogonalite]
  notions: [matrice-orthogonale, projection-orthogonale, produit-scalaire]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $p$ un projecteur de $E$.

    **1.** Montrer que $p^{*}$ est un projecteur, et exprimer son noyau et son image à l'aide de ceux de $p$.

    **2.** Montrer que $p$ et $p^{*}$ commutent si et seulement si $p$ est un projecteur orthogonal.

    **3.** Montrer que $p$ est orthogonal si et seulement si $\lVert p(x) \rVert \leqslant \lVert x \rVert$ pour tout $x \in E$.
  corrige: |
    **1.** On passe à l'adjoint dans $p^{2} = p$ : $(p^{*})^{2} = (p^{2})^{*} = p^{*}$. La proposition 2 (iii) donne le noyau et l'image. 
    $$\boxed{p^{*} \text{ est le projecteur sur } (\mathrm{Ker}\, p)^{\perp} \text{ parallèlement à } (\mathrm{Im}\, p)^{\perp}}$$

    **2.** Si $p$ est orthogonal, $p^{*} = p$ (proposition 10). Réciproquement, si $pp^{*} = p^{*}p$, alors pour tout $x$, 
    $$\lVert p(x) \rVert^{2} = \langle p^{*}p(x), x \rangle = \langle pp^{*}(x), x \rangle = \lVert p^{*}(x) \rVert^{2},$$
     donc $\mathrm{Ker}\, p = \mathrm{Ker}\,p^{*} = (\mathrm{Im}\, p)^{\perp}$ : le noyau et l'image de $p$ sont orthogonaux. 
    $$\boxed{p \circ p^{*} = p^{*} \circ p \iff p \text{ est un projecteur orthogonal}}$$

    **3.** Si $p$ est orthogonal, le théorème de Pythagore donne $\lVert x \rVert^{2} = \lVert p(x) \rVert^{2} + \lVert x - p(x) \rVert^{2} \geqslant \lVert p(x) \rVert^{2}$. Réciproquement, soient $y \in \mathrm{Im}\, p$ et $z \in \mathrm{Ker}\, p$. Pour tout $t \in \mathbb{R}$, $p(y + tz) = y$, d'où 
    $$\lVert y \rVert^{2} \leqslant \lVert y + tz \rVert^{2} = \lVert y \rVert^{2} + 2t\langle y, z \rangle + t^{2}\lVert z \rVert^{2}.$$
     Le trinôme $2t\langle y, z \rangle + t^{2}\lVert z \rVert^{2}$ reste positif au voisinage de $0$ seulement si $\langle y, z \rangle = 0$. 
    $$\boxed{p \text{ orthogonal} \iff \forall x, \ \lVert p(x) \rVert \leqslant \lVert x \rVert}$$
     *Piège.* Un projecteur non orthogonal peut allonger certains vecteurs : la projection sur $\mathbb{R}(1, 0)$ parallèlement à $\mathbb{R}(1, 1)$ s'écrit $p(x, y) = (x - y, 0)$, et envoie $(1, -1)$, de norme $\sqrt{2}$, sur $(2, 0)$, de norme $2$.
- id: "mp-07-08"
  feuille: "f-mp-07"
  numero: 8
