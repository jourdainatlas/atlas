  enonce: |
    Soit $u \in \mathbb{R}^{3}$ non nul. Montrer que $f : x \mapsto u \wedge (u \wedge x)$ est autoadjoint, en utilisant la formule du double produit vectoriel $u \wedge (u \wedge x) = \langle u, x \rangle u - \lVert u \rVert^{2}x$, et déterminer ses éléments propres. Interpréter $-\frac{1}{\lVert u \rVert^{2}}f$.
  corrige: |
    Par la formule du double produit vectoriel, $f(x) = \langle u, x \rangle u - \lVert u \rVert^{2}x$ est une combinaison linéaire de $x \mapsto \langle u, x \rangle u$, autoadjoint (exercice 40), et de l'identité. 
    $$\boxed{f \in \mathcal{S}(E), \qquad \mathrm{Ker}\, f = \mathbb{R} u, \qquad \mathrm{Ker}\,(f + \lVert u \rVert^{2}\mathrm{id}) = u^{\perp}}$$
     Ainsi $-\frac{1}{\lVert u \rVert^{2}}f : x \mapsto x - \frac{\langle u, x \rangle}{\lVert u \rVert^{2}}u$ est la projection orthogonale sur le plan $u^{\perp}$.
- id: "mp-07-42"
  feuille: "f-mp-07"
  numero: 42
  partie: "Endomorphismes autoadjoints, théorème spectral"
