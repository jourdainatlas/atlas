  notions: [produit-scalaire]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $\varphi$ une forme linéaire sur $\mathcal{M}_{n}(\mathbb{R})$. Montrer qu'il existe une unique matrice $A \in \mathcal{M}_{n}(\mathbb{R})$ telle que $\varphi(M) = \operatorname{tr}(AM)$ pour toute $M \in \mathcal{M}_{n}(\mathbb{R})$. Déterminer $A$ lorsque $\varphi(M)$ est la somme des coefficients de $M$.
  corrige: |
    On se ramène à la représentation des formes linéaires (proposition 1). Comme 
    $$\operatorname{tr}(AM) = \operatorname{tr}\big({({A}^{T})}^{T}M\big) = \langle {A}^{T}, M \rangle,$$
     la forme $\varphi$ s'écrit $\operatorname{tr}(A\,\cdot)$ si et seulement si $\varphi = \langle {A}^{T}, \cdot \rangle$. La proposition 1 fournit un unique $B$ tel que $\varphi = \langle B, \cdot \rangle$, et $A = {B}^{T}$ convient, de façon unique. Pour la somme des coefficients, 
    $$\sum_{i,j} m_{i,j} = \sum_{i,j} 1 \cdot m_{i,j} = \langle J, M \rangle = \operatorname{tr}({J}^{T}M), \qquad {J}^{T} = J.$$

    $$\boxed{\exists!\,A \in \mathcal{M}_{n}(\mathbb{R}), \ \varphi = \operatorname{tr}(A\,\cdot) ; \qquad \text{somme des coefficients : } A = J}$$
- id: "mp-07-02"
  feuille: "f-mp-07"
