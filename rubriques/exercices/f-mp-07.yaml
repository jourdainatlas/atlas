  enonce: |
    Soit $f : E \to E$ une application, a priori non linéaire, telle que $\langle f(x), f(y) \rangle = \langle x, y \rangle$ pour tous $x$, $y$. En développant $\lVert f(x + \lambda y) - f(x) - \lambda f(y) \rVert^{2}$, montrer que $f$ est linéaire, donc une isométrie.
  corrige: |
    On développe le carré de la norme en utilisant seulement la conservation des produits scalaires : 
    $$\lVert f(x + \lambda y) - f(x) - \lambda f(y) \rVert^{2} = \lVert (x + \lambda y) - x - \lambda y \rVert^{2} = 0,$$
     car chacun des neuf produits scalaires $\langle f(\cdot), f(\cdot) \rangle$ du développement est égal au produit scalaire correspondant des antécédents. Donc $f(x + \lambda y) = f(x) + \lambda f(y)$. 
    $$\boxed{f \text{ est linéaire, et c'est une isométrie}}$$
     *Piège.* La conservation de la norme seule ne suffit pas : $x \mapsto \lVert x \rVert e$, avec $e$ unitaire, conserve la norme sans être linéaire. En revanche, une application qui conserve les distances et fixe $0$ conserve le produit scalaire, par polarisation, donc est linéaire.
- id: "mp-07-22"
  feuille: "f-mp-07"
  numero: 22
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [isométries]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 34"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soient $u$, $v \in \mathrm{O}(E)$ et $\lambda \in \, ]0, 1[$ tels que $\lambda u + (1 - \lambda)v \in \mathrm{O}(E)$. Montrer que $u = v$. On utilisera le cas d'égalité dans l'inégalité triangulaire pour une norme euclidienne.
  corrige: |
    Soit $x \in E$. Comme $w = \lambda u + (1 - \lambda)v$ est une isométrie, 
    $$\lVert x \rVert = \lVert w(x) \rVert \leqslant \lambda\lVert u(x) \rVert + (1 - \lambda)\lVert v(x) \rVert = \lVert x \rVert.$$
     L'inégalité triangulaire est donc une égalité : pour une norme euclidienne, cela impose que $\lambda u(x)$ et $(1 - \lambda)v(x)$ soient positivement colinéaires. Deux vecteurs positivement colinéaires de même norme $\lVert x \rVert$ sont égaux. 
    $$\boxed{u = v}$$
     Géométriquement, les isométries sont des points « extrémaux » de la boule unité de $\mathcal{L}(E)$ pour la norme subordonnée.
- id: "mp-07-23"
  feuille: "f-mp-07"
  numero: 23
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [isométries, réflexions]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 8"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $a \in E$ non nul, $\sigma$ la réflexion d'hyperplan $a^{\perp}$ et $\varphi \in \mathrm{O}(E)$.

    **1.** Montrer que $\varphi \circ \sigma \circ \varphi^{-1}$ est la réflexion d'hyperplan $\varphi(a)^{\perp}$.

    **2.** En déduire que $\varphi$ et $\sigma$ commutent si et seulement si $\varphi(a) \in \{a, -a\}$.

    **3.** Déterminer les $\psi \in \mathrm{O}(E)$ qui commutent avec toutes les isométries de $E$.
  corrige: |
    **1.** On note $\sigma' = \varphi\sigma\varphi^{-1}$, isométrie involutive. Pour $y \in \varphi(a)^{\perp} = \varphi(a^{\perp})$, $\varphi^{-1}(y) \in a^{\perp}$ est fixé par $\sigma$, donc $\sigma'(y) = y$ ; et $\sigma'(\varphi(a)) = \varphi(-a) = -\varphi(a)$. 
    $$\boxed{\varphi \circ \sigma \circ \varphi^{-1} \text{ est la réflexion d'hyperplan } \varphi(a)^{\perp}}$$

    **2.** On a $\varphi\sigma = \sigma\varphi$ si et seulement si $\varphi\sigma\varphi^{-1} = \sigma$, c'est-à-dire si les hyperplans $\varphi(a)^{\perp}$ et $a^{\perp}$ coïncident, ou encore si $\varphi(a) \in \mathbb{R} a$ ; comme $\lVert \varphi(a) \rVert = \lVert a \rVert$, cela équivaut à $\varphi(a) = \pm a$.

    **3.** Si $\psi$ commute avec toutes les réflexions, la question 2 donne $\psi(a) = \pm a$ pour tout $a \neq 0$ : tout vecteur non nul est propre, et $\psi$ est une homothétie, par un résultat classique de première année : si $\psi(a) = \lambda_{a}a$ pour tout $a$, la comparaison de $\psi(a + b)$ avec $\psi(a) + \psi(b)$ pour $a$, $b$ indépendants donne $\lambda_{a} = \lambda_{b}$. Le rapport vaut $\pm 1$. Réciproquement, $\pm\mathrm{id}$ commutent avec tout. 
    $$\boxed{\psi \in \{\mathrm{id}_{E}, -\mathrm{id}_{E}\}}$$
     C'est le centre du groupe $\mathrm{O}(E)$.
- id: "mp-07-24"
  feuille: "f-mp-07"
  numero: 24
