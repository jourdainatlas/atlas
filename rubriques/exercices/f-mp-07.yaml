  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 36"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $u \in \mathcal{L}(E)$ qui conserve l'orthogonalité : si $\langle x, y \rangle = 0$, alors $\langle u(x), u(y) \rangle = 0$. Soit $(e_{1}, \dots, e_{n})$ une base orthonormée.

    **1.** En considérant $e_{i} + e_{j}$ et $e_{i} - e_{j}$, montrer que les $\lVert u(e_{i}) \rVert$ sont tous égaux à un même réel $k \geqslant 0$.

    **2.** En déduire qu'il existe $v \in \mathrm{O}(E)$ tel que $u = kv$.
  corrige: |
    **1.** Les vecteurs $e_{i} + e_{j}$ et $e_{i} - e_{j}$ sont orthogonaux pour $i \neq j$, donc leurs images aussi : 
    $$0 = \langle u(e_{i}) + u(e_{j}), u(e_{i}) - u(e_{j}) \rangle = \lVert u(e_{i}) \rVert^{2} - \lVert u(e_{j}) \rVert^{2}.$$

    **2.** Si $k = 0$, $u = 0$ et $v = \mathrm{id}$ convient. Sinon, $v = \frac{1}{k}u$ envoie la base orthonormée $(e_{i})$ sur une famille de vecteurs unitaires, deux à deux orthogonaux puisque $u$ conserve l'orthogonalité : $v$ est une isométrie (théorème 2 (iii)). 
    $$\boxed{u = kv, \quad k \geqslant 0, \quad v \in \mathrm{O}(E)}$$
     Ces endomorphismes sont les *similitudes* vectorielles : ils conservent les angles.
