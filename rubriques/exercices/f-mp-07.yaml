  page_enonce: 10
  page_corrige: 20
  enonce: |
    Soient $A \in \mathcal{S}_{n}^{+}(\mathbb{R})$ et $\Omega \in \mathrm{O}(n)$. Montrer que $\operatorname{tr}(A\Omega) \leqslant \operatorname{tr}(A)$. On diagonalisera $A$ dans une base orthonormée, et l'on majorera les coefficients diagonaux d'une matrice orthogonale.
  corrige: |
    On diagonalise : $A = PD{P}^{T}$, $P \in \mathrm{O}(n)$, $D = \operatorname{diag}(d_{i})$ avec $d_{i} \geqslant 0$. Alors 
    $$\operatorname{tr}(A\Omega) = \operatorname{tr}(D\,{P}^{T}\Omega P) = \operatorname{tr}(D\Omega'),$$
     avec $\Omega' = {P}^{T}\Omega P \in \mathrm{O}(n)$, dont les coefficients sont dans $[-1, 1]$ (colonnes unitaires). Donc 
    $$\operatorname{tr}(A\Omega) = \sum_{i} d_{i}\omega'_{i,i} \leqslant \sum_{i} d_{i} = \operatorname{tr} A.$$

    $$\boxed{\operatorname{tr}(A\Omega) \leqslant \operatorname{tr}(A)}$$
     Il y a égalité pour $\Omega = I_{n}$ : parmi les isométries, l'identité maximise $\Omega \mapsto \operatorname{tr}(A\Omega)$, résultat utilisé pour trouver la rotation qui superpose au mieux deux nuages de points.
- id: "mp-07-55"
  feuille: "f-mp-07"
  numero: 55
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [autoadjoints positifs, positivité]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [operateur-autoadjoint]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 26 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 32"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    *Racine carrée et décomposition polaire.*

    **1.** Soit $A \in \mathcal{S}_{n}^{+}(\mathbb{R})$. Montrer qu'il existe une unique $R \in \mathcal{S}_{n}^{+}(\mathbb{R})$ telle que $R^{2} = A$. Pour l'unicité, on montrera que $R$ commute avec $A$, donc stabilise ses sous-espaces propres, sur lesquels elle induit une homothétie.

    **2.** Calculer la racine carrée de $\begin{pmatrix} 5 & 4 \\ 4 & 5 \end{pmatrix}$.

    **3.** Soit $M \in \mathrm{GL}_{n}(\mathbb{R})$. Montrer qu'il existe un unique couple $(\Omega, S) \in \mathrm{O}(n) \times \mathcal{S}_{n}^{++}(\mathbb{R})$ tel que $M = \Omega S$. On prendra pour $S$ la racine carrée de ${M}^{T}M$.
  corrige: |
    **1.** *Existence.* Avec $A = P\operatorname{diag}(\lambda_{i}){P}^{T}$, $R = P\operatorname{diag}(\sqrt{\lambda_{i}}){P}^{T}$ convient. *Unicité.* Si $R \in \mathcal{S}_{n}^{+}(\mathbb{R})$ et $R^{2} = A$, alors $R$ commute avec $A$ et stabilise chaque $E_{\lambda}(A)$ (exercice 45). L'induit par $R$ sur $E_{\lambda}(A)$ est autoadjoint positif, de carré $\lambda\mathrm{id}$ : ses valeurs propres $\mu \geqslant 0$ vérifient $\mu^{2} = \lambda$, donc $\mu = \sqrt{\lambda}$, et, étant diagonalisable, il est égal à $\sqrt{\lambda}\mathrm{id}$. Ainsi $R$ est déterminée. 
    $$\boxed{\exists!\,R \in \mathcal{S}_{n}^{+}(\mathbb{R}), \quad R^{2} = A}$$

    **2.** Les valeurs propres sont $9$, sur $\mathbb{R}(1, 1)$, et $1$, sur $\mathbb{R}(1, -1)$ : $R$ a les mêmes vecteurs propres, de valeurs propres $3$ et $1$. 
    $$\boxed{\sqrt{\begin{pmatrix} 5 & 4 \\ 4 & 5 \end{pmatrix}} = \begin{pmatrix} 2 & 1 \\ 1 & 2 \end{pmatrix}}$$

    **3.** *Existence.* ${M}^{T}M \in \mathcal{S}_{n}^{++}(\mathbb{R})$ car $M$ est inversible ; soit $S$ sa racine carrée, définie positive, et $\Omega = MS^{-1}$. Alors 
    $${\Omega}^{T}\Omega = S^{-1}{M}^{T}MS^{-1} = S^{-1}S^{2}S^{-1} = I_{n}.$$
     *Unicité.* Si $M = \Omega S$, alors ${M}^{T}M = S{\Omega}^{T}\Omega S = S^{2}$, donc $S$ est la racine carrée de ${M}^{T}M$, et $\Omega = MS^{-1}$. 
    $$\boxed{\exists!\,(\Omega, S) \in \mathrm{O}(n) \times \mathcal{S}_{n}^{++}(\mathbb{R}), \quad M = \Omega S}$$
     C'est l'analogue matriciel de l'écriture $z = \mathrm{e}^{\mathrm{i}\theta}|z|$ d'un complexe non nul ; pour $M$ non inversible, l'existence subsiste (par densité et compacité de $\mathrm{O}(n)$), mais pas l'unicité.
- id: "mp-07-56"
  feuille: "f-mp-07"
  numero: 56
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [autoadjoints positifs, théorème spectral]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [operateur-autoadjoint, matrice-symetrique]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercices 11 et 30"
  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Réduction simultanée.* Soit $A \in \mathcal{S}_{n}^{++}(\mathbb{R})$ et $B \in \mathcal{S}_{n}(\mathbb{R})$.

    **1.** Montrer qu'il existe $P \in \mathrm{GL}_{n}(\mathbb{R})$ telle que $A = {P}^{T}P$.

    **2.** Montrer qu'il existe $R \in \mathrm{GL}_{n}(\mathbb{R})$ et $D$ diagonale telles que $A = {R}^{T}R$ et $B = {R}^{T}DR$. On appliquera le théorème spectral à ${(P^{-1})}^{T}BP^{-1}$.

    **3.** En déduire que le polynôme $\det(B - XA)$ est scindé sur $\mathbb{R}$, et que $A^{-1}B$ est diagonalisable.
  corrige: |
    **1.** On écrit $A = QD{Q}^{T}$, avec $D = \operatorname{diag}(d_{i})$ et $d_{i} > 0$. La matrice $P = \sqrt{D}\,{Q}^{T}$ convient : 
    $${P}^{T}P = Q\sqrt{D}\sqrt{D}\,{Q}^{T} = A.$$

    **2.** La matrice $C = {(P^{-1})}^{T}BP^{-1}$ est symétrique : $C = U\Delta{U}^{T}$ avec $U \in \mathrm{O}(n)$ et $\Delta$ diagonale. Avec $R = {U}^{T}P$, 
    $${R}^{T}R = {P}^{T}U{U}^{T}P = A, \qquad {R}^{T}\Delta R = {P}^{T}U\Delta{U}^{T}P = {P}^{T}CP = B.$$

    $$\boxed{A = {R}^{T}R, \qquad B = {R}^{T}\Delta R}$$

    **3.** On factorise : $\det(B - XA) = \det\big({R}^{T}(\Delta - XI_{n})R\big) = (\det R)^{2}\prod_{i}(\delta_{i} - X)$. Par ailleurs, 
    $$A^{-1}B = R^{-1}\big({R}^{T}\big)^{-1}{R}^{T}\Delta R = R^{-1}\Delta R.$$

    $$\boxed{\det(B - XA) \text{ est scindé sur } \mathbb{R}, \qquad A^{-1}B \text{ est diagonalisable}}$$
     Géométriquement : $A$ définit un produit scalaire (exercice 52), pour lequel $A^{-1}B$ est autoadjoint, et le théorème spectral s'applique dans ce nouvel espace euclidien.
- id: "mp-07-57"
  feuille: "f-mp-07"
  numero: 57
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [autoadjoints positifs, autoadjoints]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [operateur-autoadjoint, fonction-convexe]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 16"
  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Matrices symétriques et topologie.*

    **1.** Montrer que $\mathcal{S}_{n}(\mathbb{R})$ et $\mathcal{S}_{n}^{+}(\mathbb{R})$ sont des fermés de $\mathcal{M}_{n}(\mathbb{R})$.

    **2.** Montrer que $\mathcal{S}_{n}^{++}(\mathbb{R})$ est un ouvert de $\mathcal{S}_{n}(\mathbb{R})$. On pourra utiliser la compacité de la sphère unité, et la continuité de l'application 
    $$S \mapsto \min\{{X}^{T}SX \mid \lVert X \rVert = 1\}.$$

    **3.** Montrer que $\mathcal{S}_{n}^{++}(\mathbb{R})$ est dense dans $\mathcal{S}_{n}^{+}(\mathbb{R})$, et que $\mathcal{S}_{n}^{+}(\mathbb{R})$ est convexe.
  corrige: |
    **1.** $\mathcal{S}_{n}(\mathbb{R})$ est le noyau de l'application linéaire continue $A \mapsto A - {A}^{T}$. Puis 
    $$\mathcal{S}_{n}^{+}(\mathbb{R}) = \mathcal{S}_{n}(\mathbb{R}) \cap \bigcap_{X \in \mathbb{R}^{n}} \{A \mid {X}^{T}AX \geqslant 0\}$$
     est une intersection de fermés, chaque $A \mapsto {X}^{T}AX$ étant une forme linéaire continue.

    **2.** On note $m(S) = \min\{{X}^{T}SX \mid \lVert X \rVert = 1\}$, atteint par compacité de la sphère, égal à $\lambda_{\min}(S)$ (théorème 5). Pour $X$ unitaire, $|{X}^{T}SX - {X}^{T}S'X| \leqslant |\mkern-1.5mu|\mkern-1.5mu|S - S'|\mkern-1.5mu|\mkern-1.5mu|$, d'où $|m(S) - m(S')| \leqslant |\mkern-1.5mu|\mkern-1.5mu|S - S'|\mkern-1.5mu|\mkern-1.5mu|$ : $m$ est $1$-lipschitzienne. Alors $\mathcal{S}_{n}^{++}(\mathbb{R}) = \{S \in \mathcal{S}_{n}(\mathbb{R}) \mid m(S) > 0\}$ est un ouvert de $\mathcal{S}_{n}(\mathbb{R})$.

    **3.** Pour $S \in \mathcal{S}_{n}^{+}(\mathbb{R})$, $S + \frac{1}{k}I_{n} \in \mathcal{S}_{n}^{++}(\mathbb{R})$ et tend vers $S$. La convexité vient de 
    $${X}^{T}\big(tA + (1 - t)B\big)X = t\,{X}^{T}AX + (1 - t){X}^{T}BX \geqslant 0.$$

    $$\boxed{\mathcal{S}_{n}^{+}(\mathbb{R}) \text{ fermé convexe}, \quad \mathcal{S}_{n}^{++}(\mathbb{R}) \text{ ouvert de } \mathcal{S}_{n}(\mathbb{R}), \text{ dense dans } \mathcal{S}_{n}^{+}(\mathbb{R})}$$
     *Piège.* $\mathcal{S}_{n}^{++}(\mathbb{R})$ n'est pas un ouvert de $\mathcal{M}_{n}(\mathbb{R})$ : il est contenu dans $\mathcal{S}_{n}(\mathbb{R})$, d'intérieur vide dans $\mathcal{M}_{n}(\mathbb{R})$ pour $n \geqslant 2$.
- id: "mp-07-58"
  feuille: "f-mp-07"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, adjoint, isométries, rotations, projection orthogonale, autoadjoints, théorème spectral, positivité]
  noeuds: [f-autoadjoints, fq-orthogonalite, f-spectral-fini]
  notions: [matrice-orthogonale, groupe-orthogonal, projection-orthogonale, operateur-autoadjoint, matrice-symetrique, valeur-propre]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Une matrice dont les colonnes sont deux à deux orthogonales est orthogonale.

    **2.** Si $A \in \mathrm{O}(n)$, alors ${A}^{T} \in \mathrm{O}(n)$.

    **3.** Toute matrice symétrique réelle est diagonalisable dans une base orthonormée.

    **4.** Toute matrice réelle diagonalisable est symétrique.

    **5.** Le produit de deux matrices symétriques est symétrique.

    **6.** Toute rotation de $\mathbb{R}^{3}$ distincte de l'identité admet une unique droite de vecteurs fixes.

    **7.** Les seules valeurs propres réelles possibles d'une isométrie sont $1$ et $-1$.

    **8.** Une matrice symétrique réelle à coefficients strictement positifs est définie positive.

    **9.** Un projecteur autoadjoint est un projecteur orthogonal.

    **10.** Pour toute $A \in \mathcal{M}_{n}(\mathbb{R})$, la matrice ${A}^{T}A$ est symétrique positive.
  corrige: |
    **1.** **Faux.** Les colonnes de $\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ sont orthogonales mais de norme $\sqrt{2}$ ; il faut aussi qu'elles soient unitaires.

    **2.** **Vrai.** ${A}^{T} = A^{-1}$, et $\mathrm{O}(n)$ est un groupe (proposition 3).

    **3.** **Vrai.** C'est le théorème spectral (théorème 4).

    **4.** **Faux.** $\begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$ est diagonalisable, mais pas symétrique.

    **5.** **Faux.** $\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix} = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ ; le produit est symétrique si et seulement si les facteurs commutent (exercice 45).

    **6.** **Vrai.** Par la proposition 9, $\mathrm{Ker}\,(u - \mathrm{id})$ est la droite $\mathbb{R} e_{1}$ : le bloc $R(\theta)$, $\theta \notin 2\pi\mathbb{Z}$, n'a aucun vecteur fixe non nul.

    **7.** **Vrai.** C'est la proposition 8 (ii).

    **8.** **Faux.** $\begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$ a pour valeur propre $-1$ (exercice 50).

    **9.** **Vrai.** C'est la proposition 10 (iii).

    **10.** **Vrai.** ${X}^{T}{A}^{T}AX = \lVert AX \rVert^{2} \geqslant 0$ (exercice 5).

    $$\boxed{\text{Vrai : 2, 3, 6, 7, 9, 10 ; \quad Faux : 1, 4, 5, 8}}$$
