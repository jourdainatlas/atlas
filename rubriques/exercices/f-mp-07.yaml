  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 18 ; BibM@th, Endomorphismes dans un espace euclidien, exercice 9"
  page_enonce: 8
  page_corrige: 16
  enonce: |
    *Endomorphismes antisymétriques.*

    **1.** Soit $f \in \mathcal{L}(E)$. Montrer que $\langle f(x), x \rangle = 0$ pour tout $x$ si et seulement si $f^{*} = -f$. Que dire si de plus $f$ est autoadjoint ?

    **2.** On suppose $f^{*} = -f$. Montrer que la seule valeur propre réelle possible de $f$ est $0$, puis que $\mathrm{Ker}\, f = (\mathrm{Im}\, f)^{\perp}$.

    **3.** En déduire que $f$ est diagonalisable si et seulement si $f = 0$, et que le rang de $f$ est pair.

    **4.** Montrer qu'il existe une base orthonormée dans laquelle la matrice de $f$ est diagonale par blocs, avec des blocs $\begin{pmatrix} 0 & -\beta_{k} \\ \beta_{k} & 0 \end{pmatrix}$ et des zéros. On pourra appliquer le théorème spectral à $f^{2}$.
  corrige: |
    **1.** Si $\langle f(x), x \rangle = 0$ pour tout $x$, on polarise : $0 = \langle f(x + y), x + y \rangle = \langle f(x), y \rangle + \langle f(y), x \rangle$, donc $\langle f(x), y \rangle = \langle x, -f(y) \rangle$. La réciproque vient de $\langle f(x), x \rangle = -\langle x, f(x) \rangle$. Si de plus $f$ est autoadjoint, $f = -f$, donc $f = 0$. 
    $$\boxed{\forall x, \ \langle f(x), x \rangle = 0 \iff f^{*} = -f}$$

    **2.** Si $f(x) = \lambda x$ avec $x \neq 0$, alors $\lambda\lVert x \rVert^{2} = \langle f(x), x \rangle = 0$. Par la proposition 2, 
    $$\mathrm{Ker}\, f = \mathrm{Ker}\,(-f^{*}) = (\mathrm{Im}\, f)^{\perp}.$$

    **3.** Diagonalisable de seule valeur propre réelle $0$, $f$ est nulle. Le sous-espace $\mathrm{Im}\, f$ est stable par $f$ et, par la question 2, en somme directe avec $\mathrm{Ker}\, f$ : l'induit sur $\mathrm{Im}\, f$ est injectif, donc bijectif, et sans valeur propre réelle. Un endomorphisme d'un espace réel de dimension impaire a une valeur propre réelle (son polynôme caractéristique, de degré impair, a une racine réelle), donc $\mathrm{rg} f$ est pair.

    **4.** L'endomorphisme $f^{2} = -f^{*}f$ est autoadjoint, de valeurs propres négatives, notées $-\beta^{2}$ avec $\beta \geqslant 0$. Ses sous-espaces propres sont orthogonaux et stables par $f$, qui commute avec $f^{2}$. Sur $\mathrm{Ker}\,(f^{2} + \beta^{2}\mathrm{id})$ avec $\beta > 0$, $\lVert f(x) \rVert^{2} = \langle -f^{2}(x), x \rangle = \beta^{2}\lVert x \rVert^{2}$ : $\frac{1}{\beta}f$ est une isométrie de carré $-\mathrm{id}$, et l'exercice 32 donne des blocs $\beta R\big(\frac{\pi}{2}\big)$. Sur $\mathrm{Ker}\, f^{2} = \mathrm{Ker}\, f$, la matrice est nulle. 
    $$\boxed{\mathrm{Mat}(f) = \operatorname{diag}\Big(\begin{pmatrix} 0 & -\beta_{1} \\ \beta_{1} & 0 \end{pmatrix}, \dots, \begin{pmatrix} 0 & -\beta_{r} \\ \beta_{r} & 0 \end{pmatrix}, 0, \dots, 0\Big)}$$
     On retrouve que le rang $2r$ est pair, et l'exercice 29 en dimension $3$, où $r = 1$ et $\beta_{1} = \lVert u \rVert$.
- id: "mp-07-44"
