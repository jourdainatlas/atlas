  enonce: |
    Déterminer les matrices orthogonales triangulaires supérieures.
  corrige: |
    Soit $T$ orthogonale et triangulaire supérieure. Son inverse ${T}^{T}$ est triangulaire inférieure ; mais l'inverse d'une matrice triangulaire supérieure inversible est triangulaire supérieure. Donc ${T}^{T}$, et $T$, sont diagonales, et une matrice diagonale orthogonale a des coefficients diagonaux de carré $1$. 
    $$\boxed{T = \operatorname{diag}(\varepsilon_{1}, \dots, \varepsilon_{n}), \quad \varepsilon_{i} \in \{-1, 1\}}$$
- id: "mp-07-15"
  feuille: "f-mp-07"
  numero: 15
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [isométries]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 28"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soient $a$, $b$, $c \in \mathbb{R}$ et $M = \begin{pmatrix} a & b & c \\ c & a & b \\ b & c & a \end{pmatrix}$. On pose $s = a + b + c$ et $\sigma = ab + bc + ca$.

    **1.** Montrer que $M \in \mathrm{O}(3)$ si et seulement si $\sigma = 0$ et $s \in \{-1, 1\}$.

    **2.** Montrer que $\det M = s(s^{2} - 3\sigma)$, et en déduire une condition nécessaire et suffisante pour que $M \in \mathrm{SO}(3)$.

    **3.** Montrer que les matrices de $\mathrm{SO}(3)$ de cette forme sont exactement les $M$ obtenues pour $(a, b, c)$ racines de $X^{3} - X^{2} + k$, avec $k \in [0, \frac{4}{27}]$.
  corrige: |
    **1.** On écrit que les colonnes sont orthonormées. Chacune a pour norme au carré $a^{2} + b^{2} + c^{2}$, et le produit scalaire de deux colonnes distinctes vaut, dans les trois cas, $ab + bc + ca = \sigma$. Ainsi $M \in \mathrm{O}(3)$ si et seulement si $a^{2} + b^{2} + c^{2} = 1$ et $\sigma = 0$, et comme $s^{2} = a^{2} + b^{2} + c^{2} + 2\sigma$, cela équivaut à $\sigma = 0$ et $s^{2} = 1$. 
    $$\boxed{M \in \mathrm{O}(3) \iff \sigma = 0 \text{ et } s = \pm 1}$$

    **2.** La règle de Sarrus et une identité classique donnent 
    $$\det M = a^{3} + b^{3} + c^{3} - 3abc = (a + b + c)(a^{2} + b^{2} + c^{2} - ab - bc - ca) = s(s^{2} - 3\sigma).$$
     Pour $M \in \mathrm{O}(3)$, $\det M = s$. 
    $$\boxed{M \in \mathrm{SO}(3) \iff \sigma = 0 \text{ et } s = 1}$$

    **3.** Les réels $a$, $b$, $c$ sont les racines de $X^{3} - sX^{2} + \sigma X - abc$. La condition de la question 2 s'écrit donc : $a$, $b$, $c$ sont les trois racines réelles de $X^{3} - X^{2} + k$, avec $k = -abc$. Ce polynôme a trois racines réelles (comptées avec multiplicité) si et seulement si son discriminant $4k - 27k^{2}$ est positif ou nul, c'est-à-dire $k \in [0, \frac{4}{27}]$ ; on peut aussi l'établir par l'étude de $x \mapsto x^{3} - x^{2}$, qui admet un maximum local $0$ en $0$ et un minimum local $-\frac{4}{27}$ en $\frac{2}{3}$. 
    $$\boxed{(a, b, c) \text{ racines de } X^{3} - X^{2} + k, \quad k \in \Big[0, \frac{4}{27}\Big]}$$
     Pour $k = 0$, on trouve $(1, 0, 0)$ et ses permutations circulaires, c'est-à-dire $I_{3}$ et les deux matrices de permutation circulaire.
- id: "mp-07-16"
  feuille: "f-mp-07"
  numero: 16
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [isométries]
  noeuds: [fq-orthogonalite]
