  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 23 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 28"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $S \in \mathcal{S}_{n}^{+}(\mathbb{R})$.

    **1.** Montrer que $\det(I_{n} + S) \geqslant 1 + \det S$, et en particulier $\det(I_{n} + S) \geqslant 1$.

    **2.** Montrer que $(\det S)^{1/n} \leqslant \frac{1}{n}\operatorname{tr} S$, à l'aide de l'inégalité arithmético-géométrique.
  corrige: |
    **1.** Avec les valeurs propres $\lambda_{i} \geqslant 0$ de $S$, $\det(I_{n} + S) = \prod(1 + \lambda_{i})$. En développant le produit, on obtient $1$, $\prod\lambda_{i}$ et d'autres termes positifs. 
    $$\boxed{\det(I_{n} + S) \geqslant 1 + \det S \geqslant 1}$$

    **2.** L'inégalité arithmético-géométrique pour les $\lambda_{i} \geqslant 0$ donne directement le résultat. 
    $$\boxed{(\det S)^{1/n} = \Big(\prod\lambda_{i}\Big)^{1/n} \leqslant \frac{1}{n}\sum\lambda_{i} = \frac{1}{n}\operatorname{tr} S}$$
- id: "mp-07-52"
  feuille: "f-mp-07"
  numero: 52
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [autoadjoints positifs, adjoint, rotations, autoadjoints]
  noeuds: [f-spectral-fini, f-autoadjoints, fq-orthogonalite]
  notions: [operateur-autoadjoint, groupe-orthogonal, produit-scalaire]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercices 25 et 31"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    **1.** Soit $A \in \mathcal{S}_{n}^{++}(\mathbb{R})$. Montrer que $(X, Y) \mapsto {X}^{T}AY$ est un produit scalaire sur $\mathcal{M}_{n,1}(\mathbb{R})$.

    **2.** Soit $u \in \mathcal{S}^{+}(E)$ et $x \in E$. Montrer que $\langle u(x), x \rangle = 0$ si et seulement si $x \in \mathrm{Ker}\, u$. Le résultat subsiste-t-il si $u$ est seulement autoadjoint ?
  corrige: |
    **1.** L'application est bilinéaire, symétrique puisque ${X}^{T}AY = {({X}^{T}AY)}^{T} = {Y}^{T}AX$, et définie positive par hypothèse.

    **2.** Dans une base orthonormée de vecteurs propres, $\langle u(x), x \rangle = \sum \lambda_{i}x_{i}^{2}$ avec $\lambda_{i} \geqslant 0$. Cette somme est nulle si et seulement si $x_{i} = 0$ pour tout $i$ tel que $\lambda_{i} > 0$, c'est-à-dire si $x$ est dans la somme des sous-espaces propres de valeur propre $0$, qui est $\mathrm{Ker}\, u$. 
    $$\boxed{u \in \mathcal{S}^{+}(E) : \ \langle u(x), x \rangle = 0 \iff x \in \mathrm{Ker}\, u}$$
     Pour $u$ seulement autoadjoint, c'est faux : $u = \operatorname{diag}(1, -1)$ et $x = (1, 1)$ donnent $\langle u(x), x \rangle = 0$ avec $u(x) \neq 0$.
- id: "mp-07-53"
  feuille: "f-mp-07"
  numero: 53
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [autoadjoints positifs, autoadjoints, positivité]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [operateur-autoadjoint]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 25 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 26"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    *Ordre de Löwner.* Pour $A$, $B \in \mathcal{S}_{n}(\mathbb{R})$, on note $A \preccurlyeq B$ si $B - A \in \mathcal{S}_{n}^{+}(\mathbb{R})$.

    **1.** Montrer que $\preccurlyeq$ est une relation d'ordre sur $\mathcal{S}_{n}(\mathbb{R})$. Est-elle totale ?

    **2.** Montrer que, si $I_{n} \preccurlyeq A$, alors $A$ est inversible et $A^{-1} \preccurlyeq I_{n}$.

    **3.** Montrer que, si $0 \preccurlyeq A \preccurlyeq B$, alors $\det A \leqslant \det B$. On se ramènera au cas $A$ définie positive, et l'on écrira $A = R^{2}$ avec $R$ symétrique définie positive.
  corrige: |
    **1.** La réflexivité vient de $0 \in \mathcal{S}_{n}^{+}(\mathbb{R})$, la transitivité de la stabilité de $\mathcal{S}_{n}^{+}(\mathbb{R})$ par addition. Si $A \preccurlyeq B$ et $B \preccurlyeq A$, la matrice symétrique $B - A$ a des valeurs propres positives et négatives, donc nulles, et elle est nulle. L'ordre n'est pas total : ni $\operatorname{diag}(1, 0) - \operatorname{diag}(0, 1)$ ni son opposée ne sont positives. 
    $$\boxed{\preccurlyeq \text{ est une relation d'ordre partiel}}$$

    **2.** On travaille dans une base orthonormée de vecteurs propres de $A$ : les valeurs propres de $A - I_{n}$ sont positives, donc celles de $A$ sont au moins $1$, et celles de $A^{-1}$, inverses, sont dans $]0, 1]$. Donc $I_{n} - A^{-1}$, diagonale dans la même base, est positive.

    **3.** Si $A$ n'est pas inversible, $\det A = 0 \leqslant \det B$, car $B$ est positive, puisque $B \succcurlyeq A \succcurlyeq 0$. Sinon, soit $R \in \mathcal{S}_{n}^{++}(\mathbb{R})$ telle que $A = R^{2}$ (exercice 55). La congruence par $R^{-1}$ préserve la positivité (${X}^{T}R^{-1}MR^{-1}X = {Y}^{T}MY$ avec $Y = R^{-1}X$), donc $R^{-1}BR^{-1} \succcurlyeq I_{n}$, dont les valeurs propres sont au moins $1$ : $\det(R^{-1}BR^{-1}) \geqslant 1$. 
    $$\boxed{0 \preccurlyeq A \preccurlyeq B \implies \det A \leqslant \det B}$$
- id: "mp-07-54"
