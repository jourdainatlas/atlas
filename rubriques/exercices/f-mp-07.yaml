  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 20"
  page_enonce: 14
  page_corrige: 26
  enonce: |
    *Théorème de Fischer-Cochran.* Soient $u_{1}, \dots, u_{p} \in \mathcal{S}(E)$ tels que 
    $$\sum_{i=1}^{p} \mathrm{rg} u_{i} = n \qquad\text{et}\qquad \forall x \in E, \quad \sum_{i=1}^{p} \langle u_{i}(x), x \rangle = \lVert x \rVert^{2}.$$

    **1.** Montrer que $\sum_{i} u_{i} = \mathrm{id}_{E}$. On utilisera l'exercice 43.

    **2.** En déduire que $E = \mathrm{Im}\, u_{1} \oplus \cdots \oplus \mathrm{Im}\, u_{p}$.

    **3.** Montrer que chaque $u_{j}$ est le projecteur sur $\mathrm{Im}\, u_{j}$ parallèlement à la somme des autres images, puis que c'est un projecteur orthogonal, et que les images sont deux à deux orthogonales.

    Ce théorème est à l'origine de la loi des sommes de carrés de variables gaussiennes, en statistique.
  corrige: |
    **1.** L'endomorphisme $v = \sum u_{i} - \mathrm{id}$ est autoadjoint et vérifie $\langle v(x), x \rangle = 0$ pour tout $x$ : par l'exercice 43, $v = 0$.

    **2.** Tout $x$ s'écrit $x = \sum u_{i}(x)$, donc $E = \sum \mathrm{Im}\, u_{i}$ ; comme la somme des dimensions vaut $n$, la somme est directe.

    **3.** Soit $x \in \mathrm{Im}\, u_{j}$. L'écriture $x = \sum_{i} u_{i}(x)$, avec $u_{i}(x) \in \mathrm{Im}\, u_{i}$, et l'écriture $x = x$ sont deux décompositions dans la somme directe : $u_{j}(x) = x$, et $u_{i}(x) = 0$ pour $i \neq j$. Ainsi $u_{j}$ est l'identité sur $\mathrm{Im}\, u_{j}$ et est nul sur les $\mathrm{Im}\, u_{i}$, $i \neq j$ : c'est le projecteur sur $\mathrm{Im}\, u_{j}$ parallèlement à la somme des autres images. Autoadjoint, il est orthogonal (proposition 10), donc $\mathrm{Im}\, u_{i} \subset \mathrm{Ker}\, u_{j} = (\mathrm{Im}\, u_{j})^{\perp}$. 
    $$\boxed{\sum u_{i} = \mathrm{id}, \quad u_{i} \text{ projecteurs orthogonaux}, \quad E = \mathrm{Im}\, u_{1} \overset{\perp}{\oplus} \cdots \overset{\perp}{\oplus} \mathrm{Im}\, u_{p}}$$
- id: "mp-07-67"
  feuille: "f-mp-07"
  numero: 67
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration, Calcul]
  mots_cles: [synthèse, autoadjoints, positivité]
  noeuds: [f-autoadjoints, f-spectral-fini]
  notions: [operateur-autoadjoint, valeur-propre, multiplicite-racine]
  page_enonce: 14
  page_corrige: 26
  enonce: |
    *Loi d'inertie de Sylvester.* Pour $S \in \mathcal{S}_{n}(\mathbb{R})$, on note $p(S)$ et $q(S)$ les nombres de valeurs propres strictement positives et strictement négatives, comptées avec multiplicité. Le couple $(p(S), q(S))$ est la *signature* de $S$. On dit que $S$ et $S'$ sont *congruentes* s'il existe $P \in \mathrm{GL}_{n}(\mathbb{R})$ telle que $S' = {P}^{T}SP$.

    **1.** Montrer que $p(S)$ est la dimension maximale d'un sous-espace $F$ de $\mathbb{R}^{n}$ tel que ${X}^{T}SX > 0$ pour tout $X \in F \setminus \{0\}$. On pourra utiliser le sous-espace engendré par les vecteurs propres associés aux valeurs propres positives ou nulles, et une intersection de sous-espaces.

    **2.** En déduire que deux matrices congruentes ont même signature, et même rang.

    **3.** Montrer que $S$ est congruente à $\operatorname{diag}(I_{p}, -I_{q}, 0_{n-p-q})$, avec $(p, q)$ sa signature. Conclure que deux matrices symétriques sont congruentes si et seulement si elles ont même signature.

    **4.** *Méthode de Gauss.* Soit $q(x, y, z) = x^{2} + 4xy + 2xz + y^{2} + 2z^{2}$. Vérifier que 
    $$q(x, y, z) = (x + 2y + z)^{2} - 3\Big(y + \frac{2z}{3}\Big)^{2} + \frac{7}{3}z^{2},$$
     et en déduire, sans calculer les valeurs propres, la signature de la matrice de $q$. Vérifier que son déterminant est négatif.

    **5.** Les matrices $\begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$ et $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$ sont-elles congruentes ? orthogonalement semblables ?
  corrige: |
    **1.** Soit $F_{+}$ le sous-espace engendré par les vecteurs propres associés aux valeurs propres strictement positives, de dimension $p$, et $G$ celui associé aux valeurs propres négatives ou nulles, de dimension $n - p$. Sur $F_{+} \setminus \{0\}$, ${X}^{T}SX > 0$. Si $F$ est un sous-espace de dimension $> p$ sur lequel ${X}^{T}SX > 0$, alors $\dim F + \dim G > n$, et un $X \neq 0$ de $F \cap G$ vérifie à la fois ${X}^{T}SX > 0$ et ${X}^{T}SX \leqslant 0$. 
    $$\boxed{p(S) = \max\{\dim F \mid \forall X \in F \setminus \{0\}, \ {X}^{T}SX > 0\}}$$

    **2.** Si $S' = {P}^{T}SP$, alors ${X}^{T}S'X = {(PX)}^{T}S(PX)$ : $F$ convient pour $S'$ si et seulement si $P(F)$, de même dimension, convient pour $S$. Donc $p(S') = p(S)$, et $q(S') = p(-S') = p(-S) = q(S)$. Le rang est conservé par multiplication par des matrices inversibles.

    **3.** On écrit $S = QD{Q}^{T}$ en rangeant les valeurs propres : positives, négatives, nulles. Avec $\Delta$ diagonale de coefficients $\frac{1}{\sqrt{|\lambda_{i}|}}$ pour $\lambda_{i} \neq 0$ et $1$ sinon, et $P = Q\Delta$, on a ${P}^{T}SP = \Delta D\Delta = \operatorname{diag}(I_{p}, -I_{q}, 0)$. La congruence est une relation d'équivalence ; deux matrices de même signature sont congruentes à la même matrice réduite, donc entre elles, et la réciproque est la question 2. 
    $$\boxed{S \text{ et } S' \text{ congruentes} \iff (p(S), q(S)) = (p(S'), q(S'))}$$

    **4.** Le développement redonne bien $q$ (calcul direct). Les formes linéaires $x + 2y + z$, $y + \frac{2z}{3}$ et $z$ sont indépendantes, puisque leur matrice est triangulaire à diagonale non nulle : le changement de variables correspondant montre que la matrice de $q$ est congruente à $\operatorname{diag}\big(1, -3, \frac{7}{3}\big)$. 
    $$\boxed{\text{signature } (2, 1), \qquad \det\begin{pmatrix} 1 & 2 & 1 \\ 2 & 1 & 0 \\ 1 & 0 & 2 \end{pmatrix} = -7 < 0}$$
     Le signe du déterminant, produit des valeurs propres, confirme qu'il y a un nombre impair de valeurs propres négatives. Les valeurs propres, irrationnelles, valent environ $-1{,}16$, $1{,}77$ et $3{,}39$ : la méthode de Gauss donne la signature sans les calculer.

    **5.** Les deux matrices ont pour valeurs propres $\{3, -1\}$ et $\{1, -1\}$ : même signature $(1, 1)$, donc congruentes ; spectres différents, donc non orthogonalement semblables, ni même semblables. 
    $$\boxed{\text{congruentes, mais pas orthogonalement semblables}}$$
     La loi d'inertie dit que, lorsqu'on change de base sans conserver le produit scalaire, seuls survivent les signes des valeurs propres ; le théorème spectral, avec changement de base orthonormée, conserve les valeurs propres elles-mêmes.

