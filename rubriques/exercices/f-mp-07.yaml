  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 29"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer les matrices orthogonales à coefficients entiers. Combien y en a-t-il dans $\mathrm{O}(n)$ ? Dans $\mathrm{SO}(n)$ ?
  corrige: |
    Chaque colonne d'une telle matrice est un vecteur unitaire à coordonnées entières : une seule coordonnée est non nulle, égale à $\pm 1$. Les colonnes étant orthogonales, les positions de ces coefficients sont distinctes : $M$ est une matrice de permutation dont certains $1$ sont changés en $-1$. Réciproquement, ces matrices sont orthogonales. On choisit la permutation ($n!$ façons) et les signes ($2^{n}$ façons). Le déterminant vaut $\varepsilon(\sigma)\prod \varepsilon_{i}$, et changer le premier signe échange les deux classes. 
    $$\boxed{|\mathrm{O}(n) \cap \mathcal{M}_{n}(\mathbb{Z})| = 2^{n}n!, \qquad |\mathrm{SO}(n) \cap \mathcal{M}_{n}(\mathbb{Z})| = 2^{n-1}n!}$$
     Ce sont les isométries de $\mathbb{R}^{n}$ qui préservent le cube $[-1, 1]^{n}$ ; pour $n = 3$, on obtient les $48$ isométries du cube et ses $24$ rotations.
- id: "mp-07-17"
  feuille: "f-mp-07"
  numero: 17
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [isométries]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal, produit-scalaire]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 30"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $M = (m_{i,j}) \in \mathrm{O}(n)$. Montrer que 
    $$\Big|\sum_{i,j} m_{i,j}\Big| \leqslant n \qquad\text{et}\qquad \sum_{i,j} |m_{i,j}| \leqslant n\sqrt{n}.$$
     Pour la première inégalité, on écrira la somme comme un produit scalaire ${U}^{T}MU$ ; pour la seconde, on utilisera l'inégalité de Cauchy-Schwarz dans $\mathbb{R}^{n^{2}}$. Étudier les cas d'égalité de la première inégalité.
  corrige: |
    On note $U$ la colonne dont tous les coefficients valent $1$ ; sa norme vaut $\sqrt{n}$, et celle de $MU$ aussi. L'inégalité de Cauchy-Schwarz donne 
    $$\Big|\sum_{i,j} m_{i,j}\Big| = \big|{U}^{T}MU\big| \leqslant \lVert U \rVert\,\lVert MU \rVert = n.$$
     Dans $\mathbb{R}^{n^{2}}$, on applique l'inégalité de Cauchy-Schwarz aux familles $(|m_{i,j}|)$ et $(1)$, sachant que la somme des $m_{i,j}^{2}$ vaut $n$ puisque les colonnes sont unitaires : 
    $$\sum_{i,j} |m_{i,j}| \leqslant \sqrt{n^{2}}\sqrt{\sum_{i,j} m_{i,j}^{2}} = n\sqrt{n}.$$

    $$\boxed{\Big|\sum_{i,j} m_{i,j}\Big| \leqslant n, \qquad \sum_{i,j} |m_{i,j}| \leqslant n\sqrt{n}}$$
     Il y a égalité dans la première si et seulement si $MU$ est colinéaire à $U$, c'est-à-dire $MU = \pm U$ : par exemple pour les matrices de permutation ($MU = U$). La seconde est une égalité pour la matrice $\frac{1}{\sqrt{2}}\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$, dont tous les coefficients ont même module.
- id: "mp-07-18"
  feuille: "f-mp-07"
  numero: 18
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [isométries, autoadjoints]
  noeuds: [fq-orthogonalite, f-autoadjoints]
  notions: [matrice-orthogonale, groupe-orthogonal, operateur-autoadjoint]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 17 ; Exponentielle matricielle (Prost, LLG), exercice 6, écarté au chapitre 6"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ symétrique telle que $A^{3} = I_{n}$. Montrer que $A = I_{n}$.

    **2.** Déterminer les matrices $A \in \mathcal{M}_{n}(\mathbb{R})$ telles que $A\,{A}^{T}A = I_{n}$. On montrera d'abord que $A$ est inversible et que ${A}^{T}A = A\,{A}^{T} = A^{-1}$.
  corrige: |
    **1.** Par le théorème spectral, $A$ est diagonalisable à valeurs propres réelles ; chacune vérifie $\lambda^{3} = 1$, donc $\lambda = 1$. Une matrice diagonalisable de seule valeur propre $1$ est $I_{n}$. 
    $$\boxed{A = I_{n}}$$

    **2.** On montre que $A$ est symétrique. La relation $A({A}^{T}A) = I_{n}$ montre que $A$ est inversible, d'inverse ${A}^{T}A$ ; la relation $(A{A}^{T})A = I_{n}$ montre que $A^{-1} = A\,{A}^{T}$. Ainsi $A^{-1}$ est symétrique, donc $A$ aussi, et la relation devient $A^{3} = I_{n}$. 
    $$\boxed{A\,{A}^{T}A = I_{n} \iff A = I_{n}}$$
     *Piège.* Sans hypothèse de symétrie, $A^{3} = I_{n}$ a bien d'autres solutions, comme la permutation circulaire de la feuille du chapitre 6 ou $R(\frac{2\pi}{3})$.
- id: "mp-07-19"
  feuille: "f-mp-07"
  numero: 19
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [isométries]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 35"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $n \geqslant 2$ et $a$, $b \in \mathbb{R}$. Déterminer les couples $(a, b)$ pour lesquels l'endomorphisme $M \mapsto aM + b\,{M}^{T}$ de $\mathcal{M}_{n}(\mathbb{R})$ est une isométrie. On utilisera l'exercice 3.
  corrige: |
    Par l'exercice 3, $\tau$ est la symétrie orthogonale par rapport à $\mathcal{S}_{n}(\mathbb{R})$ parallèlement à $\mathcal{A}_{n}(\mathbb{R})$. L'endomorphisme $T = a\mathrm{id} + b\tau$ agit par $a + b$ sur $\mathcal{S}_{n}(\mathbb{R})$ et par $a - b$ sur $\mathcal{A}_{n}(\mathbb{R})$, qui est non nul car $n \geqslant 2$. Dans une base orthonormée adaptée à $\mathcal{S}_{n}(\mathbb{R}) \overset{\perp}{\oplus} \mathcal{A}_{n}(\mathbb{R})$, sa matrice est diagonale, et $T$ est une isométrie si et seulement si $|a + b| = |a - b| = 1$. 
    $$\boxed{(a, b) \in \{(1, 0), (-1, 0), (0, 1), (0, -1)\}}$$
     On retrouve $\pm\mathrm{id}$ et $\pm\tau$ : la transposition est une isométrie de $\mathcal{M}_{n}(\mathbb{R})$.
- id: "mp-07-20"
  feuille: "f-mp-07"
  numero: 20
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [isométries, rotations]
