  enonce: |
    *Quotient de Rayleigh.*

    **1.** Déterminer le maximum et le minimum de $\sum_{1 \leqslant i < j \leqslant n} x_{i}x_{j}$ sur la sphère unité de $\mathbb{R}^{n}$, et les points où ils sont atteints. On écrira cette somme $\frac{1}{2}{X}^{T}(J - I_{n})X$.

    **2.** Soit $u \in \mathcal{S}(E)$ et $a \leqslant b$. Montrer que $\operatorname{Sp}(u) \subset [a, b]$ si et seulement si $\langle u(x) - ax, u(x) - bx \rangle \leqslant 0$ pour tout $x \in E$.

    **3.** Soit $u \in \mathcal{S}(E)$. Montrer que $W(u) = \{\langle u(x), x \rangle \mid \lVert x \rVert = 1\}$ est le segment $[\lambda_{\min}, \lambda_{\max}]$.
  corrige: |
    **1.** On a ${X}^{T}(J - I_{n})X = \big(\sum x_{i}\big)^{2} - \sum x_{i}^{2} = 2\sum_{i<j} x_{i}x_{j}$, et $J - I_{n}$ a pour valeurs propres $n - 1$, sur $\mathbb{R} U$, et $-1$, sur $U^{\perp}$. Par le théorème 5 : 
    $$\boxed{\max = \frac{n - 1}{2} \text{ en } \pm\frac{1}{\sqrt{n}}(1, \dots, 1), \qquad \min = -\frac{1}{2} \text{ en tout } X \text{ unitaire tel que } \sum x_{i} = 0}$$

    **2.** Dans une base orthonormée de vecteurs propres, $\langle u(x) - ax, u(x) - bx \rangle = \sum_{i} (\lambda_{i} - a)(\lambda_{i} - b)x_{i}^{2}$. Cette quantité est négative pour tout $x$ si et seulement si chaque $(\lambda_{i} - a)(\lambda_{i} - b)$ l'est (prendre $x = e_{i}$), c'est-à-dire $\lambda_{i} \in [a, b]$.

    **3.** L'inclusion $W(u) \subset [\lambda_{\min}, \lambda_{\max}]$ est le théorème 5. Réciproquement, soient $e$ et $e'$ des vecteurs propres unitaires orthogonaux associés à $\lambda_{\min}$ et $\lambda_{\max}$ (ou $e = e'$ si $u$ est une homothétie). Pour $t \in [0, 1]$, $x = \sqrt{1 - t}\,e + \sqrt{t}\,e'$ est unitaire et $\langle u(x), x \rangle = (1 - t)\lambda_{\min} + t\lambda_{\max}$. 
    $$\boxed{W(u) = [\lambda_{\min}, \lambda_{\max}]}$$
- id: "mp-07-48"
  feuille: "f-mp-07"
  numero: 48
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème spectral, autoadjoints, antisymétrie, trace]
  noeuds: [f-spectral-fini, f-autoadjoints, v-trace]
  notions: [matrice-symetrique, operateur-autoadjoint]
  source: "Réduction (recueil d'oraux), exercice 23 (Centrale), écarté aux chapitres 2 et 3 car il utilise le théorème spectral"
  page_enonce: 9
  page_corrige: 18
  enonce: |
    On note $d_{n}(\mathbb{K})$ la dimension maximale d'un sous-espace vectoriel de $\mathcal{M}_{n}(\mathbb{K})$ formé de matrices diagonalisables sur $\mathbb{K}$.

    **1.** Montrer qu'une matrice antisymétrique réelle diagonalisable sur $\mathbb{R}$ est nulle (exercice 43).

    **2.** En déduire que $d_{n}(\mathbb{R}) = \frac{n(n + 1)}{2}$, en considérant $\mathcal{S}_{n}(\mathbb{R})$ et l'intersection d'un sous-espace avec $\mathcal{A}_{n}(\mathbb{R})$.

    **3.** Montrer que $d_{2}(\mathbb{C}) = 2$. On montrera qu'un sous-espace de dimension $3$ de $\mathcal{M}_{2}(\mathbb{C})$ contient une matrice nilpotente non nulle, en coupant par l'hyperplan des matrices de trace nulle.
  corrige: |
    **1.** Une matrice antisymétrique réelle n'a que $0$ comme valeur propre réelle (exercice 43) ; si elle est diagonalisable sur $\mathbb{R}$, elle est nulle.

    **2.** Le sous-espace $\mathcal{S}_{n}(\mathbb{R})$, de dimension $\frac{n(n + 1)}{2}$, est formé de matrices diagonalisables (théorème 4). Si $V$ est un sous-espace de dimension strictement supérieure, 
    $$\dim V + \dim\mathcal{A}_{n}(\mathbb{R}) > \frac{n(n + 1)}{2} + \frac{n(n - 1)}{2} = n^{2},$$
     donc $V \cap \mathcal{A}_{n}(\mathbb{R})$ contient une matrice non nulle, non diagonalisable par la question 1. 
    $$\boxed{d_{n}(\mathbb{R}) = \frac{n(n + 1)}{2}}$$

    **3.** Les matrices diagonales montrent que $d_{2}(\mathbb{C}) \geqslant 2$. Soit $V$ de dimension $3$. Son intersection avec l'hyperplan des matrices de trace nulle est de dimension au moins $2$. Sur ce sous-espace $W$, $q : \begin{pmatrix} a & b \\ c & -a \end{pmatrix} \mapsto a^{2} + bc = -\det$ est une forme quadratique. Dans une base $(M_{1}, M_{2})$ de $W$, $q(xM_{1} + yM_{2}) = \alpha x^{2} + \beta xy + \gamma y^{2}$ s'annule pour un $(x, y) \neq (0, 0)$ : si $\alpha = 0$, prendre $(1, 0)$, et sinon $y = 1$ et $x$ racine complexe de $\alpha x^{2} + \beta x + \gamma$. La matrice $M = xM_{1} + yM_{2}$ obtenue est non nulle, de trace et de déterminant nuls, donc de polynôme caractéristique $X^{2}$ : elle est nilpotente non nulle, donc non diagonalisable. 
    $$\boxed{d_{2}(\mathbb{C}) = 2}$$
     Le contraste vient de ce qu'il n'y a pas, sur $\mathbb{C}$, d'analogue des matrices symétriques réelles : le théorème spectral est un phénomène réel (ou hermitien).
- id: "mp-07-49"
  feuille: "f-mp-07"
  numero: 49
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème spectral]
  noeuds: [f-spectral-fini]
  notions: [matrice-symetrique, operateur-autoadjoint]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Exponentielle et matrices euclidiennes.* On utilise les résultats de la feuille 6 : 
    $$\exp(PAP^{-1}) = P\exp(A)P^{-1}, \qquad \exp(A + B) = \exp(A)\exp(B) \ \text{ si } AB = BA.$$

    **1.** Montrer que ${\exp(A)}^{T} = \exp({A}^{T})$.

    **2.** En déduire que, si $A \in \mathcal{A}_{n}(\mathbb{R})$, alors $\exp(A) \in \mathrm{SO}(n)$.

    **3.** Montrer que, si $S \in \mathcal{S}_{n}(\mathbb{R})$, alors $\exp(S) \in \mathcal{S}_{n}^{++}(\mathbb{R})$, et que $\exp$ réalise une bijection de $\mathcal{S}_{n}(\mathbb{R})$ sur $\mathcal{S}_{n}^{++}(\mathbb{R})$. Pour l'injectivité, on adaptera l'exercice 44.
  corrige: |
    **1.** La transposition est linéaire et commute avec la somme d'une série convergente (chapitre 6, proposition 1), et ${(A^{k})}^{T} = ({A}^{T})^{k}$.

    **2.** Si ${A}^{T} = -A$, alors ${\exp(A)}^{T}\exp(A) = \exp(-A)\exp(A) = \exp(0) = I_{n}$, puisque $A$ et $-A$ commutent. De plus $\det\exp(A) = \mathrm{e}^{\operatorname{tr} A} = 1$ (exercice 17 de la feuille 6). 
    $$\boxed{A \in \mathcal{A}_{n}(\mathbb{R}) \implies \exp(A) \in \mathrm{SO}(n)}$$

    **3.** On écrit $S = PD{P}^{T}$ avec $P \in \mathrm{O}(n)$ et $D = \operatorname{diag}(\lambda_{i})$ ; alors $\exp(S) = P\operatorname{diag}(\mathrm{e}^{\lambda_{i}}){P}^{T}$, symétrique à valeurs propres strictement positives. Toute $T = P\operatorname{diag}(\mu_{i}){P}^{T} \in \mathcal{S}_{n}^{++}(\mathbb{R})$ est l'exponentielle de $P\operatorname{diag}(\ln\mu_{i}){P}^{T}$. Pour l'injectivité, on reprend l'exercice 44 avec la fonction $\exp$, injective sur $\mathbb{R}$ : les sous-espaces propres de $\exp(S)$ sont ceux de $S$, et $S$ y agit par le logarithme de la valeur propre. 
    $$\boxed{\exp : \mathcal{S}_{n}(\mathbb{R}) \to \mathcal{S}_{n}^{++}(\mathbb{R}) \text{ est bijective}}$$
     *Piège.* L'exponentielle $\mathcal{A}_{n}(\mathbb{R}) \to \mathrm{SO}(n)$ est surjective, comme le montre la réduction des rotations, mais pas injective : $\exp(2\pi J) = I_{2}$ pour $J = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$.
- id: "mp-07-50"
  feuille: "f-mp-07"
  numero: 50
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [autoadjoints positifs, positivité]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [operateur-autoadjoint, valeur-propre]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercices 22 et 24 ; exercice composé pour la feuille"
  page_enonce: 9
  page_corrige: 19
  enonce: |
    **1.** Les matrices $\begin{pmatrix} 2 & -1 \\ -1 & 1 \end{pmatrix}$ et $\begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$ sont-elles positives ? définies positives ?

    **2.** Montrer que $\begin{pmatrix} r & s \\ s & t \end{pmatrix}$ est définie positive si et seulement si $r > 0$ et $rt - s^{2} > 0$.

    **3.** Pour $a \in \mathbb{R}$, déterminer les valeurs propres de $\begin{pmatrix} 1 & a & 0 \\ a & 1 & a \\ 0 & a & 1 \end{pmatrix}$, et en déduire pour quelles valeurs de $a$ elle est définie positive.
  corrige: |
    **1.** On calcule les valeurs propres. La première matrice a pour trace $3$ et pour déterminant $1$, d'où les valeurs propres $\frac{3 \pm \sqrt{5}}{2} > 0$ ; la seconde a pour valeurs propres $3$ et $-1$. 
    $$\boxed{\begin{pmatrix} 2 & -1 \\ -1 & 1 \end{pmatrix} \in \mathcal{S}_{2}^{++}(\mathbb{R}), \qquad \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix} \notin \mathcal{S}_{2}^{+}(\mathbb{R})}$$

    **2.** On raisonne sur le produit et la somme des valeurs propres. Si la matrice est définie positive, $r = {e_{1}}^{T}Se_{1} > 0$ et $rt - s^{2} = \lambda_{1}\lambda_{2} > 0$. Réciproquement, si $rt - s^{2} > 0$, les valeurs propres sont de même signe, et $r > 0$ impose $t > 0$, donc une trace $\lambda_{1} + \lambda_{2} = r + t > 0$ : elles sont positives. 
    $$\boxed{\begin{pmatrix} r & s \\ s & t \end{pmatrix} \in \mathcal{S}_{2}^{++}(\mathbb{R}) \iff r > 0 \text{ et } rt - s^{2} > 0}$$

    **3.** Le vecteur $(1, 0, -1)$ est propre pour $1$, et $(1, \pm\sqrt{2}, 1)$ pour $1 \pm a\sqrt{2}$. 
    $$\boxed{\operatorname{Sp} = \{1, 1 + a\sqrt{2}, 1 - a\sqrt{2}\} ; \ \text{définie positive} \iff |a| < \frac{1}{\sqrt{2}}}$$
- id: "mp-07-51"
  feuille: "f-mp-07"
  numero: 51
  partie: "Endomorphismes autoadjoints positifs"
  etoiles: 1
