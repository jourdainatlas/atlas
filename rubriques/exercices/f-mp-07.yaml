  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 2"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soient $a$, $b \in E$ et $f : x \mapsto \langle a, x \rangle b - \langle b, x \rangle a$. Montrer que $f \in \mathcal{L}(E)$ et déterminer $f^{*}$. Calculer $\langle f(x), x \rangle$.
  corrige: |
    La linéarité de $f$ vient de celle du produit scalaire en $x$. Pour $x$, $y \in E$, 
    $$\langle f(x), y \rangle = \langle a, x \rangle\langle b, y \rangle - \langle b, x \rangle\langle a, y \rangle = \Big\langle x, \langle b, y \rangle a - \langle a, y \rangle b \Big\rangle = \langle x, -f(y) \rangle.$$

    $$\boxed{f^{*} = -f, \qquad \langle f(x), x \rangle = 0}$$
     La seconde égalité découle de la première : $\langle f(x), x \rangle = -\langle x, f(x) \rangle$. L'exercice 43 montre que les deux propriétés sont équivalentes. En dimension $3$, $f(x) = (a \wedge b) \wedge x$, à un signe près.
- id: "mp-07-03"
  feuille: "f-mp-07"
  numero: 3
  partie: "Adjoint d'un endomorphisme"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [adjoint, isométries, réflexions]
  noeuds: [me-produit-scalaire, f-autoadjoints, fq-orthogonalite]
  notions: [matrice-orthogonale, produit-scalaire]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 3 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 12"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{R})$. On note $\lambda_{A} : M \mapsto AM$, $\rho_{A} : M \mapsto MA$ et $\tau : M \mapsto {M}^{T}$, endomorphismes de $\mathcal{M}_{n}(\mathbb{R})$.

    **1.** Déterminer $\lambda_{A}^{*}$, $\rho_{A}^{*}$ et $\tau^{*}$.

    **2.** Montrer que $\lambda_{A}$ est une isométrie de $\mathcal{M}_{n}(\mathbb{R})$ si et seulement si $A \in \mathrm{O}(n)$.

    **3.** Montrer que $\tau$ est la symétrie orthogonale par rapport à $\mathcal{S}_{n}(\mathbb{R})$, et en déduire que $\mathcal{S}_{n}(\mathbb{R})$ et $\mathcal{A}_{n}(\mathbb{R})$ sont supplémentaires orthogonaux.
  corrige: |
    **1.** On utilise $\langle M, N \rangle = \operatorname{tr}({M}^{T}N)$ et l'invariance de la trace par permutation circulaire : 
    $$\langle AM, N \rangle = \operatorname{tr}({M}^{T}{A}^{T}N) = \langle M, {A}^{T}N \rangle, \qquad \langle MA, N \rangle = \operatorname{tr}({A}^{T}{M}^{T}N) = \operatorname{tr}({M}^{T}N{A}^{T}) = \langle M, N{A}^{T} \rangle,$$
     et $\langle {M}^{T}, N \rangle = \operatorname{tr}(MN) = \operatorname{tr}({N}^{T}\,{M}^{T})$, en transposant, ce qui vaut $\langle M, {N}^{T} \rangle$. 
    $$\boxed{\lambda_{A}^{*} = \lambda_{{A}^{T}}, \qquad \rho_{A}^{*} = \rho_{{A}^{T}}, \qquad \tau^{*} = \tau}$$

    **2.** Par le théorème 2, $\lambda_{A}$ est une isométrie si et seulement si $\lambda_{A}^{*} \circ \lambda_{A} = \lambda_{{A}^{T}A} = \mathrm{id}$, c'est-à-dire ${A}^{T}A = I_{n}$ (évaluer en $M = I_{n}$). 
    $$\boxed{\lambda_{A} \in \mathrm{O}(\mathcal{M}_{n}(\mathbb{R})) \iff A \in \mathrm{O}(n)}$$

    **3.** L'application $\tau$ est une symétrie ($\tau^{2} = \mathrm{id}$) autoadjointe, donc une symétrie orthogonale (proposition 10 (iii)), par rapport à $\mathrm{Ker}\,(\tau - \mathrm{id}) = \mathcal{S}_{n}(\mathbb{R})$ et parallèlement à $\mathrm{Ker}\,(\tau + \mathrm{id}) = \mathcal{A}_{n}(\mathbb{R})$. 
    $$\boxed{\mathcal{M}_{n}(\mathbb{R}) = \mathcal{S}_{n}(\mathbb{R}) \overset{\perp}{\oplus} \mathcal{A}_{n}(\mathbb{R})}$$
     On le vérifie aussi directement : pour $S$ symétrique et $A$ antisymétrique, 
    $$\operatorname{tr}(SA) = \operatorname{tr}\big({(SA)}^{T}\big) = \operatorname{tr}({A}^{T}S) = -\operatorname{tr}(AS) = -\operatorname{tr}(SA).$$
- id: "mp-07-04"
  feuille: "f-mp-07"
  numero: 4
  partie: "Adjoint d'un endomorphisme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint, rotations]
  noeuds: [me-produit-scalaire, f-autoadjoints, fq-orthogonalite]
  notions: [groupe-orthogonal, produit-scalaire]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Adjoint en base quelconque.* Soit $\mathcal{B}$ une base quelconque de $E$, $G = \big(\langle e_{i}, e_{j} \rangle\big)_{i,j}$ sa matrice de Gram, et $u \in \mathcal{L}(E)$ de matrice $A$ dans $\mathcal{B}$.

    **1.** Montrer que $\langle x, y \rangle = {X}^{T}GY$, où $X$ et $Y$ sont les colonnes de coordonnées dans $\mathcal{B}$, et que $G$ est inversible.

    **2.** En déduire que $\mathrm{Mat}_{\mathcal{B}}(u^{*}) = G^{-1}{A}^{T}G$.

    **3.** Vérifier ce résultat sur l'exemple du cours : $\mathbb{R}^{2}$ euclidien canonique, $\mathcal{B} = \big((1, 0), (1, 1)\big)$ et $u$ de matrice canonique $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$.
  corrige: |
    **1.** On développe par bilinéarité : pour $x = \sum x_{i}e_{i}$ et $y = \sum y_{j}e_{j}$, 
    $$\langle x, y \rangle = \sum_{i,j} x_{i}y_{j}\langle e_{i}, e_{j} \rangle = {X}^{T}GY.$$
     Si $GY = 0$, alors $\lVert y \rVert^{2} = {Y}^{T}GY = 0$, donc $Y = 0$ : $G$ est inversible.

    **2.** Soit $B = \mathrm{Mat}_{\mathcal{B}}(u^{*})$. Pour tous $X$, $Y$, $\langle u(x), y \rangle = {X}^{T}{A}^{T}GY$ et $\langle x, u^{*}(y) \rangle = {X}^{T}GBY$. En prenant pour $X$ et $Y$ les vecteurs de la base canonique, ${A}^{T}G = GB$. 
    $$\boxed{\mathrm{Mat}_{\mathcal{B}}(u^{*}) = G^{-1}{A}^{T}G}$$
     En base orthonormée, $G = I_{n}$ et l'on retrouve le théorème 1.

    **3.** On calcule chaque matrice : $G = \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}$, $G^{-1} = \begin{pmatrix} 2 & -1 \\ -1 & 1 \end{pmatrix}$, et $A = \mathrm{Mat}_{\mathcal{B}}(u) = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, puisque $u(1, 0) = 0$ et $u(1, 1) = (1, 0)$. 
    $$\boxed{G^{-1}{A}^{T}G = \begin{pmatrix} 2 & -1 \\ -1 & 1 \end{pmatrix}\begin{pmatrix} 0 & 0 \\ 1 & 1 \end{pmatrix} = \begin{pmatrix} -1 & -1 \\ 1 & 1 \end{pmatrix}}$$
     C'est bien la matrice trouvée dans le cours.
