  page_enonce: 8
  page_corrige: 16
  enonce: |
    Soient $u$, $v \in \mathcal{S}(E)$.

    **1.** Montrer que $u \circ v$ est autoadjoint si et seulement si $u$ et $v$ commutent.

    **2.** On suppose que $u$ et $v$ commutent. Montrer que les sous-espaces propres de $u$ sont stables par $v$, et en déduire qu'il existe une base orthonormée de vecteurs propres communs à $u$ et $v$.
  corrige: |
    **1.** On calcule l'adjoint : $(u \circ v)^{*} = v^{*} \circ u^{*} = v \circ u$, qui est égal à $u \circ v$ si et seulement si $u$ et $v$ commutent.

    **2.** Si $u(x) = \lambda x$, alors $u(v(x)) = v(u(x)) = \lambda v(x)$ : $E_{\lambda}(u)$ est stable par $v$. L'endomorphisme induit par $v$ sur $E_{\lambda}(u)$ est autoadjoint ; par le théorème spectral, il existe une base orthonormée de $E_{\lambda}(u)$ formée de vecteurs propres de $v$, qui sont aussi propres pour $u$. On réunit ces bases : les $E_{\lambda}(u)$ sont orthogonaux et de somme $E$. 
    $$\boxed{\text{il existe une base orthonormée de vecteurs propres communs à } u \text{ et } v}$$
- id: "mp-07-46"
  feuille: "f-mp-07"
  numero: 46
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème spectral, adjoint, autoadjoints]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [matrice-symetrique, operateur-autoadjoint, valeur-propre]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercices 15, 17 et 18"
  page_enonce: 8
  page_corrige: 17
  enonce: |
    **1.** Soit $u \in \mathcal{L}(E)$. Montrer que $\sum_{i=1}^{n} \lVert u(e_{i}) \rVert^{2}$ ne dépend pas de la base orthonormée $(e_{i})$, et vaut $\operatorname{tr}(u^{*} \circ u)$. En déduire que, pour $A \in \mathcal{S}_{n}(\mathbb{R})$ de valeurs propres $\lambda_{1}, \dots, \lambda_{n}$, on a $\sum_{i,j} a_{i,j}^{2} = \sum_{k} \lambda_{k}^{2}$.

    **2.** On munit $E$ de la norme euclidienne et $\mathcal{L}(E)$ de la norme subordonnée $|\mkern-1.5mu|\mkern-1.5mu|\cdot|\mkern-1.5mu|\mkern-1.5mu|$. Montrer que, pour $u$ autoadjoint, $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = \max\{|\lambda| \mid \lambda \in \operatorname{Sp}(u)\}$.

    **3.** En déduire que, pour tout $u \in \mathcal{L}(E)$, $|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|^{2}$ est la plus grande valeur propre de $u^{*} \circ u$. Calculer $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$ pour $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$.
  corrige: |
    **1.** On reconnaît des coefficients diagonaux : $\lVert u(e_{i}) \rVert^{2} = \langle u^{*}u(e_{i}), e_{i} \rangle$ est le $i$-ième coefficient diagonal de la matrice de $u^{*} \circ u$ dans la base orthonormée $(e_{i})$. La somme est la trace, indépendante de la base. Pour $A$ symétrique, $\sum_{i,j} a_{i,j}^{2} = \operatorname{tr}({A}^{T}A) = \operatorname{tr}(A^{2}) = \sum_{k} \lambda_{k}^{2}$. 
    $$\boxed{\sum_{i} \lVert u(e_{i}) \rVert^{2} = \operatorname{tr}(u^{*} \circ u), \qquad \sum_{i,j} a_{i,j}^{2} = \sum_{k} \lambda_{k}^{2}}$$

    **2.** Dans une base orthonormée de vecteurs propres, $\lVert u(x) \rVert^{2} = \sum_{i} \lambda_{i}^{2}x_{i}^{2} \leqslant \rho^{2}\lVert x \rVert^{2}$, où $\rho = \max|\lambda_{i}|$, avec égalité pour un vecteur propre associé. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu| = \max\{|\lambda| \mid \lambda \in \operatorname{Sp}(u)\}}$$

    **3.** On écrit $\lVert u(x) \rVert^{2} = \langle u^{*}u(x), x \rangle$, et l'on applique le théorème 5 à $u^{*}u \in \mathcal{S}^{+}(E)$ : 
    $$\lVert u(x) \rVert^{2} \leqslant \lambda_{\max}(u^{*}u)\lVert x \rVert^{2},$$
     avec égalité pour un vecteur propre. Pour $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$, ${A}^{T}A = \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}$ a pour valeurs propres $\frac{3 \pm \sqrt{5}}{2}$. 
    $$\boxed{|\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|^{2} = \lambda_{\max}(u^{*}u), \qquad |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu| = \sqrt{\frac{3 + \sqrt{5}}{2}} = \frac{1 + \sqrt{5}}{2}}$$
     Le rayon spectral de $A$ vaut $1$ : pour une matrice non symétrique, la norme peut dépasser strictement le rayon spectral.
