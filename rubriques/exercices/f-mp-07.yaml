  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint]
  noeuds: [me-produit-scalaire, f-autoadjoints]
  notions: [produit-scalaire]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 14"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $u \in \mathcal{L}(E)$ tel que $u^{2} = 0$.

    **1.** Montrer que $\mathrm{Ker}\,(u + u^{*}) = \mathrm{Ker}\, u \cap \mathrm{Ker}\,u^{*} = \mathrm{Ker}\, u \cap (\mathrm{Im}\, u)^{\perp}$.

    **2.** En déduire que $u + u^{*}$ est inversible si et seulement si $\mathrm{Im}\, u = \mathrm{Ker}\, u$. Donner un exemple dans $\mathbb{R}^{2}$.
  corrige: |
    **1.** L'inclusion $\mathrm{Ker}\, u \cap \mathrm{Ker}\,u^{*} \subset \mathrm{Ker}\,(u + u^{*})$ est claire. Réciproquement, si $u(x) + u^{*}(x) = 0$, on applique $u$ : comme $u^{2} = 0$, $uu^{*}(x) = 0$, donc $\lVert u^{*}(x) \rVert^{2} = \langle uu^{*}(x), x \rangle = 0$. Ainsi $u^{*}(x) = 0$, puis $u(x) = 0$. Enfin $\mathrm{Ker}\,u^{*} = (\mathrm{Im}\, u)^{\perp}$ (proposition 2). 
    $$\boxed{\mathrm{Ker}\,(u + u^{*}) = \mathrm{Ker}\, u \cap \mathrm{Ker}\,u^{*} = \mathrm{Ker}\, u \cap (\mathrm{Im}\, u)^{\perp}}$$

    **2.** Comme $u^{2} = 0$, on a $\mathrm{Im}\, u \subset \mathrm{Ker}\, u$. Si $\mathrm{Im}\, u = \mathrm{Ker}\, u$, l'intersection $\mathrm{Ker}\, u \cap (\mathrm{Ker}\, u)^{\perp}$ est nulle. Si $\mathrm{Im}\, u \subsetneq \mathrm{Ker}\, u$, l'orthogonal de $\mathrm{Im}\, u$ dans $\mathrm{Ker}\, u$ est non nul, et l'intersection aussi. 
    $$\boxed{u + u^{*} \in \mathrm{GL}(E) \iff \mathrm{Im}\, u = \mathrm{Ker}\, u}$$
     Pour $u(x, y) = (y, 0)$, on a $\mathrm{Im}\, u = \mathrm{Ker}\, u = \mathbb{R}(1, 0)$, et $u + u^{*}$ a pour matrice $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, inversible.
- id: "mp-07-09"
  feuille: "f-mp-07"
  numero: 9
  partie: "Adjoint d'un endomorphisme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [adjoint, isométries, autoadjoints]
  noeuds: [me-produit-scalaire, f-autoadjoints, fq-orthogonalite]
  notions: [matrice-orthogonale, operateur-autoadjoint, produit-scalaire]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 20"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Endomorphismes normaux.* Soit $u \in \mathcal{L}(E)$ tel que $u \circ u^{*} = u^{*} \circ u$.

    **1.** Montrer que $\lVert u(x) \rVert = \lVert u^{*}(x) \rVert$ pour tout $x \in E$, puis que $\mathrm{Ker}\, u = \mathrm{Ker}\,u^{*}$.

    **2.** En déduire que $u$ et $u^{*}$ ont les mêmes sous-espaces propres, et que ces sous-espaces sont deux à deux orthogonaux.

    **3.** Donner un exemple d'endomorphisme normal qui n'est ni autoadjoint ni une isométrie.
  corrige: |
    **1.** On compare les carrés des normes : $\lVert u(x) \rVert^{2} = \langle u^{*}u(x), x \rangle = \langle uu^{*}(x), x \rangle = \lVert u^{*}(x) \rVert^{2}$. Les deux noyaux sont donc égaux.

    **2.** Pour $\lambda \in \mathbb{R}$, $v = u - \lambda\mathrm{id}$ est encore normal, car $v^{*} = u^{*} - \lambda\mathrm{id}$ commute avec $v$. La question 1 donne $\mathrm{Ker}\,(u - \lambda\mathrm{id}) = \mathrm{Ker}\,(u^{*} - \lambda\mathrm{id})$. Pour $\lambda \neq \mu$, l'exercice 6 donne 
    $$\mathrm{Ker}\,(u - \lambda\mathrm{id}) \perp \mathrm{Ker}\,(u^{*} - \mu\mathrm{id}) = \mathrm{Ker}\,(u - \mu\mathrm{id}).$$

    $$\boxed{u \text{ et } u^{*} \text{ ont mêmes sous-espaces propres, deux à deux orthogonaux}}$$

    **3.** On cherche un exemple hors des deux familles du cours : $2R(\theta)$ avec $\theta \notin \pi\mathbb{Z}$ commute avec sa transposée $2R(-\theta)$, n'est pas symétrique, et multiplie les normes par $2$. 
    $$\boxed{u \text{ de matrice } 2R(\theta), \ \theta \notin \pi\mathbb{Z}}$$
- id: "mp-07-10"
  feuille: "f-mp-07"
  numero: 10
  partie: "Adjoint d'un endomorphisme"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [adjoint, isométries, projection orthogonale]
  noeuds: [me-produit-scalaire, f-autoadjoints, fq-orthogonalite]
  notions: [matrice-orthogonale, projection-orthogonale, produit-scalaire]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 21"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Isométries partielles.* Soit $u \in \mathcal{L}(E)$. Montrer l'équivalence des assertions suivantes :

    **1.** $u \circ u^{*} \circ u = u$ ;

    **2.** $u^{*} \circ u$ est un projecteur orthogonal ;

    **3.** $u \circ u^{*}$ est un projecteur orthogonal ;

    **4.** $(\mathrm{Ker}\, u)^{\perp} = \{x \in E \mid \lVert u(x) \rVert = \lVert x \rVert\}$.

    Pour (ii) $\Rightarrow$ (iv), on calculera $\lVert u(x) \rVert^{2}$ pour $x \in (\mathrm{Ker}\, u)^{\perp}$, et l'on utilisera l'exercice 5.
  corrige: |
    On note $q = u^{*} \circ u$, autoadjoint, de noyau $\mathrm{Ker}\, u$ (exercice 5), et $F = (\mathrm{Ker}\, u)^{\perp}$.

    **(i) $\Rightarrow$ (ii).** On calcule $q^{2} = u^{*}(uu^{*}u) = u^{*}u = q$ : $q$ est un projecteur autoadjoint, donc orthogonal (proposition 10).

    **(ii) $\Rightarrow$ (i).** Le projecteur orthogonal $q$ a pour noyau $\mathrm{Ker}\, u$ et pour image $F$. Pour tout $x$, $x - q(x) \in \mathrm{Ker}\, q = \mathrm{Ker}\, u$, donc $u(x) = u(q(x))$ : $u = u \circ q = uu^{*}u$.

    **(i) $\Leftrightarrow$ (iii).** La relation (i) pour $u$ équivaut, en passant à l'adjoint, à (i) pour $u^{*}$, qui équivaut à (ii) pour $u^{*}$, c'est-à-dire à (iii).

    **(ii) $\Rightarrow$ (iv).** Pour $x \in F = \mathrm{Im}\, q$, $\lVert u(x) \rVert^{2} = \langle q(x), x \rangle = \lVert x \rVert^{2}$. Réciproquement, si $\lVert u(x) \rVert = \lVert x \rVert$, on écrit $x = y + z$ avec $y \in F$ et $z \in \mathrm{Ker}\, u$ : alors $\lVert x \rVert = \lVert u(x) \rVert = \lVert u(y) \rVert = \lVert y \rVert$, et $\lVert x \rVert^{2} = \lVert y \rVert^{2} + \lVert z \rVert^{2}$ impose $z = 0$.

    **(iv) $\Rightarrow$ (ii).** L'endomorphisme $u$ conserve la norme sur le sous-espace $F$, donc le produit scalaire par polarisation. Pour $x \in F$ et $y \in F$, $\langle q(x) - x, y \rangle = \langle u(x), u(y) \rangle - \langle x, y \rangle = 0$ ; pour $y \in \mathrm{Ker}\, u$, $\langle q(x), y \rangle = \langle u(x), u(y) \rangle = 0 = \langle x, y \rangle$. Donc $q(x) = x$ sur $F$, et $q = 0$ sur $\mathrm{Ker}\, u$ : $q$ est le projecteur orthogonal sur $F$. 
    $$\boxed{\text{(i)} \iff \text{(ii)} \iff \text{(iii)} \iff \text{(iv)}}$$
     Une telle $u$ est une *isométrie partielle* : elle est isométrique sur $(\mathrm{Ker}\, u)^{\perp}$ et nulle sur $\mathrm{Ker}\, u$. Les projecteurs orthogonaux et les isométries en sont les deux cas extrêmes.
- id: "mp-07-11"
  feuille: "f-mp-07"
  numero: 11
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [isométries, rotations, réflexions, autoadjoints, positivité, trace]
  noeuds: [fq-orthogonalite, f-autoadjoints, f-spectral-fini, v-trace]
  notions: [matrice-orthogonale, groupe-orthogonal, operateur-autoadjoint, cosinus-sinus, trace]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 3 ; BibM@th, Endomorphismes dans un espace euclidien, exercice 44"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Reconnaître une isométrie.* Vérifier que les matrices suivantes sont orthogonales, puis déterminer la nature géométrique de l'endomorphisme canoniquement associé : réflexion (préciser l'hyperplan), rotation (préciser l'axe et le cosinus de l'angle), ou autre. 
    $$A = \frac{1}{25}\begin{pmatrix} -7 & 24 \\ 24 & 7 \end{pmatrix}, \quad B = \frac{1}{5}\begin{pmatrix} 3 & -4 \\ 4 & 3 \end{pmatrix}, \quad C = \frac{1}{9}\begin{pmatrix} -1 & 4 & -8 \\ 4 & -7 & -4 \\ -8 & -4 & -1 \end{pmatrix}, \quad D = \frac{1}{7}\begin{pmatrix} -2 & 6 & -3 \\ 6 & 3 & 2 \\ -3 & 2 & 6 \end{pmatrix},$$

    $$F = \frac{1}{3}\begin{pmatrix} 2 & -1 & 2 \\ 2 & 2 & -1 \\ -1 & 2 & 2 \end{pmatrix}, \quad G = \frac{1}{3}\begin{pmatrix} -2 & 1 & 2 \\ 2 & 2 & 1 \\ -1 & 2 & -2 \end{pmatrix}, \quad H = -F.$$
     On commencera par calculer le déterminant, puis on cherchera si la matrice est symétrique ; pour une rotation de l'espace, la trace donne le cosinus de l'angle (cours, proposition 9).
  corrige: |
    On vérifie d'abord, dans chaque cas, que les colonnes sont orthonormées, puis on suit la méthode proposée.

    $A$ : $\det A = -1$ et $A$ est symétrique : c'est une réflexion. Son axe $\mathrm{Ker}\,(A - I_{2})$ a pour équation $-32x + 24y = 0$ ; il est dirigé par $(3, 4)$.

    $B$ : $\det B = 1$ : c'est la rotation $R(\theta)$ avec $\cos\theta = \frac{3}{5}$ et $\sin\theta = \frac{4}{5}$.

    $C$ : $\det C = 1$ et $C$ est symétrique, donc $C^{2} = I_{3}$ : c'est une rotation d'angle $\pi$ (un retournement), puisque $\operatorname{tr} C = -1 = 1 + 2\cos\theta$. Son axe $\mathrm{Ker}\,(C - I_{3})$ est dirigé par $(2, 1, -2)$.

    $D$ : $\det D = -1$ et $D$ est symétrique, avec $\operatorname{tr} D = 1$ : valeurs propres $1, 1, -1$. C'est la réflexion par rapport au plan orthogonal à $\mathrm{Ker}\,(D + I_{3}) = \mathbb{R}(3, -2, 1)$, d'équation $3x - 2y + z = 0$.

    $F$ : $\det F = 1$, $\operatorname{tr} F = 2$, axe dirigé par $(1, 1, 1)$ : rotation d'angle $\theta$ avec $\cos\theta = \frac{1}{2}$. Avec l'axe orienté par $w = \frac{1}{\sqrt{3}}(1, 1, 1)$ et $x$ unitaire orthogonal à $w$, le produit mixte $[w, x, Fx] = \sin\theta$ vaut $\frac{\sqrt{3}}{2}$ : $\theta = \frac{\pi}{3}$.

    $G$ : $\det G = 1$, $\operatorname{tr} G = -\frac{2}{3}$, axe dirigé par $(1, 3, 1)$ : rotation d'angle $\theta$ avec $\cos\theta = -\frac{5}{6}$, et $\sin\theta = \frac{\sqrt{11}}{6} > 0$ pour l'axe orienté par $(1, 3, 1)$.

    $H = -F$ : $\det H = -1$, et $H$ n'est pas symétrique. On a $H = (-I_{3})F$, où $-I_{3}$ agit par $-1$ sur l'axe et comme la rotation d'angle $\pi$ sur le plan orthogonal : $H$ est la composée de la rotation d'axe $\mathbb{R}(1, 1, 1)$ et d'angle $\frac{\pi}{3} + \pi = \frac{4\pi}{3}$ et de la réflexion par rapport au plan $x + y + z = 0$, qui commutent. 
    $$\boxed{\begin{array}{l} A : \text{réflexion d'axe } \mathbb{R}(3, 4) ; \quad B : \text{rotation}, \ \cos\theta = \tfrac{3}{5} ; \quad C : \text{retournement d'axe } \mathbb{R}(2, 1, -2) ; \\ D : \text{réflexion par rapport à } 3x - 2y + z = 0 ; \quad F : \text{rotation d'axe } \mathbb{R}(1, 1, 1), \ \theta = \tfrac{\pi}{3} ; \\ G : \text{rotation d'axe } \mathbb{R}(1, 3, 1), \ \cos\theta = -\tfrac{5}{6} ; \quad H : \text{antirotation} \end{array}}$$
- id: "mp-07-12"
  feuille: "f-mp-07"
  numero: 12
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [isométries, réflexions, projection orthogonale]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal, projection-orthogonale]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 1"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Dans $\mathbb{R}^{3}$, on considère le sous-espace $F$ défini par les équations $x - y + z = 0$ et $x + y + 2z = 0$. Déterminer la matrice, dans la base canonique, de la projection orthogonale sur $F$, puis de la symétrie orthogonale par rapport à $F$.
  corrige: |
    Les deux équations sont indépendantes : $F$ est une droite, dirigée par le produit vectoriel des vecteurs normaux, $(1, -1, 1) \wedge (1, 1, 2) = (-3, -1, 2)$. Avec $w = (-3, -1, 2)$, de norme $\sqrt{14}$, la projection orthogonale est $x \mapsto \frac{\langle w, x \rangle}{14}w$, de matrice $\frac{1}{14}W{W}^{T}$, et la symétrie est $2p - \mathrm{id}$. 
    $$\boxed{P = \frac{1}{14}\begin{pmatrix} 9 & 3 & -6 \\ 3 & 1 & -2 \\ -6 & -2 & 4 \end{pmatrix}, \qquad S = 2P - I_{3} = \frac{1}{7}\begin{pmatrix} 2 & 3 & -6 \\ 3 & -6 & -2 \\ -6 & -2 & -3 \end{pmatrix}}$$
     On vérifie que $S$ est symétrique, orthogonale, de trace $-1$ : c'est le retournement d'axe $F$.
- id: "mp-07-13"
  feuille: "f-mp-07"
  numero: 13
  partie: "Matrices orthogonales et isométries vectorielles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [isométries, rotations, réflexions]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 33 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 10"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Soit $a \in E$ non nul et $s_{a} : x \mapsto x - 2\frac{\langle a, x \rangle}{\lVert a \rVert^{2}}a$. Montrer que $s_{a}$ est la réflexion d'hyperplan $a^{\perp}$, et écrire sa matrice $I_{n} - \frac{2}{{A}^{T}A}A\,{A}^{T}$ dans une base orthonormée, où $A$ est la colonne des coordonnées de $a$.

    **2.** Soient $x \neq y$ deux vecteurs de même norme. Montrer qu'il existe une unique réflexion qui échange $x$ et $y$.

    **3.** Déterminer la matrice de la réflexion de $\mathbb{R}^{3}$ qui échange $(1, 2, 2)$ et $(3, 0, 0)$.
  corrige: |
    **1.** On examine l'action de $s_{a}$ sur $a^{\perp}$ et sur $a$. Pour $x \in a^{\perp}$, $s_{a}(x) = x$, et $s_{a}(a) = a - 2a = -a$. C'est donc la symétrie par rapport à $a^{\perp}$ parallèlement à $\mathbb{R} a$, orthogonale. En base orthonormée, $\langle a, x \rangle a$ a pour colonne $A\,{A}^{T}X$. 
    $$\boxed{s_{a} \text{ est la réflexion d'hyperplan } a^{\perp}, \qquad \mathrm{Mat}(s_{a}) = I_{n} - \frac{2}{{A}^{T}A}A\,{A}^{T}}$$

    **2.** *Existence.* On pose $a = x - y \neq 0$. Comme $\lVert x \rVert = \lVert y \rVert$, $\lVert a \rVert^{2} = 2\lVert x \rVert^{2} - 2\langle x, y \rangle = 2\langle a, x \rangle$, donc $s_{a}(x) = x - a = y$, puis $s_{a}(y) = x$ puisque $s_{a}^{2} = \mathrm{id}$. *Unicité.* Si une réflexion $s$ échange $x$ et $y$, alors $s(x - y) = -(x - y)$ : le vecteur non nul $x - y$ dirige la droite des vecteurs changés en leur opposé, orthogonale à l'hyperplan de $s$, qui est donc $(x - y)^{\perp}$. 
    $$\boxed{\text{l'unique réflexion échangeant } x \text{ et } y \text{ est } s_{x - y}}$$

    **3.** Ici $a = (1, 2, 2) - (3, 0, 0) = (-2, 2, 2)$ et ${A}^{T}A = 12$. 
    $$\boxed{I_{3} - \frac{1}{6}\begin{pmatrix} 4 & -4 & -4 \\ -4 & 4 & 4 \\ -4 & 4 & 4 \end{pmatrix} = \frac{1}{3}\begin{pmatrix} 1 & 2 & 2 \\ 2 & 1 & -2 \\ 2 & -2 & 1 \end{pmatrix}}$$
     On retrouve la matrice orthogonale symétrique de déterminant $-1$ citée dans le cours (section 7.3), qui est donc la réflexion d'hyperplan $x - y - z = 0$.
