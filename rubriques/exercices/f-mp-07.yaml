  noeuds: [fq-orthogonalite, rd-diagonalisable, f-autoadjoints]
  notions: [matrice-orthogonale, groupe-orthogonal, operateur-autoadjoint, orientation]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 6"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    *Transformation de Cayley.* Soit $u \in \mathbb{R}^{3}$ non nul, de norme $r$, et $f : x \mapsto u \wedge x$.

    **1.** Montrer que $f$ est linéaire, antisymétrique ($f^{*} = -f$), et déterminer $\mathrm{Ker}\, f$ et $\mathrm{Im}\, f$.

    **2.** Écrire la matrice de $f$ dans une base orthonormée directe $(e_{1}, e_{2}, e_{3})$ avec $e_{1} = \frac{u}{r}$.

    **3.** Montrer que $\mathrm{id} + f$ est bijective, et calculer la matrice de $(\mathrm{id} + f)^{-1}$ dans la base précédente.

    **4.** Montrer que $g = (\mathrm{id} - f) \circ (\mathrm{id} + f)^{-1}$ est une rotation d'axe $\mathbb{R} u$, et que son angle $\theta$, l'axe étant orienté par $u$, vérifie $\tan\frac{\theta}{2} = -r$.
  corrige: |
    **1.** La linéarité vient de la bilinéarité du produit vectoriel. Par les propriétés du produit mixte, 
    $$\langle u \wedge x, y \rangle = [u, x, y] = -[u, y, x] = -\langle x, u \wedge y \rangle.$$
     Le noyau est $\mathbb{R} u$ (produit vectoriel nul si et seulement si colinéarité) ; l'image, de dimension $2$, est contenue dans $u^{\perp}$, donc égale à $u^{\perp}$. 
    $$\boxed{f^{*} = -f, \qquad \mathrm{Ker}\, f = \mathbb{R} u, \qquad \mathrm{Im}\, f = u^{\perp}}$$

    **2.** On a $f(e_{1}) = 0$, $f(e_{2}) = re_{1} \wedge e_{2} = re_{3}$ et $f(e_{3}) = re_{1} \wedge e_{3} = -re_{2}$. 
    $$\boxed{\mathrm{Mat}(f) = \begin{pmatrix} 0 & 0 & 0 \\ 0 & 0 & -r \\ 0 & r & 0 \end{pmatrix}}$$

    **3.** On inverse par blocs : $\det(\mathrm{id} + f) = 1 + r^{2} \neq 0$, et 
    $$\begin{pmatrix} 1 & -r \\ r & 1 \end{pmatrix}^{-1} = \frac{1}{1 + r^{2}}\begin{pmatrix} 1 & r \\ -r & 1 \end{pmatrix}.$$

    $$\boxed{\mathrm{Mat}\big((\mathrm{id} + f)^{-1}\big) = \begin{pmatrix} 1 & 0 & 0 \\ 0 & \frac{1}{1 + r^{2}} & \frac{r}{1 + r^{2}} \\ 0 & -\frac{r}{1 + r^{2}} & \frac{1}{1 + r^{2}} \end{pmatrix}}$$

    **4.** Le produit des matrices donne 
    $$\mathrm{Mat}(g) = \begin{pmatrix} 1 & 0 & 0 \\ 0 & \frac{1 - r^{2}}{1 + r^{2}} & \frac{2r}{1 + r^{2}} \\ 0 & -\frac{2r}{1 + r^{2}} & \frac{1 - r^{2}}{1 + r^{2}} \end{pmatrix},$$
     de la forme de la proposition 9 avec $\cos\theta = \frac{1 - r^{2}}{1 + r^{2}}$ et $\sin\theta = -\frac{2r}{1 + r^{2}}$, donc $\tan\frac{\theta}{2} = \frac{\sin\theta}{1 + \cos\theta} = -r$. 
    $$\boxed{g \text{ est la rotation d'axe } \mathbb{R} u, \text{ d'angle } \theta = -2\operatorname{Arctan} r}$$
     C'est un cas particulier de la transformation de Cayley de l'exercice 59 : $f$ est antisymétrique, et $g$ une rotation sans valeur propre $-1$.
- id: "mp-07-30"
  feuille: "f-mp-07"
  numero: 30
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration]
