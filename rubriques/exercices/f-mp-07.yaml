  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Montrer qu'une isométrie diagonalisable est une symétrie orthogonale.

    **2.** Déterminer les endomorphismes de $E$ qui sont à la fois autoadjoints et orthogonaux.
  corrige: |
    **1.** Les valeurs propres d'une isométrie sont $\pm 1$ (proposition 8). Si $u$ est diagonalisable, alors 
    $$E = \mathrm{Ker}\,(u - \mathrm{id}) \oplus \mathrm{Ker}\,(u + \mathrm{id}),$$
     et ces sous-espaces sont orthogonaux. En effet, pour $x$ dans le premier et $y$ dans le second, on a 
    $$\langle x, y \rangle = \langle u(x), u(y) \rangle = -\langle x, y \rangle.$$

    $$\boxed{u \text{ est une symétrie orthogonale}}$$

    **2.** Si $u$ est autoadjoint et orthogonal, $u = u^{*} = u^{-1}$, donc $u^{2} = \mathrm{id}$ : $u$ est une symétrie autoadjointe, donc orthogonale (proposition 10). Réciproquement, une symétrie orthogonale est autoadjointe, et c'est une isométrie par le théorème de Pythagore. 
    $$\boxed{\mathcal{S}(E) \cap \mathrm{O}(E) = \{\text{symétries orthogonales}\}}$$
- id: "mp-07-32"
  feuille: "f-mp-07"
  numero: 32
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [réduction des isométries, rotations]
  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 42"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $u \in \mathrm{O}(E)$ tel que $u^{2} = -\mathrm{id}_{E}$.

    **1.** Montrer que $\langle x, u(x) \rangle = 0$ pour tout $x$, et que $\dim E$ est paire.

    **2.** Pour $x$ unitaire, montrer que $P = \mathrm{Vect}(x, u(x))$ est un plan stable, et que $(x, u(x))$ en est une base orthonormée.

    **3.** En déduire, par récurrence, une base orthonormée dans laquelle la matrice de $u$ est 
    $$\operatorname{diag}\Big(R\Big(\frac{\pi}{2}\Big), \dots, R\Big(\frac{\pi}{2}\Big)\Big).$$
  corrige: |
    **1.** On utilise la conservation du produit scalaire : $\langle x, u(x) \rangle = \langle u(x), u^{2}(x) \rangle = -\langle u(x), x \rangle$, donc $\langle x, u(x) \rangle = 0$. Par ailleurs, $(\det u)^{2} = \det(u^{2}) = \det(-\mathrm{id}) = (-1)^{n}$, et un carré de réel est positif : $n$ est pair.

    **2.** On a $u(x) \in P$ et $u(u(x)) = -x \in P$ : $P$ est stable. Le vecteur $u(x)$ est unitaire et orthogonal à $x$ par la question 1.

    **3.** Par la proposition 8, $P^{\perp}$ est stable, et l'induit vérifie encore $u^{2} = -\mathrm{id}$. La matrice de $u_{|P}$ dans $(x, u(x))$ est $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix} = R\big(\frac{\pi}{2}\big)$, et l'on conclut par récurrence sur la dimension. 
    $$\boxed{\text{il existe une base orthonormée où } \mathrm{Mat}(u) = \operatorname{diag}\Big(R\Big(\frac{\pi}{2}\Big), \dots, R\Big(\frac{\pi}{2}\Big)\Big)}$$
     Le théorème 3 du cours donnait des blocs $R(\theta_{k})$ avec $R(\theta_{k})^{2} = -I_{2}$, c'est-à-dire $\theta_{k} = \pm\frac{\pi}{2}$ ; la construction directe fixe le signe.
- id: "mp-07-33"
  feuille: "f-mp-07"
  numero: 33
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Calcul]
  mots_cles: [réduction des isométries, isométries, autoadjoints]
  noeuds: [fq-orthogonalite, rd-diagonalisable, f-autoadjoints]
  notions: [matrice-orthogonale, operateur-autoadjoint, valeur-propre, polynome-caracteristique, multiplicite-racine]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 44"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $M = \frac{1}{9}\begin{pmatrix} 1 & 8 & -4 \\ 8 & 1 & 4 \\ -4 & 4 & 7 \end{pmatrix}$. Vérifier que $M$ est orthogonale et symétrique. Sans calculer son polynôme caractéristique, en déduire ses valeurs propres avec leurs multiplicités, son polynôme minimal, et la nature de l'endomorphisme associé.
  corrige: |
    On vérifie que les colonnes sont unitaires et orthogonales, et que $M$ est symétrique. Alors 
    $$M^{2} = M{M}^{T} = I_{3} :$$
     $M$ est une symétrie, donc diagonalisable, de valeurs propres dans $\{-1, 1\}$. Sa trace, égale à $1$, impose les multiplicités $2$ pour $1$ et $1$ pour $-1$. Le sous-espace $\mathrm{Ker}\,(M + I_{3})$ est dirigé par $(2, -2, 1)$. 
    $$\boxed{\operatorname{Sp}(M) = \{1, 1, -1\}, \qquad \mu_{M} = X^{2} - 1, \qquad M : \text{réflexion par rapport au plan } 2x - 2y + z = 0}$$
- id: "mp-07-34"
  feuille: "f-mp-07"
  numero: 34
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [réduction des isométries, isométries, projection orthogonale]
  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale, projection-orthogonale]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 39 ; Endomorphismes d'un espace euclidien (Prost, LLG), exercice 9"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Théorème ergodique de von Neumann.* Soit $u \in \mathrm{O}(E)$ et $v = u - \mathrm{id}_{E}$.

    **1.** Montrer que $\mathrm{Ker}\, v = \mathrm{Ker}\,v^{*}$, et en déduire que $E = \mathrm{Ker}\, v \overset{\perp}{\oplus} \mathrm{Im}\, v$.

    **2.** Pour $n \geqslant 1$, on pose $p_{n} = \frac{1}{n}\sum_{k=0}^{n-1} u^{k}$. Calculer $p_{n}(x)$ pour $x \in \mathrm{Ker}\, v$, puis pour $x = v(y) \in \mathrm{Im}\, v$.

    **3.** En déduire que $(p_{n})$ converge vers la projection orthogonale sur $\mathrm{Ker}\, v$.

    **4.** Comparer avec l'exercice 58 de la feuille du chapitre 5, où la projection obtenue n'était pas nécessairement orthogonale.
  corrige: |
    **1.** On calcule l'adjoint : $v^{*} = u^{-1} - \mathrm{id} = -u^{-1}(u - \mathrm{id}) = -u^{-1}v$, donc $\mathrm{Ker}\,v^{*} = \mathrm{Ker}\, v$. Par la proposition 2, $\mathrm{Im}\, v = (\mathrm{Ker}\,v^{*})^{\perp} = (\mathrm{Ker}\, v)^{\perp}$. 
    $$\boxed{E = \mathrm{Ker}\, v \overset{\perp}{\oplus} \mathrm{Im}\, v}$$

    **2.** Si $u(x) = x$, alors $p_{n}(x) = x$. Si $x = u(y) - y$, la somme est télescopique : 
    $$p_{n}(x) = \frac{1}{n}\sum_{k=0}^{n-1}\big(u^{k+1}(y) - u^{k}(y)\big) = \frac{u^{n}(y) - y}{n}, \qquad \lVert p_{n}(x) \rVert \leqslant \frac{2\lVert y \rVert}{n}.$$

    **3.** Pour $x = x_{1} + x_{2}$ avec $x_{1} \in \mathrm{Ker}\, v$ et $x_{2} \in \mathrm{Im}\, v$, $p_{n}(x) = x_{1} + p_{n}(x_{2}) \to x_{1}$. La convergence simple en tout point d'une suite d'endomorphismes d'un espace de dimension finie entraîne la convergence dans $\mathcal{L}(E)$ (convergence des colonnes, chapitre 5). 
    $$\boxed{p_{n} \xrightarrow[n \to +\infty]{} \text{la projection orthogonale sur } \mathrm{Ker}\,(u - \mathrm{id})}$$

    **4.** Au chapitre 5, l'hypothèse $\lVert u(x) \rVert \leqslant \lVert x \rVert$ pour une norme quelconque donnait la projection sur $\mathrm{Ker}\,(u - \mathrm{id})$ parallèlement à $\mathrm{Im}\,(u - \mathrm{id})$. Le cadre euclidien rend ces deux sous-espaces orthogonaux : c'est la relation $\mathrm{Ker}\,v^{*} = \mathrm{Ker}\, v$ qui le permet.
- id: "mp-07-35"
  feuille: "f-mp-07"
  numero: 35
  partie: "Réduction des isométries"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [réduction des isométries, isométries, rotations, réflexions]
  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale, groupe-orthogonal]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 40 ; annoncé dans le cours, section 7.4"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Le groupe orthogonal est engendré par les réflexions.* On montre par récurrence sur $n = \dim E$ que toute $u \in \mathrm{O}(E)$ est la composée d'au plus $n$ réflexions.

    **1.** Traiter les cas $n = 1$ et $n = 2$.

    **2.** Soit $u \in \mathrm{O}(E)$ et $x \in E$ tel que $u(x) \neq x$. Montrer qu'il existe une réflexion $s$ telle que $s \circ u$ fixe $x$ (exercice 13).

    **3.** En déduire le résultat, en considérant l'isométrie induite sur $x^{\perp}$ par $s \circ u$ lorsque $u$ n'est pas l'identité.

    **4.** Montrer que le nombre de réflexions est de même parité que $q$ si $\det u = (-1)^{q}$. Une rotation de l'espace de dimension $3$ peut-elle s'écrire avec trois réflexions ?
  corrige: |
    **1.** On traite les petites dimensions. Pour $n = 1$, $\mathrm{O}(E) = \{\mathrm{id}, -\mathrm{id}\}$, et $-\mathrm{id}$ est la réflexion d'hyperplan $\{0\}$. Pour $n = 2$, une réflexion est un produit d'une réflexion, et une rotation un produit de deux (exercice 25).

    **2.** Les vecteurs $u(x)$ et $x$ sont distincts et de même norme : la réflexion $s$ qui les échange (exercice 13) vérifie $s(u(x)) = x$.

    **3.** On raisonne par récurrence sur $n$. Si $u = \mathrm{id}$, il n'y a rien à faire (zéro réflexion). Sinon, soit $x$ et $s$ comme à la question 2 ; $w = s \circ u$ fixe $x$, donc stabilise $\mathbb{R} x$ et $H = x^{\perp}$ (proposition 8). Par l'hypothèse de récurrence, $w_{|H}$ est la composée d'au plus $n - 1$ réflexions de $H$, d'hyperplans $K_{i} \subset H$. On prolonge chacune par l'identité sur $\mathbb{R} x$ : c'est la réflexion de $E$ d'hyperplan $K_{i} \oplus \mathbb{R} x$. Ainsi $w$ est la composée d'au plus $n - 1$ réflexions de $E$, et $u = s \circ w$ d'au plus $n$. 
    $$\boxed{\text{toute isométrie de } E \text{ est la composée d'au plus } n \text{ réflexions}}$$

    **4.** Une composée de $k$ réflexions a pour déterminant $(-1)^{k}$, qui doit valoir $\det u$. Une rotation de l'espace, de déterminant $1$, est donc composée d'un nombre pair de réflexions, au plus $3$ : de $0$ ou $2$ (exercice 25, question 3). 
    $$\boxed{k \equiv q \pmod 2 ; \text{ une rotation n'est jamais la composée de trois réflexions}}$$
- id: "mp-07-36"
  feuille: "f-mp-07"
  numero: 36
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [réduction des isométries, isométries]
  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale]
  source: "Matrices et topologie (evn2), exercice 11, question 2, écarté au chapitre 5 car il utilise O(n)"
  page_enonce: 7
  page_corrige: 13
  enonce: |
    *Topologie du groupe orthogonal.*

    **1.** Montrer que $\mathrm{O}(n)$ est une partie compacte de $\mathcal{M}_{n}(\mathbb{R})$.

    **2.** Montrer que $\mathrm{O}(n)$ n'est pas connexe par arcs. On utilisera le déterminant.

    **3.** Soit $A \in \mathrm{SO}(n)$. À l'aide du théorème de réduction, construire un chemin continu dans $\mathrm{SO}(n)$ joignant $I_{n}$ à $A$. On remarquera que $-I_{2} = R(\pi)$.

    **4.** En déduire que $\mathrm{SO}(n)$ est connexe par arcs, et que $\mathrm{O}(n)$ a exactement deux composantes connexes par arcs.
  corrige: |
    **1.** On utilise la caractérisation des compacts en dimension finie (chapitre 5) : $\mathrm{O}(n)$ est l'image réciproque de $\{I_{n}\}$ par l'application continue $A \mapsto {A}^{T}A$, donc fermé ; et ses coefficients sont dans $[-1, 1]$, puisque les colonnes sont unitaires, donc il est borné. 
    $$\boxed{\mathrm{O}(n) \text{ est compact}}$$

    **2.** Le déterminant est continu et envoie $\mathrm{O}(n)$ sur $\{-1, 1\}$, atteignant les deux valeurs. Si $\mathrm{O}(n)$ était connexe par arcs, son image serait un intervalle de $\mathbb{R}$ (chapitre 5, théorème 11), ce qui n'est pas le cas.

    **3.** Par le théorème 3 et comme $\det A = 1$, on peut écrire $A = PD{P}^{T}$ avec $P \in \mathrm{O}(n)$ et $D = \operatorname{diag}\big(I_{p}, R(\varphi_{1}), \dots, R(\varphi_{m})\big)$, les éventuels blocs $-1$, en nombre pair, étant regroupés en blocs $R(\pi) = -I_{2}$. Le chemin 
    $$\gamma(t) = P\operatorname{diag}\big(I_{p}, R(t\varphi_{1}), \dots, R(t\varphi_{m})\big){P}^{T}, \qquad t \in [0, 1],$$
     est continu, à valeurs dans $\mathrm{SO}(n)$, et joint $I_{n}$ à $A$.

    **4.** Tout point de $\mathrm{SO}(n)$ est relié à $I_{n}$ : $\mathrm{SO}(n)$ est connexe par arcs. Avec $M = \operatorname{diag}(-1, 1, \dots, 1)$, l'ensemble $\mathrm{O}(n) \setminus \mathrm{SO}(n) = M\,\mathrm{SO}(n)$ est l'image de $\mathrm{SO}(n)$ par l'application continue $A \mapsto MA$, donc aussi connexe par arcs, et le déterminant empêche de joindre les deux parties. 
    $$\boxed{\mathrm{SO}(n) \text{ est connexe par arcs} ; \ \mathrm{O}(n) \text{ a deux composantes connexes par arcs, } \mathrm{SO}(n) \text{ et } \mathrm{O}(n) \setminus \mathrm{SO}(n)}$$
     Physiquement, on ne peut pas transformer continûment un objet en son image dans un miroir par des isométries.
- id: "mp-07-37"
  feuille: "f-mp-07"
  numero: 37
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [réduction des isométries]
  noeuds: [fq-orthogonalite, rd-diagonalisable]
  notions: [matrice-orthogonale]
  source: "Topologie des espaces vectoriels normés (recueil d'oraux), exercice 44 (Mines), écarté au chapitre 5 car il utilise O(n)"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Soient $(A_{k})$ et $(B_{k})$ deux suites de $\mathcal{M}_{n}(\mathbb{R})$, convergeant respectivement vers $A$ et $B$.

    **1.** On suppose $A_{k}$ et $B_{k}$ semblables pour tout $k$. Montrer, sur l'exemple 
    $$A_{k} = \begin{pmatrix} 1 & \frac{1}{k} \\ 0 & 1 \end{pmatrix}, \qquad B_{k} = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix},$$
     que $A$ et $B$ ne sont pas forcément semblables.

    **2.** On suppose $A_{k}$ et $B_{k}$ orthogonalement semblables pour tout $k$. Montrer que $A$ et $B$ sont orthogonalement semblables, à l'aide de l'exercice 36.
  corrige: |
    **1.** Pour tout $k$, $A_{k}$ et $B_{k}$ ont $1$ pour seule valeur propre et ne sont pas diagonalisables, donc sont semblables à la même matrice 
    $$\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$$
     (chapitre 3) ; explicitement, $A_{k} = P_{k}B_{k}P_{k}^{-1}$ avec $P_{k} = \operatorname{diag}(1, k)$. Mais $A_{k} \to I_{2}$, qui n'est semblable qu'à elle-même, et $B_{k} \to B_{1} \neq I_{2}$. 
    $$\boxed{\text{la limite de matrices semblables n'est pas forcément semblable}}$$

    **2.** On écrit $A_{k} = \Omega_{k}B_{k}{\Omega_{k}}^{T}$ avec $\Omega_{k} \in \mathrm{O}(n)$. Par compacité (exercice 36), une sous-suite $(\Omega_{\varphi(k)})$ converge vers $\Omega \in \mathrm{O}(n)$. Par continuité du produit et de la transposition, $A = \Omega B{\Omega}^{T}$. 
    $$\boxed{A \text{ et } B \text{ sont orthogonalement semblables}}$$
     La différence entre les deux questions tient à la compacité de $\mathrm{O}(n)$, alors que $\mathrm{GL}_{n}(\mathbb{R})$ n'est pas compact : dans la question 1, $P_{k} = \operatorname{diag}(1, k)$ part à l'infini.
- id: "mp-07-38"
  feuille: "f-mp-07"
  numero: 38
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 1
  types: [Calcul]
  mots_cles: [théorème spectral]
  noeuds: [f-spectral-fini]
  notions: [matrice-symetrique, operateur-autoadjoint]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 8 ; exercice composé pour la feuille"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *En pratique.* Pour chacune des matrices suivantes, déterminer $P \in \mathrm{O}(n)$ et $D$ diagonale telles que ${P}^{T}AP = D$ : 
    $$A_{1} = \begin{pmatrix} 1 & -2 & -2 \\ -2 & 1 & -2 \\ -2 & -2 & 1 \end{pmatrix}, \qquad A_{2} = \begin{pmatrix} 5 & -1 & 2 \\ -1 & 5 & 2 \\ 2 & 2 & 2 \end{pmatrix}, \qquad A_{3} = J - I_{4} \in \mathcal{M}_{4}(\mathbb{R}).$$
     Pour chaque sous-espace propre de dimension $2$ ou plus, on construira une base orthonormée par le procédé de Gram-Schmidt, ou en utilisant l'orthogonalité au sous-espace propre de dimension $1$.
  corrige: |
    Dans chaque cas, on cherche un sous-espace propre de dimension $1$, puis on obtient l'autre comme son orthogonal (théorème 4).

    $A_{1} = 3I_{3} - 2J$. Comme $J$ a pour valeurs propres $3$ (sur $\mathbb{R}(1, 1, 1)$) et $0$ (sur le plan $x + y + z = 0$), $A_{1}$ a pour valeurs propres $-3$ et $3$, cette dernière double.

    $A_{2}$ : $A_{2}(1, 1, 1) = (6, 6, 6)$ et $A_{2}(1, 1, -2) = (0, 0, 0)$. Le plan orthogonal à $(1, 1, -2)$ est le sous-espace propre associé à $6$, de base orthonormée $\frac{1}{\sqrt{2}}(1, -1, 0)$, $\frac{1}{\sqrt{3}}(1, 1, 1)$.

    $A_{3} = J - I_{4}$ a pour valeurs propres $3$, sur $\mathbb{R}(1, 1, 1, 1)$, et $-1$ sur l'hyperplan orthogonal, où le procédé de Gram-Schmidt donne $\frac{1}{\sqrt{2}}(1, -1, 0, 0)$, $\frac{1}{\sqrt{6}}(1, 1, -2, 0)$, $\frac{1}{\sqrt{12}}(1, 1, 1, -3)$. 
    $$\boxed{\begin{array}{ll} A_{1} : & P = \begin{pmatrix} \frac{1}{\sqrt{3}} & \frac{1}{\sqrt{2}} & \frac{1}{\sqrt{6}} \\ \frac{1}{\sqrt{3}} & -\frac{1}{\sqrt{2}} & \frac{1}{\sqrt{6}} \\ \frac{1}{\sqrt{3}} & 0 & -\frac{2}{\sqrt{6}} \end{pmatrix}, \quad D = \operatorname{diag}(-3, 3, 3) \\[6mm] A_{2} : & P = \begin{pmatrix} \frac{1}{\sqrt{6}} & \frac{1}{\sqrt{2}} & \frac{1}{\sqrt{3}} \\ \frac{1}{\sqrt{6}} & -\frac{1}{\sqrt{2}} & \frac{1}{\sqrt{3}} \\ -\frac{2}{\sqrt{6}} & 0 & \frac{1}{\sqrt{3}} \end{pmatrix}, \quad D = \operatorname{diag}(0, 6, 6) \\[6mm] A_{3} : & P = \begin{pmatrix} \frac{1}{2} & \frac{1}{\sqrt{2}} & \frac{1}{\sqrt{6}} & \frac{1}{\sqrt{12}} \\ \frac{1}{2} & -\frac{1}{\sqrt{2}} & \frac{1}{\sqrt{6}} & \frac{1}{\sqrt{12}} \\ \frac{1}{2} & 0 & -\frac{2}{\sqrt{6}} & \frac{1}{\sqrt{12}} \\ \frac{1}{2} & 0 & 0 & -\frac{3}{\sqrt{12}} \end{pmatrix}, \quad D = \operatorname{diag}(3, -1, -1, -1) \end{array}}$$
     La matrice $A_{2}$ est positive mais pas définie positive, puisque $0$ en est valeur propre.
- id: "mp-07-39"
  feuille: "f-mp-07"
  numero: 39
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [théorème spectral, autoadjoints]
  noeuds: [f-spectral-fini, f-autoadjoints]
  notions: [matrice-symetrique, operateur-autoadjoint]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercices 7, 10 et 11"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $S \in \mathcal{S}_{n}(\mathbb{R})$.

    **1.** On suppose $S^{4} = 2S^{3} - 3S^{2}$. Montrer que $S = 0$.

    **2.** On suppose $S^{p} = 0$ pour un $p \geqslant 1$. Montrer que $S = 0$. Le résultat subsiste-t-il pour une matrice symétrique complexe ?

    **3.** Montrer que $S + \mathrm{i} I_{n}$ est inversible dans $\mathcal{M}_{n}(\mathbb{C})$.
  corrige: |
    **1.** On utilise que $S$ est diagonalisable à valeurs propres réelles (théorème 4). Chacune vérifie $\lambda^{2}(\lambda^{2} - 2\lambda + 3) = 0$, et le second facteur, de discriminant $-8$, n'a pas de racine réelle : $\lambda = 0$. Une matrice diagonalisable de seule valeur propre $0$ est nulle.

    **2.** Même argument : $\lambda^{p} = 0$ donne $\lambda = 0$. Pour une matrice symétrique complexe, c'est faux : $\begin{pmatrix} 1 & \mathrm{i} \\ \mathrm{i} & -1 \end{pmatrix}$ est symétrique, non nulle, de carré nul.

    **3.** Les valeurs propres de $S + \mathrm{i} I_{n}$ sont les $\lambda + \mathrm{i}$, avec $\lambda \in \operatorname{Sp}(S) \subset \mathbb{R}$ : aucune n'est nulle. 
    $$\boxed{S = 0 \ \text{ (questions 1 et 2)}, \qquad S + \mathrm{i} I_{n} \in \mathrm{GL}_{n}(\mathbb{C})}$$
- id: "mp-07-40"
  feuille: "f-mp-07"
  numero: 40
  partie: "Endomorphismes autoadjoints, théorème spectral"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [théorème spectral, adjoint, isométries, rotations, autoadjoints, positivité]
  noeuds: [f-spectral-fini, f-autoadjoints, fq-orthogonalite]
  notions: [matrice-symetrique, operateur-autoadjoint, matrice-orthogonale, groupe-orthogonal]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 5"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $u$ un vecteur unitaire de $E$ et, pour $\alpha \in \mathbb{R}$, $\varphi_{\alpha} : x \mapsto x + \alpha\langle x, u \rangle u$.

    **1.** Montrer que $\varphi_{\alpha}$ est autoadjoint, et déterminer ses éléments propres.

    **2.** Pour quelles valeurs de $\alpha$ est-il une isométrie ? Le décrire alors géométriquement.

    **3.** Pour quelles valeurs de $\alpha$ est-il défini positif ?
  corrige: |
    **1.** La forme bilinéaire 
    $$(x, y) \mapsto \langle \varphi_{\alpha}(x), y \rangle = \langle x, y \rangle + \alpha\langle x, u \rangle\langle u, y \rangle$$
     est symétrique en $x$ et $y$. On a $\varphi_{\alpha}(u) = (1 + \alpha)u$ et $\varphi_{\alpha}(x) = x$ pour $x \in u^{\perp}$. 
    $$\boxed{\varphi_{\alpha} \in \mathcal{S}(E), \qquad \mathrm{Ker}\,(\varphi_{\alpha} - (1 + \alpha)\mathrm{id}) = \mathbb{R} u, \qquad \mathrm{Ker}\,(\varphi_{\alpha} - \mathrm{id}) = u^{\perp} \ (\alpha \neq 0)}$$

    **2.** Une isométrie autoadjointe a ses valeurs propres dans $\{-1, 1\}$ (exercice 31) : il faut $1 + \alpha = \pm 1$. 
    $$\boxed{\alpha \in \{0, -2\} ; \ \varphi_{-2} \text{ est la réflexion d'hyperplan } u^{\perp}}$$

    **3.** Par le théorème 5, $\varphi_{\alpha}$ est défini positif si et seulement si $1 + \alpha > 0$. 
    $$\boxed{\varphi_{\alpha} \in \mathcal{S}^{++}(E) \iff \alpha > -1}$$
