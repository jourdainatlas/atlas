  noeuds: [f-autoadjoints]
  notions: [operateur-autoadjoint, valeur-propre]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    *Perspective : transformation de Cayley et triplets pythagoriciens.* Soit $A \in \mathcal{A}_{n}(\mathbb{R})$.

    **1.** Montrer que ${X}^{T}(I_{n} + A)X = \lVert X \rVert^{2}$ pour tout $X$, et en déduire que $I_{n} + A$ est inversible.

    **2.** Montrer que $\Omega = (I_{n} - A)(I_{n} + A)^{-1}$ appartient à $\mathrm{SO}(n)$, et que $-1$ n'en est pas valeur propre. On remarquera que $I_{n} - A$ et $(I_{n} + A)^{-1}$ commutent, et que $\Omega + I_{n} = 2(I_{n} + A)^{-1}$.

    **3.** Réciproquement, soit $\Omega \in \mathrm{SO}(n)$ sans valeur propre $-1$. Montrer que $A = (I_{n} - \Omega)(I_{n} + \Omega)^{-1}$ est antisymétrique et que $\Omega$ est sa transformée.

    **4.** Pour $n = 2$ et $A = \begin{pmatrix} 0 & -t \\ t & 0 \end{pmatrix}$, calculer $\Omega$, et en déduire que les points du cercle unité autres que $(-1, 0)$ s'écrivent $\Big(\dfrac{1 - t^{2}}{1 + t^{2}}, \dfrac{-2t}{1 + t^{2}}\Big)$. Avec $t = \frac{p}{q}$ rationnel, retrouver les triplets pythagoriciens $(q^{2} - p^{2}, 2pq, q^{2} + p^{2})$, et le triplet $(3, 4, 5)$.
  corrige: |
    **1.** Le réel ${X}^{T}AX$ est égal à sa transposée, qui vaut ${X}^{T}{A}^{T}X = -{X}^{T}AX$ : il est nul. Ainsi ${X}^{T}(I_{n} + A)X = \lVert X \rVert^{2}$, qui est non nul si $X \neq 0$ : $I_{n} + A$ est injective, donc inversible.

    **2.** Les matrices $I_{n} - A$ et $I_{n} + A$ commutent, donc $I_{n} - A$ commute avec $(I_{n} + A)^{-1}$. Comme ${(I_{n} \pm A)}^{T} = I_{n} \mp A$, 
    $${\Omega}^{T}\Omega = (I_{n} - A)^{-1}(I_{n} + A)(I_{n} - A)(I_{n} + A)^{-1} = I_{n}, \qquad \det\Omega = \frac{\det(I_{n} - A)}{\det(I_{n} + A)} = \frac{\det{(I_{n} + A)}^{T}}{\det(I_{n} + A)} = 1.$$
     Enfin $\Omega + I_{n} = \big((I_{n} - A) + (I_{n} + A)\big)(I_{n} + A)^{-1} = 2(I_{n} + A)^{-1}$ est inversible. 
    $$\boxed{\Omega \in \mathrm{SO}(n), \qquad -1 \notin \operatorname{Sp}(\Omega)}$$

    **3.** La matrice $I_{n} + \Omega$ est inversible. Avec ${\Omega}^{T} = \Omega^{-1}$ et la commutation des matrices en jeu, 
    $${A}^{T} = (I_{n} + \Omega^{-1})^{-1}(I_{n} - \Omega^{-1}) = (\Omega + I_{n})^{-1}\Omega\,\Omega^{-1}(\Omega - I_{n}) = -(I_{n} + \Omega)^{-1}(I_{n} - \Omega) = -A.$$
     Puis $I_{n} + A = 2(I_{n} + \Omega)^{-1}$ et $I_{n} - A = 2\Omega(I_{n} + \Omega)^{-1}$, d'où $(I_{n} - A)(I_{n} + A)^{-1} = \Omega$. 
    $$\boxed{A \mapsto (I_{n} - A)(I_{n} + A)^{-1} \text{ est une bijection de } \mathcal{A}_{n}(\mathbb{R}) \text{ sur } \{\Omega \in \mathrm{SO}(n) \mid -1 \notin \operatorname{Sp}(\Omega)\}}$$

    **4.** On calcule $(I_{2} + A)^{-1} = \frac{1}{1 + t^{2}}\begin{pmatrix} 1 & t \\ -t & 1 \end{pmatrix}$ et 
    $$\Omega = \frac{1}{1 + t^{2}}\begin{pmatrix} 1 & t \\ -t & 1 \end{pmatrix}^{2} = \frac{1}{1 + t^{2}}\begin{pmatrix} 1 - t^{2} & 2t \\ -2t & 1 - t^{2} \end{pmatrix}.$$
     La première colonne décrit les points $R(\theta)e_{1}$ du cercle avec $R(\theta)$ sans valeur propre $-1$, c'est-à-dire $\theta \notin \pi + 2\pi\mathbb{Z}$ : tous les points sauf $(-1, 0)$. Pour $t = \frac{p}{q}$, en multipliant par $q^{2} + p^{2}$, on obtient $(q^{2} - p^{2})^{2} + (2pq)^{2} = (q^{2} + p^{2})^{2}$. 
    $$\boxed{t = \frac{1}{2} : \ (q^{2} - p^{2}, 2pq, q^{2} + p^{2}) = (3, 4, 5)}$$
     C'est la paramétrisation rationnelle du cercle ; la formule des triplets figure déjà chez Euclide (*Éléments*, livre X) : la transformation de Cayley en est la version en dimension $n$.
- id: "mp-07-60"
  feuille: "f-mp-07"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 1
  types: [Vrai ou faux]
  mots_cles: [synthèse, adjoint, isométries, projection orthogonale, autoadjoints, théorème spectral, positivité]
  noeuds: [f-autoadjoints, fq-orthogonalite, f-spectral-fini]
  notions: [matrice-orthogonale, projection-orthogonale, operateur-autoadjoint, matrice-symetrique, valeur-propre]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Perspective : lecture critique.* Chacun des raisonnements suivants contient une erreur. La localiser, et dire si la conclusion est vraie ou fausse.

    **1.** « La matrice $\begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$ a deux valeurs propres distinctes, donc elle est diagonalisable, donc il existe $P \in \mathrm{O}(2)$ telle que ${P}^{T}AP$ soit diagonale. »

    **2.** « Les colonnes de $\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ sont orthogonales, donc la matrice est orthogonale, et son déterminant vaut $\pm 1$. »

    **3.** « La matrice $\begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$ est symétrique à coefficients positifs, donc elle est positive. »

    **4.** « Si $u$ et $v$ sont autoadjoints, $(u \circ v)^{*} = u^{*} \circ v^{*} = u \circ v$, donc $u \circ v$ est autoadjoint. »

    **5.** « Le projecteur de matrice $\begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$ dans la base $\big((1, 0), (1, 1)\big)$ de $\mathbb{R}^{2}$ a une matrice symétrique, donc c'est un projecteur orthogonal. »
  corrige: |
    **1.** Diagonalisable ne veut pas dire orthogonalement diagonalisable : seules les matrices symétriques le sont (théorème 4). Conclusion fausse : les vecteurs propres $(1, 0)$ et $(1, 1)$ ne sont pas orthogonaux.

    **2.** Les colonnes doivent être orthonormées, pas seulement orthogonales. Conclusion fausse : le déterminant vaut $-2$.

    **3.** La positivité porte sur les valeurs propres, pas sur les coefficients (théorème 5). Conclusion fausse : $-1$ est valeur propre.

    **4.** L'adjoint d'une composée renverse l'ordre : $(u \circ v)^{*} = v^{*} \circ u^{*}$. Conclusion fausse en général (exercice 45).

    **5.** La base n'est pas orthonormée : la symétrie de la matrice ne caractérise les projecteurs orthogonaux qu'en base orthonormée. Conclusion fausse : le projecteur a pour image $\mathbb{R}(1, 0)$ et pour noyau $\mathbb{R}(1, 1)$, non orthogonaux.

    $$\boxed{\text{Les cinq conclusions sont fausses}}$$
- id: "mp-07-61"
  feuille: "f-mp-07"
  numero: 61
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Algorithmique, Démonstration, Calcul]
  mots_cles: [synthèse, rotations]
  noeuds: [fq-orthogonalite]
  notions: [groupe-orthogonal, valeur-propre]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    *Perspective : la méthode de la puissance.* Soit $S \in \mathcal{S}_{n}(\mathbb{R})$, de valeurs propres $\lambda_{1} > |\lambda_{2}| \geqslant \cdots \geqslant |\lambda_{n}|$, et $(e_{1}, \dots, e_{n})$ une base orthonormée de vecteurs propres associés. Soit $x_{0}$ un vecteur unitaire tel que $\langle x_{0}, e_{1} \rangle \neq 0$, et $x_{k+1} = \frac{Sx_{k}}{\lVert Sx_{k} \rVert}$.

    **1.** Montrer que $x_{k} = \frac{S^{k}x_{0}}{\lVert S^{k}x_{0} \rVert}$, et que $x_{k}$ converge vers $\pm e_{1}$.

    **2.** Montrer que $\lambda_{1} - {x_{k}}^{T}Sx_{k} = O\Big(\Big(\frac{\lambda_{2}}{\lambda_{1}}\Big)^{2k}\Big)$.

    **3.** On exécute le programme suivant. 

    ```python
    import numpy as np
    S = np.array([[4., 1, 0], [1, 3, 1], [0, 1, 2]])
    x = np.array([1., 0, 0])
    for k in range(1, 31):
        x = S @ x
        x = x / np.linalg.norm(x)
        if k in (5, 10, 20, 30):
            print(k, x @ S @ x)
    ```

     Calculer les valeurs propres de $S$ ; on trouvera $3 - \sqrt{3}$, $3$ et $3 + \sqrt{3}$. Le programme affiche des quotients dont l'écart à $3 + \sqrt{3}$ vaut environ $9{,}7 \cdot 10^{-3}$, $1{,}0 \cdot 10^{-4}$, $1{,}1 \cdot 10^{-8}$ et $1{,}2 \cdot 10^{-12}$. Ces valeurs sont-elles conformes à la question 2 ?
  corrige: |
    **1.** Par récurrence, $x_{k}$ est un multiple positif de $S^{k}x_{0}$, et unitaire. On écrit $x_{0} = \sum c_{i}e_{i}$ avec $c_{1} \neq 0$ : 
    $$S^{k}x_{0} = \lambda_{1}^{k}\Big(c_{1}e_{1} + \sum_{i \geqslant 2} c_{i}\Big(\frac{\lambda_{i}}{\lambda_{1}}\Big)^{k}e_{i}\Big),$$
     et la parenthèse tend vers $c_{1}e_{1}$. Comme $\lambda_{1} > 0$, $x_{k} \to \frac{c_{1}}{|c_{1}|}e_{1}$.

    **2.** Avec $y = S^{k}x_{0} = \sum c_{i}\lambda_{i}^{k}e_{i}$, le quotient de Rayleigh vaut $\frac{\sum c_{i}^{2}\lambda_{i}^{2k+1}}{\sum c_{i}^{2}\lambda_{i}^{2k}}$, d'où 
    $$0 \leqslant \lambda_{1} - {x_{k}}^{T}Sx_{k} = \frac{\sum_{i \geqslant 2} c_{i}^{2}(\lambda_{1} - \lambda_{i})\lambda_{i}^{2k}}{\sum_{i} c_{i}^{2}\lambda_{i}^{2k}} \leqslant \frac{\sum_{i \geqslant 2} c_{i}^{2}(\lambda_{1} - \lambda_{i})}{c_{1}^{2}}\Big(\frac{\lambda_{2}}{\lambda_{1}}\Big)^{2k},$$
     en minorant le dénominateur par $c_{1}^{2}\lambda_{1}^{2k}$ et en majorant $\lambda_{i}^{2k}$ par $\lambda_{2}^{2k}$. 
    $$\boxed{\lambda_{1} - {x_{k}}^{T}Sx_{k} = O\Big(\Big(\frac{\lambda_{2}}{\lambda_{1}}\Big)^{2k}\Big)}$$
     Le quotient de Rayleigh converge deux fois plus vite, en exposant, que le vecteur lui-même : l'erreur sur le vecteur est en $(\lambda_{2}/\lambda_{1})^{k}$, et elle intervient au carré, comme au voisinage d'un maximum.

    **3.** Le polynôme caractéristique se factorise en $(X - 3)(X^{2} - 6X + 6)$, de racines $3$ et $3 \pm \sqrt{3}$. Ici $\frac{\lambda_{2}}{\lambda_{1}} = \frac{3}{3 + \sqrt{3}} = \frac{3 - \sqrt{3}}{2} \approx 0{,}634$, de carré $\approx 0{,}402$. Les rapports des écarts successifs sont 
    $$\frac{1{,}0 \cdot 10^{-4}}{9{,}7 \cdot 10^{-3}} \approx 0{,}0105 \approx 0{,}402^{5}, \qquad \frac{1{,}1 \cdot 10^{-8}}{1{,}0 \cdot 10^{-4}} \approx \frac{1{,}2 \cdot 10^{-12}}{1{,}1 \cdot 10^{-8}} \approx 1{,}1 \cdot 10^{-4} \approx 0{,}402^{10}.$$

    $$\boxed{\text{les écarts sont conformes : facteur } \Big(\frac{\lambda_{2}}{\lambda_{1}}\Big)^{2} \approx 0{,}402 \text{ par itération}}$$
- id: "mp-07-62"
  feuille: "f-mp-07"
  numero: 62
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, positivité]
  noeuds: [f-spectral-fini]
  notions: []
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 33"
  page_enonce: 12
  page_corrige: 24
  enonce: |
    *Décomposition en valeurs singulières.* Soit $A \in \mathcal{M}_{n}(\mathbb{R})$.

    **1.** Justifier l'existence de $V \in \mathrm{O}(n)$ et de réels $\sigma_{1} \geqslant \cdots \geqslant \sigma_{n} \geqslant 0$ tels que 
    $${A}^{T}A = V\operatorname{diag}(\sigma_{1}^{2}, \dots, \sigma_{n}^{2}){V}^{T}.$$

    **2.** On note $v_{j}$ les colonnes de $V$. Montrer que les vecteurs $Av_{j}$ sont deux à deux orthogonaux, et que $\lVert Av_{j} \rVert = \sigma_{j}$.

    **3.** En déduire l'existence de $U \in \mathrm{O}(n)$ telle que $A = U\operatorname{diag}(\sigma_{1}, \dots, \sigma_{n}){V}^{T}$. On complétera la famille orthonormée $\big(\frac{1}{\sigma_{j}}Av_{j}\big)_{\sigma_{j} > 0}$.

    **4.** Montrer que $\sigma_{1} = |\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|$ pour la norme subordonnée à la norme euclidienne (exercice 46), et que $\sigma_{1}^{2} + \cdots + \sigma_{n}^{2} = \sum_{i,j} a_{i,j}^{2}$.

    **5.** Calculer la décomposition pour $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$, et vérifier que $\sigma_{1}$ est le nombre d'or.
  corrige: |
    **1.** La matrice ${A}^{T}A$ est symétrique positive (exercice 5) : le théorème spectral et le théorème 5 donnent $V$ et des valeurs propres $\sigma_{j}^{2} \geqslant 0$, rangées par ordre décroissant.

    **2.** On calcule $\langle Av_{i}, Av_{j} \rangle = {v_{i}}^{T}{A}^{T}Av_{j} = \sigma_{j}^{2}{v_{i}}^{T}v_{j} = \sigma_{j}^{2}\delta_{i,j}$.

    **3.** Les vecteurs $u_{j} = \frac{1}{\sigma_{j}}Av_{j}$, pour $\sigma_{j} > 0$, forment une famille orthonormée, que l'on complète en une base orthonormée $(u_{1}, \dots, u_{n})$. Pour $\sigma_{j} = 0$, $Av_{j} = 0$ par la question 2. Dans tous les cas $Av_{j} = \sigma_{j}u_{j}$, soit $AV = U\Sigma$. 
    $$\boxed{A = U\operatorname{diag}(\sigma_{1}, \dots, \sigma_{n}){V}^{T}, \qquad U, V \in \mathrm{O}(n)}$$

    **4.** Par l'exercice 46, $|\mkern-1.5mu|\mkern-1.5mu|A|\mkern-1.5mu|\mkern-1.5mu|^{2} = \lambda_{\max}({A}^{T}A) = \sigma_{1}^{2}$, et $\sum \sigma_{j}^{2} = \operatorname{tr}({A}^{T}A) = \sum a_{i,j}^{2}$.

    **5.** Les valeurs propres de ${A}^{T}A = \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}$ sont $\varphi^{2}$ et $\varphi^{-2}$, avec $\varphi = \frac{1 + \sqrt{5}}{2}$, puisque $\varphi^{2} + \varphi^{-2} = 3$ et $\varphi^{2}\varphi^{-2} = 1$. On trouve $v_{1} \propto (1, \varphi)$, $v_{2} \propto (-\varphi, 1)$, puis $u_{1} \propto (\varphi, 1)$ et $u_{2} \propto (-1, \varphi)$, tous de norme $\sqrt{1 + \varphi^{2}}$ avant normalisation. 
    $$\boxed{A = \frac{1}{1 + \varphi^{2}}\begin{pmatrix} \varphi & -1 \\ 1 & \varphi \end{pmatrix}\begin{pmatrix} \varphi & 0 \\ 0 & \varphi^{-1} \end{pmatrix}\begin{pmatrix} 1 & \varphi \\ -\varphi & 1 \end{pmatrix}, \qquad \sigma_{1} = \varphi}$$
     Géométriquement, $A$ envoie le cercle unité sur une ellipse de demi-axes $\varphi$ et $\varphi^{-1}$ : la décomposition en valeurs singulières généralise la figure de la section 7.6 aux matrices non symétriques.
- id: "mp-07-63"
  feuille: "f-mp-07"
  numero: 63
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse]
  noeuds: [me-produit-scalaire]
  notions: [valeur-propre, produit-scalaire]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 21"
  page_enonce: 13
  page_corrige: 24
  enonce: |
    *Théorème de Courant-Fischer.* Soit $S \in \mathcal{S}_{n}(\mathbb{R})$, de valeurs propres $\lambda_{1} \leqslant \cdots \leqslant \lambda_{n}$, et $R(X) = \frac{{X}^{T}SX}{{X}^{T}X}$ pour $X \neq 0$. On note $\mathcal{F}_{k}$ l'ensemble des sous-espaces de $\mathbb{R}^{n}$ de dimension $k$.

    **1.** Soit $(e_{1}, \dots, e_{n})$ une base orthonormée de vecteurs propres. Montrer que 
    $$\max\{R(X) \mid X \in \mathrm{Vect}(e_{1}, \dots, e_{k}) \setminus \{0\}\} = \lambda_{k}.$$

    **2.** Soit $V \in \mathcal{F}_{k}$. Montrer que $V \cap \mathrm{Vect}(e_{k}, \dots, e_{n}) \neq \{0\}$, et en déduire que 
    $$\max\{R(X) \mid X \in V \setminus \{0\}\} \geqslant \lambda_{k}.$$

    **3.** Conclure : $\lambda_{k} = \min\limits_{V \in \mathcal{F}_{k}} \max\limits_{X \in V \setminus \{0\}} R(X)$.

    **4.** *Entrelacement.* Soit $S'$ la matrice obtenue en supprimant la dernière ligne et la dernière colonne de $S$, de valeurs propres $\mu_{1} \leqslant \cdots \leqslant \mu_{n-1}$. Montrer que $\lambda_{k} \leqslant \mu_{k} \leqslant \lambda_{k+1}$ pour $1 \leqslant k \leqslant n - 1$.

    **5.** *Perturbation.* Soit $T \in \mathcal{S}_{n}(\mathbb{R})$, de valeurs propres comprises entre $\alpha$ et $\beta$. Montrer que la $k$-ième valeur propre de $S + T$ est comprise entre $\lambda_{k} + \alpha$ et $\lambda_{k} + \beta$.
  corrige: |
    **1.** Pour $X = \sum_{i \leqslant k} x_{i}e_{i} \neq 0$, $R(X) = \frac{\sum_{i \leqslant k} \lambda_{i}x_{i}^{2}}{\sum_{i \leqslant k} x_{i}^{2}} \leqslant \lambda_{k}$, avec égalité en $e_{k}$.

    **2.** Les dimensions de $V$ et de $\mathrm{Vect}(e_{k}, \dots, e_{n})$ ont pour somme $n + 1 > n$ : leur intersection contient un $X \neq 0$, pour lequel $R(X) \geqslant \lambda_{k}$ par le calcul de la question 1, mené avec les indices $i \geqslant k$.

    **3.** Par la question 2, le min-max est au moins $\lambda_{k}$. Par la question 1, la valeur $\lambda_{k}$ est atteinte pour le sous-espace $\mathrm{Vect}(e_{1}, \dots, e_{k})$. 
    $$\boxed{\lambda_{k} = \min_{V \in \mathcal{F}_{k}} \max_{X \in V \setminus \{0\}} R(X)}$$

    **4.** On identifie $\mathbb{R}^{n-1}$ à l'hyperplan $H = \{x_{n} = 0\}$ ; le quotient de Rayleigh de $S'$ est la restriction de $R$ à $H$. *Minoration.* $\mu_{k}$ est un min-max pris sur les seuls sous-espaces de dimension $k$ contenus dans $H$ : il est au moins $\lambda_{k}$. *Majoration.* Le sous-espace $\mathrm{Vect}(e_{1}, \dots, e_{k+1}) \cap H$ est de dimension au moins $k$, donc contient un $W$ de dimension $k$, sur lequel $R \leqslant \lambda_{k+1}$ (question 1). 
    $$\boxed{\lambda_{k} \leqslant \mu_{k} \leqslant \lambda_{k+1}}$$

    **5.** Pour tout $X \neq 0$, $R_{S}(X) + \alpha \leqslant R_{S+T}(X) \leqslant R_{S}(X) + \beta$ par le théorème 5 appliqué à $T$. Ces inégalités passent au max sur $V$, puis au min sur $V \in \mathcal{F}_{k}$. 
    $$\boxed{\lambda_{k} + \alpha \leqslant \lambda_{k}(S + T) \leqslant \lambda_{k} + \beta}$$
     En particulier, les valeurs propres d'une matrice symétrique dépendent de façon $1$-lipschitzienne de la matrice, pour la norme subordonnée : $|\lambda_{k}(S + T) - \lambda_{k}(S)| \leqslant |\mkern-1.5mu|\mkern-1.5mu|T|\mkern-1.5mu|\mkern-1.5mu|$.
- id: "mp-07-64"
  feuille: "f-mp-07"
  numero: 64
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, positivité]
  noeuds: [f-spectral-fini]
  notions: []
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Inégalité de Hadamard.*

    **1.** Soit $S \in \mathcal{S}_{n}^{++}(\mathbb{R})$, de coefficients diagonaux $s_{1}, \dots, s_{n}$. On pose $\Delta = \operatorname{diag}\big(\frac{1}{\sqrt{s_{1}}}, \dots, \frac{1}{\sqrt{s_{n}}}\big)$. Montrer que $\Delta S\Delta \in \mathcal{S}_{n}^{++}(\mathbb{R})$ a une diagonale de $1$, et en déduire, avec l'exercice 51, que $\det S \leqslant s_{1}\cdots s_{n}$.

    **2.** Soit $M \in \mathcal{M}_{n}(\mathbb{R})$ de colonnes $C_{1}, \dots, C_{n}$. Montrer que $|\det M| \leqslant \lVert C_{1} \rVert\cdots\lVert C_{n} \rVert$, en appliquant la question 1 à ${M}^{T}M$. Interpréter géométriquement en dimension $3$.

    **3.** En déduire que, si les coefficients de $M$ sont dans $[-1, 1]$, alors $|\det M| \leqslant n^{n/2}$, et vérifier que la borne est atteinte pour $n = 2$ par $\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$.

    **4.** Retrouver l'inégalité de la question 2 à l'aide de la décomposition $QR$ de l'exercice 24, lorsque $M$ est inversible.
  corrige: |
    **1.** La matrice $\Delta S\Delta$ est symétrique, et ${X}^{T}\Delta S\Delta X = {(\Delta X)}^{T}S(\Delta X) > 0$ pour $X \neq 0$ ; son coefficient diagonal $i$ vaut $\frac{s_{i}}{s_{i}} = 1$. Par l'exercice 51, $\det(\Delta S\Delta)^{1/n} \leqslant \frac{1}{n}\operatorname{tr}(\Delta S\Delta) = 1$, et $\det(\Delta S\Delta) = \frac{\det S}{s_{1}\cdots s_{n}}$. 
    $$\boxed{\det S \leqslant s_{1}s_{2}\cdots s_{n}}$$

    **2.** Si $M$ n'est pas inversible, l'inégalité est claire. Sinon, ${M}^{T}M \in \mathcal{S}_{n}^{++}(\mathbb{R})$ a pour coefficients diagonaux $\lVert C_{j} \rVert^{2}$, et la question 1 donne $(\det M)^{2} \leqslant \prod\lVert C_{j} \rVert^{2}$. 
    $$\boxed{|\det M| \leqslant \lVert C_{1} \rVert\cdots\lVert C_{n} \rVert}$$
     En dimension $3$, $|\det M|$ est le volume du parallélépipède construit sur les colonnes : il est au plus le produit des longueurs des arêtes, avec égalité pour un pavé droit.

    **3.** Chaque colonne a une norme au plus $\sqrt{n}$, d'où $|\det M| \leqslant n^{n/2}$. Pour $n = 2$, on a 
    $$\Big|\det\begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}\Big| = 2 = 2^{2/2}.$$

    $$\boxed{|\det M| \leqslant n^{n/2}}$$
     Les matrices à coefficients $\pm 1$ qui atteignent la borne sont les matrices de Hadamard, dont les colonnes sont orthogonales.

    **4.** Avec $M = QR$ (exercice 24), $|\det M| = \det R = \prod r_{j,j}$, et $r_{j,j} = \langle q_{j}, C_{j} \rangle \leqslant \lVert C_{j} \rVert$ par l'inégalité de Cauchy-Schwarz.
- id: "mp-07-65"
  feuille: "f-mp-07"
  numero: 65
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, théorème spectral, positivité]
  noeuds: [f-spectral-fini]
  notions: [matrice-symetrique, valeur-propre]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercices 29 et 31"
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Le déterminant sur les matrices positives.*

    **1.** Soient $\mu_{1}, \dots, \mu_{n} > 0$ et $t \in \, ]0, 1[$. Montrer, par la concavité du logarithme, que $\mu_{i}^{1-t} \leqslant t + (1 - t)\mu_{i}$, puis que $\prod_{i} \mu_{i}^{1-t} \leqslant \prod_{i} \big(t + (1 - t)\mu_{i}\big)$.

    **2.** Soient $A$, $B \in \mathcal{S}_{n}^{++}(\mathbb{R})$. À l'aide de la réduction simultanée de l'exercice 56, montrer que 
    $$(\det A)^{t}(\det B)^{1-t} \leqslant \det\big(tA + (1 - t)B\big).$$
     Étendre l'inégalité à $A$, $B \in \mathcal{S}_{n}^{+}(\mathbb{R})$, par densité (exercice 57).

    **3.** Soient $a$, $b \in \mathcal{S}^{+}(E)$ et $h$ la racine carrée positive de $a$ (exercice 55). Montrer que $h \circ b \circ h$ est diagonalisable à valeurs propres positives, puis que $a \circ b$ est diagonalisable, de mêmes valeurs propres, en comparant les sous-espaces propres de $h \circ (h \circ b)$ et de $(h \circ b) \circ h$ lorsque $a$ est inversible.
  corrige: |
    **1.** Par concavité du logarithme, $\ln\big(t \cdot 1 + (1 - t)\mu_{i}\big) \geqslant t\ln 1 + (1 - t)\ln\mu_{i}$, et l'on prend l'exponentielle, puis le produit d'inégalités entre réels positifs.

    **2.** Par l'exercice 56, $A = {R}^{T}R$ et $B = {R}^{T}DR$, avec $D = \operatorname{diag}(\mu_{i})$ et $\mu_{i} > 0$ puisque $B$ est définie positive. Alors 
    $$\det A = (\det R)^{2}, \qquad \det B = (\det R)^{2}\prod\mu_{i}, \qquad \det\big(tA + (1 - t)B\big) = (\det R)^{2}\prod\big(t + (1 - t)\mu_{i}\big),$$
     et la question 1 conclut. Pour $A$, $B$ positives, on applique l'inégalité à $A + \frac{1}{k}I_{n}$ et $B + \frac{1}{k}I_{n}$ et l'on fait tendre $k$ vers l'infini, par continuité du déterminant et des puissances d'exposant $t$ et $1 - t$ sur $\mathbb{R}_{+}$. 
    $$\boxed{(\det A)^{t}(\det B)^{1-t} \leqslant \det\big(tA + (1 - t)B\big)}$$
     Autrement dit, $\ln\det$ est concave sur $\mathcal{S}_{n}^{++}(\mathbb{R})$, qui est convexe (exercice 57).

    **3.** L'endomorphisme $g = h \circ b \circ h$ est autoadjoint, et $\langle g(x), x \rangle = \langle b(h(x)), h(x) \rangle \geqslant 0$ : il est diagonalisable à valeurs propres positives. Si $a$ est inversible, $h$ l'est aussi, et $a \circ b = h \circ (h \circ b \circ h) \circ h^{-1}$ est semblable à $g$. 
    $$\boxed{a \circ b \text{ est diagonalisable, à valeurs propres positives}}$$
     Le produit de deux matrices symétriques n'est pas symétrique en général, mais, si l'une est définie positive, il garde les qualités spectrales d'une matrice symétrique positive.
