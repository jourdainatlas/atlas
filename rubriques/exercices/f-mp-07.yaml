  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 31"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Décomposition $QR$.* Soit $A \in \mathrm{GL}_{n}(\mathbb{R})$.

    **1.** En appliquant le procédé de Gram-Schmidt aux colonnes de $A$, montrer qu'il existe $Q \in \mathrm{O}(n)$ et $R$ triangulaire supérieure à coefficients diagonaux strictement positifs telles que $A = QR$.

    **2.** Montrer que ce couple est unique, à l'aide de l'exercice 14.

    **3.** Calculer la décomposition de $A = \begin{pmatrix} 1 & 1 \\ 1 & 3 \end{pmatrix}$.
  corrige: |
    **1.** On orthonormalise les colonnes $C_{1}, \dots, C_{n}$ de $A$, qui forment une base. Le procédé de Gram-Schmidt fournit une base orthonormée $(q_{1}, \dots, q_{n})$ telle que $\mathrm{Vect}(q_{1}, \dots, q_{j}) = \mathrm{Vect}(C_{1}, \dots, C_{j})$ et $\langle q_{j}, C_{j} \rangle > 0$. On écrit $C_{j} = \sum_{i \leqslant j} r_{i,j}q_{i}$, avec $r_{j,j} = \langle q_{j}, C_{j} \rangle > 0$ : c'est $A = QR$, où $Q$ a pour colonnes les $q_{j}$.

    **2.** Si $QR = Q'R'$, alors $Q'^{-1}Q = R'R^{-1}$ est orthogonale et triangulaire supérieure à diagonale strictement positive ; par l'exercice 14, c'est $I_{n}$. 
    $$\boxed{\exists!\,(Q, R), \quad A = QR, \quad Q \in \mathrm{O}(n), \quad R \text{ triangulaire supérieure}, \ r_{i,i} > 0}$$

    **3.** On a $q_{1} = \frac{1}{\sqrt{2}}(1, 1)$, puis $C_{2} - \langle q_{1}, C_{2} \rangle q_{1} = (1, 3) - (2, 2) = (-1, 1)$, d'où $q_{2} = \frac{1}{\sqrt{2}}(-1, 1)$. 
    $$\boxed{\begin{pmatrix} 1 & 1 \\ 1 & 3 \end{pmatrix} = \frac{1}{\sqrt{2}}\begin{pmatrix} 1 & -1 \\ 1 & 1 \end{pmatrix}\begin{pmatrix} \sqrt{2} & 2\sqrt{2} \\ 0 & \sqrt{2} \end{pmatrix}}$$
     La décomposition $QR$ est la traduction matricielle du procédé de Gram-Schmidt ; elle sert en calcul numérique pour résoudre des systèmes de façon stable.
- id: "mp-07-25"
  feuille: "f-mp-07"
  numero: 25
  partie: "Isométries du plan euclidien"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [isométries du plan, rotations, réflexions, orientation]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal, orientation]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 2 ; cours, proposition 7"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $E$ un plan euclidien orienté.

    **1.** Que dire de la composée de deux rotations ? De deux réflexions ? D'une rotation et d'une réflexion ? On donnera les angles et les axes à l'aide des matrices $R(\theta)$ et $S(\theta)$ du cours.

    **2.** Montrer que toute rotation de $E$ est la composée de deux réflexions, la première pouvant être choisie arbitrairement.

    **3.** Soit maintenant $E$ de dimension $3$ et $r$ une rotation d'axe $D$. Montrer que $r$ est la composée de deux réflexions dont les hyperplans contiennent $D$.
  corrige: |
    **1.** On calcule les produits de matrices dans une base orthonormée directe, à l'aide des formules d'addition : 
    $$R(\theta)R(\varphi) = R(\theta + \varphi), \quad S(\theta)S(\varphi) = R(\theta - \varphi), \quad R(\theta)S(\varphi) = S(\theta + \varphi), \quad S(\varphi)R(\theta) = S(\varphi - \theta).$$

    $$\boxed{\text{rotation} \circ \text{rotation} = \text{rotation}, \quad \text{réflexion} \circ \text{réflexion} = \text{rotation}, \quad \text{rotation} \circ \text{réflexion} = \text{réflexion}}$$
     La composée des réflexions d'axes d'angles polaires $\frac{\varphi}{2}$ puis $\frac{\theta}{2}$ est la rotation d'angle $\theta - \varphi$, double de l'angle des axes.

    **2.** Soit $r = R(\theta)$ et $s = S(\varphi)$ une réflexion quelconque. Par la question 1, $S(\theta + \varphi)S(\varphi) = R(\theta)$. 
    $$\boxed{r = S(\theta + \varphi) \circ S(\varphi) \text{ pour tout } \varphi}$$

    **3.** On travaille dans le plan $P = D^{\perp}$, stable par $r$, où $r$ induit une rotation. Par la question 2, $r_{|P} = \sigma_{2} \circ \sigma_{1}$ avec $\sigma_{1}$, $\sigma_{2}$ réflexions de $P$. On prolonge chaque $\sigma_{i}$ par l'identité sur $D$ : on obtient la réflexion de l'espace dont le plan est la somme de $D$ et de l'axe de $\sigma_{i}$. Les deux membres coïncident sur $D$ et sur $P$. 
    $$\boxed{r = s_{2} \circ s_{1}, \quad s_{i} \text{ réflexions de plans contenant } D}$$
- id: "mp-07-26"
  feuille: "f-mp-07"
  numero: 26
  partie: "Isométries du plan euclidien"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [isométries du plan, isométries, rotations, réflexions, orientation]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal, orientation]
  source: "BibM@th, Endomorphismes dans un espace euclidien, exercice 43"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Dans un plan euclidien orienté, soient $u$ et $v$ deux vecteurs unitaires. Déterminer les isométries qui envoient $u$ sur $v$ : on montrera qu'il y en a exactement deux, une rotation et une réflexion, que l'on décrira. Pour $u = (1, 0)$ et $v = \frac{1}{5}(3, 4)$, écrire leurs matrices.
  corrige: |
    On cherche les isométries $f$ telles que $f(u) = v$. Soit $u'$ et $v'$ les images de $u$ et $v$ par la rotation d'angle $\frac{\pi}{2}$, de sorte que $(u, u')$ et $(v, v')$ sont des bases orthonormées directes. Comme $f$ conserve l'orthogonalité, $f(u') \in v^{\perp} = \mathbb{R} v'$, et $f(u')$ est unitaire : $f(u') = \pm v'$. Le cas $+$ donne une isométrie directe, la rotation d'angle $(u, v)$ ; le cas $-$ une isométrie indirecte, la réflexion qui échange $u$ et $v$, d'axe dirigé par $u + v$ si $v \neq -u$, et par $u'$ si $v = -u$. 
    $$\boxed{\text{exactement deux : la rotation d'angle } (u, v) \text{ et la réflexion d'axe dirigé par } u + v}$$
     Pour $u = (1, 0)$ et $v = \frac{1}{5}(3, 4)$, l'angle $\theta$ vérifie $\cos\theta = \frac{3}{5}$ et $\sin\theta = \frac{4}{5}$, et les deux matrices sont $R(\theta)$ et $S(\theta)$. 
    $$\boxed{\frac{1}{5}\begin{pmatrix} 3 & -4 \\ 4 & 3 \end{pmatrix}, \qquad \frac{1}{5}\begin{pmatrix} 3 & 4 \\ 4 & -3 \end{pmatrix}}$$
- id: "mp-07-27"
  feuille: "f-mp-07"
  numero: 27
  partie: "Isométries du plan euclidien"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [isométries du plan, isométries, rotations, orientation]
  noeuds: [fq-orthogonalite]
  notions: [matrice-orthogonale, groupe-orthogonal, orientation]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On identifie $\mathbb{R}^{2}$ à $\mathbb{C}$, et l'on note $\omega = \mathrm{e}^{\mathrm{i}\theta}$.

    **1.** Montrer que $z \mapsto \omega z$ et $z \mapsto \omega\overline{z}$ sont des isométries du plan, et donner leurs matrices dans la base $(1, \mathrm{i})$.

    **2.** Pour $x$, $y$ unitaires, montrer qu'une mesure $\theta$ de l'angle orienté $(x, y)$ vérifie $\cos\theta = \langle x, y \rangle$ et $\sin\theta = \det(x, y)$, le déterminant étant pris dans une base orthonormée directe.

    **3.** Calculer une mesure de l'angle orienté $\big((1, 2), (-2, 1)\big)$, puis $\big((3, 1), (1, 3)\big)$, après normalisation.
  corrige: |
    **1.** On calcule les images de $1$ et de $\mathrm{i}$ : $\omega \cdot 1 = \cos\theta + \mathrm{i}\sin\theta$ et $\omega\mathrm{i} = -\sin\theta + \mathrm{i}\cos\theta$ ; puis $\omega\overline{1} = \omega$ et $\omega\overline{\mathrm{i}} = -\mathrm{i}\omega = \sin\theta - \mathrm{i}\cos\theta$. Les deux applications conservent le module. 
    $$\boxed{z \mapsto \omega z : R(\theta), \qquad z \mapsto \omega\overline{z} : S(\theta)}$$

    **2.** Soit $x'$ l'image de $x$ par la rotation d'angle $\frac{\pi}{2}$, de sorte que $(x, x')$ est orthonormée directe. La rotation d'angle $\theta$ qui envoie $x$ sur $y$ a pour matrice $R(\theta)$ dans cette base : $y = \cos\theta\,x + \sin\theta\,x'$. Donc $\langle x, y \rangle = \cos\theta$ et $\det(x, y) = \sin\theta\det(x, x') = \sin\theta$, le produit mixte ne dépendant pas de la base orthonormée directe (proposition 4).

    **3.** On normalise : pour $\frac{1}{\sqrt{5}}(1, 2)$ et $\frac{1}{\sqrt{5}}(-2, 1)$, $\cos\theta = 0$ et $\sin\theta = \frac{1 + 4}{5} = 1$. Pour $\frac{1}{\sqrt{10}}(3, 1)$ et $\frac{1}{\sqrt{10}}(1, 3)$, $\cos\theta = \frac{6}{10}$ et $\sin\theta = \frac{9 - 1}{10}$. 
    $$\boxed{\theta = \frac{\pi}{2} \ (\mathrm{mod}\ 2\pi), \qquad \theta = \operatorname{Arccos}\frac{3}{5} \approx 0{,}927 \ (\mathrm{mod}\ 2\pi)}$$
- id: "mp-07-28"
  feuille: "f-mp-07"
  numero: 28
  partie: "Réduction des isométries"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [réduction des isométries, rotations, orientation, trace]
  noeuds: [fq-orthogonalite, rd-diagonalisable, v-trace]
  notions: [matrice-orthogonale, groupe-orthogonal, orientation]
  source: "Endomorphismes d'un espace euclidien (Prost, LLG), exercice 4"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $w$ un vecteur unitaire de $\mathbb{R}^{3}$ et $\theta \in \mathbb{R}$. Montrer que la rotation $r$ d'axe orienté par $w$ et d'angle $\theta$ vérifie, pour tout $x$, 
    $$r(x) = \cos\theta\,x + (1 - \cos\theta)\langle w, x \rangle w + \sin\theta\,w \wedge x.$$
     On décomposera $x$ en sa composante sur $\mathbb{R} w$ et sa composante dans $w^{\perp}$.

    **2.** En déduire la matrice dans la base canonique de la rotation d'axe orienté par $(1, 1, 1)$ et d'angle $\frac{\pi}{4}$. Vérifier que sa trace vaut $1 + \sqrt{2}$.
  corrige: |
    **1.** On décompose $x = \langle w, x \rangle w + x_{\perp}$ avec $x_{\perp} \in w^{\perp}$. La composante sur l'axe est fixe. Soit $(w, e_{2}, e_{3})$ une base orthonormée directe ; alors $e_{3} = w \wedge e_{2}$ et $w \wedge e_{3} = -e_{2}$, de sorte que $y \mapsto w \wedge y$ est, sur $w^{\perp}$, la rotation d'angle $\frac{\pi}{2}$. La rotation $r$ agit sur $w^{\perp}$ par $R(\theta)$, soit $r(x_{\perp}) = \cos\theta\,x_{\perp} + \sin\theta\,w \wedge x_{\perp}$. Comme $w \wedge x = w \wedge x_{\perp}$, 
    $$r(x) = \langle w, x \rangle w + \cos\theta\big(x - \langle w, x \rangle w\big) + \sin\theta\,w \wedge x.$$

    $$\boxed{r(x) = \cos\theta\,x + (1 - \cos\theta)\langle w, x \rangle w + \sin\theta\,w \wedge x}$$
     C'est la formule de Rodrigues.

    **2.** Avec $w = \frac{1}{\sqrt{3}}(1, 1, 1)$ et $\cos\theta = \sin\theta = \frac{\sqrt{2}}{2}$, la matrice de $x \mapsto \langle w, x \rangle w$ est $\frac{1}{3}J$, et celle de $x \mapsto w \wedge x$ est 
    $$\frac{1}{\sqrt{3}}\begin{pmatrix} 0 & -1 & 1 \\ 1 & 0 & -1 \\ -1 & 1 & 0 \end{pmatrix}.$$
     On obtient 
    $$\boxed{R = \frac{1}{6}\begin{pmatrix} 2 + 2\sqrt{2} & 2 - \sqrt{2} - \sqrt{6} & 2 - \sqrt{2} + \sqrt{6} \\ 2 - \sqrt{2} + \sqrt{6} & 2 + 2\sqrt{2} & 2 - \sqrt{2} - \sqrt{6} \\ 2 - \sqrt{2} - \sqrt{6} & 2 - \sqrt{2} + \sqrt{6} & 2 + 2\sqrt{2} \end{pmatrix}}$$
     et $\operatorname{tr} R = \frac{6 + 6\sqrt{2}}{6} = 1 + \sqrt{2} = 1 + 2\cos\frac{\pi}{4}$, comme prévu. La matrice est invariante par permutation circulaire des coordonnées, ce qui reflète la symétrie de l'axe.
- id: "mp-07-29"
  feuille: "f-mp-07"
  numero: 29
  partie: "Réduction des isométries"
  etoiles: 2
  types: [Démonstration, Calcul]
