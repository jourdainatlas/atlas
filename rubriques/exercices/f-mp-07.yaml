  enonce: |
    Soient $A$, $B \in \mathcal{S}_{n}(\mathbb{R})$ telles que $A^{2025} = B^{2025}$. Montrer que $A = B$. On montrera que $A$ et $B$ ont les mêmes sous-espaces propres, en utilisant l'injectivité de $t \mapsto t^{2025}$ sur $\mathbb{R}$. Le résultat subsiste-t-il avec l'exposant $2026$ ?
  corrige: |
    On diagonalise $A$ dans une base orthonormée : $E = \bigoplus_{\lambda} E_{\lambda}(A)$, et $A^{2025}$ agit sur $E_{\lambda}(A)$ par $\lambda^{2025}$. Comme $t \mapsto t^{2025}$ est injective sur $\mathbb{R}$, les nombres $\lambda^{2025}$ sont distincts, et les sous-espaces propres de $C = A^{2025}$ sont exactement les $E_{\lambda}(A)$, avec $E_{\mu}(C) = E_{\mu^{1/2025}}(A)$, où $\mu^{1/2025}$ désigne l'unique racine réelle. Il en est de même pour $B$. Ainsi $A$ et $B$ coïncident sur chaque $E_{\mu}(C)$, dont la somme est $E$. 
    $$\boxed{A = B}$$
     Avec l'exposant $2026$, c'est faux : $I_{n}$ et $-I_{n}$ ont le même carré. Le résultat subsiste pour $A$, $B \in \mathcal{S}_{n}^{+}(\mathbb{R})$, puisque $t \mapsto t^{2026}$ est injective sur $\mathbb{R}_{+}$ : c'est l'unicité de la racine carrée de l'exercice 55.
- id: "mp-07-45"
  feuille: "f-mp-07"
