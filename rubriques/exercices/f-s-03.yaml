  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Le pari du chevalier de Méré.* Au XVIIᵉ siècle, le chevalier de Méré soutenait qu'il était avantageux de parier sur l'apparition d'un $6$ en lançant quatre fois un dé, mais qu'il fallait vingt-quatre lancers de deux dés pour obtenir un double $6$ avec les mêmes chances.

    **1.** On lance quatre fois un dé équilibré.

    **(a)** Quelle est la probabilité de ne pas obtenir de $6$ lors d'un lancer ?

    **(b)** En déduire la probabilité de n'obtenir aucun $6$ au cours des quatre lancers.

    **(c)** En déduire la probabilité d'obtenir au moins un $6$. Arrondir à $10^{-4}$.

    **2.** On lance maintenant vingt-quatre fois deux dés équilibrés.

    **(a)** Justifier que la probabilité d'obtenir un double $6$ lors d'un lancer vaut $\dfrac{1}{36}$.

    **(b)** En déduire la probabilité d'obtenir au moins un double $6$ au cours des vingt-quatre lancers. Arrondir à $10^{-4}$.

    **3.** Comparer les deux probabilités obtenues. Le chevalier de Méré avait-il raison ?
  corrige: |
    **1.** On lance quatre fois un dé équilibré. Les quatre lancers sont indépendants : le dé n'a pas de mémoire.

    **(a)** Cinq faces sur six ne sont pas des $6$ : 
    $$P(\text{pas de } 6 \text{ à un lancer})=\boxed{\frac{5}{6}}$$

    **(b)** On multiplie les probabilités le long du chemin de l'arbre « pas de $6$ » répété quatre fois : 
    $$P(\text{aucun } 6)=\frac{5}{6}\times\frac{5}{6}\times\frac{5}{6}\times\frac{5}{6} =\left(\frac{5}{6}\right)^{4}=\boxed{\frac{625}{1\,296}\approx 0{,}4823}$$

    **(c)** « Obtenir au moins un $6$ » est l'événement contraire de « n'obtenir aucun $6$ » : 
    $$P(\text{au moins un } 6)=1-\frac{625}{1\,296}=\frac{671}{1\,296}\approx\boxed{0{,}5177}$$

    **2.** On lance vingt-quatre fois deux dés équilibrés.

    **(a)** En lançant deux dés distinguables, il y a $6\times 6=36$ issues équiprobables, et une seule donne un double $6$ : 
    $$P(\text{double } 6)=\boxed{\frac{1}{36}}$$

    **(b)** La probabilité de ne pas obtenir de double $6$ à un lancer vaut $1-\dfrac{1}{36}=\dfrac{35}{36}$. Les vingt-quatre lancers étant indépendants : 
    $$P(\text{aucun double } 6)=\left(\frac{35}{36}\right)^{24}\approx 0{,}5086$$

    $$P(\text{au moins un double } 6)=1-\left(\frac{35}{36}\right)^{24}\approx\boxed{0{,}4914}$$

    **3.** On compare : $0{,}5177>0{,}5$ mais $0{,}4914<0{,}5$. 
    $$\boxed{\text{Le chevalier de Méré avait tort : les deux paris ne sont pas équivalents.}}$$
     Le premier pari est légèrement *favorable* au joueur (un peu plus d'une chance sur deux), tandis que le second est légèrement *défavorable*. L'écart est faible, mais suffisant pour qu'un joueur assidu finisse par le remarquer… ce qui fut le cas du chevalier, dont la question posée à Pascal est à l'origine du calcul des probabilités.
- id: "s-03-29"
  feuille: "f-s-03"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [événements, équiprobabilité, probabilité conditionnelle, indépendance, tirages]
  noeuds: [p-espace, p-independance]
  notions: [espace-probabilise, independance]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ **Réponse A** ¦ **Réponse B** ¦ **Réponse C**
    1. On lance un dé équilibré. La probabilité d'obtenir un multiple de $3$ vaut ¦ $\dfrac{1}{2}$ ¦ $\dfrac{1}{3}$ ¦ $\dfrac{2}{3}$
    2. Si $P(A)=0,7$, alors $P\left(\overline{A}\right)$ vaut ¦ $0,3$ ¦ $-0,7$ ¦ $1,7$
    3. Si $A$ et $B$ sont incompatibles avec $P(A)=0,2$ et $P(B)=0,5$, alors $P(A\cup B)$ vaut ¦ $0,1$ ¦ $0,7$ ¦ $0,6$
    4. La probabilité de $B$ sachant $A$ vaut ¦ $\dfrac{P(A\cap B)}{P(B)}$ ¦ $\dfrac{P(A\cap B)}{P(A)}$ ¦ $P(A)\times P(B)$
    5. Si $A$ et $B$ sont indépendants avec $P(A)=0,4$ et $P(B)=0,5$, alors $P(A\cap B)$ vaut ¦ $0,9$ ¦ $0,2$ ¦ $0$
    6. On lance deux fois une pièce équilibrée. La probabilité d'obtenir au moins un « pile » vaut ¦ $\dfrac{1}{2}$ ¦ $\dfrac{1}{4}$ ¦ $\dfrac{3}{4}$
    ```
  corrige: |
    **1.** **Réponse B.** Les multiples de $3$ sur un dé sont $3$ et $6$, donc $P=\dfrac{2}{6}=\boxed{\dfrac{1}{3}}$.

    **2.** **Réponse A.** $P\left(\overline{A}\right)=1-P(A)=1-0{,}7=\boxed{0{,}3}$. Une probabilité ne peut être ni négative, ni supérieure à $1$ : les réponses B et C étaient donc à écarter immédiatement.

    **3.** **Réponse B.** Comme $A$ et $B$ sont incompatibles, $P(A\cap B)=0$ et 
    $$P(A\cup B)=0{,}2+0{,}5-0=\boxed{0{,}7}$$

    **4.** **Réponse B.** Par définition, $P_A(B)=\boxed{\dfrac{P(A\cap B)}{P(A)}}$ : on divise par la probabilité de l'événement *déjà réalisé*, celui qui est écrit en indice.

    **5.** **Réponse B.** Comme $A$ et $B$ sont indépendants, $P(A\cap B)=0{,}4\times 0{,}5=\boxed{0{,}2}$.

    **6.** **Réponse C.** Le contraire est « aucun pile », de probabilité $\dfrac{1}{4}$, donc 
    $$P(\text{au moins un pile})=1-\frac{1}{4}=\boxed{\frac{3}{4}}$$
- id: "s-03-30"
  feuille: "f-s-03"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [événements, équiprobabilité, arbre pondéré, tirages]
  noeuds: [p-espace]
  notions: []
  page_enonce: 10
  page_corrige: 20
  enonce: |
    Une maladie touche $2\,\%$ de la population d'une région. Un test de dépistage a été mis au point :

    • si une personne est malade, le test est positif dans $95\,\%$ des cas ;

    • si une personne n'est pas malade, le test est tout de même positif dans $3\,\%$ des cas.

    On choisit une personne au hasard dans la population. On note $M$ l'événement « la personne est malade » et $T$ l'événement « le test est positif ».

    **1.** Traduire les données de l'énoncé avec les notations du cours, puis représenter la situation par un arbre pondéré.

    **2.** Calculer $P(M\cap T)$ et $P\left(\overline{M}\cap T\right)$.

    **3.** En déduire $P(T)$, la probabilité que le test soit positif.

    **4.** Le test d'une personne est positif. Calculer la probabilité qu'elle soit réellement malade. Arrondir à $10^{-3}$.

    **5.** Le résultat précédent vous semble-t-il surprenant ? Expliquer, en comparant le nombre de malades au nombre de personnes saines dans cette région.
  corrige: |
    **1.** $2\,\%$ de la population est malade, donc $P(M)=0{,}02$ et $P\left(\overline{M}\right)=0{,}98$. Les deux autres données concernent des sous-populations : ce sont des probabilités conditionnelles. 
    $$\boxed{P(M)=0{,}02\qquad P_M(T)=0{,}95 \qquad P_{\overline{M}}(T)=0{,}03}$$

    ![Figure](documents/figures/08930f3ac8d7aebf.svg)

    **2.** 
    $$P(M\cap T)=P(M)\times P_M(T)=0{,}02\times 0{,}95=\boxed{0{,}019}$$

    $$P\left(\overline{M}\cap T\right)=P\left(\overline{M}\right)\times P_{\overline{M}}(T) =0{,}98\times 0{,}03=\boxed{0{,}029\,4}$$

    **3.** Un test positif concerne soit un malade, soit une personne saine : 
    $$P(T)=P(M\cap T)+P\left(\overline{M}\cap T\right)=0{,}019+0{,}029\,4 =\boxed{0{,}048\,4}$$

    **4.** On sait maintenant que le test est positif : 
    $$P_T(M)=\frac{P(M\cap T)}{P(T)}=\frac{0{,}019}{0{,}048\,4} \approx\boxed{0{,}393}$$

    **5.** Ce résultat est surprenant : le test paraît très fiable ($95\,\%$ de détection), et pourtant moins de $40\,\%$ des personnes testées positives sont réellement malades.

    L'explication tient au nombre de personnes concernées. Sur $10\,000$ habitants :

    • $200$ sont malades, dont $200\times 0{,}95=190$ sont testées positives ;

    • $9\,800$ sont saines, et même avec seulement $3\,\%$ d'erreurs, $9\,800\times 0{,}03=294$ d'entre elles sont testées positives.

    Il y a donc $190+294=484$ tests positifs, dont seulement $190$ correspondent à de vrais malades : $\dfrac{190}{484}\approx 0{,}393$. Les personnes saines étant *très* nombreuses, leurs rares erreurs de test sont plus nombreuses que les vrais malades détectés. 
    $$\boxed{\text{Un test positif doit donc toujours être confirmé par un second examen.}}$$

