    **1.** Déterminer toutes les fonctions continues $f : [0\,,1] \to \mathbb{R}$ telles que $\displaystyle f(x) = \sum_{n=1}^{+\infty} \frac{f(x^{n})}{2^{n}}$ pour tout $x \in [0\,,1]$.

    **2.** Déterminer toutes les fonctions continues $f : [0\,,1] \to \mathbb{R}$ telles que $\displaystyle f(x) = \sum_{n=1}^{+\infty} \frac{f(x^{n})}{3^{n}}$ pour tout $x \in [0\,,1]$.
  corrige: |
    *Idée.* La relation exprime $f(x)$ comme une moyenne pondérée des valeurs $f(x^{n})$, de poids $\frac{1}{2^{n}}$ de somme $1$ dans le premier cas, et de poids $\frac{1}{3^{n}}$ de somme $\frac{1}{2}$ dans le second. On l'écrit au point où $f$ atteint son maximum sur un segment $[0\,,a]$ avec $a < 1$ : les points $x^{n}$ restent dans ce segment et tendent vers $0$.

    Dans les deux questions, la série du second membre converge pour toute fonction $f$ continue sur $[0\,,1]$, puisque $f$ y est bornée (chapitre 8, théorème 10) : son terme général est dominé par $\frac{1}{2^{n}}$ (proposition 9).

    **1.** Toute fonction constante égale à $c$ convient, puisque $\sum_{n=1}^{+\infty} \frac{c}{2^{n}} = c$. Réciproquement, soit $f$ une solution et $a \in [0\,,1[$. La fonction $f$ est continue sur le segment $[0\,,a]$ : elle y atteint son maximum $M$ en un point $x_{0}$ (chapitre 8, théorème 10). Pour tout $n \geqslant 1$, $x_{0}^{n} \in [0\,,a]$, donc $f(x_{0}^{n}) \leqslant M$, et 
    $$0 = M - f(x_{0}) = \sum_{n=1}^{+\infty} \frac{M}{2^{n}} - \sum_{n=1}^{+\infty} \frac{f(x_{0}^{n})}{2^{n}} = \sum_{n=1}^{+\infty} \frac{M - f(x_{0}^{n})}{2^{n}}.$$
     Une série convergente de termes positifs de somme nulle a tous ses termes nuls, puisque chaque terme est majoré par la somme (proposition 5) : $f(x_{0}^{n}) = M$ pour tout $n \geqslant 1$. Comme $0 \leqslant x_{0} \leqslant a < 1$, la suite $(x_{0}^{n})$ tend vers $0$, et la continuité de $f$ en $0$ donne $f(0) = M$ (chapitre 8, théorème 7). Le même raisonnement au point où $f$ atteint son minimum $m$ sur $[0\,,a]$ donne $f(0) = m$. Ainsi $m = M$ : $f$ est constante, égale à $f(0)$, sur $[0\,,a]$.

    Ceci valant pour tout $a < 1$, $f$ est constante sur $[0\,,1[$, et, par continuité en $1$, $f(1) = f(0)$. 
    $$\boxed{\text{les solutions sont les fonctions constantes}}$$

    **2.** La fonction nulle convient. Soit $f$ une solution. En $x = 0$ et en $x = 1$, les points $x^{n}$ valent $x$, et la relation donne $f(x) = f(x)\sum_{n=1}^{+\infty} \frac{1}{3^{n}} = \frac{1}{2}f(x)$, d'où $f(0) = f(1) = 0$. Soit $a \in [0\,,1[$, et $M = f(x_{0})$ le maximum de $f$ sur $[0\,,a]$. Comme dans la question 1, 
    $$M = f(x_{0}) = \sum_{n=1}^{+\infty} \frac{f(x_{0}^{n})}{3^{n}} \leqslant M\sum_{n=1}^{+\infty} \frac{1}{3^{n}} = \frac{M}{2},$$
     donc $M \leqslant 0$. De même, le minimum $m$ vérifie $m \geqslant \frac{m}{2}$, donc $m \geqslant 0$. Ainsi $f = 0$ sur $[0\,,a]$ pour tout $a < 1$, et $f(1) = 0$. 
    $$\boxed{\text{la seule solution est la fonction nulle}}$$

    *Piège.* L'erreur la plus répandue est d'appliquer l'argument du maximum sur $[0\,,1]$ tout entier. Si le maximum est atteint en $x_{0} = 1$, les points $x_{0}^{n}$ valent tous $1$ et ne tendent pas vers $0$ : on n'apprend rien, puisque la relation en $1$ se réduit à $f(1) = f(1)$ dans la question 1. C'est pour cela qu'on travaille sur $[0\,,a]$, avec $a < 1$, et qu'on conclut en $1$ par continuité.

    *À retenir.* Seule compte la somme $\sigma$ des poids. Si les poids sont positifs et de somme $1$, la relation est une moyenne, et l'argument du maximum donne les constantes ; si leur somme est dans $[0\,,1[$, il donne $M \leqslant \sigma M$ et $m \geqslant \sigma m$, donc la seule solution nulle. C'est le même mécanisme qu'un principe du maximum : une fonction égale à la moyenne de ses valeurs ne peut pas avoir de maximum strict.
- id: "ma-20-62"
  feuille: "f-ma-20"
  numero: 62
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Calcul]
  mots_cles: ["indicatrice d'Euler", sommation par paquets]
  noeuds: [q-denombrable, z-premiers]
  notions: [denombrable]
  page_enonce: 14
  page_corrige: 69
  enonce: |
    Pour tout entier $n \geqslant 1$, on note $\varphi(n)$ le nombre d'entiers $k \in [\![1\,;n]\!]$ premiers avec $n$. Calculer 
    $$\sum_{n=1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1}.$$
  corrige: |
    *Idée.* On développe chaque $\frac{1}{2^{n} - 1}$ en série géométrique de raison $2^{-n}$, et l'on somme la famille positive $\big(\varphi(n)\,2^{-nk}\big)$ selon la valeur du produit $N = nk$. Il faut alors connaître $\sum_{d \mid N} \varphi(d)$, qui vaut $N$ : c'est une identité de Gauss, que l'on démontre en classant les entiers de $[\![1\,;N]\!]$ selon leur PGCD avec $N$.

    **L'identité $\sum_{d \mid N} \varphi(d) = N$.** Soit $N \geqslant 1$. Pour chaque diviseur positif $d$ de $N$, soit $A_{d}$ l'ensemble des $k \in [\![1\,;N]\!]$ tels que $k \wedge N = \frac{N}{d}$. Pour tout $k \in [\![1\,;N]\!]$, l'entier $k \wedge N$ est un diviseur positif de $N$, de la forme $\frac{N}{d}$ pour un unique diviseur $d$ : les $A_{d}$ forment une partition de $[\![1\,;N]\!]$. Soit $g = \frac{N}{d}$. Si $k \in A_{d}$, on écrit $k = gj$ et $N = gd$ ; alors $1 \leqslant j \leqslant d$, et $j \wedge d = 1$ (chapitre 12, proposition 6). Réciproquement, si $j \in [\![1\,;d]\!]$ et $j \wedge d = 1$, l'entier $k = gj$ appartient à $[\![1\,;N]\!]$, et $k \wedge N = g\,(j \wedge d) = g$ (chapitre 12, proposition 5). L'application $k \mapsto \frac{k}{g}$ est donc une bijection de $A_{d}$ sur l'ensemble des $j \in [\![1\,;d]\!]$ premiers avec $d$, qui a $\varphi(d)$ éléments. En comptant les éléments de $[\![1\,;N]\!]$ par paquets, 
    $$\boxed{\sum_{d \mid N} \varphi(d) = N}$$
     Par exemple, pour $N = 12$ : $\varphi(1) + \varphi(2) + \varphi(3) + \varphi(4) + \varphi(6) + \varphi(12) = 1 + 1 + 2 + 2 + 2 + 4 = 12$ ✓.

    **Le calcul.** Pour $n \geqslant 1$, la série géométrique de raison $2^{-n}$ donne $\sum_{k=1}^{+\infty} 2^{-nk} = \frac{2^{-n}}{1 - 2^{-n}} = \frac{1}{2^{n} - 1}$. La famille $\big(\varphi(n)\,2^{-nk}\big)_{(n,k) \in (\mathbb{N}^{*})^{2}}$ est positive ; par le théorème 9, en sommant d'abord sur $k$, 
    $$\sum_{(n,k)} \varphi(n)\,2^{-nk} = \sum_{n=1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1}.$$
     On groupe maintenant les couples selon la valeur $N = nk \geqslant 1$ (théorème 8) : le paquet de $N$ est formé des couples $(d, \frac{N}{d})$, pour $d$ diviseur de $N$, et sa somme est $2^{-N}\sum_{d \mid N} \varphi(d) = N\,2^{-N}$. Ainsi, dans $[0\,,+\infty]$, 
    $$\sum_{n=1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1} = \sum_{N=1}^{+\infty} \frac{N}{2^{N}}.$$
     Le cours (section 20.7.4) donne $\sum_{n=0}^{+\infty} (n + 1)z^{n} = \frac{1}{(1 - z)^{2}}$ pour $|z| < 1$ ; avec $z = \frac{1}{2}$, on obtient $\sum_{N=1}^{+\infty} \frac{N}{2^{N}} = \frac{1}{2}\sum_{n=0}^{+\infty} \frac{n + 1}{2^{n}} = \frac{1}{2} \times 4 = 2$. La somme est finie, ce qui établit du même coup la convergence de la série : 
    $$\boxed{\sum_{n=1}^{+\infty} \frac{\varphi(n)}{2^{n} - 1} = 2}$$
     La somme des $199$ premiers termes vaut $2$ à la précision des calculs ✓, et les cinq premiers donnent déjà 
    $$1 + \frac{1}{3} + \frac{2}{7} + \frac{2}{15} + \frac{4}{31} \approx 1{,}88.$$

    *À retenir.* Aucune convergence n'est à vérifier : la famille étant positive, le théorème 8 garantit que le regroupement selon $nk$ est légitime, et le résultat fini prouve la convergence. La même méthode donne, pour $|x| < 1$, l'identité $\sum_{n=1}^{+\infty} \frac{\varphi(n)x^{n}}{1 - x^{n}} = \frac{x}{(1 - x)^{2}}$, de la même famille que celles de l'exercice 54 ; pour $x$ complexe, il faut alors établir la sommabilité par le théorème 9 sur les modules, en utilisant $\varphi(n) \leqslant n$.
- id: "ma-20-63"
  feuille: "f-ma-20"
  numero: 63
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [interversion limite-somme, familles sommables]
  noeuds: [q-denombrable, as-series]
  notions: []
  page_enonce: 14
  page_corrige: 70
  enonce: |
    Soit $(u_{k})_{k \in \mathbb{N}}$ une suite de suites réelles positives : pour chaque $k$, $u_{k} = (u_{k}(n))_{n \in \mathbb{N}}$ est une suite de réels positifs, et l'on suppose que la série $\sum_{n} u_{k}(n)$ converge. Montrer qu'il existe une suite réelle $v = (v(n))_{n \in \mathbb{N}}$ telle que la série $\sum_{n} v(n)$ converge et que, pour tout $k \in \mathbb{N}$, on ait $u_{k}(n) \leqslant v(n)$ à partir d'un certain rang.
  corrige: |
    *Idée.* On construit $v$ par blocs : sur le $k$-ième bloc d'entiers, $v$ vaut le maximum de $u_{0}$, …, $u_{k}$, et l'on commence ce bloc assez loin pour que le reste de la série correspondante soit inférieur à $2^{-k}$. C'est un procédé diagonal.

    **Les séries majorantes.** Pour $k \in \mathbb{N}$ et $n \in \mathbb{N}$, soit $w_{k}(n) = \max\big(u_{0}(n), \dots, u_{k}(n)\big)$. On a $0 \leqslant w_{k}(n) \leqslant u_{0}(n) + \cdots + u_{k}(n)$, terme général d'une série convergente (proposition 1 (i)) : la série $\sum_{n} w_{k}(n)$ converge (théorème 3). On note $R_{k}(N) = \sum_{n=N}^{+\infty} w_{k}(n)$ ; pour $k$ fixé, $R_{k}(N)$ tend vers $0$ quand $N$ tend vers $+\infty$ (proposition 3). Enfin, $w_{k} \leqslant w_{k+1}$ et $u_{j} \leqslant w_{k}$ dès que $j \leqslant k$.

    **Les blocs.** On pose $N_{0} = 0$, et l'on construit par récurrence des entiers $N_{1} < N_{2} < \cdots$ : si $N_{k-1}$ est construit, on choisit $N_{k} > N_{k-1}$ tel que $R_{k}(N_{k}) \leqslant 2^{-k}$, ce qui est possible puisque $R_{k}(N)$ tend vers $0$. La suite $(N_{k})$ est strictement croissante et à valeurs entières, donc elle tend vers $+\infty$, et tout entier $n$ appartient à un unique intervalle $[\![N_{k}\,;N_{k+1} - 1]\!]$. On pose 
    $$v(n) = w_{k}(n) \qquad\text{pour } N_{k} \leqslant n < N_{k+1}.$$

    **La série $\sum v(n)$ converge.** Elle est à termes positifs. Par la sommation par paquets (théorème 8), avec les blocs $[\![N_{k}\,;N_{k+1} - 1]\!]$, 
    $$\sum_{n=0}^{+\infty} v(n) = \sum_{n=0}^{N_{1}-1} w_{0}(n) + \sum_{k=1}^{+\infty}\,\sum_{n=N_{k}}^{N_{k+1}-1} w_{k}(n) \leqslant \sum_{n=0}^{N_{1}-1} w_{0}(n) + \sum_{k=1}^{+\infty} R_{k}(N_{k}) \leqslant \sum_{n=0}^{N_{1}-1} w_{0}(n) + 1,$$
     qui est fini.

    **Domination.** Soit $j \in \mathbb{N}$ et $n \geqslant N_{j}$. L'entier $n$ appartient à un bloc $[\![N_{k}\,;N_{k+1} - 1]\!]$ avec $k \geqslant j$, puisque la suite $(N_{k})$ est croissante, et $v(n) = w_{k}(n) \geqslant u_{j}(n)$. 
    $$\boxed{\text{la suite } v \text{ convient : } \sum v(n) \text{ converge, et } u_{j}(n) \leqslant v(n) \text{ pour tout } n \geqslant N_{j}}$$

    *Piège.* L'erreur la plus répandue est de poser $v(n) = \sup_{k} u_{k}(n)$ : ce supremum peut être infini, et même fini, il n'a aucune raison d'être le terme général d'une série convergente. Pour $u_{k}(n) = 1$ si $n = k$ et $0$ sinon, il vaut $1$ pour tout $n$. La construction par blocs ne compare $v$ qu'à un nombre fini de suites à la fois, et c'est le « à partir d'un certain rang » de l'énoncé qui le permet.

    *À retenir.* L'exercice 27 a montré qu'aucune série convergente à termes strictement positifs $\sum v(n)$ ne domine toutes les autres : sa deuxième question fournit $b_{n} \to +\infty$ telle que $\sum v(n)b_{n}$ converge, et $v(n)b_{n}$ dépasse $v(n)$ à partir d'un certain rang. L'exercice 63 montre en revanche qu'une *suite* de séries convergentes est toujours dominée par une seule : on peut converger plus lentement que chacune des séries d'une suite donnée, mais pas que toutes les séries convergentes à la fois.
- id: "ma-20-64"
  feuille: "f-ma-20"
  numero: 64
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [fonctions préservant la convergence]
  noeuds: [as-series]
  notions: []
  page_enonce: 14
  page_corrige: 71
  enonce: |
    On dit qu'une fonction $f : \mathbb{R} \to \mathbb{R}$ *préserve la convergence* si, pour toute série réelle convergente $\sum a_{n}$, la série $\sum f(a_{n})$ converge. Montrer que les fonctions qui préservent la convergence sont exactement celles qui coïncident, sur un voisinage de $0$, avec une fonction $x \mapsto \lambda x$, où $\lambda$ est un réel.
  corrige: |
    *Idée.* Une série convergente peut contenir, à des rangs de plus en plus éloignés, des blocs de termes de somme nulle répétés autant de fois qu'on le veut. Si $f$ ne respecte pas la somme d'un tel bloc, en répétant le bloc assez de fois on fait diverger la série des images. On en tire, près de $0$, l'additivité $f(x + y) = f(x) + f(y)$ ; la continuité en $0$, obtenue de la même façon, transforme cette additivité en linéarité.

    **Condition suffisante.** Soit $\lambda \in \mathbb{R}$ et $\delta > 0$ tels que $f(x) = \lambda x$ pour $|x| < \delta$. Si $\sum a_{n}$ converge, alors $a_{n}$ tend vers $0$ (proposition 2), donc $|a_{n}| < \delta$ et $f(a_{n}) = \lambda a_{n}$ à partir d'un certain rang $n_{0}$. La série $\sum_{n \geqslant n_{0}} \lambda a_{n}$ converge (proposition 1), et modifier un nombre fini de termes ne change pas la nature d'une série : $\sum f(a_{n})$ converge.

    **Condition nécessaire.** Soit $f$ une fonction qui préserve la convergence.

    *Étape 1 : un lemme sur les blocs.* Soit $p \geqslant 1$ un entier et, pour tout $k \geqslant 1$, une liste $(b_{k,1}, \dots, b_{k,p})$ de réels telle que 
    $$b_{k,1} + \cdots + b_{k,p} = 0 \qquad\text{et}\qquad \varepsilon_{k} = \max_{1 \leqslant i \leqslant p} |b_{k,1} + \cdots + b_{k,i}| \xrightarrow[k \to +\infty]{} 0.$$
     On pose $h_{k} = f(b_{k,1}) + \cdots + f(b_{k,p})$. Montrons que $h_{k} = 0$ à partir d'un certain rang.

    Supposons le contraire : l'ensemble des $k$ tels que $h_{k} \neq 0$ est infini, et l'on note $k_{1} < k_{2} < \cdots$ ses éléments. Pour tout $\ell \geqslant 1$, soit $m_{\ell}$ un entier tel que $m_{\ell}\,|h_{k_{\ell}}| \geqslant 1$. On forme la suite $(a_{n})$ en écrivant, pour $\ell = 1, 2, \ldots$, la liste $(b_{k_{\ell},1}, \dots, b_{k_{\ell},p})$ répétée $m_{\ell}$ fois ; on appelle « groupe $\ell$ » ces $p\,m_{\ell}$ termes consécutifs, et l'on note $L_{\ell} = p\,(m_{1} + \cdots + m_{\ell})$ le nombre de termes des $\ell$ premiers groupes.

    La série $\sum a_{n}$ converge vers $0$. En effet, chaque liste complète a une somme nulle ; la somme partielle des $N$ premiers termes est donc une somme $b_{k_{\ell},1} + \cdots + b_{k_{\ell},i}$, où $\ell$ est le groupe du dernier terme écrit, et sa valeur absolue est au plus $\varepsilon_{k_{\ell}}$. Pour $N > L_{\ell_{0}}$, ce groupe est d'indice $\ell > \ell_{0}$ ; comme $k_{\ell} \geqslant \ell$ et $\varepsilon_{k} \to 0$, la somme partielle tend vers $0$.

    Par hypothèse, la série $\sum f(a_{n})$ converge ; soit $B_{N}$ la somme de ses $N$ premiers termes, et $B$ sa somme. La suite extraite $(B_{L_{\ell}})_{\ell}$ tend aussi vers $B$ (chapitre 7, proposition 11), donc $B_{L_{\ell}} - B_{L_{\ell-1}}$ tend vers $0$. Or cette différence est la somme des images du groupe $\ell$, c'est-à-dire $m_{\ell}\,h_{k_{\ell}}$, de valeur absolue au moins $1$. C'est une contradiction, et le lemme est démontré.

    *Étape 2 : additivité près de $0$.* Montrons qu'il existe $\delta > 0$ tel que 
    $$f(x) + f(y) + f(-x - y) = 0 \qquad\text{pour tous } x, y \in \left]-\delta\,,\delta\right[. \tag{1}$$
     Sinon, pour tout $k \geqslant 1$, il existe $x_{k}$, $y_{k}$ dans $\left]-\frac{1}{k}\,,\frac{1}{k}\right[$ tels que $f(x_{k}) + f(y_{k}) + f(-x_{k} - y_{k}) \neq 0$. Les listes $(x_{k}, y_{k}, -x_{k} - y_{k})$ ont une somme nulle, et leurs sommes partielles $x_{k}$, $x_{k} + y_{k}$, $0$ sont de valeur absolue au plus $\frac{2}{k}$, qui tend vers $0$. Le lemme, avec $p = 3$, donne $f(x_{k}) + f(y_{k}) + f(-x_{k} - y_{k}) = 0$ à partir d'un certain rang : c'est une contradiction.

    Avec $x = y = 0$, la relation (1) donne $3f(0) = 0$, donc $f(0) = 0$. Avec $y = -x$, elle donne $f(x) + f(-x) = 0$ : $f$ est impaire sur $\left]-\delta\,,\delta\right[$. Enfin, soit $\eta = \frac{\delta}{2}$ et $x, y \in \left]-\eta\,,\eta\right[$ ; alors $x + y \in \left]-\delta\,,\delta\right[$, donc $f(-x - y) = -f(x + y)$, et (1) devient 
    $$f(x + y) = f(x) + f(y) \qquad\text{pour tous } x, y \in \left]-\eta\,,\eta\right[. \tag{2}$$

    *Étape 3 : continuité en $0$.* Supposons que $f$ ne tende pas vers $f(0) = 0$ en $0$. Il existe alors $\varepsilon > 0$ tel que, pour tout $k \in \mathbb{N}$, on puisse trouver un réel $x_{k}$ avec $|x_{k}| \leqslant 2^{-k}$ et $|f(x_{k})| > \varepsilon$. La série $\sum x_{k}$ est absolument convergente, par comparaison avec une série géométrique (théorème 3), donc convergente (théorème 6). Mais $f(x_{k})$ ne tend pas vers $0$, et $\sum f(x_{k})$ diverge grossièrement (proposition 2). C'est une contradiction : $f$ est continue en $0$.

    *Étape 4 : linéarité près de $0$.* Soit $x \in \left]-\eta\,,\eta\right[$ et $q \geqslant 1$ un entier. Pour $1 \leqslant j < q$, les réels $\frac{jx}{q}$ et $\frac{x}{q}$ sont dans $\left]-\eta\,,\eta\right[$, et (2) donne $f\big(\frac{(j+1)x}{q}\big) = f\big(\frac{jx}{q}\big) + f\big(\frac{x}{q}\big)$. Par récurrence sur $j$, $f\big(\frac{jx}{q}\big) = j\,f\big(\frac{x}{q}\big)$ pour $1 \leqslant j \leqslant q$ ; avec $j = q$, $f\big(\frac{x}{q}\big) = \frac{1}{q}f(x)$. Ainsi, en tenant compte de $f(0) = 0$, 
    $$f\Big(\frac{j}{q}\,x\Big) = \frac{j}{q}\,f(x) \qquad\text{pour } 0 \leqslant j \leqslant q. \tag{3}$$
     Soit $x_{0} = \frac{\eta}{2}$ et $\lambda = \frac{f(x_{0})}{x_{0}}$. Soit $t \in [0\,,x_{0}]$ et, pour $n \geqslant 1$, $r_{n} = \frac{1}{n}\big\lfloor\frac{nt}{x_{0}}\big\rfloor$, qui est un rationnel de $[0\,,1]$ tel que $0 \leqslant \frac{t}{x_{0}} - r_{n} < \frac{1}{n}$. Les réels $r_{n}x_{0}$ et $t - r_{n}x_{0}$ sont dans $[0\,,x_{0}] \subset \left]-\eta\,,\eta\right[$ ; par (2) puis (3), 
    $$f(t) = f(r_{n}x_{0}) + f(t - r_{n}x_{0}) = \lambda\,r_{n}x_{0} + f(t - r_{n}x_{0}).$$
     Quand $n$ tend vers $+\infty$, $r_{n}x_{0}$ tend vers $t$, et $t - r_{n}x_{0}$ tend vers $0$, donc $f(t - r_{n}x_{0})$ tend vers $f(0) = 0$ par l'étape 3 (chapitre 8, théorème 7). Il reste $f(t) = \lambda t$ pour tout $t \in [0\,,x_{0}]$, puis, par imparité, pour tout $t \in [-x_{0}\,,x_{0}]$. 
    $$\boxed{f \text{ préserve la convergence} \iff \text{il existe } \lambda \in \mathbb{R} \text{ et } \delta' > 0 \text{ tels que } f(x) = \lambda x \text{ pour } |x| < \delta'}$$

    *Piège.* L'erreur la plus répandue est de croire qu'un équivalent suffit : la fonction $\sin$ vérifie $\sin x \sim x$ en $0$, et pourtant elle ne préserve pas la convergence. Avec $x_{k} = k^{-1/3}$, la série formée des blocs $(x_{k}, x_{k}, -2x_{k})$ converge, ses sommes partielles valant $x_{k}$, $2x_{k}$ ou $0$. Si la série des sinus convergeait, la série de ses paquets de trois termes convergerait aussi (exercice 6). Or ces paquets valent 
    $$2\sin x_{k} - \sin(2x_{k}) = 2\sin x_{k}\,(1 - \cos x_{k}) \sim x_{k}^{3} = \frac{1}{k},$$
     terme général positif d'une série divergente (théorème 4). Les termes d'ordre $3$ du développement de $\sin$, invisibles dans l'équivalent, se cumulent : sur les $20\,000$ premiers blocs, la somme des sinus vaut déjà environ $9{,}98$, alors que les sommes partielles de la série de départ, en fin de bloc, sont nulles ✓. Le résultat est le même pour toute fonction non linéaire près de $0$, par exemple $x \mapsto x + x^{2}$, avec les blocs $(x_{k}, -x_{k})$ et $x_{k} = k^{-1/2}$, dont les images ont pour somme $2x_{k}^{2} = \frac{2}{k}$.

    *À retenir.* L'étape 3 n'est pas un détail : l'additivité (2) seule ne suffit pas à conclure, car il existe des fonctions additives sur $\mathbb{R}$ qui ne sont pas linéaires, dont la construction dépasse largement le programme. C'est la continuité en $0$, fournie elle aussi par l'hypothèse, qui permet le passage des rationnels aux réels, comme dans l'étude de l'équation fonctionnelle $f(x + y) = f(x) + f(y)$ sur $\mathbb{R}$ tout entier.

