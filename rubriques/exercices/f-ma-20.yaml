- id: "ma-20-01"
  feuille: "f-ma-20"
  numero: 1
  partie: "Séries numériques : généralités"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [séries numériques, séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Montrer les égalités suivantes, après avoir justifié la convergence de chacune des séries.

    **(a)** $\displaystyle\sum_{n=2}^{+\infty} \ln\Big(1 - \frac{1}{n^{2}}\Big) = -\ln 2$

    **(b)** $\displaystyle\sum_{n=2}^{+\infty} \ln\Big(1 + \frac{(-1)^{n}}{n}\Big) = 0$

    **(c)** $\displaystyle\sum_{n=2}^{+\infty} \ln\Big(\frac{n^{2} + 3n + 2}{n^{2} + 3n}\Big) = \ln 2$

    **(d)** $\displaystyle\sum_{k=0}^{+\infty} \big(3 + (-1)^{k}\big)^{-k} = \frac{26}{15}$
  corrige: |
    Dans les trois premières séries, le logarithme d'un quotient se décompose en une somme de différences : la somme partielle est le logarithme d'un produit télescopique, que l'on calcule exactement. La convergence et la valeur de la somme s'obtiennent alors en une seule fois, par passage à la limite.

    **(a)** Pour $n \geqslant 2$, on a $1 - \frac{1}{n^{2}} = \frac{(n - 1)(n + 1)}{n^{2}} > 0$, et, pour $N \geqslant 2$, les facteurs se simplifient en cascade : 
    $$\sum_{n=2}^{N} \ln\Big(1 - \frac{1}{n^{2}}\Big) = \ln\Big(\prod_{n=2}^{N} \frac{n - 1}{n} \cdot \prod_{n=2}^{N} \frac{n + 1}{n}\Big) = \ln\Big(\frac{1}{N} \cdot \frac{N + 1}{2}\Big) = \ln\frac{N + 1}{2N}.$$
     Comme $\frac{N + 1}{2N}$ tend vers $\frac{1}{2}$ et que $\ln$ est continue en $\frac{1}{2}$, la suite des sommes partielles converge. 
    $$\boxed{\sum_{n=2}^{+\infty} \ln\Big(1 - \frac{1}{n^{2}}\Big) = \ln\frac{1}{2} = -\ln 2}$$
     On pouvait aussi établir la convergence a priori : le terme général est négatif et équivalent à $-\frac{1}{n^{2}}$, et le théorème 4, appliqué à son opposé, la ramène à celle de la série de Riemann $\sum \frac{1}{n^{2}}$. Mais cela ne donne pas la somme.

    **(b)** Le terme général vaut $\ln\frac{2j + 1}{2j}$ pour $n = 2j$ pair, et $\ln\frac{2j}{2j + 1}$ pour $n = 2j + 1$ impair : deux termes consécutifs de ce type sont opposés. Pour $k \geqslant 1$, en groupant les termes d'indices $2j$ et $2j + 1$, 
    $$S_{2k + 1} = \sum_{n=2}^{2k + 1} \ln\Big(1 + \frac{(-1)^{n}}{n}\Big) = \sum_{j=1}^{k} \Big(\ln\frac{2j + 1}{2j} + \ln\frac{2j}{2j + 1}\Big) = 0,$$

    $$S_{2k} = S_{2k + 1} - \ln\frac{2k}{2k + 1} = \ln\Big(1 + \frac{1}{2k}\Big).$$
     Les deux suites extraites $(S_{2k})$ et $(S_{2k + 1})$ tendent vers $0$, donc $(S_{n})$ aussi (chapitre 7, proposition 11 (ii)). 
    $$\boxed{\sum_{n=2}^{+\infty} \ln\Big(1 + \frac{(-1)^{n}}{n}\Big) = 0}$$
     *Piège.* L'erreur la plus répandue est de conclure par équivalents : $\ln\big(1 + \frac{(-1)^{n}}{n}\big) \sim \frac{(-1)^{n}}{n}$, mais ce terme change de signe à chaque rang, et le théorème 4 ne s'applique pas. Le regroupement par deux, que l'exercice 6 justifiera en général, fait ici apparaître des sommes exactement nulles.

    **(c)** On factorise numérateur et dénominateur : $n^{2} + 3n + 2 = (n + 1)(n + 2)$ et $n^{2} + 3n = n(n + 3)$. Pour $N \geqslant 2$, 
    $$\sum_{n=2}^{N} \ln\frac{(n + 1)(n + 2)}{n(n + 3)} = \ln\Big(\prod_{n=2}^{N} \frac{n + 1}{n} \cdot \prod_{n=2}^{N} \frac{n + 2}{n + 3}\Big) = \ln\Big(\frac{N + 1}{2} \cdot \frac{4}{N + 3}\Big) = \ln\frac{2(N + 1)}{N + 3},$$
     qui tend vers $\ln 2$ quand $N$ tend vers $+\infty$. 
    $$\boxed{\sum_{n=2}^{+\infty} \ln\Big(\frac{n^{2} + 3n + 2}{n^{2} + 3n}\Big) = \ln 2}$$
     Pour $N = 2$, la formule donne $\ln\frac{6}{5}$, qui est bien le premier terme $\ln\frac{12}{10}$ ✓.

    **(d)** Le terme général vaut $4^{-k}$ pour $k$ pair et $2^{-k}$ pour $k$ impair : il est positif et majoré par $\big(\frac{1}{2}\big)^{k}$, terme d'une série géométrique convergente (théorème 1). La série converge par le théorème 3, et sa somme est la limite de la suite extraite $(S_{2m + 1})$ (chapitre 7, proposition 11 (i)). Or, en séparant les indices pairs $k = 2j$ et impairs $k = 2j + 1$, 
    $$S_{2m + 1} = \sum_{j=0}^{m} \frac{1}{16^{j}} + \sum_{j=0}^{m} \frac{1}{2^{2j + 1}} \xrightarrow[m \to +\infty]{} \frac{1}{1 - \frac{1}{16}} + \frac{1}{2} \cdot \frac{1}{1 - \frac{1}{4}} = \frac{16}{15} + \frac{2}{3}.$$

    $$\boxed{\sum_{k=0}^{+\infty} \big(3 + (-1)^{k}\big)^{-k} = \frac{16}{15} + \frac{10}{15} = \frac{26}{15}}$$
     Séparer les termes pairs et impairs n'est légitime qu'après avoir établi la convergence de la série : c'est elle qui permet de calculer la somme sur une suite extraite des sommes partielles. Pour une série à termes positifs, la section 20.6 du cours rendra ce découpage automatique.
- id: "ma-20-02"
  feuille: "f-ma-20"
  numero: 2
  partie: "Séries numériques : généralités"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Justifier la convergence des séries suivantes et calculer leur somme. Dans la dernière, $p$ désigne un entier naturel non nul. 
    $$\sum_{k=2}^{+\infty} \frac{1}{k^{2} - 1}, \qquad \sum_{k=1}^{+\infty} \frac{1}{k(k + 1)(k + 2)}, \qquad \sum_{k=1}^{+\infty} \frac{1}{k(k + 1)\cdots(k + p)}.$$
     Pour la dernière, on pourra écrire le terme général comme la différence de deux termes consécutifs d'une même suite.
  corrige: |
    Dans les trois cas, le terme général est positif et équivalent à $\frac{1}{k^{2}}$, $\frac{1}{k^{3}}$ et $\frac{1}{k^{p + 1}}$ : les trois séries convergent par le théorème 4 et les séries de Riemann (théorème 5), puisque $p + 1 \geqslant 2 > 1$. Pour la somme, on fait apparaître un télescopage (proposition 4).

    *Première série.* La décomposition en éléments simples (chapitre 13) donne, pour $k \geqslant 2$, 
    $$\frac{1}{k^{2} - 1} = \frac{1}{2}\Big(\frac{1}{k - 1} - \frac{1}{k + 1}\Big), \qquad \sum_{k=2}^{N} \frac{1}{k^{2} - 1} = \frac{1}{2}\Big(1 + \frac{1}{2} - \frac{1}{N} - \frac{1}{N + 1}\Big),$$
     puisque les termes $\frac{1}{3}$, …, $\frac{1}{N - 1}$ apparaissent une fois avec chaque signe. 
    $$\boxed{\sum_{k=2}^{+\infty} \frac{1}{k^{2} - 1} = \frac{3}{4}}$$

    *Deuxième série.* On écrit le terme comme une différence de deux termes consécutifs de la suite $\big(\frac{1}{k(k + 1)}\big)$ : 
    $$\frac{1}{k(k + 1)} - \frac{1}{(k + 1)(k + 2)} = \frac{(k + 2) - k}{k(k + 1)(k + 2)} = \frac{2}{k(k + 1)(k + 2)},$$
     d'où, par télescopage, 
    $$\sum_{k=1}^{N} \frac{1}{k(k + 1)(k + 2)} = \frac{1}{2}\Big(\frac{1}{2} - \frac{1}{(N + 1)(N + 2)}\Big).$$

    $$\boxed{\sum_{k=1}^{+\infty} \frac{1}{k(k + 1)(k + 2)} = \frac{1}{4}}$$

    *Troisième série.* Le même calcul se fait avec $p$ facteurs. Posons $a_{k} = \frac{1}{k(k + 1)\cdots(k + p - 1)}$ pour $k \geqslant 1$. Les deux produits $k(k + 1)\cdots(k + p - 1)$ et $(k + 1)\cdots(k + p)$ ont pour multiple commun $k(k + 1)\cdots(k + p)$, d'où 
    $$a_{k} - a_{k + 1} = \frac{(k + p) - k}{k(k + 1)\cdots(k + p)} = \frac{p}{k(k + 1)\cdots(k + p)}.$$
     Par la proposition 4, comme $a_{k}$ tend vers $0$ et que $a_{1} = \frac{1}{p!}$, 
    $$\sum_{k=1}^{N} \frac{1}{k(k + 1)\cdots(k + p)} = \frac{1}{p}\big(a_{1} - a_{N + 1}\big) \xrightarrow[N \to +\infty]{} \frac{a_{1}}{p}, \qquad \boxed{\sum_{k=1}^{+\infty} \frac{1}{k(k + 1)\cdots(k + p)} = \frac{1}{p \cdot p!}}$$
     Pour $p = 1$, on retrouve $\sum_{k=1}^{+\infty} \frac{1}{k(k + 1)} = 1$, exemple qui suit la proposition 4, et pour $p = 2$ la deuxième série ✓. Pour $p = 3$, la somme vaut $\frac{1}{18}$.

    *À retenir.* Le télescopage est la seule méthode de ce chapitre qui donne une somme exacte sans autre outil ; il repose toujours sur une écriture $u_{k} = a_{k} - a_{k + 1}$, qu'on lit ici sur des produits de facteurs consécutifs. L'erreur la plus répandue est de décomposer complètement en éléments simples, ce qui fait apparaître $p + 1$ fractions dont le télescopage, bien réel, est beaucoup plus pénible à organiser.
- id: "ma-20-03"
  feuille: "f-ma-20"
  numero: 3
  partie: "Séries numériques : généralités"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [séries numériques, série exponentielle]
  noeuds: [as-series, ex-serie]
  notions: []
  page_enonce: 1
  page_corrige: 3
  enonce: |
    **1.** Pour tout $k \in \mathbb{N}$, montrer que la série $\displaystyle\sum_{n \geqslant 0} \frac{n(n - 1)\cdots(n - k + 1)}{n!}$ converge et calculer sa somme ; pour $k = 0$, le produit vide vaut $1$.

    **2.** En déduire les sommes $\displaystyle\sum_{n=0}^{+\infty} \frac{n^{2} + 2n + 3}{n!}$ et $\displaystyle\sum_{n=0}^{+\infty} \frac{n^{4}}{n!}$. On cherchera à écrire $n^{4}$ comme combinaison linéaire des polynômes $X(X - 1)\cdots(X - k + 1)$, pour $0 \leqslant k \leqslant 4$.
  corrige: |
    **1.** Soit $k \in \mathbb{N}$. Pour $n < k$, le produit $n(n - 1)\cdots(n - k + 1)$ contient le facteur $n - n = 0$ : le terme est nul. Pour $n \geqslant k$, il vaut $\frac{n!}{(n - k)!}$, et le terme général vaut $\frac{1}{(n - k)!}$. Pour $N \geqslant k$, en posant $m = n - k$, 
    $$\sum_{n=0}^{N} \frac{n(n - 1)\cdots(n - k + 1)}{n!} = \sum_{n=k}^{N} \frac{1}{(n - k)!} = \sum_{m=0}^{N - k} \frac{1}{m!},$$
     qui tend vers $\mathrm{e}$ par le théorème 2 appliqué en $z = 1$. 
    $$\boxed{\text{Pour tout } k \in \mathbb{N}, \quad \sum_{n=0}^{+\infty} \frac{n(n - 1)\cdots(n - k + 1)}{n!} = \mathrm{e}}$$

    **2.** On décompose $n^{2} + 2n + 3$ sur les polynômes $1$, $X$, $X(X - 1)$ : comme $n^{2} = n(n - 1) + n$, on a $n^{2} + 2n + 3 = n(n - 1) + 3n + 3$. Par linéarité (proposition 1 (i)) et la question 1, pour $k = 2$, $1$ et $0$ : 
    $$\boxed{\sum_{n=0}^{+\infty} \frac{n^{2} + 2n + 3}{n!} = \mathrm{e} + 3\mathrm{e} + 3\mathrm{e} = 7\mathrm{e}}$$
     Pour $n^{4}$, on cherche des réels $c_{0}$, …, $c_{4}$ tels que 
    $$X^{4} = c_{4}X(X - 1)(X - 2)(X - 3) + c_{3}X(X - 1)(X - 2) + c_{2}X(X - 1) + c_{1}X + c_{0}.$$
     Ces cinq polynômes sont de degrés échelonnés $4$, $3$, $2$, $1$, $0$ : ils forment une base de $\mathbb{R}_{4}[X]$ (chapitre 14, proposition 10), et la décomposition existe et est unique. Le coefficient dominant donne $c_{4} = 1$. On évalue ensuite en $0$, $1$, $2$, $3$, où les premiers polynômes s'annulent : 
    $$0 = c_{0}, \qquad 1 = c_{1}, \qquad 16 = 2c_{2} + 2c_{1}, \qquad 81 = 6c_{3} + 6c_{2} + 3c_{1},$$
     d'où $c_{2} = 7$ et $c_{3} = \frac{81 - 42 - 3}{6} = 6$. Ainsi $n^{4} = n(n - 1)(n - 2)(n - 3) + 6n(n - 1)(n - 2) + 7n(n - 1) + n$, et 
    $$\boxed{\sum_{n=0}^{+\infty} \frac{n^{4}}{n!} = (1 + 6 + 7 + 1)\,\mathrm{e} = 15\mathrm{e}}$$
     On contrôle l'identité en $n = 4$ : $24 + 6 \times 24 + 7 \times 12 + 4 = 256 = 4^{4}$ ✓.

    *À retenir.* Les polynômes $X(X - 1)\cdots(X - k + 1)$ jouent pour les séries $\sum \frac{P(n)}{n!}$ le rôle des monômes : le décalage d'indice les transforme tous en la série de $\mathrm{e}$. Le coefficient de $\mathrm{e}$ obtenu pour $\sum \frac{n^{k}}{n!}$, qui vaut $1$, $1$, $2$, $5$, $15$ pour $k = 0$, …, $4$, est le nombre de façons de partager un ensemble à $k$ éléments en parties non vides ; nous ne le démontrerons pas.
- id: "ma-20-04"
  feuille: "f-ma-20"
  numero: 4
  partie: "Séries numériques : généralités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  page_enonce: 1
  page_corrige: 4
  enonce: |
    **1.** Déterminer les réels $a$ et $b$ pour lesquels la série $\sum_{n \geqslant 1} \big(\ln n + a\ln(n + 1) + b\ln(n + 2)\big)$ converge, et calculer alors sa somme.

    **2.** Même question pour la série $\sum_{n \geqslant 1} \big(\sqrt{n} + a\sqrt{n + 1} + b\sqrt{n + 2}\big)$.
  corrige: |
    **1.** On note $u_{n}$ le terme général et l'on met $\ln n$ en facteur dans chaque logarithme. Par le développement $\ln(1 + x) = x + O(x^{2})$ (chapitre 10, théorème 5), 
    $$u_{n} = (1 + a + b)\ln n + a\ln\Big(1 + \frac{1}{n}\Big) + b\ln\Big(1 + \frac{2}{n}\Big) = (1 + a + b)\ln n + \frac{a + 2b}{n} + O\Big(\frac{1}{n^{2}}\Big).$$
     On discute selon les coefficients.

    • Si $1 + a + b \neq 0$, alors $|u_{n}|$ tend vers $+\infty$ : la série diverge grossièrement (proposition 2).

    • Si $1 + a + b = 0$ et $a + 2b \neq 0$, alors $u_{n} \sim \frac{a + 2b}{n}$, de signe constant : par le théorème 4, appliqué à $u_{n}$ ou à $-u_{n}$, la série diverge comme la série harmonique.

    • Si $1 + a + b = 0$ et $a + 2b = 0$, c'est-à-dire $a = -2$ et $b = 1$, alors $u_{n} = O\big(\frac{1}{n^{2}}\big)$, et la série converge (proposition 9, avec le théorème 5).

    $$\boxed{\sum \big(\ln n + a\ln(n + 1) + b\ln(n + 2)\big) \text{ converge} \iff a = -2 \text{ et } b = 1}$$
     Dans ce cas, on pose $d_{n} = \ln(n + 1) - \ln n = \ln\big(1 + \frac{1}{n}\big)$, qui tend vers $0$. Le terme général s'écrit $u_{n} = \big(\ln(n + 2) - \ln(n + 1)\big) - \big(\ln(n + 1) - \ln n\big) = d_{n + 1} - d_{n}$, et la proposition 4 donne 
    $$\boxed{\sum_{n=1}^{+\infty} \big(\ln n - 2\ln(n + 1) + \ln(n + 2)\big) = \lim_{n \to +\infty} d_{n} - d_{1} = -\ln 2}$$

    **2.** On met cette fois $\sqrt{n}$ en facteur, et l'on utilise $\sqrt{1 + x} = 1 + \frac{x}{2} - \frac{x^{2}}{8} + O(x^{3})$ : 
    $$v_{n} = \sqrt{n} + a\sqrt{n + 1} + b\sqrt{n + 2} = \sqrt{n}\,\Big((1 + a + b) + \frac{a + 2b}{2n} - \frac{a + 4b}{8n^{2}} + O\Big(\frac{1}{n^{3}}\Big)\Big).$$
     Si $1 + a + b \neq 0$, alors $|v_{n}| \sim |1 + a + b|\sqrt{n}$ tend vers $+\infty$ : divergence grossière. Si $1 + a + b = 0$ et $a + 2b \neq 0$, alors $v_{n} \sim \frac{a + 2b}{2\sqrt{n}}$, de signe constant, et la série diverge par comparaison avec la série de Riemann d'exposant $\frac{1}{2}$. Si $a = -2$ et $b = 1$, alors $v_{n} \sim -\frac{1}{4n^{3/2}}$, de signe constant, et la série converge, puisque $\frac{3}{2} > 1$. 
    $$\boxed{\sum \big(\sqrt{n} + a\sqrt{n + 1} + b\sqrt{n + 2}\big) \text{ converge} \iff a = -2 \text{ et } b = 1}$$
     Le même télescopage, avec $\delta_{n} = \sqrt{n + 1} - \sqrt{n} = \frac{1}{\sqrt{n + 1} + \sqrt{n}}$, qui tend vers $0$, donne $v_{n} = \delta_{n + 1} - \delta_{n}$, et 
    $$\boxed{\sum_{n=1}^{+\infty} \big(\sqrt{n} - 2\sqrt{n + 1} + \sqrt{n + 2}\big) = -\delta_{1} = 1 - \sqrt{2} \approx -0{,}4142}$$
     *À retenir.* La condition $1 + a + b = 0$ rend le terme général borné, la condition $a + 2b = 0$ le rend sommable : chaque condition tue un terme du développement asymptotique. Une fois la convergence acquise, la somme se calcule en reconnaissant une différence seconde $d_{n + 1} - d_{n}$, que la proposition 4 télescope. Les conditions trouvées sont les mêmes dans les deux questions, parce que les coefficients $(1, -2, 1)$ annulent toute fonction affine de $n$.
- id: "ma-20-05"
  feuille: "f-ma-20"
  numero: 5
  partie: "Séries numériques : généralités"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Déterminer la nature de la série 
    $$\sum_{n \geqslant 2} \ln\Big(\frac{\big(\ln(n + 1)\big)^{2}}{\ln n\,\ln(n + 2)}\Big),$$
     puis calculer sa somme lorsqu'elle existe. On pourra poser $a_{n} = \ln(\ln n)$ pour $n \geqslant 2$.
  corrige: |
    On pose, comme le suggère l'énoncé, $a_{n} = \ln(\ln n)$ pour $n \geqslant 2$. Le terme général s'écrit 
    $$u_{n} = 2\ln\ln(n + 1) - \ln\ln n - \ln\ln(n + 2) = (a_{n + 1} - a_{n}) - (a_{n + 2} - a_{n + 1}) = d_{n} - d_{n + 1},$$
     avec $d_{n} = a_{n + 1} - a_{n} = \ln\frac{\ln(n + 1)}{\ln n}$. Or 
    $$\frac{\ln(n + 1)}{\ln n} = \frac{\ln n + \ln\big(1 + \frac{1}{n}\big)}{\ln n} = 1 + \frac{\ln\big(1 + \frac{1}{n}\big)}{\ln n} \xrightarrow[n \to +\infty]{} 1,$$
     donc $d_{n}$ tend vers $\ln 1 = 0$ par continuité du logarithme. La proposition 4, appliquée à la suite $(-d_{n})$, montre que la série converge, et, en sommant de $2$ à $N$, 
    $$\sum_{n=2}^{N} u_{n} = d_{2} - d_{N + 1} \xrightarrow[N \to +\infty]{} d_{2} = \ln\frac{\ln 3}{\ln 2}.$$

    $$\boxed{\text{La série converge, et } \sum_{n=2}^{+\infty} \ln\Big(\frac{\big(\ln(n + 1)\big)^{2}}{\ln n\,\ln(n + 2)}\Big) = \ln\Big(\frac{\ln 3}{\ln 2}\Big) \approx 0{,}4606}$$
     La somme partielle jusqu'à $n = 10^{5}$ vaut $0{,}460560$, en accord avec cette valeur ✓. On aurait pu montrer la convergence par un développement asymptotique, mais il est laborieux ($u_{n}$ est de l'ordre de $\frac{1}{n^{2}\ln n}$) ; le télescopage donne la nature et la somme d'un coup.

    *Piège.* L'erreur la plus répandue est de télescoper en une seule étape, en écrivant $u_{n} = a_{n + 1} - a_{n}$ : c'est une différence *seconde*, comme à l'exercice 4, et c'est la convergence de $d_{n}$ vers $0$, et non celle de $a_{n}$ (qui tend vers $+\infty$), qui assure la convergence.
- id: "ma-20-06"
  feuille: "f-ma-20"
  numero: 6
  partie: "Séries numériques : généralités"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries numériques]
  noeuds: [as-series]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *Regrouper les termes d'une série.* Soit $\sum a_{n}$ une série d'éléments de $\mathbb{K}$ et $\varphi : \mathbb{N} \to \mathbb{N}$ une application strictement croissante telle que $\varphi(0) = 0$. On pose, pour tout $p \in \mathbb{N}$, 
    $$S_{p} = \sum_{k=\varphi(p)}^{\varphi(p+1) - 1} a_{k}.$$

    **1.** Montrer que si $\sum a_{n}$ converge, alors $\sum S_{p}$ converge et $\sum_{p=0}^{+\infty} S_{p} = \sum_{n=0}^{+\infty} a_{n}$.

    **2.** Montrer par un exemple que la réciproque est fausse.

    **3.** On suppose que $\sum S_{p}$ converge et que $\displaystyle\sum_{k=\varphi(p)}^{\varphi(p+1) - 1} |a_{k}|$ tend vers $0$ quand $p$ tend vers $+\infty$. Montrer que $\sum a_{n}$ converge.

    **4.** En déduire la nature de la série $\displaystyle\frac{a}{\sqrt{1}} + \frac{b}{\sqrt{2}} + \frac{c}{\sqrt{3}} + \frac{a}{\sqrt{4}} + \frac{b}{\sqrt{5}} + \frac{c}{\sqrt{6}} + \frac{a}{\sqrt{7}} + \cdots$ selon les réels $a$, $b$ et $c$.
  corrige: |
    On note $A_{n} = \sum_{k=0}^{n} a_{k}$ les sommes partielles de $\sum a_{n}$. Comme $\varphi$ est strictement croissante de $\mathbb{N}$ dans $\mathbb{N}$, on a $\varphi(p) \geqslant p$ pour tout $p$ (récurrence immédiate) ; en particulier $\varphi(p)$ tend vers $+\infty$. Avec $\varphi(0) = 0$, la relation de Chasles donne, pour $P \in \mathbb{N}$, 
    $$\sum_{p=0}^{P} S_{p} = \sum_{p=0}^{P}\ \sum_{k=\varphi(p)}^{\varphi(p+1) - 1} a_{k} = \sum_{k=0}^{\varphi(P + 1) - 1} a_{k} = A_{\varphi(P + 1) - 1}.$$
     Les paquets $[\![\varphi(p)\,;\varphi(p + 1) - 1]\!]$ sont non vides et recouvrent $\mathbb{N}$ sans chevauchement : c'est là que servent les deux hypothèses sur $\varphi$.

    **1.** La suite $\big(\varphi(P + 1) - 1\big)_{P \in \mathbb{N}}$ est strictement croissante, à valeurs dans $\mathbb{N}$ : la suite $(A_{\varphi(P + 1) - 1})_{P}$ est extraite de $(A_{n})$. Si $(A_{n})$ converge vers $A$, elle converge aussi vers $A$ (chapitre 7, proposition 11 (i)). 
    $$\boxed{\sum a_{n} \text{ converge} \implies \sum S_{p} \text{ converge, et } \sum_{p=0}^{+\infty} S_{p} = \sum_{n=0}^{+\infty} a_{n}}$$

    **2.** On prend $a_{n} = (-1)^{n}$ et $\varphi(p) = 2p$. Alors $S_{p} = a_{2p} + a_{2p + 1} = 1 - 1 = 0$ pour tout $p$ : la série $\sum S_{p}$ converge, de somme nulle, alors que $\sum (-1)^{n}$ diverge grossièrement. 
    $$\boxed{\text{La réciproque est fausse : } \sum S_{p} \text{ peut converger sans que } \sum a_{n} \text{ converge}}$$
     C'est le calcul fautif « $(1 - 1) + (1 - 1) + \cdots = 0$ » : regrouper les termes d'une série divergente peut produire une série convergente, et l'on ne peut pas « dégrouper ».

    **3.** Notons $L = \sum_{p=0}^{+\infty} S_{p}$, $T_{p} = \sum_{q=0}^{p-1} S_{q} = A_{\varphi(p) - 1}$ pour $p \geqslant 1$, $T_{0} = 0$, et $\varepsilon_{p} = \sum_{k=\varphi(p)}^{\varphi(p+1) - 1} |a_{k}|$. Soit $n \in \mathbb{N}$. Comme $\varphi(0) = 0$ et que $\varphi(p)$ tend vers $+\infty$ en croissant, il existe un unique $p$, que l'on note $p(n)$, tel que $\varphi(p) \leqslant n < \varphi(p + 1)$. Alors 
    $$A_{n} = T_{p} + \sum_{k=\varphi(p)}^{n} a_{k}, \qquad\text{donc}\qquad |A_{n} - L| \leqslant |T_{p} - L| + \sum_{k=\varphi(p)}^{n} |a_{k}| \leqslant |T_{p} - L| + \varepsilon_{p}.$$
     Soit $\varepsilon > 0$. Comme $T_{p}$ tend vers $L$ et $\varepsilon_{p}$ vers $0$, il existe $P$ tel que $|T_{p} - L| \leqslant \varepsilon$ et $\varepsilon_{p} \leqslant \varepsilon$ pour tout $p \geqslant P$. Pour $n \geqslant \varphi(P)$, on a $p(n) \geqslant P$, puisque $n < \varphi(p(n) + 1)$ et que $\varphi$ est croissante ; donc $|A_{n} - L| \leqslant 2\varepsilon$. 
    $$\boxed{\sum S_{p} \text{ converge et } \varepsilon_{p} \to 0 \implies \sum a_{n} \text{ converge, de même somme}}$$
     L'hypothèse $\varepsilon_{p} \to 0$ contrôle ce qui se passe *à l'intérieur* d'un paquet, c'est-à-dire l'écart entre une somme partielle quelconque et la plus proche somme partielle « de fin de paquet ». Dans l'exemple de la question 2, $\varepsilon_{p} = 2$ pour tout $p$.

    **4.** On note $x_{n}$, pour $n \geqslant 0$, le terme d'indice $n$ : $x_{n} = \frac{c_{n}}{\sqrt{n + 1}}$, où $c_{n}$ vaut $a$, $b$ ou $c$ selon que le reste de $n$ modulo $3$ vaut $0$, $1$ ou $2$. On regroupe par paquets de trois, avec $\varphi(p) = 3p$ : 
    $$S_{p} = \frac{a}{\sqrt{3p + 1}} + \frac{b}{\sqrt{3p + 2}} + \frac{c}{\sqrt{3p + 3}}, \qquad \varepsilon_{p} \leqslant \frac{|a| + |b| + |c|}{\sqrt{3p + 1}} \xrightarrow[p \to +\infty]{} 0.$$
     Par les questions 1 et 3, la série $\sum x_{n}$ converge si et seulement si $\sum S_{p}$ converge. Pour $j \in \{1, 2, 3\}$, le développement $(1 + x)^{-1/2} = 1 - \frac{x}{2} + O(x^{2})$ donne 
    $$\frac{1}{\sqrt{3p + j}} = \frac{1}{\sqrt{3p}}\Big(1 + \frac{j}{3p}\Big)^{-1/2} = \frac{1}{\sqrt{3p}} - \frac{j}{2(3p)^{3/2}} + O\Big(\frac{1}{p^{5/2}}\Big),$$

    $$S_{p} = \frac{a + b + c}{\sqrt{3p}} - \frac{a + 2b + 3c}{2(3p)^{3/2}} + O\Big(\frac{1}{p^{5/2}}\Big).$$
     Si $a + b + c \neq 0$, alors $S_{p} \sim \frac{a + b + c}{\sqrt{3p}}$, de signe constant, et $\sum S_{p}$ diverge (théorèmes 4 et 5). Si $a + b + c = 0$, alors $S_{p} = O\big(\frac{1}{p^{3/2}}\big)$, et $\sum S_{p}$ converge par la proposition 9, puisque $\frac{3}{2} > 1$. 
    $$\boxed{\frac{a}{\sqrt{1}} + \frac{b}{\sqrt{2}} + \frac{c}{\sqrt{3}} + \frac{a}{\sqrt{4}} + \cdots \text{ converge} \iff a + b + c = 0}$$
     Par exemple, avec $a = b = 1$ et $c = -2$, la série $\frac{1}{\sqrt{1}} + \frac{1}{\sqrt{2}} - \frac{2}{\sqrt{3}} + \frac{1}{\sqrt{4}} + \cdots$ converge, alors que ses termes positifs, pris seuls, forment une série divergente : la compensation se fait à l'intérieur de chaque paquet.

    *Piège.* La question 3 est indispensable : la question 1 ne dit rien dans le sens « $\sum S_{p}$ converge $\Rightarrow$ $\sum x_{n}$ converge ». L'erreur la plus répandue est de regrouper les termes sans vérifier que les paquets ont une taille bornée et des termes qui tendent vers $0$ ; ici, chaque paquet compte trois termes, et c'est ce qui donne $\varepsilon_{p} \to 0$.
- id: "ma-20-07"
  feuille: "f-ma-20"
  numero: 7
  partie: "Séries à termes positifs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 2
  page_corrige: 7
  enonce: |
    Déterminer, en fonction des paramètres $a$, $b \in \mathbb{R}$ et $\alpha \in \mathbb{R}_{+}$, la nature des séries de termes généraux suivants.

    **(a)** $\Big(\dfrac{1}{2}\Big)^{\sqrt{n}}$

    **(b)** $\dfrac{1}{\sqrt{n}}\ln\Big(1 + \dfrac{1}{\sqrt{n}}\Big)$

    **(c)** $1 - \cos\dfrac{\pi}{n}$

    **(d)** $a^{n}\,n!$

    **(e)** $\ln\Big(\dfrac{n^{2} + n + 1}{n^{2} + n - 1}\Big)$

    **(f)** $\dfrac{\ln n}{\ln(\mathrm{e}^{n} - 1)}$

    **(g)** $\sqrt{\operatorname{ch}\dfrac{1}{n} - 1}$

    **(h)** $\Big(\dfrac{n}{n + 1}\Big)^{n^{2}}$

    **(i)** $\Big(n\sin\dfrac{1}{n}\Big)^{n^{\alpha}}$

    **(j)** $\sqrt[3]{n^{3} + an} - \sqrt{n^{2} + 3}$

    **(k)** $\mathrm{e}^{1/n} - a - \dfrac{b}{n}$

    **(l)** $\dfrac{(n + 1)^{1 + 1/n} - (n - 1)^{1 - 1/n}}{n^{a}}$ ($n \geqslant 2$)
  corrige: |
    On note $u_{n}$ le terme général. Sauf mention contraire, il est positif, et l'on applique la méthode du cours : limite du terme général, puis équivalent ou comparaison avec une série de Riemann ou géométrique (théorèmes 3, 4, 5 et 1).

    **(a)** On a $u_{n} = \mathrm{e}^{-\sqrt{n}\ln 2}$, et $n^{2}u_{n} = (\sqrt{n})^{4}\mathrm{e}^{-(\ln 2)\sqrt{n}}$ tend vers $0$ par croissances comparées (chapitre 10, proposition 2), puisque $\sqrt{n}$ tend vers $+\infty$. Donc $u_{n} = o\big(\frac{1}{n^{2}}\big)$. 
    $$\boxed{\sum \Big(\frac{1}{2}\Big)^{\sqrt{n}} \text{ converge}}$$

    **(b)** Comme $\frac{1}{\sqrt{n}}$ tend vers $0$ et que $\ln(1 + x) \sim x$ en $0$, on a $u_{n} \sim \frac{1}{\sqrt{n}} \cdot \frac{1}{\sqrt{n}} = \frac{1}{n}$. 
    $$\boxed{\sum \frac{1}{\sqrt{n}}\ln\Big(1 + \frac{1}{\sqrt{n}}\Big) \text{ diverge}}$$

    **(c)** Comme $1 - \cos x \sim \frac{x^{2}}{2}$ en $0$, on a $u_{n} \sim \frac{\pi^{2}}{2n^{2}}$. 
    $$\boxed{\sum \Big(1 - \cos\frac{\pi}{n}\Big) \text{ converge}}$$

    **(d)** Si $a = 0$, le terme général est nul pour $n \geqslant 1$ et la série converge. Si $a \neq 0$, les croissances comparées (chapitre 7, théorème 7), avec $q = \frac{1}{|a|}$, donnent $\frac{q^{n}}{n!} \to 0$, donc $|u_{n}| = \frac{n!}{q^{n}} \to +\infty$ : divergence grossière, quel que soit le signe de $a$. 
    $$\boxed{\sum a^{n}\,n! \text{ converge} \iff a = 0}$$

    **(e)** Pour $n \geqslant 1$, $u_{n} = \ln\Big(1 + \frac{2}{n^{2} + n - 1}\Big) \sim \frac{2}{n^{2} + n - 1} \sim \frac{2}{n^{2}}$, puisque $\frac{2}{n^{2} + n - 1}$ tend vers $0$. 
    $$\boxed{\sum \ln\Big(\frac{n^{2} + n + 1}{n^{2} + n - 1}\Big) \text{ converge}}$$

    **(f)** On a $\ln(\mathrm{e}^{n} - 1) = n + \ln(1 - \mathrm{e}^{-n}) \sim n$, donc $u_{n} \sim \frac{\ln n}{n}$, et $\frac{\ln n}{n} \geqslant \frac{1}{n}$ pour $n \geqslant 3$. 
    $$\boxed{\sum \frac{\ln n}{\ln(\mathrm{e}^{n} - 1)} \text{ diverge}}$$

    **(g)** Comme $\operatorname{ch} x - 1 \sim \frac{x^{2}}{2}$ en $0$, on a $\operatorname{ch}\frac{1}{n} - 1 \sim \frac{1}{2n^{2}}$, et, par passage à la puissance $\frac{1}{2}$ (chapitre 10, théorème 1), $u_{n} \sim \frac{1}{\sqrt{2}\,n}$. 
    $$\boxed{\sum \sqrt{\operatorname{ch}\frac{1}{n} - 1} \text{ diverge}}$$

    **(h)** On passe à la forme exponentielle, et l'on développe $\ln\big(1 + \frac{1}{n}\big)$ à l'ordre $3$ : 
    $$\ln u_{n} = -n^{2}\ln\Big(1 + \frac{1}{n}\Big) = -n^{2}\Big(\frac{1}{n} - \frac{1}{2n^{2}} + O\Big(\frac{1}{n^{3}}\Big)\Big) = -n + \frac{1}{2} + O\Big(\frac{1}{n}\Big).$$
     Par continuité de l'exponentielle, $u_{n}\mathrm{e}^{n} = \mathrm{e}^{1/2 + O(1/n)}$ tend vers $\sqrt{\mathrm{e}}$, donc $u_{n} \sim \sqrt{\mathrm{e}}\,\mathrm{e}^{-n}$, terme d'une série géométrique de raison $\frac{1}{\mathrm{e}} < 1$. 
    $$\boxed{\sum \Big(\frac{n}{n + 1}\Big)^{n^{2}} \text{ converge}}$$
     *Piège.* L'erreur la plus répandue est de dire que $\frac{n}{n + 1}$ tend vers $1$, donc que $u_{n}$ tend vers $1$ : c'est une forme indéterminée $1^{\infty}$, et l'ordre $2$ du développement est nécessaire. L'ordre $1$ donnerait seulement $\ln u_{n} = -n + O(1)$, ce qui suffit d'ailleurs pour la nature, mais pas pour l'équivalent.

    **(i)** Pour $n \geqslant 1$, on a $0 < n\sin\frac{1}{n} < 1$, et le développement $\sin x = x - \frac{x^{3}}{6} + O(x^{5})$ donne 
    $$n\sin\frac{1}{n} = 1 - \frac{1}{6n^{2}} + O\Big(\frac{1}{n^{4}}\Big), \qquad\text{d'où}$$

    $$\ln u_{n} = n^{\alpha}\ln\Big(n\sin\frac{1}{n}\Big) = -\frac{n^{\alpha - 2}}{6} + O\big(n^{\alpha - 4}\big) = -\frac{n^{\alpha - 2}}{6}\big(1 + o(1)\big).$$
     Si $\alpha < 2$, $\ln u_{n}$ tend vers $0$ et $u_{n}$ vers $1$ ; si $\alpha = 2$, $u_{n}$ tend vers $\mathrm{e}^{-1/6}$ : dans les deux cas, la série diverge grossièrement. Si $\alpha > 2$, on pose $\beta = \alpha - 2 > 0$ ; à partir d'un certain rang, $\ln u_{n} \leqslant -\frac{n^{\beta}}{12}$, donc 
    $$0 \leqslant n^{2}u_{n} \leqslant n^{2}\mathrm{e}^{-n^{\beta}/12} = \big(n^{\beta}\big)^{2/\beta}\mathrm{e}^{-n^{\beta}/12} \xrightarrow[n \to +\infty]{} 0$$
     par croissances comparées, et $u_{n} = o\big(\frac{1}{n^{2}}\big)$. 
    $$\boxed{\sum \Big(n\sin\frac{1}{n}\Big)^{n^{\alpha}} \text{ converge} \iff \alpha > 2}$$

    **(j)** On met $n$ en facteur dans chaque racine et l'on développe à l'ordre $2$ en $\frac{1}{n^{2}}$ : 
    $$u_{n} = n\Big(1 + \frac{a}{n^{2}}\Big)^{1/3} - n\Big(1 + \frac{3}{n^{2}}\Big)^{1/2} = \Big(\frac{a}{3} - \frac{3}{2}\Big)\frac{1}{n} + \Big(\frac{9}{8} - \frac{a^{2}}{9}\Big)\frac{1}{n^{3}} + O\Big(\frac{1}{n^{5}}\Big).$$
     Si $a \neq \frac{9}{2}$, $u_{n} \sim \big(\frac{a}{3} - \frac{3}{2}\big)\frac{1}{n}$, de signe constant : la série diverge (théorème 4, appliqué à $u_{n}$ ou à $-u_{n}$). Si $a = \frac{9}{2}$, $u_{n} \sim -\frac{9}{8n^{3}}$, de signe constant, et la série converge. 
    $$\boxed{\sum \Big(\sqrt[3]{n^{3} + an} - \sqrt{n^{2} + 3}\Big) \text{ converge} \iff a = \frac{9}{2}}$$
     Le terme général n'est pas positif ici, mais il est de signe constant à partir d'un certain rang, ce qui suffit pour le théorème 4.

    **(k)** Par le développement de l'exponentielle à l'ordre $2$, 
    $$u_{n} = \mathrm{e}^{1/n} - a - \frac{b}{n} = (1 - a) + \frac{1 - b}{n} + \frac{1}{2n^{2}} + O\Big(\frac{1}{n^{3}}\Big).$$
     Si $a \neq 1$, $u_{n}$ tend vers $1 - a \neq 0$ : divergence grossière. Si $a = 1$ et $b \neq 1$, $u_{n} \sim \frac{1 - b}{n}$, de signe constant : divergence. Si $a = b = 1$, $u_{n} \sim \frac{1}{2n^{2}}$ : convergence. 
    $$\boxed{\sum \Big(\mathrm{e}^{1/n} - a - \frac{b}{n}\Big) \text{ converge} \iff a = b = 1}$$

    **(l)** Le terme n'est défini que pour $n \geqslant 2$, puisque $(n - 1)^{1 - 1/n}$ vaudrait $0^{0}$ en $n = 1$ ; on étudie la série à partir de $n = 2$. Comme $\frac{\ln(n \pm 1)}{n}$ tend vers $0$, le développement $\mathrm{e}^{x} = 1 + x + O(x^{2})$ donne 
    $$(n + 1)^{1 + 1/n} = (n + 1)\,\mathrm{e}^{\ln(n + 1)/n} = (n + 1)\Big(1 + \frac{\ln(n + 1)}{n} + O\Big(\frac{\ln^{2} n}{n^{2}}\Big)\Big) = n + 1 + \ln(n + 1) + O\Big(\frac{\ln^{2} n}{n}\Big),$$
     et de même $(n - 1)^{1 - 1/n} = n - 1 - \ln(n - 1) + O\big(\frac{\ln^{2} n}{n}\big)$. Comme $\ln(n \pm 1) = \ln n + o(1)$, le numérateur vaut $2\ln n + 2 + o(1) \sim 2\ln n$, et 
    $$u_{n} \sim \frac{2\ln n}{n^{a}}.$$
     Si $a > 1$, on choisit $\rho = \frac{1 + a}{2} \in \,]1\,,a[$ : $n^{\rho} \cdot \frac{2\ln n}{n^{a}} = \frac{2\ln n}{n^{(a - 1)/2}} \to 0$ par croissances comparées, et la série converge. Si $a \leqslant 1$, $\frac{2\ln n}{n^{a}} \geqslant \frac{1}{n}$ pour $n \geqslant 3$, et la série diverge. 
    $$\boxed{\sum_{n \geqslant 2} \frac{(n + 1)^{1 + 1/n} - (n - 1)^{1 - 1/n}}{n^{a}} \text{ converge} \iff a > 1}$$
     Le contrôle numérique est lent : le numérateur divisé par $2\ln n$ vaut $1{,}14$ pour $n = 10^{3}$ et $1{,}036$ pour $n = 10^{12}$, ce qu'explique la constante $2$ négligée devant $2\ln n$.
- id: "ma-20-08"
  feuille: "f-ma-20"
  numero: 8
  partie: "Séries à termes positifs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 2
  page_corrige: 9
  enonce: |
    On définit la suite $(u_{n})_{n \geqslant 1}$ par $u_{n} = \frac{1}{n}$ si $n$ est le carré d'un entier, et $u_{n} = \frac{1}{n^{2}}$ sinon. Déterminer la nature de la série $\sum_{n \geqslant 1} u_{n}$. La suite $(nu_{n})$ tend-elle vers $0$ ?
  corrige: |
    La série est à termes positifs. Pour $N \geqslant 1$, on sépare dans $S_{N}$ les indices qui sont des carrés, $n = k^{2}$ avec $k \leqslant \sqrt{N}$, des autres : 
    $$S_{N} = \sum_{\substack{k \geqslant 1 \\ k^{2} \leqslant N}} \frac{1}{k^{2}} + \sum_{\substack{n \leqslant N \\ n \text{ non carré}}} \frac{1}{n^{2}} \leqslant \sum_{k=1}^{N} \frac{1}{k^{2}} + \sum_{n=1}^{N} \frac{1}{n^{2}} \leqslant 2 \cdot \frac{\pi^{2}}{6}.$$
     Les sommes partielles sont majorées : la série converge (proposition 5). 
    $$\boxed{\sum_{n \geqslant 1} u_{n} \text{ converge}}$$
     On a $nu_{n} = 1$ lorsque $n$ est un carré, et $nu_{n} = \frac{1}{n}$ sinon. La suite extraite $\big(k^{2}u_{k^{2}}\big)_{k \geqslant 1}$ est constante égale à $1$ : la suite $(nu_{n})$ ne tend pas vers $0$ (chapitre 7, proposition 11 (i)). 
    $$\boxed{(nu_{n}) \text{ ne tend pas vers } 0 : \text{ elle vaut } 1 \text{ aux carrés et } \tfrac{1}{n} \text{ ailleurs}}$$
     On peut même calculer la somme. Les indices non carrés s'obtiennent en retirant les carrés, d'où $S_{N} = \sum_{n=1}^{N} \frac{1}{n^{2}} - \sum_{k^{2} \leqslant N} \frac{1}{k^{4}} + \sum_{k^{2} \leqslant N} \frac{1}{k^{2}}$, et, par passage à la limite, avec $\sum_{k=1}^{+\infty} \frac{1}{k^{4}} = \frac{\pi^{4}}{90}$, valeur citée dans le cours après la proposition 8, 
    $$\boxed{\sum_{n=1}^{+\infty} u_{n} = \frac{\pi^{2}}{6} - \frac{\pi^{4}}{90} + \frac{\pi^{2}}{6} = \frac{\pi^{2}}{3} - \frac{\pi^{4}}{90} \approx 2{,}2075}$$
     *À retenir.* Pour une série convergente, $u_{n}$ tend vers $0$, mais rien n'oblige $u_{n}$ à être petit devant $\frac{1}{n}$ : la méthode du cours (« si $nu_{n} \to +\infty$, la série diverge ») n'a pas de réciproque. Les rares termes de taille $\frac{1}{n}$ sont trop espacés pour faire diverger la série. L'exercice 18 montrera que, pour une suite *décroissante*, la convergence force au contraire $nu_{n} \to 0$.
- id: "ma-20-09"
  feuille: "f-ma-20"
  numero: 9
  partie: "Séries à termes positifs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 3
  page_corrige: 10
  enonce: |
    Soit $\sum u_{n}$ une série à termes positifs.

    **1.** On suppose que $\sum u_{n}$ converge. Montrer que la série $\sum u_{n}^{\alpha}$ converge pour tout réel $\alpha > 1$.

    **2.** On suppose que $\sum u_{n}$ diverge. Montrer que la série $\sum u_{n}^{\alpha}$ diverge pour tout réel $\alpha \in \,]0\,,1[$.

    **3.** Montrer que les séries $\sum u_{n}$ et $\sum \frac{u_{n}}{1 + u_{n}}$ sont de même nature.
  corrige: |
    **1.** La série $\sum u_{n}$ converge, donc $u_{n}$ tend vers $0$ (proposition 2) : à partir d'un certain rang, $0 \leqslant u_{n} \leqslant 1$. Pour un réel $x \in [0\,,1]$ et $\alpha > 1$, on a $x^{\alpha} = x \cdot x^{\alpha - 1} \leqslant x$. Ainsi $0 \leqslant u_{n}^{\alpha} \leqslant u_{n}$ à partir d'un certain rang, et le théorème 3 conclut. 
    $$\boxed{\sum u_{n} \text{ converge} \implies \sum u_{n}^{\alpha} \text{ converge pour tout } \alpha > 1}$$

    **2.** Soit $\alpha \in \,]0\,,1[$. Pour $x \in [0\,,1]$, on a cette fois $x^{\alpha} \geqslant x$, et pour $x > 1$, $x^{\alpha} > 1$. On distingue deux cas.

    • Si $u_{n} \leqslant 1$ à partir d'un certain rang, alors $u_{n}^{\alpha} \geqslant u_{n} \geqslant 0$ à partir de ce rang, et $\sum u_{n}^{\alpha}$ diverge par le théorème 3 (ii).

    • Sinon, $u_{n} > 1$ pour une infinité d'indices $n$, et pour ceux-là $u_{n}^{\alpha} > 1$ : la suite $(u_{n}^{\alpha})$ ne tend pas vers $0$, et la série diverge grossièrement.

    $$\boxed{\sum u_{n} \text{ diverge} \implies \sum u_{n}^{\alpha} \text{ diverge pour tout } \alpha \in \,]0\,,1[}$$
     *Piège.* L'erreur la plus répandue est de reprendre l'argument de la question 1 en affirmant que $u_{n}$ tend vers $0$ : une série divergente n'a aucune raison d'avoir un terme général de limite nulle. Le second cas est indispensable. Le résultat est faux pour $\alpha > 1$ : avec $u_{n} = \frac{1}{n}$, la série diverge et $\sum \frac{1}{n^{2}}$ converge.

    **3.** Notons $v_{n} = \frac{u_{n}}{1 + u_{n}}$ ; on a $0 \leqslant v_{n} \leqslant u_{n}$ et $0 \leqslant v_{n} < 1$. Si $\sum u_{n}$ converge, $\sum v_{n}$ converge par le théorème 3. Réciproquement, si $\sum v_{n}$ converge, alors $v_{n}$ tend vers $0$, donc $v_{n} \leqslant \frac{1}{2}$ à partir d'un certain rang ; comme $u_{n} = \frac{v_{n}}{1 - v_{n}}$, on obtient $0 \leqslant u_{n} \leqslant 2v_{n}$ à partir de ce rang, et $\sum u_{n}$ converge. 
    $$\boxed{\sum u_{n} \text{ et } \sum \frac{u_{n}}{1 + u_{n}} \text{ sont de même nature}}$$
     On peut aussi raisonner par équivalents, mais il faut alors traiter à part le cas où $u_{n}$ ne tend pas vers $0$ ; la relation $u_{n} = \frac{v_{n}}{1 - v_{n}}$ évite cette distinction. Les deux séries sont de même nature, mais leurs sommes diffèrent : pour $u_{n} = \frac{1}{n(n + 1)}$, on trouve $v_{n} = \frac{1}{n^{2} + n + 1}$.
- id: "ma-20-10"
  feuille: "f-ma-20"
  numero: 10
  partie: "Séries à termes positifs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries à termes positifs, comparaison par équivalents, comparaison série-intégrale]
  noeuds: [as-series, as-comparaison, ri-proprietes]
  notions: []
  page_enonce: 3
  page_corrige: 10
  enonce: |
    À l'aide d'une comparaison avec une intégrale, donner un équivalent simple, quand $n$ tend vers $+\infty$, de 
    $$\sum_{k=n+1}^{2n} \frac{1}{\sqrt{k}} \qquad\text{et de}\qquad \sum_{k=2}^{n} \frac{1}{k\ln k}.$$
  corrige: |
    *Première somme.* La fonction $f : t \mapsto \frac{1}{\sqrt{t}}$ est continue, positive et décroissante sur $[1\,,+\infty[$. Pour $n \geqslant 1$ et $k \in [\![n + 1\,;2n]\!]$, la proposition 6 (i) donne $\int_{k}^{k+1} f \leqslant f(k) \leqslant \int_{k-1}^{k} f$, et, en sommant par la relation de Chasles, 
    $$\int_{n+1}^{2n+1} \frac{\mathrm{d} t}{\sqrt{t}} \leqslant \sum_{k=n+1}^{2n} \frac{1}{\sqrt{k}} \leqslant \int_{n}^{2n} \frac{\mathrm{d} t}{\sqrt{t}}.$$
     La primitive usuelle $2\sqrt{t}$ donne les deux bornes : $2\big(\sqrt{2n + 1} - \sqrt{n + 1}\big)$ et $2\big(\sqrt{2n} - \sqrt{n}\big) = 2(\sqrt{2} - 1)\sqrt{n}$. La borne de gauche vaut 
    $$2\sqrt{n}\Big(\sqrt{2 + \tfrac{1}{n}} - \sqrt{1 + \tfrac{1}{n}}\Big) \sim 2(\sqrt{2} - 1)\sqrt{n},$$
     et l'encadrement conclut (chapitre 10, proposition 6). 
    $$\boxed{\sum_{k=n+1}^{2n} \frac{1}{\sqrt{k}} \sim 2(\sqrt{2} - 1)\sqrt{n} \approx 0{,}828\sqrt{n}}$$
     Pour $n = 10^{4}$, la somme vaut $82{,}841$, pour $2(\sqrt{2} - 1) \times 100 \approx 82{,}843$ ✓. Le théorème 5 donne aussi ce résultat, à condition d'écrire les équivalents comme des développements : la somme jusqu'à $2n$ vaut $2\sqrt{2n} + o(\sqrt{n})$, celle jusqu'à $n$ vaut $2\sqrt{n} + o(\sqrt{n})$, et leur différence vaut $2(\sqrt{2} - 1)\sqrt{n} + o(\sqrt{n})$. Soustraire directement les équivalents n'aurait pas de sens : l'erreur la plus répandue est d'écrire « $\sim 2\sqrt{2n} - 2\sqrt{n}$ » sans contrôler les restes, ce qui tombe juste ici seulement parce que $2\sqrt{2} - 2 \neq 0$.

    ![Figure](documents/figures/dc223bfe2b32bd38.svg)

    Pour $n = 4$, les quatre rectangles bleus ont pour hauteurs $f(5)$, …, $f(8)$ et pour aire totale $1{,}587$. Posés à gauche de chaque entier, ils sont sous la courbe et leur aire est inférieure à $\int_{4}^{8} f \approx 1{,}657$ ; posés à droite, ils la débordent et leur aire dépasse $\int_{5}^{9} f \approx 1{,}528$. Les deux bornes diffèrent de $\int_{4}^{5} f - \int_{8}^{9} f \leqslant f(4)$, et en général d'au plus $f(n)$, quantité négligeable devant $\sqrt{n}$.

    *Seconde somme.* La fonction $g : t \mapsto \frac{1}{t\ln t}$ est continue et positive sur $[2\,,+\infty[$, et décroissante, comme inverse de la fonction croissante et positive $t \mapsto t\ln t$. Elle admet la primitive $t \mapsto \ln(\ln t)$, de la forme $\ln \circ\, u$ avec $u = \ln$, puisque $g = \frac{u'}{u}$. La proposition 6 (ii), avec $n_{0} = 2$, donne 
    $$\ln\ln(n + 1) - \ln\ln 2 \leqslant \sum_{k=2}^{n} \frac{1}{k\ln k} \leqslant \frac{1}{2\ln 2} + \ln\ln n - \ln\ln 2.$$
     La borne de droite est équivalente à $\ln\ln n$, qui tend vers $+\infty$. Pour la borne de gauche, on a $\ln(n + 1) \sim \ln n$, donc 
    $$\ln\ln(n + 1) = \ln\ln n + \ln\frac{\ln(n + 1)}{\ln n} = \ln\ln n + o(1) \sim \ln\ln n.$$
     L'encadrement conclut. 
    $$\boxed{\sum_{k=2}^{n} \frac{1}{k\ln k} \sim \ln(\ln n)}$$
     La convergence de ce rapport est très lente : il vaut $1{,}36$ pour $n = 10^{4}$ et $1{,}30$ pour $n = 10^{6}$, parce que la différence entre la somme et $\ln\ln n$ converge, vers $0{,}7947$ environ (proposition 6 (iii)), et que $\ln\ln n$ ne vaut que $2{,}63$ pour $n = 10^{6}$.

    *À retenir.* La comparaison avec une intégrale donne des équivalents de sommes partielles quand les théorèmes de comparaison ne donnent que la nature. Le second exemple confirme celui du cours (section 20.3.3) : la série $\sum \frac{1}{n\ln n}$ diverge, mais à la vitesse de $\ln\ln n$, beaucoup plus lentement que la série harmonique.
- id: "ma-20-11"
  feuille: "f-ma-20"
  numero: 11
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries à termes positifs, séries de Riemann]
  noeuds: [as-series]
  notions: []
  page_enonce: 3
  page_corrige: 12
  enonce: |
    Déterminer la nature des séries suivantes, en fonction des paramètres réels indiqués.

    **(a)** $\displaystyle\sum_{n \geqslant 2} \frac{1}{(\ln n)^{\ln n}}$, $\displaystyle\sum_{n \geqslant 1} \Big(1 - \frac{1}{\sqrt{n}}\Big)^{n}$ et $\displaystyle\sum_{n \geqslant 0} \big(1 - \operatorname{th} n\big)$.

    **(b)** $\displaystyle\sum_{n \geqslant 1} \frac{n^{\lambda} + \ln n}{n^{2}}$, pour $\lambda \in \mathbb{R}$.

    **(c)** $\displaystyle\sum_{n \geqslant 0} \frac{a^{n}\,2^{\sqrt{n}}}{b^{n} + 2^{\sqrt{n}}}$, pour $a > 0$ et $b > 0$.

    **(d)** $\displaystyle\sum_{n \geqslant 1} \Big(\sqrt[3]{n^{3} + an^{2} + bn + c} - \sqrt{n^{2} + n + 1}\Big)$, pour $a$, $b$, $c \in \mathbb{R}$.

    **(e)** $\displaystyle\sum_{n \geqslant 1} \Big(\operatorname{Arccos}\Big(\frac{1}{\sqrt{2}} + \frac{1}{n^{\alpha}}\Big) - \frac{\pi}{4}\Big)$, pour $\alpha > 0$ ; le terme général n'est défini que si $n^{\alpha} \geqslant \frac{\sqrt{2}}{\sqrt{2} - 1}$, et la série commence au premier rang qui vérifie cette condition.
  corrige: |
    **(a)** *Première série.* Pour $n \geqslant 2$, $\frac{1}{(\ln n)^{\ln n}} = \mathrm{e}^{-\ln n \cdot \ln\ln n} = \frac{1}{n^{\ln\ln n}}$. Dès que $\ln\ln n \geqslant 2$, c'est-à-dire $n \geqslant \mathrm{e}^{\mathrm{e}^{2}} \approx 1618{,}2$, ce terme est majoré par $\frac{1}{n^{2}}$, et le théorème 3 conclut. 
    $$\boxed{\sum_{n \geqslant 2} \frac{1}{(\ln n)^{\ln n}} \text{ converge}}$$
     *Deuxième série.* Pour $n \geqslant 2$, l'inégalité $\ln(1 + x) \leqslant x$ (chapitre 5), appliquée au réel $x = -\frac{1}{\sqrt{n}} > -1$, donne 
    $$0 \leqslant \Big(1 - \frac{1}{\sqrt{n}}\Big)^{n} = \mathrm{e}^{n\ln(1 - 1/\sqrt{n})} \leqslant \mathrm{e}^{-n/\sqrt{n}} = \mathrm{e}^{-\sqrt{n}},$$
     et $\mathrm{e}^{-\sqrt{n}} = o\big(\frac{1}{n^{2}}\big)$, comme à l'exercice 7 (a). 
    $$\boxed{\sum_{n \geqslant 1} \Big(1 - \frac{1}{\sqrt{n}}\Big)^{n} \text{ converge}}$$
     Un développement donnerait plus précisément $\big(1 - \frac{1}{\sqrt{n}}\big)^{n} \sim \mathrm{e}^{-1/2}\mathrm{e}^{-\sqrt{n}}$, mais la majoration suffit pour la nature.

    *Troisième série.* Pour $n \geqslant 0$, $1 - \operatorname{th} n = \frac{(\mathrm{e}^{n} + \mathrm{e}^{-n}) - (\mathrm{e}^{n} - \mathrm{e}^{-n})}{\mathrm{e}^{n} + \mathrm{e}^{-n}} = \frac{2\mathrm{e}^{-2n}}{1 + \mathrm{e}^{-2n}}$, compris entre $0$ et $2\mathrm{e}^{-2n}$, terme d'une série géométrique de raison $\mathrm{e}^{-2} < 1$. 
    $$\boxed{\sum_{n \geqslant 0} (1 - \operatorname{th} n) \text{ converge}}$$

    **(b)** Le terme général s'écrit $\frac{n^{\lambda} + \ln n}{n^{2}} = \frac{1}{n^{2 - \lambda}} + \frac{\ln n}{n^{2}}$, somme de deux termes positifs. La série $\sum \frac{\ln n}{n^{2}}$ converge, puisque $n^{3/2} \cdot \frac{\ln n}{n^{2}} = \frac{\ln n}{\sqrt{n}} \to 0$. La série de Riemann $\sum \frac{1}{n^{2 - \lambda}}$ converge si et seulement si $2 - \lambda > 1$. Par la proposition 1 (i) et (ii) : 
    $$\boxed{\sum_{n \geqslant 1} \frac{n^{\lambda} + \ln n}{n^{2}} \text{ converge} \iff \lambda < 1}$$
     Pour $\lambda = 1$, le terme est équivalent à $\frac{1}{n}$ ; le logarithme, qui domine $n^{\lambda}$ lorsque $\lambda \leqslant 0$, n'intervient jamais dans la nature.

    **(c)** On note $u_{n}$ le terme général, positif, et l'on compare $b^{n}$ et $2^{\sqrt{n}}$ au dénominateur.

    • Si $b \leqslant 1$, alors $b^{n} \leqslant 1 \leqslant 2^{\sqrt{n}}$, donc $2^{\sqrt{n}} \leqslant b^{n} + 2^{\sqrt{n}} \leqslant 2 \cdot 2^{\sqrt{n}}$, et $\frac{a^{n}}{2} \leqslant u_{n} \leqslant a^{n}$. La série converge si $a < 1$ (série géométrique), et diverge grossièrement si $a \geqslant 1$, puisqu'alors $u_{n} \geqslant \frac{1}{2}$.

    • Si $b > 1$, alors $\frac{b^{n}}{2^{\sqrt{n}}} = \mathrm{e}^{n\ln b - \sqrt{n}\ln 2}$ tend vers $+\infty$, puisque $n\ln b - \sqrt{n}\ln 2 = n\big(\ln b - \frac{\ln 2}{\sqrt{n}}\big)$. Donc $b^{n} + 2^{\sqrt{n}} \sim b^{n}$ et $u_{n} \sim \big(\frac{a}{b}\big)^{n}2^{\sqrt{n}}$. Si $a \geqslant b$, ce terme est au moins $2^{\sqrt{n}}$ et la série diverge grossièrement. Si $a < b$, on choisit $q \in \,\big]\frac{a}{b}\,,1\big[$ ; alors $\big(\frac{a}{b}\big)^{n}2^{\sqrt{n}} = q^{n} \cdot \mathrm{e}^{n\ln\frac{a}{bq} + \sqrt{n}\ln 2}$, et l'exposant tend vers $-\infty$ puisque $\ln\frac{a}{bq} < 0$ : le terme est $o(q^{n})$, et la série converge.

    $$\boxed{\sum_{n \geqslant 0} \frac{a^{n}\,2^{\sqrt{n}}}{b^{n} + 2^{\sqrt{n}}} \text{ converge} \iff a < \max(1, b)}$$
     Le facteur $2^{\sqrt{n}}$, qui tend vers $+\infty$, ne pèse rien devant une exponentielle $q^{n}$ : la réponse est la même que pour la série plus simple $\sum \frac{a^{n}}{b^{n} + 1}$, que l'on traite par les mêmes encadrements.

    **(d)** On met $n$ en facteur dans chaque racine, et l'on développe $(1 + x)^{1/3}$ et $(1 + x)^{1/2}$ à l'ordre $3$ (chapitre 10, théorème 5), où $x$ est d'ordre $\frac{1}{n}$. Le calcul donne 
    $$u_{n} = \Big(\frac{a}{3} - \frac{1}{2}\Big) + \Big(\frac{b}{3} - \frac{a^{2}}{9} - \frac{3}{8}\Big)\frac{1}{n} + \Big(\frac{c}{3} - \frac{2ab}{9} + \frac{5a^{3}}{81} + \frac{3}{16}\Big)\frac{1}{n^{2}} + O\Big(\frac{1}{n^{3}}\Big).$$
     Si $a \neq \frac{3}{2}$, $u_{n}$ a une limite non nulle : divergence grossière. Si $a = \frac{3}{2}$, le coefficient de $\frac{1}{n}$ vaut $\frac{b}{3} - \frac{1}{4} - \frac{3}{8} = \frac{b}{3} - \frac{5}{8}$ ; s'il est non nul, $u_{n}$ lui est équivalent à un facteur $\frac{1}{n}$ près, de signe constant, et la série diverge. Si $a = \frac{3}{2}$ et $b = \frac{15}{8}$, le coefficient de $\frac{1}{n^{2}}$ se réduit à $\frac{c}{3} - \frac{11}{48}$, et $u_{n} = O\big(\frac{1}{n^{2}}\big)$ : la série converge (proposition 9). 
    $$\boxed{\sum \Big(\sqrt[3]{n^{3} + an^{2} + bn + c} - \sqrt{n^{2} + n + 1}\Big) \text{ converge} \iff a = \frac{3}{2} \text{ et } b = \frac{15}{8}, \ c \text{ quelconque}}$$
     Il est inutile de discuter le signe du coefficient de $\frac{1}{n^{2}}$, qui s'annule pour $c = \frac{11}{16}$ : la domination par $\frac{1}{n^{2}}$ suffit, quel que soit $c$.

    **(e)** On pose $h_{n} = \frac{1}{n^{\alpha}}$, qui tend vers $0$. La fonction $\operatorname{Arccos}$ est dérivable en $\frac{1}{\sqrt{2}}$, de dérivée $-\frac{1}{\sqrt{1 - 1/2}} = -\sqrt{2}$, et $\operatorname{Arccos}\frac{1}{\sqrt{2}} = \frac{\pi}{4}$. Le développement limité à l'ordre $1$ (chapitre 10) donne 
    $$\operatorname{Arccos}\Big(\frac{1}{\sqrt{2}} + h_{n}\Big) - \frac{\pi}{4} = -\sqrt{2}\,h_{n} + o(h_{n}) \sim -\frac{\sqrt{2}}{n^{\alpha}}.$$
     Le terme général est négatif, puisque $\operatorname{Arccos}$ est décroissante : son opposé est positif et équivalent à $\frac{\sqrt{2}}{n^{\alpha}}$. 
    $$\boxed{\sum \Big(\operatorname{Arccos}\Big(\frac{1}{\sqrt{2}} + \frac{1}{n^{\alpha}}\Big) - \frac{\pi}{4}\Big) \text{ converge} \iff \alpha > 1}$$
     La condition de définition $n^{\alpha} \geqslant \frac{\sqrt{2}}{\sqrt{2} - 1} = 2 + \sqrt{2}$ ne porte que sur un nombre fini de termes, et ne modifie pas la nature.
- id: "ma-20-12"
  feuille: "f-ma-20"
  numero: 12
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries à termes positifs, comparaison série-intégrale, "constante d'Euler et Stirling"]
  noeuds: [as-series, ri-proprietes, as-dl]
  notions: []
  page_enonce: 3
  page_corrige: 13
  enonce: |
    Déterminer la nature des séries de termes généraux suivants.

    **(a)** $u_{n} = \dfrac{1}{\ln(n!)}\displaystyle\sum_{k=1}^{n} \frac{1}{k}$, pour $n \geqslant 2$.

    **(b)** $v_{n} = \displaystyle\int_{0}^{\pi/n} \frac{\sin^{3}x}{1 + x}\,\mathrm{d} x$, pour $n \geqslant 1$.

    **(c)** $w_{n} = a^{H_{n}}$, pour $n \geqslant 1$, où $a > 0$ est un réel fixé.
  corrige: |
    **(a)** Le terme $u_{n}$ est positif. Par le théorème 5, $H_{n} \sim \ln n$, et par la remarque qui suit la proposition 6, $\ln(n!) \sim n\ln n$. Le quotient d'équivalents (chapitre 10, théorème 1) donne $u_{n} \sim \frac{\ln n}{n\ln n} = \frac{1}{n}$. 
    $$\boxed{\sum_{n \geqslant 2} \frac{H_{n}}{\ln(n!)} \text{ diverge}}$$

    **(b)** Pour $x \in \big[0\,,\frac{\pi}{n}\big] \subset [0\,,\pi]$, on a $\sin x \geqslant 0$, et $\sin x \leqslant x$ (chapitre 4) ; comme $1 + x \geqslant 1$, 
    $$0 \leqslant \frac{\sin^{3} x}{1 + x} \leqslant x^{3}, \qquad\text{donc}\qquad 0 \leqslant v_{n} \leqslant \int_{0}^{\pi/n} x^{3}\,\mathrm{d} x = \frac{\pi^{4}}{4n^{4}}$$
     par croissance de l'intégrale (chapitre 18, théorème 3) et primitive usuelle. Le théorème 3 conclut. 
    $$\boxed{\sum_{n \geqslant 1} v_{n} \text{ converge}}$$
     On n'a pas besoin de calculer l'intégrale : la majorer suffit. Elle est d'ailleurs équivalente à son majorant. En effet, sur $\big[0\,,\frac{\pi}{n}\big]$, l'encadrement $\sin x \geqslant x - \frac{x^{3}}{6}$ (chapitre 5) donne $\sin x \geqslant x\big(1 - \frac{\pi^{2}}{6n^{2}}\big) \geqslant 0$ pour $n \geqslant 2$, et $\frac{1}{1 + x} \geqslant \frac{1}{1 + \pi/n}$, d'où 
    $$\frac{\big(1 - \frac{\pi^{2}}{6n^{2}}\big)^{3}}{1 + \frac{\pi}{n}} \cdot \frac{\pi^{4}}{4n^{4}} \leqslant v_{n} \leqslant \frac{\pi^{4}}{4n^{4}}, \qquad\text{donc}\qquad v_{n} \sim \frac{\pi^{4}}{4n^{4}}.$$
     Numériquement, $v_{1000} \big/ \frac{\pi^{4}}{4 \cdot 10^{12}} \approx 0{,}9975$ ✓.

    **(c)** On a $w_{n} = \mathrm{e}^{H_{n}\ln a}$, et la proposition 7 donne $H_{n}\ln a = \ln a \cdot \ln n + \gamma\ln a + o(1)$, donc 
    $$w_{n} = n^{\ln a}\,\mathrm{e}^{\gamma\ln a}\,\mathrm{e}^{o(1)} \sim \frac{a^{\gamma}}{n^{-\ln a}},$$
     puisque $\mathrm{e}^{o(1)}$ tend vers $1$. La série de Riemann d'exposant $-\ln a$ converge si et seulement si $-\ln a > 1$, c'est-à-dire $a < \frac{1}{\mathrm{e}}$. 
    $$\boxed{\sum_{n \geqslant 1} a^{H_{n}} \text{ converge} \iff a < \frac{1}{\mathrm{e}}}$$
     *Piège.* L'erreur la plus répandue est d'écrire $a^{H_{n}} \sim a^{\ln n}$ à partir de $H_{n} \sim \ln n$ : on ne compose pas un équivalent par l'exponentielle. Le rapport $\frac{a^{H_{n}}}{a^{\ln n}} = a^{H_{n} - \ln n}$ tend vers $a^{\gamma}$, et non vers $1$ ; la nature n'en est pas changée ici, mais il faut le développement $H_{n} = \ln n + \gamma + o(1)$, c'est-à-dire une erreur $o(1)$ dans l'exposant, pour pouvoir conclure.
- id: "ma-20-13"
  feuille: "f-ma-20"
  numero: 13
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries à termes positifs, séries de Riemann, comparaison série-intégrale]
  noeuds: [as-series, ri-proprietes]
  notions: []
  page_enonce: 3
  page_corrige: 14
  enonce: |
    *Les séries de Bertrand.* Pour $\alpha$, $\beta \in \mathbb{R}$, on considère la série $\displaystyle\sum_{n \geqslant 2} \frac{1}{n^{\alpha}(\ln n)^{\beta}}$.

    **1.** Déterminer sa nature lorsque $\alpha \neq 1$, par comparaison avec des séries de Riemann bien choisies.

    **2.** À l'aide d'une comparaison avec une intégrale, déterminer sa nature lorsque $\alpha = 1$.

    **3.** Représenter dans le plan l'ensemble des couples $(\alpha, \beta)$ pour lesquels la série converge.
  corrige: |
    On note $u_{n} = \frac{1}{n^{\alpha}(\ln n)^{\beta}}$, positif pour $n \geqslant 2$.

    **1.** Supposons $\alpha > 1$ et posons $\rho = \frac{1 + \alpha}{2} \in \,]1\,,\alpha[$. Alors 
    $$n^{\rho}u_{n} = \frac{(\ln n)^{-\beta}}{n^{(\alpha - 1)/2}} \xrightarrow[n \to +\infty]{} 0 :$$
     si $\beta \geqslant 0$, le numérateur est majoré par $1$ pour $n \geqslant 3$ ; si $\beta < 0$, c'est la croissance comparée $(\ln n)^{|\beta|} = o\big(n^{(\alpha - 1)/2}\big)$ (chapitre 10, proposition 2). Ainsi $u_{n} = o\big(\frac{1}{n^{\rho}}\big)$ avec $\rho > 1$, et la série converge (théorème 3 (iii)).

    Supposons $\alpha < 1$. Alors $nu_{n} = \frac{n^{1 - \alpha}}{(\ln n)^{\beta}}$ tend vers $+\infty$, pour la même raison : si $\beta \leqslant 0$, $nu_{n} \geqslant n^{1 - \alpha}$ pour $n \geqslant 3$, et si $\beta > 0$, $(\ln n)^{\beta} = o(n^{1 - \alpha})$. Donc $u_{n} \geqslant \frac{1}{n}$ à partir d'un certain rang, et la série diverge. 
    $$\boxed{\alpha > 1 : \text{ convergence} ; \qquad \alpha < 1 : \text{ divergence, quel que soit } \beta}$$
     Le logarithme ne pèse rien devant une puissance de $n$ : pour $\alpha \neq 1$, on « vole » une petite puissance $n^{(\alpha - 1)/2}$ pour l'absorber.

    **2.** Supposons $\alpha = 1$. Si $\beta \leqslant 0$, alors $u_{n} = \frac{(\ln n)^{-\beta}}{n} \geqslant \frac{1}{n}$ pour $n \geqslant 3$ : la série diverge. Si $\beta > 0$, la fonction $f : t \mapsto \frac{1}{t(\ln t)^{\beta}}$ est continue, positive, et décroissante sur $[2\,,+\infty[$, comme inverse de la fonction croissante et positive $t \mapsto t(\ln t)^{\beta}$. On reconnaît $f = u'u^{-\beta}$ avec $u = \ln$, d'où une primitive : 
    $$\int_{2}^{n} \frac{\mathrm{d} t}{t(\ln t)^{\beta}} = \frac{(\ln n)^{1 - \beta} - (\ln 2)^{1 - \beta}}{1 - \beta} \ \text{ si } \beta \neq 1, \qquad \int_{2}^{n} \frac{\mathrm{d} t}{t\ln t} = \ln\ln n - \ln\ln 2.$$
     Cette suite est majorée (par $\frac{(\ln 2)^{1 - \beta}}{\beta - 1}$) si $\beta > 1$, et tend vers $+\infty$ si $0 < \beta \leqslant 1$. La proposition 6 (iii) conclut. 
    $$\boxed{\alpha = 1 : \quad \sum_{n \geqslant 2} \frac{1}{n(\ln n)^{\beta}} \text{ converge} \iff \beta > 1}$$
     On contrôle la primitive par dérivation : $\frac{\mathrm{d}}{\mathrm{d} t}\frac{(\ln t)^{1 - \beta}}{1 - \beta} = \frac{1}{t}(\ln t)^{-\beta}$ ✓.

    **3.** En résumé, la série converge si et seulement si $\alpha > 1$, ou bien $\alpha = 1$ et $\beta > 1$. 
    $$\boxed{\sum_{n \geqslant 2} \frac{1}{n^{\alpha}(\ln n)^{\beta}} \text{ converge} \iff \alpha > 1 \ \text{ ou } \ (\alpha = 1 \text{ et } \beta > 1)}$$

    ![Figure](documents/figures/f0811534dfec4c35.svg)

    Le domaine de convergence, en bleu, est le demi-plan ouvert $\alpha > 1$, auquel s'ajoute la demi-droite épaisse $\{1\} \times \,]1\,,+\infty[$, sans son origine $(1, 1)$, marquée d'un cercle vide. Sur la droite $\alpha = 1$, frontière entre les deux comportements, c'est l'exposant du logarithme qui décide, avec le même seuil $1$ que pour les séries de Riemann.

    *À retenir.* Les séries de Bertrand affinent l'échelle des séries de Riemann exactement là où celle-ci ne décide pas. Le cas $\beta = 1$ est la série $\sum \frac{1}{n\ln n}$ de l'exemple du cours (section 20.3.3) et de l'exercice 10 ; l'exercice 19 retrouvera les séries de Riemann par une autre méthode, la condensation, et prolongera l'échelle d'un cran avec un facteur $(\ln\ln n)^{\alpha}$.
- id: "ma-20-14"
  feuille: "f-ma-20"
  numero: 14
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries à termes positifs, fonction zêta]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 15
  enonce: |
    Montrer que $(s - 1)\,\zeta(s)$ tend vers $1$ quand le réel $s$ tend vers $1$ par valeurs supérieures. Que peut-on en déduire pour $\zeta(s)$ ?
  corrige: |
    Soit $s > 1$. La fonction $f : t \mapsto t^{-s}$ est continue, positive et décroissante sur $[1\,,+\infty[$, de primitive $t \mapsto \frac{t^{1 - s}}{1 - s}$, et $\int_{1}^{x} \frac{\mathrm{d} t}{t^{s}} = \frac{1 - x^{1 - s}}{s - 1}$ pour $x \geqslant 1$. La proposition 6 (ii), avec $n_{0} = 1$, donne pour tout $n \geqslant 1$ 
    $$\frac{1 - (n + 1)^{1 - s}}{s - 1} \leqslant \sum_{k=1}^{n} \frac{1}{k^{s}} \leqslant 1 + \frac{1 - n^{1 - s}}{s - 1}.$$
     Comme $1 - s < 0$, les termes $(n + 1)^{1 - s}$ et $n^{1 - s}$ tendent vers $0$, et le passage à la limite dans les inégalités larges (chapitre 7, théorème 5) donne 
    $$\boxed{\frac{1}{s - 1} \leqslant \zeta(s) \leqslant 1 + \frac{1}{s - 1}, \qquad\text{soit}\qquad 1 \leqslant (s - 1)\,\zeta(s) \leqslant s}$$
     Le théorème d'encadrement pour les limites de fonctions (chapitre 8, théorème 5), quand $s$ tend vers $1$ par valeurs supérieures, conclut. 
    $$\boxed{\lim_{s \to 1^{+}} (s - 1)\,\zeta(s) = 1, \qquad\text{c'est-à-dire}\qquad \zeta(s) \underset{s \to 1^{+}}{\sim} \frac{1}{s - 1}}$$
     En particulier, $\zeta(s)$ tend vers $+\infty$ quand $s$ tend vers $1$ par valeurs supérieures : la fonction $\zeta$, définie sur $]1\,,+\infty[$, « garde le souvenir » de la divergence de la série harmonique, qui correspond à $s = 1$. Pour $s = 1{,}01$, on a $\zeta(s) \approx 100{,}578$ et $(s - 1)\zeta(s) \approx 1{,}0058$ ✓.

    *Pour aller plus loin.* L'encadrement montre que $\zeta(s) - \frac{1}{s - 1}$ reste compris entre $0$ et $1$. Numériquement, cette différence vaut $0{,}5844$ pour $s = 1{,}1$ et $0{,}5779$ pour $s = 1{,}01$ : elle tend vers la constante d'Euler $\gamma \approx 0{,}5772$, comme $H_{n} - \ln n$ dans la proposition 7. Nous ne le démontrerons pas ici.
- id: "ma-20-15"
  feuille: "f-ma-20"
  numero: 15
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 16
  enonce: |
    Déterminer la partie entière du réel $\displaystyle\sum_{n=1}^{10^{9}} \frac{1}{n^{2/3}}$, sans calculatrice.
  corrige: |
    Notons $N = 10^{9}$ et $S = \sum_{n=1}^{N} \frac{1}{n^{2/3}}$. La fonction $f : t \mapsto t^{-2/3}$ est continue, positive et strictement décroissante sur $[1\,,+\infty[$, de primitive $t \mapsto 3t^{1/3}$. La proposition 6 (ii), avec $n_{0} = 1$, donne 
    $$3\big((N + 1)^{1/3} - 1\big) \leqslant S \leqslant 1 + 3\big(N^{1/3} - 1\big).$$
     Or $N^{1/3} = 10^{3} = 1000$, et $(N + 1)^{1/3} > 1000$. La borne de droite vaut $1 + 3 \times 999 = 2998$, celle de gauche est strictement supérieure à $3 \times 999 = 2997$. Pour exclure l'égalité $S = 2998$, on revient à la proposition 6 (i) : pour $k \geqslant 2$, la fonction $f - f(k)$ est continue, positive sur $[k - 1\,,k]$, et non nulle (elle vaut $f(k - 1) - f(k) > 0$ en $k - 1$), donc son intégrale est strictement positive (chapitre 18, théorème 4) : $f(k) < \int_{k-1}^{k} f$. L'inégalité de droite est donc stricte, et 
    $$2997 < S < 2998, \qquad \boxed{\Big\lfloor \sum_{n=1}^{10^{9}} \frac{1}{n^{2/3}} \Big\rfloor = 2997}$$
     Le choix de $N = 10^{9}$ rend la racine cubique entière : c'est ce qui permet de conclure sans calculatrice. La valeur exacte, obtenue par ordinateur, est $S \approx 2997{,}552$ ; les deux bornes encadrent $S$ dans un intervalle de longueur voisine de $f(1) = 1$, ce qui suffit ici parce que le nombre de bornes entières possibles est réduit à un.

    *Piège.* L'erreur la plus répandue est de ne retenir que l'équivalent $S \sim 3N^{1/3} = 3000$ du théorème 5 : un équivalent ne donne aucune information sur la partie entière, puisqu'il autorise une erreur $o(N^{1/3})$, éventuellement très grande. Il faut un *encadrement* à moins de $1$ près, et la proposition 6 le fournit.
- id: "ma-20-16"
  feuille: "f-ma-20"
  numero: 16
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 16
  enonce: |
    **1.** Justifier la convergence de la série $\sum_{n \geqslant 1} \frac{1}{n(2n + 1)}$ et calculer sa somme. On pourra exprimer ses sommes partielles à l'aide de $H_{n}$ et de $H_{2n+1}$.

    **2.** On définit la suite $(u_{n})_{n \geqslant 1}$ par $u_{n} = -\frac{4}{n}$ si $5$ divise $n$, et $u_{n} = \frac{1}{n}$ sinon. Montrer que la série $\sum u_{n}$ converge et calculer sa somme.
  corrige: |
    **1.** Le terme général est positif et équivalent à $\frac{1}{2n^{2}}$ : la série converge (théorèmes 4 et 5). On décompose en éléments simples (chapitre 13) : 
    $$\frac{1}{n(2n + 1)} = \frac{1}{n} - \frac{2}{2n + 1}.$$
     Pour $N \geqslant 1$, la somme des inverses des entiers impairs de $1$ à $2N + 1$ s'obtient en retirant de $H_{2N + 1}$ les inverses des pairs, $\sum_{j=1}^{N} \frac{1}{2j} = \frac{1}{2}H_{N}$ ; on en retire encore le terme $1$, qui ne figure pas dans la somme : 
    $$\sum_{n=1}^{N} \frac{2}{2n + 1} = 2\Big(H_{2N + 1} - \frac{1}{2}H_{N} - 1\Big), \qquad \sum_{n=1}^{N} \frac{1}{n(2n + 1)} = 2H_{N} - 2H_{2N + 1} + 2.$$
     Par la proposition 7, $H_{N} - H_{2N + 1} = \ln N - \ln(2N + 1) + o(1) = -\ln\Big(2 + \frac{1}{N}\Big) + o(1)$ tend vers $-\ln 2$. 
    $$\boxed{\sum_{n=1}^{+\infty} \frac{1}{n(2n + 1)} = 2 - 2\ln 2 \approx 0{,}6137}$$
     Pour $N = 1$, la formule donne $2 - 2\big(1 + \frac{1}{2} + \frac{1}{3}\big) + 2 = \frac{1}{3}$, qui est bien le premier terme ✓.

    **2.** Pour $N \geqslant 1$, on calcule la somme partielle d'indice $5N$ en écrivant, pour $5 \mid n$, $u_{n} = \frac{1}{n} - \frac{5}{n}$ ; les multiples de $5$ jusqu'à $5N$ sont les $5k$, $1 \leqslant k \leqslant N$ : 
    $$S_{5N} = \sum_{n=1}^{5N} \frac{1}{n} - \sum_{k=1}^{N} \frac{5}{5k} = H_{5N} - H_{N} = \ln(5N) - \ln N + o(1) \xrightarrow[N \to +\infty]{} \ln 5,$$
     encore par la proposition 7. Pour un entier $n \geqslant 5$ quelconque, on écrit $n = 5N + r$ avec $0 \leqslant r \leqslant 4$ et $N \geqslant 1$ ; les termes d'indices $5N + 1$, …, $5N + r$ ne sont pas multiples de $5$, donc 
    $$0 \leqslant S_{n} - S_{5N} \leqslant \frac{r}{5N + 1} \leqslant \frac{4}{5N},$$
     qui tend vers $0$ quand $n$, donc $N$, tend vers $+\infty$. Ainsi $S_{n}$ tend vers $\ln 5$. 
    $$\boxed{\sum u_{n} \text{ converge, et } \sum_{n=1}^{+\infty} u_{n} = \ln 5}$$
     C'est le regroupement par paquets de l'exercice 6 (questions 1 et 3), avec des paquets de cinq termes dont la somme des valeurs absolues tend vers $0$. La somme partielle d'indice $5 \times 10^{6}$ vaut $1{,}6094375$, pour $\ln 5 \approx 1{,}6094379$ ✓.

    *À retenir.* Les deux questions reposent sur la même idée : exprimer les sommes partielles à l'aide de $H_{m}$ pour plusieurs valeurs de $m$ proportionnelles, puis utiliser $H_{m} = \ln m + \gamma + o(1)$, où la constante $\gamma$ disparaît dans les différences. La même méthode redonne la somme $\sum_{n=1}^{+\infty} \frac{(-1)^{n+1}}{n} = \ln 2$ de la section 20.5, que le cours tirait de la formule de Taylor : la somme partielle d'indice $2N$ vaut $H_{2N} - H_{N}$. Les signes de $\sum u_{n}$ ne sont pas constants, et une modification de l'ordre des termes changerait la somme ; c'est le phénomène étudié à la section 20.5.1.
- id: "ma-20-17"
  feuille: "f-ma-20"
  numero: 17
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 17
  enonce: |
    Soit $\sum a_{n}$ une série à termes positifs.

    **1.** Montrer que si $\sum a_{n}$ converge, alors $\sum \sqrt{a_{n}a_{n+1}}$ converge.

    **2.** Montrer que la réciproque est vraie si la suite $(a_{n})$ est décroissante, mais qu'elle est fausse en général.
  corrige: |
    **1.** Pour deux réels positifs $x$ et $y$, l'inégalité $\big(\sqrt{x} - \sqrt{y}\big)^{2} \geqslant 0$ donne $\sqrt{xy} \leqslant \frac{x + y}{2}$. Ainsi 
    $$0 \leqslant \sqrt{a_{n}a_{n+1}} \leqslant \frac{a_{n} + a_{n+1}}{2}.$$
     Si $\sum a_{n}$ converge, la série $\sum a_{n+1}$ aussi, puisqu'elle n'en diffère que par le premier terme, et la série de terme général $\frac{a_{n} + a_{n+1}}{2}$ converge par la proposition 1 (i). Le théorème 3 conclut. 
    $$\boxed{\sum a_{n} \text{ converge} \implies \sum \sqrt{a_{n}a_{n+1}} \text{ converge}}$$

    **2.** Si $(a_{n})$ est décroissante, alors $a_{n} \geqslant a_{n+1} \geqslant 0$, donc $\sqrt{a_{n}a_{n+1}} \geqslant \sqrt{a_{n+1}^{2}} = a_{n+1}$. Si $\sum \sqrt{a_{n}a_{n+1}}$ converge, le théorème 3 donne la convergence de $\sum a_{n+1}$, donc de $\sum a_{n}$. 
    $$\boxed{(a_{n}) \text{ décroissante} : \ \sum \sqrt{a_{n}a_{n+1}} \text{ converge} \implies \sum a_{n} \text{ converge}}$$
     Sans la décroissance, il suffit qu'un terme sur deux soit nul : avec $a_{2k} = 1$ et $a_{2k+1} = 0$, on a $\sqrt{a_{n}a_{n+1}} = 0$ pour tout $n$, alors que $\sum a_{n}$ diverge grossièrement. 
    $$\boxed{a_{n} = \frac{1 + (-1)^{n}}{2} : \ \sum \sqrt{a_{n}a_{n+1}} = \sum 0 \text{ converge}, \ \sum a_{n} \text{ diverge}}$$
     L'exemple ne tient pas à la présence de termes nuls : avec $a_{2k} = 1$ et $a_{2k+1} = \frac{1}{(k + 1)^{4}}$, tous strictement positifs, on trouve $\sqrt{a_{2k}a_{2k+1}} = \frac{1}{(k + 1)^{2}}$ et $\sqrt{a_{2k+1}a_{2k+2}} = \frac{1}{(k + 1)^{2}}$, et la série des moyennes géométriques converge encore.

    *À retenir.* La moyenne géométrique de deux termes voisins est contrôlée par le plus petit des deux ; elle ne voit pas un grand terme isolé, à moins que la monotonie n'empêche les termes voisins d'être très différents. C'est le même phénomène qu'à l'exercice 8 : une série peut contenir des termes « anormalement grands », pourvu qu'ils soient rares ou compensés.
- id: "ma-20-18"
  feuille: "f-ma-20"
  numero: 18
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 18
  enonce: |
    Soit $(u_{n})_{n \geqslant 1}$ une suite réelle positive et décroissante telle que la série $\sum u_{n}$ converge.

    **1.** En minorant la somme $\sum_{k=n+1}^{2n} u_{k}$, montrer que $nu_{n}$ tend vers $0$ quand $n$ tend vers $+\infty$.

    **2.** Montrer, à l'aide de l'exercice 8, que l'hypothèse de décroissance est indispensable.

    **3.** Montrer que la série $\sum n(u_{n} - u_{n+1})$ converge et que sa somme vaut $\sum_{n=1}^{+\infty} u_{n}$.
  corrige: |
    On note $S_{n} = \sum_{k=1}^{n} u_{k}$ et $S = \sum_{k=1}^{+\infty} u_{k}$.

    **1.** Soit $n \geqslant 1$. Par décroissance, chacun des $n$ termes $u_{n+1}$, …, $u_{2n}$ est au moins égal au dernier, $u_{2n}$ : 
    $$0 \leqslant nu_{2n} \leqslant \sum_{k=n+1}^{2n} u_{k} = S_{2n} - S_{n}.$$
     Comme $(S_{2n})$ et $(S_{n})$ tendent toutes deux vers $S$ (chapitre 7, proposition 11 (i)), le majorant tend vers $0$, et la suite $(2nu_{2n})$ aussi. Pour les indices impairs, la décroissance donne 
    $$0 \leqslant (2n + 1)u_{2n+1} \leqslant (2n + 1)u_{2n} = \frac{2n + 1}{2n} \cdot 2nu_{2n},$$
     qui tend aussi vers $0$. Les deux suites extraites d'indices pairs et impairs tendent vers $0$ (chapitre 7, proposition 11 (ii)). 
    $$\boxed{\lim_{n \to +\infty} nu_{n} = 0, \quad\text{c'est-à-dire}\quad u_{n} = o\Big(\frac{1}{n}\Big)}$$

    ![Figure](documents/figures/ad0187e3b8f2fa74.svg)

    Pour $n = 4$ et $u_{k} = \frac{10}{(k + 2)^{3/2}}$, la barre d'indice $k$ a pour hauteur $u_{k}$. Les quatre barres foncées, d'indices $5$ à $8$, ont une aire totale $S_{8} - S_{4}$ au moins égale à celle du rectangle hachuré, de hauteur $u_{8}$ et de largeur $4$ : c'est la minoration $nu_{2n} \leqslant S_{2n} - S_{n}$, qui n'utilise que la décroissance.

    **2.** La suite $(u_{n})$ de l'exercice 8 est positive, et la série $\sum u_{n}$ converge ; mais $nu_{n} = 1$ lorsque $n$ est un carré, et $(nu_{n})$ ne tend pas vers $0$. Cette suite n'est pas décroissante : $u_{3} = \frac{1}{9} < u_{4} = \frac{1}{4}$. 
    $$\boxed{\text{Sans décroissance, } \sum u_{n} \text{ peut converger sans que } nu_{n} \to 0 \text{ (exercice 8)}}$$
     Dans la question 1, c'est la décroissance qui transmet l'information « la somme des termes de $n + 1$ à $2n$ est petite » à *chaque* terme ; à l'exercice 8, le terme $u_{k^{2}} = \frac{1}{k^{2}}$ est seul de sa taille dans son paquet.

    **3.** Les termes $n(u_{n} - u_{n+1})$ sont positifs, par décroissance. Pour $N \geqslant 1$, on sépare la somme en deux et l'on décale l'indice dans la seconde ($m = n + 1$) : 
    $$\sum_{n=1}^{N} n(u_{n} - u_{n+1}) = \sum_{n=1}^{N} nu_{n} - \sum_{m=2}^{N + 1} (m - 1)u_{m} = \sum_{n=1}^{N} u_{n} - Nu_{N+1},$$
     puisque, pour $2 \leqslant m \leqslant N$, $mu_{m} - (m - 1)u_{m} = u_{m}$, que le terme $n = 1$ vaut $u_{1}$, et qu'il reste $-Nu_{N+1}$. Par la question 1, $Nu_{N+1} = \frac{N}{N + 1}(N + 1)u_{N+1}$ tend vers $0$, donc les sommes partielles tendent vers $S$. 
    $$\boxed{\sum n(u_{n} - u_{n+1}) \text{ converge, et } \sum_{n=1}^{+\infty} n(u_{n} - u_{n+1}) = \sum_{n=1}^{+\infty} u_{n}}$$
     Pour $u_{n} = \frac{1}{n^{2}}$, on a $n(u_{n} - u_{n+1}) = \frac{2n + 1}{n(n + 1)^{2}}$, et la somme de cette série vaut donc $\frac{\pi^{2}}{6}$, ce que confirme le calcul numérique ✓.

    *À retenir.* Le calcul de la question 3 est une « intégration par parties discrète », appelée transformation d'Abel : il fait passer la différence de $u$ sur le facteur $n$, au prix d'un terme de bord $Nu_{N+1}$, et c'est la question 1 qui l'élimine. On voit ainsi que les deux questions ne sont pas indépendantes : sans le résultat $nu_{n} \to 0$, l'égalité des deux sommes pourrait être fausse. Réciproquement, si $(u_{n})$ décroît vers $0$ et si $\sum n(u_{n} - u_{n+1})$ converge, alors $\sum u_{n}$ converge : par la proposition 4, $u_{N} = \sum_{n=N}^{+\infty} (u_{n} - u_{n+1})$, donc $Nu_{N} \leqslant \sum_{n=N}^{+\infty} n(u_{n} - u_{n+1})$, reste d'une série convergente, qui tend vers $0$ (proposition 3), et l'identité de la question 3 conclut.
- id: "ma-20-19"
  feuille: "f-ma-20"
  numero: 19
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries à termes positifs, séries de Riemann]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 19
  enonce: |
    *Une condensation.* Soit $(a_{n})_{n \geqslant 1}$ une suite réelle décroissante de limite nulle.

    **1.** Montrer que les séries $\sum_{n \geqslant 1} a_{n}$ et $\sum_{p \geqslant 0} 2^{p}a_{2^{p}}$ sont de même nature.

    **2.** Retrouver ainsi la nature des séries de Riemann, puis déterminer, selon le réel $\alpha$, la nature de la série $\sum_{n \geqslant 3} \frac{1}{n\ln n\,(\ln\ln n)^{\alpha}}$.

    **3.** On suppose que $\sum a_{n}$ diverge. Montrer que la série $\sum_{n \geqslant 1} \min\big(a_{n}, \frac{1}{n}\big)$ diverge.
  corrige: |
    **1.** La suite $(a_{n})$ décroît vers $0$ : ses termes sont positifs, et les deux séries sont à termes positifs. On découpe $\mathbb{N}^{*}$ en blocs dyadiques $[\![2^{p}\,;2^{p+1} - 1]\!]$, qui contiennent chacun $2^{p}$ entiers. Sur le bloc d'indice $p$, la décroissance donne $a_{2^{p+1}} \leqslant a_{n} \leqslant a_{2^{p}}$, d'où, en sommant les $2^{p}$ termes, 
    $$2^{p}a_{2^{p+1}} \leqslant \sum_{n=2^{p}}^{2^{p+1} - 1} a_{n} \leqslant 2^{p}a_{2^{p}}.$$
     On note $S_{N} = \sum_{n=1}^{N} a_{n}$ et $T_{P} = \sum_{p=0}^{P} 2^{p}a_{2^{p}}$. En sommant ces encadrements pour $p$ allant de $0$ à $P$, la relation de Chasles donne 
    $$\frac{1}{2}\big(T_{P+1} - a_{1}\big) = \frac{1}{2}\sum_{p=0}^{P} 2^{p+1}a_{2^{p+1}} \leqslant S_{2^{P+1} - 1} \leqslant T_{P}.$$
     Si $\sum 2^{p}a_{2^{p}}$ converge, ses sommes partielles sont majorées par un réel $M$ (proposition 5). Tout entier $N$ vérifie $N \leqslant 2^{P+1} - 1$ pour un $P$ convenable, et la suite $(S_{N})$ est croissante, donc 
    $$S_{N} \leqslant S_{2^{P+1} - 1} \leqslant T_{P} \leqslant M \, ;$$
     la série $\sum a_{n}$ converge par la proposition 5. Réciproquement, si $\sum a_{n}$ converge, de somme $S$, l'inégalité de gauche donne $T_{P+1} \leqslant a_{1} + 2S$ pour tout $P$, et $\sum 2^{p}a_{2^{p}}$ converge. 
    $$\boxed{\sum_{n \geqslant 1} a_{n} \ \text{ et } \ \sum_{p \geqslant 0} 2^{p}a_{2^{p}} \ \text{ sont de même nature}}$$
     Le résultat subsiste si $(a_{n})$ n'est décroissante qu'à partir d'un rang $n_{0}$ : on ne somme alors les encadrements que pour $2^{p} \geqslant n_{0}$, et les termes laissés de côté, en nombre fini, ne changent la nature d'aucune des deux séries. C'est sous cette forme qu'on l'emploie dans la question suivante.

    **2.** *Séries de Riemann.* Si $\alpha \leqslant 0$, le terme $\frac{1}{n^{\alpha}}$ ne tend pas vers $0$, et la série diverge grossièrement. Si $\alpha > 0$, la suite $a_{n} = \frac{1}{n^{\alpha}}$ décroît vers $0$, et la série condensée a pour terme général 
    $$2^{p}a_{2^{p}} = \frac{2^{p}}{2^{p\alpha}} = \big(2^{1 - \alpha}\big)^{p}.$$
     C'est une série géométrique, convergente si et seulement si $2^{1 - \alpha} < 1$, c'est-à-dire $\alpha > 1$ (théorème 1). 
    $$\boxed{\sum \frac{1}{n^{\alpha}} \text{ converge} \iff \alpha > 1}$$
     On retrouve le théorème 5 sans aucune intégrale : la condensation remplace la comparaison avec $\int_{1}^{n} \frac{\mathrm{d} t}{t^{\alpha}}$ par une comparaison avec une série géométrique.

    *La série $\sum \frac{1}{n\ln n\,(\ln\ln n)^{\alpha}}$.* Pour $t \geqslant 3$, on a $\ln\ln t > 0$. Le logarithme du dénominateur est la fonction $g$ définie par 
    $$g(t) = \ln t + \ln\ln t + \alpha\ln\ln\ln t, \qquad g'(t) = \frac{1}{t}\Big(1 + \frac{1}{\ln t} + \frac{\alpha}{\ln t\,\ln\ln t}\Big),$$
     et sa dérivée est strictement positive pour $t$ assez grand, quel que soit le signe de $\alpha$, puisque la parenthèse tend vers $1$. Le terme $a_{n} = \frac{1}{n\ln n\,(\ln\ln n)^{\alpha}}$ décroît donc à partir d'un certain rang, et il tend vers $0$, car $\ln(n\ln n\,(\ln\ln n)^{\alpha}) = g(n) \sim \ln n$ tend vers $+\infty$. La question 1 s'applique (on attribue à $a_{1}$ et $a_{2}$ des valeurs positives quelconques). Pour $p \geqslant 2$, on a $\ln 2^{p} = p\ln 2$ et 
    $$2^{p}a_{2^{p}} = \frac{2^{p}}{2^{p} \cdot p\ln 2 \cdot \big(\ln p + \ln\ln 2\big)^{\alpha}} \sim \frac{1}{\ln 2} \cdot \frac{1}{p\,(\ln p)^{\alpha}},$$
     puisque $\ln p + \ln\ln 2 \sim \ln p$ et que l'on peut élever un équivalent à la puissance $\alpha$ (chapitre 10, théorème 1). Par le théorème 4, la série condensée a la nature de $\sum_{p \geqslant 2} \frac{1}{p\,(\ln p)^{\alpha}}$, que l'on condense à son tour : son terme est décroissant à partir d'un certain rang (même calcul de dérivée) et tend vers $0$, et pour $q \geqslant 1$, 
    $$2^{q} \cdot \frac{1}{2^{q}\,(\ln 2^{q})^{\alpha}} = \frac{1}{(\ln 2)^{\alpha}} \cdot \frac{1}{q^{\alpha}},$$
     terme d'une série de Riemann, convergente si et seulement si $\alpha > 1$. 
    $$\boxed{\sum_{n \geqslant 3} \frac{1}{n\ln n\,(\ln\ln n)^{\alpha}} \text{ converge} \iff \alpha > 1, \qquad \sum_{p \geqslant 2} \frac{1}{p\,(\ln p)^{\alpha}} \text{ converge} \iff \alpha > 1}$$
     Chaque condensation « enlève un logarithme » : $n$ devient $2^{p}$, $\ln n$ devient $p\ln 2$, $\ln\ln n$ devient $\ln p$ à une constante près. Pour $\alpha = 0$, on retrouve la divergence de $\sum \frac{1}{n\ln n}$ établie dans le cours (section 20.3.3) par comparaison avec une intégrale.

    **3.** La suite $b_{n} = \min\big(a_{n}, \frac{1}{n}\big)$ est le minimum de deux suites décroissantes de limite nulle : elle est décroissante (si $n \leqslant m$, on a $b_{m} \leqslant a_{m} \leqslant a_{n}$ et $b_{m} \leqslant \frac{1}{m} \leqslant \frac{1}{n}$), positive et de limite nulle. La question 1 s'applique à $(b_{n})$, et 
    $$2^{p}b_{2^{p}} = \min\big(2^{p}a_{2^{p}}, 1\big).$$
     Par la question 1, la série $\sum 2^{p}a_{2^{p}}$ diverge. Deux cas se présentent.

    • Si $2^{p}a_{2^{p}} \geqslant 1$ pour une infinité d'entiers $p$, le terme $2^{p}b_{2^{p}}$ vaut $1$ pour une infinité de $p$ : il ne tend pas vers $0$, et la série condensée diverge grossièrement.

    • Sinon, $2^{p}b_{2^{p}} = 2^{p}a_{2^{p}}$ à partir d'un certain rang, et la série condensée diverge comme $\sum 2^{p}a_{2^{p}}$.

    Dans les deux cas, $\sum 2^{p}b_{2^{p}}$ diverge, donc $\sum b_{n}$ aussi, par la question 1. 
    $$\boxed{\sum a_{n} \text{ diverge} \implies \sum \min\Big(a_{n}, \frac{1}{n}\Big) \text{ diverge}}$$
     *Piège.* L'hypothèse de décroissance est indispensable. Pour $a_{n} = 1$ si $n$ est un carré et $a_{n} = 0$ sinon, la série $\sum a_{n}$ diverge grossièrement, mais $\min\big(a_{n}, \frac{1}{n}\big)$ vaut $\frac{1}{k^{2}}$ si $n = k^{2}$ et $0$ sinon : ses sommes partielles sont majorées par $\frac{\pi^{2}}{6}$, et la série converge. La même suite lacunaire est au cœur de l'exercice 8, où elle montrait que $nu_{n}$ peut ne pas tendre vers $0$ ; l'erreur la plus répandue est de croire qu'une série divergente l'est « parce que ses termes sont gros partout ».
- id: "ma-20-20"
  feuille: "f-ma-20"
  numero: 20
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 21
  enonce: |
    Soit $\sigma : \mathbb{N}^{*} \to \mathbb{N}^{*}$ une bijection. Déterminer la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{\sigma(n)}{n^{2}}$. On pourra minorer les sommes $\sum_{n=N+1}^{2N} \frac{\sigma(n)}{n^{2}}$.
  corrige: |
    Les termes $\frac{\sigma(n)}{n^{2}}$ sont strictement positifs. Soit $N \geqslant 1$. Pour $N + 1 \leqslant n \leqslant 2N$, on a $\frac{1}{n^{2}} \geqslant \frac{1}{4N^{2}}$, donc 
    $$\sum_{n=N+1}^{2N} \frac{\sigma(n)}{n^{2}} \geqslant \frac{1}{4N^{2}}\sum_{n=N+1}^{2N} \sigma(n).$$
     Comme $\sigma$ est injective, les $N$ entiers $\sigma(N + 1)$, …, $\sigma(2N)$ sont des entiers naturels non nuls deux à deux distincts. Rangés dans l'ordre croissant, ils s'écrivent $m_{1} < m_{2} < \dots < m_{N}$, et une récurrence immédiate donne $m_{i} \geqslant i$ : leur somme est au moins $1 + 2 + \dots + N = \frac{N(N + 1)}{2}$. Ainsi 
    $$\boxed{\sum_{n=N+1}^{2N} \frac{\sigma(n)}{n^{2}} \geqslant \frac{N(N + 1)}{8N^{2}} \geqslant \frac{1}{8} \quad\text{pour tout } N \geqslant 1}$$
     Si la série convergeait, de somme $S$, ses sommes partielles $S_{N}$ tendraient vers $S$, ainsi que la suite extraite $(S_{2N})$, et la différence $S_{2N} - S_{N}$, qui est la somme ci-dessus, tendrait vers $0$. C'est impossible, puisqu'elle reste supérieure à $\frac{1}{8}$. 
    $$\boxed{\sum_{n \geqslant 1} \frac{\sigma(n)}{n^{2}} \text{ diverge, quelle que soit la bijection } \sigma}$$
     Pour $\sigma = \mathrm{id}$, c'est la série harmonique. L'exercice dit qu'aucune façon de réordonner les entiers ne peut rendre la série convergente : on peut placer de petites valeurs de $\sigma$ sur beaucoup d'indices, mais pas en moyenne, car chaque entier n'est utilisé qu'une fois. On remarquera que l'argument n'utilise que l'injectivité de $\sigma$.

    *Piège.* L'erreur la plus répandue est de majorer ou de minorer terme à terme : on n'a aucune information sur un $\sigma(n)$ isolé, qui peut valoir $1$ pour un $n$ immense. Seule une somme de termes consécutifs se contrôle, et c'est pourquoi l'énoncé propose les tranches $[\![N + 1\,;2N]\!]$, comme à l'exercice 18.
- id: "ma-20-21"
  feuille: "f-ma-20"
  numero: 21
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 4
  page_corrige: 22
  enonce: |
    Pour tout $k \in \mathbb{N}$, montrer que la série $\displaystyle\sum_{n \geqslant 0} \frac{n^{k}}{2^{n+1}}$ converge, et que sa somme $S_{k}$ est un nombre entier. On pourra exprimer $S_{k}$ à l'aide de $S_{0}$, …, $S_{k-1}$ en effectuant le changement d'indice $n = m + 1$. Calculer $S_{0}$, …, $S_{4}$.
  corrige: |
    *Convergence.* Pour $k \in \mathbb{N}$, la suite $\frac{n^{k+2}}{2^{n}}$ tend vers $0$ par croissances comparées (chapitre 7, théorème 7), donc 
    $$\frac{n^{k}}{2^{n+1}} = \frac{1}{2} \cdot \frac{n^{k+2}}{2^{n}} \cdot \frac{1}{n^{2}} = o\Big(\frac{1}{n^{2}}\Big).$$
     Le terme est positif, et la série $\sum \frac{1}{n^{2}}$ converge : la série $\sum \frac{n^{k}}{2^{n+1}}$ converge (théorème 3 (iii)).

    *Relation de récurrence.* Soit $k \geqslant 1$. Le terme d'indice $0$ est nul, puisque $0^{k} = 0$, et l'on effectue le changement d'indice $n = m + 1$ sur les sommes partielles, avant de passer à la limite : 
    $$\sum_{n=0}^{N+1} \frac{n^{k}}{2^{n+1}} = \sum_{m=0}^{N} \frac{(m + 1)^{k}}{2^{m+2}} = \frac{1}{2}\sum_{m=0}^{N} \sum_{j=0}^{k} \binom{k}{j}\frac{m^{j}}{2^{m+1}} = \frac{1}{2}\sum_{j=0}^{k} \binom{k}{j}\sum_{m=0}^{N} \frac{m^{j}}{2^{m+1}},$$
     par la formule du binôme et l'interversion de deux sommes finies. Quand $N$ tend vers $+\infty$, chacune des $k + 1$ sommes intérieures tend vers $S_{j}$, et l'on obtient $S_{k} = \frac{1}{2}\sum_{j=0}^{k} \binom{k}{j}S_{j}$. Le terme $j = k$ vaut $\frac{1}{2}S_{k}$ ; on le fait passer à gauche : 
    $$\boxed{S_{k} = \sum_{j=0}^{k-1} \binom{k}{j}S_{j} \quad\text{pour tout } k \geqslant 1}$$
     *Valeurs.* On a $S_{0} = \sum_{n=0}^{+\infty} \frac{1}{2^{n+1}} = \frac{1}{2} \cdot \frac{1}{1 - \frac{1}{2}} = 1$ (théorème 1). Par récurrence forte, si $S_{0}$, …, $S_{k-1}$ sont entiers, $S_{k}$ l'est, comme somme de produits d'entiers : tous les $S_{k}$ sont des entiers naturels. La relation donne successivement 
    $$S_{1} = S_{0} = 1, \qquad S_{2} = S_{0} + 2S_{1} = 3, \qquad S_{3} = S_{0} + 3S_{1} + 3S_{2} = 13,$$

    $$S_{4} = S_{0} + 4S_{1} + 6S_{2} + 4S_{3} = 1 + 4 + 18 + 52 = 75.$$

    $$\boxed{S_{0} = 1, \quad S_{1} = 1, \quad S_{2} = 3, \quad S_{3} = 13, \quad S_{4} = 75}$$
     On contrôle $S_{1} = \sum_{n=0}^{+\infty} \frac{n}{2^{n+1}} = \frac{1}{4}\sum_{m=0}^{+\infty} (m + 1)\Big(\frac{1}{2}\Big)^{m}$ : la somme $\sum_{m=0}^{+\infty} (m + 1)z^{m} = \frac{1}{(1 - z)^{2}}$, obtenue dans le cours par un produit de Cauchy (section 20.7.4), vaut $4$ en $z = \frac{1}{2}$, et $S_{1} = \frac{1}{4} \times 4 = 1$ ✓. Les valeurs suivantes ont été vérifiées numériquement, ainsi que $S_{5} = 541$ et $S_{6} = 4683$.

    *À retenir.* Ces entiers comptent les classements de $k$ concurrents lorsque les ex aequo sont permis : pour deux concurrents A et B, il y a les $3$ classements « A avant B », « B avant A » et « ex aequo ». En effet, si $F_{k}$ désigne ce nombre, avec $F_{0} = 1$, un classement de $k \geqslant 1$ concurrents est déterminé par le groupe non vide des premiers ex aequo, de cardinal $k - j$ avec $0 \leqslant j \leqslant k - 1$, à choisir de $\binom{k}{k - j} = \binom{k}{j}$ façons, puis par un classement des $j$ autres : $F_{k} = \sum_{j=0}^{k-1} \binom{k}{j}F_{j}$. C'est la relation de $S_{k}$, avec la même valeur initiale, donc $F_{k} = S_{k}$ pour tout $k$. Une somme de série qui compte des objets finis : c'est un premier exemple de ce que la seconde année appellera une série génératrice.
- id: "ma-20-22"
  feuille: "f-ma-20"
  numero: 22
  partie: "Séries à termes positifs"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 5
  page_corrige: 23
  enonce: |
    Soit $(u_{n})_{n \geqslant 1}$ une suite injective d'entiers naturels non nuls. Déterminer la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{1}{\mathrm{ppcm}(u_{1}, u_{2}, \dots, u_{n})}$. On pourra montrer qu'un entier $m \geqslant 1$ a au plus $2\sqrt{m}$ diviseurs positifs.
  corrige: |
    *Le lemme.* Soit $m \geqslant 1$. Les diviseurs positifs $d$ de $m$ tels que $d \leqslant \sqrt{m}$ sont des entiers de $[\![1\,;\lfloor \sqrt{m} \rfloor]\!]$ : il y en a au plus $\sqrt{m}$. Si $d$ est un diviseur tel que $d > \sqrt{m}$, alors $\frac{m}{d}$ est un diviseur de $m$ strictement inférieur à $\sqrt{m}$, et l'application $d \mapsto \frac{m}{d}$ est injective : il y a au plus $\sqrt{m}$ diviseurs strictement supérieurs à $\sqrt{m}$. 
    $$\boxed{\text{tout entier } m \geqslant 1 \text{ a au plus } 2\sqrt{m} \text{ diviseurs positifs}}$$
     Par exemple, $12$ a six diviseurs $1$, $2$, $3$, $4$, $6$, $12$, et $2\sqrt{12} \approx 6{,}93$ ✓.

    *Minoration du ppcm.* On note $L_{n} = \mathrm{ppcm}(u_{1}, \dots, u_{n})$. Chacun des $u_{i}$, pour $i \leqslant n$, divise $L_{n}$ (chapitre 12), et ces $n$ entiers sont deux à deux distincts, puisque la suite est injective : $L_{n}$ a au moins $n$ diviseurs positifs. Le lemme donne $n \leqslant 2\sqrt{L_{n}}$, soit 
    $$\boxed{L_{n} \geqslant \frac{n^{2}}{4}, \qquad 0 < \frac{1}{\mathrm{ppcm}(u_{1}, \dots, u_{n})} \leqslant \frac{4}{n^{2}}}$$
     Par comparaison avec la série de Riemann $\sum \frac{4}{n^{2}}$ (théorèmes 3 et 5) : 
    $$\boxed{\sum_{n \geqslant 1} \frac{1}{\mathrm{ppcm}(u_{1}, u_{2}, \dots, u_{n})} \text{ converge}}$$
     *Piège.* L'erreur la plus répandue est de se contenter de $L_{n} \geqslant \max(u_{1}, \dots, u_{n}) \geqslant n$, minoration vraie (une suite injective d'entiers prend au moins une valeur supérieure ou égale à $n$ parmi ses $n$ premiers termes) mais inutile, puisqu'elle compare la série à la série harmonique. Le ppcm est bien plus grand que le maximum, car il « contient » tous les $u_{i}$ à la fois, et le lemme sur les diviseurs traduit exactement cela. L'injectivité est indispensable : pour la suite constante égale à $1$, $L_{n} = 1$ et la série diverge grossièrement.
- id: "ma-20-23"
  feuille: "f-ma-20"
  numero: 23
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs, comparaison série-intégrale, développements asymptotiques]
  noeuds: [as-series, ri-proprietes, as-dl]
  notions: []
  page_enonce: 5
  page_corrige: 23
  enonce: |
    **1.** Montrer que la fonction $x \mapsto \displaystyle\int_{1}^{x} \frac{\sin(\ln t)}{t}\,\mathrm{d} t$ n'a pas de limite en $+\infty$.

    **2.** À l'aide de l'inégalité des accroissements finis, montrer que, quand l'entier $k$ tend vers $+\infty$, 
    $$\frac{\sin(\ln k)}{k} - \int_{k}^{k+1} \frac{\sin(\ln t)}{t}\,\mathrm{d} t = O\Big(\frac{1}{k^{2}}\Big).$$

    **3.** En déduire que la série $\sum_{n \geqslant 1} \frac{\sin(\ln n)}{n}$ diverge.

    **4.** Quelle est la nature de la série $\sum_{n \geqslant 1} \frac{\mathrm{e}^{\mathrm{i}\ln n}}{n}$ ?
  corrige: |
    *Idée.* La fonction $f : t \mapsto \frac{\sin(\ln t)}{t}$ n'est pas monotone, et la proposition 6 ne s'applique pas. Mais sa dérivée est un $O\big(\frac{1}{t^{2}}\big)$ : l'écart entre $f(k)$ et l'intégrale de $f$ sur $[k\,,k + 1]$ est alors le terme d'une série absolument convergente, et la série a la même nature que la suite des intégrales, qui oscille.

    **1.** On reconnaît une dérivée composée de la forme $u'(t)\sin u(t)$ avec $u = \ln$ (c'est le changement de variable $s = \ln t$) : la fonction $t \mapsto -\cos(\ln t)$ a pour dérivée $\frac{\sin(\ln t)}{t}$ sur $]0\,,+\infty[$, et 
    $$\boxed{\int_{1}^{x} \frac{\sin(\ln t)}{t}\,\mathrm{d} t = \big[-\cos(\ln t)\big]_{1}^{x} = 1 - \cos(\ln x) \quad\text{pour } x > 0}$$
     Pour $x_{k} = \mathrm{e}^{2k\pi}$ et $y_{k} = \mathrm{e}^{(2k + 1)\pi}$, deux suites qui tendent vers $+\infty$, cette intégrale vaut respectivement $0$ et $2$. Si elle avait une limite $\ell$ en $+\infty$, la caractérisation séquentielle (chapitre 8, théorème 1) donnerait $\ell = 0$ et $\ell = 2$. 
    $$\boxed{x \mapsto \int_{1}^{x} \frac{\sin(\ln t)}{t}\,\mathrm{d} t \text{ n'a pas de limite en } +\infty}$$

    **2.** La fonction $f$ est dérivable sur $[1\,,+\infty[$, et 
    $$f'(t) = \frac{\cos(\ln t) - \sin(\ln t)}{t^{2}}, \qquad |f'(t)| \leqslant \frac{2}{t^{2}} \leqslant \frac{2}{k^{2}} \quad\text{pour } t \in [k\,,k + 1].$$
     L'inégalité des accroissements finis (chapitre 9, théorème 6 (ii)) donne $|f(k) - f(t)| \leqslant \frac{2}{k^{2}}(t - k)$ pour $t \in [k\,,k + 1]$. Comme l'intervalle est de longueur $1$, on écrit $f(k) = \int_{k}^{k+1} f(k)\,\mathrm{d} t$, et l'inégalité triangulaire pour les intégrales donne 
    $$|d_{k}| = \Big|\int_{k}^{k+1} \big(f(k) - f(t)\big)\,\mathrm{d} t\Big| \leqslant \frac{2}{k^{2}}\int_{k}^{k+1} (t - k)\,\mathrm{d} t = \frac{1}{k^{2}}, \qquad\text{où}\quad d_{k} = \frac{\sin(\ln k)}{k} - \int_{k}^{k+1} \frac{\sin(\ln t)}{t}\,\mathrm{d} t.$$

    $$\boxed{\frac{\sin(\ln k)}{k} - \int_{k}^{k+1} \frac{\sin(\ln t)}{t}\,\mathrm{d} t = O\Big(\frac{1}{k^{2}}\Big), \quad\text{et plus précisément } |d_{k}| \leqslant \frac{1}{k^{2}}}$$

    **3.** Par la question 2 et la proposition 9, la série $\sum d_{k}$ est absolument convergente ; on note $D_{n}$ ses sommes partielles et $D$ sa somme. La relation de Chasles et la question 1 donnent 
    $$\sum_{k=1}^{n} \frac{\sin(\ln k)}{k} = D_{n} + \int_{1}^{n+1} \frac{\sin(\ln t)}{t}\,\mathrm{d} t = D_{n} + 1 - \cos\big(\ln(n + 1)\big).$$
     Si la série $\sum \frac{\sin(\ln n)}{n}$ convergeait, la suite $\big(\cos(\ln(n + 1))\big)$ convergerait, comme différence de deux suites convergentes. Montrons que ce n'est pas le cas. Pour $k \geqslant 1$, posons $n_{k} = \lfloor \mathrm{e}^{2k\pi} \rfloor$ ; alors $n_{k} \leqslant \mathrm{e}^{2k\pi} < n_{k} + 1 \leqslant \mathrm{e}^{2k\pi} + 1$, donc 
    $$0 < \ln(n_{k} + 1) - 2k\pi \leqslant \ln\big(1 + \mathrm{e}^{-2k\pi}\big) \xrightarrow[k \to +\infty]{} 0,$$
     et $\cos(\ln(n_{k} + 1))$ tend vers $\cos 0 = 1$ par continuité du cosinus et $2\pi$-périodicité. De même, avec $m_{k} = \lfloor \mathrm{e}^{(2k + 1)\pi} \rfloor$, la suite $\cos(\ln(m_{k} + 1))$ tend vers $\cos\pi = -1$. Deux suites extraites ayant des limites différentes, la suite $\big(\cos(\ln(n + 1))\big)$ diverge. 
    $$\boxed{\sum_{n \geqslant 1} \frac{\sin(\ln n)}{n} \text{ diverge}}$$
     Plus précisément, la somme partielle d'indice $n$ vaut $1 + D - \cos(\ln(n + 1)) + o(1)$ : elle oscille indéfiniment entre $D$ et $D + 2$, avec $D \approx -0{,}0731$ (valeur obtenue numériquement).

    ![Figure](documents/figures/8126cef492360ff5.svg)

    Les points bleus sont les sommes partielles, placées en fonction de $\ln n$ jusqu'à $n \approx 12\,000$ ; elles suivent la courbe $1 + D - \cos(\ln n)$ et repassent par leur minimum et leur maximum à chaque fois que $\ln n$ augmente de $2\pi$, c'est-à-dire quand $n$ est multiplié par $\mathrm{e}^{2\pi} \approx 535$. La divergence est donc très lente, mais elle est certaine.

    **4.** On applique la même méthode à la fonction complexe $h : t \mapsto \frac{\mathrm{e}^{\mathrm{i}\ln t}}{t}$, en annonçant comme à la question 1 la primitive : $t \mapsto -\mathrm{i}\,\mathrm{e}^{\mathrm{i}\ln t}$ a pour dérivée $-\mathrm{i} \cdot \frac{\mathrm{i}}{t}\,\mathrm{e}^{\mathrm{i}\ln t} = h(t)$. De plus 
    $$h'(t) = \frac{(\mathrm{i} - 1)\,\mathrm{e}^{\mathrm{i}\ln t}}{t^{2}}, \qquad |h'(t)| = \frac{\sqrt{2}}{t^{2}} \leqslant \frac{2}{k^{2}} \quad\text{sur } [k\,,k + 1],$$
     et l'inégalité des accroissements finis pour les fonctions à valeurs complexes (chapitre 9, proposition 6) donne, comme à la question 2, $\big|h(k) - \int_{k}^{k+1} h\big| \leqslant \frac{1}{k^{2}}$. Les écarts $\delta_{k} = h(k) - \int_{k}^{k+1} h$ forment une série absolument convergente, et 
    $$\sum_{k=1}^{n} \frac{\mathrm{e}^{\mathrm{i}\ln k}}{k} = \sum_{k=1}^{n} \delta_{k} + \big[-\mathrm{i}\,\mathrm{e}^{\mathrm{i}\ln t}\big]_{1}^{n+1} = \sum_{k=1}^{n} \delta_{k} + \mathrm{i} - \mathrm{i}\,\mathrm{e}^{\mathrm{i}\ln(n+1)}.$$
     La partie imaginaire de $\mathrm{i}\,\mathrm{e}^{\mathrm{i}\ln(n+1)}$ est $\cos(\ln(n + 1))$, qui n'a pas de limite d'après la question 3 : la suite $\big(\mathrm{e}^{\mathrm{i}\ln(n+1)}\big)$ diverge, et la série aussi. 
    $$\boxed{\sum_{n \geqslant 1} \frac{\mathrm{e}^{\mathrm{i}\ln n}}{n} \text{ diverge}}$$
     On pouvait aussi conclure sans calcul : la partie imaginaire de $\frac{\mathrm{e}^{\mathrm{i}\ln n}}{n}$ est $\frac{\sin(\ln n)}{n}$, et une série complexe dont la série des parties imaginaires diverge diverge elle-même (proposition 1 (iii)). On a $\frac{\mathrm{e}^{\mathrm{i}\ln n}}{n} = \frac{1}{n^{1 - \mathrm{i}}}$ : c'est une série « de Riemann » d'exposant complexe $1 - \mathrm{i}$, de partie réelle $1$, et son terme général a pour module $\frac{1}{n}$.

    *Piège.* L'erreur la plus répandue est d'appliquer la proposition 6 à $f$, qui n'est pas monotone, ou de croire que le terme $\frac{\sin(\ln n)}{n}$ change de signe assez souvent pour que les compensations jouent comme dans une série alternée. Ici le signe est constant sur des plages $[\mathrm{e}^{k\pi}, \mathrm{e}^{(k + 1)\pi}[$ de plus en plus longues, et chaque plage apporte une contribution voisine de $\pm 2$. L'exercice 39 étudiera la série $\sum (-1)^{n}\frac{\sin(\ln n)}{n}$, où le signe alterne vraiment, et qui converge.
- id: "ma-20-24"
  feuille: "f-ma-20"
  numero: 24
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs, comparaison par équivalents, développements asymptotiques]
  noeuds: [as-series, as-comparaison, as-dl]
  notions: []
  page_enonce: 5
  page_corrige: 25
  enonce: |
    *Restes de séries équivalentes.*

    **1.** Soit $\sum u_{n}$ et $\sum v_{n}$ deux séries convergentes à termes strictement positifs telles que $u_{n} \sim v_{n}$. Montrer que leurs restes sont équivalents : $\sum_{k=n+1}^{+\infty} u_{k} \sim \sum_{k=n+1}^{+\infty} v_{k}$.

    **2.** En appliquant la question précédente avec $v_{k} = \frac{1}{\alpha - 1}\big(\frac{1}{k^{\alpha - 1}} - \frac{1}{(k + 1)^{\alpha - 1}}\big)$, retrouver un équivalent de $\sum_{k=n}^{+\infty} \frac{1}{k^{\alpha}}$ pour $\alpha > 1$.

    **3.** On pose $u_{n} = H_{n} - \ln n - \gamma$ pour $n \geqslant 1$. Donner un équivalent de $u_{n} - u_{n+1}$, et en déduire un équivalent de $u_{n}$. Montrer enfin que 
    $$H_{n} = \ln n + \gamma + \frac{1}{2n} - \frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big).$$
  corrige: |
    **1.** On note $R_{n}(u) = \sum_{k=n+1}^{+\infty} u_{k}$ et $R_{n}(v) = \sum_{k=n+1}^{+\infty} v_{k}$ ; ces restes existent (proposition 3) et $R_{n}(v) > 0$, puisque les $v_{k}$ sont strictement positifs. Soit $\varepsilon \in \,]0\,,1[$. Comme $\frac{u_{k}}{v_{k}}$ tend vers $1$, il existe un rang $N$ tel que, pour tout $k \geqslant N$, 
    $$(1 - \varepsilon)v_{k} \leqslant u_{k} \leqslant (1 + \varepsilon)v_{k}.$$
     Pour $n \geqslant N$, on somme ces inégalités pour $k$ allant de $n + 1$ à $m$, puis on fait tendre $m$ vers $+\infty$ (chapitre 7, théorème 5) : 
    $$(1 - \varepsilon)R_{n}(v) \leqslant R_{n}(u) \leqslant (1 + \varepsilon)R_{n}(v), \qquad\text{soit}\qquad \Big|\frac{R_{n}(u)}{R_{n}(v)} - 1\Big| \leqslant \varepsilon.$$

    $$\boxed{u_{n} \sim v_{n},\ u_{n},\, v_{n} > 0,\ \sum v_{n} \text{ convergente} \implies \sum_{k=n+1}^{+\infty} u_{k} \sim \sum_{k=n+1}^{+\infty} v_{k}}$$
     Comme les restes ne font intervenir que les termes d'indice supérieur à $n$, le résultat subsiste si les suites ne sont strictement positives qu'à partir d'un certain rang : on l'applique aux suites décalées. C'est le pendant, pour les restes de séries convergentes, du résultat sur les sommes partielles de séries divergentes de l'exercice 11 de la feuille du chapitre 10.

    **2.** Soit $\alpha > 1$. La série $\sum v_{k}$ est télescopique : pour $N \geqslant n$, 
    $$\sum_{k=n}^{N} v_{k} = \frac{1}{\alpha - 1}\Big(\frac{1}{n^{\alpha-1}} - \frac{1}{(N + 1)^{\alpha-1}}\Big) \xrightarrow[N \to +\infty]{} \frac{1}{(\alpha - 1)n^{\alpha-1}},$$
     puisque $\alpha - 1 > 0$. Par ailleurs, le développement $(1 + x)^{1-\alpha} = 1 + (1 - \alpha)x + o(x)$ en $0$ (chapitre 10) donne 
    $$v_{k} = \frac{1}{(\alpha - 1)k^{\alpha-1}}\Big(1 - \Big(1 + \frac{1}{k}\Big)^{1-\alpha}\Big) = \frac{1}{(\alpha - 1)k^{\alpha-1}}\Big(\frac{\alpha - 1}{k} + o\Big(\frac{1}{k}\Big)\Big) \sim \frac{1}{k^{\alpha}}.$$
     Les deux suites sont strictement positives ($t \mapsto t^{1-\alpha}$ est strictement décroissante), et la question 1, appliquée au rang $n - 1$, donne 
    $$\boxed{\sum_{k=n}^{+\infty} \frac{1}{k^{\alpha}} \sim \sum_{k=n}^{+\infty} v_{k} = \frac{1}{(\alpha - 1)n^{\alpha-1}}}$$
     C'est l'équivalent du théorème 5, puisque $\sum_{k=n}^{+\infty} \frac{1}{k^{\alpha}} = R_{n-1}$ et que $(n - 1)^{\alpha-1} \sim n^{\alpha-1}$. On l'obtient ici sans intégrale : $v_{k}$ est l'accroissement d'une primitive de $t^{-\alpha}$, ce qui est une façon discrète de comparer la série à l'intégrale.

    **3.** *Premier terme.* On a $u_{n} - u_{n+1} = (H_{n} - H_{n+1}) + \ln(n + 1) - \ln n = \ln\Big(1 + \frac{1}{n}\Big) - \frac{1}{n + 1}$. Les développements 
    $$\ln\Big(1 + \frac{1}{n}\Big) = \frac{1}{n} - \frac{1}{2n^{2}} + \frac{1}{3n^{3}} + O\Big(\frac{1}{n^{4}}\Big), \qquad \frac{1}{n + 1} = \frac{1}{n} \cdot \frac{1}{1 + \frac{1}{n}} = \frac{1}{n} - \frac{1}{n^{2}} + \frac{1}{n^{3}} + O\Big(\frac{1}{n^{4}}\Big)$$
     donnent 
    $$\boxed{u_{n} - u_{n+1} = \frac{1}{2n^{2}} - \frac{2}{3n^{3}} + O\Big(\frac{1}{n^{4}}\Big) \sim \frac{1}{2n^{2}}}$$
     Ce terme est strictement positif : $\ln\big(1 + \frac{1}{n}\big) = \int_{n}^{n+1} \frac{\mathrm{d} t}{t}$, et la fonction continue $t \mapsto \frac{1}{t} - \frac{1}{n + 1}$ est positive sur $[n\,,n + 1]$ et non nulle, donc d'intégrale strictement positive (chapitre 18, théorème 4) ; c'est la version stricte de l'encadrement lu sur la figure de la section 20.3.2. Comme $u_{n}$ tend vers $0$ (proposition 7), la série télescopique $\sum (u_{k} - u_{k+1})$ converge et $\sum_{k=n}^{+\infty} (u_{k} - u_{k+1}) = u_{n} - \lim u = u_{n}$ (proposition 4). Les questions 1 et 2, avec $\alpha = 2$, donnent 
    $$u_{n} = \sum_{k=n}^{+\infty} (u_{k} - u_{k+1}) \sim \sum_{k=n}^{+\infty} \frac{1}{2k^{2}} \sim \frac{1}{2n}, \qquad \boxed{H_{n} - \ln n - \gamma \sim \frac{1}{2n}}$$
     *Terme suivant.* On pose $w_{n} = u_{n} - \frac{1}{2n}$, qui tend vers $0$. Comme 
    $$\frac{1}{2n} - \frac{1}{2(n + 1)} = \frac{1}{2n(n + 1)} = \frac{1}{2n^{2}} - \frac{1}{2n^{3}} + O\Big(\frac{1}{n^{4}}\Big),$$
     on obtient 
    $$w_{n} - w_{n+1} = (u_{n} - u_{n+1}) - \frac{1}{2n(n + 1)} = -\frac{2}{3n^{3}} + \frac{1}{2n^{3}} + O\Big(\frac{1}{n^{4}}\Big) = -\frac{1}{6n^{3}} + O\Big(\frac{1}{n^{4}}\Big).$$
     La suite $w_{n+1} - w_{n} \sim \frac{1}{6n^{3}}$ est strictement positive à partir d'un certain rang ; la question 1 (sous la forme décalée) et la question 2 avec $\alpha = 3$ donnent 
    $$-w_{n} = \sum_{k=n}^{+\infty} (w_{k+1} - w_{k}) \sim \sum_{k=n}^{+\infty} \frac{1}{6k^{3}} \sim \frac{1}{6} \cdot \frac{1}{2n^{2}} = \frac{1}{12n^{2}}.$$
     Ainsi $w_{n} = -\frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big)$, ce qui s'écrit 
    $$\boxed{H_{n} = \ln n + \gamma + \frac{1}{2n} - \frac{1}{12n^{2}} + o\Big(\frac{1}{n^{2}}\Big)}$$
     Pour $n = 1\,000$, on calcule $n^{2}\Big(H_{n} - \ln n - \gamma - \frac{1}{2n}\Big) \approx -0{,}0833333$, très proche de $-\frac{1}{12}$ ✓. La remarque qui suit la proposition 7 avait deviné le terme $\frac{1}{2n}$ sur l'écart observé pour $n = 1\,000$ ; l'exercice le démontre et va un cran plus loin.

    *À retenir.* La méthode est générale : pour obtenir le développement asymptotique d'une suite qui tend vers $0$, on développe ses accroissements, qui sont souvent explicites, puis on « resomme » les restes à l'aide de la question 1. L'erreur la plus répandue est de sommer des équivalents sans vérifier le signe : la question 1 exige des termes positifs, et c'est pourquoi on a travaillé avec $w_{n+1} - w_{n}$, positif, plutôt qu'avec $w_{n} - w_{n+1}$. En continuant, on trouverait que le terme suivant est $\frac{1}{120n^{4}}$ (il n'y a pas de terme en $\frac{1}{n^{3}}$), ce que confirme le calcul numérique.
- id: "ma-20-25"
  feuille: "f-ma-20"
  numero: 25
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [séries à termes positifs, comparaison par équivalents]
  noeuds: [as-series, as-comparaison]
  notions: []
  page_enonce: 5
  page_corrige: 27
  enonce: |
    Pour tout $n \geqslant 2$, on pose $\displaystyle u_{n} = \prod_{k=2}^{n} \big(2 - 3^{1/k}\big)$.

    **1.** Montrer que la suite $(u_{n})_{n \geqslant 2}$ converge.

    **2.** Déterminer sa limite, en étudiant la série de terme général $\ln\big(2 - 3^{1/k}\big)$.

    **3.** Montrer qu'il existe un réel $\alpha > 0$ tel que $u_{n} \sim \dfrac{\alpha}{n^{\ln 3}}$.
  corrige: |
    **1.** Pour $k \geqslant 2$, on a $0 < \frac{1}{k} \leqslant \frac{1}{2}$, donc $1 < 3^{1/k} \leqslant \sqrt{3} < 2$, et le facteur $2 - 3^{1/k}$ appartient à $]0\,,1[$. Ainsi $u_{n} > 0$ et $\frac{u_{n+1}}{u_{n}} = 2 - 3^{1/(n+1)} < 1$ : la suite $(u_{n})$ est décroissante et minorée par $0$. 
    $$\boxed{(u_{n})_{n \geqslant 2} \text{ converge, par le théorème de la limite monotone (chapitre 7, théorème 8)}}$$

    **2.** Comme $u_{n} > 0$, on peut écrire $\ln u_{n} = \sum_{k=2}^{n} \ln\big(2 - 3^{1/k}\big)$. Avec $3^{1/k} = \mathrm{e}^{(\ln 3)/k} = 1 + \frac{\ln 3}{k} + O\Big(\frac{1}{k^{2}}\Big)$, puis $\ln(1 + x) = x + O(x^{2})$, 
    $$2 - 3^{1/k} = 1 - \frac{\ln 3}{k} + O\Big(\frac{1}{k^{2}}\Big), \qquad \boxed{\ln\big(2 - 3^{1/k}\big) = -\frac{\ln 3}{k} + O\Big(\frac{1}{k^{2}}\Big) \sim -\frac{\ln 3}{k}}$$
     Le terme $-\ln(2 - 3^{1/k})$ est positif et équivalent à $\frac{\ln 3}{k}$ : par le théorème 4, la série $\sum -\ln(2 - 3^{1/k})$ diverge, et, ses termes étant positifs, ses sommes partielles tendent vers $+\infty$ (proposition 5). Ainsi $\ln u_{n}$ tend vers $-\infty$. 
    $$\boxed{\lim_{n \to +\infty} u_{n} = 0}$$

    **3.** On sépare la partie divergente de la série. Le terme $a_{k} = \ln\big(2 - 3^{1/k}\big) + \frac{\ln 3}{k}$ est un $O\Big(\frac{1}{k^{2}}\Big)$ : la série $\sum_{k \geqslant 2} a_{k}$ est absolument convergente (proposition 9) ; on note $A$ sa somme. Avec $H_{n} = \ln n + \gamma + o(1)$ (proposition 7), 
    $$\ln u_{n} = \sum_{k=2}^{n} a_{k} - \ln 3\,(H_{n} - 1) = \sum_{k=2}^{n} a_{k} - \ln 3 \cdot \ln n + \ln 3\,(1 - \gamma) + o(1).$$
     Ainsi $\ln\big(n^{\ln 3}u_{n}\big) = \ln u_{n} + \ln 3 \cdot \ln n$ tend vers $A + \ln 3\,(1 - \gamma)$, et, par continuité de l'exponentielle, 
    $$\boxed{u_{n} \sim \frac{\alpha}{n^{\ln 3}}, \qquad \alpha = \exp\Big(\ln 3\,(1 - \gamma) + \sum_{k=2}^{+\infty} \Big(\ln\big(2 - 3^{1/k}\big) + \frac{\ln 3}{k}\Big)\Big) > 0}$$
     Numériquement, $A \approx -1{,}39718$ et $\alpha \approx 0{,}39349$ ; le produit $n^{\ln 3}u_{n}$ calculé directement pour $n = 10^{6}$ vaut $0{,}393487$ ✓.

    *Piège.* L'erreur la plus répandue est de déduire un équivalent de $u_{n}$ d'un équivalent de $\ln u_{n}$. On a bien $\ln u_{n} \sim -\ln 3 \cdot \ln n = \ln\big(n^{-\ln 3}\big)$, mais cela ne donne pas $u_{n} \sim n^{-\ln 3}$ : il faut connaître $\ln u_{n}$ à $o(1)$ près, et non à $o(\ln n)$ près (chapitre 10). C'est tout le rôle de la série $\sum a_{k}$, qui fournit la constante $A$. Comme $\ln 3 \approx 1{,}0986 > 1$, on obtient au passage que la série $\sum u_{n}$ converge.
- id: "ma-20-26"
  feuille: "f-ma-20"
  numero: 26
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs, convergence absolue, "constante d'Euler et Stirling", développements asymptotiques]
  noeuds: [as-series, as-dl]
  notions: [serie-absolument-convergente]
  page_enonce: 5
  page_corrige: 28
  enonce: |
    Soit $(u_{n})_{n \geqslant 1}$ une suite de réels strictement positifs.

    **1.** On suppose qu'il existe un réel $\alpha$ tel que $\dfrac{u_{n+1}}{u_{n}} = 1 - \dfrac{\alpha}{n} + o\Big(\dfrac{1}{n}\Big)$. Montrer que la série $\sum u_{n}$ converge si $\alpha > 1$ et diverge si $\alpha < 1$. On pourra comparer $\frac{u_{n+1}}{u_{n}}$ à $\big(\frac{n}{n + 1}\big)^{\beta}$ pour un réel $\beta$ bien choisi. Montrer par deux exemples que l'on ne peut pas conclure si $\alpha = 1$.

    **2.** On suppose qu'il existe un réel $\lambda$ et une suite $(v_{n})$ tels que la série $\sum v_{n}$ soit absolument convergente et que $\dfrac{u_{n+1}}{u_{n}} = 1 - \dfrac{\lambda}{n} + v_{n}$ pour tout $n$. Montrer que la suite $(n^{\lambda}u_{n})$ converge vers un réel strictement positif.

    **3.** En déduire la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{n^{n}}{n!\,\mathrm{e}^{n}}$. Retrouver ce résultat à l'aide de la formule de Stirling.
  corrige: |
    *Idée.* Le rapport $\frac{u_{n+1}}{u_{n}}$ tend vers $1$ et la comparaison géométrique de la remarque de la section 20.4 ne dit rien. On compare alors le rapport à celui d'une série de Riemann, $\frac{(n + 1)^{-\beta}}{n^{-\beta}} = 1 - \frac{\beta}{n} + o\big(\frac{1}{n}\big)$ : c'est le terme en $\frac{1}{n}$ qui départage.

    **1.** *Comparaison des rapports.* Si $\frac{u_{n+1}}{u_{n}} \leqslant \frac{w_{n+1}}{w_{n}}$ pour tout $n \geqslant N$, avec $w_{n} > 0$, alors la suite $\frac{u_{n}}{w_{n}}$ est décroissante à partir du rang $N$, d'où $u_{n} \leqslant \frac{u_{N}}{w_{N}}\,w_{n}$ pour $n \geqslant N$ ; l'inégalité inverse donne de même $u_{n} \geqslant \frac{u_{N}}{w_{N}}\,w_{n}$. On prend $w_{n} = \frac{1}{n^{\beta}}$, pour lequel $\frac{w_{n+1}}{w_{n}} = \Big(1 + \frac{1}{n}\Big)^{-\beta} = 1 - \frac{\beta}{n} + o\Big(\frac{1}{n}\Big)$, de sorte que 
    $$n\Big(\frac{u_{n+1}}{u_{n}} - \frac{w_{n+1}}{w_{n}}\Big) \xrightarrow[n \to +\infty]{} \beta - \alpha.$$

    • Si $\alpha > 1$, on choisit $\beta \in \,]1\,,\alpha[$. La limite $\beta - \alpha$ est strictement négative, donc $\frac{u_{n+1}}{u_{n}} < \frac{w_{n+1}}{w_{n}}$ à partir d'un rang $N$, et $0 < u_{n} \leqslant \frac{C}{n^{\beta}}$ pour $n \geqslant N$, avec $C = N^{\beta}u_{N}$. Comme $\beta > 1$, la série $\sum u_{n}$ converge (théorèmes 3 et 5).

    • Si $\alpha < 1$, on choisit $\beta \in \,]\alpha\,,1[$. La limite est strictement positive, d'où $u_{n} \geqslant \frac{C}{n^{\beta}}$ pour $n \geqslant N$, avec $C > 0$ ; comme $\beta < 1$, la série $\sum u_{n}$ diverge.

    $$\boxed{\frac{u_{n+1}}{u_{n}} = 1 - \frac{\alpha}{n} + o\Big(\frac{1}{n}\Big) : \quad \alpha > 1 \implies \sum u_{n} \text{ converge}, \qquad \alpha < 1 \implies \sum u_{n} \text{ diverge}}$$
     *Le cas $\alpha = 1$.* Pour $u_{n} = \frac{1}{n}$, on a $\frac{u_{n+1}}{u_{n}} = \frac{n}{n + 1} = 1 - \frac{1}{n} + O\Big(\frac{1}{n^{2}}\Big)$, et la série diverge. Pour $u_{n} = \frac{1}{n(\ln n)^{2}}$ ($n \geqslant 2$, et $u_{1} = 1$), on a $\ln(n + 1) = \ln n + \ln\big(1 + \frac{1}{n}\big)$, donc 
    $$\frac{u_{n+1}}{u_{n}} = \frac{n}{n + 1}\Big(1 + \frac{\ln(1 + 1/n)}{\ln n}\Big)^{-2} = \Big(1 - \frac{1}{n} + O\Big(\frac{1}{n^{2}}\Big)\Big)\Big(1 - \frac{2}{n\ln n} + o\Big(\frac{1}{n\ln n}\Big)\Big) = 1 - \frac{1}{n} + o\Big(\frac{1}{n}\Big),$$
     et la série converge : la fonction $t \mapsto \frac{1}{t(\ln t)^{2}}$ est continue, positive et décroissante sur $[2\,,+\infty[$, de primitive $t \mapsto -\frac{1}{\ln t}$, et $\int_{2}^{n} \frac{\mathrm{d} t}{t(\ln t)^{2}} = \frac{1}{\ln 2} - \frac{1}{\ln n} \leqslant \frac{1}{\ln 2}$ ; la proposition 6 (iii) conclut (c'est aussi le cas $\alpha = 2$ de la série $\sum \frac{1}{p(\ln p)^{\alpha}}$ de l'exercice 19). 
    $$\boxed{\alpha = 1 : \ \frac{1}{n} \text{ (divergente) et } \frac{1}{n(\ln n)^{2}} \text{ (convergente) ont tous deux un rapport } 1 - \frac{1}{n} + o\Big(\frac{1}{n}\Big)}$$

    **2.** On pose $x_{n} = \ln(n^{\lambda}u_{n})$ et l'on étudie la série télescopique $\sum (x_{n+1} - x_{n})$ (proposition 4). Comme $u_{n} > 0$, le nombre $1 + h_{n}$, avec $h_{n} = -\frac{\lambda}{n} + v_{n}$, est strictement positif, et 
    $$x_{n+1} - x_{n} = \lambda\ln\Big(1 + \frac{1}{n}\Big) + \ln(1 + h_{n}).$$
     La suite $(h_{n})$ tend vers $0$, puisque $v_{n}$ tend vers $0$ (proposition 2). Par l'inégalité de Taylor-Lagrange (chapitre 18, théorème 8) appliquée à $\ln(1 + \cdot)$, dont la dérivée seconde est majorée par $4$ en valeur absolue sur $\big[-\frac{1}{2}\,,\frac{1}{2}\big]$, on a $|\ln(1 + h) - h| \leqslant 2h^{2}$ pour $|h| \leqslant \frac{1}{2}$. Pour $n$ assez grand, $|h_{n}| \leqslant \frac{1}{2}$ et $|v_{n}| \leqslant 1$, donc $h_{n}^{2} \leqslant \frac{2\lambda^{2}}{n^{2}} + 2v_{n}^{2} \leqslant \frac{2\lambda^{2}}{n^{2}} + 2|v_{n}|$. De même $\lambda\ln\big(1 + \frac{1}{n}\big) = \frac{\lambda}{n} + O\big(\frac{1}{n^{2}}\big)$. En regroupant, le terme $\frac{\lambda}{n}$ disparaît : 
    $$x_{n+1} - x_{n} = v_{n} + O\Big(\frac{1}{n^{2}}\Big) + O\big(h_{n}^{2}\big), \qquad |x_{n+1} - x_{n}| \leqslant 5|v_{n}| + \frac{M}{n^{2}} \ \text{ pour } n \text{ assez grand},$$
     pour une constante $M$. La série à termes positifs $\sum \big(5|v_{n}| + \frac{M}{n^{2}}\big)$ converge : la série $\sum (x_{n+1} - x_{n})$ est absolument convergente, donc convergente, et la suite $(x_{n})$ converge vers un réel $L$ (proposition 4). Par continuité de l'exponentielle : 
    $$\boxed{n^{\lambda}u_{n} = \mathrm{e}^{x_{n}} \xrightarrow[n \to +\infty]{} \mathrm{e}^{L} > 0, \qquad\text{c'est-à-dire}\qquad u_{n} \sim \frac{\mathrm{e}^{L}}{n^{\lambda}}}$$
     Le résultat est plus fort que celui de la question 1 : il donne un équivalent, et tranche donc aussi le cas $\lambda = 1$ lorsque le reste est absolument sommable, la série divergeant alors comme la série harmonique. Les deux exemples du cas $\alpha = 1$ ne contredisent rien : pour $\frac{1}{n(\ln n)^{2}}$, on a $|v_{n}| \sim \frac{2}{n\ln n}$, qui n'est pas le terme général d'une série absolument convergente.

    **3.** Pour $u_{n} = \frac{n^{n}}{n!\,\mathrm{e}^{n}}$, on a 
    $$\frac{u_{n+1}}{u_{n}} = \frac{(n + 1)^{n+1}}{(n + 1)!\,\mathrm{e}^{n+1}} \cdot \frac{n!\,\mathrm{e}^{n}}{n^{n}} = \frac{1}{\mathrm{e}}\Big(1 + \frac{1}{n}\Big)^{n}.$$
     Avec $n\ln\big(1 + \frac{1}{n}\big) = 1 - \frac{1}{2n} + \frac{1}{3n^{2}} + O\big(\frac{1}{n^{3}}\big)$ et le développement de l'exponentielle, 
    $$\frac{u_{n+1}}{u_{n}} = \exp\Big(-\frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big)\Big) = 1 - \frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big).$$
     La question 2 s'applique avec $\lambda = \frac{1}{2}$ et $v_{n} = O\big(\frac{1}{n^{2}}\big)$, terme d'une série absolument convergente : $\sqrt{n}\,u_{n}$ tend vers un réel $\ell > 0$, et $u_{n} \sim \frac{\ell}{\sqrt{n}}$. Par le théorème 4 et la série de Riemann d'exposant $\frac{1}{2}$ : 
    $$\boxed{\sum_{n \geqslant 1} \frac{n^{n}}{n!\,\mathrm{e}^{n}} \text{ diverge}}$$
     La question 1 suffisait d'ailleurs pour la nature, avec $\alpha = \frac{1}{2} < 1$. *Avec la formule de Stirling* (chapitre 10, théorème 6, et chapitre 18, théorème 10), $n! \sim \sqrt{2\pi n}\,n^{n}\mathrm{e}^{-n}$, d'où 
    $$\boxed{u_{n} \sim \frac{1}{\sqrt{2\pi n}}, \qquad \ell = \frac{1}{\sqrt{2\pi}} \approx 0{,}3989}$$
     et l'on retrouve la divergence. Pour $n = 10^{4}$, on calcule $\sqrt{n}\,u_{n} \approx 0{,}398939$ ✓. La question 2 démontre ainsi la formule de Stirling à la constante près ; c'est exactement l'étape « la suite converge vers un réel strictement positif » de sa démonstration au chapitre 10, la constante $\sqrt{2\pi}$ venant ensuite des intégrales de Wallis (chapitre 18).
- id: "ma-20-27"
  feuille: "f-ma-20"
  numero: 27
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 6
  page_corrige: 30
  enonce: |
    *Il n'existe pas de série de comparaison universelle.*

    **1.** Soit $(\eta_{n})$ une suite de réels strictement positifs de limite nulle. Montrer qu'il existe une série convergente à termes positifs $\sum a_{n}$ telle que $a_{n}$ ne soit pas négligeable devant $\eta_{n}$.

    **2.** Soit $\sum a_{n}$ une série convergente à termes strictement positifs, de restes $R_{n} = \sum_{k=n+1}^{+\infty} a_{k}$. Montrer que $\frac{a_{n}}{\sqrt{R_{n-1}}} \leqslant 2\big(\sqrt{R_{n-1}} - \sqrt{R_{n}}\big)$ pour tout $n \geqslant 1$. En déduire qu'il existe une suite positive $(b_{n})$ de limite $+\infty$ telle que $\sum a_{n}b_{n}$ converge.

    **3.** Soit $\sum a_{n}$ une série divergente à termes strictement positifs, de sommes partielles $S_{n}$. Montrer que $\sum_{n \geqslant 1} \frac{a_{n}}{S_{n}}$ diverge, en minorant $\sum_{k=n+1}^{m} \frac{a_{k}}{S_{k}}$. En déduire qu'il existe une suite positive $(b_{n})$ de limite nulle telle que $\sum a_{n}b_{n}$ diverge.
  corrige: |
    **1.** Comme $\eta_{n}$ tend vers $0$, pour tout $k \in \mathbb{N}$, l'inégalité $\eta_{n} \leqslant 2^{-k}$ est vraie pour tous les $n$ assez grands. On construit ainsi par récurrence des indices $n_{0} < n_{1} < n_{2} < \cdots$ tels que $\eta_{n_{k}} \leqslant 2^{-k}$, en choisissant $n_{k}$ plus grand que $n_{k-1}$. On pose alors $a_{n} = \eta_{n}$ si $n$ est l'un des $n_{k}$, et $a_{n} = 0$ sinon. Les termes sont positifs, et, pour tout $N$, la somme $\sum_{n=0}^{N} a_{n}$ est majorée par $\sum_{k \geqslant 0} 2^{-k} = 2$ : la série converge (proposition 5). Mais $\frac{a_{n_{k}}}{\eta_{n_{k}}} = 1$ pour tout $k$, et le rapport $\frac{a_{n}}{\eta_{n}}$ ne tend pas vers $0$. 
    $$\boxed{\text{il existe } \sum a_{n} \text{ convergente, à termes positifs, avec } a_{n} \neq o(\eta_{n})}$$
     Si l'on veut des termes strictement positifs, on remplace les $0$ par $2^{-n}$ : la série converge toujours, et $\frac{a_{n_{k}}}{\eta_{n_{k}}} \geqslant 1$. Ainsi, aussi vite que $\eta_{n}$ tende vers $0$, la convergence d'une série n'impose pas à son terme d'être négligeable devant $\eta_{n}$ ; pour $\eta_{n} = \frac{1}{n}$, c'est ce que montrait l'exercice 8.

    **2.** Les restes $R_{n}$ sont strictement positifs, et $a_{n} = R_{n-1} - R_{n}$ pour $n \geqslant 1$. En multipliant par la quantité conjuguée, et comme $\sqrt{R_{n}} \leqslant \sqrt{R_{n-1}}$, 
    $$2\big(\sqrt{R_{n-1}} - \sqrt{R_{n}}\big) = \frac{2(R_{n-1} - R_{n})}{\sqrt{R_{n-1}} + \sqrt{R_{n}}} \geqslant \frac{2a_{n}}{2\sqrt{R_{n-1}}}, \qquad \boxed{\frac{a_{n}}{\sqrt{R_{n-1}}} \leqslant 2\big(\sqrt{R_{n-1}} - \sqrt{R_{n}}\big)}$$
     On pose $b_{0} = 0$ et $b_{n} = \frac{1}{\sqrt{R_{n-1}}}$ pour $n \geqslant 1$. Comme $R_{n-1}$ tend vers $0$ en restant strictement positif (proposition 3), $b_{n}$ tend vers $+\infty$. Les sommes partielles de la série à termes positifs $\sum a_{n}b_{n}$ se majorent par télescopage : 
    $$\sum_{n=1}^{N} a_{n}b_{n} \leqslant 2\sum_{n=1}^{N} \big(\sqrt{R_{n-1}} - \sqrt{R_{n}}\big) = 2\big(\sqrt{R_{0}} - \sqrt{R_{N}}\big) \leqslant 2\sqrt{R_{0}}.$$

    $$\boxed{b_{n} = \frac{1}{\sqrt{R_{n-1}}} \xrightarrow[n \to +\infty]{} +\infty \quad\text{et}\quad \sum a_{n}b_{n} \text{ converge}}$$
     Pour $a_{n} = \frac{1}{n^{2}}$, on a $R_{n-1} \sim \frac{1}{n}$ (théorème 5), donc $b_{n} \sim \sqrt{n}$ et $a_{n}b_{n} \sim \frac{1}{n^{3/2}}$ : on passe d'une série de Riemann convergente à une autre, plus lente.

    **3.** Les termes étant strictement positifs, $S_{n} \geqslant a_{0} > 0$, et $S_{n}$ tend vers $+\infty$ en croissant (proposition 5). Pour $m > n$, chaque $S_{k}$ avec $n + 1 \leqslant k \leqslant m$ est majoré par $S_{m}$, donc 
    $$\sum_{k=n+1}^{m} \frac{a_{k}}{S_{k}} \geqslant \frac{1}{S_{m}}\sum_{k=n+1}^{m} a_{k} = \frac{S_{m} - S_{n}}{S_{m}} = 1 - \frac{S_{n}}{S_{m}}.$$
     Supposons que $\sum \frac{a_{n}}{S_{n}}$ converge, de sommes partielles $T_{n}$ et de somme $T$. L'inégalité s'écrit 
    $$T_{m} - T_{n} \geqslant 1 - \frac{S_{n}}{S_{m}} \qquad\text{pour } m > n \, ;$$
     à $n$ fixé, on fait tendre $m$ vers $+\infty$ (chapitre 7, théorème 5) et l'on obtient $T - T_{n} \geqslant 1$ pour tout $n$. Or $T - T_{n}$ tend vers $0$ : contradiction. 
    $$\boxed{\sum a_{n} \text{ diverge} \implies \sum_{n \geqslant 1} \frac{a_{n}}{S_{n}} \text{ diverge}}$$
     La suite $b_{n} = \frac{1}{S_{n}}$ est positive, tend vers $0$, et $\sum a_{n}b_{n}$ diverge. 
    $$\boxed{b_{n} = \frac{1}{S_{n}} \xrightarrow[n \to +\infty]{} 0 \quad\text{et}\quad \sum a_{n}b_{n} \text{ diverge}}$$
     Pour $a_{n} = 1$, on a $S_{n} = n + 1$, et l'on retrouve la série harmonique. Pour $a_{n} = \frac{1}{n}$ ($n \geqslant 1$), on a $S_{n} = H_{n} \sim \ln n$, et $\frac{a_{n}}{S_{n}} \sim \frac{1}{n\ln n}$ : c'est la série du cours qui diverge « presque invisiblement ».

    *À retenir.* La question 2 dit qu'il n'existe pas de série convergente « la plus lente », la question 3 qu'il n'existe pas de série divergente « la plus petite ». Aucune famille de séries de référence, aussi riche soit-elle, ne peut donc trancher toutes les natures par comparaison : c'est la conclusion, annoncée dans le cours après le théorème 5, à laquelle conduisaient déjà les séries de l'exercice 19.
- id: "ma-20-28"
  feuille: "f-ma-20"
  numero: 28
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs, comparaison par équivalents]
  noeuds: [as-series, as-comparaison]
  notions: []
  page_enonce: 6
  page_corrige: 31
  enonce: |
    Soit $\sum a_{n}$ une série à termes strictement positifs et $S_{n} = \sum_{k=0}^{n} a_{k}$ sa somme partielle. On suppose que $a_{n}S_{n}$ tend vers $1$ quand $n$ tend vers $+\infty$.

    **1.** Montrer que la série $\sum a_{n}$ diverge et que $a_{n}$ tend vers $0$.

    **2.** Montrer que $S_{n+1} \sim S_{n}$, puis que $S_{n+1}^{2} - S_{n}^{2}$ tend vers $2$.

    **3.** En déduire que $a_{n} \sim \dfrac{1}{\sqrt{2n}}$.

    **4.** Réciproquement, montrer que si $b_{n} \sim \dfrac{1}{\sqrt{2n}}$, alors $b_{n}\sum_{k=1}^{n} b_{k}$ tend vers $1$.
  corrige: |
    **1.** Supposons que $\sum a_{n}$ converge, de somme $S$. Alors $S \geqslant a_{0} > 0$, $a_{n}$ tend vers $0$ (proposition 2) et $S_{n}$ tend vers $S$, donc $a_{n}S_{n}$ tend vers $0 \times S = 0$, et non vers $1$. Ainsi la série diverge ; à termes positifs, ses sommes partielles tendent vers $+\infty$ (proposition 5), et 
    $$\boxed{\sum a_{n} \text{ diverge}, \qquad a_{n} = \frac{a_{n}S_{n}}{S_{n}} \xrightarrow[n \to +\infty]{} \frac{1}{+\infty} = 0}$$

    **2.** On a $S_{n+1} = S_{n} + a_{n+1}$, donc $\frac{S_{n+1}}{S_{n}} = 1 + \frac{a_{n+1}}{S_{n}}$, et $\frac{a_{n+1}}{S_{n}}$ tend vers $0$ puisque $a_{n+1} \to 0$ et $S_{n} \to +\infty$. 
    $$\boxed{S_{n+1} \sim S_{n}}$$
     Ensuite, par l'identité $A^{2} - B^{2} = (A - B)(A + B)$, 
    $$S_{n+1}^{2} - S_{n}^{2} = a_{n+1}(S_{n+1} + S_{n}) = a_{n+1}S_{n+1}\Big(1 + \frac{S_{n}}{S_{n+1}}\Big) \xrightarrow[n \to +\infty]{} 1 \times (1 + 1), \qquad \boxed{\lim_{n \to +\infty} \big(S_{n+1}^{2} - S_{n}^{2}\big) = 2}$$

    **3.** Par le lemme de Cesàro sous la forme des accroissements (chapitre 10, proposition 16), appliqué à la suite $(S_{n}^{2})$, on obtient $\frac{S_{n}^{2}}{n} \to 2$, soit $\frac{S_{n}^{2}}{2n} \to 1$ ; par continuité de la racine carrée, et comme $S_{n} > 0$, $\frac{S_{n}}{\sqrt{2n}} \to 1$. Alors 
    $$a_{n} = \frac{a_{n}S_{n}}{S_{n}} \sim \frac{1}{S_{n}} \sim \frac{1}{\sqrt{2n}}, \qquad \boxed{a_{n} \sim \frac{1}{\sqrt{2n}}, \quad S_{n} \sim \sqrt{2n}}$$

    **4.** Soit $(b_{n})_{n \geqslant 1}$ telle que $b_{n} \sim c_{n}$, avec $c_{n} = \frac{1}{\sqrt{2n}}$, et $B_{n} = \sum_{k=1}^{n} b_{k}$, $C_{n} = \sum_{k=1}^{n} c_{k}$. Par le théorème 5 avec $\alpha = \frac{1}{2}$, 
    $$C_{n} = \frac{1}{\sqrt{2}}\sum_{k=1}^{n} \frac{1}{\sqrt{k}} \sim \frac{1}{\sqrt{2}} \cdot \frac{n^{1/2}}{1/2} = \sqrt{2n}.$$
     Montrons que $B_{n} \sim C_{n}$ ; c'est le résultat de l'exercice 11 de la feuille du chapitre 10, dont on rappelle l'argument. Soit $\varepsilon > 0$, et $N$ tel que $|b_{k} - c_{k}| \leqslant \varepsilon c_{k}$ pour $k > N$. Pour $n > N$, 
    $$|B_{n} - C_{n}| \leqslant |B_{N} - C_{N}| + \sum_{k=N+1}^{n} |b_{k} - c_{k}| \leqslant |B_{N} - C_{N}| + \varepsilon C_{n}.$$
     Comme $C_{n}$ tend vers $+\infty$, on a $|B_{N} - C_{N}| \leqslant \varepsilon C_{n}$ pour $n$ assez grand, et alors $\Big|\frac{B_{n}}{C_{n}} - 1\Big| \leqslant 2\varepsilon$. Ainsi $B_{n} \sim C_{n} \sim \sqrt{2n}$, et 
    $$\boxed{b_{n}\sum_{k=1}^{n} b_{k} \sim \frac{1}{\sqrt{2n}} \cdot \sqrt{2n} = 1, \qquad\text{donc}\qquad \lim_{n \to +\infty} b_{n}\sum_{k=1}^{n} b_{k} = 1}$$
     Les questions 1 à 4 montrent que, pour une suite strictement positive, la condition « $a_{n}S_{n} \to 1$ » équivaut à « $a_{n} \sim \frac{1}{\sqrt{2n}}$ » ; que la somme commence à l'indice $0$ ou $1$ n'importe pas, puisqu'un terme fixe, multiplié par $b_{n} \to 0$, tend vers $0$. Numériquement, la suite définie par $a_{0} = 1$ et $a_{n}S_{n} = 1$ exactement pour $n \geqslant 1$ (soit $a_{n} = \frac{-S_{n-1} + \sqrt{S_{n-1}^{2} + 4}}{2}$) vérifie $a_{n}\sqrt{2n} \approx 1{,}00066$ pour $n = 1\,000$ ✓.

    *Piège.* L'erreur la plus répandue, à la question 3, est d'« intégrer » l'équivalent $a_{n} \sim \frac{1}{S_{n}}$ comme une équation différentielle sans justification. Le passage par $S_{n}^{2}$ est la version discrète de la résolution de $y'y = 1$, et c'est le lemme de Cesàro qui remplace l'intégration : il transforme l'information sur les accroissements $S_{n+1}^{2} - S_{n}^{2}$ en information sur $S_{n}^{2}$.
- id: "ma-20-29"
  feuille: "f-ma-20"
  numero: 29
  partie: "Séries à termes positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries à termes positifs]
  noeuds: [as-series]
  notions: []
  page_enonce: 6
  page_corrige: 32
  enonce: |
    *Sommes partielles « à trous ».* Soit $\sum u_{n}$ une série convergente à termes positifs, de somme $U$, telle que 
    $$u_{n} \leqslant \sum_{k=n+1}^{+\infty} u_{k} \qquad\text{pour tout } n \in \mathbb{N}.$$
     Montrer que, pour tout réel $S \in [0\,,U]$, il existe une partie $A$ de $\mathbb{N}$ telle que $S = \sum_{k \in A} u_{k}$. On pourra construire $A$ en parcourant les entiers dans l'ordre croissant et en retenant $k$ chaque fois que c'est possible sans dépasser $S$. Que donne ce résultat pour $u_{n} = \frac{1}{2^{n+1}}$ ?
  corrige: |
    *Idée.* L'algorithme glouton retient $u_{k}$ chaque fois que la somme reste inférieure ou égale à $S$. S'il refuse une infinité de termes, l'écart à $S$ est majoré par des $u_{k}$ arbitrairement petits ; s'il n'en refuse qu'un nombre fini, l'hypothèse $u_{n} \leqslant R_{n}$ interdit le dernier refus.

    On note $R_{n} = \sum_{k=n+1}^{+\infty} u_{k}$. Soit $S \in [0\,,U]$. On définit par récurrence la partie $A$ et les sommes $T_{k} = \sum_{j \in A,\, j < k} u_{j}$ : on pose $T_{0} = 0$ et, pour tout $k \in \mathbb{N}$, 
    $$k \in A \text{ et } T_{k+1} = T_{k} + u_{k} \ \text{ si } T_{k} + u_{k} \leqslant S, \qquad k \notin A \text{ et } T_{k+1} = T_{k} \ \text{ sinon}.$$
     Par récurrence, $T_{k} \leqslant S$ pour tout $k$. La suite $(T_{k})$ est croissante et majorée par $S$ : elle converge vers un réel $T \leqslant S$. C'est la suite des sommes partielles de la série à termes positifs $\sum_{k} \varepsilon_{k}u_{k}$, où $\varepsilon_{k} = 1$ si $k \in A$ et $0$ sinon, de sorte que $T = \sum_{k \in A} u_{k}$. Il reste à montrer que $T = S$.

    *Premier cas : une infinité d'entiers $k$ n'appartiennent pas à $A$.* Pour un tel $k$, on a $T_{k} + u_{k} > S$, donc $0 \leqslant S - T \leqslant S - T_{k} < u_{k}$. Comme $u_{k}$ tend vers $0$ (proposition 2), le long de ces entiers en nombre infini, on obtient $S - T \leqslant 0$, d'où $T = S$.

    *Second cas : seuls un nombre fini d'entiers n'appartiennent pas à $A$.* S'il n'y en a aucun, $A = \mathbb{N}$ et $T = U \geqslant S$, donc $T = S$. Sinon, soit $m$ le plus grand entier refusé : $T_{m} + u_{m} > S$, et tous les entiers $k > m$ appartiennent à $A$. Alors 
    $$T = T_{m} + \sum_{k=m+1}^{+\infty} u_{k} = T_{m} + R_{m} \geqslant T_{m} + u_{m} > S,$$
     en utilisant l'hypothèse $u_{m} \leqslant R_{m}$. C'est impossible, puisque $T \leqslant S$ : ce sous-cas ne se produit pas. 
    $$\boxed{\text{pour tout } S \in [0\,,U], \text{ il existe } A \subset \mathbb{N} \text{ telle que } S = \sum_{k \in A} u_{k}}$$
     *L'exemple $u_{n} = \frac{1}{2^{n+1}}$.* On a $R_{n} = \sum_{k=n+1}^{+\infty} \frac{1}{2^{k+1}} = \frac{1}{2^{n+1}} = u_{n}$ : l'hypothèse est vérifiée, avec égalité, et $U = 1$. 
    $$\boxed{\text{tout réel } S \in [0\,,1] \text{ s'écrit } S = \sum_{k \in A} \frac{1}{2^{k+1}}, \quad A \subset \mathbb{N}}$$
     C'est l'existence du développement en base $2$ : le chiffre d'indice $k + 1$ après la virgule vaut $1$ si $k \in A$ et $0$ sinon. Par exemple, pour $S = \frac{1}{3}$, l'algorithme retient les entiers impairs, et l'on retrouve $\frac{1}{3} = \sum_{j \geqslant 1} \frac{1}{4^{j}}$, soit $0{,}010101\ldots$ en base $2$. Pour $S = \frac{1}{2}$, il retient $0$ puis plus rien : il fournit le développement propre $0{,}1$, et non $0{,}0111\ldots$

    *Piège.* L'hypothèse $u_{n} \leqslant R_{n}$ ne sert que dans le second cas, mais elle est indispensable. Pour $u_{n} = \frac{2}{3^{n+1}}$, on a $U = 1$ et $R_{0} = \frac{1}{3} < u_{0} = \frac{2}{3}$. Une somme $\sum_{k \in A} u_{k}$ vaut au moins $\frac{2}{3}$ si $0 \in A$, et au plus $R_{0} = \frac{1}{3}$ sinon : aucun réel de $\big]\frac{1}{3}\,,\frac{2}{3}\big[$, par exemple $\frac{1}{2}$, n'est atteint. En répétant l'argument, on obtient l'ensemble triadique de Cantor.
- id: "ma-20-30"
  feuille: "f-ma-20"
  numero: 30
  partie: "Séries absolument convergentes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [convergence absolue]
  noeuds: [as-series]
  notions: [serie-absolument-convergente]
  page_enonce: 6
  page_corrige: 33
  enonce: |
    Soit $\sum u_{n}$, $\sum v_{n}$ et $\sum w_{n}$ trois séries réelles telles que $u_{n} \leqslant v_{n} \leqslant w_{n}$ pour tout $n \in \mathbb{N}$. On suppose que $\sum u_{n}$ et $\sum w_{n}$ convergent. Montrer que $\sum v_{n}$ converge. Peut-on remplacer l'hypothèse par $|v_{n}| \leqslant |w_{n}|$ et la seule convergence de $\sum w_{n}$ ?
  corrige: |
    Pour tout $n$, on a $0 \leqslant v_{n} - u_{n} \leqslant w_{n} - u_{n}$. La série $\sum (w_{n} - u_{n})$ converge par linéarité (proposition 1), donc la série à termes positifs $\sum (v_{n} - u_{n})$ converge (théorème 3), et $\sum v_{n} = \sum \big((v_{n} - u_{n}) + u_{n}\big)$ converge, à nouveau par linéarité. 
    $$\boxed{u_{n} \leqslant v_{n} \leqslant w_{n},\ \sum u_{n} \text{ et } \sum w_{n} \text{ convergentes} \implies \sum v_{n} \text{ converge}}$$
     L'astuce consiste à se ramener à une série à termes positifs en retranchant $u_{n}$ : le théorème 3 ne s'applique pas directement à des termes de signe quelconque, et c'est l'encadrement des deux côtés qui permet ce retour au cas positif.

    *La seconde hypothèse ne suffit pas.* Pour $n \geqslant 1$, prenons $w_{n} = \frac{(-1)^{n}}{n}$ et $v_{n} = \frac{1}{n}$. On a $|v_{n}| = |w_{n}|$, la série $\sum w_{n}$ converge par le critère des séries alternées (théorème 7, la suite $\frac{1}{n}$ décroissant vers $0$), et pourtant $\sum v_{n}$ est la série harmonique, qui diverge. 
    $$\boxed{\text{non : } |v_{n}| \leqslant |w_{n}| \text{ et } \sum w_{n} \text{ convergente n'entraînent pas la convergence de } \sum v_{n}}$$
     *Piège.* L'erreur la plus répandue est d'appliquer le théorème de comparaison à des séries qui ne sont pas à termes positifs. Ce qui est vrai, c'est la proposition 9 : si $|v_{n}| \leqslant |w_{n}|$ et si $\sum w_{n}$ est *absolument* convergente, alors $\sum v_{n}$ est absolument convergente. Le contre-exemple repose précisément sur une série semi-convergente.
- id: "ma-20-31"
  feuille: "f-ma-20"
  numero: 31
  partie: "Séries absolument convergentes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence absolue]
  noeuds: [as-series]
  notions: [serie-absolument-convergente]
  page_enonce: 6
  page_corrige: 33
  enonce: |
    **1.** On note $a_{n}$ la $n$-ième décimale de $\pi$, de sorte que $\pi = 3 + \sum_{n=1}^{+\infty} \frac{a_{n}}{10^{n}}$. Déterminer, selon le réel $x$, la nature de la série $\sum_{n \geqslant 1} a_{n}x^{n}$. On pourra utiliser l'irrationalité de $\pi$, établie à l'exercice 52 de la feuille du chapitre 18.

    **2.** Représenter dans le plan l'ensemble des points $M(x, y)$, avec $y \neq -1$, tels que la série $\displaystyle\sum_{n \geqslant 0} \frac{x^{n}}{1 + y^{n}}$ converge.
  corrige: |
    **1.** Les décimales vérifient $0 \leqslant a_{n} \leqslant 9$.

    • Si $|x| < 1$, alors $|a_{n}x^{n}| \leqslant 9|x|^{n}$, terme d'une série géométrique convergente : la série $\sum a_{n}x^{n}$ est absolument convergente (proposition 9), donc convergente.

    • Si $|x| \geqslant 1$, une infinité de décimales sont non nulles : sinon, $a_{n} = 0$ pour $n > N$, et $\pi = 3 + \sum_{n=1}^{N} \frac{a_{n}}{10^{n}}$ serait un nombre décimal, donc rationnel, ce que contredit l'exercice 52 de la feuille du chapitre 18. Pour chacun de ces indices, $|a_{n}x^{n}| \geqslant 1 \cdot 1 = 1$ : le terme général ne tend pas vers $0$, et la série diverge grossièrement (proposition 2).

    $$\boxed{\sum_{n \geqslant 1} a_{n}x^{n} \text{ converge} \iff |x| < 1, \text{ et la convergence est alors absolue}}$$
     Le seul renseignement utile sur $\pi$ est qu'il n'est pas décimal ; le même raisonnement s'applique à tout réel non décimal, par exemple $\frac{1}{3}$, et, pour un réel décimal, la série est une somme finie qui converge pour tout $x$.

    **2.** On note $u_{n} = \frac{x^{n}}{1 + y^{n}}$, bien défini puisque $y \neq -1$ assure $y^{n} \neq -1$ pour tout $n$ (si $|y| \neq 1$, $|y^{n}| \neq 1$ pour $n \geqslant 1$ ; si $y = 1$, $1 + y^{n} = 2$). On distingue selon $|y|$.

    • *Si $|y| < 1$*, $y^{n}$ tend vers $0$ et $|1 + y^{n}| \leqslant 2$. Pour $|x| < 1$, on a $|u_{n}| \sim |x|^{n}$ (ou $u_{n} = 0$ pour $n \geqslant 1$ si $x = 0$), et la série converge absolument par le théorème 4 et la série géométrique. Pour $|x| \geqslant 1$, on a $|u_{n}| \geqslant \frac{|x|^{n}}{2} \geqslant \frac{1}{2}$, et elle diverge grossièrement.

    • *Si $y = 1$*, $u_{n} = \frac{x^{n}}{2}$ : la série converge si et seulement si $|x| < 1$.

    • *Si $|y| > 1$*, on écrit $u_{n} = \Big(\frac{x}{y}\Big)^{n} \cdot \frac{1}{1 + y^{-n}}$, où $y^{-n}$ tend vers $0$, donc $|u_{n}| \sim \Big|\frac{x}{y}\Big|^{n}$. Si $|x| < |y|$, la série converge absolument ; si $|x| \geqslant |y|$, $|u_{n}|$ tend vers une limite non nulle ou vers $+\infty$, et la série diverge grossièrement.

    Dans tous les cas, la condition s'écrit $|x| < \max(1, |y|)$. 
    $$\boxed{\sum_{n \geqslant 0} \frac{x^{n}}{1 + y^{n}} \text{ converge} \iff |x| < \max(1, |y|), \qquad \text{ensemble } \mathcal{D} = \big\{(x, y) \;\big|\; y \neq -1,\ |x| < \max(1, |y|)\big\}}$$

    ![Figure](documents/figures/49d647404084f7f8.svg)

    Le domaine $\mathcal{D}$ est la bande verticale $|x| < 1$ pour $-1 < y \leqslant 1$, prolongée par les deux cônes $|x| < |y|$ pour $|y| > 1$ ; ses bords en pointillés sont exclus, ainsi que la droite d'équation $y = -1$, sur laquelle la série n'est pas définie. Le segment d'équation $y = 1$, $|x| < 1$, fait partie du domaine.
- id: "ma-20-32"
  feuille: "f-ma-20"
  numero: 32
  partie: "Séries absolument convergentes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence absolue, séries géométriques, "constante d'Euler et Stirling"]
  noeuds: [as-series, as-dl, pol-binome]
  notions: [serie-absolument-convergente, coefficient-binomial]
  page_enonce: 7
  page_corrige: 34
  enonce: |
    Déterminer, selon le réel $x$, la nature de la série $\displaystyle\sum_{n \geqslant 0} \binom{2n}{n}x^{n}$. On pourra comparer le terme général à celui d'une série géométrique, en étudiant le quotient de deux termes consécutifs, et utiliser la formule de Stirling lorsque $|x| = \frac{1}{4}$.
  corrige: |
    Pour $x = 0$, la série se réduit à son premier terme et converge. Soit $x \neq 0$ et $u_{n} = \binom{2n}{n}x^{n}$, non nul. On calcule 
    $$\frac{u_{n+1}}{u_{n}} = \frac{(2n + 2)!\,(n!)^{2}}{(2n)!\,((n + 1)!)^{2}}\,x = \frac{(2n + 2)(2n + 1)}{(n + 1)^{2}}\,x = \frac{2(2n + 1)}{n + 1}\,x, \qquad \Big|\frac{u_{n+1}}{u_{n}}\Big| \xrightarrow[n \to +\infty]{} 4|x|.$$
     La règle de d'Alembert n'étant pas un théorème du cours, on refait la comparaison géométrique de la remarque de la section 20.4.

    • *Si $|x| < \frac{1}{4}$*, on choisit $q \in \,]4|x|\,,1[$. À partir d'un rang $N$, $|u_{n+1}| \leqslant q|u_{n}|$, d'où $|u_{n}| \leqslant |u_{N}|\,q^{n-N}$ par récurrence. La série géométrique $\sum q^{n}$ converge : $\sum u_{n}$ est absolument convergente (théorème 3 et théorème 6).

    • *Si $|x| > \frac{1}{4}$*, le rapport $\big|\frac{u_{n+1}}{u_{n}}\big|$ est supérieur à $1$ à partir d'un rang $N$ : la suite $(|u_{n}|)_{n \geqslant N}$ est croissante et strictement positive, elle ne tend pas vers $0$, et la série diverge grossièrement.

    • *Si $|x| = \frac{1}{4}$*, la formule de Stirling (chapitre 10, théorème 6) donne 
    $$c_{n} = \frac{1}{4^{n}}\binom{2n}{n} = \frac{(2n)!}{4^{n}(n!)^{2}} \sim \frac{\sqrt{4\pi n}\,(2n)^{2n}\mathrm{e}^{-2n}}{4^{n} \cdot 2\pi n \cdot n^{2n}\mathrm{e}^{-2n}} = \frac{1}{\sqrt{\pi n}}.$$
     Pour $x = \frac{1}{4}$, $u_{n} = c_{n} > 0$ et $c_{n} \sim \frac{1}{\sqrt{\pi n}}$ : la série diverge par le théorème 4, comme la série de Riemann d'exposant $\frac{1}{2}$. Pour $x = -\frac{1}{4}$, $u_{n} = (-1)^{n}c_{n}$, et $\frac{c_{n+1}}{c_{n}} = \frac{2n + 1}{2n + 2} < 1$ : la suite $(c_{n})$ décroît, et elle tend vers $0$. Le critère des séries alternées (théorème 7) donne la convergence, qui n'est pas absolue puisque $\sum c_{n}$ diverge.

    $$\boxed{\sum_{n \geqslant 0} \binom{2n}{n}x^{n} \text{ converge} \iff -\frac{1}{4} \leqslant x < \frac{1}{4} ; \text{ absolument} \iff |x| < \frac{1}{4} ; \text{ semi-convergente en } x = -\frac{1}{4}}$$
     Pour $n = 10^{5}$, on calcule $c_{n}\sqrt{\pi n} \approx 0{,}9999988$ ✓. On peut aussi obtenir l'équivalent sans Stirling : $c_{n} = \frac{2}{\pi}W_{2n}$, où $W_{2n}$ est l'intégrale de Wallis du chapitre 18 (proposition 15), dont l'équivalent $W_{2n} \sim \sqrt{\frac{\pi}{4n}}$ y a été établi : $\frac{2}{\pi}\sqrt{\frac{\pi}{4n}} = \frac{1}{\sqrt{\pi n}}$.

    *Piège.* L'erreur la plus répandue est de conclure au bord $|x| = \frac{1}{4}$ à l'aide du rapport, qui tend vers $1$ et ne dit rien. Il faut un équivalent du terme ; les deux bords ont alors des comportements différents, divergence en $\frac{1}{4}$ et semi-convergence en $-\frac{1}{4}$. On montrera en seconde année que la somme vaut $\frac{1}{\sqrt{1 - 4x}}$ ; numériquement, on trouve bien $\frac{1}{\sqrt{2}} \approx 0{,}70711$ en $x = -\frac{1}{4}$ et $\sqrt{2}$ en $x = \frac{1}{8}$.
- id: "ma-20-33"
  feuille: "f-ma-20"
  numero: 33
  partie: "Séries absolument convergentes"
  etoiles: 2
