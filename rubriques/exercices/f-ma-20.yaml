  page_corrige: 35
  enonce: |
    Pour tout $n \geqslant 1$, on pose $\displaystyle z_{n} = \prod_{k=1}^{n} \Big(1 + \frac{\mathrm{i}}{k}\Big)$.

    **1.** Montrer que la suite $(|z_{n}|)$ converge.

    **2.** Montrer que la suite $(z_{n})$ diverge. On pourra écrire $1 + \frac{\mathrm{i}}{k} = \big|1 + \frac{\mathrm{i}}{k}\big|\,\mathrm{e}^{\mathrm{i}\theta_{k}}$, avec $\theta_{k} = \operatorname{Arctan}\frac{1}{k}$.
  corrige: |
    **1.** Le module d'un produit est le produit des modules, et $\big|1 + \frac{\mathrm{i}}{k}\big| = \sqrt{1 + \frac{1}{k^{2}}}$, donc 
    $$\ln|z_{n}| = \frac{1}{2}\sum_{k=1}^{n} \ln\Big(1 + \frac{1}{k^{2}}\Big), \qquad 0 \leqslant \ln\Big(1 + \frac{1}{k^{2}}\Big) \leqslant \frac{1}{k^{2}},$$
     par l'inégalité $\ln(1 + x) \leqslant x$ (chapitre 5). La série à termes positifs $\sum \ln\big(1 + \frac{1}{k^{2}}\big)$ converge par comparaison avec $\sum \frac{1}{k^{2}}$ (théorème 3) : $\ln|z_{n}|$ converge vers un réel $L$, et, par continuité de l'exponentielle, 
    $$\boxed{|z_{n}| \xrightarrow[n \to +\infty]{} \rho = \mathrm{e}^{L} > 0, \qquad 1 \leqslant \rho \leqslant \mathrm{e}^{\pi^{2}/12} \approx 2{,}277}$$
     La majoration vient de $L \leqslant \frac{1}{2}\sum_{k=1}^{+\infty} \frac{1}{k^{2}} = \frac{\pi^{2}}{12}$ (proposition 8). Numériquement, $\rho \approx 1{,}9173$ ; on peut montrer que $\rho = \sqrt{\frac{\operatorname{sh}\pi}{\pi}}$, ce qui dépasse le programme.

    **2.** Comme $1 + \frac{\mathrm{i}}{k}$ a une partie réelle strictement positive, un argument en est $\theta_{k} = \operatorname{Arctan}\frac{1}{k} \in \big]0\,,\frac{\pi}{4}\big]$, et $z_{n} = |z_{n}|\,\mathrm{e}^{\mathrm{i}\Phi_{n}}$, où 
    $$\Phi_{n} = \sum_{k=1}^{n} \theta_{k} = \sum_{k=1}^{n} \operatorname{Arctan}\frac{1}{k}.$$
     Comme $\operatorname{Arctan} x \sim x$ en $0$, on a $\theta_{k} \sim \frac{1}{k}$, terme positif : la série $\sum \theta_{k}$ diverge (théorème 4), et $\Phi_{n}$ tend vers $+\infty$ en croissant.

    Supposons que $(z_{n})$ converge vers un complexe $z$. Comme $|z_{n}| \to \rho > 0$, on aurait $\mathrm{e}^{\mathrm{i}\Phi_{n}} = \frac{z_{n}}{|z_{n}|} \to \frac{z}{\rho}$, et en particulier $\cos\Phi_{n}$ convergerait. Montrons que ce n'est pas le cas. Pour $j \geqslant 1$, soit $p_{j}$ le plus petit entier $n$ tel que $\Phi_{n} \geqslant (2j + 1)\pi$ ; il existe puisque $\Phi_{n} \to +\infty$, et $p_{j} \geqslant 2$ puisque $\Phi_{1} = \frac{\pi}{4}$. Par minimalité, $\Phi_{p_{j}-1} < (2j + 1)\pi$, donc 
    $$(2j + 1)\pi \leqslant \Phi_{p_{j}} = \Phi_{p_{j}-1} + \theta_{p_{j}} < (2j + 1)\pi + \frac{\pi}{4}, \qquad\text{d'où}\qquad \cos\Phi_{p_{j}} \leqslant -\frac{\sqrt{2}}{2},$$
     puisque le cosinus est majoré par $-\frac{\sqrt{2}}{2}$ sur $\big[\pi\,,\frac{5\pi}{4}\big]$. De même, avec $q_{j}$ le plus petit entier tel que $\Phi_{n} \geqslant 2j\pi$, on obtient $\cos\Phi_{q_{j}} \geqslant \frac{\sqrt{2}}{2}$. Les suites $(p_{j})$ et $(q_{j})$ tendent vers $+\infty$ (sinon $\Phi_{p_{j}}$ resterait bornée), et les deux suites extraites de $(\cos\Phi_{n})$ ne peuvent avoir la même limite. 
    $$\boxed{(|z_{n}|) \text{ converge, mais } (z_{n}) \text{ diverge}}$$

    ![Figure](documents/figures/f2292ec3c318e081.svg)

    La ligne brisée relie $z_{0} = 1$, $z_{1}$, $z_{2}$, …, jusqu'à $z_{5\,500}$ environ. Elle s'approche du cercle de rayon $\rho$ en le longeant, sans jamais s'arrêter : l'argument $\Phi_{n}$, voisin de $\ln n + 0{,}30$, continue de croître, de plus en plus lentement.

    *À retenir.* La convergence d'un produit de complexes se ramène à deux séries, celle des $\ln|1 + w_{k}|$ pour le module et celle des arguments. Ici $\ln\big|1 + \frac{\mathrm{i}}{k}\big| = O\big(\frac{1}{k^{2}}\big)$, mais l'argument $\theta_{k}$ est de l'ordre de $\frac{1}{k}$ : c'est la série harmonique, cachée dans les arguments, qui fait diverger le produit. L'erreur la plus répandue est de conclure à la convergence de $(z_{n})$ à partir de celle de $(|z_{n}|)$, alors que la convergence du module ne dit rien de l'argument.
- id: "ma-20-34"
  feuille: "f-ma-20"
  numero: 34
  partie: "Séries absolument convergentes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [convergence absolue]
  noeuds: [as-series]
  notions: [serie-absolument-convergente]
  page_enonce: 7
  page_corrige: 36
  enonce: |
    Soit $(u_{n})_{n \in \mathbb{N}}$ une suite de nombres complexes telle que la série $\sum u_{n}$ soit absolument convergente et que 
    $$\sum_{n=0}^{+\infty} u_{n}^{k} = 0 \qquad\text{pour tout entier } k \geqslant 1.$$
     Montrer que la suite $(u_{n})$ est nulle. On pourra raisonner par l'absurde, diviser par le plus grand des modules $|u_{n}|$, et étudier la moyenne des carrés des modules des sommes obtenues pour $k$ allant de $1$ à $K$.
  corrige: |
    *Idée.* Après division par le plus grand module $r$, seuls les termes de module $1$ comptent quand $k$ est grand : leur somme $A_{k}$, une combinaison de puissances $k$-ièmes de nombres de module $1$, devrait tendre vers $0$. Une telle somme peut s'annuler pour certains $k$, mais pas « en moyenne » : la moyenne de $|A_{k}|^{2}$ tend vers la somme des carrés des multiplicités.

    *Mise en place.* Comme $\sum u_{n}$ converge, $u_{n} \to 0$ (proposition 2). Supposons par l'absurde que la suite $(u_{n})$ n'est pas nulle, et soit $n_{0}$ tel que $u_{n_{0}} \neq 0$. Seuls un nombre fini d'indices vérifient $|u_{n}| \geqslant |u_{n_{0}}|$, puisque $|u_{n}| \to 0$ ; le plus grand des modules correspondants est donc le plus grand de tous les $|u_{n}|$ : 
    $$r = \max_{n \in \mathbb{N}} |u_{n}| > 0.$$
     Pour $k \geqslant 1$, on a $|u_{n}^{k}| \leqslant r^{k-1}|u_{n}|$ : les séries $\sum u_{n}^{k}$ sont absolument convergentes (proposition 9), ce qui donne un sens à l'hypothèse. On pose $v_{n} = \frac{u_{n}}{r}$, de sorte que $|v_{n}| \leqslant 1$ et $\sum_{n=0}^{+\infty} v_{n}^{k} = \frac{1}{r^{k}}\sum_{n=0}^{+\infty} u_{n}^{k} = 0$ pour tout $k \geqslant 1$.

    *Séparation des termes de module $1$.* L'ensemble $J = \{n \in \mathbb{N} \mid |v_{n}| = 1\}$ est fini, puisque $v_{n} \to 0$, et non vide. On note $w_{1}$, …, $w_{p}$ les valeurs *distinctes* prises par $v_{n}$ pour $n \in J$, et $c_{j} \geqslant 1$ le nombre d'indices $n \in J$ tels que $v_{n} = w_{j}$. Hors de $J$, on a $|v_{n}| < 1$, et seuls un nombre fini de ces modules dépassent $\frac{1}{2}$ : le réel $\rho = \sup_{n \notin J} |v_{n}|$ (nul si $J = \mathbb{N}$, ce qui est en fait impossible) vérifie $\rho < 1$. Pour tout $k \geqslant 1$, 
    $$0 = \sum_{n=0}^{+\infty} v_{n}^{k} = A_{k} + \varepsilon_{k}, \qquad A_{k} = \sum_{j=1}^{p} c_{j}w_{j}^{k}, \qquad |\varepsilon_{k}| = \Big|\sum_{n \notin J} v_{n}^{k}\Big| \leqslant \rho^{k-1}\sum_{n=0}^{+\infty} |v_{n}|.$$
     Comme $\rho < 1$, $\varepsilon_{k}$ tend vers $0$, et donc 
    $$\boxed{A_{k} = \sum_{j=1}^{p} c_{j}w_{j}^{k} \xrightarrow[k \to +\infty]{} 0}$$
     *Moyenne des carrés des modules.* Pour $K \geqslant 1$, on pose $M_{K} = \frac{1}{K}\sum_{k=1}^{K} |A_{k}|^{2}$. Comme $|A_{k}|^{2}$ tend vers $0$, le lemme de Cesàro (chapitre 10, proposition 16, appliqué à la suite $V_{K} = \sum_{k=1}^{K} |A_{k}|^{2}$, dont les accroissements tendent vers $0$) donne $M_{K} \to 0$. Calculons $M_{K}$ autrement. En développant $|A_{k}|^{2} = A_{k}\overline{A_{k}}$, avec $\overline{w_{l}} = \frac{1}{w_{l}}$ puisque $|w_{l}| = 1$, 
    $$|A_{k}|^{2} = \sum_{j=1}^{p}\sum_{l=1}^{p} c_{j}c_{l}\big(w_{j}\overline{w_{l}}\big)^{k} = \sum_{j=1}^{p} c_{j}^{2} + \sum_{j \neq l} c_{j}c_{l}\,q_{jl}^{k}, \qquad q_{jl} = w_{j}\overline{w_{l}}.$$
     Pour $j \neq l$, on a $|q_{jl}| = 1$ et $q_{jl} \neq 1$, puisque $q_{jl} = 1$ équivaut à $w_{j} = w_{l}$. La somme géométrique vérifie alors 
    $$\Big|\sum_{k=1}^{K} q_{jl}^{k}\Big| = \Big|q_{jl}\,\frac{1 - q_{jl}^{K}}{1 - q_{jl}}\Big| \leqslant \frac{2}{|1 - q_{jl}|},$$
     borne indépendante de $K$. En sommant sur $k$ de $1$ à $K$ et en divisant par $K$, 
    $$M_{K} \geqslant \sum_{j=1}^{p} c_{j}^{2} - \frac{B}{K}, \qquad B = \sum_{j \neq l} \frac{2c_{j}c_{l}}{|1 - q_{jl}|}.$$
     Quand $K$ tend vers $+\infty$, on obtient $\lim M_{K} \geqslant \sum_{j} c_{j}^{2} \geqslant 1$, ce qui contredit $M_{K} \to 0$. 
    $$\boxed{\text{si } \sum u_{n} \text{ est absolument convergente et } \sum_{n=0}^{+\infty} u_{n}^{k} = 0 \text{ pour tout } k \geqslant 1, \text{ alors } u_{n} = 0 \text{ pour tout } n}$$
     *Piège.* L'erreur la plus répandue est de croire que $A_{k} \to 0$ est absurde terme à terme, en affirmant qu'une somme de nombres de module $1$ ne peut pas être petite. Elle peut même être nulle : pour $w_{1} = 1$ et $w_{2} = -1$, avec $c_{1} = c_{2} = 1$, $A_{k} = 1 + (-1)^{k}$ s'annule pour tout $k$ impair. C'est pourquoi on passe à la moyenne : dans cet exemple, $M_{K}$ tend vers $c_{1}^{2} + c_{2}^{2} = 2$, ce que confirme le calcul numérique. Le regroupement des valeurs égales est aussi indispensable, sans quoi certains $q_{jl}$ vaudraient $1$.

    *À retenir.* Pour une famille finie, le résultat est un énoncé d'algèbre : si $z_{1}$, …, $z_{N}$ vérifient $\sum_{i} z_{i}^{k} = 0$ pour $k = 1$, …, $N$, ils sont tous nuls ; on le démontre par les identités de Newton, qui expriment les coefficients du polynôme $\prod_{i} (X - z_{i})$ à l'aide de ces sommes, et montrent que ce polynôme vaut $X^{N}$. Pour une infinité de termes, l'algèbre ne suffit plus, et c'est l'analyse qui prend le relais : la convergence absolue permet de négliger les petits termes, la moyenne de Cesàro de contrôler les grands. Le calcul de $M_{K}$ est une forme discrète de l'orthogonalité de la famille trigonométrique rencontrée au chapitre 19.
- id: "ma-20-35"
  feuille: "f-ma-20"
  numero: 35
  partie: "Séries alternées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 7
  page_corrige: 38
  enonce: |
    **1.** Soit $\alpha > 0$ et, pour $n \in \mathbb{N}$, $u_{n} = \operatorname{Arccos}\Big(\dfrac{1 + n^{\alpha}}{2 + n^{\alpha}}\Big)$. Déterminer la nature des séries $\sum u_{n}$ et $\sum (-1)^{n}u_{n}$.

    **2.** Déterminer la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{(-1)^{n}}{n + \sin n}$. Le théorème des séries alternées s'applique-t-il directement ?
  corrige: |
    **1.** Pour $n \in \mathbb{N}$, on pose $x_{n} = \frac{1 + n^{\alpha}}{2 + n^{\alpha}} = 1 - \frac{1}{2 + n^{\alpha}}$, qui appartient à $\big[\frac{1}{2}\,,1\big[$ (pour $n = 0$, on a $0^{\alpha} = 0$ puisque $\alpha > 0$, et $u_{0} = \operatorname{Arccos}\frac{1}{2} = \frac{\pi}{3}$). Le terme $u_{n} = \operatorname{Arccos} x_{n}$ est donc bien défini, et $u_{n} \in \big]0\,,\frac{\pi}{3}\big]$.

    *Monotonie et limite.* La fonction $t \mapsto 1 - \frac{1}{2 + t}$ est croissante sur $[0\,,+\infty[$ et la suite $(n^{\alpha})$ est croissante, donc $(x_{n})$ est croissante ; comme $\operatorname{Arccos}$ est décroissante, la suite $(u_{n})$ est décroissante. De plus $x_{n}$ tend vers $1$, et $\operatorname{Arccos}$ est continue en $1$, de valeur $0$ : $u_{n}$ tend vers $0$.

    *Équivalent.* Par définition, $\cos u_{n} = x_{n}$, soit $1 - \cos u_{n} = \frac{1}{2 + n^{\alpha}}$. Comme $u_{n}$ tend vers $0$, le développement limité de $\cos$ (chapitre 10, théorème 5) donne $1 - \cos u_{n} \sim \frac{u_{n}^{2}}{2}$, d'où 
    $$\frac{u_{n}^{2}}{2} \sim \frac{1}{2 + n^{\alpha}} \sim \frac{1}{n^{\alpha}}, \qquad\text{puis}\qquad \boxed{u_{n} \sim \frac{\sqrt{2}}{n^{\alpha/2}}}$$
     par passage à la racine carrée, compatible avec les équivalents (chapitre 10, théorème 1). Pour $n = 10^{8}$ et $\alpha = 1$, on trouve $n^{1/2}u_{n} \approx 1{,}414\,213$ ✓.

    *Nature de $\sum u_{n}$.* Les termes sont positifs, et le théorème 4 ramène la série à la série de Riemann d'exposant $\frac{\alpha}{2}$ (théorème 5) : 
    $$\boxed{\sum\nolimits u_{n} \text{ converge} \iff \alpha > 2}$$

    *Nature de $\sum (-1)^{n}u_{n}$.* La suite $(u_{n})$ décroît et tend vers $0$ : le critère des séries alternées (théorème 7) s'applique, quel que soit $\alpha > 0$. 
    $$\boxed{\sum\nolimits (-1)^{n}u_{n} \text{ converge pour tout } \alpha > 0, \text{ absolument si et seulement si } \alpha > 2}$$
     Pour $0 < \alpha \leqslant 2$, la série est donc semi-convergente.

    **2.** Pour $n \geqslant 1$, on a $n + \sin n \geqslant 1 + \sin 1 > 0$ si $n = 1$, et $n + \sin n \geqslant n - 1 > 0$ si $n \geqslant 2$ : le terme général est défini. Posons $a_{n} = \frac{1}{n + \sin n} > 0$. La formule $\sin p - \sin q = 2\cos\frac{p + q}{2}\sin\frac{p - q}{2}$ (chapitre 4) donne 
    $$\big|\sin(n + 1) - \sin n\big| = 2\Big|\cos\Big(n + \frac{1}{2}\Big)\Big|\sin\frac{1}{2} \leqslant 2\sin\frac{1}{2} \approx 0{,}9589 < 1,$$
     donc $(n + 1) + \sin(n + 1) - (n + \sin n) = 1 + \sin(n + 1) - \sin n > 0$. La suite $(n + \sin n)$ est strictement croissante, et elle tend vers $+\infty$ puisqu'elle est minorée par $n - 1$. La suite $(a_{n})$ est donc décroissante de limite nulle, et le théorème 7 s'applique directement : 
    $$\boxed{\sum\nolimits_{n \geqslant 1} \frac{(-1)^{n}}{n + \sin n} \text{ converge, et le théorème des séries alternées s'applique directement}}$$
     La convergence n'est pas absolue, puisque $a_{n} \sim \frac{1}{n}$ (théorèmes 4 et 5) : la série est semi-convergente.

    *Piège.* L'erreur la plus répandue est de croire que l'oscillation de $\sin n$ empêche la décroissance de $(a_{n})$. Elle ne l'empêche que si la perturbation varie, d'un rang au suivant, plus vite que le terme principal : ici le terme principal $n$ augmente de $1$ et la perturbation de moins de $0{,}96$. Pour $\frac{(-1)^{n}}{\sqrt{n} + \sin n}$, au contraire, $\sqrt{n}$ augmente de moins de $\frac{1}{2\sqrt{n}}$, et la décroissance est en défaut, par exemple de $n = 1\,001$ à $n = 1\,002$ ; on revient alors à un développement asymptotique, comme dans l'exercice suivant. Ici, ce développement donnerait aussi le résultat : 
    $$\frac{(-1)^{n}}{n + \sin n} = \frac{(-1)^{n}}{n} - \frac{(-1)^{n}\sin n}{n^{2}} + O\Big(\frac{1}{n^{3}}\Big),$$
     où le premier terme relève du théorème 7 et les deux autres de la proposition 9.
- id: "ma-20-36"
  feuille: "f-ma-20"
  numero: 36
  partie: "Séries alternées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 7
  page_corrige: 39
  enonce: |
    À l'aide de développements asymptotiques, déterminer la nature des séries suivantes, en fonction des paramètres indiqués. On précisera, en cas de convergence, si elle est absolue.

    **(a)** $\displaystyle\sum_{n \geqslant 1} \frac{(-1)^{n}}{n^{\alpha}}\Big(\mathrm{e} - \Big(1 + \frac{1}{n}\Big)^{n}\Big)$, $\alpha \in \mathbb{R}$

    **(b)** $\displaystyle\sum_{n \geqslant 2} \frac{(-1)^{n}n^{\alpha}}{\sqrt{n} + (-1)^{n}}$, $\alpha \in \mathbb{R}$

    **(c)** $\displaystyle\sum_{n \geqslant 0} \sin\Big(\sqrt{1 + n^{2}\pi^{2}}\Big)$

    **(d)** $\displaystyle\sum_{n \geqslant 0} \cos\Big(\pi\sqrt{n^{2} + n + 1}\Big)$

    **(e)** $\displaystyle\sum_{n \geqslant 1} \frac{(-1)^{n}}{\sqrt[n]{n!}}$

    **(f)** $\displaystyle\sum_{n \geqslant 2} \frac{(-1)^{n}}{(\ln n)^{a} + (-1)^{n}}$, $a > 0$

    **(g)** $\displaystyle\sum \frac{(-1)^{n}}{\ln\big(n^{a} + (-1)^{n}\big)}$, pour $a > 0$, la somme commençant au premier rang à partir duquel le terme général est défini.
  corrige: |
    La méthode est celle de la remarque qui suit le théorème 7 : pour une série de signe variable, on écrit un développement asymptotique du terme général jusqu'à un reste qui est le terme général d'une série absolument convergente. Les termes qui restent sont alors soit de la forme $(-1)^{n}a_{n}$ avec $(a_{n})$ décroissante de limite nulle (théorème 7), soit de signe constant (théorèmes 3 et 4).

    **(a)** Le terme $v_{n} = \mathrm{e} - \big(1 + \frac{1}{n}\big)^{n}$ est strictement positif, puisque $n\ln\big(1 + \frac{1}{n}\big) < n \cdot \frac{1}{n} = 1$ (chapitre 5, $\ln(1 + x) < x$ pour $x > 0$). Avec $h = \frac{1}{n}$, on a $\frac{1}{h}\ln(1 + h) = 1 - \frac{h}{2} + \frac{h^{2}}{3} + O(h^{3})$, et le développement de l'exponentielle donne 
    $$\Big(1 + \frac{1}{n}\Big)^{n} = \mathrm{e} \cdot \exp\Big(-\frac{1}{2n} + \frac{1}{3n^{2}} + O\Big(\frac{1}{n^{3}}\Big)\Big) = \mathrm{e}\Big(1 - \frac{1}{2n} + \frac{11}{24n^{2}} + O\Big(\frac{1}{n^{3}}\Big)\Big),$$

    $$\text{d'où}\qquad \boxed{v_{n} = \frac{\mathrm{e}}{2n} - \frac{11\mathrm{e}}{24n^{2}} + O\Big(\frac{1}{n^{3}}\Big)}$$

    • *Convergence absolue.* On a $\frac{v_{n}}{n^{\alpha}} \sim \frac{\mathrm{e}}{2n^{\alpha + 1}}$ : la série converge absolument si et seulement si $\alpha + 1 > 1$, c'est-à-dire $\alpha > 0$ (théorèmes 4 et 5).

    • *Si $\alpha \leqslant -1$,* la valeur absolue du terme général est équivalente à $\frac{\mathrm{e}}{2}n^{-\alpha - 1}$, qui tend vers $\frac{\mathrm{e}}{2}$ ou vers $+\infty$ : la série diverge grossièrement (proposition 2).

    • *Si $-1 < \alpha \leqslant 0$,* on écrit 
    $$\frac{(-1)^{n}v_{n}}{n^{\alpha}} = \frac{\mathrm{e}}{2} \cdot \frac{(-1)^{n}}{n^{\alpha + 1}} + O\Big(\frac{1}{n^{\alpha + 2}}\Big).$$
     Le premier terme donne une série convergente par le théorème 7, puisque $\alpha + 1 > 0$ ; le second est le terme général d'une série absolument convergente (proposition 9), puisque $\alpha + 2 > 1$. La série converge.

    $$\boxed{\text{la série (a) converge} \iff \alpha > -1, \quad \text{absolument} \iff \alpha > 0}$$

    **(b)** Pour $n \geqslant 2$, on factorise $\sqrt{n}$ au dénominateur et l'on développe $\frac{1}{1 + x} = 1 - x + O(x^{2})$ avec $x = \frac{(-1)^{n}}{\sqrt{n}}$, qui tend vers $0$ : 
    $$\frac{(-1)^{n}n^{\alpha}}{\sqrt{n} + (-1)^{n}} = \frac{(-1)^{n}n^{\alpha}}{\sqrt{n}}\Big(1 - \frac{(-1)^{n}}{\sqrt{n}} + O\Big(\frac{1}{n}\Big)\Big), \qquad \boxed{\frac{(-1)^{n}n^{\alpha}}{\sqrt{n} + (-1)^{n}} = \frac{(-1)^{n}}{n^{1/2 - \alpha}} - \frac{1}{n^{1 - \alpha}} + O\Big(\frac{1}{n^{3/2 - \alpha}}\Big)}$$

    • *Convergence absolue.* La valeur absolue du terme est équivalente à $n^{\alpha - 1/2}$ : la série converge absolument si et seulement si $\frac{1}{2} - \alpha > 1$, c'est-à-dire $\alpha < -\frac{1}{2}$.

    • *Si $\alpha \geqslant \frac{1}{2}$,* cette valeur absolue ne tend pas vers $0$ : divergence grossière.

    • *Si $\alpha < \frac{1}{2}$,* le premier terme donne une série convergente (théorème 7), et le reste une série absolument convergente, puisque $\frac{3}{2} - \alpha > 1$. Par linéarité (proposition 1), la série a la nature de $\sum \frac{1}{n^{1 - \alpha}}$, qui converge si et seulement si $1 - \alpha > 1$, soit $\alpha < 0$.

    $$\boxed{\text{la série (b) converge} \iff \alpha < 0, \quad \text{absolument} \iff \alpha < -\frac{1}{2}}$$
     Pour $\alpha = 0$, on retrouve exactement l'exemple de la remarque qui suit le théorème 7 : le terme est équivalent à $\frac{(-1)^{n}}{\sqrt{n}}$, et pourtant la série diverge.

    **(c)** On isole le terme $n\pi$ par la quantité conjuguée : pour $n \in \mathbb{N}$, 
    $$\varepsilon_{n} = \sqrt{1 + n^{2}\pi^{2}} - n\pi = \frac{1}{\sqrt{1 + n^{2}\pi^{2}} + n\pi}, \qquad \sin\Big(\sqrt{1 + n^{2}\pi^{2}}\Big) = \sin(n\pi + \varepsilon_{n}) = (-1)^{n}\sin\varepsilon_{n}.$$
     Le dénominateur de $\varepsilon_{n}$ est strictement croissant et tend vers $+\infty$ : la suite $(\varepsilon_{n})$ décroît vers $0$, à partir de $\varepsilon_{0} = 1$. Comme $\sin$ est croissante sur $[0\,,1] \subset \big[0\,,\frac{\pi}{2}\big]$, la suite $(\sin\varepsilon_{n})$ est positive, décroissante et de limite nulle, et le théorème 7 donne la convergence. Enfin $\sin\varepsilon_{n} \sim \varepsilon_{n} \sim \frac{1}{2\pi n}$ : la convergence n'est pas absolue. 
    $$\boxed{\sum\nolimits \sin\big(\sqrt{1 + n^{2}\pi^{2}}\big) \text{ est semi-convergente}}$$

    **(d)** Le même procédé, avec $n + \frac{1}{2}$ au lieu de $n\pi$, donne 
    $$\delta_{n} = \sqrt{n^{2} + n + 1} - \Big(n + \frac{1}{2}\Big) = \frac{n^{2} + n + 1 - \big(n + \frac{1}{2}\big)^{2}}{\sqrt{n^{2} + n + 1} + n + \frac{1}{2}} = \frac{3/4}{\sqrt{n^{2} + n + 1} + n + \frac{1}{2}}.$$
     La suite $(\delta_{n})$ décroît vers $0$, de $\delta_{0} = \frac{1}{2}$, et $\delta_{n} \sim \frac{3}{8n}$. Pour tout réel $x$, on a 
    $$\cos\Big(n\pi + \frac{\pi}{2} + x\Big) = (-1)^{n}\cos\Big(\frac{\pi}{2} + x\Big) = (-1)^{n + 1}\sin x,$$

    $$\boxed{\cos\Big(\pi\sqrt{n^{2} + n + 1}\Big) = (-1)^{n + 1}\sin(\pi\delta_{n})}$$
     avec $\pi\delta_{n} \in \big]0\,,\frac{\pi}{2}\big]$ : la suite $\big(\sin(\pi\delta_{n})\big)$ est décroissante de limite nulle, et la série converge par le théorème 7 (au signe global près). Comme $\sin(\pi\delta_{n}) \sim \frac{3\pi}{8n}$, elle n'est pas absolument convergente. 
    $$\boxed{\sum\nolimits \cos\big(\pi\sqrt{n^{2} + n + 1}\big) \text{ est semi-convergente}}$$

    **(e)** Posons $c_{n} = (n!)^{1/n}$ pour $n \geqslant 1$. Comme $n! \leqslant n^{n} < (n + 1)^{n}$, on a 
    $$\big((n + 1)!\big)^{n} = (n!)^{n}(n + 1)^{n} > (n!)^{n} \cdot n! = (n!)^{n + 1},$$
     et, en prenant la puissance $\frac{1}{n(n + 1)}$, $c_{n + 1} > c_{n}$ : la suite $(c_{n})$ est croissante. Elle tend vers $+\infty$, puisque $\ln c_{n} = \frac{\ln(n!)}{n}$ et que $\ln(n!) \sim n\ln n$ (remarque qui suit la proposition 6). Ainsi $\big(\frac{1}{c_{n}}\big)$ décroît vers $0$, et la série converge par le théorème 7. Enfin $c_{n} \leqslant n$, puisque $n! \leqslant n^{n}$ : on a $\frac{1}{c_{n}} \geqslant \frac{1}{n}$, et la série des valeurs absolues diverge par comparaison avec la série harmonique (théorème 3). 
    $$\boxed{\sum\nolimits \frac{(-1)^{n}}{\sqrt[n]{n!}} \text{ est semi-convergente}}$$
     La formule de Stirling (chapitre 10, théorème 6) précise que $c_{n} \sim \frac{n}{\mathrm{e}}$, mais elle est inutile ici.

    **(f)** Pour $n \geqslant 2$, posons $x_{n} = (\ln n)^{a}$. Le dénominateur $x_{n} + (-1)^{n}$ ne s'annule pas, puisque $x_{n} = 1$ équivaudrait à $n = \mathrm{e}$. Au lieu d'un développement, on écrit une identité exacte : pour $\varepsilon = \pm 1$, on a $\frac{\varepsilon}{x} - \frac{\varepsilon}{x + \varepsilon} = \frac{\varepsilon^{2}}{x(x + \varepsilon)}$, d'où 
    $$\boxed{\frac{(-1)^{n}}{(\ln n)^{a} + (-1)^{n}} = \frac{(-1)^{n}}{x_{n}} - b_{n}, \qquad b_{n} = \frac{1}{x_{n}\big(x_{n} + (-1)^{n}\big)}}$$
     La suite $\big(\frac{1}{x_{n}}\big)$ décroît vers $0$, puisque $a > 0$ : la série $\sum \frac{(-1)^{n}}{x_{n}}$ converge (théorème 7). Pour $n \geqslant 3$, on a $x_{n} > 1$, donc $b_{n} > 0$, et $b_{n} \sim \frac{1}{x_{n}^{2}} = \frac{1}{(\ln n)^{2a}}$. Par croissances comparées (chapitre 10, proposition 2), $\frac{(\ln n)^{2a}}{n}$ tend vers $0$, donc $\frac{1}{(\ln n)^{2a}} \geqslant \frac{1}{n}$ à partir d'un certain rang : la série $\sum b_{n}$ diverge (théorèmes 3 et 4). Par linéarité, la série étudiée diverge, comme la différence d'une série convergente et d'une série divergente. 
    $$\boxed{\sum\nolimits \frac{(-1)^{n}}{(\ln n)^{a} + (-1)^{n}} \text{ diverge pour tout } a > 0}$$

    **(g)** Si $n^{a} > 2$, on a $n^{a} + (-1)^{n} > 1$, et le terme est défini : il l'est donc à partir d'un certain rang, et la nature ne dépend pas de ce rang. On note $\varepsilon = (-1)^{n}$, $L_{n} = a\ln n$ et $\eta_{n} = \ln\big(1 + \varepsilon n^{-a}\big)$, de sorte que $\ln\big(n^{a} + \varepsilon\big) = L_{n} + \eta_{n}$. La même identité exacte qu'en (f) donne 
    $$\frac{\varepsilon}{L_{n} + \eta_{n}} = \frac{\varepsilon}{L_{n}} - c_{n}, \qquad c_{n} = \frac{\varepsilon\eta_{n}}{L_{n}(L_{n} + \eta_{n})}.$$
     Le réel $\varepsilon\eta_{n}$ est strictement positif : il vaut $\ln(1 + n^{-a})$ si $n$ est pair et $-\ln(1 - n^{-a})$ si $n$ est impair. Comme $\ln(1 + x) \sim x$ en $0$, on a $\varepsilon\eta_{n} \sim n^{-a}$, et $L_{n} + \eta_{n} \sim L_{n}$, d'où 
    $$\boxed{\frac{(-1)^{n}}{\ln\big(n^{a} + (-1)^{n}\big)} = \frac{(-1)^{n}}{a\ln n} - c_{n}, \qquad c_{n} > 0, \qquad c_{n} \sim \frac{1}{a^{2}\,n^{a}(\ln n)^{2}}}$$
     La série $\sum \frac{(-1)^{n}}{a\ln n}$ converge par le théorème 7, et la série positive $\sum c_{n}$ a la nature de la série de Bertrand $\sum \frac{1}{n^{a}(\ln n)^{2}}$ (théorème 4) : par l'exercice 13, elle converge si et seulement si $a > 1$, ou $a = 1$ et $2 > 1$, c'est-à-dire si et seulement si $a \geqslant 1$. Enfin la valeur absolue du terme général est équivalente à $\frac{1}{a\ln n} \geqslant \frac{1}{n}$ pour $n$ assez grand : la convergence n'est jamais absolue. 
    $$\boxed{\text{la série (g) converge} \iff a \geqslant 1, \quad \text{et elle n'est jamais absolument convergente}}$$
     Les calculs de contrôle confirment l'identité et l'équivalent : pour $n = 10^{12}$, le rapport de $c_{n}$ à $\frac{1}{a^{2}n^{a}(\ln n)^{2}}$ vaut $1{,}000\,00$ pour $a = 1$ et $a = 2$ ✓.

    *À retenir.* Dans les cas (f) et (g), le terme général est équivalent au terme d'une série alternée convergente, et pourtant la série peut diverger : c'est le piège annoncé par le cours après le théorème 4. Le terme correctif, de signe constant, est négligeable devant le terme principal, mais c'est lui qui décide de la nature. On a ici préféré une identité exacte à un développement asymptotique : elle évite d'avoir à contrôler un reste.
- id: "ma-20-37"
  feuille: "f-ma-20"
  numero: 37
  partie: "Séries alternées"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 8
  page_corrige: 42
  enonce: |
    Pour toute suite réelle $u = (u_{n})$, on note $E(u)$ l'ensemble des entiers $p \geqslant 1$ tels que la série $\sum u_{n}^{p}$ converge.

    **1.** On suppose $u$ à termes positifs. Montrer que $E(u)$ est soit vide, soit de la forme $\{p \in \mathbb{N} \mid p \geqslant p_{0}\}$ pour un entier $p_{0} \geqslant 1$.

    **2.** Donner un exemple de suite $u$ positive telle que $E(u)$ soit vide et, pour tout entier $p_{0} \geqslant 1$, un exemple de suite $u$ positive telle que $E(u) = \{p \in \mathbb{N} \mid p \geqslant p_{0}\}$.

    **3.** Déterminer $E(u)$ lorsque $u_{n} = \dfrac{(-1)^{n}}{\ln(n + 1)}$ pour $n \geqslant 1$, puis lorsque $u_{n} = \ln\Big(1 + \dfrac{(-1)^{n+1}}{n^{1/3}}\Big)$ pour $n \geqslant 2$. Le résultat de la première question subsiste-t-il sans hypothèse de signe ?
  corrige: |
    **1.** Supposons $u$ positive et $E(u)$ non vide. Soit $p \in E(u)$. La série $\sum u_{n}^{p}$ converge, donc $u_{n}^{p}$ tend vers $0$ (proposition 2), et $u_{n} = (u_{n}^{p})^{1/p}$ aussi. À partir d'un certain rang, $0 \leqslant u_{n} \leqslant 1$, donc $0 \leqslant u_{n}^{p + 1} \leqslant u_{n}^{p}$, et la série $\sum u_{n}^{p + 1}$ converge par le théorème 3 : $p + 1 \in E(u)$. La partie non vide $E(u)$ de $\mathbb{N}$ a un plus petit élément $p_{0} \geqslant 1$, et une récurrence immédiate donne 
    $$\boxed{E(u) = \emptyset \quad\text{ou}\quad E(u) = \{p \in \mathbb{N} \mid p \geqslant p_{0}\}, \quad p_{0} = \min E(u)}$$

    **2.** Pour $u_{n} = 1$, toutes les séries $\sum u_{n}^{p}$ divergent grossièrement : $\boxed{E(u) = \emptyset}$.

    Soit $p_{0} \geqslant 1$. On cherche $u_{n} = n^{-\beta}$, pour $n \geqslant 1$, avec $\beta > 0$ : la série $\sum n^{-\beta p}$ converge si et seulement si $\beta p > 1$ (théorème 5). Il suffit donc que le seuil $\frac{1}{\beta}$ soit strictement compris entre $p_{0} - 1$ et $p_{0}$, par exemple $\frac{1}{\beta} = p_{0} - \frac{1}{2}$ : pour un entier $p$, on a $p > p_{0} - \frac{1}{2}$ si et seulement si $p \geqslant p_{0}$. 
    $$\boxed{u_{n} = \frac{1}{n^{2/(2p_{0} - 1)}} \quad : \quad E(u) = \{p \in \mathbb{N} \mid p \geqslant p_{0}\}}$$
     Pour $p_{0} = 1$, on obtient $u_{n} = \frac{1}{n^{2}}$, et toutes les séries $\sum \frac{1}{n^{2p}}$ convergent.

    **3.** *Premier exemple.* Pour $u_{n} = \frac{(-1)^{n}}{\ln(n + 1)}$, on a $u_{n}^{p} = \frac{(-1)^{np}}{(\ln(n + 1))^{p}}$.

    • Si $p$ est pair, $u_{n}^{p} = \frac{1}{(\ln(n + 1))^{p}}$. Par croissances comparées, $(\ln(n + 1))^{p} \leqslant n + 1$ à partir d'un certain rang, donc $u_{n}^{p} \geqslant \frac{1}{n + 1}$, et la série diverge (théorème 3).

    • Si $p$ est impair, $u_{n}^{p} = \frac{(-1)^{n}}{(\ln(n + 1))^{p}}$, et la suite $\big((\ln(n + 1))^{-p}\big)$ décroît vers $0$ : la série converge par le théorème 7.

    $$\boxed{E(u) = \{p \geqslant 1 \mid p \text{ impair}\}}$$
     Cet ensemble n'est ni vide ni de la forme $\{p \geqslant p_{0}\}$ : le résultat de la question 1 ne subsiste pas sans hypothèse de signe.

    *Second exemple.* Pour tout $n \geqslant 2$, on pose $x_{n} = \frac{(-1)^{n + 1}}{n^{1/3}}$. Comme $|x_{n}| \leqslant 2^{-1/3} < 1$, le terme $u_{n} = \ln(1 + x_{n})$ est bien défini. On a $x_{n}^{2} = \frac{1}{n^{2/3}}$ et $x_{n}^{3} = \frac{(-1)^{n + 1}}{n}$, et le développement limité de $\ln(1 + x)$ à l'ordre $3$ en $0$ donne 
    $$u_{n} = \frac{(-1)^{n + 1}}{n^{1/3}} - \frac{1}{2n^{2/3}} + \frac{(-1)^{n + 1}}{3n} + O\Big(\frac{1}{n^{4/3}}\Big).$$

    • $p = 1$ : le premier et le troisième terme donnent des séries convergentes (théorème 7), le reste une série absolument convergente (proposition 9), et $\sum \frac{1}{2n^{2/3}}$ diverge : $\sum u_{n}$ diverge.

    • $p = 2$ : $u_{n} \sim x_{n}$, donc $u_{n}^{2} \sim \frac{1}{n^{2/3}}$, de signe positif : $\sum u_{n}^{2}$ diverge (théorème 4).

    • $p = 3$ : on a $u_{n} - x_{n} = O(x_{n}^{2})$ et $u_{n}^{2} + u_{n}x_{n} + x_{n}^{2} = O(x_{n}^{2})$, donc 
    $$u_{n}^{3} - x_{n}^{3} = (u_{n} - x_{n})\big(u_{n}^{2} + u_{n}x_{n} + x_{n}^{2}\big) = O(x_{n}^{4}), \qquad u_{n}^{3} = \frac{(-1)^{n + 1}}{n} + O\Big(\frac{1}{n^{4/3}}\Big),$$
     et $\sum u_{n}^{3}$ converge (théorème 7 et proposition 9), sans convergence absolue.

    • $p \geqslant 4$ : $|u_{n}|^{p} \sim \frac{1}{n^{p/3}}$ avec $\frac{p}{3} > 1$ : la série converge absolument.

    $$\boxed{E(u) = \{p \in \mathbb{N} \mid p \geqslant 3\}}$$
     Ce second ensemble a la forme de la question 1, mais pour une autre raison : le terme $-\frac{x_{n}^{2}}{2}$, de signe constant, fait diverger le cas $p = 1$, ce que la seule comparaison des modules ne laissait pas prévoir.
- id: "ma-20-38"
  feuille: "f-ma-20"
  numero: 38
  partie: "Séries alternées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 8
  page_corrige: 43
  enonce: |
    Déterminer la nature de la série $\sum_{n \geqslant 1} \sin(\pi\,n!\,\mathrm{e})$. On pourra écrire, à l'aide du théorème 2 du cours, $n!\,\mathrm{e} = a_{n} + r_{n}$, où $a_{n} = \sum_{k=0}^{n} \frac{n!}{k!}$ est un entier dont on étudiera la parité, et $r_{n} = \sum_{k=n+1}^{+\infty} \frac{n!}{k!}$.
  corrige: |
    Par le théorème 2, $\mathrm{e} = \sum_{k=0}^{+\infty} \frac{1}{k!}$. En multipliant par $n!$ et en séparant les indices $k \leqslant n$ et $k > n$, 
    $$n!\,\mathrm{e} = a_{n} + r_{n}, \qquad a_{n} = \sum_{k=0}^{n} \frac{n!}{k!}, \qquad r_{n} = \sum_{k=n+1}^{+\infty} \frac{n!}{k!}.$$
     *Parité de $a_{n}$.* Chaque $\frac{n!}{k!} = (k + 1)(k + 2)\cdots n$ est un entier, donc $a_{n} \in \mathbb{N}$. Pour $n \geqslant 1$, on met $n$ en facteur dans les termes d'indice $k \leqslant n - 1$ : 
    $$a_{n} = n\sum_{k=0}^{n-1} \frac{(n - 1)!}{k!} + 1 = n\,a_{n-1} + 1.$$
     Montrons par récurrence que $a_{n} \equiv n + 1 \;[2]$. C'est vrai pour $n = 0$, puisque $a_{0} = 1$. Si $a_{n-1} \equiv n \;[2]$, alors $a_{n} \equiv n^{2} + 1 \equiv n + 1 \;[2]$, car $n^{2} - n = n(n - 1)$ est pair. 
    $$\boxed{a_{n} \equiv n + 1 \;[2]}, \qquad a_{0}, \dots, a_{5} = 1, 2, 5, 16, 65, 326 \ \checkmark$$
     *Encadrement de $r_{n}$.* Pour $j \geqslant 1$, $\frac{n!}{(n + j)!} = \frac{1}{(n + 1)\cdots(n + j)}$, qui vaut $\frac{1}{n + 1}$ pour $j = 1$ et est strictement inférieur à $\frac{1}{(n + 1)^{j}}$ pour $j \geqslant 2$. En sommant (théorème 1 pour la série géométrique), 
    $$\frac{1}{n + 1} < r_{n} < \sum_{j=1}^{+\infty} \frac{1}{(n + 1)^{j}} = \frac{1}{n}, \qquad\text{d'où}\qquad \boxed{\frac{1}{n + 1} < r_{n} < \frac{1}{n}, \qquad r_{n} \sim \frac{1}{n}}$$
     En particulier $r_{n + 1} < \frac{1}{n + 1} < r_{n}$ : la suite $(r_{n})$ est strictement décroissante.

    *Nature de la série.* Comme $a_{n}$ est un entier de la parité de $n + 1$, on a, pour tout réel $x$, 
    $$\sin(\pi a_{n} + x) = (-1)^{a_{n}}\sin x = (-1)^{n + 1}\sin x, \qquad\text{d'où}\qquad \boxed{\sin(\pi\,n!\,\mathrm{e}) = (-1)^{n + 1}\sin(\pi r_{n})}$$
     Pour $n \geqslant 2$, on a $\pi r_{n} \in \big]0\,,\frac{\pi}{2}\big[$, puisque $r_{n} < \frac{1}{n} \leqslant \frac{1}{2}$ ; la fonction $\sin$ est croissante sur cet intervalle, et $\big(\sin(\pi r_{n})\big)_{n \geqslant 2}$ est décroissante, de limite nulle. Le théorème 7 donne la convergence. Enfin $\sin(\pi r_{n}) \sim \pi r_{n} \sim \frac{\pi}{n}$ : la convergence n'est pas absolue. 
    $$\boxed{\sum\nolimits_{n \geqslant 1} \sin(\pi\,n!\,\mathrm{e}) \text{ est semi-convergente}}$$
     On contrôle en précision élevée : $100\sin(\pi \cdot 100!\,\mathrm{e}) \approx -3{,}1408$, proche de $(-1)^{101}\pi$ ✓.

    *Piège.* Le rang compte : pour $n = 1$, $r_{1} = \mathrm{e} - 2 \approx 0{,}718$ dépasse $\frac{1}{2}$, et l'argument de monotonie ne vaut qu'à partir de $n = 2$, ce qui ne change pas la nature. L'encadrement $0 < r_{n} < 1$ est exactement celui de la démonstration de l'irrationalité de $\mathrm{e}$ (chapitre 18, proposition 12) : si l'on avait $\mathrm{e} = \frac{p}{q}$, le réel $r_{q} = q!\,\mathrm{e} - a_{q}$ serait un entier de $]0\,,1[$. Ici le même encadrement, rendu plus fin, dit à quelle vitesse $n!\,\mathrm{e}$ s'approche des entiers.
- id: "ma-20-39"
  feuille: "f-ma-20"
  numero: 39
  partie: "Séries alternées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 8
  page_corrige: 44
  enonce: |
    On pourra utiliser l'exercice 6 de cette feuille.

    **1.** Déterminer la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{(-1)^{\lfloor \ln n \rfloor}}{n}$.

    **2.** Déterminer la nature de la série $\displaystyle\sum_{n \geqslant 1} (-1)^{n}\frac{\sin(\ln n)}{n}$, et comparer avec l'exercice 23.
  corrige: |
    **1.** Pour $k \in \mathbb{N}$, on note $I_{k} = \{n \geqslant 1 \mid \lfloor \ln n \rfloor = k\} = \{n \geqslant 1 \mid \mathrm{e}^{k} \leqslant n < \mathrm{e}^{k + 1}\}$. C'est un intervalle d'entiers $[\![A_{k}\,;B_{k}]\!]$, non vide puisque $\mathrm{e}^{k + 1} - \mathrm{e}^{k} > 1$, avec 
    $$\mathrm{e}^{k} \leqslant A_{k} < \mathrm{e}^{k} + 1, \qquad \mathrm{e}^{k + 1} - 1 \leqslant B_{k} < \mathrm{e}^{k + 1}.$$
     Sur $I_{k}$, le terme général vaut $\frac{(-1)^{k}}{n}$, et la somme du paquet est $(-1)^{k}T_{k}$ avec $T_{k} = \sum_{n=A_{k}}^{B_{k}} \frac{1}{n}$. La méthode des rectangles (proposition 6 (ii)), appliquée à $t \mapsto \frac{1}{t}$ à partir de $n_{0} = A_{k}$, donne 
    $$\ln\frac{B_{k} + 1}{A_{k}} \leqslant T_{k} \leqslant \frac{1}{A_{k}} + \ln\frac{B_{k}}{A_{k}}, \qquad\text{donc}\qquad 1 - \ln\big(1 + \mathrm{e}^{-k}\big) \leqslant T_{k} \leqslant 1 + \mathrm{e}^{-k}.$$
     Ainsi $\boxed{T_{k} \xrightarrow[k \to +\infty]{} 1}$ : pour $k = 8$, $T_{8} \approx 1{,}0002$ ✓. Les intervalles $I_{k}$ se suivent : en posant $a_{0} = 0$ et $a_{n} = \frac{(-1)^{\lfloor \ln n \rfloor}}{n}$ pour $n \geqslant 1$, ce sont les paquets de l'exercice 6, avec $\varphi(0) = 0$ et $\varphi(k) = A_{k}$ pour $k \geqslant 1$. Si la série convergeait, la question 1 de l'exercice 6 donnerait la convergence de la série des paquets $\sum (-1)^{k}T_{k}$, dont le terme général tendrait vers $0$ ; or $|(-1)^{k}T_{k}| = T_{k}$ tend vers $1$. 
    $$\boxed{\sum\nolimits_{n \geqslant 1} \frac{(-1)^{\lfloor \ln n \rfloor}}{n} \text{ diverge}}$$
     Le terme général tend pourtant vers $0$ et change de signe une infinité de fois : mais les plages de signe constant s'allongent si vite que chacune apporte une contribution voisine de $\pm 1$.

    **2.** Soit $f(t) = \frac{\sin(\ln t)}{t}$ sur $[1\,,+\infty[$, de sorte que le terme général est $a_{n} = (-1)^{n}f(n)$. La fonction $f$ est dérivable, avec 
    $$f'(t) = \frac{\cos(\ln t) - \sin(\ln t)}{t^{2}}, \qquad |f'(t)| \leqslant \frac{2}{t^{2}}.$$
     On regroupe les termes par paires : $a_{1} = -f(1) = 0$, et pour $p \geqslant 1$, l'inégalité des accroissements finis (chapitre 9, théorème 6) sur $[2p\,,2p + 1]$ donne 
    $$|a_{2p} + a_{2p+1}| = |f(2p) - f(2p + 1)| \leqslant \frac{2}{(2p)^{2}} = \frac{1}{2p^{2}}.$$
     Avec $a_{0} = 0$ et $\varphi(p) = 2p$, la série des paquets est absolument convergente (proposition 9), et la somme des modules dans chaque paquet, majorée par $|f(2p)| + |f(2p + 1)| \leqslant \frac{1}{p}$, tend vers $0$. La question 3 de l'exercice 6 donne la convergence. 
    $$\boxed{\sum\nolimits_{n \geqslant 1} (-1)^{n}\frac{\sin(\ln n)}{n} \text{ converge}}$$
     L'exercice 23 a montré que $\sum \frac{\sin(\ln n)}{n}$ diverge. La série étudiée ici n'est donc pas absolument convergente : sinon $\sum |f(n)|$ convergerait, et $\sum f(n)$ aussi (théorème 6). C'est l'alternance des signes, et elle seule, qui fait converger : les termes consécutifs $f(2p)$ et $f(2p + 1)$ sont si proches qu'ils se compensent presque, alors que dans l'exercice 23 les plages où $\sin(\ln n)$ garde un signe constant sont trop longues. Numériquement, les sommes partielles d'indices $10^{5}$ et $10^{6}$ valent $0{,}158\,09$ et $0{,}158\,10$.

    *Piège.* Le théorème 7 ne s'applique pas directement : la suite $(|f(n)|)$ n'est pas décroissante, puisque $|\sin(\ln n)|$ croît sur de longues plages. Le regroupement par paires remplace l'hypothèse de monotonie par une estimation de la différence de deux termes consécutifs.
- id: "ma-20-40"
  feuille: "f-ma-20"
  numero: 40
  partie: "Séries alternées"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 8
  page_corrige: 45
  enonce: |
    On veut calculer la somme de la série $\displaystyle\sum_{n \geqslant 1} (-1)^{n}\frac{\ln n}{n}$.

    **1.** Montrer que cette série converge.

    **2.** Montrer qu'il existe un réel $C$ tel que $\displaystyle\sum_{k=1}^{n} \frac{\ln k}{k} = \frac{(\ln n)^{2}}{2} + C + o(1)$.

    **3.** En séparant les indices pairs et impairs, exprimer la somme partielle $\displaystyle\sum_{k=1}^{2n} (-1)^{k}\frac{\ln k}{k}$ à l'aide de $H_{n}$ et de sommes de la forme $\sum_{k=1}^{m} \frac{\ln k}{k}$, puis montrer que 
    $$\sum_{n=1}^{+\infty} (-1)^{n}\frac{\ln n}{n} = \gamma\ln 2 - \frac{(\ln 2)^{2}}{2}.$$
  corrige: |
    **1.** Soit $g(t) = \frac{\ln t}{t}$ sur $[1\,,+\infty[$, de dérivée $g'(t) = \frac{1 - \ln t}{t^{2}}$, négative pour $t \geqslant \mathrm{e}$. La suite $\big(\frac{\ln n}{n}\big)_{n \geqslant 3}$ est donc décroissante, et elle tend vers $0$ par croissances comparées. Le théorème 7, appliqué à partir du rang $3$, donne 
    $$\boxed{\sum\nolimits_{n \geqslant 1} (-1)^{n}\frac{\ln n}{n} \text{ converge}}$$
     Elle n'est pas absolument convergente, puisque $\frac{\ln n}{n} \geqslant \frac{1}{n}$ pour $n \geqslant 3$.

    **2.** La fonction $g$ est continue, positive et décroissante sur $[3\,,+\infty[$. Pour calculer son intégrale, on reconnaît la forme $u'u$ avec $u = \ln$, de primitive $\frac{u^{2}}{2}$ : 
    $$\int_{3}^{n} \frac{\ln t}{t}\,\mathrm{d} t = \frac{(\ln n)^{2}}{2} - \frac{(\ln 3)^{2}}{2}.$$
     Par la proposition 6 (iii), avec $n_{0} = 3$, la suite $w_{n} = \sum_{k=3}^{n} \frac{\ln k}{k} - \int_{3}^{n} g$ converge vers un réel $w$. Comme le terme d'indice $1$ est nul, 
    $$\sum_{k=1}^{n} \frac{\ln k}{k} = \frac{\ln 2}{2} + w_{n} + \frac{(\ln n)^{2}}{2} - \frac{(\ln 3)^{2}}{2}, \qquad \boxed{\sum_{k=1}^{n} \frac{\ln k}{k} = \frac{(\ln n)^{2}}{2} + C + o(1)}$$
     avec $C = \frac{\ln 2}{2} - \frac{(\ln 3)^{2}}{2} + w$. Numériquement, $C \approx -0{,}0728$ ; la valeur de $C$ n'interviendra pas.

    **3.** On note $L_{m} = \sum_{k=1}^{m} \frac{\ln k}{k}$. Dans la somme partielle d'indice $2n$, les termes d'indice pair, $k = 2j$, sont comptés positivement et les autres négativement ; on les ajoute deux fois et on les retranche une fois : 
    $$\sum_{k=1}^{2n} (-1)^{k}\frac{\ln k}{k} = 2\sum_{j=1}^{n} \frac{\ln(2j)}{2j} - L_{2n} = \sum_{j=1}^{n} \frac{\ln 2 + \ln j}{j} - L_{2n}, \qquad \boxed{\sum_{k=1}^{2n} (-1)^{k}\frac{\ln k}{k} = H_{n}\ln 2 + L_{n} - L_{2n}}$$
     Par la question 2, puis la proposition 7, $H_{n} = \ln n + \gamma + o(1)$, 
    $$L_{n} - L_{2n} = \frac{(\ln n)^{2} - (\ln 2 + \ln n)^{2}}{2} + o(1) = -\ln 2\ln n - \frac{(\ln 2)^{2}}{2} + o(1),$$

    $$H_{n}\ln 2 + L_{n} - L_{2n} = \gamma\ln 2 - \frac{(\ln 2)^{2}}{2} + o(1).$$
     La constante $C$ et les termes en $\ln n$ disparaissent. La série converge par la question 1 ; sa somme est la limite de la suite extraite des sommes partielles d'indice pair : 
    $$\boxed{\sum_{n=1}^{+\infty} (-1)^{n}\frac{\ln n}{n} = \gamma\ln 2 - \frac{(\ln 2)^{2}}{2} \approx 0{,}159\,869}$$
     Une sommation numérique accélérée redonne cette valeur à $10^{-25}$ près ✓.

    *Piège.* La limite de $(S_{2n})$ ne suffit pas à elle seule : la suite $(S_{2n})$ peut converger sans que la série converge, comme pour $\sum (-1)^{n}$. C'est la question 1 qui permet de conclure, en garantissant que toute la suite $(S_{n})$ converge. Le calcul suit le même schéma que pour la série harmonique alternée, dont la somme partielle $S_{2n} = H_{2n} - H_{n}$ s'obtient aussi en séparant les indices pairs et impairs, et tend vers $\ln 2$ par la remarque qui suit la proposition 7.
- id: "ma-20-41"
  feuille: "f-ma-20"
  numero: 41
  partie: "Séries alternées"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries alternées, comparaison série-intégrale, développements asymptotiques]
  noeuds: [as-series, ri-proprietes, as-dl]
  notions: []
  page_enonce: 8
  page_corrige: 46
  enonce: |
    Pour $n \geqslant 1$, on note $S_{n} = \sum_{k=1}^{n} \frac{(-1)^{k-1}}{k}$ et $R_{n} = \ln 2 - S_{n}$.

    **1.** Montrer que $R_{n} = (-1)^{n}\displaystyle\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t$, puis que $\displaystyle\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t = \frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big)$.

    **2.** En déduire la nature de la série $\displaystyle\sum_{n \geqslant 1} \big(2 - \exp(S_{n})\big)$.
  corrige: |
    **1.** On écrit $\frac{1}{k}$ comme l'intégrale de $t^{k-1}$ sur $[0\,,1]$ et l'on somme une progression géométrique ; l'intégrale obtenue s'estime ensuite par une intégration par parties. Pour $t \in [0\,,1]$, la somme géométrique de raison $-t \neq 1$ donne 
    $$\sum_{k=1}^{n} (-1)^{k-1}t^{k-1} = \frac{1 - (-t)^{n}}{1 + t}.$$
     On intègre sur $[0\,,1]$, par linéarité, avec $\int_{0}^{1} t^{k-1}\,\mathrm{d} t = \frac{1}{k}$ et $\int_{0}^{1} \frac{\mathrm{d} t}{1 + t} = \ln 2$ : 
    $$S_{n} = \ln 2 - (-1)^{n}\int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t, \qquad\text{soit}\qquad \boxed{R_{n} = (-1)^{n}I_{n}, \quad I_{n} = \int_{0}^{1} \frac{t^{n}}{1 + t}\,\mathrm{d} t}$$
     On intègre par parties, en primitivant $t^{n}$ en $\frac{t^{n+1}}{n + 1}$ et en dérivant $\frac{1}{1 + t}$, les deux fonctions étant de classe $\mathcal{C}^{1}$ sur $[0\,,1]$ : 
    $$I_{n} = \Big[\frac{t^{n+1}}{(n + 1)(1 + t)}\Big]_{0}^{1} + \frac{1}{n + 1}\int_{0}^{1} \frac{t^{n+1}\,\mathrm{d} t}{(1 + t)^{2}} = \frac{1}{2(n + 1)} + \frac{J_{n}}{n + 1}, \qquad J_{n} = \int_{0}^{1} \frac{t^{n+1}\,\mathrm{d} t}{(1 + t)^{2}},$$
     où l'intégrale $J_{n}$ est encadrée par croissance de l'intégrale, puisque $\frac{1}{(1 + t)^{2}} \in [0\,,1]$ : 
    $$0 \leqslant J_{n} \leqslant \int_{0}^{1} t^{n+1}\,\mathrm{d} t = \frac{1}{n + 2}, \qquad \frac{J_{n}}{n + 1} = O\Big(\frac{1}{n^{2}}\Big), \qquad \frac{1}{2(n + 1)} = \frac{1}{2n} - \frac{1}{2n(n + 1)}.$$
     On en déduit : 
    $$\boxed{I_{n} = \frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big), \qquad R_{n} = \frac{(-1)^{n}}{2n} + O\Big(\frac{1}{n^{2}}\Big)}$$
     On contrôle : $n^{2}\big(I_{n} - \frac{1}{2n}\big) \approx -0{,}2500$ pour $n = 1\,000$ ✓.

    **2.** Comme $S_{n} = \ln 2 - R_{n}$, on a $\exp(S_{n}) = 2\mathrm{e}^{-R_{n}}$, et 
    $$2 - \exp(S_{n}) = 2\big(1 - \mathrm{e}^{-R_{n}}\big).$$
     Comme $R_{n}$ tend vers $0$, le développement $1 - \mathrm{e}^{-x} = x + O(x^{2})$ (chapitre 10, théorème 5) et $R_{n} = O\big(\frac{1}{n}\big)$ donnent 
    $$2 - \exp(S_{n}) = 2R_{n} + O(R_{n}^{2}) = \frac{(-1)^{n}}{n} + O\Big(\frac{1}{n^{2}}\Big).$$
     La série $\sum \frac{(-1)^{n}}{n}$ converge (théorème 7) et le reste est le terme général d'une série absolument convergente (proposition 9). Enfin $|2 - \exp(S_{n})| \sim \frac{1}{n}$ : la convergence n'est pas absolue. 
    $$\boxed{\sum\nolimits_{n \geqslant 1} \big(2 - \exp(S_{n})\big) \text{ est semi-convergente}}$$
     Ses sommes partielles d'indices $10^{5}$ et $10^{6}$ valent $-0{,}607\,80$ et $-0{,}607\,80$ ✓.

    *À retenir.* La seule majoration $|R_{n}| \leqslant \frac{1}{n + 1}$ du théorème 7 (ii) ne suffisait pas : elle montre seulement que le terme général est un $O\big(\frac{1}{n}\big)$, ce qui ne décide de rien. Il fallait le signe du reste, que donne aussi le théorème 7, et surtout son équivalent $\frac{1}{2n}$ avec un reste en $O\big(\frac{1}{n^{2}}\big)$, que fournit la représentation intégrale.
- id: "ma-20-42"
  feuille: "f-ma-20"
  numero: 42
  partie: "Séries alternées"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [séries alternées]
  noeuds: [as-series]
  notions: []
  page_enonce: 9
  page_corrige: 47
  enonce: |
    *La transformation d'Abel.* Soit $(u_{n})$ et $(v_{n})$ deux suites de nombres complexes, et $V_{n} = \sum_{k=0}^{n} v_{k}$.

    **1.** Montrer que, pour tout $n \in \mathbb{N}$, $\displaystyle\sum_{k=0}^{n} u_{k}v_{k} = u_{n+1}V_{n} - \sum_{k=0}^{n} (u_{k+1} - u_{k})V_{k}$.

    **2.** En déduire une nouvelle démonstration de la convergence dans le théorème des séries alternées.

    **3.** Plus généralement, on suppose que $(u_{n})$ est une suite réelle décroissante de limite nulle et que la suite $(V_{n})$ est bornée. Montrer que la série $\sum u_{n}v_{n}$ converge.

    **4.** Déterminer, en fonction des réels $\alpha$ et $\theta$, la nature de la série $\displaystyle\sum_{n \geqslant 1} \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n^{\alpha}}$.

    **5.** Montrer que la série $\sum_{n \geqslant 1} \frac{\cos n}{n}$ converge mais que la série $\sum_{n \geqslant 1} \frac{|\cos n|}{n}$ diverge. On pourra comparer $|\cos n|$ et $\cos^{2}n$. Qu'en est-il de $\sum_{n \geqslant 1} \frac{\sin n}{n}$ et de $\sum_{n \geqslant 1} \frac{|\sin n|}{n}$ ?
  corrige: |
    **1.** On pose $V_{-1} = 0$, de sorte que $v_{k} = V_{k} - V_{k-1}$ pour tout $k \in \mathbb{N}$. On développe, puis on décale l'indice dans la seconde somme : 
    $$\sum_{k=0}^{n} u_{k}v_{k} = \sum_{k=0}^{n} u_{k}V_{k} - \sum_{k=0}^{n} u_{k}V_{k-1} = \sum_{k=0}^{n} u_{k}V_{k} - \sum_{k=0}^{n-1} u_{k+1}V_{k}.$$
     On ajoute et on retranche $u_{n+1}V_{n}$, ce qui complète la seconde somme jusqu'à $k = n$ : 
    $$\boxed{\sum_{k=0}^{n} u_{k}v_{k} = u_{n+1}V_{n} - \sum_{k=0}^{n} (u_{k+1} - u_{k})V_{k}}$$
     C'est l'analogue discret de l'intégration par parties : $V$ joue le rôle d'une primitive de $v$, et $u_{k+1} - u_{k}$ celui de la dérivée de $u$.

    **2.** Soit $(a_{n})$ décroissante de limite nulle, donc positive. On applique la question 1 avec $u_{k} = a_{k}$ et $v_{k} = (-1)^{k}$ : $V_{k}$ vaut $1$ si $k$ est pair et $0$ sinon, donc $0 \leqslant V_{k} \leqslant 1$. Le terme $a_{n+1}V_{n}$ tend vers $0$. Pour la somme, $|(a_{k+1} - a_{k})V_{k}| \leqslant a_{k} - a_{k+1}$, et la série télescopique $\sum (a_{k} - a_{k+1})$, à termes positifs, converge (proposition 4), puisque $(a_{n})$ converge. La série $\sum (a_{k+1} - a_{k})V_{k}$ est donc absolument convergente (théorème 3), donc convergente (théorème 6). Les deux termes du membre de droite ont une limite : 
    $$\boxed{\sum\nolimits (-1)^{n}a_{n} \text{ converge}}$$
     Cette démonstration ne donne ni l'encadrement de la somme ni le signe du reste du théorème 7 : elle ne remplace que la partie « convergence ».

    **3.** Soit $M$ un majorant de $(|V_{n}|)$. La suite réelle $(u_{n})$ décroît vers $0$, donc $u_{k} - u_{k+1} \geqslant 0$. Le terme $u_{n+1}V_{n}$, produit d'une suite bornée et d'une suite de limite nulle, tend vers $0$. Enfin 
    $$\big|(u_{k+1} - u_{k})V_{k}\big| \leqslant M(u_{k} - u_{k+1}),$$
     terme général d'une série convergente, comme à la question 2. La transformation d'Abel conclut : 
    $$\boxed{(u_{n}) \text{ décroissante de limite nulle et } (V_{n}) \text{ bornée} \implies \sum\nolimits u_{n}v_{n} \text{ converge}}$$

    **4.** On distingue trois cas selon $\alpha$.

    • Si $\alpha \leqslant 0$, le terme général a pour module $n^{-\alpha} \geqslant 1$ : divergence grossière.

    • Si $\alpha > 1$, la série converge absolument (exemple qui suit la proposition 9).

    • Si $0 < \alpha \leqslant 1$ et $\theta \in 2\pi\mathbb{Z}$, le terme vaut $\frac{1}{n^{\alpha}}$, et la série diverge (théorème 5). Si $0 < \alpha \leqslant 1$ et $\theta \notin 2\pi\mathbb{Z}$, alors $\mathrm{e}^{\mathrm{i}\theta} \neq 1$, et la somme géométrique (chapitre 4, factorisation par l'angle moitié) donne 
    $$\Big|\sum_{k=1}^{n} \mathrm{e}^{\mathrm{i} k\theta}\Big| = \Big|\mathrm{e}^{\mathrm{i}\theta}\,\frac{1 - \mathrm{e}^{\mathrm{i} n\theta}}{1 - \mathrm{e}^{\mathrm{i}\theta}}\Big| \leqslant \frac{2}{|1 - \mathrm{e}^{\mathrm{i}\theta}|} = \frac{1}{|\sin(\theta/2)|}.$$
     Les sommes partielles de $(\mathrm{e}^{\mathrm{i} n\theta})_{n \geqslant 1}$ sont bornées et $\big(\frac{1}{n^{\alpha}}\big)_{n \geqslant 1}$ décroît vers $0$ : la question 3, appliquée aux suites $u_{k} = \frac{1}{(k + 1)^{\alpha}}$ et $v_{k} = \mathrm{e}^{\mathrm{i}(k+1)\theta}$, donne la convergence. Elle n'est pas absolue, puisque le module du terme vaut $\frac{1}{n^{\alpha}}$.

    $$\boxed{\sum\nolimits_{n \geqslant 1} \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n^{\alpha}} \text{ converge} \iff \alpha > 1, \text{ ou } 0 < \alpha \leqslant 1 \text{ et } \theta \notin 2\pi\mathbb{Z} \text{ (semi-convergence)}}$$
     Pour $\theta = 1$, la plus grande valeur de $\big|\sum_{k=1}^{n} \mathrm{e}^{\mathrm{i} k}\big|$ pour $n < 2\,000$ vaut $2{,}085\,83$, et la borne $\frac{1}{\sin(1/2)}$ vaut $2{,}085\,83$ : la majoration est presque atteinte ✓.

    **5.** Comme $0 < 1 < 2\pi$, on a $1 \notin 2\pi\mathbb{Z}$, et la série $\sum \frac{\mathrm{e}^{\mathrm{i} n}}{n}$ converge par la question 4. Ses parties réelle et imaginaire convergent donc (proposition 1 (iii)) : les séries $\sum \frac{\cos n}{n}$ et $\sum \frac{\sin n}{n}$ convergent.

    Pour les valeurs absolues, on utilise $|\cos n| \leqslant 1$, qui donne $|\cos n| \geqslant \cos^{2}n$, puis la linéarisation de $\cos^{2}n$ : 
    $$\frac{|\cos n|}{n} \geqslant \frac{\cos^{2}n}{n} = \frac{1}{2n} + \frac{\cos(2n)}{2n}.$$
     La série $\sum \frac{\cos(2n)}{2n}$ converge, par la question 4 avec $\theta = 2 \notin 2\pi\mathbb{Z}$, et la série $\sum \frac{1}{2n}$ diverge : leur somme diverge, et, comme elle est à termes positifs, la série $\sum \frac{|\cos n|}{n}$ diverge par le théorème 3. De même, $|\sin n| \geqslant \sin^{2}n = \frac{1 - \cos(2n)}{2}$ donne la divergence de $\sum \frac{|\sin n|}{n}$. 
    $$\boxed{\sum\nolimits \frac{\cos n}{n} \text{ et } \sum \frac{\sin n}{n} \text{ convergent}, \quad \sum \frac{|\cos n|}{n} \text{ et } \sum \frac{|\sin n|}{n} \text{ divergent}}$$

    *Piège.* L'erreur la plus répandue est de minorer $|\cos n|$ par une constante strictement positive, ce qui est faux, puisque $\cos n$ s'approche de $0$ pour une infinité d'entiers. Le passage par $\cos^{2}n$ contourne la difficulté : il remplace une minoration ponctuelle, impossible, par une minoration en moyenne, le terme $\cos(2n)$ ayant des sommes partielles bornées. On a ainsi deux nouvelles séries semi-convergentes, qui ne sont pas alternées : la transformation d'Abel étend le théorème 7 au-delà des signes alternés.
- id: "ma-20-43"
  feuille: "f-ma-20"
  numero: 43
  partie: "Séries alternées"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [séries alternées, développements asymptotiques]
  noeuds: [as-series, as-dl]
  notions: []
  page_enonce: 9
  page_corrige: 48
  enonce: |
    Soit $\alpha > 0$. On définit la suite $(u_{n})_{n \geqslant 1}$ par $u_{1} = 1$ et $u_{n+1} = \dfrac{\cos u_{n}}{n^{\alpha}}$ pour tout $n \geqslant 1$.

    **1.** Montrer que $u_{n} \in \,]0\,,1]$ pour tout $n$, que $(u_{n})$ tend vers $0$, et déterminer en fonction de $\alpha$ la nature de la série $\sum u_{n}$.

    **2.** Montrer que $u_{n} - u_{n+1} = O\Big(\dfrac{1}{n^{\alpha + 1}}\Big)$, puis que la suite $(u_{n})$ est décroissante à partir d'un certain rang. On pourra exprimer $u_{n+1} - u_{n+2}$ à l'aide de $u_{n} - u_{n+1}$.

    **3.** En déduire, en fonction de $\alpha$, la nature de la série $\sum (-1)^{n}u_{n}$.
  corrige: |
    **1.** Montrons par récurrence que $u_{n} \in \,]0\,,1]$. C'est vrai pour $u_{1} = 1$. Si $u_{n} \in \,]0\,,1] \subset \big]0\,,\frac{\pi}{2}\big[$, alors $\cos u_{n} \in \,]0\,,1]$, et, comme $n^{\alpha} \geqslant 1$, $u_{n+1} = \frac{\cos u_{n}}{n^{\alpha}} \in \,]0\,,1]$.

    On en déduit $0 < u_{n+1} \leqslant \frac{1}{n^{\alpha}}$, qui tend vers $0$ puisque $\alpha > 0$ : $\boxed{u_{n} \to 0}$. Alors $\cos u_{n}$ tend vers $1$, et 
    $$u_{n+1} \sim \frac{1}{n^{\alpha}}, \qquad\text{donc}\qquad u_{n} \sim \frac{1}{(n - 1)^{\alpha}} \sim \frac{1}{n^{\alpha}}.$$
     La série $\sum u_{n}$ est à termes positifs ; par les théorèmes 4 et 5, 
    $$\boxed{\sum\nolimits u_{n} \text{ converge} \iff \alpha > 1}$$

    **2.** On note $d_{n} = u_{n} - u_{n+1}$ et $\rho_{n} = \max(u_{n}, u_{n+1})$, qui tend vers $0$. On écrit $u_{n+2} = \frac{\cos u_{n+1}}{(n + 1)^{\alpha}}$, et l'on fait apparaître $\cos u_{n} - \cos u_{n+1}$ : 
    $$d_{n+1} = \frac{\cos u_{n}}{n^{\alpha}} - \frac{\cos u_{n+1}}{(n + 1)^{\alpha}} = \cos(u_{n})\Big(\frac{1}{n^{\alpha}} - \frac{1}{(n + 1)^{\alpha}}\Big) + \frac{\cos u_{n} - \cos u_{n+1}}{(n + 1)^{\alpha}}. \tag{$\ast$}$$
     Deux estimations servent. D'abord, l'égalité des accroissements finis (chapitre 9, théorème 5), appliquée à $t \mapsto t^{-\alpha}$ sur $[n\,,n + 1]$, fournit $c \in \,]n\,,n + 1[$ tel que $\frac{1}{n^{\alpha}} - \frac{1}{(n + 1)^{\alpha}} = \frac{\alpha}{c^{\alpha + 1}}$, d'où 
    $$\frac{\alpha}{(n + 1)^{\alpha + 1}} \leqslant \frac{1}{n^{\alpha}} - \frac{1}{(n + 1)^{\alpha}} \leqslant \frac{\alpha}{n^{\alpha + 1}}.$$
     Ensuite, l'inégalité des accroissements finis (chapitre 9, théorème 6), appliquée à $\cos$ entre $u_{n+1}$ et $u_{n}$, où $|\sin x| \leqslant x \leqslant \rho_{n}$, donne $|\cos u_{n} - \cos u_{n+1}| \leqslant \rho_{n}|d_{n}|$.

    *Domination.* Par $(\ast)$, $|d_{n+1}| \leqslant \frac{\alpha}{n^{\alpha + 1}} + \rho_{n}|d_{n}|$. On pose $D_{n} = n^{\alpha + 1}|d_{n}|$ ; en multipliant par $(n + 1)^{\alpha + 1} \leqslant 2^{\alpha + 1}n^{\alpha + 1}$, 
    $$D_{n+1} \leqslant 2^{\alpha + 1}\big(\alpha + \rho_{n}D_{n}\big).$$
     Soit $N$ tel que $2^{\alpha + 1}\rho_{n} \leqslant \frac{1}{2}$ pour $n \geqslant N$, et $M = \max\big(D_{N}, 2^{\alpha + 2}\alpha\big)$. Si $D_{n} \leqslant M$ pour un $n \geqslant N$, alors $D_{n+1} \leqslant 2^{\alpha + 1}\alpha + \frac{M}{2} \leqslant \frac{M}{2} + \frac{M}{2} = M$. Par récurrence, $D_{n} \leqslant M$ pour tout $n \geqslant N$ : 
    $$\boxed{u_{n} - u_{n+1} = O\Big(\frac{1}{n^{\alpha + 1}}\Big)}$$

    *Décroissance.* On revient à $(\ast)$ : le premier terme est au moins $\cos(1)\frac{\alpha}{(n + 1)^{\alpha + 1}}$, puisque $u_{n} \leqslant 1$, et le second est majoré en valeur absolue par $\rho_{n}|d_{n}| \leqslant \frac{\rho_{n}M}{n^{\alpha + 1}}$ pour $n \geqslant N$. Ainsi 
    $$(n + 1)^{\alpha + 1}d_{n+1} \geqslant \alpha\cos 1 - 2^{\alpha + 1}\rho_{n}M \xrightarrow[n \to +\infty]{} \alpha\cos 1 > 0.$$
     Le membre de droite est strictement positif à partir d'un certain rang, donc $d_{n+1} > 0$ : la suite $(u_{n})$ est décroissante à partir d'un certain rang. Le même calcul montre d'ailleurs que $d_{n+1} \sim \frac{\alpha}{n^{\alpha + 1}}$, puisque $\cos u_{n} \to 1$. Numériquement, $(u_{n})$ décroît à partir de $n = 9$ pour $\alpha = 0{,}1$, de $n = 5$ pour $\alpha = 0{,}2$, de $n = 3$ pour $\alpha = \frac{1}{2}$, et dès $n = 1$ pour $\alpha \geqslant 1$ ✓.

    **3.** À partir d'un certain rang, $(u_{n})$ est décroissante et de limite nulle : le théorème 7, appliqué à partir de ce rang, donne la convergence. La convergence absolue est celle de $\sum u_{n}$, étudiée à la question 1. 
    $$\boxed{\sum\nolimits (-1)^{n}u_{n} \text{ converge pour tout } \alpha > 0, \text{ absolument si et seulement si } \alpha > 1}$$

    *Piège.* L'erreur la plus répandue est de partir d'un développement de $u_{n}$. Comme $u_{n} = O\big(\frac{1}{n^{\alpha}}\big)$, 
    $$u_{n+1} = \frac{1}{n^{\alpha}}\Big(1 - \frac{u_{n}^{2}}{2} + O(u_{n}^{4})\Big) = \frac{1}{n^{\alpha}} + O\Big(\frac{1}{n^{3\alpha}}\Big), \qquad (-1)^{n}u_{n} = \frac{(-1)^{n}}{(n - 1)^{\alpha}} + O\Big(\frac{1}{n^{3\alpha}}\Big),$$
     et le reste n'est le terme d'une série absolument convergente que si $3\alpha > 1$. Pousser le développement ne fait que déplacer le seuil, en $\frac{1}{5}$, puis $\frac{1}{7}$, et ainsi de suite, sans jamais couvrir tous les $\alpha > 0$. L'argument de monotonie, lui, règle tous les cas d'un coup : quand le théorème 7 s'applique, il est plus fort qu'un développement.
- id: "ma-20-44"
  feuille: "f-ma-20"
  numero: 44
  partie: "Séries alternées"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [séries alternées, séries de Riemann, convergence absolue]
  noeuds: [as-series]
  notions: [serie-absolument-convergente]
  page_enonce: 9
  page_corrige: 49
  enonce: |
    *Le théorème de réarrangement de Riemann.* Le cours a admis ce théorème à la section 20.5 ; on le démontre ici. Soit $\sum u_{n}$ une série réelle semi-convergente, c'est-à-dire convergente mais non absolument convergente, et $S \in \mathbb{R} \cup \{-\infty, +\infty\}$.

    **1.** Montrer que les séries $\sum u_{n}^{+}$ et $\sum u_{n}^{-}$ divergent toutes les deux. En déduire que l'ensemble $P$ des indices $n$ tels que $u_{n} \geqslant 0$ et l'ensemble $N$ des indices $n$ tels que $u_{n} < 0$ sont infinis.

    **2.** On suppose $S$ réel. On construit une suite d'indices $\varphi(0)$, $\varphi(1)$, … en prenant, dans l'ordre croissant, des indices de $P$ jusqu'à ce que la somme des termes choisis dépasse strictement $S$, puis des indices de $N$, dans l'ordre croissant, jusqu'à ce qu'elle redevienne inférieure ou égale à $S$, et ainsi de suite. Justifier que cette construction ne s'arrête jamais, et que $\varphi$ est une bijection de $\mathbb{N}$ sur $\mathbb{N}$.

    **3.** Montrer que $\sum_{k=0}^{n} u_{\varphi(k)}$ tend vers $S$ quand $n$ tend vers $+\infty$. On majorera l'écart à $S$ à l'aide des termes $u_{\varphi(k)}$ qui précèdent un changement de signe.

    **4.** Adapter la construction au cas où $S = +\infty$.
  corrige: |
    **1.** Supposons que $\sum u_{n}^{+}$ converge. Comme $u_{n}^{-} = u_{n}^{+} - u_{n}$ et que $\sum u_{n}$ converge, la série $\sum u_{n}^{-}$ converge par linéarité (proposition 1), puis $\sum |u_{n}| = \sum (u_{n}^{+} + u_{n}^{-})$ aussi : la série serait absolument convergente, ce qui est exclu. De même, si $\sum u_{n}^{-}$ convergeait, $u_{n}^{+} = u_{n} + u_{n}^{-}$ donnerait la convergence de $\sum u_{n}^{+}$, puis celle de $\sum |u_{n}|$. 
    $$\boxed{\sum\nolimits u_{n}^{+} \text{ et } \sum u_{n}^{-} \text{ divergent}}$$
     Si $P$ était fini, $u_{n}^{+}$ serait nul à partir d'un certain rang, et $\sum u_{n}^{+}$ convergerait ; de même pour $N$ et $u_{n}^{-}$. Les ensembles $P$ et $N$ sont donc infinis. On note $p_{0} < p_{1} < \cdots$ les éléments de $P$ et $n_{0} < n_{1} < \cdots$ ceux de $N$, rangés dans l'ordre croissant. Les termes $u_{n}^{+}$ sont nuls hors de $P$ et valent $u_{p_{j}}$ en $p_{j}$ : par la proposition 10, $\sum_{j=0}^{+\infty} u_{p_{j}} = \sum_{n=0}^{+\infty} u_{n}^{+} = +\infty$, et de même $\sum_{j=0}^{+\infty} |u_{n_{j}}| = +\infty$. Retirer un nombre fini de termes ne change pas cette divergence. Enfin $u_{n}$ tend vers $0$, puisque la série converge (proposition 2).

    **2.** La construction se formule ainsi : on note $T_{k} = \sum_{j=0}^{k-1} u_{\varphi(j)}$ la somme des termes déjà choisis ($T_{0} = 0$) ; si $T_{k} \leqslant S$, on prend pour $\varphi(k)$ le plus petit élément de $P$ non encore utilisé, et si $T_{k} > S$, le plus petit élément de $N$ non encore utilisé. C'est exactement la règle de l'énoncé.

    *La construction ne s'arrête jamais.* Comme $P$ et $N$ sont infinis, il reste toujours des indices non utilisés dans chacun : $\varphi(k)$ est défini pour tout $k$.

    *On change de camp une infinité de fois.* Supposons qu'à partir d'un rang $K$, on ne prenne plus que des indices de $P$. Ce sont alors les éléments consécutifs $p_{J}, p_{J+1}, \dots$ de $P$, et $T_{k} = T_{K} + \sum_{j=J}^{J + k - K - 1} u_{p_{j}}$ tend vers $+\infty$ par la question 1 ; mais on ne choisit un indice de $P$ que si $T_{k} \leqslant S$, ce qui est contradictoire. De même, si l'on ne prenait plus que des indices de $N$, on aurait $T_{k} > S$ pour tout $k \geqslant K$, alors que $T_{k}$ tend vers $-\infty$.

    *Bijectivité.* L'application $\varphi$ est injective : un indice n'est jamais choisi deux fois, puisque l'on prend un indice non encore utilisé. Les indices de $P$ sont choisis dans l'ordre croissant, et une infinité le sont : le $j$-ième choisi est $p_{j}$, et tout élément de $P$ est atteint. De même pour $N$. Comme $P \cup N = \mathbb{N}$, l'application $\varphi$ est surjective. 
    $$\boxed{\varphi \text{ est une bijection de } \mathbb{N} \text{ sur } \mathbb{N}}$$

    **3.** *Chaque terme rapproche de $S$, sauf au moment d'un franchissement.* Soit $k \in \mathbb{N}$. Si $T_{k} \leqslant S$, on ajoute $u_{\varphi(k)} \geqslant 0$ ; si $T_{k} > S$, on ajoute $u_{\varphi(k)} < 0$. Dans les deux cas, si $T_{k}$ et $T_{k+1}$ sont du même côté de $S$ (au sens : tous deux $\leqslant S$, ou tous deux $> S$), alors $|T_{k+1} - S| \leqslant |T_{k} - S|$. S'ils sont de part et d'autre, on dit qu'il y a franchissement au rang $k + 1$ ; comme $S$ est alors compris entre $T_{k}$ et $T_{k+1} = T_{k} + u_{\varphi(k)}$, 
    $$|T_{k+1} - S| \leqslant |u_{\varphi(k)}|.$$
     *Majoration de l'écart.* Par la question 2, il y a une infinité de franchissements. Pour $k$ supérieur au premier rang de franchissement, on note $f(k) \leqslant k$ le dernier rang de franchissement inférieur ou égal à $k$. Entre $f(k)$ et $k$, il n'y a pas de franchissement, donc l'écart à $S$ ne fait que décroître : 
    $$\boxed{|T_{k} - S| \leqslant |T_{f(k)} - S| \leqslant |u_{\varphi(f(k) - 1)}|}$$
     Le terme $u_{\varphi(f(k) - 1)}$ est le dernier terme qui précède un changement de signe des termes choisis, comme le suggérait l'énoncé.

    *Passage à la limite.* La suite $(f(k))$ est croissante au sens large et tend vers $+\infty$, puisque les franchissements sont en nombre infini. Il reste à voir que $u_{\varphi(m)}$ tend vers $0$ quand $m$ tend vers $+\infty$. Soit $\varepsilon > 0$ ; l'ensemble $A = \{n \mid |u_{n}| \geqslant \varepsilon\}$ est fini, puisque $u_{n} \to 0$, et son image réciproque $\varphi^{-1}(A)$ aussi, puisque $\varphi$ est injective : pour $m$ supérieur au plus grand élément de $\varphi^{-1}(A)$, $|u_{\varphi(m)}| < \varepsilon$. Ainsi $T_{k}$ tend vers $S$ : 
    $$\boxed{\sum_{k=0}^{+\infty} u_{\varphi(k)} = S}$$

    ![Figure](documents/figures/87b1ab2bad905620.svg)

    La figure montre les sommes $T_{k}$, pour $k$ de $1$ à $30$, lorsque l'on réordonne la série harmonique alternée $1 - \frac{1}{2} + \frac{1}{3} - \cdots$, de somme $\ln 2$, pour viser $S = 1{,}2$. Les points bleus sont sous la droite, et l'on y ajoute un terme positif ; les points ocre sont au-dessus, et l'on y ajoute un terme négatif. Les sauts au moment des franchissements, qui majorent l'écart à $S$, diminuent au fil des termes. L'ordre obtenu commence par $u_{0}, u_{2}, u_{1}, u_{4}, u_{6}, u_{8}, u_{3}, \dots$, et $T_{60\,000} \approx 1{,}199\,998$ ✓.

    **4.** Pour $S = +\infty$, on vise des paliers croissants. On prend des indices de $P$, dans l'ordre croissant, jusqu'à ce que la somme dépasse strictement $1$, puis un seul indice de $N$ ; puis des indices de $P$ (éventuellement aucun) jusqu'à ce que la somme dépasse strictement $2$, puis un seul indice de $N$, et ainsi de suite, le palier $m$ étant suivi du palier $m + 1$.

    Chaque phase positive s'achève, puisque les termes de $P$ restants ont une somme infinie (question 1). On prend un indice de $N$ par palier, donc une infinité ; et une infinité d'indices de $P$, sinon la somme ne ferait que décroître à partir d'un certain rang tout en devant dépasser chaque palier. Comme à la question 2, $\varphi$ est une bijection de $\mathbb{N}$ sur $\mathbb{N}$.

    Soit $c = \sup_{n} |u_{n}|$, fini puisque $(u_{n})$ converge, et $m \geqslant 1$. Soit $k$ un rang postérieur au premier dépassement du palier $m$, et $m' \geqslant m$ le dernier palier dépassé avant le rang $k$. Si $T_{k}$ est la somme obtenue au moment de ce dépassement, $T_{k} > m'$. Sinon, $T_{k}$ s'obtient à partir de cette somme en ajoutant l'unique terme négatif $u_{n}$ du palier, puis des termes positifs : $T_{k} \geqslant m' + u_{n} \geqslant m' - c$. Dans tous les cas, $T_{k} \geqslant m - c$ pour $k$ assez grand, et ceci pour tout $m$ : 
    $$\boxed{\sum_{k=0}^{+\infty} u_{\varphi(k)} = +\infty}$$
     Le cas $S = -\infty$ s'en déduit en échangeant les rôles de $P$ et $N$.

    *À retenir.* Toute la démonstration repose sur deux faits : les termes positifs et les termes négatifs ont chacun une somme infinie, ce qui permet de franchir $S$ aussi souvent qu'on le veut, et le terme général tend vers $0$, ce qui rend les franchissements de plus en plus fins. Pour une série absolument convergente, le premier fait tombe, et la proposition 13 (iv) du cours montre que l'ordre est alors indifférent.
- id: "ma-20-45"
  feuille: "f-ma-20"
  numero: 45
  partie: "Familles sommables de réels positifs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [familles sommables positives, familles sommables]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 51
  enonce: |
    Les familles suivantes sont-elles sommables ? Lorsque c'est le cas, on calculera la somme de la première. 
    $$\text{(a)}\ \ \Big(\frac{2^{n}3^{m}}{(n + m)!}\Big)_{(n,m) \in \mathbb{N}^{2}}, \qquad \text{(b)}\ \ \Big(\frac{1}{|n^{2} - m^{2}|}\Big)_{\substack{(n,m) \in (\mathbb{N}^{*})^{2} \\ n \neq m}}, \qquad \text{(c)}\ \ \Big(\frac{1}{r^{2}}\Big)_{r \in \mathbb{Q} \cap \,]1, +\infty[}.$$
  corrige: |
    Les trois familles sont positives : on calcule leur somme dans $[0\,,+\infty]$, par paquets (théorème 8) ou par lignes (théorème 9), et la sommabilité se lit sur le résultat.

    **(a)** On regroupe les couples selon la valeur de $k = n + m$. Le paquet $\{(n, m) \mid n + m = k\}$ contient les $k + 1$ couples $(n, k - n)$, $0 \leqslant n \leqslant k$, et la somme géométrique de raison $\frac{2}{3}$ (théorème 1) donne 
    $$\sum_{n=0}^{k} \frac{2^{n}3^{k-n}}{k!} = \frac{3^{k}}{k!}\sum_{n=0}^{k} \Big(\frac{2}{3}\Big)^{n} = \frac{3^{k}}{k!} \cdot \frac{1 - (2/3)^{k+1}}{1/3} = \frac{3^{k+1} - 2^{k+1}}{k!}.$$
     Par le théorème 8, puis le théorème 2 (série exponentielle) et la linéarité, les deux séries étant convergentes, 
    $$\sum_{(n,m) \in \mathbb{N}^{2}} \frac{2^{n}3^{m}}{(n + m)!} = 3\sum_{k=0}^{+\infty} \frac{3^{k}}{k!} - 2\sum_{k=0}^{+\infty} \frac{2^{k}}{k!} = 3\mathrm{e}^{3} - 2\mathrm{e}^{2}.$$

    $$\boxed{\text{la famille (a) est sommable, de somme } 3\mathrm{e}^{3} - 2\mathrm{e}^{2} \approx 45{,}478}$$
     La somme des termes pour $n$, $m < 80$ redonne $45{,}478\,498\,57$ ✓.

    **(b)** On somme par lignes (théorème 9). Pour $n \geqslant 1$ fixé, la ligne contient le terme $m = n + 1$, qui vaut $\frac{1}{(n + 1)^{2} - n^{2}} = \frac{1}{2n + 1}$ ; par positivité, la somme de la ligne est au moins $\frac{1}{2n + 1}$ (proposition 10 (iii)). Comme $\sum \frac{1}{2n + 1}$ diverge (théorème 4, $\frac{1}{2n + 1} \sim \frac{1}{2n}$), 
    $$\sum_{\substack{(n,m) \in (\mathbb{N}^{*})^{2} \\ n \neq m}} \frac{1}{|n^{2} - m^{2}|} \geqslant \sum_{n=1}^{+\infty} \frac{1}{2n + 1} = +\infty, \qquad \boxed{\text{la famille (b) n'est pas sommable}}$$
     Chaque ligne est pourtant de somme finie, puisque ses termes sont équivalents à $\frac{1}{m^{2}}$ : c'est la somme des lignes qui diverge, comme dans la remarque de la section 20.6.4.

    **(c)** Les rationnels $r_{q} = 1 + \frac{1}{q}$, pour $q \geqslant 1$, sont deux à deux distincts et appartiennent à $\mathbb{Q} \cap \,]1\,,2]$, donc vérifient $\frac{1}{r_{q}^{2}} \geqslant \frac{1}{4}$. Pour tout $N$, la partie finie $\{r_{1}, \dots, r_{N}\}$ donne une somme finie au moins égale à $\frac{N}{4}$ : la borne supérieure des sommes finies est $+\infty$. 
    $$\boxed{\text{la famille (c) n'est pas sommable}}$$

    *Piège.* Pour (c), l'erreur la plus répandue est de comparer avec la série $\sum \frac{1}{n^{2}}$, comme si les rationnels étaient espacés comme les entiers. Or ils s'accumulent : il y en a une infinité dans $]1\,,2]$, où le terme reste supérieur à $\frac{1}{4}$. En général, une famille positive sommable n'a, pour tout $\varepsilon > 0$, qu'un nombre fini de termes supérieurs à $\varepsilon$ : si $F$ est une partie finie de tels indices, $\varepsilon\,\operatorname{card} F \leqslant \sum_{F} u_{i} \leqslant \sum_{I} u_{i}$.
- id: "ma-20-46"
  feuille: "f-ma-20"
  numero: 46
  partie: "Familles sommables de réels positifs"
  etoiles: 1
