  mots_cles: [familles sommables positives, familles sommables, fonction zêta]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 52
  enonce: |
    Pour quelles valeurs du réel $\alpha$ la famille $\Big(\dfrac{1}{n^{\alpha p}}\Big)_{n \geqslant 2,\, p \geqslant 2}$ est-elle sommable ? Comparer avec l'exemple du cours où l'on calcule $\sum_{n=2}^{+\infty} \big(\zeta(n) - 1\big)$.
  corrige: |
    Si $\alpha \leqslant 0$, tous les termes valent au moins $1$, et la famille, infinie, n'est pas sommable. Supposons $\alpha > 0$. Par le théorème 9, on somme d'abord en $p$, pour $n \geqslant 2$ fixé : c'est une série géométrique de raison $n^{-\alpha} \in \,]0\,,1[$ (théorème 1), 
    $$\sum_{p=2}^{+\infty} \frac{1}{n^{\alpha p}} = \frac{n^{-2\alpha}}{1 - n^{-\alpha}} = \frac{1}{n^{\alpha}(n^{\alpha} - 1)} \sim \frac{1}{n^{2\alpha}}.$$
     Par les théorèmes 4 et 5, la série de ces sommes converge si et seulement si $2\alpha > 1$. 
    $$\boxed{\Big(\frac{1}{n^{\alpha p}}\Big)_{n \geqslant 2,\, p \geqslant 2} \text{ est sommable} \iff \alpha > \frac{1}{2}}$$
     Pour $\alpha = 1$, c'est, à l'échange des noms des indices près, la famille $\big(\frac{1}{k^{n}}\big)_{n \geqslant 2,\, k \geqslant 2}$ de l'exemple du cours, et l'on retrouve $\sum_{n=2}^{+\infty} \frac{1}{n(n - 1)} = 1 = \sum_{n=2}^{+\infty} \big(\zeta(n) - 1\big)$. En sommant dans l'autre ordre, on obtient pour $\alpha > \frac{1}{2}$ l'identité $\sum_{p=2}^{+\infty} \big(\zeta(\alpha p) - 1\big) = \sum_{n=2}^{+\infty} \frac{1}{n^{\alpha}(n^{\alpha} - 1)}$, où l'on note $\zeta(s) = \sum_{k=1}^{+\infty} \frac{1}{k^{s}}$ pour $s > 1$.

    *À retenir.* Le seuil $\alpha > \frac{1}{2}$ se lit sur la seule colonne $p = 2$, dont la somme est $\zeta(2\alpha) - 1$ : elle est finie si et seulement si $2\alpha > 1$, et les autres colonnes sont plus petites. Pour $\alpha \leqslant \frac{1}{2}$, l'identité précédente n'a plus de sens, puisque $\zeta(2\alpha)$ n'est pas défini.
- id: "ma-20-47"
  feuille: "f-ma-20"
  numero: 47
  partie: "Familles sommables de réels positifs"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [familles sommables positives]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 52
  enonce: |
    **1.** Soit $\sum_{n \geqslant 1} a_{n}$ une série convergente à termes positifs. Montrer que la série de terme général 
    $$b_{p} = p\sum_{n=p}^{+\infty} \frac{a_{n}}{n(n + 1)}, \qquad p \geqslant 1,$$
     converge, et calculer sa somme en fonction de celle de $\sum a_{n}$.

    **2.** Soit $p \geqslant 2$ un entier. Calculer $\displaystyle\sum_{m=1}^{+\infty}\,\sum_{n=m}^{+\infty} \frac{1}{n^{p+1}}$.
  corrige: |
    **1.** On considère la famille positive $\big(w_{p,n}\big)$ indexée par $(\mathbb{N}^{*})^{2}$, avec $w_{p,n} = \frac{p\,a_{n}}{n(n + 1)}$ si $p \leqslant n$ et $w_{p,n} = 0$ sinon. Le théorème 9 permet d'intervertir les sommes dans $[0\,,+\infty]$. En sommant d'abord en $n$, on trouve $\sum_{n} w_{p,n} = b_{p}$ ; en sommant d'abord en $p$, on trouve, pour $n$ fixé, 
    $$\sum_{p=1}^{n} \frac{p\,a_{n}}{n(n + 1)} = \frac{a_{n}}{n(n + 1)} \cdot \frac{n(n + 1)}{2} = \frac{a_{n}}{2}.$$
     Ainsi $\sum_{p} b_{p} = \frac{1}{2}\sum_{n} a_{n}$ dans $[0\,,+\infty]$ ; le second membre est fini, donc la série à termes positifs $\sum b_{p}$ converge (proposition 10 (ii)) : 
    $$\boxed{\sum\nolimits b_{p} \text{ converge et } \sum_{p=1}^{+\infty} b_{p} = \frac{1}{2}\sum_{n=1}^{+\infty} a_{n}}$$
     Pour $a_{n} = \frac{1}{n^{2}}$, on trouve numériquement $0{,}822\,467$, qui est bien $\frac{\pi^{2}}{12}$ ✓.

    **2.** Le même échange, pour la famille positive $\big(\frac{1}{n^{p+1}}\big)_{1 \leqslant m \leqslant n}$, donne dans $[0\,,+\infty]$, puisque l'indice $m$ prend $n$ valeurs pour $n$ fixé, 
    $$\sum_{m=1}^{+\infty}\,\sum_{n=m}^{+\infty} \frac{1}{n^{p+1}} = \sum_{n=1}^{+\infty}\,\sum_{m=1}^{n} \frac{1}{n^{p+1}} = \sum_{n=1}^{+\infty} \frac{n}{n^{p+1}}, \qquad \boxed{\sum_{m=1}^{+\infty}\,\sum_{n=m}^{+\infty} \frac{1}{n^{p+1}} = \zeta(p)}$$
     qui est fini puisque $p \geqslant 2$ (théorème 5). Pour $p = 2$, on obtient $\frac{\pi^{2}}{6}$ par la proposition 8 ✓. Pour $p = 1$, le même calcul donne $+\infty$ : chaque reste $\sum_{n=m}^{+\infty} \frac{1}{n^{2}}$ est équivalent à $\frac{1}{m}$ (théorème 5), et leur somme diverge comme la série harmonique.
- id: "ma-20-48"
  feuille: "f-ma-20"
  numero: 48
  partie: "Familles sommables de réels positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [familles sommables positives, familles sommables]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 53
  enonce: |
    Donner une condition nécessaire et suffisante sur le réel $\alpha$ pour que la famille $\Big(\dfrac{1}{p^{\alpha} + q^{\alpha}}\Big)_{(p,q) \in (\mathbb{N}^{*})^{2}}$ soit sommable. On pourra regrouper les couples $(p, q)$ selon la valeur de $\max(p, q)$.
  corrige: |
    Si $\alpha \leqslant 0$, on a $p^{\alpha} + q^{\alpha} \leqslant 2$, et tous les termes valent au moins $\frac{1}{2}$ : la famille n'est pas sommable. Supposons $\alpha > 0$, et notons $M = \max(p, q)$. Par croissance de $t \mapsto t^{\alpha}$, 
    $$M^{\alpha} \leqslant p^{\alpha} + q^{\alpha} \leqslant 2M^{\alpha}, \qquad\text{donc}\qquad \frac{1}{2M^{\alpha}} \leqslant \frac{1}{p^{\alpha} + q^{\alpha}} \leqslant \frac{1}{M^{\alpha}}.$$
     Pour $N \geqslant 1$, le paquet $J_{N} = \{(p, q) \mid \max(p, q) = N\}$ contient $2N - 1$ couples : les $N$ couples $(N, q)$ avec $q \leqslant N$ et les $N - 1$ couples $(p, N)$ avec $p < N$.

    ![Figure](documents/figures/8e4a35b416c27b8f.svg)

    Les points bleus sont les indices $(p, q)$, et chaque équerre ocre réunit les $2N - 1$ indices du paquet $\max(p, q) = N$ ; on y lit que le paquet $N = 4$ compte $4 + 3 = 7$ couples. Sur chaque équerre, le terme général est comparable à $\frac{1}{N^{\alpha}}$, à un facteur $2$ près.

    Par le théorème 8 et la croissance (proposition 10 (iii)), la somme de la famille est comprise, dans $[0\,,+\infty]$, entre 
    $$\sum_{N=1}^{+\infty} \frac{2N - 1}{2N^{\alpha}} \qquad\text{et}\qquad \sum_{N=1}^{+\infty} \frac{2N - 1}{N^{\alpha}}.$$
     Ces deux séries ont pour terme général un équivalent de $\frac{1}{N^{\alpha - 1}}$ et $\frac{2}{N^{\alpha - 1}}$ : elles convergent si et seulement si $\alpha - 1 > 1$ (théorèmes 4 et 5). 
    $$\boxed{\Big(\frac{1}{p^{\alpha} + q^{\alpha}}\Big)_{(p,q) \in (\mathbb{N}^{*})^{2}} \text{ est sommable} \iff \alpha > 2}$$
     On retrouve le seuil de la famille $\big(\frac{1}{(p + q)^{\alpha}}\big)$ de la section 20.6.4, et ce n'est pas un hasard : on a $M \leqslant p + q \leqslant 2M$, et les trois quantités $p^{\alpha} + q^{\alpha}$, $(p + q)^{\alpha}$ et $\max(p, q)^{\alpha}$ sont comparables à des constantes près. En dimension deux, le nombre d'indices « à distance $N$ » de l'origine croît comme $N$, d'où le seuil $2$ au lieu de $1$.
- id: "ma-20-49"
  feuille: "f-ma-20"
  numero: 49
  partie: "Familles sommables de réels positifs"
  etoiles: 2
  types: [Calcul]
  mots_cles: [familles sommables positives, fonction zêta]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 54
  enonce: |
    Pour deux entiers $p$, $q \geqslant 1$, on note $p \wedge q$ leur PGCD. Calculer, en fonction de $\zeta(2)$ et de $\zeta(4)$, la somme 
    $$\sum_{\substack{(p,q) \in (\mathbb{N}^{*})^{2} \\ p \wedge q = 1}} \frac{1}{p^{2}q^{2}}.$$
     On pourra regrouper les couples $(p, q) \in (\mathbb{N}^{*})^{2}$ selon la valeur de $p \wedge q$. En admettant que $\zeta(4) = \frac{\pi^{4}}{90}$, donner la valeur de cette somme.
  corrige: |
    On regroupe les couples $(p, q) \in (\mathbb{N}^{*})^{2}$ selon la valeur de $d = p \wedge q \geqslant 1$, en notant $I_{d}$ le paquet correspondant. Si $p \wedge q = d$, on écrit $p = dp'$ et $q = dq'$, et la proposition 5 du chapitre 12 donne $d = d(p' \wedge q')$, soit $p' \wedge q' = 1$. Réciproquement, si $p' \wedge q' = 1$, alors $(dp') \wedge (dq') = d$. L'application $(p', q') \mapsto (dp', dq')$ est donc une bijection de $I_{1}$ sur $I_{d}$, et, par la proposition 10 (iv) et la proposition 11, la somme de la famille sur $I_{d}$ vaut 
    $$\sum_{(p, q) \in I_{d}} \frac{1}{p^{2}q^{2}} = \sum_{(p', q') \in I_{1}} \frac{1}{d^{4}p'^{2}q'^{2}} = \frac{S}{d^{4}}, \qquad\text{où}\qquad S = \sum_{\substack{(p,q) \in (\mathbb{N}^{*})^{2} \\ p \wedge q = 1}} \frac{1}{p^{2}q^{2}}.$$
     La somme sur $(\mathbb{N}^{*})^{2}$ entier vaut $\zeta(2)^{2}$ (premier exemple de la méthode de la section 20.6.3). Par le théorème 8, dans $[0\,,+\infty]$, 
    $$\zeta(2)^{2} = \sum_{d=1}^{+\infty} \frac{S}{d^{4}} = S\,\zeta(4).$$
     Le réel $S$ est fini, puisque $S \leqslant \zeta(2)^{2}$ par la proposition 10 (iii), et l'on peut diviser par $\zeta(4) > 0$ : 
    $$\boxed{S = \frac{\zeta(2)^{2}}{\zeta(4)}} \qquad\text{et, avec } \zeta(2) = \frac{\pi^{2}}{6},\ \zeta(4) = \frac{\pi^{4}}{90} : \qquad \boxed{S = \frac{\pi^{4}/36}{\pi^{4}/90} = \frac{5}{2}}$$
     La somme des termes pour $p$, $q \leqslant 3\,000$ vaut $2{,}4991$ ✓. Le résultat se lit ainsi : les couples premiers entre eux portent la fraction $\frac{1}{\zeta(4)} = \frac{90}{\pi^{4}} \approx 0{,}924$ de la masse totale $\zeta(2)^{2}$, beaucoup plus que la proportion $\frac{6}{\pi^{2}} \approx 0{,}61$ de couples premiers entre eux que l'exercice 60, plus loin, établira, parce que les poids $\frac{1}{p^{2}q^{2}}$ privilégient les petits entiers, qui sont souvent premiers entre eux.
- id: "ma-20-50"
  feuille: "f-ma-20"
  numero: 50
  partie: "Familles sommables de réels positifs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [familles sommables positives, familles sommables, fonction zêta]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 10
  page_corrige: 54
  enonce: |
    Montrer que la famille $\Big(\dfrac{1}{nm(n + m)}\Big)_{(n,m) \in (\mathbb{N}^{*})^{2}}$ est sommable et que 
    $$\sum_{(n,m) \in (\mathbb{N}^{*})^{2}} \frac{1}{nm(n + m)} = \sum_{n=1}^{+\infty} \frac{H_{n}}{n^{2}} = 2\sum_{n=1}^{+\infty} \frac{H_{n}}{(n + 1)^{2}} = 2\zeta(3).$$
     On pourra, pour la première égalité, sommer d'abord en $m$ ; pour la deuxième, regrouper les couples selon la valeur de $n + m$.
  corrige: |
    La famille est positive : toutes les sommes se calculent dans $[0\,,+\infty]$, et la sommabilité se constatera à la fin.

    *Première égalité : sommation en $m$.* Pour $n \geqslant 1$ fixé, on décompose en éléments simples la fraction en $m$ : 
    $$\frac{1}{m(n + m)} = \frac{1}{n}\Big(\frac{1}{m} - \frac{1}{n + m}\Big).$$
     La somme partielle jusqu'à $M$ de la série en $m$ est télescopique par blocs de $n$ termes : 
    $$\sum_{m=1}^{M} \Big(\frac{1}{m} - \frac{1}{n + m}\Big) = H_{M} - (H_{n+M} - H_{n}) = H_{n} - \sum_{j=1}^{n} \frac{1}{M + j},$$
     et la dernière somme, majorée par $\frac{n}{M}$, tend vers $0$ quand $M$ tend vers $+\infty$. La somme de la ligne $n$ vaut donc $\frac{H_{n}}{n^{2}}$, et le théorème 9 donne 
    $$\boxed{\sum_{(n,m) \in (\mathbb{N}^{*})^{2}} \frac{1}{nm(n + m)} = \sum_{n=1}^{+\infty} \frac{H_{n}}{n^{2}}}$$
     Comme $H_{n} \leqslant 1 + \ln n$ (proposition 6 (ii)), on a $\frac{H_{n}}{n^{2}} = O\big(\frac{\ln n}{n^{2}}\big) = o\big(\frac{1}{n^{3/2}}\big)$, et cette série converge (théorème 3) : $\boxed{\text{la famille est sommable}}$.

    *Deuxième égalité : paquets selon $s = n + m$.* Pour $s \geqslant 2$, le paquet $\{n + m = s\}$ contient les couples $(n, s - n)$, $1 \leqslant n \leqslant s - 1$. La décomposition $\frac{1}{n(s - n)} = \frac{1}{s}\big(\frac{1}{n} + \frac{1}{s - n}\big)$ donne 
    $$\sum_{n=1}^{s-1} \frac{1}{n(s - n)s} = \frac{1}{s^{2}}\sum_{n=1}^{s-1} \Big(\frac{1}{n} + \frac{1}{s - n}\Big) = \frac{2H_{s-1}}{s^{2}},$$
     les deux sommes valant $H_{s-1}$, la seconde après le changement d'indice $n \mapsto s - n$. Par le théorème 8, puis le décalage $s = n + 1$, 
    $$\boxed{\sum_{(n,m) \in (\mathbb{N}^{*})^{2}} \frac{1}{nm(n + m)} = \sum_{s=2}^{+\infty} \frac{2H_{s-1}}{s^{2}} = 2\sum_{n=1}^{+\infty} \frac{H_{n}}{(n + 1)^{2}}}$$
     *Troisième égalité.* On note $X = \sum_{n=1}^{+\infty} \frac{H_{n}}{n^{2}}$, réel fini par la première étape. Comme $H_{s-1} = H_{s} - \frac{1}{s}$ et que le terme $s = 1$ de la série suivante est nul ($H_{0} = 0$), 
    $$\sum_{s=2}^{+\infty} \frac{H_{s-1}}{s^{2}} = \sum_{s=1}^{+\infty} \frac{H_{s} - 1/s}{s^{2}} = X - \zeta(3),$$
     la soustraction étant légitime puisque les deux séries convergent. Les deux premières égalités donnent alors $X = 2\big(X - \zeta(3)\big)$, d'où, puisque $X$ est fini, 
    $$\boxed{\sum_{(n,m) \in (\mathbb{N}^{*})^{2}} \frac{1}{nm(n + m)} = \sum_{n=1}^{+\infty} \frac{H_{n}}{n^{2}} = 2\zeta(3) \approx 2{,}404\,11}$$
     La somme partielle de $\sum \frac{H_{n}}{n^{2}}$ jusqu'à $10^{6}$, complétée par l'estimation $\frac{\ln N + \gamma + 1}{N}$ du reste, donne $2{,}404\,113\,806$, pour $2\zeta(3) = 2{,}404\,113\,806$ ✓.

    *Piège.* L'erreur la plus répandue est de résoudre $X = 2X - 2\zeta(3)$ sans avoir vérifié que $X$ est fini : dans $[0\,,+\infty]$, l'égalité $X = 2X - 2\zeta(3)$ est aussi satisfaite par $X = +\infty$, et la soustraction n'y a pas de sens (remarque de la section 20.6.1). C'est la première étape, qui montre la convergence de $\sum \frac{H_{n}}{n^{2}}$, qui autorise la simplification. On obtient ainsi une valeur exacte d'une série où apparaît $\zeta(3)$, nombre dont le cours rappelait qu'on ne connaît aucune expression à l'aide de $\pi$.
- id: "ma-20-51"
  feuille: "f-ma-20"
  numero: 51
  partie: "Familles sommables de réels positifs"
  etoiles: 3
  types: [Calcul]
  mots_cles: [familles sommables positives]
  noeuds: [q-denombrable, as-series]
  notions: [denombrable]
  page_enonce: 11
  page_corrige: 56
  enonce: |
    Pour tout entier $n \geqslant 1$, on note $b(n)$ le nombre de chiffres égaux à $1$ dans l'écriture de $n$ en base $2$ ; par exemple $b(6) = b(\overline{110}^{\,2}) = 2$. Calculer 
    $$\sum_{n=1}^{+\infty} \frac{b(n)}{n(n + 1)}.$$
     On pourra écrire $b(n) = \sum_{j \geqslant 0} \varepsilon_{j}(n)$, où $\varepsilon_{j}(n) \in \{0, 1\}$ est le chiffre de rang $j$ de $n$, et décrire les entiers $n$ tels que $\varepsilon_{j}(n) = 1$.
  corrige: |
    *Les chiffres binaires.* Pour $n \geqslant 1$, on écrit $n = \sum_{k \geqslant 0} \varepsilon_{k}(n)2^{k}$, la somme étant finie. En séparant les rangs $k \geqslant j$ et $k < j$, 
    $$n = 2^{j}\sum_{k \geqslant j} \varepsilon_{k}(n)2^{k-j} + \sum_{k < j} \varepsilon_{k}(n)2^{k}, \qquad 0 \leqslant \sum_{k < j} \varepsilon_{k}(n)2^{k} \leqslant 2^{j} - 1,$$
     donc $\lfloor n/2^{j} \rfloor = \sum_{k \geqslant j} \varepsilon_{k}(n)2^{k-j}$, entier dont la parité est $\varepsilon_{j}(n)$. Ainsi $\varepsilon_{j}(n) = 1$ si et seulement si $\lfloor n/2^{j} \rfloor = 2i + 1$ pour un entier $i \geqslant 0$, c'est-à-dire 
    $$\boxed{\varepsilon_{j}(n) = 1 \iff \exists\, i \in \mathbb{N},\quad 2^{j}(2i + 1) \leqslant n < 2^{j}(2i + 2)}$$
     Les entiers dont le chiffre de rang $j$ vaut $1$ forment des blocs de $2^{j}$ entiers consécutifs, séparés par des blocs de même longueur où ce chiffre vaut $0$.

    ![Figure](documents/figures/0074b50b4f20493d.svg)

    Chaque case colorée indique un chiffre égal à $1$ : sur la ligne $j$, les cases colorées forment des blocs de $2^{j}$ entiers commençant en $2^{j}(2i + 1)$, et la somme d'une colonne est $b(n)$, par exemple $b(7) = 3$ et $b(8) = 1$.

    *Interversion.* La famille $\big(\frac{\varepsilon_{j}(n)}{n(n + 1)}\big)_{n \geqslant 1,\, j \geqslant 0}$ est positive ; pour $n$ fixé, seul un nombre fini de ses termes est non nul, et leur somme vaut $\frac{b(n)}{n(n + 1)}$. Par le théorème 9, dans $[0\,,+\infty]$, 
    $$\sum_{n=1}^{+\infty} \frac{b(n)}{n(n + 1)} = \sum_{j=0}^{+\infty}\,\sum_{n \geqslant 1} \frac{\varepsilon_{j}(n)}{n(n + 1)}.$$
     *Somme à $j$ fixé.* Par le théorème 8, on somme sur chaque bloc $[\![A\,;B - 1]\!]$, avec $A = 2^{j}(2i + 1)$ et $B = 2^{j}(2i + 2)$, en utilisant $\frac{1}{n(n + 1)} = \frac{1}{n} - \frac{1}{n + 1}$, qui donne une somme télescopique : 
    $$\sum_{n=A}^{B-1} \frac{1}{n(n + 1)} = \frac{1}{A} - \frac{1}{B} = \frac{1}{2^{j}}\Big(\frac{1}{2i + 1} - \frac{1}{2i + 2}\Big).$$
     La série en $i$ est la série harmonique alternée regroupée par paires : sa somme partielle jusqu'à $i = N - 1$ est $S_{2N} = \sum_{k=1}^{2N} \frac{(-1)^{k+1}}{k}$, qui tend vers $\ln 2$ (exemple qui suit le théorème 7). Ainsi 
    $$\boxed{\sum_{n \geqslant 1} \frac{\varepsilon_{j}(n)}{n(n + 1)} = \frac{\ln 2}{2^{j}}} \qquad\text{puis}\qquad \boxed{\sum_{n=1}^{+\infty} \frac{b(n)}{n(n + 1)} = \ln 2\sum_{j=0}^{+\infty} \frac{1}{2^{j}} = 2\ln 2 \approx 1{,}386\,294}$$
     La somme des termes pour $n < 2 \cdot 10^{6}$ vaut $1{,}386\,289$, et le reste, pour $N = 2 \cdot 10^{6}$, est de l'ordre de $\frac{\ln N}{2N\ln 2} \approx 5 \cdot 10^{-6}$, puisque $b(n)$ vaut en moyenne environ la moitié du nombre de chiffres de $n$ ✓.

    *À retenir.* La fonction $b$ est très irrégulière, et aucune comparaison directe ne donnerait la somme. L'idée est d'écrire $b(n)$ comme une somme de termes simples, puis d'intervertir : chaque chiffre, pris séparément, a une structure périodique, et c'est la positivité qui autorise l'échange sans aucune vérification préalable. La même démarche (décomposer le terme général en une somme, puis sommer d'abord sur l'autre indice) sert dans l'exercice 47, et elle resservira dans les exercices 54 et 62.
- id: "ma-20-52"
  feuille: "f-ma-20"
  numero: 52
  partie: "Familles sommables de nombres complexes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [familles sommables complexes, familles sommables]
  noeuds: [q-denombrable, as-series]
  notions: [serie-absolument-convergente, denombrable]
  page_enonce: 11
  page_corrige: 57
  enonce: |
    Pour $(i, j) \in \mathbb{N}^{2}$, on pose $a_{i,j} = \dfrac{\operatorname{sgn}(i - j)}{2^{|i - j|}}$, où $\operatorname{sgn}(x)$ vaut $1$, $-1$ ou $0$ selon que $x$ est strictement positif, strictement négatif ou nul.

    **1.** Pour tout $j \in \mathbb{N}$, montrer que la série $\sum_{i} a_{i,j}$ converge et calculer sa somme. En déduire la valeur de $\sum_{j=0}^{+\infty}\,\sum_{i=0}^{+\infty} a_{i,j}$.

    **2.** Calculer $\sum_{i=0}^{+\infty}\,\sum_{j=0}^{+\infty} a_{i,j}$, et en déduire que la famille $(a_{i,j})_{(i,j) \in \mathbb{N}^{2}}$ n'est pas sommable.

    **3.** Montrer directement que cette famille n'est pas sommable. En quoi cet exemple diffère-t-il de celui du cours ?
  corrige: |
    On note $\operatorname{sgn}$ la fonction signe de l'énoncé. Pour $i \neq j$, on a $|a_{i,j}| = 2^{-|i - j|}$, et $a_{i,i} = 0$. La famille est antisymétrique : $a_{j,i} = -a_{i,j}$ pour tous $i$, $j$, puisque $\operatorname{sgn}(j - i) = -\operatorname{sgn}(i - j)$.

    **1.** Soit $j \in \mathbb{N}$. Dans la colonne d'indice $j$, il n'y a qu'un nombre fini de termes non nuls d'indice $i < j$, et les termes d'indice $i > j$ forment une série géométrique de raison $\frac{1}{2}$ (théorème 1) : la série $\sum_{i} a_{i,j}$ converge, et 
    $$\sum_{i=0}^{+\infty} a_{i,j} = -\sum_{i=0}^{j-1} \frac{1}{2^{j - i}} + \sum_{i=j+1}^{+\infty} \frac{1}{2^{i - j}} = -\sum_{m=1}^{j} \frac{1}{2^{m}} + \sum_{m=1}^{+\infty} \frac{1}{2^{m}} = -\Big(1 - \frac{1}{2^{j}}\Big) + 1,$$
     en posant $m = j - i$ dans la première somme et $m = i - j$ dans la seconde. Ainsi 
    $$\boxed{\sum_{i=0}^{+\infty} a_{i,j} = \frac{1}{2^{j}}} \qquad\text{et}\qquad \boxed{\sum_{j=0}^{+\infty}\,\sum_{i=0}^{+\infty} a_{i,j} = \sum_{j=0}^{+\infty} \frac{1}{2^{j}} = 2}$$

    **2.** Par antisymétrie, la ligne d'indice $i$ est l'opposée de la colonne d'indice $i$ : pour tout $i$, $\sum_{j} a_{i,j} = -\sum_{j} a_{j,i}$ converge et vaut $-\frac{1}{2^{i}}$. D'où 
    $$\boxed{\sum_{i=0}^{+\infty}\,\sum_{j=0}^{+\infty} a_{i,j} = -\sum_{i=0}^{+\infty} \frac{1}{2^{i}} = -2}$$
     Si la famille était sommable, le théorème de Fubini (théorème 11) donnerait l'égalité des deux sommes itérées, et l'on aurait $2 = -2$. Donc $\boxed{(a_{i,j})_{(i,j) \in \mathbb{N}^{2}} \text{ n'est pas sommable}}$.

    ![Figure](documents/figures/bf1407dd4c1bb9fb.svg)

    Les termes positifs, sous la diagonale, sont en bleu, les négatifs, au-dessus, en ocre ; les sommes des lignes et des colonnes, en rouge, sont opposées, et chaque ligne comme chaque colonne a une infinité de termes non nuls.

    **3.** La sous-famille $(a_{j+1,j})_{j \in \mathbb{N}}$, juste sous la diagonale, est constante égale à $\frac{1}{2}$. Par croissance (proposition 10 (iii)), 
    $$\sum_{(i,j) \in \mathbb{N}^{2}} |a_{i,j}| \geqslant \sum_{j \in \mathbb{N}} |a_{j+1,j}| = \sum_{j=0}^{+\infty} \frac{1}{2} = +\infty,$$
     donc $\boxed{\text{la famille n'est pas sommable}}$. Plus précisément, le théorème de Fubini positif (théorème 9) donne $\sum_{(i,j)} |a_{i,j}| = \sum_{j} \big(2 - 2^{-j}\big) = +\infty$, chaque colonne des modules ayant pour somme $(1 - 2^{-j}) + 1$.

    Dans l'exemple du cours (section 20.7.2), chaque ligne et chaque colonne n'a qu'un nombre fini de termes non nuls, et les sommes de lignes et de colonnes sont des sommes finies. Ici, chaque ligne et chaque colonne est une série *absolument convergente*, de somme des modules au plus $2$ : même cette condition plus forte ne suffit pas.

    *Piège.* L'erreur la plus répandue est de croire que la convergence absolue de chaque ligne et de chaque colonne autorise l'interversion. Le théorème 11 exige la sommabilité de la famille double tout entière, qui se vérifie par le théorème 9 sur les modules : ici, les colonnes des modules ont des sommes bornées, mais leur nombre infini fait diverger le total.
- id: "ma-20-53"
  feuille: "f-ma-20"
  numero: 53
  partie: "Familles sommables de nombres complexes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [familles sommables complexes, familles sommables]
  noeuds: [q-denombrable, as-series]
  notions: [serie-absolument-convergente, denombrable]
  page_enonce: 11
  page_corrige: 58
  enonce: |
    Soit $z \in \mathbb{C}$ tel que $|z| < 1$.

    **1.** Montrer que la famille $(z^{2p+3q})_{(p,q) \in \mathbb{N}^{2}}$ est sommable et calculer sa somme $S(z)$.

    **2.** Écrire $S(z)$ sous la forme $\sum_{n=0}^{+\infty} d_{n}z^{n}$, où $(d_{n})$ est une suite d'entiers naturels que l'on interprétera de façon combinatoire. Calculer $d_{n}$ pour $n \leqslant 12$, et comparer avec l'exercice 35 de la feuille du chapitre 10.

    **3.** Que se passe-t-il lorsque $|z| = 1$ ?
  corrige: |
    **1.** Comme $|z| < 1$, les séries géométriques $\sum_{p} |z|^{2p}$ et $\sum_{q} |z|^{3q}$ convergent (théorème 1), c'est-à-dire que les familles $(z^{2p})_{p \in \mathbb{N}}$ et $(z^{3q})_{q \in \mathbb{N}}$ sont sommables (proposition 12 (iv)). Par la proposition 15, la famille des produits $z^{2p}z^{3q} = z^{2p+3q}$ est sommable, et sa somme est le produit des deux sommes : 
    $$\boxed{S(z) = \sum_{(p,q) \in \mathbb{N}^{2}} z^{2p+3q} = \frac{1}{(1 - z^{2})(1 - z^{3})}}$$

    **2.** Pour $n \in \mathbb{N}$, soit $I_{n} = \{(p, q) \in \mathbb{N}^{2} \mid 2p + 3q = n\}$. Ces parties sont finies et forment une partition de $\mathbb{N}^{2}$, et le terme vaut $z^{n}$ sur $I_{n}$. Par la sommation par paquets (théorème 10), la famille $(d_{n}z^{n})_{n \in \mathbb{N}}$, avec $d_{n} = \operatorname{card} I_{n}$, est sommable, c'est-à-dire que la série $\sum d_{n}z^{n}$ converge absolument, et 
    $$\boxed{S(z) = \sum_{n=0}^{+\infty} d_{n}z^{n}, \qquad d_{n} = \operatorname{card}\{(p, q) \in \mathbb{N}^{2} \mid 2p + 3q = n\}}$$
     L'entier $d_{n}$ est le nombre de façons de payer la somme $n$ avec des pièces de $2$ et de $3$ unités, seul le nombre de pièces de chaque sorte comptant. On les obtient en choisissant le nombre $q$ de pièces de $3$, de même parité que $n$ et au plus égal à $\frac{n}{3}$. Pour $n \leqslant 12$, on trouve 
    $$\boxed{(d_{0}, \dots, d_{12}) = (1, 0, 1, 1, 1, 1, 2, 1, 2, 2, 2, 2, 3)}$$
     par exemple $d_{12} = 3$ pour $12 = 6 \times 2 = 3 \times 2 + 2 \times 3 = 4 \times 3$. On a de plus $d_{n+6} = d_{n} + 1$ : l'application $(p, q) \mapsto (p, q + 2)$ est une bijection de $I_{n}$ sur les couples de $I_{n+6}$ tels que $q \geqslant 2$, et il y a exactement un couple de $I_{n+6}$ tel que $q \in \{0, 1\}$, celui pour lequel $q$ a la parité de $n$. On en déduit 
    $$\boxed{d_{n} = \Big\lfloor\frac{n}{6}\Big\rfloor + 1 \ \text{ si } n \not\equiv 1 \;[6], \qquad d_{n} = \Big\lfloor\frac{n}{6}\Big\rfloor \ \text{ si } n \equiv 1 \;[6]}$$
     ce qui a été contrôlé par énumération jusqu'à $n = 59$ ✓. L'exercice 35 de la feuille du chapitre 10 obtenait de la même façon le nombre de façons de payer $10$ centimes avec des pièces de $1$, $2$ et $5$, comme coefficient d'un développement limité. Ici, la sommation par paquets donne d'un coup tous les coefficients, sans troncature, et justifie le développement du produit de deux séries infinies.

    **3.** Si $|z| = 1$, tous les termes $z^{2p+3q}$ sont de module $1$, et $\sum_{(p,q)} |z^{2p+3q}| = +\infty$ : la famille $\boxed{\text{n'est pas sommable}}$. La série $\sum d_{n}z^{n}$ diverge aussi grossièrement, puisque $|d_{n}z^{n}| = d_{n} \geqslant \lfloor\frac{n}{6}\rfloor$ tend vers $+\infty$.

    *Piège.* Pour $z = \mathrm{i}$, l'expression $\frac{1}{(1 - z^{2})(1 - z^{3})} = \frac{1}{2(1 + \mathrm{i})}$ est parfaitement définie, alors que la famille n'est pas sommable : une formule obtenue pour $|z| < 1$ ne dit rien au-delà. L'erreur la plus répandue est d'étendre un résultat jusqu'au bord du domaine où il a été démontré.
- id: "ma-20-54"
  feuille: "f-ma-20"
  numero: 54
  partie: "Familles sommables de nombres complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles sommables complexes]
  noeuds: [q-denombrable, as-series]
  notions: [serie-absolument-convergente]
  page_enonce: 11
  page_corrige: 59
  enonce: |
    Soit $x$ un nombre complexe de module strictement inférieur à $1$. Montrer les égalités suivantes, après avoir justifié l'existence de chacune des sommes.

    **(a)** $\displaystyle\sum_{n=1}^{+\infty} \frac{x^{n}}{1 - x^{n}} = 2\sum_{n=1}^{+\infty} \frac{x^{n} - x^{n^{2}}}{1 - x^{n}} + \sum_{n=1}^{+\infty} x^{n^{2}}$.

    **(b)** $\displaystyle\sum_{n=1}^{+\infty} \frac{x^{2n-1}}{1 - x^{2n-1}} = \sum_{i=1}^{+\infty} \frac{x^{i}}{1 - x^{2i}}$.

    **(c)** $\displaystyle\sum_{(i,k) \in (\mathbb{N}^{*})^{2}} i\,x^{ik} = \sum_{n=1}^{+\infty} \frac{nx^{n}}{1 - x^{n}}$.

    Dans chaque cas, écrire aussi la quantité étudiée sous la forme $\sum_{n=1}^{+\infty} a_{n}x^{n}$, pour une suite $(a_{n})$ que l'on interprétera à l'aide des diviseurs de $n$.
  corrige: |
    On pose $r = |x| < 1$. Pour tout $n \geqslant 1$, on a $|x^{n}| = r^{n} < 1$, donc $1 - x^{n} \neq 0$, et la série géométrique donne $\frac{x^{n}}{1 - x^{n}} = \sum_{k=1}^{+\infty} x^{nk}$ (théorème 1). Tout repose sur la famille $(x^{nk})_{(n,k) \in (\mathbb{N}^{*})^{2}}$.

    **Sommabilité.** Par le théorème de Fubini positif (théorème 9), puis la majoration $1 - r^{n} \geqslant 1 - r$, 
    $$\sum_{(n,k) \in (\mathbb{N}^{*})^{2}} r^{nk} = \sum_{n=1}^{+\infty} \frac{r^{n}}{1 - r^{n}} \leqslant \frac{1}{1 - r}\sum_{n=1}^{+\infty} r^{n} = \frac{r}{(1 - r)^{2}} < +\infty.$$
     La famille $(x^{nk})$ est donc sommable. Le théorème de Fubini (théorème 11), par lignes, montre que la série $\sum \frac{x^{n}}{1 - x^{n}}$ converge, et que 
    $$\sum_{n=1}^{+\infty} \frac{x^{n}}{1 - x^{n}} = \sum_{(n,k) \in (\mathbb{N}^{*})^{2}} x^{nk}.$$

    **(a)** On partage $(\mathbb{N}^{*})^{2}$ en $D_{<} = \{k < n\}$, $D_{=} = \{k = n\}$ et $D_{>} = \{k > n\}$. Le théorème 10 donne 
    $$\sum_{(n,k)} x^{nk} = \sum_{D_{<}} x^{nk} + \sum_{D_{=}} x^{nk} + \sum_{D_{>}} x^{nk}.$$
     L'échange $(n, k) \mapsto (k, n)$ est une bijection de $D_{<}$ sur $D_{>}$ qui conserve le produit $nk$ : par la proposition 13 (iv), les sommes sur $D_{>}$ et sur $D_{<}$ sont égales. La somme sur $D_{=}$ est celle de la série absolument convergente $\sum x^{n^{2}}$. Enfin, en sommant $D_{<}$ par lignes (théorème 10, paquets $\{n\} \times [\![1\,;n - 1]\!]$), la ligne $n$ est une somme géométrique finie : 
    $$\sum_{k=1}^{n-1} x^{nk} = x^{n}\,\frac{1 - x^{n(n-1)}}{1 - x^{n}} = \frac{x^{n} - x^{n^{2}}}{1 - x^{n}}.$$
     Les trois sommes existent, et 
    $$\boxed{\sum_{n=1}^{+\infty} \frac{x^{n}}{1 - x^{n}} = 2\sum_{n=1}^{+\infty} \frac{x^{n} - x^{n^{2}}}{1 - x^{n}} + \sum_{n=1}^{+\infty} x^{n^{2}}}$$
     En groupant les couples selon la valeur $N = nk$ (théorème 10, paquets finis), le paquet de $N$ contient un couple $(d, \frac{N}{d})$ par diviseur $d$ de $N$, d'où $\boxed{a_{N} = d(N)}$, le nombre de diviseurs positifs de $N$. Le membre de droite compte ces diviseurs autrement : le couple $(n, k)$ est dans $D_{<}$ lorsque $k < \sqrt{N}$, dans $D_{=}$ lorsque $N = k^{2}$. Les diviseurs vont par paires $\{k, \frac{N}{k}\}$, l'un inférieur et l'autre supérieur à $\sqrt{N}$, sauf $\sqrt{N}$ lorsque $N$ est un carré : 
    $$d(N) = 2\,\operatorname{card}\{k \mid N,\ k < \sqrt{N}\} + \big(1 \text{ si } N \text{ est un carré, } 0 \text{ sinon}\big).$$
     Par exemple $d(12) = 2 \times 3 = 6$, avec $1$, $2$, $3$ inférieurs à $\sqrt{12}$, et $d(16) = 2 \times 2 + 1 = 5$.

    **(b)** La famille $(x^{mk})$, indexée par les couples $(m, k)$ avec $m$ impair et $k \geqslant 1$, est une sous-famille de la précédente, donc sommable (proposition 12 (ii)). On la somme de deux façons par le théorème de Fubini. À $m = 2n - 1$ fixé, la somme sur $k$ vaut $\frac{x^{2n-1}}{1 - x^{2n-1}}$ ; à $k = i$ fixé, la somme sur $m = 2j + 1$ est géométrique de raison $x^{2i}$, de module $r^{2i} < 1$ : 
    $$\sum_{j=0}^{+\infty} x^{i(2j+1)} = \frac{x^{i}}{1 - x^{2i}}, \qquad\text{d'où}\qquad \boxed{\sum_{n=1}^{+\infty} \frac{x^{2n-1}}{1 - x^{2n-1}} = \sum_{i=1}^{+\infty} \frac{x^{i}}{1 - x^{2i}}}$$
     En groupant selon $N = mk$, le coefficient $a_{N}$ est le nombre de couples $(m, k)$ avec $m$ impair et $mk = N$, c'est-à-dire $\boxed{a_{N} = \text{nombre de diviseurs impairs de } N}$. Par exemple, $a_{12} = 2$, pour les diviseurs $1$ et $3$.

    **(c)** La famille $(i\,x^{ik})_{(i,k) \in (\mathbb{N}^{*})^{2}}$ est sommable : par le théorème 9, 
    $$\sum_{(i,k)} i\,r^{ik} = \sum_{i=1}^{+\infty} \frac{i\,r^{i}}{1 - r^{i}} \leqslant \frac{1}{1 - r}\sum_{i=1}^{+\infty} i\,r^{i} = \frac{r}{(1 - r)^{3}} < +\infty,$$
     la série $\sum i\,r^{i}$ convergeant d'après le second exemple de produit de Cauchy de la section 20.7.4. Le théorème 11, par lignes, donne la somme demandée, en notant $n$ l'indice de ligne : 
    $$\boxed{\sum_{(i,k) \in (\mathbb{N}^{*})^{2}} i\,x^{ik} = \sum_{n=1}^{+\infty} \frac{n\,x^{n}}{1 - x^{n}}}$$
     En groupant selon $N = ik$, le paquet de $N$ apporte $\sum_{i \mid N} i\,x^{N}$, d'où $\boxed{a_{N} = \sigma(N)}$, la somme des diviseurs positifs de $N$ ; par exemple $\sigma(12) = 1 + 2 + 3 + 4 + 6 + 12 = 28$.

    Les trois identités et les trois interprétations ont été contrôlées numériquement en $x = 0{,}37$ et en deux valeurs complexes, $0{,}5 + 0{,}3\,\mathrm{i}$ et $-0{,}6 + 0{,}2\,\mathrm{i}$ ✓.

    *À retenir.* Une seule famille double, $(x^{nk})$, sommée par lignes, par colonnes, par diagonales $nk = N$ ou par morceaux du quadrant, produit toutes ces identités. La sommabilité, établie une fois pour toutes par le théorème 9 sur les modules, rend chacun de ces regroupements légitime ; c'est la méthode du cours de la section 20.7.2.
- id: "ma-20-55"
  feuille: "f-ma-20"
  numero: 55
  partie: "Familles sommables de nombres complexes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [familles sommables complexes, familles sommables, fonction zêta]
  noeuds: [q-denombrable, as-series]
  notions: [serie-absolument-convergente, denombrable]
  page_enonce: 12
  page_corrige: 60
  enonce: |
    *Une famille indexée par $\mathbb{Z}^{2}$.* On note $\mathbb{H} = \{z \in \mathbb{C} \mid \operatorname{Im} z > 0\}$ et, pour $(a, b) \in \mathbb{R}^{2}$, $\max(|a|, |b|)$ le plus grand des réels $|a|$ et $|b|$.

    **1.** Soit $z = x + \mathrm{i} y \in \mathbb{H}$. Montrer qu'il existe un réel $c_{z} > 0$ tel que $|az + b| \geqslant c_{z}\max(|a|, |b|)$ pour tout $(a, b) \in \mathbb{R}^{2}$. On pourra distinguer les cas $|b| \geqslant 2|a|\,|z|$ et $|b| < 2|a|\,|z|$.

    **2.** Pour $N \geqslant 1$, dénombrer les couples $(n, m) \in \mathbb{Z}^{2}$ tels que $\max(|n|, |m|) = N$. En déduire que, pour tout entier $k \geqslant 3$ et tout $z \in \mathbb{H}$, la famille $\Big(\dfrac{1}{(nz + m)^{k}}\Big)_{(n,m) \in \mathbb{Z}^{2} \setminus \{(0,0)\}}$ est sommable.

    **3.** Pour $k \geqslant 3$ et $z \in \mathbb{H}$, on note $G_{k}(z)$ la somme de cette famille. Calculer $G_{k}(z)$ lorsque $k$ est impair.

    **4.** On suppose $k$ pair. Montrer que $G_{k}(\mathrm{i} y)$ tend vers $2\zeta(k)$ quand le réel $y$ tend vers $+\infty$. On pourra majorer, pour $y \geqslant 1$ et $n \neq 0$, le module de $\frac{1}{(n\mathrm{i} y + m)^{k}}$ par $\frac{1}{y}\,\frac{1}{(n^{2} + m^{2})^{(k-1)/2}}$.
  corrige: |
    **1.** Soit $z = x + \mathrm{i} y$ avec $y > 0$, et $(a, b) \in \mathbb{R}^{2}$. Comme $a$ et $b$ sont réels, $\operatorname{Im}(az + b) = ay$, donc 
    $$|az + b| \geqslant |a|\,y. \tag{$\ast$}$$
     *Premier cas : $|b| \geqslant 2|a|\,|z|$.* Par l'inégalité triangulaire, $|az + b| \geqslant |b| - |a|\,|z| \geqslant \frac{|b|}{2}$. Avec $(\ast)$, on obtient $|az + b| \geqslant \max\big(\frac{|b|}{2}, y|a|\big) \geqslant \min\big(\frac{1}{2}, y\big)\max(|a|, |b|)$.

    *Second cas : $|b| < 2|a|\,|z|$.* Alors $\max(|a|, |b|) \leqslant \max(1, 2|z|)\,|a|$, et $(\ast)$ donne 
    $$|az + b| \geqslant \frac{y}{\max(1, 2|z|)}\max(|a|, |b|).$$

    Comme $\frac{y}{\max(1, 2|z|)} \leqslant y$, les deux cas donnent le résultat avec 
    $$\boxed{c_{z} = \min\Big(\frac{1}{2}, \frac{y}{\max(1, 2|z|)}\Big) > 0, \qquad |az + b| \geqslant c_{z}\max(|a|, |b|) \text{ pour tout } (a, b) \in \mathbb{R}^{2}}$$
     La minoration a été testée sur $20\,000$ triplets $(z, a, b)$ tirés au hasard ✓.

    **2.** Les couples tels que $\max(|n|, |m|) \leqslant N$ forment le carré $[\![-N\,;N]\!]^{2}$, de $(2N + 1)^{2}$ éléments ; ceux pour lesquels le maximum vaut exactement $N$ sont ceux de ce carré qui ne sont pas dans $[\![-(N-1)\,;N-1]\!]^{2}$ : 
    $$\boxed{\operatorname{card}\{(n, m) \in \mathbb{Z}^{2} \mid \max(|n|, |m|) = N\} = (2N + 1)^{2} - (2N - 1)^{2} = 8N}$$
     Soit $k \geqslant 3$ et $z \in \mathbb{H}$. Par la question 1 avec $(a, b) = (n, m)$, pour $(n, m) \neq (0, 0)$, 
    $$\frac{1}{|nz + m|^{k}} \leqslant \frac{1}{c_{z}^{k}\max(|n|, |m|)^{k}}.$$
     On somme ce majorant positif par paquets selon la valeur $N \geqslant 1$ de $\max(|n|, |m|)$ (théorème 8) : chaque paquet a $8N$ éléments, d'où 
    $$\sum_{(n,m) \neq (0,0)} \frac{1}{c_{z}^{k}\max(|n|, |m|)^{k}} = \frac{8}{c_{z}^{k}}\sum_{N=1}^{+\infty} \frac{1}{N^{k-1}} < +\infty,$$
     puisque $k - 1 \geqslant 2 > 1$ (théorème 5). Par domination (proposition 12 (i)), 
    $$\boxed{\Big(\frac{1}{(nz + m)^{k}}\Big)_{(n,m) \neq (0,0)} \text{ est sommable pour } k \geqslant 3 \text{ et } z \in \mathbb{H}}$$
     Le seuil est exact : comme $|nz + m| \leqslant (|z| + 1)\max(|n|, |m|)$, le même découpage minore la somme des modules par $\frac{8}{(|z| + 1)^{k}}\sum_{N} \frac{1}{N^{k-1}}$, infinie pour $k = 2$. Comme dans la section 20.6.4 du cours, le seuil $k \geqslant 3$, et non $k \geqslant 2$, vient de ce que le paquet de rang $N$ a un nombre d'éléments proportionnel à $N$.

    **3.** L'application $(n, m) \mapsto (-n, -m)$ est une bijection de $\mathbb{Z}^{2} \setminus \{(0, 0)\}$ sur lui-même. Par l'invariance par permutation (proposition 13 (iv)), puis la linéarité, pour $k$ impair, 
    $$G_{k}(z) = \sum_{(n,m) \neq (0,0)} \frac{1}{(-nz - m)^{k}} = (-1)^{k}\,G_{k}(z) = -G_{k}(z), \qquad\text{d'où}\qquad \boxed{G_{k}(z) = 0 \ \text{ pour } k \text{ impair}}$$

    **4.** Soit $k$ pair ; comme $k \geqslant 3$, on a $k \geqslant 4$. On partage $\mathbb{Z}^{2} \setminus \{(0, 0)\}$ en la partie où $n = 0$ et celle où $n \neq 0$ (théorème 10). Sur la première, le terme vaut $\frac{1}{m^{k}}$ avec $m \neq 0$ ; comme $k$ est pair, les indices $m$ et $-m$ donnent le même terme, et cette partie a pour somme $2\zeta(k)$. Ainsi $G_{k}(\mathrm{i} y) = 2\zeta(k) + T(y)$, avec 
    $$T(y) = \sum_{n \neq 0,\ m \in \mathbb{Z}} \frac{1}{(n\mathrm{i} y + m)^{k}}.$$
     Soit $y \geqslant 1$ et $n \neq 0$. Alors $|n\mathrm{i} y + m|^{2} = n^{2}y^{2} + m^{2}$ est au moins égal à $n^{2} + m^{2}$, puisque $y \geqslant 1$, et au moins égal à $n^{2}y^{2} \geqslant y^{2}$. En écrivant $|n\mathrm{i} y + m|^{k} = |n\mathrm{i} y + m| \cdot |n\mathrm{i} y + m|^{k-1}$, on obtient l'inégalité de l'énoncé : 
    $$\Big|\frac{1}{(n\mathrm{i} y + m)^{k}}\Big| \leqslant \frac{1}{y}\,\frac{1}{(n^{2} + m^{2})^{(k-1)/2}}.$$
     Comme $n^{2} + m^{2} \geqslant \max(|n|, |m|)^{2}$, la sommation par paquets de la question 2 donne 
    $$C_{k} = \sum_{(n,m) \neq (0,0)} \frac{1}{(n^{2} + m^{2})^{(k-1)/2}} \leqslant \sum_{N=1}^{+\infty} \frac{8N}{N^{k-1}} = 8\sum_{N=1}^{+\infty} \frac{1}{N^{k-2}} < +\infty,$$
     puisque $k - 2 \geqslant 2$. Par la proposition 13 (ii), $|T(y)| \leqslant \frac{C_{k}}{y}$, qui tend vers $0$ quand $y$ tend vers $+\infty$ : 
    $$\boxed{G_{k}(\mathrm{i} y) \xrightarrow[y \to +\infty]{} 2\zeta(k) \quad (k \text{ pair})}$$
     Pour $k = 4$, on a $2\zeta(4) = \frac{\pi^{4}}{45} \approx 2{,}164646$, et la somme des termes pour $|n|, |m| \leqslant 200$ donne $G_{4}(3\mathrm{i}) \approx 2{,}164650$ : dès $y = 3$, la contribution des $n \neq 0$ est minuscule ✓.

    *Piège.* La majoration de la question 4 perd une puissance : $C_{k}$ n'est fini que pour $k \geqslant 4$. Elle ne vaudrait rien pour $k = 3$, mais c'est sans importance, puisque $G_{3} = 0$. L'erreur la plus répandue est d'écrire $G_{k}(\mathrm{i} y) = \sum_{n}\sum_{m}$ et de faire tendre $y$ vers $+\infty$ terme à terme : on n'a aucun théorème pour passer à la limite dans une somme infinie, et c'est la majoration uniforme par $\frac{C_{k}}{y}$ qui remplace ce passage à la limite.

    *À retenir.* Ces sommes sont les séries d'Eisenstein. Leur sommabilité repose sur deux ingrédients du chapitre : la minoration de $|nz + m|$ par la « norme » $\max(|n|, |m|)$ du couple, et le dénombrement des couples de norme $N$.
- id: "ma-20-56"
  feuille: "f-ma-20"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [comparaison par équivalents, convergence absolue, familles sommables]
  noeuds: [as-series, as-comparaison, q-denombrable]
  notions: [serie-absolument-convergente, denombrable]
  page_enonce: 12
  page_corrige: 62
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple. Les suites considérées sont réelles.

    **1.** Si $u_{n}$ tend vers $0$, alors la série $\sum u_{n}$ converge.

    **2.** Si la série $\sum u_{n}$ converge et si $u_{n} \geqslant 0$ pour tout $n$, alors la série $\sum u_{n}^{2}$ converge.

    **3.** Si la série $\sum u_{n}$ converge et si $u_{n} \sim v_{n}$, alors la série $\sum v_{n}$ converge.

    **4.** Si la série $\sum u_{n}$ est absolument convergente, toute série obtenue en écrivant ses termes dans un autre ordre converge, et a la même somme.

    **5.** Si la série $\sum u_{n}$ converge, alors la série $\sum u_{2n}$ converge.

    **6.** Si les séries à termes positifs $\sum u_{n}$ et $\sum v_{n}$ convergent, alors la série $\sum \sqrt{u_{n}v_{n}}$ converge.

    **7.** Si la série $\sum u_{n}$ converge sans converger absolument, alors les séries $\sum u_{n}^{+}$ et $\sum u_{n}^{-}$ divergent toutes les deux.

    **8.** Si la série $\sum u_{n}$ est absolument convergente et si la suite $(v_{n})$ est bornée, alors la série $\sum u_{n}v_{n}$ converge.

    **9.** Si une famille $(a_{p,q})_{(p,q) \in \mathbb{N}^{2}}$ est telle que toutes les séries $\sum_{q} a_{p,q}$ et $\sum_{p} a_{p,q}$ convergent, et que les deux sommes itérées $\sum_{p=0}^{+\infty}\,\sum_{q=0}^{+\infty} a_{p,q}$ et $\sum_{q=0}^{+\infty}\,\sum_{p=0}^{+\infty} a_{p,q}$ existent et sont égales, alors elle est sommable.

    **10.** La famille $\Big(\dfrac{(-1)^{p+q}}{2^{p}\,3^{q}}\Big)_{(p,q) \in \mathbb{N}^{2}}$ est sommable, et sa somme vaut $\dfrac{1}{2}$.
  corrige: |
    **1. Faux.** La série harmonique $\sum_{n \geqslant 1} \frac{1}{n}$ a un terme général qui tend vers $0$, et elle diverge (théorème 5). La proposition 2 ne donne qu'une condition nécessaire.

    **2. Vrai.** Comme $\sum u_{n}$ converge, $u_{n}$ tend vers $0$ (proposition 2), donc $0 \leqslant u_{n} \leqslant 1$ à partir d'un certain rang, et alors $0 \leqslant u_{n}^{2} \leqslant u_{n}$. Le théorème 3 donne la convergence de $\sum u_{n}^{2}$. L'hypothèse de signe est indispensable : $\sum \frac{(-1)^{n}}{\sqrt{n}}$ converge (théorème 7), alors que la série des carrés est la série harmonique.

    **3. Faux.** Pour $n \geqslant 1$, soit $u_{n} = \frac{(-1)^{n}}{\sqrt{n}}$ et $v_{n} = \frac{(-1)^{n}}{\sqrt{n}} + \frac{1}{n}$. On a $\frac{v_{n}}{u_{n}} = 1 + \frac{(-1)^{n}}{\sqrt{n}}$, qui tend vers $1$, donc $u_{n} \sim v_{n}$. La série $\sum u_{n}$ converge par le théorème 7, et $\sum v_{n}$ diverge, comme somme d'une série convergente et d'une série divergente (proposition 1 (ii)). Le théorème 4 exige que l'une des suites soit de signe constant à partir d'un certain rang ; c'est la seconde remarque qui suit le théorème 7.

    **4. Vrai.** Soit $\sigma$ une bijection de $\mathbb{N}$ sur $\mathbb{N}$. La suite $(u_{n})$ est sommable (proposition 12 (iv)) ; par la proposition 13 (iv), la suite $(u_{\sigma(n)})$ l'est aussi et a la même somme, c'est-à-dire que $\sum u_{\sigma(n)}$ converge absolument et que $\sum_{n=0}^{+\infty} u_{\sigma(n)} = \sum_{n=0}^{+\infty} u_{n}$ (proposition 13 (iii)). C'est l'observation de Dirichlet, première remarque qui suit la proposition 13.

    **5. Faux.** La série $\sum_{n \geqslant 1} \frac{(-1)^{n}}{n}$ converge (théorème 7), alors que $u_{2n} = \frac{1}{2n}$ est le terme général d'une série divergente. Extraire les termes d'indice pair revient à supprimer tous les termes négatifs : la compensation qui assurait la convergence disparaît.

    **6. Vrai.** Pour deux réels positifs $a$ et $b$, on a $\sqrt{ab} \leqslant \frac{a + b}{2}$, puisque $(\sqrt{a} - \sqrt{b})^{2} \geqslant 0$. Ainsi $0 \leqslant \sqrt{u_{n}v_{n}} \leqslant \frac{u_{n} + v_{n}}{2}$, terme général d'une série convergente (proposition 1 (i)), et le théorème 3 conclut.

    **7. Vrai.** On a $u_{n} = u_{n}^{+} - u_{n}^{-}$ et $|u_{n}| = u_{n}^{+} + u_{n}^{-}$. Si $\sum u_{n}^{+}$ convergeait, alors $\sum u_{n}^{-} = \sum (u_{n}^{+} - u_{n})$ convergerait aussi (proposition 1 (i)), puis $\sum |u_{n}| = \sum (u_{n}^{+} + u_{n}^{-})$, contrairement à l'hypothèse. De même en échangeant les rôles de $u^{+}$ et $u^{-}$. C'est la première question de l'exercice 44, point de départ du théorème de réarrangement de Riemann.

    **8. Vrai.** Soit $M$ un majorant de $(|v_{n}|)$. Alors $|u_{n}v_{n}| \leqslant M|u_{n}|$, terme général d'une série convergente : $\sum u_{n}v_{n}$ converge absolument (théorème 3), donc converge (théorème 6). L'hypothèse de convergence absolue est indispensable : avec $u_{n} = v_{n} = \frac{(-1)^{n}}{\sqrt{n}}$, la suite $(v_{n})$ est bornée et $\sum u_{n}v_{n}$ est la série harmonique.

    **9. Faux.** Soit $a_{p,p} = \frac{(-1)^{p}}{p + 1}$ pour $p \in \mathbb{N}$, et $a_{p,q} = 0$ si $p \neq q$. Chaque ligne et chaque colonne n'a qu'un terme non nul, et les deux sommes itérées sont égales à 
    $$\sum_{p=0}^{+\infty} \frac{(-1)^{p}}{p + 1} = \ln 2,$$
     somme de la série harmonique alternée donnée par le cours. Pourtant, $\sum_{(p,q)} |a_{p,q}| = \sum_{p=0}^{+\infty} \frac{1}{p + 1} = +\infty$ : la famille n'est pas sommable. L'égalité des deux sommes itérées ne suffit pas ; c'est la somme itérée des *modules* qui décide, par le théorème 9.

    **10. Vrai.** Les familles $\big((-\frac{1}{2})^{p}\big)_{p \in \mathbb{N}}$ et $\big((-\frac{1}{3})^{q}\big)_{q \in \mathbb{N}}$ sont sommables (théorème 1 et proposition 12 (iv)). Par la proposition 15, la famille de leurs produits, qui est la famille de l'énoncé, est sommable, et 
    $$\sum_{(p,q) \in \mathbb{N}^{2}} \frac{(-1)^{p+q}}{2^{p}\,3^{q}} = \frac{1}{1 + \frac{1}{2}} \cdot \frac{1}{1 + \frac{1}{3}} = \frac{2}{3} \cdot \frac{3}{4} = \frac{1}{2}.$$

    $$\boxed{\text{Vrai : } 2, 4, 6, 7, 8, 10 ; \qquad \text{Faux : } 1, 3, 5, 9}$$
     *Piège.* Les assertions 3, 5 et 9 sont fausses pour la même raison de fond : une série semi-convergente n'est convergente que grâce à la compensation entre termes positifs et négatifs, et toute opération qui touche à cette compensation, remplacer par un équivalent, extraire, réordonner ou regrouper autrement, peut la détruire. Les assertions 2, 4, 6 et 8, qui reposent sur la positivité ou la convergence absolue, sont au contraire à l'abri de ce phénomène.
- id: "ma-20-57"
  feuille: "f-ma-20"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [familles sommables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 12
  page_corrige: 63
  enonce: |
    *Presque tous les entiers contiennent un $7$.* On note $E$ l'ensemble des entiers $n \geqslant 1$ dont l'écriture en base $10$ ne contient pas le chiffre $7$.

    **1.** Pour $k \geqslant 1$, dénombrer les entiers de $E$ qui s'écrivent avec exactement $k$ chiffres.

    **2.** En déduire que la proportion des entiers de $[\![1\,;10^{k} - 1]\!]$ qui appartiennent à $E$ tend vers $0$ quand $k$ tend vers $+\infty$.

    **3.** Montrer pourtant que la famille $\big(\frac{1}{n}\big)_{n \in E}$ est sommable, et que sa somme est au plus égale à $80$. Comparer avec la série harmonique.

    Cette série a été étudiée par A. J. Kempner en 1914 ; pour le chiffre $9$ au lieu du chiffre $7$, sa somme vaut environ $22{,}92$.
  corrige: |
    **1.** Un entier de $E$ à $k$ chiffres a son premier chiffre pris dans $\{1, \dots, 9\} \setminus \{7\}$, qui a $8$ éléments, et chacun des $k - 1$ autres dans $\{0, \dots, 9\} \setminus \{7\}$, qui en a $9$. Par l'unicité de l'écriture décimale, le nombre cherché est le cardinal d'un produit cartésien : 
    $$\boxed{\operatorname{card} E_{k} = 8 \times 9^{k-1}}, \qquad E_{k} = E \cap [\![10^{k-1}\,;10^{k} - 1]\!].$$

    **2.** Les entiers de $[\![1\,;10^{k} - 1]\!]$ sont ceux qui ont au plus $k$ chiffres. Par la question 1 et la somme géométrique, 
    $$\operatorname{card}\big(E \cap [\![1\,;10^{k} - 1]\!]\big) = \sum_{j=1}^{k} 8 \times 9^{j-1} = 8\,\frac{9^{k} - 1}{9 - 1} = 9^{k} - 1,$$
     et la proportion cherchée vaut 
    $$\boxed{\frac{9^{k} - 1}{10^{k} - 1} \leqslant \frac{9^{k}}{10^{k} - 1} \leqslant 2\Big(\frac{9}{10}\Big)^{k} \xrightarrow[k \to +\infty]{} 0}$$
     en utilisant $10^{k} - 1 \geqslant \frac{10^{k}}{2}$. Parmi les entiers d'au plus $20$ chiffres, la proportion de ceux qui n'ont pas de $7$ est déjà inférieure à $0{,}13$ : presque tous les entiers contiennent un $7$.

    **3.** Les parties $E_{k}$, pour $k \geqslant 1$, forment une partition de $E$. Chaque élément de $E_{k}$ est au moins égal à $10^{k-1}$, donc, par la question 1, 
    $$\sum_{n \in E_{k}} \frac{1}{n} \leqslant \frac{8 \times 9^{k-1}}{10^{k-1}} = 8\Big(\frac{9}{10}\Big)^{k-1}.$$
     La sommation par paquets dans $[0\,,+\infty]$ (théorème 8) et la série géométrique donnent 
    $$\sum_{n \in E} \frac{1}{n} = \sum_{k=1}^{+\infty}\,\sum_{n \in E_{k}} \frac{1}{n} \leqslant 8\sum_{k=1}^{+\infty} \Big(\frac{9}{10}\Big)^{k-1} = \frac{8}{1 - \frac{9}{10}} = 80,$$
     donc $\boxed{\big(\frac{1}{n}\big)_{n \in E} \text{ est sommable, de somme au plus } 80}$. La convergence est très lente : la somme des $\frac{1}{n}$ pour $n \in E$ et $n < 10^{7}$ ne vaut encore qu'environ $11{,}99$ ✓.

    Pour la série harmonique, le paquet des entiers à $k$ chiffres contribue $H_{10^{k}-1} - H_{10^{k-1}-1}$, qui tend vers $\ln 10$ par la proposition 7 : chaque paquet apporte à peu près la même quantité, et la somme diverge. Pour $E$, les contributions décroissent comme $(\frac{9}{10})^{k}$, car le nombre d'éléments du paquet croît comme $9^{k}$ et non comme $10^{k}$. Par le théorème 8, la famille des $\frac{1}{n}$, où $n$ parcourt les entiers qui *contiennent* un $7$, n'est pas sommable, puisque sa somme, ajoutée à une somme finie, donne $+\infty$.

    *À retenir.* La convergence d'une somme d'inverses ne se lit pas sur une proportion, mais sur la vitesse à laquelle les éléments se raréfient d'un paquet au suivant. On retrouvera ce point de vue à l'exercice 59, qui compare de la même façon les nombres premiers et les carrés.
- id: "ma-20-58"
  feuille: "f-ma-20"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: ["constante d'Euler et Stirling"]
  noeuds: [as-series, as-dl]
  notions: []
  page_enonce: 13
  page_corrige: 64
  enonce: |
    *Une somme sur les puissances parfaites.* On appelle *puissance parfaite* tout entier de la forme $a^{s}$, avec $a \geqslant 2$ et $s \geqslant 2$ entiers, et l'on note $P = \{4, 8, 9, 16, 25, 27, 32, \dots\}$ leur ensemble, chacune n'étant comptée qu'une fois. On note $A$ l'ensemble des entiers $a \geqslant 2$ qui ne sont pas des puissances parfaites. On veut calculer $\sum_{n \in P} \frac{1}{n - 1}$.

    **1.** Montrer que tout entier $m \geqslant 2$ s'écrit de façon unique sous la forme $m = a^{r}$, avec $a \in A$ et $r \geqslant 1$. On pourra utiliser la décomposition en facteurs premiers et le PGCD des exposants.

    **2.** En déduire que $(a, s) \mapsto a^{s}$ est une bijection de $A \times \{2, 3, \dots\}$ sur $P$.

    **3.** Montrer que, dans $[0\,,+\infty]$, 
    $$\sum_{n \in P} \frac{1}{n - 1} = \sum_{a \in A}\ \sum_{N \geqslant 2} \frac{c_{N}}{a^{N}} \qquad\text{et}\qquad \sum_{m=2}^{+\infty}\,\sum_{k=2}^{+\infty} \frac{1}{m^{k}} = \sum_{a \in A}\ \sum_{N \geqslant 2} \frac{c'_{N}}{a^{N}},$$
     où $c_{N}$ est le nombre de couples $(s, j)$ d'entiers tels que $s \geqslant 2$, $j \geqslant 1$ et $sj = N$, et $c'_{N}$ le nombre de couples $(r, k)$ tels que $r \geqslant 1$, $k \geqslant 2$ et $rk = N$.

    **4.** Conclure à l'aide d'un exemple du cours.

    Ce résultat a été publié par Euler en 1737, qui l'attribuait à Goldbach.
  corrige: |
    **1.** *Existence.* Soit $m \geqslant 2$ et $m = p_{1}^{\alpha_{1}}\cdots p_{\ell}^{\alpha_{\ell}}$ sa décomposition en facteurs premiers (chapitre 12, théorème 6). On note $g$ le plus grand entier qui divise tous les exposants $\alpha_{i}$ ; il existe, puisque ces diviseurs communs sont compris entre $1$ et $\alpha_{1}$. On pose $r = g$ et $a = p_{1}^{\alpha_{1}/g}\cdots p_{\ell}^{\alpha_{\ell}/g}$, de sorte que $a \geqslant 2$ et $m = a^{r}$. Si $a$ était une puissance parfaite, $a = b^{s}$ avec $s \geqslant 2$, l'unicité de la décomposition donnerait $\frac{\alpha_{i}}{g} = s\,v_{p_{i}}(b)$ pour tout $i$ : l'entier $sg > g$ diviserait tous les $\alpha_{i}$, ce qui contredit la définition de $g$. Donc $a \in A$.

    *Unicité.* Soit $m = a^{r} = b^{t}$ avec $a, b \in A$ et $r, t \geqslant 1$. Soit $d = r \wedge t$, et $r = dr'$, $t = dt'$, avec $r' \wedge t' = 1$ (chapitre 12, proposition 6). Pour tout nombre premier $p$, la proposition 10 du chapitre 12 donne $r\,v_{p}(a) = t\,v_{p}(b)$, donc $r'\,v_{p}(a) = t'\,v_{p}(b)$. Ainsi $t'$ divise $r'\,v_{p}(a)$, et, par le lemme de Gauss (chapitre 12, théorème 5), $t'$ divise $v_{p}(a)$ pour tout $p$. L'entier $c = \prod_{p} p^{v_{p}(a)/t'}$ vérifie alors $a = c^{t'}$ ; comme $a$ n'est pas une puissance parfaite, $t' = 1$. De même $r' = 1$, donc $r = t$, puis $v_{p}(a) = v_{p}(b)$ pour tout $p$, et $a = b$. 
    $$\boxed{\text{tout } m \geqslant 2 \text{ s'écrit de façon unique } m = a^{r}, \ a \in A, \ r \geqslant 1}$$
     Par exemple, $64 = 2^{6}$, avec $a = 2$ et $r = 6$, et non $8^{2}$ ou $4^{3}$, car $8$ et $4$ sont des puissances parfaites ; $36 = 6^{2}$, avec $6 \in A$. L'unicité a été contrôlée pour $m < 5\,000$ ✓.

    **2.** Pour $a \in A$ et $s \geqslant 2$, l'entier $a^{s}$ est une puissance parfaite : l'application $(a, s) \mapsto a^{s}$ envoie bien $A \times \{2, 3, \dots\}$ dans $P$. Elle est surjective : si $n = b^{t} \in P$, avec $b \geqslant 2$ et $t \geqslant 2$, la question 1 donne $b = a^{r}$ avec $a \in A$, et $n = a^{rt}$ avec $rt \geqslant 2$. Elle est injective : si $a^{s} = a'^{s'}$, l'unicité de la question 1, appliquée à l'entier $a^{s}$, donne $a = a'$ et $s = s'$. Donc 
    $$\boxed{(a, s) \mapsto a^{s} \text{ est une bijection de } A \times \{2, 3, \dots\} \text{ sur } P}$$

    **3.** Tous les termes sont positifs, et tous les calculs se font dans $[0\,,+\infty]$. Pour $n \in P$, on a $n \geqslant 4$, et la série géométrique donne $\frac{1}{n - 1} = \frac{1/n}{1 - 1/n} = \sum_{j=1}^{+\infty} \frac{1}{n^{j}}$ (théorème 1). Par le théorème 9, puis le changement d'indice par la bijection $(a, s, j) \mapsto (a^{s}, j)$ de $A \times \{s \geqslant 2\} \times \mathbb{N}^{*}$ sur $P \times \mathbb{N}^{*}$ (question 2 et proposition 10 (iv)), 
    $$\sum_{n \in P} \frac{1}{n - 1} = \sum_{(n,j) \in P \times \mathbb{N}^{*}} \frac{1}{n^{j}} = \sum_{(a,s,j)} \frac{1}{a^{sj}}.$$
     On groupe les triplets selon $a$ et selon la valeur $N = sj$ (théorème 8) : pour $a$ et $N$ fixés, le paquet a $c_{N}$ éléments, sur lesquels le terme vaut $a^{-N}$, et $c_{1} = 0$ puisque $s \geqslant 2$. D'où la première égalité : 
    $$\boxed{\sum_{n \in P} \frac{1}{n - 1} = \sum_{a \in A}\ \sum_{N \geqslant 2} \frac{c_{N}}{a^{N}}}$$
     De même, la bijection $(a, r) \mapsto a^{r}$ de $A \times \mathbb{N}^{*}$ sur $\{2, 3, \dots\}$ de la question 1 transforme la famille $(m^{-k})_{m \geqslant 2, k \geqslant 2}$ en la famille $(a^{-rk})$, indexée par les triplets $(a, r, k)$ tels que $r \geqslant 1$ et $k \geqslant 2$. En groupant encore selon $a$ et $N = rk$ : 
    $$\boxed{\sum_{m=2}^{+\infty}\,\sum_{k=2}^{+\infty} \frac{1}{m^{k}} = \sum_{(m,k)} \frac{1}{m^{k}} = \sum_{a \in A}\ \sum_{N \geqslant 2} \frac{c'_{N}}{a^{N}}}$$
     la première égalité étant le théorème 9.

    **4.** Un couple $(s, j)$ tel que $sj = N$ est déterminé par le diviseur $s$ de $N$, et la condition $j \geqslant 1$ est automatique : $c_{N}$ est le nombre de diviseurs $s \geqslant 2$ de $N$. De même, $c'_{N}$ est le nombre de diviseurs $k \geqslant 2$ de $N$. Ainsi $\boxed{c_{N} = c'_{N} = d(N) - 1}$, où $d(N)$ est le nombre de diviseurs positifs de $N$, et les deux sommes de la question 3 sont égales. Le cours (section 20.6.3) a calculé la seconde par le théorème de Fubini positif : elle vaut $\sum_{k \geqslant 2} \big(\zeta(k) - 1\big) = 1$. Donc 
    $$\boxed{\sum_{n \in P} \frac{1}{n - 1} = \frac{1}{3} + \frac{1}{7} + \frac{1}{8} + \frac{1}{15} + \frac{1}{24} + \frac{1}{26} + \frac{1}{31} + \cdots = 1}$$
     La somme sur les puissances parfaites inférieures à $10^{12}$ vaut $0{,}999999$, l'écart étant de l'ordre de $10^{-6}$ ✓.

    *À retenir.* Le calcul ne demande jamais de vérifier une convergence : tous les termes étant positifs, les théorèmes 8 et 9 et la proposition 10 (iv) justifient chaque étape dans $[0\,,+\infty]$, et la finitude apparaît à la fin. La difficulté est arithmétique : c'est l'unicité de la question 1 qui permet de compter chaque puissance parfaite une seule fois. L'erreur la plus répandue est de sommer directement sur les couples $(a, s)$ avec $a \geqslant 2$ quelconque : $16 = 2^{4} = 4^{2}$ serait alors compté deux fois.
- id: "ma-20-59"
  feuille: "f-ma-20"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonction zêta]
  noeuds: [as-series]
  notions: []
  page_enonce: 13
  page_corrige: 65
  enonce: |
    *La série des inverses des nombres premiers diverge.* On note $(p_{k})_{k \geqslant 1}$ la suite croissante des nombres premiers et, pour $r \geqslant 1$, $E_{r}$ l'ensemble des entiers $n \geqslant 1$ dont tous les diviseurs premiers appartiennent à $\{p_{1}, \dots, p_{r}\}$ ; ainsi $1 \in E_{r}$.

    **1.** Soit $r \geqslant 1$ et $s \geqslant 1$ un réel. Montrer que, dans $[0\,,+\infty]$, 
    $$\sum_{n \in E_{r}} \frac{1}{n^{s}} = \prod_{k=1}^{r} \frac{1}{1 - p_{k}^{-s}}.$$
     On pourra utiliser l'unicité de la décomposition en facteurs premiers et la proposition 15 du cours.

    **2.** En déduire que, pour tout réel $s > 1$, $\displaystyle\prod_{k=1}^{r} \frac{1}{1 - p_{k}^{-s}}$ tend vers $\zeta(s)$ quand $r$ tend vers $+\infty$.

    **3.** En prenant $s = 1$, montrer que $\displaystyle\prod_{k=1}^{r} \frac{1}{1 - 1/p_{k}} \geqslant H_{p_{r}}$, puis que la série $\sum_{k \geqslant 1} \ln\Big(\dfrac{1}{1 - 1/p_{k}}\Big)$ diverge.

    **4.** En déduire que la série $\sum_{k \geqslant 1} \frac{1}{p_{k}}$ diverge. Comparer avec la série des inverses des carrés : en ce sens, les nombres premiers sont « plus nombreux » que les carrés.
  corrige: |
    Comme l'ensemble des nombres premiers est infini (chapitre 1), la suite $(p_{k})$ est bien définie ; elle est strictement croissante et à valeurs entières, donc $p_{k} \geqslant k + 1$ et $p_{k}$ tend vers $+\infty$. Pour $s \geqslant 1$ réel, on a $p^{-s} \leqslant \frac{1}{2} < 1$ pour tout nombre premier $p$.

    **1.** On raisonne par récurrence sur $r$. Pour $r = 1$, l'application $j \mapsto p_{1}^{j}$ est une bijection de $\mathbb{N}$ sur $E_{1}$, et, par la proposition 10 (iv) et la série géométrique, 
    $$\sum_{n \in E_{1}} \frac{1}{n^{s}} = \sum_{j=0}^{+\infty} (p_{1}^{-s})^{j} = \frac{1}{1 - p_{1}^{-s}}.$$
     Soit $r \geqslant 2$, et supposons le résultat vrai au rang $r - 1$ ; la somme sur $E_{r-1}$ est alors finie. Tout $n \in E_{r}$ s'écrit de façon unique $n = m\,p_{r}^{j}$, avec $j = v_{p_{r}}(n) \in \mathbb{N}$ et $m \in E_{r-1}$, par l'unicité de la décomposition en facteurs premiers (chapitre 12, théorème 6). L'application $(m, j) \mapsto m\,p_{r}^{j}$ est donc une bijection de $E_{r-1} \times \mathbb{N}$ sur $E_{r}$. Par la proposition 10 (iv), puis le produit de deux familles sommables (proposition 15), 
    $$\sum_{n \in E_{r}} \frac{1}{n^{s}} = \sum_{(m,j) \in E_{r-1} \times \mathbb{N}} \frac{1}{m^{s}}\,(p_{r}^{-s})^{j} = \Big(\sum_{m \in E_{r-1}} \frac{1}{m^{s}}\Big)\frac{1}{1 - p_{r}^{-s}} = \prod_{k=1}^{r} \frac{1}{1 - p_{k}^{-s}}.$$

    $$\boxed{\sum_{n \in E_{r}} \frac{1}{n^{s}} = \prod_{k=1}^{r} \frac{1}{1 - p_{k}^{-s}} \qquad (r \geqslant 1,\ s \geqslant 1)}$$
     La somme est donc finie, même pour $s = 1$ : par exemple, la somme des inverses des entiers $2^{a}3^{b}5^{c}$ vaut $2 \cdot \frac{3}{2} \cdot \frac{5}{4} = \frac{15}{4}$ ✓.

    **2.** Soit $s > 1$ et $P_{r}(s)$ le produit de la question 1. Un entier $n \leqslant p_{r}$ appartient à $E_{r}$, puisque ses diviseurs premiers sont au plus égaux à $n$, donc à $p_{r}$. Le théorème 8, appliqué à la partition de $\mathbb{N}^{*}$ en $E_{r}$ et son complémentaire, donne, toutes les sommes étant finies (théorème 5), 
    $$0 \leqslant \zeta(s) - P_{r}(s) = \sum_{n \notin E_{r}} \frac{1}{n^{s}} \leqslant \sum_{n=p_{r}+1}^{+\infty} \frac{1}{n^{s}}.$$
     Le majorant est le reste d'indice $p_{r}$ de la série de Riemann, qui tend vers $0$ quand $r$ tend vers $+\infty$ (proposition 3), puisque $p_{r}$ tend vers $+\infty$ : 
    $$\boxed{\prod_{k=1}^{r} \frac{1}{1 - p_{k}^{-s}} \xrightarrow[r \to +\infty]{} \zeta(s) \qquad (s > 1)}$$
     Pour $s = 2$, le produit étendu aux nombres premiers inférieurs à $10^{6}$ vaut $1{,}6449340$, très proche de $\zeta(2) \approx 1{,}6449341$ ✓.

    **3.** Avec $s = 1$ et le même argument, les entiers $1$, …, $p_{r}$ appartiennent à $E_{r}$, et la croissance (proposition 10 (iii)) donne 
    $$\boxed{\prod_{k=1}^{r} \frac{1}{1 - 1/p_{k}} = \sum_{n \in E_{r}} \frac{1}{n} \geqslant \sum_{n=1}^{p_{r}} \frac{1}{n} = H_{p_{r}}}$$
     En prenant le logarithme, la somme partielle d'indice $r$ de la série étudiée vérifie 
    $$\sum_{k=1}^{r} \ln\Big(\frac{1}{1 - 1/p_{k}}\Big) \geqslant \ln H_{p_{r}},$$
     qui tend vers $+\infty$, puisque $H_{n}$ tend vers $+\infty$ et que $p_{r}$ tend vers $+\infty$. Les sommes partielles ne sont pas majorées : $\boxed{\text{la série } \sum \ln\Big(\dfrac{1}{1 - 1/p_{k}}\Big) \text{ diverge}}$.

    **4.** Comme $\frac{1}{p_{k}}$ tend vers $0$, on a $\ln\big(\frac{1}{1 - 1/p_{k}}\big) = -\ln\big(1 - \frac{1}{p_{k}}\big) \sim \frac{1}{p_{k}}$ (chapitre 10, $\ln(1 + x) \sim x$). Les deux séries sont à termes positifs ; par le théorème 4, elles sont de même nature : 
    $$\boxed{\sum_{k \geqslant 1} \frac{1}{p_{k}} \text{ diverge}}$$
     alors que $\sum_{k \geqslant 1} \frac{1}{k^{2}}$ converge. En ce sens, il y a « plus » de nombres premiers que de carrés : s'il existait un réel $c > 0$ tel que $p_{k} \geqslant c\,k^{2}$ à partir d'un certain rang, la série $\sum \frac{1}{p_{k}}$ convergerait par comparaison. Le même argument vaut pour toute puissance $k^{\alpha}$ avec $\alpha > 1$. La divergence est d'une lenteur extrême : la somme des inverses des nombres premiers inférieurs à $10^{6}$ ne vaut qu'environ $2{,}887$.

    *À retenir.* La question 3 redémontre que l'ensemble des nombres premiers est infini, ce qui est la preuve d'Euler : s'il n'y avait que $r$ nombres premiers, on aurait $E_{r} = \mathbb{N}^{*}$, et $H_{n}$ serait majoré par le produit fini $\prod_{k=1}^{r} \frac{1}{1 - 1/p_{k}}$ pour tout $n$, ce qui contredit la divergence de la série harmonique. La divergence de $\sum \frac{1}{p_{k}}$ est un renforcement quantitatif du théorème d'Euclide du chapitre 1.
- id: "ma-20-60"
  feuille: "f-ma-20"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [familles sommables]
  noeuds: [q-denombrable]
  notions: [denombrable]
  page_enonce: 13
  page_corrige: 66
  enonce: |
    *La proportion des couples d'entiers premiers entre eux.* On définit la fonction $\mu : \mathbb{N}^{*} \to \mathbb{Z}$ par $\mu(1) = 1$, $\mu(n) = (-1)^{r}$ si $n$ est le produit de $r$ nombres premiers deux à deux distincts, et $\mu(n) = 0$ sinon, c'est-à-dire si $n$ est divisible par le carré d'un nombre premier. Par exemple, $\mu(6) = 1$, $\mu(7) = -1$ et $\mu(12) = 0$.

    **1.** **(a)** Pour $n \geqslant 1$, calculer $\displaystyle s_{n} = \sum_{d \mid n} \mu(d)$, la somme portant sur les diviseurs positifs $d$ de $n$. On pourra écrire $n = p_{1}^{\alpha_{1}}\cdots p_{r}^{\alpha_{r}}$ et se ramener aux diviseurs de $p_{1}\cdots p_{r}$.

    **(b)** Montrer que la famille $\Big(\dfrac{\mu(k)}{k^{2}m^{2}}\Big)_{(k,m) \in (\mathbb{N}^{*})^{2}}$ est sommable, et en déduire que $\displaystyle\sum_{k=1}^{+\infty} \frac{\mu(k)}{k^{2}} = \frac{6}{\pi^{2}}$.

    **2.** Pour $n \geqslant 1$, on note $q_{n}$ le nombre de couples $(u, v) \in [\![1\,;n]\!]^{2}$ tels que $u \wedge v = 1$. Montrer que 
    $$q_{n} = \sum_{k=1}^{+\infty} \mu(k)\,\Big\lfloor\frac{n}{k}\Big\rfloor^{2},$$
     la somme ne comportant qu'un nombre fini de termes non nuls. On pourra remarquer que $\sum_{d \mid u \wedge v} \mu(d)$ vaut $1$ si $u \wedge v = 1$ et $0$ sinon.

    **3.** En déduire que $\dfrac{q_{n}}{n^{2}}$ tend vers $\dfrac{6}{\pi^{2}} \approx 0{,}608$ quand $n$ tend vers $+\infty$, et interpréter ce résultat.

    Les quatre derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.(a)** Pour $n = 1$, le seul diviseur est $1$, et $s_{1} = \mu(1) = 1$. Soit $n \geqslant 2$ et $n = p_{1}^{\alpha_{1}}\cdots p_{r}^{\alpha_{r}}$ sa décomposition, avec $r \geqslant 1$. Les diviseurs positifs de $n$ sont les $p_{1}^{\beta_{1}}\cdots p_{r}^{\beta_{r}}$ avec $0 \leqslant \beta_{i} \leqslant \alpha_{i}$ (chapitre 12, théorème 6). Par définition, $\mu$ est nulle en ceux dont un exposant $\beta_{i}$ dépasse $1$. Il reste les diviseurs de $p_{1}\cdots p_{r}$, c'est-à-dire les produits $\prod_{i \in J} p_{i}$, pour $J \subset [\![1\,;r]\!]$, chacun obtenu une seule fois, et $\mu$ vaut $(-1)^{\operatorname{card} J}$ en ce produit. En groupant les parties $J$ selon leur cardinal $j$ (chapitre 3, théorème 1), puis par la formule du binôme (chapitre 3, théorème 2), 
    $$s_{n} = \sum_{J \subset [\![1\,;r]\!]} (-1)^{\operatorname{card} J} = \sum_{j=0}^{r} \binom{r}{j}(-1)^{j} = (1 - 1)^{r} = 0,$$
     puisque $r \geqslant 1$. Ainsi 
    $$\boxed{s_{1} = 1 \qquad\text{et}\qquad s_{n} = 0 \text{ pour } n \geqslant 2}$$
     Par exemple, pour $n = 12$, les diviseurs $1$, $2$, $3$, $4$, $6$, $12$ donnent $1 - 1 - 1 + 0 + 1 + 0 = 0$ ✓.

    **(b)** Comme $|\mu(k)| \leqslant 1$, on a $\big|\frac{\mu(k)}{k^{2}m^{2}}\big| \leqslant \frac{1}{k^{2}m^{2}}$, terme d'une famille sommable, de somme $\frac{\pi^{4}}{36}$ (premier exemple de la section 20.6.3). Par domination (proposition 12 (i)), la famille $\Big(\dfrac{\mu(k)}{k^{2}m^{2}}\Big)_{(k,m) \in (\mathbb{N}^{*})^{2}}$ est sommable. On calcule sa somme de deux façons.

    D'une part, c'est la famille des produits de $\big(\frac{\mu(k)}{k^{2}}\big)_{k \geqslant 1}$ et de $\big(\frac{1}{m^{2}}\big)_{m \geqslant 1}$, sommables par domination et par le théorème 5 ; la proposition 15 donne la somme $\Big(\sum_{k=1}^{+\infty} \frac{\mu(k)}{k^{2}}\Big)\frac{\pi^{2}}{6}$.

    D'autre part, on groupe les couples selon la valeur $n = km$ (théorème 10). Le paquet de $n$ est formé des couples $(k, \frac{n}{k})$, pour $k$ diviseur de $n$, et sa somme est $\frac{1}{n^{2}}\sum_{k \mid n} \mu(k) = \frac{s_{n}}{n^{2}}$. Par la question (a), la somme totale est $\sum_{n=1}^{+\infty} \frac{s_{n}}{n^{2}} = 1$. En comparant, 
    $$\boxed{\sum_{k=1}^{+\infty} \frac{\mu(k)}{k^{2}} = \frac{6}{\pi^{2}} \approx 0{,}6079}$$
     La somme des $20\,000$ premiers termes vaut $0{,}607927$ ✓.

    **2.** Soit $u, v \in [\![1\,;n]\!]$. Par la question 1(a), $\sum_{d \mid u \wedge v} \mu(d) = s_{u \wedge v}$ vaut $1$ si $u \wedge v = 1$ et $0$ sinon. Les diviseurs de $u \wedge v$ sont les diviseurs communs à $u$ et $v$ (chapitre 12, proposition 3 (i)), qui sont au plus égaux à $n$. Donc 
    $$q_{n} = \sum_{u=1}^{n}\sum_{v=1}^{n} \ \sum_{\substack{1 \leqslant d \leqslant n \\ d \mid u,\ d \mid v}} \mu(d) = \sum_{d=1}^{n} \mu(d)\,\operatorname{card}\{u \in [\![1\,;n]\!] \mid d \mid u\}^{2},$$
     en intervertissant les sommes finies (chapitre 3, proposition 6) et en écrivant le nombre de couples $(u, v)$ de multiples de $d$ comme un carré (chapitre 3, proposition 7). Les multiples de $d$ dans $[\![1\,;n]\!]$ sont $d$, $2d$, …, $\lfloor\frac{n}{d}\rfloor d$, au nombre de $\lfloor\frac{n}{d}\rfloor$. Pour $d > n$, ce nombre est nul, et la somme peut être prolongée à tout $d \geqslant 1$ : 
    $$\boxed{q_{n} = \sum_{k=1}^{n} \mu(k)\Big\lfloor\frac{n}{k}\Big\rfloor^{2} = \sum_{k=1}^{+\infty} \mu(k)\Big\lfloor\frac{n}{k}\Big\rfloor^{2}}$$
     La formule a été contrôlée par un dénombrement direct pour $n \leqslant 120$ ✓. Par exemple, 
    $$q_{4} = 16\,\mu(1) + 4\,\mu(2) + 1\,\mu(3) + 1\,\mu(4) = 16 - 4 - 1 + 0 = 11 :$$
     parmi les $16$ couples de $[\![1\,;4]\!]^{2}$, on retire les $4$ couples de nombres pairs et le couple $(3, 3)$.

    **3.** Pour $x \geqslant 0$, on a $0 \leqslant x - \lfloor x\rfloor < 1$ et $0 \leqslant x + \lfloor x\rfloor \leqslant 2x$, donc $0 \leqslant x^{2} - \lfloor x\rfloor^{2} \leqslant 2x$. Avec $x = \frac{n}{k}$ et $|\mu(k)| \leqslant 1$, 
    $$\Big|\frac{q_{n}}{n^{2}} - \sum_{k=1}^{n} \frac{\mu(k)}{k^{2}}\Big| \leqslant \frac{1}{n^{2}}\sum_{k=1}^{n} \Big(\Big(\frac{n}{k}\Big)^{2} - \Big\lfloor\frac{n}{k}\Big\rfloor^{2}\Big) \leqslant \frac{1}{n^{2}}\sum_{k=1}^{n} \frac{2n}{k} = \frac{2H_{n}}{n}.$$
     Comme $H_{n} \sim \ln n$ (proposition 7), $\frac{2H_{n}}{n}$ tend vers $0$, et la somme partielle $\sum_{k=1}^{n} \frac{\mu(k)}{k^{2}}$ tend vers $\frac{6}{\pi^{2}}$ par la question 1(b). Donc 
    $$\boxed{\frac{q_{n}}{n^{2}} \xrightarrow[n \to +\infty]{} \frac{6}{\pi^{2}} \approx 0{,}608}$$
     Parmi les $n^{2}$ couples d'entiers de $[\![1\,;n]\!]$, la proportion de ceux qui sont formés de deux entiers premiers entre eux tend vers $\frac{6}{\pi^{2}}$ : pour $n$ grand, un peu plus de six couples sur dix sont premiers entre eux. On trouve $\frac{q_{100}}{100^{2}} = 0{,}6087$ et $\frac{q_{1\,000}}{1\,000^{2}} = 0{,}608383$ ✓.

    ![Figure](documents/figures/64d7cdfe4976cad6.svg)

    Les points bleus sont les proportions $\frac{q_{n}}{n^{2}}$, calculées exactement par la formule de la question 2 ; ils oscillent au-dessus de la droite ocre d'ordonnée $\frac{6}{\pi^{2}}$, avec des pics aux nombres premiers $n$ (par exemple $n = 37$), et l'écart décroît comme le prévoit la majoration en $\frac{2H_{n}}{n}$.

    *À retenir.* La fonction $\mu$ « inverse » la fonction constante $1$ : la relation $\sum_{d \mid n} \mu(d) = 0$ pour $n \geqslant 2$ est exactement ce qui fait du produit de familles de la question 1(b) un calcul de $\frac{1}{\zeta(2)}$. La question 2 en fait un outil de dénombrement : remplacer la condition « $u \wedge v = 1$ » par la somme $\sum_{d \mid u \wedge v} \mu(d)$ transforme un comptage difficile en sommes de parties entières.

    Les quatre derniers exercices sont des problèmes en autonomie ; le corrigé commence par l'idée directrice.
