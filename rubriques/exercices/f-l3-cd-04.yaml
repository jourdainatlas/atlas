- id: "l3-cd-04-01"
  feuille: "f-l3-cd-04"
  numero: 1
  partie: "Applications bilinéaires continues"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [applications bilinéaires continues]
  noeuds: [f-operateurs]
  notions: [forme-bilineaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On munit $E \times F$ de la norme $\lVert (x, y) \rVert = \max(\lVert x \rVert, \lVert y \rVert)$. Soit $B : E \times F \to G$ une application bilinéaire.

    **1.** Montrer que les trois propriétés suivantes sont équivalentes :

    **(a)** $B$ est continue ;

    **(b)** $B$ est continue en $(0, 0)$ ;

    **(c)** il existe une constante $M \geqslant 0$ telle que $\lVert B(x, y) \rVert \leqslant M\lVert x \rVert\,\lVert y \rVert$ pour tous $(x, y) \in E \times F$.

    **2.** On suppose $E$ et $F$ de dimension finie. Montrer que toutes les applications bilinéaires de $E \times F$ dans $G$ sont continues.

    **3.** Dans le cas général, on note $\mathcal{L}_{2}(E \times F, G)$ l'ensemble des applications bilinéaires continues de $E \times F$ dans $G$. Montrer que c'est un espace vectoriel, que 
    $$\lVert B \rVert = \sup_{\lVert x \rVert \leqslant 1,\ \lVert y \rVert \leqslant 1}\lVert B(x, y) \rVert$$
     est une norme sur cet espace, et que $\lVert B(x, y) \rVert \leqslant \lVert B \rVert\,\lVert x \rVert\,\lVert y \rVert$ pour tous $(x, y) \in E \times F$.
  corrige: |
    C'est la proposition 5 du cours, que l'on redémontre ; la preuve suit celle des applications linéaires (chapitre 1, prop. 14), la bilinéarité remplaçant la linéarité.

    **1.** (a) $\Rightarrow$ (b) est clair.

    (b) $\Rightarrow$ (c) : par continuité en $(0, 0)$, où $B$ est nulle, il existe $\delta > 0$ tel que $\lVert x \rVert \leqslant \delta$ et $\lVert y \rVert \leqslant \delta$ entraînent $\lVert B(x, y) \rVert \leqslant 1$. Pour $x$, $y$ non nuls, $B\Big(\frac{\delta x}{\lVert x \rVert}, \frac{\delta y}{\lVert y \rVert}\Big)$ est de norme au plus $1$, et, par bilinéarité, 
    $$\boxed{\lVert B(x, y) \rVert \leqslant \frac{1}{\delta^{2}}\lVert x \rVert\,\lVert y \rVert}\text{ ;}$$
     l'inégalité est triviale si $x$ ou $y$ est nul.

    (c) $\Rightarrow$ (a) : $B(x + h, y + k) - B(x, y) = B(h, y) + B(x, k) + B(h, k)$, de norme au plus $M\big(\lVert h \rVert\,\lVert y \rVert + \lVert x \rVert\,\lVert k \rVert + \lVert h \rVert\,\lVert k \rVert\big)$, qui tend vers $0$ quand $(h, k) \to 0$.

    **2.** Soit $(e_{i})$ une base de $E$ et $(f_{j})$ une base de $F$. Par bilinéarité, $B(x, y) = \sum_{i, j}x_{i}y_{j}B(e_{i}, f_{j})$. Toutes les normes étant équivalentes en dimension finie (chapitre 1, th. 5), il existe $C$ tel que $|x_{i}| \leqslant C\lVert x \rVert$ et $|y_{j}| \leqslant C\lVert y \rVert$, d'où (c) avec $M = C^{2}\sum_{i, j}\lVert B(e_{i}, f_{j}) \rVert$ : 
    $$\boxed{\text{toute application bilinéaire est continue}}\text{.}$$

    **3.** Une combinaison linéaire d'applications bilinéaires vérifiant (c) vérifie (c) : $\mathcal{L}_{2}(E \times F, G)$ est un sous-espace vectoriel des applications de $E \times F$ dans $G$. La quantité $\lVert B \rVert$ est finie par (c). Elle est homogène et vérifie l'inégalité triangulaire, comme une borne supérieure de normes ; si $\lVert B \rVert = 0$, $B$ est nulle sur le produit des boules unités, donc partout par bilinéarité. Enfin, pour $x$, $y$ non nuls, $\lVert B(x, y) \rVert = \lVert x \rVert\,\lVert y \rVert\,\Big\|B\Big(\frac{x}{\lVert x \rVert}, \frac{y}{\lVert y \rVert}\Big)\Big\| \leqslant \lVert B \rVert\,\lVert x \rVert\,\lVert y \rVert$.
- id: "l3-cd-04-02"
  feuille: "f-l3-cd-04"
  numero: 2
  partie: "Applications bilinéaires continues"
  etoiles: 1
  types: [Calcul]
  mots_cles: [applications bilinéaires continues]
  noeuds: [f-operateurs]
  notions: [forme-bilineaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On munit $\mathbb{R}^{n}$ et $\mathbb{R}^{3}$ de la norme euclidienne $\lVert \cdot \rVert_{2}$. Calculer, au sens de l'exercice 1, les normes des applications bilinéaires 
    $$L : \mathbb{R}^{n} \times \mathbb{R}^{n} \to \mathbb{R},\ (x, y) \mapsto \langle x, y \rangle \qquad \text{et} \qquad L' : \mathbb{R}^{3} \times \mathbb{R}^{3} \to \mathbb{R}^{3},\ (x, y) \mapsto x \wedge y.$$
  corrige: |
    Dans les deux cas, une inégalité classique donne la majoration, et un couple bien choisi l'atteint.

    $\triangleright$ *Produit scalaire.* Par Cauchy-Schwarz, $|\langle x, y \rangle| \leqslant \lVert x \rVert_{2}\,\lVert y \rVert_{2}$, avec égalité pour $x = y = e_{1}$ : $\boxed{\lVert L \rVert = 1}$.

    $\triangleright$ *Produit vectoriel.* $\lVert x \wedge y \rVert_{2} = \lVert x \rVert_{2}\,\lVert y \rVert_{2}\,|\sin\theta|$, où $\theta$ est l'angle de $x$ et $y$ (identité de Lagrange $\lVert x \wedge y \rVert^{2} + \langle x, y \rangle^{2} = \lVert x \rVert^{2}\lVert y \rVert^{2}$). Le maximum est atteint pour $x = e_{1}$, $y = e_{2}$, orthogonaux : $\boxed{\lVert L' \rVert = 1}$.
- id: "l3-cd-04-03"
  feuille: "f-l3-cd-04"
  numero: 3
  partie: "Différentielles d'ordre supérieur"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["différentielles d'ordre supérieur"]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Montrer que les applications suivantes sont deux fois différentiables et calculer leur différentielle seconde.

    **1.** $f \in \mathcal{L}(E, G)$.

    **2.** $b : E \times F \to G$ bilinéaire continue. Montrer de plus que $b$ est de classe $\mathcal{C}^{\infty}$ et déterminer $\mathrm{d}^{k}b$ pour tout $k$.

    **3.** $f : \mathcal{M}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $f(A) = A^{2}$, puis $f(A) = A^{3}$ : on calculera $\mathrm{d}^{2}f(A)(H, K)$.

    **4.** $g : \mathrm{GL}_{n}(\mathbb{R}) \to \mathcal{M}_{n}(\mathbb{R})$, $g(A) = A^{-1}$ : on calculera $\mathrm{d}^{2}g(A)(H, K)$.
  corrige: |
    On calcule $\mathrm{d} f$, puis on la différentie à son tour ; dans chaque cas, $\mathrm{d} f(a)\cdot k$ est une expression simple en $a$, qu'on dérive dans la direction $h$.

    **1.** $\mathrm{d} f(a) = f$ pour tout $a$ : $\mathrm{d} f$ est constante, donc $\boxed{\mathrm{d}^{2}f = 0}$.

    **2.** $\mathrm{d} b(x, y)\cdot(h_{2}, k_{2}) = b(h_{2}, y) + b(x, k_{2})$ (chapitre 2, exercice 1). L'application $(x, y) \mapsto \mathrm{d} b(x, y)$ est linéaire continue de $E \times F$ dans $\mathcal{L}(E \times F, G)$ ; elle est donc égale à sa différentielle, et 
    $$\boxed{\mathrm{d}^{2}b(x, y)\big((h_{1}, k_{1}), (h_{2}, k_{2})\big) = b(h_{1}, k_{2}) + b(h_{2}, k_{1})}.$$
     Cette expression ne dépend plus de $(x, y)$ : $\mathrm{d}^{2}b$ est constante, $\mathrm{d}^{3}b = 0$, et 
    $$\boxed{b \text{ est de classe } \mathcal{C}^{\infty}, \text{ avec } \mathrm{d}^{k}b = 0 \text{ pour } k \geqslant 3}\text{.}$$

    **3.** Pour $f(A) = A^{2}$, $\mathrm{d} f(A)\cdot K = AK + KA$, linéaire en $A$, d'où $\boxed{\mathrm{d}^{2}f(A)(H, K) = HK + KH}$. Pour $f(A) = A^{3}$, $\mathrm{d} f(A)\cdot K = KA^{2} + AKA + A^{2}K$ (chapitre 2, exercice 3) ; en dérivant par rapport à $A$ dans la direction $H$, 
    $$\boxed{\mathrm{d}^{2}f(A)(H, K) = AHK + AKH + HAK + KAH + HKA + KHA},$$
     somme des six produits de $A$, $H$, $K$ dans tous les ordres. Pour des nombres, on retrouverait $6aHK = f''(a)HK$.

    **4.** $\mathrm{d} g(A)\cdot K = -A^{-1}KA^{-1}$ (chapitre 2, exercice 5). On dérive par rapport à $A$ dans la direction $H$, avec $\mathrm{d}(A^{-1})\cdot H = -A^{-1}HA^{-1}$ et la formule de Leibniz : 
    $$\boxed{\mathrm{d}^{2}g(A)(H, K) = A^{-1}HA^{-1}KA^{-1} + A^{-1}KA^{-1}HA^{-1}}.$$
     Pour $n = 1$, c'est $\frac{2HK}{a^{3}}$, et l'on retrouve $\big(\frac{1}{a}\big)'' = \frac{2}{a^{3}}$.
- id: "l3-cd-04-04"
  feuille: "f-l3-cd-04"
  numero: 4
  partie: "Différentielles d'ordre supérieur"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["différentielles d'ordre supérieur"]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Dans cet exercice, $E$ et $F$ sont de dimension finie.

    **1.** Soit $f : U \to F$ différentiable, $a \in U$ et $v \in E$. Montrer que $f_{a, v} : t \mapsto f(a + tv)$ est définie sur un intervalle ouvert contenant $0$ et dérivable en tout point où elle est définie, et calculer $f_{a, v}'(0)$. On suppose $f$ de classe $\mathcal{C}^{k}$ ; calculer $f_{a, v}^{(k)}(0)$.

    **2.** Soit $f : U \to F$ deux fois différentiable sur $U$ et $h \in E$. Montrer que $\varphi : x \mapsto \mathrm{d} f(x)\cdot h$ est différentiable sur $U$, et calculer $\mathrm{d}\varphi(a)\cdot k$ pour $a \in U$ et $k \in E$.

    **3.** Soit $f : U \to F$ deux fois différentiable. Montrer que $x \mapsto \mathrm{d} f(x)\cdot x$ est différentiable et calculer sa différentielle.

    **4.** Soit $f : U \to F$ de classe $\mathcal{C}^{\infty}$ et $a \in U$. Montrer que $v \mapsto \mathrm{d}^{k}f(a)v^{k}$ est différentiable sur $E$ et calculer sa différentielle.
  corrige: |
    Chacune des quatre applications est la composée de $\mathrm{d} f$, ou de $\mathrm{d}^{k}f$, avec une application linéaire ou multilinéaire ; on conclut par la règle de la chaîne.

    **1.** $U$ est ouvert : $\{t \,;\, a + tv \in U\}$ est un ouvert de $\mathbb{R}$ contenant $0$, donc contient un intervalle ouvert contenant $0$. Par la règle de la chaîne, $f_{a, v}'(t) = \mathrm{d} f(a + tv)\cdot v$, d'où $\boxed{f_{a, v}'(0) = \mathrm{d} f(a)\cdot v}$. Par récurrence, si $f$ est de classe $\mathcal{C}^{k}$, $f_{a, v}^{(j)}(t) = \mathrm{d}^{j}f(a + tv)v^{j}$ pour $j \leqslant k$ : on dérive $t \mapsto \mathrm{d}^{j}f(a + tv)$, qui a pour dérivée $\mathrm{d}^{j + 1}f(a + tv)\cdot v$, puis on évalue en $(v, \dots, v)$, ce qui est linéaire. D'où 
    $$\boxed{f_{a, v}^{(k)}(0) = \mathrm{d}^{k}f(a)v^{k}}.$$

    **2.** $\varphi = e_{h} \circ \mathrm{d} f$, où $e_{h} : L \mapsto L\cdot h$ est linéaire continue de $\mathcal{L}(E, F)$ dans $F$. Donc $\varphi$ est différentiable et $\mathrm{d}\varphi(a)\cdot k = \big(\mathrm{d}(\mathrm{d} f)(a)\cdot k\big)\cdot h$, soit 
    $$\boxed{\mathrm{d}\varphi(a)\cdot k = \mathrm{d}^{2}f(a)(k, h)},$$
     qui vaut aussi $\mathrm{d}^{2}f(a)(h, k)$ par le théorème de Schwarz (cours, th. 2) : la dérivée de $D_{h}f$ dans la direction $k$ est la dérivée seconde croisée.

    **3.** $\psi(x) = \mathrm{d} f(x)\cdot x = \beta\big(\mathrm{d} f(x), x\big)$, où $\beta(L, x) = L\cdot x$ est bilinéaire continue. Par la formule de Leibniz (chapitre 2, prop. 12), 
    $$\boxed{\mathrm{d}\psi(a)\cdot k = \mathrm{d}^{2}f(a)(k, a) + \mathrm{d} f(a)\cdot k}.$$

    **4.** $v \mapsto \mathrm{d}^{k}f(a)v^{k}$ est la composée de $v \mapsto (v, \dots, v)$, linéaire, et de l'application $k$-linéaire symétrique $M = \mathrm{d}^{k}f(a)$ (cours, prop. 12). Par la proposition 11 du cours, 
    $$\mathrm{d} M(v, \dots, v)\cdot w = \sum_{i = 1}^{k}M(v, \dots, w, \dots, v),$$
     $w$ étant à la $i$-ème place ; par symétrie, ces $k$ termes sont égaux : 
    $$\boxed{\mathrm{d}\big(v \mapsto \mathrm{d}^{k}f(a)v^{k}\big)(v)\cdot w = k\,\mathrm{d}^{k}f(a)(w, v, \dots, v)}.$$
     Pour $k = 2$ et une forme quadratique $q(v) = B(v, v)$, c'est la formule $\mathrm{d} q(v)\cdot w = 2B(v, w)$.
- id: "l3-cd-04-05"
  feuille: "f-l3-cd-04"
  numero: 5
  partie: "Différentielles d'ordre supérieur"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["différentielles d'ordre supérieur", matrice hessienne]
  noeuds: [gd-classe-ck, fq-taylor-young]
  notions: [classe-ck, matrice-hessienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $f : \mathbb{R}^{3} \to \mathbb{R}^{2}$, $f(x, y, z) = \big(z\sin(xy),\ x^{2}y^{3}z\big)$. Calculer la différentielle seconde de $f$.

    **2.** Soit $f : \mathbb{R}^{3} \to \mathbb{R}$, $f(x, y, z) = x^{2}y^{3}z^{5}$. Calculer la matrice hessienne de $f$ au point $(2, -1, 1)$.
  corrige: |
    On calcule les matrices hessiennes, une par coordonnée (cours, prop. 7) ; les calculs sont vérifiés avec sympy.

    **1.** Pour $f_{1} = z\sin(xy)$ et $f_{2} = x^{2}y^{3}z$, 
    $$H_{f_{1}} = \begin{pmatrix} -y^{2}z\sin(xy) & z\cos(xy) - xyz\sin(xy) & y\cos(xy) \\ z\cos(xy) - xyz\sin(xy) & -x^{2}z\sin(xy) & x\cos(xy) \\ y\cos(xy) & x\cos(xy) & 0 \end{pmatrix},$$

    $$H_{f_{2}} = \begin{pmatrix} 2y^{3}z & 6xy^{2}z & 2xy^{3} \\ 6xy^{2}z & 6x^{2}yz & 3x^{2}y^{2} \\ 2xy^{3} & 3x^{2}y^{2} & 0 \end{pmatrix},$$
     et 
    $$\boxed{\mathrm{d}^{2}f(a)(h, k) = \big({}^{t}h\,H_{f_{1}}(a)\,k,\ {}^{t}h\,H_{f_{2}}(a)\,k\big)}\text{,}$$
     à valeurs dans $\mathbb{R}^{2}$.

    **2.** Pour $f = x^{2}y^{3}z^{5}$, le calcul donne 
    $$\boxed{H_{f}(2, -1, 1) = \begin{pmatrix} -2 & 12 & -20 \\ 12 & -24 & 60 \\ -20 & 60 & -80 \end{pmatrix}}.$$
     Par exemple, $\frac{\partial^{2}f}{\partial y\partial z} = 15x^{2}y^{2}z^{4}$ vaut $60$ au point considéré.
- id: "l3-cd-04-06"
  feuille: "f-l3-cd-04"
  numero: 6
  partie: "Différentielles d'ordre supérieur"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["différentielles d'ordre supérieur"]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ et $\Phi : \theta \mapsto f(\cos\theta, \sin\theta)$. Calculer $\Phi''(\theta)$.

    **2.** Soit $f : E \to F$ et $g : F \to G$ de classe $\mathcal{C}^{2}$, avec $E$, $F$, $G$ de dimension finie. Déterminer la différentielle seconde de $g \circ f$.
  corrige: |
    On dérive deux fois une composée ; le second terme, dû à la courbure de l'application intérieure, est celui qu'on oublie le plus souvent.

    **1.** Avec $\gamma(\theta) = (\cos\theta, \sin\theta)$, $\Phi' = -\sin\theta\,\partial_{x}f + \cos\theta\,\partial_{y}f$, les dérivées étant prises en $\gamma(\theta)$. En dérivant à nouveau, et par le théorème de Schwarz, 
    $$\boxed{\Phi''(\theta) = \sin^{2}\theta\,\frac{\partial^{2}f}{\partial x^{2}} - 2\sin\theta\cos\theta\,\frac{\partial^{2}f}{\partial x\partial y} + \cos^{2}\theta\,\frac{\partial^{2}f}{\partial y^{2}} - \cos\theta\,\dfrac{\partial f}{\partial x} - \sin\theta\,\dfrac{\partial f}{\partial y}}.$$
     Les trois premiers termes forment $\mathrm{d}^{2}f(\gamma)(\gamma', \gamma')$, les deux derniers $\mathrm{d} f(\gamma)\cdot\gamma''$, avec $\gamma'' = -\gamma$.

    **2.** $\mathrm{d}(g \circ f)(x)\cdot k = \mathrm{d} g\big(f(x)\big)\cdot\big(\mathrm{d} f(x)\cdot k\big)$. En dérivant dans la direction $h$, par la règle de la chaîne et la formule de Leibniz, 
    $$\boxed{\mathrm{d}^{2}(g \circ f)(x)(h, k) = \mathrm{d}^{2}g\big(f(x)\big)\big(\mathrm{d} f(x)\cdot h, \mathrm{d} f(x)\cdot k\big) + \mathrm{d} g\big(f(x)\big)\cdot\mathrm{d}^{2}f(x)(h, k)}.$$
     La question 1 en est le cas $f = \gamma$, $g = f$.
- id: "l3-cd-04-07"
  feuille: "f-l3-cd-04"
  numero: 7
  partie: "Différentielles d'ordre supérieur"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["différentielles d'ordre supérieur"]
  noeuds: [gd-classe-ck]
  notions: [classe-ck]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $E$ et $F$ de dimension finie et $f : E \to F$ de classe $\mathcal{C}^{2}$ telle que $f(tx) = t^{2}f(x)$ pour tout $t \in \mathbb{R}$ et tout $x \in E$. Montrer que $\mathrm{d}^{2}f(0)(x, x) = 2f(x)$ pour tout $x \in E$.
  corrige: |
    On fixe $x$ et on étudie $f$ sur la droite $\mathbb{R} x$. Soit $\varphi(t) = f(tx) = t^{2}f(x)$. D'une part, $\varphi''(0) = 2f(x)$. D'autre part, par l'exercice 4 (question 1), $\varphi''(0) = \mathrm{d}^{2}f(0)(x, x)$. Donc $\boxed{\mathrm{d}^{2}f(0)(x, x) = 2f(x)}$ : une application homogène de degré $2$ et de classe $\mathcal{C}^{2}$ est la forme quadratique $\frac{1}{2}\mathrm{d}^{2}f(0)(x, x)$.

    *Remarque.* Sans l'hypothèse $\mathcal{C}^{2}$, c'est faux : $f(x, y) = \dfrac{x^{4}}{x^{2} + y^{2}}$, prolongée par $0$, est homogène de degré $2$ sans être quadratique ; elle n'est pas de classe $\mathcal{C}^{2}$ en $0$. C'est le pendant, au second ordre, de l'identité d'Euler (chapitre 2, exercice 38).
- id: "l3-cd-04-08"
  feuille: "f-l3-cd-04"
  numero: 8
  partie: "Formules de Taylor"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $U$ un ouvert de $\mathbb{R}^{n}$, $f : U \to \mathbb{R}$ et $a \in U$.

    **1.** Lorsque $f$ est de classe $\mathcal{C}^{k}$, écrire $\mathrm{d}^{k}f(a)h^{k}$ explicitement à l'aide des dérivées partielles $k$-ièmes de $f$.

    **2.** On suppose $f$ de classe $\mathcal{C}^{k + 1}$ sur $U$, et $h \in \mathbb{R}^{n}$ tel que $[a, a + h] \subset U$. Montrer la formule de Taylor avec reste intégral, en appliquant la formule correspondante pour une variable réelle à une fonction bien choisie : 
    $$f(a + h) - f(a) - \mathrm{d} f(a)\cdot h - \cdots - \frac{1}{k!}\mathrm{d}^{k}f(a)h^{k} = \int_{0}^{1}\frac{(1 - t)^{k}}{k!}\mathrm{d}^{k + 1}f(a + th)h^{k + 1}\,\mathrm{d} t.$$

    **3.** On suppose $f$ de classe $\mathcal{C}^{k}$ sur $U$ et $[a, a + h] \subset U$. Montrer qu'il existe $\theta \in \,]0, 1[$ tel que 
    $$f(a + h) - f(a) - \mathrm{d} f(a)\cdot h - \cdots - \frac{1}{(k - 1)!}\mathrm{d}^{k - 1}f(a)h^{k - 1} = \frac{1}{k!}\mathrm{d}^{k}f(a + \theta h)h^{k}.$$
     Démontrer de même la formule de Taylor-Young à l'ordre $k$ pour une fonction de $n$ variables.
  corrige: |
    On se ramène à une variable avec $g(t) = f(a + th)$, $t \in [0, 1]$, dont les dérivées sont $g^{(j)}(t) = \mathrm{d}^{j}f(a + th)h^{j}$ (exercice 4). C'est la démarche du théorème 3 du cours.

    **1.** En développant par multilinéarité, 
    $$\boxed{\mathrm{d}^{k}f(a)h^{k} = \sum_{i_{1}, \dots, i_{k} = 1}^{n}\frac{\partial^{k}f}{\partial x_{i_{1}}\cdots\partial x_{i_{k}}}(a)\,h_{i_{1}}\cdots h_{i_{k}}},$$

    $$\boxed{\mathrm{d}^{k}f(a)h^{k} = \sum_{|\alpha| = k}\frac{k!}{\alpha!}\,\partial^{\alpha}f(a)\,h^{\alpha}},$$
     où, dans la seconde forme, on a regroupé les termes égaux par le théorème de Schwarz, avec les notations $\alpha = (\alpha_{1}, \dots, \alpha_{n})$, $\alpha! = \alpha_{1}!\cdots\alpha_{n}!$ et $h^{\alpha} = h_{1}^{\alpha_{1}}\cdots h_{n}^{\alpha_{n}}$.

    **2.** La formule de Taylor avec reste intégral pour $g$, de classe $\mathcal{C}^{k + 1}$ sur $[0, 1]$ (cours, prop. 1), s'écrit $g(1) = \sum_{j = 0}^{k}\frac{g^{(j)}(0)}{j!} + \int_{0}^{1}\frac{(1 - t)^{k}}{k!}g^{(k + 1)}(t)\,\mathrm{d} t$ ; en remplaçant les $g^{(j)}$ par leurs expressions, $\boxed{\text{on obtient la formule demandée}}$.

    **3.** $g$ est à valeurs réelles, de classe $\mathcal{C}^{k}$ : l'égalité de Taylor-Lagrange (cours, prop. 3) donne $\theta \in \,]0, 1[$ tel que $g(1) = \sum_{j = 0}^{k - 1}\frac{g^{(j)}(0)}{j!} + \frac{g^{(k)}(\theta)}{k!}$, c'est-à-dire $\boxed{\text{la formule demandée}}$. Pour Taylor-Young, on écrit 
    $$f(a + h) - \sum_{j = 0}^{k}\frac{1}{j!}\mathrm{d}^{j}f(a)h^{j} = \frac{1}{k!}\Big(\mathrm{d}^{k}f(a + \theta h) - \mathrm{d}^{k}f(a)\Big)h^{k},$$
     de norme au plus $\frac{1}{k!}|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d}^{k}f(a + \theta h) - \mathrm{d}^{k}f(a)|\mkern-1.5mu|\mkern-1.5mu|\,\lVert h \rVert^{k}$, qui est un $o(\lVert h \rVert^{k})$ par continuité de $\mathrm{d}^{k}f$ en $a$ : 
    $$\boxed{f(a + h) = \sum_{j = 0}^{k}\frac{1}{j!}\mathrm{d}^{j}f(a)h^{j} + o(\lVert h \rVert^{k})}\text{.}$$

    *Piège.* Le point $\theta$ dépend de $h$, et la formule avec $\theta$ n'existe que pour $f$ à valeurs *réelles*, comme l'égalité des accroissements finis (chapitre 2, exercice 43).
- id: "l3-cd-04-09"
  feuille: "f-l3-cd-04"
  numero: 9
  partie: "Formules de Taylor"
  etoiles: 1
  types: [Calcul]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Écrire la formule de Taylor-Young à l'ordre $2$ pour une fonction de trois variables de classe $\mathcal{C}^{2}$.

    **2.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{3}$. Déterminer la différentielle troisième de $f$ à l'aide de ses dérivées partielles. Appliquer le théorème de Schwarz et en déduire la formule de Taylor-Young à l'ordre $3$ pour une fonction de deux variables.
  corrige: |
    On applique la formule de l'exercice 8 (question 1), regroupée par le théorème de Schwarz ; les dérivées sont prises en $a$, et $h = (h_{1}, h_{2}, h_{3})$ ou $(h_{1}, h_{2})$.

    **1.** 
    $$\boxed{f(a + h) = f(a) + \sum_{i = 1}^{3}\partial_{i}f\,h_{i} + \frac{1}{2}\sum_{i = 1}^{3}\partial_{i}^{2}f\,h_{i}^{2} + \sum_{1 \leqslant i < j \leqslant 3}\partial_{i}\partial_{j}f\,h_{i}h_{j} + o(\lVert h \rVert^{2})}.$$
     *Piège.* Les termes croisés n'ont pas de facteur $\frac{1}{2}$ : chacun apparaît deux fois dans $\mathrm{d}^{2}f(a)h^{2}$, une fois pour $\partial_{i}\partial_{j}$ et une fois pour $\partial_{j}\partial_{i}$.

    **2.** $\mathrm{d}^{3}f(a)(h, k, l) = \sum_{i, j, m}\frac{\partial^{3}f}{\partial x_{i}\partial x_{j}\partial x_{m}}(a)h_{i}k_{j}l_{m}$, somme de $8$ termes. Par le théorème de Schwarz, les dérivées troisièmes ne dépendent que du nombre de dérivations en $x$ et en $y$, et $\mathrm{d}^{3}f(a)h^{3} = f_{xxx}h_{1}^{3} + 3f_{xxy}h_{1}^{2}h_{2} + 3f_{xyy}h_{1}h_{2}^{2} + f_{yyy}h_{2}^{3}$. D'où 
    $$\boxed{\begin{aligned} f(a + h) = {} & f + f_{x}h_{1} + f_{y}h_{2} + \tfrac{1}{2}\big(f_{xx}h_{1}^{2} + 2f_{xy}h_{1}h_{2} + f_{yy}h_{2}^{2}\big) \\ & + \tfrac{1}{6}\big(f_{xxx}h_{1}^{3} + 3f_{xxy}h_{1}^{2}h_{2} + 3f_{xyy}h_{1}h_{2}^{2} + f_{yyy}h_{2}^{3}\big) + o(\lVert h \rVert^{3}). \end{aligned}}$$
     Les coefficients $1, 2, 1$ et $1, 3, 3, 1$ sont ceux du binôme, comme dans $(h_{1}\partial_{x} + h_{2}\partial_{y})^{k}$.
- id: "l3-cd-04-10"
  feuille: "f-l3-cd-04"
  numero: 10
  partie: "Formules de Taylor"
  etoiles: 1
  types: [Calcul]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$, $f(x, y) = x^{3}y^{2}$, et $a = (1, 2)$. Calculer $\mathrm{d} f(a)\cdot h$ et $\mathrm{d}^{2}f(a)(h, k)$ pour tous $h$, $k \in \mathbb{R}^{2}$. En déduire le développement limité à l'ordre $2$ de $f$ en $a$.
  corrige: |
    En $a = (1, 2)$ : $f = 4$, $f_{x} = 3x^{2}y^{2} = 12$, $f_{y} = 2x^{3}y = 4$, $f_{xx} = 6xy^{2} = 24$, $f_{xy} = 6x^{2}y = 12$, $f_{yy} = 2x^{3} = 2$. Donc 
    $$\boxed{\mathrm{d} f(a)\cdot h = 12h_{1} + 4h_{2}}, \qquad \boxed{\mathrm{d}^{2}f(a)(h, k) = 24h_{1}k_{1} + 12(h_{1}k_{2} + h_{2}k_{1}) + 2h_{2}k_{2}},$$

    $$\boxed{f(1 + h_{1}, 2 + h_{2}) = 4 + 12h_{1} + 4h_{2} + 12h_{1}^{2} + 12h_{1}h_{2} + h_{2}^{2} + o(\lVert h \rVert^{2})}.$$
     *Vérification.* Le terme $12h_{1}h_{2}$ est aussi le coefficient de $h_{1}h_{2}$ dans $(1 + h_{1})^{3}(2 + h_{2})^{2}$ développé : $3 \cdot 2 \cdot 2 = 12$.
- id: "l3-cd-04-11"
  feuille: "f-l3-cd-04"
  numero: 11
  partie: "Formules de Taylor"
  etoiles: 1
  types: [Calcul]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Écrire la formule de Taylor à l'ordre $2$ pour la fonction $f(x, y) = y^{x}$ au point $(1, 1)$.

    **2.** Écrire la formule de Taylor en $(0, 0)$ à l'ordre $2$, puis à l'ordre $5$, puis à l'ordre $13$, pour la fonction $f(x, y) = y^{5} + x^{3}y - x^{2} + y$.

    **3.** Déterminer la formule de Taylor-Young à l'ordre $5$ en $(0, 0)$ pour $f(x, y) = x^{3}y^{2} + xy^{2} + xy + y$. En déduire $\mathrm{d} f(0, 0)$ et $\mathrm{d}^{2}f(0, 0)$.
  corrige: |
    Pour un polynôme, la formule de Taylor en $0$ à l'ordre $k$ consiste à garder les termes de degré au plus $k$ : c'est l'unicité du développement limité.

    **1.** $f = e^{x\ln y}$, et en $(1, 1)$ : $f = 1$, $f_{x} = \ln y\,y^{x} = 0$, $f_{y} = xy^{x - 1} = 1$, $f_{xx} = (\ln y)^{2}y^{x} = 0$, $f_{xy} = y^{x - 1}(1 + x\ln y) = 1$, $f_{yy} = x(x - 1)y^{x - 2} = 0$. Avec $h = x - 1$, $k = y - 1$ (calcul vérifié avec sympy), 
    $$\boxed{y^{x} = 1 + k + hk + o\big(h^{2} + k^{2}\big)}.$$

    **2.** Les termes de $f$ sont de degrés $5$, $4$, $2$ et $1$. À l'ordre $2$ : $\boxed{f(x, y) = y - x^{2} + o(x^{2} + y^{2})}$. À l'ordre $5$ et à l'ordre $13$, tous les termes sont gardés : $\boxed{f(x, y) = y^{5} + x^{3}y - x^{2} + y}$, avec un reste nul ; toutes les différentielles d'ordre $\geqslant 6$ sont nulles.

    **3.** Tous les termes sont de degré au plus $5$, donc la formule à l'ordre $5$ est $f$ elle-même, avec un reste nul. Par unicité, la partie de degré $1$ est $\mathrm{d} f(0)\cdot h$ et la partie de degré $2$ est $\frac{1}{2}\mathrm{d}^{2}f(0)h^{2}$ : 
    $$\boxed{\mathrm{d} f(0, 0)\cdot(h_{1}, h_{2}) = h_{2}}, \qquad \boxed{\mathrm{d}^{2}f(0, 0)(h, k) = h_{1}k_{2} + h_{2}k_{1}}.$$
     *Piège.* Le terme $xy^{2}$ est de degré $3$ : il ne contribue pas à $\mathrm{d}^{2}f(0, 0)$.
- id: "l3-cd-04-12"
  feuille: "f-l3-cd-04"
  numero: 12
  partie: "Formules de Taylor"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ telle que 
    $$f(0, 0) = \dfrac{\partial f}{\partial x}(0, 0) = \dfrac{\partial f}{\partial y}(0, 0) = \frac{\partial^{2}f}{\partial x^{2}}(0, 0) = \frac{\partial^{2}f}{\partial y^{2}}(0, 0) = 0 \qquad \text{et} \qquad \frac{\partial^{2}f}{\partial x\partial y}(0, 0) = 1.$$
     Montrer que l'application $g : \mathbb{R}^{2} \to \mathbb{R}$ définie par $g(x, y) = \dfrac{f(x, y) - xy}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$ et $g(0, 0) = 0$ est continue.
  corrige: |
    La formule de Taylor-Young à l'ordre $2$ en $(0, 0)$ (cours, th. 1) donne 
    $$f(x, y) = 0 + 0 + \frac{1}{2}\big(0 \cdot x^{2} + 2 \cdot 1 \cdot xy + 0 \cdot y^{2}\big) + o(x^{2} + y^{2}) = xy + o(x^{2} + y^{2}).$$
     Donc $g(x, y) = \dfrac{f(x, y) - xy}{x^{2} + y^{2}} \to 0 = g(0, 0)$ ; ailleurs, $g$ est continue comme quotient de fonctions continues. $\boxed{g \text{ est continue}}$.
- id: "l3-cd-04-13"
  feuille: "f-l3-cd-04"
  numero: 13
  partie: "Formules de Taylor"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $E$ un espace vectoriel normé de dimension finie et $f : E \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, à valeurs positives. On suppose qu'il existe une constante $M > 0$ telle que $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d}^{2}f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant M$ pour tout $x \in E$.

    **1.** On suppose d'abord $f$ à valeurs strictement positives. Montrer que, pour tous $x$, $h \in E$ et tout $t \in \mathbb{R}$, 
    $$f(x) + t\,\mathrm{d} f(x)\cdot h + \frac{t^{2}}{2}M\lVert h \rVert^{2} > 0.$$

    **2.** En déduire que, pour tout $x \in E$, $|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sqrt{2Mf(x)}$, et que cette inégalité reste vraie si $f$ est seulement positive.
  corrige: |
    L'idée est qu'un trinôme du second degré partout positif a un discriminant négatif.

    **1.** Soit $x$, $h \in E$. La formule de Taylor avec reste intégral à l'ordre $1$ pour $t \mapsto f(x + th)$ (exercice 8) et la majoration $|\mathrm{d}^{2}f(y)(h, h)| \leqslant M\lVert h \rVert^{2}$ donnent 
    $$0 < f(x + th) \leqslant f(x) + t\,\mathrm{d} f(x)\cdot h + \frac{t^{2}}{2}M\lVert h \rVert^{2},$$
     d'où 
    $$\boxed{f(x) + t\,\mathrm{d} f(x)\cdot h + \frac{t^{2}}{2}M\lVert h \rVert^{2} > 0}$$
     pour tout $t \in \mathbb{R}$.

    **2.** Si $h \neq 0$, ce trinôme en $t$ ne s'annule pas, donc son discriminant est négatif : $\big(\mathrm{d} f(x)\cdot h\big)^{2} < 2Mf(x)\lVert h \rVert^{2}$. En prenant la borne supérieure sur $\lVert h \rVert = 1$, $\boxed{|\mkern-1.5mu|\mkern-1.5mu|\mathrm{d} f(x)|\mkern-1.5mu|\mkern-1.5mu| \leqslant \sqrt{2Mf(x)}}$. Si $f$ est seulement positive, on applique ce résultat à $f + \varepsilon$, qui vérifie les mêmes hypothèses, puis on fait tendre $\varepsilon$ vers $0$.

    ![Figure](documents/figures/ca4bd9d9d56f2b67.svg)

    Pour $f(s) = \ln(1 + e^{s})$ sur $\mathbb{R}$, on a $0 < f'' \leqslant \frac{1}{4} = M$. En $x = 0$, avec $h = 1$, la parabole majorante reste au-dessus de la courbe, donc strictement positive : son minimum vaut $\ln 2 - \frac{1}{2} \approx 0{,}19$. On vérifie $f'(0) = \frac{1}{2} \leqslant \sqrt{2 \cdot \frac{1}{4}\ln 2} \approx 0{,}59$.
- id: "l3-cd-04-14"
  feuille: "f-l3-cd-04"
  numero: 14
  partie: "Formules de Taylor"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [formules de Taylor]
  noeuds: [de-taylor, fq-taylor-young]
  notions: [formule-taylor-young]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *(Différentielle seconde et développement limité.)* Soit $E$ et $F$ de dimension finie, $f : U \to F$ et $a \in U$.

    **1.** Montrer que $f$ est continue en $a$ si et seulement si elle admet un développement limité à l'ordre $0$ en $a$, et que $f$ est différentiable en $a$ si et seulement si elle admet un développement limité à l'ordre $1$ en $a$.

    **2.** Trouver une fonction de classe $\mathcal{C}^{1}$ au voisinage de $0$, qui admette un développement limité à l'ordre $2$ en $0$ et qui ne soit pas deux fois différentiable en $0$.
  corrige: |
    L'existence d'un développement limité à l'ordre $1$ caractérise la différentiabilité, mais à l'ordre $2$ cela ne marche plus.

    **1.** Si $f(a + h) = c + o(1)$, alors $c = f(a)$ (prendre $h = 0$) et $f$ est continue en $a$ ; la réciproque est la définition. Si $f(a + h) = c + L(h) + o(\lVert h \rVert)$ avec $L$ linéaire (continue, en dimension finie), alors $c = f(a)$ et c'est la définition de la différentiabilité avec $\mathrm{d} f(a) = L$ ; la réciproque est encore la définition. 
    $$\boxed{\text{Ordre } 0 \iff \text{continuité}, \quad \text{ordre } 1 \iff \text{différentiabilité}}\text{.}$$

    **2.** Soit $f(x) = x^{3}\sin\frac{1}{x}$, $f(0) = 0$. Comme $|f(x)| \leqslant |x|^{3}$, $\boxed{f(x) = o(x^{2})}$ : $f$ admet en $0$ le développement limité $0 + 0x + 0x^{2} + o(x^{2})$. Elle est de classe $\mathcal{C}^{1}$, avec $f'(x) = 3x^{2}\sin\frac{1}{x} - x\cos\frac{1}{x}$ et $f'(0) = 0$. Mais $\frac{f'(x) - f'(0)}{x} = 3x\sin\frac{1}{x} - \cos\frac{1}{x}$ n'a pas de limite : $\boxed{f \text{ n'est pas deux fois dérivable en } 0}$.

    ![Figure](documents/figures/5fb13dbcf2bccad1.svg)

    Le graphe est coincé entre $\pm x^{3}$, ce qui donne le développement limité à l'ordre $2$ ; mais la pente oscille entre $\pm|x|$ environ, avec une fréquence qui tend vers l'infini, et $f'$ n'est pas dérivable en $0$. L'échelle verticale est dilatée cinq fois par rapport à l'horizontale.
- id: "l3-cd-04-15"
  feuille: "f-l3-cd-04"
  numero: 15
  partie: "Convexité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convexité]
  noeuds: [fq-extremums]
  notions: [fonction-convexe]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $E$ un espace vectoriel normé de dimension finie, $U$ un ouvert convexe de $E$ et $f : U \to \mathbb{R}$. On rappelle que $f$ est convexe si et seulement si, pour tous $a$, $b \in U$ et tout $t \in [0, 1]$, 
    $$(1) \qquad f\big(ta + (1 - t)b\big) \leqslant tf(a) + (1 - t)f(b),$$
     ce qui s'écrit aussi $f\big(b + t(a - b)\big) \leqslant f(b) + t\big(f(a) - f(b)\big)$ : le graphe de $f$ est sous ses cordes.

    **1.** On suppose $f$ différentiable sur $U$. Montrer que $f$ est convexe si et seulement si, pour tous $x$, $y \in U$, $f(x) \geqslant f(y) + \mathrm{d} f(y)\cdot(x - y)$, c'est-à-dire si le graphe est au-dessus de ses tangentes.

    **2.** On suppose $f$ deux fois différentiable sur $U$. Montrer que $f$ est convexe si et seulement si la forme quadratique $h \mapsto \mathrm{d}^{2}f(x)(h, h)$ est positive pour tout $x \in U$. On pourra considérer la fonction $\varphi(t) = f\big(a + t(x - a)\big)$.

    **3.** Soit $A \in \mathcal{M}_{n}(\mathbb{R})$, $B \in \mathbb{R}^{n}$ et $f : \mathbb{R}^{n} \to \mathbb{R}$ définie par $f(X) = \dfrac{1}{2}\langle AX, X \rangle - \langle B, X \rangle$. Donner une condition nécessaire et suffisante pour que $f$ soit convexe.
  corrige: |
    On se ramène aux fonctions d'une variable, en restreignant $f$ aux segments : $f$ est convexe si et seulement si, pour tous $a$, $x \in U$, la fonction $\varphi(t) = f\big(a + t(x - a)\big)$ est convexe sur $[0, 1]$.

    **1.** $\triangleright$ *Convexe $\Rightarrow$ au-dessus des tangentes.* Pour $t \in \,]0, 1]$, la convexité donne 
    $$\frac{f\big(y + t(x - y)\big) - f(y)}{t} \leqslant f(x) - f(y).$$
     Quand $t \to 0^{+}$, le membre de gauche tend vers $\mathrm{d} f(y)\cdot(x - y)$, d'où $\boxed{f(x) \geqslant f(y) + \mathrm{d} f(y)\cdot(x - y)}$.

    $\triangleright$ *Au-dessus des tangentes $\Rightarrow$ convexe.* Soit $z = ta + (1 - t)b$. On écrit l'inégalité en $y = z$, pour $x = a$ puis pour $x = b$, et on combine avec les poids $t$ et $1 - t$ : 
    $$tf(a) + (1 - t)f(b) \geqslant f(z) + \mathrm{d} f(z)\cdot\big(ta + (1 - t)b - z\big) = f(z).$$

    **2.** $\varphi$ est deux fois dérivable, de dérivée seconde $\varphi''(t) = \mathrm{d}^{2}f\big(a + t(x - a)\big)(x - a, x - a)$ (exercice 4). Si $\mathrm{d}^{2}f$ est positive, $\varphi'' \geqslant 0$, $\varphi'$ est croissante et $\varphi$ est convexe (chapitre 2, exercice 14) : $\boxed{f \text{ est convexe}}$. Réciproquement, si $f$ est convexe, pour $x \in U$ et $h \in E$, $\psi(t) = f(x + th)$ est convexe au voisinage de $0$ ; sa dérivée est croissante (pente des cordes croissante), donc $\boxed{\psi''(0) = \mathrm{d}^{2}f(x)(h, h) \geqslant 0}$.

    **3.** $\mathrm{d}^{2}f(X)(H, H) = \langle AH, H \rangle = \langle SH, H \rangle$, avec $S = \frac{1}{2}(A + {}^{t}A)$, partie symétrique de $A$. Par la question 2, 
    $$\boxed{f \text{ est convexe} \iff S = \tfrac{1}{2}(A + {}^{t}A) \text{ est positive}}\text{,}$$
     c'est-à-dire si et seulement si les valeurs propres de $S$ sont positives ; la condition ne dépend pas de $B$.

    *Piège.* Il ne faut pas regarder les valeurs propres de $A$ elle-même : $A = \begin{pmatrix} 1 & 4 \\ 0 & 1 \end{pmatrix}$ a pour seule valeur propre $1$, mais $\langle AH, H \rangle = h_{1}^{2} + 4h_{1}h_{2} + h_{2}^{2}$ prend la valeur $-2$ en $H = (1, -1)$.

    ![Figure](documents/figures/736fe1d898bcdd0f.svg)

    Les deux caractérisations, pour une fonction d'une variable : la tangente reste sous le graphe (question 1), la corde reste au-dessus (définition). En dimension quelconque, on les applique sur chaque droite.
- id: "l3-cd-04-16"
  feuille: "f-l3-cd-04"
  numero: 16
  partie: "Symétrie des dérivées secondes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [symétrie des dérivées secondes]
  noeuds: [gd-schwarz]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(x, y) = xy\dfrac{x^{2} - y^{2}}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$ et $f(0, 0) = 0$. Montrer que les dérivées partielles secondes croisées existent en $(0, 0)$ et que 
    $$\dfrac{\partial }{\partial y}\Big(\dfrac{\partial f}{\partial x}\Big)(0, 0) = -1 \qquad \text{et} \qquad \dfrac{\partial }{\partial x}\Big(\dfrac{\partial f}{\partial y}\Big)(0, 0) = 1.$$
     Pourquoi le théorème de Schwarz ne s'applique-t-il pas ?
  corrige: |
    En coordonnées polaires, $f = \frac{1}{4}r^{2}\sin 4\theta$ : $f$ est de classe $\mathcal{C}^{1}$, mais ses dérivées secondes oscillent avec l'angle et n'ont pas de limite en $0$.

    $\triangleright$ *Dérivées premières sur les axes.* $\dfrac{\partial f}{\partial x}(0, y) = \lim_{h \to 0}\dfrac{f(h, y)}{h} = \lim_{h \to 0}\dfrac{y(h^{2} - y^{2})}{h^{2} + y^{2}} = -y$ pour $y \neq 0$, et $\dfrac{\partial f}{\partial x}(0, 0) = 0$ ; de même, $\dfrac{\partial f}{\partial y}(x, 0) = \lim_{k \to 0}\dfrac{f(x, k)}{k} = x$.

    $\triangleright$ *Dérivées croisées.* D'où 
    $$\boxed{\dfrac{\partial }{\partial y}\Big(\dfrac{\partial f}{\partial x}\Big)(0, 0) = \lim_{y \to 0}\frac{-y}{y} = -1}, \qquad \boxed{\dfrac{\partial }{\partial x}\Big(\dfrac{\partial f}{\partial y}\Big)(0, 0) = \lim_{x \to 0}\frac{x}{x} = 1}.$$

    $\triangleright$ *Pourquoi Schwarz ne s'applique pas.* Le théorème de Schwarz (cours, th. 2) suppose $f$ deux fois différentiable en $(0, 0)$. Ici, hors de l'origine, $\frac{\partial^{2}f}{\partial x\partial y} = \dfrac{x^{6} + 9x^{4}y^{2} - 9x^{2}y^{4} - y^{6}}{(x^{2} + y^{2})^{3}}$, qui vaut $1$ sur l'axe des $x$ et $-1$ sur l'axe des $y$ : cette dérivée n'a pas de limite en $0$, $\boxed{f \text{ n'est pas de classe } \mathcal{C}^{2}}$, et n'est pas deux fois différentiable en $0$.

    ![Figure](documents/figures/95daa4a7b627df6d.svg)

    La fonction est nulle sur les axes et sur les diagonales, et change de signe d'un secteur de $45^{\circ}$ à l'autre ; ses lignes de niveau se resserrent vers l'origine. Le long de l'axe des $y$, $\dfrac{\partial f}{\partial x} = -y$ ; le long de l'axe des $x$, $\dfrac{\partial f}{\partial y} = x$ : les deux pentes croisées en $0$ sont opposées.
