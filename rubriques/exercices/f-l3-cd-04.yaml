  page_enonce: 5
  page_corrige: 10
  enonce: |
    *(Théorème de Whitney.)* Soit $\mathcal{F}$ un fermé de $\mathbb{R}^{n}$, distinct de $\mathbb{R}^{n}$. On va montrer qu'il existe une fonction $f : \mathbb{R}^{n} \to \mathbb{R}_{+}$ de classe $\mathcal{C}^{\infty}$ dont l'ensemble des zéros est exactement $\mathcal{F}$.

    **1.** Donner l'exemple d'une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}^{n}$, strictement positive à l'intérieur de la boule unité et nulle partout en dehors.

    **2.** Justifier l'existence d'une suite de boules ouvertes $(B_{i})_{i \in \mathbb{N}}$ telles que $\mathcal{F} = \mathbb{R}^{n} \setminus \bigcup_{i \in \mathbb{N}}B_{i}$, ainsi que d'une suite d'applications $\varphi_{i} : \mathbb{R}^{n} \to \mathbb{R}_{+}$ de classe $\mathcal{C}^{\infty}$ telles que chaque $\varphi_{i}$ s'annule exactement sur $\mathbb{R}^{n} \setminus B_{i}$.

    **3.** Construire alors une fonction $f$ qui convient.
  corrige: |
    On construit $f$ comme une somme de fonctions « bosses », chacune nulle hors d'une boule, avec des coefficients assez petits pour que toutes les dérivées convergent.

    **1.** La fonction de Cauchy $\theta(s) = e^{-1/s}$ pour $s > 0$, $\theta(s) = 0$ pour $s \leqslant 0$, est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$ (cours, section 4.2). Alors 
    $$\boxed{\varphi(x) = \theta\big(1 - \lVert x \rVert_{2}^{2}\big) = \begin{cases} \exp\Big(-\dfrac{1}{1 - \lVert x \rVert_{2}^{2}}\Big) & \text{si } \lVert x \rVert_{2} < 1, \\ 0 & \text{sinon,} \end{cases}}$$
     est de classe $\mathcal{C}^{\infty}$ (composée de $\theta$ et d'un polynôme), strictement positive dans la boule unité ouverte et nulle en dehors.

    ![Figure](documents/figures/5e93b2c4ff22335a.svg)

    Le profil de $\varphi$ le long d'un diamètre : la fonction se raccorde à $0$ en $\pm 1$ avec toutes ses dérivées nulles, comme le contre-exemple de Cauchy du cours, si bien qu'aucune cassure n'est visible.

    **2.** Le complémentaire $\Omega = \mathbb{R}^{n} \setminus \mathcal{F}$ est un ouvert non vide. Les boules ouvertes à centre rationnel et rayon rationnel contenues dans $\Omega$ forment une famille dénombrable, non vide, dont la réunion est $\Omega$ (tout point de $\Omega$ est dans une telle boule). On les numérote $(B_{i})_{i \in \mathbb{N}}$, en répétant une boule si la famille est finie, et on pose, pour $B_{i} = B(c_{i}, r_{i})$, 
    $$\boxed{\varphi_{i}(x) = \varphi\Big(\frac{x - c_{i}}{r_{i}}\Big)}\text{,}$$
     positive, de classe $\mathcal{C}^{\infty}$, nulle exactement hors de $B_{i}$.

    **3.** Chaque $\varphi_{i}$ est nulle hors d'un compact, donc ses dérivées partielles de tous ordres sont bornées ; soit $M_{i} = \max_{|\alpha| \leqslant i}\sup|\partial^{\alpha}\varphi_{i}| \geqslant 1$ quitte à l'augmenter. On pose 
    $$\boxed{f = \sum_{i \in \mathbb{N}}\frac{\varphi_{i}}{2^{i}M_{i}}}.$$
     Pour $|\alpha| = p$ fixé, la série des dérivées $\partial^{\alpha}\varphi_{i}/(2^{i}M_{i})$ est normalement convergente, puisque son terme est majoré par $2^{-i}$ pour $i \geqslant p$. Par le théorème de dérivation des séries de fonctions (même argument qu'au chapitre 2, exercice 52), $f$ est de classe $\mathcal{C}^{\infty}$. Enfin $f \geqslant 0$, et $f(x) = 0$ si et seulement si tous les $\varphi_{i}(x)$ sont nuls, c'est-à-dire $x \notin \bigcup B_{i} = \Omega$ : $\boxed{f^{-1}(0) = \mathcal{F}}$.

    *Remarque.* Tout fermé, même très irrégulier (un ensemble de Cantor, une courbe sans tangente), est donc l'ensemble des zéros d'une fonction $\mathcal{C}^{\infty}$ : la régularité de $f$ n'impose aucune régularité à $f^{-1}(0)$ lorsque $\mathrm{d} f$ s'annule. C'est pourquoi le théorème des fonctions implicites (chapitre 3) demande une différentielle surjective.

