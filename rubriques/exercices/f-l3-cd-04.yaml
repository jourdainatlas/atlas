  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ et $n \in \mathbb{N}^{*}$ tels que $f(0) = 0$ et $f^{(k)}(0) = 0$ pour $1 \leqslant k \leqslant n$. Montrer que $x \mapsto \dfrac{f(x)}{x^{n}}$, prolongée en $0$, est de classe $\mathcal{C}^{\infty}$.

    **2.** Soit $f : \mathbb{R}^{n} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$. Montrer qu'il existe des fonctions $g_{i} : \mathbb{R}^{n} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ ($1 \leqslant i \leqslant n$) telles que, pour tout $x \in \mathbb{R}^{n}$, 
    $$f(x) = f(0) + \sum_{i = 1}^{n}x_{i}\,g_{i}(x).$$
     On souhaite remplacer $\mathbb{R}^{n}$ par un ouvert $U$ de $\mathbb{R}^{n}$ : donner des hypothèses sur $U$ pour lesquelles le résultat reste valable.

    **3.** Soit $O$ un ouvert convexe de $\mathbb{R}^{n}$ contenant $0$ et $f : O \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ telle que $f(0) = 0$ et $\mathrm{d} f(0) = 0$. Montrer qu'il existe des fonctions $h_{ij} : O \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$ ($1 \leqslant i, j \leqslant n$) telles que, pour tout $x \in O$, $f(x) = \displaystyle\sum_{i, j}x_{i}x_{j}\,h_{ij}(x)$.

    **4.** Montrer que $I = \{f \in \mathcal{C}^{\infty}(\mathbb{R}^{n}, \mathbb{R}) \,;\, f(0) = 0\}$ est un idéal maximal de l'anneau $\mathcal{C}^{\infty}(\mathbb{R}^{n}, \mathbb{R})$, engendré par un nombre fini d'éléments, et principal pour $n = 1$.
  corrige: |
    L'outil commun est la formule de Taylor avec reste intégral, qui écrit $f$ comme un produit d'un monôme et d'une intégrale dépendant d'un paramètre, dérivable sous le signe somme autant qu'on veut.

    **1.** Les dérivées $f^{(k)}(0)$, $0 \leqslant k \leqslant n$, étant nulles, la formule de Taylor avec reste intégral à l'ordre $n$ en $0$ (cours, prop. 1) s'écrit 
    $$f(x) = \frac{x^{n + 1}}{n!}\int_{0}^{1}(1 - t)^{n}f^{(n + 1)}(tx)\,\mathrm{d} t, \qquad \text{donc} \qquad \frac{f(x)}{x^{n}} = \frac{x}{n!}\int_{0}^{1}(1 - t)^{n}f^{(n + 1)}(tx)\,\mathrm{d} t.$$
     L'intégrande est de classe $\mathcal{C}^{\infty}$ en $(x, t)$, et l'on dérive sous le signe intégrale sur le segment $[0, 1]$ autant de fois qu'on veut : 
    $$\boxed{x \mapsto \frac{f(x)}{x^{n}} \text{ se prolonge en une fonction } \mathcal{C}^{\infty}}\text{,}$$
     nulle en $0$. Il suffirait d'ailleurs de supposer $f^{(k)}(0) = 0$ pour $k \leqslant n - 1$.

    **2.** Pour $x \in \mathbb{R}^{n}$, $f(x) - f(0) = \int_{0}^{1}\frac{\mathrm{d}}{\mathrm{d} t}f(tx)\,\mathrm{d} t = \sum_{i}x_{i}\int_{0}^{1}\dfrac{\partial f}{\partial x_{i}}(tx)\,\mathrm{d} t$, d'où 
    $$\boxed{g_{i}(x) = \int_{0}^{1}\dfrac{\partial f}{\partial x_{i}}(tx)\,\mathrm{d} t},$$
     de classe $\mathcal{C}^{\infty}$ par dérivation sous le signe intégrale. Le calcul utilise seulement que le segment $[0, x]$ est dans le domaine : 
    $$\boxed{\text{le résultat vaut sur tout ouvert } U \text{ étoilé par rapport à } 0}\text{,}$$
     en particulier sur tout ouvert convexe contenant $0$.

    **3.** On applique deux fois la question 2. D'abord $f(x) = \sum_{i}x_{i}g_{i}(x)$, avec $g_{i}(0) = \dfrac{\partial f}{\partial x_{i}}(0) = 0$. Puis, $O$ étant convexe et contenant $0$, $g_{i}(x) = \sum_{j}x_{j}h_{ij}(x)$ avec $h_{ij}(x) = \int_{0}^{1}\dfrac{\partial g_{i}}{\partial x_{j}}(tx)\,\mathrm{d} t$. D'où $\boxed{f(x) = \sum_{i, j}x_{i}x_{j}\,h_{ij}(x)}$, ce qui s'écrit aussi $f = \sum_{i, j}h_{ij}\,e_{i}^{*}e_{j}^{*}$.

    **4.** $I$ est le noyau du morphisme d'anneaux surjectif $f \mapsto f(0)$ de $\mathcal{C}^{\infty}(\mathbb{R}^{n}, \mathbb{R})$ sur le corps $\mathbb{R}$ ; le quotient étant un corps, $\boxed{I \text{ est un idéal maximal}}$. Par la question 2, tout $f \in I$ s'écrit $\sum_{i}x_{i}g_{i}$ : $\boxed{I = (x_{1}, \dots, x_{n})}$ est engendré par les $n$ fonctions coordonnées. Pour $n = 1$, $\boxed{I = (x)}$ est principal.

    *Remarque.* Pour $n \geqslant 2$, $I$ n'est pas principal : si $I = (g)$, alors $x_{1} = gu_{1}$ et $x_{2} = gu_{2}$, et, comme $g(0) = 0$, $\mathrm{d} x_{1} = u_{1}(0)\,\mathrm{d} g(0)$ et $\mathrm{d} x_{2} = u_{2}(0)\,\mathrm{d} g(0)$ seraient colinéaires, ce qui est faux.
- id: "l3-cd-04-18"
  feuille: "f-l3-cd-04"
  numero: 18
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse]
  noeuds: [gd-classe-ck]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *(Isométries de $\mathbb{R}^{n}$.)* On munit $\mathbb{R}^{n}$ de la norme euclidienne. Pour $f : \mathbb{R}^{n} \to \mathbb{R}^{n}$ de classe $\mathcal{C}^{2}$, on considère les deux propriétés suivantes, dont on va montrer qu'elles sont équivalentes : 
    $$(1) \quad \forall x, h \in \mathbb{R}^{n},\ \lVert f(x + h) - f(x) \rVert = \lVert h \rVert ; \qquad (2) \quad \forall x, h \in \mathbb{R}^{n},\ \lVert \mathrm{d} f(x)\cdot h \rVert = \lVert h \rVert.$$

    **1.** Montrer que (1) entraîne (2).

    **2.** On suppose (2). Que peut-on dire de la matrice jacobienne de $f$ ? On pose 
    $$a_{ijk} = \sum_{m = 1}^{n}\dfrac{\partial f_{m}}{\partial x_{i}}\,\frac{\partial^{2}f_{m}}{\partial x_{j}\partial x_{k}}.$$
     Montrer que $a_{ijk} = a_{ikj}$, puis que $a_{ijk} = -a_{kji}$. En déduire que $a_{ijk} = 0$ pour tous $i$, $j$, $k$, puis que la matrice jacobienne de $f$ est constante, et enfin que $f$ vérifie (1).
  corrige: |
    Une isométrie infinitésimale est une isométrie : on montre que la différentielle, partout orthogonale, est constante, grâce à la symétrie des dérivées secondes.

    **1.** Pour $t \neq 0$, $\Big\|\dfrac{f(x + th) - f(x)}{t}\Big\| = \lVert h \rVert$ ; en faisant tendre $t$ vers $0$, $\boxed{\lVert \mathrm{d} f(x)\cdot h \rVert = \lVert h \rVert}$.

    **2.** $\triangleright$ *La jacobienne est orthogonale.* Par polarisation, (2) entraîne $\langle J h, J k \rangle = \langle h, k \rangle$, où $J = J_{f}(x)$ : $\boxed{{}^{t}J J = I_{n}}$, soit $\sum_{m}\partial_{i}f_{m}\,\partial_{k}f_{m} = \delta_{ik}$ pour tous $i$, $k$.

    $\triangleright$ *Symétrie en $(j, k)$.* Par le théorème de Schwarz, $\partial_{j}\partial_{k}f_{m} = \partial_{k}\partial_{j}f_{m}$, donc $\boxed{a_{ijk} = a_{ikj}}$.

    $\triangleright$ *Antisymétrie en $(i, k)$.* On dérive la relation $\sum_{m}\partial_{i}f_{m}\,\partial_{k}f_{m} = \delta_{ik}$ par rapport à $x_{j}$ : 
    $$\sum_{m}\partial_{j}\partial_{i}f_{m}\,\partial_{k}f_{m} + \sum_{m}\partial_{i}f_{m}\,\partial_{j}\partial_{k}f_{m} = 0, \qquad \text{soit} \qquad a_{kji} + a_{ijk} = 0.$$

    $\triangleright$ *Nullité.* En alternant les deux règles (symétrie S en les deux derniers indices, antisymétrie A en le premier et le dernier), 
    $$a_{ijk} \overset{S}{=} a_{ikj} \overset{A}{=} -a_{jki} \overset{S}{=} -a_{jik} \overset{A}{=} a_{kij} \overset{S}{=} a_{kji} \overset{A}{=} -a_{ijk},$$
     donc $\boxed{a_{ijk} = 0}$. Pour $j$, $k$ fixés, le vecteur $w = (\partial_{j}\partial_{k}f_{m})_{m}$ vérifie ${}^{t}J w = 0$ ; $J$ étant inversible, $w = 0$. Toutes les dérivées secondes de $f$ sont nulles, donc $J_{f}$ est constante sur $\mathbb{R}^{n}$ connexe (chapitre 2, prop. 14), égale à une matrice orthogonale $Q$, et $f(x) = Qx + c$ : $\boxed{f \text{ vérifie } (1)}$.

    *Remarque.* C'est un cas particulier du théorème de Mazur-Ulam : les isométries d'un espace euclidien sont affines. L'hypothèse $\mathcal{C}^{2}$ sert ici à appliquer le théorème de Schwarz.
- id: "l3-cd-04-19"
