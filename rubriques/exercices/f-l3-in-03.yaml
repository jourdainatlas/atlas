  enonce: |
    **1.** Montrer que, pour tout $x \geqslant 0$, la suite $\Big(\big(1 + \frac{x}{n}\big)^{n}\Big)_{n \geqslant 1}$ est croissante, de limite $\mathrm{e}^{x}$.

    **2.** Pour $b > 1$, calculer $\lim_{n \to +\infty}\int_{\mathbb{R}_{+}}\Big(1 + \frac{x}{n}\Big)^{n}\mathrm{e}^{-bx}\,\mathrm{d}\lambda(x)$. Que se passe-t-il si $b \leqslant 1$ ?
  corrige: |
    **1.** $\ln\big(1 + \frac{x}{n}\big)^{n} = n\ln\big(1 + \frac{x}{n}\big)$ croît vers $x$ (exercice 22).

    **2.** Par convergence monotone, $\int_{\mathbb{R}_{+}}\big(1 + \frac{x}{n}\big)^{n}\mathrm{e}^{-bx}\,\mathrm{d} x \to \int_{0}^{+\infty}\mathrm{e}^{(1 - b)x}\,\mathrm{d} x$, qui vaut $\boxed{\frac{1}{b - 1}}$ si $b > 1$ et $+\infty$ si $b \leqslant 1$.

    ![Figure](documents/figures/372b7f81c59ec8e7.svg)

    Pour $b = 2$, les fonctions $\big(1 + \frac{x}{n}\big)^{n}\mathrm{e}^{-2x}$ (ocre) croissent vers $\mathrm{e}^{-x}$ (tirets carmin), et leurs intégrales, calculées numériquement, croissent vers $\frac{1}{b - 1} = 1$.
