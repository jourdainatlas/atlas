  source: "Féjoz (exosIntegration), exercice 2.2 (fonction de signe quelconque : on calcule séparément les intégrales de ses parties positive et négative)"
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Soit $f : [-2, 2] \to \mathbb{R}$, $x \mapsto 1 - |x|$, et $f^{+} = \max(f, 0)$, $f^{-} = \max(-f, 0)$. En n'utilisant que la définition de l'intégrale et le théorème de convergence monotone (sans la proposition 16 du cours), calculer $\int_{[-2, 2]}f^{+}\,\mathrm{d}\lambda$ et $\int_{[-2, 2]}f^{-}\,\mathrm{d}\lambda$. On pourra utiliser des fonctions étagées constantes sur les intervalles d'une subdivision régulière. Que vaudra « l'intégrale de $f$ » au chapitre 4 ?
  corrige: |
    Pour $N = 2^{n}$, soit $\varphi_{n}$ la fonction étagée qui vaut, sur chaque intervalle $[\frac{k}{N}, \frac{k + 1}{N}[$ de $[0, 1[$, la borne inférieure de $f^{+}$ sur cet intervalle, à savoir $1 - \frac{k + 1}{N}$, et de même sur $[-1, 0[$ par symétrie, nulle ailleurs. Comme les subdivisions sont dyadiques, chaque intervalle est réunion de deux intervalles de la suivante, sur lesquels la borne inférieure est plus grande : $(\varphi_{n})$ est croissante. Par continuité de $f^{+}$, $\varphi_{n}(x) \to f^{+}(x)$ en tout point. Le théorème de convergence monotone donne 
    $$\int f^{+}\,\mathrm{d}\lambda = \lim_{n}2\sum_{k=0}^{N-1}\frac{1}{N}\Big(1 - \frac{k + 1}{N}\Big) = \lim_{n}2 \cdot \frac{N - 1}{2N} = \boxed{1}\text{.}$$
     De même, $f^{-}(x) = |x| - 1$ sur $1 \leqslant |x| \leqslant 2$ ; sur $[1 + \frac{k}{N}, 1 + \frac{k + 1}{N}[$, sa borne inférieure est $\frac{k}{N}$, et $\int f^{-}\,\mathrm{d}\lambda = \lim 2\sum_{k}\frac{k}{N^{2}} = \boxed{1}$. Au chapitre 4, l'intégrale de $f$ sera $\int f^{+} - \int f^{-} = 0$, comme l'intégrale de Riemann.
