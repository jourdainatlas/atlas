  enonce: |
    Soit $\varphi : \Omega \to [0, +\infty]$ mesurable et $\nu(A) = \int_{A}\varphi\,\mathrm{d}\mu$ pour $A \in \mathcal{T}$ (cours, prop. 14).

    **1.** Retrouver que $\nu$ est une mesure, et que $\int f\,\mathrm{d}\nu = \int f\varphi\,\mathrm{d}\mu$ pour toute $f : \Omega \to [0, +\infty]$ mesurable, en commençant par les fonctions étagées. Montrer que $\mu(A) = 0$ entraîne $\nu(A) = 0$.

    **2.** À quelle condition sur $\varphi$ la mesure $\nu$ est-elle une probabilité ? finie ? $\sigma$-finie ?

    **3.** Montrer que $\delta_{0}$ n'est pas une mesure à densité par rapport à la mesure de Lebesgue sur $\mathbb{R}$. Donner un exemple de mesure à densité par rapport à la mesure de comptage sur $\mathbb{N}$.

    **4.** Sur $\mathbb{R}$, calculer : pour la densité $\chi_{[0, 1]}$, les mesures de $[0, 1]$, $[0, 2]$, $[0, \frac{1}{2}]$ et $\{\frac{1}{2}\}$ ; pour la densité $\mathrm{e}^{-x}\chi_{]0, +\infty[}(x)$, celles de $\mathbb{R}$, $\{1\}$, $[0, 1]$ et $[1, +\infty[$ ; pour la densité $x\mathrm{e}^{-x^{2}/2}\chi_{]0, +\infty[}(x)$, celles de $[0, 1]$ et de $\mathbb{R}$.
  corrige: |
    **1.** $\nu(\emptyset) = 0$, et pour des $A_{k}$ disjoints, $\chi_{\bigcup A_{k}}\varphi = \sum_{k}\chi_{A_{k}}\varphi$ ; la proposition 13 du cours donne $\nu\big(\bigcup A_{k}\big) = \sum\nu(A_{k})$. Pour $f = \chi_{A}$, $\int f\,\mathrm{d}\nu = \nu(A) = \int\chi_{A}\varphi\,\mathrm{d}\mu$ ; par linéarité, la formule vaut pour les fonctions étagées positives, puis, par le théorème 1 et la convergence monotone (appliquée des deux côtés, puisque $u_{k}\varphi$ croît vers $f\varphi$), pour toute $f$ mesurable positive. Si $\mu(A) = 0$, $\chi_{A}\varphi$ est nulle p.p., donc $\nu(A) = 0$ (cours, prop. 11).

    **2.** $\nu$ est une probabilité si et seulement si $\int\varphi\,\mathrm{d}\mu = 1$, finie si et seulement si $\int\varphi\,\mathrm{d}\mu < +\infty$. Si $\mu$ est $\sigma$-finie, $\nu$ est $\sigma$-finie si et seulement si $\varphi < +\infty$ $\mu$-p.p. En effet, si c'est le cas, les parties $\{\varphi \leqslant n\} \cap \Omega_{k}$ sont de $\nu$-mesures finies, et elles recouvrent $\Omega$ au $\mu$-négligeable $\{\varphi = +\infty\}$ près, qui est $\nu$-négligeable. Si au contraire $\mu(\{\varphi = +\infty\}) > 0$, toute partie $A$ de $\{\varphi = +\infty\}$ vérifie $\nu(A) = 0$ ou $+\infty$ selon que $\mu(A)$ est nulle ou non, et $\{\varphi = +\infty\}$ ne peut être recouvert par des parties de $\nu$-mesures finies.

    **3.** Si $\delta_{0} = \varphi\lambda$, la question 1 donnerait $\delta_{0}(\{0\}) = 0$ puisque $\lambda(\{0\}) = 0$ ; or $\delta_{0}(\{0\}) = 1$. Sur $\mathbb{N}$, *toute* mesure $\nu$ a une densité par rapport à la mesure de comptage, à savoir $\varphi(n) = \nu(\{n\})$ ; par exemple la loi de Poisson, de densité $\varphi(n) = \frac{\mathrm{e}^{-1}}{n!}$.

    **4.** Les propositions 16 et 17 du cours permettent de calculer avec des primitives : 
    $$\boxed{\begin{array}{l} \text{densité } \chi_{[0, 1]} : \ 1, \ 1, \ \tfrac{1}{2}, \ 0 \text{ ;} \qquad \text{densité } \mathrm{e}^{-x}\chi_{]0, +\infty[} : \ 1, \ 0, \ 1 - \mathrm{e}^{-1} \approx 0{,}632, \ \mathrm{e}^{-1} \approx 0{,}368 \text{ ;} \\[1mm] \text{densité } x\mathrm{e}^{-x^{2}/2}\chi_{]0, +\infty[} : \ \nu([0, 1]) = 1 - \mathrm{e}^{-1/2} \approx 0{,}393, \ \nu(\mathbb{R}) = 1. \end{array}}$$
