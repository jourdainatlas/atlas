  enonce: |
    Pour $f : \Omega \to \mathbb{R}$ et $M > 0$, on définit la *troncature* $f_{M}$ par $f_{M}(x) = f(x)$ si $|f(x)| \leqslant M$, $f_{M}(x) = M$ si $f(x) > M$ et $f_{M}(x) = -M$ si $f(x) < -M$. Montrer que $f$ est mesurable si et seulement si $f_{M}$ est mesurable pour tout $M > 0$.
  corrige: |
    $f_{M} = \max\big(-M, \min(f, M)\big)$ est mesurable si $f$ l'est (cours, prop. 4). Réciproquement, $f = \lim_{M \to +\infty}f_{M}$ (pour $M$ entier, la suite est même stationnaire en chaque point), donc $f$ est mesurable (cours, prop. 5). Les troncatures servent à ramener des fonctions quelconques à des fonctions bornées ; on les retrouvera au chapitre 4 et au chapitre 8 (densité des fonctions bornées dans $L^{p}$).
