  enonce: |
    Pour $n \in \mathbb{N}$ et $x \in \mathbb{R}$, on pose $f_{n}(x) = \sum_{k=0}^{n}x^{2k}(1 - x)$.

    **1.** Déterminer l'ensemble $D$ des $x$ pour lesquels $(f_{n}(x))$ est une suite croissante de réels positifs, et sa limite sur $D$.

    **2.** Démontrer que $\sum_{k=0}^{+\infty}\int_{0}^{1}x^{2k}(1 - x)\,\mathrm{d} x = \int_{0}^{1}\frac{\mathrm{d} x}{1 + x}$, et en déduire que $\sum_{k=0}^{+\infty}\frac{(-1)^{k}}{k + 1} = \ln 2$.

    **3.** En regroupant les termes deux par deux, $x^{4j}(1 - x) - x^{4j+2}(1 - x) = x^{4j}(1 - x^{2})(1 - x) \geqslant 0$ sur $[0, 1]$, calculer $\sum_{k=0}^{+\infty}\frac{(-1)^{k}}{(2k + 1)(2k + 2)}$.
  corrige: |
    **1.** Les termes $x^{2k}(1 - x)$ sont positifs si et seulement si $x \leqslant 1$ : $D = ]-\infty, 1]$. Pour $|x| < 1$, $f_{n}(x) \to \frac{1 - x}{1 - x^{2}} = \frac{1}{1 + x}$ ; en $x = 1$, la limite est $0$ ; pour $x \leqslant -1$, elle est $+\infty$.

    ![Figure](documents/figures/53612df3dade25f9.svg)

    Les sommes partielles $f_{0}$, $f_{1}$, $f_{3}$, $f_{8}$ (ocre, de plus en plus épaisses) croissent vers $\frac{1}{1 + x}$ (tirets carmin) sur $]-1, 1[$. En $x = 1$ toutes valent $0$ (point carmin) : la limite est discontinue en ce point, ce qui ne gêne pas le théorème de convergence monotone.

    **2.** $\int_{0}^{1}x^{2k}(1 - x)\,\mathrm{d} x = \frac{1}{2k + 1} - \frac{1}{2k + 2}$. La proposition 13 du cours (ou la convergence monotone appliquée à $(f_{n})$) donne, le point $1$ étant négligeable, 
    $$\sum_{k \geqslant 0}\Big(\frac{1}{2k + 1} - \frac{1}{2k + 2}\Big) = \int_{0}^{1}\frac{\mathrm{d} x}{1 + x} = \ln 2.$$
     Le membre de gauche est la série $\sum\frac{(-1)^{m}}{m + 1}$ dont on a regroupé les termes par deux ; cette série converge (critère des séries alternées), donc sa somme est la même : $\boxed{\sum_{m \geqslant 0}\frac{(-1)^{m}}{m + 1} = \ln 2}$.

    **3.** $\frac{1}{(2k + 1)(2k + 2)} = \int_{0}^{1}x^{2k}(1 - x)\,\mathrm{d} x$. En regroupant $k = 2j$ et $k = 2j + 1$, on obtient des fonctions positives $x^{4j}(1 - x^{2})(1 - x)$, de somme $\frac{(1 - x^{2})(1 - x)}{1 - x^{4}} = \frac{1 - x}{1 + x^{2}}$ sur $[0, 1[$. Donc 
    $$\sum_{k \geqslant 0}\frac{(-1)^{k}}{(2k + 1)(2k + 2)} = \int_{0}^{1}\frac{1 - x}{1 + x^{2}}\,\mathrm{d} x = \Big[\operatorname{Arctan}x - \frac{1}{2}\ln(1 + x^{2})\Big]_{0}^{1} = \boxed{\frac{\pi}{4} - \frac{\ln 2}{2}} \approx 0{,}4388\text{,}$$
     le regroupement étant licite puisque la série alternée converge. Le chapitre 4 permettra d'intervertir directement, par convergence dominée, sans regrouper.
- id: "l3-in-03-21"
