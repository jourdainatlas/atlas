  page_enonce: 5
  page_corrige: 8
  enonce: |
    Soit $f(t) = \frac{\ln t}{t - 1}$ sur $]0, 1[$. Montrer que $f(t) = \sum_{n \geqslant 0}(-t^{n}\ln t)$, puis que $f$ est intégrable, d'intégrale $\sum_{n \geqslant 1}\frac{1}{n^{2}}$ (on justifiera la convergence de cette série, sans l'évaluer).
  corrige: |
    Pour $t \in ]0, 1[$, $\frac{1}{1 - t} = \sum_{n \geqslant 0}t^{n}$, donc $\frac{\ln t}{t - 1} = \sum_{n \geqslant 0}(-t^{n}\ln t)$, série de fonctions positives puisque $\ln t < 0$. Une intégration par parties sur $[\varepsilon, 1]$ donne $\int_{0}^{1}-t^{n}\ln t\,\mathrm{d} t = \frac{1}{(n + 1)^{2}}$, et la série $\sum\frac{1}{n^{2}}$ converge (par comparaison avec $\sum\frac{1}{n(n - 1)}$, exercice 18). Par la proposition 13, 
    $$\int_{]0, 1[}\frac{\ln t}{t - 1}\,\mathrm{d} t = \sum_{n \geqslant 0}\frac{1}{(n + 1)^{2}} = \sum_{n \geqslant 1}\frac{1}{n^{2}} < +\infty\text{ :}$$
     $f$ est intégrable. Le calcul numérique donne $1{,}644934\ldots$ ; la valeur $\frac{\pi^{2}}{6}$ sera démontrée au chapitre 9 par l'égalité de Parseval.
