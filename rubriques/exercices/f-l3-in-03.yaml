  mots_cles: [intégrale des fonctions positives]
  noeuds: [m-integrale, m-beppo-levi]
  notions: [integrale-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 2 ; Montpellier (TD 3), exercice 1 ; Exo7 (fic00145), exercice 6"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Prouver ou réfuter les assertions suivantes, où $f$, $g : \Omega \to [0, +\infty]$ sont mesurables.

    **1.** $\int\chi_{A}\,\mathrm{d}\mu = \mu(A)$ pour $A \in \mathcal{T}$, et $\int(a\chi_{A} + b\chi_{B})\,\mathrm{d}\mu = a\mu(A) + b\mu(B)$ pour $a$, $b \geqslant 0$ et $A$, $B \in \mathcal{T}$, même si $A$ et $B$ se rencontrent.

    **2.** Si $f$ est intégrable, $\mu\big(f^{-1}(\{+\infty\})\big) = 0$ (on pourra comparer $f$ aux fonctions $n\chi_{\{f \geqslant n\}}$).

    **3.** Si $\mu\big(f^{-1}(\{+\infty\})\big) = 0$, $f$ est intégrable.

    **4.** Si $\int f\,\mathrm{d}\mu = 0$, alors $f = 0$ ; si $\int f\,\mathrm{d}\mu = 0$, alors $f = 0$ p.p. ; si $f = 0$ p.p., alors $f = 0$.

    **5.** Le produit de deux fonctions intégrables est intégrable.
  corrige: |
    **1.** Vrai, par définition de l'intégrale des fonctions étagées et par linéarité positive (cours, prop. 8 et 12) : $\int(a\chi_{A} + b\chi_{B}) = a\mu(A) + b\mu(B)$ même si $A \cap B \neq \emptyset$, la masse de $A \cap B$ étant comptée avec le poids $a + b$.

    **2.** Vrai : $n\chi_{\{f \geqslant n\}} \leqslant f$, donc $\mu(\{f = +\infty\}) \leqslant \mu(\{f \geqslant n\}) \leqslant \frac{1}{n}\int f\,\mathrm{d}\mu \to 0$ ; c'est l'inégalité de Markov (cours, prop. 10 et 11).

    **3.** Faux : la fonction constante $1$ sur $\mathbb{R}$ est finie partout et d'intégrale $+\infty$.

    **4.** La première assertion est fausse ($\chi_{\{0\}}$ sur $\mathbb{R}$), la deuxième vraie (cours, prop. 11), la troisième fausse (même exemple).

    **5.** Faux : $f = g = x^{-1/2}$ sur $]0, 1]$ sont intégrables (intégrale $2$), mais $fg = \frac{1}{x}$ ne l'est pas. Le produit sera contrôlé au chapitre 8 par l'inégalité de Hölder, qui demande $f \in L^{p}$ et $g \in L^{q}$ avec $\frac{1}{p} + \frac{1}{q} = 1$.
