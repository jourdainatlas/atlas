  enonce: |
    Soit $f : \Omega \to [0, +\infty]$ mesurable. Montrer que $\lim_{n \to +\infty}n\int\ln\Big(1 + \frac{f}{n}\Big)\,\mathrm{d}\mu = \int f\,\mathrm{d}\mu$.
  corrige: |
    Pour $a \in [0, +\infty[$, $n \mapsto n\ln\big(1 + \frac{a}{n}\big) = a\,\frac{\ln(1 + a/n)}{a/n}$ est croissante, car $u \mapsto \frac{\ln(1 + u)}{u}$ décroît sur $]0, +\infty[$ (concavité du logarithme), et tend vers $a$ ; pour $a = +\infty$, elle vaut $+\infty$. Le théorème de convergence monotone donne $\boxed{n\int\ln\big(1 + \frac{f}{n}\big)\,\mathrm{d}\mu \to \int f\,\mathrm{d}\mu}$, que $\int f$ soit fini ou non.
