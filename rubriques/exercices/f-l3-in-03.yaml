  enonce: |
    Soit $(\mu_{k})$ une suite croissante de mesures et $\mu = \lim\mu_{k}$ (feuille 1, exercice 31). Montrer que, pour $f : \Omega \to [0, +\infty]$ mesurable, $\int f\,\mathrm{d}\mu_{k}$ croît vers $\int f\,\mathrm{d}\mu$ (commencer par les fonctions étagées).
  corrige: |
    Pour $u = \sum c_{j}\chi_{E_{j}}$ étagée, $\int u\,\mathrm{d}\mu_{k} = \sum c_{j}\mu_{k}(E_{j})$ croît vers $\sum c_{j}\mu(E_{j}) = \int u\,\mathrm{d}\mu$. Pour $f$ mesurable positive, $\int u\,\mathrm{d}\mu_{k} \leqslant \int u\,\mathrm{d}\mu_{k+1} \leqslant \int u\,\mathrm{d}\mu$ pour toute $u$ étagée $\leqslant f$ ; en passant à la borne supérieure, $\int f\,\mathrm{d}\mu_{k}$ croît et a une limite $L \leqslant \int f\,\mathrm{d}\mu$. Inversement, pour $u$ étagée $\leqslant f$, $\int u\,\mathrm{d}\mu = \lim_{k}\int u\,\mathrm{d}\mu_{k} \leqslant L$, et la borne supérieure donne $\int f\,\mathrm{d}\mu \leqslant L$. On remarque que seules la définition de l'intégrale et la croissance ont servi.
- id: "l3-in-03-20"
  feuille: "f-l3-in-03"
  numero: 20
  partie: "Intégrale des fonctions positives"
  etoiles: 2
