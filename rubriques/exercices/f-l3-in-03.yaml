  enonce: |
    Soit $f : [0, 1] \to \mathbb{R}$ mesurable. Déterminer $\lim_{n \to +\infty}\int_{[0, 1]}\frac{\mathrm{d}\lambda(t)}{\sqrt{f(t)^{2} + 1/n}}$. Calculer la limite pour $f(t) = t$ et pour $f(t) = \sqrt{t}$.
  corrige: |
    La suite $\frac{1}{\sqrt{f^{2} + 1/n}}$ croît vers $\frac{1}{|f|}$ (avec $\frac{1}{0} = +\infty$). Par convergence monotone, 
    $$\boxed{\lim_{n}\int_{[0, 1]}\frac{\mathrm{d}\lambda(t)}{\sqrt{f(t)^{2} + 1/n}} = \int_{[0, 1]}\frac{\mathrm{d}\lambda(t)}{|f(t)|}}\text{.}$$
     Pour $f(t) = t$, la limite est $\int_{0}^{1}\frac{\mathrm{d} t}{t} = +\infty$ ; pour $f(t) = \sqrt{t}$, c'est $\int_{0}^{1}t^{-1/2}\,\mathrm{d} t = 2$. Le résultat dépend de la rapidité avec laquelle $f$ s'annule : un zéro simple rend $\frac{1}{|f|}$ non intégrable, un zéro « en racine carrée » non.
- id: "l3-in-03-25"
  feuille: "f-l3-in-03"
  numero: 25
  partie: "Intégrale des fonctions positives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale des fonctions positives, mesures à densité, mesure image]
  noeuds: [m-integrale, m-beppo-levi]
  notions: [integrale-lebesgue, mesure-densite]
  source: "Lyon 1 (TD03 2020), exercice 33 (a), (b)(i)-(ii) ; Féjoz (exosIntegration), exercice 2.7 ; Bibmath, exercice 6"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $T : (\Omega, \mathcal{T}) \to (\Omega', \mathcal{T}')$ mesurable et $T_{*}\mu$ la mesure image. On rappelle (cours, prop. 15) que $\int\Phi\,\mathrm{d}(T_{*}\mu) = \int\Phi \circ T\,\mathrm{d}\mu$ pour toute $\Phi : \Omega' \to [0, +\infty]$ mesurable.

    **1.** Déterminer l'image de $\lambda$ par la partie entière, et celle de $\delta_{a}$.

    **2.** Soit $T : [0, 1] \to [0, 1]$, $x \mapsto x^{2}$, et $\nu$ l'image de la mesure de Lebesgue de $[0, 1]$. Calculer $\nu([0, y])$ et en déduire (feuille 1, exercice 35) que $\nu$ a pour densité $\frac{1}{2\sqrt{y}}$. Calculer de deux façons $\int_{[0, 1]}x^{4}\,\mathrm{d}\lambda(x)$.

    **3.** *Probabilités.* Si $\mu$ est une probabilité et $f : \Omega \to \mathbb{R}$ mesurable, la *loi* de $f$ est $P_{f} = f_{*}\mu$. Montrer que c'est une probabilité, et exprimer $\int|f|\,\mathrm{d}\mu$ et $\int f^{2}\,\mathrm{d}\mu$ à l'aide de $P_{f}$, puis d'une densité $p$ de $P_{f}$.
  corrige: |
    **1.** $E_{*}\lambda(\{k\}) = \lambda([k, k + 1[) = 1$ pour $k \in \mathbb{Z}$, et $E_{*}\lambda(\mathbb{R} \setminus \mathbb{Z}) = 0$ : $\boxed{E_{*}\lambda = \sum_{k \in \mathbb{Z}}\delta_{k}}$, la mesure de comptage de $\mathbb{Z}$. Pour $\delta_{a}$, $T_{*}\delta_{a}(B) = \chi_{B}(T(a))$, d'où $T_{*}\delta_{a} = \delta_{T(a)}$ (feuille 1, exercice 30).

    **2.** $\nu([0, y]) = \lambda(\{x \in [0, 1] \,;\, x^{2} \leqslant y\}) = \sqrt{y}$. La mesure $\rho$ de densité $\frac{1}{2\sqrt{y}}$ sur $]0, 1]$ vérifie $\rho([0, y]) = \int_{0}^{y}\frac{\mathrm{d} s}{2\sqrt{s}} = \sqrt{y}$ (proposition 17). Ce sont deux probabilités sur $\mathbb{R}$ portées par $[0, 1]$, de même fonction de répartition, donc égales (feuille 1, exercice 35). Enfin 
    $$\int_{[0, 1]}x^{4}\,\mathrm{d}\lambda(x) = \int_{[0, 1]}(x^{2})^{2}\,\mathrm{d}\lambda(x) = \int y^{2}\,\mathrm{d}\nu(y) = \int_{0}^{1}\frac{y^{2}}{2\sqrt{y}}\,\mathrm{d} y = \frac{1}{2} \cdot \frac{2}{5} = \boxed{\frac{1}{5}}\text{,}$$
     qui est aussi la valeur directe $\int_{0}^{1}x^{4}\,\mathrm{d} x$.

    ![Figure](documents/figures/15104b8d862dae80.svg)

    La densité de la mesure image de $\lambda$ par $x \mapsto x^{2}$ : elle est non bornée près de $0$, parce que la fonction carré « tasse » les points voisins de $0$, mais reste intégrable. L'aire ocre, $\nu([0; 0{,}36]) = 0{,}6$, est la proportion des $x \in [0, 1]$ tels que $x^{2} \leqslant 0{,}36$.

    **3.** $P_{f}(\mathbb{R}) = \mu(f^{-1}(\mathbb{R})) = \mu(\Omega) = 1$. La proposition 15 du cours, appliquée à $\Phi(t) = |t|$ et $\Phi(t) = t^{2}$, donne 
    $$\int|f|\,\mathrm{d}\mu = \int_{\mathbb{R}}|t|\,\mathrm{d} P_{f}(t), \qquad \int f^{2}\,\mathrm{d}\mu = \int_{\mathbb{R}}t^{2}\,\mathrm{d} P_{f}(t),$$
     et, si $P_{f}$ a la densité $p$, ces quantités valent $\int_{\mathbb{R}}|t|p(t)\,\mathrm{d} t$ et $\int_{\mathbb{R}}t^{2}p(t)\,\mathrm{d} t$ (exercice 13). Les espérances ne dépendent donc que de la loi de $f$, et non de l'espace $\Omega$ sur lequel elle est définie : c'est ce qui permet aux probabilistes de « oublier » $\Omega$.

