  enonce: |
    Soit $(f_{n})$ une suite de fonctions mesurables de $\Omega$ dans $\mathbb{R}$.

    **1.** Montrer que l'ensemble des $x$ tels que $(f_{n}(x))$ soit de Cauchy, c'est-à-dire converge dans $\mathbb{R}$, est dans $\mathcal{T}$ : d'abord en l'écrivant à l'aide d'intersections et de réunions dénombrables, puis à l'aide de $\liminf f_{n}$ et $\limsup f_{n}$.

    **2.** Montrer que l'ensemble des $x$ tels que $(f_{n}(x))$ soit bornée est dans $\mathcal{T}$.

    **3.** Soit $a \in \mathbb{R}$ et $g(x) = \inf\{n \in \mathbb{N} \,;\, f_{n}(x) \geqslant a\}$, avec $\inf\emptyset = +\infty$. Montrer que $g : \Omega \to [0, +\infty]$ est mesurable.
  corrige: |
    **1.** Par le critère de Cauchy, 
    $$C = \bigcap_{k \geqslant 1}\bigcup_{N \in \mathbb{N}}\bigcap_{p, q \geqslant N}\Big\{|f_{p} - f_{q}| \leqslant \frac{1}{k}\Big\}\text{,}$$
     où chaque ensemble de droite est dans $\mathcal{T}$ ($f_{p} - f_{q}$ est mesurable) et où toutes les opérations sont dénombrables. Autrement : $C = \{\liminf f_{n} = \limsup f_{n}\} \cap \{|\limsup f_{n}| < +\infty\}$, où $\liminf f_{n}$ et $\limsup f_{n}$ sont mesurables à valeurs dans $\overline{\mathbb{R}}$ (cours, prop. 5).

    **2.** $\{(f_{n}(x)) \text{ bornée}\} = \bigcup_{M \in \mathbb{N}}\bigcap_{n}\{|f_{n}| \leqslant M\}$, ou encore $\{\sup_{n}|f_{n}| < +\infty\}$.

    **3.** $\{g = n\} = \{f_{n} \geqslant a\} \cap \bigcap_{k < n}\{f_{k} < a\}$ et $\{g = +\infty\} = \bigcap_{k}\{f_{k} < a\}$ sont dans $\mathcal{T}$, et $g$ ne prend que des valeurs dans $\mathbb{N} \cup \{+\infty\}$ : $g^{-1}(B)$ est la réunion dénombrable des $\{g = n\}$ pour $n \in B$. En probabilités, $g$ est le *temps d'atteinte* du niveau $a$.
