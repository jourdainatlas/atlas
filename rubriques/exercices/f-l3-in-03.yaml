  enonce: |
    **1.** *Recollement.* Soit $(A_{k})$ une partition dénombrable de $\Omega$ en éléments de $\mathcal{T}$ et, pour chaque $k$, $f_{k} : A_{k} \to \mathbb{R}$ mesurable (pour la tribu trace). Montrer que la fonction $f$ égale à $f_{k}$ sur chaque $A_{k}$ est mesurable.

    **2.** En déduire que, si $(X, d)$ est un espace métrique, une fonction continue sur un borélien $A$ de $X$ est borélienne sur $A$, et qu'une fonction continue en dehors d'une partie finie de $X$ est borélienne.

    **3.** Soit $(f_{n})$ une suite de fonctions mesurables sur $\Omega$ et $N : \Omega \to \mathbb{N}$ mesurable (pour $\mathcal{P}(\mathbb{N})$). Montrer que $x \mapsto f_{N(x)}(x)$ est mesurable.
  corrige: |
    **1.** Pour $B$ borélien, $f^{-1}(B) = \bigcup_{k}f_{k}^{-1}(B)$, et $f_{k}^{-1}(B)$ appartient à la tribu trace sur $A_{k}$, formée des éléments de $\mathcal{T}$ contenus dans $A_{k}$ puisque $A_{k} \in \mathcal{T}$ (chapitre 1, prop. 7). La réunion dénombrable est dans $\mathcal{T}$.

    **2.** Si $f : A \to \mathbb{R}$ est continue, l'image réciproque d'un ouvert $V$ est un ouvert relatif $U \cap A$, borélien de $A$ (feuille 1, exercice 16). Si $f$ est continue hors d'une partie finie $F$, on recolle sur la partition formée de l'ouvert $X \setminus F$ et des singletons de $F$.

    **3.** $\{x \,;\, f_{N(x)}(x) \in B\} = \bigcup_{n}\big(\{N = n\} \cap \{f_{n} \in B\}\big)$, réunion dénombrable d'éléments de $\mathcal{T}$ ; c'est aussi un recollement sur la partition $(\{N = n\})_{n}$.
- id: "l3-in-03-10"
  feuille: "f-l3-in-03"
  numero: 10
  partie: "Intégrale des fonctions positives"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [intégrale des fonctions positives]
  noeuds: [m-integrale, m-beppo-levi]
  notions: [integrale-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 1 ; Exo7 (fic00144), exercice 3 ; Bibmath (F. Bayart), «~Intégrale de Lebesgue~», exercice 3 (1) ; TD2 Paris-Dauphine, exercice 1"
  page_enonce: 3
  page_corrige: 3
  enonce: |
    **1.** Calculer $\int f\,\mathrm{d}\delta_{a}$ pour $f : \Omega \to [0, +\infty]$ mesurable, puis $\int f\,\mathrm{d}\mu$ pour $\mu = \sum_{i=1}^{k}p_{i}\delta_{a_{i}}$, $p_{i} \geqslant 0$.

    **2.** Soit $c$ la mesure de comptage sur $(\mathbb{N}, \mathcal{P}(\mathbb{N}))$. Montrer que toute $f : \mathbb{N} \to [0, +\infty]$ est mesurable et que $\int f\,\mathrm{d} c = \sum_{n \in \mathbb{N}}f(n)$. Calculer $\int f\,\mathrm{d} c$ pour $f(n) = 3^{-n}$.
  corrige: |
    **1.** Pour une fonction étagée $\varphi = \sum c_{j}\chi_{E_{j}}$, $\int\varphi\,\mathrm{d}\delta_{a} = \sum c_{j}\delta_{a}(E_{j}) = \varphi(a)$. Si $(\varphi_{k})$ est une suite de fonctions étagées croissant vers $f$ (cours, th. 1), le théorème de convergence monotone donne 
    $$\boxed{\int f\,\mathrm{d}\delta_{a} = \lim\varphi_{k}(a) = f(a)}\text{.}$$
     Le même raisonnement, ou la linéarité en la mesure, donne $\int f\,\mathrm{d}\mu = \sum_{i}p_{i}f(a_{i})$.

    **2.** Toute partie de $\mathbb{N}$ est mesurable, donc toute fonction aussi. On écrit $f = \sum_{n}f(n)\chi_{\{n\}}$, série de fonctions mesurables positives ; la proposition 13 du cours donne $\int f\,\mathrm{d} c = \sum_{n}f(n)c(\{n\}) = \sum_{n}f(n)$. Pour $f(n) = 3^{-n}$, $\boxed{\int f\,\mathrm{d} c = \sum_{n \geqslant 0}3^{-n} = \frac{3}{2}}$. Les séries à termes positifs sont donc des intégrales, et tous les théorèmes du cours s'y appliquent.
- id: "l3-in-03-11"
  feuille: "f-l3-in-03"
  numero: 11
