  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Montrer qu'une fonction croissante $f : \mathbb{R} \to \mathbb{R}$ est borélienne.

    **2.** Montrer que l'ensemble des points de discontinuité d'une fonction croissante est au plus dénombrable.

    **3.** Plus généralement, montrer qu'une fonction $f : I \to \mathbb{R}$, définie sur un intervalle et continue en dehors d'un ensemble au plus dénombrable, est borélienne.
  corrige: |
    **1.** Si $f$ est croissante, $\{f > \beta\}$ est un intervalle de la forme $]a, +\infty[$ ou $[a, +\infty[$, ou bien $\emptyset$ ou $\mathbb{R}$ : c'est un borélien, et l'on conclut par la proposition 3 du cours.

    **2.** En un point de discontinuité $x$, $f(x^{-}) < f(x^{+})$, et les intervalles $]f(x^{-}), f(x^{+})[$ associés à deux points distincts sont disjoints. En choisissant un rationnel dans chacun, on obtient une injection de l'ensemble des points de discontinuité dans $\mathbb{Q}$.

    **3.** Soit $D$ l'ensemble, au plus dénombrable, des points de discontinuité. $I \setminus D$ est un borélien, sur lequel $f$ est continue, donc borélienne (exercice 9, question 2), et les singletons $\{d\}$, $d \in D$, sont boréliens. La partition de $I$ formée de $I \setminus D$ et des $\{d\}$ est dénombrable, et le recollement (exercice 9) conclut. Les questions 1 et 2 en font un cas particulier.
- id: "l3-in-03-04"
  feuille: "f-l3-in-03"
  numero: 4
  partie: "Fonctions mesurables"
  etoiles: 3
  types: [Vrai ou faux, Démonstration]
  mots_cles: [fonctions mesurables]
  noeuds: [m-mesurables]
  notions: [fonction-mesurable, fonction-borelienne]
  source: "Lyon 1 (TD02 2020), exercice 26"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable. Montrer que $f'$ est borélienne.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ continue et $x \in \mathbb{R}$. Montrer que $f$ est dérivable en $x$, de dérivée $\ell$, si et seulement si 
    $$\begin{aligned} \ell &= \lim_{m \to +\infty}\inf\Big\{\frac{f(x + h) - f(x)}{h} \,;\, h \in \mathbb{Q}^{*}, |h| < \frac{1}{m}\Big\} \\ &= \lim_{m \to +\infty}\sup\Big\{\frac{f(x + h) - f(x)}{h} \,;\, h \in \mathbb{Q}^{*}, |h| < \frac{1}{m}\Big\}. \end{aligned}$$

    **3.** En déduire que, si $f$ est continue, l'ensemble $D$ des points où $f$ est dérivable est un borélien, et que la fonction $g$ égale à $f'$ sur $D$ et à $0$ ailleurs est borélienne.

    **4.** Vrai ou faux : si $g = 0$, alors $f$ est constante ?
  corrige: |
    **1.** $f'(x) = \lim_{n}n\big(f(x + \frac{1}{n}) - f(x)\big)$ est limite simple de fonctions continues, donc borélienne (cours, prop. 5).

    **2.** Comme $f$ est continue, $h \mapsto \frac{f(x + h) - f(x)}{h}$ est continue sur $\mathbb{R}^{*}$ ; sa borne inférieure (et sa borne supérieure) sur $\{0 < |h| < \frac{1}{m}\}$ est donc la même que sur les seuls rationnels de cet ensemble. Les deux limites de l'énoncé sont donc les limites inférieure et supérieure du taux d'accroissement en $0$, et elles sont égales à $\ell$ si et seulement si le taux d'accroissement tend vers $\ell$.

    **3.** Pour $m$ fixé, $\varphi_{m}(x) = \inf\{\dots\}$ est la borne inférieure d'une famille *dénombrable* de fonctions continues de $x$, donc borélienne (cours, prop. 5) ; de même pour la borne supérieure $\psi_{m}$. Les limites $L = \lim\varphi_{m}$ et $U = \lim\psi_{m}$ sont boréliennes, à valeurs dans $\overline{\mathbb{R}}$, et $D = \{L = U\} \cap \{|L| < +\infty\}$ est un borélien. La fonction $g$, égale à $L$ sur $D$ et à $0$ ailleurs, est borélienne par recollement. C'est pour obtenir des familles dénombrables qu'on a remplacé les réels $h$ par des rationnels.

    **4.** Faux : la fonction de Cantor (« escalier du diable »), continue, croissante de $0$ à $1$, constante sur chaque intervalle retiré dans la construction de l'ensemble de Cantor, a une dérivée nulle en chaque point où elle est dérivable ; donc $g = 0$ sans que $f$ soit constante (on admet ces propriétés). Une fonction continue nulle part dérivable, comme celle de Weierstrass, donne aussi $g = 0$.
