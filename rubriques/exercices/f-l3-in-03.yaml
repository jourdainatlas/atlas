- id: "l3-in-03-01"
  feuille: "f-l3-in-03"
  numero: 1
  partie: "Fonctions mesurables"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions mesurables, fonctions étagées]
  noeuds: [m-mesurables, m-etagees]
  notions: [fonction-mesurable, fonction-borelienne, fonction-etagee]
  source: "Lyon 1 (TD02 2020), exercice 23 ; J. Féjoz (exosIntegration), exercice 1.9 (a), (d), (e)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Prouver ou réfuter les assertions suivantes ($\mathcal{T}$ est une tribu sur $\Omega$).

    **1.** Une fonction $f : \Omega \to \mathbb{R}$ qui ne prend qu'un nombre fini de valeurs est étagée.

    **2.** Si $A \subset \Omega$, l'indicatrice $\chi_{A}$ est mesurable si et seulement si $A \in \mathcal{T}$.

    **3.** Si $f : \Omega \to \mathbb{R}^{n}$ est mesurable et si $g : \mathbb{R}^{n} \to \mathbb{R}$ est borélienne et ne prend qu'un nombre fini de valeurs, alors $g \circ f$ est étagée.

    **4.** Si $f^{-1}(F) \in \mathcal{T}$ pour tout fermé $F$ de $\mathbb{R}$, alors $f : \Omega \to \mathbb{R}$ est mesurable.

    **5.** Si $f : \mathbb{R} \to \mathbb{R}$ est borélienne et ne s'annule pas, $\frac{1}{f}$ est borélienne. La fonction égale à $\frac{1}{x}$ si $x \neq 0$ et à $0$ en $0$ est borélienne.

    **6.** La fonction égale à $x + 1$ si $x \geqslant 0$ et à $-x$ si $x < 0$ est borélienne.

    **7.** Une fonction $f : \Omega \to \mathbb{R}$ est mesurable si et seulement si $|f|$ l'est.

    **8.** La réciproque d'une bijection mesurable est mesurable.
  corrige: |
    **1.** Faux : une fonction étagée est par définition mesurable. Sur $\Omega = \{1, 2\}$ muni de $\{\emptyset, \Omega\}$, $\chi_{\{1\}}$ prend deux valeurs sans être mesurable.

    **2.** Vrai : $\chi_{A}^{-1}(B)$ vaut $\emptyset$, $A$, ${A}^{c}$ ou $\Omega$, et ces quatre parties sont dans $\mathcal{T}$ si et seulement si $A$ y est.

    **3.** Vrai : $g \circ f$ est mesurable comme composée (cours, prop. 2) et ne prend qu'un nombre fini de valeurs.

    **4.** Vrai : les fermés engendrent $\mathcal{B}(\mathbb{R})$ (chapitre 1, prop. 10), et la proposition 1 du cours s'applique.

    **5.** Vrai : $\frac{1}{f} = h \circ f$ avec $h : y \mapsto \frac{1}{y}$ continue sur $\mathbb{R}^{*}$. La seconde fonction est continue sur le borélien $\mathbb{R}^{*}$ et constante sur $\{0\}$ : elle est borélienne par recollement (exercice 9).

    **6.** Vrai, pour la même raison : elle est continue sur $[0, +\infty[$ et sur $]-\infty, 0[$.

    **7.** Faux : si $A \notin \mathcal{T}$, $f = \chi_{A} - \chi_{{A}^{c}}$ n'est pas mesurable ($f^{-1}(\{1\}) = A$), alors que $|f| = 1$ l'est. *L'erreur la plus répandue* est de croire que l'on peut « retrouver » $f$ à partir de $|f|$ : le signe peut être non mesurable.

    **8.** Faux : l'identité de $(\mathbb{R}, \mathcal{P}(\mathbb{R}))$ dans $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$ est une bijection mesurable, mais sa réciproque ne l'est pas, puisqu'il existe des parties non boréliennes (chapitre 2, prop. 14).
- id: "l3-in-03-02"
