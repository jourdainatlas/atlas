  enonce: |
    Soit $(f_{n})$ une suite de fonctions mesurables positives qui converge simplement vers $f$, et $M > 0$ tel que $\int f_{n}\,\mathrm{d}\mu \leqslant M$ pour tout $n$. Montrer que $\int f\,\mathrm{d}\mu \leqslant M$. A-t-on $\int f_{n}\,\mathrm{d}\mu \to \int f\,\mathrm{d}\mu$ ?
  corrige: |
    $f = \lim f_{n} = \liminf f_{n}$, et le lemme de Fatou donne $\int f \leqslant \liminf\int f_{n} \leqslant M$. On n'a pas convergence en général : $f_{n} = n\chi_{]0, 1/n]}$ converge simplement vers $0$ sur $\mathbb{R}$, avec $\int f_{n} = 1 = M$, et $\int f = 0$.
- id: "l3-in-03-17"
  feuille: "f-l3-in-03"
  numero: 17
  partie: "Intégrale des fonctions positives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrale des fonctions positives, lemme de Fatou, convergence monotone]
  noeuds: [m-integrale, m-beppo-levi, m-fatou]
  notions: [integrale-lebesgue]
  source: "Exo7 (fic00145), exercices 2, 4 et 5 ; Lyon 1 (TD03 2020), exercices 36 et 37 ; Féjoz (exosIntegration), exercice 2.3"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Sur $\mathbb{R}$ muni de $\lambda$, chacune des suites suivantes contredit-elle le théorème de convergence monotone ou le lemme de Fatou ? Pour une fonction $g \leqslant 0$, on convient ici que $\int g\,\mathrm{d}\lambda = -\int(-g)\,\mathrm{d}\lambda$.

    **1.** $f_{n} = \chi_{[0, n]}$, qui croît vers $\chi_{[0, +\infty[}$, avec $\int f_{n} < +\infty$ et $\sup f_{n} = 1$, alors que $\int\chi_{[0, +\infty[} = +\infty$.

    **2.** $f_{n} = \frac{1}{n}\chi_{[0, n]}$, qui converge uniformément vers $0$, avec $\int f_{n} = 1$.

    **3.** $f_{n} = -\frac{1}{n}\chi_{[0, n]}$, et $f_{n} = -(x + n)^{-}$ (partie négative), pour lesquelles $\int\liminf f_{n} > \liminf\int f_{n}$.

    **4.** Sur $[-1, 1]$, $f_{n} = \chi_{[0, 1]}$ si $n$ est pair et $f_{n} = \chi_{[-1, 0]}$ si $n$ est impair : calculer $\int\liminf f_{n}$ et $\liminf\int f_{n}$.
  corrige: |
    **1.** Aucune contradiction : par le théorème de convergence monotone, $\int f_{n} = n$ tend vers $+\infty = \int\chi_{[0, +\infty[}$. Le fait que les $f_{n}$ soient bornées par $1$ n'intervient pas.

    **2.** La suite n'est pas monotone : pour $x$ fixé, $f_{n}(x)$ vaut $0$ tant que $n < x$, puis $\frac{1}{n}$, qui décroît. Le théorème de convergence monotone ne s'applique pas, et le lemme de Fatou donne seulement $0 \leqslant \liminf\int f_{n} = 1$, sans contradiction. La masse, toujours égale à $1$, s'étale à l'infini.

    ![Figure](documents/figures/ee0f65b86f3ef196.svg)

    Les fonctions $\frac{1}{n}\chi_{[0, n]}$ pour $n = 1$, $2$, $8$ : les rectangles s'aplatissent et s'allongent, leur aire reste égale à $1$, et la limite (uniforme) est nulle. La masse « s'échappe à l'infini » : c'est le premier des trois mécanismes (avec la concentration en un point et l'oscillation) qui empêchent de passer à la limite sous l'intégrale.

    **3.** Pour $f_{n} = -\frac{1}{n}\chi_{[0, n]}$, $\liminf f_{n} = 0$, alors que $\int f_{n} = -1$ : $\int\liminf f_{n} = 0 > -1 = \liminf\int f_{n}$. Pour $f_{n} = -(x + n)^{-}$, nulle sur $[-n, +\infty[$, $\liminf f_{n} = 0$ et $\int f_{n} = -\infty$. Le lemme de Fatou suppose les fonctions *positives* : sans cette hypothèse, l'inégalité peut s'inverser.

    **4.** $\liminf f_{n} = \chi_{[0, 1]} \cdot \chi_{[-1, 0]} = \chi_{\{0\}}$, d'intégrale nulle, alors que $\int f_{n} = 1$ pour tout $n$ : l'inégalité de Fatou est stricte, $0 < 1$, et la suite $(f_{n})$ n'a pas de limite.
