  source: "Lyon 1 (TD02 2020), exercice 24 ; Féjoz (exosIntegration), exercice 1.9 (b)"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Décrire les fonctions mesurables de $(\Omega, \mathcal{T})$ dans $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$ lorsque $\mathcal{T} = \{\emptyset, \Omega\}$, lorsque $\mathcal{T} = \mathcal{P}(\Omega)$, puis lorsque $\mathcal{T}$ est engendrée par une partition au plus dénombrable de $\Omega$.
  corrige: |
    Pour $\mathcal{T} = \{\emptyset, \Omega\}$, $f^{-1}(\{f(x_{0})\})$ contient $x_{0}$, donc vaut $\Omega$ : seules les *constantes* sont mesurables. Pour $\mathcal{T} = \mathcal{P}(\Omega)$, *toutes* les fonctions le sont. Si $\mathcal{T}$ est engendrée par une partition au plus dénombrable $(A_{i})$, ses éléments sont les réunions de blocs (chapitre 1, prop. 4). Si $f$ est mesurable, $f^{-1}(\{f(x)\})$ est une réunion de blocs qui contient $x$, donc tout le bloc de $x$ : $f$ est constante sur chaque bloc. Réciproquement, si $f$ est constante sur chaque bloc, $f^{-1}(B)$ est la réunion des blocs où sa valeur est dans $B$, au plus dénombrable : 
    $$\boxed{f \text{ est mesurable si et seulement si elle est constante sur chaque } A_{i}}\text{.}$$
     Plus la tribu est grossière, moins il y a de fonctions mesurables : la tribu mesure la quantité d'information disponible.
- id: "l3-in-03-03"
  feuille: "f-l3-in-03"
