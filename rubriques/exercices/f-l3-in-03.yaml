  enonce: |
    **1.** Énoncer le théorème de convergence monotone (Beppo Levi).

    **2.** Soit $(f_{n})$ une suite décroissante de fonctions mesurables positives qui converge p.p. vers $f$, avec $\int f_{0}\,\mathrm{d}\mu < +\infty$. Montrer que $\int f_{n}\,\mathrm{d}\mu \to \int f\,\mathrm{d}\mu$, en appliquant le théorème de convergence monotone à $f_{0} - f_{n}$.

    **3.** Montrer que l'hypothèse $\int f_{0}\,\mathrm{d}\mu < +\infty$ est nécessaire. Les fonctions $\frac{1}{n}\chi_{[n, +\infty[}$, décroissantes et uniformément convergentes vers $0$, contredisent-elles le théorème de convergence monotone ?
  corrige: |
    **1.** Si $(f_{n})$ est une suite croissante de fonctions mesurables positives, de limite $f$, alors (cours, th. 2) $\int f_{n}\,\mathrm{d}\mu$ tend vers $\int f\,\mathrm{d}\mu$.

    **2.** Comme $\int f_{0} < +\infty$, $f_{0}$ est finie p.p. (cours, prop. 11). Hors d'un ensemble négligeable $N$ (où $f_{0} = +\infty$ ou bien la convergence n'a pas lieu), $g_{n} = f_{0} - f_{n}$ est positive et croît vers $f_{0} - f$ ; on la prend nulle sur $N$, ce qui ne change pas les intégrales. Le théorème de convergence monotone donne $\int(f_{0} - f_{n}) \to \int(f_{0} - f)$. Par linéarité positive, $\int f_{0} = \int(f_{0} - f_{n}) + \int f_{n}$, tous les termes étant finis ; on soustrait : 
    $$\boxed{\int f_{n}\,\mathrm{d}\mu \to \int f\,\mathrm{d}\mu}\text{.}$$

    **3.** Pour $f_{n} = \chi_{[n, +\infty[}$, $\int f_{n} = +\infty$ pour tout $n$, alors que $f_{n} \to 0$. Les fonctions $\frac{1}{n}\chi_{[n, +\infty[}$ décroissent et convergent uniformément vers $0$, mais leurs intégrales valent toutes $+\infty$ : elles ne contredisent pas le théorème de convergence monotone, qui ne concerne que les suites *croissantes*, et elles montrent que, pour les suites décroissantes, l'hypothèse de finitude est indispensable, même avec convergence uniforme.
