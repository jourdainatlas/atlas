  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soit $\varphi = \sum_{j=1}^{m}c_{j}\chi_{E_{j}}$ une fonction étagée positive sous forme canonique ($c_{j}$ distincts, $E_{j}$ disjoints).

    **1.** Pour $t \geqslant 0$, on pose $S_{\varphi}(t) = \{\varphi > t\}$. Montrer que $t \mapsto \mu(S_{\varphi}(t))$ est une fonction en escalier sur $[0, +\infty[$, nulle au-delà de $\max c_{j}$, et que son intégrale de Riemann vaut $\sum_{j}c_{j}\mu(E_{j}) = \int\varphi\,\mathrm{d}\mu$. Faire un dessin.

    **2.** Soit $f : \Omega \to [0, +\infty]$ mesurable. Montrer que 
    $$\int f\,\mathrm{d}\mu = \sup\Big\{(1 - \varepsilon)\int u\,\mathrm{d}\mu \,;\, u \text{ étagée}, 0 \leqslant u \leqslant f, 0 < \varepsilon < 1\Big\}.$$
  corrige: |
    **1.** Pour $t \geqslant 0$, $\{\varphi > t\}$ est la réunion des $E_{j}$ tels que $c_{j} > t$, donc $\mu(S_{\varphi}(t)) = \sum_{j}\mu(E_{j})\chi_{[0, c_{j}[}(t)$ : c'est une fonction en escalier, constante entre deux valeurs consécutives des $c_{j}$ et nulle au-delà du maximum. L'intégrale de Riemann de $\chi_{[0, c_{j}[}$ est $c_{j}$, d'où 
    $$\int_{0}^{+\infty}\mu(S_{\varphi}(t))\,\mathrm{d} t = \sum_{j}c_{j}\mu(E_{j}) = \int\varphi\,\mathrm{d}\mu$$
     (si l'un des $\mu(E_{j})$, avec $c_{j} > 0$, est infini, les deux membres valent $+\infty$).

    ![Figure](documents/figures/0f5c367011588ab3.svg)

    Pour $\varphi = 1 \cdot \chi_{E_{1}} + 2{,}5\,\chi_{E_{2}} + 4\,\chi_{E_{3}}$ avec $\mu(E_{1}) = 1{,}5$, $\mu(E_{2}) = 1$, $\mu(E_{3}) = 0{,}5$ : l'aire sous la fonction en escalier $t \mapsto \mu(\varphi > t)$ se découpe en trois bandes horizontales, d'aires $c_{j}\mu(E_{j})$, de total $1{,}5 + 2{,}5 + 2 = 6 = \int\varphi\,\mathrm{d}\mu$. C'est la formule de Lebesgue « par tranches », que le chapitre 7 étendra à toute fonction mesurable positive.

    **2.** Pour $u$ étagée $\leqslant f$ et $\varepsilon \in ]0, 1[$, $(1 - \varepsilon)\int u \leqslant \int u \leqslant \int f$. Inversement, $\int f$ est la borne supérieure des $\int u$ (définition du cours), et $\int u = \sup_{\varepsilon}(1 - \varepsilon)\int u$. L'égalité est donc immédiate ; elle est cependant utile, car la démonstration du théorème de convergence monotone compare $f_{k}$ non à $u$ mais à $(1 - \varepsilon)u$, pour que les ensembles $\{f_{k} \geqslant (1 - \varepsilon)u\}$ recouvrent tout $\Omega$ à la limite.
