  enonce: |
    Soit $f : \Omega \to \mathbb{R}$ mesurable et $g$ la fonction égale à $1$ en $x$ si $f(x) \in \mathbb{Q}$ et à $0$ sinon. Montrer que $g$ est mesurable.
  corrige: |
    $g = \chi_{f^{-1}(\mathbb{Q})}$, et $f^{-1}(\mathbb{Q}) \in \mathcal{T}$ puisque $\mathbb{Q}$ est un borélien (réunion dénombrable de singletons).
- id: "l3-in-03-06"
  feuille: "f-l3-in-03"
