  page_corrige: 2
  enonce: |
    Soit $f$, $g : \Omega \to \mathbb{R}$ étagées et $a \in \mathbb{R}$. Montrer que $f^{-1}(B) \in \mathcal{T}$ pour *toute* partie $B$ de $\mathbb{R}$, et que $f + g$, $fg$ et $af$ sont étagées. Une fonction $f : \Omega \to \mathbb{R}$ telle que $f^{-1}(B) \in \mathcal{T}$ pour toute partie $B$ de $\mathbb{R}$ est-elle étagée ?
  corrige: |
    Si $f$ prend les valeurs $c_{1}$, …, $c_{m}$, $f^{-1}(B)$ est la réunion des $f^{-1}(\{c_{j}\})$ pour $c_{j} \in B$, qui sont dans $\mathcal{T}$ : c'est vrai pour *toute* partie $B$, borélienne ou non. Les fonctions $f + g$, $fg$ et $af$ sont mesurables (cours, prop. 4) et ne prennent qu'un nombre fini de valeurs. La réciproque est fausse : sur $(\mathbb{N}, \mathcal{P}(\mathbb{N}))$, l'identité vérifie la condition sans être étagée.
