  enonce: |
    Soient $H$ et $K$ deux sous-groupes d'un groupe $(G \,;\cdot)$.

    **1.** Démontrer que si $H \subset K$ ou $K \subset H$, alors $H \cup K$ est un sous-groupe de $G$.

    **2.** On suppose désormais que $H \cup K$ est un sous-groupe de $G$ et que $H \not\subset K$. On fixe un élément $h$ de $H$ n'appartenant pas à $K$, et l'on se donne $k \in K$.

    **(a)** Justifier que $hk$ appartient à $H \cup K$.

    **(b)** Démontrer que $hk$ ne peut pas appartenir à $K$.

    **(c)** En déduire que $k$ appartient à $H$, puis que $K \subset H$.

    **3.** Conclure par une équivalence.

    **4.** Retrouver, à l'aide de cette équivalence, le résultat de la question 2 de l'exercice 17.
  corrige: |
    **1.** Si $H \subset K$, alors $H \cup K = K$, qui est un sous-groupe de $G$ par hypothèse. Si $K \subset H$, alors $H \cup K = H$, qui en est un également. 
    $$\boxed{\text{Dans les deux cas, } H \cup K \text{ est un sous-groupe de } G.}$$

    **2. (a)** On a $h \in H \subset H \cup K$ et $k \in K \subset H \cup K$. Comme $H \cup K$ est supposé être un sous-groupe, il est stable par la loi : 
    $$\boxed{hk \in H \cup K}$$

    **(b)** Supposons par l'absurde que $hk \in K$. Comme $K$ est un sous-groupe et que $k \in K$, on a $k^{-1} \in K$, puis : 
    $$h = h\big(kk^{-1}\big) = (hk)k^{-1} \in K$$
     ce qui contredit le choix de $h$, pris dans $H$ mais pas dans $K$. 
    $$\boxed{hk \notin K}$$

    **(c)** D'après (a) et (b), on a nécessairement $hk \in H$. Comme $h \in H$, on a aussi $h^{-1} \in H$, donc : 
    $$k = \big(h^{-1}h\big)k = h^{-1}(hk) \in H$$
     Cet argument valant pour tout $k$ de $K$ : 
    $$\boxed{K \subset H}$$

    **3.** La question 1 donne un sens, la question 2 l'autre : si $H \cup K$ est un sous-groupe et si $H \not\subset K$, alors $K \subset H$. 
    $$\boxed{H \cup K \text{ est un sous-groupe de } G \iff H \subset K \;\text{ ou }\; K \subset H}$$

    **4.** On a $2 \in 2\mathbb{Z}$ mais $2 \notin 3\mathbb{Z}$, donc $2\mathbb{Z} \not\subset 3\mathbb{Z}$ ; et $3 \in 3\mathbb{Z}$ mais $3 \notin 2\mathbb{Z}$, donc $3\mathbb{Z} \not\subset 2\mathbb{Z}$. Aucune des deux inclusions n'a lieu : 
    $$\boxed{2\mathbb{Z} \cup 3\mathbb{Z} \text{ n'est pas un sous-groupe de } (\mathbb{Z} \,;+).}$$
     On retrouve le résultat de l'exercice 17, sans avoir eu besoin d'exhiber le contre-exemple $2+3=5$.

