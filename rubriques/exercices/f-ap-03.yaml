- id: "ap-03-01"
  feuille: "f-ap-03"
  numero: 1
  partie: "Lois de composition interne"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [lois de composition interne]
  noeuds: [a-loi]
  notions: [loi-composition]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les correspondances suivantes définissent-elles une loi de composition interne sur l'ensemble indiqué ? Justifier, en exhibant un contre-exemple le cas échéant.

    **1.** la soustraction sur $\mathbb{N}$

    **2.** la soustraction sur $\mathbb{Z}$

    **3.** la division sur $\mathbb{R}$

    **4.** la division sur $\mathbb{R}^{*}$

    **5.** $x \ast y = \dfrac{x+y}{2}$ sur $\mathbb{Z}$

    **6.** $x \ast y = \dfrac{x+y}{2}$ sur $\mathbb{Q}$

    **7.** $x \ast y = x^{y}$ sur $\mathbb{N}^{*}$

    **8.** $x \ast y = \sqrt{x+y}$ sur $\mathbb{R}_{+}$

    **9.** $\cup$ sur $\mathcal{P}(E)$

    **10.** $A \ast B = A \setminus B$ sur $\mathcal{P}(E)$
  corrige: |
    Le mot *interne* porte toute la définition : il faut que le résultat reste dans l'ensemble de départ, et que l'opération y soit définie pour *tout* couple.

    **1.** La différence de deux entiers naturels peut être négative : 
    $$\boxed{\text{Non : } 3-5=-2 \notin \mathbb{N}.}$$

    **2.** La différence de deux entiers relatifs est un entier relatif : $\boxed{\text{Oui.}}$

    **3.** La loi n'est pas définie partout : 
    $$\boxed{\text{Non : le quotient } \dfrac{x}{0} \text{ n'est pas défini.}}$$

    **4.** Si $x$ et $y$ sont des réels non nuls, $\dfrac{x}{y}$ est un réel non nul : $\boxed{\text{Oui.}}$

    **5.** La demi-somme de deux entiers n'est pas toujours entière : 
    $$\boxed{\text{Non : } 1 \ast 2 = \dfrac{3}{2} \notin \mathbb{Z}.}$$

    **6.** La demi-somme de deux rationnels est un rationnel : $\boxed{\text{Oui.}}$

    **7.** Si $x \geqslant 1$ et $y \geqslant 1$, alors $x^{y} \geqslant 1$ est un entier : $\boxed{\text{Oui.}}$

    **8.** Si $x \geqslant 0$ et $y \geqslant 0$, alors $x+y \geqslant 0$ et $\sqrt{x+y}$ existe et est positif : $\boxed{\text{Oui.}}$

    **9.** La réunion de deux parties de $E$ est une partie de $E$ : $\boxed{\text{Oui.}}$

    **10.** L'ensemble $A \setminus B$ est inclus dans $A$, donc dans $E$ : $\boxed{\text{Oui.}}$

    *Piège de la question 3 :* l'obstacle n'est pas que le résultat sorte de $\mathbb{R}$, mais que la loi ne soit pas *définie* pour tout couple. Une L.C.I. est une application de $E \times E$ dans $E$ : elle doit exister partout.
- id: "ap-03-02"
  feuille: "f-ap-03"
  numero: 2
  partie: "Lois de composition interne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois de composition interne, commutativité et associativité]
  noeuds: [a-loi]
  notions: [loi-composition]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des lois suivantes, définies sur $\mathbb{R}$, déterminer si elle est commutative et si elle est associative.

    **1.** $x \ast y = x+y+xy$

    **2.** $x \ast y = \dfrac{x+y}{2}$

    **3.** $x \ast y = x$

    **4.** $x \ast y = x^{2}y$
  corrige: |
    **1.** L'expression $x+y+xy$ est inchangée quand on échange $x$ et $y$ : la loi est **commutative**. Pour l'associativité : 
    $$(x \ast y) \ast z = (x+y+xy)+z+(x+y+xy)z = x+y+z+xy+xz+yz+xyz$$

    $$x \ast (y \ast z) = x+(y+z+yz)+x(y+z+yz) = x+y+z+yz+xy+xz+xyz$$
     Ces deux expressions coïncident : 
    $$\boxed{\text{Commutative et associative.}}$$

    **2.** L'expression $\dfrac{x+y}{2}$ est symétrique : la loi est commutative. En revanche, avec $x=0$, $y=0$ et $z=2$ : 
    $$(0 \ast 0) \ast 2 = 0 \ast 2 = 1 \qquad\text{tandis que}\qquad 0 \ast (0 \ast 2) = 0 \ast 1 = \frac{1}{2}$$

    $$\boxed{\text{Commutative, non associative.}}$$

    **3.** On a $1 \ast 2 = 1$ et $2 \ast 1 = 2$ : la loi n'est pas commutative. En revanche : 
    $$(x \ast y) \ast z = x \ast z = x \qquad\text{et}\qquad x \ast (y \ast z) = x$$

    $$\boxed{\text{Non commutative, associative.}}$$

    **4.** On a $1 \ast 2 = 2$ et $2 \ast 1 = 4$ : la loi n'est pas commutative. De plus : 
    $$(x \ast y) \ast z = \big(x^{2}y\big)^{2}z = x^{4}y^{2}z \qquad\text{et}\qquad x \ast (y \ast z) = x^{2}\big(y^{2}z\big) = x^{2}y^{2}z$$
     qui diffèrent pour $x=2$, $y=z=1$ : on obtient $16$ d'un côté et $4$ de l'autre. 
    $$\boxed{\text{Ni commutative, ni associative.}}$$

    Les questions 3 et 4 montrent que les deux propriétés sont indépendantes : aucune n'entraîne l'autre.
- id: "ap-03-03"
  feuille: "f-ap-03"
  numero: 3
  partie: "Lois de composition interne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lois de composition interne, commutativité et associativité, élément neutre, symétrique]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, element-neutre, inversible]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Pour chacune des lois suivantes, étudier dans cet ordre : l'internité, la commutativité, l'associativité, l'existence d'un neutre, puis les éléments symétrisables.

    **1.** $x \ast y = x+y-xy$ sur $\mathbb{R}$

    **2.** $x \ast y = \sqrt{x^{2}+y^{2}}$ sur $\mathbb{R}_{+}$

    **3.** $x \ast y = x+y-3$ sur $\mathbb{Z}$

    Que remarque-t-on à la dernière question ?
  corrige: |
    **1.** La loi $x \ast y = x+y-xy$ sur $\mathbb{R}$.

    *Internité et commutativité.* Le résultat est un réel, et l'expression est symétrique en $x$ et $y$.

    *Associativité.* On remarque que $1-x \ast y = 1-x-y+xy = (1-x)(1-y)$, d'où : 
    $$1-(x \ast y) \ast z = \big(1-x \ast y\big)(1-z) = (1-x)(1-y)(1-z)$$
     Cette expression étant symétrique en $x$, $y$ et $z$, la loi est associative.

    *Neutre.* On cherche $e$ tel que $x \ast e = x$ pour tout $x$, soit $x+e-xe=x$, c'est-à-dire $e(1-x)=0$ pour tout $x$ : nécessairement $e=0$. On vérifie que $x \ast 0 = 0 \ast x = x$.

    *Éléments symétrisables.* On résout $x \ast y = 0$, soit $x+y-xy=0$, c'est-à-dire $y(1-x)=-x$. Si $x \neq 1$, on obtient $y=\dfrac{x}{x-1}$ ; si $x=1$, alors $1 \ast y = 1+y-y = 1 \neq 0$. 
    $$\boxed{\begin{array}{l} \text{Loi interne, commutative, associative, de neutre } 0. \\[1mm] \text{Les éléments symétrisables sont ceux de } \mathbb{R} \setminus \{1\}, \text{ le symétrique de } x \text{ étant } \dfrac{x}{x-1}. \end{array}}$$

    **2.** La loi $x \ast y = \sqrt{x^{2}+y^{2}}$ sur $\mathbb{R}_{+}$.

    Le résultat est un réel positif, et l'expression est symétrique. Pour l'associativité : 
    $$(x \ast y) \ast z = \sqrt{\big(\sqrt{x^{2}+y^{2}}\big)^{2}+z^{2}} = \sqrt{x^{2}+y^{2}+z^{2}} = x \ast (y \ast z)$$
     Le neutre vérifie $\sqrt{x^{2}+e^{2}}=x$ pour tout $x \geqslant 0$, donc $e=0$. Enfin $x \ast y = 0$ impose $x^{2}+y^{2}=0$, donc $x=y=0$. 
    $$\boxed{\begin{array}{l} \text{Loi interne, commutative, associative, de neutre } 0. \\[1mm] \text{Seul } 0 \text{ est symétrisable.} \end{array}}$$

    **3.** La loi $x \ast y = x+y-3$ sur $\mathbb{Z}$.

    Le résultat est un entier relatif, et l'expression est symétrique. Pour l'associativité, les deux calculs donnent $x+y+z-6$. Le neutre vérifie $x+e-3=x$, donc $e=3$. Enfin $x \ast y = 3$ équivaut à $y=6-x$, qui est bien un entier. 
    $$\boxed{\begin{array}{l} \text{Loi interne, commutative, associative, de neutre } 3. \\[1mm] \text{Tout élément } x \text{ est symétrisable, de symétrique } 6-x. \end{array}}$$

    *Remarque.* Les quatre axiomes **IANS** sont donc satisfaits : $(\mathbb{Z} \,;\ast)$ est un groupe abélien, comme on le vérifiera à l'exercice 7. Ce n'est pas un hasard : l'application $\varphi : x \mapsto x-3$ est une bijection de $\mathbb{Z}$ sur $\mathbb{Z}$ qui vérifie $\varphi(x \ast y)=\varphi(x)+\varphi(y)$. Cette loi n'est donc que l'addition habituelle, déguisée par un changement de nom des éléments — et le neutre $3$ n'a rien de mystérieux : c'est l'ancien $0$.
- id: "ap-03-04"
  feuille: "f-ap-03"
  numero: 4
  partie: "Neutre, symétrique et tables de Cayley"
  etoiles: 1
  types: [Calcul]
  mots_cles: [élément neutre, symétrique]
  noeuds: [a-monoide]
  notions: [element-neutre, inversible]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Pour chacune des lois suivantes, déterminer l'élément neutre lorsqu'il existe, puis l'ensemble des éléments symétrisables.

    **1.** $(\mathbb{N} \,;\times)$

    **2.** $(\mathbb{R} \,;\times)$

    **3.** $\big(\mathcal{P}(E) \,;\cap\big)$

    **4.** $\big(\mathcal{P}(E) \,;\cup\big)$

    **5.** $\big(E^{E} \,;\circ\big)$

    **6.** $\big(\mathcal{P}(E) \,;\Delta\big)$, où $A \,\Delta\, B = (A \cup B) \setminus (A \cap B)$

    La dernière loi, rencontrée au chapitre 1, réserve une surprise : la commenter.
  corrige: |
    **1.** Le neutre de $(\mathbb{N} \,;\times)$ est $1$. Si $xy=1$ avec $x$ et $y$ entiers naturels, alors $x \geqslant 1$ et $y \geqslant 1$, donc $x=y=1$. 
    $$\boxed{\text{Neutre } 1 \text{ ; seul } 1 \text{ est symétrisable.}}$$

    **2.** Le neutre de $(\mathbb{R} \,;\times)$ est $1$, et $x$ est inversible si et seulement si $x \neq 0$. 
    $$\boxed{\text{Neutre } 1 \text{ ; les éléments symétrisables sont ceux de } \mathbb{R}^{*}.}$$

    **3.** On a $A \cap E = A$ pour toute partie $A$, et $A \cap B = E$ impose $A=B=E$. 
    $$\boxed{\text{Neutre } E \text{ ; seul } E \text{ est symétrisable.}}$$

    **4.** On a $A \cup \varnothing = A$, et $A \cup B = \varnothing$ impose $A=B=\varnothing$. 
    $$\boxed{\text{Neutre } \varnothing \text{ ; seul } \varnothing \text{ est symétrisable.}}$$

    **5.** Le neutre est $\mathrm{Id}_{E}$, d'après la propriété 1 du chapitre 2. Une application $f$ admet un symétrique pour $\circ$ lorsqu'il existe $g$ telle que $f \circ g = g \circ f = \mathrm{Id}_{E}$, c'est-à-dire lorsque $f$ est bijective. 
    $$\boxed{\text{Neutre } \mathrm{Id}_{E} \text{ ; les éléments symétrisables sont les bijections de } E.}$$

    **6.** On a $A \,\Delta\, \varnothing = A$ et $A \,\Delta\, A = \varnothing$, résultats établis au chapitre 1. 
    $$\boxed{\text{Neutre } \varnothing \text{ ; toute partie est symétrisable, et est son propre symétrique.}}$$

    *Commentaire.* La différence symétrique fait donc de $\mathcal{P}(E)$ un groupe abélien, alors que $\cap$ et $\cup$ n'en font pas un : sur les mêmes éléments, changer la loi change tout. Ce groupe a de plus une propriété remarquable — tout élément est son propre symétrique — que l'on exploitera à l'exercice 13.
- id: "ap-03-05"
  feuille: "f-ap-03"
  numero: 5
  partie: "Neutre, symétrique et tables de Cayley"
  etoiles: 1
  types: [Calcul]
  mots_cles: [commutativité et associativité, élément neutre, symétrique, tables de Cayley, groupes]
  noeuds: [a-loi, a-monoide, a-groupe]
  notions: [element-neutre, inversible, groupe]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On donne ci-dessous les tables de Cayley de deux lois, définies respectivement sur $E=\{e \,;a \,;b \,;c\}$ et sur $F=\{e \,;a \,;b\}$. On admet que la première loi est associative.

    $$\begin{array}{|c||c|c|c|c|} \hline \ast & e & a & b & c \\ \hline e & e & a & b & c \\ \hline a & a & e & c & b \\ \hline b & b & c & e & a \\ \hline c & c & b & a & e \\ \hline \end{array}$$

    $$\begin{array}{|c||c|c|c|} \hline \perp & e & a & b \\ \hline e & e & a & b \\ \hline a & a & e & a \\ \hline b & b & a & e \\ \hline \end{array}$$

    **1.** Pour chacune des deux lois, dire si elle est commutative, en justifiant par une lecture de la table.

    **2.** Pour chacune, déterminer l'élément neutre.

    **3.** Pour chacune, déterminer les éléments symétrisables.

    **4.** Les trois lectures précédentes sont favorables dans les deux cas. Pourtant, l'une des deux lois ne fait pas de son ensemble un groupe. Laquelle ? On pourra calculer $(a \perp a) \perp b$ puis $a \perp (a \perp b)$.

    **5.** Observer par ailleurs la ligne de $a$ dans la seconde table. Que remarque-t-on, et en quoi cela distingue-t-il cette table de la première ?
  corrige: |
    **1.** Les deux tables sont symétriques par rapport à leur diagonale principale : on lit la même valeur en $(x\,;y)$ et en $(y\,;x)$. 
    $$\boxed{\text{Les deux lois sont commutatives.}}$$

    **2.** Dans les deux tables, la ligne de $e$ reproduit l'en-tête des colonnes, et la colonne de $e$ reproduit l'en-tête des lignes. 
    $$\boxed{\text{Dans les deux cas, } e \text{ est l'élément neutre.}}$$

    **3.** On cherche le neutre $e$ dans chaque ligne. Pour la loi $\ast$ : $a \ast a = b \ast b = c \ast c = e$. Pour la loi $\perp$ : $a \perp a = b \perp b = e$. 
    $$\boxed{\text{Dans les deux cas, tout élément est symétrisable et est son propre symétrique.}}$$

    **4.** On calcule dans la seconde table : 
    $$(a \perp a) \perp b = e \perp b = b \qquad\text{tandis que}\qquad a \perp (a \perp b) = a \perp a = e$$
     Comme $b \neq e$, la loi $\perp$ n'est pas associative : l'axiome **A** échoue. 
    $$\boxed{(F \,;\perp) \text{ n'est pas un groupe, alors que } (E \,;\ast) \text{ en est un.}}$$

    **5.** La ligne de $a$ dans la seconde table est $(a \,;e \,;a)$ : l'élément $a$ y figure deux fois, et $b$ n'y figure pas. Rien de tel dans la première table, où chaque ligne contient chacun des quatre éléments exactement une fois. 
    $$\boxed{\text{La seconde table n'est pas un \emph{carré latin}.}}$$
     On démontrera à l'exercice 13 que la table de Cayley d'un groupe fini en est nécessairement un : c'est donc un second argument, plus rapide, pour écarter $(F \,;\perp)$.

    *Piège :* les trois lectures immédiates données par le cours — symétrie, première ligne, présence du neutre dans chaque ligne — ne testent que la commutativité, le neutre et les symétriques. Elles ne disent *rien* de l'associativité, qui est pourtant l'un des quatre axiomes.
- id: "ap-03-06"
  feuille: "f-ap-03"
  numero: 6
  partie: "Neutre, symétrique et tables de Cayley"
  etoiles: 2
  types: [Calcul]
  mots_cles: [commutativité et associativité, symétrique, tables de Cayley, groupes]
  noeuds: [a-loi, a-monoide, a-groupe]
  notions: [inversible, groupe]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On note $\Delta$ la différence symétrique définie à l'exercice 4, et l'on pose $E=\{a \,;b\}$.

    **1.** Dresser la table de Cayley de $\big(\mathcal{P}(E) \,;\Delta\big)$.

    **2.** Cette loi fait-elle de $\mathcal{P}(E)$ un groupe ? On admettra l'associativité.

    **3.** Comparer cette table à celle de la multiplication sur $\{1 \,;\mathrm{i} \,;-1 \,;-\mathrm{i}\}$, donnée dans le cours. Les deux groupes se comportent-ils de la même façon ?
  corrige: |
    **1.** L'ensemble $\mathcal{P}(E)$ compte quatre éléments : $\varnothing$, $\{a\}$, $\{b\}$ et $E=\{a\,;b\}$. On calcule chaque différence symétrique, par exemple $\{a\} \,\Delta\, \{b\} = \{a\,;b\}$ et $\{a\} \,\Delta\, E = \{b\}$.

    $$\begin{array}{|c||c|c|c|c|} \hline \Delta & \varnothing & \{a\} & \{b\} & E \\ \hline \varnothing & \varnothing & \{a\} & \{b\} & E \\ \hline \{a\} & \{a\} & \varnothing & E & \{b\} \\ \hline \{b\} & \{b\} & E & \varnothing & \{a\} \\ \hline E & E & \{b\} & \{a\} & \varnothing \\ \hline \end{array}$$

    **2.** La table est symétrique, la ligne de $\varnothing$ reproduit l'en-tête, et $\varnothing$ figure une fois dans chaque ligne : la loi est commutative, de neutre $\varnothing$, et tout élément est symétrisable. L'associativité étant admise : 
    $$\boxed{\big(\mathcal{P}(E) \,;\Delta\big) \text{ est un groupe abélien à quatre éléments.}}$$

    **3.** Les deux groupes ont quatre éléments, mais ne se comportent pas de la même façon. Dans $\big(\mathcal{P}(E) \,;\Delta\big)$, *tout* élément est son propre symétrique ; dans $\{1 \,;\mathrm{i} \,;-1 \,;-\mathrm{i}\}$, seuls $1$ et $-1$ le sont, puisque $\mathrm{i} \times \mathrm{i} = -1 \neq 1$. 
    $$\boxed{\text{Non : ces deux groupes d'ordre } 4 \text{ ne sont pas de même nature.}}$$
     On retrouvera la première table à l'exercice 8, avec des fonctions à la place des parties.
- id: "ap-03-07"
  feuille: "f-ap-03"
  numero: 7
  partie: "Groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [groupes, groupes abéliens]
  noeuds: [a-groupe]
  notions: [groupe]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Les ensembles suivants, munis des lois considérées, sont-ils des groupes ? On suivra l'ordre de vérification donné par l'acronyme **IANS**, et l'on précisera le cas échéant lequel des quatre axiomes échoue.

    **1.** $(\mathbb{N} \,;+)$

    **2.** $(\mathbb{N} \,;\times)$

    **3.** $(\mathbb{Z} \,;+)$

    **4.** $(\mathbb{Z} \,;\times)$

    **5.** $(n\mathbb{Z} \,;+)$, où $n \in \mathbb{N}^{*}$

    **6.** $(\mathbb{R} \,;+)$

    **7.** $(\mathbb{R} \,;\times)$

    **8.** $(\mathbb{R}^{*} \,;\times)$

    **9.** $\big(\mathbb{R}^{\mathbb{R}} \,;\circ\big)$

    **10.** $\big(\mathbb{R}^{\mathbb{R}} \,;+\big)$

    Préciser enfin lesquels de ces groupes sont abéliens.
  corrige: |
    On suit l'ordre **IANS** et l'on s'arrête au premier axiome qui échoue.

    ```tableau
     ¦ **Groupe ?** ¦ **Justification**
    $(\mathbb{N} \,;+)$ ¦ non ¦ **S** échoue : $3$ n'a pas d'opposé dans $\mathbb{N}$.
    $(\mathbb{N} \,;\times)$ ¦ non ¦ **S** échoue : $2$ n'a pas d'inverse dans $\mathbb{N}$.
    $(\mathbb{Z} \,;+)$ ¦ **oui** ¦ Groupe abélien de neutre $0$, le symétrique de $x$ étant $-x$.
    $(\mathbb{Z} \,;\times)$ ¦ non ¦ **S** échoue : $2$ n'a pas d'inverse dans $\mathbb{Z}$.
    $(n\mathbb{Z} \,;+)$ ¦ **oui** ¦ Groupe abélien de neutre $0$ ; $nk+nk'=n(k+k')$ et $-nk=n(-k)$.
    $(\mathbb{R} \,;+)$ ¦ **oui** ¦ Groupe abélien de neutre $0$.
    $(\mathbb{R} \,;\times)$ ¦ non ¦ **S** échoue : $0$ n'a pas d'inverse.
    $(\mathbb{R}^{*} \,;\times)$ ¦ **oui** ¦ Groupe abélien de neutre $1$, le symétrique de $x$ étant $\frac{1}{x}$.
    $\big(\mathbb{R}^{\mathbb{R}} \,;\circ\big)$ ¦ non ¦ **S** échoue : seules les bijections sont symétrisables (exercice 4).
    $\big(\mathbb{R}^{\mathbb{R}} \,;+\big)$ ¦ **oui** ¦ Groupe abélien de neutre la fonction nulle, le symétrique de $f$ étant $-f$.
    ```

    $$\boxed{\text{Les cinq groupes obtenus sont tous abéliens.}}$$

    *Piège :* il ne faut pas confondre « $\mathbb{N}$ n'est pas un groupe pour $+$ » avec « l'addition n'est pas associative sur $\mathbb{N}$ ». Les trois premiers axiomes sont satisfaits ; c'est le quatrième, et lui seul, qui fait défaut. C'est précisément ce manque qui motive la construction de $\mathbb{Z}$.
- id: "ap-03-08"
  feuille: "f-ap-03"
  numero: 8
  partie: "Groupes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [tables de Cayley, groupes, groupes abéliens]
  noeuds: [a-loi, a-groupe]
  notions: [groupe]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Les ensembles suivants, munis des lois considérées, sont-ils des groupes ? Sont-ils abéliens ?

    **1.** $G$ est l'ensemble des applications de $\mathbb{R}$ dans $\mathbb{R}$ de la forme $x \mapsto ax+b$, avec $a \in \mathbb{R}^{*}$ et $b \in \mathbb{R}$, muni de la composition $\circ$.

    **2.** $G$ est l'ensemble des fonctions croissantes de $\mathbb{R}$ dans $\mathbb{R}$, muni de l'addition.

    **3.** $G=\{f_{1} \,;f_{2} \,;f_{3} \,;f_{4}\}$, muni de la composition $\circ$, où pour tout $x \in \mathbb{R}^{*}$ : 
    $$f_{1}(x)=x \qquad f_{2}(x)=-x \qquad f_{3}(x)=\dfrac{1}{x} \qquad f_{4}(x)=-\dfrac{1}{x}$$

    **4.** $G=\;]-1\,;1[$, muni de la loi $\star$ définie par : 
    $$\forall (x\,;y) \in G^{2}, \qquad x \star y = \dfrac{x+y}{1+xy}$$

    **5.** $G=\mathbb{R}^{2}$, muni de la loi $\diamond$ définie par : 
    $$\forall \big((x\,;y)\,;(x'\,;y')\big) \in G^{2}, \qquad (x\,;y) \diamond (x'\,;y') = \big(x+x' \,;\, y\,\mathrm{e}^{x'}+y'\,\mathrm{e}^{-x}\big)$$

    Pour la question 3, on pourra dresser la table de Cayley de la loi.
  corrige: |
    **1.** Notons $f_{a,b} : x \mapsto ax+b$, avec $a \in \mathbb{R}^{*}$ et $b \in \mathbb{R}$.

    *Internité.* Pour tous $(a\,;b)$ et $(c\,;d)$ convenables : 
    $$\big(f_{a,b} \circ f_{c,d}\big)(x) = a(cx+d)+b = (ac)x+(ad+b)$$
     donc $f_{a,b} \circ f_{c,d} = f_{ac,\,ad+b}$, avec $ac \in \mathbb{R}^{*}$ : la loi est interne.

    *Associativité.* C'est celle de la composition des applications.

    *Neutre.* $f_{1,0}=\mathrm{Id}_{\mathbb{R}}$ appartient à $G$.

    *Symétrique.* On cherche $f_{a',b'}$ telle que $f_{a,b} \circ f_{a',b'} = f_{1,0}$, soit $aa'=1$ et $ab'+b=0$, d'où $a'=\dfrac{1}{a}$ et $b'=-\dfrac{b}{a}$. On vérifie que $f_{\frac{1}{a},-\frac{b}{a}}$ convient aussi de l'autre côté.

    Enfin $f_{2,0} \circ f_{1,1} = f_{2,2}$ tandis que $f_{1,1} \circ f_{2,0} = f_{2,1}$. 
    $$\boxed{(G \,;\circ) \text{ est un groupe non abélien.}}$$

    **2.** La somme de deux fonctions croissantes est croissante, l'addition des fonctions est associative, et la fonction nulle est croissante et neutre. En revanche, si $f$ est croissante et non constante, $-f$ est décroissante et n'appartient pas à $G$ : par exemple $f=\mathrm{Id}_{\mathbb{R}}$ n'a pas d'opposé dans $G$. 
    $$\boxed{\text{Ce n'est pas un groupe : l'axiome \textbf{S} échoue.}}$$

    **3.** On dresse la table de Cayley, en calculant par exemple $f_{2} \circ f_{3}(x)=f_{2}\left(\frac{1}{x}\right)=-\frac{1}{x}=f_{4}(x)$.

    $$\begin{array}{|c||c|c|c|c|} \hline \circ & f_{1} & f_{2} & f_{3} & f_{4} \\ \hline f_{1} & f_{1} & f_{2} & f_{3} & f_{4} \\ \hline f_{2} & f_{2} & f_{1} & f_{4} & f_{3} \\ \hline f_{3} & f_{3} & f_{4} & f_{1} & f_{2} \\ \hline f_{4} & f_{4} & f_{3} & f_{2} & f_{1} \\ \hline \end{array}$$

    La table ne fait intervenir que des éléments de $G$ : la loi est interne. Elle est associative comme composition d'applications, admet $f_{1}=\mathrm{Id}$ pour neutre, et chaque élément est son propre symétrique. 
    $$\boxed{(G \,;\circ) \text{ est un groupe abélien à quatre éléments.}}$$
     On reconnaît, aux noms près, la table obtenue à l'exercice 6 : ce sont « les mêmes » quatre éléments.

    **4.** Soient $x$ et $y$ dans $]-1\,;1[$. Alors $|xy|<1$, donc $1+xy>0$, et : 
    $$1-x \star y = \frac{(1+xy)-(x+y)}{1+xy} = \frac{(1-x)(1-y)}{1+xy} > 0 \qquad 1+x \star y = \frac{(1+x)(1+y)}{1+xy} > 0$$
     Donc $-1 < x \star y < 1$ : la loi est interne. Elle est visiblement commutative, et un calcul donne : 
    $$(x \star y) \star z = \frac{x+y+z+xyz}{1+xy+xz+yz} = x \star (y \star z)$$
     Le neutre est $0$, et le symétrique de $x$ est $-x$, qui appartient bien à $]-1\,;1[$. 
    $$\boxed{(G \,;\star) \text{ est un groupe abélien.}}$$

    **5.** La loi est interne sur $\mathbb{R}^{2}$. Un calcul donne, pour les deux parenthésages : 
    $$y\,\mathrm{e}^{x'+x''} + y'\,\mathrm{e}^{x''-x} + y''\,\mathrm{e}^{-x-x'}$$
     en seconde composante, et $x+x'+x''$ en première : la loi est associative. Le neutre est $(0\,;0)$, puisque : 
    $$(x\,;y) \diamond (0\,;0) = \big(x \,;\, y\,\mathrm{e}^{0}+0\big)=(x\,;y) \qquad\text{et}\qquad (0\,;0) \diamond (x\,;y) = \big(x \,;\, 0+y\,\mathrm{e}^{0}\big)=(x\,;y)$$
     Le symétrique de $(x\,;y)$ est $(-x\,;-y)$, car $y\,\mathrm{e}^{-x}+(-y)\,\mathrm{e}^{-x}=0$. Enfin : 
    $$(1\,;0) \diamond (0\,;1) = \big(1 \,;\, \mathrm{e}^{-1}\big) \qquad\text{tandis que}\qquad (0\,;1) \diamond (1\,;0) = \big(1 \,;\, \mathrm{e}\big)$$

    $$\boxed{(G \,;\diamond) \text{ est un groupe non abélien.}}$$
- id: "ap-03-09"
  feuille: "f-ap-03"
  numero: 9
  partie: "Groupes"
  etoiles: 2
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [lois de composition interne, groupes, groupes abéliens]
  noeuds: [a-loi, a-groupe]
  notions: [loi-composition, groupe]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On considère la loi de composition interne $\ast$ définie sur $\mathbb{R}^{*} \times \mathbb{R}$ par : 
    $$\forall \big((x\,;y)\,;(x'\,;y')\big) \in \big(\mathbb{R}^{*} \times \mathbb{R}\big)^{2}, \qquad (x\,;y) \ast (x'\,;y') = \big(xx' \,;\, xy'+y\big)$$

    **1.** Démontrer que $\big(\mathbb{R}^{*} \times \mathbb{R} \,;\ast\big)$ est un groupe. Est-il abélien ?

    **2.** Calculer $(x\,;y)^{2}$ puis $(x\,;y)^{3}$.

    **3.** Conjecturer une expression de $(x\,;y)^{n}$ pour $n \in \mathbb{N}^{*}$, et la démontrer.

    **4.** Simplifier cette expression dans le cas $x \neq 1$, puis dans le cas $x=1$.
  corrige: |
    **1.** *Internité.* Si $x$ et $x'$ sont non nuls, $xx'$ l'est aussi, et $xy'+y$ est un réel.

    *Associativité.* Les deux parenthésages donnent la même chose : 
    $$\big((x\,;y) \ast (x'\,;y')\big) \ast (x''\,;y'') = (xx'\,;xy'+y) \ast (x''\,;y'') = \big(xx'x'' \,;\, xx'y''+xy'+y\big)$$

    $$(x\,;y) \ast \big((x'\,;y') \ast (x''\,;y'')\big) = (x\,;y) \ast (x'x''\,;x'y''+y') = \big(xx'x'' \,;\, x(x'y''+y')+y\big)$$

    *Neutre.* On vérifie $(x\,;y) \ast (1\,;0) = (x \,;\, 0+y) = (x\,;y)$ et $(1\,;0) \ast (x\,;y) = (x \,;\, y+0) = (x\,;y)$.

    *Symétrique.* On résout $(x\,;y) \ast (x'\,;y') = (1\,;0)$, soit $xx'=1$ et $xy'+y=0$, d'où $x'=\dfrac{1}{x}$ et $y'=-\dfrac{y}{x}$. On vérifie que ce couple convient aussi à gauche.

    Enfin $(2\,;0) \ast (1\,;1) = (2\,;2)$ alors que $(1\,;1) \ast (2\,;0) = (2\,;1)$. 
    $$\boxed{\big(\mathbb{R}^{*} \times \mathbb{R} \,;\ast\big) \text{ est un groupe non abélien.}}$$

    **2.** On applique la définition de la loi : 
    $$(x\,;y)^{2} = (x\,;y) \ast (x\,;y) = \big(x^{2} \,;\, xy+y\big) = \boxed{\big(x^{2} \,;\, y(x+1)\big)}$$

    $$(x\,;y)^{3} = (x\,;y)^{2} \ast (x\,;y) = \big(x^{3} \,;\, x^{2}y+y(x+1)\big) = \boxed{\big(x^{3} \,;\, y(x^{2}+x+1)\big)}$$

    **3.** On conjecture, en notant $S_{n}=1+x+\dots+x^{n-1}$ : 
    $$\boxed{\forall n \in \mathbb{N}^{*}, \quad (x\,;y)^{n} = \big(x^{n} \,;\, y\,S_{n}\big)}$$
     *Démonstration par récurrence.* La formule est vraie pour $n=1$, où $S_{1}=1$. Supposons-la vraie au rang $n$ : 
    $$(x\,;y)^{n+1} = (x\,;y)^{n} \ast (x\,;y) = \big(x^{n} \,;\, y\,S_{n}\big) \ast (x\,;y) = \big(x^{n+1} \,;\, x^{n}y+y\,S_{n}\big) = \big(x^{n+1} \,;\, y\,S_{n+1}\big)$$
     puisque $S_{n}+x^{n}=S_{n+1}$. La formule est donc vraie pour tout $n \in \mathbb{N}^{*}$.

    **4.** La somme $S_{n}$ est celle des termes d'une suite géométrique de raison $x$. 
    $$\boxed{\text{Si } x \neq 1 \;:\; (x\,;y)^{n} = \left(x^{n} \,;\, y\,\dfrac{x^{n}-1}{x-1}\right) \qquad\text{et si } x=1 \;:\; (1\,;y)^{n} = (1 \,;\, ny)}$$
- id: "ap-03-10"
  feuille: "f-ap-03"
  numero: 10
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois de composition interne, élément neutre, symétrique, groupes, groupes abéliens]
  noeuds: [a-loi, a-monoide, a-groupe]
  notions: [loi-composition, element-neutre, inversible, groupe]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    On pose $G=\mathbb{R} \setminus \{-1\}$ et l'on définit sur $G$ la loi $\ast$ par : 
    $$\forall (x\,;y) \in G^{2}, \qquad x \ast y = x+y+xy$$

    **1.** Vérifier que $1+x \ast y=(1+x)(1+y)$, puis en déduire que $\ast$ est bien une loi interne sur $G$.

    **2.** Démontrer que $(G \,;\ast)$ est un groupe abélien, en précisant le neutre et le symétrique d'un élément.

    **3.** L'égalité de la question 1 suggère un lien entre $(G \,;\ast)$ et $(\mathbb{R}^{*} \,;\times)$. Le formuler.
  corrige: |
    **1.** On développe : 
    $$1+x \ast y = 1+x+y+xy = (1+x)(1+y)$$
     Si $x \neq -1$ et $y \neq -1$, alors $1+x \neq 0$ et $1+y \neq 0$, donc $1+x \ast y \neq 0$, c'est-à-dire $x \ast y \neq -1$. 
    $$\boxed{\ast \text{ est une loi interne sur } G=\mathbb{R} \setminus \{-1\}.}$$

    **2.** *Commutativité.* L'expression $x+y+xy$ est symétrique en $x$ et $y$.

    *Associativité.* En appliquant deux fois l'identité de la question 1 : 
    $$1+(x \ast y) \ast z = \big(1+x \ast y\big)(1+z) = (1+x)(1+y)(1+z)$$
     expression symétrique en $x$, $y$ et $z$. Donc $(x \ast y) \ast z = x \ast (y \ast z)$.

    *Neutre.* On a $x \ast 0 = x+0+0 = x$, et $0 \in G$ : le neutre est $0$.

    *Symétrique.* On cherche $y \in G$ tel que $x \ast y = 0$, c'est-à-dire $(1+x)(1+y)=1$, soit : 
    $$1+y = \frac{1}{1+x} \qquad\text{donc}\qquad y = \frac{1}{1+x}-1 = \frac{-x}{1+x}$$
     Ce réel appartient bien à $G$ : si l'on avait $\dfrac{-x}{1+x}=-1$, il viendrait $-x=-1-x$, ce qui est absurde. 
    $$\boxed{(G \,;\ast) \text{ est un groupe abélien de neutre } 0, \text{ le symétrique de } x \text{ étant } \dfrac{-x}{1+x}.}$$

    **3.** Posons $\varphi : x \mapsto 1+x$. C'est une bijection de $G=\mathbb{R} \setminus \{-1\}$ sur $\mathbb{R}^{*}$, de réciproque $t \mapsto t-1$, et la question 1 s'écrit : 
    $$\varphi(x \ast y) = \varphi(x) \times \varphi(y)$$

    $$\boxed{\begin{array}{l} \text{La loi } \ast \text{ n'est que la multiplication de } \mathbb{R}^{*}, \text{ transportée sur } G \text{ par la bijection } \varphi. \\[1mm] \text{Les deux groupes sont «\,les mêmes\,», à ce changement de nom près.} \end{array}}$$
     C'est le même phénomène qu'à l'exercice 3, question 3, où l'addition de $\mathbb{Z}$ était déguisée par $x \mapsto x-3$.
- id: "ap-03-11"
  feuille: "f-ap-03"
  numero: 11
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [symétrique, groupes, groupes abéliens, groupe symétrique]
  noeuds: [a-monoide, a-groupe]
  notions: [inversible, groupe, groupe-symetrique]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    On pose $E=\{1 \,;2 \,;3\}$ et l'on note $\mathcal{S}(E)$ l'ensemble des bijections de $E$ dans $E$, muni de la composition.

    **1.** Combien $\mathcal{S}(E)$ possède-t-il d'éléments ? Décrire chacun d'eux par le triplet $\big(\sigma(1) \,;\sigma(2) \,;\sigma(3)\big)$ de ses images.

    **2.** Démontrer que $\big(\mathcal{S}(E) \,;\circ\big)$ est un groupe. On pourra s'appuyer sur les résultats du chapitre 2 pour trois des quatre axiomes.

    **3.** On note $\sigma=(2\,;1\,;3)$ et $\tau=(1\,;3\,;2)$. Calculer $\sigma \circ \tau$ et $\tau \circ \sigma$. Le groupe $\mathcal{S}(E)$ est-il abélien ?

    **4.** Déterminer le symétrique de chacun des six éléments.
  corrige: |
    **1.** Une bijection de $E$ dans $E$ est déterminée par le triplet $\big(\sigma(1)\,;\sigma(2)\,;\sigma(3)\big)$, dont les trois coordonnées sont distinctes et prises dans $\{1\,;2\,;3\}$. Il y a $3$ choix pour $\sigma(1)$, puis $2$, puis $1$. 
    $$\boxed{\mathcal{S}(E) \text{ possède } 3 \times 2 \times 1 = 6 \text{ éléments.}}$$

    $$(1\,;2\,;3) \quad (1\,;3\,;2) \quad (2\,;1\,;3) \quad (2\,;3\,;1) \quad (3\,;1\,;2) \quad (3\,;2\,;1)$$

    **2.** On vérifie les quatre axiomes, les trois premiers reposant sur le chapitre 2.

    • **I** : la composée de deux bijections est une bijection.

    • **A** : la composition des applications est associative.

    • **N** : $\mathrm{Id}_{E}$ est bijective et neutre pour $\circ$.

    • **S** : si $\sigma$ est bijective, sa réciproque $\sigma^{-1}$ l'est aussi et vérifie $\sigma \circ \sigma^{-1} = \sigma^{-1} \circ \sigma = \mathrm{Id}_{E}$.

    $$\boxed{\big(\mathcal{S}(E) \,;\circ\big) \text{ est un groupe.}}$$

    **3.** On calcule image par image, en se souvenant que $\sigma \circ \tau$ applique $\tau$ en premier : 
    $$(\sigma \circ \tau)(1)=\sigma(1)=2 \qquad (\sigma \circ \tau)(2)=\sigma(3)=3 \qquad (\sigma \circ \tau)(3)=\sigma(2)=1$$

    $$(\tau \circ \sigma)(1)=\tau(2)=3 \qquad (\tau \circ \sigma)(2)=\tau(1)=1 \qquad (\tau \circ \sigma)(3)=\tau(3)=2$$

    $$\boxed{\sigma \circ \tau = (2\,;3\,;1) \qquad \tau \circ \sigma = (3\,;1\,;2) \qquad \text{donc } \mathcal{S}(E) \text{ n'est pas abélien.}}$$

    **4.** Le symétrique de $\sigma$ est sa bijection réciproque. Les quatre premiers éléments listés ci-dessous vérifient $\sigma \circ \sigma = \mathrm{Id}$, les deux derniers s'échangent. 
    $$\boxed{\begin{array}{l} (1\,;2\,;3), \; (1\,;3\,;2), \; (2\,;1\,;3) \text{ et } (3\,;2\,;1) \text{ sont leur propre symétrique ;} \\[1mm] (2\,;3\,;1) \text{ et } (3\,;1\,;2) \text{ sont symétriques l'un de l'autre.} \end{array}}$$
- id: "ap-03-12"
  feuille: "f-ap-03"
  numero: 12
  partie: "Premières propriétés et groupe produit"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [élément neutre, symétrique, groupes, groupes abéliens]
  noeuds: [a-monoide, a-groupe]
  notions: [element-neutre, inversible, groupe]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $(G \,;\cdot)$ un groupe de neutre $e$, et $a$, $b$, $x$ des éléments de $G$.

    **1.** Démontrer que $\big(x^{-1}\big)^{-1}=x$.

    **2.** Démontrer que $(xyz)^{-1}=z^{-1}y^{-1}x^{-1}$ pour tous $x$, $y$, $z$ de $G$.

    **3.** Résoudre dans $G$ l'équation $ax=b$, puis l'équation $xa=b$. Ces deux solutions coïncident-elles en général ?

    **4.** Simplifier $\big(aba^{-1}\big)^{-1}$, puis $\big(aba^{-1}\big)^{n}$ pour $n \in \mathbb{N}^{*}$.

    **5.** Démontrer que si $G$ est abélien, alors $(xy)^{-1}=x^{-1}y^{-1}$.
  corrige: |
    **1.** Les égalités $x \cdot x^{-1} = x^{-1} \cdot x = e$ montrent que $x$ est un symétrique de $x^{-1}$. La loi étant associative, la proposition 2 assure l'unicité du symétrique : 
    $$\boxed{\big(x^{-1}\big)^{-1}=x}$$

    **2.** On applique deux fois la propriété 3, en traitant $xyz$ comme $(xy)z$ : 
    $$(xyz)^{-1} = \big((xy)z\big)^{-1} = z^{-1}(xy)^{-1} = \boxed{z^{-1}y^{-1}x^{-1}}$$

    **3.** En multipliant à gauche par $a^{-1}$, puis à droite pour la seconde équation : 
    $$ax=b \iff a^{-1}ax=a^{-1}b \iff \boxed{x=a^{-1}b} \qquad\qquad xa=b \iff \boxed{x=ba^{-1}}$$

    $$\boxed{\text{Ces deux solutions coïncident si } G \text{ est abélien, mais pas en général.}}$$

    **4.** D'après la question 2 et la question 1 : 
    $$\big(aba^{-1}\big)^{-1} = \big(a^{-1}\big)^{-1}b^{-1}a^{-1} = \boxed{ab^{-1}a^{-1}}$$
     Pour la puissance, on remarque que les facteurs intérieurs se simplifient deux à deux : 
    $$\big(aba^{-1}\big)^{2} = ab\underbrace{a^{-1}a}_{=\,e}ba^{-1} = ab^{2}a^{-1}$$
     et une récurrence immédiate donne : 
    $$\boxed{\big(aba^{-1}\big)^{n} = ab^{n}a^{-1}}$$

    **5.** Si $G$ est abélien, alors $y^{-1}x^{-1}=x^{-1}y^{-1}$, et la propriété 3 donne : 
    $$\boxed{(xy)^{-1}=x^{-1}y^{-1}}$$
     *Piège :* cette égalité est *fausse* en général. C'est bien $y^{-1}x^{-1}$ qu'il faut écrire, l'inversion renversant l'ordre.
- id: "ap-03-13"
  feuille: "f-ap-03"
  numero: 13
  partie: "Premières propriétés et groupe produit"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [élément neutre, symétrique, tables de Cayley, groupes, groupes abéliens]
  noeuds: [a-monoide, a-loi, a-groupe]
  notions: [element-neutre, inversible, groupe]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $(G \,;\cdot)$ un groupe de neutre $e$.

    **1.** Démontrer que pour tous $a$, $x$, $y$ de $G$ : $ax=ay \Rightarrow x=y$, et $xa=ya \Rightarrow x=y$.

    **2.** En déduire que, dans la table de Cayley d'un groupe fini, chaque élément apparaît exactement une fois dans chaque ligne et dans chaque colonne.

    **3.** Relire à cette lumière la seconde table de l'exercice 5.

    **4.** On suppose désormais que $x^{2}=e$ pour tout $x \in G$. Démontrer que $x^{-1}=x$ pour tout $x$, puis que $G$ est abélien.

    **5.** Donner deux exemples de groupes vérifiant cette hypothèse, rencontrés dans les exercices précédents.
  corrige: |
    **1.** Supposons $ax=ay$. En multipliant à gauche par $a^{-1}$, qui existe puisque $G$ est un groupe : 
    $$a^{-1}(ax)=a^{-1}(ay) \quad\Longrightarrow\quad \big(a^{-1}a\big)x=\big(a^{-1}a\big)y \quad\Longrightarrow\quad ex=ey \quad\Longrightarrow\quad x=y$$
     Le raisonnement est symétrique pour $xa=ya$, en multipliant cette fois à droite. 
    $$\boxed{\text{Tout élément d'un groupe est régulier, à gauche comme à droite.}}$$

    **2.** La ligne de $a$ dans la table est constituée des éléments $ax$, pour $x$ parcourant $G$. Si deux d'entre eux coïncident, disons $ax=ay$, la régularité donne $x=y$ : deux cases distinctes ne peuvent donc pas contenir le même élément. Comme la ligne compte exactement autant de cases que $G$ a d'éléments, chacun y figure exactement une fois. Le raisonnement est identique pour les colonnes. 
    $$\boxed{\text{La table de Cayley d'un groupe fini est un carré latin.}}$$

    **3.** Dans la seconde table de l'exercice 5, la ligne de $a$ est $(a \,;e \,;a)$ : l'élément $a$ y figure deux fois. 
    $$\boxed{\text{Cette table ne peut donc pas être celle d'un groupe.}}$$
     C'est un critère bien plus rapide que la recherche d'un contre-exemple à l'associativité.

    **4.** Si $x^{2}=e$, alors $x \cdot x = e$, donc $x$ est son propre symétrique : $x^{-1}=x$. Soient alors $x$ et $y$ dans $G$. En appliquant ce résultat à $xy$, puis la propriété 3 : 
    $$xy = (xy)^{-1} = y^{-1}x^{-1} = yx$$

    $$\boxed{G \text{ est abélien.}}$$

    **5.** Deux exemples déjà rencontrés conviennent : 
    $$\boxed{\big(\mathcal{P}(E) \,;\Delta\big) \text{ de l'exercice 6, et le groupe } \{f_{1} \,;f_{2} \,;f_{3} \,;f_{4}\} \text{ de l'exercice 8.}}$$
     On peut ajouter le groupe $(E \,;\ast)$ de la première table de l'exercice 5 : ces trois groupes ont la même table, aux noms près.
- id: "ap-03-14"
  feuille: "f-ap-03"
  numero: 14
  partie: "Premières propriétés et groupe produit"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [élément neutre, symétrique, groupes, groupes abéliens, groupe produit]
  noeuds: [a-monoide, a-groupe]
  notions: [element-neutre, inversible, groupe]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **1.** Rappeler la définition du groupe produit de deux groupes, puis démontrer que $(\mathbb{Z} \times \mathbb{Z} \,;+)$, muni de l'addition composante par composante, est un groupe abélien. En préciser le neutre et le symétrique d'un élément.

    **2.** On munit $\mathbb{R} \times \mathbb{R}^{*}$ de la loi $\perp$ définie par $(x\,;y) \perp (x'\,;y') = (x+x' \,;\, yy')$. Justifier que c'est un groupe, et préciser son neutre.

    **3.** Démontrer que le groupe produit de deux groupes abéliens est abélien.

    **4.** La loi $\ast$ de l'exercice 9 fait-elle de $\mathbb{R}^{*} \times \mathbb{R}$ le groupe produit de $(\mathbb{R}^{*} \,;\times)$ et de $(\mathbb{R} \,;+)$ ? Justifier.
  corrige: |
    **1.** D'après la proposition 4, le groupe produit de $(G \,;\cdot)$ et $(H \,;\ast)$ est $G \times H$ muni de la loi $(x\,;y) \perp (x'\,;y') = (x \cdot x' \,;\, y \ast y')$. Ici, avec $G=H=(\mathbb{Z}\,;+)$ :

    *Internité* : la somme de deux entiers est un entier, sur chaque composante. *Associativité* : elle vaut composante par composante, car $+$ est associative sur $\mathbb{Z}$. *Neutre* : $(0\,;0)$. *Symétrique* de $(a\,;b)$ : $(-a\,;-b)$. 
    $$\boxed{(\mathbb{Z} \times \mathbb{Z} \,;+) \text{ est un groupe abélien, de neutre } (0\,;0).}$$

    **2.** C'est le groupe produit de $(\mathbb{R} \,;+)$ et de $(\mathbb{R}^{*} \,;\times)$, tous deux groupes. 
    $$\boxed{\text{C'est un groupe, de neutre } (0\,;1), \text{ le symétrique de } (x\,;y) \text{ étant } \left(-x \,;\, \dfrac{1}{y}\right).}$$

    **3.** Soient $(x\,;y)$ et $(x'\,;y')$ dans $G \times H$, avec $G$ et $H$ abéliens : 
    $$(x\,;y) \perp (x'\,;y') = (x \cdot x' \,;\, y \ast y') = (x' \cdot x \,;\, y' \ast y) = (x'\,;y') \perp (x\,;y)$$

    $$\boxed{\text{Le groupe produit de deux groupes abéliens est abélien.}}$$

    **4.** Dans un groupe produit, chaque composante du résultat ne dépend que des composantes correspondantes. Or la seconde composante de $(x\,;y) \ast (x'\,;y')$ vaut $xy'+y$ : elle fait intervenir $x$, qui appartient à la *première* composante. 
    $$\boxed{\text{Non : } \ast \text{ n'est pas la loi produit.}}$$
     Un second argument, décisif : $(\mathbb{R}^{*} \,;\times)$ et $(\mathbb{R} \,;+)$ étant abéliens, leur groupe produit le serait aussi d'après la question 3, alors que $\big(\mathbb{R}^{*} \times \mathbb{R} \,;\ast\big)$ ne l'est pas.
- id: "ap-03-15"
  feuille: "f-ap-03"
  numero: 15
  partie: "Sous-groupes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Pour chacune des questions suivantes, déterminer si la partie $H$ est un sous-groupe du groupe $G$. On utilisera la caractérisation en deux points de la proposition 5.

    **1.** $G=(\mathbb{Z} \,;+)$ et $H$ est l'ensemble des entiers pairs.

    **2.** $G=(\mathbb{Z} \,;+)$ et $H$ est l'ensemble des entiers impairs.

    **3.** $G=(\mathbb{R} \,;+)$ et $H=[-1\,;+\infty[$.

    **4.** $G=(\mathbb{R}^{*} \,;\times)$ et $H=\mathbb{Q}^{*}$.

    **5.** $G=(\mathbb{C}^{*} \,;\times)$ et $H=\big\{z \in \mathbb{C}^{*} \;\big|\; \exists n \in \mathbb{N}^{*}, \; z^{n}=1\big\}$.

    **6.** $G=(\mathbb{R}^{*} \,;\times)$ et $H=\big\{a+b\sqrt{2} \;\big|\; (a\,;b) \in \mathbb{Q}^{2}, \; (a\,;b) \neq (0\,;0)\big\}$.

    Pour la dernière question, on justifiera d'abord que $H$ est bien inclus dans $\mathbb{R}^{*}$.
  corrige: |
    On applique la méthode du cours : inclusion, non-vacuité, puis stabilité par $xy^{-1}$.

    **1.** On a $H=2\mathbb{Z} \subset \mathbb{Z}$, et $0=2 \times 0 \in H$. Soient $x=2k$ et $y=2k'$ dans $H$. La loi étant additive, le symétrique de $y$ est $-y$, et : 
    $$x-y = 2k-2k' = 2(k-k') \qquad\text{avec } k-k' \in \mathbb{Z}$$

    $$\boxed{H \text{ est un sous-groupe de } (\mathbb{Z} \,;+).}$$

    **2.** L'entier $0$ est pair, donc n'appartient pas à $H$. 
    $$\boxed{H \text{ n'est pas un sous-groupe : il ne contient pas le neutre.}}$$
     On pouvait aussi invoquer la stabilité : $1$ et $3$ sont impairs, mais $1-3=-2$ ne l'est pas.

    **3.** On a bien $0 \in H$, mais $H$ n'est pas stable : $0 \in H$ et $5 \in H$, alors que $0-5=-5 \notin H$. 
    $$\boxed{H \text{ n'est pas un sous-groupe de } (\mathbb{R} \,;+).}$$

    **4.** On a $\mathbb{Q}^{*} \subset \mathbb{R}^{*}$, et $1 \in \mathbb{Q}^{*}$. Soient $x$ et $y$ dans $\mathbb{Q}^{*}$ : le quotient $\dfrac{x}{y}$ est un rationnel non nul. 
    $$\boxed{\mathbb{Q}^{*} \text{ est un sous-groupe de } (\mathbb{R}^{*} \,;\times).}$$

    **5.** On a $H \subset \mathbb{C}^{*}$, et $1 \in H$ car $1^{1}=1$. Soient $z$ et $w$ dans $H$, avec $z^{n}=1$ et $w^{m}=1$ pour certains $n$ et $m$ de $\mathbb{N}^{*}$. Alors $nm \in \mathbb{N}^{*}$ et : 
    $$\big(zw^{-1}\big)^{nm} = z^{nm}\big(w^{nm}\big)^{-1} = \big(z^{n}\big)^{m}\Big(\big(w^{m}\big)^{n}\Big)^{-1} = 1 \times 1 = 1$$

    $$\boxed{H \text{ est un sous-groupe de } (\mathbb{C}^{*} \,;\times).}$$
     Cet ensemble est la réunion des $\mathbb{U}_{n}$ de l'exercice 18 : c'est l'ensemble des *racines de l'unité*.

    **6.** *Inclusion.* Montrons d'abord que $H \subset \mathbb{R}^{*}$, c'est-à-dire qu'un élément de $H$ n'est jamais nul. Supposons $a+b\sqrt{2}=0$ avec $(a\,;b) \neq (0\,;0)$. Si $b=0$, alors $a=0$ : exclu. Donc $b \neq 0$ et $\sqrt{2}=-\dfrac{a}{b} \in \mathbb{Q}$, ce qui contredit l'irrationalité de $\sqrt{2}$.

    *Non-vacuité.* $1=1+0\sqrt{2} \in H$.

    *Stabilité.* Soient $x=a+b\sqrt{2}$ et $y=c+d\sqrt{2}$ dans $H$. Le même argument que ci-dessus montre que $c^{2}-2d^{2} \neq 0$, et l'on calcule : 
    $$y^{-1} = \frac{1}{c+d\sqrt{2}} = \frac{c-d\sqrt{2}}{c^{2}-2d^{2}} = \frac{c}{c^{2}-2d^{2}} - \frac{d}{c^{2}-2d^{2}}\sqrt{2}$$
     qui est de la forme voulue, à coefficients rationnels non tous nuls. Enfin : 
    $$(a+b\sqrt{2})(p+q\sqrt{2}) = (ap+2bq)+(aq+bp)\sqrt{2}$$
     est encore de cette forme, et non nul comme produit de deux réels non nuls. 
    $$\boxed{H \text{ est un sous-groupe de } (\mathbb{R}^{*} \,;\times).}$$
- id: "ap-03-16"
  feuille: "f-ap-03"
  numero: 16
  partie: "Sous-groupes"
  etoiles: 1
  types: [Conjecture, Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $n$ un entier naturel. On pose $n\mathbb{Z}=\{nk \;|\; k \in \mathbb{Z}\}$.

    **1.** Démontrer que $n\mathbb{Z}$ est un sous-groupe de $(\mathbb{Z} \,;+)$.

    **2.** Que valent $1\mathbb{Z}$ et $0\mathbb{Z}$ ?

    **3.** Démontrer que $n\mathbb{Z} \subset m\mathbb{Z}$ si et seulement si $m$ divise $n$.

    **4.** Déterminer $4\mathbb{Z} \cap 6\mathbb{Z}$, puis $4\mathbb{Z} \cap 5\mathbb{Z}$. Que conjecture-t-on ?
  corrige: |
    **1.** On a $n\mathbb{Z} \subset \mathbb{Z}$, et $0=n \times 0 \in n\mathbb{Z}$. Soient $x=nk$ et $y=nk'$ dans $n\mathbb{Z}$ : 
    $$x-y = n(k-k') \in n\mathbb{Z}$$

    $$\boxed{n\mathbb{Z} \text{ est un sous-groupe de } (\mathbb{Z} \,;+).}$$

    **2.** On applique la définition avec $n=1$ puis $n=0$ : 
    $$\boxed{1\mathbb{Z}=\mathbb{Z} \qquad\text{et}\qquad 0\mathbb{Z}=\{0\}}$$
     Ce sont les deux sous-groupes « extrêmes » : le groupe tout entier et le sous-groupe trivial.

    **3.** *Sens direct.* Supposons $n\mathbb{Z} \subset m\mathbb{Z}$. Comme $n=n \times 1 \in n\mathbb{Z}$, on a $n \in m\mathbb{Z}$ : il existe $q \in \mathbb{Z}$ tel que $n=mq$, donc $m$ divise $n$.

    *Réciproque.* Supposons $n=mq$ avec $q \in \mathbb{Z}$. Tout élément de $n\mathbb{Z}$ s'écrit $nk=m(qk)$ avec $qk \in \mathbb{Z}$, donc appartient à $m\mathbb{Z}$. 
    $$\boxed{n\mathbb{Z} \subset m\mathbb{Z} \iff m \text{ divise } n}$$
     *Piège :* l'inclusion et la divisibilité vont en sens *inverse*. Plus $n$ est grand au sens de la divisibilité, plus $n\mathbb{Z}$ est petit.

    **4.** Un entier appartient à $4\mathbb{Z} \cap 6\mathbb{Z}$ s'il est à la fois multiple de $4$ et de $6$, donc multiple de leur plus petit commun multiple $12$ ; réciproquement tout multiple de $12$ convient. 
    $$\boxed{4\mathbb{Z} \cap 6\mathbb{Z} = 12\mathbb{Z} \qquad\text{et}\qquad 4\mathbb{Z} \cap 5\mathbb{Z} = 20\mathbb{Z}}$$

    $$\boxed{\text{On conjecture } n\mathbb{Z} \cap m\mathbb{Z} = \mathrm{ppcm}(n\,;m)\,\mathbb{Z}.}$$
- id: "ap-03-17"
  feuille: "f-ap-03"
  numero: 17
  partie: "Sous-groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soient $H$ et $K$ deux sous-groupes d'un groupe $(G \,;\cdot)$.

    **1.** Démontrer que $H \cap K$ est un sous-groupe de $G$.

    **2.** Démontrer que $2\mathbb{Z} \cup 3\mathbb{Z}$ n'est pas un sous-groupe de $(\mathbb{Z} \,;+)$.

    **3.** L'intersection d'une famille quelconque de sous-groupes de $G$ est-elle encore un sous-groupe ? Justifier.
  corrige: |
    **1.** On a $H \cap K \subset G$. De plus $e \in H$ et $e \in K$, donc $e \in H \cap K$, qui n'est pas vide. Soient enfin $x$ et $y$ dans $H \cap K$. Comme $H$ est un sous-groupe, $xy^{-1} \in H$ ; comme $K$ en est un, $xy^{-1} \in K$. Donc $xy^{-1} \in H \cap K$. 
    $$\boxed{H \cap K \text{ est un sous-groupe de } G.}$$

    **2.** On a $2 \in 2\mathbb{Z}$ et $3 \in 3\mathbb{Z}$, donc tous deux appartiennent à $2\mathbb{Z} \cup 3\mathbb{Z}$. Pourtant $2+3=5$ n'est ni pair ni multiple de $3$. 
    $$\boxed{2\mathbb{Z} \cup 3\mathbb{Z} \text{ n'est pas stable, donc n'est pas un sous-groupe de } (\mathbb{Z} \,;+).}$$

    **3.** Soit $(H_{i})_{i \in I}$ une famille de sous-groupes de $G$, et $H=\bigcap_{i \in I} H_{i}$. Chaque $H_{i}$ contient $e$, donc $H$ aussi. Soient $x$ et $y$ dans $H$ : pour tout $i \in I$, on a $x \in H_{i}$ et $y \in H_{i}$, donc $xy^{-1} \in H_{i}$. Ceci valant pour tout $i$, on obtient $xy^{-1} \in H$. 
    $$\boxed{\text{Oui : une intersection quelconque de sous-groupes est un sous-groupe.}}$$
     L'asymétrie avec la réunion mérite d'être notée : l'intersection se comporte bien, la réunion non. C'est l'objet de l'exercice 22.
- id: "ap-03-18"
  feuille: "f-ap-03"
  numero: 18
  partie: "Sous-groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes, "racines de l'unité"]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On pose $\mathbb{U}=\big\{z \in \mathbb{C} \;\big|\; |z|=1\big\}$ et, pour $n \in \mathbb{N}^{*}$, $\mathbb{U}_{n}=\big\{z \in \mathbb{C} \;\big|\; z^{n}=1\big\}$.

    **1.** Démontrer que $\mathbb{U}$ est un sous-groupe de $(\mathbb{C}^{*} \,;\times)$.

    **2.** Démontrer que $\mathbb{U}_{n}$ est un sous-groupe de $(\mathbb{C}^{*} \,;\times)$, puis qu'il est inclus dans $\mathbb{U}$.

    **3.** Démontrer que si $n$ divise $m$, alors $\mathbb{U}_{n} \subset \mathbb{U}_{m}$.

    **4.** Déterminer $\mathbb{U}_{4}$ en extension, et le comparer à l'exemple traité dans le cours.
  corrige: |
    **1.** Si $|z|=1$ alors $z \neq 0$, donc $\mathbb{U} \subset \mathbb{C}^{*}$. De plus $|1|=1$, donc $1 \in \mathbb{U}$. Soient $z$ et $w$ dans $\mathbb{U}$ : 
    $$\big|zw^{-1}\big| = \frac{|z|}{|w|} = \frac{1}{1} = 1$$

    $$\boxed{\mathbb{U} \text{ est un sous-groupe de } (\mathbb{C}^{*} \,;\times).}$$

    **2.** Si $z^{n}=1$ alors $z \neq 0$, donc $\mathbb{U}_{n} \subset \mathbb{C}^{*}$, et $1^{n}=1$ donne $1 \in \mathbb{U}_{n}$. Soient $z$ et $w$ dans $\mathbb{U}_{n}$ : 
    $$\big(zw^{-1}\big)^{n} = z^{n}\big(w^{n}\big)^{-1} = 1$$
     Enfin, si $z^{n}=1$, alors $|z|^{n}=1$ ; comme $|z|$ est un réel strictement positif, cela impose $|z|=1$. 
    $$\boxed{\mathbb{U}_{n} \text{ est un sous-groupe de } (\mathbb{C}^{*} \,;\times), \text{ et } \mathbb{U}_{n} \subset \mathbb{U}.}$$

    **3.** Supposons $m=nq$ avec $q \in \mathbb{N}^{*}$, et soit $z \in \mathbb{U}_{n}$. Alors : 
    $$z^{m} = z^{nq} = \big(z^{n}\big)^{q} = 1^{q} = 1$$

    $$\boxed{n \text{ divise } m \;\Longrightarrow\; \mathbb{U}_{n} \subset \mathbb{U}_{m}}$$

    **4.** On résout $z^{4}=1$. Les quatre solutions sont : 
    $$\boxed{\mathbb{U}_{4}=\{1 \,;\mathrm{i} \,;-1 \,;-\mathrm{i}\}}$$
     C'est exactement l'ensemble dont le cours dresse la table de Cayley. On retrouve donc, mais cette fois par une démonstration générale, que cette table est bien celle d'un groupe.
- id: "ap-03-19"
  feuille: "f-ap-03"
  numero: 19
  partie: "Sous-groupes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [commutativité et associativité, élément neutre, symétrique, groupes, groupes abéliens, sous-groupes]
  noeuds: [a-loi, a-monoide, a-groupe, a-sous-groupe]
  notions: [element-neutre, inversible, groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $(G \,;\cdot)$ un groupe de neutre $e$. Démontrer que les parties suivantes sont des sous-groupes de $G$.

    **1.** Le *centre* de $G$ : 
    $$C(G)=\big\{x \in G \;\big|\; \forall y \in G, \; xy=yx\big\}$$

    **2.** Le *conjugué* d'un sous-groupe $H$ par un élément $a$ de $G$ : 
    $$aHa^{-1}=\big\{aha^{-1} \;\big|\; h \in H\big\}$$

    **3.** L'ensemble des *éléments de torsion*, dans le cas où $G$ est de plus supposé abélien : 
    $$T(G)=\big\{x \in G \;\big|\; \exists n \in \mathbb{N}^{*}, \; x^{n}=e\big\}$$

    Pour la dernière question, on précisera où l'hypothèse de commutativité est utilisée.
  corrige: |
    **1.** *Le centre.* On a $C(G) \subset G$ par définition, et $e \in C(G)$ puisque $ey=ye=y$ pour tout $y$.

    Soient $x$ et $x'$ dans $C(G)$, et $y \in G$. De l'égalité $x'y=yx'$, on tire en multipliant à gauche et à droite par $x'^{-1}$ : 
    $$y\,x'^{-1} = x'^{-1}y$$
     On calcule alors, en utilisant successivement cette égalité puis celle vérifiée par $x$ : 
    $$\big(x\,x'^{-1}\big)y = x\big(x'^{-1}y\big) = x\big(y\,x'^{-1}\big) = (xy)\,x'^{-1} = (yx)\,x'^{-1} = y\big(x\,x'^{-1}\big)$$

    $$\boxed{C(G) \text{ est un sous-groupe de } G.}$$

    **2.** *Le conjugué.* On a $aHa^{-1} \subset G$, et $e=aea^{-1} \in aHa^{-1}$ puisque $e \in H$.

    Soient $aha^{-1}$ et $ah'a^{-1}$ deux éléments de $aHa^{-1}$. D'après l'exercice 12, $\big(ah'a^{-1}\big)^{-1}=a\,h'^{-1}a^{-1}$, d'où : 
    $$\big(aha^{-1}\big)\big(ah'a^{-1}\big)^{-1} = a\,h\,\underbrace{a^{-1}a}_{=\,e}\,h'^{-1}a^{-1} = a\big(h\,h'^{-1}\big)a^{-1}$$
     Comme $H$ est un sous-groupe, $h\,h'^{-1} \in H$, donc ce produit appartient à $aHa^{-1}$. 
    $$\boxed{aHa^{-1} \text{ est un sous-groupe de } G.}$$

    **3.** *Les éléments de torsion.* On a $T(G) \subset G$, et $e \in T(G)$ car $e^{1}=e$ avec $1 \in \mathbb{N}^{*}$.

    Soient $x$ et $y$ dans $T(G)$, avec $x^{n}=e$ et $y^{m}=e$ pour certains $n$ et $m$ de $\mathbb{N}^{*}$. Comme $G$ est abélien, on peut développer la puissance d'un produit : 
    $$\big(xy^{-1}\big)^{nm} = x^{nm}\big(y^{-1}\big)^{nm} = \big(x^{n}\big)^{m}\Big(\big(y^{m}\big)^{n}\Big)^{-1} = e$$
     et $nm \in \mathbb{N}^{*}$, donc $xy^{-1} \in T(G)$. 
    $$\boxed{T(G) \text{ est un sous-groupe de } G.}$$

    *Où sert la commutativité ?* Uniquement à écrire $\big(xy^{-1}\big)^{k}=x^{k}\big(y^{-1}\big)^{k}$. Dans un groupe quelconque, $(xy)^{2}=xyxy$ ne se simplifie pas en $x^{2}y^{2}$, et $T(G)$ peut alors ne pas être un sous-groupe.
- id: "ap-03-20"
  feuille: "f-ap-03"
  numero: 20
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux, Démonstration]
  mots_cles: [lois de composition interne, élément neutre, symétrique, groupes, groupes abéliens, sous-groupes]
  noeuds: [a-loi, a-monoide, a-groupe, a-sous-groupe]
  notions: [loi-composition, element-neutre, inversible, groupe, sous-groupe]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse.

    **1.** Toute loi de composition interne admet un élément neutre.

    **2.** Si une loi de composition interne admet un élément neutre, alors celui-ci est unique.

    **3.** Le symétrique d'un élément, lorsqu'il existe, est toujours unique.

    **4.** Dans un groupe, $(xy)^{-1}=x^{-1}y^{-1}$ pour tous $x$ et $y$.

    **5.** Un groupe n'est pas nécessairement abélien.

    **6.** L'ensemble $\mathbb{N}$ muni de l'addition n'est pas un groupe, car $3$ n'y admet pas d'opposé.

    **7.** Un sous-groupe contient nécessairement l'élément neutre du groupe.

    **8.** L'intersection de deux sous-groupes est un sous-groupe.

    **9.** La réunion de deux sous-groupes est un sous-groupe.

    **10.** Pour démontrer qu'une partie $H$ d'un groupe $G$ en est un sous-groupe, il suffit de vérifier que $H$ est non vide et que $xy^{-1} \in H$ pour tout couple $(x\,;y)$ de $H^{2}$.
  corrige: |
    **1.** $\boxed{\textbf{Fausse}}$ La soustraction sur $\mathbb{Z}$ n'admet pas de neutre : $x-e=x$ impose $e=0$, mais $0-x=-x$ n'est égal à $x$ que si $x=0$. Il faut un neutre *des deux côtés*.

    **2.** $\boxed{\textbf{Vraie}}$ C'est la proposition 1 du cours : si $e$ et $e'$ sont neutres, le calcul de $e \ast e'$ des deux façons donne $e=e'$.

    **3.** $\boxed{\textbf{Fausse}}$ L'unicité, énoncée par la proposition 2, exige que la loi soit *associative*. C'est cette hypothèse qui autorise le calcul de $y \ast x \ast y'$ sans parenthèses.

    **4.** $\boxed{\textbf{Fausse}}$ La proposition 3 donne $(xy)^{-1}=y^{-1}x^{-1}$. L'égalité annoncée n'est vraie que si $G$ est abélien (exercice 12, question 5).

    **5.** $\boxed{\textbf{Vraie}}$ La commutativité ne figure pas dans les axiomes **IANS**. Les exercices 8, 9 et 11 en fournissent trois contre-exemples.

    **6.** $\boxed{\textbf{Vraie}}$ Les axiomes **I**, **A** et **N** sont satisfaits ; c'est **S** qui échoue, et c'est précisément ce manque qui motive la construction de $\mathbb{Z}$.

    **7.** $\boxed{\textbf{Vraie}}$ C'est la première condition de la définition. La caractérisation de la proposition 5 la remplace par la non-vacuité, mais le neutre s'en déduit aussitôt.

    **8.** $\boxed{\textbf{Vraie}}$ C'est la question 1 de l'exercice 17.

    **9.** $\boxed{\textbf{Fausse}}$ L'ensemble $2\mathbb{Z} \cup 3\mathbb{Z}$ n'est pas stable, puisque $2+3=5$ n'y appartient pas. L'exercice 22 précise exactement quand la réunion est un sous-groupe.

    **10.** $\boxed{\textbf{Vraie}}$ C'est la caractérisation de la proposition 5, celle que l'on utilise en pratique.
- id: "ap-03-21"
  feuille: "f-ap-03"
  numero: 21
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [symétrique, groupes, groupe symétrique, sous-groupes]
  noeuds: [a-monoide, a-groupe, a-sous-groupe]
  notions: [inversible, groupe, groupe-symetrique, sous-groupe]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $(G \,;\cdot)$ un groupe. Pour tout $a \in G$, on définit la *translation à gauche* : 
    $$\begin{array}{r|ccl} \tau_{a} : & G & \longrightarrow & G \\ & x & \longmapsto & ax \end{array}$$
     On note enfin $\mathcal{S}(G)$ le groupe des bijections de $G$ dans $G$, muni de la composition.

    **1.** Démontrer que $\tau_{a}$ est bijective, de bijection réciproque $\tau_{a^{-1}}$.

    **2.** Démontrer que $\tau_{a} \circ \tau_{b} = \tau_{ab}$ pour tous $a$ et $b$ de $G$.

    **3.** En déduire que $T=\{\tau_{a} \;|\; a \in G\}$ est un sous-groupe de $\mathcal{S}(G)$.

    **4.** Démontrer que l'application $\Phi : a \mapsto \tau_{a}$, de $G$ dans $\mathcal{S}(G)$, est injective.

    **5.** Commenter : que peut-on dire de tout groupe au vu de ce résultat ?
  corrige: |
    **1.** Pour tout $x \in G$ : 
    $$\big(\tau_{a} \circ \tau_{a^{-1}}\big)(x) = a\big(a^{-1}x\big) = \big(aa^{-1}\big)x = x \qquad \big(\tau_{a^{-1}} \circ \tau_{a}\big)(x) = a^{-1}(ax) = x$$
     Les deux composées valent $\mathrm{Id}_{G}$, ce qui prouve d'après le chapitre 2 que $\tau_{a}$ est bijective. 
    $$\boxed{\tau_{a} \text{ est bijective, de bijection réciproque } \tau_{a^{-1}}.}$$

    **2.** Pour tout $x \in G$, l'associativité donne : 
    $$\big(\tau_{a} \circ \tau_{b}\big)(x) = a(bx) = (ab)x = \tau_{ab}(x) \qquad\text{donc}\qquad \boxed{\tau_{a} \circ \tau_{b} = \tau_{ab}}$$

    **3.** D'après la question 1, chaque $\tau_{a}$ est une bijection de $G$ : on a bien $T \subset \mathcal{S}(G)$. De plus $\tau_{e}=\mathrm{Id}_{G}$ appartient à $T$, qui n'est donc pas vide. Soient enfin $\tau_{a}$ et $\tau_{b}$ dans $T$. La question 1 donne $\tau_{b}^{-1}=\tau_{b^{-1}}$, puis la question 2 : 
    $$\tau_{a} \circ \tau_{b}^{-1} = \tau_{a} \circ \tau_{b^{-1}} = \tau_{ab^{-1}} \in T$$

    $$\boxed{T \text{ est un sous-groupe de } \mathcal{S}(G).}$$

    **4.** Soient $a$ et $b$ dans $G$ tels que $\tau_{a}=\tau_{b}$. Ces deux applications prenant la même valeur en tout point, évaluons-les en $e$ : 
    $$a = ae = \tau_{a}(e) = \tau_{b}(e) = be = b$$

    $$\boxed{\Phi \text{ est injective.}}$$

    **5.** L'application $\Phi$ est injective et son image est exactement $T$ : elle réalise donc une bijection de $G$ sur $T$. De plus, la question 2 montre qu'elle transporte la loi de $G$ sur la composition : $\Phi(ab)=\Phi(a) \circ \Phi(b)$. 
    $$\boxed{\begin{array}{l} \text{Tout groupe est «\,le même\,» qu'un sous-groupe d'un groupe de bijections.} \\[1mm] \text{C'est le \emph{théorème de Cayley}.} \end{array}}$$
     Autrement dit, l'étude des groupes abstraits ne dit rien de plus que celle des groupes de bijections — ce qui justifie *a posteriori* l'importance du groupe symétrique rencontré à l'exercice 11.
