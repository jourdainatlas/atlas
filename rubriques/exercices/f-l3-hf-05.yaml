  page_corrige: 8
  enonce: |
    **Une inégalité de Hausdorff-Young.** Soit $f \in L^{2}(\mathbb{T})$. Pour $x \in \mathbb{R}$, on note $f_{x}$ la fonction $t \mapsto f(t + x)$, et l'on pose $F(x) = \mathop{\displaystyle \int_{0}^{2\pi}} f(t + x) \overline{f(t)} \, \mathrm{d} t$.

    **1.** Calculer les coefficients de Fourier de $f_{x}$ en fonction de ceux de $f$.

    **2.** Prouver que $F(x) = 2\pi \mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |c_{n}(f)|^{2} \mathrm{e}^{\mathrm{i} n x}$. Quels sont les coefficients de Fourier de $F$ ?

    **3.** Démontrer que $\mathop{\displaystyle \int_{0}^{2\pi}} |f(x + t) f(t)|^{2/3} \, \mathrm{d} t \leq \mathop{\displaystyle \int_{0}^{2\pi}} |f(t)|^{4/3} \, \mathrm{d} t$, à l'aide de l'inégalité de Cauchy-Schwarz.

    **4.** En déduire la majoration 
    $$|F(x)|^{2} \leq \Big( \int_{0}^{2\pi} |f(t)|^{4/3} \, \mathrm{d} t \Big) \Big( \int_{0}^{2\pi} |f(t + x) f(t)|^{4/3} \, \mathrm{d} t \Big) .$$

    **5.** Conclure que $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |c_{n}(f)|^{4} \leq \Big( \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} |f(t)|^{4/3} \, \mathrm{d} t \Big)^{3}$.
  corrige: |
    $\triangleright$ *1.* Par le changement de variable $s = t + x$ et l'invariance de l'intégrale sur une période (cours, prop. 1), 
    $$c_{n}(f_{x}) = \frac{1}{2\pi} \int_{0}^{2\pi} f(t + x) \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \mathrm{e}^{\mathrm{i} n x} \frac{1}{2\pi} \int_{0}^{2\pi} f(s) \mathrm{e}^{-\mathrm{i} n s} \, \mathrm{d} s = \boxed{\mathrm{e}^{\mathrm{i} n x} c_{n}(f) .}$$

    $\triangleright$ *2.* On a $F(x) = 2\pi \langle f_{x}, f \rangle$. La formule de Parseval polarisée, $\langle u, v \rangle = \mathop{\displaystyle \sum_{n}} c_{n}(u)\overline{c_{n}(v)}$, donne 
    $$\boxed{F(x) = 2\pi \sum_{n \in \mathbb{Z}} \mathrm{e}^{\mathrm{i} n x} |c_{n}(f)|^{2} .}$$
     Cette série converge normalement, puisque $\mathop{\displaystyle \sum} |c_{n}(f)|^{2} < +\infty$ : $F$ est continue, et l'intégration terme à terme donne $c_{n}(F) = 2\pi |c_{n}(f)|^{2}$.

    $\triangleright$ *3.* Sur l'intervalle borné $[0, 2\pi]$, $L^{2} \subset L^{4/3}$, donc $A = \mathop{\displaystyle \int_{0}^{2\pi}} |f|^{4/3}$ est fini. Par Cauchy-Schwarz, puis par périodicité, 
    $$\int_{0}^{2\pi} |f(x + t)|^{2/3} |f(t)|^{2/3} \, \mathrm{d} t \leq \Big( \int_{0}^{2\pi} |f(x + t)|^{4/3} \, \mathrm{d} t \Big)^{1/2} \Big( \int_{0}^{2\pi} |f(t)|^{4/3} \, \mathrm{d} t \Big)^{1/2} = A .$$

    $\triangleright$ *4.* On écrit $|f(t + x)f(t)| = |f(t + x)f(t)|^{1/3} \cdot |f(t + x)f(t)|^{2/3}$ et l'on applique Cauchy-Schwarz : 
    $$|F(x)|^{2} \leq \Big( \int_{0}^{2\pi} |f(t + x)f(t)| \, \mathrm{d} t \Big)^{2} \leq \Big( \int_{0}^{2\pi} |f(t + x)f(t)|^{2/3} \Big) \Big( \int_{0}^{2\pi} |f(t + x)f(t)|^{4/3} \Big) ,$$
     et la question 3 majore le premier facteur par $A$.

    $\triangleright$ *5.* Par Parseval pour $F$ et la question 2, $\dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} |F|^{2} = \mathop{\displaystyle \sum_{n}} |c_{n}(F)|^{2} = 4\pi^{2} \mathop{\displaystyle \sum_{n}} |c_{n}(f)|^{4}$. D'autre part, en intégrant la question 4 en $x$ et par Fubini-Tonelli, 
    $$\int_{0}^{2\pi} |F(x)|^{2} \, \mathrm{d} x \leq A \int_{0}^{2\pi} |f(t)|^{4/3} \Big( \int_{0}^{2\pi} |f(t + x)|^{4/3} \, \mathrm{d} x \Big) \mathrm{d} t = A^{3} .$$
     D'où $4\pi^{2} \mathop{\displaystyle \sum} |c_{n}(f)|^{4} \leq \dfrac{A^{3}}{2\pi}$, c'est-à-dire 
    $$\boxed{\sum_{n \in \mathbb{Z}} |c_{n}(f)|^{4} \leq \Big( \frac{A}{2\pi} \Big)^{3} = \Big( \frac{1}{2\pi} \int_{0}^{2\pi} |f(t)|^{4/3} \, \mathrm{d} t \Big)^{3} .}$$
     En notant $\lVert \cdot \rVert_{p}$ les normes du cours, cela s'écrit $\big(\mathop{\displaystyle \sum} |c_{n}(f)|^{4}\big)^{1/4} \leq \lVert f \rVert_{4/3}$ : c'est le cas $p = 4/3$ de l'inégalité de Hausdorff-Young, qui interpole entre Parseval ($p = 2$) et la majoration $|c_{n}(f)| \leq \lVert f \rVert_{1}$ ($p = 1$).
- id: "l3-hf-05-13"
  feuille: "f-l3-hf-05"
  numero: 13
  partie: "Densité, bases hilbertiennes"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [densité]
  noeuds: [fo-densite, f-bases-hilbertiennes]
  notions: [base-hilbertienne, fonction-periodique]
  source: "Sorbonne 3M210, TD 3, exercices 4 et 5"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Une démonstration directe de la complétude des $e_{n}$.** On veut montrer, sans utiliser le théorème de Weierstrass, que si $f \in L^{2}(\mathbb{T})$ vérifie 
    $$c_{n}(f) = 0 \qquad \text{pour tout } n \in \mathbb{Z} , \tag{$*$}$$
     alors $f = 0$ presque partout. On rappelle que l'intégrale d'une fonction $2\pi$-périodique sur une période ne dépend pas de la période choisie (cours, prop. 1).

    **1.** On suppose $f$ réelle, vérifiant $(*)$, et l'on suppose qu'il existe $h \in ]0, \pi[$ et $\alpha > 0$ tels que $f \geq \alpha$ presque partout sur $[\pi - h, \pi + h]$. Pour $n \in \mathbb{N}$, on pose $P_{n}(t) = \big(1 + \cos(t - \pi) - \cos h\big)^{n}$.

    **(a)** Montrer que $\langle f, P_{n} \rangle = 0$ pour tout $n$.

    **(b)** Étudier, suivant $t \in [0, 2\pi]$, la limite de $P_{n}(t)$, et montrer que $\mathop{\displaystyle \int_{[0, 2\pi] \setminus [\pi - h, \pi + h]}} f P_{n} \to 0$.

    **(c)** Montrer que $\mathop{\displaystyle \int_{\pi - h}^{\pi + h}} f P_{n} \to +\infty$, et conclure à une contradiction.

    **2.** Montrer que toute fonction continue réelle vérifiant $(*)$ est nulle. On pourra se ramener par translation à la situation de la question 1.

    **3.** Montrer que toute fonction continue complexe vérifiant $(*)$ est nulle, en remarquant que $\overline{f}$ vérifie aussi $(*)$.

    **4.** Soit $f \in L^{2}(\mathbb{T})$ avec $c_{0}(f) = 0$, et $F(x) = \mathop{\displaystyle \int_{0}^{x}} f(t) \, \mathrm{d} t$. Montrer que $F$ est continue et $2\pi$-périodique, et que $c_{n}(F) = -\dfrac{\mathrm{i}}{n} c_{n}(f)$ pour $n \neq 0$.

    **5.** En déduire que si $f$ vérifie $(*)$, alors $F$ est nulle et $\mathop{\displaystyle \int_{x}^{y}} f = 0$ pour tous $x < y$.

    **6.** Conclure.
  corrige: |
    $\triangleright$ *1.* (a) En développant par la formule de Moivre, $P_{n}$ est un polynôme trigonométrique, combinaison des $e_{k}$, $|k| \leq n$. Par $(*)$ et linéarité, $\langle f, P_{n} \rangle = 0$ ($P_{n}$ est réel).

    (b) Pour $t \in [0, 2\pi]$, $\cos(t - \pi) \in [-1, 1]$, et $q(t) = 1 + \cos(t - \pi) - \cos h$ vérifie :

    • si $|t - \pi| > h$, $\cos(t - \pi) < \cos h$, donc $q(t) \in [-\cos h, 1[ \, \subset \, ]-1, 1[$, et $P_{n}(t) = q(t)^{n} \to 0$ ;

    • si $|t - \pi| < h$, $q(t) > 1$ et $P_{n}(t) \to +\infty$ ; si $|t - \pi| = h$, $P_{n}(t) = 1$.

    Hors de $[\pi - h, \pi + h]$, $|fP_{n}| \leq |f|$, intégrable ($L^{2} \subset L^{1}$ sur un intervalle borné), et $fP_{n} \to 0$ : par convergence dominée, $\mathop{\displaystyle \int_{[0, 2\pi] \setminus [\pi - h, \pi + h]}} fP_{n} \to 0$.

    (c) Sur $[\pi - h, \pi + h]$, $P_{n} \geq 0$ et $f \geq \alpha$. Sur l'intervalle plus petit $[\pi - h/2, \pi + h/2]$, $P_{n} \geq r^{n}$ avec $r = 1 + \cos(h/2) - \cos h > 1$. Donc 
    $$\int_{\pi - h}^{\pi + h} fP_{n} \geq \alpha \, h \, r^{n} \longrightarrow +\infty .$$
     Avec (b), $\mathop{\displaystyle \int_{0}^{2\pi}} fP_{n} \to +\infty$, ce qui contredit (a) : la situation décrite est impossible.

    1.5em

    ![Figure](documents/figures/e003ec1804047f54.svg)

    Pour $h = \pi/3$, les courbes représentent $P_{n}(t) / P_{n}(\pi)$ : en grandissant, $n$ concentre toute la masse de $P_{n}$ dans la bande violette où $f \geq \alpha$, alors que $P_{n}$ tend vers $0$ hors de la bande.

    $\triangleright$ *2.* Soit $f$ continue, réelle, non nulle, vérifiant $(*)$. Quitte à remplacer $f$ par $-f$, il existe $t_{0}$ tel que $f(t_{0}) > 0$. La fonction $g = f(\cdot + t_{0} - \pi)$ vérifie encore $(*)$, puisque $c_{n}(g) = \mathrm{e}^{\mathrm{i} n(t_{0} - \pi)} c_{n}(f)$ (exercice 12, question 1), et $g(\pi) = f(t_{0}) > 0$. Par continuité, $g \geq \alpha = g(\pi)/2$ sur un intervalle $[\pi - h, \pi + h]$, ce qui est exclu par la question 1. Donc $f = 0$.

    $\triangleright$ *3.* On a $c_{n}(\overline{f}) = \overline{c_{-n}(f)}$ ; si $f$ vérifie $(*)$, $\overline{f}$ aussi, donc $\operatorname{Re} f = \dfrac{f + \overline{f}}{2}$ et $\operatorname{Im} f = \dfrac{f - \overline{f}}{2\mathrm{i}}$ aussi. Ce sont des fonctions continues réelles : elles sont nulles, et $f = 0$.

    $\triangleright$ *4.* La fonction $f$ est intégrable sur $[0, 2\pi]$, donc $F$ est continue ; et par la proposition 1, 
    $$F(x + 2\pi) - F(x) = \int_{x}^{x + 2\pi} f = 2\pi c_{0}(f) = 0 .$$
     Pour $n \neq 0$, une intégration par parties (valable pour $F$ absolument continue, de dérivée $f$ presque partout), où le terme de bord est nul par périodicité, donne 
    $$c_{n}(F) = \frac{1}{2\pi} \Big[ F(t) \frac{\mathrm{e}^{-\mathrm{i} n t}}{-\mathrm{i} n} \Big]_{0}^{2\pi} + \frac{1}{2\pi\mathrm{i} n} \int_{0}^{2\pi} f(t) \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \frac{c_{n}(f)}{\mathrm{i} n} = -\frac{\mathrm{i}}{n} c_{n}(f) .$$

    $\triangleright$ *5.* Si $f$ vérifie $(*)$, alors $c_{0}(f) = 0$ et $c_{n}(F) = 0$ pour $n \neq 0$. La fonction continue $F - c_{0}(F)$ vérifie $(*)$, donc est nulle par la question 3 : $F$ est constante, égale à $F(0) = 0$. Ainsi $\mathop{\displaystyle \int_{x}^{y}} f = F(y) - F(x) = 0$ pour tous $x < y$.

    $\triangleright$ *6.* La fonction $f$ est donc orthogonale (dans $L^{2}([0, 2\pi])$) aux indicatrices d'intervalles, donc aux fonctions en escalier, qui sont denses dans $L^{2}$ (cours d'Intégration). Par le critère de densité, $f = 0$ presque partout, et $(e_{n})$ est une base hilbertienne par la proposition 1 du chapitre 3.

    *Remarque.* Cette démonstration n'utilise que le théorème de convergence dominée et la densité des fonctions en escalier. Celle du cours passe par le théorème de Weierstrass trigonométrique, prouvé par un autre noyau de la même famille, $(1 + \cos t)^{n}$ convenablement normalisé : dans les deux cas, on concentre un polynôme trigonométrique positif autour d'un point.
