  enonce: |
    **Inégalité de Wirtinger.**

    **1.** Soit $f : \mathbb{R} \to \mathbb{C}$ de classe $\mathcal{C}^{1}$, $2\pi$-périodique, telle que $\mathop{\displaystyle \int_{0}^{2\pi}} f = 0$. Montrer que 
    $$\int_{0}^{2\pi} |f|^{2} \leq \int_{0}^{2\pi} |f'|^{2} ,$$
     et caractériser les cas d'égalité.

    **2.** Soit $f : \mathbb{R} \to \mathbb{C}$ de classe $\mathcal{C}^{1}$ et $1$-périodique. Montrer que 
    $$0 \leq \int_{0}^{1} |f(t)|^{2} \, \mathrm{d} t - \Big| \int_{0}^{1} f(t) \, \mathrm{d} t \Big|^{2} \leq \frac{1}{4\pi^{2}} \int_{0}^{1} |f'(t)|^{2} \, \mathrm{d} t .$$

    **3.** Soit $u \in \mathcal{C}^{1}([0, \pi], \mathbb{R})$ telle que $u(0) = u(\pi) = 0$. En considérant le prolongement impair et $2\pi$-périodique de $u$, montrer que $\mathop{\displaystyle \int_{0}^{\pi}} u^{2} \leq \mathop{\displaystyle \int_{0}^{\pi}} u'^{2}$, avec égalité si et seulement si $u(x) = \lambda \sin x$.
  corrige: |
    $\triangleright$ *1.* D'après l'exercice 4, $c_{n}(f') = \mathrm{i} n \, c_{n}(f)$, et $c_{0}(f) = 0$ par hypothèse. Par Parseval pour $f$ et pour $f'$, toutes deux continues, 
    $$\frac{1}{2\pi} \int_{0}^{2\pi} |f|^{2} = \sum_{n \neq 0} |c_{n}(f)|^{2} \leq \sum_{n \neq 0} n^{2} |c_{n}(f)|^{2} = \frac{1}{2\pi} \int_{0}^{2\pi} |f'|^{2} .$$
     L'égalité a lieu si et seulement si $(n^{2} - 1)|c_{n}(f)|^{2} = 0$ pour tout $n \neq 0$, c'est-à-dire si $c_{n}(f) = 0$ pour $|n| \geq 2$ : $f(t) = a\mathrm{e}^{\mathrm{i} t} + b\mathrm{e}^{-\mathrm{i} t}$, soit $f = \alpha\cos t + \beta\sin t$ dans le cas réel.

    $\triangleright$ *2.* On pose $m = \mathop{\displaystyle \int_{0}^{1}} f$ et $g(s) = f\big(\dfrac{s}{2\pi}\big) - m$, fonction de classe $\mathcal{C}^{1}$, $2\pi$-périodique et de moyenne nulle. Par le changement de variable $s = 2\pi t$, 
    $$\int_{0}^{2\pi} |g|^{2} = 2\pi \int_{0}^{1} |f - m|^{2} , \qquad \int_{0}^{2\pi} |g'|^{2} = \frac{1}{4\pi^{2}} \cdot 2\pi \int_{0}^{1} |f'|^{2} .$$
     En développant, $\mathop{\displaystyle \int_{0}^{1}} |f - m|^{2} = \mathop{\displaystyle \int_{0}^{1}} |f|^{2} - 2\operatorname{Re}\big(\overline{m}\mathop{\displaystyle \int_{0}^{1}} f\big) + |m|^{2} = \mathop{\displaystyle \int_{0}^{1}} |f|^{2} - |m|^{2}$, quantité positive. La question 1 appliquée à $g$ donne alors 
    $$\boxed{0 \leq \int_{0}^{1} |f|^{2} - \Big| \int_{0}^{1} f \Big|^{2} \leq \frac{1}{4\pi^{2}} \int_{0}^{1} |f'|^{2} .}$$
     Le terme du milieu est la variance de $f$ : l'inégalité dit qu'une fonction périodique qui varie lentement s'écarte peu de sa moyenne.

    $\triangleright$ *3.* Le prolongement impair $\tilde{u}$ de $u$ à $[-\pi, \pi]$, puis par $2\pi$-périodicité, est continu, car $u(0) = 0$ et $\tilde{u}(\pi) = u(\pi) = 0 = \tilde{u}(-\pi)$. Il est de classe $\mathcal{C}^{1}$ : sa dérivée est le prolongement pair de $u'$, qui se recolle continûment en $0$ et en $\pm\pi$. Il est de moyenne nulle, étant impair. La question 1 donne 
    $$2\int_{0}^{\pi} u^{2} = \int_{-\pi}^{\pi} \tilde{u}^{2} \leq \int_{-\pi}^{\pi} \tilde{u}'^{2} = 2\int_{0}^{\pi} u'^{2} .$$
     L'égalité impose $\tilde{u} = \alpha\cos + \beta\sin$, et l'imparité donne $\alpha = 0$ : égalité si et seulement si $u = \lambda\sin$. Le nombre $1$ est la plus petite valeur propre de $-u'' = \lambda u$ avec $u(0) = u(\pi) = 0$, la fondamentale de la corde vibrante.
- id: "l3-hf-05-12"
  feuille: "f-l3-hf-05"
