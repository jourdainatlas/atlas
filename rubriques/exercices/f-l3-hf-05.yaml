  notions: [base-hilbertienne]
  source: "Dauphine, Analyse 3, TD 5 (2017-2018), exercice 8 = TD 6 (2008-2009), exercice 8"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les coefficients de Fourier de $f(x) = \cos x$ et de $g(x) = \sin^{3} x$, et écrire la formule de Parseval pour ces deux fonctions. En déduire $\mathop{\displaystyle \int_{0}^{2\pi}} \sin^{6} x \, \mathrm{d} x$.
  corrige: |
    On a $\cos x = \dfrac{1}{2}(e_{1} + e_{-1})$ : $c_{\pm 1}(f) = \dfrac{1}{2}$, les autres coefficients sont nuls (unicité des coefficients, cours, prop. 8). Parseval s'écrit $\dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} \cos^{2} = \dfrac{1}{4} + \dfrac{1}{4} = \dfrac{1}{2}$.

    Par la formule d'Euler ou la linéarisation $\sin^{3} x = \dfrac{3 \sin x - \sin 3x}{4}$, et $\sin(kx) = \dfrac{1}{2\mathrm{i}}(e_{k} - e_{-k})$, 
    $$\boxed{c_{1}(g) = \frac{3}{8\mathrm{i}} , \quad c_{-1}(g) = -\frac{3}{8\mathrm{i}} , \quad c_{3}(g) = -\frac{1}{8\mathrm{i}} , \quad c_{-3}(g) = \frac{1}{8\mathrm{i}} ,}$$
     les autres étant nuls. La formule de Parseval donne $\dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} \sin^{6} x \, \mathrm{d} x = 2 \Big( \dfrac{9}{64} + \dfrac{1}{64} \Big) = \dfrac{5}{16}$, d'où 
    $$\boxed{\int_{0}^{2\pi} \sin^{6} x \, \mathrm{d} x = \frac{5\pi}{8} .}$$
- id: "l3-hf-05-03"
  feuille: "f-l3-hf-05"
