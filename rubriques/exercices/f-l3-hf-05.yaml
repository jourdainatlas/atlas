  enonce: |
    Soit $\alpha \in \mathbb{C}$ tel que $|\alpha| \neq 1$. Calculer, pour $k \in \mathbb{Z}$, 
    $$I_{k} = \int_{0}^{2\pi} \frac{\mathrm{e}^{-\mathrm{i} k x}}{\alpha - \mathrm{e}^{\mathrm{i} x}} \, \mathrm{d} x .$$
     On écrira $\dfrac{1}{\alpha - \mathrm{e}^{\mathrm{i} x}}$ comme la somme d'une série géométrique, en distinguant les cas $|\alpha| > 1$ et $|\alpha| < 1$.
  corrige: |
    $\triangleright$ *Cas $|\alpha| > 1$.* On écrit $\dfrac{1}{\alpha - \mathrm{e}^{\mathrm{i} x}} = \dfrac{1}{\alpha} \cdot \dfrac{1}{1 - \mathrm{e}^{\mathrm{i} x}/\alpha} = \mathop{\displaystyle \sum_{j \geq 0}} \dfrac{\mathrm{e}^{\mathrm{i} j x}}{\alpha^{j+1}}$, série normalement convergente sur $[0, 2\pi]$ puisque $|\mathrm{e}^{\mathrm{i} x}/\alpha| = 1/|\alpha| < 1$. On intègre terme à terme, avec $\mathop{\displaystyle \int_{0}^{2\pi}} \mathrm{e}^{\mathrm{i} (j - k)x} \, \mathrm{d} x = 2\pi\delta_{jk}$ : 
    $$\boxed{I_{k} = \frac{2\pi}{\alpha^{k+1}} \ \text{si } k \geq 0 , \qquad I_{k} = 0 \ \text{si } k < 0 .}$$

    $\triangleright$ *Cas $|\alpha| < 1$.* On écrit $\dfrac{1}{\alpha - \mathrm{e}^{\mathrm{i} x}} = -\dfrac{\mathrm{e}^{-\mathrm{i} x}}{1 - \alpha\mathrm{e}^{-\mathrm{i} x}} = -\mathop{\displaystyle \sum_{j \geq 0}} \alpha^{j} \mathrm{e}^{-\mathrm{i} (j + 1)x}$, normalement convergente. Seul le terme $j + 1 = -k$ contribue : 
    $$\boxed{I_{k} = -2\pi\alpha^{-k-1} \ \text{si } k \leq -1 , \qquad I_{k} = 0 \ \text{si } k \geq 0 .}$$
     Autrement dit, $\dfrac{1}{2\pi} I_{k}$ est le coefficient $c_{k}$ de $x \mapsto \dfrac{1}{\alpha - \mathrm{e}^{\mathrm{i} x}}$ : son spectre est porté par les $k \geq 0$ si $|\alpha| > 1$, par les $k < 0$ si $|\alpha| < 1$. Les valeurs ont été vérifiées numériquement pour $\alpha = 0{,}5$ et $\alpha = 2$.
