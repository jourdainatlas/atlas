  source: "Bordeaux 2015-2016, devoir maison 1 (DS 2014-2015), exercice 3"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **Translatés denses.** Soit $f \in L^{2}(\mathbb{T})$. Pour $h \in \mathbb{R}$, on note $f_{h}(x) = f(x + h)$, et $V$ le sous-espace de $L^{2}(\mathbb{T})$ engendré par les $f_{h}$, $h \in \mathbb{R}$.

    **1.** Calculer les coefficients de Fourier de $f_{h}$.

    **2.** Soit $g \in L^{2}(\mathbb{T})$. Montrer que $\varphi_{g} : h \mapsto \langle f_{h}, g \rangle$ est une fonction continue et $2\pi$-périodique, et déterminer ses coefficients de Fourier.

    **3.** En déduire que si $g \in V^{\perp}$, alors $c_{n}(f) \overline{c_{n}(g)} = 0$ pour tout $n$.

    **4.** Montrer que $V$ est dense dans $L^{2}(\mathbb{T})$ si et seulement si $c_{n}(f) \neq 0$ pour tout $n \in \mathbb{Z}$.
  corrige: |
    $\triangleright$ *1.* D'après l'exercice 12, question 1, $c_{n}(f_{h}) = \mathrm{e}^{\mathrm{i} n h} c_{n}(f)$.

    $\triangleright$ *2.* Par Parseval polarisé, 
    $$\varphi_{g}(h) = \sum_{n} \mathrm{e}^{\mathrm{i} n h} c_{n}(f) \overline{c_{n}(g)} .$$
     Par Cauchy-Schwarz, $\mathop{\displaystyle \sum_{n}} |c_{n}(f)| |c_{n}(g)| \leq \lVert f \rVert_{2} \lVert g \rVert_{2}$ : la série converge normalement, $\varphi_{g}$ est continue et $2\pi$-périodique, et l'intégration terme à terme donne $c_{n}(\varphi_{g}) = c_{n}(f)\overline{c_{n}(g)}$.

    $\triangleright$ *3.* Si $g \in V^{\perp}$, alors $\varphi_{g}(h) = \langle f_{h}, g \rangle = 0$ pour tout $h$ ; tous les coefficients de $\varphi_{g}$ sont nuls : $c_{n}(f)\overline{c_{n}(g)} = 0$ pour tout $n$.

    $\triangleright$ *4.* Supposons $c_{n}(f) \neq 0$ pour tout $n$. Si $g \in V^{\perp}$, la question 3 donne $c_{n}(g) = 0$ pour tout $n$, donc $g = 0$ : $V^{\perp} = \{0\}$ et $V$ est dense (chapitre 2, prop. 7).

    Réciproquement, supposons $c_{m}(f) = 0$ pour un $m$. Alors $\langle f_{h}, e_{m} \rangle = c_{m}(f_{h}) = \mathrm{e}^{\mathrm{i} m h} c_{m}(f) = 0$ pour tout $h$ : $e_{m} \in V^{\perp}$, qui n'est pas nul, et $V$ n'est pas dense.

    Ainsi les translatés de $f$ engendrent un sous-espace dense si et seulement si aucun coefficient de $f$ n'est nul. Le chapitre 8 établira l'analogue sur $\mathbb{R}$ (théorème de Wiener dans $L^{2}$) : la condition devient « $\mathcal{F} f \neq 0$ presque partout ».
