  noeuds: [fo-coefficients, fo-parseval]
  notions: [base-hilbertienne]
  source: "Bordeaux, Espaces de Hilbert et analyse de Fourier 2013-2014, feuille 4, exercice 2"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les suites suivantes sont-elles la suite des coefficients de Fourier d'une fonction de $L^{2}(\mathbb{T})$ ? 
    $$(1) \ \Big( \frac{1}{1 + n^{2}} \Big)_{n \in \mathbb{Z}} \qquad (2) \ \Big( \frac{1}{\sqrt{1 + |n|}} \Big)_{n \in \mathbb{Z}} \qquad (3) \ \Big( \frac{1}{1 + |n|} \Big)_{n \in \mathbb{Z}}$$
  corrige: |
    D'après le théorème de Riesz-Fischer (cours, th. 3), une suite $(u_{n})_{n \in \mathbb{Z}}$ est la suite des coefficients d'une fonction de $L^{2}(\mathbb{T})$ si et seulement si $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |u_{n}|^{2} < +\infty$.

    $\triangleright$ *(1)* $\dfrac{1}{(1 + n^{2})^{2}} \leq \dfrac{1}{n^{4}}$ : oui. La fonction correspondante est même continue, puisque la série $\mathop{\displaystyle \sum} |u_{n}|$ converge (exercice 5).

    $\triangleright$ *(2)* $\dfrac{1}{1 + |n|}$ est le terme général d'une série divergente : non.

    $\triangleright$ *(3)* $\dfrac{1}{(1 + |n|)^{2}}$ est sommable : oui, bien que $\mathop{\displaystyle \sum} |u_{n}|$ diverge. La fonction correspondante est dans $L^{2}$, mais rien ne dit qu'elle soit continue ; on peut d'ailleurs montrer qu'elle ne l'est pas : elle n'est pas bornée au voisinage de $0$.
- id: "l3-hf-05-02"
  feuille: "f-l3-hf-05"
