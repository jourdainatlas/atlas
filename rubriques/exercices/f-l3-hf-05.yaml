  enonce: |
    **Noyau de Poisson.** Soit $0 < \theta < 1$ et $f(x) = \dfrac{1}{1 - 2\theta\cos x + \theta^{2}}$.

    **1.** Justifier que $f$ est continue, paire et $2\pi$-périodique, et qu'on peut écrire, au sens de $L^{2}(\mathbb{T})$, $f = \dfrac{a_{0}}{2} + \mathop{\displaystyle \sum_{n \geq 1}} a_{n} \cos(nx)$, avec $a_{n} = \dfrac{1}{\pi} \mathop{\displaystyle \int_{-\pi}^{\pi}} f(x) \cos(nx) \, \mathrm{d} x$. Montrer, à partir de l'identité $(1 - 2\theta\cos x + \theta^{2}) f(x) = 1$, que 
    $$\theta a_{n+1} - (1 + \theta^{2}) a_{n} + \theta a_{n-1} = 0 \qquad (n \geq 1) .$$

    **2.** En déduire qu'il existe des réels $\alpha$, $\beta$ tels que $a_{n} = \alpha\theta^{n} + \beta\theta^{-n}$ pour tout $n \in \mathbb{N}$, puis que $\beta = 0$. Calculer $a_{0}$.

    **3.** En déduire que, pour tout $x \in \mathbb{R}$, 
    $$\frac{1 - \theta^{2}}{1 - 2\theta\cos x + \theta^{2}} = 1 + 2\sum_{n \geq 1} \theta^{n} \cos(nx) .$$

    **4.** Retrouver ce résultat directement, en sommant une série géométrique.
  corrige: |
    $\triangleright$ *1.* Comme $1 - 2\theta\cos x + \theta^{2} \geq (1 - \theta)^{2} > 0$, $f$ est continue (et même $\mathcal{C}^{\infty}$), paire et $2\pi$-périodique. Elle est dans $L^{2}(\mathbb{T})$, et sa série de Fourier, sous forme réelle, n'a que des cosinus, avec $a_{n} = 2c_{n}(f)$.

    On multiplie l'identité 
    $$(1 + \theta^{2}) f(x) - 2\theta\cos x \, f(x) = 1$$
     par $\cos(nx)$, on utilise $2\cos x\cos nx = \cos(n + 1)x + \cos(n - 1)x$, et l'on intègre sur $[-\pi, \pi]$ en divisant par $\pi$ : 
    $$(1 + \theta^{2}) a_{n} - \theta(a_{n+1} + a_{n-1}) = \frac{1}{\pi} \int_{-\pi}^{\pi} \cos(nx) \, \mathrm{d} x = \begin{cases} 0 & (n \geq 1) , \\ 2 & (n = 0) , \end{cases}$$
     avec $a_{-1} = a_{1}$ par parité de $\cos$. Pour $n \geq 1$, c'est la relation annoncée.

    $\triangleright$ *2.* C'est une récurrence linéaire d'ordre $2$, d'équation caractéristique $\theta r^{2} - (1 + \theta^{2}) r + \theta = 0$, de racines $\theta$ et $1/\theta$ : il existe $\alpha$, $\beta$ tels que $a_{n} = \alpha\theta^{n} + \beta\theta^{-n}$ pour $n \geq 0$. Comme $a_{n} \to 0$ (cours, prop. 8) et $\theta^{-n} \to +\infty$, on a $\beta = 0$, donc $a_{n} = a_{0}\theta^{n}$. La relation pour $n = 0$, avec $a_{1} = \theta a_{0}$, donne $(1 + \theta^{2}) a_{0} - 2\theta^{2} a_{0} = 2$ : 
    $$\boxed{a_{0} = \frac{2}{1 - \theta^{2}} , \qquad a_{n} = \frac{2\theta^{n}}{1 - \theta^{2}} .}$$

    $\triangleright$ *3.* La série $\mathop{\displaystyle \sum} a_{n}$ converge, donc l'exercice 5 s'applique : $f(x) = \dfrac{1}{1 - \theta^{2}}\big(1 + 2\mathop{\displaystyle \sum_{n \geq 1}} \theta^{n}\cos nx\big)$ pour tout $x$, ce qui est l'égalité annoncée.

    $\triangleright$ *4.* Avec $z = \theta\mathrm{e}^{\mathrm{i} x}$, $|z| < 1$, on a $1 + 2\mathop{\displaystyle \sum_{n \geq 1}} \theta^{n}\cos nx = \operatorname{Re}\big(1 + 2\mathop{\displaystyle \sum_{n \geq 1}} z^{n}\big) = \operatorname{Re}\dfrac{1 + z}{1 - z}$, et 
    $$\frac{1 + z}{1 - z} = \frac{(1 + z)(1 - \overline{z})}{|1 - z|^{2}} = \frac{1 - |z|^{2} + z - \overline{z}}{1 - 2\theta\cos x + \theta^{2}} ,$$
     dont la partie réelle est $\dfrac{1 - \theta^{2}}{1 - 2\theta\cos x + \theta^{2}}$.

    1.5em

    ![Figure](documents/figures/ff4c19b08728bcdb.svg)

    Le noyau de Poisson $P_{\theta} = \dfrac{1 - \theta^{2}}{1 - 2\theta\cos x + \theta^{2}}$ est positif, de moyenne $1$ (son coefficient $c_{0}$ vaut $1$), et se concentre en $0$ quand $\theta \to 1$ : c'est une approximation de l'unité au sens de la proposition 4 du cours.
