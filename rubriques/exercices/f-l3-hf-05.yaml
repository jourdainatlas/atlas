  enonce: |
    **Équirépartition (théorème de Weyl).** Soit $\alpha$ un irrationnel et $f$ une fonction continue et $1$-périodique sur $\mathbb{R}$.

    **1.** Montrer que $\dfrac{1}{n} \mathop{\displaystyle \sum_{k=1}^{n}} \mathrm{e}^{2\mathrm{i}\pi m k \alpha} \to 0$ pour tout entier $m \neq 0$.

    **2.** En déduire que $\dfrac{1}{n} \mathop{\displaystyle \sum_{k=1}^{n}} f(k\alpha) \to \mathop{\displaystyle \int_{0}^{1}} f(x) \, \mathrm{d} x$, d'abord pour les polynômes trigonométriques en $\mathrm{e}^{2\mathrm{i}\pi x}$, puis pour toute $f$ continue.

    **3.** Interpréter ce résultat pour les parties fractionnaires $\{k\alpha\}$ et un intervalle $[a, b] \subset [0, 1]$. Comparer avec la proposition 9 du cours.
  corrige: |
    $\triangleright$ *1.* Comme $\alpha$ est irrationnel et $m \neq 0$, $q = \mathrm{e}^{2\mathrm{i}\pi m\alpha} \neq 1$. La somme géométrique vaut $\mathop{\displaystyle \sum_{k=1}^{n}} q^{k} = q\dfrac{1 - q^{n}}{1 - q}$, de module au plus $\dfrac{2}{|1 - q|}$, indépendant de $n$ ; divisée par $n$, elle tend vers $0$.

    $\triangleright$ *2.* Pour $e(x) = \mathrm{e}^{2\mathrm{i}\pi m x}$, la question 1 donne $\dfrac{1}{n} \mathop{\displaystyle \sum} e(k\alpha) \to 0 = \mathop{\displaystyle \int_{0}^{1}} e$ si $m \neq 0$, et pour $m = 0$ les deux membres valent $1$. Par linéarité, le résultat vaut pour tout polynôme trigonométrique $P$.

    Soit $f$ continue et $1$-périodique, et $\varepsilon > 0$. Le théorème de Weierstrass trigonométrique (cours, th. 1, appliqué à $s \mapsto f(s/2\pi)$) fournit un polynôme trigonométrique $P$ tel que $\mathop{\displaystyle \sup} |f - P| \leq \varepsilon$. Alors 
    $$\Big| \frac{1}{n} \sum_{k=1}^{n} f(k\alpha) - \int_{0}^{1} f \Big| \leq \varepsilon + \Big| \frac{1}{n} \sum_{k=1}^{n} P(k\alpha) - \int_{0}^{1} P \Big| + \varepsilon ,$$
     et le terme du milieu tend vers $0$ : la limite supérieure est au plus $2\varepsilon$, pour tout $\varepsilon$. D'où $\dfrac{1}{n} \mathop{\displaystyle \sum_{k=1}^{n}} f(k\alpha) \to \mathop{\displaystyle \int_{0}^{1}} f$. Il n'est pas nécessaire de supposer $f$ de classe $\mathcal{C}^{1}$ par morceaux.

    $\triangleright$ *3.* Soit $0 \leq a < b \leq 1$ et $\varepsilon > 0$ petit. On encadre $\mathbf{1}_{[a, b]}$ (prolongée par périodicité) entre deux fonctions continues $1$-périodiques $g \leq \mathbf{1}_{[a, b]} \leq G$, affines par morceaux, telles que $\mathop{\displaystyle \int_{0}^{1}}(G - g) \leq 4\varepsilon$. En appliquant la question 2 à $g$ et à $G$, 
    $$b - a - 4\varepsilon \leq \liminf \frac{N_{n}}{n} \leq \limsup \frac{N_{n}}{n} \leq b - a + 4\varepsilon , \qquad N_{n} = \operatorname{card}\{k \leq n ; \ \{k\alpha\} \in [a, b]\} .$$
     Donc $\dfrac{N_{n}}{n} \to b - a$ : la suite des parties fractionnaires $\{k\alpha\}$ est équirépartie dans $[0, 1]$, chaque intervalle recevant une proportion de points égale à sa longueur.

    Pour toute $f \in L^{2}$, la proposition 9 du cours donne la convergence en moyenne quadratique des moyennes $\dfrac{1}{N}\mathop{\displaystyle \sum} f(\cdot + k\alpha)$ ; ici, on obtient la convergence *en un point* (le point $0$), ce qui exige que $f$ soit continue, l'évaluation en un point n'ayant pas de sens dans $L^{2}$.

    1.5em

    ![Figure](documents/figures/6659424807d0f2ce.svg)

    Pour $\alpha = \sqrt{2}$, les barres donnent, pour chacun des dix intervalles $[\dfrac{j}{10}, \dfrac{j+1}{10}[$, la proportion des $1000$ premiers points $\{k\sqrt{2}\}$ qui y tombent, divisée par $\dfrac{1}{10}$ : elle vaut entre $0{,}99$ et $1{,}01$. Les traits orange sur l'axe montrent les $30$ premiers points, qui se répartissent déjà régulièrement.

