  page_corrige: 2
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique égale à $1$ sur $[0, \pi]$ et à $0$ sur $]\pi, 2\pi[$. Calculer les coefficients de Fourier de $f$. Déterminer $f * f$ et ses coefficients de Fourier.
  corrige: |
    On a $c_{0}(f) = \dfrac{1}{2\pi} \cdot \pi = \dfrac{1}{2}$, et pour $n \neq 0$, 
    $$c_{n}(f) = \frac{1}{2\pi} \int_{0}^{\pi} \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \frac{1 - (-1)^{n}}{2\mathrm{i}\pi n} ,$$
     soit 
    $$\boxed{c_{n}(f) = \frac{1}{\mathrm{i}\pi n} \ (n \text{ impair}) , \qquad c_{n}(f) = 0 \ (n \text{ pair}, \ n \neq 0) .}$$

    Par définition, $f * f(x) = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} f(t) f(x - t) \, \mathrm{d} t$ est $\dfrac{1}{2\pi}$ fois la longueur de l'ensemble des $t \in [0, \pi]$ tels que $x - t \in [0, \pi]$ modulo $2\pi$. Pour $x \in [0, \pi]$, c'est $[0, x]$ ; pour $x \in [\pi, 2\pi]$, c'est $[x - \pi, \pi]$. Donc 
    $$\boxed{f * f(x) = \frac{x}{2\pi} \ \text{sur } [0, \pi] , \qquad f * f(x) = \frac{2\pi - x}{2\pi} \ \text{sur } [\pi, 2\pi] ,}$$
     une fonction triangle continue, de maximum $\dfrac{1}{2}$ en $\pi$. Ses coefficients sont $c_{n}(f * f) = c_{n}(f)^{2}$ : la démonstration de la proposition 7 du cours, par le théorème de Fubini, n'utilise pas la continuité de $g$, seulement son intégrabilité et sa bornitude. On obtient $c_{0} = \dfrac{1}{4}$, $c_{n} = -\dfrac{1}{\pi^{2} n^{2}}$ pour $n$ impair, $0$ pour $n$ pair non nul.

    1.5em

    ![Figure](documents/figures/7375d7334af97f50.svg)

    La convolée $f * f$ (orange) est continue alors que $f$ (bleu) saute : la convolution régularise, et ses coefficients, carrés de ceux de $f$, décroissent en $1/n^{2}$ au lieu de $1/n$.
- id: "l3-hf-05-04"
  feuille: "f-l3-hf-05"
  numero: 4
  partie: "Coefficients, formule de Parseval"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coefficients de Fourier, convolution]
  noeuds: [fo-coefficients, fo-parseval]
  notions: [base-hilbertienne, produit-convolution, fonction-periodique]
  source: "Bordeaux 2013-2014, feuille 4, exercices 3 et 4 ; Licence MPC, Analyse de Fourier 2, exercice 6"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Régularité et décroissance des coefficients.**

    **1.** Rappeler l'expression de $c_{n}(f * g)$ pour $f \in L^{1}(\mathbb{T})$ et $g$ continue (cours, prop. 7). Soit $f(x) = \cos(4x)$ et $g(x) = \sin(-3x)$ : déterminer les coefficients de Fourier de $f * g$. Que peut-on dire de $f * g$ ?

    **2.** Soit $f$ de classe $\mathcal{C}^{k}$ sur $\mathbb{R}$ et $2\pi$-périodique. Exprimer $c_{n}(f^{(k)})$ en fonction de $c_{n}(f)$. Écrire la série de Fourier de $x \mapsto \cos(5x)$.

    **3.** En déduire que, si $f$ est de classe $\mathcal{C}^{k}$, alors $c_{n}(f) = o(1/|n|^{k})$ quand $|n| \to +\infty$.

    **4.** Réciproquement, soit $f$ continue et $2\pi$-périodique telle que $c_{n}(f) = o(1/|n|^{k})$ pour tout entier $k$.

    **(a)** Montrer que la série $\mathop{\displaystyle \sum_{n}} c_{n}(f) e_{n}$ converge uniformément sur $\mathbb{R}$ ; on note $g$ sa somme.

    **(b)** Montrer que $g$ est de classe $\mathcal{C}^{\infty}$ et que $c_{n}(g) = c_{n}(f)$ pour tout $n$.

    **(c)** En déduire que $f = g$, donc que $f$ est de classe $\mathcal{C}^{\infty}$. Quel théorème a-t-on démontré ?
  corrige: |
    $\triangleright$ *1.* On a $c_{n}(f * g) = c_{n}(f) c_{n}(g)$. Ici $c_{n}(f) \neq 0$ seulement pour $n = \pm 4$, et $c_{n}(g) \neq 0$ seulement pour $n = \pm 3$ : tous les produits sont nuls. La fonction $f * g$ est continue (cours, prop. 2) et tous ses coefficients sont nuls ; par l'unicité (cours, prop. 8), elle est nulle presque partout, donc partout par continuité : $f * g = 0$. On le vérifie directement : $f * g(x) = \dfrac{1}{2\pi} \mathop{\displaystyle \int} \cos(4t) \sin(3t - 3x) \, \mathrm{d} t = 0$ par orthogonalité des fonctions trigonométriques de fréquences différentes.

    $\triangleright$ *2.* Par intégration par parties, les termes de bord se compensant par périodicité, 
    $$c_{n}(f') = \frac{1}{2\pi} \int_{0}^{2\pi} f'(t) \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \frac{1}{2\pi} \big[ f(t) \mathrm{e}^{-\mathrm{i} n t} \big]_{0}^{2\pi} + \frac{\mathrm{i} n}{2\pi} \int_{0}^{2\pi} f(t) \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \mathrm{i} n \, c_{n}(f) ,$$
     et par récurrence $c_{n}(f^{(k)}) = (\mathrm{i} n)^{k} c_{n}(f)$. Pour $\cos(5x) = \dfrac{1}{2}(e_{5} + e_{-5})$, la série de Fourier est réduite à ces deux termes.

    $\triangleright$ *3.* La fonction $f^{(k)}$ est continue, donc dans $L^{2}(\mathbb{T})$, et ses coefficients tendent vers $0$ (Bessel, ou cours, prop. 8). Ainsi $|n|^{k} |c_{n}(f)| = |c_{n}(f^{(k)})| \to 0$ : $c_{n}(f) = o(1/|n|^{k})$. Plus $f$ est régulière, plus ses coefficients décroissent vite.

    $\triangleright$ *4.* (a) Avec $k = 2$, $|c_{n}(f)| \leq \dfrac{1}{n^{2}}$ pour $|n|$ assez grand : la série $\mathop{\displaystyle \sum} c_{n}(f) e_{n}$ converge normalement, donc uniformément, et sa somme $g$ est continue.

    (b) Pour tout $j$, la série dérivée $\mathop{\displaystyle \sum} (\mathrm{i} n)^{j} c_{n}(f) e_{n}$ converge normalement, puisque $|n|^{j} |c_{n}(f)| \leq \dfrac{1}{n^{2}}$ pour $|n|$ assez grand (hypothèse avec $k = j + 2$). Le théorème de dérivation des séries de fonctions montre, par récurrence, que $g$ est de classe $\mathcal{C}^{\infty}$. Enfin, la convergence uniforme permet d'intégrer terme à terme : $c_{m}(g) = \mathop{\displaystyle \sum_{n}} c_{n}(f) \langle e_{n}, e_{m} \rangle = c_{m}(f)$.

    (c) La fonction continue $f - g$ a tous ses coefficients nuls : elle est nulle (cours, prop. 8, et continuité). Donc $f = g$ est de classe $\mathcal{C}^{\infty}$. On a démontré : 
    $$\boxed{\text{une fonction continue périodique est } \mathcal{C}^{\infty} \iff \text{ses coefficients sont à décroissance rapide.}}$$
- id: "l3-hf-05-05"
  feuille: "f-l3-hf-05"
  numero: 5
  partie: "Coefficients, formule de Parseval"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients, fo-parseval]
  notions: [base-hilbertienne, fonction-periodique]
  source: "Mathovore, exercices L3, exercices 13 et 14 ; Sorbonne 3M210, TD 3, exercice 11"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **Convergence normale.**

    **1.** Soit $f$ continue et $2\pi$-périodique, telle que $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} |c_{n}(f)| < +\infty$. Montrer que $S_{N} f$ converge uniformément vers une fonction continue $g$ telle que $c_{n}(g) = c_{n}(f)$ pour tout $n$, puis que $g = f$ *en tout point*.

    **2.** Soit $h(t) = 1 - |t|/\pi$ pour $t \in [-\pi, \pi]$, prolongée par périodicité. Calculer les coefficients de Fourier de $h$, à l'aide de ceux de la fonction triangle du cours. En appliquant la question 1 en $t = 0$, calculer $\mathop{\displaystyle \sum_{k \geq 0}} \dfrac{1}{(2k + 1)^{2}}$, et en déduire $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{n^{2}}$.

    **3.** Soit $f$ la fonction en dents de scie du cours ($f(t) = t$ sur $]-\pi, \pi[$). Montrer que la suite $(S_{N} f)$ ne peut pas converger uniformément sur $\mathbb{R}$.
  corrige: |
    $\triangleright$ *1.* Comme $|c_{n}(f) e_{n}(t)| = |c_{n}(f)|$, la série $\mathop{\displaystyle \sum} c_{n}(f) e_{n}$ converge normalement sur $\mathbb{R}$, donc uniformément ; sa somme $g$ est continue, comme limite uniforme des fonctions continues $S_{N} f$. La convergence uniforme permet d'intervertir somme et intégrale : $c_{m}(g) = \mathop{\displaystyle \lim_{N}} c_{m}(S_{N} f) = c_{m}(f)$.

    La fonction continue $f - g$ a tous ses coefficients nuls ; par l'unicité (cours, prop. 8), elle est nulle presque partout, donc partout, car une fonction continue nulle presque partout est nulle. $S_{N} f \to f$ uniformément, et $f(t) = \mathop{\displaystyle \sum_{n}} c_{n}(f) \mathrm{e}^{\mathrm{i} n t}$ pour tout $t$.

    $\triangleright$ *2.* Notons $g(t) = |t|$ sur $[-\pi, \pi]$ la fonction triangle du cours, de coefficients $c_{0}(g) = \dfrac{\pi}{2}$ et $c_{n}(g) = \dfrac{(-1)^{n} - 1}{\pi n^{2}}$. Comme $h = 1 - g/\pi$, 
    $$c_{0}(h) = \frac{1}{2} , \qquad c_{n}(h) = \frac{1 - (-1)^{n}}{\pi^{2} n^{2}} = \frac{2}{\pi^{2} n^{2}} \ (n \text{ impair}) , \qquad c_{n}(h) = 0 \ (n \text{ pair}, \ n \neq 0) .$$
     La série $\mathop{\displaystyle \sum} |c_{n}(h)|$ converge, et la question 1 en $t = 0$ donne $1 = h(0) = \dfrac{1}{2} + 2 \mathop{\displaystyle \sum_{k \geq 0}} \dfrac{2}{\pi^{2}(2k + 1)^{2}}$, d'où 
    $$\boxed{\sum_{k \geq 0} \frac{1}{(2k + 1)^{2}} = \frac{\pi^{2}}{8} .}$$
     En séparant les termes pairs et impairs, $\zeta(2) = \mathop{\displaystyle \sum_{k}} \dfrac{1}{(2k + 1)^{2}} + \dfrac{1}{4}\zeta(2)$, donc $\zeta(2) = \dfrac{4}{3} \cdot \dfrac{\pi^{2}}{8} = \dfrac{\pi^{2}}{6}$ : on retrouve la valeur obtenue par Parseval dans le cours, cette fois par une évaluation en un point.

    $\triangleright$ *3.* Supposons que $S_{N} f$ converge uniformément vers une fonction $g$. Alors $g$ est continue, et $S_{N} f \to g$ dans $L^{2}$ ; comme $S_{N} f \to f$ dans $L^{2}$ (cours, th. 3), $g = f$ presque partout. Les deux fonctions étant continues sur $]-\pi, \pi[$, elles y coïncident. Mais alors $g(\pi) = \mathop{\displaystyle \lim_{t \to \pi^{-}}} f(t) = \pi$ et $g(\pi) = g(-\pi) = \mathop{\displaystyle \lim_{t \to -\pi^{+}}} f(t) = -\pi$ : contradiction. Pas de convergence uniforme : une limite uniforme de fonctions continues est continue, et $f$ a un saut.

    1.5em

    ![Figure](documents/figures/fd064ea65cfa559e.svg)

    Les sommes partielles (orange) sont continues et valent $0$ au point de saut $\pi$ ; elles collent à la dent de scie (rouge) loin du saut, mais l'écart maximal près de $\pi$ ne diminue pas : c'est le phénomène de Gibbs, étudié au chapitre 6.
- id: "l3-hf-05-06"
  feuille: "f-l3-hf-05"
