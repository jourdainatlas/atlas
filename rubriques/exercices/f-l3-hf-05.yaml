  enonce: |
    **Densité des polynômes.** On veut montrer que les fonctions polynomiales sont denses dans $L^{2}([0, 2\pi], \dfrac{\mathrm{d} t}{2\pi})$. Soit $g$ dans cet espace telle que $\mathop{\displaystyle \int_{0}^{2\pi}} g(x) x^{k} \, \mathrm{d} x = 0$ pour tout $k \in \mathbb{N}$, et $n \in \mathbb{Z}$.

    **1.** Montrer que $x \mapsto \mathop{\displaystyle \sum_{j \geq 0}} \dfrac{|n x|^{j}}{j!} |g(x)|$ est intégrable sur $[0, 2\pi]$.

    **2.** En déduire que $c_{n}(g) = 0$.

    **3.** Conclure.
  corrige: |
    $\triangleright$ *1.* La série vaut $\mathrm{e}^{|n|x}|g(x)| \leq \mathrm{e}^{2\pi|n|}|g(x)|$ sur $[0, 2\pi]$, et $g$ est intégrable (car de carré intégrable sur un intervalle borné).

    $\triangleright$ *2.* Pour tout $x$, $\mathrm{e}^{-\mathrm{i} n x} = \mathop{\displaystyle \sum_{j \geq 0}} \dfrac{(-\mathrm{i} n x)^{j}}{j!}$. La série $\mathop{\displaystyle \sum_{j}} \dfrac{(-\mathrm{i} n)^{j}}{j!} x^{j} g(x)$ est dominée, au sens de la question 1, par une fonction intégrable : on peut intégrer terme à terme (convergence dominée appliquée aux sommes partielles), et 
    $$c_{n}(g) = \frac{1}{2\pi} \int_{0}^{2\pi} g(x) \mathrm{e}^{-\mathrm{i} n x} \, \mathrm{d} x = \sum_{j \geq 0} \frac{(-\mathrm{i} n)^{j}}{2\pi \, j!} \int_{0}^{2\pi} g(x) x^{j} \, \mathrm{d} x = 0 .$$

    $\triangleright$ *3.* Tous les coefficients de Fourier de $g$ (pour $n = 0$ aussi) sont nuls ; par le théorème 2 du cours (ou la proposition 8), $g = 0$. L'orthogonal de l'espace des polynômes est réduit à $\{0\}$ : par le critère de densité (chapitre 2, prop. 7), les polynômes sont denses dans $L^{2}([0, 2\pi])$. On retrouve ainsi, à partir de la base des $e_{n}$, une conséquence du théorème de Weierstrass polynomial.
- id: "l3-hf-05-15"
