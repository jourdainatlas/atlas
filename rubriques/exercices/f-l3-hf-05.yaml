  noeuds: [fo-coefficients, fo-parseval]
  notions: [base-hilbertienne, fonction-periodique]
  source: "Mathovore, Contrôle L3 « espaces de Hilbert, projection et Parseval », exercice 4 ; Dauphine, Analyse 3, TD 5 (2017-2018), exercice 1 = TD 6 (2008-2009), exercice 1"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique définie par $f(t) = (t - \pi)^{2}$ pour $t \in [0, 2\pi]$.

    **1.** Calculer $c_{0}(f)$, puis montrer que $c_{n}(f) = \dfrac{2}{n^{2}}$ pour $n \neq 0$.

    **2.** À l'aide de l'exercice 5 (question 1), évaluer la série de Fourier de $f$ en $t = 0$ et en $t = \pi$ ; en déduire $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{n^{2}}$ et $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n+1}}{n^{2}}$.

    **3.** Écrire la formule de Parseval pour $f$, et en déduire $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{n^{4}}$.

    **4.** Que donne ce calcul pour la fonction paire $g$, $2\pi$-périodique, égale à $\pi^{2} - x^{2}$ sur $[-\pi, \pi]$ ?
  corrige: |
    $\triangleright$ *1.* On a $c_{0}(f) = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} (t - \pi)^{2} \, \mathrm{d} t = \dfrac{1}{2\pi} \cdot \dfrac{2\pi^{3}}{3} = \dfrac{\pi^{2}}{3}$. Pour $n \neq 0$, deux intégrations par parties, avec $f(0) = f(2\pi)$ et $\mathop{\displaystyle \int_{0}^{2\pi}} \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = 0$, donnent 
    $$c_{n}(f) = \frac{1}{2\pi\mathrm{i} n} \int_{0}^{2\pi} 2(t - \pi) \mathrm{e}^{-\mathrm{i} n t} \, \mathrm{d} t = \frac{1}{2\pi\mathrm{i} n} \Big[ \frac{2(t - \pi)\mathrm{e}^{-\mathrm{i} n t}}{-\mathrm{i} n} \Big]_{0}^{2\pi} = \frac{1}{2\pi\mathrm{i} n} \cdot \frac{4\pi}{-\mathrm{i} n} = \frac{2}{n^{2}} .$$

    $\triangleright$ *2.* La fonction $f$ est continue (elle vaut $\pi^{2}$ en $0$ et en $2\pi$) et $\mathop{\displaystyle \sum} |c_{n}(f)| < +\infty$ : par l'exercice 5, $f(t) = \dfrac{\pi^{2}}{3} + \mathop{\displaystyle \sum_{n \neq 0}} \dfrac{2}{n^{2}} \mathrm{e}^{\mathrm{i} n t} = \dfrac{\pi^{2}}{3} + 4\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{\cos nt}{n^{2}}$ pour tout $t$. En $t = 0$ et en $t = \pi$, 
    $$\pi^{2} = \frac{\pi^{2}}{3} + 4\sum_{n \geq 1} \frac{1}{n^{2}} , \qquad 0 = \frac{\pi^{2}}{3} + 4\sum_{n \geq 1} \frac{(-1)^{n}}{n^{2}} , \qquad \text{d'où} \qquad \boxed{\sum_{n \geq 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6} , \quad \sum_{n \geq 1} \frac{(-1)^{n+1}}{n^{2}} = \frac{\pi^{2}}{12} .}$$

    $\triangleright$ *3.* On a $\lVert f \rVert_{2}^{2} = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} (t - \pi)^{4} \, \mathrm{d} t = \dfrac{\pi^{4}}{5}$, et Parseval donne 
    $$\frac{\pi^{4}}{5} = \frac{\pi^{4}}{9} + 2\sum_{n \geq 1} \frac{4}{n^{4}} , \qquad \text{d'où} \qquad \boxed{\sum_{n \geq 1} \frac{1}{n^{4}} = \frac{1}{8}\Big( \frac{\pi^{4}}{5} - \frac{\pi^{4}}{9} \Big) = \frac{\pi^{4}}{90} .}$$

    $\triangleright$ *4.* Pour $x \in [-\pi, \pi]$, $x + \pi \in [0, 2\pi]$ et $f(x + \pi) = x^{2}$ ; donc $g(x) = \pi^{2} - f(x + \pi)$, et $c_{n}(g) = -\mathrm{e}^{\mathrm{i} n\pi} c_{n}(f) = \dfrac{2(-1)^{n+1}}{n^{2}}$ pour $n \neq 0$, $c_{0}(g) = \dfrac{2\pi^{2}}{3}$. Ainsi $\pi^{2} - x^{2} = \dfrac{2\pi^{2}}{3} + 4\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n+1}}{n^{2}} \cos nx$, et l'évaluation en $x = 0$ redonne $\mathop{\displaystyle \sum} \dfrac{(-1)^{n+1}}{n^{2}} = \dfrac{\pi^{2}}{12}$.
- id: "l3-hf-05-07"
  feuille: "f-l3-hf-05"
  numero: 7
  partie: "Coefficients, formule de Parseval"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients, fo-parseval]
  notions: [base-hilbertienne, fonction-periodique]
  source: "Licence MPC, Analyse de Fourier 2, exercice 7"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f$ la fonction $2\pi$-périodique paire définie par $f(t) = \cos(t/2)$ pour $t \in [0, \pi]$.

    **1.** Tracer le graphe de $f$ sur $[-3\pi, 3\pi]$, et vérifier que $f(t) = |\cos(t/2)|$ pour tout $t$.

    **2.** Calculer la série de Fourier de $f$, sous forme réelle.

    **3.** En déduire $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{1}{4n^{2} - 1}$ et $\mathop{\displaystyle \sum_{n \geq 1}} \dfrac{(-1)^{n+1}}{4n^{2} - 1}$.
  corrige: |
    $\triangleright$ *1.* Sur $[-\pi, \pi]$, $t/2 \in [-\dfrac{\pi}{2}, \dfrac{\pi}{2}]$, donc $\cos(t/2) \geq 0$, et $f(t) = \cos(t/2) = |\cos(t/2)|$ (parité). La fonction $|\cos(t/2)|$ étant $2\pi$-périodique, $f(t) = |\cos(t/2)|$ pour tout $t$ : c'est une suite d'arches, continue mais anguleuse aux points $\pi + 2k\pi$.

    $\triangleright$ *2.* La fonction est paire : $b_{n} = 0$, et 
    $$a_{n} = \frac{2}{\pi} \int_{0}^{\pi} \cos\frac{t}{2} \cos(nt) \, \mathrm{d} t = \frac{1}{\pi} \int_{0}^{\pi} \Big( \cos\big((n + \tfrac{1}{2})t\big) + \cos\big((n - \tfrac{1}{2})t\big) \Big) \mathrm{d} t = \frac{1}{\pi} \Big( \frac{(-1)^{n}}{n + \frac{1}{2}} - \frac{(-1)^{n}}{n - \frac{1}{2}} \Big) ,$$
     puisque $\sin\big((n \pm \dfrac{1}{2})\pi\big) = \pm(-1)^{n}$. Donc 
    $$\boxed{a_{n} = \frac{4(-1)^{n+1}}{\pi(4n^{2} - 1)} , \qquad |\cos(t/2)| = \frac{2}{\pi} + \frac{4}{\pi} \sum_{n \geq 1} \frac{(-1)^{n+1}}{4n^{2} - 1} \cos(nt) ,}$$
     avec $a_{0} = \dfrac{4}{\pi}$. L'égalité a lieu en tout point, par l'exercice 5, car $\mathop{\displaystyle \sum} \dfrac{1}{4n^{2} - 1}$ converge.

    $\triangleright$ *3.* En $t = \pi$, où $f$ s'annule et $\cos(n\pi) = (-1)^{n}$ : $0 = \dfrac{2}{\pi} - \dfrac{4}{\pi} \mathop{\displaystyle \sum_{n}} \dfrac{1}{4n^{2} - 1}$. En $t = 0$, où $f$ vaut $1$ : 
    $$\boxed{\sum_{n \geq 1} \frac{1}{4n^{2} - 1} = \frac{1}{2} , \qquad \sum_{n \geq 1} \frac{(-1)^{n+1}}{4n^{2} - 1} = \frac{\pi - 2}{4} .}$$
     La première somme se vérifie directement, car $\dfrac{1}{4n^{2} - 1} = \dfrac{1}{2}\big( \dfrac{1}{2n - 1} - \dfrac{1}{2n + 1} \big)$ est télescopique.

    1.5em

    ![Figure](documents/figures/c9d62d2d8c28175c.svg)

    Les arches de $|\cos(t/2)|$ (bleu) et la somme partielle $\dfrac{a_{0}}{2} + a_{1}\cos t + a_{2}\cos 2t$ (orange) : avec deux harmoniques seulement, l'écart est déjà faible, sauf aux points anguleux $\pi + 2k\pi$.
- id: "l3-hf-05-08"
