  enonce: |
    Soit $a > 0$ et $f$ la fonction $2\pi$-périodique définie par $f(x) = \mathrm{e}^{-ax}$ pour $x \in [0, 2\pi[$.

    **1.** Calculer les coefficients de Fourier de $f$.

    **2.** En déduire, par la formule de Parseval, la valeur de $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}} \dfrac{1}{n^{2} + a^{2}}$.

    **3.** Pour $a = 1$, vérifier que $\dfrac{1}{\pi} \mathop{\displaystyle \sum_{k \in \mathbb{Z}}} \dfrac{1}{1 + k^{2}} = \dfrac{1 + \mathrm{e}^{-2\pi}}{1 - \mathrm{e}^{-2\pi}}$.
  corrige: |
    $\triangleright$ *1.* Pour tout $n$, 
    $$c_{n}(f) = \frac{1}{2\pi} \int_{0}^{2\pi} \mathrm{e}^{-(a + \mathrm{i} n)x} \, \mathrm{d} x = \boxed{\frac{1 - \mathrm{e}^{-2\pi a}}{2\pi(a + \mathrm{i} n)} .}$$

    $\triangleright$ *2.* On a $\lVert f \rVert_{2}^{2} = \dfrac{1}{2\pi} \mathop{\displaystyle \int_{0}^{2\pi}} \mathrm{e}^{-2ax} \, \mathrm{d} x = \dfrac{1 - \mathrm{e}^{-4\pi a}}{4\pi a}$, et $|c_{n}(f)|^{2} = \dfrac{(1 - \mathrm{e}^{-2\pi a})^{2}}{4\pi^{2}(a^{2} + n^{2})}$. La formule de Parseval donne 
    $$\sum_{n \in \mathbb{Z}} \frac{1}{n^{2} + a^{2}} = \frac{4\pi^{2}}{(1 - \mathrm{e}^{-2\pi a})^{2}} \cdot \frac{1 - \mathrm{e}^{-4\pi a}}{4\pi a} = \frac{\pi}{a} \cdot \frac{1 + \mathrm{e}^{-2\pi a}}{1 - \mathrm{e}^{-2\pi a}} , \qquad \text{soit} \qquad \boxed{\sum_{n \in \mathbb{Z}} \frac{1}{n^{2} + a^{2}} = \frac{\pi}{a} \coth(\pi a) .}$$
     Le chapitre 7 retrouvera cette formule par la formule sommatoire de Poisson.

    $\triangleright$ *3.* Pour $a = 1$, $\dfrac{1}{\pi} \mathop{\displaystyle \sum_{k}} \dfrac{1}{1 + k^{2}} = \coth \pi = \dfrac{1 + \mathrm{e}^{-2\pi}}{1 - \mathrm{e}^{-2\pi}} \approx 1{,}0037$. La fonction égale à $\mathrm{e}^{-x}$ sur $]-\pi, \pi]$, prolongée par périodicité, est $\mathrm{e}^{\pi} f(x + \pi)$, de mêmes $|c_{n}|$ à un facteur près : le calcul est identique.
- id: "l3-hf-05-09"
  feuille: "f-l3-hf-05"
  numero: 9
