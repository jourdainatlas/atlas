  enonce: |
    Déterminer les nombres premiers dont l'écriture en base $10$ comporte en alternance des $0$ et des $1$, comme $101$ ou $10\,101$.
  corrige: |
    Un tel nombre qui se termine par $0$ est pair et supérieur à $10$ : il n'est pas premier. Il reste les nombres $N_{m} = \sum_{k = 0}^{m} 100^{k}$, qui comportent $m + 1$ chiffres $1$. Le nombre $N_{0} = 1$ n'est pas premier, et $N_{1} = 101$ l'est. Soit $m \geqslant 2$.

    *Si $m + 1 = 2j$ est pair*, avec $j \geqslant 2$, on regroupe les termes deux par deux : 
    $$N_{m} = (1 + 100)\big(1 + 10^{4} + \cdots + 10^{4(j - 1)}\big),$$
     et les deux facteurs sont strictement supérieurs à $1$.

    *Si $m + 1$ est impair*, avec $m + 1 \geqslant 3$, on note $R_{m + 1}$ le nombre formé de $m + 1$ chiffres $1$. La formule $a^{n} - b^{n}$ (chapitre 3, proposition 5) donne 
    $$99\,N_{m} = 10^{2(m + 1)} - 1 = (10^{m + 1} - 1)(10^{m + 1} + 1) = 9R_{m + 1} \times (10^{m + 1} + 1).$$
     Comme $m + 1$ est impair, $10^{m + 1} \equiv (-1)^{m + 1} = -1 \;[11]$, donc $11$ divise $10^{m + 1} + 1$, et 
    $$N_{m} = R_{m + 1} \times \frac{10^{m + 1} + 1}{11},$$
     avec $R_{m + 1} \geqslant 111$ et $\frac{10^{m + 1} + 1}{11} \geqslant 91$. 
    $$\boxed{101 \text{ est le seul nombre premier de cette forme}}$$
     Par exemple, $10\,101 = 3 \times 7 \times 13 \times 37 = 111 \times 91$, et $1\,010\,101 = 101 \times 10\,001$.
- id: "ma-12-30"
  feuille: "f-ma-12"
  numero: 30
  partie: "Nombres premiers"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [nombres premiers, congruences]
  noeuds: [z-premiers, z-zn]
  notions: [nombre-premier, congruence]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    **1.** Montrer qu'il existe une infinité de nombres premiers congrus à $3$ modulo $4$. On pourra raisonner par l'absurde et considérer $4p_{1}p_{2} \cdots p_{r} - 1$.

    **2.** Montrer qu'il existe une infinité de nombres premiers congrus à $5$ modulo $6$.
  corrige: |
    **1.** Supposons qu'il n'y ait qu'un nombre fini de nombres premiers congrus à $3$ modulo $4$, que l'on note $p_{1}, \dots, p_{r}$ ; on a $r \geqslant 1$, puisque $3$ en fait partie. L'entier $N = 4p_{1} \cdots p_{r} - 1$ est impair et congru à $3$ modulo $4$. Ses facteurs premiers sont impairs, donc congrus à $1$ ou $3$ modulo $4$. S'ils étaient tous congrus à $1$, leur produit $N$ le serait aussi. L'un d'eux, $q$, est donc congru à $3$ modulo $4$ : c'est l'un des $p_{i}$, qui divise alors $4p_{1} \cdots p_{r} - N = 1$. C'est absurde. 
    $$\boxed{\text{il y a une infinité de nombres premiers } p \equiv 3 \;[4]}$$

    **2.** Même raisonnement avec $N = 6p_{1} \cdots p_{r} - 1$, où $p_{1} = 5$, …, $p_{r}$ seraient tous les nombres premiers congrus à $5$ modulo $6$. Ni $2$ ni $3$ ne divisent $N$. Un nombre premier différent de $2$ et $3$ est congru à $1$ ou $5$ modulo $6$, et un produit de nombres congrus à $1$ l'est aussi ; comme $N \equiv 5 \;[6]$, l'un de ses facteurs premiers est congru à $5$, donc égal à un $p_{i}$, qui diviserait $1$. 
    $$\boxed{\text{il y a une infinité de nombres premiers } p \equiv 5 \;[6]}$$
     *À retenir.* Le même argument ne marche pas pour les nombres premiers congrus à $1$ modulo $4$ : un produit de facteurs congrus à $3$ peut être congru à $1$. L'exercice 51 traitera ce cas par une autre voie. Le résultat général, dû à Dirichlet (1837), affirme que toute progression $a + bn$ avec $a \wedge b = 1$ contient une infinité de nombres premiers.
- id: "ma-12-31"
  feuille: "f-ma-12"
  numero: 31
  partie: "Nombres premiers"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [nombres premiers, irrationalité]
  noeuds: [z-premiers, q-irrationnel]
