  page_enonce: 12
  page_corrige: 28
  enonce: |
    Un nombre $6666\ldots0000$ formé de six-cent-soixante-six « $6$ » et éventuellement de quelques zéros à la fin peut-il être un carré parfait ?
  corrige: |
    *Idée.* Un carré a toutes ses valuations paires : on compare celles de $2$ et de $5$.

    Le nombre s'écrit $N = 6 \times R \times 10^{k}$, où $R$ est le repunit à $666$ chiffres et $k \in \mathbb{N}$ le nombre de zéros. Comme $R$ est impair et se termine par $1$, on a $v_{2}(R) = v_{5}(R) = 0$, donc 
    $$v_{2}(N) = 1 + k \qquad \text{et} \qquad v_{5}(N) = k.$$
     Si $N$ était un carré, ces deux entiers consécutifs seraient pairs, ce qui est impossible. 
    $$\boxed{\text{un tel nombre n'est jamais un carré parfait}}$$
     Le nombre $666$ de chiffres ne joue aucun rôle : le résultat vaut pour tout nombre de $6$.
- id: "ma-12-63"
  feuille: "f-ma-12"
  numero: 63
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Calcul]
  mots_cles: [équations diophantiennes, décomposition en facteurs premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Résoudre dans $(\mathbb{N}^{*})^{2}$ l'équation $x^{y} = y^{x}$.
  corrige: |
    *Idée.* Les valuations montrent que le plus petit divise le plus grand, et l'on se ramène à $x^{k - 1} = k$.

    Les couples $(x, x)$ conviennent. Soit une solution avec $x < y$. Pour tout nombre premier $p$, on a $y\,v_{p}(x) = x\,v_{p}(y)$, donc $v_{p}(x) = \frac{x}{y}v_{p}(y) \leqslant v_{p}(y)$, et $x \mid y$ par la proposition 10 (ii). On écrit $y = kx$ avec $k \geqslant 2$. L'équation devient $x^{kx} = (kx)^{x}$, soit, en prenant la racine $x$-ième, $x^{k} = kx$, puis $x^{k - 1} = k$. Comme $x = 1$ donnerait $k = 1$, on a $x \geqslant 2$, donc $k = x^{k - 1} \geqslant 2^{k - 1}$. Or $2^{k - 1} > k$ pour $k \geqslant 3$, par récurrence ; il reste $k = 2$, puis $x = 2$ et $y = 4$. 
    $$\boxed{\mathcal{S} = \{(x, x) \mid x \in \mathbb{N}^{*}\} \cup \{(2, 4), (4, 2)\}}$$
- id: "ma-12-64"
  feuille: "f-ma-12"
  numero: 64
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [puissances parfaites, entiers premiers entre eux]
  noeuds: [z-bezout, z-premiers]
  notions: [pgcd]
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Soit $n \geqslant 2$. Montrer que le produit de trois entiers $> 0$ consécutifs n'est jamais une puissance $n$-ième.
  corrige: |
    *Idée.* Le produit $(k - 1)k(k + 1) = k(k^{2} - 1)$ est formé de deux facteurs premiers entre eux, qui doivent donc être eux-mêmes des puissances $n$-ièmes ; or deux puissances $n$-ièmes ne diffèrent pas de $1$.

    Soit $k \geqslant 2$ et supposons $k(k^{2} - 1) = a^{n}$. Comme $k^{2} - (k^{2} - 1) = 1$, on a $k \wedge (k^{2} - 1) = 1$. Pour tout nombre premier $p$, $v_{p}(k) + v_{p}(k^{2} - 1) = n\,v_{p}(a)$, et l'une des deux valuations est nulle : $n$ divise donc toutes les valuations de $k$ et de $k^{2} - 1$. Comme à l'exercice 32, on obtient $k = b^{n}$ et $k^{2} - 1 = c^{n}$, avec $c \geqslant 1$ car $k^{2} - 1 \geqslant 3$. Alors $(b^{2})^{n} = c^{n} + 1$, donc $b^{2} > c$, soit $b^{2} \geqslant c + 1$. Mais la formule du binôme donne, puisque $n \geqslant 2$, 
    $$(b^{2})^{n} \geqslant (c + 1)^{n} \geqslant c^{n} + nc^{n - 1} + 1 > c^{n} + 1,$$
     ce qui est absurde. 
    $$\boxed{\text{le produit de trois entiers consécutifs strictement positifs n'est jamais une puissance } n\text{-ième}}$$
- id: "ma-12-65"
  feuille: "f-ma-12"
  numero: 65
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Déterminer tous les entiers $n \in \mathbb{N}^{*}$ tels que $2^{n}$ divise $3^{n} - 1$.
  corrige: |
    *Idée.* On calcule $v_{2}(3^{n} - 1)$ en factorisant comme à l'exercice 34, puis on compare à $n$.

    *Si $n$ est impair*, $3^{n} \equiv 3 \;[8]$, puisque $3^{2} \equiv 1 \;[8]$, donc $3^{n} - 1 \equiv 2 \;[8]$ et $v_{2}(3^{n} - 1) = 1$.

    *Si $n = 2^{a}m$ avec $a \geqslant 1$ et $m$ impair*, on factorise $a$ fois : 
    $$3^{n} - 1 = (3^{m} - 1)(3^{m} + 1)(3^{2m} + 1)(3^{4m} + 1) \cdots \big(3^{2^{a - 1}m} + 1\big).$$
     On a $v_{2}(3^{m} - 1) = 1$ ; comme $3^{m} \equiv 3 \;[8]$, $v_{2}(3^{m} + 1) = 2$ ; enfin, pour $i \geqslant 1$, $3^{2^{i}m}$ est un carré impair, donc congru à $1$ modulo $8$, et $v_{2}(3^{2^{i}m} + 1) = 1$. Au total, $v_{2}(3^{n} - 1) = 1 + 2 + (a - 1) = a + 2$.

    La condition $2^{n} \mid 3^{n} - 1$ s'écrit $n \leqslant v_{2}(3^{n} - 1)$. Pour $n$ impair, il faut $n \leqslant 1$. Pour $n$ pair, il faut $2^{a}m \leqslant a + 2$, ce qui impose $m = 1$, puis $2^{a} \leqslant a + 2$, soit $a \in \{1, 2\}$. 
    $$\boxed{n \in \{1, 2, 4\}}$$
     Vérification : $3 - 1 = 2$, $9 - 1 = 8$ et $81 - 1 = 80 = 16 \times 5$. ✓
- id: "ma-12-66"
  feuille: "f-ma-12"
  numero: 66
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: []
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Montrer que $n$ est impair si et seulement si $n$ divise $\displaystyle\sum_{k = 1}^{n} k^{n}$.
  corrige: |
    *Idée.* Pour $n$ impair, on associe $k$ et $n - k$ ; pour $n$ pair, on travaille modulo la plus grande puissance de $2$ qui divise $n$.

    On note $S = \sum_{k = 1}^{n} k^{n}$.

    *Si $n$ est impair*, on a $(n - k)^{n} \equiv (-k)^{n} = -k^{n} \;[n]$, donc les termes d'indices $k$ et $n - k$ se compensent, pour $1 \leqslant k \leqslant n - 1$, et le terme $n^{n}$ est nul modulo $n$. Ainsi $S \equiv 0 \;[n]$.

    *Si $n = 2^{a}m$ est pair*, avec $a \geqslant 1$ et $m$ impair, on montre que $2^{a}$ ne divise pas $S$. Pour $k$ pair, $v_{2}(k^{n}) \geqslant n \geqslant 2^{a} > a$, donc $k^{n} \equiv 0 \;[2^{a}]$. Pour $k$ impair, on montre par récurrence que $k^{2^{j}} \equiv 1 \;[2^{j + 1}]$ : c'est vrai pour $j = 0$, et $k^{2^{j + 1}} - 1 = \big(k^{2^{j}} - 1\big)\big(k^{2^{j}} + 1\big)$ est le produit d'un multiple de $2^{j + 1}$ et d'un nombre pair. Ainsi $k^{n} = \big(k^{2^{a}}\big)^{m} \equiv 1 \;[2^{a}]$. Comme $[\![1\,;n]\!]$ contient $\frac{n}{2} = 2^{a - 1}m$ entiers impairs, 
    $$S \equiv 2^{a - 1}m \;[2^{a}],$$
     qui n'est pas nul puisque $m$ est impair. Donc $2^{a}$, et a fortiori $n$, ne divise pas $S$. 
    $$\boxed{n \mid \sum_{k = 1}^{n} k^{n} \iff n \text{ est impair}}$$
     Par exemple, pour $n = 2$, $S = 1 + 4 = 5$, et pour $n = 3$, $S = 1 + 8 + 27 = 36$. ✓
- id: "ma-12-67"
  feuille: "f-ma-12"
  numero: 67
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Calcul]
  mots_cles: ["suites d'entiers", congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 12
  page_corrige: 29
  enonce: |
    Soit $a_{0} \in \mathbb{N}^{*}$. On définit la suite $(a_{n})_{n \in \mathbb{N}}$ par 
    $$\forall n \in \mathbb{N}, \qquad a_{n + 1} = \begin{cases} \sqrt{a_{n}} & \text{si } \sqrt{a_{n}} \in \mathbb{N}^{*}, \\ a_{n} + 3 & \text{sinon.} \end{cases}$$
     Déterminer les $a_{0} \in \mathbb{N}^{*}$ tels que la suite $(a_{n})_{n \in \mathbb{N}}$ prenne la même valeur une infinité de fois.
  corrige: |
    *Idée.* On étudie la suite modulo $3$, car l'opération $+3$ ne change pas le reste : un terme congru à $2$ fait diverger la suite, un terme multiple de $3$ la fait tourner dans $\{3, 6, 9\}$. La réponse est $a_{0} = 1$ ou $3 \mid a_{0}$.

    *Le cas $a_{0} = 1$.* On a $\sqrt{1} = 1$, donc la suite est constante.

    *Un terme congru à $2$ modulo $3$.* Un carré n'est jamais congru à $2$ modulo $3$. Si $a_{n} \equiv 2$, alors $a_{n + 1} = a_{n} + 3 \equiv 2$, et ainsi de suite : la suite est strictement croissante à partir de ce rang, et elle ne prend chaque valeur qu'un nombre fini de fois.

    *Le cas $3 \mid a_{0}$.* Tous les termes sont alors multiples de $3$, car la racine d'un carré multiple de $3$ est multiple de $3$. Soit $a_{n} > 9$, et $j \geqslant 1$ tel que $(3j)^{2} < a_{n} \leqslant (3j + 3)^{2}$. En ajoutant $3$, la suite ne rencontre aucun carré avant $(3j + 3)^{2}$, puisqu'un carré multiple de $3$ est celui d'un multiple de $3$ ; elle atteint $(3j + 3)^{2}$, puis passe à $3j + 3$, qui est strictement inférieur à $a_{n}$ car $3j + 3 < 9j^{2}$. Ainsi, tant qu'un terme dépasse $9$, la suite redescend plus tard sous lui ; elle prend donc une infinité de fois une valeur de $\{3, 6, 9\}$, et l'une d'elles est prise une infinité de fois. De fait, $3 \to 6 \to 9 \to 3$ est un cycle.

    *Le cas $a_{0} \equiv 1 \;[3]$ et $a_{0} > 1$.* Tant que les termes sont congrus à $1$, la suite avance de $3$ en $3$ jusqu'au premier carré $c^{2}$ congru à $1$, puis passe à $c$. Si $(j - 1)^{2} < a_{n} \leqslant j^{2}$, ce carré est $j^{2}$ ou $(j + 1)^{2}$, car l'un des deux entiers $j$ et $j + 1$ n'est pas multiple de $3$, donc $c \leqslant j + 1$. Si $a_{n} > 4$, on a $j \geqslant 3$, et $c \leqslant j + 1 < (j - 1)^{2} < a_{n}$ : la suite redescend strictement. Par descente, elle atteint donc un terme congru à $2$, ou bien un terme congru à $1$ compris entre $2$ et $4$, c'est-à-dire $4$, dont la racine $2$ est congrue à $2$. Dans tous les cas, on est ramené au cas divergent, et aucune valeur n'est prise une infinité de fois. 
    $$\boxed{\text{la suite prend une valeur une infinité de fois si et seulement si } a_{0} = 1 \text{ ou } 3 \mid a_{0}}$$
     *Remarque sur l'énoncé.* Dans la version de l'Olympiade internationale de 2017, on impose $a_{0} > 1$, et la réponse est « les multiples de $3$ ». Avec $a_{0} \in \mathbb{N}^{*}$, il faut ajouter le cas $a_{0} = 1$, qui donne une suite constante.

