  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $n \geqslant 2$ un entier qui n'admet aucun diviseur premier $p$ tel que $p^{3} \leqslant n$. Montrer que $n$ est premier ou produit de deux nombres premiers. En déduire, en ne testant que les diviseurs $2$, $3$, $5$ et $7$, que $391$ est le produit de deux nombres premiers, puis les déterminer.
  corrige: |
    Supposons que $n$ soit le produit d'au moins trois nombres premiers, non nécessairement distincts : $n = p_{1}p_{2}p_{3}m$ avec $p_{1} \leqslant p_{2} \leqslant p_{3}$ et $m \geqslant 1$. Alors $p_{1}^{3} \leqslant p_{1}p_{2}p_{3} \leqslant n$, ce qui est exclu. Donc la décomposition de $n$ (théorème 6) comporte un ou deux facteurs. 
    $$\boxed{n \text{ est premier ou produit de deux nombres premiers}}$$

    Comme $7^{3} = 343 \leqslant 391 < 512 = 8^{3}$, il suffit de vérifier que $2$, $3$, $5$ et $7$ ne divisent pas $391$ : il est impair, la somme de ses chiffres vaut $13$, il ne se termine ni par $0$ ni par $5$, et $391 = 7 \times 55 + 6$. Pour trouver les deux facteurs $p \leqslant q$, on cherche $p$ parmi les nombres premiers de $11$ à $19$, puisque $p^{2} \leqslant 391 < 400$ : on trouve $391 = 17 \times 23$. 
    $$\boxed{391 = 17 \times 23}$$
- id: "ma-12-26"
  feuille: "f-ma-12"
