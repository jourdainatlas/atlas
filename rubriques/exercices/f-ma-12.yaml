  page_enonce: 5
  page_corrige: 12
  enonce: |
    **1.** Soit $n \in \mathbb{N}^{*}$. Montrer que $\sqrt{n}$ est soit un entier, soit un irrationnel.

    **2.** Montrer que $\dfrac{\ln 2}{\ln 3}$ est irrationnel.
  corrige: |
    **1.** Supposons $\sqrt{n} = \frac{a}{b}$ avec $a \wedge b = 1$ et $b \geqslant 1$. Alors $nb^{2} = a^{2}$, donc $b \mid a^{2}$. Or $b \wedge a^{2} = 1$ (proposition 7 (ii)), donc $b = 1$, et $\sqrt{n} = a$ est un entier. 
    $$\boxed{\sqrt{n} \in \mathbb{N} \quad \text{ou} \quad \sqrt{n} \notin \mathbb{Q}}$$

    **2.** Le quotient est strictement positif. S'il valait $\frac{p}{q}$ avec $p, q \in \mathbb{N}^{*}$, on aurait $q\ln 2 = p\ln 3$, soit $2^{q} = 3^{p}$. C'est impossible : le premier nombre est pair et le second impair, ou, ce qui revient au même, l'unicité de la décomposition (théorème 6) est contredite. 
    $$\boxed{\frac{\ln 2}{\ln 3} \notin \mathbb{Q}}$$
- id: "ma-12-32"
  feuille: "f-ma-12"
  numero: 32
  partie: "Nombres premiers"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [nombres premiers, "PGCD et algorithme d'Euclide", Bézout, décomposition en facteurs premiers]
