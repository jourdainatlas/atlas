  enonce: |
    Soit $p$ un nombre premier supérieur ou égal à $5$. Montrer que $p^{2} - 1$ est divisible par $24$.
  corrige: |
    On a $p^{2} - 1 = (p - 1)(p + 1)$, et $24 = 8 \times 3$ avec $8 \wedge 3 = 1$.

    *Divisibilité par $8$.* Comme $p$ est impair, $p - 1$ et $p + 1$ sont deux entiers pairs consécutifs : l'un d'eux est multiple de $4$, donc leur produit est multiple de $8$.

    *Divisibilité par $3$.* Comme $p \geqslant 5$ est premier, $3 \nmid p$, donc $p \equiv \pm 1 \;[3]$, et $3$ divise $p - 1$ ou $p + 1$.

    La proposition 7 (i) conclut. 
    $$\boxed{24 \mid p^{2} - 1}$$
     Par exemple $7^{2} - 1 = 48$ et $11^{2} - 1 = 120$ ; en revanche $3^{2} - 1 = 8$, ce qui montre que l'hypothèse $p \geqslant 5$ est nécessaire.
- id: "ma-12-27"
  feuille: "f-ma-12"
  numero: 27
  partie: "Nombres premiers"
  etoiles: 2
