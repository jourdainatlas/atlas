  enonce: |
    Montrer que la somme de deux nombres premiers consécutifs n'est jamais le produit de deux nombres premiers.
  corrige: |
    Soit $p < q$ deux nombres premiers consécutifs et $s = p + q$. Si $p = 2$, alors $q = 3$ et $s = 5$ est premier, donc n'est pas produit de deux nombres premiers.

    Si $p \geqslant 3$, les entiers $p$ et $q$ sont impairs, donc $s$ est pair, et $\frac{s}{2}$ est un entier strictement compris entre $p$ et $q$. Il n'est pas premier, puisque $p$ et $q$ sont consécutifs. Supposons $s = ab$ avec $a$ et $b$ premiers. Comme $2 \mid ab$, le lemme d'Euclide donne $2 = a$ ou $2 = b$, et l'autre facteur vaut $\frac{s}{2}$, qui n'est pas premier : contradiction. 
    $$\boxed{p + q = ab \text{ avec } a, b \text{ premiers forcerait } \frac{p + q}{2} \text{ premier, entre } p \text{ et } q}$$
- id: "ma-12-29"
  feuille: "f-ma-12"
  numero: 29
  partie: "Nombres premiers"
  etoiles: 2
