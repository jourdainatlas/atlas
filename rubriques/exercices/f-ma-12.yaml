  page_corrige: 10
  enonce: |
    Soit $n \in \mathbb{N}^{*}$.

    **1.** Montrer qu'il existe $n$ entiers consécutifs dont aucun n'est premier.

    **2.** Montrer qu'il existe un nombre premier compris entre $n + 1$ et $n! + 1$. En déduire une nouvelle preuve de l'existence d'une infinité de nombres premiers.
  corrige: |
    **1.** Les $n$ entiers consécutifs $(n + 1)! + 2$, $(n + 1)! + 3$, …, $(n + 1)! + (n + 1)$ conviennent : pour $2 \leqslant k \leqslant n + 1$, l'entier $k$ divise $(n + 1)!$, donc $(n + 1)! + k$, qui est strictement plus grand que $k$. 
    $$\boxed{(n + 1)! + k \text{ est divisible par } k, \text{ pour } k \in [\![2\,;n + 1]\!]}$$

    **2.** L'entier $N = n! + 1 \geqslant 2$ admet un diviseur premier $p \leqslant N$. Si l'on avait $p \leqslant n$, alors $p$ diviserait $n!$, donc $N - n! = 1$, ce qui est absurde. 
    $$\boxed{n + 1 \leqslant p \leqslant n! + 1}$$
     Ainsi, pour tout $n$, il existe un nombre premier strictement plus grand que $n$ : l'ensemble $\mathcal{P}$ n'est pas majoré, donc il est infini. C'est une variante de la preuve d'Euclide du chapitre 1.
- id: "ma-12-28"
  feuille: "f-ma-12"
  numero: 28
  partie: "Nombres premiers"
  etoiles: 2
