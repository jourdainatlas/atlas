- id: "ma-12-01"
  feuille: "f-ma-12"
  numero: 1
  partie: "Divisibilité et division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer les couples $(a, b) \in \mathbb{N}^{2}$ tels que $a \leqslant 500$ et que la division euclidienne de $a$ par $b$ s'écrive $a = 24b + 17$.
  corrige: |
    L'égalité $a = 24b + 17$ est la division euclidienne de $a$ par $b$ si et seulement si le reste vérifie $0 \leqslant 17 < b$, c'est-à-dire $b \geqslant 18$ (théorème 1). La condition $a \leqslant 500$ s'écrit $24b \leqslant 483$, soit $b \leqslant 20$, puisque $\Big\lfloor \frac{483}{24} \Big\rfloor = 20$. Il reste donc $b \in \{18, 19, 20\}$. 
    $$\boxed{(a, b) \in \{(449, 18), \ (473, 19), \ (497, 20)\}}$$
     *Piège.* L'erreur la plus répandue est d'oublier que le reste doit être strictement inférieur au diviseur. Avec $b = 10$, l'égalité $257 = 24 \times 10 + 17$ est vraie, mais ce n'est pas la division euclidienne de $257$ par $10$, dont le quotient est $25$.
- id: "ma-12-02"
  feuille: "f-ma-12"
  numero: 2
  partie: "Divisibilité et division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Trouver tous les entiers $n \in \mathbb{N}$ vérifiant chacune des conditions suivantes.

    **1.** $n + 1 \mid n + 3$.

    **2.** $n + 2 \mid n^{2} + 3n + 5$.

    **3.** $n + 1 \mid n^{2} + 1$.
  corrige: |
    La méthode est la même dans les trois cas : on retranche au dividende un multiple du diviseur, ce qui ne change pas la divisibilité (proposition 1), jusqu'à obtenir une constante.

    **(i)** Comme $n + 3 = (n + 1) + 2$, on a $n + 1 \mid n + 3$ si et seulement si $n + 1 \mid 2$, c'est-à-dire $n + 1 \in \{1, 2\}$. 
    $$\boxed{n \in \{0, 1\}}$$

    **(ii)** On a $n^{2} + 3n + 5 = (n + 2)(n + 1) + 3$, donc la condition équivaut à $n + 2 \mid 3$. Comme $n + 2 \geqslant 2$, il faut $n + 2 = 3$. 
    $$\boxed{n = 1}$$
     Vérification : $3 \mid 9$. ✓

    **(iii)** On a $n^{2} + 1 = (n + 1)(n - 1) + 2$, donc la condition équivaut à $n + 1 \mid 2$. 
    $$\boxed{n \in \{0, 1\}}$$
- id: "ma-12-03"
  feuille: "f-ma-12"
  numero: 3
  partie: "Divisibilité et division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [divisibilité, division euclidienne]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Déterminer, selon la parité de $n$, le reste de la division euclidienne de $1 + 2 + \cdots + n$ par $n$.
  corrige: |
    On a $S = 1 + 2 + \cdots + n = \frac{n(n + 1)}{2}$ (chapitre 3).

    **Si $n$ est impair**, $\frac{n + 1}{2}$ est un entier, et $S = n \times \frac{n + 1}{2}$ est un multiple de $n$.

    **Si $n$ est pair**, on écrit $n = 2m$ : alors $S = m(2m + 1) = n \times m + m$, avec $0 \leqslant m < n$. Par unicité de la division euclidienne, le reste est $m$. 
    $$\boxed{\text{le reste vaut } 0 \text{ si } n \text{ est impair, et } \frac{n}{2} \text{ si } n \text{ est pair}}$$
     *À retenir.* Pour lire un reste sur une égalité $S = nq + r$, il faut vérifier $0 \leqslant r < n$ ; c'est l'unicité du théorème 1 qui permet alors de conclure.
- id: "ma-12-04"
  feuille: "f-ma-12"
  numero: 4
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, nombres premiers]
  noeuds: [z-division, z-premiers]
  notions: [division-euclidienne, nombre-premier]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $n \geqslant 2$ un entier. Montrer que la somme de $n$ entiers naturels impairs consécutifs n'est jamais un nombre premier.

    **2.** Montrer que la somme des cubes de trois entiers consécutifs est divisible par $9$.
  corrige: |
    **1.** Soit $2k + 1$, avec $k \in \mathbb{N}$, le plus petit des $n$ entiers impairs consécutifs. Leur somme vaut 
    $$\sum_{j = 0}^{n - 1} (2k + 1 + 2j) = n(2k + 1) + n(n - 1) = n(2k + n).$$
     Les deux facteurs $n$ et $2k + n$ sont supérieurs ou égaux à $2$, donc la somme admet un diviseur $n$ différent de $1$ et d'elle-même : elle n'est pas première. 
    $$\boxed{\text{la somme vaut } n(2k + n), \text{ produit de deux entiers } \geqslant 2}$$

    **2.** Pour trois entiers consécutifs $n - 1$, $n$, $n + 1$, le développement donne 
    $$(n - 1)^{3} + n^{3} + (n + 1)^{3} = 3n^{3} + 6n = 3n(n^{2} + 2).$$
     Si $3 \mid n$, alors $9 \mid 3n$. Sinon $n \equiv \pm 1 \;[3]$, donc $n^{2} \equiv 1 \;[3]$ et $3 \mid n^{2} + 2$. Dans les deux cas, $9$ divise $3n(n^{2} + 2)$. 
    $$\boxed{(n - 1)^{3} + n^{3} + (n + 1)^{3} = 3n(n^{2} + 2) \equiv 0 \;[9]}$$
- id: "ma-12-05"
  feuille: "f-ma-12"
  numero: 5
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Résoudre dans $\mathbb{Z}^{2}$ les équations suivantes, d'inconnue $(n, p)$, en se ramenant à un produit de deux facteurs égal à une constante.

    **1.** $np = 3n + 2p$.

    **2.** $\dfrac{1}{n} + \dfrac{1}{p} = \dfrac{1}{5}$.

    **3.** $n^{2} - p^{2} - 4n - 2p = 5$.
  corrige: |
    **(i)** L'équation s'écrit $np - 3n - 2p + 6 = 6$, soit $(n - 2)(p - 3) = 6$. Le facteur $n - 2$ parcourt les diviseurs de $6$, c'est-à-dire $\pm 1$, $\pm 2$, $\pm 3$, $\pm 6$, et $p - 3$ vaut le quotient. 
    $$\boxed{(n, p) \in \{(3, 9), (4, 6), (5, 5), (8, 4), (1, -3), (0, 0), (-1, 1), (-4, 2)\}}$$

    **(ii)** L'équation impose $n \neq 0$ et $p \neq 0$, et s'écrit alors $5(n + p) = np$, soit $(n - 5)(p - 5) = 25$. Les diviseurs de $25$ sont $\pm 1$, $\pm 5$, $\pm 25$ ; le couple $n - 5 = p - 5 = -5$ donne $n = p = 0$, qu'il faut exclure. 
    $$\boxed{(n, p) \in \{(6, 30), (10, 10), (30, 6), (4, -20), (-20, 4)\}}$$

    **(iii)** On complète les carrés : $(n - 2)^{2} - (p + 1)^{2} = 5 + 4 - 1 = 8$, soit 
    $$(n - p - 3)(n + p - 1) = 8.$$
     Les deux facteurs $A = n - p - 3$ et $B = n + p - 1$ ont pour somme $2n - 4$, qui est paire : ils ont la même parité, donc sont tous deux pairs, puisque leur produit est pair. Il reste 
    $$(A, B) \in \{(2, 4), (4, 2), (-2, -4), (-4, -2)\}, \qquad \text{avec } n = \frac{A + B + 4}{2} \text{ et } p = \frac{B - A - 2}{2}.$$

    $$\boxed{(n, p) \in \{(5, 0), (5, -2), (-1, -2), (-1, 0)\}}$$
     *Piège.* Il ne faut pas oublier les diviseurs négatifs : dans $\mathbb{Z}$, l'équation $AB = 6$ a huit solutions, et non quatre. L'argument de parité de (iii) élimine d'emblée les couples $(1, 8)$, $(8, 1)$, etc.
- id: "ma-12-06"
  feuille: "f-ma-12"
  numero: 6
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Montrer que, pour tout entier $n \geqslant 1$, $n^{2}$ divise $(n + 1)^{n} - 1$.
  corrige: |
    La formule du binôme (chapitre 3, théorème 2) donne 
    $$(n + 1)^{n} - 1 = \sum_{k = 1}^{n} \binom{n}{k} n^{k} = \binom{n}{1} n + \sum_{k = 2}^{n} \binom{n}{k} n^{k} = n^{2} + n^{2} \sum_{k = 2}^{n} \binom{n}{k} n^{k - 2}.$$
     Les deux termes sont des multiples de $n^{2}$. 
    $$\boxed{n^{2} \mid (n + 1)^{n} - 1}$$
     *À retenir.* Tout repose sur le terme $k = 1$, qui vaut $n \times n$ : c'est le coefficient binomial $\binom{n}{1} = n$ qui fournit le second facteur $n$.
- id: "ma-12-07"
  feuille: "f-ma-12"
  numero: 7
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, écriture en base b]
  noeuds: [z-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Écriture en base $b$.* Soit $b \geqslant 2$ un entier.

    **1.** Montrer que tout entier $n \in \mathbb{N}^{*}$ s'écrit de façon unique sous la forme 
    $$n = \sum_{k = 0}^{m} c_{k}b^{k}, \qquad \text{avec } m \in \mathbb{N}, \ c_{0}, \dots, c_{m} \in [\![0\,;b - 1]\!] \text{ et } c_{m} \neq 0.$$
     On pourra effectuer les divisions euclidiennes successives de $n$ par $b$, puis du quotient par $b$, et ainsi de suite.

    **2.** Écrire $2026$ en base $7$.

    **3.** Montrer que $b - 1$ divise $n - (c_{0} + c_{1} + \cdots + c_{m})$. Quel critère de divisibilité retrouve-t-on pour $b = 10$ ?
  corrige: |
    **1.** *Existence*, par récurrence forte sur $n$. Si $n < b$, l'écriture $n = c_{0}$ convient. Sinon, la division euclidienne donne $n = bq + c_{0}$ avec $0 \leqslant c_{0} < b$ et $1 \leqslant q < n$ ; l'hypothèse de récurrence écrit $q = \sum_{k = 0}^{m'} d_{k}b^{k}$, et l'on obtient $n = c_{0} + \sum_{k = 0}^{m'} d_{k}b^{k + 1}$.

    *Unicité*, encore par récurrence forte. Si $n = \sum_{k = 0}^{m} c_{k}b^{k}$, alors $n = b \Big(\sum_{k = 1}^{m} c_{k}b^{k - 1}\Big) + c_{0}$ avec $0 \leqslant c_{0} < b$ : c'est la division euclidienne de $n$ par $b$. Par unicité du théorème 1, $c_{0}$ est le reste et $\sum_{k \geqslant 1} c_{k}b^{k - 1}$ le quotient, entier strictement plus petit que $n$ dont l'écriture est unique par hypothèse de récurrence (s'il est nul, $m = 0$).

    **2.** On divise successivement par $7$ : 
    $$2026 = 7 \times 289 + 3, \qquad 289 = 7 \times 41 + 2, \qquad 41 = 7 \times 5 + 6, \qquad 5 = 7 \times 0 + 5.$$
     Les restes, lus de bas en haut, donnent les chiffres. 
    $$\boxed{2026 = \overline{5623}^{\,7} = 5 \times 7^{3} + 6 \times 7^{2} + 2 \times 7 + 3}$$
     Vérification : $1715 + 294 + 14 + 3 = 2026$. ✓

    **3.** Comme $b \equiv 1 \;[b - 1]$, on a $b^{k} \equiv 1 \;[b - 1]$ pour tout $k$ (chapitre 2, proposition 10), donc $n = \sum c_{k}b^{k} \equiv \sum c_{k} \;[b - 1]$. 
    $$\boxed{b - 1 \mid n - (c_{0} + c_{1} + \cdots + c_{m})}$$
     Pour $b = 10$, on retrouve le critère de divisibilité par $9$, et donc par $3$ : un entier et la somme de ses chiffres ont le même reste modulo $9$, comme l'exemple de la section 12.6 du cours l'a montré.
- id: "ma-12-08"
  feuille: "f-ma-12"
  numero: 8
  partie: "PGCD, PPCM et relation de Bézout"
  etoiles: 1
  types: [Calcul]
  mots_cles: [PGCD et Bézout, "PGCD et algorithme d'Euclide", Bézout]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour chacun des couples $(a, b)$ suivants, calculer $a \wedge b$ par l'algorithme d'Euclide, puis obtenir une relation de Bézout en remontant l'algorithme.

    (i) $(438, 51)$ (ii) $(1320, 720)$ (iii) $(120, 23)$ (iv) $(8136, 492)$
  corrige: |
    Dans chaque cas, on écrit l'algorithme d'Euclide en numérotant les lignes, puis on isole le dernier reste non nul et l'on remonte, en remplaçant à chaque étape le plus petit reste par son expression tirée de la ligne au-dessus.

    **(i)** On a 
    $$438 = 8 \times 51 + 30, \quad 51 = 1 \times 30 + 21, \quad 30 = 1 \times 21 + 9, \quad 21 = 2 \times 9 + 3, \quad 9 = 3 \times 3.$$
     Le dernier reste non nul est $3$, et la remontée donne 
    $$3 = 21 - 2 \times 9 = 3 \times 21 - 2 \times 30 = 3 \times 51 - 5 \times 30 = 43 \times 51 - 5 \times 438.$$

    $$\boxed{438 \wedge 51 = 3 = 438 \times (-5) + 51 \times 43}$$

    **(ii)** On a $1320 = 1 \times 720 + 600$, $720 = 1 \times 600 + 120$ et $600 = 5 \times 120$, puis 
    $$120 = 720 - 600 = 720 - (1320 - 720) = 2 \times 720 - 1320.$$

    $$\boxed{1320 \wedge 720 = 120 = 1320 \times (-1) + 720 \times 2}$$

    **(iii)** On a 
    $$120 = 5 \times 23 + 5, \quad 23 = 4 \times 5 + 3, \quad 5 = 1 \times 3 + 2, \quad 3 = 1 \times 2 + 1, \quad 2 = 2 \times 1,$$
     puis 
    $$1 = 3 - 2 = 2 \times 3 - 5 = 2 \times 23 - 9 \times 5 = 47 \times 23 - 9 \times 120.$$

    $$\boxed{120 \wedge 23 = 1 = 120 \times (-9) + 23 \times 47}$$

    **(iv)** On a 
    $$8136 = 16 \times 492 + 264, \quad 492 = 1 \times 264 + 228, \quad 264 = 1 \times 228 + 36, \quad 228 = 6 \times 36 + 12, \quad 36 = 3 \times 12,$$
     puis 
    $$12 = 228 - 6 \times 36 = 7 \times 228 - 6 \times 264 = 7 \times 492 - 13 \times 264 = 215 \times 492 - 13 \times 8136.$$

    $$\boxed{8136 \wedge 492 = 12 = 8136 \times (-13) + 492 \times 215}$$
     Vérification : $105\,780 - 105\,768 = 12$. ✓

    *À retenir.* Le couple de Bézout n'est pas unique : en (ii), $(-1 + 6k, \ 2 - 11k)$ convient aussi pour tout $k$, puisque $1320 \times 6 = 720 \times 11$. Ce qu'on obtient en remontant n'est qu'un couple parmi d'autres ; la section 12.4 décrit tous les autres.
- id: "ma-12-09"
  feuille: "f-ma-12"
  numero: 9
  partie: "PGCD, PPCM et relation de Bézout"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [PGCD et Bézout, "PGCD et algorithme d'Euclide", Bézout, nombres premiers]
  noeuds: [z-bezout, z-premiers]
  notions: [pgcd, nombre-premier]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $k \in \mathbb{N}$. Montrer que $2k + 1$ et $9k + 4$ sont premiers entre eux, et calculer $(2k - 1) \wedge (9k + 4)$.
  corrige: |
    On cherche une combinaison qui élimine $k$ : $9(2k + 1) - 2(9k + 4) = 1$. Tout diviseur commun divise donc $1$ (proposition 1), et 
    $$\boxed{(2k + 1) \wedge (9k + 4) = 1}$$

    De même, $2(9k + 4) - 9(2k - 1) = 17$, donc $d = (2k - 1) \wedge (9k + 4)$ divise $17$, qui est premier : $d \in \{1, 17\}$. Or $17 \mid 2k - 1$ équivaut à $2k \equiv 1 \;[17]$, soit, en multipliant par $9$, inverse de $2$ modulo $17$, à $k \equiv 9 \;[17]$. Dans ce cas, $9k + 4 \equiv 85 \equiv 0 \;[17]$, donc $17$ divise aussi $9k + 4$. 
    $$\boxed{(2k - 1) \wedge (9k + 4) = \begin{cases} 17 & \text{si } k \equiv 9 \;[17], \\ 1 & \text{sinon.} \end{cases}}$$
     Vérification : pour $k = 9$, $17 \wedge 85 = 17$. ✓
- id: "ma-12-10"
  feuille: "f-ma-12"
  numero: 10
  partie: "PGCD, PPCM et relation de Bézout"
  etoiles: 2
  types: [Calcul]
  mots_cles: [PGCD et Bézout, "PGCD et algorithme d'Euclide"]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour $n \in \mathbb{N}$, on pose $u_{n} = n^{2} + 1$. Déterminer, selon les valeurs de $n$, le PGCD de deux termes consécutifs $u_{n} \wedge u_{n + 1}$.
  corrige: |
    Soit $d = u_{n} \wedge u_{n + 1}$. Il divise $u_{n + 1} - u_{n} = 2n + 1$, puis 
    $$4u_{n} - (2n + 1)(2n - 1) = 4n^{2} + 4 - (4n^{2} - 1) = 5.$$
     Donc $d \in \{1, 5\}$. On cherche quand $5$ divise les deux termes. Les carrés modulo $5$ valent $0, 1, 4, 4, 1$ pour $n \equiv 0, 1, 2, 3, 4$, donc $5 \mid n^{2} + 1$ si et seulement si $n \equiv 2$ ou $3 \;[5]$, et $5 \mid (n + 1)^{2} + 1$ si et seulement si $n \equiv 1$ ou $2 \;[5]$. 
    $$\boxed{u_{n} \wedge u_{n + 1} = 5 \text{ si } n \equiv 2 \;[5], \quad 1 \text{ sinon}}$$
     Vérification : $u_{2} \wedge u_{3} = 5 \wedge 10 = 5$, et $u_{7} \wedge u_{8} = 50 \wedge 65 = 5$. ✓
- id: "ma-12-11"
  feuille: "f-ma-12"
  numero: 11
  partie: "PGCD, PPCM et relation de Bézout"
  etoiles: 2
  types: [Calcul]
  mots_cles: [PGCD et Bézout, divisibilité, "PGCD et algorithme d'Euclide"]
  noeuds: [z-bezout, z-division]
  notions: [pgcd]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Déterminer l'ensemble $\{(2n + 4) \wedge (3n + 3) \mid n \in \mathbb{N}\}$.
  corrige: |
    Soit $d_{n} = (2n + 4) \wedge (3n + 3)$. Il divise $3(2n + 4) - 2(3n + 3) = 6$, donc $d_{n} \in \{1, 2, 3, 6\}$. Les quatre valeurs sont atteintes : $d_{0} = 4 \wedge 3 = 1$, $d_{1} = 6 \wedge 6 = 6$, $d_{3} = 10 \wedge 12 = 2$ et $d_{4} = 12 \wedge 15 = 3$. 
    $$\boxed{\{(2n + 4) \wedge (3n + 3) \mid n \in \mathbb{N}\} = \{1, 2, 3, 6\}}$$
     *À retenir.* La combinaison qui élimine $n$ ne donne qu'un multiple du PGCD ; il faut ensuite vérifier quelles valeurs sont réellement atteintes. Ici, $2 \mid d_{n}$ si et seulement si $n$ est impair, et $3 \mid d_{n}$ si et seulement si $n \equiv 1 \;[3]$.
- id: "ma-12-12"
  feuille: "f-ma-12"
  numero: 12
  partie: "PGCD, PPCM et relation de Bézout"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [PGCD et Bézout, divisibilité, écriture en base b, "PGCD et algorithme d'Euclide", suite de Fibonacci]
  noeuds: [z-bezout, z-division, n-recurrence]
  notions: [pgcd]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *Le théorème de Lamé.* On note $(F_{n})_{n \in \mathbb{N}}$ la suite de Fibonacci, définie par $F_{0} = 0$, $F_{1} = 1$ et $F_{n + 2} = F_{n + 1} + F_{n}$ pour tout $n \in \mathbb{N}$. Soit $a > b \geqslant 1$ deux entiers. On note $r_{0} = a$, $r_{1} = b$, et l'on suppose que l'algorithme d'Euclide comporte $N$ divisions : 
    $$r_{k - 1} = q_{k}r_{k} + r_{k + 1} \quad \text{avec } 0 \leqslant r_{k + 1} < r_{k}, \quad \text{pour } k \in [\![1\,;N]\!], \qquad r_{N} \neq 0, \quad r_{N + 1} = 0.$$

    **1.** Montrer que $r_{N} \geqslant 1$, que $r_{N - 1} \geqslant 2$ et que $r_{k - 1} \geqslant r_{k} + r_{k + 1}$ pour tout $k \in [\![1\,;N - 1]\!]$.

    **2.** En déduire que $b \geqslant F_{N + 1}$. Vérifier sur l'exemple $a = 21$, $b = 13$ de l'introduction du cours que cette inégalité peut être une égalité.

    **3.** Montrer que $F_{n + 5} > 10\,F_{n}$ pour tout $n \geqslant 2$.

    **4.** En déduire que, si $b$ s'écrit avec $k$ chiffres en base $10$, alors $N \leqslant 5k$.
  corrige: |
    **1.** Le dernier reste non nul $r_{N}$ est un entier naturel non nul, donc $r_{N} \geqslant 1$. La dernière division s'écrit $r_{N - 1} = q_{N}r_{N}$, avec $r_{N - 1} > r_{N}$ : le quotient vérifie $q_{N} \geqslant 2$, d'où $r_{N - 1} \geqslant 2r_{N} \geqslant 2$. Enfin, pour $k \leqslant N - 1$, le quotient $q_{k}$ est non nul puisque $r_{k - 1} > r_{k}$, donc $r_{k - 1} = q_{k}r_{k} + r_{k + 1} \geqslant r_{k} + r_{k + 1}$. 
    $$\boxed{r_{N} \geqslant 1 = F_{2}, \qquad r_{N - 1} \geqslant 2 = F_{3}, \qquad r_{k - 1} \geqslant r_{k} + r_{k + 1}}$$

    **2.** On montre par récurrence descendante sur $k$, de $N$ à $1$, que $r_{k} \geqslant F_{N - k + 2}$. C'est vrai pour $k = N$ et $k = N - 1$ d'après la question 1. Si c'est vrai aux rangs $k$ et $k + 1$, avec $k \geqslant 2$, alors 
    $$r_{k - 1} \geqslant r_{k} + r_{k + 1} \geqslant F_{N - k + 2} + F_{N - k + 1} = F_{N - k + 3}.$$
     Pour $k = 1$, on obtient $b = r_{1} \geqslant F_{N + 1}$. 
    $$\boxed{b \geqslant F_{N + 1}}$$
     Pour $a = 21$ et $b = 13$, l'algorithme comporte $N = 6$ divisions, de quotients $1, 1, 1, 1, 1, 2$, et $F_{7} = 13 = b$ : l'inégalité est une égalité. C'est pourquoi deux nombres de Fibonacci consécutifs sont le cas le plus lent de l'algorithme, comme l'annonçait l'introduction du cours.

    **3.** En itérant la relation de récurrence, $F_{n + 5} = 5F_{n + 1} + 3F_{n} = 8F_{n} + 5F_{n - 1}$. Pour $n \geqslant 2$, on a $F_{n - 1} \geqslant 1$ et $F_{n} = F_{n - 1} + F_{n - 2} \leqslant 2F_{n - 1}$, donc $5F_{n - 1} > 4F_{n - 1} \geqslant 2F_{n}$. 
    $$\boxed{F_{n + 5} = 8F_{n} + 5F_{n - 1} > 10\,F_{n}}$$

    **4.** Par récurrence sur $j$, la question 3 donne $F_{5j + 2} > 10^{j}F_{2} = 10^{j}$ pour tout $j \geqslant 1$. Si $b$ a $k$ chiffres, alors $b < 10^{k}$. Si l'on avait $N \geqslant 5k + 1$, la suite de Fibonacci étant croissante, on aurait 
    $$b \geqslant F_{N + 1} \geqslant F_{5k + 2} > 10^{k},$$
     ce qui est absurde. 
    $$\boxed{N \leqslant 5k}$$
     *À retenir.* Le nombre d'étapes de l'algorithme d'Euclide croît comme le nombre de chiffres, c'est-à-dire comme le logarithme des entiers, et non comme les entiers eux-mêmes : c'est ce qui le rend utilisable sur des nombres de plusieurs centaines de chiffres, en cryptographie par exemple.
- id: "ma-12-13"
  feuille: "f-ma-12"
  numero: 13
  partie: "Entiers premiers entre eux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, Bézout, nombres premiers]
  noeuds: [z-bezout, z-premiers]
  notions: [pgcd, nombre-premier]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $n \in \mathbb{N}^{*}$.

    **1.** Montrer que $n^{2} + n$ et $2n + 1$ sont premiers entre eux.

    **2.** Montrer que $3n^{2} + 2n$ et $n + 1$ sont premiers entre eux.
  corrige: |
    Dans les deux cas, on exhibe une relation de Bézout, et le théorème 4 conclut.

    **1.** On a $(2n + 1)^{2} = 4(n^{2} + n) + 1$, d'où 
    $$\boxed{(2n + 1) \times (2n + 1) + (n^{2} + n) \times (-4) = 1}$$

    **2.** La division de $3n^{2} + 2n$ par $n + 1$ donne $3n^{2} + 2n = (n + 1)(3n - 1) + 1$, d'où 
    $$\boxed{(3n^{2} + 2n) \times 1 + (n + 1) \times (1 - 3n) = 1}$$
- id: "ma-12-14"
  feuille: "f-ma-12"
  numero: 14
  partie: "Entiers premiers entre eux"
  etoiles: 1
  types: [Calcul]
  mots_cles: [entiers premiers entre eux]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Résoudre dans $\mathbb{Z}^{2}$ les équations suivantes, d'inconnue $(x, y)$.

    (i) $221x + 247y = 15$ (ii) $221x + 247y = 13$ (iii) $27x - 33y = 99$ (iv) $5x + 3y = 4$
  corrige: |
    On applique la méthode du cours (section 12.4) : on calcule le PGCD, on cherche une solution particulière, puis on conclut par le lemme de Gauss.

    **(i)** L'algorithme d'Euclide donne $247 = 221 + 26$, $221 = 8 \times 26 + 13$ et $26 = 2 \times 13$, donc $221 \wedge 247 = 13$. Comme $13$ divise $221x + 247y$ pour tous entiers $x$ et $y$, et ne divise pas $15$ : 
    $$\boxed{\text{l'équation } 221x + 247y = 15 \text{ n'a aucune solution}}$$

    **(ii)** On divise par $13$ : l'équation équivaut à $17x + 19y = 1$. En remontant l'algorithme $19 = 17 + 2$, $17 = 8 \times 2 + 1$, on trouve 
    $$1 = 17 - 8 \times 2 = 17 - 8 \times (19 - 17) = 17 \times 9 + 19 \times (-8).$$
     Si $(x, y)$ est solution, $17(x - 9) = -19(y + 8)$ ; comme $17 \wedge 19 = 1$, le lemme de Gauss donne $19 \mid x - 9$, soit $x = 9 + 19k$, puis $y = -8 - 17k$. Réciproquement, ces couples conviennent. 
    $$\boxed{\mathcal{S} = \{(9 + 19k, \ -8 - 17k) \mid k \in \mathbb{Z}\}}$$

    **(iii)** On divise par $3 = 27 \wedge 33$ : l'équation équivaut à $9x - 11y = 33$, qui a la solution évidente $(0, -3)$. Si $(x, y)$ est solution, $9x = 11(y + 3)$, donc $11 \mid x$ par le lemme de Gauss : $x = 11k$, puis $y = 9k - 3$. 
    $$\boxed{\mathcal{S} = \{(11k, \ 9k - 3) \mid k \in \mathbb{Z}\}}$$

    **(iv)** Le couple $(2, -2)$ est solution. Si $(x, y)$ en est une autre, $5(x - 2) = -3(y + 2)$, donc $3 \mid x - 2$. 
    $$\boxed{\mathcal{S} = \{(2 + 3k, \ -2 - 5k) \mid k \in \mathbb{Z}\}}$$
     *Piège.* En (iii), l'erreur la plus répandue est de chercher un couple de Bézout de $27$ et $33$ avant de simplifier : on gagne du temps en divisant d'abord l'équation par le PGCD, qui divise bien $99$.
- id: "ma-12-15"
  feuille: "f-ma-12"
  numero: 15
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Montrer que, pour tout $n \in \mathbb{N}$, l'entier $n^{4} - n^{2}$ est un multiple de $12$.
  corrige: |
    On factorise : $n^{4} - n^{2} = n^{2}(n - 1)(n + 1)$.

    *Divisibilité par $3$.* Parmi les trois entiers consécutifs $n - 1$, $n$, $n + 1$, l'un est multiple de $3$.

    *Divisibilité par $4$.* Si $n$ est pair, $4 \mid n^{2}$. Si $n$ est impair, $n - 1$ et $n + 1$ sont pairs, et $4 \mid (n - 1)(n + 1)$.

    Comme $3 \wedge 4 = 1$, la proposition 7 (i) conclut. 
    $$\boxed{12 \mid n^{4} - n^{2}}$$
     *Piège.* On ne peut pas remplacer $3$ et $4$ par $2$ et $6$ : un entier divisible par $2$ et par $6$ n'est pas nécessairement divisible par $12$ ($6$ en est un exemple). L'hypothèse « premiers entre eux » est indispensable.
- id: "ma-12-16"
  feuille: "f-ma-12"
  numero: 16
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Calcul]
  mots_cles: [entiers premiers entre eux, "PGCD et algorithme d'Euclide", PPCM]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $m, d \in \mathbb{N}^{*}$. À quelle condition le système 
    $$\left\{ \begin{array}{l} x \wedge y = d \\ x \vee y = m \end{array} \right.$$
     possède-t-il une solution $(x, y) \in (\mathbb{N}^{*})^{2}$ ?

    **2.** Déterminer les couples $(x, y) \in (\mathbb{N}^{*})^{2}$ tels que $x \wedge y = 12$ et $x \vee y = 360$.

    **3.** Déterminer les couples $(x, y) \in (\mathbb{N}^{*})^{2}$ tels que $x \wedge y = 18$ et $x + y = 360$.
  corrige: |
    **1.** Si $(x, y)$ est solution, $d$ divise $x$, qui divise $m$ : il faut $d \mid m$. Réciproquement, si $d \mid m$, le couple $(d, m)$ convient, puisque $d \wedge m = d$ et $d \vee m = m$. 
    $$\boxed{\text{le système a une solution si et seulement si } d \mid m}$$

    **2.** On écrit $x = 12a$ et $y = 12b$ avec $a \wedge b = 1$ (proposition 5). Alors $x \vee y = 12ab$ d'après la proposition 7 (iii), et la condition devient $ab = 30$ avec $a \wedge b = 1$. Comme $30 = 2 \times 3 \times 5$, chaque facteur premier va entièrement dans $a$ ou dans $b$ : il y a $2^{3} = 8$ couples $(a, b)$. 
    $$\boxed{(x, y) \in \{(12, 360), (24, 180), (36, 120), (60, 72)\} \text{ et les quatre couples symétriques}}$$

    **3.** De même $x = 18a$, $y = 18b$ avec $a \wedge b = 1$ et $a + b = 20$. Or $a \wedge b = a \wedge (a + b) = a \wedge 20$ (proposition 4) : il faut que $a$ soit impair et non multiple de $5$, avec $1 \leqslant a \leqslant 19$, soit $a \in \{1, 3, 7, 9, 11, 13, 17, 19\}$. 
    $$\boxed{(x, y) \in \{(18, 342), (54, 306), (126, 234), (162, 198), (198, 162), (234, 126), (306, 54), (342, 18)\}}$$
- id: "ma-12-17"
  feuille: "f-ma-12"
  numero: 17
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Calcul]
  mots_cles: [entiers premiers entre eux, "PGCD et algorithme d'Euclide", PPCM]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Résoudre dans $(\mathbb{N}^{*})^{2}$ les équations suivantes, d'inconnue $(x, y)$.

    **1.** $x \wedge y + x \vee y = x + y$.

    **2.** $x \wedge y + x \vee y = y + 9$.
  corrige: |
    On note $d = x \wedge y$, et l'on écrit $x = da$, $y = db$ avec $a \wedge b = 1$ ; alors $x \vee y = dab$.

    **(i)** Comme $d \times (x \vee y) = xy$, l'équation, multipliée par $d$, devient $d^{2} + xy = dx + dy$, c'est-à-dire $(x - d)(y - d) = 0$. Ainsi $x = d$ ou $y = d$, c'est-à-dire $x \mid y$ ou $y \mid x$. 
    $$\boxed{\mathcal{S} = \{(x, y) \in (\mathbb{N}^{*})^{2} \mid x \text{ divise } y \text{ ou } y \text{ divise } x\}}$$

    **(ii)** L'équation s'écrit $d + dab = db + 9$, soit $d\big(1 + b(a - 1)\big) = 9$. Le diviseur $d$ de $9$ vaut $1$, $3$ ou $9$.

    • Si $d = 9$ : $b(a - 1) = 0$, donc $a = 1$, et $b$ est quelconque. On obtient $(9, 9b)$.

    • Si $d = 3$ : $b(a - 1) = 2$, donc $(a, b) = (3, 1)$ ou $(2, 2)$ ; le second est exclu car $2 \wedge 2 \neq 1$. On obtient $(9, 3)$.

    • Si $d = 1$ : $b(a - 1) = 8$, donc $(a, b) \in \{(9, 1), (5, 2), (3, 4), (2, 8)\}$, et l'on exclut $(2, 8)$. On obtient $(9, 1)$, $(5, 2)$ et $(3, 4)$.

    $$\boxed{\mathcal{S} = \{(9, 9b) \mid b \in \mathbb{N}^{*}\} \cup \{(9, 3), (9, 1), (5, 2), (3, 4)\}}$$
     Vérification : pour $(5, 2)$, $1 + 10 = 2 + 9$ ; pour $(9, 3)$, $3 + 9 = 3 + 9$. ✓

    *Piège.* L'erreur la plus répandue est d'oublier la condition $a \wedge b = 1$ en fin de calcul : le couple $(a, b) = (2, 8)$ donnerait $(x, y) = (2, 8)$, pour lequel $2 + 8 \neq 8 + 9$.
- id: "ma-12-18"
  feuille: "f-ma-12"
  numero: 18
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, "PGCD et algorithme d'Euclide", PPCM]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $a$ et $b$ deux entiers naturels non nuls. Montrer que $(a + b) \wedge (a \vee b) = a \wedge b$.
  corrige: |
    Soit $d = a \wedge b$, $a = da'$, $b = db'$ avec $a' \wedge b' = 1$. Alors $a + b = d(a' + b')$ et $a \vee b = da'b'$ (proposition 7 (iii)), donc, d'après la proposition 5, 
    $$(a + b) \wedge (a \vee b) = d \times \big((a' + b') \wedge a'b'\big).$$
     Or $(a' + b') \wedge a' = b' \wedge a' = 1$ et de même $(a' + b') \wedge b' = 1$ (proposition 4), donc $(a' + b') \wedge a'b' = 1$ par la proposition 7 (ii). 
    $$\boxed{(a + b) \wedge (a \vee b) = a \wedge b}$$
     *À retenir.* Le réflexe « on divise par le PGCD » ramène presque toujours une question sur $a$ et $b$ à une question sur deux entiers premiers entre eux, où le lemme de Gauss et la proposition 7 s'appliquent.
- id: "ma-12-19"
  feuille: "f-ma-12"
  numero: 19
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, Bézout, nombres premiers]
  noeuds: [z-bezout, z-premiers]
  notions: [pgcd, nombre-premier]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Montrer que tout entier $n > 6$ est la somme de deux entiers strictement supérieurs à $1$ et premiers entre eux.
  corrige: |
    On distingue selon le reste de $n$ modulo $4$. Dans chaque cas, les deux entiers proposés sont strictement supérieurs à $1$ dès que $n > 6$, et leur PGCD divise leur différence.

    • Si $n = 2k + 1$ est impair, $n = k + (k + 1)$ ; deux entiers consécutifs sont premiers entre eux.

    • Si $n = 4k$, $n = (2k - 1) + (2k + 1)$ : le PGCD divise $2$, et les deux entiers sont impairs, donc il vaut $1$.

    • Si $n = 4k + 2$, $n = (2k - 1) + (2k + 3)$ : le PGCD divise $4$, et les deux entiers sont impairs, donc il vaut $1$. Pour $n \geqslant 10$, on a bien $2k - 1 \geqslant 3$.

    $$\boxed{n = k + (k + 1), \quad (2k - 1) + (2k + 1) \quad \text{ou} \quad (2k - 1) + (2k + 3)}$$
     *Piège.* Pour $n = 6 = 4 + 2$, la troisième décomposition donnerait $1 + 5$, avec $1$ exclu ; et $6$ ne s'écrit ni $2 + 4$, ni $3 + 3$ avec des entiers premiers entre eux. C'est pourquoi l'énoncé impose $n > 6$.
- id: "ma-12-20"
  feuille: "f-ma-12"
  numero: 20
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Calcul]
  mots_cles: [entiers premiers entre eux]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Résoudre l'équation $3x + 4y + 5z = 6$, d'inconnue $(x, y, z) \in \mathbb{Z}^{3}$.
  corrige: |
    On fixe $z \in \mathbb{Z}$ et l'on résout $3x + 4y = 6 - 5z$. Le couple $(-1, 1)$ vérifie $3x + 4y = 1$, donc $\big(-(6 - 5z), \ 6 - 5z\big)$ est une solution particulière. Comme à l'exercice 14, le lemme de Gauss donne alors toutes les solutions : $x = 5z - 6 + 4k$, $y = 6 - 5z - 3k$, avec $k \in \mathbb{Z}$. 
    $$\boxed{\mathcal{S} = \{(5z - 6 + 4k, \ 6 - 5z - 3k, \ z) \mid (k, z) \in \mathbb{Z}^{2}\}}$$
     Vérification : $3(5z - 6 + 4k) + 4(6 - 5z - 3k) + 5z = 6$. ✓

    *À retenir.* Les solutions dépendent de deux paramètres entiers : c'est l'analogue, dans $\mathbb{Z}^{3}$, d'un plan, alors que les solutions de $ax + by = c$ forment une « droite » de points entiers à un paramètre.
- id: "ma-12-21"
  feuille: "f-ma-12"
  numero: 21
  partie: "Entiers premiers entre eux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, divisibilité, irrationalité]
  noeuds: [z-bezout, z-division, q-irrationnel]
  notions: [pgcd]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $a_{0}, \dots, a_{n - 1}$ des nombres entiers et $x \in \mathbb{Q}$ tel que $x^{n} + a_{n - 1}x^{n - 1} + \cdots + a_{1}x + a_{0} = 0$. Montrer que $x \in \mathbb{Z}$, et que $x$ divise $a_{0}$.

    **2.** En déduire que l'équation $x^{3} + x + 1 = 0$ n'a aucune solution rationnelle, puis que $\sqrt[3]{5}$ est irrationnel.
  corrige: |
    **1.** On écrit $x = \frac{p}{q}$ sous forme irréductible (proposition 6), avec $q \geqslant 1$. En multipliant l'équation par $q^{n}$ : 
    $$p^{n} = -q\big(a_{n - 1}p^{n - 1} + a_{n - 2}p^{n - 2}q + \cdots + a_{0}q^{n - 1}\big).$$
     Donc $q \mid p^{n}$. Comme $q \wedge p = 1$, on a $q \wedge p^{n} = 1$ (proposition 7 (ii)), et $q$, qui divise un entier avec lequel il est premier, vaut $1$. Ainsi $x \in \mathbb{Z}$, et $a_{0} = -x\big(x^{n - 1} + a_{n - 1}x^{n - 2} + \cdots + a_{1}\big)$ est un multiple de $x$. 
    $$\boxed{x \in \mathbb{Z} \quad \text{et} \quad x \mid a_{0}}$$

    **2.** Une solution rationnelle de $x^{3} + x + 1 = 0$ serait un diviseur de $1$, donc $\pm 1$ ; or $1 + 1 + 1 = 3$ et $-1 - 1 + 1 = -1$ ne sont pas nuls. De même, $\sqrt[3]{5}$ est solution de $x^{3} - 5 = 0$ : s'il était rationnel, ce serait un entier, compris strictement entre $1$ et $2$ puisque $1 < 5 < 8$. 
    $$\boxed{x^{3} + x + 1 = 0 \text{ n'a pas de solution rationnelle, et } \sqrt[3]{5} \notin \mathbb{Q}}$$
     *À retenir.* Le résultat demande que le coefficient de $x^{n}$ soit $1$ : l'équation $2x - 1 = 0$ a la solution rationnelle $\frac{1}{2}$. Le chapitre 13, sur les polynômes, en donnera la forme générale.
- id: "ma-12-22"
  feuille: "f-ma-12"
  numero: 22
  partie: "Entiers premiers entre eux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, divisibilité, "PGCD et algorithme d'Euclide"]
  noeuds: [z-bezout, z-division]
  notions: [pgcd]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soient $p$ et $q$ deux éléments de $\mathbb{N}^{*}$ avec $p > q$. On suppose que le quotient $\dfrac{p^{2} + q^{2}}{p^{2} - q^{2}}$ est un entier.

    **1.** Montrer que l'on peut se ramener au cas où $p \wedge q = 1$. On le supposera par la suite.

    **2.** Montrer que $(p^{2} - q^{2}) \wedge p^{2} = 1$.

    **3.** En déduire que $p^{2} - q^{2}$ divise $2$.

    **4.** Aboutir à une contradiction. Qu'a-t-on montré ?
  corrige: |
    **1.** Soit $d = p \wedge q$, et $p = dp'$, $q = dq'$ avec $p' \wedge q' = 1$ et $p' > q'$. Le quotient ne change pas : 
    $$\frac{p^{2} + q^{2}}{p^{2} - q^{2}} = \frac{d^{2}(p'^{2} + q'^{2})}{d^{2}(p'^{2} - q'^{2})} = \frac{p'^{2} + q'^{2}}{p'^{2} - q'^{2}}.$$

    **2.** Soit $\delta = (p^{2} - q^{2}) \wedge p^{2}$. Il divise $p^{2}$ et $p^{2} - (p^{2} - q^{2}) = q^{2}$. Or $p \wedge q = 1$ entraîne $p^{2} \wedge q^{2} = 1$, en appliquant deux fois la proposition 7 (ii). Donc $\delta = 1$. 
    $$\boxed{(p^{2} - q^{2}) \wedge p^{2} = 1}$$

    **3.** Notons $k$ l'entier $\frac{p^{2} + q^{2}}{p^{2} - q^{2}}$. Alors $2p^{2} = (p^{2} + q^{2}) + (p^{2} - q^{2}) = (k + 1)(p^{2} - q^{2})$, donc $p^{2} - q^{2}$ divise $2p^{2}$. Il est premier avec $p^{2}$ d'après la question 2, donc il divise $2$ par le lemme de Gauss. 
    $$\boxed{p^{2} - q^{2} \mid 2}$$

    **4.** Comme $p \geqslant q + 1$ et $q \geqslant 1$, on a $p^{2} - q^{2} \geqslant 2q + 1 \geqslant 3$, ce qui contredit la question 3. 
    $$\boxed{\text{pour tous } p > q \geqslant 1, \ \frac{p^{2} + q^{2}}{p^{2} - q^{2}} \text{ n'est jamais un entier}}$$
- id: "ma-12-23"
  feuille: "f-ma-12"
  numero: 23
  partie: "Entiers premiers entre eux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [entiers premiers entre eux, division euclidienne, divisibilité, "PGCD et algorithme d'Euclide", suite de Fibonacci]
  noeuds: [z-bezout, z-division, n-recurrence]
  notions: [pgcd, division-euclidienne]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *PGCD de nombres de Fibonacci.* Soit $(F_{n})_{n \in \mathbb{N}}$ la suite de Fibonacci de l'exercice 12, définie par 
    $$F_{0} = 0, \qquad F_{1} = 1 \qquad \text{et} \qquad \forall n \in \mathbb{N}, \ F_{n + 2} = F_{n + 1} + F_{n}.$$

    **1.** Montrer que $F_{n} \wedge F_{n + 1} = 1$ pour tout $n \in \mathbb{N}$.

    **2.** Montrer que, pour tout $n \in \mathbb{N}$ et tout $m \in \mathbb{N}^{*}$, $F_{n + m} = F_{m}F_{n + 1} + F_{m - 1}F_{n}$.

    **3.** En déduire que, pour tous $n, m \in \mathbb{N}^{*}$, $F_{n} \wedge F_{n + m} = F_{n} \wedge F_{m}$.

    **4.** En déduire que, si $n$ et $m$ sont deux entiers non nuls et si $r$ est le reste de la division euclidienne de $m$ par $n$, alors $F_{n} \wedge F_{m} = F_{n} \wedge F_{r}$.

    **5.** Montrer que, pour tous $m, n \in \mathbb{N}^{*}$, $F_{n} \wedge F_{m} = F_{n \wedge m}$.
  corrige: |
    **1.** Par récurrence : $F_{0} \wedge F_{1} = 0 \wedge 1 = 1$, et si $F_{n} \wedge F_{n + 1} = 1$, alors, d'après la proposition 4, 
    $$F_{n + 1} \wedge F_{n + 2} = F_{n + 1} \wedge (F_{n + 2} - F_{n + 1}) = F_{n + 1} \wedge F_{n} = 1.$$

    **2.** On fixe $n$ et l'on raisonne par récurrence double sur $m$. Pour $m = 1$, $F_{1}F_{n + 1} + F_{0}F_{n} = F_{n + 1}$ ; pour $m = 2$, $F_{2}F_{n + 1} + F_{1}F_{n} = F_{n + 1} + F_{n} = F_{n + 2}$. Si la formule est vraie aux rangs $m$ et $m + 1$, on les additionne : 
    $$F_{n + m + 2} = F_{n + m + 1} + F_{n + m} = (F_{m + 1} + F_{m})F_{n + 1} + (F_{m} + F_{m - 1})F_{n} = F_{m + 2}F_{n + 1} + F_{m + 1}F_{n}.$$

    **3.** Par la question 2 et la proposition 4, $F_{n} \wedge F_{n + m} = F_{n} \wedge (F_{m}F_{n + 1})$, puisque l'on retranche un multiple de $F_{n}$. Un diviseur commun à $F_{n}$ et $F_{m}$ divise évidemment $F_{m}F_{n + 1}$. Réciproquement, un diviseur commun $c$ à $F_{n}$ et $F_{m}F_{n + 1}$ est premier avec $F_{n + 1}$, puisqu'il divise $F_{n}$ et que $F_{n} \wedge F_{n + 1} = 1$ ; le lemme de Gauss donne $c \mid F_{m}$. Les deux couples ont donc les mêmes diviseurs communs. 
    $$\boxed{F_{n} \wedge F_{n + m} = F_{n} \wedge F_{m}}$$

    **4.** Si $m = qn + r$, on applique $q$ fois la question 3, en retranchant $n$ à l'indice à chaque fois : 
    $$F_{n} \wedge F_{m} = F_{n} \wedge F_{m - n} = \cdots = F_{n} \wedge F_{r}.$$
     Au dernier pas, si $r = 0$, on utilise directement $F_{n} \wedge F_{n} = F_{n} = F_{n} \wedge F_{0}$.

    **5.** La question 4 dit que le couple $(F_{m}, F_{n})$ se transforme comme le couple $(m, n)$ dans l'algorithme d'Euclide. On raisonne par récurrence forte sur $n$, pour tout $m$. Si $n \mid m$, alors $r = 0$ et $F_{n} \wedge F_{m} = F_{n} \wedge 0 = F_{n} = F_{n \wedge m}$. Sinon, $1 \leqslant r < n$, et l'hypothèse de récurrence appliquée au couple $(n, r)$ donne 
    $$F_{n} \wedge F_{m} = F_{r} \wedge F_{n} = F_{r \wedge n} = F_{n \wedge m},$$
     la dernière égalité venant de la proposition 4. 
    $$\boxed{F_{n} \wedge F_{m} = F_{n \wedge m}}$$
     Par exemple, $F_{12} \wedge F_{18} = 144 \wedge 2584 = 8 = F_{6}$. ✓

    *À retenir.* Le choix $F_{0} = 0$, $F_{1} = 1$ est essentiel. Avec la convention décalée $F_{0} = F_{1} = 1$, le résultat devient faux : on aurait $F_{2} \wedge F_{4} = 2 \wedge 5 = 1$, alors que $F_{2 \wedge 4} = F_{2} = 2$.
