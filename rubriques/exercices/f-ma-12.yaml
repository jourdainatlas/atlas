  page_corrige: 12
  enonce: |
    Soit $a$ et $b$ deux entiers naturels non nuls premiers entre eux, tels que $ab$ soit un carré parfait. Montrer que $a$ et $b$ sont deux carrés parfaits. Le résultat subsiste-t-il sans l'hypothèse $a \wedge b = 1$ ?
  corrige: |
    Pour tout nombre premier $p$, la proposition 10 donne $v_{p}(a) + v_{p}(b) = v_{p}(ab)$, qui est pair puisque $ab$ est un carré. Comme $a \wedge b = 1$, l'une des deux valuations est nulle (proposition 10 (iii)), donc l'autre est paire. Ainsi toutes les valuations de $a$ et de $b$ sont paires, et 
    $$\boxed{a = \prod_{p} p^{v_{p}(a)} = \Big(\prod_{p} p^{v_{p}(a)/2}\Big)^{2} \quad \text{et de même pour } b}$$
     Sans l'hypothèse, le résultat est faux : $2 \times 8 = 16$ est un carré, mais ni $2$ ni $8$ n'en est un. L'exercice 64 généralisera ce raisonnement aux puissances $n$-ièmes.
- id: "ma-12-33"
  feuille: "f-ma-12"
  numero: 33
  partie: "Nombres premiers"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [nombres premiers, divisibilité, décomposition en facteurs premiers, fonctions arithmétiques]
  noeuds: [z-premiers, z-division]
  notions: [nombre-premier]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. On note $\tau(n)$ le nombre de diviseurs positifs de $n$, et $\Pi(n)$ leur produit.

    **1.** Montrer que $\tau(n)$ est impair si et seulement si $n$ est un carré parfait.

    **2.** Montrer que $\Pi(n)^{2} = n^{\tau(n)}$. On pourra associer chaque diviseur $d$ de $n$ au diviseur $\dfrac{n}{d}$.

    **3.** Déterminer les entiers $n \geqslant 2$ tels que $\Pi(n) = n^{2}$.
  corrige: |
    **1.** Si $n = p_{1}^{\alpha_{1}} \cdots p_{r}^{\alpha_{r}}$, le théorème 6 donne $\tau(n) = (\alpha_{1} + 1) \cdots (\alpha_{r} + 1)$. Ce produit est impair si et seulement si tous les $\alpha_{i}$ sont pairs, c'est-à-dire si $n$ est un carré, comme à l'exercice 32. 
    $$\boxed{\tau(n) \text{ impair} \iff n \text{ carré parfait}}$$

    **2.** L'application $d \mapsto \frac{n}{d}$ est une bijection de l'ensemble des diviseurs positifs de $n$ sur lui-même, égale à sa propre réciproque. Donc $\Pi(n) = \prod_{d \mid n} \frac{n}{d}$, et 
    $$\Pi(n)^{2} = \prod_{d \mid n} d \times \prod_{d \mid n} \frac{n}{d} = \prod_{d \mid n} n = n^{\tau(n)}.$$

    $$\boxed{\Pi(n)^{2} = n^{\tau(n)}}$$

    **3.** Pour $n \geqslant 2$, l'égalité $\Pi(n) = n^{2}$ équivaut à $n^{\tau(n)} = n^{4}$, soit $\tau(n) = 4$. Comme $\tau(n) = \prod(\alpha_{i} + 1)$, il faut un seul facteur premier avec $\alpha_{1} = 3$, ou deux facteurs premiers avec $\alpha_{1} = \alpha_{2} = 1$. 
    $$\boxed{n = p^{3} \text{ ou } n = pq, \text{ avec } p \neq q \text{ premiers}}$$
     Par exemple, les diviseurs de $15$ sont $1, 3, 5, 15$, de produit $225 = 15^{2}$. ✓
- id: "ma-12-34"
  feuille: "f-ma-12"
  numero: 34
  partie: "Nombres premiers"
  etoiles: 2
  types: [Calcul]
  mots_cles: [nombres premiers, décomposition en facteurs premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $n \in \mathbb{N}$. Calculer la valuation $2$-adique de $5^{2^{n}} - 1$.
  corrige: |
    On note $u_{n} = 5^{2^{n}}$. Alors $u_{n + 1} - 1 = u_{n}^{2} - 1 = (u_{n} - 1)(u_{n} + 1)$. Comme $5 \equiv 1 \;[4]$, on a $u_{n} \equiv 1 \;[4]$, donc $u_{n} + 1 \equiv 2 \;[4]$ et $v_{2}(u_{n} + 1) = 1$. La proposition 10 (i) donne $v_{2}(u_{n + 1} - 1) = v_{2}(u_{n} - 1) + 1$, et $v_{2}(u_{0} - 1) = v_{2}(4) = 2$. 
    $$\boxed{v_{2}\big(5^{2^{n}} - 1\big) = n + 2}$$
     Vérification : $5^{2} - 1 = 24 = 2^{3} \times 3$ et $5^{4} - 1 = 624 = 2^{4} \times 39$. ✓
- id: "ma-12-35"
  feuille: "f-ma-12"
  numero: 35
  partie: "Nombres premiers"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [nombres premiers, décomposition en facteurs premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    *Formule de Legendre.* Soient $n \in \mathbb{N}^{*}$ et $p$ un nombre premier.

    **1.** Soit $\alpha \in \mathbb{N}$. Combien y a-t-il d'entiers dans $[\![1\,;n]\!]$ multiples de $p^{\alpha}$ ? Combien y a-t-il d'entiers de $p$-valuation égale à $\alpha$ ?

    **2.** En déduire que 
    $$v_{p}(n!) = \sum_{\alpha = 1}^{+\infty} \lfloor \frac{n}{p^{\alpha}} \rfloor,$$
     en expliquant pourquoi cette somme ne comporte qu'un nombre fini de termes non nuls.

    **3.** Combien de zéros consécutifs, à partir de la droite, compte l'écriture décimale du nombre $1000!$ ?

    **4.** Montrer que, pour tous $r$ et $s$ dans $\mathbb{N}$, le nombre $\dfrac{(2r)!\,(2s)!}{(r + s)!\,r!\,s!}$ est un entier.
  corrige: |
    **1.** Les multiples de $p^{\alpha}$ dans $[\![1\,;n]\!]$ sont les $kp^{\alpha}$ avec $1 \leqslant k \leqslant \frac{n}{p^{\alpha}}$ ; il y en a $\Big\lfloor \frac{n}{p^{\alpha}} \Big\rfloor$. Un entier a une $p$-valuation égale à $\alpha$ s'il est multiple de $p^{\alpha}$ sans l'être de $p^{\alpha + 1}$. 
    $$\boxed{\Big\lfloor \frac{n}{p^{\alpha}} \Big\rfloor \text{ multiples de } p^{\alpha}, \quad \Big\lfloor \frac{n}{p^{\alpha}} \Big\rfloor - \Big\lfloor \frac{n}{p^{\alpha + 1}} \Big\rfloor \text{ entiers de valuation } \alpha}$$

    **2.** Les termes sont nuls dès que $p^{\alpha} > n$. Par la proposition 10 (i), $v_{p}(n!) = \sum_{k = 1}^{n} v_{p}(k)$. On écrit $v_{p}(k)$ comme le nombre d'entiers $\alpha \geqslant 1$ tels que $p^{\alpha} \mid k$, et l'on échange les deux sommes finies : $v_{p}(n!)$ est le nombre de couples $(k, \alpha)$ tels que $p^{\alpha} \mid k$, et, pour chaque $\alpha$, il y a $\Big\lfloor \frac{n}{p^{\alpha}} \Big\rfloor$ entiers $k$ qui conviennent, d'après la question 1. 
    $$\boxed{v_{p}(n!) = \sum_{\alpha \geqslant 1} \Big\lfloor \frac{n}{p^{\alpha}} \Big\rfloor}$$

    **3.** Le nombre de zéros finaux est le plus grand entier $k$ tel que $10^{k} = 2^{k}5^{k}$ divise $1000!$, c'est-à-dire $\min\big(v_{2}(1000!), v_{5}(1000!)\big)$. La formule donne 
    $$v_{5}(1000!) = 200 + 40 + 8 + 1 = 249, \qquad v_{2}(1000!) = 500 + 250 + 125 + 62 + 31 + 15 + 7 + 3 + 1 = 994.$$

    $$\boxed{1000! \text{ se termine par } 249 \text{ zéros}}$$

    **4.** On montre d'abord que, pour tous réels $x, y \geqslant 0$, 
    $$\lfloor 2x \rfloor + \lfloor 2y \rfloor \geqslant \lfloor x \rfloor + \lfloor y \rfloor + \lfloor x + y \rfloor.$$
     En écrivant $x = \lfloor x \rfloor + a$ et $y = \lfloor y \rfloor + b$ avec $a, b \in [0, 1[$, les parties entières se simplifient, et l'inégalité équivaut à $\lfloor 2a \rfloor + \lfloor 2b \rfloor \geqslant \lfloor a + b \rfloor$. Si $a + b < 1$, le membre de droite est nul. Sinon, l'un des deux réels $a$ ou $b$ est supérieur à $\frac{1}{2}$, et le membre de gauche vaut au moins $1 = \lfloor a + b \rfloor$.

    On applique cette inégalité avec $x = \frac{r}{p^{\alpha}}$ et $y = \frac{s}{p^{\alpha}}$, puis on somme sur $\alpha$ : la question 2 donne, pour tout nombre premier $p$, 
    $$v_{p}\big((2r)!\,(2s)!\big) \geqslant v_{p}\big((r + s)!\,r!\,s!\big).$$
     D'après la proposition 10 (ii), le dénominateur divise le numérateur. 
    $$\boxed{\frac{(2r)!\,(2s)!}{(r + s)!\,r!\,s!} \in \mathbb{N}}$$
     Pour $s = 0$, on retrouve que $\binom{2r}{r} = \frac{(2r)!}{r!\,r!}$ est un entier. Pour $r = s = 1$, le quotient vaut $\frac{2 \times 2}{2} = 2$. ✓
- id: "ma-12-36"
  feuille: "f-ma-12"
  numero: 36
  partie: "Congruences"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [congruences, divisibilité, nombres premiers, décomposition en facteurs premiers]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [congruence, nombre-premier]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Rappeler et démontrer les critères de divisibilité par $2$, $3$, $4$, $5$, $6$, $8$, $9$, $10$ et $11$. Les utiliser pour obtenir, à la main, la décomposition en facteurs premiers de $14\,652$.
  corrige: |
    On écrit $n = \sum_{k = 0}^{m} c_{k}10^{k}$ en base $10$ et l'on utilise la compatibilité des congruences avec les opérations (chapitre 2, proposition 10).

    • Comme $10 \equiv 0 \;[2]$, $\;[5]$ et $\;[10]$, on a $n \equiv c_{0}$ modulo $2$, $5$ et $10$ : on regarde le dernier chiffre.

    • Comme $100 \equiv 0 \;[4]$ et $1000 \equiv 0 \;[8]$, on a $n \equiv \overline{c_{1}c_{0}} \;[4]$ et $n \equiv \overline{c_{2}c_{1}c_{0}} \;[8]$ : on regarde le nombre formé par les deux, ou les trois, derniers chiffres.

    • Comme $10 \equiv 1 \;[9]$, donc aussi modulo $3$, on a $n \equiv \sum c_{k}$ modulo $3$ et $9$ : on regarde la somme des chiffres.

    • Comme $10 \equiv -1 \;[11]$, on a $n \equiv \sum (-1)^{k}c_{k} \;[11]$ : on regarde la somme alternée des chiffres, en partant des unités.

    • Comme $2 \wedge 3 = 1$, un entier est divisible par $6$ si et seulement s'il l'est par $2$ et par $3$ (proposition 7 (i)).

    Pour $14\,652$ : le nombre $52$ est divisible par $4$, mais $652 = 8 \times 81 + 4$ ne l'est pas par $8$, donc $v_{2} = 2$ et $14\,652 = 4 \times 3663$. La somme des chiffres de $3663$ vaut $18$, donc $9 \mid 3663 = 9 \times 407$, et $4 + 0 + 7 = 11$ n'est pas multiple de $3$. La somme alternée de $407$ vaut $7 - 0 + 4 = 11$, donc $407 = 11 \times 37$, et $37$ est premier. 
    $$\boxed{14\,652 = 2^{2} \times 3^{2} \times 11 \times 37}$$
- id: "ma-12-37"
  feuille: "f-ma-12"
  numero: 37
  partie: "Congruences"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [congruences, divisibilité, nombres premiers]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [congruence, nombre-premier]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    **1.** Montrer que $13$ divise $2^{70} + 3^{70}$.

    **2.** Le nombre premier $2^{136\,279\,841} - 1$, découvert en octobre 2024, est le plus grand nombre premier connu au moment où cette feuille est écrite. Quel est son dernier chiffre ?

    **3.** Montrer que $19$ divise $2^{2^{6k + 2}} + 3$ pour tout $k \in \mathbb{N}$.
  corrige: |
    **1.** Modulo $13$, on a $2^{6} = 64 \equiv -1$, donc $2^{12} \equiv 1$, et $3^{3} = 27 \equiv 1$. Ainsi 
    $$2^{70} = (2^{12})^{5} \times 2^{10} \equiv 1024 \equiv 10, \qquad 3^{70} = (3^{3})^{23} \times 3 \equiv 3,$$
     et $2^{70} + 3^{70} \equiv 13 \equiv 0 \;[13]$. 
    $$\boxed{13 \mid 2^{70} + 3^{70}}$$

    **2.** Les puissances de $2$ modulo $10$ valent $2, 4, 8, 6, 2, \dots$ : elles sont périodiques de période $4$ à partir de l'exposant $1$, puisque $2^{5} = 32 \equiv 2 \;[10]$. Comme $136\,279\,841 = 4 \times 34\,069\,960 + 1$, on a $2^{136\,279\,841} \equiv 2 \;[10]$. 
    $$\boxed{\text{le dernier chiffre est } 1}$$

    **3.** D'après le petit théorème de Fermat, $2^{18} \equiv 1 \;[19]$ : il suffit de connaître l'exposant $2^{6k + 2}$ modulo $18$. Or $2^{6k + 2} = 4 \times 64^{k} \equiv 4 \;[9]$, puisque $64 \equiv 1 \;[9]$, et cet entier est pair ; l'entier $2^{6k + 2} - 4$ est donc divisible par $9$ et par $2$, donc par $18$. En écrivant $2^{6k + 2} = 18j + 4$ : 
    $$2^{2^{6k + 2}} + 3 = (2^{18})^{j} \times 2^{4} + 3 \equiv 16 + 3 = 19 \equiv 0 \;[19].$$

    $$\boxed{19 \mid 2^{2^{6k + 2}} + 3}$$
     *À retenir.* Pour calculer $a^{N}$ modulo un nombre premier $p$, on réduit d'abord l'exposant $N$ modulo $p - 1$ : c'est l'usage le plus fréquent du petit théorème de Fermat.
- id: "ma-12-38"
  feuille: "f-ma-12"
  numero: 38
  partie: "Congruences"
  etoiles: 1
  types: [Calcul]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Résoudre dans $\mathbb{Z}$ les congruences suivantes, d'inconnue $x$.

    $$\begin{array}{lll}  \text{(i) }5x \equiv 1 \;[7] & \text{(iii) }23x \equiv 0 \;[97] & \text{(v) }4x \equiv 8 \;[12] \\  \text{(ii) }3x \equiv 4 \;[19] & \text{(iv) }8x \equiv 7 \;[105] & \text{(vi) }4x \equiv 6 \;[12] \end{array}$$
  corrige: |
    On suit la méthode de la section 12.6.2 : si $a \wedge n = 1$, on multiplie par un inverse de $a$ modulo $n$.

    **(i)** $5 \times 3 = 15 \equiv 1 \;[7]$, donc $x \equiv 3 \;[7]$.

    **(ii)** $3 \times 13 = 39 \equiv 1 \;[19]$, donc $x \equiv 13 \times 4 = 52 \equiv 14 \;[19]$.

    **(iii)** Comme $97$ est premier et ne divise pas $23$, le lemme d'Euclide donne $97 \mid x$, soit $x \equiv 0 \;[97]$.

    **(iv)** L'égalité $105 = 13 \times 8 + 1$ montre que $-13 \equiv 92$ est un inverse de $8$ modulo $105$, d'où 
    $$x \equiv 92 \times 7 = 644 \equiv 14 \;[105].$$

    **(v)** Ici $4 \wedge 12 = 4$ : on ne peut pas inverser $4$. On revient à la définition : $12 \mid 4x - 8$ si et seulement si $3 \mid x - 2$.

    **(vi)** Si $12 \mid 4x - 6$, alors $4 \mid 6$, ce qui est faux. 
    $$\boxed{\text{(i) } x \equiv 3 \;[7] ; \ \text{(ii) } x \equiv 14 \;[19] ; \ \text{(iii) } x \equiv 0 \;[97] ; \ \text{(iv) } x \equiv 14 \;[105] ; \ \text{(v) } x \equiv 2 \;[3] ; \ \text{(vi) aucune solution}}$$
     *Piège.* En (v), l'erreur la plus répandue est de « diviser par $4$ » en gardant le module $12$, ce qui donne $x \equiv 2 \;[12]$ et perd les solutions $x = 5$ et $x = 8$. Comme l'a montré la remarque de la section 12.6.1, on ne divise pas une congruence : on divise l'égalité $4x - 8 = 12k$, module compris.
- id: "ma-12-39"
  feuille: "f-ma-12"
  numero: 39
  partie: "Congruences"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [congruences, divisibilité]
  noeuds: [z-zn, z-division]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Montrer que, pour tous entiers $a$ et $b$, $17$ divise $2a + 3b$ si et seulement si $17$ divise $9a + 5b$.
  corrige: |
    On cherche une combinaison qui élimine $a$ : $9(2a + 3b) - 2(9a + 5b) = 17b$. Si $17 \mid 2a + 3b$, alors $17 \mid 2(9a + 5b)$, et comme $17 \wedge 2 = 1$, le lemme de Gauss donne $17 \mid 9a + 5b$. Réciproquement, si $17 \mid 9a + 5b$, alors $17 \mid 9(2a + 3b)$, et $17 \wedge 9 = 1$ donne $17 \mid 2a + 3b$. 
    $$\boxed{17 \mid 2a + 3b \iff 17 \mid 9a + 5b}$$
- id: "ma-12-40"
  feuille: "f-ma-12"
  numero: 40
  partie: "Congruences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [congruences, lemme chinois]
  noeuds: [z-zn, ac-chinois]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Résoudre dans $\mathbb{Z}^{2}$ le système de congruences 
    $$\left\{ \begin{array}{l} 4x + y \equiv 6 \;[12] \\ x + 4y \equiv 3 \;[12] \end{array} \right.$$
  corrige: |
    La première congruence équivaut à $y \equiv 6 - 4x \;[12]$. En reportant dans la seconde, le système équivaut à 
    $$\left\{ \begin{array}{l} y \equiv 6 - 4x \;[12] \\ 24 - 15x \equiv 3 \;[12] \end{array} \right.$$
     La seconde ligne s'écrit $15x \equiv 21 \;[12]$, soit $3x \equiv 9 \;[12]$, c'est-à-dire $12 \mid 3(x - 3)$, ou encore $4 \mid x - 3$. On pose $x = 3 + 4k$ ; alors $6 - 4x = -6 - 16k \equiv 6 + 8k \;[12]$. 
    $$\boxed{\mathcal{S} = \{(3 + 4k, \ 6 + 8k + 12\ell) \mid (k, \ell) \in \mathbb{Z}^{2}\}}$$
     Modulo $12$, il y a trois solutions : $(3, 6)$, $(7, 2)$ et $(11, 10)$. Vérification pour $(7, 2)$ : $30 \equiv 6$ et $15 \equiv 3 \;[12]$. ✓
- id: "ma-12-41"
  feuille: "f-ma-12"
  numero: 41
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $a, b \in \mathbb{Z}$ tels que $a \equiv b \;[n]$. Montrer que $a^{n} \equiv b^{n} \;[n^{2}]$.
  corrige: |
    On écrit $a = b + kn$. La formule du binôme donne 
    $$a^{n} = b^{n} + \binom{n}{1} b^{n - 1}kn + \sum_{j = 2}^{n} \binom{n}{j} b^{n - j}k^{j}n^{j}.$$
     Le deuxième terme vaut $kn^{2}b^{n - 1}$, et les suivants contiennent $n^{j}$ avec $j \geqslant 2$. 
    $$\boxed{a^{n} \equiv b^{n} \;[n^{2}]}$$
     Comme à l'exercice 6, c'est le coefficient $\binom{n}{1} = n$ qui fournit le second facteur $n$.
- id: "ma-12-42"
  feuille: "f-ma-12"
  numero: 42
  partie: "Congruences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Déterminer les entiers $n \in \mathbb{N}$ tels que $n\,3^{n} \equiv 1 \;[7]$.
  corrige: |
    D'après le petit théorème de Fermat, $3^{6} \equiv 1 \;[7]$, donc $3^{n}$ ne dépend que du reste de $n$ modulo $6$ :

    ```tableau
    $n \bmod 6$ ¦ $0$ ¦ $1$ ¦ $2$ ¦ $3$ ¦ $4$ ¦ $5$
    $3^{n} \bmod 7$ ¦ $1$ ¦ $3$ ¦ $2$ ¦ $6$ ¦ $4$ ¦ $5$
    inverse modulo $7$ ¦ $1$ ¦ $5$ ¦ $4$ ¦ $6$ ¦ $2$ ¦ $3$
    ```

    La condition $n\,3^{n} \equiv 1 \;[7]$ s'écrit $n \equiv (3^{n})^{-1} \;[7]$. Pour chacun des six restes $j$ de $n$ modulo $6$, on cherche parmi $j, j + 6, \dots, j + 36$ l'entier congru à l'inverse modulo $7$ : on trouve $36$, $19$, $32$, $27$, $16$ et $17$. Comme $6 \wedge 7 = 1$, la condition ne dépend que de $n$ modulo $42$. 
    $$\boxed{n \equiv 16, \ 17, \ 19, \ 27, \ 32 \text{ ou } 36 \;[42]}$$
     Vérification pour $n = 16$ : $3^{16} \equiv 3^{4} \equiv 4$ et $16 \times 4 = 64 \equiv 1 \;[7]$. ✓
- id: "ma-12-43"
  feuille: "f-ma-12"
  numero: 43
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences, divisibilité]
  noeuds: [z-zn, z-division]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    **1.** Montrer qu'il existe une infinité d'entiers $n > 0$ tels que $4n^{2} + 1$ soit divisible à la fois par $5$ et par $13$.

    **2.** Montrer que l'ensemble $\{2^{n} - 3 \mid n \geqslant 2\}$ contient une infinité de multiples de $5$, une infinité de multiples de $13$, mais aucun multiple de $65$.
  corrige: |
    **1.** Modulo $5$ : $4n^{2} + 1 \equiv 0$ équivaut à $4n^{2} \equiv 4$, soit $n^{2} \equiv 1$, c'est-à-dire $n \equiv \pm 1 \;[5]$. Modulo $13$, en multipliant par $10$, inverse de $4$ : $n^{2} \equiv -10 \equiv 3$, ce qui équivaut à $n \equiv \pm 4 \;[13]$, puisque la table des carrés modulo $13$ montre que $4^{2} = 16$ et $9^{2} = 81$ sont les seuls carrés congrus à $3$. L'entier $n = 56$ vérifie $56 \equiv 1 \;[5]$ et $56 \equiv 4 \;[13]$, et tous les $56 + 65k$ aussi. 
    $$\boxed{65 \mid 4n^{2} + 1 \text{ pour tout } n = 56 + 65k, \ k \in \mathbb{N}}$$
     Vérification : $4 \times 56^{2} + 1 = 12\,545 = 65 \times 193$. ✓

    **2.** Les puissances de $2$ sont périodiques de période $4$ modulo $5$ ($2, 4, 3, 1$) et de période $12$ modulo $13$ ($2, 4, 8, 3, 6, 12, 11, 9, 5, 10, 7, 1$). Ainsi $5 \mid 2^{n} - 3$ si et seulement si $n \equiv 3 \;[4]$, et $13 \mid 2^{n} - 3$ si et seulement si $n \equiv 4 \;[12]$ : il y a une infinité de multiples de chaque sorte. Mais si $65$ divisait $2^{n} - 3$, on aurait $n \equiv 4 \;[12]$, donc $n \equiv 0 \;[4]$, et $n \equiv 3 \;[4]$ : c'est impossible. 
    $$\boxed{\text{infinité de multiples de } 5 \ (n \equiv 3 \;[4]), \text{ de } 13 \ (n \equiv 4 \;[12]), \text{ aucun de } 65}$$
- id: "ma-12-44"
  feuille: "f-ma-12"
  numero: 44
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences, petit théorème de Fermat]
  noeuds: [z-zn, rq-fermat]
  notions: [congruence]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    À l'aide du petit théorème de Fermat, montrer que, pour tout $n \in \mathbb{N}$, $n^{5} - n \equiv 0 \;[30]$ et $n^{7} - n \equiv 0 \;[42]$.
  corrige: |
    Pour $p$ premier, le petit théorème de Fermat donne $n^{p} \equiv n \;[p]$, et donc, en multipliant par une puissance de $n$, $n^{k(p - 1) + 1} \equiv n \;[p]$ pour tout $k \in \mathbb{N}$.

    • Pour $n^{5}$ : $5 = 4 \times 1 + 1 = 2 \times 2 + 1 = 1 \times 4 + 1$, donc $n^{5} \equiv n$ modulo $2$, $3$ et $5$.

    • Pour $n^{7}$ : $7 = 6 \times 1 + 1 = 3 \times 2 + 1 = 1 \times 6 + 1$, donc $n^{7} \equiv n$ modulo $2$, $3$ et $7$.

    Les nombres $2$, $3$, $5$, et de même $2$, $3$, $7$, sont premiers entre eux deux à deux ; on applique deux fois la proposition 7 (i). 
    $$\boxed{30 \mid n^{5} - n \qquad \text{et} \qquad 42 \mid n^{7} - n}$$
- id: "ma-12-45"
  feuille: "f-ma-12"
  numero: 45
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Montrer, en raisonnant modulo $5$, que l'équation $15x^{2} - 7y^{2} = 9$, d'inconnue $(x, y) \in \mathbb{Z}^{2}$, n'admet aucune solution.
  corrige: |
    Modulo $5$, on a $15 \equiv 0$, $-7 \equiv 3$ et $9 \equiv 4$ : une solution vérifierait $3y^{2} \equiv 4$, soit, en multipliant par $2$, inverse de $3$, $y^{2} \equiv 8 \equiv 3 \;[5]$. Or les carrés modulo $5$ sont $0, 1, 4, 4, 1$. 
    $$\boxed{\text{aucune solution : } 3 \text{ n'est pas un carré modulo } 5}$$
     *À retenir.* Pour montrer qu'une équation n'a pas de solution entière, on cherche un module pour lequel elle n'en a pas ; le choix de $5$ est dicté par le coefficient $15$, qui disparaît.
- id: "ma-12-46"
  feuille: "f-ma-12"
  numero: 46
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    **1.** Soit $n \in \mathbb{N}$. Déterminer à quelle condition « l'équation » $x^{3} \equiv n \;[9]$ possède une solution dans $\mathbb{Z}$.

    **2.** Montrer que, pour tous $a, b, c \in \mathbb{Z}$, $a^{3} + b^{3} + c^{3} \neq 11\,111$.

    **3.** En utilisant des propriétés fines du plus petit sous-corps de $\mathbb{R}$ contenant $\sqrt[3]{117}$, Finkelstein et London ont montré en 1971 que l'équation $x^{3} + 117y^{3} = 5$ n'avait pas de solution $(x, y) \in \mathbb{Z}^{2}$. Montrer leur résultat de façon plus élémentaire.
  corrige: |
    **1.** Si $x = 3k + r$, la formule du binôme donne $x^{3} = 27k^{3} + 27k^{2}r + 9kr^{2} + r^{3} \equiv r^{3} \;[9]$. Les cubes modulo $9$ sont donc $0^{3} = 0$, $1^{3} = 1$ et $2^{3} = 8$. 
    $$\boxed{x^{3} \equiv n \;[9] \text{ a une solution si et seulement si } n \equiv 0, \ 1 \text{ ou } 8 \;[9]}$$

    **2.** Chaque cube est congru à $0$, $1$ ou $-1$ modulo $9$, donc une somme de trois cubes est congrue à un entier de $[\![-3\,;3]\!]$, c'est-à-dire à $0, 1, 2, 3, 6, 7$ ou $8$. Or $11\,111 \equiv 5 \;[9]$, par la somme de ses chiffres. 
    $$\boxed{a^{3} + b^{3} + c^{3} \neq 11\,111}$$

    **3.** Comme $117 = 9 \times 13$, une solution vérifierait $x^{3} \equiv 5 \;[9]$, ce qui est impossible d'après la question 1. 
    $$\boxed{x^{3} + 117y^{3} = 5 \text{ n'a pas de solution dans } \mathbb{Z}^{2}}$$
     La démonstration élémentaire tient en une ligne ; elle ne dit rien, en revanche, des solutions rationnelles, que l'approche de Finkelstein et London permet d'étudier.
- id: "ma-12-47"
  feuille: "f-ma-12"
  numero: 47
  partie: "Congruences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Le nombre $2^{29}$ possède neuf chiffres, tous distincts. Quel est le chiffre manquant ? On ne demande pas de calculer $2^{29}$.
  corrige: |
    On travaille modulo $9$, où un entier est congru à la somme de ses chiffres. Comme $2^{6} = 64 \equiv 1 \;[9]$, on a $2^{29} = (2^{6})^{4} \times 2^{5} \equiv 32 \equiv 5 \;[9]$. Si $m$ est le chiffre manquant, la somme des neuf chiffres vaut $45 - m \equiv -m \;[9]$. Donc $-m \equiv 5$, soit $m \equiv 4 \;[9]$, et $m = 4$ puisque $0 \leqslant m \leqslant 9$. 
    $$\boxed{\text{le chiffre manquant est } 4}$$
     Vérification : $2^{29} = 536\,870\,912$. ✓
- id: "ma-12-48"
  feuille: "f-ma-12"
  numero: 48
  partie: "Congruences"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [congruences]
  noeuds: [z-zn]
  notions: [congruence]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Montrer que $\min\big\{|36^{n} - 5^{m}| \bigm| n, m \in \mathbb{N}^{*}\big\} = 11$.
  corrige: |
    On a $36 - 25 = 11$, donc le minimum vaut au plus $11$. Les puissances de $36$ se terminent par $6$ et celles de $5$ par $5$, donc $36^{n} - 5^{m}$ se termine par $1$ s'il est positif, et $5^{m} - 36^{n}$ se termine par $9$ s'il est positif. Les seules valeurs inférieures à $11$ possibles pour $|36^{n} - 5^{m}|$ sont donc $1$ et $9$.

    • $36^{n} - 5^{m} = 1$ est impossible : $36 \equiv 1 \;[7]$, donc $7$ divise $36^{n} - 1 = 5^{m}$, ce qui contredit le lemme d'Euclide.

    • $5^{m} - 36^{n} = 9$ est impossible : $3$ diviserait $5^{m} = 9 + 36^{n}$.

    $$\boxed{\min\big\{|36^{n} - 5^{m}|\big\} = 11, \text{ atteint pour } n = 1, \ m = 2}$$
- id: "ma-12-49"
  feuille: "f-ma-12"
  numero: 49
  partie: "Congruences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [congruences, divisibilité, écriture en base b, nombres premiers]
  noeuds: [z-zn, z-division, z-premiers]
  notions: [congruence, nombre-premier]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    On appelle *repunit* un nombre entier dont l'écriture en base $10$ ne contient que des $1$. Caractériser les nombres premiers qui divisent au moins un repunit.
  corrige: |
    Le repunit à $k$ chiffres vaut $R_{k} = \frac{10^{k} - 1}{9}$. Il est impair et se termine par $1$, donc ni $2$ ni $5$ ne divisent un repunit. Le nombre $3$ divise $R_{3} = 111 = 3 \times 37$. Soit enfin $p$ premier différent de $2$, $3$ et $5$. Comme $p \nmid 10$, le petit théorème de Fermat donne $p \mid 10^{p - 1} - 1 = 9R_{p - 1}$, et comme $p \wedge 9 = 1$, le lemme de Gauss donne $p \mid R_{p - 1}$. 
    $$\boxed{\text{les nombres premiers qui divisent un repunit sont tous les nombres premiers sauf } 2 \text{ et } 5}$$
     Par exemple, $7 \mid R_{6} = 111\,111 = 3 \times 7 \times 11 \times 13 \times 37$.
- id: "ma-12-50"
  feuille: "f-ma-12"
  numero: 50
  partie: "Congruences"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [congruences, nombres premiers, théorème de Wilson]
  noeuds: [z-zn, z-premiers, rq-wilson]
  notions: [congruence, nombre-premier]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    *Théorème de Wilson.* Soit $n \geqslant 2$. Montrer que $n$ est premier si et seulement si $(n - 1)! \equiv -1 \;[n]$. On pourra, pour $n$ premier, regrouper chaque entier de $[\![2\,;n - 2]\!]$ avec son inverse modulo $n$.
  corrige: |
    *Si $n$ n'est pas premier*, il s'écrit $n = ab$ avec $1 < a < n$. Alors $a$ figure dans le produit $(n - 1)!$, donc $a \mid (n - 1)!$. Si l'on avait $(n - 1)! \equiv -1 \;[n]$, l'entier $a$, qui divise $n$, diviserait $(n - 1)! + 1$, donc $1$ : c'est absurde.

    *Si $n = p$ est premier.* Pour $p = 2$ et $p = 3$, on a $1! = 1 \equiv -1 \;[2]$ et $2! = 2 \equiv -1 \;[3]$. Soit $p \geqslant 5$. D'après la proposition 12, chaque $k \in [\![1\,;p - 1]\!]$ admet un inverse modulo $p$, et un seul dans $[\![1\,;p - 1]\!]$, que l'on note $k'$. On a $k' = k$ si et seulement si $k^{2} \equiv 1$, c'est-à-dire $p \mid (k - 1)(k + 1)$, soit $k \in \{1, p - 1\}$ par le lemme d'Euclide. Les entiers de $[\![2\,;p - 2]\!]$ se regroupent donc en paires $\{k, k'\}$ de produit congru à $1$, et 
    $$(p - 1)! = 1 \times \Big(\prod_{k = 2}^{p - 2} k\Big) \times (p - 1) \equiv 1 \times 1 \times (-1) \;[p].$$

    $$\boxed{n \text{ premier} \iff (n - 1)! \equiv -1 \;[n]}$$
     Pour $p = 7$, les paires sont $\{2, 4\}$ et $\{3, 5\}$, et $6! = 720 = 7 \times 103 - 1$. ✓

    *À retenir.* Ce critère de primalité est exact mais inutilisable en pratique : calculer $(n - 1)!$ modulo $n$ demande $n - 2$ multiplications, bien plus que les essais de divisions jusqu'à $\sqrt{n}$.
- id: "ma-12-51"
  feuille: "f-ma-12"
  numero: 51
  partie: "Congruences"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [congruences, nombres premiers, théorème de Wilson]
  noeuds: [z-zn, z-premiers, rq-wilson]
  notions: [congruence, nombre-premier]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $p$ un nombre premier impair.

    **1.** On suppose que l'équation $x^{2} \equiv -1 \;[p]$ possède une solution dans $\mathbb{Z}$. Montrer que $p \equiv 1 \;[4]$.

    **2.** En déduire qu'il existe une infinité de nombres premiers congrus à $1$ modulo $4$.

    **3.** Réciproquement, montrer que si $p \equiv 1 \;[4]$, on a $\left(\left(\dfrac{p - 1}{2}\right)!\right)^{2} \equiv -1 \;[p]$. On utilisera le théorème de Wilson de l'exercice 50.
  corrige: |
    **1.** Soit $x$ tel que $x^{2} \equiv -1 \;[p]$. Alors $p \nmid x$, et le petit théorème de Fermat donne, $p$ étant impair, 
    $$1 \equiv x^{p - 1} = (x^{2})^{\frac{p - 1}{2}} \equiv (-1)^{\frac{p - 1}{2}} \;[p].$$
     Comme $p \geqslant 3$, on a $1 \not\equiv -1 \;[p]$ : l'exposant $\frac{p - 1}{2}$ est pair, c'est-à-dire $p \equiv 1 \;[4]$. 
    $$\boxed{p \equiv 1 \;[4]}$$

    **2.** Supposons qu'il n'y ait qu'un nombre fini de nombres premiers congrus à $1$ modulo $4$, notés $p_{1} = 5$, …, $p_{r}$, et posons $x = 2p_{1} \cdots p_{r}$ et $N = x^{2} + 1$. L'entier $N$ est impair et supérieur à $2$, donc admet un facteur premier impair $q$, qui vérifie $x^{2} \equiv -1 \;[q]$. D'après la question 1, $q \equiv 1 \;[4]$, donc $q$ est l'un des $p_{i}$ ; il divise alors $x$ et $x^{2} + 1$, donc $1$, ce qui est absurde. 
    $$\boxed{\text{il y a une infinité de nombres premiers } p \equiv 1 \;[4]}$$

    **3.** On pose $h = \frac{p - 1}{2}$, qui est pair. On regroupe les facteurs de $(p - 1)!$ en $k$ et $p - k \equiv -k$, pour $1 \leqslant k \leqslant h$ : 
    $$(p - 1)! = \prod_{k = 1}^{h} k \times \prod_{k = 1}^{h} (p - k) \equiv \prod_{k = 1}^{h} k \times \prod_{k = 1}^{h} (-k) = (-1)^{h}(h!)^{2} = (h!)^{2} \;[p].$$
     Le théorème de Wilson de l'exercice 50 donne $(p - 1)! \equiv -1$. 
    $$\boxed{\Big(\Big(\frac{p - 1}{2}\Big)!\Big)^{2} \equiv -1 \;[p]}$$
     Pour $p = 13$, $6! = 720 = 13 \times 55 + 5$ et $5^{2} = 25 \equiv -1 \;[13]$. ✓

    *À retenir.* Les questions 1 et 3 forment une équivalence : pour $p$ premier impair, $-1$ est un carré modulo $p$ si et seulement si $p \equiv 1 \;[4]$. C'est le point de départ du théorème de Fermat sur les sommes de deux carrés.
- id: "ma-12-52"
  feuille: "f-ma-12"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [divisibilité, "PGCD et algorithme d'Euclide", nombres premiers, congruences, fonctions arithmétiques]
  noeuds: [z-division, z-bezout, z-premiers, z-zn]
  notions: [pgcd, nombre-premier, congruence]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Si $a$ divise $bc$ et ne divise pas $b$, alors $a$ divise $c$.

    **2.** Pour tous entiers $a$ et $b$, $a \wedge b = (a + b) \wedge b$.

    **3.** Si $a \wedge b = 1$ et $a \wedge c = 1$, alors $a \wedge (bc) = 1$.

    **4.** Si un nombre premier $p$ divise $a^{2}$, alors $p^{2}$ divise $a^{2}$.

    **5.** Si $a \equiv b \;[n]$ et $c \equiv d \;[n]$, avec $c$ et $d$ dans $\mathbb{N}$, alors $a^{c} \equiv b^{d} \;[n]$.

    **6.** Si $n$ est premier, alors $2^{n} - 1$ est premier.

    **7.** L'équation $6x + 10y = 7$ n'a aucune solution dans $\mathbb{Z}^{2}$.

    **8.** Tout entier $n \geqslant 2$ qui n'est pas premier admet un diviseur premier $p$ tel que $p^{2} \leqslant n$.

    **9.** Les entiers $72$ et $108$ ont le même nombre de diviseurs positifs.

    **10.** Si $a^{2} \equiv 1 \;[n]$, alors $a \equiv 1 \;[n]$ ou $a \equiv -1 \;[n]$.
  corrige: |
    **1. **Fausse**.** Avec $a = 4$, $b = c = 2$ : $4$ divise $bc = 4$, mais ne divise ni $b$ ni $c$. Le lemme de Gauss demande $a \wedge b = 1$, et non $a \nmid b$.

    **2. **Vraie**.** Par la proposition 4, $(a + b) \wedge b = b \wedge \big((a + b) - b\big) = b \wedge a$.

    **3. **Vraie**.** C'est la proposition 7 (ii).

    **4. **Vraie**.** Par le lemme d'Euclide, $p \mid a$, donc $p^{2} \mid a^{2}$. On peut aussi dire que $v_{p}(a^{2}) = 2v_{p}(a)$ est un entier pair non nul, donc au moins égal à $2$.

    **5. **Fausse**.** Avec $n = 3$ : $2 \equiv 2$ et $1 \equiv 4 \;[3]$, mais $2^{1} = 2$ et $2^{4} = 16 \equiv 1 \;[3]$. On peut remplacer la base par un entier congru, jamais l'exposant ; le petit théorème de Fermat dit seulement que, modulo $p$ premier, on peut réduire l'exposant modulo $p - 1$.

    **6. **Fausse**.** On a $2^{11} - 1 = 2047 = 23 \times 89$. La réciproque est vraie : si $2^{n} - 1$ est premier, alors $n$ est premier (exercice 56).

    **7. **Vraie**.** Le membre de gauche est pair. Plus généralement, $6 \wedge 10 = 2$ ne divise pas $7$.

    **8. **Vraie**.** C'est la proposition 8, qui fonde le crible d'Ératosthène.

    **9. **Vraie**.** On a $72 = 2^{3} \times 3^{2}$ et $108 = 2^{2} \times 3^{3}$, et le théorème 6 donne $(3 + 1)(2 + 1) = 12 = (2 + 1)(3 + 1)$ diviseurs positifs.

    **10. **Fausse**.** Avec $n = 8$ et $a = 3$ : $9 \equiv 1 \;[8]$, mais $3 \not\equiv \pm 1 \;[8]$. L'implication est vraie lorsque $n$ est premier, par le lemme d'Euclide appliqué à $(a - 1)(a + 1)$, comme dans l'exercice 50. 
    $$\boxed{\text{vraies : 2, 3, 4, 7, 8, 9 ; \quad fausses : 1, 5, 6, 10}}$$
- id: "ma-12-53"
  feuille: "f-ma-12"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [divisibilité, "PGCD et algorithme d'Euclide", PPCM, Bézout, nombres premiers]
  noeuds: [z-division, z-bezout, z-premiers]
  notions: [pgcd, nombre-premier]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    *PGCD et PPCM dans le cercle unité.* Soit $n$ et $m$ deux entiers naturels non nuls. On rappelle que $\mathbb{U}_{n} = \{z \in \mathbb{C} \mid z^{n} = 1\}$ est l'ensemble des racines $n$-ièmes de l'unité (chapitre 4).

    **1.** Montrer que $\mathbb{U}_{n} \cap \mathbb{U}_{m} = \mathbb{U}_{n \wedge m}$. On pourra utiliser une relation de Bézout.

    **2.** On note $\mathbb{U}_{n}\mathbb{U}_{m} = \{zw \mid z \in \mathbb{U}_{n}, \ w \in \mathbb{U}_{m}\}$. Montrer que $\mathbb{U}_{n}\mathbb{U}_{m} = \mathbb{U}_{n \vee m}$.

    **3.** On suppose $n \wedge m = 1$. Montrer que tout élément de $\mathbb{U}_{nm}$ s'écrit de façon unique sous la forme $zw$, avec $z \in \mathbb{U}_{n}$ et $w \in \mathbb{U}_{m}$.

    **4.** On trace, inscrits dans le cercle unité, un dodécagone régulier et un polygone régulier à $18$ côtés ayant tous deux le point d'affixe $1$ pour sommet. Combien de sommets ont-ils en commun ? Quel ensemble obtient-on en multipliant l'affixe d'un sommet du premier par l'affixe d'un sommet du second, de toutes les façons possibles ?
  corrige: |
    **1.** On note $d = n \wedge m$, et l'on raisonne par double inclusion. Comme $d$ divise $n$ et $m$, la proposition 9 du chapitre 11 donne $\mathbb{U}_{d} \subset \mathbb{U}_{n}$ et $\mathbb{U}_{d} \subset \mathbb{U}_{m}$, donc $\mathbb{U}_{d} \subset \mathbb{U}_{n} \cap \mathbb{U}_{m}$. Réciproquement, soit $z \in \mathbb{U}_{n} \cap \mathbb{U}_{m}$ ; il est non nul. La relation de Bézout (théorème 3) fournit des entiers relatifs $u$ et $v$ tels que $nu + mv = d$, et les règles de calcul dans le groupe $(\mathbb{C}^{*}, \times)$ (chapitre 11, proposition 4) donnent 
    $$z^{d} = z^{nu + mv} = (z^{n})^{u}\,(z^{m})^{v} = 1.$$

    $$\boxed{\mathbb{U}_{n} \cap \mathbb{U}_{m} = \mathbb{U}_{n \wedge m}}$$
     *Piège.* L'erreur la plus répandue est de croire que deux ensembles $\mathbb{U}_{n}$ et $\mathbb{U}_{m}$ distincts n'ont que $1$ en commun : $-1$ appartient à $\mathbb{U}_{4}$ et à $\mathbb{U}_{6}$, puisque $4 \wedge 6 = 2$. L'intersection se réduit à $\{1\}$ exactement lorsque $n$ et $m$ sont premiers entre eux.

    **2.** On note $L = n \vee m$, et l'on raisonne encore par double inclusion. Si $z \in \mathbb{U}_{n}$ et $w \in \mathbb{U}_{m}$, l'entier $L$ est un multiple de $n$ et de $m$, donc $(zw)^{L} = (z^{n})^{L/n}(w^{m})^{L/m} = 1$, et $zw \in \mathbb{U}_{L}$. Réciproquement, avec $nu + mv = d$ comme à la question 1, et $L = \frac{nm}{d}$ (proposition 7 (iii)), on obtient 
    $$\mathrm{e}^{2\mathrm{i}\pi/L} = \mathrm{e}^{2\mathrm{i}\pi d/(nm)} = \mathrm{e}^{2\mathrm{i}\pi(nu + mv)/(nm)} = \mathrm{e}^{2\mathrm{i}\pi v/n}\,\mathrm{e}^{2\mathrm{i}\pi u/m}.$$
     Pour tout $k \in \mathbb{Z}$, l'élément $\mathrm{e}^{2\mathrm{i} k\pi/L}$ de $\mathbb{U}_{L}$ s'écrit donc $\big(\mathrm{e}^{2\mathrm{i}\pi v/n}\big)^{k}\big(\mathrm{e}^{2\mathrm{i}\pi u/m}\big)^{k}$, produit d'un élément de $\mathbb{U}_{n}$ et d'un élément de $\mathbb{U}_{m}$. Comme tout élément de $\mathbb{U}_{L}$ est de cette forme (chapitre 4, proposition 21), on a l'inclusion réciproque. 
    $$\boxed{\mathbb{U}_{n}\mathbb{U}_{m} = \mathbb{U}_{n \vee m}}$$

    **3.** Lorsque $n \wedge m = 1$, la proposition 7 (iii) donne $n \vee m = nm$, et l'existence de l'écriture est la question 2. Pour l'unicité, supposons $zw = z'w'$ avec $z, z' \in \mathbb{U}_{n}$ et $w, w' \in \mathbb{U}_{m}$. Comme $\mathbb{U}_{n}$ et $\mathbb{U}_{m}$ sont des sous-groupes de $(\mathbb{C}^{*}, \times)$, le complexe $z z'^{-1} = w' w^{-1}$ appartient à $\mathbb{U}_{n} \cap \mathbb{U}_{m} = \mathbb{U}_{1} = \{1\}$, d'après la question 1. Ainsi $z = z'$, puis $w = w'$. 
    $$\boxed{\text{si } n \wedge m = 1, \ (z, w) \longmapsto zw \text{ est une bijection de } \mathbb{U}_{n} \times \mathbb{U}_{m} \text{ sur } \mathbb{U}_{nm}}$$
     L'hypothèse est indispensable : avec $n = m = 2$, on a $(-1) \times (-1) = 1 \times 1$, et l'application n'est pas injective.

    **4.** Les sommets du dodécagone régulier inscrit dans le cercle unité et passant par le point d'affixe $1$ ont pour affixes les $\mathrm{e}^{2\mathrm{i} k\pi/12}$, c'est-à-dire les éléments de $\mathbb{U}_{12}$ (chapitre 4, proposition 21) ; de même, ceux du second polygone forment $\mathbb{U}_{18}$. On a $12 = 2^{2} \times 3$ et $18 = 2 \times 3^{2}$, donc $12 \wedge 18 = 6$ et $12 \vee 18 = 36$, et les questions 1 et 2 concluent. 
    $$\boxed{\text{6 sommets communs, ceux de l'hexagone régulier } \mathbb{U}_{6} \ ; \quad \text{les produits forment } \mathbb{U}_{36}}$$

    ![Figure](documents/figures/3164039517a3ea4e.svg)

    Les gros points sont les sommets du dodécagone, les petits ceux du polygone à $18$ côtés ; ils ne coïncident qu'aux six sommets cerclés, tous les $60$ degrés, car $60$ est le plus petit multiple commun de $30$ et de $20$.

    *À retenir.* Par la proposition 9 du chapitre 11, l'inclusion entre les $\mathbb{U}_{n}$ est la divisibilité entre les indices. L'exercice montre que l'intersection et le produit y jouent les rôles du PGCD et du PPCM, exactement comme $a\mathbb{Z} + b\mathbb{Z}$ et $a\mathbb{Z} \cap b\mathbb{Z}$ dans la définition du cours ; la question 3 annonce, sous forme multiplicative, le théorème chinois.
- id: "ma-12-54"
  feuille: "f-ma-12"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [divisibilité, Bézout, nombres premiers, décomposition en facteurs premiers, fonctions arithmétiques]
  noeuds: [z-division, z-bezout, z-premiers]
  notions: [nombre-premier]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    *Nombres parfaits.* Pour tout $n \in \mathbb{N}^{*}$, on note $\sigma(n)$ la somme des diviseurs de $n$. On dit que $n$ est *parfait* si $\sigma(n) = 2n$ (c'est-à-dire si $n$ est égal à la somme de ses diviseurs différents de lui-même).

    **1.** Montrer que $6$ et $28$ sont parfaits.

    **2.** Soit $n \in \mathbb{N}^{*}$. En commençant par le cas où $n$ est une puissance d'un nombre premier, établir une formule pour $\sigma(n)$ en fonction de la décomposition en facteurs premiers de $n$.

    **3.** Montrer que si $n$ et $m$ sont des nombres premiers entre eux, alors $\sigma(mn) = \sigma(m)\sigma(n)$.

    **4.** Soit $p$ un nombre premier tel que $2^{p} - 1$ soit premier. Montrer que $2^{p - 1}(2^{p} - 1)$ est parfait.

    **5.** Soit $n$ un entier pair parfait. Il existe $a \in \mathbb{N}^{*}$ et $b$ entier impair tels que $n = 2^{a}b$.

    **(a)** Montrer : $\sigma(n) = (2^{a + 1} - 1)\sigma(b)$.

    **(b)** En déduire qu'il existe un entier impair $c$ tel que $b = (2^{a + 1} - 1)c$ et $\sigma(b) = 2^{a + 1}c$.

    **(c)** Montrer que $c = 1$ et que $b$ est premier.

    **(d)** En déduire que $n$ est de la forme $2^{k - 1}(2^{k} - 1)$, avec $2^{k} - 1$ premier.
  corrige: |
    **1.** On a $\sigma(6) = 1 + 2 + 3 + 6 = 12$ et $\sigma(28) = 1 + 2 + 4 + 7 + 14 + 28 = 56$. 
    $$\boxed{\sigma(6) = 2 \times 6 \qquad \text{et} \qquad \sigma(28) = 2 \times 28}$$

    **2.** Les diviseurs de $p^{\alpha}$ sont $1, p, \dots, p^{\alpha}$, donc $\sigma(p^{\alpha}) = \frac{p^{\alpha + 1} - 1}{p - 1}$. Si $n = p_{1}^{\alpha_{1}} \cdots p_{r}^{\alpha_{r}}$, le théorème 6 dit que les diviseurs de $n$ sont les $p_{1}^{\beta_{1}} \cdots p_{r}^{\beta_{r}}$, chacun obtenu une seule fois, avec $0 \leqslant \beta_{i} \leqslant \alpha_{i}$. En développant le produit des sommes (chapitre 3), on obtient chacun de ces termes exactement une fois. 
    $$\boxed{\sigma(n) = \prod_{i = 1}^{r} \Big(1 + p_{i} + \cdots + p_{i}^{\alpha_{i}}\Big) = \prod_{i = 1}^{r} \frac{p_{i}^{\alpha_{i} + 1} - 1}{p_{i} - 1}}$$

    **3.** Si $m \wedge n = 1$, aucun nombre premier ne divise à la fois $m$ et $n$ (proposition 10 (iii)). La décomposition de $mn$ s'obtient en juxtaposant celles de $m$ et de $n$, et le produit de la question 2 se scinde en deux. 
    $$\boxed{\sigma(mn) = \sigma(m)\sigma(n)}$$

    **4.** On pose $q = 2^{p} - 1$, premier et impair, donc premier avec $2^{p - 1}$. Par les questions 2 et 3 : 
    $$\sigma\big(2^{p - 1}q\big) = (2^{p} - 1)(q + 1) = (2^{p} - 1) \times 2^{p} = 2 \times 2^{p - 1}(2^{p} - 1).$$

    $$\boxed{2^{p - 1}(2^{p} - 1) \text{ est parfait}}$$

    **5. (a)** Comme $b$ est impair, $2^{a} \wedge b = 1$, et $\sigma(2^{a}) = 2^{a + 1} - 1$. 
    $$\boxed{\sigma(n) = (2^{a + 1} - 1)\sigma(b)}$$

    **(b)** Comme $n$ est parfait, $(2^{a + 1} - 1)\sigma(b) = 2n = 2^{a + 1}b$. L'entier $2^{a + 1} - 1$ est impair, donc premier avec $2^{a + 1}$, et le lemme de Gauss donne $2^{a + 1} - 1 \mid b$. On écrit $b = (2^{a + 1} - 1)c$ ; en reportant et en simplifiant, $\sigma(b) = 2^{a + 1}c$. L'entier $c$, qui divise $b$, est impair.

    **(c)** Comme $a \geqslant 1$, on a $2^{a + 1} - 1 \geqslant 3$, donc $c < b$ : les entiers $b$ et $c$ sont deux diviseurs distincts de $b$. Ainsi $\sigma(b) \geqslant b + c = 2^{a + 1}c = \sigma(b)$. L'égalité impose que $b$ et $c$ soient les seuls diviseurs de $b$. Comme $1$ en est un et que $b > 1$, on a $c = 1$, et $b$ n'a que $1$ et lui-même pour diviseurs positifs. 
    $$\boxed{c = 1 \text{ et } b = 2^{a + 1} - 1 \text{ est premier}}$$

    **(d)** Avec $k = a + 1$, on obtient $n = 2^{k - 1}(2^{k} - 1)$, avec $2^{k} - 1$ premier, ce qui impose aussi $k$ premier d'après l'exercice 56. 
    $$\boxed{\text{les nombres parfaits pairs sont exactement les } 2^{k - 1}(2^{k} - 1), \text{ avec } 2^{k} - 1 \text{ premier}}$$
     *À retenir.* Ce résultat, énoncé par Euclide pour le sens direct et démontré par Euler pour la réciproque, ramène les nombres parfaits pairs aux nombres premiers de Mersenne. On ignore toujours s'il existe un nombre parfait impair.
- id: "ma-12-55"
  feuille: "f-ma-12"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [Bézout, nombres premiers, petit théorème de Fermat]
  noeuds: [z-bezout, z-premiers, rq-fermat]
  notions: [nombre-premier]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Nombres de Fermat.*

    **1.** Soit $m \in \mathbb{N}^{*}$ tel que $2^{m} + 1$ soit premier. Montrer qu'il existe $n \in \mathbb{N}$ tel que $m = 2^{n}$.

    **2.** Pour $n \in \mathbb{N}$, on note $F_{n} = 2^{2^{n}} + 1$. Calculer $F_{0}$, $F_{1}$, $F_{2}$, $F_{3}$, $F_{4}$.

    **3.** Montrer que $\forall n \in \mathbb{N}$, $F_{n + 1} - 2 = (F_{n} - 2)F_{n}$.

    **4.** En déduire, pour $n \in \mathbb{N}^{*}$, une expression de $F_{n}$ en fonction des $(F_{k})_{k = 0}^{n - 1}$.

    **5.** Montrer que si $m \neq n$ alors $F_{n}$ et $F_{m}$ sont premiers entre eux.

    **6.** En déduire une nouvelle preuve de l'existence d'une infinité de nombres premiers.
  corrige: |
    **1.** Supposons que $m$ admette un diviseur impair $d \geqslant 3$, et écrivons $m = de$. La formule $a^{d} - b^{d}$ du chapitre 3 (proposition 5), avec $a = 2^{e}$ et $b = -1$, donne, $d$ étant impair, 
    $$2^{m} + 1 = (2^{e})^{d} - (-1)^{d} = (2^{e} + 1) \sum_{j = 0}^{d - 1} (2^{e})^{d - 1 - j}(-1)^{j}.$$
     Donc $2^{e} + 1$ divise $2^{m} + 1$, avec $1 < 2^{e} + 1 < 2^{m} + 1$, et $2^{m} + 1$ n'est pas premier. Ainsi $m$ n'a pas de facteur premier impair : d'après le théorème 6, c'est une puissance de $2$. 
    $$\boxed{m = 2^{n}}$$

    **2.** On calcule directement. 
    $$\boxed{F_{0} = 3, \quad F_{1} = 5, \quad F_{2} = 17, \quad F_{3} = 257, \quad F_{4} = 65\,537}$$

    **3.** On a $(F_{n} - 2)F_{n} = \big(2^{2^{n}} - 1\big)\big(2^{2^{n}} + 1\big) = 2^{2^{n + 1}} - 1 = F_{n + 1} - 2$.

    **4.** Par récurrence : $F_{1} - 2 = 3 = F_{0}$, et si $F_{n} - 2 = \prod_{k = 0}^{n - 1} F_{k}$, la question 3 donne $F_{n + 1} - 2 = \prod_{k = 0}^{n} F_{k}$. 
    $$\boxed{F_{n} = 2 + \prod_{k = 0}^{n - 1} F_{k}}$$

    **5.** Soit $m < n$ et $d$ un diviseur commun de $F_{m}$ et $F_{n}$. Comme $F_{m}$ figure dans le produit de la question 4, $d$ divise $F_{n} - \prod_{k = 0}^{n - 1} F_{k} = 2$. Or $F_{n}$ est impair, donc $d = \pm 1$. 
    $$\boxed{F_{m} \wedge F_{n} = 1}$$

    **6.** Pour chaque $n$, on choisit un facteur premier $q_{n}$ de $F_{n} \geqslant 3$. D'après la question 5, les $q_{n}$ sont deux à deux distincts : on obtient une infinité de nombres premiers.

    *À retenir.* Fermat pensait que tous les $F_{n}$ étaient premiers, ce que confirment $F_{0}$ à $F_{4}$ ; Euler a montré en 1732 que $F_{5} = 641 \times 6\,700\,417$. On ne connaît aujourd'hui aucun autre nombre de Fermat premier.
- id: "ma-12-56"
  feuille: "f-ma-12"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [division euclidienne, divisibilité, "PGCD et algorithme d'Euclide", nombres premiers]
  noeuds: [z-division, z-bezout, z-premiers]
  notions: [division-euclidienne, pgcd, nombre-premier]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    *Nombres de Mersenne.* Soit $a, b, n \geqslant 2$ trois entiers.

    **1.** Montrer que $a^{n} - 1$ est divisible par $a - 1$.

    **2.** En déduire que si $a^{n} - 1$ est un nombre premier, alors $a = 2$ et $n$ est un nombre premier.

    **3.** On note $r$ le reste de la division euclidienne de $a$ par $b$. Montrer que $2^{r} - 1$ est le reste de la division euclidienne de $2^{a} - 1$ par $2^{b} - 1$.

    **4.** Montrer que $(2^{a} - 1) \wedge (2^{b} - 1) = 2^{a \wedge b} - 1$.
  corrige: |
    **1.** D'après le chapitre 3 (proposition 5), $a^{n} - 1 = (a - 1)(a^{n - 1} + a^{n - 2} + \cdots + 1)$.

    **2.** Si $a^{n} - 1$ est premier, son diviseur $a - 1$ vaut $1$ ou $a^{n} - 1$ ; le second cas est exclu car $n \geqslant 2$ et $a \geqslant 2$ donnent $a^{n} > a$. Donc $a = 2$. Si $n = kl$ avec $1 < k < n$, la question 1 appliquée à $(2^{k})^{l} - 1$ montre que $2^{k} - 1$ divise $2^{n} - 1$, avec $1 < 2^{k} - 1 < 2^{n} - 1$ : c'est exclu, donc $n$ est premier. 
    $$\boxed{a = 2 \text{ et } n \text{ premier}}$$

    **3.** On écrit $a = bq + r$ avec $0 \leqslant r < b$. Alors 
    $$2^{a} - 1 = 2^{r}\big(2^{bq} - 1\big) + 2^{r} - 1.$$
     D'après la question 1, appliquée à $(2^{b})^{q} - 1$, l'entier $2^{b} - 1$ divise $2^{bq} - 1$, et $0 \leqslant 2^{r} - 1 < 2^{b} - 1$. Par unicité de la division euclidienne, $2^{r} - 1$ en est le reste.

    **4.** La question 3 et la proposition 4 donnent $(2^{a} - 1) \wedge (2^{b} - 1) = (2^{b} - 1) \wedge (2^{r} - 1)$ : le couple $(2^{a} - 1, 2^{b} - 1)$ suit pas à pas l'algorithme d'Euclide appliqué à $(a, b)$, comme les nombres de Fibonacci de l'exercice 23. Par récurrence forte sur $b$, en admettant $b \geqslant 1$ et $r \geqslant 0$, l'algorithme s'arrête sur le couple $(2^{d} - 1, 2^{0} - 1) = (2^{d} - 1, 0)$, avec $d = a \wedge b$. 
    $$\boxed{(2^{a} - 1) \wedge (2^{b} - 1) = 2^{a \wedge b} - 1}$$
     Par exemple, $(2^{12} - 1) \wedge (2^{18} - 1) = 4095 \wedge 262\,143 = 63 = 2^{6} - 1$. ✓
- id: "ma-12-57"
  feuille: "f-ma-12"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [nombres premiers, décomposition en facteurs premiers]
  noeuds: [z-premiers]
  notions: [nombre-premier]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    **1.** Soit $p$ un nombre premier.

    **(a)** Prolonger la valuation $p$-adique en une fonction $v_{p} : \mathbb{Q} \to \mathbb{Z} \cup \{+\infty\}$ vérifiant la propriété 
    $$\forall x, y \in \mathbb{Q}, \qquad v_{p}(xy) = v_{p}(x) + v_{p}(y).$$

    **(b)** Montrer que l'on conserve la propriété $\forall x, y \in \mathbb{Q}$, $v_{p}(x + y) \geqslant \min\big(v_{p}(x), v_{p}(y)\big)$.

    **2.** Pour $n \geqslant 1$, on note $H_{n} = \displaystyle\sum_{k = 1}^{n} \frac{1}{k}$. Calculer $v_{2}(H_{n})$.

    **3.** En déduire que pour tout $n > 1$, $H_{n} \notin \mathbb{Z}$ et que pour tous $m > n$, $H_{m} - H_{n} \notin \mathbb{Z}$.
  corrige: |
    **1. (a)** Pour $x = \frac{a}{b}$ non nul, avec $a, b \in \mathbb{Z}^{*}$, on pose $v_{p}(x) = v_{p}(a) - v_{p}(b)$, et $v_{p}(0) = +\infty$. Cette valeur ne dépend pas de l'écriture choisie : si $\frac{a}{b} = \frac{c}{d}$, alors $ad = bc$, et la proposition 10 (i) donne $v_{p}(a) + v_{p}(d) = v_{p}(b) + v_{p}(c)$. La multiplicativité découle alors de la proposition 10 (i), le cas d'un facteur nul étant immédiat avec la convention $+\infty$.

    **(b)** On réduit $x$ et $y$ au même dénominateur : $x = \frac{a}{c}$ et $y = \frac{b}{c}$. Si $k = \min\big(v_{p}(a), v_{p}(b)\big)$, alors $p^{k}$ divise $a$ et $b$, donc $a + b$, et $v_{p}(a + b) \geqslant k$. On retranche $v_{p}(c)$. On en déduit aussi le cas d'égalité, essentiel pour la suite : si $v_{p}(x) < v_{p}(y)$, alors 
    $$v_{p}(x) = v_{p}\big((x + y) - y\big) \geqslant \min\big(v_{p}(x + y), v_{p}(y)\big),$$
     ce qui impose $v_{p}(x + y) \leqslant v_{p}(x)$, donc $v_{p}(x + y) = v_{p}(x)$. 
    $$\boxed{v_{p}(x + y) \geqslant \min\big(v_{p}(x), v_{p}(y)\big), \text{ avec égalité si } v_{p}(x) \neq v_{p}(y)}$$

    **2.** Soit $k$ l'entier tel que $2^{k} \leqslant n < 2^{k + 1}$. Dans $[\![1\,;n]\!]$, l'entier $2^{k}$ est le seul de valuation $2$-adique $k$, puisque le multiple suivant de $2^{k}$ est $2^{k + 1} > n$, et tous les autres ont une valuation strictement inférieure. Ainsi $v_{2}\big(\frac{1}{2^{k}}\big) = -k$, et la somme $S$ des autres termes vérifie $v_{2}(S) > -k$ d'après la question 1 (b). Le cas d'égalité donne $v_{2}(H_{n}) = v_{2}\big(\frac{1}{2^{k}} + S\big) = -k$. 
    $$\boxed{v_{2}(H_{n}) = -k, \quad \text{où } 2^{k} \leqslant n < 2^{k + 1}}$$
     Par exemple, $H_{4} = \frac{25}{12}$ et $v_{2}(H_{4}) = -2$. ✓

    **3.** Pour $n > 1$, on a $k \geqslant 1$, donc $v_{2}(H_{n}) < 0$, alors qu'un entier a une valuation positive : $H_{n} \notin \mathbb{Z}$.

    Pour $m > n \geqslant 1$, on a $H_{m} - H_{n} = \sum_{j = n + 1}^{m} \frac{1}{j}$. Dans $[\![n + 1\,;m]\!]$, un seul entier a la plus grande valuation $2$-adique $k$ : si $2^{k}u < 2^{k}u'$ en avaient deux, avec $u$ et $u'$ impairs, l'entier $2^{k}(u + 1)$, compris entre eux, aurait une valuation strictement plus grande. Le raisonnement de la question 2 donne $v_{2}(H_{m} - H_{n}) = -k$. Si $k \geqslant 1$, on conclut. Si $k = 0$, l'intervalle ne contient aucun entier pair, donc se réduit à $\{n + 1\}$, et $H_{m} - H_{n} = \frac{1}{n + 1}$ avec $n + 1 \geqslant 2$. 
    $$\boxed{H_{n} \notin \mathbb{Z} \text{ pour } n > 1, \quad H_{m} - H_{n} \notin \mathbb{Z} \text{ pour } m > n \geqslant 1}$$
- id: "ma-12-58"
  feuille: "f-ma-12"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["PGCD et algorithme d'Euclide"]
  noeuds: [z-bezout]
  notions: [pgcd]
  page_enonce: 9
  page_corrige: 23
  enonce: |
    *Triplets pythagoriciens.* On veut résoudre l'équation 
    $$x^{2} + y^{2} = z^{2},$$
     d'inconnue $(x, y, z) \in \mathbb{Z}^{3}$. De tels triplets sont appelés triplets pythagoriciens.

    **1.** Montrer que l'on peut uniquement rechercher les triplets pythagoriciens dont les composantes sont positives et deux à deux premières entre elles. On les appelle triplets pythagoriciens primitifs.

    **2.** Soit $(x, y, z)$ un triplet pythagoricien primitif. Montrer que l'entier $z$ est impair.

    On supposera dans la suite que l'entier $y$ est pair.

    **3.** On pose $y = 2s$, $r = \dfrac{z + x}{2}$, et $t = \dfrac{z - x}{2}$. Montrer que $r \wedge t = 1$.

    **4.** Montrer que $r$ et $t$ sont des carrés parfaits.

    **5.** Montrer que l'ensemble des triplets pythagoriciens est : 
    $$\Big\{ \big(d(u^{2} - v^{2}), 2duv, d(u^{2} + v^{2})\big),\ \big(2duv, d(u^{2} - v^{2}), d(u^{2} + v^{2})\big) \ ; \ (d, u, v) \in \mathbb{Z}^{3} \Big\}.$$
  corrige: |
    **1.** Changer le signe d'une composante conserve l'équation : on peut supposer $x, y, z \geqslant 0$. Écartons le triplet nul, et soit $d = x \wedge y$. Comme $d^{2} \mid x^{2} + y^{2} = z^{2}$, on a $2v_{p}(d) \leqslant 2v_{p}(z)$ pour tout $p$, donc $d \mid z$ (proposition 10 (ii)). Le triplet $\big(\frac{x}{d}, \frac{y}{d}, \frac{z}{d}\big)$ est encore solution, avec $\frac{x}{d} \wedge \frac{y}{d} = 1$. Ses composantes sont alors deux à deux premières entre elles : si un nombre premier $p$ divisait $\frac{x}{d}$ et $\frac{z}{d}$, il diviserait $\big(\frac{y}{d}\big)^{2}$, donc $\frac{y}{d}$, par le lemme d'Euclide. Réciproquement, multiplier un triplet primitif par $d$ et changer des signes donne un triplet pythagoricien.

    **2.** Les entiers $x$ et $y$ ne sont pas tous deux pairs. S'ils étaient tous deux impairs, on aurait $z^{2} = x^{2} + y^{2} \equiv 2 \;[4]$, alors qu'un carré est congru à $0$ ou $1$ modulo $4$. Exactement l'un d'eux est donc pair, et $z^{2}$ est impair. 
    $$\boxed{z \text{ est impair}}$$

    **3.** Comme $x$ et $z$ sont impairs, $r$ et $t$ sont des entiers naturels, avec $r + t = z$ et $r - t = x$. Un diviseur commun de $r$ et $t$ divise $z$ et $x$, donc $1$. 
    $$\boxed{r \wedge t = 1}$$

    **4.** On a $y^{2} = z^{2} - x^{2} = (z + x)(z - x) = 4rt$, donc $s^{2} = rt$. Si $t = 0$, alors $r = z = x = 1$ et $y = 0$, et $r = 1^{2}$, $t = 0^{2}$. Sinon, $r$ et $t$ sont des entiers non nuls premiers entre eux dont le produit est un carré : ce sont des carrés d'après l'exercice 32. 
    $$\boxed{r = u^{2} \quad \text{et} \quad t = v^{2}, \quad u, v \in \mathbb{N}}$$

    **5.** On en tire $z = r + t = u^{2} + v^{2}$, $x = r - t = u^{2} - v^{2}$, et $s^{2} = u^{2}v^{2}$, donc $y = 2uv$. Si c'est $x$ qui est pair, on échange les rôles de $x$ et $y$. Par la question 1, un triplet quelconque s'obtient en multipliant par $d$ et en changeant des signes. Or ces changements restent dans l'ensemble proposé : remplacer $u$ par $-u$ change le signe de $2duv$ seul, échanger $u$ et $v$ celui de $d(u^{2} - v^{2})$ seul, et remplacer $d$ par $-d$ change le signe des trois composantes. Réciproquement, l'identité $(u^{2} - v^{2})^{2} + (2uv)^{2} = (u^{2} + v^{2})^{2}$ montre que tous ces triplets sont pythagoriciens. 
    $$\boxed{\Big\{ \big(d(u^{2} - v^{2}), 2duv, d(u^{2} + v^{2})\big), \ \big(2duv, d(u^{2} - v^{2}), d(u^{2} + v^{2})\big) \ ; \ (d, u, v) \in \mathbb{Z}^{3} \Big\}}$$
     Pour $(d, u, v) = (1, 2, 1)$, on retrouve $(3, 4, 5)$ ; pour $(1, 3, 2)$, le triplet $(5, 12, 13)$.
- id: "ma-12-59"
  feuille: "f-ma-12"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [division euclidienne, divisibilité, nombres premiers]
  noeuds: [z-division, z-premiers]
  notions: [division-euclidienne, nombre-premier]
  page_enonce: 10
  page_corrige: 24
  enonce: |
    *Nombres premiers en progression arithmétique.* Soit $r \in \mathbb{N}^{*}$ et $n \in \mathbb{N}^{*}$. On appelle *progression de nombres premiers* de raison $r$ et de longueur $n$ tout $n$-uplet $(p_{1}, \dots, p_{n})$ de nombres premiers tel que $p_{i + 1} = p_{i} + r$ pour tout $i \in [\![1\,;n - 1]\!]$. Par exemple, $(5, 11, 17, 23, 29)$ est une progression de nombres premiers de raison $6$ et de longueur $5$.

    **1.** Soit $(p_{1}, \dots, p_{n})$ une progression de nombres premiers de raison $r$ et de longueur $n \geqslant 3$. Montrer que $p_{1} > 2$ et que $r$ est pair.

    **2.** Montrer que, pour toute progression de nombres premiers $(p_{1}, \dots, p_{n})$, on a $n \leqslant p_{1}$. On pourra considérer le terme d'indice $p_{1} + 1$.

    **3.** Soit $(p_{1}, \dots, p_{n})$ une progression de nombres premiers de raison $r$, et $q$ un nombre premier strictement inférieur à $n$. On suppose, par l'absurde, que $q$ ne divise pas $r$, et l'on note, pour $i \in [\![1\,;n]\!]$, $\rho_{i}$ le reste de la division euclidienne de $p_{i}$ par $q$.

    **(a)** Montrer que, pour tous $i, j \in [\![1\,;n]\!]$, on a $\rho_{i} = \rho_{j}$ si et seulement si $q$ divise $i - j$.

    **(b)** En déduire que les restes $\rho_{1}, \dots, \rho_{q}$ sont deux à deux distincts.

    **(c)** Établir l'existence d'un indice $s \in [\![1\,;q]\!]$ tel que $p_{s} = q$, et aboutir à une contradiction.

    **4.** En déduire que la raison d'une progression de nombres premiers de longueur $n$ est divisible par le produit de tous les nombres premiers strictement inférieurs à $n$. Vérifier ce résultat sur la progression $(7, 37, 67, 97, 127, 157)$, et dire par quel entier est nécessairement divisible la raison d'une progression de nombres premiers de longueur $10$.
  corrige: |
    **1.** Si l'on avait $p_{1} = 2$, le terme $p_{3} = 2 + 2r$ serait pair et strictement supérieur à $2$, donc non premier. Ainsi $p_{1} \geqslant 3$, et $p_{1}$ est impair. Le terme $p_{2} > p_{1} \geqslant 3$ est premier, donc impair lui aussi, et $r = p_{2} - p_{1}$ est la différence de deux entiers impairs. 
    $$\boxed{p_{1} > 2 \quad \text{et} \quad r \text{ est pair}}$$

    **2.** Raisonnons par l'absurde en supposant $n > p_{1}$, c'est-à-dire $n \geqslant p_{1} + 1$. Le terme d'indice $p_{1} + 1$ existe alors, et il vaut 
    $$p_{p_{1} + 1} = p_{1} + p_{1}r = p_{1}(1 + r).$$
     Comme $p_{1} \geqslant 2$ et $1 + r \geqslant 2$, c'est le produit de deux entiers supérieurs ou égaux à $2$ : il n'est pas premier, ce qui est absurde. 
    $$\boxed{n \leqslant p_{1}}$$
     La borne est atteinte : $(3, 5, 7)$, $(5, 11, 17, 23, 29)$ et $(7, 157, 307, 457, 607, 757, 907)$, de raisons $2$, $6$ et $150$, sont des progressions de nombres premiers de longueur égale à leur premier terme.

    **3. (a)** Par récurrence immédiate, $p_{i} = p_{1} + (i - 1)r$, donc $p_{i} - p_{j} = (i - j)r$. Deux entiers ont le même reste dans la division par $q$ si et seulement s'ils sont congrus modulo $q$ (théorème 1). Ainsi $\rho_{i} = \rho_{j}$ si et seulement si $q$ divise $(i - j)r$. Comme $q$ est premier et ne divise pas $r$, le lemme d'Euclide (proposition 9 (ii)) montre que cela équivaut à $q \mid i - j$. 
    $$\boxed{\rho_{i} = \rho_{j} \iff q \mid i - j}$$

    **(b)** Comme $q < n$, les indices $1$, …, $q$ sont bien ceux de termes de la progression. Pour $i \neq j$ dans $[\![1\,;q]\!]$, on a $1 \leqslant |i - j| \leqslant q - 1$, donc $q$ ne divise pas $i - j$, et $\rho_{i} \neq \rho_{j}$ d'après la question (a).

    **(c)** Les $q$ restes $\rho_{1}$, …, $\rho_{q}$ sont deux à deux distincts et appartiennent à $[\![0\,;q - 1]\!]$, qui a $q$ éléments. L'ensemble qu'ils forment est une partie de $[\![0\,;q - 1]\!]$ de même cardinal, donc égale à $[\![0\,;q - 1]\!]$ tout entier (chapitre 2, lemme 3 (i)). En particulier, l'un d'eux est nul : il existe $s \in [\![1\,;q]\!]$ tel que $q$ divise $p_{s}$. Comme $p_{s}$ est premier et $q \geqslant 2$, on a $p_{s} = q$. Or la question 2 donne $p_{s} \geqslant p_{1} \geqslant n > q$, ce qui est absurde. 
    $$\boxed{\text{tout nombre premier } q < n \text{ divise la raison } r}$$

    **4.** Les nombres premiers strictement inférieurs à $n$ sont deux à deux premiers entre eux et divisent tous $r$, d'après la question 3. La proposition 7 (i), appliquée de proche en proche, montre que leur produit divise $r$ : à chaque étape, le produit des premiers déjà traités est premier avec le suivant, par la proposition 7 (ii). 
    $$\boxed{\prod_{q \in \mathcal{P}, \ q < n} q \ \text{ divise } r}$$
     La progression $(7, 37, 67, 97, 127, 157)$ a pour longueur $6$ et pour raison $30 = 2 \times 3 \times 5$, qui est bien le produit des nombres premiers inférieurs à $6$ ; son premier terme vérifie $7 \geqslant 6$, comme le veut la question 2. Pour une longueur $10$, la raison est un multiple de 
    $$\boxed{2 \times 3 \times 5 \times 7 = 210}$$
     et cette valeur est atteinte : les dix entiers $199 + 210k$, pour $k \in [\![0\,;9]\!]$, sont tous premiers, ce que l'on vérifie à l'ordinateur.

    *Piège.* La condition n'est que nécessaire. Avec la raison $30$, la progression issue de $13$ donne $13$, $43$, $73$, $103$, puis $133 = 7 \times 19$ : elle s'arrête à la longueur $4$, alors que $30$ est divisible par tous les premiers inférieurs à $6$.

    *À retenir.* L'exercice ne dit pas qu'il existe des progressions de nombres premiers de longueur arbitraire ; il dit seulement que, si elles existent, leur raison et leur premier terme doivent être très grands. Leur existence est un théorème difficile, démontré par Ben Green et Terence Tao en 2004.
- id: "ma-12-60"
  feuille: "f-ma-12"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [Bézout, nombres premiers]
  noeuds: [z-bezout, z-premiers]
  notions: [nombre-premier]
  page_enonce: 10
  page_corrige: 25
  enonce: |
    *Des ensembles emboîtés d'intersection vide.* On note $F = \mathbb{Q} \setminus \{-1, 0, 1\}$ et $f$ l'application définie sur $\mathbb{Q}^{*}$ par $f(x) = x - \dfrac{1}{x}$. On pose $f^{\circ 0} = \mathrm{id}_{F}$ et, pour $n \in \mathbb{N}$, $f^{\circ(n + 1)} = f \circ f^{\circ n}$. Pour $x \in \mathbb{Q}^{*}$ de forme irréductible $\dfrac{p}{q}$, avec $p \in \mathbb{Z}^{*}$ et $q \in \mathbb{N}^{*}$, on appelle *hauteur* de $x$ l'entier $H(x) = |p| + q$.

    **1.** Montrer que $f(F) \subset F$. On pourra utiliser l'exercice 21.

    **2.** Montrer que la suite d'ensembles $\big(f^{\circ n}(F)\big)_{n \in \mathbb{N}}$ est décroissante pour l'inclusion et qu'aucun de ses termes n'est vide. Calculer $f(2)$, $f^{\circ 2}(2)$ et $f^{\circ 3}(2)$, ainsi que leurs hauteurs.

    **3.** Soit $x \in F$, de forme irréductible $\dfrac{p}{q}$. Montrer que $p^{2} - q^{2}$ et $pq$ sont premiers entre eux, et en déduire que 
    $$H\big(f(x)\big) = |p^{2} - q^{2}| + |p|\,q.$$

    **4.** En déduire que $H\big(f(x)\big) \geqslant H(x) + 1$ pour tout $x \in F$, puis que tout élément $y$ de $f^{\circ n}(F)$ vérifie $H(y) \geqslant n + 3$.

    **5.** Montrer que $\displaystyle\bigcap_{n \in \mathbb{N}} f^{\circ n}(F) = \varnothing$.
  corrige: |
    **1.** Soit $x \in F$. Le nombre $f(x)$ est rationnel, et il reste à voir qu'il ne vaut ni $0$, ni $1$, ni $-1$. En multipliant par $x \neq 0$, on obtient les équivalences suivantes.

    • $f(x) = 0$ équivaut à $x^{2} = 1$, c'est-à-dire $x = \pm 1$, ce qui est exclu.

    • $f(x) = 1$ équivaut à $x^{2} - x - 1 = 0$. D'après l'exercice 21, une solution rationnelle de cette équation serait un entier divisant $-1$, donc $\pm 1$ ; or $1 - 1 - 1 = -1$ et $1 + 1 - 1 = 1$ ne sont pas nuls.

    • $f(x) = -1$ équivaut à $x^{2} + x - 1 = 0$, et l'on conclut de même, puisque $1 + 1 - 1 = 1$ et $1 - 1 - 1 = -1$.

    $$\boxed{f(F) \subset F}$$

    **2.** Par associativité de la composition, $f^{\circ(n + 1)}$ est aussi égale à $f^{\circ n} \circ f$. La question 1 donne alors 
    $$f^{\circ(n + 1)}(F) = f^{\circ n}\big(f(F)\big) \subset f^{\circ n}(F).$$
     Chaque $f^{\circ n}(F)$ est l'image de l'ensemble non vide $F$, donc n'est pas vide. Pour les calculs, on applique trois fois la définition de $f$. 
    $$\boxed{f(2) = \frac{3}{2}, \qquad f^{\circ 2}(2) = \frac{3}{2} - \frac{2}{3} = \frac{5}{6}, \qquad f^{\circ 3}(2) = \frac{5}{6} - \frac{6}{5} = -\frac{11}{30}}$$
     Les hauteurs successives sont $H(2) = 3$, puis $5$, $11$ et $41$ : elles augmentent, et c'est ce que la suite va exploiter. On peut d'ailleurs montrer que chaque $f^{\circ n}(F)$ est infini, puisque $f(x) = f(x')$ équivaut à $(x - x')\big(1 + \frac{1}{xx'}\big) = 0$, de sorte que $f$ prend chaque valeur au plus deux fois.

    **3.** Soit $\ell$ un nombre premier qui divise $pq$. Par le lemme d'Euclide, il divise $p$ ou $q$ ; s'il divise $p$ et $p^{2} - q^{2}$, il divise $q^{2} = p^{2} - (p^{2} - q^{2})$, donc $q$, ce qui contredit $p \wedge q = 1$. Le cas où $\ell$ divise $q$ est symétrique. Ainsi $p^{2} - q^{2}$ et $pq$ n'ont aucun facteur premier commun, et leur PGCD, qui n'a aucun diviseur premier, vaut $1$ (théorème 6). Par ailleurs, la réduction au même dénominateur donne 
    $$f(x) = \frac{p}{q} - \frac{q}{p} = \frac{p^{2} - q^{2}}{pq}.$$
     Si $p > 0$, c'est la forme irréductible de $f(x)$ ; si $p < 0$, c'est $\frac{q^{2} - p^{2}}{|p|q}$. Dans les deux cas, l'unicité de la forme irréductible (proposition 6) donne la hauteur. 
    $$\boxed{(p^{2} - q^{2}) \wedge pq = 1 \qquad \text{et} \qquad H\big(f(x)\big) = |p^{2} - q^{2}| + |p|\,q}$$

    **4.** On note $a = |p| \geqslant 1$. Si l'on avait $a = q$, l'égalité $p \wedge q = 1$ imposerait $a = q = 1$, donc $x = \pm 1$, ce qui est exclu. Ainsi $|a - q| \geqslant 1$, et 
    $$|p^{2} - q^{2}| = |a - q|\,(a + q) \geqslant a + q = H(x), \qquad |p|\,q \geqslant 1.$$
     En ajoutant ces deux inégalités, on obtient la première propriété. 
    $$\boxed{H\big(f(x)\big) \geqslant H(x) + 1}$$
     Pour la seconde, on raisonne par récurrence sur $n$. Pour $n = 0$, tout $x \in F$ vérifie $H(x) \geqslant 3$, car $H(x) = 2$ impose $|p| = q = 1$. Si la propriété est vraie au rang $n$, tout $y \in f^{\circ(n + 1)}(F)$ s'écrit $y = f(x)$ avec $x \in f^{\circ n}(F) \subset F$, et $H(y) \geqslant H(x) + 1 \geqslant n + 4$. 
    $$\boxed{\forall n \in \mathbb{N}, \ \forall y \in f^{\circ n}(F), \quad H(y) \geqslant n + 3}$$
     *Piège.* Le dénominateur seul ne croît pas : $f\big(\frac{1}{2}\big) = -\frac{3}{2}$ a le même dénominateur que $\frac{1}{2}$. C'est pourquoi on mesure la taille d'un rationnel par sa hauteur, qui fait intervenir le numérateur, et pourquoi il faut la forme irréductible : sans la question 3, rien n'empêcherait une simplification de faire baisser la hauteur.

    **5.** Supposons qu'un rationnel $y$ appartienne à tous les $f^{\circ n}(F)$. En particulier, $y \in f^{\circ H(y)}(F)$, et la question 4 donne $H(y) \geqslant H(y) + 3$, ce qui est absurde. 
    $$\boxed{\bigcap_{n \in \mathbb{N}} f^{\circ n}(F) = \varnothing}$$
     *À retenir.* On a construit une suite décroissante d'ensembles non vides, et même infinis, dont l'intersection est vide. Cela heurte l'intuition, et cela ne peut pas arriver avec des segments de $\mathbb{R}$ : si $[a_{n}, b_{n}]$ est une suite décroissante de segments non vides, la suite $(a_{n})$ est croissante et majorée par $b_{0}$, donc converge vers un réel $\ell$ (chapitre 7, théorème 8), qui appartient à tous les segments. L'arithmétique fournit ici l'invariant qui croît strictement, la hauteur, et c'est la forme irréductible qui la rend calculable.
- id: "ma-12-61"
  feuille: "f-ma-12"
  numero: 61
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [divisibilité, nombres premiers]
  noeuds: [z-division, z-premiers]
  notions: [nombre-premier]
  page_enonce: 10
  page_corrige: 26
  enonce: |
    *Les sous-anneaux de $\mathbb{Q}$.* On note $\mathcal{P}$ l'ensemble des nombres premiers. Pour toute partie $E$ de $\mathcal{P}$, on note $A_{E}$ l'ensemble des rationnels qui peuvent s'écrire $\dfrac{a}{b}$, avec $a \in \mathbb{Z}$ et $b \in \mathbb{N}^{*}$ dont tous les diviseurs premiers appartiennent à $E$ (l'entier $b = 1$, qui n'a aucun diviseur premier, est donc toujours permis).

    **1.** Montrer que $A_{E}$ est un sous-anneau de $\mathbb{Q}$. Déterminer $A_{\varnothing}$, $A_{\mathcal{P}}$ et $A_{\{2, 5\}}$, et comparer $A_{\mathcal{P} \setminus \{2\}}$ avec l'anneau de l'exercice 35 de la feuille du chapitre 11.

    **2.** Soit $A$ un sous-anneau de $\mathbb{Q}$, et $x \in A$, de forme irréductible $\dfrac{a}{b}$. Montrer que $\dfrac{1}{b} \in A$, puis que $\dfrac{1}{p} \in A$ pour tout nombre premier $p$ qui divise $b$.

    **3.** Pour tout sous-anneau $A$ de $\mathbb{Q}$, on note $E(A) = \Big\{p \in \mathcal{P} \ \Big| \ \dfrac{1}{p} \in A\Big\}$. Montrer que $A = A_{E(A)}$.

    **4.** Montrer que l'application $E \longmapsto A_{E}$ est une bijection de l'ensemble des parties de $\mathcal{P}$ sur l'ensemble des sous-anneaux de $\mathbb{Q}$.

    **5.** En déduire que $\mathbb{Q}$ est le seul sous-anneau de $\mathbb{Q}$ qui soit un corps, puis déterminer le plus petit sous-anneau de $\mathbb{Q}$ contenant $\dfrac{3}{10}$.

    Les six derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin.
  corrige: |
    **1.** On dira qu'un entier $b \in \mathbb{N}^{*}$ est *admissible* si tous ses diviseurs premiers appartiennent à $E$. L'entier $1 = \frac{1}{1}$ appartient à $A_{E}$. Si $x = \frac{a}{b}$ et $y = \frac{c}{d}$, avec $b$ et $d$ admissibles, alors 
    $$x - y = \frac{ad - bc}{bd} \qquad \text{et} \qquad xy = \frac{ac}{bd},$$
     et $bd$ est admissible, puisqu'un nombre premier qui divise $bd$ divise $b$ ou $d$ (lemme d'Euclide). Ainsi $A_{E}$ contient $1$ et est stable par différence et par produit. 
    $$\boxed{A_{E} \text{ est un sous-anneau de } \mathbb{Q}}$$
     Pour $E = \varnothing$, seul $b = 1$ est admissible, et $A_{\varnothing} = \mathbb{Z}$. Pour $E = \mathcal{P}$, tout $b$ est admissible, et $A_{\mathcal{P}} = \mathbb{Q}$. Pour $E = \{2, 5\}$, un rationnel $\frac{a}{2^{\alpha}5^{\beta}}$ s'écrit, avec $\gamma = \max(\alpha, \beta)$, 
    $$\frac{a}{2^{\alpha}5^{\beta}} = \frac{a \times 2^{\gamma - \alpha}5^{\gamma - \beta}}{10^{\gamma}},$$
     qui est décimal ; réciproquement, $\frac{k}{10^{n}}$ a un dénominateur admissible. Enfin, pour $E = \mathcal{P} \setminus \{2\}$, les entiers admissibles sont les entiers impairs. 
    $$\boxed{A_{\varnothing} = \mathbb{Z}, \qquad A_{\mathcal{P}} = \mathbb{Q}, \qquad A_{\{2, 5\}} = \mathbb{D}, \qquad A_{\mathcal{P} \setminus \{2\}} = \text{anneau de l'exercice 35 du chapitre 11}}$$

    **2.** Comme $a \wedge b = 1$, le théorème de Bézout fournit des entiers $u$ et $v$ tels que $au + bv = 1$. En divisant par $b$, on obtient 
    $$\frac{1}{b} = u\,x + v.$$
     Or $A$ contient $1$, donc $\mathbb{Z}$, puisqu'il est stable par somme et par opposé ; il est stable par somme et par produit, donc contient $ux + v$. Si $p$ est un nombre premier qui divise $b$, on écrit $b = pc$, et $\frac{1}{p} = c \times \frac{1}{b}$ appartient à $A$. 
    $$\boxed{\frac{1}{b} \in A, \quad \text{et} \quad \frac{1}{p} \in A \text{ pour tout nombre premier } p \mid b}$$
     Par exemple, si $\frac{3}{10} \in A$, la relation $3 \times 7 - 10 \times 2 = 1$ donne $\frac{1}{10} = 7 \times \frac{3}{10} - 2 \in A$, puis $\frac{1}{2} = 5 \times \frac{1}{10}$ et $\frac{1}{5} = 2 \times \frac{1}{10}$.

    *Piège.* La forme irréductible est indispensable. L'anneau $A_{\{3\}}$ contient $\frac{2}{6} = \frac{1}{3}$, mais pas $\frac{1}{6}$ : sinon il contiendrait $\frac{1}{2} = 3 \times \frac{1}{6}$, et l'on aurait $\frac{1}{2} = \frac{a}{3^{k}}$, soit $3^{k} = 2a$, ce qui est impossible puisque $3^{k}$ est impair.

    **3.** On procède par double inclusion. Soit $x \in A$, de forme irréductible $\frac{a}{b}$. D'après la question 2, tous les diviseurs premiers de $b$ appartiennent à $E(A)$, donc $x \in A_{E(A)}$. Réciproquement, soit $x = \frac{a}{b}$ avec $b$ admissible pour $E(A)$. Par le théorème 6, $b$ s'écrit $p_{1}p_{2} \cdots p_{k}$, avec des nombres premiers $p_{i}$ non nécessairement distincts, tous dans $E(A)$ (et $k = 0$ si $b = 1$). Alors 
    $$x = a \times \frac{1}{p_{1}} \times \cdots \times \frac{1}{p_{k}}$$
     est un produit d'éléments de $A$, donc appartient à $A$. 
    $$\boxed{A = A_{E(A)}}$$

    **4.** On note $\Phi$ l'application $E \longmapsto A_{E}$, qui est bien à valeurs dans l'ensemble des sous-anneaux de $\mathbb{Q}$ d'après la question 1. Elle est surjective, puisque tout sous-anneau $A$ s'écrit $\Phi\big(E(A)\big)$ par la question 3. Pour l'injectivité, on montre que $E(A_{E}) = E$. Si $p \in E$, alors $\frac{1}{p} \in A_{E}$, puisque $p$ est admissible. Réciproquement, si $\frac{1}{p} \in A_{E}$, on écrit $\frac{1}{p} = \frac{a}{b}$ avec $b$ admissible ; alors $b = pa$, donc $p$ divise $b$, et $p \in E$. Ainsi, si $A_{E} = A_{E'}$, on a $E = E(A_{E}) = E(A_{E'}) = E'$. 
    $$\boxed{E \longmapsto A_{E} \text{ est bijective, de réciproque } A \longmapsto E(A)}$$

    **5.** Soit $A$ un sous-anneau de $\mathbb{Q}$ qui soit un corps, et $p$ un nombre premier. L'élément $p$ de $A$ est non nul, donc admet un inverse dans $A$, qui est aussi un inverse de $p$ dans $\mathbb{Q}$ ; par unicité de l'inverse (chapitre 11, proposition 2), c'est $\frac{1}{p}$. Ainsi $E(A) = \mathcal{P}$, et $A = A_{\mathcal{P}} = \mathbb{Q}$ par la question 3.

    Soit maintenant $A$ un sous-anneau de $\mathbb{Q}$ contenant $\frac{3}{10}$, qui est sous forme irréductible. La question 2 donne $\frac{1}{2} \in A$ et $\frac{1}{5} \in A$, donc $\{2, 5\} \subset E(A)$, et $A = A_{E(A)}$ contient $A_{\{2, 5\}}$, puisqu'un entier admissible pour $\{2, 5\}$ l'est pour toute partie plus grande. Comme $A_{\{2, 5\}} = \mathbb{D}$ contient $\frac{3}{10}$, c'est le plus petit sous-anneau cherché. 
    $$\boxed{\mathbb{Q} \text{ est le seul sous-anneau de } \mathbb{Q} \text{ qui soit un corps, et le plus petit sous-anneau contenant } \tfrac{3}{10} \text{ est } \mathbb{D}}$$
     *À retenir.* Les sous-groupes de $\mathbb{Z}$ sont décrits par un seul entier (théorème 2) ; les sous-anneaux de $\mathbb{Q}$ le sont par une partie de $\mathcal{P}$, éventuellement infinie, et deux parties distinctes donnent deux sous-anneaux distincts. Il faut cependant prendre garde à ne pas confondre sous-anneau et sous-groupe : $\frac{1}{2}\mathbb{Z}$ est un sous-groupe de $(\mathbb{Q}, +)$ qui contient $1$, mais ce n'est pas un sous-anneau, puisque $\frac{1}{2} \times \frac{1}{2} = \frac{1}{4}$ n'y appartient pas ; le plus petit sous-anneau qui le contient est $A_{\{2\}}$.

    Les six derniers exercices sont des problèmes à traiter en autonomie ; le corrigé indique la démarche, puis la rédige.
- id: "ma-12-62"
  feuille: "f-ma-12"
  numero: 62
  partie: "Exercices de synthèse"
  etoiles: 4
