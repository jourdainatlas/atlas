  enonce: |
    Déterminer l'ensemble des nombres complexes non nuls $z$ tels que $\dfrac{1+z}{z}$ soit réel. Quelle est l'image de cet ensemble ?
  corrige: |
    Pour $z\neq 0$, $\dfrac{1+z}{z}=\dfrac{1}{z}+1$. Ce nombre est réel si et seulement si $\frac{1}{z}$ est réel, c'est-à-dire si et seulement si $z=\frac{1}{1/z}$ est réel (l'inverse d'un réel non nul est réel). 
    $$\boxed{\text{l'ensemble est } \mathbb{R}^{*} \text{ ; son image est l'axe des abscisses privé de } O}$$
- id: "me-08-21"
  feuille: "f-me-08"
  numero: 21
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["affixe d'un vecteur", alignement et orthogonalité]
  noeuds: [c-calcul]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 366"
  page_enonce: 5
  page_corrige: 16
  enonce: |
    Quels sont les nombres complexes non nuls $z$ tels que les points d'affixes $i$, $z$, $\dfrac{1}{z}$ soient alignés ?
  corrige: |
    Si $z=i$, deux des trois points sont confondus : ils sont alignés. Supposons $z\neq i$, et notons $A(i)$, $M(z)$, $N\left(\frac{1}{z}\right)$. D'après la Proposition 8, ils sont alignés si et seulement si $\dfrac{\frac{1}{z}-i}{z-i}$ est réel, ce qui revient à dire que $\left(\frac{1}{z}-i\right)\overline{(z-i)}$ est réel, puisqu'on a multiplié par $|z-i|^{2}>0$. Avec $z=x+iy$ et $r^{2}=x^{2}+y^{2}$ : 
    $$\frac{1}{z}-i=\frac{x-iy}{r^{2}}-i=\frac{x-i\left(y+r^{2}\right)}{r^{2}} \qquad ; \qquad \overline{z-i}=x-i(y-1)$$
     La partie imaginaire du produit $\big(x-i(y+r^{2})\big)\big(x-i(y-1)\big)$ vaut $-x(y-1)-x(y+r^{2})=-x\left(x^{2}+y^{2}+2y-1\right)$. Elle est nulle si et seulement si $x=0$ ou $x^{2}+(y+1)^{2}=2$. Le cas $z=i$ est contenu dans le premier. 
    $$\boxed{\text{les points sont alignés} \iff z\in i\mathbb{R}^{*} \ \text{ ou } \ |z+i|=\sqrt{2}}$$
     L'image est la réunion de l'axe des ordonnées privé de $O$ et du cercle de centre $-i$ et de rayon $\sqrt{2}$, qui ne passe pas par $O$. Exemple : $z=\sqrt{2}-i$ est sur ce cercle, puisque $2+0=2$. On a alors $\frac{1}{z}=\frac{\sqrt{2}+i}{3}$, et l'on vérifie que $\dfrac{\frac{1}{z}-i}{z-i}=\dfrac{1}{3}$ est réel.
- id: "me-08-22"
  feuille: "f-me-08"
