  enonce: |
    **a)** Déterminer, en utilisant la forme trigonométrique, les nombres complexes $z$ tels que $z^{2}=i$.

    **b)** Exprimer les racines carrées de $2i\,e^{-i\pi/4}$ sous forme trigonométrique.
  corrige: |
    **a)** On cherche $z=re^{i\theta}$ avec $r>0$, puisque $z=0$ n'est pas solution. Comme $i=e^{i\frac{\pi}{2}}$ : 
    $$z^{2}=i \iff r^{2}e^{2i\theta}=e^{i\frac{\pi}{2}} \iff \left\{\begin{array}{l} r^{2}=1 \\ 2\theta\equiv\frac{\pi}{2}\;[2\pi] \end{array}\right. \iff \left\{\begin{array}{l} r=1 \\ \theta\equiv\frac{\pi}{4}\;[\pi] \end{array}\right.$$

    $$\boxed{z=e^{i\frac{\pi}{4}}=\tfrac{\sqrt{2}}{2}(1+i) \quad \text{ou} \quad z=e^{i\frac{5\pi}{4}}=-\tfrac{\sqrt{2}}{2}(1+i)}$$

    **b)** $2i\,e^{-i\pi/4}=2e^{i\frac{\pi}{2}}e^{-i\frac{\pi}{4}}=2e^{i\frac{\pi}{4}}$. Par la même méthode, $z^{2}=2e^{i\frac{\pi}{4}}$ équivaut à $|z|=\sqrt{2}$ et $\arg(z)\equiv\frac{\pi}{8}\;[\pi]$ : 
    $$\boxed{\sqrt{2}\,e^{i\frac{\pi}{8}} \quad \text{et} \quad \sqrt{2}\,e^{i\frac{9\pi}{8}}=-\sqrt{2}\,e^{i\frac{\pi}{8}}}$$
     Comme pour les réels, les deux racines carrées d'un complexe non nul sont opposées.
