  enonce: |
    Montrer que l'ensemble des nombres complexes non nuls $z$ tels que $\left|z+\dfrac{1}{z}\right|=2$ a pour image la réunion de deux cercles que l'on précisera.
  corrige: |
    Pour $z\neq 0$ : $\left|z+\frac{1}{z}\right|=2\iff\left|\frac{z^{2}+1}{z}\right|=2\iff|z^{2}+1|^{2}=4|z|^{2}$. On développe avec le conjugué, en posant $z=x+iy$ : 
    $$|z^{2}+1|^{2}=\left(z^{2}+1\right)\left(\overline{z}^{2}+1\right)=|z|^{4}+z^{2}+\overline{z}^{2}+1=|z|^{4}+2\left(x^{2}-y^{2}\right)+1$$
     car $z^{2}+\overline{z}^{2}=2\mathcal{R}e\left(z^{2}\right)=2(x^{2}-y^{2})$. En notant $\rho=|z|^{2}=x^{2}+y^{2}$, l'équation devient : 
    $$\rho^{2}+2x^{2}-2y^{2}+1-4x^{2}-4y^{2}=0 \iff \rho^{2}-2\rho+1-4y^{2}=0 \iff (\rho-1)^{2}=(2y)^{2}$$
     c'est-à-dire $\rho-1=2y$ ou $\rho-1=-2y$, soit : 
    $$x^{2}+(y-1)^{2}=2 \qquad \text{ou} \qquad x^{2}+(y+1)^{2}=2$$
     Aucun de ces deux cercles ne passe par $O$, car $0+1\neq 2$ : la condition $z\neq 0$ n'enlève aucun point. 
    $$\boxed{\text{réunion des cercles de centres } i \text{ et } -i, \text{ de rayon } \sqrt{2}}$$
     Contrôle : $z=(\sqrt{2}+1)i$ est sur le premier cercle, et $z+\frac{1}{z}=(\sqrt{2}+1)i-\frac{i}{\sqrt{2}+1}=\left(\sqrt{2}+1-(\sqrt{2}-1)\right)i=2i$, de module $2$.
