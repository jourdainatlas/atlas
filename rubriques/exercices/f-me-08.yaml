  enonce: |
    **a)** Soient $a$, $b$, $c$, $d$ quatre nombres complexes. Vérifier que 
    $$(a-c)(b-d)=(b-a)(d-c)+(b-c)(a-d).$$

    **b)** Soient $A$, $B$, $C$, $D$ quatre points du plan. Montrer que 
    $$AC\cdot BD\leqslant AB\cdot CD+BC\cdot DA.$$
  corrige: |
    **a)** On développe chaque membre : 
    $$\begin{aligned} (a-c)(b-d)&=ab-ad-bc+cd \\ (b-a)(d-c)+(b-c)(a-d)&=(bd-bc-ad+ac)+(ab-bd-ac+cd)=ab-ad-bc+cd \end{aligned}$$
     Les deux membres sont égaux.

    **b)** On note $a$, $b$, $c$, $d$ les affixes de $A$, $B$, $C$, $D$. On passe au module dans l'égalité a), puis on applique l'inégalité triangulaire (Proposition 5) et $|zz'|=|z|\,|z'|$ : 
    $$AC\cdot BD=|a-c|\,|b-d|=\left|(b-a)(d-c)+(b-c)(a-d)\right|\leqslant|b-a|\,|d-c|+|b-c|\,|a-d|$$

    $$\boxed{AC\cdot BD\leqslant AB\cdot CD+BC\cdot DA}$$
     *Pour un carré de côté $1$, $AC\cdot BD=\sqrt{2}\times\sqrt{2}=2=1\times 1+1\times 1$ : il y a égalité. Le théorème de Ptolémée affirme que l'égalité a lieu exactement lorsque $ABCD$ est un quadrilatère convexe inscrit dans un cercle.*
