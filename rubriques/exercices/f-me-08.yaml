  enonce: |
    Quels sont les nombres complexes $z$ tels que le triangle dont les sommets ont pour affixes $1$, $i$, $z$ soit rectangle en $z$ ?
  corrige: |
    Le triangle doit avoir trois sommets distincts : $z\neq 1$ et $z\neq i$. Il est rectangle en $z$ si et seulement si $\frac{1-z}{i-z}\in i\mathbb{R}$ (Proposition 8), c'est-à-dire si la partie réelle de $(1-z)\overline{(i-z)}$ est nulle. Avec $z=x+iy$ : 
    $$(1-z)\overline{(i-z)}=\big((1-x)-iy\big)\big(-x-i(1-y)\big)$$
     dont la partie réelle vaut $-x(1-x)-y(1-y)=x^{2}-x+y^{2}-y$. Elle est nulle si et seulement si : 
    $$\left(x-\tfrac{1}{2}\right)^{2}+\left(y-\tfrac{1}{2}\right)^{2}=\tfrac{1}{2}$$

    $$\boxed{z \text{ décrit le cercle de centre } \tfrac{1+i}{2} \text{ et de rayon } \tfrac{\sqrt{2}}{2}, \text{ privé des points } 1 \text{ et } i}$$
     C'est le cercle de diamètre $[AB]$, avec $A(1)$ et $B(i)$ : on retrouve le résultat de l'exercice 18.
- id: "me-08-23"
  feuille: "f-me-08"
  numero: 23
  partie: "Pour aller plus loin"
  etoiles: 3
