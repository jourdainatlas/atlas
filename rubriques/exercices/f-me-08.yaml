  enonce: |
    Soient $m$ et $n$ deux éléments de $\mathbb{N}^{*}$. À quelle condition a-t-on l'inclusion $\mathbb{U}_{m}\subset\mathbb{U}_{n}$ ?
  corrige: |
    Montrons que $\mathbb{U}_{m}\subset\mathbb{U}_{n}\iff m\mid n$.

    • Si $m\mid n$, on écrit $n=mq$. Pour $z\in\mathbb{U}_{m}$, $z^{n}=\left(z^{m}\right)^{q}=1^{q}=1$, donc $z\in\mathbb{U}_{n}$.

    • Si $\mathbb{U}_{m}\subset\mathbb{U}_{n}$, alors en particulier $e^{i\frac{2\pi}{m}}\in\mathbb{U}_{n}$, donc $e^{i\frac{2n\pi}{m}}=1$, c'est-à-dire $\frac{2n\pi}{m}\equiv 0\;[2\pi]$ : il existe $k\in\mathbb{Z}$ tel que $\frac{n}{m}=k$, donc $m\mid n$.

    $$\boxed{\mathbb{U}_{m}\subset\mathbb{U}_{n}\iff m \text{ divise } n}$$
     Par exemple $\mathbb{U}_{3}\subset\mathbb{U}_{6}$ : les sommets du triangle équilatéral $1$, $j$, $j^{2}$ sont des sommets de l'hexagone régulier. En revanche $\mathbb{U}_{4}\not\subset\mathbb{U}_{6}$, puisque $i^{6}=-1$.
- id: "me-08-31"
  feuille: "f-me-08"
  numero: 31
  titre: "Droite d'Euler d'un triangle"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: ["racines de l'unité", "affixe d'un vecteur", cercles et médiatrices, alignement et orthogonalité, nature de figures, angles orientés, droites remarquables du triangle]
  noeuds: [cx-exponentielle, a-sous-groupe, c-calcul, cx-pi]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 369"
  page_enonce: 6
  page_corrige: 19
  enonce: |
    Soient, dans les questions a) à c), $a$, $b$, $c$ trois éléments distincts de $\mathbb{U}$, $A$, $B$, $C$ leurs images.

    **a)** Quel est le centre du cercle circonscrit au triangle $ABC$ ?

    **b)** Soit $M$ un point du plan d'affixe $z$. En remarquant que le conjugué d'un élément de $\mathbb{U}$ est égal à son inverse, montrer que $M$ appartient à la hauteur du triangle $ABC$ issue de $C$ si et seulement si 
    $$\overline{z}=\frac{z}{ab}+\frac{1}{c}-\frac{c}{ab}.$$

    **c)** Montrer que les trois hauteurs de $ABC$ concourent au point d'affixe $h=a+b+c$.

    **d)** Montrer que dans un triangle quelconque $ABC$, l'orthocentre $H$, le centre de gravité $G$ et le centre du cercle circonscrit $O$ sont alignés et vérifient la relation d'Euler 
    $$\overrightarrow{OH}=3\,\overrightarrow{OG}.$$
  corrige: |
    **a)** $OA=|a|=1$, $OB=|b|=1$, $OC=|c|=1$ : le point $O$ est équidistant des trois sommets. $\boxed{\text{c'est le centre du cercle circonscrit}}$

    **b)** Comme dans l'exercice 14, $M$ est sur la hauteur issue de $C$ si et seulement si $w=\frac{z-c}{b-a}$ est un imaginaire pur, éventuellement nul, c'est-à-dire si et seulement si $\overline{w}=-w$. Or $\overline{a}=\frac{1}{a}$, $\overline{b}=\frac{1}{b}$, $\overline{c}=\frac{1}{c}$, donc : 
    $$\overline{b-a}=\frac{1}{b}-\frac{1}{a}=\frac{a-b}{ab}=-\frac{b-a}{ab} \qquad \text{et} \qquad \overline{w}=\frac{\overline{z}-\frac{1}{c}}{-\frac{b-a}{ab}}=-\frac{ab\left(\overline{z}-\frac{1}{c}\right)}{b-a}$$
     Ainsi $\overline{w}=-w\iff ab\left(\overline{z}-\frac{1}{c}\right)=z-c\iff\boxed{\overline{z}=\frac{z}{ab}+\frac{1}{c}-\frac{c}{ab}}$.

    **c)** Vérifions que $h=a+b+c$ satisfait cette relation : 
    $$\frac{h}{ab}+\frac{1}{c}-\frac{c}{ab}=\frac{a+b}{ab}+\frac{1}{c}=\frac{1}{b}+\frac{1}{a}+\frac{1}{c}=\overline{a}+\overline{b}+\overline{c}=\overline{h}$$
     Le point $H(h)$ est donc sur la hauteur issue de $C$. L'expression $h=a+b+c$ étant symétrique en $a$, $b$, $c$, le même calcul, en échangeant les rôles des lettres, montre que $H$ est sur les hauteurs issues de $A$ et de $B$. $\boxed{\text{les trois hauteurs concourent en } H(a+b+c)}$

    **d)** Soit $ABC$ un triangle quelconque, $O$ le centre de son cercle circonscrit et $R$ son rayon. On choisit le repère orthonormé d'origine $O$ et d'unité $R$ : les affixes $a$, $b$, $c$ des sommets sont alors de module $1$, et les questions précédentes s'appliquent. Le centre de gravité a pour affixe $g=\frac{a+b+c}{3}$ (exercice 25), et l'orthocentre $h=a+b+c$. Donc $h=3g$, c'est-à-dire : 
    $$\boxed{\overrightarrow{OH}=3\,\overrightarrow{OG}}$$
     Les points $O$, $G$ et $H$ sont alignés : lorsqu'ils sont distincts, la droite qui les porte est la *droite d'Euler* du triangle. Ils sont confondus lorsque $a+b+c=0$, par exemple pour le triangle équilatéral de sommets $1$, $j$, $j^{2}$ de l'exercice 5.

