  enonce: |
    Soient $a$, $b$, $c$ trois nombres complexes, $A$, $B$, $C$ leurs images dans le plan. On suppose que $A$, $B$, $C$ ne sont pas alignés. Montrer que les médianes du triangle $ABC$ passent par le point $G$ d'affixe $g=\dfrac{a+b+c}{3}$ (qui est le centre de gravité du triangle $ABC$).
  corrige: |
    Soit $A'$ le milieu de $[BC]$, d'affixe $a'=\frac{b+c}{2}$ ; la médiane issue de $A$ est la droite $(AA')$, et $A'\neq A$ puisque $A$, $B$, $C$ ne sont pas alignés. On calcule : 
    $$g-a=\frac{a+b+c}{3}-a=\frac{b+c-2a}{3}=\frac{2}{3}\left(\frac{b+c}{2}-a\right)=\frac{2}{3}(a'-a)$$
     Ainsi $\frac{g-a}{a'-a}=\frac{2}{3}\in\mathbb{R}$ : $G$ appartient à $(AA')$, et même $\overrightarrow{AG}=\frac{2}{3}\overrightarrow{AA'}$. L'expression de $g$ étant symétrique en $a$, $b$, $c$, le même calcul montre que $G$ appartient aux deux autres médianes. 
    $$\boxed{\text{les trois médianes passent par } G, \text{ situé aux deux tiers de chacune à partir du sommet}}$$
