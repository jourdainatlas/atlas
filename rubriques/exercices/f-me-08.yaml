  enonce: |
    Soient $a$, $b$, $c$ trois nombres complexes distincts, $A$, $B$, $C$ leurs images dans le plan.

    **a)** À quelle condition sur $\dfrac{c-a}{b-a}$ le triangle $ABC$ est-il équilatéral de sens direct ? de sens indirect ?

    **b)** Montrer que le triangle $ABC$ est équilatéral si et seulement si $a^{2}+b^{2}+c^{2}-ab-bc-ca=0$.
  corrige: |
    **a)** $ABC$ est équilatéral direct si et seulement si $AC=AB$ et $\left(\overrightarrow{AB},\overrightarrow{AC}\right)\equiv\frac{\pi}{3}\;[2\pi]$, c'est-à-dire, d'après la Proposition 7, si et seulement si : 
    $$\boxed{\frac{c-a}{b-a}=e^{i\frac{\pi}{3}}} \qquad \text{et pour le sens indirect :} \qquad \boxed{\frac{c-a}{b-a}=e^{-i\frac{\pi}{3}}}$$

    **b)** Posons $u=\frac{c-a}{b-a}$. Les nombres $e^{\pm i\frac{\pi}{3}}=\frac{1\pm i\sqrt{3}}{2}$ sont exactement les deux racines de $X^{2}-X+1$, de discriminant $-3$. D'après a) : 
    $$ABC \text{ équilatéral} \iff u^{2}-u+1=0 \iff (c-a)^{2}-(c-a)(b-a)+(b-a)^{2}=0$$
     en multipliant par $(b-a)^{2}\neq 0$. On développe : 
    $$c^{2}-2ac+a^{2}-\left(bc-ac-ab+a^{2}\right)+b^{2}-2ab+a^{2}=a^{2}+b^{2}+c^{2}-ab-bc-ca$$

    $$\boxed{ABC \text{ équilatéral} \iff a^{2}+b^{2}+c^{2}-ab-bc-ca=0}$$
     Avec $a=1$, $b=j$, $c=j^{2}$ (exercice 5) : $1+j^{2}+j^{4}-j-j^{3}-j^{2}=1+j-j-1=0$, puisque $j^{4}=j$ et $j^{3}=1$.
