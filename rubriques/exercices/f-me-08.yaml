  enonce: |
    **a)** Soit $n\in\mathbb{N}^{*}$. Calculer la somme des éléments de $\mathbb{U}_{n}$.

    **b)** Soient $n\in\mathbb{N}^{*}$ et $p\in\mathbb{N}^{*}$. Calculer la somme des puissances $p$-ièmes des éléments de $\mathbb{U}_{n}$.
  corrige: |
    Notons $\omega=e^{i\frac{2\pi}{n}}$, de sorte que $\mathbb{U}_{n}=\{\omega^{k}\;;\;0\leqslant k\leqslant n-1\}$.

    **a)** Si $n=1$, $\mathbb{U}_{1}=\{1\}$ et la somme vaut $1$. Si $n\geqslant 2$, $\omega\neq 1$, et la somme géométrique donne $\sum_{k=0}^{n-1}\omega^{k}=\frac{\omega^{n}-1}{\omega-1}=0$. 
    $$\boxed{\sum_{z\in\mathbb{U}_{n}}z=\left\{\begin{array}{ll} 1 & \text{si } n=1 \\ 0 & \text{si } n\geqslant 2 \end{array}\right.}$$

    **b)** La somme cherchée est $\sum_{k=0}^{n-1}\left(\omega^{k}\right)^{p}=\sum_{k=0}^{n-1}\left(\omega^{p}\right)^{k}$, somme géométrique de raison $\omega^{p}=e^{i\frac{2p\pi}{n}}$.

    • Si $n$ divise $p$, $\omega^{p}=1$, et la somme vaut $n$.

    • Sinon, $\frac{2p\pi}{n}\not\equiv 0\;[2\pi]$, donc $\omega^{p}\neq 1$, et la somme vaut $\frac{(\omega^{p})^{n}-1}{\omega^{p}-1}=\frac{(\omega^{n})^{p}-1}{\omega^{p}-1}=0$.

    $$\boxed{\sum_{z\in\mathbb{U}_{n}}z^{p}=\left\{\begin{array}{ll} n & \text{si } n\mid p \\ 0 & \text{sinon} \end{array}\right.}$$
     La question a) est le cas $p=1$. Par exemple, avec $n=4$ : $1^{2}+i^{2}+(-1)^{2}+(-i)^{2}=0$ et $1^{4}+i^{4}+(-1)^{4}+(-i)^{4}=4$.
