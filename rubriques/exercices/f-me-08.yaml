  enonce: |
    Soit $n$ un entier $\geqslant 3$. On note $P_{n}$ et $A_{n}$ le périmètre et l'aire du polygone (régulier) dont les sommets sont les racines $n$-ièmes de $1$. Donner une expression simple de $P_{n}$ et de $A_{n}$. Déterminer les limites des suites $(P_{n})_{n\geqslant 3}$ et $(A_{n})_{n\geqslant 3}$.
  corrige: |
    Les sommets sont les points $M_{k}$ d'affixes $\omega^{k}$, avec $\omega=e^{i\frac{2\pi}{n}}$.

    • Périmètre. Tous les côtés ont la longueur $|\omega-1|$. Par la technique de l'arc moitié (chapitre 5) : 
    $$\omega-1=e^{i\frac{\pi}{n}}\left(e^{i\frac{\pi}{n}}-e^{-i\frac{\pi}{n}}\right)=2i\sin\left(\tfrac{\pi}{n}\right)e^{i\frac{\pi}{n}} \qquad \text{d'où} \qquad |\omega-1|=2\sin\left(\tfrac{\pi}{n}\right)$$
     car $0<\frac{\pi}{n}<\pi$. Ainsi $\boxed{P_{n}=2n\sin\left(\frac{\pi}{n}\right)}$.

    • Aire. Le polygone est formé de $n$ triangles $OM_{k}M_{k+1}$, isocèles en $O$ de côtés $1$ et d'angle au sommet $\frac{2\pi}{n}$. Chacun a pour aire $\frac{1}{2}\times 1\times 1\times\sin\left(\frac{2\pi}{n}\right)$, donc $\boxed{A_{n}=\frac{n}{2}\sin\left(\frac{2\pi}{n}\right)}$.

    • Limites. On sait que $\displaystyle\lim_{x\to 0}\frac{\sin(x)}{x}=1$ : c'est le nombre dérivé de $\sin$ en $0$, qui vaut $\cos(0)=1$. Alors : 
    $$P_{n}=2\pi\times\frac{\sin\left(\frac{\pi}{n}\right)}{\frac{\pi}{n}}\xrightarrow[n\to+\infty]{}2\pi \qquad ; \qquad A_{n}=\pi\times\frac{\sin\left(\frac{2\pi}{n}\right)}{\frac{2\pi}{n}}\xrightarrow[n\to+\infty]{}\pi$$

    On retrouve le périmètre et l'aire du disque unité : c'est l'idée d'Archimède, qui encadrait $\pi$ par des polygones réguliers. Pour $n=6$ : $P_{6}=12\times\frac{1}{2}=6$ et $A_{6}=3\times\frac{\sqrt{3}}{2}\approx 2{,}60$.
- id: "me-08-28"
