  enonce: |
    **a)** Soient $z$ et $z'$ deux nombres complexes. Montrer : 
    $$|z+z'|^{2}+|z-z'|^{2}=2\left(|z|^{2}+|z'|^{2}\right).$$

    **b)** Donner une interprétation géométrique de cette égalité en considérant un parallélogramme, les longueurs de ses côtés, les longueurs de ses diagonales.

    **c)** Soient $A$, $B$, $C$ trois points non alignés du plan, $I$ le milieu de $[BC]$. Déduire de b) une expression de $AI^{2}$ en fonction de $AB^{2}$, $BC^{2}$, $CA^{2}$.
  corrige: |
    **a)** On utilise $|w|^{2}=w\overline{w}$ : 
    $$\begin{aligned} |z+z'|^{2}&=(z+z')\left(\overline{z}+\overline{z'}\right)=|z|^{2}+|z'|^{2}+z\overline{z'}+\overline{z}z' \\ |z-z'|^{2}&=(z-z')\left(\overline{z}-\overline{z'}\right)=|z|^{2}+|z'|^{2}-z\overline{z'}-\overline{z}z' \end{aligned}$$
     En additionnant, les termes croisés disparaissent : $\boxed{|z+z'|^{2}+|z-z'|^{2}=2\left(|z|^{2}+|z'|^{2}\right)}$.

    **b)** Soit $OACB$ le parallélogramme construit sur $\overrightarrow{OA}$ et $\overrightarrow{OB}$, d'affixes $z$ et $z'$. Ses côtés mesurent $|z|$ et $|z'|$, ses diagonales $OC=|z+z'|$ et $AB=|z-z'|$. **La somme des carrés des diagonales d'un parallélogramme est égale à la somme des carrés de ses quatre côtés.** Pour un rectangle, on retrouve que les deux diagonales sont égales, chacune de carré $|z|^{2}+|z'|^{2}$ (Pythagore).

    **c)** Appliquons a) à $z=z_{B}-z_{A}$ et $z'=z_{C}-z_{A}$. Alors $z+z'=2\left(z_{I}-z_{A}\right)$ et $z'-z=z_{C}-z_{B}$, d'où $4AI^{2}+BC^{2}=2\left(AB^{2}+AC^{2}\right)$ : 
    $$\boxed{AI^{2}=\frac{2AB^{2}+2AC^{2}-BC^{2}}{4}}$$
     Contrôle sur le triangle rectangle de côtés $3$, $4$, $5$ (rectangle en $A$, $BC=5$) : $AI^{2}=\frac{18+32-25}{4}=\frac{25}{4}$, donc $AI=\frac{5}{2}=\frac{BC}{2}$, comme attendu pour la médiane issue de l'angle droit.
- id: "me-08-25"
