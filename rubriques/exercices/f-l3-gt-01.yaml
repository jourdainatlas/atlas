    **Topologie cofinie.** Soit $X$ un ensemble. On pose $\mathcal{T} = \{U \subset X \mid U = \varnothing \text{ ou } X \setminus U \text{ est fini}\}$.

    **1.** Montrer que $\mathcal{T}$ est une topologie sur $X$. Quels en sont les fermés ?

    **2.** Montrer que si $X$ est infini, $\mathcal{T}$ n'est pas séparée.

    **3.** Quelle topologie obtient-on si $X$ est fini ? Si $X = \mathbb{R}$, comparer $\mathcal{T}$ à la topologie usuelle.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** L'ensemble vide est dans $\mathcal{T}$ par définition, et $X$ aussi puisque $X \setminus X = \varnothing$ est fini. Soit $(U_{i})$ une famille d'éléments de $\mathcal{T}$ ; si tous sont vides, leur réunion l'est ; sinon, pour un $U_{i_{0}} \neq \varnothing$, 
    $$X \setminus \bigcup_{i} U_{i} \subset X \setminus U_{i_{0}} ,$$
     qui est fini. Enfin, si $U$ et $V$ sont non vides dans $\mathcal{T}$, $X \setminus (U \cap V) = (X \setminus U) \cup (X \setminus V)$ est fini ; si l'un est vide, l'intersection est vide. *Les fermés sont $X$ et les parties finies de $X$.*

    **2.** Soient $U$ et $V$ deux ouverts non vides. Le complémentaire de $U \cap V$ est la réunion de deux parties finies, donc fini ; comme $X$ est infini, $U \cap V$ n'est pas vide. Deux ouverts non vides se rencontrent toujours : aucun couple de points distincts ne peut être séparé.

    **3.** Si $X$ est fini, toute partie a un complémentaire fini : $\mathcal{T}$ est la topologie discrète. Si $X = \mathbb{R}$, une partie à complémentaire fini est ouverte pour la topologie usuelle, puisqu'une partie finie est fermée : *la topologie cofinie est moins fine que la topologie usuelle,* et strictement, car $]0, 1[$ n'est pas cofini. Comme on l'a vu dans le cours, une suite injective, par exemple $(n)$, y converge vers tous les points de $\mathbb{R}$.

    0@10@ii@ii-@>@ii@ii>@-\@M
