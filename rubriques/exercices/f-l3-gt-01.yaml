    **Adhérence et ouverts.** Soient $X$ un espace topologique et $G$ un ouvert de $X$. Montrer que, pour toute partie $A$ de $X$ :

    **1.** $G \cap \overline{A} \subset \overline{G \cap A}$ ;

    **2.** $\overline{G \cap \overline{A}} = \overline{G \cap A}$.

    **3.** Montrer par un exemple dans $\mathbb{R}$ que la première inclusion peut être fausse si $G$ n'est pas ouvert.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Soient $x \in G \cap \overline{A}$ et $V$ un voisinage de $x$. Comme $G$ est un ouvert contenant $x$, $V \cap G$ est encore un voisinage de $x$ ; il rencontre donc $A$, puisque $x \in \overline{A}$. Ainsi $V$ rencontre $G \cap A$, et $x \in \overline{G \cap A}$.

    **2.** On a $G \cap A \subset G \cap \overline{A} \subset \overline{G \cap A}$, la seconde inclusion étant la question 1. En passant aux adhérences, la croissance de l'adhérence et $\overline{\overline{B}} = \overline{B}$ donnent 
    $$\overline{G \cap A} \subset \overline{G \cap \overline{A}} \subset \overline{G \cap A} .$$

    **3.** Prenons $G = \{0\}$, qui n'est pas ouvert dans $\mathbb{R}$, et $A = \, ]0, 1]$. Alors $G \cap \overline{A} = \{0\}$, alors que $G \cap A = \varnothing$ a une adhérence vide. L'hypothèse « $G$ ouvert » sert exactement à garantir que $V \cap G$ est un voisinage de $x$.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-01-09"
  feuille: "f-l3-gt-01"
  numero: 9
  partie: "Intérieur, adhérence"
  etoiles: 2
