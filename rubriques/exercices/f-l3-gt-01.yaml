  page_corrige: 3
  enonce: |
    **Topologie de Zariski.** Soit $k$ un corps commutatif et $n \geq 1$. Pour tout idéal $\mathfrak{a}$ de l'anneau $k[X_{1}, \dots, X_{n}]$, on pose 
    $$V(\mathfrak{a}) = \{x \in k^{n} \mid P(x) = 0 \text{ pour tout } P \in \mathfrak{a}\} .$$

    **1.** Soient $\mathfrak{a}$, $\mathfrak{b}$ et $(\mathfrak{a}_{i})_{i \in I}$ des idéaux de $k[X_{1}, \dots, X_{n}]$. Montrer que 
    $$V(\mathfrak{a}) \cup V(\mathfrak{b}) = V(\mathfrak{a} \cap \mathfrak{b}) = V(\mathfrak{a}\mathfrak{b}) \qquad \text{et} \qquad \bigcap_{i \in I} V(\mathfrak{a}_{i}) = V\Big(\sum_{i \in I}\mathfrak{a}_{i}\Big) .$$

    **2.** En déduire que les parties $V(\mathfrak{a})$ sont les fermés d'une topologie $\mathcal{Z}$ sur $k^{n}$, appelée topologie de Zariski.

    **3.** On suppose $n = 1$. Décrire $\mathcal{Z}$ lorsque $k$ est fini, puis lorsque $k$ est infini ; montrer que, dans ce dernier cas, $\mathcal{Z}$ n'est pas séparée.

    **4.** On suppose $k = \mathbb{R}$. Montrer que $\mathcal{Z}$ est moins fine que la topologie usuelle de $\mathbb{R}^{n}$, et qu'elle est strictement moins fine.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $\mathfrak{a} \subset \mathfrak{b}$, tout point où s'annulent les polynômes de $\mathfrak{b}$ annule ceux de $\mathfrak{a}$ : $V(\mathfrak{b}) \subset V(\mathfrak{a})$. Comme $\mathfrak{a}\mathfrak{b} \subset \mathfrak{a} \cap \mathfrak{b} \subset \mathfrak{a}$, et de même pour $\mathfrak{b}$, on obtient 
    $$V(\mathfrak{a}) \cup V(\mathfrak{b}) \subset V(\mathfrak{a} \cap \mathfrak{b}) \subset V(\mathfrak{a}\mathfrak{b}) .$$
     Inversement, soit $x \notin V(\mathfrak{a}) \cup V(\mathfrak{b})$ : il existe $P \in \mathfrak{a}$ et $Q \in \mathfrak{b}$ avec $P(x) \neq 0$ et $Q(x) \neq 0$. Alors $PQ \in \mathfrak{a}\mathfrak{b}$ et $(PQ)(x) = P(x)Q(x) \neq 0$ puisque $k$ est un corps, donc $x \notin V(\mathfrak{a}\mathfrak{b})$. Les trois ensembles sont égaux.

    L'idéal $\mathop{\displaystyle \sum_{i}}\mathfrak{a}_{i}$ est formé des sommes finies d'éléments des $\mathfrak{a}_{i}$. Un point qui annule tous les polynômes de tous les $\mathfrak{a}_{i}$ annule leurs sommes finies ; réciproquement, chaque $\mathfrak{a}_{i}$ est contenu dans la somme. D'où $\mathop{\displaystyle \bigcap_{i}}V(\mathfrak{a}_{i}) = V(\mathop{\displaystyle \sum_{i}}\mathfrak{a}_{i})$.

    **2.** On a $V\big(k[X_{1}, \dots, X_{n}]\big) = \varnothing$, puisque le polynôme constant $1$ ne s'annule nulle part, et $V(\{0\}) = k^{n}$. Par la question 1, les $V(\mathfrak{a})$ sont stables par réunion finie et par intersection quelconque : ce sont les fermés d'une topologie.

    **3.** L'anneau $k[X]$ est principal : tout idéal est de la forme $(P)$, et $V\big((P)\big)$ est l'ensemble des racines de $P$. Si $P = 0$, c'est $k$ ; sinon, c'est une partie finie, de cardinal au plus $\deg P$. Réciproquement, toute partie finie $\{x_{1}, \dots, x_{r}\}$ est l'ensemble des racines de $(X - x_{1})\cdots(X - x_{r})$. *Les fermés de Zariski de $k$ sont donc $k$ et ses parties finies : $\mathcal{Z}$ est la topologie cofinie de l'exercice 3.* Si $k$ est fini, c'est la topologie discrète ; si $k$ est infini, elle n'est pas séparée.

    **4.** Toute fonction polynomiale est continue sur $\mathbb{R}^{n}$, donc $V(\mathfrak{a}) = \mathop{\displaystyle \bigcap_{P \in \mathfrak{a}}}P^{-1}(\{0\})$ est un fermé usuel : $\mathcal{Z}$ est moins fine que la topologie usuelle.

    Pour voir qu'elle l'est strictement, établissons d'abord qu'*un polynôme qui s'annule sur un ouvert non vide $\Omega$ de $\mathbb{R}^{n}$ est nul.* En un point $x_{0}$ de $\Omega$, toutes ses dérivées partielles, qui s'obtiennent comme limites de taux d'accroissement calculés dans $\Omega$, sont nulles ; or un polynôme est égal à son développement de Taylor en $x_{0}$, qui est ici nul. Supposons alors que la boule unité fermée $\bar{B}$ de $\mathbb{R}^{n}$ s'écrive $V(\mathfrak{a})$ : tout $P \in \mathfrak{a}$ s'annule sur la boule ouverte, donc $P = 0$, et $V(\mathfrak{a}) = \mathbb{R}^{n} \neq \bar{B}$. La boule fermée est un fermé usuel qui n'est pas un fermé de Zariski.

    ![Figure](documents/figures/eecad59b94f52d81.svg)

    Le fermé de Zariski $V\big((xy - 1)(x^{2} + y^{2} - 1)\big)$ de $\mathbb{R}^{2}$ (en bleu) : son complémentaire, ouvert de Zariski, est le plan privé de deux courbes et reste dense. Un disque fermé (en orange) n'est pas un fermé de Zariski : les fermés de Zariski propres sont « minces ».

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-01-05"
  feuille: "f-l3-gt-01"
