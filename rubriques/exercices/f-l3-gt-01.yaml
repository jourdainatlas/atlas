  enonce: |
    **Topologies métrisables.** On dit qu'une topologie $\mathcal{T}$ sur $X$ est *métrisable* s'il existe une distance $d$ sur $X$ dont la topologie associée est $\mathcal{T}$.

    **1.** Soit $d$ la distance sur $X$ définie par $d(x, y) = 1$ si $x \neq y$ et $d(x, x) = 0$. Décrire les boules ouvertes de $(X, d)$ et la topologie associée.

    **2.** Montrer que la topologie associée à une distance quelconque sur un ensemble fini est la topologie discrète.

    **3.** Montrer que si $X$ possède au moins deux éléments, la topologie grossière de $X$ n'est pas métrisable. Parmi les topologies de l'exercice 1, lesquelles sont métrisables ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Pour cette distance, $B(x, r) = \{x\}$ si $r \leq 1$ et $B(x, r) = X$ si $r > 1$. Tout singleton est une boule ouverte, donc un ouvert, et toute partie est réunion de singletons : *la topologie associée est la topologie discrète.*

    **2.** Soit $d$ une distance sur un ensemble fini $X$ et $x \in X$. Le nombre 
    $$r = \min\{d(x, y) \mid y \neq x\}$$
     est strictement positif, comme minimum d'un ensemble fini de réels strictement positifs (si $X = \{x\}$, il n'y a rien à montrer). Alors $B(x, r) = \{x\}$ : les singletons sont ouverts et la topologie est discrète.

    **3.** Une topologie métrisable est séparée (cours, prop. 2). Si $x \neq y$ sont deux points de $X$, le seul ouvert non vide de la topologie grossière est $X$, qui contient à la fois $x$ et $y$ : elle n'est pas séparée, donc pas métrisable. Sur trois points, une topologie métrisable est séparée, donc discrète par l'exercice 1 ; réciproquement, la topologie discrète est métrisable par la question 1. *Seule la topologie discrète est métrisable.*

    0@10@ii@ii-@>@ii@ii>@-\@M
