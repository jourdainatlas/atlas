  enonce: |
    **Autour de la continuité.** Soient $X$ et $Y$ deux espaces topologiques et $f : X \to Y$ une application.

    **1.** Soit $\mathcal{B}$ une base de la topologie de $Y$. Montrer que $f$ est continue si et seulement si $f^{-1}(B)$ est ouvert pour tout $B \in \mathcal{B}$.

    **2.** Montrer que $f$ est continue si et seulement si $f^{-1}(\mathring{B}) \subset \operatorname{Int}\big(f^{-1}(B)\big)$ pour toute partie $B$ de $Y$.

    **3.** On suppose que $X$ et $Y$ sont des espaces métriques. Montrer que $f$ est continue pour les topologies associées si et seulement si elle est continue en tout point au sens des espaces métriques ($\varepsilon$ et $\delta$).

    **4.** On note $\mathcal{T}_{u}$ la topologie usuelle de $\mathbb{R}$ et $\mathcal{T}_{c}$ la topologie cofinie de l'exercice 3. L'identité est-elle continue de $(\mathbb{R}, \mathcal{T}_{u})$ dans $(\mathbb{R}, \mathcal{T}_{c})$ ? de $(\mathbb{R}, \mathcal{T}_{c})$ dans $(\mathbb{R}, \mathcal{T}_{u})$ ? Déterminer les applications continues de $(\mathbb{R}, \mathcal{T}_{c})$ dans $(\mathbb{R}, \mathcal{T}_{u})$.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $f$ est continue, l'image réciproque de tout ouvert, en particulier de tout élément de $\mathcal{B}$, est ouverte. Réciproquement, tout ouvert $V$ de $Y$ s'écrit $V = \mathop{\displaystyle \bigcup_{k}}B_{k}$ avec $B_{k} \in \mathcal{B}$, et 
    $$f^{-1}(V) = \bigcup_{k}f^{-1}(B_{k})$$
     est une réunion d'ouverts. En pratique, il suffit donc de tester la continuité sur une base, par exemple sur les intervalles ouverts pour $\mathbb{R}$.

    **2.** Si $f$ est continue, $f^{-1}(\mathring{B})$ est un ouvert contenu dans $f^{-1}(B)$, donc dans son intérieur. Réciproquement, si $V$ est ouvert, $V = \mathring{V}$ et l'hypothèse donne 
    $$f^{-1}(V) \subset \operatorname{Int}\big(f^{-1}(V)\big) \subset f^{-1}(V) ,$$
     donc $f^{-1}(V)$ est égal à son intérieur, c'est-à-dire ouvert.

    **3.** Supposons $f$ continue pour les topologies. Soient $x \in X$ et $\varepsilon > 0$ : la boule $B\big(f(x), \varepsilon\big)$ est ouverte, son image réciproque est un ouvert contenant $x$, qui contient donc une boule $B(x, \delta)$. C'est la continuité en $x$ au sens métrique. Réciproquement, soient $V$ un ouvert de $Y$ et $x \in f^{-1}(V)$. Il existe $\varepsilon > 0$ tel que $B\big(f(x), \varepsilon\big) \subset V$, puis $\delta > 0$ tel que $f\big(B(x, \delta)\big) \subset B\big(f(x), \varepsilon\big)$. Ainsi $B(x, \delta) \subset f^{-1}(V)$, qui est ouvert.

    **4.** Comme $\mathcal{T}_{c} \subset \mathcal{T}_{u}$ (exercice 3), l'image réciproque par l'identité d'un ouvert de $\mathcal{T}_{c}$ est un ouvert de $\mathcal{T}_{u}$ : *l'identité est continue de $(\mathbb{R}, \mathcal{T}_{u})$ dans $(\mathbb{R}, \mathcal{T}_{c})$.* Elle ne l'est pas dans l'autre sens, car $]0, 1[$ n'est pas cofini.

    Soit $f : (\mathbb{R}, \mathcal{T}_{c}) \to (\mathbb{R}, \mathcal{T}_{u})$ continue. Si $f$ prenait deux valeurs $y \neq y'$, deux intervalles ouverts disjoints autour de $y$ et de $y'$ auraient pour images réciproques deux ouverts non vides et disjoints de $(\mathbb{R}, \mathcal{T}_{c})$, ce que l'exercice 3 interdit. *Les applications continues de $(\mathbb{R}, \mathcal{T}_{c})$ dans $(\mathbb{R}, \mathcal{T}_{u})$ sont les constantes.* Plus la topologie de départ est grossière, moins il y a d'applications continues.

    0@10@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-01-12"
  feuille: "f-l3-gt-01"
  numero: 12
  partie: "Continuité, produits"
  etoiles: 1
