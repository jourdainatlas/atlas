  page_enonce: 2
  page_corrige: 4
  enonce: |
    **La droite de Sorgenfrey.** On note $\mathcal{B}$ la famille des intervalles $[a, b[$ de $\mathbb{R}$, où $a < b$.

    **1.** Montrer que $\mathcal{B}$ est la base d'une topologie $\mathcal{T}_{S}$ sur $\mathbb{R}$.

    **2.** Montrer que $\mathcal{T}_{S}$ est strictement plus fine que la topologie usuelle, et qu'elle est séparée.

    **3.** Montrer que tout intervalle $[a, b[$ est à la fois ouvert et fermé pour $\mathcal{T}_{S}$.

    **4.** Montrer qu'une suite $(x_{n})$ converge vers $x$ pour $\mathcal{T}_{S}$ si et seulement si elle converge vers $x$ au sens usuel et $x_{n} \geq x$ à partir d'un certain rang.

    **5.** L'application $x \mapsto -x$ est-elle continue de $(\mathbb{R}, \mathcal{T}_{S})$ dans $(\mathbb{R}, \mathcal{T}_{S})$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** On vérifie les deux conditions du théorème 1 du cours. D'une part, $\mathbb{R} = \mathop{\displaystyle \bigcup_{n \in \mathbb{Z}}}[n, n + 1[$. D'autre part, si $x \in [a, b[ \cap [c, d[$, cette intersection est l'intervalle $[\mathop{\displaystyle \max}(a, c), \mathop{\displaystyle \min}(b, d)[$, qui appartient à $\mathcal{B}$ et contient $x$.

    **2.** Tout intervalle ouvert est réunion d'éléments de $\mathcal{B}$ : 
    $$]a, b[ \; = \bigcup_{n \geq 1}\Big[a + \frac{1}{n}, b\Big[ ,$$
     où l'on ne garde que les $n$ pour lesquels $a + \dfrac{1}{n} < b$. Les ouverts usuels, réunions d'intervalles ouverts, sont donc dans $\mathcal{T}_{S}$. L'inclusion est stricte : $[0, 1[$ est dans $\mathcal{T}_{S}$, mais pas ouvert pour la topologie usuelle, car aucun intervalle ouvert centré en $0$ n'y est contenu. Une topologie plus fine qu'une topologie séparée est séparée, puisque les ouverts qui séparent deux points restent des ouverts.

    **3.** L'intervalle $[a, b[$ est dans la base. Son complémentaire 
    $$]-\infty, a[ \; \cup \; [b, +\infty[ \; = \bigcup_{n \geq 1}[a - n, a[ \; \cup \; \bigcup_{n \geq 1}[b, b + n[$$
     est une réunion d'éléments de $\mathcal{B}$, donc ouvert : $[a, b[$ est aussi fermé.

    **4.** Un ouvert $[a, b[$ contenant $x$ contient $[x, b[$ : les intervalles $[x, x + \varepsilon[$, $\varepsilon > 0$, forment donc une base de voisinages de $x$ pour $\mathcal{T}_{S}$. Ainsi $x_{n} \to x$ pour $\mathcal{T}_{S}$ si et seulement si, pour tout $\varepsilon > 0$, on a $x \leq x_{n} < x + \varepsilon$ à partir d'un certain rang. C'est exactement dire que $x_{n} \to x$ au sens usuel et que $x_{n} \geq x$ à partir d'un certain rang.

    ![Figure](documents/figures/958a7287a1a96ce7.svg)

    Un ouvert de base $[a, b[$ de la droite de Sorgenfrey (en bleu) : il contient son extrémité gauche, pas sa droite. La suite $x + \dfrac{1}{n}$ (en orange) converge vers $x$ pour $\mathcal{T}_{S}$ ; la suite $x - \dfrac{1}{n}$ (en violet) ne converge pas, car elle ne rencontre jamais le voisinage $[x, x + 1[$.

    **5.** Notons $f(x) = -x$. L'image réciproque de l'ouvert $[0, 1[$ est $]-1, 0]$, qui contient $0$ mais aucun intervalle $[0, \varepsilon[$ : elle n'est pas ouverte, et *$f$ n'est pas continue.* On le voit aussi sur les suites : $\dfrac{1}{n} \to 0$ pour $\mathcal{T}_{S}$, mais $f\big(\dfrac{1}{n}\big) = -\dfrac{1}{n}$ ne tend pas vers $f(0) = 0$. La droite de Sorgenfrey distingue la gauche de la droite, et une symétrie ne la respecte pas.

    0@10@ii@ii-@>@ii@ii>@-\@M
