  enonce: |
    **Les sept ensembles de Kuratowski.** Soient $X$ un espace topologique et $A$ une partie de $X$. On note $a(B) = \overline{B}$ et $i(B) = \mathring{B}$ pour toute partie $B$ de $X$.

    **1.** Montrer que $a$ et $i$ sont croissantes pour l'inclusion, que $a \circ a = a$ et que $i \circ i = i$.

    **2.** Montrer que $a \circ i \circ a \circ i = a \circ i$ et que $i \circ a \circ i \circ a = i \circ a$.

    **3.** En déduire qu'en itérant les opérations d'intérieur et d'adhérence à partir de $A$, on obtient au plus sept ensembles différents, $A$ compris.

    **4.** Trouver une partie $A$ de $\mathbb{R}$ pour laquelle ces sept ensembles sont deux à deux distincts.

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Si $B \subset C$, tout fermé contenant $C$ contient $B$, donc $\overline{B} \subset \overline{C}$ ; tout ouvert contenu dans $B$ l'est dans $C$, donc $\mathring{B} \subset \mathring{C}$. L'adhérence est fermée, donc égale à sa propre adhérence ; l'intérieur est ouvert, donc égal à son propre intérieur.

    **2.** Soit $B$ une partie et $C = a\big(i(B)\big)$. D'une part, $i(C) \subset C$, donc $a\big(i(C)\big) \subset a(C) = C$. D'autre part, $i(B)$ est un ouvert contenu dans $C$, donc contenu dans $i(C)$ ; en prenant les adhérences, $C = a\big(i(B)\big) \subset a\big(i(C)\big)$. Ainsi $a \circ i \circ a \circ i = a \circ i$.

    Notons $c(B) = X \setminus B$. Par la proposition 10 du cours, $i = c \circ a \circ c$ et $a = c \circ i \circ c$. Alors, comme $c \circ c$ est l'identité, 
    $$i \circ a \circ i \circ a = (c a c)(c i c)(c a c)(c i c) = c \circ (a \circ i \circ a \circ i) \circ c = c \circ a \circ i \circ c = i \circ a .$$

    **3.** Un ensemble obtenu par itération s'écrit $w(A)$, où $w$ est un mot en les lettres $a$ et $i$. Par la question 1, on peut supprimer les lettres répétées : $w$ est un mot alterné. Par la question 2, tout mot alterné de longueur au moins $4$ se raccourcit, car il contient $aiai$ ou $iaia$. Il reste les mots alternés de longueur au plus $3$ : 
    $$\mathrm{id}, \quad a, \quad i, \quad ai, \quad ia, \quad aia, \quad iai ,$$
     soit *au plus sept ensembles,* $A$ compris.

    **4.** Prenons 
    $$A = \, ]0, 1[ \; \cup \; ]1, 2[ \; \cup \; \{3\} \; \cup \; \big(\mathbb{Q} \cap \, ]4, 5[\big) .$$
     Les sept ensembles sont tracés ci-dessous. Chaque morceau de $A$ joue un rôle : le point $1$ retiré disparaît dès qu'on prend une adhérence, le point isolé $3$ disparaît dès qu'on prend un intérieur, et les rationnels de $]4, 5[$ donnent un ensemble d'intérieur vide et d'adhérence d'intérieur non vide.

    ![Figure](documents/figures/0cc6fb7219e5191a.svg)

    Les sept ensembles de Kuratowski pour $A$ (en bleu) : la branche qui commence par une adhérence est en orange, celle qui commence par un intérieur en vert. Le pointillé figure les rationnels de $]4, 5[$, le petit cercle le point $1$ retiré.

    0@16@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-01-11"
