  enonce: |
    **Bases dénombrables.** Soit $X$ un espace topologique dont la topologie admet une base dénombrable $\mathcal{B} = \{B_{i}, i \in \mathbb{N}\}$. Montrer que toute base $\mathcal{B}'$ de la même topologie contient une sous-famille dénombrable qui est encore une base.

    *Indication : pour tout couple $(i, j) \in \mathbb{N}^{2}$ pour lequel c'est possible, choisir $B'_{i, j} \in \mathcal{B}'$ tel que $B_{i} \subset B'_{i, j} \subset B_{j}$, puis considérer la famille des $B'_{i, j}$.*

    0@8@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    Disons qu'un couple $(i, j) \in \mathbb{N}^{2}$ est *admissible* s'il existe $B' \in \mathcal{B}'$ avec $B_{i} \subset B' \subset B_{j}$, et choisissons, pour chaque couple admissible, un tel élément $B'_{i, j}$. La famille $\mathcal{B}'' = \{B'_{i, j}\}$ est indexée par une partie de $\mathbb{N}^{2}$ : elle est dénombrable et contenue dans $\mathcal{B}'$. Montrons que c'est une base.

    Soient $U$ un ouvert et $x \in U$. Comme $\mathcal{B}$ est une base, il existe $j$ tel que $x \in B_{j} \subset U$. Comme $\mathcal{B}'$ est une base et $B_{j}$ un ouvert, il existe $B' \in \mathcal{B}'$ avec $x \in B' \subset B_{j}$. Enfin, $B'$ est ouvert : il existe $i$ tel que $x \in B_{i} \subset B'$. Le couple $(i, j)$ est donc admissible, et 
    $$x \in B_{i} \subset B'_{i, j} \subset B_{j} \subset U .$$
     Tout ouvert est ainsi réunion d'éléments de $\mathcal{B}''$. Il faut noter que $B'_{i, j}$ n'est pas forcément l'ouvert $B'$ trouvé en chemin : c'est l'emboîtement $B_{i} \subset B'_{i, j}$ qui garantit qu'il contient $x$.

    ![Figure](documents/figures/0dd9c6c3de521fee.svg)

    L'emboîtement $x \in B_{i} \subset B'_{i, j} \subset B_{j} \subset U$ : les éléments de la base dénombrable $\mathcal{B}$ (en bleu) encadrent l'élément choisi de $\mathcal{B}'$ (en orange).

    0@16@ii@ii-@>@ii@ii>@-\@M
- id: "l3-gt-01-07"
  feuille: "f-l3-gt-01"
  numero: 7
  partie: "Intérieur, adhérence"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [intérieur et adhérence]
  noeuds: [t-adherence, t-voisinages, t-induite]
  notions: [interieur, adherence, ferme]
  source: "Bordeaux 2016, feuille 2, exercice 3, question 2"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Les rationnels.** On munit $\mathbb{Q}$ de la topologie induite par celle de $\mathbb{R}$.

    **1.** Montrer que $\operatorname{Int}_{\mathbb{R}}\mathbb{Q} = \varnothing$, mais que $\operatorname{Int}_{\mathbb{Q}}\mathbb{Q} = \mathbb{Q}$.

    **2.** Montrer que $\overline{\mathbb{Q}}^{\mathbb{Q}} = \mathbb{Q}$ et que $\overline{\mathbb{Q}}^{\mathbb{R}} = \mathbb{R}$. Déterminer la frontière de $\mathbb{Q}$ dans $\mathbb{R}$.

    **3.** Déterminer l'intérieur et l'adhérence, dans $\mathbb{Q}$, de la partie $A = \{x \in \mathbb{Q} \mid x^{2} < 2\}$. Cette partie est-elle ouverte ou fermée dans $\mathbb{Q}$ ?

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Tout intervalle ouvert non vide de $\mathbb{R}$ contient un irrationnel : aucun ne peut être contenu dans $\mathbb{Q}$, donc $\operatorname{Int}_{\mathbb{R}}\mathbb{Q} = \varnothing$. En revanche, $\mathbb{Q}$ est l'espace ambiant de la topologie induite, donc un ouvert de lui-même : $\operatorname{Int}_{\mathbb{Q}}\mathbb{Q} = \mathbb{Q}$.

    **2.** De même, $\mathbb{Q}$ est fermé dans lui-même, donc $\overline{\mathbb{Q}}^{\mathbb{Q}} = \mathbb{Q}$. Tout intervalle ouvert non vide contient un rationnel : $\mathbb{Q}$ est dense dans $\mathbb{R}$, $\overline{\mathbb{Q}}^{\mathbb{R}} = \mathbb{R}$. La frontière de $\mathbb{Q}$ dans $\mathbb{R}$ est 
    $$\operatorname{Fr}\mathbb{Q} = \overline{\mathbb{Q}}^{\mathbb{R}} \setminus \operatorname{Int}_{\mathbb{R}}\mathbb{Q} = \mathbb{R} .$$
     L'erreur la plus répandue est d'oublier que l'intérieur et l'adhérence dépendent de l'espace ambiant : la même partie $\mathbb{Q}$ est d'intérieur vide dans $\mathbb{R}$ et ouverte dans $\mathbb{Q}$.

    **3.** Comme $\sqrt{2}$ est irrationnel, 
    $$A = \mathbb{Q} \; \cap \; \big]-\sqrt{2}, \sqrt{2}\big[ \; = \mathbb{Q} \; \cap \; \big[-\sqrt{2}, \sqrt{2}\big] .$$
     La première écriture montre que $A$ est ouvert dans $\mathbb{Q}$, la seconde qu'il y est fermé (cours, prop. 11). Ainsi $\operatorname{Int}_{\mathbb{Q}}A = A = \overline{A}^{\mathbb{Q}}$ : la partie $A$ est *ouverte et fermée* dans $\mathbb{Q}$, sans être ni vide ni égale à $\mathbb{Q}$. C'est le signe que $\mathbb{Q}$ n'est pas connexe, ce que le chapitre 2 rendra précis.

    0@10@ii@ii-@>@ii@ii>@-\@M
