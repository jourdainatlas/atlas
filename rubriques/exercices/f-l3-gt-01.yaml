  enonce: |
    **Petits espaces.** Soit $X = \{a, b, c\}$ un ensemble à trois éléments.

    **1.** Donner la liste de toutes les topologies sur $X$. On les regroupera par types, deux topologies étant du même type lorsqu'une permutation de $X$ transforme l'une en l'autre, et l'on indiquera combien de topologies contient chaque type.

    **2.** Lesquelles de ces topologies sont séparées ?

    **3.** Soit $Y$ un ensemble fini muni d'une topologie séparée. Montrer que la topologie de $Y$ est la topologie discrète.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    **1.** Une topologie sur $X$ contient $\varnothing$ et $X$ ; il reste à choisir quels singletons et quelles paires sont ouverts. Deux contraintes gouvernent ce choix : la réunion de deux singletons ouverts est une paire ouverte, et l'intersection de deux paires ouvertes distinctes est un singleton ouvert. On raisonne sur le nombre $k$ de singletons ouverts.

    $\triangleright$ *$k = 0$.* Deux paires ouvertes distinctes auraient pour intersection un singleton ouvert ; il y a donc au plus une paire ouverte. On obtient la topologie grossière et les topologies $\{\varnothing, \{a, b\}, X\}$.

    $\triangleright$ *$k = 1$,* disons $\{a\}$ ouvert. La paire $\{b, c\}$ ne peut coexister avec $\{a, b\}$, car leur intersection $\{b\}$ serait ouverte ; de même pour $\{a, c\}$. Les paires ouvertes sont donc : aucune, ou $\{b, c\}$, ou l'une des paires $\{a, b\}$, $\{a, c\}$, ou les deux.

    $\triangleright$ *$k = 2$,* disons $\{a\}$ et $\{b\}$. La paire $\{a, b\}$ est alors ouverte ; on peut ajouter $\{a, c\}$ ou $\{b, c\}$, mais pas les deux, car leur intersection $\{c\}$ serait ouverte.

    $\triangleright$ *$k = 3$.* Toutes les parties sont ouvertes : c'est la topologie discrète.

    On obtient neuf types, représentés ci-dessous ; le nombre de topologies d'un type est le nombre de façons de nommer les points. Au total, il y a 
    $$1 + 3 + 3 + 6 + 3 + 3 + 3 + 6 + 1 = 29$$
     topologies sur un ensemble à trois éléments, ce qu'une énumération exhaustive par programme confirme.

    ![Figure](documents/figures/12017346eed4896f.svg)

    Les neuf types de topologies sur $\{a, b, c\}$ : sous chaque case, la liste des ouverts autres que $\varnothing$ et $X$, avec les singletons en bleu et les paires en orange. Le nombre en haut à droite compte les topologies du type.

    **2.** Dans un espace séparé, les singletons sont fermés (cours, prop. 15). Dans les huit premiers types, l'un au moins des singletons n'est pas fermé : par exemple, pour le type $\{a\}, \{b\}, \{a, b\}, \{a, c\}$, le complémentaire de $\{a\}$ est $\{b, c\}$, qui n'est pas ouvert. *Seule la topologie discrète est séparée.* La question suivante donne la raison générale.

    **3.** Les singletons de $Y$ sont fermés (cours, prop. 15). Toute partie de $Y$ est une réunion finie de singletons, donc fermée ; son complémentaire, qui est une partie quelconque, est donc ouvert. La topologie est discrète.

    0@10@ii@ii-@>@ii@ii>@-\@M
