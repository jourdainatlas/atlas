  noeuds: [t-adherence, t-voisinages, t-induite]
  notions: [interieur, adherence, ferme]
  source: "Bordeaux 2016, feuille 1, exercice 4"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Adhérences d'ouverts.** Soit $X$ un espace topologique. Montrer que les deux propriétés suivantes sont équivalentes :

    **(a)** l'adhérence de tout ouvert de $X$ est ouverte ;

    **(b)** si deux ouverts de $X$ sont disjoints, leurs adhérences sont aussi disjointes.

    L'espace $\mathbb{R}$ vérifie-t-il ces propriétés ? Même question pour $\mathbb{Z}$, muni de la topologie induite par celle de $\mathbb{R}$, et pour la droite de Sorgenfrey de l'exercice 5.

    0@10@ii@ii-@>@ii@ii>@-\@M
  corrige: |
    $\triangleright$ *(a) $\Rightarrow$ (b).* Soient $U$ et $V$ deux ouverts disjoints. Le complémentaire de $U$ est un fermé contenant $V$, donc contenant $\overline{V}$ : $U \cap \overline{V} = \varnothing$. Par (a), $\overline{V}$ est un ouvert disjoint de $U$ ; le même argument, appliqué aux ouverts $\overline{V}$ et $U$, donne $\overline{V} \cap \overline{U} = \varnothing$.

    $\triangleright$ *(b) $\Rightarrow$ (a).* Soit $U$ un ouvert ; posons $W = X \setminus \overline{U}$, ouvert disjoint de $U$. Par (b), $\overline{U} \cap \overline{W} = \varnothing$, donc 
    $$\overline{U} \subset X \setminus \overline{W} \subset X \setminus W = \overline{U} .$$
     Ainsi $\overline{U} = X \setminus \overline{W}$ est ouvert.

    $\triangleright$ *Exemples.* Dans $\mathbb{R}$, l'adhérence de l'ouvert $]0, 1[$ est $[0, 1]$, qui n'est pas ouvert : $\mathbb{R}$ ne vérifie pas ces propriétés. La topologie induite sur $\mathbb{Z}$ est discrète, puisque $\{n\} = \mathbb{Z} \cap \, ]n - \dfrac{1}{2}, n + \dfrac{1}{2}[$ ; toute partie y est ouverte, et $\mathbb{Z}$ les vérifie. Pour la droite de Sorgenfrey, posons 
    $$U = \bigcup_{n \geq 1}\Big[\frac{1}{2n + 1}, \frac{1}{2n}\Big[ \qquad \text{et} \qquad V = \bigcup_{n \geq 1}\Big[\frac{1}{2n}, \frac{1}{2n - 1}\Big[ .$$
     Ce sont deux ouverts disjoints, et $0$ est adhérent aux deux, puisque tout voisinage $[0, \varepsilon[$ rencontre des intervalles de chacun : la propriété (b) est en défaut.

    0@10@ii@ii-@>@ii@ii>@-\@M
