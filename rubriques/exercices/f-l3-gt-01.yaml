  noeuds: [t-continue, t-produit, t-espace]
  notions: [continuite, topologie-produit]
  source: "Bordeaux 2016, feuille 1, exercice 11"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Topologie produit.** Soient $Y$ et $Y'$ deux espaces topologiques, et $p : Y \times Y' \to Y$, $p' : Y \times Y' \to Y'$ les deux projections.

    **1.** Montrer que la topologie produit sur $Y \times Y'$ est la topologie la moins fine qui rende $p$ et $p'$ continues.

    **2.** Montrer que la topologie produit sur $\mathbb{R}^{2} = \mathbb{R} \times \mathbb{R}$ coïncide avec la topologie associée à la distance euclidienne.

    **3.** Soient $A \subset Y$ et $A' \subset Y'$. Montrer que $\overline{A \times A'} = \overline{A} \times \overline{A'}$ et que $\operatorname{Int}(A \times A') = \mathring{A} \times \mathring{A'}$. L'intérieur d'une réunion de produits est-il la réunion des intérieurs ? On pourra regarder $\big([0, 1] \times [0, 1]\big) \cup \big([1, 2] \times [0, 1]\big)$ dans $\mathbb{R}^{2}$.
  corrige: |
    **1.** Pour $U$ ouvert de $Y$, $p^{-1}(U) = U \times Y'$ est un ouvert élémentaire : $p$ est continue, et $p'$ de même. Soit $\mathcal{T}$ une topologie sur $Y \times Y'$ rendant $p$ et $p'$ continues. Pour $U$ et $U'$ ouverts, 
    $$U \times U' = p^{-1}(U) \cap p'^{-1}(U') \in \mathcal{T} .$$
     Les ouverts élémentaires, qui forment une base de la topologie produit, sont dans $\mathcal{T}$ ; leurs réunions aussi. La topologie produit est donc contenue dans $\mathcal{T}$.

    **2.** Par la proposition 6 du cours, les rectangles ouverts $]a, b[ \times ]c, d[$ forment une base de la topologie produit. Utilisons la comparaison des bases (cours, prop. 4). Si $m$ est dans un rectangle ouvert, il est à une distance $\varepsilon > 0$ de son bord, et le disque ouvert $B(m, \varepsilon)$ est contenu dans le rectangle. Inversement, si $m$ est dans un disque ouvert $B(c, r)$, posons $\varepsilon = r - \lVert m - c \rVert$ : le carré ouvert de centre $m$ et de demi-côté $\varepsilon/\sqrt{2}$ est contenu dans $B(m, \varepsilon) \subset B(c, r)$. Les deux topologies coïncident.

    ![Figure](documents/figures/6ba10ed65bf7f167.svg)

    Autour d'un point $m = (x, y)$, le carré ouvert de demi-côté $\varepsilon$ (en bleu, à l'extérieur) contient le disque $B(m, \varepsilon)$ (en orange), qui contient le carré de demi-côté $\varepsilon/\sqrt{2}$ : chaque base s'emboîte dans l'autre.

    **3.** Les ouverts élémentaires $U \times U'$ contenant un point $(x, x')$ forment une base de ses voisinages. Ce point est adhérent à $A \times A'$ si et seulement si chacun de ces ouverts rencontre $A \times A'$, c'est-à-dire si $U$ rencontre $A$ et $U'$ rencontre $A'$ pour tous voisinages ouverts $U$ de $x$ et $U'$ de $x'$. Cela signifie exactement $x \in \overline{A}$ et $x' \in \overline{A'}$ : $\overline{A \times A'} = \overline{A} \times \overline{A'}$.

    De même, $(x, x')$ est intérieur à $A \times A'$ si et seulement s'il existe un ouvert élémentaire $U \times U'$ avec $(x, x') \in U \times U' \subset A \times A'$, soit $x \in U \subset A$ et $x' \in U' \subset A'$ : $\operatorname{Int}(A \times A') = \mathring{A} \times \mathring{A'}$.

    La propriété ne passe pas aux réunions. La réunion proposée est le rectangle $[0, 2] \times [0, 1]$, d'intérieur $]0, 2[ \times ]0, 1[$, alors que la réunion des intérieurs 
    $$\big(]0, 1[ \times ]0, 1[\big) \cup \big(]1, 2[ \times ]0, 1[\big)$$
     ne contient pas le segment $\{1\} \times ]0, 1[$. L'intérieur d'une réunion contient la réunion des intérieurs, sans lui être égal en général.

