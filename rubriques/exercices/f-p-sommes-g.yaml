  page_corrige: 4
  enonce: |
    Selon une légende, l'inventeur du jeu d'échecs demanda pour récompense un grain de blé sur la première case de l'échiquier, deux sur la deuxième, quatre sur la troisième, et ainsi de suite en doublant à chaque case, jusqu'à la $64$ᵉ.

    **1.** Combien de grains faut-il placer sur la $64$ᵉ case ? On donnera le résultat sous forme d'une puissance de $2$.

    **2.** Combien de grains faut-il au total ? Comparer ce total au nombre de grains de la dernière case.

    **3.** On admet qu'un grain de blé pèse environ $0{,}05$ g, et que la production mondiale de blé est de l'ordre de $800$ millions de tonnes par an. Combien d'années de production faudrait-il pour honorer la demande ?
  corrige: |
    Le nombre de grains de la case numéro $k$ est $g_{k}=2^{k-1}$ : c'est une suite géométrique de premier terme $g_{1}=1$ et de raison $2$.

    **1.** 
    $$g_{64}=\boxed{2^{63}}\approx 9{,}2\times 10^{18} \text{ grains}$$

    **2.** 
    $$g_{1}+g_{2}+\dots+g_{64}=1+2+\dots+2^{63}=\frac{1-2^{64}}{1-2}=\boxed{2^{64}-1} =18\,446\,744\,073\,709\,551\,615$$
     soit environ $1{,}8\times 10^{19}$ grains. On remarque que $2^{64}-1=2\times 2^{63}-1$ : le total est égal au double de la dernière case, moins un grain. La dernière case contient à elle seule plus de la moitié du blé !

    **3.** La masse totale vaut environ $1{,}8\times 10^{19}\times 0{,}05=9{,}2\times 10^{17}$ g, soit $9{,}2\times 10^{11}$ tonnes, car $1$ tonne $=10^{6}$ g. Le nombre d'années de production nécessaires est d'environ : 
    $$\frac{9{,}2\times 10^{11}}{8\times 10^{8}}\approx\boxed{1\,150 \text{ ans}}$$

    La croissance d'une suite géométrique de raison $2$ dépasse très vite l'intuition : c'est tout l'objet de la légende.
- id: "p-sg-08"
  feuille: "f-p-sommes-g"
  numero: 8
  partie: "Problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [évolution en pourcentage, modélisation, seuil, suite géométrique, suite arithmétique, sommes de termes]
  noeuds: [ar-suites, n-sommes]
  notions: [suite]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Une entreprise propose à une nouvelle salariée, payée $21\,600$ euros la première année, deux contrats :

    • **contrat A** : son salaire annuel augmente de $2\,\%$ chaque année ;

    • **contrat B** : son salaire annuel augmente de $500$ euros chaque année.

    **1.** On note $a_n$ et $b_n$ les salaires annuels de la $n$-ième année avec chaque contrat. Quelle est la nature de chacune des suites $(a_n)$ et $(b_n)$ ? Exprimer $a_n$ et $b_n$ en fonction de $n$.

    **2.** Calculer, pour chaque contrat, le total perçu au bout de $10$ ans, puis au bout de $20$ ans. Arrondir à l'euro.

    **3.** À l'aide de la calculatrice, déterminer à partir de combien d'années le total perçu avec le contrat A dépasse celui perçu avec le contrat B.
  corrige: |
    **1.** Augmenter de $2\,\%$, c'est multiplier par $1{,}02$ : $(a_{n})$ est **géométrique** de raison $1{,}02$. Augmenter de $500$ euros, c'est ajouter $500$ : $(b_{n})$ est **arithmétique** de raison $500$. Comme le premier terme est d'indice $1$ : 
    $$\boxed{a_{n}=21\,600\times 1{,}02^{\,n-1}} \qquad ; \qquad \boxed{b_{n}=21\,600+500\,(n-1)}$$

    **2.** Contrat A. Somme de $N$ termes géométriques : 
    $$A_{N}=21\,600\times\frac{1-1{,}02^{N}}{1-1{,}02}=21\,600\times\frac{1{,}02^{N}-1}{0{,}02}$$
     d'où $A_{10}\approx\boxed{236\,514}$ euros et $A_{20}\approx\boxed{524\,823}$ euros.

    Contrat B. Somme de $N$ termes arithmétiques, avec $b_{10}=26\,100$ et $b_{20}=31\,100$ : 
    $$B_{10}=10\times\frac{21\,600+26\,100}{2}=\boxed{238\,500} \text{ euros}$$

    $$B_{20}=20\times\frac{21\,600+31\,100}{2}=\boxed{527\,000} \text{ euros}$$
     Sur $10$ comme sur $20$ ans, le contrat B est plus avantageux.

    **3.** La calculatrice, par exemple avec un tableau de valeurs de $A_{N}$ et $B_{N}$, donne :

    $$\begin{array}{|c||c|c|} \hline N & A_{N}\text{ (euros)} & B_{N}\text{ (euros)} \\ \hline 23 & \approx 623\,051 & 623\,300 \\ \hline 24 & \approx 657\,112 & 656\,400 \\ \hline \end{array}$$

    $$\boxed{\text{le contrat A devient plus avantageux à partir de } 24 \text{ ans}}$$
     Au début, l'augmentation de $2\,\%$ ne représente que $432$ euros, moins que $500$ euros ; mais elle porte sur un salaire qui grandit, et finit par dépasser toute augmentation fixe. **Une croissance géométrique de raison $q>1$ finit toujours par l'emporter sur une croissance arithmétique**, même si celle-ci est plus rapide au départ.
- id: "p-sg-09"
  feuille: "f-p-sommes-g"
  numero: 9
  partie: "Problèmes"
  etoiles: 2
  types: [Lecture graphique, Démonstration, Calcul]
