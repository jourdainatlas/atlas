- id: "p-sg-01"
  feuille: "f-p-sommes-g"
  numero: 1
  partie: "Calculs de sommes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite géométrique, puissances]
  noeuds: [n-sommes, ar-suites, n-operations]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les sommes suivantes.

    **1.** $1+2+2^{2}+\dots+2^{10}$

    **2.** $1+3+3^{2}+\dots+3^{6}$

    **3.** $1+\dfrac{1}{2}+\dfrac{1}{2^{2}}+\dots+\dfrac{1}{2^{10}}$

    **4.** $1-2+4-8+\dots+256$

    **5.** $1+10+100+\dots+10^{6}$

    Pour la question 4., on cherchera la raison $q$ et l'exposant de la dernière puissance.
  corrige: |
    On utilise la formule du cours : pour tout réel $q\neq 1$ et tout $n\in\mathbb{N}$, $1+q+q^{2}+\dots+q^{n}=\dfrac{1-q^{n+1}}{1-q}$. On repère à chaque fois la raison $q$ et le **dernier exposant** $n$ : la somme compte alors $n+1$ termes.

    **1.** $q=2$ et $n=10$ : 
    $$1+2+2^{2}+\dots+2^{10}=\frac{1-2^{11}}{1-2}=2^{11}-1=\boxed{2\,047}$$

    **2.** $q=3$ et $n=6$ : 
    $$1+3+3^{2}+\dots+3^{6}=\frac{1-3^{7}}{1-3}=\frac{3^{7}-1}{2}=\frac{2\,186}{2}=\boxed{1\,093}$$

    **3.** $q=\dfrac{1}{2}$ et $n=10$ : 
    $$1+\frac{1}{2}+\dots+\frac{1}{2^{10}}=\frac{1-\left(\frac{1}{2}\right)^{11}}{1-\frac{1}{2}} =2\left(1-\frac{1}{2\,048}\right)=2-\frac{1}{1\,024}=\boxed{\frac{2\,047}{1\,024}}$$
     La somme est très proche de $2$, sans jamais l'atteindre : l'exercice 9 en donne une interprétation géométrique.

    **4.** Chaque terme est l'opposé du double du précédent : $q=-2$. Comme $256=2^{8}=(-2)^{8}$, le dernier exposant est $n=8$, et la somme compte $9$ termes. 
    $$1-2+4-\dots+256=\frac{1-(-2)^{9}}{1-(-2)}=\frac{1+512}{3}=\boxed{171}$$
     **L'erreur la plus répandue** est d'écrire $(-2)^{9}=512$ : une puissance impaire d'un nombre négatif est négative, donc $(-2)^{9}=-512$.

    **5.** $q=10$ et $n=6$ : 
    $$1+10+100+\dots+10^{6}=\frac{1-10^{7}}{1-10}=\frac{9\,999\,999}{9}=\boxed{1\,111\,111}$$
     Le résultat se voit aussi directement en posant l'addition en colonnes : chaque puissance de $10$ apporte un chiffre $1$.
- id: "p-sg-02"
  feuille: "f-p-sommes-g"
  numero: 2
  partie: "Calculs de sommes"
  etoiles: 1
  types: [Conjecture, Calcul]
  mots_cles: [sommes de termes, puissances]
  noeuds: [n-sommes, n-operations]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les sommes suivantes, écrites avec le symbole $\displaystyle\sum$.

    $$\textbf{1. } \sum_{k=0}^{7} 2^{k} \qquad\quad \textbf{2. } \sum_{k=0}^{5} 3\times 2^{k} \qquad\quad \textbf{3. } \sum_{k=1}^{6} 5^{k} \qquad\quad \textbf{4. } \sum_{k=0}^{4} \left(\frac{1}{3}\right)^{k} \qquad\quad \textbf{5. } \sum_{k=0}^{20} 1^{k}$$

    Calculer ensuite $\displaystyle\sum_{k=0}^{9} (-1)^{k}$ et $\displaystyle\sum_{k=0}^{10} (-1)^{k}$. Formuler une conjecture pour $\displaystyle\sum_{k=0}^{n} (-1)^{k}$ selon la parité de $n$.
  corrige: |
    **1.** 
    $$\sum_{k=0}^{7}2^{k}=1+2+\dots+2^{7}=\frac{1-2^{8}}{1-2}=2^{8}-1=\boxed{255}$$

    **2.** Le facteur $3$ est commun à tous les termes, on le met en facteur : 
    $$\sum_{k=0}^{5}3\times 2^{k}=3\,(1+2+\dots+2^{5})=3\times(2^{6}-1)=3\times 63=\boxed{189}$$

    **3.** **Attention**, la somme commence à $k=1$ : il manque le terme $5^{0}=1$. On met $5$ en facteur : 
    $$\sum_{k=1}^{6}5^{k}=5\,(1+5+\dots+5^{5})=5\times\frac{5^{6}-1}{5-1}=5\times\frac{15\,624}{4} =\boxed{19\,530}$$
     On peut aussi calculer la somme de $k=0$ à $6$, puis retirer $1$ : $\dfrac{5^{7}-1}{4}-1=19\,531-1=19\,530$.

    **4.** 
    $$\sum_{k=0}^{4}\left(\frac{1}{3}\right)^{k}=\frac{1-\left(\frac{1}{3}\right)^{5}}{1-\frac{1}{3}} =\frac{3}{2}\times\left(1-\frac{1}{243}\right)=\frac{3}{2}\times\frac{242}{243}=\boxed{\frac{121}{81}}$$

    **5.** Ici $q=1$, et **la formule du cours ne s'applique pas**, puisqu'elle demande $q\neq 1$ : on diviserait par $0$. Tous les termes valent $1^{k}=1$, et il y en a $21$, de $k=0$ à $k=20$. 
    $$\sum_{k=0}^{20}1^{k}=\boxed{21}$$

    Les termes $(-1)^{k}$ valent alternativement $1$ et $-1$, et se compensent deux à deux : 
    $$\sum_{k=0}^{9}(-1)^{k}=\underbrace{(1-1)+(1-1)+\dots+(1-1)}_{5 \text{ paires}}=\boxed{0} \qquad ; \qquad \sum_{k=0}^{10}(-1)^{k}=0+(-1)^{10}=\boxed{1}$$
     On conjecture que la somme vaut $1$ si $n$ est pair et $0$ si $n$ est impair. La formule du cours, avec $q=-1$, le confirme : 
    $$\sum_{k=0}^{n}(-1)^{k}=\frac{1-(-1)^{n+1}}{1-(-1)}=\frac{1-(-1)^{n+1}}{2} =\left\{\begin{array}{ll} \frac{1+1}{2}=1 & \text{si } n \text{ est pair (} n+1 \text{ impair)} \\[1mm] \frac{1-1}{2}=0 & \text{si } n \text{ est impair} \end{array}\right.$$
- id: "p-sg-03"
  feuille: "f-p-sommes-g"
