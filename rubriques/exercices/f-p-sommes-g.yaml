  noeuds: [n-operations]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    On part d'un carré d'aire $1$. À la première étape, on colorie la moitié du carré. À chaque étape suivante, on colorie la moitié de la partie encore blanche, comme sur la figure ci-contre.

    **1.** Quelle aire colorie-t-on à l'étape $n$ ?

    **2.** Montrer que l'aire coloriée au total après $n$ étapes vaut $A_{n}=1-\dfrac{1}{2^{n}}$.

    **3.** Déterminer le plus petit entier $n$ tel que $A_{n}>0{,}999$.

    **4.** Que devient l'aire coloriée lorsque $n$ devient très grand ? Était-ce prévisible ?

    ![Figure](documents/figures/beebd79623184d1c.svg)
  corrige: |
    **1.** À chaque étape, la partie blanche est divisée par $2$. Après $n-1$ étapes, l'aire blanche vaut $\dfrac{1}{2^{n-1}}$, et l'on en colorie la moitié à l'étape $n$ : $\boxed{\dfrac{1}{2^{n}}}$.

    **2.** L'aire coloriée est la somme de $n$ termes de la suite géométrique de premier terme $\dfrac{1}{2}$ et de raison $\dfrac{1}{2}$ : 
    $$A_{n}=\frac{1}{2}+\frac{1}{4}+\dots+\frac{1}{2^{n}}=\frac{1}{2}\times\frac{1-\left(\frac{1}{2}\right)^{n}}{1-\frac{1}{2}} =\boxed{1-\frac{1}{2^{n}}}$$
     On le retrouve sans calcul : la partie restée blanche a pour aire $\dfrac{1}{2^{n}}$, et le reste du carré est colorié.

    **3.** $A_{n}>0{,}999\iff\dfrac{1}{2^{n}}<0{,}001\iff 2^{n}>1\,000$. Comme $2^{9}=512$ et $2^{10}=1\,024$ : $\boxed{n=10}$.

    **4.** Lorsque $n$ devient très grand, $\dfrac{1}{2^{n}}$ devient aussi petit que l'on veut, et $A_{n}$ s'approche de $1$ : **l'aire coloriée se rapproche de l'aire du carré entier, sans jamais l'atteindre**. C'était prévisible : on colorie toujours une partie de ce qui reste, et ce qui reste ne cesse de diminuer de moitié. On écrit parfois $\dfrac{1}{2}+\dfrac{1}{4}+\dfrac{1}{8}+\dots=1$ ; donner un sens précis à cette somme infinie est l'objet de la notion de limite, étudiée en Terminale.
- id: "p-sg-10"
  feuille: "f-p-sommes-g"
  numero: 10
  partie: "Problèmes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [sommes de termes, suite géométrique, puissances, modélisation, seuil]
  noeuds: [n-sommes, ar-suites, n-operations]
  notions: [suite]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On lâche une balle d'une hauteur de $10$ mètres. À chaque rebond, elle remonte aux trois quarts de la hauteur d'où elle est tombée. On note $h_{0}=10$ et, pour $n\geqslant 1$, $h_{n}$ la hauteur atteinte après le $n$-ième rebond.

    **1.** Justifier que $(h_{n})$ est une suite géométrique, et exprimer $h_{n}$ en fonction de $n$.

    **2.** Calculer la distance verticale totale parcourue par la balle au moment où elle touche le sol pour la deuxième fois, puis pour la troisième fois.

    **3.** On note $D_{n}$ la distance totale parcourue au moment où la balle touche le sol pour la $(n+1)$-ième fois. Justifier que $D_{n}=10+2\,(h_{1}+h_{2}+\dots+h_{n})$, puis que 
    $$D_{n}=70-60\times\left(\frac{3}{4}\right)^{n}$$

    **4.** La distance parcourue peut-elle dépasser $70$ mètres ? Déterminer, à l'aide de la calculatrice, le plus petit entier $n$ tel que $D_{n}>69$.
  corrige: |
    **1.** Chaque hauteur est les trois quarts de la précédente : $h_{n+1}=\dfrac{3}{4}h_{n}$. La suite $(h_{n})$ est géométrique de raison $\dfrac{3}{4}$ et de premier terme $h_{0}=10$ : 
    $$\boxed{h_{n}=10\times\left(\frac{3}{4}\right)^{n}}$$

    **2.** La balle tombe de $10$ m, puis remonte et redescend de $h_{1}=7{,}5$ m avant le deuxième contact : 
    $$10+2\times 7{,}5=\boxed{25 \text{ m}}$$
     Avant le troisième contact, elle remonte et redescend encore de $h_{2}=5{,}625$ m : 
    $$25+2\times 5{,}625=\boxed{36{,}25 \text{ m}}$$

    ![Figure](documents/figures/f3bdb88e0302e810.svg)

    La trajectoire de la balle, en bleu, est étalée horizontalement pour la lisibilité ; seules les hauteurs comptent. Chaque arc correspond à une montée puis une descente de même hauteur, d'où le facteur $2$.

    **3.** La balle tombe d'abord de $h_{0}=10$ m. Puis, pour chacun des $n$ rebonds avant le $(n+1)$-ième contact, elle monte de $h_{k}$ et redescend de $h_{k}$. D'où $D_{n}=10+2\,(h_{1}+h_{2}+\dots+h_{n})$. La somme compte $n$ termes, de premier terme $h_{1}=7{,}5$ : 
    $$h_{1}+\dots+h_{n}=7{,}5\times\frac{1-\left(\frac{3}{4}\right)^{n}}{1-\frac{3}{4}} =30\left(1-\left(\frac{3}{4}\right)^{n}\right)$$

    $$D_{n}=10+60\left(1-\left(\frac{3}{4}\right)^{n}\right)=\boxed{70-60\times\left(\frac{3}{4}\right)^{n}}$$
     Contrôle : $D_{1}=70-45=25$ et $D_{2}=70-33{,}75=36{,}25$, comme à la question 2.

    **4.** Comme $60\times\left(\frac{3}{4}\right)^{n}>0$, on a toujours $D_{n}<70$ : **la distance parcourue ne dépasse jamais $70$ mètres**, bien que la balle rebondisse indéfiniment dans ce modèle. 
    $$D_{n}>69\iff 60\times\left(\frac{3}{4}\right)^{n}<1\iff\left(\frac{3}{4}\right)^{n}<\frac{1}{60}$$
     La calculatrice donne $\left(\frac{3}{4}\right)^{14}\approx 0{,}0178$ et $\left(\frac{3}{4}\right)^{15}\approx 0{,}0134$, alors que $\frac{1}{60}\approx 0{,}0167$ : $\boxed{n=15}$.

    Une infinité de rebonds pour une distance finie : ce paradoxe apparent est le même que celui de l'exercice 9, où une infinité d'étapes ne colorie qu'un carré d'aire $1$.

