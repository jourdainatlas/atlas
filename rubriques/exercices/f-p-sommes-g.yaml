  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer, dans chaque cas, l'entier $n$ tel que :

    **1.** $1+2+\dots+2^{n}=1\,023$

    **2.** $1+2+\dots+2^{n}=4\,095$

    **3.** $1+3+\dots+3^{n}=1\,093$

    Existe-t-il un entier $n$ tel que $1+2+\dots+2^{n}=1\,000$ ? Justifier.
  corrige: |
    D'après la formule du cours, $1+2+\dots+2^{n}=2^{n+1}-1$ et $1+3+\dots+3^{n}=\dfrac{3^{n+1}-1}{2}$. On se ramène donc à reconnaître une puissance.

    **1.** $2^{n+1}-1=1\,023\iff 2^{n+1}=1\,024=2^{10}\iff n+1=10$, donc $\boxed{n=9}$.

    **2.** $2^{n+1}-1=4\,095\iff 2^{n+1}=4\,096=2^{12}$, donc $\boxed{n=11}$.

    **3.** $\dfrac{3^{n+1}-1}{2}=1\,093\iff 3^{n+1}=2\,187=3^{7}$, donc $\boxed{n=6}$.

    Il faudrait $2^{n+1}=1\,001$. Or $2^{9}=512$ et $2^{10}=1\,024$ : aucune puissance de $2$ ne vaut $1\,001$. On peut aussi remarquer que $2^{n+1}-1$ est toujours impair, alors que $1\,000$ est pair. 
    $$\boxed{\text{Il n'existe aucun entier } n \text{ tel que } 1+2+\dots+2^{n}=1\,000}$$
- id: "p-sg-04"
  feuille: "f-p-sommes-g"
  numero: 4
  partie: "Sommes de termes d'une suite géométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite géométrique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $(v_n)$ la suite géométrique de premier terme $v_0=5$ et de raison $q=3$.

    **1.** Exprimer $v_n$ en fonction de $n$, puis calculer $v_{6}$.

    **2.** Calculer $S=v_0+v_1+\dots+v_{6}$, puis vérifier le résultat en additionnant les sept termes un à un.
  corrige: |
    **1.** D'après la formule explicite du cours : 
    $$\boxed{v_{n}=v_{0}\times q^{n}=5\times 3^{n}} \qquad \text{d'où} \qquad v_{6}=5\times 729=\boxed{3\,645}$$

    **2.** On met le premier terme en facteur, comme dans le cours : 
    $$S=5\,(1+3+\dots+3^{6})=5\times\frac{1-3^{7}}{1-3}=5\times\frac{2\,186}{2}=\boxed{5\,465}$$
     C'est la formule « premier terme $\times\dfrac{1-q^{\text{nombre de termes}}}{1-q}$ », avec $7$ termes.

    **Vérification :** $5+15+45+135+405+1\,215+3\,645=5\,465$.
- id: "p-sg-05"
  feuille: "f-p-sommes-g"
  numero: 5
  partie: "Sommes de termes d'une suite géométrique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite géométrique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Calculer la somme des termes de chacune des suites géométriques suivantes.

    **1.** $w_1=64$ et raison $\dfrac{1}{2}$ : calculer $w_1+w_2+\dots+w_{7}$.

    **2.** $t_0=2$ et raison $-3$ : calculer $t_0+t_1+\dots+t_{5}$.

    Pourquoi la seconde somme est-elle négative, alors que son premier terme est positif ?
  corrige: |
    **1.** La somme compte $7$ termes, de $w_{1}$ à $w_{7}$, et son premier terme vaut $64$ : 
    $$w_{1}+\dots+w_{7}=64\times\frac{1-\left(\frac{1}{2}\right)^{7}}{1-\frac{1}{2}} =128\left(1-\frac{1}{128}\right)=128-1=\boxed{127}$$
     Contrôle : $64+32+16+8+4+2+1=127$.

    **2.** La somme compte $6$ termes, de $t_{0}$ à $t_{5}$ : 
    $$t_{0}+\dots+t_{5}=2\times\frac{1-(-3)^{6}}{1-(-3)}=2\times\frac{1-729}{4}=\boxed{-364}$$
     Contrôle : $2-6+18-54+162-486=-364$.

    La raison étant négative, les termes changent de signe à chaque rang, et leur valeur absolue est multipliée par $3$. Le dernier terme, $t_{5}=-486$, est négatif et l'emporte sur tous les autres réunis, dont la somme ne vaut que $122$. C'est une propriété générale : lorsque $q<-1$, le signe de la somme est celui de son dernier terme.
- id: "p-sg-06"
  feuille: "f-p-sommes-g"
  numero: 6
  partie: "Sommes de termes d'une suite géométrique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes de termes, suite géométrique, seuil]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $(u_n)$ une suite géométrique à termes positifs telle que $u_2=12$ et $u_5=96$.

    **1.** Déterminer la raison $q$, puis le premier terme $u_0$.

    **2.** Exprimer $u_n$ en fonction de $n$.

    **3.** Calculer $u_0+u_1+\dots+u_{9}$.

    **4.** Déterminer, à l'aide de la calculatrice, le plus petit entier $n$ tel que $u_n>10\,000$.
  corrige: |
    **1.** D'après la formule $u_{n}=u_{p}\times q^{n-p}$ avec $n=5$ et $p=2$ : 
    $$u_{5}=u_{2}\times q^{3} \iff 96=12\,q^{3} \iff q^{3}=8 \iff \boxed{q=2}$$
     car $2$ est le seul réel dont le cube vaut $8$. Puis $u_{2}=u_{0}\times q^{2}$, d'où $u_{0}=\dfrac{12}{4}=\boxed{3}$.

    **2.** 
    $$\boxed{u_{n}=3\times 2^{n}}$$
     Contrôle : $u_{2}=3\times 4=12$ et $u_{5}=3\times 32=96$.

    **3.** La somme compte $10$ termes : 
    $$u_{0}+\dots+u_{9}=3\times\frac{1-2^{10}}{1-2}=3\times 1\,023=\boxed{3\,069}$$

    **4.** La suite est croissante, puisque $u_{n+1}=2u_{n}>u_{n}$. La calculatrice donne $u_{11}=3\times 2\,048=6\,144$ et $u_{12}=3\times 4\,096=12\,288$. $\boxed{n=12}$
