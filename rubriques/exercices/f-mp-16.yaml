  page_enonce: 7
  page_corrige: 15
  enonce: |
    On considère l'équation $(2x + 1)y'' + (4x - 2)y' - 8y = 0$.

    **1.** Déterminer ses solutions polynomiales.

    **2.** Déterminer ses solutions de la forme $x \mapsto \mathrm{e}^{\alpha x}$, avec $\alpha \in \mathbb{R}$.

    **3.** La résoudre sur tout intervalle ne contenant pas $-\frac{1}{2}$.
  corrige: |
    On cherche des solutions particulières de formes simples ; deux solutions indépendantes suffisent, puisque l'équation est normalisée sur les intervalles considérés.

    **1.** Si $y$ est un polynôme de degré $d$ et de coefficient dominant $c$, le terme de degré $d$ de l'équation est $(4d - 8)c\,x^{d}$, d'où $d = 2$. En écrivant $y = ax^{2} + bx + e$ et en identifiant, on trouve $b = 0$ et $a = 4e$. 
    $$\boxed{\text{solutions polynomiales : } c\,(4x^{2} + 1), \ c \in \mathbb{R}}$$

    **2.** Pour $y = \mathrm{e}^{\alpha x}$, l'équation devient $\big((2\alpha^{2} + 4\alpha)x + \alpha^{2} - 2\alpha - 8\big)\mathrm{e}^{\alpha x} = 0$, d'où $\alpha \in \{0, -2\}$ et $\alpha \in \{4, -2\}$. 
    $$\boxed{\alpha = -2 : \ x \mapsto \mathrm{e}^{-2x}}$$

    **3.** Sur un intervalle $I$ ne contenant pas $-\dfrac{1}{2}$, l'équation se normalise, et l'espace des solutions est un plan (théorème 2). Les solutions $4x^{2} + 1$ et $\mathrm{e}^{-2x}$ ne sont pas proportionnelles, donc : 
    $$\boxed{y(x) = \lambda(4x^{2} + 1) + \mu\,\mathrm{e}^{-2x}, \quad (\lambda, \mu) \in \mathbb{R}^{2}}$$
- id: "mp-16-41"
  feuille: "f-mp-16"
  numero: 41
  partie: "Équations non normalisées et séries entières"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [séries entières, solutions développables en série entière]
  noeuds: [cx-series-entieres, ed-lineaires]
  notions: [serie-entiere]
  source: "BibM@th, Équations différentielles, exercice 17"
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On cherche les solutions sur $\mathbb{R}$ de l'équation $xy'' - y' + 4x^{3}y = 0$.

    **1.** Soit $a$, $b$, $c$, $d \in \mathbb{R}$, et $f$ définie sur $\mathbb{R}^{*}$ par 
    $$f(x) = a\cos(x^{2}) + b\sin(x^{2}) \ \text{ si } x > 0, \qquad f(x) = c\cos(x^{2}) + d\sin(x^{2}) \ \text{ si } x < 0.$$
     À quelle condition $f$ se prolonge-t-elle en une fonction de classe $\mathcal{C}^{2}$ sur $\mathbb{R}$ ?

    **2.** Soit $y(x) = \displaystyle\sum_{n \geqslant 0} a_{n}x^{n}$ une solution développable en série entière, de rayon $R > 0$. Établir une relation entre $a_{n + 4}$ et $a_{n}$, et montrer que $a_{1} = a_{3} = 0$.

    **3.** Déterminer les $a_{n}$, reconnaître la somme à l'aide de fonctions usuelles, et préciser le rayon.

    **4.** En déduire une base de l'espace des solutions sur $\mathbb{R}$. Quelle est sa dimension ?
  corrige: |
    L'équation n'est pas normalisée en $0$, et pourtant l'espace de ses solutions sur $\mathbb{R}$ est un plan : c'est la série entière qui l'établit.

    **1.** Les fonctions $\cos(x^{2})$ et $\sin(x^{2})$ sont de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et leurs développements en $0$ s'écrivent 
    $$\cos(x^{2}) = 1 + O(x^{4}), \qquad \sin(x^{2}) = x^{2} + O(x^{6}).$$
     La continuité en $0$ impose $a = c$, et l'existence de $f''(0)$, qui vaut $2b$ à droite et $2d$ à gauche, impose $b = d$. Réciproquement, si $a = c$ et $b = d$, $f = a\cos(x^{2}) + b\sin(x^{2})$ sur $\mathbb{R}^{*}$ se prolonge en une fonction de classe $\mathcal{C}^{\infty}$. 
    $$\boxed{f \text{ se prolonge en une fonction de classe } \mathcal{C}^{2} \iff a = c \text{ et } b = d}$$

    **2.** En reportant la série dans l'équation, le coefficient de $x^{n - 1}$ est $n(n - 2)a_{n} + 4a_{n - 4}$, avec la convention $a_{k} = 0$ pour $k < 0$. Pour $n = 1$ et $n = 3$, on obtient $-a_{1} = 0$ et $3a_{3} = 0$ ; pour $n \geqslant 4$, en remplaçant $n$ par $n + 4$ : 
    $$\boxed{(n + 4)(n + 2)\,a_{n + 4} = -4a_{n}, \qquad a_{1} = a_{3} = 0}$$

    **3.** Les coefficients d'indice impair sont nuls, et $a_{0}$, $a_{2}$ sont libres. Par récurrence, $a_{4p} = -\dfrac{a_{4p - 4}}{2p(2p - 1)}$ et $a_{4p + 2} = -\dfrac{a_{4p - 2}}{(2p + 1)2p}$, d'où 
    $$a_{4p} = \frac{(-1)^{p}a_{0}}{(2p)!}, \qquad a_{4p + 2} = \frac{(-1)^{p}a_{2}}{(2p + 1)!}.$$

    $$\boxed{y(x) = a_{0}\cos(x^{2}) + a_{2}\sin(x^{2}), \qquad R = +\infty}$$

    **4.** Sur $]0, +\infty[$ et $]-\infty, 0[$, l'équation se normalise, et $\cos(x^{2})$, $\sin(x^{2})$, qui sont solutions et indépendantes, en forment une base. Une solution sur $\mathbb{R}$ s'écrit donc comme la fonction $f$ de la question 1, et le fait qu'elle soit de classe $\mathcal{C}^{2}$ impose $a = c$ et $b = d$. 
    $$\boxed{\big(\cos(x^{2}), \sin(x^{2})\big) \text{ est une base, et l'espace des solutions sur } \mathbb{R} \text{ est de dimension } 2}$$
- id: "mp-16-42"
  feuille: "f-mp-16"
  numero: 42
  partie: "Équations non normalisées et séries entières"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries entières, solutions développables en série entière]
  noeuds: [cx-series-entieres, ed-lineaires]
  notions: [serie-entiere]
  source: "Feuille d'exercices #17 (Prost), exercice 10 (questions 1 et 3)"
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Pour $\alpha \in \mathbb{R}$, on considère sur $]-1, 1[$ l'équation $(1 - x^{2})y'' - \alpha xy' + \alpha y = 0$, notée $(E_{\alpha})$.

    **1.** Remarquer que $x \mapsto x$ est solution de $(E_{\alpha})$ pour tout $\alpha$.

    **2.** Déterminer les solutions de $(E_{2})$ développables en série entière, et leur rayon. Obtient-on toutes les solutions de $(E_{2})$ sur $]-1, 1[$ ?

    **3.** Résoudre $(E_{1})$ à l'aide du changement de variable $x = \sin t$.
  corrige: |
    Une solution évidente, une recherche par série entière, puis un changement de variable trigonométrique.

    **1.** Pour $y = x$, on a $(1 - x^{2})\cdot 0 - \alpha x + \alpha x = 0$.

    **2.** Le coefficient de $x^{n}$ dans $(E_{2})$ est $(n + 2)(n + 1)a_{n + 2} - (n^{2} + n - 2)a_{n}$, et $n^{2} + n - 2 = (n + 2)(n - 1)$, d'où $a_{n + 2} = \dfrac{n - 1}{n + 1}a_{n}$. Pour les indices impairs, $a_{3} = 0$, donc $a_{2p + 1} = 0$ pour $p \geqslant 1$. Pour les indices pairs, $a_{2p} = -\dfrac{a_{0}}{2p - 1}$ pour $p \geqslant 1$. Ainsi 
    $$\boxed{y(x) = a_{1}x + a_{0}\Big(1 - \sum_{p \geqslant 1} \frac{x^{2p}}{2p - 1}\Big) = a_{1}x + a_{0}\big(1 - x\operatorname{Argth} x\big), \qquad R = 1}$$
     Ces deux solutions sont indépendantes, et l'équation est normalisée sur $]-1, 1[$, d'espace de solutions de dimension $2$ : toutes les solutions de $(E_{2})$ sur $]-1, 1[$ sont développables en série entière.

    **3.** Avec $x = \sin t$, $t \in \big]-\dfrac{\pi}{2}, \dfrac{\pi}{2}\big[$, et $z(t) = y(\sin t)$, on a $z'' = \cos^{2}t\,y''(\sin t) - \sin t\,y'(\sin t)$, d'où $z'' = (1 - x^{2})y'' - xy'$ : $(E_{1})$ équivaut à $z'' + z = 0$, d'où $z = a\cos t + b\sin t$, et $\cos t = \sqrt{1 - x^{2}}$. 
    $$\boxed{y(x) = a\sqrt{1 - x^{2}} + bx, \quad (a, b) \in \mathbb{R}^{2}}$$
- id: "mp-16-43"
  feuille: "f-mp-16"
  numero: 43
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, exponentielle de matrice, wronskien, réduction]
  noeuds: [ed-lineaires, rd-diagonalisable]
  notions: [exponentielle-matrice, valeur-propre]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Une solution sur $I$ d'une équation linéaire homogène $x' = a(t)\cdot x$ qui s'annule en un point est identiquement nulle.

    **2.** L'ensemble des solutions sur $\mathbb{R}$ de $tx' - 2x = 0$ est une droite vectorielle.

    **3.** Si $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$ commutent, alors $\exp(A + B) = \exp(A)\exp(B)$.

    **4.** Pour toutes matrices $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$, les matrices $\exp(A)$ et $\exp(B)$ commutent.

    **5.** Pour toute $A \in \mathcal{M}_{n}(\mathbb{K})$, la matrice $\exp(A)$ est inversible.

    **6.** Si toutes les valeurs propres de $A$ ont une partie réelle négative ou nulle, toutes les solutions de $X' = AX$ sont bornées sur $\mathbb{R}_{+}$.

    **7.** Le wronskien de deux solutions de $y'' + y = 0$ est constant.

    **8.** L'ensemble des solutions sur $I$ de $y'' + a(t)y' + b(t)y = 0$, où $a$ et $b$ sont continues sur $I$, est un plan vectoriel.

    **9.** Le problème de Cauchy $x' = x^{2}$, $x(0) = 1$, a une solution définie sur $\mathbb{R}$.

    **10.** Si $A \in \mathcal{M}_{n}(\mathbb{R})$ a une valeur propre complexe de partie réelle strictement positive, l'équation $X' = AX$ a une solution réelle non bornée sur $\mathbb{R}_{+}$.
  corrige: |
    Six affirmations sont vraies (1, 3, 5, 7, 8, 10) et quatre sont fausses (2, 4, 6, 9).

    **1.** *Vrai.* C'est la proposition 5 : l'application $x \mapsto x(t_{0})$ est injective sur l'espace des solutions.

    **2.** *Faux.* L'équation n'est pas normalisée en $0$ ; comme à l'exercice 38, les solutions sont $c_{1}t^{2}$ pour $t \geqslant 0$ et $c_{2}t^{2}$ pour $t < 0$, et l'espace est de dimension $2$.

    **3.** *Vrai.* C'est le théorème 3 (iii).

    **4.** *Faux.* Avec $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$, on a $\exp(A) = I_{2} + A$ et $\exp(B) = I_{2} + B$, et 
    $$(I_{2} + A)(I_{2} + B) = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix} \neq \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix} = (I_{2} + B)(I_{2} + A).$$

    **5.** *Vrai.* $\exp(A)\exp(-A) = \exp(0) = I_{n}$, puisque $A$ et $-A$ commutent.

    **6.** *Faux.* La matrice $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ a pour seule valeur propre $0$, et $X(t) = (t, 1)$ est une solution non bornée.

    **7.** *Vrai.* La proposition 10 donne $W' = 0$, le coefficient de $y'$ étant nul.

    **8.** *Vrai.* C'est le théorème 2, par la proposition 3.

    **9.** *Faux.* Si $x$ était une solution sur $\mathbb{R}$, on aurait $x' = x^{2} \geqslant 0$, donc $x \geqslant 1$ sur $\mathbb{R}_{+}$, puis $\big(-\dfrac{1}{x}\big)' = 1$, d'où $x(t) = \dfrac{1}{1 - t}$ sur $[0, 1[$, qui tend vers $+\infty$ en $1^{-}$ : contradiction. L'équation n'est pas linéaire, et le théorème 1 ne s'applique pas.

    **10.** *Vrai.* Soit $\lambda$ une telle valeur propre et $V$ un vecteur propre. La solution complexe $Z(t) = \mathrm{e}^{\lambda t}V$ a pour parties réelle et imaginaire deux solutions réelles, et $\lVert Z(t) \rVert = \mathrm{e}^{t\Re\lambda}\lVert V \rVert \to +\infty$ : l'une des deux n'est pas bornée.
- id: "mp-16-44"
  feuille: "f-mp-16"
