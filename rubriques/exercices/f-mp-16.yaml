  enonce: |
    Résoudre sur $\mathbb{R}$ le système du second ordre $\begin{cases} x'' = x' + y' - y, \\ y'' = x' + y' - x, \end{cases}$ en introduisant $u = x + y$ et $v = x - y$.
  corrige: |
    Le changement de fonctions inconnues découple le système en deux équations scalaires à coefficients constants.

    En ajoutant et en retranchant les deux équations, on obtient $u'' = 2u' - u$ et $v'' = x - y = v$. Réciproquement, si $u$ et $v$ vérifient ces équations, $x = \dfrac{u + v}{2}$ et $y = \dfrac{u - v}{2}$ vérifient le système, qui est donc équivalent. On trouve $u = (a + bt)\mathrm{e}^{t}$ et $v = c\,\mathrm{e}^{t} + d\,\mathrm{e}^{-t}$. 
    $$\boxed{x(t) = \frac{(a + c + bt)\mathrm{e}^{t} + d\,\mathrm{e}^{-t}}{2}, \qquad y(t) = \frac{(a - c + bt)\mathrm{e}^{t} - d\,\mathrm{e}^{-t}}{2}, \quad (a, b, c, d) \in \mathbb{R}^{4}}$$
     L'espace des solutions est de dimension $4$ : le système est équivalent à un système du premier ordre en $(x, y, x', y')$ (proposition 3).
- id: "mp-16-22"
  feuille: "f-mp-16"
  numero: 22
  partie: "Systèmes différentiels linéaires à coefficients constants"
  etoiles: 2
  types: [Calcul]
  mots_cles: [systèmes à coefficients constants, système différentiel]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo]
  source: "BibM@th, Équations différentielles, exercice 38"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Un système à coefficients variables.* On considère le système $X' = A(t)X$, où 
    $$A(t) = \begin{pmatrix} 2 - t & t - 1 \\ 2(1 - t) & 2t - 1 \end{pmatrix}.$$

    **1.** Écrire $A(t) = B + tC$, avec $B$ et $C$ constantes, et vérifier que $B$ et $C$ commutent.

    **2.** Trouver une matrice inversible $P$, indépendante de $t$, telle que $P^{-1}A(t)P$ soit diagonale pour tout $t$.

    **3.** En déduire les solutions du système.
  corrige: |
    Les coefficients ne sont pas constants, mais les matrices $A(t)$ ont une base propre commune et fixe : le système se découple.

    **1.** On a $B = \begin{pmatrix} 2 & -1 \\ 2 & -1 \end{pmatrix}$ et $C = \begin{pmatrix} -1 & 1 \\ -2 & 2 \end{pmatrix}$, et le calcul donne $BC = CB = 0$ : en particulier, $B$ et $C$ commutent.

    **2.** On vérifie que $A(t)\,(1, 1) = (1, 1)$ et $A(t)\,(1, 2) = t\,(1, 2)$ pour tout $t$. 
    $$\boxed{P = \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}, \qquad P^{-1}A(t)P = \begin{pmatrix} 1 & 0 \\ 0 & t \end{pmatrix}}$$

    **3.** Avec $X = PY$ et $P$ constante, $Y' = P^{-1}A(t)PY$, soit $y_{1}' = y_{1}$ et $y_{2}' = ty_{2}$. 
    $$\boxed{X(t) = a\,\mathrm{e}^{t}\begin{pmatrix} 1 \\ 1 \end{pmatrix} + b\,\mathrm{e}^{t^{2}/2}\begin{pmatrix} 1 \\ 2 \end{pmatrix}, \quad (a, b) \in \mathbb{R}^{2}}$$
     *Piège.* Pour des coefficients variables, $t \mapsto \exp\big(\mathop{\displaystyle \int_{0}^{t}} A\big)X_{0}$ n'est en général pas solution ; elle l'est ici parce que les $A(t)$ commutent deux à deux.
