  enonce: |
    Déterminer les fonctions $f : \mathbb{R} \to \mathbb{R}$ dérivables telles que $f(s + t) = f(s)f(t)$ pour tous réels $s$ et $t$. On pourra dériver par rapport à $s$.
  corrige: |
    En dérivant la relation fonctionnelle, on obtient une équation différentielle linéaire, dont on connaît les solutions.

    Pour $s = t = 0$, $f(0) = f(0)^{2}$. Si $f(0) = 0$, alors $f(t) = f(0)f(t) = 0$ pour tout $t$. Sinon, $f(0) = 1$, et en dérivant $f(s + t) = f(s)f(t)$ par rapport à $s$, puis en prenant $s = 0$ : $f'(t) = f'(0)f(t)$. Avec $a = f'(0)$ et $f(0) = 1$, le théorème 1 donne $f(t) = \mathrm{e}^{at}$. Réciproquement, ces fonctions conviennent. 
    $$\boxed{f = 0 \quad\text{ou}\quad f : t \mapsto \mathrm{e}^{at}, \ a \in \mathbb{R}}$$
     L'exercice 16 étend ce résultat aux fonctions à valeurs matricielles.
- id: "mp-16-07"
