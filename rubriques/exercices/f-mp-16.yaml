  noeuds: [ed-lineaires]
  notions: [exponentielle-matrice]
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Groupes à un paramètre.* Soit $\varphi : \mathbb{R} \to \mathrm{GL}_{n}(\mathbb{R})$ dérivable telle que $\varphi(s + t) = \varphi(s)\varphi(t)$ pour tous $s$, $t \in \mathbb{R}$.

    **1.** Montrer que $\varphi(0) = I_{n}$.

    **2.** On pose $A = \varphi'(0)$. Montrer que $\varphi$ est solution de l'équation différentielle $X' = AX$ sur $\mathcal{M}_{n}(\mathbb{R})$.

    **3.** En déduire que $\varphi(t) = \exp(tA)$ pour tout $t \in \mathbb{R}$. Comparer avec l'exercice 6.
  corrige: |
    C'est la version matricielle de l'exercice 6 : la relation fonctionnelle fournit une équation différentielle linéaire à coefficients constants.

    **1.** On a $\varphi(0) = \varphi(0)^{2}$, et $\varphi(0)$ est inversible : en multipliant par $\varphi(0)^{-1}$, $\varphi(0) = I_{n}$.

    **2.** En dérivant $\varphi(s + t) = \varphi(s)\varphi(t)$ par rapport à $s$, puis en prenant $s = 0$ : 
    $$\boxed{\varphi'(t) = A\varphi(t), \qquad A = \varphi'(0)}$$

    **3.** La fonction $t \mapsto \exp(tA)$ vérifie la même équation sur $\mathcal{M}_{n}(\mathbb{R})$ et la même condition initiale $I_{n}$ (théorème 3) ; le théorème 1 donne : 
    $$\boxed{\varphi(t) = \exp(tA)}$$
     Pour $n = 1$, on retrouve l'exercice 6, avec $f(0) \neq 0$. Les applications $t \mapsto \exp(tA)$ sont les « groupes à un paramètre » de matrices ; par exemple, les rotations $t \mapsto \begin{pmatrix} \cos t & -\sin t \\ \sin t & \cos t \end{pmatrix}$ correspondent à $A = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$.
