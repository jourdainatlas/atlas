  notions: []
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Perspective : le théorème de Cauchy-Lipschitz global.* Soit $f : I \times E \to E$ continue, et $k > 0$ tel que $\lVert f(t, x) - f(t, y) \rVert \leqslant k\lVert x - y \rVert$ pour tous $t \in I$, $x$, $y \in E$. Soit $t_{0} \in I$, $x_{0} \in E$, et $J = [\alpha, \beta]$ un segment de $I$ contenant $t_{0}$.

    **1.** On définit sur $J$ une suite de fonctions par $x_{0}(t) = x_{0}$ et 
    $$x_{m + 1}(t) = x_{0} + \int_{t_{0}}^{t} f\big(s, x_{m}(s)\big)\,\mathrm{d} s.$$
     Montrer que $\lVert x_{m + 1}(t) - x_{m}(t) \rVert \leqslant C\dfrac{k^{m}|t - t_{0}|^{m}}{m!}$ pour une constante $C$ à préciser.

    **2.** En déduire l'existence d'une solution sur $J$ du problème $x' = f(t, x)$, $x(t_{0}) = x_{0}$, puis son unicité.

    **3.** Montrer que le problème a une unique solution sur $I$.

    **4.** Pourquoi la démonstration ne s'applique-t-elle pas à $x' = x^{2}$ ? Montrer en revanche qu'elle s'applique à $x' = \sin(x) + t$, et que la solution est alors définie sur $\mathbb{R}$.
  corrige: |
    C'est la démonstration du théorème 1 par approximations successives, où l'hypothèse de linéarité est remplacée par la seule inégalité de Lipschitz.

    **1.** Soit $M = \mathop{\displaystyle \sup_{s \in J}} \lVert f(s, x_{0}) \rVert$ et $C = M(\beta - \alpha)$. Pour $m = 0$, $\lVert x_{1}(t) - x_{0} \rVert \leqslant M|t - t_{0}| \leqslant C$. Si l'inégalité est vraie au rang $m$, alors 
    $$\lVert x_{m + 2}(t) - x_{m + 1}(t) \rVert \leqslant \Big|\int_{t_{0}}^{t} k\lVert x_{m + 1}(s) - x_{m}(s) \rVert\,\mathrm{d} s\Big| \leqslant Ck^{m + 1}\Big|\int_{t_{0}}^{t} \frac{|s - t_{0}|^{m}}{m!}\,\mathrm{d} s\Big| = C\frac{k^{m + 1}|t - t_{0}|^{m + 1}}{(m + 1)!}.$$

    $$\boxed{\lVert x_{m + 1}(t) - x_{m}(t) \rVert \leqslant C\frac{k^{m}|t - t_{0}|^{m}}{m!}, \qquad C = (\beta - \alpha)\sup_{J} \lVert f(\cdot, x_{0}) \rVert}$$

    **2.** On établit l'existence, puis l'unicité.

    Existence. La série de terme général $x_{m + 1} - x_{m}$ converge normalement sur $J$, puisque 
    $$\lVert x_{m + 1} - x_{m} \rVert_{\infty} \leqslant C\frac{\big(k(\beta - \alpha)\big)^{m}}{m!} ;$$
     la suite $(x_{m})$ converge donc uniformément vers une fonction continue $x$ (chapitre 8). L'inégalité de Lipschitz donne $\lVert f(s, x_{m}(s)) - f(s, x(s)) \rVert \leqslant k\lVert x_{m} - x \rVert_{\infty}$ pour tout $s \in J$, ce qui permet de passer à la limite sous l'intégrale : 
    $$x(t) = x_{0} + \int_{t_{0}}^{t} f\big(s, x(s)\big)\,\mathrm{d} s,$$
     donc $x$ est de classe $\mathcal{C}^{1}$ et solution.

    Unicité. Si $x$ et $y$ sont deux solutions, $d = \lVert x - y \rVert$ vérifie $d(t) \leqslant k\mathop{\displaystyle \int_{t_{0}}^{t}} d$ pour $t \geqslant t_{0}$, et le lemme de Grönwall (exercice 12, avec $A = 0$) donne $d = 0$ ; de même pour $t \leqslant t_{0}$. 
    $$\boxed{\text{le problème a une unique solution sur } J}$$

    **3.** L'intervalle $I$ est réunion d'une suite croissante de segments $J_{p}$ contenant $t_{0}$. Les solutions sur $J_{p}$ et $J_{p + 1}$ coïncident sur $J_{p}$, par unicité ; elles définissent une fonction sur $I$, qui est solution, et qui est unique, puisque sa restriction à chaque $J_{p}$ l'est.

    **4.** Pour $f(t, x) = x^{2}$, $|x^{2} - y^{2}| = |x + y|\,|x - y|$, et aucune constante $k$ ne convient sur $\mathbb{R}$ : d'ailleurs, l'exercice 43 montre qu'une solution peut exploser en temps fini. Pour $f(t, x) = \sin(x) + t$, l'inégalité des accroissements finis donne $|\sin x - \sin y| \leqslant |x - y|$, et $f$ est continue sur $\mathbb{R} \times \mathbb{R}$. 
    $$\boxed{x' = \sin(x) + t \text{ a, pour toute condition initiale, une unique solution définie sur } \mathbb{R}}$$
- id: "mp-16-46"
  feuille: "f-mp-16"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [synthèse, réduction]
  noeuds: [rd-diagonalisable]
  notions: [valeur-propre]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Perspective : équations à coefficients périodiques.* Soit $T > 0$ et $q : \mathbb{R} \to \mathbb{R}$ continue et $T$-périodique. On considère l'équation de Hill $y'' + q(t)y = 0$, et l'on note $y_{1}$, $y_{2}$ les solutions telles que $\big(y_{1}(0), y_{1}'(0)\big) = (1, 0)$ et $\big(y_{2}(0), y_{2}'(0)\big) = (0, 1)$.

    **1.** Montrer que si $y$ est solution, $t \mapsto y(t + T)$ l'est aussi. En déduire que, pour toute solution $y$, 
    $$\begin{pmatrix} y(T) \\ y'(T) \end{pmatrix} = M\begin{pmatrix} y(0) \\ y'(0) \end{pmatrix}, \qquad M = \begin{pmatrix} y_{1}(T) & y_{2}(T) \\ y_{1}'(T) & y_{2}'(T) \end{pmatrix},$$
     et plus généralement, en notant $\Phi(t) = \begin{pmatrix} y_{1}(t) & y_{2}(t) \\ y_{1}'(t) & y_{2}'(t) \end{pmatrix}$, 
    $$\forall t \in \mathbb{R}, \ \forall n \in \mathbb{Z}, \qquad \begin{pmatrix} y(t + nT) \\ y'(t + nT) \end{pmatrix} = \Phi(t)M^{n}\begin{pmatrix} y(0) \\ y'(0) \end{pmatrix}.$$

    **2.** Montrer que $\det M = 1$. On note $\Delta = \operatorname{tr} M$.

    **3.** On suppose $|\Delta| < 2$. Montrer que $M$ a deux valeurs propres complexes conjuguées de module $1$, distinctes, et en déduire que toutes les solutions sont bornées sur $\mathbb{R}$.

    **4.** On suppose $|\Delta| > 2$. Montrer que $M$ a une valeur propre réelle $\rho$ telle que $|\rho| > 1$, et qu'il existe une solution non nulle vérifiant $y(t + T) = \rho\,y(t)$ pour tout $t$. En déduire l'existence de solutions non bornées sur $\mathbb{R}_{+}$.

    **5.** On suppose $q$ constante, égale à $\omega^{2} > 0$. Calculer $\Delta$, et retrouver le comportement des solutions. Que se passe-t-il lorsque $\omega T \in \pi\mathbb{Z}$ ?
  corrige: |
    La matrice de monodromie $M$ résume l'effet d'une période sur les conditions initiales ; son déterminant vaut $1$, et sa trace décide de la stabilité.

    **1.** Si $y$ est solution, $z(t) = y(t + T)$ vérifie $z'' + q(t)z = y''(t + T) + q(t + T)y(t + T) = 0$. Toute solution s'écrit $y = y(0)y_{1} + y'(0)y_{2}$ (proposition 4), soit, avec $Y(t) = (y(t), y'(t))$, $Y(t) = \Phi(t)Y(0)$. En particulier $Y(T) = MY(0)$, et, appliqué à $z$ : 
    $$Y(t + T) = Z(t) = \Phi(t)Z(0) = \Phi(t)Y(T).$$
     Pour $t = T$, $Y(2T) = MY(T)$, et par récurrence $Y(nT) = M^{n}Y(0)$ pour $n \in \mathbb{N}$. Le même argument, appliqué à la solution $t \mapsto y(t + nT)$, donne $Y(t + nT) = \Phi(t)Y(nT)$. Enfin $M$ est inversible (question 2), et $Y(0) = M^{|n|}Y(nT)$ pour $n < 0$. 
    $$\boxed{\forall t \in \mathbb{R}, \ \forall n \in \mathbb{Z}, \quad Y(t + nT) = \Phi(t)M^{n}Y(0)}$$

    **2.** On a $\det M = W(T)$, et la proposition 10, sans terme en $y'$, donne $W(T) = W(0) = \det I_{2}$. 
    $$\boxed{\det M = 1, \qquad \chi_{M} = X^{2} - \Delta X + 1}$$

    **3.** Si $|\Delta| < 2$, le discriminant $\Delta^{2} - 4$ est strictement négatif : les racines sont complexes conjuguées, distinctes, de produit $1$, donc de la forme $\mathrm{e}^{\pm\mathrm{i}\theta}$ avec $\theta \in ]0, \pi[$. La matrice $M$ est diagonalisable dans $\mathcal{M}_{2}(\mathbb{C})$, $M = P\,\mathrm{diag}(\mathrm{e}^{\mathrm{i}\theta}, \mathrm{e}^{-\mathrm{i}\theta})P^{-1}$, donc $\lVert M^{n} \rVert \leqslant \lVert P \rVert\,\lVert P^{-1} \rVert$ pour tout $n \in \mathbb{Z}$. Tout $t \in \mathbb{R}$ s'écrit $s + nT$ avec $s \in [0, T[$, et $\Phi$ est bornée sur $[0, T]$. 
    $$\boxed{|\Delta| < 2 \implies \text{toutes les solutions sont bornées sur } \mathbb{R}}$$

    **4.** Si $|\Delta| > 2$, les racines sont réelles, distinctes, de produit $1$ : l'une, $\rho$, vérifie $|\rho| > 1$. Soit $V$ un vecteur propre réel et $y$ la solution telle que $Y(0) = V$. La solution $z(t) = y(t + T)$ vérifie $Z(0) = MV = \rho V$, donc $z = \rho y$ par la proposition 4. Si $y(t_{0}) \neq 0$, alors $y(t_{0} + nT) = \rho^{n}y(t_{0})$ n'est pas bornée. 
    $$\boxed{|\Delta| > 2 \implies \text{il existe des solutions non bornées sur } \mathbb{R}_{+}}$$

    **5.** Pour $q = \omega^{2}$, $y_{1} = \cos(\omega t)$ et $y_{2} = \dfrac{\sin(\omega t)}{\omega}$, d'où 
    $$M = \begin{pmatrix} \cos(\omega T) & \frac{\sin(\omega T)}{\omega} \\ -\omega\sin(\omega T) & \cos(\omega T) \end{pmatrix}, \qquad \boxed{\Delta = 2\cos(\omega T)}$$
     On a toujours $|\Delta| \leqslant 2$, et les solutions sont bornées, comme on le savait. Si $\omega T \in \pi\mathbb{Z}$, alors $|\Delta| = 2$, cas non couvert par les questions 3 et 4 : ici $M = \pm I_{2}$, et toutes les solutions sont $T$-périodiques ou changent de signe après une période. Pour un $q$ non constant, $|\Delta| = 2$ peut aussi donner une matrice $M$ non diagonalisable et des solutions à croissance linéaire.
- id: "mp-16-47"
  feuille: "f-mp-16"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [synthèse, exponentielle de matrice]
  noeuds: [ed-lineaires]
  notions: [exponentielle-matrice]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Perspective : la formule de Trotter.* On munit $\mathcal{M}_{n}(\mathbb{K})$ d'une norme sous-multiplicative $\lVert \cdot \rVert$ telle que $\lVert I_{n} \rVert = 1$, et l'on se donne $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$, de normes $a$ et $b$. L'objectif est de montrer que $\Big(\exp\big(\tfrac{A}{p}\big)\exp\big(\tfrac{B}{p}\big)\Big)^{p} \to \exp(A + B)$ quand $p \to +\infty$, même si $A$ et $B$ ne commutent pas.

    **1.** Montrer que, pour tout $X \in \mathcal{M}_{n}(\mathbb{K})$, $\lVert \exp(X) - I_{n} - X \rVert \leqslant \dfrac{\lVert X \rVert^{2}}{2}\mathrm{e}^{\lVert X \rVert}$, et $\lVert \exp(X) \rVert \leqslant \mathrm{e}^{\lVert X \rVert}$.

    **2.** On pose $U_{p} = \exp\big(\tfrac{A}{p}\big)\exp\big(\tfrac{B}{p}\big)$ et $V_{p} = \exp\big(\tfrac{A + B}{p}\big)$. Montrer qu'il existe une constante $C$, indépendante de $p$, telle que $\lVert U_{p} - V_{p} \rVert \leqslant \dfrac{C}{p^{2}}$.

    **3.** Montrer que, pour toutes matrices $U$, $V$ et tout $p \in \mathbb{N}^{*}$, 
    $$U^{p} - V^{p} = \sum_{k = 0}^{p - 1} U^{k}(U - V)V^{p - 1 - k},$$
     et en déduire que $\lVert U_{p}^{p} - V_{p}^{p} \rVert \leqslant p\,\mathrm{e}^{a + b}\lVert U_{p} - V_{p} \rVert$.

    **4.** Conclure. Que donne la formule lorsque $A$ et $B$ commutent ?

    **5.** Pour $A = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix}$, calculer $U_{p}$, puis vérifier numériquement, pour quelques valeurs de $p$, que $U_{p}^{p}$ s'approche de $\exp(A + B)$, calculé dans le cours.
  corrige: |
    On compare les produits $U_{p}^{p}$ et $V_{p}^{p} = \exp(A + B)$ terme à terme, grâce à une identité télescopique.

    **1.** Pour $k \geqslant 2$, $k! = k(k - 1)\,(k - 2)! \geqslant 2(k - 2)!$, donc 
    $$\lVert \exp(X) - I_{n} - X \rVert \leqslant \sum_{k \geqslant 2} \frac{\lVert X \rVert^{k}}{k!} \leqslant \frac{\lVert X \rVert^{2}}{2}\sum_{k \geqslant 2} \frac{\lVert X \rVert^{k - 2}}{(k - 2)!} = \frac{\lVert X \rVert^{2}}{2}\mathrm{e}^{\lVert X \rVert},$$
     et de même $\lVert \exp(X) \rVert \leqslant \mathop{\displaystyle \sum} \dfrac{\lVert X \rVert^{k}}{k!} = \mathrm{e}^{\lVert X \rVert}$.

    **2.** On écrit $\exp\big(\dfrac{A}{p}\big) = I_{n} + \dfrac{A}{p} + R_{1}$, $\exp\big(\dfrac{B}{p}\big) = I_{n} + \dfrac{B}{p} + R_{2}$ et $V_{p} = I_{n} + \dfrac{A + B}{p} + R_{3}$. En développant, 
    $$U_{p} - V_{p} = \frac{AB}{p^{2}} + R_{2} + \frac{A}{p}R_{2} + R_{1}\exp\Big(\frac{B}{p}\Big) - R_{3},$$
     et, pour $p \geqslant 1$, la question 1 donne $\lVert R_{1} \rVert \leqslant \dfrac{a^{2}\mathrm{e}^{a}}{2p^{2}}$, $\lVert R_{2} \rVert \leqslant \dfrac{b^{2}\mathrm{e}^{b}}{2p^{2}}$, $\lVert R_{3} \rVert \leqslant \dfrac{(a + b)^{2}\mathrm{e}^{a + b}}{2p^{2}}$. 
    $$\boxed{\lVert U_{p} - V_{p} \rVert \leqslant \frac{C}{p^{2}}, \qquad C = ab + \frac{(1 + a)b^{2}\mathrm{e}^{b} + a^{2}\mathrm{e}^{a + b} + (a + b)^{2}\mathrm{e}^{a + b}}{2}}$$

    **3.** La somme est télescopique : $\mathop{\displaystyle \sum_{k = 0}^{p - 1}} \big(U^{k + 1}V^{p - 1 - k} - U^{k}V^{p - k}\big) = U^{p} - V^{p}$. Comme $\lVert U_{p} \rVert$ et $\lVert V_{p} \rVert$ sont majorées par $\mathrm{e}^{(a + b)/p}$, chaque terme est majoré par $\mathrm{e}^{(a + b)(p - 1)/p}\lVert U_{p} - V_{p} \rVert \leqslant \mathrm{e}^{a + b}\lVert U_{p} - V_{p} \rVert$. 
    $$\boxed{\lVert U_{p}^{p} - V_{p}^{p} \rVert \leqslant p\,\mathrm{e}^{a + b}\lVert U_{p} - V_{p} \rVert}$$

    **4.** On a $V_{p}^{p} = \exp(A + B)$ par le théorème 3 (iii), et $\lVert U_{p}^{p} - \exp(A + B) \rVert \leqslant \dfrac{C\mathrm{e}^{a + b}}{p} \to 0$. 
    $$\boxed{\Big(\exp\Big(\frac{A}{p}\Big)\exp\Big(\frac{B}{p}\Big)\Big)^{p} \xrightarrow[p \to +\infty]{} \exp(A + B)}$$
     Si $A$ et $B$ commutent, $U_{p} = V_{p}$, la suite est constante, et l'on retrouve $\exp(A)\exp(B) = \exp(A + B)$.

    **5.** Comme $A^{2} = B^{2} = 0$, on a 
    $$U_{p} = \Big(I_{2} + \frac{A}{p}\Big)\Big(I_{2} + \frac{B}{p}\Big) = \begin{pmatrix} 1 + \frac{1}{p^{2}} & \frac{1}{p} \\ \frac{1}{p} & 1 \end{pmatrix},$$
     et $\exp(A + B) = \operatorname{ch}(1)\,I_{2} + \operatorname{sh}(1)\,(A + B)$, puisque $(A + B)^{2} = I_{2}$. Le calcul numérique donne :

    $$\begin{array}{c|c}  p & U_{p}^{p} \\ \hline 10 & \begin{pmatrix} 1{,}6012 & 1{,}1731 \\ 1{,}1731 & 1{,}4839 \end{pmatrix} \\  100 & \begin{pmatrix} 1{,}5490 & 1{,}1752 \\ 1{,}1752 & 1{,}5372 \end{pmatrix} \\  1000 & \begin{pmatrix} 1{,}5437 & 1{,}1752 \\ 1{,}1752 & 1{,}5425 \end{pmatrix} \\ \hline \text{limite} & \begin{pmatrix} \operatorname{ch} 1 & \operatorname{sh} 1 \\ \operatorname{sh} 1 & \operatorname{ch} 1 \end{pmatrix} \approx \begin{pmatrix} 1{,}5431 & 1{,}1752 \\ 1{,}1752 & 1{,}5431 \end{pmatrix} \end{array}$$

    L'erreur sur la diagonale décroît comme $\dfrac{1}{p}$, conformément à la majoration de la question 4. La formule de Trotter est à la base des méthodes numériques « de séparation » : on approche l'évolution sous $A + B$ en alternant de petits pas sous $A$ et sous $B$.

