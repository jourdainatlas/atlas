  page_corrige: 10
  enonce: |
    Résoudre sur $\mathbb{R}$ l'équation $(1 + x^{2})y'' + xy' - y = 0$ en posant $x = \operatorname{sh} t$, c'est-à-dire en étudiant $z(t) = y(\operatorname{sh} t)$.
  corrige: |
    Le changement de variable $x = \operatorname{sh} t$ transforme l'équation en une équation à coefficients constants.

    L'application $\operatorname{sh}$ est une bijection de classe $\mathcal{C}^{\infty}$ de $\mathbb{R}$ sur $\mathbb{R}$, de réciproque de classe $\mathcal{C}^{\infty}$. Avec $z(t) = y(\operatorname{sh} t)$, on a $z' = \operatorname{ch} t\,y'(\operatorname{sh} t)$ et $z'' = \operatorname{sh} t\,y'(\operatorname{sh} t) + \operatorname{ch}^{2}t\,y''(\operatorname{sh} t)$, d'où, avec $x = \operatorname{sh} t$ et $\operatorname{ch}^{2}t = 1 + x^{2}$, 
    $$z'' - z = (1 + x^{2})y''(x) + xy'(x) - y(x).$$
     Ainsi $y$ est solution si et seulement si $z'' = z$, c'est-à-dire $z = a\mathrm{e}^{t} + b\mathrm{e}^{-t}$. Comme $\mathrm{e}^{t} = x + \sqrt{1 + x^{2}}$ et $\mathrm{e}^{-t} = \sqrt{1 + x^{2}} - x$ : 
    $$\boxed{y(x) = \alpha x + \beta\sqrt{1 + x^{2}}, \quad (\alpha, \beta) \in \mathbb{R}^{2}}$$
     On vérifie directement que $x \mapsto x$ et $x \mapsto \sqrt{1 + x^{2}}$ sont solutions.
- id: "mp-16-28"
