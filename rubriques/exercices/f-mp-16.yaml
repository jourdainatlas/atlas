  page_corrige: 3
  enonce: |
    *La sous-tangente.* Soit $f : \mathbb{R} \to \mathbb{R}$ dérivable, dont la dérivée ne s'annule pas, et $\mathcal{C}$ sa courbe représentative dans un repère orthonormé. Pour un point $M$ de $\mathcal{C}$, on note $T$ le point d'intersection de la tangente en $M$ avec l'axe des abscisses, et $P$ le projeté orthogonal de $M$ sur cet axe. Déterminer les fonctions $f$ pour lesquelles le vecteur $\overrightarrow{TP}$ est le même en tout point de $\mathcal{C}$.
  corrige: |
    La condition géométrique se traduit par une équation différentielle linéaire homogène du premier ordre.

    La tangente en $M = (x, f(x))$ coupe l'axe des abscisses au point $T$ d'abscisse $x - \dfrac{f(x)}{f'(x)}$, et $P$ a pour abscisse $x$ : $\overrightarrow{TP} = \big(\dfrac{f(x)}{f'(x)}, 0\big)$. Il est constant, égal à $(k, 0)$, si et seulement si $f = kf'$. Comme $f'$ ne s'annule pas, $k \neq 0$ (sinon $f = 0$ et $f' = 0$), et $f' = \dfrac{1}{k}f$. 
    $$\boxed{f(x) = C\,\mathrm{e}^{x/k}, \quad C \neq 0, \ k \neq 0}$$
     Les exponentielles sont les seules courbes de sous-tangente constante, égale à l'inverse de leur « taux de croissance ».
