  page_corrige: 2
  enonce: |
    *Dissolution d'un composé chimique.* La vitesse de dissolution d'un composé chimique dans l'eau est proportionnelle à la quantité restante. On place $20$ grammes de ce composé dans l'eau, et l'on constate qu'il en reste $10$ grammes au bout de $5$ minutes. Combien de temps faut-il encore attendre pour qu'il n'en reste plus qu'un gramme ?
  corrige: |
    La quantité restante $m(t)$ vérifie $m' = -km$ : c'est une décroissance exponentielle, caractérisée par sa demi-vie.

    On a $m(t) = 20\,\mathrm{e}^{-kt}$, et $m(5) = 10$ donne $k = \dfrac{\ln 2}{5}$ : la quantité est divisée par deux toutes les $5$ minutes. On a $m(t) = 1$ pour $t = \dfrac{5\ln 20}{\ln 2} \approx 21{,}6$ minutes. 
    $$\boxed{\text{il faut encore attendre environ } 16{,}6 \text{ minutes}}$$
- id: "mp-16-05"
