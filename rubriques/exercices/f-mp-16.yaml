  enonce: |
    *Une équation d'Euler.* On cherche les solutions sur $]0, +\infty[$ de $x^{2}y'' - 3xy' + 4y = 0$.

    **1.** Soit $y$ une solution, et $z(t) = y(\mathrm{e}^{t})$ pour $t \in \mathbb{R}$. Montrer que $z$ est solution d'une équation linéaire du second ordre à coefficients constants.

    **2.** En déduire les solutions de l'équation, et vérifier le résultat par la proposition 10 du cours.
  corrige: |
    Pour une équation d'Euler, le changement de variable $x = \mathrm{e}^{t}$ rend les coefficients constants.

    **1.** On a $z'(t) = \mathrm{e}^{t}y'(\mathrm{e}^{t})$ et $z''(t) = \mathrm{e}^{t}y'(\mathrm{e}^{t}) + \mathrm{e}^{2t}y''(\mathrm{e}^{t})$, d'où $x^{2}y''(x) = z'' - z'$ et $xy'(x) = z'$ avec $x = \mathrm{e}^{t}$. L'équation devient 
    $$\boxed{z'' - 4z' + 4z = 0}$$

    **2.** On obtient $z(t) = (a + bt)\mathrm{e}^{2t}$, et, $\exp$ étant une bijection de $\mathbb{R}$ sur $]0, +\infty[$, les solutions sont : 
    $$\boxed{y(x) = x^{2}(a + b\ln x), \quad (a, b) \in \mathbb{R}^{2}}$$
     Sous forme normalisée, $y'' - \dfrac{3}{x}y' + \dfrac{4}{x^{2}}y = 0$, et la proposition 10 prévoit $W(x) = Cx^{3}$ ; on trouve en effet $W(x^{2}, x^{2}\ln x) = x^{2}(2x\ln x + x) - 2x\cdot x^{2}\ln x = x^{3}$.
