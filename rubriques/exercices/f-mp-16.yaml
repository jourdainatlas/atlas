  enonce: |
    Déterminer les fonctions $f$ continues sur $\mathbb{R}$ telles que 
    $$\forall x \in \mathbb{R}, \qquad f(x) - \int_{0}^{x} t f(t)\,\mathrm{d} t = 1.$$
  corrige: |
    Une équation intégrale se ramène à un problème de Cauchy : c'est la proposition 2 lue à l'envers.

    Si $f$ convient, $f(x) = 1 + \mathop{\displaystyle \int_{0}^{x}} tf(t)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$, avec $f'(x) = xf(x)$ et $f(0) = 1$. Par le théorème 1, $f$ est l'unique solution de ce problème de Cauchy. Réciproquement, $x \mapsto \mathrm{e}^{x^{2}/2}$ vérifie $f' = xf$ et $f(0) = 1$, donc la relation intégrée. 
    $$\boxed{f(x) = \mathrm{e}^{x^{2}/2}}$$
