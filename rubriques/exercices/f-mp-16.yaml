  enonce: |
    Résoudre sur $\mathbb{R}$ le système $\begin{cases} x' = 3x - y + 2, \\ y' = x + y + 2. \end{cases}$ On cherchera d'abord une solution constante.
  corrige: |
    On se ramène à un système homogène en retranchant une solution constante ; la matrice n'est pas diagonalisable, et l'on utilise l'exemple de la section 16.4 du cours.

    Une solution constante vérifie $3x - y = -2$ et $x + y = -2$, d'où $x = y = -1$. La matrice $A = \begin{pmatrix} 3 & -1 \\ 1 & 1 \end{pmatrix}$ est celle de l'exemple du cours : $\exp(tA) = \mathrm{e}^{2t}\begin{pmatrix} 1 + t & -t \\ t & 1 - t \end{pmatrix}$. Par le théorème 2 et le théorème 4 : 
    $$\boxed{\begin{pmatrix} x(t) \\ y(t) \end{pmatrix} = \begin{pmatrix} -1 \\ -1 \end{pmatrix} + \mathrm{e}^{2t}\begin{pmatrix} (1 + t)\alpha - t\beta \\ t\alpha + (1 - t)\beta \end{pmatrix}, \quad (\alpha, \beta) \in \mathbb{R}^{2}}$$
