  page_enonce: 7
  page_corrige: 14
  enonce: |
    On considère l'équation $x^{2}y'' + 4xy' + (2 - x^{2})y = 1$.

    **1.** Résoudre l'équation sur $]0, +\infty[$ et sur $]-\infty, 0[$ en posant $z = x^{2}y$.

    **2.** Montrer qu'elle admet une unique solution sur $\mathbb{R}$, et l'expliciter.
  corrige: |
    Le changement de fonction $z = x^{2}y$ fait apparaître une équation à coefficients constants ; le raccordement en $0$ sélectionne une unique solution.

    **1.** On a $z'' = x^{2}y'' + 4xy' + 2y$, donc l'équation s'écrit $z'' - x^{2}y = 1$, soit $z'' - z = 1$. Ainsi $z = -1 + a\operatorname{ch} x + b\operatorname{sh} x$ sur chaque intervalle. 
    $$\boxed{y(x) = \frac{a\operatorname{ch} x + b\operatorname{sh} x - 1}{x^{2}} \quad\text{sur } ]0, +\infty[ \text{ et sur } ]-\infty, 0[}$$

    **2.** Au voisinage de $0$, $a\operatorname{ch} x + b\operatorname{sh} x - 1 = (a - 1) + bx + O(x^{2})$ : pour que $y$ soit bornée en $0$, il faut $a = 1$ et $b = 0$ de chaque côté. Réciproquement, $\dfrac{\operatorname{ch} x - 1}{x^{2}} = \mathop{\displaystyle \sum_{n \geqslant 0}} \dfrac{x^{2n}}{(2n + 2)!}$ est la somme d'une série entière de rayon infini (chapitre 9), donc de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et l'équation en $0$ s'écrit $2y(0) = 1$, ce qui est vrai. 
    $$\boxed{y(x) = \frac{\operatorname{ch} x - 1}{x^{2}} \ (x \neq 0), \qquad y(0) = \frac{1}{2}}$$
- id: "mp-16-40"
  feuille: "f-mp-16"
  numero: 40
  partie: "Équations non normalisées et séries entières"
