  enonce: |
    Résoudre sur $\mathbb{R}$ le système $\begin{cases} x' = y + z, \\ y' = -x + 2y + z, \\ z' = x + z. \end{cases}$
  corrige: |
    La matrice a trois valeurs propres distinctes : elle est diagonalisable, et la proposition 8 s'applique.

    La matrice $A = \begin{pmatrix} 0 & 1 & 1 \\ -1 & 2 & 1 \\ 1 & 0 & 1 \end{pmatrix}$ a pour polynôme caractéristique $X(X - 1)(X - 2)$, et pour vecteurs propres $(-1, -1, 1)$, $(0, -1, 1)$ et $(1, 1, 1)$. 
    $$\boxed{X(t) = c_{1}\begin{pmatrix} -1 \\ -1 \\ 1 \end{pmatrix} + c_{2}\,\mathrm{e}^{t}\begin{pmatrix} 0 \\ -1 \\ 1 \end{pmatrix} + c_{3}\,\mathrm{e}^{2t}\begin{pmatrix} 1 \\ 1 \\ 1 \end{pmatrix}, \quad (c_{1}, c_{2}, c_{3}) \in \mathbb{R}^{3}}$$
     Les solutions constantes sont celles de $\ker A$ ; les autres s'éloignent de cette droite, les valeurs propres non nulles étant positives.
- id: "mp-16-19"
  feuille: "f-mp-16"
