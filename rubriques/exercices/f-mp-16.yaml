  page_corrige: 6
  enonce: |
    Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$. On suppose que $\exp(tA)\exp(tB) = \exp\big(t(A + B)\big)$ pour tout $t \in \mathbb{R}$. En dérivant deux fois en $t = 0$, montrer que $AB = BA$.
  corrige: |
    On compare les développements limités à l'ordre $2$ en $t = 0$ des deux membres.

    Les deux membres sont de classe $\mathcal{C}^{2}$ (théorème 3), et la formule de Leibniz donne 
    $$\frac{\mathrm{d}^{2}}{\mathrm{d} t^{2}}\Big(\exp(tA)\exp(tB)\Big)\Big|_{t = 0} = A^{2} + 2AB + B^{2},$$

    $$\frac{\mathrm{d}^{2}}{\mathrm{d} t^{2}}\exp\big(t(A + B)\big)\Big|_{t = 0} = (A + B)^{2} = A^{2} + AB + BA + B^{2}.$$
     L'égalité des dérivées secondes donne $2AB = AB + BA$. 
    $$\boxed{AB = BA}$$
     Le théorème 3 (iii) est donc une équivalence, à condition de demander l'égalité pour tout $t$ ; pour $t = 1$ seulement, elle peut avoir lieu sans que $A$ et $B$ commutent.
- id: "mp-16-16"
  feuille: "f-mp-16"
  numero: 16
  partie: "Exponentielle d'un endomorphisme, d'une matrice"
  etoiles: 2
  types: [Démonstration]
