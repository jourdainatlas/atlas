  source: "BibM@th, Équations différentielles, exercices 32 et 33"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $n \geqslant 1$ et $a_{0}$, …, $a_{n - 1} : I \to \mathbb{R}$ continues.

    **1.** Soit $y$ une solution non nulle de $y^{(n)} + a_{n - 1}(t)y^{(n - 1)} + \cdots + a_{0}(t)y = 0$, et $t_{0}$ un zéro de $y$. Pour $n = 1$, montrer que $y$ ne s'annule pas. Pour $n \geqslant 2$, montrer qu'il existe $k \in \llbracket 1\,,n - 1 \rrbracket$ tel que $y^{(k)}(t_{0}) \neq 0$, puis que $t_{0}$ est un zéro isolé de $y$.

    **2.** Soit $f : \mathbb{R} \to \mathbb{R}$ définie par $f(t) = \mathrm{e}^{-1/t^{2}}$ pour $t \neq 0$ et $f(0) = 0$. On admet que $f$ est de classe $\mathcal{C}^{\infty}$ et que toutes ses dérivées sont nulles en $0$. Montrer que $f$ n'est solution d'aucune équation différentielle linéaire homogène à coefficients continus sur $\mathbb{R}$, de la forme précédente.
  corrige: |
    Une solution non nulle ne peut pas avoir toutes ses dérivées d'ordre inférieur à $n$ nulles en un point : c'est l'unicité de la proposition 4.

    **1.** Si $n = 1$, une solution non nulle ne s'annule pas (proposition 5). Si $n \geqslant 2$ et si l'on avait 
    $$y(t_{0}) = y'(t_{0}) = \cdots = y^{(n - 1)}(t_{0}) = 0,$$
     la proposition 4 donnerait $y = 0$ ; il existe donc un plus petit $k \in \llbracket 1\,,n - 1 \rrbracket$ tel que $y^{(k)}(t_{0}) \neq 0$. La formule de Taylor-Young donne $y(t) = \dfrac{y^{(k)}(t_{0})}{k!}(t - t_{0})^{k} + o\big((t - t_{0})^{k}\big)$, qui ne s'annule pas sur un voisinage épointé de $t_{0}$. 
    $$\boxed{\text{les zéros d'une solution non nulle sont isolés}}$$

    **2.** Si $f$ était solution d'une telle équation, ses dérivées d'ordre $0$ à $n - 1$ seraient nulles en $0$, et la proposition 4 donnerait $f = 0$ ; or $f(1) = \mathrm{e}^{-1} \neq 0$. 
    $$\boxed{f \text{ n'est solution d'aucune équation linéaire homogène à coefficients continus}}$$
     La fonction $f$ est pourtant de classe $\mathcal{C}^{\infty}$ : ce sont les solutions des équations linéaires qui sont rigides, pas les fonctions régulières.
- id: "mp-16-11"
  feuille: "f-mp-16"
  numero: 11
