  enonce: |
    *Stabilité.* Soit $A \in \mathcal{M}_{n}(\mathbb{C})$. Montrer que toutes les solutions de $X' = AX$ tendent vers $0$ en $+\infty$ si et seulement si toutes les valeurs propres de $A$ ont une partie réelle strictement négative. On complétera la proposition 9 du cours en étudiant le cas d'une valeur propre de partie réelle nulle.
  corrige: |
    Le sens direct est la proposition 9 (i) du cours ; pour la réciproque, une valeur propre de partie réelle positive ou nulle fournit une solution qui ne tend pas vers $0$.

    Si toutes les valeurs propres ont une partie réelle strictement négative, la proposition 9 (i) conclut. Sinon, soit $\lambda$ une valeur propre telle que $\Re\lambda \geqslant 0$, et $V \neq 0$ un vecteur propre associé : la solution $X(t) = \mathrm{e}^{\lambda t}V$ vérifie $\lVert X(t) \rVert = \mathrm{e}^{t\Re\lambda}\lVert V \rVert \geqslant \lVert V \rVert > 0$, et ne tend pas vers $0$. 
    $$\boxed{\forall X, \ X(t) \xrightarrow[t \to +\infty]{} 0 \iff \forall \lambda \in \operatorname{Sp}(A), \ \Re\lambda < 0}$$
     Si $\Re\lambda = 0$, la solution $\mathrm{e}^{\lambda t}V$ reste bornée sans tendre vers $0$ : c'est le cas du centre du cours.
