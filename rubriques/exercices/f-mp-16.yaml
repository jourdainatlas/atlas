  enonce: |
    *Trajectoires planes.*

    **1.** Montrer, sans les déterminer, que les trajectoires du système 
    $$x' = 4x - 3y + 2z, \qquad y' = 6x - 5y + 4z, \qquad z' = 4x - 4y + 4z$$
     sont contenues dans des plans parallèles. On cherchera une forme linéaire $\ell$ telle que $\ell \circ A = 0$.

    **2.** Généraliser aux systèmes $X' = AX$ avec $A \in \mathcal{M}_{3}(\mathbb{R})$ non inversible.
  corrige: |
    Si une forme linéaire s'annule sur l'image de $A$, sa valeur le long d'une solution a une dérivée nulle.

    **1.** La forme $\ell(x, y, z) = 2x - 2y + z$ vérifie $\ell \circ A = 0$ : la ligne $(2, -2, 1)$ annule $A$ à gauche. Pour une solution $X$, $\big(\ell(X)\big)' = \ell(AX) = 0$. 
    $$\boxed{2x(t) - 2y(t) + z(t) = \text{constante} : \text{ chaque trajectoire est dans un plan parallèle à } \ker\ell}$$

    **2.** Si $A \in \mathcal{M}_{3}(\mathbb{R})$ n'est pas inversible, sa transposée ne l'est pas non plus, et il existe une ligne $L \neq 0$ telle que $LA = 0$. Le même calcul montre que $LX(t)$ est constant : les trajectoires sont planes. On a ici $\chi_{A} = X(X - 1)(X - 2)$, et les trajectoires s'éloignent dans leur plan, puisque les deux autres valeurs propres sont positives.
