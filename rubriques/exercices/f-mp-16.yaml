  notions: [solution-edo]
  source: "Feuille d'exercices #17 (Prost), exercice 21"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $a$, $b : \mathbb{R} \to \mathbb{R}$ continues, et $f$, $g$ deux solutions sur $\mathbb{R}$ de $y' = a(t)y + b(t)$. On suppose qu'il existe $t_{0} \in \mathbb{R}$ tel que $f(t_{0}) < g(t_{0})$. Montrer que $f(t) < g(t)$ pour tout $t \in \mathbb{R}$.
  corrige: |
    La différence de deux solutions est solution de l'équation homogène, et une solution de l'équation homogène du premier ordre ne change pas de signe.

    La fonction $h = g - f$ vérifie $h' = a(t)h$ (proposition 1), donc $h(t) = h(t_{0})\exp\big(\mathop{\displaystyle \int_{t_{0}}^{t}} a\big)$, qui est du signe de $h(t_{0}) > 0$. 
    $$\boxed{\forall t \in \mathbb{R}, \quad f(t) < g(t)}$$
     Deux courbes intégrales distinctes d'une équation scalaire du premier ordre ne se croisent jamais : c'est l'unicité du théorème de Cauchy.
