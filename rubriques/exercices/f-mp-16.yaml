- id: "mp-16-01"
  feuille: "f-mp-16"
  numero: 1
  partie: "Généralités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [généralités]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  source: "Feuille d'exercices #17 (Prost), exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Révisions de première année.* Résoudre les équations différentielles suivantes sur l'intervalle indiqué.

    **1.** $y' + y = \sin t$ sur $\mathbb{R}$.

    **2.** $\cos(t)\,y' + \sin(t)\,y = t$ sur $\big]-\frac{\pi}{2}, \frac{\pi}{2}\big[$.

    **3.** $y' - \cos(t)\,y = \sin(2t)$ sur $\mathbb{R}$.

    **4.** $(1 - t)\,y' + y = t$ sur $]1, +\infty[$.
  corrige: |
    Chaque équation est scalaire du premier ordre : on résout l'équation homogène, puis l'on cherche une solution particulière, par une forme évidente ou par variation de la constante (chapitre 6 de MPSI). Les solutions forment, sur l'intervalle donné, une droite affine (théorème 2).

    **1.** L'équation homogène a pour solutions $t \mapsto C\mathrm{e}^{-t}$, et une solution particulière de la forme $\alpha\cos t + \beta\sin t$ donne $\beta - \alpha = 0$ et $\alpha + \beta = 1$. 
    $$\boxed{y(t) = \frac{\sin t - \cos t}{2} + C\mathrm{e}^{-t}, \quad C \in \mathbb{R}}$$

    **2.** Sur $\big]-\dfrac{\pi}{2}, \dfrac{\pi}{2}\big[$, $\cos t > 0$ et l'équation s'écrit $y' + \tan(t)\,y = \dfrac{t}{\cos t}$ ; les solutions homogènes sont $C\cos t$. En posant $y = C(t)\cos t$, on obtient $C'(t) = \dfrac{t}{\cos^{2}t}$, d'où $C(t) = t\tan t + \ln(\cos t) + K$ par une intégration par parties. 
    $$\boxed{y(t) = t\sin t + \cos(t)\ln(\cos t) + K\cos t, \quad K \in \mathbb{R}}$$

    **3.** Les solutions homogènes sont $C\mathrm{e}^{\sin t}$. On cherche une solution particulière $a\sin t + b$ : l'équation devient $a\cos t - a\sin t\cos t - b\cos t = 2\sin t\cos t$, d'où $a = -2$ et $b = a$. 
    $$\boxed{y(t) = -2\sin t - 2 + C\mathrm{e}^{\sin t}, \quad C \in \mathbb{R}}$$

    **4.** Sur $]1, +\infty[$, l'équation homogène $y' = \dfrac{y}{t - 1}$ a pour solutions $C(t - 1)$. En posant $y = C(t)(t - 1)$, on obtient $C'(t) = -\dfrac{t}{(t - 1)^{2}} = -\dfrac{1}{t - 1} - \dfrac{1}{(t - 1)^{2}}$, d'où $C(t) = -\ln(t - 1) + \dfrac{1}{t - 1} + K$. 
    $$\boxed{y(t) = 1 - (t - 1)\ln(t - 1) + K(t - 1), \quad K \in \mathbb{R}}$$
     Chaque solution a été vérifiée par calcul symbolique.
- id: "mp-16-02"
  feuille: "f-mp-16"
