  page_corrige: 4
  enonce: |
    *Solutions périodiques.* Soit $T > 0$, et $a$, $b : \mathbb{R} \to \mathbb{R}$ continues et $T$-périodiques. On considère l'équation $y' + a(x)y = b(x)$.

    **1.** Montrer que si $\varphi$ est solution, alors $x \mapsto \varphi(x + T)$ l'est aussi. En déduire qu'une solution $\varphi$ est $T$-périodique si et seulement si $\varphi(0) = \varphi(T)$.

    **2.** Montrer que, pour toute solution $\varphi$, la suite $\big(\varphi(nT)\big)_{n \in \mathbb{N}}$ est strictement monotone ou constante. On pourra utiliser l'exercice 7.

    **3.** On suppose $\displaystyle\int_{0}^{T} a \neq 0$. Montrer que l'équation a une unique solution $T$-périodique.
  corrige: |
    La translation de $T$ transforme une solution en une solution ; l'unicité dans le problème de Cauchy ramène la périodicité à une condition en un seul point.

    **1.** La fonction $\psi(x) = \varphi(x + T)$ vérifie, par périodicité de $a$ et $b$, 
    $$\psi'(x) + a(x)\psi(x) = \varphi'(x + T) + a(x + T)\varphi(x + T) = b(x + T) = b(x).$$
     Elle coïncide avec $\varphi$ si et seulement si $\psi(0) = \varphi(0)$, c'est-à-dire $\varphi(T) = \varphi(0)$. 
    $$\boxed{\varphi \text{ est } T\text{-périodique} \iff \varphi(0) = \varphi(T)}$$

    **2.** Si $\varphi(T) > \varphi(0)$, l'exercice 7, appliqué à $\psi$ et $\varphi$, donne $\psi > \varphi$ partout, donc $\varphi\big((n + 1)T\big) > \varphi(nT)$ pour tout $n$. De même si $\varphi(T) < \varphi(0)$, et si $\varphi(T) = \varphi(0)$, la suite est constante. 
    $$\boxed{\big(\varphi(nT)\big)_{n} \text{ est strictement monotone ou constante}}$$

    **3.** Avec $A(x) = \mathop{\displaystyle \int_{0}^{x}} a$, les solutions s'écrivent $\varphi = \varphi_{p} + C\mathrm{e}^{-A}$, et 
    $$\varphi(T) - \varphi(0) = \varphi_{p}(T) - \varphi_{p}(0) + C\big(\mathrm{e}^{-A(T)} - 1\big).$$
     Comme $A(T) \neq 0$, une seule valeur de $C$ annule cette quantité. 
    $$\boxed{\text{si } \int_{0}^{T} a \neq 0, \text{ une unique solution } T\text{-périodique}}$$
     Si $\mathop{\displaystyle \int_{0}^{T}} a = 0$, les solutions homogènes sont toutes périodiques, et il y a soit une infinité, soit aucune solution périodique.
