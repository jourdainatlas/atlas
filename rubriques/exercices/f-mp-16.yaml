  enonce: |
    Résoudre $t^{3}y'' + ty' - y = 0$ sur $]0, +\infty[$, en cherchant une solution polynomiale, puis en appliquant la méthode d'abaissement de l'ordre décrite à la fin de la section 16.6 du cours.
  corrige: |
    On trouve une solution simple, puis une seconde par la formule d'Abel.

    Si $y$ est un polynôme de degré $d \geqslant 2$, le terme $t^{3}y''$ est de degré $d + 1$ et ne peut pas être compensé : $y = at + b$, et l'équation donne $at - at - b = 0$, d'où $b = 0$. Ainsi $y_{1}(t) = t$ est solution. Sous forme normalisée, $a(t) = \dfrac{1}{t^{2}}$, et $W(t) = C\exp\big(\dfrac{1}{t}\big)$. La remarque de la section 16.6 donne $\big(\dfrac{y_{2}}{t}\big)' = \dfrac{\mathrm{e}^{1/t}}{t^{2}}$, d'où $y_{2}(t) = -t\,\mathrm{e}^{1/t}$, au signe près. 
    $$\boxed{y(t) = \alpha t + \beta t\,\mathrm{e}^{1/t}, \quad (\alpha, \beta) \in \mathbb{R}^{2}}$$
     Le calcul symbolique confirme que $t\mathrm{e}^{1/t}$ est solution.
- id: "mp-16-30"
