  enonce: |
    *Problème inverse.* Soit $y_{1}$, $y_{2} : I \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, telles que $w = y_{1}y_{2}' - y_{1}'y_{2}$ ne s'annule pas sur $I$. Montrer qu'il existe un unique couple $(p, q)$ de fonctions continues sur $I$ tel que $y_{1}$ et $y_{2}$ soient solutions de $y'' + p(t)y' + q(t)y = 0$. Comparer avec la remarque qui suit le théorème 5 du cours.
  corrige: |
    Pour chaque $t$, les conditions forment un système linéaire de Cramer en $(p(t), q(t))$, de déterminant $-w(t)$.

    Les conditions s'écrivent, pour tout $t$, 
    $$\begin{pmatrix} y_{1}'(t) & y_{1}(t) \\ y_{2}'(t) & y_{2}(t) \end{pmatrix}\begin{pmatrix} p(t) \\ q(t) \end{pmatrix} = -\begin{pmatrix} y_{1}''(t) \\ y_{2}''(t) \end{pmatrix},$$
     système de déterminant $y_{1}'y_{2} - y_{1}y_{2}' = -w(t) \neq 0$. Il a une unique solution, donnée par les formules de Cramer, qui sont des fonctions continues de $t$. 
    $$\boxed{p = -\frac{y_{1}y_{2}'' - y_{1}''y_{2}}{w}, \qquad q = \frac{y_{1}'y_{2}'' - y_{1}''y_{2}'}{w}}$$
     On retrouve $w' = -pw$, la formule d'Abel. Si $w$ s'annule, comme pour $t^{3}$ et $|t|^{3}$ dans la remarque du cours, il peut n'exister aucune équation dont les deux fonctions soient solutions.
- id: "mp-16-33"
  feuille: "f-mp-16"
  numero: 33
  partie: "Équations scalaires du second ordre"
  etoiles: 2
  types: [Calcul]
  mots_cles: [second ordre]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, derivee-successive]
  source: "Feuille d'exercices #17 (Prost), exercice 26"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f \in \mathcal{C}^{2}(\mathbb{R})$ telle que $f''(x) + f(x) \geqslant 0$ pour tout $x \in \mathbb{R}$.

    **1.** Soit $b : \mathbb{R} \to \mathbb{R}$ continue. Exprimer, à l'aide d'une intégrale, la solution de $y'' + y = b$ telle que $y(x_{0}) = y'(x_{0}) = 0$.

    **2.** En déduire que $f(x + \pi) + f(x) \geqslant 0$ pour tout $x \in \mathbb{R}$.
  corrige: |
    La variation des constantes donne une formule intégrale de la solution, dont le noyau $\sin(x - t)$ est positif sur un intervalle de longueur $\pi$.

    **1.** Avec $y_{1} = \cos$, $y_{2} = \sin$ et $W = 1$, le théorème 6 donne $\lambda_{1}' = -b\sin$ et $\lambda_{2}' = b\cos$ ; en choisissant les primitives nulles en $x_{0}$ : 
    $$\boxed{y(x) = \int_{x_{0}}^{x} \sin(x - t)\,b(t)\,\mathrm{d} t}$$
     qui vérifie bien $y(x_{0}) = y'(x_{0}) = 0$.

    **2.** Soit $x_{0} \in \mathbb{R}$ et $b = f'' + f \geqslant 0$. Par les théorèmes 2 et 4, $f$ est la somme de la solution de la question 1 et de la solution homogène $f(x_{0})\cos(x - x_{0}) + f'(x_{0})\sin(x - x_{0})$. En $x = x_{0} + \pi$ : 
    $$f(x_{0} + \pi) = -f(x_{0}) + \int_{x_{0}}^{x_{0} + \pi} \sin(x_{0} + \pi - t)\,b(t)\,\mathrm{d} t,$$
     et l'intégrande est positive, puisque $x_{0} + \pi - t \in [0, \pi]$. 
    $$\boxed{f(x_{0} + \pi) + f(x_{0}) \geqslant 0}$$
- id: "mp-16-34"
  feuille: "f-mp-16"
