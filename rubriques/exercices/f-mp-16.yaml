  notions: [serie-entiere]
  source: "Feuille d'exercices #17 (Prost), exercice 2"
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Montrer que l'équation $xy' + 2y = \dfrac{x}{x^{2} + 1}$ admet une unique solution $f$ sur $\mathbb{R}$, l'expliciter, et calculer $\displaystyle\int_{0}^{1} f(x)\,\mathrm{d} x$.
  corrige: |
    On résout sur chacun des intervalles où l'équation se normalise, puis l'on étudie le raccordement en $0$, comme dans la section 16.7 du cours.

    Sur $]0, +\infty[$ et sur $]-\infty, 0[$. En multipliant par $x$, l'équation s'écrit $(x^{2}y)' = \dfrac{x^{2}}{x^{2} + 1} = 1 - \dfrac{1}{x^{2} + 1}$, d'où $y(x) = \dfrac{x - \operatorname{Arctan} x + C}{x^{2}}$, avec une constante $C$ sur chaque intervalle.

    Raccordement. Une solution sur $\mathbb{R}$ est continue en $0$, donc bornée au voisinage de $0$ : cela impose $C = 0$ des deux côtés. Réciproquement, $x - \operatorname{Arctan} x = \dfrac{x^{3}}{3} + o(x^{3})$, donc 
    $$f(x) = \frac{x - \operatorname{Arctan} x}{x^{2}} = \frac{x}{3} + o(x)$$
     se prolonge par $f(0) = 0$ en une fonction dérivable en $0$, avec $f'(0) = \dfrac{1}{3}$ ; elle est de classe $\mathcal{C}^{1}$, puisque $f'(x) = \dfrac{1}{x^{2} + 1} - \dfrac{2f(x)}{x} \to 1 - \dfrac{2}{3}$, et l'équation est vérifiée en $0$ ($0 + 0 = 0$). 
    $$\boxed{f(x) = \frac{x - \operatorname{Arctan} x}{x^{2}} \ (x \neq 0), \qquad f(0) = 0}$$

    L'intégrale. On intègre par parties sur $[\varepsilon, 1]$, en primitivant $\dfrac{1}{x^{2}}$ en $-\dfrac{1}{x}$, puis l'on fait tendre $\varepsilon$ vers $0$ ; le crochet tend vers $0$ en $0$, puisque $x - \operatorname{Arctan} x = O(x^{3})$ : 
    $$\int_{0}^{1} \frac{x - \operatorname{Arctan} x}{x^{2}}\,\mathrm{d} x = \Big[-\frac{x - \operatorname{Arctan} x}{x}\Big]_{0}^{1} + \int_{0}^{1} \frac{1}{x}\Big(1 - \frac{1}{1 + x^{2}}\Big)\,\mathrm{d} x = \frac{\pi}{4} - 1 + \int_{0}^{1} \frac{x}{1 + x^{2}}\,\mathrm{d} x.$$

    $$\boxed{\int_{0}^{1} f(x)\,\mathrm{d} x = \frac{\pi}{4} - 1 + \frac{\ln 2}{2} \approx 0{,}13197}$$
     La valeur numérique a été confirmée par quadrature.
- id: "mp-16-38"
  feuille: "f-mp-16"
  numero: 38
  partie: "Équations non normalisées et séries entières"
  etoiles: 2
  types: [Calcul]
  mots_cles: [séries entières, raccordement]
  noeuds: [cx-series-entieres, ed-lineaires]
  notions: [serie-entiere]
  source: "BibM@th, Équations différentielles, exercices 2 et 3"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *Raccordement : tous les cas possibles.* Déterminer les solutions sur $\mathbb{R}$ des équations suivantes, et préciser dans chaque cas la dimension de l'espace des solutions de l'équation homogène associée sur $\mathbb{R}$.

    **1.** $ty' - 2y = t^{3}$.

    **2.** $t^{2}y' - y = 0$. On étudiera la régularité en $0$ de la fonction égale à $\mathrm{e}^{-1/t}$ pour $t > 0$ et à $0$ pour $t \leqslant 0$.

    **3.** $(1 - t)y' - y = t$.
  corrige: |
    Les trois équations s'annulent en un point, et les trois comportements possibles du raccordement apparaissent : trop de solutions, moins de solutions, ou une seule.

    **1.** Sur $]0, +\infty[$ comme sur $]-\infty, 0[$, l'équation s'écrit $\big(\dfrac{y}{t^{2}}\big)' = 1$, d'où $y = t^{3} + ct^{2}$. Les fonctions égales à $t^{3} + c_{1}t^{2}$ pour $t \geqslant 0$ et $t^{3} + c_{2}t^{2}$ pour $t < 0$ sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, de valeur et de dérivée nulles en $0$, et vérifient l'équation en $0$. 
    $$\boxed{y(t) = t^{3} + c_{1}t^{2} \ (t \geqslant 0), \quad t^{3} + c_{2}t^{2} \ (t < 0), \qquad \dim = 2}$$

    **2.** Sur chaque intervalle, $y' = \dfrac{y}{t^{2}}$ donne $y = C\mathrm{e}^{-1/t}$. Quand $t \to 0^{-}$, $\mathrm{e}^{-1/t} \to +\infty$ : il faut $C = 0$ sur $]-\infty, 0[$. Quand $t \to 0^{+}$, $\mathrm{e}^{-1/t}$ et ses dérivées tendent vers $0$, et la fonction $g$ de l'énoncé est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ avec $g'(0) = 0$ ; elle vérifie l'équation en $0$. 
    $$\boxed{y = C\,g, \quad g(t) = \mathrm{e}^{-1/t} \ (t > 0), \quad g(t) = 0 \ (t \leqslant 0), \qquad \dim = 1}$$

    **3.** L'équation s'écrit $\big((1 - t)y\big)' = t$, d'où $(1 - t)y = \dfrac{t^{2}}{2} + C$ sur chacun des deux intervalles $]-\infty, 1[$ et $]1, +\infty[$, avec des constantes a priori différentes. Pour que $y$ ait une limite finie en $1$, il faut $\dfrac{1}{2} + C = 0$ des deux côtés, et alors $y = \dfrac{t^{2} - 1}{2(1 - t)} = -\dfrac{1 + t}{2}$, qui convient sur $\mathbb{R}$. 
    $$\boxed{y(t) = -\frac{1 + t}{2}, \qquad \dim = 0}$$
     *Piège.* Le théorème 2 ne s'applique pas sur un intervalle où le coefficient de $y'$ s'annule : la dimension de l'espace des solutions homogènes peut y valoir $0$, $1$ ou $2$, alors que l'équation est d'ordre $1$.
- id: "mp-16-39"
  feuille: "f-mp-16"
  numero: 39
  partie: "Équations non normalisées et séries entières"
  etoiles: 2
