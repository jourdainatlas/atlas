  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $E$ l'espace des fonctions de classe $\mathcal{C}^{\infty}$ de $\mathbb{R}$ dans $\mathbb{C}$, et $\varphi$ l'endomorphisme de $E$ défini par 
    $$\varphi(f)(t) = f'(t) + tf(t).$$

    **1.** Déterminer les valeurs propres et les sous-espaces propres de $\varphi$.

    **2.** Calculer $\varphi^{2}(f)$, et écrire l'équation $y'' + 2ty' + (t^{2} + 3)y = 0$ sous la forme $P(\varphi)(y) = 0$, avec $P \in \mathbb{C}[X]$.

    **3.** À l'aide du lemme des noyaux (chapitre 3), en déduire les solutions complexes, puis réelles, de cette équation.
  corrige: |
    L'équation est un polynôme en l'endomorphisme $\varphi$, et le lemme des noyaux du chapitre 3 décompose son noyau en sous-espaces propres.

    **1.** On a $\varphi(f) = \lambda f$ si et seulement si $f' + (t - \lambda)f = 0$, c'est-à-dire $f(t) = C\mathrm{e}^{\lambda t - t^{2}/2}$. 
    $$\boxed{\operatorname{Sp}(\varphi) = \mathbb{C}, \qquad E_{\lambda}(\varphi) = \mathbb{C}\,\big(t \mapsto \mathrm{e}^{\lambda t - t^{2}/2}\big)}$$

    **2.** On calcule $\varphi^{2}(f) = (f' + tf)' + t(f' + tf) = f'' + 2tf' + (t^{2} + 1)f$, donc l'équation s'écrit 
    $$\boxed{(\varphi^{2} + 2\,\mathrm{id})(y) = 0, \qquad P = X^{2} + 2 = (X - \mathrm{i}\sqrt{2})(X + \mathrm{i}\sqrt{2})}$$

    **3.** Les deux facteurs sont premiers entre eux, et le lemme des noyaux, valable en dimension quelconque, donne 
    $$\ker P(\varphi) = E_{\mathrm{i}\sqrt{2}}(\varphi) \oplus E_{-\mathrm{i}\sqrt{2}}(\varphi).$$
     Les solutions complexes sont donc $\mathrm{e}^{-t^{2}/2}\big(a\,\mathrm{e}^{\mathrm{i}\sqrt{2}t} + b\,\mathrm{e}^{-\mathrm{i}\sqrt{2}t}\big)$, et les solutions réelles sont leurs parties réelles : 
    $$\boxed{y(t) = \mathrm{e}^{-t^{2}/2}\big(\alpha\cos(\sqrt{2}t) + \beta\sin(\sqrt{2}t)\big), \quad (\alpha, \beta) \in \mathbb{R}^{2}}$$
- id: "mp-16-32"
  feuille: "f-mp-16"
