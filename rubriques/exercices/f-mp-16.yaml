  page_corrige: 3
  enonce: |
    *Solutions impaires.*

    **1.** Soit $a$, $b : \mathbb{R} \to \mathbb{R}$ continues, $a$ impaire et $b$ paire. Montrer que l'équation $y' + a(t)y = b(t)$ admet une unique solution impaire.

    **2.** Soit $a : \mathbb{R} \to \mathbb{R}$ continue et paire. Montrer qu'une solution de $y'' + a(x)y = 0$ est impaire si et seulement si $y(0) = 0$, et paire si et seulement si $y'(0) = 0$.
  corrige: |
    On fabrique une seconde solution par symétrie, puis on la compare à la première grâce à l'unicité du théorème de Cauchy.

    **1.** Si $y$ est solution, $z(t) = -y(-t)$ vérifie $z'(t) = y'(-t)$ et 
    $$z'(t) + a(t)z(t) = y'(-t) + a(-t)y(-t) = b(-t) = b(t),$$
     puisque $a$ est impaire et $b$ paire. Si $y(0) = 0$, alors $z(0) = 0$, et le théorème 1 donne $z = y$ : $y$ est impaire. Réciproquement, une fonction impaire s'annule en $0$. La solution impaire est donc la solution du problème de Cauchy $y(0) = 0$. 
    $$\boxed{\text{une unique solution impaire : celle qui s'annule en } 0}$$

    **2.** Si $y$ est solution, $z(x) = -y(-x)$ et $w(x) = y(-x)$ le sont aussi, puisque $a$ est paire. On a $z(0) = -y(0)$, $z'(0) = y'(0)$, $w(0) = y(0)$ et $w'(0) = -y'(0)$. Par la proposition 4 : 
    $$\boxed{y \text{ impaire} \iff y(0) = 0, \qquad y \text{ paire} \iff y'(0) = 0}$$
     Les solutions de $y'' + a(x)y = 0$ se décomposent en une solution paire et une solution impaire, qui forment une base de $\mathcal{S}_{H}$.
