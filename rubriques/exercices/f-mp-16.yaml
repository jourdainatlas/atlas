  page_enonce: 4
  page_corrige: 8
  enonce: |
    Déterminer les solutions réelles de $X' = AX$, où $A = \begin{pmatrix} 1 & 1 & 0 \\ -1 & 2 & 1 \\ 1 & 0 & 1 \end{pmatrix}$. On commencera par diagonaliser $A$ dans $\mathcal{M}_{3}(\mathbb{C})$.
  corrige: |
    On diagonalise dans $\mathcal{M}_{3}(\mathbb{C})$, puis l'on prend les parties réelle et imaginaire des solutions complexes.

    On trouve $\chi_{A} = (X - 2)(X^{2} - 2X + 2)$, de racines $2$ et $1 \pm \mathrm{i}$, avec les vecteurs propres $(1, 1, 1)$ et $(\pm\mathrm{i}, -1, 1)$. La solution complexe $\mathrm{e}^{(1 + \mathrm{i})t}(\mathrm{i}, -1, 1)$ a pour parties réelle et imaginaire 
    $$\mathrm{e}^{t}\begin{pmatrix} -\sin t \\ -\cos t \\ \cos t \end{pmatrix}, \qquad \mathrm{e}^{t}\begin{pmatrix} \cos t \\ -\sin t \\ \sin t \end{pmatrix}.$$
     Ces trois solutions réelles sont indépendantes, puisque leurs valeurs en $0$ le sont (proposition 5). 
    $$\boxed{X(t) = a\,\mathrm{e}^{2t}\begin{pmatrix} 1 \\ 1 \\ 1 \end{pmatrix} + b\,\mathrm{e}^{t}\begin{pmatrix} -\sin t \\ -\cos t \\ \cos t \end{pmatrix} + c\,\mathrm{e}^{t}\begin{pmatrix} \cos t \\ -\sin t \\ \sin t \end{pmatrix}, \quad (a, b, c) \in \mathbb{R}^{3}}$$
- id: "mp-16-20"
  feuille: "f-mp-16"
  numero: 20
  partie: "Systèmes différentiels linéaires à coefficients constants"
  etoiles: 2
  types: [Calcul]
  mots_cles: [systèmes à coefficients constants, réduction]
  noeuds: [ed-lineaires, rd-diagonalisable]
  notions: [systeme-lineaire-edo, polynome-caracteristique]
  source: "BibM@th, Équations différentielles, exercice 36 (première matrice)"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $A = \begin{pmatrix} 0 & 2 & 2 \\ -1 & 2 & 2 \\ -1 & 1 & 3 \end{pmatrix}$.

    **1.** Calculer le polynôme caractéristique de $A$, et montrer que $A$ n'est pas diagonalisable.

    **2.** Déterminer les sous-espaces caractéristiques de $A$ (chapitre 3), et en déduire une base de $\mathbb{R}^{3}$ dans laquelle $A$ est semblable à une matrice triangulaire simple.

    **3.** Résoudre $X' = AX$.
  corrige: |
    La matrice n'est pas diagonalisable ; une base adaptée aux sous-espaces caractéristiques la rend triangulaire, et le système triangulaire se résout de proche en proche.

    **1.** On trouve $\chi_{A} = (X - 1)(X - 2)^{2}$. Le sous-espace propre associé à $2$ est la droite $\mathbb{R}\,(2, 1, 1)$, de dimension $1 < 2$. 
    $$\boxed{\chi_{A} = (X - 1)(X - 2)^{2}, \qquad A \text{ n'est pas diagonalisable}}$$

    **2.** On a $\ker(A - I_{3}) = \mathbb{R}\,v_{1}$, avec $v_{1} = (2, 0, 1)$, et $\ker(A - 2I_{3})^{2}$ est le plan engendré par $(1, 0, 0)$ et $(0, 1, 1)$. On pose $v_{2} = (2, 1, 1)$ et $v_{3} = (-1, 0, 0)$, qui vérifie $(A - 2I_{3})v_{3} = v_{2}$. Dans la base $(v_{1}, v_{2}, v_{3})$ : 
    $$\boxed{A = P\begin{pmatrix} 1 & 0 & 0 \\ 0 & 2 & 1 \\ 0 & 0 & 2 \end{pmatrix}P^{-1}, \qquad P = \begin{pmatrix} 2 & 2 & -1 \\ 0 & 1 & 0 \\ 1 & 1 & 0 \end{pmatrix}}$$

    **3.** Avec $X = PY$, le système devient $y_{1}' = y_{1}$, $y_{2}' = 2y_{2} + y_{3}$, $y_{3}' = 2y_{3}$, d'où $y_{3} = c\,\mathrm{e}^{2t}$, puis $y_{2} = (b + ct)\mathrm{e}^{2t}$. 
    $$\boxed{X(t) = a\,\mathrm{e}^{t}\begin{pmatrix} 2 \\ 0 \\ 1 \end{pmatrix} + (b + ct)\,\mathrm{e}^{2t}\begin{pmatrix} 2 \\ 1 \\ 1 \end{pmatrix} + c\,\mathrm{e}^{2t}\begin{pmatrix} -1 \\ 0 \\ 0 \end{pmatrix}, \quad (a, b, c) \in \mathbb{R}^{3}}$$
     Le facteur $t\mathrm{e}^{2t}$ est la marque de la non-diagonalisabilité. Le résultat coïncide avec le calcul symbolique de $\exp(tA)$.
