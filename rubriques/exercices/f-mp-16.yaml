  page_enonce: 2
  page_corrige: 5
  enonce: |
    *Solutions bornées.*

    **1.** Soit $a : \mathbb{R}_{+} \to \mathbb{R}$ continue et intégrable sur $\mathbb{R}_{+}$. Montrer que les solutions de $y' - a(t)y = 0$ sont bornées sur $\mathbb{R}_{+}$.

    **2.** Soit $a$, $b : \mathbb{R}_{+} \to \mathbb{R}_{+}$ continues, et $\mathcal{S}$ l'ensemble des solutions sur $\mathbb{R}_{+}$ de $y' = a(t)y + b(t)$. Montrer que tous les éléments de $\mathcal{S}$ sont bornés si et seulement si $a$ et $b$ sont intégrables sur $\mathbb{R}_{+}$.
  corrige: |
    On écrit les solutions à l'aide de primitives, et l'on compare leurs limites.

    **1.** Les solutions sont $y(t) = y(0)\exp\big(\mathop{\displaystyle \int_{0}^{t}} a\big)$, et $\big|\mathop{\displaystyle \int_{0}^{t}} a\big| \leqslant \mathop{\displaystyle \int_{0}^{+\infty}} |a|$. 
    $$\boxed{|y(t)| \leqslant |y(0)|\exp\Big(\int_{0}^{+\infty} |a|\Big)}$$

    **2.** On note $A(t) = \mathop{\displaystyle \int_{0}^{t}} a$, fonction positive et croissante. Les solutions s'écrivent 
    $$y(t) = \mathrm{e}^{A(t)}\Big(y(0) + \int_{0}^{t} b(s)\mathrm{e}^{-A(s)}\,\mathrm{d} s\Big).$$

    Si $a$ et $b$ sont intégrables. Alors $A \leqslant \alpha = \mathop{\displaystyle \int_{0}^{+\infty}} a$, et $0 \leqslant \mathop{\displaystyle \int_{0}^{t}} b\mathrm{e}^{-A} \leqslant \mathop{\displaystyle \int_{0}^{+\infty}} b$ : toute solution est bornée par $\mathrm{e}^{\alpha}\big(|y(0)| + \mathop{\displaystyle \int_{0}^{+\infty}} b\big)$.

    Réciproquement. La solution telle que $y(0) = 1$ vérifie $y \geqslant \mathrm{e}^{A}$, puisque $b \geqslant 0$ ; si elle est bornée, $A$ est bornée, donc $a$ est intégrable, et $A \leqslant \alpha$. La solution telle que $y(0) = 0$ vérifie 
    $$y(t) \geqslant \mathrm{e}^{A(t)}\mathrm{e}^{-\alpha}\int_{0}^{t} b \geqslant \mathrm{e}^{-\alpha}\int_{0}^{t} b,$$
     et, si elle est bornée, $b$ est intégrable. 
    $$\boxed{\text{toutes les solutions bornées} \iff a \text{ et } b \text{ intégrables sur } \mathbb{R}_{+}}$$
