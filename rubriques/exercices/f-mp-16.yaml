  enonce: |
    Résoudre sur $\mathbb{R}$ l'équation $y'' + 4y' + 4y = \dfrac{\mathrm{e}^{-2t}}{1 + t^{2}}$ par la méthode de variation des constantes.
  corrige: |
    Le second membre n'est pas de la forme exponentielle-polynôme : on applique le théorème 6 avec la base $(\mathrm{e}^{-2t}, t\mathrm{e}^{-2t})$.

    Avec $y_{1} = \mathrm{e}^{-2t}$ et $y_{2} = t\mathrm{e}^{-2t}$, on a $W = \mathrm{e}^{-4t}$, et $c(t) = \dfrac{\mathrm{e}^{-2t}}{1 + t^{2}}$. Le théorème 6 donne $\lambda_{1}' = -\dfrac{t}{1 + t^{2}}$ et $\lambda_{2}' = \dfrac{1}{1 + t^{2}}$, d'où $\lambda_{1} = -\dfrac{1}{2}\ln(1 + t^{2})$ et $\lambda_{2} = \operatorname{Arctan} t$. 
    $$\boxed{y(t) = \mathrm{e}^{-2t}\Big(t\operatorname{Arctan} t - \frac{1}{2}\ln(1 + t^{2}) + A + Bt\Big), \quad (A, B) \in \mathbb{R}^{2}}$$
- id: "mp-16-27"
  feuille: "f-mp-16"
