  enonce: |
    *Factorisation d'un opérateur.* Pour $u \in \mathcal{C}^{\infty}(\mathbb{R})$, on note $L_{u}$ l'endomorphisme de $\mathcal{C}^{\infty}(\mathbb{R})$ défini par $L_{u}(y) = y' + uy$.

    **1.** Calculer $L_{u} \circ L_{v}(y)$ pour $u$, $v \in \mathcal{C}^{\infty}(\mathbb{R})$.

    **2.** Trouver $u$ et $v$ telles que l'équation $y'' + 2\operatorname{th}(x)y' + y = 0$ s'écrive $L_{u} \circ L_{v}(y) = 0$, et la résoudre.
  corrige: |
    Factoriser l'opérateur ramène une équation du second ordre à deux équations du premier ordre successives.

    **1.** On a $L_{u}\big(L_{v}(y)\big) = (y' + vy)' + u(y' + vy)$, soit 
    $$\boxed{L_{u} \circ L_{v}(y) = y'' + (u + v)y' + (v' + uv)y}$$

    **2.** Il faut $u + v = 2\operatorname{th}$ et $v' + uv = 1$ ; le choix $u = v = \operatorname{th}$ convient, puisque $\operatorname{th}' + \operatorname{th}^{2} = 1$. Si $y$ est solution, $z = L_{\operatorname{th}}(y)$ vérifie $z' + \operatorname{th}(x)z = 0$, d'où $z = \dfrac{C}{\operatorname{ch} x}$ ; puis $y' + \operatorname{th}(x)y = \dfrac{C}{\operatorname{ch} x}$ s'écrit $(y\operatorname{ch} x)' = C$. 
    $$\boxed{y(x) = \frac{Cx + D}{\operatorname{ch} x}, \quad (C, D) \in \mathbb{R}^{2}}$$
- id: "mp-16-31"
