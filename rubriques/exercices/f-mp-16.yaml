  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Coefficients constants.* Résoudre sur $\mathbb{R}$ les équations suivantes.

    **1.** $y'' + 4y' + 4y = \sin t$.

    **2.** $y'' - 3y' + 2y = \operatorname{sh}(2t)$.

    **3.** $y'' + y' + y = t$.
  corrige: |
    On résout l'équation caractéristique, puis l'on cherche une solution particulière de la forme du second membre, en multipliant par $t$ en cas de résonance.

    **1.** L'équation caractéristique $(r + 2)^{2} = 0$ a une racine double. On cherche une solution particulière de la forme $a\cos t + b\sin t$ ; l'identification donne $3a + 4b = 0$ et $3b - 4a = 1$. 
    $$\boxed{y(t) = (A + Bt)\mathrm{e}^{-2t} + \frac{3\sin t - 4\cos t}{25}}$$

    **2.** Les racines sont $1$ et $2$. On écrit le second membre sous la forme $\operatorname{sh}(2t) = \dfrac{1}{2}\mathrm{e}^{2t} - \dfrac{1}{2}\mathrm{e}^{-2t}$, et l'on note $P(r) = r^{2} - 3r + 2$. Pour $\mathrm{e}^{2t}$, il y a résonance, et $P'(2) = 1$ : la fonction $\dfrac{t}{2}\mathrm{e}^{2t}$ convient pour $\dfrac{1}{2}\mathrm{e}^{2t}$. Pour $\mathrm{e}^{-2t}$, on a $P(-2) = 12$, et $-\dfrac{1}{24}\mathrm{e}^{-2t}$ convient. Par superposition : 
    $$\boxed{y(t) = A\mathrm{e}^{t} + B\mathrm{e}^{2t} + \frac{t}{2}\mathrm{e}^{2t} - \frac{1}{24}\mathrm{e}^{-2t}}$$

    **3.** Les racines sont $-\dfrac{1}{2} \pm \mathrm{i}\dfrac{\sqrt{3}}{2}$, et $t - 1$ est une solution particulière. 
    $$\boxed{y(t) = t - 1 + \mathrm{e}^{-t/2}\Big(A\cos\frac{\sqrt{3}t}{2} + B\sin\frac{\sqrt{3}t}{2}\Big)}$$
