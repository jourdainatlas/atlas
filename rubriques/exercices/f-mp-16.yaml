  page_enonce: 6
  page_corrige: 12
  enonce: |
    *Comportement en $+\infty$.*

    **1.** Soit $b : \mathbb{R}_{+} \to \mathbb{C}$ continue, de limite nulle en $+\infty$. Montrer que toutes les solutions de $y' + y = b$ tendent vers $0$ en $+\infty$.

    **2.** Soit $f : \mathbb{R}_{+} \to \mathbb{C}$ de classe $\mathcal{C}^{1}$ telle que $f(x) + f'(x) \to \ell$ quand $x \to +\infty$. Montrer que $f(x) \to \ell$.

    **3.** Soit $u : \mathbb{R}_{+} \to \mathbb{R}$ continue, de limite nulle en $+\infty$. En factorisant l'opérateur $y \mapsto y'' + 3y' + 2y$ comme à l'exercice 30, montrer que toutes les solutions de $y'' + 3y' + 2y = u$ tendent vers $0$ en $+\infty$.
  corrige: |
    La formule intégrale des solutions de $y' + y = b$ est une moyenne pondérée de $b$, qui oublie exponentiellement le passé.

    **1.** Les solutions sont $y(x) = \mathrm{e}^{-x}y(0) + \mathop{\displaystyle \int_{0}^{x}} \mathrm{e}^{t - x}b(t)\,\mathrm{d} t$. Soit $\varepsilon > 0$ et $A$ tel que $|b| \leqslant \varepsilon$ sur $[A, +\infty[$. Pour $x \geqslant A$, 
    $$|y(x)| \leqslant \mathrm{e}^{-x}\Big(|y(0)| + \int_{0}^{A} \mathrm{e}^{t}|b(t)|\,\mathrm{d} t\Big) + \varepsilon\int_{A}^{x} \mathrm{e}^{t - x}\,\mathrm{d} t \leqslant \mathrm{e}^{-x}C_{A} + \varepsilon,$$
     qui est inférieur à $2\varepsilon$ pour $x$ assez grand. 
    $$\boxed{y(x) \xrightarrow[x \to +\infty]{} 0}$$

    **2.** La fonction $g = f - \ell$ vérifie $g + g' = (f + f') - \ell \to 0$, et la question 1 donne $g \to 0$. 
    $$\boxed{f(x) \xrightarrow[x \to +\infty]{} \ell}$$

    **3.** On a $y'' + 3y' + 2y = (y' + 2y)' + (y' + 2y)$ : $z = y' + 2y$ vérifie $z' + z = u$, donc $z \to 0$ par la question 1. Puis $y' + 2y = z$, et le même raisonnement, avec $\mathrm{e}^{-2x}$ au lieu de $\mathrm{e}^{-x}$, donne $y \to 0$. 
    $$\boxed{\text{toute solution de } y'' + 3y' + 2y = u \text{ tend vers } 0 \text{ en } +\infty}$$
- id: "mp-16-35"
  feuille: "f-mp-16"
  numero: 35
  partie: "Équations scalaires du second ordre"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [second ordre, wronskien]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  source: "BibM@th, Équations différentielles, exercice 30"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $f : \mathbb{R}_{+} \to \mathbb{R}$ continue et intégrable, et l'équation $y'' + f(t)y = 0$.

    **1.** Soit $y$ une solution bornée. Montrer que $y'(t)$ tend vers $0$ quand $t \to +\infty$.

    **2.** Montrer que le wronskien de deux solutions est constant.

    **3.** En déduire que l'équation a des solutions non bornées sur $\mathbb{R}_{+}$.
  corrige: |
    Le wronskien est constant ; deux solutions bornées auraient un wronskien tendant vers $0$, ce qui est absurde.

    **1.** Si $|y| \leqslant M$, alors $|y''| = |f\,y| \leqslant M|f|$, intégrable : $y'(t) = y'(0) + \mathop{\displaystyle \int_{0}^{t}} y''$ a une limite $L$ en $+\infty$. Si $L \neq 0$, alors $y(t) \sim Lt$ (en intégrant), ce qui contredit le caractère borné de $y$. 
    $$\boxed{y'(t) \xrightarrow[t \to +\infty]{} 0}$$

    **2.** La proposition 10, avec $a = 0$, donne $W' = 0$.

    **3.** Si toutes les solutions étaient bornées, celles d'une base $(y_{1}, y_{2})$ vérifieraient $W = y_{1}y_{2}' - y_{1}'y_{2} \to 0$ par la question 1, alors que $W$ est une constante non nulle (théorème 5). 
    $$\boxed{\text{l'équation a des solutions non bornées sur } \mathbb{R}_{+}}$$
     Ainsi $y'' + \dfrac{1}{(1 + t)^{2}}\,y = 0$ a des solutions non bornées, comme $y'' = 0$, dont elle est une perturbation intégrable.
- id: "mp-16-36"
  feuille: "f-mp-16"
  numero: 36
  partie: "Équations scalaires du second ordre"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [second ordre, wronskien]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle]
  source: "Feuille d'exercices #17 (Prost), exercice 29 ; BibM@th, Équations différentielles, exercice 31"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Les théorèmes de Sturm.* Soit $p$, $q : \mathbb{R} \to \mathbb{R}$ continues, et l'équation $y'' + p(t)y' + q(t)y = 0$.

    **1.** Montrer que les zéros d'une solution non nulle $f$ sont simples, c'est-à-dire que $f'$ ne s'y annule pas, et isolés. En déduire que $f$ n'a qu'un nombre fini de zéros sur tout segment.

    **2.** *Séparation.* Soit $f$, $g$ deux solutions indépendantes, et $t_{1} < t_{2}$ deux zéros consécutifs de $f$. En étudiant le signe du wronskien et ceux de $f'(t_{1})$ et $f'(t_{2})$, montrer que $g$ s'annule une et une seule fois sur $]t_{1}, t_{2}[$.

    **3.** *Comparaison.* On suppose $p = 0$ et $q(t) \geqslant M^{2}$ pour tout $t$, avec $M > 0$. Soit $f$ une solution non nulle, et $\alpha \in \mathbb{R}$. En comparant $f$ à $g(t) = \sin\big(M(t - \alpha)\big)$ à l'aide de $(fg' - f'g)'$, montrer que $f$ s'annule sur $\big[\alpha, \alpha + \frac{\pi}{M}\big]$.

    **4.** On rappelle que $J_{0}$, solution de $ty'' + y' + ty = 0$ (cours, section 16.7), vérifie l'équation normalisée sur $]0, +\infty[$. Montrer que $v(t) = \sqrt{t}\,J_{0}(t)$ est solution de $v'' + \Big(1 + \dfrac{1}{4t^{2}}\Big)v = 0$, et en déduire que $J_{0}$ s'annule dans tout intervalle de longueur $\pi$ inclus dans $]0, +\infty[$.
  corrige: |
    Le signe constant du wronskien force les zéros de deux solutions indépendantes à s'entrelacer ; la comparaison avec une sinusoïde contrôle l'écart entre zéros.

    **1.** Si $f(t_{0}) = f'(t_{0}) = 0$, la proposition 4 donne $f = 0$ : les zéros sont simples, et le développement $f(t) = f'(t_{0})(t - t_{0}) + o(t - t_{0})$ montre qu'ils sont isolés. Si $f$ avait une infinité de zéros dans un segment, le théorème de Bolzano-Weierstrass donnerait une suite de zéros distincts convergeant vers $t^{*}$ ; par continuité $f(t^{*}) = 0$, et le théorème de Rolle entre zéros consécutifs de la suite donne des zéros de $f'$ qui convergent vers $t^{*}$, donc $f'(t^{*}) = 0$ : contradiction.

    **2.** Le wronskien $W = fg' - f'g$ ne s'annule pas (théorème 5), donc garde un signe constant. En $t_{i}$, $W(t_{i}) = -f'(t_{i})g(t_{i})$, donc $g(t_{i}) \neq 0$. Comme $f$ garde un signe constant sur $]t_{1}, t_{2}[$ et que ses zéros sont simples, $f'(t_{1})$ et $f'(t_{2})$ sont de signes contraires, et donc $g(t_{1})$ et $g(t_{2})$ aussi : $g$ s'annule sur $]t_{1}, t_{2}[$. Si $g$ s'y annulait deux fois, le même argument, en échangeant $f$ et $g$, ferait apparaître un zéro de $f$ entre eux, ce qui contredit le fait que $t_{1}$ et $t_{2}$ sont consécutifs. 
    $$\boxed{g \text{ s'annule exactement une fois sur } ]t_{1}, t_{2}[}$$

    **3.** Supposons que $f$ ne s'annule pas sur $\big[\alpha, \alpha + \dfrac{\pi}{M}\big]$, par exemple $f > 0$. La fonction $h = fg' - f'g$ vérifie $h' = fg'' - f''g = (q - M^{2})fg \geqslant 0$ sur cet intervalle, où $g \geqslant 0$. Mais $h(\alpha) = Mf(\alpha) > 0$ et $h\big(\alpha + \dfrac{\pi}{M}\big) = -Mf\big(\alpha + \dfrac{\pi}{M}\big) < 0$, ce qui contredit la croissance de $h$. 
    $$\boxed{f \text{ s'annule sur } \Big[\alpha, \alpha + \frac{\pi}{M}\Big]}$$

    **4.** Le calcul direct, avec $y = J_{0}$ solution de $y'' + \dfrac{1}{t}y' + y = 0$, donne $v'' + \big(1 + \dfrac{1}{4t^{2}}\big)v = 0$, ce que confirme le calcul symbolique. Comme $q(t) = 1 + \dfrac{1}{4t^{2}} \geqslant 1$, la question 3, appliquée avec $M = 1$ sur $]0, +\infty[$, montre que $v$, donc $J_{0}$, s'annule dans tout intervalle de longueur $\pi$ inclus dans $]0, +\infty[$. 
    $$\boxed{J_{0} \text{ a une infinité de zéros, distants d'au plus } \pi}$$
     Les zéros consécutifs de $J_{0}$ sont en fait de plus en plus proches de $\pi$ : $2{,}405$, $5{,}520$, $8{,}654$, $11{,}792$…
- id: "mp-16-37"
  feuille: "f-mp-16"
