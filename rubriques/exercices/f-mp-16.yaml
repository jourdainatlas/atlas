  enonce: |
    On munit $\mathbb{R}^{n}$ de sa structure euclidienne canonique. Montrer qu'une matrice $A \in \mathcal{M}_{n}(\mathbb{R})$ est antisymétrique si et seulement si toutes les solutions de $X' = AX$ sont de norme constante. Que peut-on en déduire sur $\exp(tA)$ ? Comparer avec la feuille du chapitre 7.
  corrige: |
    La dérivée du carré de la norme fait apparaître la partie symétrique de $A$.

    Pour une solution $X$, $\dfrac{\mathrm{d}}{\mathrm{d} t}\lVert X \rVert^{2} = 2{X}^{T}X' = {X}^{T}(A + {A}^{T})X$. Si $A$ est antisymétrique, cette dérivée est nulle. Réciproquement, si toutes les solutions sont de norme constante, en $t = 0$ on obtient ${X_{0}}^{T}SX_{0} = 0$ pour tout $X_{0}$, avec $S = A + {A}^{T}$ symétrique ; par polarisation, ${X}^{T}SY = 0$ pour tous $X$, $Y$, donc $S = 0$. 
    $$\boxed{A \text{ antisymétrique} \iff \text{toutes les solutions sont de norme constante}}$$
     Alors $\exp(tA)$ conserve la norme, donc est orthogonale (chapitre 7), et $\det \exp(tA) = \mathrm{e}^{t\operatorname{tr} A} = 1$ : on retrouve $\exp(tA) \in \mathrm{SO}(n)$, comme dans la feuille du chapitre 7.
