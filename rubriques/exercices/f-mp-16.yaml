  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse]
  noeuds: [ed-lineaires]
  notions: []
  source: "BibM@th, Équations différentielles, exercice 9"
  page_enonce: 8
  page_corrige: 17
  enonce: |
    *Une transformée de Fourier.* On pose, pour $x \in \mathbb{R}$, 
    $$f(x) = \int_{0}^{+\infty} \frac{\mathrm{e}^{-t}}{\sqrt{t}}\,\mathrm{e}^{\mathrm{i} tx}\,\mathrm{d} t.$$

    **1.** Montrer que $f$ est définie et de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ (chapitre 13).

    **2.** Former une équation différentielle linéaire du premier ordre vérifiée par $f$.

    **3.** En déduire $f(x)$ pour tout réel $x$, sachant que $\displaystyle\int_{0}^{+\infty} \mathrm{e}^{-u^{2}}\,\mathrm{d} u = \frac{\sqrt{\pi}}{2}$.
  corrige: |
    Une intégrale à paramètre vérifie une équation différentielle linéaire, ce qui permet de la calculer sans évaluer d'intégrale complexe.

    **1.** La fonction $(x, t) \mapsto \dfrac{\mathrm{e}^{-t}}{\sqrt{t}}\mathrm{e}^{\mathrm{i} tx}$ est continue, de module $\dfrac{\mathrm{e}^{-t}}{\sqrt{t}}$, intégrable sur $]0, +\infty[$ ; sa dérivée partielle par rapport à $x$ est $\mathrm{i}\sqrt{t}\,\mathrm{e}^{-t}\mathrm{e}^{\mathrm{i} tx}$, de module $\sqrt{t}\,\mathrm{e}^{-t}$, intégrable et indépendant de $x$. Le théorème de dérivation sous l'intégrale (chapitre 13) s'applique. 
    $$\boxed{f \in \mathcal{C}^{1}(\mathbb{R}), \qquad f'(x) = \mathrm{i}\int_{0}^{+\infty} \sqrt{t}\,\mathrm{e}^{(\mathrm{i} x - 1)t}\,\mathrm{d} t}$$

    **2.** On intègre par parties, en intégrant $\mathrm{e}^{(\mathrm{i} x - 1)t}$ en $\dfrac{\mathrm{e}^{(\mathrm{i} x - 1)t}}{\mathrm{i} x - 1}$ ; le crochet est nul en $0$ et en $+\infty$, puisque $|\mathrm{e}^{(\mathrm{i} x - 1)t}| = \mathrm{e}^{-t}$ : 
    $$\int_{0}^{+\infty} \sqrt{t}\,\mathrm{e}^{(\mathrm{i} x - 1)t}\,\mathrm{d} t = -\frac{1}{2(\mathrm{i} x - 1)}\int_{0}^{+\infty} \frac{\mathrm{e}^{(\mathrm{i} x - 1)t}}{\sqrt{t}}\,\mathrm{d} t = \frac{f(x)}{2(1 - \mathrm{i} x)}.$$

    $$\boxed{f'(x) = \frac{\mathrm{i}}{2(1 - \mathrm{i} x)}\,f(x)}$$

    **3.** On a $\dfrac{\mathrm{i}}{1 - \mathrm{i} x} = \dfrac{\mathrm{i}(1 + \mathrm{i} x)}{1 + x^{2}} = \dfrac{\mathrm{i} - x}{1 + x^{2}}$, de primitive nulle en $0$ égale à $\mathrm{i}\operatorname{Arctan} x - \dfrac{1}{2}\ln(1 + x^{2})$. Par le changement de variable $t = u^{2}$, $f(0) = 2\mathop{\displaystyle \int_{0}^{+\infty}} \mathrm{e}^{-u^{2}}\,\mathrm{d} u = \sqrt{\pi}$. La résolution de l'équation linéaire du premier ordre donne : 
    $$\boxed{f(x) = \frac{\sqrt{\pi}}{(1 + x^{2})^{1/4}}\exp\Big(\frac{\mathrm{i}}{2}\operatorname{Arctan} x\Big)}$$
     Le calcul par quadrature numérique confirme cette formule, par exemple pour $x = \dfrac{1}{2}$ et $x = 2$. On a écrit le résultat sans puissance complexe, pour éviter la question du choix d'une racine carrée de $1 - \mathrm{i} x$.
- id: "mp-16-45"
