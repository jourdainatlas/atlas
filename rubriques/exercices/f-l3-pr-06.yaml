- id: "l3-pr-06-01"
  feuille: "f-l3-pr-06"
  numero: 1
  partie: "Séries génératrices"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [séries génératrices]
  noeuds: [p-esperance, p-independance]
  notions: [esperance, loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 21 ; Durand (Orsay), exercice 4.35"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $X$ de loi uniforme sur $\llbracket 1, n\rrbracket$. Calculer $G_{X}$, puis retrouver $\mathbb{E}[X]$ et $\operatorname{Var}(X)$ à l'aide de la proposition 3 du cours.

    **2.** Soit $X$ à valeurs dans $\mathbb{N}$ et $r \in \mathbb{N}^{*}$. Montrer que $G_{X}^{(r)}(s)$ tend, quand $s \to 1^{-}$, vers le *moment factoriel* $\mathbb{E}[X(X - 1)\cdots(X - r + 1)]$, que celui-ci soit fini ou égal à $+\infty$.

    **3.** Calculer les moments factoriels de tous ordres des lois $\mathcal{B}(n, p)$, $\mathcal{P}(\lambda)$ et $\mathcal{G}(p)$.
  corrige: |
    **1.** $G_{X}(s) = \frac{1}{n}(s + s^{2} + \dots + s^{n}) = \boxed{\frac{s(1 - s^{n})}{n(1 - s)}}$ pour $s \neq 1$. C'est un polynôme, et l'on dérive la première écriture : 
    $$G_{X}'(1) = \frac{1}{n}\sum_{k = 1}^{n}k = \frac{n + 1}{2}, \qquad G_{X}''(1) = \frac{1}{n}\sum_{k = 1}^{n}k(k - 1) = \frac{(n + 1)(n - 1)}{3}.$$
     Par la prop. 3 du cours, $\boxed{\mathbb{E}[X] = \frac{n + 1}{2}}$ et 
    $$\operatorname{Var}(X) = \frac{(n + 1)(n - 1)}{3} + \frac{n + 1}{2} - \frac{(n + 1)^{2}}{4} = \frac{(n + 1)\big[4(n - 1) + 6 - 3(n + 1)\big]}{12} = \boxed{\frac{n^{2} - 1}{12}}.$$

    **2.** Pour $s \in [0, 1[$, la série entière se dérive terme à terme $r$ fois : 
    $$G_{X}^{(r)}(s) = \sum_{k \geqslant r}k(k - 1)\cdots(k - r + 1)\,\mathbb{P}(X = k)\,s^{k - r}.$$
     Tous les termes sont positifs et croissent avec $s$. Par le théorème de convergence monotone pour les séries (appliqué le long de toute suite $s_{j} \uparrow 1$), $G_{X}^{(r)}(s)$ croît, quand $s \to 1^{-}$, vers 
    $$\sum_{k}k(k - 1)\cdots(k - r + 1)\mathbb{P}(X = k) = \boxed{\mathbb{E}[X(X - 1)\cdots(X - r + 1)]},$$
     que cette somme soit finie ou non. C'est la remarque qui suit la prop. 3 du cours, ici démontrée.

    **3.** On dérive $r$ fois les séries génératrices du cours, puis on fait $s = 1$ :

    • $\mathcal{B}(n, p)$ : $G = (q + ps)^{n}$, d'où 
    $$\boxed{\mathbb{E}[X(X - 1)\cdots(X - r + 1)] = n(n - 1)\cdots(n - r + 1)\,p^{r}},$$
     nul pour $r > n$ ;

    • $\mathcal{P}(\lambda)$ : $G = \mathrm{e}^{\lambda(s - 1)}$, d'où $\boxed{\lambda^{r}}$ ;

    • $\mathcal{G}(p)$ : $G(s) = \frac{ps}{1 - qs} = \frac{p}{q}\Big(\frac{1}{1 - qs} - 1\Big)$, donc $G^{(r)}(s) = \frac{p}{q} \cdot \frac{r!\,q^{r}}{(1 - qs)^{r + 1}}$ et le moment factoriel vaut $\boxed{\frac{r!\,q^{r - 1}}{p^{r}}}$.

    Pour $r = 1$, on retrouve $np$, $\lambda$ et $\frac{1}{p}$. La loi de Poisson est la seule des trois dont les moments factoriels forment une suite géométrique : c'est une manière de la reconnaître.
- id: "l3-pr-06-02"
  feuille: "f-l3-pr-06"
  numero: 2
  partie: "Séries génératrices"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [séries génératrices]
  noeuds: [p-esperance, p-independance, pol-binome]
  notions: [esperance, loi-variable, coefficient-binomial]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 3, exercice 9 ; Durand, exercice 10.27 (questions 2 et 4)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On répète des épreuves indépendantes de probabilité de succès $p \in \,]0, 1[$, et l'on note $X$ le nombre d'épreuves nécessaires pour obtenir $m \geqslant 1$ succès.

    **1.** Montrer que $\mathbb{P}(X = k) = \binom{k - 1}{m - 1}p^{m}q^{k - m}$ pour $k \geqslant m$ (loi *binomiale négative* $\mathcal{BN}(m, p)$ ; pour $m = 1$, c'est la loi $\mathcal{G}(p)$).

    **2.** Montrer que $G_{X}(s) = \Big(\frac{ps}{1 - qs}\Big)^{m}$ pour $s \in [-1, 1]$. En déduire que $X$ a la loi d'une somme $\varepsilon_{1} + \dots + \varepsilon_{m}$ de variables indépendantes de loi $\mathcal{G}(p)$, puis que $\mathbb{E}[X] = \frac{m}{p}$ et $\operatorname{Var}(X) = \frac{mq}{p^{2}}$.

    **3.** Un pêcheur veut $m$ truites ; chaque poisson qui mord est une truite avec probabilité $p$, indépendamment des autres. Soit $Y$ le nombre de poissons pêchés qui ne sont pas des truites. Déterminer la loi de $Y$ et sa série génératrice.

    **4.** On fixe $\lambda > 0$ et l'on prend $p = p_{m} = \frac{m}{m + \lambda}$. Montrer que la loi de $Y$ converge vers la loi $\mathcal{P}(\lambda)$ quand $m \to +\infty$. Que vaut $\mathbb{E}[Y]$ ?
  corrige: |
    **1.** L'évènement $\{X = k\}$ est réalisé si et seulement si la $k$-ième épreuve est un succès et si les $k - 1$ premières comportent exactement $m - 1$ succès. Par indépendance, 
    $$\mathbb{P}(X = k) = \binom{k - 1}{m - 1}p^{m - 1}q^{k - m} \cdot p = \boxed{\binom{k - 1}{m - 1}p^{m}q^{k - m}}, \qquad k \geqslant m.$$

    **2.** Posons $k = m + j$. Par le développement $(1 - x)^{-m} = \sum_{j \geqslant 0}\binom{j + m - 1}{m - 1}x^{j}$, valable pour $|x| < 1$, on a, pour $|s| \leqslant 1$ (donc $|qs| < 1$), 
    $$G_{X}(s) = (ps)^{m}\sum_{j \geqslant 0}\binom{j + m - 1}{m - 1}(qs)^{j} = \boxed{\Big(\frac{ps}{1 - qs}\Big)^{m}}.$$
     Si $\varepsilon_{1}, \dots, \varepsilon_{m}$ sont indépendantes de loi $\mathcal{G}(p)$, la prop. 2 du cours donne $G_{\varepsilon_{1} + \dots + \varepsilon_{m}} = \big(\frac{ps}{1 - qs}\big)^{m} = G_{X}$, et par la prop. 1, 
    $$\boxed{X \text{ a la loi de } \varepsilon_{1} + \dots + \varepsilon_{m}}.$$
     C'est intuitif : $\varepsilon_{i}$ est le nombre d'épreuves qui séparent le $(i - 1)$-ième succès du $i$-ième.

    Par linéarité et par indépendance, avec les valeurs de la loi géométrique, 
    $$\boxed{\mathbb{E}[X] = \frac{m}{p}}, \qquad \boxed{\operatorname{Var}(X) = \frac{mq}{p^{2}}}.$$

    **3.** Le nombre total de poissons pêchés suit $\mathcal{BN}(m, p)$, et $Y = X - m$. Donc, pour $j \in \mathbb{N}$, 
    $$\boxed{\mathbb{P}(Y = j) = \binom{j + m - 1}{m - 1}p^{m}q^{j}}, \qquad \boxed{G_{Y}(s) = \frac{G_{X}(s)}{s^{m}} = \Big(\frac{p}{1 - qs}\Big)^{m}}.$$

    **4.** Avec $p_{m} = \frac{m}{m + \lambda}$ et $q_{m} = \frac{\lambda}{m + \lambda}$, 
    $$G_{Y}(s) = \Big(\frac{m}{m + \lambda - \lambda s}\Big)^{m} = \Big(1 + \frac{\lambda(1 - s)}{m}\Big)^{-m} \xrightarrow[m \to +\infty]{} \mathrm{e}^{-\lambda(1 - s)} = G_{\mathcal{P}(\lambda)}(s),$$
     pour tout $s \in [0, 1[$. Par la prop. 4 du cours, $\boxed{\mathbb{P}(Y = j) \to \mathrm{e}^{-\lambda}\frac{\lambda^{j}}{j!}}$ pour tout $j$. Enfin $\mathbb{E}[Y] = \frac{mq_{m}}{p_{m}} = \boxed{\lambda}$, pour tout $m$ : le paramètre $p_{m}$ a été choisi pour cela.

    1.5em

    ![Figure](documents/figures/a729f7fd425ece81.svg)

    La loi de $Y$ (nombre de poissons qui ne sont pas des truites) pour $\lambda = 2$ et $m = 1$, $3$, $10$, comparée à la loi $\mathcal{P}(2)$ (barres). Toutes ces lois ont pour espérance $2$ ; pour $m = 1$, c'est une loi géométrique sur $\mathbb{N}$, très étalée, et pour $m = 10$, elle est déjà proche de la loi de Poisson (distance en variation totale $0{,}042$, feuille 5, exercice 22).
- id: "l3-pr-06-03"
  feuille: "f-l3-pr-06"
