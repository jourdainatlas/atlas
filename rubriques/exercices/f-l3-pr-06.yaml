  source: "Bordeaux, TD 3, exercice 5 ; Durand, exercice 2.41 (dernière question)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer la fonction caractéristique de $X$ dans les cas suivants :

    **1.** $X = a$ presque sûrement ;

    **2.** $X$ suit la loi de Rademacher, $\mathbb{P}(X = 1) = \mathbb{P}(X = -1) = \frac{1}{2}$ ;

    **3.** $X$ suit la loi uniforme sur $\llbracket 1, n\rrbracket$ (on donnera une expression sans signe somme, à l'aide de $\sin$) ;

    **4.** $X \sim \mathcal{B}(n, p)$ : retrouver $\mathbb{E}[X]$ et $\operatorname{Var}(X)$ à partir de $\varphi_{X}$.

    Retrouver enfin, à l'aide des fonctions caractéristiques, la loi de la somme de deux variables indépendantes de lois $\mathcal{P}(\lambda)$ et $\mathcal{P}(\mu)$.
  corrige: |
    **1.** $\boxed{\varphi_{X}(t) = \mathrm{e}^{iat}}$.

    **2.** $\boxed{\varphi_{X}(t) = \frac{\mathrm{e}^{it} + \mathrm{e}^{-it}}{2} = \cos t}$, réelle comme pour toute loi symétrique (cours, prop. 7 (iv)).

    **3.** Pour $t \notin 2\pi\mathbb{Z}$, la somme géométrique donne $\varphi_{X}(t) = \frac{1}{n}\sum_{k = 1}^{n}\mathrm{e}^{ikt} = \frac{\mathrm{e}^{it}}{n} \cdot \frac{\mathrm{e}^{int} - 1}{\mathrm{e}^{it} - 1}$. En factorisant les angles moitiés, $\mathrm{e}^{i\theta} - 1 = 2i\,\mathrm{e}^{i\theta/2}\sin\frac{\theta}{2}$, d'où 
    $$\boxed{\varphi_{X}(t) = \mathrm{e}^{i(n + 1)t/2}\,\frac{\sin(nt/2)}{n\sin(t/2)}},$$
     et $\varphi_{X}(t) = 1$ pour $t \in 2\pi\mathbb{Z}$. Le facteur $\mathrm{e}^{i(n + 1)t/2}$ correspond au centre $\frac{n + 1}{2}$ de la loi (prop. 7 (iii)) ; le quotient est la fonction caractéristique de la loi uniforme centrée sur $\{-\frac{n - 1}{2}, \dots, \frac{n - 1}{2}\}$.

    **4.** $\varphi_{X}(t) = (q + p\mathrm{e}^{it})^{n}$, $\varphi_{X}'(t) = n\,ip\mathrm{e}^{it}(q + p\mathrm{e}^{it})^{n - 1}$ et 
    $$\varphi_{X}''(t) = n(n - 1)(ip\mathrm{e}^{it})^{2}(q + p\mathrm{e}^{it})^{n - 2} - np\mathrm{e}^{it}(q + p\mathrm{e}^{it})^{n - 1}.$$
     En $0$, $\varphi_{X}'(0) = inp$ et $\varphi_{X}''(0) = -n(n - 1)p^{2} - np$. Par la prop. 8 du cours, $\boxed{\mathbb{E}[X] = np}$, $\mathbb{E}[X^{2}] = n(n - 1)p^{2} + np$, et $\boxed{\operatorname{Var}(X) = np - np^{2} = npq}$.

    Si $X \sim \mathcal{P}(\lambda)$ et $Y \sim \mathcal{P}(\mu)$ sont indépendantes, par la prop. 10, 
    $$\varphi_{X + Y}(t) = \mathrm{e}^{\lambda(\mathrm{e}^{it} - 1)}\mathrm{e}^{\mu(\mathrm{e}^{it} - 1)} = \mathrm{e}^{(\lambda + \mu)(\mathrm{e}^{it} - 1)},$$
     fonction caractéristique de $\mathcal{P}(\lambda + \mu)$, et par le th. 1, $\boxed{X + Y \sim \mathcal{P}(\lambda + \mu)}$.
- id: "l3-pr-06-07"
  feuille: "f-l3-pr-06"
  numero: 7
  partie: "Fonctions caractéristiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions caractéristiques]
  noeuds: [fo-caracteristiques]
  notions: [fonction-caracteristique]
  source: "Bordeaux, TD 3, exercice 6 (1)-(5) ; Durand, exercices 4.4, 4.16 et 4.23"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Calculer la fonction caractéristique de la loi de Laplace $\mathcal{L}(\lambda)$, de densité $\frac{\lambda}{2}\mathrm{e}^{-\lambda|x|}$ ($\lambda > 0$). En déduire celle de la loi de Cauchy de paramètre $c > 0$, de densité $\frac{c}{\pi(c^{2} + x^{2})}$.

    **2.** Soient $Y$ et $Z$ indépendantes de loi de Cauchy de paramètre $1$, et $a, b > 0$. Déterminer la loi de $aY + bZ$, puis celle de $aY - bZ$.

    **3.** Soit $X \sim \mathcal{N}(m, \sigma^{2})$. Retrouver $\mathbb{E}[X]$ et $\operatorname{Var}(X)$ à partir de $\varphi_{X}$.

    **4.** Soit $X \sim \mathcal{N}(0, 1)$. En développant $\mathrm{e}^{-t^{2}/2}$ en série entière et en utilisant la proposition 8 du cours, montrer que $\mathbb{E}[X^{2k + 1}] = 0$ et 
    $$\mathbb{E}[X^{2k}] = \frac{(2k)!}{2^{k}k!} = 1 \cdot 3 \cdot 5 \cdots (2k - 1).$$
     En déduire les moments de $\mathcal{N}(0, \sigma^{2})$.
  corrige: |
    **1.** Si $X$ suit la loi de Laplace de paramètre $1$, $\frac{X}{\lambda}$ a la densité $\lambda \cdot \frac{1}{2}\mathrm{e}^{-\lambda|x|}$ (chapitre 4, prop. 9) : c'est la loi $\mathcal{L}(\lambda)$. Avec la fonction caractéristique $\frac{1}{1 + t^{2}}$ de $X$ (cours, section 6.5, exemple de la loi de Cauchy) et la prop. 7 (iii), 
    $$\boxed{\varphi_{\mathcal{L}(\lambda)}(t) = \frac{1}{1 + t^{2}/\lambda^{2}} = \frac{\lambda^{2}}{\lambda^{2} + t^{2}}}.$$
     Cette fonction est intégrable ; par la formule d'inversion (th. 2), $\frac{\lambda}{2}\mathrm{e}^{-\lambda|x|} = \frac{1}{2\pi}\int_{\mathbb{R}}\mathrm{e}^{-itx}\frac{\lambda^{2}}{\lambda^{2} + t^{2}}\,\mathrm{d} t$. En multipliant par $\frac{2}{\lambda}$, en changeant $x$ en $-x$ et en prenant $\lambda = c$, 
    $$\int_{\mathbb{R}}\mathrm{e}^{itx}\,\frac{c}{\pi(c^{2} + t^{2})}\,\mathrm{d} t = \mathrm{e}^{-c|x|} : \qquad \boxed{\varphi_{\text{Cauchy}(c)}(t) = \mathrm{e}^{-c|t|}}.$$

    **2.** Par les prop. 7 (iii) et 10, $\varphi_{aY + bZ}(t) = \mathrm{e}^{-a|t|}\mathrm{e}^{-b|t|} = \mathrm{e}^{-(a + b)|t|}$ : la variable $aY + bZ$ suit la loi de Cauchy de paramètre $\boxed{a + b}$. La loi de Cauchy est symétrique, donc $-Z$ a la loi de $Z$, et $aY - bZ$ suit la même loi.

    *Piège.* Pour des variables de variance finie, $\operatorname{Var}(aY - bZ) = a^{2}\operatorname{Var}(Y) + b^{2}\operatorname{Var}(Z)$ ; ici, les paramètres s'ajoutent linéairement, et la différence de deux variables de Cauchy est aussi dispersée que leur somme.

    **3.** $\varphi_{X}(t) = \mathrm{e}^{imt - \sigma^{2}t^{2}/2}$ (prop. 9), donc $\varphi_{X}'(t) = (im - \sigma^{2}t)\varphi_{X}(t)$ et $\varphi_{X}''(t) = \big[(im - \sigma^{2}t)^{2} - \sigma^{2}\big]\varphi_{X}(t)$. En $0$ : $\varphi_{X}'(0) = im$ et $\varphi_{X}''(0) = -m^{2} - \sigma^{2}$, d'où $\boxed{\mathbb{E}[X] = m}$, $\mathbb{E}[X^{2}] = m^{2} + \sigma^{2}$ et $\boxed{\operatorname{Var}(X) = \sigma^{2}}$.

    **4.** La variable $X$ a des moments de tous ordres (chapitre 4, prop. 8), donc, par la prop. 8 du cours, $\varphi_{X}$ est de classe $\mathcal{C}^{\infty}$ et $\varphi_{X}^{(j)}(0) = i^{j}\mathbb{E}[X^{j}]$. Par ailleurs, $\varphi_{X}(t) = \mathrm{e}^{-t^{2}/2} = \sum_{k \geqslant 0}\frac{(-1)^{k}t^{2k}}{2^{k}k!}$ est la somme d'une série entière de rayon infini, dont les coefficients sont $\frac{\varphi_{X}^{(j)}(0)}{j!}$. Par identification, 
    $$\mathbb{E}[X^{2k + 1}] = 0, \qquad \frac{i^{2k}\mathbb{E}[X^{2k}]}{(2k)!} = \frac{(-1)^{k}}{2^{k}k!}, \quad\text{soit}\quad \boxed{\mathbb{E}[X^{2k}] = \frac{(2k)!}{2^{k}k!} = 1 \cdot 3 \cdots (2k - 1)},$$
     car $(2k)! = \big(2 \cdot 4 \cdots 2k\big)\big(1 \cdot 3 \cdots (2k - 1)\big) = 2^{k}k! \cdot 1 \cdot 3 \cdots (2k - 1)$.

    Pour $\sigma X \sim \mathcal{N}(0, \sigma^{2})$ : moments impairs nuls, et $\boxed{\mathbb{E}[(\sigma X)^{2k}] = \sigma^{2k} \cdot 1 \cdot 3 \cdots (2k - 1)}$ ; par exemple $\mathbb{E}[(\sigma X)^{4}] = 3\sigma^{4}$.
- id: "l3-pr-06-08"
  feuille: "f-l3-pr-06"
  numero: 8
  partie: "Fonctions caractéristiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions caractéristiques]
  noeuds: [fo-caracteristiques]
  notions: [fonction-caracteristique]
  source: "Bordeaux, TD 3, exercice 6 (6) et exercice 8"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Soit $X$ une variable de densité $f$, de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, telle que $f$ et $f'$ soient intégrables et que $f$ tende vers $0$ en $\pm\infty$. Montrer, par une intégration par parties, que $|\varphi_{X}(t)| \leqslant \frac{1}{|t|}\int_{\mathbb{R}}|f'|$, et en déduire que $\varphi_{X}(t) \to 0$ quand $|t| \to +\infty$.

    **2.** Une variable à valeurs entières peut-elle avoir une fonction caractéristique qui tend vers $0$ à l'infini ?

    **3.** Soit $X_{n}$ de loi uniforme sur $[0, n]$. Calculer $\varphi_{X_{n}}$, et montrer que $\varphi_{X_{n}}$ converge simplement vers une fonction $\Phi$ que l'on déterminera.

    **4.** Montrer que $\Phi$ n'est pas une fonction caractéristique. Une limite simple de fonctions caractéristiques n'est donc pas forcément une fonction caractéristique ; que devient la masse de la loi de $X_{n}$ ?
  corrige: |
    **1.** Sur $[-A, A]$, une intégration par parties donne, pour $t \neq 0$, 
    $$\int_{-A}^{A}\mathrm{e}^{itx}f(x)\,\mathrm{d} x = \Big[\frac{\mathrm{e}^{itx}}{it}f(x)\Big]_{-A}^{A} - \frac{1}{it}\int_{-A}^{A}\mathrm{e}^{itx}f'(x)\,\mathrm{d} x.$$
     Quand $A \to +\infty$, le crochet tend vers $0$ (car $f \to 0$ en $\pm\infty$), et les intégrales convergent ($f$ et $f'$ intégrables). Donc $\varphi_{X}(t) = -\frac{1}{it}\int_{\mathbb{R}}\mathrm{e}^{itx}f'(x)\,\mathrm{d} x$, et $\boxed{|\varphi_{X}(t)| \leqslant \frac{1}{|t|}\int_{\mathbb{R}}|f'|} \to 0$.

    **2.** $\boxed{\text{Non}}$ : si $X$ est à valeurs entières, $\mathrm{e}^{i(t + 2\pi)X} = \mathrm{e}^{itX}$, donc $\varphi_{X}$ est $2\pi$-périodique et $\varphi_{X}(2\pi k) = 1$ pour tout $k \in \mathbb{Z}$.

    **3.** Pour $t \neq 0$, $\varphi_{X_{n}}(t) = \frac{1}{n}\int_{0}^{n}\mathrm{e}^{itx}\,\mathrm{d} x = \boxed{\frac{\mathrm{e}^{int} - 1}{int}}$, de module $\big|\frac{\sin(nt/2)}{nt/2}\big| \leqslant \frac{2}{n|t|}$, qui tend vers $0$ ; et $\varphi_{X_{n}}(0) = 1$. Donc $\varphi_{X_{n}}$ converge simplement vers $\boxed{\Phi = \mathbf{1}_{\{0\}}}$.

    **4.** Une fonction caractéristique est continue (cours, prop. 7 (ii)), et $\Phi$ ne l'est pas en $0$ : 
    $$\boxed{\Phi \text{ n'est pas une fonction caractéristique}}.$$

    La masse s'échappe à l'infini : pour tout $A > 0$, $\mathbb{P}(X_{n} \leqslant A) = \frac{A}{n} \to 0$. Aucune loi limite ne peut recueillir cette masse. Le chapitre 8 reviendra sur ce phénomène : c'est la continuité de la limite en $0$ qui manque ici (théorème de Lévy).

    1.5em

    ![Figure](documents/figures/b2eec2acfb224c97.svg)

    Le module $\big|\frac{\sin(nt/2)}{nt/2}\big|$ de $\varphi_{X_{n}}$ pour $n = 1, 3, 10$ : le pic autour de $0$ s'amincit, sa largeur est de l'ordre de $\frac{1}{n}$, et la limite ne garde que le point $(0, 1)$, en rouge.
- id: "l3-pr-06-09"
  feuille: "f-l3-pr-06"
  numero: 9
  partie: "Fonctions caractéristiques"
  etoiles: 2
