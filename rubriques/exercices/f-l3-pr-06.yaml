  noeuds: [fo-caracteristiques]
  notions: [fonction-caracteristique]
  source: "Rubenthaler, chapitre 7, exercice 4 (a), (b), (c), (e)"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Une variable réelle $X$ est dite *symétrique* si $-X$ a la même loi que $X$.

    **1.** Si $X$ a une densité $f$, montrer que $X$ est symétrique si et seulement si $f(x) = f(-x)$ pour presque tout $x$. Donner deux exemples de lois symétriques, l'une discrète, l'autre à densité.

    **2.** Montrer que $X$ est symétrique si et seulement si $\varphi_{X}(t)$ est réel pour tout $t \in \mathbb{R}$.

    **3.** Soient $Y$ et $Y'$ indépendantes et de même loi. Montrer que $Y - Y'$ est symétrique, et que sa fonction caractéristique est $|\varphi_{Y}|^{2}$. En déduire que le module au carré d'une fonction caractéristique est une fonction caractéristique.
  corrige: |
    **1.** La variable $-X$ a pour densité $x \mapsto f(-x)$ (chapitre 4, prop. 9). Si $f(-x) = f(x)$ presque partout, $-X$ et $X$ ont la même densité, donc la même loi.

    Réciproquement, si $-X$ a la loi de $X$, les fonctions $f$ et $f(-\cdot)$ sont deux densités de la même loi : leurs intégrales sur tout borélien $B$ coïncident, donc $\int_{B}(f - g) = 0$ pour tout $B$ (avec $g = f(-\cdot)$), et en prenant $B = \{f > g\}$ puis $B = \{f < g\}$, on obtient $f = g$ presque partout.

    Exemples : la loi de Rademacher (discrète), la loi $\mathcal{N}(0, 1)$ (à densité).

    **2.** Si $X$ est symétrique, $\varphi_{X}$ est réelle (cours, prop. 7 (iv)).

    Réciproquement, si $\varphi_{X}(t) \in \mathbb{R}$ pour tout $t$, alors $\varphi_{-X}(t) = \varphi_{X}(-t) = \overline{\varphi_{X}(t)} = \varphi_{X}(t)$ : $-X$ et $X$ ont la même fonction caractéristique, donc la même loi (th. 1).

    **3.** Par indépendance (prop. 10) et la prop. 7, 
    $$\varphi_{Y - Y'}(t) = \varphi_{Y}(t)\,\varphi_{-Y'}(t) = \varphi_{Y}(t)\,\overline{\varphi_{Y}(t)} = \boxed{|\varphi_{Y}(t)|^{2}},$$
     réelle : $Y - Y'$ est symétrique par la question 2. On le voit aussi directement : $(Y, Y')$ et $(Y', Y)$ ont même loi, donc $Y - Y'$ et $Y' - Y$ aussi. Ainsi, 
    $$\boxed{|\varphi|^{2} \text{ est une fonction caractéristique}}$$
     dès que $\varphi$ en est une. Ce procédé de *symétrisation* permet souvent de se ramener à des lois symétriques.
- id: "l3-pr-06-10"
  feuille: "f-l3-pr-06"
  numero: 10
  partie: "Fonctions caractéristiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions caractéristiques]
  noeuds: [fo-caracteristiques]
  notions: [fonction-caracteristique]
  source: "Durand, exercice 4.17"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $\varphi$ la fonction caractéristique d'une variable $X$. On pose $g(0) = 1$ et $g(t) = \frac{1}{t}\int_{0}^{t}\varphi(u)\,\mathrm{d} u$ pour $t \neq 0$. Montrer que $g$ est une fonction caractéristique ; on pourra considérer une variable $U$ de loi uniforme sur $[0, 1]$, indépendante de $X$, et la variable $UX$. Que donne ce résultat lorsque $X = 1$ ?
  corrige: |
    Pour $t \in \mathbb{R}$, la fonction $(u, \omega) \mapsto \mathrm{e}^{ituX(\omega)}$ est bornée par $1$ ; par indépendance de $U$ et $X$ et le théorème de Fubini (la loi du couple est la loi produit), 
    $$\varphi_{UX}(t) = \mathbb{E}\big[\mathrm{e}^{itUX}\big] = \int_{0}^{1}\mathbb{E}\big[\mathrm{e}^{ituX}\big]\,\mathrm{d} u = \int_{0}^{1}\varphi(tu)\,\mathrm{d} u.$$
     Pour $t \neq 0$, le changement de variable $v = tu$ donne $\frac{1}{t}\int_{0}^{t}\varphi(v)\,\mathrm{d} v = g(t)$ ; pour $t = 0$, on obtient $1 = g(0)$. Donc $\boxed{g = \varphi_{UX}}$ est une fonction caractéristique.

    Pour $X = 1$, $\varphi(u) = \mathrm{e}^{iu}$ et $g(t) = \frac{\mathrm{e}^{it} - 1}{it}$ : c'est la fonction caractéristique de $U$, conformément à $UX = U$.
- id: "l3-pr-06-11"
  feuille: "f-l3-pr-06"
  numero: 11
  partie: "Fonctions caractéristiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonctions caractéristiques]
  noeuds: [fo-caracteristiques]
  notions: [fonction-caracteristique]
  source: "Durand, exercice 4.25"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    **1.** Soient $X_{1}$, $X_{2}$, … des variables indépendantes, de fonctions caractéristiques $\varphi_{1}$, $\varphi_{2}$, …, et $S_{n} = X_{1} + \dots + X_{n}$. On suppose que $S_{n}(\omega)$ converge vers une limite $S_{\infty}(\omega)$ pour tout $\omega$. Montrer que $\varphi_{S_{\infty}}(t) = \prod_{n = 1}^{+\infty}\varphi_{n}(t)$, au sens où les produits partiels convergent.

    **2.** En itérant $\sin t = 2\sin\frac{t}{2}\cos\frac{t}{2}$, montrer que $\frac{\sin t}{t} = \prod_{n = 1}^{+\infty}\cos\frac{t}{2^{n}}$ pour $t \neq 0$. Retrouver ce résultat par la question 1, avec des variables $X_{n}$ prenant les valeurs $\pm 2^{-n}$ avec probabilité $\frac{1}{2}$ ; quelle est la loi de $S_{\infty}$ ?

    **3.** On suppose que les $X_{n}$ suivent la loi $\mathcal{B}(\frac{1}{2})$, et l'on pose $X = 2\sum_{n = 1}^{+\infty}X_{n}3^{-n}$, variable qui suit la loi uniforme sur l'ensemble triadique de Cantor. Déterminer sa fonction caractéristique $\varphi$, et montrer que $\varphi$ prend la même valeur en tous les réels $3^{k}\pi$, $k \in \mathbb{N}$. La loi de $X$ peut-elle avoir une densité ?
  corrige: |
    **1.** Pour tout $t$, $\mathrm{e}^{itS_{n}} \to \mathrm{e}^{itS_{\infty}}$ en tout point de $\Omega$, avec $|\mathrm{e}^{itS_{n}}| = 1$. Par convergence dominée, $\varphi_{S_{n}}(t) \to \varphi_{S_{\infty}}(t)$. Or $\varphi_{S_{n}} = \prod_{k = 1}^{n}\varphi_{k}$ par indépendance (prop. 10) : les produits partiels convergent, et $\boxed{\varphi_{S_{\infty}} = \prod_{n \geqslant 1}\varphi_{n}}$.

    **2.** Par récurrence, $\sin t = 2^{n}\sin\frac{t}{2^{n}}\prod_{k = 1}^{n}\cos\frac{t}{2^{k}}$. Pour $t \neq 0$, $2^{n}\sin\frac{t}{2^{n}} \to t$, donc $\boxed{\frac{\sin t}{t} = \prod_{k \geqslant 1}\cos\frac{t}{2^{k}}}$.

    Avec $X_{n} = \pm 2^{-n}$ (probabilité $\frac{1}{2}$ chacun), $\varphi_{n}(t) = \cos\frac{t}{2^{n}}$, et la série $\sum X_{n}$ converge en tout point, puisque $|X_{n}| = 2^{-n}$. Écrivons $X_{n} = (2B_{n} - 1)2^{-n}$, avec $B_{n} \sim \mathcal{B}(\frac{1}{2})$ indépendantes : alors $S_{\infty} = 2\sum_{n}B_{n}2^{-n} - 1 = 2U - 1$, où $U = \sum_{n}B_{n}2^{-n}$ est uniforme sur $[0, 1]$, puisque ses chiffres binaires sont des pile ou face indépendants (chapitre 3, prop. 9). Donc $\boxed{S_{\infty} \sim \mathcal{U}([-1, 1])}$, de fonction caractéristique $\frac{\sin t}{t}$, et la question 1 redonne la formule.

    **3.** La série converge en tout point ($0 \leqslant 2X_{n}3^{-n} \leqslant 2 \cdot 3^{-n}$). La variable $2X_{n}3^{-n}$ a pour fonction caractéristique $\frac{1 + \mathrm{e}^{2it/3^{n}}}{2} = \mathrm{e}^{it/3^{n}}\cos\frac{t}{3^{n}}$. Par la question 1, et comme $\sum_{n \geqslant 1}3^{-n} = \frac{1}{2}$, 
    $$\boxed{\varphi(t) = \mathrm{e}^{it/2}\prod_{n \geqslant 1}\cos\frac{t}{3^{n}}}.$$
     Pour $t = 3^{k}\pi$, les $k$ premiers facteurs valent $\cos(3^{k - n}\pi) = -1$ ($3^{k - n}$ est impair), et les suivants forment le produit $C = \prod_{j \geqslant 1}\cos\frac{\pi}{3^{j}}$, qui ne dépend pas de $k$. Enfin $3^{k} \equiv (-1)^{k} \pmod 4$, donc $\mathrm{e}^{i3^{k}\pi/2} = i^{3^{k}}$ vaut $i$ si $k$ est pair et $-i$ si $k$ est impair. Dans les deux cas, 
    $$\varphi(3^{k}\pi) = i^{3^{k}}(-1)^{k}\,C = \boxed{i\,C}, \qquad C = \prod_{j \geqslant 1}\cos\frac{\pi}{3^{j}} \approx 0{,}4663.$$
     On a $C > 0$, car tous les facteurs sont dans $]0, 1]$ et $\sum_{j}\big(1 - \cos\frac{\pi}{3^{j}}\big) \leqslant \sum_{j}\frac{\pi^{2}}{2 \cdot 9^{j}} < +\infty$, de sorte que $\ln C$ est fini.

    Ainsi $\varphi(t)$ ne tend pas vers $0$ quand $t \to +\infty$. Or la fonction caractéristique d'une variable à densité tend vers $0$ (lemme de Riemann-Lebesgue, rappelé au cours, section 6.4) : 
    $$\boxed{\text{la loi de Cantor n'a pas de densité}}.$$
     Elle n'est pas non plus discrète : chaque point de l'ensemble de Cantor a au plus un développement triadique à chiffres $0$ et $2$, donc une probabilité nulle. C'est une loi *singulière*.

    1.5em

    ![Figure](documents/figures/d482bae39a1ee654.svg)

    Le module de la fonction caractéristique de la loi de Cantor sur $[0, 90]$. Il ne tend pas vers $0$ : il remonte à la même valeur $C \approx 0{,}466$ en chaque point $3^{k}\pi$ (en rouge), alors que la fonction caractéristique d'une loi à densité s'écrase à l'infini.
- id: "l3-pr-06-12"
  feuille: "f-l3-pr-06"
  numero: 12
  partie: "Perspective"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [théorème abélien]
  noeuds: [p-esperance]
  notions: [esperance]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soient $(a_{n})_{n \in \mathbb{N}}$ et $(b_{n})_{n \in \mathbb{N}}$ deux suites réelles, les $b_{n}$ étant strictement positifs. On suppose que la série $\sum b_{n}$ diverge, que la série entière $\sum b_{n}x^{n}$ a pour rayon de convergence $1$, et que $\frac{a_{n}}{b_{n}}$ tend vers une limite finie $\ell$. On pose 
    $$A_{n} = \sum_{k = 0}^{n}a_{k}, \qquad B_{n} = \sum_{k = 0}^{n}b_{k}, \qquad a(x) = \sum_{n = 0}^{+\infty}a_{n}x^{n}, \qquad b(x) = \sum_{n = 0}^{+\infty}b_{n}x^{n}.$$

    **1.** Montrer que $\frac{A_{n}}{B_{n}} \to \ell$ quand $n \to +\infty$.

    **2.** Montrer que $a$ est définie au moins sur $]-1, 1[$, et que $\frac{a(x)}{b(x)} \to \ell$ quand $x \to 1^{-}$.

    **3.** *Application.* Soit $X$ de loi $\mathbb{P}(X = n) = \frac{1}{n(n + 1)}$, $n \geqslant 1$. Vérifier que $\mathbb{E}[X] = +\infty$, puis montrer que $G_{X}'(x) \sim \ln\frac{1}{1 - x}$ quand $x \to 1^{-}$. Comparer avec la proposition 3 du cours.
  corrige: |
    **1.** Soit $\varepsilon > 0$, et $n_{0}$ tel que $|a_{n} - \ell b_{n}| \leqslant \varepsilon b_{n}$ pour $n \geqslant n_{0}$. Pour $n \geqslant n_{0}$, 
    $$|A_{n} - \ell B_{n}| \leqslant \sum_{k < n_{0}}|a_{k} - \ell b_{k}| + \varepsilon\sum_{k = n_{0}}^{n}b_{k} \leqslant K + \varepsilon B_{n},$$
     où $K$ ne dépend pas de $n$. Comme $B_{n} \to +\infty$, $\limsup_{n}\big|\frac{A_{n}}{B_{n}} - \ell\big| \leqslant \varepsilon$, pour tout $\varepsilon > 0$ : $\boxed{\frac{A_{n}}{B_{n}} \to \ell}$. C'est le théorème de Cesàro, pour la moyenne pondérée par les $b_{k}$.

    **2.** La suite $\frac{a_{n}}{b_{n}}$ converge, donc est bornée par un réel $M$ : $|a_{n}x^{n}| \leqslant Mb_{n}|x|^{n}$, et $a(x)$ converge absolument pour $|x| < 1$.

    Pour $x \in [0, 1[$, $b(x) \geqslant \sum_{k \leqslant N}b_{k}x^{k}$, qui tend vers $B_{N}$ quand $x \to 1^{-}$ ; donc $b(x) \to +\infty$. Le même découpage qu'à la question 1 donne $|a(x) - \ell b(x)| \leqslant K + \varepsilon b(x)$ pour $x \in [0, 1[$, d'où $\boxed{\frac{a(x)}{b(x)} \to \ell}$ quand $x \to 1^{-}$. C'est le théorème d'Abel : de la convergence des coefficients on déduit celle de la fonction au bord. La réciproque, qui irait de la fonction vers les coefficients, est un théorème *taubérien* ; elle est fausse sans hypothèse supplémentaire.

    **3.** $\mathbb{E}[X] = \sum_{n \geqslant 1}\frac{n}{n(n + 1)} = \sum_{n \geqslant 1}\frac{1}{n + 1} = \boxed{+\infty}$. Puis 
    $$G_{X}'(x) = \sum_{n \geqslant 1}\frac{n\,x^{n - 1}}{n(n + 1)} = \sum_{n \geqslant 0}\frac{x^{n}}{n + 2}.$$
     Prenons $a_{n} = \frac{1}{n + 2}$ et $b_{n} = \frac{1}{n + 1}$ : $\sum b_{n}$ diverge, le rayon vaut $1$, $\frac{a_{n}}{b_{n}} \to 1$, et $b(x) = -\frac{\ln(1 - x)}{x}$. La question 2 donne 
    $$\boxed{G_{X}'(x) \sim -\frac{\ln(1 - x)}{x} \sim \ln\frac{1}{1 - x}} \qquad (x \to 1^{-}).$$
     On peut le vérifier sur la forme explicite $G_{X}(x) = 1 + \frac{(1 - x)\ln(1 - x)}{x}$, obtenue en écrivant $\frac{1}{n(n + 1)} = \frac{1}{n} - \frac{1}{n + 1}$.

    La prop. 3 du cours, complétée par l'exercice 1, dit seulement que $G_{X}'(x) \to \mathbb{E}[X] = +\infty$ ; le théorème d'Abel précise la vitesse de divergence, ici logarithmique, à partir du comportement des probabilités $\mathbb{P}(X = n) \sim \frac{1}{n^{2}}$.

