  notions: [esperance, loi-variable, coefficient-binomial]
  source: "Bordeaux, TD 2, exercice 5 (2) ; Durand, exercice 4.26 ; Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 30 (ESCP 2018)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soient $N$ une variable à valeurs dans $\mathbb{N}$ et $(U_{k})_{k \geqslant 1}$ une suite de variables de loi $\mathcal{B}(p)$, toutes indépendantes. On pose $X = \sum_{k = 1}^{N}U_{k}$ et $Y = N - X$.

    **1.** On suppose $N \sim \mathcal{P}(\lambda)$. Déterminer la loi de $X$ à l'aide de l'exercice 3. *Application* : le nombre d'œufs d'une ponte suit $\mathcal{P}(\lambda)$, et chaque œuf éclôt avec probabilité $p$, indépendamment des autres ; quelle est la loi du nombre de naissances ?

    **2.** On appelle série génératrice du couple $(X, Y)$ la fonction $H(u, v) = \mathbb{E}[u^{X}v^{Y}]$, pour $u, v \in [-1, 1]$. Montrer que $H(u, v) = G_{N}(pu + qv)$. Pour $N \sim \mathcal{P}(\lambda)$, en déduire que $X$ et $Y$ sont indépendantes. On admettra que $H$ caractérise la loi du couple, ses coefficients $\mathbb{P}(X = k, Y = l)$ s'obtenant par dérivation en $(0, 0)$ comme à la proposition 1.

    **3.** Réciproquement, on ne suppose plus $N$ de loi de Poisson, mais on suppose $X$ et $Y$ indépendantes.

    **(a)** Vérifier que $\mathbb{P}(X = k, Y = l) = \binom{k + l}{k}p^{k}q^{l}\,\mathbb{P}(N = k + l)$ pour $k, l \in \mathbb{N}$, puis que 
    $$(k + 1)\,\mathbb{P}(X = k + 1)\,\mathbb{P}(Y = l)\,q = (l + 1)\,\mathbb{P}(X = k)\,\mathbb{P}(Y = l + 1)\,p.$$

    **(b)** En déduire que $X$ et $Y$ suivent des lois de Poisson, puis que $N$ suit une loi de Poisson.
  corrige: |
    **1.** Par l'exercice 3, $G_{X}(s) = G_{N}(q + ps) = \mathrm{e}^{\lambda(q + ps - 1)} = \mathrm{e}^{\lambda p(s - 1)}$ : $\boxed{X \sim \mathcal{P}(\lambda p)}$. Le nombre de naissances suit donc la loi $\mathcal{P}(\lambda p)$.

    **2.** Sachant $N = n$, $X$ suit $\mathcal{B}(n, p)$ et $Y = n - X$ ; par le calcul de l'exercice 3, 
    $$\mathbb{E}\big[u^{X}v^{Y}\mathbf{1}_{\{N = n\}}\big] = \mathbb{P}(N = n)\sum_{k = 0}^{n}\binom{n}{k}(pu)^{k}(qv)^{n - k} = \mathbb{P}(N = n)\,(pu + qv)^{n},$$
     et en sommant, $\boxed{H(u, v) = G_{N}(pu + qv)}$. Pour $N \sim \mathcal{P}(\lambda)$, 
    $$H(u, v) = \mathrm{e}^{\lambda(pu + qv - 1)} = \mathrm{e}^{\lambda p(u - 1)}\,\mathrm{e}^{\lambda q(v - 1)}.$$
     C'est la série génératrice d'un couple $(X', Y')$ de variables indépendantes de lois $\mathcal{P}(\lambda p)$ et $\mathcal{P}(\lambda q)$ : $\mathbb{E}[u^{X'}v^{Y'}] = G_{X'}(u)G_{Y'}(v)$. Comme $H$ caractérise la loi du couple, $(X, Y)$ a la loi de $(X', Y')$ : 
    $$\boxed{X \text{ et } Y \text{ sont indépendantes, de lois } \mathcal{P}(\lambda p) \text{ et } \mathcal{P}(\lambda q)}.$$
     On retrouve le résultat de la feuille 5 (exercice 8) sans sommation.

    **3.(a)** L'évènement $\{X = k, Y = l\}$ est $\{N = k + l, X = k\}$, et sachant $N = k + l$, $X$ suit $\mathcal{B}(k + l, p)$ : d'où la première formule. Pour la seconde, les deux membres valent, d'après elle, $(k + 1)\binom{k + l + 1}{k + 1}$ et $(l + 1)\binom{k + l + 1}{k}$ fois $p^{k + 1}q^{l + 1}\mathbb{P}(N = k + l + 1)$. Or 
    $$(k + 1)\binom{k + l + 1}{k + 1} = \frac{(k + l + 1)!}{k!\,l!} = (l + 1)\binom{k + l + 1}{k},$$
     donc $(k + 1)\mathbb{P}(X = k + 1, Y = l)\,q = (l + 1)\mathbb{P}(X = k, Y = l + 1)\,p$, et l'indépendance permet d'écrire les probabilités conjointes comme des produits.

    **(b)** Choisissons $l_{0}$ tel que $\mathbb{P}(Y = l_{0}) > 0$, et posons $c = \frac{p}{q} \cdot \frac{(l_{0} + 1)\mathbb{P}(Y = l_{0} + 1)}{\mathbb{P}(Y = l_{0})} \geqslant 0$. La relation donne $(k + 1)\mathbb{P}(X = k + 1) = c\,\mathbb{P}(X = k)$ pour tout $k$, donc $\mathbb{P}(X = k) = \mathbb{P}(X = 0)\frac{c^{k}}{k!}$, et la somme vaut $1$ si et seulement si $\mathbb{P}(X = 0) = \mathrm{e}^{-c}$ : $\boxed{X \sim \mathcal{P}(c)}$ (masse de Dirac en $0$ si $c = 0$).

    De même, avec $k_{0}$ tel que $\mathbb{P}(X = k_{0}) > 0$, $(l + 1)\mathbb{P}(Y = l + 1) = c'\mathbb{P}(Y = l)$, et $\boxed{Y \sim \mathcal{P}(c')}$. En reportant dans la relation, $c\,q = c'\,p$.

    Enfin $N = X + Y$, somme de deux variables de Poisson indépendantes : $\boxed{N \sim \mathcal{P}(c + c')}$, et, avec $\lambda = c + c'$, on a $c = \lambda p$ et $c' = \lambda q$. *Conclusion.* L'amincissement d'une variable $N$ ne produit deux comptages indépendants que si $N$ suit une loi de Poisson : c'est une caractérisation de cette loi.
- id: "l3-pr-06-05"
  feuille: "f-l3-pr-06"
  numero: 5
  partie: "Séries génératrices"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [séries génératrices]
  noeuds: [p-esperance, p-independance]
  notions: [esperance, loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 28 (ESCP 2017)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On admet que $\int_{0}^{+\infty}\frac{\sin t}{t}\,\mathrm{d} t$ converge et vaut $\frac{\pi}{2}$.

    **1.** Montrer que, pour tout $n \in \mathbb{N}$, l'intégrale $u_{n} = \int_{0}^{+\infty}\frac{1 - \cos^{n}t}{t^{2}}\,\mathrm{d} t$ converge, et que $u_{1} = \frac{\pi}{2}$.

    **2.** Montrer que $\int_{0}^{+\infty}\frac{1 - \cos(st)}{t^{2}}\,\mathrm{d} t = \frac{\pi}{2}|s|$ pour tout $s \in \mathbb{R}$. En déduire $u_{2}$, à l'aide de $\cos^{2}t = \frac{1}{2}(1 + \cos 2t)$.

    **3.** Soient $X_{1}$, $X_{2}$, … indépendantes, de loi $\mathbb{P}(X_{k} = 1) = \mathbb{P}(X_{k} = -1) = \frac{1}{2}$, et $S_{n} = X_{1} + \dots + X_{n}$. Déterminer $\varphi_{S_{n}}$, puis montrer que 
    $$\mathbb{E}\big[|S_{n}|\big] = \frac{2}{\pi}\,u_{n}.$$

    **4.** Calculer directement $\mathbb{E}[|S_{n}|]$ pour $n = 1, 2, 3$. Comparer avec les questions 1 et 2, et en déduire la valeur de $u_{3}$.
  corrige: |
    **1.** La fonction $t \mapsto \frac{1 - \cos^{n}t}{t^{2}}$ est continue sur $]0, +\infty[$, se prolonge par continuité en $0$ (car $\cos^{n}t = 1 - \frac{nt^{2}}{2} + o(t^{2})$, la limite est $\frac{n}{2}$), et elle est majorée par $\frac{2}{t^{2}}$, intégrable en $+\infty$ : $u_{n}$ converge.

    Pour $n = 1$, intégrons par parties sur $[\varepsilon, A]$ avec $\big(-\frac{1}{t}\big)' = \frac{1}{t^{2}}$ : 
    $$\int_{\varepsilon}^{A}\frac{1 - \cos t}{t^{2}}\,\mathrm{d} t = \Big[-\frac{1 - \cos t}{t}\Big]_{\varepsilon}^{A} + \int_{\varepsilon}^{A}\frac{\sin t}{t}\,\mathrm{d} t.$$
     Le crochet tend vers $0$ quand $\varepsilon \to 0$ et $A \to +\infty$ ($1 - \cos t \leqslant \frac{t^{2}}{2}$ et $\leqslant 2$), d'où $\boxed{u_{1} = \frac{\pi}{2}}$.

    **2.** Pour $s > 0$, le changement de variable $u = st$ donne 
    $$\int_{0}^{+\infty}\frac{1 - \cos(st)}{t^{2}}\,\mathrm{d} t = s\int_{0}^{+\infty}\frac{1 - \cos u}{u^{2}}\,\mathrm{d} u = \frac{\pi}{2}s.$$
     L'intégrale est paire en $s$ et nulle pour $s = 0$ : elle vaut $\boxed{\frac{\pi}{2}|s|}$.

    Comme $1 - \cos^{2}t = \frac{1 - \cos 2t}{2}$, on obtient $u_{2} = \frac{1}{2} \cdot \frac{\pi}{2} \cdot 2 = \boxed{\frac{\pi}{2}}$.

    **3.** $\varphi_{X_{k}}(t) = \frac{1}{2}(\mathrm{e}^{it} + \mathrm{e}^{-it}) = \cos t$, et par la prop. 10 du cours, $\boxed{\varphi_{S_{n}}(t) = \cos^{n}t}$ ; elle est réelle, donc $\mathbb{E}[\cos(tS_{n})] = \cos^{n}t$.

    Par la question 2, $|x| = \frac{2}{\pi}\int_{0}^{+\infty}\frac{1 - \cos(xt)}{t^{2}}\,\mathrm{d} t$ pour tout réel $x$. Appliquons-le à $x = S_{n}(\omega)$ et prenons l'espérance ; l'intégrande est positif, et le théorème de Fubini-Tonelli permet d'échanger espérance et intégrale : 
    $$\mathbb{E}\big[|S_{n}|\big] = \frac{2}{\pi}\int_{0}^{+\infty}\frac{1 - \mathbb{E}[\cos(tS_{n})]}{t^{2}}\,\mathrm{d} t = \boxed{\frac{2}{\pi}\,u_{n}}.$$
     On retrouve ainsi $\mathbb{E}|S_{n}|$ à partir de la seule fonction caractéristique, alors que $|x|$ n'est pas une fonction « simple » de $\mathrm{e}^{itx}$.

    **4.** $S_{1} = \pm 1$, donc $\mathbb{E}|S_{1}| = 1$ ; $S_{2} \in \{-2, 0, 2\}$ avec probabilités $\frac{1}{4}, \frac{1}{2}, \frac{1}{4}$, donc $\mathbb{E}|S_{2}| = 1$ ; $S_{3} \in \{\pm 1, \pm 3\}$ avec $\mathbb{P}(|S_{3}| = 3) = \frac{1}{4}$, donc $\mathbb{E}|S_{3}| = \frac{3}{4} + \frac{3}{4} = \frac{3}{2}$. Les deux premières valeurs redonnent $u_{1} = u_{2} = \frac{\pi}{2}$, et la troisième donne $\boxed{u_{3} = \frac{3\pi}{4}}$, ce que confirme une intégration numérique.

    1.5em

    ![Figure](documents/figures/0e8e6a7e2047203d.svg)

    Les valeurs exactes de $\mathbb{E}|S_{n}| = \frac{2}{\pi}u_{n}$ pour $n \leqslant 30$, en marches d'escalier ($\mathbb{E}|S_{2k}| = \mathbb{E}|S_{2k - 1}|$), et la courbe $\sqrt{2n/\pi}$, qu'elles suivent de près ($4{,}334$ contre $4{,}370$ pour $n = 30$). Cet équivalent, qui dit que la marche s'éloigne de l'origine comme $\sqrt{n}$, sera justifié par le théorème central limite (chapitre 9).
