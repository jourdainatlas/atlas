  notions: [esperance, loi-variable]
  source: "Annales ESCP-HEC (TD « Vecteurs aléatoires discrets »), exercice 14 (ESCP 2011) ; Bordeaux, TD 2, exercice 5 (1)"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soient $N$, $X_{1}$, $X_{2}$, … des variables indépendantes à valeurs dans $\mathbb{N}$, les $X_{k}$ ayant toutes la loi d'une même variable $X$. On pose $S = \sum_{k = 1}^{N}X_{k}$, c'est-à-dire $S(\omega) = X_{1}(\omega) + \dots + X_{N(\omega)}(\omega)$, avec $S = 0$ si $N = 0$.

    **1.** En utilisant la formule des probabilités totales selon les valeurs de $N$, montrer que $G_{S} = G_{N} \circ G_{X}$ sur $[-1, 1]$.

    **2.** On suppose $N$ et $X$ de carré intégrable. En déduire les *formules de Wald* 
    $$\mathbb{E}[S] = \mathbb{E}[N]\,\mathbb{E}[X], \qquad \operatorname{Var}(S) = \mathbb{E}[N]\operatorname{Var}(X) + \operatorname{Var}(N)\,\mathbb{E}[X]^{2}.$$

    **3.** Une urne contient $n$ jetons numérotés de $1$ à $n$. Un joueur tire un jeton, puis lance une pièce, qui donne pile avec probabilité $p$, autant de fois que le numéro tiré. Calculer l'espérance et la variance du nombre de piles obtenus.

    **4.** On suppose $N \sim \mathcal{B}(n, \pi)$ et $X \sim \mathcal{B}(p)$. Déterminer la loi de $S$, et l'interpréter.
  corrige: |
    **1.** Pour $s \in [-1, 1]$, la variable $s^{S}$ est bornée, et $s^{S}\mathbf{1}_{\{N = n\}} = s^{X_{1} + \dots + X_{n}}\mathbf{1}_{\{N = n\}}$. Comme $N$ est indépendante de $(X_{1}, \dots, X_{n})$ (cours du chapitre 5, prop. 3), puis par la prop. 2, 
    $$\mathbb{E}\big[s^{S}\mathbf{1}_{\{N = n\}}\big] = \mathbb{E}\big[s^{X_{1} + \dots + X_{n}}\big]\,\mathbb{P}(N = n) = G_{X}(s)^{n}\,\mathbb{P}(N = n).$$
     En sommant sur $n$ (convergence dominée, $|s^{S}| \leqslant 1$), on obtient $G_{S}(s) = \sum_{n}\mathbb{P}(N = n)\,G_{X}(s)^{n}$, et comme $|G_{X}(s)| \leqslant 1$, 
    $$\boxed{G_{S} = G_{N} \circ G_{X}}.$$

    **2.** Pour $s \in [0, 1[$, $G_{X}(s) \in [0, 1[$ et l'on peut dériver la composée : 
    $$G_{S}'(s) = G_{N}'(G_{X}(s))\,G_{X}'(s), \qquad G_{S}''(s) = G_{N}''(G_{X}(s))\,G_{X}'(s)^{2} + G_{N}'(G_{X}(s))\,G_{X}''(s).$$
     Quand $s \to 1^{-}$, $G_{X}(s) \to 1^{-}$, et l'exercice 1 (2) donne les limites de toutes ces dérivées. Notons $m = \mathbb{E}[X]$. On obtient $\mathbb{E}[S] = \mathbb{E}[N]\,m$, et 
    $$\mathbb{E}[S(S - 1)] = \mathbb{E}[N(N - 1)]\,m^{2} + \mathbb{E}[N]\,\mathbb{E}[X(X - 1)] < +\infty.$$
     Alors $\operatorname{Var}(S) = \mathbb{E}[S(S - 1)] + \mathbb{E}[S] - \mathbb{E}[S]^{2}$ ; en développant, 
    $$\operatorname{Var}(S) = \big(\mathbb{E}[N^{2}] - \mathbb{E}[N]^{2}\big)m^{2} + \mathbb{E}[N]\big(\mathbb{E}[X^{2}] - m^{2}\big) = \boxed{\operatorname{Var}(N)\,\mathbb{E}[X]^{2} + \mathbb{E}[N]\operatorname{Var}(X)}.$$
     *Interprétation.* La dispersion de $S$ a deux origines : celle de chaque terme ($\mathbb{E}[N]$ termes en moyenne, de variance $\operatorname{Var}(X)$), et celle du nombre de termes, chacun valant $m$ en moyenne.

    **3.** Ici $N$ est uniforme sur $\llbracket 1, n\rrbracket$ et $X \sim \mathcal{B}(p)$. Par l'exercice 1 et la question 2, 
    $$\boxed{\mathbb{E}[S] = \frac{(n + 1)p}{2}}, \qquad \boxed{\operatorname{Var}(S) = \frac{(n + 1)pq}{2} + \frac{(n^{2} - 1)p^{2}}{12}}.$$

    **4.** $G_{S}(s) = G_{N}(q + ps) = \big(1 - \pi + \pi(q + ps)\big)^{n} = (1 - p\pi + p\pi s)^{n}$, donc $\boxed{S \sim \mathcal{B}(n, p\pi)}$ (prop. 1). *Interprétation.* Chacun de $n$ objets est d'abord retenu avec probabilité $\pi$, puis, s'il l'est, compté avec probabilité $p$ : il est compté avec probabilité $p\pi$, indépendamment des autres.
- id: "l3-pr-06-04"
