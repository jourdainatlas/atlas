- id: "l3-cd-06-01"
  feuille: "f-l3-cd-06"
  numero: 1
  partie: "Résolution explicite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *(Ordre et linéarité.)* Donner l'ordre de chacune des équations différentielles suivantes, et dire si elle est linéaire ou non, autonome ou non : 
    $$\text{(a) } x^{2}y''(x) - 4xy'(x) + y(x) = \sin x ; \qquad \text{(b) } y^{(3)}(x) - \Big(1 + y(x) + \frac{(y'(x))^{2}}{3}\Big)y'(x) + 5y(x) = 0 ;$$

    $$\text{(c) } \big(y(x)^{3} + y(x) - 1\big) - xy'(x) = 0 ; \qquad \text{(d) } \frac{\mathrm{d}^{2}y}{\mathrm{d} x^{2}} = \sqrt{1 + \Big(\frac{\mathrm{d} y}{\mathrm{d} x}\Big)^{2}}.$$
  corrige: |
    L'ordre est celui de la plus haute dérivée de l'inconnue ; l'équation est linéaire si elle est affine en $(y, y', \dots)$, autonome si la variable n'y figure pas explicitement.

    $$\begin{array}{|c|c|c|c|l|} \hline  & \text{ordre} & \text{linéaire} & \text{autonome} & \text{raison} \\ \hline \text{(a)} & 2 & \text{oui} & \text{non} & \text{coefficients }x^{2}\text{, }-4x\text{ et second membre }\sin x \\  \text{(b)} & 3 & \text{non} & \text{oui} & \text{termes }yy'\text{ et }(y')^{3} \\  \text{(c)} & 1 & \text{non} & \text{non} & \text{terme }y^{3}\text{, coefficient }x\text{ devant }y' \\  \text{(d)} & 2 & \text{non} & \text{oui} & \text{la racine n'est pas affine en }y' \\ \hline \end{array}$$

    Le piège le plus courant est de confondre linéarité et coefficients constants : (a) est linéaire alors que ses coefficients varient.
- id: "l3-cd-06-02"
  feuille: "f-l3-cd-06"
  numero: 2
  partie: "Résolution explicite"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *(Équations linéaires scalaires du premier ordre.)* Soit $I$ un intervalle de $\mathbb{R}$ et $a$, $f : I \to \mathbb{R}$ continues. On considère l'équation 
    $$(1) \qquad y'(t) = a(t)y(t) + f(t), \qquad t \in I.$$

    **1.** Soit $t_{0} \in I$ et $y_{0} \in \mathbb{R}$. Montrer que la fonction définie sur $I$ par 
    $$(2) \qquad y(t) = e^{\int_{t_{0}}^{t}a(s)\,\mathrm{d} s}\,y_{0} + \int_{t_{0}}^{t}e^{\int_{s}^{t}a(\sigma)\,\mathrm{d}\sigma}f(s)\,\mathrm{d} s$$
     est solution de (1) sur $I$ et vérifie $y(t_{0}) = y_{0}$. C'est la *formule de Duhamel*.

    **2.** Retrouver la formule de Duhamel par la méthode de variation de la constante.

    **3.** *Exemples.*

    **(a)** Résoudre le problème $y'(t) + \dfrac{y(t)}{t^{2}} = -\dfrac{1}{t^{3}}$ sur $]0, +\infty[$, avec $y(1) = 1$.

    **(b)** Résoudre les équations suivantes, en précisant l'intervalle de définition des solutions maximales : $(1 - t^{2})y'(t) + ty(t) = 3t$ sur $\mathbb{R}$ ; $(\sin t)y'(t) + (\cos t)y(t) = 1$ sur $]-\pi, \pi[$.
  corrige: |
    On note $A(t) = \int_{t_{0}}^{t}a(s)\,\mathrm{d} s$, de sorte que $\int_{s}^{t}a(\sigma)\,\mathrm{d}\sigma = A(t) - A(s)$.

    $\triangleright$ *Vérification.* La formule s'écrit $y(t) = e^{A(t)}\Big(y_{0} + \int_{t_{0}}^{t}e^{-A(s)}f(s)\,\mathrm{d} s\Big)$. Le produit est dérivable (cours, prop. 1), et 
    $$y'(t) = a(t)e^{A(t)}\Big(y_{0} + \int_{t_{0}}^{t}e^{-A(s)}f(s)\,\mathrm{d} s\Big) + e^{A(t)}e^{-A(t)}f(t) = a(t)y(t) + f(t).$$
     De plus $y(t_{0}) = y_{0}$ puisque $A(t_{0}) = 0$.

    $\triangleright$ *Variation de la constante.* Les solutions de l'équation homogène $y' = ay$ sont les $Ce^{A}$. On cherche $y = C(t)e^{A(t)}$ : alors $y' = ay + C'e^{A}$, et $y$ est solution si et seulement si $C' = e^{-A}f$, soit $C(t) = y_{0} + \int_{t_{0}}^{t}e^{-A(s)}f(s)\,\mathrm{d} s$ : on retrouve (2). Ce calcul prouve aussi l'unicité, puisque toute solution s'écrit $Ce^{A}$ avec $C = ye^{-A}$ de dérivée imposée.

    $\triangleright$ *Exemple (a).* Ici $a(t) = -\dfrac{1}{t^{2}}$, $A(t) = \dfrac{1}{t} - 1$ et $f(t) = -\dfrac{1}{t^{3}}$. Une primitive de $e^{-1/s}\Big(-\dfrac{1}{s^{3}}\Big)$ s'obtient par le changement $u = \dfrac{1}{s}$ ; on trouve plus vite une solution particulière en essayant $y = \alpha + \dfrac{\beta}{t}$ : $-\dfrac{\beta}{t^{2}} + \dfrac{\alpha}{t^{2}} + \dfrac{\beta}{t^{3}} = -\dfrac{1}{t^{3}}$ donne $\beta = -1$, $\alpha = -1$. La condition $y(1) = 1$ fixe la constante : 
    $$\boxed{y(t) = 3e^{\frac{1}{t} - 1} - 1 - \frac{1}{t}, \qquad t > 0.}$$
     Quand $t \to +\infty$, $y(t) \to \dfrac{3}{e} - 1 \approx 0{,}10$ : la solution se stabilise, parce que le coefficient $\dfrac{1}{t^{2}}$ s'éteint.

    $\triangleright$ *Exemple (b), première équation.* Elle s'écrit $y' = -\dfrac{t}{1 - t^{2}}y + \dfrac{3t}{1 - t^{2}}$ sur chacun des intervalles $]-\infty, -1[$, $]-1, 1[$, $]1, +\infty[$. La constante $3$ est solution, et l'équation homogène a pour solutions $C\sqrt{|1 - t^{2}|}$, car $\Big(\ln\sqrt{|1 - t^{2}|}\Big)' = -\dfrac{t}{1 - t^{2}}$. Sur chacun des trois intervalles, les solutions sont donc $3 + C\sqrt{|1 - t^{2}|}$. En $t = \pm 1$, l'équation impose $\pm y(\pm 1) = \pm 3$, soit $y(\pm 1) = 3$ ; une solution définie au voisinage de $1$ s'écrit $3 + C_{1}\sqrt{1 - t^{2}}$ à gauche et $3 + C_{2}\sqrt{t^{2} - 1}$ à droite, et elle n'est dérivable en $1$ que si $C_{1} = C_{2} = 0$ (sinon la pente est infinie). Les solutions maximales sont donc 
    $$\boxed{y = 3 \text{ sur } \mathbb{R}, \quad \text{et } y = 3 + C\sqrt{|1 - t^{2}|},\ C \neq 0, \text{ sur l'un des trois intervalles.}}$$

    $\triangleright$ *Exemple (b), seconde équation.* Le premier membre est la dérivée de $y\sin t$ : $(y\sin t)' = 1$, donc $y(t)\sin t = t + C$. Sur $]0, \pi[$ et sur $]-\pi, 0[$, $y = \dfrac{t + C}{\sin t}$. En $t = 0$, l'équation impose $y(0) = 1$, et une solution définie en $0$ vérifie $0 = y(0)\sin 0 = C$ : seule $C = 0$ se prolonge, en $\dfrac{t}{\sin t} = 1 + \dfrac{t^{2}}{6} + o(t^{2})$, fonction de classe $\mathcal{C}^{\infty}$ sur $]-\pi, \pi[$. Les solutions maximales sont 
    $$\boxed{y = \frac{t}{\sin t} \text{ sur } ]-\pi, \pi[ \text{ (prolongée par } 1 \text{ en } 0), \quad \text{et } y = \frac{t + C}{\sin t},\ C \neq 0, \text{ sur } ]0, \pi[ \text{ ou } ]-\pi, 0[.}$$
     Comme dans le premier exemple, la formule de Duhamel ne s'applique qu'où le coefficient de $y'$ ne s'annule pas ; aux points singuliers, il faut étudier le raccord à la main.
- id: "l3-cd-06-03"
  feuille: "f-l3-cd-06"
  numero: 3
  partie: "Résolution explicite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Pour chacune des équations suivantes, où $y = y(x)$ est réelle, décrire les solutions en précisant leur intervalle maximal de définition, et dessiner les trajectoires : 
    $$\text{(i) } y' = e^{-y} ; \qquad \text{(ii) } y' - y = e^{x} ; \qquad \text{(iii) } xy' - 2y = 0.$$

    **2.** Quelles sont les courbes isoclines de l'équation $y' = y^{2} - x$ ? En déduire l'allure des trajectoires.
  corrige: |
    $\triangleright$ *(i) $y' = e^{-y}$.* L'équation s'écrit $(e^{y})' = e^{y}y' = 1$, donc $e^{y} = x + C$ et $\boxed{y = \ln(x + C) \text{ sur } ]-C, +\infty[}$. Les solutions sont les translatées horizontales d'un même graphe ; elles explosent vers $-\infty$ à gauche, avec une pente infinie, et croissent indéfiniment à droite.

    $\triangleright$ *(ii) $y' - y = e^{x}$.* Par la formule de Duhamel (exercice 2), $\boxed{y = (x + C)e^{x} \text{ sur } \mathbb{R}}$. Toutes tendent vers $0$ en $-\infty$ et vers $+\infty$ en $+\infty$.

    $\triangleright$ *(iii) $xy' - 2y = 0$.* Sur $]0, +\infty[$ et sur $]-\infty, 0[$, l'équation équivaut à $y' = \dfrac{2y}{x}$, de solutions $Cx^{2}$. Une solution sur $\mathbb{R}$ vaut $ax^{2}$ pour $x > 0$ et $bx^{2}$ pour $x < 0$ ; elle est continue et dérivable en $0$, de dérivée nulle, quels que soient $a$ et $b$, et l'équation y est vérifiée. Les solutions maximales sont donc 
    $$\boxed{y(x) = ax^{2} \ (x \geqslant 0), \quad y(x) = bx^{2} \ (x \leqslant 0), \qquad a, b \in \mathbb{R},}$$
     toutes définies sur $\mathbb{R}$. Par le point $(0, 0)$ en passe une infinité, et par un point $(0, y_{0})$ avec $y_{0} \neq 0$ aucune : en $x = 0$, le coefficient de $y'$ s'annule et le théorème de Cauchy-Lipschitz ne s'applique pas à la forme $xy' = 2y$.

    ![Figure](documents/figures/2807a8f03aa3efab.svg)

    Pour (i), les courbes sont translatées les unes des autres et plongent verticalement vers $-\infty$ à leur extrémité gauche ; pour (ii), elles se resserrent vers $0$ en $-\infty$. En (iii), la solution rouge est faite de deux demi-paraboles différentes recollées en $0$ : toutes les courbes passent par l'origine, signe de l'absence d'unicité.

    $\triangleright$ *Isoclines de $y' = y^{2} - x$.* L'isocline de pente $m$ est la parabole $x = y^{2} - m$ : ce sont les translatées horizontales de $x = y^{2}$. L'isocline $m = 0$ sépare la région $x < y^{2}$, où les solutions croissent, de la région $x > y^{2}$, où elles décroissent ; les solutions y traversent l'isocline avec une tangente horizontale. À droite, une solution qui entre dans la région intérieure $x > y^{2}$ par sa branche supérieure y décroît, puis suit la branche inférieure $y \approx -\sqrt{x}$ ; une solution qui reste au-dessus de la branche supérieure croît de plus en plus vite et explose, comme celles de $y' = y^{2}$.

    ![Figure](documents/figures/763d2b053300eab7.svg)

    Les petits segments violets indiquent la pente $m$ commune à chaque isocline. Les solutions qui passent sous la parabole $x = y^{2}$ sont capturées par sa branche inférieure ; les autres explosent vers $+\infty$ en un temps fini.
- id: "l3-cd-06-04"
  feuille: "f-l3-cd-06"
  numero: 4
  partie: "Résolution explicite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Séparation des variables.)* Résoudre les équations différentielles suivantes. Donner les solutions maximales et dire si elles sont globales. 
    $$\text{(a) } y(t)y'(t) = -t, \ t \in \mathbb{R} ; \qquad \text{(b) } y'(t) = \frac{1}{t^{2}}\,y(t)\big(y(t) - 1\big), \ t > 0 ; \qquad \text{(c) } y'(t) = \big(y(t) + 3t\big)^{3} - 3, \ t \in \mathbb{R}.$$
     Pour (b) et (c), trouver la ou les solutions maximales vérifiant de plus $y(1) = 3$.
  corrige: |
    $\triangleright$ *(a) $yy' = -t$.* C'est $(y^{2})' = -2t$, donc $y^{2} = C - t^{2}$ avec $C > 0$ (il faut $y \neq 0$ pour écrire $y' = -\dfrac{t}{y}$). Les solutions maximales sont 
    $$\boxed{y = \sqrt{C - t^{2}} \ \text{ ou } \ y = -\sqrt{C - t^{2}} \ \text{ sur } ]-\sqrt{C}, \sqrt{C}[,}$$
     des demi-cercles ; aucune n'est globale. Aux bornes, $y \to 0$ et $y'$ devient infinie : la courbe atteint le bord $y = 0$ du domaine où l'équation se résout en $y'$.

    $\triangleright$ *(b) $y' = \dfrac{1}{t^{2}}y(y - 1)$.* Les constantes $0$ et $1$ sont solutions ; par unicité (cours, th. 5, le second membre étant de classe $\mathcal{C}^{1}$ sur $]0, +\infty[ \times \mathbb{R}$), une autre solution ne prend jamais ces valeurs, et l'on peut séparer : 
    $$\frac{\mathrm{d} y}{y(y - 1)} = \frac{\mathrm{d} t}{t^{2}} \ \Longrightarrow \ \ln\left|\frac{y - 1}{y}\right| = -\frac{1}{t} + K \ \Longrightarrow \ y(t) = \frac{1}{1 - \lambda e^{-1/t}}, \quad \lambda \neq 0.$$
     La valeur $\lambda = 0$ redonne la solution $1$. Comme $e^{-1/t}$ croît de $0$ à $1$ sur $]0, +\infty[$, le dénominateur ne s'annule pas si $\lambda \leqslant 1$ : la solution est globale. Si $\lambda > 1$, il s'annule en $t^{*} = \dfrac{1}{\ln\lambda}$, et l'on obtient deux solutions maximales, sur $]0, t^{*}[$ et sur $]t^{*}, +\infty[$. Pour $y(1) = 3$, $\lambda = \dfrac{2e}{3} > 1$ et 
    $$\boxed{y(t) = \frac{1}{1 - \frac{2}{3}e^{1 - 1/t}} \ \text{ sur } \left]0, \frac{1}{1 - \ln(3/2)}\right[ \approx \left]0\ ; 1{,}682\right[,}$$
     qui tend vers $1$ en $0$ et explose vers $+\infty$ à droite.

    ![Figure](documents/figures/1000a1247d2c508f.svg)

    Toutes les solutions partent de la valeur $1$ en $t = 0$. Pour $\lambda > 1$, la courbe explose en $t^{*}$ puis repart de $-\infty$ : ce sont deux solutions maximales distinctes, et la rouge, qui passe par $(1, 3)$, n'est que la première.

    $\triangleright$ *(c) $y' = (y + 3t)^{3} - 3$.* Avec $z = y + 3t$, l'équation devient $z' = z^{3}$, autonome et à variables séparées. La solution $z = 0$ donne $y = -3t$, globale. Sinon $\Big(-\dfrac{1}{2z^{2}}\Big)' = 1$, soit $z^{-2} = C - 2t$ : 
    $$\boxed{y(t) = -3t \pm \frac{1}{\sqrt{C - 2t}} \ \text{ sur } \left]-\infty, \frac{C}{2}\right[,}$$
     solutions non globales, qui explosent à droite. Pour $y(1) = 3$, $z(1) = 6$ donne $C = 2 + \dfrac{1}{36}$, d'où 
    $$\boxed{y(t) = -3t + \Big(\dfrac{73}{36} - 2t\Big)^{-1/2} \text{ sur } \left]-\infty, \dfrac{73}{72}\right[}\text{.}$$
- id: "l3-cd-06-05"
  feuille: "f-l3-cd-06"
  numero: 5
  partie: "Résolution explicite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *(Équations de Bernoulli.)* Résoudre les équations suivantes : 
    $$\text{(a) } \frac{\mathrm{d} y}{\mathrm{d} x} + y = \frac{1}{y^{2}} ; \qquad \text{(b) } \frac{\mathrm{d} y}{\mathrm{d} x} = y\big(xy^{3} - 1\big).$$
  corrige: |
    Une équation de Bernoulli $y' = a(x)y + b(x)y^{n}$ devient linéaire par le changement $z = y^{1 - n}$, là où $y$ ne s'annule pas.

    $\triangleright$ *(a)* Ici $n = -2$ : avec $z = y^{3}$, $z' = 3y^{2}y' = 3(1 - y^{3}) = 3 - 3z$, donc $z = 1 + Ce^{-3x}$ et 
    $$\boxed{y(x) = \big(1 + Ce^{-3x}\big)^{1/3},}$$
     la racine cubique étant réelle, sur un intervalle où $1 + Ce^{-3x} \neq 0$ (l'équation exige $y \neq 0$) : $\mathbb{R}$ si $C \geqslant 0$ ; si $C < 0$, l'une des demi-droites $\Big]\dfrac{\ln(-C)}{3}, +\infty\Big[$ (où $y > 0$) ou $\Big]-\infty, \dfrac{\ln(-C)}{3}\Big[$ (où $y < 0$). Toutes les solutions tendent vers $1$ en $+\infty$.

    $\triangleright$ *(b)* Ici $y' = -y + xy^{4}$, $n = 4$. La fonction nulle est solution ; sinon, avec $z = y^{-3}$, $z' = -3y^{-4}y' = 3z - 3x$, de solution particulière $x + \dfrac{1}{3}$, d'où 
    $$\boxed{y(x) = \Big(x + \frac{1}{3} + Ce^{3x}\Big)^{-1/3},}$$
     sur un intervalle où la parenthèse ne s'annule pas.
- id: "l3-cd-06-06"
  feuille: "f-l3-cd-06"
  numero: 6
  partie: "Résolution explicite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *(Équation de Riccati.)* On considère l'équation $\dfrac{\mathrm{d} y}{\mathrm{d} x} = P(x) + Q(x)y + R(x)y^{2}$, où $P$, $Q$, $R$ sont des fonctions continues données.

    **1.** Lorsqu'on connaît une solution particulière $y_{1}$, indiquer comment résoudre l'équation à l'aide du changement d'inconnue $y = y_{1} + u$, suivi d'une seconde substitution.

    **2.** *Application.* Trouver les solutions de $\dfrac{\mathrm{d} y}{\mathrm{d} x} = -\dfrac{4}{x^{2}} - \dfrac{1}{x}y + y^{2}$.
  corrige: |
    $\triangleright$ *Méthode.* Si $y = y_{1} + u$, en retranchant l'équation vérifiée par $y_{1}$ : 
    $$u' = \big(Q + 2Ry_{1}\big)u + Ru^{2},$$
     équation de Bernoulli avec $n = 2$. La seconde substitution $w = \dfrac{1}{u}$ donne l'équation linéaire $w' = -\big(Q + 2Ry_{1}\big)w - R$, que l'on résout par la formule de Duhamel (exercice 2).

    $\triangleright$ *Application.* On cherche une solution particulière de la forme $\dfrac{a}{x}$ : $-\dfrac{a}{x^{2}} = -\dfrac{4}{x^{2}} - \dfrac{a}{x^{2}} + \dfrac{a^{2}}{x^{2}}$ donne $a^{2} = 4$ ; on prend $y_{1} = \dfrac{2}{x}$. Alors $u' = \dfrac{3}{x}u + u^{2}$, puis $w' = -\dfrac{3}{x}w - 1$, soit $(x^{3}w)' = -x^{3}$ et $w = \dfrac{K - x^{4}}{4x^{3}}$. Les solutions sont 
    $$\boxed{y = \frac{2}{x} \quad \text{et} \quad y = \frac{2}{x} + \frac{4x^{3}}{K - x^{4}},\ K \in \mathbb{R},}$$
     sur un intervalle qui évite $0$ et les racines de $x^{4} = K$. Pour $K = 0$, on retrouve l'autre solution particulière $-\dfrac{2}{x}$. Toutes ces expressions ont été vérifiées par calcul formel.
- id: "l3-cd-06-07"
  feuille: "f-l3-cd-06"
  numero: 7
  partie: "Résolution explicite"
  etoiles: 2
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *(Équations aux différentielles totales, facteurs intégrants.)*

    **1.** Montrer que les équations suivantes s'écrivent comme des équations aux différentielles totales, et les résoudre : $(x^{2} - 1)y'(x) + 2xy(x) = 0$ ; $y(x)(1 - x^{2})y'(x) = x\,y(x)^{2} - \sin x\cos x$.

    **2.** Trouver le réel $\alpha$ pour lequel l'équation $(y^{3} + \alpha xy^{4} - 2x)\,\mathrm{d} x + (3xy^{2} + 20x^{2}y^{3})\,\mathrm{d} y = 0$ est aux différentielles totales, puis la résoudre.

    **3.** Résoudre l'équation $(2y^{2} + 3x)\,\mathrm{d} x + 2xy\,\mathrm{d} y = 0$ en trouvant un facteur intégrant approprié.
  corrige: |
    Une équation $M(x, y)\,\mathrm{d} x + N(x, y)\,\mathrm{d} y = 0$ est aux différentielles totales s'il existe $F$ de classe $\mathcal{C}^{1}$ telle que $\frac{\partial F}{\partial x} = M$ et $\frac{\partial F}{\partial y} = N$ ; sur un ouvert étoilé, c'est le cas si et seulement si $\frac{\partial M}{\partial y} = \frac{\partial N}{\partial x}$ (lemme de Poincaré). Les solutions vérifient alors $\dfrac{\mathrm{d}}{\mathrm{d} x}F(x, y(x)) = M + Ny' = 0$, c'est-à-dire $F(x, y(x)) = C$.

    $\triangleright$ *1, première équation.* $2xy\,\mathrm{d} x + (x^{2} - 1)\,\mathrm{d} y = \mathrm{d}\big((x^{2} - 1)y\big)$, d'où $\boxed{y = \dfrac{C}{x^{2} - 1}}$ sur un intervalle évitant $\pm 1$.

    $\triangleright$ *1, seconde équation.* Elle s'écrit $(xy^{2} - \sin x\cos x)\,\mathrm{d} x + (x^{2} - 1)y\,\mathrm{d} y = 0$, et $\frac{\partial M}{\partial y} = 2xy = \frac{\partial N}{\partial x}$. Le potentiel est $F = \dfrac{1}{2}\big((x^{2} - 1)y^{2} - \sin^{2}x\big)$, d'où 
    $$\boxed{(x^{2} - 1)\,y^{2} - \sin^{2}x = C,}$$
     c'est-à-dire $y = \pm\sqrt{\dfrac{C + \sin^{2}x}{x^{2} - 1}}$ là où la racine a un sens et ne s'annule pas.

    $\triangleright$ *2.* $\frac{\partial M}{\partial y} = 3y^{2} + 4\alpha xy^{3}$ et $\frac{\partial N}{\partial x} = 3y^{2} + 40xy^{3}$ : $\boxed{\alpha = 10}$. Le potentiel est $F = xy^{3} + 5x^{2}y^{4} - x^{2}$, et les solutions vérifient $\boxed{xy^{3} + 5x^{2}y^{4} - x^{2} = C}$.

    $\triangleright$ *3.* $\frac{\partial M}{\partial y} - \frac{\partial N}{\partial x} = 4y - 2y = 2y$, et $\dfrac{1}{N}\Big(\frac{\partial M}{\partial y} - \frac{\partial N}{\partial x}\Big) = \dfrac{1}{x}$ ne dépend que de $x$ : un facteur intégrant $\mu(x)$ convient si $\mu' N = \mu\Big(\frac{\partial M}{\partial y} - \frac{\partial N}{\partial x}\Big)$, soit $\mu' = \dfrac{\mu}{x}$ et $\mu = x$. Alors $(2xy^{2} + 3x^{2})\,\mathrm{d} x + 2x^{2}y\,\mathrm{d} y = \mathrm{d}(x^{2}y^{2} + x^{3})$, et les solutions vérifient $\boxed{x^{2}y^{2} + x^{3} = C}$, soit $y = \pm\dfrac{\sqrt{C - x^{3}}}{|x|}$.
- id: "l3-cd-06-08"
  feuille: "f-l3-cd-06"
  numero: 8
  partie: "Résolution explicite"
  etoiles: 1
  types: [Calcul]
  mots_cles: [résolution explicite]
  noeuds: [ed-lineaires]
  notions: [equation-differentielle, solution-edo]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    *(Équations homogènes.)*

    **1.** On considère une équation de la forme $y'(t) = f\Big(\dfrac{y(t)}{t}\Big)$, avec $f$ continue sur un intervalle. Indiquer comment la résoudre à l'aide du changement d'inconnue $y(t) = tu(t)$.

    **2.** *Exemple.* Résoudre l'équation $y' = \dfrac{y^{2} + ty - t^{2}}{t^{2}}$.
  corrige: |
    $\triangleright$ *1.* Avec $y = tu$ sur un intervalle ne contenant pas $0$, $y' = u + tu'$, et l'équation devient $tu' = f(u) - u$, à variables séparées. Les racines de $f(u) = u$ donnent les solutions $y = ut$, droites passant par l'origine ; ailleurs, $\int\dfrac{\mathrm{d} u}{f(u) - u} = \ln|t| + K$. L'équation est invariante par les homothéties $(t, y) \mapsto (kt, ky)$ : les courbes intégrales sont homothétiques les unes des autres.

    $\triangleright$ *2.* Ici $f(u) = u^{2} + u - 1$ et $tu' = u^{2} - 1$. Les constantes $\pm 1$ donnent $y = \pm t$. Sinon, $\dfrac{1}{2}\ln\left|\dfrac{u - 1}{u + 1}\right| = \ln|t| + K$, soit $\dfrac{u - 1}{u + 1} = \lambda t^{2}$ et 
    $$\boxed{y(t) = t\,\frac{1 + \lambda t^{2}}{1 - \lambda t^{2}}, \quad \text{et } y = -t,}$$
     sur un intervalle qui évite $0$ et, si $\lambda > 0$, les points $\pm\dfrac{1}{\sqrt{\lambda}}$ ; la valeur $\lambda = 0$ redonne $y = t$.

    ![Figure](documents/figures/74eb386b1f41031b.svg)

    Les courbes, toutes tangentes à $y = t$ à l'origine, sont homothétiques : pour $\lambda > 0$, elles explosent en $\pm\dfrac{1}{\sqrt{\lambda}}$, pour $\lambda < 0$, elles restent coincées entre $y = t$ et $y = -t$ et tendent vers la droite $y = -t$ à l'infini.
- id: "l3-cd-06-09"
  feuille: "f-l3-cd-06"
  numero: 9
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *(Équations linéaires du second ordre à coefficients constants.)* Soit $a$, $b$, $c$ des réels, $a \neq 0$.

    **1.** On note $S_{H}$ l'ensemble des solutions sur $\mathbb{R}$ de $(H)$ : $ay'' + by' + cy = 0$.

    **(a)** Montrer que $S_{H}$ est un sous-espace vectoriel de $\mathcal{C}^{2}(\mathbb{R})$.

    **(b)** On admet que, pour tout $t_{0} \in \mathbb{R}$ et tout $(y_{0}, v_{0}) \in \mathbb{R}^{2}$, il existe une unique solution $y$ de $(H)$ telle que $y(t_{0}) = y_{0}$ et $y'(t_{0}) = v_{0}$. En considérant $\Phi : y \mapsto \big(y(0), y'(0)\big)$, donner la dimension de $S_{H}$.

    **(c)** Donner une condition nécessaire et suffisante sur $a$, $b$, $c$ et $r \in \mathbb{C}$ pour que $t \mapsto e^{rt}$ soit solution de $(H)$.

    **(d)** Trouver une base de $S_{H}$ formée de fonctions réelles, en distinguant trois cas.

    **2.** Soit $I$ un intervalle et $f \in \mathcal{C}(I, \mathbb{R})$. On note $S_{E}$ l'ensemble des solutions sur $I$ de $(E)$ : $ay'' + by' + cy = f$.

    **(a)** Soit $y_{E} \in S_{E}$. Montrer que toute solution de $(E)$ s'écrit $y_{E} + y_{H}$ avec $y_{H} \in S_{H}$.

    **(b)** *(Variation des constantes.)* Soit $(y_{1}, y_{2})$ une base de $S_{H}$ et $\lambda$, $\mu \in \mathcal{C}^{1}(I, \mathbb{R})$ telles que $\lambda'y_{1} + \mu'y_{2} = 0$ et $\lambda'y_{1}' + \mu'y_{2}' = \dfrac{f}{a}$ sur $I$. Montrer que $\lambda y_{1} + \mu y_{2}$ est solution de $(E)$.

    **3.** *Exemple.* On considère l'équation $(3)$ : $y'' - y = f(t)$, $t \in I$.

    **(a)** Montrer, par la méthode précédente, que les solutions de $(3)$ sont les fonctions 
    $$(4) \qquad y(t) = \lambda e^{t - t_{0}} + \mu e^{-(t - t_{0})} + \int_{t_{0}}^{t}\operatorname{sh}(t - s)f(s)\,\mathrm{d} s, \qquad \lambda, \mu \in \mathbb{R},\ t_{0} \in I.$$

    **(b)** Montrer que $y$ est solution de $(3)$ si et seulement si $X = {}^{t}(y, y')$ est solution d'un système $(\mathcal{E})$ : $X' = AX + F(t)$, où l'on déterminera $A \in \mathcal{M}_{2}(\mathbb{R})$ et $F \in \mathcal{C}(I, \mathbb{R}^{2})$.

    **(c)** Montrer que $A$ est diagonalisable, l'écrire $A = PDP^{-1}$ avec $D$ diagonale, et calculer $e^{tA}$.

    **(d)** Montrer que la résolution de $(\mathcal{E})$ se ramène à celle de deux équations linéaires du premier ordre non couplées, et les résoudre.

    **(e)** Soit $t_{0} \in I$ et $X_{0} \in \mathbb{R}^{2}$. En déduire que la solution de $(\mathcal{E})$ telle que $X(t_{0}) = X_{0}$ est 
    $$(5) \qquad X(t) = e^{(t - t_{0})A}X_{0} + \int_{t_{0}}^{t}e^{(t - s)A}F(s)\,\mathrm{d} s.$$

    **(f)** Vérifier que l'on retrouve l'expression (4).
  corrige: |
    $\triangleright$ *1 (a).* L'application $y \mapsto ay'' + by' + cy$ est linéaire de $\mathcal{C}^{2}(\mathbb{R})$ dans $\mathcal{C}(\mathbb{R})$ : $S_{H}$ est son noyau.

    $\triangleright$ *1 (b).* $\Phi$ est linéaire ; elle est injective par l'unicité admise et surjective par l'existence. C'est un isomorphisme, et $\boxed{\dim S_{H} = 2}$.

    $\triangleright$ *1 (c).* $(e^{rt})'' = r^{2}e^{rt}$, donc $t \mapsto e^{rt}$ est solution si et seulement si $\boxed{ar^{2} + br + c = 0}$ : c'est l'équation caractéristique.

    $\triangleright$ *1 (d).* Soit $\Delta = b^{2} - 4ac$. Dans les trois cas, les deux fonctions proposées sont solutions et forment une famille libre, donc une base par (b) :

    • si $\Delta > 0$, de racines réelles $r_{1} \neq r_{2}$ : $\boxed{(e^{r_{1}t}, e^{r_{2}t})}$ ;

    • si $\Delta = 0$, de racine double $r$ : $\boxed{(e^{rt}, te^{rt})}$ ; la seconde est solution car, après division par $e^{rt}$, $a(2r + r^{2}t) + b(1 + rt) + ct = t(ar^{2} + br + c) + (2ar + b) = 0$, puisque $r = -\dfrac{b}{2a}$ ;

    • si $\Delta < 0$, de racines $\alpha \pm \mathrm{i}\beta$ : 
    $$\boxed{(e^{\alpha t}\cos\beta t, e^{\alpha t}\sin\beta t)}\text{,}$$
     parties réelle et imaginaire de $e^{(\alpha + \mathrm{i}\beta)t}$, qui sont solutions puisque les coefficients sont réels.

    $\triangleright$ *2 (a).* $y - y_{E}$ annule $ay'' + by' + cy$ : c'est un élément $y_{H}$ de $S_{H}$.

    $\triangleright$ *2 (b).* Avec $y = \lambda y_{1} + \mu y_{2}$, la première condition donne $y' = \lambda y_{1}' + \mu y_{2}'$, puis $y'' = \lambda y_{1}'' + \mu y_{2}'' + \lambda' y_{1}' + \mu' y_{2}' = \lambda y_{1}'' + \mu y_{2}'' + \dfrac{f}{a}$. Donc $ay'' + by' + cy = \lambda(ay_{1}'' + by_{1}' + cy_{1}) + \mu(ay_{2}'' + by_{2}' + cy_{2}) + f = f$. Le système en $(\lambda', \mu')$ a pour déterminant le wronskien $y_{1}y_{2}' - y_{1}'y_{2}$, qui ne s'annule pas (sinon $\Phi$ ne serait pas injective) : $\lambda$ et $\mu$ existent toujours.

    $\triangleright$ *3 (a).* Avec $y_{1} = e^{t}$, $y_{2} = e^{-t}$, le système donne $\lambda' = \dfrac{1}{2}e^{-t}f$ et $\mu' = -\dfrac{1}{2}e^{t}f$. En intégrant depuis $t_{0}$ : 
    $$\lambda(t)e^{t} + \mu(t)e^{-t} = \int_{t_{0}}^{t}\frac{e^{t - s} - e^{-(t - s)}}{2}f(s)\,\mathrm{d} s = \int_{t_{0}}^{t}\operatorname{sh}(t - s)f(s)\,\mathrm{d} s,$$
     solution particulière nulle ainsi que sa dérivée en $t_{0}$. Avec 2 (a) et la base $\big(e^{t - t_{0}}, e^{-(t - t_{0})}\big)$ de $S_{H}$, on obtient (4).

    $\triangleright$ *3 (b).* $X' = (y', y'') = (y', y + f)$ : 
    $$\boxed{A = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}, \quad F(t) = {}^{t}(0, f(t))}\text{.}$$
     C'est la réduction à l'ordre 1 du cours (prop. 5).

    $\triangleright$ *3 (c).* $A$ est symétrique réelle, de valeurs propres $1$ et $-1$, de vecteurs propres $(1, 1)$ et $(1, -1)$. Avec $P = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}$ et $D = \operatorname{diag}(1, -1)$, $A = PDP^{-1}$ et 
    $$e^{tA} = P\,\operatorname{diag}(e^{t}, e^{-t})\,P^{-1} = \boxed{\begin{pmatrix} \operatorname{ch} t & \operatorname{sh} t \\ \operatorname{sh} t & \operatorname{ch} t \end{pmatrix}}.$$

    $\triangleright$ *3 (d).* Avec $Z = P^{-1}X$, soit $z_{1} = \dfrac{y + y'}{2}$ et $z_{2} = \dfrac{y - y'}{2}$, le système devient $Z' = DZ + P^{-1}F$ : 
    $$z_{1}' = z_{1} + \frac{f}{2}, \qquad z_{2}' = -z_{2} - \frac{f}{2},$$
     deux équations scalaires indépendantes, résolues par la formule de Duhamel : $z_{1}(t) = e^{t - t_{0}}z_{1}(t_{0}) + \int_{t_{0}}^{t}e^{t - s}\dfrac{f(s)}{2}\,\mathrm{d} s$ et $z_{2}(t) = e^{-(t - t_{0})}z_{2}(t_{0}) - \int_{t_{0}}^{t}e^{-(t - s)}\dfrac{f(s)}{2}\,\mathrm{d} s$.

    $\triangleright$ *3 (e).* Sous forme matricielle, $Z(t) = e^{(t - t_{0})D}Z(t_{0}) + \int_{t_{0}}^{t}e^{(t - s)D}P^{-1}F(s)\,\mathrm{d} s$ ; en multipliant par $P$ et en utilisant $Pe^{uD}P^{-1} = e^{uA}$, on obtient (5).

    $\triangleright$ *3 (f).* La première ligne de $e^{(t - s)A}F(s)$ est $\operatorname{sh}(t - s)f(s)$, et celle de $e^{(t - t_{0})A}X_{0}$ est $y_{0}\operatorname{ch}(t - t_{0}) + v_{0}\operatorname{sh}(t - t_{0}) = \lambda e^{t - t_{0}} + \mu e^{-(t - t_{0})}$ avec $\lambda = \dfrac{y_{0} + v_{0}}{2}$, $\mu = \dfrac{y_{0} - v_{0}}{2}$ : c'est (4). La formule (5) est la formule de Duhamel des systèmes, que l'exercice 14 établit pour des coefficients variables.
- id: "l3-cd-06-10"
  feuille: "f-l3-cd-06"
  numero: 10
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Trouver toutes les solutions du système linéaire $x_{1}' = x_{1} + x_{2}$, $x_{2}' = -2x_{1} + 4x_{2}$, en précisant leur intervalle de définition.

    **2.** Trouver la solution de ce système qui vérifie $x_{1}(1) = 4$, $x_{2}(1) = 0$.

    **3.** Trouver la solution maximale du problème de Cauchy 
    $$y_{1}' = y_{1} + y_{2}, \qquad y_{2}' = -2y_{1} + 4y_{2} + e^{t}, \qquad y_{1}(0) = 2,\ y_{2}(0) = 0.$$
  corrige: |
    $\triangleright$ *1.* La matrice $A = \begin{pmatrix} 1 & 1 \\ -2 & 4 \end{pmatrix}$ a pour trace $5$ et déterminant $6$, donc pour valeurs propres $2$ et $3$, de vecteurs propres $(1, 1)$ et $(1, 2)$. Par la prop. 6 du cours, les solutions sont, sur $\mathbb{R}$, 
    $$\boxed{x(t) = a\,e^{2t}\begin{pmatrix}1\\1\end{pmatrix} + b\,e^{3t}\begin{pmatrix}1\\2\end{pmatrix}, \qquad a, b \in \mathbb{R}.}$$

    $\triangleright$ *2.* $ae^{2} + be^{3} = 4$ et $ae^{2} + 2be^{3} = 0$ donnent $be^{3} = -4$ et $ae^{2} = 8$ : 
    $$\boxed{x_{1}(t) = 8e^{2(t - 1)} - 4e^{3(t - 1)}, \qquad x_{2}(t) = 8e^{2(t - 1)} - 8e^{3(t - 1)}.}$$

    $\triangleright$ *3.* On cherche une solution particulière $e^{t}v$ : $v = Av + (0, 1)$, soit $(I - A)v = (0, 1)$, d'où $v = \Big(\dfrac{1}{2}, 0\Big)$. Les conditions initiales donnent alors $a = 3$, $b = -\dfrac{3}{2}$, et la solution, globale (cours, prop. 12), est 
    $$\boxed{y_{1}(t) = \frac{1}{2}e^{t} + 3e^{2t} - \frac{3}{2}e^{3t}, \qquad y_{2}(t) = 3e^{2t} - 3e^{3t}.}$$
     Ces trois résultats ont été vérifiés par calcul formel.

    ![Figure](documents/figures/a1abc3d0a5157985.svg)

    C'est un nœud instable : toutes les trajectoires s'éloignent de l'origine. Près de l'origine (en $t \to -\infty$), le terme en $e^{2t}$ domine et elles sont tangentes à la droite $(1, 1)$ ; loin, le terme en $e^{3t}$ l'emporte et elles deviennent parallèles à la direction $(1, 2)$.
- id: "l3-cd-06-11"
  feuille: "f-l3-cd-06"
  numero: 11
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Mettre l'équation $x'' - 2x' + 5x = 0$ sous la forme d'un système différentiel linéaire d'ordre $1$ à deux inconnues, puis en donner toutes les solutions.

    **2.** Trouver la solution du problème de Cauchy $x'' - 2x' + 5x = t$, $x(0) = \dfrac{27}{25}$, $x'(0) = 0$.

    **3.** Donner toutes les solutions de l'équation $x^{(3)} + 3x'' - 4x = 0$.
  corrige: |
    $\triangleright$ *1.* Avec $X = (x, x')$, $X' = \begin{pmatrix} 0 & 1 \\ -5 & 2 \end{pmatrix}X$. Les valeurs propres de cette matrice sont les racines de $r^{2} - 2r + 5 = 0$, soit $1 \pm 2\mathrm{i}$ ; comme à l'exercice 9, les solutions sont 
    $$\boxed{x(t) = e^{t}\big(a\cos 2t + b\sin 2t\big), \qquad a, b \in \mathbb{R}.}$$

    $\triangleright$ *2.* Une solution particulière affine $\alpha t + \beta$ vérifie $-2\alpha + 5(\alpha t + \beta) = t$, d'où $\alpha = \dfrac{1}{5}$ et $\beta = \dfrac{2}{25}$. Les conditions initiales donnent $a + \dfrac{2}{25} = \dfrac{27}{25}$ et $a + 2b + \dfrac{1}{5} = 0$, soit $a = 1$, $b = -\dfrac{3}{5}$ : 
    $$\boxed{x(t) = e^{t}\Big(\cos 2t - \frac{3}{5}\sin 2t\Big) + \frac{t}{5} + \frac{2}{25}.}$$

    ![Figure](documents/figures/9f5de02f6759a263.svg)

    En $-\infty$, la partie homogène s'éteint et la solution rejoint la droite $\dfrac{t}{5} + \dfrac{2}{25}$ ; en $+\infty$, elle oscille avec une amplitude qui croît comme $e^{t}$, car les racines caractéristiques ont une partie réelle positive.

    $\triangleright$ *3.* L'équation caractéristique $r^{3} + 3r^{2} - 4 = (r - 1)(r + 2)^{2}$ a une racine simple $1$ et une racine double $-2$. Comme au second ordre, les solutions sont $\boxed{x(t) = ae^{t} + (b + ct)e^{-2t}}$, et ces trois fonctions forment une base de l'espace des solutions, de dimension $3$ par la réduction à l'ordre 1.
- id: "l3-cd-06-12"
  feuille: "f-l3-cd-06"
  numero: 12
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 1
  types: [Démonstration]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *(Oscillateur harmonique forcé.)* On considère l'équation 
    $$y''(t) + \omega_{0}^{2}y(t) = c\sin(\omega t), \qquad t \in \mathbb{R},$$
     avec $c \in \mathbb{R}^{*}$ et $\omega_{0}$, $\omega > 0$, $\omega \neq \omega_{0}$. Elle modélise un corps attaché à un ressort, soumis à une force périodique de pulsation $\omega$, sans frottement.

    **1.** Donner une solution particulière, puis toutes les solutions.

    **2.** Montrer que, si $\omega \to \omega_{0}$, alors $\sup_{t \in \mathbb{R}}|y(t)| \to +\infty$ pour toute solution $y$ de données initiales $y(0)$, $y'(0)$ fixées : c'est le phénomène de *résonance*.
  corrige: |
    $\triangleright$ *1.* On cherche $y_{p} = k\sin(\omega t)$ : $k(\omega_{0}^{2} - \omega^{2}) = c$, donc, puisque $\omega \neq \omega_{0}$, 
    $$\boxed{y(t) = \frac{c}{\omega_{0}^{2} - \omega^{2}}\sin(\omega t) + A\cos(\omega_{0}t) + B\sin(\omega_{0}t), \qquad A, B \in \mathbb{R}.}$$

    $\triangleright$ *2.* Fixons $y(0) = y_{0}$ et $y'(0) = v_{0}$ : alors $A = y_{0}$ et $B = \dfrac{1}{\omega_{0}}\Big(v_{0} - \dfrac{c\,\omega}{\omega_{0}^{2} - \omega^{2}}\Big)$, et 
    $$y(t) = \frac{c}{\omega_{0}^{2} - \omega^{2}}\Big(\sin\omega t - \frac{\omega}{\omega_{0}}\sin\omega_{0}t\Big) + y_{0}\cos\omega_{0}t + \frac{v_{0}}{\omega_{0}}\sin\omega_{0}t.$$
     Écrivons $\sin\omega t - \dfrac{\omega}{\omega_{0}}\sin\omega_{0}t = 2\cos\Big(\dfrac{(\omega + \omega_{0})t}{2}\Big)\sin\Big(\dfrac{(\omega - \omega_{0})t}{2}\Big) - \dfrac{\omega - \omega_{0}}{\omega_{0}}\sin\omega_{0}t$. Les instants $t_{k} = \dfrac{4k\pi}{\omega + \omega_{0}}$, où le cosinus vaut $1$, sont espacés de $\dfrac{4\pi}{\omega + \omega_{0}}$ ; entre deux d'entre eux, $\sin\Big(\dfrac{(\omega - \omega_{0})t}{2}\Big)$ varie au plus de $\dfrac{2\pi|\omega - \omega_{0}|}{\omega + \omega_{0}}$. On peut donc choisir $k$ tel que ce sinus soit, en valeur absolue, supérieur à $1 - \dfrac{2\pi|\omega - \omega_{0}|}{\omega + \omega_{0}}$, et alors 
    $$\sup_{\mathbb{R}}|y| \geqslant \frac{|c|}{|\omega_{0}^{2} - \omega^{2}|}\Big(2 - \frac{4\pi|\omega - \omega_{0}|}{\omega + \omega_{0}} - \frac{|\omega - \omega_{0}|}{\omega_{0}}\Big) - |y_{0}| - \frac{|v_{0}|}{\omega_{0}} \xrightarrow[\omega \to \omega_{0}]{} +\infty,$$
     puisque $c \neq 0$ : c'est la $\boxed{\text{résonance}}$. L'hypothèse $c \neq 0$, ajoutée à l'énoncé source, est indispensable : sans force, il n'y a rien à amplifier.

    ![Figure](documents/figures/7ad18cf7149a6dd2.svg)

    Pour $\omega_{0} = 1$, $\omega = 1{,}1$, $c = 1$ et des données initiales nulles, la solution présente des *battements* : elle oscille à la pulsation moyenne sous une enveloppe (en rouge) qui s'annule tous les $\dfrac{2\pi}{|\omega - \omega_{0}|} = 20\pi$, et dont la hauteur $\dfrac{2|c|}{|\omega_{0}^{2} - \omega^{2}|} \approx 9{,}5$ tend vers l'infini quand $\omega \to \omega_{0}$.
- id: "l3-cd-06-13"
  feuille: "f-l3-cd-06"
  numero: 13
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Résoudre le problème de Cauchy $x' = tx - y$, $y' = x + ty$, $(x, y)(0) = (x_{0}, y_{0})$. On pourra poser $z = x + \mathrm{i} y$.
  corrige: |
    Avec $z = x + \mathrm{i} y$, $z' = (tx - y) + \mathrm{i}(x + ty) = t(x + \mathrm{i} y) + \mathrm{i}(x + \mathrm{i} y) = (t + \mathrm{i})z$, équation linéaire scalaire complexe : $z(t) = z_{0}\,e^{t^{2}/2 + \mathrm{i} t}$, avec $z_{0} = x_{0} + \mathrm{i} y_{0}$. En séparant parties réelle et imaginaire, 
    $$\boxed{x(t) = e^{t^{2}/2}\big(x_{0}\cos t - y_{0}\sin t\big), \qquad y(t) = e^{t^{2}/2}\big(x_{0}\sin t + y_{0}\cos t\big),}$$
     solution globale (cours, prop. 12). Le module $|z| = |z_{0}|e^{t^{2}/2}$ et l'argument $\arg z_{0} + t$ se lisent directement : le système combine une rotation uniforme et une dilatation.

    ![Figure](documents/figures/98913d2a68a5b7e8.svg)

    Les quatre trajectoires partent, en $t = 0$, des points rouges du cercle de rayon $0{,}5$ ; ce cercle est leur position la plus proche de l'origine. Elles tournent dans le sens direct à vitesse angulaire constante et s'éloignent dans les deux sens du temps, mais le rayon croît comme $e^{t^{2}/2}$, si vite qu'elles sortent du cadre après un peu plus d'un tiers de tour : ce n'est pas une spirale exponentielle, dont les spires s'accumuleraient.
- id: "l3-cd-06-14"
  feuille: "f-l3-cd-06"
  numero: 14
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    *(Résolvante, formule de Duhamel.)* Soit $I$ un intervalle ouvert, $A \in \mathcal{C}(I, \mathcal{M}_{n}(\mathbb{R}))$ et $b \in \mathcal{C}(I, \mathbb{R}^{n})$.

    **1.** Soit $t_{0} \in I$. Montrer qu'il existe une unique solution $M \in \mathcal{C}^{1}(I, \mathcal{M}_{n}(\mathbb{R}))$, définie sur $I$ tout entier, du problème $M'(t) = A(t)M(t)$, $M(t_{0}) = I_{n}$. On note $M(t) = R(t, t_{0})$ : c'est la *résolvante* du système $x' = A(t)x$.

    **2.** Montrer que $R(t, t_{0}) = R(t, t_{1})R(t_{1}, t_{0})$ pour tous $t_{0}$, $t_{1}$, $t \in I$, puis que $R(t, t_{0})$ est inversible, d'inverse $R(t_{0}, t)$.

    **3.** Calculer $R(t, t_{0})$ lorsque $n = 1$, puis lorsque $A(t) = A$ est constante.

    **4.** Montrer que la solution de $x' = A(t)x$, $x(t_{0}) = x_{0}$, est $x(t) = R(t, t_{0})x_{0}$.

    **5.** Montrer que la solution de $x' = A(t)x + b(t)$, $x(t_{0}) = x_{0}$, est 
    $$x(t) = R(t, t_{0})x_{0} + \int_{t_{0}}^{t}R(t, s)b(s)\,\mathrm{d} s.$$
  corrige: |
    $\triangleright$ *1.* L'équation $M' = A(t)M$ est un système linéaire de $n^{2}$ équations scalaires à coefficients continus sur $I$. Par le théorème de Cauchy-Lipschitz et la prop. 12 du cours, elle admet une unique solution maximale, définie sur $I$ tout entier.

    $\triangleright$ *2.* Les fonctions $t \mapsto R(t, t_{0})$ et $t \mapsto R(t, t_{1})R(t_{1}, t_{0})$ sont toutes deux solutions de $M' = A(t)M$ (la seconde, car $R(t_{1}, t_{0})$ est une matrice constante multipliée à droite) et prennent la valeur $R(t_{1}, t_{0})$ en $t = t_{1}$ ; par unicité, $\boxed{R(t, t_{0}) = R(t, t_{1})R(t_{1}, t_{0})}$. Avec $t = t_{0}$ : $R(t_{0}, t_{1})R(t_{1}, t_{0}) = I_{n}$, donc $\boxed{R(t_{1}, t_{0})^{-1} = R(t_{0}, t_{1})}$.

    $\triangleright$ *3.* Pour $n = 1$, 
    $$\boxed{R(t, t_{0}) = \exp\Big(\int_{t_{0}}^{t}a(s)\,\mathrm{d} s\Big)}$$
     (exercice 2) ; pour $A$ constante, $\boxed{R(t, t_{0}) = e^{(t - t_{0})A}}$ (cours, prop. 6). Le piège : pour $A(t)$ variable, $R(t, t_{0})$ n'est pas en général $\exp\Big(\int_{t_{0}}^{t}A\Big)$, car les matrices $A(s)$ ne commutent pas entre elles.

    $\triangleright$ *4.* $x(t) = R(t, t_{0})x_{0}$ est dérivable, de dérivée $A(t)R(t, t_{0})x_{0} = A(t)x(t)$, et vaut $x_{0}$ en $t_{0}$ ; c'est la solution par unicité.

    $\triangleright$ *5.* Par 2, $\int_{t_{0}}^{t}R(t, s)b(s)\,\mathrm{d} s = R(t, t_{0})\int_{t_{0}}^{t}R(t_{0}, s)b(s)\,\mathrm{d} s$ : ce produit d'une fonction $\mathcal{C}^{1}$ par une primitive se dérive sans théorème de dérivation sous l'intégrale, et la dérivée de $x(t) = R(t, t_{0})\Big(x_{0} + \int_{t_{0}}^{t}R(t_{0}, s)b(s)\,\mathrm{d} s\Big)$ vaut 
    $$A(t)x(t) + R(t, t_{0})R(t_{0}, t)b(t) = A(t)x(t) + b(t).$$
     Comme $x(t_{0}) = x_{0}$, c'est la solution : c'est la $\boxed{\text{formule de Duhamel}}$, qui contient l'exercice 2 ($n = 1$) et la formule (5) de l'exercice 9 ($A$ constante).
- id: "l3-cd-06-15"
  feuille: "f-l3-cd-06"
  numero: 15
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $\theta : \mathbb{R}_{+} \to \mathbb{R}$ continue et intégrable sur $\mathbb{R}_{+}$. On considère l'équation $x'' + (1 + \theta(t))x = 0$, et une solution $f$ définie sur $\mathbb{R}_{+}$. On pose, pour $t \geqslant 0$, 
    $$g(t) = f(t) + \int_{0}^{t}\theta(s)f(s)\sin(t - s)\,\mathrm{d} s.$$

    **1.** Vérifier que $g'' + g = 0$ sur $\mathbb{R}_{+}$.

    **2.** En déduire qu'il existe $A \geqslant 0$ tel que $|f(t)| \leqslant A + \displaystyle\int_{0}^{t}|\theta(s)|\,|f(s)|\,\mathrm{d} s$ pour tout $t \geqslant 0$.

    **3.** Montrer que $f$ est bornée sur $\mathbb{R}_{+}$.
  corrige: |
    $\triangleright$ *1.* Avec $\sin(t - s) = \sin t\cos s - \cos t\sin s$, 
    $$g(t) = f(t) + \sin t\int_{0}^{t}\theta f\cos s\,\mathrm{d} s - \cos t\int_{0}^{t}\theta f\sin s\,\mathrm{d} s,$$
     qui se dérive comme un produit. Les termes issus des bornes des intégrales se compensent ($\sin t\cos t - \cos t\sin t = 0$), d'où 
    $$g'(t) = f'(t) + \int_{0}^{t}\theta(s)f(s)\cos(t - s)\,\mathrm{d} s,$$
     puis de même $g''(t) = f''(t) + \theta(t)f(t) - \int_{0}^{t}\theta(s)f(s)\sin(t - s)\,\mathrm{d} s$. Ainsi $g'' + g = f'' + (1 + \theta)f = \boxed{0}$.

    $\triangleright$ *2.* Donc $g = a\cos t + b\sin t$, et $|g(t)| \leqslant A = \sqrt{a^{2} + b^{2}}$. Par l'inégalité triangulaire, 
    $$|f(t)| \leqslant |g(t)| + \int_{0}^{t}|\theta(s)|\,|\sin(t - s)|\,|f(s)|\,\mathrm{d} s \leqslant \boxed{A + \int_{0}^{t}|\theta(s)|\,|f(s)|\,\mathrm{d} s.}$$

    $\triangleright$ *3.* Par le lemme de Gronwall (cours, prop. 2), appliqué avec $k = |\theta| \geqslant 0$, $|f(t)| \leqslant A\exp\Big(\int_{0}^{t}|\theta|\Big) \leqslant \boxed{A\exp\Big(\int_{0}^{+\infty}|\theta|\Big)}$ : $f$ est bornée sur $\mathbb{R}_{+}$. Ici $A$ se calcule : $g(0) = f(0)$ et $g'(0) = f'(0)$, donc $A = \sqrt{f(0)^{2} + f'(0)^{2}}$. L'équation est une petite perturbation intégrable de $x'' + x = 0$, et les solutions restent bornées comme celles de l'oscillateur harmonique.

    ![Figure](documents/figures/f748b4bee7d2143e.svg)

    Avec $\theta(t) = \dfrac{1}{(1 + t)^{2}}$, d'intégrale $1$, et $f(0) = 1$, $f'(0) = 0$, la borne de Gronwall vaut $e$ ; la solution, calculée numériquement, ne dépasse pas $1{,}15$ en valeur absolue : la borne est grossière mais suffit à conclure.
- id: "l3-cd-06-16"
  feuille: "f-l3-cd-06"
  numero: 16
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice, fonction-convexe]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On considère l'équation $(3)$ : $x''' - xx'' = 0$, où $x$ est trois fois dérivable sur un intervalle ouvert.

    **1.** Mettre cette équation sous la forme $Y' = f(t, Y)$, où l'on déterminera $f$.

    **2.** Soit $t_{0}$, $a$, $b$, $c \in \mathbb{R}$. Montrer qu'il existe une unique solution maximale $\varphi$ de $(3)$ telle que $\varphi(t_{0}) = a$, $\varphi'(t_{0}) = b$ et $\varphi''(t_{0}) = c$.

    **3.** Calculer la dérivée de $t \mapsto \varphi''(t)\exp\Big(-\displaystyle\int_{t_{0}}^{t}\varphi(u)\,\mathrm{d} u\Big)$. En déduire que $\varphi$ est convexe ou concave sur son intervalle de définition. Déterminer $\varphi$ lorsque $\varphi''(t_{0}) = 0$.
  corrige: |
    $\triangleright$ *1.* Avec $Y = (x, x', x'')$, l'équation s'écrit $Y' = f(t, Y)$ où 
    $$\boxed{f(t, (y_{1}, y_{2}, y_{3})) = (y_{2}, y_{3}, y_{1}y_{3})}\quad\text{(cours, prop. 5).}$$

    $\triangleright$ *2.* $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R} \times \mathbb{R}^{3}$, donc localement lipschitzienne (cours, prop. 10), et le théorème de Cauchy-Lipschitz (cours, th. 5) donne une unique solution maximale pour la donnée $Y(t_{0}) = (a, b, c)$.

    $\triangleright$ *3.* Avec $h(t) = \varphi''(t)\exp\Big(-\int_{t_{0}}^{t}\varphi\Big)$, $h'(t) = \big(\varphi''' - \varphi\varphi''\big)\exp\Big(-\int_{t_{0}}^{t}\varphi\Big) = 0$. Donc $h$ est constante, égale à $h(t_{0}) = c$ : 
    $$\boxed{\varphi''(t) = c\,\exp\Big(\int_{t_{0}}^{t}\varphi(u)\,\mathrm{d} u\Big).}$$
     La dérivée seconde garde le signe de $c$ : $\varphi$ est convexe si $c \geqslant 0$, concave si $c \leqslant 0$. Si $c = 0$, $\varphi'' = 0$ et $\boxed{\varphi(t) = a + b(t - t_{0})}$, définie sur $\mathbb{R}$ ; c'est bien une solution, et elle est maximale puisqu'elle est globale.
- id: "l3-cd-06-17"
  feuille: "f-l3-cd-06"
  numero: 17
  partie: "Équations d'ordre supérieur, systèmes linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["équations d'ordre supérieur, systèmes linéaires"]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, exponentielle-matrice]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On considère l'équation $xx'' = (x')^{2} + 1$.

    **1.** Montrer que, pour $x_{0} \neq 0$ et $x_{0}' \in \mathbb{R}$ donnés, il existe une unique solution $\varphi$ définie au voisinage de $0$, telle que $\varphi(0) = x_{0}$ et $\varphi'(0) = x_{0}'$.

    **2.** Si de plus $x_{0}' \neq 0$, justifier que $\varphi$ est un $\mathcal{C}^{1}$-difféomorphisme d'un voisinage de $0$ sur un voisinage de $x_{0}$. On note $\psi$ sa réciproque et $z(x) = \varphi'\big(\psi(x)\big)$. Calculer $z'(x)$, trouver l'équation satisfaite par $z$ et expliciter $z$ ; en déduire une expression de $\varphi$.

    **3.** Quelle est la solution $\varphi$ telle que $\varphi(0) = x_{0} \neq 0$ et $\varphi'(0) = 0$ ?
  corrige: |
    $\triangleright$ *1.* Sur l'ouvert $\mathbb{R} \times \{(x, v) \,;\, x \neq 0\}$, l'équation s'écrit $(x, v)' = \Big(v, \dfrac{v^{2} + 1}{x}\Big)$, de second membre $\mathcal{C}^{1}$ : le théorème de Cauchy-Lipschitz (cours, th. 5 et prop. 5) donne une unique solution maximale telle que $\varphi(0) = x_{0}$, $\varphi'(0) = x_{0}'$.

    $\triangleright$ *2.* Si $x_{0}' \neq 0$, $\varphi'$ ne s'annule pas sur un intervalle $J$ autour de $0$ ; $\varphi$ y est strictement monotone et de classe $\mathcal{C}^{1}$ de dérivée non nulle, donc un $\mathcal{C}^{1}$-difféomorphisme de $J$ sur $\varphi(J)$. Avec $z = \varphi' \circ \psi$ : 
    $$z'(x) = \varphi''(\psi(x))\,\psi'(x) = \frac{\varphi''(\psi(x))}{\varphi'(\psi(x))} = \frac{z(x)^{2} + 1}{x\,z(x)},$$
     en utilisant l'équation au point $\psi(x)$, où $\varphi = x$. Ainsi $\dfrac{zz'}{1 + z^{2}} = \dfrac{1}{x}$, soit $\ln(1 + z^{2}) = 2\ln|x| + \text{cte}$ et 
    $$1 + z(x)^{2} = k^{2}x^{2}, \qquad k = \frac{\sqrt{1 + x_{0}'^{2}}}{|x_{0}|}, \qquad z(x) = \operatorname{sgn}(x_{0}')\sqrt{k^{2}x^{2} - 1}.$$
     Revenant à $\varphi$, $\varphi' = z(\varphi)$, que l'on intègre en posant $\varphi = \pm\dfrac{1}{k}\operatorname{ch} u$ ; on trouve que les solutions sont les chaînettes 
    $$\boxed{\varphi(t) = \frac{\varepsilon}{k}\operatorname{ch}(kt + b), \quad \varepsilon = \operatorname{sgn}(x_{0}), \quad \operatorname{sh} b = \varepsilon\,x_{0}'.}$$
     On vérifie directement que $x = \dfrac{1}{k}\operatorname{ch}(kt + b)$ convient : $xx'' = \operatorname{ch}^{2}(kt + b) = 1 + \operatorname{sh}^{2}(kt + b) = 1 + x'^{2}$, et les conditions initiales sont satisfaites puisque $\operatorname{ch} b = \sqrt{1 + x_{0}'^{2}} = k|x_{0}|$.

    $\triangleright$ *3.* Si $x_{0}' = 0$, le changement de variable ne s'applique pas en $0$, mais la formule reste candidate : avec $b = 0$, 
    $$\boxed{\varphi(t) = x_{0}\operatorname{ch}\Big(\dfrac{t}{x_{0}}\Big)}$$
     vérifie l'équation et les conditions initiales ; c'est la solution par l'unicité de la question 1. Elle est définie sur $\mathbb{R}$.

    ![Figure](documents/figures/e419b44056081da0.svg)

    Les solutions sont des chaînettes, toutes définies sur $\mathbb{R}$ et de signe constant : aucune ne traverse l'axe $x = 0$, où l'équation dégénère. La rouge, avec une pente initiale non nulle, a son sommet décalé à gauche de l'origine.
- id: "l3-cd-06-18"
  feuille: "f-l3-cd-06"
  numero: 18
  partie: "Existence et unicité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [existence et unicité, condition de Lipschitz]
  noeuds: [ed-cauchy-lipschitz, ed-peano, ed-gronwall]
  notions: [localement-lipschitzienne]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    *(Absence d'unicité.)*

    **1.** On considère le problème de Cauchy $y' = \sqrt{|y|}$, $y(0) = 0$. Construire une solution non nulle. Le théorème de Cauchy-Lipschitz s'applique-t-il ? Pourquoi ?

    **2.** On considère l'équation $(1)$ : $x' = 3x^{2/3}$, avec $x(0) = 0$. Soit $\varphi$ une solution de $(1)$ définie sur $\mathbb{R}$ telle que $\varphi(0) = 0$ ; on pose $\lambda = \inf\{t \leqslant 0 \,;\, \varphi(t) = 0\} \in [-\infty, 0]$ et $\mu = \sup\{t \geqslant 0 \,;\, \varphi(t) = 0\} \in [0, +\infty]$.

    **(a)** Montrer que $\varphi$ est identiquement nulle sur $]\lambda, \mu[$.

    **(b)** Montrer que $\varphi(t) = (t - \lambda)^{3}$ pour $t \leqslant \lambda$, $\varphi = 0$ sur $[\lambda, \mu]$ et $\varphi(t) = (t - \mu)^{3}$ pour $t \geqslant \mu$. En déduire toutes les solutions maximales de $(1)$ telles que $x(0) = 0$.
  corrige: |
    $\triangleright$ *1.* La fonction égale à $0$ pour $t \leqslant 0$ et à $\dfrac{t^{2}}{4}$ pour $t \geqslant 0$ est dérivable, de dérivée $\dfrac{t}{2} = \sqrt{\dfrac{t^{2}}{4}}$ pour $t \geqslant 0$ et $0$ pour $t \leqslant 0$ : c'est une $\boxed{\text{solution non nulle}}$, à côté de la solution nulle. Plus généralement, pour $b \leqslant 0 \leqslant a$, la fonction égale à $-\dfrac{(t - b)^{2}}{4}$ sur $]-\infty, b]$, à $0$ sur $[b, a]$ et à $\dfrac{(t - a)^{2}}{4}$ sur $[a, +\infty[$ est solution. Le théorème de Cauchy-Lipschitz $\boxed{\text{ne s'applique pas}}$ : $y \mapsto \sqrt{|y|}$ n'est lipschitzienne sur aucun voisinage de $0$, puisque $\dfrac{\sqrt{|y|} - 0}{|y - 0|} = \dfrac{1}{\sqrt{|y|}}$ n'est pas bornée. Seul le théorème de Peano (cours, th. 2) garantit l'existence.

    $\triangleright$ *2 (a).* Comme $x^{2/3} = \big(x^{1/3}\big)^{2} \geqslant 0$, toute solution est croissante. L'ensemble des zéros de $\varphi$ est fermé, donc $\varphi(\lambda) = 0$ si $\lambda$ est fini, et de même $\varphi(\mu) = 0$. Une fonction croissante nulle en $\lambda$ et en $0$ est nulle sur $[\lambda, 0]$ ; de même sur $[0, \mu]$. Si $\lambda = -\infty$, on applique cet argument à une suite de zéros tendant vers $-\infty$. Ainsi $\boxed{\varphi = 0 \text{ sur } ]\lambda, \mu[}$.

    $\triangleright$ *2 (b).* Pour $t > \mu$, $\varphi(t) \neq 0$ par définition de $\mu$, et $\varphi(t) \geqslant \varphi(\mu) = 0$ par croissance : $\varphi > 0$ sur $]\mu, +\infty[$. Là, l'équation s'écrit $\big(\varphi^{1/3}\big)' = \dfrac{1}{3}\varphi^{-2/3}\varphi' = 1$, d'où $\varphi^{1/3}(t) = t - \mu$ par continuité en $\mu$, et $\varphi(t) = (t - \mu)^{3}$. De même, $\varphi(t) = (t - \lambda)^{3}$ pour $t < \lambda$. Réciproquement, ces fonctions sont dérivables (le raccord en $\lambda$ et en $\mu$ a une dérivée nulle des deux côtés) et vérifient l'équation. Les solutions maximales telles que $x(0) = 0$ sont donc 
    $$\boxed{\varphi_{\lambda, \mu}(t) = (t - \lambda)^{3} \ (t \leqslant \lambda), \quad 0 \ (\lambda \leqslant t \leqslant \mu), \quad (t - \mu)^{3} \ (t \geqslant \mu), \qquad -\infty \leqslant \lambda \leqslant 0 \leqslant \mu \leqslant +\infty,}$$
     toutes définies sur $\mathbb{R}$ : il y en a une infinité, à deux paramètres.

    ![Figure](documents/figures/7a391740a229225a.svg)

    Dans les deux cas, une infinité de courbes intégrales passent par l'origine (c'est le « pinceau de Peano ») : chacune peut rester sur l'axe aussi longtemps qu'elle veut, puis le quitter. Les solutions rouges, qui quittent l'axe des deux côtés, montrent qu'il y a deux choix indépendants.
- id: "l3-cd-06-19"
  feuille: "f-l3-cd-06"
  numero: 19
  partie: "Existence et unicité"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [existence et unicité]
  noeuds: [ed-cauchy-lipschitz, ed-peano, ed-gronwall]
  notions: [localement-lipschitzienne]
  page_enonce: 5
  page_corrige: 14
  enonce: |
    On considère l'équation $x' = |x| + |t|$.

    **1.** Montrer que, pour tout réel $x_{0}$, il existe une solution maximale $(J, \varphi)$ telle que $\varphi(0) = x_{0}$.

    **2.** Déterminer la solution maximale correspondant à $x_{0} = 1$, en distinguant les cas $t \geqslant 0$ et $t < 0$, et vérifier qu'elle est définie sur $\mathbb{R}$. Combien de fois est-elle dérivable ?
  corrige: |
    $\triangleright$ *1.* $f(t, x) = |x| + |t|$ est continue, et $|f(t, x) - f(t, y)| = \big||x| - |y|\big| \leqslant |x - y|$ : elle est $1$-lipschitzienne en $x$. Le théorème de Cauchy-Lipschitz (cours, th. 5) donne une unique solution maximale, et, comme $|f(t, x)| \leqslant |x| + |t|$, elle est globale (cours, prop. 12).

    $\triangleright$ *2, pour $t \geqslant 0$.* Tant que $x > 0$, l'équation est $x' = x + t$, de solution $x(t) = 2e^{t} - t - 1$ pour $x(0) = 1$. Cette fonction est strictement positive sur $\mathbb{R}_{+}$, car $2e^{t} \geqslant 2 + 2t > t + 1$ : c'est la solution sur $[0, +\infty[$.

    $\triangleright$ *2, pour $t < 0$.* Tant que $x > 0$, $x' = x - t$, de solution $x = Ce^{t} + t + 1$, avec $C = 0$ : $x(t) = t + 1$, positive sur $]-1, 0]$. En $t = -1$, $x = 0$ ; comme $x' > 0$ (sauf en un point), $x < 0$ pour $t < -1$, et l'équation devient $x' = -x - t$, de solution $Ce^{-t} - t + 1$, nulle en $-1$ pour $C = -\dfrac{2}{e}$. Ainsi 
    $$\boxed{x(t) = \begin{cases} 2e^{t} - t - 1 & t \geqslant 0, \\ t + 1 & -1 \leqslant t \leqslant 0, \\ 1 - t - 2e^{-t - 1} & t \leqslant -1, \end{cases}}$$
     définie sur $\mathbb{R}$. On vérifie que la dernière expression est bien négative pour $t < -1$ : sa dérivée $2e^{-t - 1} - 1$ y est positive et elle s'annule en $-1$.

    $\triangleright$ *Régularité.* $x$ est de classe $\mathcal{C}^{1}$ puisque $x' = f(t, x)$ est continue. Mais $x''$ vaut, à gauche et à droite de $0$, $0$ et $2$ ; à gauche et à droite de $-1$, $-2$ et $0$. La solution est $\boxed{\text{dérivable une seule fois}}$ sur $\mathbb{R}$ (et de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R} \setminus \{-1, 0\}$) : la régularité d'une solution est limitée par celle du second membre, ici non dérivable sur les droites $t = 0$ et $x = 0$.

    ![Figure](documents/figures/aca2d6698614ba77.svg)

    Les deux points rouges sont les points de raccord : la courbe y est lisse à l'œil, car $x$ est de classe $\mathcal{C}^{1}$, mais sa courbure saute ; entre eux, la solution est un segment de droite.
- id: "l3-cd-06-20"
  feuille: "f-l3-cd-06"
  numero: 20
  partie: "Existence et unicité"
  etoiles: 2
  types: [Calcul]
  mots_cles: [existence et unicité, condition de Lipschitz]
  noeuds: [ed-cauchy-lipschitz, ed-peano, ed-gronwall]
  notions: [localement-lipschitzienne]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ définie par $f(t, x) = \dfrac{4t^{3}x}{t^{4} + x^{2}}$ si $(t, x) \neq (0, 0)$ et $f(0, 0) = 0$. On s'intéresse à l'équation $(2)$ : $x'(t) = f\big(t, x(t)\big)$.

    **1.** $f$ est-elle continue ? localement lipschitzienne par rapport à sa seconde variable ? Que peut-on en déduire pour l'équation $(2)$ ?

    **2.** Soit $\varphi$ une solution de $(2)$ définie sur un intervalle $I$ ne contenant pas $0$. On pose $\varphi(t) = t^{2}\psi(t)$ pour $t \in I$. Déterminer une équation différentielle $(E)$ vérifiée par $\psi$, puis résoudre $(E)$.

    **3.** Que peut-on en déduire pour l'existence et l'unicité des solutions de $(2)$ avec la donnée initiale $(t_{0}, x_{0}) = (0, 0)$ ?
  corrige: |
    $\triangleright$ *1.* Comme $2t^{2}|x| \leqslant t^{4} + x^{2}$, on a $|f(t, x)| \leqslant 2|t|$, d'où la continuité en $(0, 0)$ ; ailleurs, $f$ est une fraction rationnelle de dénominateur non nul. Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, $f$ est de classe $\mathcal{C}^{1}$, donc localement lipschitzienne en $x$. En revanche, $\dfrac{f(t, t^{2}) - f(t, 0)}{t^{2}} = \dfrac{2t}{t^{2}} = \dfrac{2}{t}$ n'est pas borné quand $t \to 0$ : 
    $$\boxed{f \text{ n'est lipschitzienne en } x \text{ sur aucun voisinage de } (0, 0)}\text{.}$$
     On en déduit l'existence de solutions pour toute donnée initiale (Peano, cours, th. 2), et l'unicité pour toute donnée initiale différente de $(0, 0)$.

    $\triangleright$ *2.* Avec $\varphi = t^{2}\psi$, $\varphi' = 2t\psi + t^{2}\psi'$ et $f(t, t^{2}\psi) = \dfrac{4t\psi}{1 + \psi^{2}}$, d'où 
    $$(E) : \quad \boxed{\psi' = \frac{2\psi(1 - \psi^{2})}{t(1 + \psi^{2})}.}$$
     Ses solutions constantes sont $0$, $1$ et $-1$. Sinon, avec $\dfrac{1 + \psi^{2}}{\psi(1 - \psi^{2})} = \dfrac{1}{\psi} + \dfrac{1}{1 - \psi} - \dfrac{1}{1 + \psi}$, on obtient $\ln\left|\dfrac{\psi}{1 - \psi^{2}}\right| = 2\ln|t| + K$, soit $\dfrac{\psi}{1 - \psi^{2}} = Ct^{2}$. En revenant à $\varphi$ : $\varphi = C(t^{4} - \varphi^{2})$, c'est-à-dire 
    $$\boxed{\varphi = 0, \quad \varphi = \pm t^{2}, \quad \varphi = \frac{-1 \pm \sqrt{1 + 4C^{2}t^{4}}}{2C}\ (C \neq 0).}$$

    $\triangleright$ *3.* Les fonctions $0$, $t^{2}$, $-t^{2}$ et $\varphi_{C} = \dfrac{\sqrt{1 + 4C^{2}t^{4}} - 1}{2C}$ sont définies et dérivables sur $\mathbb{R}$, nulles en $0$ de dérivée nulle, et vérifient $(2)$ partout (en $t = 0$, $\varphi'(0) = 0 = f(0, 0)$) ; la vérification par calcul formel le confirme. Le problème de Cauchy en $(0, 0)$ a donc $\boxed{\text{une infinité de solutions}}$ ; on peut même recoller, en $t = 0$, une branche pour $t < 0$ et une autre pour $t > 0$. L'existence est garantie par le théorème de Peano, mais l'unicité est perdue exactement au seul point où $f$ n'est pas lipschitzienne.

    ![Figure](documents/figures/d42f753728409c5a.svg)

    Toutes les courbes dessinées passent par l'origine avec une tangente horizontale et restent entre les deux paraboles rouges, puisque $|\psi| < 1$ pour les $\varphi_{C}$ ; pour $|t|$ grand, $\varphi_{C}(t) \sim \operatorname{sgn}(C)\,t^{2}$, et elles se rapprochent de l'une des deux paraboles.
- id: "l3-cd-06-21"
  feuille: "f-l3-cd-06"
  numero: 21
  partie: "Existence et unicité"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [existence et unicité, condition de Lipschitz]
  noeuds: [ed-cauchy-lipschitz, ed-peano, ed-gronwall]
  notions: [localement-lipschitzienne]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    *(Lemme de comparaison.)* Soit $f$, $g : \mathbb{R} \times \mathbb{R} \to \mathbb{R}$ telles que $f(t, x) < g(t, x)$ pour tout $(t, x)$. Soit $(t_{0}, x_{0}) \in \mathbb{R}^{2}$ et les problèmes de Cauchy 
    $$x' = f(t, x),\ x(t_{0}) = x_{0} ; \qquad y' = g(t, y),\ y(t_{0}) = x_{0}.$$

    **1.** *Cas lipschitzien.* On suppose $f$ et $g$ globalement lipschitziennes sur $\mathbb{R} \times \mathbb{R}$.

    **(a)** Justifier l'existence de solutions $x$, $y \in \mathcal{C}^{1}(\mathbb{R}, \mathbb{R})$ des deux problèmes.

    **(b)** Montrer que $x(t) < y(t)$ pour tout $t > t_{0}$ ; on pourra étudier $w = x - y$. Que peut-on dire pour $t < t_{0}$ ?

    **(c)** Montrer que, si l'inégalité $f \leqslant g$ est seulement large, alors $x(t) \leqslant y(t)$ pour tout $t \geqslant t_{0}$. Qu'en est-il pour $t \leqslant t_{0}$ ?

    **2.** *Cas continu.* On suppose seulement $f$ et $g$ continues, et qu'il existe un intervalle ouvert $I \ni t_{0}$ et des solutions $x$, $y \in \mathcal{C}^{1}(I, \mathbb{R})$ des deux problèmes. Montrer que $x(t) < y(t)$ pour tout $t \in I$, $t > t_{0}$. On pourra considérer $J = \{c \in I \,;\, c > t_{0},\ x(t) < y(t) \text{ pour tout } t \in \,]t_{0}, c[\}$.
  corrige: |
    $\triangleright$ *1 (a).* Si $f$ est $L$-lipschitzienne, $|f(t, x)| \leqslant L|x| + |f(t, 0)|$ ; par le théorème de Cauchy-Lipschitz et la prop. 12 du cours, les deux problèmes ont des solutions uniques définies sur $\mathbb{R}$.

    $\triangleright$ *1 (b).* Soit $w = x - y$. On a $w(t_{0}) = 0$ et $w'(t_{0}) = f(t_{0}, x_{0}) - g(t_{0}, x_{0}) < 0$, donc $w < 0$ sur un intervalle $]t_{0}, t_{0} + \eta[$. Supposons que $w$ s'annule après $t_{0}$, et soit $t_{1}$ le plus petit zéro de $w$ dans $[t_{0} + \eta, +\infty[$ (l'ensemble des zéros est fermé). Alors $w < 0$ sur $]t_{0}, t_{1}[$ et $w(t_{1}) = 0$, donc $w'(t_{1}) \geqslant 0$ ; mais $x(t_{1}) = y(t_{1})$, d'où $w'(t_{1}) = f(t_{1}, x(t_{1})) - g(t_{1}, x(t_{1})) < 0$ : contradiction. Ainsi $\boxed{x(t) < y(t) \text{ pour tout } t > t_{0}}$. Pour $t < t_{0}$, le même raisonnement, mené vers la gauche, donne $\boxed{x(t) > y(t)}$ : les inégalités s'inversent, car $w$ est positive juste avant $t_{0}$.

    $\triangleright$ *1 (c).* Si seulement $f \leqslant g$, posons $g_{\varepsilon} = g + \varepsilon$, avec $\varepsilon > 0$ : $f < g_{\varepsilon}$, et la solution $y_{\varepsilon}$ associée vérifie $x < y_{\varepsilon}$ sur $]t_{0}, +\infty[$. Si $L$ est la constante de Lipschitz de $g$, pour $t \geqslant t_{0}$, 
    $$|y_{\varepsilon}(t) - y(t)| \leqslant \varepsilon(t - t_{0}) + L\int_{t_{0}}^{t}|y_{\varepsilon} - y|,$$
     et le lemme de Gronwall (cours, prop. 2) donne $|y_{\varepsilon}(t) - y(t)| \leqslant \varepsilon(t - t_{0})e^{L(t - t_{0})} \to 0$. En passant à la limite, 
    $$\boxed{x(t) \leqslant y(t) \text{ pour } t \geqslant t_{0}}\text{,}$$
     et de même $x(t) \geqslant y(t)$ pour $t \leqslant t_{0}$. Sans hypothèse de Lipschitz, l'inégalité large ne suffit plus : pour $f = g = \sqrt{|x|}$ et $x_{0} = 0$, on peut prendre $x = \dfrac{t^{2}}{4}$ et $y = 0$ pour $t \geqslant 0$ (exercice 18).

    $\triangleright$ *2.* La démonstration de 1 (b) n'utilise que la continuité de $f$ et $g$ et l'existence des solutions sur $I$ : elle s'applique telle quelle. Dans les termes de l'indication, $J$ est un intervalle non vide (il contient $t_{0} + \eta$) ; si $c = \sup J < \sup I$, alors $w < 0$ sur $]t_{0}, c[$ et $w(c) = 0$ par continuité et maximalité, ce qui conduit à la même contradiction en $c$. Donc 
    $$\boxed{x < y \text{ sur } I \cap \left]t_{0}, +\infty\right[}\text{.}$$

    ![Figure](documents/figures/250a5f8092aee9b6.svg)

    Les deux solutions partent de l'origine ; la rouge, gouvernée par le champ le plus grand, reste au-dessus après $t_{0} = 0$ et en dessous avant.
- id: "l3-cd-06-22"
  feuille: "f-l3-cd-06"
  numero: 22
  partie: "Solutions maximales, théorème des bouts"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["solutions maximales, théorème des bouts", condition de Lipschitz]
  noeuds: [ed-maximales, ed-compacts, ed-cauchy-lipschitz]
  notions: [solution-maximale, localement-lipschitzienne]
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Soit $I$ un intervalle ouvert, $n \geqslant 1$ et $f : I \times \mathbb{R}^{n} \to \mathbb{R}^{n}$ continue, localement lipschitzienne par rapport à sa seconde variable. Soit $(t_{0}, x_{0}) \in I \times \mathbb{R}^{n}$ et le problème de Cauchy $(4)$ : $x' = f(t, x)$, $x(t_{0}) = x_{0}$.

    **1.** Justifier l'existence et l'unicité d'une solution maximale de $(4)$, définie sur un intervalle ouvert $J \subset I$.

    **2.** Montrer que, si $\sup J < \sup I$, alors $\lVert x(t) \rVert \to +\infty$ quand $t \to \sup J$.

    **3.** Montrer que, si $x$ est bornée sur $J$, alors $J = I$ ; plus généralement, que si $x$ est bornée sur tout intervalle borné inclus dans $J$, alors elle est globale.

    **4.** *Cas $f$ bornée.* Montrer que, si de plus $f$ est bornée, toute solution maximale est globale.

    **5.** *Cas sous-linéaire.* Montrer que, s'il existe $\lambda$, $\mu > 0$ tels que $\lVert f(t, x) \rVert \leqslant \lambda\lVert x \rVert + \mu$ pour tous $t$, $x$, alors toute solution maximale est globale.
  corrige: |
    $\triangleright$ *1.* C'est le théorème de Cauchy-Lipschitz, version solution maximale (cours, th. 5), dont l'intervalle de définition est ouvert (cours, prop. 8).

    $\triangleright$ *2.* Notons $\beta = \sup J < \sup I$. Si $\lVert x(t) \rVert$ ne tendait pas vers $+\infty$ quand $t \to \beta$, il existerait $R > 0$ et une suite $t_{n} \to \beta$, $t_{n} < \beta$, avec $\lVert x(t_{n}) \rVert \leqslant R$. Les points $(t_{n}, x(t_{n}))$ resteraient dans le compact $K = [t_{0}, \beta] \times B_{f}(0, R)$, inclus dans $I \times \mathbb{R}^{n}$ puisque $\beta < \sup I$ : cela contredit le théorème des bouts (cours, th. 3). Donc $\boxed{\lVert x(t) \rVert \to +\infty}$ : c'est la prop. 9 du cours.

    $\triangleright$ *3.* Si $x$ est bornée sur $J$, elle ne peut pas tendre vers l'infini, donc $\sup J = \sup I$ par 2, et de même $\inf J = \inf I$ : $\boxed{J = I}$. Si $x$ est seulement bornée sur tout intervalle borné inclus dans $J$ et si $\beta = \sup J < \sup I$, alors $\beta$ est fini, $x$ est bornée sur $[t_{0}, \beta[$, et l'on aboutit à la même contradiction.

    $\triangleright$ *4.* Si $\lVert f \rVert \leqslant M$, alors $\lVert x(t) - x_{0} \rVert \leqslant M|t - t_{0}|$ (cours, prop. 1) : $x$ est bornée sur tout intervalle borné, donc $\boxed{\text{globale}}$ par 3.

    $\triangleright$ *5.* Pour $t \in [t_{0}, \beta[$, $\lVert x(t) \rVert \leqslant \lVert x_{0} \rVert + \int_{t_{0}}^{t}(\lambda\lVert x(s) \rVert + \mu)\,\mathrm{d} s$. Si $\beta$ était fini, on aurait $\lVert x(t) \rVert \leqslant \lVert x_{0} \rVert + \mu(\beta - t_{0}) + \lambda\int_{t_{0}}^{t}\lVert x \rVert$, et par le lemme de Gronwall, $\lVert x(t) \rVert \leqslant \big(\lVert x_{0} \rVert + \mu(\beta - t_{0})\big)e^{\lambda(\beta - t_{0})}$ : $x$ serait bornée, ce que 3 exclut. De même à gauche : toute solution maximale est $\boxed{\text{globale}}$. C'est la prop. 12 du cours, à coefficients constants.

    ![Figure](documents/figures/80c90fdd33fc7288.svg)

    Lorsque $U = I \times \mathbb{R}^{n}$ et que la solution s'arrête en $\beta < \sup I$, le seul moyen pour la courbe intégrale de quitter tous les compacts (comme le rectangle $K$) est de partir à l'infini verticalement. Dans un domaine $U$ plus petit, elle peut aussi s'approcher du bord : c'est l'exercice suivant.
- id: "l3-cd-06-23"
  feuille: "f-l3-cd-06"
  numero: 23
  partie: "Solutions maximales, théorème des bouts"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["solutions maximales, théorème des bouts", condition de Lipschitz]
  noeuds: [ed-maximales, ed-compacts, ed-cauchy-lipschitz]
  notions: [solution-maximale, localement-lipschitzienne]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    **1.** Soit $f(t, x) = -\dfrac{1}{x}$ sur $\mathbb{R} \times \,]0, +\infty[$. Montrer que $f$ est continue et localement lipschitzienne par rapport à sa seconde variable. Pour $x_{0} > 0$, calculer explicitement la solution maximale du problème $x' = -\dfrac{1}{x}$, $x(0) = x_{0}$, et son intervalle de définition $]t_{*}, T^{*}[$. Étudier le comportement de $x(t)$ quand $t \to T^{*}$, et faire le lien avec le théorème des bouts.

    **2.** On considère le problème $v' = -v^{2}$, $v(0) = v_{0}$. Montrer que, pour tout $v_{0} \in \mathbb{R}$, il admet une unique solution maximale, définie sur un intervalle de la forme $]-T, T^{*}[$ avec $T$, $T^{*} \in \,]0, +\infty]$. Montrer que, si $v_{0} \neq 0$, cette solution ne s'annule pas. La calculer, ainsi que $T$ et $T^{*}$, en fonction de $v_{0}$.
  corrige: |
    $\triangleright$ *1.* $f$ est continue et de classe $\mathcal{C}^{1}$ sur l'ouvert $\mathbb{R} \times \left]0, +\infty\right[$, donc localement lipschitzienne en $x$ (cours, prop. 10). L'équation s'écrit $(x^{2})' = 2xx' = -2$, donc $x(t)^{2} = x_{0}^{2} - 2t$ et 
    $$\boxed{x(t) = \sqrt{x_{0}^{2} - 2t}, \qquad J = \Big]-\infty, \frac{x_{0}^{2}}{2}\Big[.}$$
     Quand $t \to T^{*} = \dfrac{x_{0}^{2}}{2}$, $x(t) \to 0$ et $x'(t) = -\dfrac{1}{x(t)} \to -\infty$. La solution reste *bornée* et pourtant n'est pas globale : la courbe intégrale sort de tout compact de $U = \mathbb{R} \times \left]0, +\infty\right[$ en s'approchant du bord $x = 0$, sans exploser. C'est le piège déjà signalé dans le cours : la prop. 9 suppose $U = I \times \mathbb{R}^{p}$, et l'exercice 22 ne s'applique pas ici.

    $\triangleright$ *2.* $v \mapsto -v^{2}$ est de classe $\mathcal{C}^{1}$ : il existe une unique solution maximale, d'intervalle ouvert contenant $0$, de la forme $]-T, T^{*}[$. Si $v_{0} \neq 0$ et si $v$ s'annulait en $t_{1}$, elle coïnciderait avec la solution nulle issue de $(t_{1}, 0)$ par unicité, et l'on aurait $v_{0} = 0$. Elle ne s'annule donc pas, et $\Big(\dfrac{1}{v}\Big)' = 1$ donne 
    $$\boxed{v(t) = \frac{v_{0}}{1 + v_{0}t}.}$$
     Si $v_{0} > 0$ : $T = \dfrac{1}{v_{0}}$ et $T^{*} = +\infty$ ; si $v_{0} < 0$ : $T = +\infty$ et $T^{*} = \dfrac{1}{|v_{0}|}$ ; si $v_{0} = 0$ : $T = T^{*} = +\infty$. À la borne finie, $|v| \to +\infty$, conformément à l'exercice 22.

    ![Figure](documents/figures/2801f8d461f6386f.svg)

    À gauche, les solutions s'arrêtent sur l'axe violet $x = 0$, bord du domaine, en un point rouge où leur tangente est verticale : elles ne sont pas globales bien que bornées. À droite, les solutions maximales $v = \dfrac{v_{0}}{1 + v_{0}t}$, pour $v_{0} = \pm\dfrac{1}{2}, \pm 1, \pm 2$, branches d'hyperboles qui contiennent l'instant $0$, explosent en temps fini, vers le passé si $v_{0} > 0$, vers le futur si $v_{0} < 0$ ; elles ne croisent jamais la solution nulle.
- id: "l3-cd-06-24"
  feuille: "f-l3-cd-06"
  numero: 24
  partie: "Solutions maximales, théorème des bouts"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["solutions maximales, théorème des bouts"]
  noeuds: [ed-maximales, ed-compacts]
  notions: [solution-maximale]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    On considère le problème de Cauchy $y'(x) = x\,y(x)^{2}$, $y(x_{0}) = y_{0}$.

    **1.** Montrer que, pour tout $(x_{0}, y_{0}) \in \mathbb{R}^{2}$, il admet une unique solution maximale, définie sur un intervalle ouvert $I$.

    **2.** Quelle est la solution maximale lorsque $y_{0} = 0$ ?

    **3.** Lorsque $y_{0} \neq 0$, montrer que la solution maximale est strictement positive sur $I$ ou strictement négative sur $I$, puis la calculer.
  corrige: |
    $\triangleright$ *1.* $(x, y) \mapsto xy^{2}$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ : le théorème de Cauchy-Lipschitz s'applique (cours, th. 5).

    $\triangleright$ *2.* La fonction nulle est solution sur $\mathbb{R}$ ; par unicité, c'est $\boxed{\text{la solution maximale } y = 0}$.

    $\triangleright$ *3.* Si $y$ s'annulait en un point, elle serait nulle par unicité (question 2 appliquée en ce point), d'où $y_{0} = 0$. Ne s'annulant pas, elle est de signe constant par le théorème des valeurs intermédiaires.

    $\triangleright$ *4.* $\Big(-\dfrac{1}{y}\Big)' = x$, d'où $\dfrac{1}{y} = \dfrac{K - x^{2}}{2}$ et 
    $$\boxed{y(x) = \frac{2}{K - x^{2}}, \qquad K = \frac{2}{y_{0}} + x_{0}^{2}.}$$
     L'intervalle $I$ est la composante de $\{x \,;\, x^{2} \neq K\}$ qui contient $x_{0}$ : $\mathbb{R}$ si $K < 0$ (alors $y < 0$) ; $]-\infty, 0[$ ou $]0, +\infty[$ si $K = 0$ ; si $K > 0$, l'un des intervalles $]-\infty, -\sqrt{K}[$, $]-\sqrt{K}, \sqrt{K}[$, $]\sqrt{K}, +\infty[$, avec $y > 0$ au milieu et $y < 0$ sur les deux autres.

    ![Figure](documents/figures/2133c7d16f3127c0.svg)

    Pour $K = 1$, la formule $\dfrac{2}{1 - x^{2}}$ décrit trois solutions maximales différentes, séparées par les asymptotes rouges : une positive sur $]-1, 1[$ et deux négatives à l'extérieur. Les solutions négatives avec $K < 0$ sont globales et tendent vers $0$ à l'infini.
- id: "l3-cd-06-25"
  feuille: "f-l3-cd-06"
  numero: 25
  partie: "Solutions maximales, théorème des bouts"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["solutions maximales, théorème des bouts"]
  noeuds: [ed-maximales, ed-compacts]
  notions: [solution-maximale]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    **1.** Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ telle que $xf(t, x) < 0$ pour tout $t$ et tout $x \neq 0$. Montrer que toutes les solutions maximales de $x' = f(t, x)$ sont définies jusqu'en $+\infty$ et admettent une limite finie en $+\infty$.

    **2.** Soit $F : \mathbb{R}^{n} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ telle que $F(x) \to +\infty$ quand $\lVert x \rVert \to +\infty$, et $(t_{0}, x_{0}) \in \mathbb{R} \times \mathbb{R}^{n}$. On considère le problème $x' = -\nabla F(x)$, $x(t_{0}) = x_{0}$.

    **(a)** Montrer qu'il admet une unique solution maximale, définie sur un intervalle ouvert $]t_{-}, t_{+}[$.

    **(b)** Montrer que $t \mapsto F\big(x(t)\big)$ est décroissante. En déduire que $t_{+} = +\infty$.

    **(c)** Dans le cas $n = 1$ et $F(x) = \dfrac{x^{4}}{4}$, montrer que l'on peut avoir $t_{-} > -\infty$.
  corrige: |
    $\triangleright$ *1.* En faisant tendre $x$ vers $0$ par valeurs positives puis négatives dans $xf(t, x) < 0$, on obtient $f(t, 0) \leqslant 0$ et $f(t, 0) \geqslant 0$ : $f(t, 0) = 0$, et la fonction nulle est solution. Par unicité (cours, th. 5), toute autre solution maximale ne s'annule pas ; supposons-la positive. Alors $x' = f(t, x) < 0$ : $x$ décroît, et pour $t \geqslant t_{0}$ elle reste dans $]0, x(t_{0})]$. Bornée sur $[t_{0}, \beta[$, elle est $\boxed{\text{définie jusqu'en } +\infty}$ (exercice 22, question 3), et, monotone et bornée, elle $\boxed{\text{a une limite finie } \ell \geqslant 0}$ : la droite $x = \ell$ est asymptote. Cette limite n'est pas toujours nulle : pour $f(t, x) = -xe^{-t}$, les solutions $x_{0}\exp(e^{-t} - e^{-t_{0}})$ tendent vers $x_{0}e^{-e^{-t_{0}}} \neq 0$.

    $\triangleright$ *2 (a).* $-\nabla F$ est de classe $\mathcal{C}^{1}$ : le théorème de Cauchy-Lipschitz s'applique.

    $\triangleright$ *2 (b).* $\dfrac{\mathrm{d}}{\mathrm{d} t}F(x(t)) = \langle\nabla F(x(t)), x'(t)\rangle = -\lVert \nabla F(x(t)) \rVert^{2} \leqslant 0$ : $\boxed{t \mapsto F(x(t)) \text{ décroît}}$. Pour $t \geqslant t_{0}$, $x(t)$ reste dans $\{F \leqslant F(x_{0})\}$, borné puisque $F \to +\infty$ à l'infini. Par l'exercice 22, $\boxed{t_{+} = +\infty}$.

    $\triangleright$ *2 (c).* $x' = -x^{3}$, avec $x(t_{0}) = x_{0} \neq 0$ : $(x^{-2})' = 2$, d'où 
    $$x(t) = \frac{x_{0}}{\sqrt{1 + 2x_{0}^{2}(t - t_{0})}}, \qquad \boxed{t_{-} = t_{0} - \frac{1}{2x_{0}^{2}} > -\infty.}$$
     Vers le passé, le flot de gradient remonte la pente de $F$, et rien n'empêche alors l'explosion.

    ![Figure](documents/figures/b5a95663d276ba7d.svg)

    Pour $F(x_{1}, x_{2}) = \dfrac{(x_{1}^{2} - 1)^{2}}{4} + x_{2}^{2}$, dont on a tracé quelques lignes de niveau en gris, les trajectoires de $x' = -\nabla F(x)$ coupent orthogonalement les lignes de niveau et descendent vers les minima $(\pm 1, 0)$ ; seules celles de l'axe $x_{1} = 0$ aboutissent au col $(0, 0)$.
- id: "l3-cd-06-26"
  feuille: "f-l3-cd-06"
  numero: 26
  partie: "Solutions maximales, théorème des bouts"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["solutions maximales, théorème des bouts"]
  noeuds: [ed-maximales, ed-compacts]
  notions: [solution-maximale]
  page_enonce: 7
  page_corrige: 19
  enonce: |
    *(Solutions maximales et globales d'une équation à variables séparées.)* Soit $\varphi$, $\psi : \mathbb{R} \to \mathbb{R}$ continues et strictement positives, et l'équation $(6)$ : $x'(t) = \varphi\big(x(t)\big)\psi(t)$.

    **1.** On suppose $\displaystyle\int_{-\infty}^{0}\frac{\mathrm{d} y}{\varphi(y)} = \int_{0}^{+\infty}\frac{\mathrm{d} y}{\varphi(y)} = +\infty$ et $\displaystyle\int_{-\infty}^{+\infty}\psi(t)\,\mathrm{d} t < +\infty$. Montrer que toute solution maximale est globale et possède deux asymptotes horizontales distinctes.

    **2.** On suppose $\displaystyle\int_{-\infty}^{+\infty}\frac{\mathrm{d} y}{\varphi(y)} < +\infty$, $\displaystyle\int_{-\infty}^{+\infty}\psi(t)\,\mathrm{d} t < +\infty$ et $\displaystyle\int_{-\infty}^{+\infty}\frac{\mathrm{d} y}{\varphi(y)} > \int_{-\infty}^{+\infty}\psi(t)\,\mathrm{d} t$. Montrer que $(6)$ possède une infinité de solutions globales et une infinité de solutions maximales non globales.

    **3.** *Exemple.* Que peut-on dire des solutions de l'équation $x' = \dfrac{(x^{2} + 1)^{1/3}}{t^{4} + 1}$ ?
  corrige: |
    Posons $G(x) = \int_{0}^{x}\dfrac{\mathrm{d} y}{\varphi(y)}$ et $\Psi(t) = \int_{0}^{t}\psi(s)\,\mathrm{d} s$. Ce sont des bijections strictement croissantes, de classe $\mathcal{C}^{1}$, de $\mathbb{R}$ sur des intervalles ouverts $]a, b[$ et $]-m_{-}, m_{+}[$, avec 
    $$a = -\int_{-\infty}^{0}\frac{\mathrm{d} y}{\varphi}, \quad b = \int_{0}^{+\infty}\frac{\mathrm{d} y}{\varphi}, \quad m_{-} = \int_{-\infty}^{0}\psi, \quad m_{+} = \int_{0}^{+\infty}\psi.$$

    $\triangleright$ *Toutes les solutions.* Si $x$ est une solution sur $J$, $\big(G(x)\big)' = \dfrac{x'}{\varphi(x)} = \psi$, donc $G(x(t)) = \Psi(t) + c$, et $x = G^{-1}(\Psi + c)$. Réciproquement, cette formule définit une solution sur tout intervalle où $\Psi(t) + c \in \,]a, b[$. Ainsi l'unicité vaut ici, alors que $\varphi$ n'est que continue : le changement d'inconnue $G$ redresse l'équation. La solution maximale de constante $c$ est définie sur l'intervalle $\{t \,;\, a < \Psi(t) + c < b\}$, et, lorsque $\Psi(t) + c$ tend vers $b$ (resp. $a$), $x(t) \to +\infty$ (resp. $-\infty$).

    $\triangleright$ *1.* Ici $a = -\infty$ et $b = +\infty$ : toute solution maximale est définie sur $\mathbb{R}$. Quand $t \to \pm\infty$, $\Psi(t) \to m_{+}$ et $-m_{-}$, finies, donc $x(t)$ tend vers $G^{-1}(m_{+} + c)$ et $G^{-1}(c - m_{-})$, distinctes puisque $m_{+} + m_{-} = \int_{\mathbb{R}}\psi > 0$ : $\boxed{\text{deux asymptotes horizontales distinctes}}$.

    $\triangleright$ *2.* Ici $b - a = \int_{\mathbb{R}}\dfrac{1}{\varphi} > \int_{\mathbb{R}}\psi = m_{+} + m_{-}$. La solution de constante $c$ est globale si et seulement si $]c - m_{-}, c + m_{+}[\, \subset \,]a, b[$, c'est-à-dire $c \in [a + m_{-}, b - m_{+}]$, intervalle non réduit à un point : $\boxed{\text{une infinité de solutions globales}}$. Pour $c \in \,]b - m_{+}, b + m_{-}[$, la solution n'est définie que sur $\{t \,;\, \Psi(t) < b - c\}$, demi-droite majorée, et explose vers $+\infty$ : 
    $$\boxed{\text{une infinité de solutions maximales non globales}}\text{.}$$

    $\triangleright$ *3.* $\dfrac{1}{(y^{2} + 1)^{1/3}} \sim |y|^{-2/3}$ n'est intégrable ni en $+\infty$ ni en $-\infty$, et $\int_{\mathbb{R}}\dfrac{\mathrm{d} t}{t^{4} + 1} = \dfrac{\pi}{\sqrt{2}}$ est finie : c'est le cas 1. Toutes les solutions sont 
    $$\boxed{\text{globales, avec deux asymptotes horizontales distinctes}}\text{.}$$

    $\triangleright$ *Illustration du cas 2.* Pour $\varphi(x) = 1 + x^{2}$ et $\psi(t) = \dfrac{1}{2(1 + t^{2})}$, $\int\dfrac{1}{\varphi} = \pi > \dfrac{\pi}{2} = \int\psi$ et les solutions sont explicites : $x(t) = \tan\Big(\dfrac{\operatorname{Arctan} t}{2} + c\Big)$, globales si et seulement si $|c| \leqslant \dfrac{\pi}{4}$.

    ![Figure](documents/figures/4e146a08b9f95265.svg)

    Les solutions globales sont comprises entre celles de paramètre $\pm\dfrac{\pi}{4}$, qui partent de $0$ en $\mp\infty$ et tendent vers $\pm\infty$ en $\pm\infty$ ; les solutions rouges, de paramètre plus grand, explosent en temps fini.
- id: "l3-cd-06-27"
  feuille: "f-l3-cd-06"
  numero: 27
  partie: "Études qualitatives"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [études qualitatives]
  noeuds: [ed-maximales, ed-cauchy-lipschitz]
  notions: [solution-maximale]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    On considère le problème de Cauchy $y' = \sin y$, $y(0) = y_{0}$.

    **1.** Montrer qu'il admet une unique solution maximale, qu'elle est globale et de classe $\mathcal{C}^{\infty}$.

    **2.** Quelles sont les solutions stationnaires ?

    **3.** On suppose $0 < y_{0} < \pi$. Montrer que $0 < y(t) < \pi$ pour tout $t \in \mathbb{R}$, que $y(t) \to 0$ quand $t \to -\infty$ et $y(t) \to \pi$ quand $t \to +\infty$.
  corrige: |
    $\triangleright$ *1.* $\sin$ est de classe $\mathcal{C}^{1}$ : il existe une unique solution maximale (cours, th. 5), globale car le second membre est borné (exercice 22, question 4). Si $y$ est de classe $\mathcal{C}^{k}$, alors $y' = \sin y$ aussi, donc $y$ est de classe $\mathcal{C}^{k + 1}$ : par récurrence, $\boxed{y \in \mathcal{C}^{\infty}(\mathbb{R})}$.

    $\triangleright$ *2.* Les constantes solutions vérifient $\sin y = 0$ : $\boxed{y = k\pi,\ k \in \mathbb{Z}}$.

    $\triangleright$ *3.* Si $y$ atteignait $0$ ou $\pi$, elle coïnciderait avec la solution stationnaire correspondante par unicité ; par le théorème des valeurs intermédiaires, $\boxed{0 < y(t) < \pi}$ pour tout $t$. Alors $y' = \sin y > 0$ : $y$ croît, et, bornée, admet des limites $\ell_{-} < \ell_{+}$ dans $[0, \pi]$. Si $\sin\ell_{+} \neq 0$, alors $y'(t) \to \sin\ell_{+} > 0$, et $y(t) - y(0) = \int_{0}^{t}y'$ tendrait vers $+\infty$ : c'est absurde. Donc $\ell_{+} \in \{0, \pi\}$, et $\ell_{+} > y_{0} > 0$ impose $\boxed{\ell_{+} = \pi}$ ; de même $\boxed{\ell_{-} = 0}$. Explicitement, $\Big(\ln\tan\dfrac{y}{2}\Big)' = \dfrac{y'}{\sin y} = 1$ donne $\tan\dfrac{y(t)}{2} = \tan\dfrac{y_{0}}{2}\,e^{t}$.

    ![Figure](documents/figures/bb849d6fe74de4eb.svg)

    Les solutions stationnaires (en rouge) découpent le plan en bandes que les autres solutions ne peuvent pas franchir. Dans chaque bande, la solution relie les deux bords : elle croît de $0$ à $\pi$ (ou de $2k\pi$ à $(2k + 1)\pi$) et décroît de $\pi$ à $0$ dans les bandes où $\sin y < 0$ ; les équilibres $2k\pi$ sont répulsifs, les équilibres $(2k + 1)\pi$ attractifs.
- id: "l3-cd-06-28"
  feuille: "f-l3-cd-06"
  numero: 28
  partie: "Études qualitatives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [études qualitatives]
  noeuds: [ed-maximales, ed-cauchy-lipschitz]
  notions: [solution-maximale]
  page_enonce: 8
  page_corrige: 21
  enonce: |
    On considère le problème de Cauchy $x'(t) = t^{2} + x(t)^{2}$, $x(0) = 0$.

    **1.** Justifier l'existence d'une unique solution maximale $(I, x)$.

    **2.** Montrer que $x$ est impaire, et étudier sa monotonie et sa convexité.

    **3.** Montrer que l'intervalle $I$ est borné, puis étudier les limites de $x$ aux bornes de $I$.
  corrige: |
    $\triangleright$ *1.* Le second membre est polynomial : le théorème de Cauchy-Lipschitz s'applique (cours, th. 5).

    $\triangleright$ *2.* Soit $z(t) = -x(-t)$, définie sur $-I$. Alors $z'(t) = x'(-t) = t^{2} + z(t)^{2}$ et $z(0) = 0$ : $z$ est une solution maximale du même problème, donc $-I = I$ et $z = x$ par unicité : $\boxed{x \text{ est impaire}}$. Comme $x' = t^{2} + x^{2} > 0$ pour $t \neq 0$, $\boxed{x \text{ est strictement croissante}}$. Pour $t > 0$, $x(t) > x(0) = 0$, et $x'' = 2t + 2xx' > 0$ : $\boxed{x \text{ est convexe sur } I \cap \mathbb{R}_{+}}$, concave sur $I \cap \mathbb{R}_{-}$ par imparité.

    $\triangleright$ *3.* Pour $t \geqslant 1$, $x' \geqslant 1 + x^{2}$, donc $(\operatorname{Arctan} x)' \geqslant 1$ et $\operatorname{Arctan} x(t) \geqslant \operatorname{Arctan} x(1) + t - 1$. Comme $\operatorname{Arctan} < \dfrac{\pi}{2}$, on obtient $t - 1 < \dfrac{\pi}{2} - \operatorname{Arctan} x(1) < \dfrac{\pi}{2}$ pour tout $t \in I$, $t \geqslant 1$ : $\boxed{\sup I \leqslant 1 + \frac{\pi}{2}}$, et $I$ est borné par imparité. Croissante et non bornée à droite (sinon elle serait globale, exercice 22), $x$ tend vers $\boxed{+\infty}$ en $\sup I$, et vers $\boxed{-\infty}$ en $\inf I$. Numériquement, $\sup I \approx 2{,}0031$ ; on retrouve le phénomène de la prop. 13 du cours pour $y' = t + y^{2}$.

    ![Figure](documents/figures/3c726a330b865527.svg)

    La solution, impaire, croissante, concave puis convexe, explose en $\pm 2{,}003$ (tirets rouges), en deçà de la majoration $1 + \dfrac{\pi}{2} \approx 2{,}57$ obtenue par comparaison avec $x' = 1 + x^{2}$ (pointillés violets).
- id: "l3-cd-06-29"
  feuille: "f-l3-cd-06"
  numero: 29
  partie: "Études qualitatives"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [études qualitatives]
  noeuds: [ed-maximales, ed-cauchy-lipschitz]
  notions: [solution-maximale]
  page_enonce: 8
  page_corrige: 22
  enonce: |
    On considère le problème de Cauchy $x'(t) = \dfrac{1}{1 + tx(t)}$, $x(0) = 0$.

    **1.** Justifier l'existence d'une unique solution maximale $(I, x)$.

    **2.** Montrer que $x$ est impaire et strictement croissante.

    **3.** Montrer que la solution est globale, c'est-à-dire que $I = \mathbb{R}$, et étudier les limites de $x$ en $\pm\infty$.
  corrige: |
    $\triangleright$ *1.* Le second membre $\dfrac{1}{1 + tx}$ est de classe $\mathcal{C}^{1}$ sur l'ouvert $U = \{(t, x) \,;\, 1 + tx > 0\}$, qui contient $(0, 0)$, région comprise entre les deux branches de l'hyperbole $tx = -1$ : il existe une unique solution maximale (cours, th. 5).

    $\triangleright$ *2.* Comme à l'exercice 28, $z(t) = -x(-t)$ vérifie $z' = \dfrac{1}{1 + tz}$ et $z(0) = 0$, donc $\boxed{x \text{ est impaire}}$. Comme la courbe reste dans $U$, $x' = \dfrac{1}{1 + tx} > 0$ : $\boxed{x \text{ est strictement croissante}}$.

    $\triangleright$ *3.* Pour $t \geqslant 0$ dans $I$, $x(t) \geqslant 0$, donc $tx \geqslant 0$ et $0 < x' \leqslant 1$ : $0 \leqslant x(t) \leqslant t$. Si $\beta = \sup I$ était fini, la courbe resterait, pour $t \in [0, \beta[$, dans le compact $\{(t, x) \,;\, 0 \leqslant t \leqslant \beta,\ 0 \leqslant x \leqslant \beta\}$, inclus dans $U$ puisque $1 + tx \geqslant 1$ : c'est exclu par le théorème des bouts (cours, th. 3). Donc $\beta = +\infty$, et $\boxed{I = \mathbb{R}}$ par imparité. La limite $\ell$ en $+\infty$ existe par croissance ; si elle était finie, on aurait $x'(t) \geqslant \dfrac{1}{1 + \ell t}$, non intégrable en $+\infty$, et $x$ tendrait vers $+\infty$ : contradiction. Donc $\boxed{x(t) \to +\infty}$ en $+\infty$ et $-\infty$ en $-\infty$. La croissance est très lente : $\Big(\dfrac{x^{2}}{2}\Big)' = \dfrac{x}{1 + tx} \leqslant \dfrac{1}{t}$ donne $x(t) \leqslant \sqrt{2\ln t + C}$, et numériquement $x(10^{6}) \approx 5{,}21$ pour $\sqrt{2\ln 10^{6}} \approx 5{,}26$.

    ![Figure](documents/figures/c653e79a5eee1616.svg)

    La solution reste dans la région $1 + tx > 0$, bordée par l'hyperbole violette, et, dans le premier quadrant, sous la droite $x = t$ ; elle croît indéfiniment mais très lentement, comme $\sqrt{2\ln t}$.
- id: "l3-cd-06-30"
  feuille: "f-l3-cd-06"
  numero: 30
  partie: "Études qualitatives"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [études qualitatives]
  noeuds: [ed-maximales, ed-cauchy-lipschitz]
  notions: [solution-maximale]
  page_enonce: 8
  page_corrige: 22
  enonce: |
    Soit $t_{0}$, $x_{0} \in \mathbb{R}$. Justifier l'existence d'une unique solution maximale au problème de Cauchy $x' = \cos(tx)$, $x(t_{0}) = x_{0}$, et montrer qu'elle est globale.
  corrige: |
    $(t, x) \mapsto \cos(tx)$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}^{2}$, donc localement lipschitzienne en $x$ (cours, prop. 10) : il existe une unique solution maximale (cours, th. 5). Comme $|\cos(tx)| \leqslant 1$, elle est $\boxed{\text{globale}}$ par l'exercice 22, question 4 : on a $|x(t) - x_{0}| \leqslant |t - t_{0}|$, et la solution ne peut pas exploser.
- id: "l3-cd-06-31"
  feuille: "f-l3-cd-06"
  numero: 31
  partie: "Perspective : équations linéaires à coefficients périodiques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [équations linéaires à coefficients périodiques]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo]
  page_enonce: 8
  page_corrige: 22
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ continue et $T$-périodique ($T > 0$), et l'équation $(1)$ : $u' = f(t)u$.

    **1.** Trouver $b \in \mathbb{R}$ et $q : \mathbb{R} \to \mathbb{R}_{+}^{*}$ continue et $T$-périodique telles que $u$ soit solution de $(1)$ si et seulement si $v : t \mapsto q(t)u(t)$ est solution de $v' = bv$.

    **2.** En déduire une condition nécessaire et suffisante sur $f$ pour que toutes les solutions de $(1)$ soient bornées.
  corrige: |
    $\triangleright$ *1.* Soit $F(t) = \int_{0}^{t}f$ et $b = \dfrac{1}{T}\int_{0}^{T}f$, valeur moyenne de $f$. Par périodicité, $F(t + T) = F(t) + bT$, donc $q(t) = e^{bt - F(t)}$ est continue, strictement positive et $T$-périodique. Les solutions de (1) sont les $u = u_{0}e^{F}$ (exercice 2), et $v = qu = u_{0}e^{bt}$ : $u$ est solution de (1) si et seulement si $v = qu$ est solution de 
    $$\boxed{v' = bv, \quad b = \frac{1}{T}\int_{0}^{T}f, \quad q(t) = e^{bt - F(t)}}\text{.}$$

    $\triangleright$ *2.* Continue, périodique et strictement positive, $q$ est comprise entre deux constantes $0 < m \leqslant q \leqslant M$ : $u$ est bornée si et seulement si $v = u_{0}e^{bt}$ l'est. Toutes les solutions sont donc bornées sur $\mathbb{R}$ si et seulement si $\boxed{\int_{0}^{T}f = 0}$, et sur $\mathbb{R}_{+}$ si et seulement si $\int_{0}^{T}f \leqslant 0$. Seule la moyenne de $f$ compte, pas son signe en chaque point.
- id: "l3-cd-06-32"
  feuille: "f-l3-cd-06"
  numero: 32
  partie: "Perspective : équations linéaires à coefficients périodiques"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équations linéaires à coefficients périodiques]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo]
  page_enonce: 8
  page_corrige: 23
  enonce: |
    **1.** On considère le système $u' = A(t)u$ avec $A(t) = \begin{pmatrix} \cos t & \sin t \\ -\sin t & \cos t \end{pmatrix}$.

    **(a)** Trouver une équation différentielle vérifiée par $r(t) = \sqrt{u_{1}(t)^{2} + u_{2}(t)^{2}}$.

    **(b)** En déduire que les solutions sont toutes bornées sur $\mathbb{R}$.

    **2.** On considère maintenant $A(t) = \begin{pmatrix} \cos t & \sin t \\ \sin t & -\cos t \end{pmatrix}$.

    **(a)** Trouver $M \in \mathcal{M}_{2}(\mathbb{R})$ et $Q : \mathbb{R} \to \mathrm{O}_{2}(\mathbb{R})$ $4\pi$-périodique telles que $A(t) = Q(t)M{}^{t}Q(t)$ pour tout $t$.

    **(b)** Soit $e_{1}(t)$ et $e_{2}(t)$ les colonnes de ${}^{t}Q(t)$. Montrer qu'elles sont dérivables et calculer $e_{1}'$, $e_{2}'$ en fonction de $e_{1}$, $e_{2}$.

    **(c)** Soit $u$ une solution de $u' = A(t)u$ et $v(t) = {}^{t}Q(t)u(t)$. Montrer que $v$ est solution d'un système à coefficients constants $v' = Bv$, où l'on déterminera $B$. Réciproquement, montrer que, si $v' = Bv$, alors $u = Qv$ est solution de $u' = A(t)u$.

    **(d)** Les solutions de $u' = A(t)u$ sont-elles bornées sur $\mathbb{R}_{+}$ ? sur $\mathbb{R}_{-}$ ? sur $\mathbb{R}$ ? On pourra étudier le spectre de $B$.
  corrige: |
    $\triangleright$ *1 (a).* On a $A(t) = \cos t\,I_{2} + \sin t\,J$ avec $J = \begin{pmatrix} 0 & 1 \\ -1 & 0 \end{pmatrix}$ antisymétrique, donc $\langle u, Ju\rangle = 0$ et $(r^{2})' = 2\langle u, A(t)u\rangle = 2\cos t\,r^{2}$. Ainsi $\boxed{r' = \cos t\,r}$ là où $r \neq 0$, et $r(t) = r(0)e^{\sin t}$.

    $\triangleright$ *1 (b).* $r(t) \leqslant r(0)\,e$ : 
    $$\boxed{\text{toutes les solutions sont bornées sur } \mathbb{R}}\text{.}$$
     On peut même préciser : l'angle polaire $\theta$ vérifie $\theta' = -\sin t$, et $u(t) = r(0)e^{\sin t}\big(\cos(\theta_{0} + \cos t - 1), \sin(\theta_{0} + \cos t - 1)\big)$ est $2\pi$-périodique.

    ![Figure](documents/figures/d06485405a0ce60c.svg)

    Les trajectoires issues de $(0{,}35\ ; 0)$ et $(0{,}8\ ; 0)$ (points rouges) sont des courbes fermées, parcourues en un temps $2\pi$ : elles s'éloignent de l'origine d'un facteur $e$, puis y reviennent. La monodromie $R(2\pi, 0)$ est l'identité.

    $\triangleright$ *2 (a).* $A(t)$ est symétrique, de trace nulle et de déterminant $-1$ : c'est la symétrie orthogonale par rapport à la droite d'angle $\dfrac{t}{2}$. Avec la rotation $Q(t)$ d'angle $\dfrac{t}{2}$, de période $4\pi$, et $M = \operatorname{diag}(1, -1)$ : 
    $$\boxed{A(t) = Q(t)MQ(t)^{T}, \qquad Q(t) = \begin{pmatrix} \cos(t/2) & -\sin(t/2) \\ \sin(t/2) & \cos(t/2) \end{pmatrix}.}$$

    $\triangleright$ *2 (b).* $Q(t)^{T} = \begin{pmatrix} \cos(t/2) & \sin(t/2) \\ -\sin(t/2) & \cos(t/2) \end{pmatrix}$ a pour colonnes $e_{1} = \Big(\cos\dfrac{t}{2}, -\sin\dfrac{t}{2}\Big)$ et $e_{2} = \Big(\sin\dfrac{t}{2}, \cos\dfrac{t}{2}\Big)$, et 
    $$\boxed{e_{1}' = -\frac{1}{2}e_{2}, \quad e_{2}' = \frac{1}{2}e_{1}}\text{.}$$

    $\triangleright$ *2 (c).* $v' = (Q^{T})'u + Q^{T}Au = \big((Q^{T})'Q + Q^{T}AQ\big)v$, et $Q^{T}AQ = M$. Par (b), les colonnes de $(Q^{T})'$ sont $-\dfrac{e_{2}}{2}$ et $\dfrac{e_{1}}{2}$, c'est-à-dire $(Q^{T})' = Q^{T}K$ avec $K = \begin{pmatrix} 0 & 1/2 \\ -1/2 & 0 \end{pmatrix}$ ; comme $K$ commute avec les rotations, $(Q^{T})'Q = Q^{T}KQ = K$, d'où 
    $$\boxed{B = M + K = \begin{pmatrix} 1 & 1/2 \\ -1/2 & -1 \end{pmatrix}.}$$
     Réciproquement, si $v' = Bv$, alors $u = Qv$ vérifie $u' = Q'v + QBv = \big(Q'Q^{T} + QBQ^{T}\big)u$, et $QBQ^{T} = QMQ^{T} + Q(Q^{T})'QQ^{T} = A + Q(Q^{T})'$, de sorte que $Q'Q^{T} + QBQ^{T} = A + \big(QQ^{T}\big)' = A$.

    $\triangleright$ *2 (d).* $B$ a pour trace $0$ et déterminant $-\dfrac{3}{4}$ : ses valeurs propres sont $\pm\dfrac{\sqrt{3}}{2}$. Les solutions $v = \alpha e^{\sqrt{3}t/2}w_{+} + \beta e^{-\sqrt{3}t/2}w_{-}$ sont bornées sur $\mathbb{R}_{+}$ si et seulement si $\alpha = 0$, sur $\mathbb{R}_{-}$ si et seulement si $\beta = 0$. Comme $\lVert u \rVert = \lVert v \rVert$ ($Q$ est orthogonale) : 
    $$\boxed{\text{non toutes bornées sur } \mathbb{R}_{+}, \text{ ni sur } \mathbb{R}_{-} \text{ ; seule la solution nulle est bornée sur } \mathbb{R}.}$$
     Le piège est de raisonner sur les valeurs propres de $A(t)$, qui valent $\pm 1$ pour tout $t$ : elles ne disent rien sur la croissance des solutions d'un système à coefficients variables. La partie 1 est l'exemple inverse : $A(t)$ y a des valeurs propres de partie réelle $\cos t$, positive la moitié du temps, et pourtant toutes les solutions sont bornées.

    ![Figure](documents/figures/9f161aa82a01b425.svg)

    Pour la solution issue de $(1, 0)$, le logarithme de la norme croît, à des oscillations près, avec la pente $\dfrac{\sqrt{3}}{2}$ en $+\infty$ et $-\dfrac{\sqrt{3}}{2}$ en $-\infty$ : elle explose exponentiellement dans les deux sens du temps.
- id: "l3-cd-06-33"
  feuille: "f-l3-cd-06"
  numero: 33
  partie: "Perspective : équations linéaires à coefficients périodiques"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [équations linéaires à coefficients périodiques]
  noeuds: [ed-lineaires]
  notions: [systeme-lineaire-edo, valeur-propre, multiplicite-racine]
  page_enonce: 9
  page_corrige: 24
  enonce: |
    *(Théorèmes de Floquet-Lyapunov.)* Soit $\mathbb{K} = \mathbb{R}$ ou $\mathbb{C}$, $A : \mathbb{R} \to \mathcal{M}_{n}(\mathbb{K})$ continue et $T$-périodique, et $R$ la résolvante de $u' = A(t)u$ (exercice 14). On veut démontrer :

    • *Théorème 1.* Si $\mathbb{K} = \mathbb{C}$, il existe $Q : \mathbb{R} \to \mathrm{GL}_{n}(\mathbb{C})$ $T$-périodique et $B \in \mathcal{M}_{n}(\mathbb{C})$ telles que $u$ est solution de $u' = A(t)u$ si et seulement si $v = Qu$ est solution de $v' = Bv$.

    • *Théorème 2.* Si $\mathbb{K} = \mathbb{R}$, il existe $Q : \mathbb{R} \to \mathrm{GL}_{n}(\mathbb{R})$ $2T$-périodique et $B \in \mathcal{M}_{n}(\mathbb{R})$ ayant la même propriété.

    **1.** **(a)** Montrer que $R(t + T, s + T) = R(t, s)$ pour tous $t$, $s$.

    **(b)** Montrer que $u' = A(t)u$ admet une solution $T$-périodique non nulle si et seulement si $1$ est valeur propre de $R(T, 0)$.

    **2.** On suppose $\mathbb{K} = \mathbb{C}$ et on admet que toute $C \in \mathrm{GL}_{n}(\mathbb{C})$ s'écrit $C = e^{B}$ avec $B \in \mathcal{M}_{n}(\mathbb{C})$.

    **(a)** Montrer qu'il existe $B \in \mathcal{M}_{n}(\mathbb{C})$ telle que $e^{TB} = R(T, 0)$.

    **(b)** Soit $Q(t) = e^{tB}R(0, t)$. Montrer que $Q$ est $T$-périodique, et en déduire le théorème 1.

    **3.** On suppose $\mathbb{K} = \mathbb{R}$ et on admet que, pour toute $C \in \mathrm{GL}_{n}(\mathbb{R})$, il existe $B \in \mathcal{M}_{n}(\mathbb{R})$ telle que $e^{B} = C^{2}$. Montrer qu'il existe $B \in \mathcal{M}_{n}(\mathbb{R})$ telle que $e^{2TB} = R(T, 0)^{2}$, et démontrer le théorème 2.

    **4.** On admet que, si $C = e^{B}$, les valeurs propres de $C$ sont les exponentielles de celles de $B$, avec les mêmes multiplicités. Donner des conditions nécessaires et suffisantes sur $R(T, 0)$ pour que les solutions de $u' = A(t)u$ soient bornées sur $\mathbb{R}_{+}$, sur $\mathbb{R}_{-}$, sur $\mathbb{R}$.
  corrige: |
    On utilise les propriétés de la résolvante établies à l'exercice 14.

    $\triangleright$ *1 (a).* $t \mapsto R(t + T, s + T)$ a pour dérivée $A(t + T)R(t + T, s + T) = A(t)R(t + T, s + T)$ et vaut $I_{n}$ en $t = s$ : par unicité, $\boxed{R(t + T, s + T) = R(t, s)}$.

    $\triangleright$ *1 (b).* Les solutions sont $u(t) = R(t, 0)u_{0}$. Si $u$ est $T$-périodique et non nulle, $R(T, 0)u_{0} = u(T) = u_{0}$ avec $u_{0} \neq 0$. Réciproquement, si $R(T, 0)u_{0} = u_{0} \neq 0$, la fonction $t \mapsto u(t + T)$ est solution (puisque $A$ est $T$-périodique) et vaut $u(T) = u_{0}$ en $0$ : elle est égale à $u$ par unicité. Ainsi 
    $$\boxed{\text{il existe une solution } T\text{-périodique non nulle} \iff 1 \in \operatorname{Sp}R(T, 0)}\text{.}$$

    $\triangleright$ *2 (a).* $R(T, 0)$ est inversible (exercice 14) : elle s'écrit $e^{C}$, et $B = \dfrac{C}{T}$ convient.

    $\triangleright$ *2 (b).* Par l'exercice 14 et 1 (a), $R(0, t + T) = R(0, T)R(T, t + T) = R(T, 0)^{-1}R(0, t)$. Donc 
    $$Q(t + T) = e^{tB}e^{TB}R(T, 0)^{-1}R(0, t) = e^{tB}R(0, t) = \boxed{Q(t)}.$$

    $\triangleright$ *2 (c).* $Q(t)$ est inversible. Si $u = R(t, 0)u_{0}$, alors $v = Qu = e^{tB}R(0, t)R(t, 0)u_{0} = e^{tB}u_{0}$ vérifie $v' = Bv$ ; réciproquement, si $v = e^{tB}v_{0}$, alors $u = Q^{-1}v = R(t, 0)e^{-tB}e^{tB}v_{0} = R(t, 0)v_{0}$ est solution. C'est le $\boxed{\text{théorème 1}}$ : par un changement de variables périodique, le système devient à coefficients constants.

    $\triangleright$ *3.* Avec $C = R(T, 0)$ et $e^{B_{0}} = C^{2}$, la matrice réelle $B = \dfrac{B_{0}}{2T}$ vérifie $e^{2TB} = R(T, 0)^{2}$. Posons $Q(t) = e^{tB}R(0, t)$, réelle. Comme $R(2T, 0) = R(2T, T)R(T, 0) = R(T, 0)^{2}$ par 1 (a), le calcul de 2 (b), mené avec $2T$, donne $Q(t + 2T) = e^{tB}e^{2TB}R(2T, 0)^{-1}R(0, t) = Q(t)$, et 2 (c) s'applique sans changement : c'est le $\boxed{\text{théorème 2}}$. La période double est le prix de la réalité : l'exercice 32 en donne un exemple, avec $Q$ de période $4\pi$ pour $A$ de période $2\pi$.

    $\triangleright$ *4.* On se place dans $\mathbb{C}$ (une solution réelle est en particulier complexe). Les solutions sont $u = Q^{-1}v$ avec $v = e^{tB}v_{0}$, et $Q$, $Q^{-1}$ sont continues et périodiques, donc bornées : $u$ est bornée sur $\mathbb{R}_{+}$ si et seulement si $v$ l'est. Toutes les $e^{tB}v_{0}$ sont bornées sur $\mathbb{R}_{+}$ si et seulement si les valeurs propres de $B$ sont de partie réelle $\leqslant 0$, celles de partie réelle nulle n'ayant que des blocs de Jordan de taille $1$ (sinon $te^{\mathrm{i}\omega t}$ apparaît). Les valeurs propres $\mu = e^{T\lambda}$ de $R(T, 0) = e^{TB}$ vérifient $|\mu| = e^{T\operatorname{Re}\lambda}$. De plus, sur chaque sous-espace caractéristique de $B$, où $B = \lambda I + N$ avec $N$ nilpotente, $e^{TB} = e^{T\lambda}I + e^{T\lambda}\big(e^{TN} - I\big)$, et $e^{TN} - I = TN\big(I + \frac{TN}{2} + \cdots\big)$ est nilpotente, nulle si et seulement si $N$ l'est : $e^{TB}$ y est diagonalisable si et seulement si $B$ l'est. On obtient trois critères :

    • sur $\mathbb{R}_{+}$ : valeurs propres de $R(T, 0)$ de module $\leqslant 1$, celles de module $1$ semi-simples ;

    • sur $\mathbb{R}_{-}$ : valeurs propres de module $\geqslant 1$, celles de module $1$ semi-simples ;

    • sur $\mathbb{R}$ : $R(T, 0)$ diagonalisable sur $\mathbb{C}$, à valeurs propres de module $1$.

    « Semi-simple » signifie que la multiplicité géométrique égale la multiplicité algébrique. On le vérifie sur l'exercice 32 : dans la partie 1, $R(2\pi, 0) = I_{2}$, et les solutions sont bornées ; dans la partie 2, $R(2\pi, 0) = Q(2\pi)e^{2\pi B} = -e^{2\pi B}$ a pour valeurs propres $-e^{\pm\sqrt{3}\pi}$, de modules différents de $1$, et les solutions ne sont bornées ni sur $\mathbb{R}_{+}$ ni sur $\mathbb{R}_{-}$.

