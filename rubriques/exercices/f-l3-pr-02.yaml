  source: "Durand, exercice 1.33"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Une lettre se trouve dans l'une de trois piles de courrier, chacune avec la probabilité $\frac{1}{3}$. Si elle est dans la pile $i$, un examen rapide de cette pile la manque avec la probabilité $a_{i} \in \, ]0, 1[$. On examine la première pile, sans trouver la lettre. Calculer la probabilité qu'elle soit dans chacune des trois piles. Que se passe-t-il quand $a_{1}$ tend vers $0$ ? vers $1$ ?
  corrige: |
    Soit $L_{i}$ l'évènement « la lettre est dans la pile $i$ », et $M$ « l'examen de la pile $1$ échoue ». Alors $\mathbb{P}(M \,|\, L_{1}) = a_{1}$ et $\mathbb{P}(M \,|\, L_{2}) = \mathbb{P}(M \,|\, L_{3}) = 1$, donc $\mathbb{P}(M) = \frac{a_{1} + 2}{3}$, et 
    $$\boxed{\mathbb{P}(L_{1} \,|\, M) = \frac{a_{1}}{a_{1} + 2}}, \qquad \boxed{\mathbb{P}(L_{2} \,|\, M) = \mathbb{P}(L_{3} \,|\, M) = \frac{1}{a_{1} + 2}}.$$
     Si $a_{1} \to 0$ (examen sûr), la lettre n'est plus dans la pile $1$, et les deux autres piles se partagent la probabilité. Si $a_{1} \to 1$ (examen inutile), on retrouve $\frac{1}{3}$ pour chaque pile : l'échec n'apprend rien.
- id: "l3-pr-02-08"
  feuille: "f-l3-pr-02"
  numero: 8
  partie: "Probabilités conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités conditionnelles, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [probabilite-conditionnelle, independance]
  source: "Durand, exercice 1.23"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Une source émet le symbole $0$ avec la probabilité $f = 0{,}6$, et $1$ sinon. Un canal de transmission transforme $0$ en $1$ avec la probabilité $a = 0{,}01$, et $1$ en $0$ avec la probabilité $b = 0{,}02$.

    **1.** Quel est le symbole émis le plus probable, sachant le symbole reçu ? En décidant ainsi, quel est le taux d'erreur ?

    **2.** Le symbole est transmis par deux canaux de mêmes caractéristiques, indépendants sachant le symbole émis. Pour chacune des quatre paires reçues, déterminer la décision qui minimise la probabilité d'erreur, puis le taux d'erreur total. Les deux réceptions sont-elles indépendantes ?
  corrige: |
    **1.** Notons $E$ le symbole émis et $R$ le symbole reçu. On a $\mathbb{P}(E = 0, R = 0) = 0{,}6 \times 0{,}99 = 0{,}594$, $\mathbb{P}(E = 1, R = 0) = 0{,}4 \times 0{,}02 = 0{,}008$, $\mathbb{P}(E = 0, R = 1) = 0{,}006$ et $\mathbb{P}(E = 1, R = 1) = 0{,}392$. Sachant $R = 0$, le symbole $0$ est le plus probable ; sachant $R = 1$, le symbole $1$. On décide donc le symbole reçu, et le taux d'erreur est $\boxed{0{,}008 + 0{,}006 = 0{,}014}$.

    **2.** Pour chaque paire reçue, on compare $\mathbb{P}(E = 0, R_{1}, R_{2})$ et $\mathbb{P}(E = 1, R_{1}, R_{2})$, et l'on décide le symbole de plus grande probabilité :

    $$\begin{array}{|c|c|c|c|c|} \hline \text{paire reçue} & \mathbb{P}(E = 0, \cdot) & \mathbb{P}(E = 1, \cdot) & \text{décision} & \text{probabilité d'erreur sachant la paire} \\ \hline (0, 0) & 0{,}58806 & 0{,}00016 & 0 & 0{,}00027 \\ \hline (0, 1)\text{ ou }(1, 0) & 0{,}00594 & 0{,}00784 & 1 & 0{,}431 \\ \hline (1, 1) & 0{,}00006 & 0{,}38416 & 1 & 0{,}00016 \\ \hline \end{array}$$

    Le taux d'erreur total est $0{,}00016 + 2 \times 0{,}00594 + 0{,}00006 = \boxed{0{,}0121}$, à peine meilleur qu'avec un seul canal. En cas de désaccord, on décide $1$, symbole le moins souvent corrompu. Enfin, $\mathbb{P}(R_{1} = 0) = 0{,}602$ et $\mathbb{P}(R_{1} = 0, R_{2} = 0) = 0{,}58822 \neq 0{,}602^{2}$ : les réceptions ne sont pas indépendantes, puisqu'elles dépendent toutes deux du symbole émis.
