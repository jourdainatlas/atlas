- id: "l3-pr-02-01"
  feuille: "f-l3-pr-02"
  numero: 1
  partie: "Probabilités conditionnelles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [probabilités conditionnelles]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Durand (Orsay), exercices 1.18 et 1.31"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $A$, $B$ deux évènements de probabilités non nulles, et $(C_{i})_{i \in \mathbb{N}}$ une partition de $\Omega$ en évènements de probabilités non nulles.

    **1.** Exprimer $\mathbb{P}(B \,|\, A)$ en fonction de $\mathbb{P}(A)$, $\mathbb{P}(B)$ et $\mathbb{P}(A \,|\, B)$, puis à l'aide de $\mathbb{P}(B)$, $\mathbb{P}(A \,|\, B)$ et des $\mathbb{P}(A \,|\, C_{i})$ et $\mathbb{P}(C_{i})$.

    **2.** On suppose $0 < \mathbb{P}(B) < 1$. Montrer que les trois inégalités $\mathbb{P}(A \,|\, B) \leqslant \mathbb{P}(A)$, $\mathbb{P}(B \,|\, A) \leqslant \mathbb{P}(B)$ et $\mathbb{P}(A \,|\, \overline{B}) \geqslant \mathbb{P}(A)$ sont équivalentes. Interpréter, ainsi que les inégalités contraires.

    **3.** On dit que $A$ et $B$ sont *positivement associés* si $\mathbb{P}(A \,|\, B) > \mathbb{P}(A)$. Donner deux exemples d'évènements associés, et expliquer pourquoi une association ne suffit pas à établir que l'un est la cause de l'autre.
  corrige: |
    **1.** Par définition, $\mathbb{P}(A \cap B) = \mathbb{P}(A \,|\, B)\mathbb{P}(B) = \mathbb{P}(B \,|\, A)\mathbb{P}(A)$, d'où 
    $$\mathbb{P}(B \,|\, A) = \frac{\mathbb{P}(A \,|\, B)\,\mathbb{P}(B)}{\mathbb{P}(A)} = \boxed{\frac{\mathbb{P}(A \,|\, B)\,\mathbb{P}(B)}{\sum_{i \in \mathbb{N}}\mathbb{P}(A \,|\, C_{i})\,\mathbb{P}(C_{i})}},$$
     le dénominateur étant donné par la formule des probabilités totales (cours, th. 1).

    **2.** En divisant $\mathbb{P}(A \cap B) \leqslant \mathbb{P}(A)\mathbb{P}(B)$ par $\mathbb{P}(B)$, puis par $\mathbb{P}(A)$, on voit que les deux premières inégalités équivalent à $\mathbb{P}(A \cap B) \leqslant \mathbb{P}(A)\mathbb{P}(B)$. Pour la troisième, $\mathbb{P}(A \cap \overline{B}) = \mathbb{P}(A) - \mathbb{P}(A \cap B)$, donc 
    $$\mathbb{P}(A \,|\, \overline{B}) \geqslant \mathbb{P}(A) \iff \mathbb{P}(A) - \mathbb{P}(A \cap B) \geqslant \mathbb{P}(A)(1 - \mathbb{P}(B)) \iff \mathbb{P}(A \cap B) \leqslant \mathbb{P}(A)\mathbb{P}(B).$$
     Savoir que $B$ s'est produit rend $A$ moins probable si et seulement si savoir que $A$ s'est produit rend $B$ moins probable, et si et seulement si savoir que $B$ ne s'est pas produit rend $A$ plus probable. Les inégalités contraires sont équivalentes entre elles de la même façon, et les égalités traduisent l'indépendance.

    **3.** Par la question 2, l'association est symétrique. Exemples : « il pleut » et « on voit des parapluies » ; « avoir un briquet dans sa poche » et « développer un cancer du poumon ». Dans le second exemple, aucun des deux évènements n'est la cause de l'autre : ils ont une cause commune, le tabac. Une association est une propriété de la probabilité, qui ne dit rien du mécanisme qui la produit.
- id: "l3-pr-02-02"
  feuille: "f-l3-pr-02"
  numero: 2
  partie: "Probabilités conditionnelles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités conditionnelles, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [probabilite-conditionnelle, independance]
  source: "Durand, exercice 1.6"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On suppose les sexes des enfants indépendants et équiprobables. Chaque information ci-dessous désigne exactement l'évènement par lequel on conditionne.

    **1.** Une famille a deux enfants. Sachant qu'au moins l'un est un garçon, quelle est la probabilité que les deux soient des garçons ? Sachant qu'au moins l'un est une fille, quelle est la probabilité que la famille ait aussi un garçon ?

    **2.** Quelle est la probabilité que l'aîné soit un garçon, sachant que le cadet est une fille ?

    **3.** Le nombre $N$ d'enfants d'une famille vérifie $\mathbb{P}(N = i) = p_{i}$ pour $i \in \mathbb{N}$, et, sachant $N$, les sexes restent indépendants et équiprobables. Calculer la probabilité qu'une famille ait un seul enfant, sachant qu'elle n'a aucune fille. Quel est le rôle de $p_{0}$ ?
  corrige: |
    **1.** On prend $\Omega = \{G, F\}^{2}$ (aîné, cadet), uniforme. « Au moins un garçon » contient $3$ issues, dont une seule $GG$ : $\boxed{\frac{1}{3}}$. « Au moins une fille » contient $FF$, $FG$, $GF$, et deux ont un garçon : $\boxed{\frac{2}{3}}$. L'erreur la plus répandue est de répondre $\frac{1}{2}$, en pensant à « l'autre enfant », qui n'est pas déterminé par l'information.

    **2.** L'information « le cadet est une fille » porte sur le cadet seul ; par indépendance, 
    $$\boxed{\mathbb{P}(\text{aîné garçon} \,|\, \text{cadet fille}) = \frac{1}{2}}.$$
     La différence avec la question 1 tient à ce que l'on désigne un enfant précis.

    **3.** Sachant $N = i$, la famille n'a aucune fille avec la probabilité $2^{-i}$ ; par la formule des probabilités totales, $\mathbb{P}(\text{aucune fille}) = \sum_{i \geqslant 0}p_{i}2^{-i}$, et 
    $$\mathbb{P}(N = 1 \,|\, \text{aucune fille}) = \boxed{\frac{p_{1}/2}{\sum_{i \geqslant 0}p_{i}\,2^{-i}}}.$$
     Les familles sans enfant n'ont aucune fille : $p_{0}$ figure au dénominateur, et une forte proportion de familles sans enfant diminue cette probabilité.
- id: "l3-pr-02-03"
  feuille: "f-l3-pr-02"
  numero: 3
  partie: "Probabilités conditionnelles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités conditionnelles]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Bordeaux, L3 Probabilités 2015-2016, TD 1, exercice 9 ; Durand, exercice 1.32"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Un individu est choisi au hasard dans une population qui comporte une proportion $p \in \, ]0, 1[$ de tricheurs, et tire une carte dans un jeu de $32$ cartes. Un tricheur tire un as avec la probabilité $\frac{1}{2}$ ; un joueur honnête tire au hasard. Quelle est la probabilité qu'un as soit tiré ? Sachant qu'un as est tiré, quelle est la probabilité que le joueur soit un tricheur ? Étudier cette probabilité en fonction de $p$.

    **2.** L'usine $A$ produit deux fois plus d'ampoules que l'usine $B$ ; $20\,\%$ des ampoules de $A$ et $5\,\%$ de celles de $B$ sont défectueuses. On tire une ampoule au hasard dans la production totale. Décrire le modèle, calculer la probabilité que l'ampoule soit en bon état, puis, sachant qu'elle est défectueuse, la probabilité qu'elle provienne de $A$.
  corrige: |
    **1.** Soit $T$ l'évènement « le joueur triche » et $A$ « il tire un as ». Par la formule des probabilités totales, 
    $$\mathbb{P}(A) = \frac{1}{2}p + \frac{1}{8}(1 - p) = \boxed{\frac{3p + 1}{8}}, \qquad \mathbb{P}(T \,|\, A) = \frac{p/2}{(3p + 1)/8} = \boxed{\frac{4p}{3p + 1}}.$$
     La fonction $p \mapsto \frac{4p}{3p + 1}$ croît de $0$ à $1$ sur $[0, 1]$, et elle est supérieure à $p$ : tirer un as rend la tricherie plus probable. Pour $p = 0{,}1$, elle vaut $0{,}31$ : même alors, un as ne suffit pas à accuser le joueur.

    **2.** On note $A$ et $B$ les évènements « l'ampoule vient de $A$, de $B$ », de probabilités $\frac{2}{3}$ et $\frac{1}{3}$, et $D$ « l'ampoule est défectueuse ». Alors $\mathbb{P}(D) = \frac{2}{3} \cdot \frac{1}{5} + \frac{1}{3} \cdot \frac{1}{20} = \frac{3}{20}$, donc $\boxed{\mathbb{P}(\overline{D}) = \frac{17}{20}}$, et 
    $$\mathbb{P}(A \,|\, D) = \frac{2/15}{3/20} = \boxed{\frac{8}{9}}.$$
- id: "l3-pr-02-04"
  feuille: "f-l3-pr-02"
  numero: 4
  partie: "Probabilités conditionnelles"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [probabilités conditionnelles]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Durand, exercice 1.2"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Pour préserver l'anonymat des personnes interrogées par un sondage sur la consommation de drogues, on demande à chacune de lancer une pièce, sans montrer le résultat, puis de répondre « oui » si la pièce tombe sur face, et de répondre sincèrement à la question « avez-vous déjà consommé de la drogue ? » si elle tombe sur pile.

    **1.** Décrire un espace probabilisé associé à l'interrogation d'une personne tirée au hasard.

    **2.** Exprimer la probabilité de la réponse « oui » en fonction de la proportion $p$ de consommateurs dans la population. Comment estimer $p$ à partir des réponses ?

    **3.** Une personne a répondu « oui ». Quelle est la probabilité qu'elle ait consommé de la drogue ? En quoi l'anonymat est-il protégé ?
  corrige: |
    **1.** On prend $\Omega = \{\text{consommateur}, \text{non}\} \times \{\text{pile}, \text{face}\}$, avec la probabilité produit : $p$ pour être consommateur, $\frac{1}{2}$ pour chaque face de la pièce, les deux étant indépendants.

    **2.** La réponse est « oui » si la pièce donne face, ou si elle donne pile et que la personne a consommé : $\boxed{\mathbb{P}(\text{oui}) = \frac{1}{2} + \frac{p}{2}}$. Si $f$ est la proportion de « oui » observée, on estime $p$ par $2f - 1$ ; le chapitre 9 justifiera cette estimation par la loi des grands nombres.

    **3.** Un consommateur répond toujours « oui » : $\mathbb{P}(\text{consommateur} \,|\, \text{oui}) = \frac{p}{(1 + p)/2} = \boxed{\frac{2p}{1 + p}}$. Cette probabilité est plus grande que $p$, mais elle est loin de $1$ (pour $p = 0{,}1$, elle vaut $0{,}18$) : une réponse « oui » ne trahit pas la personne. L'anonymat se paie par une estimation moins précise de $p$.
- id: "l3-pr-02-05"
  feuille: "f-l3-pr-02"
  numero: 5
  partie: "Probabilités conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités conditionnelles, indépendance]
  noeuds: [p-espace, p-independance]
  notions: [probabilite-conditionnelle, independance]
  source: "Bordeaux, DM 1, exercice 3 ; Durand, exercice 1.8"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Un vin chilien et un Pessac-Léognan sont servis « à l'aveugle » à cinq goûteurs. L'un des deux vins est choisi avec la probabilité $\frac{1}{2}$, et ce même vin est servi aux cinq goûteurs. Sachant le vin servi, les goûteurs se prononcent indépendamment, et chacun reconnaît le vin avec la probabilité $\frac{3}{4}$. Sachant que quatre goûteurs sur cinq ont dit que le vin était un Pessac-Léognan, quelle est la probabilité que ce soit le vin chilien qui ait été servi ?

    **2.** Un juge interroge séparément deux témoins pour savoir si un évènement a eu lieu ; il a lieu avec la probabilité $a \in \, ]0, 1[$. Chaque témoin affirme à tort qu'il a eu lieu avec la probabilité $p$, et affirme à tort qu'il n'a pas eu lieu avec la probabilité $q$ ($p, q \in \, ]0, 1[$) ; sachant la réalité, les deux réponses sont indépendantes.

    **(a)** Décrire un espace probabilisé associé à cette expérience.

    **(b)** Calculer la probabilité que le premier témoin se trompe. Les évènements « le premier se trompe » et « le second se trompe » sont-ils indépendants ?

    **(c)** Quelle est la probabilité que l'évènement ait eu lieu, si les deux témoins l'affirment ? si au moins l'un d'eux l'affirme ?
  corrige: |
    **1.** Soit $C$ l'évènement « le vin chilien est servi », et $Q$ « quatre goûteurs sur cinq disent Pessac-Léognan ». Sachant $C$, les réponses sont des épreuves indépendantes, et un goûteur dit Pessac-Léognan avec la probabilité $\frac{1}{4}$ : $\mathbb{P}(Q \,|\, C) = 5\big(\frac{1}{4}\big)^{4}\frac{3}{4}$. De même, $\mathbb{P}(Q \,|\, \overline{C}) = 5\big(\frac{3}{4}\big)^{4}\frac{1}{4}$. Par la formule de Bayes, 
    $$\mathbb{P}(C \,|\, Q) = \frac{5 \cdot 3/4^{5}}{5 \cdot 3/4^{5} + 5 \cdot 81/4^{5}} = \frac{3}{84} = \boxed{\frac{1}{28}}.$$

    **2. (a)** On prend $\Omega = \{0, 1\}^{3}$, la première coordonnée valant $1$ si l'évènement a eu lieu, les deux autres si le témoin correspondant l'affirme. On donne à $(e, t_{1}, t_{2})$ la probabilité $\mathbb{P}(e)\mathbb{P}(t_{1} \,|\, e)\mathbb{P}(t_{2} \,|\, e)$, avec $\mathbb{P}(e = 1) = a$, $\mathbb{P}(t = 1 \,|\, e = 1) = 1 - q$ et $\mathbb{P}(t = 1 \,|\, e = 0) = p$ : c'est l'indépendance des témoins sachant la réalité.

    **(b)** Le premier témoin se trompe avec la probabilité $\mathbb{P}(E_{1}) = aq + (1 - a)p$. Les deux se trompent avec la probabilité $aq^{2} + (1 - a)p^{2}$, et 
    $$aq^{2} + (1 - a)p^{2} - (aq + (1 - a)p)^{2} = a(1 - a)(q - p)^{2}.$$
     Les erreurs sont indépendantes si et seulement si $p = q$. Sinon, elles sont positivement associées : elles dépendent toutes deux de la réalité. L'indépendance sachant la réalité n'entraîne pas l'indépendance.

    **(c)** Par la formule de Bayes, 
    $$\mathbb{P}(e = 1 \,|\, \text{les deux l'affirment}) = \boxed{\frac{a(1 - q)^{2}}{a(1 - q)^{2} + (1 - a)p^{2}}},$$

    $$\mathbb{P}(e = 1 \,|\, \text{au moins un l'affirme}) = \boxed{\frac{a(1 - q^{2})}{a(1 - q^{2}) + (1 - a)(1 - (1 - p)^{2})}}.$$
- id: "l3-pr-02-06"
  feuille: "f-l3-pr-02"
  numero: 6
  partie: "Probabilités conditionnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités conditionnelles]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Bordeaux, DS du 16/03/2016, exercice 3"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On dispose de trois pièces : la première est équilibrée, la deuxième tombe sur pile avec la probabilité $p_{2} = \frac{3}{4}$, et la troisième avec la probabilité $p_{3} = \frac{1}{4}$.

    **1.** On choisit une pièce au hasard et on la lance une fois. Quelle est la probabilité d'obtenir pile ?

    **2.** On choisit une pièce au hasard et on la lance trois fois de suite ; on observe la séquence pile, face, pile. Quelle est la probabilité d'avoir choisi la pièce $2$ ?

    **3.** On lance une quatrième fois la même pièce. Quelle est la probabilité d'obtenir pile ? Commenter, par rapport à la question 1.
  corrige: |
    **1.** Par la formule des probabilités totales, $\mathbb{P}(\text{pile}) = \frac{1}{3}\big(\frac{1}{2} + \frac{3}{4} + \frac{1}{4}\big) = \boxed{\frac{1}{2}}$.

    **2.** Sachant la pièce $i$, les lancers sont indépendants. La séquence pile, face, pile a la probabilité $\frac{1}{8} = \frac{8}{64}$ avec la pièce $1$, $\big(\frac{3}{4}\big)^{2}\frac{1}{4} = \frac{9}{64}$ avec la pièce $2$, et $\big(\frac{1}{4}\big)^{2}\frac{3}{4} = \frac{3}{64}$ avec la pièce $3$. Par la formule de Bayes, les probabilités des trois pièces sachant la séquence sont proportionnelles à $8$, $9$, $3$ : 
    $$\boxed{\mathbb{P}(\text{pièce } 2 \,|\, PFP) = \frac{9}{20}}, \qquad \mathbb{P}(\text{pièce } 1 \,|\, PFP) = \frac{8}{20}, \qquad \mathbb{P}(\text{pièce } 3 \,|\, PFP) = \frac{3}{20}.$$

    **3.** Sachant la pièce, le quatrième lancer est indépendant des trois premiers ; par la formule des probabilités totales pour $\mathbb{P}(\cdot \,|\, PFP)$, 
    $$\mathbb{P}(\text{pile au 4}{^{\text{e}}}\text{ lancer} \,|\, PFP) = \frac{8}{20} \cdot \frac{1}{2} + \frac{9}{20} \cdot \frac{3}{4} + \frac{3}{20} \cdot \frac{1}{4} = \boxed{\frac{23}{40}}.$$
     C'est plus que $\frac{1}{2}$ : les lancers ne sont pas indépendants, car les deux piles observés rendent plus probable la pièce favorable à pile. Ils ne le sont que sachant la pièce.

    1.5em

    ![Figure](documents/figures/0f54bf5090e1633d.svg)

    L'arbre de l'expérience : on choisit une pièce, puis on observe la séquence, dont la probabilité dépend de la pièce. En rouge, les probabilités des pièces sachant $PFP$, proportionnelles aux probabilités des branches : c'est la formule de Bayes lue sur l'arbre.
- id: "l3-pr-02-07"
