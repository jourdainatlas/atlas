  notions: [independance]
  source: "Durand, exercices 1.29 et 1.35"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    On reprend les mains de cinq cartes de l'exercice 13 de la feuille 1.

    **1.** Les évènements « former une suite » et « être de même couleur » sont-ils indépendants ?

    **2.** Calculer la probabilité d'avoir exactement trois rois, sachant que l'on en a au moins deux.
  corrige: |
    **1.** Avec les dénombrements de la feuille 1, 
    $$\mathbb{P}(\text{suite}) = \frac{10\,240}{2\,598\,960}, \qquad \mathbb{P}(\text{couleur}) = \frac{5\,148}{2\,598\,960}, \qquad \mathbb{P}(\text{suite} \cap \text{couleur}) = \frac{40}{2\,598\,960}.$$
     Or $\mathbb{P}(\text{suite})\mathbb{P}(\text{couleur}) \approx 7{,}8 \times 10^{-6}$, alors que $\mathbb{P}(\text{suite} \cap \text{couleur}) \approx 1{,}54 \times 10^{-5}$, environ deux fois plus : 
    $$\boxed{\text{les évènements ne sont pas indépendants}}.$$
     Savoir que la main est d'une seule couleur, donc formée de cinq valeurs distinctes, rend la suite deux fois plus probable.

    **2.** Il y a $\binom{4}{3}\binom{48}{2} = 4\,512$ mains à exactement trois rois, et au moins deux rois dans $\binom{4}{2}\binom{48}{3} + 4\,512 + 48 = 108\,336$ mains. D'où 
    $$\mathbb{P}(\text{trois rois} \,|\, \text{au moins deux}) = \frac{4\,512}{108\,336} = \boxed{\frac{94}{2\,257} \approx 0{,}042}.$$
- id: "l3-pr-02-21"
  feuille: "f-l3-pr-02"
  numero: 21
  partie: "Indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercices 1.26 et 1.30"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Quelles précautions faut-il prendre pour qu'une loi uniforme modélise le tirage d'une carte dans un jeu de $52$ cartes ? d'un élève dans une classe ? d'un habitant dans une ville ? Comment peut-on examiner l'hypothèse « au hasard » ?

    **2.** Soit $q \in [0, 1]$. Rappeler pourquoi $p(\omega) = q^{\sum\omega_{i}}(1 - q)^{n - \sum\omega_{i}}$ définit une probabilité sur $\{0, 1\}^{n}$, et ce qu'elle modélise.

    **3.** On dispose d'une pièce équilibrée et l'on veut tirer un entier uniformément dans $\llbracket 1, m \rrbracket$. Le faire lorsque $m$ est une puissance de $2$. Dans le cas général, on lance la pièce par séries de $k$ lancers, avec $2^{k - 1} < m \leqslant 2^{k}$, et l'on recommence tant que l'entier obtenu dépasse $m$. Montrer que l'on s'arrête presque sûrement, que le résultat est uniforme sur $\llbracket 1, m \rrbracket$, et calculer la loi du nombre de séries nécessaires.
  corrige: |
    **1.** Pour les cartes, il faut un jeu complet, bien battu, et un tirage qui ne privilégie aucune position (pas toujours la carte du dessus d'un jeu mal battu). Pour un élève ou un habitant, il faut une liste complète, sans doublon, et une procédure qui ne dépende pas des caractéristiques étudiées (tirer au sort dans la liste, et non interroger les premiers passants). « Au hasard » signifie « selon la loi uniforme » ; on peut examiner cette hypothèse en répétant le tirage et en comparant les fréquences observées à la loi uniforme (loi des grands nombres, chapitre 9). On ramène tous ces tirages à celui d'un entier de $\llbracket 1, m \rrbracket$, en numérotant les objets.

    **2.** Les $p(\omega)$ sont positifs, et $\sum_{\omega}p(\omega) = \sum_{k = 0}^{n}\binom{n}{k}q^{k}(1 - q)^{n - k} = (q + 1 - q)^{n} = 1$ : c'est une probabilité (cours, th. 1). Elle modélise $n$ épreuves indépendantes de même probabilité de succès $q$ (cours, prop. 7).

    **3.** Si $m = 2^{k}$, on lance $k$ fois la pièce et l'on lit les résultats comme les chiffres binaires de l'entier $1 + \sum_{j = 1}^{k}\varepsilon_{j}2^{j - 1}$ ; les $2^{k}$ résultats sont équiprobables, et l'entier est uniforme sur $\llbracket 1, 2^{k} \rrbracket$.

    Dans le cas général, chaque série donne un entier uniforme sur $\llbracket 1, 2^{k} \rrbracket$, indépendant des séries précédentes. Une série est acceptée avec la probabilité $\rho = \frac{m}{2^{k}} > \frac{1}{2}$. Le nombre $N$ de séries vérifie $\mathbb{P}(N = j) = (1 - \rho)^{j - 1}\rho$ (loi géométrique, cours, prop. 7), et $\mathbb{P}(N > j) = (1 - \rho)^{j} \to 0$ : on s'arrête presque sûrement. Pour $x \in \llbracket 1, m \rrbracket$, la sortie vaut $x$ si l'arrêt a lieu à la série $j$ avec le résultat $x$ : 
    $$\mathbb{P}(\text{sortie} = x) = \sum_{j \geqslant 1}(1 - \rho)^{j - 1}\frac{1}{2^{k}} = \frac{1}{2^{k}\rho} = \boxed{\frac{1}{m}}.$$
     La sortie est uniforme. C'est la méthode de rejet, que l'on retrouvera pour simuler des lois à densité ; le nombre moyen de séries, $\frac{1}{\rho} < 2$, sera calculé au chapitre 3.

