  enonce: |
    Tous les soirs, une personne va dîner au restaurant, dans le quartier Est ou dans le quartier Ouest de la ville. Elle se rend à l'arrêt de bus à un instant aléatoire, et prend le premier bus qui passe. Deux lignes desservent l'arrêt, l'une vers l'Est, l'autre vers l'Ouest ; les bus de chaque ligne passent toutes les quinze minutes, selon un horaire fixe. Au bout d'une année, la personne constate qu'elle n'est allée dîner à l'Est que deux fois par mois en moyenne. Comment l'expliquer ? Proposer un modèle et en déduire l'horaire des bus.
  corrige: |
    Modélisons l'heure d'arrivée, modulo $15$ minutes, par une variable uniforme $U$ sur $[0, 15[$. Les bus de l'Ouest passent aux instants $0$, $15$, …, et ceux de l'Est aux instants $d$, $15 + d$, …, avec $0 < d < 15$. La personne va à l'Est si elle arrive dans $]0, d]$ : $\mathbb{P}(\text{Est}) = \frac{d}{15}$. Deux soirs par mois sur trente correspondent à $\frac{d}{15} = \frac{1}{15}$, donc $\boxed{d = 1}$ minute : le bus de l'Est passe une minute après celui de l'Ouest.

    1.5em

    ![Figure](documents/figures/71263be750d16dcf.svg)

    Les deux lignes ont la même fréquence, mais le bus de l'Est suit de près celui de l'Ouest : seules les arrivées dans la minute qui précède un bus de l'Est, en orange, mènent à l'Est. Le paradoxe vient de ce que l'on confond fréquence des bus et probabilité de prendre l'un d'eux.
- id: "l3-pr-02-10"
  feuille: "f-l3-pr-02"
  numero: 10
  partie: "Probabilités composées, récurrences"
  etoiles: 1
  types: [Calcul]
  mots_cles: [probabilités composées]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Bordeaux, TD 1, exercice 8"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Un sauteur tente de franchir successivement les hauteurs $1$, $2$, …, $n$, …, dans cet ordre. Ayant franchi les hauteurs précédentes, il réussit la hauteur $n$ avec la probabilité $\frac{1}{n}$, et il s'arrête au premier échec. Calculer la probabilité $p_{n}$ que son dernier saut réussi soit à la hauteur $n$, et vérifier que $\sum_{n \geqslant 1}p_{n} = 1$.
  corrige: |
    Soit $S_{k}$ l'évènement « le sauteur franchit la hauteur $k$ ». Le dernier saut réussi est à la hauteur $n$ si $S_{1}$, …, $S_{n}$ se produisent et $S_{n + 1}$ non. Par la formule des probabilités composées (cours, prop. 2), 
    $$p_{n} = \mathbb{P}(S_{1})\mathbb{P}(S_{2} \,|\, S_{1})\cdots\mathbb{P}(S_{n} \,|\, S_{1} \cap \cdots \cap S_{n - 1})\Big(1 - \frac{1}{n + 1}\Big) = \frac{1}{n!} \cdot \frac{n}{n + 1} = \boxed{\frac{n}{(n + 1)!}}.$$
     Comme $\frac{n}{(n + 1)!} = \frac{1}{n!} - \frac{1}{(n + 1)!}$, la somme est télescopique : $\sum_{n \geqslant 1}p_{n} = 1$. Le sauteur s'arrête presque sûrement : $\mathbb{P}(S_{1} \cap \cdots \cap S_{n}) = \frac{1}{n!} \to 0$.
- id: "l3-pr-02-11"
  feuille: "f-l3-pr-02"
  numero: 11
  partie: "Probabilités composées, récurrences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités composées]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Bordeaux, TD 1, exercice 10 ; Durand, exercice 1.38 (partie « sans remise »)"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    On dispose de $n \geqslant 2$ urnes numérotées de $1$ à $n$ ; l'urne $k$ contient $k$ boules rouges et $n - k$ boules blanches. On choisit une urne au hasard, puis on y tire deux boules.

    **1.** Quelle est la probabilité d'obtenir deux boules rouges si les tirages se font avec remise ?

    **2.** Même question si les tirages se font sans remise.

    **3.** Déterminer les limites de ces probabilités quand $n \to +\infty$, et les interpréter à l'aide d'une intégrale.
  corrige: |
    **1.** Sachant l'urne $k$, la probabilité de deux rouges avec remise est $\big(\frac{k}{n}\big)^{2}$, et par la formule des probabilités totales, 
    $$\mathbb{P}(RR) = \frac{1}{n}\sum_{k = 1}^{n}\frac{k^{2}}{n^{2}} = \boxed{\frac{(n + 1)(2n + 1)}{6n^{2}}}.$$

    **2.** Sans remise, sachant l'urne $k$, la probabilité est $\frac{k}{n} \cdot \frac{k - 1}{n - 1}$, et $\sum_{k}k(k - 1) = \frac{(n + 1)n(n - 1)}{3}$, d'où 
    $$\mathbb{P}(RR) = \frac{1}{n}\sum_{k = 1}^{n}\frac{k(k - 1)}{n(n - 1)} = \boxed{\frac{n + 1}{3n}}.$$

    **3.** Les deux probabilités tendent vers $\boxed{\frac{1}{3}}$. La première est une somme de Riemann de $\int_{0}^{1}x^{2}\,\mathrm{d} x = \frac{1}{3}$ : la proportion de rouges de l'urne choisie devient uniforme sur $[0, 1]$, et sachant cette proportion $x$, les deux tirages sont des rouges avec la probabilité $x^{2}$. Sans remise, la différence disparaît quand les urnes sont grandes.

    1.5em

    ![Figure](documents/figures/f09bd6e89478a158.svg)

    Pour $n = 10$, $\mathbb{P}(RR)$ est l'aire des rectangles de largeur $\frac{1}{n}$ et de hauteur $\big(\frac{k}{n}\big)^{2}$, soit $0{,}385$ ; quand $n$ grandit, elle tend vers l'aire $\frac{1}{3}$ sous la parabole.
- id: "l3-pr-02-12"
  feuille: "f-l3-pr-02"
  numero: 12
  partie: "Probabilités composées, récurrences"
  etoiles: 2
  types: [Calcul]
  mots_cles: [probabilités composées, probabilités totales]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Durand, exercice 1.20"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Une urne contient initialement $b \geqslant 1$ boules blanches et $r \geqslant 1$ boules rouges ; on pose $a = b + r$. On tire une boule : si elle est rouge, on la remet ; si elle est blanche, on la remplace par une boule rouge. On note $R_{n}$ l'évènement « la $n$-ième boule tirée est rouge », et $S_{n}$ le nombre de boules rouges obtenues lors des $n$ premiers tirages.

    **1.** Calculer $\mathbb{P}(R_{1})$ et $\mathbb{P}(R_{2})$.

    **2.** Calculer la probabilité de $R_{n + 1}$ sachant que $k$ boules blanches ont été tirées lors des $n$ premiers tirages.

    **3.** En déduire, à l'aide de la formule des probabilités totales, que $\mathbb{P}(R_{n + 1}) = \frac{r + W_{n}}{a}$, où $W_{n} = \sum_{k}k\,\mathbb{P}({k}\text{ blanches tirées en }{n}\text{ tirages})$ est le « nombre moyen » de blanches tirées.

    **4.** Établir une relation de récurrence entre $W_{n + 1}$ et $W_{n}$, puis calculer $W_{n}$ et $\mathbb{P}(R_{n})$. Limite ?

    **5.** Déterminer la loi du rang $X$ de la première boule rouge tirée.
  corrige: |
    **1.** $\mathbb{P}(R_{1}) = \boxed{\frac{r}{a}}$. Si la première boule est blanche, l'urne contient ensuite $r + 1$ rouges sur $a$ ; par la formule des probabilités totales, 
    $$\mathbb{P}(R_{2}) = \frac{r}{a} \cdot \frac{r}{a} + \frac{b}{a} \cdot \frac{r + 1}{a} = \boxed{\frac{ra + b}{a^{2}}}.$$

    **2.** Le nombre total de boules reste égal à $a$, et chaque blanche tirée a été remplacée par une rouge : après $k$ blanches tirées, il y a $r + k$ rouges. Donc la probabilité cherchée est $\boxed{\frac{r + k}{a}}$, pourvu que l'évènement conditionnant ait une probabilité non nulle.

    **3.** Soit $B_{k}$ l'évènement « $k$ blanches ont été tirées lors des $n$ premiers tirages » ; les $B_{k}$, $0 \leqslant k \leqslant \min(n, b)$, forment un système complet, et 
    $$\mathbb{P}(R_{n + 1}) = \sum_{k}\frac{r + k}{a}\mathbb{P}(B_{k}) = \frac{r + W_{n}}{a}.$$

    **4.** Le nombre moyen de blanches augmente de la probabilité de tirer une blanche au tirage $n + 1$ : en conditionnant par les $B_{k}$, $W_{n + 1} = W_{n} + 1 - \mathbb{P}(R_{n + 1}) = W_{n} + \frac{b - W_{n}}{a}$. Donc $b - W_{n + 1} = \big(1 - \frac{1}{a}\big)(b - W_{n})$ et, comme $W_{0} = 0$, 
    $$W_{n} = b\Big(1 - \Big(1 - \frac{1}{a}\Big)^{n}\Big), \qquad \boxed{\mathbb{P}(R_{n + 1}) = 1 - \frac{b}{a}\Big(1 - \frac{1}{a}\Big)^{n}} \xrightarrow[n \to +\infty]{} 1.$$
     Pour $n = 0$ et $n = 1$, on retrouve la question 1 ; pour $b = 3$, $r = 2$, les valeurs $\frac{2}{5}$, $\frac{13}{25}$, $\frac{77}{125}$, … ont été vérifiées par un calcul exact de la loi de $S_{n}$. Les blanches finissent toutes par disparaître.

    **5.** La première rouge est au rang $k$ si les $k - 1$ premières boules sont blanches, puis la suivante rouge ; par les probabilités composées, 
    $$\boxed{\mathbb{P}(X = k) = \frac{b(b - 1)\cdots(b - k + 2)}{a^{k - 1}} \cdot \frac{r + k - 1}{a}}, \qquad 1 \leqslant k \leqslant b + 1.$$
- id: "l3-pr-02-13"
  feuille: "f-l3-pr-02"
  numero: 13
  partie: "Probabilités composées, récurrences"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [probabilités composées]
  noeuds: [p-espace]
  notions: [probabilite-conditionnelle]
  source: "Bordeaux, TD 1, exercice 11 ; Durand, exercice 1.10"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** *(Menteurs.)* Une information, « oui » ou « non », est transmise par $n$ personnes $I_{1}$, …, $I_{n}$ : $I_{1}$ la reçoit, la transmet à $I_{2}$, et ainsi de suite jusqu'à $I_{n}$. Chacun transmet ce qu'il a entendu avec la probabilité $p \in \, ]0, 1[$, et le contraire avec la probabilité $1 - p$, indépendamment des autres. On note $B_{i}$ l'évènement « $I_{i}$ transmet l'information initiale », et $p_{n} = \mathbb{P}(B_{n})$.

    **(a)** Que valent $\mathbb{P}(B_{i + 1} \,|\, B_{i})$ et $\mathbb{P}(B_{i + 1} \,|\, \overline{B_{i}})$ ? En déduire $p_{n + 1}$ en fonction de $p_{n}$.

    **(b)** On pose $v_{n} = p_{n} - \frac{1}{2}$. Montrer que $(v_{n})$ est géométrique, en déduire $p_{n}$ et sa limite. Interpréter, et discuter le cas $p < \frac{1}{2}$.

    **2.** *(Parties de dés.)* Jean et Luc jouent : celui qui commence lance son dé, puis l'adversaire lance le sien ; le premier gagne si l'adversaire obtient un nombre inférieur ou égal au sien. Le gagnant commence la partie suivante, et Jean commence la première.

    **(a)** Décrire un espace probabilisé associé à une partie, et calculer la probabilité $p$ que le joueur qui commence gagne.

    **(b)** Soit $u_{k}$ la probabilité que Jean gagne la $k$-ième partie. Établir une relation de récurrence, en déduire $u_{n}$ et sa limite, et commenter.
  corrige: |
    **1. (a)** Si $I_{i}$ transmet l'information initiale, $I_{i + 1}$ la transmet s'il dit ce qu'il a entendu : $\mathbb{P}(B_{i + 1} \,|\, B_{i}) = p$. Sinon, il la transmet s'il ment : $\mathbb{P}(B_{i + 1} \,|\, \overline{B_{i}}) = 1 - p$. Par la formule des probabilités totales, 
    $$p_{n + 1} = p\,p_{n} + (1 - p)(1 - p_{n}) = (2p - 1)p_{n} + 1 - p.$$

    **(b)** Alors $v_{n + 1} = (2p - 1)v_{n}$ et $v_{1} = p - \frac{1}{2}$, donc $v_{n} = \frac{1}{2}(2p - 1)^{n}$, et 
    $$\boxed{p_{n} = \frac{1}{2} + \frac{1}{2}(2p - 1)^{n}} \xrightarrow[n \to +\infty]{} \frac{1}{2},$$
     puisque $|2p - 1| < 1$. Après une longue chaîne, l'information reçue ne vaut pas mieux qu'un tirage à pile ou face. Si $p < \frac{1}{2}$, $2p - 1 < 0$ : $p_{n}$ est alternativement au-dessus et au-dessous de $\frac{1}{2}$, car deux mensonges successifs se compensent.

    1.5em

    ![Figure](documents/figures/33f8df796e8f9aef.svg)

    La probabilité $p_{n}$ que le $n$-ième transmette l'information initiale : elle tend vers $\frac{1}{2}$ d'autant plus vite que $p$ est proche de $\frac{1}{2}$ ; pour $p = 0{,}2$, elle oscille autour de $\frac{1}{2}$.

    **2. (a)** On prend $\Omega = \llbracket 1, 6 \rrbracket^{2}$, uniforme, la première coordonnée étant le dé du joueur qui commence. Il gagne si le second dé est inférieur ou égal au premier : $\sum_{i = 1}^{6}i = 21$ issues, d'où $\boxed{p = \frac{21}{36} = \frac{7}{12}}$.

    **(b)** Si Jean gagne la partie $k$, il commence la suivante et la gagne avec la probabilité $p$ ; sinon, il la gagne avec la probabilité $1 - p$. On retrouve la récurrence de la question 1, avec $u_{1} = p$ : $\boxed{u_{n} = \frac{1}{2} + \frac{1}{2}\Big(\frac{1}{6}\Big)^{n}} \to \frac{1}{2}$. L'avantage de commencer s'efface très vite : au bout de quelques parties, qui a commencé la première ne compte presque plus.
- id: "l3-pr-02-14"
  feuille: "f-l3-pr-02"
  numero: 14
  partie: "Indépendance"
  etoiles: 1
  types: [Vrai ou faux, Démonstration]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercices 1.34 et 1.37"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Vrai ou faux ? Justifier par une démonstration ou un contre-exemple.

    **1.** Si deux évènements indépendants sont incompatibles, l'un d'eux au moins a une probabilité nulle.

    **2.** Un évènement de probabilité nulle est indépendant de tout évènement, et un évènement de probabilité $1$ aussi.

    **3.** Un évènement $A$ est indépendant de lui-même si et seulement si $\mathbb{P}(A) \in \{0, 1\}$.

    **4.** Si $0 < \mathbb{P}(B) < 1$, $A$ et $B$ sont indépendants si et seulement si $\mathbb{P}(A \,|\, B) = \mathbb{P}(A \,|\, \overline{B})$.

    **5.** Si $E$ est indépendant de $F$ et de $G$, il est indépendant de $F \cup G$.

    **6.** Si $E$ est indépendant de $F$ et de $G$, et si $F$ et $G$ sont incompatibles, $E$ est indépendant de $F \cup G$.
  corrige: |
    **1.** Vrai. Si $A \cap B = \emptyset$ et $\mathbb{P}(A \cap B) = \mathbb{P}(A)\mathbb{P}(B)$, alors $\mathbb{P}(A)\mathbb{P}(B) = 0$.

    **2.** Vrai. Si $\mathbb{P}(N) = 0$, alors $\mathbb{P}(A \cap N) \leqslant \mathbb{P}(N) = 0 = \mathbb{P}(A)\mathbb{P}(N)$. Si $\mathbb{P}(U) = 1$, $\overline{U}$ est négligeable, donc indépendant de $A$, et $U$ aussi (cours, prop. 5). Un évènement négligeable n'est en revanche pas disjoint de tout évènement : $\{x\}$ est négligeable pour la loi uniforme sur $[0, 1]$ et rencontre $[0, 1]$.

    **3.** Vrai : $\mathbb{P}(A) = \mathbb{P}(A \cap A) = \mathbb{P}(A)^{2}$ si et seulement si $\mathbb{P}(A) \in \{0, 1\}$. Seuls les évènements « certains » ou « impossibles », presque sûrement, sont indépendants d'eux-mêmes.

    **4.** Vrai. Par la formule des probabilités totales, $\mathbb{P}(A) = \mathbb{P}(A \,|\, B)\mathbb{P}(B) + \mathbb{P}(A \,|\, \overline{B})(1 - \mathbb{P}(B))$ est une moyenne pondérée, à poids non nuls, de $\mathbb{P}(A \,|\, B)$ et $\mathbb{P}(A \,|\, \overline{B})$. Si ces deux nombres sont égaux, ils valent $\mathbb{P}(A)$, et $A$, $B$ sont indépendants (cours, prop. 4). Réciproquement, l'indépendance de $A$ et $B$ entraîne celle de $A$ et $\overline{B}$ (cours, prop. 5), et les deux probabilités conditionnelles valent $\mathbb{P}(A)$.

    **5.** Faux. Avec deux pièces, soit $F$ « la première donne pile », $G$ « la seconde donne pile », $E$ « les deux pièces donnent le même résultat ». Alors $E$ est indépendant de $F$ et de $G$, puisque $\mathbb{P}(E \cap F) = \frac{1}{4} = \mathbb{P}(E)\mathbb{P}(F)$, mais $\mathbb{P}(E \cap (F \cup G)) = \mathbb{P}(PP) = \frac{1}{4}$, alors que $\mathbb{P}(E)\mathbb{P}(F \cup G) = \frac{1}{2} \cdot \frac{3}{4} = \frac{3}{8}$.

    **6.** Vrai : si $F \cap G = \emptyset$, $\mathbb{P}(E \cap (F \cup G)) = \mathbb{P}(E \cap F) + \mathbb{P}(E \cap G) = \mathbb{P}(E)(\mathbb{P}(F) + \mathbb{P}(G)) = \mathbb{P}(E)\mathbb{P}(F \cup G)$.
- id: "l3-pr-02-15"
  feuille: "f-l3-pr-02"
  numero: 15
  partie: "Indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercices 1.7 et 1.21"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** On suppose équiprobables les $2^{n}$ répartitions des sexes des enfants d'une famille de $n \geqslant 2$ enfants. Les évènements $M$ : « la famille a des enfants des deux sexes » et $F$ : « la famille a au plus une fille » sont-ils indépendants ?

    **2.** On lance $n \geqslant 3$ fois un dé. Pour $i < j$, on note $A_{ij}$ l'évènement « les lancers $i$ et $j$ donnent le même résultat ». Les évènements $A_{ij}$ sont-ils indépendants deux à deux ? indépendants dans leur ensemble ?
  corrige: |
    **1.** Il y a $2^{n}$ répartitions équiprobables. $M$ exclut les deux répartitions d'un seul sexe : $\mathbb{P}(M) = 1 - \frac{2}{2^{n}}$. $F$ contient la répartition sans fille et les $n$ répartitions à une fille : $\mathbb{P}(F) = \frac{n + 1}{2^{n}}$. $M \cap F$ est « exactement une fille » : $\mathbb{P}(M \cap F) = \frac{n}{2^{n}}$. L'indépendance s'écrit 
    $$n = (n + 1)\big(1 - 2^{1 - n}\big) \iff (n + 1)\,2^{1 - n} = 1 \iff 2^{n - 1} = n + 1,$$
     ce qui n'a lieu que pour $\boxed{n = 3}$ ($2^{2} = 4$). L'indépendance est ici une coïncidence numérique, sans interprétation.

    **2.** On prend $\Omega = \llbracket 1, 6 \rrbracket^{n}$, uniforme. Chaque $A_{ij}$ a la probabilité $\frac{1}{6}$. Si les paires $\{i, j\}$ et $\{k, \ell\}$ sont disjointes, $A_{ij}$ et $A_{k\ell}$ portent sur des lancers différents et sont indépendants. Si elles ont un indice commun, par exemple $A_{12}$ et $A_{13}$, l'intersection est « les trois premiers lancers sont égaux », de probabilité $\frac{6}{216} = \frac{1}{36} = \frac{1}{6} \cdot \frac{1}{6}$. Les $A_{ij}$ sont donc $\boxed{\text{indépendants deux à deux}}$.

    Ils ne sont pas indépendants dans leur ensemble. En effet, $A_{12} \cap A_{13}$ est contenu dans $A_{23}$, et 
    $$\mathbb{P}(A_{12} \cap A_{13} \cap A_{23}) = \mathbb{P}(A_{12} \cap A_{13}) = \frac{1}{36} \neq \frac{1}{6^{3}}.$$
     Savoir $A_{12}$ et $A_{13}$ rend $A_{23}$ certain.
- id: "l3-pr-02-16"
  feuille: "f-l3-pr-02"
  numero: 16
  partie: "Indépendance"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Bordeaux, DM 1, exercice 4 ; Durand, exercice 1.9"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    On choisit au hasard un entier $X$ dans $\llbracket 1, n \rrbracket$, et l'on note $A_{k}$ l'évènement « $X$ est divisible par $k$ ».

    **1.** On prend $n = 30$. Calculer $\mathbb{P}(A_{2})$, $\mathbb{P}(A_{3})$, $\mathbb{P}(A_{5})$, $\mathbb{P}(A_{6})$ et $\mathbb{P}(A_{10})$. Les évènements $A_{2}$, $A_{3}$, $A_{5}$ sont-ils indépendants ? Et $A_{6}$, $A_{10}$ ?

    **2.** Calculer $\mathbb{P}(A_{k})$ lorsque $k$ divise $n$. Montrer que, si $k_{1}$, …, $k_{r}$ sont des diviseurs premiers de $n$ deux à deux distincts, les évènements $A_{k_{1}}$, …, $A_{k_{r}}$ sont indépendants.

    **3.** On note $\varphi(n)$ le nombre d'entiers de $\llbracket 1, n \rrbracket$ premiers avec $n$, et $k_{1}$, …, $k_{r}$ les diviseurs premiers de $n$. Traduire l'évènement « $X$ est premier avec $n$ » à l'aide des $A_{k_{i}}$, et en déduire la formule d'Euler 
    $$\varphi(n) = n\prod_{i = 1}^{r}\Big(1 - \frac{1}{k_{i}}\Big).$$
  corrige: |
    On prend $\Omega = \llbracket 1, n \rrbracket$, uniforme.

    **1.** Il y a $\lfloor 30/k \rfloor$ multiples de $k$ dans $\llbracket 1, 30 \rrbracket$ : $\mathbb{P}(A_{2}) = \frac{1}{2}$, $\mathbb{P}(A_{3}) = \frac{1}{3}$, $\mathbb{P}(A_{5}) = \frac{1}{5}$, $\mathbb{P}(A_{6}) = \frac{1}{6}$, $\mathbb{P}(A_{10}) = \frac{1}{10}$. Pour des nombres premiers distincts, être divisible par plusieurs d'entre eux équivaut à être divisible par leur produit, qui divise $30$ : $\mathbb{P}(A_{2} \cap A_{3}) = \mathbb{P}(A_{6}) = \frac{1}{6} = \mathbb{P}(A_{2})\mathbb{P}(A_{3})$, de même pour les autres paires, et $\mathbb{P}(A_{2} \cap A_{3} \cap A_{5}) = \mathbb{P}(A_{30}) = \frac{1}{30}$ : $\boxed{A_{2}, A_{3}, A_{5} \text{ sont indépendants}}$. En revanche, $A_{6} \cap A_{10} = A_{30}$ et $\frac{1}{30} \neq \frac{1}{60}$ : $\boxed{A_{6} \text{ et } A_{10} \text{ ne le sont pas}}$, car ils partagent le facteur $2$.

    **2.** Si $k$ divise $n$, il y a $\frac{n}{k}$ multiples de $k$ dans $\llbracket 1, n \rrbracket$ : $\boxed{\mathbb{P}(A_{k}) = \frac{1}{k}}$. Pour toute sous-famille $k_{i_{1}}$, …, $k_{i_{s}}$, l'intersection des $A_{k_{i_{j}}}$ est $A_{k_{i_{1}}\cdots k_{i_{s}}}$ (lemme de Gauss), et le produit divise $n$, d'où $\mathbb{P}(A_{k_{i_{1}}} \cap \cdots \cap A_{k_{i_{s}}}) = \frac{1}{k_{i_{1}}\cdots k_{i_{s}}} = \prod_{j}\mathbb{P}(A_{k_{i_{j}}})$ : c'est l'indépendance.

    **3.** $X$ est premier avec $n$ si et seulement si aucun diviseur premier de $n$ ne divise $X$ : c'est l'évènement $\overline{A_{k_{1}}} \cap \cdots \cap \overline{A_{k_{r}}}$. Les contraires d'évènements indépendants étant indépendants (cours, prop. 6), 
    $$\frac{\varphi(n)}{n} = \mathbb{P}(\overline{A_{k_{1}}} \cap \cdots \cap \overline{A_{k_{r}}}) = \prod_{i = 1}^{r}\Big(1 - \frac{1}{k_{i}}\Big).$$
     Par exemple, $\varphi(30) = 30 \cdot \frac{1}{2} \cdot \frac{2}{3} \cdot \frac{4}{5} = 8$.
- id: "l3-pr-02-17"
  feuille: "f-l3-pr-02"
  numero: 17
  partie: "Indépendance"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercice 1.16"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $s > 1$ et $\zeta(s) = \sum_{n \geqslant 1}n^{-s}$. Soit $X$ et $Y$ deux variables indépendantes à valeurs dans $\mathbb{N}^{*}$, de même loi donnée par $\mathbb{P}(X = n) = \frac{n^{-s}}{\zeta(s)}$ (*loi zêta*). On note $\mathcal{P}$ l'ensemble des nombres premiers.

    **1.** Pour $p \in \mathcal{P}$, soit $E_{p}$ l'évènement « $X$ est multiple de $p$ ». Calculer $\mathbb{P}(E_{p})$, et montrer que les évènements $E_{p}$, $p \in \mathcal{P}$, sont indépendants. En déduire une interprétation probabiliste de la formule d'Euler $\frac{1}{\zeta(s)} = \prod_{p \in \mathcal{P}}\big(1 - \frac{1}{p^{s}}\big)$.

    **2.** Montrer que la probabilité que $X$ n'ait pas de facteur carré (autre que $1$) vaut $\frac{1}{\zeta(2s)}$.

    **3.** Montrer que $\mathbb{P}(\mathrm{pgcd}(X, Y) = n) = \frac{n^{-2s}}{\zeta(2s)}$ pour tout $n \in \mathbb{N}^{*}$.
  corrige: |
    **1.** Les multiples de $p$ sont les $pm$, $m \in \mathbb{N}^{*}$ : 
    $$\mathbb{P}(E_{p}) = \sum_{m \geqslant 1}\frac{(pm)^{-s}}{\zeta(s)} = p^{-s}\,\frac{\zeta(s)}{\zeta(s)} = \boxed{\frac{1}{p^{s}}}.$$
     Pour des premiers distincts $p_{1}$, …, $p_{k}$, $E_{p_{1}} \cap \cdots \cap E_{p_{k}} = E_{p_{1}\cdots p_{k}}$, où $E_{d}$ désigne « $d$ divise $X$ », et le même calcul donne $\mathbb{P}(E_{d}) = d^{-s}$. Donc $\mathbb{P}(E_{p_{1}} \cap \cdots \cap E_{p_{k}}) = \prod_{j}p_{j}^{-s}$ : les $E_{p}$ sont indépendants (l'indépendance d'une famille infinie porte sur ses sous-familles finies).

    L'évènement $\{X = 1\}$ est l'intersection des $\overline{E_{p}}$, $p \in \mathcal{P}$. Soit $p_{1} < p_{2} < \cdots$ les nombres premiers ; les évènements $\bigcap_{j \leqslant k}\overline{E_{p_{j}}}$ décroissent vers $\{X = 1\}$, et par continuité décroissante et indépendance, 
    $$\frac{1}{\zeta(s)} = \mathbb{P}(X = 1) = \lim_{k \to +\infty}\prod_{j = 1}^{k}\Big(1 - \frac{1}{p_{j}^{s}}\Big) = \prod_{p \in \mathcal{P}}\Big(1 - \frac{1}{p^{s}}\Big).$$
     La formule d'Euler dit que l'entier $1$ est le seul qui n'a aucun facteur premier, et que les divisibilités par les différents premiers sont indépendantes pour la loi zêta.

    **2.** Les évènements $F_{p}$ : « $p^{2}$ divise $X$ », de probabilité $p^{-2s}$, sont indépendants par le même argument, et $X$ est sans facteur carré si et seulement si aucun $F_{p}$ ne se produit. Comme à la question 1, 
    $$\mathbb{P}(X \text{ sans facteur carré}) = \prod_{p \in \mathcal{P}}\Big(1 - \frac{1}{p^{2s}}\Big) = \boxed{\frac{1}{\zeta(2s)}},$$
     par la formule d'Euler appliquée à $2s > 1$.

    **3.** Pour $n = 1$ : le PGCD vaut $1$ si et seulement si aucun premier ne divise à la fois $X$ et $Y$. Les évènements $G_{p}$ : « $p$ divise $X$ et $Y$ » ont la probabilité $p^{-2s}$ (indépendance de $X$ et $Y$), et sont indépendants : pour des premiers distincts, l'intersection est « $p_{1}\cdots p_{k}$ divise $X$ et $Y$ ». Comme à la question 2, $\mathbb{P}(\mathrm{pgcd}(X, Y) = 1) = \frac{1}{\zeta(2s)}$.

    Pour $n$ quelconque, $\mathrm{pgcd}(X, Y) = n$ si et seulement si $X = nX'$, $Y = nY'$ avec $\mathrm{pgcd}(X', Y') = 1$. Or $\mathbb{P}(X = nm) = n^{-s}\mathbb{P}(X = m)$ : sachant que $n$ divise $X$, $X/n$ suit encore la loi zêta. Donc 
    $$\mathbb{P}(\mathrm{pgcd}(X, Y) = n) = \sum_{\substack{m, m' \geqslant 1 \\ \mathrm{pgcd}(m, m') = 1}}n^{-2s}\mathbb{P}(X = m)\mathbb{P}(Y = m') = n^{-2s}\,\mathbb{P}(\mathrm{pgcd}(X, Y) = 1) = \boxed{\frac{n^{-2s}}{\zeta(2s)}}.$$
     Le PGCD de deux variables zêta indépendantes suit la loi zêta de paramètre $2s$.
- id: "l3-pr-02-18"
  feuille: "f-l3-pr-02"
  numero: 18
  partie: "Indépendance"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercices 1.39 et 1.19"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $A_{1}$, …, $A_{m}$ des évènements indépendants et $(I_{1}, \dots, I_{p})$ une partition de $\llbracket 1, m \rrbracket$. Montrer que les évènements $B_{k} = \bigcap_{i \in I_{k}}A_{i}$ sont indépendants. En particulier, $A_{1} \cap A_{2}$, $A_{3}$, …, $A_{m}$ sont indépendants. Montrer de même que $A_{1} \cup A_{2}$, $A_{3}$, …, $A_{m}$ sont indépendants.

    **2.** Soit $\Omega = \{1, 2, 3, 4\}$ muni de la probabilité uniforme. Trouver deux familles $\mathcal{G}_{1}$ et $\mathcal{G}_{2}$ d'évènements telles que tout évènement de $\mathcal{G}_{1}$ soit indépendant de tout évènement de $\mathcal{G}_{2}$, mais que les tribus $\sigma(\mathcal{G}_{1})$ et $\sigma(\mathcal{G}_{2})$ qu'elles engendrent ne soient pas indépendantes (c'est-à-dire qu'il existe $A_{1} \in \sigma(\mathcal{G}_{1})$ et $A_{2} \in \sigma(\mathcal{G}_{2})$ non indépendants).
  corrige: |
    **1.** Soit $K \subset \llbracket 1, p \rrbracket$. L'intersection des $B_{k}$, $k \in K$, est l'intersection des $A_{i}$, $i \in \bigcup_{k \in K}I_{k}$ ; par l'indépendance des $A_{i}$ et parce que les $I_{k}$ sont disjoints, 
    $$\mathbb{P}\Big(\bigcap_{k \in K}B_{k}\Big) = \prod_{k \in K}\prod_{i \in I_{k}}\mathbb{P}(A_{i}) = \prod_{k \in K}\mathbb{P}(B_{k}).$$
     Avec $I_{1} = \{1, 2\}$ et les singletons pour les autres indices, $A_{1} \cap A_{2}$, $A_{3}$, …, $A_{m}$ sont indépendants. Pour la réunion : $\overline{A_{1}}$, $\overline{A_{2}}$, $A_{3}$, …, $A_{m}$ sont indépendants (cours, prop. 6), donc $\overline{A_{1}} \cap \overline{A_{2}}$, $A_{3}$, …, $A_{m}$ aussi, puis, en repassant au contraire, $A_{1} \cup A_{2}$, $A_{3}$, …, $A_{m}$.

    **2.** Prenons $\mathcal{G}_{1} = \{\{1, 2\}, \{1, 3\}\}$ et $\mathcal{G}_{2} = \{\{1, 4\}\}$. Chacune des parties à deux éléments a la probabilité $\frac{1}{2}$, et $\{1, 2\} \cap \{1, 4\} = \{1\}$, de probabilité $\frac{1}{4} = \frac{1}{2} \cdot \frac{1}{2}$, de même pour $\{1, 3\}$. Mais $\sigma(\mathcal{G}_{1})$ contient $\{1\} = \{1, 2\} \cap \{1, 3\}$, et $\mathbb{P}(\{1\} \cap \{1, 4\}) = \frac{1}{4} \neq \frac{1}{4} \cdot \frac{1}{2}$. Pour que l'indépendance se transmette aux tribus engendrées, il faut que les familles soient stables par intersection, ce qu'assure le lemme de classe monotone (Intégration, chapitre 1, th. 1).
- id: "l3-pr-02-19"
  feuille: "f-l3-pr-02"
  numero: 19
  partie: "Indépendance"
  etoiles: 1
  types: [Calcul]
  mots_cles: [indépendance]
  noeuds: [p-independance]
  notions: [independance]
  source: "Durand, exercices 1.22 et 2.44"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** On suppose les sexes de cinq nouveau-nés indépendants, chacun étant un garçon avec la probabilité $0{,}55$. Quelle est la probabilité d'avoir exactement deux garçons ?

    **2.** Une cible est détectée par chacun de $n \geqslant 1$ systèmes, indépendamment, avec la probabilité $p$. Calculer la probabilité qu'elle soit détectée par tous les systèmes, par au moins un, par au moins deux.

    **3.** Un enfant joue trois parties de tennis, indépendantes, alternativement contre sa mère et contre son père ; il bat sa mère avec la probabilité $q$ et son père avec la probabilité $p$, avec $p < q$. Il reçoit une récompense s'il gagne deux parties consécutives. Contre qui a-t-il intérêt à commencer ?
  corrige: |
    **1.** Le nombre de garçons suit la loi binomiale $\mathcal{B}(5\,;\, 0{,}55)$ (cours, prop. 7) : $\binom{5}{2}0{,}55^{2}\,0{,}45^{3} \approx \boxed{0{,}276}$.

    **2.** Par indépendance, la cible est détectée par tous avec la probabilité $\boxed{p^{n}}$, par au moins un avec $\boxed{1 - (1 - p)^{n}}$, et par au moins deux avec $\boxed{1 - (1 - p)^{n} - np(1 - p)^{n - 1}}$, en retirant « exactement un ».

    **3.** Soit $G_{1}$, $G_{2}$, $G_{3}$ les victoires aux trois parties. Il gagne deux parties consécutives si et seulement s'il gagne la deuxième et l'une au moins des deux autres. S'il commence contre sa mère (ordre mère, père, mère), 
    $$\mathbb{P} = \mathbb{P}(G_{2})\,\mathbb{P}(G_{1} \cup G_{3}) = p\,(1 - (1 - q)^{2}) = pq(2 - q).$$
     S'il commence contre son père (père, mère, père), $\mathbb{P} = q\,(1 - (1 - p)^{2}) = pq(2 - p)$. Comme $p < q$, $2 - p > 2 - q$ : il a intérêt à $\boxed{\text{commencer contre son père}}$, le plus fort de ses adversaires. C'est la partie du milieu qui compte le plus, et il vaut mieux la jouer contre l'adversaire le plus facile.
- id: "l3-pr-02-20"
  feuille: "f-l3-pr-02"
  numero: 20
  partie: "Indépendance"
  etoiles: 1
