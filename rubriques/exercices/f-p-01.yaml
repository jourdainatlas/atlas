  page_enonce: 7
  page_corrige: 18
  enonce: |
    $n$ joueurs participent à un jeu. La règle prévoit que le joueur gagnant reçoit $n$ € de la part de chacun des autres joueurs. Au cours d'une partie, le gagnant a reçu $20$ €.

    Combien y a-t-il de joueurs ?
  corrige: |
    Le gagnant reçoit $n$ € de la part de chacun des $n-1$ autres joueurs, donc il reçoit $n(n-1)$ euros au total. On résout donc : 
    $$n(n-1)=20 \iff n^{2}-n-20=0$$
     Le discriminant vaut $\Delta = 1+80 = 81 > 0$ et $\sqrt{81}=9$, donc : 
    $$n_{1}=\frac{1-9}{2}=-4 \qquad\text{et}\qquad n_{2}=\frac{1+9}{2}=5$$
     Un nombre de joueurs étant un entier positif, la valeur $-4$ est à rejeter. 
    $$\boxed{\text{Il y a } 5 \text{ joueurs.}}$$
     *Vérification :* le gagnant reçoit $5$ € de chacun des $4$ autres joueurs, soit $20$ € ✓
- id: "p-01-24"
  feuille: "f-p-01"
  numero: 24
  partie: "Problèmes du second degré"
