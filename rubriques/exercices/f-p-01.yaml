  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $m \neq 1$ un réel quelconque. On considère l'équation $(E)$ : 
    $$(E) \;:\; (m-1)x^{2}-2x+1-m=0$$
     Démontrer que cette équation possède deux racines $x_{1}$ et $x_{2}$ de signes opposés.
  corrige: |
    Comme $m \neq 1$, on a $a=m-1 \neq 0$ : l'équation $(E)$ est bien du second degré. Son discriminant vaut : 
    $$\Delta = (-2)^{2}-4(m-1)(1-m) = 4-4(m-1)(1-m)$$
     Or $(m-1)(1-m) = -(m-1)(m-1) = -(m-1)^{2}$, donc : 
    $$\Delta = 4+4(m-1)^{2}$$
     Un carré étant positif, on obtient $\Delta \geqslant 4 > 0$ : 
    $$\boxed{\text{L'équation } (E) \text{ admet toujours deux racines distinctes } x_{1} \text{ et } x_{2}.}$$
     D'après la proposition 4 du cours, leur produit vaut : 
    $$x_{1}x_{2} = \frac{c}{a} = \frac{1-m}{m-1} = \frac{-(m-1)}{m-1} = -1$$

    $$\boxed{x_{1}x_{2}=-1<0 \text{ : les deux racines sont de signes opposés.}}$$
     En effet, un produit de deux nombres non nuls est négatif si et seulement si ces deux nombres sont de signes contraires.
- id: "p-01-19"
  feuille: "f-p-01"
