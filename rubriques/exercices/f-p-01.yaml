- id: "p-01-01"
  feuille: "f-p-01"
  numero: 1
  partie: "Fonctions polynômes du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, paramètre]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des fonctions $f$ suivantes, déterminer s'il s'agit ou non d'une fonction trinôme. Si oui, donner ses paramètres $a$, $b$ et $c$.

    **1.** $f(x)=x^{2}-x+2$

    **2.** $f(x)=3x^{2}+5-7x$

    **3.** $f(x)=\sqrt{2}x-x^{2}+\pi$

    **4.** $f(x)=x(x^{2}+2x+2)$

    **5.** $f(x)=3+\dfrac{x^{2}}{3}-2x$

    **6.** $f(x)=7x-x^{2}$

    **7.** $f(x)=5x(x-1)+2$

    **8.** $f(x)=x(1-x)+x^{2}$

    **9.** $f(x)=2x(x+1)+3(x-5)$

    **10.** $f(x)=x(x^{2}+4)-x(x^{2}+x)$

    **11.** $f(x)=\dfrac{x^{2}+4x-1}{2}$

    **12.** $f(x)=\dfrac{x^{3}+2x^{2}-4x}{3x}-2x$
  corrige: |
    Une fonction est une fonction trinôme lorsqu'elle est définie sur $\mathbb{R}$ et qu'elle peut s'écrire $ax^{2}+bx+c$ avec $a \neq 0$. On développe donc systématiquement avant de conclure.

    ```tableau
     ¦ **Forme développée** ¦ **Trinôme ?** ¦ $\boldsymbol{a}$ ¦ $\boldsymbol{b}$ ¦ $\boldsymbol{c}$
    **1.** ¦ $x^{2}-x+2$ ¦ oui ¦ $1$ ¦ $-1$ ¦ $2$
    **2.** ¦ $3x^{2}-7x+5$ ¦ oui ¦ $3$ ¦ $-7$ ¦ $5$
    **3.** ¦ $-x^{2}+\sqrt{2}x+\pi$ ¦ oui ¦ $-1$ ¦ $\sqrt{2}$ ¦ $\pi$
    **4.** ¦ $x^{3}+2x^{2}+2x$ ¦ non ¦ degré $3$ ¦  ¦ 
    **5.** ¦ $\frac{1}{3}x^{2}-2x+3$ ¦ oui ¦ $\frac{1}{3}$ ¦ $-2$ ¦ $3$
    **6.** ¦ $-x^{2}+7x$ ¦ oui ¦ $-1$ ¦ $7$ ¦ $0$
    **7.** ¦ $5x^{2}-5x+2$ ¦ oui ¦ $5$ ¦ $-5$ ¦ $2$
    **8.** ¦ $x$ ¦ non ¦ $a=0$ : fonction affine ¦  ¦ 
    **9.** ¦ $2x^{2}+5x-15$ ¦ oui ¦ $2$ ¦ $5$ ¦ $-15$
    **10.** ¦ $-x^{2}+4x$ ¦ oui ¦ $-1$ ¦ $4$ ¦ $0$
    **11.** ¦ $\frac{1}{2}x^{2}+2x-\frac{1}{2}$ ¦ oui ¦ $\frac{1}{2}$ ¦ $2$ ¦ $-\frac{1}{2}$
    **12.** ¦ $\frac{1}{3}x^{2}-\frac{4}{3}x-\frac{4}{3}$ ¦ non ¦ non définie en $0$ ¦  ¦ 
    ```

    *Piège de la question 8 :* le terme en $x^{2}$ disparaît au développement, puisque $x(1-x)+x^{2}=x-x^{2}+x^{2}=x$. La condition $a \neq 0$ n'est donc pas vérifiée.

    *Piège de la question 12 :* le quotient n'existe pas pour $x=0$, à cause du dénominateur $3x$. La fonction n'est donc pas définie sur $\mathbb{R}$ tout entier, même si elle coïncide avec un trinôme sur $\mathbb{R} \setminus \{0\}$.
- id: "p-01-02"
  feuille: "f-p-01"
  numero: 2
  partie: "Fonctions polynômes du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, discriminant, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer le discriminant de chacune des fonctions trinômes suivantes, puis en déduire le nombre de racines.

    **1.** $f(x)=x^{2}+3x-4$

    **2.** $f(x)=2x^{2}-4x+2$

    **3.** $f(x)=-x^{2}+x-3$

    **4.** $f(x)=3x^{2}-5x$

    **5.** $f(x)=x^{2}-9$

    **6.** $f(x)=5x^{2}+2x+1$

    **7.** $f(x)=x^{2}-2\sqrt{3}x+3$

    **8.** $f(x)=(2x-1)^{2}-9$
  corrige: |
    On applique la formule $\Delta = b^{2}-4ac$, après avoir développé lorsque c'est nécessaire.

    **1.** $\Delta = 3^{2}-4 \times 1 \times (-4) = 9+16 = \boxed{25 > 0 \text{ : deux racines}}$

    **2.** $\Delta = (-4)^{2}-4 \times 2 \times 2 = 16-16 = \boxed{0 \text{ : une racine}}$

    **3.** $\Delta = 1^{2}-4 \times (-1) \times (-3) = 1-12 = \boxed{-11 < 0 \text{ : aucune racine}}$

    **4.** Ici $c=0$, donc $\Delta = (-5)^{2}-4 \times 3 \times 0 = \boxed{25 > 0 \text{ : deux racines}}$

    **5.** Ici $b=0$, donc $\Delta = 0^{2}-4 \times 1 \times (-9) = \boxed{36 > 0 \text{ : deux racines}}$

    **6.** $\Delta = 2^{2}-4 \times 5 \times 1 = 4-20 = \boxed{-16 < 0 \text{ : aucune racine}}$

    **7.** $\Delta = \big(-2\sqrt{3}\big)^{2}-4 \times 1 \times 3 = 12-12 = \boxed{0 \text{ : une racine}}$

    **8.** On développe d'abord : $(2x-1)^{2}-9 = 4x^{2}-4x+1-9 = 4x^{2}-4x-8$, d'où : 
    $$\Delta = (-4)^{2}-4 \times 4 \times (-8) = 16+128 = \boxed{144 > 0 \text{ : deux racines}}$$

    *Piège :* aux questions 4 et 5, il ne faut pas oublier que le coefficient manquant vaut $0$, et non $1$.
- id: "p-01-03"
  feuille: "f-p-01"
  numero: 3
  partie: "Fonctions polynômes du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, parabole et sommet, discriminant, équation du second degré, signe et inéquations]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Les six paraboles ci-dessous sont les courbes représentatives de six fonctions trinômes. Pour chacune, donner le signe de $a$, le signe du discriminant $\Delta$, et le nombre de solutions de l'équation $f(x)=0$.

    ![Figure](documents/figures/9bf1c9344e654deb.svg)

    ![Figure](documents/figures/0e5d3e5149098af9.svg)

    ![Figure](documents/figures/b9efdb4dc2747477.svg)

    ![Figure](documents/figures/23e57f25f768a965.svg)

    ![Figure](documents/figures/a59dcaffbc49211b.svg)

    ![Figure](documents/figures/8d7be8120b0fb29b.svg)
  corrige: |
    Le signe de $a$ se lit sur l'orientation de la parabole, et le signe de $\Delta$ sur le nombre de points d'intersection avec l'axe des abscisses.

    ```tableau
     ¦ **(a)** ¦ **(b)** ¦ **(c)** ¦ **(d)** ¦ **(e)** ¦ **(f)**
    **Signe de $a$** ¦ $a>0$ ¦ $a<0$ ¦ $a>0$ ¦ $a<0$ ¦ $a>0$ ¦ $a<0$
    **Signe de $\Delta$** ¦ $\Delta<0$ ¦ $\Delta>0$ ¦ $\Delta>0$ ¦ $\Delta=0$ ¦ $\Delta=0$ ¦ $\Delta<0$
    **Solutions de $f(x)=0$** ¦ $0$ ¦ $2$ ¦ $2$ ¦ $1$ ¦ $1$ ¦ $0$
    ```

    On retrouve les six cas du tableau récapitulatif du cours : la parabole est tournée vers le haut si $a>0$, vers le bas si $a<0$, et elle coupe l'axe des abscisses en autant de points que l'équation $f(x)=0$ a de solutions.
- id: "p-01-04"
  feuille: "f-p-01"
  numero: 4
  partie: "Forme canonique, sommet et variations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, forme canonique]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Développer et réduire les expressions suivantes.

    **(a)** $f(x)=2(x-3)^{2}+1$

    **(b)** $f(x)=-(x+2)^{2}-3$

    **2.** Mettre les fonctions trinômes suivantes sous forme canonique.

    **(a)** $f(x)=x^{2}-6x+11$

    **(b)** $f(x)=x^{2}+5x$

    **(c)** $f(x)=2x^{2}+8x+5$

    **(d)** $f(x)=-3x^{2}+6x-1$
  corrige: |
    **1.** On développe en utilisant les identités remarquables.

    **(a)** $2(x-3)^{2}+1 = 2(x^{2}-6x+9)+1 = 2x^{2}-12x+18+1$, d'où : 
    $$\boxed{f(x)=2x^{2}-12x+19}$$

    **(b)** $-(x+2)^{2}-3 = -(x^{2}+4x+4)-3 = -x^{2}-4x-4-3$, d'où : 
    $$\boxed{f(x)=-x^{2}-4x-7}$$

    **2.** On utilise $\alpha = -\dfrac{b}{2a}$ et $\beta = f(\alpha)$, la forme canonique étant $f(x)=a(x-\alpha)^{2}+\beta$.

    **(a)** $\alpha = \dfrac{6}{2}=3$ et $\beta = f(3)=9-18+11=2$, d'où : 
    $$\boxed{f(x)=(x-3)^{2}+2}$$

    **(b)** $\alpha = -\dfrac{5}{2}$ et $\beta = f\left(-\dfrac{5}{2}\right)=\dfrac{25}{4}-\dfrac{25}{2}=-\dfrac{25}{4}$, d'où : 
    $$\boxed{f(x)=\left(x+\dfrac{5}{2}\right)^{2}-\dfrac{25}{4}}$$

    **(c)** $\alpha = -\dfrac{8}{4}=-2$ et $\beta = f(-2)=8-16+5=-3$, d'où : 
    $$\boxed{f(x)=2(x+2)^{2}-3}$$

    **(d)** $\alpha = -\dfrac{6}{-6}=1$ et $\beta = f(1)=-3+6-1=2$, d'où : 
    $$\boxed{f(x)=-3(x-1)^{2}+2}$$

    *Piège :* le coefficient $a$ se retrouve tel quel devant le carré. Écrire $f(x)=(x+2)^{2}-3$ à la question **(c)** donnerait un trinôme dont le coefficient dominant vaut $1$, et non $2$.
- id: "p-01-05"
  feuille: "f-p-01"
  numero: 5
  partie: "Forme canonique, sommet et variations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, forme canonique, variations, discriminant]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour chacune des fonctions trinômes suivantes, déterminer le discriminant, en déduire la forme canonique, puis dresser le tableau de variations.

    **1.** $f(x)=x^{2}+4x+5$

    **2.** $f(x)=x^{2}-6x+14$

    **3.** $f(x)=x^{2}+2x-6$

    **4.** $f(x)=x^{2}+5x+4$

    **5.** $f(x)=3x^{2}+9x+5$

    **6.** $f(x)=-2x^{2}+2x+2$
  corrige: |
    Dans chaque cas, on calcule $\Delta$, puis $\alpha = -\dfrac{b}{2a}$ et $\beta = -\dfrac{\Delta}{4a}$, avant de dresser le tableau de variations.

    **1.** $\Delta = 16-20 = -4$, $\alpha = -2$ et $\beta = \dfrac{4}{4}=1$ : 
    $$\boxed{f(x)=(x+2)^{2}+1}$$

    ![Figure](documents/figures/d03f396218244db9.svg)

    **2.** $\Delta = 36-56 = -20$, $\alpha = 3$ et $\beta = \dfrac{20}{4}=5$ : 
    $$\boxed{f(x)=(x-3)^{2}+5}$$

    ![Figure](documents/figures/9a4cc9f890c57d9b.svg)

    **3.** $\Delta = 4+24 = 28$, $\alpha = -1$ et $\beta = -\dfrac{28}{4}=-7$ : 
    $$\boxed{f(x)=(x+1)^{2}-7}$$

    ![Figure](documents/figures/9b0ac8c10d78e905.svg)

    **4.** $\Delta = 25-16 = 9$, $\alpha = -\dfrac{5}{2}$ et $\beta = -\dfrac{9}{4}$ : 
    $$\boxed{f(x)=\left(x+\dfrac{5}{2}\right)^{2}-\dfrac{9}{4}}$$

    ![Figure](documents/figures/c6349956a593dc51.svg)

    **5.** $\Delta = 81-60 = 21$, $\alpha = -\dfrac{9}{6}=-\dfrac{3}{2}$ et $\beta = -\dfrac{21}{12}=-\dfrac{7}{4}$ : 
    $$\boxed{f(x)=3\left(x+\dfrac{3}{2}\right)^{2}-\dfrac{7}{4}}$$

    ![Figure](documents/figures/7d89a735f0e5e68a.svg)

    **6.** $\Delta = 4+16 = 20$, $\alpha = -\dfrac{2}{-4}=\dfrac{1}{2}$ et $\beta = -\dfrac{20}{-8}=\dfrac{5}{2}$ : 
    $$\boxed{f(x)=-2\left(x-\dfrac{1}{2}\right)^{2}+\dfrac{5}{2}}$$

    ![Figure](documents/figures/7111ea4928c44598.svg)

    *Piège :* seul le dernier trinôme a $a<0$ ; c'est le seul dont le tableau de variations commence par une croissance et dont $\beta$ est un *maximum*.
- id: "p-01-06"
  feuille: "f-p-01"
  numero: 6
  partie: "Forme canonique, sommet et variations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, parabole et sommet]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f$ une fonction trinôme définie sur $\mathbb{R}$ par $f(x)=ax^{2}+bx+c$, où $a \neq 0$. Sa courbe représentative est donnée ci-dessous, ainsi que trois de ses points $A$, $B$ et $C$.

    ![Figure](documents/figures/e7774e6610079ae8.svg)

    **1.** À l'aide des coordonnées du point $A$, déterminer la valeur de $c$.

    **2.** À l'aide des coordonnées des points $B$ et $C$, déterminer les valeurs de $a$ et $b$.

    **3.** En déduire l'expression de $f(x)$.

    **4.** Vérifier le résultat obtenu en calculant les coordonnées du sommet de la parabole.
  corrige: |
    **1.** Le point $A$ a pour abscisse $0$, et $f(0)=a \times 0 + b \times 0 + c = c$. On lit $A(0\,;1)$, donc : 
    $$\boxed{c=1}$$

    **2.** On lit $B(1\,;-1)$ et $C(3\,;1)$, ce qui donne $f(1)=-1$ et $f(3)=1$ : 
    $$\left\{\begin{array}{l} a+b+1=-1 \\ 9a+3b+1=1 \end{array}\right. \iff \left\{\begin{array}{l} a+b=-2 \\ 9a+3b=0 \end{array}\right. \iff \left\{\begin{array}{l} a+b=-2 \\ 3a+b=0 \end{array}\right.$$
     En soustrayant la première ligne à la seconde, il vient $2a=2$, puis $b=-3a=-3$ : 
    $$\boxed{a=1 \qquad\text{et}\qquad b=-3}$$

    **3.** On reporte les trois valeurs trouvées : 
    $$\boxed{f(x)=x^{2}-3x+1}$$

    **4.** On calcule les coordonnées du sommet : 
    $$\alpha = -\frac{-3}{2} = \frac{3}{2} \qquad\text{et}\qquad \beta = f\left(\frac{3}{2}\right) = \frac{9}{4}-\frac{9}{2}+1 = -\frac{5}{4}$$

    $$\boxed{\text{Le sommet est le point } \left(\dfrac{3}{2}\,;-\dfrac{5}{4}\right), \text{ ce que confirme la lecture du graphique.}}$$
- id: "p-01-07"
  feuille: "f-p-01"
  numero: 7
  partie: "Forme canonique, sommet et variations"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trinôme du second degré, forme canonique, parabole et sommet, discriminant]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Les courbes $\mathcal{C}_{f}$, $\mathcal{C}_{g}$ et $\mathcal{C}_{h}$ ci-dessous sont les représentations graphiques de trois fonctions trinômes $f$, $g$ et $h$.

    ![Figure](documents/figures/989a936715a0c5e6.svg)

    **1.** Pour chacune des trois fonctions, lire les coordonnées du sommet de sa parabole, puis celles d'un autre point à coordonnées entières.

    **2.** En déduire la forme canonique de $f$, de $g$ et de $h$.

    **3.** En déduire l'expression développée de chacune de ces trois fonctions.

    **4.** Retrouver, par le calcul, le discriminant de chacune d'elles, et vérifier la cohérence avec le nombre de points d'intersection lus sur le graphique.
  corrige: |
    **1.** On lit sur le graphique :

    $$\begin{array}{|c|c|c|} \hline  & \text{Sommet} & \text{Autre point} \\ \hline \mathcal{C}_{f} & (-1\,;1) & (0\,;0) \\ \hline \mathcal{C}_{g} & (1\,;1) & (0\,;2) \\ \hline \mathcal{C}_{h} & (-4\,;-2) & (-2\,;0) \\ \hline \end{array}$$

    **2.** La forme canonique s'écrit $a(x-\alpha)^{2}+\beta$ où $(\alpha\,;\beta)$ est le sommet. Le second point permet de trouver $a$.

    Pour $f$ : $f(x)=a(x+1)^{2}+1$ et $f(0)=0$ donne $a+1=0$, donc $a=-1$.

    Pour $g$ : $g(x)=a(x-1)^{2}+1$ et $g(0)=2$ donne $a+1=2$, donc $a=1$.

    Pour $h$ : $h(x)=a(x+4)^{2}-2$ et $h(-2)=0$ donne $4a-2=0$, donc $a=\dfrac{1}{2}$. 
    $$\boxed{f(x)=-(x+1)^{2}+1 \quad;\quad g(x)=(x-1)^{2}+1 \quad;\quad h(x)=\dfrac{1}{2}(x+4)^{2}-2}$$

    **3.** On développe chacune de ces trois expressions : 
    $$\boxed{f(x)=-x^{2}-2x \quad;\quad g(x)=x^{2}-2x+2 \quad;\quad h(x)=\dfrac{1}{2}x^{2}+4x+6}$$

    **4.** On calcule les trois discriminants : 
    $$\Delta_{f} = (-2)^{2}-4 \times (-1) \times 0 = 4 \qquad \Delta_{g} = (-2)^{2}-4 \times 1 \times 2 = -4$$

    $$\Delta_{h} = 4^{2}-4 \times \frac{1}{2} \times 6 = 16-12 = 4$$

    $$\boxed{\begin{array}{l} \Delta_{f} > 0 \text{ et } \Delta_{h} > 0 \text{ : deux points d'intersection avec l'axe des abscisses,} \\[1mm] \Delta_{g} < 0 \text{ : aucun point d'intersection.} \end{array}}$$
     C'est bien ce que montre le graphique : $\mathcal{C}_{f}$ coupe l'axe en $-2$ et $0$, $\mathcal{C}_{h}$ en $-6$ et $-2$, tandis que $\mathcal{C}_{g}$ reste entièrement au-dessus.
- id: "p-01-08"
  feuille: "f-p-01"
  numero: 8
  partie: "Équations du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Résoudre dans $\mathbb{R}$ les équations suivantes.

    **1.** $x^{2}+2x-3=0$

    **2.** $3x^{2}-6x+3=0$

    **3.** $x^{2}-x-20=0$

    **4.** $11x^{2}-4x+2=0$

    **5.** $2x^{2}-16x+24=0$

    **6.** $3x^{2}-3x-6=0$

    **7.** $x^{2}-\sqrt{3}x+4=0$

    **8.** $x^{2}+4\sqrt{2}x+6=0$

    **9.** $3x^{2}-9x-12=0$

    **10.** $2x^{2}-2x+\dfrac{1}{2}=0$

    **11.** $x(x-1)=2(2x+7)$

    **12.** $3x(x-1)=9(x-1)$
  corrige: |
    On calcule à chaque fois le discriminant. Lorsque $\Delta>0$, on applique la proposition 3 du cours : 
    $$x_{1}=\frac{-b-\sqrt{\Delta}}{2a} \qquad\text{et}\qquad x_{2}=\frac{-b+\sqrt{\Delta}}{2a}$$

    **1.** $\Delta = 2^{2}-4 \times 1 \times (-3) = 4+12 = 16 > 0$ et $\sqrt{16}=4$, donc : 
    $$x_{1}=\frac{-2-4}{2}=\frac{-6}{2}=-3 \qquad\text{et}\qquad x_{2}=\frac{-2+4}{2}=\frac{2}{2}=1$$

    $$\boxed{\mathcal{S}=\{-3\;;\;1\}}$$

    **2.** $\Delta = (-6)^{2}-4 \times 3 \times 3 = 36-36 = 0$, donc l'unique solution vaut : 
    $$x_{0}=-\frac{b}{2a}=\frac{6}{6}=1 \qquad\text{d'où}\qquad \boxed{\mathcal{S}=\{1\}}$$

    **3.** $\Delta = (-1)^{2}-4 \times 1 \times (-20) = 1+80 = 81 > 0$ et $\sqrt{81}=9$, donc : 
    $$x_{1}=\frac{1-9}{2}=\frac{-8}{2}=-4 \qquad\text{et}\qquad x_{2}=\frac{1+9}{2}=\frac{10}{2}=5$$

    $$\boxed{\mathcal{S}=\{-4\;;\;5\}}$$

    **4.** $\Delta = (-4)^{2}-4 \times 11 \times 2 = 16-88 = -72 < 0$ : $\boxed{\mathcal{S}=\varnothing}$

    **5.** $\Delta = (-16)^{2}-4 \times 2 \times 24 = 256-192 = 64 > 0$ et $\sqrt{64}=8$, donc : 
    $$x_{1}=\frac{16-8}{4}=\frac{8}{4}=2 \qquad\text{et}\qquad x_{2}=\frac{16+8}{4}=\frac{24}{4}=6$$

    $$\boxed{\mathcal{S}=\{2\;;\;6\}}$$

    **6.** $\Delta = (-3)^{2}-4 \times 3 \times (-6) = 9+72 = 81 > 0$ et $\sqrt{81}=9$, donc : 
    $$x_{1}=\frac{3-9}{6}=\frac{-6}{6}=-1 \qquad\text{et}\qquad x_{2}=\frac{3+9}{6}=\frac{12}{6}=2$$

    $$\boxed{\mathcal{S}=\{-1\;;\;2\}}$$

    **7.** $\Delta = \big(-\sqrt{3}\big)^{2}-4 \times 1 \times 4 = 3-16 = -13 < 0$ : $\boxed{\mathcal{S}=\varnothing}$

    **8.** $\Delta = \big(4\sqrt{2}\big)^{2}-4 \times 1 \times 6 = 32-24 = 8 > 0$ et $\sqrt{8}=2\sqrt{2}$, donc : 
    $$x_{1}=\frac{-4\sqrt{2}-2\sqrt{2}}{2}=\frac{-6\sqrt{2}}{2}=-3\sqrt{2} \qquad\text{et}\qquad x_{2}=\frac{-4\sqrt{2}+2\sqrt{2}}{2}=\frac{-2\sqrt{2}}{2}=-\sqrt{2}$$

    $$\boxed{\mathcal{S}=\big\{-3\sqrt{2}\;;\;-\sqrt{2}\big\}}$$

    **9.** $\Delta = (-9)^{2}-4 \times 3 \times (-12) = 81+144 = 225 > 0$ et $\sqrt{225}=15$, donc : 
    $$x_{1}=\frac{9-15}{6}=\frac{-6}{6}=-1 \qquad\text{et}\qquad x_{2}=\frac{9+15}{6}=\frac{24}{6}=4$$

    $$\boxed{\mathcal{S}=\{-1\;;\;4\}}$$

    **10.** $\Delta = (-2)^{2}-4 \times 2 \times \dfrac{1}{2} = 4-4 = 0$, donc l'unique solution vaut : 
    $$x_{0}=-\frac{b}{2a}=\frac{2}{4}=\frac{1}{2} \qquad\text{d'où}\qquad \boxed{\mathcal{S}=\left\{\frac{1}{2}\right\}}$$

    **11.** On développe d'abord : $x^{2}-x=4x+14$, soit $x^{2}-5x-14=0$. Alors $\Delta = 25+56 = 81 > 0$ et $\sqrt{81}=9$, donc : 
    $$x_{1}=\frac{5-9}{2}=\frac{-4}{2}=-2 \qquad\text{et}\qquad x_{2}=\frac{5+9}{2}=\frac{14}{2}=7$$

    $$\boxed{\mathcal{S}=\{-2\;;\;7\}}$$

    **12.** On développe : $3x^{2}-3x=9x-9$, soit $3x^{2}-12x+9=0$, ou encore $x^{2}-4x+3=0$ après division par $3$. Alors $\Delta = 16-12 = 4 > 0$ et $\sqrt{4}=2$, donc : 
    $$x_{1}=\frac{4-2}{2}=\frac{2}{2}=1 \qquad\text{et}\qquad x_{2}=\frac{4+2}{2}=\frac{6}{2}=3$$

    $$\boxed{\mathcal{S}=\{1\;;\;3\}}$$

    *Piège de la question 12 :* on pourrait être tenté de simplifier par $(x-1)$ des deux côtés, ce qui ferait perdre la solution $x=1$. Il faut tout ramener dans le membre de gauche.
- id: "p-01-09"
  feuille: "f-p-01"
  numero: 9
  partie: "Équations du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, parabole et sommet, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Pour chacune des fonctions trinômes suivantes, déterminer les racines si elles existent, puis les coordonnées du sommet de la parabole. Tracer enfin la courbe représentative de $f$ dans un repère orthogonal d'unité $1$ cm en abscisse et $1$ cm en ordonnée.

    **1.** $f(x)=\dfrac{x^{2}}{2}+x-\dfrac{3}{2}$

    **2.** $f(x)=-x^{2}+2x-5$

    **3.** $f(x)=2x^{2}+12x+18$
  corrige: |
    **1.** Pour $f(x)=\dfrac{x^{2}}{2}+x-\dfrac{3}{2}$, on a $a=\dfrac{1}{2}$, $b=1$ et $c=-\dfrac{3}{2}$, donc : 
    $$\Delta = 1-4 \times \frac{1}{2} \times \left(-\frac{3}{2}\right) = 1+3 = 4 > 0 \qquad\text{et}\qquad \sqrt{4}=2$$
     Comme $2a=1$, il vient : 
    $$x_{1}=\frac{-1-2}{1}=-3 \qquad\text{et}\qquad x_{2}=\frac{-1+2}{1}=1$$

    $$\boxed{\text{Racines : } -3 \text{ et } 1 \qquad;\qquad \text{Sommet : } (-1\,;-2)}$$

    **2.** Pour $f(x)=-x^{2}+2x-5$, on a $\Delta = 4-20 = -16 < 0$ : 
    $$\boxed{\text{Aucune racine} \qquad;\qquad \text{Sommet : } (1\,;-4)}$$

    **3.** Pour $f(x)=2x^{2}+12x+18$, on a $\Delta = 144-144 = 0$, donc une racine double $x_{0}=-\dfrac{12}{4}=-3$ : 
    $$\boxed{\text{Racine double : } -3 \qquad;\qquad \text{Sommet : } (-3\,;0)}$$
     On remarque que $2x^{2}+12x+18 = 2(x+3)^{2}$ : le sommet appartient à l'axe des abscisses, ce qui est toujours le cas lorsque $\Delta=0$.

    Les trois courbes sont représentées ci-dessous.

    ![Figure](documents/figures/da04d1f70dab57d7.svg)

    ![Figure](documents/figures/75fae6a121480d73.svg)

    ![Figure](documents/figures/752e9c1adeae1d3c.svg)

    Le sommet est repéré en violet sur chacune des trois paraboles.
- id: "p-01-10"
  feuille: "f-p-01"
  numero: 10
  partie: "Équations du second degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré, changement de variable]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Dans cet exercice, on s'intéresse aux équations dites **bicarrées**, qui sont de la forme : 
    $$ax^{4}+bx^{2}+c=0 \qquad\text{où } a,\, b \text{ et } c \text{ sont des réels tels que } a \neq 0$$

    **1.** On veut résoudre l'équation $(E)$ : $x^{4}-6x^{2}+8=0$.

    **(a)** Poser $X=x^{2}$ dans l'équation, et en déduire une nouvelle équation d'inconnue $X$.

    **(b)** Résoudre l'équation $X^{2}-6X+8=0$.

    **(c)** En déduire les solutions de $(E)$.

    **2.** Avec la même méthode, résoudre les équations suivantes.

    **(a)** $x^{4}-2x^{2}-8=0$

    **(b)** $x^{4}+x^{2}+1=0$
  corrige: |
    **1. (a)** En posant $X=x^{2}$, on a $x^{4}=\big(x^{2}\big)^{2}=X^{2}$, donc l'équation devient : 
    $$\boxed{X^{2}-6X+8=0}$$

    **(b)** Le discriminant vaut $\Delta = (-6)^{2}-4 \times 1 \times 8 = 36-32 = 4 > 0$ et $\sqrt{4}=2$, donc : 
    $$X_{1}=\frac{6-2}{2}=2 \qquad\text{et}\qquad X_{2}=\frac{6+2}{2}=4$$

    $$\boxed{X=2 \quad\text{ou}\quad X=4}$$

    **(c)** Il reste à revenir à $x$ en résolvant $x^{2}=X$ pour chacune des deux valeurs : 
    $$x^{2}=2 \iff x=-\sqrt{2} \;\text{ ou }\; x=\sqrt{2} \qquad\text{et}\qquad x^{2}=4 \iff x=-2 \;\text{ ou }\; x=2$$

    $$\boxed{\mathcal{S}=\big\{-2\;;\;-\sqrt{2}\;;\;\sqrt{2}\;;\;2\big\}}$$

    **2. (a)** On pose $X=x^{2}$, ce qui donne $X^{2}-2X-8=0$. Le discriminant vaut $\Delta = 4+32 = 36 > 0$ et $\sqrt{36}=6$, donc : 
    $$X_{1}=\frac{2-6}{2}=-2 \qquad\text{et}\qquad X_{2}=\frac{2+6}{2}=4$$

    Or $X=x^{2}$ est nécessairement positif : la valeur $X=-2$ est donc à rejeter. Il reste $x^{2}=4$ : 
    $$\boxed{\mathcal{S}=\{-2\;;\;2\}}$$

    *Piège :* une équation bicarrée peut avoir deux solutions en $X$ et seulement deux solutions en $x$. Il faut toujours vérifier le signe des valeurs de $X$ obtenues.

    **(b)** On pose $X=x^{2}$, ce qui donne $X^{2}+X+1=0$. Le discriminant vaut $\Delta = 1-4 = -3 < 0$ : cette équation n'a aucune solution, donc aucune valeur de $X$ ne convient. 
    $$\boxed{\mathcal{S}=\varnothing}$$
- id: "p-01-11"
  feuille: "f-p-01"
  numero: 11
  partie: "Équations du second degré"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré, paramètre]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $m$ un réel et $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=x^{2}-(m+1)x+4$.

    **1.** Pour quelle(s) valeur(s) de $m$ la fonction $f$ admet-elle une unique racine ? Calculer alors cette racine.

    **2.** Pour quelle(s) valeur(s) de $m$ la fonction $f$ n'admet-elle aucune racine ?
  corrige: |
    Ici $a=1$, $b=-(m+1)$ et $c=4$, donc : 
    $$\Delta = (m+1)^{2}-16$$

    **1.** La fonction $f$ admet une unique racine si et seulement si $\Delta=0$ : 
    $$(m+1)^{2}=16 \iff m+1=4 \;\text{ ou }\; m+1=-4 \iff \boxed{m=3 \quad\text{ou}\quad m=-5}$$
     La racine vaut alors $x_{0}=-\dfrac{b}{2a}=\dfrac{m+1}{2}$ : 
    $$\boxed{\text{Pour } m=3 \;:\; x_{0}=2 \qquad\text{et pour } m=-5 \;:\; x_{0}=-2}$$

    **2.** La fonction $f$ n'admet aucune racine si et seulement si $\Delta<0$ : 
    $$(m+1)^{2}<16 \iff -4 < m+1 < 4 \iff \boxed{m \in \;]-5\,;3[}$$
- id: "p-01-12"
  feuille: "f-p-01"
  numero: 12
  partie: "Équations du second degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré, paramètre]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    On considère l'équation d'inconnue $x$ : 
    $$(m+8)x^{2}+mx+1=0$$
     Pour quelles valeurs du réel $m$ cette équation admet-elle une unique solution ?
  corrige: |
    *Attention :* le coefficient de $x^{2}$ dépend de $m$. Il faut donc commencer par examiner le cas où il s'annule.

    **Premier cas : $m=-8$.** L'équation devient $-8x+1=0$, qui est du premier degré et admet l'unique solution $x=\dfrac{1}{8}$. La valeur $m=-8$ convient donc.

    **Second cas : $m \neq -8$.** L'équation est alors du second degré, et elle admet une unique solution si et seulement si son discriminant est nul : 
    $$\Delta = m^{2}-4(m+8) = m^{2}-4m-32$$
     On résout $m^{2}-4m-32=0$, dont le discriminant vaut $16+128=144>0$, avec $\sqrt{144}=12$ : 
    $$m_{1}=\frac{4-12}{2}=-4 \qquad\text{et}\qquad m_{2}=\frac{4+12}{2}=8$$

    $$\boxed{\mathcal{S}=\{-8\;;\;-4\;;\;8\}}$$
     *Piège :* oublier le cas $m=-8$ fait perdre une valeur. Une équation « $ax^{2}+bx+c=0$ » n'est du second degré que si $a \neq 0$.
- id: "p-01-13"
  feuille: "f-p-01"
  numero: 13
  partie: "Équations du second degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré, paramètre]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $m$ un réel et $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=mx^{2}+4x+2(m-1)$.

    **1.** Pour quelle(s) valeur(s) de $m$ la fonction $f$ admet-elle une unique racine ? Calculer alors cette racine.

    **2.** Quel est l'ensemble des valeurs de $m$ pour lesquelles $f$ admet deux racines distinctes ?

    **3.** Quel est l'ensemble des valeurs de $m$ pour lesquelles $f(x)<0$ pour tout réel $x$ ?
  corrige: |
    Ici encore, le coefficient de $x^{2}$ vaut $m$ : il faut commencer par le cas $m=0$.

    **1.** **Si $m=0$**, l'équation $f(x)=0$ devient $4x-2=0$, du premier degré, d'unique solution $x=\dfrac{1}{2}$.

    **Si $m \neq 0$**, on calcule le discriminant : 
    $$\Delta = 16-4 \times m \times 2(m-1) = 16-8m^{2}+8m$$
     On cherche $\Delta=0$, c'est-à-dire $-8m^{2}+8m+16=0$, ou encore $m^{2}-m-2=0$ après division par $-8$. Le discriminant de cette dernière équation vaut $1+8=9>0$, avec $\sqrt{9}=3$ : 
    $$m_{1}=\frac{1-3}{2}=-1 \qquad\text{et}\qquad m_{2}=\frac{1+3}{2}=2$$
     La racine vaut alors $x_{0}=-\dfrac{4}{2m}=-\dfrac{2}{m}$. 
    $$\boxed{\begin{array}{l} m=-1 \;:\; x_{0}=2 \qquad m=0 \;:\; x_{0}=\dfrac{1}{2} \qquad m=2 \;:\; x_{0}=-1 \end{array}}$$

    **2.** Il faut $m \neq 0$ et $\Delta>0$, c'est-à-dire $m^{2}-m-2<0$. Le trinôme $m^{2}-m-2$ a pour racines $-1$ et $2$, et son coefficient dominant est positif : il est donc négatif *entre* ses racines. 
    $$\boxed{m \in \;]-1\,;0[ \;\cup\; ]0\,;2[}$$

    **3.** Pour que $f(x)<0$ pour tout réel $x$, il faut que $f$ soit un trinôme ($m \neq 0$) de coefficient dominant négatif et sans racine, c'est-à-dire : 
    $$m<0 \qquad\text{et}\qquad \Delta<0$$
     Or $\Delta<0$ équivaut à $m^{2}-m-2>0$, soit $m<-1$ ou $m>2$. En croisant avec $m<0$ : 
    $$\boxed{m \in \;]-\infty\,;-1[}$$
- id: "p-01-14"
  feuille: "f-p-01"
  numero: 14
  partie: "Équations du second degré"
  etoiles: 3
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    **1.** Soit $f$ la fonction définie sur $\mathbb{R}$ par : 
    $$f(x)=x^{3}-2x^{2}-5x+6$$
     On veut résoudre l'équation $f(x)=0$.

    **(a)** Vérifier que $1$ est solution de l'équation $f(x)=0$.

    **(b)** Montrer que l'on peut écrire $f(x)$ sous la forme $(x-1)(ax^{2}+bx+c)$, en développant et en identifiant les coefficients. On donnera les valeurs de $a$, $b$ et $c$.

    **(c)** Résoudre l'équation $ax^{2}+bx+c=0$.

    **(d)** En déduire les solutions de l'équation $f(x)=0$.

    **2.** Utiliser une méthode analogue pour résoudre l'équation suivante, après avoir vérifié que $3$ en est solution : 
    $$2x^{3}-20x^{2}-618x+1980=0$$
  corrige: |
    **1. (a)** On calcule $f(1) = 1-2-5+6 = 0$ : 
    $$\boxed{1 \text{ est bien solution de } f(x)=0.}$$

    **(b)** On développe le membre de droite : 
    $$(x-1)(ax^{2}+bx+c) = ax^{3}+bx^{2}+cx-ax^{2}-bx-c = ax^{3}+(b-a)x^{2}+(c-b)x-c$$
     En identifiant les coefficients avec $x^{3}-2x^{2}-5x+6$ : 
    $$\left\{\begin{array}{l} a=1 \\ b-a=-2 \\ c-b=-5 \\ -c=6 \end{array}\right. \iff \boxed{a=1 \quad;\quad b=-1 \quad;\quad c=-6}$$
     On vérifie la cohérence des deux dernières lignes : $c-b=-6-(-1)=-5$ ✓

    **(c)** On résout $x^{2}-x-6=0$, dont le discriminant vaut $\Delta = 1+24 = 25 > 0$, avec $\sqrt{25}=5$ : 
    $$x_{1}=\frac{1-5}{2}=-2 \qquad\text{et}\qquad x_{2}=\frac{1+5}{2}=3$$

    $$\boxed{x=-2 \quad\text{ou}\quad x=3}$$

    **(d)** Un produit est nul si et seulement si l'un de ses facteurs est nul : 
    $$\boxed{\mathcal{S}=\{-2\;;\;1\;;\;3\}}$$

    **2.** On vérifie d'abord que $3$ est solution : 
    $$2 \times 27 - 20 \times 9 - 618 \times 3 + 1980 = 54-180-1854+1980 = 0$$
     On factorise ensuite par $(x-3)$ en posant $2x^{3}-20x^{2}-618x+1980 = (x-3)(ax^{2}+bx+c)$. En développant, on obtient $ax^{3}+(b-3a)x^{2}+(c-3b)x-3c$, d'où : 
    $$\left\{\begin{array}{l} a=2 \\ b-3a=-20 \\ c-3b=-618 \\ -3c=1980 \end{array}\right. \iff \left\{\begin{array}{l} a=2 \\ b=-14 \\ c=-660 \end{array}\right.$$
     Il reste à résoudre $2x^{2}-14x-660=0$, soit $x^{2}-7x-330=0$ après division par $2$. Son discriminant vaut $\Delta = 49+1320 = 1369 > 0$, et $\sqrt{1369}=37$, donc : 
    $$x_{1}=\frac{7-37}{2}=\frac{-30}{2}=-15 \qquad\text{et}\qquad x_{2}=\frac{7+37}{2}=\frac{44}{2}=22$$

    $$\boxed{\mathcal{S}=\{-15\;;\;3\;;\;22\}}$$
- id: "p-01-15"
  feuille: "f-p-01"
  numero: 15
  partie: "Somme, produit et factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, discriminant, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Trouver une racine évidente de chacune des équations suivantes, puis en déduire l'autre solution sans calculer le discriminant.

    **1.** $x^{2}-7x+6=0$

    **2.** $-3x^{2}+2x+5=0$

    **3.** $x^{2}+3x-10=0$

    **4.** $x^{2}-\sqrt{2}x-4=0$

    **5.** $x^{2}+x-6=0$

    **6.** $x^{2}+5x+4=0$

    **7.** $2x^{2}+\sqrt{5}x-15=0$

    **8.** $x^{2}-8x+15=0$
  corrige: |
    On utilise la proposition 4 du cours : $x_{1}x_{2} = \dfrac{c}{a}$, ce qui donne $x_{2}$ dès que $x_{1}$ est connue et non nulle.

    $$\begin{array}{|c|c|c|c|c|} \hline  & \text{Racine évidente }x_{1} & \text{Vérification} & \boldsymbol{\dfrac{c}{a}} & \text{Autre racine }x_{2} \\ \hline \text{1.} & 1 & 1-7+6=0 & 6 & 6 \\ \hline \text{2.} & -1 & -3-2+5=0 & -\dfrac{5}{3} & \dfrac{5}{3} \\ \hline \text{3.} & 2 & 4+6-10=0 & -10 & -5 \\ \hline \text{4.} & -\sqrt{2} & 2+2-4=0 & -4 & 2\sqrt{2} \\ \hline \text{5.} & 2 & 4+2-6=0 & -6 & -3 \\ \hline \text{6.} & -1 & 1-5+4=0 & 4 & -4 \\ \hline \text{7.} & \sqrt{5} & 10+5-15=0 & -\dfrac{15}{2} & -\dfrac{3\sqrt{5}}{2} \\ \hline \text{8.} & 3 & 9-24+15=0 & 15 & 5 \\ \hline \end{array}$$

    Détaillons la question **4.** : on a $x_{1}x_{2}=-4$ avec $x_{1}=-\sqrt{2}$, donc : 
    $$x_{2} = \frac{-4}{-\sqrt{2}} = \frac{4}{\sqrt{2}} = \frac{4\sqrt{2}}{2} = 2\sqrt{2}$$
     et la question **7.** : $x_{1}x_{2}=-\dfrac{15}{2}$ avec $x_{1}=\sqrt{5}$, donc : 
    $$x_{2} = \frac{-15}{2\sqrt{5}} = \frac{-15\sqrt{5}}{10} = -\frac{3\sqrt{5}}{2}$$
- id: "p-01-16"
  feuille: "f-p-01"
  numero: 16
  partie: "Somme, produit et factorisation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré]
  noeuds: [z-polynomes]
  notions: [anneau-polynomes]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Écrire sous la forme d'un produit de facteurs les fonctions trinômes $f$ définies pour tout $x \in \mathbb{R}$ par :

    **1.** $f(x)=x^{2}-7x+10$

    **2.** $f(x)=2x^{2}-5x+2$

    **3.** $f(x)=-3x^{2}+4x+4$

    **4.** $f(x)=-\dfrac{1}{2}x^{2}-\dfrac{1}{2}x+1$
  corrige: |
    On cherche les racines, puis on applique la proposition 5 : $f(x)=a(x-x_{1})(x-x_{2})$.

    **1.** $\Delta = 49-40 = 9 > 0$ et $\sqrt{9}=3$, donc : 
    $$x_{1}=\frac{7-3}{2}=2 \qquad\text{et}\qquad x_{2}=\frac{7+3}{2}=5$$

    $$\boxed{f(x)=(x-2)(x-5)}$$

    **2.** $\Delta = 25-16 = 9 > 0$ et $\sqrt{9}=3$, donc, avec $2a=4$ : 
    $$x_{1}=\frac{5-3}{4}=\frac{1}{2} \qquad\text{et}\qquad x_{2}=\frac{5+3}{4}=2$$

    $$f(x)=2\left(x-\frac{1}{2}\right)(x-2) \qquad\text{soit}\qquad \boxed{f(x)=(2x-1)(x-2)}$$

    **3.** $\Delta = 16+48 = 64 > 0$ et $\sqrt{64}=8$, donc, avec $2a=-6$ : 
    $$x_{1}=\frac{-4-8}{-6}=\frac{-12}{-6}=2 \qquad\text{et}\qquad x_{2}=\frac{-4+8}{-6}=\frac{4}{-6}=-\frac{2}{3}$$

    $$f(x)=-3(x-2)\left(x+\frac{2}{3}\right) \qquad\text{soit}\qquad \boxed{f(x)=-(x-2)(3x+2)}$$

    **4.** $\Delta = \dfrac{1}{4}+2 = \dfrac{9}{4} > 0$ et $\sqrt{\dfrac{9}{4}}=\dfrac{3}{2}$, donc, avec $2a=-1$ : 
    $$x_{1}=\frac{\frac{1}{2}-\frac{3}{2}}{-1}=\frac{-1}{-1}=1 \qquad\text{et}\qquad x_{2}=\frac{\frac{1}{2}+\frac{3}{2}}{-1}=\frac{2}{-1}=-2$$

    $$\boxed{f(x)=-\dfrac{1}{2}(x+2)(x-1)}$$

    *Piège :* le coefficient $a$ ne doit jamais être oublié devant le produit. On peut toujours vérifier en développant, ou en comparant les termes constants : par exemple pour **1.**, $(-2) \times (-5)=10$ ✓
- id: "p-01-17"
  feuille: "f-p-01"
  numero: 17
  partie: "Somme, produit et factorisation"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [trinôme du second degré, variations, équation du second degré]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Soit $f$ la fonction définie sur $\mathbb{R}$ par $f(x)=2x^{2}+4x-16$.

    **1.** Montrer que pour tout réel $x$, $f(x)=2(x+4)(x-2)$.

    **2.** Montrer que pour tout réel $x$, $f(x)=2(x+1)^{2}-18$.

    **3.** Choisir à chaque fois la forme la plus adaptée pour répondre aux questions suivantes.

    **(a)** Dresser le tableau de variations de $f$.

    **(b)** Résoudre dans $\mathbb{R}$ l'équation $f(x)=0$.

    **(c)** Résoudre dans $\mathbb{R}$ l'équation $f(x)=-16$.
  corrige: |
    **1.** On développe le membre de droite : 
    $$2(x+4)(x-2) = 2\big(x^{2}-2x+4x-8\big) = 2\big(x^{2}+2x-8\big) = 2x^{2}+4x-16$$

    $$\boxed{\text{Pour tout réel } x,\; f(x)=2(x+4)(x-2).}$$

    **2.** On développe de même : 
    $$2(x+1)^{2}-18 = 2\big(x^{2}+2x+1\big)-18 = 2x^{2}+4x+2-18 = 2x^{2}+4x-16$$

    $$\boxed{\text{Pour tout réel } x,\; f(x)=2(x+1)^{2}-18.}$$

    **3. (a)** La *forme canonique* donne directement le sommet $(-1\,;-18)$, et $a=2>0$ :

    ![Figure](documents/figures/15e96c0c8440ce6e.svg)

    **(b)** La *forme factorisée* permet de résoudre par produit nul : 
    $$2(x+4)(x-2)=0 \iff x+4=0 \;\text{ ou }\; x-2=0$$

    $$\boxed{\mathcal{S}=\{-4\;;\;2\}}$$

    **(c)** La *forme canonique* est la plus adaptée, car elle isole le carré : 
    $$2(x+1)^{2}-18=-16 \iff 2(x+1)^{2}=2 \iff (x+1)^{2}=1 \iff x+1=1 \;\text{ ou }\; x+1=-1$$

    $$\boxed{\mathcal{S}=\{-2\;;\;0\}}$$
     *Remarque :* on aurait aussi pu développer, ce qui donne $2x^{2}+4x=0$, soit $2x(x+2)=0$. C'est tout l'intérêt de disposer de trois formes : chacune répond à une question différente sans calcul supplémentaire.
