  notions: [anneau-polynomes]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Armand décide d'aménager sa piscine, qui a une forme carrée et qui mesure $x$ mètres de côté.

    • Il achète une bâche de sécurité, qui recouvre exactement la piscine et coûte $20$ € par mètre carré.

    • Il installe une clôture faisant le tour complet de la piscine, placée à $2$ mètres du bord, et coûtant $100$ € par mètre de clôture.

    • Il ajoute enfin une échelle de piscine coûtant $150$ €.

    Il se retrouve à payer un total de $8\,155$ €. Quelle est la largeur de la piscine ?
  corrige: |
    Notons $x$ le côté de la piscine, en mètres, avec $x>0$. On exprime chacune des trois dépenses.

    • La bâche recouvre un carré d'aire $x^{2}$, donc elle coûte $20x^{2}$ euros.

    • La clôture est placée à $2$ mètres du bord : elle forme un carré de côté $x+2+2=x+4$, donc de périmètre $4(x+4)$. Elle coûte $100 \times 4(x+4) = 400x+1\,600$ euros.

    • L'échelle coûte $150$ euros.

    Le total vaut $8\,155$ euros, ce qui donne : 
    $$20x^{2}+400x+1\,600+150 = 8\,155 \iff 20x^{2}+400x-6\,405=0 \iff 4x^{2}+80x-1\,281=0$$
     Le discriminant vaut : 
    $$\Delta = 80^{2}-4 \times 4 \times (-1\,281) = 6\,400+20\,496 = 26\,896$$
     et $\sqrt{26\,896}=164$, d'où : 
    $$x = \frac{-80-164}{8} = -30{,}5 \qquad\text{ou}\qquad x = \frac{-80+164}{8} = 10{,}5$$
     Une longueur étant positive, la première valeur est à rejeter. 
    $$\boxed{\text{La piscine mesure } 10{,}5 \text{ mètres de côté.}}$$
     *Vérification :* $20 \times 10{,}5^{2} = 2\,205$, $400 \times 10{,}5+1\,600 = 5\,800$, et $2\,205+5\,800+150 = 8\,155$ ✓

    *Piège :* la clôture entoure un carré de côté $x+4$ et non $x+2$, puisqu'on ajoute $2$ mètres *de chaque côté*.
- id: "p-01-26"
  feuille: "f-p-01"
  numero: 26
  titre: "QCM"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [QCM, Démonstration]
  mots_cles: [trinôme du second degré, forme canonique, parabole et sommet, discriminant, équation du second degré, factorisation, somme et produit des racines, signe et inéquations]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Pour chaque question, une seule réponse est exacte. La recopier sur la copie et la justifier.

    ```tableau
    Énoncé ¦ **a** ¦ **b** ¦ **c**
    **1.** Le discriminant de $f(x)=2x^{2}-3x+1$ vaut : ¦ $1$ ¦ $17$ ¦ $-1$
    **2.** L'équation $x^{2}+x+1=0$ admet : ¦ aucune solution ¦ une solution ¦ deux solutions
    **3.** Le sommet de la parabole de $f(x)=(x-2)^{2}+3$ est le point : ¦ $(2\,;3)$ ¦ $(-2\,;3)$ ¦ $(2\,;-3)$
    **4.** Si $\Delta=0$, alors $f(x)$ se factorise sous la forme : ¦ $a(x-x_{1})(x-x_{2})$ ¦ $a(x-x_{0})^{2}$ ¦ $f$ n'est pas factorisable
    **5.** Si $x_{1}$ et $x_{2}$ sont les racines de $ax^{2}+bx+c$, alors $x_{1}x_{2}$ vaut : ¦ $-\dfrac{b}{a}$ ¦ $\dfrac{c}{a}$ ¦ $\dfrac{b}{a}$
    **6.** La fonction $f(x)=-x^{2}+4$ est positive sur : ¦ $[-2\,;2]$ ¦ $]-\infty\,;-2] \cup [2\,;+\infty[$ ¦ $\mathbb{R}$
    **7.** La forme canonique de $x^{2}-4x+7$ est : ¦ $(x-2)^{2}+3$ ¦ $(x-2)^{2}+7$ ¦ $(x+2)^{2}+3$
    **8.** Si $a>0$ et $\Delta<0$, alors pour tout réel $x$, $f(x)$ est : ¦ négatif ¦ positif ¦ de signe variable
    **9.** La somme des racines de $2x^{2}-10x+3$ vaut : ¦ $-5$ ¦ $5$ ¦ $\dfrac{3}{2}$
    **10.** L'axe de symétrie de la parabole de $f(x)=3x^{2}+6x-1$ a pour équation : ¦ $x=-1$ ¦ $x=1$ ¦ $x=-3$
    ```
  corrige: |
    ```tableau
    **Question** ¦ **Réponse** ¦ **Justification**
    **1.** ¦ **a** ¦ $\Delta = (-3)^{2}-4 \times 2 \times 1 = 9-8 = 1$.
    **2.** ¦ **a** ¦ $\Delta = 1-4 = -3 < 0$ : aucune solution réelle.
    **3.** ¦ **a** ¦ La forme canonique $a(x-\alpha)^{2}+\beta$ donne le sommet $(\alpha\,;\beta)=(2\,;3)$.
    **4.** ¦ **b** ¦ C'est la proposition 5 du cours dans le cas $\Delta=0$.
    **5.** ¦ **b** ¦ C'est la proposition 4 : le produit des racines vaut $\dfrac{c}{a}$, la somme $-\dfrac{b}{a}$.
    **6.** ¦ **a** ¦ Les racines sont $-2$ et $2$, et $a=-1<0$ : le trinôme est positif *entre* les racines.
    **7.** ¦ **a** ¦ $\alpha=2$ et $\beta=f(2)=4-8+7=3$.
    **8.** ¦ **b** ¦ Sans racine, le trinôme garde le signe de $a$ sur $\mathbb{R}$ (proposition 6).
    **9.** ¦ **b** ¦ $x_{1}+x_{2}=-\dfrac{b}{a}=\dfrac{10}{2}=5$.
    **10.** ¦ **a** ¦ L'axe de symétrie a pour équation $x=\alpha$, avec $\alpha=-\dfrac{6}{6}=-1$.
    ```

    *Piège de la question 9 :* la réponse **c** est le produit des racines, $\dfrac{c}{a}=\dfrac{3}{2}$, et la réponse **a** oublie le signe moins de la formule.
- id: "p-01-27"
  feuille: "f-p-01"
  numero: 27
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [trinôme du second degré, forme canonique, parabole et sommet, variations, discriminant, équation du second degré, factorisation, somme et produit des racines]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse. Dans tout l'exercice, $f$ désigne une fonction trinôme de paramètres $a$, $b$ et $c$, et $\Delta$ son discriminant.

    **1.** Une fonction trinôme est définie sur $\mathbb{R}$ tout entier.

    **2.** Si $\Delta<0$, la parabole de $f$ ne coupe pas l'axe des abscisses.

    **3.** Si $a<0$, la fonction $f$ admet un minimum sur $\mathbb{R}$.

    **4.** Le sommet de la parabole de $f$ a pour abscisse $-\dfrac{b}{2a}$.

    **5.** Une équation du second degré admet toujours au moins une solution réelle.

    **6.** Si $\Delta>0$, alors $f(x)$ est du signe de $a$ à l'extérieur des racines.

    **7.** La forme canonique permet de lire directement les racines de $f$.

    **8.** Si le produit des racines de $f$ est négatif, alors ces racines sont de signes opposés.

    **9.** Toute fonction trinôme peut s'écrire sous forme factorisée.

    **10.** Pour toute fonction trinôme, on a $f(0)=c$.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ C'est la définition du cours : une fonction trinôme est définie sur $\mathbb{R}$ tout entier. C'est d'ailleurs ce qui disqualifie la question 12 de l'exercice 1.

    **2.** $\boxed{\textbf{Vraie}}$ Si $\Delta<0$, l'équation $f(x)=0$ n'a pas de solution : la courbe n'a aucun point d'ordonnée nulle.

    **3.** $\boxed{\textbf{Fausse}}$ Si $a<0$, la parabole est tournée vers le bas et $\beta$ est un *maximum*. C'est le cas de la question 6 de l'exercice 5.

    **4.** $\boxed{\textbf{Vraie}}$ C'est la proposition 1 du cours : $\alpha = -\dfrac{b}{2a}$.

    **5.** $\boxed{\textbf{Fausse}}$ L'équation $x^{2}+x+1=0$ a un discriminant négatif et n'admet aucune solution réelle.

    **6.** $\boxed{\textbf{Vraie}}$ C'est exactement l'énoncé de la proposition 6.

    **7.** $\boxed{\textbf{Fausse}}$ C'est la forme *factorisée* qui donne les racines. La forme canonique donne le sommet, donc les variations et l'extremum.

    **8.** $\boxed{\textbf{Vraie}}$ Un produit de deux nombres non nuls est négatif si et seulement s'ils sont de signes contraires. C'est l'argument de l'exercice 18.

    **9.** $\boxed{\textbf{Fausse}}$ Lorsque $\Delta<0$, le trinôme n'a pas de racine et n'est pas factorisable (proposition 5). Par exemple $x^{2}+5$ de l'exercice 19.

    **10.** $\boxed{\textbf{Vraie}}$ On a $f(0)=a \times 0 + b \times 0 + c = c$, ce qui est utilisé à l'exercice 6 pour lire $c$ sur l'axe des ordonnées.
- id: "p-01-28"
  feuille: "f-p-01"
  numero: 28
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [problème concret]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $ABCD$ un carré de côté $5$ cm. Soit $E$ un point appartenant à $[AB]$ et $F$ un point appartenant à $[BC]$ tels que $AE=CF=x$. On note $\mathcal{A}(x)$ l'aire du triangle $AEF$.

    **1.** À quel intervalle le réel $x$ appartient-il ?

    **2.** Déterminer l'expression de $\mathcal{A}(x)$ en fonction de $x$.

    **3.** Pour quelle valeur de $x$ cette aire est-elle maximale ? Quelle est alors cette aire ?

    **4.** Pour quelle(s) valeur(s) de $x$ a-t-on $\mathcal{A}(x)=2{,}75$ cm$^{2}$ ?
  corrige: |
    **1.** Le point $E$ appartient à $[AB]$, qui mesure $5$ cm, donc $AE=x$ varie entre $0$ et $5$. Le point $F$ appartient à $[BC]$ avec $CF=x$, ce qui donne la même contrainte. 
    $$\boxed{x \in [0\,;5]}$$

    **2.** Le triangle $AEF$ est rectangle en $E$, puisque $E$ appartient au côté $[AB]$ et que l'angle en $B$ du carré est droit. On prend $[AE]$ pour base : la hauteur associée est la distance de $F$ à la droite $(AB)$, c'est-à-dire $BF$. Or : 
    $$BF = BC - CF = 5-x$$
     L'aire du triangle vaut donc : 
    $$\boxed{\mathcal{A}(x) = \frac{AE \times BF}{2} = \frac{x(5-x)}{2} = -\frac{1}{2}x^{2}+\frac{5}{2}x}$$

    **3.** La fonction $\mathcal{A}$ est un trinôme de coefficient dominant $-\dfrac{1}{2}<0$ : elle admet donc un maximum, atteint en : 
    $$\alpha = -\frac{\frac{5}{2}}{2 \times \left(-\frac{1}{2}\right)} = \frac{5}{2}$$
     Cette valeur appartient bien à $[0\,;5]$, et : 
    $$\mathcal{A}\left(\frac{5}{2}\right) = \frac{\frac{5}{2} \times \frac{5}{2}}{2} = \frac{25}{8} = 3{,}125$$

    $$\boxed{\text{L'aire est maximale pour } x=2{,}5 \text{ cm, et vaut alors } 3{,}125 \text{ cm}^{2}.}$$
     Le point $E$ est alors le milieu de $[AB]$, ce que la symétrie de l'expression $x(5-x)$ laissait prévoir.

    **4.** On résout : 
    $$\frac{x(5-x)}{2}=2{,}75 \iff x(5-x)=5{,}5 \iff -x^{2}+5x-5{,}5=0 \iff 2x^{2}-10x+11=0$$
     Le discriminant vaut $\Delta = 100-88 = 12 > 0$, et $\sqrt{12}=2\sqrt{3}$, d'où : 
    $$x_{1}=\frac{10-2\sqrt{3}}{4}=\frac{5-\sqrt{3}}{2} \qquad\text{et}\qquad x_{2}=\frac{10+2\sqrt{3}}{4}=\frac{5+\sqrt{3}}{2}$$
     Les deux valeurs $\dfrac{5-\sqrt{3}}{2} \approx 1{,}63$ et $\dfrac{5+\sqrt{3}}{2} \approx 3{,}37$ appartiennent à $[0\,;5]$. 
    $$\boxed{x = \frac{5-\sqrt{3}}{2} \quad\text{ou}\quad x = \frac{5+\sqrt{3}}{2}}$$
     Ces deux valeurs sont symétriques par rapport à $2{,}5$, ce qui est cohérent avec la question précédente : la parabole prend deux fois la même valeur de part et d'autre de son sommet.
