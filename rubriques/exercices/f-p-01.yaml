  enonce: |
    Pour se rendre d'une ville $A$ à une ville $B$ distantes de $195$ km, deux cyclistes partent en même temps. L'un d'eux, dont la vitesse moyenne sur le parcours est supérieure de $4$ km/h à celle de l'autre, arrive une heure plus tôt.

    Quelles sont les vitesses moyennes des deux cyclistes ?
  corrige: |
    Notons $v$ la vitesse moyenne, en km/h, du cycliste le plus lent, avec $v>0$. Celle de l'autre vaut $v+4$. Le temps de parcours étant le quotient de la distance par la vitesse, le plus lent met $\dfrac{195}{v}$ heures et le plus rapide $\dfrac{195}{v+4}$ heures. Le plus rapide arrive une heure plus tôt : 
    $$\frac{195}{v}-\frac{195}{v+4}=1$$
     On réduit au même dénominateur, sachant que $v>0$ et donc $v+4>0$ : 
    $$\frac{195(v+4)-195v}{v(v+4)}=1 \iff \frac{780}{v(v+4)}=1 \iff v^{2}+4v=780 \iff v^{2}+4v-780=0$$
     Le discriminant vaut $\Delta = 16+3\,120 = 3\,136$, et $\sqrt{3\,136}=56$, d'où : 
    $$v = \frac{-4-56}{2}=-30 \qquad\text{ou}\qquad v = \frac{-4+56}{2}=26$$
     Une vitesse étant positive, la valeur $-30$ est à rejeter. 
    $$\boxed{\text{Les deux cyclistes roulent à } 26 \text{ km/h et } 30 \text{ km/h.}}$$
     *Vérification :* $\dfrac{195}{26}=7{,}5$ heures et $\dfrac{195}{30}=6{,}5$ heures : l'écart est bien d'une heure ✓

