  enonce: |
    Trouver deux entiers consécutifs dont le produit est égal à $4\,970$.
  corrige: |
    Notons $n$ le plus petit des deux entiers ; le suivant est $n+1$. On résout : 
    $$n(n+1)=4\,970 \iff n^{2}+n-4\,970=0$$
     Le discriminant vaut $\Delta = 1+19\,880 = 19\,881$, et $\sqrt{19\,881}=141$, d'où : 
    $$n = \frac{-1-141}{2}=-71 \qquad\text{ou}\qquad n = \frac{-1+141}{2}=70$$

    $$\boxed{\text{Les deux entiers sont } 70 \text{ et } 71, \text{ ou bien } -71 \text{ et } -70.}$$
     *Vérification :* $70 \times 71 = 4\,970$ et $(-71) \times (-70) = 4\,970$ ✓
- id: "p-01-25"
  feuille: "f-p-01"
  numero: 25
  partie: "Problèmes du second degré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [mise en équation]
