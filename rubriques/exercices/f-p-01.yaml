  page_enonce: 6
  page_corrige: 13
  enonce: |
    Dresser le tableau de signes de chacune des fonctions $f$ suivantes, définies pour tout $x \in \mathbb{R}$ par :

    **1.** $f(x)=2(x+2)(x-3)$

    **2.** $f(x)=-2\left(x-\dfrac{1}{3}\right)^{2}$

    **3.** $f(x)=x^{2}+5$

    **4.** $f(x)=2x^{2}-4x-16$

    **5.** $f(x)=9x^{2}+24x+16$

    **6.** $f(x)=2x^{2}-5x+6$
  corrige: |
    **1.** Les racines sont $-2$ et $3$, et $a=2>0$ : $f(x)$ est du signe de $a$ à l'extérieur des racines.

    ![Figure](documents/figures/0c29e0f67ec38ea7.svg)

    **2.** L'expression $-2\left(x-\frac{1}{3}\right)^{2}$ est le produit de $-2$ par un carré, donc toujours négative, et nulle seulement en $\frac{1}{3}$.

    ![Figure](documents/figures/e5ac267e66f78b00.svg)

    **3.** Ici $\Delta = 0-20 = -20 < 0$ et $a=1>0$ : $f(x)$ est du signe de $a$ sur $\mathbb{R}$.

    ![Figure](documents/figures/4a0ab2d75e984afb.svg)

    **4.** $\Delta = 16+128 = 144 > 0$ et $\sqrt{144}=12$, donc : 
    $$x_{1}=\frac{4-12}{4}=-2 \qquad\text{et}\qquad x_{2}=\frac{4+12}{4}=4$$
     Comme $a=2>0$, le trinôme est du signe de $a$ à l'extérieur des racines :

    ![Figure](documents/figures/649ef3e1e7030d03.svg)

    **5.** $\Delta = 576-576 = 0$, avec la racine double $x_{0}=-\dfrac{24}{18}=-\dfrac{4}{3}$. On reconnaît d'ailleurs $9x^{2}+24x+16=(3x+4)^{2}$, qui est positif et nul en $-\frac{4}{3}$.

    ![Figure](documents/figures/be1407222f35f413.svg)

    **6.** $\Delta = 25-48 = -23 < 0$ et $a=2>0$ :

    ![Figure](documents/figures/4a0ab2d75e984afb.svg)

    *Piège :* aux questions **2.** et **5.**, le trinôme s'annule sans changer de signe. C'est le cas $\Delta=0$ : le signe reste celui de $a$ de part et d'autre de la racine.
- id: "p-01-20"
  feuille: "f-p-01"
  numero: 20
  partie: "Signe d'un trinôme et inéquations"
  etoiles: 1
  types: [Calcul]
  mots_cles: [trinôme du second degré, équation du second degré, signe et inéquations]
  noeuds: [z-polynomes, c-racine-reelle]
  notions: [anneau-polynomes]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Résoudre les inéquations suivantes sur $\mathbb{R}$.

    **1.** $x^{2}-3x+2>0$

    **2.** $x^{2}+4 \geqslant 0$

    **3.** $x^{2}+x-20 \leqslant 0$

    **4.** $x^{2}-x+1<0$

    **5.** $3x^{2}+18x+27>0$

    **6.** $-x^{2}-9 \geqslant 0$

    **7.** $x(x-2)<0$

    **8.** $x^{2}+7x+12 \geqslant 0$

    **9.** $-2x^{2}-x+4>0$

    **10.** $2x^{2}-24x+72 \leqslant 0$

    **11.** $x^{2}+4x-12<0$

    **12.** $x^{2}-5x+7>0$
  corrige: |
    On étudie à chaque fois le signe du trinôme, en cherchant d'abord ses racines.

    **1.** $\Delta = 9-8 = 1 > 0$ et $\sqrt{1}=1$, donc $x_{1}=\dfrac{3-1}{2}=1$ et $x_{2}=\dfrac{3+1}{2}=2$. Comme $a=1>0$, le trinôme est positif à l'extérieur des racines. 
    $$\boxed{\mathcal{S}=\;]-\infty\,;1[\;\cup\;]2\,;+\infty[}$$

    **2.** $\Delta = -16 < 0$ et $a=1>0$ : le trinôme est strictement positif sur $\mathbb{R}$. 
    $$\boxed{\mathcal{S}=\mathbb{R}}$$

    **3.** $\Delta = 1+80 = 81 > 0$ et $\sqrt{81}=9$, donc $x_{1}=\dfrac{-1-9}{2}=-5$ et $x_{2}=\dfrac{-1+9}{2}=4$. Comme $a>0$, le trinôme est négatif entre les racines. 
    $$\boxed{\mathcal{S}=[-5\,;4]}$$

    **4.** $\Delta = 1-4 = -3 < 0$ et $a>0$ : le trinôme est strictement positif, jamais négatif. 
    $$\boxed{\mathcal{S}=\varnothing}$$

    **5.** $\Delta = 324-324 = 0$, racine double $-3$, et $a=3>0$ : le trinôme est positif, et nul uniquement en $-3$. 
    $$\boxed{\mathcal{S}=\;]-\infty\,;-3[\;\cup\;]-3\,;+\infty[}$$

    **6.** On a $-x^{2}-9 = -\big(x^{2}+9\big)$, qui est strictement négatif pour tout réel $x$. 
    $$\boxed{\mathcal{S}=\varnothing}$$

    **7.** Le produit $x(x-2)$ a pour racines $0$ et $2$, avec $a=1>0$ : il est négatif entre les racines. 
    $$\boxed{\mathcal{S}=\;]0\,;2[}$$

    **8.** $\Delta = 49-48 = 1 > 0$ et $\sqrt{1}=1$, donc $x_{1}=\dfrac{-7-1}{2}=-4$ et $x_{2}=\dfrac{-7+1}{2}=-3$. Comme $a>0$ : 
    $$\boxed{\mathcal{S}=\;]-\infty\,;-4]\;\cup\;[-3\,;+\infty[}$$

    **9.** $\Delta = 1+32 = 33 > 0$. Ici $a=-2$ et $b=-1$, donc $2a=-4$ : 
    $$x_{1}=\frac{1-\sqrt{33}}{-4}=\frac{\sqrt{33}-1}{4} \approx 1{,}19 \qquad\text{et}\qquad x_{2}=\frac{1+\sqrt{33}}{-4}=-\frac{1+\sqrt{33}}{4} \approx -1{,}69$$
     Ici $x_{2}<x_{1}$, car $a<0$. Comme $a=-2<0$, le trinôme est positif entre les racines : 
    $$\boxed{\mathcal{S}=\;\left]-\frac{1+\sqrt{33}}{4}\,;\frac{\sqrt{33}-1}{4}\right[}$$

    **10.** $\Delta = 576-576 = 0$, racine double $6$, et $a=2>0$ : le trinôme est positif, nul seulement en $6$. L'inégalité large n'est donc vérifiée qu'en ce point. 
    $$\boxed{\mathcal{S}=\{6\}}$$

    **11.** $\Delta = 16+48 = 64 > 0$ et $\sqrt{64}=8$, donc $x_{1}=\dfrac{-4-8}{2}=-6$ et $x_{2}=\dfrac{-4+8}{2}=2$. Comme $a>0$ : 
    $$\boxed{\mathcal{S}=\;]-6\,;2[}$$

    **12.** $\Delta = 25-28 = -3 < 0$ et $a>0$ : le trinôme est strictement positif sur $\mathbb{R}$. 
    $$\boxed{\mathcal{S}=\mathbb{R}}$$

    *Piège des questions 5 et 10 :* le cas $\Delta=0$ demande de l'attention. En **5.** l'inégalité est stricte, donc la racine est *exclue* ; en **10.** elle est large, donc la racine est la *seule* solution.
- id: "p-01-21"
  feuille: "f-p-01"
  numero: 21
  partie: "Signe d'un trinôme et inéquations"
  etoiles: 1
  types: [Lecture graphique, Calcul]
  mots_cles: [équation du second degré, signe et inéquations]
  noeuds: [c-racine-reelle]
  notions: []
  page_enonce: 6
  page_corrige: 16
  enonce: |
    On reprend le graphique de l'exercice 7, sur lequel sont tracées les courbes des fonctions $f$, $g$ et $h$.

    **1.** Résoudre graphiquement chacune des inéquations suivantes.

    **(a)** $f(x)>0$

    **(b)** $h(x) \leqslant 0$

    **(c)** $g(x)<0$

    **2.** Retrouver ces trois résultats par le calcul, à l'aide d'un tableau de signes.

    **3.** Déterminer graphiquement le nombre de solutions de l'équation $h(x)=-2$, puis de $h(x)=-3$.
  corrige: |
    **1.** On lit sur le graphique les portions de courbe situées au-dessus ou au-dessous de l'axe des abscisses.

    **(a)** La courbe $\mathcal{C}_{f}$ est au-dessus de l'axe entre ses deux racines $-2$ et $0$ : 
    $$\boxed{f(x)>0 \iff x \in \;]-2\,;0[}$$

    **(b)** La courbe $\mathcal{C}_{h}$ est au-dessous de l'axe entre ses deux racines $-6$ et $-2$, et le touche en ces deux points : 
    $$\boxed{h(x)\leqslant 0 \iff x \in [-6\,;-2]}$$

    **(c)** La courbe $\mathcal{C}_{g}$ est entièrement au-dessus de l'axe : 
    $$\boxed{g(x)<0 \iff \mathcal{S}=\varnothing}$$

    **2.** On reprend les expressions obtenues à l'exercice 7.

    Pour $f(x)=-x^{2}-2x = -x(x+2)$, les racines sont $-2$ et $0$, et $a=-1<0$ :

    ![Figure](documents/figures/4edf7a1fe9f5a50a.svg)

    On retrouve bien $f(x)>0$ sur $]-2\,;0[$.

    Pour $h(x)=\dfrac{1}{2}x^{2}+4x+6$, on a $\Delta = 16-12 = 4 > 0$ et $\sqrt{4}=2$. Comme $2a=1$ : 
    $$x_{1}=\frac{-4-2}{1}=-6 \qquad\text{et}\qquad x_{2}=\frac{-4+2}{1}=-2$$
     Avec $a=\dfrac{1}{2}>0$, on obtient :

    ![Figure](documents/figures/45eae76a654a16b4.svg)

    On retrouve bien $h(x)\leqslant 0$ sur $[-6\,;-2]$.

    Pour $g(x)=x^{2}-2x+2$, on a $\Delta = -4 < 0$ et $a=1>0$ : $g$ est strictement positive sur $\mathbb{R}$, donc l'inéquation $g(x)<0$ n'a aucune solution.

    **3.** La valeur $-2$ est l'ordonnée du sommet de $\mathcal{C}_{h}$, c'est-à-dire le minimum de $h$ : la droite d'équation $y=-2$ touche la courbe en un seul point. La valeur $-3$ est strictement inférieure à ce minimum : la droite d'équation $y=-3$ ne rencontre pas la courbe. 
    $$\boxed{h(x)=-2 \text{ admet une unique solution ; } h(x)=-3 \text{ n'en admet aucune.}}$$
