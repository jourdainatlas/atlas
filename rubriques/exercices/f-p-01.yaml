  page_enonce: 6
  page_corrige: 16
  enonce: |
    Résoudre les inéquations suivantes sur $\mathbb{R}$.

    **1.** $\dfrac{2x^{2}+5x+3}{x^{2}+x-2}>0$

    **2.** $(2x-1)^{2}>(x+1)^{2}$

    **3.** $(x+3)(x-1)<2x+6$

    **4.** $\dfrac{x+3}{1-x} \geqslant -5x+3$
  corrige: |
    **1.** Le numérateur $2x^{2}+5x+3$ a pour discriminant $25-24=1>0$, avec $\sqrt{1}=1$ et $2a=4$ : 
    $$x_{1}=\frac{-5-1}{4}=-\frac{3}{2} \qquad\text{et}\qquad x_{2}=\frac{-5+1}{4}=-1$$
     Le dénominateur $x^{2}+x-2$ a pour discriminant $1+8=9>0$, avec $\sqrt{9}=3$ et $2a=2$ : 
    $$x_{1}=\frac{-1-3}{2}=-2 \qquad\text{et}\qquad x_{2}=\frac{-1+3}{2}=1$$
     Ces deux dernières valeurs annulent le dénominateur : le quotient n'y est pas défini.

    ![Figure](documents/figures/1bc10b188707609d.svg)

    $$\boxed{\mathcal{S}=\;]-\infty\,;-2[\;\cup\;\left]-\frac{3}{2}\,;-1\right[\;\cup\;]1\,;+\infty[}$$

    **2.** On ramène tout dans le membre de gauche et on reconnaît une différence de deux carrés : 
    $$\begin{aligned} (2x-1)^{2}>(x+1)^{2} &\iff (2x-1)^{2}-(x+1)^{2}>0\\ &\iff \big[(2x-1)-(x+1)\big]\big[(2x-1)+(x+1)\big]>0\\ &\iff (x-2)\times 3x>0 \end{aligned}$$
     Le trinôme $3x(x-2)$ a pour racines $0$ et $2$, avec un coefficient dominant $3>0$ : il est positif à l'extérieur des racines. 
    $$\boxed{\mathcal{S}=\;]-\infty\,;0[\;\cup\;]2\,;+\infty[}$$

    **3.** On développe et on regroupe : 
    $$(x+3)(x-1)<2x+6 \iff x^{2}+2x-3<2x+6 \iff x^{2}<9 \iff x^{2}-9<0$$
     Le trinôme $x^{2}-9$ a pour racines $-3$ et $3$, avec $a>0$ : il est négatif entre les racines. 
    $$\boxed{\mathcal{S}=\;]-3\,;3[}$$

    **4.** L'expression n'est définie que pour $x \neq 1$. On ramène tout dans le membre de gauche : 
    $$\frac{x+3}{1-x}\geqslant -5x+3 \iff \frac{x+3}{1-x}+5x-3 \geqslant 0 \iff \frac{(x+3)+(5x-3)(1-x)}{1-x} \geqslant 0$$
     On développe le numérateur : 
    $$(x+3)+(5x-3)(1-x) = x+3+5x-5x^{2}-3+3x = -5x^{2}+9x = x(9-5x)$$
     Le numérateur a pour racines $0$ et $\dfrac{9}{5}$, avec un coefficient dominant $-5<0$ : il est positif entre les racines. Le dénominateur $1-x$ est positif pour $x<1$.

    ![Figure](documents/figures/9e71ddf3c036a130.svg)

    $$\boxed{\mathcal{S}=[0\,;1[\;\cup\;\left[\frac{9}{5}\,;+\infty\right[}$$

    *Piège :* on ne multiplie jamais les deux membres d'une inéquation par $1-x$, dont le signe est inconnu. On ramène tout d'un même côté, puis on étudie le signe du quotient.
- id: "p-01-23"
  feuille: "f-p-01"
  numero: 23
  partie: "Problèmes du second degré"
  etoiles: 1
