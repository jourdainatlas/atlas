  page_corrige: 19
  enonce: |
    Soit $z=\dfrac{-4}{1+i\sqrt{3}}$. Calculer $z^{3}$.
  corrige: |
    On commence par écrire $z$ sous forme algébrique : 
    $$z=\frac{-4(1-i\sqrt{3})}{(1+i\sqrt{3})(1-i\sqrt{3})}=\frac{-4+4i\sqrt{3}}{1+3}=-1+i\sqrt{3}$$
     Puis $z^{2}=1-2i\sqrt{3}+3i^{2}=-2-2i\sqrt{3}$, et : 
    $$z^{3}=z\times z^{2}=(-1+i\sqrt{3})(-2-2i\sqrt{3})=2+2i\sqrt{3}-2i\sqrt{3}-6i^{2} \qquad\text{d'où}\qquad \boxed{z^{3}=8}$$
     Ainsi $z$ est une solution non réelle de $z^{3}=8$, tout comme $j$ était une solution non réelle de $z^{3}=1$ dans l'exercice 20 ; on a d'ailleurs $z=2j$.
