  enonce: |
    Résoudre dans $\mathbb{C}$ l'équation $z^{8}-z^{4}+1=0$.
  corrige: |
    On pose $Z=z^{4}$ : l'équation devient $Z^{2}-Z+1=0$, de discriminant $-3$, d'où $Z=\dfrac{1\pm i\sqrt{3}}{2}$. Il reste à résoudre $z^{4}=Z$, en extrayant deux fois une racine carrée (exercice 23).

    • Les racines carrées de $\dfrac{1+i\sqrt{3}}{2}$ sont $\pm\dfrac{\sqrt{3}+i}{2}$, et celles de $\dfrac{1-i\sqrt{3}}{2}$ sont $\pm\dfrac{\sqrt{3}-i}{2}$ : on le vérifie en élevant au carré, $\left(\frac{\sqrt{3}+i}{2}\right)^{2}=\frac{3+2i\sqrt{3}-1}{4}=\frac{1+i\sqrt{3}}{2}$.

    • On cherche les racines carrées $x+iy$ de $\dfrac{\sqrt{3}+i}{2}$ : $x^{2}-y^{2}=\frac{\sqrt{3}}{2}$ et $xy=\frac{1}{4}$, d'où $x^{4}-\frac{\sqrt{3}}{2}x^{2}-\frac{1}{16}=0$, puis $x^{2}=\dfrac{2+\sqrt{3}}{4}$ et $y^{2}=\dfrac{2-\sqrt{3}}{4}$. On remarque que $\left(\frac{\sqrt{6}+\sqrt{2}}{4}\right)^{2}=\frac{8+2\sqrt{12}}{16}=\frac{2+\sqrt{3}}{4}$. En posant 
    $$a=\frac{\sqrt{6}+\sqrt{2}}{4} \qquad\text{et}\qquad b=\frac{\sqrt{6}-\sqrt{2}}{4},$$
     les racines carrées de $\frac{\sqrt{3}+i}{2}$ sont $\pm(a+ib)$. De même, celles de $\frac{\sqrt{3}-i}{2}$ sont $\pm(a-ib)$, celles de $-\frac{\sqrt{3}+i}{2}$ sont $\pm(b-ia)$ et celles de $-\frac{\sqrt{3}-i}{2}$ sont $\pm(b+ia)$.

    L'équation admet donc huit solutions : 
    $$\boxed{\mathcal{S}=\left\{\pm(a+ib)\;;\;\pm(a-ib)\;;\;\pm(b+ia)\;;\;\pm(b-ia)\right\}}$$
     Le poly classe cet exercice en difficulté $2$ car il s'appuie sur la forme trigonométrique ; par la seule voie algébrique, il est nettement plus long, d'où les trois étoiles. On reconnaîtra plus tard $a=\cos\frac{\pi}{12}$ et $b=\sin\frac{\pi}{12}$.
