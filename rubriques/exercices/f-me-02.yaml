  enonce: |
    Résoudre dans $\mathbb{C}$ l'équation $z^{3}-6z-40=0$. En déduire que 
    $$\sqrt[3]{20+14\sqrt{2}}+\sqrt[3]{20-14\sqrt{2}}=4.$$
  corrige: |
    On a $4^{3}-6\times 4-40=64-24-40=0$ : $4$ est racine évidente. Par identification, $z^{3}-6z-40=(z-4)(z^{2}+4z+10)$, et le trinôme a pour discriminant $16-40=-24<0$, d'où les racines $\frac{-4\pm 2i\sqrt{6}}{2}$ : 
    $$\boxed{\mathcal{S}=\{4\;;\;-2-i\sqrt{6}\;;\;-2+i\sqrt{6}\}}$$
     Notons $u=\sqrt[3]{20+14\sqrt{2}}$ et $v=\sqrt[3]{20-14\sqrt{2}}$ les racines cubiques réelles de ces deux nombres, c'est-à-dire les uniques réels dont les cubes valent $20+14\sqrt{2}$ et $20-14\sqrt{2}$. On a : 
    $$u^{3}+v^{3}=40 \qquad\text{et}\qquad (uv)^{3}=(20+14\sqrt{2})(20-14\sqrt{2})=400-392=8, \text{ donc } uv=2.$$
     Comme dans l'exercice 27, $s=u+v$ vérifie $s^{3}=u^{3}+v^{3}+3uv\,s=40+6s$, donc $s$ est solution de $z^{3}-6z-40=0$. Or $s$ est réel, et la seule solution réelle de cette équation est $4$ : ainsi $\boxed{\sqrt[3]{20+14\sqrt{2}}+\sqrt[3]{20-14\sqrt{2}}=4}$.

    *Vérification :* $(2+\sqrt{2})^{3}=8+12\sqrt{2}+12+2\sqrt{2}=20+14\sqrt{2}$, donc $u=2+\sqrt{2}$, $v=2-\sqrt{2}$, et $u+v=4$.
- id: "me-02-37"
  feuille: "f-me-02"
  numero: 37
  titre: "Caractérisation de la conjugaison"
  partie: "Pour aller plus loin"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [réel ou imaginaire pur, conjugaison]
  noeuds: [c-calcul, c-automorphismes]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 339"
  page_enonce: 6
  page_corrige: 23
  enonce: |
    Dans les questions a), b), c), $f$ est une application de $\mathbb{R}$ dans $\mathbb{R}$ telle que $f(1)=1$ et que 
    $$\forall (x,y)\in\mathbb{R}^{2}, \qquad f(x+y)=f(x)+f(y), \qquad f(xy)=f(x)\,f(y).$$

    **a)** Montrer que $\forall x\in\mathbb{Q}$, $f(x)=x$.

    **b)** Soient $x$ et $y$ deux nombres réels tels que $y\geqslant x$. En utilisant le nombre réel $\sqrt{y-x}$, montrer que $f(y)-f(x)\geqslant 0$. Ainsi, $f$ est croissante.

    **c)** Déduire de a) et b) que $\forall x\in\mathbb{R}$, $f(x)=x$.

    Dans les questions suivantes, $g$ est une application de $\mathbb{C}$ dans $\mathbb{C}$ telle que $g(1)=1$ et que 
    $$\forall (u,v)\in\mathbb{C}^{2}, \qquad g(u+v)=g(u)+g(v), \qquad g(uv)=g(u)\,g(v).$$

    **d)** Montrer que $g(i)\in\{-i,i\}$.

    **e)** On suppose que $g(\mathbb{R})\subset\mathbb{R}$. Montrer que $g$ est l'identité de $\mathbb{C}$ ou la conjugaison complexe.
  corrige: |
    **a)** On a $f(0)=f(0+0)=2f(0)$, donc $f(0)=0$. Par récurrence, $f(n+1)=f(n)+f(1)=f(n)+1$, donc $f(n)=n$ pour tout $n\in\mathbb{N}$. Puis $f(n)+f(-n)=f(0)=0$, donc $f(-n)=-n$. Pour $q\in\mathbb{Z}^{*}$, $f(q)\,f\!\left(\frac{1}{q}\right)=f(1)=1$, donc $f\!\left(\frac{1}{q}\right)=\frac{1}{q}$. Enfin, pour $p\in\mathbb{Z}$ et $q\in\mathbb{Z}^{*}$, $f\!\left(\frac{p}{q}\right)=f(p)\,f\!\left(\frac{1}{q}\right)=\frac{p}{q}$. Ainsi $\boxed{f(x)=x \text{ pour tout } x\in\mathbb{Q}}$.

    **b)** Par additivité, $f(y)=f(x)+f(y-x)$. Or $y-x=\left(\sqrt{y-x}\right)^{2}$, donc $f(y-x)=f\!\left(\sqrt{y-x}\right)^{2}\geqslant 0$. Ainsi $\boxed{f(y)-f(x)\geqslant 0}$.

    **c)** Soit $x\in\mathbb{R}$. Supposons $f(x)<x$. Entre deux réels distincts, il existe toujours un rationnel (par exemple une valeur approchée décimale suffisamment précise) : soit $r\in\mathbb{Q}$ tel que $f(x)<r<x$. Comme $f$ est croissante et $r<x$, on a $r=f(r)\leqslant f(x)$, ce qui contredit $f(x)<r$. On exclut de même $f(x)>x$. Ainsi $\boxed{f(x)=x \text{ pour tout } x\in\mathbb{R}}$.

    **d)** Comme en a), $g(0)=0$ et $g(-1)=-g(1)=-1$. Ainsi $g(i)^{2}=g(i^{2})=g(-1)=-1$, et les seuls complexes de carré $-1$ sont $i$ et $-i$ (si $z^{2}=-1$, alors $(z-i)(z+i)=z^{2}+1=0$). Donc $\boxed{g(i)\in\{-i\;;\;i\}}$.

    **e)** Si $g(\mathbb{R})\subset\mathbb{R}$, la restriction de $g$ à $\mathbb{R}$ vérifie les hypothèses des questions a) à c), donc $g(x)=x$ pour tout réel $x$. Pour $z=a+ib$ avec $a$ et $b$ réels : $g(z)=g(a)+g(i)\,g(b)=a+g(i)\,b$. Si $g(i)=i$, alors $g(z)=z$ ; si $g(i)=-i$, alors $g(z)=\overline{z}$. Ainsi $\boxed{g \text{ est l'identité ou la conjugaison}}$.

    La conjugaison est donc, avec l'identité, la seule application de $\mathbb{C}$ dans $\mathbb{C}$ qui respecte l'addition et la multiplication et laisse fixes les réels : c'est ce qui explique qu'elle intervienne partout, et en particulier qu'elle échange les racines des polynômes à coefficients réels (exercice 32).

