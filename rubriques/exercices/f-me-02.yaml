  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 434"
  page_enonce: 6
  page_corrige: 22
  enonce: |
    Pour $\lambda$ dans $\mathbb{R}$, soit $E_{\lambda}$ l'équation d'inconnue complexe $z$ : 
    $$z^{2}-2\lambda z+1=0.$$
     Décrire l'ensemble des racines des équations $E_{\lambda}$ lorsque $\lambda$ parcourt $\mathbb{R}$.
  corrige: |
    Le discriminant de $E_{\lambda}$ vaut $\Delta=4\lambda^{2}-4=4(\lambda^{2}-1)$.

    • Si $-1<\lambda<1$, alors $\Delta<0$ et les racines sont $z=\lambda\pm i\sqrt{1-\lambda^{2}}$. En écrivant $z=x+iy$, on a $x=\lambda$ et $y^{2}=1-\lambda^{2}$, donc $x^{2}+y^{2}=1$ avec $y\neq 0$. Réciproquement, tout complexe $z=x+iy$ tel que $x^{2}+y^{2}=1$ et $y\neq 0$ est obtenu pour $\lambda=x$. On obtient ainsi tous les complexes non réels tels que $z\overline{z}=1$.

    • Si $\lambda=\pm 1$, la racine double est $\lambda$, donc $1$ ou $-1$.

    • Si $|\lambda|>1$, les deux racines sont réelles, de produit $1$ et de somme $2\lambda$ : ce sont deux réels $r$ et $\frac{1}{r}$, avec $\lambda=\frac{1}{2}\left(r+\frac{1}{r}\right)$. Réciproquement, pour tout réel $r$ non nul, $\lambda=\frac{1}{2}\left(r+\frac{1}{r}\right)$ convient, et $r$ est racine de $E_{\lambda}$.

    Finalement, l'ensemble des racines est : 
    $$\boxed{\mathbb{R}^{*}\cup\left\{z\in\mathbb{C}\;;\;z\overline{z}=1\right\}}$$
     C'est exactement l'ensemble trouvé dans l'exercice 31, ce qui n'est pas un hasard : pour $z\neq 0$, $z$ est racine de $E_{\lambda}$ si et seulement si $z+\frac{1}{z}=2\lambda$. Le chapitre de géométrie permettra de reconnaître dans $\{z\;;\;z\overline{z}=1\}$ le cercle de centre $O$ et de rayon $1$.
