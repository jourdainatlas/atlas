  page_enonce: 5
  page_corrige: 20
  enonce: |
    **a)** Quels sont les nombres complexes dont le carré est un nombre réel ?

    **b)** Quels sont les nombres complexes dont le carré est un nombre imaginaire pur ?
  corrige: |
    Soit $z=x+iy$ avec $x$ et $y$ réels. On a $z^{2}=(x^{2}-y^{2})+2ixy$.

    **a)** Le nombre $z^{2}$ est réel si et seulement si $xy=0$, c'est-à-dire $x=0$ ou $y=0$ : 
    $$\boxed{z^{2}\in\mathbb{R} \iff z \text{ est réel ou imaginaire pur}}$$

    **b)** Le nombre $z^{2}$ est imaginaire pur si et seulement si $x^{2}-y^{2}=(x-y)(x+y)=0$ : 
    $$\boxed{z^{2} \text{ imaginaire pur} \iff y=x \text{ ou } y=-x}$$
     c'est-à-dire $z=x(1+i)$ ou $z=x(1-i)$ avec $x$ réel.
- id: "me-02-31"
  feuille: "f-me-02"
  numero: 31
  partie: "Pour aller plus loin"
  etoiles: 3
  types: [Calcul]
  mots_cles: [réel ou imaginaire pur]
  noeuds: [c-calcul]
  notions: []
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 336"
  page_enonce: 5
  page_corrige: 20
  enonce: |
    Trouver les nombres complexes non nuls $z$ tels que $Z=z+\dfrac{1}{z}$ soit réel. Idem en remplaçant « réel » par « imaginaire pur ».
  corrige: |
    Soit $z=x+iy$ non nul, avec $x$ et $y$ réels. On a $\dfrac{1}{z}=\dfrac{\overline{z}}{z\overline{z}}=\dfrac{x-iy}{x^{2}+y^{2}}$, donc : 
    $$Z=x\left(1+\frac{1}{x^{2}+y^{2}}\right)+iy\left(1-\frac{1}{x^{2}+y^{2}}\right)$$

    • Le nombre $Z$ est réel si et seulement si $y=0$ ou $x^{2}+y^{2}=1$. Ainsi $\boxed{Z\in\mathbb{R} \iff z\in\mathbb{R}^{*} \text{ ou } z\overline{z}=1}$.

    • Comme $1+\dfrac{1}{x^{2}+y^{2}}>0$, le nombre $Z$ est imaginaire pur si et seulement si $x=0$ : 
    $$\boxed{Z \text{ imaginaire pur} \iff z \text{ est un imaginaire pur non nul}}$$

    On peut aussi raisonner sans forme algébrique : $Z$ est réel si et seulement si $Z=\overline{Z}$, c'est-à-dire $z-\overline{z}=\dfrac{z-\overline{z}}{z\overline{z}}$, soit $(z-\overline{z})(z\overline{z}-1)=0$. On retrouve le même ensemble dans l'exercice 35.
- id: "me-02-32"
  feuille: "f-me-02"
  numero: 32
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [conjugué, réel ou imaginaire pur, équations dans ℂ, polynômes]
  noeuds: [c-calcul, c-construction, z-polynomes, c-dalembert]
  notions: [ensemble-complexes, anneau-polynomes]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 424 et 426"
  page_enonce: 5
  page_corrige: 20
  enonce: |
    **1.** Soient $P$ une fonction polynomiale à coefficients réels, $z$ dans $\mathbb{C}$ une racine de $P$. Montrer que $\overline{z}$ est racine de $P$.

    **2.** **a)** Vérifier que $4$ est racine de l'équation $x^{3}-15x-4=0$ puis résoudre cette équation dans $\mathbb{C}$.

    **b)** Résoudre dans $\mathbb{C}$ l'équation suivante, après en avoir déterminé une « racine évidente » : $x^{3}-6x^{2}+11x-6=0$.
  corrige: |
    **1.** Écrivons $P(x)=\displaystyle\sum_{k=0}^{n}a_{k}x^{k}$ avec des $a_{k}$ réels, donc égaux à leurs conjugués. D'après la Proposition 5 : 
    $$P(\overline{z})=\sum_{k=0}^{n}a_{k}\overline{z}^{k}=\sum_{k=0}^{n}\overline{a_{k}z^{k}}=\overline{\sum_{k=0}^{n}a_{k}z^{k}}=\overline{P(z)}=\overline{0}=0$$
     Ainsi $\boxed{\overline{z} \text{ est racine de } P}$. C'est le raisonnement de l'exercice 19 dans le cas général.

    **2.** **a)** On a $4^{3}-15\times 4-4=64-60-4=0$. On factorise par $(x-4)$ comme dans le cours : $x^{3}-15x-4=(x-4)(x^{2}+4x+1)$. Le trinôme $x^{2}+4x+1$ a pour discriminant $12>0$ et pour racines $-2\pm\sqrt{3}$. Ainsi : 
    $$\boxed{\mathcal{S}=\{4\;;\;-2-\sqrt{3}\;;\;-2+\sqrt{3}\}}$$
     Les trois solutions de l'équation de Bombelli (exercice 27) sont réelles, et pourtant la formule de Cardan passe par les complexes : c'est ce paradoxe qui a imposé les nombres complexes aux mathématiciens.

    **b)** On a $1-6+11-6=0$, donc $1$ est racine évidente, et $x^{3}-6x^{2}+11x-6=(x-1)(x^{2}-5x+6)$. Le trinôme a pour racines $2$ et $3$, d'où : 
    $$\boxed{\mathcal{S}=\{1\;;\;2\;;\;3\}}$$
- id: "me-02-33"
  feuille: "f-me-02"
  numero: 33
  partie: "Pour aller plus loin"
  etoiles: 2
  types: [Calcul]
  mots_cles: [forme algébrique, équations dans ℂ, équation du second degré, racines carrées complexes]
  noeuds: [c-calcul, c-construction, c-racines-carrees]
  notions: [nombre-complexe, ensemble-complexes]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 430 et 432"
  page_enonce: 6
  page_corrige: 21
  enonce: |
    **1.** Déterminer sous forme algébrique les racines carrées de $3+4i$, $3-3i$, $5-2i$ dans $\mathbb{C}$.

    **2.** Résoudre dans $\mathbb{C}$ les équations : 
    $$z^{2}-2iz+i=0, \qquad z^{2}+iz-1=0, \qquad (1+2i)z^{2}+3iz-(4+i)=0.$$
  corrige: |
    **1.** On applique la méthode de l'exercice 23.

    • Les racines carrées de $3+4i$ sont $\boxed{\pm(2+i)}$ (exercice 23).

    • Pour $3-3i$ : $x^{2}-y^{2}=3$ et $xy=-\frac{3}{2}$, d'où $x^{4}-3x^{2}-\frac{9}{4}=0$. La solution positive est $x^{2}=\dfrac{3+3\sqrt{2}}{2}$, puis $y^{2}=x^{2}-3=\dfrac{3\sqrt{2}-3}{2}$. Comme $xy<0$ : 
    $$\boxed{\pm\left(\sqrt{\frac{3+3\sqrt{2}}{2}}-i\sqrt{\frac{3\sqrt{2}-3}{2}}\right)}$$

    • Pour $5-2i$ : $x^{2}-y^{2}=5$ et $xy=-1$, d'où $x^{4}-5x^{2}-1=0$, puis $x^{2}=\dfrac{5+\sqrt{29}}{2}$ et $y^{2}=\dfrac{\sqrt{29}-5}{2}$. Comme $xy<0$ : 
    $$\boxed{\pm\left(\sqrt{\frac{5+\sqrt{29}}{2}}-i\sqrt{\frac{\sqrt{29}-5}{2}}\right)}$$

    *Vérification numérique :* $\left(\sqrt{\frac{5+\sqrt{29}}{2}}-i\sqrt{\frac{\sqrt{29}-5}{2}}\right)^{2}\approx(2{,}2787-0{,}4388i)^{2}\approx 5{,}000-2{,}000i$.

    **2.** On applique la méthode de l'exercice 24.

    • Pour $z^{2}-2iz+i=0$ : $\Delta=(2i)^{2}-4i=-4-4i$. Une racine carrée $\delta=x+iy$ vérifie $x^{2}-y^{2}=-4$ et $xy=-2$, d'où $x^{2}=-2+2\sqrt{2}$ et $y^{2}=2+2\sqrt{2}$, avec $xy<0$. Après simplification ($\frac{1}{2}\sqrt{2\sqrt{2}-2}=\sqrt{\frac{\sqrt{2}-1}{2}}$) : 
    $$\boxed{\mathcal{S}=\left\{\sqrt{\tfrac{\sqrt{2}-1}{2}}+i\left(1-\sqrt{\tfrac{\sqrt{2}+1}{2}}\right)\;;\;-\sqrt{\tfrac{\sqrt{2}-1}{2}}+i\left(1+\sqrt{\tfrac{\sqrt{2}+1}{2}}\right)\right\}}$$
     soit environ $0{,}455-0{,}099i$ et $-0{,}455+2{,}099i$. On vérifie que leur somme vaut bien $2i$.

    • Pour $z^{2}+iz-1=0$ : $\Delta=i^{2}+4=3$, qui est réel positif, et $\delta=\sqrt{3}$. Ainsi : 
    $$\boxed{\mathcal{S}=\left\{\frac{-\sqrt{3}-i}{2}\;;\;\frac{\sqrt{3}-i}{2}\right\}}$$

    • Pour $(1+2i)z^{2}+3iz-(4+i)=0$ : $\Delta=(3i)^{2}+4(1+2i)(4+i)=-9+4(2+9i)=-1+36i$. Une racine carrée $\delta=x+iy$ vérifie $x^{2}-y^{2}=-1$ et $xy=18$, d'où $x^{2}=\dfrac{\sqrt{1297}-1}{2}$ et $y^{2}=\dfrac{\sqrt{1297}+1}{2}$, avec $xy>0$. On obtient : 
    $$\boxed{z=\frac{(-3i\pm\delta)(1-2i)}{10} \qquad\text{avec}\qquad \delta=\sqrt{\tfrac{\sqrt{1297}-1}{2}}+i\sqrt{\tfrac{\sqrt{1297}+1}{2}}}$$
     soit environ $0{,}679-0{,}707i$ et $-1{,}879+0{,}107i$. Les valeurs ne sont pas « jolies » : l'intérêt de l'exercice est de constater que la méthode fonctionne toujours.
