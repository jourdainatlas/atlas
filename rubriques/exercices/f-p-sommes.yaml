  enonce: |
    Le premier mois, Alice verse $50$ euros sur un compte épargne. Chaque mois suivant, elle verse $10$ euros de plus que le mois précédent.

    **1.** Quel montant verse-t-elle le douzième mois ?

    **2.** Quelle somme totale a-t-elle versée au bout d'un an ?

    **3.** On note $S_n$ le total versé au bout de $n$ mois. Montrer que $S_n=5n^2+45n$.

    **4.** Au bout de combien de mois le total versé dépasse-t-il $3\,000$ euros ?
  corrige: |
    On note $m_{n}$ le versement du $n$-ième mois. La suite $(m_{n})$ est arithmétique de premier terme $m_{1}=50$ et de raison $10$ : $m_{n}=50+10(n-1)=10n+40$.

    **1.** 
    $$m_{12}=50+10\times 11=\boxed{160 \text{ euros}}$$

    **2.** 
    $$m_{1}+m_{2}+\dots+m_{12}=12\times\frac{50+160}{2}=12\times 105=\boxed{1\,260 \text{ euros}}$$

    **3.** 
    $$S_{n}=n\times\frac{m_{1}+m_{n}}{2}=n\times\frac{50+10n+40}{2}=\frac{n(10n+90)}{2} =\boxed{5n^{2}+45n}$$
     Contrôle : $S_{12}=5\times 144+45\times 12=720+540=1\,260$, comme à la question 2.

    **4.** $S_{n}>3\,000\iff 5n^{2}+45n-3\,000>0\iff n^{2}+9n-600>0$. Le discriminant vaut $\Delta=81+2\,400=2\,481$, et la racine positive est $\dfrac{-9+\sqrt{2\,481}}{2}\approx 20{,}4$. 
    $$\boxed{\text{le total dépasse } 3\,000 \text{ euros au bout de } 21 \text{ mois}}$$
     Contrôle : $S_{20}=2\,000+900=2\,900$ et $S_{21}=2\,205+945=3\,150$.
- id: "p-sa-09"
  feuille: "f-p-sommes"
  numero: 9
  partie: "Problèmes"
  etoiles: 2
  types: [Conjecture, Calcul]
  mots_cles: [sommes de termes, somme des premiers entiers]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Pour tout entier $n\geqslant 1$, on appelle $n$-ième *nombre triangulaire* l'entier 
    $$T_n=1+2+3+\dots+n$$

    **1.** Calculer $T_1$, $T_2$, …, $T_6$.

    **2.** Calculer $T_1+T_2$, puis $T_2+T_3$, puis $T_3+T_4$. Que remarque-t-on ?

    **3.** Démontrer la conjecture obtenue à la question précédente.

    **4.** En déduire, sans calculer $T_{99}$ ni $T_{100}$, la valeur de $T_{99}+T_{100}$.
  corrige: |
    **1.** On ajoute à chaque fois l'entier suivant : 
    $$T_{1}=1 \quad ; \quad T_{2}=3 \quad ; \quad T_{3}=6 \quad ; \quad T_{4}=10 \quad ; \quad T_{5}=15 \quad ; \quad T_{6}=21$$

    **2.** $T_{1}+T_{2}=4$, $T_{2}+T_{3}=9$, $T_{3}+T_{4}=16$. On obtient les carrés $2^{2}$, $3^{2}$, $4^{2}$. On conjecture : 
    $$T_{n}+T_{n+1}=(n+1)^{2}$$

    **3.** Pour tout $n\geqslant 1$, d'après la formule du cours : 
    $$T_{n}+T_{n+1}=\frac{n(n+1)}{2}+\frac{(n+1)(n+2)}{2}=\frac{(n+1)\big(n+(n+2)\big)}{2} =\frac{(n+1)(2n+2)}{2}=\boxed{(n+1)^{2}}$$
     en factorisant par $n+1$.

    ![Figure](documents/figures/781f9ed1fb23942a.svg)

    Le carré de $4\times 4=16$ points se découpe le long d'une diagonale en deux triangles : les $6$ points bleus forment le triangle $T_{3}$, les $10$ points orange le triangle $T_{4}$. C'est l'origine du nom « nombres triangulaires ».

    **4.** D'après la question 3 avec $n=99$ : 
    $$T_{99}+T_{100}=100^{2}=\boxed{10\,000}$$
- id: "p-sa-10"
  feuille: "f-p-sommes"
  numero: 10
  partie: "Problèmes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes de termes]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 5
  enonce: |
    On cherche à écrire un entier comme somme d'entiers consécutifs strictement positifs. On a par exemple $9=4+5$ et $9=2+3+4$.

    **1.** Vérifier que $100=18+19+20+21+22$. Trouver une autre écriture de $100$ comme somme d'entiers consécutifs strictement positifs.

    **2.** Soit $a\geqslant 1$ et $p\geqslant 2$ deux entiers. Montrer que la somme des $p$ entiers consécutifs à partir de $a$ vaut 
    $$S=\frac{p\,(2a+p-1)}{2}$$

    **3.** Dans l'expression $p$ et $2a+p-1$, démontrer que l'un des deux facteurs est pair et l'autre impair.

    **4.** En déduire qu'aucune écriture de ce type n'est possible pour $64$.
  corrige: |
    **1.** $18+19+20+21+22=5\times\dfrac{18+22}{2}=5\times 20=100$. Pour une autre écriture, on cherche un nombre pair de termes : la somme de $8$ entiers consécutifs à partir de $9$ convient. 
    $$\boxed{100=9+10+11+12+13+14+15+16}$$
     En effet, $8\times\dfrac{9+16}{2}=4\times 25=100$. La question 2 donne une méthode pour trouver ces écritures : il faut $p(2a+p-1)=200$, et $p=8$ donne $2a+7=25$, soit $a=9$.

    **2.** Les $p$ entiers consécutifs à partir de $a$ sont $a$, $a+1$, …, $a+p-1$. Ils forment une suite arithmétique de raison $1$, et leur somme vaut : 
    $$S=p\times\frac{a+(a+p-1)}{2}=\boxed{\frac{p\,(2a+p-1)}{2}}$$
     On peut aussi écrire $S=p\,a+(0+1+\dots+(p-1))=pa+\dfrac{(p-1)p}{2}$, et l'on retrouve la même expression.

    **3.** La différence des deux facteurs vaut $(2a+p-1)-p=2a-1$, qui est impair. Or deux entiers de même parité ont une différence paire. Les deux facteurs sont donc de parités différentes : 
    $$\boxed{\text{l'un des facteurs } p \text{ et } 2a+p-1 \text{ est pair, l'autre impair}}$$

    **4.** Supposons que $64$ s'écrive ainsi. Alors $p(2a+p-1)=128=2^{7}$. D'après la question 3, l'un des deux facteurs est impair ; or le seul diviseur impair de $2^{7}$ est $1$. Mais $p\geqslant 2$, et $2a+p-1\geqslant 2+2-1=3$ : aucun des deux facteurs ne peut valoir $1$. C'est une contradiction. 
    $$\boxed{64 \text{ ne s'écrit pas comme somme d'au moins deux entiers consécutifs strictement positifs}}$$
     Le même raisonnement s'applique à toutes les puissances de $2$ : $2$, $4$, $8$, $16$, $32$, $64$, … On peut montrer que ce sont les seuls entiers qui n'ont pas d'écriture de ce type.

