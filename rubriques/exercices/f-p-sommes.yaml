  page_enonce: 1
  page_corrige: null
  enonce: |
    Déterminer, dans chaque cas, l'entier $n$ tel que :

    **1.** $1+2+\dots+n=78$

    **2.** $1+2+\dots+n=210$

    **3.** $1+2+\dots+n=1\,540$

    Existe-t-il un entier $n$ tel que $1+2+\dots+n=100$ ? Justifier.
  corrige: |

- id: "p-sa-04"
  feuille: "f-p-sommes"
  numero: 4
  partie: "Sommes de termes d'une suite arithmétique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite arithmétique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: null
  enonce: |
    Soit $(u_n)$ la suite arithmétique de premier terme $u_0=5$ et de raison $r=3$.

    **1.** Exprimer $u_n$ en fonction de $n$, puis calculer $u_{10}$.

    **2.** Calculer $S=u_0+u_1+\dots+u_{10}$, puis vérifier le résultat en additionnant les onze termes un à un.
  corrige: |

- id: "p-sa-05"
  feuille: "f-p-sommes"
  numero: 5
  partie: "Sommes de termes d'une suite arithmétique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite arithmétique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: null
  enonce: |
    Calculer la somme des termes de chacune des suites arithmétiques suivantes.

    **1.** $v_1=7$ et raison $-2$ : calculer $v_1+v_2+\dots+v_{20}$.

    **2.** $w_1=100$ et raison $-7$ : calculer $w_1+w_2+\dots+w_{20}$.

    Les deux suites sont décroissantes : l'une des deux sommes est-elle négative ?
  corrige: |

- id: "p-sa-06"
  feuille: "f-p-sommes"
