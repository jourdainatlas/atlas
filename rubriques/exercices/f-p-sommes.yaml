  page_enonce: 1
  page_corrige: null
  enonce: |
    Soit $(u_n)$ une suite arithmétique telle que $u_3=11$ et $u_9=35$.

    **1.** Déterminer la raison $r$, puis le premier terme $u_0$.

    **2.** Exprimer $u_n$ en fonction de $n$.

    **3.** Calculer $u_0+u_1+\dots+u_{19}$.

    **4.** Déterminer le plus petit entier $n$ tel que $u_n>2\,000$.
  corrige: |

- id: "p-sa-07"
  feuille: "f-p-sommes"
  numero: 7
  partie: "Problèmes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [suite arithmétique, sommes de termes]
  noeuds: [ar-suites, n-sommes]
  notions: [suite]
  page_enonce: 2
  page_corrige: null
  enonce: |
    Les gradins d'un amphithéâtre comptent $25$ rangs. Le premier rang compte $18$ places, et chaque rang compte $3$ places de plus que le précédent.

    **1.** Combien de places compte le dernier rang ?

    **2.** Combien l'amphithéâtre compte-t-il de places au total ?

    **3.** À partir de quel rang le nombre *cumulé* de places dépasse-t-il $1\,000$ ?
  corrige: |

- id: "p-sa-08"
  feuille: "f-p-sommes"
  numero: 8
  partie: "Problèmes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes de termes]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: null
  enonce: |
    Le premier mois, Alice verse $50$ euros sur un compte épargne. Chaque mois suivant, elle verse $10$ euros de plus que le mois précédent.

    **1.** Quel montant verse-t-elle le douzième mois ?

    **2.** Quelle somme totale a-t-elle versée au bout d'un an ?

    **3.** On note $S_n$ le total versé au bout de $n$ mois. Montrer que $S_n=5n^2+45n$.

    **4.** Au bout de combien de mois le total versé dépasse-t-il $3\,000$ euros ?
  corrige: |

- id: "p-sa-09"
  feuille: "f-p-sommes"
  numero: 9
  partie: "Problèmes"
  etoiles: 2
  types: [Conjecture, Calcul]
  mots_cles: [sommes de termes, somme des premiers entiers]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: null
  enonce: |
    Pour tout entier $n\geqslant 1$, on appelle $n$-ième *nombre triangulaire* l'entier 
    $$T_n=1+2+3+\dots+n$$

    **1.** Calculer $T_1$, $T_2$, …, $T_6$.

    **2.** Calculer $T_1+T_2$, puis $T_2+T_3$, puis $T_3+T_4$. Que remarque-t-on ?

    **3.** Démontrer la conjecture obtenue à la question précédente.

    **4.** En déduire, sans calculer $T_{99}$ ni $T_{100}$, la valeur de $T_{99}+T_{100}$.
  corrige: |

- id: "p-sa-10"
  feuille: "f-p-sommes"
  numero: 10
  partie: "Problèmes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes de termes]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: null
  enonce: |
    On cherche à écrire un entier comme somme d'entiers consécutifs strictement positifs. On a par exemple $9=4+5$ et $9=2+3+4$.

    **1.** Vérifier que $100=18+19+20+21+22$. Trouver une autre écriture de $100$ comme somme d'entiers consécutifs strictement positifs.

    **2.** Soit $a\geqslant 1$ et $p\geqslant 2$ deux entiers. Montrer que la somme des $p$ entiers consécutifs à partir de $a$ vaut 
    $$S=\frac{p\,(2a+p-1)}{2}$$

    **3.** Dans l'expression $p$ et $2a+p-1$, démontrer que l'un des deux facteurs est pair et l'autre impair.

    **4.** En déduire qu'aucune écriture de ce type n'est possible pour $64$.
  corrige: |


