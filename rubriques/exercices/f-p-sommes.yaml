- id: "p-sa-01"
  feuille: "f-p-sommes"
  numero: 1
  partie: "Calculs de sommes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, somme des premiers entiers]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les sommes suivantes.

    **1.** $1+2+3+\dots+50$

    **2.** $1+2+3+\dots+200$

    **3.** $51+52+53+\dots+100$

    **4.** $2+4+6+\dots+100$

    **5.** $1+3+5+\dots+99$

    Pour la question 3., on remarquera que cette somme s'obtient à partir de deux sommes du type $1+2+\dots+n$.
  corrige: |
    On utilise la formule du cours : pour tout $n\in\mathbb{N}^{*}$, $1+2+\dots+n=\dfrac{n(n+1)}{2}$.

    **1.** 
    $$1+2+3+\dots+50=\frac{50\times 51}{2}=25\times 51=\boxed{1\,275}$$

    **2.** 
    $$1+2+3+\dots+200=\frac{200\times 201}{2}=100\times 201=\boxed{20\,100}$$

    **3.** La somme $51+52+\dots+100$ est la somme des entiers de $1$ à $100$, à laquelle on retire la somme des entiers de $1$ à $50$ : 
    $$51+52+\dots+100=\frac{100\times 101}{2}-\frac{50\times 51}{2}=5\,050-1\,275=\boxed{3\,775}$$
     **L'erreur la plus répandue** est de retirer la somme jusqu'à $51$ : le terme $51$ doit être conservé, on retire donc exactement les termes de $1$ à $50$.

    **4.** Chaque terme est le double d'un entier compris entre $1$ et $50$. On factorise par $2$ : 
    $$2+4+6+\dots+100=2\,(1+2+3+\dots+50)=2\times 1\,275=\boxed{2\,550}$$

    **5.** Les entiers impairs de $1$ à $99$ sont au nombre de $50$, puisque $99=2\times 50-1$. On peut retirer la somme des pairs de la somme de tous les entiers jusqu'à $100$ : 
    $$1+3+5+\dots+99=5\,050-2\,550=\boxed{2\,500}$$
     On peut aussi utiliser la formule « nombre de termes $\times$ moyenne des termes extrêmes » : $50\times\dfrac{1+99}{2}=50\times 50=2\,500$. On remarque que $2\,500=50^{2}$ : l'exercice 2 explique ce résultat.
- id: "p-sa-02"
  feuille: "f-p-sommes"
  numero: 2
  partie: "Calculs de sommes"
  etoiles: 1
  types: [Conjecture, Calcul]
  mots_cles: [sommes de termes]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Calculer les sommes suivantes, écrites avec le symbole $\displaystyle\sum$.

    $$\textbf{1. } \sum_{k=1}^{40} k \qquad\quad \textbf{2. } \sum_{k=0}^{15} 6 \qquad\quad \textbf{3. } \sum_{k=1}^{25} (2k-1) \qquad\quad \textbf{4. } \sum_{k=1}^{30} (3k+2) \qquad\quad \textbf{5. } \sum_{k=10}^{40} k$$

    Que remarque-t-on sur le résultat de la question 3. ? Formuler une conjecture pour $\displaystyle\sum_{k=1}^{n} (2k-1)$.
  corrige: |
    **1.** 
    $$\sum_{k=1}^{40}k=1+2+\dots+40=\frac{40\times 41}{2}=\boxed{820}$$

    **2.** Le terme général ne dépend pas de $k$ : on additionne le nombre $6$ autant de fois qu'il y a de valeurs de $k$ entre $0$ et $15$, c'est-à-dire $16$ fois. 
    $$\sum_{k=0}^{15}6=16\times 6=\boxed{96}$$
     **L'erreur la plus répandue** est de compter $15$ termes : de $0$ à $15$, il y a $15-0+1=16$ valeurs de $k$.

    **3.** On sépare la somme en deux, puis on applique la formule : 
    $$\sum_{k=1}^{25}(2k-1)=2\sum_{k=1}^{25}k-\sum_{k=1}^{25}1=2\times\frac{25\times 26}{2}-25 =650-25=\boxed{625}$$

    **4.** De même : 
    $$\sum_{k=1}^{30}(3k+2)=3\sum_{k=1}^{30}k+\sum_{k=1}^{30}2=3\times\frac{30\times 31}{2}+30\times 2 =1\,395+60=\boxed{1\,455}$$

    **5.** La somme commence à $k=10$ : on retire de la somme des entiers de $1$ à $40$ celle des entiers de $1$ à $9$. 
    $$\sum_{k=10}^{40}k=\frac{40\times 41}{2}-\frac{9\times 10}{2}=820-45=\boxed{775}$$

    On remarque que $625=25^{2}$ : la somme des $25$ premiers entiers impairs est le carré de $25$. Avec le résultat $2\,500=50^{2}$ de l'exercice 1, on peut conjecturer : 
    $$\sum_{k=1}^{n}(2k-1)=n^{2}$$
     Le même calcul qu'à la question 3 le démontre pour tout $n\in\mathbb{N}^{*}$ : 
    $$\sum_{k=1}^{n}(2k-1)=2\times\frac{n(n+1)}{2}-n=n^{2}+n-n=\boxed{n^{2}}$$
