  page_enonce: 2
  page_corrige: 4
  enonce: |
    Les gradins d'un amphithéâtre comptent $25$ rangs. Le premier rang compte $18$ places, et chaque rang compte $3$ places de plus que le précédent.

    **1.** Combien de places compte le dernier rang ?

    **2.** Combien l'amphithéâtre compte-t-il de places au total ?

    **3.** À partir de quel rang le nombre *cumulé* de places dépasse-t-il $1\,000$ ?
  corrige: |
    On note $u_{k}$ le nombre de places du rang $k$, pour $1\leqslant k\leqslant 25$. La suite $(u_{k})$ est arithmétique de premier terme $u_{1}=18$ et de raison $3$ : $u_{k}=18+3(k-1)=3k+15$.

    **1.** 
    $$u_{25}=18+3\times 24=\boxed{90 \text{ places}}$$

    **2.** 
    $$u_{1}+u_{2}+\dots+u_{25}=25\times\frac{18+90}{2}=25\times 54=\boxed{1\,350 \text{ places}}$$

    **3.** Le nombre de places cumulées des $k$ premiers rangs vaut : 
    $$S_{k}=k\times\frac{u_{1}+u_{k}}{2}=k\times\frac{18+3k+15}{2}=\frac{k(3k+33)}{2}$$
     On cherche le plus petit $k$ tel que $S_{k}>1\,000$, c'est-à-dire $3k^{2}+33k-2\,000>0$. Le discriminant vaut $\Delta=33^{2}+4\times 3\times 2\,000=25\,089$, et la racine positive est $\dfrac{-33+\sqrt{25\,089}}{6}\approx 20{,}9$. Le trinôme est positif au-delà de cette racine, donc : 
    $$\boxed{\text{le cumul dépasse } 1\,000 \text{ places à partir du rang } 21}$$
     Contrôle : $S_{20}=\dfrac{20\times 93}{2}=930$ et $S_{21}=\dfrac{21\times 96}{2}=1\,008$.
- id: "p-sa-08"
