  enonce: |
    Déterminer, dans chaque cas, l'entier $n$ tel que :

    **1.** $1+2+\dots+n=78$

    **2.** $1+2+\dots+n=210$

    **3.** $1+2+\dots+n=1\,540$

    Existe-t-il un entier $n$ tel que $1+2+\dots+n=100$ ? Justifier.
  corrige: |
    On cherche $n$ tel que $\dfrac{n(n+1)}{2}=S$, c'est-à-dire $n(n+1)=2S$. On cherche donc deux entiers consécutifs dont le produit vaut $2S$.

    **1.** $n(n+1)=156$. Or $12\times 13=156$, donc $\boxed{n=12}$.

    **2.** $n(n+1)=420$. Or $20\times 21=420$, donc $\boxed{n=20}$.

    **3.** $n(n+1)=3\,080$. Comme $55^{2}=3\,025$, on essaie $55\times 56=3\,080$, donc $\boxed{n=55}$.

    On peut aussi résoudre l'équation du second degré $n^{2}+n-2S=0$. Par exemple, pour $S=78$ : $\Delta=1+624=625=25^{2}$, d'où $n=\dfrac{-1+25}{2}=12$, l'autre racine étant négative.

    Pour $S=100$, il faudrait $n(n+1)=200$. Or $13\times 14=182$ et $14\times 15=210$, et le produit $n(n+1)$ augmente avec $n$ : il passe de $182$ à $210$ sans prendre la valeur $200$. 
    $$\boxed{\text{Il n'existe aucun entier } n \text{ tel que } 1+2+\dots+n=100}$$
     On le confirme avec le discriminant de $n^{2}+n-200=0$ : $\Delta=801$, qui n'est pas le carré d'un entier, puisque $28^{2}=784$ et $29^{2}=841$.
- id: "p-sa-04"
  feuille: "f-p-sommes"
  numero: 4
  partie: "Sommes de termes d'une suite arithmétique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite arithmétique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $(u_n)$ la suite arithmétique de premier terme $u_0=5$ et de raison $r=3$.

    **1.** Exprimer $u_n$ en fonction de $n$, puis calculer $u_{10}$.

    **2.** Calculer $S=u_0+u_1+\dots+u_{10}$, puis vérifier le résultat en additionnant les onze termes un à un.
  corrige: |
    **1.** D'après la formule explicite du cours : 
    $$\boxed{u_{n}=u_{0}+nr=5+3n} \qquad \text{d'où} \qquad u_{10}=5+30=\boxed{35}$$

    **2.** La somme $S$ compte $11$ termes, de $u_{0}$ à $u_{10}$. Avec la formule « nombre de termes $\times$ moyenne des termes extrêmes » : 
    $$S=11\times\frac{u_{0}+u_{10}}{2}=11\times\frac{5+35}{2}=11\times 20=\boxed{220}$$
     On peut aussi faire comme dans le cours, en séparant le premier terme et la raison : 
    $$S=11\times 5+3\,(0+1+\dots+10)=55+3\times\frac{10\times 11}{2}=55+165=220$$
     **Vérification :** $5+8+11+14+17+20+23+26+29+32+35=220$.
- id: "p-sa-05"
  feuille: "f-p-sommes"
  numero: 5
  partie: "Sommes de termes d'une suite arithmétique"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes de termes, suite arithmétique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Calculer la somme des termes de chacune des suites arithmétiques suivantes.

    **1.** $v_1=7$ et raison $-2$ : calculer $v_1+v_2+\dots+v_{20}$.

    **2.** $w_1=100$ et raison $-7$ : calculer $w_1+w_2+\dots+w_{20}$.

    Les deux suites sont décroissantes : l'une des deux sommes est-elle négative ?
  corrige: |
    **1.** La suite commence au rang $1$ : $v_{n}=v_{1}+(n-1)r=7-2(n-1)=9-2n$, donc $v_{20}=9-40=-31$. La somme compte $20$ termes : 
    $$v_{1}+v_{2}+\dots+v_{20}=20\times\frac{v_{1}+v_{20}}{2}=20\times\frac{7-31}{2}=\boxed{-240}$$

    **2.** De même, $w_{n}=100-7(n-1)$, donc $w_{20}=100-133=-33$ : 
    $$w_{1}+w_{2}+\dots+w_{20}=20\times\frac{100-33}{2}=10\times 67=\boxed{670}$$

    La première somme est négative, la seconde est positive. Le signe d'une telle somme dépend du signe de la moyenne $\dfrac{\text{premier terme}+\text{dernier terme}}{2}$ : dans le premier cas les termes deviennent négatifs très tôt ($v_{5}=-1$), et les termes négatifs l'emportent ; dans le second, les termes restent positifs jusqu'à $w_{15}=2$, et les termes positifs l'emportent largement.
- id: "p-sa-06"
  feuille: "f-p-sommes"
  numero: 6
  partie: "Sommes de termes d'une suite arithmétique"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes de termes, suite arithmétique]
  noeuds: [n-sommes, ar-suites]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $(u_n)$ une suite arithmétique telle que $u_3=11$ et $u_9=35$.

    **1.** Déterminer la raison $r$, puis le premier terme $u_0$.

    **2.** Exprimer $u_n$ en fonction de $n$.

    **3.** Calculer $u_0+u_1+\dots+u_{19}$.

    **4.** Déterminer le plus petit entier $n$ tel que $u_n>2\,000$.
  corrige: |
    **1.** D'après la formule $u_{n}=u_{p}+(n-p)r$ avec $n=9$ et $p=3$ : 
    $$u_{9}=u_{3}+6r \iff 35=11+6r \iff 6r=24 \iff \boxed{r=4}$$
     Puis $u_{3}=u_{0}+3r$, d'où $u_{0}=11-12=\boxed{-1}$.

    **2.** 
    $$\boxed{u_{n}=-1+4n}$$
     Contrôle : $u_{3}=-1+12=11$ et $u_{9}=-1+36=35$.

    **3.** La somme compte $20$ termes, de $u_{0}$ à $u_{19}$, et $u_{19}=-1+76=75$ : 
    $$u_{0}+u_{1}+\dots+u_{19}=20\times\frac{-1+75}{2}=10\times 74=\boxed{740}$$

    **4.** 
    $$u_{n}>2\,000 \iff -1+4n>2\,000 \iff 4n>2\,001 \iff n>500{,}25$$
     $n$ étant un entier : $\boxed{n=501}$. Contrôle : $u_{500}=1\,999$ et $u_{501}=2\,003$.
- id: "p-sa-07"
  feuille: "f-p-sommes"
  numero: 7
  partie: "Problèmes"
