  notions: [famille-orthonormee, projection-orthogonale, vecteurs-orthogonaux, produit-scalaire]
  source: "Sorbonne, 3M210, TD 3, exercice 7 (procédé de Gram-Schmidt)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Gram-Schmidt pour une suite, polynômes de Laguerre.**

    **1.** Soit $E$ un espace préhilbertien et $(v_{n})_{n \geq 1}$ une suite libre de $E$. On note $F_{n} = \mathrm{Vect}(v_{1}, \dots, v_{n})$ et $p_{F_{n}}$ la projection orthogonale sur $F_{n}$ (cours, th. 3), avec $F_{0} = \{0\}$. Montrer que les vecteurs 
    $$f_{n} = \frac{v_{n} - p_{F_{n-1}}(v_{n})}{\lVert v_{n} - p_{F_{n-1}}(v_{n}) \rVert} \qquad (n \geq 1)$$
     sont bien définis, forment une suite orthonormée, et vérifient $\mathrm{Vect}(f_{1}, \dots, f_{n}) = F_{n}$ pour tout $n$. Comparer avec le théorème 2 du cours.

    **2.** On munit $\mathbb{R}[X]$ de 
    $$\langle P, Q \rangle = \int_{0}^{+\infty} P(t) Q(t) \, \mathrm{e}^{-t} \, \mathrm{d} t .$$
     Justifier que l'on définit ainsi un produit scalaire. On pourra utiliser $\mathop{\displaystyle \int_{0}^{+\infty}} t^{k} \mathrm{e}^{-t} \, \mathrm{d} t = k!$.

    **3.** Appliquer le procédé de Gram-Schmidt à la famille $(1, X, X^{2})$ pour ce produit scalaire, en choisissant des polynômes de coefficient dominant positif.

    **4.** En déduire la valeur de $\mathop{\displaystyle \inf_{(a, b) \in \mathbb{R}^{2}}} \mathop{\displaystyle \int_{0}^{+\infty}} (t^{2} - a t - b)^{2} \, \mathrm{e}^{-t} \, \mathrm{d} t$.
  corrige: |
    **1.** On raisonne par récurrence sur $n$. Le sous-espace $F_{n-1}$ est de dimension finie, donc la projection orthogonale $p_{F_{n-1}}$ existe (cours, th. 3), et $v_{n} - p_{F_{n-1}}(v_{n})$ est orthogonal à $F_{n-1}$.

    Ce vecteur n'est pas nul : sinon $v_{n} = p_{F_{n-1}}(v_{n})$ appartiendrait à $F_{n-1} = \mathrm{Vect}(v_{1}, \dots, v_{n-1})$, ce que la liberté de la suite interdit. Le vecteur $f_{n}$ est donc bien défini, de norme $1$, et orthogonal à $F_{n-1}$.

    Supposons que $(f_{1}, \dots, f_{n-1})$ soit orthonormée et engendre $F_{n-1}$. Alors $f_{n}$, orthogonal à $F_{n-1}$, l'est à $f_{1}, \dots, f_{n-1}$, et $(f_{1}, \dots, f_{n})$ est orthonormée. De plus $f_{n} \in F_{n}$, d'où $\mathrm{Vect}(f_{1}, \dots, f_{n}) \subset F_{n}$ ; réciproquement, 
    $$v_{n} = \lVert v_{n} - p_{F_{n-1}}(v_{n}) \rVert \, f_{n} + p_{F_{n-1}}(v_{n}) \in \mathrm{Vect}(f_{1}, \dots, f_{n}) ,$$
     puisque $p_{F_{n-1}}(v_{n}) \in F_{n-1} = \mathrm{Vect}(f_{1}, \dots, f_{n-1})$. On a donc $\mathrm{Vect}(f_{1}, \dots, f_{n}) = F_{n}$ pour tout $n$.

    Comme $(f_{1}, \dots, f_{n-1})$ est une base orthonormée de $F_{n-1}$, le théorème 3 du cours donne 
    $$p_{F_{n-1}}(v_{n}) = \sum_{k < n} \langle v_{n}, f_{k} \rangle f_{k} ,$$
     et l'on retrouve exactement les formules du théorème 2. D'ailleurs 
    $$\langle v_{n}, f_{n} \rangle = \langle v_{n} - p_{F_{n-1}}(v_{n}), f_{n} \rangle = \lVert v_{n} - p_{F_{n-1}}(v_{n}) \rVert > 0 ,$$
     et la clause d'unicité du théorème 2 montre que les deux constructions donnent la même famille.

    L'apport de cette version est double : elle s'applique à une suite infinie, puisque chaque étape ne fait intervenir qu'un sous-espace de dimension finie, et elle se lit géométriquement, comme le montre la figure.

    1.5em

    ![Figure](documents/figures/17610a4467055568.svg)

    Le vecteur $v_{n}$ (bleu) se décompose en sa projection sur $F_{n-1}$ (orange) et une « hauteur » orthogonale (rouge) ; $f_{n}$ (vert) est cette hauteur normalisée.

    **2.** Pour $P, Q \in \mathbb{R}[X]$, la fonction $t \mapsto P(t)Q(t)\mathrm{e}^{-t}$ est continue sur $[0, +\infty[$ et négligeable devant $1/t^{2}$ en $+\infty$, donc intégrable : $\langle P, Q \rangle$ est bien défini. La forme est bilinéaire et symétrique, et $\langle P, P \rangle = \mathop{\displaystyle \int_{0}^{+\infty}} P^{2} \mathrm{e}^{-t} \geq 0$.

    Si $\langle P, P \rangle = 0$, la fonction continue positive $P^{2}\mathrm{e}^{-t}$ est nulle sur $[0, +\infty[$, donc $P$ a une infinité de racines et $P = 0$. C'est un produit scalaire. On note $m_{k} = \langle X^{j}, X^{k - j} \rangle = \mathop{\displaystyle \int_{0}^{+\infty}} t^{k} \mathrm{e}^{-t} \, \mathrm{d} t = k!$ ; tous les produits scalaires s'en déduisent.

    **3.** On a $\lVert 1 \rVert^{2} = m_{0} = 1$, donc $e_{0} = 1$.

    Ensuite $\langle X, e_{0} \rangle = m_{1} = 1$, et $X - 1$ a pour norme au carré $m_{2} - 2m_{1} + m_{0} = 2 - 2 + 1 = 1$ : $e_{1} = X - 1$.

    Enfin $\langle X^{2}, e_{0} \rangle = m_{2} = 2$ et $\langle X^{2}, e_{1} \rangle = m_{3} - m_{2} = 4$, d'où 
    $$X^{2} - 2 e_{0} - 4 e_{1} = X^{2} - 4X + 2 ,$$
     puis 
    $$\lVert X^{2} - 4X + 2 \rVert^{2} = m_{4} - 8m_{3} + 20m_{2} - 16m_{1} + 4m_{0} = 24 - 48 + 40 - 16 + 4 = 4 .$$
     On obtient 
    $$\boxed{e_{0} = 1 , \qquad e_{1} = X - 1 , \qquad e_{2} = \frac{X^{2} - 4X + 2}{2} .}$$
     Ce sont, au signe près, les polynômes de Laguerre $L_{0} = 1$, $L_{1} = 1 - X$, $L_{2} = \dfrac{1}{2}(X^{2} - 4X + 2)$, dont la normalisation usuelle impose $L_{k}(0) = 1$ au lieu d'un coefficient dominant positif.

    **4.** La borne inférieure est le carré de la distance de $X^{2}$ au plan $\mathrm{Vect}(1, X) = \mathrm{Vect}(e_{0}, e_{1})$. D'après le théorème 3 du cours, cette distance vaut $\lVert X^{2} - p(X^{2}) \rVert = \lVert X^{2} - 4X + 2 \rVert = 2$, d'où 
    $$\boxed{\inf_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{+\infty} (t^{2} - at - b)^{2} \, \mathrm{e}^{-t} \, \mathrm{d} t = 4 ,}$$
     atteinte uniquement pour $a = 4$ et $b = -2$.
