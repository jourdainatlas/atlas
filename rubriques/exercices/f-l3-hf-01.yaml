  enonce: |
    **Inégalité de Hilbert.**

    **1.** Montrer que, pour tout polynôme $P \in \mathbb{C}[X]$, 
    $$\int_{0}^{1} P(t) \, \frac{\mathrm{d} t}{\sqrt{t}} = -\frac{\mathrm{i}}{2} \int_{0}^{2\pi} P(\mathrm{e}^{\mathrm{i} t}) \, \mathrm{e}^{\mathrm{i} t / 2} \, \mathrm{d} t .$$
     On pourra commencer par le cas $P = X^{n}$.

    **2.** En déduire que, pour tout polynôme $P \in \mathbb{R}[X]$, 
    $$\int_{0}^{1} P(t)^{2} \, \frac{\mathrm{d} t}{\sqrt{t}} \leq \frac{1}{2} \int_{0}^{2\pi} \big|P(\mathrm{e}^{\mathrm{i} t})\big|^{2} \, \mathrm{d} t .$$

    **3.** Soit $n \in \mathbb{N}$ et $(a_{0}, \dots, a_{n}) \in \mathbb{R}^{n+1}$. Montrer que 
    $$0 \leq \sum_{j=0}^{n} \sum_{k=0}^{n} \frac{a_{j} a_{k}}{j + k + 1/2} \leq \pi \sum_{j=0}^{n} a_{j}^{2} .$$
  corrige: |
    **1.** Les deux membres sont linéaires en $P$ ; il suffit donc de vérifier la formule pour $P = X^{n}$, $n \in \mathbb{N}$. À gauche, 
    $$\int_{0}^{1} t^{n} \, \frac{\mathrm{d} t}{\sqrt{t}} = \int_{0}^{1} t^{n - 1/2} \, \mathrm{d} t = \frac{1}{n + 1/2} ,$$
     l'intégrale étant convergente en $0$ puisque $n - 1/2 > -1$. À droite, $P(\mathrm{e}^{\mathrm{i} t}) \mathrm{e}^{\mathrm{i} t/2} = \mathrm{e}^{\mathrm{i} (n + 1/2) t}$ et 
    $$-\frac{\mathrm{i}}{2} \int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} (n + 1/2) t} \, \mathrm{d} t = -\frac{\mathrm{i}}{2} \cdot \frac{\mathrm{e}^{\mathrm{i} (2n + 1)\pi} - 1}{\mathrm{i} (n + 1/2)} = -\frac{1}{2} \cdot \frac{-2}{n + 1/2} = \frac{1}{n + 1/2} ,$$
     car $\mathrm{e}^{\mathrm{i}(2n+1)\pi} = -1$. Les deux membres coïncident.

    **2.** Soit $P \in \mathbb{R}[X]$. On applique la question 1 au polynôme $P^{2}$ : 
    $$\int_{0}^{1} P(t)^{2} \, \frac{\mathrm{d} t}{\sqrt{t}} = -\frac{\mathrm{i}}{2} \int_{0}^{2\pi} P(\mathrm{e}^{\mathrm{i} t})^{2} \, \mathrm{e}^{\mathrm{i} t/2} \, \mathrm{d} t .$$
     Le membre de gauche est un réel positif, donc égal à son module, et l'on majore le module de l'intégrale de droite par l'intégrale du module, avec $|P(\mathrm{e}^{\mathrm{i} t})^{2} \mathrm{e}^{\mathrm{i} t/2}| = |P(\mathrm{e}^{\mathrm{i} t})|^{2}$ : 
    $$\boxed{\int_{0}^{1} P(t)^{2} \, \frac{\mathrm{d} t}{\sqrt{t}} \leq \frac{1}{2} \int_{0}^{2\pi} |P(\mathrm{e}^{\mathrm{i} t})|^{2} \, \mathrm{d} t .}$$

    **3.** Soit $P = \mathop{\displaystyle \sum_{j=0}^{n}} a_{j} X^{j}$. D'une part, en développant le carré, 
    $$\int_{0}^{1} P(t)^{2} \, \frac{\mathrm{d} t}{\sqrt{t}} = \sum_{j, k} a_{j} a_{k} \int_{0}^{1} t^{j + k - 1/2} \, \mathrm{d} t = \sum_{j=0}^{n} \sum_{k=0}^{n} \frac{a_{j} a_{k}}{j + k + 1/2} ,$$
     et cette quantité est positive comme intégrale d'une fonction positive.

    D'autre part, $|P(\mathrm{e}^{\mathrm{i} t})|^{2} = \mathop{\displaystyle \sum_{j, k}} a_{j} a_{k} \mathrm{e}^{\mathrm{i} (j - k) t}$, et $\mathop{\displaystyle \int_{0}^{2\pi}} \mathrm{e}^{\mathrm{i} (j - k) t} \, \mathrm{d} t$ vaut $2\pi$ si $j = k$ et $0$ sinon : c'est l'orthogonalité de la famille $(\mathrm{e}^{\mathrm{i} k t})$ vue dans le cours. Donc $\mathop{\displaystyle \int_{0}^{2\pi}} |P(\mathrm{e}^{\mathrm{i} t})|^{2} \, \mathrm{d} t = 2\pi \mathop{\displaystyle \sum_{j}} a_{j}^{2}$, et la question 2 donne 
    $$\boxed{0 \leq \sum_{j=0}^{n} \sum_{k=0}^{n} \frac{a_{j} a_{k}}{j + k + 1/2} \leq \pi \sum_{j=0}^{n} a_{j}^{2} .}$$

    *Remarque.* Matriciellement, la question 3 dit que la matrice symétrique 
    $$M_{n} = \Big(\frac{1}{j + k + 1/2}\Big)_{0 \leq j, k \leq n}$$
     est positive et que sa plus grande valeur propre est au plus $\pi$, *quel que soit* $n$. La figure ci-dessous montre cette valeur propre, calculée numériquement : elle croît très lentement avec $n$ et reste sous la droite d'ordonnée $\pi$.

    1.5em

    ![Figure](documents/figures/476505fd7db4f923.svg)

    Pour $n = 800$, $\lambda_{\max}(M_{n}) \approx 2{,}895$ : la borne $\pi$ est loin d'être atteinte pour les petites valeurs de $n$, mais l'écart diminue lentement quand $n$ grandit.
