  enonce: |
    On munit $E = \mathcal{C}([0, 1], \mathbb{R})$ du produit scalaire $\langle f, g \rangle = \mathop{\displaystyle \int_{0}^{1}} f(x) g(x) \, \mathrm{d} x$, et l'on note $F$ le sous-espace des fonctions affines $x \mapsto a + b x$, $(a, b) \in \mathbb{R}^{2}$.

    **1.** Justifier que la fonction $u : x \mapsto x^{2}$ admet un unique projeté orthogonal $p$ sur $F$.

    **2.** Écrire les deux équations $\langle u - p, 1 \rangle = 0$ et $\langle u - p, x \mapsto x \rangle = 0$ qui caractérisent $p$, et déterminer $p$.

    **3.** En déduire la valeur de $\mathop{\displaystyle \min_{(a, b) \in \mathbb{R}^{2}}} \mathop{\displaystyle \int_{0}^{1}} (x^{2} - a - b x)^{2} \, \mathrm{d} x$.

    **4.** Construire une base orthonormée $(e_{0}, e_{1})$ de $F$ en appliquant le procédé de Gram-Schmidt à $(1, x \mapsto x)$, et retrouver $p$ par la formule $p = \langle u, e_{0} \rangle e_{0} + \langle u, e_{1} \rangle e_{1}$.
  corrige: |
    **1.** Le sous-espace $F = \mathrm{Vect}(1, x)$ est de dimension finie ; le théorème 3 du cours assure l'existence et l'unicité du projeté orthogonal $p$ de $u$ sur $F$, qui est aussi l'unique point de $F$ le plus proche de $u$.

    **2.** Écrivons $p(x) = a + bx$. Les conditions d'orthogonalité de $u - p$ à $1$ et à $x$ donnent 
    $$\int_{0}^{1} (x^{2} - a - bx) \, \mathrm{d} x = \frac{1}{3} - a - \frac{b}{2} = 0 , \qquad \int_{0}^{1} x (x^{2} - a - bx) \, \mathrm{d} x = \frac{1}{4} - \frac{a}{2} - \frac{b}{3} = 0 .$$
     La résolution de ce système donne $b = 1$ et $a = -\dfrac{1}{6}$ : $p(x) = x - \dfrac{1}{6}$.

    **3.** Le minimum vaut $d(u, F)^{2} = \lVert u - p \rVert^{2}$, soit 
    $$\boxed{\min_{(a, b) \in \mathbb{R}^{2}} \int_{0}^{1} (x^{2} - a - bx)^{2} \, \mathrm{d} x = \int_{0}^{1} \Big(x^{2} - x + \frac{1}{6}\Big)^{2} \mathrm{d} x = \frac{1}{180} .}$$

    **4.** On a $\lVert 1 \rVert = 1$, donc $e_{0} = 1$. Puis $x - \langle x, e_{0} \rangle e_{0} = x - \dfrac{1}{2}$, de norme au carré $\mathop{\displaystyle \int_{0}^{1}} (x - \dfrac{1}{2})^{2} \, \mathrm{d} x = \dfrac{1}{12}$, donc $e_{1} = \sqrt{3}\,(2x - 1)$.

    On calcule $\langle u, e_{0} \rangle = \dfrac{1}{3}$ et $\langle u, e_{1} \rangle = \sqrt{3}\big(\dfrac{2}{4} - \dfrac{1}{3}\big) = \dfrac{\sqrt{3}}{6}$, d'où 
    $$p = \frac{1}{3} + \frac{\sqrt{3}}{6} \cdot \sqrt{3}\,(2x - 1) = \frac{1}{3} + x - \frac{1}{2} = x - \frac{1}{6} ,$$
     ce qui confirme la question 2.

    *Remarque.* La meilleure approximation affine de $x^{2}$ dépend de la norme choisie. Pour la norme $L^{2}$, c'est $x - \dfrac{1}{6}$, et l'écart maximal $\mathop{\displaystyle \sup_{[0, 1]}} |x^{2} - x + \dfrac{1}{6}| = \dfrac{1}{6}$ est atteint aux deux extrémités. Pour la norme uniforme, c'est $x - \dfrac{1}{8}$, dont l'erreur vaut alternativement $\dfrac{1}{8}$, $-\dfrac{1}{8}$, $\dfrac{1}{8}$ en $0$, $\dfrac{1}{2}$, $1$ : c'est le phénomène d'équioscillation signalé dans le cours à propos de $|t|$. La projection orthogonale minimise l'écart quadratique moyen, pas l'écart maximal.

    1.5em

    ![Figure](documents/figures/b1c6ab53c52168a5.svg)

    La droite orange coupe la parabole en deux points, $\dfrac{1}{2} \pm \dfrac{\sqrt{3}}{6}$, et l'écart est maximal aux extrémités ; la droite verte, plus haute de $\dfrac{1}{24}$, équilibre les écarts en $0$, $\dfrac{1}{2}$ et $1$.
