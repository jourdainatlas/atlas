  page_corrige: 4
  enonce: |
    **Matrice de Gram.** Soit $E$ un espace préhilbertien complexe de dimension $n$ et $(x_{1}, \dots, x_{n}) \in E^{n}$. On note $G = \big(\langle x_{i}, x_{j} \rangle\big)_{1 \leq i, j \leq n} \in \mathcal{M}_{n}(\mathbb{C})$ la matrice de Gram de cette famille.

    **1.** Soit $(e_{1}, \dots, e_{n})$ une base orthonormée de $E$ et $A = (a_{ik}) \in \mathcal{M}_{n}(\mathbb{C})$ la matrice définie par $x_{i} = \mathop{\displaystyle \sum_{k=1}^{n}} a_{ik} e_{k}$ pour tout $i$. Exprimer $G$ à l'aide de $A$.

    **2.** En déduire que $\det G \geq 0$, avec égalité si et seulement si la famille $(x_{1}, \dots, x_{n})$ est liée.

    **3.** Soit $(y_{1}, \dots, y_{n}) \in E^{n}$. Prouver que la matrice $M = \big(\langle x_{i}, x_{j} \rangle \langle y_{i}, y_{j} \rangle\big)_{i, j}$ est hermitienne positive, c'est-à-dire que $\mathop{\displaystyle \sum_{i, j}} \lambda_{i} M_{ij} \overline{\lambda_{j}} \geq 0$ pour tout $(\lambda_{1}, \dots, \lambda_{n}) \in \mathbb{C}^{n}$. On pourra vérifier que 
    $$\sum_{i=1}^{n} \sum_{j=1}^{n} \lambda_{i} \langle x_{i}, x_{j} \rangle \langle y_{i}, y_{j} \rangle \overline{\lambda_{j}} = \sum_{k=1}^{n} \Big\lVert \sum_{i=1}^{n} \lambda_{i} a_{ik} y_{i} \Big\rVert^{2} .$$
  corrige: |
    **1.** Par sesquilinéarité, et parce que la base $(e_{k})$ est orthonormée, 
    $$\langle x_{i}, x_{j} \rangle = \sum_{k=1}^{n} \sum_{l=1}^{n} a_{ik} \overline{a_{jl}} \langle e_{k}, e_{l} \rangle = \sum_{k=1}^{n} a_{ik} \overline{a_{jk}} .$$
     C'est le coefficient $(i, j)$ du produit de $A$ par sa transconjuguée $A^{*} = \overline{A}^{\top}$ : $G = A A^{*}$.

    **2.** On en déduit 
    $$\boxed{\det G = \det A \cdot \det A^{*} = \det A \cdot \overline{\det A} = |\det A|^{2} \geq 0 .}$$
     Il y a égalité si et seulement si $\det A = 0$, c'est-à-dire si les lignes de $A$ sont liées. Or la $i$-ème ligne de $A$ est le vecteur des coordonnées de $x_{i}$ dans la base $(e_{k})$, et l'application « coordonnées » est un isomorphisme de $E$ sur $\mathbb{C}^{n}$ : les lignes de $A$ sont liées si et seulement si la famille $(x_{1}, \dots, x_{n})$ l'est.

    **3.** La matrice $M$ est hermitienne : $M_{ji} = \langle x_{j}, x_{i} \rangle\langle y_{j}, y_{i} \rangle = \overline{\langle x_{i}, x_{j} \rangle} \, \overline{\langle y_{i}, y_{j} \rangle} = \overline{M_{ij}}$.

    Pour la positivité, on remplace $\langle x_{i}, x_{j} \rangle$ par son expression de la question 1, et l'on regroupe par linéarité à gauche et semi-linéarité à droite : 
    $$\sum_{i, j} \lambda_{i} \overline{\lambda_{j}} \langle y_{i}, y_{j} \rangle \sum_{k} a_{ik} \overline{a_{jk}} = \sum_{k=1}^{n} \Big\langle \sum_{i} \lambda_{i} a_{ik} y_{i} , \sum_{j} \lambda_{j} a_{jk} y_{j} \Big\rangle = \sum_{k=1}^{n} \Big\lVert \sum_{i=1}^{n} \lambda_{i} a_{ik} y_{i} \Big\rVert^{2} \geq 0 .$$

    *Remarque.* La question 3 est un cas particulier du théorème du produit de Schur : le produit coefficient par coefficient de deux matrices hermitiennes positives est hermitien positif. Toute matrice hermitienne positive est en effet une matrice de Gram, comme le montre la question 1 lue à l'envers.

    *Remarque.* L'exercice 6 reprend le procédé de Gram-Schmidt à l'aide des projections orthogonales sur $F_{k-1} = \mathrm{Vect}(x_{1}, \dots, x_{k-1})$. Si la famille $(x_{k})$ est libre et si $(f_{k})$ est son orthonormalisée, la matrice de passage est triangulaire, et l'on obtient la formule suivante, qui exprime $\det G$ comme le carré du « volume » du parallélotope construit sur les $x_{k}$, produit des hauteurs successives : 
    $$\det G = \prod_{k=1}^{n} \lVert x_{k} - p_{F_{k-1}}(x_{k}) \rVert^{2} .$$
- id: "l3-hf-01-05"
  feuille: "f-l3-hf-01"
  numero: 5
  partie: "Produits scalaires, inégalités"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [produits scalaires et inégalités]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire, norme, identite-parallelogramme]
  source: "Mathovore, Espaces de Hilbert et analyse de Fourier, exercices L3, exercice 1 ; Sorbonne Université, 3M210 Analyse fonctionnelle 2019-2020, TD 3, exercice 1"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    **Identité du parallélogramme.** On rappelle (cours, prop. 3) que la norme d'un espace préhilbertien vérifie l'identité du parallélogramme 
    $$\lVert x + y \rVert^{2} + \lVert x - y \rVert^{2} = 2\lVert x \rVert^{2} + 2\lVert y \rVert^{2} \qquad (x, y \in E) ,$$
     et que le produit scalaire se retrouve à partir de la norme par les formules de polarisation.

    **1.** Avec $u = (1, 0)$ et $v = (0, 1)$, montrer que les normes $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ de $\mathbb{R}^{2}$ ne proviennent d'aucun produit scalaire.

    **2.** Soit $(X, \mathcal{A}, \mu)$ un espace mesuré contenant deux parties mesurables disjointes $A_{1}$, $A_{2}$ de mesures finies non nulles, et $p \in [1, +\infty[$. En considérant $f = \mu(A_{1})^{-1/p}\mathbf{1}_{A_{1}}$ et $g = \mu(A_{2})^{-1/p}\mathbf{1}_{A_{2}}$, montrer que la norme de $L^{p}(\mu)$ ne provient d'un produit scalaire que si $p = 2$.

    **3.** **Réciproque** (Jordan et von Neumann). Soit $(E, \lVert \cdot \rVert)$ un espace vectoriel normé réel dont la norme vérifie l'identité du parallélogramme. On pose 
    $$\varphi(x, y) = \frac{1}{4}\big(\lVert x + y \rVert^{2} - \lVert x - y \rVert^{2}\big) .$$

    **(a)** Montrer que $\varphi$ est symétrique, que $\varphi(x, x) = \lVert x \rVert^{2}$ et que $\varphi(-x, y) = -\varphi(x, y)$.

    **(b)** En appliquant l'identité du parallélogramme aux couples $(x + y, z)$ et $(x - y, z)$, montrer que 
    $$\varphi(x + z, y) + \varphi(x - z, y) = 2 \varphi(x, y) ,$$
     puis que $\varphi(2x, y) = 2\varphi(x, y)$ et $\varphi(x, y) + \varphi(x', y) = \varphi(x + x', y)$.

    **(c)** En déduire que $\varphi(r x, y) = r \varphi(x, y)$ pour tout rationnel $r$, puis pour tout réel $r$, et conclure que $\varphi$ est un produit scalaire dont $\lVert \cdot \rVert$ est la norme associée.

    **4.** **Stricte convexité.** Soit $E$ un espace préhilbertien et $x$, $y \in E$ tels que $\lVert x \rVert = \lVert y \rVert = \lVert \dfrac{x + y}{2} \rVert$. Montrer que $x = y$. Interpréter géométriquement ce résultat à l'aide de la sphère de centre $0$ et de rayon $\lVert x \rVert$, et montrer qu'il est en défaut pour $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ dans $\mathbb{R}^{2}$.
  corrige: |
    **1.** Pour $\lVert \cdot \rVert_{1}$ : $\lVert u \rVert_{1} = \lVert v \rVert_{1} = 1$ et $\lVert u + v \rVert_{1} = \lVert u - v \rVert_{1} = 2$, donc 
    $$\lVert u + v \rVert_{1}^{2} + \lVert u - v \rVert_{1}^{2} = 8 \neq 4 = 2\lVert u \rVert_{1}^{2} + 2\lVert v \rVert_{1}^{2} .$$
     Pour $\lVert \cdot \rVert_{\infty}$ : $\lVert u \rVert_{\infty} = \lVert v \rVert_{\infty} = \lVert u + v \rVert_{\infty} = \lVert u - v \rVert_{\infty} = 1$, et $2 \neq 4$. Aucune de ces deux normes ne vérifie l'identité du parallélogramme ; d'après la proposition 3 du cours, aucune ne provient d'un produit scalaire.

    **2.** Les fonctions $f$ et $g$ vérifient $\lVert f \rVert_{p}^{p} = \mu(A_{1})^{-1} \mu(A_{1}) = 1$ et de même $\lVert g \rVert_{p} = 1$. Leurs supports étant disjoints, $|f \pm g|^{p} = |f|^{p} + |g|^{p}$, d'où $\lVert f \pm g \rVert_{p} = 2^{1/p}$. L'identité du parallélogramme s'écrirait 
    $$2 \cdot 2^{2/p} = 4 , \qquad \text{soit} \qquad 2^{2/p} = 2 , \qquad \text{soit} \qquad p = 2 .$$
     Pour $p \neq 2$, elle est fausse et la norme de $L^{p}(\mu)$ ne provient d'aucun produit scalaire. Pour $p = 2$, elle provient du produit scalaire $\mathop{\displaystyle \int} f \overline{g} \, \mathrm{d}\mu$.

    **3.** (a) Comme $\lVert y - x \rVert = \lVert x - y \rVert$, $\varphi(y, x) = \varphi(x, y)$. Ensuite $\varphi(x, x) = \dfrac{1}{4}\big(\lVert 2x \rVert^{2} - 0\big) = \lVert x \rVert^{2}$, et $\varphi(-x, y) = \dfrac{1}{4}\big(\lVert y - x \rVert^{2} - \lVert x + y \rVert^{2}\big) = -\varphi(x, y)$.

    (b) L'identité du parallélogramme appliquée aux couples $(x + y, z)$ et $(x - y, z)$ donne 
    $$\lVert x + y + z \rVert^{2} + \lVert x + y - z \rVert^{2} = 2\lVert x + y \rVert^{2} + 2\lVert z \rVert^{2} , \qquad \lVert x - y + z \rVert^{2} + \lVert x - y - z \rVert^{2} = 2\lVert x - y \rVert^{2} + 2\lVert z \rVert^{2} .$$
     On soustrait la seconde égalité de la première, et l'on regroupe les termes deux par deux : 
    $$\big(\lVert (x + z) + y \rVert^{2} - \lVert (x + z) - y \rVert^{2}\big) + \big(\lVert (x - z) + y \rVert^{2} - \lVert (x - z) - y \rVert^{2}\big) = 2\big(\lVert x + y \rVert^{2} - \lVert x - y \rVert^{2}\big) ,$$
     c'est-à-dire, après division par $4$, $\varphi(x + z, y) + \varphi(x - z, y) = 2\varphi(x, y)$.

    Avec $z = x$, et puisque $\varphi(0, y) = 0$, on obtient $\varphi(2x, y) = 2\varphi(x, y)$.

    Enfin, pour $x, x' \in E$, on applique la relation précédente à $\dfrac{x + x'}{2}$ et $z = \dfrac{x - x'}{2}$ : 
    $$\varphi(x, y) + \varphi(x', y) = 2\varphi\Big(\frac{x + x'}{2}, y\Big) = \varphi(x + x', y) .$$

    (c) Par récurrence, l'additivité donne $\varphi(m x, y) = m \varphi(x, y)$ pour $m \in \mathbb{N}$, puis pour $m \in \mathbb{Z}$ grâce à $\varphi(-x, y) = -\varphi(x, y)$. Pour $r = m/q$ avec $q \in \mathbb{N}^{*}$, on écrit $\varphi(m x, y) = \varphi\big(q \cdot \dfrac{m}{q} x, y\big) = q \, \varphi\big(\dfrac{m}{q} x, y\big)$, d'où $\varphi(r x, y) = r \varphi(x, y)$.

    Pour $r$ réel, on utilise la continuité : la norme est continue (et même $1$-lipschitzienne), donc $r \mapsto \varphi(r x, y) = \dfrac{1}{4}\big(\lVert r x + y \rVert^{2} - \lVert r x - y \rVert^{2}\big)$ est continue sur $\mathbb{R}$. Elle coïncide avec $r \mapsto r\varphi(x, y)$ sur $\mathbb{Q}$, qui est dense dans $\mathbb{R}$, donc sur $\mathbb{R}$ tout entier.

    Ainsi $\varphi$ est linéaire en sa première variable, symétrique, donc bilinéaire, et $\varphi(x, x) = \lVert x \rVert^{2} > 0$ pour $x \neq 0$ : $\varphi$ est un produit scalaire dont la norme associée est $\lVert \cdot \rVert$.

    *Remarque.* Dans le cas complexe, avec la convention du cours (linéarité à gauche), on pose $\langle x, y \rangle = \varphi(x, y) + \mathrm{i}\,\varphi(x, \mathrm{i} y)$ : c'est l'identité de polarisation complexe de la proposition 3, et l'on vérifie de même qu'elle définit un produit scalaire hermitien. Le résultat de Jordan et von Neumann, cité sans preuve dans le cours, est donc entièrement démontré.

    **4.** Soit $r = \lVert x \rVert = \lVert y \rVert$. Par hypothèse $\lVert x + y \rVert = 2r$, et l'identité du parallélogramme donne 
    $$\lVert x - y \rVert^{2} = 2\lVert x \rVert^{2} + 2\lVert y \rVert^{2} - \lVert x + y \rVert^{2} = 4r^{2} - 4r^{2} = 0 , \qquad \text{donc} \qquad \boxed{x = y .}$$
     Géométriquement, la sphère de centre $0$ et de rayon $r$ ne contient aucun segment non réduit à un point : le milieu de deux points distincts de cette sphère est *strictement* à l'intérieur de la boule. On dit que la norme est strictement convexe.

    Pour $\lVert \cdot \rVert_{1}$, les points $x = (1, 0)$ et $y = (0, 1)$ sont distincts, de norme $1$, et leur milieu $(1/2, 1/2)$ est encore de norme $1$. Pour $\lVert \cdot \rVert_{\infty}$, on prend $x = (1, 1)$ et $y = (1, -1)$, de milieu $(1, 0)$ : les trois sont de norme $1$. La figure montre les trois sphères unités.

    1.5em

    ![Figure](documents/figures/7383efd560918a66.svg)

    Pour $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$, le segment orange est contenu dans la sphère unité et son milieu rouge est encore sur la sphère ; pour la norme euclidienne, le milieu du segment est strictement à l'intérieur du disque.
- id: "l3-hf-01-06"
  feuille: "f-l3-hf-01"
