  noeuds: [me-produit-scalaire, f-evn]
  notions: [espace-complet, produit-scalaire]
  source: "Mathovore, exercices L3, exercice 3 (espace non complet)"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    **Un espace préhilbertien non complet.** On munit $E = \mathcal{C}([0, 1], \mathbb{R})$ du produit scalaire $\langle f, g \rangle = \mathop{\displaystyle \int_{0}^{1}} f g$. Pour $n \geq 2$, on note $f_{n}$ la fonction continue nulle sur $[0, 1/2]$, égale à $1$ sur $[1/2 + 1/n, 1]$ et affine sur $[1/2, 1/2 + 1/n]$. On note $h = \mathbf{1}_{]1/2, 1]}$.

    **1.** Montrer que $\mathop{\displaystyle \int_{0}^{1}} (f_{n} - h)^{2} = \dfrac{1}{3n}$, et en déduire que $(f_{n})$ est une suite de Cauchy de $E$.

    **2.** Supposons que $(f_{n})$ converge dans $E$ vers une fonction continue $f$. Montrer que $\mathop{\displaystyle \int_{0}^{1}} (f - h)^{2} = 0$, puis que $f = 0$ sur $[0, 1/2[$ et $f = 1$ sur $]1/2, 1]$. Conclure.

    **3.** Interpréter : dans quel espace plus grand la suite $(f_{n})$ converge-t-elle ? Quelle propriété de $E$ fait défaut, qui sera au cœur du chapitre suivant ?
  corrige: |
    **1.** La fonction $f_{n} - h$ est nulle hors de $[1/2, 1/2 + 1/n]$, et vaut $n(x - 1/2) - 1$ sur cet intervalle. Avec $u = x - 1/2$, 
    $$\int_{0}^{1} (f_{n} - h)^{2} = \int_{0}^{1/n} (1 - nu)^{2} \, \mathrm{d} u = \Big[ -\frac{(1 - nu)^{3}}{3n} \Big]_{0}^{1/n} = \boxed{\frac{1}{3n} .}$$
     La fonction $h$ n'est pas continue, mais la forme $\langle f, g \rangle = \mathop{\displaystyle \int_{0}^{1}} fg$ a un sens sur l'espace des fonctions continues par morceaux, où elle est bilinéaire, symétrique et positive. L'inégalité de Cauchy-Schwarz, et donc l'inégalité triangulaire pour $\lVert f \rVert = \sqrt{\langle f, f \rangle}$, y restent vraies : leurs démonstrations n'utilisent pas le caractère défini. Ainsi 
    $$\lVert f_{n} - f_{m} \rVert \leq \lVert f_{n} - h \rVert + \lVert h - f_{m} \rVert = \frac{1}{\sqrt{3n}} + \frac{1}{\sqrt{3m}} ,$$
     qui tend vers $0$ quand $n$ et $m$ tendent vers l'infini : la suite $(f_{n})$ est de Cauchy dans $E$.

    **2.** Si $f_{n} \to f$ dans $E$, alors $\lVert f - h \rVert \leq \lVert f - f_{n} \rVert + \lVert f_{n} - h \rVert \to 0$, donc $\mathop{\displaystyle \int_{0}^{1}} (f - h)^{2} = 0$.

    Sur $[0, 1/2]$, la fonction $(f - h)^{2} = f^{2}$ est continue et positive, d'intégrale nulle : $f = 0$ sur $[0, 1/2]$. De même, $(f - 1)^{2}$ est continue et positive sur $[1/2, 1]$, et son intégrale est celle de $(f - h)^{2}$, nulle : $f = 1$ sur $[1/2, 1]$, et en particulier $f(1/2) = 1$ par continuité.

    On obtient $f(1/2) = 0$ et $f(1/2) = 1$, ce qui est absurde. La suite de Cauchy $(f_{n})$ ne converge donc pas dans $E$ : 
    $$\boxed{\text{l'espace } E \text{ n'est pas complet.}}$$

    **3.** La suite converge vers $h$ dans l'espace $L^{2}([0, 1])$, qui contient $E$ (chaque fonction continue y représente sa classe) et dans lequel $\lVert f_{n} - h \rVert \to 0$. La propriété qui fait défaut à $E$ est la *complétude* : c'est elle qui distingue les espaces de Hilbert, objet du chapitre 2, où l'on verra que $L^{2}$ est complet (théorème de Riesz-Fischer). La proposition 9 du cours montrait une autre conséquence du même défaut : une distance à un sous-espace fermé qui n'est pas atteinte.

    1.5em

    ![Figure](documents/figures/5476194d3aa9ca48.svg)

    Les rampes bleues deviennent de plus en plus raides et se rapprochent, en moyenne quadratique, de la fonction en escalier $h$ (rouge), qui n'est pas continue en $\dfrac{1}{2}$.

