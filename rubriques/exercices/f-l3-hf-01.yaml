- id: "l3-hf-01-01"
  feuille: "f-l3-hf-01"
  numero: 1
  partie: "Produits scalaires, inégalités"
  etoiles: 1
  types: [Calcul]
  mots_cles: [produits scalaires et inégalités]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire, norme, identite-parallelogramme]
  source: "Bordeaux, Espaces de Hilbert et analyse de Fourier 2015-2016, feuille 1, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On pose $E = \mathcal{C}([-1, 1], \mathbb{C})$ et, pour tout $(f, g) \in E^{2}$, 
    $$H(f, g) = \int_{-1}^{1} f(-t)\, \overline{g(t)} \, \mathrm{d} t .$$

    **1.** Vérifier que $H$ est une forme sesquilinéaire hermitienne sur $E$, c'est-à-dire que $H$ est linéaire en $f$ et que $H(g, f) = \overline{H(f, g)}$ pour tous $f$, $g$.

    **2.** Calculer $H(f, f)$ lorsque $f$ est paire, puis lorsque $f$ est impaire. La forme $H$ est-elle positive ? Est-elle un produit scalaire sur le sous-espace des fonctions paires ?
  corrige: |
    **1.** Pour $g$ fixé, $f \mapsto H(f, g)$ est linéaire, car $f \mapsto f(-\,\cdot\,)$ l'est et l'intégrale aussi ; pour $f$ fixé, $g \mapsto H(f, g)$ est semi-linéaire, car $\overline{\lambda g + g'} = \overline{\lambda}\,\overline{g} + \overline{g'}$.

    Pour la symétrie hermitienne, on fait le changement de variable $t = -s$ dans $H(g, f)$ : 
    $$H(g, f) = \int_{-1}^{1} g(-t) \overline{f(t)} \, \mathrm{d} t = \int_{-1}^{1} g(s) \overline{f(-s)} \, \mathrm{d} s = \overline{\int_{-1}^{1} f(-s) \overline{g(s)} \, \mathrm{d} s} = \overline{H(f, g)} .$$
     La forme $H$ est donc sesquilinéaire hermitienne ; en particulier $H(f, f) = \overline{H(f, f)}$ est réel pour tout $f$.

    **2.** Si $f$ est paire, $f(-t) = f(t)$ et $H(f, f) = \mathop{\displaystyle \int_{-1}^{1}} |f|^{2} \geq 0$. Si $f$ est impaire, $f(-t) = -f(t)$ et $H(f, f) = -\mathop{\displaystyle \int_{-1}^{1}} |f|^{2} \leq 0$.

    La forme n'est donc pas positive : pour $f(t) = t$, on trouve 
    $$\boxed{H(f, f) = -\int_{-1}^{1} t^{2} \, \mathrm{d} t = -\frac{2}{3} < 0 .}$$

    Sur le sous-espace $E_{p}$ des fonctions paires, en revanche, $H(f, g) = \mathop{\displaystyle \int_{-1}^{1}} f \overline{g}$ est le produit scalaire usuel : $H(f, f) = \mathop{\displaystyle \int} |f|^{2} = 0$ entraîne $f = 0$, car $|f|^{2}$ est continue et positive. C'est donc un produit scalaire sur $E_{p}$, et de même $-H$ en est un sur le sous-espace $E_{i}$ des fonctions impaires.

    *Remarque.* Toute $f \in E$ s'écrit $f = f_{p} + f_{i}$ (parties paire et impaire), et $H(f_{p}, f_{i}) = \mathop{\displaystyle \int} f_{p} \overline{f_{i}} = 0$ car $f_{p}\overline{f_{i}}$ est impaire ; de même $H(f_{i}, f_{p}) = 0$. Il vient $H(f, f) = \lVert f_{p} \rVert_{2}^{2} - \lVert f_{i} \rVert_{2}^{2}$ : la forme $H$ est positive sur $E_{p}$, négative sur $E_{i}$, comme une forme quadratique de signature mixte en dimension finie. On a d'ailleurs $H(f, g) = \langle \sigma f, g \rangle$ pour le produit scalaire usuel, où $\sigma f = f(-\,\cdot\,)$ est une symétrie dont $E_{p}$ et $E_{i}$ sont les sous-espaces propres.
- id: "l3-hf-01-02"
  feuille: "f-l3-hf-01"
