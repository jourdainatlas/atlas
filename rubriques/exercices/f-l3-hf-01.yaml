  source: "Bordeaux 2015-2016, feuille 1, exercice 2 (inégalité de Selberg)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **Inégalité de Selberg.** Soit $E$ un espace préhilbertien complexe et $e_{1}, \dots, e_{n}$ des vecteurs non nuls de $E$. On pose, pour $i \in \{1, \dots, n\}$, 
    $$L_{i} = \sum_{k=1}^{n} |\langle e_{i}, e_{k} \rangle| .$$

    **1.** Soit $(\lambda_{1}, \dots, \lambda_{n}) \in \mathbb{C}^{n}$. Montrer que 
    $$\Big\lVert \sum_{k=1}^{n} \lambda_{k} e_{k} \Big\rVert^{2} \leq \sum_{i=1}^{n} |\lambda_{i}|^{2} L_{i} ,$$
     en majorant $|\lambda_{i}\overline{\lambda_{k}}|$ par $\dfrac{1}{2}\big(|\lambda_{i}|^{2} + |\lambda_{k}|^{2}\big)$. En déduire que, pour tout $x \in E$, 
    $$\Big| \sum_{k=1}^{n} \lambda_{k} \langle e_{k}, x \rangle \Big|^{2} \leq \lVert x \rVert^{2} \sum_{i=1}^{n} |\lambda_{i}|^{2} L_{i} .$$

    **2.** Montrer que, pour tout $x \in E$, 
    $$\sum_{k=1}^{n} \frac{|\langle x, e_{k} \rangle|^{2}}{L_{k}} \leq \lVert x \rVert^{2} .$$

    **3.** Que devient cette inégalité lorsque la famille $(e_{1}, \dots, e_{n})$ est orthonormée ? et lorsque $n = 1$ ?
  corrige: |
    **1.** On développe le carré de la norme par sesquilinéarité (cours, prop. 1), puis on majore chaque terme par son module : 
    $$\Big\lVert \sum_{k} \lambda_{k} e_{k} \Big\rVert^{2} = \sum_{i, k} \lambda_{i} \overline{\lambda_{k}} \langle e_{i}, e_{k} \rangle \leq \sum_{i, k} |\lambda_{i}| \, |\lambda_{k}| \, |\langle e_{i}, e_{k} \rangle| \leq \frac{1}{2} \sum_{i, k} \big(|\lambda_{i}|^{2} + |\lambda_{k}|^{2}\big) |\langle e_{i}, e_{k} \rangle| .$$
     Comme $|\langle e_{k}, e_{i} \rangle| = |\langle e_{i}, e_{k} \rangle|$, les deux moitiés de la dernière somme sont égales : 
    $$\frac{1}{2}\sum_{i} |\lambda_{i}|^{2} \sum_{k} |\langle e_{i}, e_{k} \rangle| + \frac{1}{2} \sum_{k} |\lambda_{k}|^{2} \sum_{i} |\langle e_{k}, e_{i} \rangle| = \sum_{i} |\lambda_{i}|^{2} L_{i} .$$

    Pour la seconde majoration, $\mathop{\displaystyle \sum_{k}} \lambda_{k} \langle e_{k}, x \rangle = \langle \mathop{\displaystyle \sum_{k}} \lambda_{k} e_{k}, x \rangle$ par linéarité à gauche, et l'inégalité de Cauchy-Schwarz (cours, th. 1) donne 
    $$\Big| \sum_{k} \lambda_{k} \langle e_{k}, x \rangle \Big|^{2} \leq \Big\lVert \sum_{k} \lambda_{k} e_{k} \Big\rVert^{2} \lVert x \rVert^{2} \leq \lVert x \rVert^{2} \sum_{i} |\lambda_{i}|^{2} L_{i} .$$

    **2.** Chaque $L_{k}$ est strictement positif, puisqu'il contient le terme $|\langle e_{k}, e_{k} \rangle| = \lVert e_{k} \rVert^{2} > 0$. On choisit $\lambda_{k} = \langle x, e_{k} \rangle / L_{k}$ et l'on pose $S = \mathop{\displaystyle \sum_{k}} |\langle x, e_{k} \rangle|^{2} / L_{k}$. Comme $\lambda_{k} \langle e_{k}, x \rangle = |\langle x, e_{k} \rangle|^{2} / L_{k}$, le membre de gauche de la question 1 vaut $S^{2}$, et le membre de droite vaut 
    $$\lVert x \rVert^{2} \sum_{i} \frac{|\langle x, e_{i} \rangle|^{2}}{L_{i}^{2}} \, L_{i} = \lVert x \rVert^{2} S .$$
     On obtient $S^{2} \leq \lVert x \rVert^{2} S$. Si $S = 0$, l'inégalité cherchée est évidente ; sinon on divise par $S > 0$ : 
    $$\boxed{\sum_{k=1}^{n} \frac{|\langle x, e_{k} \rangle|^{2}}{L_{k}} \leq \lVert x \rVert^{2} .}$$

    **3.** Si la famille est orthonormée, $\langle e_{i}, e_{k} \rangle = \delta_{ik}$, donc $L_{i} = 1$ et l'on retrouve l'inégalité de Bessel $\mathop{\displaystyle \sum_{k}} |\langle x, e_{k} \rangle|^{2} \leq \lVert x \rVert^{2}$ (cours, prop. 8).

    Si $n = 1$, $L_{1} = \lVert e_{1} \rVert^{2}$ et l'on retrouve l'inégalité de Cauchy-Schwarz $|\langle x, e_{1} \rangle|^{2} \leq \lVert x \rVert^{2} \lVert e_{1} \rVert^{2}$.

    *Remarque.* L'inégalité de Selberg interpole donc entre Cauchy-Schwarz et Bessel. Son intérêt est de s'appliquer à des familles seulement « presque orthogonales » : si les produits scalaires croisés sont petits devant les normes, les $L_{k}$ restent proches de $\lVert e_{k} \rVert^{2}$ et l'on obtient une inégalité de type Bessel sans orthogonalité exacte.
