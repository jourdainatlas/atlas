  source: "Sorbonne, 3M210, TD 3, exercice 2 (base de Walsh)"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    **Base de Walsh.** Soit $n \geq 1$ et $\Omega_{n} = \{-1, 1\}^{n}$. Pour $f, g : \Omega_{n} \to \mathbb{R}$, on pose 
    $$\langle f, g \rangle = \frac{1}{2^{n}} \sum_{x \in \Omega_{n}} f(x) g(x) ,$$
     c'est le produit scalaire de $L^{2}$ pour la mesure uniforme $\mu_{n}$ sur $\Omega_{n}$. Pour toute partie $S$ de $\{1, \dots, n\}$, on note $\chi_{S} : \Omega_{n} \to \mathbb{R}$ la fonction $\chi_{S}(x) = \mathop{\displaystyle \prod_{i \in S}} x_{i}$, avec $\chi_{\varnothing} = 1$.

    **1.** Montrer que $\langle \cdot, \cdot \rangle$ est un produit scalaire sur l'espace $\mathbb{R}^{\Omega_{n}}$ de toutes les fonctions de $\Omega_{n}$ dans $\mathbb{R}$, et préciser la dimension de cet espace.

    **2.** Montrer que, pour toutes fonctions $g_{1}, \dots, g_{n}$ de $\{-1, 1\}$ dans $\mathbb{R}$, 
    $$\frac{1}{2^{n}} \sum_{x \in \Omega_{n}} g_{1}(x_{1}) \cdots g_{n}(x_{n}) = \prod_{i=1}^{n} \Big( \frac{g_{i}(1) + g_{i}(-1)}{2} \Big) ,$$
     autrement dit que $\mu_{n}$ est la mesure produit $\mu_{1} \otimes \cdots \otimes \mu_{1}$.

    **3.** En déduire que $(\chi_{S})_{S \subset \{1, \dots, n\}}$ est une base orthonormée de $\mathbb{R}^{\Omega_{n}}$.

    **4.** Pour $n = 2$, décomposer dans cette base la fonction $f(x_{1}, x_{2}) = \mathop{\displaystyle \max}(x_{1}, x_{2})$.
  corrige: |
    **1.** La forme est bilinéaire et symétrique, et $\langle f, f \rangle = 2^{-n} \mathop{\displaystyle \sum_{x}} f(x)^{2} \geq 0$. Si $\langle f, f \rangle = 0$, chaque terme $f(x)^{2}$ est nul, donc $f = 0$ : c'est un produit scalaire. Chaque point ayant une masse $2^{-n} > 0$, deux fonctions égales $\mu_{n}$-presque partout sont égales partout, et $L^{2}(\mu_{n})$ s'identifie à $\mathbb{R}^{\Omega_{n}}$.

    Une base de $\mathbb{R}^{\Omega_{n}}$ est formée des indicatrices des points, donc $\dim \mathbb{R}^{\Omega_{n}} = \operatorname{card} \Omega_{n} = 2^{n}$.

    **2.** Par distributivité, développer le produit $\mathop{\displaystyle \prod_{i=1}^{n}} \big(g_{i}(1) + g_{i}(-1)\big)$ revient à choisir, dans chaque facteur, l'une des deux valeurs $x_{i} = \pm 1$ : on obtient exactement $\mathop{\displaystyle \sum_{x \in \Omega_{n}}} g_{1}(x_{1}) \cdots g_{n}(x_{n})$. Il suffit de diviser par $2^{n} = \mathop{\displaystyle \prod_{i}} 2$.

    **3.** Comme $x_{i}^{2} = 1$, on a $\chi_{S} \chi_{T} = \chi_{S \Delta T}$, où $S \Delta T$ est la différence symétrique. Il suffit donc de calculer $\langle \chi_{U}, 1 \rangle = 2^{-n} \mathop{\displaystyle \sum_{x}} \chi_{U}(x)$ pour une partie $U$.

    On applique la question 2 avec $g_{i}(t) = t$ si $i \in U$ et $g_{i} = 1$ sinon : chaque facteur vaut $\dfrac{1 + (-1)}{2} = 0$ si $i \in U$, et $1$ sinon. Donc $\langle \chi_{U}, 1 \rangle = 1$ si $U = \varnothing$ et $0$ sinon, ce qui donne 
    $$\boxed{\langle \chi_{S}, \chi_{T} \rangle = \begin{cases} 1 & \text{si } S = T , \\ 0 & \text{si } S \neq T . \end{cases}}$$
     La famille $(\chi_{S})$ est orthonormée, donc libre (cours, prop. 6). Elle compte $2^{n}$ éléments, autant que la dimension : c'est une base orthonormée de $\mathbb{R}^{\Omega_{n}}$.

    **4.** Pour $n = 2$, $f$ vaut $1$ en $(1, 1)$, $(1, -1)$, $(-1, 1)$ et $-1$ en $(-1, -1)$. Les coordonnées sont les produits scalaires (cours, prop. 7) : 
    $$\langle f, 1 \rangle = \frac{1 + 1 + 1 - 1}{4} = \frac{1}{2} , \qquad \langle f, x_{1} \rangle = \frac{1 + 1 - 1 + 1}{4} = \frac{1}{2} ,$$

    $$\langle f, x_{2} \rangle = \frac{1}{2} \ \text{(par symétrie)} , \qquad \langle f, x_{1}x_{2} \rangle = \frac{1 - 1 - 1 - 1}{4} = -\frac{1}{2} .$$
     D'où 
    $$\boxed{\max(x_{1}, x_{2}) = \frac{1}{2}\big(1 + x_{1} + x_{2} - x_{1}x_{2}\big) ,}$$
     ce que l'on vérifie sur les quatre points. L'égalité de Parseval finie s'écrit $\lVert f \rVert^{2} = 1 = 4 \times \dfrac{1}{4}$.

    *Remarque.* Les $\chi_{S}$ sont les morphismes du groupe multiplicatif $\{-1, 1\}^{n}$ dans $\{-1, 1\}$, et les coordonnées $\langle f, \chi_{S} \rangle$ sont les « coefficients de Fourier » de $f$ sur ce groupe. Le chapitre 5 fera la même chose sur le cercle $\mathbb{T}$, avec les caractères $t \mapsto \mathrm{e}^{\mathrm{i} n t}$ : la situation y est plus délicate, parce que l'espace est de dimension infinie.
