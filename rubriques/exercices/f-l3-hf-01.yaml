  enonce: |
    **Moyennes sur une partition.** Soit $(\Omega, \mathcal{A}, \mathbb{P})$ un espace probabilisé et $(A_{1}, \dots, A_{N})$ une partition de $\Omega$ en évènements de probabilités non nulles. On note $F$ l'ensemble des fonctions réelles constantes sur chaque $A_{j}$, et $L^{2} = L^{2}(\Omega, \mathcal{A}, \mathbb{P})$, muni de $\langle f, g \rangle = \mathop{\displaystyle \int_{\Omega}} f g \, \mathrm{d}\mathbb{P}$.

    **1.** Soit $\mathcal{C}$ l'ensemble des réunions (finies) d'ensembles $A_{j}$. Montrer que $\mathcal{C}$ est une sous-tribu de $\mathcal{A}$, et qu'une fonction $\mathcal{A}$-mesurable est $\mathcal{C}$-mesurable si et seulement si elle appartient à $F$.

    **2.** Montrer que $F$ est un sous-espace vectoriel de $L^{2}$ de dimension $N$.

    **3.** Montrer que les fonctions $f_{j} = \mathbb{P}(A_{j})^{-1/2} \mathbf{1}_{A_{j}}$, $1 \leq j \leq N$, forment une base orthonormée de $F$.

    **4.** Donner une formule pour la projection orthogonale $p_{F}(f)$ d'une fonction $f \in L^{2}$ sur $F$, et l'interpréter en termes de moyennes de $f$ sur les $A_{j}$.

    **5.** On lance un dé équilibré ; $\Omega = \{1, \dots, 6\}$, $f(\omega) = \omega$, $A_{1} = \{1, 3, 5\}$ et $A_{2} = \{2, 4, 6\}$. Calculer $p_{F}(f)$ et $d(f, F)$.
  corrige: |
    **1.** Une réunion d'ensembles $A_{j}$ s'écrit $A_{J} = \mathop{\displaystyle \bigcup_{j \in J}} A_{j}$ avec $J \subset \{1, \dots, N\}$ ; il n'y en a qu'un nombre fini. On a $\varnothing = A_{\varnothing}$ et $\Omega = A_{\{1, \dots, N\}}$. Comme les $A_{j}$ forment une partition, le complémentaire de $A_{J}$ est $A_{J^{c}}$, et une réunion d'ensembles $A_{J_{k}}$ est l'ensemble $A_{J}$ avec $J = \mathop{\displaystyle \bigcup_{k}} J_{k}$. Donc $\mathcal{C}$ est une tribu, contenue dans $\mathcal{A}$.

    Si $f = \mathop{\displaystyle \sum_{j}} c_{j} \mathbf{1}_{A_{j}} \in F$, l'image réciproque de toute partie $B \subset \mathbb{R}$ est $f^{-1}(B) = A_{J}$ avec $J = \{j ; c_{j} \in B\}$ : elle appartient à $\mathcal{C}$, et $f$ est $\mathcal{C}$-mesurable.

    Réciproquement, soit $f$ une fonction $\mathcal{C}$-mesurable, $\omega \in A_{j}$ et $c = f(\omega)$. L'ensemble $f^{-1}(\{c\})$ appartient à $\mathcal{C}$ et contient $\omega$ ; c'est une réunion d'ensembles $A_{k}$, et elle contient donc $A_{j}$ tout entier. Ainsi $f = c$ sur $A_{j}$ : $f$ est constante sur chaque $A_{j}$.

    **2.** On a $F = \mathrm{Vect}(\mathbf{1}_{A_{1}}, \dots, \mathbf{1}_{A_{N}})$. Les indicatrices sont bornées, donc dans $L^{2}$ ; elles sont non nulles dans $L^{2}$, puisque $\lVert \mathbf{1}_{A_{j}} \rVert^{2} = \mathbb{P}(A_{j}) > 0$, et deux à deux orthogonales, puisque $\mathbf{1}_{A_{j}} \mathbf{1}_{A_{k}} = 0$ pour $j \neq k$. Elles forment donc une famille libre (cours, prop. 6), et $\dim F = N$.

    **3.** On a $\langle f_{j}, f_{k} \rangle = \dfrac{\mathbb{P}(A_{j} \cap A_{k})}{\sqrt{\mathbb{P}(A_{j}) \mathbb{P}(A_{k})}}$, qui vaut $1$ si $j = k$ et $0$ sinon : la famille est orthonormée, de cardinal $N = \dim F$, donc c'est une base orthonormée de $F$.

    **4.** D'après le théorème 3 du cours, 
    $$p_{F}(f) = \sum_{j=1}^{N} \langle f, f_{j} \rangle f_{j} , \qquad \text{d'où} \qquad \boxed{p_{F}(f) = \sum_{j=1}^{N} \Big( \frac{1}{\mathbb{P}(A_{j})} \int_{A_{j}} f \, \mathrm{d}\mathbb{P} \Big) \mathbf{1}_{A_{j}} .}$$
     Sur chaque $A_{j}$, la projection de $f$ est la constante égale à la *moyenne* de $f$ sur $A_{j}$. En probabilités, c'est l'espérance conditionnelle $\mathbb{E}(f \mid \mathcal{C})$ de $f$ sachant la tribu $\mathcal{C}$ : la meilleure approximation de $f$, au sens quadratique, par une fonction qui ne dépend que de l'information « dans quel $A_{j}$ est $\omega$ ».

    **5.** La moyenne de $f$ sur $A_{1} = \{1, 3, 5\}$ vaut $3$, et sur $A_{2} = \{2, 4, 6\}$ elle vaut $4$ : 
    $$\boxed{p_{F}(f) = 3\,\mathbf{1}_{A_{1}} + 4\,\mathbf{1}_{A_{2}} .}$$
     Les écarts $f - p_{F}(f)$ valent $-2, 0, 2$ sur $A_{1}$ et sur $A_{2}$, d'où 
    $$\boxed{d(f, F)^{2} = \frac{1}{6}(4 + 0 + 4 + 4 + 0 + 4) = \frac{8}{3} , \qquad d(f, F) = \frac{2\sqrt{6}}{3} \approx 1{,}63 .}$$

    *Remarque.* La moyenne de $f$ est $\dfrac{7}{2}$ et sa variance $\dfrac{35}{12}$. La fonction constante $\dfrac{7}{2}$ appartient à $F$, et le théorème de Pythagore appliqué à $f - \dfrac{7}{2} = (f - p_{F}(f)) + (p_{F}(f) - \dfrac{7}{2})$ donne la décomposition de la variance $\dfrac{35}{12} = \dfrac{8}{3} + \dfrac{1}{4}$ : variance « à l'intérieur des classes » plus variance « entre les classes ».

    1.5em

    ![Figure](documents/figures/d6bf52a4ac222dc4.svg)

    Les barres bleues représentent $f(\omega) = \omega$ ; les segments orange représentent $p_{F}(f)$, égale à $3$ sur les impairs et à $4$ sur les pairs ; la droite rouge est la moyenne générale $\dfrac{7}{2}$.
- id: "l3-hf-01-11"
  feuille: "f-l3-hf-01"
  numero: 11
