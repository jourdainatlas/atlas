  enonce: |
    On cherche 
    $$m = \inf_{(a, b, c) \in \mathbb{R}^{3}} \int_{-1}^{1} (t^{3} - a t^{2} - b t - c)^{2} \, \mathrm{d} t .$$

    **1.** Interpréter $m$ comme le carré d'une distance dans $\mathcal{C}([-1, 1], \mathbb{R})$ muni de $\langle f, g \rangle = \mathop{\displaystyle \int_{-1}^{1}} f g$. Montrer que les fonctions paires et les fonctions impaires sont orthogonales, et en déduire que le minimum est atteint pour $a = c = 0$.

    **2.** Calculer $m$ et le triplet $(a, b, c)$ qui le réalise.

    **3.** Comparer le polynôme $t^{3} - a t^{2} - b t - c$ obtenu avec le polynôme $e_{3}$ de la famille de Legendre construite dans le cours.
  corrige: |
    **1.** On a $m = d(t^{3}, \mathbb{R}_{2}[t])^{2}$, où $\mathbb{R}_{2}[t]$ est le sous-espace des polynômes de degré au plus $2$ dans $E = \mathcal{C}([-1, 1], \mathbb{R})$ muni de $\langle f, g \rangle = \mathop{\displaystyle \int_{-1}^{1}} fg$.

    Si $f$ est paire et $g$ impaire, $fg$ est impaire et $\mathop{\displaystyle \int_{-1}^{1}} fg = 0$. Pour $Q = at^{2} + bt + c$, on écrit 
    $$t^{3} - Q = (t^{3} - bt) - (at^{2} + c) ,$$
     différence d'une fonction impaire et d'une fonction paire, orthogonales. Par Pythagore (cours, prop. 2), 
    $$\int_{-1}^{1} (t^{3} - Q)^{2} = \int_{-1}^{1} (t^{3} - bt)^{2} + \int_{-1}^{1} (at^{2} + c)^{2} \geq \int_{-1}^{1} (t^{3} - bt)^{2} ,$$
     avec égalité si et seulement si $at^{2} + c = 0$, c'est-à-dire $a = c = 0$.

    **2.** Il reste à minimiser 
    $$\varphi(b) = \int_{-1}^{1} (t^{3} - bt)^{2} \, \mathrm{d} t = \frac{2}{7} - \frac{4b}{5} + \frac{2b^{2}}{3} .$$
     La dérivée $-\dfrac{4}{5} + \dfrac{4b}{3}$ s'annule en $b = \dfrac{3}{5}$, et 
    $$\boxed{m = \varphi\Big(\frac{3}{5}\Big) = \frac{2}{7} - \frac{12}{25} + \frac{6}{25} = \frac{8}{175} , \qquad (a, b, c) = \Big(0, \frac{3}{5}, 0\Big) .}$$

    **3.** Le polynôme obtenu, $t^{3} - \dfrac{3}{5}t = \dfrac{1}{5}(5t^{3} - 3t)$, est orthogonal à $\mathbb{R}_{2}[t]$. Il est donc proportionnel au polynôme $e_{3} = \dfrac{\sqrt{14}}{4}(5t^{3} - 3t)$ du cours, qui est précisément l'orthonormalisé de $t^{3}$ par rapport à $1, t, t^{2}$.

    Cela donne une seconde méthode : $m$ est le carré de la norme de la composante de $t^{3}$ orthogonale à $\mathbb{R}_{2}[t]$, c'est-à-dire $\langle t^{3}, e_{3} \rangle^{2}$. On vérifie $\langle t^{3}, e_{3} \rangle = \dfrac{\sqrt{14}}{4}\big(\dfrac{10}{7} - \dfrac{6}{5}\big) = \dfrac{\sqrt{14}}{4} \cdot \dfrac{8}{35}$, dont le carré vaut $\dfrac{14}{16} \cdot \dfrac{64}{1225} = \dfrac{8}{175}$.

    1.5em

    ![Figure](documents/figures/2321f6b8df1d4461.svg)

    La droite $\dfrac{3}{5}t$ coupe la cubique en $0$ et en $\pm\sqrt{3/5} \approx \pm 0{,}775$ : ce sont les racines de $5t^{3} - 3t$, c'est-à-dire du polynôme de Legendre $P_{3}$.
- id: "l3-hf-01-09"
  feuille: "f-l3-hf-01"
  numero: 9
