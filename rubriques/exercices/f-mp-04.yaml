  page_enonce: 7
  page_corrige: 16
  enonce: |
    Pour $f \in \mathcal{C}([0, 1], \mathbb{R})$, on pose $N(f) = \int_{0}^{1} \mathrm{e}^{t}|f(t)|\,\mathrm{d} t$. Montrer que $N$ est une norme sur $\mathcal{C}([0, 1], \mathbb{R})$, équivalente à $\lVert \cdot \rVert_{1}$ mais pas à $\lVert \cdot \rVert_{\infty}$.
  corrige: |
    Le poids $\mathrm{e}^{t}$ est continu et compris entre $1$ et $\mathrm{e}$ sur $[0, 1]$ ; la séparation vient, comme pour $\lVert \cdot \rVert_{1}$, de la continuité de $|f|$. On a aussitôt 
    $$\lVert f \rVert_{1} \leqslant N(f) \leqslant \mathrm{e}\,\lVert f \rVert_{1}.$$
     Comme $\lVert \cdot \rVert_{1}$ n'est pas équivalente à $\lVert \cdot \rVert_{\infty}$ (proposition 11), $N$ ne l'est pas non plus : avec $f_{n} : t \mapsto t^{n}$, $N(f_{n}) \leqslant \frac{\mathrm{e}}{n + 1}$ et $\lVert f_{n} \rVert_{\infty} = 1$. 
    $$\boxed{N \sim \lVert \cdot \rVert_{1}, \qquad N \not\sim \lVert \cdot \rVert_{\infty}}$$
- id: "mp-04-32"
  feuille: "f-mp-04"
  numero: 32
  partie: "Comparaison des normes"
