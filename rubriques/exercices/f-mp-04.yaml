  enonce: |
    **1.** Soit $a$, $b > 0$. Montrer que $N(x, y) = \sqrt{a^{2}x^{2} + b^{2}y^{2}}$ définit une norme sur $\mathbb{R}^{2}$, décrire et dessiner sa boule unité, et déterminer les meilleures constantes $\alpha$ et $\beta$ telles que $\alpha\lVert \cdot \rVert_{2} \leqslant N \leqslant \beta\lVert \cdot \rVert_{2}$.

    **2.** Montrer que $N'(x, y) = \sqrt{x^{2} + 2xy + 5y^{2}}$ définit une norme sur $\mathbb{R}^{2}$, en reconnaissant la norme associée à un produit scalaire.
  corrige: |
    **1.** On reconnaît $N(x, y) = \lVert (ax, by) \rVert_{2}$, image par l'application linéaire injective $(x, y) \mapsto (ax, by)$ : c'est une norme par l'exercice 5. Sa boule unité est l'intérieur de l'ellipse $a^{2}x^{2} + b^{2}y^{2} \leqslant 1$, de demi-axes $\frac{1}{a}$ et $\frac{1}{b}$. En notant $m = \min(a, b)$ et $M = \max(a, b)$, on a $m^{2}(x^{2} + y^{2}) \leqslant a^{2}x^{2} + b^{2}y^{2} \leqslant M^{2}(x^{2} + y^{2})$, avec égalité en $(1, 0)$ ou $(0, 1)$ selon le cas. 
    $$\boxed{\min(a, b)\lVert \cdot \rVert_{2} \leqslant N \leqslant \max(a, b)\lVert \cdot \rVert_{2}, \ \text{ constantes optimales}}$$
     Géométriquement, la boule unité de $N$ est coincée entre les disques de rayons $\frac{1}{M}$ et $\frac{1}{m}$, qu'elle touche aux extrémités de ses axes.

    **2.** On met sous forme canonique : $x^{2} + 2xy + 5y^{2} = (x + y)^{2} + 4y^{2}$. L'application 
    $$\varphi\big((x, y), (x', y')\big) = xx' + xy' + yx' + 5yy'$$
     est bilinéaire symétrique, et $\varphi\big((x, y), (x, y)\big) = (x + y)^{2} + (2y)^{2}$ ne s'annule qu'en $(0, 0)$ : c'est un produit scalaire, dont $N'$ est la norme associée (proposition 3). 
    $$\boxed{N'(x, y) = \sqrt{(x + y)^{2} + 4y^{2}} = \lVert (x + y, 2y) \rVert_{2} \text{ est une norme}}$$
