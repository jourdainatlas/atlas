  page_corrige: 27
  enonce: |
    *Méthode de Newton pour l'inverse d'une matrice.* On munit $\mathcal{M}_{n}(\mathbb{R})$ de la norme $\lVert \cdot \rVert_{2}$, dont on a vu à l'exercice 12 qu'elle est sous-multiplicative. Soit $A \in \mathcal{M}_{n}(\mathbb{R})$, $M_{0} \in \mathcal{M}_{n}(\mathbb{R})$ et la suite définie par $M_{k+1} = 2M_{k} - M_{k}AM_{k}$. On suppose que $q = \lVert I_{n} - AM_{0} \rVert_{2} < 1$.

    **1.** Montrer que $I_{n} - AM_{k+1} = (I_{n} - AM_{k})^{2}$, puis que $\lVert I_{n} - AM_{k} \rVert_{2} \leqslant q^{2^{k}}$.

    **2.** Soit $H \in \mathcal{M}_{n}(\mathbb{R})$ telle que $\lVert H \rVert_{2} < 1$. Montrer que $\lVert HX \rVert_{2} \leqslant \lVert H \rVert_{2}\lVert X \rVert_{2}$ pour toute colonne $X$, puis que $I_{n} - H$ est inversible.

    **3.** En déduire que $A$ est inversible et que $M_{k} \to A^{-1}$.

    **4.** Pourquoi parle-t-on de convergence quadratique ? Combien d'itérations suffisent pour obtenir $\lVert I_{n} - AM_{k} \rVert_{2} \leqslant 10^{-12}$ lorsque $q = \frac{1}{2}$ ?
  corrige: |
    **1.** On multiplie la relation de récurrence par $A$ à gauche : $AM_{k+1} = 2AM_{k} - (AM_{k})^{2}$, et comme $I_{n}$ commute avec $AM_{k}$, 
    $$I_{n} - AM_{k+1} = I_{n} - 2AM_{k} + (AM_{k})^{2} = (I_{n} - AM_{k})^{2}.$$
     La sous-multiplicativité donne $\lVert I_{n} - AM_{k+1} \rVert_{2} \leqslant \lVert I_{n} - AM_{k} \rVert_{2}^{2}$, et une récurrence immédiate : 
    $$\boxed{\lVert I_{n} - AM_{k} \rVert_{2} \leqslant q^{2^{k}}}$$

    **2.** Par l'inégalité de Cauchy-Schwarz, 
    $$|(HX)_{i}|^{2} = \Big|\sum_{j} h_{ij}x_{j}\Big|^{2} \leqslant \Big(\sum_{j} h_{ij}^{2}\Big)\lVert X \rVert_{2}^{2},$$
     et l'on somme sur $i$. Si $(I_{n} - H)X = 0$, alors $X = HX$, donc $\lVert X \rVert_{2} \leqslant \lVert H \rVert_{2}\lVert X \rVert_{2}$, ce qui force $X = 0$. 
    $$\boxed{\lVert HX \rVert_{2} \leqslant \lVert H \rVert_{2}\lVert X \rVert_{2}, \qquad I_{n} - H \in \mathrm{GL}_{n}(\mathbb{R})}$$

    **3.** Avec $H = I_{n} - AM_{0}$, la matrice $AM_{0}$ est inversible, donc $A$ aussi, puisque $\det A \det M_{0} \neq 0$. La question 1 donne $AM_{k} \to I_{n}$, et l'exercice 20 permet de multiplier par la constante $A^{-1}$ : 
    $$\boxed{M_{k} = A^{-1}(AM_{k}) \to A^{-1}}$$

    **4.** L'erreur est élevée au carré à chaque étape : le nombre de chiffres exacts double, d'où le nom de convergence quadratique. Pour $q = \frac{1}{2}$, il faut $2^{k} \geqslant 12\log_{2}10 \approx 39{,}9$, soit $k = 6$ ; pour $k = 5$, $2^{-32} \approx 2{,}3 \times 10^{-10}$ ne suffit pas. 
    $$\boxed{6 \text{ itérations suffisent}}$$
     Chaque itération ne demande que deux produits de matrices, sans résolution de système : la méthode est utilisée en calcul numérique lorsque l'on dispose d'une bonne approximation initiale.
- id: "mp-04-55"
  feuille: "f-mp-04"
