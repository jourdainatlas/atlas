  enonce: |
    Montrer que l'ensemble des valeurs d'adhérence d'une suite de $E$ est un fermé de $E$. Est-il toujours non vide ?
  corrige: |
    Soit $\Lambda$ l'ensemble des valeurs d'adhérence de $(u_{n})$, et $(\lambda_{k})$ une suite de $\Lambda$ qui converge vers $\lambda$. On utilise la caractérisation de la proposition 8 (iii). Soit $\varepsilon > 0$ et $N \in \mathbb{N}$. On choisit $k$ tel que $\lVert \lambda_{k} - \lambda \rVert \leqslant \frac{\varepsilon}{2}$, puis, puisque $\lambda_{k}$ est valeur d'adhérence, un indice $n \geqslant N$ tel que $\lVert u_{n} - \lambda_{k} \rVert < \frac{\varepsilon}{2}$. Alors $\lVert u_{n} - \lambda \rVert < \varepsilon$, et $\lambda \in \Lambda$. Par le théorème 2 : 
    $$\boxed{\Lambda \text{ est fermé}}$$
     Il peut être vide : la suite réelle $(n)$ n'a aucune valeur d'adhérence, et la suite bornée $(\mathrm{e}^{\mathrm{i} nx})$ de l'exercice 19 non plus.
- id: "mp-04-41"
  feuille: "f-mp-04"
  numero: 41
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, ouverts, fermés]
  noeuds: [tr-ouverts, tr-adherence]
  notions: [ouvert, ferme]
  source: "Topologie (LLG), exercice 12"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $A$ une partie de $E$ à la fois ouverte et fermée. On suppose $A \neq \emptyset$ et $A \neq E$ ; soit $a \in A$ et $b \in E \setminus A$.

    **1.** On pose $T = \{t \in [0, 1] \mid \forall s \in [0, t], \ a + s(b - a) \in A\}$ et $\tau = \sup T$. Justifier l'existence de $\tau$.

    **2.** En utilisant que $A$ est fermé, montrer que $c = a + \tau(b - a)$ appartient à $A$. En utilisant que $A$ est ouvert, aboutir à une contradiction.

    **3.** Quelles sont les parties de $E$ à la fois ouvertes et fermées ?
  corrige: |
    **1.** L'ensemble $T$ contient $0$, puisque $a \in A$, et il est contenu dans $[0, 1]$ : il a une borne supérieure. De plus, si $t \in T$ et $s \leqslant t$, alors $s \in T$.

    **2.** Il existe une suite $(t_{k})$ de $T$ qui tend vers $\tau$. Les points $a + t_{k}(b - a)$ sont dans $A$ et tendent vers $c$ ; comme $A$ est fermé, $c \in A$. Pour $s < \tau$, il existe $t \in T$ avec $s < t$, donc $a + s(b - a) \in A$ : ainsi $\tau \in T$. Comme $b \notin A$, on a $\tau < 1$. Puisque $A$ est ouvert, il contient une boule $B(c, r)$. Pour $s \in [\tau, \tau + \delta]$, avec $\delta = \min\big(1 - \tau, \frac{r}{2\lVert b - a \rVert}\big)$, 
    $$\lVert a + s(b - a) - c \rVert = (s - \tau)\lVert b - a \rVert < r,$$
     donc $a + s(b - a) \in A$, et $\tau + \delta \in T$ : c'est contraire à la définition de $\tau$.

    **3.** Les parties $\emptyset$ et $E$ sont ouvertes et fermées (propositions 12 et 13), et ce sont les seules. 
    $$\boxed{\text{Les seules parties à la fois ouvertes et fermées de } E \text{ sont } \emptyset \text{ et } E}$$
     La preuve n'a utilisé que le segment $[a, b]$ : le chapitre 5 en fera une propriété des parties connexes par arcs, et l'exercice 49 montre qu'elle tombe en défaut dans $\mathbb{Q}$.
- id: "mp-04-42"
  feuille: "f-mp-04"
  numero: 42
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, boules, norme uniforme, ouverts, fermés]
  noeuds: [tr-ouverts, tr-adherence, gd-normes]
  notions: [ouvert, ferme, boule-ouverte]
  source: "Topologie (LLG), exercice 52"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    On munit l'espace $\ell^{\infty}$ des suites réelles bornées de la norme $\lVert \cdot \rVert_{\infty}$. On note $G$ l'ensemble des suites nulles à partir d'un certain rang, et $c_{0}$ l'ensemble des suites de limite nulle.

    **1.** Montrer que $G = \mathrm{Vect}(e_{p}, \ p \in \mathbb{N})$, où $e_{p}$ est la suite dont tous les termes sont nuls sauf celui d'indice $p$, égal à $1$.

    **2.** Montrer que $G$ n'est ni ouvert ni fermé dans $\ell^{\infty}$.

    **3.** Montrer que $\overline{G} = c_{0}$.
  corrige: |
    **1.** Une suite nulle à partir du rang $N$ s'écrit $\sum_{p < N} u_{p}e_{p}$ ; réciproquement, une combinaison linéaire finie des $e_{p}$ est nulle au-delà du plus grand indice utilisé. 
    $$\boxed{G = \mathrm{Vect}(e_{p}, \ p \in \mathbb{N})}$$

    **2.** Le sous-espace $G$ ne contient pas la suite constante égale à $1$ : par l'exercice 35, il est d'intérieur vide, donc il n'est pas ouvert. Il n'est pas fermé : les suites $u^{(N)} = \big(1, \frac{1}{2}, \dots, \frac{1}{N + 1}, 0, 0, \dots\big)$ sont dans $G$ et tendent vers $u = \big(\frac{1}{n + 1}\big)$, puisque $\lVert u^{(N)} - u \rVert_{\infty} = \frac{1}{N + 2}$, alors que $u \notin G$.

    **3.** L'ensemble $c_{0}$ est fermé : si $u^{(k)} \to u$ avec $u^{(k)} \in c_{0}$, on choisit $k$ tel que $\lVert u^{(k)} - u \rVert_{\infty} \leqslant \frac{\varepsilon}{2}$, puis $N$ tel que $|u^{(k)}_{n}| \leqslant \frac{\varepsilon}{2}$ pour $n \geqslant N$ ; alors $|u_{n}| \leqslant \varepsilon$ pour $n \geqslant N$. Comme $G \subset c_{0}$, on a $\overline{G} \subset c_{0}$. Réciproquement, si $u \in c_{0}$, ses tronquées $u^{(N)} = (u_{0}, \dots, u_{N}, 0, \dots)$ sont dans $G$ et $\lVert u - u^{(N)} \rVert_{\infty} = \sup_{n > N} |u_{n}| \to 0$. 
    $$\boxed{\overline{G} = c_{0}}$$
     La troncature est l'outil naturel pour approcher une suite ; elle converge exactement quand la queue de la suite devient petite, ce qui est la définition de $c_{0}$.
- id: "mp-04-43"
  feuille: "f-mp-04"
  numero: 43
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, boules, norme uniforme, fermés, adhérence et intérieur]
  noeuds: [tr-ouverts, tr-adherence, gd-normes]
  notions: [ouvert, ferme, boule-ouverte, adherence]
  source: "Topologie (LLG), exercices 53 et 55"
  page_enonce: 9
  page_corrige: 20
  enonce: |
    On note $\ell^{1}$ l'espace des suites réelles $u$ telles que la série $\sum |u_{n}|$ converge, muni de la norme $N_{1}(u) = \sum_{n=0}^{+\infty} |u_{n}|$.

    **1.** Vérifier que $N_{1}$ est une norme sur $\ell^{1}$, et que $\lVert u \rVert_{\infty} \leqslant N_{1}(u)$ pour tout $u \in \ell^{1}$.

    **2.** Montrer que la partie $F = \{u \in \ell^{1} \mid \forall n \in \mathbb{N}, \ u_{n} \geqslant 0\}$ est fermée et d'intérieur vide dans $(\ell^{1}, N_{1})$.

    **3.** On munit maintenant $\ell^{1}$ de la norme $\lVert \cdot \rVert_{\infty}$. La sphère unité $S$ de $N_{1}$ est-elle bornée ? fermée ? On pourra considérer les suites $\frac{1}{p}(e_{0} + \cdots + e_{p-1})$.
  corrige: |
    **1.** La série $\sum |u_{n} + v_{n}|$ est majorée terme à terme par la série convergente $\sum (|u_{n}| + |v_{n}|)$ : elle converge, et 
    $$N_{1}(u + v) \leqslant N_{1}(u) + N_{1}(v).$$
     L'homogénéité est claire, et une série de termes positifs de somme nulle a tous ses termes nuls. Enfin $|u_{n}| \leqslant N_{1}(u)$ pour tout $n$. 
    $$\boxed{\lVert u \rVert_{\infty} \leqslant N_{1}(u)}$$

    **2.** Si $u^{(k)} \to u$ pour $N_{1}$, avec $u^{(k)} \in F$, alors pour chaque $n$, $|u^{(k)}_{n} - u_{n}| \leqslant N_{1}(u^{(k)} - u) \to 0$ : l'inégalité $u^{(k)}_{n} \geqslant 0$ passe à la limite, et $F$ est fermé. Soit $u \in F$ et $r > 0$. Comme $u_{p} \to 0$, il existe $p$ tel que $u_{p} < \frac{r}{2}$, et la suite $v = u - \frac{r}{2}e_{p}$ vérifie $N_{1}(v - u) = \frac{r}{2} < r$ et $v_{p} < 0$ : aucune boule centrée en $u$ n'est contenue dans $F$. 
    $$\boxed{F \text{ est fermé et d'intérieur vide dans } (\ell^{1}, N_{1})}$$

    **3.** La sphère $S$ est bornée pour $\lVert \cdot \rVert_{\infty}$, puisque $\lVert u \rVert_{\infty} \leqslant N_{1}(u) = 1$. Les suites $v_{p} = \frac{1}{p}(e_{0} + \cdots + e_{p-1})$ sont dans $S$ et $\lVert v_{p} \rVert_{\infty} = \frac{1}{p} \to 0$, alors que $0 \notin S$. 
    $$\boxed{S \text{ est bornée mais non fermée dans } (\ell^{1}, \lVert \cdot \rVert_{\infty})}$$
     La masse totale $1$ de $v_{p}$ s'étale sur $p$ termes : invisible pour $\lVert \cdot \rVert_{\infty}$, elle reste entière pour $N_{1}$.
- id: "mp-04-44"
  feuille: "f-mp-04"
  numero: 44
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, norme uniforme, fermés, adhérence et intérieur, densité]
  noeuds: [tr-ouverts, tr-adherence, gd-normes, tr-dense]
  notions: [ouvert, ferme, adherence, partie-dense]
  source: "Topologie (LLG), exercice 54 ; Topologie des espaces normés (Prost), exercice 22"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Soit $E = \mathcal{C}([0, 1], \mathbb{R})$.

    **1.** On munit $E$ de $\lVert \cdot \rVert_{\infty}$, et l'on pose $F = \{f \in E \mid f(0) = f(1) = 0\}$. Montrer que $F$ est fermé et d'intérieur vide.

    **2.** On munit $E$ de $\lVert \cdot \rVert_{1}$. Montrer que $F$ est dense dans $E$. Quel est son intérieur ?

    **3.** On revient à $\lVert \cdot \rVert_{\infty}$, et l'on pose $A = \big\{f \in E \mid f(0) = 0 \text{ et } \int_{0}^{1} f \geqslant 1\big\}$. Montrer que $A$ est fermé, que $d_{A}(0) = 1$, et que cette distance n'est atteinte en aucun point de $A$.
  corrige: |
    **1.** Si $f_{n} \to f$ pour $\lVert \cdot \rVert_{\infty}$, alors $f_{n}(0) \to f(0)$ et $f_{n}(1) \to f(1)$ : les égalités $f_{n}(0) = f_{n}(1) = 0$ passent à la limite, et $F$ est fermé. Pour $f \in F$ et $r > 0$, la fonction $f + \frac{r}{2}$ est dans $B(f, r)$ mais pas dans $F$. 
    $$\boxed{F \text{ est fermé et d'intérieur vide pour } \lVert \cdot \rVert_{\infty}}$$

    **2.** Soit $g \in E$ et $h_{n} : t \mapsto \min(1, nt, n(1 - t))$. La fonction $gh_{n}$ est dans $F$, et $g - gh_{n} = g(1 - h_{n})$ est majorée par $\lVert g \rVert_{\infty}$ sur deux intervalles de longueur $\frac{1}{n}$ et nulle ailleurs : 
    $$\lVert g - gh_{n} \rVert_{1} \leqslant \lVert g \rVert_{\infty}\int_{0}^{1}(1 - h_{n}) = \frac{\lVert g \rVert_{\infty}}{n} \to 0.$$
     Son intérieur reste vide, par l'argument de la question 1, puisque $\lVert \frac{r}{2} \rVert_{1} = \frac{r}{2}$. 
    $$\boxed{F \text{ est dense et d'intérieur vide pour } \lVert \cdot \rVert_{1}}$$
     Le même hyperplan est fermé pour une norme et dense pour l'autre : c'est l'alternative de l'exercice 35.

    **3.** Si $f_{n} \to f$ uniformément avec $f_{n} \in A$, alors $f(0) = 0$ et $\big|\int_{0}^{1} f_{n} - \int_{0}^{1} f\big| \leqslant \lVert f_{n} - f \rVert_{\infty}$ : l'inégalité $\int f_{n} \geqslant 1$ passe à la limite, et $A$ est fermé. Pour $f \in A$, $\lVert f \rVert_{\infty} \geqslant \int_{0}^{1} f \geqslant 1$, d'où $d_{A}(0) \geqslant 1$. Les fonctions 
    $$f_{n} : t \mapsto \frac{\min(nt, 1)}{1 - \frac{1}{2n}}$$
     vérifient $f_{n}(0) = 0$, $\int_{0}^{1} f_{n} = 1$ et $\lVert f_{n} \rVert_{\infty} = \frac{1}{1 - \frac{1}{2n}} \to 1$. Si $\lVert f \rVert_{\infty} = 1$ avec $f \in A$, la fonction continue et positive $1 - f$ serait d'intégrale négative ou nulle, donc nulle, et $f = 1$ contredirait $f(0) = 0$. 
    $$\boxed{A \text{ est fermé, } d_{A}(0) = 1, \text{ et cette distance n'est pas atteinte}}$$
     *Piège.* Dans $\mathbb{R}^{n}$, la distance d'un point à un fermé non vide est toujours atteinte : on le montrera au chapitre 5, par compacité. Cet exemple montre que l'argument ne passe pas en dimension infinie.
- id: "mp-04-45"
  feuille: "f-mp-04"
  numero: 45
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, boules, norme uniforme, fermés, adhérence et intérieur, espaces de matrices]
  noeuds: [tr-ouverts, tr-adherence, gd-normes]
  notions: [ouvert, ferme, boule-ouverte, adherence]
  source: "Topologie des espaces normés (Prost), exercices 9 et 10 ; Topologie (LLG), exercice 40"
  page_enonce: 9
  page_corrige: 22
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{K})$, avec $n \geqslant 2$, de la norme $\lVert \cdot \rVert_{\infty}$.

    **1.** Montrer que l'ensemble $\mathcal{P}$ des matrices de projecteurs n'est pas borné et qu'il est d'intérieur vide. On rappelle qu'il est fermé (exemple du cours).

    **2.** Montrer que l'ensemble $\mathcal{N}$ des matrices nilpotentes est fermé, non borné et d'intérieur vide. On pourra utiliser le théorème de Cayley-Hamilton.
  corrige: |
    **1.** Pour $t \in \mathbb{K}$, la matrice $P_{t} = E_{11} + tE_{12}$ vérifie $P_{t}^{2} = E_{11} + tE_{12}$, car $E_{11}^{2} = E_{11}$, $E_{11}E_{12} = E_{12}$ et $E_{12}E_{11} = E_{12}^{2} = 0$ : c'est un projecteur, de norme $\max(1, |t|)$. Soit $A \in \mathcal{P}$ et $\varepsilon \in \, ]0, 1[$. On calcule 
    $$(A + \varepsilon I_{n})^{2} - (A + \varepsilon I_{n}) = \varepsilon\big(2A + (\varepsilon - 1)I_{n}\big).$$
     Si c'était nul, $A$ serait l'homothétie de rapport $\frac{1 - \varepsilon}{2} \notin \{0, 1\}$, qui n'est pas un projecteur. Donc $A + \varepsilon I_{n} \notin \mathcal{P}$, alors que $\lVert \varepsilon I_{n} \rVert_{\infty} = \varepsilon$. 
    $$\boxed{\mathcal{P} \text{ est fermé, non borné, d'intérieur vide}}$$

    **2.** Une matrice nilpotente a $0$ pour seule valeur propre complexe, donc $\chi_{A} = X^{n}$, et le théorème de Cayley-Hamilton (chapitre 3) donne $A^{n} = 0$ ; la réciproque est la définition. Ainsi $\mathcal{N} = \{A \mid A^{n} = 0\}$. Si $A_{k} \to A$ avec $A_{k}^{n} = 0$, l'exercice 20 donne $A_{k}^{n} \to A^{n}$, donc $A^{n} = 0$ : $\mathcal{N}$ est fermé. Les matrices $tE_{12}$ sont nilpotentes et de norme $|t|$. Enfin, si $A \in \mathcal{N}$ et $\varepsilon \neq 0$, la matrice $A + \varepsilon I_{n}$ a pour seule valeur propre $\varepsilon \neq 0$ : elle n'est pas nilpotente. 
    $$\boxed{\mathcal{N} = \{A \mid A^{n} = 0\} \text{ est fermé, non borné, d'intérieur vide}}$$
     *Piège.* Écrire « $A$ nilpotente $\iff \exists p, \ A^{p} = 0$ » ne suffit pas pour passer à la limite, car $p$ dépend de la matrice ; c'est l'exposant uniforme $n$, fourni par Cayley-Hamilton, qui rend l'argument possible.
- id: "mp-04-46"
  feuille: "f-mp-04"
  numero: 46
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, norme uniforme, ouverts, densité, espaces de matrices]
  noeuds: [tr-ouverts, tr-adherence, gd-normes, tr-dense]
  notions: [ouvert, ferme, partie-dense]
  source: "Topologie (LLG), exercice 40 ; Topologie des espaces normés (Prost), exercice 11"
  page_enonce: 9
  page_corrige: 22
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{K})$ de la norme $\lVert \cdot \rVert_{\infty}$.

    **1.** Soit $(A_{k})$ une suite de matrices qui converge vers $A$. Montrer que $\det A_{k} \to \det A$, et plus généralement que chaque coefficient de $\chi_{A_{k}}$ converge vers le coefficient correspondant de $\chi_{A}$.

    **2.** En déduire que $\mathrm{GL}_{n}(\mathbb{K})$ est un ouvert de $\mathcal{M}_{n}(\mathbb{K})$. On rappelle qu'il est dense (exemple du cours).

    **3.** Soit $A$, $B \in \mathcal{M}_{n}(\mathbb{K})$. Montrer que $\chi_{AB} = \chi_{BA}$ lorsque $A$ est inversible, puis dans le cas général à l'aide de la densité de $\mathrm{GL}_{n}(\mathbb{K})$.
  corrige: |
    **1.** Par la formule du déterminant (chapitre 17 de MPSI), $\det A = \sum_{\sigma} \varepsilon(\sigma)\prod_{j} a_{\sigma(j)j}$ est une somme de produits de coefficients ; si chaque coefficient de $A_{k}$ converge vers celui de $A$, sommes et produits passent à la limite. En développant $\det(XI_{n} - A)$ par la même formule, chaque coefficient de $\chi_{A}$ est une expression polynomiale à coefficients entiers en les coefficients de $A$. 
    $$\boxed{\det A_{k} \to \det A, \qquad \text{coefficients de } \chi_{A_{k}} \to \text{coefficients de } \chi_{A}}$$

    **2.** Le complémentaire de $\mathrm{GL}_{n}(\mathbb{K})$ est $\{A \mid \det A = 0\}$ ; par la question 1, il est fermé (théorème 2). 
    $$\boxed{\mathrm{GL}_{n}(\mathbb{K}) \text{ est un ouvert dense de } \mathcal{M}_{n}(\mathbb{K})}$$

    **3.** Si $A$ est inversible, $BA = A^{-1}(AB)A$ est semblable à $AB$, d'où $\chi_{AB} = \chi_{BA}$ (chapitre 2). Dans le cas général, les matrices $A_{k} = A - \frac{1}{k}I_{n}$ sont inversibles pour $k \geqslant k_{0}$ (exemple du cours), et $\chi_{A_{k}B} = \chi_{BA_{k}}$. Par l'exercice 20, $A_{k}B \to AB$ et $BA_{k} \to BA$, et par la question 1 les coefficients des deux membres passent à la limite. 
    $$\boxed{\chi_{AB} = \chi_{BA} \ \text{ pour toutes } A, B \in \mathcal{M}_{n}(\mathbb{K})}$$
     C'est la méthode annoncée dans le cours : établir une identité sur l'ouvert dense $\mathrm{GL}_{n}(\mathbb{K})$, puis la prolonger par passage à la limite. Le chapitre 2 l'avait obtenue par un calcul de déterminants par blocs.
- id: "mp-04-47"
  feuille: "f-mp-04"
  numero: 47
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, norme uniforme, densité, espaces de matrices]
  noeuds: [tr-ouverts, tr-adherence, gd-normes, tr-dense]
  notions: [ouvert, ferme, partie-dense]
  source: "Topologie des espaces normés (Prost), exercice 11 ; Topologie (LLG), exercice 46"
  page_enonce: 10
  page_corrige: 23
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{C})$ de la norme $\lVert \cdot \rVert_{\infty}$.

    **1.** Soit $P \in \mathrm{GL}_{n}(\mathbb{C})$. Montrer qu'il existe une constante $c_{P} > 0$ telle que $\lVert PMP^{-1} \rVert_{\infty} \leqslant c_{P}\lVert M \rVert_{\infty}$ pour toute matrice $M$.

    **2.** Soit $T$ une matrice triangulaire supérieure. Construire une suite $(D_{k})$ de matrices diagonales qui tend vers $0$ et telle que, pour tout $k$, les coefficients diagonaux de $T + D_{k}$ soient deux à deux distincts.

    **3.** En déduire que l'ensemble des matrices diagonalisables est dense dans $\mathcal{M}_{n}(\mathbb{C})$.
  corrige: |
    **1.** Le coefficient $(i, j)$ de $PMP^{-1}$ est $\sum_{k, l} p_{ik}m_{kl}q_{lj}$, où $P^{-1} = (q_{lj})$ : c'est une somme de $n^{2}$ termes. 
    $$\boxed{\lVert PMP^{-1} \rVert_{\infty} \leqslant c_{P}\lVert M \rVert_{\infty}, \qquad c_{P} = n^{2}\lVert P \rVert_{\infty}\lVert P^{-1} \rVert_{\infty}}$$

    **2.** Soit $t_{1}$, …, $t_{n}$ les coefficients diagonaux de $T$, et 
    $$D_{k} = \frac{1}{k}\operatorname{diag}(1, 2, \dots, n).$$
     L'égalité $t_{i} + \frac{i}{k} = t_{j} + \frac{j}{k}$, pour $i \neq j$, impose $k(t_{i} - t_{j}) = j - i$ : pour chaque paire, elle est vraie pour au plus une valeur de $k$. Il existe donc $k_{0}$ tel que, pour $k \geqslant k_{0}$, les coefficients diagonaux de $T + D_{k}$ soient deux à deux distincts ; on remplace $D_{k}$ par $D_{k + k_{0}}$. 
    $$\boxed{D_{k} \to 0 \ \text{ et } T + D_{k} \text{ a une diagonale à coefficients deux à deux distincts}}$$

    **3.** Toute matrice $A$ complexe est trigonalisable (chapitre 3) : on écrit $A = PTP^{-1}$, et l'on pose 
    $$A_{k} = P(T + D_{k})P^{-1}.$$
     Cette matrice a $n$ valeurs propres distinctes, les coefficients diagonaux de $T + D_{k}$ ; elle est donc diagonalisable (chapitre 2), et 
    $$\lVert A_{k} - A \rVert_{\infty} = \lVert PD_{k}P^{-1} \rVert_{\infty} \leqslant c_{P}\lVert D_{k} \rVert_{\infty} \to 0.$$

    $$\boxed{\text{Les matrices diagonalisables sont denses dans } \mathcal{M}_{n}(\mathbb{C})}$$
     On a même obtenu la densité des matrices à valeurs propres simples. Comme pour $\mathrm{GL}_{n}(\mathbb{K})$ (exercice 46), une identité continue vraie pour les matrices diagonalisables le sera pour toutes : c'est une démonstration possible du théorème de Cayley-Hamilton, une fois la continuité établie au chapitre 5.
- id: "mp-04-48"
  feuille: "f-mp-04"
  numero: 48
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [topologie, norme uniforme, suites extraites, ouverts, fermés, adhérence et intérieur, espaces de matrices]
  noeuds: [tr-ouverts, tr-adherence, gd-normes, ar-bw]
  notions: [ouvert, ferme, suite-extraite, adherence]
  source: "Topologie (LLG), exercice 39 ; Topologie des espaces normés (Prost), exercice 13"
  page_enonce: 10
  page_corrige: 23
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{K})$ de la norme $\lVert \cdot \rVert_{\infty}$. Pour $0 \leqslant p \leqslant n$, on note 
    $$S_{p} = \{M \mid \mathrm{rg} M \geqslant p\}, \qquad I_{p} = \{M \mid \mathrm{rg} M \leqslant p\}, \qquad A_{p} = \{M \mid \mathrm{rg} M = p\}.$$
     On rappelle (chapitre 16 de MPSI) que le rang d'une matrice est la taille maximale d'une matrice carrée inversible extraite.

    **1.** Montrer que $S_{p}$ est ouvert et que $I_{p}$ est fermé.

    **2.** Soit $M \in A_{p}$, que l'on écrit $M = QJ_{p}R$ avec $Q$, $R$ inversibles. Montrer que $M$ est limite d'une suite de matrices de rang $q$, pour tout $q \geqslant p$.

    **3.** En déduire que $\overline{A_{p}} = I_{p}$, puis que $A_{p}$ n'est ni ouvert ni fermé lorsque $1 \leqslant p \leqslant n - 1$. Que retrouve-t-on pour $p = n$ ?

    **4.** Déterminer l'intérieur de $A_{p}$ pour $0 \leqslant p \leqslant n$.
  corrige: |
    **1.** Le complémentaire de $S_{p}$ est $\{M \mid \mathrm{rg} M \leqslant p - 1\}$, c'est-à-dire l'ensemble des matrices dont toutes les matrices carrées extraites de taille $p$ ont un déterminant nul. Ces déterminants sont des expressions polynomiales en les coefficients : comme à l'exercice 46, si $M_{k} \to M$ et que les déterminants extraits de $M_{k}$ sont nuls, ceux de $M$ aussi. Le complémentaire de $S_{p}$ est fermé (et $S_{0} = \mathcal{M}_{n}(\mathbb{K})$). Enfin, $I_{p}$ est le complémentaire de $S_{p+1}$, ou $\mathcal{M}_{n}(\mathbb{K})$ entier si $p = n$. 
    $$\boxed{S_{p} \text{ est ouvert, } I_{p} \text{ est fermé}}$$

    **2.** Soit $q \in \llbracket p\,,n \rrbracket$ et $M_{k} = Q\big(J_{p} + \frac{1}{k}(J_{q} - J_{p})\big)R$. La matrice entre parenthèses est diagonale, avec $p$ coefficients égaux à $1$, puis $q - p$ égaux à $\frac{1}{k}$, puis des zéros : elle est de rang $q$, et $M_{k}$ aussi, puisque $Q$ et $R$ sont inversibles. Enfin $M_{k} - M = \frac{1}{k}Q(J_{q} - J_{p})R \to 0$. 
    $$\boxed{\forall q \geqslant p, \ M \in \overline{A_{q}}}$$

    **3.** Comme $A_{p} \subset I_{p}$ et $I_{p}$ est fermé, $\overline{A_{p}} \subset I_{p}$. Réciproquement, une matrice de rang $q \leqslant p$ est limite de matrices de rang $p$, par la question 2 appliquée avec les rôles de $p$ et $q$ échangés. 
    $$\boxed{\overline{A_{p}} = I_{p}}$$
     Pour $p \geqslant 1$, $0 \in I_{p} \setminus A_{p}$ : $A_{p}$ n'est pas fermé. Pour $p \leqslant n - 1$, toute $M \in A_{p}$ est limite de matrices de rang $p + 1$ : aucune boule centrée en $M$ n'est contenue dans $A_{p}$, qui n'est pas ouvert. Pour $p = n$, on retrouve que $A_{n} = \mathrm{GL}_{n}(\mathbb{K})$ est un ouvert dense (exercice 46).

    **4.** L'argument précédent montre que l'intérieur est vide pour $p \leqslant n - 1$, y compris pour $p = 0$ où $A_{0} = \{0\}$ ; pour $p = n$, $A_{n}$ est ouvert. 
    $$\boxed{\mathring{A_{p}} = \emptyset \ (p < n), \qquad \mathring{A_{n}} = \mathrm{GL}_{n}(\mathbb{K})}$$
     Le rang ne peut que « sauter vers le haut » par petite perturbation : c'est ce qu'exprime le fait que $S_{p}$ soit ouvert.
- id: "mp-04-49"
  feuille: "f-mp-04"
