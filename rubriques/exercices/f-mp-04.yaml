  noeuds: [gd-normes]
  notions: []
  source: "Normes (Prost), exercice 33 ; BibM@th, Espaces vectoriels normés, exercice 6 ; Topologie (LLG), exercice 10"
  page_enonce: 11
  page_corrige: 26
  enonce: |
    Soit $n \geqslant 2$. On note $E_{ij}$ les matrices élémentaires de $\mathcal{M}_{n}(\mathbb{R})$.

    **1.** Trouver une matrice $P \in \mathrm{GL}_{n}(\mathbb{R})$ telle que $P^{-1}E_{12}P = 2E_{12}$.

    **2.** En déduire qu'il n'existe aucune norme $N$ sur $\mathcal{M}_{n}(\mathbb{R})$ telle que $N(P^{-1}AP) = N(A)$ pour tous $A \in \mathcal{M}_{n}(\mathbb{R})$ et $P \in \mathrm{GL}_{n}(\mathbb{R})$.

    **3.** Montrer de même qu'il n'existe aucune norme $N$ telle que $N(AB) = N(BA)$ pour toutes matrices $A$ et $B$.

    **4.** L'application $A \mapsto |\operatorname{tr} A|$ vérifie-t-elle ces deux propriétés ? Quel axiome des normes lui manque-t-il ?
  corrige: |
    **1.** On cherche $P$ diagonale. Avec $P = \operatorname{diag}(1, 2, 1, \dots, 1)$, le seul coefficient non nul de $P^{-1}E_{12}P$ est en position $(1, 2)$ et vaut $1 \times 1 \times 2 = 2$. 
    $$\boxed{P = \operatorname{diag}(1, 2, 1, \dots, 1), \qquad P^{-1}E_{12}P = 2E_{12}}$$

    **2.** Si $N$ était invariante par conjugaison, on aurait 
    $$N(E_{12}) = N(2E_{12}) = 2N(E_{12}),$$
     donc $N(E_{12}) = 0$ et $E_{12} = 0$ : contradiction. 
    $$\boxed{\text{Aucune norme sur } \mathcal{M}_{n}(\mathbb{R}) \text{ n'est invariante par conjugaison}}$$

    **3.** Avec $A = E_{12}$ et $B = E_{22}$, on a $AB = E_{12}$ et $BA = 0$, d'où $N(E_{12}) = N(0) = 0$ : contradiction. 
    $$\boxed{\text{Aucune norme ne vérifie } N(AB) = N(BA)}$$

    **4.** La trace est invariante par similitude et vérifie $\operatorname{tr}(AB) = \operatorname{tr}(BA)$ (chapitre 16 de MPSI) ; $A \mapsto |\operatorname{tr} A|$ est homogène et sous-additive. Mais $\operatorname{tr} E_{12} = 0$ avec $E_{12} \neq 0$. 
    $$\boxed{|\operatorname{tr}| \text{ vérifie les deux propriétés, mais pas la séparation}}$$
     C'est une semi-norme. Une quantité invariante par similitude ne voit que la classe de la matrice, et la classe d'une nilpotente contient des matrices arbitrairement petites (question 1) : elle ne peut pas mesurer la taille.
