  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, boules, norme uniforme, suites extraites, normes équivalentes, ouverts, fermés, adhérence et intérieur]
  noeuds: [gd-normes, ar-bw, gd-equivalence, tr-ouverts, tr-adherence, tr-dense]
