  source: "exercice composé pour la feuille (Vrai ou faux)"
  page_enonce: 11
  page_corrige: 26
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. L'espace $E$ est un espace vectoriel normé non réduit à $\{0\}$.

    **1.** La frontière d'une partie de $E$ est toujours fermée.

    **2.** Sur $\mathbb{R}[X]$, deux normes quelconques sont équivalentes.

    **3.** Une partie de $E$ qui n'est pas ouverte est fermée.

    **4.** Si $N_{1}$ et $N_{2}$ sont deux normes sur $E$ telles que $N_{1} \leqslant N_{2}$, tout ouvert pour $N_{1}$ est un ouvert pour $N_{2}$.

    **5.** Toute suite bornée de $E$ possède une valeur d'adhérence.

    **6.** Pour $r > 0$, l'adhérence de la boule ouverte $B(a, r)$ est la boule fermée $B_{f}(a, r)$.

    **7.** Une réunion quelconque de parties fermées est fermée.

    **8.** Si les suites $(u_{2n})$ et $(u_{2n+1})$ convergent vers la même limite, la suite $(u_{n})$ converge.

    **9.** Le groupe $\mathrm{GL}_{n}(\mathbb{K})$ est un ouvert dense de $(\mathcal{M}_{n}(\mathbb{K}), \lVert \cdot \rVert_{\infty})$.

    **10.** Si $A$ est une partie dense de $E$, elle rencontre tout ouvert non vide de $E$.
  corrige: |
    **1. Vrai.** On a $\operatorname{Fr}(A) = \overline{A} \setminus \mathring{A} = \overline{A} \cap (E \setminus \mathring{A})$, et $E \setminus \mathring{A} = \overline{E \setminus A}$ (relation du cours) : la frontière est l'intersection de deux fermés.

    **2. Faux.** Les normes $N_{1}$ et $N_{\infty}$ de l'exercice 26 ne sont pas équivalentes : $N_{1}(S_{n}) = n + 1$ et $N_{\infty}(S_{n}) = 1$.

    **3. Faux.** L'intervalle $[0, 1[$ n'est ni ouvert ni fermé dans $\mathbb{R}$ : aucun intervalle centré en $0$ n'y est contenu, et $1 - \frac{1}{k} \to 1 \notin [0, 1[$.

    **4. Vrai.** L'inégalité $N_{1} \leqslant N_{2}$ donne $B_{N_{2}}(a, r) \subset B_{N_{1}}(a, r)$ : si une boule pour $N_{1}$ centrée en $a$ est dans $U$, la boule de même rayon pour $N_{2}$ aussi (exercice 26, question 4).

    **5. Faux.** La suite $(\mathrm{e}^{\mathrm{i} nx})$ de l'exercice 19 est bornée et n'a aucune valeur d'adhérence. Le résultat est vrai dans $\mathbb{R}$ (Bolzano-Weierstrass), et le chapitre 5 l'étendra à la dimension finie.

    **6. Vrai.** C'est la proposition 14 (iii), qui utilise $E \neq \{0\}$.

    **7. Faux.** Dans $\mathbb{R}$, la réunion des fermés $[\frac{1}{n}, 1]$, pour $n \geqslant 1$, est $]0, 1]$, qui n'est pas fermée. Seules les réunions finies de fermés sont fermées (proposition 13).

    **8. Vrai.** C'est l'exercice 14, question 1.

    **9. Vrai.** La densité est l'exemple du cours, l'ouverture l'exercice 46.

    **10. Vrai.** Soit $U$ un ouvert non vide, $x \in U$ et $B(x, r) \subset U$. Comme $x \in \overline{A}$, une suite $(a_{n})$ de $A$ tend vers $x$, et $a_{n} \in B(x, r) \subset U$ pour $n$ assez grand. 
    $$\boxed{\text{Vrai : } 1, 4, 6, 8, 9, 10 \qquad \text{Faux : } 2, 3, 5, 7}$$
     *À retenir.* Les affirmations 3 et 7 corrigent deux réflexes : « fermé » n'est pas le contraire d'« ouvert », et la stabilité par réunion ou intersection dépend du caractère fini de la famille.
- id: "mp-04-53"
  feuille: "f-mp-04"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
