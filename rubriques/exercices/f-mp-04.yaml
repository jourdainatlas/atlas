  enonce: |
    Si $A$ est une partie bornée non vide de $E$, on appelle *diamètre* de $A$ le réel $\delta(A) = \sup\limits_{x, y \in A} \lVert x - y \rVert$.

    **1.** Justifier l'existence de $\delta(A)$, et calculer le diamètre d'une boule $B_{f}(a, r)$ lorsque $E \neq \{0\}$.

    **2.** Soit $A$ et $B$ deux parties bornées non vides. Montrer que $A \subset B$ entraîne $\delta(A) \leqslant \delta(B)$, puis que $\delta(A \cup B) \leqslant \delta(A) + \delta(B)$ lorsque $A \cap B \neq \emptyset$.

    **3.** Montrer par un exemple que la dernière inégalité peut tomber en défaut si $A \cap B = \emptyset$.
  corrige: |
    **1.** La partie $A$ est bornée : il existe $M$ tel que $\lVert x \rVert \leqslant M$ pour $x \in A$, et alors $\lVert x - y \rVert \leqslant 2M$. L'ensemble des $\lVert x - y \rVert$, non vide et majoré, a une borne supérieure (chapitre 7 de MPSI). Pour la boule $B_{f}(a, r)$, l'inégalité triangulaire donne $\lVert x - y \rVert \leqslant \lVert x - a \rVert + \lVert a - y \rVert \leqslant 2r$, et les points $a \pm ru$, avec $u$ unitaire, sont à distance exactement $2r$. 
    $$\boxed{\delta\big(B_{f}(a, r)\big) = 2r}$$

    **2.** Si $A \subset B$, les distances entre points de $A$ sont des distances entre points de $B$, d'où $\delta(A) \leqslant \delta(B)$. Soit maintenant $c \in A \cap B$, et $x$, $y \in A \cup B$. Si $x$ et $y$ sont dans la même partie, $\lVert x - y \rVert$ est majoré par son diamètre. Si $x \in A$ et $y \in B$, on passe par $c$ : 
    $$\lVert x - y \rVert \leqslant \lVert x - c \rVert + \lVert c - y \rVert \leqslant \delta(A) + \delta(B).$$

    $$\boxed{\delta(A \cup B) \leqslant \delta(A) + \delta(B) \quad \text{si } A \cap B \neq \emptyset}$$

    **3.** Dans $\mathbb{R}$, les singletons $A = \{0\}$ et $B = \{1\}$ ont un diamètre nul, alors que $\delta(A \cup B) = 1$. 
    $$\boxed{\delta(\{0\} \cup \{1\}) = 1 > 0 = \delta(\{0\}) + \delta(\{1\})}$$
     Le point commun $c$ sert de relais : sans lui, la distance entre les deux parties n'est contrôlée par rien.
- id: "mp-04-04"
