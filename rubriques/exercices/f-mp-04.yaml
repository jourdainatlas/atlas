  source: "Topologie des espaces normés (Prost), exercice 12 ; Topologie (LLG), exercice 45"
  page_enonce: 14
  page_corrige: 32
  enonce: |
    *Adhérence des matrices diagonalisables réelles.* On munit $\mathcal{M}_{n}(\mathbb{R})$ de la norme $\lVert \cdot \rVert_{\infty}$. On note $\mathcal{T}_{n}$, $\mathcal{D}_{n}$ et $\mathcal{D}^{1}_{n}$ les ensembles des matrices de $\mathcal{M}_{n}(\mathbb{R})$ respectivement trigonalisables, diagonalisables, et possédant $n$ valeurs propres réelles distinctes.

    **1.** Soit $P \in \mathbb{R}[X]$ unitaire de degré $n \geqslant 1$. Montrer que $P$ est scindé sur $\mathbb{R}$ si et seulement si $|P(z)| \geqslant |\mathcal{I}m(z)|^{n}$ pour tout $z \in \mathbb{C}$.

    **2.** Soit $(A_{k})$ une suite de $\mathcal{T}_{n}$ qui converge vers $A$. Montrer que, pour tout $z \in \mathbb{C}$, $\chi_{A_{k}}(z) \to \chi_{A}(z)$, et en déduire que $\mathcal{T}_{n}$ est fermé.

    **3.** Montrer que $\mathcal{D}^{1}_{n} \subset \mathcal{D}_{n} \subset \mathcal{T}_{n}$, puis que $\mathcal{T}_{n} \subset \overline{\mathcal{D}^{1}_{n}}$, en adaptant l'exercice 47.

    **4.** En déduire que $\overline{\mathcal{D}_{n}} = \overline{\mathcal{D}^{1}_{n}} = \mathcal{T}_{n}$.

    **5.** On suppose $n \geqslant 2$. Montrer que $\mathcal{D}_{n}$ n'est ni fermé, ni dense dans $\mathcal{M}_{n}(\mathbb{R})$. Comparer avec l'exercice 47.
  corrige: |
    **1.** Si $P = \prod_{i}(X - \lambda_{i})$ avec les $\lambda_{i}$ réels, alors $|z - \lambda_{i}| \geqslant |\mathcal{I}m z|$ pour tout $i$, et le produit donne l'inégalité. Réciproquement, si $P$ a une racine non réelle $z_{0}$, alors $|P(z_{0})| = 0 < |\mathcal{I}m z_{0}|^{n}$. 
    $$\boxed{P \text{ scindé sur } \mathbb{R} \iff \forall z \in \mathbb{C}, \ |P(z)| \geqslant |\mathcal{I}m z|^{n}}$$
     L'intérêt de cette caractérisation est qu'elle est faite d'inégalités larges, qui passent à la limite.

    **2.** Par l'exercice 46, les coefficients de $\chi_{A_{k}}$ tendent vers ceux de $\chi_{A}$, donc $\chi_{A_{k}}(z) \to \chi_{A}(z)$ pour tout $z$. Une matrice est trigonalisable si et seulement si son polynôme caractéristique est scindé (chapitre 3, théorème 5). Si $A_{k} \in \mathcal{T}_{n}$, alors $|\chi_{A_{k}}(z)| \geqslant |\mathcal{I}m z|^{n}$, et l'inégalité passe à la limite : $\chi_{A}$ est scindé, et $A \in \mathcal{T}_{n}$. 
    $$\boxed{\mathcal{T}_{n} \text{ est fermé}}$$

    **3.** Une matrice qui a $n$ valeurs propres distinctes est diagonalisable (chapitre 2), et une matrice diagonalisable est trigonalisable. Soit $A \in \mathcal{T}_{n}$ : $A = PTP^{-1}$ avec $P \in \mathrm{GL}_{n}(\mathbb{R})$ et $T$ réelle triangulaire supérieure. Avec les matrices $D_{k}$ de l'exercice 47, $P(T + D_{k})P^{-1}$ a $n$ valeurs propres réelles distinctes et tend vers $A$, par la même majoration. 
    $$\boxed{\mathcal{D}^{1}_{n} \subset \mathcal{D}_{n} \subset \mathcal{T}_{n} \subset \overline{\mathcal{D}^{1}_{n}}}$$

    **4.** En passant à l'adhérence, qui est croissante, et en utilisant que $\mathcal{T}_{n}$ est fermé : 
    $$\overline{\mathcal{D}^{1}_{n}} \subset \overline{\mathcal{D}_{n}} \subset \overline{\mathcal{T}_{n}} = \mathcal{T}_{n} \subset \overline{\mathcal{D}^{1}_{n}}.$$

    $$\boxed{\overline{\mathcal{D}_{n}} = \overline{\mathcal{D}^{1}_{n}} = \mathcal{T}_{n}}$$

    **5.** La matrice $E_{12}$ est trigonalisable, et non diagonalisable puisqu'elle est nilpotente non nulle ; elle est dans $\overline{\mathcal{D}_{n}} \setminus \mathcal{D}_{n}$, qui n'est donc pas fermé. La matrice par blocs $R = \operatorname{diag}\Big(\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}, I_{n-2}\Big)$ a pour polynôme caractéristique $(X^{2} + 1)(X - 1)^{n-2}$, non scindé sur $\mathbb{R}$ : elle n'est pas dans $\mathcal{T}_{n} = \overline{\mathcal{D}_{n}}$. 
    $$\boxed{\mathcal{D}_{n} \text{ n'est ni fermé, ni dense dans } \mathcal{M}_{n}(\mathbb{R}) \ (n \geqslant 2)}$$
     Dans $\mathcal{M}_{n}(\mathbb{C})$, toute matrice est trigonalisable, et la même démonstration donne la densité de l'exercice 47. Sur $\mathbb{R}$, les valeurs propres non réelles d'une matrice comme $R$ ne peuvent pas devenir réelles par petite perturbation : la caractérisation de la question 1 montre même que le complémentaire de $\mathcal{T}_{n}$ est un ouvert.

