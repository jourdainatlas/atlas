  enonce: |
    **1.** Montrer que, pour tous $x$, $y$, $z$, $t \in E$, 
    $$\lVert x - y \rVert + \lVert z - t \rVert \leqslant \lVert x - z \rVert + \lVert y - t \rVert + \lVert x - t \rVert + \lVert y - z \rVert.$$

    **2.** Montrer que, pour tous $x$, $y \in E$, $\lVert x \rVert + \lVert y \rVert \leqslant 2\max\big(\lVert x + y \rVert, \lVert x - y \rVert\big)$, et que la constante $2$ est la meilleure possible lorsque $E = \mathbb{R}^{2}$ est muni de $\lVert \cdot \rVert_{\infty}$.

    **3.** On suppose que la norme est associée à un produit scalaire. Montrer que la constante $2$ peut être remplacée par $\sqrt{2}$, et que cette nouvelle constante est optimale.
  corrige: |
    **1.** On majore chaque terme de deux façons, en passant par l'un ou l'autre des points restants, puis on fait la moyenne : 
    $$\lVert x - y \rVert \leqslant \tfrac{1}{2}\big(\lVert x - z \rVert + \lVert z - y \rVert + \lVert x - t \rVert + \lVert t - y \rVert\big),$$

    $$\lVert z - t \rVert \leqslant \tfrac{1}{2}\big(\lVert z - x \rVert + \lVert x - t \rVert + \lVert z - y \rVert + \lVert y - t \rVert\big).$$
     En sommant, chacun des quatre termes du membre de droite apparaît deux fois avec le coefficient $\frac{1}{2}$. 
    $$\boxed{\lVert x - y \rVert + \lVert z - t \rVert \leqslant \lVert x - z \rVert + \lVert y - t \rVert + \lVert x - t \rVert + \lVert y - z \rVert}$$

    **2.** On écrit $2x = (x + y) + (x - y)$ et $2y = (x + y) - (x - y)$, d'où $2\lVert x \rVert \leqslant 2\max\big(\lVert x + y \rVert, \lVert x - y \rVert\big)$, et de même pour $y$. En sommant : 
    $$\boxed{\lVert x \rVert + \lVert y \rVert \leqslant 2\max\big(\lVert x + y \rVert, \lVert x - y \rVert\big)}$$
     Pour $\lVert \cdot \rVert_{\infty}$ sur $\mathbb{R}^{2}$, avec $x = (1, 0)$ et $y = (0, 1)$, on a $\lVert x \rVert + \lVert y \rVert = 2$ et $\lVert x \pm y \rVert_{\infty} = 1$ : l'égalité a lieu, et la constante $2$ est optimale.

    **3.** On utilise l'identité du parallélogramme (exercice 8) et $(\alpha + \beta)^{2} \leqslant 2(\alpha^{2} + \beta^{2})$ : 
    $$\big(\lVert x \rVert + \lVert y \rVert\big)^{2} \leqslant 2\lVert x \rVert^{2} + 2\lVert y \rVert^{2} = \lVert x + y \rVert^{2} + \lVert x - y \rVert^{2} \leqslant 2\max\big(\lVert x + y \rVert, \lVert x - y \rVert\big)^{2}.$$

    $$\boxed{\lVert x \rVert + \lVert y \rVert \leqslant \sqrt{2}\max\big(\lVert x + y \rVert, \lVert x - y \rVert\big)}$$
     Si $x$ et $y$ sont orthogonaux et unitaires, $\lVert x \rVert + \lVert y \rVert = 2$ et $\lVert x \pm y \rVert = \sqrt{2}$ (Pythagore) : l'égalité a lieu, et $\sqrt{2}$ est optimale dès que $\dim E \geqslant 2$. La comparaison des questions 2 et 3 montre qu'une norme euclidienne est « plus ronde » : ses boules n'ont pas de coin.
- id: "mp-04-08"
