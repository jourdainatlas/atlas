  enonce: |
    Soit $g \in \mathcal{C}([0, 1], \mathbb{R})$ et, pour $f \in \mathcal{C}([0, 1], \mathbb{R})$, $N_{g}(f) = \lVert fg \rVert_{\infty}$.

    **1.** Montrer que $N_{g}$ est une norme si et seulement si l'ensemble des zéros de $g$ ne contient aucun intervalle non trivial.

    **2.** On suppose que $N_{g}$ est une norme. Montrer que $N_{g}$ et $\lVert \cdot \rVert_{\infty}$ sont équivalentes si et seulement si $g$ ne s'annule pas sur $[0, 1]$.
  corrige: |
    **1.** L'homogénéité et l'inégalité triangulaire sont celles de $\lVert \cdot \rVert_{\infty}$ ; seule la séparation est en jeu : $fg = 0 \implies f = 0$. Si $g$ est nulle sur un intervalle $[c, d]$ avec $c < d$, une fonction « chapeau » non nulle, à support dans $[c, d]$, vérifie $fg = 0$. Réciproquement, si les zéros de $g$ ne contiennent aucun intervalle non trivial, l'ensemble $\{g \neq 0\}$ rencontre tout intervalle, donc il est dense dans $[0, 1]$ ; si $fg = 0$, la fonction continue $f$ est nulle sur cet ensemble dense, donc partout (théorème 2). 
    $$\boxed{N_{g} \text{ est une norme} \iff \text{les zéros de } g \text{ ne contiennent aucun intervalle non trivial}}$$

    **2.** Si $g$ ne s'annule pas, la fonction continue $|g|$ atteint sur le segment $[0, 1]$ un minimum $m > 0$ (théorème des bornes atteintes, vu en MPSI), et $m\lVert f \rVert_{\infty} \leqslant N_{g}(f) \leqslant \lVert g \rVert_{\infty}\lVert f \rVert_{\infty}$. Si $g(c) = 0$, soit $h_{n}$ la fonction chapeau de hauteur $1$ en $c$ et de support $[c - \frac{1}{n}, c + \frac{1}{n}] \cap [0, 1]$ : $\lVert h_{n} \rVert_{\infty} = 1$ et $N_{g}(h_{n}) \leqslant \sup_{|t - c| \leqslant 1/n} |g(t)| \to 0$ par continuité de $g$ en $c$. 
    $$\boxed{N_{g} \sim \lVert \cdot \rVert_{\infty} \iff g \text{ ne s'annule pas sur } [0, 1]}$$
- id: "mp-04-33"
  feuille: "f-mp-04"
  numero: 33
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, normes équivalentes, normes sur les polynômes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes]
  source: "Normes (Prost), exercice 26"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $[a, b]$ et $[c, d]$ deux segments de $\mathbb{R}$, non réduits à un point, tels que $b < c$. Pour $P \in \mathbb{R}[X]$, on pose $N_{1}(P) = \sup_{[a, b]} |P|$ et $N_{2}(P) = \sup_{[c, d]} |P|$.

    **1.** Montrer que $N_{1}$ et $N_{2}$ sont des normes sur $\mathbb{R}[X]$.

    **2.** En considérant les polynômes $P_{n} = \Big(\frac{2X - a - b}{b - a}\Big)^{n}$, montrer que $N_{1}$ et $N_{2}$ ne sont pas équivalentes.
  corrige: |
    **1.** Chaque segment est infini et borné : c'est l'exercice 11.

    **2.** On pose $\alpha = \frac{a + b}{2}$ et $\beta = \frac{b - a}{2}$, de sorte que $P_{n} = \big(\frac{X - \alpha}{\beta}\big)^{n}$. Sur $[a, b]$, $|t - \alpha| \leqslant \beta$, avec égalité en $a$ : $N_{1}(P_{n}) = 1$. Sur $[c, d]$, $t - \alpha \geqslant c - \alpha > b - \alpha = \beta$, d'où 
    $$N_{2}(P_{n}) \geqslant \Big(\frac{c - \alpha}{\beta}\Big)^{n} \to +\infty.$$

    $$\boxed{N_{1} \text{ et } N_{2} \text{ ne sont pas équivalentes}}$$
     Un polynôme peut être petit sur un segment et énorme sur un autre : c'est ce qu'exploite l'interpolation, et ce qui rend la connaissance de $P$ sur $[a, b]$ inutilisable pour le contrôler ailleurs. La source passait par le théorème d'approximation de Weierstrass ; l'exemple explicite suffit.
- id: "mp-04-34"
  feuille: "f-mp-04"
  numero: 34
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, normes équivalentes]
  noeuds: [gd-equivalence]
  notions: [normes-equivalentes]
  source: "Normes (Prost), exercice 27 ; Topologie (LLG), exercice 4"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $u = (u_{k})$ une suite réelle. Pour $P = \sum_{k \geqslant 0} a_{k}X^{k} \in \mathbb{R}[X]$, on pose $N_{u}(P) = \sum_{k \geqslant 0} u_{k}|a_{k}|$.

    **1.** Donner une condition nécessaire et suffisante sur $u$ pour que $N_{u}$ soit une norme sur $\mathbb{R}[X]$.

    **2.** On suppose cette condition remplie par deux suites $u$ et $v$. Montrer que $N_{u}$ et $N_{v}$ sont équivalentes si et seulement si la suite $\big(\frac{u_{k}}{v_{k}}\big)$ est minorée et majorée par des constantes strictement positives.

    **3.** Pour quelles suites $u$ la suite $(X^{n})$ converge-t-elle vers $0$ pour $N_{u}$ ?
  corrige: |
    **1.** Si $u_{k} \leqslant 0$ pour un $k$, alors $N_{u}(X^{k}) = u_{k} \leqslant 0$ avec $X^{k} \neq 0$. Si tous les $u_{k}$ sont strictement positifs, $N_{u}$ est une norme, comme à l'exercice 5. 
    $$\boxed{N_{u} \text{ est une norme} \iff \forall k, \ u_{k} > 0}$$

    **2.** Si $\alpha v_{k} \leqslant u_{k} \leqslant \beta v_{k}$ pour tout $k$, on multiplie par $|a_{k}|$ et l'on somme : $\alpha N_{v} \leqslant N_{u} \leqslant \beta N_{v}$. Réciproquement, si ces inégalités sont vraies, on les applique à $X^{k}$ : $\alpha v_{k} \leqslant u_{k} \leqslant \beta v_{k}$. 
    $$\boxed{N_{u} \sim N_{v} \iff \exists \alpha, \beta > 0, \ \forall k, \ \alpha \leqslant \frac{u_{k}}{v_{k}} \leqslant \beta}$$

    **3.** On a $N_{u}(X^{n}) = u_{n}$. 
    $$\boxed{X^{n} \to 0 \text{ pour } N_{u} \iff u_{n} \to 0}$$
     Les poids décident de tout : avec $u_{k} = 2^{-k}$, la suite $(X^{n})$ tend vers $0$ ; avec $u_{k} = 1$, elle reste sur la sphère unité.
- id: "mp-04-35"
  feuille: "f-mp-04"
  numero: 35
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [topologie, fermés, adhérence et intérieur, densité]
  noeuds: [tr-ouverts, tr-adherence, tr-dense]
  notions: [ouvert, ferme, adherence, partie-dense]
  source: "Topologie (LLG), exercices 11 et 62 ; Topologie des espaces normés (Prost), exercice 3"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $F$ un sous-espace vectoriel de $E$.

    **1.** Montrer que si $F$ est d'intérieur non vide, alors $F = E$.

    **2.** Montrer que $\overline{F}$ est un sous-espace vectoriel de $E$.

    **3.** En déduire qu'un hyperplan de $E$ est soit fermé, soit dense dans $E$.
  corrige: |
    **1.** Soit $a \in F$ et $r > 0$ tels que $B(a, r) \subset F$. Pour $x \in E$ non nul, le vecteur $a + \frac{r}{2\lVert x \rVert}x$ est dans $B(a, r)$, donc dans $F$ ; comme $F$ est un sous-espace contenant $a$, il contient la différence, puis $x$. 
    $$\boxed{\mathring{F} \neq \emptyset \implies F = E}$$

    **2.** Le vecteur nul est dans $F \subset \overline{F}$. Si $x$, $y \in \overline{F}$ et $\lambda \in \mathbb{K}$, il existe des suites $(x_{n})$ et $(y_{n})$ de $F$ qui convergent vers $x$ et $y$ (théorème 2) ; alors $x_{n} + \lambda y_{n} \in F$ et $x_{n} + \lambda y_{n} \to x + \lambda y$ (proposition 6), donc $x + \lambda y \in \overline{F}$. 
    $$\boxed{\overline{F} \text{ est un sous-espace vectoriel}}$$

    **3.** Soit $H$ un hyperplan. Un sous-espace $G$ qui contient strictement $H$ contient un vecteur $x \notin H$, donc $H \oplus \mathbb{K} x = E$ : c'est $E$. Le sous-espace $\overline{H}$ contient $H$ : il est égal à $H$ ou à $E$. 
    $$\boxed{\text{Un hyperplan est fermé } (\overline{H} = H) \text{ ou dense } (\overline{H} = E)}$$
     Les deux cas se produisent dans $\mathcal{C}([0, 1], \mathbb{R})$ : l'hyperplan $\{f \mid f(0) = 0\}$ est fermé pour $\lVert \cdot \rVert_{\infty}$ et dense pour $\lVert \cdot \rVert_{1}$ (exercice 44). Le chapitre 5 reliera cette alternative à la continuité de la forme linéaire qui définit $H$.
- id: "mp-04-36"
  feuille: "f-mp-04"
  numero: 36
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 1
  types: [Calcul]
  mots_cles: [topologie, norme uniforme, ouverts, fermés, adhérence et intérieur]
  noeuds: [tr-ouverts, tr-adherence, gd-normes]
  notions: [ouvert, ferme, adherence]
  source: "Topologie des espaces normés (Prost), exercice 5"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    On munit $\mathbb{R}^{3}$ de la norme $\lVert \cdot \rVert_{\infty}$. L'ensemble $\Omega$ des triplets $(a, b, c)$ tels que $aX^{2} + bX + c$ soit un trinôme du second degré sans racine réelle est-il ouvert ? fermé ? Déterminer son adhérence.
  corrige: |
    Un trinôme $aX^{2} + bX + c$ est du second degré sans racine réelle si et seulement si $a \neq 0$ et $b^{2} - 4ac < 0$. La seconde condition entraîne $ac > 0$, donc la première : 
    $$\Omega = \{(a, b, c) \mid b^{2} - 4ac < 0\}.$$
     Montrons que le complémentaire $\{b^{2} - 4ac \geqslant 0\}$ est fermé. Si $(a_{k}, b_{k}, c_{k})$ y converge vers $(a, b, c)$, chaque coordonnée converge (proposition 7), donc $b_{k}^{2} - 4a_{k}c_{k} \to b^{2} - 4ac$, et l'inégalité large passe à la limite. Ainsi $\Omega$ est ouvert. Il n'est pas fermé, puisque $(\frac{1}{k}, 0, \frac{1}{k}) \in \Omega$ tend vers $(0, 0, 0) \notin \Omega$.

    Par le même argument, $\{b^{2} \leqslant 4ac\}$ est fermé et contient $\Omega$, donc son adhérence. Réciproquement, soit $(a, b, c)$ tel que $b^{2} = 4ac$. Si $a > 0$, les triplets $(a, b, c + \frac{1}{k})$ sont dans $\Omega$ ; si $a < 0$, ce sont les $(a, b, c - \frac{1}{k})$. Si $a = 0$, alors $b = 0$, et l'on prend $(\frac{1}{k}, 0, c + \frac{1}{k})$ si $c \geqslant 0$, $(-\frac{1}{k}, 0, c)$ si $c < 0$. 
    $$\boxed{\Omega \text{ est ouvert, non fermé, et } \overline{\Omega} = \{(a, b, c) \mid b^{2} \leqslant 4ac\}}$$
     *Piège.* L'adhérence n'est pas « les trinômes du second degré ayant au plus une racine réelle double » : elle contient aussi des triplets avec $a = 0$, comme $(0, 0, 5)$, qui ne sont plus du second degré.
- id: "mp-04-37"
  feuille: "f-mp-04"
