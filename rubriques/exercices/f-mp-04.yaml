  notions: [norme, boule-ouverte, ferme]
  source: "Normes (Prost), exercice 2 ; BibM@th, Espaces vectoriels normés, exercice 4"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** Soit $N_{1}$ et $N_{2}$ deux normes sur $E$, et $B_{1}$, $B_{2}$ leurs boules unités fermées. Montrer que $B_{1} = B_{2}$ si et seulement si $N_{1} = N_{2}$.

    **2.** On suppose $E \neq \{0\}$. Soit $a$, $b \in E$ et $r$, $s > 0$ tels que $B_{f}(a, r) = B_{f}(b, s)$. Montrer que $r = s$, puis que $a = b$. On pourra considérer les points $a \pm r\,u$, où $u$ est un vecteur unitaire bien choisi.
  corrige: |
    **1.** Le sens réciproque est évident. Supposons $B_{1} = B_{2}$, et soit $x \neq 0$. Le vecteur $\frac{x}{N_{1}(x)}$ est de norme $1$ pour $N_{1}$ : il appartient à $B_{1} = B_{2}$, donc $N_{2}\big(\frac{x}{N_{1}(x)}\big) \leqslant 1$, c'est-à-dire $N_{2}(x) \leqslant N_{1}(x)$. Par symétrie des rôles, $N_{1}(x) \leqslant N_{2}(x)$. 
    $$\boxed{B_{1} = B_{2} \iff N_{1} = N_{2}}$$

    **2.** On compare d'abord les rayons. Soit $u$ un vecteur unitaire, qui existe puisque $E \neq \{0\}$. Les points $a + ru$ et $a - ru$ sont dans $B_{f}(a, r) = B_{f}(b, s)$, donc 
    $$2r = \lVert (a + ru) - (a - ru) \rVert \leqslant \lVert a + ru - b \rVert + \lVert b - (a - ru) \rVert \leqslant 2s.$$
     Ainsi $r \leqslant s$, et par symétrie $r = s$. Supposons ensuite $a \neq b$, et posons $u = \frac{a - b}{\lVert a - b \rVert}$. Le point $a + ru$ est dans $B_{f}(a, r) = B_{f}(b, r)$, et $a + ru - b = (\lVert a - b \rVert + r)u$, d'où $\lVert a - b \rVert + r \leqslant r$ : contradiction. 
    $$\boxed{B_{f}(a, r) = B_{f}(b, s) \implies a = b \ \text{ et } \ r = s}$$
     *Piège.* L'hypothèse $E \neq \{0\}$ est indispensable : dans l'espace nul, toutes les boules sont égales à $\{0\}$, quel que soit leur rayon.
