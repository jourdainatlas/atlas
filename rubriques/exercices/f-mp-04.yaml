  source: "exercice composé pour la feuille"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    **1.** Dans $\mathbb{R}$, on pose $A = [0, 1[ \cup \{2\}$. Montrer que $\{2\}$ est à la fois un ouvert relatif et un fermé relatif de $A$, sans être un ouvert de $\mathbb{R}$. Montrer que $[\frac{1}{2}, 1[$ est un fermé relatif de $A$, sans être un fermé de $\mathbb{R}$. Est-ce un ouvert relatif de $A$ ?

    **2.** Montrer que $Q = \mathbb{Q} \cap \, ]-\sqrt{2}, \sqrt{2}[$ est à la fois un ouvert relatif et un fermé relatif de $\mathbb{Q}$. Comparer avec l'exercice 41.

    **3.** Montrer que toute partie de $\mathbb{Z}$ est à la fois un ouvert relatif et un fermé relatif de $\mathbb{Z}$.
  corrige: |
    **1.** On utilise le théorème 3. On a $\{2\} = A \cap \, ]\frac{3}{2}, \frac{5}{2}[ = A \cap [2, 2]$ : c'est à la fois un ouvert relatif et un fermé relatif de $A$. Ce n'est pas un ouvert de $\mathbb{R}$, puisqu'il ne contient aucun intervalle centré en $2$. Ensuite $[\frac{1}{2}, 1[ \, = A \cap [\frac{1}{2}, \frac{3}{2}]$ est un fermé relatif, mais pas un fermé de $\mathbb{R}$, puisque $1 - \frac{1}{k} \to 1$. Ce n'est pas un ouvert relatif : tout $A \cap \, ]\frac{1}{2} - r, \frac{1}{2} + r[$ contient des points de $A$ inférieurs à $\frac{1}{2}$. 
    $$\boxed{\{2\} \text{ ouvert et fermé relatif ; } [\tfrac{1}{2}, 1[ \text{ fermé relatif, non ouvert relatif}}$$

    **2.** Comme $\pm\sqrt{2} \notin \mathbb{Q}$, on a $Q = \mathbb{Q} \cap \, ]-\sqrt{2}, \sqrt{2}[ \, = \mathbb{Q} \cap [-\sqrt{2}, \sqrt{2}]$, intersection de $\mathbb{Q}$ avec un ouvert et avec un fermé de $\mathbb{R}$. 
    $$\boxed{Q \text{ est à la fois ouvert et fermé relatif dans } \mathbb{Q}, \text{ sans être } \emptyset \text{ ni } \mathbb{Q}}$$
     Dans un espace vectoriel normé, l'exercice 41 interdit cette situation. L'argument y suivait un segment de $a$ à $b$ ; dans $\mathbb{Q}$, un tel segment sort de la partie, et l'on peut « couper » $\mathbb{Q}$ en $\pm\sqrt{2}$ sans rencontrer aucun de ses points.

    **3.** Pour $S \subset \mathbb{Z}$, on a $S = \mathbb{Z} \cap \bigcup_{s \in S} \, ]s - \frac{1}{2}, s + \frac{1}{2}[$, intersection de $\mathbb{Z}$ avec un ouvert : $S$ est un ouvert relatif. Son complémentaire dans $\mathbb{Z}$ l'est aussi, donc $S$ est un fermé relatif. 
    $$\boxed{\text{Toute partie de } \mathbb{Z} \text{ est ouverte et fermée relativement à } \mathbb{Z}}$$
- id: "mp-04-50"
  feuille: "f-mp-04"
  numero: 50
