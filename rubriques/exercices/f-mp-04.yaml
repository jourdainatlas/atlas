  enonce: |
    *Inégalités de Hölder et de Minkowski.* Soit $p > 1$ et $q > 1$ tels que $\frac{1}{p} + \frac{1}{q} = 1$. Pour $x \in \mathbb{K}^{n}$, on pose $\lVert x \rVert_{p} = \big(\sum_{k=1}^{n} |x_{k}|^{p}\big)^{1/p}$.

    **1.** Montrer que $\alpha\beta \leqslant \frac{\alpha^{p}}{p} + \frac{\beta^{q}}{q}$ pour tous réels $\alpha$, $\beta \geqslant 0$, à l'aide de la concavité du logarithme.

    **2.** En déduire l'inégalité de Hölder : $\sum_{k=1}^{n} |x_{k}y_{k}| \leqslant \lVert x \rVert_{p}\lVert y \rVert_{q}$ pour $x$, $y \in \mathbb{K}^{n}$. On commencera par le cas $\lVert x \rVert_{p} = \lVert y \rVert_{q} = 1$.

    **3.** Établir l'inégalité 
    $$\sum_{k=1}^{n} |x_{k} + y_{k}|^{p} \leqslant \sum_{k=1}^{n} |x_{k}|\,|x_{k} + y_{k}|^{p-1} + \sum_{k=1}^{n} |y_{k}|\,|x_{k} + y_{k}|^{p-1},$$
     puis l'inégalité de Minkowski $\lVert x + y \rVert_{p} \leqslant \lVert x \rVert_{p} + \lVert y \rVert_{p}$. En déduire que $\lVert \cdot \rVert_{p}$ est une norme sur $\mathbb{K}^{n}$ pour tout $p \geqslant 1$.

    **4.** Montrer que, pour tout $x \in \mathbb{K}^{n}$, $\lVert x \rVert_{p} \to \lVert x \rVert_{\infty}$ lorsque $p \to +\infty$.
  corrige: |
    **1.** Si $\alpha$ ou $\beta$ est nul, l'inégalité est évidente. Sinon, la concavité du logarithme, avec les poids $\frac{1}{p}$ et $\frac{1}{q}$ de somme $1$, donne 
    $$\ln\Big(\frac{\alpha^{p}}{p} + \frac{\beta^{q}}{q}\Big) \geqslant \frac{1}{p}\ln(\alpha^{p}) + \frac{1}{q}\ln(\beta^{q}) = \ln(\alpha\beta),$$
     et l'on conclut par croissance de l'exponentielle. 
    $$\boxed{\alpha\beta \leqslant \frac{\alpha^{p}}{p} + \frac{\beta^{q}}{q}}$$

    **2.** Si $x = 0$ ou $y = 0$, il n'y a rien à montrer. Si $\lVert x \rVert_{p} = \lVert y \rVert_{q} = 1$, la question 1 appliquée à chaque terme donne 
    $$\sum_{k} |x_{k}y_{k}| \leqslant \frac{1}{p}\sum_{k} |x_{k}|^{p} + \frac{1}{q}\sum_{k} |y_{k}|^{q} = \frac{1}{p} + \frac{1}{q} = 1.$$
     Dans le cas général, on applique ce résultat à $\frac{x}{\lVert x \rVert_{p}}$ et $\frac{y}{\lVert y \rVert_{q}}$, puis on multiplie par $\lVert x \rVert_{p}\lVert y \rVert_{q}$. 
    $$\boxed{\sum_{k=1}^{n} |x_{k}y_{k}| \leqslant \lVert x \rVert_{p}\lVert y \rVert_{q}}$$
     Pour $p = q = 2$, c'est l'inégalité de Cauchy-Schwarz.

    **3.** L'inégalité demandée vient de $|x_{k} + y_{k}|^{p} = |x_{k} + y_{k}|\,|x_{k} + y_{k}|^{p-1} \leqslant \big(|x_{k}| + |y_{k}|\big)|x_{k} + y_{k}|^{p-1}$. On applique Hölder à chaque somme du membre de droite, en remarquant que $(p - 1)q = p$ : 
    $$\sum_{k} |x_{k}|\,|x_{k} + y_{k}|^{p-1} \leqslant \lVert x \rVert_{p}\Big(\sum_{k} |x_{k} + y_{k}|^{p}\Big)^{1/q} = \lVert x \rVert_{p}\lVert x + y \rVert_{p}^{p/q}.$$
     Ainsi $\lVert x + y \rVert_{p}^{p} \leqslant \big(\lVert x \rVert_{p} + \lVert y \rVert_{p}\big)\lVert x + y \rVert_{p}^{p - 1}$, puisque $\frac{p}{q} = p - 1$. Si $x + y \neq 0$, on divise par $\lVert x + y \rVert_{p}^{p-1}$. 
    $$\boxed{\lVert x + y \rVert_{p} \leqslant \lVert x \rVert_{p} + \lVert y \rVert_{p}}$$
     La séparation et l'homogénéité sont immédiates, et le cas $p = 1$ est la proposition 4 : $\lVert \cdot \rVert_{p}$ est une norme pour tout $p \geqslant 1$.

    **4.** Soit $x \neq 0$ et $M = \lVert x \rVert_{\infty}$. La somme contient le terme $M^{p}$ et $n$ termes au plus égaux à $M^{p}$ : 
    $$M \leqslant \lVert x \rVert_{p} \leqslant n^{1/p}M, \qquad n^{1/p} = \mathrm{e}^{\frac{\ln n}{p}} \xrightarrow[p \to +\infty]{} 1.$$

    $$\boxed{\lVert x \rVert_{p} \xrightarrow[p \to +\infty]{} \lVert x \rVert_{\infty}}$$
     C'est ce qui justifie la notation $\lVert \cdot \rVert_{\infty}$ : la boule unité de $\lVert \cdot \rVert_{p}$ se rapproche du carré quand $p$ grandit.
- id: "mp-04-10"
  feuille: "f-mp-04"
  numero: 10
  partie: "Normes, distances, boules"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [normes, produit scalaire, norme uniforme]
  noeuds: [f-evn, gd-normes, me-produit-scalaire]
  notions: [norme, produit-scalaire]
  source: "Normes (Prost), exercices 5 et 6"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $E$ un espace préhilbertien réel, de norme associée $\lVert \cdot \rVert$. Montrer que, pour tout $x \in E$, 
    $$\lVert x \rVert = \sup_{\lVert y \rVert \leqslant 1} |\langle x, y \rangle|,$$
     et que cette borne supérieure est atteinte.

    **2.** Dans $\mathbb{R}^{n}$, muni du produit scalaire canonique, on associe à une norme $N$ l'application 
    $$N^{*}(x) = \sup_{N(y) \leqslant 1} |\langle x, y \rangle|,$$
     appelée norme duale. Calculer $N^{*}$ lorsque $N$ est $\lVert \cdot \rVert_{2}$, $\lVert \cdot \rVert_{1}$, puis $\lVert \cdot \rVert_{\infty}$, et vérifier dans les trois cas que $N^{*}$ est une norme et que $(N^{*})^{*} = N$.
  corrige: |
    **1.** Par l'inégalité de Cauchy-Schwarz, $|\langle x, y \rangle| \leqslant \lVert x \rVert\,\lVert y \rVert \leqslant \lVert x \rVert$ pour $\lVert y \rVert \leqslant 1$. Si $x \neq 0$, le vecteur $y = \frac{x}{\lVert x \rVert}$ donne $\langle x, y \rangle = \lVert x \rVert$ ; si $x = 0$, tout $y$ convient. 
    $$\boxed{\lVert x \rVert = \max_{\lVert y \rVert \leqslant 1} |\langle x, y \rangle|}$$

    **2.** Pour $N = \lVert \cdot \rVert_{2}$, la question 1 donne $N^{*} = \lVert \cdot \rVert_{2}$. Pour $N = \lVert \cdot \rVert_{1}$, si $\lVert y \rVert_{1} \leqslant 1$, 
    $$|\langle x, y \rangle| \leqslant \sum_{i} |x_{i}|\,|y_{i}| \leqslant \lVert x \rVert_{\infty}\lVert y \rVert_{1} \leqslant \lVert x \rVert_{\infty},$$
     et l'égalité a lieu pour $y = \pm e_{i_{0}}$, où $|x_{i_{0}}| = \lVert x \rVert_{\infty}$ et le signe est celui de $x_{i_{0}}$. Pour $N = \lVert \cdot \rVert_{\infty}$, de même $|\langle x, y \rangle| \leqslant \lVert x \rVert_{1}\lVert y \rVert_{\infty} \leqslant \lVert x \rVert_{1}$, avec égalité pour $y_{i} = \pm 1$ du signe de $x_{i}$. 
    $$\boxed{(\lVert \cdot \rVert_{2})^{*} = \lVert \cdot \rVert_{2}, \qquad (\lVert \cdot \rVert_{1})^{*} = \lVert \cdot \rVert_{\infty}, \qquad (\lVert \cdot \rVert_{\infty})^{*} = \lVert \cdot \rVert_{1}}$$
     Ce sont des normes (proposition 4), et l'on lit sur ce tableau que $(N^{*})^{*} = N$ dans les trois cas : la dualité échange $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ et fixe $\lVert \cdot \rVert_{2}$, comme Hölder échange $p$ et $q$.

    *Piège.* Pour une norme $N$ quelconque, il faudrait savoir que $\{N(y) \leqslant 1\}$ est bornée pour $\lVert \cdot \rVert_{2}$ afin de justifier l'existence de la borne supérieure : c'est l'équivalence des normes en dimension finie, que le chapitre 5 établira.
- id: "mp-04-11"
  feuille: "f-mp-04"
  numero: 11
  partie: "Normes, distances, boules"
  etoiles: 2
  types: [Calcul]
  mots_cles: [normes]
  noeuds: [f-evn, gd-normes]
  notions: [norme]
  source: "BibM@th, Espaces vectoriels normés, exercice 14"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $A$ une partie non vide de $\mathbb{R}$. Donner une condition nécessaire et suffisante sur $A$ pour que l'application $P \mapsto \sup_{t \in A} |P(t)|$ soit bien définie sur $\mathbb{R}[X]$ et soit une norme.
  corrige: |
    Pour que l'application soit définie, il faut que tout polynôme soit borné sur $A$, en particulier $P = X$ : la partie $A$ doit être bornée. Réciproquement, si $|t| \leqslant M$ sur $A$, avec $M \geqslant 1$, alors $|P(t)| \leqslant \sum_{k} |a_{k}|M^{k}$ : la borne supérieure existe. L'homogénéité et l'inégalité triangulaire sont alors celles de $\lVert \cdot \rVert_{\infty}$ (théorème 1). Pour la séparation, si $A$ est infinie, un polynôme nul sur $A$ a une infinité de racines et il est nul (chapitre 13 de MPSI) ; si $A = \{a_{1}, \dots, a_{m}\}$ est finie, le polynôme non nul $\prod_{i}(X - a_{i})$ a une « norme » nulle. 
    $$\boxed{P \mapsto \sup_{A} |P| \text{ est une norme sur } \mathbb{R}[X] \iff A \text{ est bornée et infinie}}$$
- id: "mp-04-12"
  feuille: "f-mp-04"
  numero: 12
  partie: "Normes, distances, boules"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [normes, norme uniforme, espaces de matrices]
  noeuds: [f-evn, gd-normes]
  notions: [norme]
  source: "Normes (Prost), exercice 28 ; BibM@th, Espaces vectoriels normés, exercice 11"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On dit qu'une norme $N$ sur $\mathcal{M}_{n}(\mathbb{K})$ est *sous-multiplicative* si $N(AB) \leqslant N(A)N(B)$ pour toutes matrices $A$ et $B$. On considère, pour $M = (m_{ij}) \in \mathcal{M}_{n}(\mathbb{K})$, 
    $$N_{L}(M) = \max_{1 \leqslant i \leqslant n} \sum_{j=1}^{n} |m_{ij}|, \qquad \lVert M \rVert_{2} = \Big(\sum_{i, j} |m_{ij}|^{2}\Big)^{1/2}, \qquad \lVert M \rVert_{\infty} = \max_{i, j} |m_{ij}|.$$

    **1.** Montrer que ce sont des normes sur $\mathcal{M}_{n}(\mathbb{K})$.

    **2.** Montrer que $N_{L}$ et $\lVert \cdot \rVert_{2}$ sont sous-multiplicatives, mais que $\lVert \cdot \rVert_{\infty}$ ne l'est pas si $n \geqslant 2$. On pourra calculer $J^{2}$, où $J$ est la matrice dont tous les coefficients valent $1$.

    **3.** Montrer que $M \mapsto n\lVert M \rVert_{\infty}$ est une norme sous-multiplicative.

    **4.** Montrer que, pour toute norme sous-multiplicative $N$, on a $N(I_{n}) \geqslant 1$. Calculer $N_{L}(I_{n})$ et $\lVert I_{n} \rVert_{2}$.
  corrige: |
    **1.** Les applications $\lVert \cdot \rVert_{2}$ et $\lVert \cdot \rVert_{\infty}$ sont les normes de la proposition 4, par identification de $\mathcal{M}_{n}(\mathbb{K})$ avec $\mathbb{K}^{n^{2}}$. Pour $N_{L}$, chaque $M \mapsto \sum_{j} |m_{ij}|$ est homogène et sous-additive, et le maximum de telles applications l'est aussi (exercice 5) ; si $N_{L}(M) = 0$, tous les coefficients sont nuls.

    **2.** Pour $N_{L}$, on majore la somme d'une ligne de $AB$ : 
    $$\sum_{j} \Big|\sum_{k} a_{ik}b_{kj}\Big| \leqslant \sum_{k} |a_{ik}|\sum_{j} |b_{kj}| \leqslant N_{L}(B)\sum_{k} |a_{ik}| \leqslant N_{L}(A)N_{L}(B).$$
     Pour $\lVert \cdot \rVert_{2}$, l'inégalité de Cauchy-Schwarz donne $|(AB)_{ij}|^{2} \leqslant \sum_{k} |a_{ik}|^{2}\sum_{k} |b_{kj}|^{2}$, et en sommant sur $i$ et $j$, $\lVert AB \rVert_{2}^{2} \leqslant \lVert A \rVert_{2}^{2}\lVert B \rVert_{2}^{2}$. Pour $\lVert \cdot \rVert_{\infty}$, $J^{2} = nJ$, donc $\lVert J^{2} \rVert_{\infty} = n > 1 = \lVert J \rVert_{\infty}^{2}$. 
    $$\boxed{N_{L} \text{ et } \lVert \cdot \rVert_{2} \text{ sont sous-multiplicatives ; } \lVert \cdot \rVert_{\infty} \text{ ne l'est pas pour } n \geqslant 2}$$

    **3.** Chaque coefficient de $AB$ est une somme de $n$ termes majorés par $\lVert A \rVert_{\infty}\lVert B \rVert_{\infty}$, d'où 
    $$n\lVert AB \rVert_{\infty} \leqslant n^{2}\lVert A \rVert_{\infty}\lVert B \rVert_{\infty} = \big(n\lVert A \rVert_{\infty}\big)\big(n\lVert B \rVert_{\infty}\big).$$

    $$\boxed{M \mapsto n\lVert M \rVert_{\infty} \text{ est sous-multiplicative}}$$

    **4.** On applique la sous-multiplicativité à $I_{n} = I_{n}^{2}$ : $N(I_{n}) \leqslant N(I_{n})^{2}$, et $N(I_{n}) > 0$, d'où $N(I_{n}) \geqslant 1$. 
    $$\boxed{N(I_{n}) \geqslant 1, \qquad N_{L}(I_{n}) = 1, \qquad \lVert I_{n} \rVert_{2} = \sqrt{n}}$$
     La norme $N_{L}$ sera identifiée au chapitre 5 comme la norme « subordonnée » à $\lVert \cdot \rVert_{\infty}$ sur les colonnes ; ces normes vérifient toujours $N(I_{n}) = 1$, ce qui exclut $\lVert \cdot \rVert_{2}$ pour $n \geqslant 2$.
- id: "mp-04-13"
  feuille: "f-mp-04"
  numero: 13
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suites, suites extraites]
  noeuds: [f-evn, ar-bw]
  notions: [suite-extraite]
  source: "BibM@th, Espaces vectoriels normés, exercice 25"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $(u_{n})$ une suite de $E$.

    **1.** Parmi les suites $(u_{2n+1})$, $(u_{n^{2}})$, $(u_{n + (-1)^{n}})$, $(u_{2^{n}})$ et $(u_{\lfloor n/2 \rfloor})$, lesquelles sont des suites extraites de $(u_{n})$ ? Lesquelles sont extraites de $(u_{2n})$ ?

    **2.** Montrer qu'une suite extraite d'une suite extraite de $(u_{n})$ est une suite extraite de $(u_{n})$.
  corrige: |
    **1.** Une suite $(u_{\varphi(n)})$ est extraite de $(u_{n})$ lorsque $\varphi$ est strictement croissante de $\mathbb{N}$ dans $\mathbb{N}$. Les applications $n \mapsto 2n + 1$, $n \mapsto n^{2}$ et $n \mapsto 2^{n}$ le sont. En revanche, $n \mapsto n + (-1)^{n}$ prend les valeurs $1, 0, 3, 2, \dots$, et $n \mapsto \lfloor n/2 \rfloor$ les valeurs $0, 0, 1, 1, \dots$ : aucune n'est strictement croissante. Une suite extraite de $(u_{2n})$ est de la forme $(u_{2\psi(n)})$ : ses indices sont tous pairs, ce qui n'est le cas d'aucune des trois premières suites, puisque $1$ est atteint par $2n + 1$, $n^{2}$ et $2^{n}$. 
    $$\boxed{(u_{2n+1}), \ (u_{n^{2}}), \ (u_{2^{n}}) \text{ sont extraites de } (u_{n}) \text{ ; aucune n'est extraite de } (u_{2n})}$$

    **2.** Si $v_{n} = u_{\varphi(n)}$ et $w_{n} = v_{\psi(n)}$, alors $w_{n} = u_{\varphi \circ \psi(n)}$, et une composée d'applications strictement croissantes est strictement croissante. 
    $$\boxed{\text{Une extraite d'une extraite de } (u_{n}) \text{ est une extraite de } (u_{n})}$$
- id: "mp-04-14"
  feuille: "f-mp-04"
  numero: 14
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suites]
  noeuds: [f-evn]
  notions: [suite-extraite]
  source: "Normes (Prost), exercice 7 ; BibM@th, Espaces vectoriels normés, exercice 26"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $(u_{n})$ une suite de $E$.

    **1.** On suppose que les suites $(u_{2n})$ et $(u_{2n+1})$ convergent vers la même limite $\ell$. Montrer que $(u_{n})$ converge vers $\ell$.

    **2.** On suppose que $(u_{2n})$, $(u_{2n+1})$ et $(u_{3n})$ convergent. Montrer que $(u_{n})$ converge.

    **3.** Montrer par des exemples réels que la convergence de deux seulement des trois suites $(u_{2n})$, $(u_{2n+1})$ et $(u_{3n})$ ne suffit pas.
  corrige: |
    **1.** Soit $\varepsilon > 0$. Il existe $N_{1}$ et $N_{2}$ tels que $\lVert u_{2n} - \ell \rVert \leqslant \varepsilon$ pour $n \geqslant N_{1}$ et $\lVert u_{2n+1} - \ell \rVert \leqslant \varepsilon$ pour $n \geqslant N_{2}$. Pour $m \geqslant \max(2N_{1}, 2N_{2} + 1)$, que $m$ soit pair ou impair, $\lVert u_{m} - \ell \rVert \leqslant \varepsilon$. 
    $$\boxed{u_{n} \to \ell}$$

    **2.** On note $\ell_{0}$, $\ell_{1}$ et $\ell$ les limites de $(u_{2n})$, $(u_{2n+1})$ et $(u_{3n})$. La suite $(u_{6n})$ est extraite à la fois de $(u_{2n})$ et de $(u_{3n})$ : par unicité de la limite, $\ell_{0} = \ell$. La suite $(u_{6n+3})$ est extraite de $(u_{2n+1})$, puisque $6n + 3 = 2(3n + 1) + 1$, et de $(u_{3n})$, puisque $6n + 3 = 3(2n + 1)$ : donc $\ell_{1} = \ell$. On conclut par la question 1. 
    $$\boxed{(u_{n}) \text{ converge}}$$

    **3.** Il y a trois paires à examiner.

    • La suite $u_{n} = (-1)^{n}$ : $(u_{2n})$ et $(u_{2n+1})$ sont constantes, mais $(u_{n})$ diverge.

    • La suite qui vaut $1$ si $n$ est premier avec $6$ et $0$ sinon : $(u_{2n})$ et $(u_{3n})$ sont nulles, mais $u_{6k+1} = 1$, et la suite diverge.

    • La suite qui vaut $1$ si $n$ est une puissance de $2$ supérieure ou égale à $2$, et $0$ sinon : une telle puissance n'est ni impaire ni multiple de $3$, donc $(u_{2n+1})$ et $(u_{3n})$ sont nulles, alors que $u_{2^{k}} = 1$ pour tout $k \geqslant 1$.

    $$\boxed{\text{Aucune paire ne suffit : il faut un recouvrement des indices assorti de « raccords »}}$$
     La preuve de la question 2 montre le mécanisme : les trois suites couvrent tous les indices, et les suites $(u_{6n})$ et $(u_{6n+3})$ raccordent les limites.
- id: "mp-04-15"
  feuille: "f-mp-04"
  numero: 15
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suites, boules, norme uniforme, suites extraites, adhérence et intérieur]
  noeuds: [f-evn, gd-normes, ar-bw, tr-adherence]
  notions: [suite-extraite, boule-ouverte, adherence]
  source: "BibM@th, Espaces vectoriels normés, exercices 24 et 28"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Donner une suite réelle qui a une unique valeur d'adhérence et qui diverge. Montrer qu'une suite réelle *bornée* qui a une unique valeur d'adhérence converge.

    **2.** Dans l'espace $\mathcal{C}([0, 1], \mathbb{R})$ muni de $\lVert \cdot \rVert_{\infty}$, on pose $u_{2n} = 0$ et $u_{2n+1} = f_{n}$, où $f_{n} : t \mapsto t^{n}$. Montrer que $(u_{n})$ est bornée, qu'elle a $0$ pour unique valeur d'adhérence, et qu'elle diverge. On pourra utiliser la remarque du cours sur la suite $(f_{n})$.

    **3.** Dans $(\mathbb{R}^{2}, \lVert \cdot \rVert_{\infty})$, trouver une suite $(u_{n}) = (x_{n}, y_{n})$ telle que $(x_{n})$ et $(y_{n})$ aient chacune une valeur d'adhérence, mais pas $(u_{n})$.
  corrige: |
    **1.** La suite définie par $u_{n} = n$ pour $n$ impair et $u_{n} = 0$ pour $n$ pair a $0$ pour valeur d'adhérence. C'est la seule : une suite extraite convergente est bornée, donc ne contient qu'un nombre fini d'indices impairs, et sa limite est $0$. Elle diverge, puisqu'elle n'est pas bornée. Soit maintenant $(u_{n})$ réelle bornée, d'unique valeur d'adhérence $\lambda$. Si $(u_{n})$ ne converge pas vers $\lambda$, il existe $\varepsilon > 0$ et une infinité d'indices $n$ tels que $|u_{n} - \lambda| > \varepsilon$ : ils forment une suite extraite bornée, dont le théorème de Bolzano-Weierstrass (chapitre 7 de MPSI) extrait une suite convergente, de limite $\mu$ avec $|\mu - \lambda| \geqslant \varepsilon$. C'est une seconde valeur d'adhérence : contradiction. 
    $$\boxed{\text{Une suite réelle bornée d'unique valeur d'adhérence converge}}$$

    **2.** On a $\lVert u_{n} \rVert_{\infty} \leqslant 1$, et $0$ est valeur d'adhérence (indices pairs). Une suite extraite convergente de $(u_{n})$ ne peut contenir qu'un nombre fini d'indices impairs : sinon, elle contiendrait une suite extraite convergente de $(f_{n})$, et la remarque du cours a montré que $(f_{n})$ n'a aucune valeur d'adhérence pour $\lVert \cdot \rVert_{\infty}$ (sa limite uniforme $g$ vérifierait $g(t) = 0$ pour $t < 1$ et $g(1) = 1$, sans être continue). Sa limite est donc $0$. Enfin, $(u_{n})$ diverge : si elle convergeait, ce serait vers $0$, et $\lVert u_{2n+1} \rVert_{\infty} = 1$ ne tend pas vers $0$. 
    $$\boxed{(u_{n}) \text{ est bornée, a } 0 \text{ pour unique valeur d'adhérence, et diverge}}$$
     La question 1 ne se généralise donc pas : elle repose sur le théorème de Bolzano-Weierstrass, faux dans cet espace de dimension infinie.

    **3.** On pose $u_{n} = (n, 0)$ pour $n$ impair et $u_{n} = (0, n)$ pour $n$ pair. Les suites $(x_{2n})$ et $(y_{2n+1})$ sont nulles, donc chaque coordonnée a $0$ pour valeur d'adhérence. Mais $\lVert u_{n} \rVert_{\infty} = n$ : aucune suite extraite de $(u_{n})$ n'est bornée, donc aucune ne converge. 
    $$\boxed{u_{n} = (n, 0) \ (n \text{ impair}), \quad u_{n} = (0, n) \ (n \text{ pair})}$$
     *Piège.* Les valeurs d'adhérence des coordonnées sont atteintes le long de suites d'indices différentes ; pour une valeur d'adhérence de $(u_{n})$, il faut une même suite d'indices pour toutes les coordonnées, ce que l'on obtiendra par extractions successives (exercice 51).
- id: "mp-04-16"
  feuille: "f-mp-04"
  numero: 16
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites, norme uniforme, suites extraites]
  noeuds: [f-evn, gd-normes, ar-bw]
  notions: [suite-extraite]
  source: "BibM@th, Espaces vectoriels normés, exercices 27 et 30 ; Normes (Prost), exercice 12"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Montrer qu'une suite réelle monotone qui possède une suite extraite convergente est convergente.

    **2.** Montrer qu'une suite réelle non majorée possède une suite extraite qui tend vers $+\infty$, et qu'une suite réelle qui ne tend pas vers $+\infty$ possède une suite extraite majorée.

    **3.** Montrer que de toute suite d'entiers naturels qui ne tend pas vers $+\infty$, on peut extraire une suite constante.

    **4.** Soit $(r_{n})$ une suite de rationnels qui converge vers un irrationnel $\ell$. On écrit $r_{n} = \frac{p_{n}}{q_{n}}$ avec $p_{n} \in \mathbb{Z}$, $q_{n} \in \mathbb{N}^{*}$ et $p_{n} \wedge q_{n} = 1$. Montrer que $q_{n} \to +\infty$.
  corrige: |
    **1.** Supposons $(u_{n})$ croissante, et $u_{\varphi(n)} \to \ell$. La suite $(u_{\varphi(n)})$ est croissante, donc majorée par sa limite. Comme $\varphi(n) \geqslant n$, on a $u_{n} \leqslant u_{\varphi(n)} \leqslant \ell$ : la suite croissante $(u_{n})$ est majorée, donc converge (chapitre 7 de MPSI), et sa limite est celle de sa suite extraite. 
    $$\boxed{\text{Une suite monotone qui a une suite extraite convergente converge}}$$

    **2.** Si $(u_{n})$ n'est pas majorée, pour tout réel $M$ l'ensemble $\{n \mid u_{n} > M\}$ est infini : sinon, $(u_{n})$ serait majorée par le maximum de $M$ et d'un nombre fini de termes. On construit alors par récurrence $\varphi(k + 1) > \varphi(k)$ tel que $u_{\varphi(k+1)} > k + 1$, et $u_{\varphi(k)} \to +\infty$. Si $(u_{n})$ ne tend pas vers $+\infty$, il existe $M$ tel que, pour tout $N$, un indice $n \geqslant N$ vérifie $u_{n} \leqslant M$ : ces indices forment une suite extraite majorée par $M$. 
    $$\boxed{\text{Non majorée} \implies \text{extraite de limite } +\infty \ ; \quad u_{n} \not\to +\infty \implies \text{extraite majorée}}$$

    **3.** Une suite extraite est majorée par un entier $M$, et ses termes prennent leurs valeurs dans l'ensemble fini $\llbracket 0\,,M \rrbracket$. Une infinité d'indices pour un nombre fini de valeurs : l'une des valeurs est prise une infinité de fois (principe des tiroirs), ce qui donne une suite extraite constante.

    **4.** Supposons que $(q_{n})$ ne tende pas vers $+\infty$. Par la question 3, une suite extraite $(q_{\varphi(n)})$ est constante, égale à $q$. Alors $p_{\varphi(n)} = q\,r_{\varphi(n)} \to q\ell$. Une suite d'entiers convergente est stationnaire, puisque deux entiers distants de moins de $1$ sont égaux : $p_{\varphi(n)} = p$ à partir d'un certain rang, et $\ell = \frac{p}{q}$ est rationnel. Contradiction. 
    $$\boxed{q_{n} \to +\infty}$$
     Approcher un irrationnel par des rationnels oblige à prendre des dénominateurs de plus en plus grands : c'est le point de départ de l'approximation diophantienne.
- id: "mp-04-17"
  feuille: "f-mp-04"
  numero: 17
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites, boules, suites extraites, adhérence et intérieur]
  noeuds: [f-evn, gd-normes, ar-bw, tr-adherence]
  notions: [suite-extraite, boule-ouverte, adherence]
  source: "BibM@th, Espaces vectoriels normés, exercice 29"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $(u_{n})$ une suite réelle bornée. Pour $n \in \mathbb{N}$, on pose $a_{n} = \inf\limits_{k \geqslant n} u_{k}$ et $b_{n} = \sup\limits_{k \geqslant n} u_{k}$.

    **1.** Montrer que $(a_{n})$ et $(b_{n})$ convergent. On note $\underline{\ell}$ et $\overline{\ell}$ leurs limites.

    **2.** Montrer que $\underline{\ell}$ et $\overline{\ell}$ sont des valeurs d'adhérence de $(u_{n})$, et que toute valeur d'adhérence $\lambda$ de $(u_{n})$ vérifie $\underline{\ell} \leqslant \lambda \leqslant \overline{\ell}$.

    **3.** En déduire une nouvelle démonstration du théorème de Bolzano-Weierstrass dans $\mathbb{R}$, puis que $(u_{n})$ converge si et seulement si $\underline{\ell} = \overline{\ell}$.

    **4.** Calculer $\underline{\ell}$ et $\overline{\ell}$ pour $u_{n} = (-1)^{n}\big(1 + \frac{1}{n + 1}\big)$.
  corrige: |
    **1.** Les bornes existent car la suite est bornée. Quand $n$ augmente, on prend l'inf et le sup sur des ensembles plus petits : $(a_{n})$ est croissante et $(b_{n})$ décroissante, et toutes deux sont bornées. Elles convergent, et $a_{n} \leqslant b_{n}$ donne $\underline{\ell} \leqslant \overline{\ell}$.

    **2.** On construit une suite extraite qui tend vers $\overline{\ell}$. Supposons $\varphi(k)$ construit. Par définition de $b_{\varphi(k) + 1}$, il existe $m \geqslant \varphi(k) + 1$ tel que $b_{\varphi(k)+1} - \frac{1}{k + 1} \leqslant u_{m} \leqslant b_{\varphi(k)+1}$ ; on pose $\varphi(k + 1) = m$. Comme $b_{\varphi(k)+1} \to \overline{\ell}$, l'encadrement donne $u_{\varphi(k+1)} \to \overline{\ell}$. On procède de même pour $\underline{\ell}$. Enfin, si $u_{\psi(n)} \to \lambda$, l'encadrement $a_{\psi(n)} \leqslant u_{\psi(n)} \leqslant b_{\psi(n)}$ passe à la limite. 
    $$\boxed{\underline{\ell}, \ \overline{\ell} \text{ sont valeurs d'adhérence, et toute valeur d'adhérence est dans } [\underline{\ell}, \overline{\ell}]}$$

    **3.** Puisque $\overline{\ell}$ est valeur d'adhérence, toute suite réelle bornée a une suite extraite convergente : c'est le théorème de Bolzano-Weierstrass. Si $(u_{n})$ converge, toutes ses valeurs d'adhérence sont égales à sa limite, donc $\underline{\ell} = \overline{\ell}$ ; réciproquement, si $\underline{\ell} = \overline{\ell}$, l'encadrement $a_{n} \leqslant u_{n} \leqslant b_{n}$ donne la convergence. 
    $$\boxed{(u_{n}) \text{ converge} \iff \underline{\ell} = \overline{\ell}}$$

    **4.** Les termes d'indice pair valent $1 + \frac{1}{n + 1}$ et décroissent vers $1$ ; ceux d'indice impair valent $-1 - \frac{1}{n + 1}$ et croissent vers $-1$. Donc $b_{n}$ est le premier terme pair d'indice au moins $n$, et $a_{n}$ le premier terme impair. 
    $$\boxed{\underline{\ell} = -1, \qquad \overline{\ell} = 1}$$
     Les bornes $a_{0} = -\frac{3}{2}$ et $b_{0} = 2$ ne sont pas des valeurs d'adhérence : seules comptent les queues de la suite.
- id: "mp-04-18"
  feuille: "f-mp-04"
  numero: 18
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites, boules, norme uniforme, suites extraites, adhérence et intérieur]
  noeuds: [f-evn, gd-normes, ar-bw, tr-adherence]
  notions: [suite-extraite, boule-ouverte, adherence]
  source: "Normes (Prost), exercice 10 ; BibM@th, Espaces vectoriels normés, exercice 31"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Une suite $(u_{n})$ de $E$ est dite *de Cauchy* si 
    $$\forall \varepsilon > 0, \ \exists N \in \mathbb{N}, \ \forall n, p \geqslant N, \quad \lVert u_{n} - u_{p} \rVert \leqslant \varepsilon.$$

    **1.** Montrer que toute suite convergente est de Cauchy, et que toute suite de Cauchy est bornée.

    **2.** Montrer qu'une suite de Cauchy qui possède une valeur d'adhérence converge vers celle-ci.

    **3.** En déduire que toute suite réelle de Cauchy converge.

    **4.** Montrer que la suite $(f_{n})$ de la question 2 de l'exercice 15 n'est pas de Cauchy pour $\lVert \cdot \rVert_{\infty}$, mais qu'elle l'est pour $\lVert \cdot \rVert_{1}$.
  corrige: |
    **1.** Si $u_{n} \to \ell$, l'inégalité $\lVert u_{n} - u_{p} \rVert \leqslant \lVert u_{n} - \ell \rVert + \lVert \ell - u_{p} \rVert$ montre que la suite est de Cauchy. Si $(u_{n})$ est de Cauchy, avec $\varepsilon = 1$, on a $\lVert u_{n} \rVert \leqslant \lVert u_{N} \rVert + 1$ pour $n \geqslant N$, et l'on majore les premiers termes par leur maximum. 
    $$\boxed{\text{convergente} \implies \text{de Cauchy} \implies \text{bornée}}$$

    **2.** Soit $u_{\varphi(k)} \to \ell$, et $\varepsilon > 0$. On choisit $N$ tel que $\lVert u_{n} - u_{p} \rVert \leqslant \frac{\varepsilon}{2}$ pour $n$, $p \geqslant N$, puis $k$ tel que $\varphi(k) \geqslant N$ et $\lVert u_{\varphi(k)} - \ell \rVert \leqslant \frac{\varepsilon}{2}$. Pour $n \geqslant N$, $\lVert u_{n} - \ell \rVert \leqslant \lVert u_{n} - u_{\varphi(k)} \rVert + \lVert u_{\varphi(k)} - \ell \rVert \leqslant \varepsilon$. 
    $$\boxed{\text{Une suite de Cauchy ayant une valeur d'adhérence } \ell \text{ converge vers } \ell}$$

    **3.** Une suite réelle de Cauchy est bornée (question 1), donc a une valeur d'adhérence par le théorème de Bolzano-Weierstrass, et converge par la question 2. 
    $$\boxed{\text{Toute suite réelle de Cauchy converge}}$$

    **4.** Pour $\lVert \cdot \rVert_{\infty}$, on compare $f_{n}$ et $f_{2n}$ : en posant $s = t^{n}$, 
    $$\lVert f_{n} - f_{2n} \rVert_{\infty} = \sup_{s \in [0, 1]} (s - s^{2}) = \frac{1}{4},$$
     qui ne tend pas vers $0$. Pour $\lVert \cdot \rVert_{1}$, si $p > n$, $\lVert f_{n} - f_{p} \rVert_{1} = \int_{0}^{1}(t^{n} - t^{p})\,\mathrm{d} t = \frac{1}{n + 1} - \frac{1}{p + 1} \leqslant \frac{1}{n + 1}$. 
    $$\boxed{(f_{n}) \text{ n'est pas de Cauchy pour } \lVert \cdot \rVert_{\infty}, \text{ mais l'est pour } \lVert \cdot \rVert_{1}}$$
     Pour $\lVert \cdot \rVert_{1}$, c'est cohérent : la suite converge vers $0$ (cours). L'exercice 61 montrera une suite de Cauchy pour $\lVert \cdot \rVert_{1}$ qui ne converge pas.
- id: "mp-04-19"
  feuille: "f-mp-04"
  numero: 19
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 1
  types: [Calcul]
  mots_cles: [suites, boules, norme uniforme, suites extraites]
  noeuds: [f-evn, gd-normes, ar-bw]
  notions: [suite-extraite, boule-ouverte]
  source: "Normes (Prost), exercice 8"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Soit $E = \mathcal{C}([0, 2\pi], \mathbb{C})$ muni de la norme $\lVert \cdot \rVert_{\infty}$, et $f_{n} : x \mapsto \mathrm{e}^{\mathrm{i} nx}$. Calculer $\lVert f_{n} - f_{p} \rVert_{\infty}$ pour $n \neq p$. En déduire que $(f_{n})$ est une suite de la sphère unité qui ne possède aucune suite extraite convergente.
  corrige: |
    Pour $n \neq p$, on met en facteur : $|\mathrm{e}^{\mathrm{i} nx} - \mathrm{e}^{\mathrm{i} px}| = |\mathrm{e}^{\mathrm{i}(n-p)x} - 1| = 2\big|\sin\frac{(n - p)x}{2}\big|$. Cette quantité vaut $2$ en $x = \frac{\pi}{|n - p|} \in [0, 2\pi]$, et elle est majorée par $2$. 
    $$\boxed{\lVert f_{n} - f_{p} \rVert_{\infty} = 2 \quad (n \neq p)}$$
     Chaque $f_{n}$ est de norme $1$. Une suite extraite convergente serait de Cauchy (exercice 18), alors que ses termes sont à distance $2$ les uns des autres. 
    $$\boxed{(f_{n}) \text{ est une suite de la sphère unité sans suite extraite convergente}}$$
     C'est un nouvel exemple de suite bornée sans valeur d'adhérence, plus frappant que celui de $(t^{n})$ : les termes restent tous à la même distance les uns des autres. Le chapitre 5 en fera le signe que la sphère unité n'est pas compacte.
- id: "mp-04-20"
  feuille: "f-mp-04"
  numero: 20
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suites, norme uniforme, espaces de matrices]
  noeuds: [f-evn, gd-normes]
  notions: [suite-extraite]
  source: "Normes (Prost), exercices 30, 31 et 32"
  page_enonce: 5
  page_corrige: 10
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{K})$ de la norme $\lVert \cdot \rVert_{\infty}$, de sorte que la convergence d'une suite de matrices est celle de chacun de ses coefficients (proposition 7 du cours).

    **1.** Soit $(A_{k})$ et $(B_{k})$ deux suites de matrices qui convergent vers $A$ et $B$. Montrer que $(A_{k}B_{k})$ converge vers $AB$.

    **2.** Soit $A \in \mathcal{M}_{n}(\mathbb{K})$ telle que la suite $(A^{k})$ converge vers une matrice $M$. Montrer les égalités $AM = MA = M$, puis $M^{2} = M$. Que représente géométriquement $M$ ?

    **3.** Soit $A \in \mathcal{M}_{n}(\mathbb{K})$ telle que $(A^{k})$ converge vers une matrice inversible. Déterminer $A$.

    **4.** Soit $(A_{k})$ une suite de $\mathrm{GL}_{n}(\mathbb{K})$ telle que $(A_{k})$ et $(A_{k}^{-1})$ convergent vers $A$ et $B$. Montrer que $A$ est inversible et que $A^{-1} = B$.
  corrige: |
    **1.** Par la proposition 7, il suffit d'étudier chaque coefficient. Celui d'indice $(i, j)$ de $A_{k}B_{k}$ est $\sum_{l} a^{(k)}_{il}b^{(k)}_{lj}$, somme de produits de suites convergentes : il tend vers $\sum_{l} a_{il}b_{lj}$. 
    $$\boxed{A_{k}B_{k} \to AB}$$

    **2.** La suite $(A^{k+1})$ est extraite de $(A^{k})$, donc tend vers $M$ ; par la question 1, $A^{k+1} = A \cdot A^{k} \to AM$ et $A^{k+1} = A^{k} \cdot A \to MA$. De même, $(A^{2k})$ est extraite, et $A^{2k} = A^{k}A^{k} \to M^{2}$. 
    $$\boxed{AM = MA = M, \qquad M^{2} = M}$$
     La matrice $M$ est celle d'un projecteur ; l'égalité $AM = M$ montre que son image est formée de vecteurs fixés par $A$.

    **3.** Avec la question 2, $AM = M$ et $M$ inversible donnent, en multipliant à droite par $M^{-1}$ : 
    $$\boxed{A = I_{n}}$$

    **4.** On passe à la limite dans $A_{k}A_{k}^{-1} = I_{n}$ par la question 1. 
    $$\boxed{AB = I_{n}, \ \text{ donc } A \in \mathrm{GL}_{n}(\mathbb{K}) \text{ et } A^{-1} = B}$$
     *Piège.* La convergence de $(A_{k})$ vers une matrice inversible ne suffit pas à assurer celle de $(A_{k}^{-1})$ sans argument supplémentaire : c'est la continuité de l'inversion, que le chapitre 5 établira.
- id: "mp-04-21"
  feuille: "f-mp-04"
  numero: 21
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [suites, boules, suites extraites, adhérence et intérieur]
  noeuds: [f-evn, gd-normes, ar-bw, tr-adherence]
  notions: [suite-extraite, boule-ouverte, adherence]
  source: "Normes (Prost), exercice 9 ; BibM@th, Espaces vectoriels normés, exercice 32 ; Topologie (LLG), exercice 18"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $(u_{n})$ une suite réelle bornée telle que $u_{n+1} - u_{n} \to 0$.

    **1.** Soit $a < b$ deux valeurs d'adhérence de $(u_{n})$, et $c \in \, ]a, b[$. Montrer que, pour tout $\varepsilon > 0$ et tout $N \in \mathbb{N}$, il existe $n \geqslant N$ tel que $|u_{n} - c| \leqslant \varepsilon$. En déduire que l'ensemble des valeurs d'adhérence de $(u_{n})$ est un intervalle.

    **2.** Déterminer l'ensemble des valeurs d'adhérence de la suite $u_{n} = \cos(\pi\sqrt{n})$.

    **3.** L'hypothèse $u_{n+1} - u_{n} \to 0$ est-elle nécessaire ?
  corrige: |
    **1.** Soit $\varepsilon \in \, ]0, \min(c - a, b - c)[$ et $N \in \mathbb{N}$. On choisit $N' \geqslant N$ tel que $|u_{n+1} - u_{n}| \leqslant \varepsilon$ pour $n \geqslant N'$. Comme $a$ est valeur d'adhérence, il existe $n_{1} \geqslant N'$ tel que $|u_{n_{1}} - a| < c - a$, donc $u_{n_{1}} < c$ ; comme $b$ l'est aussi, il existe $n_{2} > n_{1}$ tel que $u_{n_{2}} > c$. Soit $m$ le plus grand indice de $\llbracket n_{1}\,,n_{2} \rrbracket$ tel que $u_{m} \leqslant c$ : alors $m < n_{2}$ et 
    $$u_{m} \leqslant c < u_{m+1} \leqslant u_{m} + \varepsilon, \qquad\text{d'où}\qquad |u_{m} - c| \leqslant \varepsilon \ \text{ avec } m \geqslant N.$$
     Par la proposition 8 (iii), $c$ est valeur d'adhérence. L'ensemble $\Lambda$ des valeurs d'adhérence, non vide par Bolzano-Weierstrass, contient donc tout segment joignant deux de ses points. 
    $$\boxed{\Lambda \text{ est un intervalle}}$$
     La suite ne peut pas passer de près de $a$ à près de $b$ sans traverser chaque niveau intermédiaire à $\varepsilon$ près : c'est une version discrète du théorème des valeurs intermédiaires.

    **2.** Par l'inégalité $|\cos x - \cos y| \leqslant |x - y|$, 
    $$|u_{n+1} - u_{n}| \leqslant \pi\big(\sqrt{n + 1} - \sqrt{n}\big) = \frac{\pi}{\sqrt{n + 1} + \sqrt{n}} \to 0.$$
     Aux carrés, $u_{(2k)^{2}} = \cos(2k\pi) = 1$ et $u_{(2k+1)^{2}} = -1$ : $1$ et $-1$ sont valeurs d'adhérence, et $\Lambda \subset [-1, 1]$. 
    $$\boxed{\Lambda = [-1, 1]}$$

    **3.** La suite $\big((-1)^{n}\big)$ a pour valeurs d'adhérence $\{-1, 1\}$, qui n'est pas un intervalle. 
    $$\boxed{\text{L'hypothèse } u_{n+1} - u_{n} \to 0 \text{ est nécessaire}}$$
- id: "mp-04-22"
  feuille: "f-mp-04"
  numero: 22
  partie: "Suites d'éléments d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [suites, suites extraites, adhérence et intérieur, densité]
  noeuds: [f-evn, ar-bw, tr-adherence, tr-dense]
  notions: [suite-extraite, adherence, partie-dense]
  source: "BibM@th, Espaces vectoriels normés, exercice 33"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On admet que $\pi$ est irrationnel. On note $G = \{p + 2\pi q \mid p, q \in \mathbb{Z}\}$.

    **1.** Soit $N \in \mathbb{N}^{*}$. En appliquant le principe des tiroirs aux $N + 1$ réels $k - 2\pi\big\lfloor \frac{k}{2\pi} \big\rfloor$, pour $0 \leqslant k \leqslant N$, montrer que $G$ contient un élément $g$ tel que $0 < |g| \leqslant \frac{2\pi}{N}$.

    **2.** En déduire que $G$ est dense dans $\mathbb{R}$.

    **3.** Montrer que l'ensemble des valeurs d'adhérence de la suite $(\cos n)$ est le segment $[-1, 1]$.
  corrige: |
    **1.** Les $N + 1$ réels $y_{k} = k - 2\pi\lfloor \frac{k}{2\pi} \rfloor$ sont dans $[0, 2\pi[$, découpé en $N$ intervalles $\big[\frac{2\pi j}{N}, \frac{2\pi(j+1)}{N}\big[$. Par le principe des tiroirs, deux d'entre eux, d'indices $k < k'$, sont dans le même intervalle, et $g = y_{k'} - y_{k} = (k' - k) - 2\pi m$, avec $m \in \mathbb{Z}$, vérifie $|g| < \frac{2\pi}{N}$. Si $g$ était nul, on aurait $m \neq 0$ et $\pi = \frac{k' - k}{2m} \in \mathbb{Q}$. 
    $$\boxed{\exists g \in G, \quad 0 < |g| < \frac{2\pi}{N}}$$

    **2.** L'ensemble $G$ est un sous-groupe de $(\mathbb{R}, +)$, donc contient $-g$ et tous les multiples entiers de $g$. Soit $x \in \mathbb{R}$ et $\varepsilon > 0$ ; on choisit $N$ tel que $\frac{2\pi}{N} < \varepsilon$, et $g > 0$ comme à la question 1 (quitte à changer $g$ en $-g$). Avec $m = \lfloor \frac{x}{g} \rfloor$, on a $mg \in G$ et $0 \leqslant x - mg < g < \varepsilon$. 
    $$\boxed{G \text{ est dense dans } \mathbb{R}}$$

    **3.** Les valeurs d'adhérence de $(\cos n)$ sont dans $[-1, 1]$. Soit $y = \cos\theta \in [-1, 1]$, $\varepsilon \in \, ]0, \pi[$ et $N \in \mathbb{N}$. L'intervalle $]\theta - \varepsilon, \theta + \varepsilon[$ contient une infinité d'éléments $p + 2\pi q$ de $G$ : sinon, en retirant les éléments en nombre fini, on obtiendrait un intervalle ouvert non vide sans point de $G$. Deux d'entre eux ont des $p$ distincts, car deux éléments de même $p$ diffèrent d'un multiple non nul de $2\pi$, plus grand que la longueur $2\varepsilon$ de l'intervalle. Il y a donc des $|p|$ arbitrairement grands, et l'on choisit $n = |p| \geqslant N$ : 
    $$|\cos n - y| = |\cos(p + 2\pi q) - \cos\theta| \leqslant |p + 2\pi q - \theta| < \varepsilon.$$

    $$\boxed{\text{L'ensemble des valeurs d'adhérence de } (\cos n) \text{ est } [-1, 1]}$$
     *Piège.* La densité de $G$ fournit des éléments $p + 2\pi q$ proches de $\theta$, mais rien n'assure a priori que les entiers $p$ correspondants soient grands ; c'est l'infinité des éléments dans chaque intervalle qui le garantit.
- id: "mp-04-23"
  feuille: "f-mp-04"
  numero: 23
  partie: "Comparaison des normes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [comparaison des normes, boules, norme uniforme, fermés]
  noeuds: [gd-equivalence, gd-normes, tr-ouverts]
  notions: [normes-equivalentes, boule-ouverte, ferme]
  source: "Normes (Prost), exercice 14"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    Pour $(x, y) \in \mathbb{R}^{2}$, on pose $N(x, y) = \sup\limits_{t \in [0, 1]} |x + ty|$.

    **1.** Montrer que $N(x, y) = \max\big(|x|, |x + y|\big)$, puis que $N$ est une norme sur $\mathbb{R}^{2}$.

    **2.** Dessiner sur une même figure les boules unités fermées de $\lVert \cdot \rVert_{1}$, $\lVert \cdot \rVert_{2}$, $\lVert \cdot \rVert_{\infty}$ et $N$.

    **3.** Déterminer les meilleures constantes $\alpha$ et $\beta$ telles que $\alpha\lVert \cdot \rVert_{\infty} \leqslant N \leqslant \beta\lVert \cdot \rVert_{\infty}$, et lire le résultat sur la figure.
  corrige: |
    **1.** La fonction $t \mapsto |x + ty|$ est convexe, comme valeur absolue d'une fonction affine : sur le segment $[0, 1]$, son maximum est atteint en une extrémité. 
    $$\boxed{N(x, y) = \max\big(|x|, |x + y|\big) = \lVert (x, x + y) \rVert_{\infty}}$$
     L'application $(x, y) \mapsto (x, x + y)$ est linéaire et injective : $N$ est une norme par l'exercice 5.

    **2.** La boule unité de $N$ est définie par $|x| \leqslant 1$ et $|x + y| \leqslant 1$ : c'est le parallélogramme de sommets $(1, 0)$, $(-1, 2)$, $(-1, 0)$ et $(1, -2)$, obtenus en résolvant les systèmes $x = \pm 1$, $x + y = \pm 1$.

    ![Figure](documents/figures/fb009eb5b53d6cdd.svg)

    Contrairement aux trois autres, la boule de $N$ n'est pas symétrique par rapport aux axes, seulement par rapport à l'origine, comme toute boule centrée en $0$.

    **3.** On a $N(x, y) \leqslant |x| + |y| \leqslant 2\lVert (x, y) \rVert_{\infty}$, et $|y| = |(x + y) - x| \leqslant 2N(x, y)$, $|x| \leqslant N(x, y)$, d'où $\lVert (x, y) \rVert_{\infty} \leqslant 2N(x, y)$. Les égalités ont lieu en $(1, 1)$, où $N = 2$ et $\lVert \cdot \rVert_{\infty} = 1$, et en $(-1, 2)$, où $N = 1$ et $\lVert \cdot \rVert_{\infty} = 2$. 
    $$\boxed{\tfrac{1}{2}\lVert \cdot \rVert_{\infty} \leqslant N \leqslant 2\lVert \cdot \rVert_{\infty}, \ \text{ constantes optimales}}$$
     Sur la figure, le parallélogramme contient le petit carré de demi-côté $\frac{1}{2}$, dont le coin $(\frac{1}{2}, \frac{1}{2})$ est sur son bord, et il est contenu dans le grand carré de demi-côté $2$, qu'il touche en $(-1, 2)$ et $(1, -2)$ : c'est la traduction géométrique des deux inégalités.
- id: "mp-04-24"
  feuille: "f-mp-04"
  numero: 24
  partie: "Comparaison des normes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [comparaison des normes, boules, norme uniforme, normes équivalentes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes, boule-ouverte]
  source: "Normes (Prost), exercice 18"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On note $\ell^{\infty}$ l'espace des suites réelles bornées. Pour $u \in \ell^{\infty}$, on pose $\lVert u \rVert_{\infty} = \sup\limits_{n \in \mathbb{N}} |u_{n}|$ et $\lVert u \rVert'_{\infty} = \sup\limits_{n \in \mathbb{N}} \big(|u_{n}| + |u_{2n}|\big)$. Montrer que l'on définit ainsi deux normes équivalentes sur $\ell^{\infty}$, et préciser les meilleures constantes.
  corrige: |
    Pour tout entier $n$, on a $|u_{n}| \leqslant |u_{n}| + |u_{2n}| \leqslant 2\lVert u \rVert_{\infty}$ ; la borne supérieure qui définit $\lVert u \rVert'_{\infty}$ existe donc, et l'on obtient 
    $$\lVert u \rVert_{\infty} \leqslant \lVert u \rVert'_{\infty} \leqslant 2\lVert u \rVert_{\infty}.$$
     L'homogénéité et l'inégalité triangulaire se vérifient terme à terme, et la séparation découle de la première inégalité. Pour l'optimalité, on teste deux suites. La suite $e_{1}$, dont le seul terme non nul est $u_{1} = 1$, et la suite constante $\mathbf{1}$ égale à $1$ donnent 
    $$\lVert e_{1} \rVert'_{\infty} = 1 = \lVert e_{1} \rVert_{\infty}, \qquad \lVert \mathbf{1} \rVert'_{\infty} = 2 = 2\lVert \mathbf{1} \rVert_{\infty}.$$

    $$\boxed{\lVert \cdot \rVert_{\infty} \leqslant \lVert \cdot \rVert'_{\infty} \leqslant 2\lVert \cdot \rVert_{\infty}, \ \text{ constantes optimales}}$$
- id: "mp-04-25"
  feuille: "f-mp-04"
  numero: 25
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, boules, norme uniforme, normes équivalentes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes, boule-ouverte]
  source: "Normes (Prost), exercice 19"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $F$ l'ensemble des suites réelles bornées $u$ telles que $u_{0} = 0$.

    **1.** Montrer que $F$ est un sous-espace vectoriel de $\ell^{\infty}$, et que $N(u) = \sup\limits_{n \in \mathbb{N}} |u_{n+1} - u_{n}|$ définit une norme sur $F$.

    **2.** Montrer que $N(u) \leqslant 2\lVert u \rVert_{\infty}$ pour tout $u \in F$. Peut-il y avoir égalité ?

    **3.** En considérant les suites $u^{(p)}$ définies par $u^{(p)}_{n} = \min\big(\frac{n}{p}, 1\big)$, montrer que $N$ et $\lVert \cdot \rVert_{\infty}$ ne sont pas équivalentes sur $F$.
  corrige: |
    **1.** Une combinaison linéaire de suites bornées de premier terme nul est bornée et de premier terme nul : $F$ est un sous-espace de $\ell^{\infty}$. Pour $u \in F$, $|u_{n+1} - u_{n}| \leqslant 2\lVert u \rVert_{\infty}$, donc $N(u)$ existe. L'homogénéité et l'inégalité triangulaire sont immédiates. Si $N(u) = 0$, la suite est constante, égale à $u_{0} = 0$.

    **2.** L'inégalité a été vue au passage. Elle est atteinte par $u = (0, 1, -1, 1, -1, \dots)$, pour laquelle $|u_{2} - u_{1}| = 2$ et $\lVert u \rVert_{\infty} = 1$. 
    $$\boxed{N \leqslant 2\lVert \cdot \rVert_{\infty}, \ \text{ avec égalité pour } u = (0, 1, -1, 1, \dots)}$$

    **3.** La suite $u^{(p)}$ croît de $0$ à $1$ par pas de $\frac{1}{p}$, puis reste constante : $N(u^{(p)}) = \frac{1}{p}$ et $\lVert u^{(p)} \rVert_{\infty} = 1$. Le quotient $\frac{\lVert u^{(p)} \rVert_{\infty}}{N(u^{(p)})} = p$ n'est pas borné. 
    $$\boxed{N \text{ et } \lVert \cdot \rVert_{\infty} \text{ ne sont pas équivalentes sur } F}$$
     On retrouve la même situation que pour $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ sur $\mathcal{C}([0, 1], \mathbb{R})$ (proposition 11) : une inégalité est vraie, l'autre impossible. La norme $N$ mesure les « pentes » de la suite ; une suite qui monte lentement est petite pour $N$ sans l'être pour $\lVert \cdot \rVert_{\infty}$.
- id: "mp-04-26"
  feuille: "f-mp-04"
  numero: 26
  partie: "Comparaison des normes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [comparaison des normes, norme uniforme, normes équivalentes, ouverts, normes sur les polynômes]
  noeuds: [gd-equivalence, gd-normes, tr-ouverts]
  notions: [normes-equivalentes, ouvert]
  source: "Normes (Prost), exercice 15 ; Topologie (LLG), exercice 1 ; BibM@th, Espaces vectoriels normés, exercice 16"
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Pour $P = \sum_{k \geqslant 0} a_{k}X^{k} \in \mathbb{R}[X]$, on pose 
    $$N_{1}(P) = \sum_{k \geqslant 0} |a_{k}|, \qquad N_{\infty}(P) = \max_{k \geqslant 0} |a_{k}|, \qquad N_{I}(P) = \int_{0}^{1} |P(t)|\,\mathrm{d} t, \qquad N_{S}(P) = \sup_{t \in [0, 1]} |P(t)|.$$

    **1.** Montrer que ce sont des normes sur $\mathbb{R}[X]$.

    **2.** Établir les inégalités $N_{\infty} \leqslant N_{1}$ et $N_{I} \leqslant N_{S} \leqslant N_{1}$.

    **3.** À l'aide des polynômes $X^{n}$, $1 + X + \cdots + X^{n}$ et $(1 - X)^{n}$, montrer que ces quatre normes sont deux à deux non équivalentes.

    **4.** Montrer que tout ouvert pour $N_{\infty}$ est un ouvert pour $N_{1}$. La réciproque est-elle vraie ?

    **5.** Soit $d \in \mathbb{N}$. Montrer que les restrictions de $N_{1}$ et $N_{\infty}$ à $\mathbb{R}_{d}[X]$ sont équivalentes.
  corrige: |
    **1.** Les applications $N_{1}$ et $N_{\infty}$ sont les normes de la proposition 4 appliquées aux coefficients, qui sont en nombre fini. Pour $N_{I}$ et $N_{S}$, homogénéité et inégalité triangulaire viennent du théorème 1 ; si $N_{I}(P) = 0$ ou $N_{S}(P) = 0$, la fonction continue $|P|$ est nulle sur $[0, 1]$, et $P$, qui a une infinité de racines, est nul.

    **2.** Le plus grand coefficient est majoré par la somme des modules. Ensuite $\int_{0}^{1} |P| \leqslant \sup_{[0, 1]} |P|$, et pour $t \in [0, 1]$, $|P(t)| \leqslant \sum |a_{k}|t^{k} \leqslant \sum |a_{k}|$. 
    $$\boxed{N_{\infty} \leqslant N_{1}, \qquad N_{I} \leqslant N_{S} \leqslant N_{1}}$$

    **3.** On calcule les quatre normes sur les trois familles proposées, avec $S_{n} = 1 + X + \cdots + X^{n}$ :

    $$\begin{array}{c|cccc}   & N_{1} & N_{\infty} & N_{I} & N_{S} \\ \hline X^{n} & 1 & 1 & \frac{1}{n + 1} & 1 \\  S_{n} & n + 1 & 1 & \sum_{k=1}^{n+1} \frac{1}{k} & n + 1 \\  (1 - X)^{n} & 2^{n} & \binom{n}{\lfloor n/2 \rfloor} & \frac{1}{n + 1} & 1 \end{array}$$

    Pour chaque paire, un quotient non borné suffit. La famille $(X^{n})$ sépare $N_{I}$ de chacune des trois autres ; $(S_{n})$ sépare $N_{1}$ et $N_{S}$ de $N_{\infty}$ ; enfin $(1 - X)^{n}$ sépare $N_{S}$ de $N_{1}$, avec un quotient $2^{n}$. 
    $$\boxed{\text{Les quatre normes sont deux à deux non équivalentes}}$$

    **4.** Comme $N_{\infty} \leqslant N_{1}$, la boule $B_{N_{1}}(P, r)$ est contenue dans $B_{N_{\infty}}(P, r)$. Si $U$ est ouvert pour $N_{\infty}$ et $P \in U$, une boule $B_{N_{\infty}}(P, r)$ est dans $U$, donc aussi $B_{N_{1}}(P, r)$ : $U$ est ouvert pour $N_{1}$. La réciproque est fausse : la boule $B_{N_{1}}(0, 1)$ est ouverte pour $N_{1}$, mais toute boule $B_{N_{\infty}}(0, r)$ contient $\frac{r}{2}S_{n}$, de norme $N_{1}$ égale à $\frac{r(n + 1)}{2} > 1$ pour $n$ grand. 
    $$\boxed{\text{ouvert pour } N_{\infty} \implies \text{ouvert pour } N_{1}, \ \text{ réciproque fausse}}$$
     Une norme plus grande a plus d'ouverts : elle est plus « fine ».

    **5.** Sur $\mathbb{R}_{d}[X]$, il y a au plus $d + 1$ coefficients, d'où $N_{1} \leqslant (d + 1)N_{\infty}$. 
    $$\boxed{N_{\infty} \leqslant N_{1} \leqslant (d + 1)N_{\infty} \ \text{ sur } \mathbb{R}_{d}[X]}$$
     C'est la proposition 10 dans $\mathbb{R}^{d+1}$ : la non-équivalence de la question 3 vient du degré non borné, c'est-à-dire de la dimension infinie.
- id: "mp-04-27"
  feuille: "f-mp-04"
  numero: 27
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, normes équivalentes, normes sur les polynômes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes]
  source: "Normes (Prost), exercice 16 ; BibM@th, Espaces vectoriels normés, exercice 21"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Pour $a \in \mathbb{R}$ et $P \in \mathbb{R}[X]$, on pose $N_{a}(P) = |P(a)| + \int_{0}^{1} |P'(t)|\,\mathrm{d} t$.

    **1.** Montrer que $N_{a}$ est une norme sur $\mathbb{R}[X]$ pour tout réel $a$.

    **2.** Soit $a$, $b \in [0, 1]$. Montrer que $N_{b} \leqslant 2N_{a}$, et en déduire que $N_{a}$ et $N_{b}$ sont équivalentes.

    **3.** On pose $P_{n} = \frac{X^{n}}{2^{n}}$. Pour quelles valeurs de $a$ la suite $(P_{n})$ converge-t-elle pour la norme $N_{a}$ ? Préciser alors sa limite.

    **4.** Soit $0 \leqslant a < b$ avec $b > 1$. En considérant les polynômes $\frac{X^{n}}{b^{n}}$, montrer que $N_{a}$ et $N_{b}$ ne sont pas équivalentes.
  corrige: |
    **1.** L'homogénéité et l'inégalité triangulaire sont claires. Si $N_{a}(P) = 0$, la fonction continue $|P'|$ est nulle sur $[0, 1]$, donc le polynôme $P'$ est nul, $P$ est constant, égal à $P(a) = 0$.

    **2.** Pour $a$, $b \in [0, 1]$, on écrit $P(b) = P(a) + \int_{a}^{b} P'$, d'où $|P(b)| \leqslant |P(a)| + \int_{0}^{1} |P'|$ et 
    $$N_{b}(P) \leqslant |P(a)| + 2\int_{0}^{1} |P'| \leqslant 2N_{a}(P).$$

    $$\boxed{N_{b} \leqslant 2N_{a}, \quad N_{a} \leqslant 2N_{b} \quad (a, b \in [0, 1])}$$

    **3.** On calcule $\int_{0}^{1} |P_{n}'| = \frac{1}{2^{n}}\int_{0}^{1} nt^{n-1}\,\mathrm{d} t = \frac{1}{2^{n}}$, d'où $N_{a}(P_{n}) = \big(\frac{|a|}{2}\big)^{n} + \frac{1}{2^{n}}$. Si $|a| < 2$, $P_{n} \to 0$. Supposons maintenant $P_{n} \to Q$ pour $N_{a}$. Alors $\int_{0}^{1} |Q'| \leqslant \int_{0}^{1} |Q' - P_{n}'| + \frac{1}{2^{n}} \to 0$, donc $Q$ est une constante $c$, et $|P_{n}(a) - c| \to 0$, c'est-à-dire $\big(\frac{a}{2}\big)^{n} \to c$. Pour $|a| > 2$ ou $a = -2$, c'est impossible ; pour $a = 2$, on trouve $c = 1$, et l'on vérifie que $N_{2}(P_{n} - 1) = 0 + \frac{1}{2^{n}} \to 0$. 
    $$\boxed{P_{n} \to 0 \text{ si } |a| < 2, \quad P_{n} \to 1 \text{ si } a = 2, \quad (P_{n}) \text{ diverge sinon}}$$
     *Piège.* Le cas $a = 2$ est facile à manquer : la suite converge, mais vers la constante $1$, et non vers $0$. Le même polynôme $P_{n}$ a ainsi des limites différentes pour $N_{0}$ et $N_{2}$, ce qui annonce la question suivante et l'exercice 55.

    **4.** On pose $Q_{n} = \frac{X^{n}}{b^{n}}$. Comme à la question 3, $\int_{0}^{1} |Q_{n}'| = \frac{1}{b^{n}}$, donc 
    $$N_{b}(Q_{n}) = 1 + \frac{1}{b^{n}} \to 1, \qquad N_{a}(Q_{n}) = \Big(\frac{a}{b}\Big)^{n} + \frac{1}{b^{n}} \to 0,$$
     puisque $0 \leqslant a < b$ et $b > 1$. Le quotient $\frac{N_{b}(Q_{n})}{N_{a}(Q_{n})}$ tend vers $+\infty$. 
    $$\boxed{N_{a} \text{ et } N_{b} \text{ ne sont pas équivalentes}}$$
- id: "mp-04-28"
  feuille: "f-mp-04"
  numero: 28
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, produit scalaire, norme uniforme, normes équivalentes]
  noeuds: [gd-equivalence, me-produit-scalaire, gd-normes]
  notions: [normes-equivalentes, produit-scalaire]
  source: "Normes (Prost), exercice 21 ; Topologie (LLG), exercice 2 ; BibM@th, Espaces vectoriels normés, exercice 22"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Pour $f \in \mathcal{C}^{1}([0, 1], \mathbb{R})$, on pose $N(f) = \Big(f(0)^{2} + \int_{0}^{1} f'(t)^{2}\,\mathrm{d} t\Big)^{1/2}$.

    **1.** Montrer que $a + b \leqslant \sqrt{2}\sqrt{a^{2} + b^{2}}$ pour tous réels $a$ et $b$.

    **2.** Montrer que $N$ est une norme, en reconnaissant la norme associée à un produit scalaire.

    **3.** Montrer que $\lVert f \rVert_{\infty} \leqslant \sqrt{2}\,N(f)$ pour toute $f$. Les normes $N$ et $\lVert \cdot \rVert_{\infty}$ sont-elles équivalentes ?
  corrige: |
    **1.** L'inégalité $(a + b)^{2} \leqslant 2(a^{2} + b^{2})$ équivaut à $(a - b)^{2} \geqslant 0$, et l'on prend la racine. 
    $$\boxed{a + b \leqslant |a| + |b| \leqslant \sqrt{2}\sqrt{a^{2} + b^{2}}}$$

    **2.** L'application $\varphi(f, g) = f(0)g(0) + \int_{0}^{1} f'g'$ est bilinéaire, symétrique et positive. Si $\varphi(f, f) = 0$, alors $f(0) = 0$ et $\int_{0}^{1} f'^{2} = 0$, donc $f' = 0$ par continuité, et $f = 0$. C'est un produit scalaire, et $N$ est la norme associée (proposition 3).

    **3.** Pour $x \in [0, 1]$, on écrit 
    $$f(x) = f(0) + \int_{0}^{x} f'(t)\,\mathrm{d} t,$$
     puis on applique l'inégalité de Cauchy-Schwarz : 
    $$|f(x)| \leqslant |f(0)| + \int_{0}^{1} |f'| \leqslant |f(0)| + \Big(\int_{0}^{1} f'^{2}\Big)^{1/2},$$
     et la question 1 majore ce dernier membre par $\sqrt{2}\,N(f)$. 
    $$\boxed{\lVert f \rVert_{\infty} \leqslant \sqrt{2}\,N(f)}$$
     L'autre inégalité est impossible : la fonction $f_{n} : t \mapsto \sin(n\pi t)$ vérifie $\lVert f_{n} \rVert_{\infty} = 1$ et 
    $$N(f_{n})^{2} = \int_{0}^{1} n^{2}\pi^{2}\cos^{2}(n\pi t)\,\mathrm{d} t = \frac{n^{2}\pi^{2}}{2}.$$

    $$\boxed{N \text{ et } \lVert \cdot \rVert_{\infty} \text{ ne sont pas équivalentes}}$$
     La norme $N$ contrôle la dérivée ; une fonction qui oscille vite reste petite pour $\lVert \cdot \rVert_{\infty}$ mais devient grande pour $N$.
- id: "mp-04-29"
  feuille: "f-mp-04"
  numero: 29
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, norme uniforme, normes équivalentes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes]
  source: "Topologie (LLG), exercice 3 ; BibM@th, Espaces vectoriels normés, exercices 18 et 20"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Soit $a < b$ et $E = \mathcal{C}^{1}([a, b], \mathbb{R})$. Pour $f \in E$, on pose 
    $$N_{1}(f) = |f(a)| + \lVert f' \rVert_{\infty}, \qquad N_{2}(f) = \lVert f \rVert_{\infty} + \lVert f' \rVert_{\infty}, \qquad N_{3}(f) = |f(a)| + \int_{a}^{b} |f'(t)|\,\mathrm{d} t.$$

    **1.** Montrer que $N_{1}$, $N_{2}$ et $N_{3}$ sont des normes sur $E$.

    **2.** Montrer que $N_{1}$ et $N_{2}$ sont équivalentes, avec des constantes explicites.

    **3.** Comparer $N_{3}$ et $N_{1}$, puis $N_{3}$ et $\lVert \cdot \rVert_{\infty}$. Lesquelles de ces normes sont équivalentes ?
  corrige: |
    **1.** Les trois applications sont homogènes et sous-additives. Si $N_{1}(f) = 0$ ou $N_{3}(f) = 0$, alors $f(a) = 0$ et $f' = 0$ (par continuité de $|f'|$ pour $N_{3}$), donc $f = 0$. Pour $N_{2}$, c'est la séparation de $\lVert \cdot \rVert_{\infty}$.

    **2.** On a $|f(a)| \leqslant \lVert f \rVert_{\infty}$, d'où $N_{1} \leqslant N_{2}$. Dans l'autre sens, l'inégalité des accroissements finis donne $|f(x)| \leqslant |f(a)| + (b - a)\lVert f' \rVert_{\infty}$, donc 
    $$N_{2}(f) \leqslant |f(a)| + (1 + b - a)\lVert f' \rVert_{\infty} \leqslant (1 + b - a)N_{1}(f).$$

    $$\boxed{N_{1} \leqslant N_{2} \leqslant (1 + b - a)N_{1}}$$

    **3.** D'abord $\int_{a}^{b} |f'| \leqslant (b - a)\lVert f' \rVert_{\infty}$, d'où $N_{3} \leqslant \max(1, b - a)N_{1}$. Ensuite $|f(x)| \leqslant |f(a)| + \int_{a}^{b} |f'|$, d'où $\lVert \cdot \rVert_{\infty} \leqslant N_{3}$. Les autres inégalités sont impossibles. Pour $f_{n}(t) = \big(\frac{t - a}{b - a}\big)^{n}$, la dérivée est positive, donc $N_{3}(f_{n}) = f_{n}(b) - f_{n}(a) = 1$, alors que $N_{1}(f_{n}) = \lVert f_{n}' \rVert_{\infty} = \frac{n}{b - a}$. Pour $g_{n}(t) = \sin\big(n(t - a)\big)$, on a $\lVert g_{n} \rVert_{\infty} \leqslant 1$, alors que 
    $$N_{3}(g_{n}) = \int_{0}^{n(b - a)} |\cos u|\,\mathrm{d} u \geqslant 2\Big\lfloor \frac{n(b - a)}{\pi} \Big\rfloor \to +\infty,$$
     puisque l'intégrale de $|\cos|$ sur une période $\pi$ vaut $2$. 
    $$\boxed{\lVert \cdot \rVert_{\infty} \leqslant N_{3} \leqslant \max(1, b - a)N_{1} \leqslant \max(1, b - a)N_{2} ; \ \text{ seules } N_{1} \text{ et } N_{2} \text{ sont équivalentes}}$$
     Les trois niveaux correspondent à ce que chaque norme contrôle : la valeur seule, la dérivée en moyenne, la dérivée uniformément.
- id: "mp-04-30"
  feuille: "f-mp-04"
  numero: 30
  partie: "Comparaison des normes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [comparaison des normes, norme uniforme, normes équivalentes]
  noeuds: [gd-equivalence, gd-normes]
  notions: [normes-equivalentes]
  source: "Normes (Prost), exercice 22"
  page_enonce: 7
  page_corrige: 16
  enonce: |
    Soit $E = \{f \in \mathcal{C}^{1}([0, 1], \mathbb{R}) \mid f(0) = 0\}$. Pour $f \in E$, on pose $N_{1}(f) = \lVert f' \rVert_{\infty}$ et $N_{2}(f) = \lVert f + f' \rVert_{\infty}$.

    **1.** Montrer que $N_{1}$ et $N_{2}$ sont des normes sur $E$.

    **2.** Montrer que, pour tous $f \in E$ et $x \in [0, 1]$, $f(x) = \mathrm{e}^{-x}\int_{0}^{x} \big(f(t) + f'(t)\big)\mathrm{e}^{t}\,\mathrm{d} t$.

    **3.** En déduire que $N_{1}$ et $N_{2}$ sont équivalentes, avec des constantes explicites.
  corrige: |
    **1.** L'homogénéité et l'inégalité triangulaire viennent de celles de $\lVert \cdot \rVert_{\infty}$. Si $N_{1}(f) = 0$, $f$ est constante, égale à $f(0) = 0$. Si $N_{2}(f) = 0$, alors $f' + f = 0$, donc $f : x \mapsto C\mathrm{e}^{-x}$ (chapitre 6 de MPSI), et $f(0) = 0$ impose $C = 0$.

    **2.** On dérive $x \mapsto f(x)\mathrm{e}^{x}$, dont la dérivée est $(f + f')\mathrm{e}^{x}$, et l'on intègre de $0$ à $x$, en utilisant $f(0) = 0$ : 
    $$\boxed{f(x) = \mathrm{e}^{-x}\int_{0}^{x} \big(f(t) + f'(t)\big)\mathrm{e}^{t}\,\mathrm{d} t}$$

    **3.** On en déduit $|f(x)| \leqslant \mathrm{e}^{-x}N_{2}(f)\,(\mathrm{e}^{x} - 1) \leqslant (1 - \mathrm{e}^{-1})N_{2}(f)$, puis 
    $$N_{1}(f) = \lVert f' \rVert_{\infty} \leqslant \lVert f + f' \rVert_{\infty} + \lVert f \rVert_{\infty} \leqslant (2 - \mathrm{e}^{-1})N_{2}(f).$$
     Dans l'autre sens, $|f(x)| = \big|\int_{0}^{x} f'\big| \leqslant N_{1}(f)$, d'où $N_{2}(f) \leqslant \lVert f \rVert_{\infty} + \lVert f' \rVert_{\infty} \leqslant 2N_{1}(f)$. 
    $$\boxed{\tfrac{1}{2}N_{2} \leqslant N_{1} \leqslant (2 - \mathrm{e}^{-1})N_{2}, \qquad 2 - \mathrm{e}^{-1} \approx 1{,}632}$$
     La question 2 est la méthode de variation de la constante : elle exprime $f$ à partir de $f + f'$, et c'est ce qui permet de contrôler $f$ par $N_{2}$.
- id: "mp-04-31"
  feuille: "f-mp-04"
  numero: 31
  partie: "Comparaison des normes"
  etoiles: 1
  types: [Démonstration]
