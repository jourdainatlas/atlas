- id: "mp-04-01"
  feuille: "f-mp-04"
  numero: 1
  partie: "Normes, distances, boules"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [normes, boules, fermés]
  noeuds: [f-evn, gd-normes, tr-ouverts]
  notions: [norme, boule-ouverte, ferme]
  source: "BibM@th, Espaces vectoriels normés, exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $x$, $y \in E$, $r \geqslant 0$ et $\lambda \in \mathbb{K}^{*}$. Montrer les égalités 
    $$x + B_{f}(y, r) = B_{f}(x + y, r) \qquad\text{et}\qquad \lambda\,B_{f}(0, r) = B_{f}(0, |\lambda|r).$$
     En déduire que toutes les boules fermées de rayon strictement positif s'obtiennent à partir de la boule unité fermée $B_{f}(0, 1)$ par une homothétie suivie d'une translation.
  corrige: |
    On raisonne par équivalences. Pour $z \in E$, 
    $$z \in x + B_{f}(y, r) \iff z - x \in B_{f}(y, r) \iff \lVert (z - x) - y \rVert \leqslant r \iff z \in B_{f}(x + y, r).$$
     Pour la seconde égalité, si $z = \lambda w$ avec $\lVert w \rVert \leqslant r$, alors $\lVert z \rVert = |\lambda|\,\lVert w \rVert \leqslant |\lambda|r$ ; réciproquement, si $\lVert z \rVert \leqslant |\lambda|r$, le vecteur $w = \frac{z}{\lambda}$ vérifie $\lVert w \rVert \leqslant r$ et $z = \lambda w$. 
    $$\boxed{x + B_{f}(y, r) = B_{f}(x + y, r), \qquad \lambda\,B_{f}(0, r) = B_{f}(0, |\lambda|r)}$$
     En combinant les deux, pour $r > 0$ : 
    $$\boxed{B_{f}(a, r) = a + r\,B_{f}(0, 1)}$$
     Toutes les boules fermées sont donc « la même », agrandie puis déplacée : c'est pourquoi la seule boule unité suffit à décrire une norme (exercice 2), et pourquoi la figure de la page 1 du cours ne montre que des boules unités.
- id: "mp-04-02"
  feuille: "f-mp-04"
  numero: 2
