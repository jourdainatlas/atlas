  source: "exercice composé pour la feuille"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    Soit $A$ une partie de $E$ et $U \subset A$.

    **1.** On suppose $A$ ouvert dans $E$. Montrer que $U$ est un ouvert relatif de $A$ si et seulement si $U$ est un ouvert de $E$.

    **2.** On suppose $A$ fermé dans $E$. Énoncer et démontrer le résultat analogue pour les fermés.

    **3.** Montrer par un exemple que l'hypothèse « $A$ ouvert » ne peut pas être supprimée dans la question 1.
  corrige: |
    **1.** Si $U$ est un ouvert de $E$ contenu dans $A$, alors $U = U \cap A$ est un ouvert relatif (théorème 3). Réciproquement, si $U = O \cap A$ avec $O$ ouvert, c'est une intersection de deux ouverts, donc un ouvert (proposition 12). 
    $$\boxed{A \text{ ouvert} : \ U \text{ ouvert relatif de } A \iff U \text{ ouvert de } E}$$

    **2.** Le même raisonnement, avec le théorème 3 (ii) et la proposition 13, donne le résultat pour les fermés. 
    $$\boxed{A \text{ fermé} : \ F \text{ fermé relatif de } A \iff F \text{ fermé de } E}$$

    **3.** Dans $\mathbb{R}$, avec $A = [0, 1]$, la partie $U = [0, \frac{1}{2}[ \, = A \cap \, ]-1, \frac{1}{2}[$ est un ouvert relatif de $A$, mais pas un ouvert de $\mathbb{R}$ : c'est l'exemple de la figure du cours.
- id: "mp-04-51"
  feuille: "f-mp-04"
  numero: 51
  partie: "Ouverts et fermés relatifs"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [topologie relative, ouverts, fermés, adhérence et intérieur, normes sur les polynômes]
  noeuds: [me-topologie, tr-ouverts, tr-adherence, gd-normes]
  notions: [topologie-induite, ouvert, ferme, adherence]
  source: "Topologie des espaces normés (Prost), exercice 7 ; Topologie (LLG), exercice 20"
  page_enonce: 11
  page_corrige: 25
  enonce: |
    Soit $d \geqslant 1$. On munit $\mathbb{R}_{d}[X]$ de la norme $N_{1}\big(\sum a_{k}X^{k}\big) = \sum |a_{k}|$. On note $U_{d}$ l'ensemble des polynômes unitaires de degré $d$, $A_{d}$ l'ensemble des polynômes de $U_{d}$ scindés à racines simples sur $\mathbb{R}$, et $\Sigma_{d}$ l'ensemble des polynômes de $U_{d}$ scindés sur $\mathbb{R}$.

    **1.** Montrer que $|P(t) - Q(t)| \leqslant N_{1}(P - Q)\max(1, |t|)^{d}$ pour tous $P$, $Q \in \mathbb{R}_{d}[X]$ et $t \in \mathbb{R}$.

    **2.** Soit $P \in A_{d}$, de racines $x_{1} < \cdots < x_{d}$. Construire des réels $t_{0} < x_{1} < t_{1} < \cdots < x_{d} < t_{d}$ tels que $P(t_{i})$ et $P(t_{i+1})$ soient de signes opposés. En déduire qu'il existe $r > 0$ tel que tout $Q \in U_{d}$ vérifiant $N_{1}(Q - P) < r$ appartienne à $A_{d}$.

    **3.** En déduire que $A_{d}$ est un ouvert relatif de $U_{d}$. Est-il un ouvert de $\mathbb{R}_{d}[X]$ ?

    **4.** Montrer que les racines d'un polynôme $P = X^{d} + a_{d-1}X^{d-1} + \cdots + a_{0} \in \Sigma_{d}$ sont de valeur absolue au plus $\max(1, N_{1}(P - X^{d}))$.

    **5.** Montrer que $\Sigma_{d}$ est un fermé relatif de $U_{d}$, puis que l'adhérence relative de $A_{d}$ dans $U_{d}$ est $\Sigma_{d}$.
  corrige: |
    **1.** En écrivant $P - Q = \sum_{k} c_{k}X^{k}$, 
    $$|P(t) - Q(t)| \leqslant \sum_{k=0}^{d} |c_{k}|\,|t|^{k} \leqslant \max(1, |t|)^{d}\sum_{k} |c_{k}| = N_{1}(P - Q)\max(1, |t|)^{d}.$$

    **2.** On a $P = \prod_{j}(X - x_{j})$. On choisit $t_{0} < x_{1}$, $t_{d} > x_{d}$ et $t_{i} \in \, ]x_{i}, x_{i+1}[$ pour $1 \leqslant i \leqslant d - 1$. Le produit $P(t_{i}) = \prod_{j}(t_{i} - x_{j})$ a exactement $d - i$ facteurs négatifs : il est non nul et du signe de $(-1)^{d - i}$, ce qui alterne. Posons 
    $$r = \min_{0 \leqslant i \leqslant d} \frac{|P(t_{i})|}{\max(1, |t_{i}|)^{d}} > 0.$$
     Si $Q \in U_{d}$ et $N_{1}(Q - P) < r$, la question 1 donne $|Q(t_{i}) - P(t_{i})| < |P(t_{i})|$ : $Q(t_{i})$ a le signe de $P(t_{i})$. Par le théorème des valeurs intermédiaires, $Q$ s'annule sur chacun des $d$ intervalles $]t_{i-1}, t_{i}[$ ; ayant $d$ racines réelles distinctes et étant de degré $d$, il est scindé à racines simples. 
    $$\boxed{U_{d} \cap B_{N_{1}}(P, r) \subset A_{d}}$$

    **3.** La question 2 montre que $A_{d} = U_{d} \cap \bigcup_{P \in A_{d}} B(P, r_{P})$, intersection de $U_{d}$ et d'un ouvert : c'est un ouvert relatif (théorème 3). Ce n'est pas un ouvert de $\mathbb{R}_{d}[X]$ : pour $P \in A_{d}$, les polynômes $(1 + \varepsilon)P$, de coefficient dominant $1 + \varepsilon$, ne sont pas dans $U_{d}$, et $N_{1}\big((1 + \varepsilon)P - P\big) = \varepsilon N_{1}(P) \to 0$. 
    $$\boxed{A_{d} \text{ est un ouvert relatif de } U_{d}, \text{ mais pas un ouvert de } \mathbb{R}_{d}[X]}$$

    **4.** Soit $x$ une racine de $P$ avec $|x| > 1$. De $x^{d} = -\sum_{k < d} a_{k}x^{k}$, on tire 
    $$|x|^{d} \leqslant \sum_{k < d} |a_{k}|\,|x|^{k} \leqslant N_{1}(P - X^{d})\,|x|^{d - 1},$$
     d'où $|x| \leqslant N_{1}(P - X^{d})$. 
    $$\boxed{|x| \leqslant \max\big(1, N_{1}(P - X^{d})\big)}$$
     L'argument vaut pour les racines complexes, et sans hypothèse sur $P \in U_{d}$.

    **5.** Soit $(P_{k})$ une suite de $\Sigma_{d}$ qui converge vers $P \in U_{d}$ ; on utilise le théorème 3 (iii). Les racines $x_{k, 1} \leqslant \cdots \leqslant x_{k, d}$ de $P_{k}$ sont bornées par $\sup_{k} \max\big(1, N_{1}(P_{k} - X^{d})\big)$, fini puisque la suite converge. Par $d$ extractions successives (théorème de Bolzano-Weierstrass, et exercice 13), on obtient $\varphi$ telle que $x_{\varphi(k), i} \to \lambda_{i}$ pour tout $i$. Les coefficients de $P_{\varphi(k)} = \prod_{i}(X - x_{\varphi(k), i})$ sont des expressions polynomiales en les racines : ils tendent vers ceux de $\prod_{i}(X - \lambda_{i})$, mais aussi vers ceux de $P$. Donc $P = \prod_{i}(X - \lambda_{i}) \in \Sigma_{d}$, qui est un fermé relatif de $U_{d}$. Comme $A_{d} \subset \Sigma_{d}$, l'adhérence relative de $A_{d}$ est contenue dans $\Sigma_{d}$. Réciproquement, si $P = \prod_{i}(X - \lambda_{i})$ avec $\lambda_{1} \leqslant \cdots \leqslant \lambda_{d}$, les polynômes $P_{k} = \prod_{i}\big(X - \lambda_{i} - \frac{i}{k}\big)$ ont des racines strictement croissantes, donc sont dans $A_{d}$, et leurs coefficients tendent vers ceux de $P$. 
    $$\boxed{\Sigma_{d} \text{ est un fermé relatif de } U_{d}, \text{ et l'adhérence relative de } A_{d} \text{ est } \Sigma_{d}}$$
     On a utilisé l'outil des extractions successives, qui manquait à l'exercice 15 : c'est lui qui rend la convergence d'une suite de $\mathbb{R}^{d}$ accessible coordonnée par coordonnée, et le chapitre 5 en tirera le théorème de Bolzano-Weierstrass en dimension finie.
- id: "mp-04-52"
