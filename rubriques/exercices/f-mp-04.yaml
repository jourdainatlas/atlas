  enonce: |
    *Une suite, deux limites.* On se place dans $E = \mathbb{R}[X]$.

    **1.** Montrer que $N(Q) = \sup_{t \in [0, 1/2]} |Q(t)|$ est une norme sur $E$, et que $X^{n} \to 0$ pour $N$.

    **2.** Montrer que $N'(Q) = \sup_{t \in [0, 1/2]} \big|Q(t) - Q(1)(1 - t)\big|$ est une norme sur $E$, et que $X^{n} \to X - 1$ pour $N'$.

    **3.** Pourquoi ce résultat ne contredit-il pas l'unicité de la limite (proposition 6 du cours) ? Que peut-on en déduire sur les normes $N$ et $N'$ ?

    **4.** *(Plus difficile.)* Soit $P \in E$. Construire une norme sur $E$ pour laquelle $X^{n} \to P$. On pourra chercher une norme de la forme $Q \mapsto N\big(Q - \lambda(Q)R\big)$, où $\lambda$ est une forme linéaire sur $E$ telle que $\lambda(X^{n}) = 1$ pour $n$ assez grand, et $R$ un polynôme bien choisi.
  corrige: |
    **1.** C'est l'exercice 11 avec $A = [0, \frac{1}{2}]$, et $N(X^{n}) = 2^{-n} \to 0$.

    **2.** L'application $\varphi : Q \mapsto Q - Q(1)(1 - X)$ est linéaire, et $N' = N \circ \varphi$. Si $\varphi(Q) = 0$, alors $Q = Q(1)(1 - X)$ et, en évaluant en $1$, $Q(1) = 0$, puis $Q = 0$ : $\varphi$ est injective, et $N'$ est une norme (exercice 5). Avec $Q = X^{n} - (X - 1)$, on a $Q(1) = 1$ et 
    $$\varphi(Q) = X^{n} - X + 1 - (1 - X) = X^{n}, \qquad N'\big(X^{n} - (X - 1)\big) = N(X^{n}) = 2^{-n} \to 0.$$

    $$\boxed{X^{n} \to 0 \text{ pour } N, \qquad X^{n} \to X - 1 \text{ pour } N'}$$

    **3.** L'unicité de la limite est démontrée pour une norme fixée ; ici, il y en a deux. Par la proposition 9, deux normes équivalentes ont les mêmes suites convergentes et les mêmes limites. 
    $$\boxed{N \text{ et } N' \text{ ne sont pas équivalentes}}$$

    **4.** Si $P(1) \neq 1$, on prend $\lambda(Q) = Q(1)$, et $\lambda(X^{n}) = 1$ pour tout $n$. Si $P(1) = 1$, alors $P \neq 0$ ; on choisit $k$ tel que le coefficient $a_{k}$ de $X^{k}$ dans $P$ soit non nul, et $\lambda(Q) = Q(1) + [\text{coefficient de } X^{k} \text{ dans } Q]$ : alors $\lambda(X^{n}) = 1$ pour $n > k$, et $\lambda(P) = 1 + a_{k} \neq 1$. Dans les deux cas, on pose 
    $$R = \frac{P}{\lambda(P) - 1}, \qquad \varphi(Q) = Q - \lambda(Q)R, \qquad N_{P} = N \circ \varphi.$$
     Si $\varphi(Q) = 0$, alors $Q = \lambda(Q)R$, donc $\lambda(Q) = \lambda(Q)\lambda(R)$ ; or $\lambda(R) = \frac{\lambda(P)}{\lambda(P) - 1} \neq 1$, d'où $\lambda(Q) = 0$ et $Q = 0$ : $N_{P}$ est une norme. Enfin $\varphi(P) = P - \lambda(P)R = -R$ et, pour $n$ assez grand, $\varphi(X^{n}) = X^{n} - R$, d'où 
    $$N_{P}(X^{n} - P) = N\big(\varphi(X^{n}) - \varphi(P)\big) = N(X^{n}) = 2^{-n} \to 0.$$

    $$\boxed{X^{n} \to P \text{ pour la norme } N_{P}}$$
     Pour $P = X - 1$, on a $P(1) = 0$, $R = 1 - X$, et l'on retrouve la norme $N'$ de la question 2. En dimension infinie, la limite d'une suite n'est pas une propriété de la suite seule, mais du couple formé par la suite et la norme.
- id: "mp-04-56"
  feuille: "f-mp-04"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [synthèse, normes sur les polynômes]
  noeuds: [gd-normes]
  notions: []
  source: "Normes (Prost), exercice 13"
  page_enonce: 12
  page_corrige: 28
  enonce: |
    *La convergence simple ne vient d'aucune norme.* Soit $E = \mathcal{C}([0, 1], \mathbb{R})$. On dit qu'une norme $\lVert \cdot \rVert$ sur $E$ vérifie la propriété $(\ast)$ si, pour toute $f \in E$ et toute suite $(f_{n})$ de $E$, 
    $$\lVert f_{n} - f \rVert \to 0 \iff \forall t \in [0, 1], \ f_{n}(t) \to f(t).$$

    **1.** Pour $n \geqslant 1$, soit $\varphi_{n}$ la fonction nulle hors de $[0, \frac{2}{n}]$, affine sur $[0, \frac{1}{n}]$ et sur $[\frac{1}{n}, \frac{2}{n}]$, qui vaut $0$ en $0$ et en $\frac{2}{n}$, et $1$ en $\frac{1}{n}$. Montrer que, pour toute suite réelle $(\lambda_{n})$, la suite $(\lambda_{n}\varphi_{n})$ converge simplement vers la fonction nulle.

    **2.** En déduire qu'aucune norme sur $E$ ne vérifie $(\ast)$.

    **3.** Soit $k \in \mathbb{N}$, $F$ l'espace des fonctions polynomiales de degré au plus $k$ sur $[0, 1]$, et $\alpha_{0}$, …, $\alpha_{k}$ des points distincts de $[0, 1]$. Montrer que $\lVert P \rVert = \sum_{i=0}^{k} |P(\alpha_{i})|$ est une norme sur $F$, puis, à l'aide des polynômes interpolateurs de Lagrange, qu'elle vérifie la propriété $(\ast)$ dans $F$.
  corrige: |
    **1.** En $t = 0$, $\lambda_{n}\varphi_{n}(0) = 0$. Pour $t > 0$ et $n > \frac{2}{t}$, $t$ est hors du support $[0, \frac{2}{n}]$, donc $\lambda_{n}\varphi_{n}(t) = 0$. 
    $$\boxed{\lambda_{n}\varphi_{n} \to 0 \text{ simplement, quelle que soit } (\lambda_{n})}$$

    **2.** Supposons qu'une norme vérifie $(\ast)$. Comme $\varphi_{n} \neq 0$, on peut poser $\lambda_{n} = \frac{1}{\lVert \varphi_{n} \rVert}$. La suite $(\lambda_{n}\varphi_{n})$ converge simplement vers $0$ ; par $(\ast)$, $\lVert \lambda_{n}\varphi_{n} \rVert \to 0$, alors que cette norme vaut $1$. 
    $$\boxed{\text{Aucune norme sur } \mathcal{C}([0, 1], \mathbb{R}) \text{ ne vérifie } (\ast)}$$
     La convergence simple ne résiste pas à la multiplication par des scalaires arbitrairement grands, alors que la convergence pour une norme y est sensible : c'est le cœur de l'argument.

    **3.** Un polynôme de degré au plus $k$ nul aux $k + 1$ points $\alpha_{i}$ est nul : c'est la séparation, le reste étant clair. Les polynômes de Lagrange $L_{i}$ associés aux $\alpha_{i}$ (chapitre 13 de MPSI) donnent $P = \sum_{i} P(\alpha_{i})L_{i}$ pour tout $P \in F$. Si $\lVert P_{n} - P \rVert \to 0$, alors $P_{n}(\alpha_{i}) \to P(\alpha_{i})$ pour chaque $i$, et 
    $$P_{n}(t) = \sum_{i} P_{n}(\alpha_{i})L_{i}(t) \to \sum_{i} P(\alpha_{i})L_{i}(t) = P(t).$$
     Réciproquement, la convergence simple donne en particulier la convergence aux points $\alpha_{i}$, donc $\lVert P_{n} - P \rVert \to 0$. 
    $$\boxed{\text{Dans } F, \text{ la norme } \sum |P(\alpha_{i})| \text{ vérifie } (\ast)}$$
     En dimension finie, la convergence simple est « une » convergence normée ; le chapitre 5 montrera qu'elle l'est alors pour toute norme.
- id: "mp-04-57"
  feuille: "f-mp-04"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, normes équivalentes]
  noeuds: [gd-equivalence]
  notions: [normes-equivalentes]
  source: "Normes (Prost), exercice 20"
  page_enonce: 12
  page_corrige: 28
  enonce: |
    *Deux normes non équivalentes en dimension 2.* Soit $E = \mathbb{Q}[\sqrt{2}] = \{a + b\sqrt{2} \mid a, b \in \mathbb{Q}\}$.

    **1.** Montrer que $E$ est un $\mathbb{Q}$-espace vectoriel de dimension $2$, et que $N_{1}(a + b\sqrt{2}) = |a| + |b|$ et $N_{2}(a + b\sqrt{2}) = |a + b\sqrt{2}|$ définissent des normes sur $E$, au sens où les axiomes de la définition sont vérifiés pour des scalaires rationnels.

    **2.** On écrit $(1 + \sqrt{2})^{n} = a_{n} + b_{n}\sqrt{2}$ avec $a_{n}$, $b_{n} \in \mathbb{N}$. Montrer que $(\sqrt{2} - 1)^{n} = (-1)^{n}(a_{n} - b_{n}\sqrt{2})$, et en déduire que $N_{1}$ et $N_{2}$ ne sont pas équivalentes.

    **3.** Le chapitre 5 établira qu'en dimension finie, sur $\mathbb{R}$ ou $\mathbb{C}$, toutes les normes sont équivalentes. Pourquoi l'exemple précédent ne le contredit-il pas ? Quelle propriété de $\mathbb{R}$, que $\mathbb{Q}$ n'a pas, peut-on soupçonner d'intervenir dans la démonstration ?
  corrige: |
    **1.** La famille $(1, \sqrt{2})$ engendre $E$ par définition, et elle est libre sur $\mathbb{Q}$, puisque $a + b\sqrt{2} = 0$ avec $b \neq 0$ donnerait $\sqrt{2} = -\frac{a}{b} \in \mathbb{Q}$. L'application $N_{1}$ est la norme $\lVert \cdot \rVert_{1}$ des coordonnées. Pour $N_{2}$, l'homogénéité et l'inégalité triangulaire viennent de la valeur absolue, et la séparation de la liberté de $(1, \sqrt{2})$. 
    $$\boxed{\dim_{\mathbb{Q}} E = 2, \quad N_{1} \text{ et } N_{2} \text{ sont des normes}}$$

    **2.** Dans le développement de $(1 \pm \sqrt{2})^{n}$ par la formule du binôme, seuls les termes contenant une puissance impaire de $\sqrt{2}$ changent de signe : $(1 - \sqrt{2})^{n} = a_{n} - b_{n}\sqrt{2}$, et $(\sqrt{2} - 1)^{n} = (-1)^{n}(1 - \sqrt{2})^{n}$. Posons $x_{n} = (\sqrt{2} - 1)^{n}$ : 
    $$N_{2}(x_{n}) = (\sqrt{2} - 1)^{n} \to 0, \qquad N_{1}(x_{n}) = a_{n} + b_{n} \geqslant \frac{(1 + \sqrt{2})^{n}}{\sqrt{2}} \to +\infty.$$

    $$\boxed{N_{1} \text{ et } N_{2} \text{ ne sont pas équivalentes}}$$
     Par exemple, pour $n = 5$, $(1 + \sqrt{2})^{5} = 41 + 29\sqrt{2}$ et $(\sqrt{2} - 1)^{5} = 29\sqrt{2} - 41 \approx 0{,}0122$, alors que $N_{1}(x_{5}) = 70$ ✓.

    **3.** Le théorème annoncé porte sur des espaces sur $\mathbb{R}$ ou $\mathbb{C}$ ; ici le corps est $\mathbb{Q}$. Sa démonstration utilisera le théorème de Bolzano-Weierstrass, qui repose sur la propriété de la borne supérieure de $\mathbb{R}$ : c'est elle qui manque à $\mathbb{Q}$. 
    $$\boxed{\text{La dimension finie ne suffit pas : il faut aussi la propriété de la borne supérieure}}$$
     La suite $(x_{n})$ « tend vers $0$ » pour $N_{2}$ tout en ayant des coordonnées rationnelles qui explosent : ce sont les meilleures approximations rationnelles de $\sqrt{2}$, $\frac{a_{n}}{b_{n}} = 1, \frac{3}{2}, \frac{7}{5}, \frac{17}{12}, \dots$, que l'on retrouve ici.
- id: "mp-04-58"
  feuille: "f-mp-04"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse]
  noeuds: [f-evn]
  notions: []
  source: "Topologie (LLG), exercice 16"
  page_enonce: 13
  page_corrige: 29
  enonce: |
    *Sept parties au plus.* Pour une partie $A$ de $E$, on note $\alpha(A) = \overline{A}$ et $\iota(A) = \mathring{A}$. On étudie les parties obtenues à partir de $A$ en appliquant successivement $\alpha$ et $\iota$, dans un ordre quelconque.

    **1.** Montrer que $\alpha$ et $\iota$ sont croissantes pour l'inclusion, et que $\alpha \circ \alpha = \alpha$ et $\iota \circ \iota = \iota$.

    **2.** Montrer que $\iota\alpha\iota\alpha(A) = \iota\alpha(A)$ et $\alpha\iota\alpha\iota(A) = \alpha\iota(A)$ pour toute partie $A$.

    **3.** En déduire qu'on obtient au plus sept parties distinctes : $A$, $\iota(A)$, $\alpha(A)$, $\alpha\iota(A)$, $\iota\alpha(A)$, $\alpha\iota\alpha(A)$ et $\iota\alpha\iota(A)$.

    **4.** Dans $\mathbb{R}$, on pose $A = \, ]0, 1[ \cup \, ]1, 2[ \cup \{3\} \cup (\mathbb{Q} \cap [4, 5])$. Montrer que ces sept parties sont deux à deux distinctes.

    En 1922, Kazimierz Kuratowski a montré qu'en autorisant aussi le passage au complémentaire, on obtient au plus quatorze parties distinctes, et que ce nombre est atteint dans $\mathbb{R}$ (*Sur l'opération $\bar{A}$ de l'Analysis Situs*, Fundamenta Mathematicae, t. 3, 1922).
  corrige: |
    **1.** Si $A \subset B$, le fermé $\overline{B}$ contient $A$, donc $\overline{A}$ ; l'ouvert $\mathring{A}$ est contenu dans $B$, donc dans $\mathring{B}$ (proposition 14). L'adhérence d'un fermé est lui-même, et $\overline{A}$ est fermé : $\alpha\alpha = \alpha$ ; de même $\iota\iota = \iota$.

    **2.** Posons $U = \iota\alpha(A)$, ouvert. On a $U \subset \alpha(U)$, donc $U = \iota(U) \subset \iota\alpha(U) = \iota\alpha\iota\alpha(A)$. Inversement, $U \subset \alpha(A)$ donne $\alpha(U) \subset \alpha\alpha(A) = \alpha(A)$, puis $\iota\alpha(U) \subset \iota\alpha(A) = U$. La seconde identité s'obtient de même avec $V = \alpha\iota(A)$, fermé : $\iota(V) \subset V$ donne $\alpha\iota(V) \subset V$, et $\iota(A) \subset V$, ouvert, donne $\iota(A) \subset \iota(V)$, puis $V \subset \alpha\iota(V)$. 
    $$\boxed{\iota\alpha\iota\alpha = \iota\alpha, \qquad \alpha\iota\alpha\iota = \alpha\iota}$$

    **3.** Une suite d'opérations se ramène, par la question 1, à un mot alterné en $\alpha$ et $\iota$. Par la question 2, un mot alterné de longueur $4$ se réduit à un mot de longueur $2$, donc tout mot alterné à un mot de longueur au plus $3$. Il reste le mot vide, $\iota$, $\alpha$, $\alpha\iota$, $\iota\alpha$, $\alpha\iota\alpha$ et $\iota\alpha\iota$. 
    $$\boxed{\text{Au plus sept parties distinctes}}$$

    **4.** On calcule les sept parties pour $A = \, ]0, 1[ \cup \, ]1, 2[ \cup \{3\} \cup (\mathbb{Q} \cap [4, 5])$, en utilisant que $\mathbb{Q} \cap [4, 5]$ est d'intérieur vide et d'adhérence $[4, 5]$ :

    $$\begin{array}{ll}  \iota(A) = \, ]0, 1[ \cup \, ]1, 2[ & \alpha(A) = [0, 2] \cup \{3\} \cup [4, 5] \\  \alpha\iota(A) = [0, 2] & \iota\alpha(A) = \, ]0, 2[ \cup \, ]4, 5[ \\  \iota\alpha\iota(A) = \, ]0, 2[ & \alpha\iota\alpha(A) = [0, 2] \cup [4, 5] \end{array}$$

    Pour les distinguer, il suffit de tester l'appartenance de quatre points : $0$, $1$, $3$ et l'irrationnel $\sqrt{20} \approx 4{,}47$.

    $$\begin{array}{c|ccccccc}   & A & \iota(A) & \alpha(A) & \alpha\iota(A) & \iota\alpha(A) & \iota\alpha\iota(A) & \alpha\iota\alpha(A) \\ \hline 0 & \text{non} & \text{non} & \text{oui} & \text{oui} & \text{non} & \text{non} & \text{oui} \\  1 & \text{non} & \text{non} & \text{oui} & \text{oui} & \text{oui} & \text{oui} & \text{oui} \\  3 & \text{oui} & \text{non} & \text{oui} & \text{non} & \text{non} & \text{non} & \text{non} \\  \sqrt{20} & \text{non} & \text{non} & \text{oui} & \text{non} & \text{oui} & \text{non} & \text{oui} \end{array}$$

    Les sept colonnes sont différentes. 
    $$\boxed{\text{Les sept parties sont deux à deux distinctes}}$$
     Chaque morceau de $A$ joue un rôle : le point $1$ retiré sépare $A$ de $\iota\alpha\iota(A)$, le point isolé $3$ distingue $A$ de son intérieur, les rationnels de $[4, 5]$ séparent $\alpha(A)$ de $\alpha\iota(A)$.
- id: "mp-04-59"
  feuille: "f-mp-04"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [synthèse]
  noeuds: [f-evn]
  notions: []
  source: "Normes (Prost), exercice 34 ; Topologie (LLG), exercices 42 et 43"
  page_enonce: 13
  page_corrige: 30
  enonce: |
    *Rayon spectral.* Soit $A \in \mathcal{M}_{n}(\mathbb{C})$. On note $\rho(A) = \max_{\lambda \in \operatorname{Sp}(A)} |\lambda|$ son rayon spectral, et $N_{L}$ la norme sous-multiplicative de l'exercice 12. Pour $P \in \mathrm{GL}_{n}(\mathbb{C})$, on pose $\lVert A \rVert_{P} = N_{L}(P^{-1}AP)$.

    **1.** Montrer que $\lVert \cdot \rVert_{P}$ est une norme sous-multiplicative, et que $N_{L}(A) \leqslant N_{L}(P)N_{L}(P^{-1})\lVert A \rVert_{P}$.

    **2.** On suppose que $A^{k} \to 0$, coefficient par coefficient. Montrer que $\rho(A) < 1$.

    **3.** On suppose $\rho(A) < 1$. On écrit $A = PTP^{-1}$, avec $T$ triangulaire supérieure (chapitre 3), et l'on pose $D_{\mu} = \operatorname{diag}(1, \mu, \dots, \mu^{n-1})$ pour $\mu > 0$.

    **(a)** Calculer les coefficients de $D_{\mu}^{-1}TD_{\mu}$, et en déduire que $N_{L}(D_{\mu}^{-1}TD_{\mu}) \to \rho(A)$ lorsque $\mu \to 0$.

    **(b)** En déduire qu'il existe $Q \in \mathrm{GL}_{n}(\mathbb{C})$ telle que $\lVert A \rVert_{Q} < 1$, puis que $A^{k} \to 0$.

    **4.** Vérifier le résultat sur $A = \begin{pmatrix} \frac{1}{2} & 100 \\ 0 & \frac{1}{2} \end{pmatrix}$, en calculant $A^{k}$. Que vaut $N_{L}(A)$ ? Commenter.
  corrige: |
    **1.** L'application $A \mapsto P^{-1}AP$ est linéaire et bijective : $\lVert \cdot \rVert_{P} = N_{L} \circ (A \mapsto P^{-1}AP)$ est une norme (exercice 5). Elle est sous-multiplicative, car $P^{-1}ABP = (P^{-1}AP)(P^{-1}BP)$ et $N_{L}$ l'est (exercice 12). Enfin $A = P(P^{-1}AP)P^{-1}$, d'où 
    $$\boxed{N_{L}(A) \leqslant N_{L}(P)N_{L}(P^{-1})\lVert A \rVert_{P}}$$

    **2.** Soit $\lambda$ une valeur propre et $X$ un vecteur propre associé. Alors $A^{k}X = \lambda^{k}X$, et chaque coordonnée de $A^{k}X$ tend vers $0$ (exercice 20). Comme $X$ a une coordonnée non nulle, $\lambda^{k} \to 0$, et $|\lambda| < 1$. 
    $$\boxed{A^{k} \to 0 \implies \rho(A) < 1}$$

    **3.a.** On calcule $(D_{\mu}^{-1}TD_{\mu})_{ij} = \mu^{-(i-1)}t_{ij}\mu^{j-1} = \mu^{j-i}t_{ij}$ : la diagonale est inchangée, et les coefficients au-dessus de la diagonale sont multipliés par des puissances positives de $\mu$. 
    $$N_{L}(D_{\mu}^{-1}TD_{\mu}) = \max_{i}\Big(|t_{ii}| + \sum_{j > i} \mu^{j-i}|t_{ij}|\Big) \xrightarrow[\mu \to 0]{} \max_{i} |t_{ii}| = \rho(A),$$
     puisque les $t_{ii}$ sont les valeurs propres de $A$.

    **3.b.** Comme $\rho(A) < 1$, on choisit $\mu$ tel que $N_{L}(D_{\mu}^{-1}TD_{\mu}) < 1$, et $Q = PD_{\mu}$ : $Q^{-1}AQ = D_{\mu}^{-1}TD_{\mu}$, donc $\lVert A \rVert_{Q} < 1$. Par sous-multiplicativité, $\lVert A^{k} \rVert_{Q} \leqslant \lVert A \rVert_{Q}^{k} \to 0$, et la question 1 donne $N_{L}(A^{k}) \to 0$, d'où $\lVert A^{k} \rVert_{\infty} \leqslant N_{L}(A^{k}) \to 0$. 
    $$\boxed{A^{k} \to 0 \iff \rho(A) < 1}$$

    **4.** On écrit $A = \frac{1}{2}I_{2} + 100E_{12}$ ; les deux termes commutent et $E_{12}^{2} = 0$, d'où par la formule du binôme : 
    $$A^{k} = \frac{1}{2^{k}}I_{2} + k\frac{100}{2^{k-1}}E_{12} = \begin{pmatrix} 2^{-k} & 200k\,2^{-k} \\ 0 & 2^{-k} \end{pmatrix} \to 0.$$

    $$\boxed{\rho(A) = \tfrac{1}{2} < 1, \qquad N_{L}(A) = 100{,}5, \qquad A^{k} \to 0}$$
     La norme $N_{L}(A)$, bien plus grande que $1$, ne permet pas de conclure : il faut une norme adaptée à $A$, ce que fournit le changement d'échelle $D_{\mu}$. Le coefficient $200k\,2^{-k}$ vaut d'ailleurs $100$ pour $k = 1$ et $k = 2$ avant de décroître : la suite commence par ne pas diminuer.
- id: "mp-04-60"
  feuille: "f-mp-04"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [synthèse, produit scalaire]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire]
  source: "Topologie (LLG), exercice 8"
  page_enonce: 13
  page_corrige: 30
  enonce: |
    *Théorème de Jordan et von Neumann.* Soit $E$ un $\mathbb{R}$-espace vectoriel muni d'une norme $N$ qui vérifie l'identité du parallélogramme (exercice 8). On pose, pour $x$, $y \in E$, 
    $$\varphi(x, y) = \frac{1}{4}\big(N(x + y)^{2} - N(x - y)^{2}\big).$$

    **1.** Montrer que $\varphi$ est symétrique, que $\varphi(x, x) = N(x)^{2}$ et que $\varphi(-x, y) = -\varphi(x, y)$.

    **2.** Montrer que, pour tous $x$, $x'$, $y \in E$, 
    $$\varphi(x + x', y) + \varphi(x - x', y) = 2\varphi(x, y).$$
     En déduire que $\varphi(2x, y) = 2\varphi(x, y)$, puis que $\varphi(u + v, y) = \varphi(u, y) + \varphi(v, y)$.

    **3.** Montrer que $\varphi(rx, y) = r\varphi(x, y)$ pour tout rationnel $r$.

    **4.** Soit $\lambda \in \mathbb{R}$ et $(r_{k})$ une suite de rationnels de limite $\lambda$. Montrer que $N(r_{k}x \pm y) \to N(\lambda x \pm y)$, et en déduire que $\varphi(\lambda x, y) = \lambda\varphi(x, y)$.

    **5.** Conclure que $N$ est la norme associée au produit scalaire $\varphi$.

    Ce résultat a été publié par Pascual Jordan et John von Neumann en 1935 (*On inner products in linear, metric spaces*, Annals of Mathematics, vol. 36, p. 719--723).
  corrige: |
    **1.** On a $N(y - x) = N(x - y)$, d'où la symétrie. Ensuite 
    $$\varphi(x, x) = \frac{1}{4}N(2x)^{2} = N(x)^{2}, \qquad \varphi(-x, y) = \frac{1}{4}\big(N(y - x)^{2} - N(x + y)^{2}\big) = -\varphi(x, y).$$

    **2.** On applique l'identité du parallélogramme aux couples $(x + y, x')$ et $(x - y, x')$ : 
    $$N(x + y + x')^{2} + N(x + y - x')^{2} = 2N(x + y)^{2} + 2N(x')^{2},$$

    $$N(x - y + x')^{2} + N(x - y - x')^{2} = 2N(x - y)^{2} + 2N(x')^{2}.$$
     En soustrayant et en divisant par $4$, on obtient 
    $$\varphi(x + x', y) + \varphi(x - x', y) = 2\varphi(x, y).$$
     Avec $x' = x$, et $\varphi(0, y) = 0$, il vient $\varphi(2x, y) = 2\varphi(x, y)$. Pour $u$, $v \in E$, on pose $x = \frac{u + v}{2}$ et $x' = \frac{u - v}{2}$ : 
    $$\boxed{\varphi(u, y) + \varphi(v, y) = 2\varphi\Big(\frac{u + v}{2}, y\Big) = \varphi(u + v, y)}$$

    **3.** Par récurrence, $\varphi(mx, y) = m\varphi(x, y)$ pour $m \in \mathbb{N}$, puis pour $m \in \mathbb{Z}$ grâce à la question 1. Pour $r = \frac{p}{q}$, $q\,\varphi\big(\frac{p}{q}x, y\big) = \varphi(px, y) = p\,\varphi(x, y)$. 
    $$\boxed{\varphi(rx, y) = r\varphi(x, y) \quad (r \in \mathbb{Q})}$$

    **4.** Par la proposition 1, $|N(r_{k}x \pm y) - N(\lambda x \pm y)| \leqslant |r_{k} - \lambda|\,N(x) \to 0$. Donc $\varphi(r_{k}x, y) \to \varphi(\lambda x, y)$, alors que $\varphi(r_{k}x, y) = r_{k}\varphi(x, y) \to \lambda\varphi(x, y)$. 
    $$\boxed{\varphi(\lambda x, y) = \lambda\varphi(x, y) \quad (\lambda \in \mathbb{R})}$$

    **5.** La forme $\varphi$ est linéaire en la première variable et symétrique, donc bilinéaire ; elle est définie positive, puisque $\varphi(x, x) = N(x)^{2}$. 
    $$\boxed{N \text{ est la norme associée au produit scalaire } \varphi}$$
     Le passage de $\mathbb{Q}$ à $\mathbb{R}$ à la question 4 est le seul endroit où intervient la topologie : sans la proposition 1, l'additivité seule ne suffirait pas à obtenir la linéarité.
- id: "mp-04-61"
