  page_corrige: 3
  enonce: |
    **1.** Soit $a_{1}$, …, $a_{n} \in \mathbb{R}$. À quelle condition l'application $x \mapsto \sum_{k=1}^{n} a_{k}|x_{k}|$ est-elle une norme sur $\mathbb{R}^{n}$ ?

    **2.** Montrer que le maximum de deux normes sur $E$ est une norme sur $E$. Qu'en est-il du minimum ? On pourra étudier, sur $\mathbb{R}^{2}$, le minimum des normes $N_{1}(x, y) = |x| + 2|y|$ et $N_{2}(x, y) = 2|x| + |y|$ aux points $(1, 0)$, $(0, 1)$ et $(1, 1)$.

    **3.** Soit $f \in \mathcal{L}(E)$. Montrer que $x \mapsto \lVert f(x) \rVert$ est une norme sur $E$ si et seulement si $f$ est injectif.
  corrige: |
    **1.** Si un coefficient $a_{k}$ est négatif ou nul, le vecteur non nul $e_{k}$ a une « norme » $a_{k} \leqslant 0$ : la séparation, ou même la positivité, tombe en défaut. Si tous les $a_{k}$ sont strictement positifs, l'homogénéité et l'inégalité triangulaire viennent de celles de la valeur absolue, et la nullité de la somme force chaque $|x_{k}|$ à être nul. 
    $$\boxed{x \mapsto \sum a_{k}|x_{k}| \text{ est une norme} \iff a_{1}, \dots, a_{n} > 0}$$

    **2.** Soit $M = \max(N_{1}, N_{2})$. On a $M(x) = 0 \implies N_{1}(x) = 0 \implies x = 0$ ; l'homogénéité est claire ; enfin, pour $i = 1, 2$, 
    $$N_{i}(x + y) \leqslant N_{i}(x) + N_{i}(y) \leqslant M(x) + M(y),$$
     d'où $M(x + y) \leqslant M(x) + M(y)$. Pour le minimum $m = \min(N_{1}, N_{2})$ des normes de l'indication, on calcule $m(1, 0) = \min(1, 2) = 1$, $m(0, 1) = \min(2, 1) = 1$ et $m(1, 1) = \min(3, 3) = 3$. 
    $$\boxed{\max(N_{1}, N_{2}) \text{ est une norme ; } \ m(1, 1) = 3 > m(1, 0) + m(0, 1) = 2}$$
     Le minimum de deux normes n'est donc pas une norme en général. Géométriquement, la boule unité du maximum est l'intersection des deux boules unités, qui reste convexe ; celle du minimum est leur réunion, qui ne l'est plus (proposition 2).

    **3.** L'homogénéité et l'inégalité triangulaire découlent de la linéarité de $f$. La séparation demande que seul le vecteur nul ait une image nulle. 
    $$\boxed{x \mapsto \lVert f(x) \rVert \text{ est une norme} \iff \mathrm{Ker}\, f = \{0\}}$$
