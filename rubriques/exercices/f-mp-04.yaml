  page_corrige: 2
  enonce: |
    On suppose $E \neq \{0\}$. Soit $a$, $b \in E$ et $r$, $s > 0$.

    **1.** Montrer que $B_{f}(a, r) \subset B_{f}(b, s)$ si et seulement si $\lVert a - b \rVert \leqslant s - r$.

    **2.** Montrer que $B_{f}(a, r) \cap B_{f}(b, s) = \emptyset$ si et seulement si $\lVert a - b \rVert > r + s$.

    **3.** Dessiner les deux situations dans $\mathbb{R}^{2}$ pour la norme $\lVert \cdot \rVert_{\infty}$.
  corrige: |
    **1.** Le sens réciproque est l'inégalité triangulaire : si $\lVert x - a \rVert \leqslant r$, alors 
    $$\lVert x - b \rVert \leqslant \lVert x - a \rVert + \lVert a - b \rVert \leqslant r + (s - r) = s.$$
     Pour le sens direct, on cherche le point de $B_{f}(a, r)$ le plus éloigné de $b$. Si $a = b$, on prend un vecteur unitaire $u$ : $a + ru \in B_{f}(b, s)$ donne $r \leqslant s$. Si $a \neq b$, on pose $u = \frac{a - b}{\lVert a - b \rVert}$ et $x = a + ru$ : alors $x - b = (\lVert a - b \rVert + r)u$, et $x \in B_{f}(b, s)$ donne $\lVert a - b \rVert + r \leqslant s$. 
    $$\boxed{B_{f}(a, r) \subset B_{f}(b, s) \iff \lVert a - b \rVert \leqslant s - r}$$

    **2.** Si $x$ est un point commun, $\lVert a - b \rVert \leqslant \lVert a - x \rVert + \lVert x - b \rVert \leqslant r + s$. Réciproquement, si $\lVert a - b \rVert \leqslant r + s$, on cherche un point commun sur le segment $[a, b]$. Si $a = b$, le point $a$ convient. Sinon, on pose $x = a + \frac{r}{r + s}(b - a)$ ; alors 
    $$\lVert x - a \rVert = \frac{r}{r + s}\lVert a - b \rVert \leqslant r, \qquad \lVert x - b \rVert = \frac{s}{r + s}\lVert a - b \rVert \leqslant s.$$
     Par contraposée : 
    $$\boxed{B_{f}(a, r) \cap B_{f}(b, s) = \emptyset \iff \lVert a - b \rVert > r + s}$$

    **3.** Pour la norme $\lVert \cdot \rVert_{\infty}$, les boules sont des carrés de côtés parallèles aux axes. Dans la figure, la condition d'inclusion est réalisée avec égalité $\lVert a - b \rVert_{\infty} = s - r$, et la condition de disjonction avec $\lVert a - b \rVert_{\infty} = 3 > r + s = 2{,}5$.

    ![Figure](documents/figures/eedf22dfbf6f5b1e.svg)

    À gauche, le petit carré touche le bord du grand : c'est le cas limite $\lVert a - b \rVert_{\infty} = s - r$. À droite, l'écart horizontal entre les centres, $3$, dépasse la somme des demi-côtés, $2{,}5$.
- id: "mp-04-05"
  feuille: "f-mp-04"
