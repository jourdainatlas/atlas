  page_corrige: 4
  enonce: |
    **1.** Montrer que si la norme de $E$ est associée à un produit scalaire, elle vérifie l'*identité du parallélogramme* : 
    $$\forall x, y \in E, \qquad \lVert x + y \rVert^{2} + \lVert x - y \rVert^{2} = 2\lVert x \rVert^{2} + 2\lVert y \rVert^{2}.$$

    **2.** Soit $n \geqslant 2$. Montrer que les normes $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ de $\mathbb{R}^{n}$ ne sont associées à aucun produit scalaire.

    **3.** La norme $\lVert \cdot \rVert_{\infty}$ de $\mathcal{C}([0, 1], \mathbb{R})$ est-elle associée à un produit scalaire ?
  corrige: |
    **1.** On développe par bilinéarité : 
    $$\lVert x \pm y \rVert^{2} = \lVert x \rVert^{2} \pm 2\langle x, y \rangle + \lVert y \rVert^{2},$$
     et la somme des deux égalités fait disparaître les doubles produits. 
    $$\boxed{\lVert x + y \rVert^{2} + \lVert x - y \rVert^{2} = 2\lVert x \rVert^{2} + 2\lVert y \rVert^{2}}$$

    **2.** On teste l'identité sur $x = e_{1}$ et $y = e_{2}$. Pour $\lVert \cdot \rVert_{1}$, le membre de gauche vaut $2^{2} + 2^{2} = 8$ et celui de droite $4$ ; pour $\lVert \cdot \rVert_{\infty}$, on trouve $1 + 1 = 2$ à gauche et $4$ à droite. 
    $$\boxed{\lVert \cdot \rVert_{1} \text{ et } \lVert \cdot \rVert_{\infty} \text{ ne proviennent d'aucun produit scalaire sur } \mathbb{R}^{n}, \ n \geqslant 2}$$

    **3.** Avec $f = 1$ et $g : t \mapsto t$, on a $\lVert f + g \rVert_{\infty} = 2$, $\lVert f - g \rVert_{\infty} = 1$ et $\lVert f \rVert_{\infty} = \lVert g \rVert_{\infty} = 1$ : $4 + 1 = 5 \neq 4$. 
    $$\boxed{\lVert \cdot \rVert_{\infty} \text{ n'est pas associée à un produit scalaire sur } \mathcal{C}([0, 1], \mathbb{R})}$$
     L'exercice 60 montrera la réciproque de la question 1 : l'identité du parallélogramme caractérise les normes euclidiennes.
