  page_corrige: 18
  enonce: |
    Soit $A$ et $B$ deux parties non vides de $E$, et $A + B = \{a + b \mid a \in A, \ b \in B\}$.

    **1.** Montrer que si $A$ est ouvert, alors $A + B$ est ouvert.

    **2.** Montrer que si $A$ et $B$ sont bornées, alors $A + B$ est bornée.

    **3.** Dans $(\mathbb{R}^{2}, \lVert \cdot \rVert_{\infty})$, on pose $A = \{(x, y) \mid xy = 1\}$ et $B = \{(x, 0) \mid x \in \mathbb{R}\}$. Montrer que $A$ et $B$ sont fermés, mais que $A + B$ ne l'est pas.
  corrige: |
    **1.** On écrit $A + B = \bigcup_{b \in B} (A + b)$. Si $B(a, r) \subset A$, alors $B(a + b, r) = B(a, r) + b \subset A + b$, comme à l'exercice 1 : chaque translaté $A + b$ est ouvert, et une réunion d'ouverts est ouverte (proposition 12). 
    $$\boxed{A \text{ ouvert} \implies A + B \text{ ouvert}}$$

    **2.** Si $\lVert a \rVert \leqslant M_{A}$ sur $A$ et $\lVert b \rVert \leqslant M_{B}$ sur $B$, alors $\lVert a + b \rVert \leqslant M_{A} + M_{B}$.

    **3.** Les égalités $x_{k}y_{k} = 1$ et $y_{k} = 0$ passent à la limite des coordonnées : $A$ et $B$ sont fermés (théorème 2). On a 
    $$A + B = \{(x + t, y) \mid xy = 1, \ t \in \mathbb{R}\} = \mathbb{R} \times \mathbb{R}^{*},$$
     car tout $y \neq 0$ s'écrit avec $x = \frac{1}{y}$, et $t$ ajuste la première coordonnée. Les points $(0, \frac{1}{k})$ de $A + B$ tendent vers $(0, 0)$, qui n'y est pas. 
    $$\boxed{A + B = \mathbb{R} \times \mathbb{R}^{*} \text{ n'est pas fermé}}$$
     Les deux fermés s'approchent à l'infini (l'hyperbole est asymptote à l'axe) sans se toucher : c'est ce défaut que la compacité corrigera au chapitre 5.
- id: "mp-04-38"
  feuille: "f-mp-04"
  numero: 38
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, ouverts, adhérence et intérieur]
  noeuds: [tr-ouverts, tr-adherence]
  notions: [ouvert, ferme, adherence]
  source: "Topologie des espaces normés (Prost), exercice 2 ; Topologie (LLG), exercice 15"
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Soit $A$ et $B$ deux parties de $E$.

    **1.** Montrer que $\overline{A \cup B} = \overline{A} \cup \overline{B}$ et que $\overline{A \cap B} \subset \overline{A} \cap \overline{B}$. Montrer par un exemple dans $\mathbb{R}$ que l'inclusion peut être stricte.

    **2.** Énoncer et démontrer les propriétés analogues pour l'intérieur.

    **3.** On suppose $A$ ouvert. Montrer que $A \cap \overline{B} \subset \overline{A \cap B}$. Donner un contre-exemple lorsque $A$ n'est pas ouvert.
  corrige: |
    **1.** L'adhérence est croissante : si $A \subset C$, le fermé $\overline{C}$ contient $A$, donc $\overline{A}$ (proposition 14). D'où $\overline{A} \cup \overline{B} \subset \overline{A \cup B}$ et $\overline{A \cap B} \subset \overline{A} \cap \overline{B}$. Inversement, $\overline{A} \cup \overline{B}$ est un fermé (réunion finie, proposition 13) qui contient $A \cup B$, donc $\overline{A \cup B}$. Avec $A = \mathbb{Q}$ et $B = \mathbb{R} \setminus \mathbb{Q}$, $\overline{A \cap B} = \emptyset$ alors que $\overline{A} \cap \overline{B} = \mathbb{R}$. 
    $$\boxed{\overline{A \cup B} = \overline{A} \cup \overline{B}, \qquad \overline{A \cap B} \subset \overline{A} \cap \overline{B}, \ \text{inclusion stricte en général}}$$

    **2.** De même, l'intérieur est croissant, et $\mathring{A} \cap \mathring{B}$ est un ouvert (intersection finie) contenu dans $A \cap B$, donc dans son intérieur. Avec les mêmes $A$ et $B$, $\mathring{A} \cup \mathring{B} = \emptyset$ alors que l'intérieur de $A \cup B = \mathbb{R}$ est $\mathbb{R}$. 
    $$\boxed{(A \cap B)^{\circ} = \mathring{A} \cap \mathring{B}, \qquad \mathring{A} \cup \mathring{B} \subset (A \cup B)^{\circ}}$$
     La seconde inclusion est stricte en général. On peut aussi l'obtenir de la question 1 par passage au complémentaire, grâce à la relation $E \setminus \overline{A} = (E \setminus A)^{\circ}$ du cours.

    **3.** Soit $x \in A \cap \overline{B}$ et $(b_{k})$ une suite de $B$ qui tend vers $x$. Comme $A$ est ouvert, il contient une boule $B(x, r)$, et $b_{k} \in B(x, r)$ à partir d'un certain rang : ces $b_{k}$ sont dans $A \cap B$, et $x \in \overline{A \cap B}$. Avec $A = \mathbb{Q}$, qui n'est pas ouvert, et $B = \mathbb{R} \setminus \mathbb{Q}$ : $A \cap \overline{B} = \mathbb{Q}$, mais $\overline{A \cap B} = \emptyset$. 
    $$\boxed{A \text{ ouvert} \implies A \cap \overline{B} \subset \overline{A \cap B}}$$
- id: "mp-04-39"
  feuille: "f-mp-04"
  numero: 39
  partie: "Topologie d'un espace vectoriel normé"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [topologie, convexité, ouverts, fermés]
  noeuds: [tr-ouverts, tr-adherence, gd-normes]
  notions: [ouvert, ferme, partie-convexe, fonction-convexe]
  source: "Topologie des espaces normés (Prost), exercice 4 ; Topologie (LLG), exercices 17 et 28"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Soit $A$ une partie non vide de $E$. Pour $x \in E$, on note $d_{A}(x) = \inf\limits_{a \in A} \lVert x - a \rVert$ la distance de $x$ à $A$.

    **1.** Montrer que $|d_{A}(x) - d_{A}(y)| \leqslant \lVert x - y \rVert$ pour tous $x$, $y \in E$.

    **2.** Montrer que $d_{A}(x) = 0$ si et seulement si $x \in \overline{A}$.

    **3.** Soit $r > 0$. Montrer que $\{x \in E \mid d_{A}(x) < r\}$ est un ouvert. En déduire que tout fermé de $E$ est l'intersection d'une suite décroissante d'ouverts, puis que tout ouvert est la réunion d'une suite croissante de fermés.

    **4.** On suppose $E$ réel et $A$ convexe. Montrer que $\overline{A}$ et $\mathring{A}$ sont convexes.
  corrige: |
    **1.** Pour $a \in A$, $d_{A}(x) \leqslant \lVert x - a \rVert \leqslant \lVert x - y \rVert + \lVert y - a \rVert$. En passant à la borne inférieure sur $a$, $d_{A}(x) \leqslant \lVert x - y \rVert + d_{A}(y)$, et l'on échange $x$ et $y$. 
    $$\boxed{|d_{A}(x) - d_{A}(y)| \leqslant \lVert x - y \rVert}$$

    **2.** On traduit les deux conditions par des suites. Si $d_{A}(x) = 0$, pour tout $n$ il existe $a_{n} \in A$ tel que $\lVert x - a_{n} \rVert < \frac{1}{n + 1}$, donc $a_{n} \to x$ et $x \in \overline{A}$. Réciproquement, si $a_{n} \to x$ avec $a_{n} \in A$, alors $0 \leqslant d_{A}(x) \leqslant \lVert x - a_{n} \rVert \to 0$. 
    $$\boxed{d_{A}(x) = 0 \iff x \in \overline{A}}$$

    **3.** Soit $x$ tel que $d_{A}(x) < r$, et $\rho = r - d_{A}(x) > 0$. Pour $y \in B(x, \rho)$, la question 1 donne $d_{A}(y) \leqslant d_{A}(x) + \lVert x - y \rVert < r$ : la boule $B(x, \rho)$ est dans l'ensemble, qui est donc ouvert. Si $F$ est un fermé non vide, la question 2 donne 
    $$F = \{d_{F} = 0\} = \bigcap_{n \geqslant 1} \Big\{d_{F} < \frac{1}{n}\Big\},$$
     intersection d'une suite décroissante d'ouverts ; pour $F = \emptyset$, il suffit de prendre des ouverts vides. Par passage au complémentaire, si $U$ est un ouvert distinct de $E$ et $F = E \setminus U$, 
    $$U = \bigcup_{n \geqslant 1} \Big\{d_{F} \geqslant \frac{1}{n}\Big\},$$
     réunion croissante de fermés ; pour $U = E$, on prend la suite constante égale à $E$. 
    $$\boxed{\text{Tout fermé est intersection décroissante d'ouverts, tout ouvert réunion croissante de fermés}}$$

    **4.** Soit $x$, $y \in \overline{A}$ et $t \in [0, 1]$. Si $x_{n} \to x$ et $y_{n} \to y$ avec $x_{n}$, $y_{n} \in A$, alors $(1 - t)x_{n} + ty_{n} \in A$ tend vers $(1 - t)x + ty$, qui est donc dans $\overline{A}$. Pour l'intérieur, soit $r > 0$ tel que $B(x, r)$ et $B(y, r)$ soient dans $A$, et $z = (1 - t)x + ty$. Pour $\lVert h \rVert < r$, 
    $$z + h = (1 - t)(x + h) + t(y + h) \in A,$$
     par convexité : la boule $B(z, r)$ est dans $A$. 
    $$\boxed{A \text{ convexe} \implies \overline{A} \text{ et } \mathring{A} \text{ convexes}}$$
