  source: "Topologie des espaces normés (Prost), exercice 35"
  page_enonce: 14
  page_corrige: 31
  enonce: |
    On reprend la définition des suites de Cauchy de l'exercice 18. Un espace vectoriel normé est dit *complet* si toute suite de Cauchy y converge.

    **1.** Montrer que $(\mathbb{K}^{n}, \lVert \cdot \rVert_{\infty})$ est complet.

    **2.** Soit $X$ un ensemble non vide. Montrer que $(\mathcal{B}(X, \mathbb{R}), \lVert \cdot \rVert_{\infty})$ est complet. On pourra construire la limite point par point.

    **3.** Pour $n \geqslant 2$, soit $f_{n} \in \mathcal{C}([0, 1], \mathbb{R})$ la fonction nulle sur $[0, \frac{1}{2}]$, égale à $1$ sur $[\frac{1}{2} + \frac{1}{n}, 1]$ et affine entre les deux. Montrer que $(f_{n})$ est de Cauchy pour $\lVert \cdot \rVert_{1}$.

    **4.** Montrer que $(f_{n})$ ne converge pas dans $(\mathcal{C}([0, 1], \mathbb{R}), \lVert \cdot \rVert_{1})$, et conclure.

    Le chapitre 8 montrera qu'en revanche $\mathcal{C}([0, 1], \mathbb{R})$, muni de $\lVert \cdot \rVert_{\infty}$, est complet.
  corrige: |
    **1.** Si $(x^{(k)})$ est de Cauchy pour $\lVert \cdot \rVert_{\infty}$, chaque suite de coordonnées est de Cauchy dans $\mathbb{K}$, puisque $|x^{(k)}_{i} - x^{(p)}_{i}| \leqslant \lVert x^{(k)} - x^{(p)} \rVert_{\infty}$. Elle converge par l'exercice 18, en séparant parties réelle et imaginaire si $\mathbb{K} = \mathbb{C}$, et la proposition 7 conclut. 
    $$\boxed{(\mathbb{K}^{n}, \lVert \cdot \rVert_{\infty}) \text{ est complet}}$$

    **2.** Soit $(f_{k})$ de Cauchy dans $\mathcal{B}(X, \mathbb{R})$. Pour chaque $x$, la suite réelle $(f_{k}(x))$ est de Cauchy, donc converge vers un réel $f(x)$. La suite est bornée par un $M$ (exercice 18), d'où $|f(x)| \leqslant M$ et $f \in \mathcal{B}(X, \mathbb{R})$. Soit $\varepsilon > 0$ et $N$ tel que $|f_{k}(x) - f_{p}(x)| \leqslant \varepsilon$ pour $k$, $p \geqslant N$ et tout $x$. En faisant tendre $p$ vers $+\infty$, $|f_{k}(x) - f(x)| \leqslant \varepsilon$ pour tout $x$, donc $\lVert f_{k} - f \rVert_{\infty} \leqslant \varepsilon$ pour $k \geqslant N$. 
    $$\boxed{(\mathcal{B}(X, \mathbb{R}), \lVert \cdot \rVert_{\infty}) \text{ est complet}}$$
     *Piège.* Il faut passer à la limite en $p$ *avant* de prendre la borne supérieure en $x$ : l'inégalité obtenue pour chaque $x$ est uniforme parce que $N$ ne dépend pas de $x$.

    **3.** Pour $p > n$, on a $f_{p} \geqslant f_{n}$, et les deux fonctions coïncident hors de $[\frac{1}{2}, \frac{1}{2} + \frac{1}{n}]$. Comme $\int_{0}^{1} f_{n} = \frac{1}{2} - \frac{1}{2n}$, 
    $$\lVert f_{n} - f_{p} \rVert_{1} = \frac{1}{2n} - \frac{1}{2p} \leqslant \frac{1}{2n}.$$

    $$\boxed{(f_{n}) \text{ est de Cauchy pour } \lVert \cdot \rVert_{1}}$$

    **4.** Supposons $f_{n} \to f$ pour $\lVert \cdot \rVert_{1}$, avec $f$ continue. Comme $f_{n}$ est nulle sur $[0, \frac{1}{2}]$, 
    $$\int_{0}^{1/2} |f| \leqslant \lVert f - f_{n} \rVert_{1} \to 0,$$
     et $f = 0$ sur $[0, \frac{1}{2}]$ par continuité. Pour $\delta > 0$ et $n \geqslant \frac{1}{\delta}$, $f_{n} = 1$ sur $[\frac{1}{2} + \delta, 1]$, donc 
    $$\int_{1/2 + \delta}^{1} |f - 1| \leqslant \lVert f - f_{n} \rVert_{1} \to 0,$$
     et $f = 1$ sur $[\frac{1}{2} + \delta, 1]$. Ainsi $f = 1$ sur $]\frac{1}{2}, 1]$ et $f(\frac{1}{2}) = 0$ : $f$ n'est pas continue. 
    $$\boxed{(\mathcal{C}([0, 1], \mathbb{R}), \lVert \cdot \rVert_{1}) \text{ n'est pas complet}}$$
     La « limite » naturelle est la fonction indicatrice de $]\frac{1}{2}, 1]$, qui n'est pas dans l'espace : la complétude dépend à la fois de l'espace et de la norme, comme le montre la remarque finale de l'énoncé.
