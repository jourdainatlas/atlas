  noeuds: [m-convergence-dominee, as-series, gd-schwarz, ar-asymptotique]
  notions: [fonction-dominee]
  source: "Feuille d'exercices #02 (Prost), exercice 58"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f$ la fonction définie sur $]0, 1[$ par $f(x) = \dfrac{x^{2}\ln x}{x - 1}$.

    **1.** Montrer que $f$ se prolonge en une fonction continue sur $[0, 1]$, encore notée $f$.

    **2.** On pose $\displaystyle I_{n} = \int_{0}^{1} x^{n}f(x)\,\mathrm{d} x$. Montrer que $I_{n} \to 0$, puis que $I_{n} \sim \frac{1}{n}$. Plus généralement, que dire de $\displaystyle \int_{0}^{1} x^{n}g(x)\,\mathrm{d} x$ pour $g$ continue sur $[0, 1]$ telle que $g(1) \neq 0$ ?

    **3.** Montrer que $\displaystyle n\int_{0}^{1} x^{n}f(x^{n})\,\mathrm{d} x \xrightarrow[n \to +\infty]{} \sum_{k = 3}^{+\infty} \frac{1}{k^{2}}$.
  corrige: |
    L'intégrale $\int_{0}^{1} x^{n}g(x)\,\mathrm{d} x$ ne « voit » que la valeur de $g$ en $1$, car $x^{n}$ écrase tout le reste du segment.

    **1.** En $0$, $x^{2}\ln x \to 0$ et $x - 1 \to -1$, donc $f(x) \to 0$. En $1$, $\ln x \sim x - 1$, donc $f(x) \to 1$. 
    $$\boxed{f(0) = 0, \qquad f(1) = 1}$$

    **2.** On a $|I_{n}| \leqslant \lVert f \rVert_{\infty}\int_{0}^{1} x^{n}\,\mathrm{d} x = \frac{\lVert f \rVert_{\infty}}{n + 1} \to 0$. Soit maintenant $g$ continue sur $[0, 1]$. Le changement de variable $x = u^{1/n}$ donne 
    $$n\int_{0}^{1} x^{n}g(x)\,\mathrm{d} x = \int_{0}^{1} u^{1/n}g\big(u^{1/n}\big)\,\mathrm{d} u.$$
     Pour $u \in ]0, 1]$, $u^{1/n} \to 1$, donc la fonction intégrée tend vers $g(1)$ ; elle est majorée par $\lVert g \rVert_{\infty}$. La limite vaut $g(1)$. 
    $$\boxed{\int_{0}^{1} x^{n}g(x)\,\mathrm{d} x \underset{n \to +\infty}{\sim} \frac{g(1)}{n} \quad \text{si } g(1) \neq 0, \qquad\text{en particulier}\quad I_{n} \sim \frac{1}{n}}$$

    **3.** Le changement de variable $u = x^{n}$ donne $\displaystyle n\int_{0}^{1} x^{n}f(x^{n})\,\mathrm{d} x = \int_{0}^{1} u^{1/n}f(u)\,\mathrm{d} u$, qui tend vers $\int_{0}^{1} f$ par domination par $\lVert f \rVert_{\infty}$. Pour calculer cette intégrale, on écrit, pour $x \in ]0, 1[$, 
    $$f(x) = x^{2}(-\ln x)\sum_{k = 0}^{+\infty} x^{k} = \sum_{k = 0}^{+\infty} x^{k + 2}(-\ln x),$$
     série de fonctions positives. Une intégration par parties donne $\int_{0}^{1} x^{m}(-\ln x)\,\mathrm{d} x = \frac{1}{(m + 1)^{2}}$, et le théorème 2 permet d'intégrer terme à terme. 
    $$\boxed{n\int_{0}^{1} x^{n}f(x^{n})\,\mathrm{d} x \xrightarrow[n \to +\infty]{} \sum_{k = 0}^{+\infty} \frac{1}{(k + 3)^{2}} = \sum_{k = 3}^{+\infty} \frac{1}{k^{2}} = \frac{\pi^{2}}{6} - \frac{5}{4}}$$
