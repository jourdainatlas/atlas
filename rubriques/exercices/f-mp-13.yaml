    *Le noyau de Poisson.* Soit $f : [0, +\infty[ \to \mathbb{R}$ continue et bornée. Déterminer la limite, quand $a$ tend vers $0$ par valeurs strictement positives, de 
    $$\int_{0}^{+\infty} \frac{a\,f(x)}{a^{2} + x^{2}}\,\mathrm{d} x.$$
     Que représente graphiquement la famille de fonctions $x \mapsto \frac{a}{a^{2} + x^{2}}$ quand $a \to 0$ ?
  corrige: |
    On fait apparaître le paramètre dans l'argument de $f$, afin d'appliquer la version à paramètre réel du théorème de convergence dominée (proposition 1).

    Pour $a > 0$, la fonction intégrée est continue et dominée par $\frac{\lVert f \rVert_{\infty}a}{a^{2} + x^{2}}$, intégrable. Le changement de variable $x = au$ donne 
    $$\int_{0}^{+\infty} \frac{a\,f(x)}{a^{2} + x^{2}}\,\mathrm{d} x = \int_{0}^{+\infty} \frac{f(au)}{1 + u^{2}}\,\mathrm{d} u.$$
     Quand $a \to 0^{+}$, $f(au) \to f(0)$ pour tout $u \geqslant 0$, et la fonction intégrée est dominée par $\frac{\lVert f \rVert_{\infty}}{1 + u^{2}}$, indépendamment de $a$. La proposition 1 donne la limite $f(0)\int_{0}^{+\infty} \frac{\mathrm{d} u}{1 + u^{2}}$. 
    $$\boxed{\int_{0}^{+\infty} \frac{a\,f(x)}{a^{2} + x^{2}}\,\mathrm{d} x \xrightarrow[a \to 0^{+}]{} \frac{\pi}{2}f(0)}$$
     Les fonctions $x \mapsto \frac{a}{a^{2} + x^{2}}$ sont des « bosses » de hauteur $\frac{1}{a}$ et de largeur de l'ordre de $a$, toutes d'aire $\frac{\pi}{2}$ sur $[0, +\infty[$ : quand $a \to 0$, elles se concentrent en $0$, et l'intégrale ne retient que la valeur $f(0)$, avec le poids $\frac{\pi}{2}$.
- id: "mp-13-09"
  feuille: "f-mp-13"
