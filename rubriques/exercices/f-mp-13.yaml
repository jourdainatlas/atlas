  enonce: |
    *L'intégrale de Gauss, autrement.* Pour $x \in \mathbb{R}$, on pose 
    $$f(x) = \int_{0}^{1} \frac{\mathrm{e}^{-x^{2}(1 + t^{2})}}{1 + t^{2}}\,\mathrm{d} t \qquad\text{et}\qquad g(x) = \int_{0}^{x} \mathrm{e}^{-t^{2}}\,\mathrm{d} t.$$

    **1.** Montrer que $f$ et $g$ sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$ et calculer leurs dérivées.

    **2.** Montrer que $f + g^{2}$ est constante sur $\mathbb{R}$, et déterminer cette constante.

    **3.** Montrer que $0 \leqslant f(x) \leqslant \mathrm{e}^{-x^{2}}$ pour tout $x$, et en déduire la valeur de $\displaystyle \int_{0}^{+\infty} \mathrm{e}^{-t^{2}}\,\mathrm{d} t$, sans utiliser le chapitre 12.
  corrige: |
    La fonction $f$ est construite pour que sa dérivée soit $-2gg'$ : la somme $f + g^{2}$ est constante, et la limite en $+\infty$ livre l'intégrale de Gauss.

    **1.** La fonction $g$ est une primitive de $\mathrm{e}^{-x^{2}}$. Pour $f$, la dérivée partielle $-2x\,\mathrm{e}^{-x^{2}(1 + t^{2})}$ est majorée en module par $2b$ pour $|x| \leqslant b$, constante intégrable sur $[0, 1]$ : le théorème 5 s'applique sur tout segment. Le changement de variable $u = xt$, pour $x \neq 0$, donne 
    $$f'(x) = -2x\,\mathrm{e}^{-x^{2}}\int_{0}^{1} \mathrm{e}^{-x^{2}t^{2}}\,\mathrm{d} t = -2\mathrm{e}^{-x^{2}}\int_{0}^{x} \mathrm{e}^{-u^{2}}\,\mathrm{d} u,$$
     égalité encore vraie pour $x = 0$. 
    $$\boxed{g'(x) = \mathrm{e}^{-x^{2}}, \qquad f'(x) = -2g'(x)g(x)}$$

    **2.** La fonction $f + g^{2}$ a une dérivée nulle sur l'intervalle $\mathbb{R}$, et elle vaut $f(0) = \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{2}}$ en $0$. 
    $$\boxed{f + g^{2} = \frac{\pi}{4}}$$

    **3.** Comme $\mathrm{e}^{-x^{2}(1 + t^{2})} \leqslant \mathrm{e}^{-x^{2}}$ et $\frac{1}{1 + t^{2}} \leqslant 1$, on a $0 \leqslant f(x) \leqslant \mathrm{e}^{-x^{2}}$, donc $f(x) \to 0$ en $+\infty$, et $g(x)^{2} \to \frac{\pi}{4}$. Comme $g(x) \geqslant 0$ pour $x \geqslant 0$ : 
    $$\boxed{\int_{0}^{+\infty} \mathrm{e}^{-t^{2}}\,\mathrm{d} t = \frac{\sqrt{\pi}}{2}}$$
     On n'a utilisé que le théorème 5 sur un segment, sans aucune intégrale généralisée avant la dernière ligne.
- id: "mp-13-29"
  feuille: "f-mp-13"
  numero: 29
  partie: "Dérivation d'une intégrale à paramètre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["dérivation d'une intégrale à paramètre", "dérivation sous l'intégrale"]
  noeuds: [gd-schwarz, ds-parametre]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 31"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Soit $0 < a < b$. Pour $x \in \mathbb{R}$, on pose $\displaystyle F(x) = \int_{0}^{+\infty} \frac{\mathrm{e}^{-at} - \mathrm{e}^{-bt}}{t}\cos(xt)\,\mathrm{d} t$.

    **1.** Montrer que $F$ est définie et de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$.

    **2.** Calculer $F'(x)$, puis $F(x)$, en utilisant la valeur de $F(0)$ donnée par l'exercice 19 de la feuille du chapitre 12.

    **3.** Que vaut $\displaystyle \lim\limits_{x \to +\infty} F(x)$ ? Justifier ce résultat directement.
  corrige: |
    On dérive pour faire disparaître le facteur $\frac{1}{t}$, et la constante d'intégration est fournie par l'intégrale de Frullani.

    **1.** La fonction $h : t \mapsto \frac{\mathrm{e}^{-at} - \mathrm{e}^{-bt}}{t}$ se prolonge par continuité en $0$, avec la valeur $b - a$, et elle est majorée par $\frac{\mathrm{e}^{-at}}{t}$ en $+\infty$ : elle est intégrable sur $]0, +\infty[$. La dérivée partielle de $h(t)\cos(xt)$ par rapport à $x$ vaut $-(\mathrm{e}^{-at} - \mathrm{e}^{-bt})\sin(xt)$, majorée en module par $\mathrm{e}^{-at} + \mathrm{e}^{-bt}$, intégrable et indépendante de $x$ : le théorème 5 s'applique. 
    $$\boxed{F \in \mathcal{C}^{1}(\mathbb{R})}$$

    **2.** Comme $\int_{0}^{+\infty} \mathrm{e}^{-ct}\sin(xt)\,\mathrm{d} t = \mathcal{I}m\frac{1}{c - \mathrm{i} x} = \frac{x}{c^{2} + x^{2}}$ pour $c > 0$, on obtient 
    $$F'(x) = -\frac{x}{a^{2} + x^{2}} + \frac{x}{b^{2} + x^{2}}, \qquad\text{d'où}\qquad F(x) = F(0) + \frac{1}{2}\ln\frac{b^{2} + x^{2}}{a^{2} + x^{2}} - \ln\frac{b}{a}.$$
     L'exercice 19 de la feuille du chapitre 12 donne $F(0) = \ln\frac{b}{a}$. 
    $$\boxed{F(x) = \frac{1}{2}\ln\Big(\frac{b^{2} + x^{2}}{a^{2} + x^{2}}\Big)}$$

    **3.** La formule donne $F(x) \to 0$ quand $x \to +\infty$. Directement, la fonction $h$ est de classe $\mathcal{C}^{1}$ sur $[0, +\infty[$, et $h'$ est intégrable, car elle est négligeable devant $\frac{1}{t^{2}}$ en $+\infty$ : une intégration par parties donne $F(x) = -\frac{1}{x}\int_{0}^{+\infty} h'(t)\sin(xt)\,\mathrm{d} t$, d'où $|F(x)| \leqslant \frac{1}{x}\int_{0}^{+\infty} |h'|$. C'est le lemme de Riemann-Lebesgue, comme dans l'exercice 22. 
    $$\boxed{\lim\limits_{x \to +\infty} F(x) = 0}$$
- id: "mp-13-30"
  feuille: "f-mp-13"
  numero: 30
  partie: "Dérivation d'une intégrale à paramètre"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["dérivation d'une intégrale à paramètre", "dérivation sous l'intégrale", équivalents]
  noeuds: [gd-schwarz, ds-parametre, ar-asymptotique]
  notions: [fonction-convexe, derivee-successive]
  source: "Feuille d'exercices #15 (Prost), exercice 10"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    Pour $x > 0$, on pose $\displaystyle f(x) = \int_{1}^{+\infty} \frac{\mathrm{d} t}{t^{x}(1 + t)}$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ sur $]0, +\infty[$.

    **2.** Montrer de deux manières différentes que $f$ est convexe : par le signe de $f''$, puis directement à partir de la convexité de $x \mapsto t^{-x}$.

    **3.** Déterminer les limites de $f$ en $0$ et en $+\infty$, puis montrer que $f(x) \underset{x \to 0}{\sim} \dfrac{1}{x}$ et $f(x) \underset{x \to +\infty}{\sim} \dfrac{1}{2x}$.
  corrige: |
    Les dérivées successives font apparaître des puissances de $\ln t$, que le facteur $t^{-x}$ domine dès que $x$ reste à distance de $0$.

    **1.** Pour $t \geqslant 1$, $x \mapsto \frac{t^{-x}}{1 + t}$ est de classe $\mathcal{C}^{\infty}$, de dérivée $k$-ième $\frac{(-\ln t)^{k}t^{-x}}{1 + t}$. Pour $x \geqslant a > 0$, cette dérivée est majorée en module par $(\ln t)^{k}t^{-a - 1}$, négligeable devant $t^{-1 - a/2}$ en $+\infty$, donc intégrable. Le théorème 6, avec la domination de chaque dérivée sur $[a, +\infty[$, s'applique. 
    $$\boxed{f \in \mathcal{C}^{\infty}(]0, +\infty[), \qquad f^{(k)}(x) = \int_{1}^{+\infty} \frac{(-\ln t)^{k}}{t^{x}(1 + t)}\,\mathrm{d} t}$$

    **2.** D'une part, 
    $$f''(x) = \int_{1}^{+\infty} \frac{(\ln t)^{2}}{t^{x}(1 + t)}\,\mathrm{d} t \geqslant 0.$$
     D'autre part, pour $t \geqslant 1$, la fonction $x \mapsto t^{-x} = \mathrm{e}^{-x\ln t}$ est convexe : pour $\lambda \in [0, 1]$, 
    $$t^{-(\lambda x + (1 - \lambda)y)} \leqslant \lambda t^{-x} + (1 - \lambda)t^{-y}.$$
     En divisant par $1 + t$ et en intégrant, on obtient $f(\lambda x + (1 - \lambda)y) \leqslant \lambda f(x) + (1 - \lambda)f(y)$. 
    $$\boxed{f \text{ est convexe sur } ]0, +\infty[}$$
     La seconde méthode est plus générale : elle ne demande aucune régularité, et elle montre qu'une intégrale de fonctions convexes est convexe.

    **3.** La fonction $f$ est décroissante, car $x \mapsto t^{-x}$ l'est pour $t \geqslant 1$. En $0$, on écrit 
    $$\frac{1}{t^{x}(1 + t)} = \frac{1}{t^{x + 1}} - \frac{1}{t^{x + 1}(1 + t)},$$
     d'où $f(x) = \frac{1}{x} - R(x)$ avec $0 \leqslant R(x) \leqslant \int_{1}^{+\infty} \frac{\mathrm{d} t}{t^{2}} = 1$. En $+\infty$, le changement de variable $t = \mathrm{e}^{u/x}$ donne 
    $$xf(x) = \int_{0}^{+\infty} \mathrm{e}^{-u}\,\frac{\mathrm{e}^{u/x}}{1 + \mathrm{e}^{u/x}}\,\mathrm{d} u,$$
     et la fonction intégrée tend vers $\frac{1}{2}\mathrm{e}^{-u}$, dominée par $\mathrm{e}^{-u}$. 
    $$\boxed{\lim\limits_{0} f = +\infty, \quad \lim\limits_{+\infty} f = 0, \qquad f(x) \underset{x \to 0}{\sim} \frac{1}{x}, \qquad f(x) \underset{x \to +\infty}{\sim} \frac{1}{2x}}$$
     Pour $x$ grand, le poids $t^{-x}$ se concentre près de $t = 1$, où $\frac{1}{1 + t}$ vaut $\frac{1}{2}$.
- id: "mp-13-31"
  feuille: "f-mp-13"
  numero: 31
