  source: "Feuille d'exercices #15 (Prost), exercice 4"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Pour $x > -1$, on pose $\displaystyle f(x) = \int_{0}^{\pi/2} \ln\big(1 + x\sin^{2}t\big)\,\mathrm{d} t$.

    **1.** Montrer que $f$ est continue sur $]-1, +\infty[$.

    **2.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $]-1, +\infty[$, et exprimer $f'(x)$ sous forme intégrale.

    **3.** Calculer explicitement $f'(x)$, en distinguant les cas $x = 0$ et $x \neq 0$.

    **4.** En déduire que $f(x) = \pi\ln\Big(\dfrac{1 + \sqrt{1 + x}}{2}\Big)$ pour tout $x > -1$.
  corrige: |
    La dérivée de $f$ est l'intégrale d'une fraction rationnelle en $\sin^{2}t$, qui se calcule par le changement de variable $u = \tan t$.

    **1.** Pour $x > -1$, $1 + x\sin^{2}t \geqslant 1 + \min(x, 0) > 0$ : la fonction intégrée est continue sur $[0, \frac{\pi}{2}]$. Pour $x \in [a, b] \subset ]-1, +\infty[$, on a $1 + \min(a, 0) \leqslant 1 + x\sin^{2}t \leqslant 1 + |b|$, d'où une majoration de $|\ln(1 + x\sin^{2}t)|$ par une constante, intégrable sur le segment. La proposition 2 donne la continuité.

    **2.** La dérivée partielle $\frac{\sin^{2}t}{1 + x\sin^{2}t}$ est majorée sur $[a, b]$ par $\frac{1}{1 + \min(a, 0)}$ : le théorème 5 s'applique sur tout segment. 
    $$\boxed{f'(x) = \int_{0}^{\pi/2} \frac{\sin^{2}t}{1 + x\sin^{2}t}\,\mathrm{d} t}$$

    **3.** Pour $x = 0$, $f'(0) = \int_{0}^{\pi/2} \sin^{2}t\,\mathrm{d} t = \frac{\pi}{4}$. Pour $x \neq 0$, on écrit $\frac{\sin^{2}t}{1 + x\sin^{2}t} = \frac{1}{x}\Big(1 - \frac{1}{1 + x\sin^{2}t}\Big)$. Le changement de variable $u = \tan t$, avec $\sin^{2}t = \frac{u^{2}}{1 + u^{2}}$ et $\mathrm{d} t = \frac{\mathrm{d} u}{1 + u^{2}}$, donne 
    $$\int_{0}^{\pi/2} \frac{\mathrm{d} t}{1 + x\sin^{2}t} = \int_{0}^{+\infty} \frac{\mathrm{d} u}{1 + (1 + x)u^{2}} = \frac{\pi}{2\sqrt{1 + x}}.$$

    $$\boxed{f'(x) = \frac{\pi}{2x}\Big(1 - \frac{1}{\sqrt{1 + x}}\Big) = \frac{\pi}{2\sqrt{1 + x}\,\big(1 + \sqrt{1 + x}\big)} \quad (x \neq 0), \qquad f'(0) = \frac{\pi}{4}}$$
     La seconde expression, obtenue en multipliant par la quantité conjuguée, vaut aussi pour $x = 0$.

    **4.** La fonction $g : x \mapsto \pi\ln\frac{1 + \sqrt{1 + x}}{2}$ a pour dérivée $\pi\cdot\frac{1}{2\sqrt{1 + x}}\cdot\frac{1}{1 + \sqrt{1 + x}} = f'(x)$, et $g(0) = 0 = f(0)$. 
    $$\boxed{f(x) = \pi\ln\Big(\frac{1 + \sqrt{1 + x}}{2}\Big) \quad\text{pour tout } x > -1}$$
