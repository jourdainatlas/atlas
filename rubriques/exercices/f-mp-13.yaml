  enonce: |
    *Bornes variables.* Soit $I$ un intervalle de $\mathbb{R}$, $f : I \times \mathbb{R} \to \mathbb{R}$ continue, et $u$, $v : I \to \mathbb{R}$ continues. Montrer que $\displaystyle F : x \mapsto \int_{u(x)}^{v(x)} f(x, t)\,\mathrm{d} t$ est continue sur $I$.
  corrige: |
    Pour appliquer le théorème 4, il faut une intégrale sur un intervalle fixe : on ramène les bornes variables à $0$ et $1$ par un changement de variable affine.

    Pour $x \in I$, le changement de variable $t = u(x) + s\big(v(x) - u(x)\big)$, valable aussi si $v(x) \leqslant u(x)$, donne 
    $$F(x) = \big(v(x) - u(x)\big)\int_{0}^{1} g(x, s)\,\mathrm{d} s, \qquad g(x, s) = f\big(x, u(x) + s(v(x) - u(x))\big).$$
     La fonction $g$ est continue sur $I \times [0, 1]$, comme composée de fonctions continues. Soit $[a, b] \subset I$. Les fonctions $u$ et $v$ sont continues sur le segment $[a, b]$, donc bornées par un réel $R$, et pour $x \in [a, b]$ et $s \in [0, 1]$, le point $\big(x, u(x) + s(v(x) - u(x))\big)$ reste dans le compact $K = [a, b] \times [-R, R]$. La fonction continue $f$ y est bornée par une constante $C$ (chapitre 5), donc $|g(x, s)| \leqslant C$, constante intégrable sur $[0, 1]$. La proposition 2 donne la continuité de $x \mapsto \int_{0}^{1} g(x, s)\,\mathrm{d} s$, et $F$ est le produit de cette fonction par la fonction continue $v - u$. 
    $$\boxed{F \text{ est continue sur } I}$$
- id: "mp-13-24"
  feuille: "f-mp-13"
  numero: 24
  partie: "Continuité d'une intégrale à paramètre"
  etoiles: 3
  types: [Démonstration]
