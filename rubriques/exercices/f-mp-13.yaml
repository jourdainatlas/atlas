  enonce: |
    *Le théorème de Bohr et Mollerup.* Soit $f : ]0, +\infty[ \to ]0, +\infty[$ telle que $f(1) = 1$, $f(x + 1) = xf(x)$ pour tout $x > 0$, et $\ln f$ convexe.

    **1.** Montrer que $f(n + 1) = n!$ pour tout $n \in \mathbb{N}$.

    **2.** Soit $x \in ]0, 1]$ et $n \in \mathbb{N}^{*}$. En comparant les pentes de $\ln f$ sur les intervalles $[n, n + 1]$, $[n + 1, n + 1 + x]$ et $[n + 1, n + 2]$, montrer que 
    $$x\ln n \leqslant \ln f(n + 1 + x) - \ln(n!) \leqslant x\ln(n + 1).$$

    **3.** En déduire un encadrement de $f(x)$, puis que $\displaystyle f(x) = \lim\limits_{n \to +\infty} \frac{n^{x}\,n!}{x(x + 1)\cdots(x + n)}$ pour $x \in ]0, 1]$.

    **4.** Conclure que $f = \Gamma$ sur $]0, +\infty[$.

    **5.** Application : montrer que la fonction $x \mapsto \dfrac{2^{x - 1}}{\sqrt{\pi}}\,\Gamma\Big(\dfrac{x}{2}\Big)\Gamma\Big(\dfrac{x + 1}{2}\Big)$ vérifie les trois propriétés de l'énoncé, et en déduire la *formule de duplication de Legendre* : 
    $$\Gamma(x)\,\Gamma\Big(x + \frac{1}{2}\Big) = 2^{1 - 2x}\sqrt{\pi}\,\Gamma(2x) \qquad\text{pour tout } x > 0.$$
  corrige: |
    La convexité de $\ln f$ encadre $f$ entre les termes de la formule de Gauss : les trois propriétés suffisent donc à caractériser $\Gamma$, et l'on dispose d'un critère commode pour démontrer des identités entre fonctions $\Gamma$.

    **1.** On a $f(1) = 1 = 0!$, et si $f(n) = (n - 1)!$, alors $f(n + 1) = nf(n) = n!$. 
    $$\boxed{f(n + 1) = n! \quad\text{pour tout } n \in \mathbb{N}}$$

    **2.** Les pentes d'une fonction convexe sont croissantes. Pour $n \geqslant 1$ et $x \in ]0, 1]$, les réels $n$, $n + 1$, $n + 1 + x$ et $n + 2$ sont rangés dans cet ordre, d'où 
    $$\ln\frac{f(n + 1)}{f(n)} \leqslant \frac{1}{x}\ln\frac{f(n + 1 + x)}{f(n + 1)} \leqslant \ln\frac{f(n + 2)}{f(n + 1)}.$$
     Les pentes extrêmes valent $\ln\frac{n!}{(n - 1)!} = \ln n$ et $\ln(n + 1)$, et $\ln f(n + 1) = \ln(n!)$. 
    $$\boxed{x\ln n \leqslant \ln f(n + 1 + x) - \ln(n!) \leqslant x\ln(n + 1)}$$

    **3.** La relation fonctionnelle donne $f(n + 1 + x) = (x + n)(x + n - 1)\cdots x\,f(x)$. En passant à l'exponentielle dans la question 2 : 
    $$\frac{n^{x}\,n!}{x(x + 1)\cdots(x + n)} \leqslant f(x) \leqslant \frac{(n + 1)^{x}\,n!}{x(x + 1)\cdots(x + n)} = \Big(1 + \frac{1}{n}\Big)^{x}\frac{n^{x}\,n!}{x(x + 1)\cdots(x + n)}.$$
     Le rapport des deux bornes tend vers $1$ ; l'encadrement montre que la borne inférieure converge, vers $f(x)$. 
    $$\boxed{f(x) = \lim\limits_{n \to +\infty} \frac{n^{x}\,n!}{x(x + 1)\cdots(x + n)} \quad\text{pour } x \in ]0, 1]}$$

    **4.** D'après la formule de Gauss (proposition 5 du cours), $f = \Gamma$ sur $]0, 1]$. Pour $x > 1$, on écrit $x = y + m$ avec $y \in ]0, 1]$ et $m \in \mathbb{N}$ : $f(x) = (x - 1)\cdots(x - m)f(y)$, et $\Gamma$ vérifie la même relation. 
    $$\boxed{f = \Gamma \text{ sur } ]0, +\infty[}$$
     Réciproquement, $\Gamma$ vérifie les trois propriétés (proposition 4 du cours) : ce sont elles qui la caractérisent.

    **5.** Soit $g(x) = \frac{2^{x - 1}}{\sqrt{\pi}}\Gamma\big(\frac{x}{2}\big)\Gamma\big(\frac{x + 1}{2}\big)$, strictement positive. On a $g(1) = \frac{1}{\sqrt{\pi}}\Gamma\big(\frac{1}{2}\big)\Gamma(1) = 1$. Ensuite, $\Gamma\big(\frac{x}{2} + 1\big) = \frac{x}{2}\Gamma\big(\frac{x}{2}\big)$ donne 
    $$g(x + 1) = \frac{2^{x}}{\sqrt{\pi}}\Gamma\Big(\frac{x + 1}{2}\Big)\Gamma\Big(\frac{x}{2} + 1\Big) = \frac{2^{x}}{\sqrt{\pi}}\cdot\frac{x}{2}\,\Gamma\Big(\frac{x + 1}{2}\Big)\Gamma\Big(\frac{x}{2}\Big) = xg(x).$$
     Enfin, $\ln g(x) = (x - 1)\ln 2 - \frac{1}{2}\ln\pi + \ln\Gamma\big(\frac{x}{2}\big) + \ln\Gamma\big(\frac{x + 1}{2}\big)$ est convexe, comme somme d'une fonction affine et de composées de la fonction convexe $\ln\Gamma$ par des fonctions affines. Donc $g = \Gamma$, et en remplaçant $x$ par $2x$, on obtient $\Gamma(2x) = \frac{2^{2x - 1}}{\sqrt{\pi}}\Gamma(x)\Gamma\big(x + \frac{1}{2}\big)$. 
    $$\boxed{\Gamma(x)\,\Gamma\Big(x + \frac{1}{2}\Big) = 2^{1 - 2x}\sqrt{\pi}\,\Gamma(2x)}$$
     Pour $x = \frac{1}{2}$, on retrouve $\Gamma\big(\frac{1}{2}\big)\Gamma(1) = \sqrt{\pi}\,\Gamma(1)$ ; pour $x = n$ entier, on retrouve la valeur de $\Gamma\big(n + \frac{1}{2}\big)$ de l'exercice 35.
