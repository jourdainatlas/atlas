  page_enonce: 10
  page_corrige: 27
  enonce: |
    *Perspective : la méthode de Laplace.* Soit $f : [-1, 1] \to \mathbb{R}_{+}^{*}$ de classe $\mathcal{C}^{2}$, admettant un unique maximum en $0$, avec $f''(0) < 0$.

    **1.** Montrer que $t \mapsto \frac{1}{t^{2}}\ln\frac{f(t)}{f(0)}$ se prolonge en une fonction continue sur $[-1, 1]$, et en déduire l'existence d'un réel $a > 0$ tel que $f(t) \leqslant f(0)\mathrm{e}^{-at^{2}}$ pour tout $t \in [-1, 1]$.

    **2.** Montrer que 
    $$\int_{-1}^{1} f(t)^{n}\,\mathrm{d} t \underset{n \to +\infty}{\sim} \sqrt{\frac{2\pi}{n\,|f''(0)|}}\;f(0)^{n + 1/2}\,.$$

    **3.** En adaptant la méthode, déterminer un équivalent, quand le réel $x$ tend vers $+\infty$, des intégrales 
    $$\int_{0}^{\pi/2} \sin^{x}t\,\mathrm{d} t \qquad\text{et}\qquad \int_{0}^{\pi/2} \mathrm{e}^{x\cos t}\,\mathrm{d} t.$$
     Comparer le premier avec l'exercice 36.

    Cette méthode, qui ramène l'étude d'une intégrale dépendant d'un grand paramètre à celle d'une gaussienne, est à la base des développements asymptotiques des intégrales en physique statistique et en probabilités.
  corrige: |
    La première question fournit une domination gaussienne ; dans la deuxième, le changement d'échelle $t = \frac{s}{\sqrt{n}}$ fait converger la fonction intégrée vers une gaussienne.

    **1.** La fonction $g = \ln\frac{f}{f(0)}$ est de classe $\mathcal{C}^{2}$, avec $g(0) = 0$, $g'(0) = \frac{f'(0)}{f(0)} = 0$, puisque $0$ est un maximum intérieur, et $g''(0) = \frac{f''(0)}{f(0)}$. La formule de Taylor-Young donne $\frac{g(t)}{t^{2}} \to \frac{f''(0)}{2f(0)} < 0$ : la fonction $k : t \mapsto \frac{g(t)}{t^{2}}$ se prolonge par continuité en $0$. Pour $t \neq 0$, $f(t) < f(0)$, puisque le maximum est unique, donc $k(t) < 0$. La fonction $k$, continue et strictement négative sur le segment $[-1, 1]$, y est majorée par un réel $-a < 0$. 
    $$\boxed{\exists a > 0, \ \forall t \in [-1, 1], \quad f(t) \leqslant f(0)\,\mathrm{e}^{-at^{2}}}$$

    **2.** Le changement de variable $t = \frac{s}{\sqrt{n}}$ donne 
    $$\frac{\sqrt{n}}{f(0)^{n}}\int_{-1}^{1} f(t)^{n}\,\mathrm{d} t = \int_{-\sqrt{n}}^{\sqrt{n}} \exp\Big(n\,g\Big(\frac{s}{\sqrt{n}}\Big)\Big)\mathrm{d} s.$$
     Pour $s$ fixé, $n\,g\big(\frac{s}{\sqrt{n}}\big) \to -cs^{2}$ avec $c = \frac{|f''(0)|}{2f(0)}$, et la question 1 donne la domination par $\mathrm{e}^{-as^{2}}$, intégrable sur $\mathbb{R}$. Le théorème 1 donne la limite $\int_{\mathbb{R}} \mathrm{e}^{-cs^{2}}\,\mathrm{d} s = \sqrt{\frac{\pi}{c}} = \sqrt{\frac{2\pi f(0)}{|f''(0)|}}$. 
    $$\boxed{\int_{-1}^{1} f(t)^{n}\,\mathrm{d} t \underset{n \to +\infty}{\sim} \sqrt{\frac{2\pi}{n\,|f''(0)|}}\;f(0)^{n + 1/2}}$$

    **3.** Dans les deux cas, le maximum est atteint à une extrémité de l'intervalle, et l'on n'obtient que la moitié de la gaussienne. Pour la première intégrale, le changement de variable $t = \frac{\pi}{2} - s$ donne $\int_{0}^{\pi/2} \cos^{x}s\,\mathrm{d} s$, puis $s = \frac{\sigma}{\sqrt{x}}$ donne la fonction intégrée $\cos^{x}\big(\frac{\sigma}{\sqrt{x}}\big) \to \mathrm{e}^{-\sigma^{2}/2}$, dominée par $\mathrm{e}^{-\sigma^{2}/2}$ d'après l'exercice 6. Pour la seconde, on factorise $\mathrm{e}^{x}$, et l'inégalité $1 - \cos t = 2\sin^{2}\frac{t}{2} \geqslant \frac{2t^{2}}{\pi^{2}}$, obtenue par concavité du sinus, fournit la domination par $\mathrm{e}^{-2\sigma^{2}/\pi^{2}}$. Dans les deux cas, la limite est $\int_{0}^{+\infty} \mathrm{e}^{-\sigma^{2}/2}\,\mathrm{d}\sigma = \sqrt{\frac{\pi}{2}}$. 
    $$\boxed{\int_{0}^{\pi/2} \sin^{x}t\,\mathrm{d} t \underset{x \to +\infty}{\sim} \sqrt{\frac{\pi}{2x}}, \qquad \int_{0}^{\pi/2} \mathrm{e}^{x\cos t}\,\mathrm{d} t \underset{x \to +\infty}{\sim} \mathrm{e}^{x}\sqrt{\frac{\pi}{2x}}}$$
     Pour $x = 2n$, la première intégrale est l'intégrale de Wallis $W_{2n}$, et l'on retrouve l'équivalent $\sqrt{\frac{\pi}{4n}}$ de l'exercice 36.
