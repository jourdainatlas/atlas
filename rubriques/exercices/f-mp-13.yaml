  source: "Feuille d'exercices #15 (Prost), exercice 7 ; items composés pour la feuille"
  page_enonce: 8
  page_corrige: 23
  enonce: |
    *Calculs avec $\Gamma$.*

    **1.** Pour $p > 0$, exprimer $\displaystyle \int_{0}^{+\infty} \mathrm{e}^{-t^{p}}\,\mathrm{d} t$ à l'aide de $\Gamma$. Montrer directement, par le théorème de convergence dominée, que cette intégrale tend vers $1$ quand $p \to +\infty$, et retrouver ce résultat à l'aide de la continuité de $\Gamma$.

    **2.** Pour $n \in \mathbb{N}$, calculer $\displaystyle \int_{0}^{+\infty} t^{2n}\mathrm{e}^{-t^{2}}\,\mathrm{d} t$ à l'aide de $\Gamma\big(n + \frac{1}{2}\big)$, puis à l'aide de factorielles.

    **3.** Pour $x > 0$ et $a > -1$, montrer que $\displaystyle \int_{0}^{1} t^{a}(-\ln t)^{x - 1}\,\mathrm{d} t = \frac{\Gamma(x)}{(a + 1)^{x}}$.
  corrige: |
    Dans les trois calculs, un changement de variable ramène l'intégrale à la définition de $\Gamma$.

    **1.** Le changement de variable $u = t^{p}$ donne $\mathrm{d} t = \frac{1}{p}u^{1/p - 1}\,\mathrm{d} u$, d'où 
    $$\boxed{\int_{0}^{+\infty} \mathrm{e}^{-t^{p}}\,\mathrm{d} t = \frac{1}{p}\Gamma\Big(\frac{1}{p}\Big) = \Gamma\Big(1 + \frac{1}{p}\Big)}$$
     Quand $p \to +\infty$, $\mathrm{e}^{-t^{p}}$ tend vers $1$ pour $t \in [0, 1[$ et vers $0$ pour $t > 1$. Pour $p \geqslant 1$, la fonction est majorée par $1$ sur $[0, 1]$ et par $\mathrm{e}^{-t}$ sur $[1, +\infty[$, car $t^{p} \geqslant t$ : la proposition 1 donne la limite $\int_{0}^{1} \mathrm{d} t = 1$. On retrouve que $\Gamma\big(1 + \frac{1}{p}\big) \to \Gamma(1) = 1$, par continuité de $\Gamma$ en $1$.

    **2.** Le changement de variable $u = t^{2}$ donne 
    $$\int_{0}^{+\infty} t^{2n}\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \frac{1}{2}\int_{0}^{+\infty} u^{n - 1/2}\mathrm{e}^{-u}\,\mathrm{d} u = \frac{1}{2}\Gamma\Big(n + \frac{1}{2}\Big).$$
     La relation $\Gamma(x + 1) = x\Gamma(x)$, appliquée $n$ fois à partir de $\Gamma\big(\frac{1}{2}\big) = \sqrt{\pi}$, donne 
    $$\Gamma\Big(n + \frac{1}{2}\Big) = \frac{1}{2}\cdot\frac{3}{2}\cdots\frac{2n - 1}{2}\,\sqrt{\pi} = \frac{(2n)!}{4^{n}\,n!}\,\sqrt{\pi}.$$

    $$\boxed{\int_{0}^{+\infty} t^{2n}\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \frac{1}{2}\Gamma\Big(n + \frac{1}{2}\Big) = \frac{(2n)!}{2 \cdot 4^{n}\,n!}\sqrt{\pi}}$$

    **3.** Le changement de variable $t = \mathrm{e}^{-u}$, puis $v = (a + 1)u$, donne 
    $$\int_{0}^{1} t^{a}(-\ln t)^{x - 1}\,\mathrm{d} t = \int_{0}^{+\infty} \mathrm{e}^{-(a + 1)u}u^{x - 1}\,\mathrm{d} u = \frac{1}{(a + 1)^{x}}\int_{0}^{+\infty} \mathrm{e}^{-v}v^{x - 1}\,\mathrm{d} v.$$

    $$\boxed{\int_{0}^{1} t^{a}(-\ln t)^{x - 1}\,\mathrm{d} t = \frac{\Gamma(x)}{(a + 1)^{x}}}$$
- id: "mp-13-36"
  feuille: "f-mp-13"
  numero: 36
  partie: "La fonction $\\Gamma$ d'Euler"
  etoiles: 2
  types: [Démonstration]
