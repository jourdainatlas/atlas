  source: "Feuille d'exercices #02 (Prost), exercice 52"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on pose $\displaystyle I_{n} = \int_{0}^{1} \frac{\mathrm{d} t}{\sqrt{1 + t + \cdots + t^{n}}}$.

    **1.** Montrer que la suite $(I_{n})$ est bien définie et déterminer sa limite $\ell$.

    **2.** Justifier l'existence d'un réel $C > 0$ tel que $I_{n} - \ell \underset{n \to +\infty}{\sim} \dfrac{C}{n^{3/2}}$, et exprimer $C$ par une intégrale.
  corrige: |
    La limite est facile ; l'équivalent de l'écart demande de localiser la zone, près de $t = 1$, où la somme $1 + t + \cdots + t^{n}$ diffère encore de sa limite $\frac{1}{1 - t}$.

    **1.** La fonction intégrée est continue sur $[0, 1]$, à valeurs dans $]0, 1]$, car $1 + t + \cdots + t^{n} \geqslant 1$. Pour $t \in [0, 1[$, $1 + t + \cdots + t^{n} \to \frac{1}{1 - t}$, donc la fonction intégrée tend vers $\sqrt{1 - t}$, et elle est dominée par $1$. 
    $$\boxed{\ell = \int_{0}^{1} \sqrt{1 - t}\,\mathrm{d} t = \frac{2}{3}}$$

    **2.** Pour $t \in [0, 1[$, la fonction intégrée vaut $\sqrt{\frac{1 - t}{1 - t^{n + 1}}}$, d'où 
    $$I_{n} - \ell = \int_{0}^{1} \sqrt{1 - t}\,\Big(\frac{1}{\sqrt{1 - t^{n + 1}}} - 1\Big)\mathrm{d} t.$$
     On pose $N = n + 1$ et l'on effectue le changement de variable $t = \mathrm{e}^{-u/N}$, bijection décroissante de $]0, +\infty[$ sur $]0, 1[$, avec $\mathrm{d} t = -\frac{1}{N}\mathrm{e}^{-u/N}\,\mathrm{d} u$ et $t^{N} = \mathrm{e}^{-u}$ : 
    $$N^{3/2}(I_{n} - \ell) = \int_{0}^{+\infty} g_{N}(u)\,\mathrm{d} u, \qquad g_{N}(u) = \sqrt{N\big(1 - \mathrm{e}^{-u/N}\big)}\;\mathrm{e}^{-u/N}\Big(\frac{1}{\sqrt{1 - \mathrm{e}^{-u}}} - 1\Big).$$
     Convergence simple. Pour $u > 0$ fixé, $N(1 - \mathrm{e}^{-u/N}) \to u$ et $\mathrm{e}^{-u/N} \to 1$, donc 
    $$g_{N}(u) \xrightarrow[N \to +\infty]{} \varphi(u) = \sqrt{u}\,\Big(\frac{1}{\sqrt{1 - \mathrm{e}^{-u}}} - 1\Big).$$

    Domination. L'inégalité $1 - \mathrm{e}^{-s} \leqslant s$ donne $0 \leqslant g_{N}(u) \leqslant \varphi(u)$. La fonction $\varphi$ est continue sur $]0, +\infty[$ ; en $0$, $\frac{\sqrt{u}}{\sqrt{1 - \mathrm{e}^{-u}}} \to 1$, donc $\varphi$ est bornée ; en $+\infty$, $\frac{1}{\sqrt{1 - \mathrm{e}^{-u}}} - 1 \sim \frac{\mathrm{e}^{-u}}{2}$, donc $\varphi(u) \sim \frac{1}{2}\sqrt{u}\,\mathrm{e}^{-u}$. Elle est intégrable.

    Conclusion. Le théorème 1 donne $N^{3/2}(I_{n} - \ell) \to C = \int_{0}^{+\infty} \varphi$, avec $C > 0$ car $\varphi$ est continue, positive et non nulle. Comme $N^{3/2} \sim n^{3/2}$ : 
    $$\boxed{I_{n} - \frac{2}{3} \underset{n \to +\infty}{\sim} \frac{C}{n^{3/2}}, \qquad C = \int_{0}^{+\infty} \sqrt{u}\,\Big(\frac{1}{\sqrt{1 - \mathrm{e}^{-u}}} - 1\Big)\mathrm{d} u \approx 0{,}7534}$$
     Pour $n = 1000$, $n^{3/2}(I_{n} - \ell) \approx 0{,}7512$, en accord avec cette valeur.
- id: "mp-13-11"
