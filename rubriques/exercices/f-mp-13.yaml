  enonce: |
    Pour $n \in \mathbb{N}^{*}$ et $x > 0$, on pose $\displaystyle I_{n}(x) = \int_{0}^{+\infty} \frac{\mathrm{d} t}{(x^{2} + t^{2})^{n}}$.

    **1.** Justifier l'existence de $I_{n}(x)$ et calculer $I_{1}(x)$.

    **2.** Montrer que $I_{n}$ est de classe $\mathcal{C}^{1}$ sur $]0, +\infty[$ et exprimer $I_{n}'$ à l'aide de $I_{n + 1}$.

    **3.** En déduire $I_{n}(x)$ pour tout $n$. Comparer avec l'exercice 17 de la feuille du chapitre 12.
  corrige: |
    On dérive par rapport au paramètre pour passer d'un exposant au suivant : la relation obtenue entre $I_{n}'$ et $I_{n + 1}$ remplace l'intégration par parties de l'exercice 17 de la feuille du chapitre 12.

    **1.** La fonction intégrée est continue sur $[0, +\infty[$ et équivalente à $\frac{1}{t^{2n}}$ en $+\infty$, avec $2n \geqslant 2$ : elle est intégrable. On a $I_{1}(x) = \big[\frac{1}{x}\operatorname{Arctan}\frac{t}{x}\big]_{0}^{+\infty}$. 
    $$\boxed{I_{1}(x) = \frac{\pi}{2x}}$$

    **2.** La dérivée partielle par rapport à $x$ vaut $-\frac{2nx}{(x^{2} + t^{2})^{n + 1}}$. Pour $x \in [a, b] \subset ]0, +\infty[$, elle est majorée en module par $\frac{2nb}{(a^{2} + t^{2})^{n + 1}}$, intégrable sur $[0, +\infty[$. Le théorème 5, avec la domination sur tout segment, donne : 
    $$\boxed{I_{n}'(x) = -2nx\,I_{n + 1}(x)}$$

    **3.** Montrons par récurrence que $I_{n}(x) = \frac{c_{n}}{x^{2n - 1}}$. C'est vrai pour $n = 1$ avec $c_{1} = \frac{\pi}{2}$. Si c'est vrai au rang $n$, la question 2 donne $I_{n + 1}(x) = -\frac{I_{n}'(x)}{2nx} = \frac{(2n - 1)c_{n}}{2n}\cdot\frac{1}{x^{2n + 1}}$. Ainsi $c_{n + 1} = \frac{2n - 1}{2n}c_{n}$, et 
    $$\boxed{I_{n}(x) = \frac{\pi}{2}\cdot\frac{(2n - 2)!}{4^{n - 1}\big((n - 1)!\big)^{2}}\cdot\frac{1}{x^{2n - 1}}}$$
     Pour $x = 1$, on retrouve l'intégrale $J_{n}$ de l'exercice 17 de la feuille du chapitre 12.
- id: "mp-13-27"
  feuille: "f-mp-13"
  numero: 27
  partie: "Dérivation d'une intégrale à paramètre"
  etoiles: 2
