  enonce: |
    *Perspective : la formule sommatoire de Poisson.* Pour $t > 0$, on pose $\displaystyle \theta(t) = \sum_{n = -\infty}^{+\infty} \mathrm{e}^{-\pi n^{2}t}$ et, pour $x \in \mathbb{R}$, $\displaystyle g_{t}(x) = \sum_{n = -\infty}^{+\infty} \mathrm{e}^{-\pi t(x + n)^{2}}$.

    **1.** Montrer que la série définissant $g_{t}$, ainsi que la série des dérivées, convergent normalement sur tout segment. En déduire que $g_{t}$ est de classe $\mathcal{C}^{1}$ et $1$-périodique.

    **2.** Montrer que, pour tout $k \in \mathbb{Z}$, le coefficient de Fourier $\displaystyle c_{k}(g_{t}) = \int_{0}^{1} g_{t}(x)\mathrm{e}^{-2\mathrm{i}\pi kx}\,\mathrm{d} x$ vaut $\displaystyle \int_{-\infty}^{+\infty} \mathrm{e}^{-\pi tx^{2}}\mathrm{e}^{-2\mathrm{i}\pi kx}\,\mathrm{d} x$.

    **3.** À l'aide du calcul de la section 13.5 du cours, en déduire que $c_{k}(g_{t}) = \dfrac{1}{\sqrt{t}}\,\mathrm{e}^{-\pi k^{2}/t}$.

    **4.** À l'aide du chapitre 11, en déduire l'égalité $\displaystyle \theta\Big(\frac{1}{t}\Big) = \sqrt{t}\,\theta(t)$ pour tout $t > 0$.

    **5.** En déduire que $\theta(t) \underset{t \to 0^{+}}{\sim} \dfrac{1}{\sqrt{t}}$. Combien de termes de la série $\theta(10^{-2})$ faut-il sommer pour en avoir une valeur approchée à $10^{-6}$ près, et combien de termes de la série $\theta(10^{2})$ ?

    Cette égalité, découverte au XIXᵉ siècle, est le point de départ de la démonstration par Riemann de l'équation fonctionnelle de la fonction $\zeta$.
  corrige: |
    On périodise la gaussienne, puis on calcule les coefficients de Fourier de la fonction périodique obtenue : ce sont, au facteur près, les valeurs de la transformée de Fourier de la gaussienne aux entiers. L'égalité de la somme et de la série de Fourier en $0$ est la formule de Poisson.

    **1.** Soit $A > 0$ et $x \in [-A, A]$. Pour $|n| \geqslant 2A$, $|x + n| \geqslant \frac{|n|}{2}$, d'où 
    $$\mathrm{e}^{-\pi t(x + n)^{2}} \leqslant \mathrm{e}^{-\pi tn^{2}/4} \qquad\text{et}\qquad \big|2\pi t(x + n)\mathrm{e}^{-\pi t(x + n)^{2}}\big| \leqslant 2\pi t(A + |n|)\,\mathrm{e}^{-\pi tn^{2}/4},$$
     termes généraux de séries convergentes. La série et la série des dérivées convergent normalement sur $[-A, A]$ : $g_{t}$ est de classe $\mathcal{C}^{1}$ (chapitre 8). Le remplacement de $x$ par $x + 1$ revient à décaler l'indice $n$, ce qui ne change pas la somme. 
    $$\boxed{g_{t} \text{ est de classe } \mathcal{C}^{1} \text{ et } 1\text{-périodique}}$$

    **2.** La convergence uniforme sur le segment $[0, 1]$ permet d'intervertir somme et intégrale (chapitre 8). Le changement de variable $y = x + n$ et l'égalité $\mathrm{e}^{2\mathrm{i}\pi kn} = 1$ donnent 
    $$c_{k}(g_{t}) = \sum_{n = -\infty}^{+\infty} \int_{n}^{n + 1} \mathrm{e}^{-\pi ty^{2}}\mathrm{e}^{-2\mathrm{i}\pi ky}\,\mathrm{d} y = \int_{-\infty}^{+\infty} \mathrm{e}^{-\pi ty^{2}}\mathrm{e}^{-2\mathrm{i}\pi ky}\,\mathrm{d} y,$$
     la dernière égalité par la relation de Chasles, la fonction étant intégrable sur $\mathbb{R}$.

    **3.** La partie imaginaire est nulle par imparité. Le changement de variable $s = \sqrt{\pi t}\,y$ et la formule du cours, appliquée avec $\frac{2\sqrt{\pi}\,k}{\sqrt{t}}$ à la place de $x$, donnent 
    $$c_{k}(g_{t}) = \frac{1}{\sqrt{\pi t}}\int_{-\infty}^{+\infty} \mathrm{e}^{-s^{2}}\cos\Big(\frac{2\sqrt{\pi}\,k}{\sqrt{t}}\,s\Big)\mathrm{d} s = \frac{1}{\sqrt{\pi t}}\cdot\sqrt{\pi}\,\mathrm{e}^{-\pi k^{2}/t}.$$

    $$\boxed{c_{k}(g_{t}) = \frac{1}{\sqrt{t}}\,\mathrm{e}^{-\pi k^{2}/t}}$$

    **4.** La fonction $g_{t}$ est de classe $\mathcal{C}^{1}$ et $1$-périodique : sa série de Fourier converge normalement vers elle (chapitre 11). En $x = 0$, on obtient $g_{t}(0) = \sum_{k} c_{k}(g_{t})$, c'est-à-dire $\theta(t) = \frac{1}{\sqrt{t}}\theta\big(\frac{1}{t}\big)$. 
    $$\boxed{\theta\Big(\frac{1}{t}\Big) = \sqrt{t}\,\theta(t) \quad\text{pour tout } t > 0}$$

    **5.** On a $0 \leqslant \theta(u) - 1 = 2\sum_{n \geqslant 1} \mathrm{e}^{-\pi n^{2}u} \leqslant 2\sum_{n \geqslant 1} \mathrm{e}^{-\pi nu} = \frac{2\mathrm{e}^{-\pi u}}{1 - \mathrm{e}^{-\pi u}} \to 0$ quand $u \to +\infty$. Donc $\theta(t) = \frac{1}{\sqrt{t}}\theta\big(\frac{1}{t}\big) \sim \frac{1}{\sqrt{t}}$ quand $t \to 0^{+}$. 
    $$\boxed{\theta(t) \underset{t \to 0^{+}}{\sim} \frac{1}{\sqrt{t}}}$$
     Pour $t = 10^{-2}$, le reste $2\sum_{n > N} \mathrm{e}^{-\pi n^{2}/100}$ ne descend sous $10^{-6}$ que pour $N = 21$ : il faut sommer les $43$ termes d'indices $-21$ à $21$. Pour $t = 10^{2}$, le premier terme négligé vaut $2\mathrm{e}^{-100\pi} \approx 10^{-136}$ : un seul terme suffit, et $\theta(10^{2}) \approx 1$. La formule de Poisson donne alors $\theta(10^{-2}) = 10\,\theta(10^{2})$, soit $10$ à mieux que $10^{-130}$ près, avec un seul terme. Elle échange une série lentement convergente contre une série qui converge extrêmement vite.

