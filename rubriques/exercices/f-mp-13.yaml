  enonce: |
    *La formule de Stirling pour $\Gamma$.* On pose $h(u) = u - 1 - \ln u$ pour $u > 0$.

    **1.** Montrer que, pour $x > 0$, $\displaystyle \Gamma(x + 1) = x^{x + 1}\mathrm{e}^{-x}\int_{0}^{+\infty} \mathrm{e}^{-xh(u)}\,\mathrm{d} u$.

    **2.** Étudier $h$. Montrer que $h(1 + v) \geqslant \frac{v^{2}}{6}$ pour $v \in ]-1, 1]$, et que $h(1 + v) \geqslant (1 - \ln 2)\,v$ pour $v \geqslant 1$.

    **3.** Montrer que $\displaystyle \sqrt{x}\int_{0}^{+\infty} \mathrm{e}^{-xh(u)}\,\mathrm{d} u \xrightarrow[x \to +\infty]{} \sqrt{2\pi}$.

    **4.** En déduire que $\Gamma(x + 1) \underset{x \to +\infty}{\sim} \sqrt{2\pi x}\,\Big(\dfrac{x}{\mathrm{e}}\Big)^{x}$. Que retrouve-t-on pour $x = n$ entier ?
  corrige: |
    C'est la méthode de Laplace appliquée à $\Gamma$ : après normalisation, la fonction intégrée se concentre autour du minimum $u = 1$ de $h$, sur une largeur de l'ordre de $\frac{1}{\sqrt{x}}$.

    **1.** Le changement de variable $t = xu$ donne $\Gamma(x + 1) = \int_{0}^{+\infty} t^{x}\mathrm{e}^{-t}\,\mathrm{d} t = x^{x + 1}\int_{0}^{+\infty} \mathrm{e}^{x\ln u - xu}\,\mathrm{d} u$, et $x\ln u - xu = -x - xh(u)$. 
    $$\boxed{\Gamma(x + 1) = x^{x + 1}\mathrm{e}^{-x}\int_{0}^{+\infty} \mathrm{e}^{-xh(u)}\,\mathrm{d} u}$$

    **2.** On a $h'(u) = 1 - \frac{1}{u}$ et $h''(u) = \frac{1}{u^{2}} > 0$ : $h$ est convexe, décroissante sur $]0, 1]$, croissante sur $[1, +\infty[$, de minimum $h(1) = 0$, et elle tend vers $+\infty$ en $0$ et en $+\infty$. Pour $v \in ]-1, 0]$, $-\ln(1 + v) = \sum_{k \geqslant 1} \frac{(-v)^{k}}{k} \geqslant -v + \frac{v^{2}}{2}$, d'où $h(1 + v) \geqslant \frac{v^{2}}{2}$. Pour $v \in [0, 1]$, l'inégalité $\ln(1 + v) \leqslant v - \frac{v^{2}}{2} + \frac{v^{3}}{3}$ donne $h(1 + v) \geqslant \frac{v^{2}}{2} - \frac{v^{3}}{3} \geqslant \frac{v^{2}}{6}$. Enfin, $h$ étant convexe et nulle en $1$, la pente $v \mapsto \frac{h(1 + v)}{v}$ est croissante, donc au moins égale à $h(2) = 1 - \ln 2$ pour $v \geqslant 1$. 
    $$\boxed{h(1 + v) \geqslant \frac{v^{2}}{6} \ \text{ sur } ]-1, 1], \qquad h(1 + v) \geqslant (1 - \ln 2)\,v \ \text{ sur } [1, +\infty[}$$

    **3.** Le changement de variable $u = 1 + \frac{s}{\sqrt{x}}$ donne 
    $$\sqrt{x}\int_{0}^{+\infty} \mathrm{e}^{-xh(u)}\,\mathrm{d} u = \int_{-\infty}^{+\infty} g_{x}(s)\,\mathrm{d} s, \qquad g_{x}(s) = \mathrm{e}^{-xh(1 + s/\sqrt{x})}\,\mathbf{1}_{]-\sqrt{x}, +\infty[}(s).$$
     Convergence simple. Comme $h(1 + v) = \frac{v^{2}}{2} + O(v^{3})$, on a $xh\big(1 + \frac{s}{\sqrt{x}}\big) = \frac{s^{2}}{2} + O\big(\frac{1}{\sqrt{x}}\big) \to \frac{s^{2}}{2}$.

    Domination. Pour $x \geqslant 1$ : si $|s| \leqslant \sqrt{x}$, la question 2 donne $xh \geqslant \frac{s^{2}}{6}$ ; si $s \geqslant \sqrt{x}$, elle donne $xh \geqslant \sqrt{x}(1 - \ln 2)s \geqslant (1 - \ln 2)s$. Ainsi $0 \leqslant g_{x}(s) \leqslant \mathrm{e}^{-s^{2}/6} + \mathrm{e}^{-(1 - \ln 2)s}\mathbf{1}_{[0, +\infty[}(s)$, fonction intégrable sur $\mathbb{R}$ et indépendante de $x$.

    La proposition 1 donne la limite $\int_{\mathbb{R}} \mathrm{e}^{-s^{2}/2}\,\mathrm{d} s = \sqrt{2\pi}$. 
    $$\boxed{\sqrt{x}\int_{0}^{+\infty} \mathrm{e}^{-xh(u)}\,\mathrm{d} u \xrightarrow[x \to +\infty]{} \sqrt{2\pi}}$$

    **4.** En reportant dans la question 1 : 
    $$\boxed{\Gamma(x + 1) \underset{x \to +\infty}{\sim} \sqrt{2\pi x}\,\Big(\frac{x}{\mathrm{e}}\Big)^{x}}$$
     Pour $x = n$ entier, on retrouve la formule de Stirling $n! \sim \sqrt{2\pi n}\,\big(\frac{n}{\mathrm{e}}\big)^{n}$ de MPSI, cette fois pour une variable réelle. Numériquement, le quotient vaut $1{,}0084$ pour $x = 10$ et $1{,}00008$ pour $x = 1000$, soit environ $1 + \frac{1}{12x}$.
- id: "mp-13-38"
  feuille: "f-mp-13"
  numero: 38
  partie: "La fonction $\\Gamma$ d'Euler"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [fonction Gamma, intégration terme à terme, "dérivation sous l'intégrale"]
  noeuds: [ri-integrable, m-convergence-dominee, as-series, gd-schwarz]
  notions: []
  page_enonce: 9
  page_corrige: 25
  enonce: |
    *La fonction digamma.* On pose $\psi = \frac{\Gamma'}{\Gamma}$ sur $]0, +\infty[$.

    **1.** À l'aide de la formule de Gauss, montrer que, pour tout $x > 0$, 
    $$\ln\Gamma(x) = -\gamma x - \ln x + \sum_{k = 1}^{+\infty} \Big(\frac{x}{k} - \ln\Big(1 + \frac{x}{k}\Big)\Big).$$

    **2.** Justifier que l'on peut dériver cette égalité terme à terme, et en déduire que 
    $$\psi(x) = -\gamma - \frac{1}{x} + \sum_{k = 1}^{+\infty} \Big(\frac{1}{k} - \frac{1}{k + x}\Big).$$

    **3.** Retrouver la valeur de $\Gamma'(1)$ obtenue dans le cours, et montrer que $\Gamma'\big(\frac{1}{2}\big) = -\sqrt{\pi}\,(\gamma + 2\ln 2)$.

    **4.** Calculer $\psi'$, et retrouver la convexité de $\ln\Gamma$. Que vaut $\psi'(1)$ ?
  corrige: |
    On passe au logarithme dans la formule de Gauss pour transformer le produit en somme, puis l'on dérive terme à terme par le théorème du chapitre 8.

    **1.** D'après la formule de Gauss, $\ln\Gamma(x)$ est la limite de 
    $$x\ln n + \sum_{k = 1}^{n} \ln k - \sum_{k = 0}^{n} \ln(x + k) = -\ln x + x(\ln n - H_{n}) + \sum_{k = 1}^{n} \Big(\frac{x}{k} - \ln\Big(1 + \frac{x}{k}\Big)\Big),$$
     où $H_{n} = \sum_{k = 1}^{n} \frac{1}{k}$, en utilisant $\ln(x + k) - \ln k = \ln\big(1 + \frac{x}{k}\big)$. Comme $\ln n - H_{n} \to -\gamma$ (chapitre 20 de MPSI), la série converge et 
    $$\boxed{\ln\Gamma(x) = -\gamma x - \ln x + \sum_{k = 1}^{+\infty} \Big(\frac{x}{k} - \ln\Big(1 + \frac{x}{k}\Big)\Big)}$$

    **2.** Les fonctions $u_{k} : x \mapsto \frac{x}{k} - \ln\big(1 + \frac{x}{k}\big)$ sont de classe $\mathcal{C}^{1}$ sur $]0, +\infty[$, avec 
    $$u_{k}'(x) = \frac{1}{k} - \frac{1}{k + x} = \frac{x}{k(k + x)}.$$
     Sur tout segment $[a, b] \subset ]0, +\infty[$, $|u_{k}'(x)| \leqslant \frac{b}{k^{2}}$ : la série des dérivées converge normalement, et la série $\sum u_{k}$ converge simplement. Le théorème de dérivation terme à terme du chapitre 8 s'applique. 
    $$\boxed{\psi(x) = \frac{\Gamma'(x)}{\Gamma(x)} = -\gamma - \frac{1}{x} + \sum_{k = 1}^{+\infty} \Big(\frac{1}{k} - \frac{1}{k + x}\Big)}$$

    **3.** Pour $x = 1$, la série est télescopique, de somme $1$ : $\psi(1) = -\gamma$, et $\Gamma'(1) = \Gamma(1)\psi(1) = -\gamma$, comme dans le cours. Pour $x = \frac{1}{2}$, on utilise $\ln 2 = 1 - \frac{1}{2} + \frac{1}{3} - \cdots$ (section 13.3 du cours) : 
    $$\sum_{k = 1}^{+\infty} \Big(\frac{1}{k} - \frac{2}{2k + 1}\Big) = 2\sum_{k = 1}^{+\infty} \Big(\frac{1}{2k} - \frac{1}{2k + 1}\Big) = 2(1 - \ln 2).$$
     Ainsi $\psi\big(\frac{1}{2}\big) = -\gamma - 2 + 2 - 2\ln 2$. 
    $$\boxed{\Gamma'(1) = -\gamma, \qquad \Gamma'\Big(\frac{1}{2}\Big) = \Gamma\Big(\frac{1}{2}\Big)\,\psi\Big(\frac{1}{2}\Big) = -\sqrt{\pi}\,(\gamma + 2\ln 2)}$$

    **4.** Les dérivées $\frac{1}{(k + x)^{2}}$ des termes de la série de $\psi$ sont majorées par $\frac{1}{k^{2}}$ sur $]0, +\infty[$ : on dérive encore terme à terme. 
    $$\boxed{\psi'(x) = (\ln\Gamma)''(x) = \sum_{k = 0}^{+\infty} \frac{1}{(k + x)^{2}} > 0, \qquad \psi'(1) = \zeta(2) = \frac{\pi^{2}}{6}}$$
     On retrouve la convexité de $\ln\Gamma$, cette fois stricte, sans l'inégalité de Cauchy-Schwarz.
- id: "mp-13-39"
  feuille: "f-mp-13"
  numero: 39
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, domination, intégration terme à terme, "continuité sous l'intégrale", "dérivation sous l'intégrale"]
  noeuds: [m-convergence-dominee, as-series, gd-schwarz]
  notions: [fonction-dominee]
  page_enonce: 9
  page_corrige: 26
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Si des fonctions continues $f_{n}$ convergent simplement sur $[0, 1]$ vers une fonction continue $f$, et si $|f_{n}| \leqslant 1$ pour tout $n$, alors $\displaystyle \int_{0}^{1} f_{n} \to \int_{0}^{1} f$.

    **2.** Si des fonctions $f_{n}$ intégrables sur $[0, +\infty[$ convergent uniformément vers $0$ sur $[0, +\infty[$, alors $\displaystyle \int_{0}^{+\infty} f_{n} \to 0$.

    **3.** Sous les hypothèses du théorème de convergence dominée, la suite $(f_{n})$ converge uniformément vers $f$ sur $I$.

    **4.** Si $(f_{n})$ est une suite décroissante de fonctions positives, qui converge simplement vers une fonction $f$ continue par morceaux, et si $f_{0}$ est intégrable sur $I$, alors $\displaystyle \int_{I} f_{n} \to \int_{I} f$.

    **5.** Si la série $\sum \int_{I} |f_{n}|$ diverge, l'égalité $\displaystyle \int_{I} \sum_{n = 0}^{+\infty} f_{n} = \sum_{n = 0}^{+\infty} \int_{I} f_{n}$ est fausse.

    **6.** Si les $f_{n}$ sont positives et intégrables sur $I$, et si $\sum f_{n}$ converge simplement vers une fonction continue par morceaux et intégrable, alors $\displaystyle \int_{I} \sum_{n = 0}^{+\infty} f_{n} = \sum_{n = 0}^{+\infty} \int_{I} f_{n}$.

    **7.** Si $f$ est continue sur $\mathbb{R} \times [0, +\infty[$ et si $f(x, \cdot)$ est intégrable pour tout $x$, alors $\displaystyle x \mapsto \int_{0}^{+\infty} f(x, t)\,\mathrm{d} t$ est continue sur $\mathbb{R}$.

    **8.** Si $f(x, \cdot)$ est intégrable sur $I$ pour tout $x$ d'un intervalle $A$, si $\frac{\partial f}{\partial x}$ existe et est continue par rapport à $x$, continue par morceaux par rapport à $t$, et dominée sur tout segment de $A$, alors $\displaystyle x \mapsto \int_{I} f(x, t)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$ sur $A$.

    **9.** La fonction $\displaystyle x \mapsto \int_{0}^{+\infty} \mathrm{e}^{-t}\cos(xt)\,\mathrm{d} t$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.

    **10.** La fonction $\Gamma$ est décroissante sur $]0, 1]$.
  corrige: |
    Six affirmations sont vraies (1, 4, 6, 8, 9, 10) et quatre sont fausses (2, 3, 5, 7).

    **1. Vrai.** Les constantes sont intégrables sur le segment $[0, 1]$ : c'est le théorème 1, avec $\varphi = 1$. C'est le théorème d'Arzelà de l'introduction du cours.

    **2. Faux.** Les fonctions $f_{n} : t \mapsto \frac{1}{n}\mathrm{e}^{-t/n}$ vérifient $\sup |f_{n}| = \frac{1}{n} \to 0$, mais $\int_{0}^{+\infty} f_{n} = 1$ : c'est le mécanisme (c) du cours, où la masse s'étale.

    **3. Faux.** Les fonctions $t \mapsto t^{n}$ sur $[0, 1[$ sont dominées par la constante $1$ et convergent simplement vers $0$, mais $\sup_{[0, 1[} t^{n} = 1$ : la convergence n'est pas uniforme. Le théorème 1 conclut à la convergence des intégrales, pas à celle des fonctions.

    **4. Vrai.** La décroissance donne $0 \leqslant f_{n} \leqslant f_{0}$, domination par la fonction intégrable $f_{0}$.

    **5. Faux.** Pour $f_{n}(t) = (-t)^{n}$ sur $[0, 1[$, la série $\sum \int |f_{n}| = \sum \frac{1}{n + 1}$ diverge, et pourtant l'interversion est vraie et donne $\ln 2$ (section 13.3 du cours). Le théorème 3 est une condition suffisante.

    **6. Vrai.** C'est le théorème 2, qui ne demande que la positivité.

    **7. Faux.** La fonction $f(x, t) = x\,\mathrm{e}^{-|x|t}$ est continue sur $\mathbb{R} \times [0, +\infty[$, et $f(x, \cdot)$ est intégrable pour tout $x$, d'intégrale $\frac{x}{|x|}$ si $x \neq 0$ et $0$ si $x = 0$ : l'intégrale à paramètre est la fonction signe, discontinue en $0$. Aucune domination n'est possible au voisinage de $x = 0$, car $\sup_{x} |x|\mathrm{e}^{-|x|t} = \frac{1}{\mathrm{e} t}$ n'est pas intégrable en $+\infty$.

    **8. Vrai.** C'est le théorème 5 dans sa version locale (remarque qui le suit dans le cours).

    **9. Vrai.** Les dérivées $k$-ièmes par rapport à $x$ sont majorées par $t^{k}\mathrm{e}^{-t}$, intégrable : le théorème 6 s'applique. D'ailleurs, l'intégrale vaut $\frac{1}{1 + x^{2}}$.

    **10. Vrai.** D'après la proposition 4 du cours, $\Gamma$ est décroissante sur $]0, x_{0}]$, avec $x_{0} \in ]1, 2[$.
