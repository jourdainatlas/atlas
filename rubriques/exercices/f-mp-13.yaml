  page_enonce: 3
  page_corrige: 8
  enonce: |
    Justifier l'existence et calculer, sous forme de sommes de séries puis à l'aide de $\zeta(2)$ : 
    $$\text{(a)} \ \int_{0}^{1} \frac{\ln t}{t - 1}\,\mathrm{d} t, \qquad \text{(b)} \ \int_{0}^{1} \frac{\ln t}{1 - t^{2}}\,\mathrm{d} t, \qquad \text{(c)} \ \int_{0}^{1} \ln t\,\ln(1 - t)\,\mathrm{d} t.$$
  corrige: |
    Dans les trois cas, on développe en série entière la fraction ou le logarithme, et les termes obtenus sont de signe constant : c'est le théorème 2 qui s'applique. On utilise $\int_{0}^{1} t^{m}(-\ln t)\,\mathrm{d} t = \frac{1}{(m + 1)^{2}}$, obtenu par intégration par parties.

    **(a)** Pour $t \in ]0, 1[$, $\frac{\ln t}{t - 1} = \sum_{n \geqslant 0} t^{n}(-\ln t)$, termes positifs. 
    $$\boxed{\int_{0}^{1} \frac{\ln t}{t - 1}\,\mathrm{d} t = \sum_{n = 0}^{+\infty} \frac{1}{(n + 1)^{2}} = \frac{\pi^{2}}{6}}$$

    **(b)** De même, pour $t \in ]0, 1[$, 
    $$-\frac{\ln t}{1 - t^{2}} = \sum_{n = 0}^{+\infty} t^{2n}(-\ln t),$$
     et la somme des inverses des carrés impairs vaut $\zeta(2) - \frac{1}{4}\zeta(2) = \frac{3}{4}\zeta(2)$. 
    $$\boxed{\int_{0}^{1} \frac{\ln t}{1 - t^{2}}\,\mathrm{d} t = -\sum_{n = 0}^{+\infty} \frac{1}{(2n + 1)^{2}} = -\frac{\pi^{2}}{8}}$$

    **(c)** Pour $t \in ]0, 1[$, $\ln t\ln(1 - t) = \sum_{n \geqslant 1} \frac{t^{n}(-\ln t)}{n}$, termes positifs, d'où 
    $$\int_{0}^{1} \ln t\ln(1 - t)\,\mathrm{d} t = \sum_{n = 1}^{+\infty} \frac{1}{n(n + 1)^{2}} = \sum_{n = 1}^{+\infty} \Big(\frac{1}{n} - \frac{1}{n + 1} - \frac{1}{(n + 1)^{2}}\Big),$$
     somme d'une série télescopique de somme $1$ et de la série $-\sum \frac{1}{(n + 1)^{2}}$, de somme $-(\zeta(2) - 1)$. 
    $$\boxed{\int_{0}^{1} \ln t\,\ln(1 - t)\,\mathrm{d} t = 2 - \frac{\pi^{2}}{6} \approx 0{,}3551}$$
- id: "mp-13-13"
