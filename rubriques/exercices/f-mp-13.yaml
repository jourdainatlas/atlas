  page_enonce: 5
  page_corrige: 13
  enonce: |
    Pour $x$ réel, on pose, sous réserve d'existence, $\displaystyle f(x) = \int_{0}^{\pi/4} \tan^{x}t\,\mathrm{d} t$.

    **1.** Déterminer l'ensemble de définition de $f$.

    **2.** Montrer que $f$ est continue et monotone, et déterminer sa limite en $+\infty$.

    **3.** Calculer $f(x) + f(x + 2)$, et en déduire un équivalent de $f$ en $+\infty$, puis un équivalent de $f$ en $-1$.
  corrige: |
    La relation de la question 3 est l'analogue de $\Gamma(x + 1) = x\Gamma(x)$ : elle permet de déduire les équivalents de la monotonie.

    **1.** La fonction $t \mapsto \tan^{x}t$ est continue sur $]0, \frac{\pi}{4}]$, et $\tan^{x}t \sim t^{x}$ en $0$ : elle est intégrable si et seulement si $x > -1$. 
    $$\boxed{\mathcal{D}_{f} = ]-1, +\infty[}$$

    **2.** Pour $t \in ]0, \frac{\pi}{4}]$, $\tan t \in ]0, 1]$, donc $x \mapsto \tan^{x}t$ est décroissante : $f$ est décroissante. Pour $a > -1$ et $x \geqslant a$, $0 \leqslant \tan^{x}t \leqslant \tan^{a}t$, intégrable : la proposition 2, avec les intervalles $[a, +\infty[$, donne la continuité. Quand $x \to +\infty$, $\tan^{x}t \to 0$ pour $t < \frac{\pi}{4}$, avec la domination par $\tan^{0}t = 1$ pour $x \geqslant 0$. 
    $$\boxed{f \text{ est continue et décroissante sur } ]-1, +\infty[, \qquad \lim\limits_{x \to +\infty} f(x) = 0}$$

    **3.** On a $f(x) + f(x + 2) = \int_{0}^{\pi/4} \tan^{x}t\,(1 + \tan^{2}t)\,\mathrm{d} t = \Big[\frac{\tan^{x + 1}t}{x + 1}\Big]_{0}^{\pi/4}$, le crochet étant nul en $0$ puisque $x + 1 > 0$. 
    $$\boxed{f(x) + f(x + 2) = \frac{1}{x + 1}}$$
     Par décroissance, $2f(x + 2) \leqslant \frac{1}{x + 1} \leqslant 2f(x)$ ; en appliquant la première inégalité en $x - 2$ pour $x > 1$, on obtient l'encadrement $\frac{1}{2(x + 1)} \leqslant f(x) \leqslant \frac{1}{2(x - 1)}$. En $-1$, $f(x) = \frac{1}{x + 1} - f(x + 2)$, et $f(x + 2) \to f(1) = \int_{0}^{\pi/4} \tan t\,\mathrm{d} t = \frac{\ln 2}{2}$, finie. 
    $$\boxed{f(x) \underset{x \to +\infty}{\sim} \frac{1}{2x}, \qquad f(x) \underset{x \to -1}{\sim} \frac{1}{x + 1}}$$
- id: "mp-13-20"
  feuille: "f-mp-13"
  numero: 20
  partie: "Continuité d'une intégrale à paramètre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["continuité d'une intégrale à paramètre", "dérivation sous l'intégrale", équivalents]
  noeuds: [gd-schwarz, ar-asymptotique]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 30 ; Feuille d'exercices #02 (Prost), exercice 43"
  page_enonce: 5
  page_corrige: 13
  enonce: |
    *Comportement au bord.* Pour $x > 0$, on pose $\displaystyle f(x) = \int_{0}^{\pi/2} \frac{\cos t}{t + x}\,\mathrm{d} t$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $]0, +\infty[$, et étudier ses variations.

    **2.** Déterminer les limites de $f$ en $0$ et en $+\infty$.

    **3.** Montrer que $f(x) \underset{x \to +\infty}{\sim} \dfrac{1}{x}$ et que $f(x) \underset{x \to 0}{\sim} -\ln x$. Pour le second, on pourra comparer $f(x)$ à $\displaystyle \int_{0}^{\pi/2} \frac{\mathrm{d} t}{t + x}$.
  corrige: |
    L'intégrale porte sur un segment, mais elle devient singulière quand $x \to 0$ : le bord du domaine est l'endroit où se concentre la difficulté.

    **1.** Pour $t \in [0, \frac{\pi}{2}]$, $x \mapsto \frac{\cos t}{t + x}$ est de classe $\mathcal{C}^{1}$ sur $]0, +\infty[$, de dérivée $-\frac{\cos t}{(t + x)^{2}}$, majorée en module par $\frac{1}{a^{2}}$ pour $x \geqslant a > 0$, constante intégrable sur le segment. Le théorème 5, appliqué sur chaque $[a, +\infty[$, donne $f \in \mathcal{C}^{1}$ et $f'(x) = -\int_{0}^{\pi/2} \frac{\cos t}{(t + x)^{2}}\,\mathrm{d} t < 0$. 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ et strictement décroissante sur } ]0, +\infty[}$$

    **2.** On a $0 \leqslant f(x) \leqslant \frac{\pi}{2x}$, donc $f \to 0$ en $+\infty$. En $0$, $\cos t \geqslant \frac{1}{2}$ sur $[0, \frac{\pi}{3}]$, d'où 
    $$f(x) \geqslant \frac{1}{2}\int_{0}^{\pi/3} \frac{\mathrm{d} t}{t + x} = \frac{1}{2}\ln\frac{\pi/3 + x}{x} \xrightarrow[x \to 0]{} +\infty.$$

    $$\boxed{\lim\limits_{x \to 0} f(x) = +\infty, \qquad \lim\limits_{x \to +\infty} f(x) = 0}$$

    **3.** On a $xf(x) = \int_{0}^{\pi/2} \frac{\cos t}{1 + t/x}\,\mathrm{d} t$, et la fonction intégrée tend vers $\cos t$, dominée par $\cos t$ : $xf(x) \to 1$. En $0$, on écrit 
    $$f(x) = \int_{0}^{\pi/2} \frac{\mathrm{d} t}{t + x} - \int_{0}^{\pi/2} \frac{1 - \cos t}{t + x}\,\mathrm{d} t = \ln\frac{\pi/2 + x}{x} - R(x),$$
     avec $0 \leqslant R(x) \leqslant \int_{0}^{\pi/2} \frac{1 - \cos t}{t}\,\mathrm{d} t$, intégrale finie car la fonction intégrée tend vers $0$ en $0$. Donc $f(x) = -\ln x + O(1)$. 
    $$\boxed{f(x) \underset{x \to +\infty}{\sim} \frac{1}{x}, \qquad f(x) \underset{x \to 0}{\sim} -\ln x}$$
- id: "mp-13-21"
  feuille: "f-mp-13"
  numero: 21
  partie: "Continuité d'une intégrale à paramètre"
  etoiles: 2
  types: [Démonstration]
  mots_cles: ["continuité d'une intégrale à paramètre", "continuité sous l'intégrale", "dérivation sous l'intégrale", transformée de Fourier]
  noeuds: [gd-schwarz, fo-transformee]
  notions: []
  source: "Feuille d'exercices #15 (Prost), exercice 6 ; BibM@th, Fonctions définies par une intégrale, exercices 39 et 40"
  page_enonce: 5
  page_corrige: 14
  enonce: |
    *Transformée de Laplace.* Soit $f : [0, +\infty[ \to \mathbb{R}$ continue. On pose, lorsque $t \mapsto \mathrm{e}^{-xt}f(t)$ est intégrable sur $[0, +\infty[$, $\displaystyle \mathcal{L}f(x) = \int_{0}^{+\infty} \mathrm{e}^{-xt}f(t)\,\mathrm{d} t$.

    **1.** Montrer que, si $\mathcal{L}f(x_{0})$ est défini, alors $\mathcal{L}f(x)$ est défini pour tout $x \geqslant x_{0}$. Quelle est la forme de l'ensemble de définition de $\mathcal{L}f$ ?

    **2.** On suppose $f$ bornée. Montrer que $\mathcal{L}f$ est continue sur $]0, +\infty[$, et de classe $\mathcal{C}^{\infty}$, et que $\mathcal{L}f(x) \to 0$ quand $x \to +\infty$.

    **3.** On suppose que $f$ a une limite finie $\ell$ en $+\infty$. Montrer que $x\,\mathcal{L}f(x) \to \ell$ quand $x \to 0^{+}$. C'est le *théorème de la valeur finale*, pendant de l'exemple de la section 13.2 du cours.

    **4.** Calculer $\mathcal{L}f$ pour $f(t) = t^{n}$, $f(t) = \mathrm{e}^{at}$ et $f(t) = \sin(\omega t)$, et vérifier sur ces exemples les résultats précédents.
  corrige: |
    La transformée de Laplace est l'exemple type d'intégrale à paramètre ; les théorèmes de la valeur initiale et finale relèvent tous deux de la proposition 1, après le changement de variable $u = xt$.

    **1.** Pour $x \geqslant x_{0}$, $|\mathrm{e}^{-xt}f(t)| \leqslant |\mathrm{e}^{-x_{0}t}f(t)|$, intégrable. L'ensemble de définition contient donc, avec chacun de ses points, toute la demi-droite à sa droite. 
    $$\boxed{\mathcal{D}_{\mathcal{L}f} \text{ est vide, égal à } \mathbb{R}, \text{ ou de la forme } ]c, +\infty[ \text{ ou } [c, +\infty[}$$

    **2.** Soit $M = \lVert f \rVert_{\infty}$. Pour $x \geqslant a > 0$ et $k \in \mathbb{N}$, $\Big|\frac{\partial^{k}}{\partial x^{k}}\big(\mathrm{e}^{-xt}f(t)\big)\Big| = t^{k}\mathrm{e}^{-xt}|f(t)| \leqslant Mt^{k}\mathrm{e}^{-at}$, intégrable. Le théorème 6, avec la domination de chaque dérivée sur $[a, +\infty[$, donne la classe $\mathcal{C}^{\infty}$ sur $]0, +\infty[$. Enfin, $|\mathcal{L}f(x)| \leqslant \frac{M}{x}$. 
    $$\boxed{\mathcal{L}f \in \mathcal{C}^{\infty}(]0, +\infty[), \quad (\mathcal{L}f)^{(k)}(x) = \int_{0}^{+\infty} (-t)^{k}\mathrm{e}^{-xt}f(t)\,\mathrm{d} t, \quad \mathcal{L}f(x) \xrightarrow[x \to +\infty]{} 0}$$

    **3.** La fonction $f$, continue et de limite finie en $+\infty$, est bornée. Le changement de variable $u = xt$ donne $x\,\mathcal{L}f(x) = \int_{0}^{+\infty} \mathrm{e}^{-u}f\big(\frac{u}{x}\big)\,\mathrm{d} u$. Quand $x \to 0^{+}$, $\frac{u}{x} \to +\infty$ pour $u > 0$, donc $f\big(\frac{u}{x}\big) \to \ell$, et la fonction intégrée est dominée par $M\mathrm{e}^{-u}$. 
    $$\boxed{x\,\mathcal{L}f(x) \xrightarrow[x \to 0^{+}]{} \ell}$$

    **4.** Le changement de variable $u = xt$ et le calcul d'exponentielles complexes donnent 
    $$\boxed{\mathcal{L}(t^{n})(x) = \frac{n!}{x^{n + 1}} \ (x > 0), \qquad \mathcal{L}(\mathrm{e}^{at})(x) = \frac{1}{x - a} \ (x > a), \qquad \mathcal{L}(\sin\omega t)(x) = \frac{\omega}{x^{2} + \omega^{2}} \ (x > 0)}$$
     Ces transformées tendent vers $0$ en $+\infty$, même pour $t^{n}$, qui n'est pas bornée. Le théorème de la valeur initiale du cours se vérifie : $x\,\mathcal{L}(\mathrm{e}^{at})(x) \to 1 = \mathrm{e}^{0}$ et $x\,\mathcal{L}(\sin\omega t)(x) \to 0 = \sin 0$. Pour la valeur finale, si $a < 0$, $x\,\mathcal{L}(\mathrm{e}^{at})(x) = \frac{x}{x - a} \to 0$, limite de $\mathrm{e}^{at}$. En revanche, $x\,\mathcal{L}(\sin\omega t)(x) \to 0$ alors que $\sin\omega t$ n'a pas de limite : la réciproque du théorème de la valeur finale est fausse.
- id: "mp-13-22"
  feuille: "f-mp-13"
  numero: 22
  partie: "Continuité d'une intégrale à paramètre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: ["continuité d'une intégrale à paramètre", "continuité sous l'intégrale", "dérivation sous l'intégrale", transformée de Fourier]
  noeuds: [gd-schwarz, fo-transformee]
  notions: []
  source: "Feuille d'exercices #15 (Prost), exercice 3 ; BibM@th, Intégrales impropres, exercice 40"
  page_enonce: 5
  page_corrige: 15
  enonce: |
    *Transformée de Fourier.* Soit $f : \mathbb{R} \to \mathbb{C}$ continue et intégrable sur $\mathbb{R}$, et $\displaystyle \hat{f}(x) = \int_{-\infty}^{+\infty} f(t)\mathrm{e}^{-\mathrm{i} xt}\,\mathrm{d} t$.

    **1.** Rappeler pourquoi $\hat{f}$ est définie, continue et bornée sur $\mathbb{R}$.

    **2.** On suppose de plus $f$ de classe $\mathcal{C}^{1}$, avec $f'$ intégrable sur $\mathbb{R}$. Montrer que $f$ tend vers $0$ en $\pm\infty$, puis que $\mathrm{i} x\hat{f}(x) = \widehat{f'}(x)$ pour tout $x$. En déduire que $\hat{f}(x) \to 0$ quand $|x| \to +\infty$.

    **3.** On suppose de plus que $t \mapsto tf(t)$ est intégrable sur $\mathbb{R}$. Montrer que $\hat{f}$ est de classe $\mathcal{C}^{1}$, et exprimer sa dérivée comme une transformée de Fourier.

    **4.** Calculer $\hat{f}$ pour $f(t) = \mathrm{e}^{-|t|}$ et pour $f(t) = \mathrm{e}^{-t^{2}/2}$.
  corrige: |
    La transformée de Fourier échange régularité et décroissance : la dérivabilité de $f$ fait décroître $\hat{f}$, et la décroissance de $f$ rend $\hat{f}$ dérivable.

    **1.** Pour tout $t$, $x \mapsto f(t)\mathrm{e}^{-\mathrm{i} xt}$ est continue, et $|f(t)\mathrm{e}^{-\mathrm{i} xt}| = |f(t)|$, intégrable et indépendante de $x$ : c'est le théorème 4 avec une domination globale (exemple de la section 13.4 du cours). 
    $$\boxed{\hat{f} \text{ est continue sur } \mathbb{R} \text{ et } |\hat{f}(x)| \leqslant \int_{\mathbb{R}} |f|}$$

    **2.** Comme $f(x) = f(0) + \int_{0}^{x} f'$ et que $f'$ est intégrable, $f$ a des limites finies en $\pm\infty$ ; elles sont nulles, puisque $f$ est intégrable (exercice 5 de la feuille du chapitre 12). Une intégration par parties sur $[-A, B]$ donne 
    $$\int_{-A}^{B} f'(t)\mathrm{e}^{-\mathrm{i} xt}\,\mathrm{d} t = \Big[f(t)\mathrm{e}^{-\mathrm{i} xt}\Big]_{-A}^{B} + \mathrm{i} x\int_{-A}^{B} f(t)\mathrm{e}^{-\mathrm{i} xt}\,\mathrm{d} t,$$
     et le crochet tend vers $0$. On obtient $\widehat{f'}(x) = \mathrm{i} x\hat{f}(x)$, puis $|\hat{f}(x)| \leqslant \frac{1}{|x|}\int_{\mathbb{R}} |f'|$ pour $x \neq 0$. 
    $$\boxed{\mathrm{i} x\hat{f}(x) = \widehat{f'}(x), \qquad \hat{f}(x) \xrightarrow[|x| \to +\infty]{} 0}$$

    **3.** La dérivée partielle $\frac{\partial}{\partial x}\big(f(t)\mathrm{e}^{-\mathrm{i} xt}\big) = -\mathrm{i} tf(t)\mathrm{e}^{-\mathrm{i} xt}$ est dominée par $|tf(t)|$, intégrable : le théorème 5 s'applique. 
    $$\boxed{\hat{f}' = \widehat{g}, \qquad g(t) = -\mathrm{i} t\,f(t)}$$

    **4.** Pour $f(t) = \mathrm{e}^{-|t|}$, la partie impaire disparaît et $\hat{f}(x) = 2\mathcal{R}e\int_{0}^{+\infty} \mathrm{e}^{-(1 + \mathrm{i} x)t}\,\mathrm{d} t = 2\mathcal{R}e\frac{1}{1 + \mathrm{i} x}$. Pour $f(t) = \mathrm{e}^{-t^{2}/2}$, le changement de variable $t = \sqrt{2}s$ ramène à la formule du cours, avec $\sqrt{2}x$ à la place de $x$. 
    $$\boxed{\widehat{\mathrm{e}^{-|t|}}(x) = \frac{2}{1 + x^{2}}, \qquad \widehat{\mathrm{e}^{-t^{2}/2}}(x) = \sqrt{2\pi}\,\mathrm{e}^{-x^{2}/2}}$$
     La seconde fonction est, à un facteur près, sa propre transformée de Fourier. La première, qui n'est pas dérivable en $0$, a une transformée qui ne décroît qu'en $\frac{1}{x^{2}}$.
- id: "mp-13-23"
