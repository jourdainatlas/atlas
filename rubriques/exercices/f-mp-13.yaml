  enonce: |
    *Perspective : l'indice d'un point par rapport à un lacet.* Soit $\gamma : [0, 1] \to \mathbb{C}$ de classe $\mathcal{C}^{1}$ telle que $\gamma(0) = \gamma(1)$, et $\Omega = \mathbb{C} \setminus \gamma([0, 1])$. Pour $z \in \Omega$, on pose 
    $$I(\gamma, z) = \frac{1}{2\mathrm{i}\pi}\int_{0}^{1} \frac{\gamma'(t)}{\gamma(t) - z}\,\mathrm{d} t.$$

    **1.** Montrer que $I(\gamma, z) \in \mathbb{Z}$. On pourra considérer $\displaystyle x \mapsto \big(\gamma(x) - z\big)\exp\Big(-\int_{0}^{x} \frac{\gamma'(t)}{\gamma(t) - z}\,\mathrm{d} t\Big)$.

    **2.** Montrer que $\Omega$ est un ouvert de $\mathbb{C}$, et que $z \mapsto I(\gamma, z)$ est continue sur $\Omega$, en appliquant le théorème 4 avec un paramètre dans $\mathbb{C}$.

    **3.** En déduire que $I(\gamma, \cdot)$ est constante sur toute partie connexe par arcs de $\Omega$ (chapitre 5).

    **4.** Montrer que $I(\gamma, z) = 0$ pour $|z|$ assez grand.

    **5.** Calculer $I(\gamma, z)$ pour $\gamma(t) = \mathrm{e}^{2\mathrm{i}\pi t}$, selon que $|z| < 1$ ou $|z| > 1$, et interpréter.
  corrige: |
    L'indice compte le nombre de tours que fait le lacet autour de $z$. Le point clé est qu'une fonction continue à valeurs entières sur une partie connexe par arcs est constante : la continuité vient du théorème 4, avec un paramètre complexe.

    **1.** Posons $F(x) = \int_{0}^{x} \frac{\gamma'(t)}{\gamma(t) - z}\,\mathrm{d} t$ et $\Phi(x) = (\gamma(x) - z)\mathrm{e}^{-F(x)}$. Alors 
    $$\Phi'(x) = \gamma'(x)\mathrm{e}^{-F(x)} - (\gamma(x) - z)\,\frac{\gamma'(x)}{\gamma(x) - z}\,\mathrm{e}^{-F(x)} = 0,$$
     donc $\Phi(1) = \Phi(0)$, soit $(\gamma(1) - z)\mathrm{e}^{-F(1)} = \gamma(0) - z$. Comme $\gamma(1) = \gamma(0) \neq z$, on obtient $\mathrm{e}^{-F(1)} = 1$, d'où $F(1) \in 2\mathrm{i}\pi\mathbb{Z}$ (chapitre 4 de MPSI). 
    $$\boxed{I(\gamma, z) \in \mathbb{Z}}$$

    **2.** L'image $\gamma([0, 1])$ est compacte, comme image continue d'un segment, donc fermée : $\Omega$ est ouvert (chapitre 5). Soit $z_{0} \in \Omega$ et $\delta > 0$ la distance de $z_{0}$ à $\gamma([0, 1])$. Pour $z$ dans la boule fermée $B = \bar{B}(z_{0}, \frac{\delta}{2})$, on a $|\gamma(t) - z| \geqslant \frac{\delta}{2}$, d'où $\Big|\frac{\gamma'(t)}{\gamma(t) - z}\Big| \leqslant \frac{2\lVert \gamma' \rVert_{\infty}}{\delta}$, constante intégrable sur $[0, 1]$. La fonction intégrée est continue par rapport à $z$, et le théorème 4, appliqué avec la partie $B$ de l'espace normé $\mathbb{C}$ de dimension finie, montre que $I(\gamma, \cdot)$ est continue sur $B$, voisinage de $z_{0}$. 
    $$\boxed{I(\gamma, \cdot) \text{ est continue sur l'ouvert } \Omega}$$

    **3.** Soit $C \subset \Omega$ connexe par arcs, $z_{1}$, $z_{2} \in C$ et $c : [0, 1] \to C$ un chemin continu de $z_{1}$ à $z_{2}$. La fonction $I(\gamma, c(\cdot))$ est continue sur $[0, 1]$ et à valeurs entières ; d'après le théorème des valeurs intermédiaires, elle est constante. 
    $$\boxed{I(\gamma, \cdot) \text{ est constante sur toute partie connexe par arcs de } \Omega}$$

    **4.** Soit $R = \max |\gamma|$. Pour $|z| > R$, $|\gamma(t) - z| \geqslant |z| - R$, d'où $|I(\gamma, z)| \leqslant \frac{\lVert \gamma' \rVert_{\infty}}{2\pi(|z| - R)} < 1$ dès que $|z|$ est assez grand. Un entier de module strictement inférieur à $1$ est nul. 
    $$\boxed{I(\gamma, z) = 0 \text{ pour } |z| \text{ assez grand}}$$

    **5.** Pour $\gamma(t) = \mathrm{e}^{2\mathrm{i}\pi t}$ et $z = 0$, $\frac{\gamma'(t)}{\gamma(t)} = 2\mathrm{i}\pi$, donc $I(\gamma, 0) = 1$. Le disque ouvert $|z| < 1$ et l'extérieur $|z| > 1$ sont connexes par arcs ; le premier contient $0$, le second contient des points de module arbitrairement grand. 
    $$\boxed{I(\gamma, z) = 1 \text{ si } |z| < 1, \qquad I(\gamma, z) = 0 \text{ si } |z| > 1}$$
     Le cercle parcouru une fois dans le sens direct fait un tour autour de chaque point intérieur, et aucun autour des points extérieurs. Cet indice est le point de départ de la théorie de Cauchy des fonctions holomorphes.
