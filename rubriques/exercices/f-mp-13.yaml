  noeuds: [gd-schwarz]
  notions: []
  source: "TD 7 Intégrales généralisées (Sainte-Geneviève), exercice « Continuité des translations dans L^1 »"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    *Continuité des translations.* Soit $f : \mathbb{R} \to \mathbb{C}$ continue et intégrable sur $\mathbb{R}$. Pour $x \in \mathbb{R}$, on pose $\displaystyle \varphi(x) = \int_{-\infty}^{+\infty} |f(t + x) - f(t)|\,\mathrm{d} t$.

    **1.** Montrer que $\varphi$ est bien définie, paire, et que $\varphi(x) \leqslant 2\displaystyle \int_{\mathbb{R}} |f|$ pour tout $x$.

    **2.** Soit $\varepsilon > 0$. Montrer qu'il existe $A > 0$ tel que $\displaystyle \int_{|t| \geqslant A} |f(t)|\,\mathrm{d} t \leqslant \varepsilon$.

    **3.** Montrer que $\varphi(x) \to 0$ quand $x \to 0$. Pourquoi ne peut-on pas appliquer directement le théorème 4 sur $\mathbb{R}$ ?

    **4.** Montrer que $\varphi(x) \to 2\displaystyle \int_{\mathbb{R}} |f|$ quand $x \to +\infty$.
  corrige: |
    C'est la situation (b) du cours, celle de la masse qui « s'en va » : les translatées $t \mapsto f(t + x)$ ne sont pas dominées par une même fonction intégrable, et il faut couper les queues avant de passer à la limite.

    **1.** On a $|f(t + x) - f(t)| \leqslant |f(t + x)| + |f(t)|$, et $\int_{\mathbb{R}} |f(t + x)|\,\mathrm{d} t = \int_{\mathbb{R}} |f|$ par translation. Le changement de variable $s = t - x$ donne $\varphi(-x) = \int_{\mathbb{R}} |f(s) - f(s + x)|\,\mathrm{d} s = \varphi(x)$. 
    $$\boxed{\varphi \text{ est définie et paire, et } 0 \leqslant \varphi(x) \leqslant 2\int_{\mathbb{R}} |f|}$$

    **2.** Par définition de la convergence de $\int_{\mathbb{R}} |f|$, $\int_{-A}^{A} |f| \to \int_{\mathbb{R}} |f|$ quand $A \to +\infty$, donc $\int_{|t| \geqslant A} |f| \to 0$.

    **3.** Soit $\varepsilon > 0$ et $A$ comme dans la question 2. Pour $|x| \leqslant 1$, on sépare $\mathbb{R}$ en $J = [-A - 1, A + 1]$ et son complémentaire. Hors de $J$, $|t + x| \geqslant A$ et $|t| \geqslant A$, d'où 
    $$\int_{\mathbb{R} \setminus J} |f(t + x) - f(t)|\,\mathrm{d} t \leqslant \int_{|s| \geqslant A} |f(s)|\,\mathrm{d} s + \int_{|t| \geqslant A} |f(t)|\,\mathrm{d} t \leqslant 2\varepsilon.$$
     Sur le segment $J$, $f(t + x) \to f(t)$ quand $x \to 0$, et $|f(t + x) - f(t)| \leqslant 2\max_{[-A - 2, A + 2]} |f|$, constante intégrable sur $J$. La proposition 1 montre que l'intégrale sur $J$ tend vers $0$. Ainsi $\varphi(x) \leqslant 3\varepsilon$ pour $|x|$ assez petit. 
    $$\boxed{\varphi(x) \xrightarrow[x \to 0]{} 0}$$
     Le théorème 4 ne s'applique pas directement sur $\mathbb{R}$, car aucune fonction intégrable ne majore toutes les translatées $|f(\cdot + x)|$ pour $|x| \leqslant 1$ : si $f$ présente des pics étroits de plus en plus éloignés, la fonction $\sup_{|x| \leqslant 1} |f(t + x)|$ vaut la hauteur du pic sur un intervalle de longueur $2$ autour de chacun, et elle n'est pas intégrable dès que la série des hauteurs diverge, même si celle des aires converge.

    **4.** Soit $\varepsilon$ et $A$ comme ci-dessus, et $x > 2A$. Les segments $[-A, A]$ et $[-A - x, A - x]$ sont disjoints. Sur le premier, $|f(t + x) - f(t)| \geqslant |f(t)| - |f(t + x)|$, et $\int_{-A}^{A} |f(t + x)|\,\mathrm{d} t = \int_{x - A}^{x + A} |f| \leqslant \varepsilon$, car $x - A > A$. Sur le second, on minore de même par $|f(t + x)| - |f(t)|$, et $\int_{-A - x}^{A - x} |f| \leqslant \varepsilon$. Ainsi 
    $$\varphi(x) \geqslant 2\int_{-A}^{A} |f| - 2\varepsilon \geqslant 2\int_{\mathbb{R}} |f| - 4\varepsilon.$$
     Avec la majoration de la question 1 : 
    $$\boxed{\varphi(x) \xrightarrow[x \to +\infty]{} 2\int_{\mathbb{R}} |f|}$$
     Pour $x$ grand, $f$ et sa translatée n'ont presque plus de masse en commun, et leurs aires s'additionnent.
