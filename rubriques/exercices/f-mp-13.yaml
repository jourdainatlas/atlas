  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 41 ; Feuille d'exercices #02 (Prost), exercice 51"
  page_enonce: 7
  page_corrige: 21
  enonce: |
    *La moyenne géométrique.* Soit $f : [0, 1] \to \mathbb{R}$ continue, à valeurs strictement positives. Pour $\alpha \geqslant 0$, on pose $\displaystyle F(\alpha) = \int_{0}^{1} f(t)^{\alpha}\,\mathrm{d} t$.

    **1.** Montrer que $F$ est de classe $\mathcal{C}^{1}$ sur $[0, +\infty[$, et calculer $F'(0)$.

    **2.** En déduire que $\displaystyle \Big(\int_{0}^{1} f(t)^{\alpha}\,\mathrm{d} t\Big)^{1/\alpha} \xrightarrow[\alpha \to 0^{+}]{} \exp\Big(\int_{0}^{1} \ln f(t)\,\mathrm{d} t\Big)$.

    **3.** Que donne ce résultat pour $f(t) = 1 + t$ ? Vérifier numériquement avec $\alpha = 10^{-2}$.
  corrige: |
    Le résultat s'obtient en dérivant $F$ en $0$, c'est-à-dire en dérivant sous l'intégrale la fonction $\alpha \mapsto f(t)^{\alpha} = \mathrm{e}^{\alpha\ln f(t)}$.

    **1.** La fonction $f$, continue et strictement positive sur le segment $[0, 1]$, y prend ses valeurs dans un segment $[m, M]$ avec $m > 0$. La dérivée partielle $\ln f(t)\cdot f(t)^{\alpha}$ est, pour $\alpha \in [0, b]$, majorée par $\max(|\ln m|, |\ln M|)\cdot\max(1, M^{b})$, constante intégrable sur $[0, 1]$. Le théorème 5, sur chaque segment $[0, b]$, donne : 
    $$\boxed{F \in \mathcal{C}^{1}([0, +\infty[), \qquad F'(0) = \int_{0}^{1} \ln f(t)\,\mathrm{d} t}$$

    **2.** Comme $F(0) = 1$, on a $\frac{\ln F(\alpha)}{\alpha} = \frac{\ln F(\alpha) - \ln F(0)}{\alpha} \to (\ln F)'(0) = \frac{F'(0)}{F(0)}$, et il reste à composer par l'exponentielle. 
    $$\boxed{\Big(\int_{0}^{1} f(t)^{\alpha}\,\mathrm{d} t\Big)^{1/\alpha} \xrightarrow[\alpha \to 0^{+}]{} \exp\Big(\int_{0}^{1} \ln f(t)\,\mathrm{d} t\Big)}$$
     La quantité de gauche est la « moyenne d'ordre $\alpha$ » de $f$ ; sa limite en $0$ est la moyenne géométrique.

    **3.** Pour $f(t) = 1 + t$, $\int_{0}^{1} \ln(1 + t)\,\mathrm{d} t = 2\ln 2 - 1$, d'où la limite $\frac{4}{\mathrm{e}} \approx 1{,}47152$. Pour $\alpha = 10^{-2}$, la quantité vaut $\Big(\frac{2^{1{,}01} - 1}{1{,}01}\Big)^{100} \approx 1{,}47181$. 
    $$\boxed{\lim\limits_{\alpha \to 0^{+}} \Big(\int_{0}^{1} (1 + t)^{\alpha}\,\mathrm{d} t\Big)^{1/\alpha} = \frac{4}{\mathrm{e}}}$$
- id: "mp-13-33"
