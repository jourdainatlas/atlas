  enonce: |
    Soit $\displaystyle f(x) = \int_{0}^{+\infty} \frac{\sin(xt)}{t}\,\mathrm{e}^{-t}\,\mathrm{d} t$.

    **1.** Montrer que $f$ est définie sur $\mathbb{R}$.

    **2.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et calculer $f'(x)$.

    **3.** En déduire une expression simple de $f(x)$.
  corrige: |
    La dérivée partielle par rapport à $x$ fait disparaître le facteur $\frac{1}{t}$, et l'intégrale obtenue se calcule par l'exponentielle complexe.

    **1.** La fonction $t \mapsto \frac{\sin(xt)}{t}\mathrm{e}^{-t}$ se prolonge par continuité en $0$, et $\big|\frac{\sin(xt)}{t}\big| \leqslant |x|$ ; elle est donc majorée en module par $|x|\mathrm{e}^{-t}$, intégrable.

    **2.** La dérivée partielle par rapport à $x$ vaut $\cos(xt)\mathrm{e}^{-t}$, majorée en module par $\mathrm{e}^{-t}$, intégrable et indépendante de $x$ : le théorème 5 s'applique sur $\mathbb{R}$, et 
    $$f'(x) = \int_{0}^{+\infty} \cos(xt)\mathrm{e}^{-t}\,\mathrm{d} t = \mathcal{R}e\int_{0}^{+\infty} \mathrm{e}^{-(1 - \mathrm{i} x)t}\,\mathrm{d} t = \mathcal{R}e\frac{1}{1 - \mathrm{i} x} = \frac{1}{1 + x^{2}}.$$

    $$\boxed{f \in \mathcal{C}^{1}(\mathbb{R}), \qquad f'(x) = \frac{1}{1 + x^{2}}}$$

    **3.** Comme $f(0) = 0$ : 
    $$\boxed{f(x) = \operatorname{Arctan} x \quad\text{pour tout } x \in \mathbb{R}}$$
     En particulier, $f(x) \to \frac{\pi}{2}$ quand $x \to +\infty$. Pour $x > 0$, le changement de variable $u = xt$ donne 
    $$f(x) = \int_{0}^{+\infty} \frac{\sin u}{u}\,\mathrm{e}^{-u/x}\,\mathrm{d} u,$$
     ce qui est cohérent avec la valeur de l'intégrale de Dirichlet (proposition 3 du cours).
- id: "mp-13-26"
