  enonce: |
    *Le rêve du deuxième année.* Montrer que 
    $$\int_{0}^{1} \frac{\mathrm{d} x}{x^{x}} = \sum_{n = 1}^{+\infty} \frac{1}{n^{n}} \qquad\text{et}\qquad \int_{0}^{1} x^{x}\,\mathrm{d} x = \sum_{n = 1}^{+\infty} \frac{(-1)^{n - 1}}{n^{n}}.$$
     Combien de termes de la seconde série faut-il sommer pour obtenir une valeur approchée de l'intégrale à $10^{-6}$ près ?
  corrige: |
    On développe l'exponentielle en série, puis l'on calcule chaque terme à l'aide de la fonction $\Gamma$.

    Pour $x \in ]0, 1]$, $x^{-x} = \mathrm{e}^{-x\ln x} = \sum_{n \geqslant 0} \frac{(-x\ln x)^{n}}{n!}$, et les termes sont positifs, car $-x\ln x \geqslant 0$. Le changement de variable $x = \mathrm{e}^{-u}$ donne 
    $$\int_{0}^{1} x^{n}(-\ln x)^{n}\,\mathrm{d} x = \int_{0}^{+\infty} \mathrm{e}^{-(n + 1)u}u^{n}\,\mathrm{d} u = \frac{n!}{(n + 1)^{n + 1}},$$
     la dernière égalité par le changement de variable $v = (n + 1)u$ et $\Gamma(n + 1) = n!$. Le théorème 2 donne 
    $$\boxed{\int_{0}^{1} \frac{\mathrm{d} x}{x^{x}} = \sum_{n = 0}^{+\infty} \frac{1}{(n + 1)^{n + 1}} = \sum_{n = 1}^{+\infty} \frac{1}{n^{n}} \approx 1{,}29129}$$
     De même, $x^{x} = \sum_{n \geqslant 0} (-1)^{n}\frac{(-x\ln x)^{n}}{n!}$. Les termes ne sont plus positifs, mais la série des intégrales des valeurs absolues est celle que l'on vient de sommer, convergente : le théorème 3 s'applique. 
    $$\boxed{\int_{0}^{1} x^{x}\,\mathrm{d} x = \sum_{n = 1}^{+\infty} \frac{(-1)^{n - 1}}{n^{n}} \approx 0{,}78343}$$
     La série alternée a des termes de valeur absolue décroissante vers $0$ : l'erreur commise en s'arrêtant au rang $N$ est majorée par $\frac{1}{(N + 1)^{N + 1}}$. Pour $N = 6$, ce majorant vaut $\frac{1}{7^{7}} \approx 1{,}2 \cdot 10^{-6}$, insuffisant ; pour $N = 7$, il vaut $\frac{1}{8^{8}} \approx 6 \cdot 10^{-8}$. 
    $$\boxed{\text{sept termes suffisent}}$$
- id: "mp-13-12"
