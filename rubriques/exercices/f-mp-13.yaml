  source: "Feuille d'exercices #02 (Prost), exercice 50"
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on pose $\displaystyle I_{n} = \int_{0}^{+\infty} \frac{\sin(nt)}{1 + n^{4}t^{3}}\,\mathrm{d} t$.

    **1.** Montrer que $I_{n}$ est bien défini et que $I_{n} \to 0$.

    **2.** Montrer que $I_{n} \underset{n \to +\infty}{\sim} \dfrac{C}{n^{5/3}}$, où $\displaystyle C = \int_{0}^{+\infty} \frac{v}{1 + v^{3}}\,\mathrm{d} v$, et calculer $C$ à l'aide de l'exercice 14 de la feuille du chapitre 12.
  corrige: |
    On cherche l'échelle de $t$ sur laquelle se concentre la masse : le dénominateur devient grand dès que $n^{4}t^{3} \gg 1$, c'est-à-dire $t \gg n^{-4/3}$, et à cette échelle $\sin(nt)$ est petit, de l'ordre de $n \cdot n^{-4/3} = n^{-1/3}$.

    **1.** La fonction intégrée est continue sur $[0, +\infty[$ et majorée en module par $\frac{1}{1 + n^{4}t^{3}}$, négligeable devant $\frac{1}{t^{2}}$ en $+\infty$ : $I_{n}$ est défini. Pour $n \geqslant 1$, elle est dominée par $\frac{1}{1 + t^{3}}$, intégrable, et pour $t > 0$ elle tend vers $0$. Le théorème 1 donne $I_{n} \to 0$. 
    $$\boxed{I_{n} \xrightarrow[n \to +\infty]{} 0}$$

    **2.** Le changement de variable $t = n^{-4/3}v$ donne 
    $$n^{5/3}I_{n} = \int_{0}^{+\infty} \frac{n^{1/3}\sin\big(n^{-1/3}v\big)}{1 + v^{3}}\,\mathrm{d} v.$$
     Pour $v \geqslant 0$, $n^{1/3}\sin\big(n^{-1/3}v\big) \to v$, et l'inégalité $|\sin s| \leqslant s$ pour $s \geqslant 0$ fournit la domination par $\frac{v}{1 + v^{3}}$, intégrable sur $[0, +\infty[$ car équivalente à $\frac{1}{v^{2}}$ en $+\infty$. Ainsi $n^{5/3}I_{n} \to C$. Enfin, l'exercice 14 de la feuille du chapitre 12 a montré que $\displaystyle \int_{0}^{+\infty} \frac{v\,\mathrm{d} v}{1 + v^{3}} = \int_{0}^{+\infty} \frac{\mathrm{d} v}{1 + v^{3}} = \frac{2\pi}{3\sqrt{3}}$. 
    $$\boxed{I_{n} \underset{n \to +\infty}{\sim} \frac{2\pi}{3\sqrt{3}}\,\frac{1}{n^{5/3}}}$$
     La convergence est très lente : la domination par $\frac{v}{1 + v^{3}}$ est peu serrée, car le remplacement de $\sin s$ par $s$ n'est légitime que pour $v \ll n^{1/3}$. Numériquement, $n^{5/3}I_{n}$ vaut environ $0{,}887$ pour $n = 10$ et $0{,}997$ pour $n = 40$, pour une limite d'environ $1{,}209$.
- id: "mp-13-10"
  feuille: "f-mp-13"
  numero: 10
  partie: "Le théorème de convergence dominée"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [convergence dominée, équivalents]
  noeuds: [m-convergence-dominee, ar-asymptotique]
