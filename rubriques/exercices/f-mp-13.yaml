  noeuds: [gd-schwarz, ds-parametre]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 42"
  page_enonce: 7
  page_corrige: 20
  enonce: |
    *Division des fonctions régulières.* Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{\infty}$.

    **1.** On suppose $f(0) = 0$. Montrer que, pour $x \neq 0$, $\displaystyle \frac{f(x)}{x} = \int_{0}^{1} f'(tx)\,\mathrm{d} t$, et en déduire que $x \mapsto \frac{f(x)}{x}$ se prolonge en une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.

    **2.** On suppose $f(0) = f'(0) = \cdots = f^{(n - 1)}(0) = 0$. Montrer que $x \mapsto \frac{f(x)}{x^{n}}$ se prolonge en une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.

    **3.** Application : montrer que $x \mapsto \frac{1 - \cos x}{x^{2}}$ se prolonge en une fonction de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, et donner la valeur de son prolongement en $0$.
  corrige: |
    La formule intégrale exprime $\frac{f(x)}{x}$ comme une intégrale à paramètre sur le segment $[0, 1]$, à laquelle le théorème 6 s'applique sans difficulté.

    **1.** Le changement de variable $u = tx$ dans $f(x) = f(0) + \int_{0}^{x} f'(u)\,\mathrm{d} u$ donne $f(x) = x\int_{0}^{1} f'(tx)\,\mathrm{d} t$. La fonction $g : x \mapsto \int_{0}^{1} f'(tx)\,\mathrm{d} t$ est définie sur tout $\mathbb{R}$, égale à $\frac{f(x)}{x}$ pour $x \neq 0$, et à $f'(0)$ en $0$. Les dérivées partielles $\frac{\partial^{k}}{\partial x^{k}}f'(tx) = t^{k}f^{(k + 1)}(tx)$ sont, pour $|x| \leqslant b$ et $t \in [0, 1]$, majorées par $\max_{[-b, b]} |f^{(k + 1)}|$, constante intégrable sur $[0, 1]$. 
    $$\boxed{x \mapsto \frac{f(x)}{x} \text{ se prolonge en } g \in \mathcal{C}^{\infty}(\mathbb{R}), \quad g^{(k)}(0) = \frac{f^{(k + 1)}(0)}{k + 1}}$$

    **2.** On raisonne par récurrence sur $n$. La fonction $g$ de la question 1 vérifie $g^{(k)}(0) = \frac{f^{(k + 1)}(0)}{k + 1} = 0$ pour $k \leqslant n - 2$ : on lui applique l'hypothèse de récurrence au rang $n - 1$, et $\frac{g(x)}{x^{n - 1}} = \frac{f(x)}{x^{n}}$. 
    $$\boxed{x \mapsto \frac{f(x)}{x^{n}} \text{ se prolonge en une fonction de classe } \mathcal{C}^{\infty} \text{ sur } \mathbb{R}}$$

    **3.** Pour $f(x) = 1 - \cos x$, on a $f(0) = f'(0) = 0$, et la question 2 s'applique avec $n = 2$. La valeur en $0$ du prolongement est la limite de $\frac{1 - \cos x}{x^{2}}$, soit $\frac{f''(0)}{2}$. 
    $$\boxed{\text{prolongement de classe } \mathcal{C}^{\infty}, \text{ de valeur } \frac{1}{2} \text{ en } 0}$$
- id: "mp-13-32"
