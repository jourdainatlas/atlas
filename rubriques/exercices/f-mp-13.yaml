  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 37"
  page_enonce: 8
  page_corrige: 21
  enonce: |
    *Une fonction de Bessel.* Pour $x \in \mathbb{R}$, on pose $\displaystyle f(x) = \int_{0}^{\pi} \cos(x\sin\theta)\,\mathrm{d}\theta$.

    **1.** Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$.

    **2.** Montrer que $f$ est solution de l'équation différentielle $xy'' + y' + xy = 0$.

    **3.** Montrer que $f$ est développable en série entière, et calculer ce développement de deux façons : à l'aide de l'équation différentielle, puis par intégration terme à terme.
  corrige: |
    L'intégrale porte sur un segment et la fonction intégrée est bornée avec toutes ses dérivées : la régularité est immédiate, et l'intérêt est dans l'équation différentielle et le développement en série.

    **1.** La dérivée $k$-ième de $x \mapsto \cos(x\sin\theta)$ vaut $\sin^{k}\theta\,\cos\big(x\sin\theta + k\frac{\pi}{2}\big)$, majorée en module par $1$, constante intégrable sur $[0, \pi]$ : le théorème 6 s'applique. 
    $$\boxed{f \in \mathcal{C}^{\infty}(\mathbb{R})}$$

    **2.** On a $f'(x) = -\int_{0}^{\pi} \sin\theta\,\sin(x\sin\theta)\,\mathrm{d}\theta$ et $f''(x) + f(x) = \int_{0}^{\pi} \cos^{2}\theta\,\cos(x\sin\theta)\,\mathrm{d}\theta$. Comme la dérivée de $\theta \mapsto \sin(x\sin\theta)$ est $x\cos\theta\cos(x\sin\theta)$, une intégration par parties donne 
    $$x\big(f''(x) + f(x)\big) = \Big[\cos\theta\,\sin(x\sin\theta)\Big]_{0}^{\pi} + \int_{0}^{\pi} \sin\theta\,\sin(x\sin\theta)\,\mathrm{d}\theta = -f'(x).$$

    $$\boxed{xf'' + f' + xf = 0}$$

    **3.** *Par intégration terme à terme.* Pour $x$ fixé, $\cos(x\sin\theta) = \sum_{n \geqslant 0} \frac{(-1)^{n}x^{2n}\sin^{2n}\theta}{(2n)!}$, série qui converge normalement sur $[0, \pi]$, puisque ses termes sont majorés par $\frac{|x|^{2n}}{(2n)!}$ : on peut intégrer terme à terme sur le segment (chapitre 8). Les intégrales de Wallis donnent $\int_{0}^{\pi} \sin^{2n}\theta\,\mathrm{d}\theta = \pi\frac{(2n)!}{4^{n}(n!)^{2}}$, d'où le développement, valable pour tout réel $x$. En particulier, $f$ est développable en série entière, de rayon infini.

    *Par l'équation différentielle.* Si $f(x) = \sum a_{k}x^{k}$, l'équation donne $\sum_{k \geqslant 1} (k^{2}a_{k} + a_{k - 2})x^{k - 1} = 0$, avec $a_{-1} = 0$, d'où $a_{1} = 0$ et $k^{2}a_{k} = -a_{k - 2}$. Les coefficients impairs sont nuls, et $a_{2n} = \frac{(-1)^{n}a_{0}}{4^{n}(n!)^{2}}$ avec $a_{0} = f(0) = \pi$. Les deux calculs concordent. 
    $$\boxed{f(x) = \pi\sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{4^{n}(n!)^{2}}\,x^{2n}}$$
     La fonction $\frac{f}{\pi}$ est la fonction de Bessel $J_{0}$, qui intervient dans les vibrations d'une membrane circulaire.
- id: "mp-13-34"
  feuille: "f-mp-13"
  numero: 34
  partie: "Dérivation d'une intégrale à paramètre"
  etoiles: 3
  types: [Démonstration]
  mots_cles: ["dérivation d'une intégrale à paramètre", "continuité sous l'intégrale", "dérivation sous l'intégrale"]
  noeuds: [gd-schwarz, ds-parametre]
  notions: []
  source: "Feuille d'exercices #15 (Prost), exercice 5 ; BibM@th, Fonctions définies par une intégrale, exercices 26 et 29"
  page_enonce: 8
  page_corrige: 22
  enonce: |
    *L'intégrale de Dirichlet, autrement.* Pour $x \geqslant 0$, on pose 
    $$\varphi(x) = \int_{0}^{+\infty} \frac{\mathrm{e}^{-xt}}{1 + t^{2}}\,\mathrm{d} t \qquad\text{et}\qquad \psi(x) = \int_{0}^{+\infty} \frac{\sin t}{x + t}\,\mathrm{d} t.$$

    **1.** Montrer que ces deux fonctions sont bien définies sur $[0, +\infty[$.

    **2.** Exprimer $\psi(x)$ sous la forme $a(x)\cos x + b(x)\sin x$, avec $a(x)$ et $b(x)$ définis par des intégrales sur $[x, +\infty[$.

    **3.** Montrer que $\varphi$ et $\psi$ sont continues sur $[0, +\infty[$, et qu'elles tendent vers $0$ en $+\infty$.

    **4.** Montrer que $\varphi$ et $\psi$ sont de classe $\mathcal{C}^{2}$ sur $]0, +\infty[$, et solutions de l'équation différentielle $y'' + y = \frac{1}{x}$.

    **5.** En déduire que $\varphi = \psi$, puis la valeur de $\displaystyle \int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t$.
  corrige: |
    Les deux fonctions sont solutions de la même équation différentielle et tendent vers $0$ en $+\infty$ : elles sont donc égales, et l'égalité en $0$ donne l'intégrale de Dirichlet. La difficulté porte sur $\psi$, dont l'intégrale n'est que semi-convergente.

    **1.** Pour $\varphi$, la fonction intégrée est majorée par $\frac{1}{1 + t^{2}}$. Pour $\psi$, l'intégration par parties 
    $$\int_{0}^{A} \frac{\sin t}{x + t}\,\mathrm{d} t = \Big[\frac{-\cos t}{x + t}\Big]_{0}^{A} - \int_{0}^{A} \frac{\cos t}{(x + t)^{2}}\,\mathrm{d} t$$
     montre la convergence pour $x > 0$, puisque $\frac{\cos t}{(x + t)^{2}}$ est intégrable ; pour $x = 0$, c'est l'intégrale de Dirichlet, convergente.

    **2.** Le changement de variable $u = x + t$ et la formule $\sin(u - x) = \sin u\cos x - \cos u\sin x$ donnent, les deux intégrales obtenues étant convergentes pour $x > 0$ : 
    $$\boxed{\psi(x) = a(x)\cos x + b(x)\sin x, \qquad a(x) = \int_{x}^{+\infty} \frac{\sin u}{u}\,\mathrm{d} u, \quad b(x) = -\int_{x}^{+\infty} \frac{\cos u}{u}\,\mathrm{d} u}$$

    **3.** La fonction $\varphi$ est continue sur $[0, +\infty[$ par le théorème 4, avec la domination par $\frac{1}{1 + t^{2}}$, et $0 \leqslant \varphi(x) \leqslant \int_{0}^{+\infty} \mathrm{e}^{-xt}\,\mathrm{d} t = \frac{1}{x}$. La fonction $a$ est continue sur $[0, +\infty[$, comme reste d'une intégrale convergente, et $b$ est continue sur $]0, +\infty[$. En $0$, $b(x) = -\int_{x}^{1} \frac{\cos u}{u}\,\mathrm{d} u + b(1)$, et le premier terme est majoré en module par $|\ln x|$ : donc $b(x)\sin x \to 0$, et $\psi$ est continue en $0$, avec $\psi(0) = a(0)$. Enfin, $a$ et $b$ tendent vers $0$ en $+\infty$, comme restes d'intégrales convergentes. 
    $$\boxed{\varphi \text{ et } \psi \text{ sont continues sur } [0, +\infty[ \text{ et tendent vers } 0 \text{ en } +\infty}$$

    **4.** Pour $\varphi$, les dérivées partielles $-\frac{t\,\mathrm{e}^{-xt}}{1 + t^{2}}$ et $\frac{t^{2}\mathrm{e}^{-xt}}{1 + t^{2}}$ sont majorées par $\mathrm{e}^{-at}$ pour $x \geqslant a > 0$ : le théorème 6 donne $\varphi$ de classe $\mathcal{C}^{2}$ et 
    $$\varphi''(x) + \varphi(x) = \int_{0}^{+\infty} \frac{(t^{2} + 1)\mathrm{e}^{-xt}}{1 + t^{2}}\,\mathrm{d} t = \frac{1}{x}.$$
     Pour $\psi$, $a$ et $b$ sont de classe $\mathcal{C}^{1}$ sur $]0, +\infty[$, avec $a'(x) = -\frac{\sin x}{x}$ et $b'(x) = \frac{\cos x}{x}$. Le calcul donne, les termes en $\frac{\sin x\cos x}{x}$ se compensant, 
    $$\psi'(x) = -a(x)\sin x + b(x)\cos x, \qquad \psi''(x) = \frac{\sin^{2}x + \cos^{2}x}{x} - \psi(x).$$

    $$\boxed{\varphi'' + \varphi = \psi'' + \psi = \frac{1}{x} \quad\text{sur } ]0, +\infty[}$$

    **5.** La différence $\varphi - \psi$ est solution de $y'' + y = 0$ sur $]0, +\infty[$ : elle s'écrit $A\cos x + B\sin x$ (chapitre 6 de MPSI). Elle tend vers $0$ en $+\infty$ ; en l'évaluant en $2k\pi$ puis en $2k\pi + \frac{\pi}{2}$, on obtient $A = B = 0$. Donc $\varphi = \psi$ sur $]0, +\infty[$, puis en $0$ par continuité, et $\psi(0) = \varphi(0) = \int_{0}^{+\infty} \frac{\mathrm{d} t}{1 + t^{2}}$. 
    $$\boxed{\int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\pi}{2}}$$
     C'est la troisième démonstration de cette égalité, après celle du chapitre 12, par le lemme de Riemann-Lebesgue, et celle du cours, par l'amortissement $\mathrm{e}^{-xt}$.
- id: "mp-13-35"
  feuille: "f-mp-13"
