  source: "BibM@th, Fonctions définies par une intégrale, exercice 19 ; Feuille d'exercices #02 (Prost), exercice 57 ; question 2 composée pour la feuille"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $a$, $b > 0$. Montrer que $\displaystyle \int_{0}^{+\infty} \frac{t\,\mathrm{e}^{-at}}{1 - \mathrm{e}^{-bt}}\,\mathrm{d} t = \sum_{n = 0}^{+\infty} \frac{1}{(a + nb)^{2}}$. Que retrouve-t-on pour $a = b = 1$ ?

    **2.** Montrer que $\displaystyle \int_{0}^{+\infty} \frac{\sin t}{\mathrm{e}^{t} - 1}\,\mathrm{d} t = \sum_{n = 1}^{+\infty} \frac{1}{n^{2} + 1}$, puis calculer cette somme à l'aide de l'exercice 5 de la feuille du chapitre 11.
  corrige: |
    La fraction $\frac{1}{1 - \mathrm{e}^{-bt}}$ se développe en série géométrique pour $t > 0$ ; selon le signe des termes, on applique le théorème 2 ou le théorème 3.

    **1.** Pour $t > 0$, $\frac{t\mathrm{e}^{-at}}{1 - \mathrm{e}^{-bt}} = \sum_{n \geqslant 0} t\,\mathrm{e}^{-(a + nb)t}$, termes positifs, et $\int_{0}^{+\infty} t\,\mathrm{e}^{-ct}\,\mathrm{d} t = \frac{1}{c^{2}}$ pour $c > 0$. Le théorème 2 donne 
    $$\boxed{\int_{0}^{+\infty} \frac{t\,\mathrm{e}^{-at}}{1 - \mathrm{e}^{-bt}}\,\mathrm{d} t = \sum_{n = 0}^{+\infty} \frac{1}{(a + nb)^{2}}}$$
     Pour $a = b = 1$, la fonction intégrée est $\frac{t}{\mathrm{e}^{t} - 1}$, et l'on retrouve l'intégrale de Planck du cours, égale à $\zeta(2)$.

    **2.** La fonction $t \mapsto \frac{\sin t}{\mathrm{e}^{t} - 1}$ se prolonge par continuité en $0$, avec la valeur $1$, et elle est dominée par $2\mathrm{e}^{-t}$ pour $t \geqslant 1$ : elle est intégrable. Pour $t > 0$, $\frac{\sin t}{\mathrm{e}^{t} - 1} = \sum_{n \geqslant 1} \sin t\,\mathrm{e}^{-nt}$, termes de signe variable. Comme $|\sin t| \leqslant t$, $\int_{0}^{+\infty} |\sin t|\,\mathrm{e}^{-nt}\,\mathrm{d} t \leqslant \frac{1}{n^{2}}$, et le théorème 3 s'applique. Enfin, $\int_{0}^{+\infty} \sin t\,\mathrm{e}^{-nt}\,\mathrm{d} t = \mathcal{I}m \frac{1}{n - \mathrm{i}} = \frac{1}{n^{2} + 1}$. L'exercice 5 de la feuille du chapitre 11, pour $\alpha = 1$, donne $\pi\coth\pi = 1 + 2\sum_{n \geqslant 1} \frac{1}{1 + n^{2}}$. 
    $$\boxed{\int_{0}^{+\infty} \frac{\sin t}{\mathrm{e}^{t} - 1}\,\mathrm{d} t = \sum_{n = 1}^{+\infty} \frac{1}{n^{2} + 1} = \frac{\pi\coth\pi - 1}{2} \approx 1{,}07667}$$
- id: "mp-13-14"
  feuille: "f-mp-13"
  numero: 14
  partie: "Intégration terme à terme"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [intégration terme à terme]
  noeuds: [m-convergence-dominee, as-series]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercices 18 et 20"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    Soit $\sum a_{n}x^{n}$ une série entière telle que la série $\sum |a_{n}|\,n!$ converge.

    **1.** Montrer que le rayon de convergence de $\sum a_{n}x^{n}$ est infini. On note $f$ sa somme.

    **2.** Montrer que $\displaystyle \int_{0}^{+\infty} \mathrm{e}^{-x}f(x)\,\mathrm{d} x = \sum_{n = 0}^{+\infty} a_{n}\,n!$.

    **3.** En déduire que $\displaystyle \int_{0}^{+\infty} \cos\big(\sqrt{x}\big)\mathrm{e}^{-x}\,\mathrm{d} x = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}\,n!}{(2n)!}$.
  corrige: |
    Le facteur $\mathrm{e}^{-x}$ transforme chaque monôme $x^{n}$ en $n!$ : c'est la transformée de Laplace en $1$, et l'hypothèse sur $\sum |a_{n}|\,n!$ est exactement celle du théorème 3.

    **1.** La série $\sum |a_{n}|\,n!$ converge, donc son terme général est borné par un réel $M$. Pour tout $x$ réel, $|a_{n}x^{n}| \leqslant M\frac{|x|^{n}}{n!}$, terme général d'une série convergente. 
    $$\boxed{R = +\infty}$$

    **2.** Les fonctions $f_{n} : x \mapsto a_{n}x^{n}\mathrm{e}^{-x}$ sont intégrables sur $[0, +\infty[$, et l'intégrale de $|f_{n}|$ vaut $|a_{n}|\,\Gamma(n + 1) = |a_{n}|\,n!$. La série $\sum f_{n}$ converge simplement vers $x \mapsto \mathrm{e}^{-x}f(x)$, continue, et la série $\sum \int |f_{n}|$ converge : le théorème 3 donne le résultat. 
    $$\boxed{\int_{0}^{+\infty} \mathrm{e}^{-x}f(x)\,\mathrm{d} x = \sum_{n = 0}^{+\infty} a_{n}\,n!}$$

    **3.** Pour $x \geqslant 0$, $\cos\sqrt{x} = \sum_{n \geqslant 0} \frac{(-1)^{n}x^{n}}{(2n)!}$. Ici $|a_{n}|\,n! = \frac{n!}{(2n)!}$, terme général d'une série convergente, par exemple par la règle de d'Alembert, puisque le rapport de deux termes consécutifs vaut 
    $$\frac{n + 1}{(2n + 1)(2n + 2)} \xrightarrow[n \to +\infty]{} 0.$$

    $$\boxed{\int_{0}^{+\infty} \cos\big(\sqrt{x}\big)\mathrm{e}^{-x}\,\mathrm{d} x = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}\,n!}{(2n)!} \approx 0{,}57556}$$

    *Piège.* Sans l'hypothèse sur $\sum |a_{n}|\,n!$, l'interversion peut échouer. Pour $f(x) = \mathrm{e}^{-2x}$, dont les coefficients sont $a_{n} = \frac{(-2)^{n}}{n!}$, l'intégrale de $\mathrm{e}^{-x}f(x) = \mathrm{e}^{-3x}$ vaut $\frac{1}{3}$, alors que la série $\sum a_{n}\,n! = \sum (-2)^{n}$ diverge grossièrement.
- id: "mp-13-15"
  feuille: "f-mp-13"
  numero: 15
  partie: "Intégration terme à terme"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [intégration terme à terme]
  noeuds: [m-convergence-dominee, as-series]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercices 17 et 22"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    *Quand le théorème 3 ne s'applique pas.* Soit $a$, $b > 0$.

    **1.** Montrer que $\displaystyle \int_{0}^{1} \frac{t^{a - 1}}{1 + t^{b}}\,\mathrm{d} t = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{a + nb}$. Le théorème 3 du cours s'applique-t-il ?

    **2.** En déduire les sommes $\displaystyle \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{2n + 1}$ et $\displaystyle \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 1}$.

    **3.** Montrer que $\displaystyle \int_{1}^{+\infty} \frac{\mathrm{d} t}{1 + t^{3}} = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 2}$, et calculer cette somme.
  corrige: |
    C'est la situation de la série harmonique alternée du cours : la série des intégrales des valeurs absolues diverge, et l'on applique le théorème 1 aux sommes partielles.

    **1.** Pour $t \in ]0, 1[$, $\frac{t^{a - 1}}{1 + t^{b}} = \sum_{n \geqslant 0} (-1)^{n}t^{a - 1 + nb}$, et $\int_{0}^{1} t^{a - 1 + nb}\,\mathrm{d} t = \frac{1}{a + nb}$. La série $\sum \frac{1}{a + nb}$ diverge, car son terme général est équivalent à $\frac{1}{nb}$ : *le théorème 3 ne s'applique pas*. Les sommes partielles s'écrivent 
    $$S_{N}(t) = t^{a - 1}\,\frac{1 - (-t^{b})^{N + 1}}{1 + t^{b}}, \qquad\text{d'où}\qquad |S_{N}(t)| \leqslant 2t^{a - 1},$$
     fonction intégrable sur $]0, 1]$ puisque $a > 0$. Elles convergent simplement sur $]0, 1[$ vers $\frac{t^{a - 1}}{1 + t^{b}}$, et le théorème 1 donne $\sum_{n = 0}^{N} \frac{(-1)^{n}}{a + nb} = \int_{0}^{1} S_{N} \to \int_{0}^{1} \frac{t^{a - 1}}{1 + t^{b}}\,\mathrm{d} t$. 
    $$\boxed{\int_{0}^{1} \frac{t^{a - 1}}{1 + t^{b}}\,\mathrm{d} t = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{a + nb}}$$

    **2.** Pour $a = 1$, $b = 2$, l'intégrale vaut $\operatorname{Arctan} 1 = \frac{\pi}{4}$. Pour $a = 1$, $b = 3$, on décompose 
    $$\frac{1}{1 + t^{3}} = \frac{1}{3}\cdot\frac{1}{1 + t} - \frac{1}{6}\cdot\frac{2t - 1}{t^{2} - t + 1} + \frac{1}{2}\cdot\frac{1}{(t - \frac{1}{2})^{2} + \frac{3}{4}}.$$
     Le deuxième terme a une intégrale nulle sur $[0, 1]$, puisque $t^{2} - t + 1$ prend la même valeur en $0$ et en $1$, et le troisième s'intègre en $\frac{1}{2}\cdot\frac{2}{\sqrt{3}}\big[\operatorname{Arctan}\frac{2t - 1}{\sqrt{3}}\big]_{0}^{1} = \frac{1}{\sqrt{3}}\cdot\frac{\pi}{3}$. 
    $$\boxed{\sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{2n + 1} = \frac{\pi}{4}, \qquad \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 1} = \frac{\ln 2}{3} + \frac{\pi}{3\sqrt{3}} \approx 0{,}83565}$$

    **3.** Le changement de variable $t = \frac{1}{u}$ donne $\displaystyle \int_{1}^{+\infty} \frac{\mathrm{d} t}{1 + t^{3}} = \int_{0}^{1} \frac{u\,\mathrm{d} u}{1 + u^{3}}$, qui est l'intégrale de la question 1 pour $a = 2$, $b = 3$. Pour la calculer, on la retranche de $\int_{0}^{+\infty} \frac{\mathrm{d} t}{1 + t^{3}} = \frac{2\pi}{3\sqrt{3}}$ (exercice 14 de la feuille du chapitre 12), dont elle est le morceau sur $[1, +\infty[$ : 
    $$\boxed{\int_{1}^{+\infty} \frac{\mathrm{d} t}{1 + t^{3}} = \sum_{n = 0}^{+\infty} \frac{(-1)^{n}}{3n + 2} = \frac{2\pi}{3\sqrt{3}} - \frac{\ln 2}{3} - \frac{\pi}{3\sqrt{3}} = \frac{\pi}{3\sqrt{3}} - \frac{\ln 2}{3} \approx 0{,}37355}$$
- id: "mp-13-16"
  feuille: "f-mp-13"
  numero: 16
  partie: "Intégration terme à terme"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégration terme à terme]
  noeuds: [m-convergence-dominee, as-series]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 23 ; Feuille d'exercices #02 (Prost), exercice 60"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    *Une somme trigonométrique.* Soit $\theta \in ]0, 2\pi[$.

    **1.** Pour $N \in \mathbb{N}^{*}$, montrer que $\displaystyle \sum_{n = 1}^{N} \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n} = \int_{0}^{1} \mathrm{e}^{\mathrm{i}\theta}\,\frac{1 - (t\mathrm{e}^{\mathrm{i}\theta})^{N}}{1 - t\mathrm{e}^{\mathrm{i}\theta}}\,\mathrm{d} t$.

    **2.** En déduire que la série $\sum \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n}$ converge, et que sa somme vaut $\displaystyle \int_{0}^{1} \frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - t\mathrm{e}^{\mathrm{i}\theta}}\,\mathrm{d} t$.

    **3.** Calculer cette intégrale, et en déduire que 
    $$\sum_{n = 1}^{+\infty} \frac{\cos(n\theta)}{n} = -\ln\Big(2\sin\frac{\theta}{2}\Big) \qquad\text{et}\qquad \sum_{n = 1}^{+\infty} \frac{\sin(n\theta)}{n} = \frac{\pi - \theta}{2}.$$
     Comparer la seconde égalité avec les résultats du chapitre 11.
  corrige: |
    On écrit $\frac{1}{n}$ comme une intégrale, ce qui transforme la série en l'intégrale d'une somme géométrique ; le passage à la limite se fait par convergence dominée sur les sommes partielles, car la série $\sum \frac{1}{n}$ des intégrales des modules diverge.

    **1.** Comme $\frac{1}{n} = \int_{0}^{1} t^{n - 1}\,\mathrm{d} t$, on a $\sum_{n = 1}^{N} \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n} = \int_{0}^{1} \sum_{n = 1}^{N} \mathrm{e}^{\mathrm{i} n\theta}t^{n - 1}\,\mathrm{d} t$, et la somme géométrique de raison $t\mathrm{e}^{\mathrm{i}\theta} \neq 1$ vaut $\mathrm{e}^{\mathrm{i}\theta}\frac{1 - (t\mathrm{e}^{\mathrm{i}\theta})^{N}}{1 - t\mathrm{e}^{\mathrm{i}\theta}}$.

    **2.** La fonction $t \mapsto |1 - t\mathrm{e}^{\mathrm{i}\theta}|$ est continue et ne s'annule pas sur le segment $[0, 1]$, car $\mathrm{e}^{\mathrm{i}\theta} \neq 1$ : elle y atteint un minimum $m > 0$ (chapitre 5). La fonction intégrée est donc dominée par la constante $\frac{2}{m}$, et elle tend vers $\frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - t\mathrm{e}^{\mathrm{i}\theta}}$ pour $t \in [0, 1[$. Le théorème 1 montre que les sommes partielles convergent. 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\mathrm{e}^{\mathrm{i} n\theta}}{n} = \int_{0}^{1} \frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - t\mathrm{e}^{\mathrm{i}\theta}}\,\mathrm{d} t}$$

    **3.** En multipliant par la quantité conjuguée, $\frac{\mathrm{e}^{\mathrm{i}\theta}}{1 - t\mathrm{e}^{\mathrm{i}\theta}} = \frac{\mathrm{e}^{\mathrm{i}\theta} - t}{1 - 2t\cos\theta + t^{2}}$. La partie réelle s'intègre directement : 
    $$\int_{0}^{1} \frac{\cos\theta - t}{1 - 2t\cos\theta + t^{2}}\,\mathrm{d} t = \Big[-\frac{1}{2}\ln\big(1 - 2t\cos\theta + t^{2}\big)\Big]_{0}^{1} = -\frac{1}{2}\ln(2 - 2\cos\theta) = -\ln\Big(2\sin\frac{\theta}{2}\Big).$$
     Pour la partie imaginaire, on suppose d'abord $\theta \in ]0, \pi[$ ; on a $1 - 2t\cos\theta + t^{2} = (t - \cos\theta)^{2} + \sin^{2}\theta$, d'où 
    $$\int_{0}^{1} \frac{\sin\theta\,\mathrm{d} t}{(t - \cos\theta)^{2} + \sin^{2}\theta} = \operatorname{Arctan}\frac{1 - \cos\theta}{\sin\theta} + \operatorname{Arctan}\frac{\cos\theta}{\sin\theta} = \frac{\theta}{2} + \Big(\frac{\pi}{2} - \theta\Big) = \frac{\pi - \theta}{2},$$
     car $\frac{1 - \cos\theta}{\sin\theta} = \tan\frac{\theta}{2}$ et $\frac{\cos\theta}{\sin\theta} = \tan\big(\frac{\pi}{2} - \theta\big)$, avec des angles dans $]-\frac{\pi}{2}, \frac{\pi}{2}[$. Pour $\theta = \pi$, la partie imaginaire est nulle, ainsi que $\frac{\pi - \theta}{2}$. Pour $\theta \in ]\pi, 2\pi[$, on remplace $\theta$ par $2\pi - \theta$ : les deux membres changent de signe. 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\cos(n\theta)}{n} = -\ln\Big(2\sin\frac{\theta}{2}\Big), \qquad \sum_{n = 1}^{+\infty} \frac{\sin(n\theta)}{n} = \frac{\pi - \theta}{2}}$$
     La seconde égalité est le développement en série de Fourier de la fonction $2\pi$-périodique « en dents de scie », égale à $\frac{\pi - \theta}{2}$ sur $]0, 2\pi[$ (chapitre 11). On l'obtient ici sans le théorème de Dirichlet, et l'on obtient en prime la série en cosinus, qui n'est pas la série de Fourier d'une fonction bornée.
- id: "mp-13-17"
  feuille: "f-mp-13"
  numero: 17
  partie: "Intégration terme à terme"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [intégration terme à terme]
  noeuds: [m-convergence-dominee, as-series]
  notions: []
  page_enonce: 4
  page_corrige: 11
  enonce: |
    *La fonction $\zeta$ alternée.* Pour $x > 0$, on pose $\displaystyle \eta(x) = \sum_{n = 1}^{+\infty} \frac{(-1)^{n - 1}}{n^{x}}$.

    **1.** Justifier la convergence de cette série pour $x > 0$.

    **2.** Pour $x > 1$, montrer que $\displaystyle \int_{0}^{+\infty} \frac{t^{x - 1}}{\mathrm{e}^{t} + 1}\,\mathrm{d} t = \Gamma(x)\eta(x)$.

    **3.** Pour $0 < x \leqslant 1$, montrer que le théorème 3 ne s'applique plus, mais que l'égalité reste vraie.

    **4.** Que donne l'égalité pour $x = 1$ ? Pour $x = 2$, exprimer $\eta(2)$ à l'aide de $\zeta(2)$, et en déduire la valeur de $\displaystyle \int_{0}^{+\infty} \frac{t}{\mathrm{e}^{t} + 1}\,\mathrm{d} t$.
  corrige: |
    C'est l'exemple de la remarque du programme : pour $x > 1$ le théorème 3 s'applique, et pour $0 < x \leqslant 1$ il faut revenir aux sommes partielles.

    **1.** Pour $x > 0$, la suite $\big(\frac{1}{n^{x}}\big)$ décroît vers $0$ : le critère des séries alternées (chapitre 20 de MPSI) donne la convergence.

    **2.** Pour $t > 0$, $\frac{t^{x - 1}}{\mathrm{e}^{t} + 1} = \frac{t^{x - 1}\mathrm{e}^{-t}}{1 + \mathrm{e}^{-t}} = \sum_{n \geqslant 1} (-1)^{n - 1}t^{x - 1}\mathrm{e}^{-nt}$. Le changement de variable $u = nt$ donne $\int_{0}^{+\infty} t^{x - 1}\mathrm{e}^{-nt}\,\mathrm{d} t = \frac{\Gamma(x)}{n^{x}}$, et la série $\sum \frac{\Gamma(x)}{n^{x}}$ converge pour $x > 1$ : le théorème 3 s'applique. 
    $$\boxed{\int_{0}^{+\infty} \frac{t^{x - 1}}{\mathrm{e}^{t} + 1}\,\mathrm{d} t = \Gamma(x)\eta(x) \qquad (x > 1)}$$

    **3.** Pour $0 < x \leqslant 1$, la série $\sum \frac{\Gamma(x)}{n^{x}}$ diverge : le théorème 3 ne s'applique plus. Les sommes partielles valent 
    $$S_{N}(t) = \sum_{n = 1}^{N} (-1)^{n - 1}t^{x - 1}\mathrm{e}^{-nt} = t^{x - 1}\mathrm{e}^{-t}\,\frac{1 - (-\mathrm{e}^{-t})^{N}}{1 + \mathrm{e}^{-t}}, \qquad\text{d'où}\qquad |S_{N}(t)| \leqslant 2t^{x - 1}\mathrm{e}^{-t},$$
     fonction intégrable sur $]0, +\infty[$ pour $x > 0$. Elles convergent simplement vers $\frac{t^{x - 1}}{\mathrm{e}^{t} + 1}$, et le théorème 1 donne $\Gamma(x)\sum_{n = 1}^{N} \frac{(-1)^{n - 1}}{n^{x}} \to \int_{0}^{+\infty} \frac{t^{x - 1}}{\mathrm{e}^{t} + 1}\,\mathrm{d} t$. 
    $$\boxed{\int_{0}^{+\infty} \frac{t^{x - 1}}{\mathrm{e}^{t} + 1}\,\mathrm{d} t = \Gamma(x)\eta(x) \qquad\text{pour tout } x > 0}$$

    **4.** Pour $x = 1$, on obtient 
    $$\int_{0}^{+\infty} \frac{\mathrm{d} t}{\mathrm{e}^{t} + 1} = \eta(1) = \ln 2,$$
     ce que confirme le calcul direct de la primitive $-\ln(1 + \mathrm{e}^{-t})$ de $\frac{\mathrm{e}^{-t}}{1 + \mathrm{e}^{-t}}$. Pour $x = 2$, on retranche deux fois la somme des termes pairs : $\eta(2) = \zeta(2) - 2 \cdot \frac{1}{4}\zeta(2) = \frac{1}{2}\zeta(2)$. 
    $$\boxed{\eta(2) = \frac{\pi^{2}}{12}, \qquad \int_{0}^{+\infty} \frac{t}{\mathrm{e}^{t} + 1}\,\mathrm{d} t = \Gamma(2)\,\eta(2) = \frac{\pi^{2}}{12}}$$
- id: "mp-13-18"
  feuille: "f-mp-13"
  numero: 18
  partie: "Continuité d'une intégrale à paramètre"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: ["continuité d'une intégrale à paramètre", "continuité sous l'intégrale", équivalents]
  noeuds: [gd-schwarz, ar-asymptotique]
  notions: []
  source: "BibM@th, Fonctions définies par une intégrale, exercice 33 ; BibM@th, Intégrales impropres, exercice 39 ; item 1 composé pour la feuille"
  page_enonce: 4
  page_corrige: 12
  enonce: |
    **1.** Montrer que $\displaystyle F : x \mapsto \int_{0}^{+\infty} \frac{\mathrm{e}^{-t^{2}}}{1 + x^{2}t^{2}}\,\mathrm{d} t$ est définie et continue sur $\mathbb{R}$, et déterminer ses limites en $\pm\infty$.

    **2.** Soit $\displaystyle G(x) = \int_{0}^{+\infty} \frac{\mathrm{d} t}{1 + t^{x}}$. Déterminer l'ensemble de définition $\mathcal{D}$ de $G$, montrer que $G$ est continue sur $\mathcal{D}$, et déterminer la limite de $G$ en $+\infty$. Comparer avec l'exemple de la section 13.2 du cours.

    **3.** Montrer que $G(x) \underset{x \to 1^{+}}{\sim} \dfrac{1}{x - 1}$.
  corrige: |
    La première fonction relève d'une domination globale ; la seconde demande une domination locale, sur des intervalles $[a, +\infty[$ avec $a > 1$.

    **1.** Pour tout $t \geqslant 0$, $x \mapsto \frac{\mathrm{e}^{-t^{2}}}{1 + x^{2}t^{2}}$ est continue, et $\Big|\frac{\mathrm{e}^{-t^{2}}}{1 + x^{2}t^{2}}\Big| \leqslant \mathrm{e}^{-t^{2}}$, intégrable sur $[0, +\infty[$ et indépendante de $x$ : le théorème 4 donne la continuité de $F$ sur $\mathbb{R}$. Quand $x \to \pm\infty$, la fonction intégrée tend vers $0$ pour tout $t > 0$, avec la même domination : la proposition 1 donne la limite. 
    $$\boxed{F \text{ est continue sur } \mathbb{R}, \quad F(0) = \frac{\sqrt{\pi}}{2}, \quad \lim\limits_{x \to \pm\infty} F(x) = 0}$$

    **2.** Sur $[0, 1]$, la fonction $t \mapsto \frac{1}{1 + t^{x}}$ est continue sur $]0, 1]$ et bornée par $1$ : elle est intégrable pour tout réel $x$. Sur $[1, +\infty[$, si $x > 1$, elle est majorée par $t^{-x}$, intégrable ; si $x \leqslant 1$, $t^{x} \leqslant t$ et elle est minorée par $\frac{1}{1 + t}$, non intégrable. Ainsi $\mathcal{D} = ]1, +\infty[$. Pour $a > 1$ et $x \geqslant a$, la fonction est majorée par $\varphi_{a}$, égale à $1$ sur $[0, 1]$ et à $t^{-a}$ sur $[1, +\infty[$, intégrable : la proposition 2, appliquée avec les intervalles $[a, +\infty[$, donne la continuité. Quand $x \to +\infty$, la fonction tend vers $\mathbf{1}_{[0, 1[}$, sauf en $t = 1$, avec la domination $\varphi_{2}$ pour $x \geqslant 2$. 
    $$\boxed{\mathcal{D} = ]1, +\infty[, \quad G \text{ est continue sur } \mathcal{D}, \quad \lim\limits_{x \to +\infty} G(x) = 1}$$
     C'est la version à paramètre réel de l'exemple du cours, où l'on prenait $x = n$ entier.

    **3.** Pour $t \geqslant 1$, $\frac{1}{1 + t^{x}} - \frac{1}{t^{x}} = -\frac{1}{t^{x}(1 + t^{x})}$, de module au plus $t^{-2x} \leqslant t^{-2}$. Ainsi 
    $$G(x) = \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{x}} + \int_{1}^{+\infty} \frac{\mathrm{d} t}{t^{x}} - \int_{1}^{+\infty} \frac{\mathrm{d} t}{t^{x}(1 + t^{x})} = \frac{1}{x - 1} + O(1).$$

    $$\boxed{G(x) \underset{x \to 1^{+}}{\sim} \frac{1}{x - 1}}$$
- id: "mp-13-19"
  feuille: "f-mp-13"
  numero: 19
  partie: "Continuité d'une intégrale à paramètre"
