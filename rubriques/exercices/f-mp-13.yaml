- id: "mp-13-01"
  feuille: "f-mp-13"
  numero: 1
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée, "continuité sous l'intégrale"]
  noeuds: [m-convergence-dominee, gd-schwarz]
  notions: [fonction-dominee]
  source: "BibM@th, Fonctions définies par une intégrale, exercice 1 ; Feuille d'exercices #02 (Prost), exercice 49 ; item (c) composé pour la feuille"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer la limite, quand $n \to +\infty$, de chacune des intégrales suivantes. 
    $$\text{(a)} \ \int_{0}^{\pi/4} \tan^{n}x\,\mathrm{d} x, \qquad \text{(b)} \ \int_{0}^{+\infty} \frac{\mathrm{e}^{-x/n}}{1 + x^{2}}\,\mathrm{d} x, \qquad \text{(c)} \ \int_{0}^{1} \frac{1 + nx}{(1 + x)^{n}}\,\mathrm{d} x,$$

    $$\text{(d)} \ \int_{0}^{n} \Big(1 - \frac{x}{n}\Big)^{n}\cos x\,\mathrm{d} x, \qquad \text{(e)} \ \int_{0}^{+\infty} \frac{\sin^{n}x}{x^{2}}\,\mathrm{d} x \ (n \geqslant 2), \qquad \text{(f)} \ \int_{0}^{1} f(x^{n})\,\mathrm{d} x,$$
     où, dans (f), $f : [0, 1] \to \mathbb{R}$ est continue.
  corrige: |
    Dans chaque cas, on détermine la limite simple de la fonction intégrée, puis l'on cherche un majorant intégrable indépendant de $n$, avant d'appliquer le théorème 1.

    **(a)** Sur $[0, \frac{\pi}{4}[$, $0 \leqslant \tan x < 1$, donc $\tan^{n}x \to 0$ ; en $\frac{\pi}{4}$, la limite vaut $1$. La limite simple est nulle sauf en un point, donc continue par morceaux d'intégrale nulle, et $0 \leqslant \tan^{n}x \leqslant 1$, constante intégrable sur un segment. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{\pi/4} \tan^{n}x\,\mathrm{d} x = 0}$$

    **(b)** Pour tout $x \geqslant 0$, $\frac{\mathrm{e}^{-x/n}}{1 + x^{2}} \to \frac{1}{1 + x^{2}}$, et la fonction intégrée est majorée par $\frac{1}{1 + x^{2}}$, intégrable sur $[0, +\infty[$. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{+\infty} \frac{\mathrm{e}^{-x/n}}{1 + x^{2}}\,\mathrm{d} x = \frac{\pi}{2}}$$

    **(c)** Pour $x \in ]0, 1]$, la formule du binôme donne $(1 + x)^{n} \geqslant \frac{n(n - 1)}{2}x^{2}$, d'où 
    $$0 \leqslant \frac{1 + nx}{(1 + x)^{n}} \leqslant \frac{2(1 + nx)}{n(n - 1)x^{2}} \xrightarrow[n \to +\infty]{} 0.$$
     L'inégalité de Bernoulli $(1 + x)^{n} \geqslant 1 + nx$ fournit la domination par la constante $1$. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{1} \frac{1 + nx}{(1 + x)^{n}}\,\mathrm{d} x = 0}$$
     Numériquement, $n$ fois l'intégrale tend vers $2$ : l'intégrale est de l'ordre de $\frac{2}{n}$.

    **(d)** C'est l'approximation de $\mathrm{e}^{-x}$ du cours (section 13.2) : la fonction $x \mapsto \big(1 - \frac{x}{n}\big)^{n}\cos x\,\mathbf{1}_{[0, n]}(x)$ tend vers $\mathrm{e}^{-x}\cos x$ et elle est dominée par $\mathrm{e}^{-x}$. La limite vaut $\displaystyle \int_{0}^{+\infty} \mathrm{e}^{-x}\cos x\,\mathrm{d} x = \mathcal{R}e\frac{1}{1 - \mathrm{i}}$. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{n} \Big(1 - \frac{x}{n}\Big)^{n}\cos x\,\mathrm{d} x = \frac{1}{2}}$$

    **(e)** Pour $n \geqslant 2$, $\big|\frac{\sin^{n}x}{x^{2}}\big| \leqslant \frac{\sin^{2}x}{x^{2}}$, fonction intégrable sur $]0, +\infty[$ : elle est bornée par $1$ près de $0$ et par $\frac{1}{x^{2}}$ en $+\infty$. En revanche, la convergence simple pose une difficulté : aux points $x = \frac{3\pi}{2} + 2k\pi$, où $\sin x = -1$, la suite $(\sin^{n}x)$ vaut alternativement $1$ et $-1$, et ne converge pas. On applique donc le théorème 1 séparément aux deux sous-suites d'indices pairs et impairs. Chacune converge simplement vers une fonction nulle sauf en des points isolés, d'intégrale nulle, et elle est dominée par $\frac{\sin^{2}x}{x^{2}}$. Les deux sous-suites d'intégrales tendent vers $0$, donc toute la suite. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{+\infty} \frac{\sin^{n}x}{x^{2}}\,\mathrm{d} x = 0}$$

    *Piège.* Le théorème suppose la convergence simple en *tout* point. Le recours aux deux sous-suites est la façon correcte de traiter les points où elle fait défaut.

    **(f)** Pour $x \in [0, 1[$, $x^{n} \to 0$ et $f(x^{n}) \to f(0)$ par continuité ; en $x = 1$, $f(x^{n}) = f(1)$. La limite simple vaut $f(0)$ sauf en un point, et $|f(x^{n})| \leqslant \lVert f \rVert_{\infty}$, constante intégrable sur $[0, 1]$. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{1} f(x^{n})\,\mathrm{d} x = f(0)}$$
- id: "mp-13-02"
  feuille: "f-mp-13"
  numero: 2
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [fonction-dominee]
  source: "BibM@th, Fonctions définies par une intégrale, exercices 3 et 4"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Découpages.* Déterminer la limite, quand $n \to +\infty$, de 
    $$\text{(a)} \ \int_{0}^{+\infty} \frac{\mathrm{d} x}{x^{n} + \mathrm{e}^{x}}, \qquad \text{(b)} \ \int_{0}^{+\infty} \frac{x^{n}}{1 + x^{n + 2}}\,\mathrm{d} x.$$
     On commencera par déterminer la limite simple de la fonction intégrée sur $[0, 1[$, en $1$, et sur $]1, +\infty[$.
  corrige: |
    Les limites simples changent de nature de part et d'autre de $x = 1$, ce qui impose de raisonner par cas pour la convergence et pour la domination.

    **(a)** Pour $x \in [0, 1[$, $x^{n} \to 0$ et la fonction intégrée tend vers $\mathrm{e}^{-x}$ ; en $x = 1$, elle vaut $\frac{1}{1 + \mathrm{e}}$ ; pour $x > 1$, $x^{n} \to +\infty$ et elle tend vers $0$. La limite est donc $\mathrm{e}^{-x}\mathbf{1}_{[0, 1[}$, sauf en un point. Comme $x^{n} \geqslant 0$, la fonction intégrée est majorée par $\mathrm{e}^{-x}$, intégrable. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{+\infty} \frac{\mathrm{d} x}{x^{n} + \mathrm{e}^{x}} = \int_{0}^{1} \mathrm{e}^{-x}\,\mathrm{d} x = 1 - \frac{1}{\mathrm{e}}}$$

    **(b)** Pour $x \in [0, 1[$, la fonction intégrée tend vers $0$ ; en $x = 1$, elle vaut $\frac{1}{2}$ ; pour $x > 1$, elle s'écrit $\frac{1}{x^{-n} + x^{2}} \to \frac{1}{x^{2}}$. Pour la domination, elle est majorée par $1$ sur $[0, 1]$, et par $\frac{x^{n}}{x^{n + 2}} = \frac{1}{x^{2}}$ sur $[1, +\infty[$. 
    $$\boxed{\lim\limits_{n \to +\infty} \int_{0}^{+\infty} \frac{x^{n}}{1 + x^{n + 2}}\,\mathrm{d} x = \int_{1}^{+\infty} \frac{\mathrm{d} x}{x^{2}} = 1}$$
     Ici, l'aire se trouve entièrement à droite de $1$ dans la limite, alors qu'elle était entièrement à gauche dans (a).
- id: "mp-13-03"
  feuille: "f-mp-13"
  numero: 3
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convergence dominée, équivalents]
  noeuds: [m-convergence-dominee, ar-asymptotique]
  notions: [fonction-dominee]
  source: "BibM@th, Fonctions définies par une intégrale, exercices 10, 11 et 13"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Équivalents.*

    **1.** Donner un équivalent simple de $\displaystyle \int_{1}^{+\infty} \frac{\mathrm{d} x}{nx^{2} + \sqrt{x}}$ quand $n \to +\infty$.

    **2.** Montrer que $\displaystyle n\int_{1}^{+\infty} \mathrm{e}^{-x^{n}}\,\mathrm{d} x$ a une limite quand $n \to +\infty$, que l'on exprimera par une intégrale.

    **3.** Soit $\displaystyle I_{n} = \int_{0}^{1} \frac{\mathrm{d} t}{1 + t^{n}}$. Déterminer la limite $\ell$ de $(I_{n})$, puis un équivalent de $\ell - I_{n}$.
  corrige: |
    Pour obtenir un équivalent, on multiplie l'intégrale par la puissance de $n$ attendue, puis on fait apparaître, au besoin par un changement de variable, une intégrale à laquelle le théorème 1 s'applique.

    **1.** On a $\displaystyle n\int_{1}^{+\infty} \frac{\mathrm{d} x}{nx^{2} + \sqrt{x}} = \int_{1}^{+\infty} \frac{\mathrm{d} x}{x^{2} + \sqrt{x}/n}$. La fonction intégrée tend vers $\frac{1}{x^{2}}$ et elle est majorée par $\frac{1}{x^{2}}$, intégrable sur $[1, +\infty[$ : la limite vaut $1$. 
    $$\boxed{\int_{1}^{+\infty} \frac{\mathrm{d} x}{nx^{2} + \sqrt{x}} \underset{n \to +\infty}{\sim} \frac{1}{n}}$$

    **2.** Le changement de variable $u = x^{n}$, de classe $\mathcal{C}^{1}$ et strictement croissant de $[1, +\infty[$ sur lui-même, donne $\mathrm{d} x = \frac{1}{n}u^{1/n - 1}\,\mathrm{d} u$, d'où 
    $$n\int_{1}^{+\infty} \mathrm{e}^{-x^{n}}\,\mathrm{d} x = \int_{1}^{+\infty} \mathrm{e}^{-u}u^{1/n - 1}\,\mathrm{d} u.$$
     Pour $u \geqslant 1$, $u^{1/n - 1} \to u^{-1}$ et $0 \leqslant \mathrm{e}^{-u}u^{1/n - 1} \leqslant \mathrm{e}^{-u}$, intégrable. 
    $$\boxed{n\int_{1}^{+\infty} \mathrm{e}^{-x^{n}}\,\mathrm{d} x \xrightarrow[n \to +\infty]{} \int_{1}^{+\infty} \frac{\mathrm{e}^{-u}}{u}\,\mathrm{d} u \approx 0{,}21938}$$

    **3.** La fonction $\frac{1}{1 + t^{n}}$ tend vers $1$ sur $[0, 1[$ et elle est majorée par $1$ : $\ell = 1$. Ensuite, 
    $$\ell - I_{n} = \int_{0}^{1} \frac{t^{n}}{1 + t^{n}}\,\mathrm{d} t,$$
     et le changement de variable $u = t^{n}$ donne 
    $$n(\ell - I_{n}) = \int_{0}^{1} \frac{u^{1/n}}{1 + u}\,\mathrm{d} u \xrightarrow[n \to +\infty]{} \int_{0}^{1} \frac{\mathrm{d} u}{1 + u} = \ln 2,$$
     par domination de la fonction intégrée par la constante $1$. 
    $$\boxed{\ell = 1 \qquad\text{et}\qquad 1 - I_{n} \underset{n \to +\infty}{\sim} \frac{\ln 2}{n}}$$
- id: "mp-13-04"
  feuille: "f-mp-13"
  numero: 4
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence dominée, équivalents]
  noeuds: [m-convergence-dominee, ar-asymptotique]
  notions: [fonction-dominee]
  source: "BibM@th, Fonctions définies par une intégrale, exercice 14 ; BibM@th, Intégrales impropres, exercice 41"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on pose $\displaystyle I_{n} = \int_{0}^{+\infty} \frac{\mathrm{e}^{-x}}{x + n}\,\mathrm{d} x$.

    **1.** Justifier l'existence de $I_{n}$ et montrer que $I_{n} \to 0$.

    **2.** Montrer que $I_{n} \underset{n \to +\infty}{\sim} \frac{1}{n}$.

    **3.** Établir le développement $\displaystyle I_{n} = \frac{1}{n} - \frac{1}{n^{2}} + \frac{2}{n^{3}} + o\Big(\frac{1}{n^{3}}\Big)$.
  corrige: |
    On obtient chaque terme du développement en isolant le terme principal par une identité algébrique exacte, puis en passant à la limite dans le reste.

    **1.** Pour $x \geqslant 0$, $0 \leqslant \frac{\mathrm{e}^{-x}}{x + n} \leqslant \frac{\mathrm{e}^{-x}}{n}$ : la fonction est intégrable, et $0 \leqslant I_{n} \leqslant \frac{1}{n}$. 
    $$\boxed{I_{n} \xrightarrow[n \to +\infty]{} 0}$$

    **2.** On a $\displaystyle nI_{n} = \int_{0}^{+\infty} \frac{\mathrm{e}^{-x}}{1 + x/n}\,\mathrm{d} x$ ; la fonction intégrée tend vers $\mathrm{e}^{-x}$ et elle est majorée par $\mathrm{e}^{-x}$, donc $nI_{n} \to 1$. 
    $$\boxed{I_{n} \underset{n \to +\infty}{\sim} \frac{1}{n}}$$

    **3.** L'identité $\frac{1}{x + n} = \frac{1}{n} - \frac{x}{n^{2}} + \frac{x^{2}}{n^{2}(x + n)}$, que l'on vérifie en réduisant au même dénominateur, donne, avec $\int_{0}^{+\infty} x\mathrm{e}^{-x}\,\mathrm{d} x = 1$, 
    $$I_{n} = \frac{1}{n} - \frac{1}{n^{2}} + \frac{1}{n^{3}}\int_{0}^{+\infty} \frac{x^{2}\mathrm{e}^{-x}}{1 + x/n}\,\mathrm{d} x.$$
     La dernière intégrale tend vers $\int_{0}^{+\infty} x^{2}\mathrm{e}^{-x}\,\mathrm{d} x = \Gamma(3) = 2$, par domination par $x^{2}\mathrm{e}^{-x}$. 
    $$\boxed{I_{n} = \frac{1}{n} - \frac{1}{n^{2}} + \frac{2}{n^{3}} + o\Big(\frac{1}{n^{3}}\Big)}$$

    *Remarque.* En poursuivant, on obtient les termes $\frac{(-1)^{k}k!}{n^{k + 1}}$ : la série correspondante diverge pour tout $n$, bien que chacune de ses sommes partielles fournisse un développement asymptotique valable. C'est l'exemple type d'une *série asymptotique*.
- id: "mp-13-05"
  feuille: "f-mp-13"
  numero: 5
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convergence dominée, "continuité sous l'intégrale", équivalents]
  noeuds: [m-convergence-dominee, gd-schwarz, ar-asymptotique]
  notions: [fonction-dominee]
  source: "Feuille d'exercices #02 (Prost), exercice 48"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f : [0, +\infty[ \to \mathbb{R}$ continue et bornée. Pour $n \in \mathbb{N}^{*}$, on pose $\displaystyle I_{n} = \int_{0}^{+\infty} \mathrm{e}^{-nt}\,\frac{f(t)}{\sqrt{t}}\,\mathrm{d} t$.

    **1.** Justifier l'existence de $I_{n}$ et déterminer sa limite.

    **2.** On suppose $f(0) \neq 0$. Déterminer un équivalent simple de $I_{n}$.
  corrige: |
    On note $M = \lVert f \rVert_{\infty}$. Le facteur $\frac{1}{\sqrt{t}}$ rend l'intégrale généralisée en $0$, et le changement de variable $u = nt$ fait apparaître $\Gamma\big(\frac{1}{2}\big)$.

    **1.** La fonction $t \mapsto \mathrm{e}^{-nt}\frac{f(t)}{\sqrt{t}}$ est continue sur $]0, +\infty[$ et majorée en module par $M\frac{\mathrm{e}^{-t}}{\sqrt{t}}$ pour tout $n \geqslant 1$, fonction intégrable sur $]0, +\infty[$ (elle est équivalente à $\frac{M}{\sqrt{t}}$ en $0$ et négligeable devant $\frac{1}{t^{2}}$ en $+\infty$). Pour $t > 0$ fixé, $\mathrm{e}^{-nt} \to 0$ : le théorème 1 donne la limite. 
    $$\boxed{I_{n} \xrightarrow[n \to +\infty]{} 0}$$

    **2.** Le changement de variable $u = nt$ donne 
    $$\sqrt{n}\,I_{n} = \int_{0}^{+\infty} \mathrm{e}^{-u}\,\frac{f(u/n)}{\sqrt{u}}\,\mathrm{d} u.$$
     Pour $u > 0$, $f\big(\frac{u}{n}\big) \to f(0)$ par continuité de $f$ en $0$, et la fonction intégrée est dominée par $M\frac{\mathrm{e}^{-u}}{\sqrt{u}}$. La limite vaut $f(0)\Gamma\big(\frac{1}{2}\big) = f(0)\sqrt{\pi}$, non nulle par hypothèse. 
    $$\boxed{I_{n} \underset{n \to +\infty}{\sim} f(0)\sqrt{\frac{\pi}{n}}}$$
- id: "mp-13-06"
  feuille: "f-mp-13"
  numero: 6
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence dominée, équivalents]
  noeuds: [m-convergence-dominee, ar-asymptotique]
  notions: [fonction-dominee]
  source: "Feuille d'exercices #02 (Prost), exercice 53"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour $n \in \mathbb{N}$, on pose $\displaystyle I_{n} = \int_{0}^{\pi/2} x^{2}\cos^{n}x\,\mathrm{d} x$.

    **1.** Montrer que $I_{n} \to 0$, puis que $\cos^{n}\big(\frac{t}{\sqrt{n}}\big) \to \mathrm{e}^{-t^{2}/2}$ pour tout réel $t$.

    **2.** Montrer que $\tan \theta \geqslant \theta$ pour $\theta \in [0, \frac{\pi}{2}[$, et en déduire que $\cos x \leqslant \mathrm{e}^{-x^{2}/2}$ pour $x \in [0, \frac{\pi}{2}[$.

    **3.** Montrer que $n^{3/2}I_{n}$ a une limite finie, que l'on calculera, et en déduire un équivalent de $I_{n}$.
  corrige: |
    La masse de $x^{2}\cos^{n}x$ se concentre près de $0$, sur une largeur de l'ordre de $\frac{1}{\sqrt{n}}$ : c'est l'échelle qui fait apparaître une gaussienne.

    **1.** Pour $x \in ]0, \frac{\pi}{2}]$, $0 \leqslant \cos x < 1$, donc $x^{2}\cos^{n}x \to 0$, et $0 \leqslant x^{2}\cos^{n}x \leqslant \frac{\pi^{2}}{4}$ sur le segment : $I_{n} \to 0$. Ensuite, pour $t$ réel fixé et $n$ assez grand, $\ln\cos u = -\frac{u^{2}}{2} + O(u^{4})$ donne 
    $$\cos^{n}\Big(\frac{t}{\sqrt{n}}\Big) = \exp\Big(n\ln\cos\frac{t}{\sqrt{n}}\Big) = \exp\Big(-\frac{t^{2}}{2} + O\Big(\frac{1}{n}\Big)\Big) \xrightarrow[n \to +\infty]{} \mathrm{e}^{-t^{2}/2}.$$

    **2.** La fonction $\theta \mapsto \tan\theta - \theta$ est nulle en $0$, de dérivée $\tan^{2}\theta \geqslant 0$ : elle est positive sur $[0, \frac{\pi}{2}[$. En intégrant $\tan\theta \geqslant \theta$ sur $[0, x]$, on obtient $-\ln\cos x \geqslant \frac{x^{2}}{2}$. 
    $$\boxed{\forall x \in \Big[0, \frac{\pi}{2}\Big[, \quad \cos x \leqslant \mathrm{e}^{-x^{2}/2}}$$

    **3.** Le changement de variable $x = \frac{t}{\sqrt{n}}$ donne 
    $$n^{3/2}I_{n} = \int_{0}^{+\infty} f_{n}(t)\,\mathrm{d} t, \qquad f_{n}(t) = t^{2}\cos^{n}\Big(\frac{t}{\sqrt{n}}\Big)\mathbf{1}_{[0, \pi\sqrt{n}/2[}(t).$$
     D'après la question 1, $f_{n}(t) \to t^{2}\mathrm{e}^{-t^{2}/2}$ ; d'après la question 2, $0 \leqslant f_{n}(t) \leqslant t^{2}\mathrm{e}^{-t^{2}/2}$, intégrable sur $[0, +\infty[$. Le théorème 1 et une intégration par parties donnent 
    $$n^{3/2}I_{n} \to \int_{0}^{+\infty} t^{2}\mathrm{e}^{-t^{2}/2}\,\mathrm{d} t = \int_{0}^{+\infty} \mathrm{e}^{-t^{2}/2}\,\mathrm{d} t = \sqrt{\frac{\pi}{2}}.$$

    $$\boxed{I_{n} \underset{n \to +\infty}{\sim} \sqrt{\frac{\pi}{2}}\,\frac{1}{n^{3/2}}}$$
     Numériquement, $n^{3/2}I_{n} \approx 1{,}2532$ pour $n = 10^{4}$, contre $\sqrt{\pi/2} \approx 1{,}2533$.
- id: "mp-13-07"
  feuille: "f-mp-13"
  numero: 7
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
