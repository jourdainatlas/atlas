  noeuds: [ri-integrable, ar-asymptotique]
  notions: []
  page_enonce: 8
  page_corrige: 24
  enonce: |
    *Le quotient $\frac{\Gamma(x + a)}{\Gamma(x)}$.* On utilise la convexité de $\ln \Gamma$ établie dans le cours. Soit $x > 0$ et $a \in [0, 1]$.

    **1.** Montrer que $\Gamma(x + a) \leqslant \Gamma(x)^{1 - a}\,\Gamma(x + 1)^{a} = x^{a}\,\Gamma(x)$.

    **2.** En appliquant la même inégalité en $x + a$, montrer que $\Gamma(x + 1) \leqslant (x + a)^{1 - a}\,\Gamma(x + a)$.

    **3.** En déduire que $\Gamma(x + a) \underset{x \to +\infty}{\sim} x^{a}\,\Gamma(x)$, puis que ce résultat vaut pour tout réel $a \geqslant 0$.

    **4.** Application : donner un équivalent de $\dfrac{\Gamma\big(n + \frac{1}{2}\big)}{n!}$, puis de $\dfrac{(2n)!}{4^{n}(n!)^{2}}$, et comparer avec les intégrales de Wallis.
  corrige: |
    La convexité de $\ln\Gamma$ encadre $\Gamma$ entre ses valeurs aux entiers voisins, et ces encadrements deviennent des équivalents quand $x \to +\infty$.

    **1.** On écrit $x + a = (1 - a)x + a(x + 1)$. La convexité de $\ln\Gamma$ donne 
    $$\ln\Gamma(x + a) \leqslant (1 - a)\ln\Gamma(x) + a\ln\Gamma(x + 1),$$
     et l'on utilise $\Gamma(x + 1) = x\Gamma(x)$. 
    $$\boxed{\Gamma(x + a) \leqslant \Gamma(x)^{1 - a}\,\Gamma(x + 1)^{a} = x^{a}\,\Gamma(x)}$$

    **2.** De même, $x + 1 = a(x + a) + (1 - a)(x + a + 1)$, d'où 
    $$\Gamma(x + 1) \leqslant \Gamma(x + a)^{a}\,\Gamma(x + a + 1)^{1 - a} = (x + a)^{1 - a}\,\Gamma(x + a).$$

    $$\boxed{\Gamma(x + 1) \leqslant (x + a)^{1 - a}\,\Gamma(x + a)}$$

    **3.** Comme $\Gamma(x + 1) = x\Gamma(x)$, les deux inégalités donnent 
    $$\Big(\frac{x}{x + a}\Big)^{1 - a} \leqslant \frac{\Gamma(x + a)}{x^{a}\,\Gamma(x)} \leqslant 1,$$
     et le minorant tend vers $1$. Pour $a \geqslant 0$ quelconque, on écrit $a = m + r$ avec $m$ entier et $r \in [0, 1[$ : $\Gamma(x + a) = (x + r + m - 1)\cdots(x + r)\,\Gamma(x + r) \sim x^{m}\cdot x^{r}\Gamma(x)$. 
    $$\boxed{\Gamma(x + a) \underset{x \to +\infty}{\sim} x^{a}\,\Gamma(x) \quad\text{pour tout } a \geqslant 0}$$

    **4.** Avec $x = n + \frac{1}{2}$ et $a = \frac{1}{2}$, on obtient $n! = \Gamma(n + 1) \sim \sqrt{n}\,\Gamma\big(n + \frac{1}{2}\big)$. D'après l'exercice 35, $\frac{(2n)!}{4^{n}(n!)^{2}} = \frac{\Gamma(n + \frac{1}{2})}{\sqrt{\pi}\,n!}$. 
    $$\boxed{\frac{\Gamma\big(n + \frac{1}{2}\big)}{n!} \sim \frac{1}{\sqrt{n}}, \qquad \frac{(2n)!}{4^{n}(n!)^{2}} \sim \frac{1}{\sqrt{\pi n}}}$$
     L'intégrale de Wallis $W_{2n} = \frac{\pi}{2}\cdot\frac{(2n)!}{4^{n}(n!)^{2}}$ vérifie donc $W_{2n} \sim \sqrt{\frac{\pi}{4n}}$, ce qui est l'équivalent $W_{m} \sim \sqrt{\frac{\pi}{2m}}$ du chapitre 18 de MPSI, obtenu ici sans la relation $W_{m}W_{m + 1} = \frac{\pi}{2(m + 1)}$.
- id: "mp-13-37"
