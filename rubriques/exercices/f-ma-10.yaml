- id: "ma-10-01"
  feuille: "f-ma-10"
  numero: 1
  partie: "Relations de comparaison"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations de comparaison, équivalents]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Équivalents ou pas ?* Les relations suivantes sont-elles vraies, quand $n$ tend vers $+\infty$ ?

    **(a)** $n \sim n + 1$

    **(b)** $n^{2} \sim n^{2} + n$

    **(c)** $\ln n \sim \ln(10^{6}n)$

    **(d)** $\mathrm{e}^{n} \sim \mathrm{e}^{n + 10^{-6}}$

    **(e)** $\mathrm{e}^{n} \sim \mathrm{e}^{2n}$

    **(f)** $\ln n \sim \ln(n + 1)$
  corrige: |
    On utilise la caractérisation par le quotient (proposition 4 du cours) : $u_{n} \sim v_{n}$ si et seulement si $\frac{u_{n}}{v_{n}}$ tend vers $1$.

    **(a)** $\frac{n}{n + 1}$ tend vers $1$ : $\boxed{\text{vrai}}$. **(b)** $\frac{n^{2}}{n^{2} + n} = \frac{1}{1 + 1/n}$ tend vers $1$ : $\boxed{\text{vrai}}$.

    **(c)** $\frac{\ln(10^{6}n)}{\ln n} = 1 + \frac{6\ln 10}{\ln n}$ tend vers $1$ : $\boxed{\text{vrai}}$. Le facteur $10^{6}$, énorme, ne devient qu'une constante additive après le logarithme.

    **(d)** $\frac{\mathrm{e}^{n + 10^{-6}}}{\mathrm{e}^{n}} = \mathrm{e}^{10^{-6}}$ est constant, différent de $1$ : $\boxed{\text{faux}}$, même si ce rapport vaut environ $1{,}000\,001$.

    **(e)** $\frac{\mathrm{e}^{n}}{\mathrm{e}^{2n}} = \mathrm{e}^{-n}$ tend vers $0$ : $\boxed{\text{faux}}$, et l'on a même $\mathrm{e}^{n} = o(\mathrm{e}^{2n})$.

    **(f)** $\frac{\ln(n + 1)}{\ln n} = 1 + \frac{\ln(1 + 1/n)}{\ln n}$ tend vers $1$ : $\boxed{\text{vrai}}$.

    *À retenir.* Les questions (c) et (d) montrent que le logarithme écrase les facteurs multiplicatifs, alors que l'exponentielle amplifie les écarts additifs : il ne faut jamais composer un équivalent par $\exp$ sans vérification.
- id: "ma-10-02"
  feuille: "f-ma-10"
  numero: 2
  partie: "Relations de comparaison"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations de comparaison, équivalents, négligeabilité]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $(u_{n})$ et $(v_{n})$ deux suites réelles. Écrire les relations suivantes sous une forme plus simple, toutes étant prises quand $n$ tend vers $+\infty$.

    **(a)** $u_{n} \sim \dfrac{1}{2n} + \dfrac{1}{12n^{2}}$

    **(b)** $u_{n} \sim \dfrac{n^{2} + 2n + 3}{3n^{3} - n}$

    **(c)** $u_{n} \sim \dfrac{n + n^{2}}{\ln n - n^{3}}$

    **(d)** $u_{n} = 1 + o\Big(\dfrac{1}{n}\Big) + o\Big(\dfrac{1}{n^{3}}\Big)$

    **(e)** $u_{n} = o\Big(\dfrac{1}{n^{2}}\Big) + o\Big(\dfrac{1}{n}\Big) - o\Big(\dfrac{1}{\ln n}\Big)$

    **(f)** $u_{n} = o(n) - o(n)$

    **(g)** $u_{n} = o(n) - O(n)$

    **(h)** $u_{n} = \big(1 + o(1)\big)v_{n}$
  corrige: |
    On remplace chaque expression par son terme prépondérant, en utilisant les règles de calcul (proposition 3) et la transitivité de $\sim$.

    **(a)** Comme $\frac{1}{12n^{2}} = o\Big(\frac{1}{2n}\Big)$, on a $\frac{1}{2n} + \frac{1}{12n^{2}} \sim \frac{1}{2n}$, donc $\boxed{u_{n} \sim \frac{1}{2n}}$.

    **(b)** Le quotient est équivalent à $\frac{n^{2}}{3n^{3}} = \frac{1}{3n}$ : $\boxed{u_{n} \sim \frac{1}{3n}}$.

    **(c)** Le quotient est équivalent à $\frac{n^{2}}{-n^{3}}$ : $\boxed{u_{n} \sim -\frac{1}{n}}$.

    **(d)** Un $o\Big(\frac{1}{n^{3}}\Big)$ est un $o\Big(\frac{1}{n}\Big)$ : $\boxed{u_{n} = 1 + o\Big(\frac{1}{n}\Big)}$. On ne gagne rien à conserver le second terme, qui est absorbé par le premier.

    **(e)** Les trois termes sont des $o\Big(\frac{1}{\ln n}\Big)$, puisque $\frac{1}{n^{2}}$ et $\frac{1}{n}$ sont négligeables devant $\frac{1}{\ln n}$. On conclut que $\boxed{u_{n} = o\Big(\frac{1}{\ln n}\Big)}$. Le signe moins ne change rien, un $o$ n'ayant pas de signe.

    **(f)** La différence de deux $o(n)$ est un $o(n)$, et non $0$ : $\boxed{u_{n} = o(n)}$.

    **(g)** Un $o(n)$ est un $O(n)$ : $\boxed{u_{n} = O(n)}$.

    **(h)** C'est la définition de l'équivalence : $\boxed{u_{n} \sim v_{n}}$.

    *Piège.* L'erreur la plus répandue est d'écrire $o(n) - o(n) = 0$ : chaque $o$ désigne une suite inconnue, et les deux suites n'ont aucune raison d'être égales.
- id: "ma-10-03"
  feuille: "f-ma-10"
  numero: 3
  partie: "Relations de comparaison"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations de comparaison, équivalents, factorielles]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer un équivalent simple des suites de termes généraux suivants.

    **(a)** $\dfrac{1}{n - 1} - \dfrac{1}{n + 1}$

    **(b)** $\sqrt{n + 1} - \sqrt{n - 1}$

    **(c)** $\dfrac{n^{3} - \sqrt{1 + n^{2}}}{\ln n - 2n^{2}}$

    **(d)** $\sin\dfrac{1}{\sqrt{n + 1}}$

    **(e)** $\ln\Big(1 + \dfrac{1}{n^{2} + 1}\Big)$

    **(f)** $\ln(n + 2) - \ln(n + 1)$

    **(g)** $\dfrac{n! + \mathrm{e}^{n}}{2^{n} + 3^{n}}$

    **(h)** $\big(2^{n} + n^{2}\big)\mathrm{e}^{-n}$
  corrige: |
    **(a)** On réduit au même dénominateur : $\frac{1}{n - 1} - \frac{1}{n + 1} = \frac{2}{n^{2} - 1}$, d'où $\boxed{\sim \frac{2}{n^{2}}}$.

    **(b)** Par la quantité conjuguée, $\sqrt{n + 1} - \sqrt{n - 1} = \frac{2}{\sqrt{n + 1} + \sqrt{n - 1}}$, et le dénominateur est équivalent à $2\sqrt{n}$, d'où $\boxed{\sim \frac{1}{\sqrt{n}}}$.

    **(c)** Le numérateur est équivalent à $n^{3}$, le dénominateur à $-2n^{2}$ : $\boxed{\sim -\frac{n}{2}}$.

    **(d)** Comme $\frac{1}{\sqrt{n + 1}}$ tend vers $0$, $\sin\frac{1}{\sqrt{n + 1}} \sim \frac{1}{\sqrt{n + 1}} \sim \frac{1}{\sqrt{n}}$ : $\boxed{\sim \frac{1}{\sqrt{n}}}$.

    **(e)** De même, $\ln\Big(1 + \frac{1}{n^{2} + 1}\Big) \sim \frac{1}{n^{2} + 1}$ : $\boxed{\sim \frac{1}{n^{2}}}$.

    **(f)** On écrit $\ln(n + 2) - \ln(n + 1) = \ln\Big(1 + \frac{1}{n + 1}\Big)$, qui est équivalent à $\boxed{\frac{1}{n}}$. Il serait faux de dire que $\ln(n + 2) \sim \ln(n + 1)$ suffit : on ne soustrait pas des équivalents.

    **(g)** On a $\mathrm{e}^{n} = o(n!)$ et $2^{n} = o(3^{n})$ (chapitre 7), d'où $\boxed{\sim \frac{n!}{3^{n}}}$.

    **(h)** On a $n^{2} = o(2^{n})$, d'où $\boxed{\sim \big(\frac{2}{\mathrm{e}}\big)^{n}}$, qui tend vers $0$ puisque $2 < \mathrm{e}$.
- id: "ma-10-04"
  feuille: "f-ma-10"
  numero: 4
  partie: "Relations de comparaison"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations de comparaison, équivalents]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer un équivalent simple des fonctions suivantes, au voisinage du point indiqué.

    **(a)** $x + 1 + \ln x$, en $0^{+}$ et en $+\infty$

    **(b)** $1 - x^{2}$, en $1$

    **(c)** $\ln x$, en $1$

    **(d)** $\operatorname{ch}\sqrt{x}$, en $+\infty$

    **(e)** $\dfrac{\sin x\,\ln(1 + x^{2})}{x\tan x}$, en $0$

    **(f)** $\ln(\sin x)$, en $0^{+}$

    **(g)** $\ln\Big(1 + \dfrac{1}{x^{2}}\Big)$, en $0$ et en $+\infty$

    **(h)** $\sqrt{x^{2} + 1} - \sqrt{x^{2} - 1}$, en $+\infty$

    **(i)** $\tan x - \sin x$, en $0$

    **(j)** $\ln(\cos x)$, en $\big(\frac{\pi}{2}\big)^{-}$
  corrige: |
    **(a)** En $0^{+}$, $\ln x$ tend vers $-\infty$ et domine : $x + 1 + \ln x \sim \ln x$. En $+\infty$, $x$ domine par croissances comparées : $x + 1 + \ln x \sim x$. 
    $$\boxed{x + 1 + \ln x \underset{x \to 0^{+}}{\sim} \ln x, \qquad x + 1 + \ln x \underset{x \to +\infty}{\sim} x}$$

    **(b)** On factorise : $1 - x^{2} = (1 - x)(1 + x) \sim 2(1 - x)$ en $1$. $\boxed{\sim 2(1 - x)}$

    **(c)** On pose $x = 1 + h$ : $\ln(1 + h) \sim h$, donc $\boxed{\ln x \underset{x \to 1}{\sim} x - 1}$.

    **(d)** $\operatorname{ch}\sqrt{x} = \frac{1}{2}\Big(\mathrm{e}^{\sqrt{x}} + \mathrm{e}^{-\sqrt{x}}\Big)$, et $\mathrm{e}^{-\sqrt{x}} = o(\mathrm{e}^{\sqrt{x}})$ : $\boxed{\sim \frac{1}{2}\mathrm{e}^{\sqrt{x}}}$.

    **(e)** Par produit et quotient d'équivalents usuels, $\frac{x \cdot x^{2}}{x \cdot x} = x^{2}$ : $\boxed{\sim x^{2}}$.

    **(f)** On écrit $\ln(\sin x) = \ln x + \ln\frac{\sin x}{x}$. Le second terme tend vers $\ln 1 = 0$, alors que $\ln x$ tend vers $-\infty$ : $\boxed{\ln(\sin x) \underset{x \to 0^{+}}{\sim} \ln x}$.

    **(g)** En $0$, $\ln\Big(1 + \frac{1}{x^{2}}\Big) = \ln(1 + x^{2}) - 2\ln|x|$, et le premier terme tend vers $0$ : l'expression est équivalente à $-2\ln|x|$. En $+\infty$, $\frac{1}{x^{2}}$ tend vers $0$, donc elle est équivalente à $\frac{1}{x^{2}}$. 
    $$\boxed{\ln\Big(1 + \frac{1}{x^{2}}\Big) \underset{x \to 0}{\sim} -2\ln|x|, \qquad \ln\Big(1 + \frac{1}{x^{2}}\Big) \underset{x \to +\infty}{\sim} \frac{1}{x^{2}}}$$

    **(h)** Par la quantité conjuguée, $\sqrt{x^{2} + 1} - \sqrt{x^{2} - 1} = \frac{2}{\sqrt{x^{2} + 1} + \sqrt{x^{2} - 1}} \sim \frac{2}{2x}$ : $\boxed{\sim \frac{1}{x}}$.

    **(i)** On factorise : $\tan x - \sin x = \tan x\,(1 - \cos x) \sim x \cdot \frac{x^{2}}{2}$ : $\boxed{\sim \frac{x^{3}}{2}}$. La factorisation remplace une différence, interdite, par un produit, autorisé.

    **(j)** On pose $h = \frac{\pi}{2} - x \to 0^{+}$ : $\cos x = \sin h$, et $\ln(\sin h) \sim \ln h$ par (f). $\boxed{\ln(\cos x) \sim \ln\big(\frac{\pi}{2} - x\big)}$
- id: "ma-10-05"
  feuille: "f-ma-10"
  numero: 5
  partie: "Relations de comparaison"
  etoiles: 1
  types: [Calcul]
  mots_cles: [relations de comparaison, équivalents, calcul de limites]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable, limite-fonction]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Calculer les limites suivantes à l'aide d'équivalents.

    **(a)** $\lim\limits_{x \to 0} \dfrac{(1 - \cos x)(1 + 2x)}{x^{2} - x^{4}}$

    **(b)** $\lim\limits_{x \to 0} \dfrac{\ln(1 + \sin x)}{\tan(6x)}$

    **(c)** $\lim\limits_{x \to \pi/2} \dfrac{\ln(\sin^{2}x)}{\big(\frac{\pi}{2} - x\big)^{2}}$

    **(d)** $\lim\limits_{x \to 0} \dfrac{\ln(\cos x)}{1 - \cos(2x)}$

    **(e)** $\lim\limits_{x \to +\infty} \sqrt{4x + 1}\,\ln\Big(1 - \dfrac{\sqrt{x + 1}}{x + 2}\Big)$

    **(f)** $\lim\limits_{x \to +\infty} x^{3}\big(\mathrm{e}^{1/x^{2}} - \mathrm{e}^{1/(x+1)^{2}}\big)$
  corrige: |
    **(a)** Le numérateur est équivalent à $\frac{x^{2}}{2} \times 1$, le dénominateur à $x^{2}$ : $\boxed{\frac{1}{2}}$.

    **(b)** On a $\ln(1 + \sin x) \sim \sin x \sim x$ par substitution, et $\tan(6x) \sim 6x$ : $\boxed{\frac{1}{6}}$.

    **(c)** On pose $h = \frac{\pi}{2} - x$ : $\sin^{2}x = \cos^{2}h = 1 - \sin^{2}h$, et $\ln(1 - \sin^{2}h) \sim -\sin^{2}h \sim -h^{2}$ : $\boxed{-1}$.

    **(d)** On a $\ln(\cos x) \sim -\frac{x^{2}}{2}$ (cours, section 10.2) et $1 - \cos(2x) \sim 2x^{2}$ : $\boxed{-\frac{1}{4}}$.

    **(e)** Le réel $u = \frac{\sqrt{x + 1}}{x + 2}$ tend vers $0$, et $u \sim \frac{1}{\sqrt{x}}$, donc $\ln(1 - u) \sim -u \sim -\frac{1}{\sqrt{x}}$. Comme $\sqrt{4x + 1} \sim 2\sqrt{x}$, le produit est équivalent à $-2$ : $\boxed{-2}$.

    **(f)** On factorise par la seconde exponentielle : $\mathrm{e}^{1/x^{2}} - \mathrm{e}^{1/(x+1)^{2}} = \mathrm{e}^{1/(x+1)^{2}}\big(\mathrm{e}^{v} - 1\big)$, avec 
    $$v = \frac{1}{x^{2}} - \frac{1}{(x + 1)^{2}} = \frac{2x + 1}{x^{2}(x + 1)^{2}} \sim \frac{2}{x^{3}}.$$
     Comme $v$ tend vers $0$, $\mathrm{e}^{v} - 1 \sim v$, et le premier facteur tend vers $1$ : l'expression est équivalente à $\frac{2}{x^{3}}$, et la limite vaut $\boxed{2}$.
- id: "ma-10-06"
  feuille: "f-ma-10"
  numero: 6
  partie: "Relations de comparaison"
  etoiles: 2
  types: [Calcul]
  mots_cles: [relations de comparaison, négligeabilité]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Classer par ordre de négligeabilité les suites de termes généraux 
    $$\frac{1}{n}, \quad \frac{1}{n^{2}}, \quad \frac{\ln n}{n}, \quad \frac{1}{n\ln n}, \quad \frac{\mathrm{e}^{n}}{n^{3}}, \quad n, \quad 1, \quad \sqrt{n\,\mathrm{e}^{n}}, \quad n\ln n, \quad \frac{n^{2}}{\ln n}.$$
  corrige: |
    On compare deux à deux les termes voisins par leurs quotients, à l'aide des croissances comparées : 
    $$\boxed{\begin{array}{c} \displaystyle \frac{1}{n^{2}} \ll \frac{1}{n\ln n} \ll \frac{1}{n} \ll \frac{\ln n}{n} \ll 1 \\[3mm] \displaystyle \ll n \ll n\ln n \ll \frac{n^{2}}{\ln n} \ll \sqrt{n\,\mathrm{e}^{n}} \ll \frac{\mathrm{e}^{n}}{n^{3}} \end{array}}$$
     où $u_{n} \ll v_{n}$ signifie $u_{n} = o(v_{n})$. Les comparaisons délicates sont les suivantes : 
    $$\frac{1/n^{2}}{1/(n\ln n)} = \frac{\ln n}{n} \to 0, \qquad \frac{1/(n\ln n)}{1/n} = \frac{1}{\ln n} \to 0, \qquad \frac{n\ln n}{n^{2}/\ln n} = \frac{(\ln n)^{2}}{n} \to 0.$$
     Enfin $\frac{\mathrm{e}^{n}/n^{3}}{\sqrt{n\,\mathrm{e}^{n}}} = \frac{\mathrm{e}^{n/2}}{n^{7/2}} \to +\infty$ : la racine carrée divise l'exposant par deux, ce qui l'emporte sur toute puissance de $n$.
- id: "ma-10-07"
  feuille: "f-ma-10"
  numero: 7
  partie: "Relations de comparaison"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [relations de comparaison, équivalents, factorielles, sommes]
  noeuds: [su-infinies, de-limite, n-sommes]
  notions: [negligeable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Une somme de factorielles.* Montrer que $\displaystyle\sum_{k=0}^{n} k! \sim n!$. On pourra majorer $\displaystyle\sum_{k=0}^{n-2} k!$ par $(n - 1) \cdot (n - 2)!$.
  corrige: |
    Pour $n \geqslant 2$, on isole les deux derniers termes : 
    $$\sum_{k=0}^{n} k! = n! + (n - 1)! + \sum_{k=0}^{n-2} k!, \qquad\text{avec}\qquad 0 \leqslant \sum_{k=0}^{n-2} k! \leqslant (n - 1)(n - 2)! = (n - 1)!,$$
     puisque la somme comporte $n - 1$ termes, tous majorés par $(n - 2)!$. Ainsi $n! \leqslant \sum_{k=0}^{n} k! \leqslant n! + 2(n - 1)!$, et en divisant par $n!$, 
    $$1 \leqslant \frac{1}{n!}\sum_{k=0}^{n} k! \leqslant 1 + \frac{2}{n}.$$

    $$\boxed{\sum_{k=0}^{n} k! \sim n!}$$
     La factorielle croît si vite que le dernier terme écrase la somme de tous les précédents. Ce n'est pas le cas pour une suite géométrique de raison $2$, où $\sum_{k=0}^{n} 2^{k} \sim 2 \cdot 2^{n}$.
- id: "ma-10-08"
  feuille: "f-ma-10"
  numero: 8
  partie: "Relations de comparaison"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [relations de comparaison, équivalents, calcul de limites]
  noeuds: [su-infinies, de-limite]
  notions: [negligeable, limite-fonction]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *Équivalents, exponentielle et logarithme.* Soit $f$ et $g$ deux fonctions réelles définies au voisinage de $a \in \overline{\mathbb{R}}$.

    **1.** Montrer que $\mathrm{e}^{f} \sim \mathrm{e}^{g}$ au voisinage de $a$ si et seulement si $\lim\limits_{x \to a} \big(f(x) - g(x)\big) = 0$.

    **2.** La relation $f \sim g$ entraîne-t-elle $\mathrm{e}^{f} \sim \mathrm{e}^{g}$ ?

    **3.** On suppose $f$ et $g$ strictement positives, $f \sim g$, et $\lim\limits_{x \to a} g(x) = \ell \in [0\,,+\infty]$. Montrer que, si $\ell \neq 1$, alors $\ln f \sim \ln g$. Que se passe-t-il si $\ell = 1$ ?
  corrige: |
    **1.** Les fonctions $\mathrm{e}^{f}$ et $\mathrm{e}^{g}$ ne s'annulent pas, donc $\mathrm{e}^{f} \sim \mathrm{e}^{g}$ si et seulement si $\frac{\mathrm{e}^{f}}{\mathrm{e}^{g}} = \mathrm{e}^{f - g}$ tend vers $1$. Par continuité de $\exp$ et de $\ln$ en $0$ et en $1$, cela équivaut à $f - g \to 0$. 
    $$\boxed{\mathrm{e}^{f} \sim \mathrm{e}^{g} \iff \lim\limits_{x \to a} (f - g) = 0}$$

    **2.** Non : en $+\infty$, $x + 1 \sim x$, mais la différence $(x + 1) - x = 1$ ne tend pas vers $0$, donc, par la question 1, $\mathrm{e}^{x+1}$ n'est pas équivalent à $\mathrm{e}^{x}$. $\boxed{\text{La réponse est non.}}$

    **3.** On écrit $f = (1 + \varepsilon)g$, d'où $\ln f = \ln g + \ln(1 + \varepsilon)$, avec $\ln(1 + \varepsilon) \to 0$. Si $\ell \in [0\,,+\infty]$ et $\ell \neq 1$, alors $\ln g$ tend vers $\ln\ell \neq 0$ ou vers $\pm\infty$ ; dans les deux cas, $\frac{\ln(1 + \varepsilon)}{\ln g}$ tend vers $0$, et 
    $$\frac{\ln f}{\ln g} = 1 + \frac{\ln(1 + \varepsilon)}{\ln g} \longrightarrow 1, \qquad\text{soit}\qquad \boxed{\ln f \sim \ln g \text{ si } \ell \neq 1}$$
     Si $\ell = 1$, le résultat est faux : en $0$, $1 + x \sim 1 + 2x$, mais $\ln(1 + x) \sim x$ et $\ln(1 + 2x) \sim 2x$ ne sont pas équivalents. Le logarithme transforme un écart relatif petit en un écart absolu petit, qui n'est négligeable que si le logarithme lui-même ne tend pas vers $0$.
- id: "ma-10-09"
  feuille: "f-ma-10"
  numero: 9
  partie: "Relations de comparaison"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [relations de comparaison, équivalents, sommes]
  noeuds: [su-infinies, de-limite, n-sommes]
  notions: [negligeable]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On pose, pour $n \geqslant 1$, $S_{n} = \displaystyle\sum_{k=1}^{n} \frac{1}{\sqrt{k}}$.

    **1.** Montrer que, pour tout $n \geqslant 1$, $\dfrac{1}{\sqrt{n + 1}} \leqslant 2\big(\sqrt{n + 1} - \sqrt{n}\big) \leqslant \dfrac{1}{\sqrt{n}}$.

    **2.** En déduire un encadrement de $S_{n}$, puis que $S_{n} \sim 2\sqrt{n}$.
  corrige: |
    **1.** Par la quantité conjuguée, 
    $$2\Big(\sqrt{n + 1} - \sqrt{n}\Big) = \frac{2}{\sqrt{n + 1} + \sqrt{n}}.$$
     Comme $2\sqrt{n} \leqslant \sqrt{n + 1} + \sqrt{n} \leqslant 2\sqrt{n + 1}$, on obtient 
    $$\boxed{\frac{1}{\sqrt{n + 1}} \leqslant 2\Big(\sqrt{n + 1} - \sqrt{n}\Big) \leqslant \frac{1}{\sqrt{n}}}$$

    **2.** La majoration, sommée de $k = 1$ à $n$, donne $S_{n} \geqslant 2\Big(\sqrt{n + 1} - 1\Big)$, par télescopage. La minoration, appliquée à $k - 1$ pour $2 \leqslant k \leqslant n$, donne $\frac{1}{\sqrt{k}} \leqslant 2\Big(\sqrt{k} - \sqrt{k - 1}\Big)$, d'où $S_{n} \leqslant 1 + 2\Big(\sqrt{n} - 1\Big)$. Ainsi 
    $$2\sqrt{n + 1} - 2 \leqslant S_{n} \leqslant 2\sqrt{n} - 1.$$
     Les deux bornes sont équivalentes à $2\sqrt{n}$, et la proposition 6 (encadrement) donne $\boxed{S_{n} \sim 2\sqrt{n}}$. En particulier, $S_{n}$ tend vers $+\infty$.
