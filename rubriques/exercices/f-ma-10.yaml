  notions: [suite, negligeable, limite-fonction]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    **1.** Montrer que, pour tout $n \in \mathbb{N}^{*}$, l'équation $x - \ln x = n$ admet une unique solution $x_{n}$ dans $]0\,,1]$.

    **2.** Montrer que $\lim\limits_{n \to +\infty} x_{n} = 0$, puis que $x_{n} = \mathrm{e}^{-n}\mathrm{e}^{x_{n}}$, et en déduire que $x_{n} \sim \mathrm{e}^{-n}$.

    **3.** Montrer que $x_{n} = \mathrm{e}^{-n} + \mathrm{e}^{-2n} + \frac{3}{2}\mathrm{e}^{-3n} + o(\mathrm{e}^{-3n})$.
  corrige: |
    **1.** La fonction $\psi : x \mapsto x - \ln x$ a pour dérivée $1 - \frac{1}{x} < 0$ sur $]0\,,1[$ : elle est continue, strictement décroissante sur $]0\,,1]$, de $+\infty$ à $\psi(1) = 1$. Elle réalise une bijection de $]0\,,1]$ sur $[1\,,+\infty[$, qui contient $n$. $\boxed{x_{n} \text{ existe et est unique}}$

    **2.** L'équation s'écrit $\ln x_{n} = x_{n} - n$, soit $x_{n} = \mathrm{e}^{-n}\mathrm{e}^{x_{n}}$. Comme $x_{n} \leqslant 1$, on a $0 < x_{n} \leqslant \mathrm{e}^{1-n}$, donc $x_{n} \to 0$, puis $\mathrm{e}^{x_{n}} \to 1$ et $\boxed{x_{n} \sim \mathrm{e}^{-n}}$.

    **3.** On réinjecte dans $x_{n} = \mathrm{e}^{-n}\mathrm{e}^{x_{n}}$. D'abord $\mathrm{e}^{x_{n}} = 1 + x_{n} + o(x_{n}) = 1 + \mathrm{e}^{-n} + o(\mathrm{e}^{-n})$, d'où $x_{n} = \mathrm{e}^{-n} + \mathrm{e}^{-2n} + o(\mathrm{e}^{-2n})$. Ensuite $\mathrm{e}^{x_{n}} = 1 + x_{n} + \frac{x_{n}^{2}}{2} + o(x_{n}^{2}) = 1 + \mathrm{e}^{-n} + \frac{3}{2}\mathrm{e}^{-2n} + o(\mathrm{e}^{-2n})$, et 
    $$\boxed{x_{n} = \mathrm{e}^{-n} + \mathrm{e}^{-2n} + \frac{3}{2}\mathrm{e}^{-3n} + o(\mathrm{e}^{-3n})}$$
     Chaque réinjection gagne un ordre : c'est la méthode du point fixe, appliquée aux développements.
- id: "ma-10-41"
  feuille: "f-ma-10"
  numero: 41
  partie: "Suites et développements asymptotiques"
  etoiles: 3
