  enonce: |
    Soit $u_{0} > 0$ et $u_{n+1} = u_{n} + \dfrac{1}{u_{n}}$. Montrer que $\lim\limits_{n \to +\infty} u_{n} = +\infty$, puis déterminer un équivalent de $u_{n}$ en étudiant $u_{n+1}^{2} - u_{n}^{2}$.
  corrige: |
    La suite est strictement positive et croissante, puisque $u_{n+1} - u_{n} = \frac{1}{u_{n}} > 0$. Si elle convergeait vers $\ell > 0$, on aurait $\ell = \ell + \frac{1}{\ell}$, ce qui est absurde : $u_{n} \to +\infty$. Alors 
    $$u_{n+1}^{2} - u_{n}^{2} = 2 + \frac{1}{u_{n}^{2}} \longrightarrow 2,$$
     et le lemme de Cesàro donne $\frac{u_{n}^{2}}{n} \to 2$ : $\boxed{u_{n} \sim \sqrt{2n}}$. L'astuce est d'élever au carré : la relation de récurrence, inutilisable telle quelle, devient presque arithmétique.
- id: "ma-10-44"
  feuille: "f-ma-10"
  numero: 44
  partie: "Suites et développements asymptotiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [développements asymptotiques, négligeabilité, calcul de limites, suites récurrentes]
  noeuds: [su-infinies, su-convergence, de-limite]
  notions: [suite, negligeable, limite-fonction]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    Soit $x_{0} \in \mathbb{R}$ et $x_{n+1} = x_{n} + \mathrm{e}^{-x_{n}}$. Montrer que $\lim\limits_{n \to +\infty} x_{n} = +\infty$, puis que $\mathrm{e}^{x_{n+1}} - \mathrm{e}^{x_{n}}$ tend vers $1$, et en déduire que $x_{n} = \ln n + o(1)$.
  corrige: |
    La suite est croissante, puisque $\mathrm{e}^{-x_{n}} > 0$. Si elle était majorée, elle convergerait vers un réel $\ell$ tel que $\ell = \ell + \mathrm{e}^{-\ell}$, ce qui est impossible : $x_{n} \to +\infty$. Ensuite 
    $$\mathrm{e}^{x_{n+1}} - \mathrm{e}^{x_{n}} = \mathrm{e}^{x_{n}}\big(\mathrm{e}^{\mathrm{e}^{-x_{n}}} - 1\big) = \mathrm{e}^{x_{n}}\big(\mathrm{e}^{-x_{n}} + O(\mathrm{e}^{-2x_{n}})\big) = 1 + O(\mathrm{e}^{-x_{n}}) \longrightarrow 1.$$
     Par le lemme de Cesàro, $\mathrm{e}^{x_{n}} \sim n$, et en prenant le logarithme, $x_{n} = \ln n + \ln\frac{\mathrm{e}^{x_{n}}}{n}$, où le second terme tend vers $0$. 
    $$\boxed{x_{n} = \ln n + o(1)}$$
- id: "ma-10-45"
  feuille: "f-ma-10"
  numero: 45
  partie: "Suites et développements asymptotiques"
  etoiles: 3
