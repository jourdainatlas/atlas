  notions: [formule-taylor-young]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *Astucieux.* Déterminer le développement limité à l'ordre $12$ en $0$ de $x \mapsto \ln\Big(\displaystyle\sum_{k=0}^{11} \frac{x^{k}}{k!}\Big)$. On pourra écrire la somme sous la forme $\mathrm{e}^{x} - R(x)$.
  corrige: |
    On pose $R(x) = \mathrm{e}^{x} - \sum_{k=0}^{11} \frac{x^{k}}{k!}$. Par le développement de $\exp$ à l'ordre $12$, $R(x) = \frac{x^{12}}{12!} + o(x^{12})$. Alors 
    $$\ln\Big(\sum_{k=0}^{11} \frac{x^{k}}{k!}\Big) = \ln\big(\mathrm{e}^{x} - R(x)\big) = x + \ln\big(1 - \mathrm{e}^{-x}R(x)\big),$$
     et $\mathrm{e}^{-x}R(x) = \frac{x^{12}}{12!} + o(x^{12})$ tend vers $0$, donc $\ln\big(1 - \mathrm{e}^{-x}R(x)\big) = -\frac{x^{12}}{12!} + o(x^{12})$. 
    $$\boxed{\ln\Big(\sum_{k=0}^{11} \frac{x^{k}}{k!}\Big) = x - \frac{x^{12}}{12!} + o(x^{12})}$$
     Un calcul direct, en composant $\ln(1 + u)$ avec un polynôme de degré $11$, serait interminable : tous les termes intermédiaires se compensent.
- id: "ma-10-24"
  feuille: "f-ma-10"
  numero: 24
  partie: "Développements limités"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [développements limités, négligeabilité, "développement d'une réciproque"]
  noeuds: [de-dl1, de-taylor, su-infinies, de-reciproque]
  notions: [formule-taylor-young, negligeable]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Développement d'une réciproque.*

    **1.** Montrer que $f : x \mapsto x\,\mathrm{e}^{x^{2}}$ réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$, et que $f^{-1}$ est de classe $\mathcal{C}^{\infty}$ et impaire.

    **2.** Justifier que $f^{-1}$ admet un développement limité à l'ordre $5$ en $0$ de la forme $ax + bx^{3} + cx^{5} + o(x^{5})$, et déterminer $a$, $b$, $c$ à l'aide de l'égalité $f^{-1}\big(f(x)\big) = x$.

    **3.** Déterminer de même le développement limité à l'ordre $3$ en $0$ de la réciproque de $x \mapsto 2x + \sin x$.
  corrige: |
    **1.** La fonction $f$ est de classe $\mathcal{C}^{\infty}$, avec $f'(x) = (1 + 2x^{2})\mathrm{e}^{x^{2}} > 0$ ; elle est strictement croissante, de limites $\pm\infty$ en $\pm\infty$, et réalise une bijection de $\mathbb{R}$ sur $\mathbb{R}$. Comme $f'$ ne s'annule pas, $f^{-1}$ est de classe $\mathcal{C}^{\infty}$ (chapitre 9, proposition 4). Enfin $f$ est impaire, donc $f^{-1}$ aussi : si $y = f(x)$, alors $-y = f(-x)$. $\boxed{f^{-1} \text{ est } \mathcal{C}^{\infty} \text{ et impaire}}$

    **2.** Par la formule de Taylor-Young et la proposition 9, $f^{-1}(y) = ay + by^{3} + cy^{5} + o(y^{5})$. Comme $f(x) = x + x^{3} + \frac{x^{5}}{2} + o(x^{5})$ tend vers $0$, on peut composer : 
    $$x = f^{-1}\big(f(x)\big) = ax + (a + b)x^{3} + \Big(\frac{a}{2} + 3b + c\Big)x^{5} + o(x^{5}),$$
     où l'on a utilisé $f(x)^{3} = x^{3} + 3x^{5} + o(x^{5})$. Par unicité, $a = 1$, $a + b = 0$ et $\frac{a}{2} + 3b + c = 0$. 
    $$\boxed{f^{-1}(y) = y - y^{3} + \frac{5}{2}y^{5} + o(y^{5})}$$

    **3.** La fonction $g : x \mapsto 2x + \sin x$ a pour dérivée $2 + \cos x \geqslant 1$ : c'est une bijection de $\mathbb{R}$ sur $\mathbb{R}$, de réciproque $\mathcal{C}^{\infty}$ et impaire, de la forme $ay + by^{3} + o(y^{3})$. Avec $g(x) = 3x - \frac{x^{3}}{6} + o(x^{3})$, l'égalité $g^{-1}(g(x)) = x$ donne $3a = 1$ et $-\frac{a}{6} + 27b = 0$. 
    $$\boxed{g^{-1}(y) = \frac{y}{3} + \frac{y^{3}}{486} + o(y^{3})}$$
- id: "ma-10-25"
  feuille: "f-ma-10"
  numero: 25
  partie: "Développements limités"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [développements limités]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Par une équation différentielle.* Soit $f : x \mapsto \dfrac{\operatorname{Arcsin} x}{\sqrt{1 - x^{2}}}$ sur $]-1\,,1[$.

    **1.** Montrer que $f$ est solution de l'équation $(1 - x^{2})y' - xy = 1$.

    **2.** Justifier que $f$ admet un développement limité à tout ordre en $0$, et qu'il ne contient que des puissances impaires de $x$.

    **3.** En reportant ce développement dans l'équation, déterminer le développement limité de $f$ à l'ordre $7$ en $0$.
  corrige: |
    **1.** Pour $|x| < 1$, la dérivée d'un quotient donne 
    $$f'(x) = \frac{1}{1 - x^{2}} + \frac{x\operatorname{Arcsin} x}{(1 - x^{2})^{3/2}}, \qquad\text{donc}\qquad (1 - x^{2})f'(x) = 1 + x\,f(x).$$

    $$\boxed{(1 - x^{2})f' - xf = 1}$$

    **2.** La fonction $f$ est de classe $\mathcal{C}^{\infty}$ sur $]-1\,,1[$ : la formule de Taylor-Young lui donne un développement limité à tout ordre. Elle est impaire, comme quotient d'une fonction impaire par une fonction paire, donc ses coefficients d'indice pair sont nuls. $\boxed{f(x) = \sum a_{2k+1}x^{2k+1} + o(x^{2n+2})}$

    **3.** La fonction $f'$ est aussi de classe $\mathcal{C}^{\infty}$, et la formule de Taylor-Young montre que son développement s'obtient en dérivant terme à terme celui de $f$, puisque $(f')^{(k)}(0) = f^{(k+1)}(0)$. En reportant dans l'équation, le coefficient de $x^{2k}$ donne 
    $$(2k + 1)a_{2k+1} - (2k - 1)a_{2k-1} - a_{2k-1} = 0 \quad (k \geqslant 1), \qquad a_{1} = 1,$$
     soit $a_{2k+1} = \frac{2k}{2k + 1}a_{2k-1}$. Ainsi $a_{3} = \frac{2}{3}$, $a_{5} = \frac{4}{5} \cdot \frac{2}{3} = \frac{8}{15}$ et $a_{7} = \frac{6}{7} \cdot \frac{8}{15} = \frac{16}{35}$. 
    $$\boxed{\frac{\operatorname{Arcsin} x}{\sqrt{1 - x^{2}}} = x + \frac{2x^{3}}{3} + \frac{8x^{5}}{15} + \frac{16x^{7}}{35} + o(x^{8})}$$
     Le calcul par produit des développements de $\operatorname{Arcsin}$ et de $(1 - x^{2})^{-1/2}$ donnerait le même résultat, au prix de beaucoup plus de termes.
- id: "ma-10-26"
  feuille: "f-ma-10"
  numero: 26
  partie: "Développements limités"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [développements limités, négligeabilité]
  noeuds: [de-dl1, de-taylor, su-infinies]
  notions: [formule-taylor-young, negligeable]
  page_enonce: 5
  page_corrige: 13
  enonce: |
    *Développements limités et régularité.*

    **1.** Une fonction paire telle que $f(x) = 1 + x^{2} + o(x^{2})$ au voisinage de $0$ vérifie-t-elle nécessairement $f(x) = 1 + x^{2} + o(x^{3})$ ?

    **2.** Soit $f$ définie sur $\mathbb{R}$ par $f(0) = 0$ et $f(x) = \mathrm{e}^{-1/x^{2}}\cos\big(\mathrm{e}^{1/x^{2}}\big)$ pour $x \neq 0$. Montrer que $f(x) = o(x^{n})$ en $0$ pour tout $n \in \mathbb{N}$, puis que $f$ est dérivable sur $\mathbb{R}$ mais n'est pas de classe $\mathcal{C}^{1}$.
  corrige: |
    **1.** Non. La fonction $f : x \mapsto 1 + x^{2} + |x|^{5/2}$ est paire et vérifie $f(x) = 1 + x^{2} + o(x^{2})$, puisque $\frac{|x|^{5/2}}{x^{2}} = |x|^{1/2} \to 0$ ; mais $\frac{|x|^{5/2}}{|x|^{3}} = |x|^{-1/2}$ tend vers $+\infty$, donc $f(x) - 1 - x^{2}$ n'est pas un $o(x^{3})$. $\boxed{\text{La réponse est non.}}$ La proposition 9 ne s'applique qu'à une fonction qui *admet* un développement à l'ordre $3$ ; la parité ne crée pas ce développement.

    **2.** Pour $x \neq 0$, $|f(x)| \leqslant \mathrm{e}^{-1/x^{2}}$, et $\frac{\mathrm{e}^{-1/x^{2}}}{|x|^{n}} = \frac{u^{n/2}}{\mathrm{e}^{u}}$ avec $u = \frac{1}{x^{2}}$, qui tend vers $0$ par croissances comparées : $\boxed{f(x) = o(x^{n}) \text{ pour tout } n}$. En particulier $\frac{f(x)}{x}$ tend vers $0$, et $f$ est dérivable en $0$ avec $f'(0) = 0$ ; elle l'est aussi sur $\mathbb{R}^{*}$, avec 
    $$f'(x) = \frac{2}{x^{3}}\,\mathrm{e}^{-1/x^{2}}\cos\big(\mathrm{e}^{1/x^{2}}\big) + \frac{2}{x^{3}}\sin\big(\mathrm{e}^{1/x^{2}}\big).$$
     Le premier terme tend vers $0$. Le second n'a pas de limite : aux points $x_{k} = (\ln(\frac{\pi}{2} + 2k\pi))^{-1/2}$, qui tendent vers $0$, il vaut $\frac{2}{x_{k}^{3}} \to +\infty$. $\boxed{f \text{ est dérivable sur } \mathbb{R} \text{ mais pas de classe } \mathcal{C}^{1}}$

    *À retenir.* Une fonction peut avoir un développement limité nul à tout ordre sans être deux fois dérivable : les développements limités ne contrôlent que la taille de $f$, pas ses oscillations. C'est l'inverse de la fonction plate du chapitre 9, qui est de classe $\mathcal{C}^{\infty}$.
- id: "ma-10-27"
  feuille: "f-ma-10"
  numero: 27
  partie: "Applications à l'étude locale"
  etoiles: 1
  types: [Calcul]
  mots_cles: [étude locale, calcul de limites]
  noeuds: [de-dl1, de-taylor, de-limite, tg-arctan]
  notions: [formule-taylor-young, limite-fonction, arc-tangente, cosinus-sinus]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Calculer les limites suivantes à l'aide de développements limités.

    **(a)** $\lim\limits_{x \to 0} \dfrac{1 + \ln(1 + x) - \mathrm{e}^{x}}{1 - \cos x}$

    **(b)** $\lim\limits_{x \to 0} \dfrac{\ln(1 + x) - \sin x}{x^{2}}$

    **(c)** $\lim\limits_{x \to 0} \dfrac{2x}{\ln\big(\frac{1 + x}{1 - x}\big)}$

    **(d)** $\lim\limits_{x \to 0} \dfrac{x - \operatorname{Arctan} x}{\sin^{3}x}$

    **(e)** $\lim\limits_{x \to 1} \dfrac{\ln(2x^{2} - 1)}{\tan(x - 1)}$

    **(f)** $\lim\limits_{x \to 1} \dfrac{x^{3} + 7x^{2} - 8}{x^{4} + x^{3} - 2}$
  corrige: |
    Dans chaque cas, on développe numérateur et dénominateur jusqu'à leur premier terme non nul, et la proposition 13 fournit des équivalents.

    **(a)** $1 + \ln(1 + x) - \mathrm{e}^{x} = 1 + \Big(x - \frac{x^{2}}{2}\Big) - \Big(1 + x + \frac{x^{2}}{2}\Big) + o(x^{2}) = -x^{2} + o(x^{2})$, et $1 - \cos x \sim \frac{x^{2}}{2}$ : la limite vaut $\boxed{-2}$.

    **(b)** $\ln(1 + x) - \sin x = -\frac{x^{2}}{2} + o(x^{2})$ : $\boxed{-\frac{1}{2}}$.

    **(c)** $\ln\frac{1 + x}{1 - x} = \ln(1 + x) - \ln(1 - x) = 2x + \frac{2x^{3}}{3} + o(x^{3}) \sim 2x$ : $\boxed{1}$.

    **(d)** $x - \operatorname{Arctan} x = \frac{x^{3}}{3} + o(x^{3})$ et $\sin^{3}x \sim x^{3}$ : $\boxed{\frac{1}{3}}$.

    **(e)** On pose $x = 1 + h$ : $2x^{2} - 1 = 1 + 4h + 2h^{2}$, donc $\ln(2x^{2} - 1) \sim 4h$, et $\tan h \sim h$ : $\boxed{4}$.

    **(f)** Les deux polynômes s'annulent en $1$ ; on factorise : $x^{3} + 7x^{2} - 8 = (x - 1)(x^{2} + 8x + 8)$ et $x^{4} + x^{3} - 2 = (x - 1)(x^{3} + 2x^{2} + 2x + 2)$. Le quotient tend vers $\frac{17}{7}$ : $\boxed{\frac{17}{7}}$. C'est un développement à l'ordre $1$ en $1$ de chacun des polynômes, de dérivées $17$ et $7$.
- id: "ma-10-28"
  feuille: "f-ma-10"
  numero: 28
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, équivalents]
  noeuds: [de-dl1, de-taylor, su-infinies]
  notions: [formule-taylor-young]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Déterminer un équivalent simple, au voisinage de $0$, de 
    $$\operatorname{sh}(\sin x) - \sin(\operatorname{sh} x), \qquad \ln(1 + x) - x + \frac{x^{2}}{2}, \qquad\text{et, pour } x > 0, \quad x^{\sin x} - (\sin x)^{x}.$$
  corrige: |
    **Première fonction.** En composant les développements de $\operatorname{sh}$ et de $\sin$ à l'ordre $7$, on obtient 
    $$\operatorname{sh}(\sin x) = x - \frac{x^{5}}{15} + \frac{x^{7}}{90} + o(x^{8}), \qquad \sin(\operatorname{sh} x) = x - \frac{x^{5}}{15} - \frac{x^{7}}{90} + o(x^{8}).$$
     Les termes se compensent jusqu'à l'ordre $5$, et 
    $$\boxed{\operatorname{sh}(\sin x) - \sin(\operatorname{sh} x) \sim \frac{x^{7}}{45}}$$
     Il faut donc pousser les deux développements jusqu'à l'ordre $7$ avant de voir apparaître quoi que ce soit.

    **Deuxième fonction.** $\ln(1 + x) - x + \frac{x^{2}}{2} = \frac{x^{3}}{3} + o(x^{3})$, d'où $\boxed{\ln(1 + x) - x + \frac{x^{2}}{2} \sim \frac{x^{3}}{3}}$.

    **Troisième fonction.** On pose $A = \sin x\,\ln x$ et $B = x\ln(\sin x)$, qui tendent vers $0$ quand $x \to 0^{+}$. Alors $x^{\sin x} - (\sin x)^{x} = \mathrm{e}^{A} - \mathrm{e}^{B} = \mathrm{e}^{B}\big(\mathrm{e}^{A - B} - 1\big) \sim A - B$. Or 
    $$A - B = (\sin x - x)\ln x - x\ln\frac{\sin x}{x} = -\frac{x^{3}}{6}\ln x\,\big(1 + o(1)\big) + \frac{x^{3}}{6} + o(x^{3}),$$
     et $x^{3} = o(x^{3}\ln x)$. 
    $$\boxed{x^{\sin x} - (\sin x)^{x} \underset{x \to 0^{+}}{\sim} -\frac{x^{3}\ln x}{6}}$$
     L'équivalent est positif pour $0 < x < 1$ : la fonction $x^{\sin x}$ est au-dessus de $(\sin x)^{x}$ près de $0$.
- id: "ma-10-29"
  feuille: "f-ma-10"
  numero: 29
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, position par rapport à la tangente]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Tangente et position.* Pour chacune des fonctions suivantes, déterminer la tangente à la courbe au point d'abscisse $0$ et la position de la courbe par rapport à cette tangente au voisinage de $0$.

    **(a)** $x \mapsto \dfrac{1}{1 + \mathrm{e}^{x}}$

    **(b)** $x \mapsto \ln(x^{2} + 2x + 2)$

    **(c)** $x \mapsto \dfrac{x^{2}}{\mathrm{e}^{x} - \mathrm{e}^{-x}}$

    Pour (c), on précisera d'abord comment prolonger la fonction en $0$.
  corrige: |
    On applique la proposition 14 : le premier terme de degré au moins $2$ du développement décide de la position.

    **(a)** On a $\frac{1}{1 + \mathrm{e}^{x}} = \frac{1}{2} - \frac{x}{4} + \frac{x^{3}}{48} + o(x^{3})$, le terme en $x^{2}$ étant nul car $\frac{1}{1 + \mathrm{e}^{x}} - \frac{1}{2}$ est impaire. 
    $$\boxed{\text{tangente } y = \frac{1}{2} - \frac{x}{4} ; \text{ la courbe la traverse en } 0}$$
     au-dessous pour $x < 0$ et au-dessus pour $x > 0$, puisque l'écart est équivalent à $\frac{x^{3}}{48}$.

    **(b)** On écrit $\ln(x^{2} + 2x + 2) = \ln 2 + \ln(1 + u)$ avec $u = x + \frac{x^{2}}{2}$, et 
    $$\ln(1 + u) = u - \frac{u^{2}}{2} + \frac{u^{3}}{3} + o(x^{3}) = x - \frac{x^{3}}{6} + o(x^{3}).$$

    $$\boxed{\text{tangente } y = \ln 2 + x ; \text{ la courbe la traverse en } 0}$$
     au-dessus pour $x < 0$ et au-dessous pour $x > 0$.

    **(c)** Pour $x \neq 0$, on écrit $\frac{x^{2}}{\mathrm{e}^{x} - \mathrm{e}^{-x}} = \frac{x}{2} \cdot \frac{x}{\operatorname{sh} x}$, qui tend vers $0$ : on prolonge par $f(0) = 0$. Comme $\frac{x}{\operatorname{sh} x} = 1 - \frac{x^{2}}{6} + o(x^{2})$, 
    $$\boxed{f(x) = \frac{x}{2} - \frac{x^{3}}{12} + o(x^{3}) ; \text{ tangente } y = \frac{x}{2}, \text{ traversée en } 0}$$
     au-dessus pour $x < 0$ et au-dessous pour $x > 0$. Les trois exemples ont un point d'inflexion en $0$, ce qui n'est pas un hasard : à une constante près, ce sont des fonctions impaires.
- id: "ma-10-30"
  feuille: "f-ma-10"
  numero: 30
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, position par rapport à la tangente]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Étudier au voisinage de $0$ la fonction $f : x \mapsto \dfrac{1}{x} - \dfrac{1}{\operatorname{Arcsin} x}$ : est-elle prolongeable par continuité ? Le prolongement est-il dérivable ? Quelle est la position de sa courbe par rapport à sa tangente ?
  corrige: |
    Avec $\operatorname{Arcsin} x = x\Big(1 + \frac{x^{2}}{6} + \frac{3x^{4}}{40} + o(x^{4})\Big)$, on obtient $\frac{1}{\operatorname{Arcsin} x} = \frac{1}{x}\Big(1 - \frac{x^{2}}{6} + \Big(\frac{1}{36} - \frac{3}{40}\Big)x^{4} + o(x^{4})\Big)$, d'où 
    $$\frac{1}{x} - \frac{1}{\operatorname{Arcsin} x} = \frac{x}{6} + \frac{17x^{3}}{360} + o(x^{3}).$$
     La fonction tend vers $0$ : elle se prolonge par continuité en posant $f(0) = 0$. Le prolongement admet un développement limité à l'ordre $1$, donc il est dérivable en $0$, avec $f'(0) = \frac{1}{6}$ (proposition 10). 
    $$\boxed{f(0) = 0, \quad f'(0) = \frac{1}{6}, \quad \text{tangente } y = \frac{x}{6}, \text{ traversée en } 0}$$
     L'écart est équivalent à $\frac{17x^{3}}{360}$ : la courbe est au-dessous de sa tangente pour $x < 0$ et au-dessus pour $x > 0$.
- id: "ma-10-31"
  feuille: "f-ma-10"
  numero: 31
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [étude locale, extrema]
  noeuds: [de-dl1, de-taylor, de-extremum]
  notions: [formule-taylor-young, extremum-local, point-critique]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    *Nature d'un point critique.* Pour $a \in \mathbb{R}$, on pose $f_{a}(x) = \ln(1 + x) - x + ax^{2}$ sur $]-1\,,+\infty[$. Montrer que $0$ est un point critique de $f_{a}$, et déterminer selon $a$ si $f_{a}$ admet en $0$ un minimum local, un maximum local, ou aucun extremum.
  corrige: |
    On a $f_{a}(x) = \Big(x - \frac{x^{2}}{2} + \frac{x^{3}}{3}\Big) - x + ax^{2} + o(x^{3}) = \Big(a - \frac{1}{2}\Big)x^{2} + \frac{x^{3}}{3} + o(x^{3})$. Le coefficient de $x$ est nul, donc $f_{a}'(0) = 0$ : $0$ est un point critique, et $f_{a}''(0) = 2a - 1$.

    • Si $a > \frac{1}{2}$, alors $f_{a}''(0) > 0$ : minimum local strict (proposition 15).

    • Si $a < \frac{1}{2}$, alors $f_{a}''(0) < 0$ : maximum local strict.

    • Si $a = \frac{1}{2}$, alors $f_{a}(x) - f_{a}(0) \sim \frac{x^{3}}{3}$ change de signe en $0$ : pas d'extremum.

    $$\boxed{a > \frac{1}{2} : \text{minimum} ; \quad a < \frac{1}{2} : \text{maximum} ; \quad a = \frac{1}{2} : \text{aucun extremum}}$$
     Le cas limite est exactement celui où la condition d'ordre $2$ ne permet pas de conclure, et où le terme d'ordre $3$ prend le relais.
- id: "ma-10-32"
  feuille: "f-ma-10"
  numero: 32
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, asymptotes]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 6
  page_corrige: 15
  enonce: |
    *Asymptotes.* Pour chacune des fonctions suivantes, déterminer l'asymptote de sa courbe en $+\infty$ et la position de la courbe par rapport à cette asymptote.

    **(a)** $x \mapsto (x + 1)\,\mathrm{e}^{1/x}$

    **(b)** $x \mapsto x^{2}\ln\Big(\dfrac{x + 1}{x}\Big)$

    **(c)** $x \mapsto \dfrac{x + 1}{1 + \mathrm{e}^{1/x}}$

    **(d)** $x \mapsto x\exp\Big(\dfrac{2x}{x^{2} - 1}\Big)$

    **(e)** $x \mapsto \sqrt[3]{(x^{2} - 2)(x + 3)}$
  corrige: |
    Dans chaque cas, on pose $t = \frac{1}{x} \to 0^{+}$ et l'on développe jusqu'au premier terme qui tend vers $0$.

    **(a)** $(x + 1)\mathrm{e}^{t} = (x + 1)\Big(1 + t + \frac{t^{2}}{2} + o(t^{2})\Big) = x + 2 + \frac{3}{2x} + o\Big(\frac{1}{x}\Big)$ : asymptote $y = x + 2$, courbe au-dessus.

    **(b)** $x^{2}\ln(1 + t) = x^{2}\Big(t - \frac{t^{2}}{2} + \frac{t^{3}}{3} + o(t^{3})\Big) = x - \frac{1}{2} + \frac{1}{3x} + o\Big(\frac{1}{x}\Big)$ : asymptote $y = x - \frac{1}{2}$, courbe au-dessus.

    **(c)** Avec $\frac{1}{1 + \mathrm{e}^{t}} = \frac{1}{2} - \frac{t}{4} + o(t^{2})$ (exercice 29), 
    $$\frac{x + 1}{1 + \mathrm{e}^{t}} = (x + 1)\Big(\frac{1}{2} - \frac{1}{4x} + o\Big(\frac{1}{x^{2}}\Big)\Big) = \frac{x}{2} + \frac{1}{4} - \frac{1}{4x} + o\Big(\frac{1}{x}\Big) :$$
     asymptote $y = \frac{x}{2} + \frac{1}{4}$, courbe au-dessous.

    **(d)** $\frac{2x}{x^{2} - 1} = \frac{2t}{1 - t^{2}} = 2t + o(t^{2})$, donc $\exp\Big(\frac{2x}{x^{2} - 1}\Big) = 1 + 2t + 2t^{2} + o(t^{2})$, et la fonction vaut $x + 2 + \frac{2}{x} + o\Big(\frac{1}{x}\Big)$ : asymptote $y = x + 2$, courbe au-dessus.

    **(e)** $\sqrt[3]{(x^{2} - 2)(x + 3)} = x\big(1 + 3t - 2t^{2} + O(t^{3})\big)^{1/3} = x\Big(1 + t - \frac{5}{3}t^{2} + o(t^{2})\Big) = x + 1 - \frac{5}{3x} + o\Big(\frac{1}{x}\Big)$ : asymptote $y = x + 1$, courbe au-dessous. 
    $$\boxed{\begin{array}{c|c|c|c|c|c} & (a) & (b) & (c) & (d) & (e) \\ \hline \text{asymptote} & y = x + 2 & y = x - \frac{1}{2} & y = \frac{x}{2} + \frac{1}{4} & y = x + 2 & y = x + 1 \\ \text{position} & \text{au-dessus} & \text{au-dessus} & \text{au-dessous} & \text{au-dessus} & \text{au-dessous} \end{array}}$$
- id: "ma-10-33"
  feuille: "f-ma-10"
  numero: 33
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [étude locale, position par rapport à la tangente]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    *Quatre courbes.* On considère, au voisinage de $0^{+}$, les fonctions 
    $$f : x \mapsto \frac{1}{1 + x}, \qquad g : x \mapsto \mathrm{e}^{-x}, \qquad h : x \mapsto \sqrt{1 - 2\sin x}, \qquad k : x \mapsto \cos\sqrt{2x}.$$
     Montrer que leurs courbes ont la même tangente en $0$, et déterminer la position relative des quatre courbes au voisinage de $0^{+}$.
  corrige: |
    On développe les quatre fonctions à l'ordre $2$ en $0$ : 
    $$f(x) = 1 - x + x^{2} + o(x^{2}), \qquad g(x) = 1 - x + \frac{x^{2}}{2} + o(x^{2}),$$

    $$h(x) = \sqrt{1 - 2x + o(x^{2})} = 1 - x - \frac{x^{2}}{2} + o(x^{2}), \qquad k(x) = 1 - \frac{2x}{2} + \frac{4x^{2}}{24} + o(x^{2}) = 1 - x + \frac{x^{2}}{6} + o(x^{2}).$$
     Pour $h$, on a utilisé $\sin x = x + o(x^{2})$ et $\sqrt{1 + u} = 1 + \frac{u}{2} - \frac{u^{2}}{8} + o(u^{2})$ avec $u = -2x + o(x^{2})$ ; pour $k$, le développement de $\cos$ en $\sqrt{2x}$ fait apparaître des puissances entières de $x$. Les quatre courbes ont la même tangente $y = 1 - x$. Les différences sont équivalentes à des multiples positifs de $x^{2}$ : par exemple $f - g \sim \frac{x^{2}}{2}$, $g - k \sim \frac{x^{2}}{3}$, $k - h \sim \frac{2x^{2}}{3}$. 
    $$\boxed{\text{au voisinage de } 0^{+} : \ h < k < g < f}$$
     Toutes ces courbes collent à la même droite, mais s'en écartent avec des courbures différentes : le coefficient de $x^{2}$ mesure cet écartement.
- id: "ma-10-34"
  feuille: "f-ma-10"
  numero: 34
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, développements limités, sommes]
  noeuds: [de-dl1, de-taylor, n-sommes]
  notions: [formule-taylor-young]
  page_enonce: 7
  page_corrige: 16
  enonce: |
    *La somme des cubes.* Soit $n \geqslant 1$ et $f : x \mapsto \dfrac{\mathrm{e}^{(n+1)x} - 1}{\mathrm{e}^{x} - 1}$, prolongée par $f(0) = n + 1$.

    **1.** Écrire $f(x)$ comme une somme de $n + 1$ exponentielles, et en déduire le développement limité de $f$ à l'ordre $3$ en $0$, sous la forme d'une expression contenant les sommes $\sum k^{p}$.

    **2.** Calculer ce même développement à partir de l'expression de $f$ comme quotient, et en déduire la valeur de $\displaystyle\sum_{k=1}^{n} k^{3}$.
  corrige: |
    **1.** Par la somme géométrique, $f(x) = \sum_{k=0}^{n} \mathrm{e}^{kx}$ pour $x \neq 0$, et aussi pour $x = 0$. En développant chaque exponentielle, 
    $$f(x) = \sum_{k=0}^{n} \Big(1 + kx + \frac{k^{2}x^{2}}{2} + \frac{k^{3}x^{3}}{6}\Big) + o(x^{3}) = (n + 1) + \Big(\sum k\Big)x + \frac{1}{2}\Big(\sum k^{2}\Big)x^{2} + \frac{1}{6}\Big(\sum k^{3}\Big)x^{3} + o(x^{3}).$$

    **2.** À partir du quotient, en écrivant 
    $$\mathrm{e}^{(n+1)x} - 1 = (n + 1)x\Big(1 + \frac{(n + 1)x}{2} + \frac{(n + 1)^{2}x^{2}}{6} + \frac{(n + 1)^{3}x^{3}}{24}\Big) + o(x^{4})$$
     et de même pour $\mathrm{e}^{x} - 1$, puis en divisant, le calcul donne le coefficient de $x^{3}$ : 
    $$\frac{n^{4}}{24} + \frac{n^{3}}{12} + \frac{n^{2}}{24} = \frac{n^{2}(n + 1)^{2}}{24}.$$
     Par unicité du développement, $\frac{1}{6}\sum_{k=1}^{n} k^{3} = \frac{n^{2}(n + 1)^{2}}{24}$. 
    $$\boxed{\sum_{k=1}^{n} k^{3} = \frac{n^{2}(n + 1)^{2}}{4} = \Big(\frac{n(n + 1)}{2}\Big)^{2}}$$
     Les coefficients d'ordre $1$ et $2$ redonnent de même les sommes $\frac{n(n + 1)}{2}$ et $\frac{n(n + 1)(2n + 1)}{6}$ du chapitre 3.
- id: "ma-10-35"
  feuille: "f-ma-10"
  numero: 35
  partie: "Applications à l'étude locale"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [étude locale, développements limités]
  noeuds: [de-dl1, de-taylor]
  notions: [formule-taylor-young]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Compter avec un développement limité.*

    **1.** Déterminer le développement limité à l'ordre $10$ en $0$ de $u : x \mapsto \dfrac{1}{(1 - x)(1 - x^{2})(1 - x^{5})}$, en utilisant les développements de $\frac{1}{1 - y}$.

    **2.** En développant le produit, montrer que le coefficient de $x^{10}$ est le nombre de triplets $(a, b, c) \in \mathbb{N}^{3}$ tels que $a + 2b + 5c = 10$. Interpréter ce nombre en termes de pièces de $1$, $2$ et $5$ centimes.
  corrige: |
    **1.** On multiplie les trois développements $\frac{1}{1 - x} = \sum_{a=0}^{10} x^{a}$, $\frac{1}{1 - x^{2}} = \sum_{b=0}^{5} x^{2b}$ et $\frac{1}{1 - x^{5}} = 1 + x^{5} + x^{10}$, chacun à $o(x^{10})$ près, et l'on tronque au degré $10$ : 
    $$\boxed{u(x) = 1 + x + 2x^{2} + 2x^{3} + 3x^{4} + 4x^{5} + 5x^{6} + 6x^{7} + 7x^{8} + 8x^{9} + 10x^{10} + o(x^{10})}$$

    **2.** En développant le produit, chaque terme est de la forme $x^{a} \cdot x^{2b} \cdot x^{5c} = x^{a + 2b + 5c}$, et le coefficient de $x^{10}$ compte les triplets $(a, b, c)$ tels que $a + 2b + 5c = 10$. On les retrouve directement : pour $c = 0$, $b$ va de $0$ à $5$ ($6$ triplets) ; pour $c = 1$, $b$ va de $0$ à $2$ ($3$ triplets) ; pour $c = 2$, un seul. 
    $$\boxed{10 \text{ façons de payer } 10 \text{ centimes avec des pièces de } 1, 2 \text{ et } 5 \text{ centimes}}$$
     C'est l'idée des séries génératrices, que l'on reverra en dénombrement : un développement limité range un problème de comptage dans ses coefficients.
- id: "ma-10-36"
  feuille: "f-ma-10"
  numero: 36
  partie: "Applications à l'étude locale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [étude locale, négligeabilité]
  noeuds: [de-dl1, de-taylor, su-infinies]
  notions: [formule-taylor-young, negligeable]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Pour $n \geqslant 1$, on pose $u_{n} = \big(1 + \frac{1}{n}\big)^{n}$. Déterminer un développement de $\ln\frac{u_{n+1}}{u_{n}}$ à la précision $o\big(\frac{1}{n^{2}}\big)$, et en déduire que la suite $(u_{n})$ est croissante à partir d'un certain rang.
  corrige: |
    On a $\ln u_{n} = n\ln\Big(1 + \frac{1}{n}\Big) = 1 - \frac{1}{2n} + \frac{1}{3n^{2}} + O\Big(\frac{1}{n^{3}}\Big)$. Donc 
    $$\ln\frac{u_{n+1}}{u_{n}} = \frac{1}{2}\Big(\frac{1}{n} - \frac{1}{n + 1}\Big) + \frac{1}{3}\Big(\frac{1}{(n + 1)^{2}} - \frac{1}{n^{2}}\Big) + O\Big(\frac{1}{n^{3}}\Big) = \frac{1}{2n(n + 1)} + O\Big(\frac{1}{n^{3}}\Big),$$

    $$\boxed{\ln\frac{u_{n+1}}{u_{n}} = \frac{1}{2n^{2}} + o\Big(\frac{1}{n^{2}}\Big)}$$
     Par la proposition 13, ce logarithme est strictement positif à partir d'un certain rang : $(u_{n})$ est croissante à partir de ce rang. On sait en fait qu'elle est croissante dès $n = 1$, mais le développement donne en plus la vitesse : $\mathrm{e} - u_{n} \sim \frac{\mathrm{e}}{2n}$.
- id: "ma-10-37"
  feuille: "f-ma-10"
  numero: 37
  partie: "Applications à l'étude locale"
  etoiles: 3
  types: [Calcul]
  mots_cles: [étude locale, négligeabilité]
  noeuds: [de-dl1, de-taylor, su-infinies]
  notions: [formule-taylor-young, negligeable]
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Des points entiers.*

    **1.** Déterminer un développement de $\sqrt{x^{4} + x^{3} + 1}$ en $+\infty$, à la précision $o\big(\frac{1}{x}\big)$.

    **2.** En déduire que l'ensemble $E = \{(x, y) \in \mathbb{Z}^{2} \mid y^{2} = x^{4} + x^{3} + 1\}$ est fini. On traitera séparément les grandes valeurs de $x$ positives et négatives.
  corrige: |
    **1.** Pour $|x|$ grand, $\sqrt{x^{4} + x^{3} + 1} = x^{2}\sqrt{1 + t + t^{4}}$ avec $t = \frac{1}{x}$, et $\sqrt{1 + v} = 1 + \frac{v}{2} - \frac{v^{2}}{8} + \frac{v^{3}}{16} + o(v^{3})$ avec $v = t + t^{4}$ : 
    $$\boxed{\sqrt{x^{4} + x^{3} + 1} \underset{x \to \pm\infty}{=} x^{2} + \frac{x}{2} - \frac{1}{8} + \frac{1}{16x} + o\Big(\frac{1}{x}\Big)}$$

    **2.** Si $(x, y) \in E$, alors $(x, -y) \in E$, et l'on peut supposer $y \geqslant 0$, donc $y = \sqrt{x^{4} + x^{3} + 1}$. D'après la question 1, il existe $A$ tel que, pour $|x| \geqslant A$, $y = x^{2} + \frac{x}{2} - \frac{1}{8} + \varepsilon$ avec $|\varepsilon| < \frac{1}{8}$.

    • Si $x$ est pair, $N = x^{2} + \frac{x}{2}$ est un entier, et $y \in \,]N - \frac{1}{4}\,,N[$ n'est pas entier.

    • Si $x$ est impair, $x^{2} + \frac{x}{2} = M + \frac{1}{2}$ avec $M$ entier, et $y \in \,]M + \frac{1}{4}\,,M + \frac{1}{2}[$ n'est pas entier.

    Les éléments de $E$ ont donc $|x| < A$, et pour chacun de ces $x$, il y a au plus deux valeurs de $y$ : $\boxed{E \text{ est fini}}$. Une recherche par ordinateur pour $|x| \leqslant 200$ donne 
    $$E = \{(-2, \pm 3), (-1, \pm 1), (0, \pm 1), (2, \pm 5)\}.$$
- id: "ma-10-38"
  feuille: "f-ma-10"
  numero: 38
  partie: "Suites et développements asymptotiques"
