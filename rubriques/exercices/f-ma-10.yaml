  enonce: |
    Soit $u_{0} \in \big]0\,,\frac{1}{3}\big[$ et $u_{n+1} = u_{n} - 3u_{n}^{2}$.

    **1.** Montrer que $(u_{n})$ est à valeurs strictement positives et converge vers $0$.

    **2.** On pose $w_{n} = \dfrac{1}{u_{n}}$. Montrer que $w_{n+1} - w_{n} = 3 + 9u_{n} + O(u_{n}^{2})$, et en déduire que $u_{n} \sim \dfrac{1}{3n}$.

    **3.** Montrer que $w_{n+1} - w_{n} - 3 \sim \dfrac{3}{n}$, puis, à l'aide de l'exercice 11, que $w_{n} - 3n \sim 3\ln n$.

    **4.** En déduire un développement asymptotique de $u_{n}$ à deux termes.
  corrige: |
    **1.** La fonction $\varphi : u \mapsto u(1 - 3u)$ envoie $]0\,,\frac{1}{3}[$ dans $]0\,,\frac{1}{12}]$, son maximum étant $\varphi(\frac{1}{6}) = \frac{1}{12}$. Par récurrence, $u_{n} \in \,]0\,,\frac{1}{3}[$, et $u_{n+1} - u_{n} = -3u_{n}^{2} < 0$ : la suite décroît et converge vers $\ell$ tel que $\ell = \ell - 3\ell^{2}$, d'où $\boxed{\ell = 0}$.

    **2.** Avec $\frac{1}{1 - 3u} = 1 + 3u + 9u^{2} + O(u^{3})$, 
    $$w_{n+1} = \frac{1}{u_{n}(1 - 3u_{n})} = \frac{1}{u_{n}} + 3 + 9u_{n} + O(u_{n}^{2}), \qquad\text{soit}\qquad \boxed{w_{n+1} - w_{n} = 3 + 9u_{n} + O(u_{n}^{2})}$$
     Cette différence tend vers $3$ ; par le lemme de Cesàro, $w_{n} \sim 3n$, soit $\boxed{u_{n} \sim \frac{1}{3n}}$.

    **3.** On a $w_{n+1} - w_{n} - 3 = 9u_{n} + O(u_{n}^{2}) \sim 9u_{n} \sim \frac{3}{n}$. Cette suite est donc strictement positive à partir d'un certain rang, et la somme des $\frac{3}{k}$ tend vers $+\infty$ : l'exercice 11, appliqué à partir de ce rang, donne 
    $$w_{n} - w_{0} - 3n = \sum_{k=0}^{n-1} (w_{k+1} - w_{k} - 3) \sim 3\sum_{k=1}^{n-1} \frac{1}{k} \sim 3\ln n, \qquad\text{donc}\qquad \boxed{w_{n} - 3n \sim 3\ln n}$$
     la constante $w_{0}$ étant négligeable devant $\ln n$.

    **4.** On a $w_{n} = 3n + 3\ln n + o(\ln n)$, donc 
    $$u_{n} = \frac{1}{3n} \cdot \frac{1}{1 + \frac{\ln n}{n} + o\Big(\frac{\ln n}{n}\Big)}, \qquad \boxed{u_{n} = \frac{1}{3n} - \frac{\ln n}{3n^{2}} + o\Big(\frac{\ln n}{n^{2}}\Big)}$$
     *Piège.* Numériquement, la vérification est décevante : pour $n = 10^{6}$ et $u_{0} = 0{,}1$, on trouve $w_{n} - 3n \approx 48$, alors que $3\ln n \approx 41$. L'écart vient d'une constante, négligeable devant $\ln n$ mais encore visible : un équivalent ne dit rien de la vitesse à laquelle le rapport tend vers $1$.
- id: "ma-10-46"
  feuille: "f-ma-10"
  numero: 46
  partie: "Suites et développements asymptotiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [développements asymptotiques, négligeabilité, suites récurrentes]
  noeuds: [su-infinies, ar-suites]
  notions: [suite, negligeable]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    Soit $u_{0} = 0$ et $u_{n+1} = \sqrt{u_{n} + n^{2}}$.

    **1.** Montrer par récurrence que $n - 1 \leqslant u_{n} \leqslant n$ pour $n \geqslant 1$.

    **2.** En déduire que $u_{n+1} = n + \frac{1}{2} + o(1)$, puis que $u_{n} = n - \frac{1}{2} + o(1)$.

    **3.** Montrer que $u_{n} = n - \dfrac{1}{2} - \dfrac{3}{8n} + o\Big(\dfrac{1}{n}\Big)$.
  corrige: |
    **1.** On a $u_{1} = \sqrt{0 + 0} = 0$, et $0 \leqslant u_{1} \leqslant 1$. Si $n - 1 \leqslant u_{n} \leqslant n$, alors 
    $$n^{2} \leqslant n^{2} + n - 1 \leqslant u_{n} + n^{2} \leqslant n^{2} + n \leqslant (n + 1)^{2},$$
     donc $n \leqslant u_{n+1} \leqslant n + 1$. Par récurrence, $\boxed{n - 1 \leqslant u_{n} \leqslant n}$ pour tout $n \geqslant 1$.

    **2.** On écrit $u_{n+1} = n\sqrt{1 + v_{n}}$ avec $v_{n} = \frac{u_{n}}{n^{2}} = O\Big(\frac{1}{n}\Big)$, et $\sqrt{1 + v} = 1 + \frac{v}{2} + O(v^{2})$ : 
    $$u_{n+1} = n + \frac{u_{n}}{2n} + O\Big(\frac{1}{n}\Big) = n + \frac{1}{2} + O\Big(\frac{1}{n}\Big),$$
     puisque $\frac{u_{n}}{2n} = \frac{1}{2} + O\Big(\frac{1}{n}\Big)$ par la question 1. En remplaçant $n$ par $n - 1$, $\boxed{u_{n} = n - \frac{1}{2} + O\Big(\frac{1}{n}\Big)}$.

    **3.** On pousse d'un ordre : $v_{n} = \frac{1}{n} - \frac{1}{2n^{2}} + O\Big(\frac{1}{n^{3}}\Big)$ et $\sqrt{1 + v} = 1 + \frac{v}{2} - \frac{v^{2}}{8} + O(v^{3})$, d'où 
    $$u_{n+1} = n + \frac{1}{2} - \frac{1}{4n} - \frac{1}{8n} + O\Big(\frac{1}{n^{2}}\Big) = n + \frac{1}{2} - \frac{3}{8n} + O\Big(\frac{1}{n^{2}}\Big).$$
     En remplaçant $n$ par $n - 1$, et puisque $\frac{1}{n - 1} = \frac{1}{n} + O\Big(\frac{1}{n^{2}}\Big)$, 
    $$\boxed{u_{n} = n - \frac{1}{2} - \frac{3}{8n} + o\Big(\frac{1}{n}\Big)}$$
     Pour $n = 200$, la suite vaut $199{,}498\,115\,5$ et le développement $199{,}498\,125$ : l'écart est de l'ordre de $\frac{1}{n^{2}}$.
- id: "ma-10-47"
  feuille: "f-ma-10"
  numero: 47
  partie: "Suites et développements asymptotiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [développements asymptotiques, équivalents]
  noeuds: [su-infinies, ar-suites]
  notions: [suite, negligeable]
  page_enonce: 9
  page_corrige: 21
  enonce: |
    On considère la suite $(u_{n})_{n \geqslant 1}$ qui prend une fois la valeur $1$, deux fois la valeur $2$, trois fois la valeur $3$, et ainsi de suite : $1, 2, 2, 3, 3, 3, 4, \dots$ Montrer que $u_{n}$ est le plus petit entier $k$ tel que $\frac{k(k + 1)}{2} \geqslant n$, en déduire une expression de $u_{n}$, puis un équivalent.
  corrige: |
    Les valeurs $1, \dots, k - 1$ occupent $1 + 2 + \cdots + (k - 1) = \frac{k(k - 1)}{2}$ rangs, donc la valeur $k$ occupe les rangs $\frac{k(k - 1)}{2} + 1$ à $\frac{k(k + 1)}{2}$. Ainsi 
    $$u_{n} = k \iff \frac{k(k - 1)}{2} < n \leqslant \frac{k(k + 1)}{2},$$
     et $u_{n}$ est le plus petit entier $k$ tel que $\frac{k(k + 1)}{2} \geqslant n$. Pour obtenir une formule avec la partie entière, on écrit la condition comme $k(k - 1) \leqslant 2n - 2 < k(k + 1)$. Le trinôme $k^{2} - k - (2n - 2)$ a pour racine positive $r_{n} = \frac{1 + \sqrt{8n - 7}}{2}$, et la condition devient $k \leqslant r_{n} < k + 1$. 
    $$\boxed{u_{n} = \Big\lfloor \frac{1 + \sqrt{8n - 7}}{2} \Big\rfloor \sim \sqrt{2n}}$$
     L'équivalent vient de l'encadrement $r_{n} - 1 < u_{n} \leqslant r_{n}$, dont les deux bornes sont équivalentes à $\sqrt{2n}$. Pour $n = 1, 2, 3, 4$, la formule donne bien $1, 2, 2, 3$.
- id: "ma-10-48"
  feuille: "f-ma-10"
  numero: 48
  partie: "Suites et développements asymptotiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [développements asymptotiques, négligeabilité, sommes]
  noeuds: [su-infinies, ar-suites, n-sommes]
  notions: [suite, negligeable]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    Montrer que $\displaystyle\sum_{k=1}^{n} \sin\frac{k}{n^{2}} = \frac{1}{2} + \frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big)$. On utilisera l'inégalité $|\sin t - t| \leqslant \frac{|t|^{3}}{6}$, que l'on justifiera.
  corrige: |
    **L'inégalité.** Pour $t \geqslant 0$, on pose $h(t) = \frac{t^{3}}{6} - t + \sin t$. On a $h(0) = 0$ et $h'(t) = \frac{t^{2}}{2} - (1 - \cos t) \geqslant 0$, puisque $1 - \cos t = 2\sin^{2}\frac{t}{2} \leqslant \frac{t^{2}}{2}$. Ainsi $h \geqslant 0$, et comme $\sin t \leqslant t$, on obtient $0 \leqslant t - \sin t \leqslant \frac{t^{3}}{6}$. Par imparité, $|\sin t - t| \leqslant \frac{|t|^{3}}{6}$ pour tout réel $t$.

    **La somme.** On a $\sum_{k=1}^{n} \frac{k}{n^{2}} = \frac{n + 1}{2n} = \frac{1}{2} + \frac{1}{2n}$, et l'erreur est majorée par 
    $$\sum_{k=1}^{n} \frac{k^{3}}{6n^{6}} = \frac{n^{2}(n + 1)^{2}}{24n^{6}} = O\Big(\frac{1}{n^{2}}\Big).$$

    $$\boxed{\sum_{k=1}^{n} \sin\frac{k}{n^{2}} = \frac{1}{2} + \frac{1}{2n} + O\Big(\frac{1}{n^{2}}\Big)}$$
     *Piège.* Il ne suffit pas d'écrire $\sin\frac{k}{n^{2}} = \frac{k}{n^{2}} + o\Big(\frac{k}{n^{2}}\Big)$ et de sommer : $n$ restes $o(\cdot)$ ne forment pas nécessairement un $o$ de la somme. L'inégalité explicite fournit une majoration *uniforme* en $k$.
- id: "ma-10-49"
  feuille: "f-ma-10"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [équivalents, négligeabilité, développements limités, calcul de limites, extrema, factorielles]
  noeuds: [su-infinies, de-taylor, de-limite, de-extremum]
  notions: [negligeable, formule-taylor-young, limite-fonction, extremum-local, derivee-successive]
  page_enonce: 9
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Si $f \sim g$ au voisinage de $a$, alors $\lim\limits_{x \to a} \big(f(x) - g(x)\big) = 0$.

    **2.** Si $f \sim g$ au voisinage de $a$ et si $\lim\limits_{x \to a} g(x) = +\infty$, alors $\lim\limits_{x \to a} f(x) = +\infty$.

    **3.** Si $u_{n} \sim v_{n}$, alors $\mathrm{e}^{u_{n}} \sim \mathrm{e}^{v_{n}}$.

    **4.** Si $f = o(g)$ et $g = O(h)$ au voisinage de $a$, alors $f = o(h)$.

    **5.** Si $f$ est paire et admet un développement limité à l'ordre $5$ en $0$, les coefficients de $x$, $x^{3}$ et $x^{5}$ sont nuls.

    **6.** Si $f$ admet un développement limité à l'ordre $2$ en $0$, alors $f$ est deux fois dérivable en $0$.

    **7.** Si $f$ est de classe $\mathcal{C}^{2}$, $f'(a) = 0$ et $f''(a) > 0$, en un point $a$ intérieur à son intervalle de définition, alors $f$ admet en $a$ un minimum local strict.

    **8.** Si $f$ est dérivable et admet un développement limité à l'ordre $n \geqslant 1$ en $0$, alors $f'$ admet un développement limité à l'ordre $n - 1$ en $0$.

    **9.** On a $\ln(n!) \sim n\ln n$.

    **10.** Si $u_{n} \sim v_{n}$ et si $v_{n} > 0$ pour tout $n$, alors $u_{n} > 0$ à partir d'un certain rang.
  corrige: |
    **1. Faux.** En $+\infty$, $x^{2} + x \sim x^{2}$, mais la différence $x$ tend vers $+\infty$. L'équivalence contrôle l'écart *relatif*, non l'écart absolu.

    **2. Vrai.** C'est la proposition 5 du cours.

    **3. Faux.** $n + 1 \sim n$, mais $\frac{\mathrm{e}^{n+1}}{\mathrm{e}^{n}} = \mathrm{e}$ : c'est l'exercice 8.

    **4. Vrai.** C'est la transitivité de la proposition 3 : si $f = \varepsilon g$ et $g = Bh$, alors $f = (\varepsilon B)h$.

    **5. Vrai.** C'est la proposition 9.

    **6. Faux.** La fonction $x \mapsto x^{3}\sin\frac{1}{x}$, prolongée par $0$, vérifie $f(x) = o(x^{2})$, mais n'est pas deux fois dérivable en $0$ : sa dérivée $f'(x) = 3x^{2}\sin\frac{1}{x} - x\cos\frac{1}{x}$ vérifie $\frac{f'(x) - f'(0)}{x} = 3x\sin\frac{1}{x} - \cos\frac{1}{x}$, qui n'a pas de limite en $0$.

    **7. Vrai.** C'est la condition suffisante de la proposition 15.

    **8. Faux.** Avec la même fonction, $f(x) = o(x^{2})$, mais $\frac{f'(x)}{x} = 3x\sin\frac{1}{x} - \cos\frac{1}{x}$ n'a pas de limite : $f'$ n'admet pas de développement à l'ordre $1$. On ne dérive pas un développement limité.

    **9. Vrai.** La formule de Stirling donne $\ln(n!) = n\ln n - n + \frac{1}{2}\ln n + O(1)$, et tous les termes après le premier sont négligeables devant $n\ln n$. Sans Stirling, l'encadrement $n\ln n - n < \ln(n!) \leqslant n\ln n$, que l'on peut obtenir en comparant à $\ln k$, suffit.

    **10. Vrai.** C'est la conservation du signe (proposition 5).

    $$\boxed{\text{vrais : } 2, 4, 5, 7, 9, 10 ; \quad \text{faux : } 1, 3, 6, 8}$$
- id: "ma-10-50"
  feuille: "f-ma-10"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [négligeabilité]
  noeuds: [su-infinies]
  notions: [negligeable]
  page_enonce: 9
  page_corrige: 23
  enonce: |
    Soit $f$ et $g$ deux fonctions impaires de classe $\mathcal{C}^{\infty}$ sur $\mathbb{R}$, telles que $f'(0) = g'(0) = 1$. Montrer que $f\big(g(x)\big) - g\big(f(x)\big) = o(x^{6})$ au voisinage de $0$. On écrira les développements limités de $f$ et de $g$ à l'ordre $6$, et l'on exploitera l'imparité de $f \circ g - g \circ f$. Le coefficient de $x^{7}$ est-il nul en général ?
  corrige: |
    Par la formule de Taylor-Young et l'imparité (proposition 9), il existe des réels $a, b, p, q$ tels que 
    $$f(x) = x + ax^{3} + bx^{5} + o(x^{6}), \qquad g(x) = x + px^{3} + qx^{5} + o(x^{6}).$$
     Comme $g(x) \sim x$, on a $g^{3} = x^{3} + 3px^{5} + o(x^{6})$ et $g^{5} = x^{5} + o(x^{6})$, donc 
    $$f\big(g(x)\big) = g + ag^{3} + bg^{5} + o(x^{6}) = x + (p + a)x^{3} + (q + 3ap + b)x^{5} + o(x^{6}).$$
     En échangeant les rôles, $g\big(f(x)\big) = x + (a + p)x^{3} + (b + 3pa + q)x^{5} + o(x^{6})$. Les deux développements coïncident : 
    $$\boxed{f\big(g(x)\big) - g\big(f(x)\big) = o(x^{6})}$$
     Le coefficient de $x^{6}$ est d'ailleurs nul d'office, puisque $f \circ g - g \circ f$ est impaire. Celui de $x^{7}$ n'est pas nul en général : pour $f(x) = x + x^{3}$ et $g(x) = x + 2x^{3}$, on calcule $f(g(x)) - g(f(x)) = 6x^{7} + 6x^{9}$. Deux fonctions tangentes à l'identité commutent donc « presque » à l'ordre $6$, mais pas au-delà.
- id: "ma-10-51"
  feuille: "f-ma-10"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [négligeabilité, développements limités, sommes]
  noeuds: [su-infinies, de-taylor, n-sommes, pol-binome]
  notions: [negligeable, formule-taylor-young, coefficient-binomial]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    *Une somme alternée.* Soit $n \in \mathbb{N}^{*}$ et, pour $p \in \mathbb{N}$, $S_{p} = \displaystyle\sum_{k=0}^{n} (-1)^{n-k}\binom{n}{k}k^{p}$.

    **1.** Montrer que $(\mathrm{e}^{x} - 1)^{n} = x^{n} + o(x^{n})$ au voisinage de $0$.

    **2.** En développant $(\mathrm{e}^{x} - 1)^{n}$ par la formule du binôme, puis chaque exponentielle, montrer que le coefficient de $x^{p}$ dans son développement limité vaut $\frac{S_{p}}{p!}$.

    **3.** En déduire que $S_{p} = 0$ pour $0 \leqslant p < n$, et calculer $S_{n}$.
  corrige: |
    **1.** On a $\mathrm{e}^{x} - 1 = x\big(1 + O(x)\big)$, donc $(\mathrm{e}^{x} - 1)^{n} = x^{n}\big(1 + O(x)\big)^{n} = \boxed{x^{n} + o(x^{n})}$.

    **2.** Par la formule du binôme, $(\mathrm{e}^{x} - 1)^{n} = \sum_{k=0}^{n} \binom{n}{k}(-1)^{n-k}\mathrm{e}^{kx}$, et $\mathrm{e}^{kx} = \sum_{p=0}^{n} \frac{k^{p}x^{p}}{p!} + o(x^{n})$, avec la convention $0^{0} = 1$ pour $k = 0$. En regroupant les termes de même degré, 
    $$(\mathrm{e}^{x} - 1)^{n} = \sum_{p=0}^{n} \Big(\sum_{k=0}^{n} (-1)^{n-k}\binom{n}{k}k^{p}\Big)\frac{x^{p}}{p!} + o(x^{n}) = \sum_{p=0}^{n} \frac{S_{p}}{p!}x^{p} + o(x^{n}).$$

    **3.** Par unicité du développement limité à l'ordre $n$, les questions 1 et 2 donnent $\frac{S_{p}}{p!} = 0$ pour $p < n$ et $\frac{S_{n}}{n!} = 1$. 
    $$\boxed{S_{p} = 0 \text{ pour } 0 \leqslant p < n, \qquad S_{n} = n!}$$
     Pour $n = 2$ : $S_{0} = 1 - 2 + 1 = 0$, $S_{1} = 0 - 2 + 2 = 0$ et $S_{2} = 0 - 2 + 4 = 2 = 2!$. Le chapitre 21 montrera que $S_{p}$ compte les surjections d'un ensemble à $p$ éléments sur un ensemble à $n$ éléments : il n'y en a aucune si $p < n$, et ce sont les $n!$ bijections si $p = n$.
- id: "ma-10-52"
  feuille: "f-ma-10"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [équivalents, négligeabilité, suites implicites]
  noeuds: [su-infinies, c-tvi]
  notions: [negligeable]
  page_enonce: 10
  page_corrige: 23
  enonce: |
    Soit $f : x \mapsto x\operatorname{sh}\frac{1}{x}$ sur $]0\,,+\infty[$.

    **1.** Montrer que $\operatorname{th} u < u$ pour $u > 0$. En déduire que $f$ est strictement décroissante, et déterminer ses limites en $0$ et en $+\infty$.

    **2.** Déterminer un développement de $f(x)$ en $+\infty$ à la précision $o\big(\frac{1}{x^{2}}\big)$.

    **3.** Pour $n \geqslant 1$, montrer que l'équation $f(x) = \frac{n + 1}{n}$ admet une unique solution $u_{n} > 0$, que la suite $(u_{n})$ est croissante et tend vers $+\infty$.

    **4.** Déterminer un équivalent de $u_{n}$.
  corrige: |
    **1.** La fonction $u \mapsto u - \operatorname{th} u$ a pour dérivée $\operatorname{th}^{2}u > 0$ sur $]0\,,+\infty[$ et s'annule en $0$ : elle est strictement positive, d'où $\operatorname{th} u < u$. Pour $x > 0$, avec $t = \frac{1}{x}$, 
    $$f'(x) = \operatorname{sh} t - t\operatorname{ch} t = \operatorname{ch} t\,(\operatorname{th} t - t) < 0 :$$
     $f$ est strictement décroissante. En $+\infty$, $f(x) = \frac{\operatorname{sh} t}{t} \to 1$ ; en $0^{+}$, $\frac{\operatorname{sh} t}{t} \geqslant \frac{\mathrm{e}^{t} - 1}{2t} \to +\infty$ quand $t \to +\infty$. $\boxed{f \text{ décroît strictement de } +\infty \text{ à } 1}$

    **2.** On a $\frac{\operatorname{sh} t}{t} = 1 + \frac{t^{2}}{6} + o(t^{2})$, donc $\boxed{f(x) = 1 + \frac{1}{6x^{2}} + o\Big(\frac{1}{x^{2}}\Big)}$.

    **3.** La fonction $f$, continue et strictement décroissante, réalise une bijection de $]0\,,+\infty[$ sur $]1\,,+\infty[$, qui contient $\frac{n + 1}{n}$ : $u_{n}$ existe et est unique. La suite $\Big(\frac{n + 1}{n}\Big)$ est strictement décroissante, et $f^{-1}$ aussi, donc $(u_{n})$ est strictement croissante. Enfin $f^{-1}(y)$ tend vers $+\infty$ quand $y$ tend vers $1^{+}$, et $\frac{n + 1}{n} \to 1^{+}$ : $u_{n} \to +\infty$.

    **4.** Par la question 2, $\frac{1}{n} = f(u_{n}) - 1 \sim \frac{1}{6u_{n}^{2}}$, d'où $u_{n}^{2} \sim \frac{n}{6}$, puis 
    $$\boxed{u_{n} \sim \sqrt{\frac{n}{6}}}$$
- id: "ma-10-53"
  feuille: "f-ma-10"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration, Calcul]
  mots_cles: [équivalents, négligeabilité, développements limités, suites récurrentes]
  noeuds: [su-infinies, de-taylor, su-convergence, su-monotone]
  notions: [negligeable, formule-taylor-young, suite]
  page_enonce: 10
  page_corrige: 24
  enonce: |
    *Une suite récurrente lente.* Soit $u_{0} > 0$ et $u_{n+1} = \operatorname{th} u_{n}$.

    **1.** Montrer que $(u_{n})$ est strictement positive, décroissante, et converge vers $0$.

    **2.** Déterminer le développement limité de $\operatorname{th}$ à l'ordre $5$ en $0$, puis celui de $\dfrac{1}{\operatorname{th}^{2}u} - \dfrac{1}{u^{2}}$ à l'ordre $2$.

    **3.** Trouver un réel $\alpha > 0$ tel que la suite $\Big(\dfrac{1}{u_{n+1}^{\alpha}} - \dfrac{1}{u_{n}^{\alpha}}\Big)$ ait une limite finie non nulle, et en déduire un équivalent de $u_{n}$.

    **4.** À l'aide de l'exercice 11, montrer que $\dfrac{1}{u_{n}^{2}} = \dfrac{2n}{3} + \dfrac{\ln n}{10} + o(\ln n)$, et en déduire un développement asymptotique de $u_{n}$ à deux termes.
  corrige: |
    **1.** On a $0 < \operatorname{th} u < u$ pour $u > 0$ (exercice 52) : par récurrence, $(u_{n})$ est strictement positive et décroissante. Elle converge vers $\ell \geqslant 0$ tel que $\operatorname{th}\ell = \ell$, donc $\boxed{\ell = 0}$.

    **2.** Par quotient des développements de $\operatorname{sh}$ et de $\operatorname{ch}$ (proposition 12), 
    $$\operatorname{th} u = u - \frac{u^{3}}{3} + \frac{2u^{5}}{15} + o(u^{6}), \qquad \operatorname{th}^{2}u = u^{2}\Big(1 - \frac{2u^{2}}{3} + \frac{17u^{4}}{45} + o(u^{4})\Big),$$
     puis 
    $$\frac{1}{\operatorname{th}^{2}u} = \frac{1}{u^{2}}\Big(1 + \frac{2u^{2}}{3} + \Big(\frac{4}{9} - \frac{17}{45}\Big)u^{4} + o(u^{4})\Big), \qquad \boxed{\frac{1}{\operatorname{th}^{2}u} - \frac{1}{u^{2}} = \frac{2}{3} + \frac{u^{2}}{15} + o(u^{2})}$$

    **3.** Pour $\alpha > 0$, $\frac{1}{\operatorname{th}^{\alpha}u} - \frac{1}{u^{\alpha}} = \frac{1}{u^{\alpha}}\Big(\Big(1 - \frac{u^{2}}{3} + o(u^{2})\Big)^{-\alpha} - 1\Big) \sim \frac{\alpha}{3}u^{2 - \alpha}$, qui a une limite finie non nulle si et seulement si $\alpha = 2$. Avec $\alpha = 2$, la suite $\frac{1}{u_{n+1}^{2}} - \frac{1}{u_{n}^{2}}$ tend vers $\frac{2}{3}$, et le lemme de Cesàro donne 
    $$\boxed{\alpha = 2, \qquad u_{n} \sim \sqrt{\frac{3}{2n}}}$$

    **4.** On pose $d_{n} = \frac{1}{u_{n+1}^{2}} - \frac{1}{u_{n}^{2}} - \frac{2}{3}$. Par la question 2, $d_{n} = \frac{u_{n}^{2}}{15} + o(u_{n}^{2}) \sim \frac{1}{15} \cdot \frac{3}{2n} = \frac{1}{10n}$. Cette suite est positive à partir d'un certain rang, et l'exercice 11 donne $\sum_{k=0}^{n-1} d_{k} \sim \frac{\ln n}{10}$. Comme $\sum_{k=0}^{n-1} d_{k} = \frac{1}{u_{n}^{2}} - \frac{1}{u_{0}^{2}} - \frac{2n}{3}$, 
    $$\boxed{\frac{1}{u_{n}^{2}} = \frac{2n}{3} + \frac{\ln n}{10} + o(\ln n)}$$
     Enfin $u_{n} = \sqrt{\frac{3}{2n}}\Big(1 + \frac{3\ln n}{20n} + o\Big(\frac{\ln n}{n}\Big)\Big)^{-1/2}$, et 
    $$\boxed{u_{n} = \sqrt{\frac{3}{2n}} - \frac{3}{40}\sqrt{\frac{3}{2}}\,\frac{\ln n}{n^{3/2}} + o\Big(\frac{\ln n}{n^{3/2}}\Big)}$$
     *À retenir.* La démarche se généralise à toute suite $u_{n+1} = \varphi(u_{n})$ avec $\varphi(u) = u - cu^{p} + \cdots$ : on cherche l'exposant $\alpha$ qui rend $\frac{1}{u_{n}^{\alpha}}$ presque arithmétique, et c'est toujours $\alpha = p - 1$. Ici $p = 3$ ; pour l'exercice 45, $p = 2$ et $\alpha = 1$.

