  enonce: |
    Pour $n \in \mathbb{N}$, on pose $P_{n}(x) = x^{3} - (n + 2)x^{2} + (2n + 1)x - 1$.

    **1.** Montrer que, pour $n$ assez grand, $P_{n}$ s'annule en trois réels $a_{n}$, $b_{n}$, $c_{n}$ vérifiant 
    $$0 < a_{n} < 1 < b_{n} < 3 < c_{n}.$$

    **2.** En développant $(x - a_{n})(x - b_{n})(x - c_{n})$, exprimer $a_{n} + b_{n} + c_{n}$ et $a_{n}b_{n}c_{n}$ à l'aide de $n$.

    **3.** Déterminer un équivalent de $c_{n}$, puis la limite de $(b_{n})$ et un équivalent de $a_{n}$.
  corrige: |
    **1.** On calcule $P_{n}(0) = -1$, $P_{n}(1) = n - 1$, $P_{n}(3) = 11 - 3n$, et $P_{n}(x) \to +\infty$ en $+\infty$. Pour $n \geqslant 4$, les signes $-$, $+$, $-$, $+$ et le théorème des valeurs intermédiaires donnent une racine dans chacun des intervalles $]0\,,1[$, $]1\,,3[$ et $]3\,,+\infty[$ . $\boxed{0 < a_{n} < 1 < b_{n} < 3 < c_{n}}$

    **2.** La différence $P_{n}(x) - (x - a_{n})(x - b_{n})(x - c_{n})$ est un polynôme de degré au plus $2$ qui s'annule en trois réels distincts ; un trinôme non nul ayant au plus deux racines, elle est nulle. En développant le produit et en identifiant les coefficients, 
    $$\boxed{a_{n} + b_{n} + c_{n} = n + 2, \qquad a_{n}b_{n} + b_{n}c_{n} + c_{n}a_{n} = 2n + 1, \qquad a_{n}b_{n}c_{n} = 1}$$

    **3.** Comme $1 < a_{n} + b_{n} < 4$, on a $c_{n} = n + 2 - (a_{n} + b_{n}) = n + O(1)$, donc $c_{n} \sim n$. Ensuite $a_{n} = \frac{1}{b_{n}c_{n}} \leqslant \frac{1}{c_{n}} \to 0$. La deuxième relation donne $a_{n} + b_{n} = \frac{2n + 1 - a_{n}b_{n}}{c_{n}}$, où $0 < a_{n}b_{n} < 3$, donc $a_{n} + b_{n} \to 2$ et $b_{n} \to 2$. Enfin $a_{n} = \frac{1}{b_{n}c_{n}} \sim \frac{1}{2n}$. 
    $$\boxed{c_{n} \sim n, \qquad \lim\limits_{n \to +\infty} b_{n} = 2, \qquad a_{n} \sim \frac{1}{2n}}$$
     Pour $n = 1\,000$, on trouve numériquement $c_{n} \approx 999{,}999$, $b_{n} \approx 2{,}0005$ et $2na_{n} \approx 0{,}99975$.
- id: "ma-10-42"
  feuille: "f-ma-10"
  numero: 42
  partie: "Suites et développements asymptotiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développements asymptotiques, équivalents, suites récurrentes, lemme de Cesàro]
  noeuds: [su-infinies, su-convergence, tg-arctan]
  notions: [suite, negligeable, arc-tangente, cosinus-sinus]
  page_enonce: 8
  page_corrige: 19
  enonce: |
    Soit $u_{0} > 0$ et $u_{n+1} = \operatorname{Arctan} u_{n}$.

    **1.** Montrer que $(u_{n})$ est à valeurs strictement positives et converge vers $0$.

    **2.** Déterminer la limite de $\dfrac{1}{u_{n+1}^{2}} - \dfrac{1}{u_{n}^{2}}$, et en déduire un équivalent de $u_{n}$ à l'aide du lemme de Cesàro du cours.
  corrige: |
    **1.** Pour $u > 0$, $0 < \operatorname{Arctan} u < u$ (la fonction $u \mapsto u - \operatorname{Arctan} u$ s'annule en $0$ et a pour dérivée $\frac{u^{2}}{1 + u^{2}} > 0$). Par récurrence, $(u_{n})$ est strictement positive et décroissante : elle converge vers $\ell \geqslant 0$ tel que $\operatorname{Arctan}\ell = \ell$, donc $\boxed{\ell = 0}$.

    **2.** On a $\operatorname{Arctan} u = u\Big(1 - \frac{u^{2}}{3} + o(u^{2})\Big)$, donc $\operatorname{Arctan}^{2}u = u^{2}\Big(1 - \frac{2u^{2}}{3} + o(u^{2})\Big)$ et 
    $$\frac{1}{\operatorname{Arctan}^{2}u} - \frac{1}{u^{2}} = \frac{1}{u^{2}}\Big(\frac{2u^{2}}{3} + o(u^{2})\Big) \xrightarrow[u \to 0]{} \frac{2}{3}.$$
     Par substitution de $u = u_{n}$, $\frac{1}{u_{n+1}^{2}} - \frac{1}{u_{n}^{2}} \to \frac{2}{3}$. Le lemme de Cesàro (proposition 16) donne $\frac{1}{nu_{n}^{2}} \to \frac{2}{3}$, soit 
    $$\boxed{u_{n} \sim \sqrt{\frac{3}{2n}}}$$
- id: "ma-10-43"
  feuille: "f-ma-10"
