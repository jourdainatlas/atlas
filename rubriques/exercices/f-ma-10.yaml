  noeuds: [su-infinies, c-tvi]
  notions: [suite, negligeable]
  page_enonce: 7
  page_corrige: 18
  enonce: |
    **1.** Montrer que, pour tout $n \in \mathbb{N}^{*}$, l'équation $x + \ln x = n$ admet une unique solution $u_{n}$ dans $]0\,,+\infty[$.

    **2.** Montrer que $u_{n} \sim n$, puis que $u_{n} = n - \ln n + o(1)$.

    **3.** Montrer que $u_{n} = n - \ln n + \dfrac{\ln n}{n} + o\Big(\dfrac{\ln n}{n}\Big)$.
  corrige: |
    **1.** La fonction $\varphi : x \mapsto x + \ln x$ est continue et strictement croissante sur $]0\,,+\infty[$, de limites $-\infty$ et $+\infty$ : c'est une bijection de $]0\,,+\infty[$ sur $\mathbb{R}$ (chapitre 8). $\boxed{u_{n} = \varphi^{-1}(n) \text{ existe et est unique}}$

    **2.** La fonction $\varphi^{-1}$ est croissante et non majorée, donc $u_{n} \to +\infty$. Alors $\ln u_{n} = o(u_{n})$, et $n = u_{n} + \ln u_{n} = u_{n}\big(1 + o(1)\big)$ : $u_{n} \sim n$. On en déduit 
    $$u_{n} = n - \ln u_{n} = n - \ln n - \ln\frac{u_{n}}{n} = n - \ln n + o(1),$$
     puisque $\frac{u_{n}}{n} \to 1$. $\boxed{u_{n} = n - \ln n + o(1)}$

    **3.** On réinjecte : $\frac{u_{n}}{n} = 1 - \frac{\ln n}{n} + o\Big(\frac{1}{n}\Big)$, donc $\ln\frac{u_{n}}{n} = -\frac{\ln n}{n} + o\Big(\frac{\ln n}{n}\Big)$, et 
    $$\boxed{u_{n} = n - \ln n + \frac{\ln n}{n} + o\Big(\frac{\ln n}{n}\Big)}$$
     Pour $n = 100$, ce développement donne $95{,}4409$, pour une valeur exacte $u_{100} \approx 95{,}4415$.
- id: "ma-10-39"
  feuille: "f-ma-10"
  numero: 39
  partie: "Suites et développements asymptotiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [développements asymptotiques, équivalents, suites implicites]
  noeuds: [su-infinies, ar-suites, c-tvi]
  notions: [suite, negligeable]
  page_enonce: 8
  page_corrige: 18
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on pose $f_{n}(x) = x^{5} + nx - 1$.

    **1.** Montrer que $f_{n}$ s'annule en un unique réel $u_{n}$, et que $u_{n} \in \big]0\,,\frac{1}{n}\big[$.

    **2.** Montrer que $u_{n} \sim \frac{1}{n}$, puis déterminer un équivalent de $\frac{1}{n} - u_{n}$.
  corrige: |
    **1.** La fonction $f_{n}$ est strictement croissante, puisque $f_{n}'(x) = 5x^{4} + n > 0$, de limites $\pm\infty$ : elle s'annule en un unique réel $u_{n}$. Comme $f_{n}(0) = -1 < 0$ et $f_{n}\Big(\frac{1}{n}\Big) = \frac{1}{n^{5}} > 0$, on a $\boxed{0 < u_{n} < \frac{1}{n}}$.

    **2.** L'égalité $f_{n}(u_{n}) = 0$ s'écrit $nu_{n} = 1 - u_{n}^{5}$, qui tend vers $1$ : $u_{n} \sim \frac{1}{n}$. Puis 
    $$\frac{1}{n} - u_{n} = \frac{u_{n}^{5}}{n} \sim \frac{1}{n^{6}}. \qquad \boxed{u_{n} \sim \frac{1}{n}, \qquad \frac{1}{n} - u_{n} \sim \frac{1}{n^{6}}}$$
     L'approximation $u_{n} \approx \frac{1}{n}$ est donc remarquablement bonne : pour $n = 10$, l'erreur est de l'ordre de $10^{-6}$.
- id: "ma-10-40"
  feuille: "f-ma-10"
  numero: 40
  partie: "Suites et développements asymptotiques"
