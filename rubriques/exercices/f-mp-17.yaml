  page_enonce: 7
  page_corrige: 19
  enonce: |
    Soit $f : \mathbb{R}^{n} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$.

    **1.** On suppose la matrice hessienne de $f$ nulle en tout point. Montrer qu'il existe $a \in \mathbb{R}^{n}$ et $b \in \mathbb{R}$ tels que $f(x) = \langle a, x \rangle + b$ pour tout $x \in \mathbb{R}^{n}$.

    **2.** On suppose la matrice hessienne de $f$ constante, égale à $S$. Montrer qu'il existe $a \in \mathbb{R}^{n}$ et $b \in \mathbb{R}$ tels que $f(x) = \frac{1}{2}\langle Sx, x \rangle + \langle a, x \rangle + b$ pour tout $x \in \mathbb{R}^{n}$.
  corrige: |
    Une fonction dont la différentielle est nulle sur un convexe est constante (proposition 10) : on l'applique au gradient, puis à $f$.

    **1.** Pour chaque $j$, les dérivées partielles de $\partial_{j} f$ sont les coefficients de la ligne $j$ de $H_{f}$, nulles : $\partial_{j} f$ est constante sur $\mathbb{R}^{n}$, convexe. Ainsi $\nabla f = a$ est constant, et $x \mapsto f(x) - \langle a, x \rangle$ a un gradient nul, donc est constante, égale à $b$. 
    $$\boxed{f(x) = \langle a, x \rangle + b}$$

    **2.** La fonction $q(x) = \frac{1}{2}\langle Sx, x \rangle = \frac{1}{2}\sum_{i, j} s_{ij}x_{i}x_{j}$ a pour gradient $Sx$, puisque $S$ est symétrique (théorème de Schwarz), et pour hessienne $S$. Alors $f - q$ a une hessienne nulle, et la question 1 conclut. 
    $$\boxed{f(x) = \frac{1}{2}\langle Sx, x \rangle + \langle a, x \rangle + b}$$
     Les fonctions de classe $\mathcal{C}^{2}$ à hessienne constante sont les polynômes de degré au plus $2$ : la formule de Taylor-Young est alors exacte.
