  enonce: |
    *Fonctions homogènes.* Soit $\alpha \in \mathbb{R}$ et $f : \mathbb{R}^{2} \setminus \{(0, 0)\} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$. On dit que $f$ est homogène de degré $\alpha$ si $f(tx, ty) = t^{\alpha}f(x, y)$ pour tout $t > 0$ et tout $(x, y) \neq (0, 0)$.

    **1.** On suppose $f$ homogène de degré $\alpha$. Montrer que ses dérivées partielles sont homogènes de degré $\alpha - 1$.

    **2.** Montrer que $f$ est homogène de degré $\alpha$ si et seulement si elle vérifie la relation d'Euler 
    $$\forall (x, y) \neq (0, 0), \qquad x\frac{\partial f}{\partial x}(x, y) + y\frac{\partial f}{\partial y}(x, y) = \alpha f(x, y).$$

    **3.** Vérifier la relation d'Euler pour $f(x, y) = \frac{x^{3} + y^{3}}{\sqrt{x^{2} + y^{2}}}$.
  corrige: |
    On dérive la relation d'homogénéité par rapport à $x$, puis par rapport à $t$ ; pour la réciproque, on montre qu'une fonction de $t$ convenablement normalisée est constante.

    **1.** À $t > 0$ fixé, on dérive $f(tx, ty) = t^{\alpha}f(x, y)$ par rapport à $x$ : $t\,\frac{\partial f}{\partial x}(tx, ty) = t^{\alpha}\frac{\partial f}{\partial x}(x, y)$, d'où $\frac{\partial f}{\partial x}(tx, ty) = t^{\alpha - 1}\frac{\partial f}{\partial x}(x, y)$, et de même pour $\frac{\partial f}{\partial y}$. 
    $$\boxed{\frac{\partial f}{\partial x} \text{ et } \frac{\partial f}{\partial y} \text{ sont homogènes de degré } \alpha - 1}$$

    **2.** Condition nécessaire. On dérive $f(tx, ty) = t^{\alpha}f(x, y)$ par rapport à $t$ (proposition 6), et l'on prend $t = 1$.

    Condition suffisante. À $(x, y) \neq (0, 0)$ fixé, soit $\psi(t) = t^{-\alpha}f(tx, ty)$ pour $t > 0$. Alors 
    $$\psi'(t) = t^{-\alpha - 1}\Big(-\alpha f(tx, ty) + tx\,\frac{\partial f}{\partial x}(tx, ty) + ty\,\frac{\partial f}{\partial y}(tx, ty)\Big) = 0,$$
     par la relation d'Euler au point $(tx, ty)$. Ainsi $\psi(t) = \psi(1) = f(x, y)$. 
    $$\boxed{f \text{ homogène de degré } \alpha \iff x\frac{\partial f}{\partial x} + y\frac{\partial f}{\partial y} = \alpha f}$$

    **3.** $f(tx, ty) = \frac{t^{3}(x^{3} + y^{3})}{t\sqrt{x^{2} + y^{2}}} = t^{2}f(x, y)$ : $f$ est homogène de degré $2$. Directement, avec $r^{2} = x^{2} + y^{2}$, $\frac{\partial f}{\partial x} = \frac{3x^{2}}{r} - \frac{x(x^{3} + y^{3})}{r^{3}}$, et de même pour $y$, d'où 
    $$x\frac{\partial f}{\partial x} + y\frac{\partial f}{\partial y} = \frac{3(x^{3} + y^{3})}{r} - \frac{(x^{2} + y^{2})(x^{3} + y^{3})}{r^{3}} = \boxed{2f(x, y)}$$
- id: "mp-17-19"
  feuille: "f-mp-17"
  numero: 19
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [classe C1]
  noeuds: [gd-differentielle, gd-accroissements]
  notions: [classe-ck]
  source: "BibM@th, Calcul différentiel, exercice 9"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Montrer que les fonctions suivantes, prolongées par $0$ en $(0, 0)$, sont de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ : 
    $$f : (x, y) \mapsto \frac{x^{2}y^{3}}{x^{2} + y^{2}}, \qquad g : (x, y) \mapsto x^{2}y^{2}\ln(x^{2} + y^{2}).$$
  corrige: |
    On applique le théorème 2 : on calcule les dérivées partielles hors de l'origine, puis en l'origine par la définition, et l'on montre qu'elles tendent vers ces valeurs. On note $r = \sqrt{x^{2} + y^{2}}$.

    Fonction $f$. Hors de l'origine, 
    $$\frac{\partial f}{\partial x} = \frac{2xy^{5}}{r^{4}}, \qquad \frac{\partial f}{\partial y} = \frac{x^{2}y^{2}(3x^{2} + y^{2})}{r^{4}}.$$
     En l'origine, $f(t, 0) = f(0, t) = 0$, donc les dérivées partielles sont nulles. Comme $|x|$, $|y| \leqslant r$, on a $\big|\frac{\partial f}{\partial x}\big| \leqslant 2r^{2}$ et $\big|\frac{\partial f}{\partial y}\big| \leqslant 3r^{2}$, qui tendent vers $0$.

    Fonction $g$. Hors de l'origine, 
    $$\frac{\partial g}{\partial x} = 2xy^{2}\ln(r^{2}) + \frac{2x^{3}y^{2}}{r^{2}}, \qquad \frac{\partial g}{\partial y} = 2x^{2}y\ln(r^{2}) + \frac{2x^{2}y^{3}}{r^{2}},$$
     majorées en valeur absolue par $2r^{3}|\ln(r^{2})| + 2r^{3}$, qui tend vers $0$ par croissances comparées. En l'origine, $g(t, 0) = g(0, t) = 0$. 
    $$\boxed{f \text{ et } g \text{ sont de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
- id: "mp-17-20"
  feuille: "f-mp-17"
  numero: 20
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [classe C1]
  noeuds: [gd-differentielle, gd-accroissements]
  notions: [classe-ck]
  source: "BibM@th, Calcul différentiel, exercice 10"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Les fonctions suivantes, prolongées par $0$ en $(0, 0)$, sont-elles de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$ ? 
    $$f : (x, y) \mapsto \frac{x(x^{2} - y^{2})}{x^{2} + y^{2}}, \qquad g : (x, y) \mapsto \frac{x^{3} + y^{3}}{x^{2} + y^{2}}, \qquad h : (x, y) \mapsto \mathrm{e}^{-1/(x^{2} + y^{2})}.$$
  corrige: |
    Pour montrer qu'une fonction n'est pas de classe $\mathcal{C}^{1}$, il suffit de montrer qu'elle n'est pas différentiable, par exemple parce que $v \mapsto D_{v} f(0, 0)$ n'est pas linéaire, comme à l'exercice 3.

    Fonction $f$. $D_{v} f(0, 0) = \frac{f(tv)}{t} = \frac{v_{1}(v_{1}^{2} - v_{2}^{2})}{v_{1}^{2} + v_{2}^{2}}$ ; elle vaut $1$ pour $e_{1}$, $0$ pour $e_{2}$, et $0$ pour $(1, 1)$ au lieu de $1$. Donc $f$ n'est pas différentiable en $(0, 0)$.

    Fonction $g$. De même, $D_{v} g(0, 0) = \frac{v_{1}^{3} + v_{2}^{3}}{v_{1}^{2} + v_{2}^{2}}$ vaut $1$ pour $e_{1}$ et $e_{2}$, et $1$ pour $(1, 1)$ au lieu de $2$.

    Fonction $h$. Hors de l'origine, $\frac{\partial h}{\partial x} = \frac{2x}{r^{4}}\mathrm{e}^{-1/r^{2}}$, majorée par $\frac{2}{r^{3}}\mathrm{e}^{-1/r^{2}}$, qui tend vers $0$ ; en l'origine, $\frac{h(t, 0)}{t} = \frac{\mathrm{e}^{-1/t^{2}}}{t} \to 0$. Il en va de même pour $\frac{\partial h}{\partial y}$, et le théorème 2 s'applique. 
    $$\boxed{f \text{ et } g \text{ ne sont pas de classe } \mathcal{C}^{1} \text{ (ni même différentiables en } 0\text{)} \ ; \ h \text{ est de classe } \mathcal{C}^{1}}$$
- id: "mp-17-21"
  feuille: "f-mp-17"
  numero: 21
