  enonce: |
    Montrer que la fonction $f : (x, y) \mapsto \displaystyle\sum_{n=1}^{+\infty} \frac{\mathrm{e}^{-n(x^{2} + y^{2})}}{n^{2}}$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.
  corrige: |
    On applique le théorème de dérivation des séries de fonctions du chapitre 8 à chaque variable, puis le théorème 2.

    Soit $f_{n}(x, y) = \frac{\mathrm{e}^{-n(x^{2} + y^{2})}}{n^{2}}$. On a $\lVert f_{n} \rVert_{\infty} = \frac{1}{n^{2}}$, et 
    $$\Big|\frac{\partial f_{n}}{\partial x}(x, y)\Big| = \frac{2|x|\mathrm{e}^{-nx^{2}}\mathrm{e}^{-ny^{2}}}{n} \leqslant \frac{2}{n}\sup_{t \geqslant 0} t\mathrm{e}^{-nt^{2}} = \frac{2}{n}\cdot\frac{\mathrm{e}^{-1/2}}{\sqrt{2n}},$$
     le maximum de $t \mapsto t\mathrm{e}^{-nt^{2}}$ étant atteint en $t = \frac{1}{\sqrt{2n}}$. Les séries $\sum f_{n}$ et $\sum \frac{\partial f_{n}}{\partial x}$ convergent donc normalement sur $\mathbb{R}^{2}$, de même pour $\frac{\partial f_{n}}{\partial y}$. À $y$ fixé, le théorème de dérivation terme à terme (chapitre 8) montre que $\frac{\partial f}{\partial x}$ existe et vaut $\sum \frac{\partial f_{n}}{\partial x}$, limite uniforme de fonctions continues sur $\mathbb{R}^{2}$, donc continue ; de même pour $\frac{\partial f}{\partial y}$. 
    $$\boxed{f \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{2}}$$
- id: "mp-17-23"
  feuille: "f-mp-17"
  numero: 23
  partie: "Applications de classe $\\mathcal{C}^{1}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [classe C1]
  noeuds: [gd-differentielle, gd-accroissements]
  notions: [classe-ck]
  source: "BibM@th, Calcul différentiel, exercice 8"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Intégrale dont la borne varie.* Soit $a \in \mathbb{R}$, $g : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, et $b : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$.

    **1.** Montrer que $G : (u, v) \mapsto \displaystyle\int_{a}^{u} g(t, v)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et calculer ses dérivées partielles (chapitre 13).

    **2.** En déduire que $\varphi : x \mapsto \displaystyle\int_{a}^{b(x)} g(t, x)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et calculer $\varphi'$.

    **3.** Application : calculer la dérivée de $x \mapsto \displaystyle\int_{0}^{x^{2}} \mathrm{e}^{-xt^{2}}\,\mathrm{d} t$.
  corrige: |
    La fonction $G$ dépend de sa borne par le théorème fondamental, et de son paramètre par la dérivation sous l'intégrale ; $\varphi$ s'en déduit par composition.

    **1.** Pour $v$ fixé, $\frac{\partial G}{\partial u}(u, v) = g(u, v)$. Pour $u$ fixé, $\frac{\partial g}{\partial v}$ est continue sur le produit du segment d'extrémités $a$ et $u$ par $[v - 1, v + 1]$, qui est compact, et la dérivation sous l'intégrale sur un segment (chapitre 13) donne 
    $$\frac{\partial G}{\partial v}(u, v) = \int_{a}^{u} \frac{\partial g}{\partial v}(t, v)\,\mathrm{d} t.$$
     Cette fonction est continue en $(u, v)$ : elle est égale à $\Phi(u, v) = \int_{a}^{u} \frac{\partial g}{\partial v}(t, v)\,\mathrm{d} t$, et 
    $$|\Phi(u', v') - \Phi(u, v)| \leqslant \Big|\int_{u}^{u'} \Big|\frac{\partial g}{\partial v}(t, v')\Big|\,\mathrm{d} t\Big| + \Big|\int_{a}^{u} \Big|\frac{\partial g}{\partial v}(t, v') - \frac{\partial g}{\partial v}(t, v)\Big|\,\mathrm{d} t\Big|,$$
     qui tend vers $0$ par continuité uniforme de $\frac{\partial g}{\partial v}$ sur un compact. 
    $$\boxed{\frac{\partial G}{\partial u}(u, v) = g(u, v), \qquad \frac{\partial G}{\partial v}(u, v) = \int_{a}^{u} \frac{\partial g}{\partial v}(t, v)\,\mathrm{d} t}$$

    **2.** $\varphi(x) = G(b(x), x)$, composée de fonctions de classe $\mathcal{C}^{1}$, et la proposition 6 donne 
    $$\boxed{\varphi'(x) = b'(x)\,g\big(b(x), x\big) + \int_{a}^{b(x)} \frac{\partial g}{\partial v}(t, x)\,\mathrm{d} t}$$

    **3.** Avec $a = 0$, $b(x) = x^{2}$ et $g(t, x) = \mathrm{e}^{-xt^{2}}$ : 
    $$\boxed{\frac{\mathrm{d}}{\mathrm{d} x}\int_{0}^{x^{2}} \mathrm{e}^{-xt^{2}}\,\mathrm{d} t = 2x\,\mathrm{e}^{-x^{5}} - \int_{0}^{x^{2}} t^{2}\mathrm{e}^{-xt^{2}}\,\mathrm{d} t}$$
     *Piège.* On n'oublie aucun des deux termes : l'un vient de la borne, l'autre du paramètre.
- id: "mp-17-24"
  feuille: "f-mp-17"
  numero: 24
