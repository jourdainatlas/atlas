  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $\varphi : \mathbb{R} \to \mathbb{R}$ continue. Montrer que $u : (x, y) \mapsto \displaystyle\int_{x - y}^{x + y} \varphi(t)\,\mathrm{d} t$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$, et calculer ses dérivées partielles.
  corrige: |
    On introduit une primitive de $\varphi$, ce qui ramène $u$ à une composée.

    Soit $\Phi$ une primitive de $\varphi$, de classe $\mathcal{C}^{1}$. Alors $u(x, y) = \Phi(x + y) - \Phi(x - y)$, et 
    $$\boxed{\frac{\partial u}{\partial x}(x, y) = \varphi(x + y) - \varphi(x - y), \qquad \frac{\partial u}{\partial y}(x, y) = \varphi(x + y) + \varphi(x - y)}$$
     Ces dérivées partielles sont continues, donc $u$ est de classe $\mathcal{C}^{1}$ (théorème 2).
- id: "mp-17-15"
  feuille: "f-mp-17"
  numero: 15
  partie: "Opérations sur les applications différentiables"
