    On pose $f(x, y) = \sin(x^{2} - y^{2})$ et $g(x, y) = (x + y, x - y)$. Calculer les matrices jacobiennes de $f$ et de $g$, puis la différentielle de $f \circ g$ de deux façons : en calculant d'abord $f \circ g$, puis par la règle de la chaîne.
  corrige: |
    On vérifie sur un exemple la formule $J_{f \circ g}(a) = J_{f}(g(a))\,J_{g}(a)$ de la proposition 7.

    On a 
    $$J_{f}(x, y) = \begin{pmatrix} 2x\cos(x^{2} - y^{2}) & -2y\cos(x^{2} - y^{2}) \end{pmatrix}, \qquad J_{g}(x, y) = \begin{pmatrix} 1 & 1 \\ 1 & -1 \end{pmatrix}.$$

    Calcul direct. $(x + y)^{2} - (x - y)^{2} = 4xy$, donc $f \circ g(x, y) = \sin(4xy)$, de matrice jacobienne $\big(4y\cos(4xy) \quad 4x\cos(4xy)\big)$.

    Règle de la chaîne. En $g(x, y)$, $J_{f} = \cos(4xy)\big(2(x + y) \quad -2(x - y)\big)$, et le produit par $J_{g}$ donne $\cos(4xy)\big(2(x + y) - 2(x - y) \quad 2(x + y) + 2(x - y)\big)$. 
    $$\boxed{\mathrm{d}(f \circ g)(x, y)\cdot(h, k) = 4\cos(4xy)\,(yh + xk)}$$
