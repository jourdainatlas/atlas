  source: "Feuille d'exercices #18 (Prost), exercice 26"
  page_enonce: 8
  page_corrige: 21
  enonce: |
    *Perspective : fonctions convexes de classe $\mathcal{C}^{1}$.* Soit $\Omega$ un ouvert convexe de $\mathbb{R}^{n}$ et $f : \Omega \to \mathbb{R}$.

    **1.** Montrer que $f$ est convexe sur $\Omega$ si et seulement si, pour tous $x$, $y \in \Omega$, la fonction suivante est convexe sur $[0, 1]$ : 
    $$\varphi_{x, y} : t \mapsto f\big(x + t(y - x)\big).$$

    **2.** On suppose $f$ différentiable sur $\Omega$.

    **(a)** Soit $x$, $y \in \Omega$. Justifier que $\varphi_{x, y}$ est dérivable sur $[0, 1]$, et exprimer sa dérivée à l'aide de $\nabla f$.

    **(b)** En déduire que $f$ est convexe si et seulement si $f(y) \geqslant f(x) + \langle \nabla f(x), y - x \rangle$ pour tous $x$, $y \in \Omega$.

    **(c)** Montrer que cette dernière condition équivaut à : $\langle \nabla f(y) - \nabla f(x), y - x \rangle \geqslant 0$ pour tous $x$, $y \in \Omega$.

    **3.** Soit $f$ convexe et différentiable sur $\Omega$, et $x^{*} \in \Omega$ tel que $\nabla f(x^{*}) = 0$. Montrer que $f$ admet un minimum global en $x^{*}$.
  corrige: |
    On se ramène aux fonctions d'une variable par restriction aux segments, comme dans la démonstration de la proposition 9.

    **1.** Si $f$ est convexe, $\varphi_{x, y}$ est la composée de $f$ et de l'application affine $t \mapsto x + t(y - x)$, donc convexe. Réciproquement, la convexité de $\varphi_{x, y}$ donne $\varphi_{x, y}(t) \leqslant (1 - t)\varphi_{x, y}(0) + t\varphi_{x, y}(1)$, c'est-à-dire $f\big((1 - t)x + ty\big) \leqslant (1 - t)f(x) + tf(y)$.

    **2.** (a) Comme $\Omega$ est ouvert et convexe, $x + t(y - x) \in \Omega$ pour $t$ dans un intervalle ouvert contenant $[0, 1]$, et la proposition 6 donne 
    $$\boxed{\varphi_{x, y}'(t) = \langle \nabla f\big(x + t(y - x)\big), y - x \rangle}$$

    (b) Si $f$ est convexe, la fonction $\varphi_{x, y}$ est convexe et dérivable, donc au-dessus de sa tangente en $0$ : 
    $$\varphi_{x, y}(1) \geqslant \varphi_{x, y}(0) + \varphi_{x, y}'(0),$$
     ce qui est l'inégalité annoncée. Réciproquement, soit $x$, $y \in \Omega$, $t \in [0, 1]$ et $z = (1 - t)x + ty$. L'inégalité, appliquée en $z$ vers $x$ et vers $y$, donne 
    $$f(x) \geqslant f(z) + \langle \nabla f(z), x - z \rangle, \qquad f(y) \geqslant f(z) + \langle \nabla f(z), y - z \rangle.$$
     On multiplie la première par $1 - t$, la seconde par $t$, et l'on somme : le terme en gradient s'annule, puisque $(1 - t)(x - z) + t(y - z) = 0$, et il reste 
    $$\boxed{f \text{ convexe} \iff \forall x, y, \ f(y) \geqslant f(x) + \langle \nabla f(x), y - x \rangle}$$

    (c) En sommant l'inégalité de (b) et celle obtenue en échangeant $x$ et $y$, on obtient 
    $$\langle \nabla f(y) - \nabla f(x), y - x \rangle \geqslant 0.$$
     Réciproquement, si cette condition est vérifiée, pour $0 \leqslant s < t \leqslant 1$, avec $z_{t} = x + t(y - x)$, 
    $$\big(\varphi_{x, y}'(t) - \varphi_{x, y}'(s)\big)(t - s) = \langle \nabla f(z_{t}) - \nabla f(z_{s}), z_{t} - z_{s} \rangle \geqslant 0 :$$
     $\varphi_{x, y}'$ est croissante, $\varphi_{x, y}$ est convexe, et la question 1 montre que $f$ est convexe, donc vérifie l'inégalité de (b).

    **3.** L'inégalité de (b) en $x = x^{*}$ donne $f(y) \geqslant f(x^{*})$ pour tout $y \in \Omega$. 
    $$\boxed{\text{pour } f \text{ convexe, tout point critique est un minimum global}}$$
     C'est la propriété fondamentale de l'optimisation convexe : la condition nécessaire du premier ordre y devient suffisante, et un minimum local est global.
