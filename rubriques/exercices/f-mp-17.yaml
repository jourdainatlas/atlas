  enonce: |
    *Perspective : une démonstration du théorème spectral.* Soit $E$ un espace euclidien de dimension $n \geqslant 1$ et $u \in \mathcal{S}(E)$. On pose, pour $x \in \Omega = E \setminus \{0\}$, $f(x) = \frac{\langle u(x), x \rangle}{\lVert x \rVert^{2}}$.

    **1.** Montrer que $f$ est bornée sur $\Omega$, et qu'elle atteint son maximum en un point $x_{0}$ de la sphère unité.

    **2.** Montrer que $f$ est de classe $\mathcal{C}^{1}$ sur $\Omega$, et calculer son gradient en $x \in \Omega$.

    **3.** En déduire que $x_{0}$ est un vecteur propre de $u$.

    **4.** Montrer, par récurrence sur $n$, qu'il existe une base orthonormée de vecteurs propres de $u$, sans utiliser le théorème spectral du chapitre 7.
  corrige: |
    Le maximum du quotient de Rayleigh est un point critique sur l'ouvert $E \setminus \{0\}$ ; l'annulation du gradient en ce point est exactement l'équation aux valeurs propres.

    **1.** Pour $x \neq 0$, $f(x) = f\big(\frac{x}{\lVert x \rVert}\big)$, et $|f(x)| \leqslant |\mkern-1.5mu|\mkern-1.5mu|u|\mkern-1.5mu|\mkern-1.5mu|$ par l'inégalité de Cauchy-Schwarz. La sphère unité est compacte, et $f$ y est continue : elle y atteint son maximum en un point $x_{0}$, qui est aussi un maximum de $f$ sur $\Omega$, puisque $f$ est constante sur chaque demi-droite.

    **2.** $q(x) = \langle u(x), x \rangle$ et $n(x) = \lVert x \rVert^{2}$ sont de classe $\mathcal{C}^{1}$, de gradients $2u(x)$, puisque $u$ est autoadjoint, et $2x$. Par les règles de calcul, $f = \frac{q}{n}$ est de classe $\mathcal{C}^{1}$ sur $\Omega$, et 
    $$\boxed{\nabla f(x) = \frac{2u(x)\lVert x \rVert^{2} - 2\langle u(x), x \rangle x}{\lVert x \rVert^{4}} = \frac{2}{\lVert x \rVert^{2}}\big(u(x) - f(x)x\big)}$$

    **3.** $f$ admet un maximum en $x_{0}$, point de l'ouvert $\Omega$ : $\nabla f(x_{0}) = 0$ (proposition 11). 
    $$\boxed{u(x_{0}) = f(x_{0})\,x_{0}, \quad x_{0} \neq 0}$$

    **4.** Par récurrence sur $n = \dim E$, le cas $n = 1$ étant clair. Soit $\lambda = f(x_{0})$, avec $\lVert x_{0} \rVert = 1$, et $F = x_{0}^{\perp}$. Pour $y \in F$, $\langle u(y), x_{0} \rangle = \langle y, u(x_{0}) \rangle = \lambda\langle y, x_{0} \rangle = 0$ : $F$ est stable par $u$, et l'endomorphisme induit est autoadjoint. Par hypothèse de récurrence, $F$ a une base orthonormée de vecteurs propres, que l'on complète par $x_{0}$. 
    $$\boxed{u \text{ est diagonalisable dans une base orthonormée}}$$
     Cette démonstration remplace l'existence d'une valeur propre réelle, obtenue au chapitre 7 par la factorisation du polynôme caractéristique, par un argument de compacité : la plus grande valeur propre est le maximum du quotient de Rayleigh.
- id: "mp-17-49"
