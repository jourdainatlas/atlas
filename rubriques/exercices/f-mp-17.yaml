  enonce: |
    Soit $D = \{(x, y) \in \mathbb{R}^{2} \mid x \geqslant 0, \ y \geqslant 0, \ x + y \leqslant 1\}$, et $a$, $b$, $c > 0$.

    **1.** Montrer que $D$ est une partie fermée et bornée de $\mathbb{R}^{2}$.

    **2.** Soit $f(x, y) = x^{a}y^{b}(1 - x - y)^{c}$. Montrer que $f$ est continue sur $D$, puis déterminer $\displaystyle\sup_{D} f$.
  corrige: |
    Le maximum est atteint à l'intérieur, où $f > 0$ ; on y annule le gradient de $\ln f$, plus simple à calculer.

    **1.** $D$ est l'intersection des images réciproques de $\mathbb{R}_{+}$ par $(x, y) \mapsto x$, $y$ et $1 - x - y$, continues : elle est fermée. Elle est bornée, puisque $0 \leqslant x, y \leqslant 1$.

    **2.** Les fonctions $t \mapsto t^{a}$, prolongées par $0$ en $0$, sont continues sur $\mathbb{R}_{+}$ puisque $a > 0$ ; $f$ est donc continue sur $D$, compact, et y atteint son maximum. Sur le bord de $D$, $f = 0$, et à l'intérieur $f > 0$ : le maximum est atteint en un point intérieur, qui est critique pour $f$, donc pour $\ln f = a\ln x + b\ln y + c\ln(1 - x - y)$. Les équations $\frac{a}{x} = \frac{c}{1 - x - y} = \frac{b}{y}$ donnent, avec $s = a + b + c$, $x = \frac{a}{s}$, $y = \frac{b}{s}$ et $1 - x - y = \frac{c}{s}$. 
    $$\boxed{\sup_{D} f = \frac{a^{a}b^{b}c^{c}}{(a + b + c)^{a + b + c}}}$$
     Pour $a = b = c = 1$, on retrouve le $\frac{1}{27}$ du cours ; la valeur a été vérifiée numériquement pour $(a, b, c) = (1, 2, 3)$.
