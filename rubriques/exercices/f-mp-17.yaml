  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Perspective : décomposition polaire.* On munit $\mathcal{M}_{n}(\mathbb{R})$ du produit scalaire $\langle A, B \rangle = \operatorname{tr}({A}^{T}B)$ et de la norme associée.

    **1.** Montrer que $\mathrm{O}_{n}(\mathbb{R})$ est une partie compacte de $\mathcal{M}_{n}(\mathbb{R})$.

    **2.** Soit $A \in \mathcal{M}_{n}(\mathbb{R})$. Déterminer la différentielle en $0$ de l'application $M \mapsto \lVert A - \exp(M) \rVert^{2}$.

    **3.** On suppose que $\lVert I_{n} - A \rVert \leqslant \lVert \Omega - A \rVert$ pour tout $\Omega \in \mathrm{O}_{n}(\mathbb{R})$. En considérant $t \mapsto \lVert \exp(tM) - A \rVert^{2}$ pour $M$ antisymétrique, montrer que $A \in \mathcal{S}_{n}(\mathbb{R})$.

    **4.** En déduire que toute matrice $A \in \mathcal{M}_{n}(\mathbb{R})$ s'écrit $A = US$, avec $U \in \mathrm{O}_{n}(\mathbb{R})$ et $S \in \mathcal{S}_{n}(\mathbb{R})$.
  corrige: |
    On minimise la distance de $A$ au groupe orthogonal ; la condition du premier ordre, écrite le long des arcs $t \mapsto \exp(tM)$ de l'exercice 32, impose une symétrie.

    **1.** $\mathrm{O}_{n}(\mathbb{R})$ est l'image réciproque de $\{I_{n}\}$ par l'application continue $M \mapsto {M}^{T}M$, donc fermé, et $\lVert \Omega \rVert^{2} = \operatorname{tr}({\Omega}^{T}\Omega) = n$ : il est borné, donc compact (chapitre 5, proposition 13).

    **2.** Par l'exercice 7, $\exp(M) = I_{n} + M + o(M)$, donc $A - \exp(M) = (A - I_{n}) - M + o(M)$, et 
    $$\lVert A - \exp(M) \rVert^{2} = \lVert A - I_{n} \rVert^{2} - 2\langle A - I_{n}, M \rangle + o(M).$$

    $$\boxed{H \mapsto 2\langle I_{n} - A, H \rangle}$$

    **3.** Soit $M \in \mathcal{A}_{n}(\mathbb{R})$. Par l'exercice 32, $\exp(tM) \in \mathrm{O}_{n}(\mathbb{R})$, donc $\psi(t) = \lVert \exp(tM) - A \rVert^{2}$ est minimale en $t = 0$. Par la règle de la chaîne et la question 2, $0 = \psi'(0) = 2\langle I_{n} - A, M \rangle$. Ainsi $I_{n} - A$ est orthogonale à $\mathcal{A}_{n}(\mathbb{R})$, donc symétrique, puisque $\mathcal{M}_{n}(\mathbb{R}) = \mathcal{S}_{n}(\mathbb{R}) \oplus \mathcal{A}_{n}(\mathbb{R})$ est une somme orthogonale pour ce produit scalaire. 
    $$\boxed{A \in \mathcal{S}_{n}(\mathbb{R})}$$

    **4.** La fonction continue $\Omega \mapsto \lVert \Omega - A \rVert$ atteint son minimum sur le compact $\mathrm{O}_{n}(\mathbb{R})$ en un point $U$. Soit $S = {U}^{T}A$. Pour $\Omega \in \mathrm{O}_{n}(\mathbb{R})$, la multiplication par la matrice orthogonale $U$ conserve la norme, puisque $\operatorname{tr}({X}^{T}{U}^{T}UX) = \operatorname{tr}({X}^{T}X)$ ; donc 
    $$\lVert \Omega - S \rVert = \lVert U\Omega - A \rVert \geqslant \lVert U - A \rVert = \lVert I_{n} - S \rVert,$$
     car $U\Omega \in \mathrm{O}_{n}(\mathbb{R})$. La question 3, appliquée à $S$, montre que $S$ est symétrique. 
    $$\boxed{A = US, \qquad U \in \mathrm{O}_{n}(\mathbb{R}), \quad S = {U}^{T}A \in \mathcal{S}_{n}(\mathbb{R})}$$
     On peut de plus choisir $S$ positive, ce qui demande un argument supplémentaire, et l'on obtient alors la décomposition polaire au sens usuel.
