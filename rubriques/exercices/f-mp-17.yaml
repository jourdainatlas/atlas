  enonce: |
    *Inégalité arithmético-géométrique.* Soit $n \geqslant 2$ et $f(x_{1}, \dots, x_{n}) = x_{1}x_{2} \cdots x_{n}$. On note 
    $$\Gamma = \{x \in \mathbb{R}_{+}^{n} \mid x_{1} + \cdots + x_{n} = 1\}.$$

    **1.** Montrer que $f$ admet un maximum global sur $\Gamma$, et le déterminer.

    **2.** En déduire que $\sqrt[n]{a_{1} \cdots a_{n}} \leqslant \frac{a_{1} + \cdots + a_{n}}{n}$ pour tous réels positifs $a_{1}$, …, $a_{n}$.
  corrige: |
    Le maximum existe par compacité ; il n'est pas sur le bord, où le produit est nul, et le théorème 5 sur l'ouvert $(\mathbb{R}_{+}^{*})^{n}$ le localise.

    **1.** $\Gamma$ est fermé et borné, donc compact, et $f$ y atteint son maximum, strictement positif puisque $f\big(\frac{1}{n}, \dots, \frac{1}{n}\big) > 0$. En un point du maximum, aucune coordonnée n'est nulle : c'est un point de $X = \{x \in (\mathbb{R}_{+}^{*})^{n} \mid g(x) = 0\}$, avec $g(x) = x_{1} + \cdots + x_{n} - 1$, où la restriction de $f$ admet un maximum local. Le théorème 5, sur l'ouvert $(\mathbb{R}_{+}^{*})^{n}$ avec $\nabla g = (1, \dots, 1) \neq 0$, donne $\frac{f(x)}{x_{i}} = \lambda$ pour tout $i$ : les $x_{i}$ sont égaux, donc égaux à $\frac{1}{n}$. 
    $$\boxed{\max_{\Gamma} f = \frac{1}{n^{n}}, \text{ atteint en } \Big(\frac{1}{n}, \dots, \frac{1}{n}\Big)}$$

    **2.** Si l'un des $a_{i}$ est nul, l'inégalité est évidente. Sinon, soit $S = a_{1} + \cdots + a_{n} > 0$ et $x_{i} = \frac{a_{i}}{S}$ : $x \in \Gamma$, donc $\frac{a_{1}\cdots a_{n}}{S^{n}} \leqslant \frac{1}{n^{n}}$. 
    $$\boxed{\sqrt[n]{a_{1}\cdots a_{n}} \leqslant \frac{a_{1} + \cdots + a_{n}}{n}}$$
     Le cas d'égalité, d'après l'unicité du point de maximum, est celui où tous les $a_{i}$ sont égaux.
