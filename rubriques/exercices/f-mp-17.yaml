- id: "mp-17-01"
  feuille: "f-mp-17"
  numero: 1
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 1
  types: [Calcul]
  mots_cles: [différentielle]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle]
  source: "Feuille d'exercices #18 (Prost), exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    *Prolongements par continuité.* Les fonctions suivantes sont-elles prolongeables par continuité en $(0, 0)$ ? 
    $$(x, y) \mapsto \frac{x^{2}y}{x^{2} + y^{2}}, \qquad (x, y) \mapsto \frac{xy(x + y)}{x^{2} + y^{2}}, \qquad (x, y) \mapsto \frac{xy}{x^{2} + y^{2}}.$$
     La fonction $(x, y) \mapsto \frac{1 - \cos(xy)}{xy^{2}}$, définie lorsque $x \neq 0$ et $y \neq 0$, est-elle prolongeable par continuité à $\mathbb{R}^{2}$ ?
  corrige: |
    On majore la fonction par une quantité qui tend vers $0$, ou l'on exhibe deux chemins qui donnent des limites différentes. On note $r = \sqrt{x^{2} + y^{2}}$, de sorte que $|x| \leqslant r$, $|y| \leqslant r$ et $|xy| \leqslant \frac{r^{2}}{2}$.

    Première fonction. On a $\left|\frac{x^{2}y}{x^{2} + y^{2}}\right| \leqslant |y| \leqslant r$, qui tend vers $0$.

    Deuxième fonction. On a $\left|\frac{xy(x + y)}{x^{2} + y^{2}}\right| \leqslant \frac{r^{2}}{2}\cdot\frac{2r}{r^{2}} = r$, qui tend vers $0$.

    Troisième fonction. Elle vaut $\frac{1}{2}$ sur la droite $y = x$ et $0$ sur l'axe des abscisses, privés de l'origine : elle n'a pas de limite en $(0, 0)$. 
    $$\boxed{\text{les deux premières se prolongent par } 0 \text{ ; la troisième ne se prolonge pas}}$$

    Quatrième fonction. On écrit $\frac{1 - \cos(xy)}{xy^{2}} = x\,h(xy)$, avec $h(u) = \frac{1 - \cos u}{u^{2}}$ pour $u \neq 0$ et $h(0) = \frac{1}{2}$. La fonction $h$ est continue sur $\mathbb{R}$, puisque $1 - \cos u \sim \frac{u^{2}}{2}$, donc $(x, y) \mapsto x\,h(xy)$ est continue sur $\mathbb{R}^{2}$ et coïncide avec la fonction donnée lorsque $xy \neq 0$. 
    $$\boxed{\text{prolongement continu : } (x, 0) \mapsto \frac{x}{2}, \quad (0, y) \mapsto 0}$$
     *Piège.* Le prolongement ne vaut pas $0$ sur tout l'axe des abscisses : près de $(x_{0}, 0)$ avec $x_{0} \neq 0$, la fonction tend vers $\frac{x_{0}}{2}$.
- id: "mp-17-02"
  feuille: "f-mp-17"
  numero: 2
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [différentielle, matrice jacobienne]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle, matrice-jacobienne]
  source: "BibM@th, Calcul différentiel, exercices 4 et 12"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Dérivées partielles et matrices jacobiennes.*

    **1.** Justifier l'existence des dérivées partielles des fonctions suivantes, et les calculer : 
    $$(x, y) \mapsto \mathrm{e}^{x}\cos y, \qquad (x, y) \mapsto (x^{2} + y^{2})\cos(xy), \qquad (x, y) \mapsto \sqrt{1 + x^{2}y^{2}}.$$

    **2.** Justifier la différentiabilité et calculer la matrice jacobienne en tout point des applications 
    $$f : (x, y, z) \mapsto \Big(\frac{x^{2} - z^{2}}{2}, \sin x \sin y\Big), \qquad g : (x, y) \mapsto \Big(xy, \frac{x^{2}}{2} + y, \ln(1 + x^{2})\Big).$$
  corrige: |
    Les fonctions sont obtenues par opérations sur des fonctions usuelles ; leurs dérivées partielles se calculent en gelant les autres variables, et le théorème 2 donne la différentiabilité.

    **1.** Ces fonctions sont de classe $\mathcal{C}^{\infty}$ comme composées et produits de fonctions de classe $\mathcal{C}^{\infty}$ ($1 + x^{2}y^{2} > 0$). On trouve 
    $$\boxed{\frac{\partial }{\partial x}(\mathrm{e}^{x}\cos y) = \mathrm{e}^{x}\cos y, \qquad \frac{\partial }{\partial y}(\mathrm{e}^{x}\cos y) = -\mathrm{e}^{x}\sin y}$$

    $$\boxed{\begin{aligned} \frac{\partial }{\partial x}\big((x^{2} + y^{2})\cos(xy)\big) &= 2x\cos(xy) - y(x^{2} + y^{2})\sin(xy), \\ \frac{\partial }{\partial y}\big((x^{2} + y^{2})\cos(xy)\big) &= 2y\cos(xy) - x(x^{2} + y^{2})\sin(xy) \end{aligned}}$$

    $$\boxed{\frac{\partial }{\partial x}\sqrt{1 + x^{2}y^{2}} = \frac{xy^{2}}{\sqrt{1 + x^{2}y^{2}}}, \qquad \frac{\partial }{\partial y}\sqrt{1 + x^{2}y^{2}} = \frac{x^{2}y}{\sqrt{1 + x^{2}y^{2}}}}$$

    **2.** Les composantes de $f$ et de $g$ ont des dérivées partielles continues ($1 + x^{2} > 0$), donc $f$ et $g$ sont de classe $\mathcal{C}^{1}$, en particulier différentiables. La ligne $i$ de la matrice jacobienne contient les dérivées partielles de la $i$-ième composante : 
    $$\boxed{J_{f}(x, y, z) = \begin{pmatrix} x & 0 & -z \\ \cos x\sin y & \sin x\cos y & 0 \end{pmatrix}, \qquad J_{g}(x, y) = \begin{pmatrix} y & x \\ x & 1 \\ \frac{2x}{1 + x^{2}} & 0 \end{pmatrix}}$$
- id: "mp-17-03"
  feuille: "f-mp-17"
  numero: 3
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [différentielle]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle]
  source: "BibM@th, Calcul différentiel, exercice 15 (question sur les dérivées selon un vecteur ajoutée)"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $f$ définie par $f(x, y) = \frac{x^{3}}{x^{2} + y^{2}}$ si $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est continue en $(0, 0)$.

    **2.** Montrer que $f$ admet en $(0, 0)$ une dérivée selon tout vecteur $v = (v_{1}, v_{2})$, et la calculer.

    **3.** En déduire que $f$ n'est pas différentiable en $(0, 0)$.
  corrige: |
    La fonction est continue et admet des dérivées dans toutes les directions, mais celles-ci ne dépendent pas linéairement de la direction : c'est l'obstruction de la proposition 1.

    **1.** Pour $(x, y) \neq (0, 0)$, $|f(x, y)| = |x|\,\frac{x^{2}}{x^{2} + y^{2}} \leqslant |x|$, qui tend vers $0$. 
    $$\boxed{f \text{ est continue en } (0, 0)}$$

    **2.** Pour $v \neq 0$ et $t \neq 0$, $\frac{f(tv) - f(0, 0)}{t} = \frac{t^{3}v_{1}^{3}}{t\cdot t^{2}(v_{1}^{2} + v_{2}^{2})} = \frac{v_{1}^{3}}{v_{1}^{2} + v_{2}^{2}}$, indépendant de $t$ ; pour $v = 0$, la dérivée est nulle. 
    $$\boxed{D_{v} f(0, 0) = \frac{v_{1}^{3}}{v_{1}^{2} + v_{2}^{2}} \quad (v \neq 0)}$$

    **3.** Si $f$ était différentiable en $(0, 0)$, la proposition 1 donnerait $D_{v} f(0, 0) = \mathrm{d} f(0, 0)\cdot v$, linéaire en $v$. Or $D_{e_{1}} f = 1$ et $D_{e_{2}} f = 0$, donc on aurait $D_{(1, 1)} f = 1$, alors que la formule donne $\frac{1}{2}$. 
    $$\boxed{f \text{ n'est pas différentiable en } (0, 0)}$$
- id: "mp-17-04"
  feuille: "f-mp-17"
  numero: 4
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 2
