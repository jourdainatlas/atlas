  enonce: |
    *Une boîte sans couvercle.* Une boîte sans couvercle a la forme d'un parallélépipède rectangle de volume $0{,}5\ \mathrm{m}^{3}$. Comment choisir ses dimensions pour que l'aire totale de ses faces soit minimale ?
  corrige: |
    On élimine la hauteur grâce à la contrainte de volume, et l'on minimise une fonction de deux variables sur un ouvert.

    Soit $x$, $y$ les côtés du fond et $z$ la hauteur, avec $xyz = \frac{1}{2}$. L'aire est $xy + 2xz + 2yz$, et $z = \frac{1}{2xy}$ donne 
    $$A(x, y) = xy + \frac{1}{x} + \frac{1}{y}, \qquad (x, y) \in (\mathbb{R}_{+}^{*})^{2}.$$
     Les points critiques vérifient $y = \frac{1}{x^{2}}$ et $x = \frac{1}{y^{2}}$, d'où $x = y = 1$. C'est un minimum global : par l'inégalité arithmético-géométrique (exercice 31), $A(x, y) \geqslant 3\big(xy\cdot\frac{1}{x}\cdot\frac{1}{y}\big)^{1/3} = 3 = A(1, 1)$. 
    $$\boxed{\text{fond carré de } 1\ \mathrm{m} \text{ de côté, hauteur } 0{,}5\ \mathrm{m}, \text{ aire minimale } 3\ \mathrm{m}^{2}}$$
     La hauteur optimale vaut la moitié du côté : la boîte est un demi-cube, ce que l'on comprend en la complétant par sa symétrique par rapport au plan du couvercle.
