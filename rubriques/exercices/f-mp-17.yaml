  page_enonce: 2
  page_corrige: 4
  enonce: |
    Déterminer la différentielle en $0$ de l'application $\exp : \mathcal{M}_{n}(\mathbb{C}) \to \mathcal{M}_{n}(\mathbb{C})$.
  corrige: |
    On isole les deux premiers termes de la série exponentielle et l'on majore le reste.

    Pour une norme sous-multiplicative, 
    $$\lVert \exp(H) - I_{n} - H \rVert \leqslant \sum_{k \geqslant 2} \frac{\lVert H \rVert^{k}}{k!} \leqslant \lVert H \rVert^{2}\mathrm{e}^{\lVert H \rVert} = o(H).$$

    $$\boxed{\mathrm{d}\exp(0) = \mathrm{id}_{\mathcal{M}_{n}(\mathbb{C})}}$$
     C'est la majoration de la question 1 de l'exercice 47 de la feuille du chapitre 16.
- id: "mp-17-08"
  feuille: "f-mp-17"
  numero: 8
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [différentielle]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle]
  source: "Feuille d'exercices #18 (Prost), exercice 17 (généralisé à la puissance k)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $k \geqslant 1$ un entier. Établir la différentiabilité, et calculer les différentielles en tout point, des applications définies sur $\mathcal{M}_{n}(\mathbb{R})$ par $f(M) = M^{k}$ et $g(M) = \operatorname{tr}(M^{k})$. Que devient $\mathrm{d} f(M)\cdot H$ lorsque $H$ commute avec $M$ ?
  corrige: |
    On développe $(M + H)^{k}$ par distributivité, sans commuter les facteurs, et l'on garde les termes de degré $1$ en $H$.

    Puissance. $(M + H)^{k}$ est la somme des $2^{k}$ produits de $k$ facteurs égaux à $M$ ou à $H$. Les termes contenant au moins deux facteurs $H$ sont majorés, pour une norme sous-multiplicative, par $\lVert H \rVert^{2}(\lVert M \rVert + \lVert H \rVert)^{k - 2}$, donc forment un $o(H)$. Il reste $M^{k}$ et les $k$ termes contenant un seul $H$ : 
    $$\boxed{\mathrm{d} f(M)\cdot H = \sum_{i=0}^{k - 1} M^{i}HM^{k - 1 - i}}$$

    Trace. Par la règle de la chaîne, avec $\operatorname{tr}$ linéaire, $\mathrm{d} g(M)\cdot H = \sum_{i} \operatorname{tr}(M^{i}HM^{k - 1 - i}) = \sum_{i} \operatorname{tr}(M^{k - 1}H)$, puisque $\operatorname{tr}(AB) = \operatorname{tr}(BA)$. 
    $$\boxed{\mathrm{d} g(M)\cdot H = k\,\operatorname{tr}(M^{k - 1}H)}$$
     Si $H$ commute avec $M$, chaque terme vaut $M^{k - 1}H$, et $\mathrm{d} f(M)\cdot H = kM^{k - 1}H$ : on retrouve la formule $(x^{k})' = kx^{k - 1}$.
- id: "mp-17-09"
  feuille: "f-mp-17"
  numero: 9
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [différentielle, gradient]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle, gradient]
  source: "BibM@th, Calcul différentiel, exercice 19 ; Feuille d'exercices #18 (Prost), exercice 19"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $E$ un espace euclidien.

    **1.** Montrer que la norme euclidienne $N : x \mapsto \lVert x \rVert$ est différentiable sur $E \setminus \{0\}$, et calculer son gradient.

    **2.** Montrer que $N$ n'est pas différentiable en $0$.

    **3.** Soit $\alpha > 0$. Déterminer le gradient de $f : x \mapsto \lVert x \rVert^{\alpha}$ sur $E \setminus \{0\}$. Pour quelles valeurs de $\alpha$ la fonction $f$ est-elle différentiable en $0$ ?
  corrige: |
    On écrit $N = \sqrt{q}$, où $q(x) = \lVert x \rVert^{2}$ a pour gradient $2x$, et l'on compose.

    **1.** La fonction $q$ est différentiable, de gradient $2x$ (cours, section 17.3), et $\sqrt{\cdot}$ est dérivable sur $\mathbb{R}_{+}^{*}$. Par la règle de la chaîne, pour $x \neq 0$, $\mathrm{d} N(x)\cdot h = \frac{2\langle x, h \rangle}{2\sqrt{q(x)}}$. 
    $$\boxed{\nabla N(x) = \frac{x}{\lVert x \rVert}}$$

    **2.** Pour $v \neq 0$, $t \mapsto N(tv) = |t|\,\lVert v \rVert$ n'est pas dérivable en $0$ : $N$ n'admet pas de dérivée selon $v$ en $0$, donc n'y est pas différentiable (proposition 1).

    **3.** Sur $E \setminus \{0\}$, $f = N^{\alpha}$, et $\mathrm{d} f(x)\cdot h = \alpha N(x)^{\alpha - 1}\,\mathrm{d} N(x)\cdot h$. 
    $$\boxed{\nabla f(x) = \alpha\lVert x \rVert^{\alpha - 2}\,x}$$
     Si $\alpha > 1$, $|f(h)| = \lVert h \rVert^{\alpha} = o(h)$, et $f$ est différentiable en $0$, de différentielle nulle. Si $\alpha \leqslant 1$, $t \mapsto f(tv) = |t|^{\alpha}\lVert v \rVert^{\alpha}$ n'est pas dérivable en $0$ pour $v \neq 0$. 
    $$\boxed{f \text{ est différentiable en } 0 \iff \alpha > 1}$$
