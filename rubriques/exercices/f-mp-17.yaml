  source: "Feuille d'exercices #18 (Prost), exercice 34"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On munit $\mathbb{R}^{n}$ de sa structure euclidienne canonique. Soit $(\alpha_{1}, \dots, \alpha_{n}) \in \mathbb{R}^{n} \setminus \{0\}$, $\beta \in \mathbb{R}$, et $\mathcal{H}$ l'hyperplan affine d'équation $\alpha_{1}x_{1} + \cdots + \alpha_{n}x_{n} = \beta$.

    **1.** Déterminer la distance d'un point $M_{0}$ à $\mathcal{H}$ par une minimisation sous contrainte.

    **2.** Retrouver ce résultat par un raisonnement géométrique élémentaire.
  corrige: |
    On minimise le carré de la distance sous la contrainte affine, puis l'on retrouve le résultat par une projection orthogonale.

    **1.** Soit $\alpha = (\alpha_{1}, \dots, \alpha_{n})$, $f(M) = \lVert M - M_{0} \rVert^{2}$ et $g(M) = \langle \alpha, M \rangle - \beta$, de gradient $\alpha \neq 0$. L'hyperplan $\mathcal{H}$ est fermé et non vide, et la distance de $M_{0}$ à $\mathcal{H}$ est atteinte (chapitre 5). En un point où elle l'est, $\nabla f = 2(M - M_{0}) = \lambda\alpha$ : $M = M_{0} + \mu\alpha$, et $g(M) = 0$ donne $\mu = \frac{\beta - \langle \alpha, M_{0} \rangle}{\lVert \alpha \rVert^{2}}$. Ce point est unique, donc c'est le projeté, et $d = |\mu|\,\lVert \alpha \rVert$. 
    $$\boxed{d(M_{0}, \mathcal{H}) = \frac{|\alpha_{1}x_{1}^{0} + \cdots + \alpha_{n}x_{n}^{0} - \beta|}{\sqrt{\alpha_{1}^{2} + \cdots + \alpha_{n}^{2}}}}$$

    **2.** Le vecteur $\alpha$ est normal à $\mathcal{H}$. Si $A \in \mathcal{H}$, la distance de $M_{0}$ à $\mathcal{H}$ est la norme de la projection orthogonale de $\overrightarrow{AM_{0}}$ sur $\mathbb{R}\alpha$ (chapitre 19 de MPSI), soit $\frac{|\langle \alpha, M_{0} - A \rangle|}{\lVert \alpha \rVert} = \frac{|\langle \alpha, M_{0} \rangle - \beta|}{\lVert \alpha \rVert}$.
