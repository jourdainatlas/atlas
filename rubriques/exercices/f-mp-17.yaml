  enonce: |
    Soit $E$ un espace euclidien, $a \in \mathcal{S}^{++}(E)$, $b \in E$, et $\varphi(x) = \langle a(x), x \rangle - 2\langle b, x \rangle$ pour $x \in E$.

    **1.** Montrer que $\varphi(x) \to +\infty$ quand $\lVert x \rVert \to +\infty$, et en déduire que $\varphi$ admet un minimum sur $E$.

    **2.** Montrer que ce minimum est atteint en l'unique solution de l'équation $a(x) = b$, et calculer sa valeur.

    **3.** Retrouver ce résultat sans calcul différentiel, en développant $\varphi(x_{0} + h)$, où $a(x_{0}) = b$.
  corrige: |
    C'est la minimisation d'une fonction quadratique : la coercivité donne l'existence, le gradient localise le minimum, et un développement exact le confirme.

    **1.** Soit $\lambda > 0$ la plus petite valeur propre de $a$. Par le théorème 5 du chapitre 7 et l'inégalité de Cauchy-Schwarz, 
    $$\varphi(x) \geqslant \lambda\lVert x \rVert^{2} - 2\lVert b \rVert\,\lVert x \rVert \xrightarrow[\lVert x \rVert \to +\infty]{} +\infty.$$
     Comme à l'exercice 45, $\varphi$, continue, atteint un minimum global, en un point critique.

    **2.** Comme $a$ est autoadjoint, 
    $$\mathrm{d}\varphi(x)\cdot h = \langle a(h), x \rangle + \langle a(x), h \rangle - 2\langle b, h \rangle = 2\langle a(x) - b, h \rangle, \qquad \nabla\varphi(x) = 2\big(a(x) - b\big).$$
     L'endomorphisme $a$ est inversible, ses valeurs propres étant non nulles : l'unique point critique est $x_{0} = a^{-1}(b)$, et $\varphi(x_{0}) = \langle b, x_{0} \rangle - 2\langle b, x_{0} \rangle$. 
    $$\boxed{\min_{E}\varphi = \varphi(x_{0}) = -\langle b, a^{-1}(b) \rangle, \qquad a(x_{0}) = b}$$

    **3.** Avec $a(x_{0}) = b$ et $a$ autoadjoint, $\varphi(x_{0} + h) = \varphi(x_{0}) + 2\langle a(x_{0}) - b, h \rangle + \langle a(h), h \rangle = \varphi(x_{0}) + \langle a(h), h \rangle$, et $\langle a(h), h \rangle > 0$ pour $h \neq 0$ : $x_{0}$ est l'unique point de minimum. C'est le principe de la méthode des moindres carrés et de nombreuses méthodes numériques : résoudre $a(x) = b$ revient à minimiser $\varphi$.
- id: "mp-17-47"
  feuille: "f-mp-17"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, gradient, matrice hessienne, extremums]
  noeuds: [gd-differentielle, fq-taylor-young, fq-points-critiques]
  notions: [gradient, matrice-hessienne, extremum-local-rn, point-critique]
  page_enonce: 8
  page_corrige: 20
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Une fonction de $\mathbb{R}^{2}$ dans $\mathbb{R}$ qui admet des dérivées partielles en un point est continue en ce point.

    **2.** Une fonction différentiable en $a$ admet en $a$ une dérivée selon tout vecteur.

    **3.** Une application linéaire de $\mathbb{R}^{n}$ dans $\mathbb{R}^{p}$ est de classe $\mathcal{C}^{\infty}$.

    **4.** Si $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ admet un unique point critique, et si $f$ y admet un minimum local, ce minimum est global.

    **5.** La matrice hessienne d'une fonction de classe $\mathcal{C}^{2}$ est symétrique.

    **6.** Si $a$ est un point critique de $f$ de classe $\mathcal{C}^{2}$ et si $H_{f}(a) \in \mathcal{S}_{n}^{+}(\mathbb{R})$, alors $f$ admet un minimum local en $a$.

    **7.** Le gradient de $x \mapsto \lVert x \rVert^{2}$ en $x$ est $2x$.

    **8.** Une fonction différentiable de différentielle nulle sur un ouvert $\Omega$ est constante sur $\Omega$.

    **9.** Si $f : \mathbb{R}^{2} \to \mathbb{R}$ est de classe $\mathcal{C}^{1}$ et vérifie $\frac{\partial f}{\partial x} = 0$ sur $\mathbb{R}^{2}$, alors $f(x, y)$ ne dépend que de $y$.

    **10.** L'application $M \mapsto M^{-1}$ est différentiable sur $\mathrm{GL}_{n}(\mathbb{R})$, et sa différentielle en $I_{n}$ est $H \mapsto -H$.
  corrige: |
    Six affirmations sont vraies (2, 3, 5, 7, 9, 10) et quatre sont fausses (1, 4, 6, 8).

    **1.** *Faux.* $(x, y) \mapsto \frac{xy}{x^{2} + y^{2}}$, prolongée par $0$, a des dérivées partielles nulles en $(0, 0)$, mais n'y est pas continue (exercice 1).

    **2.** *Vrai.* C'est la proposition 1.

    **3.** *Vrai.* Ses dérivées partielles d'ordre $1$ sont constantes, et celles d'ordre supérieur sont nulles.

    **4.** *Faux.* $f(x, y) = x^{2} + y^{2}(1 - x)^{3}$ a pour seul point critique $(0, 0)$, où elle a un minimum local strict (hessienne $2I_{2}$), mais $f(4, 1) = 16 - 27 = -11 < 0 = f(0, 0)$. En effet, $\frac{\partial f}{\partial y} = 2y(1 - x)^{3} = 0$ impose $y = 0$, ou $x = 1$, auquel cas $\frac{\partial f}{\partial x} = 2 \neq 0$ ; et $y = 0$ impose $x = 0$.

    **5.** *Vrai.* C'est le théorème de Schwarz.

    **6.** *Faux.* $f(x, y) = x^{3} + y^{2}$ a en $(0, 0)$ un point critique de hessienne $\begin{pmatrix} 0 & 0 \\ 0 & 2 \end{pmatrix}$, positive, mais $f(t, 0) < 0$ pour $t < 0$.

    **7.** *Vrai.* $\lVert x + h \rVert^{2} = \lVert x \rVert^{2} + 2\langle x, h \rangle + \lVert h \rVert^{2}$.

    **8.** *Faux.* Sur la réunion de deux boules ouvertes disjointes, la fonction égale à $0$ sur l'une et à $1$ sur l'autre a une différentielle nulle. Il faut supposer $\Omega$ connexe par arcs (proposition 10).

    **9.** *Vrai.* À $y$ fixé, la fonction $x \mapsto f(x, y)$ a une dérivée nulle sur l'intervalle $\mathbb{R}$, donc $f(x, y) = f(0, y)$.

    **10.** *Vrai.* C'est l'exemple de la section 17.2 du cours.
