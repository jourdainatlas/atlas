  source: "BibM@th, Calcul différentiel, exercice 37"
  page_enonce: 5
  page_corrige: 11
  enonce: |
    *En détail.* Soit $D = \{(x, y) \in \mathbb{R}^{2} \mid x^{2} - 1 \leqslant y \leqslant 1 - x^{2}\}$ et $f(x, y) = y^{2} - x^{2}y + x^{2}$.

    **1.** Représenter $D$, et paramétrer sa frontière $\Gamma$.

    **2.** Justifier que $f$ admet un maximum et un minimum sur $D$.

    **3.** Déterminer les points critiques de $f$ à l'intérieur de $D$.

    **4.** Déterminer le minimum et le maximum de $f$ sur $\Gamma$.

    **5.** En déduire le minimum et le maximum de $f$ sur $D$.
  corrige: |
    C'est la méthode du cours (section 17.5) appliquée en détail : existence par compacité, candidats intérieurs, puis étude sur le bord par paramétrage.

    **1.** $D$ est la région comprise entre les paraboles $y = x^{2} - 1$ et $y = 1 - x^{2}$, qui se coupent en $(\pm 1, 0)$ ; elle est définie pour $x \in [-1, 1]$. Sa frontière $\Gamma$ est la réunion des deux arcs $t \mapsto (t, 1 - t^{2})$ et $t \mapsto (t, t^{2} - 1)$, pour $t \in [-1, 1]$.

    **2.** $D$ est fermée, comme intersection de deux images réciproques de fermés par des fonctions continues, et bornée ($|x| \leqslant 1$, $|y| \leqslant 1$) : elle est compacte, et $f$, continue, y atteint ses bornes.

    **3.** $\frac{\partial f}{\partial x} = 2x(1 - y)$ et $\frac{\partial f}{\partial y} = 2y - x^{2}$. Si $x = 0$, alors $y = 0$ ; si $y = 1$, alors $x^{2} = 2$, ce qui sort de $D$. Le seul point critique intérieur est $(0, 0)$, où $f = 0$.

    **4.** Sur l'arc supérieur, $f(t, 1 - t^{2}) = 2t^{4} - 2t^{2} + 1 = 2\big(t^{2} - \frac{1}{2}\big)^{2} + \frac{1}{2}$, qui varie entre $\frac{1}{2}$, pour $t^{2} = \frac{1}{2}$, et $1$, pour $t \in \{-1, 0, 1\}$. Sur l'arc inférieur, $f(t, t^{2} - 1) = (t^{2} - 1)^{2} - t^{2}(t^{2} - 1) + t^{2} = 1$ : $f$ y est constante. 
    $$\boxed{\min_{\Gamma} f = \frac{1}{2} \text{ en } \Big(\pm\frac{1}{\sqrt{2}}, \frac{1}{2}\Big), \qquad \max_{\Gamma} f = 1}$$

    **5.** Les extremums de $f$ sur $D$ sont atteints en un point critique intérieur ou sur $\Gamma$. Les candidats donnent $0$, $\frac{1}{2}$ et $1$. 
    $$\boxed{\min_{D} f = 0 \text{ en } (0, 0), \qquad \max_{D} f = 1 \text{ (sur tout l'arc inférieur et en } (0, 1))}$$
     Un calcul numérique sur une grille fine de $D$ donne les mêmes valeurs.
