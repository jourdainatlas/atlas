  notions: [classe-ck]
  source: "BibM@th, Calcul différentiel, exercice 11 ; Feuille d'exercices #18 (Prost), exercice 11"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Primitives.* Déterminer les fonctions $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ qui vérifient, pour tout $(x, y) \in \mathbb{R}^{2}$ :

    **1.** $\frac{\partial f}{\partial x}(x, y) = xy^{2}$ et $\frac{\partial f}{\partial y}(x, y) = x^{2}y$ ;

    **2.** $\frac{\partial f}{\partial x}(x, y) = \mathrm{e}^{x}y$ et $\frac{\partial f}{\partial y}(x, y) = \mathrm{e}^{x} + 2y$ ;

    **3.** $\frac{\partial f}{\partial x}(x, y) = 0$ et $\frac{\partial f}{\partial y}(x, y) = 2y$ ;

    **4.** $\frac{\partial f}{\partial x}(x, y) = x^{2}y$ et $\frac{\partial f}{\partial y}(x, y) = xy^{2}$.
  corrige: |
    On intègre la première équation par rapport à $x$, avec une « constante » qui dépend de $y$, puis on utilise la seconde. À $y$ fixé, deux fonctions de $x$ de même dérivée sur $\mathbb{R}$ diffèrent d'une constante.

    **1.** $f(x, y) = \frac{x^{2}y^{2}}{2} + c(y)$, puis $x^{2}y + c'(y) = x^{2}y$, d'où $c$ constante. $\boxed{f(x, y) = \frac{x^{2}y^{2}}{2} + C}$

    **2.** $f(x, y) = \mathrm{e}^{x}y + c(y)$, puis $\mathrm{e}^{x} + c'(y) = \mathrm{e}^{x} + 2y$, d'où $c(y) = y^{2} + C$. $\boxed{f(x, y) = \mathrm{e}^{x}y + y^{2} + C}$

    **3.** $f(x, y) = c(y)$, puis $c'(y) = 2y$. $\boxed{f(x, y) = y^{2} + C}$

    **4.** Si $f$ convenait, ses dérivées partielles seraient de classe $\mathcal{C}^{1}$, donc $f$ serait de classe $\mathcal{C}^{2}$, et le théorème de Schwarz donnerait $\frac{\partial }{\partial y}(x^{2}y) = \frac{\partial }{\partial x}(xy^{2})$, c'est-à-dire $x^{2} = y^{2}$ pour tous $x$, $y$ : c'est faux. 
    $$\boxed{\text{aucune solution}}$$
     La condition $\frac{\partial P}{\partial y} = \frac{\partial Q}{\partial x}$ est nécessaire pour que $(P, Q)$ soit le gradient d'une fonction ; sur $\mathbb{R}^{2}$, elle est aussi suffisante, ce que l'on ne démontre pas ici.
