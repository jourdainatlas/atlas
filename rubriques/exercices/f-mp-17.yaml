  enonce: |
    *Vecteurs tangents au groupe orthogonal.* On note $\mathcal{A}_{n}(\mathbb{R})$ l'ensemble des matrices antisymétriques de $\mathcal{M}_{n}(\mathbb{R})$.

    **1.** Soit $\gamma : \left]-\varepsilon, \varepsilon\right[ \to \mathrm{O}_{n}(\mathbb{R})$ dérivable en $0$, avec $\gamma(0) = I_{n}$. En dérivant ${\gamma(t)}^{T}\gamma(t) = I_{n}$, montrer que $\gamma'(0) \in \mathcal{A}_{n}(\mathbb{R})$.

    **2.** Soit $A \in \mathcal{A}_{n}(\mathbb{R})$. Montrer que $\exp(tA) \in \mathrm{O}_{n}(\mathbb{R})$ pour tout réel $t$.

    **3.** En déduire que $T_{I_{n}}\mathrm{O}_{n}(\mathbb{R}) = \mathcal{A}_{n}(\mathbb{R})$, puis déterminer $T_{\Omega}\mathrm{O}_{n}(\mathbb{R})$ pour $\Omega \in \mathrm{O}_{n}(\mathbb{R})$.
  corrige: |
    La contrainte ${M}^{T}M = I_{n}$ est matricielle, et le théorème 4 ne s'applique pas tel quel ; on revient à la définition des vecteurs tangents, en construisant des arcs avec l'exponentielle.

    **1.** L'application $(A, B) \mapsto {A}^{T}B$ est bilinéaire ; par la proposition 5, $t \mapsto {\gamma(t)}^{T}\gamma(t)$ est dérivable en $0$, de dérivée ${\gamma'(0)}^{T}\gamma(0) + {\gamma(0)}^{T}\gamma'(0) = {\gamma'(0)}^{T} + \gamma'(0)$. Cette fonction étant constante, cette dérivée est nulle. 
    $$\boxed{\gamma'(0) \in \mathcal{A}_{n}(\mathbb{R})}$$

    **2.** ${\exp(tA)}^{T} = \exp(t{A}^{T}) = \exp(-tA) = \exp(tA)^{-1}$, puisque $tA$ et $-tA$ commutent (chapitre 16, théorème 3). 
    $$\boxed{\exp(tA) \in \mathrm{O}_{n}(\mathbb{R})}$$

    **3.** D'après la question 1, on a l'inclusion $T_{I_{n}}\mathrm{O}_{n}(\mathbb{R}) \subset \mathcal{A}_{n}(\mathbb{R})$. Réciproquement, pour $A$ antisymétrique, l'arc $t \mapsto \exp(tA)$ est tracé sur le groupe orthogonal, vaut $I_{n}$ en $0$, et a pour dérivée $A$ en $0$. Pour $\Omega \in \mathrm{O}_{n}(\mathbb{R})$, l'application $\gamma \mapsto \Omega\gamma$ échange les arcs tracés sur $\mathrm{O}_{n}(\mathbb{R})$ passant par $I_{n}$ et ceux passant par $\Omega$ (son inverse est $\gamma \mapsto {\Omega}^{T}\gamma$), et transforme la vitesse $v$ en $\Omega v$. 
    $$\boxed{T_{I_{n}}\mathrm{O}_{n}(\mathbb{R}) = \mathcal{A}_{n}(\mathbb{R}), \qquad T_{\Omega}\mathrm{O}_{n}(\mathbb{R}) = \Omega\,\mathcal{A}_{n}(\mathbb{R})}$$
     Ainsi $\mathrm{O}_{n}(\mathbb{R})$ a, en chaque point, un espace tangent de dimension $\frac{n(n - 1)}{2}$ : pour $n = 2$, on retrouve la droite tangente au cercle des rotations.
- id: "mp-17-33"
  feuille: "f-mp-17"
