  enonce: |
    Soit $E$ un espace euclidien et $u \in E \setminus \{0\}$. Étudier les extremums de la fonction $f : x \mapsto \lVert x \rVert^{4} - \langle x, u \rangle$.
  corrige: |
    La fonction tend vers $+\infty$ à l'infini ; elle admet donc un minimum global, en un point critique, que l'on détermine.

    Existence d'un minimum. $f(x) \geqslant \lVert x \rVert^{4} - \lVert x \rVert\,\lVert u \rVert$, qui tend vers $+\infty$. Il existe $R > 0$ tel que $f > f(0) = 0$ hors de la boule fermée $B_{f}(0, R)$, compacte ; le minimum de $f$ sur cette boule est un minimum global, atteint en un point intérieur, donc critique.

    Points critiques. $\nabla f(x) = 4\lVert x \rVert^{2}x - u$ s'annule si et seulement si $x = t\,\frac{u}{\lVert u \rVert}$ avec $t > 0$ et $4t^{3} = \lVert u \rVert$ : il y a un unique point critique, $x^{*} = \big(\frac{\lVert u \rVert}{4}\big)^{1/3}\frac{u}{\lVert u \rVert}$, qui est le point de minimum. On calcule $f(x^{*}) = t^{4} - t\lVert u \rVert = t\big(\frac{\lVert u \rVert}{4} - \lVert u \rVert\big)$. 
    $$\boxed{\min_{E} f = -\frac{3}{4}\Big(\frac{\lVert u \rVert}{4}\Big)^{1/3}\lVert u \rVert, \text{ atteint en } x^{*} \ ; \ \text{pas de maximum, ni d'autre extremum local}}$$
     Il n'y a pas d'autre extremum local, puisqu'il n'y a pas d'autre point critique. La valeur a été vérifiée numériquement pour $u = (3, 4)$.
- id: "mp-17-46"
