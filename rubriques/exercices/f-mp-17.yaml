  source: "Feuille d'exercices #18 (Prost), exercice 21"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Différentielle du déterminant.*

    **1.** Montrer que $\det : \mathcal{M}_{n}(\mathbb{R}) \to \mathbb{R}$ est de classe $\mathcal{C}^{\infty}$.

    **2.** Calculer $\mathrm{d}\det(I_{n})$, puis $\mathrm{d}\det(A)$ pour $A \in \mathrm{GL}_{n}(\mathbb{R})$, en écrivant $A + H = A(I_{n} + A^{-1}H)$.

    **3.** En déduire que $\mathrm{d}\det(A)\cdot H = \operatorname{tr}\big({\mathrm{Com}(A)}^{T}H\big)$ pour toute matrice $A \in \mathcal{M}_{n}(\mathbb{R})$.
  corrige: |
    Le déterminant est polynomial en les coefficients ; sa différentielle en $A$ inversible se ramène à celle en $I_{n}$, calculée dans le cours.

    **1.** $\det M = \sum_{\sigma} \varepsilon(\sigma)\prod_{j} m_{\sigma(j)j}$ est une fonction polynomiale des $n^{2}$ coefficients, dont toutes les dérivées partielles, à tout ordre, sont polynomiales, donc continues. 
    $$\boxed{\det \text{ est de classe } \mathcal{C}^{\infty} \text{ sur } \mathcal{M}_{n}(\mathbb{R})}$$

    **2.** Le cours (section 17.3) donne $\mathrm{d}\det(I_{n})\cdot H = \operatorname{tr} H$, c'est-à-dire $\det(I_{n} + K) = 1 + \operatorname{tr} K + o(K)$. Pour $A$ inversible, comme $\lVert A^{-1}H \rVert \leqslant |\mkern-1.5mu|\mkern-1.5mu|A^{-1}|\mkern-1.5mu|\mkern-1.5mu|\lVert H \rVert$, 
    $$\det(A + H) = \det A\,\det(I_{n} + A^{-1}H) = \det A\,\big(1 + \operatorname{tr}(A^{-1}H) + o(H)\big).$$

    $$\boxed{\mathrm{d}\det(I_{n})\cdot H = \operatorname{tr} H, \qquad \mathrm{d}\det(A)\cdot H = \det(A)\,\operatorname{tr}(A^{-1}H)}$$

    **3.** Pour $A$ inversible, $\det(A)A^{-1} = {\mathrm{Com}(A)}^{T}$, donc $\mathrm{d}\det(A)\cdot H = \operatorname{tr}\big({\mathrm{Com}(A)}^{T}H\big)$. Les deux membres sont des fonctions continues de $A$, à $H$ fixé : le premier car $\det$ est de classe $\mathcal{C}^{1}$, le second car les cofacteurs sont polynomiaux. Comme $\mathrm{GL}_{n}(\mathbb{R})$ est dense dans $\mathcal{M}_{n}(\mathbb{R})$ (chapitre 4), l'égalité s'étend à toute $A$. 
    $$\boxed{\forall A \in \mathcal{M}_{n}(\mathbb{R}), \quad \mathrm{d}\det(A)\cdot H = \operatorname{tr}\big({\mathrm{Com}(A)}^{T}H\big)}$$
     En particulier, $\frac{\partial \det}{\partial m_{ij}}(A)$ est le cofacteur d'indice $(i, j)$ : c'est le développement du déterminant suivant une ligne, lu comme une dérivée.
