  enonce: |
    *Cas dégénérés.* Déterminer les extremums locaux des fonctions suivantes sur $\mathbb{R}^{2}$ ; dans chaque cas, on constatera que le théorème 8 ne permet pas toujours de conclure.

    **1.** $f(x, y) = x^{2} + y^{3}$ ;

    **2.** $f(x, y) = x^{4} + y^{3} - 3y - 2$ ;

    **3.** $f(x, y) = x^{3} + xy^{2} - x^{2}y - y^{3}$.
  corrige: |
    Lorsque $rt - s^{2} = 0$, la proposition 14 ne conclut pas, et l'on étudie directement le signe de $f(a + h) - f(a)$ le long de directions bien choisies.

    **1.** Le seul point critique est $(0, 0)$, de hessienne $\begin{pmatrix} 2 & 0 \\ 0 & 0 \end{pmatrix}$, dégénérée. Comme $f(0, y) = y^{3}$ change de signe, il n'y a pas d'extremum.

    **2.** $\nabla f = (4x^{3}, 3y^{2} - 3)$ s'annule en $(0, 1)$ et $(0, -1)$, de hessiennes $\begin{pmatrix} 0 & 0 \\ 0 & \pm 6 \end{pmatrix}$, dégénérées.

    En $(0, 1)$, $f(h, 1 + k) - f(0, 1) = h^{4} + 3k^{2} + k^{3} = h^{4} + k^{2}(3 + k)$, strictement positif pour $(h, k) \neq (0, 0)$ et $|k| < 3$ : minimum local strict, de valeur $-4$, non global puisque $f(0, y) \to -\infty$ en $-\infty$.

    En $(0, -1)$, $f(h, -1 + k) - f(0, -1) = h^{4} - 3k^{2} + k^{3}$, positif pour $k = 0$ et $h \neq 0$, négatif pour $h = 0$ et $k$ petit non nul : pas d'extremum.

    **3.** $f(x, y) = (x - y)(x^{2} + y^{2})$. Les dérivées partielles vérifient $\frac{\partial f}{\partial x} + \frac{\partial f}{\partial y} = 2(x^{2} - y^{2})$ ; si $x = y$, $\frac{\partial f}{\partial x} = 2x^{2}$, et si $x = -y$, $\frac{\partial f}{\partial x} = 6x^{2}$ : le seul point critique est $(0, 0)$, de hessienne nulle. Comme $f$ change de signe de part et d'autre de la droite $y = x$, il n'y a pas d'extremum. 
    $$\boxed{\text{1 : aucun ; 2 : minimum local strict en } (0, 1) \text{ seulement ; 3 : aucun}}$$
