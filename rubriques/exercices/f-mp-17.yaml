  notions: [differentiable, derivee-partielle]
  source: "BibM@th, Calcul différentiel, exercice 7"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    *Continue, sans dérivées partielles.* Soit $f(x, y) = \frac{x^{2}}{(x^{2} + y^{2})^{3/4}}$ pour $(x, y) \neq (0, 0)$. Montrer que $f$ se prolonge par continuité à $\mathbb{R}^{2}$, puis étudier l'existence des dérivées partielles de ce prolongement en $(0, 0)$.
  corrige: |
    On majore pour la continuité, puis l'on revient à la définition des dérivées partielles, qui sont des dérivées de fonctions d'une variable.

    Continuité. Comme $x^{2} \leqslant x^{2} + y^{2}$, on a $0 \leqslant f(x, y) \leqslant (x^{2} + y^{2})^{1/4}$, qui tend vers $0$ : $f$ se prolonge par $f(0, 0) = 0$.

    Dérivées partielles en $(0, 0)$. On a $f(0, t) = 0$ pour tout $t$, donc $\frac{\partial f}{\partial y}(0, 0) = 0$. En revanche, $f(t, 0) = \frac{t^{2}}{|t|^{3/2}} = |t|^{1/2}$, et $\frac{f(t, 0) - f(0, 0)}{t} = \frac{|t|^{1/2}}{t}$ tend vers $+\infty$ en $0^{+}$ et vers $-\infty$ en $0^{-}$. 
    $$\boxed{\frac{\partial f}{\partial y}(0, 0) = 0, \qquad \frac{\partial f}{\partial x}(0, 0) \text{ n'existe pas}}$$
     La fonction d'une variable $t \mapsto |t|^{1/2}$ a une tangente verticale en $0$ : la continuité n'entraîne pas l'existence des dérivées partielles.
- id: "mp-17-05"
  feuille: "f-mp-17"
  numero: 5
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [différentielle]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle]
  source: "BibM@th, Calcul différentiel, exercice 16"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Différentiable, mais pas de classe $\mathcal{C}^{1}$.* Soit $f$ définie par $f(x, y) = (x^{2} + y^{2})\sin\Big(\frac{1}{\sqrt{x^{2} + y^{2}}}\Big)$ si $(x, y) \neq (0, 0)$, et $f(0, 0) = 0$.

    **1.** Montrer que $f$ est différentiable en tout point de $\mathbb{R}^{2}$.

    **2.** Montrer que $f$ n'est pas de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{2}$.
  corrige: |
    En dehors de l'origine, $f$ est de classe $\mathcal{C}^{1}$ par opérations ; en l'origine, on revient à la définition, puis l'on montre qu'une dérivée partielle n'a pas de limite.

    **1.** Sur $\mathbb{R}^{2} \setminus \{(0, 0)\}$, $f$ est de classe $\mathcal{C}^{1}$, donc différentiable. En $(0, 0)$, $|f(h)| \leqslant \lVert h \rVert^{2} = o(h)$ pour la norme euclidienne, donc $f$ est différentiable en $(0, 0)$, de différentielle nulle. 
    $$\boxed{f \text{ est différentiable sur } \mathbb{R}^{2}, \quad \mathrm{d} f(0, 0) = 0}$$

    **2.** Pour $x \neq 0$, $f(x, 0) = x^{2}\sin\frac{1}{|x|}$, et, en $(x, 0)$, 
    $$\frac{\partial f}{\partial x}(x, 0) = 2x\sin\frac{1}{|x|} - \frac{x}{|x|}\cos\frac{1}{|x|}.$$
     Le premier terme tend vers $0$, le second n'a pas de limite quand $x \to 0^{+}$ (prendre $x = \frac{1}{k\pi}$). Ainsi $\frac{\partial f}{\partial x}$ n'est pas continue en $(0, 0)$, et le théorème 2 montre que $f$ n'est pas de classe $\mathcal{C}^{1}$. 
    $$\boxed{f \text{ est différentiable, mais pas de classe } \mathcal{C}^{1}}$$
     C'est l'analogue en deux variables de la fonction $x \mapsto x^{2}\sin\frac{1}{x}$, dérivable sur $\mathbb{R}$ à dérivée non continue en $0$ (bilan du cours).
- id: "mp-17-06"
  feuille: "f-mp-17"
  numero: 6
  partie: "Dérivées selon un vecteur et différentielle"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [différentielle, matrice jacobienne]
  noeuds: [gd-differentielle]
  notions: [differentiable, derivee-partielle, matrice-jacobienne]
  source: "Feuille d'exercices #18 (Prost), exercice 16"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    On identifie $\mathbb{C}$ à $\mathbb{R}^{2}$. Établir la différentiabilité de l'application $z \mapsto \frac{1}{z}$ sur $\mathbb{C}^{*}$, et expliciter sa différentielle. Quelle est sa matrice jacobienne au point $z = x + \mathrm{i} y$ ?
  corrige: |
    On écrit le développement limité de $\frac{1}{z + h}$, comme pour l'inversion matricielle du cours.

    Pour $z \neq 0$ et $|h| < |z|$, $\frac{1}{z + h} - \frac{1}{z} + \frac{h}{z^{2}} = \frac{h^{2}}{z^{2}(z + h)}$, de module au plus $\frac{2|h|^{2}}{|z|^{3}}$ pour $|h| \leqslant \frac{|z|}{2}$ : c'est un $o(h)$. L'application $h \mapsto -\frac{h}{z^{2}}$ est $\mathbb{R}$-linéaire. 
    $$\boxed{\mathrm{d} f(z)\cdot h = -\frac{h}{z^{2}}}$$
     La multiplication par $a + \mathrm{i} b$ a pour matrice $\begin{pmatrix} a & -b \\ b & a \end{pmatrix}$ dans la base $(1, \mathrm{i})$. Avec $z = x + \mathrm{i} y$, on a 
    $$-\frac{1}{z^{2}} = -\frac{\bar{z}^{2}}{|z|^{4}} = \frac{y^{2} - x^{2} + 2\mathrm{i} xy}{(x^{2} + y^{2})^{2}}, \qquad \text{d'où}$$

    $$\boxed{J_{f}(x, y) = \frac{1}{(x^{2} + y^{2})^{2}}\begin{pmatrix} y^{2} - x^{2} & -2xy \\ 2xy & y^{2} - x^{2} \end{pmatrix}}$$
     On le vérifie en dérivant $f(x, y) = \big(\frac{x}{x^{2} + y^{2}}, \frac{-y}{x^{2} + y^{2}}\big)$. La différentielle est une similitude : c'est la marque des fonctions dérivables au sens complexe.
