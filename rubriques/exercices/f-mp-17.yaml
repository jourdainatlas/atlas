  notions: [matrice-jacobienne]
  source: "BibM@th, Calcul différentiel, exercice 17 ; Feuille d'exercices #18 (Prost), exercice 22"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    On munit $\mathbb{R}^{n}$ de sa structure euclidienne canonique.

    **1.** Soit $f : \mathbb{R}^{n} \to \mathbb{R}^{n}$ différentiable. Calculer la différentielle de $u : x \mapsto \langle f(x), f(x) \rangle$.

    **2.** Soit $f : \mathbb{R}_{+} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, avec $f(0) = 1$ et $f'(0) = 0$, et $F(x) = f(\lVert x \rVert)\,x$ pour $x \in \mathbb{R}^{n}$. Montrer que $F$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{n} \setminus \{0\}$, et calculer sa différentielle.

    **3.** Montrer que $F$ est différentiable en $0$, puis qu'elle est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}^{n}$.
  corrige: |
    Les deux premières questions sont des applications de la proposition 5 et de la règle de la chaîne ; la troisième demande de revenir à la définition en $0$.

    **1.** Le produit scalaire est bilinéaire, et la proposition 5 donne 
    $$\boxed{\mathrm{d} u(x)\cdot h = 2\langle \mathrm{d} f(x)\cdot h, f(x) \rangle}$$

    **2.** Sur $\mathbb{R}^{n} \setminus \{0\}$, $x \mapsto \lVert x \rVert$ est de classe $\mathcal{C}^{1}$, de différentielle $h \mapsto \frac{\langle x, h \rangle}{\lVert x \rVert}$ (exercice 9), donc $x \mapsto f(\lVert x \rVert)$ aussi, et le produit par $x \mapsto x$ donne 
    $$\boxed{\mathrm{d} F(x)\cdot h = f(\lVert x \rVert)\,h + f'(\lVert x \rVert)\,\frac{\langle x, h \rangle}{\lVert x \rVert}\,x \qquad (x \neq 0)}$$
     Les coefficients de la matrice jacobienne, $f(\lVert x \rVert)\delta_{ij} + f'(\lVert x \rVert)\frac{x_{i}x_{j}}{\lVert x \rVert}$, sont continus sur $\mathbb{R}^{n} \setminus \{0\}$.

    **3.** Différentiabilité en $0$. $F(h) - h = \big(f(\lVert h \rVert) - 1\big)h$, de norme $|f(\lVert h \rVert) - f(0)|\,\lVert h \rVert = o(h)$ par continuité de $f$ en $0$ : $F$ est différentiable en $0$, et $\mathrm{d} F(0) = \mathrm{id}$.

    Continuité de $\mathrm{d} F$ en $0$. Pour $x \neq 0$, $\big|\frac{x_{i}x_{j}}{\lVert x \rVert}\big| \leqslant \lVert x \rVert$, et $f'(\lVert x \rVert)$ reste borné au voisinage de $0$, par continuité de $f'$, tandis que $f(\lVert x \rVert) \to 1$ : les coefficients de $J_{F}(x)$ tendent vers ceux de $I_{n}$. 
    $$\boxed{F \text{ est de classe } \mathcal{C}^{1} \text{ sur } \mathbb{R}^{n}, \text{ et } \mathrm{d} F(0) = \mathrm{id}}$$
     L'hypothèse $f'(0) = 0$ n'a pas servi : le terme $f'(\lVert x \rVert)\frac{x_{i}x_{j}}{\lVert x \rVert}$ tend vers $0$ dès que $f'$ est bornée près de $0$. Ce qui compte est la continuité de $f$ et de $f'$, et la condition $f(0) = 1$ fixe seulement $\mathrm{d} F(0) = \mathrm{id}$.
- id: "mp-17-17"
  feuille: "f-mp-17"
  numero: 17
  partie: "Opérations sur les applications différentiables"
  etoiles: 2
