  enonce: |
    *Plans tangents.*

    **1.** Donner une équation du plan tangent à la surface d'équation $z = \cos(x - y)$ au point $\big(\frac{\pi}{2}, 0, 0\big)$.

    **2.** Donner une équation du plan tangent à l'hyperboloïde d'équation $x^{2} + y^{2} - z^{2} = 1$ au point $(1, 1, 1)$.
  corrige: |
    Le plan tangent à une surface d'équation $g = 0$ en $m_{0}$ est orthogonal à $\nabla g(m_{0})$ (cours, section 17.5) ; pour un graphe $z = \varphi(x, y)$, on prend $g = \varphi(x, y) - z$.

    **1.** Avec $\varphi(x, y) = \cos(x - y)$, on a $\varphi\big(\frac{\pi}{2}, 0\big) = 0$, $\frac{\partial \varphi}{\partial x} = -\sin(x - y) = -1$ et $\frac{\partial \varphi}{\partial y} = \sin(x - y) = 1$ en ce point. Le plan est $z = -\big(x - \frac{\pi}{2}\big) + y$. 
    $$\boxed{x - y + z = \frac{\pi}{2}}$$

    **2.** Avec $g(x, y, z) = x^{2} + y^{2} - z^{2} - 1$, $\nabla g(1, 1, 1) = (2, 2, -2) \neq 0$, et le plan a pour équation $2(x - 1) + 2(y - 1) - 2(z - 1) = 0$. 
    $$\boxed{x + y - z = 1}$$
