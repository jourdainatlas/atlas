  enonce: |
    *Un espace de polynômes.* On munit $\mathbb{R}_{n}[X]$ de la norme $\lVert P \rVert_{\infty} = \sup_{t \in [0, 1]} |P(t)|$. Montrer que l'application $\varphi : P \mapsto \displaystyle\int_{0}^{1} P(t)^{3}\,\mathrm{d} t$ est différentiable sur $\mathbb{R}_{n}[X]$, et calculer sa différentielle.
  corrige: |
    L'espace $\mathbb{R}_{n}[X]$ est de dimension finie, mais ses éléments ne sont pas des $n$-uplets : on travaille directement avec la définition, en développant le cube.

    Pour $P$, $H \in \mathbb{R}_{n}[X]$, $(P + H)^{3} = P^{3} + 3P^{2}H + 3PH^{2} + H^{3}$, d'où 
    $$\varphi(P + H) = \varphi(P) + 3\int_{0}^{1} P(t)^{2}H(t)\,\mathrm{d} t + R(H), \qquad |R(H)| \leqslant 3\lVert P \rVert_{\infty}\lVert H \rVert_{\infty}^{2} + \lVert H \rVert_{\infty}^{3} = o(H).$$
     L'application $H \mapsto 3\int_{0}^{1} P^{2}H$ est linéaire, donc $\varphi$ est différentiable en $P$. 
    $$\boxed{\mathrm{d}\varphi(P)\cdot H = 3\int_{0}^{1} P(t)^{2}H(t)\,\mathrm{d} t}$$
     *Piège.* Il faut vérifier que $\lVert \cdot \rVert_{\infty}$ est bien une norme sur $\mathbb{R}_{n}[X]$ : un polynôme nul sur $[0, 1]$ a une infinité de racines, donc est nul.
- id: "mp-17-11"
  feuille: "f-mp-17"
  numero: 11
  partie: "Opérations sur les applications différentiables"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [opérations et règle de la chaîne]
  noeuds: [gd-differentielle]
  notions: [matrice-jacobienne]
  source: "BibM@th, Calcul différentiel, exercice 5"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$.

    **1.** Montrer que $g : t \mapsto f(2 + 2t, t^{2})$ est de classe $\mathcal{C}^{1}$, et exprimer $g'(t)$ à l'aide des dérivées partielles de $f$.

    **2.** Montrer que $h : (u, v) \mapsto f(uv, u^{2} + v^{2})$ est de classe $\mathcal{C}^{1}$, et exprimer ses dérivées partielles à l'aide de celles de $f$.
  corrige: |
    Ce sont deux applications directes de la proposition 7 : on dérive les fonctions intérieures, et l'on multiplie par les dérivées partielles de $f$ au point image.

    **1.** La fonction $g$ est la composée de $t \mapsto (2 + 2t, t^{2})$, de classe $\mathcal{C}^{1}$, et de $f$ : elle est de classe $\mathcal{C}^{1}$ (proposition 8), et la proposition 6 donne 
    $$\boxed{g'(t) = 2\,\frac{\partial f}{\partial x}(2 + 2t, t^{2}) + 2t\,\frac{\partial f}{\partial y}(2 + 2t, t^{2})}$$

    **2.** De même, avec $(x, y) = (uv, u^{2} + v^{2})$, les dérivées de $f$ étant prises en ce point : 
    $$\boxed{\frac{\partial h}{\partial u}(u, v) = v\,\frac{\partial f}{\partial x} + 2u\,\frac{\partial f}{\partial y}, \qquad \frac{\partial h}{\partial v}(u, v) = u\,\frac{\partial f}{\partial x} + 2v\,\frac{\partial f}{\partial y}}$$
