  enonce: |
    Soit $a$, $b$, $c > 0$. Étudier les extremums de $f : (x, y) \mapsto a\mathrm{e}^{-x} + b\mathrm{e}^{-y} + c\mathrm{e}^{x + y}$ sur $\mathbb{R}^{2}$.
  corrige: |
    Le point critique se trouve en remarquant que les trois termes y sont égaux ; l'inégalité arithmético-géométrique montre alors que c'est un minimum global.

    $\frac{\partial f}{\partial x} = -a\mathrm{e}^{-x} + c\mathrm{e}^{x + y}$ et $\frac{\partial f}{\partial y} = -b\mathrm{e}^{-y} + c\mathrm{e}^{x + y}$ s'annulent si et seulement si $a\mathrm{e}^{-x} = b\mathrm{e}^{-y} = c\mathrm{e}^{x + y} = m$. Le produit des trois termes vaut $abc$, donc $m = \sqrt[3]{abc}$, et $x = \ln\frac{a}{m}$, $y = \ln\frac{b}{m}$ : il y a un unique point critique, où $f = 3m$.

    Pour tout $(x, y)$, l'inégalité arithmético-géométrique (exercice 31) appliquée aux trois termes donne $f(x, y) \geqslant 3\sqrt[3]{a\mathrm{e}^{-x}\,b\mathrm{e}^{-y}\,c\mathrm{e}^{x + y}} = 3\sqrt[3]{abc}$. 
    $$\boxed{\min_{\mathbb{R}^{2}} f = 3\sqrt[3]{abc}, \text{ atteint en } \Big(\ln\frac{a}{m}, \ln\frac{b}{m}\Big), \ m = \sqrt[3]{abc} \ ; \ \text{pas de maximum}}$$
     $f$ n'a pas de maximum, puisque $f(x, 0) \to +\infty$. Le minimum a été confirmé numériquement pour $(a, b, c) = (2, 3, 5)$.
- id: "mp-17-44"
