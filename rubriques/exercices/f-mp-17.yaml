  enonce: |
    *Extremums liés.* Soit $a > 0$. Étudier les extremums de $f(x, y) = \exp(axy)$ sous la contrainte $x^{3} + y^{3} + x + y - 4 = 0$.
  corrige: |
    On applique le théorème 5, puis on étudie la forme de la courbe de contrainte pour conclure.

    Soit $g(x, y) = x^{3} + y^{3} + x + y - 4$ et $X = \{g = 0\}$. Comme $\exp$ est croissante et $a > 0$, il suffit d'étudier $xy$ sur $X$. On a $\nabla g = (3x^{2} + 1, 3y^{2} + 1) \neq 0$.

    Candidats. Par le théorème 5, en un extremum, $(ay\,\mathrm{e}^{axy}, ax\,\mathrm{e}^{axy}) = \lambda(3x^{2} + 1, 3y^{2} + 1)$, d'où $y(3y^{2} + 1) = x(3x^{2} + 1)$. La fonction $\psi : t \mapsto 3t^{3} + t$ est strictement croissante, donc $x = y$, puis $2x^{3} + 2x = 4$, d'où $x = 1$ : le seul candidat est $(1, 1)$.

    Conclusion. La fonction $t \mapsto t^{3} + t$ est une bijection croissante de $\mathbb{R}$ sur $\mathbb{R}$ ; pour chaque $x$, il existe donc un unique $y = \eta(x)$ tel que $(x, y) \in X$, et $\eta$ est continue et décroissante. Quand $x \to \pm\infty$, $\eta(x) \to \mp\infty$, donc $x\eta(x) \to -\infty$ et $f \to 0$. La fonction continue $x \mapsto \exp(ax\eta(x))$, positive et de limite nulle en $\pm\infty$, atteint donc un maximum, nécessairement au seul candidat, et n'a pas de minimum. 
    $$\boxed{\max_{X} f = \mathrm{e}^{a}, \text{ atteint en } (1, 1) \ ; \ \inf_{X} f = 0 \text{ non atteint}}$$
- id: "mp-17-30"
  feuille: "f-mp-17"
