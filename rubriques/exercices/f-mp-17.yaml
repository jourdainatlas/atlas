  notions: [matrice-hessienne]
  source: "Feuille d'exercices #18 (Prost), exercice 5"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Soit $\varphi$, $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, et $F(x, y) = f\big(x + \varphi(y)\big)$. Vérifier que $F$ est de classe $\mathcal{C}^{2}$ sur $\mathbb{R}^{2}$, et que 
    $$\frac{\partial^{2} F}{\partial x^{2}}\,\frac{\partial F}{\partial y} - \frac{\partial^{2} F}{\partial x\,\partial y}\,\frac{\partial F}{\partial x} = 0.$$
  corrige: |
    $F$ est une composée de fonctions de classe $\mathcal{C}^{2}$ (proposition 13) ; on calcule ses dérivées par la règle de la chaîne.

    Avec $f$ et ses dérivées prises en $x + \varphi(y)$ : $\frac{\partial F}{\partial x} = f'$, $\frac{\partial F}{\partial y} = \varphi'(y)f'$, $\frac{\partial^{2} F}{\partial x^{2}} = f''$ et $\frac{\partial^{2} F}{\partial x\,\partial y} = \varphi'(y)f''$. Ainsi 
    $$\boxed{\frac{\partial^{2} F}{\partial x^{2}}\frac{\partial F}{\partial y} - \frac{\partial^{2} F}{\partial x\,\partial y}\frac{\partial F}{\partial x} = f''\varphi'f' - \varphi'f''f' = 0}$$
- id: "mp-17-35"
  feuille: "f-mp-17"
  numero: 35
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ordre 2]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne]
  source: "BibM@th, Calcul différentiel, exercices 26 et 27 ; Feuille d'exercices #18 (Prost), exercice 12"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Changements de variables linéaires.* Déterminer les fonctions $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ telles que, pour tout $(x, y) \in \mathbb{R}^{2}$ :

    **1.** $2\frac{\partial f}{\partial x}(x, y) - \frac{\partial f}{\partial y}(x, y) = 0$, en cherchant un changement de variables linéaire adapté ;

    **2.** $\frac{\partial f}{\partial x}(x, y) - \frac{\partial f}{\partial y}(x, y) = 8x + 16y$, en posant $u = x + y$ et $v = x - y$.
  corrige: |
    Comme pour l'équation de transport du cours, un changement de variables linéaire bijectif ramène l'équation à $\frac{\partial g}{\partial v} =$ une fonction connue, que l'on intègre à $u$ fixé.

    **1.** On pose $g(u, v) = f(u - 2v, v)$, c'est-à-dire $f(x, y) = g(x + 2y, y)$. La proposition 7 donne $\frac{\partial f}{\partial x} = \frac{\partial g}{\partial u}$ et $\frac{\partial f}{\partial y} = 2\frac{\partial g}{\partial u} + \frac{\partial g}{\partial v}$, donc $2\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = -\frac{\partial g}{\partial v}$. L'équation équivaut à $\frac{\partial g}{\partial v} = 0$, c'est-à-dire $g(u, v) = \varphi(u)$, avec $\varphi = g(\cdot, 0)$ de classe $\mathcal{C}^{1}$. 
    $$\boxed{f(x, y) = \varphi(x + 2y), \qquad \varphi \in \mathcal{C}^{1}(\mathbb{R})}$$

    **2.** Avec $f(x, y) = g(x + y, x - y)$, on a $\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = 2\frac{\partial g}{\partial v}$, et $8x + 16y = 12u - 4v$. L'équation équivaut à $\frac{\partial g}{\partial v} = 6u - 2v$, c'est-à-dire $g(u, v) = 6uv - v^{2} + \varphi(u)$. Comme $uv = x^{2} - y^{2}$ : 
    $$\boxed{f(x, y) = 5x^{2} + 2xy - 7y^{2} + \varphi(x + y), \qquad \varphi \in \mathcal{C}^{1}(\mathbb{R})}$$
     On vérifie que $\frac{\partial f}{\partial x} - \frac{\partial f}{\partial y} = (10x + 2y) - (2x - 14y) = 8x + 16y$. La partie $5x^{2} + 2xy - 7y^{2}$ est une solution particulière, et $\varphi(x + y)$ décrit les solutions de l'équation homogène, comme pour une équation différentielle linéaire.
- id: "mp-17-36"
  feuille: "f-mp-17"
  numero: 36
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 2
  types: [Calcul]
  mots_cles: [ordre 2]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne, coordonnees-polaires]
  source: "Feuille d'exercices #18 (Prost), exercice 13"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Déterminer les fonctions $f$ de classe $\mathcal{C}^{1}$ sur l'ouvert $U$ indiqué qui vérifient, pour tout $(x, y) \in U$ :

    **1.** $x\frac{\partial f}{\partial x}(x, y) + y\frac{\partial f}{\partial y}(x, y) = \frac{y}{x}$, sur $U = \mathbb{R}_{+}^{*} \times \mathbb{R}$, en posant $u = x$ et $v = \frac{y}{x}$ ;

    **2.** $f(x, y) + x\frac{\partial f}{\partial x}(x, y) + y\frac{\partial f}{\partial y}(x, y) + x^{2} + y^{2} = 0$, sur $U = \mathbb{R}^{2} \setminus (\mathbb{R}_{-} \times \{0\})$, en passant en coordonnées polaires.
  corrige: |
    Le changement de variables proposé transforme l'opérateur $x\frac{\partial }{\partial x} + y\frac{\partial }{\partial y}$, dérivée radiale, en une dérivée par rapport à une seule variable.

    **1.** L'application $(x, y) \mapsto \big(x, \frac{y}{x}\big)$ est une bijection de $U$ sur lui-même, de réciproque $(u, v) \mapsto (u, uv)$, toutes deux de classe $\mathcal{C}^{1}$. Avec $f(x, y) = g\big(x, \frac{y}{x}\big)$ : 
    $$\frac{\partial f}{\partial x} = \frac{\partial g}{\partial u} - \frac{y}{x^{2}}\frac{\partial g}{\partial v}, \qquad \frac{\partial f}{\partial y} = \frac{1}{x}\frac{\partial g}{\partial v}, \qquad x\frac{\partial f}{\partial x} + y\frac{\partial f}{\partial y} = u\frac{\partial g}{\partial u}.$$
     L'équation équivaut à $\frac{\partial g}{\partial u} = \frac{v}{u}$, d'où $g(u, v) = v\ln u + \varphi(v)$. 
    $$\boxed{f(x, y) = \frac{y}{x}\ln x + \varphi\Big(\frac{y}{x}\Big), \qquad \varphi \in \mathcal{C}^{1}(\mathbb{R})}$$

    **2.** Sur $U$, les coordonnées polaires $(r, \theta) \in \mathbb{R}_{+}^{*} \times ]-\pi, \pi[$ sont définies par une bijection de classe $\mathcal{C}^{1}$ dans les deux sens, avec $\theta = 2\operatorname{Arctan}\frac{y}{x + \sqrt{x^{2} + y^{2}}}$. Avec $F(r, \theta) = f(r\cos\theta, r\sin\theta)$, on a $r\frac{\partial F}{\partial r} = x\frac{\partial f}{\partial x} + y\frac{\partial f}{\partial y}$ (cours, section 17.3), et l'équation devient 
    $$F + r\frac{\partial F}{\partial r} + r^{2} = 0, \qquad \text{c'est-à-dire} \qquad \frac{\partial }{\partial r}(rF) = -r^{2}.$$
     Ainsi $rF(r, \theta) = -\frac{r^{3}}{3} + \psi(\theta)$, avec $\psi$ de classe $\mathcal{C}^{1}$ sur $]-\pi, \pi[$. 
    $$\boxed{f(x, y) = -\frac{x^{2} + y^{2}}{3} + \frac{\psi(\theta(x, y))}{\sqrt{x^{2} + y^{2}}}, \qquad \psi \in \mathcal{C}^{1}(]-\pi, \pi[)}$$
     *Piège.* On ne peut pas prendre $U = \mathbb{R}^{2} \setminus \{0\}$ : l'angle polaire n'y est pas défini continûment, et il faudrait imposer à $\psi$ d'être $2\pi$-périodique.
- id: "mp-17-37"
  feuille: "f-mp-17"
  numero: 37
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 2
  types: [Calcul]
  mots_cles: [ordre 2]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne]
  source: "Feuille d'exercices #18 (Prost), exercice 14"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    Déterminer les fonctions $f$ de classe $\mathcal{C}^{2}$ sur l'ouvert $U$ indiqué qui vérifient, pour tout $(x, y) \in U$ :

    **1.** $\frac{\partial^{2} f}{\partial x^{2}} - 2\frac{\partial^{2} f}{\partial x\,\partial y} + \frac{\partial^{2} f}{\partial y^{2}} = 0$, sur $U = \mathbb{R}^{2}$, en posant $u = x + y$ et $v = y$ ;

    **2.** $x^{2}\frac{\partial^{2} f}{\partial x^{2}} - y^{2}\frac{\partial^{2} f}{\partial y^{2}} = 0$, sur $U = (\mathbb{R}_{+}^{*})^{2}$, en posant $u = xy$ et $v = \frac{y}{x}$.
  corrige: |
    Après changement de variables, on obtient des équations que l'on intègre deux fois, comme l'équation des ondes du cours.

    **1.** Avec $f(x, y) = g(x + y, y)$ : $\frac{\partial f}{\partial x} = \frac{\partial g}{\partial u}$, $\frac{\partial f}{\partial y} = \frac{\partial g}{\partial u} + \frac{\partial g}{\partial v}$, puis, par le théorème de Schwarz, 
    $$\frac{\partial^{2} f}{\partial x^{2}} - 2\frac{\partial^{2} f}{\partial x\,\partial y} + \frac{\partial^{2} f}{\partial y^{2}} = \frac{\partial^{2} g}{\partial u^{2}} - 2\Big(\frac{\partial^{2} g}{\partial u^{2}} + \frac{\partial^{2} g}{\partial u\,\partial v}\Big) + \frac{\partial^{2} g}{\partial u^{2}} + 2\frac{\partial^{2} g}{\partial u\,\partial v} + \frac{\partial^{2} g}{\partial v^{2}} = \frac{\partial^{2} g}{\partial v^{2}}.$$
     L'équation équivaut à $\frac{\partial^{2} g}{\partial v^{2}} = 0$ : à $u$ fixé, $g$ est affine en $v$, $g(u, v) = v\,\varphi(u) + \psi(u)$, avec $\psi = g(\cdot, 0)$ et $\varphi = \frac{\partial g}{\partial v}(\cdot, 0)$. 
    $$\boxed{f(x, y) = y\,\varphi(x + y) + \psi(x + y), \qquad \varphi, \psi \in \mathcal{C}^{2}(\mathbb{R})}$$
     Les fonctions $\varphi$ et $\psi$ sont de classe $\mathcal{C}^{2}$ pour que $f$ le soit : par exemple $\psi(u) = f(u, 0)$.

    **2.** Avec $f(x, y) = g\big(xy, \frac{y}{x}\big)$, un calcul de même nature, confirmé par calcul symbolique, donne 
    $$x^{2}\frac{\partial^{2} f}{\partial x^{2}} - y^{2}\frac{\partial^{2} f}{\partial y^{2}} = 2v\Big(\frac{\partial g}{\partial v} - 2u\frac{\partial^{2} g}{\partial u\,\partial v}\Big).$$
     Comme $v > 0$, l'équation équivaut à $2u\,\frac{\partial h}{\partial u} = h$, avec $h = \frac{\partial g}{\partial v}$, c'est-à-dire à 
    $$\frac{\partial }{\partial u}\Big(\frac{h}{\sqrt{u}}\Big) = \frac{2u\,\frac{\partial h}{\partial u} - h}{2u^{3/2}} = 0, \qquad \text{d'où} \qquad h(u, v) = \sqrt{u}\,a(v).$$
     En intégrant en $v$, $g(u, v) = \sqrt{u}\,A(v) + B(u)$, où $A$ est une primitive de $a$. 
    $$\boxed{f(x, y) = \sqrt{xy}\;A\Big(\frac{y}{x}\Big) + B(xy), \qquad A, B \in \mathcal{C}^{2}(\mathbb{R}_{+}^{*})}$$
- id: "mp-17-38"
  feuille: "f-mp-17"
  numero: 38
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ordre 2]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne]
  source: "BibM@th, Calcul différentiel, exercice 22"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    Soit $g_{0}$, $g_{1} : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, et $f(x, y) = g_{0}\big(\frac{y}{x}\big) + x\,g_{1}\big(\frac{y}{x}\big)$ pour $x \neq 0$. Montrer que $f$ est de classe $\mathcal{C}^{2}$ sur $\mathbb{R}^{*} \times \mathbb{R}$, et que 
    $$x^{2}\frac{\partial^{2} f}{\partial x^{2}} + 2xy\frac{\partial^{2} f}{\partial x\,\partial y} + y^{2}\frac{\partial^{2} f}{\partial y^{2}} = 0.$$
  corrige: |
    Plutôt que de dériver brutalement, on exploite l'homogénéité de l'exercice 18 : l'opérateur de l'énoncé s'exprime à l'aide de la dérivée radiale $D = x\frac{\partial }{\partial x} + y\frac{\partial }{\partial y}$.

    $f$ est de classe $\mathcal{C}^{2}$ par la proposition 13. Pour $h$ de classe $\mathcal{C}^{2}$, le théorème de Schwarz donne 
    $$D(Dh) = x\frac{\partial }{\partial x}\Big(x\frac{\partial h}{\partial x} + y\frac{\partial h}{\partial y}\Big) + y\frac{\partial }{\partial y}\Big(x\frac{\partial h}{\partial x} + y\frac{\partial h}{\partial y}\Big) = x^{2}\frac{\partial^{2} h}{\partial x^{2}} + 2xy\frac{\partial^{2} h}{\partial x\,\partial y} + y^{2}\frac{\partial^{2} h}{\partial y^{2}} + Dh.$$
     La fonction $g_{0}\big(\frac{y}{x}\big)$ est homogène de degré $0$ sur chacun des demi-plans $x > 0$ et $x < 0$, donc $D$ l'annule (exercice 18, la relation d'Euler n'utilisant que $t > 0$). La fonction $x\,g_{1}\big(\frac{y}{x}\big)$ est homogène de degré $1$, donc $D$ la laisse fixe. Dans les deux cas, $D(Dh) - Dh = 0$. 
    $$\boxed{x^{2}\frac{\partial^{2} f}{\partial x^{2}} + 2xy\frac{\partial^{2} f}{\partial x\,\partial y} + y^{2}\frac{\partial^{2} f}{\partial y^{2}} = D(Df) - Df = 0}$$
     Plus généralement, pour $f$ homogène de degré $\alpha$, cette expression vaut $\alpha(\alpha - 1)f$ : c'est la question 4 de l'exercice 25 de BibM@th.
- id: "mp-17-39"
  feuille: "f-mp-17"
  numero: 39
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [ordre 2, équations aux dérivées partielles]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne, derivee-successive]
  source: "BibM@th, Calcul différentiel, exercice 24"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    *Laplacien d'une fonction radiale.* Soit $f : \mathbb{R}_{+}^{*} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$, et $g(x, y, z) = f\big(\sqrt{x^{2} + y^{2} + z^{2}}\big)$ sur $\mathbb{R}^{3} \setminus \{0\}$. Montrer que $g$ est de classe $\mathcal{C}^{2}$, et que, avec $\rho = \sqrt{x^{2} + y^{2} + z^{2}}$, 
    $$\frac{\partial^{2} g}{\partial x^{2}} + \frac{\partial^{2} g}{\partial y^{2}} + \frac{\partial^{2} g}{\partial z^{2}} = f''(\rho) + \frac{2}{\rho}f'(\rho).$$
     Déterminer les fonctions $g$ de cette forme dont le laplacien est nul.
  corrige: |
    On dérive $g$ par la règle de la chaîne, avec $\frac{\partial \rho}{\partial x} = \frac{x}{\rho}$.

    $g$ est de classe $\mathcal{C}^{2}$ comme composée (proposition 13), $\rho$ étant de classe $\mathcal{C}^{\infty}$ hors de l'origine. On a $\frac{\partial g}{\partial x} = f'(\rho)\frac{x}{\rho}$, puis 
    $$\frac{\partial^{2} g}{\partial x^{2}} = f''(\rho)\frac{x^{2}}{\rho^{2}} + f'(\rho)\Big(\frac{1}{\rho} - \frac{x^{2}}{\rho^{3}}\Big),$$
     et de même pour $y$ et $z$. En sommant, avec $x^{2} + y^{2} + z^{2} = \rho^{2}$ : 
    $$\boxed{\Delta g = f''(\rho) + f'(\rho)\Big(\frac{3}{\rho} - \frac{1}{\rho}\Big) = f''(\rho) + \frac{2}{\rho}f'(\rho)}$$
     Le laplacien est nul si et seulement si $\rho^{2}f'' + 2\rho f' = (\rho^{2}f')' = 0$, c'est-à-dire $f'(\rho) = \frac{C}{\rho^{2}}$, soit $f(\rho) = -\frac{C}{\rho} + D$. 
    $$\boxed{g = \frac{a}{\rho} + b, \quad (a, b) \in \mathbb{R}^{2}}$$
     C'est le potentiel newtonien d'une masse ponctuelle placée à l'origine.
- id: "mp-17-40"
  feuille: "f-mp-17"
  numero: 40
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [ordre 2]
  noeuds: [gd-schwarz, fq-taylor-young, fq-extremums]
  notions: [matrice-hessienne]
  source: "Feuille d'exercices #18 (Prost), exercice 9"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Fonctions harmoniques et propriété de la moyenne.* Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{2}$ telle que $\Delta f = \frac{\partial^{2} f}{\partial x^{2}} + \frac{\partial^{2} f}{\partial y^{2}} = 0$. On pose $F(r, \theta) = f(r\cos\theta, r\sin\theta)$ pour $r > 0$ et $\theta \in \mathbb{R}$.

    **1.** Montrer que $\frac{\partial^{2} F}{\partial r^{2}} + \frac{1}{r}\frac{\partial F}{\partial r} + \frac{1}{r^{2}}\frac{\partial^{2} F}{\partial \theta^{2}} = 0$.

    **2.** On pose $\varphi(r) = \displaystyle\frac{1}{2\pi}\int_{0}^{2\pi} F(r, \theta)\,\mathrm{d}\theta$ pour $r > 0$. Montrer que $\varphi$ est de classe $\mathcal{C}^{2}$ (chapitre 13), puis que $r\varphi''(r) + \varphi'(r) = 0$.

    **3.** En déduire que $\varphi$ est constante, égale à $f(0, 0)$ : la valeur de $f$ au centre d'un cercle est la moyenne de ses valeurs sur ce cercle.
  corrige: |
    On écrit le laplacien en coordonnées polaires, puis on intègre l'équation obtenue sur un cercle : les termes en $\theta$ disparaissent par périodicité.

    **1.** Les dérivées de $f$ étant prises en $(r\cos\theta, r\sin\theta)$, la proposition 7, appliquée deux fois, donne 
    $$\frac{\partial F}{\partial r} = \cos\theta\,\frac{\partial f}{\partial x} + \sin\theta\,\frac{\partial f}{\partial y}, \qquad \frac{\partial^{2} F}{\partial r^{2}} = \cos^{2}\theta\,\frac{\partial^{2} f}{\partial x^{2}} + 2\sin\theta\cos\theta\,\frac{\partial^{2} f}{\partial x\,\partial y} + \sin^{2}\theta\,\frac{\partial^{2} f}{\partial y^{2}},$$

    $$\frac{\partial^{2} F}{\partial\theta^{2}} = -r\frac{\partial F}{\partial r} + r^{2}\Big(\sin^{2}\theta\,\frac{\partial^{2} f}{\partial x^{2}} - 2\sin\theta\cos\theta\,\frac{\partial^{2} f}{\partial x\,\partial y} + \cos^{2}\theta\,\frac{\partial^{2} f}{\partial y^{2}}\Big).$$
     En divisant la dernière égalité par $r^{2}$ et en sommant : 
    $$\boxed{\frac{\partial^{2} F}{\partial r^{2}} + \frac{1}{r}\frac{\partial F}{\partial r} + \frac{1}{r^{2}}\frac{\partial^{2} F}{\partial\theta^{2}} = \Delta f = 0}$$

    **2.** $F$ est de classe $\mathcal{C}^{2}$ sur $\mathbb{R}_{+}^{*} \times \mathbb{R}$, et l'on intègre sur le segment $[0, 2\pi]$ : la dérivation sous l'intégrale (chapitre 13) montre que $\varphi$ est de classe $\mathcal{C}^{2}$, avec $\varphi'(r) = \frac{1}{2\pi}\int_{0}^{2\pi} \frac{\partial F}{\partial r}\,\mathrm{d}\theta$ et de même pour $\varphi''$. Par la question 1, 
    $$r\varphi''(r) + \varphi'(r) = -\frac{1}{2\pi r}\int_{0}^{2\pi} \frac{\partial^{2} F}{\partial\theta^{2}}(r, \theta)\,\mathrm{d}\theta = -\frac{1}{2\pi r}\Big[\frac{\partial F}{\partial \theta}(r, \theta)\Big]_{0}^{2\pi} = 0,$$
     car $\theta \mapsto \frac{\partial F}{\partial \theta}(r, \theta)$ est $2\pi$-périodique.

    **3.** $(r\varphi')' = r\varphi'' + \varphi' = 0$, donc $r\varphi'(r) = C$ et $\varphi(r) = C\ln r + K$. Par continuité de $f$ en $(0, 0)$, $|\varphi(r) - f(0, 0)| \leqslant \sup_{\theta} |F(r, \theta) - f(0, 0)| \to 0$ quand $r \to 0$ ; $\varphi$ est donc bornée près de $0$, ce qui impose $C = 0$. 
    $$\boxed{\forall r > 0, \quad \frac{1}{2\pi}\int_{0}^{2\pi} f(r\cos\theta, r\sin\theta)\,\mathrm{d}\theta = f(0, 0)}$$
     En appliquant ce résultat à $(x, y) \mapsto f(a + x, b + y)$, encore harmonique, on obtient la propriété en tout point : une fonction harmonique est égale à sa moyenne sur tout cercle centré au point.
