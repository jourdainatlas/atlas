  source: "BibM@th, Calcul différentiel, exercice 31"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    Écrire la formule de Taylor-Young à l'ordre $2$ pour la fonction $f(x, y) = x^{2}y^{3}$ au point $a = (-1, 2)$.
  corrige: |
    On calcule le gradient et la matrice hessienne au point, puis on applique le théorème 7.

    En $a = (-1, 2)$, on a $f(a) = 8$ et 
    $$\frac{\partial f}{\partial x} = 2xy^{3} = -16, \qquad \frac{\partial f}{\partial y} = 3x^{2}y^{2} = 12,$$

    $$\frac{\partial^{2} f}{\partial x^{2}} = 2y^{3} = 16, \qquad \frac{\partial^{2} f}{\partial x\,\partial y} = 6xy^{2} = -24, \qquad \frac{\partial^{2} f}{\partial y^{2}} = 6x^{2}y = 12.$$

    $$\boxed{f(-1 + h, 2 + k) = 8 - 16h + 12k + 8h^{2} - 24hk + 6k^{2} + o(h^{2} + k^{2})}$$
     Le développement exact, polynomial, confirme ces coefficients.
- id: "mp-17-34"
  feuille: "f-mp-17"
  numero: 34
  partie: "Classe $\\mathcal{C}^{k}$, optimisation au second ordre"
  etoiles: 1
  types: [Calcul]
  mots_cles: [ordre 2]
