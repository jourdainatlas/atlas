  enonce: |
    *Perspective : le groupe symplectique.* On note 
    $$J = \begin{pmatrix} 0 & I_{n} \\ -I_{n} & 0 \end{pmatrix} \in \mathcal{M}_{2n}(\mathbb{R}), \qquad \mathcal{S}p = \{M \in \mathcal{M}_{2n}(\mathbb{R}) \mid {M}^{T}JM = J\}.$$

    **1.** Montrer que $\mathcal{S}p$ est un sous-groupe de $\mathrm{GL}_{2n}(\mathbb{R})$.

    **2.** Montrer que $T_{I_{2n}}\mathcal{S}p = \{M \in \mathcal{M}_{2n}(\mathbb{R}) \mid {M}^{T}J + JM = 0\}$. On pourra s'inspirer de l'exercice 32.

    **3.** Montrer que $T_{I_{2n}}\mathcal{S}p$ est un sous-espace vectoriel de $\mathcal{M}_{2n}(\mathbb{R})$, et déterminer sa dimension. On pourra étudier l'application $M \mapsto JM$.
  corrige: |
    Comme pour le groupe orthogonal (exercice 32), on obtient les vecteurs tangents en dérivant l'équation qui définit le groupe, et l'on construit des arcs avec l'exponentielle.

    **1.** Comme $J^{2} = -I_{2n}$, le déterminant de $J$ vérifie $(\det J)^{2} = 1$, et $J$ est inversible. Si ${M}^{T}JM = J$, en prenant les déterminants, $(\det M)^{2} = 1$ : $M$ est inversible. De plus, $I_{2n} \in \mathcal{S}p$ ; si $M$, $N \in \mathcal{S}p$, 
    $${(MN)}^{T}J(MN) = {N}^{T}({M}^{T}JM)N = {N}^{T}JN = J ;$$
     enfin, en multipliant l'égalité ${M}^{T}JM = J$ à gauche par ${(M^{-1})}^{T}$ et à droite par $M^{-1}$, on obtient 
    $$J = {(M^{-1})}^{T}JM^{-1}.$$

    $$\boxed{\mathcal{S}p \text{ est un sous-groupe de } \mathrm{GL}_{2n}(\mathbb{R})}$$

    **2.** Inclusion directe. Si $\gamma$ est un arc tracé sur $\mathcal{S}p$, dérivable en $0$, avec $\gamma(0) = I_{2n}$, la dérivée en $0$ de $t \mapsto {\gamma(t)}^{T}J\gamma(t)$, constante, est ${\gamma'(0)}^{T}J + J\gamma'(0) = 0$ (proposition 5, application bilinéaire $(A, B) \mapsto {A}^{T}JB$).

    Inclusion réciproque. Si ${M}^{T}J + JM = 0$, soit $\gamma(t) = \exp(tM)$. Alors ${\gamma(t)}^{T} = \exp(t{M}^{T})$, et 
    $$\frac{\mathrm{d}}{\mathrm{d} t}\Big(\exp(t{M}^{T})J\exp(tM)\Big) = \exp(t{M}^{T})\big({M}^{T}J + JM\big)\exp(tM) = 0,$$
     par le théorème 3 du chapitre 16. Donc ${\gamma(t)}^{T}J\gamma(t) = J$, et $\gamma$ est un arc tracé sur $\mathcal{S}p$, de vitesse $M$ en $0$. 
    $$\boxed{T_{I_{2n}}\mathcal{S}p = \{M \in \mathcal{M}_{2n}(\mathbb{R}) \mid {M}^{T}J + JM = 0\}}$$

    **3.** C'est le noyau de l'application linéaire $M \mapsto {M}^{T}J + JM$, donc un sous-espace vectoriel. Comme ${J}^{T} = -J$, on a ${(JM)}^{T} = -{M}^{T}J$, et ${M}^{T}J + JM = JM - {(JM)}^{T}$ : la condition équivaut à $JM \in \mathcal{S}_{2n}(\mathbb{R})$. L'application $M \mapsto JM$ est un isomorphisme de $\mathcal{M}_{2n}(\mathbb{R})$, qui envoie $T_{I_{2n}}\mathcal{S}p$ sur $\mathcal{S}_{2n}(\mathbb{R})$. 
    $$\boxed{\dim T_{I_{2n}}\mathcal{S}p = \dim \mathcal{S}_{2n}(\mathbb{R}) = n(2n + 1)}$$
     Pour $n = 1$, on trouve $3$ : le groupe symplectique de $\mathcal{M}_{2}(\mathbb{R})$ est $\mathrm{SL}_{2}(\mathbb{R})$, de dimension $4 - 1$.

