  enonce: |
    Soit $f : \mathbb{R}^{2} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$ telle que $f(x + t, y + t) = f(x, y)$ pour tous réels $x$, $y$, $t$. De quelle équation aux dérivées partielles $f$ est-elle solution ?
  corrige: |
    On dérive la relation par rapport à $t$, grâce à la dérivée le long d'un arc.

    À $(x, y)$ fixé, la fonction $t \mapsto f(x + t, y + t)$ est constante ; par la proposition 6, sa dérivée en $t = 0$ est $\frac{\partial f}{\partial x}(x, y) + \frac{\partial f}{\partial y}(x, y)$. 
    $$\boxed{\frac{\partial f}{\partial x} + \frac{\partial f}{\partial y} = 0 \ \text{ sur } \mathbb{R}^{2}}$$
     Réciproquement, l'exercice 35 montre que les solutions de cette équation sont les $f(x, y) = \varphi(x - y)$, qui vérifient bien la relation.
- id: "mp-17-14"
  feuille: "f-mp-17"
  numero: 14
  partie: "Opérations sur les applications différentiables"
  etoiles: 1
