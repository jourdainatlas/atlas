  enonce: |
    Déterminer les extremums locaux des fonctions suivantes, et préciser s'ils sont globaux :

    **1.** $f(x, y) = y^{2} - x^{2} + \frac{x^{4}}{2}$ sur $\mathbb{R}^{2}$ ;

    **2.** $f(x, y) = x\ln(x^{2}) + y^{2}$ sur $\mathbb{R}^{*} \times \mathbb{R}$ ;

    **3.** $f(x, y) = x^{4} + y^{4} - 4xy$ sur $\mathbb{R}^{2}$.
  corrige: |
    On cherche les points critiques, on les classe par la proposition 14, puis l'on étudie le caractère global par une minoration ou un comportement à l'infini.

    **1.** $\nabla f = (-2x + 2x^{3}, 2y)$ s'annule en $(0, 0)$ et $(\pm 1, 0)$. La hessienne est $\begin{pmatrix} 6x^{2} - 2 & 0 \\ 0 & 2 \end{pmatrix}$ : en $(0, 0)$, $rt - s^{2} = -4 < 0$, c'est un point col ; en $(\pm 1, 0)$, $rt - s^{2} = 8 > 0$ et $r > 0$, minimums locaux stricts, de valeur $-\frac{1}{2}$. Ils sont globaux, puisque $f(x, y) = y^{2} + \frac{(x^{2} - 1)^{2}}{2} - \frac{1}{2} \geqslant -\frac{1}{2}$. 
    $$\boxed{\text{minimum global } -\tfrac{1}{2} \text{ en } (\pm 1, 0), \ \text{col en } (0, 0)}$$

    **2.** $\frac{\partial f}{\partial x} = \ln(x^{2}) + 2$ et $\frac{\partial f}{\partial y} = 2y$ s'annulent en $(\pm\mathrm{e}^{-1}, 0)$. La hessienne est $\begin{pmatrix} \frac{2}{x} & 0 \\ 0 & 2 \end{pmatrix}$ : en $(\mathrm{e}^{-1}, 0)$, elle est définie positive, minimum local strict, de valeur $-\frac{2}{\mathrm{e}}$ ; en $(-\mathrm{e}^{-1}, 0)$, $rt - s^{2} = -4\mathrm{e} < 0$, point col. Le minimum n'est pas global, puisque $f(x, 0) = x\ln(x^{2}) \to -\infty$ quand $x \to -\infty$. 
    $$\boxed{\text{minimum local (non global) } -\tfrac{2}{\mathrm{e}} \text{ en } (\mathrm{e}^{-1}, 0), \ \text{col en } (-\mathrm{e}^{-1}, 0)}$$

    **3.** $\nabla f = (4x^{3} - 4y, 4y^{3} - 4x)$ s'annule si $y = x^{3}$ et $x = y^{3} = x^{9}$, d'où $x \in \{0, 1, -1\}$ : points $(0, 0)$, $(1, 1)$ et $(-1, -1)$. La hessienne est $\begin{pmatrix} 12x^{2} & -4 \\ -4 & 12y^{2} \end{pmatrix}$ : en $(0, 0)$, $rt - s^{2} = -16$, col ; en $(\pm 1, \pm 1)$, $rt - s^{2} = 128 > 0$ et $r > 0$, minimums locaux stricts, de valeur $-2$. Ils sont globaux : $x^{4} + y^{4} \geqslant 2x^{2}y^{2}$, donc $f \geqslant 2(xy)^{2} - 4xy = 2(xy - 1)^{2} - 2 \geqslant -2$. 
    $$\boxed{\text{minimum global } -2 \text{ en } (1, 1) \text{ et } (-1, -1), \ \text{col en } (0, 0)}$$
     Aucune de ces fonctions n'a de maximum local : en un tel point, la hessienne serait négative (théorème 8), ce qui n'est le cas en aucun point critique.
