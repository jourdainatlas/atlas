  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, et $F$ la fonction définie sur $U = \mathbb{R}^{*} \times \mathbb{R}$ par $F(x, y) = \frac{f(xy)}{x}$.

    **1.** On suppose $f(0) = 0$. Peut-on prolonger $F$ par continuité à $\mathbb{R}^{2}$ ?

    **2.** Calculer les dérivées partielles de $F$ sur $U$.
  corrige: |
    On écrit $F$ à l'aide d'une intégrale, qui fait disparaître la division par $x$.

    **1.** Comme $f(0) = 0$, $f(xy) = \int_{0}^{1} xy\,f'(sxy)\,\mathrm{d} s$, d'où, pour $x \neq 0$, 
    $$F(x, y) = y\int_{0}^{1} f'(sxy)\,\mathrm{d} s.$$
     Le membre de droite est défini et continu sur $\mathbb{R}^{2}$ (continuité d'une intégrale à paramètre sur un segment, chapitre 13), et vaut $yf'(0)$ pour $x = 0$. 
    $$\boxed{F \text{ se prolonge par continuité, avec } F(0, y) = yf'(0)}$$

    **2.** Sur $U$, par les règles de dérivation : 
    $$\boxed{\frac{\partial F}{\partial x}(x, y) = \frac{y\,f'(xy)}{x} - \frac{f(xy)}{x^{2}}, \qquad \frac{\partial F}{\partial y}(x, y) = f'(xy)}$$
- id: "mp-17-16"
  feuille: "f-mp-17"
  numero: 16
  partie: "Opérations sur les applications différentiables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [opérations et règle de la chaîne]
