  enonce: |
    Déterminer $\displaystyle\sup_{(x, y) \in [0, \pi/2]^{2}} \sin(x)\sin(y)\sin(x + y)$.
  corrige: |
    La fonction est continue sur un compact ; on compare sa valeur au point critique intérieur à ses valeurs sur le bord.

    Soit $g(x, y) = \sin x\sin y\sin(x + y)$ sur $K = [0, \frac{\pi}{2}]^{2}$, compact : $g$ y atteint son maximum (chapitre 5, théorème 6).

    Bord. Si $x = 0$ ou $y = 0$, $g = 0$. Si $x = \frac{\pi}{2}$, $g = \sin y\cos y = \frac{\sin(2y)}{2} \leqslant \frac{1}{2}$, et de même si $y = \frac{\pi}{2}$.

    Intérieur. On a 
    $$\frac{\partial g}{\partial x} = \sin y\big(\cos x\sin(x + y) + \sin x\cos(x + y)\big) = \sin y\sin(2x + y),$$
     et de même $\frac{\partial g}{\partial y} = \sin x\sin(x + 2y)$. À l'intérieur, $\sin x$, $\sin y > 0$, et $2x + y$, $x + 2y \in ]0, \frac{3\pi}{2}[$ : les points critiques vérifient $2x + y = \pi$ et $x + 2y = \pi$, soit $x = y = \frac{\pi}{3}$, où $g = \big(\frac{\sqrt{3}}{2}\big)^{3}$.

    Comme $\frac{3\sqrt{3}}{8} \approx 0{,}650 > \frac{1}{2}$, le maximum est atteint en ce point. 
    $$\boxed{\sup_{[0, \pi/2]^{2}} \sin x\sin y\sin(x + y) = \frac{3\sqrt{3}}{8}, \ \text{atteint en } \Big(\frac{\pi}{3}, \frac{\pi}{3}\Big)}$$
     La valeur a été confirmée numériquement sur une grille.
- id: "mp-17-26"
  feuille: "f-mp-17"
  numero: 26
  partie: "Optimisation au premier ordre, vecteurs tangents"
  etoiles: 2
