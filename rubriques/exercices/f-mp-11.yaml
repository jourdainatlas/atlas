  enonce: |
    *Perspective : l'équation de la chaleur sur une barre.* On cherche une fonction $u : [0, \pi] \times \mathbb{R}_{+} \to \mathbb{R}$, continue, telle que :

    • pour tout $t > 0$, la fonction $x \mapsto u(x, t)$ est de classe $\mathcal{C}^{2}$ sur $[0, \pi]$, la fonction $t \mapsto u(x, t)$ est dérivable pour tout $x$, et la dérivée de la seconde est égale à la dérivée seconde de la première : $\partial_{t}u = \partial_{x}^{2}u$ ;

    • $u(0, t) = u(\pi, t) = 0$ pour tout $t \geqslant 0$, et $u(x, 0) = h(x) = x(\pi - x)$ pour tout $x \in [0, \pi]$.

    **1.** Chercher les solutions de la forme $u(x, t) = \varphi(t)\psi(x)$, non nulles, qui vérifient l'équation et les conditions en $0$ et en $\pi$.

    **2.** À l'aide de l'exercice 12, écrire $h$ comme une somme $\displaystyle \sum_{n \geqslant 1} \beta_{n}\sin(nx)$ sur $[0, \pi]$.

    **3.** On pose $\displaystyle u(x, t) = \sum_{n \geqslant 1} \beta_{n}\mathrm{e}^{-n^{2}t}\sin(nx)$. Montrer que $u$ est bien définie et continue sur $[0, \pi] \times \mathbb{R}_{+}$, et qu'elle vérifie les conditions imposées. On justifiera les dérivations terme à terme par des convergences normales sur $[0, \pi] \times [t_{0}, +\infty[$, pour $t_{0} > 0$.

    **4.** Montrer que $|u(x, t)| \leqslant \pi\mathrm{e}^{-t}$ pour tous $x$ et $t$, et interpréter.
  corrige: |
    On sépare les variables pour trouver des solutions élémentaires, puis on les superpose avec les coefficients du développement de $h$ en sinus, comme Fourier en 1807.

    **1.** Si $u = \varphi(t)\psi(x)$ est non nulle et vérifie l'équation, $\varphi'(t)\psi(x) = \varphi(t)\psi''(x)$. En un point $(x_{0}, t_{0})$ où $\varphi(t_{0})\psi(x_{0}) \neq 0$, on obtient $\psi'' = -\mu\psi$ avec $\mu = -\frac{\varphi'(t_{0})}{\varphi(t_{0})}$, et $\varphi' = -\mu\varphi$. Les conditions $\psi(0) = \psi(\pi) = 0$, avec $\psi \neq 0$, imposent, par la résolution des équations linéaires du second ordre à coefficients constants vue en MPSI :

    • si $\mu < 0$, $\psi = A\operatorname{ch}(\sqrt{-\mu}x) + B\operatorname{sh}(\sqrt{-\mu}x)$, et les conditions donnent $A = B = 0$ ;

    • si $\mu = 0$, $\psi$ est affine, nulle en $0$ et en $\pi$, donc nulle ;

    • si $\mu > 0$, $\psi = B\sin(\sqrt{\mu}x)$ avec $\sin(\sqrt{\mu}\pi) = 0$, soit $\mu = n^{2}$, $n \geqslant 1$.

    $$\boxed{u(x, t) = C\mathrm{e}^{-n^{2}t}\sin(nx), \quad n \in \mathbb{N}^{*}, \ C \neq 0}$$

    **2.** La fonction $f$ de l'exercice 12 est impaire, de classe $\mathcal{C}^{1}$ et égale à $h$ sur $[0, \pi]$ ; son développement converge normalement (théorème 5) : 
    $$\boxed{h(x) = \sum_{n \geqslant 1} \beta_{n}\sin(nx), \quad \beta_{n} = \frac{4\big(1 - (-1)^{n}\big)}{\pi n^{3}}, \text{ soit } \beta_{2k + 1} = \frac{8}{\pi(2k + 1)^{3}}, \ \beta_{2k} = 0}$$

    **3.** *Définition et continuité.* Pour $t \geqslant 0$, $|\beta_{n}\mathrm{e}^{-n^{2}t}\sin(nx)| \leqslant |\beta_{n}|$, terme général d'une série convergente : la série converge normalement sur $[0, \pi] \times \mathbb{R}_{+}$, et sa somme $u$ est continue comme limite uniforme de fonctions continues (théorème 1 du chapitre 8, dont la preuve s'étend sans changement aux fonctions de deux variables).

    *Dérivées.* Soit $t_{0} > 0$. Sur $[0, \pi] \times [t_{0}, +\infty[$, les dérivées $n\beta_{n}\mathrm{e}^{-n^{2}t}\cos(nx)$, $-n^{2}\beta_{n}\mathrm{e}^{-n^{2}t}\sin(nx)$ et $-n^{2}\beta_{n}\mathrm{e}^{-n^{2}t}\sin(nx)$ (première et seconde en $x$, première en $t$) sont majorées par $n^{2}|\beta_{n}|\mathrm{e}^{-n^{2}t_{0}}$, terme général d'une série convergente. À $t$ fixé, le théorème 6 du chapitre 8 donne la classe $\mathcal{C}^{2}$ de $x \mapsto u(x, t)$ et la dérivation terme à terme ; à $x$ fixé, il donne la dérivabilité de $t \mapsto u(x, t)$ sur $[t_{0}, +\infty[$. Chaque terme vérifiant l'équation, sa somme aussi : $\partial_{t}u = \partial_{x}^{2}u$ pour $t > 0$.

    *Conditions.* Tous les termes sont nuls en $x = 0$ et en $x = \pi$, donc $u(0, t) = u(\pi, t) = 0$ ; enfin, par la question 2, $u(x, 0) = \sum \beta_{n}\sin(nx) = h(x)$. 
    $$\boxed{u \text{ est solution du problème}}$$

    **4.** Pour $n \geqslant 1$, $\mathrm{e}^{-n^{2}t} \leqslant \mathrm{e}^{-t}$, et $\sum_{k \geqslant 0} \frac{1}{(2k + 1)^{3}} \leqslant \sum_{k \geqslant 0} \frac{1}{(2k + 1)^{2}} = \frac{\pi^{2}}{8}$, d'où 
    $$|u(x, t)| \leqslant \mathrm{e}^{-t}\sum_{n \geqslant 1} |\beta_{n}| \leqslant \mathrm{e}^{-t}\cdot\frac{8}{\pi}\cdot\frac{\pi^{2}}{8}, \qquad \boxed{|u(x, t)| \leqslant \pi\mathrm{e}^{-t}}$$
     *Interprétation.* La barre, dont les extrémités sont maintenues à la température $0$, se refroidit exponentiellement vite ; le taux de décroissance est fixé par le premier mode, $n = 1$, les suivants s'éteignant beaucoup plus vite, en $\mathrm{e}^{-9t}$, $\mathrm{e}^{-25t}$, etc. Au bout de quelque temps, le profil de température est presque exactement $\beta_{1}\mathrm{e}^{-t}\sin x$. La majoration n'est d'ailleurs pas optimale, puisque $\sum |\beta_{n}| \approx 2{,}678$, un peu moins que $\pi$.
