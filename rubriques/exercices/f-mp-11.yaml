- id: "mp-11-01"
  feuille: "f-mp-11"
  numero: 1
  partie: "Coefficients de Fourier"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients]
  notions: []
  source: "Feuille d'exercices Séries de Fourier (Polytech Montpellier), exercice 1, question 5 ; Exercices séries de Fourier (Excellence Maths), exercice 3 ; question (d) ajoutée"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Sans calculer d'intégrale, donner la série de Fourier des fonctions suivantes, sous forme complexe puis sous forme réelle : 
    $$\text{(a)} \ \cos^{2}x, \qquad \text{(b)} \ \sin(3x)\cos^{2}(4x), \qquad \text{(c)} \ \cos^{3}x + \sin(2x), \qquad \text{(d)} \ \sin^{4}x.$$
     Quelle proposition du cours justifie la méthode ?
  corrige: |
    La méthode repose sur la proposition 2 (i) : un polynôme trigonométrique $P \in \mathcal{P}_{N}$ vérifie $S_{N}(P) = P$, donc sa série de Fourier est lui-même, et ses coefficients se lisent après linéarisation, sans aucune intégrale. On utilise les formules d'Euler $\cos(kx) = \frac{1}{2}(e_{k} + e_{-k})$ et $\sin(kx) = \frac{1}{2\mathrm{i}}(e_{k} - e_{-k})$.

    **(a)** On a $\cos^{2}x = \frac{1 + \cos(2x)}{2}$, d'où 
    $$\boxed{\cos^{2}x = \frac{1}{2} + \frac{1}{4}\mathrm{e}^{2\mathrm{i} x} + \frac{1}{4}\mathrm{e}^{-2\mathrm{i} x} = \frac{1}{2} + \frac{1}{2}\cos(2x)}$$

    **(b)** On écrit $\cos^{2}(4x) = \frac{1 + \cos(8x)}{2}$, puis $\sin(3x)\cos(8x) = \frac{1}{2}\big(\sin(11x) - \sin(5x)\big)$ : 
    $$\boxed{\sin(3x)\cos^{2}(4x) = \frac{1}{2}\sin(3x) - \frac{1}{4}\sin(5x) + \frac{1}{4}\sin(11x)}$$
     Sous forme complexe, les seuls coefficients non nuls sont $c_{\pm 3} = \mp\frac{\mathrm{i}}{4}$, $c_{\pm 5} = \pm\frac{\mathrm{i}}{8}$ et $c_{\pm 11} = \mp\frac{\mathrm{i}}{8}$, puisque $\frac{1}{2}\sin(3x) = \frac{1}{4\mathrm{i}}(e_{3} - e_{-3}) = -\frac{\mathrm{i}}{4}e_{3} + \frac{\mathrm{i}}{4}e_{-3}$.

    **(c)** La formule $\cos^{3}x = \frac{3\cos x + \cos(3x)}{4}$, obtenue en développant $\big(\frac{\mathrm{e}^{\mathrm{i} x} + \mathrm{e}^{-\mathrm{i} x}}{2}\big)^{3}$, donne 
    $$\boxed{\cos^{3}x + \sin(2x) = \frac{3}{4}\cos x + \sin(2x) + \frac{1}{4}\cos(3x)}$$
     avec $c_{\pm 1} = \frac{3}{8}$, $c_{\pm 2} = \mp\frac{\mathrm{i}}{2}$ et $c_{\pm 3} = \frac{1}{8}$.

    **(d)** En développant $\big(\frac{\mathrm{e}^{\mathrm{i} x} - \mathrm{e}^{-\mathrm{i} x}}{2\mathrm{i}}\big)^{4} = \frac{1}{16}\big(e_{4} - 4e_{2} + 6 - 4e_{-2} + e_{-4}\big)$, 
    $$\boxed{\sin^{4}x = \frac{3}{8} - \frac{1}{2}\cos(2x) + \frac{1}{8}\cos(4x)}$$
     soit $c_{0} = \frac{3}{8}$, $c_{\pm 2} = -\frac{1}{4}$ et $c_{\pm 4} = \frac{1}{16}$.

    *Piège.* L'erreur la plus répandue est de se lancer dans le calcul de $\frac{1}{\pi}\int_{0}^{2\pi} \sin(3x)\cos^{2}(4x)\cos(nx)\,\mathrm{d} x$ pour tout $n$ : c'est long et inutile, puisque l'unicité de l'écriture d'un polynôme trigonométrique, conséquence de l'orthonormalité de $(e_{n})$, fournit directement les coefficients.
- id: "mp-11-02"
  feuille: "f-mp-11"
  numero: 2
  partie: "Coefficients de Fourier"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients]
  notions: [fonction-periodique]
  source: "Feuille d'exercices Séries de Fourier (Polytech Montpellier), exercice 6, question 1 ; BibM@th, Séries de Fourier, exercice 2 ; Exercices séries de Fourier (Excellence Maths), exercice 7 ; Séries de Fourier (agrégation interne), exercice 1"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Gammes.* Calculer les coefficients de Fourier des fonctions périodiques suivantes, définies sur une période, puis écrire leur série de Fourier.

    **(a)** $f$, $2\pi$-périodique, égale à $1$ sur $[0, \pi[$ et à $0$ sur $[\pi, 2\pi[$.

    **(b)** $f$, $2\pi$-périodique, telle que $f(t) = t$ pour $t \in [0, 2\pi[$.

    **(c)** $f$, $2\pi$-périodique, telle que $f(t) = \frac{\pi - t}{2}$ pour $t \in ]0, 2\pi[$ et $f(0) = 0$.

    **(d)** $f$, $2$-périodique, telle que $f(x) = x$ pour $x \in [-1, 1[$.

    **(e)** $f$, $L$-périodique, telle que $f(x) = |x|$ pour $x \in \big[-\frac{L}{2}, \frac{L}{2}\big]$, où $L > 0$.

    Comparer (b) et (c), puis (a) et le créneau du cours.
  corrige: |
    Pour chaque fonction, on exploite d'abord la parité, qui annule la moitié des coefficients (proposition 2 (iii)), puis on intègre par parties.

    **(a)** On a $c_{0} = \frac{1}{2\pi}\int_{0}^{\pi} \mathrm{d} t = \frac{1}{2}$ et, pour $n \neq 0$, 
    $$c_{n} = \frac{1}{2\pi}\int_{0}^{\pi} \mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t = \frac{1}{2\pi}\cdot\frac{1 - \mathrm{e}^{-\mathrm{i} n\pi}}{\mathrm{i} n} = \frac{1 - (-1)^{n}}{2\mathrm{i}\pi n}.$$
     Comme $f - \frac{1}{2}$ est impaire (aux points de saut près, qui n'interviennent pas), les $a_{n}$ sont nuls pour $n \geqslant 1$, et $b_{n} = \mathrm{i}(c_{n} - c_{-n}) = \frac{1 - (-1)^{n}}{\pi n}$ : 
    $$\boxed{\frac{1}{2} + \frac{2}{\pi}\sum_{k = 0}^{+\infty} \frac{\sin\big((2k + 1)t\big)}{2k + 1}}$$

    **(b)** On a $c_{0} = \frac{1}{2\pi}\int_{0}^{2\pi} t\,\mathrm{d} t = \pi$ et, pour $n \neq 0$, une intégration par parties où la primitive de $\mathrm{e}^{-\mathrm{i} nt}$ est $\frac{\mathrm{e}^{-\mathrm{i} nt}}{-\mathrm{i} n}$ donne 
    $$\int_{0}^{2\pi} t\mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t = \Big[\frac{t\mathrm{e}^{-\mathrm{i} nt}}{-\mathrm{i} n}\Big]_{0}^{2\pi} + \frac{1}{\mathrm{i} n}\int_{0}^{2\pi} \mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t = \frac{2\pi}{-\mathrm{i} n} = \frac{2\mathrm{i}\pi}{n}, \qquad\text{d'où}\qquad c_{n} = \frac{\mathrm{i}}{n}.$$
     Ainsi $a_{n} = c_{n} + c_{-n} = 0$ et $b_{n} = \mathrm{i}(c_{n} - c_{-n}) = -\frac{2}{n}$ : 
    $$\boxed{\pi - 2\sum_{n = 1}^{+\infty} \frac{\sin(nt)}{n}}$$

    **(c)** La fonction est impaire, car pour $t \in ]0, 2\pi[$, $f(-t) = f(2\pi - t) = \frac{\pi - 2\pi + t}{2} = -f(t)$. Elle coïncide avec $\frac{\pi}{2} - \frac{1}{2}\times$(b) hors de $2\pi\mathbb{Z}$, donc, par linéarité, $c_{0} = \frac{\pi}{2} - \frac{\pi}{2} = 0$ et $c_{n} = -\frac{\mathrm{i}}{2n}$, soit $b_{n} = \frac{1}{n}$ : 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\sin(nt)}{n}}$$

    **(d)** La fonction est impaire et $2$-périodique ; avec la remarque de la section 11.2 ($T = 2$, $\omega = \pi$), $a_{n} = 0$ et 
    $$b_{n} = \frac{2}{T}\int_{-1}^{1} x\sin(n\pi x)\,\mathrm{d} x = 2\int_{0}^{1} x\sin(n\pi x)\,\mathrm{d} x = 2\Big[-\frac{x\cos(n\pi x)}{n\pi}\Big]_{0}^{1} + \frac{2}{n\pi}\int_{0}^{1} \cos(n\pi x)\,\mathrm{d} x = \frac{2(-1)^{n + 1}}{\pi n},$$

    $$\boxed{\frac{2}{\pi}\sum_{n = 1}^{+\infty} \frac{(-1)^{n + 1}}{n}\sin(n\pi x)}$$

    **(e)** La fonction est paire et $L$-périodique, avec $\omega = \frac{2\pi}{L}$ ; donc $b_{n} = 0$, $a_{0} = \frac{4}{L}\int_{0}^{L/2} x\,\mathrm{d} x = \frac{L}{2}$, et pour $n \geqslant 1$, 
    $$a_{n} = \frac{4}{L}\int_{0}^{L/2} x\cos\Big(\frac{2\pi nx}{L}\Big)\,\mathrm{d} x = \frac{4}{L}\cdot\frac{L^{2}}{4\pi^{2}n^{2}}\Big[\cos\Big(\frac{2\pi nx}{L}\Big)\Big]_{0}^{L/2} = \frac{L\big((-1)^{n} - 1\big)}{\pi^{2}n^{2}},$$
     le crochet intégré par parties étant nul en $0$ et en $\frac{L}{2}$. Seuls les indices impairs subsistent : 
    $$\boxed{\frac{L}{4} - \frac{2L}{\pi^{2}}\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}}\cos\Big(\frac{2\pi(2k + 1)x}{L}\Big)}$$
     Pour $L = 2\pi$, on retrouve le développement de $|x|$ de la section 11.5.

    **Comparaisons.** Les fonctions (b) et (c) sont liées par $f_{c} = \frac{\pi - f_{b}}{2}$ hors de $2\pi\mathbb{Z}$, et les séries le sont de même : c'est la linéarité de $f \mapsto c_{n}(f)$, et le fait que les coefficients ignorent les valeurs en un nombre fini de points par période. De même, si $s$ désigne le créneau du cours, impair et égal à $1$ sur $]0, \pi[$, la fonction (a) vaut $\frac{1 + s}{2}$ hors de $\pi\mathbb{Z}$, et la série obtenue est bien $\frac{1}{2}$ plus la moitié de celle du créneau, $\frac{4}{\pi}\sum \frac{\sin((2k + 1)t)}{2k + 1}$.

    *Piège.* En (e), le terme constant de la série est $\frac{a_{0}}{2} = \frac{L}{4}$, qui est la valeur moyenne de $|x|$ sur une période, et non $a_{0} = \frac{L}{2}$ : oublier le facteur $\frac{1}{2}$ du terme constant est une erreur très fréquente.
- id: "mp-11-03"
  feuille: "f-mp-11"
  numero: 3
  partie: "Coefficients de Fourier"
  etoiles: 1
  types: [Calcul]
