  page_corrige: 12
  enonce: |
    Soit $f \in \mathcal{C}_{2\pi}$ telle que $\lVert S_{N}(f) \rVert_{\infty} \leqslant 1$ pour tout $N \in \mathbb{N}$. Montrer que $\lVert f \rVert_{\infty} \leqslant 1$. La réciproque est-elle vraie ?
  corrige: |
    Les sommes de Fejér, moyennes des sommes partielles, héritent de leur majoration, et convergent uniformément vers $f$.

    **Sens direct.** Par définition, $\sigma_{N}(f) = \frac{1}{N}\sum_{k = 0}^{N - 1} S_{k}(f)$, donc $|\sigma_{N}(f)(x)| \leqslant 1$ pour tout $x$. Par le théorème de Fejér, $\sigma_{N}(f)(x) \to f(x)$, et le passage à la limite donne $|f(x)| \leqslant 1$. $\boxed{\lVert f \rVert_{\infty} \leqslant 1}$

    **Réciproque.** Elle est fausse. Pour $f = |\sin|$, de norme $1$, l'exercice 3 donne 
    $$S_{2}(f)(x) = \frac{2}{\pi} - \frac{4}{3\pi}\cos(2x), \qquad S_{2}(f)\Big(\frac{\pi}{2}\Big) = \frac{2}{\pi} + \frac{4}{3\pi} = \frac{10}{3\pi} \approx 1{,}061 > 1.$$

    $$\boxed{\lVert f \rVert_{\infty} \leqslant 1 \ \not\Rightarrow\ \lVert S_{N}(f) \rVert_{\infty} \leqslant 1}$$
     Les sommes de Fejér, elles, vérifient $\lVert \sigma_{N}(f) \rVert_{\infty} \leqslant \lVert f \rVert_{\infty}$, puisque le noyau $K_{N}$ est positif d'intégrale $1$ : c'est l'avantage décisif du procédé de Fejér, que le noyau de Dirichlet, non positif, n'a pas.
- id: "mp-11-18"
  feuille: "f-mp-11"
  numero: 18
  partie: "Bessel et Parseval"
  etoiles: 2
  types: [Démonstration]
