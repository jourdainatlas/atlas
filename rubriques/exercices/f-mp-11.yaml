  noeuds: [fo-parseval, fo-fejer, as-series, pol-binome]
  notions: [famille-orthonormee, coefficient-binomial]
  source: "Séries de Fourier (agrégation interne), exercice 12 (version sans probabilités ; l'interprétation probabiliste reviendra au chapitre 14)"
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $n \in \mathbb{N}$.

    **1.** Par la formule du binôme, écrire $\cos^{n}$ comme un polynôme trigonométrique, et en déduire 
    $$\frac{1}{2\pi}\int_{-\pi}^{\pi} \cos^{n}x\,\mathrm{d} x = \begin{cases} 0 & \text{si } n \text{ est impair,} \\ \dfrac{1}{2^{n}}\dbinom{n}{n/2} & \text{si } n \text{ est pair.} \end{cases}$$

    **2.** En appliquant l'égalité de Parseval à $\cos^{n}$, démontrer l'identité $\displaystyle \sum_{k = 0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}$, et en donner une interprétation combinatoire.
  corrige: |
    Le polynôme trigonométrique $\cos^{n}$ a des coefficients explicites ; l'égalité de Parseval transforme alors une intégrale en somme de carrés de coefficients binomiaux.

    **1.** La formule du binôme donne 
    $$\cos^{n}x = \frac{1}{2^{n}}\big(\mathrm{e}^{\mathrm{i} x} + \mathrm{e}^{-\mathrm{i} x}\big)^{n} = \frac{1}{2^{n}}\sum_{k = 0}^{n} \binom{n}{k}\mathrm{e}^{\mathrm{i}(2k - n)x},$$
     donc $c_{2k - n}(\cos^{n}) = \frac{1}{2^{n}}\binom{n}{k}$, les autres coefficients étant nuls. L'intégrale demandée est $c_{0}(\cos^{n})$, non nul seulement si $2k = n$ pour un $k$, c'est-à-dire si $n$ est pair : 
    $$\boxed{\frac{1}{2\pi}\int_{-\pi}^{\pi} \cos^{n}x\,\mathrm{d} x = \frac{1}{2^{n}}\binom{n}{n/2} \text{ si } n \text{ est pair}, \quad 0 \text{ sinon}}$$

    **2.** L'égalité de Parseval, appliquée au polynôme trigonométrique $\cos^{n}$, et la question 1 appliquée à l'exposant pair $2n$ donnent 
    $$\frac{1}{4^{n}}\sum_{k = 0}^{n} \binom{n}{k}^{2} = \sum_{m \in \mathbb{Z}} |c_{m}(\cos^{n})|^{2} = \frac{1}{2\pi}\int_{-\pi}^{\pi} \cos^{2n}x\,\mathrm{d} x = \frac{1}{4^{n}}\binom{2n}{n}, \qquad \boxed{\sum_{k = 0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}}$$
     *Interprétation.* Choisir $n$ éléments parmi $2n$ répartis en deux paquets de $n$ revient à choisir un entier $k$, puis $k$ éléments du premier paquet et $n - k$ du second : il y a $\binom{n}{k}\binom{n}{n - k} = \binom{n}{k}^{2}$ façons de le faire. C'est un cas particulier de la formule de Vandermonde, vue en MPSI.
- id: "mp-11-14"
  feuille: "f-mp-11"
  numero: 14
  partie: "Bessel et Parseval"
  etoiles: 2
  types: [Calcul]
  mots_cles: [Bessel et Parseval, égalité de Parseval, sommes de séries]
  noeuds: [fo-parseval, fo-fejer, as-series]
  notions: [famille-orthonormee, produit-scalaire]
  source: "exercice composé pour la feuille (promesse de l'exercice 31 de la feuille du chapitre 10)"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    On munit $\mathcal{C}([0, 1], \mathbb{R})$ du produit scalaire $\displaystyle \langle f, g \rangle = \int_{0}^{1} fg$, et l'on pose $s_{n}(x) = \sqrt{2}\sin(n\pi x)$ pour $n \geqslant 1$. L'exercice 31 de la feuille du chapitre 10 a montré que $(s_{n})$ est orthonormée.

    **1.** Soit $f \in \mathcal{C}([0, 1], \mathbb{R})$, et $F$ la fonction $2$-périodique, impaire, égale à $f$ sur $]0, 1[$ et nulle en $0$ et en $1$. Vérifier que $F$ est continue par morceaux, et exprimer ses coefficients de Fourier à l'aide des $\langle s_{n}, f \rangle$.

    **2.** En déduire, par l'égalité de Parseval appliquée à $F$, que $\displaystyle \int_{0}^{1} f^{2} = \sum_{n = 1}^{+\infty} \langle s_{n}, f \rangle^{2}$, puis que la suite $(s_{n})$ est totale.

    **3.** Le cas $f = 1$ redonne l'égalité obtenue à l'exercice 31 de la feuille du chapitre 10 : laquelle ?
  corrige: |
    On prolonge $f$ en une fonction impaire et $2$-périodique, ce qui fait apparaître les fonctions $s_{n}$ comme les harmoniques de $F$, puis l'on traduit l'égalité de Parseval en termes du produit scalaire de $\mathcal{C}([0, 1], \mathbb{R})$.

    **1.** Sur une période $[-1, 1]$, $F$ coïncide avec des fonctions continues sur $]-1, 0[$ et $]0, 1[$, prolongeables aux bornes ; elle est donc continue par morceaux. Pour $T = 2$ et $\omega = \pi$, l'imparité de $F$ annule la partie en cosinus, et pour $n \geqslant 1$, 
    $$c_{n}(F) = \frac{1}{2}\int_{-1}^{1} F(x)\mathrm{e}^{-\mathrm{i} n\pi x}\,\mathrm{d} x = -\mathrm{i}\int_{0}^{1} f(x)\sin(n\pi x)\,\mathrm{d} x,$$

    $$\boxed{c_{n}(F) = -\frac{\mathrm{i}}{\sqrt{2}}\langle s_{n}, f \rangle, \quad c_{-n}(F) = -c_{n}(F), \quad c_{0}(F) = 0}$$

    **2.** L'égalité de Parseval, transposée à la période $2$, donne 
    $$\int_{0}^{1} f^{2} = \frac{1}{2}\int_{-1}^{1} F^{2} = \sum_{n \in \mathbb{Z}} |c_{n}(F)|^{2} = 2\sum_{n \geqslant 1} \frac{1}{2}\langle s_{n}, f \rangle^{2} = \sum_{n \geqslant 1} \langle s_{n}, f \rangle^{2}.$$
     Soit $p_{N}$ la projection orthogonale sur $\mathrm{Vect}(s_{1}, \dots, s_{N})$. Le théorème de Pythagore donne 
    $$\lVert f - p_{N}(f) \rVert^{2} = \lVert f \rVert^{2} - \sum_{n = 1}^{N} \langle s_{n}, f \rangle^{2} \xrightarrow[N \to +\infty]{} 0.$$
     Toute $f$ est donc limite d'éléments de $\mathrm{Vect}(s_{n})$, ce qui est la définition d'une suite totale (théorème 4 du chapitre 10) : 
    $$\boxed{(s_{n})_{n \geqslant 1} \text{ est totale}}$$

    **3.** Pour $f = 1$, $\langle s_{n}, 1 \rangle = \sqrt{2}\int_{0}^{1} \sin(n\pi x)\,\mathrm{d} x = \frac{\sqrt{2}\big(1 - (-1)^{n}\big)}{n\pi}$, de carré $\frac{8}{\pi^{2}n^{2}}$ pour $n$ impair. L'égalité de la question 2 s'écrit 
    $$1 = \frac{8}{\pi^{2}}\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}}, \qquad\text{soit}\qquad \boxed{\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}} = \frac{\pi^{2}}{8}}$$
     C'est le cas d'égalité de l'inégalité de Bessel obtenue à l'exercice 31 de la feuille du chapitre 10, où il avait fallu la valeur de $\zeta(2)$ pour le constater. La totalité, admise là-bas, est maintenant démontrée.

    *Piège.* La fonction $F$ n'est pas continue en général, puisque $f(0)$ et $f(1)$ n'ont aucune raison d'être nuls : il faut donc l'égalité de Parseval sur $\mathcal{D}_{2\pi}$, et non seulement sur $\mathcal{C}_{2\pi}$. C'est précisément pour ce type d'application que le cours l'a établie pour les fonctions continues par morceaux.
