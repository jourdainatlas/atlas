  enonce: |
    *Inégalité de Wirtinger.* Soit $f \in \mathcal{C}_{2\pi}$ de classe $\mathcal{C}^{1}$ par morceaux, telle que $\displaystyle \int_{0}^{2\pi} f = 0$.

    **1.** Montrer que $\displaystyle \int_{0}^{2\pi} |f|^{2} \leqslant \int_{0}^{2\pi} |f'|^{2}$.

    **2.** Déterminer les fonctions pour lesquelles il y a égalité.

    **3.** Soit $T > 0$ et $g : \mathbb{R} \to \mathbb{C}$ continue, $T$-périodique, de classe $\mathcal{C}^{1}$ par morceaux et de moyenne nulle. Montrer que $\displaystyle \int_{0}^{T} |g|^{2} \leqslant \frac{T^{2}}{4\pi^{2}}\int_{0}^{T} |g'|^{2}$.
  corrige: |
    On compare terme à terme les deux égalités de Parseval, pour $f$ et pour $f'$, reliées par la proposition 3.

    **1.** Par hypothèse, $c_{0}(f) = 0$, et par la proposition 3, $c_{n}(f') = \mathrm{i} n\,c_{n}(f)$. Les deux égalités de Parseval donnent 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} |f|^{2} = \sum_{n \neq 0} |c_{n}(f)|^{2} \leqslant \sum_{n \neq 0} n^{2}|c_{n}(f)|^{2} = \frac{1}{2\pi}\int_{0}^{2\pi} |f'|^{2},$$
     car $n^{2} \geqslant 1$ pour $n \neq 0$. 
    $$\boxed{\int_{0}^{2\pi} |f|^{2} \leqslant \int_{0}^{2\pi} |f'|^{2}}$$

    **2.** Il y a égalité si et seulement si $(n^{2} - 1)|c_{n}(f)|^{2} = 0$ pour tout $n$, c'est-à-dire $c_{n}(f) = 0$ pour $|n| \geqslant 2$. La fonction continue $f$ a alors les mêmes coefficients que $c_{1}e_{1} + c_{-1}e_{-1}$, donc lui est égale (proposition 6) : 
    $$\boxed{\text{égalité ssi } f(t) = a\mathrm{e}^{\mathrm{i} t} + b\mathrm{e}^{-\mathrm{i} t}, \ (a, b) \in \mathbb{C}^{2}}$$
     Pour $f$ réelle, ce sont les fonctions $t \mapsto \alpha\cos t + \beta\sin t$.

    **3.** On pose $f(s) = g\big(\frac{Ts}{2\pi}\big)$, qui est $2\pi$-périodique, continue, de classe $\mathcal{C}^{1}$ par morceaux et de moyenne nulle, avec $f'(s) = \frac{T}{2\pi}g'\big(\frac{Ts}{2\pi}\big)$. Le changement de variable $t = \frac{Ts}{2\pi}$ donne 
    $$\int_{0}^{2\pi} |f|^{2} = \frac{2\pi}{T}\int_{0}^{T} |g|^{2}, \qquad \int_{0}^{2\pi} |f'|^{2} = \frac{T^{2}}{4\pi^{2}}\cdot\frac{2\pi}{T}\int_{0}^{T} |g'|^{2},$$
     et la question 1 fournit 
    $$\boxed{\int_{0}^{T} |g|^{2} \leqslant \frac{T^{2}}{4\pi^{2}}\int_{0}^{T} |g'|^{2}}$$

    *Piège.* L'hypothèse de moyenne nulle est indispensable : une constante non nulle a une dérivée nulle. Et la continuité aussi : pour une fonction seulement de classe $\mathcal{C}^{1}$ par morceaux, la proposition 3 est fausse (le créneau a une dérivée nulle là où elle existe).
- id: "mp-11-16"
  feuille: "f-mp-11"
  numero: 16
  partie: "Bessel et Parseval"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Bessel et Parseval, sommes de séries]
  noeuds: [fo-parseval, fo-fejer, as-series]
  notions: [famille-orthonormee]
  source: "BibM@th, Séries de Fourier, exercice 18"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Soit $f \in \mathcal{C}_{2\pi}$, à valeurs réelles, de classe $\mathcal{C}^{1}$ et telle que $\displaystyle \int_{0}^{2\pi} f = 0$.

    **1.** Montrer que, pour tout $x$, $\displaystyle |f(x)| \leqslant \sum_{n \neq 0} \frac{|c_{n}(f')|}{|n|}$.

    **2.** En déduire que $\displaystyle \lVert f \rVert_{\infty}^{2} \leqslant \frac{\pi}{6}\int_{0}^{2\pi} f'^{2}$.
  corrige: |
    La convergence normale permet de majorer $f$ en chaque point par la somme des modules de ses coefficients, que l'on contrôle ensuite par Cauchy-Schwarz et Parseval.

    **1.** La fonction $f$ est continue et de classe $\mathcal{C}^{1}$ : par le théorème 5, $f(x) = \sum_{n \in \mathbb{Z}} c_{n}(f)\mathrm{e}^{\mathrm{i} nx}$, avec $c_{0}(f) = 0$ et $c_{n}(f) = \frac{c_{n}(f')}{\mathrm{i} n}$ pour $n \neq 0$ (proposition 3). L'inégalité triangulaire donne 
    $$\boxed{|f(x)| \leqslant \sum_{n \neq 0} \frac{|c_{n}(f')|}{|n|}}$$

    **2.** L'inégalité de Cauchy-Schwarz pour les familles sommables de carrés, puis $\sum_{n \neq 0} \frac{1}{n^{2}} = 2\zeta(2) = \frac{\pi^{2}}{3}$ et l'égalité de Parseval pour $f'$, où $c_{0}(f') = 0$, donnent 
    $$|f(x)|^{2} \leqslant \sum_{n \neq 0} \frac{1}{n^{2}}\sum_{n \neq 0} |c_{n}(f')|^{2} = \frac{\pi^{2}}{3}\cdot\frac{1}{2\pi}\int_{0}^{2\pi} f'^{2}, \qquad \boxed{\lVert f \rVert_{\infty}^{2} \leqslant \frac{\pi}{6}\int_{0}^{2\pi} f'^{2}}$$

    *Commentaire.* La constante $\frac{\pi}{6}$ est optimale : il y a égalité dans Cauchy-Schwarz lorsque $|c_{n}(f')|$ est proportionnel à $\frac{1}{|n|}$, soit $c_{n}(f) = \frac{\lambda}{n^{2}}$ pour $n \neq 0$, ce qui est le cas de $h = G - \frac{\pi^{2}}{6}$, où $G$ est la fonction de l'exercice 19 (question 3). Celle-ci est seulement continue et de classe $\mathcal{C}^{1}$ par morceaux, mais la preuve s'applique sans changement dans ce cadre, et l'on vérifie que $|h(0)| = \zeta(2) = \frac{\pi^{2}}{6}$ et $\frac{\pi}{6}\int_{0}^{2\pi} h'^{2} = \frac{\pi}{6}\cdot\frac{\pi^{3}}{6}$ : les deux membres valent $\frac{\pi^{4}}{36}$.
- id: "mp-11-17"
