  noeuds: [fo-parseval, fo-fejer, as-series]
  notions: [famille-orthonormee]
  source: "BibM@th, Séries de Fourier, exercice 27 (argument simplifié par l'égalité de Parseval)"
  page_enonce: 5
  page_corrige: 12
  enonce: |
    *Une série trigonométrique qui n'est pas une série de Fourier.*

    **1.** Montrer que, pour tout réel $t$, la série $\displaystyle \sum_{n \geqslant 2} \frac{\sin(nt)}{\ln n}$ converge. On pourra utiliser une transformation d'Abel, en majorant les sommes $\displaystyle \sum_{k = 2}^{n} \sin(kt)$ lorsque $t \notin 2\pi\mathbb{Z}$.

    **2.** Montrer qu'il n'existe aucune fonction $f \in \mathcal{D}_{2\pi}$ dont cette série soit la série de Fourier.
  corrige: |
    La convergence de la série résulte de la transformation d'Abel ; l'obstruction à être une série de Fourier vient de l'égalité de Parseval, qui imposerait la convergence de la série des carrés des coefficients.

    **1.** Pour $t \in 2\pi\mathbb{Z}$, tous les termes sont nuls. Sinon, la somme géométrique se calcule comme pour le noyau de Dirichlet : 
    $$\sum_{k = 2}^{n} \sin(kt) = \Im\Big(\sum_{k = 2}^{n} \mathrm{e}^{\mathrm{i} kt}\Big), \qquad \Big|\sum_{k = 2}^{n} \mathrm{e}^{\mathrm{i} kt}\Big| = \Big|\frac{\mathrm{e}^{2\mathrm{i} t} - \mathrm{e}^{\mathrm{i}(n + 1)t}}{1 - \mathrm{e}^{\mathrm{i} t}}\Big| \leqslant \frac{2}{|1 - \mathrm{e}^{\mathrm{i} t}|} = \frac{1}{|\sin\frac{t}{2}|}.$$
     Les sommes $\Sigma_{n} = \sum_{k = 2}^{n} \sin(kt)$ sont donc bornées par $M = \frac{1}{|\sin(t/2)|}$, et $\varepsilon_{n} = \frac{1}{\ln n}$ décroît vers $0$. La transformation d'Abel donne, pour $n \geqslant 2$, 
    $$\sum_{k = 2}^{n} \varepsilon_{k}\sin(kt) = \varepsilon_{n}\Sigma_{n} + \sum_{k = 2}^{n - 1} (\varepsilon_{k} - \varepsilon_{k + 1})\Sigma_{k}.$$
     Le premier terme tend vers $0$, et la série $\sum (\varepsilon_{k} - \varepsilon_{k + 1})\Sigma_{k}$ converge absolument, car 
    $$|(\varepsilon_{k} - \varepsilon_{k + 1})\Sigma_{k}| \leqslant M(\varepsilon_{k} - \varepsilon_{k + 1}),$$
     terme général d'une série télescopique convergente. 
    $$\boxed{\text{la série converge pour tout réel } t}$$

    **2.** Supposons que ce soit la série de Fourier d'une fonction $f \in \mathcal{D}_{2\pi}$ : alors $a_{n}(f) = 0$ et $b_{n}(f) = \frac{1}{\ln n}$ pour $n \geqslant 2$. L'égalité de Parseval imposerait la convergence de $\sum b_{n}^{2} = \sum \frac{1}{\ln^{2}n}$. Or $\ln^{2}n \leqslant n$ pour $n$ assez grand, donc $\frac{1}{\ln^{2}n} \geqslant \frac{1}{n}$, terme général d'une série divergente : contradiction. 
    $$\boxed{\text{aucune } f \in \mathcal{D}_{2\pi} \text{ n'a cette série pour série de Fourier}}$$

    *Piège.* Une série trigonométrique qui converge partout n'est pas forcément une série de Fourier, même si sa somme est une fonction raisonnable sur $]0, 2\pi[$ : il faut toujours vérifier que ses coefficients sont ceux d'une fonction. Ici, la condition nécessaire $\sum |c_{n}|^{2} < +\infty$ suffit à conclure.
- id: "mp-11-19"
  feuille: "f-mp-11"
  numero: 19
  partie: "Convergence ponctuelle : le théorème de Dirichlet"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Dirichlet, égalité de Parseval, sommes de séries]
  noeuds: [fo-dirichlet, fo-parseval, as-series]
  notions: [fonction-periodique]
  source: "Feuille d'exercices Séries de Fourier (Polytech Montpellier), exercice 6 ; promesse de l'exercice 13 de la feuille du chapitre 9"
  page_enonce: 5
  page_corrige: 13
  enonce: |
    Soit $g \in \mathcal{D}_{2\pi}$ telle que $g(t) = \frac{\pi - t}{2}$ pour $t \in ]0, 2\pi[$ et $g(0) = 0$ (exercice 2 (c)).

    **1.** Montrer que, pour tout $t \in ]0, 2\pi[$, $\displaystyle \sum_{n = 1}^{+\infty} \frac{\sin(nt)}{n} = \frac{\pi - t}{2}$. Que vaut la somme pour $t \in 2\pi\mathbb{Z}$ ?

    **2.** Retrouver ainsi la formule de Leibniz, puis $\zeta(2)$ par l'égalité de Parseval.

    **3.** On pose $\displaystyle G(t) = \int_{0}^{t} g(s)\,\mathrm{d} s$. Montrer que $G$ est $2\pi$-périodique, continue et de classe $\mathcal{C}^{1}$ par morceaux, et calculer ses coefficients de Fourier à l'aide de ceux de $g$.

    **4.** En déduire, par le théorème de convergence normale, $\displaystyle \sum_{n = 1}^{+\infty} \frac{\cos(nt)}{n^{2}}$ pour $t \in [0, 2\pi]$, et retrouver $\zeta(4)$ par l'égalité de Parseval.
  corrige: |
    La dent de scie $g$ de l'exercice 2 (c) est de classe $\mathcal{C}^{1}$ par morceaux et régularisée ; le théorème de Dirichlet donne sa somme, puis l'intégration fait gagner un ordre de décroissance.

    **1.** D'après l'exercice 2 (c), la série de Fourier de $g$ est $\sum_{n \geqslant 1} \frac{\sin(nt)}{n}$. La fonction $g$ est de classe $\mathcal{C}^{1}$ par morceaux, continue sur $]0, 2\pi[$, et en $0$ sa valeur $0$ est la demi-somme de $g(0^{+}) = \frac{\pi}{2}$ et $g(0^{-}) = -\frac{\pi}{2}$. Le théorème 4 donne donc la convergence vers $g$ en tout point : 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\sin(nt)}{n} = \frac{\pi - t}{2} \ \text{ pour } t \in ]0, 2\pi[, \qquad = 0 \ \text{ pour } t \in 2\pi\mathbb{Z}}$$
     Pour $t \in 2\pi\mathbb{Z}$, c'est d'ailleurs évident, tous les termes étant nuls. C'est la seconde preuve annoncée à l'exercice 13 de la feuille du chapitre 9.

    **2.** En $t = \frac{\pi}{2}$, $\sin\frac{n\pi}{2}$ vaut $0$ pour $n$ pair et $(-1)^{p}$ pour $n = 2p + 1$ : $\sum_{p \geqslant 0} \frac{(-1)^{p}}{2p + 1} = \frac{\pi}{4}$, la formule de Leibniz. L'égalité de Parseval, avec $|c_{n}(g)|^{2} = \frac{1}{4n^{2}}$ pour $n \neq 0$, donne 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} \frac{(\pi - t)^{2}}{4}\,\mathrm{d} t = \frac{1}{2\pi}\cdot\frac{1}{4}\cdot\frac{2\pi^{3}}{3} = \frac{\pi^{2}}{12} = 2\sum_{n \geqslant 1} \frac{1}{4n^{2}} = \frac{\zeta(2)}{2}, \qquad \boxed{\zeta(2) = \frac{\pi^{2}}{6}}$$

    **3.** Sur $[0, 2\pi]$, $G(t) = \int_{0}^{t} \frac{\pi - s}{2}\,\mathrm{d} s = \frac{\pi t}{2} - \frac{t^{2}}{4}$. Par la relation de Chasles et la proposition 1, $G(t + 2\pi) - G(t) = \int_{t}^{t + 2\pi} g = \int_{0}^{2\pi} g = 2\pi c_{0}(g) = 0$ : $G$ est $2\pi$-périodique. Elle est continue, comme toute primitive d'une fonction continue par morceaux, et de classe $\mathcal{C}^{1}$ par morceaux, avec $G' = g$ hors de $2\pi\mathbb{Z}$. La proposition 3 donne $\mathrm{i} n\,c_{n}(G) = c_{n}(g)$, et le calcul direct fournit $c_{0}(G)$ : 
    $$\boxed{c_{n}(G) = \frac{c_{n}(g)}{\mathrm{i} n} = -\frac{1}{2n^{2}} \ (n \neq 0), \qquad c_{0}(G) = \frac{1}{2\pi}\int_{0}^{2\pi} \Big(\frac{\pi t}{2} - \frac{t^{2}}{4}\Big)\mathrm{d} t = \frac{\pi^{2}}{6}}$$

    **4.** Le théorème 5 donne, pour tout réel $t$, $G(t) = \frac{\pi^{2}}{6} - \sum_{n \geqslant 1} \frac{\cos(nt)}{n^{2}}$, d'où, sur $[0, 2\pi]$, 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\cos(nt)}{n^{2}} = \frac{\pi^{2}}{6} - \frac{\pi t}{2} + \frac{t^{2}}{4} = \frac{3t^{2} - 6\pi t + 2\pi^{2}}{12}}$$
     formule contrôlée numériquement, par exemple en $t = 1{,}1$. Enfin, l'égalité de Parseval pour $G$ donne 
    $$\frac{1}{2\pi}\int_{0}^{2\pi} \Big(\frac{\pi t}{2} - \frac{t^{2}}{4}\Big)^{2}\mathrm{d} t = \frac{\pi^{4}}{30} = \frac{\pi^{4}}{36} + 2\sum_{n \geqslant 1} \frac{1}{4n^{4}}, \qquad \boxed{\zeta(4) = 2\Big(\frac{\pi^{4}}{30} - \frac{\pi^{4}}{36}\Big) = \frac{\pi^{4}}{90}}$$

    *Piège.* Intégrer une série de Fourier fait apparaître une constante, $c_{0}(G)$, qu'aucune relation sur les coefficients ne fournit : la proposition 3 ne dit rien pour $n = 0$. L'oublier conduit à la formule fausse $\sum \frac{\cos(nt)}{n^{2}} = -\frac{\pi t}{2} + \frac{t^{2}}{4}$, absurde en $t = 0$.
- id: "mp-11-20"
  feuille: "f-mp-11"
  numero: 20
  partie: "Convergence ponctuelle : le théorème de Dirichlet"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [théorème de Dirichlet, égalité de Parseval, sommes de séries]
  noeuds: [fo-dirichlet, fo-parseval, as-series]
  notions: []
  source: "exercice composé pour la feuille ; BibM@th, Séries de Fourier, exercice 8 (question 3)"
  page_enonce: 5
  page_corrige: 14
  enonce: |
    Soit $a \in ]0, \pi[$ et $f \in \mathcal{D}_{2\pi}$ telle que $f = 1$ sur $[-a, a]$ et $f = 0$ sur $[-\pi, \pi] \setminus [-a, a]$.

    **1.** Calculer les coefficients de Fourier de $f$.

    **2.** En déduire, à l'aide du théorème de Dirichlet en $0$ puis de l'égalité de Parseval, 
    $$\sum_{n = 1}^{+\infty} \frac{\sin(na)}{n} = \frac{\pi - a}{2}, \qquad \sum_{n = 1}^{+\infty} \frac{\sin^{2}(na)}{n^{2}} = \frac{a(\pi - a)}{2}.$$

    **3.** Montrer l'égalité surprenante $\displaystyle \sum_{n = 1}^{+\infty} \frac{\sin n}{n} = \sum_{n = 1}^{+\infty} \Big(\frac{\sin n}{n}\Big)^{2}$. Reste-t-elle vraie si l'on remplace $1$ par $\frac{3\pi}{2}$, c'est-à-dire avec $\sin\big(\frac{3n\pi}{2}\big)$ ?
  corrige: |
    La fonction indicatrice de $[-a, a]$, prolongée par périodicité, est paire et de classe $\mathcal{C}^{1}$ par morceaux ; Dirichlet et Parseval donnent les deux sommes.

    **1.** La fonction est paire, donc $b_{n} = 0$, $a_{0} = \frac{2}{\pi}\int_{0}^{a} \mathrm{d} x = \frac{2a}{\pi}$ et, pour $n \geqslant 1$, 
    $$\boxed{a_{n} = \frac{2}{\pi}\int_{0}^{a} \cos(nx)\,\mathrm{d} x = \frac{2\sin(na)}{\pi n}}$$

    **2.** La fonction est continue en $0$, où elle vaut $1$ ; le théorème 4 donne $1 = \frac{a}{\pi} + \frac{2}{\pi}\sum_{n \geqslant 1} \frac{\sin(na)}{n}$, d'où la première somme. L'égalité de Parseval, sous la forme $\frac{1}{2\pi}\int_{-\pi}^{\pi} f^{2} = \frac{a_{0}^{2}}{4} + \frac{1}{2}\sum a_{n}^{2}$, s'écrit 
    $$\frac{a}{\pi} = \frac{a^{2}}{\pi^{2}} + \frac{2}{\pi^{2}}\sum_{n \geqslant 1} \frac{\sin^{2}(na)}{n^{2}}, \qquad\text{d'où}\qquad \boxed{\sum_{n = 1}^{+\infty} \frac{\sin(na)}{n} = \frac{\pi - a}{2}, \qquad \sum_{n = 1}^{+\infty} \frac{\sin^{2}(na)}{n^{2}} = \frac{a(\pi - a)}{2}}$$

    **3.** Pour $a = 1$, qui est bien dans $]0, \pi[$, les deux sommes valent $\frac{\pi - 1}{2}$, soit environ $1{,}0708$, ce qui a été contrôlé numériquement : 
    $$\boxed{\sum_{n = 1}^{+\infty} \frac{\sin n}{n} = \sum_{n = 1}^{+\infty} \Big(\frac{\sin n}{n}\Big)^{2} = \frac{\pi - 1}{2}}$$
     Pour $\frac{3\pi}{2}$, qui n'est pas dans $]0, \pi[$, les formules ne s'appliquent pas telles quelles. Pour tout entier $n$, on a $\sin\frac{3n\pi}{2} = -\sin\frac{n\pi}{2}$, donc, par la question 2 avec $a = \frac{\pi}{2}$, 
    $$\sum_{n \geqslant 1} \frac{\sin(3n\pi/2)}{n} = -\frac{\pi}{4}, \qquad \sum_{n \geqslant 1} \frac{\sin^{2}(3n\pi/2)}{n^{2}} = \sum_{k \geqslant 0} \frac{1}{(2k + 1)^{2}} = \frac{\pi^{2}}{8}.$$

    $$\boxed{\text{l'égalité est fausse pour } \tfrac{3\pi}{2}}$$
     *Explication.* L'égalité des deux sommes équivaut à $\frac{\pi - a}{2} = \frac{a(\pi - a)}{2}$, soit $a = 1$ lorsque $a \in ]0, \pi[$ ; c'est donc une coïncidence propre à la valeur $1$, et non une identité générale.
- id: "mp-11-21"
  feuille: "f-mp-11"
  numero: 21
  partie: "Convergence ponctuelle : le théorème de Dirichlet"
  etoiles: 3
  types: [Calcul]
  mots_cles: [théorème de Dirichlet, sommes de séries]
  noeuds: [fo-dirichlet, as-series]
  notions: [cosinus-sinus]
  source: "Séries de Fourier (agrégation interne), exercice 5 ; BibM@th, Séries de Fourier, exercice 10 ; autre preuve de l'exercice 56 de la feuille du chapitre 8"
  page_enonce: 6
  page_corrige: 14
  enonce: |
    *Cotangente et produit eulérien du sinus.* Soit $u \in \mathbb{R} \setminus \mathbb{Z}$, et $f_{u} \in \mathcal{C}_{2\pi}$ telle que $f_{u}(x) = \cos(ux)$ pour $x \in [-\pi, \pi]$.

    **1.** Calculer les coefficients de Fourier de $f_{u}$, et en déduire, pour tout $u \in \mathbb{R} \setminus \mathbb{Z}$, 
    $$\pi\operatorname{cotan}(\pi u) = \frac{1}{u} + \sum_{n = 1}^{+\infty} \frac{2u}{u^{2} - n^{2}}.$$
     Comparer avec la démonstration de l'exercice 56 de la feuille du chapitre 8.

    **2.** Pour $x \in ]0, 1[$, intégrer cette égalité sur $[0, x]$, après avoir soustrait $\frac{1}{u}$, en justifiant l'intégration terme à terme.

    **3.** En déduire le produit d'Euler, pour $x \in ]0, 1[$ : 
    $$\frac{\sin(\pi x)}{\pi x} = \lim_{N \to +\infty} \prod_{n = 1}^{N} \Big(1 - \frac{x^{2}}{n^{2}}\Big).$$

    **4.** Avec $x = \frac{1}{2}$, en déduire la formule de Wallis $\displaystyle \frac{\pi}{2} = \lim_{N \to +\infty} \prod_{n = 1}^{N} \frac{4n^{2}}{4n^{2} - 1}$.
  corrige: |
    La fonction $f_{u}$ est paire, continue (car $\cos(-u\pi) = \cos(u\pi)$) et de classe $\mathcal{C}^{1}$ par morceaux : sa série de Fourier converge normalement, et l'évaluation en $\pi$ fait apparaître la cotangente.

    **1.** On linéarise $2\cos(ux)\cos(nx) = \cos\big((u + n)x\big) + \cos\big((u - n)x\big)$, où $u \pm n \neq 0$, puis on utilise $\sin\big((u \pm n)\pi\big) = (-1)^{n}\sin(\pi u)$ : 
    $$a_{n} = \frac{2}{\pi}\int_{0}^{\pi} \cos(ux)\cos(nx)\,\mathrm{d} x = \frac{1}{\pi}\Big(\frac{\sin((u + n)\pi)}{u + n} + \frac{\sin((u - n)\pi)}{u - n}\Big),$$

    $$\boxed{a_{n} = \frac{(-1)^{n}\sin(\pi u)}{\pi}\cdot\frac{2u}{u^{2} - n^{2}}}$$
     formule valable aussi pour $n = 0$, où elle donne $a_{0} = \frac{2\sin(\pi u)}{\pi u}$. Le théorème 5 donne la convergence vers $f_{u}$ partout ; en $x = \pi$, où $\cos(n\pi) = (-1)^{n}$, 
    $$\cos(\pi u) = \frac{\sin(\pi u)}{\pi u} + \frac{\sin(\pi u)}{\pi}\sum_{n \geqslant 1} \frac{2u}{u^{2} - n^{2}},$$
     et l'on divise par $\frac{\sin(\pi u)}{\pi} \neq 0$ : 
    $$\boxed{\pi\operatorname{cotan}(\pi u) = \frac{1}{u} + \sum_{n = 1}^{+\infty} \frac{2u}{u^{2} - n^{2}}}$$
     *Comparaison.* À l'exercice 56 de la feuille du chapitre 8, la formule s'obtenait par la relation de duplication $2f(2x) = f(x) + f\big(x + \frac{1}{2}\big)$ et un argument de maximum, ingénieux mais long ; ici, elle n'est qu'une lecture du théorème de convergence normale en un point.

    **2.** Pour $u \in ]0, x]$, posons $\varphi(u) = \pi\operatorname{cotan}(\pi u) - \frac{1}{u} = \sum_{n \geqslant 1} \frac{2u}{u^{2} - n^{2}}$. Pour $u \in [0, x]$ et $n \geqslant 1$, $n^{2} - u^{2} \geqslant n^{2} - x^{2} > 0$, donc 
    $$\Big|\frac{2u}{u^{2} - n^{2}}\Big| \leqslant \frac{2}{n^{2} - x^{2}},$$
     terme général d'une série convergente : la série converge normalement sur $[0, x]$, sa somme est continue en $0$, et l'on peut intégrer terme à terme (théorème 3 du chapitre 8). On a $\int_{0}^{x} \frac{2u}{u^{2} - n^{2}}\,\mathrm{d} u = \ln\big(1 - \frac{x^{2}}{n^{2}}\big)$, et que $\ln\frac{\sin(\pi u)}{\pi u}$ est une primitive de $\varphi$ sur $]0, x]$, de limite nulle en $0$, 
    $$\boxed{\ln\frac{\sin(\pi x)}{\pi x} = \sum_{n = 1}^{+\infty} \ln\Big(1 - \frac{x^{2}}{n^{2}}\Big)}$$

    **3.** On applique l'exponentielle, continue, aux sommes partielles : 
    $$\prod_{n = 1}^{N} \Big(1 - \frac{x^{2}}{n^{2}}\Big) = \exp\Big(\sum_{n = 1}^{N} \ln\Big(1 - \frac{x^{2}}{n^{2}}\Big)\Big) \xrightarrow[N \to +\infty]{} \exp\Big(\ln\frac{\sin(\pi x)}{\pi x}\Big) = \frac{\sin(\pi x)}{\pi x}.$$

    **4.** Pour $x = \frac{1}{2}$, $\frac{\sin(\pi/2)}{\pi/2} = \frac{2}{\pi}$, et $1 - \frac{1}{4n^{2}} = \frac{4n^{2} - 1}{4n^{2}}$ ; on passe à l'inverse, la limite étant non nulle : 
    $$\boxed{\frac{\pi}{2} = \lim_{N \to +\infty} \prod_{n = 1}^{N} \frac{4n^{2}}{4n^{2} - 1}}$$

    *Piège.* Le passage du logarithme au produit exige que les facteurs soient strictement positifs, ce qui est le cas pour $x \in ]0, 1[$ ; pour $x > 1$, le facteur $1 - x^{2}$ est négatif, et il faudrait raisonner autrement. La formule du produit reste vraie sur $\mathbb{R}$, mais ce n'est pas ce qu'établit l'exercice.
- id: "mp-11-22"
  feuille: "f-mp-11"
  numero: 22
  partie: "Convergence ponctuelle : le théorème de Dirichlet"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [théorème de Dirichlet, convergence uniforme, sommes de séries]
  noeuds: [fo-dirichlet, fc-uniforme, as-series]
  notions: [convergence-uniforme, somme-riemann]
  source: "Séries de Fourier (agrégation interne), exercice 9 ; BibM@th, Séries de Fourier, exercice 15"
  page_enonce: 6
  page_corrige: 15
  enonce: |
    *Le phénomène de Gibbs.* Soit $f$ le créneau du cours : $f \in \mathcal{D}_{2\pi}$ impaire, égale à $1$ sur $]0, \pi[$ et nulle en $0$ et en $\pi$. Pour $K \in \mathbb{N}$, on note $T_{K} = S_{2K + 1}(f)$.

    **1.** Montrer que $T_{K}'(x) = \dfrac{2\sin\big(2(K + 1)x\big)}{\pi\sin x}$ pour $x \notin \pi\mathbb{Z}$.

    **2.** En déduire que, sur $]0, \pi[$, $T_{K}$ atteint son premier maximum local en $h_{K} = \frac{\pi}{2K + 2}$.

    **3.** Montrer que $T_{K}(h_{K})$ est une somme de Riemann, et en déduire 
    $$\lim_{K \to +\infty} T_{K}(h_{K}) = \frac{2}{\pi}\int_{0}^{\pi} \frac{\sin u}{u}\,\mathrm{d} u,$$
     la fonction $u \mapsto \frac{\sin u}{u}$ étant prolongée par continuité en $0$.

    **4.** À l'aide d'une calculatrice, montrer que cette limite vaut environ $1{,}179$. Pourquoi la convergence de $T_{K}$ vers $f$ ne peut-elle pas être uniforme sur $]0, \pi[$ ? Ce dépassement dépend-il de $K$ ?
  corrige: |
    On étudie la somme partielle $T_{K}$ du créneau par sa dérivée, qui se calcule en somme géométrique, puis on reconnaît une somme de Riemann.

    **1.** Le créneau a pour série de Fourier $\frac{4}{\pi}\sum_{k \geqslant 0} \frac{\sin((2k + 1)x)}{2k + 1}$, donc $T_{K}(x) = \frac{4}{\pi}\sum_{k = 0}^{K} \frac{\sin((2k + 1)x)}{2k + 1}$ et $T_{K}'(x) = \frac{4}{\pi}\sum_{k = 0}^{K} \cos\big((2k + 1)x\big)$. Avec $2\sin x\cos\big((2k + 1)x\big) = \sin\big((2k + 2)x\big) - \sin(2kx)$, la somme télescope : 
    $$2\sin x\sum_{k = 0}^{K} \cos\big((2k + 1)x\big) = \sin\big(2(K + 1)x\big), \qquad \boxed{T_{K}'(x) = \frac{2\sin\big(2(K + 1)x\big)}{\pi\sin x}}$$

    **2.** Sur $]0, \pi[$, $\sin x > 0$, et $T_{K}'$ a le signe de $\sin\big(2(K + 1)x\big)$ : elle est strictement positive sur $]0, h_{K}[$, puis négative juste après $h_{K} = \frac{\pi}{2K + 2}$, premier zéro de $T_{K}'$ sur $]0, \pi[$ : 
    $$\boxed{T_{K} \text{ atteint son premier maximum local en } h_{K} = \frac{\pi}{2K + 2}}$$

    **3.** Posons $u_{k} = (2k + 1)h_{K} = \frac{(2k + 1)\pi}{2K + 2}$, milieu du $k$-ième intervalle de la subdivision régulière de $[0, \pi]$ en $K + 1$ intervalles de longueur $\frac{\pi}{K + 1} = 2h_{K}$. Alors $\frac{1}{2k + 1} = \frac{h_{K}}{u_{k}}$, et 
    $$T_{K}(h_{K}) = \frac{4}{\pi}\sum_{k = 0}^{K} h_{K}\frac{\sin u_{k}}{u_{k}} = \frac{2}{\pi}\cdot\frac{\pi}{K + 1}\sum_{k = 0}^{K} \frac{\sin u_{k}}{u_{k}}.$$
     C'est $\frac{2}{\pi}$ fois une somme de Riemann (aux milieux) de la fonction continue $u \mapsto \frac{\sin u}{u}$ sur $[0, \pi]$ (chapitre 18 de MPSI) : 
    $$\boxed{\lim_{K \to +\infty} T_{K}(h_{K}) = \frac{2}{\pi}\int_{0}^{\pi} \frac{\sin u}{u}\,\mathrm{d} u}$$

    **4.** Un calcul numérique donne $\int_{0}^{\pi} \frac{\sin u}{u}\,\mathrm{d} u \approx 1{,}8519$, d'où une limite $\boxed{\approx 1{,}1790}$. Ainsi, pour $K$ grand, $\sup_{]0, \pi[} |T_{K} - f| \geqslant T_{K}(h_{K}) - 1$, qui tend vers $0{,}179$ et non vers $0$ : la convergence n'est pas uniforme sur $]0, \pi[$, bien que la limite $f = 1$ y soit continue. Le dépassement relatif, environ $9\,\%$ du saut, qui vaut $2$, ne dépend pas de $K$ : quand $K$ augmente, la bosse se rapproche du point de saut ($h_{K} \to 0$) sans diminuer de hauteur. C'est le phénomène de Gibbs observé dans le cours, maintenant démontré.

    *Piège.* L'absence de convergence uniforme sur $\mathbb{R}$ était évidente, une limite uniforme de fonctions continues étant continue. Sur $]0, \pi[$, où $f$ est continue, l'argument ne s'applique plus, et c'est le calcul de la bosse qui conclut.
- id: "mp-11-23"
  feuille: "f-mp-11"
  numero: 23
  partie: "Convergence ponctuelle : le théorème de Dirichlet"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème de Dirichlet, sommes de séries]
  noeuds: [fo-dirichlet, as-series]
  notions: []
  source: "BibM@th, Séries de Fourier, exercice 28 (questions élémentaires, sans le théorème de Banach-Steinhaus, hors programme)"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    *Constantes de Lebesgue.* On note $\displaystyle L_{N} = \frac{1}{2\pi}\int_{-\pi}^{\pi} |D_{N}(t)|\,\mathrm{d} t$, où $D_{N}$ est le noyau de Dirichlet.

    **1.** Montrer que $|S_{N}(f)(0)| \leqslant L_{N}\lVert f \rVert_{\infty}$ pour toute $f \in \mathcal{D}_{2\pi}$.

    **2.** En utilisant $\sin\frac{t}{2} \leqslant \frac{t}{2}$ sur $[0, \pi]$, montrer que $\displaystyle L_{N} \geqslant \frac{4}{\pi^{2}}\sum_{k = 1}^{N} \frac{1}{k}$, et en déduire que $L_{N} \to +\infty$.

    **3.** Pour chaque $N$, construire une fonction $f_{N} \in \mathcal{D}_{2\pi}$ telle que $\lVert f_{N} \rVert_{\infty} = 1$ et $S_{N}(f_{N})(0) = L_{N}$. Interpréter ce résultat en lien avec l'exemple de du Bois-Reymond cité dans le cours.
  corrige: |
    La constante $L_{N}$ est la norme de la forme linéaire $f \mapsto S_{N}(f)(0)$ pour la norme infinie ; on montre qu'elle tend vers l'infini en minorant $|D_{N}|$.

    **1.** Par la proposition 5 et la parité de $D_{N}$, $S_{N}(f)(0) = \frac{1}{2\pi}\int_{-\pi}^{\pi} f(t)D_{N}(t)\,\mathrm{d} t$, et l'inégalité triangulaire donne $\boxed{|S_{N}(f)(0)| \leqslant L_{N}\lVert f \rVert_{\infty}}$

    **2.** Par parité, puis avec $0 < \sin\frac{t}{2} \leqslant \frac{t}{2}$ sur $]0, \pi]$, 
    $$L_{N} = \frac{1}{\pi}\int_{0}^{\pi} \frac{|\sin((N + \frac{1}{2})t)|}{\sin\frac{t}{2}}\,\mathrm{d} t \geqslant \frac{2}{\pi}\int_{0}^{\pi} \frac{|\sin((N + \frac{1}{2})t)|}{t}\,\mathrm{d} t = \frac{2}{\pi}\int_{0}^{(N + \frac{1}{2})\pi} \frac{|\sin u|}{u}\,\mathrm{d} u,$$
     par le changement de variable $u = (N + \frac{1}{2})t$. On minore par l'intégrale sur $[0, N\pi]$, découpée en intervalles $[(k - 1)\pi, k\pi]$ où $\frac{1}{u} \geqslant \frac{1}{k\pi}$ et $\int |\sin| = 2$ : 
    $$\boxed{L_{N} \geqslant \frac{2}{\pi}\sum_{k = 1}^{N} \frac{2}{k\pi} = \frac{4}{\pi^{2}}\sum_{k = 1}^{N} \frac{1}{k} \xrightarrow[N \to +\infty]{} +\infty}$$
     On sait même que $L_{N} \sim \frac{4}{\pi^{2}}\ln N$, ce que l'on n'a pas démontré ici.

    **3.** Soit $f_{N}$ la fonction $2\pi$-périodique égale au signe de $D_{N}$ : $1$ là où $D_{N} \geqslant 0$, et $-1$ ailleurs. Comme $D_{N}$ n'a qu'un nombre fini de zéros par période, $f_{N}$ est continue par morceaux, $\lVert f_{N} \rVert_{\infty} = 1$, et $f_{N}D_{N} = |D_{N}|$, d'où $\boxed{S_{N}(f_{N})(0) = L_{N}}$

    *Interprétation.* Il existe donc des fonctions bornées par $1$ dont la somme partielle d'ordre $N$ en $0$ est arbitrairement grande. Les $f_{N}$ ne sont pas continues, mais on peut les approcher par des fonctions continues de même norme, en modifiant les sauts sur des intervalles très courts, sans changer beaucoup $S_{N}(f_{N})(0)$. Cela suggère, sans le démontrer, qu'aucune majoration uniforme de $|S_{N}(f)(0)|$ par $\lVert f \rVert_{\infty}$ n'existe sur $\mathcal{C}_{2\pi}$ : le théorème de Banach-Steinhaus, hors programme, transforme cette observation en l'existence d'une fonction continue dont la série de Fourier diverge en $0$, ce qui retrouve l'exemple de du Bois-Reymond cité dans le cours.
- id: "mp-11-24"
  feuille: "f-mp-11"
  numero: 24
  partie: "Convergence normale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence normale]
  noeuds: [fo-coefficients, fc-uniforme]
  notions: [convergence-uniforme]
  source: "BibM@th, Séries de Fourier, exercices 12 et 13"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    Soit $f \in \mathcal{C}_{2\pi}$. Montrer que $f$ est de classe $\mathcal{C}^{\infty}$ si et seulement si, pour tout $k \in \mathbb{N}$, $n^{k}c_{n}(f)$ tend vers $0$ quand $|n| \to +\infty$.
  corrige: |
    Le sens direct est la proposition 7 (i) ; la réciproque est la proposition 7 (ii), appliquée à tous les ordres.

    **Sens direct.** Si $f$ est de classe $\mathcal{C}^{\infty}$, elle est de classe $\mathcal{C}^{k}$ pour tout $k$, et la proposition 7 (i) donne $n^{k}c_{n}(f) \to 0$.

    **Réciproque.** Supposons $n^{k}c_{n}(f) \to 0$ pour tout $k$. Pour $k$ fixé, $|n|^{k + 2}|c_{n}(f)|$ est borné, donc $|n|^{k}|c_{n}(f)| \leqslant \frac{C_{k}}{n^{2}}$ pour $n \neq 0$ : la famille $\big(|n|^{k}c_{n}(f)\big)$ est sommable. La proposition 7 (ii) montre que $g = \sum c_{n}(f)e_{n}$ est de classe $\mathcal{C}^{k}$ et a les mêmes coefficients que $f$ ; comme $f$ et $g$ sont continues, $f = g$ (proposition 6). Ceci valant pour tout $k$ : 
    $$\boxed{f \in \mathcal{C}^{\infty} \iff \forall k \in \mathbb{N}, \ n^{k}c_{n}(f) \xrightarrow[|n| \to +\infty]{} 0}$$

    *Piège.* La sommabilité ne découle pas directement de $n^{k}c_{n} \to 0$ ; c'est l'utilisation de l'hypothèse à l'ordre $k + 2$ qui fournit le facteur $\frac{1}{n^{2}}$ nécessaire.
- id: "mp-11-25"
  feuille: "f-mp-11"
  numero: 25
  partie: "Convergence normale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence normale]
  noeuds: [fo-coefficients, fc-uniforme]
  notions: [convergence-uniforme]
  source: "BibM@th, Séries de Fourier, exercice 14"
  page_enonce: 7
  page_corrige: 17
  enonce: |
    *Fonctions höldériennes.* Soit $\alpha \in ]0, 1]$, $M > 0$ et $f \in \mathcal{C}_{2\pi}$ telle que $|f(x) - f(y)| \leqslant M|x - y|^{\alpha}$ pour tous $x$, $y$.

    **1.** Pour $n \neq 0$, montrer que $\displaystyle c_{n}(f) = -\frac{1}{2\pi}\int_{0}^{2\pi} f\Big(t + \frac{\pi}{n}\Big)\mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t$.

    **2.** En déduire que $\displaystyle |c_{n}(f)| \leqslant \frac{M}{2}\Big(\frac{\pi}{|n|}\Big)^{\alpha}$.

    **3.** Que donne ce résultat pour une fonction lipschitzienne ? Comparer avec la proposition 7 du cours.
  corrige: |
    On décale la variable d'une demi-période de l'exponentielle $e_{n}$, ce qui change le signe de celle-ci, puis on moyenne les deux expressions de $c_{n}(f)$.

    **1.** Le changement de variable $t = s + \frac{\pi}{n}$ et la proposition 1 donnent, avec $\mathrm{e}^{-\mathrm{i}\pi} = -1$, 
    $$c_{n}(f) = \frac{1}{2\pi}\int_{0}^{2\pi} f\Big(s + \frac{\pi}{n}\Big)\mathrm{e}^{-\mathrm{i} ns}\mathrm{e}^{-\mathrm{i}\pi}\,\mathrm{d} s = \boxed{-\frac{1}{2\pi}\int_{0}^{2\pi} f\Big(t + \frac{\pi}{n}\Big)\mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t}$$

    **2.** On ajoute cette expression à la définition de $c_{n}(f)$ : 
    $$2c_{n}(f) = \frac{1}{2\pi}\int_{0}^{2\pi} \Big(f(t) - f\Big(t + \frac{\pi}{n}\Big)\Big)\mathrm{e}^{-\mathrm{i} nt}\,\mathrm{d} t, \qquad\text{donc}\qquad \boxed{|c_{n}(f)| \leqslant \frac{M}{2}\Big(\frac{\pi}{|n|}\Big)^{\alpha}}$$

    **3.** Pour $f$ lipschitzienne ($\alpha = 1$), on obtient $|c_{n}(f)| \leqslant \frac{M\pi}{2|n|}$, soit $c_{n}(f) = O\big(\frac{1}{n}\big)$. La proposition 7 (i), pour $f$ de classe $\mathcal{C}^{1}$, donne le résultat plus fort $c_{n}(f) = o\big(\frac{1}{n}\big)$, mais sous une hypothèse plus forte. Et pour $f$ continue et de classe $\mathcal{C}^{1}$ par morceaux, donc lipschitzienne, on sait même que $\sum |c_{n}(f)|$ converge (théorème 5), ce que la majoration en $\frac{1}{n}$ ne permet pas d'obtenir : il faut l'inégalité de Bessel pour $f'$.
- id: "mp-11-26"
  feuille: "f-mp-11"
  numero: 26
  partie: "Convergence normale"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence normale]
  noeuds: [fo-coefficients, fc-uniforme]
  notions: [convergence-uniforme, fonction-periodique]
  source: "BibM@th, Séries de Fourier, exercice 21"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Déterminer les fonctions $f : \mathbb{R} \to \mathbb{C}$ de classe $\mathcal{C}^{\infty}$ et $2\pi$-périodiques pour lesquelles il existe $\lambda > 0$ et $M > 0$ tels que $|f^{(n)}(x)| \leqslant M\lambda^{n}$ pour tout $n \in \mathbb{N}$ et tout $x \in \mathbb{R}$.
  corrige: |
    On compare la croissance géométrique autorisée pour les dérivées à la croissance polynomiale imposée par la relation $c_{n}(f^{(k)}) = (\mathrm{i} n)^{k}c_{n}(f)$.

    **Analyse.** Par la proposition 7 (i) et $|c_{n}(g)| \leqslant \lVert g \rVert_{\infty}$, pour tout $k \in \mathbb{N}$ et tout $n \in \mathbb{Z}$, 
    $$|n|^{k}|c_{n}(f)| = |c_{n}(f^{(k)})| \leqslant M\lambda^{k}, \qquad\text{soit}\qquad |c_{n}(f)| \leqslant M\Big(\frac{\lambda}{|n|}\Big)^{k}.$$
     Si $|n| > \lambda$, le membre de droite tend vers $0$ quand $k \to +\infty$, donc $c_{n}(f) = 0$. La fonction continue $f$ a ainsi les mêmes coefficients que le polynôme trigonométrique $\sum_{|n| \leqslant \lambda} c_{n}(f)e_{n}$, et lui est égale (proposition 6).

    **Synthèse.** Si $f = \sum_{|n| \leqslant d} \gamma_{n}e_{n}$ avec $d \leqslant \lambda$, alors $|f^{(k)}(x)| = \big|\sum (\mathrm{i} n)^{k}\gamma_{n}\mathrm{e}^{\mathrm{i} nx}\big| \leqslant \Big(\sum |\gamma_{n}|\Big)d^{k} \leqslant M\lambda^{k}$ avec $M = \sum |\gamma_{n}|$, que l'on remplace par $1$ si elle est nulle. 
    $$\boxed{\text{les polynômes trigonométriques de degré au plus } \lambda}$$
- id: "mp-11-27"
  feuille: "f-mp-11"
  numero: 27
  partie: "Convergence normale"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [convergence normale]
  noeuds: [fo-coefficients, fc-uniforme]
  notions: [convergence-uniforme, fonction-periodique]
  source: "BibM@th, Séries de Fourier, exercice 24"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    Soit $\lambda$ un réel. Déterminer les fonctions $f$ de $\mathbb{R}$ dans $\mathbb{C}$, dérivables et $2\pi$-périodiques, telles que $f'(t) = f(t + \lambda)$ pour tout réel $t$. On commencera par justifier que $f$ est de classe $\mathcal{C}^{1}$, puis l'on comparera les coefficients de Fourier des deux membres.
  corrige: |
    On établit d'abord la régularité, puis la translation se lit sur les coefficients comme une multiplication par $\mathrm{e}^{\mathrm{i} n\lambda}$ (proposition 2 (iv)).

    **Régularité.** La fonction $f$, dérivable, est continue, donc $f' = f(\cdot + \lambda)$ est continue : $f$ est de classe $\mathcal{C}^{1}$ (et même $\mathcal{C}^{\infty}$ par récurrence).

    **Coefficients.** Par les propositions 3 et 2 (iv), $\mathrm{i} n\,c_{n}(f) = \mathrm{e}^{\mathrm{i} n\lambda}c_{n}(f)$ pour tout $n \in \mathbb{Z}$. Si $c_{n}(f) \neq 0$, alors $\mathrm{i} n = \mathrm{e}^{\mathrm{i} n\lambda}$, donc $|n| = 1$ ; pour $n = 1$, cela impose $\mathrm{e}^{\mathrm{i}\lambda} = \mathrm{i}$, et pour $n = -1$, $\mathrm{e}^{-\mathrm{i}\lambda} = -\mathrm{i}$, c'est-à-dire la même condition $\lambda \equiv \frac{\pi}{2} \pmod{2\pi}$. Le coefficient $c_{0}$ est nul, puisque $0 \neq 1$.

    **Conclusion.** Par l'unicité (proposition 6) :

    • si $\lambda \not\equiv \frac{\pi}{2} \pmod{2\pi}$, seule la fonction nulle convient ;

    • si $\lambda \equiv \frac{\pi}{2} \pmod{2\pi}$, $f = ae_{1} + be_{-1}$ ; réciproquement, ces fonctions conviennent, car $\mathrm{e}^{\mathrm{i}(t + \pi/2)} = \mathrm{i}\mathrm{e}^{\mathrm{i} t}$ et $\mathrm{e}^{-\mathrm{i}(t + \pi/2)} = -\mathrm{i}\mathrm{e}^{-\mathrm{i} t}$.

    $$\boxed{f(t) = a\mathrm{e}^{\mathrm{i} t} + b\mathrm{e}^{-\mathrm{i} t} \text{ si } \lambda \equiv \tfrac{\pi}{2} \ [2\pi], \qquad f = 0 \text{ sinon}}$$
     Pour $f$ réelle, on trouve $f(t) = \alpha\cos t + \beta\sin t$ : on vérifie que $\cos' = -\sin = \cos\big(\cdot + \frac{\pi}{2}\big)$.
- id: "mp-11-28"
  feuille: "f-mp-11"
  numero: 28
  partie: "Convergence normale"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [convergence normale, sommes de séries, équations différentielles]
  noeuds: [fo-coefficients, fc-uniforme, as-series]
  notions: [convergence-uniforme, fonction-periodique]
  source: "BibM@th, Séries de Fourier, exercice 23"
  page_enonce: 7
  page_corrige: 18
  enonce: |
    *Solutions périodiques d'une équation différentielle.* On cherche les fonctions $y : \mathbb{R} \to \mathbb{C}$ de classe $\mathcal{C}^{2}$ et $2\pi$-périodiques telles que 
    $$y''(t) + \mathrm{e}^{\mathrm{i} t}y(t) = 0 \qquad \text{pour tout } t \in \mathbb{R}.$$

    **1.** Soit $y$ une telle solution. Montrer que ses coefficients vérifient $n^{2}c_{n}(y) = c_{n - 1}(y)$ pour tout $n \in \mathbb{Z}$, et en déduire $c_{n}(y)$ en fonction de $c_{0}(y)$.

    **2.** Réciproquement, montrer que $\displaystyle y_{0}(t) = \sum_{n = 0}^{+\infty} \frac{\mathrm{e}^{\mathrm{i} nt}}{(n!)^{2}}$ est une solution.

    **3.** Conclure. Le chapitre 16 montrera que l'ensemble de toutes les solutions, périodiques ou non, est un plan vectoriel : qu'en déduit-on ?
  corrige: |
    La multiplication par $\mathrm{e}^{\mathrm{i} t}$ décale les coefficients d'un rang ; l'équation devient une relation de récurrence, qui se résout explicitement.

    **1.** Comme $y$ est de classe $\mathcal{C}^{2}$, la proposition 7 (i) donne $c_{n}(y'') = -n^{2}c_{n}(y)$, et par définition $c_{n}(e_{1}y) = \frac{1}{2\pi}\int_{0}^{2\pi} y(t)\mathrm{e}^{-\mathrm{i}(n - 1)t}\,\mathrm{d} t = c_{n - 1}(y)$. L'équation donne donc 
    $$\boxed{n^{2}c_{n}(y) = c_{n - 1}(y) \quad \text{pour tout } n \in \mathbb{Z}}$$
     Pour $n = 0$, $c_{-1}(y) = 0$, puis, de proche en proche vers les indices négatifs, $c_{n - 1}(y) = n^{2}c_{n}(y) = 0$ : tous les coefficients d'indice négatif sont nuls. Pour $n \geqslant 1$, $c_{n}(y) = \frac{c_{n - 1}(y)}{n^{2}}$, d'où, par récurrence, 
    $$\boxed{c_{n}(y) = \frac{c_{0}(y)}{(n!)^{2}} \ (n \geqslant 0), \qquad c_{n}(y) = 0 \ (n < 0)}$$

    **2.** La famille $\big(\frac{n^{k}}{(n!)^{2}}\big)_{n \geqslant 0}$ est sommable pour tout $k$, donc la proposition 7 (ii) montre que $y_{0}$ est de classe $\mathcal{C}^{\infty}$, et que l'on peut dériver terme à terme : 
    $$y_{0}''(t) + \mathrm{e}^{\mathrm{i} t}y_{0}(t) = -\sum_{n \geqslant 1} \frac{n^{2}\mathrm{e}^{\mathrm{i} nt}}{(n!)^{2}} + \sum_{n \geqslant 0} \frac{\mathrm{e}^{\mathrm{i}(n + 1)t}}{(n!)^{2}} = -\sum_{n \geqslant 1} \frac{\mathrm{e}^{\mathrm{i} nt}}{((n - 1)!)^{2}} + \sum_{m \geqslant 1} \frac{\mathrm{e}^{\mathrm{i} mt}}{((m - 1)!)^{2}} = 0.$$

    **3.** Une solution périodique $y$ a les mêmes coefficients que $c_{0}(y)y_{0}$, et lui est égale, toutes deux étant continues : 
    $$\boxed{\text{les solutions } 2\pi\text{-périodiques sont les } cy_{0}, \ c \in \mathbb{C}}$$
     Elles forment une droite vectorielle. Comme l'ensemble de toutes les solutions sera un plan vectoriel (chapitre 16), *il existe des solutions qui ne sont pas $2\pi$-périodiques* : toute solution qui n'est pas colinéaire à $y_{0}$.

    *Piège.* On ne peut pas appliquer directement la théorie des séries de Fourier à une solution quelconque : l'hypothèse de périodicité est essentielle, et c'est précisément elle qui élimine la seconde direction de solutions.
- id: "mp-11-29"
  feuille: "f-mp-11"
  numero: 29
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, convergence uniforme, sommes de séries]
  noeuds: [fc-uniforme, as-series]
  notions: [convergence-uniforme]
  source: "exercice composé pour la feuille (Vrai ou faux)"
  page_enonce: 8
  page_corrige: 19
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Dans tout l'exercice, $f$ désigne un élément de $\mathcal{D}_{2\pi}$.

    **1.** Si $f$ est paire, $b_{n}(f) = 0$ pour tout $n \geqslant 1$.

    **2.** La suite $\big(c_{n}(f)\big)$ tend vers $0$ quand $|n| \to +\infty$.

    **3.** Si $f$ est continue, $S_{N}(f)$ converge uniformément vers $f$ sur $\mathbb{R}$.

    **4.** Si $f$ est de classe $\mathcal{C}^{1}$ par morceaux, $S_{N}(f)(x)$ tend vers $f(x)$ pour tout réel $x$.

    **5.** Deux fonctions de $\mathcal{C}_{2\pi}$ qui ont les mêmes coefficients de Fourier sont égales.

    **6.** On a $\displaystyle \sum_{n = -\infty}^{+\infty} |c_{n}(f)|^{2} = \frac{1}{2\pi}\int_{0}^{2\pi} |f|^{2}$.

    **7.** Si la famille $\big(c_{n}(f)\big)$ est sommable, $f$ est continue.

    **8.** Si $f$ est continue et de classe $\mathcal{C}^{1}$ par morceaux, la famille $\big(c_{n}(f)\big)$ est sommable.

    **9.** Si $f$ est de classe $\mathcal{C}^{2}$, $n^{2}c_{n}(f)$ tend vers $0$ quand $|n| \to +\infty$.

    **10.** Si $f$ est continue, $\lVert S_{N}(f) \rVert_{\infty} \leqslant \lVert f \rVert_{\infty}$ pour tout $N$.
  corrige: |
    Chaque affirmation se rattache à un énoncé précis du cours ; les contre-exemples sont tous tirés de cette feuille.

    **1. Vrai.** C'est la proposition 2 (iii) : $t \mapsto f(t)\sin(nt)$ est impaire, d'intégrale nulle sur $[-\pi, \pi]$.

    **2. Vrai.** C'est le lemme de Riemann-Lebesgue (théorème 1), ou plus simplement l'inégalité de Bessel, qui donne la convergence de $\sum |c_{n}(f)|^{2}$.

    **3. Faux.** La continuité ne suffit même pas à la convergence simple : du Bois-Reymond a construit une fonction continue dont la série de Fourier diverge en un point (section 11.4 ; voir aussi l'exercice 23). La convergence uniforme est assurée si $f$ est de plus de classe $\mathcal{C}^{1}$ par morceaux (théorème 5).

    **4. Faux.** En un point de saut, la limite est la demi-somme $\frac{1}{2}\big(f(x^{+}) + f(x^{-})\big)$ (théorème 4). Pour la fonction de l'exercice 2 (a), qui vaut $1$ en $0$, $S_{N}(f)(0) = \frac{1}{2}$ pour tout $N$.

    **5. Vrai.** C'est la proposition 6 (unicité).

    **6. Vrai.** C'est l'égalité de Parseval (théorème 3), valable sur tout $\mathcal{D}_{2\pi}$.

    **7. Faux.** La fonction égale à $1$ sur $2\pi\mathbb{Z}$ et à $0$ ailleurs est continue par morceaux, a tous ses coefficients nuls, donc une famille sommable, et n'est pas continue. L'énoncé correct est : si $(c_{n}(f))$ est sommable, $f$ coïncide avec une fonction continue en tous ses points de continuité.

    **8. Vrai.** C'est le théorème 5.

    **9. Vrai.** C'est la proposition 7 (i) avec $k = 2$.

    **10. Faux.** L'exercice 17 donne $\lVert S_{2}(|\sin|) \rVert_{\infty} \geqslant \frac{10}{3\pi} > 1 = \lVert |\sin| \rVert_{\infty}$. Le phénomène de Gibbs (exercice 22) fournit un autre contre-exemple, discontinu ; l'exercice 23 montre que le rapport $\frac{|S_{N}(f)(0)|}{\lVert f \rVert_{\infty}}$ n'est même pas borné.

    $$\boxed{\text{vrai : } 1, 2, 5, 6, 8, 9 \qquad \text{faux : } 3, 4, 7, 10}$$
- id: "mp-11-30"
  feuille: "f-mp-11"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse]
  noeuds: [fo-coefficients]
  notions: [fonction-periodique]
  source: "Séries de Fourier (agrégation interne), exercice 8 ; Exercices séries de Fourier (Excellence Maths), exercice 17 (X) ; énoncé reformulé avec un paramétrage à vitesse constante"
  page_enonce: 8
  page_corrige: 20
  enonce: |
    *Perspective : l'inégalité isopérimétrique.* Soit $\gamma = (x, y) : \mathbb{R} \to \mathbb{R}^{2}$ une courbe fermée, $2\pi$-périodique, continue et de classe $\mathcal{C}^{1}$ par morceaux, parcourue à vitesse constante : $\lVert \gamma'(t) \rVert = \frac{L}{2\pi}$ en tout point où $\gamma$ est dérivable, où $L > 0$ est la longueur de la courbe. On admet que l'aire du domaine qu'elle délimite, si elle est simple et parcourue dans le sens direct, vaut 
    $$S = \int_{0}^{2\pi} x(t)y'(t)\,\mathrm{d} t.$$

    **1.** Montrer que $\displaystyle L^{2} = 2\pi\int_{0}^{2\pi} \big(x'^{2} + y'^{2}\big)$.

    **2.** Soit $\bar{x}$ la moyenne de $x$ sur une période. Montrer que 
    $$S = \int_{0}^{2\pi} (x - \bar{x})y', \qquad\text{puis que}\qquad 2S \leqslant \int_{0}^{2\pi} \big((x - \bar{x})^{2} + y'^{2}\big).$$

    **3.** En déduire, à l'aide de l'inégalité de Wirtinger (exercice 15), l'*inégalité isopérimétrique* $L^{2} \geqslant 4\pi S$.

    **4.** Montrer qu'il y a égalité si et seulement si $\gamma$ décrit un cercle.

    Parmi les courbes fermées de longueur donnée, le cercle est donc celle qui enclôt la plus grande aire, propriété connue depuis l'Antiquité et que la démonstration ci-dessus, due pour l'essentiel à Hurwitz (1901), établit en quelques lignes.
  corrige: |
    On compare l'aire et le carré de la longueur à travers les coefficients de Fourier, par l'inégalité $2ab \leqslant a^{2} + b^{2}$ et l'inégalité de Wirtinger.

    **1.** La vitesse est constante, égale à $\frac{L}{2\pi}$, en dehors d'un nombre fini de points par période, donc 
    $$\int_{0}^{2\pi} \big(x'^{2} + y'^{2}\big) = \int_{0}^{2\pi} \lVert \gamma' \rVert^{2} = 2\pi\cdot\frac{L^{2}}{4\pi^{2}} = \frac{L^{2}}{2\pi}, \qquad \boxed{L^{2} = 2\pi\int_{0}^{2\pi} \big(x'^{2} + y'^{2}\big)}$$

    **2.** Comme $y$ est continue, périodique et de classe $\mathcal{C}^{1}$ par morceaux, $\int_{0}^{2\pi} y' = y(2\pi) - y(0) = 0$, donc $\int_{0}^{2\pi} \bar{x}y' = 0$ et 
    $$S = \int_{0}^{2\pi} (x - \bar{x})y'.$$
     L'inégalité $2ab \leqslant a^{2} + b^{2}$, appliquée en chaque point, donne 
    $$\boxed{2S \leqslant \int_{0}^{2\pi} \big((x - \bar{x})^{2} + y'^{2}\big)}$$

    **3.** La fonction $x - \bar{x}$ est réelle, continue, de classe $\mathcal{C}^{1}$ par morceaux et de moyenne nulle : l'inégalité de Wirtinger (exercice 15) donne $\int (x - \bar{x})^{2} \leqslant \int x'^{2}$. Avec la question 1, 
    $$2S \leqslant \int_{0}^{2\pi} \big(x'^{2} + y'^{2}\big) = \frac{L^{2}}{2\pi}, \qquad \boxed{L^{2} \geqslant 4\pi S}$$

    **4.** *Condition nécessaire.* S'il y a égalité, les deux inégalités utilisées sont des égalités. D'une part, l'égalité dans Wirtinger impose $x(t) - \bar{x} = a\cos t + b\sin t$, avec $a$, $b$ réels (exercice 15, question 2). D'autre part, la fonction positive $(x - \bar{x} - y')^{2}$, continue par morceaux, est d'intégrale nulle, donc nulle sauf en un nombre fini de points par période : $y' = a\cos t + b\sin t$ presque partout, d'où, $y$ étant continue, $y(t) = \bar{y} + a\sin t - b\cos t$. Alors 
    $$\big(x(t) - \bar{x}\big)^{2} + \big(y(t) - \bar{y}\big)^{2} = a^{2} + b^{2},$$
     et $\gamma$ décrit le cercle de centre $(\bar{x}, \bar{y})$ et de rayon $\sqrt{a^{2} + b^{2}}$.

    *Condition suffisante.* Pour un cercle de rayon $R$ parcouru une fois à vitesse constante, $L = 2\pi R$ et $S = \pi R^{2}$, donc $L^{2} = 4\pi^{2}R^{2} = 4\pi S$. 
    $$\boxed{L^{2} = 4\pi S \iff \gamma \text{ décrit un cercle}}$$

    *Commentaire.* L'hypothèse de vitesse constante n'est pas restrictive : toute courbe régulière peut être reparamétrée à vitesse constante, par l'abscisse curviligne, sans changer ni sa longueur ni l'aire qu'elle délimite. Les sources de l'exercice écrivaient $L^{2} = 2\pi\int \lVert \gamma' \rVert^{2}$ sans cette hypothèse, ce qui est faux en général : l'inégalité de Cauchy-Schwarz donne seulement $L^{2} \leqslant 2\pi\int \lVert \gamma' \rVert^{2}$, avec égalité si et seulement si la vitesse est constante.
- id: "mp-11-31"
  feuille: "f-mp-11"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse, théorème de Fejér, sommes de séries]
  noeuds: [fo-fejer, as-series]
  notions: []
  source: "Séries de Fourier (agrégation interne), exercice 10"
  page_enonce: 9
  page_corrige: 21
  enonce: |
    *Perspective : le critère d'équirépartition de Weyl.* Soit $\theta$ un réel irrationnel. Pour un réel $x$, on note $\{x\} = x - \lfloor x \rfloor$ sa partie fractionnaire. Pour $f : \mathbb{R} \to \mathbb{C}$ continue et $1$-périodique, on pose 
    $$U_{n}(f) = \frac{1}{n}\sum_{k = 0}^{n - 1} f(k\theta).$$

    **1.** Pour $m \in \mathbb{Z}$ et $f_{m}(t) = \mathrm{e}^{2\mathrm{i}\pi mt}$, calculer $\displaystyle \lim_{n \to +\infty} U_{n}(f_{m})$.

    **2.** Montrer que, pour toute $f$ continue et $1$-périodique, $\displaystyle \lim_{n \to +\infty} U_{n}(f) = \int_{0}^{1} f(t)\,\mathrm{d} t$. On utilisera le théorème de Fejér, transposé aux fonctions $1$-périodiques.

    **3.** Soit $0 \leqslant a < b \leqslant 1$. En encadrant la fonction caractéristique de $[a, b]$ par deux fonctions continues et affines par morceaux, montrer que 
    $$\lim_{n \to +\infty} \frac{1}{n}\operatorname{card}\big\{k \in \llbracket 0\,,n - 1 \rrbracket \mid \{k\theta\} \in [a, b]\big\} = b - a.$$

    **4.** En déduire que l'ensemble $\{\{k\theta\} \mid k \in \mathbb{N}\}$ est dense dans $[0, 1]$. Application : montrer qu'il existe une puissance de $2$ dont l'écriture décimale commence par $2026$, en considérant $\theta = \frac{\ln 2}{\ln 10}$.
  corrige: |
    On prouve la convergence des moyennes $U_{n}(f)$ d'abord pour les exponentielles, puis pour les polynômes trigonométriques par linéarité, enfin pour les fonctions continues par le théorème de Fejér.

    **1.** Pour $m = 0$, $U_{n}(f_{0}) = 1 = \int_{0}^{1} f_{0}$. Pour $m \neq 0$, $q = \mathrm{e}^{2\mathrm{i}\pi m\theta} \neq 1$, puisque $m\theta \notin \mathbb{Z}$, $\theta$ étant irrationnel. La somme géométrique donne 
    $$|U_{n}(f_{m})| = \frac{1}{n}\Big|\frac{q^{n} - 1}{q - 1}\Big| \leqslant \frac{2}{n|q - 1|} \xrightarrow[n \to +\infty]{} 0 = \int_{0}^{1} f_{m}, \qquad \boxed{\lim_{n \to +\infty} U_{n}(f_{m}) = \int_{0}^{1} f_{m}(t)\,\mathrm{d} t}$$

    **2.** Par linéarité, le résultat vaut pour tout polynôme trigonométrique $1$-périodique, combinaison des $f_{m}$. Soit $f$ continue $1$-périodique et $\varepsilon > 0$. Le théorème de Fejér, transposé à la période $1$, fournit un tel polynôme $P$ avec $\lVert f - P \rVert_{\infty} \leqslant \varepsilon$. Comme $|U_{n}(g)| \leqslant \lVert g \rVert_{\infty}$, 
    $$\Big|U_{n}(f) - \int_{0}^{1} f\Big| \leqslant |U_{n}(f - P)| + \Big|U_{n}(P) - \int_{0}^{1} P\Big| + \Big|\int_{0}^{1} (P - f)\Big| \leqslant 2\varepsilon + \Big|U_{n}(P) - \int_{0}^{1} P\Big|,$$
     qui est inférieur à $3\varepsilon$ pour $n$ assez grand. 
    $$\boxed{\lim_{n \to +\infty} U_{n}(f) = \int_{0}^{1} f}$$

    **3.** Soit $\chi$ la fonction $1$-périodique valant $1$ si $\{x\} \in [a, b]$ et $0$ sinon. La quantité étudiée est $U_{n}(\chi)$. Pour $\varepsilon \in \big]0, \frac{b - a}{2}\big[$, on construit deux fonctions continues, $1$-périodiques et affines par morceaux sur $[0, 1]$ :

    • $\varphi_{\varepsilon}$, égale à $1$ sur $[a + \varepsilon, b - \varepsilon]$, nulle hors de $]a, b[$ et affine entre les deux, de sorte que $\varphi_{\varepsilon} \leqslant \chi$ et $\int_{0}^{1} \varphi_{\varepsilon} \geqslant b - a - 2\varepsilon$ ;

    • $\psi_{\varepsilon}$, égale à $1$ sur $[a, b]$, nulle hors de $[a - \varepsilon, b + \varepsilon]$ (modulo $1$) et affine entre les deux, bornée par $1$, de sorte que $\chi \leqslant \psi_{\varepsilon}$ et $\int_{0}^{1} \psi_{\varepsilon} \leqslant b - a + 2\varepsilon$.

    Alors $U_{n}(\varphi_{\varepsilon}) \leqslant U_{n}(\chi) \leqslant U_{n}(\psi_{\varepsilon})$, et la question 2 donne 
    $$b - a - 2\varepsilon \leqslant \liminf U_{n}(\chi) \leqslant \limsup U_{n}(\chi) \leqslant b - a + 2\varepsilon,$$
     et, $\varepsilon$ étant arbitraire, la limite existe et vaut $b - a$. 
    $$\boxed{\lim_{n \to +\infty} \frac{1}{n}\operatorname{card}\{k < n \mid \{k\theta\} \in [a, b]\} = b - a}$$

    **4.** *Densité.* Si un intervalle $[a, b] \subset [0, 1]$ avec $a < b$ ne contenait aucun $\{k\theta\}$, la proportion de la question 3 serait nulle pour tout $n$, et sa limite $b - a$ aussi : contradiction. Tout intervalle non trivial de $[0, 1]$ contient donc un $\{k\theta\}$. $\boxed{\{\{k\theta\} \mid k \in \mathbb{N}\} \text{ est dense dans } [0, 1]}$

    *Application.* Le réel $\theta = \frac{\ln 2}{\ln 10}$ est irrationnel : si $\theta = \frac{p}{q}$ avec $p$, $q \geqslant 1$, alors $2^{q} = 10^{p}$, ce qui est impossible car $5$ divise $10^{p}$ mais pas $2^{q}$. Or $2^{k}$ s'écrit avec $2026$ en tête si et seulement s'il existe $j \in \mathbb{N}$ tel que $2026 \cdot 10^{j} \leqslant 2^{k} < 2027 \cdot 10^{j}$, c'est-à-dire, en prenant le logarithme décimal, 
    $$\{k\theta\} \in \big[\log_{10}(2{,}026), \log_{10}(2{,}027)\big[,$$
     pour $k$ assez grand pour que $j = \lfloor k\theta \rfloor - 3 \geqslant 0$. Cet intervalle, non trivial, contient un segment non trivial, donc une infinité de $\{k\theta\}$ par la question 3 : 
    $$\boxed{\text{il existe une infinité de puissances de 2 commençant par 2026}}$$

    La plus petite, trouvée par le calcul, est $2^{589}$, qui a $178$ chiffres et commence par $202613\ldots$
