  source: "Exercices séries de Fourier (Excellence Maths), exercice 19 (X-ENS), sans l'étude de l'harmonicité"
  page_enonce: 10
  page_corrige: 24
  enonce: |
    *Le noyau de Poisson.* Pour $r \in [0, 1[$ et $t \in \mathbb{R}$, on pose $\displaystyle P_{r}(t) = \sum_{n = -\infty}^{+\infty} r^{|n|}\mathrm{e}^{\mathrm{i} nt}$.

    **1.** Montrer que la série converge normalement en $t$, et que 
    $$P_{r}(t) = \frac{1 - r^{2}}{1 - 2r\cos t + r^{2}}.$$

    **2.** Montrer que $P_{r} > 0$ et que $\displaystyle \frac{1}{2\pi}\int_{-\pi}^{\pi} P_{r} = 1$. Pour $\delta \in ]0, \pi[$, montrer que $\displaystyle \sup_{\delta \leqslant |t| \leqslant \pi} P_{r}(t) \xrightarrow[r \to 1^{-}]{} 0$.

    **3.** Soit $f \in \mathcal{C}_{2\pi}$. On pose $\displaystyle u_{r}(x) = \sum_{n = -\infty}^{+\infty} r^{|n|}c_{n}(f)\mathrm{e}^{\mathrm{i} nx}$. Montrer que $\displaystyle u_{r}(x) = \frac{1}{2\pi}\int_{-\pi}^{\pi} f(x - t)P_{r}(t)\,\mathrm{d} t$.

    **4.** En déduire que $u_{r}$ converge uniformément vers $f$ sur $\mathbb{R}$ quand $r \to 1^{-}$.

    **5.** On suppose que la série de Fourier de $f$ converge en un point $x$, au sens des sommes symétriques $S_{N}(f)(x)$. À l'aide du théorème d'Abel radial (chapitre 9), montrer que sa somme est $f(x)$.
  corrige: |
    Le noyau de Poisson est, comme le noyau de Fejér, positif, d'intégrale $1$ et concentré près de $0$ ; il en résulte une approximation uniforme de $f$ par les $u_{r}$, puis une version du théorème de Fejér où les moyennes de Cesàro sont remplacées par le procédé d'Abel.

    **1.** On a $|r^{|n|}\mathrm{e}^{\mathrm{i} nt}| = r^{|n|}$, et $\sum r^{|n|}$ converge : la série converge normalement en $t$. En regroupant $n$ et $-n$, avec $z = r\mathrm{e}^{\mathrm{i} t}$, de module $r < 1$, 
    $$P_{r}(t) = 1 + 2\Re\sum_{n \geqslant 1} z^{n} = 1 + 2\Re\frac{z}{1 - z} = \Re\frac{1 + z}{1 - z} = \frac{\Re\big((1 + z)(1 - \bar{z})\big)}{|1 - z|^{2}} = \frac{1 - |z|^{2}}{|1 - z|^{2}},$$
     et $|1 - z|^{2} = 1 - 2r\cos t + r^{2}$. 
    $$\boxed{P_{r}(t) = \frac{1 - r^{2}}{1 - 2r\cos t + r^{2}}}$$

    **2.** Le numérateur est strictement positif, et le dénominateur est $|1 - r\mathrm{e}^{\mathrm{i} t}|^{2} > 0$ : $P_{r} > 0$. Par intégration terme à terme, permise par la convergence normale, seul le terme $n = 0$ subsiste, et $\frac{1}{2\pi}\int_{-\pi}^{\pi} P_{r} = 1$. Enfin, $1 - 2r\cos t + r^{2} = (1 - r)^{2} + 2r(1 - \cos t)$, et pour $\delta \leqslant |t| \leqslant \pi$, $1 - \cos t \geqslant 1 - \cos\delta$, d'où, pour $r \in [\frac{1}{2}, 1[$, 
    $$0 < P_{r}(t) \leqslant \frac{1 - r^{2}}{2r(1 - \cos\delta)} \leqslant \frac{1 - r^{2}}{1 - \cos\delta}, \qquad \boxed{\sup_{\delta \leqslant |t| \leqslant \pi} P_{r}(t) \xrightarrow[r \to 1^{-}]{} 0}$$

    **3.** La série définissant $u_{r}$ converge normalement, car $|c_{n}(f)| \leqslant \lVert f \rVert_{\infty}$. Comme $f$ est bornée, la série $\sum r^{|n|}f(x - t)\mathrm{e}^{\mathrm{i} nt}$ converge normalement en $t$, et l'on intègre terme à terme : 
    $$\frac{1}{2\pi}\int_{-\pi}^{\pi} f(x - t)P_{r}(t)\,\mathrm{d} t = \sum_{n \in \mathbb{Z}} r^{|n|}\frac{1}{2\pi}\int_{-\pi}^{\pi} f(x - t)\mathrm{e}^{\mathrm{i} nt}\,\mathrm{d} t = \sum_{n \in \mathbb{Z}} r^{|n|}c_{n}(f)\mathrm{e}^{\mathrm{i} nx} = u_{r}(x),$$
     le calcul de l'intégrale intermédiaire se faisant par le changement de variable $s = x - t$ et la proposition 1, comme pour la proposition 5.

    **4.** La question 2 permet d'écrire $u_{r}(x) - f(x) = \frac{1}{2\pi}\int_{-\pi}^{\pi} \big(f(x - t) - f(x)\big)P_{r}(t)\,\mathrm{d} t$. Soit $\varepsilon > 0$, et $\delta \in ]0, \pi[$ tel que $|f(y) - f(y')| \leqslant \varepsilon$ dès que $|y - y'| \leqslant \delta$ ($f$ est uniformément continue). On sépare $|t| \leqslant \delta$ et $\delta \leqslant |t| \leqslant \pi$ : 
    $$|u_{r}(x) - f(x)| \leqslant \varepsilon\cdot\frac{1}{2\pi}\int_{-\pi}^{\pi} P_{r} + 2\lVert f \rVert_{\infty}\sup_{\delta \leqslant |t| \leqslant \pi} P_{r}(t) = \varepsilon + 2\lVert f \rVert_{\infty}\sup_{\delta \leqslant |t| \leqslant \pi} P_{r}(t),$$
     majoration indépendante de $x$, inférieure à $2\varepsilon$ pour $r$ assez proche de $1$. 
    $$\boxed{\lVert u_{r} - f \rVert_{\infty} \xrightarrow[r \to 1^{-}]{} 0}$$

    **5.** Posons $d_{0} = c_{0}(f)$ et, pour $n \geqslant 1$, $d_{n} = c_{n}(f)\mathrm{e}^{\mathrm{i} nx} + c_{-n}(f)\mathrm{e}^{-\mathrm{i} nx}$. Les sommes partielles de $\sum d_{n}$ sont les $S_{N}(f)(x)$, qui convergent par hypothèse vers une limite $\ell$. La série entière $\sum d_{n}r^{n}$, dont la somme est $u_{r}(x)$, converge donc en $r = 1$, et le théorème d'Abel radial (théorème 5 du chapitre 9) donne $u_{r}(x) \to \ell$ quand $r \to 1^{-}$. Or $u_{r}(x) \to f(x)$ par la question 4. 
    $$\boxed{\lim_{N \to +\infty} S_{N}(f)(x) = f(x)}$$
     *Commentaire.* On retrouve, par un autre procédé de sommation, la conséquence du théorème de Fejér signalée dans le cours : si la série de Fourier d'une fonction continue converge en un point, c'est vers la valeur de la fonction. Le noyau de Poisson est le point de départ de la résolution du problème de Dirichlet pour le disque : $(r, x) \mapsto u_{r}(x)$ est la fonction harmonique dans le disque unité qui prolonge $f$ au bord, résultat qui dépasse le programme.

