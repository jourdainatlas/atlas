  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients de Fourier, égalité de Parseval, théorème de Dirichlet, sommes de séries]
  noeuds: [fo-coefficients, fo-parseval, fo-dirichlet, as-series]
  notions: []
  source: "BibM@th, Séries de Fourier, exercice 6 ; Exercices séries de Fourier (Excellence Maths), exercice 8 (CCP)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $f \in \mathcal{D}_{2\pi}$ telle que $f(x) = \mathrm{e}^{x}$ pour $x \in [-\pi, \pi[$.

    **1.** Calculer les coefficients $c_{n}(f)$.

    **2.** En appliquant le théorème de Dirichlet en $0$ et en $\pi$, calculer 
    $$\sum_{n = -\infty}^{+\infty} \frac{1}{1 + n^{2}} \qquad\text{et}\qquad \sum_{n = -\infty}^{+\infty} \frac{(-1)^{n}}{1 + n^{2}}.$$

    **3.** Vérifier la première valeur à l'aide de l'égalité de Parseval.
  corrige: |
    On calcule les coefficients par une primitive exponentielle, puis on applique le théorème de Dirichlet à cette fonction de classe $\mathcal{C}^{1}$ par morceaux, discontinue en $\pi$.

    **1.** Pour $n \in \mathbb{Z}$, comme $1 - \mathrm{i} n \neq 0$ et $\mathrm{e}^{\pm\mathrm{i} n\pi} = (-1)^{n}$, 
    $$c_{n}(f) = \frac{1}{2\pi}\int_{-\pi}^{\pi} \mathrm{e}^{(1 - \mathrm{i} n)x}\,\mathrm{d} x = \frac{1}{2\pi}\cdot\frac{\mathrm{e}^{(1 - \mathrm{i} n)\pi} - \mathrm{e}^{-(1 - \mathrm{i} n)\pi}}{1 - \mathrm{i} n} = \frac{(-1)^{n}(\mathrm{e}^{\pi} - \mathrm{e}^{-\pi})}{2\pi(1 - \mathrm{i} n)}, \qquad \boxed{c_{n}(f) = \frac{(-1)^{n}\operatorname{sh}\pi}{\pi(1 - \mathrm{i} n)}}$$

    **2.** On regroupe les termes d'indices $n$ et $-n$ des sommes symétriques : $\frac{1}{1 - \mathrm{i} n} + \frac{1}{1 + \mathrm{i} n} = \frac{2}{1 + n^{2}}$, si bien que 
    $$S_{N}(f)(x) = \frac{\operatorname{sh}\pi}{\pi}\sum_{n = -N}^{N} \frac{(-1)^{n}(1 + \mathrm{i} n)}{1 + n^{2}}\mathrm{e}^{\mathrm{i} nx}.$$
     En $x = 0$, où $f$ est continue et vaut $1$, les parties en $\mathrm{i} n$ se compensent deux à deux, et le théorème 4 donne $1 = \frac{\operatorname{sh}\pi}{\pi}\sum_{n \in \mathbb{Z}} \frac{(-1)^{n}}{1 + n^{2}}$. En $x = \pi$, $\mathrm{e}^{\mathrm{i} n\pi} = (-1)^{n}$ et $f$ saute de $\mathrm{e}^{\pi}$ à $\mathrm{e}^{-\pi}$ : la série converge vers la demi-somme $\operatorname{ch}\pi$. D'où 
    $$\boxed{\sum_{n = -\infty}^{+\infty} \frac{(-1)^{n}}{1 + n^{2}} = \frac{\pi}{\operatorname{sh}\pi}, \qquad \sum_{n = -\infty}^{+\infty} \frac{1}{1 + n^{2}} = \frac{\pi\operatorname{ch}\pi}{\operatorname{sh}\pi} = \pi\coth\pi}$$

    **3.** L'égalité de Parseval donne 
    $$\frac{\operatorname{sh}^{2}\pi}{\pi^{2}}\sum_{n \in \mathbb{Z}} \frac{1}{1 + n^{2}} = \frac{1}{2\pi}\int_{-\pi}^{\pi} \mathrm{e}^{2x}\,\mathrm{d} x = \frac{\operatorname{sh}(2\pi)}{2\pi} = \frac{\operatorname{sh}\pi\operatorname{ch}\pi}{\pi},$$
     et l'on retrouve $\sum \frac{1}{1 + n^{2}} = \pi\coth\pi \approx 3{,}1533$, valeur contrôlée numériquement.

    *Piège.* Au point $\pi$, la valeur prise par $f$ est $\mathrm{e}^{-\pi}$ avec la convention de l'énoncé, mais la série converge vers $\operatorname{ch}\pi$ : écrire $f(\pi)$ à la place de la demi-somme des limites donnerait un résultat faux. Il faut aussi prendre garde à ne sommer que des sommes symétriques : la série $\sum_{n \geqslant 0} \frac{(-1)^{n}\mathrm{i} n}{1 + n^{2}}$ ne converge pas absolument, et seule la compensation des indices $n$ et $-n$ la fait disparaître.
- id: "mp-11-05"
  feuille: "f-mp-11"
  numero: 5
  partie: "Coefficients de Fourier"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [coefficients de Fourier, convergence uniforme, sommes de séries]
  noeuds: [fo-coefficients, fc-uniforme, as-series]
  notions: [convergence-uniforme]
  source: "Exercices séries de Fourier (Excellence Maths), exercice 10 (CCP)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $\alpha > 0$ et $f \in \mathcal{C}_{2\pi}$ telle que $f(x) = \operatorname{ch}(\alpha x)$ pour $x \in [-\pi, \pi]$.

    **1.** Calculer les coefficients de Fourier de $f$, et justifier que sa série de Fourier converge normalement vers $f$.

    **2.** En évaluant en $\pi$, montrer que 
    $$\pi\alpha\coth(\pi\alpha) = 1 + 2\alpha^{2}\sum_{n = 1}^{+\infty} \frac{1}{\alpha^{2} + n^{2}}.$$

    **3.** Montrer que $\displaystyle \alpha \mapsto \sum_{n = 1}^{+\infty} \frac{1}{\alpha^{2} + n^{2}}$ est continue sur $\mathbb{R}_{+}$, et en déduire, en faisant tendre $\alpha$ vers $0$, une nouvelle preuve de $\zeta(2) = \frac{\pi^{2}}{6}$.
  corrige: |
    La fonction est paire et continue (car $\operatorname{ch}(-\alpha\pi) = \operatorname{ch}(\alpha\pi)$ assure le raccord), de classe $\mathcal{C}^{1}$ par morceaux ; tout repose donc sur le théorème 5.

    **1.** Deux intégrations par parties, ou le passage à $\operatorname{ch}(\alpha x)\cos(nx) = \Re\big(\operatorname{ch}(\alpha x)\mathrm{e}^{\mathrm{i} nx}\big)$, donnent 
    $$\boxed{a_{n}(f) = \frac{2}{\pi}\int_{0}^{\pi} \operatorname{ch}(\alpha x)\cos(nx)\,\mathrm{d} x = \frac{2(-1)^{n}\alpha\operatorname{sh}(\pi\alpha)}{\pi(\alpha^{2} + n^{2})}}, \qquad b_{n}(f) = 0.$$
     Plus précisément, si $I = \int_{0}^{\pi} \operatorname{ch}(\alpha x)\cos(nx)\,\mathrm{d} x$, deux intégrations par parties successives donnent $I = \frac{(-1)^{n}\alpha\operatorname{sh}(\alpha\pi)}{n^{2}} - \frac{\alpha^{2}}{n^{2}}I$ pour $n \neq 0$, d'où la formule, qui reste vraie pour $n = 0$. Comme $f$ est continue et de classe $\mathcal{C}^{1}$ par morceaux, le théorème 5 assure la convergence normale de la série de Fourier vers $f$ ; on le voit aussi directement sur la majoration $|a_{n}| \leqslant \frac{2\alpha\operatorname{sh}(\pi\alpha)}{\pi n^{2}}$.

    **2.** En $x = \pi$, $\cos(n\pi) = (-1)^{n}$ compense le signe $(-1)^{n}$ : 
    $$\operatorname{ch}(\pi\alpha) = \frac{\operatorname{sh}(\pi\alpha)}{\pi\alpha} + \sum_{n = 1}^{+\infty} \frac{2\alpha\operatorname{sh}(\pi\alpha)}{\pi(\alpha^{2} + n^{2})},$$
     et l'on multiplie par $\frac{\pi\alpha}{\operatorname{sh}(\pi\alpha)}$ : 
    $$\boxed{\pi\alpha\coth(\pi\alpha) = 1 + 2\alpha^{2}\sum_{n = 1}^{+\infty} \frac{1}{\alpha^{2} + n^{2}}}$$

    **3.** Pour $\alpha \geqslant 0$, $0 < \frac{1}{\alpha^{2} + n^{2}} \leqslant \frac{1}{n^{2}}$ : la série de fonctions converge normalement sur $\mathbb{R}_{+}$, et ses termes sont continus, donc sa somme $\Phi$ est continue sur $\mathbb{R}_{+}$ (chapitre 8), avec $\Phi(0) = \zeta(2)$. Pour $\alpha > 0$, la question 2 donne $\Phi(\alpha) = \frac{\pi\alpha\coth(\pi\alpha) - 1}{2\alpha^{2}}$. Or, au voisinage de $0$, 
    $$u\coth u = u\frac{\operatorname{ch} u}{\operatorname{sh} u} = \frac{1 + \frac{u^{2}}{2} + o(u^{2})}{1 + \frac{u^{2}}{6} + o(u^{2})} = 1 + \frac{u^{2}}{3} + o(u^{2}),$$
     d'où, avec $u = \pi\alpha$, 
    $$\Phi(\alpha) = \frac{\pi^{2}\alpha^{2}/3 + o(\alpha^{2})}{2\alpha^{2}} \xrightarrow[\alpha \to 0]{} \frac{\pi^{2}}{6}, \qquad\text{donc}\qquad \boxed{\zeta(2) = \Phi(0) = \frac{\pi^{2}}{6}}$$

    *Piège.* La continuité en $0$ de $\Phi$ est indispensable : sans elle, on obtiendrait seulement la limite de $\Phi$ en $0^{+}$, qui pourrait différer de $\Phi(0) = \zeta(2)$. C'est un exemple du théorème de la double limite du chapitre 8 : on échange $\lim_{\alpha \to 0}$ et $\sum_{n}$.
- id: "mp-11-06"
  feuille: "f-mp-11"
  numero: 6
  partie: "Coefficients de Fourier"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients de Fourier, égalité de Parseval, théorème de Dirichlet, sommes de séries]
  noeuds: [fo-coefficients, fo-parseval, fo-dirichlet, as-series]
  notions: []
  source: "BibM@th, Séries de Fourier, exercice 4"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $f \in \mathcal{D}_{2\pi}$ telle que $f(x) = x^{2}$ pour $x \in [0, 2\pi[$. Développer $f$ en série de Fourier, puis en déduire, d'une part à l'aide du théorème de Dirichlet, d'autre part à l'aide de l'égalité de Parseval, les valeurs de 
    $$\zeta(2) = \sum_{n = 1}^{+\infty} \frac{1}{n^{2}} \qquad\text{et}\qquad \zeta(4) = \sum_{n = 1}^{+\infty} \frac{1}{n^{4}}.$$
  corrige: |
    La fonction $f$ est de classe $\mathcal{C}^{1}$ par morceaux, mais discontinue en $0$ : on applique le théorème de Dirichlet pour $\zeta(2)$ et l'égalité de Parseval pour $\zeta(4)$.

    **Coefficients.** On a $a_{0} = \frac{1}{\pi}\int_{0}^{2\pi} x^{2}\,\mathrm{d} x = \frac{8\pi^{2}}{3}$ et, pour $n \geqslant 1$, deux intégrations par parties donnent 
    $$\boxed{a_{n} = \frac{1}{\pi}\int_{0}^{2\pi} x^{2}\cos(nx)\,\mathrm{d} x = \frac{4}{n^{2}}, \qquad b_{n} = \frac{1}{\pi}\int_{0}^{2\pi} x^{2}\sin(nx)\,\mathrm{d} x = -\frac{4\pi}{n}}$$
     Par exemple, pour $b_{n}$ : $\int_{0}^{2\pi} x^{2}\sin(nx)\,\mathrm{d} x = \Big[-\frac{x^{2}\cos(nx)}{n}\Big]_{0}^{2\pi} + \frac{2}{n}\int_{0}^{2\pi} x\cos(nx)\,\mathrm{d} x = -\frac{4\pi^{2}}{n} + 0$.

    **Dirichlet en $0$.** La série converge vers la demi-somme $\frac{0 + 4\pi^{2}}{2} = 2\pi^{2}$ des limites à droite et à gauche, les sinus étant nuls : 
    $$2\pi^{2} = \frac{4\pi^{2}}{3} + 4\sum_{n = 1}^{+\infty} \frac{1}{n^{2}}, \qquad \boxed{\zeta(2) = \frac{\pi^{2}}{6}}$$

    **Parseval.** Sous forme réelle, $\frac{1}{\pi}\int_{0}^{2\pi} |f|^{2} = \frac{a_{0}^{2}}{2} + \sum_{n \geqslant 1} (a_{n}^{2} + b_{n}^{2})$, soit 
    $$\frac{32\pi^{4}}{5} = \frac{32\pi^{4}}{9} + 16\zeta(4) + 16\pi^{2}\zeta(2) = \frac{32\pi^{4}}{9} + 16\zeta(4) + \frac{8\pi^{4}}{3},$$
     d'où $16\zeta(4) = \pi^{4}\big(\frac{32}{5} - \frac{32}{9} - \frac{8}{3}\big) = \frac{8\pi^{4}}{45}$ : 
    $$\boxed{\zeta(4) = \frac{\pi^{4}}{90}}$$

    *Piège.* La fonction n'est ni paire ni impaire, contrairement à $x \mapsto x^{2}$ prolongée depuis $[-\pi, \pi]$ : les deux familles $(a_{n})$ et $(b_{n})$ sont non nulles, et la valeur en $0$ n'est pas $f(0) = 0$. L'égalité de Parseval utilise alors $\zeta(2)$, qu'il faut avoir obtenu avant.
- id: "mp-11-07"
  feuille: "f-mp-11"
  numero: 7
  partie: "Coefficients de Fourier"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients de Fourier, sommes de séries]
  noeuds: [fo-coefficients, as-series]
  notions: []
  source: "BibM@th, Séries de Fourier, exercice 7"
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Soit $f$ la fonction $2$-périodique telle que $f(x) = x - x^{3}$ pour $x \in ]-1, 1]$.

    **1.** Vérifier que $f$ est continue et de classe $\mathcal{C}^{1}$ par morceaux, et calculer ses coefficients de Fourier.

    **2.** En déduire la valeur de $\displaystyle \sum_{p = 0}^{+\infty} \frac{(-1)^{p}}{(2p + 1)^{3}}$.
  corrige: |
    On travaille avec la période $T = 2$, donc $\omega = \pi$, et l'on exploite l'imparité de $f$.

    **1.** Sur $]-1, 1]$, $f$ est polynomiale, et $f(1) = 0 = \lim_{x \to -1^{+}} (x - x^{3})$ : le raccord se fait sans saut, donc $f$ est continue sur $\mathbb{R}$. Mieux, $f'(x) = 1 - 3x^{2}$ tend vers $-2$ en $1^{-}$ comme en $-1^{+}$ : $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, et seule sa dérivée seconde $-6x$ saute, de $-6$ à $6$, aux entiers impairs. Elle est impaire, donc $a_{n} = 0$ et, après trois intégrations par parties, 
    $$b_{n} = 2\int_{0}^{1} (x - x^{3})\sin(n\pi x)\,\mathrm{d} x, \qquad \boxed{b_{n} = \frac{12(-1)^{n + 1}}{\pi^{3}n^{3}}}$$
     La décroissance en $\frac{1}{n^{3}}$ reflète cette régularité : un saut de $f''$ produit des coefficients en $\frac{1}{n^{3}}$, comme un saut de $f$ en produit en $\frac{1}{n}$ (créneau) et un saut de $f'$ en $\frac{1}{n^{2}}$ (fonction $|x|$).

    **2.** Le théorème 5 donne $f(x) = \frac{12}{\pi^{3}}\sum_{n \geqslant 1} \frac{(-1)^{n + 1}}{n^{3}}\sin(n\pi x)$ pour tout réel $x$. En $x = \frac{1}{2}$, $\sin\frac{n\pi}{2}$ est nul pour $n$ pair et vaut $(-1)^{p}$ pour $n = 2p + 1$, tandis que $(-1)^{n + 1} = 1$ : 
    $$\frac{3}{8} = \frac{12}{\pi^{3}}\sum_{p = 0}^{+\infty} \frac{(-1)^{p}}{(2p + 1)^{3}}, \qquad \boxed{\sum_{p = 0}^{+\infty} \frac{(-1)^{p}}{(2p + 1)^{3}} = \frac{\pi^{3}}{32}}$$
     Cette valeur sera retrouvée à l'exercice 12 avec une autre fonction.
- id: "mp-11-08"
  feuille: "f-mp-11"
  numero: 8
  partie: "Coefficients de Fourier"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients]
  notions: []
  source: "Feuille d'exercices Séries de Fourier (Polytech Montpellier), exercice 3"
  page_enonce: 2
  page_corrige: 6
  enonce: |
    *Symétries et coefficients.* Soit $f \in \mathcal{D}_{2\pi}$.

    **1.** Comparer $c_{n}(f)$ et $c_{-n}(f)$ lorsque $f$ est paire, puis lorsqu'elle est impaire.

    **2.** Montrer que, si $f(x + \pi) = f(x)$ pour tout $x$, les coefficients d'indice impair sont nuls, et que, si $f(x + \pi) = -f(x)$ pour tout $x$, les coefficients d'indice pair sont nuls.

    **3.** On suppose $f$ continue et $a_{n}(f) = 0$ pour tout $n \in \mathbb{N}$. Montrer que $f$ est impaire.
  corrige: |
    Toutes les questions se ramènent à un changement de variable dans la formule intégrale de $c_{n}$, ou à la proposition 2 (iv).

    **1.** Le changement de variable $t \mapsto -t$ sur $[-\pi, \pi]$ donne $c_{-n}(f) = c_{n}\big(t \mapsto f(-t)\big)$. Ainsi 
    $$\boxed{f \text{ paire} \Rightarrow c_{-n}(f) = c_{n}(f), \qquad f \text{ impaire} \Rightarrow c_{-n}(f) = -c_{n}(f)}$$

    **2.** Par la proposition 2 (iv) avec $a = \pi$, la fonction $g : x \mapsto f(x + \pi)$ vérifie $c_{n}(g) = (-1)^{n}c_{n}(f)$. Si $g = f$, alors $\big(1 - (-1)^{n}\big)c_{n}(f) = 0$, et les coefficients d'indice impair sont nuls. Si $g = -f$, alors $\big(1 + (-1)^{n}\big)c_{n}(f) = 0$, et ce sont les coefficients d'indice pair qui s'annulent.

    **3.** Soit $h : x \mapsto f(x) + f(-x)$, qui est continue. D'après la question 1, $c_{n}(h) = c_{n}(f) + c_{-n}(f)$, ce qui vaut $a_{|n|}(f)$ pour $n \neq 0$, et $2c_{0}(f) = a_{0}(f)$ pour $n = 0$. Tous les coefficients de $h$ sont nuls, donc $h = 0$ par l'unicité (proposition 6) : $\boxed{f \text{ est impaire}}$

    *Piège.* La continuité de $f$ est essentielle à la question 3 : pour $f \in \mathcal{D}_{2\pi}$, l'unicité ne donne l'égalité $h = 0$ qu'aux points de continuité, et une fonction nulle sauf en $0$, où elle vaut $1$, a tous ses coefficients nuls sans être impaire.
- id: "mp-11-09"
  feuille: "f-mp-11"
  numero: 9
  partie: "Coefficients de Fourier"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coefficients de Fourier, convergence uniforme, sommes de séries]
  noeuds: [fo-coefficients, fc-uniforme, as-series]
  notions: [convergence-uniforme]
  source: "Exercices séries de Fourier (Excellence Maths), exercices 12 et 13"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    *Produit de convolution.* Pour $f$, $g \in \mathcal{C}_{2\pi}$, on pose 
    $$(f \ast g)(x) = \frac{1}{2\pi}\int_{0}^{2\pi} f(x - t)g(t)\,\mathrm{d} t.$$

    **1.** Montrer que $f \ast g \in \mathcal{C}_{2\pi}$, et que $f \ast g = g \ast f$.

    **2.** Montrer que $c_{n}(f \ast g) = c_{n}(f)c_{n}(g)$ pour tout $n \in \mathbb{Z}$.

    **3.** Exprimer $S_{N}(f)$ et $\sigma_{N}(f)$ comme des produits de convolution. En déduire que $f \ast g$ est la somme de sa série de Fourier, et que cette série converge normalement.

    **4.** Existe-t-il $u \in \mathcal{C}_{2\pi}$ telle que $u \ast f = f$ pour toute $f \in \mathcal{C}_{2\pi}$ ?
  corrige: |
    Le point délicat est la question 2, où l'on doit échanger deux intégrales. Le programme ne dispose pas des intégrales doubles : on contourne la difficulté en approchant $f$ par des polynômes trigonométriques grâce au théorème de Fejér.

    **1.** La fonction $f$, continue et périodique, est uniformément continue sur $\mathbb{R}$ (théorème de Heine sur un segment de longueur $4\pi$, chapitre 5). Pour $\varepsilon > 0$, soit $\eta > 0$ tel que $|x - y| \leqslant \eta$ entraîne $|f(x) - f(y)| \leqslant \varepsilon$ ; alors 
    $$|(f \ast g)(x) - (f \ast g)(y)| \leqslant \frac{1}{2\pi}\int_{0}^{2\pi} |f(x - t) - f(y - t)|\,|g(t)|\,\mathrm{d} t \leqslant \varepsilon\lVert g \rVert_{\infty}.$$
     La périodicité de $f \ast g$ vient de celle de $f$. Le changement de variable $s = x - t$, puis la proposition 1, donnent 
    $$(f \ast g)(x) = \frac{1}{2\pi}\int_{x - 2\pi}^{x} f(s)g(x - s)\,\mathrm{d} s = \frac{1}{2\pi}\int_{0}^{2\pi} g(x - s)f(s)\,\mathrm{d} s = (g \ast f)(x).$$

    **2.** *Cas d'une exponentielle.* Pour $f = e_{m}$, $(e_{m} \ast g)(x) = \frac{1}{2\pi}\int_{0}^{2\pi} \mathrm{e}^{\mathrm{i} m(x - t)}g(t)\,\mathrm{d} t = c_{m}(g)\mathrm{e}^{\mathrm{i} mx}$, donc $e_{m} \ast g = c_{m}(g)e_{m}$, et $c_{n}(e_{m} \ast g) = \delta_{mn}c_{m}(g) = c_{n}(e_{m})c_{n}(g)$. Par linéarité, la formule vaut pour tout polynôme trigonométrique $P$.

    *Cas général.* Par le théorème de Fejér (théorème 2), $P_{N} = \sigma_{N}(f)$ converge uniformément vers $f$. Or $\lVert P_{N} \ast g - f \ast g \rVert_{\infty} \leqslant \lVert P_{N} - f \rVert_{\infty}\lVert g \rVert_{\infty}$, et $|c_{n}(u)| \leqslant \lVert u \rVert_{\infty}$ (proposition 2 (i)) ; on peut donc passer à la limite dans $c_{n}(P_{N} \ast g) = c_{n}(P_{N})c_{n}(g)$ : 
    $$\boxed{c_{n}(f \ast g) = c_{n}(f)c_{n}(g)}$$

    **3.** La proposition 5 s'écrit exactement 
    $$\boxed{S_{N}(f) = f \ast D_{N}, \qquad \sigma_{N}(f) = f \ast K_{N}}$$
     les noyaux étant continus. Par l'inégalité $|uv| \leqslant \frac{1}{2}(|u|^{2} + |v|^{2})$ et l'inégalité de Bessel pour $f$ et $g$, la famille $\big(c_{n}(f)c_{n}(g)\big)$ est sommable : la série de Fourier de $f \ast g$ converge normalement sur $\mathbb{R}$ vers une fonction continue $S$. L'intégration terme à terme (théorème 3 du chapitre 8) montre que $c_{n}(S) = c_{n}(f)c_{n}(g) = c_{n}(f \ast g)$, et l'unicité (proposition 6) donne $S = f \ast g$.

    **4.** Si une telle $u$ existait, le choix $f = e_{n}$ donnerait $c_{n}(u)e_{n} = e_{n}$, soit $c_{n}(u) = 1$ pour tout $n \in \mathbb{Z}$, ce qui contredit le lemme de Riemann-Lebesgue (théorème 1). $\boxed{\text{il n'existe pas d'élément neutre}}$

    *Commentaire.* Les noyaux $K_{N}$ jouent le rôle d'une « unité approchée » : $f \ast K_{N}$ tend vers $f$ sans qu'aucun noyau ne soit exactement neutre. C'est la même idée qui gouverne le noyau de Poisson de l'exercice 34.
- id: "mp-11-10"
  feuille: "f-mp-11"
  numero: 10
  partie: "Coefficients de Fourier"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients de Fourier]
  noeuds: [fo-coefficients]
  notions: []
  source: "BibM@th, Séries de Fourier, exercice 9"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Soit $a > 0$.

    **1.** Vérifier que, pour tout réel $x$, 
    $$\frac{1}{\cos x + \operatorname{ch} a} = \frac{1}{\operatorname{sh} a}\Big(\frac{\mathrm{e}^{a}}{\mathrm{e}^{a} + \mathrm{e}^{\mathrm{i} x}} + \frac{\mathrm{e}^{a}}{\mathrm{e}^{a} + \mathrm{e}^{-\mathrm{i} x}} - 1\Big).$$

    **2.** Développer $\frac{1}{\mathrm{e}^{a} + z}$ en série entière de $z$, et en déduire, sans calculer d'intégrale, la série de Fourier de $g : x \mapsto \frac{1}{\cos x + \operatorname{ch} a}$.

    **3.** En déduire la valeur de $\displaystyle \int_{0}^{2\pi} \frac{\cos(nx)}{\cos x + \operatorname{ch} a}\,\mathrm{d} x$ pour $n \in \mathbb{N}$.
  corrige: |
    On obtient la série de Fourier sans intégrer, en reconnaissant des séries géométriques dont la convergence normale justifie tout.

    **1.** On réduit au même dénominateur, avec $(\mathrm{e}^{a} + \mathrm{e}^{\mathrm{i} x})(\mathrm{e}^{a} + \mathrm{e}^{-\mathrm{i} x}) = 2\mathrm{e}^{a}(\operatorname{ch} a + \cos x)$ : 
    $$\frac{\mathrm{e}^{a}}{\mathrm{e}^{a} + \mathrm{e}^{\mathrm{i} x}} + \frac{\mathrm{e}^{a}}{\mathrm{e}^{a} + \mathrm{e}^{-\mathrm{i} x}} - 1 = \frac{\mathrm{e}^{a}(2\mathrm{e}^{a} + 2\cos x) - 2\mathrm{e}^{a}(\operatorname{ch} a + \cos x)}{2\mathrm{e}^{a}(\operatorname{ch} a + \cos x)} = \frac{\mathrm{e}^{a} - \operatorname{ch} a}{\operatorname{ch} a + \cos x} = \frac{\operatorname{sh} a}{\operatorname{ch} a + \cos x},$$
     ce qui est l'identité annoncée. On note que $\cos x + \operatorname{ch} a \geqslant \operatorname{ch} a - 1 > 0$.

    **2.** Pour $|z| < \mathrm{e}^{a}$, $\frac{1}{\mathrm{e}^{a} + z} = \frac{\mathrm{e}^{-a}}{1 + z\mathrm{e}^{-a}} = \sum_{n = 0}^{+\infty} (-1)^{n}\mathrm{e}^{-(n + 1)a}z^{n}$. Avec $z = \mathrm{e}^{\pm\mathrm{i} x}$, de module $1 < \mathrm{e}^{a}$, 
    $$\frac{\mathrm{e}^{a}}{\mathrm{e}^{a} + \mathrm{e}^{\pm\mathrm{i} x}} = \sum_{n = 0}^{+\infty} (-1)^{n}\mathrm{e}^{-na}\mathrm{e}^{\pm\mathrm{i} nx}, \qquad\text{d'où}\qquad \boxed{\frac{1}{\cos x + \operatorname{ch} a} = \frac{1}{\operatorname{sh} a}\Big(1 + 2\sum_{n = 1}^{+\infty} (-1)^{n}\mathrm{e}^{-na}\cos(nx)\Big)}$$
     les deux termes d'indice $0$ et le $-1$ donnant $1$. La série converge normalement sur $\mathbb{R}$, puisque $\sum \mathrm{e}^{-na}$ converge ; on peut donc intégrer terme à terme dans la formule des coefficients (théorème 3 du chapitre 8), et cette série est la série de Fourier de $g$ : $a_{0}(g) = \frac{2}{\operatorname{sh} a}$ et $a_{n}(g) = \frac{2(-1)^{n}\mathrm{e}^{-na}}{\operatorname{sh} a}$.

    **3.** Par définition de $a_{n}(g)$, l'intégrale cherchée vaut $\pi a_{n}(g)$, soit, y compris pour $n = 0$, 
    $$\boxed{\int_{0}^{2\pi} \frac{\cos(nx)}{\cos x + \operatorname{ch} a}\,\mathrm{d} x = \frac{2\pi(-1)^{n}\mathrm{e}^{-na}}{\operatorname{sh} a}}$$
     Pour $a = 0{,}7$ et $n = 0, \dots, 3$, les valeurs ont été contrôlées par intégration numérique.

    *Piège.* L'argument « cette série converge vers $g$, donc c'est sa série de Fourier » n'est pas automatique : il faut une convergence qui autorise l'intégration terme à terme. Ici la convergence normale y suffit ; une simple convergence ponctuelle ne suffirait pas.
- id: "mp-11-11"
  feuille: "f-mp-11"
  numero: 11
  partie: "Bessel et Parseval"
  etoiles: 1
  types: [Calcul]
  mots_cles: [Bessel et Parseval, égalité de Parseval, sommes de séries]
  noeuds: [fo-parseval, fo-fejer, as-series]
  notions: [famille-orthonormee]
  source: "Feuille d'exercices Séries de Fourier (Polytech Montpellier), exercice 7 ; BibM@th, Séries de Fourier, exercice 5 ; Séries de Fourier (agrégation interne), exercice 2"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    On rappelle que la fonction $f \in \mathcal{C}_{2\pi}$ égale à $|x|$ sur $[-\pi, \pi]$ a pour série de Fourier 
    $$\frac{\pi}{2} - \frac{4}{\pi}\sum_{k = 0}^{+\infty} \frac{\cos\big((2k + 1)x\big)}{(2k + 1)^{2}}$$
     (cours, section 11.5). À l'aide de l'égalité de Parseval, calculer $\displaystyle \sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{4}}$, puis retrouver $\zeta(4)$.
  corrige: |
    On lit sur la série rappelée les coefficients $a_{0} = \pi$, $a_{2k + 1} = -\frac{4}{\pi(2k + 1)^{2}}$, les autres étant nuls, puis on applique l'égalité de Parseval sous forme réelle.

    **Parseval.** On a $\frac{1}{\pi}\int_{-\pi}^{\pi} x^{2}\,\mathrm{d} x = \frac{2\pi^{2}}{3}$, donc 
    $$\frac{2\pi^{2}}{3} = \frac{a_{0}^{2}}{2} + \sum_{n \geqslant 1} a_{n}^{2} = \frac{\pi^{2}}{2} + \frac{16}{\pi^{2}}\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{4}}, \qquad \boxed{\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{4}} = \frac{\pi^{4}}{96}}$$

    **Retour à $\zeta(4)$.** Les termes d'indice pair forment $\sum \frac{1}{(2k)^{4}} = \frac{\zeta(4)}{16}$, donc $\zeta(4) = \frac{\pi^{4}}{96} + \frac{\zeta(4)}{16}$, et 
    $$\boxed{\zeta(4) = \frac{16}{15}\cdot\frac{\pi^{4}}{96} = \frac{\pi^{4}}{90}}$$

    *Piège.* Dans la forme réelle de l'égalité de Parseval, le terme constant est $\frac{a_{0}^{2}}{2}$ si l'on écrit $\frac{1}{\pi}\int |f|^{2}$, et $\frac{a_{0}^{2}}{4}$ si l'on écrit $\frac{1}{2\pi}\int |f|^{2}$ comme dans le théorème 3 ; mélanger les deux normalisations est la source d'erreur la plus fréquente.
- id: "mp-11-12"
  feuille: "f-mp-11"
  numero: 12
  partie: "Bessel et Parseval"
  etoiles: 2
  types: [Calcul]
  mots_cles: [Bessel et Parseval, sommes de séries]
  noeuds: [fo-parseval, fo-fejer, as-series]
  notions: [famille-orthonormee]
  source: "Séries de Fourier (agrégation interne), exercice 3"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    Soit $f \in \mathcal{C}_{2\pi}$ impaire telle que $f(x) = x(\pi - x)$ pour $x \in [0, \pi]$.

    **1.** Vérifier que $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$, mais pas de classe $\mathcal{C}^{2}$, et calculer ses coefficients de Fourier. La vitesse de décroissance obtenue est-elle conforme à la proposition 7 du cours ?

    **2.** En déduire les valeurs de $\displaystyle \sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{6}}$ et de $\zeta(6)$.

    **3.** Retrouver la somme de l'exercice 7 en évaluant la série de Fourier en $\frac{\pi}{2}$.
  corrige: |
    La fonction est construite pour que ses coefficients décroissent en $\frac{1}{n^{3}}$, ce qui donne accès, par Parseval, à une somme d'inverses de puissances sixièmes.

    **1.** *Régularité.* Pour $x \in [-\pi, 0]$, $f(x) = -f(-x) = x(\pi + x)$. En $0$, les dérivées à gauche et à droite valent toutes deux $\pi$ ; en $\pi$, la dérivée à gauche de $x(\pi - x)$ vaut $-\pi$, et, par périodicité, la dérivée à droite est celle de $x(\pi + x)$ en $-\pi$, soit $-\pi$ aussi. Ainsi $f$ est de classe $\mathcal{C}^{1}$ sur $\mathbb{R}$. Mais $f''$ vaut $-2$ sur $]0, \pi[$ et $2$ sur $]-\pi, 0[$ : $f$ n'est pas de classe $\mathcal{C}^{2}$.

    *Coefficients.* La fonction est impaire, donc $a_{n} = 0$, et trois intégrations par parties donnent 
    $$b_{n} = \frac{2}{\pi}\int_{0}^{\pi} x(\pi - x)\sin(nx)\,\mathrm{d} x = \frac{4\big(1 - (-1)^{n}\big)}{\pi n^{3}}, \qquad \boxed{b_{2k + 1} = \frac{8}{\pi(2k + 1)^{3}}, \quad b_{2k} = 0}$$
     *Comparaison.* La proposition 7 (i) avec $k = 1$ garantit seulement $n\,c_{n}(f) \to 0$. On obtient beaucoup mieux, $c_{n}(f) = O\big(\frac{1}{n^{3}}\big)$, ce qui est conforme mais non prévu par la proposition : $f'$ est continue et de classe $\mathcal{C}^{1}$ par morceaux, donc la proposition 3, appliquée deux fois, donne $c_{n}(f) = \frac{c_{n}(f'')}{(\mathrm{i} n)^{2}}$, et $f''$ est un créneau, dont les coefficients sont en $\frac{1}{n}$.

    **2.** On calcule $\frac{1}{\pi}\int_{-\pi}^{\pi} f^{2} = \frac{2}{\pi}\int_{0}^{\pi} x^{2}(\pi - x)^{2}\,\mathrm{d} x = \frac{2}{\pi}\cdot\frac{\pi^{5}}{30} = \frac{\pi^{4}}{15}$, et l'égalité de Parseval donne 
    $$\frac{\pi^{4}}{15} = \frac{64}{\pi^{2}}\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{6}}, \qquad \boxed{\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{6}} = \frac{\pi^{6}}{960}}$$
     Comme pour l'exercice 11, $\zeta(6) = \frac{\pi^{6}}{960} + \frac{\zeta(6)}{64}$, d'où 
    $$\boxed{\zeta(6) = \frac{64}{63}\cdot\frac{\pi^{6}}{960} = \frac{\pi^{6}}{945}}$$

    **3.** Par le théorème 5, la série converge vers $f$ partout. En $\frac{\pi}{2}$, $f\big(\frac{\pi}{2}\big) = \frac{\pi^{2}}{4}$ et $\sin\big((2k + 1)\frac{\pi}{2}\big) = (-1)^{k}$, d'où $\frac{\pi^{2}}{4} = \frac{8}{\pi}\sum \frac{(-1)^{k}}{(2k + 1)^{3}}$, et l'on retrouve la valeur $\frac{\pi^{3}}{32}$ de l'exercice 7. Les deux fonctions sont pourtant différentes : la dérivée seconde de celle de l'exercice 7 est $x \mapsto -6x$, continue sur $]-1, 1[$ et discontinue aux entiers impairs, alors qu'ici $f''$ est un créneau. Obtenir deux fois la même valeur par deux chemins indépendants est un excellent contrôle des calculs.
- id: "mp-11-13"
  feuille: "f-mp-11"
  numero: 13
  partie: "Bessel et Parseval"
  etoiles: 2
  types: [Démonstration]
