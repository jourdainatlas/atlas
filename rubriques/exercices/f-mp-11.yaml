  noeuds: [fo-coefficients, as-series]
  notions: []
  source: "Exercices séries de Fourier (Excellence Maths), exercice 6"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Développer en série de Fourier la fonction $x \mapsto |\sin x|$. En déduire 
    $$\sum_{m = 1}^{+\infty} \frac{1}{4m^{2} - 1} \qquad\text{et}\qquad \sum_{m = 1}^{+\infty} \frac{(-1)^{m}}{4m^{2} - 1},$$
     et vérifier directement la première valeur par télescopage.
  corrige: |
    La fonction $f : x \mapsto |\sin x|$ est paire, continue et de classe $\mathcal{C}^{1}$ par morceaux : le théorème 5 assure la convergence normale de sa série de Fourier vers $f$, et il suffit de calculer les $a_{n}$.

    **Coefficients.** Par la proposition 2 (iii) et $2\sin x\cos(nx) = \sin\big((n + 1)x\big) - \sin\big((n - 1)x\big)$, 
    $$a_{n} = \frac{2}{\pi}\int_{0}^{\pi} \sin x\cos(nx)\,\mathrm{d} x = \frac{1}{\pi}\Big[-\frac{\cos((n + 1)x)}{n + 1} + \frac{\cos((n - 1)x)}{n - 1}\Big]_{0}^{\pi} \qquad (n \neq 1),$$
     ce qui vaut $0$ pour $n$ impair, et $-\frac{4}{\pi(n^{2} - 1)}$ pour $n$ pair ; on vérifie à part que $a_{1} = \frac{1}{\pi}\int_{0}^{\pi} \sin(2x)\,\mathrm{d} x = 0$, et l'on a $a_{0} = \frac{4}{\pi}$. Pour tout réel $x$, 
    $$\boxed{|\sin x| = \frac{2}{\pi} - \frac{4}{\pi}\sum_{m = 1}^{+\infty} \frac{\cos(2mx)}{4m^{2} - 1}}$$
     Le fait que seules les fréquences paires apparaissent traduit la $\pi$-périodicité de $f$ (exercice 8, question 2).

    **Valeurs.** On évalue en $x = 0$, puis en $x = \frac{\pi}{2}$, où $\cos(m\pi) = (-1)^{m}$ : 
    $$0 = \frac{2}{\pi} - \frac{4}{\pi}\sum_{m \geqslant 1} \frac{1}{4m^{2} - 1}, \qquad 1 = \frac{2}{\pi} - \frac{4}{\pi}\sum_{m \geqslant 1} \frac{(-1)^{m}}{4m^{2} - 1}.$$
     Ainsi 
    $$\boxed{\sum_{m = 1}^{+\infty} \frac{1}{4m^{2} - 1} = \frac{1}{2}, \qquad \sum_{m = 1}^{+\infty} \frac{(-1)^{m}}{4m^{2} - 1} = \frac{1}{2} - \frac{\pi}{4}}$$

    **Télescopage.** On a $\frac{1}{4m^{2} - 1} = \frac{1}{2}\Big(\frac{1}{2m - 1} - \frac{1}{2m + 1}\Big)$, donc la somme partielle d'indice $M$ vaut $\frac{1}{2}\Big(1 - \frac{1}{2M + 1}\Big)$, qui tend vers $\frac{1}{2}$. La seconde somme, alternée, n'admet pas de télescopage aussi simple : c'est là que la série de Fourier apporte vraiment quelque chose, en faisant apparaître $\pi$.
- id: "mp-11-04"
  feuille: "f-mp-11"
  numero: 4
