  enonce: |
    *Polynômes de Bernoulli et valeurs de $\zeta(2k)$.* On définit une suite de polynômes $(B_{k})_{k \in \mathbb{N}}$ par $B_{0} = 1$ et, pour $k \geqslant 1$, 
    $$B_{k}' = kB_{k - 1}, \qquad \int_{0}^{1} B_{k}(t)\,\mathrm{d} t = 0.$$

    **1.** Justifier l'existence et l'unicité de la suite $(B_{k})$, et calculer $B_{1}$, $B_{2}$, $B_{3}$.

    **2.** Montrer que $B_{k}(1) = B_{k}(0)$ pour $k \geqslant 2$.

    **3.** Pour $k \geqslant 1$, soit $f_{k}$ la fonction $1$-périodique égale à $B_{k}$ sur $[0, 1[$. Montrer que $c_{0}(f_{k}) = 0$ et, pour $n \neq 0$, 
    $$c_{n}(f_{k}) = \int_{0}^{1} B_{k}(t)\mathrm{e}^{-2\mathrm{i}\pi nt}\,\mathrm{d} t = -\frac{k!}{(2\mathrm{i}\pi n)^{k}}.$$

    **4.** En déduire, pour $k \geqslant 1$, 
    $$\zeta(2k) = \frac{(-1)^{k + 1}(2\pi)^{2k}}{2\,(2k)!}B_{2k}(0),$$
     et retrouver $\zeta(2)$, $\zeta(4)$ et $\zeta(6)$.

    **5.** Soit, pour $x$ réel non nul et $t \in [0, 1]$, $F(x, t) = \frac{x\mathrm{e}^{tx}}{\mathrm{e}^{x} - 1}$. On admet que $x \mapsto F(x, t)$ est développable en série entière au voisinage de $0$, sous la forme $\displaystyle \sum_{k} \frac{A_{k}(t)}{k!}x^{k}$, avec des coefficients $A_{k}$ polynomiaux en $t$, et que l'on peut dériver et intégrer terme à terme par rapport à $t$. Montrer que $A_{k} = B_{k}$, puis que $B_{k}(0) = \beta_{k}$, où les $\beta_{k}$ sont les nombres de Bernoulli de l'exercice 49 de la feuille du chapitre 9.
  corrige: |
    Les polynômes de Bernoulli, prolongés par périodicité, ont des coefficients de Fourier explicites, et le théorème de convergence normale en $0$ donne les valeurs de $\zeta$ aux entiers pairs.

    **1.** *Existence et unicité.* Supposons $B_{k - 1}$ construit. Les primitives de $kB_{k - 1}$ sont les $P + c$, où $P$ en est une et $c \in \mathbb{R}$ ; la condition $\int_{0}^{1} (P + c) = 0$ fixe $c = -\int_{0}^{1} P$ de manière unique. Le calcul donne 
    $$\boxed{B_{1} = X - \frac{1}{2}, \qquad B_{2} = X^{2} - X + \frac{1}{6}, \qquad B_{3} = X^{3} - \frac{3}{2}X^{2} + \frac{1}{2}X}$$
     On trouve de même 
    $$B_{4} = X^{4} - 2X^{3} + X^{2} - \frac{1}{30}, \quad B_{5} = X^{5} - \frac{5}{2}X^{4} + \frac{5}{3}X^{3} - \frac{1}{6}X, \quad B_{6} = X^{6} - 3X^{5} + \frac{5}{2}X^{4} - \frac{1}{2}X^{2} + \frac{1}{42}.$$

    **2.** Pour $k \geqslant 2$, on a $k - 1 \geqslant 1$, donc 
    $$B_{k}(1) - B_{k}(0) = \int_{0}^{1} B_{k}' = k\int_{0}^{1} B_{k - 1} = 0, \qquad \boxed{B_{k}(1) = B_{k}(0) \ (k \geqslant 2)}$$

    **3.** On a $c_{0}(f_{k}) = \int_{0}^{1} B_{k} = 0$. Pour $k = 1$, une intégration par parties donne, pour $n \neq 0$, 
    $$c_{n}(f_{1}) = \int_{0}^{1} \Big(t - \frac{1}{2}\Big)\mathrm{e}^{-2\mathrm{i}\pi nt}\,\mathrm{d} t = \Big[\Big(t - \frac{1}{2}\Big)\frac{\mathrm{e}^{-2\mathrm{i}\pi nt}}{-2\mathrm{i}\pi n}\Big]_{0}^{1} + \frac{1}{2\mathrm{i}\pi n}\int_{0}^{1} \mathrm{e}^{-2\mathrm{i}\pi nt}\,\mathrm{d} t = -\frac{1}{2\mathrm{i}\pi n}.$$
     Pour $k \geqslant 2$, la question 2 montre que $f_{k}$ est continue ; elle est de classe $\mathcal{C}^{1}$ par morceaux, avec $f_{k}' = kf_{k - 1}$ hors de $\mathbb{Z}$. La proposition 3, transposée à la période $1$ (où $\mathrm{i} n$ devient $2\mathrm{i}\pi n$), donne $2\mathrm{i}\pi n\,c_{n}(f_{k}) = k\,c_{n}(f_{k - 1})$, et une récurrence immédiate : 
    $$\boxed{c_{n}(f_{k}) = \frac{k}{2\mathrm{i}\pi n}c_{n}(f_{k - 1}) = -\frac{k!}{(2\mathrm{i}\pi n)^{k}}}$$

    **4.** Pour $k \geqslant 1$, $f_{2k}$ est continue et de classe $\mathcal{C}^{1}$ par morceaux : sa série de Fourier converge normalement vers elle (théorème 5). En $0$, en regroupant $n$ et $-n$, et avec $(2\mathrm{i}\pi n)^{2k} = (-1)^{k}(2\pi n)^{2k}$, 
    $$B_{2k}(0) = -\sum_{n \neq 0} \frac{(2k)!}{(2\mathrm{i}\pi n)^{2k}} = -\frac{2\,(2k)!}{(-1)^{k}(2\pi)^{2k}}\zeta(2k), \qquad \boxed{\zeta(2k) = \frac{(-1)^{k + 1}(2\pi)^{2k}}{2\,(2k)!}B_{2k}(0)}$$
     Avec $B_{2}(0) = \frac{1}{6}$, $B_{4}(0) = -\frac{1}{30}$ et $B_{6}(0) = \frac{1}{42}$ : 
    $$\zeta(2) = \frac{4\pi^{2}}{2 \cdot 2} \cdot \frac{1}{6} = \frac{\pi^{2}}{6}, \qquad \zeta(4) = \frac{16\pi^{4}}{2 \cdot 24} \cdot \frac{1}{30} = \frac{\pi^{4}}{90}, \qquad \zeta(6) = \frac{64\pi^{6}}{2 \cdot 720} \cdot \frac{1}{42} = \frac{\pi^{6}}{945}.$$
     On retrouve les valeurs des exercices 6, 11 et 12. C'est la démonstration de la formule d'Euler, annoncée sans preuve dans le corrigé de l'exercice 49 de la feuille du chapitre 9.

    **5.** *Équation en $t$.* On a $\partial_{t}F(x, t) = xF(x, t)$, et, la dérivation terme à terme en $t$ étant admise, 
    $$\sum_{k \geqslant 0} \frac{A_{k}'(t)}{k!}x^{k} = \sum_{k \geqslant 0} \frac{A_{k}(t)}{k!}x^{k + 1} = \sum_{k \geqslant 1} \frac{kA_{k - 1}(t)}{k!}x^{k}.$$
     Par unicité du développement en série entière (chapitre 9), $A_{0}' = 0$ et $A_{k}' = kA_{k - 1}$ pour $k \geqslant 1$.

    *Normalisation.* Pour $x \neq 0$, $\int_{0}^{1} F(x, t)\,\mathrm{d} t = \frac{x}{\mathrm{e}^{x} - 1}\cdot\frac{\mathrm{e}^{x} - 1}{x} = 1$, et l'intégration terme à terme, admise, donne $\int_{0}^{1} A_{0} = 1$ et $\int_{0}^{1} A_{k} = 0$ pour $k \geqslant 1$. Comme $A_{0}$ est constant, $A_{0} = 1 = B_{0}$. Par la récurrence de la question 1, qui caractérise les $B_{k}$ : 
    $$\boxed{A_{k} = B_{k} \ \text{ pour tout } k}$$
     *Valeur en $0$.* Pour $t = 0$, $F(x, 0) = \frac{x}{\mathrm{e}^{x} - 1} = \sum \frac{\beta_{k}}{k!}x^{k}$, et l'unicité du développement donne 
    $$\boxed{B_{k}(0) = A_{k}(0) = \beta_{k}}$$

    *Commentaire.* La formule de la question 4 s'écrit donc $\zeta(2k) = \frac{(-1)^{k + 1}(2\pi)^{2k}\beta_{2k}}{2\,(2k)!}$ : le développement en série entière de $\frac{x}{\mathrm{e}^{x} - 1}$, calculé au chapitre 9, donne toutes les valeurs $\zeta(2k)$. Comme $\zeta(2k) > 0$, on en déduit au passage que les $\beta_{2k}$ sont de signes alternés. Aux entiers impairs, aucune formule de ce type n'est connue, et l'on ne sait toujours pas si $\zeta(5)$ est irrationnel.
- id: "mp-11-34"
  feuille: "f-mp-11"
