  source: "TD Algèbre 4, feuille 5 (2014-15), exercice 3"
  page_enonce: 1
  page_corrige: 3
  enonce: |
    *(Relations de Newton.)* Soit $A$ un anneau et $n \geqslant 1$. On veut prouver, dans $A[X_{1}, \dots, X_{n}]$, 
    $$\text{(i)} \ \ S_{k} - \Sigma_{1}S_{k - 1} + \cdots + (-1)^{k - 1}\Sigma_{k - 1}S_{1} + (-1)^{k}k\Sigma_{k} = 0 \ \text{ pour } 1 \leqslant k \leqslant n,$$

    $$\text{(ii)} \ \ S_{k} - \Sigma_{1}S_{k - 1} + \cdots + (-1)^{n}\Sigma_{n}S_{k - n} = 0 \ \text{ pour } k \geqslant n.$$

    **1.** On introduit $P = (X - X_{1})\cdots(X - X_{n}) \in A[X_{1}, \dots, X_{n}][X]$. Montrer (ii) en évaluant $X^{k - n}P$ en $X_{1}, \dots, X_{n}$ et en sommant.

    **2.** Montrer que le quotient de la division euclidienne de $X^{k + 1}P'$ par $P$ dans $A[X_{1}, \dots, X_{n}][X]$ est $Q = S_{0}X^{k} + S_{1}X^{k - 1} + \cdots + S_{k}$, et comparer les coefficients de $X^{n}$ dans $X^{k + 1}P'$ et dans $QP$ pour obtenir (i).

    **3.** On pose $P_{0} = X^{7} - X^{5} + X^{3} - X^{2} + X + 1$. Déterminer la somme des puissances cinquièmes des racines complexes de $P_{0}$.
  corrige: |
    **1.** Pour tout $i$, $P(X_{i}) = 0$, donc $X_{i}^{k - n}P(X_{i}) = 0$. Or 
    $$X^{k - n}P = X^{k} - \Sigma_{1}X^{k - 1} + \cdots + (-1)^{n}\Sigma_{n}X^{k - n}$$
     par la proposition 1 du cours. En évaluant en $X_{i}$ et en sommant sur $i$, chaque $X^{j}$ devient $S_{j}$, ce qui donne (ii).

    **2.** On note $P_{i} = \mathop{\displaystyle \prod_{j \neq i}}(X - X_{j})$, de sorte que $P' = P_{1} + \cdots + P_{n}$ et $P = (X - X_{i})P_{i}$. La division de $X^{k + 1}$ par $X - X_{i}$ s'écrit 
    $$X^{k + 1} = (X - X_{i})(X^{k} + X_{i}X^{k - 1} + \cdots + X_{i}^{k}) + X_{i}^{k + 1}.$$
     En multipliant par $P_{i}$ et en sommant sur $i$, 
    $$X^{k + 1}P' = P\sum_{i = 1}^{n}\sum_{j = 0}^{k}X_{i}^{j}X^{k - j} + \sum_{i = 1}^{n}X_{i}^{k + 1}P_{i} = QP + \sum_{i = 1}^{n}X_{i}^{k + 1}P_{i}.$$
     Le dernier terme est de degré au plus $n - 1 < \deg P$, et $P$ est unitaire : par unicité de la division euclidienne, $Q$ est le quotient.

    Supposons maintenant $1 \leqslant k \leqslant n$ et comparons les coefficients de $X^{n}$ ; le reste n'y contribue pas. Comme le coefficient de $X^{n - j}$ dans $P$ est $(-1)^{j}\Sigma_{j}$ (avec $\Sigma_{0} = 1$) :

    • dans $X^{k + 1}P'$, c'est le coefficient de $X^{n - k - 1}$ dans $P'$, soit $(n - k)(-1)^{k}\Sigma_{k}$ ;

    • dans $QP = \mathop{\displaystyle \sum_{j}}S_{j}X^{k - j}P$, c'est $\mathop{\displaystyle \sum_{j = 0}^{k}}S_{j}(-1)^{k - j}\Sigma_{k - j}$.

    Le terme $j = 0$ vaut $(-1)^{k}n\Sigma_{k}$, puisque $S_{0} = n$. Il reste $\mathop{\displaystyle \sum_{j = 1}^{k}}(-1)^{k - j}S_{j}\Sigma_{k - j} + (-1)^{k}k\Sigma_{k} = 0$, c'est-à-dire (i) après multiplication par $(-1)^{k}$ et changement de l'indice.

    La présence de $k\Sigma_{k}$ explique pourquoi on ne peut pas toujours exprimer $\Sigma_{k}$ à l'aide des $S_{j}$ : il faut diviser par $k$, ce qui est impossible si $k$ n'est pas inversible dans $A$.

    **3.** Pour $P_{0}$, de degré $7$, les valeurs des $\Sigma_{k}$ aux racines sont $e_{k} = (-1)^{k}\times$(coefficient de $X^{7 - k}$) : $e_{1} = 0$, $e_{2} = -1$, $e_{3} = 0$, $e_{4} = 1$, $e_{5} = 1$. Les relations (i) donnent successivement 
    $$S_{1} = e_{1} = 0, \quad S_{2} = e_{1}S_{1} - 2e_{2} = 2, \quad S_{3} = e_{1}S_{2} - e_{2}S_{1} + 3e_{3} = 0,$$

    $$S_{4} = e_{1}S_{3} - e_{2}S_{2} + e_{3}S_{1} - 4e_{4} = 2 - 4 = -2,$$

    $$S_{5} = e_{1}S_{4} - e_{2}S_{3} + e_{3}S_{2} - e_{4}S_{1} + 5e_{5} = 5.$$
     La somme des puissances cinquièmes des racines vaut $\boxed{5}$, ce que confirme un calcul numérique des sept racines.
- id: "l3-sa-06-04"
  feuille: "f-l3-sa-06"
  numero: 4
  partie: "Polynômes symétriques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [polynômes symétriques, groupe symétrique]
  noeuds: [pol-anneau, pol-racines, v-permutations]
  notions: [racine-polynome, polynome-scinde, groupe-alterne]
  source: "TD Algèbre 4, feuille 5 (2014-15), exercice 4"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $K$ un corps de caractéristique différente de $2$ et $\mathcal{A} = K[X_{1}, \dots, X_{n}]$, $n \geqslant 2$. On note $\mathcal{A}^{\mathfrak{A}_{n}}$ la sous-algèbre des polynômes invariants par le groupe alterné, et $\mathcal{A}^{\mathrm{antisym}}$ l'ensemble des $P$ tels que $\sigma \cdot P = \varepsilon(\sigma)P$ pour tout $\sigma \in \mathfrak{S}_{n}$.

    **1.** Soit $\tau$ une transposition et $P \in \mathcal{A}^{\mathfrak{A}_{n}}$. En écrivant $P = \dfrac{P + \tau \cdot P}{2} + \dfrac{P - \tau \cdot P}{2}$, montrer que $\mathcal{A}^{\mathfrak{A}_{n}} = K[\Sigma_{1}, \dots, \Sigma_{n}] \oplus \mathcal{A}^{\mathrm{antisym}}$.

    **2.** Soit $P \in \mathcal{A}^{\mathrm{antisym}}$. Montrer que $\delta$ divise $P$, puis que le quotient est symétrique.

    **3.** En conclure que $\mathcal{A}^{\mathfrak{A}_{n}} = K[\Sigma_{1}, \dots, \Sigma_{n}] \oplus \delta\,K[\Sigma_{1}, \dots, \Sigma_{n}]$.
  corrige: |
    Avec la définition du cours, $\sigma \cdot P = P(X_{\sigma(1)}, \dots, X_{\sigma(n)})$, on a $\sigma \cdot (\sigma' \cdot P) = (\sigma\sigma') \cdot P$ : substituer $X_{\sigma(i)}$ à $X_{i}$ dans $P(X_{\sigma'(1)}, \dots, X_{\sigma'(n)})$ donne $P(X_{\sigma\sigma'(1)}, \dots, X_{\sigma\sigma'(n)})$. C'est une action de $\mathfrak{S}_{n}$ par automorphismes d'algèbre.

    **1.** Soit $P \in \mathcal{A}^{\mathfrak{A}_{n}}$, et $P_{+} = \dfrac{1}{2}(P + \tau \cdot P)$, $P_{-} = \dfrac{1}{2}(P - \tau \cdot P)$ ; on divise par $2$, ce qui est permis car $\operatorname{car} K \neq 2$.

    Le polynôme $\tau \cdot P$ est encore invariant par $\mathfrak{A}_{n}$ : pour $\sigma \in \mathfrak{A}_{n}$, la permutation $\tau^{-1}\sigma\tau$ est paire, et 
    $$\sigma \cdot (\tau \cdot P) = (\sigma\tau) \cdot P = \tau \cdot \big((\tau^{-1}\sigma\tau) \cdot P\big) = \tau \cdot P.$$
     Donc $P_{+}$ et $P_{-}$ sont invariants par $\mathfrak{A}_{n}$.

    De plus, $\tau \cdot P_{+} = P_{+}$ et $\tau \cdot P_{-} = -P_{-}$, car $\tau^{2} = \mathrm{id}$. Toute permutation impaire s'écrit $\tau\sigma$ avec $\sigma \in \mathfrak{A}_{n}$. Il vient $\rho \cdot P_{+} = P_{+}$ pour toute $\rho \in \mathfrak{S}_{n}$, et $\rho \cdot P_{-} = \varepsilon(\rho)P_{-}$ : $P_{+}$ est symétrique, donc dans $K[\Sigma_{1}, \dots, \Sigma_{n}]$ (cours, th. 1), et $P_{-}$ est antisymétrique.

    On a ainsi $\mathcal{A}^{\mathfrak{A}_{n}} \subset K[\Sigma] + \mathcal{A}^{\mathrm{antisym}}$. L'inclusion inverse est claire : un polynôme symétrique ou antisymétrique est invariant par les permutations paires.

    Enfin, la somme est directe : si $P$ est à la fois symétrique et antisymétrique, $P = \tau \cdot P = -P$, donc $2P = 0$ et $P = 0$.

    **2.** Soit $P$ antisymétrique et $i < j$. Notons $\tau = (i\ j)$, et considérons $P$ comme un polynôme en $X_{j}$ à coefficients dans l'anneau $B$ des polynômes en les autres indéterminées. Soit $\tilde{P} \in B$ le polynôme obtenu en remplaçant $X_{j}$ par $X_{i}$.

    L'égalité $\tau \cdot P = -P$, où l'on remplace ensuite $X_{j}$ par $X_{i}$, donne $\tilde{P} = -\tilde{P}$ : en effet, échanger $X_{i}$ et $X_{j}$ puis les identifier revient à les identifier directement. Donc $2\tilde{P} = 0$, et $\tilde{P} = 0$ puisque $\operatorname{car} K \neq 2$.

    Ainsi $X_{i}$ est racine de $P$ vu dans $B[X_{j}]$, et $X_{j} - X_{i}$, unitaire en $X_{j}$, divise $P$ (division euclidienne par un polynôme unitaire).

    Les $X_{j} - X_{i}$ sont irréductibles (de degré total $1$) et deux à deux non associés dans l'anneau factoriel $\mathcal{A}$ (chapitre 3 du cours). Chacun divise $P$, donc leur produit $\delta$ divise $P$ : $P = \delta Q$.

    Reste à voir que $Q$ est symétrique. Pour $\sigma \in \mathfrak{S}_{n}$, $\varepsilon(\sigma)\delta Q = \sigma \cdot P = (\sigma \cdot \delta)(\sigma \cdot Q) = \varepsilon(\sigma)\delta\,(\sigma \cdot Q)$. Comme $\mathcal{A}$ est intègre et $\delta \neq 0$, $\sigma \cdot Q = Q$.

    **3.** La question 2 donne $\mathcal{A}^{\mathrm{antisym}} \subset \delta\,K[\Sigma]$ ; inversement, le produit de $\delta$ par un polynôme symétrique est antisymétrique. Donc $\mathcal{A}^{\mathrm{antisym}} = \delta\,K[\Sigma]$, et la question 1 donne 
    $$\boxed{\mathcal{A}^{\mathfrak{A}_{n}} = K[\Sigma_{1}, \dots, \Sigma_{n}] \oplus \delta\,K[\Sigma_{1}, \dots, \Sigma_{n}]}.$$

    Tout polynôme invariant par le groupe alterné s'écrit donc $A + \delta B$, avec $A$ et $B$ symétriques. C'est l'analogue, pour $\mathfrak{A}_{n}$, du théorème fondamental ; on retrouve la promesse faite au cours (section 6.2.3). En caractéristique $2$, l'énoncé tombe : $\delta$ y est symétrique, puisque $-1 = 1$.
- id: "l3-sa-06-05"
  feuille: "f-l3-sa-06"
  numero: 5
  partie: "Polynômes symétriques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [polynômes symétriques]
  noeuds: [pol-anneau, pol-racines, pol-binome]
  notions: [racine-polynome, polynome-scinde, coefficient-binomial]
  source: "TD Algèbre 4, feuille 5 (2014-15), exercice 5"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    *(Théorème de Kronecker.)* Soit $P \in \mathbb{Z}[X]$ unitaire de degré $n \geqslant 1$, de racines complexes $z_{1}, \dots, z_{n}$ (non nécessairement distinctes), telles que $|z_{k}| \leqslant 1$ pour tout $k$. On veut montrer que les racines non nulles de $P$ sont des racines de l'unité. On rappelle (cours, prop. 2) que, pour tout polynôme symétrique $S \in \mathbb{Z}[X_{1}, \dots, X_{n}]$, $S(z_{1}, \dots, z_{n}) \in \mathbb{Z}$.

    **1.** Soit $l \geqslant 1$. Prouver que $P_{l} = (X - z_{1}^{l})\cdots(X - z_{n}^{l})$ est dans $\mathbb{Z}[X]$, et que les valeurs absolues de ses coefficients sont majorées par $\mathop{\displaystyle \max}\Big(\dbinom{n}{k}, 1 \leqslant k \leqslant n\Big)$.

    **2.** En déduire que l'ensemble des racines des polynômes $P_{l}$, $l \geqslant 1$, est fini. Montrer qu'il existe des entiers distincts $r$ et $s$ tels que $z_{1}^{r} = z_{1}^{s}$, et conclure.
  corrige: |
    **1.** Par la proposition 1 du cours, les coefficients de $P_{l}$ sont, au signe près, les $\Sigma_{k}(z_{1}^{l}, \dots, z_{n}^{l})$. Or le polynôme $\Sigma_{k}(X_{1}^{l}, \dots, X_{n}^{l})$ est symétrique et à coefficients entiers, et $P$ est unitaire à coefficients dans $\mathbb{Z}$, de racines $z_{1}, \dots, z_{n}$ dans $\mathbb{C}$. La proposition 2 du cours, appliquée avec $B = \mathbb{Z}$ et $C = \mathbb{C}$, donne $\Sigma_{k}(z_{1}^{l}, \dots, z_{n}^{l}) \in \mathbb{Z}$. Donc $P_{l} \in \mathbb{Z}[X]$.

    Comme $|z_{i}^{l}| \leqslant 1$, l'inégalité triangulaire donne 
    $$\big|\Sigma_{k}(z_{1}^{l}, \dots, z_{n}^{l})\big| \leqslant \sum_{i_{1} < \cdots < i_{k}}|z_{i_{1}}^{l}|\cdots|z_{i_{k}}^{l}| \leqslant \binom{n}{k}.$$

    **2.** Les polynômes $P_{l}$ sont unitaires de degré $n$, à coefficients entiers bornés par $M = \mathop{\displaystyle \max_{k}}\dbinom{n}{k}$ : ils sont pris dans un ensemble fini, de cardinal au plus $(2M + 1)^{n}$. Chacun a au plus $n$ racines, donc l'ensemble $E$ des racines de tous les $P_{l}$ est fini.

    Les nombres $z_{1}, z_{1}^{2}, z_{1}^{3}, \dots$ sont tous dans $E$ ($z_{1}^{l}$ est racine de $P_{l}$). Une suite à valeurs dans un ensemble fini n'est pas injective : il existe $r < s$ tels que $z_{1}^{r} = z_{1}^{s}$.

    Si $z_{1} \neq 0$, on simplifie par $z_{1}^{r}$ : $z_{1}^{s - r} = 1$, et $z_{1}$ est une racine de l'unité. Le même raisonnement vaut pour chaque racine $z_{i}$.

    On a donc démontré le **théorème de Kronecker** : *les racines non nulles d'un polynôme unitaire de $\mathbb{Z}[X]$ dont toutes les racines sont dans le disque unité fermé sont des racines de l'unité*. L'hypothèse porte sur *toutes* les racines : $X^{2} - 3X + 1$ a la racine $\dfrac{3 - \sqrt{5}}{2} \approx 0{,}38$, qui n'est pas une racine de l'unité, mais son autre racine est de module $> 1$.
- id: "l3-sa-06-06"
  feuille: "f-l3-sa-06"
  numero: 6
  partie: "Discriminant"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [discriminant]
  noeuds: [pol-racines, pol-derivee]
  notions: [racine-multiple]
  source: "TD Algèbre 4, feuille 6 (2014-15), exercice 1"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Soit $K$ un corps, $p$, $q \in K$ et $P = X^{3} + pX + q$.

    **1.** On suppose $P = (X - a)(X - b)(X - c)$ dans $K[X]$. Montrer que $\Delta(P) = -P'(a)P'(b)P'(c)$.

    **2.** Retrouver, à l'aide de la question 1, la formule $\Delta(P) = -4p^{3} - 27q^{2}$ du cours. *On pourra calculer $P'(a)$ en fonction de $a$, $p$, $q$.*

    **3.** Déterminer le discriminant d'un polynôme de degré $3$ quelconque $aX^{3} + bX^{2} + cX + d$ de $K[X]$.

    **4.** Pour quels nombres premiers $p$ le polynôme $X^{3} + X^{2} + X - 1$ a-t-il une racine multiple dans $\mathbb{Z}/p\mathbb{Z}$ ?
  corrige: |
    **1.** Ici $p_{3} = 1$, et $P'(a) = (a - b)(a - c)$, $P'(b) = (b - a)(b - c)$, $P'(c) = (c - a)(c - b)$, en dérivant le produit. Dans le produit des trois, chaque paire de racines fournit deux facteurs opposés, par exemple $(a - b)(b - a) = -(b - a)^{2}$ ; il y a trois paires, donc 
    $$P'(a)P'(b)P'(c) = -\big((b - a)(c - a)(c - b)\big)^{2} = -\Delta(P).$$
     On retrouve le théorème 3 du cours pour $n = 3$, puisque $R(P, P') = P'(a)P'(b)P'(c)$ par le théorème 2.

    **2.** Par la question 1, $\Delta(P) = -\mathop{\displaystyle \prod}(3a^{2} + p)$, le produit portant sur les trois racines. On développe en posant $u_{1} = a^{2}$, $u_{2} = b^{2}$, $u_{3} = c^{2}$ : 
    $$\prod_{i}(3u_{i} + p) = 27u_{1}u_{2}u_{3} + 9p(u_{1}u_{2} + u_{1}u_{3} + u_{2}u_{3}) + 3p^{2}(u_{1} + u_{2} + u_{3}) + p^{3}.$$

    Les relations $a + b + c = 0$, $ab + ac + bc = p$, $abc = -q$ donnent :

    • $u_{1} + u_{2} + u_{3} = 0^{2} - 2p = -2p$ ;

    • $u_{1}u_{2} + u_{1}u_{3} + u_{2}u_{3} = p^{2} - 2abc(a + b + c) = p^{2}$ ;

    • $u_{1}u_{2}u_{3} = q^{2}$.

    Le produit vaut $27q^{2} + 9p^{3} - 6p^{3} + p^{3} = 4p^{3} + 27q^{2}$, et l'on retrouve 
    $$\boxed{\Delta(X^{3} + pX + q) = -4p^{3} - 27q^{2}}.$$

    Si $P$ n'est pas scindé sur $K$, on fait le calcul dans un corps de décomposition : le discriminant, comme les $p$, $q$, n'en dépend pas. Cette démonstration n'utilise que des polynômes symétriques ; celle du cours passe par un déterminant de taille $5$.

    **3.** Soit $P = aX^{3} + bX^{2} + cX + d$, avec $a \neq 0$, et supposons d'abord $\operatorname{car} K \neq 3$. On écrit $P = aP_{1}$, $P_{1}$ unitaire. Par définition, $\Delta(P) = a^{4}\Delta(P_{1})$.

    La translation $X \mapsto X - \dfrac{b}{3a}$ ne change pas les différences de racines, donc pas le discriminant, et elle transforme $P_{1}$ en $X^{3} + pX + q$ avec 
    $$p = \frac{c}{a} - \frac{b^{2}}{3a^{2}}, \qquad q = \frac{2b^{3}}{27a^{3}} - \frac{bc}{3a^{2}} + \frac{d}{a}.$$
     En reportant dans $a^{4}(-4p^{3} - 27q^{2})$ et en développant (calcul contrôlé symboliquement), on obtient 
    $$\boxed{\Delta(aX^{3} + bX^{2} + cX + d) = b^{2}c^{2} - 4ac^{3} - 4b^{3}d - 27a^{2}d^{2} + 18abcd}.$$

    En caractéristique $3$, la translation est impossible, mais la formule reste vraie. Les deux membres sont en effet des polynômes à coefficients entiers en $a$, $b$, $c$, $d$ : le premier, parce que $\delta^{2}$ est un polynôme à coefficients entiers en les $\Sigma_{k}$ (cours, th. 1). Ces polynômes coïncident sur $\mathbb{Q}$, donc sont égaux dans $\mathbb{Z}[a, b, c, d]$, et l'égalité passe à tout corps.

    **4.** Le polynôme $P = X^{3} + X^{2} + X - 1$ est unitaire ; son image $\overline{P}$ dans $\mathbb{F}_{p}[X]$ a pour discriminant l'image de $\Delta(P)$. La formule précédente donne 
    $$\Delta(P) = 1 - 4 + 4 - 27 - 18 = -44 = -2^{2} \times 11.$$

    Si $\overline{P}$ a une racine multiple dans $\mathbb{F}_{p}$, son discriminant est nul, donc $p$ divise $44$ : $p \in \{2, 11\}$.

    Réciproquement, on factorise :

    • modulo $2$, $\overline{P} = X^{3} + X^{2} + X + 1 = (X + 1)^{3}$ : racine triple $1$ ;

    • modulo $11$, $\overline{P} = (X + 3)^{2}(X - 5)$ : racine double $-3 = 8$.

    Les nombres premiers cherchés sont $\boxed{p = 2 \text{ et } p = 11}$.

    La nullité du discriminant donne une racine multiple dans un corps de décomposition, pas nécessairement dans $\mathbb{F}_{p}$ ; il faut donc vérifier la réciproque, comme on l'a fait. En degré $3$, elle est d'ailleurs automatique : une racine double hors de $\mathbb{F}_{p}$ aurait un conjugué lui aussi double, et le degré dépasserait $3$.
