  enonce: |
    Soit $P \in \mathbb{R}[X]$ de degré $n \geqslant 1$, sans racine multiple dans $\mathbb{C}$, et $r$ le nombre de ses racines réelles. Montrer que $n - r$ est congru à $0$ ou à $2$ modulo $4$ selon le signe du discriminant de $P$. *On pourra considérer la factorisation de $P$ dans $\mathbb{C}[X]$.* Que peut-on dire de $r$ si $P$ est de degré $3$ ?
  corrige: |
    Écrivons $P = p_{n}\mathop{\displaystyle \prod}(X - a_{i})$ dans $\mathbb{C}[X]$. Les racines non réelles de $P$ sont conjuguées deux à deux, puisque $P$ est réel : il y en a $2s$, avec $n = r + 2s$. Le facteur $p_{n}^{2n - 2}$ est un carré de réel non nul, donc positif ; le signe de $\Delta(P)$ est celui du produit des $(a_{j} - a_{i})^{2}$, sur les paires de racines.

    On regroupe ces paires :

    • une paire de racines réelles fournit un carré de réel non nul, $> 0$ ;

    • une paire conjuguée $\{z, \overline{z}\}$ fournit $(z - \overline{z})^{2} = (2\mathrm{i}\,\mathrm{Im}\,z)^{2} < 0$ ;

    • toute autre paire $\{x, w\}$ contient une racine non réelle et n'est pas conjuguée ; la paire $\{\overline{x}, \overline{w}\}$ est alors différente de $\{x, w\}$, et les deux fournissent ensemble $(x - w)^{2}\,\overline{(x - w)}^{2} = |x - w|^{4} > 0$.

    Il y a exactement $s$ paires conjuguées. Le signe de $\Delta(P)$ est donc $(-1)^{s}$ : 
    $$\boxed{\Delta(P) > 0 \iff s \text{ pair} \iff n - r \equiv 0 \pmod{4}, \qquad \Delta(P) < 0 \iff n - r \equiv 2 \pmod{4}}.$$

    Pour $n = 3$, $n - r$ vaut $0$ ou $2$ : $r = 3$ si $\Delta(P) > 0$ et $r = 1$ si $\Delta(P) < 0$. C'est la proposition 4 du cours. En degré $4$, en revanche, $\Delta(P) > 0$ laisse deux possibilités, $r = 4$ ou $r = 0$ : le signe du discriminant ne suffit plus à compter les racines réelles.
- id: "l3-sa-06-08"
  feuille: "f-l3-sa-06"
  numero: 8
  partie: "Discriminant"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [discriminant]
  noeuds: [pol-racines, pol-derivee]
