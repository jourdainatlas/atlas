  etoiles: 2
  types: [Démonstration]
  mots_cles: ["résultant, élimination"]
  noeuds: [v-det-matrice, pol-racines]
  notions: [racine-polynome]
  source: "TD Algèbre 4, feuille 6 (2014-15), exercice 4"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    **1.** Soit $a$, $b$, $c$, $a'$, $b'$, $c' \in \mathbb{C}$, avec $a$, $a' \neq 0$. Montrer que $aX^{2} + bX + c$ et $a'X^{2} + b'X + c'$ ont une racine commune dans $\mathbb{C}$ si et seulement si 
    $$(ac' - ca')^{2} - (ab' - ba')(bc' - cb') = \Big(ac' + ca' - \frac{bb'}{2}\Big)^{2} - \frac{(b^{2} - 4ac)(b'^{2} - 4a'c')}{4} = 0.$$

    **2.** Pour quels nombres premiers $p$ les polynômes $X^{3} - X + 2$ et $X^{2} + X + 1$ ont-ils une racine commune dans $\mathbb{Z}/p\mathbb{Z}$ ?
  corrige: |
    **1.** Notons $P = aX^{2} + bX + c$, $Q = a'X^{2} + b'X + c'$, et 
    $$u = ac' - ca', \qquad v = ab' - ba', \qquad w = bc' - cb'.$$
     Soit $x_{1}$, $x_{2}$ les racines de $P$ dans $\mathbb{C}$. Par le théorème 2 du cours, $R(P, Q) = a^{2}Q(x_{1})Q(x_{2})$, qui est nul si et seulement si $Q(x_{1}) = 0$ ou $Q(x_{2}) = 0$, c'est-à-dire si et seulement si $P$ et $Q$ ont une racine commune. Il reste à calculer ce produit.

    En une racine $x$ de $P$, $ax^{2} = -bx - c$, donc 
    $$aQ(x) = a'(ax^{2}) + ab'x + ac' = a'(-bx - c) + ab'x + ac' = vx + u.$$
     Avec $x_{1} + x_{2} = -\dfrac{b}{a}$ et $x_{1}x_{2} = \dfrac{c}{a}$, 
    $$a^{2}Q(x_{1})Q(x_{2}) = (vx_{1} + u)(vx_{2} + u) = u^{2} + \frac{v(vc - ub)}{a}.$$
     Or $vc - ub = ab'c - ba'c - abc' + ba'c = -a(bc' - cb') = -aw$. On obtient 
    $$\boxed{R(P, Q) = (ac' - ca')^{2} - (ab' - ba')(bc' - cb')}.$$
     C'est la première expression de l'énoncé : elle est nulle si et seulement si $P$ et $Q$ ont une racine commune.

    Pour la seconde expression, on développe : 
    $$\Big(ac' + ca' - \frac{bb'}{2}\Big)^{2} - \frac{(b^{2} - 4ac)(b'^{2} - 4a'c')}{4} = (ac' + ca')^{2} - 4aa'cc' - bb'(ac' + ca') + a'c'b^{2} + acb'^{2}.$$
     Comme $(ac' + ca')^{2} - 4aa'cc' = u^{2}$, et que $vw = abb'c' - acb'^{2} - a'b^{2}c' + a'bb'c$, les deux expressions coïncident.

    L'énoncé d'origine écrivait cette condition pour $X^{2} + aX + b$ et $X^{2} + cX + d$, avec des lettres $a'$, $b'$, $c'$ non définies ; elle est juste sous la forme ci-dessus. Pour les polynômes unitaires $X^{2} + aX + b$ et $X^{2} + cX + d$, elle devient $(d - b)^{2} - (c - a)(ad - bc) = 0$.

    **2.** Les deux polynômes sont unitaires, donc leurs réductions modulo $p$ gardent leurs degrés, et le résultant de ces réductions est la réduction du résultant (même déterminant de Sylvester). Par le théorème 2, si $j$ et $j^{2}$ sont les racines complexes de $X^{2} + X + 1$, 
    $$R(X^{2} + X + 1, X^{3} - X + 2) = \prod_{\zeta \in \{j, j^{2}\}}(\zeta^{3} - \zeta + 2) = (3 - j)(3 - j^{2}) = 9 - 3(j + j^{2}) + j^{3} = 9 + 3 + 1 = 13,$$
     puisque $\zeta^{3} = 1$ et $j + j^{2} = -1$.

    Si les deux polynômes ont une racine commune dans $\mathbb{Z}/p\mathbb{Z}$, le résultant est nul modulo $p$ (cours, prop. 3), donc $p = 13$.

    Réciproquement, modulo $13$, $3^{2} + 3 + 1 = 13 \equiv 0$ et $3^{3} - 3 + 2 = 26 \equiv 0$ : la racine $3$ est commune. La réponse est $\boxed{p = 13}$ ; la racine commune est $3$, l'autre racine de $X^{2} + X + 1$, à savoir $9$, ne convenant pas ($9^{3} - 9 + 2 = 722 \equiv 7$).
- id: "l3-sa-06-10"
  feuille: "f-l3-sa-06"
  numero: 10
  partie: "Résultant, élimination"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["résultant, élimination"]
  noeuds: [v-det-matrice, pol-racines]
  notions: [racine-polynome, courbe-parametree]
  source: "TD Algèbre 4, feuille 6 (2014-15), exercice 5"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    *(Résultant et élimination.)*

    **1.** Calculer le résultant des polynômes $P = X^{2} - XY + Y^{2} - 1$ et $Q = 2X^{2} + Y^{2} - Y - 2$ de $\mathbb{R}[X][Y]$. En déduire les points d'intersection dans $\mathbb{R}^{2}$ des coniques d'équations $P(x, y) = 0$ et $Q(x, y) = 0$. Reprendre l'exercice avec $P = 2X^{2} + Y^{2} + 3XY - 2X - Y$ et $Q = 3X^{2} + 2Y^{2} + 6XY + X$, puis $Q = 3X^{2} + 2Y^{2} + 6XY$.

    **2.** Soit $A$, $B$, $C$, $D \in \mathbb{C}[X]$, avec $B$, $D \neq 0$, et $\mathcal{C}$ la courbe paramétrée de $\mathbb{C}^{2}$ formée des points $M(t) = \Big(\dfrac{A(t)}{B(t)}, \dfrac{C(t)}{D(t)}\Big)$, $t \in \mathbb{C}$, $B(t)D(t) \neq 0$. Expliquer comment trouver un polynôme $F \in \mathbb{C}[X, Y]$ tel que $\mathcal{C}$ soit la courbe d'équation $F(x, y) = 0$, éventuellement privée d'un nombre fini de points. Traiter les cas $M(t) = \Big(\dfrac{1 - t^{2}}{1 + t^{2}}, \dfrac{2t}{1 + t^{2}}\Big)$ et $M(t) = (t^{2} - 1, t^{3} + t^{2})$.
  corrige: |
    **1.** On voit $P$ et $Q$ comme des polynômes en $Y$ à coefficients dans $\mathbb{R}[X]$, de degré $2$ et de coefficient dominant constant non nul. Pour chaque $x$, le résultant spécialisé est donc celui de $P(x, Y)$ et $Q(x, Y)$, et il est nul si et seulement si ces deux polynômes ont une racine commune dans $\mathbb{C}$. Les abscisses des points d'intersection sont parmi les racines de $\mathrm{Res}_{Y}(P, Q)$ ; pour chacune, on cherche ensuite les $y$ communs.

    $\triangleright$ *Première paire.* On applique la formule de l'exercice 9 en la variable $Y$, avec $P = Y^{2} - XY + (X^{2} - 1)$ et $Q = Y^{2} - Y + (2X^{2} - 2)$ : $a = a' = 1$, $b = -X$, $c = X^{2} - 1$, $b' = -1$, $c' = 2X^{2} - 2$. Alors 
    $$u = X^{2} - 1, \qquad v = X - 1, \qquad w = -X(2X^{2} - 2) + X^{2} - 1 = (X^{2} - 1)(1 - 2X),$$
     et 
    $$\mathrm{Res}_{Y}(P, Q) = u^{2} - vw = (X^{2} - 1)\big(X^{2} - 1 - (X - 1)(1 - 2X)\big) = 3X(X - 1)^{2}(X + 1).$$

    Pour $x = 0$, $P(0, Y) = Y^{2} - 1$ et $Q(0, Y) = (Y - 2)(Y + 1)$ : $y = -1$. Pour $x = -1$, $P = Y(Y + 1)$ et $Q = Y(Y - 1)$ : $y = 0$. Pour $x = 1$, $P(1, Y) = Q(1, Y) = Y^{2} - Y$ : $y = 0$ et $y = 1$, ce qui explique la racine double.

    Les points d'intersection sont $\boxed{(-1, 0), \ (0, -1), \ (1, 0), \ (1, 1)}$.

    1.5em

    ![Figure](documents/figures/b8bb20d6d1356fef.svg)

    L'ellipse $x^{2} - xy + y^{2} = 1$ (en bleu) et l'ellipse $2x^{2} + \big(y - \dfrac{1}{2}\big)^{2} = \dfrac{9}{4}$ (en orange) se coupent en quatre points, en rouge. Leurs abscisses, en pointillés, sont les racines $-1$, $0$, $1$ du résultant ; la racine double $1$ correspond aux deux points de même abscisse.

    $\triangleright$ *Deuxième paire.* Le polynôme $P = 2X^{2} + 3XY + Y^{2} - 2X - Y$ se factorise. En effet, $2X^{2} + 3XY + Y^{2} = (2X + Y)(X + Y)$, donc 
    $$P = (2X + Y)(X + Y - 1).$$
     La « conique » $P = 0$ est la réunion des droites $y = -2x$ et $y = 1 - x$. Le calcul du résultant donne 
    $$\mathrm{Res}_{Y}(P, Q) = X(X - 1)(X^{2} - 3X - 2) \quad \text{pour } Q = 3X^{2} + 2Y^{2} + 6XY + X.$$

    La factorisation de $P$ permet de trouver directement les ordonnées.

    • Sur la droite $y = -2x$, $Q(x, -2x) = x - x^{2}$ : points $(0, 0)$ et $(1, -2)$.

    • Sur la droite $y = 1 - x$, $Q(x, 1 - x) = -x^{2} + 3x + 2$, de racines $\dfrac{3 \pm \sqrt{17}}{2}$, d'où les points 
    $$\Big(\frac{3 - \sqrt{17}}{2}, \frac{-1 + \sqrt{17}}{2}\Big) \approx (-0{,}56 \, ; 1{,}56) \quad \text{et} \quad \Big(\frac{3 + \sqrt{17}}{2}, \frac{-1 - \sqrt{17}}{2}\Big) \approx (3{,}56 \, ; -2{,}56).$$

    On obtient $\boxed{\text{quatre points}}$, dont deux irrationnels, aux abscisses $0$, $1$, $\dfrac{3 \pm \sqrt{17}}{2}$ : ce sont bien les racines du résultant.

    $\triangleright$ *Troisième paire.* Pour $Q = 3X^{2} + 2Y^{2} + 6XY$, on trouve $\mathrm{Res}_{Y}(P, Q) = X^{2}(X^{2} - 2X - 2)$.

    • Sur $y = -2x$, $Q(x, -2x) = -x^{2}$ : seulement $(0, 0)$, d'où la racine double.

    • Sur $y = 1 - x$, $Q = -x^{2} + 2x + 2$, de racines $1 \pm \sqrt{3}$ : points $(1 - \sqrt{3}, \sqrt{3})$ et $(1 + \sqrt{3}, -\sqrt{3})$.

    On obtient $\boxed{\text{trois points}}$. Ici $Q$ est homogène de degré $2$ : c'est la réunion des deux droites $y = \dfrac{-3 \pm \sqrt{3}}{2}\,x$, qui passent par l'origine, comme la droite $y = -2x$.

    1.5em

    ![Figure](documents/figures/a68c1f05d4812dca.svg)

    En (a), les deux droites de $P = 0$ (en bleu) coupent l'hyperbole $3x^{2} + 6xy + 2y^{2} + x = 0$ (en orange) en quatre points ; en (b), les deux droites de $Q = 0$ passent par l'origine, où trois des quatre droites se rencontrent, et il ne reste que trois points d'intersection.

    **2.** *Méthode.* On suppose les fractions $A/B$ et $C/D$ irréductibles et $A/B$ non constante. Un point $(x, y)$ est sur $\mathcal{C}$ lorsqu'il existe $t$ tel que $B(t)D(t) \neq 0$ et 
    $$U_{x}(t) = B(t)x - A(t) = 0, \qquad V_{y}(t) = D(t)y - C(t) = 0.$$
     On pose $F(X, Y) = \mathrm{Res}_{T}\big(B(T)X - A(T), D(T)Y - C(T)\big)$, résultant calculé en $T$, avec pour degrés formels $\mathop{\displaystyle \max}(\deg A, \deg B)$ et $\mathop{\displaystyle \max}(\deg C, \deg D)$. C'est un polynôme de $\mathbb{C}[X, Y]$.

    • Si $(x, y) = M(t_{0})$, les polynômes $U_{x}$ et $V_{y}$ ont la racine commune $t_{0}$, donc $F(x, y) = 0$ (cours, prop. 3).

    • Réciproquement, soit $(x, y)$ tel que $F(x, y) = 0$, et tel que l'un des coefficients formels de tête de $U_{x}$ et $V_{y}$ soit non nul. Par la proposition 3, $U_{x}$ et $V_{y}$ ont un facteur commun, donc une racine commune $t_{0} \in \mathbb{C}$. Si l'on avait $B(t_{0}) = 0$, alors $A(t_{0}) = B(t_{0})x = 0$, ce qui contredit l'irréductibilité de $A/B$ ; donc $B(t_{0}) \neq 0$, de même $D(t_{0}) \neq 0$, et $(x, y) = M(t_{0})$.

    Le coefficient de tête formel de $U_{x}$ est de la forme $\beta x - \alpha$, avec $\alpha$, $\beta$ les coefficients de degré $\mathop{\displaystyle \max}(\deg A, \deg B)$ de $A$ et $B$, non tous deux nuls : il ne s'annule que pour une valeur de $x$ au plus. De même pour $V_{y}$. La seule exception possible est donc un point, limite de $M(t)$ quand $t \to \infty$ : $\mathcal{C}$ est la courbe $F = 0$, privée d'au plus un point, à condition que $F$ ne soit pas nul, ce qu'on vérifie sur chaque exemple.

    $\triangleright$ *Le cercle.* Pour $M(t) = \Big(\dfrac{1 - t^{2}}{1 + t^{2}}, \dfrac{2t}{1 + t^{2}}\Big)$, il s'agit d'éliminer $T$ entre $(X + 1)T^{2} + (X - 1)$ et $YT^{2} - 2T + Y$. La formule de l'exercice 9, en la variable $T$, avec $a = X + 1$, $b = 0$, $c = X - 1$, $a' = Y$, $b' = -2$, $c' = Y$, donne 
    $$u = (X + 1)Y - (X - 1)Y = 2Y, \qquad v = -2(X + 1), \qquad w = 2(X - 1), \qquad u^{2} - vw = 4Y^{2} + 4(X^{2} - 1).$$
     On trouve $\boxed{F = 4(X^{2} + Y^{2} - 1)}$ : la courbe est le cercle unité.

    Le point exceptionnel est $(-1, 0)$ : pour $x = -1$, le coefficient de tête $x + 1$ s'annule, et $\dfrac{1 - t^{2}}{1 + t^{2}} = -1$ n'a pas de solution. C'est la limite de $M(t)$ en l'infini. Dans $\mathbb{C}$, les valeurs $t = \pm\mathrm{i}$ sont exclues, mais elles ne font perdre aucun autre point.

    $\triangleright$ *La cubique.* Pour $M(t) = (t^{2} - 1, t^{3} + t^{2})$, les dénominateurs valent $1$ et les polynômes $T^{2} - (X + 1)$ et $T^{3} + T^{2} - Y$ sont unitaires en $T$ : il n'y a pas de point exceptionnel. Par le théorème 2, si $\pm\tau$ sont les racines de $T^{2} - (X + 1)$, de sorte que $\tau^{2} = X + 1$, 
    $$F = \prod_{\pm}\big((\pm\tau)^{3} + (\pm\tau)^{2} - Y\big) = (X + 1 - Y)^{2} - \tau^{6} = (X + 1 - Y)^{2} - (X + 1)^{3}.$$
     Développé : 
    $$\boxed{F = Y^{2} - 2Y - 2XY - X^{3} - 2X^{2} - X},$$
     et $\mathcal{C}$ est exactement la cubique d'équation $(x + 1 - y)^{2} = (x + 1)^{3}$.

    1.5em

    ![Figure](documents/figures/9649d1eb24084071.svg)

    À gauche, le cercle paramétré : $t$ est la pente de la droite joignant $(-1, 0)$ à $M(t)$ (en pointillés pour $t = 1$), et le point $(-1, 0)$, en rouge, n'est atteint pour aucun $t$. À droite, la cubique $(x + 1 - y)^{2} = (x + 1)^{3}$, pour $t \in [-1{,}75 \, ; 1{,}3]$ : la paramétrisation polynomiale l'atteint tout entière. En $M(0) = (-1, 0)$, le vecteur dérivé $(2t, 3t^{2} + 2t)$ s'annule, et la courbe présente un point de rebroussement.

