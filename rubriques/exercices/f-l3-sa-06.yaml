- id: "l3-sa-06-01"
  feuille: "f-l3-sa-06"
  numero: 1
  partie: "Polynômes symétriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [polynômes symétriques]
  noeuds: [pol-anneau, pol-racines]
  notions: [racine-polynome, polynome-scinde]
  source: "TD Algèbre 4, feuille 5 (2014-15), exercice 1"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $A$ un anneau. Exprimer les polynômes suivants de $A[X_{1}, X_{2}, X_{3}]$ en fonction de $\Sigma_{1}$, $\Sigma_{2}$, $\Sigma_{3}$ :

    **1.** $X_{1}^{3}X_{2} + X_{1}^{3}X_{3} + X_{2}^{3}X_{1} + X_{2}^{3}X_{3} + X_{3}^{3}X_{1} + X_{3}^{3}X_{2}$ ;

    **2.** $X_{1}^{2}X_{2}^{3} + X_{1}^{3}X_{2}^{2} + X_{1}^{2}X_{3}^{3} + X_{1}^{3}X_{3}^{2} + X_{2}^{2}X_{3}^{3} + X_{2}^{3}X_{3}^{2}$ ;

    **3.** $(X_{1} + X_{2})(X_{1} + X_{3})(X_{2} + X_{3}) + X_{1}^{3} + X_{2}^{3} + X_{3}^{3}$.
  corrige: |
    On applique l'algorithme de la démonstration du théorème 1 : on retranche le produit 
    $$\Sigma_{1}^{\alpha_{1} - \alpha_{2}}\Sigma_{2}^{\alpha_{2} - \alpha_{3}}\Sigma_{3}^{\alpha_{3}}$$
     associé au monôme dominant $X_{1}^{\alpha_{1}}X_{2}^{\alpha_{2}}X_{3}^{\alpha_{3}}$, multiplié par son coefficient, puis on recommence avec le reste. Les sommes plus simples 
    $$m_{(2, 2)} = \Sigma_{2}^{2} - 2\Sigma_{1}\Sigma_{3}, \qquad m_{(2, 1, 1)} = \Sigma_{1}\Sigma_{3}, \qquad m_{(2, 2, 1)} = \Sigma_{2}\Sigma_{3}, \qquad m_{(3, 1, 1)} = \Sigma_{3}(\Sigma_{1}^{2} - 2\Sigma_{2})$$
     s'obtiennent de la même façon ; les deux dernières viennent de la mise en facteur de $X_{1}X_{2}X_{3} = \Sigma_{3}$, et la première du développement de $\Sigma_{2}^{2}$, dont les termes croisés valent $2X_{1}X_{2}X_{3}(X_{1} + X_{2} + X_{3})$.

    **1.** Le polynôme est $m_{(3, 1)}$, de monôme dominant $X_{1}^{3}X_{2}$, auquel correspond $\Sigma_{1}^{2}\Sigma_{2}$. En développant, on trouve $\Sigma_{1}^{2}\Sigma_{2} = m_{(3, 1)} + 2m_{(2, 2)} + 5m_{(2, 1, 1)}$. Par exemple, le monôme $X_{1}^{2}X_{2}^{2}$ s'obtient en prenant $X_{1}X_{2}$ dans $\Sigma_{2}$ et $X_{1}X_{2}$ dans $\Sigma_{1}^{2}$, ce qui se fait de deux façons ; on compte de même cinq façons d'obtenir $X_{1}^{2}X_{2}X_{3}$. Donc 
    $$\boxed{m_{(3, 1)} = \Sigma_{1}^{2}\Sigma_{2} - 2\Sigma_{2}^{2} - \Sigma_{1}\Sigma_{3}}.$$

    **2.** Le polynôme est $m_{(3, 2)}$, auquel correspond $\Sigma_{1}\Sigma_{2}^{2}$. On trouve $\Sigma_{1}\Sigma_{2}^{2} = m_{(3, 2)} + 2m_{(3, 1, 1)} + 5m_{(2, 2, 1)}$, d'où 
    $$\boxed{m_{(3, 2)} = \Sigma_{1}\Sigma_{2}^{2} - 2\Sigma_{1}^{2}\Sigma_{3} - \Sigma_{2}\Sigma_{3}}.$$

    **3.** On ne développe pas : $(X_{1} + X_{2})(X_{1} + X_{3})(X_{2} + X_{3}) = (\Sigma_{1} - X_{3})(\Sigma_{1} - X_{2})(\Sigma_{1} - X_{1})$, valeur en $T = \Sigma_{1}$ de $\mathop{\displaystyle \prod}(T - X_{i}) = T^{3} - \Sigma_{1}T^{2} + \Sigma_{2}T - \Sigma_{3}$ (cours, prop. 1). Elle vaut $\Sigma_{1}\Sigma_{2} - \Sigma_{3}$. D'autre part, on a vu en cours que $X_{1}^{3} + X_{2}^{3} + X_{3}^{3} = \Sigma_{1}^{3} - 3\Sigma_{1}\Sigma_{2} + 3\Sigma_{3}$. La somme vaut 
    $$\boxed{\Sigma_{1}^{3} - 2\Sigma_{1}\Sigma_{2} + 2\Sigma_{3}}.$$

    Les trois résultats ont été contrôlés par un développement symbolique. Ils ont des coefficients entiers, comme l'annonçait le théorème 1 : l'algorithme ne divise jamais.
- id: "l3-sa-06-02"
  feuille: "f-l3-sa-06"
  numero: 2
  partie: "Polynômes symétriques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [polynômes symétriques]
  noeuds: [pol-anneau, pol-racines]
  notions: [racine-polynome, polynome-scinde]
  source: "TD Algèbre 4, feuille 5 (2014-15), exercice 2"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** On note $a$, $b$, $c$ les racines complexes de $X^{3} + 3X + 3$. Expliciter le polynôme unitaire $P \in \mathbb{C}[X]$ de degré $3$ dont les racines sont $a - bc$, $b - ac$ et $c - ab$.

    **2.** Trouver les $(x, y, z) \in (\mathbb{Z}/13\mathbb{Z})^{3}$ tels que $x + y + z = \dfrac{1}{x} + \dfrac{1}{y} + \dfrac{1}{z} = -x^{2} - y^{2} - z^{2} = 1$.

    **3.** Soit $\Sigma = (X_{1} - X_{2})^{3} + (X_{2} - X_{3})^{3} + (X_{3} - X_{1})^{3}$, dans $\mathbb{C}[X_{1}, X_{2}, X_{3}]$. Montrer que 
    $$\Sigma = 3(X_{1} - X_{2})(X_{2} - X_{3})(X_{3} - X_{1}).$$
     Ce polynôme est-il symétrique ? Exprimer $\Sigma^{2}$ en fonction de $\Sigma_{1}$, $\Sigma_{2}$, $\Sigma_{3}$. Si $a$, $b$, $c$ sont les racines complexes de $X^{3} + X^{2} - X + 1$, que vaut $(a - b)^{3} + (b - c)^{3} + (c - a)^{3}$ ?
  corrige: |
    **1.** Les relations entre coefficients et racines donnent $a + b + c = 0$, $ab + ac + bc = 3$ et $abc = -3$. Aucune racine n'est nulle, puisque $P(0) = 3$. On a donc $bc = -\dfrac{3}{a}$, et, comme $a^{2} + 3 = -\dfrac{3}{a}$ (diviser $a^{3} + 3a + 3 = 0$ par $a$), 
    $$a - bc = a + \frac{3}{a} = \frac{a^{2} + 3}{a} = -\frac{3}{a^{2}}.$$
     De même pour $b$ et $c$. Il s'agit donc de trouver le polynôme unitaire dont les racines sont les $-3/u$, où $u$ décrit les carrés $a^{2}$, $b^{2}$, $c^{2}$.

    Les coefficients de $\mathop{\displaystyle \prod}(T - a^{2})$ sont des polynômes symétriques en $a$, $b$, $c$, que l'on calcule : 
    $$a^{2} + b^{2} + c^{2} = 0^{2} - 2 \cdot 3 = -6, \qquad a^{2}b^{2} + a^{2}c^{2} + b^{2}c^{2} = 3^{2} - 2abc(a + b + c) = 9, \qquad a^{2}b^{2}c^{2} = 9.$$
     Les carrés $a^{2}$, $b^{2}$, $c^{2}$ sont donc les racines de $T^{3} + 6T^{2} + 9T - 9$.

    On substitue enfin $u = -3/y$ : $-\dfrac{27}{y^{3}} + \dfrac{54}{y^{2}} - \dfrac{27}{y} - 9 = 0$, et en multipliant par $-\dfrac{y^{3}}{9}$, 
    $$\boxed{P = X^{3} + 3X^{2} - 6X + 3}.$$

    **2.** Une solution a ses trois coordonnées inversibles. Notons $s_{1}$, $s_{2}$, $s_{3}$ les valeurs des $\Sigma_{k}$ en $(x, y, z)$. Les conditions s'écrivent 
    $$s_{1} = 1, \qquad \frac{s_{2}}{s_{3}} = 1, \qquad -(s_{1}^{2} - 2s_{2}) = 1,$$
     puisque $\dfrac{1}{x} + \dfrac{1}{y} + \dfrac{1}{z} = \dfrac{xy + xz + yz}{xyz}$ et $x^{2} + y^{2} + z^{2} = s_{1}^{2} - 2s_{2}$. On obtient $s_{2} = 1$, puis $s_{3} = 1$ : $x$, $y$, $z$ sont les racines, avec multiplicité, de 
    $$T^{3} - T^{2} + T - 1 = (T - 1)(T^{2} + 1).$$

    Dans $\mathbb{Z}/13\mathbb{Z}$, $5^{2} = 25 = -1$ et $8^{2} = 64 = -1$, donc $T^{2} + 1 = (T - 5)(T - 8)$.

    Réciproquement, si $\{x, y, z\} = \{1, 5, 8\}$, les trois coordonnées sont non nulles, le produit $(T - x)(T - y)(T - z)$ est égal à $T^{3} - T^{2} + T - 1$, et les calculs précédents se remontent. Les solutions sont 
    $$\boxed{\text{les } 6 \text{ permutations de } (1, 5, 8)}.$$

    **3.** Posons $u = X_{1} - X_{2}$, $v = X_{2} - X_{3}$, $w = X_{3} - X_{1}$. Comme $u + v + w = 0$, l'identité $u^{3} + v^{3} + w^{3} - 3uvw = (u + v + w)(u^{2} + v^{2} + w^{2} - uv - vw - wu)$ donne $\Sigma = 3uvw$.

    Ce polynôme *n'est pas symétrique* : la transposition $(1\ 2)$ change $u$ en $-u$, $v$ en $-w$ et $w$ en $-v$, donc $\Sigma$ en $-\Sigma \neq \Sigma$. C'est un polynôme antisymétrique : $uvw = \delta$ au signe près. L'énoncé initial, qui demandait d'exprimer $\Sigma$ à l'aide des $\Sigma_{k}$, n'avait donc pas de solution (unicité dans le théorème 1 : tout polynôme en les $\Sigma_{k}$ est symétrique).

    Son carré, lui, est symétrique : $\Sigma^{2} = 9\delta^{2}$, et le développement de $\delta^{2}$ (contrôlé par calcul symbolique) donne 
    $$\boxed{\Sigma^{2} = 9\big(\Sigma_{1}^{2}\Sigma_{2}^{2} - 4\Sigma_{2}^{3} - 4\Sigma_{1}^{3}\Sigma_{3} + 18\Sigma_{1}\Sigma_{2}\Sigma_{3} - 27\Sigma_{3}^{2}\big)}.$$

    Pour $X^{3} + X^{2} - X + 1$, on a $\Sigma_{1} = -1$, $\Sigma_{2} = -1$, $\Sigma_{3} = -1$, d'où $\delta(a, b, c)^{2} = 1 - 4 + 4 - 18 - 27 = -44$ : c'est le discriminant (exercice 6). Ainsi $\big((a - b)^{3} + (b - c)^{3} + (c - a)^{3}\big)^{2} = -396$, et 
    $$\boxed{(a - b)^{3} + (b - c)^{3} + (c - a)^{3} = \pm 6\mathrm{i}\sqrt{11}}.$$
     Le signe dépend de l'ordre dans lequel on a nommé les racines : échanger $a$ et $b$ le change. Une valeur numérique des racines confirme $\pm 19{,}90\,\mathrm{i}$.
- id: "l3-sa-06-03"
  feuille: "f-l3-sa-06"
