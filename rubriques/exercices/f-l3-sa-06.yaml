  source: "TD Algèbre 4, feuille 6 (2014-15), exercice 3"
  page_enonce: 2
  page_corrige: 7
  enonce: |
    Soit $n \geqslant 2$ et $P = X^{n - 1} + X^{n - 2} + \cdots + X + 1 \in \mathbb{Q}[X]$.

    **1.** Montrer que $nX^{n - 1} = P + (X - 1)P'$. En déduire que $\Delta(P) = (-1)^{\frac{(n - 1)(n - 2)}{2}}n^{n - 2}$.

    **2.** Soit $K$ un corps et $A$, $B \in K[X]$ non nuls. Exprimer $\Delta(AB)$ en fonction de $\Delta(A)$, $\Delta(B)$ et $R(A, B)$.

    **3.** Retrouver la valeur de $\Delta(P)$ à l'aide de celle du discriminant de $X^{n} - 1$.
  corrige: |
    **1.** On dérive $(X - 1)P = X^{n} - 1$ : $P + (X - 1)P' = nX^{n - 1}$.

    Pour $n = 2$, $P = X + 1$ et $\Delta(P) = 1$ (produit vide), ce qui est la formule annoncée. Supposons $n \geqslant 3$. Les racines de $P$ sont les $a = \omega^{k}$, $1 \leqslant k \leqslant n - 1$, où $\omega = \mathrm{e}^{2\mathrm{i}\pi/n}$. Elles sont distinctes et différentes de $1$.

    En une racine $a$, l'identité donne $P'(a) = \dfrac{na^{n - 1}}{a - 1}$. Le théorème 3, avec $p_{n - 1} = 1$ et $P$ de degré $n - 1$, s'écrit 
    $$\prod_{a}P'(a) = R(P, P') = (-1)^{\frac{(n - 1)(n - 2)}{2}}\Delta(P).$$

    On calcule le produit des $P'(a)$ à l'aide de deux valeurs de $P$ :

    • $\mathop{\displaystyle \prod_{a}}a = (-1)^{n - 1}P(0) = (-1)^{n - 1}$, et, comme $a^{n} = 1$, $\mathop{\displaystyle \prod_{a}}a^{n - 1} = \Big(\mathop{\displaystyle \prod_{a}}a\Big)^{-1} = (-1)^{n - 1}$ ;

    • $\mathop{\displaystyle \prod_{a}}(a - 1) = (-1)^{n - 1}\mathop{\displaystyle \prod_{a}}(1 - a) = (-1)^{n - 1}P(1) = (-1)^{n - 1}n$.

    Donc $\mathop{\displaystyle \prod_{a}}P'(a) = \dfrac{n^{n - 1}(-1)^{n - 1}}{(-1)^{n - 1}n} = n^{n - 2}$, et 
    $$\boxed{\Delta(P) = (-1)^{\frac{(n - 1)(n - 2)}{2}}n^{n - 2}}.$$
     Pour $n = 3, \dots, 7$, on trouve $-3$, $-16$, $125$, $1296$, $-16807$, valeurs confirmées par un calcul direct. Pour $n = 3$, $P = X^{2} + X + 1$ et l'on retrouve $1 - 4 = -3$.

    **2.** Soit $A = \alpha\mathop{\displaystyle \prod_{i = 1}^{n}}(X - a_{i})$ et $B = \beta\mathop{\displaystyle \prod_{j = 1}^{m}}(X - b_{j})$, de degrés $n$, $m \geqslant 1$, dans un corps de décomposition de $AB$. Le polynôme $AB$ est de degré $n + m$, de coefficient dominant $\alpha\beta$, et ses racines sont les $a_{i}$ et les $b_{j}$.

    Les paires de racines de $AB$ sont de trois sortes : deux $a$, deux $b$, ou un $a$ et un $b$. Donc 
    $$\Delta(AB) = (\alpha\beta)^{2n + 2m - 2}\prod_{i < i'}(a_{i'} - a_{i})^{2}\prod_{j < j'}(b_{j'} - b_{j})^{2}\prod_{i, j}(a_{i} - b_{j})^{2}.$$
     On répartit la puissance : $(\alpha\beta)^{2n + 2m - 2} = \alpha^{2n - 2}\beta^{2m - 2} \cdot \big(\alpha^{m}\beta^{n}\big)^{2}$. Avec $R(A, B) = \alpha^{m}\beta^{n}\mathop{\displaystyle \prod_{i, j}}(a_{i} - b_{j})$ (cours, th. 2), il vient 
    $$\boxed{\Delta(AB) = \Delta(A)\,\Delta(B)\,R(A, B)^{2}}.$$
     En particulier, $AB$ a une racine multiple si et seulement si $A$ ou $B$ en a une, ou si $A$ et $B$ ont une racine commune.

    **3.** On applique la question 2 à $X^{n} - 1 = (X - 1)P$. On a $\Delta(X - 1) = 1$, et $R(X - 1, P) = P(1) = n$ par le théorème 2. Donc $\Delta(X^{n} - 1) = n^{2}\Delta(P)$.

    Calculons $\Delta(X^{n} - 1)$ par le théorème 3. Les racines sont les $\zeta = \omega^{k}$, $0 \leqslant k \leqslant n - 1$, de produit $(-1)^{n + 1}$ ; la dérivée est $nX^{n - 1}$. Donc 
    $$R(X^{n} - 1, nX^{n - 1}) = \prod_{\zeta}n\zeta^{n - 1} = n^{n}\Big(\prod_{\zeta}\zeta\Big)^{-1} = (-1)^{n + 1}n^{n},$$
     et $\Delta(X^{n} - 1) = (-1)^{\frac{n(n - 1)}{2} + n + 1}n^{n}$. Il vient $\Delta(P) = (-1)^{\frac{n(n - 1)}{2} + n + 1}n^{n - 2}$.

    Les deux exposants ont même parité, car leur différence vaut 
    $$\frac{n(n - 1)}{2} + n + 1 - \frac{(n - 1)(n - 2)}{2} = (n - 1) + n + 1 = 2n.$$
     On retrouve bien le résultat de la question 1.
- id: "l3-sa-06-09"
  feuille: "f-l3-sa-06"
  numero: 9
