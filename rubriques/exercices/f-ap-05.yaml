- id: "ap-05-01"
  feuille: "f-ap-05"
  numero: 1
  partie: "Anneaux : définition et calculs"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux]
  noeuds: [a-anneau]
  notions: [anneau]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Les ensembles suivants, munis des deux lois indiquées, sont-ils des anneaux ? Le cas échéant, préciser s'ils sont commutatifs ; sinon, indiquer quel axiome échoue.

    **1.** $(\mathbb{N} \,;+\,;\times)$

    **2.** $(\mathbb{Z} \,;+\,;\times)$

    **3.** $(2\mathbb{Z} \,;+\,;\times)$

    **4.** $(\mathbb{Q} \,;+\,;\times)$

    **5.** $\big(\mathbb{R}^{\mathbb{R}} \,;+\,;\times\big)$, les opérations étant définies point par point.

    **6.** $\big(\mathbb{R}^{2} \,;+\,;\times\big)$, les opérations étant définies coordonnée par coordonnée.

    **7.** $\big(\mathcal{P}(E) \,;\Delta\,;\cap\big)$, où $\Delta$ désigne la différence symétrique du chapitre 1.
  corrige: |
    On suit l'ordre **NADA** : neutres, groupe abélien additif, distributivité, associativité multiplicative.

    **1.** L'ensemble $(\mathbb{N} \,;+)$ n'est pas un groupe, puisque $3$ n'y admet pas d'opposé. 
    $$\boxed{\text{Ce n'est pas un anneau : l'axiome \textbf{A} échoue.}}$$

    **2.** Les quatre axiomes sont vérifiés, et la multiplication est commutative : 
    $$\boxed{(\mathbb{Z} \,;+\,;\times) \text{ est un anneau commutatif, de neutres } 0 \text{ et } 1.}$$

    **3.** L'ensemble $(2\mathbb{Z} \,;+)$ est bien un groupe abélien, et la multiplication y est interne, associative et distributive. Mais $1 \notin 2\mathbb{Z}$ : 
    $$\boxed{\text{Ce n'est pas un anneau : il n'y a pas de neutre multiplicatif.}}$$

    **4.** On procède de la même manière, la multiplication des rationnels étant commutative : 
    $$\boxed{(\mathbb{Q} \,;+\,;\times) \text{ est un anneau commutatif.}}$$

    **5.** Les quatre axiomes se vérifient point par point, à partir de ceux de $\mathbb{R}$. Les neutres sont la fonction nulle et la fonction constante égale à $1$. 
    $$\boxed{\big(\mathbb{R}^{\mathbb{R}} \,;+\,;\times\big) \text{ est un anneau commutatif.}}$$

    **6.** De même, coordonnée par coordonnée, avec pour neutres $(0\,;0)$ et $(1\,;1)$. 
    $$\boxed{\big(\mathbb{R}^{2} \,;+\,;\times\big) \text{ est un anneau commutatif.}}$$

    **7.** D'après le chapitre 3, $\big(\mathcal{P}(E) \,;\Delta\big)$ est un groupe abélien de neutre $\varnothing$. L'intersection est associative, commutative, de neutre $E$, et elle est distributive sur $\Delta$ : pour $x \in E$, appartenir à $A \cap (B \,\Delta\, C)$ signifie appartenir à $A$ et à exactement l'un des deux ensembles $B$ et $C$, c'est-à-dire à exactement l'un des deux ensembles $A \cap B$ et $A \cap C$. 
    $$\boxed{\big(\mathcal{P}(E) \,;\Delta\,;\cap\big) \text{ est un anneau commutatif, dès que } E \neq \varnothing.}$$
     La restriction $E \neq \varnothing$ est nécessaire : sinon $\mathcal{P}(E)=\{\varnothing\}$ et les deux neutres coïncideraient, ce que la définition interdit.
- id: "ap-05-02"
  feuille: "f-ap-05"
  numero: 2
  partie: "Anneaux : définition et calculs"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [anneaux]
  noeuds: [a-anneau]
  notions: [anneau]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $(A \,;+\,;\times)$ un anneau, de neutres $0_{A}$ et $1_{A}$, et soient $x$ et $y$ deux éléments de $A$.

    **1.** Démontrer que $0_{A} \times x = 0_{A}$. On pourra partir de $0_{A}=0_{A}+0_{A}$.

    **2.** Démontrer que $(-x)y=-(xy)$, puis que $(-x)(-y)=xy$.

    **3.** Développer $(x+y)^{2}$, puis $(x+y)(x-y)$.

    **4.** À quelle condition retrouve-t-on les identités remarquables habituelles ?
  corrige: |
    **1.** On part de $0_{A}=0_{A}+0_{A}$ et l'on multiplie par $x$, en utilisant la distributivité : 
    $$0_{A} \times x = \big(0_{A}+0_{A}\big) \times x = 0_{A} \times x + 0_{A} \times x$$
     Comme $(A\,;+)$ est un groupe, on peut simplifier par $0_{A} \times x$ : 
    $$\boxed{0_{A} \times x = 0_{A}}$$

    **2.** On calcule, en utilisant la distributivité puis la question 1 : 
    $$xy+(-x)y = \big(x+(-x)\big)y = 0_{A} \times y = 0_{A}$$
     donc $(-x)y$ est l'opposé de $xy$ : 
    $$\boxed{(-x)y=-(xy)}$$
     En appliquant deux fois ce résultat : $(-x)(-y)=-\big(x(-y)\big)=-\big(-(xy)\big)$, d'où : 
    $$\boxed{(-x)(-y)=xy}$$

    **3.** On développe sans jamais échanger l'ordre des facteurs : 
    $$\boxed{(x+y)^{2}=x^{2}+xy+yx+y^{2}} \qquad\qquad \boxed{(x+y)(x-y)=x^{2}-xy+yx-y^{2}}$$

    **4.** Les deux termes centraux se regroupent en $2xy$ et se simplifient en $0_{A}$ précisément lorsque $xy=yx$. 
    $$\boxed{\text{Les identités remarquables usuelles ne valent que si } x \text{ et } y \text{ commutent.}}$$
     *Piège :* c'est en particulier le cas dans tout anneau commutatif, mais pas dans l'anneau des matrices carrées.
- id: "ap-05-03"
  feuille: "f-ap-05"
  numero: 3
  partie: "Anneaux : définition et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, diviseurs de zéro et nilpotents, éléments inversibles, corps]
  noeuds: [a-anneau, a-corps]
  notions: [anneau, anneau-integre, inversible, corps]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On rappelle qu'un élément $x$ non nul d'un anneau $A$ est un *diviseur de zéro* lorsqu'il existe $y$ non nul dans $A$ tel que $xy=0_{A}$.

    **1.** Exhiber deux diviseurs de zéro dans $\big(\mathbb{R}^{2} \,;+\,;\times\big)$.

    **2.** Vérifier que les fonctions $f : x \mapsto |x|+x$ et $g : x \mapsto |x|-x$ sont des diviseurs de zéro de $\big(\mathbb{R}^{\mathbb{R}} \,;+\,;\times\big)$.

    **3.** Exhiber deux diviseurs de zéro dans $\mathbb{Z}/6\mathbb{Z}$.

    **4.** Démontrer qu'un élément inversible d'un anneau n'est jamais un diviseur de zéro.

    **5.** En déduire qu'un corps ne possède aucun diviseur de zéro.
  corrige: |
    **1.** Les deux éléments $(1\,;0)$ et $(0\,;1)$ sont non nuls, et : 
    $$(1\,;0) \times (0\,;1) = (1 \times 0 \,;\, 0 \times 1) = (0\,;0)$$

    $$\boxed{(1\,;0) \text{ et } (0\,;1) \text{ sont des diviseurs de zéro de } \mathbb{R}^{2}.}$$

    **2.** Les fonctions $f$ et $g$ ne sont pas nulles, puisque $f(1)=2$ et $g(-1)=2$. Pourtant, pour tout réel $x$ : 
    $$f(x)g(x)=\big(|x|+x\big)\big(|x|-x\big)=|x|^{2}-x^{2}=x^{2}-x^{2}=0$$

    $$\boxed{f \text{ et } g \text{ sont des diviseurs de zéro de } \mathbb{R}^{\mathbb{R}}.}$$

    **3.** Dans $\mathbb{Z}/6\mathbb{Z}$, les classes $\overline{2}$ et $\overline{3}$ sont non nulles et $\overline{2} \times \overline{3} = \overline{6} = \overline{0}$. 
    $$\boxed{\overline{2} \text{ et } \overline{3} \text{ sont des diviseurs de zéro de } \mathbb{Z}/6\mathbb{Z}.}$$

    **4.** Soit $x$ inversible, et supposons $xy=0_{A}$. En multipliant à gauche par $x^{-1}$ : 
    $$y = 1_{A} \times y = \big(x^{-1}x\big)y = x^{-1}\big(xy\big) = x^{-1} \times 0_{A} = 0_{A}$$

    $$\boxed{\text{Un élément inversible n'est jamais un diviseur de zéro.}}$$

    **5.** Dans un corps, tout élément non nul est inversible, donc n'est pas un diviseur de zéro d'après la question 4. 
    $$\boxed{\text{Un corps ne possède aucun diviseur de zéro.}}$$
- id: "ap-05-04"
  feuille: "f-ap-05"
  numero: 4
  partie: "Anneaux : définition et calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, diviseurs de zéro et nilpotents]
  noeuds: [a-anneau]
  notions: [anneau, anneau-integre]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $A$ un anneau dans lequel $x^{2}=x$ pour tout $x \in A$. Un tel anneau est dit *de Boole*.

    **1.** En développant $(x+x)^{2}$, démontrer que $x+x=0_{A}$ pour tout $x \in A$, c'est-à-dire $-x=x$.

    **2.** En développant $(x+y)^{2}$, démontrer que $xy+yx=0_{A}$.

    **3.** En déduire que $A$ est commutatif.

    **4.** Vérifier que $\big(\mathcal{P}(E) \,;\Delta\,;\cap\big)$ est un anneau de Boole.
  corrige: |
    **1.** En appliquant l'hypothèse à l'élément $x+x$, puis en développant comme à l'exercice 2 : 
    $$x+x=(x+x)^{2}=x^{2}+x^{2}+x^{2}+x^{2}=x+x+x+x$$
     En simplifiant $x+x$ dans le groupe $(A\,;+)$, il vient : 
    $$\boxed{x+x=0_{A}, \text{ c'est-à-dire } -x=x, \text{ pour tout } x \in A.}$$

    **2.** On applique l'hypothèse à $x+y$ : 
    $$x+y=(x+y)^{2}=x^{2}+xy+yx+y^{2}=x+xy+yx+y$$
     En simplifiant $x+y$ des deux côtés : 
    $$\boxed{xy+yx=0_{A}}$$

    **3.** La question 2 donne $xy=-(yx)$, et la question 1 appliquée à l'élément $yx$ donne $-(yx)=yx$. 
    $$\boxed{xy=yx \text{ : l'anneau } A \text{ est commutatif.}}$$

    **4.** Dans $\mathcal{P}(E)$ muni de $\Delta$ et $\cap$, le carré d'un élément $A$ est $A \cap A = A$. 
    $$\boxed{\big(\mathcal{P}(E) \,;\Delta\,;\cap\big) \text{ est un anneau de Boole.}}$$
     On y vérifie d'ailleurs les deux résultats intermédiaires : $A \,\Delta\, A = \varnothing$ est bien le neutre additif, conformément à la question 1.
- id: "ap-05-05"
  feuille: "f-ap-05"
  numero: 5
  partie: "Anneaux : définition et calculs"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux, diviseurs de zéro et nilpotents, éléments inversibles]
  noeuds: [a-anneau]
  notions: [anneau, anneau-integre, inversible]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Un élément $x$ d'un anneau $A$ est dit *nilpotent* lorsqu'il existe un entier $n \geqslant 1$ tel que $x^{n}=0_{A}$. Dans les trois premières questions, l'anneau $A$ est supposé **commutatif**, et $x$ et $y$ désignent deux éléments nilpotents de $A$.

    **1.** Démontrer que $xy$ est nilpotent.

    **2.** Démontrer que $x+y$ est nilpotent. On pourra utiliser la formule du binôme, valable dans un anneau commutatif.

    **3.** Démontrer que $1_{A}-x$ est inversible, et préciser son inverse.

    **4.** Dans cette question, l'anneau $A$ n'est plus supposé commutatif. Soient $u$ et $v$ deux éléments de $A$ tels que $uv$ soit nilpotent. Démontrer que $vu$ l'est également.
  corrige: |
    **1.** Soient $n$ et $m$ tels que $x^{n}=0_{A}$ et $y^{m}=0_{A}$, et posons $p=\max(n\,;m)$. L'anneau étant commutatif : 
    $$(xy)^{p}=x^{p}y^{p}$$
     et l'un des deux facteurs est nul, puisque $p \geqslant n$ ou $p \geqslant m$ — en réalité les deux. 
    $$\boxed{xy \text{ est nilpotent.}}$$

    **2.** L'anneau étant commutatif, la formule du binôme s'applique : 
    $$(x+y)^{n+m-1}=\sum_{k=0}^{n+m-1} \binom{n+m-1}{k} \, x^{k}y^{\,n+m-1-k}$$
     Examinons un terme d'indice $k$. Si $k \geqslant n$, alors $x^{k}=0_{A}$. Sinon $k \leqslant n-1$, et l'exposant de $y$ vaut $n+m-1-k \geqslant m$, donc $y^{\,n+m-1-k}=0_{A}$. Tous les termes sont nuls. 
    $$\boxed{x+y \text{ est nilpotent.}}$$

    **3.** On reconnaît une somme géométrique. Avec $x^{n}=0_{A}$ : 
    $$(1_{A}-x)\big(1_{A}+x+x^{2}+\dots+x^{n-1}\big)=1_{A}-x^{n}=1_{A}$$
     les termes intermédiaires se télescopant. L'anneau étant commutatif, le produit dans l'autre ordre donne le même résultat. 
    $$\boxed{1_{A}-x \text{ est inversible, d'inverse } 1_{A}+x+\dots+x^{n-1}.}$$

    **4.** Soit $n$ tel que $(uv)^{n}=0_{A}$. On écrit alors : 
    $$(vu)^{n+1}=\underbrace{vu \cdot vu \cdots vu}_{n+1 \text{ facteurs}}=v\,\underbrace{(uv)(uv)\cdots(uv)}_{n \text{ facteurs}}\,u=v\,(uv)^{n}\,u=v \times 0_{A} \times u=0_{A}$$

    $$\boxed{vu \text{ est nilpotent.}}$$
     *Remarque :* ce regroupement ne demande que l'associativité, et non la commutativité. C'est pourquoi la question reste valable dans un anneau quelconque, contrairement aux trois précédentes.
- id: "ap-05-06"
  feuille: "f-ap-05"
  numero: 6
  partie: "Sous-anneaux"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux, sous-anneaux]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Dans chaque cas, déterminer si la partie $B$ est un sous-anneau de l'anneau $A$. On utilisera la caractérisation de la proposition 1.

    **1.** $A=\mathbb{Z}$ et $B=2\mathbb{Z}$.

    **2.** $A=\mathbb{Q}$ et $B=\mathbb{Z}$.

    **3.** $A=\mathbb{R}$ et $B=\mathbb{Q}$.

    **4.** $A=\mathbb{R}$ et $B=\big\{a+b\sqrt{3} \;\big|\; (a\,;b) \in \mathbb{Z}^{2}\big\}$.

    **5.** $A=\mathbb{R}^{\mathbb{R}}$ et $B$ est l'ensemble des fonctions continues sur $\mathbb{R}$.

    **6.** $A=\mathbb{R}^{\mathbb{R}}$ et $B=\big\{f \in \mathbb{R}^{\mathbb{R}} \;\big|\; f(0)=0\big\}$.

    **7.** $A=\mathbb{R}^{\mathbb{R}}$ et $B=\big\{f \in \mathbb{R}^{\mathbb{R}} \;\big|\; f(1)=f(2)\big\}$.
  corrige: |
    On applique la caractérisation : $1_{A} \in B$, puis stabilité par différence et par produit.

    **1.** L'entier $1$ n'est pas pair. 
    $$\boxed{2\mathbb{Z} \text{ n'est pas un sous-anneau de } \mathbb{Z} \text{ : il ne contient pas } 1.}$$

    **2.** On a $1 \in \mathbb{Z}$, et la différence comme le produit de deux entiers sont des entiers. 
    $$\boxed{\mathbb{Z} \text{ est un sous-anneau de } \mathbb{Q}.}$$

    **3.** Même argument avec les rationnels. 
    $$\boxed{\mathbb{Q} \text{ est un sous-anneau de } \mathbb{R}.}$$

    **4.** On a $1=1+0\sqrt{3}$. Soient $x=a+b\sqrt{3}$ et $y=c+d\sqrt{3}$ avec $a,b,c,d$ entiers : 
    $$x-y=(a-c)+(b-d)\sqrt{3} \qquad\text{et}\qquad xy=(ac+3bd)+(ad+bc)\sqrt{3}$$
     les coefficients obtenus étant entiers. 
    $$\boxed{B \text{ est un sous-anneau de } \mathbb{R}.}$$

    **5.** La fonction constante égale à $1$ est continue, et la différence comme le produit de deux fonctions continues le sont. 
    $$\boxed{B \text{ est un sous-anneau de } \mathbb{R}^{\mathbb{R}}.}$$

    **6.** La fonction constante égale à $1$ ne s'annule pas en $0$. 
    $$\boxed{B \text{ n'est pas un sous-anneau : il ne contient pas } 1_{\mathbb{R}^{\mathbb{R}}}.}$$
     *Piège :* cette partie est pourtant stable par différence et par produit. C'est bien la condition $1_{A} \in B$ qui fait défaut, et elle n'est pas une formalité.

    **7.** La fonction constante égale à $1$ vérifie $f(1)=f(2)$. Et si $f(1)=f(2)$ et $g(1)=g(2)$, alors : 
    $$(f-g)(1)=f(1)-g(1)=f(2)-g(2)=(f-g)(2) \qquad (fg)(1)=f(1)g(1)=f(2)g(2)=(fg)(2)$$

    $$\boxed{B \text{ est un sous-anneau de } \mathbb{R}^{\mathbb{R}}.}$$
- id: "ap-05-07"
  feuille: "f-ap-05"
  numero: 7
  partie: "Sous-anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, sous-anneaux, éléments inversibles, anneaux de nombres]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau, inversible]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    On appelle *entiers de Gauss* les nombres complexes de la forme $a+\mathrm{i}b$ avec $(a\,;b) \in \mathbb{Z}^{2}$, et l'on note $\mathbb{Z}[\mathrm{i}]$ leur ensemble.

    **1.** Démontrer que $\big(\mathbb{Z}[\mathrm{i}] \,;+\,;\times\big)$ est un sous-anneau de $(\mathbb{C} \,;+\,;\times)$.

    **2.** Pour tout nombre complexe $z$, on pose $N(z)=z\overline{z}$.

    **(a)** Démontrer que $N(z)N(z')=N(zz')$ pour tous complexes $z$ et $z'$.

    **(b)** Démontrer que $N(z)$ est un entier naturel pour tout entier de Gauss $z$.

    **(c)** Soit $z$ un entier de Gauss inversible *dans* $\mathbb{Z}[\mathrm{i}]$. Déduire des questions précédentes que $N(z)=1$.

    **(d)** Déterminer tous les éléments inversibles de $\mathbb{Z}[\mathrm{i}]$.
  corrige: |
    **1.** On a $1=1+\mathrm{i} \times 0 \in \mathbb{Z}[\mathrm{i}]$. Soient $z=a+\mathrm{i}b$ et $z'=c+\mathrm{i}d$ avec $a,b,c,d$ entiers : 
    $$z-z'=(a-c)+\mathrm{i}(b-d) \qquad\text{et}\qquad zz'=(ac-bd)+\mathrm{i}(ad+bc)$$
     Les quatre coefficients obtenus sont entiers. 
    $$\boxed{\mathbb{Z}[\mathrm{i}] \text{ est un sous-anneau de } \mathbb{C}.}$$

    **2. (a)** La conjugaison est un morphisme d'anneaux, donc $\overline{zz'}=\overline{z}\,\overline{z'}$ : 
    $$N(z)N(z')=z\overline{z}\,z'\overline{z'}=(zz')\big(\overline{z}\,\overline{z'}\big)=(zz')\overline{(zz')}=N(zz')$$

    $$\boxed{N(z)N(z')=N(zz')}$$

    **(b)** Pour $z=a+\mathrm{i}b$ avec $(a\,;b) \in \mathbb{Z}^{2}$ : 
    $$N(z)=z\overline{z}=(a+\mathrm{i}b)(a-\mathrm{i}b)=a^{2}+b^{2}$$
     somme de deux carrés d'entiers. 
    $$\boxed{N(z)=a^{2}+b^{2} \in \mathbb{N}}$$

    **(c)** Soit $z$ inversible dans $\mathbb{Z}[\mathrm{i}]$ : il existe $z' \in \mathbb{Z}[\mathrm{i}]$ tel que $zz'=1$. En appliquant $N$ : 
    $$N(z)N(z')=N(1)=1$$
     Or $N(z)$ et $N(z')$ sont deux entiers naturels de produit $1$ : ils valent tous deux $1$. 
    $$\boxed{N(z)=1}$$

    **(d)** La condition $a^{2}+b^{2}=1$ avec $a$ et $b$ entiers impose $(a\,;b) \in \{(1\,;0)\,;(-1\,;0)\,;(0\,;1)\,;(0\,;-1)\}$. Réciproquement, ces quatre nombres sont bien inversibles dans $\mathbb{Z}[\mathrm{i}]$, puisque $1 \times 1=1$, $(-1) \times (-1)=1$ et $\mathrm{i} \times (-\mathrm{i})=1$. 
    $$\boxed{\text{Les inversibles de } \mathbb{Z}[\mathrm{i}] \text{ sont } 1, \; -1, \; \mathrm{i} \text{ et } -\mathrm{i}.}$$
     On reconnaît le groupe $\mathbb{U}_{4}$ du chapitre 4.
- id: "ap-05-08"
  feuille: "f-ap-05"
  numero: 8
  partie: "Sous-anneaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux, sous-anneaux, éléments inversibles]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau, inversible]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    On considère l'ensemble des rationnels admettant une écriture à dénominateur impair : 
    $$A=\left\{\frac{m}{n} \;\middle|\; m \in \mathbb{Z}, \; n \in 2\mathbb{N}+1\right\}$$

    **1.** Démontrer que $A$ est un sous-anneau de $(\mathbb{Q} \,;+\,;\times)$.

    **2.** Déterminer les éléments inversibles de $(A \,;+\,;\times)$.
  corrige: |
    **1.** On a $1=\dfrac{1}{1} \in A$, le dénominateur $1$ étant impair. Soient $x=\dfrac{m}{n}$ et $y=\dfrac{m'}{n'}$ deux éléments de $A$, avec $n$ et $n'$ impairs. Alors : 
    $$x-y=\frac{mn'-m'n}{nn'} \qquad\text{et}\qquad xy=\frac{mm'}{nn'}$$
     Le produit $nn'$ de deux entiers impairs est impair, et les numérateurs sont entiers. 
    $$\boxed{A \text{ est un sous-anneau de } \mathbb{Q}.}$$

    **2.** Soit $x$ un élément non nul de $A$, écrit sous forme irréductible $x=\dfrac{m}{n}$ avec $n>0$. Ce dénominateur est nécessairement impair : il divise le dénominateur impair d'une écriture quelconque de $x$.

    L'élément $x$ est inversible dans $A$ si et seulement si $\dfrac{1}{x}=\dfrac{n}{m}$ appartient à $A$. Cette fraction étant déjà irréductible, cela équivaut à ce que $|m|$ soit impair. 
    $$\boxed{\begin{array}{l} \text{Les inversibles de } A \text{ sont les fractions } \dfrac{m}{n} \text{ irréductibles} \\[2mm] \text{dont le numérateur \emph{et} le dénominateur sont impairs.} \end{array}}$$
     Par exemple $\dfrac{3}{5}$ est inversible, alors que $\dfrac{2}{5}$ ne l'est pas : son inverse $\dfrac{5}{2}$ a un dénominateur pair.
- id: "ap-05-09"
  feuille: "f-ap-05"
  numero: 9
  partie: "Sous-anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, sous-anneaux]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soient $B$ et $C$ deux sous-anneaux d'un anneau $A$.

    **1.** Démontrer que $B \cap C$ est un sous-anneau de $A$.

    **2.** On prend $A=\mathbb{Q}^{2}$, muni des lois coordonnée par coordonnée, $B=\mathbb{Q} \times \mathbb{Z}$ et $C=\mathbb{Z} \times \mathbb{Q}$. Vérifier que $B$ et $C$ sont deux sous-anneaux de $A$, puis démontrer que $B \cup C$ n'en est pas un.

    **3.** L'intersection d'une famille quelconque de sous-anneaux de $A$ est-elle un sous-anneau ? Justifier.
  corrige: |
    **1.** On a $B \cap C \subset A$. De plus $1_{A}$ appartient à $B$ et à $C$, donc à $B \cap C$. Soient enfin $x$ et $y$ dans $B \cap C$. Comme $B$ est un sous-anneau, $x-y$ et $xy$ appartiennent à $B$ ; comme $C$ en est un, ils appartiennent aussi à $C$. 
    $$\boxed{B \cap C \text{ est un sous-anneau de } A.}$$

    **2.** Le couple $(1\,;1)$ appartient à $\mathbb{Q} \times \mathbb{Z}$ comme à $\mathbb{Z} \times \mathbb{Q}$. Les deux parties sont stables par différence et par produit, ceux-ci se calculant coordonnée par coordonnée : ce sont bien deux sous-anneaux de $\mathbb{Q}^{2}$.

    Considérons alors $\left(\dfrac{1}{2}\,;1\right) \in B$ et $\left(1\,;\dfrac{1}{2}\right) \in C$. Leur somme vaut : 
    $$\left(\frac{3}{2} \,;\, \frac{3}{2}\right)$$
     dont aucune des deux coordonnées n'est entière : elle n'appartient ni à $B$, ni à $C$. 
    $$\boxed{B \cup C \text{ n'est pas stable par addition, donc n'est pas un sous-anneau de } \mathbb{Q}^{2}.}$$

    **3.** Soit $(B_{i})_{i \in I}$ une famille de sous-anneaux de $A$, et $B=\bigcap_{i \in I} B_{i}$. Chaque $B_{i}$ contient $1_{A}$, donc $B$ aussi. Et si $x$ et $y$ appartiennent à $B$, alors pour tout $i$ les éléments $x-y$ et $xy$ appartiennent à $B_{i}$, donc à $B$. 
    $$\boxed{\text{Oui : une intersection quelconque de sous-anneaux est un sous-anneau.}}$$
     On retrouve l'asymétrie déjà rencontrée aux chapitres 3 et 4 : l'intersection se comporte bien, la réunion non.
- id: "ap-05-10"
  feuille: "f-ap-05"
  numero: 10
  partie: "L'anneau $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: []
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Effectuer les calculs suivants dans $\mathbb{Z}/7\mathbb{Z}$ :

    **(a)** $\overline{5}+\overline{4}$

    **(b)** $\overline{3} \times \overline{5}$

    **(c)** $\overline{6}^{\,2}$

    **(d)** $\overline{2}^{\,5}$

    **2.** Effectuer les calculs suivants dans $\mathbb{Z}/12\mathbb{Z}$ :

    **(a)** $\overline{7}+\overline{8}$

    **(b)** $\overline{5} \times \overline{9}$

    **(c)** $\overline{4} \times \overline{3}$

    **(d)** l'opposé de $\overline{1}$

    **3.** Déterminer le reste de la division euclidienne de $3^{100}$ par $7$. On pourra commencer par calculer les puissances successives de $\overline{3}$ dans $\mathbb{Z}/7\mathbb{Z}$.
  corrige: |
    **1.** On calcule sur les représentants, puis on réduit modulo $7$. 
    $$\boxed{\overline{5}+\overline{4}=\overline{9}=\overline{2} \qquad \overline{3} \times \overline{5}=\overline{15}=\overline{1} \qquad \overline{6}^{\,2}=\overline{36}=\overline{1} \qquad \overline{2}^{\,5}=\overline{32}=\overline{4}}$$
     puisque $9=7+2$, $15=2 \times 7+1$, $36=5 \times 7+1$ et $32=4 \times 7+4$.

    **2.** On procède de même modulo $12$. 
    $$\boxed{\overline{7}+\overline{8}=\overline{15}=\overline{3} \qquad \overline{5} \times \overline{9}=\overline{45}=\overline{9} \qquad \overline{4} \times \overline{3}=\overline{12}=\overline{0} \qquad -\overline{1}=\overline{11}}$$
     Le troisième calcul fournit au passage deux diviseurs de zéro de $\mathbb{Z}/12\mathbb{Z}$.

    **3.** On calcule les puissances successives de $\overline{3}$ dans $\mathbb{Z}/7\mathbb{Z}$ : 
    $$\overline{3}^{\,1}=\overline{3} \quad \overline{3}^{\,2}=\overline{2} \quad \overline{3}^{\,3}=\overline{6} \quad \overline{3}^{\,4}=\overline{4} \quad \overline{3}^{\,5}=\overline{5} \quad \overline{3}^{\,6}=\overline{1}$$
     La suite est donc périodique de période $6$. Or $100=6 \times 16+4$, d'où : 
    $$\overline{3}^{\,100}=\big(\overline{3}^{\,6}\big)^{16} \times \overline{3}^{\,4}=\overline{1}^{16} \times \overline{4}=\overline{4}$$

    $$\boxed{\text{Le reste de la division de } 3^{100} \text{ par } 7 \text{ vaut } 4.}$$
- id: "ap-05-11"
  feuille: "f-ap-05"
  numero: 11
  partie: "L'anneau $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux, diviseurs de zéro et nilpotents, éléments inversibles, corps]
  noeuds: [a-anneau, a-corps]
  notions: [anneau, anneau-integre, inversible, corps]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Dresser la table de multiplication de $\mathbb{Z}/8\mathbb{Z}$.

    **2.** En déduire la liste des éléments inversibles de $\mathbb{Z}/8\mathbb{Z}$, ainsi que l'inverse de chacun. Que remarque-t-on ?

    **3.** En déduire la liste des diviseurs de zéro de $\mathbb{Z}/8\mathbb{Z}$.

    **4.** L'anneau $\mathbb{Z}/8\mathbb{Z}$ est-il un corps ? Le théorème 1 permettait-il de le prévoir ?
  corrige: |
    **1.** On calcule chaque produit $ij$ puis son reste modulo $8$.

    $$\begin{array}{|c||c|c|c|c|c|c|c|c|} \hline \times & \overline{0} & \overline{1} & \overline{2} & \overline{3} & \overline{4} & \overline{5} & \overline{6} & \overline{7} \\ \hline \overline{0} & \overline{0} & \overline{0} & \overline{0} & \overline{0} & \overline{0} & \overline{0} & \overline{0} & \overline{0} \\ \hline \overline{1} & \overline{0} & \overline{1} & \overline{2} & \overline{3} & \overline{4} & \overline{5} & \overline{6} & \overline{7} \\ \hline \overline{2} & \overline{0} & \overline{2} & \overline{4} & \overline{6} & \overline{0} & \overline{2} & \overline{4} & \overline{6} \\ \hline \overline{3} & \overline{0} & \overline{3} & \overline{6} & \overline{1} & \overline{4} & \overline{7} & \overline{2} & \overline{5} \\ \hline \overline{4} & \overline{0} & \overline{4} & \overline{0} & \overline{4} & \overline{0} & \overline{4} & \overline{0} & \overline{4} \\ \hline \overline{5} & \overline{0} & \overline{5} & \overline{2} & \overline{7} & \overline{4} & \overline{1} & \overline{6} & \overline{3} \\ \hline \overline{6} & \overline{0} & \overline{6} & \overline{4} & \overline{2} & \overline{0} & \overline{6} & \overline{4} & \overline{2} \\ \hline \overline{7} & \overline{0} & \overline{7} & \overline{6} & \overline{5} & \overline{4} & \overline{3} & \overline{2} & \overline{1} \\ \hline \end{array}$$

    **2.** Les lignes contenant le neutre $\overline{1}$, signalé en ocre, sont celles de $\overline{1}$, $\overline{3}$, $\overline{5}$ et $\overline{7}$. Dans chacune, le $\overline{1}$ se trouve sur la diagonale. 
    $$\boxed{\text{Les inversibles sont } \overline{1}, \, \overline{3}, \, \overline{5}, \, \overline{7}, \text{ et chacun est son propre inverse.}}$$
     Ce sont exactement les classes des entiers impairs, c'est-à-dire des entiers premiers avec $8$.

    **3.** Les zéros situés hors de la première ligne et de la première colonne, en bleu pétrole, signalent les diviseurs de zéro. 
    $$\boxed{\text{Les diviseurs de zéro sont } \overline{2}, \, \overline{4} \text{ et } \overline{6}.}$$

    **4.** Les classes $\overline{2}$, $\overline{4}$ et $\overline{6}$ sont non nulles et non inversibles. 
    $$\boxed{\mathbb{Z}/8\mathbb{Z} \text{ n'est pas un corps, ce que le théorème 1 prévoyait puisque } 8=2^{3} \text{ n'est pas premier.}}$$
     On observe de plus que chaque classe non nulle est *soit* inversible, *soit* diviseur de zéro : c'est le résultat général de l'exercice 16.
- id: "ap-05-12"
  feuille: "f-ap-05"
  numero: 12
  partie: "L'anneau $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Calcul]
  mots_cles: []
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Résoudre les équations suivantes, d'inconnue $\overline{x}$.

    **1.** $\overline{3}\,\overline{x}=\overline{2}$ dans $\mathbb{Z}/7\mathbb{Z}$

    **2.** $\overline{3}\,\overline{x}=\overline{0}$ dans $\mathbb{Z}/12\mathbb{Z}$

    **3.** $\overline{x}^{\,2}=\overline{1}$ dans $\mathbb{Z}/5\mathbb{Z}$

    **4.** $\overline{x}^{\,2}=\overline{1}$ dans $\mathbb{Z}/8\mathbb{Z}$

    Comparer les deux dernières réponses, et expliquer l'écart à l'aide du théorème 1.
  corrige: |
    **1.** L'entier $7$ étant premier, $\overline{3}$ est inversible dans $\mathbb{Z}/7\mathbb{Z}$, et $\overline{3} \times \overline{5}=\overline{15}=\overline{1}$ donne $\overline{3}^{\,-1}=\overline{5}$. En multipliant l'équation par $\overline{5}$ : 
    $$\overline{x}=\overline{5} \times \overline{2}=\overline{10}=\overline{3} \qquad\text{d'où}\qquad \boxed{\mathcal{S}=\big\{\overline{3}\big\}}$$

    **2.** Ici $\overline{3}$ n'est pas inversible dans $\mathbb{Z}/12\mathbb{Z}$, et l'on ne peut pas simplifier. On teste donc les douze classes, ou l'on remarque que $3x \equiv 0 \; [12]$ équivaut à $12 \mid 3x$, c'est-à-dire $4 \mid x$ : 
    $$\boxed{\mathcal{S}=\big\{\overline{0} \,;\, \overline{4} \,;\, \overline{8}\big\}}$$

    **3.** On calcule les cinq carrés de $\mathbb{Z}/5\mathbb{Z}$ : $\overline{0}$, $\overline{1}$, $\overline{4}$, $\overline{4}$, $\overline{1}$. 
    $$\boxed{\mathcal{S}=\big\{\overline{1} \,;\, \overline{4}\big\}}$$

    **4.** La diagonale de la table de l'exercice 11 donne les huit carrés : $\overline{0}$, $\overline{1}$, $\overline{4}$, $\overline{1}$, $\overline{0}$, $\overline{1}$, $\overline{4}$, $\overline{1}$. 
    $$\boxed{\mathcal{S}=\big\{\overline{1} \,;\, \overline{3} \,;\, \overline{5} \,;\, \overline{7}\big\}}$$

    **Comparaison.** L'équation $\overline{x}^{\,2}=\overline{1}$ s'écrit $(\overline{x}-\overline{1})(\overline{x}+\overline{1})=\overline{0}$. Dans $\mathbb{Z}/5\mathbb{Z}$, qui est un corps d'après le théorème 1, il n'y a pas de diviseur de zéro : l'un des deux facteurs est nul, d'où au plus deux solutions. Dans $\mathbb{Z}/8\mathbb{Z}$, qui n'est pas un corps, le produit peut être nul sans qu'aucun facteur ne le soit — par exemple pour $\overline{x}=\overline{3}$, où $\overline{2} \times \overline{4}=\overline{0}$. 
    $$\boxed{\text{C'est l'absence de diviseurs de zéro qui limite le nombre de solutions dans un corps.}}$$
- id: "ap-05-13"
  feuille: "f-ap-05"
  numero: 13
  partie: "L'anneau $\\mathbb{Z}/n\\mathbb{Z}$"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: []
  noeuds: []
  notions: []
  page_enonce: 3
  page_corrige: 7
  enonce: |
    **1.** Donner la liste des éléments de $\mathbb{Z}/7\mathbb{Z}$ qui sont des carrés. Combien y en a-t-il ?

    **2.** Soit $\overline{a}$ un élément de $\mathbb{Z}/7\mathbb{Z}$. Déterminer le nombre d'éléments de l'ensemble : 
    $$\mathcal{A}=\big\{-\overline{x}^{\,2}+\overline{a} \;\big|\; \overline{x} \in \mathbb{Z}/7\mathbb{Z}\big\}$$

    **3.** En comparant le nombre d'éléments de $\mathcal{A}$ et celui de l'ensemble des carrés, démontrer que l'équation $\overline{x}^{\,2}+\overline{y}^{\,2}=\overline{a}$ admet toujours une solution dans $\mathbb{Z}/7\mathbb{Z}$.

    **4.** Donner explicitement un couple $(u\,;v)$ d'entiers relatifs tel que $u^{2}+v^{2} \equiv -1 \; [7]$.
  corrige: |
    **1.** On calcule les sept carrés de $\mathbb{Z}/7\mathbb{Z}$ : 
    $$\overline{0}^{\,2}=\overline{0} \quad \overline{1}^{\,2}=\overline{1} \quad \overline{2}^{\,2}=\overline{4} \quad \overline{3}^{\,2}=\overline{2} \quad \overline{4}^{\,2}=\overline{2} \quad \overline{5}^{\,2}=\overline{4} \quad \overline{6}^{\,2}=\overline{1}$$

    $$\boxed{\text{Les carrés de } \mathbb{Z}/7\mathbb{Z} \text{ sont } \overline{0}, \, \overline{1}, \, \overline{2} \text{ et } \overline{4} \text{ : il y en a } 4.}$$

    **2.** Notons $\mathcal{C}$ l'ensemble des carrés. Par définition, $\mathcal{A}=\{\overline{a}-\overline{c} \mid \overline{c} \in \mathcal{C}\}$. L'application $\overline{c} \mapsto \overline{a}-\overline{c}$ est injective, puisque $\overline{a}-\overline{c}=\overline{a}-\overline{c}\,'$ entraîne $\overline{c}=\overline{c}\,'$ dans le groupe $(\mathbb{Z}/7\mathbb{Z}\,;+)$. 
    $$\boxed{\mathcal{A} \text{ possède } 4 \text{ éléments.}}$$

    **3.** Les ensembles $\mathcal{C}$ et $\mathcal{A}$ sont deux parties de $\mathbb{Z}/7\mathbb{Z}$, qui compte $7$ éléments. Or : 
    $$\mathrm{card}\,\mathcal{C}+\mathrm{card}\,\mathcal{A}=4+4=8>7$$
     Ils ne peuvent donc pas être disjoints. Soit alors $\overline{z}$ un élément commun : il existe $\overline{y}$ tel que $\overline{z}=\overline{y}^{\,2}$, et il existe $\overline{x}$ tel que $\overline{z}=-\overline{x}^{\,2}+\overline{a}$. En égalant : 
    $$\overline{y}^{\,2}=-\overline{x}^{\,2}+\overline{a} \qquad\text{c'est-à-dire}\qquad \overline{x}^{\,2}+\overline{y}^{\,2}=\overline{a}$$

    $$\boxed{\text{L'équation } \overline{x}^{\,2}+\overline{y}^{\,2}=\overline{a} \text{ admet une solution pour tout } \overline{a} \in \mathbb{Z}/7\mathbb{Z}.}$$

    **4.** On applique ce qui précède à $\overline{a}=-\overline{1}=\overline{6}$. Parmi les carrés, on cherche deux valeurs de somme $\overline{6}$ : les carrés $\overline{2}$ et $\overline{4}$ conviennent, atteints respectivement en $\overline{3}$ et $\overline{2}$. 
    $$3^{2}+2^{2}=9+4=13=7+6$$

    $$\boxed{(u\,;v)=(3\,;2) \text{ convient : } 3^{2}+2^{2} \equiv -1 \; [7].}$$
- id: "ap-05-14"
  feuille: "f-ap-05"
  numero: 14
  partie: "Corps"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [anneaux, éléments inversibles, corps]
  noeuds: [a-anneau, a-corps]
  notions: [anneau, inversible, corps]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Les anneaux suivants sont-ils des corps ? Justifier, en exhibant le cas échéant un élément non nul non inversible.

    **1.** $(\mathbb{Z} \,;+\,;\times)$

    **2.** $(\mathbb{Q} \,;+\,;\times)$

    **3.** $\mathbb{Z}/5\mathbb{Z}$

    **4.** $\mathbb{Z}/6\mathbb{Z}$

    **5.** $\mathbb{Z}/11\mathbb{Z}$

    **6.** $\mathbb{Z}/12\mathbb{Z}$

    **7.** $\big(\mathbb{R}^{2} \,;+\,;\times\big)$

    **8.** $\big(\mathbb{R}^{\mathbb{R}} \,;+\,;\times\big)$
  corrige: |
    ```tableau
     ¦ **Corps ?** ¦ **Justification**
    $(\mathbb{Z} \,;+\,;\times)$ ¦ non ¦ $2$ est non nul et non inversible.
    $(\mathbb{Q} \,;+\,;\times)$ ¦ **oui** ¦ Tout rationnel non nul $\frac{p}{q}$ a pour inverse $\frac{q}{p}$.
    $\mathbb{Z}/5\mathbb{Z}$ ¦ **oui** ¦ $5$ est premier (théorème 1).
    $\mathbb{Z}/6\mathbb{Z}$ ¦ non ¦ $6=2 \times 3$ n'est pas premier ; $\overline{2}$ n'est pas inversible.
    $\mathbb{Z}/11\mathbb{Z}$ ¦ **oui** ¦ $11$ est premier.
    $\mathbb{Z}/12\mathbb{Z}$ ¦ non ¦ $12$ n'est pas premier ; $\overline{4}$ n'est pas inversible.
    $\big(\mathbb{R}^{2} \,;+\,;\times\big)$ ¦ non ¦ $(1\,;0)$ est un diviseur de zéro (exercice 3).
    $\big(\mathbb{R}^{\mathbb{R}} \,;+\,;\times\big)$ ¦ non ¦ Les fonctions de l'exercice 3 sont des diviseurs de zéro.
    ```

    *Piège :* pour les deux derniers, il ne suffit pas de dire qu'une fonction peut s'annuler. C'est la présence de *diviseurs de zéro* qui interdit d'être un corps, d'après la question 5 de l'exercice 3.
- id: "ap-05-15"
  feuille: "f-ap-05"
  numero: 15
  partie: "Corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [corps]
  noeuds: [a-corps]
  notions: [corps]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Démontrer que les deux ensembles suivants, munis de l'addition et de la multiplication usuelles, sont des corps.

    **1.** $\mathbb{Q}[\mathrm{i}]=\big\{a+\mathrm{i}b \;\big|\; (a\,;b) \in \mathbb{Q}^{2}\big\}$.

    **2.** $\mathbb{Q}\big[\sqrt{d}\,\big]=\big\{a+b\sqrt{d} \;\big|\; (a\,;b) \in \mathbb{Q}^{2}\big\}$, où $d$ est un entier naturel tel que $\sqrt{d} \notin \mathbb{Q}$.

    Pour la seconde question, on prendra garde à justifier que le dénominateur intervenant dans l'inverse ne s'annule pas.
  corrige: |
    **1.** *Sous-anneau de $\mathbb{C}$.* On a $1=1+\mathrm{i} \times 0 \in \mathbb{Q}[\mathrm{i}]$, et les calculs de l'exercice 7 restent valables avec des coefficients rationnels : 
    $$(a+\mathrm{i}b)-(c+\mathrm{i}d)=(a-c)+\mathrm{i}(b-d) \qquad (a+\mathrm{i}b)(c+\mathrm{i}d)=(ac-bd)+\mathrm{i}(ad+bc)$$

    *Commutativité.* Elle est héritée de $\mathbb{C}$.

    *Inversibles.* Soit $z=a+\mathrm{i}b$ non nul, c'est-à-dire $(a\,;b) \neq (0\,;0)$. Alors $a^{2}+b^{2}$ est un rationnel strictement positif, et : 
    $$\frac{1}{a+\mathrm{i}b}=\frac{a-\mathrm{i}b}{a^{2}+b^{2}}=\frac{a}{a^{2}+b^{2}}-\mathrm{i}\,\frac{b}{a^{2}+b^{2}}$$
     dont les deux coefficients sont rationnels. 
    $$\boxed{\mathbb{Q}[\mathrm{i}] \text{ est un corps.}}$$

    **2.** *Sous-anneau de $\mathbb{R}$.* On a $1=1+0\sqrt{d}$, et : 
    $$\big(a+b\sqrt{d}\,\big)-\big(c+e\sqrt{d}\,\big)=(a-c)+(b-e)\sqrt{d} \qquad \big(a+b\sqrt{d}\,\big)\big(c+e\sqrt{d}\,\big)=(ac+d\,be)+(ae+bc)\sqrt{d}$$

    *Inversibles.* Soit $x=a+b\sqrt{d}$ non nul. Montrons d'abord que $a^{2}-db^{2} \neq 0$. Supposons le contraire.

    • Si $b=0$, alors $a^{2}=0$, donc $a=0$ et $x=0$ : exclu.

    • Si $b \neq 0$, alors $d=\left(\dfrac{a}{b}\right)^{2}$, donc $\sqrt{d}=\left|\dfrac{a}{b}\right| \in \mathbb{Q}$, ce qui contredit l'hypothèse.

    Le dénominateur ne s'annule donc jamais, et l'on peut écrire : 
    $$\frac{1}{a+b\sqrt{d}}=\frac{a-b\sqrt{d}}{a^{2}-db^{2}}=\frac{a}{a^{2}-db^{2}}-\frac{b}{a^{2}-db^{2}}\sqrt{d}$$

    $$\boxed{\mathbb{Q}\big[\sqrt{d}\,\big] \text{ est un corps.}}$$
     *Piège :* l'hypothèse $\sqrt{d} \notin \mathbb{Q}$ n'est pas décorative. Sans elle, $a^{2}-db^{2}$ pourrait s'annuler pour un $x$ non nul — et de fait, si $\sqrt{d}$ était rationnel, l'ensemble se réduirait à $\mathbb{Q}$.
- id: "ap-05-16"
  feuille: "f-ap-05"
  numero: 16
  partie: "Corps"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [diviseurs de zéro et nilpotents, éléments inversibles, théorème de Bézout]
  noeuds: [a-anneau, z-bezout]
  notions: [anneau-integre, inversible]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $n \geqslant 2$ un entier. On admet le théorème de Bézout : deux entiers $x$ et $n$ sont premiers entre eux si et seulement s'il existe $(u\,;v) \in \mathbb{Z}^{2}$ tel que $xu+nv=1$.

    **1.** Démontrer que $\overline{x}$ est inversible dans $\mathbb{Z}/n\mathbb{Z}$ si et seulement si $x$ et $n$ sont premiers entre eux.

    **2.** Application : déterminer les éléments inversibles de $\mathbb{Z}/10\mathbb{Z}$, ainsi que l'inverse de chacun.

    **3.** Soit $\overline{x}$ un élément non nul de $\mathbb{Z}/n\mathbb{Z}$ non inversible. Démontrer que $\overline{x}$ est un diviseur de zéro.

    **4.** Retrouver le théorème 1 du cours à l'aide de la question 1.
  corrige: |
    **1.** La classe $\overline{x}$ est inversible dans $\mathbb{Z}/n\mathbb{Z}$ si et seulement s'il existe $\overline{u}$ tel que $\overline{x}\,\overline{u}=\overline{1}$, c'est-à-dire : 
    $$\exists u \in \mathbb{Z}, \; xu \equiv 1 \; [n] \iff \exists (u\,;v) \in \mathbb{Z}^{2}, \; xu=1+(-v)n \iff \exists (u\,;v) \in \mathbb{Z}^{2}, \; xu+nv=1$$
     et le théorème de Bézout identifie cette dernière condition à la primalité entre $x$ et $n$. 
    $$\boxed{\overline{x} \text{ est inversible dans } \mathbb{Z}/n\mathbb{Z} \iff x \text{ et } n \text{ sont premiers entre eux.}}$$

    **2.** Les entiers de $[\![0\,;9]\!]$ premiers avec $10$ sont $1$, $3$, $7$ et $9$. On cherche les inverses en balayant les produits : 
    $$\overline{1} \times \overline{1}=\overline{1} \qquad \overline{3} \times \overline{7}=\overline{21}=\overline{1} \qquad \overline{9} \times \overline{9}=\overline{81}=\overline{1}$$

    $$\boxed{\overline{1}^{\,-1}=\overline{1} \qquad \overline{3}^{\,-1}=\overline{7} \qquad \overline{7}^{\,-1}=\overline{3} \qquad \overline{9}^{\,-1}=\overline{9}}$$

    **3.** Soit $\overline{x}$ non nul et non inversible. D'après la question 1, $x$ et $n$ ne sont pas premiers entre eux : notons $d>1$ leur plus grand diviseur commun. Posons $y=\dfrac{n}{d}$, qui est un entier vérifiant $1 \leqslant y < n$, donc $\overline{y} \neq \overline{0}$. Comme $d$ divise $x$ : 
    $$xy = x \times \frac{n}{d} = \frac{x}{d} \times n \equiv 0 \; [n]$$

    $$\boxed{\overline{x}\,\overline{y}=\overline{0} \text{ avec } \overline{y} \neq \overline{0} \text{ : la classe } \overline{x} \text{ est un diviseur de zéro.}}$$
     Dans $\mathbb{Z}/n\mathbb{Z}$, tout élément non nul est donc *soit* inversible, *soit* diviseur de zéro : il n'y a pas de troisième possibilité.

    **4.** D'après la question 1, $\mathbb{Z}/n\mathbb{Z}$ est un corps si et seulement si tout entier $x$ de $[\![1\,;n-1]\!]$ est premier avec $n$, c'est-à-dire si $n$ n'admet aucun diviseur strictement compris entre $1$ et $n$. 
    $$\boxed{\mathbb{Z}/n\mathbb{Z} \text{ est un corps si et seulement si } n \text{ est premier.}}$$
- id: "ap-05-17"
  feuille: "f-ap-05"
  numero: 17
  partie: "Morphismes d'anneaux"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [anneaux, "morphismes d'anneaux"]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau]
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Les applications suivantes sont-elles des morphismes d'anneaux ? Justifier, en précisant le cas échéant laquelle des trois conditions échoue.

    **1.** $z \mapsto \overline{z}$ de $\mathbb{C}$ dans $\mathbb{C}$.

    **2.** $x \mapsto \overline{x}$ de $\mathbb{Z}$ dans $\mathbb{Z}/n\mathbb{Z}$.

    **3.** $f \mapsto f(a)$ de $\mathbb{R}^{\mathbb{R}}$ dans $\mathbb{R}$, où $a$ est un réel fixé.

    **4.** $x \mapsto 2x$ de $\mathbb{Z}$ dans $\mathbb{Z}$.

    **5.** $z \mapsto |z|$ de $\mathbb{C}$ dans $\mathbb{R}$.

    **6.** $x \mapsto (x\,;x)$ de $\mathbb{Z}$ dans $\mathbb{Z}^{2}$.

    **7.** $x \mapsto (x\,;0)$ de $\mathbb{Z}$ dans $\mathbb{Z}^{2}$.

    **8.** $x \mapsto x^{2}$ de $\mathbb{Z}$ dans $\mathbb{Z}$.
  corrige: |
    Trois conditions sont à vérifier : $\varphi$ est un morphisme pour l'addition, $\varphi(xy)=\varphi(x)\varphi(y)$, et $\varphi(1_{A})=1_{B}$.

    **1.** La conjugaison respecte la somme et le produit, et $\overline{1}=1$. $\boxed{\text{Morphisme d'anneaux.}}$

    **2.** C'est exactement la proposition 2 du cours, qui définit les deux lois de $\mathbb{Z}/n\mathbb{Z}$ par $\overline{x}+\overline{y}=\overline{x+y}$ et $\overline{x}\,\overline{y}=\overline{xy}$, et l'on a $\overline{1}=1_{\mathbb{Z}/n\mathbb{Z}}$. $\boxed{\text{Morphisme d'anneaux.}}$

    **3.** On a $(f+g)(a)=f(a)+g(a)$, $(fg)(a)=f(a)g(a)$, et la fonction constante égale à $1$ vaut $1$ en $a$. $\boxed{\text{Morphisme d'anneaux.}}$

    **4.** L'application est additive, mais $\varphi(1)=2 \neq 1$. $\boxed{\text{Non : la condition sur } 1 \text{ échoue.}}$

    **5.** On a $|1+(-1)|=0$ alors que $|1|+|-1|=2$. $\boxed{\text{Non : l'application n'est pas additive.}}$

    **6.** On a $\varphi(x+y)=(x+y\,;x+y)=\varphi(x)+\varphi(y)$, $\varphi(xy)=(xy\,;xy)=\varphi(x)\varphi(y)$, et $\varphi(1)=(1\,;1)=1_{\mathbb{Z}^{2}}$. $\boxed{\text{Morphisme d'anneaux.}}$

    **7.** L'application est additive et multiplicative, car $(x\,;0)(y\,;0)=(xy\,;0)$. Mais $\varphi(1)=(1\,;0)$, alors que le neutre de $\mathbb{Z}^{2}$ est $(1\,;1)$. $\boxed{\text{Non : la condition sur } 1 \text{ échoue.}}$

    **8.** On a $\varphi(1+1)=4$ alors que $\varphi(1)+\varphi(1)=2$. $\boxed{\text{Non : l'application n'est pas additive.}}$

    *Piège de la question 7 :* cette application satisfait les deux conditions portant sur les lois, et échoue uniquement sur $\varphi(1_{A})=1_{B}$. C'est la meilleure justification de la remarque du cours : cette condition doit être exigée séparément, car elle ne se déduit pas des autres.
- id: "ap-05-18"
  feuille: "f-ap-05"
  numero: 18
  partie: "Morphismes d'anneaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux, sous-anneaux, "morphismes d'anneaux", noyau et idéal]
  noeuds: [a-anneau, a-morph-anneau, a-ideal]
  notions: [anneau, ideal]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $\varphi : (A \,;+\,;\times) \longrightarrow (B \,;\oplus\,;\otimes)$ un morphisme d'anneaux, et $\mathrm{Ker}\, \varphi = \{x \in A \mid \varphi(x)=0_{B}\}$.

    **1.** Démontrer que $\mathrm{Ker}\, \varphi$ est un sous-groupe de $(A \,;+)$.

    **2.** Démontrer que pour tout $x \in \mathrm{Ker}\, \varphi$ et tout $a \in A$, les éléments $ax$ et $xa$ appartiennent à $\mathrm{Ker}\, \varphi$.

    **3.** Démontrer que $\mathrm{Ker}\, \varphi$ n'est jamais un sous-anneau de $A$.

    **4.** Déterminer le noyau de la réduction modulo $n$, puis celui de l'évaluation en $a$.
  corrige: |
    **1.** L'application $\varphi$ étant en particulier un morphisme du groupe $(A\,;+)$ dans le groupe $(B\,;\oplus)$, la proposition 3 du chapitre 4 s'applique directement. 
    $$\boxed{\mathrm{Ker}\, \varphi \text{ est un sous-groupe de } (A \,;+).}$$

    **2.** Soient $x \in \mathrm{Ker}\, \varphi$ et $a \in A$. Alors : 
    $$\varphi(ax)=\varphi(a) \otimes \varphi(x)=\varphi(a) \otimes 0_{B}=0_{B}$$
     la dernière égalité venant de la question 1 de l'exercice 2, appliquée dans l'anneau $B$. Le calcul est identique pour $xa$. 
    $$\boxed{\forall x \in \mathrm{Ker}\, \varphi, \; \forall a \in A, \quad ax \in \mathrm{Ker}\, \varphi \text{ et } xa \in \mathrm{Ker}\, \varphi.}$$
     Une partie vérifiant ces propriétés s'appelle un *idéal* de $A$ : elle est bien plus que stable, elle est *absorbante*.

    **3.** Un sous-anneau doit contenir $1_{A}$. Or $1_{A} \in \mathrm{Ker}\, \varphi$ signifierait $\varphi(1_{A})=0_{B}$, alors que $\varphi(1_{A})=1_{B}$ par définition d'un morphisme d'anneaux. Il faudrait donc $1_{B}=0_{B}$, ce que la définition d'un anneau interdit. 
    $$\boxed{\mathrm{Ker}\, \varphi \text{ n'est jamais un sous-anneau de } A.}$$

    **4.** Pour la réduction modulo $n$, on a $\overline{x}=\overline{0}$ si et seulement si $n$ divise $x$. Pour l'évaluation en $a$, on cherche les fonctions d'image nulle en $a$. 
    $$\boxed{\mathrm{Ker}\, \pi = n\mathbb{Z} \qquad\text{et}\qquad \mathrm{Ker}\,\big(f \mapsto f(a)\big)=\big\{f \in \mathbb{R}^{\mathbb{R}} \;\big|\; f(a)=0\big\}}$$
     Le premier noyau justifie la notation $\mathbb{Z}/n\mathbb{Z}$ : c'est le quotient de $\mathbb{Z}$ par l'idéal $n\mathbb{Z}$.
- id: "ap-05-19"
  feuille: "f-ap-05"
  numero: 19
  partie: "Morphismes d'anneaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux, "morphismes d'anneaux", noyau et idéal]
  noeuds: [a-anneau, a-morph-anneau, a-ideal]
  notions: [anneau, ideal]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $(A \,;+\,;\times)$ un anneau, et $\varphi : \mathbb{Z} \to A$ un morphisme d'anneaux. Pour $n \in \mathbb{N}$, on note $n \cdot 1_{A}$ la somme $1_{A}+\dots+1_{A}$ comportant $n$ termes, avec la convention $0 \cdot 1_{A}=0_{A}$.

    **1.** Démontrer par récurrence que $\varphi(n)=n \cdot 1_{A}$ pour tout $n \in \mathbb{N}$, puis étendre à $n \in \mathbb{Z}$.

    **2.** En déduire qu'il existe *au plus* un morphisme d'anneaux de $\mathbb{Z}$ dans $A$.

    **3.** Déterminer le noyau de ce morphisme dans le cas $A=\mathbb{Z}/n\mathbb{Z}$, puis dans le cas $A=\mathbb{R}$.
  corrige: |
    **1.** *Initialisation.* On a $\varphi(0)=0_{A}$ puisque $\varphi$ est un morphisme de groupes additifs, et $0 \cdot 1_{A}=0_{A}$ par convention.

    *Hérédité.* Supposons $\varphi(n)=n \cdot 1_{A}$. Alors : 
    $$\varphi(n+1)=\varphi(n)+\varphi(1)=n \cdot 1_{A}+1_{A}=(n+1) \cdot 1_{A}$$
     en utilisant $\varphi(1)=1_{A}$, qui fait partie de la définition d'un morphisme d'anneaux.

    *Extension à $\mathbb{Z}$.* Pour $n<0$, la propriété 1 du chapitre 4 donne : 
    $$\varphi(n)=\varphi\big(-(-n)\big)=-\varphi(-n)=-\big((-n) \cdot 1_{A}\big)=n \cdot 1_{A}$$

    $$\boxed{\forall n \in \mathbb{Z}, \quad \varphi(n)=n \cdot 1_{A}}$$

    **2.** L'expression obtenue ne dépend que de l'anneau $A$, et nullement du morphisme choisi : deux morphismes d'anneaux de $\mathbb{Z}$ dans $A$ coïncident donc en tout point. 
    $$\boxed{\text{Il existe au plus un morphisme d'anneaux de } \mathbb{Z} \text{ dans } A.}$$
     *Remarque :* on vérifie sans peine que $n \mapsto n \cdot 1_{A}$ en est effectivement un. L'anneau $\mathbb{Z}$ occupe donc une place particulière : il se envoie d'une unique façon dans n'importe quel anneau.

    **3.** Pour $A=\mathbb{Z}/n\mathbb{Z}$, le neutre est $\overline{1}$ et $k \cdot \overline{1}=\overline{k}$ : le morphisme est la réduction modulo $n$. Pour $A=\mathbb{R}$, le neutre est $1$ et $k \cdot 1=k$ : le morphisme est l'inclusion de $\mathbb{Z}$ dans $\mathbb{R}$. 
    $$\boxed{\mathrm{Ker}\, \varphi = n\mathbb{Z} \text{ dans le premier cas} \qquad \mathrm{Ker}\, \varphi = \{0\} \text{ dans le second.}}$$
- id: "ap-05-20"
  feuille: "f-ap-05"
  numero: 20
  titre: "Vrai ou faux"
  partie: "Exercices de synthèse"
  etoiles: 0
  types: [Vrai ou faux]
  mots_cles: [anneaux, sous-anneaux, diviseurs de zéro et nilpotents, éléments inversibles, corps, "morphismes d'anneaux", noyau et idéal]
  noeuds: [a-anneau, a-morph-anneau, a-corps, a-ideal]
  notions: [anneau, anneau-integre, inversible, corps, ideal]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Pour chaque affirmation, dire si elle est vraie ou fausse en justifiant la réponse.

    **1.** Dans un anneau, un produit peut être nul sans qu'aucun de ses facteurs ne le soit.

    **2.** Un anneau n'est pas nécessairement commutatif.

    **3.** L'ensemble $2\mathbb{Z}$ est un sous-anneau de $(\mathbb{Z} \,;+\,;\times)$.

    **4.** Un corps est un anneau commutatif non nul dont tout élément non nul est inversible.

    **5.** L'anneau $\mathbb{Z}/n\mathbb{Z}$ est un corps si et seulement si $n$ est premier.

    **6.** Un corps ne possède aucun diviseur de zéro.

    **7.** Pour un morphisme d'anneaux, la condition $\varphi(1_{A})=1_{B}$ se déduit des autres conditions.

    **8.** Le noyau d'un morphisme d'anneaux est un sous-anneau de l'anneau de départ.

    **9.** Dans un anneau commutatif, $(x+y)^{2}=x^{2}+2xy+y^{2}$ pour tous $x$ et $y$.

    **10.** Tout sous-anneau d'un corps est un corps.
  corrige: |
    **1.** $\boxed{\textbf{Vraie}}$ Ce sont les diviseurs de zéro, signalés par le cours et rencontrés dans $\mathbb{R}^{2}$, $\mathbb{R}^{\mathbb{R}}$ et $\mathbb{Z}/6\mathbb{Z}$ (exercice 3).

    **2.** $\boxed{\textbf{Vraie}}$ Seule l'addition est supposée commutative dans la définition. L'anneau des matrices carrées de l'exercice 21 en est un contre-exemple.

    **3.** $\boxed{\textbf{Fausse}}$ L'ensemble $2\mathbb{Z}$ ne contient pas $1$ : la première condition de la proposition 1 échoue (exercice 6).

    **4.** $\boxed{\textbf{Vraie}}$ C'est exactement la définition du cours.

    **5.** $\boxed{\textbf{Vraie}}$ C'est le théorème 1, redémontré de deux façons aux exercices 16 et 22.

    **6.** $\boxed{\textbf{Vraie}}$ Un élément inversible n'est jamais diviseur de zéro (exercice 3), et dans un corps tout élément non nul l'est.

    **7.** $\boxed{\textbf{Fausse}}$ L'application $x \mapsto (x\,;0)$ de $\mathbb{Z}$ dans $\mathbb{Z}^{2}$ est additive et multiplicative, mais envoie $1$ sur $(1\,;0) \neq (1\,;1)$. La condition doit donc être exigée à part.

    **8.** $\boxed{\textbf{Fausse}}$ Il ne contient jamais $1_{A}$ (exercice 18). C'est un *idéal*, ce qui est une autre notion.

    **9.** $\boxed{\textbf{Vraie}}$ Le développement donne $x^{2}+xy+yx+y^{2}$, et les deux termes centraux se regroupent lorsque $xy=yx$ (exercice 2).

    **10.** $\boxed{\textbf{Fausse}}$ L'ensemble $\mathbb{Z}$ est un sous-anneau du corps $\mathbb{Q}$, sans être un corps : $2$ n'y est pas inversible.
- id: "ap-05-21"
  feuille: "f-ap-05"
  numero: 21
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux, sous-anneaux, éléments inversibles, corps, "morphismes d'anneaux"]
  noeuds: [a-anneau, a-morph-anneau, a-corps]
  notions: [anneau, inversible, corps]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    On note $\mathcal{M}$ l'ensemble des matrices carrées de taille $2$ à coefficients réels, muni de l'addition terme à terme et du produit défini par : 
    $$\begin{pmatrix} a & b \\ c & d \end{pmatrix} \times \begin{pmatrix} a' & b' \\ c' & d' \end{pmatrix} = \begin{pmatrix} aa'+bc' & ab'+bd' \\ ca'+dc' & cb'+dd' \end{pmatrix}$$
     On admet que $(\mathcal{M} \,;+\,;\times)$ est un anneau non commutatif, de neutres la matrice nulle et la matrice identité. On considère alors : 
    $$\mathcal{C}=\left\{\begin{pmatrix} a & -b \\ b & a \end{pmatrix} \;\middle|\; (a\,;b) \in \mathbb{R}^{2}\right\}$$

    **1.** Démontrer que $\mathcal{C}$ est un sous-anneau de $\mathcal{M}$.

    **2.** Démontrer que $\mathcal{C}$ est commutatif.

    **3.** Démontrer que tout élément non nul de $\mathcal{C}$ est inversible, et conclure que $\mathcal{C}$ est un corps.

    **4.** Démontrer que l'application ci-dessous est un isomorphisme d'anneaux : 
    $$\begin{array}{r|ccl} \phi : & \mathcal{C} & \longrightarrow & \mathbb{C} \\ & \begin{pmatrix} a & -b \\ b & a \end{pmatrix} & \longmapsto & a+\mathrm{i}b \end{array}$$
  corrige: |
    **1.** La matrice identité s'obtient pour $a=1$ et $b=0$, donc $I_{2} \in \mathcal{C}$. Soient ensuite deux éléments de $\mathcal{C}$. Leur différence vaut : 
    $$\begin{pmatrix} a & -b \\ b & a \end{pmatrix}-\begin{pmatrix} c & -d \\ d & c \end{pmatrix}=\begin{pmatrix} a-c & -(b-d) \\ b-d & a-c \end{pmatrix}$$
     qui est encore de la forme voulue. Quant au produit, la formule donnée fournit : 
    $$\begin{pmatrix} a & -b \\ b & a \end{pmatrix} \times \begin{pmatrix} c & -d \\ d & c \end{pmatrix}=\begin{pmatrix} ac-bd & -(ad+bc) \\ ad+bc & ac-bd \end{pmatrix}$$

    $$\boxed{\mathcal{C} \text{ est un sous-anneau de } \mathcal{M}.}$$

    **2.** Les deux coefficients $ac-bd$ et $ad+bc$ du produit sont inchangés lorsqu'on échange le couple $(a\,;b)$ et le couple $(c\,;d)$. 
    $$\boxed{\mathcal{C} \text{ est commutatif, bien que } \mathcal{M} \text{ ne le soit pas.}}$$

    **3.** Soit $M$ un élément non nul de $\mathcal{C}$, c'est-à-dire $(a\,;b) \neq (0\,;0)$. Posons $N=a^{2}+b^{2}>0$ et considérons : 
    $$M'=\begin{pmatrix} \frac{a}{N} & \frac{b}{N} \\ -\frac{b}{N} & \frac{a}{N} \end{pmatrix}$$
     qui appartient à $\mathcal{C}$, avec les coefficients $\frac{a}{N}$ et $-\frac{b}{N}$. Le produit vaut : 
    $$M \times M' = \begin{pmatrix} \frac{a^{2}+b^{2}}{N} & \frac{-ab+ab}{N} \\ \frac{ab-ab}{N} & \frac{a^{2}+b^{2}}{N} \end{pmatrix} = I_{2}$$
     Comme $\mathcal{C}$ est commutatif, le produit dans l'autre ordre donne le même résultat. 
    $$\boxed{\mathcal{C} \text{ est un anneau commutatif dont tout élément non nul est inversible : c'est un corps.}}$$

    **4.** L'application $\phi$ est bijective, de réciproque $a+\mathrm{i}b \mapsto \begin{pmatrix} a & -b \\ b & a \end{pmatrix}$. Elle est additive d'après le calcul de la question 1, et l'on vérifie qu'elle respecte le produit : 
    $$\phi\big(M \times M'\big)=(ac-bd)+\mathrm{i}(ad+bc)=(a+\mathrm{i}b)(c+\mathrm{i}d)=\phi(M) \times \phi(M')$$
     Enfin $\phi(I_{2})=1$. 
    $$\boxed{\phi \text{ est un isomorphisme d'anneaux de } \mathcal{C} \text{ sur } \mathbb{C}.}$$
     Les nombres complexes admettent donc une réalisation matricielle : la multiplication par $a+\mathrm{i}b$ dans $\mathbb{C}$ n'est autre que cette matrice, qui est d'ailleurs celle d'une similitude directe du plan.
- id: "ap-05-22"
  feuille: "f-ap-05"
  numero: 22
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux, diviseurs de zéro et nilpotents, éléments inversibles, corps]
  noeuds: [a-anneau, a-corps]
  notions: [anneau, anneau-integre, inversible, corps]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Soit $A$ un anneau commutatif **fini**, ne possédant aucun diviseur de zéro.

    **1.** Soit $a$ un élément non nul de $A$. Démontrer que l'application $m_{a} : x \mapsto ax$, de $A$ dans $A$, est injective.

    **2.** En déduire que $m_{a}$ est surjective. On pourra invoquer la question 4 de l'exercice 17 du chapitre 4.

    **3.** En déduire que $a$ est inversible, puis que $A$ est un corps.

    **4.** On admet le lemme d'Euclide : si un nombre premier $p$ divise un produit $xy$, alors il divise $x$ ou $y$. Démontrer que $\mathbb{Z}/p\mathbb{Z}$ ne possède aucun diviseur de zéro lorsque $p$ est premier.

    **5.** En déduire une seconde démonstration du sens réciproque du théorème 1.
  corrige: |
    **1.** Soient $x$ et $y$ dans $A$ tels que $m_{a}(x)=m_{a}(y)$, c'est-à-dire $ax=ay$. Alors, par distributivité : 
    $$a(x-y)=ax-ay=0_{A}$$
     Comme $a \neq 0_{A}$ et que $A$ ne possède aucun diviseur de zéro, il vient $x-y=0_{A}$. 
    $$\boxed{m_{a} \text{ est injective.}}$$

    **2.** L'application $m_{a}$ est une application injective de l'ensemble *fini* $A$ dans lui-même. D'après la question 4 de l'exercice 17 du chapitre 4, elle est donc surjective. 
    $$\boxed{m_{a} \text{ est surjective.}}$$

    **3.** En particulier, $1_{A}$ possède un antécédent : il existe $b \in A$ tel que $ab=1_{A}$, et $ba=1_{A}$ par commutativité. Ainsi tout élément non nul de $A$ est inversible, et $A$ est un anneau commutatif non nul. 
    $$\boxed{A \text{ est un corps.}}$$

    **4.** Soient $\overline{x}$ et $\overline{y}$ dans $\mathbb{Z}/p\mathbb{Z}$ tels que $\overline{x}\,\overline{y}=\overline{0}$ avec $\overline{x} \neq \overline{0}$. L'égalité signifie que $p$ divise $xy$, donc, par le lemme d'Euclide, que $p$ divise $x$ ou $p$ divise $y$. Le premier cas donnerait $\overline{x}=\overline{0}$, ce qui est exclu : donc $p$ divise $y$, c'est-à-dire $\overline{y}=\overline{0}$. 
    $$\boxed{\mathbb{Z}/p\mathbb{Z} \text{ ne possède aucun diviseur de zéro lorsque } p \text{ est premier.}}$$

    **5.** L'anneau $\mathbb{Z}/p\mathbb{Z}$ est commutatif, fini — il compte $p$ éléments — et sans diviseur de zéro d'après la question 4. Les questions 1 à 3 s'appliquent donc. 
    $$\boxed{\text{Si } p \text{ est premier, alors } \mathbb{Z}/p\mathbb{Z} \text{ est un corps.}}$$
     Cette démonstration n'utilise pas le théorème de Bézout, contrairement à celle du cours et à celle de l'exercice 16 : elle repose uniquement sur la finitude de l'anneau et sur le lemme d'Euclide.

