  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 40, transposé au cas complexe"
  page_enonce: 10
  page_corrige: 21
  enonce: |
    Soit $A \in \mathcal{M}_{n}(\mathbb{C})$ telle que $A^{*}A = AA^{*}$ et $A$ nilpotente. Montrer que $A^{*}A$ est hermitienne et nilpotente, puis que $A^{*}A = 0$, et enfin que $A = 0$.
  corrige: |
    La matrice $A^{*}A$ est hermitienne, et, comme $A$ et $A^{*}$ commutent, $(A^{*}A)^{k} = (A^{*})^{k}A^{k}$, qui est nul dès que $A^{k} = 0$. Une matrice hermitienne est diagonalisable (théorème 6) ; nilpotente, elle a pour seule valeur propre $0$ : elle est nulle. Enfin, pour tout $X$, $\lVert AX \rVert^{2} = X^{*}A^{*}AX = 0$. $\boxed{A = 0}$

    *Piège.* L'hypothèse $A^{*}A = AA^{*}$ est indispensable : $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ est nilpotente non nulle, et ne commute pas avec sa transposée.
- id: "mp-10-45"
  feuille: "f-mp-10"
  numero: 45
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [espaces hermitiens, endomorphismes hermitiens]
  noeuds: [f-autoadjoints, f-spectral-fini]
  notions: [operateur-autoadjoint, valeur-propre]
  page_enonce: 11
  page_corrige: 21
  enonce: |
    *Endomorphismes normaux.* Soit $E$ un espace hermitien et $u \in \mathcal{L}(E)$ tel que $u^{*} \circ u = u \circ u^{*}$.

    **1.** Montrer que $\lVert u(x) \rVert = \lVert u^{*}(x) \rVert$ pour tout $x \in E$, et en déduire que $\mathrm{Ker}\, u = \mathrm{Ker}\, u^{*}$.

    **2.** Soit $\lambda \in \mathbb{C}$. Montrer que $u - \lambda\,\mathrm{id}_{E}$ commute avec son adjoint, puis que 
    $$\mathrm{Ker}\,(u - \lambda\,\mathrm{id}_{E}) = \mathrm{Ker}\,(u^{*} - \overline{\lambda}\,\mathrm{id}_{E}).$$

    **3.** Montrer que deux sous-espaces propres de $u$ associés à des valeurs propres distinctes sont orthogonaux, et que l'orthogonal d'un sous-espace propre est stable par $u$.

    **4.** En déduire que $u$ se diagonalise dans une base orthonormée. Réciproquement, montrer qu'un endomorphisme diagonalisable dans une base orthonormée commute avec son adjoint.

    **5.** Application : montrer que toute matrice unitaire s'écrit $UDU^{*}$, avec $U$ unitaire et $D$ diagonale à coefficients de module $1$, et diagonaliser ainsi la matrice $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ dans une base orthonormée de $\mathbb{C}^{2}$.
  corrige: |
    **1.** On utilise la définition de l'adjoint, puis $u^{*}u = uu^{*}$ et $(u^{*})^{*} = u$ : 
    $$\lVert u(x) \rVert^{2} = \langle x, u^{*}u(x) \rangle = \langle x, uu^{*}(x) \rangle = \langle u^{*}(x), u^{*}(x) \rangle = \lVert u^{*}(x) \rVert^{2},$$
     d'où $\mathrm{Ker}\, u = \mathrm{Ker}\, u^{*}$.

    **2.** $(u - \lambda\,\mathrm{id})^{*} = u^{*} - \overline{\lambda}\,\mathrm{id}$ (exercice 39), et deux polynômes en $u$ et $u^{*}$ commutent puisque $u$ et $u^{*}$ commutent. On applique la question 1 à $u - \lambda\,\mathrm{id}$. $\boxed{\mathrm{Ker}\,(u - \lambda\,\mathrm{id}) = \mathrm{Ker}\,(u^{*} - \overline{\lambda}\,\mathrm{id})}$

    **3.** Soit $x \in \mathrm{Ker}\,(u - \lambda\,\mathrm{id})$ et $y \in \mathrm{Ker}\,(u - \mu\,\mathrm{id})$, avec $\lambda \neq \mu$. Par la question 2, $u^{*}(x) = \overline{\lambda}x$, d'où 
    $$\mu\langle x, y \rangle = \langle x, u(y) \rangle = \langle u^{*}(x), y \rangle = \langle \overline{\lambda}x, y \rangle = \lambda\langle x, y \rangle,$$
     et $\langle x, y \rangle = 0$. Si $y \perp E_{\lambda} = \mathrm{Ker}\,(u - \lambda\,\mathrm{id})$ et $x \in E_{\lambda}$, le même calcul donne $\langle x, u(y) \rangle = \lambda\langle x, y \rangle = 0$ : $E_{\lambda}^{\perp}$ est stable par $u$, et de même par $u^{*}$.

    **4.** Par récurrence sur $\dim E$ : $u$ a une valeur propre $\lambda$ (d'Alembert-Gauss), $E = E_{\lambda} \oplus E_{\lambda}^{\perp}$, et la restriction de $u$ à $E_{\lambda}^{\perp}$, stable par $u$ et $u^{*}$, a pour adjoint la restriction de $u^{*}$ : elle commute encore avec son adjoint. Une base orthonormée de $E_{\lambda}$, complétée par une base orthonormée propre de $E_{\lambda}^{\perp}$, convient. Réciproquement, si $u$ a une matrice diagonale $D$ dans une base orthonormée, $u^{*}$ a pour matrice $D^{*} = \overline{D}$, diagonale, et $D\overline{D} = \overline{D}D$. 
    $$\boxed{u \text{ se diagonalise dans une base orthonormée} \iff u^{*}u = uu^{*}}$$

    **5.** Si $V$ est unitaire, $V^{*}V = I_{n} = VV^{*}$ : $V$ est normale, donc $V = UDU^{*}$ avec $U$ unitaire, et les valeurs propres sont de module $1$ (proposition 10). Pour $V = \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$, de polynôme caractéristique $X^{2} + 1$ : $V(1, -\mathrm{i}) = (\mathrm{i}, 1) = \mathrm{i}(1, -\mathrm{i})$ et $V(1, \mathrm{i}) = -\mathrm{i}(1, \mathrm{i})$. 
    $$\boxed{V = UDU^{*}, \qquad U = \frac{1}{\sqrt{2}}\begin{pmatrix} 1 & 1 \\ -\mathrm{i} & \mathrm{i} \end{pmatrix}, \qquad D = \begin{pmatrix} \mathrm{i} & 0 \\ 0 & -\mathrm{i} \end{pmatrix}}$$
     La rotation d'angle $\frac{\pi}{2}$, qui n'a aucune valeur propre réelle (chapitre 7), se diagonalise ainsi dans une base orthonormée de $\mathbb{C}^{2}$, avec les valeurs propres $\mathrm{e}^{\pm\mathrm{i}\pi/2}$.
- id: "mp-10-46"
  feuille: "f-mp-10"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, suites totales, polynômes orthogonaux, endomorphismes hermitiens]
  noeuds: [f-bases-hilbertiennes, f-autoadjoints]
  notions: [operateur-autoadjoint, valeur-propre]
  page_enonce: 11
  page_corrige: 22
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple.

    **1.** Dans un espace préhilbertien complexe, $\langle \lambda x, y \rangle = \lambda\langle x, y \rangle$ pour tous $x$, $y$ et tout $\lambda \in \mathbb{C}$.

    **2.** Dans un espace préhilbertien réel, si $\lVert x + y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2}$, alors $x$ et $y$ sont orthogonaux.

    **3.** Dans un espace préhilbertien complexe, si $\lVert x + y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2}$, alors $x$ et $y$ sont orthogonaux.

    **4.** Toute famille orthogonale de vecteurs non nuls est libre.

    **5.** Pour tout sous-espace $F$ d'un espace préhilbertien $E$, on a $E = F \oplus F^{\perp}$.

    **6.** Si $F$ est un sous-espace de dimension finie de $E$, alors $(F^{\perp})^{\perp} = F$.

    **7.** Si $(e_{n})$ est une suite orthonormée de $E$, alors $\langle e_{n}, x \rangle$ tend vers $0$ pour tout $x \in E$.

    **8.** Si $(e_{n})$ est une suite orthonormée et si $\displaystyle \sum_{n = 0}^{+\infty} |\langle e_{n}, x \rangle|^{2} = \lVert x \rVert^{2}$ pour un vecteur $x \neq 0$, alors $(e_{n})$ est totale.

    **9.** Le polynôme de Legendre $L_{n}$, pour $n \geqslant 1$, a $n$ racines réelles distinctes, toutes dans $]-1, 1[$.

    **10.** Les valeurs propres d'une matrice hermitienne sont réelles.
  corrige: |
    **1.** **Faux** : le produit scalaire est semi-linéaire à gauche, $\langle \lambda x, y \rangle = \overline{\lambda}\langle x, y \rangle$ (section 10.2). Par exemple, dans $\mathbb{C}$, $\langle \mathrm{i} \cdot 1, 1 \rangle = \overline{\mathrm{i}} = -\mathrm{i}$.

    **2.** **Vrai** : $\lVert x + y \rVert^{2} = \lVert x \rVert^{2} + \lVert y \rVert^{2} + 2\langle x, y \rangle$ dans le cas réel (proposition 1 (ii)).

    **3.** **Faux** : l'égalité équivaut seulement à $\Re\langle x, y \rangle = 0$ ; dans $\mathbb{C}$, $x = 1$ et $y = \mathrm{i}$ la vérifient, avec $\langle 1, \mathrm{i} \rangle = \mathrm{i}$ (remarque de la section 10.3).

    **4.** **Vrai** : proposition 3 (iii).

    **5.** **Faux** : pour les polynômes dans $\mathcal{C}([-1, 1], \mathbb{R})$ (section 10.4), ou pour $H$ de l'exercice 14, $F^{\perp} = \{0\}$ et $F \neq E$.

    **6.** **Vrai** : théorème 3 (iv).

    **7.** **Vrai** : conséquence de l'inégalité de Bessel (proposition 5).

    **8.** **Faux** : dans $\ell^{2}$, la suite $(\delta_{n})_{n \geqslant 1}$ est orthonormée, vérifie l'égalité pour $x = \delta_{1}$, mais n'est pas totale, puisque $\delta_{0}$ lui est orthogonal. La totalité demande l'égalité de Parseval pour *tout* $x$ (théorème 4).

    **9.** **Vrai** : théorème 5, avec le poids $w = 1$ sur $[-1, 1]$.

    **10.** **Vrai** : théorème 6.

    $$\boxed{\text{vraies : 2, 4, 6, 7, 9, 10 ; \quad fausses : 1, 3, 5, 8}}$$
