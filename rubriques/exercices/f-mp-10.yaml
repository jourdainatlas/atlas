  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 28"
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *Un problème de minimisation.* Soit $n \geqslant 1$. On pose 
    $$\Delta_{n} = \inf_{(x_{1}, \dots, x_{n}) \in \mathbb{R}^{n}} \int_{0}^{1} \big(1 - x_{1}t - \cdots - x_{n}t^{n}\big)^{2}\,\mathrm{d} t,$$
     et l'on munit $\mathbb{R}_{n}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{0}^{1} PQ$. Le but est de montrer que $\displaystyle \Delta_{n} = \frac{1}{(n + 1)^{2}}$.

    **1.** Justifier l'existence de réels $b_{0}, \dots, b_{n}$ tels que 
    $$\frac{(X - 1)(X - 2)\cdots(X - n)}{(X + 1)(X + 2)\cdots(X + n + 1)} = \sum_{k = 0}^{n} \frac{b_{k}}{X + k + 1},$$
     et calculer $b_{0}$.

    **2.** On pose $\displaystyle S = \sum_{k = 0}^{n} b_{k}X^{k}$. Vérifier que $S \in \mathrm{Vect}(X, \dots, X^{n})^{\perp}$, et que $\lVert S \rVert^{2} = b_{0}\langle S, 1 \rangle$.

    **3.** Montrer que $\frac{1}{b_{0}}S$ est le projeté orthogonal de $1$ sur $\mathrm{Vect}(X, \dots, X^{n})^{\perp}$, et conclure.

    **4.** Vérifier le résultat pour $n = 1$ par un calcul direct.
  corrige: |
    **1.** La fraction rationnelle $F = \frac{(X - 1)\cdots(X - n)}{(X + 1)\cdots(X + n + 1)}$ a un numérateur de degré $n$, strictement inférieur à celui du dénominateur, et des pôles simples $-1, \dots, -(n + 1)$ : sa décomposition en éléments simples a la forme annoncée (chapitre 13 de MPSI). Le coefficient $b_{0}$ s'obtient en multipliant par $X + 1$ et en évaluant en $-1$ : 
    $$b_{0} = \frac{(-2)(-3)\cdots(-n - 1)}{1 \cdot 2 \cdots n} = \frac{(-1)^{n}(n + 1)!}{n!}, \qquad \boxed{b_{0} = (-1)^{n}(n + 1)}$$

    **2.** Pour $j \in \mathbb{N}$, $\langle S, X^{j} \rangle = \sum_{k} b_{k}\int_{0}^{1} t^{k + j}\,\mathrm{d} t = \sum_{k} \frac{b_{k}}{k + j + 1} = F(j)$, qui est nul pour $j \in \llbracket 1\,,n \rrbracket$ : $S \perp \mathrm{Vect}(X, \dots, X^{n})$. Ensuite, 
    $$\lVert S \rVert^{2} = \sum_{k = 0}^{n} b_{k}\langle S, X^{k} \rangle = b_{0}\langle S, 1 \rangle,$$
     les autres termes étant nuls.

    **3.** Soit $G = \mathrm{Vect}(X, \dots, X^{n})$, hyperplan de $\mathbb{R}_{n}[X]$. Son orthogonal est une droite, engendrée par $S$, qui est non nul puisque $b_{0} \neq 0$. Le projeté de $1$ sur cette droite est $\frac{\langle S, 1 \rangle}{\lVert S \rVert^{2}}S = \frac{1}{b_{0}}S$. Comme $\Delta_{n} = d(1, G)^{2}$ et que $1 - p_{G}(1) = p_{G^{\perp}}(1)$, 
    $$\Delta_{n} = \Big\|\frac{S}{b_{0}}\Big\|^{2} = \frac{\langle S, 1 \rangle}{b_{0}}, \qquad \langle S, 1 \rangle = F(0) = \frac{(-1)^{n}n!}{(n + 1)!} = \frac{(-1)^{n}}{n + 1}.$$

    $$\boxed{\Delta_{n} = \frac{(-1)^{n}}{n + 1}\cdot\frac{1}{(-1)^{n}(n + 1)} = \frac{1}{(n + 1)^{2}}}$$

    **4.** Pour $n = 1$, $\int_{0}^{1} (1 - xt)^{2}\,\mathrm{d} t = 1 - x + \frac{x^{2}}{3}$ est minimal en $x = \frac{3}{2}$, où il vaut $\frac{1}{4}$. Le résultat a été contrôlé numériquement jusqu'à $n = 5$.

    *Commentaire.* La difficulté contournée est l'inversion de la matrice de Gram $\big(\frac{1}{i + j + 1}\big)$, la matrice de Hilbert, très mal conditionnée : la fraction rationnelle $F$ fournit directement le vecteur orthogonal à $G$.
