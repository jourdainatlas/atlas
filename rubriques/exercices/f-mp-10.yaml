  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercices 46 et 47, transposés au cas complexe"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    *Matrices hermitiennes positives.* Soit $H \in \mathcal{H}_{n}(\mathbb{C})$, de valeurs propres $\lambda_{1} \leqslant \cdots \leqslant \lambda_{n}$.

    **1.** Montrer que $X^{*}HX$ est réel pour tout $X \in \mathbb{C}^{n}$, et que $\lambda_{1}X^{*}X \leqslant X^{*}HX \leqslant \lambda_{n}X^{*}X$.

    **2.** Montrer que $(X, Y) \mapsto X^{*}HY$ est un produit scalaire sur $\mathbb{C}^{n}$ si et seulement si $\lambda_{1} > 0$. Retrouver ainsi le résultat de l'exercice 2 (a).

    **3.** Montrer que, pour toute $A \in \mathcal{M}_{n}(\mathbb{K})$ avec $\mathbb{K} = \mathbb{C}$, la matrice $A^{*}A$ est hermitienne à valeurs propres positives, et qu'inversement toute matrice hermitienne à valeurs propres positives s'écrit $A^{*}A$.
  corrige: |
    On écrit $H = UDU^{*}$ (théorème 6), et l'on pose $Y = U^{*}X$, de sorte que $X^{*}X = Y^{*}Y$ puisque $U$ est unitaire.

    **1.** $\overline{X^{*}HX} = (X^{*}HX)^{*} = X^{*}H^{*}X = X^{*}HX$ : ce nombre est réel. Ensuite, $X^{*}HX = Y^{*}DY$ est la somme des $\lambda_{k}|y_{k}|^{2}$, comprise entre $\lambda_{1}Y^{*}Y$ et $\lambda_{n}Y^{*}Y$. 
    $$\boxed{\lambda_{1}X^{*}X \leqslant X^{*}HX \leqslant \lambda_{n}X^{*}X}$$

    **2.** La forme $(X, Y) \mapsto X^{*}HY$ est linéaire à droite, et à symétrie hermitienne, car 
    $$\overline{Y^{*}HX} = (Y^{*}HX)^{*} = X^{*}H^{*}Y = X^{*}HY.$$
     Elle est définie positive si et seulement si $\lambda_{1} > 0$ : la question 1 donne le sens direct, et un vecteur propre pour $\lambda_{1} \leqslant 0$ contredirait le caractère défini positif. Pour l'exercice 2 (a), $H = \begin{pmatrix} 1 & \mathrm{i} \\ -\mathrm{i} & 2 \end{pmatrix}$ a pour polynôme caractéristique $X^{2} - 3X + 1$, de racines $\frac{3 \pm \sqrt{5}}{2} > 0$. 
    $$\boxed{(X, Y) \mapsto X^{*}HY \text{ produit scalaire} \iff \operatorname{Sp}(H) \subset \mathbb{R}_{+}^{*}}$$

    **3.** $(A^{*}A)^{*} = A^{*}A$, et $X^{*}A^{*}AX = \lVert AX \rVert^{2} \geqslant 0$ ; appliqué à un vecteur propre, cela donne des valeurs propres positives. Réciproquement, si $H = UDU^{*}$ avec $D = \operatorname{diag}(\lambda_{k})$, $\lambda_{k} \geqslant 0$, on pose $A = \sqrt{D}\,U^{*}$, où $\sqrt{D} = \operatorname{diag}(\sqrt{\lambda_{k}})$ : $A^{*}A = U\sqrt{D}\sqrt{D}U^{*} = H$.
- id: "mp-10-43"
  feuille: "f-mp-10"
  numero: 43
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 2
