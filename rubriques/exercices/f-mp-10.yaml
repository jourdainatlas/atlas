  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 14 (indication d'intégration par parties retirée)"
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Polynômes de Jacobi.* Soit $n \geqslant 1$. On munit $E = \mathbb{R}_{n}[X]$ du produit scalaire et de l'application définis par 
    $$\langle P, Q \rangle = \int_{0}^{1} t^{2}P(t)Q(t)\,\mathrm{d} t, \qquad u(P) = X(1 - X)P'' + (3 - 4X)P'.$$

    **1.** Justifier que $\langle \cdot, \cdot \rangle$ est un produit scalaire sur $E$ et que $u$ est un endomorphisme de $E$.

    **2.** Montrer que $u$ est autoadjoint. On pourra vérifier que $X^{2}u(P) = \big(X^{3}(1 - X)P'\big)'$.

    **3.** Déterminer les valeurs propres de $u$.

    **4.** Pour $k \in \llbracket 0\,,n \rrbracket$, on pose $Q_{k} = X^{k + 2}(1 - X)^{k}$. Montrer qu'il existe $P_{k} \in E$ tel que $Q_{k}^{(k)} = X^{2}P_{k}$. En justifiant d'abord que $X(1 - X)Q_{k}' = \big(k + 2 - 2(k + 1)X\big)Q_{k}$, établir que $P_{k}$ est un vecteur propre de $u$. Que peut-on dire de la famille $(P_{0}, \dots, P_{n})$ ?
  corrige: |
    **1.** La forme est bilinéaire, symétrique, positive, et définie : si $\int_{0}^{1} t^{2}P^{2} = 0$, alors $t^{2}P(t)^{2} = 0$ sur $[0, 1]$ et $P$ a une infinité de racines. L'application $u$ est linéaire, et le calcul de la question 3 montre que $\deg u(P) \leqslant \deg P$.

    **2.** On développe : $\big(X^{3}(1 - X)P'\big)' = (3X^{2} - 4X^{3})P' + X^{3}(1 - X)P'' = X^{2}u(P)$. Une intégration par parties, de crochet nul car $t^{3}(1 - t)$ s'annule en $0$ et en $1$, donne 
    $$\langle u(P), Q \rangle = \int_{0}^{1} \big(t^{3}(1 - t)P'\big)'Q = -\int_{0}^{1} t^{3}(1 - t)P'Q',$$
     expression symétrique en $P$ et $Q$. $\boxed{u \text{ est autoadjoint}}$

    **3.** On calcule $u(X^{k}) = k(k + 2)X^{k - 1} - k(k + 3)X^{k}$ : la matrice dans la base canonique est triangulaire supérieure. 
    $$\boxed{\operatorname{Sp}(u) = \{-k(k + 3) \mid 0 \leqslant k \leqslant n\} = \{0, -4, -10, -18, \dots\}}$$

    **4.** *Existence de $P_{k}$.* Le réel $0$ est racine d'ordre $k + 2$ de $Q_{k}$, donc d'ordre $2$ de $Q_{k}^{(k)}$, qui est de degré $k + 2$ : $Q_{k}^{(k)} = X^{2}P_{k}$ avec $\deg P_{k} = k$.

    *Relation de départ.* En dérivant le produit, $Q_{k}' = \big((k + 2)(1 - X) - kX\big)X^{k + 1}(1 - X)^{k - 1}$, d'où 
    $$X(1 - X)Q_{k}' = \big(k + 2 - 2(k + 1)X\big)Q_{k}.$$
     *Dérivation.* On dérive $k + 1$ fois par la formule de Leibniz. En notant $R = Q_{k}^{(k)}$, il vient 
    $$X(1 - X)R'' + (k + 1)(1 - 2X)R' - k(k + 1)R = \big(k + 2 - 2(k + 1)X\big)R' - 2(k + 1)^{2}R,$$
     soit $X(1 - X)R'' - R' + (k + 1)(k + 2)R = 0$.

    *Retour à $P_{k}$.* Avec $R = X^{2}P_{k}$, $R' = 2XP_{k} + X^{2}P_{k}'$ et $R'' = 2P_{k} + 4XP_{k}' + X^{2}P_{k}''$, l'équation devient, après division par $X^{2}$, 
    $$X(1 - X)P_{k}'' + (3 - 4X)P_{k}' + \big((k + 1)(k + 2) - 2\big)P_{k} = 0, \qquad\text{soit}\qquad \boxed{u(P_{k}) = -k(k + 3)P_{k}}$$
     Les $P_{k}$ sont des vecteurs propres de l'endomorphisme autoadjoint $u$ pour des valeurs propres distinctes : $\boxed{(P_{0}, \dots, P_{n}) \text{ est une base orthogonale de } E}$

    Ce sont, à normalisation près, les polynômes orthogonaux pour le poids $t^{2}$ sur $[0, 1]$, de la famille des polynômes de Jacobi. Par exemple, $P_{1} = 3 - 4X$ et $P_{2} = 2(15X^{2} - 20X + 6)$ ; on vérifie $\int_{0}^{1} t^{2}(3 - 4t)\,\mathrm{d} t = 1 - 1 = 0$.
- id: "mp-10-39"
  feuille: "f-mp-10"
  numero: 39
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [espaces hermitiens, endomorphismes hermitiens]
  noeuds: [f-autoadjoints, f-spectral-fini]
  notions: [operateur-autoadjoint, produit-scalaire]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    **1.** Dans $\mathbb{C}^{2}$ muni du produit scalaire canonique, soit $u$ l'endomorphisme de matrice $A = \begin{pmatrix} 1 & \mathrm{i} \\ 2 & 1 + \mathrm{i} \end{pmatrix}$ dans la base canonique. Écrire la matrice de $u^{*}$, et vérifier sur les vecteurs $x = (1, 0)$ et $y = (0, 1)$ que $\langle u(x), y \rangle = \langle x, u^{*}(y) \rangle$.

    **2.** On munit maintenant $\mathbb{C}^{n}$ du produit scalaire $\langle X, Y \rangle_{H} = X^{*}HY$, où $H$ est une matrice hermitienne telle que $X^{*}HX > 0$ pour $X \neq 0$. Montrer que l'adjoint de l'endomorphisme de matrice $A$ a pour matrice $H^{-1}A^{*}H$. Pourquoi la base canonique n'est-elle plus orthonormée ?

    **3.** Montrer que $(u^{*})^{*} = u$, $(u \circ v)^{*} = v^{*} \circ u^{*}$, et $\det(u^{*}) = \overline{\det u}$. Quel est le lien entre le spectre de $u$ et celui de $u^{*}$ ?
  corrige: |
    **1.** La base canonique est orthonormée, et la proposition 9 (iii) donne la matrice $A^{*} = {\overline{A}}^{T}$. 
    $$\boxed{A^{*} = \begin{pmatrix} 1 & 2 \\ -\mathrm{i} & 1 - \mathrm{i} \end{pmatrix}}$$
     *Vérification.* $u(x) = (1, 2)$, d'où $\langle u(x), y \rangle = \overline{2}\cdot 1 = 2$ ; $u^{*}(y) = (2, 1 - \mathrm{i})$, d'où $\langle x, u^{*}(y) \rangle = 2$.

    **2.** On cherche $B$ telle que $(AX)^{*}HY = X^{*}H(BY)$ pour tous $X$, $Y$, soit $A^{*}H = HB$. La matrice $H$ est inversible, car $X^{*}HX > 0$ pour $X \neq 0$ interdit $HX = 0$. $\boxed{B = H^{-1}A^{*}H}$

    La base canonique n'est plus orthonormée, puisque $\langle e_{i}, e_{j} \rangle_{H} = h_{ij}$ : c'est pourquoi la proposition 9 (iii), qui suppose une base orthonormée, ne s'applique pas directement.

    **3.** Les deux premières égalités découlent de l'unicité de l'adjoint : 
    $$\langle u^{*}(x), y \rangle = \overline{\langle y, u^{*}(x) \rangle} = \overline{\langle u(y), x \rangle} = \langle x, u(y) \rangle, \qquad \langle uv(x), y \rangle = \langle v(x), u^{*}(y) \rangle = \langle x, v^{*}u^{*}(y) \rangle.$$
     En base orthonormée, $\det(A^{*}) = \det(\overline{A}) = \overline{\det A}$. De même, $\chi_{A^{*}} = \overline{\chi_{A}}$ (coefficients conjugués) : 
    $$\boxed{\operatorname{Sp}(u^{*}) = \{\overline{\lambda} \mid \lambda \in \operatorname{Sp}(u)\}}$$
- id: "mp-10-40"
  feuille: "f-mp-10"
  numero: 40
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [espaces hermitiens, endomorphismes hermitiens]
  noeuds: [f-autoadjoints, f-spectral-fini]
  notions: [operateur-autoadjoint]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    **1.** Vérifier que $U = \frac{1}{\sqrt{2}}\begin{pmatrix} 1 & 1 \\ \mathrm{i} & -\mathrm{i} \end{pmatrix}$ est unitaire, et calculer son déterminant.

    **2.** Montrer que les matrices de $\mathrm{U}(2)$ sont exactement les matrices $\begin{pmatrix} a & -\mathrm{e}^{\mathrm{i}\varphi}\overline{b} \\ b & \mathrm{e}^{\mathrm{i}\varphi}\overline{a} \end{pmatrix}$, avec $|a|^{2} + |b|^{2} = 1$ et $\varphi \in \mathbb{R}$.

    **3.** *Matrice de Fourier.* Soit $n \geqslant 2$ et $\omega = \mathrm{e}^{2\mathrm{i}\pi/n}$. On pose $F_{n} = \frac{1}{\sqrt{n}}\big(\omega^{(j - 1)(k - 1)}\big)_{1 \leqslant j, k \leqslant n}$. Montrer que $F_{n}$ est unitaire, et en déduire son inverse. Cette matrice, qui transforme une suite finie en ses « coefficients de Fourier discrets », reviendra au chapitre 11.
  corrige: |
    **1.** Les colonnes $\frac{1}{\sqrt{2}}(1, \mathrm{i})$ et $\frac{1}{\sqrt{2}}(1, -\mathrm{i})$ sont unitaires et $\overline{1}\cdot 1 + \overline{\mathrm{i}}\cdot(-\mathrm{i}) = 1 + \mathrm{i}^{2} = 0$ : $U$ est unitaire (proposition 10). $\boxed{\det U = \frac{1}{2}(-\mathrm{i} - \mathrm{i}) = -\mathrm{i}}$, de module $1$.

    **2.** La première colonne $(a, b)$ est unitaire : $|a|^{2} + |b|^{2} = 1$. La seconde est unitaire et orthogonale à la première ; l'orthogonal de $(a, b)$ dans $\mathbb{C}^{2}$ est la droite engendrée par $(-\overline{b}, \overline{a})$, qui est unitaire, donc la seconde colonne est $\mathrm{e}^{\mathrm{i}\varphi}(-\overline{b}, \overline{a})$. Réciproquement, ces matrices ont des colonnes orthonormées. On remarque que leur déterminant vaut $\mathrm{e}^{\mathrm{i}\varphi}$.

    **3.** Le coefficient $(j, k)$ de $F_{n}^{*}F_{n}$ est 
    $$\frac{1}{n}\sum_{l = 0}^{n - 1} \overline{\omega^{l(j - 1)}}\,\omega^{l(k - 1)} = \frac{1}{n}\sum_{l = 0}^{n - 1} \omega^{l(k - j)} = \delta_{jk},$$
     car, pour $k \neq j$, $\omega^{k - j} \neq 1$ est une racine $n$-ième de l'unité et la somme géométrique est nulle. 
    $$\boxed{F_{n}^{-1} = F_{n}^{*} = \frac{1}{\sqrt{n}}\big(\omega^{-(j - 1)(k - 1)}\big)_{j, k}}$$
- id: "mp-10-41"
  feuille: "f-mp-10"
  numero: 41
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 1
  types: [Calcul]
  mots_cles: [espaces hermitiens, endomorphismes hermitiens]
  noeuds: [f-autoadjoints, f-spectral-fini]
  notions: [operateur-autoadjoint]
  page_enonce: 10
  page_corrige: 20
  enonce: |
    Diagonaliser dans une base orthonormée de $\mathbb{C}^{n}$, c'est-à-dire écrire sous la forme $UDU^{*}$ avec $U$ unitaire et $D$ diagonale réelle, les matrices hermitiennes 
    $$H_{1} = \begin{pmatrix} 2 & 1 - \mathrm{i} \\ 1 + \mathrm{i} & 3 \end{pmatrix}, \qquad H_{2} = \begin{pmatrix} 0 & \mathrm{i} & 0 \\ -\mathrm{i} & 0 & \mathrm{i} \\ 0 & -\mathrm{i} & 0 \end{pmatrix}.$$
  corrige: |
    On cherche les valeurs propres, réelles par le théorème 6, puis une base orthonormée de chaque sous-espace propre.

    **$H_{1}$.** $\chi_{H_{1}} = (X - 2)(X - 3) - |1 - \mathrm{i}|^{2} = X^{2} - 5X + 4 = (X - 1)(X - 4)$. Pour $1$ : $X + (1 - \mathrm{i})Y = 0$, vecteur $(-1 + \mathrm{i}, 1)$, de norme $\sqrt{3}$. Pour $4$ : $-2X + (1 - \mathrm{i})Y = 0$, vecteur $(1 - \mathrm{i}, 2)$, de norme $\sqrt{6}$. Ils sont orthogonaux : $\overline{(-1 + \mathrm{i})}(1 - \mathrm{i}) + 2 = (-1 - \mathrm{i})(1 - \mathrm{i}) + 2 = -2 + 2 = 0$. 
    $$\boxed{H_{1} = UDU^{*}, \quad U = \begin{pmatrix} \frac{-1 + \mathrm{i}}{\sqrt{3}} & \frac{1 - \mathrm{i}}{\sqrt{6}} \\ \frac{1}{\sqrt{3}} & \frac{2}{\sqrt{6}} \end{pmatrix}, \quad D = \begin{pmatrix} 1 & 0 \\ 0 & 4 \end{pmatrix}}$$

    **$H_{2}$.** On trouve $\chi_{H_{2}} = X^{3} - 2X$, de racines $0$ et $\pm\sqrt{2}$. Les vecteurs propres unitaires sont $\frac{1}{\sqrt{2}}(1, 0, 1)$ pour $0$, et $\frac{1}{2}(-1, \mp\sqrt{2}\,\mathrm{i}, 1)$ pour $\mp\sqrt{2}$. 
    $$\boxed{H_{2} = UDU^{*}, \quad U = \frac{1}{2}\begin{pmatrix} \sqrt{2} & -1 & -1 \\ 0 & -\sqrt{2}\,\mathrm{i} & \sqrt{2}\,\mathrm{i} \\ \sqrt{2} & 1 & 1 \end{pmatrix}, \quad D = \operatorname{diag}(0, -\sqrt{2}, \sqrt{2})}$$
     *Vérification.* Pour la valeur propre $\sqrt{2}$ et $v = (-1, \sqrt{2}\,\mathrm{i}, 1)$, 
    $$H_{2}v = (\mathrm{i} \cdot \sqrt{2}\,\mathrm{i}, \ \mathrm{i} + \mathrm{i}, \ -\mathrm{i}\cdot\sqrt{2}\,\mathrm{i}) = (-\sqrt{2}, 2\mathrm{i}, \sqrt{2}) = \sqrt{2}\,v.$$
- id: "mp-10-42"
  feuille: "f-mp-10"
  numero: 42
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 2
