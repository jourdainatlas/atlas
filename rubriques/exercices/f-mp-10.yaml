- id: "mp-10-01"
  feuille: "f-mp-10"
  numero: 1
  partie: "Produits scalaires réels et complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [produits scalaires, produits scalaires intégraux]
  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercices 1 et 15 ; Feuille d'exercices espaces préhilbertiens (PLD), exercices 8 et 16 ; questions (d) et (e) ajoutées"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Dire si chacune des applications suivantes est un produit scalaire sur l'espace indiqué.

    **(a)** $\varphi(P, Q) = P(-1)Q(-1) + P(0)Q(0) + P(1)Q(1)$ sur $\mathbb{R}_{2}[X]$.

    **(b)** $\varphi(x, y) = (x_{1} - 2x_{2})(y_{1} - 2y_{2}) + x_{2}y_{2} + (x_{2} + x_{3})(y_{2} + y_{3})$ sur $\mathbb{R}^{3}$.

    **(c)** $\displaystyle \varphi(P, Q) = \int_{0}^{1} f(t)P(t)Q(t)\,\mathrm{d} t$ sur $\mathbb{R}[X]$, où $f : [0, 1] \to \mathbb{R}_{+}$ est continue et non identiquement nulle.

    **(d)** $\varphi(P, Q) = P(0)Q(0) + P(1)Q(1)$ sur $\mathbb{R}_{2}[X]$.

    **(e)** $\displaystyle \varphi(f, g) = \int_{0}^{1/2} f(t)g(t)\,\mathrm{d} t$ sur $\mathcal{C}([0, 1], \mathbb{R})$.

    **(f)** $\displaystyle \varphi(P, Q) = \sum_{n = 0}^{+\infty} P^{(n)}(a_{n})Q^{(n)}(a_{n})$ sur $\mathbb{R}[X]$, où $(a_{n})$ est une suite réelle fixée.
  corrige: |
    Dans chaque cas, la bilinéarité et la symétrie sont immédiates, ainsi que la positivité, sauf en (b) où l'on remarque une somme de carrés : tout se joue sur le caractère *défini*.

    **(a)** Si $\varphi(P, P) = P(-1)^{2} + P(0)^{2} + P(1)^{2} = 0$, le polynôme $P$, de degré au plus $2$, a trois racines : il est nul. $\boxed{\text{produit scalaire}}$

    **(b)** On a $\varphi(x, x) = (x_{1} - 2x_{2})^{2} + x_{2}^{2} + (x_{2} + x_{3})^{2}$, qui est nul si et seulement si $x_{2} = 0$, puis $x_{1} = 0$ et $x_{3} = 0$. $\boxed{\text{produit scalaire}}$

    **(c)** Si $\int_{0}^{1} fP^{2} = 0$, la fonction continue et positive $fP^{2}$ est nulle (chapitre 18 de MPSI). Comme $f$ est continue et non identiquement nulle, elle est strictement positive sur un intervalle non trivial, où $P$ s'annule : $P$ a une infinité de racines, donc $P = 0$. $\boxed{\text{produit scalaire}}$

    **(d)** Le polynôme non nul $P = X(X - 1)$ vérifie $\varphi(P, P) = 0$. $\boxed{\text{pas un produit scalaire : non défini}}$

    **(e)** Une fonction continue nulle sur $[0, \frac{1}{2}]$ et non nulle ensuite, comme $t \mapsto \max(t - \frac{1}{2}, 0)$, vérifie $\varphi(f, f) = 0$. $\boxed{\text{pas un produit scalaire : non défini}}$

    **(f)** La somme est finie, car $P^{(n)} = 0$ pour $n > \deg P$. Si $\varphi(P, P) = 0$ avec $P \neq 0$, de degré $d$, alors $P^{(d)}(a_{d}) = 0$ ; or $P^{(d)}$ est une constante non nulle : contradiction. $\boxed{\text{produit scalaire}}$

    *Piège.* Le caractère défini dépend de l'espace : la forme de (d) est un produit scalaire sur $\mathbb{R}_{1}[X]$, mais pas sur $\mathbb{R}_{2}[X]$, de même que celle de (a) cesse d'en être un sur $\mathbb{R}_{3}[X]$.
- id: "mp-10-02"
  feuille: "f-mp-10"
  numero: 2
  partie: "Produits scalaires réels et complexes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [produits scalaires]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On note $x = (x_{1}, x_{2})$ et $y = (y_{1}, y_{2})$ deux éléments de $\mathbb{C}^{2}$. Dire si chacune des applications suivantes est un produit scalaire sur $\mathbb{C}^{2}$, au sens du cours.

    **(a)** $\varphi(x, y) = \overline{x_{1}}y_{1} + \mathrm{i}\,\overline{x_{1}}y_{2} - \mathrm{i}\,\overline{x_{2}}y_{1} + 2\,\overline{x_{2}}y_{2}$ ; on pourra calculer $|x_{1} + \mathrm{i} x_{2}|^{2}$.

    **(b)** $\varphi(x, y) = x_{1}y_{1} + x_{2}y_{2}$.

    **(c)** $\varphi(x, y) = \overline{x_{1}}y_{1} + \overline{x_{1}}y_{2} + \overline{x_{2}}y_{1} + \overline{x_{2}}y_{2}$.

    **(d)** $\varphi(x, y) = \overline{x_{1}}y_{1} + \mathrm{i}\,\overline{x_{1}}y_{2} + \mathrm{i}\,\overline{x_{2}}y_{1} + 2\,\overline{x_{2}}y_{2}$.

    Pour les applications qui ne conviennent pas, préciser la propriété qui fait défaut.
  corrige: |
    On vérifie successivement la symétrie hermitienne, la linéarité à droite, puis le caractère défini positif. Les quatre formes sont linéaires par rapport à $y$.

    **(a)** La matrice des coefficients $\begin{pmatrix} 1 & \mathrm{i} \\ -\mathrm{i} & 2 \end{pmatrix}$ est hermitienne, donc $\varphi(y, x) = \overline{\varphi(x, y)}$. De plus, 
    $$|x_{1} + \mathrm{i} x_{2}|^{2} = (\overline{x_{1}} - \mathrm{i}\overline{x_{2}})(x_{1} + \mathrm{i} x_{2}) = |x_{1}|^{2} + \mathrm{i}\overline{x_{1}}x_{2} - \mathrm{i}\overline{x_{2}}x_{1} + |x_{2}|^{2},$$
     d'où $\varphi(x, x) = |x_{1} + \mathrm{i} x_{2}|^{2} + |x_{2}|^{2}$, nul seulement si $x_{2} = 0$ et $x_{1} = 0$. $\boxed{\text{produit scalaire}}$

    **(b)** La forme est linéaire à gauche, et non semi-linéaire, puisque $\varphi(\mathrm{i} x, y) = \mathrm{i}\varphi(x, y)$. De plus, le vecteur non nul $(1, \mathrm{i})$ vérifie $\varphi\big((1, \mathrm{i}), (1, \mathrm{i})\big) = 1 + \mathrm{i}^{2} = 0$. 
    $$\boxed{\text{non : ni hermitienne, ni définie}}$$

    **(c)** On a $\varphi(x, y) = \overline{(x_{1} + x_{2})}(y_{1} + y_{2})$, hermitienne et positive, mais $\varphi(x, x) = |x_{1} + x_{2}|^{2}$ s'annule en $x = (1, -1)$. $\boxed{\text{non : positive mais pas définie}}$

    **(d)** On a $\varphi(e_{1}, e_{2}) = \mathrm{i}$ et $\varphi(e_{2}, e_{1}) = \mathrm{i} \neq \overline{\mathrm{i}}$. $\boxed{\text{non : pas de symétrie hermitienne}}$

    *Piège.* En (d), la matrice $\begin{pmatrix} 1 & \mathrm{i} \\ \mathrm{i} & 2 \end{pmatrix}$ est symétrique, mais pas hermitienne ; c'est la même confusion que pour la matrice nilpotente signalée au chapitre 7 et à la section 10.7.
- id: "mp-10-03"
  feuille: "f-mp-10"
  numero: 3
  partie: "Produits scalaires réels et complexes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [produits scalaires, Cauchy-Schwarz, produits scalaires intégraux]
  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercices 2 à 5 ; Espaces préhilbertiens et euclidiens (MP*), exercices d'application 1 et exercice 4 ; Feuille d'exercices espaces préhilbertiens (PLD), exercice 3"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    *Gammes sur l'inégalité de Cauchy-Schwarz.* Démontrer les inégalités suivantes, et préciser à chaque fois le cas d'égalité.

    **(a)** Pour $x_{1}, \dots, x_{n}$ réels, $(x_{1} + \cdots + x_{n})^{2} \leqslant n(x_{1}^{2} + \cdots + x_{n}^{2})$.

    **(b)** Pour $x_{1}, \dots, x_{n} > 0$ de somme $1$, $\displaystyle\sum_{i = 1}^{n} \frac{1}{x_{i}} \geqslant n^{2}$.

    **(c)** Pour $f \in \mathcal{C}([a, b], \mathbb{R})$ ne s'annulant pas, avec $a < b$, $\displaystyle\int_{a}^{b} f(t)\,\mathrm{d} t\int_{a}^{b} \frac{\mathrm{d} t}{f(t)} \geqslant (b - a)^{2}$.

    **(d)** Pour $f$, $g : [0, 1] \to \mathbb{R}_{+}$ continues telles que $fg \geqslant 1$, $\displaystyle\int_{0}^{1} f\int_{0}^{1} g \geqslant 1$.

    **(e)** Pour $x_{1}, \dots, x_{n} \in E$, $\displaystyle \big\|\sum_{k = 1}^{n} x_{k}\big\|^{2} \leqslant n\sum_{k = 1}^{n} \lVert x_{k} \rVert^{2}$.

    **(f)** Pour $x$, $y$, $z \in E$, $\lVert x - z \rVert^{2} \leqslant 2\big(\lVert x - y \rVert^{2} + \lVert y - z \rVert^{2}\big)$.
  corrige: |
    Chaque inégalité est l'inégalité de Cauchy-Schwarz (théorème 1) pour un produit scalaire et deux vecteurs bien choisis ; le cas d'égalité est celui des vecteurs colinéaires.

    **(a)** Dans $\mathbb{R}^{n}$, avec $x = (x_{i})$ et $u = (1, \dots, 1)$ : $\langle u, x \rangle^{2} \leqslant \lVert u \rVert^{2}\lVert x \rVert^{2}$. 
    $$\boxed{\text{égalité ssi les } x_{i} \text{ sont tous égaux}}$$

    **(b)** Avec les vecteurs $(\sqrt{x_{i}})$ et $(1/\sqrt{x_{i}})$ : 
    $$n^{2} = \Big(\sum_{i = 1}^{n} \sqrt{x_{i}}\cdot\frac{1}{\sqrt{x_{i}}}\Big)^{2} \leqslant \sum_{i = 1}^{n} x_{i}\sum_{i = 1}^{n} \frac{1}{x_{i}} = \sum_{i = 1}^{n} \frac{1}{x_{i}}.$$
     L'égalité impose $\frac{1}{\sqrt{x_{i}}} = \lambda\sqrt{x_{i}}$, donc tous les $x_{i}$ égaux. $\boxed{\text{égalité ssi } x_{i} = \tfrac{1}{n} \text{ pour tout } i}$

    **(c)** La fonction $f$, continue et sans zéro, garde un signe constant ; quitte à changer $f$ en $-f$, elle est positive. On applique Cauchy-Schwarz dans $\mathcal{C}([a, b], \mathbb{R})$ à $\sqrt{f}$ et $1/\sqrt{f}$, dont le produit vaut $1$. L'égalité impose $\frac{1}{\sqrt{f}} = \lambda\sqrt{f}$, soit $f$ constante. $\boxed{\text{égalité ssi } f \text{ est constante}}$

    **(d)** Avec $\sqrt{f}$ et $\sqrt{g}$, et $\sqrt{fg} \geqslant 1$ : 
    $$1 \leqslant \Big(\int_{0}^{1} \sqrt{fg}\Big)^{2} \leqslant \int_{0}^{1} f\int_{0}^{1} g.$$
     L'égalité impose $fg = 1$ et $\sqrt{g} = \lambda\sqrt{f}$, soit $f = c$ et $g = \frac{1}{c}$ constantes. $\boxed{\text{égalité ssi } f = c, \ g = \tfrac{1}{c}}$

    **(e)** On combine l'inégalité triangulaire et (a) : 
    $$\Big\|\sum_{k = 1}^{n} x_{k}\Big\|^{2} \leqslant \Big(\sum_{k = 1}^{n} \lVert x_{k} \rVert\Big)^{2} \leqslant n\sum_{k = 1}^{n} \lVert x_{k} \rVert^{2}.$$
     La seconde égalité impose que les $\lVert x_{k} \rVert$ soient égaux, et la première (proposition 2) que les $x_{k}$ soient positivement liés. $\boxed{\text{égalité ssi } x_{1} = \cdots = x_{n}}$

    **(f)** On applique (e) avec $n = 2$ à $x - y$ et $y - z$, de somme $x - z$. $\boxed{\text{égalité ssi } y = \tfrac{x + z}{2}}$
- id: "mp-10-04"
  feuille: "f-mp-10"
  numero: 4
  partie: "Produits scalaires réels et complexes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [produits scalaires, produits scalaires intégraux]
  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercice 7"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    Sur $E = \mathcal{C}^{1}([0, 1], \mathbb{R})$, on pose $\displaystyle \langle f, g \rangle = f(1)g(1) + \int_{0}^{1} f'(t)g'(t)\,\mathrm{d} t$.

    **1.** Montrer que l'on définit ainsi un produit scalaire sur $E$.

    **2.** Établir que, pour tout $f \in E$, 
    $$\Big(f(1) + \int_{0}^{1} f'(t)\,\mathrm{d} t\Big)^{2} \leqslant 2\Big(f(1)^{2} + \int_{0}^{1} f'(t)^{2}\,\mathrm{d} t\Big).$$

    **3.** Pour quelles fonctions $f$ y a-t-il égalité ?
  corrige: |
    **1.** La forme est bilinéaire, symétrique et positive. Si $\langle f, f \rangle = f(1)^{2} + \int_{0}^{1} f'^{2} = 0$, alors $f' = 0$ (fonction continue positive d'intégrale nulle), donc $f$ est constante, égale à $f(1) = 0$.

    **2.** On reconnaît un produit scalaire : avec $h : t \mapsto t$, on a $h(1) = 1$ et $h' = 1$, donc 
    $$\langle f, h \rangle = f(1) + \int_{0}^{1} f'(t)\,\mathrm{d} t, \qquad \lVert h \rVert^{2} = 1 + 1 = 2.$$
     L'inégalité de Cauchy-Schwarz $\langle f, h \rangle^{2} \leqslant \lVert h \rVert^{2}\lVert f \rVert^{2}$ est exactement l'inégalité demandée.

    **3.** Il y a égalité si et seulement si $f$ et $h$ sont colinéaires. $\boxed{\text{égalité ssi } f : t \mapsto \lambda t, \ \lambda \in \mathbb{R}}$

    *Piège.* Le membre de gauche vaut aussi $(2f(1) - f(0))^{2}$ ; écrire l'inégalité sous cette forme masque le produit scalaire qui la rend évidente. L'art de l'exercice est de reconnaître le vecteur $h$.
- id: "mp-10-05"
  feuille: "f-mp-10"
  numero: 5
  partie: "Produits scalaires réels et complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires, produits scalaires intégraux]
  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercice 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f \in \mathcal{C}([0, 1], \mathbb{R})$ positive, et $\displaystyle A = \int_{0}^{1} f$. Montrer que 
    $$\sqrt{1 + A^{2}} \leqslant \int_{0}^{1} \sqrt{1 + f(x)^{2}}\,\mathrm{d} x \leqslant 1 + A.$$
     On pourra, pour la première inégalité, appliquer l'inégalité triangulaire dans un espace bien choisi. Lorsque $f = F'$, interpréter géométriquement cet encadrement à l'aide de la longueur de la courbe représentative de $F$.
  corrige: |
    Les deux inégalités sont de nature différente : la première est une inégalité triangulaire pour une intégrale de vecteurs, la seconde une majoration terme à terme.

    **Minoration.** Soit $\gamma : [0, 1] \to \mathbb{R}^{2}$, $\gamma(x) = (1, f(x))$, et $\lVert \cdot \rVert$ la norme euclidienne de $\mathbb{R}^{2}$. L'inégalité triangulaire pour les intégrales de fonctions vectorielles (chapitre 6), $\big\|\int_{0}^{1} \gamma\big\| \leqslant \int_{0}^{1} \lVert \gamma \rVert$, s'écrit 
    $$\sqrt{1 + A^{2}} = \lVert (1, A) \rVert \leqslant \int_{0}^{1} \sqrt{1 + f(x)^{2}}\,\mathrm{d} x.$$
     On peut aussi l'obtenir par des sommes de Riemann et l'inégalité triangulaire dans $\mathbb{R}^{2}$.

    **Majoration.** Comme $f \geqslant 0$, $1 + f^{2} \leqslant (1 + f)^{2}$, donc $\sqrt{1 + f^{2}} \leqslant 1 + f$, et l'on intègre.

    **Interprétation.** Si $f = F'$, l'intégrale du milieu est la longueur $\ell$ de la courbe de $F$ entre les points $(0, F(0))$ et $(1, F(1))$, distants de $\sqrt{1 + A^{2}}$, puisque $F(1) - F(0) = A$ : 
    $$\boxed{\text{corde} = \sqrt{1 + A^{2}} \leqslant \ell \leqslant 1 + A = \text{chemin horizontal puis vertical}}$$
     La courbe, croissante, est plus longue que la corde et plus courte que le chemin en escalier qui va d'abord horizontalement, puis verticalement.
- id: "mp-10-06"
  feuille: "f-mp-10"
  numero: 6
  partie: "Produits scalaires réels et complexes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [produits scalaires, Cauchy-Schwarz, endomorphismes hermitiens]
  noeuds: [me-produit-scalaire, f-autoadjoints]
  notions: [produit-scalaire, operateur-autoadjoint]
  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 4 ; Espaces préhilbertiens et euclidiens (MP*), travaux dirigés 1, questions 2 et 3"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Norme de Frobenius.* On munit $\mathcal{M}_{n}(\mathbb{K})$, avec $\mathbb{K} = \mathbb{R}$ ou $\mathbb{C}$, du produit scalaire $\langle A, B \rangle = \operatorname{tr}(A^{*}B)$, de norme associée $N$.

    **1.** Exprimer $N(A)$ à l'aide des coefficients de $A$, et vérifier que la base canonique de $\mathcal{M}_{n}(\mathbb{K})$ est orthonormée.

    **2.** Montrer que $N(AB) \leqslant N(A)N(B)$, en appliquant l'inégalité de Cauchy-Schwarz aux coefficients de $AB$.

    **3.** Montrer que $|\operatorname{tr} A| \leqslant \sqrt{n}\,N(A)$, et étudier le cas d'égalité.

    **4.** Montrer que $N(UA) = N(AU) = N(A)$ pour toute matrice $U$ unitaire, c'est-à-dire telle que $U^{*}U = I_{n}$.

    **5.** La norme $N$ est-elle la norme subordonnée à une norme sur $\mathbb{K}^{n}$ ? On pourra calculer $N(I_{n})$.
  corrige: |
    **1.** Le coefficient diagonal $(j, j)$ de $A^{*}A$ est la somme des $\overline{a_{ij}}a_{ij}$ pour $i \in \llbracket 1\,,n \rrbracket$, donc 
    $$\boxed{N(A)^{2} = \sum_{i, j} |a_{ij}|^{2}}$$
     C'est la norme canonique de $\mathbb{K}^{n^{2}}$. Pour la base canonique, $\langle E_{ij}, E_{kl} \rangle$ vaut $1$ si $(i, j) = (k, l)$ et $0$ sinon : elle est orthonormée.

    **2.** Par Cauchy-Schwarz dans $\mathbb{K}^{n}$, $|(AB)_{ij}|^{2} = \big|\sum_{k} a_{ik}b_{kj}\big|^{2} \leqslant \sum_{k} |a_{ik}|^{2}\sum_{k} |b_{kj}|^{2}$, et l'on somme sur $i$ et $j$ : 
    $$\boxed{N(AB) \leqslant N(A)N(B)}$$

    **3.** On a $\operatorname{tr} A = \operatorname{tr}(I_{n}^{*}A) = \langle I_{n}, A \rangle$, et $N(I_{n}) = \sqrt{n}$ ; Cauchy-Schwarz donne 
    $$\boxed{|\operatorname{tr} A| \leqslant \sqrt{n}\,N(A), \ \text{égalité ssi } A = \lambda I_{n}}$$

    **4.** On calcule, en utilisant $\operatorname{tr}(MN) = \operatorname{tr}(NM)$ et $UU^{*} = I_{n}$, vrai car $U$ est carrée et $U^{*}$ est son inverse : 
    $$N(UA)^{2} = \operatorname{tr}(A^{*}U^{*}UA) = \operatorname{tr}(A^{*}A), \qquad N(AU)^{2} = \operatorname{tr}(U^{*}A^{*}AU) = \operatorname{tr}(A^{*}AUU^{*}) = \operatorname{tr}(A^{*}A).$$

    **5.** Une norme subordonnée vérifie $|\mkern-1.5mu|\mkern-1.5mu|I_{n}|\mkern-1.5mu|\mkern-1.5mu| = 1$, alors que $N(I_{n}) = \sqrt{n}$. $\boxed{\text{non, dès que } n \geqslant 2}$
- id: "mp-10-07"
  feuille: "f-mp-10"
  numero: 7
  partie: "Produits scalaires réels et complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires, identités de polarisation, produits scalaires intégraux]
  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire, identite-parallelogramme]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *Reconnaître une norme euclidienne.*

    **1.** Montrer que $N(x, y) = \sqrt{x^{2} + xy + y^{2}}$ est la norme associée à un produit scalaire sur $\mathbb{R}^{2}$, que l'on déterminera à l'aide d'une identité de polarisation. Dessiner sa boule unité.

    **2.** Montrer que, sur $\mathbb{R}_{n}[X]$, $\displaystyle N(P) = \Big(\sum_{k = 0}^{n} P(k)^{2}\Big)^{1/2}$ est une norme associée à un produit scalaire.

    **3.** Montrer que les normes $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$ sur $\mathbb{R}^{n}$, pour $n \geqslant 2$, et la norme $\displaystyle \lVert f \rVert_{1} = \int_{0}^{1} |f|$ sur $\mathcal{C}([0, 1], \mathbb{R})$ ne proviennent d'aucun produit scalaire.
  corrige: |
    **1.** Si $N$ provient d'un produit scalaire, celui-ci est donné par la polarisation 
    $$\langle u, v \rangle = \frac{1}{4}\big(N(u + v)^{2} - N(u - v)^{2}\big).$$
     Le calcul donne 
    $$\boxed{\langle (x, y), (x', y') \rangle = xx' + \frac{1}{2}(xy' + x'y) + yy'}$$
     qui est bilinéaire et symétrique, avec $\langle u, u \rangle = x^{2} + xy + y^{2} = \big(x + \frac{y}{2}\big)^{2} + \frac{3}{4}y^{2}$, nul seulement en $0$ ; et $N$ est bien la norme associée. Dans les coordonnées $s = \frac{x + y}{\sqrt{2}}$, $d = \frac{x - y}{\sqrt{2}}$, on a $x^{2} + xy + y^{2} = \frac{3}{2}s^{2} + \frac{1}{2}d^{2}$ : la boule unité est l'ellipse pleine de demi-axes $\sqrt{\frac{2}{3}}$ selon $(1, 1)$ et $\sqrt{2}$ selon $(1, -1)$.

    **2.** La forme $\langle P, Q \rangle = \sum_{k = 0}^{n} P(k)Q(k)$ est bilinéaire, symétrique, positive, et définie, car un polynôme de degré au plus $n$ nul en $n + 1$ points est nul. Sa norme associée est $N$.

    **3.** On teste l'identité du parallélogramme (proposition 1 (iii)).

    • Pour $\lVert \cdot \rVert_{1}$ et $\lVert \cdot \rVert_{\infty}$, avec $e_{1}$, $e_{2}$ : $\lVert e_{1} + e_{2} \rVert_{1}^{2} + \lVert e_{1} - e_{2} \rVert_{1}^{2} = 8$ et $\lVert e_{1} + e_{2} \rVert_{\infty}^{2} + \lVert e_{1} - e_{2} \rVert_{\infty}^{2} = 2$, au lieu de $2(1 + 1) = 4$.

    • Pour $\lVert \cdot \rVert_{1}$ sur $\mathcal{C}([0, 1], \mathbb{R})$, avec $f(t) = t$ et $g(t) = 1 - t$ : $\lVert f + g \rVert_{1} = 1$, $\lVert f - g \rVert_{1} = \int_{0}^{1} |2t - 1|\,\mathrm{d} t = \frac{1}{2}$, et $\lVert f \rVert_{1} = \lVert g \rVert_{1} = \frac{1}{2}$, d'où $1 + \frac{1}{4} = \frac{5}{4} \neq 1$.

    $\boxed{\text{aucune de ces trois normes n'est euclidienne}}$
- id: "mp-10-08"
  feuille: "f-mp-10"
  numero: 8
  partie: "Produits scalaires réels et complexes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens et euclidiens (MP*), exercice 2"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Soit $(a_{k})_{k \in \mathbb{N}}$ une suite d'éléments de $[0, 1]$. Pour $f$, $g \in \mathcal{C}([0, 1], \mathbb{R})$, on pose 
    $$\langle f, g \rangle = \sum_{k = 0}^{+\infty} \frac{1}{2^{k}}f(a_{k})g(a_{k}).$$
     Justifier la définition, puis montrer que $\langle \cdot, \cdot \rangle$ est un produit scalaire sur $\mathcal{C}([0, 1], \mathbb{R})$ si et seulement si l'ensemble $\{a_{k} \mid k \in \mathbb{N}\}$ est dense dans $[0, 1]$.
  corrige: |
    **Définition.** Pour $f$, $g$ continues, $\big|\frac{1}{2^{k}}f(a_{k})g(a_{k})\big| \leqslant \frac{\lVert f \rVert_{\infty}\lVert g \rVert_{\infty}}{2^{k}}$ : la série converge absolument. La forme obtenue est bilinéaire, symétrique et positive ; seul le caractère défini est en jeu. Notons $A = \{a_{k} \mid k \in \mathbb{N}\}$.

    **Si $A$ est dense.** Si $\langle f, f \rangle = \sum_{k} 2^{-k}f(a_{k})^{2} = 0$, tous les termes, positifs, sont nuls : $f$ est nulle sur $A$, donc sur $\overline{A} = [0, 1]$ par continuité (chapitre 5, prolongement des égalités).

    **Si $A$ n'est pas dense.** Il existe un intervalle ouvert $I = ]c - r, c + r[$, avec $c \in [0, 1]$ et $r > 0$, qui ne rencontre pas $A$. La fonction « chapeau » $f(t) = \max(r - |t - c|, 0)$ est continue, non nulle en $c$, et nulle hors de $I$, donc en tous les $a_{k}$ : $\langle f, f \rangle = 0$. 
    $$\boxed{\langle \cdot, \cdot \rangle \text{ est un produit scalaire} \iff \{a_{k}\} \text{ est dense dans } [0, 1]}$$
     Par exemple, une énumération des rationnels de $[0, 1]$ convient.
- id: "mp-10-09"
  feuille: "f-mp-10"
  numero: 9
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [orthogonalité, Gram-Schmidt et matrice de Gram, endomorphismes hermitiens]
  noeuds: [fq-orthogonalite, f-autoadjoints]
  notions: [famille-orthonormee, operateur-autoadjoint]
  source: "Espaces préhilbertiens réels (PCSI), exercices 12 et 13"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Orthonormaliser par le procédé de Gram-Schmidt :

    **1.** la famille $u_{1} = (1, 1, 0)$, $u_{2} = (1, 0, 1)$, $u_{3} = (0, 1, 1)$ de $\mathbb{R}^{3}$ ;

    **2.** la famille $u_{1} = (0, 1, 1, 1)$, $u_{2} = (1, 0, 1, 1)$, $u_{3} = (1, 1, 0, 1)$, $u_{4} = (1, 1, 1, 0)$ de $\mathbb{R}^{4}$.
  corrige: |
    On applique le théorème 2 : $y_{n} = u_{n} - \sum_{k < n} \langle e_{k}, u_{n} \rangle e_{k}$, puis $e_{n} = \frac{y_{n}}{\lVert y_{n} \rVert}$.

    **1.** On trouve $y_{2} = u_{2} - \frac{1}{2}u_{1} = \frac{1}{2}(1, -1, 2)$ et $y_{3} = \frac{2}{3}(-1, 1, 1)$, d'où 
    $$\boxed{e_{1} = \frac{1}{\sqrt{2}}(1, 1, 0), \qquad e_{2} = \frac{1}{\sqrt{6}}(1, -1, 2), \qquad e_{3} = \frac{1}{\sqrt{3}}(-1, 1, 1)}$$

    **2.** De même, en simplifiant à chaque étape le vecteur $y_{n}$ par un facteur positif : 
    $$\boxed{e_{1} = \frac{(0, 1, 1, 1)}{\sqrt{3}}, \ \ e_{2} = \frac{(3, -2, 1, 1)}{\sqrt{15}}, \ \ e_{3} = \frac{(3, 3, -4, 1)}{\sqrt{35}}, \ \ e_{4} = \frac{(1, 1, 1, -2)}{\sqrt{7}}}$$
     On vérifie que ces vecteurs sont unitaires et deux à deux orthogonaux ; par exemple, 
    $$\langle e_{2}, e_{3} \rangle = \frac{9 - 6 - 4 + 1}{\sqrt{15 \cdot 35}} = 0.$$
- id: "mp-10-10"
  feuille: "f-mp-10"
  numero: 10
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [orthogonalité, endomorphismes hermitiens]
  noeuds: [fq-orthogonalite, f-autoadjoints]
  notions: [famille-orthonormee, operateur-autoadjoint, produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercices 15 et 16"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Orthonormaliser la base canonique de $\mathbb{R}^{3}$ pour le produit scalaire $\varphi$ de l'exercice 1 (b).

    **2.** Donner une base orthonormée de $\mathbb{R}_{2}[X]$ pour le produit scalaire $\displaystyle \langle P, Q \rangle = \sum_{k = 0}^{2} P(k)Q(k)$. Comparer avec les polynômes interpolateurs de Lagrange aux points $0$, $1$, $2$, qui forment une autre base orthonormée.
  corrige: |
    **1.** On a $\varphi(e_{1}, e_{1}) = 1$, puis $y_{2} = e_{2} - \varphi(e_{1}, e_{2})e_{1} = e_{2} + 2e_{1}$, de carré scalaire $0 + 1 + 1 = 2$, et l'on continue : 
    $$\boxed{\varepsilon_{1} = (1, 0, 0), \qquad \varepsilon_{2} = \frac{1}{\sqrt{2}}(2, 1, 0), \qquad \varepsilon_{3} = \frac{1}{\sqrt{2}}(-2, -1, 2)}$$

    **2.** On orthonormalise $(1, X, X^{2})$ : $\lVert 1 \rVert^{2} = 3$, $\langle 1, X \rangle = 3$, d'où $y_{1} = X - 1$, de carré scalaire $2$ ; enfin $y_{2} = X^{2} - 2X + \frac{1}{3}$, de carré scalaire $\frac{2}{3}$. 
    $$\boxed{\frac{1}{\sqrt{3}}, \qquad \frac{X - 1}{\sqrt{2}}, \qquad \frac{3X^{2} - 6X + 1}{\sqrt{6}}}$$
     Les polynômes de Lagrange $L_{0} = \frac{(X - 1)(X - 2)}{2}$, $L_{1} = -X(X - 2)$, $L_{2} = \frac{X(X - 1)}{2}$ vérifient $\langle L_{i}, L_{j} \rangle = \sum_{k} L_{i}(k)L_{j}(k) = \delta_{ij}$ : ils forment une autre base orthonormée. Une base orthonormée n'est pas unique ; celle de Gram-Schmidt est la seule qui soit « triangulaire » par rapport à la base canonique.
- id: "mp-10-11"
  feuille: "f-mp-10"
  numero: 11
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [orthogonalité, Gram-Schmidt et matrice de Gram, endomorphismes hermitiens]
  noeuds: [fq-orthogonalite, f-autoadjoints]
  notions: [famille-orthonormee, operateur-autoadjoint, produit-scalaire]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *Gram-Schmidt dans $\mathbb{C}^{3}$.* Orthonormaliser la famille $u_{1} = (1, \mathrm{i}, 0)$, $u_{2} = (\mathrm{i}, 0, 1)$, $u_{3} = (0, 0, 1)$ pour le produit scalaire canonique de $\mathbb{C}^{3}$. Vérifier le résultat, puis refaire le calcul de $e_{2}$ en utilisant par erreur le coefficient $\langle u_{2}, e_{1} \rangle$ au lieu de $\langle e_{1}, u_{2} \rangle$ : le vecteur obtenu est-il orthogonal à $e_{1}$ ?
  corrige: |
    On applique le théorème 2 avec le coefficient $\langle e_{1}, u_{2} \rangle = \overline{e_{1}}^{\,T}u_{2}$, où la conjugaison porte sur $e_{1}$.

    On a $\lVert u_{1} \rVert^{2} = 2$, $e_{1} = \frac{1}{\sqrt{2}}(1, \mathrm{i}, 0)$, et $\langle e_{1}, u_{2} \rangle = \frac{1}{\sqrt{2}}(1 \cdot \mathrm{i} + \overline{\mathrm{i}} \cdot 0) = \frac{\mathrm{i}}{\sqrt{2}}$. Ainsi 
    $$y_{2} = u_{2} - \frac{\mathrm{i}}{2}(1, \mathrm{i}, 0) = \Big(\frac{\mathrm{i}}{2}, \frac{1}{2}, 1\Big), \qquad \lVert y_{2} \rVert^{2} = \frac{3}{2}.$$
     Ensuite, $\langle e_{1}, u_{3} \rangle = 0$ et $\langle e_{2}, u_{3} \rangle = \frac{2}{\sqrt{6}}$, d'où $y_{3} = \frac{1}{3}(-\mathrm{i}, -1, 1)$, de carré scalaire $\frac{1}{3}$. 
    $$\boxed{e_{1} = \frac{(1, \mathrm{i}, 0)}{\sqrt{2}}, \qquad e_{2} = \frac{(\mathrm{i}, 1, 2)}{\sqrt{6}}, \qquad e_{3} = \frac{(-\mathrm{i}, -1, 1)}{\sqrt{3}}}$$
     *Vérification.* $\langle e_{1}, e_{2} \rangle = \frac{1}{\sqrt{12}}(\mathrm{i} + \overline{\mathrm{i}}) = 0$, $\langle e_{1}, e_{3} \rangle = \frac{1}{\sqrt{6}}(-\mathrm{i} - \overline{\mathrm{i}}) = 0$ et $\langle e_{2}, e_{3} \rangle = \frac{1}{\sqrt{18}}(\overline{\mathrm{i}}(-\mathrm{i}) - 1 + 2) = 0$.

    *Avec le mauvais coefficient.* On a $\langle u_{2}, e_{1} \rangle = \overline{\langle e_{1}, u_{2} \rangle} = -\frac{\mathrm{i}}{\sqrt{2}}$, et l'on obtient 
    $$v = u_{2} + \frac{\mathrm{i}}{2}(1, \mathrm{i}, 0) = \Big(\frac{3\mathrm{i}}{2}, -\frac{1}{2}, 1\Big), \qquad \langle e_{1}, v \rangle = \frac{1}{\sqrt{2}}\Big(\frac{3\mathrm{i}}{2} + \frac{\mathrm{i}}{2}\Big) = \mathrm{i}\sqrt{2} \neq 0.$$

    $$\boxed{\text{le vecteur obtenu n'est pas orthogonal à } e_{1}}$$
     *Piège.* L'erreur passe inaperçue dès que les coefficients sont réels ; c'est précisément pour cela que la remarque suivant le théorème 2 insiste sur l'ordre $\langle e_{k}, x_{n} \rangle$.
- id: "mp-10-12"
  feuille: "f-mp-10"
  numero: 12
