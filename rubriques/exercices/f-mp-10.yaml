  source: "Espaces préhilbertiens réels (PCSI), exercices 14 et 25 (question 2)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Orthonormaliser la famille $(1, X, X^{2}, X^{3})$ pour le produit scalaire $\displaystyle \langle P, Q \rangle = \int_{-1}^{1} P(t)Q(t)\,\mathrm{d} t$.

    **2.** Orthonormaliser la famille $(1, X, X^{2})$ pour le produit scalaire $\displaystyle \langle P, Q \rangle = \int_{0}^{1} P(t)Q(t)\,\mathrm{d} t$. Comment passer de l'un des résultats à l'autre par un changement de variable affine ?
  corrige: |
    **1.** Les trois premiers vecteurs sont ceux de l'exemple de la section 10.3. Pour $X^{3}$, les produits avec $e_{0}$ et $e_{2}$ sont nuls par imparité, et $\langle X, X^{3} \rangle = \frac{2}{5}$, $\lVert X \rVert^{2} = \frac{2}{3}$, d'où $y_{3} = X^{3} - \frac{3}{5}X$, de carré scalaire $\frac{8}{175}$. 
    $$\boxed{e_{0} = \frac{1}{\sqrt{2}}, \quad e_{1} = \sqrt{\frac{3}{2}}\,X, \quad e_{2} = \sqrt{\frac{5}{8}}\,(3X^{2} - 1), \quad e_{3} = \sqrt{\frac{7}{8}}\,(5X^{3} - 3X)}$$

    **2.** Sur $[0, 1]$ : $e_{0} = 1$, $y_{1} = X - \frac{1}{2}$ de carré scalaire $\frac{1}{12}$, puis $y_{2} = X^{2} - X + \frac{1}{6}$ de carré scalaire $\frac{1}{180}$. 
    $$\boxed{f_{0} = 1, \qquad f_{1} = \sqrt{3}\,(2X - 1), \qquad f_{2} = \sqrt{5}\,(6X^{2} - 6X + 1)}$$
     Le changement de variable $t = 2s - 1$ envoie $[0, 1]$ sur $[-1, 1]$, avec $\mathrm{d} t = 2\,\mathrm{d} s$. Si $(e_{k})$ est orthonormée sur $[-1, 1]$, les polynômes $s \mapsto \sqrt{2}\,e_{k}(2s - 1)$ le sont sur $[0, 1]$, et ils ont la même propriété triangulaire : par l'unicité du théorème 2, $f_{k}(s) = \sqrt{2}\,e_{k}(2s - 1)$. On vérifie par exemple $\sqrt{2}\sqrt{\frac{3}{2}}(2s - 1) = \sqrt{3}(2s - 1)$.
- id: "mp-10-13"
  feuille: "f-mp-10"
  numero: 13
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [orthogonalité]
  noeuds: [fq-orthogonalite]
  notions: [famille-orthonormee]
  source: "Espaces préhilbertiens réels (PCSI), exercice 8 ; Espaces préhilbertiens et euclidiens (MP*), exercices d'application 3 et 9"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Soit $F$ et $G$ deux sous-espaces vectoriels de $E$.

    **1.** Montrer que $(F + G)^{\perp} = F^{\perp} \cap G^{\perp}$ et que $F^{\perp} + G^{\perp} \subset (F \cap G)^{\perp}$.

    **2.** On suppose $E$ de dimension finie. Montrer que $(F \cap G)^{\perp} = F^{\perp} + G^{\perp}$.

    **3.** On suppose que $E = F \oplus F^{\perp}$. Montrer que $(F^{\perp})^{\perp} = F$.
  corrige: |
    **1.** Un vecteur est orthogonal à $F + G$ si et seulement s'il l'est à $F$ et à $G$, puisque $F$ et $G$ sont contenus dans $F + G$ et que l'orthogonalité à un vecteur est préservée par combinaison linéaire. Ensuite, $F \cap G \subset F$ donne $F^{\perp} \subset (F \cap G)^{\perp}$, de même pour $G$, et $(F \cap G)^{\perp}$ est un sous-espace : il contient $F^{\perp} + G^{\perp}$.

    **2.** En dimension finie, $(H^{\perp})^{\perp} = H$ pour tout sous-espace (théorème 3 (iv)). Par la question 1 appliquée à $F^{\perp}$ et $G^{\perp}$, 
    $$(F^{\perp} + G^{\perp})^{\perp} = (F^{\perp})^{\perp} \cap (G^{\perp})^{\perp} = F \cap G,$$
     et l'on prend l'orthogonal des deux membres. $\boxed{(F \cap G)^{\perp} = F^{\perp} + G^{\perp}}$

    **3.** Soit $x \in (F^{\perp})^{\perp}$, que l'on écrit $x = f + g$ avec $f \in F$ et $g \in F^{\perp}$. Alors $g = x - f$ est dans $(F^{\perp})^{\perp}$, qui contient $x$ et $F$ ; il est donc orthogonal à lui-même, et $x = f \in F$. L'autre inclusion est la proposition 3 (ii).

    *Piège.* En dimension infinie, seule l'inclusion $F^{\perp} + G^{\perp} \subset (F \cap G)^{\perp}$ subsiste en général, comme les exemples de l'exercice 14 le laissent deviner.
- id: "mp-10-14"
  feuille: "f-mp-10"
  numero: 14
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [orthogonalité, produits scalaires intégraux]
  noeuds: [fq-orthogonalite, ri-integrable]
  notions: [famille-orthonormee]
  source: "Espaces préhilbertiens réels (PCSI), exercice 9 ; Espaces préhilbertiens et euclidiens (MP*), exercice d'application 9 (d)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *Orthogonaux en dimension infinie.*

    **1.** On munit $E = \mathcal{C}([0, 1], \mathbb{R})$ de $\displaystyle \langle f, g \rangle = \int_{0}^{1} fg$, et l'on pose $H = \{f \in E \mid f(0) = 0\}$. Soit $f \in H^{\perp}$ et $g : t \mapsto tf(t)$. Montrer que $f = 0$. En déduire $H^{\perp}$ et $(H^{\perp})^{\perp}$. L'hyperplan $H$ est-il fermé dans $E$ ?

    **2.** On munit $E = \mathcal{C}([-1, 1], \mathbb{R})$ de $\displaystyle \langle f, g \rangle = \int_{-1}^{1} fg$, et l'on pose $F = \{f \in E \mid f = 0 \text{ sur } [-1, 0]\}$. Montrer que $F$ est fermé, déterminer $F^{\perp}$, et montrer que $F \oplus F^{\perp} \neq E$.

    Ces deux exemples montrent qu'en dimension infinie, ni l'égalité $(F^{\perp})^{\perp} = F$ ni l'égalité $F \oplus F^{\perp} = E$ ne sont garanties, même pour un sous-espace fermé.
  corrige: |
    **1.** La fonction $g : t \mapsto tf(t)$ est continue et nulle en $0$ : elle est dans $H$, donc 
    $$\langle f, g \rangle = \int_{0}^{1} tf(t)^{2}\,\mathrm{d} t = 0.$$
     La fonction continue positive $t \mapsto tf(t)^{2}$ est nulle, donc $f$ est nulle sur $]0, 1]$, puis en $0$ par continuité. 
    $$\boxed{H^{\perp} = \{0\}, \qquad (H^{\perp})^{\perp} = E \neq H}$$
     L'hyperplan $H$ n'est pas fermé : les fonctions $f_{n}(t) = \min(nt, 1)$ sont dans $H$, et 
    $$\lVert 1 - f_{n} \rVert^{2} = \int_{0}^{1/n} (1 - nt)^{2}\,\mathrm{d} t = \frac{1}{3n} \xrightarrow[n \to +\infty]{} 0,$$
     alors que la limite $1$ n'est pas dans $H$. Il est même dense, ce qui est cohérent avec $H^{\perp} = \overline{H}^{\perp} = \{0\}$ (proposition 3 (i)).

    **2.** *$F$ est fermé.* Si $f_{n} \in F$ converge vers $f$, alors $\int_{-1}^{0} f^{2} = \int_{-1}^{0} (f - f_{n})^{2} \leqslant \lVert f - f_{n} \rVert^{2} \to 0$, donc $f = 0$ sur $[-1, 0]$.

    *Orthogonal.* Soit $g \in F^{\perp}$. La fonction $f : t \mapsto \max(t, 0)g(t)$ est continue et nulle sur $[-1, 0]$, donc $0 = \langle f, g \rangle = \int_{0}^{1} tg(t)^{2}\,\mathrm{d} t$, et $g = 0$ sur $[0, 1]$. Réciproquement, une fonction nulle sur $[0, 1]$ est orthogonale à $F$. 
    $$\boxed{F^{\perp} = \{g \in E \mid g = 0 \text{ sur } [0, 1]\}}$$
     *Somme.* Tout élément $f + g$ de $F \oplus F^{\perp}$ est nul en $0$ : la fonction constante $1$ n'y est pas. $\boxed{F \oplus F^{\perp} \neq E}$
- id: "mp-10-15"
  feuille: "f-mp-10"
  numero: 15
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [orthogonalité]
  noeuds: [fq-orthogonalite]
  notions: [famille-orthonormee, produit-scalaire]
  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 25 (condition de l'énoncé corrigée en P(1) = 0)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On munit $\mathbb{R}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \sum_{n = 0}^{+\infty} p_{n}q_{n}$, où $\displaystyle P = \sum_{n \geqslant 0} p_{n}X^{n}$ et $\displaystyle Q = \sum_{n \geqslant 0} q_{n}X^{n}$. On pose $H = \{P \in \mathbb{R}[X] \mid P(1) = 0\}$. Déterminer $H^{\perp}$. A-t-on $H \oplus H^{\perp} = \mathbb{R}[X]$ ? A-t-on $(H^{\perp})^{\perp} = H$ ?
  corrige: |
    Les polynômes $X^{k} - X^{k + 1}$, pour $k \in \mathbb{N}$, sont dans $H$. Si $Q = \sum q_{n}X^{n} \in H^{\perp}$, alors, pour tout $k$, 
    $$\langle Q, X^{k} - X^{k + 1} \rangle = q_{k} - q_{k + 1} = 0 :$$
     tous les coefficients de $Q$ sont égaux. Comme ils sont nuls à partir d'un certain rang, $Q = 0$. 
    $$\boxed{H^{\perp} = \{0\}, \qquad H \oplus H^{\perp} = H \neq \mathbb{R}[X], \qquad (H^{\perp})^{\perp} = \mathbb{R}[X] \neq H}$$
     *Commentaire.* La forme linéaire $P \mapsto P(1) = \sum p_{n}$ n'est représentée par aucun polynôme : le « vecteur » qui la représenterait serait $\sum_{n} X^{n}$, qui n'est pas un polynôme. En dimension finie, cela n'arrive jamais (proposition 9 (i), et chapitre 7).
- id: "mp-10-16"
  feuille: "f-mp-10"
  numero: 16
  partie: "Orthogonalité et bases orthonormées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [orthogonalité, projection orthogonale]
  noeuds: [fq-orthogonalite, me-produit-scalaire]
  notions: [famille-orthonormee, projection-orthogonale, produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercice 10 ; Feuille d'exercices espaces préhilbertiens (PLD), exercice 21 ; Espaces préhilbertiens et euclidiens (MP*), travaux dirigés 1, question 5"
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On munit $\mathcal{M}_{n}(\mathbb{R})$ du produit scalaire $\langle A, B \rangle = \operatorname{tr}({A}^{T}B)$.

    **1.** Déterminer l'orthogonal du sous-espace $\mathcal{D}_{n}(\mathbb{R})$ des matrices diagonales.

    **2.** Montrer que l'orthogonal de $\mathcal{S}_{n}(\mathbb{R})$ est $\mathcal{A}_{n}(\mathbb{R})$, l'espace des matrices antisymétriques.

    **3.** Soit $M \in \mathcal{M}_{n}(\mathbb{R})$. Expliciter le projeté orthogonal de $M$ sur $\mathcal{S}_{n}(\mathbb{R})$, et en déduire la distance de $M$ à $\mathcal{A}_{n}(\mathbb{R})$. Calculer cette distance pour $M = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}$.
  corrige: |
    **1.** Pour la base canonique, $\langle E_{ij}, M \rangle = m_{ij}$. Une matrice est orthogonale aux $E_{ii}$, qui engendrent $\mathcal{D}_{n}(\mathbb{R})$, si et seulement si ses coefficients diagonaux sont nuls. 
    $$\boxed{\mathcal{D}_{n}(\mathbb{R})^{\perp} = \{M \in \mathcal{M}_{n}(\mathbb{R}) \mid m_{ii} = 0 \text{ pour tout } i\}}$$

    **2.** Si $S$ est symétrique et $A$ antisymétrique, alors $\langle S, A \rangle = \operatorname{tr}(SA)$, et 
    $$\operatorname{tr}(SA) = \operatorname{tr}\big({(SA)}^{T}\big) = \operatorname{tr}({A}^{T}{S}^{T}) = -\operatorname{tr}(AS) = -\operatorname{tr}(SA),$$
     donc $\langle S, A \rangle = 0$. Ainsi $\mathcal{A}_{n}(\mathbb{R}) \subset \mathcal{S}_{n}(\mathbb{R})^{\perp}$, et l'égalité vient des dimensions, $\frac{n(n - 1)}{2} = n^{2} - \frac{n(n + 1)}{2}$.

    **3.** La décomposition $M = \frac{M + {M}^{T}}{2} + \frac{M - {M}^{T}}{2}$ est la décomposition selon $\mathcal{S}_{n}(\mathbb{R}) \oplus \mathcal{S}_{n}(\mathbb{R})^{\perp}$ : 
    $$\boxed{p(M) = \frac{M + {M}^{T}}{2}, \qquad d\big(M, \mathcal{A}_{n}(\mathbb{R})\big) = \Big\|\frac{M + {M}^{T}}{2}\Big\|}$$
     Pour $M = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}$, la partie symétrique est $\begin{pmatrix} 1 & 1 \\ 1 & 3 \end{pmatrix}$, de norme $\sqrt{1 + 1 + 1 + 9}$ : $\boxed{d = 2\sqrt{3}}$
- id: "mp-10-17"
  feuille: "f-mp-10"
