  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 30"
  page_enonce: 9
  page_corrige: 18
  enonce: |
    On munit $\mathbb{R}_{n}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{-1}^{1} PQ$, et l'on pose $u(P) = \big((1 - X^{2})P'\big)'$.

    **1.** Montrer que $u$ est un endomorphisme autoadjoint de $\mathbb{R}_{n}[X]$, et qu'il est représenté par une matrice triangulaire supérieure dans la base canonique.

    **2.** En déduire ses valeurs propres, la dimension de chacun de ses sous-espaces propres, et le degré d'un vecteur propre associé à chaque valeur propre.

    **3.** Retrouver ainsi que les polynômes de Legendre sont deux à deux orthogonaux, sans utiliser la formule de Rodrigues.
  corrige: |
    **1.** La linéarité est claire, et $u(X^{k}) = \big(k(1 - X^{2})X^{k - 1}\big)' = k(k - 1)X^{k - 2} - k(k + 1)X^{k}$ est de degré au plus $k$ : $u$ laisse $\mathbb{R}_{n}[X]$ stable, avec une matrice triangulaire supérieure de diagonale $\big(-k(k + 1)\big)_{0 \leqslant k \leqslant n}$. Une intégration par parties, de crochet nul grâce au facteur $1 - t^{2}$, donne 
    $$\langle u(P), Q \rangle = -\int_{-1}^{1} (1 - t^{2})P'(t)Q'(t)\,\mathrm{d} t = \langle P, u(Q) \rangle : \quad u \text{ est autoadjoint.}$$

    **2.** Les valeurs propres sont les coefficients diagonaux, deux à deux distincts : les sous-espaces propres sont des droites. Le vecteur propre associé à $-k(k + 1)$ est de degré exactement $k$ : la restriction de $u$ à $\mathbb{R}_{k}[X]$ a pour valeurs propres $-j(j + 1)$, $j \leqslant k$, et un vecteur propre pour $-k(k + 1)$, s'il était dans $\mathbb{R}_{k - 1}[X]$, y donnerait une valeur propre absente. 
    $$\boxed{\operatorname{Sp}(u) = \{-k(k + 1) \mid 0 \leqslant k \leqslant n\}, \ \text{droites propres engendrées par un polynôme de degré } k}$$

    **3.** Les sous-espaces propres d'un endomorphisme autoadjoint sont orthogonaux (chapitre 7). Le vecteur propre de degré $k$ est proportionnel à $L_{k}$ (proposition 8 (ii)) ; les $L_{k}$ sont donc deux à deux orthogonaux, sans recours à la formule de Rodrigues.
- id: "mp-10-38"
  feuille: "f-mp-10"
  numero: 38
  partie: "Polynômes orthogonaux"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [polynômes orthogonaux, endomorphismes hermitiens, produits scalaires intégraux]
  noeuds: [f-bases-hilbertiennes, f-autoadjoints, ri-integrable]
