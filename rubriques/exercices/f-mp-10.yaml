  enonce: |
    Soit $(e_{n})$ une suite orthonormée totale de $E$, préhilbertien réel. On note $c(x) = \big(\langle e_{n}, x \rangle\big)_{n \in \mathbb{N}}$.

    **1.** Montrer que $c$ est une application linéaire de $E$ dans $\ell^{2}$, qui conserve le produit scalaire. En déduire qu'elle est injective.

    **2.** Montrer que, si $\langle e_{n}, x \rangle = \langle e_{n}, y \rangle$ pour tout $n$, alors $x = y$ : une fonction est déterminée par ses « coefficients ».

    **3.** Soit $E = \mathcal{C}([0, 1], \mathbb{R})$, muni de $\displaystyle \langle f, g \rangle = \int_{0}^{1} fg$, et $(e_{n})$ la suite orthonormée obtenue en orthonormalisant $(1, X, X^{2}, \dots)$. Montrer que $(e_{n})$ est totale. En déduire qu'une fonction continue $f$ sur $[0, 1]$ telle que $\displaystyle \int_{0}^{1} f(t)t^{n}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$ est nulle.
  corrige: |
    **1.** Par l'inégalité de Bessel, $c(x) \in \ell^{2}$, et $c$ est linéaire par linéarité du produit scalaire. Le théorème 4 donne $\langle x, y \rangle = \sum_{n} \langle e_{n}, x \rangle\langle e_{n}, y \rangle = \langle c(x), c(y) \rangle$. En particulier $\lVert c(x) \rVert = \lVert x \rVert$, donc $c(x) = 0$ entraîne $x = 0$. $\boxed{c \text{ est une isométrie linéaire injective}}$

    **2.** Si $c(x) = c(y)$, alors $c(x - y) = 0$, donc $x = y$.

    **3.** On a $\mathrm{Vect}(e_{0}, \dots, e_{n}) = \mathbb{R}_{n}[X]$ (théorème 2), donc $\mathrm{Vect}\{e_{n}\}$ est l'espace des fonctions polynomiales. Il est dense pour $\lVert \cdot \rVert_{2}$, par le théorème de Weierstrass (théorème 8 du chapitre 8) et l'inégalité $\lVert g \rVert_{2} \leqslant \lVert g \rVert_{\infty}$ sur $[0, 1]$ : la suite est totale (méthode de la section 10.5). Si $\int_{0}^{1} f(t)t^{n}\,\mathrm{d} t = 0$ pour tout $n$, alors $f$ est orthogonale à chaque $e_{k}$, combinaison des $t^{n}$ : $c(f) = 0$, et $f = 0$ par la question 2. 
    $$\boxed{\int_{0}^{1} f(t)t^{n}\,\mathrm{d} t = 0 \ \text{ pour tout } n \implies f = 0}$$
     C'est le « problème des moments » de Hausdorff dans sa version la plus simple : une fonction continue est déterminée par ses moments.
- id: "mp-10-33"
  feuille: "f-mp-10"
  numero: 33
  partie: "Polynômes orthogonaux"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [polynômes orthogonaux, produits scalaires intégraux]
  noeuds: [f-bases-hilbertiennes, ri-integrable]
  notions: [produit-scalaire]
  source: "Espaces préhilbertiens réels (PCSI), exercice 11 (indication d'intégration par parties retirée)"
  page_enonce: 8
  page_corrige: 16
  enonce: |
    On munit $E = \mathbb{R}_{n}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{0}^{1} P(t)Q(t)\,\mathrm{d} t$. Pour $0 \leqslant p \leqslant n$, on pose $Q_{p} = X^{p}(X - 1)^{p}$ et $L_{p} = Q_{p}^{(p)}$.

    **1.** Montrer que $L_{p}$ est un polynôme dont on précisera le degré et le coefficient dominant.

    **2.** Calculer $\langle L_{p}, L_{q} \rangle$ pour $p \neq q$. En déduire que $(L_{0}, \dots, L_{n})$ est une base orthogonale de $E$.

    **3.** Calculer $\lVert L_{p} \rVert$.

    **4.** Comparer $L_{1}$ et $L_{2}$ aux vecteurs obtenus à l'exercice 12, question 2.
  corrige: |
    La méthode est celle de la proposition 8 : des intégrations par parties répétées, dont les crochets sont nuls parce que $0$ et $1$ sont racines d'ordre $p$ de $Q_{p}$.

    **1.** $Q_{p}$ est de degré $2p$, de coefficient dominant $1$, donc 
    $$\boxed{\deg L_{p} = p, \qquad \text{coefficient dominant de } L_{p} : \ \frac{(2p)!}{p!}}$$

    **2.** Pour $k < p$, $Q_{p}^{(k)}$ s'annule en $0$ et en $1$. Pour $Q \in \mathbb{R}_{p - 1}[X]$, $p$ intégrations par parties donnent 
    $$\langle L_{p}, Q \rangle = \int_{0}^{1} Q_{p}^{(p)}Q = (-1)^{p}\int_{0}^{1} Q_{p}Q^{(p)} = 0.$$
     Ainsi $L_{p} \perp \mathbb{R}_{p - 1}[X]$, donc $\langle L_{p}, L_{q} \rangle = 0$ pour $q < p$. La famille $(L_{0}, \dots, L_{n})$, orthogonale et formée de vecteurs non nuls, est libre (proposition 3) ; elle a $n + 1$ éléments dans $\mathbb{R}_{n}[X]$ : c'est une base orthogonale.

    **3.** Seul le terme dominant de $L_{p}$ compte dans $\langle L_{p}, L_{p} \rangle$, et le calcul de la question 2 avec $Q = X^{p}$, pour lequel $Q^{(p)} = p!$, donne 
    $$\lVert L_{p} \rVert^{2} = \frac{(2p)!}{p!}\langle X^{p}, L_{p} \rangle = \frac{(2p)!}{p!}(-1)^{p}p!\int_{0}^{1} t^{p}(t - 1)^{p}\,\mathrm{d} t = (2p)!\int_{0}^{1} t^{p}(1 - t)^{p}\,\mathrm{d} t.$$
     L'intégrale $I_{p, q} = \int_{0}^{1} t^{p}(1 - t)^{q}\,\mathrm{d} t$ vérifie $I_{p, q} = \frac{q}{p + 1}I_{p + 1, q - 1}$ par intégration par parties, d'où $I_{p, p} = \frac{(p!)^{2}}{(2p + 1)!}$. 
    $$\boxed{\lVert L_{p} \rVert = \frac{p!}{\sqrt{2p + 1}}}$$

    **4.** On a $L_{1} = 2X - 1$ et $L_{2} = 12X^{2} - 12X + 2$, de normes $\frac{1}{\sqrt{3}}$ et $\frac{2}{\sqrt{5}}$. Les vecteurs de l'exercice 12 sont $f_{1} = \sqrt{3}\,L_{1}$ et $f_{2} = \frac{\sqrt{5}}{2}L_{2}$ : ce sont les $L_{p}$ normalisés, comme l'impose l'unicité dans le théorème 2.
- id: "mp-10-34"
