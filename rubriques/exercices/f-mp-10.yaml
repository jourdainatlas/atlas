  enonce: |
    *Perspective : un critère de dimension finie.* Soit $C > 0$ et $E$ un sous-espace vectoriel de $\mathcal{C}([0, 1], \mathbb{R})$ tel que $\lVert f \rVert_{\infty} \leqslant C\lVert f \rVert_{2}$ pour tout $f \in E$, où $\displaystyle \lVert f \rVert_{2} = \Big(\int_{0}^{1} f^{2}\Big)^{1/2}$.

    **1.** Soit $(f_{1}, \dots, f_{n})$ une famille orthonormée de $E$ pour $\displaystyle \langle f, g \rangle = \int_{0}^{1} fg$. Montrer que, pour tout $x \in [0, 1]$ et tout $(a_{1}, \dots, a_{n}) \in \mathbb{R}^{n}$, 
    $$\Big|\sum_{i = 1}^{n} a_{i}f_{i}(x)\Big| \leqslant C\Big(\sum_{i = 1}^{n} a_{i}^{2}\Big)^{1/2}.$$

    **2.** En choisissant $a_{i} = f_{i}(x)$, montrer que $\displaystyle \sum_{i = 1}^{n} f_{i}(x)^{2} \leqslant C^{2}$, puis que $n \leqslant C^{2}$.

    **3.** En déduire que $E$ est de dimension finie, au plus $C^{2}$.

    **4.** Montrer que, pour $E = \mathbb{R}_{1}[X]$, on peut prendre $C = 2$, et que cette constante est la meilleure possible.

    En dimension infinie, les normes $\lVert \cdot \rVert_{\infty}$ et $\lVert \cdot \rVert_{2}$ ne sont jamais équivalentes sur un sous-espace de dimension infinie de $\mathcal{C}([0, 1], \mathbb{R})$ : c'est le phénomène observé dans le cours avec les fonctions $t \mapsto t^{n}$.
  corrige: |
    **1.** La fonction $g = \sum_{i} a_{i}f_{i}$ est dans $E$, et $\lVert g \rVert_{2}^{2} = \sum_{i} a_{i}^{2}$ par la proposition 4 (ii). Donc 
    $$|g(x)| \leqslant \lVert g \rVert_{\infty} \leqslant C\lVert g \rVert_{2} = C\Big(\sum_{i = 1}^{n} a_{i}^{2}\Big)^{1/2}.$$

    **2.** Avec $a_{i} = f_{i}(x)$, on obtient $\sum_{i} f_{i}(x)^{2} \leqslant C\big(\sum_{i} f_{i}(x)^{2}\big)^{1/2}$, d'où $\sum_{i} f_{i}(x)^{2} \leqslant C^{2}$ pour tout $x \in [0, 1]$. On intègre sur $[0, 1]$ : $\sum_{i} \lVert f_{i} \rVert_{2}^{2} = n \leqslant C^{2}$.

    **3.** Si $E$ était de dimension infinie, il contiendrait une famille libre de $n$ éléments pour tout $n$, que l'on orthonormaliserait (théorème 2) : contradiction avec $n \leqslant C^{2}$ pour $n > C^{2}$. $\boxed{\dim E \leqslant C^{2}}$

    **4.** Une base orthonormée de $\mathbb{R}_{1}[X]$ sur $[0, 1]$ est $f_{1} = 1$, $f_{2} = \sqrt{3}(2X - 1)$ (exercice 12). Par Cauchy-Schwarz dans $\mathbb{R}^{2}$, pour $g = a_{1}f_{1} + a_{2}f_{2}$, 
    $$|g(x)|^{2} \leqslant \big(a_{1}^{2} + a_{2}^{2}\big)\big(1 + 3(2x - 1)^{2}\big) \leqslant 4\lVert g \rVert_{2}^{2},$$
     donc $C = 2$ convient. Pour $g = f_{1}(1)f_{1} + f_{2}(1)f_{2} = 6X - 2$, il y a égalité en $x = 1$ : $\lVert g \rVert_{\infty} = 4$ et $\lVert g \rVert_{2}^{2} = \int_{0}^{1} (6t - 2)^{2}\,\mathrm{d} t = 4$. $\boxed{C = 2 \text{ est optimale}}$
- id: "mp-10-50"
  feuille: "f-mp-10"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [synthèse, identités de polarisation, Gram-Schmidt et matrice de Gram]
  noeuds: [me-produit-scalaire, fq-orthogonalite]
  notions: [identite-parallelogramme, famille-orthonormee, produit-scalaire]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    *Perspective : l'identité du parallélogramme caractérise les normes euclidiennes.* Soit $(E, \lVert \cdot \rVert)$ un espace vectoriel normé réel dont la norme vérifie, pour tous $x$, $y \in E$, l'identité du parallélogramme écrite à gauche ci-dessous, et l'on pose, comme à droite, 
    $$\lVert x + y \rVert^{2} + \lVert x - y \rVert^{2} = 2\big(\lVert x \rVert^{2} + \lVert y \rVert^{2}\big), \qquad \langle x, y \rangle = \frac{1}{4}\big(\lVert x + y \rVert^{2} - \lVert x - y \rVert^{2}\big).$$

    **1.** Montrer que $\langle \cdot, \cdot \rangle$ est symétrique, que $\langle x, x \rangle = \lVert x \rVert^{2}$, et que $\langle 0, y \rangle = 0$.

    **2.** En appliquant l'identité du parallélogramme aux couples $(x + y, x')$ et $(x - y, x')$, montrer que $\langle x + x', y \rangle + \langle x - x', y \rangle = 2\langle x, y \rangle$.

    **3.** En déduire que $\langle 2x, y \rangle = 2\langle x, y \rangle$, puis que $\langle a + b, y \rangle = \langle a, y \rangle + \langle b, y \rangle$ pour tous $a$, $b$, $y$.

    **4.** Montrer que $\langle rx, y \rangle = r\langle x, y \rangle$ pour tout rationnel $r$, puis pour tout réel $r$, en utilisant la continuité de la norme.

    **5.** Conclure que $\langle \cdot, \cdot \rangle$ est un produit scalaire dont la norme associée est $\lVert \cdot \rVert$.

    Ce résultat a été publié par Pascual Jordan et John von Neumann en 1935, dans les *Annals of Mathematics*.
  corrige: |
    **1.** La symétrie vient de $\lVert y - x \rVert = \lVert x - y \rVert$, la valeur $\langle x, x \rangle = \frac{1}{4}\lVert 2x \rVert^{2} = \lVert x \rVert^{2}$ de l'homogénéité, et $\langle 0, y \rangle = \frac{1}{4}(\lVert y \rVert^{2} - \lVert -y \rVert^{2}) = 0$.

    **2.** L'identité du parallélogramme pour les couples $(x + y, x')$ et $(x - y, x')$ s'écrit 
    $$\lVert x + y + x' \rVert^{2} + \lVert x + y - x' \rVert^{2} = 2\lVert x + y \rVert^{2} + 2\lVert x' \rVert^{2}, \quad \lVert x - y + x' \rVert^{2} + \lVert x - y - x' \rVert^{2} = 2\lVert x - y \rVert^{2} + 2\lVert x' \rVert^{2}.$$
     On soustrait et l'on divise par $4$ : $\boxed{\langle x + x', y \rangle + \langle x - x', y \rangle = 2\langle x, y \rangle}$

    **3.** Avec $x' = x$ et la question 1 : $\langle 2x, y \rangle = 2\langle x, y \rangle$. Avec $x = \frac{a + b}{2}$ et $x' = \frac{a - b}{2}$, puis la relation précédente : 
    $$\langle a, y \rangle + \langle b, y \rangle = 2\Big\langle\frac{a + b}{2}, y\Big\rangle = \langle a + b, y \rangle.$$

    **4.** Par récurrence, $\langle nx, y \rangle = n\langle x, y \rangle$ pour $n \in \mathbb{N}$, et $\langle -x, y \rangle = -\langle x, y \rangle$ par additivité et $\langle 0, y \rangle = 0$ : c'est vrai pour $n \in \mathbb{Z}$. Pour $r = \frac{p}{q}$, $q\langle rx, y \rangle = \langle px, y \rangle = p\langle x, y \rangle$. Enfin, l'application $\lambda \mapsto \langle \lambda x, y \rangle$ est continue, car la norme l'est ; les deux fonctions continues $\lambda \mapsto \langle \lambda x, y \rangle$ et $\lambda \mapsto \lambda\langle x, y \rangle$ coïncident sur $\mathbb{Q}$, dense dans $\mathbb{R}$, donc partout.

    **5.** La forme est symétrique et linéaire par rapport à la première variable, donc bilinéaire, et le nombre $\langle x, x \rangle = \lVert x \rVert^{2}$ est strictement positif pour $x \neq 0$. 
    $$\boxed{\lVert \cdot \rVert \text{ est la norme associée au produit scalaire } \langle \cdot, \cdot \rangle}$$

    L'identité du parallélogramme, nécessaire par la proposition 1, est donc aussi suffisante. Avec l'exercice 7 (3), elle permet de reconnaître immédiatement les normes qui ne sont pas euclidiennes.
