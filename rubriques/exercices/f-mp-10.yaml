  source: "Espaces préhilbertiens et euclidiens (MP*), exercice 9 ; application numérique ajoutée"
  page_enonce: 11
  page_corrige: 22
  enonce: |
    *Perspective : la méthode des moindres carrés.* Soit $E$ et $F$ deux espaces euclidiens, $u \in \mathcal{L}(E, F)$ et $b \in F$. On appelle *pseudo-solution* de l'équation $u(x) = b$ tout vecteur $x \in E$ qui minimise $\lVert u(x) - b \rVert$. On note $p$ la projection orthogonale de $F$ sur $\mathrm{Im}\, u$.

    **1.** Montrer que les pseudo-solutions sont les solutions de l'équation $u(x) = p(b)$, et qu'elles forment un sous-espace affine de direction $\mathrm{Ker}\, u$. Lorsque $E = \mathbb{R}^{p}$ et $F = \mathbb{R}^{n}$, montrer que ce sont aussi les solutions des *équations normales* ${A}^{T}AX = {A}^{T}B$, où $A$ est la matrice de $u$ et $B$ la colonne de $b$.

    **2.** Montrer que, parmi les pseudo-solutions, il en existe une unique de norme minimale, notée $u^{+}(b)$, et la caractériser géométriquement.

    **3.** Montrer que $u^{+} : F \to E$ est linéaire, d'image $(\mathrm{Ker}\, u)^{\perp}$ et de noyau $(\mathrm{Im}\, u)^{\perp}$.

    **4.** Identifier $u \circ u^{+}$ et $u^{+} \circ u$, et en déduire que $u^{+} \circ u \circ u^{+} = u^{+}$ et $u \circ u^{+} \circ u = u$.

    **5.** *Application.* On cherche la droite $y = \alpha x + \beta$ qui approche « au mieux » les points $(0, 1)$, $(1, 2)$, $(2, 2)$, $(3, 4)$, au sens où la somme des carrés des écarts verticaux est minimale. Écrire ce problème comme la recherche d'une pseudo-solution, calculer $\alpha$ et $\beta$, puis la somme minimale des carrés.

    La méthode a été publiée pour la première fois par Legendre en 1805, dans un appendice à ses *Nouvelles méthodes pour la détermination des orbites des comètes*.
  corrige: |
    **1.** Quand $x$ décrit $E$, $u(x)$ décrit $\mathrm{Im}\, u$, sous-espace de dimension finie : par le théorème 3 (ii), $\lVert u(x) - b \rVert$ est minimal si et seulement si $u(x) = p(b)$. Cette équation a des solutions, puisque $p(b) \in \mathrm{Im}\, u$, et l'ensemble $S$ de ses solutions est $x_{0} + \mathrm{Ker}\, u$ pour une solution $x_{0}$. Matriciellement, $u(x) = p(b)$ équivaut à $AX - B \in (\mathrm{Im}\, u)^{\perp} = \mathrm{Ker}\,({A}^{T})$ (exercice 17) : 
    $$\boxed{x \text{ pseudo-solution} \iff u(x) = p(b) \iff {A}^{T}AX = {A}^{T}B}$$

    **2.** On cherche le point de $S = x_{0} + \mathrm{Ker}\, u$ le plus proche de $0$. Pour $x = x_{0} + k \in S$, $\lVert x \rVert$ est minimal si et seulement si $k = -p_{\mathrm{Ker}\, u}(x_{0})$, c'est-à-dire si $x = x_{0} - p_{\mathrm{Ker}\, u}(x_{0}) \in (\mathrm{Ker}\, u)^{\perp}$. $\boxed{u^{+}(b) \text{ est l'unique pseudo-solution orthogonale à } \mathrm{Ker}\, u}$

    **3.** La restriction $v$ de $u$ à $(\mathrm{Ker}\, u)^{\perp}$ est injective, et d'image $\mathrm{Im}\, u$, puisque $u(x) = u(x - p_{\mathrm{Ker}\, u}(x))$ : c'est un isomorphisme de $(\mathrm{Ker}\, u)^{\perp}$ sur $\mathrm{Im}\, u$. Par la question 2, $u^{+} = v^{-1} \circ p$, qui est linéaire. 
    $$\boxed{\mathrm{Im}\, u^{+} = (\mathrm{Ker}\, u)^{\perp}, \qquad \mathrm{Ker}\, u^{+} = \mathrm{Ker}\, p = (\mathrm{Im}\, u)^{\perp}}$$

    **4.** On a $u \circ u^{+} = v \circ v^{-1} \circ p = p$, projection orthogonale sur $\mathrm{Im}\, u$. Pour $x = x_{1} + x_{2}$ avec $x_{1} \in (\mathrm{Ker}\, u)^{\perp}$ et $x_{2} \in \mathrm{Ker}\, u$, $u^{+}(u(x)) = v^{-1}(v(x_{1})) = x_{1}$ : $u^{+} \circ u$ est la projection orthogonale sur $(\mathrm{Ker}\, u)^{\perp}$. Ainsi $u^{+} \circ u \circ u^{+} = u^{+} \circ p = u^{+}$, car $u^{+}$ est nul sur $(\mathrm{Im}\, u)^{\perp}$, et $u \circ u^{+} \circ u = p \circ u = u$.

    **5.** On cherche une pseudo-solution de $AX = B$ avec 
    $$A = \begin{pmatrix} 0 & 1 \\ 1 & 1 \\ 2 & 1 \\ 3 & 1 \end{pmatrix}, \quad X = \begin{pmatrix} \alpha \\ \beta \end{pmatrix}, \quad B = \begin{pmatrix} 1 \\ 2 \\ 2 \\ 4 \end{pmatrix}, \qquad {A}^{T}A = \begin{pmatrix} 14 & 6 \\ 6 & 4 \end{pmatrix}, \quad {A}^{T}B = \begin{pmatrix} 18 \\ 9 \end{pmatrix}.$$
     Les équations normales $14\alpha + 6\beta = 18$ et $6\alpha + 4\beta = 9$ donnent $\alpha = \beta = \frac{9}{10}$. Les écarts sont $0{,}1$ ; $0{,}2$ ; $-0{,}7$ ; $0{,}4$. 
    $$\boxed{y = 0{,}9\,x + 0{,}9, \qquad \text{somme minimale des carrés} = \frac{7}{10}}$$
     La matrice $A$ est de rang $2$, donc la pseudo-solution est unique ici, et $u^{+} = ({A}^{T}A)^{-1}{A}^{T}$.
