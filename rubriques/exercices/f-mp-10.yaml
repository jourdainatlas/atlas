  noeuds: [f-bases-hilbertiennes, me-produit-scalaire]
  notions: [famille-orthonormee, projection-orthogonale, produit-scalaire]
  source: "exercice composé pour la feuille (cours, section 10.5) ; Feuille d'exercices espaces préhilbertiens (PLD), exercice 6"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    *L'espace $\ell^{2}$.* Pour $n \in \mathbb{N}$, on note $\delta_{n} \in \ell^{2}$ la suite dont tous les termes sont nuls, sauf le terme d'indice $n$, qui vaut $1$, et $F = \mathrm{Vect}\{\delta_{n} \mid n \in \mathbb{N}\}$.

    **1.** Montrer que $(\delta_{n})$ est orthonormée, et que $F$ est l'ensemble des suites nulles à partir d'un certain rang.

    **2.** Montrer que $F$ est dense dans $\ell^{2}$ et que $F^{\perp} = \{0\}$, mais que $F \neq \ell^{2}$.

    **3.** Pour $u = \big(\frac{1}{n + 1}\big)_{n \in \mathbb{N}}$, calculer $\lVert u \rVert$, puis la distance de $u$ à $F_{N} = \mathrm{Vect}(\delta_{0}, \dots, \delta_{N})$, et donner un équivalent de cette distance quand $N \to +\infty$.

    **4.** Montrer que la suite $(\delta_{n})$, bornée, n'a aucune suite extraite convergente.
  corrige: |
    **1.** On a $\langle \delta_{n}, \delta_{m} \rangle = \sum_{k} \delta_{n}(k)\delta_{m}(k) = \delta_{nm}$. Une combinaison linéaire finie de $\delta_{0}, \dots, \delta_{N}$ est nulle à partir du rang $N + 1$, et réciproquement une suite nulle à partir du rang $N + 1$ vaut $\sum_{k \leqslant N} u_{k}\delta_{k}$.

    **2.** Pour $u \in \ell^{2}$, la suite tronquée $u^{(N)} = (u_{0}, \dots, u_{N}, 0, \dots)$ est dans $F$, et $\lVert u - u^{(N)} \rVert^{2} = \sum_{k > N} u_{k}^{2}$, reste d'une série convergente, tend vers $0$ : $F$ est dense. Si $u \perp F$, alors $u_{n} = \langle \delta_{n}, u \rangle = 0$ pour tout $n$. Enfin, la suite $\big(\frac{1}{n + 1}\big)$ est dans $\ell^{2}$ mais pas dans $F$. 
    $$\boxed{\overline{F} = \ell^{2}, \qquad F^{\perp} = \{0\}, \qquad F \neq \ell^{2}}$$

    **3.** On a $\lVert u \rVert^{2} = \sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{\pi^{2}}{6}$, et le projeté de $u$ sur $F_{N}$ est sa troncature, d'où, par comparaison série-intégrale, 
    $$d(u, F_{N})^{2} = \sum_{k \geqslant N + 2} \frac{1}{k^{2}} \sim \frac{1}{N}, \qquad \boxed{\lVert u \rVert = \frac{\pi}{\sqrt{6}}, \quad d(u, F_{N}) \sim \frac{1}{\sqrt{N}}}$$

    **4.** Si $\delta_{\varphi(k)} \to v$, alors $v_{j} = \lim_{k} \langle \delta_{j}, \delta_{\varphi(k)} \rangle = 0$ pour tout $j$, donc $v = 0$, ce qui contredit $\lVert \delta_{\varphi(k)} \rVert = 1$. La boule unité fermée de $\ell^{2}$ n'est pas compacte.
- id: "mp-10-31"
  feuille: "f-mp-10"
  numero: 31
  partie: "Suites orthonormales et suites totales"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [suites totales, produits scalaires intégraux]
  noeuds: [f-bases-hilbertiennes, ri-integrable]
  notions: [famille-orthonormee]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On munit $\mathcal{C}([0, 1], \mathbb{R})$ de $\displaystyle \langle f, g \rangle = \int_{0}^{1} fg$, et l'on pose $e_{n}(x) = \sqrt{2}\sin(n\pi x)$ pour $n \geqslant 1$.

    **1.** Montrer que $(e_{n})_{n \geqslant 1}$ est une suite orthonormée.

    **2.** Calculer $\langle e_{n}, f \rangle$ pour la fonction constante $f = 1$, et en déduire, par l'inégalité de Bessel, que 
    $$\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}} \leqslant \frac{\pi^{2}}{8}.$$

    **3.** Vérifier, à l'aide de la valeur de $\displaystyle \sum_{n \geqslant 1} \frac{1}{n^{2}}$, que cette inégalité est en fait une égalité. Quelle égalité du théorème 4 cette identité illustre-t-elle, si l'on admet que la suite $(e_{n})$ est totale ?
  corrige: |
    **1.** Par la formule $2\sin a\sin b = \cos(a - b) - \cos(a + b)$, 
    $$\langle e_{n}, e_{m} \rangle = \int_{0}^{1} \big(\cos((n - m)\pi x) - \cos((n + m)\pi x)\big)\,\mathrm{d} x = \delta_{nm},$$
     car l'intégrale de $\cos(k\pi x)$ sur $[0, 1]$ est nulle pour $k \neq 0$ entier et vaut $1$ pour $k = 0$.

    **2.** On a $\langle e_{n}, 1 \rangle = \sqrt{2}\int_{0}^{1} \sin(n\pi x)\,\mathrm{d} x = \frac{\sqrt{2}\big(1 - (-1)^{n}\big)}{n\pi}$, nul pour $n$ pair et égal à $\frac{2\sqrt{2}}{n\pi}$ pour $n$ impair. L'inégalité de Bessel (proposition 5), avec $\lVert 1 \rVert^{2} = 1$, donne 
    $$\sum_{k = 0}^{+\infty} \frac{8}{(2k + 1)^{2}\pi^{2}} \leqslant 1, \qquad\text{soit}\qquad \boxed{\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}} \leqslant \frac{\pi^{2}}{8}}$$

    **3.** En séparant les indices pairs et impairs, $\sum_{n \geqslant 1} \frac{1}{n^{2}} = \frac{1}{4}\sum_{n \geqslant 1} \frac{1}{n^{2}} + \sum_{k \geqslant 0} \frac{1}{(2k + 1)^{2}}$, d'où 
    $$\sum_{k = 0}^{+\infty} \frac{1}{(2k + 1)^{2}} = \frac{3}{4}\cdot\frac{\pi^{2}}{6} = \frac{\pi^{2}}{8}.$$
     L'inégalité de Bessel est une égalité pour $f = 1$ : c'est l'égalité de Parseval du théorème 4 (iii), qui vaudrait pour toute fonction si la suite était totale. $\boxed{\text{égalité de Parseval pour } f = 1}$
- id: "mp-10-32"
  feuille: "f-mp-10"
  numero: 32
  partie: "Suites orthonormales et suites totales"
  etoiles: 2
  types: [Démonstration]
