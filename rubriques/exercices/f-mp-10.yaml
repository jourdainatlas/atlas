  page_enonce: 8
  page_corrige: 16
  enonce: |
    On munit $\mathbb{R}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{-1}^{1} P(t)Q(t)\,\mathrm{d} t$. Pour $n \in \mathbb{N}$, on pose $U_{n} = (1 - X^{2})^{n}$ et $K_{n} = U_{n}^{(n)}$.

    **1.** Montrer que, pour tous $n$, $m \in \mathbb{N}$, $\langle K_{n}, K_{m} \rangle = (-1)^{m}\big\langle U_{n}^{(n + m)}, U_{m}\big\rangle$.

    **2.** En déduire que la famille $(K_{n})_{n \in \mathbb{N}}$ est orthogonale, et calculer $\lVert K_{n} \rVert^{2}$.

    **3.** Déterminer l'orthonormalisée de Gram-Schmidt de la base canonique de $\mathbb{R}[X]$, et la relier aux polynômes de Legendre du cours.

    **4.** Calculer $K_{n}(1)$ et $K_{n}(-1)$.
  corrige: |
    **1.** Les réels $\pm 1$ sont racines d'ordre $m$ de $U_{m}$, donc de $U_{m}^{(k)}$ pour $k < m$. On intègre $m$ fois par parties, en dérivant $U_{n}^{(n)}$ et en intégrant $U_{m}^{(m)}$, tous les crochets étant nuls : 
    $$\langle K_{n}, K_{m} \rangle = \int_{-1}^{1} U_{n}^{(n)}U_{m}^{(m)} = (-1)^{m}\int_{-1}^{1} U_{n}^{(n + m)}U_{m}.$$

    **2.** Si $m > n$, alors $n + m > 2n = \deg U_{n}$ et $U_{n}^{(n + m)} = 0$ : la famille est orthogonale, par symétrie des rôles. Pour $m = n$, $U_{n} = (-1)^{n}X^{2n} + \cdots$, donc $U_{n}^{(2n)} = (-1)^{n}(2n)!$, et 
    $$\lVert K_{n} \rVert^{2} = (-1)^{n}(-1)^{n}(2n)!\int_{-1}^{1} (1 - t^{2})^{n}\,\mathrm{d} t = (2n)!\,\frac{2^{2n + 1}(n!)^{2}}{(2n + 1)!}, \qquad \boxed{\lVert K_{n} \rVert^{2} = \frac{2^{2n + 1}(n!)^{2}}{2n + 1}}$$
     en utilisant la valeur de $J_{n} = \int_{-1}^{1} (1 - t^{2})^{n}\,\mathrm{d} t$ établie dans la preuve de la proposition 8.

    **3.** Comme $(X^{2} - 1)^{n} = (-1)^{n}U_{n}$, on a $K_{n} = (-1)^{n}2^{n}n!\,L_{n}$. Les vecteurs $e_{n} = \pm\frac{K_{n}}{\lVert K_{n} \rVert}$ forment une famille orthonormée triangulaire ; la condition $\langle e_{n}, X^{n} \rangle > 0$ impose un coefficient dominant positif, donc le signe $(-1)^{n}$, celui du coefficient dominant $(-1)^{n}\frac{(2n)!}{n!}$ de $K_{n}$. 
    $$\boxed{e_{n} = \sqrt{\frac{2n + 1}{2}}\,L_{n}}$$
     On retrouve la proposition 8 (iii) du cours.

    **4.** Par la proposition 8, $L_{n}(1) = 1$, et $L_{n}(-1) = (-1)^{n}$, car $L_{n}$ a la parité de $n$. 
    $$\boxed{K_{n}(1) = (-1)^{n}2^{n}n!, \qquad K_{n}(-1) = 2^{n}n!}$$
- id: "mp-10-35"
  feuille: "f-mp-10"
