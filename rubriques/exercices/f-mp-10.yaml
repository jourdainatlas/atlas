  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 10 ; Espaces préhilbertiens et euclidiens (MP*), exercice d'application 6 (produit scalaire sans intégrale impropre, comme dans le cours)"
  page_enonce: 8
  page_corrige: 17
  enonce: |
    *Polynômes de Tchebychev.* Pour $f$, $g \in \mathcal{C}([-1, 1], \mathbb{R})$, on pose $\displaystyle \langle f, g \rangle = \int_{0}^{\pi} f(\cos\theta)g(\cos\theta)\,\mathrm{d}\theta$.

    **1.** Montrer que $\langle \cdot, \cdot \rangle$ est un produit scalaire sur $\mathcal{C}([-1, 1], \mathbb{R})$.

    **2.** Pour $n \in \mathbb{N}$, on note $T_{n}$ l'unique polynôme tel que $T_{n}(\cos\theta) = \cos(n\theta)$ pour tout réel $\theta$ (cours, section 10.6). Montrer que $(T_{n})$ est une famille orthogonale, et calculer $\lVert T_{n} \rVert$.

    **3.** Déterminer les racines de $T_{n}$, ainsi que les points de $[-1, 1]$ où $|T_{n}|$ atteint son maximum. Combien y en a-t-il ?

    **4.** Calculer la distance de la fonction $x \mapsto \sqrt{1 - x^{2}}$ à $\mathbb{R}_{2}[X]$ pour ce produit scalaire.
  corrige: |
    **1.** La forme est bilinéaire, symétrique et positive. Si $\langle f, f \rangle = 0$, la fonction continue et positive $\theta \mapsto f(\cos\theta)^{2}$ est nulle sur $[0, \pi]$ ; comme $\cos$ est une bijection de $[0, \pi]$ sur $[-1, 1]$, $f$ est nulle.

    **2.** Pour $n \neq m$, $\langle T_{n}, T_{m} \rangle = \int_{0}^{\pi} \cos(n\theta)\cos(m\theta)\,\mathrm{d}\theta = \frac{1}{2}\int_{0}^{\pi} \big(\cos((n - m)\theta) + \cos((n + m)\theta)\big)\,\mathrm{d}\theta = 0$. Le même calcul avec $n = m$ donne : 
    $$\boxed{\lVert T_{0} \rVert = \sqrt{\pi}, \qquad \lVert T_{n} \rVert = \sqrt{\frac{\pi}{2}} \ \ (n \geqslant 1)}$$

    **3.** Pour $x = \cos\theta$ avec $\theta \in [0, \pi]$, on a $T_{n}(x) = \cos(n\theta)$. Les racines correspondent à $n\theta \in \frac{\pi}{2} + \pi\mathbb{Z}$, et $|T_{n}(x)| = 1$ à $n\theta \in \pi\mathbb{Z}$ : 
    $$\boxed{\text{racines : } \cos\frac{(2k - 1)\pi}{2n}, \ k \in \llbracket 1\,,n \rrbracket ; \qquad |T_{n}| = 1 \text{ en } \cos\frac{k\pi}{n}, \ k \in \llbracket 0\,,n \rrbracket}$$
     Il y a $n + 1$ points où $|T_{n}|$ atteint son maximum $1$, avec des signes alternés : c'est cette « équioscillation » qui fait de $2^{1 - n}T_{n}$ le polynôme unitaire de degré $n$ de plus petite norme uniforme sur $[-1, 1]$.

    **4.** Pour $f(x) = \sqrt{1 - x^{2}}$, on a $f(\cos\theta) = \sin\theta$ sur $[0, \pi]$. On projette sur la base orthogonale $(T_{0}, T_{1}, T_{2})$ de $\mathbb{R}_{2}[X]$ : 
    $$\langle T_{0}, f \rangle = \int_{0}^{\pi} \sin\theta\,\mathrm{d}\theta = 2, \qquad \langle T_{1}, f \rangle = 0, \qquad \langle T_{2}, f \rangle = \int_{0}^{\pi} \sin\theta\cos 2\theta\,\mathrm{d}\theta = -\frac{2}{3},$$
     et $\lVert f \rVert^{2} = \frac{\pi}{2}$. D'où $d^{2} = \frac{\pi}{2} - \frac{4}{\pi} - \frac{4/9}{\pi/2}$ : 
    $$\boxed{d = \sqrt{\frac{\pi}{2} - \frac{44}{9\pi}} \approx 0{,}121}$$
- id: "mp-10-36"
  feuille: "f-mp-10"
  numero: 36
  partie: "Polynômes orthogonaux"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [polynômes orthogonaux, endomorphismes hermitiens, produits scalaires intégraux]
  noeuds: [f-bases-hilbertiennes, f-autoadjoints, ri-integrable]
  notions: [operateur-autoadjoint, produit-scalaire]
  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 8 ; Espaces préhilbertiens et euclidiens (MP*), travaux dirigés 7, parties 1 à 3"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Un poids qui peut s'annuler.* Soit $w : [0, 1] \to \mathbb{R}_{+}$ continue et non identiquement nulle. On munit $\mathbb{R}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{0}^{1} w(t)P(t)Q(t)\,\mathrm{d} t$ (exercice 1 (c)).

    **1.** Montrer qu'il existe une famille orthonormée $(P_{n})_{n \in \mathbb{N}}$ telle que $\deg P_{n} = n$ pour tout $n$.

    **2.** Montrer que, si $(Q_{n})$ est une autre famille orthogonale de polynômes avec $\deg Q_{n} = n$, il existe des réels non nuls $\lambda_{n}$ tels que $Q_{n} = \lambda_{n}P_{n}$. En déduire que les racines de $P_{n}$ ne dépendent que du poids $w$.

    **3.** Montrer que, pour $n \geqslant 1$, $P_{n}$ a $n$ racines réelles simples dans $]0, 1[$. On adaptera la démonstration du théorème 5, en vérifiant que l'hypothèse $w > 0$ sur $]0, 1[$ n'y est pas indispensable.

    **4.** Pour $w(t) = t$, calculer les polynômes orthogonaux unitaires $P_{0}$, $P_{1}$, $P_{2}$, $P_{3}$, puis vérifier sur eux la relation de récurrence de la proposition 7, en calculant $\alpha_{1}$, $\beta_{1}$, $\alpha_{2}$, $\beta_{2}$.
  corrige: |
    **1.** Le produit est défini (exercice 1 (c)), et l'on applique le théorème 2 à la famille libre $(X^{n})_{n \in \mathbb{N}}$ : les $P_{n}$ obtenus vérifient $\mathrm{Vect}(P_{0}, \dots, P_{n}) = \mathbb{R}_{n}[X]$, donc $\deg P_{n} = n$.

    **2.** Les $Q_{k}$, pour $k < n$, engendrent $\mathbb{R}_{n - 1}[X]$, auquel $Q_{n}$ est donc orthogonal. Or, dans l'espace euclidien $\mathbb{R}_{n}[X]$, l'orthogonal de l'hyperplan $\mathbb{R}_{n - 1}[X]$ est une droite (théorème 3), qui contient $P_{n}$ : $Q_{n} = \lambda_{n}P_{n}$, avec $\lambda_{n} \neq 0$ puisque $\deg Q_{n} = n$. Les racines de $P_{n}$ sont donc celles de tout polynôme orthogonal de degré $n$, et ne dépendent que du produit scalaire, c'est-à-dire du poids $w$.

    **3.** Soit $x_{1} < \cdots < x_{k}$ les points de $]0, 1[$ où $P_{n}$ change de signe, et $Q = \prod (X - x_{i})$. Le polynôme $P_{n}Q$ garde un signe constant sur $[0, 1]$ et n'a qu'un nombre fini de zéros. Comme $w$ est continue, positive et non identiquement nulle, elle est strictement positive sur un intervalle non trivial, où $P_{n}Q$ ne s'annule qu'en un nombre fini de points : la fonction continue $wP_{n}Q$, de signe constant, n'est pas identiquement nulle, et $\langle P_{n}, Q \rangle \neq 0$. Si $k < n$, cela contredit $P_{n} \perp \mathbb{R}_{n - 1}[X]$ ; donc $k = n$. $\boxed{n \text{ racines réelles simples dans } ]0, 1[}$

    L'hypothèse $w > 0$ sur $]0, 1[$ du théorème 5 ne servait qu'à garantir $\langle P_{n}, Q \rangle \neq 0$ ; il suffit que $w$ soit positive et non identiquement nulle.

    **4.** Pour $w(t) = t$, on a $\langle X^{i}, X^{j} \rangle = \frac{1}{i + j + 2}$, et le procédé de Gram-Schmidt, sans normalisation, donne 
    $$\boxed{P_{0} = 1, \ \ P_{1} = X - \frac{2}{3}, \ \ P_{2} = X^{2} - \frac{6}{5}X + \frac{3}{10}, \ \ P_{3} = X^{3} - \frac{12}{7}X^{2} + \frac{6}{7}X - \frac{4}{35}}$$
     Les formules de la proposition 7 donnent 
    $$\alpha_{1} = \frac{8}{15}, \quad \beta_{1} = \frac{1}{18}, \quad \alpha_{2} = \frac{18}{35}, \quad \beta_{2} = \frac{3}{50},$$
     et l'on vérifie, par exemple, $(X - \frac{8}{15})(X - \frac{2}{3}) - \frac{1}{18} = X^{2} - \frac{6}{5}X + \frac{3}{10} = P_{2}$. Les racines de $P_{2}$, $\frac{6 \pm \sqrt{6}}{10} \approx 0{,}355$ et $0{,}845$, sont bien dans $]0, 1[$.
- id: "mp-10-37"
