  page_corrige: 23
  enonce: |
    *Perspective : la quadrature de Gauss.* On reprend les notations de la section 10.6 du cours : $w$ est un poids continu, strictement positif sur $]a, b[$, et $(P_{n})$ la suite des polynômes orthogonaux unitaires associés. Soit $n \geqslant 1$, et $r_{1} < \cdots < r_{n}$ les racines de $P_{n}$, qui sont dans $]a, b[$ par le théorème 5.

    **1.** Montrer qu'il existe des réels $\mu_{1}, \dots, \mu_{n}$ tels que 
    $$\int_{a}^{b} P(t)w(t)\,\mathrm{d} t = \sum_{j = 1}^{n} \mu_{j}P(r_{j}) \qquad \text{pour tout } P \in \mathbb{R}_{n - 1}[X].$$
     On pourra utiliser les polynômes interpolateurs de Lagrange associés aux points $r_{j}$.

    **2.** Montrer que cette égalité reste vraie pour tout $P \in \mathbb{R}_{2n - 1}[X]$, en effectuant la division euclidienne de $P$ par $P_{n}$.

    **3.** Montrer que les $\mu_{j}$ sont strictement positifs, et que leur somme vaut $\displaystyle \int_{a}^{b} w$. Montrer que l'égalité est fausse pour $P = P_{n}^{2}$.

    **4.** Pour $w = 1$ sur $[-1, 1]$ et $n = 2$, puis $n = 3$, déterminer les points $r_{j}$ et les coefficients $\mu_{j}$. En déduire des valeurs approchées de $\displaystyle \int_{-1}^{1} \mathrm{e}^{x}\,\mathrm{d} x$, et comparer à la valeur exacte.

    Avec seulement $n$ évaluations, cette méthode intègre exactement tous les polynômes de degré au plus $2n - 1$ : c'est le meilleur degré possible, et la raison de son usage universel en calcul numérique.
  corrige: |
    **1.** Les polynômes de Lagrange $\ell_{j}$, de degré $n - 1$ et tels que $\ell_{j}(r_{i}) = \delta_{ij}$, forment une base de $\mathbb{R}_{n - 1}[X]$, et $P = \sum_{j} P(r_{j})\ell_{j}$ pour $P \in \mathbb{R}_{n - 1}[X]$ (chapitre 13 de MPSI). On intègre : 
    $$\boxed{\mu_{j} = \int_{a}^{b} \ell_{j}(t)w(t)\,\mathrm{d} t}$$

    **2.** Pour $P \in \mathbb{R}_{2n - 1}[X]$, la division euclidienne $P = QP_{n} + R$ donne $\deg Q \leqslant n - 1$ et $\deg R \leqslant n - 1$. Alors $\int_{a}^{b} QP_{n}w = \langle Q, P_{n} \rangle = 0$ (proposition 6), et $P(r_{j}) = R(r_{j})$, d'où 
    $$\int_{a}^{b} Pw = \int_{a}^{b} Rw = \sum_{j = 1}^{n} \mu_{j}R(r_{j}) = \sum_{j = 1}^{n} \mu_{j}P(r_{j}).$$

    **3.** Avec $P = \ell_{j}^{2}$, de degré $2n - 2$ : $\mu_{j} = \sum_{i} \mu_{i}\ell_{j}(r_{i})^{2} = \int_{a}^{b} \ell_{j}^{2}w > 0$. Avec $P = 1$ : $\sum_{j} \mu_{j} = \int_{a}^{b} w$. Enfin, pour $P = P_{n}^{2}$, de degré $2n$, le membre de droite est nul, alors que $\int_{a}^{b} P_{n}^{2}w = \lVert P_{n} \rVert^{2} > 0$.

    **4.** Les polynômes de Legendre unitaires sont $X^{2} - \frac{1}{3}$ et $X^{3} - \frac{3}{5}X$. Par symétrie, $\mu_{1} = \mu_{n}$, et les conditions $\sum \mu_{j} = 2$ et exactitude pour $X^{2}$ déterminent les coefficients : 
    $$\boxed{n = 2 : \ r = \pm\frac{1}{\sqrt{3}}, \ \mu = 1, 1 ; \qquad n = 3 : \ r = -\sqrt{\tfrac{3}{5}}, \ 0, \ \sqrt{\tfrac{3}{5}}, \ \mu = \frac{5}{9}, \ \frac{8}{9}, \ \frac{5}{9}}$$
     Pour $\int_{-1}^{1} \mathrm{e}^{x}\,\mathrm{d} x = \mathrm{e} - \frac{1}{\mathrm{e}} \approx 2{,}350402$, on obtient 
    $$2\operatorname{ch}\frac{1}{\sqrt{3}} \approx 2{,}342696 \ (\text{erreur } 7{,}7 \cdot 10^{-3}), \qquad \frac{8}{9} + \frac{10}{9}\operatorname{ch}\sqrt{\tfrac{3}{5}} \approx 2{,}350337 \ (\text{erreur } 6{,}5 \cdot 10^{-5}).$$
     Trois évaluations suffisent pour quatre chiffres exacts ; la méthode des trapèzes, avec trois points, ferait une erreur de l'ordre de $10^{-1}$.
