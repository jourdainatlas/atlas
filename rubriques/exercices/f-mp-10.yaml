  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercices 7 et 22 ; Espaces préhilbertiens et euclidiens (MP*), exercice 7 (Mines)"
  page_enonce: 7
  page_corrige: 14
  enonce: |
    On munit $E = \mathcal{C}^{2}([0, 1], \mathbb{R})$ du produit scalaire $\displaystyle \langle f, g \rangle = \int_{0}^{1} \big(f(t)g(t) + f'(t)g'(t)\big)\,\mathrm{d} t$.

    **1.** Vérifier que l'on définit ainsi un produit scalaire.

    **2.** On pose $V = \{f \in E \mid f(0) = f(1) = 0\}$ et $W = \{f \in E \mid f'' = f\}$. Montrer que $V$ et $W$ sont orthogonaux, puis supplémentaires.

    **3.** Montrer que la projection orthogonale sur $W$ est donnée par 
    $$\pi(f)(t) = f(0)\frac{\operatorname{sh}(1 - t)}{\operatorname{sh} 1} + f(1)\frac{\operatorname{sh} t}{\operatorname{sh} 1}.$$

    **4.** Pour $\alpha$, $\beta$ réels, on pose $E_{\alpha, \beta} = \{f \in E \mid f(0) = \alpha, \ f(1) = \beta\}$. Calculer 
    $$\inf_{f \in E_{\alpha, \beta}} \int_{0}^{1} \big(f(t)^{2} + f'(t)^{2}\big)\,\mathrm{d} t,$$
     et dire pour quelle fonction cette borne inférieure est atteinte.
  corrige: |
    **1.** La forme est bilinéaire, symétrique, positive, et $\langle f, f \rangle \geqslant \int_{0}^{1} f^{2}$, qui n'est nul que si $f = 0$.

    **2.** *Orthogonalité.* Pour $f \in V$ et $g \in W$, une intégration par parties donne, puisque $f(0) = f(1) = 0$ et $g'' = g$, 
    $$\int_{0}^{1} f'g' = \big[fg'\big]_{0}^{1} - \int_{0}^{1} fg'' = -\int_{0}^{1} fg, \qquad\text{donc}\qquad \langle f, g \rangle = 0.$$
     *Supplémentarité.* On a $V \cap W = \{0\}$ par orthogonalité. Pour $f \in E$, la fonction $\pi(f)$ de la question 3 est dans $W$, puisque $\operatorname{sh}$ et $t \mapsto \operatorname{sh}(1 - t)$ vérifient $y'' = y$, et $f - \pi(f)$ est nulle en $0$ et en $1$, donc dans $V$.

    **3.** Par la question 2, $f = \pi(f) + (f - \pi(f))$ est la décomposition de $f$ selon $W \oplus V$, avec $V \perp W$ : $\pi$ est la projection orthogonale sur $W$, et $V = W^{\perp}$.

    **4.** L'ensemble $E_{\alpha, \beta}$ est $g + V$, où $g = \pi(f)$ ne dépend que de $\alpha = f(0)$ et $\beta = f(1)$. Pour $f \in E_{\alpha, \beta}$, Pythagore donne $\lVert f \rVert^{2} = \lVert g \rVert^{2} + \lVert f - g \rVert^{2} \geqslant \lVert g \rVert^{2}$, avec égalité si et seulement si $f = g$. On calcule $\lVert g \rVert^{2}$ par la même intégration par parties, avec $g'' = g$ : 
    $$\lVert g \rVert^{2} = \big[gg'\big]_{0}^{1} = \beta g'(1) - \alpha g'(0), \qquad g'(t) = \frac{-\alpha\operatorname{ch}(1 - t) + \beta\operatorname{ch} t}{\operatorname{sh} 1}.$$

    $$\boxed{\inf_{f \in E_{\alpha, \beta}} \int_{0}^{1} (f^{2} + f'^{2}) = \frac{(\alpha^{2} + \beta^{2})\operatorname{ch} 1 - 2\alpha\beta}{\operatorname{sh} 1}, \ \text{atteinte pour } f = \alpha\frac{\operatorname{sh}(1 - t)}{\operatorname{sh} 1} + \beta\frac{\operatorname{sh} t}{\operatorname{sh} 1}}$$
     *Remarque.* La fonction optimale vérifie $f'' = f$ : c'est l'équation d'Euler-Lagrange de ce problème de minimisation, que le calcul des variations retrouve sans produit scalaire.
- id: "mp-10-30"
  feuille: "f-mp-10"
  numero: 30
  partie: "Suites orthonormales et suites totales"
  etoiles: 1
  types: [Démonstration]
