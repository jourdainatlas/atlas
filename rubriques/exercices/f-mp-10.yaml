  source: "Feuille d'exercices espaces préhilbertiens (PLD), exercice 48"
  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Matrices antisymétriques réelles.* Soit $A \in \mathcal{M}_{n}(\mathbb{R})$ antisymétrique.

    **1.** Montrer que la matrice $\mathrm{i} A$ est hermitienne. En déduire que les valeurs propres complexes de $A$ sont imaginaires pures, et que $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{C})$.

    **2.** Montrer que $A^{2}$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{R})$, à valeurs propres négatives.

    **3.** Montrer que, si $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{R})$, alors $A = 0$.
  corrige: |
    **1.** Comme $A$ est réelle, $(\mathrm{i} A)^{*} = -\mathrm{i}\,{A}^{T} = \mathrm{i} A$. Par le théorème 6, $\mathrm{i} A = UDU^{*}$ avec $D$ réelle diagonale, donc $A = U(-\mathrm{i} D)U^{*}$ : $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{C})$, et ses valeurs propres $-\mathrm{i}\mu$, avec $\mu \in \mathbb{R}$, sont imaginaires pures.

    **2.** La matrice $A^{2} = -{A}^{T}A$ est symétrique réelle, donc diagonalisable dans $\mathcal{M}_{n}(\mathbb{R})$ (chapitre 7), et ses valeurs propres sont négatives, car 
    $${X}^{T}A^{2}X = -{X}^{T}{A}^{T}AX = -\lVert AX \rVert^{2} \leqslant 0.$$
     On le voit aussi sur la question 1 : les valeurs propres de $A^{2}$ sont les $(-\mathrm{i}\mu)^{2} = -\mu^{2}$.

    **3.** Si $A$ est diagonalisable dans $\mathcal{M}_{n}(\mathbb{R})$, ses valeurs propres sont réelles et imaginaires pures, donc nulles : $A$ est semblable à la matrice nulle. $\boxed{A = 0}$
- id: "mp-10-44"
  feuille: "f-mp-10"
  numero: 44
  partie: "Endomorphismes des espaces hermitiens"
  etoiles: 2
