  enonce: |
    *Projection sur un convexe fermé.* Soit $E$ un espace euclidien et $C$ une partie convexe, fermée et non vide de $E$.

    **1.** Établir l'*égalité de la médiane* : si $u$, $v$, $w \in E$ et $m = \frac{v + w}{2}$, alors 
    $$\lVert v - u \rVert^{2} + \lVert w - u \rVert^{2} = 2\lVert u - m \rVert^{2} + \frac{1}{2}\lVert v - w \rVert^{2}.$$

    **2.** Soit $x \in E$. Montrer qu'il existe un unique $h \in C$ tel que $\lVert x - h \rVert = d(x, C)$. On le note $p_{C}(x)$.

    **3.** Soit $a \in E$. Montrer que $\langle p_{C}(a) - a, p_{C}(a) - x \rangle \leqslant 0$ pour tout $x \in C$, et que cette propriété caractérise $p_{C}(a)$ parmi les points de $C$.

    **4.** Montrer que $p_{C}$ est $1$-lipschitzienne. Que devient $p_{C}$ lorsque $C$ est un sous-espace vectoriel ?

    **5.** Soit $a \notin C$. Montrer l'existence d'un demi-espace affine fermé qui contient $C$ mais pas $a$.
  corrige: |
    **1.** On développe avec $v - u = (v - m) + (m - u)$ et $w - u = (w - m) + (m - u)$, où $w - m = -(v - m)$ : 
    $$\lVert v - u \rVert^{2} + \lVert w - u \rVert^{2} = 2\lVert m - u \rVert^{2} + 2\lVert v - m \rVert^{2} = 2\lVert u - m \rVert^{2} + \frac{1}{2}\lVert v - w \rVert^{2},$$
     les doubles produits se compensant.

    **2.** *Existence.* Soit $d = d(x, C)$ et $c_{0} \in C$. La partie $K = C \cap B_{f}(x, \lVert x - c_{0} \rVert)$ est fermée, bornée et non vide dans l'espace de dimension finie $E$, donc compacte (chapitre 5), et la fonction continue $y \mapsto \lVert x - y \rVert$ y atteint son minimum, qui vaut $d$, les points de $C \setminus K$ étant plus loin que $c_{0}$.

    *Unicité.* Si $h_{1}$ et $h_{2}$ réalisent la distance, leur milieu $m$ est dans $C$, convexe, et la question 1 avec $u = x$ donne 
    $$2d^{2} = 2\lVert x - m \rVert^{2} + \frac{1}{2}\lVert h_{1} - h_{2} \rVert^{2} \geqslant 2d^{2} + \frac{1}{2}\lVert h_{1} - h_{2} \rVert^{2},$$
     d'où $h_{1} = h_{2}$.

    **3.** Soit $h = p_{C}(a)$ et $x \in C$. Pour $t \in ]0, 1]$, $h + t(x - h) \in C$, donc 
    $$\lVert a - h \rVert^{2} \leqslant \lVert a - h - t(x - h) \rVert^{2} = \lVert a - h \rVert^{2} - 2t\langle a - h, x - h \rangle + t^{2}\lVert x - h \rVert^{2}.$$
     On divise par $t$ et l'on fait tendre $t$ vers $0$ : $\langle a - h, x - h \rangle \leqslant 0$, ce qui est l'inégalité demandée. Réciproquement, si $h \in C$ vérifie cette inégalité pour tout $x \in C$, alors 
    $$\lVert a - x \rVert^{2} = \lVert a - h \rVert^{2} + \lVert h - x \rVert^{2} - 2\langle a - h, x - h \rangle \geqslant \lVert a - h \rVert^{2},$$
     et $h$ réalise la distance. $\boxed{h = p_{C}(a) \iff h \in C \text{ et } \forall x \in C, \ \langle h - a, h - x \rangle \leqslant 0}$

    **4.** Soit $h_{1} = p_{C}(a)$ et $h_{2} = p_{C}(b)$. La question 3, appliquée en $a$ avec $x = h_{2}$ et en $b$ avec $x = h_{1}$, donne $\langle h_{1} - a, h_{1} - h_{2} \rangle \leqslant 0$ et $\langle h_{2} - b, h_{2} - h_{1} \rangle \leqslant 0$. On ajoute : 
    $$\lVert h_{1} - h_{2} \rVert^{2} \leqslant \langle a - b, h_{1} - h_{2} \rangle \leqslant \lVert a - b \rVert\,\lVert h_{1} - h_{2} \rVert,$$
     d'où $\lVert p_{C}(a) - p_{C}(b) \rVert \leqslant \lVert a - b \rVert$. Si $C$ est un sous-espace, la question 3 avec $x = h \pm z$, $z \in C$, donne $\langle h - a, z \rangle = 0$ : $a - h \in C^{\perp}$, et $p_{C}$ est la projection orthogonale du théorème 3.

    **5.** Soit $h = p_{C}(a) \neq a$, et $n = a - h$. Le demi-espace fermé $D = \{y \in E \mid \langle n, y - h \rangle \leqslant 0\}$ contient $C$ par la question 3, et ne contient pas $a$, puisque $\langle n, a - h \rangle = \lVert n \rVert^{2} > 0$. 
    $$\boxed{C \subset \{y \mid \langle a - h, y - h \rangle \leqslant 0\}, \quad a \notin \{y \mid \langle a - h, y - h \rangle \leqslant 0\}}$$
     C'est le théorème de séparation d'un point et d'un convexe fermé, point de départ de l'optimisation convexe ; l'hyperplan séparateur passe par $p_{C}(a)$ et est orthogonal à $a - p_{C}(a)$.

