- id: t-01-01
  feuille: f-t-01
  numero: 1
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, suite explicite, puissance]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit la suite $(u_n)$ définie sur $\mathbb N$ par :
    $$\begin{cases} u_0 = 14 \\ u_{n+1} = 2u_n - 5 \end{cases}$$

    Montrer par récurrence que : $\forall n \in \mathbb N, \quad u_n = 9 \times 2^n + 5$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n = 9 \times 2^n + 5 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $9 \times 2^0 + 5 = 9 + 5 = 14 = u_0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $P_k$ est vraie, autrement dit que $u_k = 9 \times 2^k + 5$. Alors :
    $$\begin{aligned} u_{k+1} &= 2u_k - 5 \\ &= 2\left(9 \times 2^k + 5\right) - 5 \qquad \text{d'après } P_k \\ &= 9 \times 2^{k+1} + 10 - 5 \\ &= 9 \times 2^{k+1} + 5 \end{aligned}$$
    ce qui prouve $P_{k+1}$. La propriété est donc héréditaire.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ u_n = 9 \times 2^n + 5}$$

- id: t-01-02
  feuille: f-t-01
  numero: 2
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, encadrement, suite bornée, majoration, minoration]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $u$ la suite définie par $u_0 = 10$ et pour tout $n \in \mathbb N$, $u_{n+1} = \sqrt{u_n + 5}$.
    Montrer à l'aide d'un raisonnement par récurrence que pour tout $n \in \mathbb N$, $2 \leqslant u_n \leqslant 10$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 2 \leqslant u_n \leqslant 10 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_0 = 10$ et $2 \leqslant 10 \leqslant 10$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $2 \leqslant u_k \leqslant 10$. En ajoutant 5 à chaque membre, puis en appliquant la fonction racine carrée, croissante sur $[0\,;+\infty[$ :
    $$2 \leqslant u_k \leqslant 10 \implies 7 \leqslant u_k + 5 \leqslant 15 \implies \sqrt 7 \leqslant u_{k+1} \leqslant \sqrt{15}$$
    Or $\sqrt 7 \geqslant \sqrt 4 = 2$ et $\sqrt{15} \leqslant \sqrt{100} = 10$, donc $2 \leqslant u_{k+1} \leqslant 10$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ 2 \leqslant u_n \leqslant 10}$$

- id: t-01-03
  feuille: f-t-01
  numero: 3
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, encadrement, suite bornée, majoration, minoration]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $u$ la suite définie par $u_0 = 2$ et pour tout $n \in \mathbb N$, $u_{n+1} = \sqrt{u_n + 15}$.
    Montrer à l'aide d'un raisonnement par récurrence que pour tout $n \in \mathbb N$, $0 \leqslant u_n \leqslant 5$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 0 \leqslant u_n \leqslant 5 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_0 = 2$ et $0 \leqslant 2 \leqslant 5$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 \leqslant u_k \leqslant 5$. Alors, la fonction racine carrée étant croissante :
    $$0 \leqslant u_k \leqslant 5 \implies 15 \leqslant u_k + 15 \leqslant 20 \implies \sqrt{15} \leqslant u_{k+1} \leqslant \sqrt{20}$$
    Or $\sqrt{15} \geqslant 0$ et $\sqrt{20} \leqslant \sqrt{25} = 5$, donc $0 \leqslant u_{k+1} \leqslant 5$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ 0 \leqslant u_n \leqslant 5}$$

- id: t-01-04
  feuille: f-t-01
  numero: 4
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, minoration, inégalité]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $u$ la suite définie par $u_0 = \frac 12$ et pour tout $n \in \mathbb N$, $u_{n+1} = \frac{3u_n}{1 + 2u_n}$.
    Montrer à l'aide d'un raisonnement par récurrence que pour tout $n \in \mathbb N$, $0 < u_n$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n > 0 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_0 = \frac 12 > 0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k > 0$. Alors $3u_k > 0$ et $1 + 2u_k > 1 > 0$ : le quotient $u_{k+1} = \frac{3u_k}{1 + 2u_k}$ est bien défini, et c'est un quotient de deux nombres strictement positifs, donc $u_{k+1} > 0$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ u_n > 0}$$

- id: t-01-05
  feuille: f-t-01
  numero: 5
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Calcul, Conjecture, Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, conjecture, suite explicite]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    La suite $(u_n)$ est définie par : $u_1 = 0$ et $u_{n+1} = \frac{1}{2 - u_n}$

    **1.** Calculer $u_2, u_3, u_4$.

    **2.** Que peut-on faire comme conjecture sur l'expression de $u_n$ en fonction de $n$ ?

    **3.** Démontrer cette conjecture par récurrence et donner la valeur exacte de $u_{2021}$.
  corrige: |
    **1.** On applique la relation de récurrence :
    $$u_2 = \frac{1}{2 - u_1} = \frac{1}{2 - 0} = \frac 12 \qquad ; \qquad u_3 = \frac{1}{2 - \frac 12} = \frac{1}{\frac 32} = \frac 23 \qquad ; \qquad u_4 = \frac{1}{2 - \frac 23} = \frac{1}{\frac 43} = \frac 34$$
    $$\boxed{u_2 = \frac 12\ ;\ u_3 = \frac 23\ ;\ u_4 = \frac 34}$$

    **2.** En écrivant $u_1 = \frac 01$, on constate que le numérateur et le dénominateur augmentent tous deux de 1 à chaque rang, ce qui conduit à conjecturer :
    $$\boxed{\forall n \geqslant 1,\ u_n = \frac{n - 1}{n}}$$

    **3.** Démontrons par récurrence la propriété suivante :
    $$\forall n \geqslant 1, \quad P_n : \text{« } u_n = \frac{n - 1}{n} \text{ »}$$

    **Initialisation :** Pour $n = 1$ : $\frac{1 - 1}{1} = 0 = u_1$. Donc $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons que $u_k = \frac{k - 1}{k}$. Alors :
    $$\begin{aligned} u_{k+1} &= \frac{1}{2 - u_k} = \frac{1}{2 - \frac{k - 1}{k}} \\ &= \frac{1}{\frac{2k - (k - 1)}{k}} = \frac{k}{k + 1} \\ &= \frac{(k + 1) - 1}{k + 1} \end{aligned}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence, $u_n = \frac{n - 1}{n}$ pour tout $n \geqslant 1$, et en particulier :
    $$\boxed{u_{2021} = \frac{2020}{2021}}$$

- id: t-01-06
  feuille: f-t-01
  numero: 6
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, minoration, inégalité]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $(u_n)$ la suite définie par $u_0 = 0$ et pour tout $n \in \mathbb N$, $u_{n+1} = 3u_n - 2n + 3$.
    Démontrer que, pour tout entier naturel $n$, $u_n \geqslant n$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n \geqslant n \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_0 = 0 \geqslant 0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k \geqslant k$. En multipliant cette inégalité par $3 > 0$, puis en ajoutant $-2k + 3$ :
    $$\begin{aligned} u_{k+1} = 3u_k - 2k + 3 &\geqslant 3k - 2k + 3 \\ &\geqslant k + 3 \\ &\geqslant k + 1 \end{aligned}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ u_n \geqslant n}$$

- id: t-01-07
  feuille: f-t-01
  numero: 7
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, encadrement, suite bornée, majoration, minoration]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $(v_n)$ la suite définie par $v_0 = 0$ et pour tout $n \in \mathbb N$, $v_{n+1} = \frac{9}{6 - v_n}$.
    Démontrer que, pour tout entier naturel $n$, $0 \leqslant v_n < 3$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 0 \leqslant v_n < 3 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $v_0 = 0$ et $0 \leqslant 0 < 3$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 \leqslant v_k < 3$. Alors :
    $$0 \leqslant v_k < 3 \implies -3 < -v_k \leqslant 0 \implies 3 < 6 - v_k \leqslant 6$$
    La fonction inverse étant décroissante sur $]0\,;+\infty[$, on obtient :
    $$\frac 16 \leqslant \frac{1}{6 - v_k} < \frac 13 \implies \frac 96 \leqslant v_{k+1} < 3$$
    Comme $\frac 96 \geqslant 0$, on a bien $0 \leqslant v_{k+1} < 3$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ 0 \leqslant v_n < 3}$$

- id: t-01-08
  feuille: f-t-01
  numero: 8
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, suite explicite]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit $u$ la suite définie par $u_0 = 1$ et pour tout $n \in \mathbb N$, $u_{n+1} = u_n + 2n + 3$.
    Montrer que pour tout $n \in \mathbb N$, $u_n = (n + 1)^2$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n = (n + 1)^2 \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $(0 + 1)^2 = 1 = u_0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k = (k + 1)^2$. Alors :
    $$\begin{aligned} u_{k+1} &= u_k + 2k + 3 \\ &= (k + 1)^2 + 2k + 3 \qquad \text{d'après } P_k \\ &= k^2 + 2k + 1 + 2k + 3 \\ &= k^2 + 4k + 4 = (k + 2)^2 \end{aligned}$$
    ce qui prouve $P_{k+1}$, puisque $k + 2 = (k + 1) + 1$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ u_n = (n + 1)^2}$$

- id: t-01-09
  feuille: f-t-01
  numero: 9
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Calcul, Démonstration]
  mots_cles: [récurrence, somme, suite explicite, suite définie par récurrence]
  noeuds: [n-recurrence, n-sommes]
  notions: [suite]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Soit la suite $(u_n)$ définie pour $n \geqslant 1$ par : $u_n = 1 \times 2 + 2 \times 3 + 3 \times 4 + \cdots + n(n + 1)$.

    **1.** Déterminer $u_1, u_2, u_3$ puis déterminer une relation entre $u_{n+1}$ et $u_n$.

    **2.** Montrer par récurrence que : $\forall n \in \mathbb N^*, \quad u_n = \frac{n(n + 1)(n + 2)}{3}$.
  corrige: |
    **1.** On calcule les premiers termes :
    $$u_1 = 1 \times 2 = 2 \qquad ; \qquad u_2 = 2 + 2 \times 3 = 8 \qquad ; \qquad u_3 = 8 + 3 \times 4 = 20$$
    De plus, $u_{n+1}$ est obtenu en ajoutant à $u_n$ le terme suivant de la somme :
    $$\boxed{u_1 = 2\ ;\ u_2 = 8\ ;\ u_3 = 20 \qquad \text{et} \qquad u_{n+1} = u_n + (n + 1)(n + 2)}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N^*, \quad P_n : \text{« } u_n = \frac{n(n + 1)(n + 2)}{3} \text{ »}$$

    **Initialisation :** Pour $n = 1$ : $\frac{1 \times 2 \times 3}{3} = 2 = u_1$. Donc $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons que $u_k = \frac{k(k + 1)(k + 2)}{3}$. Alors, d'après la relation établie à la question 1. :
    $$\begin{aligned} u_{k+1} &= u_k + (k + 1)(k + 2) \\ &= \frac{k(k + 1)(k + 2)}{3} + (k + 1)(k + 2) \\ &= (k + 1)(k + 2)\left(\frac k3 + 1\right) \\ &= \frac{(k + 1)(k + 2)(k + 3)}{3} \end{aligned}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N^*,\ u_n = \frac{n(n + 1)(n + 2)}{3}}$$
- id: t-01-10
  feuille: f-t-01
  numero: 10
  titre: Somme des carrés
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Calcul, Démonstration]
  mots_cles: [récurrence, somme, somme des carrés, suite définie par récurrence]
  noeuds: [n-recurrence, n-sommes]
  notions: [suite]
  page_enonce: 1
  page_corrige: 4
  enonce: |
    On pose pour $n \geqslant 1$, $S_n = 1^2 + 2^2 + 3^2 + \cdots + n^2$.

    **1.** Calculer $S_1, S_2, S_3$ et $S_4$. Exprimer $S_{n+1}$ en fonction de $S_n$.

    **2.** Démontrer par récurrence que : $\forall n \geqslant 1, \quad S_n = \dfrac{n(n+1)(2n+1)}{6}$.
  corrige: |
    **1.** On calcule les premières sommes :
    $$S_1 = 1 \;;\; S_2 = 1 + 4 = 5 \;;\; S_3 = 5 + 9 = 14 \;;\; S_4 = 14 + 16 = 30$$
    $$\boxed{S_1 = 1 \;;\; S_2 = 5 \;;\; S_3 = 14 \;;\; S_4 = 30 \qquad \text{et} \qquad S_{n+1} = S_n + (n+1)^2}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \geqslant 1, \quad P_n : « \, S_n = \frac{n(n+1)(2n+1)}{6} \, »$$

    **Initialisation :** Pour $n = 1$ : $\dfrac{1 \times 2 \times 3}{6} = 1 = S_1$. Donc $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons que $S_k = \dfrac{k(k+1)(2k+1)}{6}$. Alors :
    $$\begin{aligned} S_{k+1} &= S_k + (k+1)^2 \\ &= \frac{k(k+1)(2k+1)}{6} + (k+1)^2 \\ &= \frac{(k+1)\big[k(2k+1) + 6(k+1)\big]}{6} \\ &= \frac{(k+1)\left(2k^2 + 7k + 6\right)}{6} \\ &= \frac{(k+1)(k+2)(2k+3)}{6} \end{aligned}$$
    la dernière égalité s'obtenant en factorisant $2k^2 + 7k + 6 = (k+2)(2k+3)$. Comme $2k + 3 = 2(k+1) + 1$, ceci prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \geqslant 1, \ S_n = \frac{n(n+1)(2n+1)}{6}}$$
- id: t-01-11
  feuille: f-t-01
  numero: 11
  titre: Somme des cubes
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Calcul, Démonstration]
  mots_cles: [récurrence, somme, somme des cubes, somme des entiers, suite définie par récurrence]
  noeuds: [n-recurrence, n-sommes]
  notions: [suite]
  page_enonce: 1
  page_corrige: 5
  enonce: |
    On pose pour $n \geqslant 1$, $S_n = 1^3 + 2^3 + 3^3 + \cdots + n^3$.

    **1.** Calculer $S_1, S_2, S_3$ et $S_4$. Exprimer $S_{n+1}$ en fonction de $S_n$.

    **2.** Démontrer par récurrence que : $\forall n \geqslant 1, \quad S_n = \dfrac{n^2(n+1)^2}{4}$.
  corrige: |
    **1.** On calcule les premières sommes :
    $$S_1 = 1 \;;\; S_2 = 1 + 8 = 9 \;;\; S_3 = 9 + 27 = 36 \;;\; S_4 = 36 + 64 = 100$$
    $$\boxed{S_1 = 1 \;;\; S_2 = 9 \;;\; S_3 = 36 \;;\; S_4 = 100 \qquad \text{et} \qquad S_{n+1} = S_n + (n+1)^3}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \geqslant 1, \quad P_n : « \, S_n = \frac{n^2(n+1)^2}{4} \, »$$

    **Initialisation :** Pour $n = 1$ : $\dfrac{1 \times 4}{4} = 1 = S_1$. Donc $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons que $S_k = \dfrac{k^2(k+1)^2}{4}$. Alors :
    $$\begin{aligned} S_{k+1} &= S_k + (k+1)^3 \\ &= \frac{k^2(k+1)^2}{4} + (k+1)^3 \\ &= \frac{(k+1)^2\big[k^2 + 4(k+1)\big]}{4} \\ &= \frac{(k+1)^2\left(k^2 + 4k + 4\right)}{4} = \frac{(k+1)^2(k+2)^2}{4} \end{aligned}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \geqslant 1, \ S_n = \frac{n^2(n+1)^2}{4}}$$

    On remarque au passage que $S_n = \left(\dfrac{n(n+1)}{2}\right)^2$ : la somme des cubes est le carré de la somme des entiers.
- id: t-01-12
  feuille: f-t-01
  numero: 12
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, fonction associée, dérivée, encadrement, sens de variation, suite bornée]
  noeuds: [n-recurrence, ar-deriv]
  notions: [suite, derivable]
  page_enonce: 2
  page_corrige: 5
  enonce: |
    La suite $(u_n)$ est la suite définie sur $\mathbb N$ par :
    $$\begin{cases} u_0 \in \left]0\,;1\right[ \\ u_{n+1} = u_n(2 - u_n) \end{cases}$$

    **1.** Montrer que la fonction $f$ définie par $f(x) = x(2 - x)$ est croissante sur $[0\,;1]$.

    **2.** Démontrer par récurrence que : $\forall n \in \mathbb N, \quad 0 < u_n < 1$

    **3.** En déduire que la suite $(u_n)$ est croissante.
  corrige: |
    **1.** La fonction $f$ est une fonction polynôme du second degré, dérivable sur $\mathbb R$, et pour tout $x$ :
    $$f(x) = 2x - x^2 \qquad \text{donc} \qquad f'(x) = 2 - 2x = 2(1 - x)$$
    Or pour tout $x \in [0\,;1]$, on a $1 - x \geqslant 0$, donc $f'(x) \geqslant 0$ :
    $$\boxed{f \text{ est croissante sur } [0\,;1]}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : « \, 0 < u_n < 1 \, »$$

    **Initialisation :** Pour $n = 0$ : par hypothèse $u_0 \in \left]0\,;1\right[$, donc $0 < u_0 < 1$ et $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 < u_k < 1$. La fonction $f$ étant croissante sur $[0\,;1]$ d'après la question 1., on peut l'appliquer à chaque membre de l'encadrement :
    $$0 < u_k < 1 \implies f(0) < f(u_k) < f(1) \implies 0 < u_{k+1} < 1$$
    puisque $f(0) = 0$ et $f(1) = 1 \times 1 = 1$. Ceci prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N, \ 0 < u_n < 1}$$

    **3.** Pour tout $n \in \mathbb N$ :
    $$u_{n+1} - u_n = u_n(2 - u_n) - u_n = u_n\,(2 - u_n - 1) = u_n(1 - u_n)$$
    Or d'après la question 2., $u_n > 0$ et $1 - u_n > 0$, donc ce produit est strictement positif :
    $$\boxed{(u_n) \text{ est croissante}}$$
- id: t-01-13
  feuille: f-t-01
  numero: 13
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Démonstration]
  mots_cles: [récurrence, suite définie par récurrence, fonction associée, dérivée, minoration, sens de variation]
  noeuds: [n-recurrence, ar-deriv]
  notions: [suite, derivable]
  page_enonce: 2
  page_corrige: 6
  enonce: |
    On considère la suite $(u_n)$ définie par $u_0 = 3$ et pour tout entier naturel $n$, $u_{n+1} = \dfrac{4u_n - 2}{u_n + 1}$.

    **1.** Étudier les variations de la fonction $f$ définie sur $\left]-1\,;+\infty\right[$ par $f(x) = \dfrac{4x - 2}{x + 1}$.

    **2.** Démontrer par récurrence que, pour tout entier naturel $n$, $u_n > 2$.

    **3.** Démontrer par récurrence que la suite $(u_n)$ est décroissante.
  corrige: |
    **1.** La fonction $f$ est dérivable sur $\left]-1\,;+\infty\right[$ comme quotient de fonctions dérivables dont le dénominateur ne s'annule pas, et pour tout $x > -1$ :
    $$f'(x) = \frac{4(x+1) - (4x - 2) \times 1}{(x+1)^2} = \frac{4x + 4 - 4x + 2}{(x+1)^2} = \frac{6}{(x+1)^2}$$
    Ce quotient est strictement positif, donc :
    $$\boxed{f \text{ est croissante sur } \left]-1\,;+\infty\right[}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : « \, u_n > 2 \, »$$

    **Initialisation :** Pour $n = 0$ : $u_0 = 3 > 2$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k > 2$. Comme $2 > -1$, on peut appliquer la fonction $f$, croissante sur $\left]-1\,;+\infty\right[$ :
    $$u_k > 2 \implies f(u_k) > f(2) \implies u_{k+1} > \frac{4 \times 2 - 2}{2 + 1} = 2$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N, \ u_n > 2}$$

    **3.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad Q_n : « \, u_{n+1} \leqslant u_n \, »$$

    **Initialisation :** Pour $n = 0$ : $u_1 = \dfrac{4 \times 3 - 2}{3 + 1} = \dfrac{10}{4} = 2{,}5 \leqslant 3 = u_0$. Donc $Q_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_{k+1} \leqslant u_k$. Ces deux termes appartenant à $\left]-1\,;+\infty\right[$ d'après la question 2., on applique la fonction $f$, croissante :
    $$u_{k+1} \leqslant u_k \implies f(u_{k+1}) \leqslant f(u_k) \implies u_{k+2} \leqslant u_{k+1}$$
    ce qui prouve $Q_{k+1}$.

    **Conclusion :** Par principe de récurrence, $u_{n+1} \leqslant u_n$ pour tout $n$ :
    $$\boxed{(u_n) \text{ est décroissante}}$$
- id: t-01-14
  feuille: f-t-01
  numero: 14
  partie: Raisonnement par récurrence
  etoiles: 1
  types: [Démonstration]
  mots_cles: [récurrence, divisibilité, puissance]
  noeuds: [n-recurrence]
  notions: []
  page_enonce: 2
  page_corrige: 6
  enonce: |
    Démontrer par récurrence que :

    **1.** $\forall n \in \mathbb N, \quad 4^n + 5$ est un multiple de 3.

    **2.** $\forall n \in \mathbb N, \quad 3^{2n} - 1$ est un multiple de 8.

    **3.** $\forall n \in \mathbb N, \quad 3^{2n+1} + 2^{n+2}$ est un multiple de 7.

    **4.** $\forall n \geqslant 1, \quad n^3 + 2n$ est un multiple de 3.
  corrige: |
    **1.** Démontrons par récurrence la propriété : $\forall n \in \mathbb N, \ P_n : « \, 3 \text{ divise } 4^n + 5 \, »$.

    **Initialisation :** Pour $n = 0$ : $4^0 + 5 = 6 = 3 \times 2$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons qu'il existe $m \in \mathbb Z$ tel que $4^k + 5 = 3m$, autrement dit $4^k = 3m - 5$. Alors :
    $$\begin{aligned} 4^{k+1} + 5 &= 4 \times 4^k + 5 \\ &= 4(3m - 5) + 5 \\ &= 12m - 15 = 3(4m - 5) \end{aligned}$$
    et $4m - 5$ est un entier, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N, \ 4^n + 5 \text{ est un multiple de } 3}$

    **2.** Démontrons par récurrence la propriété : $\forall n \in \mathbb N, \ P_n : « \, 8 \text{ divise } 3^{2n} - 1 \, »$.

    **Initialisation :** Pour $n = 0$ : $3^0 - 1 = 0 = 8 \times 0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons qu'il existe $m \in \mathbb Z$ tel que $3^{2k} - 1 = 8m$, autrement dit $3^{2k} = 8m + 1$. Alors :
    $$\begin{aligned} 3^{2(k+1)} - 1 = 3^{2k+2} - 1 &= 9 \times 3^{2k} - 1 \\ &= 9(8m + 1) - 1 \\ &= 72m + 8 = 8(9m + 1) \end{aligned}$$
    et $9m + 1$ est un entier, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N, \ 3^{2n} - 1 \text{ est un multiple de } 8}$

    **3.** Démontrons par récurrence la propriété : $\forall n \in \mathbb N, \ P_n : « \, 7 \text{ divise } 3^{2n+1} + 2^{n+2} \, »$.

    **Initialisation :** Pour $n = 0$ : $3^1 + 2^2 = 3 + 4 = 7 = 7 \times 1$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons qu'il existe $m \in \mathbb Z$ tel que $3^{2k+1} + 2^{k+2} = 7m$, autrement dit $3^{2k+1} = 7m - 2^{k+2}$. Alors :
    $$\begin{aligned} 3^{2(k+1)+1} + 2^{(k+1)+2} &= 9 \times 3^{2k+1} + 2 \times 2^{k+2} \\ &= 9\left(7m - 2^{k+2}\right) + 2 \times 2^{k+2} \\ &= 63m - 7 \times 2^{k+2} \\ &= 7\left(9m - 2^{k+2}\right) \end{aligned}$$
    et $9m - 2^{k+2}$ est un entier, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N, \ 3^{2n+1} + 2^{n+2} \text{ est un multiple de } 7}$

    **4.** Démontrons par récurrence la propriété : $\forall n \geqslant 1, \ P_n : « \, 3 \text{ divise } n^3 + 2n \, »$.

    **Initialisation :** Pour $n = 1$ : $1 + 2 = 3 = 3 \times 1$. Donc $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons qu'il existe $m \in \mathbb Z$ tel que $k^3 + 2k = 3m$. Alors :
    $$\begin{aligned} (k+1)^3 + 2(k+1) &= k^3 + 3k^2 + 3k + 1 + 2k + 2 \\ &= \left(k^3 + 2k\right) + 3k^2 + 3k + 3 \\ &= 3m + 3\left(k^2 + k + 1\right) \\ &= 3\left(m + k^2 + k + 1\right) \end{aligned}$$
    et $m + k^2 + k + 1$ est un entier, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \geqslant 1, \ n^3 + 2n \text{ est un multiple de } 3}$
- id: t-01-15
  feuille: f-t-01
  numero: 15
  titre: Type Bac
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Calcul, Démonstration, Conjecture, Type Bac]
  mots_cles: [suite définie par récurrence, conjecture, récurrence, majoration, sens de variation, suite auxiliaire, suite géométrique]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 2
  page_corrige: 7
  enonce: |
    Soit la suite $(u_n)$ définie par $u_0 = 2$ et
    $$\forall n \in \mathbb N, \quad u_{n+1} = \frac 23 u_n + \frac 13 n + 1.$$

    **1.** Calculer les 5 premiers termes de la suite. Quelle conjecture peut-on faire sur le sens de variation ?

    **2.** **(a)** Montrer que pour tout entier $n$ on a $u_n \leqslant n + 3$.

    **(b)** Montrer que pour tout entier $n$ on a
    $$u_{n+1} - u_n = \frac 13 (n + 3 - u_n)$$
    et en déduire le sens de variation de $(u_n)$.

    **3.** Montrer que la suite $(v_n)$ définie pour tout $n$ par $v_n = u_n - n$ est géométrique de raison $\dfrac 23$. En déduire l'expression de $u_n$ en fonction de $n$.
  corrige: |
    **1.** On applique la relation de récurrence :
    $$u_0 = 2 \;;\; u_1 = \frac 73 \approx 2{,}33 \;;\; u_2 = \frac{26}{9} \approx 2{,}89 \;;\; u_3 = \frac{97}{27} \approx 3{,}59 \;;\; u_4 = \frac{356}{81} \approx 4{,}40$$
    $$\boxed{\text{On conjecture que la suite } (u_n) \text{ est croissante}}$$

    **2.** **(a)** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : « \, u_n \leqslant n + 3 \, »$$

    **Initialisation :** Pour $n = 0$ : $u_0 = 2 \leqslant 3$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k \leqslant k + 3$. En multipliant par $\dfrac 23 > 0$ puis en ajoutant $\dfrac 13 k + 1$ :
    $$\begin{aligned} u_{k+1} = \frac 23 u_k + \frac 13 k + 1 &\leqslant \frac 23 (k + 3) + \frac 13 k + 1 \\ &\leqslant \frac 23 k + 2 + \frac 13 k + 1 \\ &\leqslant k + 3 \leqslant (k+1) + 3 \end{aligned}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N, \ u_n \leqslant n + 3}$$

    **(b)** Pour tout $n \in \mathbb N$ :
    $$\begin{aligned} u_{n+1} - u_n &= \frac 23 u_n + \frac 13 n + 1 - u_n \\ &= -\frac 13 u_n + \frac 13 n + 1 \\ &= \frac 13 (n + 3 - u_n) \end{aligned}$$
    Or d'après la question précédente $u_n \leqslant n + 3$, donc $n + 3 - u_n \geqslant 0$ et ainsi $u_{n+1} - u_n \geqslant 0$ :
    $$\boxed{(u_n) \text{ est croissante}}$$

    **3.** Pour tout $n \in \mathbb N$ :
    $$\begin{aligned} v_{n+1} &= u_{n+1} - (n+1) \\ &= \frac 23 u_n + \frac 13 n + 1 - n - 1 \\ &= \frac 23 u_n - \frac 23 n \\ &= \frac 23 (u_n - n) = \frac 23 v_n \end{aligned}$$
    La suite $(v_n)$ est donc géométrique de raison $\dfrac 23$, de premier terme $v_0 = u_0 - 0 = 2$. On en déduit que $v_n = 2\left(\dfrac 23\right)^n$, puis que $u_n = v_n + n$ :
    $$\boxed{\forall n \in \mathbb N, \ u_n = 2\left(\frac 23\right)^n + n}$$
- id: t-01-16
  feuille: f-t-01
  numero: 16
  titre: Python
  partie: Raisonnement par récurrence
  etoiles: 2
  types: [Calcul, Algorithmique, Conjecture, Démonstration]
  mots_cles: [suite définie par récurrence, python, algorithme, tableau de valeurs, conjecture, récurrence, suite explicite, suite arithmétique]
  noeuds: [n-recurrence]
  notions: [suite]
  page_enonce: 2
  page_corrige: 8
  enonce: |
    On considère la suite $(u_n)$ définie par :
    $$\begin{cases} u_0 = 5 \\ u_{n+1} = \left(1 + \dfrac{2}{n+1}\right) u_n + \dfrac{6}{n+1} \end{cases}$$

    **1.** **(a)** Calculer $u_1$ ; $u_2$ et $u_3$

    **(b)** Soit la suite $(d_n)$ définie par : $d_n = u_{n+1} - u_n$.
    Écrire une fonction p(n) en Python donnant tous les termes :

    • de 1 à $n$ pour $(u_n)$

    • de 0 à $(n - 1)$ pour $(d_n)$

    **(c)** Remplir le tableau suivant :
    $$\begin{array}{|c|c|c|c|c|c|c|c|} \hline n & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline u_n & 5 & & & & & & \\ \hline d_n & & & & & & & \\ \hline \end{array}$$
    Conjecturer la nature de la suite $(d_n)$.

    **2.** Démontrer par récurrence que : $\forall n \in \mathbb N, \quad u_n = 4n^2 + 12n + 5$.

    **3.** Valider la conjecture émise à la question 1c).
  corrige: |
    **1.** **(a)** On applique la relation de récurrence :
    $$u_1 = \left(1 + \frac 21\right) \times 5 + \frac 61 = 15 + 6 = 21$$
    $$u_2 = \left(1 + \frac 22\right) \times 21 + \frac 62 = 42 + 3 = 45 \qquad ; \qquad u_3 = \left(1 + \frac 23\right) \times 45 + \frac 63 = 75 + 2 = 77$$
    $$\boxed{u_1 = 21 \;;\; u_2 = 45 \;;\; u_3 = 77}$$

    **(b)** On peut proposer la fonction suivante :

    ```python
    def p(n):
        u = 5
        for k in range(n):
            w = (1 + 2/(k+1))*u + 6/(k+1)   # w vaut u(k+1)
            print("d", k, "=", w - u)       # terme d(k)
            print("u", k+1, "=", w)         # terme u(k+1)
            u = w
    ```

    **(c)** En poursuivant les calculs, on obtient :
    $$\begin{array}{|c|c|c|c|c|c|c|c|} \hline n & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline u_n & 5 & 21 & 45 & 77 & 117 & 165 & 221 \\ \hline d_n & 16 & 24 & 32 & 40 & 48 & 56 & 64 \\ \hline \end{array}$$
    Les termes de $(d_n)$ augmentent de 8 à chaque rang :
    $$\boxed{\text{On conjecture que } (d_n) \text{ est arithmétique de raison } 8}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : « \, u_n = 4n^2 + 12n + 5 \, »$$

    **Initialisation :** Pour $n = 0$ : $4 \times 0 + 12 \times 0 + 5 = 5 = u_0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k = 4k^2 + 12k + 5$. Alors, en réduisant au même dénominateur $k + 1$ :
    $$\begin{aligned} u_{k+1} &= \left(1 + \frac{2}{k+1}\right) u_k + \frac{6}{k+1} \\ &= \frac{k+3}{k+1}\left(4k^2 + 12k + 5\right) + \frac{6}{k+1} \\ &= \frac{(k+3)\left(4k^2 + 12k + 5\right) + 6}{k+1} \\ &= \frac{4k^3 + 24k^2 + 41k + 21}{k+1} \end{aligned}$$
    Or on constate que :
    $$(k+1)\left(4(k+1)^2 + 12(k+1) + 5\right) = (k+1)\left(4k^2 + 20k + 21\right) = 4k^3 + 24k^2 + 41k + 21$$
    On en déduit donc que $u_{k+1} = 4(k+1)^2 + 12(k+1) + 5$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N, \ u_n = 4n^2 + 12n + 5}$$

    **3.** D'après la question précédente, pour tout $n \in \mathbb N$ :
    $$\begin{aligned} d_n = u_{n+1} - u_n &= \left(4(n+1)^2 + 12(n+1) + 5\right) - \left(4n^2 + 12n + 5\right) \\ &= 4n^2 + 8n + 4 + 12n + 12 + 5 - 4n^2 - 12n - 5 \\ &= 8n + 16 \end{aligned}$$
    On calcule alors la différence de deux termes consécutifs :
    $$d_{n+1} - d_n = 8(n+1) + 16 - 8n - 16 = 8$$
    Cette différence étant constante, la conjecture est validée :
    $$\boxed{(d_n) \text{ est arithmétique de raison } 8 \text{ et de premier terme } d_0 = 16}$$
- id: t-01-17
  feuille: f-t-01
  numero: 17
  partie: Raisonnement par récurrence
  etoiles: 3
  types: [Démonstration]
  mots_cles: [récurrence, factorielle, inégalité, puissance, encadrement]
  noeuds: [n-recurrence]
  notions: []
  page_enonce: 3
  page_corrige: 9
  enonce: |
    Rappel : pour tout $n \in \mathbb N^*$, la factorielle de $n$, notée $n!$, est définie par
    $$n! = 1 \times 2 \times 3 \times \cdots \times n, \text{ avec la convention } 0! = 1$$

    Démontrer que, pour tout $n \in \mathbb N^*$, on a $2^{n-1} \leqslant n! \leqslant n^n$.
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N^*, \quad P_n : \text{« } 2^{n-1} \leqslant n! \leqslant n^n \text{ »}$$

    **Initialisation :** Pour $n = 1$ : $2^0 = 1$, $1! = 1$ et $1^1 = 1$, donc $1 \leqslant 1 \leqslant 1$ et $P_1$ est vraie.

    **Hérédité :** Soit $k \geqslant 1$. Supposons que $2^{k-1} \leqslant k! \leqslant k^k$. On multiplie ces inégalités par $k + 1 > 0$, en remarquant que $(k+1)! = (k+1) \times k!$ :

    • Pour la minoration, comme $k + 1 \geqslant 2$ :
    $$(k+1)! = (k+1) \times k! \geqslant (k+1) \times 2^{k-1} \geqslant 2 \times 2^{k-1} = 2^k$$

    • Pour la majoration, comme $k \leqslant k + 1$ et donc $k^k \leqslant (k+1)^k$ :
    $$(k+1)! = (k+1) \times k! \leqslant (k+1) \times k^k \leqslant (k+1) \times (k+1)^k = (k+1)^{k+1}$$

    On obtient donc $2^{(k+1)-1} \leqslant (k+1)! \leqslant (k+1)^{k+1}$, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N^*,\ 2^{n-1} \leqslant n! \leqslant n^n}$$
- id: t-01-18
  feuille: f-t-01
  numero: 18
  partie: Raisonnement par récurrence
  etoiles: 3
  types: [Démonstration]
  mots_cles: [récurrence, puissance, divisibilité]
  noeuds: [n-recurrence]
  notions: []
  page_enonce: 3
  page_corrige: 10
  enonce: |
    Montrer que, si $n \in \mathbb N$, il existe un entier impair $\lambda_n$ tel que
    $$5^{2^n} = 1 + \lambda_n 2^{n+2}.$$
  corrige: |
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« il existe un entier impair } \lambda_n \text{ tel que } 5^{2^n} = 1 + \lambda_n 2^{n+2} \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $5^{2^0} = 5^1 = 5$ et $1 + 1 \times 2^2 = 5$. En posant $\lambda_0 = 1$, qui est bien impair, $P_0$ est donc vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons qu'il existe un entier impair $\lambda_k$ tel que $5^{2^k} = 1 + \lambda_k 2^{k+2}$. En remarquant que $2^{k+1} = 2 \times 2^k$, on peut écrire :
    $$\begin{aligned} 5^{2^{k+1}} &= \left(5^{2^k}\right)^2 = \left(1 + \lambda_k 2^{k+2}\right)^2 \\ &= 1 + 2\lambda_k 2^{k+2} + \lambda_k^2\, 2^{2k+4} \\ &= 1 + \lambda_k 2^{k+3} + \lambda_k^2\, 2^{k+3} \times 2^{k+1} \\ &= 1 + \underbrace{\left(\lambda_k + \lambda_k^2\, 2^{k+1}\right)}_{= \lambda_{k+1}} 2^{(k+1)+2} \end{aligned}$$

    Or $k + 1 \geqslant 1$, donc $\lambda_k^2\, 2^{k+1}$ est un entier pair ; comme $\lambda_k$ est impair, la somme $\lambda_{k+1} = \lambda_k + \lambda_k^2\, 2^{k+1}$ est un entier impair, ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence :
    $$\boxed{\forall n \in \mathbb N,\ \exists\, \lambda_n \text{ impair tel que } 5^{2^n} = 1 + \lambda_n 2^{n+2}}$$
- id: t-01-19
  feuille: f-t-01
  numero: 19
  partie: Limites de suites
  etoiles: 1
  types: [Calcul]
  mots_cles: [suite explicite, limite finie, limite infinie, opérations sur les limites, forme indéterminée, limite d'une suite géométrique]
  noeuds: [ar-suites]
  notions: [suite, limite-suite]
  page_enonce: 3
  page_corrige: 10
  enonce: |
    Déterminer la limite de chacune des suites $(u_n)$ suivantes définies pour tout $n \in \mathbb N^*$, par :

    **(a)** $u_n = 3n + 2$

    **(b)** $u_n = -5n^2 + \sqrt 2$

    **(c)** $u_n = \pi + \left(\dfrac 23\right)^n$

    **(d)** $u_n = -\left(\dfrac 54\right)^n$

    **(e)** $u_n = (n^2 + 1)^2$

    **(f)** $u_n = \dfrac{1}{n+1}$

    **(g)** $u_n = \dfrac 1n - \sqrt n$

    **(h)** $u_n = -\left(\dfrac 14\right)^n + 1$

    **(i)** $u_n = n^2 - 2n$

    **(j)** $u_n = \dfrac{3}{\frac 1n - 4}$

    **(k)** $u_n = \dfrac{n^2 + 1}{3n^2 + 5}$

    **(l)** $u_n = -2n + \sqrt n$

    **(m)** $u_n = \dfrac{n+1}{3 - n^2}$

    **(n)** $u_n = (n-1)^2 + (2-n)^2$

    **(o)** $u_n = (n-1)^2 - (2-n)^2$
  corrige: |
    On utilise les limites de référence et les opérations sur les limites.

    **(a)** $\lim\limits_{n \to +\infty} n = +\infty$, donc par produit et somme : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(b)** $\lim\limits_{n \to +\infty} -5n^2 = -\infty$, donc par somme avec la constante $\sqrt 2$ : $\boxed{\lim\limits_{n \to +\infty} u_n = -\infty}$

    **(c)** Comme $-1 < \dfrac 23 < 1$, on a $\lim\limits_{n \to +\infty} \left(\dfrac 23\right)^n = 0$, donc par somme : $\boxed{\lim\limits_{n \to +\infty} u_n = \pi}$

    **(d)** Comme $\dfrac 54 > 1$, on a $\lim\limits_{n \to +\infty} \left(\dfrac 54\right)^n = +\infty$, donc par produit par $-1$ : $\boxed{\lim\limits_{n \to +\infty} u_n = -\infty}$

    **(e)** $\lim\limits_{n \to +\infty} (n^2 + 1) = +\infty$, donc par produit : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(f)** $\lim\limits_{n \to +\infty} (n + 1) = +\infty$, donc par quotient : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **(g)** $\lim\limits_{n \to +\infty} \dfrac 1n = 0$ et $\lim\limits_{n \to +\infty} -\sqrt n = -\infty$, donc par somme : $\boxed{\lim\limits_{n \to +\infty} u_n = -\infty}$

    **(h)** Comme $-1 < \dfrac 14 < 1$, on a $\lim\limits_{n \to +\infty} \left(\dfrac 14\right)^n = 0$, donc : $\boxed{\lim\limits_{n \to +\infty} u_n = 1}$

    **(i)** C'est une forme indéterminée $\infty - \infty$ ; on factorise par le terme dominant :
    $$u_n = n^2 \left(1 - \frac 2n\right)$$
    Or $\lim\limits_{n \to +\infty} \left(1 - \dfrac 2n\right) = 1$ et $\lim\limits_{n \to +\infty} n^2 = +\infty$, donc par produit : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(j)** $\lim\limits_{n \to +\infty} \dfrac 1n = 0$, donc le dénominateur tend vers $-4$, et par quotient : $\boxed{\lim\limits_{n \to +\infty} u_n = -\dfrac 34}$

    **(k)** C'est une forme indéterminée $\dfrac{\infty}{\infty}$ ; on factorise par $n^2$ au numérateur et au dénominateur :
    $$u_n = \frac{n^2\left(1 + \frac{1}{n^2}\right)}{n^2\left(3 + \frac{5}{n^2}\right)} = \frac{1 + \frac{1}{n^2}}{3 + \frac{5}{n^2}}$$
    Le numérateur tend vers 1 et le dénominateur vers 3 : $\boxed{\lim\limits_{n \to +\infty} u_n = \dfrac 13}$

    **(l)** Forme indéterminée $-\infty + \infty$ ; on factorise par $n$ :
    $$u_n = n\left(-2 + \frac{1}{\sqrt n}\right)$$
    Or $\lim\limits_{n \to +\infty} \left(-2 + \dfrac{1}{\sqrt n}\right) = -2$ et $\lim\limits_{n \to +\infty} n = +\infty$, donc par produit : $\boxed{\lim\limits_{n \to +\infty} u_n = -\infty}$

    **(m)** On factorise par le terme dominant :
    $$u_n = \frac{n\left(1 + \frac 1n\right)}{n^2\left(\frac{3}{n^2} - 1\right)} = \frac 1n \times \frac{1 + \frac 1n}{\frac{3}{n^2} - 1}$$
    Le second facteur tend vers $-1$ et $\lim\limits_{n \to +\infty} \dfrac 1n = 0$, donc : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **(n)** Les deux carrés tendent vers $+\infty$, donc par somme : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(o)** C'est une forme indéterminée ; on reconnaît une différence de deux carrés :
    $$\begin{aligned} u_n &= \big[(n-1) - (2-n)\big]\big[(n-1) + (2-n)\big] \\ &= (2n - 3) \times 1 = 2n - 3 \end{aligned}$$
    d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$
- id: t-01-20
  feuille: f-t-01
  numero: 20
  partie: Limites de suites
  etoiles: 2
  types: [Calcul]
  mots_cles: [suite explicite, limite finie, limite infinie, forme indéterminée, opérations sur les limites, quantité conjuguée]
  noeuds: [ar-suites]
  notions: [suite, limite-suite]
  page_enonce: 3
  page_corrige: 11
  enonce: |
    Déterminer la limite de la suite $(u_n)$ dans les cas suivants :

    **1.** $u_n = \dfrac{2n + 5}{3n - 2}$

    **2.** $u_n = \dfrac n4 - 2 + \dfrac{2n}{n^2 + 5}$

    **3.** $u_n = \dfrac{-3n^2 + 2n + 1}{2(n+1)^2}$

    **4.** $u_n = \dfrac{10n - 3}{n^2 - 2}$

    **5.** $u_n = \dfrac{2n^2 - 1}{3n + 2}$

    **6.** $u_n = \dfrac{3n^2 - 4}{n + 1} - 3n$

    **7.** $u_n = \dfrac{3}{2\sqrt n + 17}$

    **8.** $u_n = \dfrac{\sqrt{3n + 1}}{3 + \sqrt n}$

    **9.** $u_n = \dfrac{\sqrt{n^2 + n + 2}}{\sqrt{n^2 - n - 1}}$

    **10.** $u_n = \sqrt{n + 1} - \sqrt n$

    **11.** $u_n = \sqrt{n^2 + n} - n$
  corrige: |
    Dans chaque cas, on lève la forme indéterminée en factorisant par le terme dominant, ou en multipliant par la quantité conjuguée.

    **1.** $u_n = \dfrac{n\left(2 + \frac 5n\right)}{n\left(3 - \frac 2n\right)} = \dfrac{2 + \frac 5n}{3 - \frac 2n}$, d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = \dfrac 23}$

    **2.** $\lim\limits_{n \to +\infty} \dfrac n4 = +\infty$ et, par le même procédé qu'à l'exercice 19, $\lim\limits_{n \to +\infty} \dfrac{2n}{n^2 + 5} = 0$. Par somme : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **3.** En développant le dénominateur puis en factorisant par $n^2$ :
    $$u_n = \frac{n^2\left(-3 + \frac 2n + \frac{1}{n^2}\right)}{2n^2\left(1 + \frac 2n + \frac{1}{n^2}\right)} \qquad \text{d'où} \qquad \boxed{\lim_{n \to +\infty} u_n = -\frac 32}$$

    **4.** $u_n = \dfrac{n\left(10 - \frac 3n\right)}{n^2\left(1 - \frac{2}{n^2}\right)} = \dfrac 1n \times \dfrac{10 - \frac 3n}{1 - \frac{2}{n^2}}$, d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **5.** $u_n = \dfrac{n^2\left(2 - \frac{1}{n^2}\right)}{n\left(3 + \frac 2n\right)} = n \times \dfrac{2 - \frac{1}{n^2}}{3 + \frac 2n}$. Le second facteur tend vers $\dfrac 23 > 0$, donc par produit : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **6.** On réduit d'abord au même dénominateur :
    $$u_n = \frac{3n^2 - 4 - 3n(n+1)}{n + 1} = \frac{-3n - 4}{n + 1} = \frac{n\left(-3 - \frac 4n\right)}{n\left(1 + \frac 1n\right)}$$
    d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = -3}$

    **7.** $\lim\limits_{n \to +\infty} \left(2\sqrt n + 17\right) = +\infty$, donc par quotient : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **8.** On factorise par $\sqrt n$ au numérateur et au dénominateur :
    $$u_n = \frac{\sqrt n \sqrt{3 + \frac 1n}}{\sqrt n\left(\frac{3}{\sqrt n} + 1\right)} = \frac{\sqrt{3 + \frac 1n}}{\frac{3}{\sqrt n} + 1}$$
    Le numérateur tend vers $\sqrt 3$ et le dénominateur vers 1 : $\boxed{\lim\limits_{n \to +\infty} u_n = \sqrt 3}$

    **9.** On procède de même en factorisant par $n^2$ sous chaque racine :
    $$u_n = \frac{n\sqrt{1 + \frac 1n + \frac{2}{n^2}}}{n\sqrt{1 - \frac 1n - \frac{1}{n^2}}}$$
    Les deux racines tendent vers 1, d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = 1}$

    **10.** Forme indéterminée $\infty - \infty$ ; on multiplie par la quantité conjuguée :
    $$u_n = \frac{\left(\sqrt{n+1} - \sqrt n\right)\left(\sqrt{n+1} + \sqrt n\right)}{\sqrt{n+1} + \sqrt n} = \frac{n + 1 - n}{\sqrt{n+1} + \sqrt n} = \frac{1}{\sqrt{n+1} + \sqrt n}$$
    Le dénominateur tend vers $+\infty$, d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **11.** On procède de même :
    $$u_n = \frac{n^2 + n - n^2}{\sqrt{n^2 + n} + n} = \frac{n}{n\sqrt{1 + \frac 1n} + n} = \frac{1}{\sqrt{1 + \frac 1n} + 1}$$
    Le dénominateur tend vers 2, d'où : $\boxed{\lim\limits_{n \to +\infty} u_n = \dfrac 12}$
- id: t-01-21
  feuille: f-t-01
  numero: 21
  partie: Limites de suites
  etoiles: 1
  types: [Calcul]
  mots_cles: [théorème de comparaison, théorème des gendarmes, encadrement, suite explicite, limite finie, limite infinie]
  noeuds: [ar-suites]
  notions: [suite, limite-suite]
  page_enonce: 3
  page_corrige: 12
  enonce: |
    À l'aide des théorèmes de comparaison, déterminer la limite de chacune des suites $(v_n)$ suivantes définies pour tout $n \in \mathbb N^*$, par :

    **(a)** $v_n = \dfrac{\cos(n)}{n}$

    **(b)** $v_n = 4n + (-1)^n$

    **(c)** $v_n = 3 - \dfrac{\sin(n)}{n^4}$

    **(d)** $v_n = -5n - 2\cos(n)$

    **(e)** $v_n = \dfrac{(-1)^n}{3 - n}$

    **(f)** $v_n = \dfrac{2\cos(n) + 3}{n^2 + 5}$

    **(g)** $u_n = \dfrac{\cos(2n)}{\sqrt n}$

    **(h)** $u_n = n^2 - 4(-1)^n$

    **(i)** $u_n = n + 1 - \cos(n)$

    **(j)** $u_n = \dfrac{n + (-1)^n}{n^2 - 1} - 2$ , $n \geqslant 2$.
  corrige: |
    On utilise l'encadrement $-1 \leqslant \cos(x) \leqslant 1$ (et de même pour le sinus), ainsi que $-1 \leqslant (-1)^n \leqslant 1$.

    **(a)** Pour tout $n \geqslant 1$ : $-\dfrac 1n \leqslant v_n \leqslant \dfrac 1n$. Ces deux bornes tendent vers 0, donc d'après le théorème des gendarmes : $\boxed{\lim\limits_{n \to +\infty} v_n = 0}$

    **(b)** Pour tout $n$ : $v_n \geqslant 4n - 1$, et $\lim\limits_{n \to +\infty} (4n - 1) = +\infty$, donc par comparaison : $\boxed{\lim\limits_{n \to +\infty} v_n = +\infty}$

    **(c)** Pour tout $n \geqslant 1$ : $-\dfrac{1}{n^4} \leqslant \dfrac{\sin(n)}{n^4} \leqslant \dfrac{1}{n^4}$, donc $3 - \dfrac{1}{n^4} \leqslant v_n \leqslant 3 + \dfrac{1}{n^4}$. D'après le théorème des gendarmes : $\boxed{\lim\limits_{n \to +\infty} v_n = 3}$

    **(d)** Pour tout $n$, on a $v_n \leqslant -5n + 2$. Or $\lim\limits_{n \to +\infty} (-5n + 2) = -\infty$, donc par comparaison : $\boxed{\lim\limits_{n \to +\infty} v_n = -\infty}$

    **(e)** Pour tout $n \geqslant 4$ : $-\dfrac{1}{n - 3} \leqslant v_n \leqslant \dfrac{1}{n - 3}$, et ces deux bornes tendent vers 0, donc d'après le théorème des gendarmes : $\boxed{\lim\limits_{n \to +\infty} v_n = 0}$

    **(f)** Pour tout $n$ : $1 \leqslant 2\cos(n) + 3 \leqslant 5$, donc $\dfrac{1}{n^2 + 5} \leqslant v_n \leqslant \dfrac{5}{n^2 + 5}$. Ces deux bornes tendent vers 0, d'où : $\boxed{\lim\limits_{n \to +\infty} v_n = 0}$

    **(g)** Pour tout $n \geqslant 1$ : $-\dfrac{1}{\sqrt n} \leqslant u_n \leqslant \dfrac{1}{\sqrt n}$, d'où d'après le théorème des gendarmes : $\boxed{\lim\limits_{n \to +\infty} u_n = 0}$

    **(h)** Pour tout $n$ : $u_n \geqslant n^2 - 4$, et $\lim\limits_{n \to +\infty} (n^2 - 4) = +\infty$, donc par comparaison : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(i)** Pour tout $n$ : $u_n \geqslant n + 1 - 1 = n$, et $\lim\limits_{n \to +\infty} n = +\infty$, donc par comparaison : $\boxed{\lim\limits_{n \to +\infty} u_n = +\infty}$

    **(j)** Pour tout $n \geqslant 2$ :
    $$\frac{n - 1}{n^2 - 1} \leqslant \frac{n + (-1)^n}{n^2 - 1} \leqslant \frac{n + 1}{n^2 - 1} \qquad \text{c'est-à-dire} \qquad \frac{1}{n + 1} \leqslant \frac{n + (-1)^n}{n^2 - 1} \leqslant \frac{1}{n - 1}$$
    Ces deux bornes tendent vers 0, donc le quotient tend vers 0 d'après le théorème des gendarmes, et par somme : $\boxed{\lim\limits_{n \to +\infty} u_n = -2}$
- id: t-01-22
  feuille: f-t-01
  numero: 22
  partie: Limites de suites
  etoiles: 1
  types: [Démonstration]
  mots_cles: [suite définie par récurrence, fonction associée, sens de variation, minoration, récurrence, convergence monotone, convergence]
  noeuds: [ar-suites, n-recurrence]
  notions: [suite, limite-suite]
  page_enonce: 3
  page_corrige: 13
  enonce: |
    Soit la suite $u$ définie par $u_0 = 5$ et $u_{n+1} = \sqrt{3u_n + 1}$

    **1.** Montrer que $(u_n)$ est décroissante.

    **2.** Montrer que la suite $(u_n)$ est minorée.

    **3.** En déduire que la suite $(u_n)$ est convergente.
  corrige: |
    **1.** La suite est définie par $u_{n+1} = f(u_n)$ où $f(x) = \sqrt{3x + 1}$, fonction croissante sur $\left[-\frac 13 \,;+\infty\right[$ comme composée de la fonction affine croissante $x \mapsto 3x + 1$ et de la fonction racine carrée, croissante.
    Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_{n+1} \leqslant u_n \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_1 = \sqrt{3 \times 5 + 1} = \sqrt{16} = 4 \leqslant 5 = u_0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_{k+1} \leqslant u_k$. En appliquant la fonction $f$, croissante :
    $$u_{k+1} \leqslant u_k \implies f(u_{k+1}) \leqslant f(u_k) \implies u_{k+2} \leqslant u_{k+1}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{(u_n) \text{ est décroissante}}$

    **2.** Démontrons par récurrence que $\forall n \in \mathbb N$, $Q_n$ : « $u_n \geqslant 0$ ».

    **Initialisation :** $u_0 = 5 \geqslant 0$, donc $Q_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Si $u_k \geqslant 0$, alors $3u_k + 1 \geqslant 1 > 0$, donc $u_{k+1}$ est bien défini et, en tant que racine carrée, $u_{k+1} = \sqrt{3u_k + 1} \geqslant 0$, ce qui prouve $Q_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{(u_n) \text{ est minorée par } 0}$

    **3.** La suite $(u_n)$ est décroissante et minorée par 0 : d'après le théorème de convergence monotone, on en déduit que :
    $$\boxed{(u_n) \text{ est convergente}}$$
- id: t-01-23
  feuille: f-t-01
  numero: 23
  partie: Limites de suites
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [suite définie par récurrence, fonction associée, sens de variation, suite bornée, récurrence, convergence monotone, limite finie]
  noeuds: [ar-suites, n-recurrence]
  notions: [suite, limite-suite, majorant]
  page_enonce: 3
  page_corrige: 13
  enonce: |
    Soit la suite $(u_n)$ définie par $u_0 = 0$ et $u_{n+1} = \sqrt{u_n + 5}$.

    **1.** Montrer que cette suite est croissante.

    **2.** Montrer que pour tout entier $n$, $0 \leqslant u_n \leqslant 3$. En déduire que la suite $(u_n)$ est convergente.

    **3.** Déterminer la limite $\ell$ de la suite $(u_n)$.
  corrige: |
    **1.** La suite est définie par $u_{n+1} = f(u_n)$ où $f(x) = \sqrt{x + 5}$, croissante sur $[-5 \,; +\infty[$. Démontrons par récurrence la propriété :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n \leqslant u_{n+1} \text{ »}$$

    **Initialisation :** Pour $n = 0$ : $u_1 = \sqrt{0 + 5} = \sqrt 5 \geqslant 0 = u_0$. Donc $P_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k \leqslant u_{k+1}$. En appliquant $f$, croissante :
    $$u_k \leqslant u_{k+1} \implies f(u_k) \leqslant f(u_{k+1}) \implies u_{k+1} \leqslant u_{k+2}$$
    ce qui prouve $P_{k+1}$.

    **Conclusion :** Par principe de récurrence : $\boxed{(u_n) \text{ est croissante}}$

    **2.** Démontrons par récurrence que $\forall n \in \mathbb N$, $Q_n$ : « $0 \leqslant u_n \leqslant 3$ ».

    **Initialisation :** $u_0 = 0$ et $0 \leqslant 0 \leqslant 3$, donc $Q_0$ est vraie.

    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 \leqslant u_k \leqslant 3$. Alors :
    $$5 \leqslant u_k + 5 \leqslant 8 \implies \sqrt 5 \leqslant u_{k+1} \leqslant \sqrt 8$$
    Or $\sqrt 5 \geqslant 0$ et $\sqrt 8 \leqslant \sqrt 9 = 3$, donc $0 \leqslant u_{k+1} \leqslant 3$, ce qui prouve $Q_{k+1}$.

    **Conclusion :** Par principe de récurrence, $0 \leqslant u_n \leqslant 3$ pour tout $n$. La suite $(u_n)$ étant croissante et majorée par 3, le théorème de convergence monotone donne :
    $$\boxed{(u_n) \text{ est convergente}}$$

    **3.** Notons $\ell$ sa limite. Comme $(u_{n+1})$ a la même limite que $(u_n)$, on passe à la limite dans la relation de récurrence :
    $$\ell = \sqrt{\ell + 5} \implies \ell^2 = \ell + 5 \implies \ell^2 - \ell - 5 = 0$$
    Le discriminant de cette équation vaut $\Delta = 1 + 20 = 21 > 0$, et ses deux solutions sont $\dfrac{1 \pm \sqrt{21}}{2}$. Or $\ell \geqslant 0$ d'après la question 2., ce qui élimine la solution négative :
    $$\boxed{\ell = \frac{1 + \sqrt{21}}{2} \approx 2{,}79}$$
- id: t-01-24
  feuille: f-t-01
  numero: 24
  partie: Limites de suites
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [suite définie par récurrence, suite auxiliaire, suite arithmétique, limite finie, opérations sur les limites]
