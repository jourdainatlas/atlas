  page_enonce: 5
  page_corrige: 18
  enonce: |
    La suite $(u_n)$ est définie sur $\mathbb N$ par : $u_0 = 0$ et $u_{n+1} = \dfrac{2u_n + 1}{u_n + 2}$.

    **Partie A : première méthode**

    **1.** Montrer que : $\forall n \in \mathbb N, \quad u_{n+1} = 2 - \dfrac{3}{u_n + 2}$.

    **2.** **(a)** Démontrer par récurrence que : $\forall n \in \mathbb N, \quad 0 \leqslant u_n < 1$.

    **(b)** Vérifier que $u_{n+1} - u_n = \dfrac{1 - u_n^2}{u_n + 2}$ puis montrer que $(u_n)$ est croissante.

    **3.** En déduire que la suite $(u_n)$ est convergente vers une limite $\ell$.

    **4.** On admet que $\ell$ vérifie $f(\ell) = \ell$ avec $f$ définie sur $[0\,;1]$ par $f(x) = \dfrac{2x+1}{x+2}$.

    **(a)** Déterminer la valeur de $\ell$

    **(b)** Écrire un algorithme déterminant la valeur $N$ tel que : $\forall n > N, \ |u_n - \ell| < 10^{-3}$.
    Donner la valeur de $N$ à l'aide de la calculatrice.

    **Partie B : deuxième méthode**

    **1.** La suite $(v_n)$ est définie pour tout entier $n$ par : $v_n = \dfrac{u_n - 1}{u_n + 1}$.
    Démontrer que $(v_n)$ est géométrique. Préciser la raison et le premier terme.

    **2.** Exprimer $v_n$, puis $u_n$ en fonction de $n$.

    **3.** En déduire que la suite $(u_n)$ est convergente et donner sa limite.
  corrige: |
    **Partie A : première méthode**

    **1.** Pour tout $n \in \mathbb N$, en réduisant au même dénominateur :
    $$2 - \frac{3}{u_n + 2} = \frac{2\left(u_n + 2\right) - 3}{u_n + 2} = \frac{2u_n + 1}{u_n + 2} = u_{n+1}$$
    $$\boxed{\forall n \in \mathbb N,\ u_{n+1} = 2 - \frac{3}{u_n + 2}}$$

    **2.** **(a)** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 0 \leqslant u_n < 1 \text{ »}$$
    **Initialisation :** Pour $n = 0$ : $u_0 = 0$ et $0 \leqslant 0 < 1$. Donc $P_0$ est vraie.
    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 \leqslant u_k < 1$. Alors $2 \leqslant u_k + 2 < 3$, et la fonction inverse étant décroissante sur $]0\,;+\infty[$ :
    $$\frac13 < \frac{1}{u_k + 2} \leqslant \frac12 \implies 1 < \frac{3}{u_k + 2} \leqslant \frac32$$
    En multipliant par $-1$ puis en ajoutant $2$ :
    $$2 - \frac32 \leqslant u_{k+1} < 2 - 1 \implies \frac12 \leqslant u_{k+1} < 1$$
    Comme $\dfrac12 \geqslant 0$, ceci prouve $P_{k+1}$.
    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N,\ 0 \leqslant u_n < 1}$

    **(b)** Pour tout $n \in \mathbb N$ :
    $$u_{n+1} - u_n = \frac{2u_n + 1}{u_n + 2} - u_n = \frac{2u_n + 1 - u_n^2 - 2u_n}{u_n + 2} = \frac{1 - u_n^2}{u_n + 2}$$
    Or $0 \leqslant u_n < 1$ donc $u_n^2 < 1$ et $1 - u_n^2 > 0$ ; de plus $u_n + 2 > 0$. Le quotient est donc strictement positif :
    $$\boxed{(u_n) \text{ est croissante}}$$

    **3.** La suite $(u_n)$ est croissante et majorée par $1$ : d'après le théorème de convergence monotone :
    $$\boxed{(u_n) \text{ converge vers un réel } \ell}$$

    **4.** **(a)** On résout $f(\ell) = \ell$ sur $[0\,;1]$ :
    $$\frac{2\ell + 1}{\ell + 2} = \ell \iff 2\ell + 1 = \ell^2 + 2\ell \iff \ell^2 = 1$$
    Les solutions sont $1$ et $-1$, or $\ell \in [0\,;1]$ :
    $$\boxed{\ell = 1}$$

    **(b)** On peut proposer l'algorithme suivant :

    ```python
    n = 0
    u = 0
    while abs(u - 1) >= 10**(-3) :
        u = (2*u+1)/(u+2)
        n = n+1
    print(n)
    ```

    Le programme renvoie $7$ : l'inégalité $|u_n - 1| < 10^{-3}$ est donc vérifiée à partir du rang $7$, et la valeur $\boxed{N = 6}$ convient. (On peut le retrouver avec la partie B : $|u_n - 1| = \dfrac{2}{3^n + 1} < 10^{-3}$ équivaut à $3^n > 1999$, or $3^6 = 729$ et $3^7 = 2187$.)

    **Partie B : deuxième méthode**

    **1.** On calcule séparément le numérateur et le dénominateur de $v_{n+1}$ :
    $$u_{n+1} - 1 = \frac{2u_n + 1 - u_n - 2}{u_n + 2} = \frac{u_n - 1}{u_n + 2} \qquad ; \qquad u_{n+1} + 1 = \frac{2u_n + 1 + u_n + 2}{u_n + 2} = \frac{3\left(u_n + 1\right)}{u_n + 2}$$
    En formant le quotient, les dénominateurs se simplifient :
    $$v_{n+1} = \frac{u_{n+1} - 1}{u_{n+1} + 1} = \frac{u_n - 1}{3\left(u_n + 1\right)} = \frac13 v_n$$
    $$\boxed{(v_n) \text{ est géométrique de raison } \frac13 \text{ et de premier terme } v_0 = -1}$$

    **2.** On en déduit $v_n = -\left(\dfrac13\right)^n$. De plus :
    $$v_n = \frac{u_n - 1}{u_n + 1} \iff v_n\left(u_n + 1\right) = u_n - 1 \iff u_n\left(v_n - 1\right) = -1 - v_n \iff u_n = \frac{1 + v_n}{1 - v_n}$$
    $$\boxed{v_n = -\left(\frac13\right)^n \qquad \text{et} \qquad u_n = \frac{1 - \left(\frac13\right)^n}{1 + \left(\frac13\right)^n} = \frac{3^n - 1}{3^n + 1}}$$

    **3.** Comme $-1 < \dfrac13 < 1$, on a $\displaystyle\lim_{n\to+\infty} \left(\frac13\right)^n = 0$, donc le numérateur tend vers $1$ et le dénominateur vers $1$ :
    $$\boxed{(u_n) \text{ converge et } \lim_{n\to+\infty} u_n = 1}$$
    ce qui confirme le résultat de la partie A.
- id: t-01-32
  feuille: f-t-01
  numero: 32
  partie: Limites de suites
  etoiles: 2
  types: [Démonstration, Calcul, Algorithmique, Conjecture]
  mots_cles: [suite définie par récurrence, récurrence, minoration, sens de variation, convergence monotone, suite auxiliaire, suite géométrique, tableau de valeurs]
  noeuds: [ar-suites, n-recurrence]
