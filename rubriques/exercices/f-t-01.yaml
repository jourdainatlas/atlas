  enonce: |
    Soit la suite $(u_n)$ définie sur $\mathbb N^*$ par $u_1 = \dfrac32$ et $u_{n+1} = \dfrac{nu_n + 1}{2(n+1)}$.
    On pose, pour $n \in \mathbb N^*$, $v_n = nu_n - 1$.

    **1.** Montrer que $(v_n)$ est géométrique ; préciser sa raison et son premier terme.

    **2.** En déduire que, pour tout $n \in \mathbb N^*$ : $u_n = \dfrac{1 + 0{,}5^n}{n}$.

    **3.** Déterminer la limite de la suite $(u_n)$.

    **4.** Justifier que, pour tout $n \in \mathbb N^*$ : $u_{n+1} - u_n = -\dfrac{1 + 0{,}5^n(1 + 0{,}5n)}{n(n+1)}$.
    En déduire le sens de variation de la suite $(u_n)$.
  corrige: |
    **1.** Pour tout $n \in \mathbb N^*$ :
    $$\begin{aligned} v_{n+1} &= (n+1)u_{n+1} - 1 \\ &= (n+1) \times \frac{nu_n + 1}{2(n+1)} - 1 \\ &= \frac{nu_n + 1}{2} - 1 = \frac{nu_n - 1}{2} = \frac12 v_n \end{aligned}$$
    Le premier terme vaut $v_1 = 1 \times \dfrac32 - 1 = \dfrac12$ :
    $$\boxed{(v_n) \text{ est géométrique de raison } \frac12 \text{ et de premier terme } v_1 = \frac12}$$

    **2.** On en déduit, pour tout $n \geqslant 1$ :
    $$v_n = v_1 \times \left(\frac12\right)^{n-1} = \frac12 \times \left(\frac12\right)^{n-1} = \left(\frac12\right)^n = 0{,}5^n$$
    Or $v_n = nu_n - 1$, donc $nu_n = 1 + 0{,}5^n$ et, en divisant par $n \neq 0$ :
    $$\boxed{\forall n \in \mathbb N^*,\ u_n = \frac{1 + 0{,}5^n}{n}}$$

    **3.** Comme $-1 < 0{,}5 < 1$, on a $\displaystyle\lim_{n\to+\infty} 0{,}5^n = 0$, donc le numérateur tend vers $1$ tandis que le dénominateur tend vers $+\infty$. Par quotient :
    $$\boxed{\lim_{n\to+\infty} u_n = 0}$$

    **4.** Pour tout $n \in \mathbb N^*$, on réduit au même dénominateur :
    $$\begin{aligned} u_{n+1} - u_n &= \frac{1 + 0{,}5^{n+1}}{n+1} - \frac{1 + 0{,}5^n}{n} \\ &= \frac{n\left(1 + 0{,}5^{n+1}\right) - (n+1)\left(1 + 0{,}5^n\right)}{n(n+1)} \\ &= \frac{n + 0{,}5^n \times 0{,}5n - n - 1 - (n+1)0{,}5^n}{n(n+1)} \\ &= \frac{-1 + 0{,}5^n\left(0{,}5n - n - 1\right)}{n(n+1)} \\ &= -\frac{1 + 0{,}5^n\left(1 + 0{,}5n\right)}{n(n+1)} \end{aligned}$$
    Or $0{,}5^n > 0$ et $1 + 0{,}5n > 0$, donc le numérateur est strictement positif, et le dénominateur également : le quotient précédé du signe $-$ est donc strictement négatif.
    $$\boxed{(u_n) \text{ est décroissante}}$$
- id: t-01-31
  feuille: f-t-01
  numero: 31
  titre: Deux méthodes pour déterminer la limite d'une suite
  partie: Limites de suites
