  enonce: |
    Soit la suite $(u_n)_{n\in\mathbb N}$ définie par $u_0 = 2$ et, pour tout entier $n$, $u_{n+1} = \dfrac{5u_n - 1}{u_n + 3}$.

    **1ère méthode**

    **(a)** Vérifier que pour tout $n \in \mathbb N$, $u_{n+1} = 5 - \dfrac{16}{u_n + 3}$.

    **(b)** Montrer que, pour tout $n \in \mathbb N$, $u_n \in [1\,;2]$.

    **(c)** Établir la relation $u_{n+1} - u_n = -\dfrac{(u_n - 1)^2}{u_n + 3}$, et en déduire le sens de variation de $(u_n)_{n\in\mathbb N}$.

    **(d)** Démontrer que $(u_n)_{n\in\mathbb N}$ converge et déterminer sa limite $l$.

    **2ème méthode**

    On considère la suite $(v_n)_{n\in\mathbb N}$ définie pour tout $n \in \mathbb N$ par $v_n = \dfrac{1}{u_n - 1}$.

    **(a)** Prouver que $(v_n)_{n\in\mathbb N}$ est une suite arithmétique de raison $\dfrac14$.

    **(b)** Exprimer pour tout $n$, $v_n$ puis $u_n$ en fonction de $n$.

    **(c)** En déduire la convergence de $(u_n)_{n\in\mathbb N}$ et sa limite.
  corrige: |
    **1re méthode**

    **(a)** Pour tout $n \in \mathbb N$, en réduisant au même dénominateur :
    $$5 - \frac{16}{u_n + 3} = \frac{5\left(u_n + 3\right) - 16}{u_n + 3} = \frac{5u_n + 15 - 16}{u_n + 3} = \frac{5u_n - 1}{u_n + 3} = u_{n+1}$$
    $$\boxed{\forall n \in \mathbb N,\ u_{n+1} = 5 - \frac{16}{u_n + 3}}$$

    **(b)** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 1 \leqslant u_n \leqslant 2 \text{ »}$$
    **Initialisation :** Pour $n = 0$ : $u_0 = 2$ et $1 \leqslant 2 \leqslant 2$. Donc $P_0$ est vraie.
    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $1 \leqslant u_k \leqslant 2$. Alors $4 \leqslant u_k + 3 \leqslant 5$, et la fonction inverse étant décroissante sur $]0\,;+\infty[$ :
    $$\frac15 \leqslant \frac{1}{u_k + 3} \leqslant \frac14 \implies \frac{16}{5} \leqslant \frac{16}{u_k + 3} \leqslant 4$$
    En multipliant par $-1$ puis en ajoutant $5$, ce qui inverse le sens des inégalités :
    $$5 - 4 \leqslant u_{k+1} \leqslant 5 - \frac{16}{5} \implies 1 \leqslant u_{k+1} \leqslant \frac95$$
    Comme $\dfrac95 \leqslant 2$, ceci prouve $P_{k+1}$.
    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N,\ u_n \in [1\,;2]}$

    **(c)** Pour tout $n \in \mathbb N$ :
    $$\begin{aligned} u_{n+1} - u_n &= \frac{5u_n - 1}{u_n + 3} - u_n = \frac{5u_n - 1 - u_n\left(u_n + 3\right)}{u_n + 3} \\ &= \frac{-u_n^2 + 2u_n - 1}{u_n + 3} = -\frac{\left(u_n - 1\right)^2}{u_n + 3} \end{aligned}$$
    Le numérateur est un carré, donc positif, et le dénominateur est strictement positif puisque $u_n \geqslant 1$ : ce quotient est donc négatif.
    $$\boxed{(u_n) \text{ est décroissante}}$$

    **(d)** La suite est décroissante et minorée par $1$ : d'après le théorème de convergence monotone, elle converge vers un réel $\ell$. En passant à la limite dans la relation de récurrence :
    $$\ell = \frac{5\ell - 1}{\ell + 3} \iff \ell^2 + 3\ell = 5\ell - 1 \iff \ell^2 - 2\ell + 1 = 0 \iff (\ell - 1)^2 = 0$$
    $$\boxed{(u_n) \text{ converge et } \ell = 1}$$

    **2e méthode**

    **(a)** Remarquons d'abord que $u_n > 1$ pour tout $n$ : c'est vrai au rang $0$, et si $u_k > 1$ alors
    $$u_{k+1} - 1 = \frac{5u_k - 1 - \left(u_k + 3\right)}{u_k + 3} = \frac{4\left(u_k - 1\right)}{u_k + 3} > 0$$
    ce qui assure que $v_n$ est bien défini. On utilise alors cette même égalité :
    $$\begin{aligned} v_{n+1} &= \frac{1}{u_{n+1} - 1} = \frac{u_n + 3}{4\left(u_n - 1\right)} \\ &= \frac{\left(u_n - 1\right) + 4}{4\left(u_n - 1\right)} \\ &= \frac14 + \frac{1}{u_n - 1} = v_n + \frac14 \end{aligned}$$
    $$\boxed{(v_n) \text{ est arithmétique de raison } \frac14 \text{ et de premier terme } v_0 = 1}$$

    **(b)** On en déduit que $v_n = 1 + \dfrac n4 = \dfrac{n+4}{4}$, puis, en inversant la relation $v_n = \dfrac{1}{u_n - 1}$ :
    $$\boxed{v_n = \frac{n+4}{4} \qquad \text{et} \qquad u_n = 1 + \frac{4}{n+4}}$$

    **(c)** Comme $\displaystyle\lim_{n\to+\infty} \frac{4}{n+4} = 0$, on retrouve bien le résultat de la première méthode :
    $$\boxed{(u_n) \text{ converge et } \lim_{n\to+\infty} u_n = 1}$$
