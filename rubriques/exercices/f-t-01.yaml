  enonce: |
    On considère la suite $(u_n)$ définie par $u_0 = 2$ et, pour tout entier $n$, $u_{n+1} = \dfrac14 u_n + 6$ et la suite $(v_n)$ définie sur $\mathbb N$ par $v_n = u_n - 8$.

    **1.** Démontrer que la suite $(v_n)$ est géométrique.

    **2.** En déduire l'expression de $v_n$, puis de $u_n$ en fonction de $n$.

    **3.** Déterminer les limites des suites $(v_n)$ et $(u_n)$.
  corrige: |
    **1.** Pour tout $n \in \mathbb N$ :
    $$\begin{aligned} v_{n+1} = u_{n+1} - 8 &= \frac14 u_n + 6 - 8 \\ &= \frac14 u_n - 2 \\ &= \frac14 \left(u_n - 8\right) = \frac14 v_n \end{aligned}$$
    $$\boxed{(v_n) \text{ est géométrique de raison } \frac14 \text{ et de premier terme } v_0 = -6}$$

    **2.** On en déduit l'expression de $v_n$, puis celle de $u_n = v_n + 8$ :
    $$\boxed{v_n = -6\left(\frac14\right)^n \qquad \text{et} \qquad u_n = 8 - 6\left(\frac14\right)^n}$$

    **3.** Comme $-1 < \dfrac14 < 1$, on a $\displaystyle\lim_{n\to+\infty} \left(\frac14\right)^n = 0$, d'où :
    $$\boxed{\lim_{n\to+\infty} v_n = 0 \qquad \text{et} \qquad \lim_{n\to+\infty} u_n = 8}$$
- id: t-01-28
  feuille: f-t-01
  numero: 28
  partie: Limites de suites
  etoiles: 1
  types: [Calcul, Démonstration]
  mots_cles: [suite définie par récurrence, récurrence, minoration, sens de variation, convergence monotone, suite géométrique, somme, limite d'une suite géométrique]
  noeuds: [ar-suites, n-recurrence, n-sommes]
  notions: [suite, limite-suite]
  page_enonce: 4
  page_corrige: 15
  enonce: |
    On considère la suite $(u_n)$ définie par $u_0 = 5$ et, pour tout entier $n$, $3u_{n+1} = u_n + 4$.

    **1.** Calculer $u_1$ et $u_2$.

    **2.** Démontrer que, pour tout entier $n$, $u_n \geqslant 2$.

    **3.** Montrer que $(u_n)$ est une suite décroissante.

    **4.** Montrer que la suite $(u_n)$ est convergente et déterminer sa limite.

    **5.** On pose pour tout entier $n$, $v_n = u_n - 2$.
    Montrer que $(v_n)$ est une suite géométrique.
    En déduire l'expression de $v_n$ en fonction de $n$.

    **6.** Soit les deux suites :
    $$S_n = \sum_{k=0}^{n} v_k \qquad T_n = \sum_{k=0}^{n} u_k$$
    Déterminer l'expression de $S_n$ et de $T_n$ en fonction de $n$.

    **7.** Déterminer les limites des deux suites ci-dessus.
  corrige: |
    La relation de récurrence s'écrit $u_{n+1} = \dfrac{u_n + 4}{3}$.

    **1.** On applique cette relation :
    $$\boxed{u_1 = \frac{5+4}{3} = 3 \qquad \text{et} \qquad u_2 = \frac{3+4}{3} = \frac73}$$

    **2.** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } u_n \geqslant 2 \text{ »}$$
    **Initialisation :** Pour $n = 0$ : $u_0 = 5 \geqslant 2$. Donc $P_0$ est vraie.
    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $u_k \geqslant 2$. Alors :
    $$u_k \geqslant 2 \implies u_k + 4 \geqslant 6 \implies \frac{u_k + 4}{3} \geqslant 2$$
    autrement dit $u_{k+1} \geqslant 2$, ce qui prouve $P_{k+1}$.
    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N,\ u_n \geqslant 2}$

    **3.** Pour tout $n \in \mathbb N$ :
    $$u_{n+1} - u_n = \frac{u_n + 4}{3} - u_n = \frac{u_n + 4 - 3u_n}{3} = \frac{4 - 2u_n}{3} = \frac{2\left(2 - u_n\right)}{3}$$
    Or $u_n \geqslant 2$ d'après la question 2., donc $2 - u_n \leqslant 0$ et ainsi $u_{n+1} - u_n \leqslant 0$ :
    $$\boxed{(u_n) \text{ est décroissante}}$$

    **4.** La suite est décroissante et minorée par $2$ : d'après le théorème de convergence monotone, elle converge vers un réel $\ell$. En passant à la limite dans la relation de récurrence :
    $$\ell = \frac{\ell + 4}{3} \iff 3\ell = \ell + 4 \iff \ell = 2$$
    $$\boxed{(u_n) \text{ converge et } \lim_{n\to+\infty} u_n = 2}$$

    **5.** Pour tout $n \in \mathbb N$ :
    $$v_{n+1} = u_{n+1} - 2 = \frac{u_n + 4}{3} - 2 = \frac{u_n - 2}{3} = \frac13 v_n$$
    $$\boxed{(v_n) \text{ est géométrique de raison } \frac13 \text{ et } v_n = 3\left(\frac13\right)^n}$$
    (le premier terme valant $v_0 = u_0 - 2 = 3$).

    **6.** La somme $S_n$ est celle des $n+1$ premiers termes d'une suite géométrique de raison $\dfrac13 \neq 1$ :
    $$S_n = v_0 \times \frac{1 - \left(\frac13\right)^{n+1}}{1 - \frac13} = 3 \times \frac32 \left(1 - \left(\frac13\right)^{n+1}\right)$$
    De plus, comme $u_k = v_k + 2$ pour tout $k$ :
    $$T_n = \sum_{k=0}^{n} u_k = \sum_{k=0}^{n} \left(v_k + 2\right) = S_n + 2(n+1)$$
    $$\boxed{S_n = \frac92 \left(1 - \left(\frac13\right)^{n+1}\right) \qquad \text{et} \qquad T_n = \frac92 \left(1 - \left(\frac13\right)^{n+1}\right) + 2n + 2}$$

    **7.** Comme $-1 < \dfrac13 < 1$, on a $\lim_{n\to+\infty} \left(\dfrac13\right)^{n+1} = 0$, donc $S_n$ converge, tandis que le terme $2n+2$ tend vers $+\infty$ :
    $$\boxed{\lim_{n\to+\infty} S_n = \frac92 \qquad \text{et} \qquad \lim_{n\to+\infty} T_n = +\infty}$$
