  enonce: |
    Soit $(u_n)$ la suite définie par $u_0 = 2$ et pour tout $n \in \mathbb N$, $u_{n+1} = 3u_n$.

    **1.** À l'aide de la calculatrice, conjecturer la limite de la suite $(u_n)$.

    **2.** On veut déterminer le plus petit entier naturel $n$, tel que $u_n > 1000$.

    **(a)** Recopier et compléter le programme en Python suivant pour qu'il réponde au problème.

    ```python
    n = 0
    u = ...
    while ... :
            u = ...
            n = ...
    print (...)
    ```

    **(b)** Déterminer cet entier à l'aide de la calculatrice.
  corrige: |
    **1.** La suite est géométrique de raison 3 et de premier terme 2, donc $u_n = 2 \times 3^n$. Les premiers termes (2, 6, 18, 54, …) augmentent très rapidement :
    $$\boxed{\text{On conjecture que } \lim_{n \to +\infty} u_n = +\infty}$$

    **2.** **(a)** On complète le programme de la façon suivante :

    ```python
    n = 0
    u = 2
    while u <= 1000 :
        u = 3*u
        n = n+1
    print(n)
    ```

    **(b)** On calcule les termes successifs : $u_5 = 2 \times 3^5 = 486$ et $u_6 = 2 \times 3^6 = 1458$. Le plus petit entier cherché est donc :
    $$\boxed{n = 6}$$
