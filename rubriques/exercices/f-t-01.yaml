  corrige: |
    **1.** La fonction $f$ est dérivable sur $[0\,;+\infty[$ comme quotient de fonctions dérivables dont le dénominateur ne s'annule pas, et pour tout $x \geqslant 0$ :
    $$f'(x) = \frac{3\left(1 + 2x\right) - 3x \times 2}{\left(1 + 2x\right)^2} = \frac{3 + 6x - 6x}{\left(1 + 2x\right)^2} = \frac{3}{\left(1 + 2x\right)^2}$$
    Ce quotient est strictement positif, donc :
    $$\boxed{f \text{ est croissante sur } [0\,;+\infty[}$$

    **2.** **(a)** On applique la relation de récurrence :
    $$u_1 = \frac{3 \times \frac12}{1 + 2 \times \frac12} = \frac{\frac32}{2} = \frac34 \qquad ; \qquad u_2 = \frac{3 \times \frac34}{1 + 2 \times \frac34} = \frac{\frac94}{\frac52} = \frac{9}{10}$$
    $$\boxed{u_1 = \frac34 \qquad \text{et} \qquad u_2 = \frac{9}{10}}$$

    **(b)** Démontrons par récurrence la propriété suivante :
    $$\forall n \in \mathbb N, \quad P_n : \text{« } 0 < u_n < 1 \text{ »}$$
    **Initialisation :** Pour $n = 0$ : $u_0 = \dfrac12$ et $0 < \dfrac12 < 1$. Donc $P_0$ est vraie.
    **Hérédité :** Soit $k \in \mathbb N$. Supposons que $0 < u_k < 1$. La fonction $f$ étant croissante sur $[0\,;+\infty[$ d'après la question 1., on peut l'appliquer à chaque membre :
    $$0 < u_k < 1 \implies f(0) < f(u_k) < f(1) \implies 0 < u_{k+1} < 1$$
    puisque $f(0) = 0$ et $f(1) = \dfrac33 = 1$. Ceci prouve $P_{k+1}$.
    **Conclusion :** Par principe de récurrence : $\boxed{\forall n \in \mathbb N,\ 0 < u_n < 1}$

    **3.** **(a)** Pour tout $n \in \mathbb N$ :
    $$\begin{aligned} u_{n+1} - u_n &= \frac{3u_n}{1 + 2u_n} - u_n = \frac{3u_n - u_n\left(1 + 2u_n\right)}{1 + 2u_n} \\ &= \frac{2u_n - 2u_n^2}{1 + 2u_n} = \frac{2u_n\left(1 - u_n\right)}{1 + 2u_n} \end{aligned}$$
    $$\boxed{\forall n \in \mathbb N,\ u_{n+1} - u_n = \frac{2u_n\left(1 - u_n\right)}{1 + 2u_n}}$$

    **(b)** D'après la question 2.b), $0 < u_n < 1$, donc $2u_n > 0$, $1 - u_n > 0$ et $1 + 2u_n > 0$ : le quotient est strictement positif.
    $$\boxed{(u_n) \text{ est croissante}}$$

    **(c)** La suite est croissante et majorée par $1$ : d'après le théorème de convergence monotone,
    $$\boxed{(u_n) \text{ converge}}$$

    **4.** **(a)** Comme $0 < u_n < 1$, le quotient $v_n$ est bien défini. On calcule d'abord :
    $$1 - u_{n+1} = 1 - \frac{3u_n}{1 + 2u_n} = \frac{1 + 2u_n - 3u_n}{1 + 2u_n} = \frac{1 - u_n}{1 + 2u_n}$$
    Ainsi, en formant le quotient, les dénominateurs se simplifient :
    $$v_{n+1} = \frac{u_{n+1}}{1 - u_{n+1}} = \frac{\frac{3u_n}{1 + 2u_n}}{\frac{1 - u_n}{1 + 2u_n}} = \frac{3u_n}{1 - u_n} = 3v_n$$
    $$\boxed{(v_n) \text{ est géométrique de raison } 3}$$

    **(b)** Le premier terme vaut $v_0 = \dfrac{\frac12}{1 - \frac12} = 1$, d'où :
    $$\boxed{\forall n \in \mathbb N,\ v_n = 3^n}$$

    **(c)** On isole $u_n$ dans la relation définissant $v_n$ :
    $$v_n = \frac{u_n}{1 - u_n} \iff v_n\left(1 - u_n\right) = u_n \iff v_n = u_n\left(1 + v_n\right) \iff u_n = \frac{v_n}{1 + v_n}$$
    $$\boxed{\forall n \in \mathbb N,\ u_n = \frac{3^n}{3^n + 1}}$$

    **(d)** On factorise par $3^n$ au numérateur et au dénominateur :
    $$u_n = \frac{3^n}{3^n\left(1 + \frac{1}{3^n}\right)} = \frac{1}{1 + \left(\frac13\right)^n}$$
    Or $-1 < \dfrac13 < 1$, donc $\displaystyle\lim_{n\to+\infty} \left(\frac13\right)^n = 0$ et le dénominateur tend vers $1$ :
    $$\boxed{\lim_{n\to+\infty} u_n = 1}$$

    **5.** **(a)** La fonction renvoie le plus petit entier $n$ tel que $u_n \geqslant 1 - 10^{-2} = 0{,}99$. Or, d'après la question 4.c) :
    $$\frac{3^n}{3^n + 1} \geqslant 0{,}99 \iff 3^n \geqslant 0{,}99 \times 3^n + 0{,}99 \iff 0{,}01 \times 3^n \geqslant 0{,}99 \iff 3^n \geqslant 99$$
    Or $3^4 = 81$ et $3^5 = 243$, donc la console affiche :
    $$\boxed{\texttt{limite(2)} \text{ renvoie } 5}$$

    **(b)** Mathématiquement, oui : pour tout entier $p$, on a $1 - u_n = \dfrac{1}{3^n + 1}$, qui tend vers $0$, donc il existe toujours un rang à partir duquel $u_n \geqslant 1 - 10^{-p}$, et la boucle s'arrête.
    $$\boxed{\text{La boucle s'arrête pour toute valeur de } p}$$
    En pratique cependant, la précision des nombres flottants est limitée informatiquement : pour $p$ trop grand (de l'ordre de $16$), la valeur $1 - 10^{-p}$ est arrondie à $1$, alors que $u$ reste strictement inférieur à $1$ : la boucle ne s'arrêterait alors jamais.
