  enonce: |
    Soit $(v_n)$ la suite définie pour tout $n \in \mathbb N$, $v_n = \dfrac{1}{2n+1}$.

    **1.** À l'aide de la calculatrice, conjecturer la limite de la suite $(v_n)$.

    **2.** On veut déterminer le plus petit entier naturel $n$, tel que $v_n < 0{,}001$.

    **(a)** Recopier et compléter le programme en Python ci-contre pour qu'il réponde au problème.

    ```python
    n = 0
    v = ...
    while ... :
            n = ...
            v = ...
    print (...)
    ```

    **(b)** Déterminer cet entier à l'aide de la calculatrice.
  corrige: |
    **1.** Les premiers termes $\left(1\,;\frac13\,;\frac15\,;\ldots\right)$ se rapprochent de $0$ :
    $$\boxed{\text{On conjecture que } \lim_{n\to+\infty} v_n = 0}$$

    **2.** **(a)** On complète le programme de la façon suivante :

    ```python
    n = 0
    v = 1
    while v >= 0.001 :
        n = n+1
        v = 1/(2*n+1)
    print(n)
    ```

    **(b)** On résout directement l'inéquation :
    $$\frac{1}{2n+1} < 0{,}001 \iff 2n+1 > 1000 \iff n > 499{,}5$$
    Le plus petit entier cherché est donc :
    $$\boxed{n = 500}$$
- id: t-01-27
  feuille: f-t-01
  numero: 27
  partie: Limites de suites
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [suite définie par récurrence, suite auxiliaire, suite géométrique, limite d'une suite géométrique, limite finie]
