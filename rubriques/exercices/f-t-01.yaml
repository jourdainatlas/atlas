  page_enonce: 4
  page_corrige: 14
  enonce: |
    $(u_n)$ est la suite définie par $u_0 = 3$ et, pour tout entier $n$, $u_{n+1} = \dfrac{3u_n}{3 + 2u_n}$.

    Pour tout entier $n$, on pose $v_n = \dfrac{3}{u_n}$.

    **1.** Démontrer que $(v_n)$ est une suite arithmétique.

    **2.** Déterminer la limite de la suite $(u_n)$.
  corrige: |
    **1.** On montre d'abord, comme à l'exercice 4, que $u_n > 0$ pour tout $n$ (récurrence immédiate à partir de $u_0 = 3 > 0$), ce qui garantit que $v_n$ est bien défini. Alors, pour tout $n$ :
    $$\begin{aligned} v_{n+1} &= \frac{3}{u_{n+1}} = \frac{3}{\frac{3u_n}{3 + 2u_n}} \\ &= \frac{3\,(3 + 2u_n)}{3u_n} = \frac{3 + 2u_n}{u_n} \\ &= \frac{3}{u_n} + 2 = v_n + 2 \end{aligned}$$
    La différence entre deux termes consécutifs étant constante :
    $$\boxed{(v_n) \text{ est arithmétique de raison 2 et de premier terme } v_0 = 1}$$

    **2.** On en déduit que $v_n = 1 + 2n$, puis que $u_n = \dfrac{3}{v_n}$ :
    $$u_n = \frac{3}{2n + 1}$$
    Or $\lim\limits_{n \to +\infty} (2n + 1) = +\infty$, donc par quotient :
    $$\boxed{\lim_{n \to +\infty} u_n = 0}$$
- id: t-01-25
  feuille: f-t-01
