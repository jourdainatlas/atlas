  source: "TD 7 (Sainte-Geneviève), exercice 42 ; Feuille d'exercices #02 (Prost), exercice 3 ; BibM@th, Intégrales impropres, exercice 12"
  page_enonce: 4
  page_corrige: 11
  enonce: |
    Pour $(n, p) \in \mathbb{N}^{2}$, justifier l'existence et calculer $\displaystyle a_{n, p} = \int_{0}^{1} x^{n}(\ln x)^{p}\,\mathrm{d} x$. En déduire $\displaystyle \int_{0}^{1} (\ln x)^{p}\,\mathrm{d} x$, et comparer avec la formule d'Euler $\displaystyle n! = \int_{0}^{1} (-\ln x)^{n}\,\mathrm{d} x$ de l'introduction du cours.
  corrige: |
    On établit une relation de récurrence sur $p$ par intégration par parties.

    **Existence.** En $0$, $x^{n}|\ln x|^{p} = o\big(x^{-1/2}\big)$, car $x^{1/2}|\ln x|^{p} \to 0$.

    **Récurrence.** Pour $p \geqslant 1$, avec $u = (\ln x)^{p}$ et $v = \frac{x^{n + 1}}{n + 1}$, le crochet $\frac{x^{n + 1}(\ln x)^{p}}{n + 1}$ tend vers $0$ en $0$ et vaut $0$ en $1$ : 
    $$a_{n, p} = -\frac{p}{n + 1}a_{n, p - 1}, \qquad a_{n, 0} = \frac{1}{n + 1}, \qquad \boxed{a_{n, p} = \frac{(-1)^{p}p!}{(n + 1)^{p + 1}}}$$

    Pour $n = 0$, $\int_{0}^{1} (\ln x)^{p}\,\mathrm{d} x = (-1)^{p}p!$, soit $\int_{0}^{1} (-\ln x)^{p}\,\mathrm{d} x = p!$ : c'est la formule d'Euler de l'introduction du cours.
- id: "mp-12-14"
  feuille: "f-mp-12"
  numero: 14
  partie: "Calcul des intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [calcul des intégrales, "nature d'une intégrale"]
  noeuds: [ri-proprietes, ri-integrable]
  notions: [integrale-convergente]
  source: "TD 7 (Sainte-Geneviève), exercices 11, 12 (i) et 43 ; Feuille d'exercices #02 (Prost), exercice 24 ; BibM@th, Intégrales impropres, exercices 13 et 14"
  page_enonce: 4
  page_corrige: 12
  enonce: |
    *Symétries.*

    **1.** Soit $\displaystyle I = \int_{0}^{+\infty} \frac{\mathrm{d} x}{1 + x^{3}}$. Justifier la convergence, montrer que $\displaystyle I = \int_{0}^{+\infty} \frac{x\,\mathrm{d} x}{1 + x^{3}}$, et en déduire la valeur de $I$.

    **2.** Soit $a > 0$. Montrer que $\displaystyle \int_{0}^{+\infty} \frac{\ln t}{a^{2} + t^{2}}\,\mathrm{d} t = \frac{\pi\ln a}{2a}$.

    **3.** Pour $a \in \mathbb{R}$, on pose $\displaystyle F(a) = \int_{0}^{+\infty} \frac{\mathrm{d} x}{(1 + x^{2})(1 + x^{a})}$. Montrer que $F(a)$ existe, puis que 
    $$F(a) = \int_{0}^{+\infty} \frac{x^{a}\,\mathrm{d} x}{(1 + x^{2})(1 + x^{a})},$$
     et en déduire que $F$ est constante. Calculer enfin $\displaystyle \int_{0}^{\pi/2} \frac{\mathrm{d}\theta}{1 + (\tan\theta)^{a}}$.

    **4.** Montrer que $\displaystyle \int_{0}^{+\infty} \frac{\sqrt{t}\,\ln t}{(1 + t)^{2}}\,\mathrm{d} t = \pi$.
  corrige: |
    Chaque calcul utilise une symétrie : le changement de variable $x \mapsto \frac{1}{x}$, qui échange $]0, 1]$ et $[1, +\infty[$, transforme l'intégrale en une autre expression, que l'on combine avec la première.

    **1.** L'intégrande est équivalente à $\frac{1}{x^{3}}$ en $+\infty$. Le changement de variable $x = \frac{1}{u}$ donne 
    $$I = \int_{0}^{+\infty} \frac{1}{1 + u^{-3}}\cdot\frac{\mathrm{d} u}{u^{2}} = \int_{0}^{+\infty} \frac{u\,\mathrm{d} u}{1 + u^{3}}.$$
     En ajoutant, 
    $$2I = \int_{0}^{+\infty} \frac{1 + x}{1 + x^{3}}\,\mathrm{d} x = \int_{0}^{+\infty} \frac{\mathrm{d} x}{x^{2} - x + 1} = \frac{2}{\sqrt{3}}\Big[\operatorname{Arctan}\frac{2x - 1}{\sqrt{3}}\Big]_{0}^{+\infty} = \frac{2}{\sqrt{3}}\Big(\frac{\pi}{2} + \frac{\pi}{6}\Big), \qquad \boxed{I = \frac{2\pi}{3\sqrt{3}}}$$
     La symétrie a fait disparaître le pôle $-1$ : c'est tout l'intérêt de la méthode.

    **2.** Le changement de variable $t = au$ et l'égalité $\int_{0}^{+\infty} \frac{\ln u}{1 + u^{2}}\,\mathrm{d} u = 0$ (section 12.4) donnent 
    $$\int_{0}^{+\infty} \frac{\ln t}{a^{2} + t^{2}}\,\mathrm{d} t = \frac{1}{a}\int_{0}^{+\infty} \frac{\ln a + \ln u}{1 + u^{2}}\,\mathrm{d} u = \boxed{\frac{\pi\ln a}{2a}}$$

    **3.** L'intégrande est positive et majorée par $\frac{1}{1 + x^{2}}$ : $F(a)$ existe. Le changement de variable $x = \frac{1}{u}$ donne 
    $$F(a) = \int_{0}^{+\infty} \frac{1}{(1 + u^{-2})(1 + u^{-a})}\cdot\frac{\mathrm{d} u}{u^{2}} = \int_{0}^{+\infty} \frac{u^{a}\,\mathrm{d} u}{(1 + u^{2})(1 + u^{a})}.$$
     En ajoutant, $2F(a) = \int_{0}^{+\infty} \frac{\mathrm{d} x}{1 + x^{2}} = \frac{\pi}{2}$. Enfin, $x = \tan\theta$ donne l'intégrale demandée. 
    $$\boxed{F(a) = \frac{\pi}{4}, \qquad \int_{0}^{\pi/2} \frac{\mathrm{d}\theta}{1 + (\tan\theta)^{a}} = \frac{\pi}{4}}$$

    **4.** L'intégrande est équivalente à $\sqrt{t}\ln t$ en $0$, et à $\frac{\ln t}{t^{3/2}}$ en $+\infty$. Le changement de variable $t = u^{2}$ donne $4\int_{0}^{+\infty} \frac{u^{2}\ln u}{(1 + u^{2})^{2}}\,\mathrm{d} u$. On intègre par parties en écrivant $\frac{u}{(1 + u^{2})^{2}}$ comme la dérivée de $-\frac{1}{2(1 + u^{2})}$ ; le crochet $-\frac{u\ln u}{2(1 + u^{2})}$ tend vers $0$ aux deux bornes : 
    $$4\int_{0}^{+\infty} \frac{u^{2}\ln u}{(1 + u^{2})^{2}}\,\mathrm{d} u = 2\int_{0}^{+\infty} \frac{1 + \ln u}{1 + u^{2}}\,\mathrm{d} u = 2\Big(\frac{\pi}{2} + 0\Big), \qquad \boxed{\pi}$$
