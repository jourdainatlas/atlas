  enonce: |
    *Fonctions à variation régulière.* Soit $f : [1, +\infty[ \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, ne s'annulant pas au voisinage de $+\infty$, et $\lambda \in \mathbb{R} \setminus \{0, -1\}$ tel que $\displaystyle \frac{f'(x)}{f(x)} \underset{x \to +\infty}{\sim} \frac{\lambda}{x}$.

    **1.** Montrer que $f$ est de signe constant au voisinage de $+\infty$, puis que $\ln|f(x)| \sim \lambda\ln x$. Donner un exemple de telle fonction qui n'est pas une puissance de $x$.

    **2.** On suppose $\lambda > -1$. Montrer que $\displaystyle \int_{1}^{+\infty} f$ diverge et que $\displaystyle \int_{1}^{x} f \underset{x \to +\infty}{\sim} \frac{xf(x)}{\lambda + 1}$.

    **3.** On suppose $\lambda < -1$. Montrer que $\displaystyle \int_{1}^{+\infty} f$ converge et que $\displaystyle \int_{x}^{+\infty} f \underset{x \to +\infty}{\sim} -\frac{xf(x)}{\lambda + 1}$.

    **4.** Que peut-on dire de la nature de $\displaystyle \int_{1}^{+\infty} f$ lorsque $\lambda = -1$ ?
  corrige: |
    L'idée est de dériver $xf(x)$ : $(xf)' = f\big(1 + \frac{xf'}{f}\big) \sim (1 + \lambda)f$, ce qui ramène l'intégrale de $f$ à celle d'une dérivée, par le théorème 7.

    **1.** La fonction $f$ est continue et ne s'annule pas sur un intervalle $[A, +\infty[$ : par le théorème des valeurs intermédiaires, elle y garde un signe constant ; quitte à changer $f$ en $-f$, elle est positive. La dérivée de $\ln|f|$ est $\frac{f'}{f} \sim \frac{\lambda}{x}$, de signe constant et non intégrable : le théorème 7 (ii) donne $\ln f(x) - \ln f(A) \sim \lambda\ln x$, donc $\ln f(x) \sim \lambda\ln x$. Exemple : $f(x) = x^{\lambda}\ln(1 + x)$, pour laquelle $\frac{f'}{f} = \frac{\lambda}{x} + \frac{1}{(1 + x)\ln(1 + x)} \sim \frac{\lambda}{x}$.

    **2.** Soit $\mu \in ]-1, \lambda[$. Par la question 1, $\ln f(x) \geqslant \mu\ln x$ pour $x$ assez grand, soit $f(x) \geqslant x^{\mu}$, et l'intégrale diverge. Ensuite $(xf)' = f + xf' = f\big(1 + \frac{xf'}{f}\big) \sim (1 + \lambda)f$, avec $(1 + \lambda)f$ positive et non intégrable ; le théorème 7 (ii) donne 
    $$xf(x) - Af(A) = \int_{A}^{x} (tf)' \sim (1 + \lambda)\int_{A}^{x} f, \qquad \boxed{\int_{1}^{x} f \underset{x \to +\infty}{\sim} \frac{xf(x)}{\lambda + 1}}$$
     puisque $\int_{A}^{x} f \to +\infty$ rend les constantes négligeables.

    **3.** Soit $\mu \in ]\lambda, -1[$ : $f(x) \leqslant x^{\mu}$ pour $x$ assez grand, donc $f$ est intégrable, et $xf(x) \leqslant x^{\mu + 1} \to 0$. La fonction $-(1 + \lambda)f$ est positive et intégrable, et le théorème 7 (i) donne 
    $$-xf(x) = \int_{x}^{+\infty} (tf)' \sim (1 + \lambda)\int_{x}^{+\infty} f, \qquad \boxed{\int_{x}^{+\infty} f \underset{x \to +\infty}{\sim} -\frac{xf(x)}{\lambda + 1}}$$

    **4.** On ne peut rien dire : $f(x) = \frac{1}{x}$ et $f(x) = \frac{1}{x\ln^{2}x}$ vérifient toutes deux $\frac{f'}{f} \sim -\frac{1}{x}$, et la première a une intégrale divergente, la seconde convergente (exercice 3). 
    $$\boxed{\text{cas douteux}}$$
