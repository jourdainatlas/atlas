  source: "TD 7 (Sainte-Geneviève), exercices 19 et 20 ; Feuille d'exercices #02 (Prost), exercice 26"
  page_enonce: 5
  page_corrige: 13
  enonce: |
    *Fractions rationnelles.*

    **1.** Calculer $\displaystyle \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{x^{2} + x + 1}$ et $\displaystyle \int_{-\infty}^{+\infty} \frac{x(2x + 1)}{(x^{2} + x + 1)^{2}}\,\mathrm{d} x$, puis en déduire $\displaystyle \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{(x^{2} + x + 1)^{2}}$.

    **2.** Justifier l'existence et calculer $\displaystyle \int_{-\infty}^{+\infty} \frac{\mathrm{d} t}{(1 + t^{2})(1 + \mathrm{i} t)}$.

    **3.** Soit $n \geqslant 2$. Justifier l'existence et calculer $\displaystyle \int_{0}^{+\infty} \frac{\mathrm{d} t}{(t + 1)(t + 2)\cdots(t + n)}$. Pourquoi faut-il $n \geqslant 2$ ?
  corrige: |
    On utilise la mise sous forme canonique, une intégration par parties et la décomposition en éléments simples ; pour la dernière question, c'est la somme nulle des coefficients qui assure la convergence.

    **1.** Avec $Q = X^{2} + X + 1 = \big(X + \frac{1}{2}\big)^{2} + \frac{3}{4}$, $\int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{Q} = \frac{2}{\sqrt{3}}\big[\operatorname{Arctan}\frac{2x + 1}{\sqrt{3}}\big]_{-\infty}^{+\infty} = \frac{2\pi}{\sqrt{3}}$. Comme $\frac{2x + 1}{Q^{2}}$ est la dérivée de $-\frac{1}{Q}$, une intégration par parties, dont le crochet $-\frac{x}{Q}$ tend vers $0$ en $\pm\infty$, donne 
    $$\int_{-\infty}^{+\infty} \frac{x(2x + 1)}{Q^{2}}\,\mathrm{d} x = \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{Q} = \frac{2\pi}{\sqrt{3}}.$$
     Enfin $x(2x + 1) = 2Q - (x + 2)$ et $x + 2 = \frac{1}{2}(2x + 1) + \frac{3}{2}$, où $\int \frac{2x + 1}{Q^{2}} = 0$, ce qui donne 
    $$\frac{3}{2}\int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{Q^{2}} = 2\cdot\frac{2\pi}{\sqrt{3}} - \frac{2\pi}{\sqrt{3}}.$$

    $$\boxed{\int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{x^{2} + x + 1} = \frac{2\pi}{\sqrt{3}}, \qquad \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{(x^{2} + x + 1)^{2}} = \frac{4\pi}{3\sqrt{3}}}$$

    **2.** On a $\big|\frac{1}{(1 + t^{2})(1 + \mathrm{i} t)}\big| = \frac{1}{(1 + t^{2})^{3/2}}$, intégrable. En multipliant par la quantité conjuguée, l'intégrande vaut $\frac{1 - \mathrm{i} t}{(1 + t^{2})^{2}}$ ; la partie imaginaire est impaire et intégrable, d'intégrale nulle, et le changement de variable $t = \tan\theta$ donne $\int_{-\infty}^{+\infty} \frac{\mathrm{d} t}{(1 + t^{2})^{2}} = \int_{-\pi/2}^{\pi/2} \cos^{2}\theta\,\mathrm{d}\theta = \frac{\pi}{2}$. 
    $$\boxed{\frac{\pi}{2}}$$

    **3.** La fraction $\frac{1}{(X + 1)\cdots(X + n)}$ a des pôles simples, de coefficients 
    $$a_{k} = \prod_{j \neq k} \frac{1}{j - k} = \frac{(-1)^{k - 1}}{(k - 1)!(n - k)!}.$$
     Pour $n \geqslant 2$, l'intégrande est en $O\big(\frac{1}{t^{2}}\big)$, et $\sum a_{k} = 0$ (le coefficient de $\frac{1}{X}$ dans le développement à l'infini est nul, la fraction étant en $O(X^{-2})$). Alors 
    $$\int_{0}^{X} \sum_{k = 1}^{n} \frac{a_{k}}{t + k}\,\mathrm{d} t = \sum_{k = 1}^{n} a_{k}\ln(X + k) - \sum_{k = 1}^{n} a_{k}\ln k = \sum_{k = 1}^{n} a_{k}\ln\Big(1 + \frac{k}{X}\Big) - \sum_{k = 1}^{n} a_{k}\ln k,$$
     en utilisant $\sum a_{k}\ln X = 0$. Le premier terme tend vers $0$ : 
    $$\boxed{\int_{0}^{+\infty} \frac{\mathrm{d} t}{(t + 1)\cdots(t + n)} = \sum_{k = 1}^{n} \frac{(-1)^{k}\ln k}{(k - 1)!(n - k)!}}$$
     Pour $n = 2$, on trouve $\ln 2$ ; les valeurs pour $n \leqslant 5$ ont été contrôlées numériquement. Pour $n = 1$, l'intégrande est équivalente à $\frac{1}{t}$, et l'intégrale diverge.

    *Piège.* Il ne faut pas écrire l'intégrale comme $\sum a_{k}\int_{0}^{+\infty} \frac{\mathrm{d} t}{t + k}$ : chacune de ces intégrales diverge. C'est seulement après regroupement sur un segment que les divergences logarithmiques se compensent.
- id: "mp-12-17"
  feuille: "f-mp-12"
  numero: 17
  partie: "Calcul des intégrales"
