  source: "TD 7 (Sainte-Geneviève), exercice 88 (X)"
  page_enonce: 10
  page_corrige: 27
  enonce: |
    *Inégalité de Hardy.* Soit $f : [0, +\infty[ \to \mathbb{R}$ continue et de carré intégrable, et $\displaystyle F(x) = \int_{0}^{x} f$. On pose $g(x) = \frac{F(x)}{x}$ pour $x > 0$.

    **1.** Montrer que $g$ se prolonge par continuité en $0$.

    **2.** Pour $0 < a < b$, montrer que $\displaystyle \int_{a}^{b} g^{2} \leqslant \frac{F(a)^{2}}{a} + 2\int_{a}^{b} fg$.

    **3.** En déduire que $g$ est de carré intégrable sur $]0, +\infty[$, et que $\displaystyle \int_{0}^{+\infty} g^{2} \leqslant 4\int_{0}^{+\infty} f^{2}$.
  corrige: |
    On intègre $g^{2} = \frac{F^{2}}{x^{2}}$ par parties pour faire apparaître le produit $fg$, que l'on majore par l'inégalité de Cauchy-Schwarz.

    **1.** Comme $F$ est de classe $\mathcal{C}^{1}$ et $F(0) = 0$, $g(x) = \frac{F(x) - F(0)}{x} \to F'(0) = f(0)$.

    **2.** Par parties sur $[a, b]$, avec $\frac{1}{x^{2}} = \big(-\frac{1}{x}\big)'$ et $(F^{2})' = 2fF$ : 
    $$\int_{a}^{b} g^{2} = \Big[-\frac{F^{2}}{x}\Big]_{a}^{b} + 2\int_{a}^{b} \frac{fF}{x} = \frac{F(a)^{2}}{a} - \frac{F(b)^{2}}{b} + 2\int_{a}^{b} fg \leqslant \frac{F(a)^{2}}{a} + 2\int_{a}^{b} fg.$$

    **3.** Comme $\frac{F(a)^{2}}{a} = ag(a)^{2} \to 0$ quand $a \to 0$, et par l'inégalité de Cauchy-Schwarz sur $[0, b]$ : 
    $$\int_{0}^{b} g^{2} \leqslant 2\Big(\int_{0}^{b} f^{2}\Big)^{1/2}\Big(\int_{0}^{b} g^{2}\Big)^{1/2}, \qquad\text{d'où}\qquad \Big(\int_{0}^{b} g^{2}\Big)^{1/2} \leqslant 2\Big(\int_{0}^{+\infty} f^{2}\Big)^{1/2}.$$
     Les intégrales partielles de $g^{2}$ sont majorées : 
    $$\boxed{\int_{0}^{+\infty} g^{2} \leqslant 4\int_{0}^{+\infty} f^{2}}$$

    *Commentaire.* La constante $4$ est optimale, sans être atteinte : les fonctions $x^{-1/2}$, qui réaliseraient l'égalité, ne sont pas de carré intégrable, mais des fonctions voisines s'en approchent autant qu'on veut.
