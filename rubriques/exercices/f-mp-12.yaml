  page_corrige: 12
  enonce: |
    Montrer que $\displaystyle \int_{0}^{\pi/2} \sqrt{\tan x}\,\mathrm{d} x$ converge et vaut $\frac{\pi}{\sqrt{2}}$. On pourra commencer par l'écrire comme la moitié de $\displaystyle \int_{0}^{\pi/2} \big(\sqrt{\tan x} + \sqrt{\cot x}\,\big)\mathrm{d} x$, où $\cot = \frac{1}{\tan}$.
  corrige: |
    On exploite la symétrie $x \mapsto \frac{\pi}{2} - x$, qui échange $\tan$ et $\cot$, puis un changement de variable qui rationalise le dénominateur.

    **Convergence.** En $\frac{\pi}{2}$, $\sqrt{\tan x} \sim \big(\frac{\pi}{2} - x\big)^{-1/2}$ (exercice 6 (f)).

    **Symétrie.** Le changement de variable $x \mapsto \frac{\pi}{2} - x$ montre que $I = \int_{0}^{\pi/2} \sqrt{\cot x}\,\mathrm{d} x$, d'où 
    $$2I = \int_{0}^{\pi/2} \frac{\sin x + \cos x}{\sqrt{\sin x\cos x}}\,\mathrm{d} x.$$

    **Calcul.** Avec $u = \sin x - \cos x$, bijection croissante de $]0, \frac{\pi}{2}[$ sur $]-1, 1[$, on a $\mathrm{d} u = (\cos x + \sin x)\,\mathrm{d} x$ et $u^{2} = 1 - 2\sin x\cos x$ : 
    $$2I = \int_{-1}^{1} \frac{\sqrt{2}\,\mathrm{d} u}{\sqrt{1 - u^{2}}} = \sqrt{2}\,\pi, \qquad \boxed{\int_{0}^{\pi/2} \sqrt{\tan x}\,\mathrm{d} x = \frac{\pi}{\sqrt{2}}}$$
- id: "mp-12-16"
  feuille: "f-mp-12"
  numero: 16
  partie: "Calcul des intégrales"
