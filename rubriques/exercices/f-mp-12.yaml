  source: "TD 7 (Sainte-Geneviève), exercices 93, 94, 97 et 98 (Mines) ; BibM@th, Intégrales impropres, exercices 31 et 33"
  page_enonce: 6
  page_corrige: 18
  enonce: |
    Donner un équivalent, quand $x \to +\infty$, des expressions suivantes. 
    $$\text{(a)} \ \int_{1}^{x} \frac{2^{t}}{t}\,\mathrm{d} t, \qquad \text{(b)} \ \int_{2}^{x} \frac{\mathrm{d} t}{(\ln t)^{\alpha}} \ (\alpha \in \mathbb{R}), \qquad \text{(c)} \ \int_{1}^{x} \frac{\ln t}{\sqrt{t}}\,\mathrm{d} t, \qquad \text{(d)} \ \int_{0}^{x} \frac{\mathrm{e}^{t}}{1 + t^{2}}\,\mathrm{d} t,$$

    $$\text{(e)} \ \int_{1}^{x} \frac{\operatorname{Arctan} t}{t}\,\mathrm{d} t, \qquad \text{(f)} \ \int_{x}^{+\infty} \frac{\mathrm{e}^{-t}}{\ln t}\,\mathrm{d} t, \qquad \text{(g)} \ \int_{x}^{+\infty} \frac{\mathrm{d} t}{\operatorname{ch}^{n}t} \ (n \in \mathbb{N}^{*}),$$

    $$\text{(h)} \ \int_{x}^{+\infty} \mathrm{e}^{-t^{4}}\,\mathrm{d} t, \qquad \text{(i)} \ \int_{0}^{x} \mathrm{e}^{t^{3}}\,\mathrm{d} t, \qquad \text{(j)} \ \int_{1}^{x} t^{t}\,\mathrm{d} t.$$
  corrige: |
    On applique la méthode du cours : on devine une fonction $\varphi$ explicite dont la dérivée est équivalente à l'intégrande, puis le théorème 7 (ii) pour une intégrale partielle divergente, ou (i) pour un reste.

    **(a)** $\varphi(t) = \frac{2^{t}}{t\ln 2}$ : $\varphi'(t) = \frac{2^{t}}{t} - \frac{2^{t}}{t^{2}\ln 2} \sim \frac{2^{t}}{t}$. 
    $$\boxed{\sim \frac{2^{x}}{x\ln 2}}$$

    **(b)** $\varphi(t) = \frac{t}{(\ln t)^{\alpha}}$ : $\varphi'(t) = \frac{1}{(\ln t)^{\alpha}} - \frac{\alpha}{(\ln t)^{\alpha + 1}} \sim \frac{1}{(\ln t)^{\alpha}}$, non intégrable (elle domine $\frac{1}{t}$). 
    $$\boxed{\sim \frac{x}{(\ln x)^{\alpha}}}$$

    **(c)** $\varphi(t) = 2\sqrt{t}\ln t$ : $\varphi'(t) = \frac{\ln t}{\sqrt{t}} + \frac{2}{\sqrt{t}} \sim \frac{\ln t}{\sqrt{t}}$. 
    $$\boxed{\sim 2\sqrt{x}\ln x}$$

    **(d)** $\varphi(t) = \frac{\mathrm{e}^{t}}{t^{2}}$ : $\varphi'(t) = \frac{\mathrm{e}^{t}}{t^{2}}\big(1 - \frac{2}{t}\big) \sim \frac{\mathrm{e}^{t}}{1 + t^{2}}$. 
    $$\boxed{\sim \frac{\mathrm{e}^{x}}{x^{2}}}$$

    **(e)** $\frac{\operatorname{Arctan} t}{t} \sim \frac{\pi}{2t}$, non intégrable. 
    $$\boxed{\sim \frac{\pi}{2}\ln x}$$

    **(f)** $\varphi(t) = \frac{\mathrm{e}^{-t}}{\ln t}$ : $-\varphi'(t) = \frac{\mathrm{e}^{-t}}{\ln t} + \frac{\mathrm{e}^{-t}}{t\ln^{2}t} \sim \frac{\mathrm{e}^{-t}}{\ln t}$, et $\int_{x}^{+\infty} (-\varphi') = \varphi(x)$. 
    $$\boxed{\sim \frac{\mathrm{e}^{-x}}{\ln x}}$$

    **(g)** $\frac{1}{\operatorname{ch}^{n}t} = \frac{2^{n}\mathrm{e}^{-nt}}{(1 + \mathrm{e}^{-2t})^{n}} \sim 2^{n}\mathrm{e}^{-nt}$, dont le reste vaut $\frac{2^{n}}{n}\mathrm{e}^{-nx}$. 
    $$\boxed{\sim \frac{2^{n}}{n}\mathrm{e}^{-nx}}$$

    **(h)** $\varphi(t) = \frac{\mathrm{e}^{-t^{4}}}{4t^{3}}$ : $-\varphi'(t) = \mathrm{e}^{-t^{4}}\big(1 + \frac{3}{4t^{4}}\big) \sim \mathrm{e}^{-t^{4}}$. 
    $$\boxed{\sim \frac{\mathrm{e}^{-x^{4}}}{4x^{3}}}$$

    **(i)** $\varphi(t) = \frac{\mathrm{e}^{t^{3}}}{3t^{2}}$ : $\varphi'(t) = \mathrm{e}^{t^{3}}\big(1 - \frac{2}{3t^{3}}\big) \sim \mathrm{e}^{t^{3}}$. 
    $$\boxed{\sim \frac{\mathrm{e}^{x^{3}}}{3x^{2}}}$$

    **(j)** $\varphi(t) = \frac{t^{t}}{\ln t}$ : $\varphi'(t) = t^{t}\frac{1 + \ln t}{\ln t} - \frac{t^{t}}{t\ln^{2}t} \sim t^{t}$. 
    $$\boxed{\sim \frac{x^{x}}{\ln x}}$$

    Dans les cas (a), (b), (c), (d), (i), (j), la fonction $\varphi'$ est positive au voisinage de $+\infty$ et non intégrable, puisque $\varphi$ tend vers $+\infty$ ; l'intégrale partielle de $\varphi'$ est $\varphi(x) - \varphi(x_{0})$, équivalente à $\varphi(x)$.

    *Piège.* En (j), le candidat naïf $t^{t}$, obtenu en « intégrant comme une exponentielle », est faux : la dérivée de $t^{t}$ est $t^{t}(1 + \ln t)$, et c'est le facteur $\ln t$ qu'il faut compenser. La convergence du rapport vers $1$ est très lente : il vaut environ $0{,}75$ pour $x = 20$.
- id: "mp-12-23"
  feuille: "f-mp-12"
  numero: 23
  partie: "Intégration des relations de comparaison"
