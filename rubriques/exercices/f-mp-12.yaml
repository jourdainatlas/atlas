  enonce: |
    Pour $x > 0$, on pose $\displaystyle f(x) = \int_{x}^{+\infty} \frac{\sin t}{t^{2}}\,\mathrm{d} t$.

    **1.** Montrer que $f$ est bien définie et de classe $\mathcal{C}^{1}$ sur $\mathbb{R}_{+}^{*}$.

    **2.** Montrer que $f(x) + \ln x$ a une limite finie quand $x \to 0^{+}$.

    **3.** Montrer que $\displaystyle f(x) = \frac{\cos x}{x^{2}} + O\Big(\frac{1}{x^{3}}\Big)$ quand $x \to +\infty$.

    **4.** Montrer que $\displaystyle \int_{0}^{+\infty} xf(x)\,\mathrm{d} x$ converge, et la calculer.
  corrige: |
    On combine la proposition 1 (v), une comparaison en $0$ et deux intégrations par parties en $+\infty$.

    **1.** Pour $x > 0$, $\big|\frac{\sin t}{t^{2}}\big| \leqslant \frac{1}{t^{2}}$, intégrable sur $[x, +\infty[$. Par la proposition 1 (v), $f$ est de classe $\mathcal{C}^{1}$, et $f'(x) = -\frac{\sin x}{x^{2}}$.

    **2.** Pour $x \in ]0, 1[$, comme $-\ln x = \int_{x}^{1} \frac{\mathrm{d} t}{t}$, 
    $$f(x) + \ln x = \int_{x}^{1} \frac{\sin t - t}{t^{2}}\,\mathrm{d} t + \int_{1}^{+\infty} \frac{\sin t}{t^{2}}\,\mathrm{d} t,$$
     et $\frac{\sin t - t}{t^{2}} \to 0$ en $0$ : l'intégrale est faussement généralisée. 
    $$\boxed{f(x) + \ln x \text{ a une limite finie en } 0^{+}}$$
     Numériquement, cette limite vaut $0{,}42278\ldots$, soit $1 - \gamma$.

    **3.** Deux intégrations par parties, comme à l'exercice 23, donnent 
    $$f(x) = \frac{\cos x}{x^{2}} - \frac{2\sin x}{x^{3}} + 6\int_{x}^{+\infty} \frac{\sin t}{t^{4}}\,\mathrm{d} t.$$

    $$\boxed{f(x) = \frac{\cos x}{x^{2}} + O\Big(\frac{1}{x^{3}}\Big)}$$

    **4.** En $0$, $xf(x) \sim -x\ln x \to 0$ ; en $+\infty$, $xf(x) = \frac{\cos x}{x} + O\big(\frac{1}{x^{2}}\big)$, dont l'intégrale converge. Par parties, sur $[\varepsilon, X]$, 
    $$\int_{\varepsilon}^{X} xf(x)\,\mathrm{d} x = \Big[\frac{x^{2}f(x)}{2}\Big]_{\varepsilon}^{X} + \frac{1}{2}\int_{\varepsilon}^{X} \sin x\,\mathrm{d} x = \frac{X^{2}f(X)}{2} - \frac{\varepsilon^{2}f(\varepsilon)}{2} + \frac{\cos\varepsilon - \cos X}{2}.$$
     Comme $\varepsilon^{2}f(\varepsilon) \to 0$ et $X^{2}f(X) = \cos X + O\big(\frac{1}{X}\big)$, les termes en $\cos X$ se compensent. 
    $$\boxed{\int_{0}^{+\infty} xf(x)\,\mathrm{d} x = \frac{1}{2}}$$
