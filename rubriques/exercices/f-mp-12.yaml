  source: "TD 7 (Sainte-Geneviève), exercice 44"
  page_enonce: 3
  page_corrige: 9
  enonce: |
    *Les fonctions Gamma et Bêta.*

    **1.** Calculer $\Gamma\big(n + \frac{1}{2}\big)$ pour $n \in \mathbb{N}$, à l'aide de $\Gamma\big(\frac{1}{2}\big) = \sqrt{\pi}$ (cours, théorème 6).

    **2.** Pour $x$, $y$ réels, on pose $\displaystyle B(x, y) = \int_{0}^{1} t^{x - 1}(1 - t)^{y - 1}\,\mathrm{d} t$. Montrer que cette intégrale converge si et seulement si $x > 0$ et $y > 0$.

    **3.** Soit $x$, $y > 0$. Montrer que $B(x, y) = B(y, x)$, que $B(x, y) = B(x + 1, y) + B(x, y + 1)$, et que $xB(x, y + 1) = yB(x + 1, y)$. En déduire que $\displaystyle B(x + 1, y) = \frac{x}{x + y}B(x, y)$.

    **4.** En déduire, pour $n \in \mathbb{N}$ et $x > 0$, que $\displaystyle B(n + 1, x) = \frac{n!}{x(x + 1)\cdots(x + n)}$.

    **5.** Calculer $B\big(\frac{1}{2}, \frac{1}{2}\big)$, puis $B\big(n + \frac{1}{2}, m + \frac{1}{2}\big)$ pour $n$, $m \in \mathbb{N}$. Vérifier sur ces valeurs la relation $\displaystyle B(x, y) = \frac{\Gamma(x)\Gamma(y)}{\Gamma(x + y)}$, que l'on ne cherchera pas à démontrer en général.
  corrige: |
    Tout repose sur des intégrations par parties et des changements de variable simples ; la relation $B = \frac{\Gamma\Gamma}{\Gamma}$, admise, sert de contrôle.

    **1.** Par $\Gamma(x + 1) = x\Gamma(x)$ (section 12.4), 
    $$\Gamma\Big(n + \frac{1}{2}\Big) = \Big(n - \frac{1}{2}\Big)\Big(n - \frac{3}{2}\Big)\cdots\frac{1}{2}\,\Gamma\Big(\frac{1}{2}\Big) = \frac{1 \cdot 3 \cdots (2n - 1)}{2^{n}}\sqrt{\pi}, \qquad \boxed{\Gamma\Big(n + \frac{1}{2}\Big) = \frac{(2n)!}{4^{n}n!}\sqrt{\pi}}$$

    **2.** En $0$, $t^{x - 1}(1 - t)^{y - 1} \sim t^{x - 1}$, intégrable si et seulement si $x > 0$ ; en $1$, elle est équivalente à $(1 - t)^{y - 1}$, d'où la condition $y > 0$. 
    $$\boxed{B(x, y) \text{ existe} \iff x > 0 \text{ et } y > 0}$$

    **3.** Le changement de variable $s = 1 - t$ donne la symétrie. En multipliant l'intégrande par $1 = t + (1 - t)$, on obtient $B(x, y) = B(x + 1, y) + B(x, y + 1)$. Une intégration par parties, dont le crochet $\big[-\frac{t^{x}(1 - t)^{y}}{y}\big]_{0}^{1}$ est nul pour $x$, $y > 0$, donne 
    $$B(x + 1, y) = \int_{0}^{1} t^{x}(1 - t)^{y - 1}\,\mathrm{d} t = \frac{x}{y}\int_{0}^{1} t^{x - 1}(1 - t)^{y}\,\mathrm{d} t = \frac{x}{y}B(x, y + 1).$$
     En reportant $B(x, y + 1) = \frac{y}{x}B(x + 1, y)$ dans la relation précédente : 
    $$\boxed{B(x + 1, y) = \frac{x}{x + y}B(x, y)}$$

    **4.** Par symétrie et récurrence, $B(n + 1, x) = \frac{n}{x + n}B(n, x) = \cdots = \frac{n!}{(x + 1)\cdots(x + n)}B(1, x)$, avec $B(1, x) = \int_{0}^{1} (1 - t)^{x - 1}\,\mathrm{d} t = \frac{1}{x}$. 
    $$\boxed{B(n + 1, x) = \frac{n!}{x(x + 1)\cdots(x + n)}}$$

    **5.** Le changement de variable $t = \sin^{2}\varphi$ donne $B\big(\frac{1}{2}, \frac{1}{2}\big) = \int_{0}^{\pi/2} \frac{2\sin\varphi\cos\varphi}{\sin\varphi\cos\varphi}\,\mathrm{d}\varphi = \pi$. La relation de la question 3, appliquée $n$ fois à la première variable puis $m$ fois à la seconde, donne 
    $$\boxed{B\Big(n + \frac{1}{2}, m + \frac{1}{2}\Big) = \pi\frac{(2n)!(2m)!}{4^{n + m}n!\,m!\,(n + m)!}}$$
     qui coïncide avec $\frac{\Gamma(n + \frac{1}{2})\Gamma(m + \frac{1}{2})}{\Gamma(n + m + 1)}$ par la question 1, ce qui a été vérifié pour $n$, $m \leqslant 2$.
- id: "mp-12-12"
  feuille: "f-mp-12"
  numero: 12
  partie: "Calcul des intégrales"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [calcul des intégrales, "nature d'une intégrale"]
