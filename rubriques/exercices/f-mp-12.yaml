  noeuds: [ri-proprietes, ar-asymptotique]
  notions: []
  source: "Feuille d'exercices #02 (Prost), exercice 28 ; TD 7 (Sainte-Geneviève), exercice 30 (Mines)"
  page_enonce: 5
  page_corrige: 14
  enonce: |
    *Relations de récurrence.*

    **1.** Pour $\alpha > 0$ et $n \in \mathbb{N}$, calculer $\displaystyle I_{n} = \int_{0}^{+\infty} t^{n}\mathrm{e}^{-\alpha t}\,\mathrm{d} t$.

    **2.** Pour $n \geqslant 1$, calculer $\displaystyle J_{n} = \int_{0}^{+\infty} \frac{\mathrm{d} t}{(1 + t^{2})^{n}}$ en fonction de $n$, et en donner un équivalent.

    **3.** Pour $n \geqslant 1$, on pose $\displaystyle K_{n} = \int_{0}^{+\infty} \frac{\mathrm{d} t}{\operatorname{ch}^{n}t}$. Montrer que $K_{n}$ existe, que $(K_{n})$ est strictement décroissante, et que $(n + 1)K_{n + 2} = nK_{n}$.

    **4.** Montrer que la suite $(nK_{n}K_{n + 1})_{n \geqslant 1}$ est constante, et en déduire un équivalent de $K_{n}$.
  corrige: |
    Les trois suites se calculent par intégration par parties, qui relie un terme à un terme d'indice voisin, comme pour les intégrales de Wallis.

    **1.** Par parties, $I_{n} = \frac{n}{\alpha}I_{n - 1}$, et $I_{0} = \frac{1}{\alpha}$. 
    $$\boxed{I_{n} = \frac{n!}{\alpha^{n + 1}}}$$
     Le changement de variable $u = \alpha t$ donne aussi directement $\frac{\Gamma(n + 1)}{\alpha^{n + 1}}$.

    **2.** Par parties, en écrivant $1 = t'$, $J_{n} = \big[\frac{t}{(1 + t^{2})^{n}}\big]_{0}^{+\infty} + 2n\int_{0}^{+\infty} \frac{t^{2}}{(1 + t^{2})^{n + 1}}\,\mathrm{d} t = 2n(J_{n} - J_{n + 1})$, d'où $J_{n + 1} = \frac{2n - 1}{2n}J_{n}$ et, avec $J_{1} = \frac{\pi}{2}$, 
    $$\boxed{J_{n} = \frac{\pi}{2}\cdot\frac{(2n - 2)!}{4^{n - 1}\big((n - 1)!\big)^{2}}, \qquad J_{n} \sim \frac{\sqrt{\pi}}{2\sqrt{n}}}$$
     L'équivalent vient de $J_{n} = W_{2n - 2}$ (changement de variable $t = \tan\theta$) et de $W_{k} \sim \sqrt{\frac{\pi}{2k}}$ (théorème 6).

    **3.** Comme $\operatorname{ch} t \geqslant \frac{\mathrm{e}^{t}}{2}$, $\frac{1}{\operatorname{ch}^{n}t} \leqslant 2^{n}\mathrm{e}^{-nt}$ : $K_{n}$ existe. Comme $\operatorname{ch} t > 1$ pour $t > 0$, $\frac{1}{\operatorname{ch}^{n + 1}} < \frac{1}{\operatorname{ch}^{n}}$ sur $]0, +\infty[$ et $K_{n + 1} < K_{n}$. Par parties, avec $\operatorname{th}' = \frac{1}{\operatorname{ch}^{2}}$ et le crochet $\frac{\operatorname{th} t}{\operatorname{ch}^{n}t}$ nul en $0$ et en $+\infty$, 
    $$K_{n + 2} = \int_{0}^{+\infty} \frac{\operatorname{th}'(t)}{\operatorname{ch}^{n}t}\,\mathrm{d} t = n\int_{0}^{+\infty} \frac{\operatorname{sh}^{2}t}{\operatorname{ch}^{n + 2}t}\,\mathrm{d} t = n(K_{n} - K_{n + 2}), \qquad \boxed{(n + 1)K_{n + 2} = nK_{n}}$$

    **4.** On a $(n + 1)K_{n + 1}K_{n + 2} = nK_{n}K_{n + 1}$ par la question 3 : la suite est constante, égale à $K_{1}K_{2}$, avec 
    $$K_{1} = \Big[2\operatorname{Arctan}(\mathrm{e}^{t})\Big]_{0}^{+\infty} = \frac{\pi}{2}, \qquad K_{2} = \Big[\operatorname{th} t\Big]_{0}^{+\infty} = 1.$$
     La décroissance donne $K_{n + 1} \leqslant K_{n} \leqslant K_{n - 1} = \frac{n}{n - 1}K_{n + 1}$, d'où $K_{n} \sim K_{n + 1}$ et $nK_{n}^{2} \sim \frac{\pi}{2}$. 
    $$\boxed{nK_{n}K_{n + 1} = \frac{\pi}{2}, \qquad K_{n} \sim \sqrt{\frac{\pi}{2n}}}$$
- id: "mp-12-18"
  feuille: "f-mp-12"
  numero: 18
  partie: "Calcul des intégrales"
