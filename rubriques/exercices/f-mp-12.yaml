  page_enonce: 10
  page_corrige: 26
  enonce: |
    *Autour du poids de Tchebychev.*

    **1.** Soit $a < b$. Justifier l'existence et calculer $\displaystyle \int_{a}^{b} \frac{\mathrm{d} t}{\sqrt{(t - a)(b - t)}}$.

    **2.** Soit $x \in ]0, \pi[$ et $n \in \mathbb{N}$. Montrer que $\displaystyle I_{n}(x) = \int_{0}^{\pi} \frac{\cos(nt) - \cos(nx)}{\cos t - \cos x}\,\mathrm{d} t$ est bien définie.

    **3.** Pour $n \geqslant 1$, exprimer $I_{n + 1}(x) + I_{n - 1}(x)$ en fonction de $I_{n}(x)$, et en déduire que $\displaystyle I_{n}(x) = \frac{\pi\sin(nx)}{\sin x}$.
  corrige: |
    La première question est un changement de variable ; la seconde exploite la formule d'addition qui donne la relation de récurrence des polynômes de Tchebychev, 
    $$\cos((n + 1)t) + \cos((n - 1)t) = 2\cos t\cos(nt).$$

    **1.** L'intégrande est équivalente à $\frac{1}{\sqrt{b - a}\sqrt{t - a}}$ en $a$, et de même en $b$ : elle est intégrable. Le changement de variable $t = a + (b - a)\sin^{2}\varphi$, bijection croissante de $]0, \frac{\pi}{2}[$ sur $]a, b[$, donne $(t - a)(b - t) = (b - a)^{2}\sin^{2}\varphi\cos^{2}\varphi$ et $\mathrm{d} t = 2(b - a)\sin\varphi\cos\varphi\,\mathrm{d}\varphi$. 
    $$\boxed{\int_{a}^{b} \frac{\mathrm{d} t}{\sqrt{(t - a)(b - t)}} = \pi}$$

    **2.** Sur $[0, \pi] \setminus \{x\}$, l'intégrande est continue. En $x$, numérateur et dénominateur s'annulent, et leurs dérivées en $x$ valent $-n\sin(nx)$ et $-\sin x \neq 0$ : l'intégrande tend vers $\frac{n\sin(nx)}{\sin x}$. L'intégrale est faussement généralisée. 
    $$\boxed{I_{n}(x) \text{ est bien définie}}$$

    **3.** On décompose le numérateur de $I_{n + 1}(x) + I_{n - 1}(x)$ : 
    $$2\cos t\cos(nt) - 2\cos x\cos(nx) = 2\cos x\big(\cos(nt) - \cos(nx)\big) + 2\cos(nt)\big(\cos t - \cos x\big),$$
     et l'on utilise $\int_{0}^{\pi} \cos(nt)\,\mathrm{d} t = 0$ pour $n \geqslant 1$ : 
    $$\boxed{I_{n + 1}(x) + I_{n - 1}(x) = 2\cos x\,I_{n}(x)}$$
     Comme $I_{0} = 0$ et $I_{1} = \pi$, et que la suite $\big(\frac{\pi\sin(nx)}{\sin x}\big)$ vérifie la même récurrence d'ordre $2$ et les mêmes conditions initiales, 
    $$\boxed{I_{n}(x) = \frac{\pi\sin(nx)}{\sin x}}$$
     Valeurs contrôlées numériquement pour $x = 0{,}7$ et $n \leqslant 4$.
- id: "mp-12-35"
  feuille: "f-mp-12"
