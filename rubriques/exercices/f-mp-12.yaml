  enonce: |
    *La constante d'Euler.* On note $\displaystyle H_{n} = \sum_{k = 1}^{n} \frac{1}{k}$ et $\displaystyle \gamma = \lim\limits_{n \to +\infty} (H_{n} - \ln n)$ la constante d'Euler (chapitre 20 de MPSI).

    **1.** Montrer que $\displaystyle \int_{1}^{+\infty} \frac{t - \lfloor t \rfloor}{t^{2}}\,\mathrm{d} t$ converge et vaut $1 - \gamma$. En déduire la valeur de $\displaystyle \int_{0}^{1} \Big(\frac{1}{t} - \Big\lfloor\frac{1}{t}\Big\rfloor\Big)\mathrm{d} t$.

    **2.** Soit $g(v) = \frac{1}{\mathrm{e}^{v} - 1} - \frac{1}{v}$ pour $v > 0$. Montrer que $g$ a une limite en $0$, et que $|g| \leqslant 1$ sur $\mathbb{R}_{+}^{*}$.

    **3.** Montrer que, pour $n \geqslant 1$, 
    $$H_{n} = \int_{0}^{+\infty} \frac{(1 - \mathrm{e}^{-nv})\mathrm{e}^{-v}}{1 - \mathrm{e}^{-v}}\,\mathrm{d} v \qquad\text{et}\qquad \ln n = \int_{0}^{+\infty} \frac{\mathrm{e}^{-v} - \mathrm{e}^{-nv}}{v}\,\mathrm{d} v,$$
     la seconde égalité à l'aide de l'exercice 19.

    **4.** En déduire que $\displaystyle \gamma = \int_{0}^{+\infty} \mathrm{e}^{-v}\Big(\frac{1}{1 - \mathrm{e}^{-v}} - \frac{1}{v}\Big)\mathrm{d} v$, puis que $\displaystyle \gamma = \int_{0}^{1} \Big(\frac{1}{t} + \frac{1}{\ln(1 - t)}\Big)\mathrm{d} t$.
  corrige: |
    On ramène les intégrales à des sommes harmoniques, soit en découpant en intervalles entiers, soit à l'aide de l'intégrale de Frullani de l'exercice 19.

    **1.** La fonction est positive et majorée par $\frac{1}{t^{2}}$. Pour $N \geqslant 2$, 
    $$\int_{1}^{N} \frac{t - \lfloor t \rfloor}{t^{2}}\,\mathrm{d} t = \int_{1}^{N} \frac{\mathrm{d} t}{t} - \sum_{k = 1}^{N - 1} k\int_{k}^{k + 1} \frac{\mathrm{d} t}{t^{2}} = \ln N - \sum_{k = 1}^{N - 1} \frac{1}{k + 1} = \ln N - H_{N} + 1 \to 1 - \gamma.$$
     La fonction étant positive, la limite le long des entiers suffit. Le changement de variable $t = \frac{1}{u}$ donne la seconde intégrale. 
    $$\boxed{\int_{1}^{+\infty} \frac{t - \lfloor t \rfloor}{t^{2}}\,\mathrm{d} t = \int_{0}^{1} \Big(\frac{1}{t} - \Big\lfloor\frac{1}{t}\Big\rfloor\Big)\mathrm{d} t = 1 - \gamma}$$

    **2.** En $0$, $\frac{1}{\mathrm{e}^{v} - 1} = \frac{1}{v} - \frac{1}{2} + O(v)$, donc $g(v) \to -\frac{1}{2}$. L'inégalité $\mathrm{e}^{v} - 1 \geqslant v$ donne $g \leqslant 0$, et $g \geqslant -1$ équivaut à $\mathrm{e}^{v} - 1 - v \leqslant v(\mathrm{e}^{v} - 1)$, soit $1 - \mathrm{e}^{-v} \leqslant v$, vrai. 
    $$\boxed{g(v) \to -\frac{1}{2}, \quad |g| \leqslant 1}$$

    **3.** On a $\int_{0}^{+\infty} \mathrm{e}^{-kv}\,\mathrm{d} v = \frac{1}{k}$, et, par somme géométrique, $\sum_{k = 1}^{n} \mathrm{e}^{-kv} = \frac{(1 - \mathrm{e}^{-nv})\mathrm{e}^{-v}}{1 - \mathrm{e}^{-v}}$, fonction continue sur $]0, +\infty[$ de limite $n$ en $0$. L'exercice 19 avec $f(x) = \mathrm{e}^{-x}$, $a = 1$ et $b = n$ donne la seconde égalité.

    **4.** Les deux intégrales de la question 3 convergent, et leur différence s'écrit 
    $$H_{n} - \ln n = \int_{0}^{+\infty} \mathrm{e}^{-v}\Big(\frac{1}{1 - \mathrm{e}^{-v}} - \frac{1}{v}\Big)\mathrm{d} v - \int_{0}^{+\infty} \mathrm{e}^{-nv}g(v)\,\mathrm{d} v,$$
     puisque $\frac{\mathrm{e}^{-v}}{1 - \mathrm{e}^{-v}} = \frac{1}{\mathrm{e}^{v} - 1}$. Le dernier terme est majoré en valeur absolue par $\int_{0}^{+\infty} \mathrm{e}^{-nv}\,\mathrm{d} v = \frac{1}{n}$. On fait tendre $n$ vers $+\infty$, puis on effectue le changement de variable $t = 1 - \mathrm{e}^{-v}$ : 
    $$\boxed{\gamma = \int_{0}^{+\infty} \mathrm{e}^{-v}\Big(\frac{1}{1 - \mathrm{e}^{-v}} - \frac{1}{v}\Big)\mathrm{d} v = \int_{0}^{1} \Big(\frac{1}{t} + \frac{1}{\ln(1 - t)}\Big)\mathrm{d} t}$$
     C'est l'intégrale de l'exercice 7 (c). Les deux valeurs ont été contrôlées numériquement à $10^{-30}$ près.

    *Commentaire.* Le passage à la limite sous l'intégrale, qui demanderait le théorème de convergence dominée du chapitre 13, est remplacé ici par la majoration explicite $|g| \leqslant 1$.
- id: "mp-12-31"
  feuille: "f-mp-12"
  numero: 31
  partie: "Produits scalaires définis par une intégrale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires intégraux, intégrabilité, séries et intégrales]
  noeuds: [me-produit-scalaire, ri-integrable, as-series]
  notions: [produit-scalaire, integrale-convergente]
  source: "TD 7 (Sainte-Geneviève), exercice 86 (Mines)"
  page_enonce: 9
  page_corrige: 25
  enonce: |
    *Des pics.* Soit $(h_{n})_{n \geqslant 1}$ et $(\ell_{n})_{n \geqslant 1}$ deux suites de réels strictement positifs, avec $\ell_{n} \leqslant \frac{1}{2}$. Pour $x \geqslant 0$, on pose 
    $$f(x) = \sum_{n = 1}^{+\infty} h_{n}\max\Big(0, 1 - \frac{|x - n|}{\ell_{n}}\Big).$$

    **1.** Montrer que $f$ est continue et positive, puis que $\displaystyle \int_{0}^{+\infty} f = \sum_{n \geqslant 1} h_{n}\ell_{n}$ et $\displaystyle \int_{0}^{+\infty} f^{2} = \frac{2}{3}\sum_{n \geqslant 1} h_{n}^{2}\ell_{n}$, dans $[0, +\infty]$.

    **2.** En déduire une fonction continue, intégrable et non bornée sur $[0, +\infty[$.

    **3.** Construire une fonction continue sur $[0, +\infty[$ intégrable mais dont le carré n'est pas intégrable. Donner aussi une fonction continue de carré intégrable qui n'est pas intégrable.
  corrige: |
    Les supports des pics sont disjoints : tout se lit triangle par triangle, et la positivité ramène les intégrales à des sommes de séries.

    **1.** Comme $\ell_{n} \leqslant \frac{1}{2}$, le $n$-ième terme est nul hors de $[n - \ell_{n}, n + \ell_{n}] \subset [n - \frac{1}{2}, n + \frac{1}{2}]$. Sur chaque segment $[N - \frac{1}{2}, N + \frac{1}{2}]$, $f$ se réduit à un seul triangle, continu et nul aux extrémités : $f$ est continue et positive. L'aire d'un triangle de hauteur $h_{n}$ et de base $2\ell_{n}$ est $h_{n}\ell_{n}$, et $\int_{-\ell}^{\ell} \big(1 - \frac{|x|}{\ell}\big)^{2}\,\mathrm{d} x = \frac{2\ell}{3}$. Les intégrales partielles étant croissantes, leurs limites sont les sommes des séries : 
    $$\boxed{\int_{0}^{+\infty} f = \sum_{n \geqslant 1} h_{n}\ell_{n}, \qquad \int_{0}^{+\infty} f^{2} = \frac{2}{3}\sum_{n \geqslant 1} h_{n}^{2}\ell_{n}}$$

    **2.** Avec $h_{n} = n$ et $\ell_{n} = \frac{1}{n^{3}}$, $\int f = \sum \frac{1}{n^{2}} < +\infty$ et $f(n) = n$. 
    $$\boxed{f \text{ intégrable, non bornée}}$$

    **3.** Avec les mêmes suites, $\int f^{2} = \frac{2}{3}\sum \frac{1}{n} = +\infty$ : $f$ est intégrable, $f^{2}$ ne l'est pas. Inversement, $x \mapsto \frac{1}{1 + x}$ est de carré intégrable sur $[0, +\infty[$ sans être intégrable. 
    $$\boxed{L^{1} \not\subset L^{2} \text{ et } L^{2} \not\subset L^{1} \text{ sur } [0, +\infty[}$$

    *Commentaire.* Sur un intervalle borné, la seconde inclusion devient vraie (cours, section 12.6) ; la première reste fausse, comme le montre $\frac{1}{\sqrt{t}}$ sur $]0, 1]$.
- id: "mp-12-32"
  feuille: "f-mp-12"
  numero: 32
  partie: "Produits scalaires définis par une intégrale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires intégraux]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire]
  page_enonce: 9
  page_corrige: 25
  enonce: |
    *Polynômes de Hermite.* On munit $\mathbb{R}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{-\infty}^{+\infty} P(t)Q(t)\mathrm{e}^{-t^{2}}\,\mathrm{d} t$ (cours, section 12.6), et l'on pose, pour $n \in \mathbb{N}$, 
    $$H_{n}(t) = (-1)^{n}\mathrm{e}^{t^{2}}\frac{\mathrm{d}^{n}}{\mathrm{d} t^{n}}\big(\mathrm{e}^{-t^{2}}\big).$$

    **1.** Montrer que $H_{n + 1} = 2XH_{n} - H_{n}'$, et en déduire que $H_{n}$ est un polynôme de degré $n$, de coefficient dominant $2^{n}$ et de la parité de $n$. Calculer $H_{0}, \dots, H_{4}$.

    **2.** Montrer que $\displaystyle \langle P, H_{n} \rangle = \int_{-\infty}^{+\infty} P^{(n)}(t)\mathrm{e}^{-t^{2}}\,\mathrm{d} t$ pour tout $P \in \mathbb{R}[X]$. En déduire que $(H_{n})$ est orthogonale, et que $\lVert H_{n} \rVert^{2} = 2^{n}n!\sqrt{\pi}$.

    **3.** Montrer que $H_{n}' = 2nH_{n - 1}$ et que $H_{n + 1} = 2XH_{n} - 2nH_{n - 1}$ pour $n \geqslant 1$. Comparer avec la relation de récurrence à trois termes du chapitre 10.
  corrige: |
    Tout repose sur des intégrations par parties répétées, dont les crochets s'annulent grâce au facteur $\mathrm{e}^{-t^{2}}$.

    **1.** En dérivant $\big(\mathrm{e}^{-t^{2}}\big)^{(n)} = (-1)^{n}H_{n}(t)\mathrm{e}^{-t^{2}}$, on obtient $\big(\mathrm{e}^{-t^{2}}\big)^{(n + 1)} = (-1)^{n}\big(H_{n}' - 2tH_{n}\big)\mathrm{e}^{-t^{2}}$, d'où 
    $$\boxed{H_{n + 1} = 2XH_{n} - H_{n}'}$$

    Par récurrence, à partir de $H_{0} = 1$, $H_{n}$ est un polynôme de degré $n$ et de coefficient dominant $2^{n}$, et $H_{n}(-t) = (-1)^{n}H_{n}(t)$, car la dérivée $n$-ième d'une fonction paire a la parité de $n$. 
    $$\boxed{H_{0} = 1, \quad H_{1} = 2X, \quad H_{2} = 4X^{2} - 2, \quad H_{3} = 8X^{3} - 12X, \quad H_{4} = 16X^{4} - 48X^{2} + 12}$$

    **2.** On intègre $n$ fois par parties ; les crochets sont de la forme $P^{(j)}(t)\,Q(t)\mathrm{e}^{-t^{2}}$, avec $Q$ polynomial, et tendent vers $0$ en $\pm\infty$ : 
    $$\langle P, H_{n} \rangle = (-1)^{n}\int_{-\infty}^{+\infty} P(t)\big(\mathrm{e}^{-t^{2}}\big)^{(n)}\,\mathrm{d} t = \int_{-\infty}^{+\infty} P^{(n)}(t)\mathrm{e}^{-t^{2}}\,\mathrm{d} t.$$
     Si $\deg P < n$, $P^{(n)} = 0$ : $H_{n}$ est orthogonal à $\mathbb{R}_{n - 1}[X]$, donc aux $H_{k}$, $k < n$. Pour $P = H_{n}$, $H_{n}^{(n)} = 2^{n}n!$. 
    $$\boxed{(H_{n}) \text{ orthogonale}, \quad \lVert H_{n} \rVert^{2} = 2^{n}n!\sqrt{\pi}}$$

    **3.** Le polynôme $H_{n}'$ est de degré $n - 1$, de coefficient dominant $n2^{n}$. Pour $Q \in \mathbb{R}_{n - 2}[X]$, une intégration par parties donne 
    $$\int_{-\infty}^{+\infty} QH_{n}'\mathrm{e}^{-t^{2}} = -\int_{-\infty}^{+\infty} H_{n}\big(Q' - 2XQ\big)\mathrm{e}^{-t^{2}} = -\langle Q' - 2XQ, H_{n} \rangle = 0,$$
     puisque $\deg(Q' - 2XQ) \leqslant n - 1$. Ainsi $H_{n}'$, orthogonal à $\mathbb{R}_{n - 2}[X]$ et de degré $n - 1$, est colinéaire à $H_{n - 1}$ ; la comparaison des coefficients dominants donne la constante. Avec la question 1 : 
    $$\boxed{H_{n}' = 2nH_{n - 1}, \qquad H_{n + 1} = 2XH_{n} - 2nH_{n - 1}}$$
     Pour les polynômes unitaires $P_{n} = 2^{-n}H_{n}$, on obtient $P_{n + 1} = XP_{n} - \frac{n}{2}P_{n - 1}$ : dans la relation du chapitre 10, $\alpha_{n} = 0$ par parité, et $\beta_{n} = \frac{\lVert P_{n} \rVert^{2}}{\lVert P_{n - 1} \rVert^{2}} = \frac{2^{n}n!\sqrt{\pi}/4^{n}}{2^{n - 1}(n - 1)!\sqrt{\pi}/4^{n - 1}} = \frac{n}{2}$, ce qui est cohérent.
- id: "mp-12-33"
  feuille: "f-mp-12"
  numero: 33
  partie: "Produits scalaires définis par une intégrale"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [produits scalaires intégraux]
  noeuds: [me-produit-scalaire]
  notions: [produit-scalaire]
  page_enonce: 9
  page_corrige: 26
  enonce: |
    *Polynômes de Laguerre.* On munit $\mathbb{R}[X]$ du produit scalaire $\displaystyle \langle P, Q \rangle = \int_{0}^{+\infty} P(t)Q(t)\mathrm{e}^{-t}\,\mathrm{d} t$, et l'on pose, pour $n \in \mathbb{N}$, 
    $$L_{n}(t) = \frac{\mathrm{e}^{t}}{n!}\frac{\mathrm{d}^{n}}{\mathrm{d} t^{n}}\big(t^{n}\mathrm{e}^{-t}\big).$$

    **1.** Montrer que $L_{n}$ est un polynôme de degré $n$, de coefficient dominant $\frac{(-1)^{n}}{n!}$, tel que $L_{n}(0) = 1$, et l'expliciter.

    **2.** Montrer que $(L_{n})$ est une famille orthonormée de $\mathbb{R}[X]$, et retrouver les polynômes unitaires $L_{0}$, $L_{1}$, $L_{2}$, $L_{3}$ du cours.
  corrige: |
    On développe par la formule de Leibniz, puis l'on intègre $n$ fois par parties, comme pour les polynômes de Hermite.

    **1.** La formule de Leibniz donne $\big(t^{n}\mathrm{e}^{-t}\big)^{(n)} = \mathrm{e}^{-t}\sum_{k = 0}^{n} \binom{n}{k}\frac{n!}{(n - k)!}t^{n - k}(-1)^{n - k}$, d'où, avec $j = n - k$, 
    $$\boxed{L_{n} = \sum_{j = 0}^{n} \binom{n}{j}\frac{(-1)^{j}}{j!}X^{j}}$$
     de degré $n$, de coefficient dominant $\frac{(-1)^{n}}{n!}$, avec $L_{n}(0) = 1$.

    **2.** Pour $k < n$, $\big(t^{n}\mathrm{e}^{-t}\big)^{(k)}$ est un multiple de $t^{n - k}\mathrm{e}^{-t}$ par un polynôme : il est nul en $0$ et tend vers $0$ en $+\infty$. Les $n$ intégrations par parties ont donc des crochets nuls : 
    $$\langle P, L_{n} \rangle = \frac{1}{n!}\int_{0}^{+\infty} P(t)\big(t^{n}\mathrm{e}^{-t}\big)^{(n)}\,\mathrm{d} t = \frac{(-1)^{n}}{n!}\int_{0}^{+\infty} P^{(n)}(t)t^{n}\mathrm{e}^{-t}\,\mathrm{d} t.$$
     Pour $\deg P < n$, c'est $0$ ; pour $P = L_{n}$, $L_{n}^{(n)} = (-1)^{n}$ et $\int_{0}^{+\infty} t^{n}\mathrm{e}^{-t}\,\mathrm{d} t = n!$, d'où $\lVert L_{n} \rVert^{2} = 1$. 
    $$\boxed{(L_{n}) \text{ est orthonormée}}$$

    Les polynômes unitaires sont les $(-1)^{n}n!\,L_{n}$ : on retrouve $X - 1$, $X^{2} - 4X + 2$ et $X^{3} - 9X^{2} + 18X - 6$, comme dans le cours.
- id: "mp-12-34"
  feuille: "f-mp-12"
