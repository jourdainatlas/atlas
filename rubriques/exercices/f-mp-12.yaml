  enonce: |
    Soit $u_{0} \in \mathbb{R}$ et $(u_{n})$ la suite définie par $\displaystyle u_{n + 1} = u_{n} + \int_{u_{n}}^{+\infty} \mathrm{e}^{-t^{2}}\,\mathrm{d} t$.

    **1.** Montrer que $(u_{n})$ est croissante et tend vers $+\infty$.

    **2.** Donner un équivalent de $u_{n + 1} - u_{n}$ en fonction de $u_{n}$.

    **3.** Montrer que $\mathrm{e}^{u_{n + 1}^{2}} - \mathrm{e}^{u_{n}^{2}} \to 1$, et en déduire un équivalent de $u_{n}$.
  corrige: |
    On obtient d'abord l'équivalent de l'incrément par le cours, puis on « linéarise » la récurrence en considérant $\mathrm{e}^{u_{n}^{2}}$, dont les accroissements tendent vers $1$.

    **1.** L'intégrale ajoutée est strictement positive : $(u_{n})$ est strictement croissante. Si elle était majorée, elle convergerait vers un réel $\ell$, et le passage à la limite donnerait $\int_{\ell}^{+\infty} \mathrm{e}^{-t^{2}}\,\mathrm{d} t = 0$, ce qui est absurde. 
    $$\boxed{u_{n} \nearrow +\infty}$$

    **2.** Par l'exemple de la section 12.5 du cours, $\int_{x}^{+\infty} \mathrm{e}^{-t^{2}}\,\mathrm{d} t \sim \frac{\mathrm{e}^{-x^{2}}}{2x}$, et $u_{n} \to +\infty$. 
    $$\boxed{u_{n + 1} - u_{n} \sim \frac{\mathrm{e}^{-u_{n}^{2}}}{2u_{n}}}$$

    **3.** Notons $\delta_{n} = u_{n + 1} - u_{n}$, qui tend vers $0$. Par croissance de $t \mapsto 2t\mathrm{e}^{t^{2}}$, 
    $$2u_{n}\mathrm{e}^{u_{n}^{2}}\delta_{n} \leqslant \mathrm{e}^{u_{n + 1}^{2}} - \mathrm{e}^{u_{n}^{2}} = \int_{u_{n}}^{u_{n + 1}} 2t\mathrm{e}^{t^{2}}\,\mathrm{d} t \leqslant 2u_{n + 1}\mathrm{e}^{u_{n + 1}^{2}}\delta_{n}.$$
     Le minorant tend vers $1$ par la question 2. Le majorant vaut le minorant multiplié par $\frac{u_{n + 1}}{u_{n}}\mathrm{e}^{u_{n + 1}^{2} - u_{n}^{2}}$ ; or $\frac{u_{n + 1}}{u_{n}} \to 1$, et $u_{n + 1}^{2} - u_{n}^{2} = \delta_{n}(u_{n + 1} + u_{n}) \sim 2u_{n}\delta_{n} \sim \mathrm{e}^{-u_{n}^{2}} \to 0$. Ainsi $\mathrm{e}^{u_{n + 1}^{2}} - \mathrm{e}^{u_{n}^{2}} \to 1$, et le lemme de Cesàro donne $\mathrm{e}^{u_{n}^{2}} \sim n$, puis $u_{n}^{2} = \ln n + o(1)$. 
    $$\boxed{u_{n} \sim \sqrt{\ln n}}$$
     Numériquement, pour $u_{0} = 0$, on trouve $u_{n} \approx 3{,}388$ pour $n = 10^{5}$, contre $\sqrt{\ln n} \approx 3{,}393$.
- id: "mp-12-29"
