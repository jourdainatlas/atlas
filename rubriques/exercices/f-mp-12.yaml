  noeuds: [me-produit-scalaire, ri-integrable]
  notions: [produit-scalaire, integrale-convergente]
  source: "TD 7 (Sainte-Geneviève), exercices 64 (ENS) et 87"
  page_enonce: 10
  page_corrige: 27
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, telle que $f^{2}$ et $f'^{2}$ soient intégrables sur $\mathbb{R}$.

    **1.** Montrer que $ff'$ est intégrable sur $\mathbb{R}$, puis que $f^{2}$ a une limite en $+\infty$ et en $-\infty$. En déduire que $f$ tend vers $0$ en $\pm\infty$.

    **2.** Montrer que, pour tout réel $x$, 
    $$f(x)^{2} \leqslant \Big(\int_{-\infty}^{+\infty} f^{2}\Big)^{1/2}\Big(\int_{-\infty}^{+\infty} f'^{2}\Big)^{1/2}.$$
  corrige: |
    On étudie $f^{2}$, dont la dérivée $2ff'$ est intégrable : $f^{2}$ a donc des limites en $\pm\infty$, nécessairement nulles.

    **1.** L'inégalité $|ff'| \leqslant \frac{1}{2}(f^{2} + f'^{2})$ montre que $ff'$ est intégrable. Alors $f(x)^{2} = f(0)^{2} + \int_{0}^{x} 2ff'$ a une limite finie $L$ en $+\infty$ ; si $L > 0$, $f^{2} \geqslant \frac{L}{2}$ au voisinage de $+\infty$, et $f^{2}$ ne serait pas intégrable. De même en $-\infty$. 
    $$\boxed{f(x) \to 0 \text{ en } \pm\infty}$$

    **2.** On a $f(x)^{2} = -\int_{x}^{+\infty} 2ff' \leqslant 2\int_{x}^{+\infty} |ff'|$ et $f(x)^{2} = \int_{-\infty}^{x} 2ff' \leqslant 2\int_{-\infty}^{x} |ff'|$. En ajoutant, puis par l'inégalité de Cauchy-Schwarz (proposition 6 du cours) : 
    $$2f(x)^{2} \leqslant 2\int_{-\infty}^{+\infty} |f||f'| \leqslant 2\Big(\int f^{2}\Big)^{1/2}\Big(\int f'^{2}\Big)^{1/2}, \qquad \boxed{f(x)^{2} \leqslant \Big(\int_{\mathbb{R}} f^{2}\Big)^{1/2}\Big(\int_{\mathbb{R}} f'^{2}\Big)^{1/2}}$$

    *Commentaire.* En particulier, $f$ est bornée : c'est le prototype des inégalités de Sobolev, qui contrôlent une fonction par l'énergie de sa dérivée.
- id: "mp-12-36"
  feuille: "f-mp-12"
  numero: 36
