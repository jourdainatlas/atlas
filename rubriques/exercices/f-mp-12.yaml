  source: "Feuille d'exercices #02 (Prost), exercices 20 et 21 ; TD 7 (Sainte-Geneviève), exercice 111 (Mines) ; BibM@th, Intégrales impropres, exercice 27"
  page_enonce: 8
  page_corrige: 23
  enonce: |
    *Sommes de Riemann et intégrales généralisées.*

    **1.** Soit $f : ]0, 1[ \to \mathbb{R}$ continue, croissante et intégrable sur $]0, 1[$. Montrer que 
    $$\frac{1}{n}\sum_{k = 1}^{n - 1} f\Big(\frac{k}{n}\Big) \xrightarrow[n \to +\infty]{} \int_{0}^{1} f(t)\,\mathrm{d} t.$$

    **2.** En déduire un équivalent de $\displaystyle \sum_{k = 1}^{n} k^{\alpha}$ quand $n \to +\infty$, pour $\alpha \in ]-1, 0[$.

    **3.** Soit $n \geqslant 2$. Déterminer les racines complexes de $1 + X + \cdots + X^{n - 1}$, et en déduire que $\displaystyle \prod_{k = 1}^{n - 1} \sin\Big(\frac{k\pi}{n}\Big) = \frac{n}{2^{n - 1}}$.

    **4.** En déduire une nouvelle preuve de $\displaystyle \int_{0}^{\pi/2} \ln(\sin t)\,\mathrm{d} t = -\frac{\pi}{2}\ln 2$ (cours, section 12.4).
  corrige: |
    L'encadrement d'une somme de Riemann par deux intégrales, classique pour une fonction monotone sur un segment, s'étend à une intégrale généralisée ; il ne faut simplement pas utiliser la valeur en la borne où la fonction n'est pas définie.

    **1.** Par croissance, pour $1 \leqslant k \leqslant n - 1$, $\int_{(k - 1)/n}^{k/n} f \leqslant \frac{1}{n}f\big(\frac{k}{n}\big) \leqslant \int_{k/n}^{(k + 1)/n} f$. En sommant, 
    $$\int_{0}^{(n - 1)/n} f \leqslant \frac{1}{n}\sum_{k = 1}^{n - 1} f\Big(\frac{k}{n}\Big) \leqslant \int_{1/n}^{1} f,$$
     et les deux bornes tendent vers $\int_{0}^{1} f$, puisque l'intégrale converge aux deux bornes. 
    $$\boxed{\frac{1}{n}\sum_{k = 1}^{n - 1} f\Big(\frac{k}{n}\Big) \to \int_{0}^{1} f}$$

    **2.** La fonction $t \mapsto t^{\alpha}$ est décroissante et intégrable sur $]0, 1]$ pour $\alpha \in ]-1, 0[$ ; on applique la question 1 à son opposée : 
    $$\sum_{k = 1}^{n} k^{\alpha} = n^{\alpha + 1}\Big(\frac{1}{n}\sum_{k = 1}^{n - 1} \Big(\frac{k}{n}\Big)^{\alpha} + \frac{1}{n}\Big), \qquad \boxed{\sum_{k = 1}^{n} k^{\alpha} \sim \frac{n^{\alpha + 1}}{\alpha + 1}}$$

    **3.** Les racines de $1 + X + \cdots + X^{n - 1} = \frac{X^{n} - 1}{X - 1}$ sont les $\omega_{k} = \mathrm{e}^{2\mathrm{i} k\pi/n}$, $1 \leqslant k \leqslant n - 1$. En évaluant la factorisation en $1$, $n = \prod_{k = 1}^{n - 1} (1 - \omega_{k})$ ; or $|1 - \mathrm{e}^{\mathrm{i}\theta}| = 2\sin\frac{\theta}{2}$ pour $\theta \in ]0, 2\pi[$, d'où, en passant aux modules, 
    $$\boxed{\prod_{k = 1}^{n - 1} \sin\frac{k\pi}{n} = \frac{n}{2^{n - 1}}}$$

    **4.** Soit $g(t) = \ln\sin(\pi t)$, intégrable sur $]0, 1[$, croissante sur $]0, \frac{1}{2}]$, symétrique par rapport à $\frac{1}{2}$, et nulle en $\frac{1}{2}$. Pour $n = 2m$ pair, la symétrie donne $\frac{1}{n}\sum_{k = 1}^{n - 1} g\big(\frac{k}{n}\big) = \frac{2}{2m}\sum_{k = 1}^{m - 1} g\big(\frac{k}{2m}\big)$, et l'encadrement de la question 1, sur $]0, \frac{1}{2}]$, montre que cette quantité tend vers $2\int_{0}^{1/2} g = \int_{0}^{1} g$. Par la question 3, elle vaut aussi $\frac{1}{n}\big(\ln n - (n - 1)\ln 2\big) \to -\ln 2$. Enfin, le changement de variable $x = \pi t$ et la symétrie de $\sin$ autour de $\frac{\pi}{2}$ donnent $\int_{0}^{1} g = \frac{2}{\pi}\int_{0}^{\pi/2} \ln(\sin x)\,\mathrm{d} x$. 
    $$\boxed{\int_{0}^{\pi/2} \ln(\sin x)\,\mathrm{d} x = -\frac{\pi}{2}\ln 2}$$
