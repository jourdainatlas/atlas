  source: "TD 7 (Sainte-Geneviève), exercice 46 ; BibM@th, Intégrales impropres, exercice 10"
  page_enonce: 3
  page_corrige: 8
  enonce: |
    *Deux intégrales piégeuses.*

    **1.** Montrer que $\displaystyle \int_{4}^{+\infty} \frac{\sin x}{\sqrt{x}}\,\mathrm{d} x$ converge, et que $\displaystyle \int_{4}^{+\infty} \frac{\sin x}{\sqrt{x} + \sin x}\,\mathrm{d} x$ diverge, bien que les deux fonctions intégrées soient équivalentes en $+\infty$.

    **2.** Soit $\alpha > 0$. Vérifier que $x \mapsto \ln\Big(1 + \frac{\sin x}{x^{\alpha}}\Big)$ est définie et continue sur $[1, +\infty[$, puis montrer que son intégrale sur $[1, +\infty[$ converge si et seulement si $\alpha > \frac{1}{2}$. Pour $\alpha \leqslant \frac{1}{2}$, on pourra établir que $\ln(1 + u) \leqslant u - \frac{u^{2}}{4}$ pour $|u| \leqslant \frac{1}{2}$.
  corrige: |
    Les deux questions illustrent le piège signalé dans le cours : pour des intégrales semi-convergentes, un équivalent ne suffit pas, il faut un développement à deux termes dont le second, de signe constant, décide.

    **1.** L'intégrale de $\frac{\sin x}{\sqrt{x}}$ converge par intégration par parties, comme celle de $\frac{\sin x}{x}$. Pour $x \geqslant 4$, $u = \frac{\sin x}{\sqrt{x}}$ vérifie $|u| \leqslant \frac{1}{2}$, et 
    $$\frac{\sin x}{\sqrt{x} + \sin x} = \frac{u}{1 + u} = u - u^{2} + \frac{u^{3}}{1 + u}, \qquad \Big|\frac{u^{3}}{1 + u}\Big| \leqslant 2|u|^{3} \leqslant \frac{2}{x^{3/2}}.$$
     Le terme $u^{2} = \frac{\sin^{2}x}{x} = \frac{1}{2x} - \frac{\cos(2x)}{2x}$ a une intégrale divergente (le premier morceau diverge, le second converge). Les deux autres termes ont des intégrales convergentes. 
    $$\boxed{\int_{4}^{+\infty} \frac{\sin x}{\sqrt{x} + \sin x}\,\mathrm{d} x \text{ diverge (vers } -\infty)}$$

    **2.** *Définition.* Pour $x \geqslant 1$, $x^{\alpha} \geqslant 1 \geqslant |\sin x|$, avec égalité seulement si $x = 1$, où $|\sin 1| < 1$ : donc $1 + \frac{\sin x}{x^{\alpha}} > 0$.

    *Cas $\alpha > \frac{1}{2}$.* Avec $u = \frac{\sin x}{x^{\alpha}} \to 0$, $\ln(1 + u) = u + O(u^{2})$ et $u^{2} = O\big(\frac{1}{x^{2\alpha}}\big)$, intégrable ; l'intégrale de $u$ converge par intégration par parties, comme celle de $\frac{\sin x}{x}$. 
    $$\boxed{\text{converge}}$$

    *Cas $\alpha \leqslant \frac{1}{2}$.* La fonction $h(u) = \ln(1 + u) - u + \frac{u^{2}}{4}$ vérifie $h(0) = 0$ et $h'(u) = \frac{u(u - 1)}{2(1 + u)}$, positive sur $[-\frac{1}{2}, 0]$ et négative sur $[0, \frac{1}{2}]$ : $h \leqslant 0$ sur $[-\frac{1}{2}, \frac{1}{2}]$. Pour $x$ assez grand, $|u| \leqslant \frac{1}{2}$, et 
    $$\ln\Big(1 + \frac{\sin x}{x^{\alpha}}\Big) \leqslant \frac{\sin x}{x^{\alpha}} - \frac{\sin^{2}x}{4x^{2\alpha}}.$$
     L'intégrale du premier terme converge, celle du second, égale à $\frac{1 - \cos(2x)}{8x^{2\alpha}}$, tend vers $+\infty$ puisque $2\alpha \leqslant 1$. Les intégrales partielles de la fonction tendent vers $-\infty$. 
    $$\boxed{\text{diverge}}$$

    *Piège.* Dans les deux cas, la fonction est équivalente à une fonction dont l'intégrale converge. C'est le terme $-\frac{u^{2}}{2}$, petit mais de signe constant, qui l'emporte sur le terme principal oscillant.
- id: "mp-12-11"
  feuille: "f-mp-12"
  numero: 11
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration, Calcul]
