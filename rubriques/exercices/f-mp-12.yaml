  enonce: |
    *Perspective : une fonction intégrable qui n'est pas bornée.* Soit $\alpha$, $\beta > 0$ et $\displaystyle f(x) = \frac{x^{\beta}}{1 + x^{\alpha}\sin^{2}x}$ pour $x \geqslant 0$.

    **1.** Pour $y > -1$, calculer $\displaystyle \varphi(y) = \int_{0}^{\pi} \frac{\mathrm{d} t}{1 + y\sin^{2}t}$.

    **2.** Pour $n \in \mathbb{N}$, on pose $\displaystyle u_{n} = \int_{n\pi}^{(n + 1)\pi} f$. Encadrer $u_{n}$ à l'aide de $\varphi$, et en déduire un équivalent de $u_{n}$.

    **3.** En déduire que $f$ est intégrable sur $[0, +\infty[$ si et seulement si $\alpha > 2\beta + 2$.

    **4.** Que vaut $f(n\pi)$ ? Commenter, en lien avec l'exercice 5.
  corrige: |
    La fonction est positive : son intégrabilité équivaut à la convergence de la série des intégrales sur les tranches $[n\pi, (n + 1)\pi]$, chacune estimée grâce à la $\pi$-périodicité de $\sin^{2}$.

    **1.** Par la symétrie $t \mapsto \pi - t$, puis $u = \tan t$, avec $\sin^{2}t = \frac{u^{2}}{1 + u^{2}}$ : 
    $$\varphi(y) = 2\int_{0}^{\pi/2} \frac{\mathrm{d} t}{1 + y\sin^{2}t} = 2\int_{0}^{+\infty} \frac{\mathrm{d} u}{1 + (1 + y)u^{2}}, \qquad \boxed{\varphi(y) = \frac{\pi}{\sqrt{1 + y}}}$$

    **2.** Sur $[n\pi, (n + 1)\pi]$, on encadre $x^{\beta}$ et $x^{\alpha}$ par leurs valeurs aux extrémités ; par $\pi$-périodicité, $\int_{n\pi}^{(n + 1)\pi} \frac{\mathrm{d} x}{1 + c\sin^{2}x} = \varphi(c)$. Ainsi 
    $$(n\pi)^{\beta}\varphi\big(((n + 1)\pi)^{\alpha}\big) \leqslant u_{n} \leqslant ((n + 1)\pi)^{\beta}\varphi\big((n\pi)^{\alpha}\big),$$
     et les deux bornes sont équivalentes à $\frac{\pi(n\pi)^{\beta}}{(n\pi)^{\alpha/2}}$. 
    $$\boxed{u_{n} \sim \pi^{1 + \beta - \alpha/2}\,n^{\beta - \alpha/2}}$$

    **3.** Comme $f \geqslant 0$, l'intégrale partielle est croissante, et $\int_{0}^{N\pi} f = \sum_{n < N} u_{n}$ : $f$ est intégrable si et seulement si $\sum u_{n}$ converge, c'est-à-dire si $\frac{\alpha}{2} - \beta > 1$. 
    $$\boxed{f \text{ intégrable} \iff \alpha > 2\beta + 2}$$

    **4.** On a $f(n\pi) = (n\pi)^{\beta} \to +\infty$. Pour $\alpha > 2\beta + 2$, par exemple $\alpha = 5$ et $\beta = 1$, $f$ est continue, positive, intégrable et non bornée. Le phénomène est celui de l'exercice 5 (question 4), mais avec une seule formule : les pics sont produits par les zéros de $\sin$, de hauteur $x^{\beta}$ et de largeur de l'ordre de $x^{-\alpha/2}$.
