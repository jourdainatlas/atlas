    *Une inégalité de Wirtinger.* Soit $f : [0, 1] \to \mathbb{R}$ de classe $\mathcal{C}^{1}$, telle que $f(0) = f(1) = 0$.

    **1.** Montrer que $\displaystyle \int_{0}^{1} f(t)f'(t)\operatorname{cotan}(\pi t)\,\mathrm{d} t$ et $\displaystyle \int_{0}^{1} \frac{f(t)^{2}}{\sin^{2}(\pi t)}\,\mathrm{d} t$ convergent.

    **2.** En développant $\displaystyle \int_{0}^{1} \big(f'(t) - \pi\operatorname{cotan}(\pi t)f(t)\big)^{2}\,\mathrm{d} t$, montrer que 
    $$\pi^{2}\int_{0}^{1} f^{2} \leqslant \int_{0}^{1} f'^{2}.$$

    **3.** Déterminer les cas d'égalité, et comparer avec l'inégalité de Wirtinger de l'exercice 15 de la feuille du chapitre 11.
  corrige: |
    On développe un carré positif, puis une intégration par parties transforme le terme croisé ; l'identité $\frac{1}{\sin^{2}} - \cot^{2} = 1$ fait le reste.

    **1.** Comme $f(0) = 0$ et $f$ est de classe $\mathcal{C}^{1}$, $f(t) = O(t)$ en $0$ ; et $\operatorname{cotan}(\pi t) \sim \frac{1}{\pi t}$, $\sin(\pi t) \sim \pi t$. Les deux intégrandes sont donc bornées au voisinage de $0$ ; de même en $1$, avec $f(t) = O(1 - t)$. 
    $$\boxed{\text{intégrales faussement généralisées}}$$

    **2.** Avec $\big(\operatorname{cotan}(\pi t)\big)' = -\frac{\pi}{\sin^{2}(\pi t)}$, et des crochets $f(t)^{2}\operatorname{cotan}(\pi t) = O(t)$ qui tendent vers $0$ aux deux bornes, 
    $$2\pi\int_{0}^{1} ff'\operatorname{cotan}(\pi t)\,\mathrm{d} t = \Big[\pi f^{2}\operatorname{cotan}(\pi t)\Big]_{0}^{1} + \pi^{2}\int_{0}^{1} \frac{f^{2}}{\sin^{2}(\pi t)}\,\mathrm{d} t = \pi^{2}\int_{0}^{1} \frac{f^{2}}{\sin^{2}(\pi t)}\,\mathrm{d} t.$$
     En développant le carré, on obtient 
    $$0 \leqslant \int_{0}^{1} \big(f' - \pi\operatorname{cotan}(\pi t)f\big)^{2} = \int_{0}^{1} f'^{2} - \pi^{2}\int_{0}^{1} f^{2}\Big(\frac{1}{\sin^{2}(\pi t)} - \operatorname{cotan}^{2}(\pi t)\Big) = \int_{0}^{1} f'^{2} - \pi^{2}\int_{0}^{1} f^{2}.$$

    $$\boxed{\pi^{2}\int_{0}^{1} f^{2} \leqslant \int_{0}^{1} f'^{2}}$$

    **3.** Il y a égalité si et seulement si la fonction continue et positive $(f' - \pi\operatorname{cotan}(\pi t)f)^{2}$ est nulle sur $]0, 1[$, c'est-à-dire si $\big(\frac{f(t)}{\sin(\pi t)}\big)' = 0$. 
    $$\boxed{\text{égalité ssi } f(t) = C\sin(\pi t)}$$

    *Comparaison.* En prolongeant $f$ en une fonction impaire et $2$-périodique, on obtient une fonction continue, de classe $\mathcal{C}^{1}$ par morceaux et de moyenne nulle : l'inégalité de Wirtinger pour la période $T = 2$ (exercice 15 de la feuille du chapitre 11) donne exactement la même constante $\frac{4\pi^{2}}{T^{2}} = \pi^{2}$. La preuve présente évite les séries de Fourier.
- id: "mp-12-38"
  feuille: "f-mp-12"
  numero: 38
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [synthèse, "nature d'une intégrale", intégrabilité, relations de comparaison]
  noeuds: [ri-integrable, ar-asymptotique]
  notions: [integrale-convergente]
  page_enonce: 11
  page_corrige: 28
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par un renvoi précis au cours ou par un contre-exemple. Les fonctions considérées sont continues.

    **1.** Si $\displaystyle \int_{0}^{+\infty} f$ converge, alors $f$ tend vers $0$ en $+\infty$.

    **2.** Si $f$ est positive, décroissante et intégrable sur $[0, +\infty[$, alors $f(x) = o\big(\frac{1}{x}\big)$ en $+\infty$.

    **3.** Si $f$ et $g$ sont intégrables sur $I$, alors $fg$ est intégrable sur $I$.

    **4.** Si $f$ est intégrable et bornée sur $[1, +\infty[$, alors $f^{2}$ est intégrable sur $[1, +\infty[$.

    **5.** Si les intégrales de $f$ et de $g$ sur $[a, b[$ convergent, celle de $f + g$ converge.

    **6.** Si l'intégrale de $f + g$ sur $[a, b[$ converge, celles de $f$ et de $g$ convergent.

    **7.** Si $f \underset{+\infty}{\sim} g$ et si $\displaystyle \int_{1}^{+\infty} g$ converge, alors $\displaystyle \int_{1}^{+\infty} f$ converge.

    **8.** Si $f$ a une limite finie en $0$, alors $f$ est intégrable sur $]0, 1]$.

    **9.** Si $f$ est intégrable sur $[0, +\infty[$, alors $\displaystyle \int_{x}^{x + 1} f \xrightarrow[x \to +\infty]{} 0$.

    **10.** Si $f$ est positive sur $[0, +\infty[$ et si $\displaystyle x \mapsto \int_{0}^{x} f$ est bornée, alors $f$ est intégrable sur $[0, +\infty[$.
  corrige: |
    Chaque affirmation se rattache à un énoncé précis du cours ou à un exercice de la feuille.

    **1. Faux.** La fonction de l'exercice 5 (question 4), continue et positive, a une intégrale convergente et vaut $1$ en chaque entier $n \geqslant 2$.

    **2. Vrai.** C'est l'exercice 5, question 3.

    **3. Faux.** La fonction $t \mapsto \frac{1}{\sqrt{t}}$ est intégrable sur $]0, 1]$, son carré ne l'est pas (remarque de la section 12.3).

    **4. Vrai.** Si $|f| \leqslant M$, alors $f^{2} \leqslant M|f|$, intégrable (proposition 3 (i)).

    **5. Vrai.** C'est la linéarité, proposition 1 (i).

    **6. Faux.** Les intégrales de $\frac{1}{t}$ et de $-\frac{1}{t + 1}$ divergent sur $[1, +\infty[$, celle de leur somme converge (remarque de la section 12.2).

    **7. Faux.** L'exercice 10 donne $g = \frac{\sin x}{\sqrt{x}}$ et $f = \frac{\sin x}{\sqrt{x} + \sin x}$, équivalentes, avec $\int g$ convergente et $\int f$ divergente : le théorème 3 exige une fonction de référence positive.

    **8. Vrai.** La fonction se prolonge par continuité sur $[0, 1]$, segment sur lequel elle est intégrable.

    **9. Vrai.** C'est l'exercice 5, question 2 : l'intégrabilité entraîne la convergence (théorème 2).

    **10. Vrai.** C'est la proposition 2 (i) : $f$ est positive, donc égale à $|f|$.

    $$\boxed{\text{vrai : } 2, 4, 5, 8, 9, 10 \qquad \text{faux : } 1, 3, 6, 7}$$
