  notions: [integrale-convergente, arc-tangente, cosinus-sinus]
  source: "TD 7 (Sainte-Geneviève), exercice 8 (i), (ii), (iii), (v), (vi) ; Feuille d'exercices #02 (Prost), exercices 23 (I1, I2, K3) et 25 ; BibM@th, Intégrales impropres, exercice 17"
  page_enonce: 4
  page_corrige: 10
  enonce: |
    Justifier la convergence, puis calculer les intégrales suivantes. 
    $$\text{(a)} \ \int_{1}^{+\infty} \mathrm{e}^{-\sqrt{t}}\,\mathrm{d} t, \qquad \text{(b)} \ \int_{0}^{1} \frac{\ln(1 - t^{2})}{t^{2}}\,\mathrm{d} t, \qquad \text{(c)} \ \int_{1}^{+\infty} \frac{\operatorname{Arctan} t}{t^{2}}\,\mathrm{d} t,$$

    $$\text{(d)} \ \int_{0}^{\pi/2} \sin(x)\ln(\sin x)\,\mathrm{d} x, \qquad \text{(e)} \ \int_{0}^{+\infty} \frac{\mathrm{d} x}{(x + 1)\sqrt[3]{x}}, \qquad \text{(f)} \ \int_{0}^{1} \frac{\ln(1 - t)}{(1 + t)^{2}}\,\mathrm{d} t,$$

    $$\text{(g)} \ \int_{1}^{+\infty} \Big(\frac{1}{t} - \operatorname{Arctan}\frac{1}{t}\Big)\mathrm{d} t, \qquad \text{(h)} \ \int_{0}^{1} \frac{t^{3}}{\sqrt{1 - t^{2}}}\,\mathrm{d} t,$$

    $$\text{(i)} \ \int_{0}^{+\infty} \mathrm{e}^{-pt}\cos(\omega t)\,\mathrm{d} t \ \ (p > 0, \ \omega \in \mathbb{R}), \qquad \text{(j)} \ \int_{0}^{+\infty} \mathrm{e}^{-t}|\sin t|\,\mathrm{d} t.$$
  corrige: |
    Pour chaque intégrale, on justifie d'abord la convergence par un équivalent aux bornes, puis on calcule par une primitive, une intégration par parties (théorème 4) ou un changement de variable (théorème 5).

    **(a)** La fonction est $o\big(\frac{1}{t^{2}}\big)$ en $+\infty$. Le changement de variable $t = u^{2}$ puis une intégration par parties donnent 
    $$\int_{1}^{+\infty} \mathrm{e}^{-\sqrt{t}}\,\mathrm{d} t = \int_{1}^{+\infty} 2u\mathrm{e}^{-u}\,\mathrm{d} u = \Big[-2(u + 1)\mathrm{e}^{-u}\Big]_{1}^{+\infty}, \qquad \boxed{\frac{4}{\mathrm{e}}}$$

    **(b)** En $0$, $\frac{\ln(1 - t^{2})}{t^{2}} \to -1$ ; en $1$, l'intégrande est équivalente à $\ln(1 - t)$, intégrable. On intègre par parties avec la primitive $v(t) = 1 - \frac{1}{t} = \frac{t - 1}{t}$ de $\frac{1}{t^{2}}$, choisie nulle en $1$ : le produit $\frac{t - 1}{t}\ln(1 - t^{2})$ tend vers $0$ en $1$ et en $0$. Comme $\frac{t - 1}{t}\cdot\frac{-2t}{1 - t^{2}} = \frac{2}{1 + t}$, 
    $$\int_{0}^{1} \frac{\ln(1 - t^{2})}{t^{2}}\,\mathrm{d} t = -\int_{0}^{1} \frac{2}{1 + t}\,\mathrm{d} t, \qquad \boxed{-2\ln 2}$$

    **(c)** L'intégrande est en $O\big(\frac{1}{t^{2}}\big)$. Par parties, puis avec $\frac{1}{t(1 + t^{2})} = \frac{1}{t} - \frac{t}{1 + t^{2}}$, 
    $$\int_{1}^{+\infty} \frac{\operatorname{Arctan} t}{t^{2}}\,\mathrm{d} t = \Big[-\frac{\operatorname{Arctan} t}{t}\Big]_{1}^{+\infty} + \int_{1}^{+\infty} \frac{\mathrm{d} t}{t(1 + t^{2})} = \frac{\pi}{4} + \Big[\ln\frac{t}{\sqrt{1 + t^{2}}}\Big]_{1}^{+\infty}, \qquad \boxed{\frac{\pi}{4} + \frac{\ln 2}{2}}$$

    **(d)** L'intégrande tend vers $0$ en $0$ : l'intégrale est faussement généralisée. Le changement de variable $u = \cos x$, puis $\ln(1 - u^{2}) = \ln(1 - u) + \ln(1 + u)$, donnent 
    $$\int_{0}^{\pi/2} \sin(x)\ln(\sin x)\,\mathrm{d} x = \frac{1}{2}\int_{0}^{1} \ln(1 - u^{2})\,\mathrm{d} u = \frac{1}{2}\big((-1) + (2\ln 2 - 1)\big), \qquad \boxed{\ln 2 - 1}$$

    **(e)** En $0$, l'intégrande est équivalente à $x^{-1/3}$ ; en $+\infty$, à $x^{-4/3}$. Le changement de variable $x = t^{3}$ donne $3\int_{0}^{+\infty} \frac{t\,\mathrm{d} t}{1 + t^{3}}$, et la décomposition 
    $$\frac{t}{1 + t^{3}} = -\frac{1}{3(t + 1)} + \frac{1}{6}\cdot\frac{2t - 1}{t^{2} - t + 1} + \frac{1}{2}\cdot\frac{1}{(t - \frac{1}{2})^{2} + \frac{3}{4}}$$
     fournit sur $[0, X]$ une somme de logarithmes, égale à $\frac{1}{6}\ln\frac{X^{2} - X + 1}{(X + 1)^{2}}$ et de limite nulle, et le terme 
    $$\frac{1}{\sqrt{3}}\Big[\operatorname{Arctan}\frac{2t - 1}{\sqrt{3}}\Big]_{0}^{X} \xrightarrow[X \to +\infty]{} \frac{1}{\sqrt{3}}\cdot\frac{2\pi}{3}.$$

    $$\boxed{\frac{2\pi}{\sqrt{3}}}$$
     L'exercice 14 retrouvera cette valeur par symétrie.

    **(f)** En $1$, l'intégrande est équivalente à $\frac{1}{4}\ln(1 - t)$, intégrable. On intègre par parties avec la primitive $v(t) = \frac{1}{2} - \frac{1}{1 + t} = \frac{t - 1}{2(1 + t)}$ de $\frac{1}{(1 + t)^{2}}$, nulle en $1$ : 
    $$\int_{0}^{1} \frac{\ln(1 - t)}{(1 + t)^{2}}\,\mathrm{d} t = -\int_{0}^{1} \frac{t - 1}{2(1 + t)}\cdot\frac{-1}{1 - t}\,\mathrm{d} t = -\int_{0}^{1} \frac{\mathrm{d} t}{2(1 + t)}, \qquad \boxed{-\frac{\ln 2}{2}}$$

    **(g)** En $+\infty$, $\frac{1}{t} - \operatorname{Arctan}\frac{1}{t} \sim \frac{1}{3t^{3}}$. Une primitive de $\operatorname{Arctan}\frac{1}{t}$ sur $]0, +\infty[$ est $t\operatorname{Arctan}\frac{1}{t} + \frac{1}{2}\ln(1 + t^{2})$, ce qui se vérifie en dérivant. Sur $[1, X]$, l'intégrale vaut 
    $$\ln\frac{X}{\sqrt{1 + X^{2}}} - X\operatorname{Arctan}\frac{1}{X} + \frac{\pi}{4} + \frac{\ln 2}{2} \xrightarrow[X \to +\infty]{} 0 - 1 + \frac{\pi}{4} + \frac{\ln 2}{2}, \qquad \boxed{\frac{\pi}{4} + \frac{\ln 2}{2} - 1}$$

    **(h)** En $1$, l'intégrande est équivalente à $\frac{1}{\sqrt{2}\sqrt{1 - t}}$. Le changement de variable $t = \sin\theta$ donne $\int_{0}^{\pi/2} \sin^{3}\theta\,\mathrm{d}\theta = \big[-\cos\theta + \frac{\cos^{3}\theta}{3}\big]_{0}^{\pi/2}$. 
    $$\boxed{\frac{2}{3}}$$

    **(i)** L'intégrande est dominée par $\mathrm{e}^{-pt}$. On passe par l'exponentielle complexe : 
    $$\int_{0}^{+\infty} \mathrm{e}^{(-p + \mathrm{i}\omega)t}\,\mathrm{d} t = \frac{1}{p - \mathrm{i}\omega} = \frac{p + \mathrm{i}\omega}{p^{2} + \omega^{2}}, \qquad \boxed{\int_{0}^{+\infty} \mathrm{e}^{-pt}\cos(\omega t)\,\mathrm{d} t = \frac{p}{p^{2} + \omega^{2}}}$$
     et la partie imaginaire donne au passage $\int_{0}^{+\infty} \mathrm{e}^{-pt}\sin(\omega t)\,\mathrm{d} t = \frac{\omega}{p^{2} + \omega^{2}}$.

    **(j)** La fonction est positive et dominée par $\mathrm{e}^{-t}$. Sur $[k\pi, (k + 1)\pi]$, le changement de variable $t = u + k\pi$ et (i) donnent $\int_{k\pi}^{(k + 1)\pi} \mathrm{e}^{-t}|\sin t|\,\mathrm{d} t = \mathrm{e}^{-k\pi}\int_{0}^{\pi} \mathrm{e}^{-u}\sin u\,\mathrm{d} u = \mathrm{e}^{-k\pi}\frac{1 + \mathrm{e}^{-\pi}}{2}$. L'intégrale partielle étant croissante, sa limite est celle de la suite des $F(N\pi)$, somme d'une série géométrique : 
    $$\int_{0}^{+\infty} \mathrm{e}^{-t}|\sin t|\,\mathrm{d} t = \frac{1 + \mathrm{e}^{-\pi}}{2(1 - \mathrm{e}^{-\pi})}, \qquad \boxed{\frac{1}{2}\coth\frac{\pi}{2}}$$
- id: "mp-12-13"
