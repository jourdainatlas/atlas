  source: "Feuille d'exercices #02 (Prost), exercices 31, 32 et 33 ; TD 7 (Sainte-Geneviève), exercice 40"
  page_enonce: 5
  page_corrige: 15
  enonce: |
    *Intégrales de Frullani.* Soit $0 < a < b$ et $f : [0, +\infty[ \to \mathbb{R}$ continue.

    **1.** Montrer que $\displaystyle \int_{a\varepsilon}^{b\varepsilon} \frac{f(t)}{t}\,\mathrm{d} t \xrightarrow[\varepsilon \to 0^{+}]{} f(0)\ln\frac{b}{a}$.

    **2.** On suppose que $\displaystyle \int_{1}^{+\infty} \frac{f(t)}{t}\,\mathrm{d} t$ converge. Montrer que $\displaystyle \int_{0}^{+\infty} \frac{f(ax) - f(bx)}{x}\,\mathrm{d} x$ converge et vaut $f(0)\ln\frac{b}{a}$.

    **3.** En déduire les valeurs de $\displaystyle \int_{0}^{+\infty} \frac{\mathrm{e}^{-ax} - \mathrm{e}^{-bx}}{x}\,\mathrm{d} x$, de $\displaystyle \int_{0}^{+\infty} \frac{\cos(ax) - \cos(bx)}{x}\,\mathrm{d} x$ et de $\displaystyle \int_{0}^{1} \frac{x - 1}{\ln x}\,\mathrm{d} x$.
  corrige: |
    On transforme l'intégrale de la différence en une différence de deux intégrales décalées, dont seules subsistent des « tranches » $[a\varepsilon, b\varepsilon]$ et $[aX, bX]$.

    **1.** Comme $\int_{a\varepsilon}^{b\varepsilon} \frac{\mathrm{d} t}{t} = \ln\frac{b}{a}$, 
    $$\Big|\int_{a\varepsilon}^{b\varepsilon} \frac{f(t)}{t}\,\mathrm{d} t - f(0)\ln\frac{b}{a}\Big| \leqslant \sup_{[a\varepsilon, b\varepsilon]} |f - f(0)|\cdot\ln\frac{b}{a} \xrightarrow[\varepsilon \to 0^{+}]{} 0$$
     par continuité de $f$ en $0$. 
    $$\boxed{\int_{a\varepsilon}^{b\varepsilon} \frac{f(t)}{t}\,\mathrm{d} t \to f(0)\ln\frac{b}{a}}$$

    **2.** Pour $0 < \varepsilon < X$, les changements de variable $t = ax$ et $t = bx$ donnent 
    $$\int_{\varepsilon}^{X} \frac{f(ax) - f(bx)}{x}\,\mathrm{d} x = \int_{a\varepsilon}^{aX} \frac{f(t)}{t}\,\mathrm{d} t - \int_{b\varepsilon}^{bX} \frac{f(t)}{t}\,\mathrm{d} t = \int_{a\varepsilon}^{b\varepsilon} \frac{f(t)}{t}\,\mathrm{d} t - \int_{aX}^{bX} \frac{f(t)}{t}\,\mathrm{d} t.$$
     Le second terme est la différence de deux intégrales partielles de $\int_{1}^{+\infty} \frac{f}{t}$, qui converge : il tend vers $0$ quand $X \to +\infty$. Le premier tend vers $f(0)\ln\frac{b}{a}$, indépendamment. 
    $$\boxed{\int_{0}^{+\infty} \frac{f(ax) - f(bx)}{x}\,\mathrm{d} x = f(0)\ln\frac{b}{a}}$$

    **3.** Pour $f(t) = \mathrm{e}^{-t}$ et $f = \cos$, l'intégrale $\int_{1}^{+\infty} \frac{f(t)}{t}\,\mathrm{d} t$ converge (la seconde par intégration par parties). Pour la troisième, le changement de variable $x = \mathrm{e}^{-u}$ donne $\int_{0}^{+\infty} \frac{\mathrm{e}^{-u} - \mathrm{e}^{-2u}}{u}\,\mathrm{d} u$ ; l'intégrande initiale se prolonge par continuité en $0$ et en $1$. 
    $$\boxed{\int_{0}^{+\infty} \frac{\mathrm{e}^{-ax} - \mathrm{e}^{-bx}}{x}\,\mathrm{d} x = \ln\frac{b}{a}, \qquad \int_{0}^{+\infty} \frac{\cos(ax) - \cos(bx)}{x}\,\mathrm{d} x = \ln\frac{b}{a}, \qquad \int_{0}^{1} \frac{x - 1}{\ln x}\,\mathrm{d} x = \ln 2}$$

    *Piège.* Écrire $\int \frac{f(ax)}{x} - \int \frac{f(bx)}{x}$ est interdit : chacune diverge en $0$ dès que $f(0) \neq 0$. C'est la compensation des deux divergences qui produit le $\ln\frac{b}{a}$.
- id: "mp-12-20"
  feuille: "f-mp-12"
  numero: 20
  partie: "Calcul des intégrales"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [calcul des intégrales, "nature d'une intégrale"]
  noeuds: [ri-proprietes, ri-integrable]
  notions: [integrale-convergente]
  source: "Feuille d'exercices #02 (Prost), exercices 37 et 38 ; BibM@th, Intégrales impropres, exercice 9 ; TD 7 (Sainte-Geneviève), exercices 76 et 77"
  page_enonce: 6
  page_corrige: 16
  enonce: |
    *Convergence sans intégrabilité.*

    **1.** Soit $f : [1, +\infty[ \to \mathbb{R}$ continue, dont l'intégrale sur $[1, +\infty[$ converge. Montrer que, pour tout $\alpha > 0$, $\displaystyle \int_{1}^{+\infty} \frac{f(t)}{t^{\alpha}}\,\mathrm{d} t$ converge. On pourra introduire la fonction $\displaystyle F : x \mapsto \int_{1}^{x} f$.

    **2.** Soit $f : [0, +\infty[ \to \mathbb{R}$ continue et $s_{0} \in \mathbb{R}$ tels que $\displaystyle \int_{0}^{+\infty} f(t)\mathrm{e}^{-s_{0}t}\,\mathrm{d} t$ converge. Montrer que $\displaystyle \int_{0}^{+\infty} f(t)\mathrm{e}^{-st}\,\mathrm{d} t$ converge pour tout $s > s_{0}$.

    **3.** La question 1 s'applique-t-elle à $f = \sin$ ? Montrer néanmoins, en adaptant la démonstration, que $\displaystyle \int_{1}^{+\infty} \frac{\sin t}{t^{\alpha}}\,\mathrm{d} t$ converge pour tout $\alpha > 0$.

    **4.** Montrer que $\displaystyle \int_{0}^{+\infty} \mathrm{e}^{t}\sin(\mathrm{e}^{t})\,\mathrm{e}^{-st}\,\mathrm{d} t$ converge pour tout $s \geqslant 1$, bien que la fonction $t \mapsto \mathrm{e}^{t}\sin(\mathrm{e}^{t})$ ne soit pas bornée.
  corrige: |
    C'est la méthode dite « primitiver l'oscillation, dériver l'amortissement » : une intégration par parties ne demande que le caractère borné d'une primitive.

    **1.** La fonction $F$ a une limite finie en $+\infty$, donc elle est bornée, par $M$ disons. Pour $X > 1$, 
    $$\int_{1}^{X} \frac{f(t)}{t^{\alpha}}\,\mathrm{d} t = \frac{F(X)}{X^{\alpha}} + \alpha\int_{1}^{X} \frac{F(t)}{t^{\alpha + 1}}\,\mathrm{d} t.$$
     Le crochet tend vers $0$, et $\big|\frac{F(t)}{t^{\alpha + 1}}\big| \leqslant \frac{M}{t^{\alpha + 1}}$, intégrable. 
    $$\boxed{\int_{1}^{+\infty} \frac{f(t)}{t^{\alpha}}\,\mathrm{d} t \text{ converge}}$$

    **2.** On applique la même méthode à $g(t) = f(t)\mathrm{e}^{-s_{0}t}$, de primitive $G$ bornée, et à l'amortissement $\mathrm{e}^{-(s - s_{0})t}$, décroissant de limite nulle : 
    $$\int_{0}^{X} f(t)\mathrm{e}^{-st}\,\mathrm{d} t = G(X)\mathrm{e}^{-(s - s_{0})X} + (s - s_{0})\int_{0}^{X} G(t)\mathrm{e}^{-(s - s_{0})t}\,\mathrm{d} t,$$

    $$\boxed{\int_{0}^{+\infty} f(t)\mathrm{e}^{-st}\,\mathrm{d} t \text{ converge pour tout } s > s_{0}}$$

    **3.** L'intégrale $\int_{1}^{+\infty} \sin t\,\mathrm{d} t$ diverge : la question 1 ne s'applique pas telle quelle. Mais sa démonstration n'utilise que le caractère borné de $F$, et ici $F(x) = \cos 1 - \cos x$ est bornée par $2$. 
    $$\boxed{\int_{1}^{+\infty} \frac{\sin t}{t^{\alpha}}\,\mathrm{d} t \text{ converge pour } \alpha > 0}$$

    **4.** Pour $s = 1$, le changement de variable $u = \mathrm{e}^{t}$ donne $\int_{0}^{X} \sin(\mathrm{e}^{t})\,\mathrm{d} t = \int_{1}^{\mathrm{e}^{X}} \frac{\sin u}{u}\,\mathrm{d} u$, qui converge. La question 2, avec $s_{0} = 1$, traite $s > 1$. 
    $$\boxed{\text{convergence pour tout } s \geqslant 1}$$

    *Commentaire.* La question 2 dit que l'ensemble des $s$ pour lesquels l'intégrale converge est un intervalle non majoré : c'est le domaine de la transformée de Laplace de $f$, que le chapitre 13 étudiera comme intégrale à paramètre.
- id: "mp-12-21"
