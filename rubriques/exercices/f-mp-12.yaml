  notions: [integrale-convergente]
  source: "BibM@th, Intégrales impropres, exercice 6 ; TD 7 (Sainte-Geneviève), exercices 3 (iv), (ix) et 4 (iv)"
  page_enonce: 2
  page_corrige: 5
  enonce: |
    Étudier la nature des intégrales suivantes, à l'aide de développements asymptotiques. 
    $$\text{(a)} \ \int_{0}^{+\infty} \Big(1 + t\ln\frac{t}{t + 1}\Big)\mathrm{d} t, \qquad \text{(b)} \ \int_{2}^{+\infty} \Big(\sqrt{x^{4} + x^{2} + 1} - x\sqrt[3]{x^{3} + ax}\Big)\mathrm{d} x \quad (a \in \mathbb{R}),$$

    $$\text{(c)} \ \int_{0}^{+\infty} \mathrm{e}^{-t}\Big(\frac{1}{1 - \mathrm{e}^{-t}} - \frac{1}{t}\Big)\mathrm{d} t, \qquad \text{(d)} \ \int_{2/\pi}^{+\infty} \ln\Big(\cos\frac{1}{t}\Big)\mathrm{d} t,$$

    $$\text{(e)} \ \int_{1}^{+\infty} \frac{\sqrt{x^{2} + x + 1} - \sqrt{x^{2} - x + 1}}{x}\,\mathrm{d} x, \qquad \text{(f)} \ \int_{0}^{+\infty} \Big(\sqrt[4]{x^{4} + 1} - \sqrt[3]{x^{3} + 1}\Big)\mathrm{d} x.$$
  corrige: |
    Il faut ici pousser un développement asymptotique jusqu'au premier terme non nul, qui donne le signe et l'équivalent.

    **(a)** En $0$, $t\ln\frac{t}{t + 1} \to 0$ : la fonction se prolonge par continuité. En $+\infty$, 
    $$\ln\frac{t}{t + 1} = -\ln\Big(1 + \frac{1}{t}\Big) = -\frac{1}{t} + \frac{1}{2t^{2}} + O\Big(\frac{1}{t^{3}}\Big), \qquad\text{d'où}\qquad 1 + t\ln\frac{t}{t + 1} = \frac{1}{2t} + O\Big(\frac{1}{t^{2}}\Big) \sim \frac{1}{2t}.$$

    $$\boxed{\text{diverge}}$$

    **(b)** On factorise $x^{2}$ : 
    $$\sqrt{x^{4} + x^{2} + 1} = x^{2}\Big(1 + \frac{1}{x^{2}} + \frac{1}{x^{4}}\Big)^{1/2} = x^{2} + \frac{1}{2} + O\Big(\frac{1}{x^{2}}\Big),$$

    $$x\sqrt[3]{x^{3} + ax} = x^{2}\Big(1 + \frac{a}{x^{2}}\Big)^{1/3} = x^{2} + \frac{a}{3} + O\Big(\frac{1}{x^{2}}\Big).$$
     La différence vaut $\frac{1}{2} - \frac{a}{3} + O\big(\frac{1}{x^{2}}\big)$. Si $a \neq \frac{3}{2}$, elle tend vers une constante non nulle, et l'intégrale diverge ; si $a = \frac{3}{2}$, elle est en $O\big(\frac{1}{x^{2}}\big)$. 
    $$\boxed{\text{converge} \iff a = \frac{3}{2}}$$

    **(c)** En $0$, $1 - \mathrm{e}^{-t} = t - \frac{t^{2}}{2} + O(t^{3})$, d'où $\frac{1}{1 - \mathrm{e}^{-t}} = \frac{1}{t} + \frac{1}{2} + O(t)$ : la fonction a une limite finie, $\frac{1}{2}$. En $+\infty$, elle est équivalente à $\mathrm{e}^{-t}$. 
    $$\boxed{\text{converge}}$$
     L'exercice 30 montrera que sa valeur est la constante d'Euler $\gamma$.

    **(d)** Il y a deux bornes à problème. En $\frac{2}{\pi}$, $\cos\frac{1}{t} = \sin\big(\frac{\pi}{2} - \frac{1}{t}\big)$ et $\frac{\pi}{2} - \frac{1}{t} \sim \frac{\pi^{2}}{4}\big(t - \frac{2}{\pi}\big)$, donc $\ln\cos\frac{1}{t} = \ln\big(t - \frac{2}{\pi}\big) + O(1)$, intégrable comme $\ln$ en $0$. En $+\infty$, $\ln\cos\frac{1}{t} \sim -\frac{1}{2t^{2}}$. 
    $$\boxed{\text{converge}}$$

    **(e)** Par la quantité conjuguée, le numérateur vaut $\frac{2x}{\sqrt{x^{2} + x + 1} + \sqrt{x^{2} - x + 1}} \to 1$ : l'intégrande est équivalente à $\frac{1}{x}$. 
    $$\boxed{\text{diverge}}$$

    **(f)** En $+\infty$, $\sqrt[4]{x^{4} + 1} = x + \frac{1}{4x^{3}} + o\big(\frac{1}{x^{3}}\big)$ et $\sqrt[3]{x^{3} + 1} = x + \frac{1}{3x^{2}} + o\big(\frac{1}{x^{2}}\big)$ : la différence est équivalente à $-\frac{1}{3x^{2}}$. 
    $$\boxed{\text{converge}}$$

    *Piège.* En (d), la borne $\frac{2}{\pi}$ est elle-même singulière, puisque $\cos\frac{\pi}{2} = 0$ ; ne regarder que $+\infty$ conduirait à une conclusion juste par chance.
- id: "mp-12-08"
  feuille: "f-mp-12"
  numero: 8
  partie: "Fonctions intégrables"
  etoiles: 2
