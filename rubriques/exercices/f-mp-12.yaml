  source: "Feuille d'exercices #02 (Prost), exercices 41 et 44 ; BibM@th, Intégrales impropres, exercices 36 et 37 ; TD 7 (Sainte-Geneviève), exercice 18"
  page_enonce: 6
  page_corrige: 17
  enonce: |
    *Limites et équivalents en un point.*

    **1.** Donner un équivalent en $0$ de $\displaystyle \int_{0}^{x} \frac{\operatorname{Arctan} t}{t}\,\mathrm{d} t$.

    **2.** En écrivant $\operatorname{Arccos}$ comme une intégrale, donner un équivalent de $\operatorname{Arccos} x$ quand $x \to 1^{-}$.

    **3.** Montrer que $\displaystyle \int_{0}^{+\infty} \frac{\mathrm{e}^{-tx^{2}}}{1 + t^{3}}\,\mathrm{d} t \underset{x \to +\infty}{=} O\Big(\frac{1}{x^{2}}\Big)$.

    **4.** Déterminer $\displaystyle \lim\limits_{x \to 0^{+}} \int_{x}^{2x} \frac{\mathrm{e}^{t}}{\operatorname{Arcsin} t}\,\mathrm{d} t$ et $\displaystyle \lim\limits_{x \to 0^{+}} \int_{x}^{3x} \frac{\sin t}{t^{2}}\,\mathrm{d} t$.

    **5.** Généraliser : pour $k > 0$ et $f : \mathbb{R} \to \mathbb{R}$ dérivable telle que $f(0) = 0$ et $f'(0) \neq 0$, déterminer $\displaystyle \lim\limits_{x \to 0^{+}} \int_{x}^{kx} \frac{\mathrm{d} t}{f(t)}$.
  corrige: |
    On isole la partie principale de la fonction intégrée, dont l'intégrale se calcule, et l'on contrôle le reste.

    **1.** La fonction $t \mapsto \frac{\operatorname{Arctan} t}{t}$, prolongée par $1$ en $0$, est continue : le théorème 7, à la borne $0$ et avec $g = 1$, donne $\int_{0}^{x} \frac{\operatorname{Arctan} t}{t}\,\mathrm{d} t \sim \int_{0}^{x} 1$. 
    $$\boxed{\sim x}$$

    **2.** On a $\operatorname{Arccos} x = \int_{x}^{1} \frac{\mathrm{d} t}{\sqrt{1 - t^{2}}}$, et $\frac{1}{\sqrt{1 - t^{2}}} = \frac{1}{\sqrt{1 - t}\sqrt{1 + t}} \sim \frac{1}{\sqrt{2}\sqrt{1 - t}}$ en $1$, positive et intégrable. Le théorème 7 (i) compare les restes : 
    $$\operatorname{Arccos} x \underset{x \to 1^{-}}{\sim} \int_{x}^{1} \frac{\mathrm{d} t}{\sqrt{2(1 - t)}}, \qquad \boxed{\operatorname{Arccos} x \underset{1^{-}}{\sim} \sqrt{2(1 - x)}}$$

    **3.** Pour $x > 0$, $0 \leqslant \frac{\mathrm{e}^{-tx^{2}}}{1 + t^{3}} \leqslant \mathrm{e}^{-tx^{2}}$, dont l'intégrale vaut $\frac{1}{x^{2}}$. 
    $$\boxed{O\Big(\frac{1}{x^{2}}\Big)}$$

    **4.** On écrit $\frac{\mathrm{e}^{t}}{\operatorname{Arcsin} t} = \frac{1}{t} + h(t)$ avec $h(t) = \frac{t\mathrm{e}^{t} - \operatorname{Arcsin} t}{t\operatorname{Arcsin} t} = \frac{t^{2} + o(t^{2})}{t^{2}(1 + o(1))} \to 1$ : $h$ est bornée près de $0$, et $\int_{x}^{2x} h \to 0$. De même, $\frac{\sin t}{t^{2}} = \frac{1}{t} + O(t)$. 
    $$\boxed{\lim\limits_{x \to 0^{+}} \int_{x}^{2x} \frac{\mathrm{e}^{t}}{\operatorname{Arcsin} t}\,\mathrm{d} t = \ln 2, \qquad \lim\limits_{x \to 0^{+}} \int_{x}^{3x} \frac{\sin t}{t^{2}}\,\mathrm{d} t = \ln 3}$$

    **5.** Comme $f(t) = f'(0)t + o(t)$ avec $f'(0) \neq 0$, $f$ ne s'annule pas sur un voisinage épointé de $0$, et 
    $$\frac{1}{f(t)} - \frac{1}{f'(0)t} = \frac{f'(0)t - f(t)}{f'(0)t\,f(t)} = o\Big(\frac{1}{t}\Big).$$
     Pour $\varepsilon > 0$ et $x$ assez petit, l'intégrale de ce reste sur le segment d'extrémités $x$ et $kx$ est majorée par $\varepsilon|\ln k|$. 
    $$\boxed{\lim\limits_{x \to 0^{+}} \int_{x}^{kx} \frac{\mathrm{d} t}{f(t)} = \frac{\ln k}{f'(0)}}$$

    *Piège.* La fonction $f$ n'étant que dérivable en $0$, il ne faut pas invoquer un développement à l'ordre $2$ : l'égalité $f(t) = f'(0)t + o(t)$ suffit.
- id: "mp-12-22"
  feuille: "f-mp-12"
  numero: 22
  partie: "Intégration des relations de comparaison"
