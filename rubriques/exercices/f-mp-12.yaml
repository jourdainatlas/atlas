  enonce: |
    *Perspective : l'intégrale de Dirichlet.* Pour $n \in \mathbb{N}$, on pose $\displaystyle I_{n} = \int_{0}^{\pi/2} \frac{\sin\big((2n + 1)x\big)}{\sin x}\,\mathrm{d} x$ et $\displaystyle J_{n} = \int_{0}^{\pi/2} \frac{\sin\big((2n + 1)x\big)}{x}\,\mathrm{d} x$.

    **1.** Justifier l'existence de $I_{n}$ et $J_{n}$. Calculer $I_{n + 1} - I_{n}$, et en déduire $I_{n}$.

    **2.** Montrer que $\varphi : x \mapsto \frac{1}{x} - \frac{1}{\sin x}$ se prolonge en une fonction continue sur $[0, \frac{\pi}{2}]$. À l'aide du lemme de Riemann-Lebesgue (chapitre 11, théorème 1), en déduire que $J_{n} \to \frac{\pi}{2}$.

    **3.** En déduire que $\displaystyle \int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\pi}{2}$.

    **4.** En déduire les valeurs de $\displaystyle \int_{0}^{+\infty} \frac{1 - \cos t}{t^{2}}\,\mathrm{d} t$, de $\displaystyle \int_{0}^{+\infty} \Big(\frac{\sin t}{t}\Big)^{2}\mathrm{d} t$ et, à l'aide de l'exercice 21, de $\displaystyle \int_{0}^{+\infty} \frac{\sin^{3}t}{t^{2}}\,\mathrm{d} t$.

    Le chapitre 13 retrouvera la valeur $\frac{\pi}{2}$ par une intégrale à paramètre.
  corrige: |
    On compare l'intégrale de Dirichlet au noyau de Dirichlet du chapitre 11, dont l'intégrale est explicite, et l'on contrôle l'écart par le lemme de Riemann-Lebesgue.

    **1.** En $0$, les deux intégrandes tendent vers $2n + 1$ : les intégrales sont faussement généralisées. Avec $\sin((2n + 3)x) - \sin((2n + 1)x) = 2\cos((2n + 2)x)\sin x$, 
    $$I_{n + 1} - I_{n} = \int_{0}^{\pi/2} 2\cos\big((2n + 2)x\big)\,\mathrm{d} x = \Big[\frac{\sin((2n + 2)x)}{n + 1}\Big]_{0}^{\pi/2} = 0, \qquad \boxed{I_{n} = I_{0} = \frac{\pi}{2}}$$

    **2.** En $0$, $\frac{1}{x} - \frac{1}{\sin x} = \frac{\sin x - x}{x\sin x} \sim -\frac{x}{6} \to 0$ : $\varphi$ se prolonge par continuité. Le lemme de Riemann-Lebesgue (chapitre 11, théorème 1), appliqué à $\varphi$ sur $[0, \frac{\pi}{2}]$ avec la fréquence $2n + 1$, donne $J_{n} - I_{n} = \int_{0}^{\pi/2} \varphi(x)\sin\big((2n + 1)x\big)\,\mathrm{d} x \to 0$. 
    $$\boxed{J_{n} \to \frac{\pi}{2}}$$

    **3.** Le changement de variable $u = (2n + 1)x$ donne $J_{n} = \int_{0}^{(2n + 1)\pi/2} \frac{\sin u}{u}\,\mathrm{d} u$. Comme l'intégrale converge (proposition 4), cette suite tend vers sa valeur. 
    $$\boxed{\int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\pi}{2}}$$

    **4.** Par parties, avec des crochets nuls aux bornes : 
    $$\int_{0}^{+\infty} \frac{1 - \cos t}{t^{2}}\,\mathrm{d} t = \Big[-\frac{1 - \cos t}{t}\Big]_{0}^{+\infty} + \int_{0}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t,$$

    $$\int_{0}^{+\infty} \frac{\sin^{2}t}{t^{2}}\,\mathrm{d} t = \int_{0}^{+\infty} \frac{\sin(2t)}{t}\,\mathrm{d} t = \int_{0}^{+\infty} \frac{\sin u}{u}\,\mathrm{d} u.$$
     Pour la dernière, on linéarise $\sin^{3}t = \frac{3\sin t - \sin(3t)}{4}$ sur $[x, +\infty[$, puis $u = 3t$ : 
    $$\int_{x}^{+\infty} \frac{\sin^{3}t}{t^{2}}\,\mathrm{d} t = \frac{3}{4}\int_{x}^{+\infty} \frac{\sin t}{t^{2}}\,\mathrm{d} t - \frac{3}{4}\int_{3x}^{+\infty} \frac{\sin u}{u^{2}}\,\mathrm{d} u = \frac{3}{4}\int_{x}^{3x} \frac{\sin t}{t^{2}}\,\mathrm{d} t \xrightarrow[x \to 0^{+}]{} \frac{3}{4}\ln 3$$
     par l'exercice 21 (question 4). 
    $$\boxed{\int_{0}^{+\infty} \frac{1 - \cos t}{t^{2}}\,\mathrm{d} t = \int_{0}^{+\infty} \Big(\frac{\sin t}{t}\Big)^{2}\mathrm{d} t = \frac{\pi}{2}, \qquad \int_{0}^{+\infty} \frac{\sin^{3}t}{t^{2}}\,\mathrm{d} t = \frac{3}{4}\ln 3}$$

    *Piège.* La linéarisation ne peut pas se faire sur $]0, +\infty[$ directement : $\frac{\sin t}{t^{2}}$ et $\frac{\sin 3t}{t^{2}}$ ne sont pas intégrables en $0$. C'est en partant de $x > 0$ que la compensation apparaît.

    *Commentaire.* L'intégrale $\int_{0}^{\pi} \frac{\sin u}{u}\,\mathrm{d} u$ de l'exercice 22 de la feuille du chapitre 11 (phénomène de Gibbs) est l'intégrale partielle au premier maximum : elle dépasse la limite $\frac{\pi}{2}$, comme les sommes de Fourier dépassent le créneau.
