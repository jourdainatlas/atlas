  enonce: |
    On considère $\displaystyle f : x \mapsto \int_{x}^{x^{2}} \frac{\mathrm{d} t}{\ln t}$, définie sur $]0, 1[ \cup ]1, +\infty[$. Montrer que $f$ se prolonge en une fonction de classe $\mathcal{C}^{1}$ sur $\mathbb{R}_{+}$.
  corrige: |
    On calcule la dérivée par le théorème fondamental, puis on étudie les limites de $f$ et de $f'$ en $0$ et en $1$, et l'on conclut par le théorème de la limite de la dérivée (chapitre 9 de MPSI).

    **Définition et dérivée.** Pour $x \in ]0, 1[$, les bornes $x$ et $x^{2}$ sont dans $]0, 1[$, et pour $x > 1$ dans $]1, +\infty[$, où $\frac{1}{\ln}$ est continue. Avec une primitive $L$ de $\frac{1}{\ln}$ sur l'intervalle concerné, $f(x) = L(x^{2}) - L(x)$, d'où 
    $$f'(x) = \frac{2x}{\ln(x^{2})} - \frac{1}{\ln x} = \frac{x - 1}{\ln x}.$$

    **Limites en $1$.** La fonction $h(t) = \frac{t - 1}{\ln t}$ se prolonge par continuité en $1$ par $h(1) = 1$. On écrit $f(x) = \int_{x}^{x^{2}} \frac{h(t)}{t - 1}\,\mathrm{d} t$ ; comme $\frac{1}{t - 1}$ garde un signe constant entre $x$ et $x^{2}$, la formule de la moyenne donne un $c_{x}$ entre $x$ et $x^{2}$ tel que $f(x) = h(c_{x})\ln\frac{x^{2} - 1}{x - 1} = h(c_{x})\ln(x + 1) \to \ln 2$. Et $f'(x) = h(x) \to 1$.

    **Limites en $0$.** Pour $t \in [x^{2}, x]$, $|\ln t| \geqslant |\ln x|$, donc $|f(x)| \leqslant \frac{x - x^{2}}{|\ln x|} \to 0$ ; et $f'(x) = \frac{x - 1}{\ln x} \to 0$.

    **Conclusion.** On pose $f(0) = 0$ et $f(1) = \ln 2$ : $f$ est continue sur $\mathbb{R}_{+}$, de classe $\mathcal{C}^{1}$ hors de $0$ et $1$, et $f'$ a des limites finies en ces points. 
    $$\boxed{f \in \mathcal{C}^{1}(\mathbb{R}_{+}), \quad f(1) = \ln 2, \quad f'(0) = 0, \quad f'(1) = 1}$$
