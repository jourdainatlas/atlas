  enonce: |
    *Perspective : le problème des moments.*

    **1.** Soit $f : [0, 1] \to \mathbb{R}$ continue telle que $\displaystyle \int_{0}^{1} f(t)t^{n}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$. Montrer que $f = 0$, à l'aide du théorème de Weierstrass (chapitre 8).

    **2.** Pour $n \in \mathbb{N}$, justifier l'existence et calculer $\displaystyle m_{n} = \int_{0}^{+\infty} t^{n}\mathrm{e}^{(-1 + \mathrm{i})t}\,\mathrm{d} t$.

    **3.** En déduire que la fonction $f : t \mapsto \sin\big(t^{1/4}\big)\mathrm{e}^{-t^{1/4}}$, continue sur $[0, +\infty[$ et non nulle, vérifie $\displaystyle \int_{0}^{+\infty} f(t)t^{n}\,\mathrm{d} t = 0$ pour tout $n \in \mathbb{N}$.

    **4.** On munit $\mathbb{R}[X]$ du produit scalaire associé au poids $w(t) = \mathrm{e}^{-t^{1/4}}$ sur $[0, +\infty[$ (cours, proposition 7). Vérifier que $w$ est bien un poids, et montrer que $g : t \mapsto \sin\big(t^{1/4}\big)$ vérifie 
    $$\int_{0}^{+\infty} g(t)P(t)w(t)\,\mathrm{d} t = 0 \qquad \text{pour tout } P \in \mathbb{R}[X].$$
     Comparer avec la question 1.
  corrige: |
    Sur un segment, les moments déterminent une fonction continue ; sur une demi-droite, ce n'est plus vrai, et l'on construit explicitement un contre-exemple à l'aide d'une exponentielle complexe qui « tourne d'un huitième de tour ».

    **1.** Par linéarité, $\int_{0}^{1} fP = 0$ pour tout $P \in \mathbb{R}[X]$. Par le théorème de Weierstrass (chapitre 8, théorème 8), il existe des polynômes $P_{k}$ convergeant uniformément vers $f$ sur $[0, 1]$, et 
    $$\int_{0}^{1} f^{2} = \lim\limits_{k \to +\infty} \int_{0}^{1} fP_{k} = 0.$$
     La fonction continue et positive $f^{2}$ est nulle. 
    $$\boxed{f = 0}$$

    **2.** On a $|t^{n}\mathrm{e}^{(-1 + \mathrm{i})t}| = t^{n}\mathrm{e}^{-t}$, intégrable. Par parties, avec un crochet nul, $m_{n + 1} = \frac{n + 1}{1 - \mathrm{i}}m_{n}$, et $m_{0} = \frac{1}{1 - \mathrm{i}}$. 
    $$\boxed{m_{n} = \frac{n!}{(1 - \mathrm{i})^{n + 1}}}$$

    **3.** La fonction $f$ est continue, dominée par $\mathrm{e}^{-t^{1/4}}$, et $t^{n}f(t) = o\big(\frac{1}{t^{2}}\big)$ : les intégrales convergent. Le changement de variable $t = u^{4}$ donne 
    $$\int_{0}^{+\infty} t^{n}f(t)\,\mathrm{d} t = 4\int_{0}^{+\infty} u^{4n + 3}\sin(u)\mathrm{e}^{-u}\,\mathrm{d} u = 4\Im(m_{4n + 3}) = 4\Im\Big(\frac{(4n + 3)!}{(1 - \mathrm{i})^{4n + 4}}\Big) = 0,$$
     puisque $(1 - \mathrm{i})^{4} = -4$ est réel. 
    $$\boxed{\int_{0}^{+\infty} f(t)t^{n}\,\mathrm{d} t = 0 \text{ pour tout } n}$$

    **4.** La fonction $w$ est continue, strictement positive, et $t^{n}w(t) = o\big(\frac{1}{t^{2}}\big)$ : c'est un poids au sens de la proposition 7. Pour $P \in \mathbb{R}[X]$, $\int_{0}^{+\infty} g P w = \int_{0}^{+\infty} P(t)\sin(t^{1/4})\mathrm{e}^{-t^{1/4}}\,\mathrm{d} t = 0$ par la question 3. 
    $$\boxed{g \perp \mathbb{R}[X]}$$

    *Comparaison.* La fonction $g$ est continue, non nulle, et $g^{2}w$ est intégrable : dans l'espace des fonctions continues $h$ telles que $h^{2}w$ soit intégrable, muni de $\int hkw$, elle est orthogonale à tous les polynômes. Les polynômes n'y forment donc pas une famille totale, contrairement à ce qui se passe sur $[0, 1]$ (question 1) ou pour les polynômes trigonométriques (chapitre 11).
- id: "mp-12-42"
