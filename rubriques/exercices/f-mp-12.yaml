  source: "TD 7 (Sainte-Geneviève), exercices 99 (Mines), 100 et 101 ; Feuille d'exercices #02 (Prost), exercice 40 ; BibM@th, Intégrales impropres, exercices 34 et 35"
  page_enonce: 7
  page_corrige: 19
  enonce: |
    *Développements asymptotiques.* Établir les développements suivants, quand $x \to +\infty$.

    **1.** $\displaystyle \int_{x}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\cos x}{x} + \frac{\sin x}{x^{2}} + O\Big(\frac{1}{x^{3}}\Big)$.

    **2.** $\displaystyle \int_{1}^{x} \frac{\mathrm{e}^{t}}{t}\,\mathrm{d} t = \mathrm{e}^{x}\Big(\frac{1}{x} + \frac{1}{x^{2}} + \frac{2}{x^{3}} + o\Big(\frac{1}{x^{3}}\Big)\Big)$.

    **3.** $\displaystyle \int_{x}^{+\infty} \frac{\mathrm{d} t}{t^{2}\ln t} = \frac{1}{x\ln x} - \frac{1}{x\ln^{2}x} + o\Big(\frac{1}{x\ln^{2}x}\Big)$.

    **4.** Pour tout $n \in \mathbb{N}^{*}$, $\displaystyle \int_{2}^{x} \frac{\mathrm{d} t}{\ln t} = \frac{x}{\ln x}\sum_{k = 0}^{n - 1} \frac{k!}{(\ln x)^{k}} + o\Big(\frac{x}{(\ln x)^{n}}\Big)$.
  corrige: |
    Des intégrations par parties successives font apparaître les termes du développement ; le reste est contrôlé par le théorème 7 ou par une majoration directe.

    **1.** Deux intégrations par parties donnent 
    $$\int_{x}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\cos x}{x} - \int_{x}^{+\infty} \frac{\cos t}{t^{2}}\,\mathrm{d} t = \frac{\cos x}{x} + \frac{\sin x}{x^{2}} - 2\int_{x}^{+\infty} \frac{\sin t}{t^{3}}\,\mathrm{d} t,$$
     et une troisième montre que $2\int_{x}^{+\infty} \frac{\sin t}{t^{3}}\,\mathrm{d} t = \frac{2\cos x}{x^{3}} - 6\int_{x}^{+\infty} \frac{\cos t}{t^{4}}\,\mathrm{d} t = O\big(\frac{1}{x^{3}}\big)$. 
    $$\boxed{\int_{x}^{+\infty} \frac{\sin t}{t}\,\mathrm{d} t = \frac{\cos x}{x} + \frac{\sin x}{x^{2}} + O\Big(\frac{1}{x^{3}}\Big)}$$

    **2.** Trois intégrations par parties donnent, avec une constante $C$, 
    $$\int_{1}^{x} \frac{\mathrm{e}^{t}}{t}\,\mathrm{d} t = \mathrm{e}^{x}\Big(\frac{1}{x} + \frac{1}{x^{2}} + \frac{2}{x^{3}}\Big) + 6\int_{1}^{x} \frac{\mathrm{e}^{t}}{t^{4}}\,\mathrm{d} t + C,$$
     et le théorème 7 (ii), avec $\varphi = \frac{\mathrm{e}^{t}}{t^{4}}$, donne $\int_{1}^{x} \frac{\mathrm{e}^{t}}{t^{4}}\,\mathrm{d} t \sim \frac{\mathrm{e}^{x}}{x^{4}} = o\big(\frac{\mathrm{e}^{x}}{x^{3}}\big)$. 
    $$\boxed{\mathrm{e}^{x}\Big(\frac{1}{x} + \frac{1}{x^{2}} + \frac{2}{x^{3}} + o\Big(\frac{1}{x^{3}}\Big)\Big)}$$

    **3.** Par parties, avec $\big(\frac{1}{\ln t}\big)' = -\frac{1}{t\ln^{2}t}$, 
    $$\int_{x}^{+\infty} \frac{\mathrm{d} t}{t^{2}\ln t} = \frac{1}{x\ln x} - \int_{x}^{+\infty} \frac{\mathrm{d} t}{t^{2}\ln^{2}t},$$
     et le théorème 7 (i), avec $\varphi(t) = \frac{1}{t\ln^{2}t}$, dont l'opposé de la dérivée est équivalent à $\frac{1}{t^{2}\ln^{2}t}$, donne $\int_{x}^{+\infty} \frac{\mathrm{d} t}{t^{2}\ln^{2}t} \sim \frac{1}{x\ln^{2}x}$. 
    $$\boxed{\frac{1}{x\ln x} - \frac{1}{x\ln^{2}x} + o\Big(\frac{1}{x\ln^{2}x}\Big)}$$

    **4.** Une intégration par parties donne $\int_{2}^{x} \frac{\mathrm{d} t}{(\ln t)^{k}} = \frac{x}{(\ln x)^{k}} + k\int_{2}^{x} \frac{\mathrm{d} t}{(\ln t)^{k + 1}} + C_{k}$. Par récurrence, 
    $$\int_{2}^{x} \frac{\mathrm{d} t}{\ln t} = \sum_{k = 0}^{n - 1} \frac{k!\,x}{(\ln x)^{k + 1}} + n!\int_{2}^{x} \frac{\mathrm{d} t}{(\ln t)^{n + 1}} + C,$$
     et l'exercice 22 (b) donne $\int_{2}^{x} \frac{\mathrm{d} t}{(\ln t)^{n + 1}} \sim \frac{x}{(\ln x)^{n + 1}} = o\big(\frac{x}{(\ln x)^{n}}\big)$ ; la constante est négligeable aussi. 
    $$\boxed{\frac{x}{\ln x}\sum_{k = 0}^{n - 1} \frac{k!}{(\ln x)^{k}} + o\Big(\frac{x}{(\ln x)^{n}}\Big)}$$

    *Commentaire.* La série $\sum k!\,y^{k}$ diverge pour tout $y \neq 0$ : le développement est asymptotique, non convergent. À $x$ fixé, ajouter des termes améliore l'approximation, puis la détériore.
