  mots_cles: [intégrales généralisées, "nature d'une intégrale"]
  noeuds: [ri-integrable]
  notions: [integrale-convergente]
  source: "TD 7 Intégrales généralisées (Sainte-Geneviève), exercice 1 ; BibM@th, Intégrales impropres, exercice 4"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Intégrales de Bertrand.* Soit $(\alpha, \beta) \in \mathbb{R}^{2}$.

    **1.** Montrer que $\displaystyle \int_{\mathrm{e}}^{+\infty} \frac{\mathrm{d} t}{t^{\alpha}(\ln t)^{\beta}}$ converge si et seulement si $\alpha > 1$, ou $\alpha = 1$ et $\beta > 1$. On traitera à part le cas $\alpha = 1$.

    **2.** En déduire la nature de $\displaystyle \int_{0}^{1/\mathrm{e}} \frac{\mathrm{d} t}{t^{\alpha}|\ln t|^{\beta}}$ selon $(\alpha, \beta)$.

    **3.** Étudier enfin la nature de $\displaystyle \int_{1/\mathrm{e}}^{1} \frac{\mathrm{d} t}{t^{\alpha}|\ln t|^{\beta}}$.
  corrige: |
    La fonction est positive : on compare à des fonctions de Riemann, en intercalant un exposant ; le cas $\alpha = 1$, où aucune fonction de Riemann ne tranche, se traite par un calcul de primitive.

    **1.** *Cas $\alpha > 1$.* Soit $\gamma \in ]1, \alpha[$. Alors $t^{\gamma}f(t) = \frac{1}{t^{\alpha - \gamma}(\ln t)^{\beta}} \to 0$ par croissances comparées, donc $f = o\big(\frac{1}{t^{\gamma}}\big)$, intégrable.

    *Cas $\alpha < 1$.* Soit $\gamma \in ]\alpha, 1[$. Alors $t^{\gamma}f(t) = \frac{t^{\gamma - \alpha}}{(\ln t)^{\beta}} \to +\infty$, donc $f(t) \geqslant \frac{1}{t^{\gamma}}$ au voisinage de $+\infty$ : l'intégrale diverge (proposition 2).

    *Cas $\alpha = 1$.* Une primitive de $\frac{1}{t(\ln t)^{\beta}}$ est $\frac{(\ln t)^{1 - \beta}}{1 - \beta}$ si $\beta \neq 1$, et $\ln(\ln t)$ si $\beta = 1$ ; elle a une limite finie en $+\infty$ si et seulement si $\beta > 1$. 
    $$\boxed{\int_{\mathrm{e}}^{+\infty} \frac{\mathrm{d} t}{t^{\alpha}(\ln t)^{\beta}} \text{ converge} \iff \alpha > 1 \text{ ou } (\alpha = 1 \text{ et } \beta > 1)}$$

    **2.** Le changement de variable $t = \frac{1}{u}$, bijection décroissante de $[\mathrm{e}, +\infty[$ sur $]0, \frac{1}{\mathrm{e}}]$ (théorème 5), donne 
    $$\int_{0}^{1/\mathrm{e}} \frac{\mathrm{d} t}{t^{\alpha}|\ln t|^{\beta}} = \int_{\mathrm{e}}^{+\infty} \frac{u^{\alpha}}{(\ln u)^{\beta}}\cdot\frac{\mathrm{d} u}{u^{2}} = \int_{\mathrm{e}}^{+\infty} \frac{\mathrm{d} u}{u^{2 - \alpha}(\ln u)^{\beta}},$$

    $$\boxed{\text{convergente} \iff \alpha < 1 \text{ ou } (\alpha = 1 \text{ et } \beta > 1)}$$

    **3.** Près de $1$, $t^{\alpha} \to 1$ et $|\ln t| \sim 1 - t$, donc $\frac{1}{t^{\alpha}|\ln t|^{\beta}} \sim \frac{1}{(1 - t)^{\beta}}$ : 
    $$\boxed{\text{convergente} \iff \beta < 1, \text{ quel que soit } \alpha}$$

    *Piège.* Les conditions en $0$ et en $+\infty$ portent sur $\alpha$ en sens inverses, comme pour les fonctions de Riemann ; en revanche, en $1$, seul $\beta$ compte.
- id: "mp-12-04"
  feuille: "f-mp-12"
  numero: 4
  partie: "Intégrales généralisées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrales généralisées, "nature d'une intégrale"]
  noeuds: [ri-integrable, tg-arctan]
  notions: [integrale-convergente, arc-tangente, cosinus-sinus]
  source: "Feuille d'exercices #02 (Prost), exercice 34 ; BibM@th, Intégrales impropres, exercice 16 ; TD 7 (Sainte-Geneviève), exercice 59"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Une intégrale télescopique.* Soit $f : \mathbb{R} \to \mathbb{R}$ continue, ayant une limite finie $\ell$ en $-\infty$ et une limite finie $\ell'$ en $+\infty$.

    **1.** Pour $A$, $B > 0$, exprimer $\displaystyle \int_{-A}^{B} \big(f(t + 1) - f(t)\big)\mathrm{d} t$ à l'aide de deux intégrales sur des segments de longueur $1$.

    **2.** En déduire que $\displaystyle \int_{-\infty}^{+\infty} \big(f(t + 1) - f(t)\big)\mathrm{d} t$ converge et vaut $\ell' - \ell$.

    **3.** Calculer $\displaystyle \int_{-\infty}^{+\infty} \big(\operatorname{Arctan}(t + 1) - \operatorname{Arctan} t\big)\mathrm{d} t$, puis $\displaystyle \int_{0}^{+\infty} \big(\operatorname{Arctan}(t + 1) - \operatorname{Arctan} t\big)\mathrm{d} t$.
  corrige: |
    L'idée est un télescopage : la différence de deux translatées ne laisse subsister que deux petits morceaux d'intégrale, aux extrémités.

    **1.** Par le changement de variable $u = t + 1$ puis la relation de Chasles, 
    $$\int_{-A}^{B} \big(f(t + 1) - f(t)\big)\mathrm{d} t = \int_{-A + 1}^{B + 1} f - \int_{-A}^{B} f = \boxed{\int_{B}^{B + 1} f - \int_{-A}^{-A + 1} f}$$

    **2.** Soit $\varepsilon > 0$ et $B_{0}$ tel que $|f - \ell'| \leqslant \varepsilon$ sur $[B_{0}, +\infty[$. Pour $B \geqslant B_{0}$, $\big|\int_{B}^{B + 1} f - \ell'\big| \leqslant \int_{B}^{B + 1} |f - \ell'| \leqslant \varepsilon$ : ce terme tend vers $\ell'$ quand $B \to +\infty$, et de même le second tend vers $\ell$ quand $A \to +\infty$. Les deux limites étant indépendantes, l'intégrale converge, et 
    $$\boxed{\int_{-\infty}^{+\infty} \big(f(t + 1) - f(t)\big)\mathrm{d} t = \ell' - \ell}$$

    **3.** Pour $f = \operatorname{Arctan}$, on obtient $\frac{\pi}{2} - \big(-\frac{\pi}{2}\big)$. Sur $[0, +\infty[$, le même calcul donne 
    $$\int_{0}^{B} \big(\operatorname{Arctan}(t + 1) - \operatorname{Arctan} t\big)\mathrm{d} t = \int_{B}^{B + 1} \operatorname{Arctan} - \int_{0}^{1} \operatorname{Arctan},$$
     avec 
    $$\int_{0}^{1} \operatorname{Arctan} = \Big[t\operatorname{Arctan} t - \frac{1}{2}\ln(1 + t^{2})\Big]_{0}^{1} = \frac{\pi}{4} - \frac{\ln 2}{2},$$
     d'où : 
    $$\boxed{\int_{-\infty}^{+\infty} \big(\operatorname{Arctan}(t + 1) - \operatorname{Arctan} t\big)\mathrm{d} t = \pi, \qquad \int_{0}^{+\infty} \big(\operatorname{Arctan}(t + 1) - \operatorname{Arctan} t\big)\mathrm{d} t = \frac{\pi}{4} + \frac{\ln 2}{2}}$$
- id: "mp-12-05"
  feuille: "f-mp-12"
  numero: 5
  partie: "Intégrales généralisées"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [intégrales généralisées, "nature d'une intégrale"]
  noeuds: [ri-integrable]
  notions: [integrale-convergente]
  source: "BibM@th, Intégrales impropres, exercices 21, 25 et 26 ; TD 7 (Sainte-Geneviève), exercices 62 et 63"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Comportement à l'infini.* Soit $f : [0, +\infty[ \to \mathbb{R}$ continue, dont l'intégrale sur $[0, +\infty[$ converge.

    **1.** Montrer que, si $f$ a une limite en $+\infty$, cette limite est nulle.

    **2.** Montrer que $\displaystyle \int_{x}^{x + 1} f(t)\,\mathrm{d} t \xrightarrow[x \to +\infty]{} 0$.

    **3.** On suppose $f$ décroissante. Montrer que $f$ est positive, puis que $f(x) \to 0$ et $x f(x) \to 0$ quand $x \to +\infty$. On pourra minorer $\displaystyle \int_{x/2}^{x} f$.

    **4.** Construire une fonction continue et positive sur $[0, +\infty[$, dont l'intégrale converge, mais qui ne tend pas vers $0$ en $+\infty$. On pourra utiliser des « pics » triangulaires de hauteur $1$.
  corrige: |
    On exploite que, si l'intégrale converge, les intégrales sur des segments $[x, y]$ avec $x$, $y \to +\infty$ tendent vers $0$ : c'est la différence $F(y) - F(x)$ de deux quantités tendant vers la même limite.

    **1.** Si $f \to \ell \neq 0$, disons $\ell > 0$, il existe $A$ tel que $f \geqslant \frac{\ell}{2}$ sur $[A, +\infty[$, et $\int_{A}^{x} f \geqslant \frac{\ell}{2}(x - A) \to +\infty$ : l'intégrale diverge. 
    $$\boxed{\ell = 0}$$

    **2.** Avec $F(x) = \int_{0}^{x} f$, de limite $L$ : $\int_{x}^{x + 1} f = F(x + 1) - F(x) \to L - L = 0$. 
    $$\boxed{\int_{x}^{x + 1} f \to 0}$$

    **3.** Si $f(x_{0}) < 0$ pour un $x_{0}$, la décroissance donne $f \leqslant f(x_{0}) < 0$ sur $[x_{0}, +\infty[$, et l'intégrale diverge comme en 1. Donc $f \geqslant 0$ ; décroissante et minorée, elle a une limite, nulle par 1. Enfin, par décroissance, 
    $$0 \leqslant \frac{x}{2}f(x) \leqslant \int_{x/2}^{x} f = F(x) - F\Big(\frac{x}{2}\Big) \xrightarrow[x \to +\infty]{} 0.$$

    $$\boxed{f \geqslant 0, \quad f(x) \to 0, \quad xf(x) \to 0}$$

    **4.** Pour $n \geqslant 2$, soit $\tau_{n}$ la fonction « triangle » nulle hors de $[n - \frac{1}{n^{2}}, n + \frac{1}{n^{2}}]$, affine sur chacune des deux moitiés, et valant $1$ en $n$ ; son intégrale est $\frac{1}{n^{2}}$. Les supports sont disjoints, et $f = \sum_{n \geqslant 2} \tau_{n}$ est continue et positive. Pour $x \geqslant 2$, $\int_{0}^{x} f \leqslant \sum_{n \geqslant 2} \frac{1}{n^{2}}$ : l'intégrale converge (proposition 2), alors que $f(n) = 1$ pour tout $n \geqslant 2$. 
    $$\boxed{f \text{ continue, positive, d'intégrale convergente, sans limite nulle}}$$

    *Piège.* Contrairement au terme général d'une série convergente, une fonction d'intégrale convergente ne tend pas forcément vers $0$, même positive. L'exercice 40 en donne même une qui tend vers l'infini le long d'une suite.
- id: "mp-12-06"
  feuille: "f-mp-12"
  numero: 6
  partie: "Fonctions intégrables"
  etoiles: 1
  types: [Calcul]
  mots_cles: [fonctions intégrables]
  noeuds: [ri-integrable, tg-arctan]
  notions: [integrale-convergente, arc-tangente, cosinus-sinus]
  source: "TD 7 (Sainte-Geneviève), exercices 2 (ii), (vi), (x), (xi), (xiii) et 3 (viii) ; BibM@th, Intégrales impropres, exercices 1, 2, 3 et 6"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Étudier la nature des intégrales suivantes. 
    $$\text{(a)} \ \int_{0}^{+\infty} \frac{\mathrm{d} t}{\mathrm{e}^{t} - 1}, \qquad \text{(b)} \ \int_{0}^{1} \frac{\mathrm{d} t}{(1 - t)\sqrt{t}}, \qquad \text{(c)} \ \int_{0}^{+\infty} \mathrm{e}^{-t}\ln t\,\mathrm{d} t, \qquad \text{(d)} \ \int_{1}^{+\infty} \operatorname{Arctan}\Big(\frac{1}{t}\Big)\mathrm{d} t,$$

    $$\text{(e)} \ \int_{0}^{+\infty} \frac{\mathrm{d} x}{\sqrt{x^{2} + x^{3}}}, \qquad \text{(f)} \ \int_{0}^{\pi/2} \sqrt{\tan x}\,\mathrm{d} x, \qquad \text{(g)} \ \int_{0}^{\pi/2} \frac{\mathrm{d} x}{\sqrt{1 - \sin x}}, \qquad \text{(h)} \ \int_{0}^{1} \frac{x\,\mathrm{d} x}{\sqrt{1 - x^{4}}},$$

    $$\text{(i)} \ \int_{1}^{+\infty} \mathrm{e}^{-\sqrt{\ln t}}\,\mathrm{d} t, \qquad \text{(j)} \ \int_{0}^{1} \frac{\mathrm{d} t}{\operatorname{Arccos} t}, \qquad \text{(k)} \ \int_{0}^{1} \frac{\mathrm{d} t}{1 - \sqrt{t}}, \qquad \text{(l)} \ \int_{0}^{+\infty} t\sin(t)\,\mathrm{e}^{-t}\,\mathrm{d} t.$$
  corrige: |
    Toutes ces fonctions sont positives, sauf (c) et (l) : on cherche à chaque borne à problème un équivalent simple, comparé aux intégrales de référence (théorèmes 1 et 3).

    **(a)** En $0$, $\mathrm{e}^{t} - 1 \sim t$, donc $\frac{1}{\mathrm{e}^{t} - 1} \sim \frac{1}{t}$. 
    $$\boxed{\text{diverge}}$$

    **(b)** En $1$, $\frac{1}{(1 - t)\sqrt{t}} \sim \frac{1}{1 - t}$ ; en $0$, l'équivalent $\frac{1}{\sqrt{t}}$ est intégrable, mais la borne $1$ suffit à conclure. 
    $$\boxed{\text{diverge}}$$

    **(c)** En $0$, $|\mathrm{e}^{-t}\ln t| \sim |\ln t|$, intégrable ; en $+\infty$, $t^{2}\mathrm{e}^{-t}\ln t \to 0$. 
    $$\boxed{\text{converge}}$$

    **(d)** $\operatorname{Arctan}\frac{1}{t} \sim \frac{1}{t}$ en $+\infty$. 
    $$\boxed{\text{diverge}}$$

    **(e)** En $0$, $\sqrt{x^{2} + x^{3}} \sim x$ : l'équivalent $\frac{1}{x}$ n'est pas intégrable, même si l'intégrande est en $x^{-3/2}$ en $+\infty$. 
    $$\boxed{\text{diverge}}$$

    **(f)** En $\frac{\pi}{2}$, $\tan x = \frac{1}{\tan(\frac{\pi}{2} - x)} \sim \frac{1}{\frac{\pi}{2} - x}$, donc $\sqrt{\tan x} \sim \big(\frac{\pi}{2} - x\big)^{-1/2}$. 
    $$\boxed{\text{converge}}$$

    **(g)** En $\frac{\pi}{2}$, $1 - \sin x = 1 - \cos\big(\frac{\pi}{2} - x\big) \sim \frac{1}{2}\big(\frac{\pi}{2} - x\big)^{2}$, donc l'intégrande est équivalente à $\frac{\sqrt{2}}{\frac{\pi}{2} - x}$. 
    $$\boxed{\text{diverge}}$$

    **(h)** En $1$, $1 - x^{4} = (1 - x)(1 + x)(1 + x^{2}) \sim 4(1 - x)$, et l'intégrande est équivalente à $\frac{1}{2\sqrt{1 - x}}$. 
    $$\boxed{\text{converge}}$$

    **(i)** Pour $t \geqslant \mathrm{e}$, $\ln t \geqslant 1$, donc $\sqrt{\ln t} \leqslant \ln t$ et $\mathrm{e}^{-\sqrt{\ln t}} \geqslant \mathrm{e}^{-\ln t} = \frac{1}{t}$. 
    $$\boxed{\text{diverge}}$$

    **(j)** En $1$, posons $\theta = \operatorname{Arccos} t$ : $1 - t = 1 - \cos\theta \sim \frac{\theta^{2}}{2}$, donc $\operatorname{Arccos} t \sim \sqrt{2(1 - t)}$, et l'intégrande est équivalente à $\frac{1}{\sqrt{2}\sqrt{1 - t}}$. 
    $$\boxed{\text{converge}}$$

    **(k)** En $1$, $1 - \sqrt{t} = \frac{1 - t}{1 + \sqrt{t}} \sim \frac{1 - t}{2}$. 
    $$\boxed{\text{diverge}}$$

    **(l)** $|t\sin(t)\mathrm{e}^{-t}| \leqslant t\mathrm{e}^{-t}$, intégrable sur $[0, +\infty[$. 
    $$\boxed{\text{converge absolument}}$$

    *Piège.* En (e), la borne $+\infty$, la première regardée, ne pose pas de problème : il faut systématiquement examiner *toutes* les bornes, y compris celles où la fonction est définie mais non bornée au voisinage.
- id: "mp-12-07"
  feuille: "f-mp-12"
  numero: 7
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fonctions intégrables]
