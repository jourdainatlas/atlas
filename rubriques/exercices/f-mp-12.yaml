  page_enonce: 7
  page_corrige: 22
  enonce: |
    Soit $f : [0, +\infty[ \to \mathbb{R}$ continue.

    **1.** On suppose $f$ positive et intégrable. Montrer que $\displaystyle \frac{1}{x}\int_{0}^{x} tf(t)\,\mathrm{d} t \xrightarrow[x \to +\infty]{} 0$.

    **2.** On suppose $f^{2}$ intégrable. Montrer que $\displaystyle \int_{0}^{x} f(t)\,\mathrm{d} t \underset{x \to +\infty}{=} o(\sqrt{x})$.

    **3.** On suppose $f$ intégrable. Montrer qu'il existe une suite $(x_{n})$ de limite $+\infty$ telle que $x_{n}f(x_{n})$ tende vers $0$. Peut-on toujours affirmer que $xf(x) \to 0$ ?
  corrige: |
    Les trois questions reposent sur le même découpage : on coupe en un point $A$ fixé, choisi pour que la queue au-delà de $A$ soit petite, puis on fait tendre $x$ vers $+\infty$ à $A$ fixé.

    **1.** Soit $\varepsilon > 0$ et $A$ tel que $\int_{A}^{+\infty} f \leqslant \varepsilon$. Pour $x \geqslant A$, 
    $$0 \leqslant \frac{1}{x}\int_{0}^{x} tf(t)\,\mathrm{d} t \leqslant \frac{1}{x}\int_{0}^{A} tf(t)\,\mathrm{d} t + \int_{A}^{x} f(t)\,\mathrm{d} t \leqslant \frac{C_{A}}{x} + \varepsilon,$$
     où l'on a majoré $\frac{t}{x}$ par $1$ sur $[A, x]$. Le majorant est inférieur à $2\varepsilon$ pour $x$ grand. 
    $$\boxed{\frac{1}{x}\int_{0}^{x} tf(t)\,\mathrm{d} t \to 0}$$

    **2.** Soit $\varepsilon > 0$ et $A$ tel que $\int_{A}^{+\infty} f^{2} \leqslant \varepsilon^{2}$. Par l'inégalité de Cauchy-Schwarz sur $[A, x]$, 
    $$\Big|\int_{0}^{x} f\Big| \leqslant \Big|\int_{0}^{A} f\Big| + \sqrt{x - A}\Big(\int_{A}^{x} f^{2}\Big)^{1/2} \leqslant C_{A} + \varepsilon\sqrt{x}. \qquad \boxed{\int_{0}^{x} f = o(\sqrt{x})}$$

    **3.** S'il existait $c > 0$ et $A$ tels que $|f(x)| \geqslant \frac{c}{x}$ pour $x \geqslant A$, $|f|$ ne serait pas intégrable. Donc, pour tout $n \geqslant 1$, il existe $x_{n} \geqslant n$ tel que $|x_{n}f(x_{n})| < \frac{1}{n}$. 
    $$\boxed{x_{n} \to +\infty, \quad x_{n}f(x_{n}) \to 0}$$

    On ne peut pas espérer mieux. Une variante de la fonction de l'exercice 5 (question 4), construite avec des triangles de hauteur $n$ et de demi-base $\frac{1}{n^{3}}$, a une intégrale $\sum \frac{1}{n^{2}}$ finie, alors que $nf(n) = n^{2}$. 
    $$\boxed{xf(x) \not\to 0 \text{ en général}}$$
