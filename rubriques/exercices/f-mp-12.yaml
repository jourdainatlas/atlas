  source: "TD 7 (Sainte-Geneviève), exercice 23"
  page_enonce: 12
  page_corrige: 31
  enonce: |
    *L'intégrale de $\frac{1}{1 + x^{2n}}$.* Soit $n \in \mathbb{N}^{*}$, $\displaystyle I_{n} = \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{1 + x^{2n}}$ et $\theta_{k} = \frac{(2k + 1)\pi}{2n}$ pour $k \in \llbracket 0\,,n - 1 \rrbracket$.

    **1.** Montrer que $I_{n}$ converge.

    **2.** Montrer que 
    $$\frac{1}{1 + X^{2n}} = \frac{1}{n}\sum_{k = 0}^{n - 1} \frac{1 - X\cos\theta_{k}}{X^{2} - 2X\cos\theta_{k} + 1}.$$

    **3.** Soit $\theta \in ]0, \pi[$. Montrer que $\displaystyle \int_{-A}^{A} \frac{1 - x\cos\theta}{x^{2} - 2x\cos\theta + 1}\,\mathrm{d} x \xrightarrow[A \to +\infty]{} \pi\sin\theta$.

    **4.** En déduire que $\displaystyle I_{n} = \frac{\pi}{n\sin\big(\frac{\pi}{2n}\big)}$.

    **5.** Déterminer la limite de $I_{n}$ quand $n \to +\infty$, et l'interpréter.
  corrige: |
    On décompose en éléments simples sur $\mathbb{C}$, on regroupe les pôles conjugués, et l'on calcule chaque terme sur $[-A, A]$, les intégrales séparées divergeant.

    **1.** La fonction est continue, paire, équivalente à $\frac{1}{x^{2n}}$ en $\pm\infty$, avec $2n \geqslant 2$. 
    $$\boxed{I_{n} \text{ converge}}$$

    **2.** Les racines de $1 + X^{2n}$ sont les $z_{k} = \mathrm{e}^{\mathrm{i}\theta_{k}}$, $0 \leqslant k \leqslant 2n - 1$, simples. Le coefficient de $\frac{1}{X - z_{k}}$ est $\frac{1}{2nz_{k}^{2n - 1}} = \frac{z_{k}}{2nz_{k}^{2n}} = -\frac{z_{k}}{2n}$. Les racines $z_{k}$ et $z_{2n - 1 - k} = \overline{z_{k}}$, pour $0 \leqslant k \leqslant n - 1$, se regroupent : 
    $$-\frac{1}{2n}\Big(\frac{z_{k}}{X - z_{k}} + \frac{\overline{z_{k}}}{X - \overline{z_{k}}}\Big) = -\frac{1}{2n}\cdot\frac{2X\cos\theta_{k} - 2}{X^{2} - 2X\cos\theta_{k} + 1},$$
     ce qui donne la formule annoncée, contrôlée pour $n = 3$.

    **3.** Avec $x^{2} - 2x\cos\theta + 1 = (x - \cos\theta)^{2} + \sin^{2}\theta$ et $1 - x\cos\theta = -\cos\theta(x - \cos\theta) + \sin^{2}\theta$, 
    $$\int_{-A}^{A} \frac{1 - x\cos\theta}{x^{2} - 2x\cos\theta + 1}\,\mathrm{d} x = -\frac{\cos\theta}{2}\ln\frac{A^{2} - 2A\cos\theta + 1}{A^{2} + 2A\cos\theta + 1} + \sin\theta\Big[\operatorname{Arctan}\frac{x - \cos\theta}{\sin\theta}\Big]_{-A}^{A}.$$
     Le logarithme tend vers $0$, le crochet vers $\pi$. 
    $$\boxed{\to \pi\sin\theta}$$

    **4.** Comme $I_{n}$ converge, elle est la limite de son intégrale sur $[-A, A]$, et 
    $$I_{n} = \frac{\pi}{n}\sum_{k = 0}^{n - 1} \sin\theta_{k} = \frac{\pi}{n}\Im\Big(\mathrm{e}^{\mathrm{i}\pi/(2n)}\frac{1 - \mathrm{e}^{\mathrm{i}\pi}}{1 - \mathrm{e}^{\mathrm{i}\pi/n}}\Big) = \frac{\pi}{n}\Im\Big(\frac{\mathrm{i}}{\sin\frac{\pi}{2n}}\Big), \qquad \boxed{I_{n} = \frac{\pi}{n\sin\big(\frac{\pi}{2n}\big)}}$$
     Pour $n = 1$, on retrouve $\pi$ ; les valeurs pour $n \leqslant 5$ ont été contrôlées numériquement.

    **5.** Comme $\sin\frac{\pi}{2n} \sim \frac{\pi}{2n}$, $I_{n} \to 2$. 
    $$\boxed{\lim I_{n} = 2}$$
     La fonction $\frac{1}{1 + x^{2n}}$ tend vers $1$ sur $]-1, 1[$ et vers $0$ pour $|x| > 1$ : la limite des intégrales est l'intégrale de la limite, la fonction indicatrice de $[-1, 1]$, ce que le théorème de convergence dominée du chapitre 13 justifiera directement.

    *Piège.* Le regroupement des pôles conjugués est indispensable : une intégrale $\int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{x - z}$ diverge ; seule la combinaison de la question 3, intégrée sur $[-A, A]$, a une limite.
