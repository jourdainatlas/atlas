- id: "mp-12-01"
  feuille: "f-mp-12"
  numero: 1
  partie: "Intégrales généralisées"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [intégrales généralisées, "nature d'une intégrale"]
  noeuds: [ri-integrable]
  notions: [integrale-convergente]
  source: "TD 7 Intégrales généralisées (Sainte-Geneviève), exercice 8 (i) ; Feuille d'exercices #02 (Prost), exercice 23 ; items (b) à (e) composés pour la feuille"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Justifier la convergence et calculer, en déterminant une primitive sur un segment puis en passant à la limite : 
    $$\text{(a)} \ \int_{0}^{+\infty} t\,\mathrm{e}^{-t^{2}}\,\mathrm{d} t, \qquad \text{(b)} \ \int_{0}^{1} \frac{\mathrm{d} t}{\sqrt{1 - t^{2}}}, \qquad \text{(c)} \ \int_{\mathrm{e}}^{+\infty} \frac{\mathrm{d} t}{t\ln^{2}t},$$

    $$\text{(d)} \ \int_{-\infty}^{+\infty} \frac{\mathrm{d} t}{t^{2} + 2t + 5}, \qquad \text{(e)} \ \int_{1}^{+\infty} \frac{\mathrm{d} t}{t\sqrt{t^{2} - 1}}.$$
     Pour (e), on pourra dériver $t \mapsto \operatorname{Arccos}\big(\frac{1}{t}\big)$.
  corrige: |
    Dans chaque cas, on calcule l'intégrale sur un segment à l'aide d'une primitive, puis on fait tendre la borne vers l'extrémité ouverte.

    **(a)** Une primitive est $t \mapsto -\frac{1}{2}\mathrm{e}^{-t^{2}}$, d'où $\int_{0}^{x} t\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \frac{1 - \mathrm{e}^{-x^{2}}}{2} \to \frac{1}{2}$. 
    $$\boxed{\frac{1}{2}}$$

    **(b)** On a $\int_{0}^{x} \frac{\mathrm{d} t}{\sqrt{1 - t^{2}}} = \operatorname{Arcsin} x \to \frac{\pi}{2}$ quand $x \to 1^{-}$. 
    $$\boxed{\frac{\pi}{2}}$$

    **(c)** Une primitive est $t \mapsto -\frac{1}{\ln t}$, d'où $\int_{\mathrm{e}}^{x} \frac{\mathrm{d} t}{t\ln^{2}t} = 1 - \frac{1}{\ln x} \to 1$. 
    $$\boxed{1}$$

    **(d)** On écrit $t^{2} + 2t + 5 = (t + 1)^{2} + 4$ ; une primitive est $t \mapsto \frac{1}{2}\operatorname{Arctan}\frac{t + 1}{2}$, dont les limites en $\pm\infty$ sont $\pm\frac{\pi}{4}$. Les deux bornes se traitent séparément, mais donnent 
    $$\boxed{\frac{\pi}{2}}$$

    **(e)** Pour $t > 1$, la dérivée de $t \mapsto \operatorname{Arccos}\frac{1}{t}$ est $\frac{1/t^{2}}{\sqrt{1 - 1/t^{2}}} = \frac{1}{t\sqrt{t^{2} - 1}}$. Cette primitive tend vers $\operatorname{Arccos} 1 = 0$ en $1^{+}$ et vers $\operatorname{Arccos} 0 = \frac{\pi}{2}$ en $+\infty$ : l'intégrale converge aux deux bornes. 
    $$\boxed{\frac{\pi}{2}}$$
- id: "mp-12-02"
  feuille: "f-mp-12"
  numero: 2
  partie: "Intégrales généralisées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [intégrales généralisées]
  noeuds: [ri-integrable]
  notions: [integrale-convergente]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Trouver l'erreur.* Chacun des trois raisonnements suivants contient une erreur. La localiser, puis donner la bonne conclusion.

    **(a)** $\displaystyle \int_{-1}^{1} \frac{\mathrm{d} t}{t^{2}} = \Big[-\frac{1}{t}\Big]_{-1}^{1} = -2$.

    **(b)** Pour tout $A > 0$, $\displaystyle \int_{-A}^{A} \frac{2t}{1 + t^{2}}\,\mathrm{d} t = 0$, donc $\displaystyle \int_{-\infty}^{+\infty} \frac{2t}{1 + t^{2}}\,\mathrm{d} t = 0$.

    **(c)** $\displaystyle \int_{1}^{+\infty} \Big(\frac{1}{t} - \frac{1}{t + 1}\Big)\mathrm{d} t = \int_{1}^{+\infty} \frac{\mathrm{d} t}{t} - \int_{1}^{+\infty} \frac{\mathrm{d} t}{t + 1} = \int_{1}^{+\infty} \frac{\mathrm{d} t}{t} - \int_{2}^{+\infty} \frac{\mathrm{d} u}{u} = \int_{1}^{2} \frac{\mathrm{d} t}{t} = \ln 2$.
  corrige: |
    Les trois erreurs sont classiques : elles consistent à oublier qu'une intégrale généralisée se définit borne par borne, avec des limites indépendantes.

    **(a)** La fonction $t \mapsto \frac{1}{t^{2}}$ n'est pas définie en $0$ : l'intégrale est généralisée en $0$, et la formule $\big[F\big]_{-1}^{1}$ suppose une primitive sur tout le segment. On coupe en $0$ : $\int_{0}^{1} \frac{\mathrm{d} t}{t^{2}}$ diverge (théorème 1, $\alpha = 2 \geqslant 1$), et la fonction est positive. 
    $$\boxed{\int_{-1}^{1} \frac{\mathrm{d} t}{t^{2}} = +\infty}$$

    Le résultat $-2$, négatif pour une fonction positive, aurait dû alerter.

    **(b)** Le raisonnement calcule une limite symétrique, la valeur principale de Cauchy. Or l'intégrale de $\frac{2t}{1 + t^{2}}$ sur $[0, x]$ vaut $\ln(1 + x^{2})$, qui tend vers $+\infty$ : l'intégrale diverge en $+\infty$, donc sur $\mathbb{R}$. 
    $$\boxed{\text{l'intégrale diverge}}$$

    **(c)** On a découpé une intégrale convergente en deux intégrales divergentes, ce que la linéarité n'autorise pas (remarque de la section 12.2). Le calcul correct se fait sur un segment : 
    $$\int_{1}^{x} \Big(\frac{1}{t} - \frac{1}{t + 1}\Big)\mathrm{d} t = \ln\frac{x}{x + 1} + \ln 2 \xrightarrow[x \to +\infty]{} \ln 2.$$

    $$\boxed{\text{la valeur } \ln 2 \text{ est juste, mais le raisonnement est faux}}$$

    *Piège.* Un résultat juste obtenu par un raisonnement faux reste une erreur. La même manipulation, appliquée à la fonction nulle $\frac{1}{t} - \frac{2}{2t}$, avec le changement de variable $u = 2t$ dans le second terme, « démontrerait » que $0 = \int_{1}^{+\infty} \frac{\mathrm{d} t}{t} - \int_{2}^{+\infty} \frac{\mathrm{d} u}{u} = \ln 2$.
- id: "mp-12-03"
  feuille: "f-mp-12"
