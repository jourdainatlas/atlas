  notions: [integrale-convergente, puissance-reelle]
  source: "TD 7 (Sainte-Geneviève), exercices 2 (vii), (ix), 3 (xv) et 4 (i) ; Feuille d'exercices #02 (Prost), exercice 22 ; BibM@th, Intégrales impropres, exercice 5"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer, selon les valeurs des paramètres réels, la nature des intégrales suivantes. 
    $$\text{(a)} \ \int_{0}^{+\infty} \frac{x^{\alpha - 1}}{1 + x}\,\mathrm{d} x, \qquad \text{(b)} \ \int_{0}^{+\infty} \frac{\mathrm{d} x}{x^{\alpha} + x^{\beta}} \ (\alpha < \beta), \qquad \text{(c)} \ \int_{1}^{+\infty} \frac{\ln(1 + t^{\alpha})}{t^{\beta}}\,\mathrm{d} t,$$

    $$\text{(d)} \ \int_{0}^{+\infty} \frac{1 - \operatorname{th} u}{u^{\alpha}}\,\mathrm{d} u, \qquad \text{(e)} \ \int_{1}^{+\infty} \frac{\mathrm{d} x}{|x^{\alpha} - 1|^{\beta}} \ (\alpha, \beta > 0), \qquad \text{(f)} \ \int_{0}^{\pi/2} \Big(\frac{\cos x}{\sin x}\Big)^{\alpha}\mathrm{d} x.$$
  corrige: |
    On étudie chaque borne séparément, l'équivalent dépendant des paramètres ; la condition finale est la conjonction des conditions aux deux bornes.

    **(a)** En $0$, $\frac{x^{\alpha - 1}}{1 + x} \sim \frac{1}{x^{1 - \alpha}}$ : il faut $\alpha > 0$ ; en $+\infty$, $\sim \frac{1}{x^{2 - \alpha}}$ : il faut $\alpha < 1$. 
    $$\boxed{0 < \alpha < 1}$$

    **(b)** Avec $\alpha < \beta$ : en $0$, $x^{\alpha} + x^{\beta} \sim x^{\alpha}$, il faut $\alpha < 1$ ; en $+\infty$, $\sim x^{\beta}$, il faut $\beta > 1$. 
    $$\boxed{\alpha < 1 < \beta}$$

    **(c)** Si $\alpha < 0$, $\ln(1 + t^{\alpha}) \sim t^{\alpha}$, et l'intégrande est équivalente à $\frac{1}{t^{\beta - \alpha}}$ ; si $\alpha = 0$, elle vaut $\frac{\ln 2}{t^{\beta}}$ ; si $\alpha > 0$, $\ln(1 + t^{\alpha}) \sim \alpha\ln t$, et l'on est ramené à Bertrand (exercice 3). 
    $$\boxed{\alpha \leqslant 0 : \ \beta > \alpha + 1 ; \qquad \alpha > 0 : \ \beta > 1}$$

    **(d)** En $0$, $1 - \operatorname{th} u \to 1$, et l'intégrande est équivalente à $\frac{1}{u^{\alpha}}$ ; en $+\infty$, $1 - \operatorname{th} u = \frac{2}{\mathrm{e}^{2u} + 1} \sim 2\mathrm{e}^{-2u}$, et $u^{-\alpha}\mathrm{e}^{-2u}$ est intégrable quel que soit $\alpha$. 
    $$\boxed{\alpha < 1}$$

    **(e)** En $1$, $x^{\alpha} - 1 \sim \alpha(x - 1)$, il faut $\beta < 1$ ; en $+\infty$, l'intégrande est équivalente à $\frac{1}{x^{\alpha\beta}}$, il faut $\alpha\beta > 1$. 
    $$\boxed{\beta < 1 \text{ et } \alpha\beta > 1}$$
     En particulier, $\alpha > \frac{1}{\beta} > 1$.

    **(f)** En $0$, $\big(\frac{\cos x}{\sin x}\big)^{\alpha} \sim x^{-\alpha}$, il faut $\alpha < 1$ ; en $\frac{\pi}{2}$, $\frac{\cos x}{\sin x} \sim \frac{\pi}{2} - x$, il faut $-\alpha < 1$. 
    $$\boxed{-1 < \alpha < 1}$$
- id: "mp-12-09"
  feuille: "f-mp-12"
  numero: 9
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions intégrables, "nature d'une intégrale", intégrabilité]
  noeuds: [ri-integrable]
  notions: [integrale-convergente]
  source: "TD 7 (Sainte-Geneviève), exercice 45 (i), (ii), (iii) ; Feuille d'exercices #02 (Prost), exercice 22 (J3) ; BibM@th, Intégrales impropres, exercice 8"
  page_enonce: 3
  page_corrige: 7
  enonce: |
    Pour chacune des intégrales suivantes, établir la convergence, puis déterminer si la fonction intégrée est intégrable. 
    $$\text{(a)} \ \int_{0}^{+\infty} \frac{u\sin u}{1 + u^{2}}\,\mathrm{d} u, \qquad \text{(b)} \ \int_{0}^{+\infty} \sin(t^{2})\,\mathrm{d} t, \qquad \text{(c)} \ \int_{0}^{+\infty} \cos(\mathrm{e}^{t})\,\mathrm{d} t,$$

    $$\text{(d)} \ \int_{2}^{+\infty} \frac{\cos x}{\ln x}\,\mathrm{d} x, \qquad \text{(e)} \ \int_{0}^{+\infty} \sin(t)\sin\Big(\frac{1}{t}\Big)\mathrm{d} t.$$
  corrige: |
    Pour la convergence, on se ramène à l'intégrale de $\frac{\sin u}{u}$ (proposition 4) ou à une intégration par parties ; pour la non-intégrabilité, on minore par une fonction comme $\frac{|\sin u|}{u}$, dont l'intégrale diverge.

    **(a)** On écrit $\frac{u\sin u}{1 + u^{2}} = \frac{\sin u}{u} - \frac{\sin u}{u(1 + u^{2})}$ : le second terme est intégrable en $+\infty$, et l'intégrale du premier converge. En revanche $\frac{u|\sin u|}{1 + u^{2}} \sim \frac{|\sin u|}{u}$, non intégrable. 
    $$\boxed{\text{convergente, non absolument}}$$

    **(b)** Le changement de variable $u = t^{2}$ sur $[1, x]$ donne 
    $$\int_{1}^{x} \sin(t^{2})\,\mathrm{d} t = \int_{1}^{x^{2}} \frac{\sin u}{2\sqrt{u}}\,\mathrm{d} u,$$
     qui converge par intégration par parties, comme pour $\frac{\sin u}{u}$. De même $\int_{1}^{x} |\sin(t^{2})|\,\mathrm{d} t = \int_{1}^{x^{2}} \frac{|\sin u|}{2\sqrt{u}}\,\mathrm{d} u$, et $\frac{|\sin u|}{2\sqrt{u}} \geqslant \frac{|\sin u|}{2u}$ pour $u \geqslant 1$. 
    $$\boxed{\text{convergente, non absolument}}$$

    **(c)** Avec $u = \mathrm{e}^{t}$, $\int_{0}^{x} \cos(\mathrm{e}^{t})\,\mathrm{d} t = \int_{1}^{\mathrm{e}^{x}} \frac{\cos u}{u}\,\mathrm{d} u$, qui converge, alors que $\frac{|\cos u|}{u}$ n'est pas intégrable. 
    $$\boxed{\text{convergente, non absolument}}$$

    **(d)** Une intégration par parties donne $\int_{2}^{x} \frac{\cos t}{\ln t}\,\mathrm{d} t = \Big[\frac{\sin t}{\ln t}\Big]_{2}^{x} + \int_{2}^{x} \frac{\sin t}{t\ln^{2}t}\,\mathrm{d} t$, et $\frac{1}{t\ln^{2}t}$ est intégrable (exercice 3) : convergence. Comme $|\cos t| \geqslant \cos^{2}t = \frac{1 + \cos(2t)}{2}$, on a $\frac{|\cos t|}{\ln t} \geqslant \frac{1}{2\ln t} + \frac{\cos(2t)}{2\ln t}$, somme d'une fonction d'intégrale divergente ($\frac{1}{\ln t} \geqslant \frac{1}{t}$) et d'une fonction d'intégrale convergente. 
    $$\boxed{\text{convergente, non absolument}}$$

    **(e)** En $0$, la fonction est bornée. En $+\infty$, $\sin\frac{1}{t} = \frac{1}{t} + O\big(\frac{1}{t^{3}}\big)$, donc $\sin(t)\sin\frac{1}{t} = \frac{\sin t}{t} + O\big(\frac{1}{t^{3}}\big)$ : convergence. Et $\sin\frac{1}{t} \geqslant \frac{1}{2t}$ pour $t \geqslant 1$, d'où $|\sin t\sin\frac{1}{t}| \geqslant \frac{|\sin t|}{2t}$. 
    $$\boxed{\text{convergente, non absolument}}$$
- id: "mp-12-10"
  feuille: "f-mp-12"
  numero: 10
  partie: "Fonctions intégrables"
  etoiles: 3
