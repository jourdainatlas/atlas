  page_enonce: 5
  page_corrige: 14
  enonce: |
    *Variations sur la gaussienne.*

    **1.** Soit $P = aX^{2} + bX + c \in \mathbb{R}_{2}[X]$. Étudier la convergence de $\displaystyle \int_{-\infty}^{+\infty} \mathrm{e}^{-P(x)}\,\mathrm{d} x$, et la calculer le cas échéant.

    **2.** Soit $a > 0$. On pose $\displaystyle I(a) = \int_{0}^{+\infty} \mathrm{e}^{-t^{2} - a^{2}/t^{2}}\,\mathrm{d} t$ et $\displaystyle J(a) = a\int_{0}^{+\infty} \frac{\mathrm{e}^{-t^{2} - a^{2}/t^{2}}}{t^{2}}\,\mathrm{d} t$. Montrer que ces intégrales convergent et que $I(a) = J(a)$.

    **3.** En déduire que $\displaystyle I(a) = \frac{\mathrm{e}^{-2a}}{2}\int_{0}^{+\infty} \Big(1 + \frac{a}{t^{2}}\Big)\mathrm{e}^{-(t - a/t)^{2}}\,\mathrm{d} t$, puis que $I(a) = \frac{\sqrt{\pi}}{2}\mathrm{e}^{-2a}$.
  corrige: |
    On se ramène à l'intégrale de Gauss par mise sous forme canonique, puis, pour $I(a)$, par une symétrie qui fait apparaître la dérivée de $t - \frac{a}{t}$.

    **1.** Si $a < 0$, $\mathrm{e}^{-P}$ tend vers $+\infty$ ; si $a = 0$, $\mathrm{e}^{-bx - c}$ ne tend pas vers $0$ en l'une des bornes : divergence. Si $a > 0$, $P(x) = a\big(x + \frac{b}{2a}\big)^{2} - \frac{b^{2} - 4ac}{4a}$, et le changement de variable $u = \sqrt{a}\big(x + \frac{b}{2a}\big)$ donne 
    $$\boxed{\int_{-\infty}^{+\infty} \mathrm{e}^{-P(x)}\,\mathrm{d} x = \sqrt{\frac{\pi}{a}}\,\mathrm{e}^{\frac{b^{2} - 4ac}{4a}} \quad (a > 0), \qquad \text{divergente si } a \leqslant 0}$$

    **2.** Les intégrandes tendent vers $0$ en $0$ (par croissances comparées, $\frac{1}{t^{2}}\mathrm{e}^{-a^{2}/t^{2}} \to 0$) et sont dominées par $\mathrm{e}^{-t^{2}}$ et $\frac{\mathrm{e}^{-t^{2}}}{t^{2}}$ en $+\infty$. Le changement de variable $t = \frac{a}{u}$, bijection décroissante de $]0, +\infty[$, donne 
    $$I(a) = \int_{0}^{+\infty} \mathrm{e}^{-a^{2}/u^{2} - u^{2}}\frac{a}{u^{2}}\,\mathrm{d} u = J(a). \qquad \boxed{I(a) = J(a)}$$

    **3.** On écrit $I = \frac{I + J}{2}$, avec $t^{2} + \frac{a^{2}}{t^{2}} = \big(t - \frac{a}{t}\big)^{2} + 2a$, ce qui donne la formule annoncée. Le changement de variable $u = t - \frac{a}{t}$, bijection croissante de classe $\mathcal{C}^{1}$ de $]0, +\infty[$ sur $\mathbb{R}$, de dérivée $1 + \frac{a}{t^{2}}$, la transforme en $\frac{\mathrm{e}^{-2a}}{2}\int_{-\infty}^{+\infty} \mathrm{e}^{-u^{2}}\,\mathrm{d} u$. 
    $$\boxed{\int_{0}^{+\infty} \mathrm{e}^{-t^{2} - a^{2}/t^{2}}\,\mathrm{d} t = \frac{\sqrt{\pi}}{2}\mathrm{e}^{-2a}}$$
     Valeur contrôlée numériquement pour $a = 0{,}8$. On note que la limite quand $a \to 0$ redonne $\frac{\sqrt{\pi}}{2}$, ce que justifiera le chapitre 13.
- id: "mp-12-19"
