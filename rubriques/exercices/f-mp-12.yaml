  enonce: |
    *La moyenne arithmético-géométrique.* Pour $a$, $b > 0$, on pose 
    $$J(a, b) = 2\int_{0}^{\pi/2} \frac{\mathrm{d}\theta}{\sqrt{a^{2}\cos^{2}\theta + b^{2}\sin^{2}\theta}}.$$

    **1.** Montrer que $\displaystyle J(a, b) = \int_{-\infty}^{+\infty} \frac{\mathrm{d} x}{\sqrt{(x^{2} + a^{2})(x^{2} + b^{2})}}$.

    **2.** Montrer que $\displaystyle J(a, b) = J\Big(\frac{a + b}{2}, \sqrt{ab}\Big)$.

    **3.** On définit les suites $(a_{n})$ et $(b_{n})$ par $a_{0} = a$, $b_{0} = b$, $a_{n + 1} = \frac{a_{n} + b_{n}}{2}$ et $b_{n + 1} = \sqrt{a_{n}b_{n}}$. Montrer qu'elles convergent vers une limite commune $M(a, b)$, et que $\displaystyle M(a, b) = \frac{\pi}{J(a, b)}$.

    **4.** Calculer $a_{n}$ et $b_{n}$ pour $a = 2$, $b = 1$ et $n \leqslant 4$, et en déduire une valeur approchée de $J(2, 1)$. Que dire de la vitesse de convergence observée ?
  corrige: |
    Deux changements de variable, $u = \tan\theta$ puis la substitution « de Gauss » $x = \frac{1}{2}\big(t - \frac{ab}{t}\big)$, donnent l'invariance de $J$, et la monotonie de $J$ conclut.

    **1.** Avec $u = \tan\theta$, puis $x = bu$ : 
    $$J(a, b) = 2\int_{0}^{+\infty} \frac{\mathrm{d} u}{\sqrt{1 + u^{2}}\sqrt{a^{2} + b^{2}u^{2}}} = 2\int_{0}^{+\infty} \frac{\mathrm{d} x}{\sqrt{(x^{2} + a^{2})(x^{2} + b^{2})}},$$
     et l'on conclut par parité. L'intégrande est équivalente à $\frac{1}{x^{2}}$ en $\pm\infty$.

    **2.** Écrivons $J\big(\frac{a + b}{2}, \sqrt{ab}\big)$ sous la forme de la question 1, et posons $x = \frac{1}{2}\big(t - \frac{ab}{t}\big)$, bijection croissante de $]0, +\infty[$ sur $\mathbb{R}$, avec $\mathrm{d} x = \frac{t^{2} + ab}{2t^{2}}\,\mathrm{d} t$. On calcule 
    $$x^{2} + ab = \Big(\frac{t^{2} + ab}{2t}\Big)^{2}, \qquad x^{2} + \Big(\frac{a + b}{2}\Big)^{2} = \frac{(t^{2} + a^{2})(t^{2} + b^{2})}{4t^{2}},$$
     de sorte que l'intégrande devient $\frac{2\,\mathrm{d} t}{\sqrt{(t^{2} + a^{2})(t^{2} + b^{2})}}$, d'intégrale sur $]0, +\infty[$ égale à $J(a, b)$. 
    $$\boxed{J(a, b) = J\Big(\frac{a + b}{2}, \sqrt{ab}\Big)}$$

    **3.** Par l'inégalité arithmético-géométrique, $b_{n} \leqslant a_{n}$ pour $n \geqslant 1$ ; alors $a_{n + 1} \leqslant a_{n}$ et $b_{n + 1} \geqslant b_{n}$. Les suites, monotones et bornées, convergent, et le passage à la limite dans $a_{n + 1} = \frac{a_{n} + b_{n}}{2}$ montre que leurs limites sont égales. Par la question 2, $J(a, b) = J(a_{n}, b_{n})$ pour tout $n$. Or $J$ est décroissante en chacune de ses variables, et $J(c, c) = \frac{\pi}{c}$, donc 
    $$\frac{\pi}{a_{n}} = J(a_{n}, a_{n}) \leqslant J(a, b) \leqslant J(b_{n}, b_{n}) = \frac{\pi}{b_{n}}, \qquad \boxed{M(a, b) = \frac{\pi}{J(a, b)}}$$

    **4.** On obtient

    $$\begin{array}{|c|c|c|c|} \hline n & a_{n} & b_{n} & a_{n} - b_{n} \\ \hline 0 & 2 & 1 & 1 \\ \hline 1 & 1{,}5 & 1{,}414\,213\,562 & 8{,}6 \cdot 10^{-2} \\ \hline 2 & 1{,}457\,106\,781 & 1{,}456\,475\,315 & 6{,}3 \cdot 10^{-4} \\ \hline 3 & 1{,}456\,791\,048 & 1{,}456\,791\,014 & 3{,}4 \cdot 10^{-8} \\ \hline 4 & 1{,}456\,791\,031 & 1{,}456\,791\,031 & 1{,}0 \cdot 10^{-16} \\ \hline \end{array}$$

    $$\boxed{J(2, 1) = \frac{\pi}{M(2, 1)} \approx 2{,}156\,515\,647}$$
     L'écart est à peu près élevé au carré à chaque étape : le nombre de décimales exactes double, c'est une convergence *quadratique*. Quatre itérations donnent seize décimales, là où une méthode des rectangles demanderait un nombre astronomique de points.

