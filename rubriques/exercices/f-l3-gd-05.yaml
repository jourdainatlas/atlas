  enonce: |
    **Le carré complexe double l'indice.** Soit $P : \mathbb{R}^{2} \setminus \{0\} \to \mathbb{R}^{2} \setminus \{0\}$, $P(z) = z^{2}$ en notation complexe.

    **1.** Calculer $P^{*}\omega$. On pourra utiliser les coordonnées polaires et l'exercice 12.

    **2.** En déduire que $\operatorname{Ind}(P \circ \gamma) = 2\operatorname{Ind}(\gamma)$ pour tout lacet $\gamma$ de $\mathbb{R}^{2} \setminus \{0\}$. Généraliser à $z \mapsto z^{m}$, $m \in \mathbb{Z}$.
  corrige: |
    **1.** Soit $z_{0} \neq 0$ et $B$ un disque ouvert centré en $z_{0}$, ne contenant pas $0$, assez petit pour que $P(B)$ soit contenu dans un disque $B''$ ne contenant pas $0$. Ces disques sont étoilés et $\omega$ y est fermée : il existe $\theta_{1}$ sur $B$ et $\theta_{2}$ sur $B''$ telles que $\omega = \mathrm{d}\theta_{1}$ et $\omega = \mathrm{d}\theta_{2}$ (th. 3). Par l'exercice 12, ce sont des déterminations continues de l'argument (à une constante près), et
    $$\mathrm{e}^{\mathrm{i}\theta_{2}(z^{2})} = \frac{z^{2}}{|z|^{2}} = \mathrm{e}^{2\mathrm{i}\theta_{1}(z)} :$$
     la fonction continue $\theta_{2} \circ P - 2\theta_{1}$ est à valeurs dans $2\pi\mathbb{Z}$, donc constante sur $B$ connexe. Alors $P^{*}\omega = \mathrm{d}(\theta_{2} \circ P) = 2\,\mathrm{d}\theta_{1} = 2\omega$ sur $B$, et finalement $\boxed{P^{*}\omega = 2\omega}$ sur $\mathbb{R}^{2} \setminus \{0\}$.

    **2.** On a
    $$\int_{P \circ \gamma}\omega = \int_{\gamma}P^{*}\omega = 2\int_{\gamma}\omega ,$$
     d'où $\boxed{\operatorname{Ind}(P \circ \gamma) = 2\operatorname{Ind}(\gamma)}$. De même, $z \mapsto z^{m}$ multiplie l'argument par $m$ et l'indice par $m$ ; pour $m = -1$, $z \mapsto \dfrac{1}{z}$ change l'indice en son opposé.
- id: "l3-gd-05-14"
  feuille: "f-l3-gd-05"
  numero: 14
  partie: "Intégrales curvilignes, indice"
  etoiles: 2
  types: [Calcul]
  mots_cles: [intégrales curvilignes, homotopie]
  noeuds: [gd-integrale-curviligne, ta-homotopie]
  notions: [forme-fermee, forme-exacte, homotopie-chemins]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **Calculs d'indices par homotopie.** Calculer l'indice des lacets suivants, définis pour $t \in [0, 2\pi]$, en les déformant, grâce au théorème 5 du cours, en des lacets dont l'indice est connu :

    **(a)** $\gamma(t) = 2 + \mathrm{e}^{\mathrm{i} t}$ ;

    **(b)** $\gamma(t) = (a\cos t, b\sin t)$, avec $a, b > 0$ ;

    **(c)** $\gamma(t) = \mathrm{e}^{2\mathrm{i} t} + \dfrac{1}{2}\mathrm{e}^{-\mathrm{i} t}$ ;

    **(d)** $\gamma(t) = \dfrac{1}{2}\mathrm{e}^{2\mathrm{i} t} + \mathrm{e}^{-\mathrm{i} t}$.

    Dégager le principe : si $|\gamma_{1}(t) - \gamma_{0}(t)| < |\gamma_{0}(t)|$ pour tout $t$, alors $\gamma_{0}$ et $\gamma_{1}$ ont le même indice (« le chien en laisse »).
  corrige: |
    Le principe d'abord : si $|\gamma_{1}(t) - \gamma_{0}(t)| < |\gamma_{0}(t)|$ pour tout $t$, alors l'homotopie définie par $H(s, t) = \gamma_{0}(t) + s(\gamma_{1}(t) - \gamma_{0}(t))$ vérifie
    $$|H(s, t)| \geq |\gamma_{0}(t)| - |\gamma_{1}(t) - \gamma_{0}(t)| > 0 :$$
     elle reste dans $\mathbb{R}^{2} \setminus \{0\}$, et le théorème 5 donne $\operatorname{Ind}(\gamma_{1}) = \operatorname{Ind}(\gamma_{0})$. Un maître qui promène son chien autour d'un arbre, avec une laisse plus courte que sa distance à l'arbre, fait le même nombre de tours que lui.

    **(a)** $|\gamma(t) - 2| = 1 < 2$ : même indice que le lacet constant $2$, $\boxed{0}$.

    **(b)** $H(s, t) = \big((1 - s)a + s\big)\cos t + \mathrm{i}\big((1 - s)b + s\big)\sin t$ ne s'annule pas : même indice que le cercle unité, $\boxed{1}$.

    **(c)** 
    $$|\gamma - \mathrm{e}^{2\mathrm{i} t}| = \frac{1}{2} < 1 = |\mathrm{e}^{2\mathrm{i} t}| :$$
     indice de $c_{2}$, $\boxed{2}$.

    **(d)** $|\gamma - \mathrm{e}^{-\mathrm{i} t}| = \dfrac{1}{2} < 1$ : indice de $c_{-1}$, $\boxed{-1}$.

    ![Figure](documents/figures/f4bf6a388364dad2.svg)

    Les quatre lacets (en bleu) et l'origine (en rouge) ; pour (a), l'origine est en dehors du cercle. Le lacet (c), un trèfle à trois boucles, fait deux tours autour de l'origine dans le sens direct ; le lacet (d), un triangle aux côtés incurvés, en fait un dans le sens indirect. L'indice compte les tours autour de l'origine, pas les boucles du dessin.
- id: "l3-gd-05-15"
  feuille: "f-l3-gd-05"
