  enonce: |
    **Formes alternées décomposables.** Une $k$-forme alternée $\alpha \in \mathcal{A}^{k}(V)$ est dite *décomposable* s'il existe des formes linéaires $l_{1}, \dots, l_{k}$ telles que $\alpha = l_{1} \wedge \dots \wedge l_{k}$.

    **1.** On suppose $n = 4$ ; soit $(l_{1}, l_{2}, l_{3}, l_{4})$ une base de $V^{*}$ et $\omega_{0} = l_{1} \wedge l_{3} + l_{2} \wedge l_{4}$. Calculer $\omega_{0} \wedge \omega_{0}$ et montrer que $\omega_{0}$ n'est pas décomposable. Dans $\mathbb{R}^{4}$, en déduire que la $2$-forme $\mathrm{d} x_{1} \wedge \mathrm{d} x_{2} + \mathrm{d} x_{3} \wedge \mathrm{d} x_{4}$ n'est pas le produit extérieur de deux $1$-formes.

    **2.** Vérifier que toute forme alternée de degré $n$ est décomposable.

    **3.** Soit $\alpha \in \mathcal{A}^{n - 1}(V)$ et $\psi : V^{*} \to \mathcal{A}^{n}(V)$, $\psi(l) = l \wedge \alpha$. En considérant une base de $\mathrm{Ker}\,\psi$, prouver que $\alpha$ est décomposable. Pour $n = 3$ et une base $(l_{1}, l_{2}, l_{3})$ de $V^{*}$, décomposer $\alpha = l_{1} \wedge l_{2} + l_{2} \wedge l_{3} + l_{3} \wedge l_{1}$.

    **4.** Soit $l \in V^{*} \setminus \{0\}$ et $\alpha \in \mathcal{A}^{k}(V)$, $1 \leq k \leq n$. Établir qu'il existe $\beta \in \mathcal{A}^{k - 1}(V)$ telle que $\alpha = l \wedge \beta$ si et seulement si $l \wedge \alpha = 0$. On pourra compléter $l$ en une base de $V^{*}$.
  corrige: |
    **1.** Par distributivité et $l_{i} \wedge l_{i} = 0$ : 
    $$\omega_{0} \wedge \omega_{0} = l_{1} \wedge l_{3} \wedge l_{2} \wedge l_{4} + l_{2} \wedge l_{4} \wedge l_{1} \wedge l_{3} = 2\,l_{1} \wedge l_{3} \wedge l_{2} \wedge l_{4} = \boxed{-2\,l_{1} \wedge l_{2} \wedge l_{3} \wedge l_{4}} \neq 0 ,$$
     les deux termes étant égaux car $l_{2} \wedge l_{4}$, de degré pair, commute avec tout. Si $\omega_{0} = a \wedge b$, alors $\omega_{0} \wedge \omega_{0} = a \wedge b \wedge a \wedge b = 0$ : *$\omega_{0}$ n'est pas décomposable*.

    Avec $l_{1} = \mathrm{d} x_{1}$, $l_{3} = \mathrm{d} x_{2}$, $l_{2} = \mathrm{d} x_{3}$, $l_{4} = \mathrm{d} x_{4}$, la forme $\mathrm{d} x_{1} \wedge \mathrm{d} x_{2} + \mathrm{d} x_{3} \wedge \mathrm{d} x_{4}$, en chaque point, n'est pas un produit de deux formes linéaires.

    **2.** $\mathcal{A}^{n}(V)$ est une droite engendrée par $l_{1} \wedge \dots \wedge l_{n}$ (th. 1) : toute $\alpha$ s'écrit
    $$c\,l_{1} \wedge \dots \wedge l_{n} = (cl_{1}) \wedge l_{2} \wedge \dots \wedge l_{n} .$$

    **3.** Si $\alpha = 0$, c'est clair. Sinon, $\psi$ est linéaire de $V^{*}$ (dimension $n$) dans $\mathcal{A}^{n}(V)$ (dimension $1$), donc $\dim\mathrm{Ker}\,\psi \geq n - 1$. Soit $(l_{1}, \dots, l_{n - 1})$ une famille libre de $\mathrm{Ker}\,\psi$, complétée en une base $(l_{1}, \dots, l_{n})$ de $V^{*}$. Dans la base de $\mathcal{A}^{n - 1}(V)$ formée des
    $$\hat{\lambda}_{j} = l_{1} \wedge \dots \wedge \widehat{l_{j}} \wedge \dots \wedge l_{n}$$
     (où $l_{j}$ est omis), écrivons
    $$\alpha = \sum_{j}c_{j}\hat{\lambda}_{j} .$$
     Pour $i \leq n - 1$, $l_{i} \wedge \hat{\lambda}_{j} = 0$ si $j \neq i$ et $l_{i} \wedge \hat{\lambda}_{i} = \pm l_{1} \wedge \dots \wedge l_{n}$, donc $0 = \psi(l_{i}) = \pm c_{i}\,l_{1} \wedge \dots \wedge l_{n}$ et $c_{i} = 0$.

    Ainsi $\alpha = c_{n}\,l_{1} \wedge \dots \wedge l_{n - 1}$ : *$\alpha$ est décomposable*. Pour $n = 3$, 
    $$(l_{1} - l_{3}) \wedge (l_{2} - l_{3}) = l_{1} \wedge l_{2} - l_{1} \wedge l_{3} - l_{3} \wedge l_{2} = \boxed{l_{1} \wedge l_{2} + l_{2} \wedge l_{3} + l_{3} \wedge l_{1}} .$$

    **4.** Si $\alpha = l \wedge \beta$, $l \wedge \alpha = l \wedge l \wedge \beta = 0$. Réciproquement, complétons $l = l_{1}$ en une base $(l_{1}, \dots, l_{n})$ et décomposons $\alpha = l_{1} \wedge \beta + \gamma$, où $\gamma$ regroupe les éléments de base $l_{i_{1}} \wedge \dots \wedge l_{i_{k}}$ ne contenant pas $l_{1}$, et $\beta$ est une combinaison d'éléments de base de degré $k - 1$. Alors $0 = l_{1} \wedge \alpha = l_{1} \wedge \gamma$, et les $l_{1} \wedge l_{i_{1}} \wedge \dots \wedge l_{i_{k}}$ ($1 < i_{1} < \dots < i_{k}$) sont des éléments distincts de la base de $\mathcal{A}^{k + 1}(V)$ : tous les coefficients de $\gamma$ sont nuls, et *$\alpha = l \wedge \beta$*.
