  enonce: |
    **Une primitive.** Soit $\alpha \in \Omega^{1}(\mathbb{R}^{3})$ définie par $\alpha = (12x^{3}z + 2xy^{3})\,\mathrm{d} x + 3x^{2}y^{2}\,\mathrm{d} y + 3x^{4}\,\mathrm{d} z$.

    **1.** Vérifier que $\alpha$ est fermée. Que peut-on en conclure ?

    **2.** Déterminer toutes les fonctions différentiables $g : \mathbb{R}^{3} \to \mathbb{R}$ telles que $\mathrm{d} g = \alpha$.
  corrige: |
    **1.** On vérifie les trois égalités
    $$\partial_{y}(12x^{3}z + 2xy^{3}) = 6xy^{2} = \partial_{x}(3x^{2}y^{2}), \qquad \partial_{z}(12x^{3}z + 2xy^{3}) = 12x^{3} = \partial_{x}(3x^{4}),$$

    $$\partial_{z}(3x^{2}y^{2}) = 0 = \partial_{y}(3x^{4}) :$$
     *$\alpha$ est fermée*, donc exacte sur $\mathbb{R}^{3}$, étoilé (th. 3).

    **2.** $g_{z} = 3x^{4}$ donne $g = 3x^{4}z + k(x, y)$ ; $g_{y} = k_{y} = 3x^{2}y^{2}$ donne $k = x^{2}y^{3} + m(x)$ ; enfin $g_{x} = 12x^{3}z + 2xy^{3} + m'(x)$ impose $m' = 0$. $g = 3x^{4}z + x^{2}y^{3} + C$, $C \in \mathbb{R}$, toutes les primitives différant d'une constante sur l'ouvert connexe $\mathbb{R}^{3}$ (exercice 10).
- id: "l3-gd-05-09"
  feuille: "f-l3-gd-05"
  numero: 9
  partie: "Primitives, lemme de Poincaré"
  etoiles: 2
  types: [Calcul]
  mots_cles: [lemme de Poincaré]
  noeuds: [gd-poincare]
  notions: [forme-fermee, forme-exacte, partie-etoilee]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **L'opérateur de Poincaré en action.** Soit $\alpha = x\,\mathrm{d} y \wedge \mathrm{d} z - y\,\mathrm{d} z \wedge \mathrm{d} x \in \Omega^{2}(\mathbb{R}^{3})$.

    **1.** Vérifier que $\alpha$ est fermée.

    **2.** Calculer la $1$-forme $K\alpha$ donnée par l'opérateur de Poincaré du cours (théorème 3),
    $$(K\alpha)_{x} = \int_{0}^{1}t\,\iota_{x}(\alpha_{tx})\,\mathrm{d} t ,$$
     et vérifier que $\mathrm{d}(K\alpha) = \alpha$.

    **3.** Déterminer toutes les primitives de $\alpha$, en remarquant que deux primitives diffèrent d'une $1$-forme fermée.
  corrige: |
    **1.** On a
    $$\mathrm{d}\alpha = \mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z - \mathrm{d} y \wedge \mathrm{d} z \wedge \mathrm{d} x = 0 ,$$
     les deux termes étant égaux (permutation circulaire).

    **2.** $\alpha_{tx} = t\,(x\,\mathrm{d} y \wedge \mathrm{d} z - y\,\mathrm{d} z \wedge \mathrm{d} x)$, et le produit intérieur par $x = (x, y, z)$ donne $\iota_{x}(\mathrm{d} y \wedge \mathrm{d} z) = y\,\mathrm{d} z - z\,\mathrm{d} y$ et $\iota_{x}(\mathrm{d} z \wedge \mathrm{d} x) = z\,\mathrm{d} x - x\,\mathrm{d} z$, d'où 
    $$\iota_{x}(\alpha_{tx}) = t\,(2xy\,\mathrm{d} z - xz\,\mathrm{d} y - yz\,\mathrm{d} x),$$

    $$\boxed{K\alpha = \frac{1}{3}\left(2xy\,\mathrm{d} z - xz\,\mathrm{d} y - yz\,\mathrm{d} x\right)} .$$
     On calcule
    $$\mathrm{d}(2xy\,\mathrm{d} z) = 2y\,\mathrm{d} x \wedge \mathrm{d} z + 2x\,\mathrm{d} y \wedge \mathrm{d} z, \qquad \mathrm{d}(-xz\,\mathrm{d} y) = -z\,\mathrm{d} x \wedge \mathrm{d} y + x\,\mathrm{d} y \wedge \mathrm{d} z,$$

    $$\mathrm{d}(-yz\,\mathrm{d} x) = z\,\mathrm{d} x \wedge \mathrm{d} y - y\,\mathrm{d} z \wedge \mathrm{d} x .$$
     La somme vaut $3x\,\mathrm{d} y \wedge \mathrm{d} z - 3y\,\mathrm{d} z \wedge \mathrm{d} x$ : *$\mathrm{d}(K\alpha) = \alpha$.*

    **3.** Si $\mathrm{d}\eta = \alpha$, $\mathrm{d}(\eta - K\alpha) = 0$, et par le lemme de Poincaré en degré $1$, $\eta - K\alpha = \mathrm{d} g$ : *les primitives sont les $K\alpha + \mathrm{d} g$, $g \in \mathcal{C}^{\infty}(\mathbb{R}^{3})$.* Contrairement au degré $0$, une $2$-forme exacte a une infinité de primitives qui ne diffèrent pas d'une constante.
