  enonce: |
    **Familles liées.** Soit $(l_{1}, \dots, l_{k})$ une famille de formes linéaires sur $V$, avec $k \geq 1$.

    **1.** Montrer que $(l_{1}, l_{2})$ est liée si et seulement si $l_{1} \wedge l_{2} = 0$.

    **2.** Établir plus généralement que $(l_{1}, \dots, l_{k})$ est liée si et seulement si $l_{1} \wedge \dots \wedge l_{k} = 0$. On pourra compléter une famille libre en une base de $V^{*}$ et utiliser la base duale.
  corrige: |
    **1.** C'est le cas $k = 2$ de la question 2.

    **2.** Si la famille est liée, l'une des formes est combinaison des autres, par exemple
    $$l_{k} = \sum_{i < k}\lambda_{i}l_{i} ,$$
     et
    $$l_{1} \wedge \dots \wedge l_{k} = \sum_{i < k}\lambda_{i}\,l_{1} \wedge \dots \wedge l_{k - 1} \wedge l_{i} = 0 ,$$
     car un produit extérieur où un facteur figure deux fois est nul (anticommutativité, th. 1). Si elle est libre, complétons-la en une base $(l_{1}, \dots, l_{n})$ de $V^{*}$, et soit $(e_{1}, \dots, e_{n})$ la base de $V$ dont elle est la duale.

    Par la formule du déterminant, 
    $$(l_{1} \wedge \dots \wedge l_{k})(e_{1}, \dots, e_{k}) = \det\big(l_{i}(e_{j})\big)_{1 \leq i, j \leq k} = \det I_{k} = 1 \neq 0 .$$
     *La famille est liée si et seulement si $l_{1} \wedge \dots \wedge l_{k} = 0$* : le produit extérieur généralise le déterminant comme test d'indépendance.
