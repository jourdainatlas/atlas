  enonce: |
    **La forme $\omega$ et l'angle polaire.** Soit $\omega = \dfrac{x\,\mathrm{d} y - y\,\mathrm{d} x}{x^{2} + y^{2}}$ sur $\mathbb{R}^{2} \setminus \{0\}$.

    **1.** Vérifier que $\omega$ est fermée.

    **2.** Soit $\gamma : I \to \mathbb{R}^{2} \setminus \{0\}$ une courbe régulière de classe $\mathcal{C}^{2}$. Expliciter $\gamma^{*}\omega$ sous la forme $h(t)\,\mathrm{d} t$, et interpréter géométriquement $|h|$.

    **3.** À partir du cas $\gamma(t) = \mathrm{e}^{\mathrm{i} t}$, prouver que $\omega$ n'est pas exacte. Sous quelle hypothèse topologique sur un ouvert $U$ les notions de forme fermée et de forme exacte coïncident-elles (théorèmes 3, 4 et 6 du cours) ?

    **4.** Soit $\Phi : \, ]0, +\infty[ \times \, ]{-\pi}, \pi[ \to \mathbb{R}^{2} \setminus \, ]{-\infty}, 0]$, $\Phi(\rho, \theta) = \rho\,\mathrm{e}^{\mathrm{i}\theta}$. Calculer $\Phi^{*}\omega$, et en déduire une primitive de $\omega$ sur $\mathbb{R}^{2} \setminus \, ]{-\infty}, 0]$.

    **5.** On suppose de plus $\gamma(I) \subset \mathbb{R}^{2} \setminus \, ]{-\infty}, 0]$. Montrer qu'il existe des fonctions $r : I \to \, ]0, +\infty[$ et $\varphi : I \to \, ]{-\pi}, \pi[$ de classe $\mathcal{C}^{2}$ telles que $\gamma = r\,\mathrm{e}^{\mathrm{i}\varphi}$, et exprimer $\mathop{\displaystyle \int_{\gamma|[a, b]}}\omega$ en fonction de $\varphi(a)$ et $\varphi(b)$. Énoncer géométriquement le résultat.
  corrige: |
    **1.** Avec $P = -\dfrac{y}{x^{2} + y^{2}}$ et $Q = \dfrac{x}{x^{2} + y^{2}}$,
    $$Q_{x} - P_{y} = \frac{y^{2} - x^{2}}{(x^{2} + y^{2})^{2}} + \frac{x^{2} - y^{2}}{(x^{2} + y^{2})^{2}} = 0 .$$

    **2.** On a
    $$\boxed{\gamma^{*}\omega = \frac{xy' - yx'}{x^{2} + y^{2}}\,\mathrm{d} t} ,$$
     avec $\gamma = (x, y)$. Écrivant $xy' - yx' = \det(\gamma, \gamma')$, on voit que
    $$h = \frac{\det(\gamma, \gamma')}{\lVert \gamma \rVert^{2}}$$
     est la *vitesse angulaire* de $\gamma(t)$ vue de l'origine : la composante de $\gamma'$ orthogonale au rayon, divisée par la distance.
    $$|h| = \frac{\lVert \gamma' \rVert\,|\sin\delta|}{\lVert \gamma \rVert} ,$$
     où $\delta$ est l'angle entre le rayon et la tangente.

    **3.** Pour $\gamma(t) = \mathrm{e}^{\mathrm{i} t}$, $h = 1$ et
    $$\int_{0}^{2\pi}\gamma^{*}\omega = 2\pi \neq 0 ;$$
     une forme exacte aurait une intégrale nulle sur ce lacet (prop. 8) : *$\omega$ n'est pas exacte*. Fermée et exacte coïncident sur un ouvert étoilé (th. 3), plus généralement difféomorphe à un étoilé (th. 4), et, pour les $1$-formes, sur un ouvert *simplement connexe* (th. 6). Le plan privé de l'origine n'est rien de cela.

    **4.** $\Phi^{*}\omega = \mathrm{d}\theta$ (cours, section 5.6). Comme $\Phi$ est un difféomorphisme, d'inverse
    $$(x, y) \mapsto \left(\sqrt{x^{2} + y^{2}}, \ 2\arctan\frac{y}{x + \sqrt{x^{2} + y^{2}}}\right) ,$$
     on a $\omega = (\Phi^{-1})^{*}\mathrm{d}\theta = \mathrm{d}(\theta \circ \Phi^{-1})$ : *une primitive de $\omega$ sur le plan fendu est l'argument principal* $2\arctan\dfrac{y}{x + \sqrt{x^{2} + y^{2}}} \in \, ]{-\pi}, \pi[$.

    **5.** $(r, \varphi) = \Phi^{-1} \circ \gamma$ est de classe $\mathcal{C}^{2}$ et $\gamma = r\mathrm{e}^{\mathrm{i}\varphi}$. Alors
    $$\gamma^{*}\omega = (\Phi^{-1} \circ \gamma)^{*}\mathrm{d}\theta = \varphi'(t)\,\mathrm{d} t ,$$
     et
    $$\boxed{\int_{\gamma|[a, b]}\omega = \varphi(b) - \varphi(a)} :$$
     *l'intégrale de $\omega$ mesure la variation de l'angle polaire le long de la courbe*. Sur $\mathbb{R}^{2} \setminus \{0\}$ tout entier, on ne peut plus choisir l'angle continûment de façon globale, mais on peut toujours le relever le long d'une courbe ; sur un lacet, la variation totale est $2\pi$ fois un entier, l'indice.
