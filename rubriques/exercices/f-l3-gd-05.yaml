  enonce: |
    **Coordonnées sphériques.** Soit
    $$\Psi(r, \theta, \varphi) = (r\cos\varphi\cos\theta, r\cos\varphi\sin\theta, r\sin\varphi) ,$$
     défini sur $]0, +\infty[ \times \, ]0, 2\pi[ \times \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$.

    **1.** Calculer $\Psi^{*}(\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z)$ à l'aide de la proposition 6 du cours, puis $\Psi^{*}(x\,\mathrm{d} x + y\,\mathrm{d} y + z\,\mathrm{d} z)$.

    **2.** En déduire le volume de la boule unité de $\mathbb{R}^{3}$, en admettant la formule de changement de variables.
  corrige: |
    **1.** Par la proposition 6,
    $$\Psi^{*}(\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z) = \mathrm{d}\Psi_{1} \wedge \mathrm{d}\Psi_{2} \wedge \mathrm{d}\Psi_{3} = \det(J\Psi)\,\mathrm{d} r \wedge \mathrm{d}\theta \wedge \mathrm{d}\varphi ,$$
     et le calcul (vérifié par calcul formel) donne $\boxed{r^{2}\cos\varphi\,\mathrm{d} r \wedge \mathrm{d}\theta \wedge \mathrm{d}\varphi}$. Puis
    $$x\,\mathrm{d} x + y\,\mathrm{d} y + z\,\mathrm{d} z = \frac{1}{2}\mathrm{d}(x^{2} + y^{2} + z^{2}) ,$$
     donc
    $$\Psi^{*}(\ldots) = \frac{1}{2}\mathrm{d}(r^{2}) = \boxed{r\,\mathrm{d} r} ,$$
     par la commutation de $\mathrm{d}$ et $\Psi^{*}$.

    **2.** Volume
    $$= \int_{0}^{1}\int_{0}^{2\pi}\int_{-\pi/2}^{\pi/2}r^{2}\cos\varphi\,\mathrm{d}\varphi\,\mathrm{d}\theta\,\mathrm{d} r = \frac{1}{3}\cdot 2\pi\cdot 2 = \boxed{\frac{4\pi}{3}} .$$
- id: "l3-gd-05-07"
