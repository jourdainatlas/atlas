  enonce: |
    **Le théorème du point fixe de Brouwer dans le disque.** Soit $D$ le disque unité fermé de $\mathbb{R}^{2}$ et $f : D \to D$ une application de classe $\mathcal{C}^{1}$. On veut montrer que $f$ a un point fixe ; supposons le contraire, et posons $g(x) = x - f(x)$, qui ne s'annule pas sur $D$.

    **1.** Pour $s \in [0, 1]$, on pose $\gamma_{s}(t) = g(s\mathrm{e}^{\mathrm{i} t})$. Montrer que $\gamma_{1}$ est d'indice nul.

    **2.** Pour $\lambda \in [0, 1]$, on pose $\delta_{\lambda}(t) = \mathrm{e}^{\mathrm{i} t} - \lambda f(\mathrm{e}^{\mathrm{i} t})$. Montrer que $\delta_{\lambda}$ ne passe pas par $0$, et en déduire que $\gamma_{1}$ est d'indice $1$.

    **3.** Conclure. Le résultat reste vrai pour $f$ seulement continue, par un argument d'approximation que l'on admettra.

    **4.** Interpréter : si l'on froisse une feuille de papier posée sur une table, sans la déchirer, et qu'on la repose dans le contour qu'elle occupait, au moins un point est revenu exactement à sa place.
  corrige: |
    **1.** $f$ étant de classe $\mathcal{C}^{1}$, chaque $\gamma_{s}$ est un lacet de classe $\mathcal{C}^{1}$, et $(s, t) \mapsto g(s\mathrm{e}^{\mathrm{i} t})$ est une homotopie continue dans $\mathbb{R}^{2} \setminus \{0\}$ entre le lacet constant $\gamma_{0} = g(0)$ et $\gamma_{1}$ : *$\operatorname{Ind}(\gamma_{1}) = 0$.*

    **2.** Si $\delta_{\lambda}(t) = 0$, $\mathrm{e}^{\mathrm{i} t} = \lambda f(\mathrm{e}^{\mathrm{i} t})$ et $1 \leq \lambda\lVert f(\mathrm{e}^{\mathrm{i} t}) \rVert \leq \lambda \leq 1$, donc $\lambda = 1$ et $f(\mathrm{e}^{\mathrm{i} t}) = \mathrm{e}^{\mathrm{i} t}$, point fixe exclu. Ainsi $(\lambda, t) \mapsto \delta_{\lambda}(t)$ est une homotopie dans $\mathbb{R}^{2} \setminus \{0\}$ entre le cercle unité $\delta_{0}$, d'indice $1$, et $\delta_{1} = \gamma_{1}$ : *$\operatorname{Ind}(\gamma_{1}) = 1$.*

    **3.** $0 = 1$ : contradiction, et *$f$ a un point fixe.*

    **4.** Après le froissage, chaque point $x$ de la feuille se retrouve, vu d'en haut, en un point $f(x)$ du même disque ; l'application $f$ est continue puisque la feuille n'est pas déchirée, et le théorème donne un point fixe. Le même argument montre aussi que $\mathbb{S}^{1}$ n'est pas un *rétracte* du disque : il n'existe pas d'application continue $D \to \mathbb{S}^{1}$ qui laisse fixes les points du cercle.

