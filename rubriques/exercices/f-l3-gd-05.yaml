  enonce: |
    **Produit tensoriel nul.** Soient $f \in \mathcal{L}^{k}(V)$ et $g \in \mathcal{L}^{l}(V)$. Montrer que $f \otimes g = 0$ si et seulement si $f = 0$ ou $g = 0$. Le résultat subsiste-t-il pour le produit extérieur de deux formes alternées ?
  corrige: |
    Si $f = 0$ ou $g = 0$, $f \otimes g = 0$. Sinon, il existe $(v_{1}, \dots, v_{k})$ et $(w_{1}, \dots, w_{l})$ tels que $f(v_{1}, \dots, v_{k}) \neq 0$ et $g(w_{1}, \dots, w_{l}) \neq 0$, et $(f \otimes g)(v_{1}, \dots, v_{k}, w_{1}, \dots, w_{l})$, produit de ces deux nombres, n'est pas nul. *Pour le produit extérieur, c'est faux* : $l \wedge l = 0$ pour toute forme linéaire $l \neq 0$, et plus généralement $\alpha \wedge \beta = 0$ dès que le degré total dépasse $n$.
