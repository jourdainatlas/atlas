  enonce: |
    **Produit de formes fermées.** Soient $\omega_{1}$ et $\omega_{2}$ des formes fermées, de degrés quelconques, sur un ouvert $U$ de $\mathbb{R}^{n}$.

    **1.** Vérifier que $\omega_{1} \wedge \omega_{2}$ est fermée.

    **2.** Si de plus $\omega_{1}$ est exacte sur $U$, montrer que $\omega_{1} \wedge \omega_{2}$ est exacte sur $U$.
  corrige: |
    **1.** Par la formule de Leibniz,
    $$\mathrm{d}(\omega_{1} \wedge \omega_{2}) = \mathrm{d}\omega_{1} \wedge \omega_{2} \pm \omega_{1} \wedge \mathrm{d}\omega_{2} = 0 .$$

    **2.** Si $\omega_{1} = \mathrm{d}\eta$ avec $\eta$ de degré $k - 1$,
    $$\mathrm{d}(\eta \wedge \omega_{2}) = \mathrm{d}\eta \wedge \omega_{2} + (-1)^{k - 1}\eta \wedge \mathrm{d}\omega_{2} = \omega_{1} \wedge \omega_{2} :$$
     *$\eta \wedge \omega_{2}$ est une primitive.* Les formes fermées forment donc une algèbre, dans laquelle les formes exactes forment un idéal : c'est la structure qui fait du quotient (la cohomologie de de Rham évoquée en fin de chapitre) un anneau.
