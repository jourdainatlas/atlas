  enonce: |
    **La forme d'angle solide.** On définit $\sigma \in \Omega^{2}(\mathbb{R}^{3} \setminus \{0\})$ par $\sigma_{p}(u, v) = \det(p, u, v)$, et l'on pose $f(p) = \lVert p \rVert$.

    **1.** Exprimer $\sigma$ dans les coordonnées usuelles $(x, y, z)$ de $\mathbb{R}^{3}$.

    **2.** La forme $\sigma$ est-elle fermée ? Montrer qu'il existe un unique $a \in \mathbb{R}$ tel que $f^{a}\sigma$ soit fermée.

    **3.** Vérifier que la forme $f^{-3}\sigma$ est invariante par les homothéties $h_{\lambda} : p \mapsto \lambda p$, $\lambda > 0$, c'est-à-dire que $h_{\lambda}^{*}(f^{-3}\sigma) = f^{-3}\sigma$.

    **4.** Soit $\psi(\theta, \varphi) = (\cos\varphi\cos\theta, \cos\varphi\sin\theta, \sin\varphi)$ les coordonnées sphériques sur $U = \, ]0, 2\pi[ \times \, ]{-\dfrac{\pi}{2}}, \dfrac{\pi}{2}[$. Prouver, sans calcul, que $\psi^{*}\sigma \in \Omega^{2}(U)$ est fermée.

    **5.** Expliciter $\psi^{*}\sigma$ sous la forme $g(\theta, \varphi)\,\mathrm{d}\theta \wedge \mathrm{d}\varphi$, et calculer $\mathop{\displaystyle \iint_{U}}g(\theta, \varphi)\,\mathrm{d}\theta\,\mathrm{d}\varphi$. Interpréter.

    **6.** Vérifier la relation $f^{*}\left(\dfrac{\mathrm{d} t}{t}\right) \wedge \sigma = \mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$ sur $\mathbb{R}^{3} \setminus \{0\}$.
  corrige: |
    **1.** En développant $\det(p, u, v)$ selon la première colonne,
    $$\boxed{\sigma = x\,\mathrm{d} y \wedge \mathrm{d} z + y\,\mathrm{d} z \wedge \mathrm{d} x + z\,\mathrm{d} x \wedge \mathrm{d} y} :$$
     c'est $\beta_{X}$ (exercice 4) pour le champ radial $X(p) = p$.

    **2.** On a $\mathrm{d}\sigma = 3\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z \neq 0$ : *$\sigma$ n'est pas fermée*. Comme
    $$\mathrm{d} f = \frac{x\,\mathrm{d} x + y\,\mathrm{d} y + z\,\mathrm{d} z}{f}$$
     et
    $$\alpha_{X} \wedge \beta_{X} = \lVert X \rVert^{2}\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z ,$$

    $$\mathrm{d}(f^{a}\sigma) = af^{a - 1}\mathrm{d} f \wedge \sigma + f^{a}\mathrm{d}\sigma = (af^{a} + 3f^{a})\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z ,$$
     nulle si et seulement si $\boxed{a = -3}$.

    **3.** On a
    $$(h_{\lambda}^{*}\sigma)_{p}(u, v) = \sigma_{\lambda p}(\lambda u, \lambda v) = \lambda^{3}\sigma_{p}(u, v)$$
     et $f \circ h_{\lambda} = \lambda f$, donc
    $$h_{\lambda}^{*}(f^{-3}\sigma) = \lambda^{-3}f^{-3}\lambda^{3}\sigma = f^{-3}\sigma .$$

    **4.** $\psi^{*}\sigma$ est une $2$-forme sur un ouvert de $\mathbb{R}^{2}$ : sa différentielle est une $3$-forme sur $\mathbb{R}^{2}$, nécessairement nulle. *Toute $2$-forme sur un ouvert de $\mathbb{R}^{2}$ est fermée.*

    **5.** On a
    $$(\psi^{*}\sigma)(\partial_{\theta}, \partial_{\varphi}) = \det(\psi, \psi_{\theta}, \psi_{\varphi}) ,$$
     et le calcul donne $\boxed{\psi^{*}\sigma = \cos\varphi\,\mathrm{d}\theta \wedge \mathrm{d}\varphi}$, puis
    $$\iint_{U}\cos\varphi\,\mathrm{d}\theta\,\mathrm{d}\varphi = 4\pi ,$$
     *l'aire de la sphère unité*. Sur la sphère, $\sigma$ est la forme d'aire ; $f^{-3}\sigma$ mesure, pour un petit élément de surface, l'angle solide sous lequel on le voit depuis l'origine.

    On peut montrer (avec la formule de Stokes, hors du cours) que
    $$\int_{\mathbb{S}^{2}}f^{-3}\sigma = 4\pi \neq 0$$
     empêche $f^{-3}\sigma$, fermée, d'être exacte sur $\mathbb{R}^{3} \setminus \{0\}$ : c'est l'analogue en dimension $3$ de la forme $\omega$.

    **6.** On a
    $$f^{*}\left(\frac{\mathrm{d} t}{t}\right) = \frac{\mathrm{d} f}{f} = \frac{\alpha_{X}}{f^{2}}$$
     avec $X(p) = p$, et par l'exercice 4,
    $$\frac{\alpha_{X} \wedge \beta_{X}}{f^{2}} = \frac{f^{2}}{f^{2}}\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z = \mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z .$$
- id: "l3-gd-05-08"
