  source: "Bordeaux 2016, liste 5, exercice 9"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **Recoller des primitives.**

    **1.** Soit $U$ un ouvert connexe de $\mathbb{R}^{n}$ et $\alpha = \mathrm{d} g$ une $1$-forme exacte sur $U$. Déterminer les fonctions $h \in \mathcal{C}^{\infty}(U, \mathbb{R})$ telles que $\mathrm{d} h = \alpha$.

    **2.** Soient $U_{1}$ et $U_{2}$ deux ouverts étoilés de $\mathbb{R}^{n}$ dont l'intersection est connexe et non vide. Montrer que toute $1$-forme fermée sur $U_{1} \cup U_{2}$ est exacte.

    **3.** Si $n \geq 3$, prouver que toute $1$-forme fermée sur $\mathbb{R}^{n} \setminus \{0\}$ est exacte. On pourra considérer $U_{1} = \mathbb{R}^{n} \setminus \{te_{n} \mid t \leq 0\}$ et $U_{2} = \mathbb{R}^{n} \setminus \{te_{n} \mid t \geq 0\}$.

    **4.** Discuter le résultat précédent quand $n = 2$ (voir l'exercice 12). Qu'en est-il des $2$-formes fermées sur $\mathbb{R}^{3} \setminus \{0\}$ (voir l'exercice 7) ?
  corrige: |
    **1.** $\mathrm{d}(h - g) = 0$ sur $U$ connexe : *$h = g + C$*, par le théorème des accroissements finis appliqué le long de lignes brisées.

    **2.** Soit $\alpha$ fermée sur $U_{1} \cup U_{2}$. Par le lemme de Poincaré, $\alpha = \mathrm{d} g_{1}$ sur $U_{1}$ et $\alpha = \mathrm{d} g_{2}$ sur $U_{2}$. Sur $U_{1} \cap U_{2}$, connexe, $\mathrm{d}(g_{1} - g_{2}) = 0$, donc $g_{1} - g_{2} = C$. La fonction égale à $g_{1}$ sur $U_{1}$ et à $g_{2} + C$ sur $U_{2}$ est bien définie, de classe $\mathcal{C}^{\infty}$, et c'est une primitive de $\alpha$.

    **3.** $U_{1}$ est étoilé par rapport à $e_{n}$ : un segment $[e_{n}, x]$ ne rencontre la droite $\mathbb{R} e_{n}$ que si $x \in \mathbb{R} e_{n}$, et alors il reste dans $\{te_{n} \mid t > 0\}$ si $x \in U_{1}$. De même $U_{2}$ est étoilé par rapport à $-e_{n}$. Leur réunion est $\mathbb{R}^{n} \setminus \{0\}$, leur intersection $\mathbb{R}^{n} \setminus \mathbb{R} e_{n}$, qui est connexe pour $n \geq 3$ (le complémentaire d'une droite est connexe par arcs dès que $n \geq 3$ : on contourne la droite dans un plan qui ne la contient pas). La question 2 conclut.

    **4.** Pour $n = 2$, $\mathbb{R}^{2} \setminus \mathbb{R} e_{2}$ a deux composantes connexes, les demi-plans $x > 0$ et $x < 0$, et l'argument tombe : la forme $\omega$ est fermée et n'est pas exacte (exercice 12). Pour les $2$-formes sur $\mathbb{R}^{3} \setminus \{0\}$, la forme $f^{-3}\sigma$ de l'exercice 7 est fermée et non exacte : $\mathbb{R}^{3} \setminus \{0\}$ n'a pas de « trou » pour les lacets, mais en a un pour les sphères.
- id: "l3-gd-05-11"
