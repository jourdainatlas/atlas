  page_corrige: 6
  enonce: |
    **Intégrale le long d'un chemin.** Les chemins sont de classe $\mathcal{C}^{1}$ par morceaux. Soit $U$ un ouvert de $\mathbb{R}^{n}$ et $\alpha \in \Omega^{1}(U)$.

    **1.** Soit $\gamma : [a, b] \to U$ un chemin et $\varphi$ un $\mathcal{C}^{1}$-difféomorphisme de $[c, d]$ sur $[a, b]$. Montrer que $\mathop{\displaystyle \int_{\gamma \circ \varphi}}\alpha = \varepsilon\mathop{\displaystyle \int_{\gamma}}\alpha$, avec $\varepsilon = 1$ si $\varphi$ est croissante et $\varepsilon = -1$ sinon.

    **2.** Calculer $\mathop{\displaystyle \int_{\gamma}}(x\,\mathrm{d} y - y\,\mathrm{d} x)$ pour l'ellipse $\gamma(t) = (a\cos t, b\sin t)$, $t \in [0, 2\pi]$, et interpréter. La forme $x\,\mathrm{d} y - y\,\mathrm{d} x$ est-elle exacte sur $\mathbb{R}^{2}$ ?

    **3.** Soit $\beta = (2xy + z^{3})\,\mathrm{d} x + x^{2}\,\mathrm{d} y + 3xz^{2}\,\mathrm{d} z$ sur $\mathbb{R}^{3}$. En suivant la démonstration de la proposition 8 du cours, calculer $g(x, y, z) = \mathop{\displaystyle \int_{\gamma}}\beta$, où $\gamma$ est la ligne brisée qui joint $0$ à $(x, 0, 0)$, puis à $(x, y, 0)$, puis à $(x, y, z)$ parallèlement aux axes, et vérifier que $\mathrm{d} g = \beta$.
  corrige: |
    **1.** Sur chaque morceau, par changement de variable $t = \varphi(\tau)$ : 
    $$\int_{\gamma \circ \varphi}\alpha = \int_{c}^{d}\alpha_{\gamma(\varphi(\tau))}\big(\gamma'(\varphi(\tau))\big)\varphi'(\tau)\,\mathrm{d}\tau = \int_{\varphi(c)}^{\varphi(d)}\alpha_{\gamma(t)}(\gamma'(t))\,\mathrm{d} t = \varepsilon\int_{\gamma}\alpha ,$$
     puisque $(\varphi(c), \varphi(d)) = (a, b)$ si $\varphi$ croît et $(b, a)$ sinon.

    **2.** On a
    $$\int_{0}^{2\pi}(a\cos t\cdot b\cos t + b\sin t\cdot a\sin t)\,\mathrm{d} t = \boxed{2\pi ab} ,$$
     le double de l'aire de l'ellipse. Comme l'intégrale sur ce lacet n'est pas nulle, *la forme n'est pas exacte* (prop. 8) ; d'ailleurs $\mathrm{d}(x\,\mathrm{d} y - y\,\mathrm{d} x) = 2\,\mathrm{d} x \wedge \mathrm{d} y \neq 0$. Le lien entre l'aire et l'intégrale de $\dfrac{1}{2}(x\,\mathrm{d} y - y\,\mathrm{d} x)$ sur le bord est un cas particulier de la formule de Green-Riemann.

    **3.** La forme $\beta$ est fermée (on le vérifie comme à l'exercice 8). Sur le premier segment, $y = z = 0$ et $\beta$ se réduit à $0$ ; sur le second, $x$ est fixé et l'on intègre $x^{2}\,\mathrm{d} y$, d'où $x^{2}y$ ; sur le troisième, on intègre $3xz^{2}\,\mathrm{d} z$, d'où $xz^{3}$. Donc $\boxed{g = x^{2}y + xz^{3}}$, et $\mathrm{d} g = (2xy + z^{3})\,\mathrm{d} x + x^{2}\,\mathrm{d} y + 3xz^{2}\,\mathrm{d} z = \beta$.
