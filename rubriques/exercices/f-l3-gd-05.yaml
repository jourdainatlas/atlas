  page_enonce: 4
  page_corrige: 9
  enonce: |
    **Le théorème de d'Alembert-Gauss.** Soit $P(z) = z^{m} + a_{m - 1}z^{m - 1} + \dots + a_{0}$ un polynôme complexe de degré $m \geq 1$. On suppose que $P$ ne s'annule pas sur $\mathbb{C}$.

    **1.** Pour $r \geq 0$, on pose $\gamma_{r}(t) = P(r\mathrm{e}^{\mathrm{i} t})$, $t \in [0, 2\pi]$. Montrer que tous les lacets $\gamma_{r}$ ont le même indice, et que cet indice est nul.

    **2.** Montrer que, pour $r$ assez grand, $|\gamma_{r}(t) - r^{m}\mathrm{e}^{\mathrm{i} mt}| < r^{m}$ pour tout $t$, et en déduire, avec l'exercice 14, que l'indice de $\gamma_{r}$ vaut $m$.

    **3.** Conclure : tout polynôme complexe non constant a une racine.
  corrige: |
    **1.** La fonction $H(r, t) = P(r\mathrm{e}^{\mathrm{i} t})$ est continue sur $[0, R] \times [0, 2\pi]$ et ne s'annule pas ; pour $r_{1} < r_{2}$, $(s, t) \mapsto H(r_{1} + s(r_{2} - r_{1}), t)$ est une homotopie de lacets de $\gamma_{r_{1}}$ à $\gamma_{r_{2}}$ dans $\mathbb{R}^{2} \setminus \{0\}$ : tous ont le même indice (th. 5), égal à celui du lacet constant $\gamma_{0} = P(0)$, *c'est-à-dire $0$*.

    **2.** Pour $|z| = r \geq 1$,
    $$|P(z) - z^{m}| \leq \sum_{k < m}|a_{k}|r^{k} \leq r^{m - 1}\sum_{k < m}|a_{k}| < r^{m}$$
     dès que
    $$r > \max(1, \sum|a_{k}|) .$$
     Par l'exercice 14, $\gamma_{r}$ a l'indice de $t \mapsto r^{m}\mathrm{e}^{\mathrm{i} mt}$, qui est $m$ (exercice 13).

    **3.** $0 = m \geq 1$ : contradiction. *Tout polynôme complexe non constant a une racine.* Dans la preuve, la contradiction se lit ainsi : quand $r$ croît de $0$ à $+\infty$, le lacet $\gamma_{r}$ passe d'un indice $0$ à un indice $m$ ; il doit donc passer par $0$ pour une certaine valeur de $r$, et l'on obtient une racine de module $r$.

    ![Figure](documents/figures/e9cfa0681ba92af8.svg)

    Les lacets $\gamma_{r} = P(r\mathrm{e}^{\mathrm{i} t})$ pour $P(z) = z^{3} + z + 1$ (le troisième réduit de moitié). Entre $r = 0{,}5$ et $r = 1$, l'indice passe de $0$ à $1$ : le lacet a franchi l'origine, et $P$ a une racine de module compris entre $0{,}5$ et $1$ (la racine réelle $\approx -0{,}682$). Entre $1$ et $1{,}5$, il gagne deux tours : deux autres racines, de module $\approx 1{,}211$.
