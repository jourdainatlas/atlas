  enonce: |
    **Gradient, rotationnel, divergence.** Sur un ouvert $U$ de $\mathbb{R}^{3}$, on associe au champ de vecteurs $X = (P, Q, R)$ la $1$-forme $\alpha_{X} = P\,\mathrm{d} x + Q\,\mathrm{d} y + R\,\mathrm{d} z$ et la $2$-forme $\beta_{X} = P\,\mathrm{d} y \wedge \mathrm{d} z + Q\,\mathrm{d} z \wedge \mathrm{d} x + R\,\mathrm{d} x \wedge \mathrm{d} y$.

    **1.** Montrer que $\mathrm{d} g = \alpha_{\nabla g}$, $\mathrm{d}\alpha_{X} = \beta_{\operatorname{rot}X}$ et $\mathrm{d}\beta_{X} = (\operatorname{div}X)\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$. En déduire, à l'aide de $\mathrm{d} \circ \mathrm{d} = 0$, les identités $\operatorname{rot}(\nabla g) = 0$ et $\operatorname{div}(\operatorname{rot}X) = 0$.

    **2.** Calculer $\alpha_{X} \wedge \alpha_{Y}$ et $\alpha_{X} \wedge \beta_{Y}$ en fonction du produit vectoriel et du produit scalaire de $X$ et $Y$.

    **3.** Application : pour $\alpha = y\,\mathrm{d} x - x\,\mathrm{d} y + z^{2}\,\mathrm{d} z$ et $\beta = xz\,\mathrm{d} y \wedge \mathrm{d} z$, calculer $\mathrm{d}\alpha$, $\mathrm{d}\beta$, $\alpha \wedge \beta$ et $\mathrm{d}(\alpha \wedge \beta)$, et vérifier la formule de Leibniz du théorème 2.
  corrige: |
    **1.** Par la proposition 5, $\mathrm{d} g = g_{x}\mathrm{d} x + g_{y}\mathrm{d} y + g_{z}\mathrm{d} z = \alpha_{\nabla g}$, puis 
    $$\mathrm{d}\alpha_{X} = (R_{y} - Q_{z})\,\mathrm{d} y \wedge \mathrm{d} z + (P_{z} - R_{x})\,\mathrm{d} z \wedge \mathrm{d} x + (Q_{x} - P_{y})\,\mathrm{d} x \wedge \mathrm{d} y = \beta_{\operatorname{rot}X} ,$$
     et $\mathrm{d}\beta_{X} = (P_{x} + Q_{y} + R_{z})\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$. Alors $0 = \mathrm{d}\mathrm{d} g = \beta_{\operatorname{rot}\nabla g}$ et
    $$0 = \mathrm{d}\mathrm{d}\alpha_{X} = (\operatorname{div}\operatorname{rot}X)\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z :$$
     *$\operatorname{rot}\nabla = 0$ et $\operatorname{div}\operatorname{rot} = 0$* ne sont que $\mathrm{d} \circ \mathrm{d} = 0$.

    **2.** En développant, $\boxed{\alpha_{X} \wedge \alpha_{Y} = \beta_{X \wedge Y}}$ : par exemple, le coefficient de $\mathrm{d} y \wedge \mathrm{d} z$ est $Q_{X}R_{Y} - R_{X}Q_{Y}$, première composante de $X \wedge Y$. Et
    $$\boxed{\alpha_{X} \wedge \beta_{Y} = \langle X, Y \rangle\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z} ,$$
     puisque $\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$ n'apparaît qu'à partir de $\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$, $\mathrm{d} y \wedge \mathrm{d} z \wedge \mathrm{d} x$ et $\mathrm{d} z \wedge \mathrm{d} x \wedge \mathrm{d} y$, tous égaux.

    **3.** On a
    $$\mathrm{d}\alpha = \mathrm{d} y \wedge \mathrm{d} x - \mathrm{d} x \wedge \mathrm{d} y = -2\,\mathrm{d} x \wedge \mathrm{d} y ,$$

    $$\mathrm{d}\beta = \mathrm{d}(xz) \wedge \mathrm{d} y \wedge \mathrm{d} z = z\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z ,$$
     $\alpha \wedge \beta = xyz\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} z$ et $\mathrm{d}(\alpha \wedge \beta) = 0$, comme toute $4$-forme de $\mathbb{R}^{3}$. Leibniz :
    $$\mathrm{d}\alpha \wedge \beta - \alpha \wedge \mathrm{d}\beta = -2xz\,\mathrm{d} x \wedge \mathrm{d} y \wedge \mathrm{d} y \wedge \mathrm{d} z - 0 = 0 .$$
     *Les deux membres sont nuls.*
