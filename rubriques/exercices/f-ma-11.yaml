  page_enonce: 8
  page_corrige: 12
  enonce: |
    *Noyau, image et nombre d'éléments.* Soit $f : G \to G'$ un morphisme de groupes, $G$ étant fini.

    **1.** À l'aide du théorème 2 du cours et du lemme des bergers, montrer que 
    $$\mathrm{card}(G) = \mathrm{card}(\mathrm{Ker}\, f) \times \mathrm{card}(\operatorname{Im} f).$$

    **2.** Soit $n \in \mathbb{N}^{*}$. Déterminer l'image du morphisme $z \mapsto z^{2}$ de $\mathbb{U}_{n}$ dans lui-même, en distinguant selon la parité de $n$.

    **3.** Soit $G$ un groupe abélien fini ayant un nombre impair d'éléments. À l'aide de l'exercice 31, montrer que $x \mapsto x^{2}$ est un automorphisme de $G$, et en déduire que tout élément de $G$ est un carré.
  corrige: |
    **1.** D'après le point (i) du théorème 2, la fibre de $f$ au-dessus d'un élément $f(x)$ de l'image est $xK$, où $K = \mathrm{Ker}\, f$, et elle a $\mathrm{card}(K)$ éléments (exercice 31, question 2). On applique le lemme des bergers à $f : G \to \operatorname{Im} f$. 
    $$\boxed{\mathrm{card}(G) = \mathrm{card}(\mathrm{Ker}\, f) \times \mathrm{card}(\operatorname{Im} f)}$$

    **2.** Le noyau de $z \mapsto z^{2}$ sur $\mathbb{U}_{n}$ est $\mathbb{U}_{n} \cap \{-1, 1\}$. Si $n$ est impair, il est réduit à $\{1\}$, et l'image a $n$ éléments : c'est $\mathbb{U}_{n}$. Si $n$ est pair, $-1 \in \mathbb{U}_{n}$, et l'image a $\frac{n}{2}$ éléments ; elle est contenue dans $\mathbb{U}_{n/2}$, puisque $(z^{2})^{n/2} = 1$, et a le même nombre d'éléments, donc lui est égale. 
    $$\boxed{\text{image } \mathbb{U}_{n} \text{ si } n \text{ est impair}, \qquad \mathbb{U}_{n/2} \text{ si } n \text{ est pair}}$$

    **3.** Comme $G$ est abélien, $x \mapsto x^{2}$ est un endomorphisme (exercice 23). Si $x^{2} = e$ et $x \neq e$, alors $x$ est d'ordre $2$, et $2$ divise $\mathrm{card}(G)$ (exercice 31), ce qui est exclu. Le noyau est donc $\{e\}$, le morphisme est injectif, donc bijectif puisque $G$ est fini (chapitre 2, théorème 2). 
    $$\boxed{\text{dans un groupe abélien fini de cardinal impair, tout élément est un carré}}$$
- id: "ma-11-33"
  feuille: "f-ma-11"
  numero: 33
  partie: "Groupes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [groupes, sous-groupes, groupe symétrique, théorème de Lagrange]
  noeuds: [a-groupe, a-sous-groupe, v-det, gs-lagrange]
  notions: [groupe, sous-groupe, groupe-symetrique]
  page_enonce: 8
  page_corrige: 13
  enonce: |
    *Les sous-groupes de $\mathfrak{S}_{3}$.* On note $t_{1}$, $t_{2}$, $t_{3}$ les trois permutations de $\{1, 2, 3\}$ qui échangent deux éléments et fixent le troisième, $t_{k}$ fixant $k$, et $c$ la permutation $1 \mapsto 2$, $2 \mapsto 3$, $3 \mapsto 1$.

    **1.** Vérifier que $\mathfrak{S}_{3} = \{\mathrm{id}, c, c^{2}, t_{1}, t_{2}, t_{3}\}$, et dresser la table de la composition.

    **2.** À l'aide du théorème de Lagrange de l'exercice 31, déterminer tous les sous-groupes de $\mathfrak{S}_{3}$.

    **3.** Représenter le schéma des inclusions entre ces sous-groupes, à la manière de celui des $\mathbb{U}_{d}$ dans le cours, en indiquant dans chaque nœud le nombre d'éléments du sous-groupe.
  corrige: |
    **1.** Les six permutations sont distinctes : $\mathrm{id}$ fixe tout, $c$ et $c^{2}$ ne fixent rien, et $t_{k}$ fixe exactement $k$. Comme $\mathfrak{S}_{3}$ a six éléments (on peut les énumérer en choisissant l'image de $1$, puis celle de $2$), ce sont toutes. On calcule chaque composée $f \circ g$, ligne $f$ et colonne $g$, en suivant les images de $1$, $2$, $3$ :

    $$\begin{array}{|c||c|c|c|c|c|c|} \hline \circ & \mathrm{id} & c & c^{2} & t_{1} & t_{2} & t_{3} \\ \hline \hline \mathrm{id} & \mathrm{id} & c & c^{2} & t_{1} & t_{2} & t_{3} \\ \hline c & c & c^{2} & \mathrm{id} & t_{3} & t_{1} & t_{2} \\ \hline c^{2} & c^{2} & \mathrm{id} & c & t_{2} & t_{3} & t_{1} \\ \hline t_{1} & t_{1} & t_{2} & t_{3} & \mathrm{id} & c & c^{2} \\ \hline t_{2} & t_{2} & t_{3} & t_{1} & c^{2} & \mathrm{id} & c \\ \hline t_{3} & t_{3} & t_{1} & t_{2} & c & c^{2} & \mathrm{id} \\ \hline \end{array}$$

    Par exemple, $(c \circ t_{1})(1) = c(1) = 2$, $(c \circ t_{1})(2) = c(3) = 1$ et $(c \circ t_{1})(3) = c(2) = 3$ : $c \circ t_{1} = t_{3}$. La table n'est pas symétrique : $t_{1} \circ c = t_{2} \neq t_{3}$.

    **2.** Un sous-groupe a $1$, $2$, $3$ ou $6$ éléments, par le théorème de Lagrange. Ceux à $1$ et $6$ éléments sont $\{\mathrm{id}\}$ et $\mathfrak{S}_{3}$. Un sous-groupe à $2$ éléments est $\{\mathrm{id}, x\}$ avec $x^{2} = \mathrm{id}$ : ce sont les trois $\{\mathrm{id}, t_{k}\}$. Un sous-groupe à $3$ éléments a $3$ pour cardinal premier, donc il est formé des puissances d'un élément d'ordre $3$ (exercice 31) : c'est $\{\mathrm{id}, c, c^{2}\}$. 
    $$\boxed{\{\mathrm{id}\}, \ \{\mathrm{id}, t_{1}\}, \ \{\mathrm{id}, t_{2}\}, \ \{\mathrm{id}, t_{3}\}, \ \{\mathrm{id}, c, c^{2}\}, \ \mathfrak{S}_{3} : \text{six sous-groupes}}$$

    **3.** Aucun sous-groupe à $2$ éléments n'est contenu dans celui à $3$ éléments, puisque $2$ ne divise pas $3$.

    ![Figure](documents/figures/4f13b1b6ce81f783.svg)

    Le schéma se lit comme celui des $\mathbb{U}_{d}$ du cours : chaque trait monte d'un sous-groupe à un sous-groupe qui le contient. Contrairement au cas de $\mathbb{U}_{12}$, il y a plusieurs sous-groupes ayant le même nombre d'éléments.
- id: "ma-11-34"
  feuille: "f-ma-11"
  numero: 34
  partie: "Anneaux et corps"
  etoiles: 1
  types: [Calcul]
  mots_cles: [anneaux et corps, anneaux, sous-anneaux]
  noeuds: [a-anneau, a-morph-anneau]
  notions: [anneau, sous-anneau]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Dans chaque cas, dire si $B$ est un sous-anneau de l'anneau $A$, muni des opérations usuelles.

    **(a)** $A = \mathbb{Z}$ et $B = \mathbb{N}$, puis $B = 2\mathbb{Z}$.

    **(b)** $A = \mathbb{R}^{\mathbb{N}}$, anneau des suites réelles muni des opérations terme à terme, et $B$ est l'ensemble des suites convergentes, puis celui des suites de limite nulle, puis celui des suites bornées.

    **(c)** $A = \mathcal{F}(\mathbb{R}, \mathbb{R})$ et $B$ est l'ensemble des fonctions paires, puis celui des fonctions impaires, puis celui des fonctions continues.

    **(d)** $A = \mathbb{R}$ et $B = \mathbb{Z}[\sqrt{2}] = \{a + b\sqrt{2} \mid (a, b) \in \mathbb{Z}^{2}\}$, puis $B = \{a + b\sqrt[3]{2} \mid (a, b) \in \mathbb{Z}^{2}\}$.
  corrige: |
    On vérifie à chaque fois les trois conditions de la définition : $1 \in B$, stabilité par différence et par produit.

    **(a)** $\mathbb{N}$ n'est pas un sous-anneau de $\mathbb{Z}$, puisque $0 - 1 \notin \mathbb{N}$, et $2\mathbb{Z}$ non plus, puisque $1 \notin 2\mathbb{Z}$.

    **(b)** Les suites convergentes forment un sous-anneau : la suite constante égale à $1$ converge, et la différence et le produit de deux suites convergentes convergent (chapitre 7). Les suites de limite nulle n'en forment pas un, puisque la suite constante $1$ n'en fait pas partie. Les suites bornées en forment un : si $|u_{n}| \leqslant M$ et $|v_{n}| \leqslant M'$, alors $|u_{n} - v_{n}| \leqslant M + M'$ et $|u_{n}v_{n}| \leqslant MM'$.

    **(c)** Les fonctions paires forment un sous-anneau ; les fonctions impaires non, puisque la fonction constante $1$ n'est pas impaire, et que le produit de deux fonctions impaires est pair. Les fonctions continues en forment un (chapitre 8).

    **(d)** $\mathbb{Z}[\sqrt{2}]$ contient $1$, est stable par différence, et 
    $$(a + b\sqrt{2})(c + d\sqrt{2}) = (ac + 2bd) + (ad + bc)\sqrt{2} \in \mathbb{Z}[\sqrt{2}].$$
     En revanche, $B' = \{a + b\sqrt[3]{2}\}$ ne contient pas $\sqrt[3]{4} = (\sqrt[3]{2})^{2}$. Sinon, $\sqrt[3]{4} = a + b\sqrt[3]{2}$ ; en multipliant par $\sqrt[3]{2}$, 
    $$2 = a\sqrt[3]{2} + b\sqrt[3]{4} = ab + (a + b^{2})\sqrt[3]{2}.$$
     Comme $\sqrt[3]{2}$ est irrationnel, par le raisonnement du chapitre 7 pour $\sqrt{2}$, on obtient $a + b^{2} = 0$ et $ab = 2$, d'où $-b^{3} = 2$, ce qui est impossible dans $\mathbb{Z}$. 
    $$\boxed{\text{sous-anneaux : suites convergentes, bornées ; fonctions paires, continues ; } \mathbb{Z}[\sqrt{2}]}$$
- id: "ma-11-35"
  feuille: "f-ma-11"
  numero: 35
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux et corps, éléments inversibles, anneaux, corps, sous-anneaux]
  noeuds: [a-anneau, a-monoide, a-corps, a-morph-anneau]
  notions: [anneau, inversible, corps, sous-anneau]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    *Les rationnels à dénominateur impair.* On note $A$ l'ensemble des rationnels qui peuvent s'écrire $\dfrac{m}{n}$, avec $m \in \mathbb{Z}$ et $n$ entier naturel impair.

    **1.** Montrer que $A$ est un sous-anneau de $\mathbb{Q}$.

    **2.** Soit $x \in A$, écrit $x = \dfrac{m}{n}$ avec $n$ impair. Montrer que la parité de $m$ ne dépend pas de l'écriture choisie.

    **3.** Montrer que $x$ est inversible dans $A$ si et seulement si $m$ est impair. L'anneau $A$ est-il un corps ?
  corrige: |
    **1.** On a $1 = \frac{1}{1} \in A$. Si $x = \frac{m}{n}$ et $y = \frac{m'}{n'}$ avec $n$ et $n'$ impairs, 
    $$x - y = \frac{mn' - m'n}{nn'}, \qquad xy = \frac{mm'}{nn'},$$
     et $nn'$ est impair. $\boxed{A \text{ est un sous-anneau de } \mathbb{Q}}$

    **2.** Si $\frac{m}{n} = \frac{m'}{n'}$ avec $n$ et $n'$ impairs, alors $mn' = m'n$. Le produit $mn'$ a la parité de $m$, puisque $n'$ est impair, et $m'n$ celle de $m'$ : $m$ et $m'$ ont même parité.

    **3.** Si $m$ est impair, $x^{-1} = \frac{n}{m} = \frac{-n}{-m}$ a un dénominateur impair, positif dans l'une des deux écritures : $x$ est inversible dans $A$. Si $m$ est pair et $xy = 1$ avec $y = \frac{p}{q}$, $q$ impair, alors $mp = nq$, où le membre de gauche est pair et celui de droite impair : c'est impossible. 
    $$\boxed{A^{\times} = \Big\{\frac{m}{n} \;\Big|\; m \text{ et } n \text{ impairs}\Big\} ; \quad A \text{ n'est pas un corps, } 2 \text{ n'y est pas inversible}}$$
     La question 2 est indispensable : sans elle, la condition « $m$ impair » pourrait dépendre de l'écriture choisie.
