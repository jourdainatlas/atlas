  notions: [loi-composition, element-neutre, inversible]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *Une table trompeuse.* On munit l'ensemble $E = \{e, a, b, c, d, f\}$ de la loi $\star$ définie par la table suivante, où la case de la ligne $x$ et de la colonne $y$ contient $x \star y$.

    $$\begin{array}{|c||c|c|c|c|c|c|} \hline \star & e & a & b & c & d & f \\ \hline \hline e & e & a & b & c & d & f \\ \hline a & a & e & c & b & f & d \\ \hline b & b & c & d & f & e & a \\ \hline c & c & b & f & d & a & e \\ \hline d & d & f & e & a & c & b \\ \hline f & f & d & a & e & b & c \\ \hline \end{array}$$

    **1.** Vérifier que la loi est commutative, que $e$ est neutre, et que chaque élément apparaît exactement une fois dans chaque ligne et dans chaque colonne. En déduire que tout élément admet un unique symétrique, que l'on précisera.

    **2.** Calculer $(b \star b) \star d$ et $b \star (b \star d)$. L'ensemble $(E, \star)$ est-il un groupe ?

    **3.** Qu'en conclure sur la réciproque de la remarque du cours qui suit la proposition 3 ?
  corrige: |
    **1.** La table est symétrique par rapport à sa diagonale, donc la loi est commutative ; la ligne et la colonne de $e$ reproduisent les en-têtes, donc $e$ est neutre. Chaque ligne et chaque colonne contient les six éléments. En particulier, $e$ apparaît une fois dans chaque ligne : chaque élément $x$ a un unique $y$ tel que $x \star y = e$, et $y \star x = e$ par commutativité. 
    $$\boxed{a^{-1} = a, \qquad b^{-1} = d, \qquad c^{-1} = f}$$

    **2.** On lit sur la table $b \star b = d$ et $b \star d = e$, d'où 
    $$(b \star b) \star d = d \star d = c \qquad\text{et}\qquad b \star (b \star d) = b \star e = b.$$

    $$\boxed{(b \star b) \star d \neq b \star (b \star d) : \text{la loi n'est pas associative, } (E, \star) \text{ n'est pas un groupe}}$$

    **3.** La remarque du cours dit que la table d'un groupe fini a la propriété de la question 1. Cet exemple montre que la réciproque est fausse : une table où chaque élément apparaît une fois par ligne et par colonne, avec un neutre, peut ne pas être associative. *À retenir :* l'associativité ne se lit pas sur l'aspect de la table, elle se vérifie, ou s'hérite d'un groupe connu (méthode de la section 11.3).
- id: "ma-11-06"
  feuille: "f-ma-11"
  numero: 6
  partie: "Lois de composition interne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois de composition interne, lois de composition, parties stables]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, partie-stable]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $\star$ une loi de composition interne sur un ensemble $E$, et 
    $$A = \{x \in E \mid \forall (y, z) \in E^{2}, \ x \star (y \star z) = (x \star y) \star z\}.$$
     Montrer que $A$ est stable par $\star$, et que la loi induite sur $A$ est associative. Que vaut $A$ lorsque $\star$ est la soustraction sur $\mathbb{Z}$ ?
  corrige: |
    Soit $a$ et $b$ dans $A$, et $y$, $z$ dans $E$. On utilise trois fois la définition de $A$, pour $a$ puis pour $b$ : 
    $$(a \star b) \star (y \star z) = a \star \big(b \star (y \star z)\big) = a \star \big((b \star y) \star z\big) = \big(a \star (b \star y)\big) \star z = \big((a \star b) \star y\big) \star z.$$
     La première et la troisième égalité utilisent $a \in A$, la deuxième $b \in A$, la dernière à nouveau $a \in A$. Ainsi $a \star b \in A$. 
    $$\boxed{A \text{ est stable par } \star}$$
     La loi induite est associative, puisque l'égalité qui définit $A$ vaut en particulier pour $y$ et $z$ dans $A$. Pour la soustraction sur $\mathbb{Z}$, $x - (y - z) = (x - y) - z$ équivaut à $z = -z$, ce qui est faux pour $z = 1$, quel que soit $x$. 
    $$\boxed{\text{pour la soustraction sur } \mathbb{Z}, \ A = \varnothing}$$
- id: "ma-11-07"
  feuille: "f-ma-11"
  numero: 7
  partie: "Lois de composition interne"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [lois de composition interne, lois de composition, élément neutre]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, element-neutre]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *L'argument d'Eckmann et Hilton.* Soit $X$ un ensemble muni de deux lois de composition interne $\ast$ et $\otimes$, admettant chacune un élément neutre, notés $1_{\ast}$ et $1_{\otimes}$, et telles que 
    $$\forall (a, b, c, d) \in X^{4}, \qquad (a \otimes b) \ast (c \otimes d) = (a \ast c) \otimes (b \ast d).$$

    **1.** En choisissant bien $a$, $b$, $c$, $d$, montrer que $1_{\ast} = 1_{\otimes}$.

    **2.** Montrer que les deux lois sont égales, puis qu'elles sont commutatives et associatives.

    **3.** Vérifier que l'addition des réels, prise comme loi $\ast$ et comme loi $\otimes$, satisfait l'hypothèse. Peut-on prendre pour $\ast$ et $\otimes$ l'addition et la multiplication des réels ?
  corrige: |
    On note $u = 1_{\ast}$ et $v = 1_{\otimes}$.

    **1.** Avec $a = v$, $b = u$, $c = u$, $d = v$, l'hypothèse donne $(v \otimes u) \ast (u \otimes v) = (v \ast u) \otimes (u \ast v)$. Le membre de gauche vaut $u \ast u = u$, puisque $v$ est neutre pour $\otimes$ ; celui de droite vaut $v \otimes v = v$, puisque $u$ est neutre pour $\ast$. 
    $$\boxed{1_{\ast} = 1_{\otimes}}$$

    **2.** On note $1$ ce neutre commun. Avec $b = c = 1$, l'hypothèse donne $(a \otimes 1) \ast (1 \otimes d) = (a \ast 1) \otimes (1 \ast d)$, soit $a \ast d = a \otimes d$ : les deux lois sont égales. Avec $a = d = 1$, elle donne $b \ast c = (1 \ast c) \otimes (b \ast 1) = c \otimes b = c \ast b$ : la loi est commutative. Avec $b = 1$, elle donne $a \ast (c \ast d) = (a \ast c) \ast d$, en utilisant l'égalité des lois : la loi est associative. 
    $$\boxed{\ast = \otimes, \text{ loi commutative et associative}}$$

    **3.** Pour l'addition, l'hypothèse s'écrit $(a + b) + (c + d) = (a + c) + (b + d)$, qui est vraie. Avec l'addition pour $\ast$ et la multiplication pour $\otimes$, la question 1 imposerait $0 = 1$ : l'hypothèse est fausse, et en effet $(1 \times 1) + (1 \times 1) = 2 \neq 4 = (1 + 1) \times (1 + 1)$.

    *À retenir.* L'argument d'Eckmann et Hilton (1962) sert en topologie, pour montrer que certains groupes construits à partir de lacets sont abéliens : deux structures compatibles au sens de l'hypothèse sont forcément identiques et commutatives.
- id: "ma-11-08"
  feuille: "f-ma-11"
  numero: 8
  partie: "Groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [groupes, lois de composition, groupes abéliens]
  noeuds: [a-groupe, a-loi]
  notions: [groupe, loi-composition, groupe-abelien]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Les ensembles suivants, munis de la loi indiquée, sont-ils des groupes ? Le cas échéant, sont-ils abéliens ?

    **(a)** $\mathbb{Z}$, avec $a \star b = a + b + 1$ ;

    **(b)** $\mathbb{Q}^{*}$, avec la division ;

    **(c)** $\mathcal{F}(\mathbb{R}, \mathbb{R})$, avec l'addition ;

    **(d)** les fonctions monotones de $\mathbb{R}$ dans $\mathbb{R}$, avec l'addition ;

    **(e)** $\mathbb{U} \cup \{0\}$, avec la multiplication ;

    **(f)** $\{-1, 1\}$, avec la multiplication ;

    **(g)** $2\mathbb{Z}$, avec la multiplication ;

    **(h)** $\mathcal{P}(E)$, avec la réunion.
  corrige: |
    **(a)** Oui. La bijection $a \mapsto a + 1$ vérifie $(a \star b) + 1 = (a + 1) + (b + 1)$ : elle transporte $\star$ sur l'addition. Le neutre est $-1$, et le symétrique de $a$ est $-a - 2$. Le groupe est abélien.

    **(b)** Non : $(8 \div 4) \div 2 = 1$, alors que $8 \div (4 \div 2) = 4$. La division n'est pas associative.

    **(c)** Oui, groupe abélien de neutre la fonction nulle : chaque propriété se vérifie point par point.

    **(d)** Non : $x \mapsto x^{3}$ et $x \mapsto -x$ sont monotones, mais leur somme $x \mapsto x^{3} - x$ ne l'est pas, puisqu'elle s'annule en $-1$, $0$ et $1$. L'ensemble n'est pas stable.

    **(e)** Non : $0$ n'est pas inversible.

    **(f)** Oui, groupe abélien : c'est $\mathbb{U}_{2}$.

    **(g)** Non : $1 \notin 2\mathbb{Z}$, et il n'y a pas de neutre, puisque $2e = 2$ impose $e = 1$.

    **(h)** Non, si $E \neq \varnothing$ : le neutre est $\varnothing$, et $E \cup B = \varnothing$ est impossible. 
    $$\boxed{\text{groupes : (a), (c), (f), tous abéliens}}$$
- id: "ma-11-09"
  feuille: "f-ma-11"
  numero: 9
  partie: "Groupes"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [groupes, lois de composition, élément neutre, éléments inversibles, groupes abéliens]
  noeuds: [a-groupe, a-loi, a-monoide]
  notions: [groupe, loi-composition, element-neutre, inversible, groupe-abelien]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    Sur $G = \mathbb{R} \setminus \{1\}$, on pose $x \star y = x + y - xy$.

    **1.** Calculer $1 - x \star y$ en fonction de $1 - x$ et $1 - y$. En déduire que $\star$ est une loi de composition interne sur $G$.

    **2.** Montrer que $\varphi : x \mapsto 1 - x$ est une bijection de $G$ sur $\mathbb{R}^{*}$ qui vérifie $\varphi(x \star y) = \varphi(x)\varphi(y)$.

    **3.** En déduire, sans autre calcul, que $(G, \star)$ est un groupe abélien, et déterminer son neutre et le symétrique de $x$.
  corrige: |
    **1.** On développe : 
    $$(1 - x)(1 - y) = 1 - x - y + xy = 1 - x \star y. \qquad \boxed{1 - x \star y = (1 - x)(1 - y)}$$
     Si $x \neq 1$ et $y \neq 1$, le produit est non nul, donc $x \star y \neq 1$ : la loi est interne sur $G$.

    **2.** L'application $\varphi$ est bijective de $G$ sur $\mathbb{R}^{*}$, de réciproque $t \mapsto 1 - t$, et la question 1 s'écrit $\varphi(x \star y) = \varphi(x)\varphi(y)$.

    **3.** Par la question 1 de l'exercice 11, la loi transportée de $(\mathbb{R}^{*}, \times)$ par $\varphi^{-1}$ est un groupe abélien, et c'est $\star$. Le neutre est $\varphi^{-1}(1) = 0$, et le symétrique de $x$ est $\varphi^{-1}\big(\frac{1}{1 - x}\big) = 1 - \frac{1}{1 - x} = \frac{x}{x - 1}$. 
    $$\boxed{\text{neutre } 0, \qquad x^{-1} = \frac{x}{x - 1}}$$
     Vérification : $x \star \frac{x}{x - 1} = x + \frac{x}{x - 1} - \frac{x^{2}}{x - 1} = x + \frac{x(1 - x)}{x - 1} = 0$. ✓
- id: "ma-11-10"
  feuille: "f-ma-11"
  numero: 10
  partie: "Groupes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [groupes, lois de composition, élément neutre, éléments inversibles, sous-groupes, groupe symétrique, isomorphismes, groupes abéliens]
  noeuds: [a-groupe, a-loi, a-monoide, a-sous-groupe, v-det, a-morphisme]
  notions: [groupe, loi-composition, element-neutre, inversible, sous-groupe, groupe-symetrique, isomorphisme, groupe-abelien]
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *Le groupe affine.* Sur $G = \mathbb{R}^{*} \times \mathbb{R}$, on définit la loi 
    $$(x, y) \star (x', y') = (xx', \, xy' + y).$$

    **1.** Pour $(x, y) \in G$, on note $f_{x,y}$ l'application $t \mapsto xt + y$ de $\mathbb{R}$ dans $\mathbb{R}$. Vérifier que 
    $$f_{x,y} \circ f_{x',y'} = f_{(x,y) \star (x',y')}.$$

    **2.** En déduire que $(G, \star)$ est un groupe, isomorphe au sous-groupe de $\mathfrak{S}_{\mathbb{R}}$ formé des bijections affines. Préciser le neutre et le symétrique de $(x, y)$. Ce groupe est-il abélien ?

    **3.** Pour $n \in \mathbb{N}^{*}$, calculer $(x, y)^{n}$, en distinguant les cas $x = 1$ et $x \neq 1$.
  corrige: |
    **1.** Pour tout réel $t$, 
    $$f_{x,y}\big(f_{x',y'}(t)\big) = x(x't + y') + y = xx'\,t + (xy' + y). \qquad \boxed{f_{x,y} \circ f_{x',y'} = f_{(x,y) \star (x',y')}}$$

    **2.** L'application $F : (x, y) \mapsto f_{x,y}$ est une bijection de $G$ sur l'ensemble $\mathcal{A}$ des bijections affines, puisqu'une fonction affine détermine ses coefficients. D'après la question 1, $\mathcal{A}$ est stable par composition ; il contient $\mathrm{id}_{\mathbb{R}} = f_{1,0}$, et la réciproque de $f_{x,y}$ est $f_{1/x, -y/x}$. C'est donc un sous-groupe de $\mathfrak{S}_{\mathbb{R}}$ (proposition 7). La loi $\star$ est la loi transportée par $F^{-1}$ (exercice 11), donc $(G, \star)$ est un groupe isomorphe à $\mathcal{A}$. 
    $$\boxed{\text{neutre } (1, 0), \qquad (x, y)^{-1} = \Big(\frac{1}{x}, -\frac{y}{x}\Big)}$$
     Le groupe n'est pas abélien : $(2, 0) \star (1, 1) = (2, 2)$ et $(1, 1) \star (2, 0) = (2, 1)$.

    **3.** Par récurrence, $(x, y)^{n} = \big(x^{n}, y(1 + x + \cdots + x^{n-1})\big)$, puisque $(x, y)^{n+1} = (x, y) \star (x, y)^{n}$ ajoute $x \cdot y(1 + \cdots + x^{n-1})$ à $y$. La somme géométrique donne 
    $$\boxed{(x, y)^{n} = \Big(x^{n}, \ y\,\frac{x^{n} - 1}{x - 1}\Big) \text{ si } x \neq 1, \qquad (1, y)^{n} = (1, ny)}$$
     C'est la $n$-ième itérée de $t \mapsto xt + y$, que le chapitre 7 a rencontrée avec les suites arithmético-géométriques.
- id: "ma-11-11"
  feuille: "f-ma-11"
  numero: 11
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, lois de composition, morphismes, isomorphismes, groupes abéliens]
  noeuds: [a-groupe, a-loi, a-morphisme]
  notions: [groupe, loi-composition, morphisme-groupes, isomorphisme, groupe-abelien]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *Transport de structure.*

    **1.** Soit $(G, \ast)$ un groupe, $E$ un ensemble et $f : G \to E$ une bijection. Montrer que la loi définie par $x \star y = f\big(f^{-1}(x) \ast f^{-1}(y)\big)$ fait de $E$ un groupe, et que $f$ est un isomorphisme de $(G, \ast)$ sur $(E, \star)$.

    **2.** Montrer que, pour tous réels $a$ et $b$, 
    $$\operatorname{th}(a + b) = \frac{\operatorname{th} a + \operatorname{th} b}{1 + \operatorname{th} a \, \operatorname{th} b}.$$

    **3.** En déduire que la loi $x \star y = \dfrac{x + y}{1 + xy}$ fait de $]-1\,,1[$ un groupe abélien isomorphe à $(\mathbb{R}, +)$.

    En relativité restreinte, c'est la loi de composition des vitesses, exprimées en fraction de la vitesse de la lumière : la composée de deux vitesses inférieures à celle de la lumière lui reste inférieure.
  corrige: |
    **1.** Par construction, $f(a \ast b) = f(a) \star f(b)$ pour tous $a$, $b$ de $G$. On vérifie les axiomes en se ramenant à $G$ : pour $x$, $y$, $z$ dans $E$, avec $a = f^{-1}(x)$, $b = f^{-1}(y)$, $c = f^{-1}(z)$, 
    $$(x \star y) \star z = f\big((a \ast b) \ast c\big) = f\big(a \ast (b \ast c)\big) = x \star (y \star z).$$
     De même, $f(e)$ est neutre, et l'inverse de $x$ est $f(a^{-1})$. Ainsi $(E, \star)$ est un groupe, et $f$, bijectif et compatible avec les lois, est un isomorphisme.

    **2.** On écrit $\operatorname{th} = \frac{\operatorname{sh}}{\operatorname{ch}}$ et l'on utilise les formules d'addition du chapitre 5 : 
    $$\operatorname{th}(a + b) = \frac{\operatorname{sh} a \operatorname{ch} b + \operatorname{ch} a \operatorname{sh} b}{\operatorname{ch} a \operatorname{ch} b + \operatorname{sh} a \operatorname{sh} b} = \frac{\operatorname{th} a + \operatorname{th} b}{1 + \operatorname{th} a\,\operatorname{th} b},$$
     en divisant numérateur et dénominateur par $\operatorname{ch} a \operatorname{ch} b > 0$.

    **3.** La fonction $\operatorname{th}$ est une bijection de $\mathbb{R}$ sur $]-1\,,1[$ (chapitre 5), et la question 2 dit que la loi transportée de $(\mathbb{R}, +)$ par $\operatorname{th}$ est $\star$. Par la question 1, 
    $$\boxed{(]-1\,,1[, \star) \text{ est un groupe abélien isomorphe à } (\mathbb{R}, +), \text{ par } \operatorname{th}}$$
     Le neutre est $\operatorname{th} 0 = 0$, et le symétrique de $x$ est $-x$. Une vérification directe de l'associativité serait pénible ; le transport de structure la rend gratuite.
- id: "ma-11-12"
  feuille: "f-ma-11"
  numero: 12
  partie: "Groupes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [groupes, groupes abéliens]
  noeuds: [a-groupe]
  notions: [groupe, groupe-abelien]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Soit $G$ un groupe dans lequel tout élément $x$ vérifie $x^{2} = e$. Montrer que $G$ est abélien. Donner un exemple d'un tel groupe ayant au moins quatre éléments.
  corrige: |
    Pour tous $x$ et $y$, l'hypothèse donne $x^{-1} = x$, $y^{-1} = y$ et $(xy)^{-1} = xy$. Par la proposition 2, 
    $$xy = (xy)^{-1} = y^{-1}x^{-1} = yx. \qquad \boxed{G \text{ est abélien}}$$
     Le groupe $(\mathcal{P}(E), \Delta)$, avec $E = \{1, 2\}$, convient : il a quatre éléments, et $A \,\Delta\, A = \varnothing$ pour toute partie $A$.
- id: "ma-11-13"
  feuille: "f-ma-11"
  numero: 13
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes]
  noeuds: [a-groupe]
  notions: [groupe]
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Soit $G$ un groupe, et $x$, $y$ deux éléments de $G$ tels que $x^{3} = e$ et $xyx^{-1} = y^{2}$.

    **1.** Montrer que, pour tout $k \in \mathbb{N}$, $(xyx^{-1})^{k} = xy^{k}x^{-1}$.

    **2.** En déduire que $x^{2}yx^{-2} = y^{4}$, puis que $y^{7} = e$.

    **3.** On suppose de plus que $y^{5} = e$. Montrer que $y = e$.
  corrige: |
    **1.** Pour $k = 0$, les deux membres valent $e$. Si l'égalité est vraie au rang $k$, alors 
    $$(xyx^{-1})^{k+1} = (xy^{k}x^{-1})(xyx^{-1}) = xy^{k}(x^{-1}x)yx^{-1} = xy^{k+1}x^{-1}.$$
     En d'autres termes, $\tau_{x} : g \mapsto xgx^{-1}$ est un morphisme (exercice 26), et la proposition 10 s'applique.

    **2.** On applique $\tau_{x}$ à l'égalité $xyx^{-1} = y^{2}$, puis la question 1 : 
    $$x^{2}yx^{-2} = x\,(xyx^{-1})\,x^{-1} = xy^{2}x^{-1} = (xyx^{-1})^{2} = y^{4}.$$
     Une troisième fois, $x^{3}yx^{-3} = xy^{4}x^{-1} = (y^{2})^{4} = y^{8}$. Comme $x^{3} = e$, le membre de gauche vaut $y$, d'où $y = y^{8}$. 
    $$\boxed{x^{2}yx^{-2} = y^{4}, \qquad y^{7} = e}$$

    **3.** Si de plus $y^{5} = e$, alors $y = y^{15} \cdot y^{-14} = (y^{5})^{3}\,\big((y^{7})^{2}\big)^{-1} = e$. 
    $$\boxed{y = e}$$
     *À retenir.* On a combiné $y^{7} = e$ et $y^{5} = e$ grâce à la relation $15 - 14 = 1$, c'est-à-dire $3 \times 5 - 2 \times 7 = 1$. Le chapitre 12 appellera cela une relation de Bézout.
- id: "ma-11-14"
  feuille: "f-ma-11"
  numero: 14
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes, groupe symétrique, groupes abéliens]
  noeuds: [a-groupe, a-sous-groupe, v-det]
  notions: [groupe, sous-groupe, groupe-symetrique, groupe-abelien]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    *Le centre d'un groupe.* Soit $G$ un groupe. On appelle *centre* de $G$ l'ensemble 
    $$Z(G) = \{x \in G \mid \forall a \in G, \ ax = xa\}.$$

    **1.** Montrer que $Z(G)$ est un sous-groupe abélien de $G$, et que $Z(G) = G$ si et seulement si $G$ est abélien.

    **2.** Déterminer le centre de $\mathfrak{S}_{3}$. On pourra s'inspirer de la démonstration de la proposition 5 du cours.
  corrige: |
    **1.** Le neutre commute avec tout, donc $e \in Z(G)$. Si $x$ et $y$ sont dans $Z(G)$ et $a \in G$, alors $ay = ya$ donne $y^{-1}a = ay^{-1}$, en multipliant à gauche et à droite par $y^{-1}$ ; puis 
    $$a(xy^{-1}) = xay^{-1} = xy^{-1}a,$$
     donc $xy^{-1} \in Z(G)$ (proposition 7). Deux éléments de $Z(G)$ commutent, puisque chacun commute avec tout élément de $G$. Enfin $Z(G) = G$ signifie exactement que tous les éléments commutent deux à deux. 
    $$\boxed{Z(G) \text{ est un sous-groupe abélien}, \quad Z(G) = G \iff G \text{ abélien}}$$

    **2.** Soit $\sigma \in \mathfrak{S}_{3}$ distinct de l'identité, et $a$ tel que $\sigma(a) = b \neq a$. Soit $c$ le troisième élément de $\{1, 2, 3\}$, et $\tau$ l'échange de $b$ et $c$, qui fixe $a$. Alors $(\sigma \circ \tau)(a) = \sigma(a) = b$, et $(\tau \circ \sigma)(a) = \tau(b) = c \neq b$. Ainsi $\sigma \notin Z(\mathfrak{S}_{3})$. 
    $$\boxed{Z(\mathfrak{S}_{3}) = \{\mathrm{id}\}}$$
- id: "ma-11-15"
  feuille: "f-ma-11"
  numero: 15
  partie: "Groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [groupes, sous-groupes, groupe symétrique]
  noeuds: [a-groupe, a-sous-groupe, v-det]
  notions: [groupe, sous-groupe, groupe-symetrique]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    Dans chaque cas, dire si $H$ est un sous-groupe du groupe $G$.

    **(a)** $G = (\mathbb{Z}, +)$ et $H$ est l'ensemble des entiers pairs, puis celui des entiers impairs.

    **(b)** $G = (\mathbb{R}, +)$ et $H = [-1\,,+\infty[$.

    **(c)** $G = (\mathbb{R}^{*}, \times)$ et $H = \mathbb{Q}^{*}$.

    **(d)** $G = (\mathbb{C}^{*}, \times)$ et $H = \{z \in \mathbb{C}^{*} \mid |z| \leqslant 1\}$.

    **(e)** $G = \mathfrak{S}_{E}$ et $H = \{f \in G \mid f(a) = a\}$, où $a \in E$.

    **(f)** $G = \mathfrak{S}_{E}$ et $H = \{f \in G \mid f(a) = b\}$, où $a$ et $b$ sont deux éléments distincts de $E$.

    **(g)** $G = (\mathbb{Z} \times \mathbb{Z}, +)$ et $H = \{(k, k) \mid k \in \mathbb{Z}\}$. Ce sous-groupe est-il de la forme $H_{1} \times H_{2}$, avec $H_{1}$ et $H_{2}$ sous-groupes de $\mathbb{Z}$ ?
  corrige: |
    **(a)** Les entiers pairs forment le sous-groupe $2\mathbb{Z}$. Les impairs n'en forment pas un, puisque $0$ n'est pas impair.

    **(b)** Non : $0 - 2 = -2 \notin [-1\,,+\infty[$.

    **(c)** Oui : $1 \in \mathbb{Q}^{*}$, et $\frac{x}{y} \in \mathbb{Q}^{*}$ si $x$ et $y$ sont des rationnels non nuls.

    **(d)** Non : $\frac{1}{2}$ appartient à $H$, mais pas son inverse $2$.

    **(e)** Oui : $\mathrm{id}(a) = a$, et si $f(a) = g(a) = a$, alors $g^{-1}(a) = a$ et $(f \circ g^{-1})(a) = a$.

    **(f)** Non : $\mathrm{id} \notin H$, puisque $\mathrm{id}(a) = a \neq b$.

    **(g)** Oui : $(0, 0) \in H$ et $(k, k) - (\ell, \ell) = (k - \ell, k - \ell)$. Ce n'est pas un produit : si $H = H_{1} \times H_{2}$, alors $(1, 1) \in H$ donne $1 \in H_{1}$ et $0 \in H_{2}$, puis $(1, 0) \in H$, ce qui est faux. 
    $$\boxed{\text{sous-groupes : } 2\mathbb{Z}, \ \mathbb{Q}^{*}, \ \text{(e) et (g)}}$$
     *À retenir.* La partie (g), la « diagonale », montre qu'un sous-groupe d'un groupe produit n'est pas toujours un produit de sous-groupes.
- id: "ma-11-16"
  feuille: "f-ma-11"
  numero: 16
  partie: "Groupes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Montrer que $\mathbb{U}_{\infty} = \{z \in \mathbb{C}^{*} \mid \exists n \in \mathbb{N}^{*}, \ z^{n} = 1\}$, ensemble des racines de l'unité, est un sous-groupe de $(\mathbb{C}^{*}, \times)$. Est-il égal à $\mathbb{U}$ ? On pourra considérer $\mathrm{e}^{\mathrm{i}\pi\sqrt{2}}$.

    **2.** Montrer que $\mathbb{Q}[\sqrt{2}] \setminus \{0\}$, où $\mathbb{Q}[\sqrt{2}] = \{a + b\sqrt{2} \mid (a, b) \in \mathbb{Q}^{2}\}$, est un sous-groupe de $(\mathbb{R}^{*}, \times)$.
  corrige: |
    **1.** L'ensemble $\mathbb{U}_{\infty}$ contient $1$. Si $z^{n} = 1$ et $w^{m} = 1$, alors $\big(\frac{z}{w}\big)^{nm} = \frac{(z^{n})^{m}}{(w^{m})^{n}} = 1$, donc $\frac{z}{w} \in \mathbb{U}_{\infty}$. C'est un sous-groupe de $\mathbb{C}^{*}$, contenu dans $\mathbb{U}$. Il n'est pas égal à $\mathbb{U}$ : si $\big(\mathrm{e}^{\mathrm{i}\pi\sqrt{2}}\big)^{n} = 1$ avec $n \geqslant 1$, alors $n\pi\sqrt{2} \in 2\pi\mathbb{Z}$ (chapitre 4), donc $\sqrt{2} = \frac{2k}{n}$ serait rationnel. 
    $$\boxed{\mathbb{U}_{\infty} \text{ est un sous-groupe de } \mathbb{C}^{*}, \text{ strictement contenu dans } \mathbb{U}}$$

    **2.** Le corps $\mathbb{Q}[\sqrt{2}]$ du cours a pour groupe des inversibles $\mathbb{Q}[\sqrt{2}] \setminus \{0\}$ (proposition 14), et ce groupe est contenu dans $\mathbb{R}^{*}$ avec la même loi : c'est un sous-groupe de $(\mathbb{R}^{*}, \times)$. Directement : $1$ y appartient, et le cours a montré que l'inverse d'un élément non nul y appartient, ainsi que le produit de deux éléments.
- id: "ma-11-17"
  feuille: "f-ma-11"
  numero: 17
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *Les solutions entières de $x^{2} - 3y^{2} = 1$.* On pose 
    $$H = \{x + y\sqrt{3} \mid x \in \mathbb{N}, \ y \in \mathbb{Z}, \ x^{2} - 3y^{2} = 1\}.$$
     On admet que $\sqrt{3}$ est irrationnel, ce qui se démontre comme pour $\sqrt{2}$ au chapitre 7.

    **1.** Montrer que tout élément de $H$ est strictement positif. On comparera $x$ et $|y|\sqrt{3}$.

    **2.** Montrer que $H$ est un sous-groupe de $(\mathbb{R}_{+}^{*}, \times)$.

    **3.** Vérifier que $2 + \sqrt{3} \in H$, et en déduire que l'équation $x^{2} - 3y^{2} = 1$ a une infinité de solutions dans $\mathbb{N} \times \mathbb{Z}$. En donner trois.
  corrige: |
    **1.** Si $x^{2} - 3y^{2} = 1$, alors $x^{2} = 1 + 3y^{2} > 3y^{2}$, donc $x > |y|\sqrt{3}$, puisque $x \geqslant 0$. Ainsi 
    $$x + y\sqrt{3} \geqslant x - |y|\sqrt{3} > 0.$$

    **2.** Comme $\sqrt{3}$ est irrationnel, l'écriture $x + y\sqrt{3}$ est unique, et l'on peut parler de $x$ et de $y$ pour un élément de $H$. L'élément $1 = 1 + 0\sqrt{3}$ est dans $H$. Pour $u = x + y\sqrt{3}$ et $u' = x' + y'\sqrt{3}$ dans $H$, on a 
    $$uu' = (xx' + 3yy') + (xy' + x'y)\sqrt{3}, \qquad (xx' + 3yy')^{2} - 3(xy' + x'y)^{2} = (x^{2} - 3y^{2})(x'^{2} - 3y'^{2}) = 1.$$
     De plus $xx' > 3|yy'|$ par la question 1, donc $xx' + 3yy' \in \mathbb{N}$ : $uu' \in H$. Enfin $(x + y\sqrt{3})(x - y\sqrt{3}) = 1$, donc $u^{-1} = x + (-y)\sqrt{3} \in H$. 
    $$\boxed{H \text{ est un sous-groupe de } (\mathbb{R}_{+}^{*}, \times)}$$

    **3.** On a $2^{2} - 3 \times 1^{2} = 1$. Les puissances $(2 + \sqrt{3})^{n}$, pour $n \in \mathbb{N}$, sont dans $H$ et deux à deux distinctes, puisque $2 + \sqrt{3} > 1$. On calcule les premières : 
    $$\boxed{(2, 1), \qquad (2 + \sqrt{3})^{2} = 7 + 4\sqrt{3}, \qquad (2 + \sqrt{3})^{3} = 26 + 15\sqrt{3}}$$
     et $7^{2} - 3 \times 4^{2} = 1$, $26^{2} - 3 \times 15^{2} = 676 - 675 = 1$. ✓ C'est l'équation de Pell-Fermat ; on peut montrer que $H$ est exactement l'ensemble des $(2 + \sqrt{3})^{n}$, $n \in \mathbb{Z}$.
- id: "ma-11-18"
  feuille: "f-ma-11"
  numero: 18
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    *Réunion de sous-groupes.* Soit $G$ un groupe, et $H$, $K$ deux sous-groupes de $G$.

    **1.** Montrer que $H \cup K$ est un sous-groupe de $G$ si et seulement si $H \subset K$ ou $K \subset H$.

    **2.** En déduire qu'un groupe n'est jamais la réunion de deux sous-groupes distincts de lui-même.

    **3.** Montrer que le groupe $(\mathcal{P}(\{1, 2\}), \Delta)$ est la réunion de trois sous-groupes distincts de lui-même.
  corrige: |
    **1.** Si $H \subset K$, alors $H \cup K = K$ est un sous-groupe, de même si $K \subset H$. Réciproquement, supposons que $H \cup K$ soit un sous-groupe, et que $H \not\subset K$ et $K \not\subset H$. Soit $h \in H \setminus K$ et $k \in K \setminus H$. Le produit $hk$ est dans $H \cup K$. S'il est dans $H$, alors $k = h^{-1}(hk) \in H$, ce qui est exclu ; s'il est dans $K$, alors $h = (hk)k^{-1} \in K$, exclu aussi. C'est absurde. 
    $$\boxed{H \cup K \text{ sous-groupe} \iff H \subset K \text{ ou } K \subset H}$$

    **2.** Si $G = H \cup K$, alors $H \cup K$ est un sous-groupe, donc $G = K$ ou $G = H$ par la question 1.

    **3.** Les trois parties $\{\varnothing, \{1\}\}$, $\{\varnothing, \{2\}\}$ et $\{\varnothing, \{1, 2\}\}$ sont des sous-groupes, puisque chaque partie est son propre inverse ; ils sont distincts de $\mathcal{P}(\{1, 2\})$, et leur réunion est $\mathcal{P}(\{1, 2\})$. 
    $$\boxed{\mathcal{P}(\{1, 2\}) = \{\varnothing, \{1\}\} \cup \{\varnothing, \{2\}\} \cup \{\varnothing, \{1, 2\}\}}$$
     *Piège.* La question 2 ne s'étend pas à trois sous-groupes, comme le montre cet exemple : l'argument de la question 1 utilise qu'il n'y a que deux sous-groupes en jeu.
- id: "ma-11-19"
  feuille: "f-ma-11"
  numero: 19
  partie: "Groupes"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 7
  enonce: |
    Soit $G$ un groupe et $(H_{n})_{n \in \mathbb{N}}$ une suite de sous-groupes de $G$, croissante pour l'inclusion.

    **1.** Montrer que $\bigcup_{n \in \mathbb{N}} H_{n}$ est un sous-groupe de $G$.

    **2.** On prend $G = \mathbb{U}$ et $H_{n} = \mathbb{U}_{2^{n}}$. Vérifier que la suite est croissante, et montrer que la réunion n'est pas $\mathbb{U}$ tout entier. On pourra utiliser la proposition 9 du cours.
  corrige: |
    **1.** Soit $U$ la réunion. Elle contient $e \in H_{0}$. Si $x \in H_{n}$ et $y \in H_{m}$, avec par exemple $n \leqslant m$, alors $x$ et $y$ sont dans $H_{m}$, qui est un sous-groupe, donc $xy^{-1} \in H_{m} \subset U$. 
    $$\boxed{\bigcup_{n \in \mathbb{N}} H_{n} \text{ est un sous-groupe de } G}$$
     C'est la croissance qui permet de ramener deux éléments dans un même $H_{m}$ ; l'exercice 18 montre que la réunion de deux sous-groupes quelconques n'est pas un sous-groupe.

    **2.** Comme $2^{n}$ divise $2^{n+1}$, la proposition 9 donne $\mathbb{U}_{2^{n}} \subset \mathbb{U}_{2^{n+1}}$. Le nombre $\mathrm{e}^{2\mathrm{i}\pi/3}$ appartient à $\mathbb{U}_{3}$, et s'il appartenait à $\mathbb{U}_{2^{n}}$, on aurait $\mathbb{U}_{3} \subset \mathbb{U}_{2^{n}}$, car $\mathbb{U}_{3}$ est formé de ses puissances, donc $3$ diviserait $2^{n}$ par la proposition 9, ce qui est faux. 
    $$\boxed{\mathrm{e}^{2\mathrm{i}\pi/3} \notin \bigcup_{n} \mathbb{U}_{2^{n}}}$$
- id: "ma-11-20"
  feuille: "f-ma-11"
  numero: 20
  partie: "Groupes"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [groupes, sous-groupes, ordre et groupes cycliques]
  noeuds: [a-groupe, a-sous-groupe, gf-cycliques]
  notions: [groupe, sous-groupe]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    *Sous-groupe engendré par une partie.* Soit $G$ un groupe et $X$ une partie de $G$. On note $\langle X \rangle$ l'intersection de tous les sous-groupes de $G$ qui contiennent $X$.

    **1.** Montrer que $\langle X \rangle$ est un sous-groupe de $G$ contenant $X$, et qu'il est contenu dans tout sous-groupe contenant $X$.

    **2.** Montrer que $\langle X \rangle$ est l'ensemble des produits $x_{1}^{\varepsilon_{1}} \cdots x_{n}^{\varepsilon_{n}}$, où $n \in \mathbb{N}$, $x_{i} \in X$ et $\varepsilon_{i} \in \{-1, 1\}$, avec la convention qu'un produit vide vaut $e$.

    **3.** Déterminer le sous-groupe engendré par $\{4, 6\}$ dans $(\mathbb{Z}, +)$, par $\{\mathrm{i}\}$ dans $(\mathbb{C}^{*}, \times)$, et par $\{2, 3\}$ dans $(\mathbb{Q}^{*}, \times)$.
  corrige: |
    **1.** L'ensemble des sous-groupes contenant $X$ est non vide, puisqu'il contient $G$. Leur intersection $\langle X \rangle$ est un sous-groupe (proposition 8), qui contient $X$. Si $H$ est un sous-groupe contenant $X$, il fait partie de la famille, donc $\langle X \rangle \subset H$.

    **2.** Soit $P$ l'ensemble des produits décrits. Il contient $e$ (produit vide) et $X$ (produits d'un facteur, avec $\varepsilon = 1$). Il est stable par produit, en mettant bout à bout deux produits, et par inverse, puisque 
    $$\big(x_{1}^{\varepsilon_{1}} \cdots x_{n}^{\varepsilon_{n}}\big)^{-1} = x_{n}^{-\varepsilon_{n}} \cdots x_{1}^{-\varepsilon_{1}}.$$
     C'est donc un sous-groupe contenant $X$, et $\langle X \rangle \subset P$. Réciproquement, un sous-groupe qui contient $X$ contient les $x_{i}^{\pm 1}$ et leurs produits, donc $P \subset \langle X \rangle$. 
    $$\boxed{\langle X \rangle = \{x_{1}^{\varepsilon_{1}} \cdots x_{n}^{\varepsilon_{n}} \mid n \in \mathbb{N}, \ x_{i} \in X, \ \varepsilon_{i} = \pm 1\}}$$

    **3.** Dans $(\mathbb{Z}, +)$, les éléments de $\langle 4, 6 \rangle$ sont les $4m + 6n$, qui sont pairs ; inversement, il contient $6 - 4 = 2$, donc $2\mathbb{Z}$. Dans $\mathbb{C}^{*}$, $\langle \mathrm{i} \rangle = \{\mathrm{i}^{n} \mid n \in \mathbb{Z}\} = \{1, \mathrm{i}, -1, -\mathrm{i}\}$. Dans $\mathbb{Q}^{*}$, $\langle 2, 3 \rangle$ est formé des produits $2^{a}3^{b}$, avec $a$ et $b$ dans $\mathbb{Z}$, puisque les facteurs commutent. 
    $$\boxed{\langle 4, 6 \rangle = 2\mathbb{Z}, \qquad \langle \mathrm{i} \rangle = \mathbb{U}_{4}, \qquad \langle 2, 3 \rangle = \{2^{a}3^{b} \mid (a, b) \in \mathbb{Z}^{2}\}}$$
     Le chapitre 12 montrera que le sous-groupe de $\mathbb{Z}$ engendré par $a$ et $b$ est $d\mathbb{Z}$, où $d$ est le PGCD de $a$ et $b$ : ici $d = 2$.
- id: "ma-11-21"
  feuille: "f-ma-11"
  numero: 21
  partie: "Groupes"
  etoiles: 2
  types: [Calcul]
  mots_cles: [groupes, sous-groupes]
  noeuds: [a-groupe, a-sous-groupe]
  notions: [groupe, sous-groupe, derivee-successive]
  page_enonce: 5
  page_corrige: 8
  enonce: |
    *Périodes d'une fonction.* Soit $f : \mathbb{R} \to \mathbb{R}$. On note $P(f)$ l'ensemble des réels $T$ tels que l'on ait $f(x + T) = f(x)$ pour tout réel $x$ : ce sont les périodes de $f$.

    **1.** Montrer que $P(f)$ est un sous-groupe de $(\mathbb{R}, +)$. Que vaut $P(\mathbf{1}_{\mathbb{Q}})$ ?

    **2.** Soit $f : x \mapsto \cos\dfrac{\pi x}{12} + \sin\dfrac{\pi x}{8}$. Calculer $f'' + \dfrac{\pi^{2}}{64}f$, et en déduire que toute période de $f$ est une période de $x \mapsto \cos\dfrac{\pi x}{12}$. Déterminer $P(f)$.

    **3.** Par la même méthode, déterminer $P(g)$ pour $g : x \mapsto \cos x + \sin(\sqrt{2}\,x)$. La somme de deux fonctions périodiques est-elle toujours périodique ?
  corrige: |
    **1.** Le réel $0$ est une période. Si $T$ et $T'$ sont des périodes, alors, pour tout réel $x$, 
    $$f(x + T - T') = f\big((x - T') + T\big) = f(x - T') = f\big((x - T') + T'\big) = f(x).$$
     Ainsi $P(f)$ est un sous-groupe de $\mathbb{R}$. Pour $f = \mathbf{1}_{\mathbb{Q}}$, un réel $T$ est une période si et seulement si $x + T$ et $x$ sont simultanément rationnels ou non, pour tout $x$ ; c'est le cas si $T \in \mathbb{Q}$, et pas sinon, en prenant $x = 0$. 
    $$\boxed{P(\mathbf{1}_{\mathbb{Q}}) = \mathbb{Q}}$$

    **2.** La fonction $f$ est de classe $\mathcal{C}^{2}$, et le calcul donne 
    $$f'' + \frac{\pi^{2}}{64}f = \Big(\frac{\pi^{2}}{64} - \frac{\pi^{2}}{144}\Big)\cos\frac{\pi x}{12} = \frac{5\pi^{2}}{576}\cos\frac{\pi x}{12}.$$
     Si $T$ est une période de $f$, c'en est une de $f''$, donc de $x \mapsto \cos\frac{\pi x}{12}$ : $T \in 24\mathbb{Z}$. De même, $f'' + \frac{\pi^{2}}{144}f$ est un multiple non nul de $\sin\frac{\pi x}{8}$, donc $T \in 16\mathbb{Z}$. Si $T = 24k = 16m$, alors $3k = 2m$, donc $k$ est pair et $T \in 48\mathbb{Z}$ ; réciproquement, $48$ est une période. 
    $$\boxed{P(f) = 48\mathbb{Z}}$$

    **3.** De même, toute période de $g$ appartient à $2\pi\mathbb{Z}$ et à $\sqrt{2}\pi\mathbb{Z}$, les périodes de $\sin(\sqrt{2}\,x)$. Si $T = 2\pi k = \sqrt{2}\pi m$ avec $T \neq 0$, alors $\sqrt{2} = \frac{2k}{m}$ serait rationnel. 
    $$\boxed{P(g) = \{0\} : g \text{ n'est pas périodique}}$$
     La somme de deux fonctions périodiques n'est donc pas toujours périodique : il faut que les périodes aient un rapport rationnel. L'exercice 49 explique pourquoi : $2\pi\mathbb{Z} + \sqrt{2}\pi\mathbb{Z}$ est dense dans $\mathbb{R}$.
- id: "ma-11-22"
  feuille: "f-ma-11"
  numero: 22
  partie: "Groupes"
  etoiles: 1
  types: [Calcul]
  mots_cles: [groupes, morphismes, noyau, isomorphismes]
  noeuds: [a-groupe, a-morphisme]
  notions: [groupe, morphisme-groupes, noyau, isomorphisme]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Traduire chacune des égalités suivantes en disant qu'une application est un morphisme entre deux groupes que l'on précisera. Déterminer ensuite le noyau et l'image de ce morphisme, et dire s'il est injectif, surjectif, ou s'il s'agit d'un isomorphisme.

    **(a)** $\ln(xy) = \ln x + \ln y$ ;

    **(b)** $|zz'| = |z|\,|z'|$ ;

    **(c)** $\sqrt{xy} = \sqrt{x}\sqrt{y}$ ;

    **(d)** $\overline{zz'} = \overline{z}\;\overline{z'}$ ;

    **(e)** $\mathrm{e}^{\mathrm{i}(s + t)} = \mathrm{e}^{\mathrm{i} s}\mathrm{e}^{\mathrm{i} t}$ ;

    **(f)** $(-1)^{m + n} = (-1)^{m}(-1)^{n}$.
  corrige: |
    Dans chaque cas, on identifie les deux groupes, puis on cherche les antécédents du neutre.

    **(a)** Le logarithme est un morphisme de $(\mathbb{R}_{+}^{*}, \times)$ dans $(\mathbb{R}, +)$, de noyau $\{1\}$ et d'image $\mathbb{R}$ : c'est un isomorphisme (chapitre 5).

    **(b)** Le module est un morphisme de $(\mathbb{C}^{*}, \times)$ dans $(\mathbb{R}_{+}^{*}, \times)$. Son noyau est $\mathbb{U}$ et son image $\mathbb{R}_{+}^{*}$, puisque $|r| = r$ pour $r > 0$ : il est surjectif, non injectif.

    **(c)** La racine carrée est un morphisme de $(\mathbb{R}_{+}^{*}, \times)$ dans lui-même, de noyau $\{1\}$, bijectif de réciproque $x \mapsto x^{2}$ : c'est un automorphisme.

    **(d)** La conjugaison est un morphisme de $(\mathbb{C}^{*}, \times)$ dans lui-même, de noyau $\{1\}$, et sa propre réciproque : c'est un automorphisme.

    **(e)** L'application $t \mapsto \mathrm{e}^{\mathrm{i} t}$ est un morphisme de $(\mathbb{R}, +)$ dans $(\mathbb{U}, \times)$, surjectif, de noyau $2\pi\mathbb{Z}$ (cours, exemple qui suit le théorème 2) : il n'est pas injectif.

    **(f)** L'application $n \mapsto (-1)^{n}$ est un morphisme de $(\mathbb{Z}, +)$ dans $(\mathbb{U}_{2}, \times)$, surjectif, de noyau $2\mathbb{Z}$. 
    $$\boxed{\text{isomorphismes : (a), (c), (d) ; \quad noyaux non triviaux : } \mathbb{U}, \ 2\pi\mathbb{Z}, \ 2\mathbb{Z}}$$
- id: "ma-11-23"
  feuille: "f-ma-11"
  numero: 23
  partie: "Groupes"
