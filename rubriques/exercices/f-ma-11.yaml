- id: "ma-11-01"
  feuille: "f-ma-11"
  numero: 1
  partie: "Lois de composition interne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois de composition interne, lois de composition, élément neutre, éléments inversibles]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, element-neutre, inversible]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Pour chacune des lois suivantes, dire si elle est associative, si elle est commutative, si elle admet un élément neutre et, le cas échéant, déterminer les éléments inversibles. Chaque réponse négative sera justifiée par un contre-exemple explicite.

    **(a)** Sur $\mathbb{R}$, la moyenne $x \star y = \dfrac{x + y}{2}$.

    **(b)** Sur $\mathbb{R}_{+}$, puis sur $\mathbb{R}$, la loi $x \star y = \max(x, y)$.

    **(c)** Sur $\mathcal{P}(E)$, où $E$ est un ensemble non vide, la différence $A \star B = A \setminus B$.

    **(d)** Sur $\mathbb{N}^{*}$, la loi $a \star b = a^{b}$.

    **(e)** Sur $\mathbb{Z}$, la loi $a \star b = a + b + ab$.
  corrige: |
    **(a) La moyenne.** Elle est commutative, puisque $\frac{x + y}{2} = \frac{y + x}{2}$. Elle n'est pas associative : $(0 \star 0) \star 4 = 2$, alors que $0 \star (0 \star 4) = 1$. Si $e$ était neutre, on aurait $\frac{x + e}{2} = x$, soit $e = x$, pour tout réel $x$, ce qui est impossible. 
    $$\boxed{\text{commutative, non associative, sans neutre}}$$

    **(b) Le maximum.** Il est associatif et commutatif, car $\max(\max(x, y), z)$ et $\max(x, \max(y, z))$ valent tous deux le plus grand des trois nombres. Sur $\mathbb{R}_{+}$, le réel $0$ est neutre, puisque $\max(x, 0) = x$ pour $x \geqslant 0$ ; un élément $x$ est inversible si $\max(x, y) = 0$ pour un $y \geqslant 0$, ce qui impose $x = 0$. Sur $\mathbb{R}$, un neutre $e$ vérifierait $\max(e - 1, e) = e - 1$, ce qui est faux. 
    $$\boxed{\text{sur } \mathbb{R}_{+} : \text{neutre } 0, \text{ seul } 0 \text{ inversible} ; \quad \text{sur } \mathbb{R} : \text{pas de neutre}}$$

    **(c) La différence.** Avec $E \neq \varnothing$, on a $E \setminus \varnothing = E$ et $\varnothing \setminus E = \varnothing$ : la loi n'est pas commutative. On a $(E \setminus E) \setminus E = \varnothing$ et $E \setminus (E \setminus E) = E$ : elle n'est pas associative. La partie $\varnothing$ vérifie $A \setminus \varnothing = A$, mais $\varnothing \setminus A = \varnothing \neq A$ dès que $A \neq \varnothing$ : elle n'est neutre qu'à droite. Un neutre $N$ vérifierait $N \setminus A = A$ pour tout $A$, donc $N \setminus N = N$, soit $N = \varnothing$, ce qui vient d'être exclu. 
    $$\boxed{\text{ni associative, ni commutative, sans neutre}}$$

    **(d) La puissance.** On a $(2^{3})^{2} = 64$ et $2^{(3^{2})} = 512$, puis $2^{3} = 8 \neq 9 = 3^{2}$. L'entier $1$ vérifie $a^{1} = a$, mais $1^{a} = 1 \neq a$ pour $a \geqslant 2$ : comme pour la différence, il n'est neutre que d'un côté. 
    $$\boxed{\text{ni associative, ni commutative, sans neutre}}$$

    **(e) La loi $a + b + ab$.** On reconnaît $a \star b = (1 + a)(1 + b) - 1$. Ainsi 
    $$(a \star b) \star c = (1 + a)(1 + b)(1 + c) - 1 = a \star (b \star c),$$
     la loi est commutative, et $0$ est neutre. L'entier $a$ est inversible s'il existe $b \in \mathbb{Z}$ tel que $(1 + a)(1 + b) = 1$, c'est-à-dire si $1 + a \in \{-1, 1\}$. 
    $$\boxed{\text{associative, commutative, neutre } 0, \text{ inversibles } 0 \text{ et } -2}$$
     *À retenir.* La bijection $a \mapsto 1 + a$ transporte cette loi sur la multiplication de $\mathbb{Z}$ ; c'est pourquoi elle en a toutes les propriétés, et les inversibles $0$ et $-2$ correspondent aux inversibles $1$ et $-1$ de $(\mathbb{Z}, \times)$. L'exercice 9 exploite la même idée.
- id: "ma-11-02"
  feuille: "f-ma-11"
  numero: 2
  partie: "Lois de composition interne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [lois de composition interne, élément neutre, éléments inversibles]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, element-neutre, inversible]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    On note $E = \{1, 2\}$ et $\mathcal{F}(E, E)$ l'ensemble des applications de $E$ dans $E$. Ces applications sont l'identité $\mathrm{id}$, l'échange $s$ de $1$ et $2$, et les deux applications constantes $c_{1}$ et $c_{2}$, de valeurs $1$ et $2$.

    **1.** Compléter la table de la composition, où la case de la ligne $f$ et de la colonne $g$ contient $f \circ g$.

    $$\begin{array}{|c||c|c|c|c|} \hline \circ & \mathrm{id} & s & c_{1} & c_{2} \\ \hline \hline \mathrm{id} &  &  &  &  \\ \hline s &  &  &  &  \\ \hline c_{1} &  &  &  &  \\ \hline c_{2} &  &  &  &  \\ \hline \end{array}$$

    **2.** Lire sur la table l'élément neutre, les éléments inversibles et un couple d'éléments qui ne commutent pas.

    **3.** La remarque du cours qui suit la proposition 3 affirme que, dans la table d'un groupe fini, chaque élément apparaît une fois par ligne. Quelles lignes de cette table la vérifient ? Qu'en conclure ?
  corrige: |
    **1.** On calcule chaque composée en évaluant en $1$ et en $2$. Par exemple, $(s \circ c_{1})(x) = s(1) = 2$, donc $s \circ c_{1} = c_{2}$, tandis que $(c_{1} \circ s)(x) = 1$, donc $c_{1} \circ s = c_{1}$.

    $$\begin{array}{|c||c|c|c|c|} \hline \circ & \mathrm{id} & s & c_{1} & c_{2} \\ \hline \hline \mathrm{id} & \mathrm{id} & s & c_{1} & c_{2} \\ \hline s & s & \mathrm{id} & c_{2} & c_{1} \\ \hline c_{1} & c_{1} & c_{1} & c_{1} & c_{1} \\ \hline c_{2} & c_{2} & c_{2} & c_{2} & c_{2} \\ \hline \end{array}$$

    **2.** La ligne et la colonne de $\mathrm{id}$ reproduisent les en-têtes : $\mathrm{id}$ est neutre. Un élément est inversible si sa ligne contient $\mathrm{id}$ dans une colonne dont la ligne contient aussi $\mathrm{id}$ au même endroit : seuls $\mathrm{id}$ et $s$ le sont, et $s^{-1} = s$. Enfin $s \circ c_{1} = c_{2}$ et $c_{1} \circ s = c_{1}$. 
    $$\boxed{\text{neutre } \mathrm{id} ; \quad \text{inversibles } \mathrm{id} \text{ et } s ; \quad s \circ c_{1} \neq c_{1} \circ s}$$

    **3.** Seules les lignes de $\mathrm{id}$ et de $s$ contiennent chaque élément une fois ; les lignes de $c_{1}$ et $c_{2}$ sont constantes. On retrouve ainsi que $(\mathcal{F}(E, E), \circ)$ n'est pas un groupe : $c_{1}$ et $c_{2}$, qui ne sont pas injectives, ne sont pas inversibles (chapitre 2, théorème 1). En revanche, la partie $\{\mathrm{id}, s\}$, qui est $\mathfrak{S}_{E}$, est un groupe.
- id: "ma-11-03"
  feuille: "f-ma-11"
  numero: 3
  partie: "Lois de composition interne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois de composition interne, lois de composition, élément neutre, éléments inversibles]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition, element-neutre, inversible]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *Inverse à gauche, inverse à droite.* Soit $\star$ une loi associative sur un ensemble $E$, d'élément neutre $e$.

    **1.** Soit $x \in E$. On suppose qu'il existe $a$ et $b$ dans $E$ tels que $a \star x = e$ et $x \star b = e$. Montrer que $a = b$, et que $x$ est inversible.

    **2.** Dans $(\mathcal{F}(\mathbb{N}, \mathbb{N}), \circ)$, on considère le décalage $d : n \mapsto n + 1$. Montrer que $d$ admet une infinité d'applications $g$ telles que $g \circ d = \mathrm{id}_{\mathbb{N}}$, mais aucune application $h$ telle que $d \circ h = \mathrm{id}_{\mathbb{N}}$.

    **3.** Expliquer pourquoi la question 2 ne contredit pas la question 1, ni la proposition 2 du cours.
  corrige: |
    **1.** Par associativité, on calcule de deux façons le produit $a \star x \star b$ : 
    $$a = a \star e = a \star (x \star b) = (a \star x) \star b = e \star b = b.$$

    $$\boxed{a = b, \text{ et } x \text{ est inversible, d'inverse } a}$$
     C'est la démonstration du point (i) de la proposition 2, qui ne demande en fait qu'un inverse de chaque côté.

    **2.** Pour toute application $g$ telle que $g(n) = n - 1$ pour $n \geqslant 1$, la valeur $g(0)$ étant quelconque, on a $g(d(n)) = g(n + 1) = n$ pour tout $n$ : chaque choix de $g(0) \in \mathbb{N}$ fournit une solution de $g \circ d = \mathrm{id}_{\mathbb{N}}$, et il y en a une infinité. Si $d \circ h = \mathrm{id}_{\mathbb{N}}$, alors $0 = d(h(0)) = h(0) + 1$, ce qui est impossible dans $\mathbb{N}$. 
    $$\boxed{\text{une infinité d'inverses à gauche, aucun inverse à droite}}$$

    **3.** La question 1 suppose l'existence d'un inverse *de chaque côté*, ce qui n'est pas le cas ici. La proposition 2 affirme l'unicité de l'inverse, défini comme un élément qui convient des deux côtés ; un inverse d'un seul côté peut ne pas être unique. L'application $d$ est injective sans être surjective : elle n'est pas inversible.
- id: "ma-11-04"
  feuille: "f-ma-11"
  numero: 4
  partie: "Lois de composition interne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois de composition interne]
  noeuds: [a-loi, a-monoide]
  notions: [loi-composition]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    *Éléments simplifiables.* Soit $E$ un ensemble ayant au moins deux éléments, et $f \in \mathcal{F}(E, E)$.

    **1.** Montrer que $f$ est simplifiable à gauche pour la composition, c'est-à-dire que $f \circ g = f \circ h$ entraîne $g = h$ pour tous $g$, $h$ de $\mathcal{F}(E, E)$, si et seulement si $f$ est injective.

    **2.** Montrer de même que $f$ est simplifiable à droite si et seulement si $f$ est surjective.

    **3.** En déduire que, si $E$ est fini, un élément de $\mathcal{F}(E, E)$ simplifiable d'un côté l'est aussi de l'autre. Est-ce encore vrai si $E = \mathbb{N}$ ?
  corrige: |
    **1.** Supposons $f$ injective. Si $f \circ g = f \circ h$, alors $f(g(x)) = f(h(x))$ pour tout $x$, donc $g(x) = h(x)$ : $g = h$. Réciproquement, supposons $f$ simplifiable à gauche, et soit $x$, $y$ tels que $f(x) = f(y)$. Les applications constantes $g$ et $h$, de valeurs $x$ et $y$, vérifient $f \circ g = f \circ h$, donc $g = h$ et $x = y$. 
    $$\boxed{f \text{ simplifiable à gauche} \iff f \text{ injective}}$$

    **2.** Supposons $f$ surjective et $g \circ f = h \circ f$. Tout $y \in E$ s'écrit $y = f(x)$, d'où $g(y) = h(y)$. Réciproquement, si $f$ n'est pas surjective, soit $y_{0}$ hors de l'image de $f$, et $z_{1} \neq z_{2}$ deux éléments de $E$. Les applications $g$ et $h$ égales à l'identité sauf en $y_{0}$, où $g(y_{0}) = z_{1}$ et $h(y_{0}) = z_{2}$, sont distinctes, mais $g \circ f = h \circ f$, puisque $f$ ne prend jamais la valeur $y_{0}$. 
    $$\boxed{f \text{ simplifiable à droite} \iff f \text{ surjective}}$$

    **3.** Si $E$ est fini, une application de $E$ dans $E$ est injective si et seulement si elle est surjective (chapitre 2, théorème 2), d'où le résultat. Sur $\mathbb{N}$, le décalage $d$ de l'exercice 3 est injectif sans être surjectif : il est simplifiable à gauche mais pas à droite. 
    $$\boxed{\text{vrai si } E \text{ est fini, faux pour } E = \mathbb{N}}$$
- id: "ma-11-05"
  feuille: "f-ma-11"
