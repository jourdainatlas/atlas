  enonce: |
    Soit $A$ un anneau, et $a$, $b$ deux éléments de $A$.

    **1.** Montrer que $(a + b)^{2} = a^{2} + 2ab + b^{2}$ si et seulement si $a$ et $b$ commutent.

    **2.** On suppose que $1 - ab$ est inversible, d'inverse $u$. Montrer que $1 - ba$ est inversible, et exprimer son inverse à l'aide de $a$, $b$ et $u$. On cherchera cet inverse sous la forme $1 + b\,v\,a$, avec $v \in A$ à déterminer.
  corrige: |
    **1.** Par distributivité, $(a + b)^{2} = a^{2} + ab + ba + b^{2}$, qui est égal à $a^{2} + 2ab + b^{2}$ si et seulement si $ba = ab$, par simplification dans le groupe $(A, +)$. 
    $$\boxed{(a + b)^{2} = a^{2} + 2ab + b^{2} \iff ab = ba}$$

    **2.** On pose $c = 1 + bua$, avec $u(1 - ab) = (1 - ab)u = 1$. On calcule, en factorisant $b$ à gauche et $a$ à droite : 
    $$(1 - ba)c = 1 - ba + bua - babua = 1 - ba + b\big(u - abu\big)a = 1 - ba + b\big((1 - ab)u\big)a = 1 - ba + ba = 1,$$
     et de même $c(1 - ba) = 1 - ba + b\big(u(1 - ab)\big)a = 1$. 
    $$\boxed{(1 - ba)^{-1} = 1 + b(1 - ab)^{-1}a}$$
     La formule se devine en écrivant formellement $\frac{1}{1 - ba} = \sum (ba)^{k} = 1 + b\big(\sum (ab)^{k}\big)a$ ; ce calcul n'a pas de sens en général, mais sa conclusion se vérifie directement.
- id: "ma-11-37"
  feuille: "f-ma-11"
  numero: 37
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux et corps, éléments inversibles, groupes abéliens, anneaux, anneaux intègres]
  noeuds: [a-anneau, a-monoide, a-groupe]
  notions: [anneau, inversible, groupe-abelien, anneau-integre]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    *Les nombres duaux.* Sur $\mathbb{R}^{2}$, on définit l'addition terme à terme et la multiplication 
    $$(a, b) \times (c, d) = (ac, \, ad + bc).$$

    **1.** Montrer que $(\mathbb{R}^{2}, +, \times)$ est un anneau commutatif, dont on précisera l'unité.

    **2.** On note $1 = (1, 0)$ et $\varepsilon = (0, 1)$, et l'on identifie le réel $a$ à $(a, 0)$. Vérifier que $(a, b) = a + b\varepsilon$ et que $\varepsilon^{2} = 0$. L'anneau est-il intègre ?

    **3.** Déterminer les éléments inversibles, et l'inverse de $a + b\varepsilon$ lorsqu'il existe.

    **4.** À l'aide du théorème 3 du cours, calculer $(a + b\varepsilon)^{n}$ pour $n \in \mathbb{N}^{*}$. En déduire que, pour toute fonction polynomiale $P : x \mapsto \sum_{k=0}^{d} c_{k}x^{k}$ à coefficients réels, on a $P(a + \varepsilon) = P(a) + P'(a)\varepsilon$.

    La dernière égalité est le principe de la *dérivation automatique*, qu'utilisent les logiciels de calcul : on obtient la dérivée d'une fonction en calculant avec des nombres duaux.
  corrige: |
    **1.** L'addition fait de $\mathbb{R}^{2}$ un groupe abélien (groupe produit). La multiplication est commutative, par symétrie de la formule, et associative : 
    $$\big((a, b)(c, d)\big)(e, f) = (ace, \ acf + ade + bce) = (a, b)\big((c, d)(e, f)\big).$$
     Elle est distributive, puisque ses composantes sont linéaires en chaque facteur, et $(1, 0)(c, d) = (c, d)$. 
    $$\boxed{\text{anneau commutatif d'unité } (1, 0)}$$

    **2.** On a $a + b\varepsilon = (a, 0) + (b, 0)(0, 1) = (a, 0) + (0, b) = (a, b)$, et $\varepsilon^{2} = (0 \times 0, \, 0 \times 1 + 1 \times 0) = (0, 0)$. Comme $\varepsilon \neq 0$ et $\varepsilon \times \varepsilon = 0$, l'anneau n'est pas intègre.

    **3.** L'égalité $(a + b\varepsilon)(c + d\varepsilon) = 1$ s'écrit $ac = 1$ et $ad + bc = 0$. Elle a une solution si et seulement si $a \neq 0$, et alors $c = \frac{1}{a}$ et $d = -\frac{b}{a^{2}}$. 
    $$\boxed{a + b\varepsilon \text{ inversible} \iff a \neq 0, \qquad (a + b\varepsilon)^{-1} = \frac{1}{a} - \frac{b}{a^{2}}\varepsilon}$$

    **4.** Les éléments $a$ et $b\varepsilon$ commutent, et $(b\varepsilon)^{k} = 0$ pour $k \geqslant 2$. Le théorème 3 donne 
    $$\boxed{(a + b\varepsilon)^{n} = a^{n} + na^{n-1}b\,\varepsilon}$$
     En particulier $(a + \varepsilon)^{k} = a^{k} + ka^{k-1}\varepsilon$, et en sommant avec les coefficients $c_{k}$, 
    $$P(a + \varepsilon) = \sum_{k=0}^{d} c_{k}a^{k} + \Big(\sum_{k=1}^{d} kc_{k}a^{k-1}\Big)\varepsilon = P(a) + P'(a)\varepsilon.$$
     Par exemple, pour $P(x) = x^{3} - 2x$, on trouve $(2 + \varepsilon)^{3} - 2(2 + \varepsilon) = 8 + 12\varepsilon - 4 - 2\varepsilon = 4 + 10\varepsilon$, et en effet $P(2) = 4$ et $P'(2) = 10$. ✓ Le terme $\varepsilon^{2} = 0$ joue le rôle du $o(h)$ d'un développement limité à l'ordre $1$ (chapitre 10).
- id: "ma-11-38"
  feuille: "f-ma-11"
  numero: 38
  partie: "Anneaux et corps"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [anneaux et corps, morphismes, isomorphismes, groupes abéliens, anneaux]
  noeuds: [a-anneau, a-morphisme, a-groupe]
  notions: [anneau, morphisme-groupes, isomorphisme, groupe-abelien]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    *Un anneau non commutatif.* Soit $(G, +)$ un groupe abélien, et $\mathrm{End}(G)$ l'ensemble de ses endomorphismes. Pour $f$ et $g$ dans $\mathrm{End}(G)$, on note $f + g$ l'application $x \mapsto f(x) + g(x)$.

    **1.** Montrer que $(\mathrm{End}(G), +, \circ)$ est un anneau, dont on précisera le zéro et l'unité. Où sert l'hypothèse que $G$ est abélien ?

    **2.** On prend $G = (\mathbb{Z}^{2}, +)$, et l'on considère les endomorphismes $s : (a, b) \mapsto (b, a)$, $p : (a, b) \mapsto (a, 0)$ et $h : (a, b) \mapsto (0, a)$. Calculer $s \circ p$, $p \circ s$ et $h \circ h$. Que peut-on en conclure sur l'anneau $\mathrm{End}(\mathbb{Z}^{2})$ ?

    **3.** À l'aide de l'exercice 25, montrer que l'anneau $\mathrm{End}(\mathbb{Z})$ est isomorphe à l'anneau $\mathbb{Z}$.

    Le chapitre 16 retrouvera l'anneau $\mathrm{End}(\mathbb{Z}^{2})$ sous la forme d'un anneau de matrices.
  corrige: |
    **1.** Si $f$ et $g$ sont des endomorphismes, alors, pour $x$ et $y$ dans $G$, 
    $$(f + g)(x + y) = f(x) + f(y) + g(x) + g(y) = (f + g)(x) + (f + g)(y),$$
     où l'on a échangé $f(y)$ et $g(x)$ : c'est là que sert la commutativité de $G$. Ainsi $f + g \in \mathrm{End}(G)$, et $(\mathrm{End}(G), +)$ est un groupe abélien, de zéro l'application nulle et d'opposé $-f : x \mapsto -f(x)$, chaque propriété se vérifiant point par point dans $G$. La composée de deux endomorphismes en est un (proposition 11), la composition est associative, d'unité $\mathrm{id}_{G}$. Enfin, pour tout $x$, 
    $$\big(f \circ (g + h)\big)(x) = f\big(g(x) + h(x)\big) = f(g(x)) + f(h(x)), \qquad \big((g + h) \circ f\big)(x) = g(f(x)) + h(f(x)),$$
     la première égalité utilisant que $f$ est un morphisme. 
    $$\boxed{(\mathrm{End}(G), +, \circ) \text{ est un anneau, de zéro } 0 \text{ et d'unité } \mathrm{id}_{G}}$$

    **2.** On évalue en $(a, b)$ : 
    $$(s \circ p)(a, b) = s(a, 0) = (0, a), \qquad (p \circ s)(a, b) = p(b, a) = (b, 0), \qquad (h \circ h)(a, b) = h(0, a) = (0, 0).$$

    $$\boxed{s \circ p \neq p \circ s, \qquad h \circ h = 0 \text{ avec } h \neq 0}$$
     L'anneau $\mathrm{End}(\mathbb{Z}^{2})$ n'est pas commutatif, et il n'est pas intègre : $h$ est un diviseur de zéro.

    **3.** D'après l'exercice 25, tout endomorphisme de $\mathbb{Z}$ s'écrit $n \mapsto kn$, avec $k = f(1)$. L'application $\Phi : f \mapsto f(1)$ est donc une bijection de $\mathrm{End}(\mathbb{Z})$ sur $\mathbb{Z}$. Elle vérifie $\Phi(f + g) = f(1) + g(1)$, $\Phi(\mathrm{id}) = 1$, et $\Phi(f \circ g) = f(g(1)) = f(1)g(1)$, puisque $f(n) = f(1)n$. 
    $$\boxed{\mathrm{End}(\mathbb{Z}) \simeq \mathbb{Z} \text{ comme anneaux}}$$
- id: "ma-11-39"
  feuille: "f-ma-11"
  numero: 39
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux et corps, éléments inversibles, anneaux, anneaux intègres, éléments nilpotents]
  noeuds: [a-anneau, a-monoide]
  notions: [anneau, inversible, anneau-integre]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    *Éléments nilpotents.* Un élément $x$ d'un anneau $A$ est dit *nilpotent* s'il existe $n \in \mathbb{N}^{*}$ tel que $x^{n} = 0$.

    **1.** Montrer que, dans un anneau intègre, le seul élément nilpotent est $0$. Donner un élément nilpotent non nul dans l'anneau de l'exercice 37, puis dans celui de l'exercice 38.

    **2.** Soit $x$ et $y$ deux éléments de $A$ tels que $xy$ soit nilpotent. Montrer que $yx$ est nilpotent.

    **3.** Soit $x$ et $y$ deux éléments nilpotents qui commutent. Montrer que $xy$ et $x + y$ sont nilpotents.

    **4.** Dans l'anneau $\mathrm{End}(\mathbb{Z}^{2})$, on considère $h : (a, b) \mapsto (0, a)$ et $k : (a, b) \mapsto (b, 0)$. Montrer que $h$ et $k$ sont nilpotents, mais que ni $h + k$ ni $h \circ k$ ne le sont. Quelle hypothèse de la question 3 fait défaut ?

    **5.** Soit $x$ nilpotent, avec $x^{n} = 0$. Montrer que $1 - x$ est inversible, et donner son inverse.
  corrige: |
    **1.** Dans un anneau intègre, si $x^{n} = 0$ avec $n$ minimal, et si $n \geqslant 2$, alors $x \cdot x^{n-1} = 0$ avec $x^{n-1} \neq 0$, donc $x = 0$ ; si $n = 1$, $x = 0$ directement. L'élément $\varepsilon$ de l'exercice 37 et l'endomorphisme $h$ de l'exercice 38 sont nilpotents et non nuls.

    **2.** Si $(xy)^{n} = 0$, alors $(yx)^{n+1} = y(xy)^{n}x = 0$. $\boxed{yx \text{ est nilpotent}}$

    **3.** Soit $x^{n} = 0$ et $y^{m} = 0$. Comme $x$ et $y$ commutent, $(xy)^{n} = x^{n}y^{n} = 0$. Par le théorème 3, 
    $$(x + y)^{n + m - 1} = \sum_{k=0}^{n + m - 1} \binom{n + m - 1}{k}x^{k}y^{n + m - 1 - k},$$
     et chaque terme est nul : si $k < n$, alors $n + m - 1 - k \geqslant m$ et $y^{n + m - 1 - k} = 0$. 
    $$\boxed{xy \text{ et } x + y \text{ sont nilpotents}}$$

    **4.** On a $h^{2} = 0$ (exercice 38) et $k^{2}(a, b) = k(b, 0) = (0, 0)$. Mais $(h + k)(a, b) = (b, a)$ : c'est l'échange $s$, qui vérifie $s^{2} = \mathrm{id}$, donc ses puissances valent $\mathrm{id}$ ou $s$ et ne sont jamais nulles. De même, $(h \circ k)(a, b) = h(b, 0) = (0, b)$ : c'est un élément $q$ tel que $q^{2} = q \neq 0$, donc $q^{n} = q \neq 0$ pour tout $n$. 
    $$\boxed{h, k \text{ nilpotents}, \quad h + k \text{ et } h \circ k \text{ non nilpotents}}$$
     L'hypothèse qui fait défaut est la commutation : $(k \circ h)(a, b) = (a, 0) \neq (0, b)$.

    **5.** Les éléments $1$ et $x$ commutent ; le théorème 3, avec $a = 1$ et $b = x$, donne 
    $$(1 - x)(1 + x + \cdots + x^{n-1}) = 1 - x^{n} = 1,$$
     et de même dans l'autre ordre. $\boxed{(1 - x)^{-1} = 1 + x + \cdots + x^{n-1}}$
- id: "ma-11-40"
  feuille: "f-ma-11"
  numero: 40
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [anneaux et corps, groupes abéliens, anneaux, anneaux intègres, sous-anneaux]
  noeuds: [a-anneau, a-groupe, a-morph-anneau]
  notions: [anneau, groupe-abelien, anneau-integre, sous-anneau]
  page_enonce: 10
  page_corrige: 17
  enonce: |
    *Anneaux de Boole.* Un anneau $A$ est dit *de Boole* si $x^{2} = x$ pour tout $x \in A$.

    **1.** Montrer que, pour tout ensemble $E$, l'anneau $(\mathcal{P}(E), \Delta, \cap)$ du cours est de Boole.

    **2.** Soit $A$ un anneau de Boole. En développant $(x + x)^{2}$, montrer que $x + x = 0$ pour tout $x \in A$. En développant $(x + y)^{2}$, montrer que $A$ est commutatif.

    **3.** Montrer qu'un anneau de Boole intègre a exactement deux éléments. Pour quels ensembles $E$ l'anneau $\mathcal{P}(E)$ est-il intègre ?

    **4.** Soit $X$ une partie de $E$, distincte de $\varnothing$ et de $E$. Montrer que $\{\varnothing, X, E \setminus X, E\}$ est le plus petit sous-anneau de $\mathcal{P}(E)$ contenant $X$.
  corrige: |
    **1.** Pour toute partie $A$, on a $A \cap A = A$.

    **2.** On a $x + x = (x + x)^{2} = x^{2} + x^{2} + x^{2} + x^{2} = 4x$, d'où $x + x = 0$. Ensuite 
    $$x + y = (x + y)^{2} = x^{2} + xy + yx + y^{2} = x + y + xy + yx,$$
     donc $xy + yx = 0$, soit $xy = -yx = yx$, puisque tout élément est son propre opposé. 
    $$\boxed{x = -x, \qquad xy = yx}$$

    **3.** Si $A$ est intègre, $x^{2} = x$ s'écrit $x(x - 1) = 0$, donc $x = 0$ ou $x = 1$ ; comme $A$ est non nul, $0 \neq 1$. 
    $$\boxed{\text{un anneau de Boole intègre a exactement deux éléments}}$$
     L'anneau $\mathcal{P}(E)$ est donc intègre si et seulement si $E$ a un seul élément : pour $E = \varnothing$, c'est l'anneau nul, et si $E$ a deux éléments distincts $a$ et $b$, $\{a\} \cap \{b\} = \varnothing$ (cours).

    **4.** Un sous-anneau contenant $X$ contient l'unité $E$, le zéro $\varnothing$, et $E \,\Delta\, X = E \setminus X$. Réciproquement, $S = \{\varnothing, X, E \setminus X, E\}$ contient $E$, et il est stable par $\Delta$ et par $\cap$, comme on le vérifie sur les couples d'éléments de $S$ : par exemple $X \,\Delta\, (E \setminus X) = E$ et $X \cap (E \setminus X) = \varnothing$. Dans cet anneau, la différence est $\Delta$, puisque tout élément est son propre opposé. 
    $$\boxed{\{\varnothing, X, E \setminus X, E\} \text{ est le plus petit sous-anneau contenant } X}$$
- id: "ma-11-41"
  feuille: "f-ma-11"
  numero: 41
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux et corps, éléments inversibles, anneaux, sous-anneaux]
  noeuds: [a-anneau, a-monoide, a-morph-anneau]
  notions: [anneau, inversible, sous-anneau]
  page_enonce: 10
  page_corrige: 17
  enonce: |
    *Les entiers d'Eisenstein.* On note $j = \mathrm{e}^{2\mathrm{i}\pi/3}$ et $\mathbb{Z}[j] = \{a + bj \mid (a, b) \in \mathbb{Z}^{2}\}$.

    **1.** Vérifier que $j^{2} = -1 - j$, et en déduire que $\mathbb{Z}[j]$ est un sous-anneau de $\mathbb{C}$.

    **2.** Montrer que $|a + bj|^{2} = a^{2} - ab + b^{2}$ pour tous réels $a$ et $b$.

    **3.** En s'inspirant de l'étude de $\mathbb{Z}[\mathrm{i}]$ dans le cours, déterminer les éléments inversibles de $\mathbb{Z}[j]$, et reconnaître le groupe qu'ils forment.
  corrige: |
    **1.** Le nombre $j$ est racine de $z^{2} + z + 1$, puisque $1 + j + j^{2} = 0$ (chapitre 4). L'ensemble $\mathbb{Z}[j]$ contient $1$, est stable par différence, et 
    $$(a + bj)(c + dj) = ac + (ad + bc)j + bd\,j^{2} = (ac - bd) + (ad + bc - bd)j \in \mathbb{Z}[j].$$

    **2.** Comme $\overline{j} = j^{2}$ et $j + \overline{j} = 2\cos\frac{2\pi}{3} = -1$, 
    $$|a + bj|^{2} = (a + bj)(a + b\overline{j}) = a^{2} + ab(j + \overline{j}) + b^{2}j\overline{j} = a^{2} - ab + b^{2}.$$

    **3.** Comme pour $\mathbb{Z}[\mathrm{i}]$, si $x = a + bj$ est inversible, le produit $|x|^{2}|x^{-1}|^{2}$ vaut $1$, et c'est un produit de deux entiers naturels, donc $a^{2} - ab + b^{2} = 1$. On écrit 
    $$a^{2} - ab + b^{2} = \Big(a - \frac{b}{2}\Big)^{2} + \frac{3b^{2}}{4},$$
     ce qui impose $|b| \leqslant 1$, puis on trouve les solutions $(\pm 1, 0)$, $(0, \pm 1)$, $(1, 1)$ et $(-1, -1)$. Elles correspondent à $\pm 1$, $\pm j$, $1 + j = -j^{2}$ et $-1 - j = j^{2}$. Réciproquement, ces six nombres sont de module $1$, et l'inverse $\overline{x}$ de chacun est encore dans $\mathbb{Z}[j]$, puisque $\overline{j} = j^{2} = -1 - j$. 
    $$\boxed{\mathbb{Z}[j]^{\times} = \{\pm 1, \pm j, \pm j^{2}\} = \mathbb{U}_{6}}$$
     Les inversibles de $\mathbb{Z}[\mathrm{i}]$ formaient $\mathbb{U}_{4}$, ceux de $\mathbb{Z}[j]$ forment $\mathbb{U}_{6}$ : ce sont les rotations qui laissent invariant un réseau carré, ou un réseau triangulaire.
- id: "ma-11-42"
  feuille: "f-ma-11"
  numero: 42
  partie: "Anneaux et corps"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux et corps, éléments inversibles, morphismes, anneaux, sous-anneaux]
  noeuds: [a-anneau, a-monoide, a-morphisme, a-morph-anneau]
  notions: [anneau, inversible, morphisme-groupes, sous-anneau]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    *Les inversibles de $\mathbb{Z}[\sqrt{2}]$.* On note $A = \mathbb{Z}[\sqrt{2}]$, sous-anneau de $\mathbb{R}$ d'après l'exercice 34, et, pour $x = a + b\sqrt{2}$ avec $a$, $b$ entiers, $\sigma(x) = a - b\sqrt{2}$ et $N(x) = x\,\sigma(x)$.

    **1.** Justifier que $\sigma$ est bien définie, que c'est un automorphisme de l'anneau $A$, puis que l'on a $N(xy) = N(x)N(y)$ et $N(x) = a^{2} - 2b^{2}$, qui est un entier.

    **2.** Montrer que $x$ est inversible dans $A$ si et seulement si $N(x) = \pm 1$.

    **3.** Montrer que $1 + \sqrt{2}$ est inversible et que ses puissances sont deux à deux distinctes. Que peut-on en conclure sur $A^{\times}$ ? Comparer avec $\mathbb{Z}[\mathrm{i}]^{\times}$.

    **4.** Montrer que, pour tout $k \in \mathbb{N}$, il existe un entier naturel $a$ tel que $(1 + \sqrt{2})^{k} = \sqrt{a} + \sqrt{a + 1}$. Le vérifier pour $k = 2$ et $k = 3$.
  corrige: |
    **1.** Comme $\sqrt{2}$ est irrationnel, l'écriture $x = a + b\sqrt{2}$ est unique, donc $\sigma$ est bien définie ; c'est la restriction à $A$ de l'automorphisme de $\mathbb{Q}[\sqrt{2}]$ étudié dans le cours, et elle envoie $A$ sur $A$, avec $\sigma \circ \sigma = \mathrm{id}_{A}$. Ensuite $N(xy) = xy\,\sigma(x)\sigma(y) = N(x)N(y)$, et 
    $$N(x) = (a + b\sqrt{2})(a - b\sqrt{2}) = a^{2} - 2b^{2} \in \mathbb{Z}.$$

    **2.** Si $xy = 1$ dans $A$, alors $N(x)N(y) = N(1) = 1$, avec deux entiers : $N(x) = \pm 1$. Réciproquement, si $N(x) = \pm 1$, alors $x \cdot \big(\pm\sigma(x)\big) = 1$, avec $\pm\sigma(x) \in A$. 
    $$\boxed{x \in A^{\times} \iff N(x) = \pm 1}$$

    **3.** On a $N(1 + \sqrt{2}) = 1 - 2 = -1$ : $1 + \sqrt{2}$ est inversible, d'inverse $\sqrt{2} - 1$. Comme $1 + \sqrt{2} > 1$, la suite de ses puissances est strictement croissante. 
    $$\boxed{A^{\times} \text{ est infini, alors que } \mathbb{Z}[\mathrm{i}]^{\times} = \mathbb{U}_{4} \text{ a quatre éléments}}$$
     La différence vient de ce que $|x|^{2}$ est une somme de carrés, positive, alors que $N(x) = a^{2} - 2b^{2}$ peut valoir $\pm 1$ pour de grands $a$ et $b$ : c'est encore l'équation de Pell-Fermat, comme à l'exercice 17.

    **4.** En développant, $(1 + \sqrt{2})^{k} = p + q\sqrt{2}$ avec $p$ et $q$ entiers naturels, et 
    $$p^{2} - 2q^{2} = N\big((1 + \sqrt{2})^{k}\big) = (-1)^{k}.$$
     Ainsi $p^{2}$ et $2q^{2}$ sont deux entiers naturels consécutifs ; si $a$ est le plus petit, on a 
    $$\boxed{(1 + \sqrt{2})^{k} = \sqrt{p^{2}} + \sqrt{2q^{2}} = \sqrt{a} + \sqrt{a + 1}}$$
     Pour $k = 2$, $3 + 2\sqrt{2} = \sqrt{9} + \sqrt{8}$, d'où $a = 8$ ; pour $k = 3$, $7 + 5\sqrt{2} = \sqrt{49} + \sqrt{50}$, d'où $a = 49$. ✓
- id: "ma-11-43"
  feuille: "f-ma-11"
  numero: 43
  partie: "Anneaux et corps"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [anneaux et corps, groupes abéliens, anneaux, corps, sous-anneaux]
  noeuds: [a-anneau, a-groupe, a-corps, a-morph-anneau]
  notions: [anneau, groupe-abelien, corps, sous-anneau]
  page_enonce: 10
  page_corrige: 18
  enonce: |
    Les anneaux commutatifs suivants sont-ils des corps ? Justifier chaque réponse.

    **(a)** $\mathbb{Q}(\mathrm{i}) = \{a + \mathrm{i} b \mid (a, b) \in \mathbb{Q}^{2}\}$, sous-anneau de $\mathbb{C}$ ;

    **(b)** l'anneau $\mathbb{D}$ des nombres décimaux, puis l'anneau $\mathbb{Z}[\mathrm{i}]$ ;

    **(c)** l'anneau des nombres duaux de l'exercice 37 ;

    **(d)** l'anneau $\mathcal{F}(X, \mathbb{R})$, où $X$ a au moins deux éléments ;

    **(e)** l'anneau $(\mathcal{P}(E), \Delta, \cap)$, où $E$ a un seul élément.
  corrige: |
    **(a)** $\mathbb{Q}(\mathrm{i})$ est un sous-anneau de $\mathbb{C}$, comme $\mathbb{Z}[\mathrm{i}]$, et l'inverse de $a + \mathrm{i} b \neq 0$ est $\frac{a - \mathrm{i} b}{a^{2} + b^{2}}$, qui est dans $\mathbb{Q}(\mathrm{i})$ : c'est un corps.

    **(b)** $\mathbb{D}$ n'est pas un corps, puisque $\frac{1}{3}$ n'est pas décimal (chapitre 7) ; $\mathbb{Z}[\mathrm{i}]$ non plus, puisque $2$ n'est pas dans $\mathbb{U}_{4}$, groupe de ses inversibles.

    **(c)** Non : $\varepsilon \neq 0$ n'est pas inversible (exercice 37).

    **(d)** Non : l'indicatrice d'un singleton n'est pas nulle et n'est pas inversible.

    **(e)** Oui : l'anneau $\{\varnothing, E\}$ est non nul, et son seul élément non nul, $E$, est l'unité. 
    $$\boxed{\text{corps : (a) et (e)}}$$
     Le corps (e) a deux éléments ; c'est le plus petit corps possible, puisque $0 \neq 1$.
- id: "ma-11-44"
  feuille: "f-ma-11"
  numero: 44
  partie: "Anneaux et corps"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [anneaux et corps, éléments inversibles, anneaux, anneaux intègres, corps]
  noeuds: [a-anneau, a-monoide, a-corps]
  notions: [anneau, inversible, anneau-integre, corps]
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *Anneaux intègres finis.*

    **1.** Soit $A$ un anneau intègre fini, et $a \in A \setminus \{0\}$. Montrer que l'application $x \mapsto ax$ est injective, puis, à l'aide du théorème 2 du chapitre 2, qu'elle est bijective. En déduire que $A$ est un corps.

    **2.** Soit $\mathbb{K}$ un corps fini. Déterminer les éléments $x$ de $\mathbb{K}$ tels que $x = x^{-1}$. En regroupant chaque élément avec son inverse, en déduire que le produit de tous les éléments non nuls de $\mathbb{K}$ vaut $-1$.

    **3.** Vérifier ce résultat sur le corps de l'exercice 43 (e).
  corrige: |
    **1.** Si $ax = ay$, alors $a(x - y) = 0$, et $x = y$ puisque $a \neq 0$ et que $A$ est intègre : l'application $x \mapsto ax$ est injective. C'est une application de l'ensemble fini $A$ dans lui-même, donc elle est bijective (chapitre 2, théorème 2). En particulier, il existe $b$ tel que $ab = 1$, et $ba = 1$ par commutativité. 
    $$\boxed{\text{tout anneau intègre fini est un corps}}$$

    **2.** On a $x = x^{-1}$ si et seulement si $x^{2} = 1$, c'est-à-dire $(x - 1)(x + 1) = 0$, soit $x = \pm 1$ par intégrité. Les autres éléments non nuls se regroupent par paires $\{x, x^{-1}\}$ de deux éléments distincts, de produit $1$. Le produit de tous les éléments non nuls vaut donc le produit des éléments de $\{1, -1\}$, qui est $-1$, que $1$ et $-1$ soient distincts ou non. 
    $$\boxed{\prod_{x \in \mathbb{K}^{*}} x = -1}$$

    **3.** Dans le corps $\{\varnothing, E\}$, le produit des éléments non nuls est $E = 1$, et $-1 = 1$, puisque $E \,\Delta\, E = \varnothing$. ✓ Ce résultat est l'analogue, dans un corps fini quelconque, du théorème de Wilson de l'arithmétique : $(p - 1)! \equiv -1 \ [p]$ lorsque $p$ est premier.
- id: "ma-11-45"
  feuille: "f-ma-11"
  numero: 45
  partie: "Anneaux et corps"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [anneaux et corps, morphismes, anneaux, "morphismes d'anneaux"]
  noeuds: [a-anneau, a-morphisme, a-morph-anneau]
  notions: [anneau, morphisme-groupes, morphisme-anneaux]
  page_enonce: 11
  page_corrige: 19
  enonce: |
    *Morphismes d'anneaux.*

    **1.** Soit $A$ un anneau. Montrer qu'il existe un unique morphisme d'anneaux de $\mathbb{Z}$ dans $A$.

    **2.** Montrer que le seul endomorphisme de l'anneau $\mathbb{Q}$ est l'identité.

    **3.** Soit $f$ un endomorphisme de l'anneau $\mathbb{R}$.

    **(a)** Montrer que $f(x) = x$ pour tout $x \in \mathbb{Q}$.

    **(b)** Montrer que $f(x) \geqslant 0$ pour tout $x \geqslant 0$, en écrivant $x$ comme un carré. En déduire que $f$ est croissante.

    **(c)** À l'aide de la densité de $\mathbb{Q}$ dans $\mathbb{R}$ (chapitre 7), montrer que $f = \mathrm{id}_{\mathbb{R}}$.

    **4.** Déterminer les endomorphismes $f$ de l'anneau $\mathbb{C}$ tels que $f(x) = x$ pour tout $x \in \mathbb{R}$.

    **5.** Déterminer les automorphismes de l'anneau $\mathbb{Q}[\sqrt{2}]$. On montrera qu'un tel automorphisme envoie $\sqrt{2}$ sur $\sqrt{2}$ ou sur $-\sqrt{2}$.
  corrige: |
    **1.** Un morphisme d'anneaux $f : \mathbb{Z} \to A$ est un morphisme de groupes additifs tel que $f(1) = 1_{A}$ ; par l'exercice 25, $f(n) = n \cdot 1_{A}$. Réciproquement, cette application respecte l'addition, envoie $1$ sur $1_{A}$, et $(n \cdot 1_{A})(m \cdot 1_{A}) = (nm) \cdot 1_{A}$ par la proposition 13. 
    $$\boxed{\text{l'unique morphisme d'anneaux de } \mathbb{Z} \text{ dans } A \text{ est } n \mapsto n \cdot 1_{A}}$$

    **2.** Soit $f$ un endomorphisme de $\mathbb{Q}$. Par la question 1, $f(n) = n$ pour $n \in \mathbb{Z}$. Pour $\frac{p}{q}$ avec $q \neq 0$, $q f\big(\frac{p}{q}\big) = f(p) = p$, donc $f\big(\frac{p}{q}\big) = \frac{p}{q}$. $\boxed{f = \mathrm{id}_{\mathbb{Q}}}$

    **3.** *(a)* Le raisonnement de la question 2 s'applique : $f(x) = x$ pour $x \in \mathbb{Q}$.

    *(b)* Si $x \geqslant 0$, alors $f(x) = f\big(\sqrt{x}^{2}\big) = f(\sqrt{x})^{2} \geqslant 0$. Si $x \leqslant y$, alors $f(y) - f(x) = f(y - x) \geqslant 0$ : $f$ est croissante.

    *(c)* Supposons $f(x) < x$ pour un réel $x$. Par densité, il existe un rationnel $r$ tel que $f(x) < r < x$. Mais $r < x$ donne $r = f(r) \leqslant f(x)$, ce qui est absurde. De même, $f(x) > x$ est impossible. 
    $$\boxed{\text{le seul endomorphisme de l'anneau } \mathbb{R} \text{ est } \mathrm{id}_{\mathbb{R}}}$$

    **4.** On a $f(\mathrm{i})^{2} = f(-1) = -1$, donc $f(\mathrm{i}) = \pm\mathrm{i}$, et $f(a + \mathrm{i} b) = a + bf(\mathrm{i})$. Réciproquement, l'identité et la conjugaison conviennent. 
    $$\boxed{f = \mathrm{id}_{\mathbb{C}} \quad\text{ou}\quad f : z \mapsto \overline{z}}$$

    **5.** Soit $f$ un automorphisme de $\mathbb{Q}[\sqrt{2}]$. Comme à la question 2, $f$ est l'identité sur $\mathbb{Q}$. De plus $f(\sqrt{2})^{2} = f(2) = 2$, donc $f(\sqrt{2})$ vaut $\sqrt{2}$ ou $-\sqrt{2}$. Ainsi, pour tous rationnels $a$ et $b$, 
    $$f(a + b\sqrt{2}) = a \pm b\sqrt{2},$$
     et $f$ est l'identité ou l'automorphisme $\sigma$ du cours. 
    $$\boxed{\text{les automorphismes de } \mathbb{Q}[\sqrt{2}] \text{ sont } \mathrm{id} \text{ et } \sigma}$$
     *À retenir.* L'ordre de $\mathbb{R}$ est « algébrique » : les réels positifs sont exactement les carrés. C'est ce qui rend $\mathbb{R}$ si rigide, alors que $\mathbb{C}$, qui n'est pas ordonnable (cours, section 11.4), possède la conjugaison.
- id: "ma-11-46"
  feuille: "f-ma-11"
  numero: 46
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [lois de composition, élément neutre, éléments inversibles, sous-groupes, morphismes, isomorphismes, anneaux, anneaux intègres]
  noeuds: [a-loi, a-monoide, a-sous-groupe, a-morphisme, a-anneau, a-corps, a-morph-anneau]
  notions: [loi-composition, element-neutre, inversible, sous-groupe, morphisme-groupes, isomorphisme, anneau, anneau-integre, corps, sous-anneau]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Toute loi de composition interne associative admet un élément neutre.

    **2.** Dans un groupe, $(xy)^{-1} = y^{-1}x^{-1}$ pour tous $x$ et $y$.

    **3.** Dans un groupe, si $x^{2} = y^{2}$ et $x^{3} = y^{3}$, alors $x = y$.

    **4.** La réunion de deux sous-groupes d'un groupe est un sous-groupe.

    **5.** Un endomorphisme injectif d'un groupe fini est un automorphisme.

    **6.** Les groupes $(\mathbb{U}_{4}, \times)$ et $(\mathcal{P}(\{1, 2\}), \Delta)$ sont isomorphes.

    **7.** Dans un anneau, si $ab = 0$, alors $a = 0$ ou $b = 0$.

    **8.** Tout sous-anneau d'un corps est un anneau intègre.

    **9.** Le groupe des inversibles de $\mathbb{Z}[\mathrm{i}]$ est isomorphe au groupe des rotations du carré de l'introduction du cours.

    **10.** Dans un anneau intègre fini, tout élément non nul est inversible.
  corrige: |
    **1. Faux.** L'addition sur $\mathbb{N}^{*}$ est associative, sans élément neutre.

    **2. Vrai.** C'est le point (iii) de la proposition 2.

    **3. Vrai.** On a $x = x^{3}(x^{2})^{-1} = y^{3}(y^{2})^{-1} = y$.

    **4. Faux.** La réunion $2\mathbb{Z} \cup 3\mathbb{Z}$ contient $2$ et $3$, mais pas $5$ (cours, remarque qui suit la proposition 8 ; exercice 18).

    **5. Vrai.** Une application injective d'un ensemble fini dans lui-même est bijective (chapitre 2, théorème 2).

    **6. Faux.** Dans $\mathcal{P}(\{1, 2\})$, tout élément vérifie $x \,\Delta\, x = \varnothing$, alors que $\mathrm{i}^{2} \neq 1$ dans $\mathbb{U}_{4}$ (cours, section 11.3.7).

    **7. Faux.** Dans $\mathcal{F}(\mathbb{R}, \mathbb{R})$, les indicatrices de $\mathbb{R}_{+}$ et de $\mathbb{R}_{-}^{*}$ sont non nulles, de produit nul.

    **8. Vrai.** Un sous-anneau d'un corps est commutatif, non nul puisqu'il contient $1 \neq 0$, et sans diviseur de zéro, puisqu'un corps est intègre (proposition 15).

    **9. Vrai.** On a $\mathbb{Z}[\mathrm{i}]^{\times} = \mathbb{U}_{4}$ (cours), et $r_{k} \mapsto \mathrm{i}^{k}$ est un isomorphisme du groupe des rotations du carré sur $\mathbb{U}_{4}$.

    **10. Vrai.** C'est l'exercice 44. 
    $$\boxed{\text{vrais : } 2, 3, 5, 8, 9, 10 ; \qquad \text{faux : } 1, 4, 6, 7}$$
- id: "ma-11-47"
  feuille: "f-ma-11"
  numero: 47
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [élément neutre, morphismes, isomorphismes, ordre et groupes cycliques, théorème de Lagrange, groupes abéliens]
  noeuds: [a-monoide, a-morphisme, gf-cycliques, gs-lagrange, a-groupe]
  notions: [element-neutre, morphisme-groupes, isomorphisme, groupe-abelien]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    *Les groupes à quatre éléments.* Soit $G$ un groupe à quatre éléments, de neutre $e$. On utilise le théorème de Lagrange et la notion d'ordre de l'exercice 31.

    **1.** Quels sont les ordres possibles des éléments de $G$ ?

    **2.** On suppose que $G$ possède un élément $x$ d'ordre $4$. Montrer que $G = \{e, x, x^{2}, x^{3}\}$, puis que $G$ est isomorphe à $(\mathbb{U}_{4}, \times)$.

    **3.** On suppose que $G$ ne possède aucun élément d'ordre $4$. Montrer que $x^{2} = e$ pour tout $x \in G$, que $G$ est abélien, puis que $G = \{e, a, b, ab\}$ pour deux éléments $a$ et $b$ bien choisis. Dresser la table de $G$, et montrer que $G$ est isomorphe à $(\mathcal{P}(\{1, 2\}), \Delta)$.

    **4.** Conclure : combien y a-t-il de groupes à quatre éléments, à isomorphisme près ? Sont-ils tous abéliens ?

    **5.** Montrer de même que tout groupe ayant $2$, $3$ ou $5$ éléments est isomorphe à un $\mathbb{U}_{n}$. Quel est le plus petit nombre d'éléments d'un groupe non abélien ?
  corrige: |
    **1.** D'après l'exercice 31, l'ordre de tout élément divise $4$. 
    $$\boxed{\text{ordres possibles : } 1, 2, 4}$$

    **2.** Les éléments $e$, $x$, $x^{2}$, $x^{3}$ sont distincts (exercice 31, question 4), et $G$ en a quatre, donc $G = \{e, x, x^{2}, x^{3}\}$. Comme à la question 5 de l'exercice 31, $x^{k} \mapsto \mathrm{i}^{k}$ est bien défini, puisque $x^{k} = x^{\ell}$ si et seulement si $4$ divise $k - \ell$, et c'est un isomorphisme sur $\mathbb{U}_{4}$. 
    $$\boxed{G \simeq (\mathbb{U}_{4}, \times)}$$

    **3.** Tout élément différent de $e$ est alors d'ordre $2$, donc $x^{2} = e$ pour tout $x$, et $G$ est abélien (exercice 12). Soit $a \neq e$ et $b \notin \{e, a\}$. Le produit $ab$ n'est ni $e$, ce qui donnerait $b = a^{-1} = a$, ni $a$, ce qui donnerait $b = e$, ni $b$, ce qui donnerait $a = e$. Ainsi $G = \{e, a, b, ab\}$, et l'on obtient la table à l'aide de $a^{2} = b^{2} = e$ et $ab = ba$ :

    $$\begin{array}{|c||c|c|c|c|} \hline \cdot & e & a & b & ab \\ \hline \hline e & e & a & b & ab \\ \hline a & a & e & ab & b \\ \hline b & b & ab & e & a \\ \hline ab & ab & b & a & e \\ \hline \end{array}$$

    La bijection $e \mapsto \varnothing$, $a \mapsto \{1\}$, $b \mapsto \{2\}$, $ab \mapsto \{1, 2\}$ transporte cette table sur celle de la différence symétrique, puisque $\{1\} \,\Delta\, \{2\} = \{1, 2\}$. 
    $$\boxed{G \simeq (\mathcal{P}(\{1, 2\}), \Delta)}$$

    **4.** Les deux cas s'excluent, puisque les groupes $\mathbb{U}_{4}$ et $\mathcal{P}(\{1, 2\})$ ne sont pas isomorphes (cours, section 11.3.7). 
    $$\boxed{\text{deux groupes à quatre éléments, à isomorphisme près, tous deux abéliens}}$$

    **5.** Les nombres $2$, $3$ et $5$ sont premiers : un groupe ayant ce nombre d'éléments est isomorphe à $\mathbb{U}_{2}$, $\mathbb{U}_{3}$ ou $\mathbb{U}_{5}$ (exercice 31, question 5), donc abélien. Tout groupe d'au plus cinq éléments est ainsi abélien, et $\mathfrak{S}_{3}$, à six éléments, ne l'est pas. 
    $$\boxed{\text{le plus petit groupe non abélien a six éléments}}$$
- id: "ma-11-48"
  feuille: "f-ma-11"
  numero: 48
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe]
  page_enonce: 12
  page_corrige: 21
  enonce: |
    *Un point fixe commun.* On note $G$ le groupe des bijections affines $t \mapsto at + b$ de $\mathbb{R}$ dans $\mathbb{R}$, avec $a \neq 0$, étudié à l'exercice 10. Soit $\Gamma$ un sous-groupe de $G$ tel que tout élément de $\Gamma$ admette au moins un point fixe.

    **1.** Montrer qu'un élément de $\Gamma$ distinct de l'identité a un unique point fixe, et qu'il n'est pas une translation.

    **2.** Soit $f : t \mapsto at + b$ et $g : t \mapsto a't + b'$ deux éléments de $G$. Montrer que le coefficient de $t$ dans $f \circ g \circ f^{-1} \circ g^{-1}$ vaut $1$.

    **3.** En déduire que deux éléments quelconques de $\Gamma$ commutent.

    **4.** Soit $f$ et $g$ deux éléments de $\Gamma$ distincts de l'identité, et $\omega$ le point fixe de $f$. Montrer que $g(\omega)$ est un point fixe de $f$, et conclure que les éléments de $\Gamma$ ont un point fixe commun.
  corrige: |
    **1.** Un point fixe de $f : t \mapsto at + b$ vérifie $(1 - a)t = b$. Si $a = 1$ et $b \neq 0$, $f$ est une translation, sans point fixe : elle n'appartient pas à $\Gamma$. Un élément de $\Gamma$ avec $a = 1$ est donc l'identité. Si $a \neq 1$, le point fixe est unique, égal à $\frac{b}{1 - a}$. 
    $$\boxed{\text{tout élément de } \Gamma \setminus \{\mathrm{id}\} \text{ a un unique point fixe, et vérifie } a \neq 1}$$

    **2.** Le coefficient de $t$ dans une composée de fonctions affines est le produit des coefficients, et celui de $f^{-1}$ est $\frac{1}{a}$. Le coefficient de $f \circ g \circ f^{-1} \circ g^{-1}$ est donc $a \cdot a' \cdot \frac{1}{a} \cdot \frac{1}{a'} = 1$.

    **3.** Si $f$ et $g$ sont dans $\Gamma$, alors $c = f \circ g \circ f^{-1} \circ g^{-1}$ est dans $\Gamma$ et a pour coefficient $1$ : par la question 1, $c = \mathrm{id}$, c'est-à-dire $f \circ g = g \circ f$.

    **4.** On a $f(g(\omega)) = g(f(\omega)) = g(\omega)$ : $g(\omega)$ est un point fixe de $f$, donc $g(\omega) = \omega$ par unicité. Ainsi $\omega$ est fixé par tout élément de $\Gamma$, l'identité comprise. Si $\Gamma = \{\mathrm{id}\}$, tout point convient. 
    $$\boxed{\text{les éléments de } \Gamma \text{ ont un point fixe commun}}$$
     *À retenir.* L'hypothèse porte sur chaque élément séparément, la conclusion sur tous à la fois : c'est la structure de groupe, à travers le commutateur $f \circ g \circ f^{-1} \circ g^{-1}$, qui relie les deux.
- id: "ma-11-49"
  feuille: "f-ma-11"
  numero: 49
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Problème, Démonstration]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe]
  page_enonce: 12
  page_corrige: 21
  enonce: |
    *Les sous-groupes de $(\mathbb{R}, +)$.* Soit $H$ un sous-groupe de $(\mathbb{R}, +)$, non réduit à $\{0\}$.

    **1.** Montrer que $H \cap \,]0\,,+\infty[$ est non vide, et qu'il admet une borne inférieure $\alpha \geqslant 0$.

    **2.** On suppose $\alpha > 0$.

    **(a)** Montrer que $\alpha \in H$. On raisonnera par l'absurde, en trouvant deux éléments $g$ et $h$ de $H$ tels que $\alpha < h < g < 2\alpha$, puis en considérant $g - h$.

    **(b)** Soit $x \in H$. En introduisant $k = \lfloor x/\alpha \rfloor$, montrer que $x = k\alpha$. Conclure que $H = \alpha\mathbb{Z}$.

    **3.** On suppose $\alpha = 0$. Montrer que, pour tout $\varepsilon > 0$, $H$ contient un élément de $]0\,,\varepsilon[$, puis que $H$ rencontre tout intervalle ouvert non vide : $H$ est dense dans $\mathbb{R}$.

    **4.** Soit $a$ et $b$ deux réels non nuls. Montrer que $a\mathbb{Z} + b\mathbb{Z} = \{am + bn \mid (m, n) \in \mathbb{Z}^{2}\}$ est un sous-groupe de $\mathbb{R}$, et qu'il est dense dans $\mathbb{R}$ si et seulement si $\dfrac{a}{b}$ est irrationnel.

    **5.** On admet que $\pi$ est irrationnel. Montrer que $\mathbb{Z} + 2\pi\mathbb{Z}$ est dense dans $\mathbb{R}$, puis que l'ensemble $\{\cos n \mid n \in \mathbb{N}\}$ est dense dans $[-1\,,1]$.

    Le chapitre 12 utilisera le même raisonnement pour décrire les sous-groupes de $\mathbb{Z}$ : ce sont les $n\mathbb{Z}$, et l'on en tirera le PGCD.

    Les six derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin. Pour une partie finie $X$, on note $|X| = \mathrm{card}(X)$ son nombre d'éléments.
  corrige: |
    **1.** Soit $x \neq 0$ dans $H$ ; comme $-x \in H$, l'un des deux est strictement positif. La partie $H \cap \,]0\,,+\infty[$ est non vide et minorée par $0$ : elle a une borne inférieure $\alpha \geqslant 0$ (chapitre 7).

    **2.** *(a)* Supposons $\alpha \notin H$. Par la caractérisation de la borne inférieure, il existe $g \in H$ tel que $\alpha < g < 2\alpha$, puis, comme $\alpha < g$ et que $\alpha$ n'est pas atteint, $h \in H$ tel que $\alpha < h < g$. Alors $g - h \in H$ et $0 < g - h < g - \alpha < \alpha$, ce qui contredit la définition de $\alpha$. Ainsi $\alpha \in H$.

    *(b)* Soit $x \in H$ et $k = \lfloor x/\alpha \rfloor$. Alors $0 \leqslant x - k\alpha < \alpha$, et $x - k\alpha \in H$, puisque $k\alpha \in H$. Si $x - k\alpha > 0$, cela contredit la définition de $\alpha$ ; donc $x = k\alpha$. Réciproquement, $\alpha\mathbb{Z} \subset H$. 
    $$\boxed{\alpha > 0 \implies H = \alpha\mathbb{Z}}$$

    **3.** Si $\alpha = 0$, pour tout $\varepsilon > 0$, il existe $g \in H$ tel que $0 < g < \varepsilon$. Soit $]u, v[$ un intervalle ouvert non vide, et $g \in H$ tel que $0 < g < v - u$. Avec $k = \lfloor u/g \rfloor + 1$, on a $u < kg \leqslant u + g < v$, et $kg \in H$. 
    $$\boxed{\alpha = 0 \implies H \text{ est dense dans } \mathbb{R}}$$

    **4.** L'ensemble $a\mathbb{Z} + b\mathbb{Z}$ contient $0$ et la différence de deux de ses éléments : c'est un sous-groupe de $\mathbb{R}$, non réduit à $\{0\}$. S'il n'est pas dense, il est de la forme $\alpha\mathbb{Z}$ avec $\alpha > 0$, par les questions 2 et 3 ; alors $a = m\alpha$ et $b = n\alpha$, avec $n \neq 0$, et $\frac{a}{b} = \frac{m}{n}$ est rationnel. Réciproquement, si $\frac{a}{b} = \frac{p}{q}$ avec $q \in \mathbb{N}^{*}$, alors $a\mathbb{Z} + b\mathbb{Z} \subset \frac{b}{q}\mathbb{Z}$, qui ne rencontre pas $\big]0\,,\frac{|b|}{q}\big[$. 
    $$\boxed{a\mathbb{Z} + b\mathbb{Z} \text{ dense} \iff \frac{a}{b} \notin \mathbb{Q}}$$

    **5.** Le rapport $\frac{1}{2\pi}$ est irrationnel, donc $\mathbb{Z} + 2\pi\mathbb{Z}$ est dense. Soit $y \in [-1\,,1]$, $\theta = \operatorname{Arccos} y$ et $\varepsilon > 0$. Il existe $n$ et $m$ entiers tels que $|n + 2\pi m - \theta| < \varepsilon$, et, comme $\cos$ est $1$-lipschitzienne (chapitre 9), 
    $$|\cos |n| - y| = |\cos(n + 2\pi m) - \cos\theta| \leqslant |n + 2\pi m - \theta| < \varepsilon,$$
     où l'on a utilisé la parité et la $2\pi$-périodicité du cosinus. 
    $$\boxed{\{\cos n \mid n \in \mathbb{N}\} \text{ est dense dans } [-1\,,1]}$$
     *À retenir.* Un sous-groupe de $\mathbb{R}$ est « discret » ou dense, sans intermédiaire. Cette dichotomie explique l'exercice 21 : la somme de deux fonctions périodiques est périodique si et seulement si le groupe engendré par leurs périodes est discret.
- id: "ma-11-50"
  feuille: "f-ma-11"
  numero: 50
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    Soit $G$ un groupe qui possède un nombre fini de sous-groupes. Montrer que $G$ est fini.
  corrige: |
    Pour $x \in G$, on note $\langle x \rangle = \{x^{k} \mid k \in \mathbb{Z}\}$ le sous-groupe engendré par $x$ (exercice 20). On a $G = \bigcup_{x \in G} \langle x \rangle$, et cette réunion ne fait intervenir qu'un nombre fini de sous-groupes distincts. Il suffit donc de montrer que chacun est fini.

    $\triangleright$ *Les puissances de $x$ ne sont pas toutes distinctes.* Sinon, les sous-groupes $\langle x^{m} \rangle$, pour $m \geqslant 1$, seraient deux à deux distincts. En effet, si $1 \leqslant m < m'$ et $\langle x^{m} \rangle = \langle x^{m'} \rangle$, alors $x^{m} = x^{m'k}$ pour un entier $k$, avec $m'k \neq m$, puisque $m$ n'est pas multiple de $m' > m$ ; cela contredit l'hypothèse que les puissances sont distinctes. Le groupe aurait alors une infinité de sous-groupes.

    $\triangleright$ *Conclusion.* Il existe donc $i < j$ tels que $x^{i} = x^{j}$, et comme à l'exercice 31, $\langle x \rangle = \{e, x, \dots, x^{p-1}\}$, où $p$ est l'ordre de $x$ : chaque $\langle x \rangle$ est fini. Une réunion finie d'ensembles finis est finie (chapitre 2). 
    $$\boxed{G \text{ est fini}}$$
     *À retenir.* Le seul obstacle était un élément dont toutes les puissances sont distinctes : il engendre une copie de $(\mathbb{Z}, +)$, qui possède les sous-groupes $m\mathbb{Z}$ en nombre infini.
- id: "ma-11-51"
  feuille: "f-ma-11"
  numero: 51
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [groupes finis, principe des tiroirs]
  noeuds: [a-groupe]
  notions: [groupe]
  page_enonce: 12
  page_corrige: 22
  enonce: |
    Soit $A$ et $B$ deux parties d'un groupe fini $G$. On suppose $|A| + |B| > |G|$.

    **1.** Montrer que $G = \{ab \mid a \in A, \ b \in B\}$.

    **2.** Montrer que la question précédente devient fausse si on remplace, dans l'hypothèse, l'inégalité stricte par une inégalité large.
  corrige: |
    **1.** Soit $g \in G$, et $gB^{-1} = \{gb^{-1} \mid b \in B\}$. L'application $b \mapsto gb^{-1}$ est injective, donc $gB^{-1}$ a $|B|$ éléments. Les parties $A$ et $gB^{-1}$ de $G$ vérifient $|A| + |gB^{-1}| > |G|$ : elles ne sont pas disjointes, sinon leur réunion aurait plus d'éléments que $G$ (chapitre 2, lemme 4). Il existe donc $a \in A$ et $b \in B$ tels que $a = gb^{-1}$, soit $g = ab$. 
    $$\boxed{G = AB}$$

    **2.** Dans $G = \mathbb{U}_{2} = \{1, -1\}$, avec $A = B = \{1\}$, on a $|A| + |B| = 2 = |G|$, mais $AB = \{1\} \neq G$. Plus généralement, si $H$ est un sous-groupe de $G$ à $\frac{|G|}{2}$ éléments, $A = B = H$ donne $AB = H \neq G$.
- id: "ma-11-52"
  feuille: "f-ma-11"
  numero: 52
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [groupes abéliens]
  noeuds: [a-groupe]
  notions: [groupe-abelien]
  page_enonce: 13
  page_corrige: 22
  enonce: |
    Soit $G$ un groupe fini non abélien. On note $Z(G) = \{x \in G \mid \forall y \in G, \ xy = yx\}$ son centre.

    **1.** Montrer que $|G| \geqslant 4\,|Z(G)|$.

    **2.** Montrer que la probabilité pour deux éléments de $G$ de commuter est $\leqslant \dfrac{5}{8}$, c'est-à-dire que 
    $$\frac{\big|\{(x, y) \in G^{2} \mid xy = yx\}\big|}{|G|^{2}} \leqslant \frac{5}{8}.$$
  corrige: |
    On note $n = |G|$, $z = |Z(G)|$, et, pour $x \in G$, $C(x) = \{y \in G \mid xy = yx\}$, qui est un sous-groupe contenant $Z(G)$ et $x$, par le même calcul qu'à l'exercice 14.

    **1.** Comme $G$ n'est pas abélien, il existe $x \notin Z(G)$. Alors $C(x) \neq G$, puisque $x$ ne commute pas avec tout, et $C(x) \neq Z(G)$, puisque $x \in C(x)$. Par le théorème de Lagrange, appliqué à $Z(G) \subset C(x)$ puis à $C(x) \subset G$, $z$ divise $|C(x)|$ et $|C(x)|$ divise $n$, les inclusions étant strictes : $|C(x)| \geqslant 2z$ et $|C(x)| \leqslant \frac{n}{2}$. 
    $$\boxed{n \geqslant 4z}$$

    **2.** Le nombre de couples qui commutent est $\sum_{x \in G} |C(x)|$. Pour $x \in Z(G)$, $|C(x)| = n$ ; pour $x \notin Z(G)$, $|C(x)| \leqslant \frac{n}{2}$. Ainsi 
    $$\sum_{x \in G} |C(x)| \leqslant zn + (n - z)\frac{n}{2} = \frac{n^{2}}{2} + \frac{zn}{2} \leqslant \frac{n^{2}}{2} + \frac{n^{2}}{8} = \frac{5n^{2}}{8}.$$

    $$\boxed{\frac{\big|\{(x, y) \in G^{2} \mid xy = yx\}\big|}{|G|^{2}} \leqslant \frac{5}{8}}$$
     Pour $\mathfrak{S}_{3}$, on trouve $6 + 3 \times 2 + 2 \times 3 = 18$ couples, soit une proportion $\frac{18}{36} = \frac{1}{2}$. La borne est atteinte par le groupe des huit isométries du carré, dont le centre a deux éléments.
- id: "ma-11-53"
  feuille: "f-ma-11"
  numero: 53
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [sous-groupes]
  noeuds: [a-sous-groupe]
  notions: [sous-groupe]
  page_enonce: 13
  page_corrige: 23
  enonce: |
    Soit $H$ un sous-groupe strict d'un groupe fini $G$. On note, pour $x \in G$, $xHx^{-1} = \{xhx^{-1} \mid h \in H\}$.

    **1.** Montrer que la relation $\sim$ définie sur $G$ par 
    $$\forall (x_{1}, x_{2}) \in G^{2}, \qquad x_{1} \sim x_{2} \iff x_{1}Hx_{1}^{-1} = x_{2}Hx_{2}^{-1}$$
     est une relation d'équivalence, et que son nombre de classes est $\leqslant \dfrac{|G|}{|H|}$.

    **2.** En déduire $\displaystyle\bigcup_{x \in G} xHx^{-1} \neq G$.
  corrige: |
    **1.** La relation est définie par une égalité d'ensembles : elle est réflexive, symétrique et transitive. Pour $h \in H$, $hHh^{-1} = H$, puisque $H$ est un sous-groupe, d'où 
    $$(xh)H(xh)^{-1} = x\,(hHh^{-1})\,x^{-1} = xHx^{-1} :$$
     $x \sim xh$. Chaque classe de $\sim$ est donc une réunion de classes $xH$ de l'exercice 31, et il y a au plus autant de classes de $\sim$ que de classes $xH$, c'est-à-dire $\frac{|G|}{|H|}$. 
    $$\boxed{\text{nombre de classes} \leqslant \frac{|G|}{|H|}}$$

    **2.** La réunion des $xHx^{-1}$ ne dépend que de la classe de $x$ : c'est une réunion d'au plus $k = \frac{|G|}{|H|}$ ensembles. Chacun a $|H|$ éléments, l'application $h \mapsto xhx^{-1}$ étant injective, et tous contiennent $e$. Ainsi 
    $$\Big|\bigcup_{x \in G} xHx^{-1}\Big| \leqslant k(|H| - 1) + 1 = |G| - k + 1 < |G|,$$
     puisque $k \geqslant 2$, $H$ étant strict. 
    $$\boxed{\bigcup_{x \in G} xHx^{-1} \neq G}$$
- id: "ma-11-54"
  feuille: "f-ma-11"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [groupes abéliens, anneaux]
  noeuds: [a-groupe, a-anneau]
  notions: [groupe-abelien, anneau]
  page_enonce: 13
  page_corrige: 23
  enonce: |
    Soit $A$ un anneau tel que $\forall (x, y) \in A^{2}$, $xy = \pm yx$. Montrer que $A$ est commutatif.
  corrige: |
    Fixons $x \in A$, et posons $S = \{y \in A \mid xy = yx\}$ et $T = \{y \in A \mid xy = -yx\}$. Ce sont deux sous-groupes de $(A, +)$, qui contiennent $0$ et sont stables par différence, par distributivité. L'hypothèse dit que $A = S \cup T$. Par l'exercice 18, question 2, $S = A$ ou $T = A$.

    Si $T = A$, alors $y = 1$ donne $x = -x$, donc $x + x = 0$ ; pour tout $y$, $y(x + x) = 0$, soit $yx = -yx$, et $xy = -yx = yx$. Dans les deux cas, $x$ commute avec tout élément de $A$. 
    $$\boxed{A \text{ est commutatif}}$$
     *À retenir.* Le résultat de groupes « un groupe n'est pas réunion de deux sous-groupes stricts » transforme une alternative, valable pour chaque couple, en une propriété uniforme.
- id: "ma-11-55"
  feuille: "f-ma-11"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [isomorphismes, corps]
  noeuds: [a-morphisme, a-corps]
  notions: [isomorphisme, corps]
  page_enonce: 13
  page_corrige: 23
  enonce: |
    Soit $\mathbb{K}$ un corps. Montrer que les groupes $(\mathbb{K}, +)$ et $(\mathbb{K}^{*}, \cdot)$ ne sont pas isomorphes, où $\mathbb{K}^{*} = \mathbb{K} \setminus \{0\}$.
  corrige: |
    Supposons qu'il existe un isomorphisme $f : (\mathbb{K}, +) \to (\mathbb{K}^{*}, \cdot)$.

    $\triangleright$ *Si $1 \neq -1$.* L'élément $-1$ de $\mathbb{K}^{*}$ vérifie $(-1)^{2} = 1$ et $-1 \neq 1$. Son antécédent $a$ est non nul et vérifie $f(a + a) = (-1)^{2} = 1 = f(0)$, donc $a + a = 0$ par injectivité. Alors $(1 + 1)a = 0$ avec $a \neq 0$, d'où $1 + 1 = 0$, soit $1 = -1$ : contradiction.

    $\triangleright$ *Si $1 = -1$.* Alors $x + x = 0$ pour tout $x$, donc tout $y = f(x)$ de $\mathbb{K}^{*}$ vérifie $y^{2} = f(x + x) = 1$. Ainsi $(y - 1)^{2} = y^{2} - 2y + 1 = y^{2} + 1 = 0$, et $y = 1$. Le groupe $\mathbb{K}^{*}$ serait réduit à $\{1\}$, donc $\mathbb{K} = \{0, 1\}$ aurait deux éléments, et $f$ ne pourrait pas être une bijection. 
    $$\boxed{(\mathbb{K}, +) \text{ et } (\mathbb{K}^{*}, \cdot) \text{ ne sont jamais isomorphes}}$$
     On retrouve, pour $\mathbb{K} = \mathbb{R}$, la question (a) de l'exercice 27, et le corps à deux éléments de l'exercice 43 montre que les corps où $1 = -1$ existent bien : le second cas n'est pas vide, il faut le traiter à part.

