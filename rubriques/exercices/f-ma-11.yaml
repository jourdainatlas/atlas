  page_enonce: 7
  page_corrige: 11
  enonce: |
    *Le théorème de Cayley.* Soit $G$ un groupe. Pour $g \in G$, on note $\sigma_{g} : G \to G$ l'application $x \mapsto gx$.

    **1.** Montrer que $\sigma_{g}$ est une permutation de $G$, et que $\sigma_{g} \circ \sigma_{h} = \sigma_{gh}$.

    **2.** En déduire que $g \mapsto \sigma_{g}$ est un morphisme injectif de $G$ dans $\mathfrak{S}_{G}$, puis que $G$ est isomorphe à un sous-groupe d'un groupe de permutations.

    **3.** Expliciter les trois permutations $\sigma_{g}$ lorsque $G = \mathbb{U}_{3}$, en notant $j = \mathrm{e}^{2\mathrm{i}\pi/3}$.

    Ce théorème, dû à Cayley en 1854, justifie que les groupes de permutations de Lagrange et de Galois contiennent, à isomorphisme près, tous les groupes.
  corrige: |
    **1.** L'application $\sigma_{g}$ est bijective, de réciproque $\sigma_{g^{-1}}$ (proposition 3). Pour tout $x \in G$, on a $\sigma_{g}(\sigma_{h}(x)) = ghx = \sigma_{gh}(x)$.

    **2.** La relation $\sigma_{gh} = \sigma_{g} \circ \sigma_{h}$ dit que $g \mapsto \sigma_{g}$ est un morphisme de $G$ dans $\mathfrak{S}_{G}$. Si $\sigma_{g} = \mathrm{id}_{G}$, alors $g = \sigma_{g}(e) = e$ : le noyau est trivial, et le morphisme est injectif (théorème 2). Il induit donc un isomorphisme de $G$ sur son image, qui est un sous-groupe de $\mathfrak{S}_{G}$ (proposition 12). 
    $$\boxed{G \text{ est isomorphe à un sous-groupe de } \mathfrak{S}_{G}}$$

    **3.** Avec $\mathbb{U}_{3} = \{1, j, j^{2}\}$, on a $\sigma_{1} = \mathrm{id}$, puis 
    $$\boxed{\sigma_{j} : 1 \mapsto j, \ j \mapsto j^{2}, \ j^{2} \mapsto 1 ; \qquad \sigma_{j^{2}} : 1 \mapsto j^{2}, \ j \mapsto 1, \ j^{2} \mapsto j}$$
     Ce sont les deux permutations circulaires des trois points : $\mathbb{U}_{3}$ s'identifie aux rotations du triangle équilatéral de sommets $1$, $j$, $j^{2}$.
- id: "ma-11-31"
  feuille: "f-ma-11"
  numero: 31
  partie: "Groupes"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes, isomorphismes, théorème de Lagrange]
  noeuds: [a-groupe, a-sous-groupe, a-morphisme, gs-lagrange]
  notions: [groupe, sous-groupe, isomorphisme]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    *Le théorème de Lagrange.* Soit $G$ un groupe fini et $H$ un sous-groupe de $G$. On note $\mathrm{card}$ le nombre d'éléments, comme au chapitre 2.

    **1.** On définit sur $G$ la relation $x \sim y$ si et seulement si $x^{-1}y \in H$. Montrer que c'est une relation d'équivalence, et que la classe de $x$ est $xH = \{xh \mid h \in H\}$.

    **2.** Montrer que chaque classe a $\mathrm{card}(H)$ éléments. À l'aide du lemme des bergers du chapitre 2, en déduire que $\mathrm{card}(H)$ divise $\mathrm{card}(G)$.

    **3.** Soit $x \in G$. Montrer, à l'aide du principe des tiroirs, qu'il existe deux entiers $0 \leqslant i < j$ tels que $x^{i} = x^{j}$, puis qu'il existe un plus petit entier $p \geqslant 1$ tel que $x^{p} = e$. Cet entier est appelé l'*ordre* de $x$.

    **4.** Montrer que $\{e, x, \dots, x^{p-1}\}$ est un sous-groupe de $G$ à $p$ éléments. En déduire que $p$ divise $\mathrm{card}(G)$, puis que $x^{\mathrm{card}(G)} = e$.

    **5.** Soit $G$ un groupe dont le nombre d'éléments est un nombre premier $q$. Montrer que $G$ est isomorphe à $(\mathbb{U}_{q}, \times)$.
  corrige: |
    **1.** On a $x^{-1}x = e \in H$ : la relation est réflexive. Si $x^{-1}y \in H$, son inverse $y^{-1}x$ y est aussi : elle est symétrique. Si $x^{-1}y$ et $y^{-1}z$ sont dans $H$, leur produit $x^{-1}z$ aussi : elle est transitive. Enfin $y \sim x$, c'est-à-dire $x^{-1}y = h \in H$, équivaut à $y = xh$. 
    $$\boxed{\text{la classe de } x \text{ est } xH = \{xh \mid h \in H\}}$$

    **2.** L'application $h \mapsto xh$ est une bijection de $H$ sur $xH$, injective par simplification (proposition 3) : chaque classe a $\mathrm{card}(H)$ éléments. Soit $\mathcal{C}$ l'ensemble des classes, qui est fini, et $\pi : G \to \mathcal{C}$ l'application qui à $x$ associe sa classe. La fibre de $\pi$ au-dessus d'une classe est cette classe elle-même, qui a $\mathrm{card}(H)$ éléments ; le lemme des bergers (chapitre 2, lemme 5) donne 
    $$\boxed{\mathrm{card}(G) = \mathrm{card}(\mathcal{C}) \times \mathrm{card}(H)}$$
     et $\mathrm{card}(H)$ divise $\mathrm{card}(G)$.

    **3.** Les éléments $x^{0}, x^{1}, \dots, x^{n}$, où $n = \mathrm{card}(G)$, sont $n + 1$ éléments de $G$ : par le principe des tiroirs (chapitre 2, lemme 1), deux d'entre eux sont égaux, $x^{i} = x^{j}$ avec $i < j$. Alors $x^{j - i} = e$ avec $j - i \geqslant 1$, et l'ensemble des entiers $k \geqslant 1$ tels que $x^{k} = e$ est une partie non vide de $\mathbb{N}$ : elle a un plus petit élément $p$.

    **4.** Soit $K = \{e, x, \dots, x^{p-1}\}$. Pour $k \in \mathbb{Z}$, la division euclidienne $k = qp + r$, avec $0 \leqslant r < p$, donne $x^{k} = (x^{p})^{q}x^{r} = x^{r} \in K$. Ainsi $K$ est l'ensemble des $x^{k}$, $k \in \mathbb{Z}$, qui est stable par produit et par inverse : c'est un sous-groupe. Ses éléments sont distincts : si $x^{i} = x^{j}$ avec $0 \leqslant i < j < p$, alors $x^{j - i} = e$ avec $0 < j - i < p$, ce qui contredit la minimalité de $p$. Par la question 2, $p$ divise $n = \mathrm{card}(G)$, et $x^{n} = (x^{p})^{n/p} = e$. 
    $$\boxed{p \mid \mathrm{card}(G), \qquad x^{\mathrm{card}(G)} = e}$$

    **5.** Soit $x \neq e$ dans $G$. Son ordre $p$ divise $q$ et n'est pas $1$, donc $p = q$, et $G = \{e, x, \dots, x^{q-1}\}$. L'application $f : x^{k} \mapsto \mathrm{e}^{2\mathrm{i} k\pi/q}$ est bien définie, puisque $x^{k} = x^{\ell}$ si et seulement si $q$ divise $k - \ell$ ; c'est un morphisme, car $x^{k}x^{\ell} = x^{k + \ell}$ et $\mathrm{e}^{2\mathrm{i} k\pi/q}\mathrm{e}^{2\mathrm{i}\ell\pi/q} = \mathrm{e}^{2\mathrm{i}(k + \ell)\pi/q}$, et elle est bijective de $G$ sur $\mathbb{U}_{q}$ (chapitre 4). 
    $$\boxed{G \simeq (\mathbb{U}_{q}, \times)}$$
     *À retenir.* Ce résultat, qui porte le nom de Lagrange bien qu'il ne l'ait pas énoncé sous cette forme, est le premier théorème de structure des groupes finis : le cardinal d'un groupe contraint fortement ses sous-groupes.
- id: "ma-11-32"
  feuille: "f-ma-11"
  numero: 32
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
