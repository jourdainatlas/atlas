  page_enonce: 6
  page_corrige: 9
  enonce: |
    Soit $G$ un groupe. Montrer que l'application $x \mapsto x^{2}$ est un endomorphisme de $G$ si et seulement si $G$ est abélien. Même question pour $x \mapsto x^{-1}$.
  corrige: |
    L'application $x \mapsto x^{2}$ est un morphisme si et seulement si $(xy)^{2} = x^{2}y^{2}$ pour tous $x$ et $y$, c'est-à-dire, d'après la remarque qui suit la proposition 4, si et seulement si $xy = yx$ pour tous $x$, $y$. De même, $x \mapsto x^{-1}$ est un morphisme si et seulement si $(xy)^{-1} = x^{-1}y^{-1}$, soit $y^{-1}x^{-1} = x^{-1}y^{-1}$ pour tous $x$, $y$ ; en passant à l'inverse, c'est $xy = yx$. 
    $$\boxed{x \mapsto x^{2} \text{ et } x \mapsto x^{-1} \text{ sont des morphismes si et seulement si } G \text{ est abélien}}$$
     *À retenir.* Dans un groupe abélien, $x \mapsto x^{-1}$ est même un automorphisme, puisqu'il est sa propre réciproque.
- id: "ma-11-24"
  feuille: "f-ma-11"
  numero: 24
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [groupes, morphismes, noyau]
  noeuds: [a-groupe, a-morphisme]
  notions: [groupe, morphisme-groupes, noyau]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    *L'exponentielle complexe.*

    **1.** Justifier que $\exp$ est un morphisme de $(\mathbb{C}, +)$ dans $(\mathbb{C}^{*}, \times)$, et déterminer son image et son noyau.

    **2.** Soit $a \in \mathbb{C}^{*}$ et $z_{0}$ une solution de l'équation $\mathrm{e}^{z} = a$. À l'aide du théorème 2 du cours, décrire l'ensemble de toutes les solutions. Résoudre ainsi $\mathrm{e}^{z} = -2$.
  corrige: |
    **1.** D'après le chapitre 4, $\mathrm{e}^{z + w} = \mathrm{e}^{z}\mathrm{e}^{w}$ et $\mathrm{e}^{z} \neq 0$ : $\exp$ est un morphisme de $(\mathbb{C}, +)$ dans $(\mathbb{C}^{*}, \times)$. Tout $a \in \mathbb{C}^{*}$ s'écrit $a = r\mathrm{e}^{\mathrm{i}\theta}$ avec $r > 0$, et $a = \mathrm{e}^{\ln r + \mathrm{i}\theta}$ : le morphisme est surjectif. Enfin $\mathrm{e}^{x + \mathrm{i} y} = 1$ si et seulement si $\mathrm{e}^{x} = 1$ et $\mathrm{e}^{\mathrm{i} y} = 1$, soit $x = 0$ et $y \in 2\pi\mathbb{Z}$. 
    $$\boxed{\operatorname{Im} \exp = \mathbb{C}^{*}, \qquad \mathrm{Ker}\, \exp = 2\mathrm{i}\pi\mathbb{Z}}$$

    **2.** D'après le point (i) du théorème 2, écrit en notation additive au départ, $\mathrm{e}^{z} = \mathrm{e}^{z_{0}}$ si et seulement si $z - z_{0} \in \mathrm{Ker}\, \exp$. Pour $a = -2 = 2\mathrm{e}^{\mathrm{i}\pi}$, on peut prendre $z_{0} = \ln 2 + \mathrm{i}\pi$. 
    $$\boxed{\{z \in \mathbb{C} \mid \mathrm{e}^{z} = a\} = z_{0} + 2\mathrm{i}\pi\mathbb{Z}, \qquad \mathrm{e}^{z} = -2 \iff z \in \ln 2 + \mathrm{i}\pi + 2\mathrm{i}\pi\mathbb{Z}}$$
- id: "ma-11-25"
  feuille: "f-ma-11"
  numero: 25
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, morphismes]
  noeuds: [a-groupe, a-morphisme]
  notions: [groupe, morphisme-groupes]
  page_enonce: 6
  page_corrige: 9
  enonce: |
    *Morphismes de source $\mathbb{Z}$ ou $\mathbb{Q}$.*

    **1.** Soit $G$ un groupe et $f$ un morphisme de $(\mathbb{Z}, +)$ dans $G$. Montrer que $f(n) = f(1)^{n}$ pour tout $n \in \mathbb{Z}$. Réciproquement, montrer que, pour tout $x \in G$, il existe un unique morphisme $f$ de $(\mathbb{Z}, +)$ dans $G$ tel que $f(1) = x$.

    **2.** Déterminer tous les endomorphismes du groupe $(\mathbb{Z}, +)$. Lesquels sont injectifs ? surjectifs ?

    **3.** Soit $f$ un morphisme de $(\mathbb{Q}, +)$ dans $(\mathbb{Z}, +)$, et $x \in \mathbb{Q}$. Montrer que $f(x)$ est divisible par $2^{m}$ pour tout $m \in \mathbb{N}$, et en déduire que $f$ est nul.
  corrige: |
    **1.** D'après la proposition 10, $f(n \cdot 1) = f(1)^{n}$ pour tout $n \in \mathbb{Z}$, car $n = n \cdot 1$ dans $(\mathbb{Z}, +)$. Ainsi $f$ est déterminé par $f(1)$, d'où l'unicité. Réciproquement, $n \mapsto x^{n}$ est un morphisme d'après la proposition 4, et il envoie $1$ sur $x$. 
    $$\boxed{\text{les morphismes de } (\mathbb{Z}, +) \text{ dans } G \text{ sont les } n \mapsto x^{n}, \ x \in G}$$

    **2.** En notation additive, les endomorphismes de $\mathbb{Z}$ sont les $n \mapsto kn$, avec $k \in \mathbb{Z}$. Un tel endomorphisme est injectif si et seulement si $k \neq 0$, puisque son noyau est $\{0\}$ si $k \neq 0$ et $\mathbb{Z}$ si $k = 0$. Il est surjectif si et seulement si $1$ est atteint, c'est-à-dire $kn = 1$ pour un entier $n$, soit $k = \pm 1$. 
    $$\boxed{\text{endomorphismes } n \mapsto kn ; \ \text{injectifs si } k \neq 0 ; \ \text{surjectifs si } k = \pm 1}$$

    **3.** Pour $m \in \mathbb{N}$, on a $x = 2^{m} \cdot \frac{x}{2^{m}}$ dans $(\mathbb{Q}, +)$, donc $f(x) = 2^{m} f\big(\frac{x}{2^{m}}\big)$ par la proposition 10 : l'entier $f(x)$ est divisible par $2^{m}$. Si $f(x) \neq 0$, on aurait $2^{m} \leqslant |f(x)|$ pour tout $m$, ce qui est absurde. 
    $$\boxed{\text{le seul morphisme de } (\mathbb{Q}, +) \text{ dans } (\mathbb{Z}, +) \text{ est le morphisme nul}}$$
     *À retenir.* Tout rationnel est « divisible » par tout entier dans $\mathbb{Q}$, alors qu'aucun entier non nul n'est divisible par toutes les puissances de $2$ : un morphisme transporte la divisibilité, d'où l'obstruction.
- id: "ma-11-26"
  feuille: "f-ma-11"
  numero: 26
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, sous-groupes, groupe symétrique, morphismes, noyau, groupes abéliens]
  noeuds: [a-groupe, a-sous-groupe, v-det, a-morphisme]
  notions: [groupe, sous-groupe, groupe-symetrique, morphisme-groupes, noyau, groupe-abelien]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    *Automorphismes intérieurs.* Soit $G$ un groupe. Pour $a \in G$, on note $\tau_{a} : G \to G$ l'application $x \mapsto axa^{-1}$.

    **1.** Montrer que $\tau_{a}$ est un automorphisme de $G$, et que $\tau_{a} \circ \tau_{b} = \tau_{ab}$ pour tous $a$, $b$ de $G$.

    **2.** En déduire que $\Phi : a \mapsto \tau_{a}$ est un morphisme de $G$ dans le groupe $\mathfrak{S}_{G}$ des permutations de $G$, et que son image est un sous-groupe de $\mathfrak{S}_{G}$.

    **3.** Montrer que le noyau de $\Phi$ est le centre $Z(G)$ défini à l'exercice 14. Le morphisme $\Phi$ est-il injectif lorsque $G = \mathfrak{S}_{3}$ ? lorsque $G$ est abélien ?
  corrige: |
    **1.** Pour $x$ et $y$ dans $G$, 
    $$\tau_{a}(xy) = axya^{-1} = (axa^{-1})(aya^{-1}) = \tau_{a}(x)\tau_{a}(y), \qquad \tau_{a}(\tau_{b}(x)) = abxb^{-1}a^{-1} = (ab)x(ab)^{-1} = \tau_{ab}(x).$$
     Comme $\tau_{e} = \mathrm{id}_{G}$, on a $\tau_{a} \circ \tau_{a^{-1}} = \tau_{a^{-1}} \circ \tau_{a} = \mathrm{id}_{G}$ : $\tau_{a}$ est bijectif. 
    $$\boxed{\tau_{a} \text{ est un automorphisme}, \qquad \tau_{a} \circ \tau_{b} = \tau_{ab}}$$

    **2.** La relation $\tau_{ab} = \tau_{a} \circ \tau_{b}$ dit exactement que $\Phi$ est un morphisme de $G$ dans $(\mathfrak{S}_{G}, \circ)$. Son image est un sous-groupe par la proposition 12.

    **3.** On a $\tau_{a} = \mathrm{id}_{G}$ si et seulement si $axa^{-1} = x$, soit $ax = xa$, pour tout $x$, c'est-à-dire si et seulement si $a \in Z(G)$. 
    $$\boxed{\mathrm{Ker}\, \Phi = Z(G)}$$
     Pour $G = \mathfrak{S}_{3}$, le centre est réduit à l'identité (exercice 14), donc $\Phi$ est injectif. Pour $G$ abélien, $Z(G) = G$ et $\Phi$ est constant, égal à $\mathrm{id}_{G}$ : il n'est injectif que si $G = \{e\}$.
- id: "ma-11-27"
  feuille: "f-ma-11"
  numero: 27
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, lois de composition, morphismes, isomorphismes]
  noeuds: [a-groupe, a-loi, a-morphisme]
  notions: [groupe, loi-composition, morphisme-groupes, isomorphisme]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    *Groupes non isomorphes.* Un isomorphisme transporte toute propriété exprimée à l'aide de la seule loi. En exploitant à chaque fois une telle propriété, montrer que les groupes suivants ne sont pas isomorphes.

    **(a)** $(\mathbb{R}, +)$ et $(\mathbb{R}^{*}, \times)$. On cherchera les éléments $x$ tels que $x^{2} = e$.

    **(b)** $(\mathbb{R}^{*}, \times)$ et $(\mathbb{C}^{*}, \times)$. On cherchera les éléments $x$ tels que $x^{4} = e$.

    **(c)** $(\mathbb{Q}, +)$ et $(\mathbb{Q}_{+}^{*}, \times)$. On cherchera les éléments qui sont le double d'un autre.

    **(d)** $(\mathbb{R}^{*}, \times)$ et $(\mathbb{Q}^{*}, \times)$.
  corrige: |
    Si $f : G \to G'$ est un isomorphisme et si $x^{k} = e$, alors $f(x)^{k} = e'$, et réciproquement par $f^{-1}$ : l'isomorphisme réalise une bijection entre les solutions de $x^{k} = e$ dans $G$ et dans $G'$. Le même argument vaut pour toute propriété exprimée par la seule loi.

    **(a)** Dans $(\mathbb{R}, +)$, l'équation $x + x = 0$ n'a que la solution $0$ ; dans $(\mathbb{R}^{*}, \times)$, l'équation $x^{2} = 1$ en a deux, $1$ et $-1$.

    **(b)** Dans $\mathbb{R}^{*}$, $x^{4} = 1$ a deux solutions, $\pm 1$ ; dans $\mathbb{C}^{*}$, elle en a quatre, les éléments de $\mathbb{U}_{4}$.

    **(c)** Dans $(\mathbb{Q}, +)$, tout élément est le double d'un autre : $x = \frac{x}{2} + \frac{x}{2}$. Dans $(\mathbb{Q}_{+}^{*}, \times)$, cela s'écrirait : tout élément est un carré. Or $2$ n'est pas le carré d'un rationnel, puisque $\sqrt{2}$ est irrationnel (chapitre 7).

    **(d)** Supposons $f : \mathbb{R}^{*} \to \mathbb{Q}^{*}$ un isomorphisme. Le seul élément d'ordre $2$ de chaque groupe est $-1$, donc $f(-1) = -1$. Tout réel non nul s'écrit $x = \pm y^{2}$, donc $f(x) = f(\pm 1)f(y)^{2} = \pm f(y)^{2}$ : tout élément de $\mathbb{Q}^{*}$ serait, au signe près, un carré de $\mathbb{Q}^{*}$. Or $2$ ne l'est pas. 
    $$\boxed{\text{aucun des quatre couples n'est formé de groupes isomorphes}}$$
     *Piège.* Pour montrer que deux groupes ne sont pas isomorphes, il ne suffit pas de constater qu'un isomorphisme particulier échoue : il faut trouver une propriété, exprimée avec la seule loi, que l'un possède et pas l'autre.
- id: "ma-11-28"
  feuille: "f-ma-11"
  numero: 28
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, morphismes, isomorphismes]
  noeuds: [a-groupe, a-morphisme]
  notions: [groupe, morphisme-groupes, isomorphisme]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Montrer que l'application $z \mapsto \Big(\dfrac{z}{|z|}, |z|\Big)$ est un isomorphisme du groupe $(\mathbb{C}^{*}, \times)$ sur le groupe produit $\mathbb{U} \times \mathbb{R}_{+}^{*}$. En déduire que $(\mathbb{C}^{*}, \times)$ est isomorphe au groupe produit $\mathbb{U} \times \mathbb{R}$, où $\mathbb{R}$ est muni de l'addition. Quelle écriture des nombres complexes non nuls cet isomorphisme traduit-il ?
  corrige: |
    Pour $z \in \mathbb{C}^{*}$, on pose $f(z) = \big(\frac{z}{|z|}, |z|\big)$, qui appartient à $\mathbb{U} \times \mathbb{R}_{+}^{*}$. Comme le module est multiplicatif, 
    $$f(zw) = \Big(\frac{z}{|z|} \cdot \frac{w}{|w|}, \ |z|\,|w|\Big) = f(z) f(w)$$
     pour la loi du groupe produit (proposition 6). L'application $(u, r) \mapsto ru$ est la réciproque de $f$, puisque $\frac{ru}{|ru|} = u$ et $|ru| = r$. Ainsi $f$ est un isomorphisme. L'exponentielle est un isomorphisme de $(\mathbb{R}, +)$ sur $(\mathbb{R}_{+}^{*}, \times)$ ; en le combinant avec l'identité de $\mathbb{U}$, on obtient un isomorphisme de $\mathbb{U} \times \mathbb{R}$ sur $\mathbb{U} \times \mathbb{R}_{+}^{*}$, et par composition (proposition 11), 
    $$\boxed{(\mathbb{C}^{*}, \times) \simeq \mathbb{U} \times \mathbb{R}_{+}^{*} \simeq \mathbb{U} \times (\mathbb{R}, +), \qquad z = |z|\,\frac{z}{|z|} = \mathrm{e}^{\ln|z|}\mathrm{e}^{\mathrm{i}\theta}}$$
     C'est l'écriture trigonométrique $z = r\mathrm{e}^{\mathrm{i}\theta}$ du chapitre 4 : le produit de deux nombres complexes multiplie les modules et ajoute les arguments.
- id: "ma-11-29"
  feuille: "f-ma-11"
  numero: 29
  partie: "Groupes"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [groupes, morphismes]
  noeuds: [a-groupe, a-morphisme]
  notions: [groupe, morphisme-groupes]
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Soit $G$ un groupe fini et $f$ un morphisme de $G$ dans $(\mathbb{C}^{*}, \times)$ qui n'est pas constant. On pose $S = \displaystyle\sum_{x \in G} f(x)$.

    **1.** Soit $a \in G$ tel que $f(a) \neq 1$. Montrer que $x \mapsto ax$ est une bijection de $G$ sur $G$, et en déduire que $f(a)S = S$. Conclure que $S = 0$.

    **2.** Retrouver ainsi le résultat du chapitre 4 : pour $n \geqslant 2$ et $k \in \mathbb{Z}$ non multiple de $n$, la somme des $z^{k}$, pour $z \in \mathbb{U}_{n}$, est nulle.
  corrige: |
    **1.** Comme $f$ n'est pas constant et que $f(e) = 1$, il existe $a$ tel que $f(a) \neq 1$. L'application $x \mapsto ax$ est une bijection de $G$, de réciproque $x \mapsto a^{-1}x$ (proposition 3). Ainsi, quand $x$ décrit $G$, $ax$ décrit $G$, et 
    $$f(a) S = \sum_{x \in G} f(a)f(x) = \sum_{x \in G} f(ax) = \sum_{y \in G} f(y) = S.$$
     Comme $f(a) \neq 1$, on en déduit $S = 0$. $\boxed{S = 0}$

    **2.** On applique ce résultat à $G = \mathbb{U}_{n}$ et $f : z \mapsto z^{k}$, morphisme de $\mathbb{U}_{n}$ dans $\mathbb{C}^{*}$. Il n'est pas constant, puisque $f(\mathrm{e}^{2\mathrm{i}\pi/n}) = \mathrm{e}^{2\mathrm{i} k\pi/n} \neq 1$ lorsque $n$ ne divise pas $k$. 
    $$\boxed{\sum_{z \in \mathbb{U}_{n}} z^{k} = 0 \quad \text{si } n \nmid k}$$
     Si $n$ divise $k$, la somme vaut $n$, puisque chaque terme vaut $1$.
- id: "ma-11-30"
  feuille: "f-ma-11"
  numero: 30
