  page_enonce: 6
  page_corrige: 10
  enonce: |
    Une grenouille part du point $Z_{0} = (-25, 0)$ du plan ; à chaque étape, $Z_{n + 1} = Z_{n} + (1, 0) + U_{n}$, où les $U_{n}$ sont indépendantes, avec $\mathbb{P}(U_{n} = (0, \frac{1}{\sqrt{2}})) = \mathbb{P}(U_{n} = (0, -\frac{1}{\sqrt{2}})) = \frac{1}{2}$. Une autoroute suit l'axe des ordonnées ; des tunnels permettent de la franchir entre les ordonnées $-x$ et $x$, et la grenouille survit si elle y arrive.

    **1.** À quel instant atteint-elle l'autoroute ? Quelle est la loi de son ordonnée $Y$ à cet instant ?

    **2.** Pour $x = 5$, donner une approximation de la probabilité de survie. Déterminer $x$ pour que cette probabilité vaille environ $0{,}9$.

    **3.** Calculer la probabilité exacte de survie pour $x = 5$, et expliquer l'écart avec la question 2. Quelle approximation tient compte du fait que $Y$ ne prend que les valeurs $\frac{k}{\sqrt{2}}$, $k$ impair ? Peut-on obtenir une probabilité de survie exactement égale à $0{,}9$ ?
  corrige: |
    **1.** L'abscisse vaut $-25 + n$ à l'instant $n$ : la grenouille atteint l'autoroute à l'instant $\boxed{n = 25}$. Son ordonnée est $Y = \frac{1}{\sqrt{2}}\sum_{i = 1}^{25}\varepsilon_{i}$, avec des $\varepsilon_{i} = \pm 1$ indépendants et équiprobables : $\boxed{Y = \frac{2B - 25}{\sqrt{2}}}$, où $B \sim \mathcal{B}(25, \frac{1}{2})$. Ainsi $\mathbb{E}[Y] = 0$ et $\operatorname{Var}(Y) = \frac{25}{2}$, d'écart type $3{,}54$.

    **2.** Par le th. 3, $\mathbb{P}(|Y| \leqslant 5) \approx 2\Phi\big(\frac{5}{3{,}54}\big) - 1 = 2\Phi(1{,}41) - 1 \approx \boxed{0{,}84}$ (avec $\Phi(1{,}41) \approx 0{,}921$). La probabilité de survie vaut environ $0{,}9$ si $\frac{x}{3{,}54} = 1{,}645$, soit $\boxed{x \approx 5{,}8}$.

    **3.** $|Y| \leqslant 5$ équivaut à $|2B - 25| \leqslant 5\sqrt{2} \approx 7{,}07$, soit $9 \leqslant B \leqslant 16$, de probabilité exacte $\boxed{0{,}892}$. L'écart vient de ce que $Y$ ne prend que les valeurs $\frac{k}{\sqrt{2}}$, $k$ impair, espacées de $\sqrt{2} \approx 1{,}41$ : l'intervalle $[-5, 5]$ contient les valeurs $\pm\frac{7}{\sqrt{2}} \approx \pm 4{,}95$, et la suivante est $\frac{9}{\sqrt{2}} \approx 6{,}36$. Il capte donc toute la masse jusqu'au milieu $\frac{8}{\sqrt{2}} \approx 5{,}66$, et la *correction de continuité* remplace $5$ par $5{,}66$ : $2\Phi(1{,}60) - 1 \approx 0{,}890$, très proche de la valeur exacte.

    La probabilité exacte de survie, fonction en escalier de $x$, vaut $0{,}892$ pour $4{,}95 \leqslant x < 6{,}36$ puis $0{,}957$ : elle ne prend 
    $$\boxed{\text{jamais la valeur } 0{,}9}.$$
     Le plus petit $x$ qui assure au moins $0{,}9$ est $\frac{9}{\sqrt{2}} \approx 6{,}36$ ; la valeur $5{,}8$ de la question 2 ne donne en réalité que $0{,}892$.

    1.5em

    ![Figure](documents/figures/f1e909b12e8e0ed5.svg)

    La loi de l'ordonnée $Y$ : chaque valeur $\frac{k}{\sqrt{2}}$ porte une barre d'aire égale à sa probabilité, en bleu foncé si elle est dans la zone des tunnels $[-5, 5]$ (en vert). La densité de $\mathcal{N}(0, \frac{25}{2})$ (en orange) épouse l'histogramme, mais son aire entre $-5$ et $5$ ($0{,}84$) laisse de côté les demi-barres extrêmes, que la correction de continuité récupère.
- id: "l3-pr-09-16"
  feuille: "f-l3-pr-09"
  numero: 16
  partie: "Théorème central limite : calculs"
  etoiles: 2
  types: [Calcul]
