  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercice 3.12 (2)-(fin)"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    *(Paradoxe de Saint-Pétersbourg, suite de la feuille 3.)* Les gains $X_{k}$ de parties successives sont indépendants, avec $\mathbb{P}(X_{k} = 2^{j}) = 2^{-j}$ pour $j \in \mathbb{N}^{*}$, et $S_{n} = X_{1} + \dots + X_{n}$.

    **1.** Que dit le chapitre 8 (feuille d'exercices, exercice 6) du comportement de $\frac{S_{n}}{n}$ ?

    **2.** Pour $n \geqslant 2$, on pose $N = n\log_{2}n$, $X_{k}' = X_{k}\mathbf{1}_{\{X_{k} \leqslant N\}}$ et $S_{n}' = X_{1}' + \dots + X_{n}'$. Montrer que $\mathbb{E}[S_{n}'] \sim n\log_{2}n$, que $\operatorname{Var}(S_{n}') \leqslant 2nN$ et que $\mathbb{P}(S_{n} \neq S_{n}') \leqslant \frac{2}{\log_{2}n}$.

    **3.** En déduire que $\frac{S_{n}}{n\log_{2}n} \xrightarrow{\mathbb{P}} 1$. Si le droit d'entrée par partie est $y_{n}$, avec $\frac{y_{n}}{\log_{2}n} \to c$, que devient $\frac{S_{n} - ny_{n}}{n\log_{2}n}$ ? Quel droit d'entrée est équitable pour $n$ parties ?
  corrige: |
    **1.** $\mathbb{E}[X_{1}] = +\infty$ (feuille 3) : $\limsup\frac{S_{n}}{n} = +\infty$ presque sûrement (feuille 8, exercice 6). Ici même $\frac{S_{n}}{n} \to +\infty$ : pour tout $K$, la loi forte appliquée aux $\min(X_{k}, 2^{K})$, d'espérance $K + 1$ (feuille 3), donne $\liminf\frac{S_{n}}{n} \geqslant K + 1$.

    **2.** Soit $J = \lfloor\log_{2}N\rfloor$. Alors $\mathbb{E}[X_{1}'] = \sum_{j \leqslant J}2^{j}2^{-j} = J$, et $J \sim \log_{2}n$ car $\log_{2}N = \log_{2}n + \log_{2}\log_{2}n$ : $\boxed{\mathbb{E}[S_{n}'] = nJ \sim n\log_{2}n}$. Ensuite $\operatorname{Var}(S_{n}') = n\operatorname{Var}(X_{1}') \leqslant n\sum_{j \leqslant J}2^{j} \leqslant n\,2^{J + 1} \leqslant \boxed{2nN}$. Enfin $\mathbb{P}(X_{1} > N) = \sum_{j > J}2^{-j} = 2^{-J} < \frac{2}{N}$, donc $\mathbb{P}(S_{n} \neq S_{n}') \leqslant n\mathbb{P}(X_{1} > N) < \frac{2n}{N} = \boxed{\frac{2}{\log_{2}n}}$.

    **3.** On écrit $\frac{S_{n}}{N} - 1 = \frac{S_{n} - S_{n}'}{N} + \frac{S_{n}' - \mathbb{E}[S_{n}']}{N} + \big(\frac{nJ}{N} - 1\big)$. Le premier terme est nul avec une probabilité qui tend vers $1$ ; le deuxième tend vers $0$ en probabilité, car $\mathbb{P}(|S_{n}' - \mathbb{E}[S_{n}']| > \varepsilon N) \leqslant \frac{2nN}{\varepsilon^{2}N^{2}} = \frac{2}{\varepsilon^{2}\log_{2}n}$ ; le troisième tend vers $0$. Donc $\boxed{\frac{S_{n}}{n\log_{2}n} \xrightarrow{\mathbb{P}} 1}$, et $\boxed{\frac{S_{n} - ny_{n}}{n\log_{2}n} \xrightarrow{\mathbb{P}} 1 - c}$.

    Le droit d'entrée équitable pour $n$ parties est donc d'environ $\log_{2}n$ euros par partie : il croît avec le nombre de parties envisagées. Il n'existe pas de prix équitable fixe, ce que traduit $\mathbb{E}[X] = +\infty$ ; la convergence n'a lieu qu'en probabilité, la suite étant perturbée de loin en loin par des gains gigantesques.
