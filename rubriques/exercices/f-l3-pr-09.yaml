  enonce: |
    On interroge $n$ personnes tirées au hasard avec remise ; $X_{k} = 1$ si la $k$-ième annonce un vote « oui », $X_{k} = 0$ sinon. Les $X_{k}$ sont indépendantes de loi $\mathcal{B}(p)$, et $\bar{X}_{n}$ estime $p$.

    **1.** Quelle est la loi de $S_{n}$ ? Déterminer une taille $n_{0}$ telle que $|\bar{X}_{n} - p| < 0{,}02$ avec une probabilité au moins $0{,}95$, d'abord par l'inégalité de Bienaymé-Tchebychev et $4p(1 - p) \leqslant 1$, puis par une approximation fondée sur le théorème central limite.

    **2.** Pour $\alpha \in \,]0, 1[$, construire, à l'aide de l'inégalité de Bienaymé-Tchebychev, un intervalle de confiance de niveau au moins $1 - \alpha$ pour $p$, c'est-à-dire un intervalle $[g(\bar{X}_{n}), d(\bar{X}_{n})]$ tel que $\mathbb{P}\big(p \in [g(\bar{X}_{n}), d(\bar{X}_{n})]\big) \geqslant 1 - \alpha$ pour tout $p$.

    **3.** Un sondage auprès de $1000$ personnes donne $52\,\%$ de réponses favorables. Donner l'intervalle de la question 2 de niveau $95\,\%$, et le comparer à l'intervalle de la proposition 3 du cours. Quelle taille d'échantillon garantit, par chacune des deux méthodes, une précision de $1\,\%$ ? Préciser le sens du mot « précision ».
  corrige: |
    **1.** $\boxed{S_{n} \sim \mathcal{B}(n, p)}$. Par Bienaymé-Tchebychev, $\mathbb{P}(|\bar{X}_{n} - p| \geqslant 0{,}02) \leqslant \frac{p(1 - p)}{n \times 0{,}0004} \leqslant \frac{1}{0{,}0016\,n}$, inférieur à $0{,}05$ dès $\boxed{n \geqslant 12\,500}$. Par le th. 3, avec $\sigma = \sqrt{p(1 - p)} \leqslant \frac{1}{2}$, 
    $$\mathbb{P}(|\bar{X}_{n} - p| < 0{,}02) \approx 2\Phi\Big(\frac{0{,}02\sqrt{n}}{\sigma}\Big) - 1 \geqslant 2\Phi(0{,}04\sqrt{n}) - 1,$$
     supérieur à $0{,}95$ si $0{,}04\sqrt{n} \geqslant 1{,}96$, soit $\boxed{n \geqslant 2\,401}$ : cinq fois moins, comme dans l'exemple du cours.

    **2.** $\mathbb{P}(|\bar{X}_{n} - p| \geqslant t) \leqslant \frac{1}{4nt^{2}} = \alpha$ pour $t = \frac{1}{2\sqrt{n\alpha}}$, donc 
    $$\boxed{\mathbb{P}\Big(p \in \Big[\bar{X}_{n} - \frac{1}{2\sqrt{n\alpha}}, \bar{X}_{n} + \frac{1}{2\sqrt{n\alpha}}\Big]\Big) \geqslant 1 - \alpha},$$
     pour tout $p$ et tout $n$, sans approximation.

    **3.** Avec $n = 1000$ et $\alpha = 0{,}05$, $t \approx 0{,}071$ : l'intervalle est $\boxed{[0{,}449\,;\, 0{,}591]}$. Celui de la prop. 3, $[0{,}52 \pm 0{,}032] = \boxed{[0{,}488\,;\, 0{,}552]}$, est plus de deux fois plus étroit, mais son niveau $95\,\%$ n'est qu'asymptotique. Tous deux contiennent $\frac{1}{2}$ : le sondage ne permet pas d'affirmer une majorité.

    La *précision* est la demi-largeur de l'intervalle de confiance, à niveau fixé ($95\,\%$) ; c'est une erreur absolue, en points de pourcentage. Pour $1\,\%$ : $\frac{1}{2\sqrt{0{,}05\,n}} \leqslant 0{,}01$ donne $\boxed{n \geqslant 50\,000}$ par Bienaymé-Tchebychev, et $\frac{1}{\sqrt{n}} \leqslant 0{,}01$ donne $\boxed{n \geqslant 10\,000}$ par la prop. 3 ($9\,604$ avec le quantile $1{,}96$).
