  enonce: |
    *(Assurance.)*

    **1.** Un assureur verse à ses $n$ assurés des indemnités $X_{1}$, …, $X_{n}$ indépendantes, de même loi, de variance $1$, et perçoit de chacun une prime $\mathbb{E}[X_{1}] + m$. Estimer la probabilité de faillite $\mathbb{P}(X_{1} + \dots + X_{n} \geqslant n(\mathbb{E}[X_{1}] + m))$ pour $n = 100$ et $m = 0{,}1$. À partir de quel nombre d'assurés est-elle inférieure à $0{,}05$ ?

    **2.** Les nombres annuels de décès dans un groupe d'assurés sont indépendants, de loi $\mathcal{P}(k)$ ; chaque décès coûte $s$ euros, et les cotisations annuelles totales valent $ks(1 + \theta)$, avec $\theta > 0$. Donner la loi du nombre de décès en cinq ans, et déterminer, par approximation normale, une réserve initiale $R$ assurant de couvrir le coût des cinq années avec une probabilité au moins $0{,}99$.

    **3.** *Application :* $1000$ assurés, $s = 500$, $k = 10$ et $\theta = 0{,}1$. Calculer la cotisation par assuré et la réserve. Sans réserve, et avec $k = \frac{N}{100}$ pour $N$ assurés, combien d'assurés faut-il ?
  corrige: |
    **1.** Par le th. 3, avec $\sigma = 1$, 
    $$\mathbb{P}\big(S_{n} - n\mathbb{E}[X_{1}] \geqslant nm\big) = \mathbb{P}\Big(\frac{S_{n} - n\mathbb{E}[X_{1}]}{\sqrt{n}} \geqslant m\sqrt{n}\Big) \approx 1 - \Phi(m\sqrt{n}),$$
     soit $1 - \Phi(1) \approx \boxed{0{,}159}$ pour $n = 100$ et $m = 0{,}1$. Elle est inférieure à $0{,}05$ si $0{,}1\sqrt{n} \geqslant 1{,}645$, soit $\boxed{n \geqslant 271}$ assurés.

    **2.** Le nombre $D$ de décès en cinq ans suit la loi $\boxed{\mathcal{P}(5k)}$ (chapitre 6, prop. 2), et le coût vaut $sD$. Les ressources sont $5ks(1 + \theta) + R$, et 
    $$\mathbb{P}\big(sD \leqslant 5ks(1 + \theta) + R\big) = \mathbb{P}\Big(\frac{D - 5k}{\sqrt{5k}} \leqslant \frac{5k\theta + R/s}{\sqrt{5k}}\Big) \approx \Phi\Big(\frac{5k\theta + R/s}{\sqrt{5k}}\Big).$$
     Elle dépasse $0{,}99$ si $\boxed{R \geqslant s\big(2{,}326\sqrt{5k} - 5k\theta\big)}$ (et $R = 0$ suffit si ce nombre est négatif).

    **3.** La cotisation annuelle par assuré est $\frac{ks(1 + \theta)}{1000} = \frac{10 \times 500 \times 1{,}1}{1000} = \boxed{5{,}50 \text{ euros}}$, et la réserve $R \approx 500(2{,}326\sqrt{50} - 5) \approx \boxed{5\,725 \text{ euros}}$ (le calcul exact avec la loi $\mathcal{P}(50)$ donne alors une probabilité de couverture de $0{,}988$, un peu inférieure à $0{,}99$). Sans réserve, il faut $5k\theta \geqslant 2{,}326\sqrt{5k}$, soit $\sqrt{5k} \geqslant 23{,}26$, $k \geqslant 108{,}2$ et $\boxed{N \approx 10\,800}$ assurés. Les fluctuations relatives du coût sont d'ordre $\frac{1}{\sqrt{5k}}$ : un chargement fixe $\theta$ les absorbe dès que le groupe est assez grand. C'est le principe de la mutualisation.
- id: "l3-pr-09-15"
  feuille: "f-l3-pr-09"
  numero: 15
