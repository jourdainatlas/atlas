  enonce: |
    *(Estimation d'un taux.)* Les durées de vie $\tau_{1}$, …, $\tau_{n}$ de piles d'une même fabrication sont indépendantes, de loi $\mathcal{E}(\theta)$, avec $\theta > 0$ inconnu ; $T_{n} = \tau_{1} + \dots + \tau_{n}$.

    **1.** Donner la loi de $T_{n}$. Montrer que $\hat{\theta}_{n} = \frac{n}{T_{n}} \to \theta$ presque sûrement, et que $\sqrt{n}\big(\frac{\theta T_{n}}{n} - 1\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$. En déduire un intervalle de confiance de niveau asymptotique $95\,\%$ pour $\theta$.

    **2.** *Méthode delta.* Soit $(Y_{n})$ telle que $\sqrt{n}(Y_{n} - \mu) \xrightarrow{\mathcal{L}} \mathcal{N}(0, s^{2})$, et $f : \mathbb{R} \to \mathbb{R}$ dérivable en $\mu$. Montrer que $\sqrt{n}\big(f(Y_{n}) - f(\mu)\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, f'(\mu)^{2}s^{2})$ (une loi $\mathcal{N}(0, 0)$ est la masse en $0$). En déduire la limite en loi de $\sqrt{n}(\hat{\theta}_{n} - \theta)$.

    **3.** Un lot de $20$ piles a fonctionné en moyenne $9$ h $30$, alors que le fabricant annonce une durée moyenne de $10$ heures. Cette annonce est-elle contredite par l'intervalle de la question 1 ?

    **4.** Des retards quotidiens indépendants suivent une loi exponentielle de taux $\lambda$ ; sur $400$ jours, leur moyenne vaut $10$ minutes. Donner un intervalle de confiance de niveau approximativement $98\,\%$ pour $\lambda$.
  corrige: |
    **1.** $\boxed{T_{n} \sim \Gamma(n, \theta)}$ (chapitre 7). Par le th. 2, $\frac{T_{n}}{n} \to \frac{1}{\theta}$ presque sûrement, donc $\boxed{\hat{\theta}_{n} \xrightarrow{\text{p.s.}} \theta}$. Par le th. 3, avec $\sigma = \frac{1}{\theta}$, $\frac{T_{n} - n/\theta}{\sqrt{n}/\theta} = \sqrt{n}\big(\frac{\theta T_{n}}{n} - 1\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$ ; on remarque que $\theta T_{n} \sim \Gamma(n, 1)$ ne dépend pas de $\theta$. L'évènement $|\sqrt{n}(\frac{\theta T_{n}}{n} - 1)| \leqslant 1{,}96$, de probabilité tendant vers $0{,}95$, s'écrit 
    $$\boxed{\theta \in \Big[\hat{\theta}_{n}\Big(1 - \frac{1{,}96}{\sqrt{n}}\Big), \hat{\theta}_{n}\Big(1 + \frac{1{,}96}{\sqrt{n}}\Big)\Big]}.$$

    **2.** On suppose $f$ borélienne, pour que $f(Y_{n})$ soit une variable aléatoire. Soit $\varepsilon(\mu) = 0$ et, pour $y \neq \mu$, $\varepsilon(y) = \frac{f(y) - f(\mu)}{y - \mu} - f'(\mu)$ : $\varepsilon$ est continue en $\mu$, et 
    $$\sqrt{n}\big(f(Y_{n}) - f(\mu)\big) = \sqrt{n}(Y_{n} - \mu)\cdot\big(f'(\mu) + \varepsilon(Y_{n})\big).$$
     Par l'exercice 21 (2) avec $U_{n} = \frac{1}{\sqrt{n}}$, $Y_{n} - \mu \to 0$ en probabilité (si $s = 0$, c'est immédiat), donc $\varepsilon(Y_{n}) \to 0$ en probabilité (feuille 8, exercice 10). La question 2 de l'exercice 21 donne la limite $f'(\mu)\,\mathcal{N}(0, s^{2})$, c'est-à-dire $\boxed{\mathcal{N}(0, f'(\mu)^{2}s^{2})}$ (si $s = 0$, le produit tend vers $0$ en probabilité).

    Avec $Y_{n} = \frac{T_{n}}{n}$, $\mu = \frac{1}{\theta}$, $s^{2} = \frac{1}{\theta^{2}}$ et $f(y) = \frac{1}{y}$, de dérivée $-\theta^{2}$ en $\mu$ : $\boxed{\sqrt{n}(\hat{\theta}_{n} - \theta) \xrightarrow{\mathcal{L}} \mathcal{N}(0, \theta^{2})}$. En remplaçant $\theta$ par $\hat{\theta}_{n}$ dans l'écart type (exercice 21), on retrouve l'intervalle de la question 1.

    **3.** Ici $n = 20$ et $\hat{\theta}_{20} = \frac{1}{9{,}5} \approx 0{,}105$ par heure ; l'intervalle est 
    $$[0{,}105 \times 0{,}562\,;\, 0{,}105 \times 1{,}438] = \boxed{[0{,}059\,;\, 0{,}151]},$$
     qui contient la valeur $0{,}1$ annoncée (durée moyenne $10$ heures) : l'annonce $\boxed{\text{n'est pas contredite}}$. Avec $n = 20$, l'approximation normale est discutable ; l'intervalle exact construit avec les quantiles de $\Gamma(20, 1)$, $[0{,}064\,;\, 0{,}156]$, conduit à la même conclusion. Une moyenne de $9$ h $30$ ou moins a d'ailleurs une probabilité $0{,}44$ si l'annonce est exacte.

    **4.** Avec $n = 400$, $\hat{\lambda} = 0{,}1$ par minute et le quantile $2{,}326$ : 
    $$\lambda \in \Big[0{,}1\Big(1 - \frac{2{,}326}{20}\Big), 0{,}1\Big(1 + \frac{2{,}326}{20}\Big)\Big] = \boxed{[0{,}088\,;\, 0{,}112]} \text{ par minute,}$$
     soit un retard moyen compris entre $8{,}96$ et $11{,}3$ minutes.
