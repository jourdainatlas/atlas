- id: "l3-pr-09-01"
  feuille: "f-l3-pr-09"
  numero: 1
  partie: "Lois des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand (Orsay), exercices 3.2 et 3.24 (application de 3.2 (1))"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Soit $(X_{n})_{n \geqslant 1}$ une suite de variables de carré intégrable, *non nécessairement indépendantes*. On dit qu'elle satisfait la loi faible des grands nombres si $\frac{S_{n} - \mathbb{E}[S_{n}]}{n} \xrightarrow{\mathbb{P}} 0$.

    **1.** Montrer que c'est le cas si la suite des variances est bornée et si $X_{n}$ est indépendante de $X_{k}$ dès que $|n - k| > 1$.

    **2.** *Application.* Soient $(X_{n})$ indépendantes de loi $\mathcal{B}(p)$, $0 < p < 1$, $Y_{n} = X_{n}X_{n + 1}$ et $T_{n} = \sum_{k = 1}^{n}Y_{k}$. Calculer $\mathbb{E}[T_{n}]$ et $\operatorname{Var}(T_{n})$ ; montrer que $\frac{T_{n}}{n} \xrightarrow{\mathbb{P}} p^{2}$. Interpréter $T_{n}$ sur une suite de lancers de pièce.

    **3.** On suppose maintenant la suite *stationnaire à l'ordre deux* : $\mathbb{E}[X_{n}] = \mathbb{E}[X_{1}]$ pour tout $n$, et la covariance $\operatorname{Cov}(X_{i + k}, X_{i}) = \gamma(k)$ ne dépend que de $k$. Montrer que, si $\gamma(k) \to 0$ quand $k \to +\infty$, la suite satisfait la loi faible des grands nombres.
  corrige: |
    **1.** Soit $C$ un majorant des variances. Par l'inégalité de Cauchy-Schwarz, $|\operatorname{Cov}(X_{k}, X_{l})| \leqslant C$, et $\operatorname{Cov}(X_{k}, X_{l}) = 0$ si $|k - l| > 1$, par indépendance. Donc 
    $$\operatorname{Var}(S_{n}) = \sum_{k = 1}^{n}\operatorname{Var}(X_{k}) + 2\sum_{k = 1}^{n - 1}\operatorname{Cov}(X_{k}, X_{k + 1}) \leqslant 3nC, \qquad \mathbb{P}\big(|S_{n} - \mathbb{E}[S_{n}]| \geqslant n\varepsilon\big) \leqslant \frac{3C}{n\varepsilon^{2}} \to 0$$
     par Bienaymé-Tchebychev : 
    $$\boxed{\text{la loi faible est satisfaite}}.$$
     Seule compte la décroissance de $\frac{\operatorname{Var}(S_{n})}{n^{2}}$, comme dans la démonstration du th. 1.

    **2.** $Y_{k} \sim \mathcal{B}(p^{2})$, donc $\boxed{\mathbb{E}[T_{n}] = np^{2}}$. Les $Y_{k}$ et $Y_{l}$ sont indépendantes si $|k - l| \geqslant 2$ (fonctions de paquets disjoints, chapitre 5, prop. 3), et $\operatorname{Cov}(Y_{k}, Y_{k + 1}) = \mathbb{E}[X_{k}X_{k + 1}X_{k + 2}] - p^{4} = p^{3} - p^{4}$. Donc 
    $$\boxed{\operatorname{Var}(T_{n}) = np^{2}(1 - p^{2}) + 2(n - 1)p^{3}(1 - p)} \leqslant 3n,$$
     et la question 1 donne $\boxed{\frac{T_{n}}{n} \xrightarrow{\mathbb{P}} p^{2}}$. Sur une suite de lancers, $T_{n}$ compte les positions $k \leqslant n$ où pile est suivi de pile : la fréquence des doublets « pile-pile » tend vers $p^{2}$. (En séparant les indices pairs et impairs, deux suites indépendantes, la loi forte donne même la convergence presque sûre.)

    **3.** En développant, 
    $$\operatorname{Var}(S_{n}) = \sum_{i, j \leqslant n}\gamma(|i - j|) = n\gamma(0) + 2\sum_{k = 1}^{n - 1}(n - k)\gamma(k), \qquad \text{donc} \qquad \frac{\operatorname{Var}(S_{n})}{n^{2}} \leqslant \frac{\gamma(0)}{n} + \frac{2}{n}\sum_{k = 1}^{n - 1}|\gamma(k)|.$$
     Comme $\gamma(k) \to 0$, la moyenne de Cesàro $\frac{1}{n}\sum_{k < n}|\gamma(k)|$ tend vers $0$, et l'on conclut par Bienaymé-Tchebychev. Une dépendance qui s'efface à grande distance n'empêche pas la loi des grands nombres.
- id: "l3-pr-09-02"
  feuille: "f-l3-pr-09"
  numero: 2
  partie: "Lois des grands nombres"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercice 3.8"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    *(Géométrie en grande dimension.)* Soit $(X_{n})_{n \geqslant 1}$ des variables indépendantes uniformes sur $[-1, 1]$.

    **1.** Montrer que $\frac{1}{n}(X_{1}^{2} + \dots + X_{n}^{2}) \xrightarrow{\mathbb{P}} \frac{1}{3}$.

    **2.** Pour $\varepsilon \in \,]0, 1[$, on note $\|\cdot\|$ la norme euclidienne de $\mathbb{R}^{n}$ et 
    $$A_{n, \varepsilon} = \Big\{x \in \mathbb{R}^{n} \,;\, (1 - \varepsilon)\sqrt{\frac{n}{3}} < \|x\| < (1 + \varepsilon)\sqrt{\frac{n}{3}}\Big\}.$$
     Décrire géométriquement $A_{n, \varepsilon}$.

    **3.** Montrer que $\lambda_{n}(A_{n, \varepsilon} \cap [-1, 1]^{n}) \sim 2^{n}$ quand $n \to +\infty$, où $\lambda_{n}$ est la mesure de Lebesgue de $\mathbb{R}^{n}$. Pourquoi peut-on dire qu'en grande dimension, un cube est presque entièrement contenu dans le voisinage d'une sphère ? Comparer le rayon $\sqrt{n/3}$ au demi-côté $1$ et à la demi-diagonale $\sqrt{n}$ du cube.
  corrige: |
    **1.** Les $X_{i}^{2}$ sont indépendantes, bornées, d'espérance $\int_{-1}^{1}\frac{x^{2}}{2}\,\mathrm{d} x = \frac{1}{3}$ : le th. 1 donne $\boxed{\frac{1}{n}\sum_{i = 1}^{n}X_{i}^{2} \xrightarrow{\mathbb{P}} \frac{1}{3}}$.

    **2.** $A_{n, \varepsilon}$ est la *couronne sphérique* comprise entre les sphères de centre $0$ et de rayons $(1 \pm \varepsilon)\sqrt{n/3}$ : son épaisseur relative est $2\varepsilon$.

    **3.** Le vecteur $X = (X_{1}, \dots, X_{n})$ est uniforme sur le cube $C = [-1, 1]^{n}$, de densité $2^{-n}\mathbf{1}_{C}$ (chapitre 7, prop. 3), donc $\lambda_{n}(A_{n, \varepsilon} \cap C) = 2^{n}\,\mathbb{P}(X \in A_{n, \varepsilon})$. Or $X \in A_{n, \varepsilon}$ équivaut à $\frac{\|X\|^{2}}{n} \in \big]\frac{(1 - \varepsilon)^{2}}{3}, \frac{(1 + \varepsilon)^{2}}{3}\big[$, intervalle ouvert contenant $\frac{1}{3}$, donc contenant $[\frac{1}{3} - \eta, \frac{1}{3} + \eta]$ pour un $\eta > 0$. Par la question 1, $\mathbb{P}(X \in A_{n, \varepsilon}) \geqslant \mathbb{P}(|\frac{\|X\|^{2}}{n} - \frac{1}{3}| \leqslant \eta) \to 1$ : $\boxed{\lambda_{n}(A_{n, \varepsilon} \cap C) \sim 2^{n}}$.

    Presque tout le volume du cube est donc dans une couronne d'épaisseur relative arbitrairement petite autour de la sphère de rayon $\sqrt{n/3}$ : ni près du centre (à distance $1$ des faces), ni dans les coins (à distance $\sqrt{n}$). Le rapport $\frac{1}{\sqrt{3}}$ entre ce rayon et la demi-diagonale ne dépend pas de $n$. L'intuition tirée des dimensions $2$ et $3$ est trompeuse : c'est la concentration de la mesure.
- id: "l3-pr-09-03"
  feuille: "f-l3-pr-09"
  numero: 3
  partie: "Lois des grands nombres"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercices 3.10 et 3.33"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    *(Produits aléatoires.)*

    **1.** Soit $X \geqslant 0$ telle que $\mathbb{E}[X] = 1$ et $\mathbb{P}(X \neq 1) > 0$. Montrer que $q = \mathbb{E}[\sqrt{X}] < 1$.

    **2.** Soit $(X_{n})$ indépendantes de même loi que $X$, et $P_{n} = X_{1}\cdots X_{n}$. Montrer que $\sum_{n}\mathbb{E}[\sqrt{P_{n}}] < +\infty$, et en déduire que $P_{n} \to 0$ presque sûrement, bien que $\mathbb{E}[P_{n}] = 1$ pour tout $n$.

    **3.** On suppose de plus $X > 0$ et $\mathbb{E}[|\ln X|] < +\infty$. Retrouver le résultat par la loi forte des grands nombres appliquée aux $\ln X_{n}$, et préciser la vitesse : $P_{n}$ est de l'ordre de $\mathrm{e}^{nc}$, avec $c < 0$ à préciser.

    **4.** Une expérience à $m$ issues, de probabilités $p_{1}$, …, $p_{m}$, est répétée de façon indépendante ; $N_{n}(i)$ compte les occurrences de l'issue $i$ au cours des $n$ premières expériences, et $T_{n} = \prod_{i}p_{i}^{N_{n}(i)}$ est la probabilité de la suite d'issues observée. Déterminer la limite presque sûre de $\frac{1}{n}\ln T_{n}$, en précisant la convention adoptée pour les issues de probabilité nulle.
  corrige: |
    **1.** $\operatorname{Var}(\sqrt{X}) = \mathbb{E}[X] - \mathbb{E}[\sqrt{X}]^{2} = 1 - q^{2} \geqslant 0$, donc $q \leqslant 1$. Si $q = 1$, $\sqrt{X}$ est de variance nulle, donc presque sûrement égale à son espérance $1$, et $X = 1$ presque sûrement, ce qui est exclu : $\boxed{q < 1}$.

    **2.** Par indépendance, $\mathbb{E}[\sqrt{P_{n}}] = \prod_{i}\mathbb{E}[\sqrt{X_{i}}] = q^{n}$. Par convergence monotone (Beppo Levi), $\mathbb{E}\big[\sum_{n}\sqrt{P_{n}}\big] = \sum_{n}q^{n} < +\infty$, donc $\sum_{n}\sqrt{P_{n}}$ est finie presque sûrement, et son terme général tend vers $0$ : $\boxed{P_{n} \xrightarrow{\text{p.s.}} 0}$. Pourtant $\mathbb{E}[P_{n}] = 1$ : il n'y a pas convergence dans $L^{1}$, l'espérance étant portée par des évènements de plus en plus rares où $P_{n}$ est énorme. C'est le comportement d'un jeu équitable « multiplicatif » : la fortune typique fond.

    **3.** $\frac{\ln P_{n}}{n} = \frac{1}{n}\sum_{i = 1}^{n}\ln X_{i} \xrightarrow{\text{p.s.}} c = \mathbb{E}[\ln X]$ par le th. 2. Comme $\ln$ est strictement concave et $X$ non constante, l'inégalité de Jensen est stricte : $c < \ln\mathbb{E}[X] = 0$. Donc $\boxed{P_{n} = \mathrm{e}^{n(c + o(1))}}$ tend vers $0$ exponentiellement vite. On a d'ailleurs $c = 2\,\mathbb{E}[\ln\sqrt{X}] \leqslant 2\ln q$, encore par Jensen.

    **4.** $\frac{1}{n}\ln T_{n} = \sum_{i}\frac{N_{n}(i)}{n}\ln p_{i}$, et $\frac{N_{n}(i)}{n} \to p_{i}$ presque sûrement (th. 2 appliqué aux indicatrices). Si $p_{i} = 0$, l'issue $i$ n'apparaît presque sûrement jamais, et l'on convient que $p_{i}^{0} = 1$, c'est-à-dire $0\ln 0 = 0$. Donc 
    $$\boxed{\frac{1}{n}\ln T_{n} \xrightarrow{\text{p.s.}} \sum_{i \,;\, p_{i} > 0}p_{i}\ln p_{i} = -H},$$
     où $H$ est l'*entropie* de la loi. La suite observée a une probabilité de l'ordre de $\mathrm{e}^{-nH}$ : il y a « environ $\mathrm{e}^{nH}$ suites typiques », et ce sont elles qui portent presque toute la probabilité.
- id: "l3-pr-09-04"
  feuille: "f-l3-pr-09"
  numero: 4
  partie: "Lois des grands nombres"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Rubenthaler, chapitre 8, exercice 5"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *(Répartition d'un capital.)* Soit $a > 1$ et $(V_{n})_{n \geqslant 0}$ des variables strictement positives, indépendantes, de même loi qu'une variable $V$ telle que $\mathbb{E}[V^{2}] < +\infty$ et $\mathbb{E}[V^{-2}] < +\infty$. Chaque année, un capital est placé pour une fraction $p \in [0, 1]$ à un taux sûr (il est multiplié par $a$) et pour le reste dans un actif risqué (multiplié par $V_{n}$) : $W_{0} = 1$, $W_{n + 1} = \big(ap + (1 - p)V_{n}\big)W_{n}$.

    **1.** Montrer que $\frac{\ln W_{n}}{n} \to c(p) = \mathbb{E}\big[\ln\big(ap + (1 - p)V\big)\big]$ presque sûrement, pour tout $p \in [0, 1]$.

    **2.** Montrer que $\frac{|a - V|}{ap + (1 - p)V} \leqslant (a + V)\big(\frac{1}{a} + \frac{1}{V}\big)$, puis que $c$ est dérivable sur $[0, 1]$, de dérivée $c'(p) = \mathbb{E}\big[\frac{a - V}{ap + (1 - p)V}\big]$. On admet que $c''(p) = -\mathbb{E}\big[\frac{(a - V)^{2}}{(ap + (1 - p)V)^{2}}\big]$.

    **3.** On suppose $\mathbb{E}[\frac{a}{V}] > 1$ et $\mathbb{E}[\frac{V}{a}] > 1$. Montrer que $c$ atteint son maximum en un unique point de $]0, 1[$. Interpréter.

    **4.** Calculer ce point lorsque $a = 2$ et $\mathbb{P}(V = 1) = \mathbb{P}(V = 4) = \frac{1}{2}$, ainsi que le taux de croissance $\mathrm{e}^{c}$ correspondant ; le comparer à ceux des deux placements purs.
  corrige: |
    **1.** Par récurrence, $\ln W_{n} = \sum_{k = 0}^{n - 1}\ln\big(ap + (1 - p)V_{k}\big)$, somme de variables indépendantes de même loi. Elles sont intégrables : pour $p \in \,]0, 1[$, $ap \leqslant ap + (1 - p)V \leqslant a + V$, donc 
    $$|\ln(ap + (1 - p)V)| \leqslant |\ln(ap)| + a + V ;$$
     pour $p = 0$, $|\ln V| \leqslant V + \frac{1}{V}$ ; pour $p = 1$, la variable est constante. Le th. 2 donne $\boxed{\frac{\ln W_{n}}{n} \xrightarrow{\text{p.s.}} c(p)}$, sur $[0, 1]$ tout entier.

    **2.** Le dénominateur $D = ap + (1 - p)V$ est une moyenne pondérée de $a$ et $V$, donc $D \geqslant \min(a, V)$ et $\frac{1}{D} \leqslant \frac{1}{a} + \frac{1}{V}$ ; avec $|a - V| \leqslant a + V$, 
    $$\Big|\frac{\partial}{\partial p}\ln\big(ap + (1 - p)V\big)\Big| = \frac{|a - V|}{D} \leqslant (a + V)\Big(\frac{1}{a} + \frac{1}{V}\Big) = 2 + \frac{a}{V} + \frac{V}{a},$$
     variable intégrable indépendante de $p$. Par le théorème de dérivation sous l'intégrale (Intégration, chapitre 5), $c$ est dérivable sur $[0, 1]$ et $\boxed{c'(p) = \mathbb{E}\big[\frac{a - V}{ap + (1 - p)V}\big]}$.

    **3.** Les hypothèses excluent $V = a$ presque sûrement, donc $c'' < 0$ : $c'$ est strictement décroissante. Or $c'(0) = \mathbb{E}[\frac{a}{V}] - 1 > 0$ et $c'(1) = 1 - \mathbb{E}[\frac{V}{a}] < 0$. Par le théorème des valeurs intermédiaires, $c'$ s'annule en un unique $p^{*} \in \,]0, 1[$, où $c$ atteint son $\boxed{\text{maximum strict}}$.

    *Interprétation.* Presque sûrement, $W_{n} = \mathrm{e}^{n(c(p) + o(1))}$ : $c(p)$ est le taux de croissance à long terme du capital. Il est maximal pour un placement mixte, qui bat les deux placements purs ; c'est le *critère de Kelly*. L'espérance $\mathbb{E}[W_{n}] = (ap + (1 - p)\mathbb{E}[V])^{n}$, elle, est maximale en $p = 0$ ou $p = 1$ (fonction affine de $p$) : maximiser l'espérance et maximiser la croissance typique ne conduisent pas au même choix, comme à l'exercice 3.

    **4.** Ici 
    $$c(p) = \frac{1}{2}\ln(1 + p) + \frac{1}{2}\ln(4 - 2p), \qquad c'(p) = \frac{1}{2(1 + p)} - \frac{1}{4 - 2p},$$
     et $c'$ s'annule pour $4 - 2p = 2 + 2p$ : $\boxed{p^{*} = \frac{1}{2}}$ (les hypothèses sont satisfaites : $\mathbb{E}[\frac{a}{V}] = \mathbb{E}[\frac{V}{a}] = \frac{5}{4}$). Alors $c(\frac{1}{2}) = \frac{1}{2}\ln\frac{9}{2}$ et $\boxed{\mathrm{e}^{c(1/2)} = \frac{3}{\sqrt{2}} \approx 2{,}121}$, contre $\mathrm{e}^{c(0)} = \mathrm{e}^{\mathbb{E}[\ln V]} = 2$ pour l'actif risqué seul et $a = 2$ pour le placement sûr seul.

    1.5em

    ![Figure](documents/figures/7b9fcd813aebed6f.svg)

    Le taux de croissance $c(p)$ pour $a = 2$ et $V \in \{1, 4\}$ : il vaut $\ln 2$ aux deux extrémités et atteint son maximum $\ln\frac{3}{\sqrt{2}} \approx 0{,}752$ en $p = \frac{1}{2}$. Le gain paraît modeste, mais il est exponentiel : sur $50$ ans, le capital est multiplié par $\mathrm{e}^{50 \times 0{,}059} \approx 19$ par rapport aux placements purs.
- id: "l3-pr-09-05"
  feuille: "f-l3-pr-09"
  numero: 5
  partie: "Lois des grands nombres"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercice 3.11 (1)-(2)"
  page_enonce: 2
  page_corrige: 4
  enonce: |
    *(Loi faible par troncature.)* Soit $(b_{n})$ une suite de réels strictement positifs tendant vers $+\infty$ et, pour tout $n$, des variables indépendantes $X_{n, 1}$, …, $X_{n, n}$. On pose $\bar{X}_{n, k} = X_{n, k}\mathbf{1}_{\{|X_{n, k}| \leqslant b_{n}\}}$, $S_{n} = \sum_{k = 1}^{n}X_{n, k}$ et $a_{n} = \sum_{k = 1}^{n}\mathbb{E}[\bar{X}_{n, k}]$.

    **1.** On suppose $\sum_{k = 1}^{n}\mathbb{P}(|X_{n, k}| > b_{n}) \to 0$ et $\frac{1}{b_{n}^{2}}\sum_{k = 1}^{n}\mathbb{E}[\bar{X}_{n, k}^{2}] \to 0$. Montrer que $\frac{S_{n} - a_{n}}{b_{n}} \xrightarrow{\mathbb{P}} 0$.

    **2.** Soit $(X_{n})$ indépendantes de même loi, telles que $x\,\mathbb{P}(|X_{1}| > x) \to 0$ quand $x \to +\infty$, et $\mu_{n} = \mathbb{E}[X_{1}\mathbf{1}_{\{|X_{1}| \leqslant n\}}]$. En appliquant la question 1 avec $X_{n, k} = X_{k}$ et $b_{n} = n$, montrer que $\frac{S_{n}}{n} - \mu_{n} \xrightarrow{\mathbb{P}} 0$. On pourra utiliser la formule $\mathbb{E}[Y^{2}] = \int_{0}^{+\infty}2y\,\mathbb{P}(Y > y)\,\mathrm{d} y$ pour $Y \geqslant 0$, et majorer $\frac{1}{n}\int_{0}^{n}2y\,\mathbb{P}(|X_{1}| > y)\,\mathrm{d} y$ en coupant en $A$.

    **3.** Donner un exemple de loi symétrique, non intégrable, vérifiant l'hypothèse de la question 2. Que dire de $\frac{S_{n}}{n}$ ?
  corrige: |
    **1.** Soit $\bar{S}_{n} = \sum_{k}\bar{X}_{n, k}$. D'une part $\mathbb{P}(S_{n} \neq \bar{S}_{n}) \leqslant \sum_{k}\mathbb{P}(|X_{n, k}| > b_{n}) \to 0$. D'autre part, les $\bar{X}_{n, k}$ sont indépendantes, et par Bienaymé-Tchebychev 
    $$\mathbb{P}\big(|\bar{S}_{n} - a_{n}| > \varepsilon b_{n}\big) \leqslant \frac{\operatorname{Var}(\bar{S}_{n})}{\varepsilon^{2}b_{n}^{2}} \leqslant \frac{1}{\varepsilon^{2}b_{n}^{2}}\sum_{k = 1}^{n}\mathbb{E}[\bar{X}_{n, k}^{2}] \to 0.$$
     Comme $\mathbb{P}(|S_{n} - a_{n}| > \varepsilon b_{n}) \leqslant \mathbb{P}(S_{n} \neq \bar{S}_{n}) + \mathbb{P}(|\bar{S}_{n} - a_{n}| > \varepsilon b_{n})$, on a $\boxed{\frac{S_{n} - a_{n}}{b_{n}} \xrightarrow{\mathbb{P}} 0}$.

    **2.** La première condition s'écrit $n\mathbb{P}(|X_{1}| > n) \to 0$ : c'est l'hypothèse. Pour la seconde, soit $Y = |\bar{X}_{n, 1}| = |X_{1}|\mathbf{1}_{\{|X_{1}| \leqslant n\}}$. La formule rappelée (Fubini-Tonelli, comme au chapitre 4, prop. 6) et $\mathbb{P}(Y > y) \leqslant \mathbb{P}(|X_{1}| > y)\mathbf{1}_{\{y < n\}}$ donnent 
    $$\frac{1}{n^{2}}\sum_{k = 1}^{n}\mathbb{E}[\bar{X}_{n, k}^{2}] = \frac{\mathbb{E}[Y^{2}]}{n} \leqslant \frac{1}{n}\int_{0}^{n}g(y)\,\mathrm{d} y, \qquad g(y) = 2y\,\mathbb{P}(|X_{1}| > y).$$
     La fonction $g$ est bornée (elle tend vers $0$ à l'infini et $g(y) \leqslant 2y$), et pour $A \leqslant n$, 
    $$\frac{1}{n}\int_{0}^{n}g \leqslant \frac{A}{n}\sup_{[0, +\infty[}g + \frac{n - A}{n}\sup_{[A, +\infty[}g,$$
     dont la limite supérieure est au plus $\sup_{[A, +\infty[}g$, arbitrairement petit. La question 1, avec $a_{n} = n\mu_{n}$, donne $\boxed{\frac{S_{n}}{n} - \mu_{n} \xrightarrow{\mathbb{P}} 0}$.

    **3.** Soit $X$ symétrique avec $\mathbb{P}(|X| > x) = \frac{\mathrm{e}}{x\ln x}$ pour $x \geqslant \mathrm{e}$ (et $1$ avant) : c'est bien une queue (décroissante, égale à $1$ en $\mathrm{e}$, de limite nulle), $x\mathbb{P}(|X| > x) = \frac{\mathrm{e}}{\ln x} \to 0$, mais $\mathbb{E}[|X|] \geqslant \int_{\mathrm{e}}^{+\infty}\frac{\mathrm{e}\,\mathrm{d} x}{x\ln x} = +\infty$. Par symétrie $\mu_{n} = 0$, donc $\boxed{\frac{S_{n}}{n} \xrightarrow{\mathbb{P}} 0}$, alors que $\limsup\frac{|S_{n}|}{n} = +\infty$ presque sûrement (feuille 8, exercice 6) : la loi faible peut avoir lieu sans la loi forte.
- id: "l3-pr-09-06"
  feuille: "f-l3-pr-09"
