  source: "Durand, exercice 3.16, dernière phrase"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *(Réciproque de la loi forte.)* Soit $(X_{n})$ indépendantes de même loi, telles que $\frac{S_{n}}{n}$ converge presque sûrement vers une variable réelle $L$.

    **1.** Montrer que $\frac{X_{n}}{n} \to 0$ presque sûrement, puis que $\mathbb{E}[|X_{1}|] < +\infty$ (feuille 8, exercice 6).

    **2.** En déduire que $L$ est presque sûrement constante, égale à $\mathbb{E}[X_{1}]$.
  corrige: |
    **1.** $\frac{X_{n}}{n} = \frac{S_{n}}{n} - \frac{n - 1}{n}\cdot\frac{S_{n - 1}}{n - 1} \to L - L = 0$ presque sûrement. Donc, presque sûrement, $|X_{n}| > n$ n'a lieu que pour un nombre fini de $n$. Ces évènements étant indépendants, la seconde partie du lemme de Borel-Cantelli impose $\sum_{n}\mathbb{P}(|X_{1}| > n) < +\infty$, ce qui équivaut à $\boxed{\mathbb{E}[|X_{1}|] < +\infty}$ (feuille 8, exercice 6).

    **2.** Le th. 2 s'applique alors : $\frac{S_{n}}{n} \to \mathbb{E}[X_{1}]$ presque sûrement, et par unicité de la limite, $\boxed{L = \mathbb{E}[X_{1}] \text{ p.s.}}$ La loi forte est donc optimale : la moyenne empirique converge presque sûrement si et seulement si $X_{1}$ est intégrable.
- id: "l3-pr-09-08"
  feuille: "f-l3-pr-09"
  numero: 8
  partie: "Lois des grands nombres"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercice 4.14"
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *(Théorème de Glivenko-Cantelli.)* Soit $(X_{n})$ indépendantes de même fonction de répartition $F$, supposée continue. La *fonction de répartition empirique* est $F_{n}(x) = \frac{1}{n}\sum_{k = 1}^{n}\mathbf{1}_{\{X_{k} \leqslant x\}}$ ; on pose $V_{n} = \sup_{x \in \mathbb{R}}|F_{n}(x) - F(x)|$.

    **1.** Montrer que $X_{1}$, …, $X_{n}$ sont presque sûrement deux à deux distinctes, et que $F_{n}$ est la fonction de répartition de la probabilité aléatoire $\frac{1}{n}\sum_{k}\delta_{X_{k}}$. Dessiner l'allure de $F_{n}$.

    **2.** On suppose d'abord les $X_{k}$ uniformes sur $[0, 1]$. Montrer que, presque sûrement, $F_{n}(x) \to x$ pour tout $x \in [0, 1]$ *simultanément*, puis que $V_{n} \to 0$, à l'aide d'une subdivision finie de $[0, 1]$ et de la croissance des $F_{n}$.

    **3.** Cas général. Soit $G(u) = \inf\{x \,;\, F(x) \geqslant u\}$ l'inverse généralisée de $F$ et $(U_{k})$ des variables indépendantes uniformes sur $]0, 1[$. Rappeler la loi de $G(U_{k})$ (chapitre 4, théorème 2) et montrer que $V_{n}$ a même loi que $\sup_{x}|F_{n}^{U}(F(x)) - F(x)|$, où $F_{n}^{U}$ est la fonction de répartition empirique des $U_{k}$. Conclure que $V_{n} \to 0$ presque sûrement.
  corrige: |
    **1.** Pour $i \neq j$, par indépendance et Fubini, $\mathbb{P}(X_{i} = X_{j}) = \int\mathbb{P}(X_{j} = x)\,\mathrm{d}\mathbb{P}_{X_{i}}(x) = 0$, car $F$ continue n'a pas de saut. Une réunion finie d'évènements négligeables est négligeable : les $X_{k}$ sont $\boxed{\text{distinctes p.s.}}$ Par définition, $\frac{1}{n}\sum_{k}\delta_{X_{k}}(]-\infty, x]) = \frac{1}{n}\#\{k \,;\, X_{k} \leqslant x\} = F_{n}(x)$ : $F_{n}$ est une fonction en escalier, croissante, qui saute de $\frac{1}{n}$ en chacun des points $X_{k}$ (figure).

    **2.** Pour $x$ fixé, les $\mathbf{1}_{\{X_{k} \leqslant x\}}$ sont indépendantes de loi $\mathcal{B}(x)$ : $F_{n}(x) \to x$ presque sûrement (th. 2). L'ensemble des rationnels de $[0, 1]$ étant dénombrable, il existe un évènement $\Omega'$ de probabilité $1$ sur lequel $F_{n}(x) \to x$ pour tout $x \in \mathbb{Q} \cap [0, 1]$, et presque sûrement les $X_{k}$ sont dans $[0, 1]$. Fixons $\omega \in \Omega'$ et $m \geqslant 1$, et $x_{j} = \frac{j}{m}$. Pour $x \in [x_{j}, x_{j + 1}]$, par croissance de $F_{n}$, 
    $$F_{n}(x_{j}) - x_{j} - \frac{1}{m} \leqslant F_{n}(x) - x \leqslant F_{n}(x_{j + 1}) - x_{j + 1} + \frac{1}{m},$$
     et $F_{n} = F$ hors de $[0, 1]$. Donc $V_{n} \leqslant \max_{j}|F_{n}(x_{j}) - x_{j}| + \frac{1}{m}$, de limite supérieure au plus $\frac{1}{m}$ ; ceci pour tout $m$ : $\boxed{V_{n} \xrightarrow{\text{p.s.}} 0}$. En particulier $F_{n}(x) \to x$ pour tout $x$ simultanément.

    **3.** $G(U_{k})$ a pour fonction de répartition $F$, puisque $G(u) \leqslant t \Leftrightarrow u \leqslant F(t)$ (chapitre 4, th. 2). La suite $(X_{k})$ a donc même loi que $(G(U_{k}))$. Pour cette dernière, $\#\{k \,;\, G(U_{k}) \leqslant x\} = \#\{k \,;\, U_{k} \leqslant F(x)\}$, donc sa fonction de répartition empirique est $F_{n}^{U}(F(x))$, et 
    $$\sup_{x}|F_{n}^{U}(F(x)) - F(x)| \leqslant \sup_{u \in [0, 1]}|F_{n}^{U}(u) - u| \xrightarrow{\text{p.s.}} 0$$
     par la question 2. Comme $(V_{n})_{n}$ est une fonction de la suite $(X_{k})$ (mesurable : par continuité à droite, le $\sup$ peut être pris sur les rationnels), elle a même loi que la suite correspondante pour les $G(U_{k})$, et l'évènement $\{V_{n} \to 0\}$ a la même probabilité $1$ : 
    $$\boxed{V_{n} \xrightarrow{\text{p.s.}} 0}.$$
     La fonction de répartition empirique estime $F$ *uniformément* : c'est souvent appelé le théorème fondamental de la statistique.

    1.5em

    ![Figure](documents/figures/66ac12472de02e00.svg)

    La fonction de répartition empirique d'un échantillon uniforme (en bleu ; graine $2026$) et la fonction de répartition $F(x) = x$ (en orange), pour $n = 20$ et $n = 200$. Le segment rouge marque l'écart maximal $V_{n}$ : $0{,}18$ puis $0{,}049$, à peu près divisé par $\sqrt{10}$ quand $n$ est multiplié par $10$, ce qui annonce des fluctuations d'ordre $\frac{1}{\sqrt{n}}$.
- id: "l3-pr-09-09"
  feuille: "f-l3-pr-09"
  numero: 9
  partie: "Lois des grands nombres"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [lois des grands nombres]
  noeuds: [p-loi-faible, p-loi-forte]
  notions: [convergence-presque-sure, convergence-probabilite]
  source: "Durand, exercices 5.2 et 5.34 (1)-(2)"
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *(Estimateurs.)* Soit $(X_{k})$ indépendantes de même loi, de carré intégrable, de moyenne $m$ et de variance $\sigma^{2}$.

    **1.** Calculer l'espérance et la limite presque sûre de $V_{n} = \frac{1}{n}\sum_{k = 1}^{n}(X_{k} - \bar{X}_{n})^{2}$. Pour $n \geqslant 2$, montrer que $S_{n}^{2} = \frac{n}{n - 1}V_{n}$ a pour espérance $\sigma^{2}$ et converge presque sûrement vers $\sigma^{2}$, et que $S_{n} \to \sigma$ presque sûrement.

    **2.** Soit $(T_{n})$ des variables de carré intégrable telles que $\mathbb{E}[T_{n}] \to \theta$ et $\operatorname{Var}(T_{n}) \to 0$. Montrer que $T_{n} \xrightarrow{\mathbb{P}} \theta$.

    **3.** *Histogramme.* On suppose que la loi des $X_{k}$ a une densité $f$ continue. Soit $h_{n} > 0$ et, pour $x \in \mathbb{R}$, $I_{n}(x) = [kh_{n}, (k + 1)h_{n}[$ l'intervalle qui contient $x$. L'histogramme est la fonction $\hat{f}_{n}(x) = \frac{1}{nh_{n}}\sum_{i = 1}^{n}\mathbf{1}_{\{X_{i} \in I_{n}(x)\}}$. On suppose $h_{n} \to 0$ et $nh_{n} \to +\infty$. Calculer $\mathbb{E}[\hat{f}_{n}(x)]$ et $\operatorname{Var}(\hat{f}_{n}(x))$, montrer que $\mathbb{E}[\hat{f}_{n}(x)] \to f(x)$ et $\operatorname{Var}(\hat{f}_{n}(x)) = \frac{f(x) + o(1)}{nh_{n}}$, et en déduire que $\hat{f}_{n}(x) \to f(x)$ dans $L^{2}$.

    **4.** On suppose de plus $|f(y) - f(x)| \leqslant A|y - x|^{\alpha}$ pour $|y - x| < \delta$, avec $\alpha \in \,]0, 1]$. Trouver $h_{n}$ tel que $n^{2\alpha/(2\alpha + 1)}\,\mathbb{E}[(\hat{f}_{n}(x) - f(x))^{2}]$ reste borné. Interpréter le compromis entre les deux termes.
  corrige: |
    **1.** $V_{n} = \frac{1}{n}\sum_{k}X_{k}^{2} - \bar{X}_{n}^{2}$, et $\mathbb{E}[\bar{X}_{n}^{2}] = \operatorname{Var}(\bar{X}_{n}) + m^{2} = \frac{\sigma^{2}}{n} + m^{2}$, donc $\boxed{\mathbb{E}[V_{n}] = \frac{n - 1}{n}\sigma^{2}}$. Par le th. 2 appliqué aux $X_{k}$ et aux $X_{k}^{2}$, $V_{n} \to (\sigma^{2} + m^{2}) - m^{2} = \sigma^{2}$ presque sûrement. Ainsi $\boxed{\mathbb{E}[S_{n}^{2}] = \sigma^{2}}$ et $S_{n}^{2} \to \sigma^{2}$ presque sûrement, puis $\boxed{S_{n} \xrightarrow{\text{p.s.}} \sigma}$ par continuité de la racine. Le facteur $\frac{n}{n - 1}$ compense le fait que les écarts sont pris à $\bar{X}_{n}$, plus proche des données que $m$.

    **2.** $\mathbb{E}[(T_{n} - \theta)^{2}] = \operatorname{Var}(T_{n}) + (\mathbb{E}[T_{n}] - \theta)^{2} \to 0$ : la convergence a lieu dans $L^{2}$, donc $\boxed{\text{en probabilité}}$ (chapitre 8, th. 4).

    **3.** Soit $p_{n} = \int_{I_{n}(x)}f$. La variable $nh_{n}\hat{f}_{n}(x)$ suit la loi $\mathcal{B}(n, p_{n})$, donc 
    $$\boxed{\mathbb{E}[\hat{f}_{n}(x)] = \frac{p_{n}}{h_{n}}, \qquad \operatorname{Var}(\hat{f}_{n}(x)) = \frac{p_{n}(1 - p_{n})}{nh_{n}^{2}}}.$$
     Comme $I_{n}(x) \subset [x - h_{n}, x + h_{n}]$ et $f$ est continue en $x$, $\frac{p_{n}}{h_{n}} - f(x) = \frac{1}{h_{n}}\int_{I_{n}(x)}(f(y) - f(x))\,\mathrm{d} y \to 0$. Ensuite $\operatorname{Var}(\hat{f}_{n}(x)) = \frac{p_{n}}{h_{n}}\cdot\frac{1 - p_{n}}{nh_{n}} = \frac{f(x) + o(1)}{nh_{n}}$, car $p_{n} \to 0$. L'écart quadratique moyen, somme de la variance et du carré du biais, tend vers $0$ : $\boxed{\hat{f}_{n}(x) \xrightarrow{L^{2}} f(x)}$.

    **4.** Pour $h_{n} < \delta$, le biais est majoré par $\frac{1}{h_{n}}\int_{I_{n}(x)}A|y - x|^{\alpha}\,\mathrm{d} y \leqslant Ah_{n}^{\alpha}$, et la variance par $\frac{C}{nh_{n}}$ pour $n$ grand. Donc $\mathbb{E}[(\hat{f}_{n}(x) - f(x))^{2}] \leqslant A^{2}h_{n}^{2\alpha} + \frac{C}{nh_{n}}$. Les deux termes sont du même ordre pour $\boxed{h_{n} = n^{-1/(2\alpha + 1)}}$, et valent alors $n^{-2\alpha/(2\alpha + 1)}$. Des classes étroites donnent un faible biais mais peu de points par classe, donc une grande variance ; des classes larges, l'inverse. La vitesse obtenue est moins bonne que la vitesse $\frac{1}{n}$ de l'estimation d'une moyenne.
- id: "l3-pr-09-10"
  feuille: "f-l3-pr-09"
  numero: 10
  partie: "Théorème central limite : calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème central limite]
  noeuds: [p-tcl]
  notions: [convergence-loi, loi-normale]
  source: "Bordeaux, TD 4, exercice 10 ; Durand, exercices 4.19 et 4.7 (application finale)"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $x > 0$ et $(X_{n})$ indépendantes de loi $\mathcal{P}(x)$.

    **1.** Déterminer la loi de $S_{n}$. Montrer que $\frac{S_{n}}{n} \to x$ presque sûrement, et que $\frac{S_{n} - nx}{\sqrt{nx}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$.

    **2.** Pour $y > 0$, on pose $g_{n}(x, y) = \mathrm{e}^{-nx}\sum_{0 \leqslant k \leqslant ny}\frac{(nx)^{k}}{k!}$. Montrer, sans calcul, que $g_{n}(x, y)$ tend vers $1$ si $y > x$, vers $0$ si $y < x$, et vers $\frac{1}{2}$ si $y = x$. En particulier, $\mathrm{e}^{-n}\sum_{k = 0}^{n}\frac{n^{k}}{k!} \to \frac{1}{2}$.

    **3.** *Inversion de la transformée de Laplace.* Soit $X > 0$ une variable aléatoire et $L(t) = \mathbb{E}[\mathrm{e}^{-tX}]$ pour $t > 0$. Justifier que $L$ est de classe $\mathcal{C}^{\infty}$ sur $]0, +\infty[$, avec $L^{(k)}(t) = \mathbb{E}[(-X)^{k}\mathrm{e}^{-tX}]$, puis que 
    $$\sum_{0 \leqslant k \leqslant ny}\frac{(-n)^{k}}{k!}L^{(k)}(n) \xrightarrow[n \to +\infty]{} \mathbb{P}(X < y) + \frac{1}{2}\mathbb{P}(X = y).$$
     La loi de $X$ est donc déterminée par sa transformée de Laplace.
  corrige: |
    **1.** $\boxed{S_{n} \sim \mathcal{P}(nx)}$ (chapitre 6, prop. 2). Les $X_{k}$ sont intégrables, de variance $x$ : le th. 2 donne $\frac{S_{n}}{n} \to x$ presque sûrement, et le th. 3 donne $\frac{S_{n} - nx}{\sqrt{nx}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$.

    **2.** On a $g_{n}(x, y) = \mathbb{P}(S_{n} \leqslant ny) = \mathbb{P}(\frac{S_{n}}{n} \leqslant y)$. Si $y > x$, cette probabilité est minorée par $\mathbb{P}(|\frac{S_{n}}{n} - x| < y - x)$, qui tend vers $1$ ; si $y < x$, elle est majorée par $\mathbb{P}(|\frac{S_{n}}{n} - x| \geqslant x - y)$, qui tend vers $0$. Si $y = x$, $g_{n}(x, x) = \mathbb{P}\big(\frac{S_{n} - nx}{\sqrt{nx}} \leqslant 0\big) \to \Phi(0) = \frac{1}{2}$. Avec $x = y = 1$ : $\boxed{\mathrm{e}^{-n}\sum_{k = 0}^{n}\frac{n^{k}}{k!} \to \frac{1}{2}}$ (elle vaut $0{,}583$ pour $n = 10$, $0{,}527$ pour $n = 100$). La moitié de la masse de la série de $\mathrm{e}^{n}$ est portée par ses $n + 1$ premiers termes, résultat peu évident par l'analyse seule.

    **3.** Pour $t \geqslant t_{0} > 0$, $|\frac{\partial^{k}}{\partial t^{k}}\mathrm{e}^{-tx}| = x^{k}\mathrm{e}^{-tx} \leqslant \sup_{x > 0}x^{k}\mathrm{e}^{-t_{0}x} = \big(\frac{k}{\mathrm{e} t_{0}}\big)^{k}$ : par dérivation sous l'intégrale (domination par une constante), et par récurrence, $L$ est de classe $\mathcal{C}^{\infty}$ et $L^{(k)}(t) = \mathbb{E}[(-X)^{k}\mathrm{e}^{-tX}]$. Aucune hypothèse de moment n'est nécessaire. Par linéarité, 
    $$\sum_{0 \leqslant k \leqslant ny}\frac{(-n)^{k}}{k!}L^{(k)}(n) = \mathbb{E}\Big[\mathrm{e}^{-nX}\sum_{0 \leqslant k \leqslant ny}\frac{(nX)^{k}}{k!}\Big] = \mathbb{E}[g_{n}(X, y)].$$
     Par la question 2, $g_{n}(X, y) \to \mathbf{1}_{\{X < y\}} + \frac{1}{2}\mathbf{1}_{\{X = y\}}$ en tout point, et $0 \leqslant g_{n} \leqslant 1$ : par convergence dominée, la limite est $\boxed{\mathbb{P}(X < y) + \frac{1}{2}\mathbb{P}(X = y)}$. En un point $y$ où $F_{X}$ est continue, on obtient $F_{X}(y)$ ; ces points sont denses, et $F_{X}$, continue à droite, est déterminée par ses valeurs en ces points, donc la loi de $X$ l'est (chapitre 4, th. 1).
- id: "l3-pr-09-11"
  feuille: "f-l3-pr-09"
  numero: 11
  partie: "Théorème central limite : calculs"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [théorème central limite]
  noeuds: [p-tcl]
  notions: [convergence-loi, loi-normale]
  source: "Durand, exercice 4.29"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    *(Médiane d'une loi de Poisson.)* Pour $n \geqslant 1$ et $\lambda \geqslant 0$, on pose $P_{n}(\lambda) = \mathrm{e}^{-\lambda}\sum_{j = 0}^{n}\frac{\lambda^{j}}{j!}$, et $u_{n} = \mathrm{e}^{-n}\frac{n^{n}}{n!}$.

    **1.** Calculer $P_{n}'$ et $P_{n}''$, et montrer que $1 - P_{n}(\lambda) = \frac{1}{n!}\int_{0}^{\lambda}\mathrm{e}^{-x}x^{n}\,\mathrm{d} x$. Donner un équivalent de $u_{n}$ (formule de Stirling).

    **2.** Établir $P_{n}(\lambda) + P_{n}'(\lambda) = P_{n - 1}(\lambda)$. À l'aide de la formule de Taylor avec reste intégral sur $[n - 1, n]$, puis sur $[n, n + 1]$, montrer que la suite $(P_{n}(n))$ est strictement décroissante, et que la suite $(P_{n - 1}(n))$ est strictement croissante.

    **3.** Montrer que ces deux suites sont adjacentes, et calculer leur limite commune grâce au théorème central limite. En déduire que l'entier $n$ est l'unique médiane de la loi $\mathcal{P}(n)$.

    **4.** Une assurance perçoit des primes d'un montant total $ns$, dispose d'une réserve $R \geqslant 0$ fixe et couvre un nombre $N_{n} \sim \mathcal{P}(n)$ de sinistres, chacun de coût $s > 0$. Quelle est la limite de la probabilité de couvrir les dépenses quand $n \to +\infty$ ? Interpréter.
  corrige: |
    **1.** En dérivant terme à terme, la somme télescope : 
    $$\boxed{P_{n}'(\lambda) = -\mathrm{e}^{-\lambda}\frac{\lambda^{n}}{n!}}, \qquad \boxed{P_{n}''(\lambda) = \mathrm{e}^{-\lambda}\frac{\lambda^{n - 1}(\lambda - n)}{n!}}.$$
     Comme $P_{n}(0) = 1$, $1 - P_{n}(\lambda) = \int_{0}^{\lambda}\mathrm{e}^{-x}\frac{x^{n}}{n!}\,\mathrm{d} x$. Par la formule de Stirling (exercice 12), $\boxed{u_{n} \sim \frac{1}{\sqrt{2\pi n}}}$.

    **2.** $P_{n} + P_{n}' = P_{n} - \mathrm{e}^{-\lambda}\frac{\lambda^{n}}{n!} = P_{n - 1}$. La formule de Taylor avec reste intégral entre $n - 1$ et $n$ donne 
    $$P_{n}(n) = P_{n}(n - 1) + P_{n}'(n - 1) + \int_{n - 1}^{n}(n - t)P_{n}''(t)\,\mathrm{d} t = P_{n - 1}(n - 1) + \int_{n - 1}^{n}(n - t)P_{n}''(t)\,\mathrm{d} t,$$
     et l'intégrale est strictement négative car $P_{n}'' < 0$ sur $]n - 1, n[$ : 
    $$\boxed{(P_{n}(n)) \text{ décroît strictement}}.$$
     Entre $n$ et $n + 1$, de même, $P_{n}(n + 1) = P_{n - 1}(n) + \int_{n}^{n + 1}(n + 1 - t)P_{n}''(t)\,\mathrm{d} t$, avec $P_{n}'' > 0$ sur $]n, n + 1[$ : $P_{n}(n + 1) > P_{n - 1}(n)$, et 
    $$\boxed{(P_{n - 1}(n)) \text{ croît strictement}}.$$

    **3.** $P_{n}(n) - P_{n - 1}(n) = u_{n} \to 0$ : les suites sont $\boxed{\text{adjacentes}}$. Si $N \sim \mathcal{P}(n)$, $P_{n}(n) = \mathbb{P}(N \leqslant n)$, qui tend vers $\frac{1}{2}$ (exercice 10, question 2). Les monotonies étant strictes, 
    $$\mathbb{P}(N \leqslant n - 1) = P_{n - 1}(n) < \frac{1}{2} < P_{n}(n) = \mathbb{P}(N \leqslant n).$$
     Donc $\mathbb{P}(N \leqslant n) > \frac{1}{2}$ et $\mathbb{P}(N \geqslant n) = 1 - P_{n - 1}(n) > \frac{1}{2}$ : $n$ est une médiane. Pour $m < n$, $\mathbb{P}(N \leqslant m) \leqslant P_{n - 1}(n) < \frac{1}{2}$ ; pour $m > n$, $\mathbb{P}(N \geqslant m) \leqslant 1 - P_{n}(n) < \frac{1}{2}$ : 
    $$\boxed{n \text{ est l'unique médiane}}.$$

    1.5em

    ![Figure](documents/figures/1d7c2faeb6cf15ad.svg)

    Les deux suites adjacentes pour $1 \leqslant n \leqslant 30$, de part et d'autre de la droite d'ordonnée $\frac{1}{2}$, qu'elles ne franchissent jamais. Leur écart $u_{n} = \mathbb{P}(N = n)$ décroît comme $\frac{1}{\sqrt{2\pi n}}$ : $0{,}37$ pour $n = 1$, $0{,}073$ pour $n = 30$.

    **4.** Les dépenses $sN_{n}$ sont couvertes si $N_{n} \leqslant n + \frac{R}{s}$. Pour tout $\eta > 0$ et $n$ assez grand, $\frac{R}{s\sqrt{n}} \leqslant \eta$, donc 
    $$\mathbb{P}\Big(\frac{N_{n} - n}{\sqrt{n}} \leqslant 0\Big) \leqslant \mathbb{P}\Big(N_{n} \leqslant n + \frac{R}{s}\Big) \leqslant \mathbb{P}\Big(\frac{N_{n} - n}{\sqrt{n}} \leqslant \eta\Big),$$
     et les deux bornes tendent vers $\frac{1}{2}$ et $\Phi(\eta)$ : la limite est $\boxed{\frac{1}{2}}$. Avec des primes égales au coût moyen, l'assurance est ruinée une fois sur deux, quelle que soit sa réserve fixe : il faut un chargement $\theta > 0$ (exercice 14).
