  enonce: |
    *(Variance inconnue.)* Soit $(X_{k})$ indépendantes de même loi, de moyenne $m$ et de variance $\sigma^{2} \in \,]0, +\infty[$.

    **1.** Que dire de $\sqrt{n}(\bar{X}_{n} - m')$ si $m' \neq m$ ?

    **2.** Soit $U_{n} \xrightarrow{\mathbb{P}} u \in \mathbb{R}$ et $Z_{n} \xrightarrow{\mathcal{L}} Z$, où $Z$ a une fonction de répartition $F$ continue. Montrer que $U_{n}Z_{n} \xrightarrow{\mathcal{L}} uZ$, en traitant les cas $u > 0$, $u < 0$ et $u = 0$ et en encadrant les évènements sur $\{|U_{n} - u| \leqslant \delta\}$.

    **3.** Soit $T_{n} > 0$ tel que $T_{n} \xrightarrow{\mathbb{P}} \sigma$. Montrer que $\sqrt{n}\,\frac{\bar{X}_{n} - m}{T_{n}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$. En déduire, avec l'exercice 9, un intervalle de confiance de niveau asymptotique $95\,\%$ pour $m$, lorsque $\sigma$ est inconnu.

    **4.** On suppose $m = 0$. Montrer que $\frac{X_{1} + \dots + X_{n}}{\sqrt{X_{1}^{2} + \dots + X_{n}^{2}}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$, le quotient étant pris nul si son dénominateur est nul.
  corrige: |
    **1.** $\sqrt{n}(\bar{X}_{n} - m') = \sqrt{n}(\bar{X}_{n} - m) + \sqrt{n}(m - m')$. Pour $A > 0$ et $n$ grand, par Bienaymé-Tchebychev, 
    $$\mathbb{P}\big(|\sqrt{n}(\bar{X}_{n} - m')| \leqslant A\big) \leqslant \mathbb{P}\big(|\sqrt{n}(\bar{X}_{n} - m)| \geqslant \sqrt{n}|m - m'| - A\big) \leqslant \frac{\sigma^{2}}{(\sqrt{n}|m - m'| - A)^{2}} \to 0 :$$
     $\boxed{|\sqrt{n}(\bar{X}_{n} - m')| \to +\infty}$ en probabilité, et il n'y a pas de convergence en loi. Le centrage du th. 3 doit être exactement l'espérance.

    **2.** *Cas $u > 0$.* Soit $\delta \in \,]0, u[$ et $t \in \mathbb{R}$. Sur l'évènement $\{|U_{n} - u| \leqslant \delta\}$, $U_{n} > 0$, et en notant $t_{-} = \min(\frac{t}{u - \delta}, \frac{t}{u + \delta})$, $t_{+} = \max(\frac{t}{u - \delta}, \frac{t}{u + \delta})$, 
    $$\{Z_{n} \leqslant t_{-}\} \subset \{U_{n}Z_{n} \leqslant t\} \subset \{Z_{n} \leqslant t_{+}\}.$$
     Donc $\mathbb{P}(Z_{n} \leqslant t_{-}) - \mathbb{P}(|U_{n} - u| > \delta) \leqslant \mathbb{P}(U_{n}Z_{n} \leqslant t) \leqslant \mathbb{P}(Z_{n} \leqslant t_{+}) + \mathbb{P}(|U_{n} - u| > \delta)$. Comme $F$ est continue, les bornes tendent vers $F(t_{\pm})$, qui tendent vers $F(\frac{t}{u}) = \mathbb{P}(uZ \leqslant t)$ quand $\delta \to 0$.

    *Cas $u < 0$.* On écrit $U_{n}Z_{n} = (-U_{n})(-Z_{n})$, avec $-U_{n} \to -u > 0$ et $-Z_{n} \xrightarrow{\mathcal{L}} -Z$, de fonction de répartition continue.

    *Cas $u = 0$.* Pour $\eta, \delta > 0$, $\mathbb{P}(|U_{n}Z_{n}| > \eta) \leqslant \mathbb{P}(|U_{n}| > \delta) + \mathbb{P}(|Z_{n}| > \frac{\eta}{\delta})$, de limite supérieure au plus $\mathbb{P}(|Z| \geqslant \frac{\eta}{\delta})$, arbitrairement petite : $U_{n}Z_{n} \to 0$ en probabilité, donc en loi. Dans tous les cas, $\boxed{U_{n}Z_{n} \xrightarrow{\mathcal{L}} uZ}$.

    **3.** $\sqrt{n}\,\frac{\bar{X}_{n} - m}{T_{n}} = \frac{\sigma}{T_{n}}\cdot Z_{n}$, avec $Z_{n} = \sqrt{n}\,\frac{\bar{X}_{n} - m}{\sigma} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$ (th. 3) et $\frac{\sigma}{T_{n}} \xrightarrow{\mathbb{P}} 1$ (feuille 8, exercice 10) : la question 2 avec $u = 1$ donne $\boxed{\sqrt{n}\,\frac{\bar{X}_{n} - m}{T_{n}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)}$. Avec $T_{n} = S_{n}$ (exercice 9), $\mathbb{P}\big(|\sqrt{n}\,\frac{\bar{X}_{n} - m}{S_{n}}| \leqslant 1{,}96\big) \to 0{,}95$, d'où l'intervalle de niveau asymptotique $95\,\%$ 
    $$\boxed{\Big[\bar{X}_{n} - 1{,}96\,\frac{S_{n}}{\sqrt{n}}, \bar{X}_{n} + 1{,}96\,\frac{S_{n}}{\sqrt{n}}\Big]}.$$
     Pour un échantillon gaussien, le chapitre 10 donnera un intervalle exact, avec les quantiles de Student.

    **4.** Le quotient s'écrit $\frac{S_{n}}{\sigma\sqrt{n}}\cdot\frac{\sigma}{\sqrt{\frac{1}{n}\sum X_{i}^{2}}}$, sur l'évènement où le dénominateur est non nul. Par le th. 2, $\frac{1}{n}\sum X_{i}^{2} \to \sigma^{2} > 0$ presque sûrement : cet évènement est presque sûrement réalisé pour $n$ grand, et le second facteur tend vers $1$. La question 2 donne la limite $\boxed{\mathcal{N}(0, 1)}$. Cette autonormalisation n'utilise pas la valeur de $\sigma$.
- id: "l3-pr-09-22"
  feuille: "f-l3-pr-09"
  numero: 22
  partie: "Statistique asymptotique"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [statistique asymptotique, intervalle de confiance]
  noeuds: [p-tcl, p-loi-forte]
  notions: [convergence-loi]
  source: "Durand, exercices 5.8 (1)-(5), 5.11 et 5.38"
  page_enonce: 8
