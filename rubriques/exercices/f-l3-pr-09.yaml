  notions: [convergence-loi]
  source: "Durand, exercices 3.27 et 3.26"
  page_enonce: 10
  page_corrige: 20
  enonce: |
    **1.** Soit $(X_{i})$ indépendantes de loi $\mathcal{E}(1)$, et $M_{n} = \frac{1}{\ln n}\max_{i \leqslant n}X_{i}$ pour $n \geqslant 2$. Calculer $\mathbb{P}(M_{n} < a)$ pour $a > 0$. Montrer que ces probabilités forment une série convergente si $a < 1$ ; pour $a > 1$, utiliser la sous-suite $n_{k} = k^{q}$, avec $q$ entier tel que $q(a - 1) > 1$, et la croissance des maxima. En déduire que $M_{n} \to 1$ presque sûrement, ce qui précise l'exercice 19 de la feuille 8.

    **2.** Soit $(X_{n})$ indépendantes uniformes sur $[0, 1]$ et $\alpha > 0$. Étudier les convergences en probabilité, dans $L^{1}$ et presque sûre vers $0$ de $U_{n} = \frac{n^{-\alpha}}{\sqrt{1 - X_{n}}}$.

    **3.** Soit $Y_{n} = \frac{X_{n}}{n + X_{n + 1}}$. Calculer $\mathbb{E}[Y_{n}]$. Les $Y_{n}$ sont-elles indépendantes ? Et les $Y_{2n}$ ? Étudier, suivant $\alpha$, la convergence presque sûre de $n^{\alpha}Y_{n}$.
  corrige: |
    **1.** $\mathbb{P}(M_{n} < a) = \mathbb{P}(X_{1} < a\ln n)^{n} = \boxed{(1 - n^{-a})^{n}}$. Pour $a < 1$, elle est majorée par $\exp(-n^{1 - a})$, inférieur à $\frac{1}{n^{2}}$ pour $n$ grand : par Borel-Cantelli, presque sûrement $M_{n} \geqslant a$ à partir d'un certain rang, et avec $a = 1 - \frac{1}{j}$, $j \in \mathbb{N}^{*}$, $\liminf M_{n} \geqslant 1$. Pour $a > 1$, $\mathbb{P}(M_{n_{k}} \geqslant a) \leqslant n_{k}\cdot n_{k}^{-a} = k^{-q(a - 1)}$, terme d'une série convergente : presque sûrement, $\max_{i \leqslant n_{k}}X_{i} < a\ln n_{k}$ pour $k$ grand. Pour $n_{k} \leqslant n < n_{k + 1}$, par croissance des maxima, 
    $$M_{n} \leqslant \frac{\max_{i \leqslant n_{k + 1}}X_{i}}{\ln n_{k}} < a\,\frac{\ln n_{k + 1}}{\ln n_{k}} = a\,\frac{\ln(k + 1)}{\ln k} \to a,$$
     donc $\limsup M_{n} \leqslant a$, puis $\leqslant 1$ avec $a = 1 + \frac{1}{j}$ : $\boxed{M_{n} \xrightarrow{\text{p.s.}} 1}$. La sous-suite est nécessaire, car $\sum n^{1 - a}$ diverge pour $a \leqslant 2$ ; la croissance de $(\max_{i \leqslant n}X_{i})$ comble les trous.

    **2.** Pour $\varepsilon > 0$, $\mathbb{P}(U_{n} > \varepsilon) = \mathbb{P}(1 - X_{n} < \frac{n^{-2\alpha}}{\varepsilon^{2}}) = \min(1, \frac{n^{-2\alpha}}{\varepsilon^{2}}) \to 0$ : convergence $\boxed{\text{en probabilité}}$ pour tout $\alpha > 0$. Comme $\mathbb{E}[(1 - X)^{-1/2}] = \int_{0}^{1}\frac{\mathrm{d} x}{\sqrt{1 - x}} = 2$, $\mathbb{E}[U_{n}] = 2n^{-\alpha} \to 0$ : convergence $\boxed{\text{dans } L^{1}}$ pour tout $\alpha > 0$. Les évènements $\{U_{n} > \varepsilon\}$ sont indépendants, et $\sum_{n}n^{-2\alpha}$ converge si et seulement si $\alpha > \frac{1}{2}$ : par les deux parties du lemme de Borel-Cantelli, $U_{n} \to 0$ presque sûrement 
    $$\boxed{\text{si et seulement si } \alpha > \tfrac{1}{2}};$$
     pour $\alpha \leqslant \frac{1}{2}$, $U_{n} > A$ une infinité de fois pour tout $A$, et $\limsup U_{n} = +\infty$.

    **3.** Par indépendance, 
    $$\boxed{\mathbb{E}[Y_{n}] = \frac{1}{2}\mathbb{E}\big[\frac{1}{n + X_{n + 1}}\big] = \frac{1}{2}\ln\frac{n + 1}{n}}.$$
     Les variables $Y_{n}$ et $Y_{n + 1}$ dépendent toutes deux de $X_{n + 1}$ : si $Y_{n + 1} > \frac{1}{n + 2}$, alors $X_{n + 1} > \frac{n + 1}{n + 2}$, donc $Y_{n} < c_{n} = \frac{1}{n + (n + 1)/(n + 2)}$. L'évènement $\{Y_{n} \geqslant c_{n}\}$, de probabilité non nulle ($X_{n}$ voisin de $1$ et $X_{n + 1}$ voisin de $0$), est donc disjoint de $\{Y_{n + 1} > \frac{1}{n + 2}\}$, lui aussi de probabilité non nulle : 
    $$\boxed{\text{elles ne sont pas indépendantes}}.$$
     Les $Y_{2n}$, fonctions des paquets disjoints $(X_{2n}, X_{2n + 1})$, $\boxed{\text{sont indépendantes}}$ (chapitre 5, prop. 3).

    Comme $0 \leqslant Y_{n} \leqslant \frac{1}{n}$ :

    • pour $\alpha < 1$, $n^{\alpha}Y_{n} \leqslant n^{\alpha - 1} \to 0$, en tout point ;

    • pour $\alpha = 1$, $|nY_{n} - X_{n}| \leqslant \frac{1}{n}$, et $(X_{n})$ diverge presque sûrement (par Borel-Cantelli, $X_{n} > \frac{3}{4}$ et $X_{n} < \frac{1}{4}$ une infinité de fois) : pas de limite ;

    • pour $\alpha > 1$, $n^{\alpha}Y_{n} \geqslant \frac{n^{\alpha - 1}X_{n}}{2}$, et $X_{n} > \frac{1}{2}$ une infinité de fois, donc $\limsup = +\infty$. Si $1 < \alpha \leqslant 2$, $\sum\mathbb{P}(n^{\alpha - 1}X_{n} < c) = \sum cn^{1 - \alpha} = +\infty$ pour tout $c > 0$, et $n^{\alpha}Y_{n} \leqslant n^{\alpha - 1}X_{n} < c$ une infinité de fois : $\liminf = 0$, pas de limite. Si $\alpha > 2$, la série converge, $n^{\alpha - 1}X_{n} \to +\infty$, et $\boxed{n^{\alpha}Y_{n} \to +\infty}$ presque sûrement.

    En résumé, $n^{\alpha}Y_{n}$ converge presque sûrement vers $0$ si $\alpha < 1$, n'a pas de limite si $1 \leqslant \alpha \leqslant 2$, et tend vers $+\infty$ si $\alpha > 2$.

