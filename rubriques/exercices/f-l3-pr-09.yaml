  source: "Rubenthaler, chapitre 8, exercices 1 et 3 ; Durand, exercices 10.4 (partie théorique) et 4.39"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    *(Sommes d'exponentielles.)* Soit $(X_{k})$ indépendantes de loi $\mathcal{E}(a)$, et $T_{k} = X_{1} + \dots + X_{k}$, de loi $\Gamma(k, a)$.

    **1.** Montrer que $\frac{T_{k}}{k} \to \frac{1}{a}$ presque sûrement, et que $Z_{k} = \frac{aT_{k} - k}{\sqrt{k}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$. Pour $a = 1$, estimer $\mathbb{P}(T_{100} \geqslant 110)$.

    **2.** *Ampoules.* Les ampoules d'un lampadaire ont des durées de vie indépendantes de loi $\mathcal{E}(\lambda)$, et chaque ampoule grillée est aussitôt remplacée. On admet que le nombre $N$ d'ampoules grillées pendant une durée $T$ suit la loi $\mathcal{P}(\lambda T)$ (feuille 7). On pose $m = \lambda T$, supposé entier. Montrer que $\mathbb{P}(N \geqslant m + p) = \mathbb{P}(T_{m + p} \leqslant T)$ pour $p \in \mathbb{N}^{*}$, et donner une valeur approchée de cette probabilité pour $\lambda = 1$, $T = 20$ et $p = 5$. Combien d'ampoules faut-il acheter pour que la probabilité d'en manquer avant l'instant $T = 20$ soit inférieure à $0{,}05$ ?

    **3.** *Loi du khi-deux.* La loi $\chi^{2}(n)$ est celle de $G_{1}^{2} + \dots + G_{n}^{2}$, où les $G_{i}$ sont indépendantes de loi $\mathcal{N}(0, 1)$. Montrer que, pour $n$ grand, la fonction de répartition de $\chi^{2}(n)$ est approchée par $t \mapsto \Phi\big(\frac{t - n}{\sqrt{2n}}\big)$, et préciser en quel sens.
  corrige: |
    **1.** $\mathbb{E}[X_{1}] = \frac{1}{a}$ et $\operatorname{Var}(X_{1}) = \frac{1}{a^{2}}$ : $\frac{T_{k}}{k} \to \frac{1}{a}$ presque sûrement (th. 2), et $\frac{T_{k} - k/a}{\sqrt{k}/a} = Z_{k} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$ (th. 3). Pour $a = 1$, 
    $$\mathbb{P}(T_{100} \geqslant 110) = \mathbb{P}\Big(\frac{T_{100} - 100}{10} \geqslant 1\Big) \approx 1 - \Phi(1) \approx \boxed{0{,}159},$$
     très proche de la valeur exacte $0{,}158$ (loi $\Gamma(100, 1)$).

    **2.** $N \geqslant j$ si et seulement si les $j$ premières ampoules ont grillé avant l'instant $T$, c'est-à-dire $T_{j} \leqslant T$ : $\boxed{\mathbb{P}(N \geqslant m + p) = \mathbb{P}(T_{m + p} \leqslant T)}$. Pour $\lambda = 1$, $T = 20$, $p = 5$ : 
    $$\mathbb{P}(T_{25} \leqslant 20) = \mathbb{P}\Big(\frac{T_{25} - 25}{5} \leqslant -1\Big) \approx \Phi(-1) \approx \boxed{0{,}159},$$
     contre $\mathbb{P}(N \geqslant 25) \approx 0{,}157$ exactement. Avec $n$ ampoules, on en manque avant $T$ si $T_{n} \leqslant 20$, de probabilité approchée $\Phi(\frac{20 - n}{\sqrt{n}})$. La condition $\frac{n - 20}{\sqrt{n}} \geqslant 1{,}645$ donne $\sqrt{n} \geqslant \frac{1{,}645 + \sqrt{1{,}645^{2} + 80}}{2} \approx 5{,}37$, soit $\boxed{n \geqslant 29}$ ($0{,}065$ pour $n = 28$, $0{,}047$ pour $n = 29$). Le calcul exact, par la loi de Poisson, donne aussi $29$ ($0{,}053$ pour $28$, $0{,}034$ pour $29$).

    **3.** Les $G_{i}^{2}$ sont indépendantes, d'espérance $1$ et de variance $\mathbb{E}[G^{4}] - 1 = 3 - 1 = 2$ (chapitre 4, prop. 8). Par le th. 3, $\frac{\chi_{n}^{2} - n}{\sqrt{2n}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$, et comme la convergence des fonctions de répartition est uniforme (feuille 8, exercice 21), 
    $$\boxed{\sup_{t \in \mathbb{R}}\Big|\mathbb{P}(\chi_{n}^{2} \leqslant t) - \Phi\Big(\frac{t - n}{\sqrt{2n}}\Big)\Big| \xrightarrow[n \to +\infty]{} 0}.$$
     L'approximation est bonne en erreur absolue, uniformément en $t$, mais pas en erreur relative dans les queues ; la loi $\chi^{2}(n)$, dissymétrique, n'est bien approchée que pour $n$ assez grand.
