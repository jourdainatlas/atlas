  enonce: |
    Soit $(X_{k})$ indépendantes de loi $\mathcal{N}(m, \sigma^{2})$, où $\sigma$ est connu et $m$ inconnu.

    **1.** Montrer que $\sqrt{n}\,\frac{\bar{X}_{n} - m}{\sigma}$ suit exactement la loi $\mathcal{N}(0, 1)$.

    **2.** Déduire de la feuille 8 (exercice 5) que, pour $\varepsilon > 0$, 
    $$\mathbb{P}(|\bar{X}_{n} - m| \leqslant \varepsilon) \geqslant 1 - \sqrt{\frac{2}{n\pi}}\,\frac{\sigma}{\varepsilon}\exp\Big(-\frac{n\varepsilon^{2}}{2\sigma^{2}}\Big).$$

    **3.** Pour $\varepsilon = 0{,}01$, $\sigma = 1$ et $n = 10\,000$, minorer $\mathbb{P}(|\bar{X}_{n} - m| \leqslant \varepsilon)$, et comparer à la valeur exacte. Pour quels $n$ cette minoration est-elle meilleure que celle de Bienaymé-Tchebychev ?
  corrige: |
    **1.** $S_{n} \sim \mathcal{N}(nm, n\sigma^{2})$ (chapitre 6, prop. 12), donc $\bar{X}_{n} \sim \mathcal{N}(m, \frac{\sigma^{2}}{n})$ et $\boxed{\sqrt{n}\,\frac{\bar{X}_{n} - m}{\sigma} \sim \mathcal{N}(0, 1)}$ exactement (chapitre 4, prop. 9).

    **2.** Avec $\delta = \frac{\varepsilon\sqrt{n}}{\sigma}$, la majoration de Mills (feuille 8, exercice 5) donne 
    $$\mathbb{P}(|\bar{X}_{n} - m| > \varepsilon) = \mathbb{P}(|G| > \delta) \leqslant \frac{2}{\delta}\cdot\frac{\mathrm{e}^{-\delta^{2}/2}}{\sqrt{2\pi}} = \sqrt{\frac{2}{n\pi}}\,\frac{\sigma}{\varepsilon}\exp\Big(-\frac{n\varepsilon^{2}}{2\sigma^{2}}\Big),$$
     ce qui est l'inégalité demandée.

    **3.** Ici $\delta = 1$ : la minoration vaut $1 - \sqrt{\frac{2}{\pi}}\mathrm{e}^{-1/2} \approx \boxed{0{,}516}$, contre la valeur exacte $2\Phi(1) - 1 \approx 0{,}683$. Bienaymé-Tchebychev donne $1 - \frac{\sigma^{2}}{n\varepsilon^{2}} = 1 - \frac{1}{\delta^{2}} = 0$. La minoration de la question 2 est meilleure si $\sqrt{\frac{2}{\pi}}\frac{\mathrm{e}^{-\delta^{2}/2}}{\delta} < \frac{1}{\delta^{2}}$, c'est-à-dire $\delta\mathrm{e}^{-\delta^{2}/2} < \sqrt{\frac{\pi}{2}}$ ; or le maximum de $\delta\mathrm{e}^{-\delta^{2}/2}$ est $\mathrm{e}^{-1/2} \approx 0{,}61 < 1{,}25$ : elle est $\boxed{\text{toujours meilleure}}$. L'hypothèse gaussienne donne une décroissance exponentielle en $n$, au lieu de $\frac{1}{n}$.
- id: "l3-pr-09-21"
