  enonce: |
    *(Formule de Stirling.)* Pour $a > 0$, soit $X_{a} \sim \mathcal{P}(a)$ et $Z_{a} = \frac{X_{a} - a}{\sqrt{a}}$.

    **1.** Calculer la fonction caractéristique de $Z_{a}$, et montrer directement que $Z_{a} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$ quand $a \to +\infty$.

    **2.** On note $x^{-} = \max(-x, 0)$. Montrer que $\mathbb{P}(Z_{n}^{-} > x) \leqslant \min(1, \frac{1}{x^{2}})$ pour $x > 0$, et que $\mathbb{E}[Z_{n}^{-}] \to \mathbb{E}[G^{-}]$, où $G \sim \mathcal{N}(0, 1)$ (feuille 8, exercice 21). Calculer $\mathbb{E}[G^{-}]$.

    **3.** Montrer que $\mathbb{E}[Z_{n}^{-}] = \mathrm{e}^{-n}\frac{n^{n + 1/2}}{n!}$ pour $n \in \mathbb{N}^{*}$, et retrouver la formule de Stirling : 
    $$n! \sim \sqrt{2\pi n}\,n^{n}\mathrm{e}^{-n}.$$
  corrige: |
    **1.** $\varphi_{X_{a}}(t) = \exp(a(\mathrm{e}^{it} - 1))$, donc, avec $u = \frac{t}{\sqrt{a}}$, 
    $$\varphi_{Z_{a}}(t) = \mathrm{e}^{-it\sqrt{a}}\varphi_{X_{a}}\Big(\frac{t}{\sqrt{a}}\Big) = \exp\big(a(\mathrm{e}^{iu} - 1 - iu)\big) = \exp\Big(-\frac{t^{2}}{2} + O\Big(\frac{|t|^{3}}{\sqrt{a}}\Big)\Big) \xrightarrow[a \to +\infty]{} \mathrm{e}^{-t^{2}/2},$$
     car $|\mathrm{e}^{iu} - 1 - iu + \frac{u^{2}}{2}| \leqslant \frac{|u|^{3}}{6}$. Par le théorème de Lévy (chapitre 8, th. 3), appliqué le long de toute suite $a_{k} \to +\infty$, $\boxed{Z_{a} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)}$.

    **2.** Si $Z_{n}^{-} > x > 0$, alors $|Z_{n}| > x$ ; comme $\operatorname{Var}(Z_{n}) = 1$, Bienaymé-Tchebychev donne $\mathbb{P}(Z_{n}^{-} > x) \leqslant \min(1, \frac{1}{x^{2}})$. Par le chapitre 4 (prop. 6), $\mathbb{E}[Z_{n}^{-}] = \int_{0}^{+\infty}\mathbb{P}(Z_{n}^{-} > x)\,\mathrm{d} x$ ; pour $x > 0$, $\mathbb{P}(Z_{n}^{-} > x) = \mathbb{P}(Z_{n} < -x) \to \Phi(-x)$, et la domination par la fonction intégrable $\min(1, \frac{1}{x^{2}})$ donne $\mathbb{E}[Z_{n}^{-}] \to \int_{0}^{+\infty}\Phi(-x)\,\mathrm{d} x = \mathbb{E}[G^{-}]$. (C'est aussi un cas de la feuille 8, exercice 21, avec $r = 2$.) Enfin 
    $$\mathbb{E}[G^{-}] = \int_{-\infty}^{0}(-x)\frac{\mathrm{e}^{-x^{2}/2}}{\sqrt{2\pi}}\,\mathrm{d} x = \boxed{\frac{1}{\sqrt{2\pi}}}.$$

    **3.** $\mathbb{E}[Z_{n}^{-}] = \frac{1}{\sqrt{n}}\mathbb{E}[(n - X_{n})^{+}] = \frac{\mathrm{e}^{-n}}{\sqrt{n}}\sum_{k = 0}^{n}(n - k)\frac{n^{k}}{k!}$. Or $(n - k)\frac{n^{k}}{k!} = \frac{n^{k + 1}}{k!} - \frac{n^{k}}{(k - 1)!}$ pour $k \geqslant 1$, et la somme télescope en $\frac{n^{n + 1}}{n!}$ : $\boxed{\mathbb{E}[Z_{n}^{-}] = \mathrm{e}^{-n}\frac{n^{n + 1/2}}{n!}}$. Avec la question 2, $\mathrm{e}^{-n}\frac{n^{n + 1/2}}{n!} \to \frac{1}{\sqrt{2\pi}}$, c'est-à-dire $\boxed{n! \sim \sqrt{2\pi n}\,n^{n}\mathrm{e}^{-n}}$. Numériquement, $\mathbb{E}[Z_{n}^{-}]$ vaut $0{,}3679$ ; $0{,}3956$ ; $0{,}3986$ pour $n = 1$, $10$, $100$, contre $\frac{1}{\sqrt{2\pi}} \approx 0{,}3989$.
- id: "l3-pr-09-13"
  feuille: "f-l3-pr-09"
  numero: 13
  partie: "Théorème central limite : calculs"
  etoiles: 1
