  source: "Durand, exercices 5.35 et 5.9"
  page_enonce: 6
  page_corrige: 11
  enonce: |
    *(Dimensionner.)*

    **1.** Chacun de $1600$ voyageurs choisit, indépendamment des autres et avec la probabilité $\frac{1}{2}$, l'un de deux trains. Combien de places faut-il dans chaque train pour que la probabilité qu'un voyageur au moins reste debout soit inférieure à $0{,}003$ ? Donner une approximation normale, puis vérifier le seuil exact (calculatrice).

    **2.** Dans une forêt, les champignons non comestibles sont quatre fois plus nombreux que les comestibles, et un dixième des comestibles sont des cèpes. On cueille $100$ champignons au hasard. Donner une valeur approchée de la probabilité d'avoir entre $15$ et $25$ champignons comestibles, puis de celle d'avoir au moins trois cèpes ($\mathrm{e}^{-2} \approx 0{,}135$).

    **3.** Combien faut-il cueillir de champignons pour que, avec une probabilité d'au moins $0{,}95$, la proportion de comestibles soit comprise entre $0{,}15$ et $0{,}25$ ? Comparer la réponse approchée et le calcul exact : la probabilité exacte est-elle une fonction croissante du nombre $n$ de champignons cueillis ?
  corrige: |
    **1.** Soit $X \sim \mathcal{B}(1600, \frac{1}{2})$ le nombre de voyageurs du premier train, d'espérance $800$ et d'écart type $20$. Avec $N$ places par train, un voyageur au moins reste debout si $X > N$ ou $1600 - X > N$, c'est-à-dire $|X - 800| > N - 800$. Par la prop. 2, 
    $$\mathbb{P}(|X - 800| > N - 800) \approx 2\Big(1 - \Phi\Big(\frac{N - 800}{20}\Big)\Big),$$
     inférieur à $0{,}003$ si $\frac{N - 800}{20} \geqslant 2{,}97,$ soit $N \geqslant 859{,}4$, donc $\boxed{N = 860}$ places. Le calcul exact donne $0{,}0029$ pour $N = 859$ et $0{,}0034$ pour $N = 858$ : $\boxed{859 \text{ places suffisent}}$. Avec la correction de continuité, $\mathbb{P}(X \geqslant N + 1) \approx 1 - \Phi(\frac{N + 0{,}5 - 800}{20})$, on trouve aussi $859$.

    **2.** Le nombre $C$ de comestibles suit $\mathcal{B}(100, \frac{1}{5})$, d'espérance $20$ et d'écart type $4$, et 
    $$\mathbb{P}(15 \leqslant C \leqslant 25) \approx 2\Phi(1{,}25) - 1 \approx \boxed{0{,}79}$$
     (exactement $0{,}832$ ; la correction de continuité, avec $\frac{5{,}5}{4}$, donne $0{,}831$). Le nombre de cèpes suit $\mathcal{B}(100, \frac{1}{50})$, voisine de $\mathcal{P}(2)$ (chapitre 3, prop. 6) : $\mathbb{P}(\geqslant 3) \approx 1 - \mathrm{e}^{-2}(1 + 2 + 2) \approx \boxed{0{,}325}$ (exactement $0{,}323$). Pour un évènement rare, c'est l'approximation de Poisson, et non l'approximation normale, qui convient.

    **3.** $\mathbb{P}(|\frac{C_{n}}{n} - 0{,}2| \leqslant 0{,}05) \approx 2\Phi\big(\frac{0{,}05\sqrt{n}}{0{,}4}\big) - 1 \geqslant 0{,}95$ si $\sqrt{n} \geqslant 15{,}68$, soit $\boxed{n \geqslant 246}$. La probabilité exacte *n'est pas monotone* en $n$ : le nombre d'entiers de $[0{,}15n, 0{,}25n]$ varie irrégulièrement. Elle dépasse $0{,}95$ dès $n = 232$, mais retombe en dessous pour $n = 234$ à $239$, $241$ à $243$ et $n = 247$ ($0{,}944$), et reste au-dessus à partir de $\boxed{n = 248}$ (vérifié jusqu'à $400$). La réponse « minimale » dépend donc de la question posée : le premier $n$ qui convient, ou le seuil au-delà duquel tous conviennent.
- id: "l3-pr-09-17"
  feuille: "f-l3-pr-09"
  numero: 17
  partie: "Théorème central limite : calculs"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [théorème central limite]
  noeuds: [p-tcl]
  notions: [convergence-loi, loi-normale]
  source: "Durand, exercices 2.48 (4) et 10.37 (partie théorique)"
  page_enonce: 6
  page_corrige: 12
  enonce: |
    *(Correction de continuité.)*

    **1.** Soit $S \sim \mathcal{B}(100\,;\,0{,}3)$. Comparer, sur un même dessin, la fonction de répartition de $\frac{S - 30}{\sqrt{21}}$ et $\Phi$. Où l'écart est-il le plus grand ? Montrer que $\Phi\big(\frac{k + 1/2 - 30}{\sqrt{21}}\big)$ approche mieux $\mathbb{P}(S \leqslant k)$ que $\Phi\big(\frac{k - 30}{\sqrt{21}}\big)$, et l'expliquer.

    **2.** Soit $Y \sim \mathcal{P}(100)$. Donner une approximation normale de $\mathbb{P}(Y > 140)$, avec et sans correction de continuité, et la comparer à la valeur exacte $6{,}4 \cdot 10^{-5}$ et aux bornes obtenues à la feuille 8 (exercice 1). Que dit le théorème central limite des *probabilités relatives* des grands écarts ?
  corrige: |
    **1.** La fonction de répartition de $\frac{S - 30}{\sqrt{21}}$ est en escalier, avec un saut de hauteur $\mathbb{P}(S = k)$ au point $\frac{k - 30}{\sqrt{21}}$ (figure). Le plus grand écart avec $\Phi$, $\boxed{0{,}049}$, est atteint au saut central $k = 30$ : $\mathbb{P}(S \leqslant 30) = 0{,}549$ contre $\Phi(0) = 0{,}5$. Il vaut à peu près la moitié du saut $\mathbb{P}(S = 30) \approx 0{,}087$, car $\Phi$ passe au milieu des marches.

    La valeur $\mathbb{P}(S \leqslant k) = \mathbb{P}(S < k + 1)$ est la même sur toute la marche $[k, k + 1[$ ; vue comme l'aire d'un histogramme de barres de largeur $1$ centrées aux entiers, elle s'arrête au bord $k + \frac{1}{2}$. Il est donc naturel de la comparer à $\Phi$ en ce point : l'écart maximal tombe alors à $\boxed{0{,}006}$. Par exemple, $\mathbb{P}(S \leqslant 25) = 0{,}163$, contre $0{,}138$ sans correction et $0{,}163$ avec.

    1.5em

    ![Figure](documents/figures/15fb832933b55d94.svg)

    La fonction de répartition de la binomiale centrée réduite $\mathcal{B}(100\,;\,0{,}3)$ (en bleu) et $\Phi$ (en orange). La courbe traverse chaque marche à peu près en son milieu ; le segment rouge marque l'écart maximal $0{,}049$, au saut le plus haut.

    **2.** $\mathbb{P}(Y > 140) = \mathbb{P}(Y \geqslant 141)$, avec $\mathbb{E}[Y] = 100$ et $\sigma = 10$ : sans correction, $1 - \Phi(4) \approx \boxed{3{,}2 \cdot 10^{-5}}$ ; avec correction, $1 - \Phi(4{,}05) \approx \boxed{2{,}6 \cdot 10^{-5}}$. La valeur exacte $6{,}4 \cdot 10^{-5}$ est de deux à deux fois et demie plus grande, et la correction aggrave même l'erreur. Les bornes de la feuille 8 (Markov $0{,}71$, Bienaymé-Tchebychev $0{,}059$, exponentielle $8{,}2 \cdot 10^{-4}$) sont des majorations sûres, mais grossières.

    Le théorème central limite contrôle l'erreur *absolue*, de l'ordre de $\frac{1}{\sqrt{n}}$ (théorème de Berry-Esseen, admis au cours) ; à quatre écarts types, la probabilité cherchée est bien plus petite que cette erreur, et l'erreur *relative* n'est pas contrôlée. Ici, la loi de Poisson a une queue droite plus lourde que la normale (elle est dissymétrique), d'où la sous-estimation.
