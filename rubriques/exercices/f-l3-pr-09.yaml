  enonce: |
    *(Médiane empirique.)* Soit $X_{1}$, …, $X_{2n - 1}$ indépendantes uniformes sur $[0, 1]$, et $M_{n}$ leur médiane, c'est-à-dire la $n$-ième dans l'ordre croissant. Soit $t > 0$, $n$ assez grand pour que $\frac{t}{\sqrt{8n}} < \frac{1}{2}$, et $a_{n} = \frac{1}{2} + \frac{t}{\sqrt{8n}}$. On pose 
    $$Y_{i} = \mathbf{1}_{\{X_{i} \leqslant a_{n}\}} - \mathbf{1}_{\{X_{i} > a_{n}\}}, \qquad \varepsilon_{i} = \mathbf{1}_{\{X_{i} \leqslant 1/2\}} - \mathbf{1}_{\{X_{i} > 1/2\}}, \qquad S = \sum_{i = 1}^{2n - 1}Y_{i}, \qquad \tilde{S} = \sum_{i = 1}^{2n - 1}\varepsilon_{i}.$$

    **1.** Montrer que $\mathbb{P}(S \geqslant 0) = \mathbb{P}(M_{n} \leqslant a_{n})$, et donner la limite en loi de $\frac{\tilde{S}}{\sqrt{2n - 1}}$.

    **2.** Montrer que $\frac{S - \tilde{S}}{2}$ suit la loi binomiale $\mathcal{B}\big(2n - 1, \frac{t}{\sqrt{8n}}\big)$, puis que $\frac{S - \tilde{S}}{\sqrt{2n - 1}} \xrightarrow{\mathbb{P}} t$. En déduire la limite en loi de $\frac{S}{\sqrt{2n - 1}}$ (feuille 8, exercice 20).

    **3.** Conclure que $\sqrt{8n}\big(M_{n} - \frac{1}{2}\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)$, en traitant aussi le cas $t \leqslant 0$. Comparer la précision de la médiane empirique et celle de la moyenne empirique $\bar{X}_{2n - 1}$ pour estimer le centre $\frac{1}{2}$.
  corrige: |
    **1.** $S = 2\#\{i \,;\, X_{i} \leqslant a_{n}\} - (2n - 1)$, donc $S \geqslant 0$ équivaut à $\#\{i \,;\, X_{i} \leqslant a_{n}\} \geqslant n$, c'est-à-dire à $M_{n} \leqslant a_{n}$ : $\boxed{\mathbb{P}(S \geqslant 0) = \mathbb{P}(M_{n} \leqslant a_{n})}$. Les $\varepsilon_{i}$ sont indépendantes, valent $\pm 1$ avec probabilité $\frac{1}{2}$, centrées et de variance $1$ : $\boxed{\frac{\tilde{S}}{\sqrt{2n - 1}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)}$ (th. 3).

    **2.** $Y_{i} - \varepsilon_{i}$ vaut $2$ si $\frac{1}{2} < X_{i} \leqslant a_{n}$ et $0$ sinon : $\frac{S - \tilde{S}}{2} = \#\{i \,;\, \frac{1}{2} < X_{i} \leqslant a_{n}\} \sim \boxed{\mathcal{B}\big(2n - 1, q_{n}\big)}$, avec $q_{n} = \frac{t}{\sqrt{8n}}$. Alors 
    $$\mathbb{E}\Big[\frac{S - \tilde{S}}{\sqrt{2n - 1}}\Big] = \frac{2(2n - 1)q_{n}}{\sqrt{2n - 1}} = 2t\sqrt{\frac{2n - 1}{8n}} \to t, \qquad \operatorname{Var}\Big(\frac{S - \tilde{S}}{\sqrt{2n - 1}}\Big) = 4q_{n}(1 - q_{n}) \to 0,$$
     donc $\frac{S - \tilde{S}}{\sqrt{2n - 1}} \to t$ dans $L^{2}$, donc en probabilité. Par le lemme de Slutsky (feuille 8, exercice 20), $\boxed{\frac{S}{\sqrt{2n - 1}} \xrightarrow{\mathcal{L}} \mathcal{N}(t, 1)}$.

    **3.** Pour $t > 0$, 
    $$\mathbb{P}\Big(\sqrt{8n}\Big(M_{n} - \frac{1}{2}\Big) \leqslant t\Big) = \mathbb{P}(M_{n} \leqslant a_{n}) = \mathbb{P}\Big(\frac{S}{\sqrt{2n - 1}} \geqslant 0\Big),$$
     qui tend vers $\mathbb{P}(t + G \geqslant 0) = \Phi(t)$, car $0$ est un point de continuité. Pour $t < 0$, le même raisonnement s'applique avec $\frac{\tilde{S} - S}{2} = \#\{i \,;\, a_{n} < X_{i} \leqslant \frac{1}{2}\} \sim \mathcal{B}(2n - 1, \frac{|t|}{\sqrt{8n}})$, qui donne encore $\frac{S}{\sqrt{2n - 1}} \xrightarrow{\mathcal{L}} \mathcal{N}(t, 1)$. Pour $t = 0$, $\mathbb{P}(\tilde{S} \geqslant 0) = \frac{1}{2}$ par symétrie, $2n - 1$ étant impair. Donc $\boxed{\sqrt{8n}\big(M_{n} - \frac{1}{2}\big) \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)}$.

    La médiane empirique fluctue donc avec une variance d'environ $\frac{1}{8n}$, et la moyenne $\bar{X}_{2n - 1}$ avec la variance $\frac{1/12}{2n - 1} \approx \frac{1}{24n}$, trois fois plus petite : pour la loi uniforme, la moyenne est meilleure. La médiane a l'avantage de la robustesse : elle reste pertinente sans moment, par exemple pour la loi de Cauchy, où la moyenne empirique ne converge pas (chapitre 6, prop. 12).
- id: "l3-pr-09-24"
  feuille: "f-l3-pr-09"
  numero: 24
  partie: "Autour de la démonstration du théorème central limite"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [démonstration du TCL]
  noeuds: [fo-tcl, fo-caracteristiques]
  notions: [fonction-caracteristique, convergence-loi]
  source: "Durand, exercice 4.8"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *(Petits pas.)* Soit $a > 0$ et $(m_{n})$ une suite réelle telle que $nm_{n} \to m$. Pour tout $n$, soit $X_{n, 1}$, …, $X_{n, n}$ indépendantes, de même loi, à valeurs dans $\{-\frac{a}{\sqrt{n}}, \frac{a}{\sqrt{n}}\}$ et d'espérance $m_{n}$, et $Y_{n} = X_{n, 1} + \dots + X_{n, n}$. Montrer que $Y_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(m, a^{2})$. Pourquoi le théorème 3 ne s'applique-t-il pas directement ?
  corrige: |
    Soit $\pi_{n} = \mathbb{P}(X_{n, 1} = \frac{a}{\sqrt{n}})$ : $\frac{a}{\sqrt{n}}(2\pi_{n} - 1) = m_{n}$, donc $2\pi_{n} - 1 = \frac{m_{n}\sqrt{n}}{a}$, qui tend vers $0$. La fonction caractéristique de $X_{n, 1}$ est 
    $$\varphi_{n}(t) = \cos\frac{at}{\sqrt{n}} + i\,\frac{m_{n}\sqrt{n}}{a}\sin\frac{at}{\sqrt{n}} = 1 - \frac{a^{2}t^{2}}{2n} + im_{n}t + o\Big(\frac{1}{n}\Big) = 1 + \frac{z_{n}}{n},$$
     avec $z_{n} \to z = imt - \frac{a^{2}t^{2}}{2}$ (car $nm_{n} \to m$). Pour $t \neq 0$ et $n$ grand, $|1 + \frac{z}{n}|^{2} = 1 - \frac{a^{2}t^{2}}{n} + O(\frac{1}{n^{2}}) \leqslant 1$, et la prop. 1 donne $|\varphi_{n}(t)^{n} - (1 + \frac{z}{n})^{n}| \leqslant n\cdot\frac{|z_{n} - z|}{n} \to 0$. Comme $(1 + \frac{z}{n})^{n} \to \mathrm{e}^{z}$, on obtient $\varphi_{Y_{n}}(t) \to \mathrm{e}^{imt - a^{2}t^{2}/2}$, fonction caractéristique de $\mathcal{N}(m, a^{2})$ (chapitre 6, prop. 9), et par le théorème de Lévy, $\boxed{Y_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(m, a^{2})}$.

    Le th. 3 porte sur les sommes partielles d'*une* suite de variables de même loi ; ici la loi des $X_{n, k}$ dépend de $n$ (tableau triangulaire), et une dérive $m$ apparaît à la limite. La démonstration du cours s'adapte pourtant mot pour mot.
- id: "l3-pr-09-25"
  feuille: "f-l3-pr-09"
  numero: 25
  partie: "Autour de la démonstration du théorème central limite"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [démonstration du TCL]
  noeuds: [fo-tcl, fo-caracteristiques]
  notions: [fonction-caracteristique, convergence-loi, derivee-successive]
  source: "Bordeaux, DM2, problème II"
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *(Méthode de Lindeberg.)* Soit $(X_{n})$ indépendantes de même loi, centrées, réduites, avec $\mathbb{E}[|X_{1}|^{3}]$ fini, et $(Z_{n})$ des variables indépendantes de loi $\mathcal{N}(0, 1)$, indépendantes des $X_{n}$ ; soit $Z \sim \mathcal{N}(0, 1)$. On remplace un à un les $X_{k}$ par les $Z_{k}$ : on pose, pour $1 \leqslant k \leqslant n$, 
    $$\Sigma_{k} = X_{1} + \dots + X_{k - 1} + Z_{k + 1} + \dots + Z_{n}$$
     (la première somme est vide si $k = 1$, la seconde si $k = n$). Soit $f$ de classe $\mathcal{C}^{3}$, bornée à dérivées bornées, et $M = \sup|f'''|$.

    **1.** Montrer que $\frac{\Sigma_{1} + Z_{1}}{\sqrt{n}}$ a même loi que $Z$, et que 
    $$\mathbb{E}\Big[f\Big(\frac{S_{n}}{\sqrt{n}}\Big)\Big] - \mathbb{E}[f(Z)] = \sum_{k = 1}^{n}\Big(\mathbb{E}\Big[f\Big(\frac{\Sigma_{k} + X_{k}}{\sqrt{n}}\Big)\Big] - \mathbb{E}\Big[f\Big(\frac{\Sigma_{k} + Z_{k}}{\sqrt{n}}\Big)\Big]\Big).$$

    **2.** À l'aide de la formule de Taylor-Lagrange $f(x + h) = f(x) + hf'(x) + \frac{h^{2}}{2}f''(x) + R$, avec $|R| \leqslant \frac{M}{6}|h|^{3}$, montrer que chaque terme de la somme est majoré en valeur absolue par $\frac{M}{6n^{3/2}}\mathbb{E}[|X_{1}|^{3} + |Z|^{3}]$.

    **3.** En déduire que $\mathbb{E}[f(\frac{S_{n}}{\sqrt{n}})] \to \mathbb{E}[f(Z)]$, puis le théorème central limite sous l'hypothèse $\mathbb{E}[|X_{1}|^{3}] < +\infty$ (feuille 8, exercice 21). Quelle vitesse de convergence obtient-on pour une telle fonction $f$ ?
  corrige: |
    **1.** $\Sigma_{1} + Z_{1} = Z_{1} + \dots + Z_{n} \sim \mathcal{N}(0, n)$ (chapitre 6, prop. 12), donc $\frac{\Sigma_{1} + Z_{1}}{\sqrt{n}} \sim \mathcal{N}(0, 1)$. Pour $k < n$, $\Sigma_{k} + X_{k} = X_{1} + \dots + X_{k} + Z_{k + 1} + \dots + Z_{n} = \Sigma_{k + 1} + Z_{k + 1}$, et $\Sigma_{n} + X_{n} = S_{n}$. La somme $\boxed{\text{télescope}}$ et vaut $\mathbb{E}[f(\frac{S_{n}}{\sqrt{n}})] - \mathbb{E}[f(\frac{\Sigma_{1} + Z_{1}}{\sqrt{n}})] = \mathbb{E}[f(\frac{S_{n}}{\sqrt{n}})] - \mathbb{E}[f(Z)]$.

    **2.** Avec $x = \frac{\Sigma_{k}}{\sqrt{n}}$ et $h = \frac{X_{k}}{\sqrt{n}}$, puis $h = \frac{Z_{k}}{\sqrt{n}}$ : 
    $$f\Big(\frac{\Sigma_{k} + X_{k}}{\sqrt{n}}\Big) = f(x) + \frac{X_{k}}{\sqrt{n}}f'(x) + \frac{X_{k}^{2}}{2n}f''(x) + R_{X}, \qquad |R_{X}| \leqslant \frac{M|X_{k}|^{3}}{6n^{3/2}},$$
     et de même avec $Z_{k}$ et un reste $R_{Z}$. La variable $\Sigma_{k}$ est indépendante de $X_{k}$ et de $Z_{k}$ (paquets disjoints, chapitre 5, prop. 3), et $f'$, $f''$ sont bornées. Donc $\mathbb{E}[X_{k}f'(x)] = \mathbb{E}[X_{k}]\,\mathbb{E}[f'(x)] = 0 = \mathbb{E}[Z_{k}f'(x)]$, et $\mathbb{E}[X_{k}^{2}f''(x)] = \mathbb{E}[f''(x)] = \mathbb{E}[Z_{k}^{2}f''(x)]$, les deux variables étant centrées réduites. Les termes d'ordre $0$, $1$ et $2$ se compensent, et la différence vaut $\mathbb{E}[R_{X}] - \mathbb{E}[R_{Z}]$, majorée en valeur absolue par $\boxed{\frac{M}{6n^{3/2}}\mathbb{E}[|X_{1}|^{3} + |Z|^{3}]}$.

    **3.** En sommant les $n$ termes, $\big|\mathbb{E}[f(\frac{S_{n}}{\sqrt{n}})] - \mathbb{E}[f(Z)]\big| \leqslant \frac{M\,\mathbb{E}[|X_{1}|^{3} + |Z|^{3}]}{6\sqrt{n}} \to 0$. Par la feuille 8 (exercice 21 (1)), la convergence de $\mathbb{E}[f(Z_{n})]$ pour toutes ces fonctions $f$ entraîne celle des fonctions de répartition : $\boxed{\frac{S_{n}}{\sqrt{n}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, 1)}$. Pour une fonction $f$ fixée, la vitesse est 
    $$\boxed{O\big(\tfrac{1}{\sqrt{n}}\big)};$$
     pour les fonctions de répartition, le lissage fait perdre de la précision, et c'est le théorème de Berry-Esseen qui rend la vitesse $\frac{1}{\sqrt{n}}$. La méthode ne fait appel ni aux fonctions caractéristiques ni au théorème de Lévy.
- id: "l3-pr-09-26"
  feuille: "f-l3-pr-09"
  numero: 26
  partie: "Autour de la démonstration du théorème central limite"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [démonstration du TCL]
  noeuds: [fo-tcl, fo-caracteristiques]
  notions: [fonction-caracteristique, convergence-loi]
  source: "Durand, exercice 4.9"
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *(Théorème de Lindeberg-Feller.)* Pour tout $n \geqslant 1$, soit $X_{n, 1}$, …, $X_{n, n}$ des variables centrées, indépendantes, de variances $\sigma_{n, m}^{2} = \mathbb{E}[X_{n, m}^{2}]$, et $S_{n} = X_{n, 1} + \dots + X_{n, n}$. On suppose que 
    $$\sum_{m = 1}^{n}\sigma_{n, m}^{2} \xrightarrow[n \to +\infty]{} \sigma^{2} > 0 \qquad \text{et} \qquad \forall \varepsilon > 0, \quad \sum_{m = 1}^{n}\mathbb{E}\big[X_{n, m}^{2}\mathbf{1}_{\{|X_{n, m}| > \varepsilon\}}\big] \xrightarrow[n \to +\infty]{} 0.$$

    **1.** Montrer que ces hypothèses sont satisfaites par $X_{n, m} = \frac{X_{m}}{\sqrt{n}}$, où les $X_{m}$ sont indépendantes, de même loi, centrées et de variance $\sigma^{2}$.

    **2.** On fixe $t \in \mathbb{R}$, et l'on pose $z_{n, m} = \mathbb{E}[\mathrm{e}^{itX_{n, m}}]$ et $w_{n, m} = 1 - \frac{\sigma_{n, m}^{2}t^{2}}{2}$. Montrer que, pour $x$ réel, 
    $$\Big|\mathrm{e}^{ix} - 1 - ix + \frac{x^{2}}{2}\Big| \leqslant \min\Big(\frac{|x|^{3}}{6}, x^{2}\Big),$$
     puis que, pour tout $\varepsilon > 0$, 
    $$|z_{n, m} - w_{n, m}| \leqslant \frac{\varepsilon|t|^{3}}{6}\sigma_{n, m}^{2} + t^{2}\,\mathbb{E}\big[X_{n, m}^{2}\mathbf{1}_{\{|X_{n, m}| > \varepsilon\}}\big], \qquad \text{et} \qquad \sum_{m = 1}^{n}|z_{n, m} - w_{n, m}| \xrightarrow[n \to +\infty]{} 0.$$

    **3.** Montrer que $\max_{m \leqslant n}\sigma_{n, m}^{2} \to 0$, puis que $\prod_{m = 1}^{n}w_{n, m} \to \mathrm{e}^{-\sigma^{2}t^{2}/2}$. Conclure que $S_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(0, \sigma^{2})$.
  corrige: |
    **1.** $\sum_{m}\sigma_{n, m}^{2} = n\cdot\frac{\sigma^{2}}{n} = \sigma^{2}$, et $\sum_{m}\mathbb{E}[X_{n, m}^{2}\mathbf{1}_{\{|X_{n, m}| > \varepsilon\}}] = \mathbb{E}[X_{1}^{2}\mathbf{1}_{\{|X_{1}| > \varepsilon\sqrt{n}\}}] \to 0$ par convergence dominée ($X_{1}^{2}$ intégrable). Le résultat donne alors $\frac{S_{n}}{\sqrt{n}} \xrightarrow{\mathcal{L}} \mathcal{N}(0, \sigma^{2})$ : c'est le th. 3, que le théorème de Lindeberg-Feller $\boxed{\text{généralise}}$.

    **2.** Par la formule de Taylor avec reste intégral, $\mathrm{e}^{ix} - 1 - ix + \frac{x^{2}}{2} = \frac{i^{3}}{2}\int_{0}^{x}(x - s)^{2}\mathrm{e}^{is}\,\mathrm{d} s$, de module au plus $\frac{|x|^{3}}{6}$ ; et $|\mathrm{e}^{ix} - 1 - ix| \leqslant \frac{x^{2}}{2}$ de même, d'où le majorant $x^{2}$. Comme $X_{n, m}$ est centrée, $z_{n, m} - w_{n, m} = \mathbb{E}[\mathrm{e}^{itX} - 1 - itX + \frac{t^{2}X^{2}}{2}]$ avec $X = X_{n, m}$, et en séparant $\{|X| \leqslant \varepsilon\}$ et $\{|X| > \varepsilon\}$, 
    $$|z_{n, m} - w_{n, m}| \leqslant \mathbb{E}\Big[\frac{|t|^{3}|X|^{3}}{6}\mathbf{1}_{\{|X| \leqslant \varepsilon\}}\Big] + t^{2}\,\mathbb{E}[X^{2}\mathbf{1}_{\{|X| > \varepsilon\}}] \leqslant \frac{\varepsilon|t|^{3}}{6}\sigma_{n, m}^{2} + t^{2}\,\mathbb{E}[X^{2}\mathbf{1}_{\{|X| > \varepsilon\}}].$$
     En sommant, la limite supérieure de $\sum_{m}|z_{n, m} - w_{n, m}|$ est au plus $\frac{\varepsilon|t|^{3}\sigma^{2}}{6}$, pour tout $\varepsilon$ : elle est $\boxed{\text{nulle}}$.

    **3.** $\sigma_{n, m}^{2} \leqslant \varepsilon^{2} + \mathbb{E}[X_{n, m}^{2}\mathbf{1}_{\{|X_{n, m}| > \varepsilon\}}]$, donc $\limsup_{n}\max_{m}\sigma_{n, m}^{2} \leqslant \varepsilon^{2}$ : $\boxed{\max_{m}\sigma_{n, m}^{2} \to 0}$. Pour $n$ grand, $x_{m} = \frac{\sigma_{n, m}^{2}t^{2}}{2} \in [0, \frac{1}{2}]$, et $|\ln(1 - x) + x| \leqslant x^{2}$ sur $[0, \frac{1}{2}]$. Donc 
    $$\Big|\sum_{m}\ln w_{n, m} + \sum_{m}x_{m}\Big| \leqslant \sum_{m}x_{m}^{2} \leqslant \max_{m}x_{m}\cdot\sum_{m}x_{m} \to 0, \qquad \sum_{m}x_{m} \to \frac{\sigma^{2}t^{2}}{2},$$
     et $\boxed{\prod_{m}w_{n, m} \to \mathrm{e}^{-\sigma^{2}t^{2}/2}}$. Les $z_{n, m}$ et les $w_{n, m}$ étant de module au plus $1$, la prop. 1 donne $|\varphi_{S_{n}}(t) - \prod w_{n, m}| = |\prod z_{n, m} - \prod w_{n, m}| \leqslant \sum|z_{n, m} - w_{n, m}| \to 0$. Donc $\varphi_{S_{n}}(t) \to \mathrm{e}^{-\sigma^{2}t^{2}/2}$, et par le théorème de Lévy, $\boxed{S_{n} \xrightarrow{\mathcal{L}} \mathcal{N}(0, \sigma^{2})}$. La condition de Lindeberg exprime qu'aucune variable ne pèse à elle seule dans la somme.
- id: "l3-pr-09-27"
  feuille: "f-l3-pr-09"
  numero: 27
  partie: "Compléments sur les convergences"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-loi]
  source: "Durand, exercices 4.12 et 4.13"
  page_enonce: 10
  page_corrige: 18
  enonce: |
    **1.** *(Attente d'un évènement rare.)* Soit $X_{p} \sim \mathcal{G}(p)$. Montrer que $pX_{p}$ converge en loi quand $p \to 0$, et identifier la limite.

    **2.** *(Anniversaires.)* Soit $(X_{n})$ indépendantes uniformes sur $\{1, \dots, N\}$, et $T_{N}$ le premier indice $n$ tel que $X_{n} = X_{m}$ pour un $m < n$. Calculer $\mathbb{P}(T_{N} > n)$, et montrer que $\frac{T_{N}}{\sqrt{N}}$ converge en loi quand $N \to +\infty$ vers une loi dont on donnera la fonction de répartition. En déduire une approximation de $\mathbb{P}(T_{365} > 22)$, la comparer à la valeur exacte $0{,}524$, et interpréter.
  corrige: |
    **1.** Pour $x \geqslant 0$, $\mathbb{P}(pX_{p} > x) = \mathbb{P}(X_{p} > \lfloor\frac{x}{p}\rfloor) = (1 - p)^{\lfloor x/p\rfloor}$, et $\lfloor\frac{x}{p}\rfloor\ln(1 - p) \to -x$ quand $p \to 0$. Donc $\mathbb{P}(pX_{p} \leqslant x) \to 1 - \mathrm{e}^{-x}$ : $\boxed{pX_{p} \xrightarrow{\mathcal{L}} \mathcal{E}(1)}$. Le temps d'attente d'un évènement rare, mesuré dans la bonne unité, devient exponentiel ; c'est le pendant continu de l'absence de mémoire.

    **2.** $T_{N} > n$ si et seulement si $X_{1}$, …, $X_{n}$ sont distincts : $\boxed{\mathbb{P}(T_{N} > n) = \prod_{j = 1}^{n - 1}\big(1 - \frac{j}{N}\big)}$ pour $n \leqslant N$ (et $0$ au-delà). Pour $x > 0$ et $n = \lfloor x\sqrt{N}\rfloor$, $\mathbb{P}(T_{N} > x\sqrt{N}) = \mathbb{P}(T_{N} > n)$ et, comme $|\ln(1 - u) + u| \leqslant u^{2}$ pour $u \leqslant \frac{1}{2}$, 
    $$\ln\mathbb{P}(T_{N} > n) = -\sum_{j < n}\frac{j}{N} + O\Big(\sum_{j < n}\frac{j^{2}}{N^{2}}\Big) = -\frac{n(n - 1)}{2N} + O\Big(\frac{n^{3}}{N^{2}}\Big) \to -\frac{x^{2}}{2}.$$
     Donc $\frac{T_{N}}{\sqrt{N}}$ converge en loi vers la loi de fonction de répartition $\boxed{1 - \mathrm{e}^{-x^{2}/2}}$ ($x \geqslant 0$), dite de Rayleigh : c'est la loi de la norme d'un vecteur gaussien standard du plan (chapitre 7, prop. 5). Pour $N = 365$, $\mathbb{P}(T_{365} > 22) \approx \mathrm{e}^{-22^{2}/730} \approx \boxed{0{,}515}$, contre $0{,}524$ exactement (avec $\frac{n(n - 1)}{2N}$ au lieu de $\frac{n^{2}}{2N}$, on obtient $0{,}531$). Dans un groupe de $22$ personnes, la probabilité que les anniversaires soient tous distincts est encore supérieure à $\frac{1}{2}$ ; elle passe en dessous à $23$ ($0{,}493$). Les coïncidences apparaissent à l'échelle $\sqrt{N}$, et non $N$.
- id: "l3-pr-09-28"
  feuille: "f-l3-pr-09"
  numero: 28
  partie: "Compléments sur les convergences"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [modes de convergence]
  noeuds: [p-convergences]
  notions: [convergence-loi]
  source: "Durand, exercice 4.31"
  page_enonce: 10
  page_corrige: 19
  enonce: |
    *(Autorégression.)* Soit $(W_{n})_{n \geqslant 0}$ indépendantes de même loi, avec $\mathbb{E}[W_{0}] = 0$ et $\mathbb{E}[W_{0}^{2}] = 1$, $|\theta| < 1$ et $x_{0} \in \mathbb{R}$. On pose $X_{0} = x_{0}$ et $X_{n + 1} = \theta X_{n} + W_{n + 1}$.

    **1.** Exprimer $X_{n}$ en fonction des $W_{i}$, et calculer sa variance. Si $W_{1}$ est normale, donner la loi de $X_{n}$ et sa limite en loi.

    **2.** On pose $V_{n} = \theta^{n}x_{0} + \sum_{i = 1}^{n}\theta^{i - 1}W_{i}$. Montrer que $V_{n}$ a même loi que $X_{n}$, calculer $\mathbb{E}[(V_{n + p} - V_{n})^{2}]$ et montrer que $(V_{n})$ converge dans $L^{2}$ vers une variable $V$ (Intégration, chapitre 8).

    **3.** En déduire que $X_{n} \xrightarrow{\mathcal{L}} V$, et que $\varphi_{V}(t) = \varphi_{V}(\theta t)\,\varphi_{W_{0}}(t)$ pour tout $t$. Interpréter cette relation.

    **4.** Identifier la loi de $V$ lorsque $\theta = \frac{1}{2}$ et $\mathbb{P}(W_{0} = 1) = \mathbb{P}(W_{0} = -1) = \frac{1}{2}$.
  corrige: |
    **1.** Par récurrence, $\boxed{X_{n} = \theta^{n}x_{0} + \sum_{i = 1}^{n}\theta^{n - i}W_{i}}$, et par indépendance 
    $$\boxed{\operatorname{Var}(X_{n}) = \sum_{i = 1}^{n}\theta^{2(n - i)} = \frac{1 - \theta^{2n}}{1 - \theta^{2}}}.$$
     Si $W_{1}$ est normale, $X_{n} \sim \mathcal{N}\big(\theta^{n}x_{0}, \frac{1 - \theta^{2n}}{1 - \theta^{2}}\big)$ (chapitre 6, prop. 12), et les fonctions caractéristiques convergent : $\boxed{X_{n} \xrightarrow{\mathcal{L}} \mathcal{N}\big(0, \frac{1}{1 - \theta^{2}}\big)}$.

    **2.** Les vecteurs $(W_{1}, \dots, W_{n})$ et $(W_{n}, \dots, W_{1})$ ont même loi, donc $\sum_{i}\theta^{n - i}W_{i}$ a même loi que $\sum_{i}\theta^{n - i}W_{n + 1 - i}$, c'est-à-dire que $\sum_{j}\theta^{j - 1}W_{j}$ : $V_{n}$ a même loi que $X_{n}$. Ensuite, le terme déterministe et la somme centrée étant orthogonaux, 
    $$\mathbb{E}[(V_{n + p} - V_{n})^{2}] = (\theta^{n + p} - \theta^{n})^{2}x_{0}^{2} + \sum_{i = n + 1}^{n + p}\theta^{2(i - 1)} \leqslant \theta^{2n}\Big(4x_{0}^{2} + \frac{1}{1 - \theta^{2}}\Big) \to 0 :$$
     la suite $(V_{n})$ est de Cauchy dans $L^{2}$, qui est complet : $\boxed{V_{n} \xrightarrow{L^{2}} V}$.

    **3.** La convergence dans $L^{2}$ entraîne la convergence en loi (chapitre 8, th. 4), et $X_{n}$ a même loi que $V_{n}$ : $\boxed{X_{n} \xrightarrow{\mathcal{L}} V}$. Par ailleurs $V_{n + 1} = W_{1} + \theta V_{n}'$, où $V_{n}' = \theta^{n}x_{0} + \sum_{j = 1}^{n}\theta^{j - 1}W_{j + 1}$ a même loi que $V_{n}$ et est indépendante de $W_{1}$. Donc $\varphi_{V_{n + 1}}(t) = \varphi_{W_{0}}(t)\varphi_{V_{n}}(\theta t)$, et à la limite (théorème de Lévy), $\boxed{\varphi_{V}(t) = \varphi_{V}(\theta t)\,\varphi_{W_{0}}(t)}$. Cette relation dit que $\theta V + W_{0}$, avec $W_{0}$ indépendante de $V$, a même loi que $V$ : la loi de $V$ est la *loi stationnaire* de la récurrence. Si $X_{0}$ suit cette loi, indépendamment des $W_{n}$, toutes les $X_{n}$ la suivent. En itérant, $\varphi_{V}(t) = \prod_{k \geqslant 0}\varphi_{W_{0}}(\theta^{k}t)$.

    **4.** Ici $\varphi_{W_{0}}(t) = \cos t$, et la formule de duplication donne $\prod_{k = 0}^{K}\cos\frac{t}{2^{k}} = \frac{\sin 2t}{2^{K + 1}\sin(t/2^{K})} \to \frac{\sin 2t}{2t}$. C'est la fonction caractéristique de $\mathcal{U}([-2, 2])$, puisque $\frac{1}{4}\int_{-2}^{2}\mathrm{e}^{itx}\,\mathrm{d} x = \frac{\sin 2t}{2t}$ : par injectivité (chapitre 6, th. 1), $\boxed{V \sim \mathcal{U}([-2, 2])}$. Directement, $V = \sum_{i \geqslant 1}2^{1 - i}(2B_{i} - 1) = 4\sum_{i}B_{i}2^{-i} - 2$, où les $B_{i} = \frac{1 + W_{i}}{2}$ sont des bits indépendants : $\sum B_{i}2^{-i}$ est uniforme sur $[0, 1]$ (développement dyadique, chapitre 3, section 3.7.4).
