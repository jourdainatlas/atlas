  enonce: |
    **1.** Une pièce donne pile $40$ fois en $100$ lancers indépendants. On admet l'*inégalité de Hoeffding* : $\mathbb{P}(|\bar{X}_{n} - p| \geqslant t) \leqslant 2\mathrm{e}^{-2nt^{2}}$ pour $t > 0$, si les $X_{k}$ sont de loi $\mathcal{B}(p)$. Construire un intervalle de confiance pour $p$ de niveau au moins $90\,\%$ par cette inégalité, puis par l'inégalité de Bienaymé-Tchebychev, puis un intervalle de niveau approximativement $90\,\%$ par le théorème central limite. Que peut-on dire de l'équilibre de la pièce ?

    **2.** Avant un référendum, un sondage auprès de $10\,000$ personnes donne $4903$ intentions de vote « oui » et $5097$ « non ». En supposant que les deux réponses sont exactement également réparties dans la population, quelle serait, approximativement, la probabilité d'obtenir au plus $4903$ « oui » ? Que conclure ? Ce nombre est-il la probabilité que la victoire du « non » soit une erreur de prédiction ?
  corrige: |
    **1.** Ici $\bar{X}_{100} = 0{,}40$, et l'on cherche $t$ tel que la borne d'erreur vaille $0{,}1$ :

    • Hoeffding : $2\mathrm{e}^{-200t^{2}} = 0{,}1$ pour $t = \sqrt{\frac{\ln 20}{200}} \approx 0{,}122$, d'où $\boxed{[0{,}278\,;\, 0{,}522]}$ ;

    • Bienaymé-Tchebychev : $t = \frac{1}{2\sqrt{100 \times 0{,}1}} \approx 0{,}158$, d'où $\boxed{[0{,}242\,;\, 0{,}558]}$ ;

    • théorème central limite : $t = 1{,}645\sqrt{\frac{0{,}4 \times 0{,}6}{100}} \approx 0{,}081$ (l'écart type estimé remplace $\sigma$ : exercice 21), d'où $\boxed{[0{,}319\,;\, 0{,}481]}$.

    Les deux intervalles garantis contiennent $\frac{1}{2}$ : on ne peut pas conclure avec certitude. L'intervalle approché exclut $\frac{1}{2}$ et rend la pièce suspecte. Exactement, pour une pièce équilibrée, $\mathbb{P}(S_{100} \leqslant 40) \approx 0{,}028$ : un écart d'au moins $10$ à la moyenne a une probabilité voisine de $0{,}057$. Pour $\alpha$ petit, la borne exponentielle de Hoeffding devient bien meilleure que celle de Bienaymé-Tchebychev.

    **2.** Si $p = \frac{1}{2}$, le nombre de « oui » suit $\mathcal{B}(10\,000, \frac{1}{2})$, d'espérance $5000$ et d'écart type $50$, et 
    $$\mathbb{P}(S \leqslant 4903) \approx \Phi\Big(\frac{4903{,}5 - 5000}{50}\Big) = \Phi(-1{,}93) \approx \boxed{0{,}027}.$$
     Un résultat aussi défavorable au « oui » serait rare si la population était partagée également : le sondage indique assez fortement $p < \frac{1}{2}$. Mais ce nombre *n'est pas* la probabilité que la prédiction soit fausse : $p$ n'est pas aléatoire dans ce modèle, et $0{,}027$ est calculé en supposant $p = \frac{1}{2}$. C'est la probabilité des données sous une hypothèse, non celle de l'hypothèse sachant les données ; cette dernière n'a de sens que si l'on donne une loi à $p$. Le modèle ignore en outre les changements d'avis et l'abstention.
