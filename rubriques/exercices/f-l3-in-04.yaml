  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Féjoz (exosIntegration), exercices 2.6 et 2.8"
  page_enonce: 8
  page_corrige: 13
  enonce: |
    **1.** Soit $a < b$ réels et $f : ]a, b[ \to \mathbb{R}$ borélienne, bornée, telle que $\mathop{\displaystyle \lim_{x \to a^{+}}}f(x) = \gamma \in \mathbb{R}$. Montrer que, pour tout $t \in ]a, b[$, la fonction $x \mapsto \dfrac{f(x)}{\sqrt{(x - a)(t - x)}}$ est intégrable sur $]a, t[$, puis calculer 
    $$\lim_{t \to a^{+}}\int_{]a, t[}\frac{f(x)}{\sqrt{(x - a)(t - x)}}\,\mathrm{d} x.$$

    **2.** *Centre de masse.* Soit $K$ un compact de $\mathbb{R}^{d}$ et $m$ une mesure finie sur $\mathcal{B}(\mathbb{R}^{d})$, portée par $K$, c'est-à-dire telle que $m(\mathbb{R}^{d} \setminus K) = 0$, de masse $M = m(K) > 0$.

    (a) Décrire $m$ lorsque la distribution de masse comprend une masse ponctuelle $m_{p}$ en un point $p$, et une masse linéique de densité $\rho$ le long d'une courbe continue $\gamma : [0, L] \to \mathbb{R}^{d}$ paramétrée par son abscisse curviligne.

    (b) Montrer qu'il existe un unique point $g(m) \in \mathbb{R}^{d}$ tel que $u(g(m)) = \dfrac{1}{M}\mathop{\displaystyle \int} u(x)\,\mathrm{d} m(x)$ pour toute forme linéaire $u$ sur $\mathbb{R}^{d}$ : c'est le *centre de masse* de $m$.

    (c) Si $m_{1}$ et $m_{2}$ vérifient les mêmes hypothèses que $m$, montrer que $g(m_{1} + m_{2})$ est le barycentre des points $g(m_{i})$ affectés des coefficients $m_{i}(\mathbb{R}^{d})$.
  corrige: |
    **1.** Soit $M$ un majorant de $|f|$. Le changement de variable $x = a + (t - a)u$ (chapitre 2, prop. 12) donne 
    $$\int_{]a, t[}\frac{f(x)\,\mathrm{d} x}{\sqrt{(x - a)(t - x)}} = \int_{0}^{1}\frac{f(a + (t - a)u)}{\sqrt{u(1 - u)}}\,\mathrm{d} u, \qquad \int_{0}^{1}\frac{\mathrm{d} u}{\sqrt{u(1 - u)}} = \pi,$$
     la seconde par $u = \sin^{2}\theta$. L'intégrande est majorée par $\dfrac{M}{\sqrt{u(1 - u)}}$, intégrable, ce qui prouve l'intégrabilité ; quand $t \to a^{+}$, elle tend vers $\dfrac{\gamma}{\sqrt{u(1 - u)}}$, et la convergence dominée donne la limite $\boxed{\gamma\pi}$. Le noyau $\dfrac{1}{\pi\sqrt{u(1 - u)}}$ est une densité de probabilité sur $]0, 1[$, la loi de l'arc sinus ; l'intégrale est $\pi$ fois une moyenne de $f$ sur $]a, t[$.

    **2.** (a) Pour un borélien $A$, 
    $$m(A) = m_{p}\delta_{p}(A) + \int_{0}^{L}\chi_{A}(\gamma(s))\rho(s)\,\mathrm{d} s,$$
     somme d'une masse de Dirac et de l'image par $\gamma$ de la mesure de densité $\rho$ sur $[0, L]$ ; $K$ doit contenir $p$ et $\gamma([0, L])$.

    (b) Les formes coordonnées $x \mapsto x_{i}$ sont bornées sur $K$, qui porte $m$, et $m$ est finie : elles sont intégrables. Si $g(m)$ existe, ses coordonnées sont nécessairement $g_{i} = \dfrac{1}{M}\mathop{\displaystyle \int} x_{i}\,\mathrm{d} m(x)$ : d'où l'unicité. Inversement, le point de coordonnées $g_{i}$ convient, par linéarité de l'intégrale, puisque toute forme linéaire est combinaison des $x_{i}$.

    (c) Par l'exercice 7, $\mathop{\displaystyle \int} x_{i}\,\mathrm{d}(m_{1} + m_{2}) = \mathop{\displaystyle \int} x_{i}\,\mathrm{d} m_{1} + \mathop{\displaystyle \int} x_{i}\,\mathrm{d} m_{2}$, d'où 
    $$(M_{1} + M_{2})\,g(m_{1} + m_{2}) = M_{1}\,g(m_{1}) + M_{2}\,g(m_{2}) \text{ :}$$
     c'est le barycentre annoncé.
- id: "l3-in-04-25"
  feuille: "f-l3-in-04"
