- id: "l3-in-04-01"
  feuille: "f-l3-in-04"
  numero: 1
  partie: "Fonctions intégrables"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue, puissance-reelle]
  source: "J. Féjoz (exosIntegration), exercice 2.1 ; Lyon 1 (TD03 2020), exercice 3"
  page_enonce: 1
  page_corrige: 1
  enonce: |
    **1.** La somme de deux fonctions intégrables est-elle intégrable ? Le carré d'une fonction intégrable est-il intégrable ? Une fonction de carré intégrable est-elle intégrable ?

    **2.** La composée de deux fonctions intégrables de $\mathbb{R}$ dans $\mathbb{R}$ est-elle intégrable ?

    **3.** (a) Pour $\alpha > 0$, à quelle condition $x \mapsto x^{-\alpha}$ est-elle intégrable sur $]0, 1[$ ? sur $[1, +\infty[$ ? sur $]0, +\infty[$ ?

    (b) Pour $\alpha < \beta$ réels, montrer que $x \mapsto \dfrac{1}{x^{\alpha} + x^{\beta}}$ est intégrable sur $]0, +\infty[$ si et seulement si $\alpha < 1 < \beta$.

    **4.** Soit $(f_{n})$ une suite de fonctions mesurables positives qui converge simplement vers $f$, et $K$ une constante telle que $\mathop{\displaystyle \int} f_{n}\,\mathrm{d}\mu \leqslant K$ pour tout $n$. Montrer que $f$ est intégrable et que $\mathop{\displaystyle \int} f\,\mathrm{d}\mu \leqslant K$.
  corrige: |
    **1.** Oui pour la somme, puisque $|f + g| \leqslant |f| + |g|$ (cours, prop. 1). Non pour le carré : $x \mapsto \dfrac{1}{\sqrt{x}}$ est intégrable sur $]0, 1]$, d'intégrale $2$, mais pas son carré $\dfrac{1}{x}$ (cours, prop. 2). Non pour la réciproque : $\dfrac{1}{x}$ est de carré intégrable sur $[1, +\infty[$ sans être intégrable. *Le piège* est de raisonner comme sur un segment : si $\mu$ est finie, $|f| \leqslant \dfrac{1 + f^{2}}{2}$ montre qu'une fonction de carré intégrable est intégrable, et le chapitre 8 précisera ces inclusions entre espaces $L^{p}$.

    **2.** Non. Avec $f = \chi_{[0, 1]}$ et $g(t) = \mathrm{e}^{-t^{2}}$, toutes deux intégrables sur $\mathbb{R}$, la composée $g \circ f$ vaut $g(0) = 1$ hors de $[0, 1]$ : elle n'est pas intégrable. Une composée « oublie » que $f$ est petite à l'infini.

    **3.** (a) Par la proposition 2 du cours, $x^{-\alpha}$ est intégrable sur $]0, 1[$ si et seulement si $\alpha < 1$, sur $[1, +\infty[$ si et seulement si $\alpha > 1$, et donc jamais sur $]0, +\infty[$.

    (b) Sur $]0, 1]$, $x^{\beta} \leqslant x^{\alpha}$, donc $\dfrac{1}{2}x^{-\alpha} \leqslant \dfrac{1}{x^{\alpha} + x^{\beta}} \leqslant x^{-\alpha}$ ; sur $[1, +\infty[$, de même avec $x^{-\beta}$. La fonction est donc intégrable près de $0$ si et seulement si $\alpha < 1$, et près de l'infini si et seulement si $\beta > 1$ : $\boxed{\alpha < 1 < \beta}$. Chaque extrémité est gouvernée par le terme qui y domine le dénominateur.

    **4.** Par le lemme de Fatou (chapitre 3, th. 3), $\mathop{\displaystyle \int} f\,\mathrm{d}\mu = \mathop{\displaystyle \int}\mathop{\displaystyle \liminf} f_{n}\,\mathrm{d}\mu \leqslant \mathop{\displaystyle \liminf}\mathop{\displaystyle \int} f_{n}\,\mathrm{d}\mu \leqslant K$. Ainsi $f$ est intégrable, mais rien n'assure que $\mathop{\displaystyle \int} f_{n} \to \mathop{\displaystyle \int} f$ (exercice 10, question 5).
- id: "l3-in-04-02"
  feuille: "f-l3-in-04"
  numero: 2
  partie: "Fonctions intégrables"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue]
  source: "Exo7 (fic00145), exercices 9 et 7"
  page_enonce: 1
  page_corrige: 2
  enonce: |
    **1.** Soit $f : \Omega \to \mathbb{C}$ mesurable. Montrer que $f$ est intégrable si et seulement si $\operatorname{Re}f$ et $\operatorname{Im}f$ le sont, si et seulement si les quatre fonctions $(\operatorname{Re}f)^{\pm}$ et $(\operatorname{Im}f)^{\pm}$ ont des intégrales finies.

    **2.** Soit $f$ mesurable et $g$ intégrable avec $|f| \leqslant |g|$. Montrer que $f$ est intégrable et que $\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu \leqslant \mathop{\displaystyle \int}|g|\,\mathrm{d}\mu$.

    **3.** Pour $f \in \mathcal{L}^{1}$ complexe, démontrer l'inégalité $\big|\mathop{\displaystyle \int} f\,\mathrm{d}\mu\big| \leqslant \mathop{\displaystyle \int}|f|\,\mathrm{d}\mu$ en choisissant $\theta \in \mathbb{R}$ tel que $\mathrm{e}^{-\mathrm{i}\theta}\mathop{\displaystyle \int} f\,\mathrm{d}\mu$ soit un réel positif.

    **4.** Par des exemples sur $\mathbb{R}$, montrer que la conclusion de la proposition 6 du cours (convergence bornée) tombe en défaut si $\mu(\Omega) = +\infty$, ou si les $f_{k}$ sont bornées sans l'être par une même constante.
  corrige: |
    **1.** On a $|\operatorname{Re}f|, |\operatorname{Im}f| \leqslant |f| \leqslant |\operatorname{Re}f| + |\operatorname{Im}f|$, et $|\operatorname{Re}f| = (\operatorname{Re}f)^{+} + (\operatorname{Re}f)^{-}$, de même pour la partie imaginaire. Le critère de domination (cours, prop. 1) et la linéarité positive donnent les deux équivalences.

    **2.** $|f| \leqslant |g|$ et $|g|$ est intégrable : la proposition 1 du cours donne l'intégrabilité de $f$, et la croissance de l'intégrale des fonctions positives (chapitre 3, prop. 9) l'inégalité.

    **3.** Soit $z = \mathop{\displaystyle \int} f\,\mathrm{d}\mu$ et $\theta$ tel que $z = |z|\mathrm{e}^{\mathrm{i}\theta}$. Par linéarité (cours, prop. 3), $|z| = \mathop{\displaystyle \int}\mathrm{e}^{-\mathrm{i}\theta}f\,\mathrm{d}\mu$. Ce nombre est réel, donc égal à sa partie réelle, qui est par définition $\mathop{\displaystyle \int}\operatorname{Re}(\mathrm{e}^{-\mathrm{i}\theta}f)\,\mathrm{d}\mu$. Comme $\operatorname{Re}(\mathrm{e}^{-\mathrm{i}\theta}f) \leqslant |\mathrm{e}^{-\mathrm{i}\theta}f| = |f|$, la croissance de l'intégrale des fonctions réelles donne 
    $$\boxed{\Big|\int f\,\mathrm{d}\mu\Big| \leqslant \int|f|\,\mathrm{d}\mu}\text{.}$$
     L'idée est de « tourner » $f$ pour que son intégrale devienne réelle positive, puis d'appliquer l'inégalité réelle.

    **4.** Sur $\mathbb{R}$, $f_{k} = \chi_{[k, k+1[}$ tend vers $0$ en tout point, avec $|f_{k}| \leqslant 1$, mais $\mathop{\displaystyle \int} f_{k}\,\mathrm{d}\lambda = 1$ : la finitude de $\mu$ est nécessaire. Sur $[0, 1]$, $f_{k} = k\chi_{]0, 1/k]}$ tend vers $0$ en tout point et chaque $f_{k}$ est bornée, mais $\mathop{\displaystyle \int} f_{k} = 1$ : il faut une même borne $M$ pour tous les $k$. Dans les deux cas, c'est la domination par une même fonction intégrable qui manque (cours, th. 1).
- id: "l3-in-04-03"
  feuille: "f-l3-in-04"
  numero: 3
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 26 ; Bibmath (F. Bayart), «~Intégrale de Lebesgue~», exercice 8 ; Féjoz (exosIntegration), exercice 3.11"
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** On suppose $\mu$ finie. Soit $f : \Omega \to \mathbb{R}$ mesurable, et pour $n \in \mathbb{N}$, 
    $$A_{n} = \{|f| \geqslant n\}, \qquad X_{n} = \{n \leqslant |f| < n + 1\}.$$
     Montrer que $f$ est intégrable si et seulement si $\mathop{\displaystyle \sum} n\,\mu(X_{n}) < +\infty$, si et seulement si $\mathop{\displaystyle \sum}\mu(A_{n}) < +\infty$.

    **2.** On ne suppose plus $\mu$ finie. Soit $f : \Omega \to [0, +\infty[$ mesurable, et $F_{n} = f^{-1}([2^{n}, 2^{n+1}[)$ pour $n \in \mathbb{Z}$. Montrer que $f$ est intégrable si et seulement si $\mathop{\displaystyle \sum_{n \in \mathbb{Z}}}2^{n}\mu(F_{n}) < +\infty$.

    **3.** Soit $f \in \mathcal{L}^{1}$ complexe, et $B_{n} = \{n - 1 \leqslant |f| \leqslant n\}$ pour $n \geqslant 2$.

    (a) Montrer que $\mu(B_{n}) < +\infty$ et que $\mathop{\displaystyle \sum_{n \geqslant 2}}n\,\mu(B_{n}) < +\infty$.

    (b) En échangeant deux sommations, montrer que $\mathop{\displaystyle \sum_{n \geqslant 2}}\mathop{\displaystyle \sum_{m = 2}^{n}}\dfrac{m^{2}}{n^{2}}\mu(B_{m}) < +\infty$.

    (c) Montrer que, pour $n \geqslant 2$, 
    $$\int|f|^{2}\chi_{\{|f| < n\}}\,\mathrm{d}\mu \leqslant \int|f|^{2}\chi_{\{|f| < 1\}}\,\mathrm{d}\mu + \sum_{m = 2}^{n}\int|f|^{2}\chi_{B_{m}}\,\mathrm{d}\mu,$$
     et en déduire que $\mathop{\displaystyle \sum_{n \geqslant 1}}\dfrac{1}{n^{2}}\mathop{\displaystyle \int}|f|^{2}\chi_{\{|f| < n\}}\,\mathrm{d}\mu < +\infty$.
  corrige: |
    **1.** Comme $f$ est réelle, les $X_{n}$ forment une partition mesurable de $\Omega$, et la proposition 13 du chapitre 3 donne $\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu = \mathop{\displaystyle \sum_{n}}\mathop{\displaystyle \int_{X_{n}}}|f|\,\mathrm{d}\mu$. Sur $X_{n}$, $n \leqslant |f| < n + 1$, d'où 
    $$\sum_{n}n\,\mu(X_{n}) \leqslant \int|f|\,\mathrm{d}\mu \leqslant \sum_{n}n\,\mu(X_{n}) + \mu(\Omega).$$
     Comme $\mu(\Omega) < +\infty$, $f$ est intégrable si et seulement si $\mathop{\displaystyle \sum} n\,\mu(X_{n}) < +\infty$. Ensuite $\mu(A_{n}) = \mathop{\displaystyle \sum_{k \geqslant n}}\mu(X_{k})$, et, en échangeant les sommations d'une série double positive, 
    $$\sum_{n \geqslant 0}\mu(A_{n}) = \sum_{k \geqslant 0}(k + 1)\mu(X_{k}) = \sum_{k}k\,\mu(X_{k}) + \mu(\Omega),$$
     ce qui donne la seconde équivalence.

    **2.** Les $F_{n}$, $n \in \mathbb{Z}$, partitionnent $\{f > 0\}$, et $2^{n} \leqslant f < 2^{n+1}$ sur $F_{n}$. Comme ci-dessus, 
    $$\sum_{n \in \mathbb{Z}}2^{n}\mu(F_{n}) \leqslant \int f\,\mathrm{d}\mu \leqslant 2\sum_{n \in \mathbb{Z}}2^{n}\mu(F_{n}).$$
     Le découpage dyadique remplace le découpage en bandes de largeur $1$ : les bandes de largeur proportionnelle à la hauteur rendent l'encadrement multiplicatif, sans terme additif $\mu(\Omega)$, d'où la validité pour $\mu$ infinie.

    **3.** (a) Pour $n \geqslant 2$, $B_{n} \subset \{|f| \geqslant n - 1\}$, et l'inégalité de Markov (chapitre 3, prop. 10) donne $\mu(B_{n}) \leqslant \dfrac{1}{n - 1}\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu < +\infty$. Un point $x$ appartient au plus à deux bandes $B_{n}$ (deux si $|f(x)|$ est entier), et sur $B_{n}$, $n \leqslant |f| + 1 \leqslant 2|f|$, puisque $|f| \geqslant 1$. Donc $\mathop{\displaystyle \sum_{n \geqslant 2}}n\chi_{B_{n}} \leqslant 4|f|$, et $\mathop{\displaystyle \sum_{n \geqslant 2}}n\,\mu(B_{n}) \leqslant 4\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu < +\infty$.

    (b) Les termes sont positifs ; on échange les sommations, puis on compare à une série télescopique : 
    $$\sum_{n \geqslant 2}\sum_{m = 2}^{n}\frac{m^{2}}{n^{2}}\mu(B_{m}) = \sum_{m \geqslant 2}m^{2}\mu(B_{m})\sum_{n \geqslant m}\frac{1}{n^{2}} \leqslant \sum_{m \geqslant 2}m^{2}\mu(B_{m})\frac{1}{m - 1} \leqslant 2\sum_{m \geqslant 2}m\,\mu(B_{m}),$$
     car $\mathop{\displaystyle \sum_{n \geqslant m}}\dfrac{1}{n^{2}} \leqslant \mathop{\displaystyle \sum_{n \geqslant m}}\big(\dfrac{1}{n - 1} - \dfrac{1}{n}\big) = \dfrac{1}{m - 1} \leqslant \dfrac{2}{m}$.

    (c) On a $\{|f| < n\} \subset \{|f| < 1\} \cup B_{2} \cup \dots \cup B_{n}$, d'où l'inégalité entre indicatrices, puis entre intégrales. L'égalité de l'énoncé source est fausse en général : un point où $|f| = m$ entier est compté dans $B_{m}$ et $B_{m+1}$. Ensuite $\mathop{\displaystyle \int}|f|^{2}\chi_{B_{m}} \leqslant m^{2}\mu(B_{m})$ et $\mathop{\displaystyle \int}|f|^{2}\chi_{\{|f| < 1\}} \leqslant \mathop{\displaystyle \int}|f|$. En sommant, 
    $$\sum_{n \geqslant 1}\frac{1}{n^{2}}\int|f|^{2}\chi_{\{|f| < n\}}\,\mathrm{d}\mu \leqslant \frac{\pi^{2}}{6}\int|f|\,\mathrm{d}\mu + \sum_{n \geqslant 2}\sum_{m = 2}^{n}\frac{m^{2}}{n^{2}}\mu(B_{m}) < +\infty.$$
     Cette estimation est celle qu'utilise, en probabilités, la démonstration de la loi forte des grands nombres par troncature.
- id: "l3-in-04-04"
  feuille: "f-l3-in-04"
  numero: 4
  partie: "Fonctions intégrables"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue]
  source: "TD2 Paris-Dauphine, exercice 6 ; M61B TD3, exercices 3 et 6"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f : \Omega \to \mathbb{R}$ mesurable.

    **1.** On suppose $\mu(\Omega) > 0$. Montrer qu'il existe $A \in \mathcal{T}$ tel que $\mu(A) > 0$ et que $f$ soit bornée sur $A$. On pourra considérer $A_{n} = \{|f| \leqslant n\}$.

    **2.** Justifier que $\{f \neq 0\} \in \mathcal{T}$. On suppose $\mu(\{f \neq 0\}) > 0$ : montrer qu'il existe $A \in \mathcal{T}$ tel que $\mu(A) > 0$ et que $|f|$ soit minorée sur $A$ par une constante strictement positive.

    **3.** On suppose $\mu(\{f > 0\}) > 0$. Montrer qu'il existe $\varepsilon > 0$ tel que $\mu(\{f > \varepsilon\}) > 0$.
  corrige: |
    **1.** Les $A_{n} = \{|f| \leqslant n\}$ croissent et, $f$ étant réelle, leur réunion est $\Omega$. Par continuité croissante, $\mu(A_{n}) \to \mu(\Omega) > 0$, donc $\mu(A_{n}) > 0$ pour $n$ assez grand, et $|f| \leqslant n$ sur $A_{n}$.

    **2.** $\{f \neq 0\} = f^{-1}(\mathbb{R}^{*})$ est l'image réciproque d'un ouvert. Les parties $\{|f| \geqslant \dfrac{1}{n}\}$ croissent vers $\{f \neq 0\}$ ; par continuité croissante, l'une d'elles est de mesure strictement positive, et $|f| \geqslant \dfrac{1}{n}$ sur celle-ci.

    **3.** De même, $\{f > \dfrac{1}{n}\}$ croît vers $\{f > 0\}$ : on prend $\varepsilon = \dfrac{1}{n}$ pour $n$ assez grand. *Le piège* de la question 1 est l'hypothèse « $f$ réelle » : une fonction égale à $+\infty$ partout n'est bornée sur aucune partie non vide.
- id: "l3-in-04-05"
  feuille: "f-l3-in-04"
  numero: 5
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 19 ; Lyon 1 (TD04 2020), exercice 24 ; Bibmath, exercice 7"
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $f : \Omega \to \overline{\mathbb{R}}$ intégrable.

    **1.** Pour $n \geqslant 1$, on pose $A_{n} = \{\dfrac{1}{n} \leqslant |f| \leqslant n\}$ et $g_{n} = |f|\chi_{A_{n}}$. Montrer que $A_{n} \in \mathcal{T}$, que $g_{n} \to |f|$ presque partout et que $\mathop{\displaystyle \int} g_{n}\,\mathrm{d}\mu \to \mathop{\displaystyle \int}|f|\,\mathrm{d}\mu$.

    **2.** En déduire que, pour tout $\varepsilon > 0$, il existe $A \in \mathcal{T}$ tel que $\mu(A) < +\infty$, que $f$ soit bornée sur $A$, et que $\mathop{\displaystyle \int_{\Omega \setminus A}}|f|\,\mathrm{d}\mu < \varepsilon$.

    **3.** Retrouver ainsi la proposition 8 (ii) du cours : pour tout $\varepsilon > 0$, il existe $\eta > 0$ tel que, pour tout $B \in \mathcal{T}$, $\mu(B) < \eta$ entraîne $\mathop{\displaystyle \int_{B}}|f|\,\mathrm{d}\mu < \varepsilon$.

    **4.** Soit $f : \mathbb{R} \to \mathbb{R}$ intégrable. On pose $F(x) = \mathop{\displaystyle \int_{[0, x]}}f\,\mathrm{d}\lambda$ si $x \geqslant 0$ et $F(x) = -\mathop{\displaystyle \int_{[x, 0]}}f\,\mathrm{d}\lambda$ si $x < 0$. Montrer que $F$ est uniformément continue sur $\mathbb{R}$.

    **5.** Avec $C_{n} = \{|f| \geqslant n\}$, déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{C_{n}}}f\,\mathrm{d}\mu$. Si $A \in \mathcal{T}$ est de mesure finie, déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{A}}|f|^{1/n}\,\mathrm{d}\mu$.
  corrige: |
    **1.** $A_{n} = |f|^{-1}([\dfrac{1}{n}, n])$ est mesurable. Les $A_{n}$ croissent vers $\{0 < |f| < +\infty\}$, donc $g_{n}$ croît vers $|f|$ hors de $\{|f| = +\infty\}$, qui est négligeable puisque $f$ est intégrable (cours, prop. 1) ; sur $\{f = 0\}$, $g_{n} = 0 = |f|$. Le théorème de convergence monotone donne $\mathop{\displaystyle \int} g_{n} \to \mathop{\displaystyle \int}|f|$.

    **2.** Soit $n$ tel que $\mathop{\displaystyle \int}|f| - \mathop{\displaystyle \int} g_{n} = \mathop{\displaystyle \int_{\Omega \setminus A_{n}}}|f| < \varepsilon$, et $A = A_{n}$. Sur $A$, $|f| \leqslant n$, et $|f| \geqslant \dfrac{1}{n}$ donne, par Markov, $\mu(A) \leqslant n\mathop{\displaystyle \int}|f| < +\infty$.

    **3.** Soit $\varepsilon > 0$, $A$ comme en 2 pour $\dfrac{\varepsilon}{2}$, $n$ un majorant de $|f|$ sur $A$, et $\eta = \dfrac{\varepsilon}{2n}$. Si $\mu(B) < \eta$, 
    $$\int_{B}|f|\,\mathrm{d}\mu \leqslant \int_{B \cap A}|f|\,\mathrm{d}\mu + \int_{\Omega \setminus A}|f|\,\mathrm{d}\mu < n\eta + \frac{\varepsilon}{2} = \varepsilon.$$
     La fonction est découpée en une partie bornée, qui ne peut charger beaucoup un petit ensemble, et une queue de petite intégrale.

    **4.** Les points étant négligeables, on vérifie dans chacun des trois cas de signe que, pour $x < y$, 
    $$F(y) - F(x) = \int_{[x, y]}f\,\mathrm{d}\lambda.$$
     Avec $\eta$ associé à $\varepsilon$ par la question 3, $y - x < \eta$ entraîne $|F(y) - F(x)| \leqslant \mathop{\displaystyle \int_{[x, y]}}|f| < \varepsilon$ : $F$ est uniformément continue sur $\mathbb{R}$.

    **5.** Les $C_{n}$ décroissent vers $\{|f| = +\infty\}$, négligeable ; $f\chi_{C_{n}} \to 0$ p.p., avec $|f\chi_{C_{n}}| \leqslant |f|$, et le théorème de convergence dominée donne $\boxed{\mathop{\displaystyle \int_{C_{n}}}f\,\mathrm{d}\mu \to 0}$. Ensuite $|f|^{1/n} \to \chi_{\{f \neq 0\}}$ p.p., avec $|f|^{1/n} \leqslant 1 + |f|$, intégrable sur $A$ puisque $\mu(A) < +\infty$ ; d'où 
    $$\boxed{\int_{A}|f|^{1/n}\,\mathrm{d}\mu \to \mu(A \cap \{f \neq 0\})}\text{.}$$
     Une fonction à valeurs dans $\overline{\mathbb{R}}$ ne pose pas de difficulté supplémentaire, puisqu'elle est finie presque partout.
- id: "l3-in-04-06"
  feuille: "f-l3-in-04"
  numero: 6
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions intégrables]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue]
  source: "TD2 Paris-Dauphine, exercice 11"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Soit $f \in \mathcal{L}^{1}$ réelle telle que $\mathop{\displaystyle \int_{A}}f\,\mathrm{d}\mu = 0$ pour tout $A \in \mathcal{T}$. Montrer que $f = 0$ presque partout. Le résultat subsiste-t-il pour $f$ complexe ?

    **2.** Soit $f \in \mathcal{L}^{1}$ réelle et $F$ un fermé de $\mathbb{R}$ tels que $\dfrac{1}{\mu(A)}\mathop{\displaystyle \int_{A}}f\,\mathrm{d}\mu \in F$ pour tout $A \in \mathcal{T}$ de mesure strictement positive.

    (a) Soit $a < b$ tels que $]a, b[ \subset \mathbb{R} \setminus F$. Montrer que $\mu(f^{-1}(]a, b[)) = 0$.

    (b) En déduire que $f(x) \in F$ pour presque tout $x$.
  corrige: |
    **1.** Avec $A = \{f > 0\}$, $f\chi_{A}$ est positive d'intégrale nulle, donc nulle p.p. (chapitre 3, prop. 11) : $\mu(A) = 0$. De même $\mu(\{f < 0\}) = 0$. Pour $f$ complexe, $\mathop{\displaystyle \int_{A}}\operatorname{Re}f = \operatorname{Re}\mathop{\displaystyle \int_{A}}f = 0$ pour tout $A$, et de même pour la partie imaginaire : le résultat subsiste.

    **2.** On convient que $\dfrac{1}{\mu(A)} = 0$ si $\mu(A) = +\infty$. (a) Soit $A = f^{-1}(]a, b[)$, et supposons $\mu(A) > 0$. Montrons d'abord qu'il existe $B \subset A$ mesurable avec $0 < \mu(B) < +\infty$. Si $a < 0 < b$, alors $0 \notin F$ ; l'hypothèse appliquée à $\Omega$ interdit $\mu(\Omega) = +\infty$ (la moyenne serait $0$), donc $\mu(A) < +\infty$ et $B = A$ convient. Si $a \geqslant 0$, $A$ est la réunion croissante des $A \cap \{f > \dfrac{1}{k}\}$, de mesures finies par Markov, et l'une d'elles est de mesure positive ; le cas $b \leqslant 0$ est symétrique. Sur $B$, $a < f < b$, donc $\mathop{\displaystyle \int_{B}}(f - a) > 0$ et $\mathop{\displaystyle \int_{B}}(b - f) > 0$, et la moyenne $\dfrac{1}{\mu(B)}\mathop{\displaystyle \int_{B}}f$ est dans $]a, b[ \subset \mathbb{R} \setminus F$ : contradiction. Donc $\mu(A) = 0$.

    (b) L'ouvert $\mathbb{R} \setminus F$ est réunion des intervalles $]a, b[$ à extrémités rationnelles qu'il contient, en nombre dénombrable. Leurs images réciproques sont négligeables, donc aussi $f^{-1}(\mathbb{R} \setminus F)$ : $f \in F$ presque partout. La question 1 est le cas $F = \{0\}$.
- id: "l3-in-04-07"
  feuille: "f-l3-in-04"
  numero: 7
