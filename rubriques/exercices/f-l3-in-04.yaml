  enonce: |
    *Théorème de Cantor-Lebesgue.* On suppose que la série trigonométrique à coefficients réels 
    $$\frac{a_{0}}{2} + \sum_{n \geqslant 1}\big(a_{n}\cos(nx) + b_{n}\sin(nx)\big)$$
     converge simplement sur un segment $[a, b]$ non réduit à un point. On écrit 
    $$a_{n}\cos(nx) + b_{n}\sin(nx) = r_{n}\cos(nx + \varphi_{n}), \qquad r_{n} = \sqrt{a_{n}^{2} + b_{n}^{2}},$$
     et l'on veut montrer que $r_{n} \to 0$.

    **1.** Que peut-on dire de la suite $\big(r_{n}\cos(nx + \varphi_{n})\big)$ pour $x \in [a, b]$ ?

    **2.** Montrer que, si $[a, b] = [-\pi, \pi]$ et si la convergence est uniforme, alors $a_{n} \to 0$ et $b_{n} \to 0$.

    **3.** On revient au cas général, et l'on suppose que $(r_{n})$ ne tend pas vers $0$. Justifier l'existence de $\eta > 0$ et d'une suite extraite $(r_{n_{k}})$ telle que $r_{n_{k}} > \eta$ pour tout $k$.

    **4.** À l'aide du théorème de convergence dominée, montrer que $\mathop{\displaystyle \lim_{k}}\mathop{\displaystyle \int_{a}^{b}}\cos^{2}(n_{k}x + \varphi_{n_{k}})\,\mathrm{d} x = 0$.

    **5.** Calculer explicitement cette intégrale et conclure.
  corrige: |
    **1.** C'est le terme général d'une série convergente : $r_{n}\cos(nx + \varphi_{n}) \to 0$ pour tout $x \in [a, b]$.

    **2.** Si la convergence est uniforme sur $[-\pi, \pi]$, le terme général $u_{n}$ tend uniformément vers $0$, et pour $n \geqslant 1$, par orthogonalité, 
    $$a_{n} = \frac{1}{\pi}\int_{-\pi}^{\pi}u_{n}(x)\cos(nx)\,\mathrm{d} x, \qquad b_{n} = \frac{1}{\pi}\int_{-\pi}^{\pi}u_{n}(x)\sin(nx)\,\mathrm{d} x,$$
     d'où $|a_{n}|, |b_{n}| \leqslant 2\mathop{\displaystyle \sup}|u_{n}| \to 0$.

    **3.** Si $(r_{n})$ ne tend pas vers $0$, il existe $\eta > 0$ tel que $r_{n} > \eta$ pour une infinité d'indices $n$, que l'on range en une suite croissante $(n_{k})$.

    **4.** Pour $x \in [a, b]$, $|\cos(n_{k}x + \varphi_{n_{k}})| \leqslant \dfrac{1}{\eta}|r_{n_{k}}\cos(n_{k}x + \varphi_{n_{k}})| \to 0$. Les fonctions $\cos^{2}(n_{k}x + \varphi_{n_{k}})$ tendent donc vers $0$ sur $[a, b]$, en restant majorées par $1$, intégrable sur ce segment : leurs intégrales tendent vers $0$.

    **5.** Avec $\cos^{2}\theta = \dfrac{1 + \cos 2\theta}{2}$, 
    $$\int_{a}^{b}\cos^{2}(n_{k}x + \varphi_{n_{k}})\,\mathrm{d} x = \frac{b - a}{2} + \frac{\sin(2n_{k}b + 2\varphi_{n_{k}}) - \sin(2n_{k}a + 2\varphi_{n_{k}})}{4n_{k}} \to \frac{b - a}{2} > 0,$$
     ce qui contredit la question 4. Donc $r_{n} \to 0$, c'est-à-dire $\boxed{a_{n} \to 0 \text{ et } b_{n} \to 0}$. La convergence simple sur un seul petit segment suffit : l'intégrale « moyenne » les oscillations de plus en plus rapides des cosinus, que la convergence ponctuelle ne contrôle pas.
- id: "l3-in-04-23"
  feuille: "f-l3-in-04"
  numero: 23
  partie: "Le théorème de convergence dominée"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "TD2 Paris-Dauphine, exercice 16"
  page_enonce: 8
  page_corrige: 13
  enonce: |
    *Théorème d'Egorov.* On suppose $\mu(\Omega) < +\infty$. Soit $(f_{n})$ une suite de fonctions mesurables de $\Omega$ dans $\mathbb{R}$, et $f : \Omega \to \mathbb{R}$ mesurable. On dit que $(f_{n})$ converge *presque uniformément* vers $f$ si, pour tout $\varepsilon > 0$, il existe $A \in \mathcal{T}$ tel que $\mu(\Omega \setminus A) \leqslant \varepsilon$ et que $(f_{n})$ converge uniformément vers $f$ sur $A$.

    **1.** Montrer que l'ensemble $C$ des $x$ tels que $(f_{n}(x))$ converge est mesurable.

    **2.** Soit $(A_{k})$ une suite d'éléments de $\mathcal{T}$ telle que $\mu(\Omega \setminus A_{k}) \leqslant \dfrac{1}{k}$, et sur chacun desquels $(f_{n})$ converge uniformément vers $f$. Montrer que $\mu\big(\Omega \setminus \mathop{\displaystyle \bigcup_{k}}A_{k}\big) = 0$ et que $(f_{n})$ converge simplement vers $f$ sur $\mathop{\displaystyle \bigcup_{k}}A_{k}$. En déduire que la convergence presque uniforme entraîne la convergence presque partout.

    **3.** On suppose que $f_{n} \to f$ presque partout. Pour $N$, $p \in \mathbb{N}^{*}$, on pose 
    $$A_{N, p} = \bigcap_{n \geqslant N}\Big\{|f_{n} - f| \leqslant \frac{1}{p}\Big\}.$$
     (a) Vérifier que $A_{N, p} \in \mathcal{T}$ et que $\mu\big(\mathop{\displaystyle \bigcup_{N \geqslant 1}}A_{N, p}\big) = \mu(\Omega)$.

    (b) Soit $\varepsilon > 0$. Montrer que, pour tout $p \in \mathbb{N}^{*}$, il existe $N_{p} \geqslant 1$ tel que $\mu(\Omega) - \mu(A_{N_{p}, p}) \leqslant \dfrac{\varepsilon}{2^{p}}$.

    (c) On note $A_{\varepsilon} = \mathop{\displaystyle \bigcap_{p \geqslant 1}}A_{N_{p}, p}$. Montrer que $\mu(\Omega \setminus A_{\varepsilon}) \leqslant \varepsilon$, et en déduire que $(f_{n})$ converge presque uniformément vers $f$.

    **4.** Donner un contre-exemple lorsque $\mu(\Omega) = +\infty$.
  corrige: |
    **1.** $(f_{n}(x))$ converge si et seulement si elle est de Cauchy, d'où 
    $$C = \bigcap_{p \geqslant 1}\bigcup_{N \in \mathbb{N}}\bigcap_{m, n \geqslant N}\Big\{|f_{n} - f_{m}| \leqslant \frac{1}{p}\Big\},$$
     obtenu par des opérations dénombrables sur des parties mesurables.

    **2.** $\mu\big(\Omega \setminus \mathop{\displaystyle \bigcup_{k}}A_{k}\big) \leqslant \mu(\Omega \setminus A_{k}) \leqslant \dfrac{1}{k}$ pour tout $k$, donc cette mesure est nulle. Un point de $\mathop{\displaystyle \bigcup_{k}}A_{k}$ est dans un $A_{k}$, où la convergence est uniforme, a fortiori simple. Si $(f_{n})$ converge presque uniformément, on choisit pour chaque $k$ un tel $A_{k}$ avec $\varepsilon = \dfrac{1}{k}$ : la convergence a lieu presque partout.

    **3.** (a) $A_{N, p} = \mathop{\displaystyle \bigcap_{n \geqslant N}}(f_{n} - f)^{-1}\big([-\dfrac{1}{p}, \dfrac{1}{p}]\big) \in \mathcal{T}$. Si $x \in B = \{f_{n} \to f\}$, il existe $N$ tel que $|f_{n}(x) - f(x)| \leqslant \dfrac{1}{p}$ pour $n \geqslant N$, c'est-à-dire $x \in A_{N, p}$. Ainsi $B \subset \mathop{\displaystyle \bigcup_{N}}A_{N, p}$, et $\mu(B) = \mu(\Omega)$.

    (b) Les $A_{N, p}$ croissent avec $N$ ; par continuité croissante, $\mu(A_{N, p}) \to \mu(\Omega)$, qui est fini, d'où $N_{p}$.

    (c) Comme $\mu$ est finie, $\mu(\Omega \setminus A_{\varepsilon}) \leqslant \mathop{\displaystyle \sum_{p}}\big(\mu(\Omega) - \mu(A_{N_{p}, p})\big) \leqslant \mathop{\displaystyle \sum_{p}}\dfrac{\varepsilon}{2^{p}} = \varepsilon$. Sur $A_{\varepsilon}$, $|f_{n} - f| \leqslant \dfrac{1}{p}$ pour tout $n \geqslant N_{p}$, et cela pour tout $p$ : la convergence y est uniforme.

    **4.** Sur $\mathbb{R}$, $f_{n} = \chi_{[n, n+1[}$ tend vers $0$ en tout point. Si $(f_{n})$ convergeait uniformément sur $A$, avec $\lambda(\mathbb{R} \setminus A) \leqslant 1$, on aurait $\mathop{\displaystyle \sup_{A}}f_{n} < 1$ pour $n \geqslant n_{0}$, donc $A \cap [n, n+1[ = \emptyset$, et $\mathbb{R} \setminus A \supset [n_{0}, +\infty[$ : contradiction.

    ![Figure](documents/figures/d4e488d196214304.svg)

    Sur $[0, 1]$, $x^{n}$ (ocre, pour $n = 1$, $2$, $5$, $20$) tend vers la fonction nulle sur $[0, 1[$, égale à $1$ en $1$ (carmin). La convergence n'est pas uniforme sur $[0, 1[$, mais elle l'est sur la partie $A_{\varepsilon} = [0, 1 - \varepsilon]$ (fond pétrole), où $x^{n} \leqslant (1 - \varepsilon)^{n}$, et le complémentaire de $A_{\varepsilon}$ est de mesure $\varepsilon$ : c'est exactement ce qu'affirme le théorème d'Egorov.
- id: "l3-in-04-24"
  feuille: "f-l3-in-04"
  numero: 24
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
