  source: "Féjoz (exosIntegration), exercice 3.1 (a)-(e)"
  page_enonce: 8
  page_corrige: 14
  enonce: |
    **1.** Soit $f : [a, b] \to \mathbb{R}$ continue. Montrer que $F : x \mapsto \mathop{\displaystyle \int_{[a, x]}}f(t)\,\mathrm{d} t$ est une primitive de $f$.

    **2.** Donner un exemple de dérivée mesurable non continue.

    **3.** Soit $f : [a, b] \to \mathbb{R}$ mesurable et bornée, admettant une primitive $F$. Montrer que l'on a 
    $$\int_{[a, b]}f(x)\,\mathrm{d} x = F(b) - F(a).$$
     On pourra appliquer le théorème de convergence dominée à $g_{n}(x) = n\big(F(x + \dfrac{1}{n}) - F(x)\big)$.

    **4.** Soit $f$, $g : [a, b] \to \mathbb{R}$ dérivables, de dérivées bornées. Montrer que 
    $$\int_{[a, b]}f'g\,\mathrm{d}\lambda = \big[fg\big]_{a}^{b} - \int_{[a, b]}fg'\,\mathrm{d}\lambda.$$

    **5.** Retrouver, à l'aide de la question 3, à quelle condition $x \mapsto x^{-\alpha}$ est intégrable sur $[1, +\infty[$.
  corrige: |
    **1.** Pour $h \neq 0$ petit, $\dfrac{F(x + h) - F(x)}{h} - f(x)$ est la moyenne de $f(t) - f(x)$ sur l'intervalle d'extrémités $x$ et $x + h$, donc majorée en valeur absolue par $\mathop{\displaystyle \sup_{|t - x| \leqslant |h|}}|f(t) - f(x)|$, qui tend vers $0$ par continuité de $f$.

    **2.** $F(x) = x^{2}\sin\dfrac{1}{x}$, prolongée par $F(0) = 0$, est dérivable, avec $F'(x) = 2x\sin\dfrac{1}{x} - \cos\dfrac{1}{x}$ et $F'(0) = 0$. $F'$ est mesurable, comme limite simple de $n\big(F(x + \dfrac{1}{n}) - F(x)\big)$, bornée sur $[-1, 1]$, mais discontinue en $0$.

    **3.** On prolonge $F$ à droite de $b$ par la constante $F(b)$. Par le théorème des accroissements finis, $|g_{n}| \leqslant M = \mathop{\displaystyle \sup}|f|$ sur $[a, b]$, et $g_{n}(x) \to f(x)$ pour $x \in [a, b[$. La convergence dominée, sur le segment, donne $\mathop{\displaystyle \int_{[a, b]}}g_{n} \to \mathop{\displaystyle \int_{[a, b]}}f$. Par invariance de $\lambda$ par translation, 
    $$\int_{[a, b]}g_{n} = n\int_{[a + \frac{1}{n}, b + \frac{1}{n}]}F - n\int_{[a, b]}F = n\int_{[b, b + \frac{1}{n}]}F - n\int_{[a, a + \frac{1}{n}]}F \to F(b) - F(a),$$
     par continuité de $F$. *Le point délicat* est que $f$ n'est pas supposée continue : l'intégrale de Riemann n'est pas disponible, et c'est la convergence dominée qui remplace le théorème fondamental de l'analyse.

    **4.** $fg$ est dérivable, de dérivée $(fg)' = f'g + fg'$ bornée, puisque $f$ et $g$, continues sur un segment, sont bornées. La question 3 et la linéarité donnent la formule.

    **5.** Pour $\alpha \neq 1$, $\mathop{\displaystyle \int_{[1, A]}}x^{-\alpha}\,\mathrm{d} x = \dfrac{A^{1 - \alpha} - 1}{1 - \alpha}$, et pour $\alpha = 1$, $\ln A$. La convergence monotone, pour $A \to +\infty$ entier, donne 
    $$\int_{[1, +\infty[}x^{-\alpha}\,\mathrm{d} x = \frac{1}{\alpha - 1} \text{ si } \alpha > 1, \qquad +\infty \text{ sinon :}$$

    $$\boxed{\text{intégrable si et seulement si } \alpha > 1}.$$
- id: "l3-in-04-26"
  feuille: "f-l3-in-04"
  numero: 26
  partie: "Intégrale de Riemann et intégrale de Lebesgue"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [Riemann et Lebesgue]
  noeuds: [m-riemann]
  notions: [riemann-integrable]
  source: "Exo7 (fic00141), exercice 4 ; Exo7 (fic00145), exercice 11"
  page_enonce: 9
  page_corrige: 15
  enonce: |
    **1.** Montrer que l'indicatrice $\chi_{\mathbb{Q}}$ n'est pas intégrable au sens de Riemann sur $[0, 1]$, mais qu'elle est intégrable au sens de Lebesgue, et calculer son intégrale.

    **2.** Sur $]0, 1[$, soit $h(x) = \dfrac{1}{q}$ si $x = \dfrac{p}{q}$ avec $p \wedge q = 1$, et $h(x) = 0$ si $x \notin \mathbb{Q}$. Esquisser le graphe de $h$ (considérer les points $\dfrac{k}{q}$ pour $q$ premier), déterminer ses points de continuité, et montrer que $h$ est intégrable au sens de Riemann en construisant, pour $\varepsilon > 0$, des fonctions en escalier $\varphi_{\varepsilon} \leqslant h \leqslant \psi_{\varepsilon}$ telles que $\mathop{\displaystyle \int}(\psi_{\varepsilon} - \varphi_{\varepsilon}) \leqslant \varepsilon$. Retrouver ce résultat par le critère de Lebesgue.

    **3.** Donner un exemple de fonction $f : \mathbb{R} \to \mathbb{R}$ intégrable au sens de Lebesgue, dont la restriction à tout segment non trivial n'est pas intégrable au sens de Riemann.
  corrige: |
    **1.** Tout intervalle non trivial contient des rationnels et des irrationnels : pour toute subdivision, la somme de Darboux supérieure vaut $1$ et l'inférieure $0$, donc $\chi_{\mathbb{Q}}$ n'est pas intégrable au sens de Riemann. Au sens de Lebesgue, $\mathbb{Q}$ est dénombrable, donc négligeable, et $\mathop{\displaystyle \int_{[0, 1]}}\chi_{\mathbb{Q}}\,\mathrm{d}\lambda = \lambda(\mathbb{Q} \cap [0, 1]) = \boxed{0}$.

    **2.** *Continuité.* En un rationnel $\dfrac{p}{q}$, $h$ vaut $\dfrac{1}{q} > 0$, mais des irrationnels arbitrairement proches donnent $0$ : $h$ y est discontinue. En un irrationnel $x_{0}$, pour $\varepsilon > 0$, seuls un nombre fini de rationnels de $]0, 1[$ ont un dénominateur $q \leqslant \dfrac{1}{\varepsilon}$ ; un voisinage de $x_{0}$ les évite, et $h < \varepsilon$ sur ce voisinage : $h$ est continue en $x_{0}$.

    *Intégrabilité.* On prend $\varphi_{\varepsilon} = 0$. L'ensemble $E$ des $x$ où $h(x) \geqslant \dfrac{\varepsilon}{2}$ est fini, de cardinal $N$. On pose $\psi_{\varepsilon} = 1$ sur des intervalles de longueur $\dfrac{\varepsilon}{2N}$ centrés aux points de $E$, et $\psi_{\varepsilon} = \dfrac{\varepsilon}{2}$ ailleurs ; alors $h \leqslant \psi_{\varepsilon}$ et $\mathop{\displaystyle \int}\psi_{\varepsilon} \leqslant \dfrac{\varepsilon}{2} + \dfrac{\varepsilon}{2} = \varepsilon$. Donc $h$ est intégrable au sens de Riemann, d'intégrale nulle. Le critère de Lebesgue (cours, th. 2) le redonne immédiatement : l'ensemble des discontinuités, $\mathbb{Q} \cap ]0, 1[$, est négligeable.

    ![Figure](documents/figures/55cedf6cd7638f88.svg)

    La fonction $h$ de Thomae (points ardoise, dénominateurs $q \leqslant 25$) : au-dessus de la bande pétrole de hauteur $\dfrac{\varepsilon}{2}$ (ici $\varepsilon = 0{,}2$), il ne reste qu'un nombre fini de points, que l'on isole dans des intervalles de longueur totale aussi petite que l'on veut.

    **3.** $\chi_{\mathbb{Q}}$ sur $\mathbb{R}$ convient : elle est intégrable au sens de Lebesgue, d'intégrale nulle, mais, discontinue en tout point, elle n'est intégrable au sens de Riemann sur aucun segment non trivial.
- id: "l3-in-04-27"
  feuille: "f-l3-in-04"
  numero: 27
  partie: "Intégrale de Riemann et intégrale de Lebesgue"
  etoiles: 1
  types: [Démonstration, Calcul]
  mots_cles: [Riemann et Lebesgue]
  noeuds: [m-riemann]
  notions: [riemann-integrable]
  page_enonce: 9
  page_corrige: 15
  enonce: |
    **1.** Étudier l'intégrabilité au sens de Riemann sur $[0, 1]$ de la fonction $f$ définie par $f(x) = \sin\dfrac{1}{x}$ si $x > 0$ et $f(0) = 0$. On pourra, pour $\varepsilon > 0$, écrire $[0, 1] = [0, \dfrac{\varepsilon}{4}] \cup [\dfrac{\varepsilon}{4}, 1]$ et traiter chaque intervalle séparément.

    **2.** Montrer que l'indicatrice de $\mathbb{N}^{*}$ est intégrable au sens de Riemann sur $[0, 100]$, d'intégrale nulle, et que l'indicatrice de $\{\dfrac{1}{n} ; n \in \mathbb{N}^{*}\}$ l'est sur $[0, 1]$, d'intégrale nulle.

    **3.** Retrouver ces résultats à l'aide du critère de Lebesgue (cours, théorème 2).
  corrige: |
    **1.** $|f| \leqslant 1$. Sur $[\dfrac{\varepsilon}{4}, 1]$, $f$ est continue, donc intégrable au sens de Riemann : il existe des fonctions en escalier $\varphi \leqslant f \leqslant \psi$ sur ce segment avec $\mathop{\displaystyle \int}(\psi - \varphi) \leqslant \dfrac{\varepsilon}{2}$. On les prolonge à $[0, \dfrac{\varepsilon}{4}[$ par $-1$ et $1$, ce qui ajoute $2 \cdot \dfrac{\varepsilon}{4}$. Ainsi $\mathop{\displaystyle \int_{0}^{1}}(\psi - \varphi) \leqslant \varepsilon$, et $f$ est intégrable au sens de Riemann, bien qu'elle oscille indéfiniment près de $0$.

    **2.** Pour $\chi_{\mathbb{N}^{*}}$ sur $[0, 100]$, on prend $\varphi = 0$ et $\psi$ égale à $1$ sur des intervalles de longueur $\dfrac{\varepsilon}{100}$ autour des entiers $1$, …, $100$, et $0$ ailleurs : $\mathop{\displaystyle \int}\psi \leqslant \varepsilon$. Pour l'indicatrice de $\{\dfrac{1}{n}\}$, les points d'indice $n > \dfrac{2}{\varepsilon}$ sont dans $[0, \dfrac{\varepsilon}{2}]$, où l'on prend $\psi = 1$ ; les autres, en nombre fini, sont isolés dans des intervalles de longueur totale $\dfrac{\varepsilon}{2}$. Dans les deux cas, l'intégrale est $\boxed{0}$.

    **3.** Les points de discontinuité sont $\{0\}$ pour la première fonction, les entiers de $1$ à $100$ pour la deuxième, et $\{0\} \cup \{\dfrac{1}{n}\}$ pour la troisième (en $0$ par accumulation des $\dfrac{1}{n}$). Ces ensembles sont dénombrables, donc négligeables, et le critère de Lebesgue s'applique. La proposition 12 du cours donne de plus les intégrales : les deux indicatrices sont nulles presque partout.
- id: "l3-in-04-28"
  feuille: "f-l3-in-04"
  numero: 28
  partie: "Intégrale de Riemann et intégrale de Lebesgue"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [Riemann et Lebesgue]
  noeuds: [m-riemann]
  notions: [riemann-integrable]
  source: "Exo7 (fic00141), exercice 5"
  page_enonce: 9
  page_corrige: 16
  enonce: |
    On dit ici qu'une partie $A$ de $\mathbb{R}$ est *négligeable au sens de Riemann* si, pour tout $\varepsilon > 0$, il existe une suite d'intervalles $I_{n} = ]a_{n}, b_{n}[$ telle que $A \subset \mathop{\displaystyle \bigcup_{n}}I_{n}$ et $\mathop{\displaystyle \sum_{n}}(b_{n} - a_{n}) \leqslant \varepsilon$.

    **1.** Montrer qu'une réunion dénombrable d'ensembles négligeables au sens de Riemann l'est aussi.

    **2.** Montrer que $A$ est négligeable au sens de Riemann si et seulement si $\lambda(A) = 0$ (chapitre 2).

    **3.** Soit $f$, $g : [a, b] \to \mathbb{R}$ intégrables au sens de Riemann. À l'aide du critère de Lebesgue, montrer que $fg$ l'est, ainsi que $\Phi \circ f$ pour toute fonction continue $\Phi : \mathbb{R} \to \mathbb{R}$.

    **4.** Montrer qu'une fonction monotone sur $[a, b]$ est intégrable au sens de Riemann.
  corrige: |
    **1.** Si $A = \mathop{\displaystyle \bigcup_{k}}A_{k}$, on recouvre $A_{k}$ par des intervalles de longueur totale $\leqslant \dfrac{\varepsilon}{2^{k+1}}$ ; la réunion de ces familles dénombrables est dénombrable, de longueur totale $\leqslant \varepsilon$.

    **2.** Si $A$ est négligeable au sens de Riemann, $\lambda^{*}(A) \leqslant \mathop{\displaystyle \sum}(b_{n} - a_{n}) \leqslant \varepsilon$ pour tout $\varepsilon$ (chapitre 2), donc $\lambda^{*}(A) = 0$, et $A$, mesurable car la tribu de Lebesgue est complète, vérifie $\lambda(A) = 0$. Inversement, si $\lambda(A) = 0$, la régularité extérieure (chapitre 2, prop. 4) fournit un ouvert $U \supset A$ avec $\lambda(U) \leqslant \varepsilon$ ; $U$ est réunion dénombrable d'intervalles ouverts disjoints, bornés puisque $\lambda(U) < +\infty$, de longueur totale $\lambda(U) \leqslant \varepsilon$. Les deux notions coïncident.

    **3.** $fg$ est bornée, et continue en tout point de continuité commun à $f$ et $g$ : ses discontinuités sont dans la réunion de deux négligeables. $\Phi \circ f$ est bornée, car $\Phi$ est bornée sur le segment qui contient les valeurs de $f$, et continue partout où $f$ l'est. Le théorème 2 du cours conclut dans les deux cas, alors qu'une démonstration directe par les sommes de Darboux est pénible.

    **4.** Une fonction monotone sur $[a, b]$ est bornée par $f(a)$ et $f(b)$, et ses discontinuités sont dénombrables (feuille 3, exercice 3), donc négligeables.
- id: "l3-in-04-29"
  feuille: "f-l3-in-04"
  numero: 29
  partie: "Intégrale de Riemann et intégrale de Lebesgue"
  etoiles: 2
  types: [Calcul]
  mots_cles: [Riemann et Lebesgue]
  noeuds: [m-riemann]
  notions: [riemann-integrable]
  page_enonce: 10
  page_corrige: 16
  enonce: |
    **1.** Donner un exemple simple de fonction non intégrable au sens de Riemann sur $[0, 1]$ dont la valeur absolue l'est. Qu'en est-il au sens de Lebesgue ?

    **2.** Énoncer le théorème de Darboux. En déduire un exemple simple de fonction intégrable au sens de Riemann sur $[0, 1]$ qui n'admet pas de primitive sur cet intervalle.

    **3.** Soit $\mathbb{Q} \cap [0, 1] = \{x_{1}, x_{2}, \dots\}$ une énumération, et $f_{n} = \chi_{\{x_{1}, \dots, x_{n}\}}$. Vérifier que les $f_{n}$ sont bornées et intégrables au sens de Riemann, et déterminer leur limite. Qu'en conclure ? Que donne ici le théorème de convergence monotone ?

    **4.** Soit $f_{n, m}(x) = (\cos(m!\pi x))^{2n}$. Déterminer $f(x) = \mathop{\displaystyle \lim_{m \to +\infty}}\mathop{\displaystyle \lim_{n \to +\infty}}f_{n, m}(x)$. Que dire de l'intégrabilité, au sens de Riemann et au sens de Lebesgue, des $f_{n, m}$, de $\mathop{\displaystyle \lim_{n}}f_{n, m}$ et de $f$ ?
  corrige: |
    **1.** $f = 2\chi_{\mathbb{Q}} - 1$ sur $[0, 1]$ : $|f| = 1$ est intégrable au sens de Riemann, mais pas $f$, pour la même raison que $\chi_{\mathbb{Q}}$. Au sens de Lebesgue, $f = -1$ p.p., et $f$ est intégrable d'intégrale $-1$. Pour une fonction *mesurable*, intégrabilité de $f$ et de $|f|$ sont équivalentes ; la mesurabilité est indispensable, comme le montre $\chi_{V} - \chi_{{V}^{c}}$, où $V$ est l'ensemble de Vitali (chapitre 2, prop. 14).

    **2.** Théorème de Darboux : la dérivée d'une fonction dérivable sur un intervalle vérifie la propriété des valeurs intermédiaires. La fonction $\chi_{[1/2, 1]}$ est intégrable au sens de Riemann sur $[0, 1]$, avec une seule discontinuité, mais ne prend que les valeurs $0$ et $1$ : elle n'est la dérivée d'aucune fonction.

    **3.** $0 \leqslant f_{n} \leqslant 1$, et $f_{n}$ n'a qu'un nombre fini de discontinuités : elle est intégrable au sens de Riemann, d'intégrale nulle. La suite croît vers $\chi_{\mathbb{Q} \cap [0, 1]}$, qui ne l'est pas (exercice 26) : une limite croissante et bornée de fonctions intégrables au sens de Riemann peut ne pas l'être. Le théorème de convergence monotone, au contraire, donne $\mathop{\displaystyle \int}\chi_{\mathbb{Q} \cap [0, 1]}\,\mathrm{d}\lambda = \mathop{\displaystyle \lim}\mathop{\displaystyle \int} f_{n} = 0$.

    **4.** $\mathop{\displaystyle \lim_{n}}f_{n, m}(x)$ vaut $1$ si $\cos^{2}(m!\pi x) = 1$, c'est-à-dire si $m!x \in \mathbb{Z}$, et $0$ sinon. Si $x = \dfrac{p}{q}$ est rationnel, $m!x \in \mathbb{Z}$ dès que $m \geqslant q$ ; si $x$ est irrationnel, jamais. Donc $\boxed{f = \chi_{\mathbb{Q}}}$. Les $f_{n, m}$ sont continues, intégrables dans les deux sens ; $\mathop{\displaystyle \lim_{n}}f_{n, m}$ est, sur $[0, 1]$, l'indicatrice de l'ensemble fini des $\dfrac{k}{m!}$, intégrable dans les deux sens, d'intégrale nulle ; $f$ n'est intégrable qu'au sens de Lebesgue. Deux passages à la limite simple suffisent à sortir de la classe de Riemann, alors que la classe des fonctions mesurables est stable par limite simple.
- id: "l3-in-04-30"
  feuille: "f-l3-in-04"
  numero: 30
  partie: "Intégrale de Riemann et intégrale de Lebesgue"
  etoiles: 2
  types: [Calcul]
  mots_cles: [Riemann et Lebesgue]
  noeuds: [m-riemann]
  notions: [riemann-integrable]
  source: "Lyon 1 (TD03 2020), exercices 4 et 5"
  page_enonce: 10
  page_corrige: 16
  enonce: |
    **1.** Soit $f : [0, 1] \to \mathbb{R}$ définie par $f(x) = x$ si $x \in \mathbb{Q}$ et $f(x) = x^{2}$ sinon. Montrer que $f$ est intégrable au sens de Lebesgue sur $[0, 1]$ et calculer son intégrale. Est-elle intégrable au sens de Riemann ? Mêmes questions pour la fonction définie sur $[0, \dfrac{\pi}{2}]$ par $f(x) = \sin x$ si $\cos x \in \mathbb{Q}$, et $f(x) = \sin^{2}x$ sinon.

    **2.** Pour $a \in \{1, \dfrac{3}{2}, 2\}$, étudier l'existence de $\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\sin x}{x^{a}}\,\mathrm{d} x$, au sens des intégrales généralisées, puis au sens de Lebesgue.

    **3.** Pour $a \in \{1, 2\}$, étudier la convergence de la série $\mathop{\displaystyle \sum_{n \geqslant 1}}\dfrac{(-1)^{n}}{n^{a}}$, puis l'existence de l'intégrale $\mathop{\displaystyle \int_{\mathbb{N}^{*}}}\dfrac{(-1)^{n}}{n^{a}}\,\mathrm{d}\mu(n)$, où $\mu$ est la mesure de comptage.
  corrige: |
    **1.** La fonction $f$ coïncide avec $x \mapsto x^{2}$ hors de $\mathbb{Q}$, qui est négligeable : $f$ est intégrable au sens de Lebesgue, et $\mathop{\displaystyle \int_{[0, 1]}}f\,\mathrm{d}\lambda = \mathop{\displaystyle \int_{0}^{1}}x^{2}\,\mathrm{d} x = \boxed{\dfrac{1}{3}}$. Elle n'est continue qu'aux points où $x = x^{2}$, soit $0$ et $1$ ; ses discontinuités forment $]0, 1[$, non négligeable, et elle n'est pas intégrable au sens de Riemann. Pour la seconde, $\{x \in [0, \dfrac{\pi}{2}] ; \cos x \in \mathbb{Q}\}$ est dénombrable, car $\cos$ est injective sur cet intervalle ; $f = \sin^{2}$ p.p., et $\mathop{\displaystyle \int} f = \mathop{\displaystyle \int_{0}^{\pi/2}}\sin^{2}x\,\mathrm{d} x = \boxed{\dfrac{\pi}{4}}$. Cet ensemble est dense, comme son complémentaire, et $f$ est discontinue partout où $\sin x \neq \sin^{2}x$, c'est-à-dire sur $]0, \dfrac{\pi}{2}[$ : elle n'est pas intégrable au sens de Riemann.

    **2.** Pour $a = 1$, l'intégrale généralisée converge (intégration par parties sur $[1, X]$), mais $\dfrac{\sin x}{x}$ n'est pas intégrable au sens de Lebesgue (cours, après la prop. 9). Pour $a = \dfrac{3}{2}$, $\big|\dfrac{\sin x}{x^{3/2}}\big| \leqslant \mathop{\displaystyle \min}(x^{-1/2}, x^{-3/2})$ : l'intégrale est absolument convergente, et la fonction est intégrable au sens de Lebesgue, avec la même valeur (cours, prop. 9). Pour $a = 2$, $\dfrac{\sin x}{x^{2}} \sim \dfrac{1}{x} > 0$ en $0$ : l'intégrale diverge dans les deux sens.

    **3.** Pour $a = 1$, la série alternée converge, vers $-\ln 2$, mais $\mathop{\displaystyle \sum}\dfrac{1}{n} = +\infty$ : la fonction $n \mapsto \dfrac{(-1)^{n}}{n}$ n'est pas intégrable pour la mesure de comptage. Pour $a = 2$, la série est absolument convergente, et l'intégrale vaut la somme, $\boxed{-\dfrac{\pi^{2}}{12}}$. L'intégrale de Lebesgue ne voit que les séries absolument convergentes, comme elle ne voit que les intégrales absolument convergentes : la semi-convergence est un phénomène d'ordre, que l'intégrale, indifférente à l'ordre des termes, ne peut capter.

