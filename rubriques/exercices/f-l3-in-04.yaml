  notions: [integrable-lebesgue]
  source: "TD2 Paris-Dauphine, exercice 14 ; Montpellier (TD 3), exercice 2 (3b) ; Bibmath, exercice 4 (3)"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    **1.** Soit $(\mu_{i})_{i \in \mathbb{N}}$ une suite de mesures sur $(\Omega, \mathcal{T})$, et $\mu(A) = \mathop{\displaystyle \sum_{i}}\mu_{i}(A)$ pour $A \in \mathcal{T}$. Montrer que $\mu$ est une mesure, et que $\mathop{\displaystyle \int} f\,\mathrm{d}\mu = \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \int} f\,\mathrm{d}\mu_{i}$ pour toute $f$ mesurable positive.

    **2.** Montrer qu'une fonction mesurable $f$ est $\mu$-intégrable si et seulement si $\mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu_{i} < +\infty$, et que l'on a alors $\mathop{\displaystyle \int} f\,\mathrm{d}\mu = \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \int} f\,\mathrm{d}\mu_{i}$.

    **3.** Soit $\varphi : \Omega \to [0, +\infty]$ mesurable et $\nu$ la mesure de densité $\varphi$ par rapport à $\mu$ (feuille 3, exercice 13). Montrer qu'une fonction mesurable $f : \Omega \to \mathbb{R}$ est $\nu$-intégrable si et seulement si $f\varphi$ est $\mu$-intégrable, et que l'on a alors $\mathop{\displaystyle \int} f\,\mathrm{d}\nu = \mathop{\displaystyle \int} f\varphi\,\mathrm{d}\mu$.
  corrige: |
    **1.** $\mu(\emptyset) = 0$, et pour des $A_{k}$ disjoints, $\mu\big(\mathop{\displaystyle \bigcup_{k}}A_{k}\big) = \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \sum_{k}}\mu_{i}(A_{k}) = \mathop{\displaystyle \sum_{k}}\mathop{\displaystyle \sum_{i}}\mu_{i}(A_{k}) = \mathop{\displaystyle \sum_{k}}\mu(A_{k})$, par échange de sommations dans une série double positive. La formule $\mathop{\displaystyle \int} f\,\mathrm{d}\mu = \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \int} f\,\mathrm{d}\mu_{i}$ vaut pour les indicatrices par définition, puis pour les fonctions étagées positives par linéarité. Pour $f$ mesurable positive, soit $(u_{k})$ étagées positives croissant vers $f$. Le membre de gauche $\mathop{\displaystyle \int} u_{k}\,\mathrm{d}\mu$ tend vers $\mathop{\displaystyle \int} f\,\mathrm{d}\mu$, et dans le membre de droite, chaque $\mathop{\displaystyle \int} u_{k}\,\mathrm{d}\mu_{i}$ croît vers $\mathop{\displaystyle \int} f\,\mathrm{d}\mu_{i}$ ; le théorème de convergence monotone pour la mesure de comptage sur $\mathbb{N}$ permet de passer à la limite sous la somme en $i$.

    **2.** La question 1 appliquée à $|f|$ donne la première affirmation. Pour $f$ réelle intégrable, $\mathop{\displaystyle \int} f^{\pm}\,\mathrm{d}\mu = \mathop{\displaystyle \sum_{i}}\mathop{\displaystyle \int} f^{\pm}\,\mathrm{d}\mu_{i}$, deux séries convergentes que l'on soustrait ; pour $f$ complexe, on traite séparément parties réelle et imaginaire.

    **3.** Par la feuille 3, exercice 13, $\mathop{\displaystyle \int}|f|\,\mathrm{d}\nu = \mathop{\displaystyle \int}|f|\varphi\,\mathrm{d}\mu = \mathop{\displaystyle \int}|f\varphi|\,\mathrm{d}\mu$, avec la convention $0 \cdot (+\infty) = 0$ : $f$ est $\nu$-intégrable si et seulement si $f\varphi$ est $\mu$-intégrable. Comme $\varphi \geqslant 0$, $(f\varphi)^{\pm} = f^{\pm}\varphi$, et l'on soustrait les formules obtenues pour $f^{+}$ et $f^{-}$ : 
    $$\boxed{\int f\,\mathrm{d}\nu = \int f\varphi\,\mathrm{d}\mu}\text{.}$$
- id: "l3-in-04-08"
  feuille: "f-l3-in-04"
  numero: 8
  partie: "Fonctions intégrables"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fonctions intégrables, inégalité de Jensen]
  noeuds: [m-integrables]
  notions: [integrable-lebesgue, fonction-convexe]
  source: "Lyon 1 (TD03 2020), exercices 29 et 30 ; Rubenthaler, exercice 4.4 ; Féjoz (exosIntegration), exercice 3.13 (a)-(c)"
  page_enonce: 3
  page_corrige: 4
  enonce: |
    On suppose $\mu(\Omega) = 1$, et l'on applique l'inégalité de Jensen (cours, prop. 5).

    **1.** Pour $f \in \mathcal{L}^{1}$ réelle, écrire l'inégalité de Jensen pour $\Phi(t) = \mathrm{e}^{t}$, pour $\Phi(t) = |t|^{p}$ avec $1 \leqslant p < +\infty$, et, si $f > 0$, pour $\Phi = -\ln$ sur $]0, +\infty[$.

    **2.** *Jensen fini.* Soit $\Phi : I \to \mathbb{R}$ convexe, $x_{1}$, …, $x_{n} \in I$ et $\alpha_{1}$, …, $\alpha_{n} \geqslant 0$ de somme $1$. En prenant $\mu = \mathop{\displaystyle \sum_{i}}\alpha_{i}\delta_{x_{i}}$ sur $I$, montrer que 
    $$\Phi\Big(\sum_{i = 1}^{n}\alpha_{i}x_{i}\Big) \leqslant \sum_{i = 1}^{n}\alpha_{i}\Phi(x_{i}).$$

    **3.** (a) En déduire que $n\mathop{\displaystyle \sum_{j = 1}^{n}}a_{j}^{2} \geqslant \Big(\mathop{\displaystyle \sum_{j = 1}^{n}}a_{j}\Big)^{2}$ pour tous réels $a_{1}$, …, $a_{n}$.

    (b) En déduire aussi que $(x_{1}\cdots x_{n})^{1/n} \leqslant \dfrac{x_{1} + \dots + x_{n}}{n}$ pour tous réels $x_{i} > 0$.

    **4.** Montrer que $\Big(\mathop{\displaystyle \int_{0}^{1}}|f(x)|\,\mathrm{d} x\Big)^{2} \leqslant \mathop{\displaystyle \int_{0}^{1}}f(x)^{2}\,\mathrm{d} x$ pour toute $f$ intégrable sur $[0, 1]$.
  corrige: |
    **1.** La proposition 5 du cours donne, pour $f$ réelle intégrable, 
    $$\mathrm{e}^{\int f\,\mathrm{d}\mu} \leqslant \int\mathrm{e}^{f}\,\mathrm{d}\mu, \qquad \Big|\int f\,\mathrm{d}\mu\Big|^{p} \leqslant \int|f|^{p}\,\mathrm{d}\mu, \qquad \int\ln f\,\mathrm{d}\mu \leqslant \ln\int f\,\mathrm{d}\mu \ \text{ si } f > 0,$$
     les membres de droite des deux premières, et celui de gauche de la troisième, pouvant être infinis. *L'erreur la plus répandue* est d'appliquer Jensen à $\ln$, qui est concave : l'inégalité est alors renversée, d'où l'emploi de $-\ln$.

    **2.** $\mu = \mathop{\displaystyle \sum_{i}}\alpha_{i}\delta_{x_{i}}$ est une probabilité sur $I$, car les $\alpha_{i}$ sont positifs de somme $1$, et l'identité $f(x) = x$ est intégrable, d'intégrale $\mathop{\displaystyle \sum_{i}}\alpha_{i}x_{i} \in I$. L'inégalité de Jensen pour $f$ donne exactement l'inégalité de convexité finie. La positivité des $\alpha_{i}$ est indispensable : sans elle, $\mu$ n'est pas une mesure.

    **3.** (a) Avec $\Phi(t) = t^{2}$ et $\alpha_{j} = \dfrac{1}{n}$ : $\big(\dfrac{1}{n}\mathop{\displaystyle \sum} a_{j}\big)^{2} \leqslant \dfrac{1}{n}\mathop{\displaystyle \sum} a_{j}^{2}$, puis on multiplie par $n^{2}$. (b) Avec $\Phi = -\ln$ et $\alpha_{j} = \dfrac{1}{n}$ : $-\ln\big(\dfrac{1}{n}\mathop{\displaystyle \sum} x_{j}\big) \leqslant -\dfrac{1}{n}\mathop{\displaystyle \sum}\ln x_{j}$, et l'on compose par l'exponentielle, qui est croissante.

    **4.** La mesure de Lebesgue de $[0, 1]$ est une probabilité ; Jensen pour $\Phi(t) = t^{2}$, appliqué à $|f|$, donne l'inégalité, le membre de droite pouvant valoir $+\infty$. C'est un cas particulier de l'inégalité de Cauchy-Schwarz, que le chapitre 8 généralisera (Hölder).
- id: "l3-in-04-09"
  feuille: "f-l3-in-04"
  numero: 9
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee, tg-arctan]
  notions: [integrable-lebesgue, arc-tangente, cosinus-sinus]
  source: "Exo7 (fic00145), exercice 13 ; Féjoz (exosIntegration), exercice 3.2 ; Rubenthaler, exercice 4.1"
  page_enonce: 4
  page_corrige: 5
  enonce: |
    Énoncer le théorème de convergence dominée, puis déterminer la limite, quand $n \to +\infty$, de :

    **1.** $\mathop{\displaystyle \int_{]0, +\infty[}}\dfrac{\mathrm{d} x}{x^{n} + \mathrm{e}^{x}}$ ;

    **2.** $\mathop{\displaystyle \int_{0}^{n}}\Big(1 - \dfrac{x}{n}\Big)^{n}x^{m}\,\mathrm{d} x$ pour $m \in \mathbb{N}$, et $\mathop{\displaystyle \int_{0}^{n}}\Big(1 + \dfrac{x}{n}\Big)^{n}\mathrm{e}^{-2x}\,\mathrm{d} x$ ;

    **3.** $\mathop{\displaystyle \int_{0}^{1}}\dfrac{1 + nx^{3}}{(1 + x^{2})^{n}}\,\mathrm{d} x$ et $\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{\sin(\pi x)}{1 + x^{n}}\,\mathrm{d} x$ ;

    **4.** $\mathop{\displaystyle \int_{0}^{1}}\dfrac{1}{\sqrt{x}}\sin\Big(\dfrac{1}{nx}\Big)\,\mathrm{d} x$, $\mathop{\displaystyle \int_{0}^{1}}\Big(1 - \dfrac{x}{n}\Big)^{n}\mathrm{d} x$ et $\mathop{\displaystyle \int_{-\infty}^{+\infty}}\sin\Big(\dfrac{x}{n}\Big)\dfrac{n}{x(1 + x^{2})}\,\mathrm{d} x$ ;

    **5.** $\mathop{\displaystyle \int_{-\infty}^{+\infty}}\mathrm{e}^{1 + \cos^{2n}x}\,\mathrm{e}^{-|x|}\,\mathrm{d} x$ et $\mathop{\displaystyle \int_{0}^{+\infty}}\arctan\Big(\dfrac{x}{n}\Big)\mathrm{e}^{-x}\,\mathrm{d} x$.
  corrige: |
    Si $f_{n} \to f$ presque partout et s'il existe $g$ intégrable telle que $|f_{n}| \leqslant g$ p.p. pour tout $n$, alors $f$ est intégrable et $\mathop{\displaystyle \int}|f_{n} - f|\,\mathrm{d}\mu \to 0$, donc $\mathop{\displaystyle \int} f_{n}\,\mathrm{d}\mu \to \mathop{\displaystyle \int} f\,\mathrm{d}\mu$ (cours, th. 1).

    **1.** Pour $x \in [0, 1[$, $x^{n} \to 0$ et $f_{n}(x) \to \mathrm{e}^{-x}$ ; $f_{n}(1) = \dfrac{1}{1 + \mathrm{e}}$ ; pour $x > 1$, $f_{n}(x) \to 0$. De plus $0 \leqslant f_{n}(x) \leqslant \mathrm{e}^{-x}$, intégrable sur $]0, +\infty[$. D'où 
    $$\lim_{n}\int_{]0, +\infty[}\frac{\mathrm{d} x}{x^{n} + \mathrm{e}^{x}} = \int_{0}^{1}\mathrm{e}^{-x}\,\mathrm{d} x = \boxed{1 - \mathrm{e}^{-1} \approx 0{,}632}\text{.}$$

    ![Figure](documents/figures/33721504a654cd10.svg)

    Les fonctions $f_{1}$, $f_{2}$, $f_{5}$, $f_{20}$ (ocre, de plus en plus épaisses) sont toutes sous $\mathrm{e}^{-x}$ (pointillés pétrole). Elles se rapprochent de $\mathrm{e}^{-x}$ sur $[0, 1[$ et s'écrasent au-delà de $1$, où la limite (carmin) est nulle : l'aire tend vers celle de $\mathrm{e}^{-x}$ sur $[0, 1]$.

    **2.** Comme $\ln(1 + u) \leqslant u$ pour $u > -1$, $0 \leqslant \big(1 - \dfrac{x}{n}\big)^{n}x^{m}\chi_{[0, n]}(x) \leqslant \mathrm{e}^{-x}x^{m}$, intégrable, et la suite tend vers $\mathrm{e}^{-x}x^{m}$. La limite est $\mathop{\displaystyle \int_{0}^{+\infty}}x^{m}\mathrm{e}^{-x}\,\mathrm{d} x = \boxed{m!}$, par récurrence et intégration par parties. De même, $0 \leqslant \big(1 + \dfrac{x}{n}\big)^{n}\mathrm{e}^{-2x}\chi_{[0, n]} \leqslant \mathrm{e}^{-x}$, et la limite est $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-x}\,\mathrm{d} x = \boxed{1}$.

    **3.** Sur $[0, 1]$, $(1 + x^{2})^{n} \geqslant 1 + nx^{2} \geqslant 1 + nx^{3}$, donc la première intégrande est majorée par $1$ ; elle tend vers $0$ pour $x \in ]0, 1]$, puisque $n(1 + x^{2})^{-n} \to 0$. La limite est $\boxed{0}$. Pour la troisième, si $n \geqslant 2$, $\big|\dfrac{\sin(\pi x)}{1 + x^{n}}\big| \leqslant \chi_{[0, 1]}(x) + \dfrac{1}{x^{2}}\chi_{]1, +\infty[}(x)$, et l'intégrande tend vers $\sin(\pi x)\chi_{[0, 1[}(x)$ ; la limite est $\mathop{\displaystyle \int_{0}^{1}}\sin(\pi x)\,\mathrm{d} x = \boxed{\dfrac{2}{\pi}}$.

    **4.** $\big|\dfrac{1}{\sqrt{x}}\sin\dfrac{1}{nx}\big| \leqslant \dfrac{1}{\sqrt{x}}$, intégrable sur $]0, 1]$, et l'intégrande tend vers $0$ : limite $\boxed{0}$. Ensuite $0 \leqslant (1 - \dfrac{x}{n})^{n} \leqslant 1$ sur $[0, 1]$, de limite $\mathrm{e}^{-x}$ : limite $\boxed{1 - \mathrm{e}^{-1}}$. Enfin, $|\sin u| \leqslant |u|$ donne $\big|\sin\big(\dfrac{x}{n}\big)\dfrac{n}{x(1 + x^{2})}\big| \leqslant \dfrac{1}{1 + x^{2}}$, et l'intégrande tend vers $\dfrac{1}{1 + x^{2}}$ : limite $\boxed{\pi}$.

    **5.** L'intégrande est majorée par $\mathrm{e}^{2}\mathrm{e}^{-|x|}$ ; $\cos^{2n}x \to 0$ hors de $\pi\mathbb{Z}$, négligeable, et la limite est $\mathop{\displaystyle \int_{\mathbb{R}}}\mathrm{e}^{1}\mathrm{e}^{-|x|}\,\mathrm{d} x = \boxed{2\mathrm{e} \approx 5{,}44}$. Enfin $|\arctan(\dfrac{x}{n})\mathrm{e}^{-x}| \leqslant \dfrac{\pi}{2}\mathrm{e}^{-x}$, de limite nulle : limite $\boxed{0}$.
- id: "l3-in-04-10"
  feuille: "f-l3-in-04"
  numero: 10
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue, puissance-reelle]
  source: "Lyon 1 (TD03 2020), exercices 11, 12, 14, 15, 22 et 24"
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** Pour $\alpha \in \mathbb{R}$, déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{1}}\Big(x^{\alpha} + \dfrac{\mathrm{e}^{x}}{n}\Big)^{-1}\mathrm{d} x$.

    **2.** Calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{1}^{+\infty}}\dfrac{n\sin(x/n)}{x^{3}}\,\mathrm{d} x$ et $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{(\sin x)^{n}}{x^{2}}\,\mathrm{d} x$ (intégrale définie pour $n \geqslant 2$).

    **3.** Soit $f$ intégrable sur $[0, +\infty[$. Calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{+\infty}}f(x)\dfrac{x}{x + n}\,\mathrm{d} x$.

    **4.** On rappelle que $\big(1 + \dfrac{x}{n}\big)^{n}$ croît vers $\mathrm{e}^{x}$ pour $x \geqslant 0$. Pour $n \geqslant 2$ et $x > 0$, soit 
    $$f_{n}(x) = \frac{1}{x^{1/n}\big(1 + \frac{x}{n}\big)^{n}}.$$
     Montrer que l'on a $f_{n}(x) \leqslant \dfrac{4}{x^{2}}$ pour $x \geqslant 1$, que $f_{n}$ est intégrable sur $]0, +\infty[$, et calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{+\infty}}f_{n}(x)\,\mathrm{d} x$.

    **5.** Sur $[0, 1]$, soit $f_{n}(x) = n^{2}x$ si $0 \leqslant x < \dfrac{1}{n}$, $f_{n}(x) = -n^{2}\big(x - \dfrac{2}{n}\big)$ si $\dfrac{1}{n} \leqslant x \leqslant \dfrac{2}{n}$, et $f_{n}(x) = 0$ sinon. Tracer $f_{n}$, puis calculer et comparer 
    $$\liminf_{n}\int f_{n}\,\mathrm{d}\lambda,\quad \int\liminf_{n}f_{n}\,\mathrm{d}\lambda,\quad \limsup_{n}\int f_{n}\,\mathrm{d}\lambda,\quad \int\limsup_{n}f_{n}\,\mathrm{d}\lambda.$$
     Mêmes questions avec $g_{2p} = \chi_{[0, 1/(2p)]}$ et $g_{2p+1} = \chi_{[1/(2p+1), 1]}$.
  corrige: |
    **1.** L'intégrande croît avec $n$ vers $x^{-\alpha}$. Par convergence monotone, la limite est $\mathop{\displaystyle \int_{0}^{1}}x^{-\alpha}\,\mathrm{d} x$, soit 
    $$\boxed{\frac{1}{1 - \alpha} \text{ si } \alpha < 1, \text{ et } +\infty \text{ si } \alpha \geqslant 1}.$$
     Aucune domination n'est nécessaire : la monotonie suffit, et elle autorise une limite infinie.

    **2.** $|n\sin(x/n)| \leqslant x$ donne $\big|\dfrac{n\sin(x/n)}{x^{3}}\big| \leqslant \dfrac{1}{x^{2}}$ sur $[1, +\infty[$, et l'intégrande tend vers $\dfrac{1}{x^{2}}$ : limite $\boxed{1}$. Pour $n \geqslant 2$, $|\sin x|^{n} \leqslant \sin^{2}x \leqslant \mathop{\displaystyle \min}(x^{2}, 1)$, d'où $\dfrac{|\sin x|^{n}}{x^{2}} \leqslant \mathop{\displaystyle \min}\big(1, \dfrac{1}{x^{2}}\big)$, intégrable ; l'intégrande tend vers $0$ hors de $\dfrac{\pi}{2} + \pi\mathbb{Z}$ : limite $\boxed{0}$.

    **3.** $\big|f(x)\dfrac{x}{x + n}\big| \leqslant |f(x)|$, et le facteur tend vers $0$ : limite $\boxed{0}$.

    **4.** Pour $x \geqslant 1$, $x^{1/n} \geqslant 1$ et, la suite $\big(1 + \dfrac{x}{n}\big)^{n}$ étant croissante, $\big(1 + \dfrac{x}{n}\big)^{n} \geqslant \big(1 + \dfrac{x}{2}\big)^{2} \geqslant \dfrac{x^{2}}{4}$ : $f_{n}(x) \leqslant \dfrac{4}{x^{2}}$. Pour $0 < x < 1$, $f_{n}(x) \leqslant x^{-1/n} \leqslant x^{-1/2}$. Ainsi $f_{n}$ est majorée par la fonction intégrable $x^{-1/2}\chi_{]0, 1[} + 4x^{-2}\chi_{[1, +\infty[}$, et $f_{n}(x) \to \mathrm{e}^{-x}$ : la limite est $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-x}\,\mathrm{d} x = \boxed{1}$.

    **5.** $f_{n}$ est un triangle de base $[0, \dfrac{2}{n}]$ et de hauteur $n$, d'aire $1$, et $f_{n}(x) \to 0$ en tout point (pour $x > 0$, dès que $\dfrac{2}{n} < x$). Donc 
    $$\liminf\int f_{n} = \limsup\int f_{n} = 1, \qquad \int\liminf f_{n} = \int\limsup f_{n} = 0 \text{ :}$$
     l'inégalité de Fatou est stricte. Pour $(g_{n})$, $\mathop{\displaystyle \int} g_{2p} = \dfrac{1}{2p} \to 0$ et $\mathop{\displaystyle \int} g_{2p+1} = 1 - \dfrac{1}{2p+1} \to 1$, donc $\mathop{\displaystyle \liminf}\mathop{\displaystyle \int} g_{n} = 0$ et $\mathop{\displaystyle \limsup}\mathop{\displaystyle \int} g_{n} = 1$. Pour $x \in ]0, 1]$, $g_{2p}(x) = 0$ et $g_{2p+1}(x) = 1$ pour $p$ grand, donc $\mathop{\displaystyle \liminf} g_{n} = 0$ et $\mathop{\displaystyle \limsup} g_{n} = 1$ p.p., et 
    $$\int\liminf g_{n} = 0 = \liminf\int g_{n}, \qquad \int\limsup g_{n} = 1 = \limsup\int g_{n}.$$
     Les $g_{n}$ sont dominées par $1$, ce qui donne l'inégalité « de Fatou inverse » $\mathop{\displaystyle \limsup}\mathop{\displaystyle \int} g_{n} \leqslant \mathop{\displaystyle \int}\mathop{\displaystyle \limsup} g_{n}$ ; les $f_{n}$ ne le sont pas, et cette inégalité tombe en défaut.

    ![Figure](documents/figures/8bc4819ce0f9e54c.svg)

    Les triangles $f_{2}$, $f_{3}$, $f_{5}$ (ocre) ont tous une aire $1$, mais leurs sommets s'échappent vers l'axe vertical, et la limite simple est nulle (carmin). Leur enveloppe supérieure est de l'ordre de $\dfrac{1}{x}$ (pointillés pétrole), qui n'est pas intégrable près de $0$ : il n'y a pas de domination intégrable.
- id: "l3-in-04-11"
  feuille: "f-l3-in-04"
  numero: 11
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 18 ; Rubenthaler, exercice 4.2"
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On admet que, pour $y \geqslant 0$, la suite $\big((1 - \dfrac{y}{n})^{n}\big)_{n \geqslant y}$ croît vers $\mathrm{e}^{-y}$ (on peut étudier, pour $0 \leqslant x < n$, la fonction $n \mapsto n\ln(1 - \dfrac{x}{n})$).

    **1.** Soit $f_{n}(x) = n(1 - x)^{n}\sin^{2}(nx)\chi_{[0, 1]}(x)$. Déterminer la limite simple $f$ de $(f_{n})$, calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\mathbb{R}}}f_{n}\,\mathrm{d}\lambda$ par le changement de variable $y = nx$ et le théorème de convergence monotone, et constater que $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int} f_{n}\,\mathrm{d}\lambda \neq \mathop{\displaystyle \int} f\,\mathrm{d}\lambda$.

    **2.** Pour $\alpha \in \mathbb{R}$, déterminer $I(\alpha) = \mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{n}}\Big(1 - \dfrac{x}{n}\Big)^{n}\mathrm{e}^{\alpha x}\,\mathrm{d} x$.
  corrige: |
    Pour $0 \leqslant x < t$, la fonction $\psi(t) = t\ln(1 - \dfrac{x}{t})$ a pour dérivée $\ln(1 - u) + \dfrac{u}{1 - u}$, avec $u = \dfrac{x}{t}$, qui est positive puisque $\ln\dfrac{1}{1 - u} \leqslant \dfrac{1}{1 - u} - 1$. La suite $\big(1 - \dfrac{y}{n}\big)^{n}$ croît donc, et tend vers $\mathrm{e}^{-y}$.

    **1.** Pour $x \in ]0, 1]$, $n(1 - x)^{n} \to 0$, et $f_{n}(0) = 0$ : $f = 0$. Le changement de variable $y = nx$ (chapitre 2, prop. 12) donne 
    $$\int_{\mathbb{R}}f_{n}\,\mathrm{d}\lambda = \int_{0}^{n}\Big(1 - \frac{y}{n}\Big)^{n}\sin^{2}y\,\mathrm{d} y.$$
     L'intégrande $h_{n}(y) = \big(1 - \dfrac{y}{n}\big)^{n}\sin^{2}y\,\chi_{[0, n]}(y)$ croît vers $\mathrm{e}^{-y}\sin^{2}y$, et la convergence monotone donne, avec $\sin^{2}y = \dfrac{1 - \cos 2y}{2}$, 
    $$\lim_{n}\int f_{n}\,\mathrm{d}\lambda = \int_{0}^{+\infty}\mathrm{e}^{-y}\sin^{2}y\,\mathrm{d} y = \frac{1}{2} - \frac{1}{2} \cdot \frac{1}{1 + 4} = \boxed{\frac{2}{5}} \neq 0 = \int f\,\mathrm{d}\lambda.$$

    ![Figure](documents/figures/c101d685a27bf9ac.svg)

    Après le changement de variable, les fonctions $h_{2}$, $h_{4}$, $h_{10}$ (ocre) croissent vers $\mathrm{e}^{-y}\sin^{2}y$ (tirets carmin), d'aire $\dfrac{2}{5}$. Avant le changement de variable, toute cette masse se concentre près de $x = 0$, où la limite simple ne la voit pas.

    **2.** $\big(1 - \dfrac{x}{n}\big)^{n}\mathrm{e}^{\alpha x}\chi_{[0, n]}(x)$ croît vers $\mathrm{e}^{(\alpha - 1)x}$, et la convergence monotone donne 
    $$I(\alpha) = \int_{0}^{+\infty}\mathrm{e}^{(\alpha - 1)x}\,\mathrm{d} x = \boxed{\frac{1}{1 - \alpha} \text{ si } \alpha < 1, \qquad +\infty \text{ si } \alpha \geqslant 1}\text{.}$$
     Pour $\alpha < 1$, la convergence dominée par $\mathrm{e}^{(\alpha - 1)x}$ conduirait au même résultat ; la monotonie traite en plus le cas infini.
