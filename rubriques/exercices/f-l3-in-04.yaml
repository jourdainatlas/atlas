  page_corrige: 11
  enonce: |
    **1.** Pour $n \geqslant 1$ et $x \in \mathbb{R}$, soit $f_{n}(x) = \mathrm{e}^{-nx} - 2\mathrm{e}^{-2nx}$. Montrer que $\mathop{\displaystyle \sum} f_{n}(x)$ converge pour $x > 0$ et calculer sa somme $f(x)$. Comparer $\mathop{\displaystyle \int_{0}^{+\infty}}f(x)\,\mathrm{d} x$ et $\mathop{\displaystyle \sum_{n \geqslant 1}}\mathop{\displaystyle \int_{0}^{+\infty}}f_{n}(x)\,\mathrm{d} x$, et expliquer.

    **2.** Montrer que $f(x) = \dfrac{\sin x}{\mathrm{e}^{x} - 1}$ est intégrable sur $]0, +\infty[$, que $f(x) = \mathop{\displaystyle \sum_{n \geqslant 1}}\mathrm{e}^{-nx}\sin x$ pour $x > 0$, et en déduire que 
    $$\int_{0}^{+\infty}\frac{\sin x}{\mathrm{e}^{x} - 1}\,\mathrm{d} x = \sum_{n = 1}^{+\infty}\frac{1}{n^{2} + 1}.$$

    **3.** Pour $a$, $b > 0$, montrer que $\mathop{\displaystyle \int_{0}^{+\infty}}\dfrac{x\mathrm{e}^{-ax}}{1 - \mathrm{e}^{-bx}}\,\mathrm{d} x = \mathop{\displaystyle \sum_{n = 0}^{+\infty}}\dfrac{1}{(a + nb)^{2}}$.

    **4.** Montrer que $f(x) = \mathop{\displaystyle \sum_{n \geqslant 1}}n\mathrm{e}^{-nx}$ est intégrable sur $[1, +\infty[$ et calculer son intégrale.

    **5.** Soit $\mu$ une mesure sur $\mathbb{R}$ telle que $x \mapsto \mathrm{e}^{x^{2}}$ soit $\mu$-intégrable. Donner un exemple d'une telle mesure, puis montrer que, pour tout $z \in \mathbb{C}$, 
    $$\sum_{n = 0}^{+\infty}\frac{z^{n}}{n!}\int_{\mathbb{R}}x^{n}\,\mathrm{d}\mu(x) = \int_{\mathbb{R}}\mathrm{e}^{zx}\,\mathrm{d}\mu(x).$$

    **6.** En écrivant une série comme une intégrale par rapport à la mesure de comptage sur $\mathbb{N}$, calculer 
    $$\lim_{k \to +\infty}\sum_{n \geqslant 0}\frac{1}{3^{n}}\Big(1 - \frac{1}{k(n + 1)}\Big) \qquad\text{et}\qquad \lim_{k \to +\infty}\sum_{n \geqslant 0}\frac{\sin(n/k)}{2^{n}}.$$
  corrige: |
    **1.** Pour $x > 0$, les séries géométriques donnent 
    $$f(x) = \frac{1}{\mathrm{e}^{x} - 1} - \frac{2}{\mathrm{e}^{2x} - 1} = \frac{\mathrm{e}^{x} + 1 - 2}{\mathrm{e}^{2x} - 1} = \frac{1}{\mathrm{e}^{x} + 1}, \qquad \int_{0}^{+\infty}f = \Big[-\ln(1 + \mathrm{e}^{-x})\Big]_{0}^{+\infty} = \boxed{\ln 2}\text{,}$$
     alors que $\mathop{\displaystyle \int_{0}^{+\infty}}f_{n} = \dfrac{1}{n} - \dfrac{2}{2n} = 0$, de sorte que $\mathop{\displaystyle \sum_{n}}\mathop{\displaystyle \int} f_{n} = \boxed{0}$. La proposition 7 du cours ne s'applique pas : avec $t = nx$, $\mathop{\displaystyle \int}|f_{n}| = \dfrac{1}{n}\mathop{\displaystyle \int_{0}^{+\infty}}|\mathrm{e}^{-t} - 2\mathrm{e}^{-2t}|\,\mathrm{d} t = \dfrac{1}{2n}$, et $\mathop{\displaystyle \sum}\dfrac{1}{2n} = +\infty$. Chaque $f_{n}$ a autant d'aire au-dessus qu'au-dessous de l'axe, mais ces compensations ne passent pas à la somme.

    **2.** Comme $\mathrm{e}^{x} - 1 \geqslant x$, $|f(x)| \leqslant 1$ sur $]0, 1]$, et, pour $x \geqslant 1$, $\mathrm{e}^{x} - 1 \geqslant \dfrac{\mathrm{e}^{x}}{2}$ donne $|f(x)| \leqslant 2\mathrm{e}^{-x}$ : $f$ est intégrable. Pour $x > 0$, $\dfrac{1}{\mathrm{e}^{x} - 1} = \mathop{\displaystyle \sum_{n \geqslant 1}}\mathrm{e}^{-nx}$. De plus $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-nx}|\sin x|\,\mathrm{d} x \leqslant \mathop{\displaystyle \int_{0}^{+\infty}}x\mathrm{e}^{-nx}\,\mathrm{d} x = \dfrac{1}{n^{2}}$, terme général d'une série convergente. Comme $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-nx}\sin x\,\mathrm{d} x = \operatorname{Im}\dfrac{1}{n - \mathrm{i}} = \dfrac{1}{n^{2} + 1}$, la proposition 7 donne 
    $$\int_{0}^{+\infty}\frac{\sin x}{\mathrm{e}^{x} - 1}\,\mathrm{d} x = \sum_{n \geqslant 1}\frac{1}{n^{2} + 1} \approx 1{,}0767.$$

    **3.** Pour $x > 0$, $\dfrac{x\mathrm{e}^{-ax}}{1 - \mathrm{e}^{-bx}} = \mathop{\displaystyle \sum_{n \geqslant 0}}x\mathrm{e}^{-(a + nb)x}$, série de fonctions positives, et $\mathop{\displaystyle \int_{0}^{+\infty}}x\mathrm{e}^{-cx}\,\mathrm{d} x = \dfrac{1}{c^{2}}$ ; on intègre terme à terme (chapitre 3, prop. 13).

    **4.** Les termes sont positifs, et $\mathop{\displaystyle \int_{1}^{+\infty}}n\mathrm{e}^{-nx}\,\mathrm{d} x = \mathrm{e}^{-n}$ : $\mathop{\displaystyle \int_{1}^{+\infty}}f = \mathop{\displaystyle \sum_{n \geqslant 1}}\mathrm{e}^{-n} = \boxed{\dfrac{1}{\mathrm{e} - 1} \approx 0{,}582}$, fini.

    **5.** La mesure $\delta_{0}$ convient, ou la mesure de densité $\mathrm{e}^{-2x^{2}}$, puisque $\mathop{\displaystyle \int}\mathrm{e}^{x^{2}}\mathrm{e}^{-2x^{2}}\,\mathrm{d} x = \sqrt{\pi}$. Comme $\mathrm{e}^{x^{2}} \geqslant 1$, $\mu$ est finie. Les sommes partielles $S_{N}(x) = \mathop{\displaystyle \sum_{k \leqslant N}}\dfrac{(zx)^{k}}{k!}$ tendent vers $\mathrm{e}^{zx}$ et vérifient 
    $$|S_{N}(x)| \leqslant \mathrm{e}^{|z||x|} \leqslant \mathrm{e}^{|z|^{2}}\mathrm{e}^{x^{2}},$$
     car $|z||x| \leqslant |z|^{2} + x^{2}$ ; ce majorant est intégrable. En particulier chaque $x^{k}$ est intégrable, et la convergence dominée, avec la linéarité, donne la formule. On a ainsi développé la transformée $z \mapsto \mathop{\displaystyle \int}\mathrm{e}^{zx}\,\mathrm{d}\mu$ en série entière dont les coefficients sont les moments de $\mu$.

    **6.** Sur $\mathbb{N}$ muni de la mesure de comptage, les termes sont dominés par $3^{-n}$, puis par $2^{-n}$, termes de séries convergentes, et tendent vers $3^{-n}$, puis vers $0$. Les limites valent donc $\boxed{\dfrac{3}{2}}$ et $\boxed{0}$.
- id: "l3-in-04-20"
  feuille: "f-l3-in-04"
  numero: 20
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $(f_{n})$ une suite de fonctions intégrables sur $\Omega$, à valeurs dans $\overline{\mathbb{R}}$, qui converge simplement vers $f$. On suppose que la suite $\Big(\mathop{\displaystyle \int}|f_{n}|\,\mathrm{d}\mu\Big)_{n}$ est majorée. La fonction $f$ est-elle intégrable ? Si oui, a-t-on $\mathop{\displaystyle \int}|f|\,\mathrm{d}\mu = \mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int}|f_{n}|\,\mathrm{d}\mu$ ?
  corrige: |
    La fonction $f$ est mesurable, comme limite simple, et le lemme de Fatou appliqué aux $|f_{n}|$ donne 
    $$\int|f|\,\mathrm{d}\mu = \int\liminf_{n}|f_{n}|\,\mathrm{d}\mu \leqslant \liminf_{n}\int|f_{n}|\,\mathrm{d}\mu \leqslant M,$$
     où $M$ majore les $\mathop{\displaystyle \int}|f_{n}|$ : $f$ est intégrable. En revanche l'égalité est fausse en général : sur $[0, 1]$, $f_{n} = n\chi_{]0, 1/n]}$ converge simplement vers $0$, avec $\mathop{\displaystyle \int}|f_{n}| = 1$. La suite $\mathop{\displaystyle \int}|f_{n}|$ n'a d'ailleurs pas forcément de limite.
- id: "l3-in-04-21"
  feuille: "f-l3-in-04"
  numero: 21
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $(a_{n})$ une suite réelle, $f : \mathbb{R} \to \mathbb{R}$ intégrable, et $f_{n}(x) = nf\big(2^{n}(x - a_{n})\big)$.

    **1.** Montrer que $\mathop{\displaystyle \sum_{n = 1}^{+\infty}}\mathop{\displaystyle \int_{\mathbb{R}}}|f_{n}(x)|\,\mathrm{d} x < +\infty$.

    **2.** En déduire que la série $\mathop{\displaystyle \sum} f_{n}(x)$ converge pour presque tout $x$.

    **3.** On suppose de plus $f \geqslant 0$ et $f(0) > 0$. Soit 
    $$S(x) = \sum_{k = 1}^{+\infty}f_{k}(x) \in [0, +\infty].$$
     Montrer que $S(a_{n}) \geqslant nf(0)$ pour tout $n$. En déduire que, si $\{a_{n} ; n \in \mathbb{N}\}$ est dense dans $\mathbb{R}$, alors $\{S > M\}$ est dense dans $\mathbb{R}$ pour tout $M > 0$, bien que $S$ soit finie presque partout.
  corrige: |
    **1.** Par changement de variable affine (chapitre 2, prop. 12), $\mathop{\displaystyle \int}|f_{n}| = n2^{-n}\mathop{\displaystyle \int}|f|$, et $\mathop{\displaystyle \sum_{n \geqslant 1}}n2^{-n} = 2$ : $\mathop{\displaystyle \sum}\mathop{\displaystyle \int}|f_{n}| = 2\mathop{\displaystyle \int}|f| < +\infty$.

    **2.** La proposition 7 du cours donne la convergence absolue de $\mathop{\displaystyle \sum} f_{n}(x)$ pour presque tout $x$ ; la somme $S$ est même intégrable, d'intégrale $2\mathop{\displaystyle \int} f$ lorsque $f \geqslant 0$.

    **3.** Les termes étant positifs, $S(a_{n}) \geqslant f_{n}(a_{n}) = nf(0)$. Soit $U$ un intervalle ouvert non vide. Comme $D$ est dense et que $U$ contient une infinité d'intervalles ouverts disjoints, $U$ contient une infinité de points $a_{n}$, donc des $a_{n}$ d'indice $n > \dfrac{M}{f(0)}$, en lesquels $S > M$. Ainsi $\{S > M\}$ rencontre tout ouvert : il est dense. La fonction $S$ est finie presque partout, et même intégrable, mais elle n'est bornée sur aucun intervalle : une fonction intégrable peut être très irrégulière.
- id: "l3-in-04-22"
  feuille: "f-l3-in-04"
