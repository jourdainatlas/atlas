  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Exo7 (fic00145), exercice 8 ; Montpellier (TD 3), exercice 4 ; Lyon 1 (TD03 2020), exercices 7 et 17"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Soit $f : \mathbb{R} \to \mathbb{C}$ intégrable. Calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\mathbb{R}}}f(x)\cos^{n}(x)\,\mathrm{d} x$ et $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\mathbb{R}}}f(x)\cos^{n}(\pi x)\,\mathrm{d} x$.

    **2.** Soit $f$ intégrable sur $[0, +\infty[$. Calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-n\sin^{2}x}f(x)\,\mathrm{d} x$.

    **3.** Soit $P$ une probabilité sur $(\mathbb{R}, \mathcal{B}(\mathbb{R}))$, et $I_{n} = \mathop{\displaystyle \int_{\mathbb{R}}}(\cos\pi t)^{2n}\,\mathrm{d} P(t)$. Montrer que $I_{n}$ est fini, que la suite $(I_{n})$ décroît, et déterminer sa limite.
  corrige: |
    **1.** $|f(x)\cos^{n}x| \leqslant |f(x)|$, et $\cos^{n}x \to 0$ hors de $\pi\mathbb{Z}$, négligeable : la limite est $\boxed{0}$. De même pour $\cos^{n}(\pi x)$, hors de $\mathbb{Z}$.

    **2.** $\mathrm{e}^{-n\sin^{2}x}f(x)$ est dominée par $|f|$, et tend vers $0$ hors de $\pi\mathbb{N}$ : limite $\boxed{0}$.

    **3.** $0 \leqslant (\cos\pi t)^{2n} \leqslant 1$, donc $I_{n} \leqslant P(\mathbb{R}) = 1$, et la suite $(\cos^{2}\pi t)^{n}$ décroît. Elle tend vers $\chi_{\mathbb{Z}}(t)$, puisque $\cos^{2}\pi t = 1$ si et seulement si $t \in \mathbb{Z}$. La constante $1$ est $P$-intégrable, d'où $\boxed{I_{n} \to P(\mathbb{Z})}$. Ici $\mathbb{Z}$ n'est pas négligeable en général : si $P = \delta_{0}$, $I_{n} = 1$ pour tout $n$.

    ![Figure](documents/figures/4b5629b2b5203607.svg)

    Les fonctions $(\cos\pi t)^{2n}$ pour $n = 1$, $4$, $20$ (ocre) se resserrent autour des entiers, et tendent vers l'indicatrice de $\mathbb{Z}$ (points carmin sur la droite des abscisses en tirets). Une mesure qui charge les entiers garde cette masse à la limite ; la mesure de Lebesgue n'en garde rien.
- id: "l3-in-04-15"
  feuille: "f-l3-in-04"
  numero: 15
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD03 2020), exercices 8 et 21 ; Montpellier (TD 3), exercice 3"
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $f : \Omega \to [0, +\infty]$ mesurable, et 
    $$A = \{f < 1\}, \qquad B = \{f = 1\}, \qquad C = \{f > 1\}.$$

    **1.** Déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{B \cup C}}f^{n}\,\mathrm{d}\mu$.

    **2.** Montrer que la série $\mathop{\displaystyle \sum_{n \geqslant 0}}\mathop{\displaystyle \int_{A}}f^{n}\,\mathrm{d}\mu$ converge si et seulement si $\dfrac{\chi_{A}}{1 - f}$ est intégrable.

    **3.** On suppose $f$ intégrable. Déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{A \cup B}}f^{n}\,\mathrm{d}\mu$, puis $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\Omega}}f^{n}\,\mathrm{d}\mu$. Que dire de cette dernière limite sans l'hypothèse d'intégrabilité ?

    **4.** On suppose $\mu$ finie et $f$ à valeurs finies. Déterminer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\Omega}}\dfrac{f^{n}}{1 + f^{n}}\,\mathrm{d}\mu$ et $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\Omega}}\dfrac{\mathrm{d}\mu}{1 + f^{n}}$. Expliciter le cas de $\Omega = [0, 1]$ muni de $\lambda$.
  corrige: |
    **1.** $f^{n}\chi_{B \cup C}$ croît vers $\chi_{B} + (+\infty)\chi_{C}$ ; par convergence monotone, 
    $$\lim_{n}\int_{B \cup C}f^{n}\,\mathrm{d}\mu = \boxed{\mu(B) \text{ si } \mu(C) = 0, \quad +\infty \text{ sinon}}\text{.}$$

    **2.** Sur $A$, $\mathop{\displaystyle \sum_{n \geqslant 0}}f^{n} = \dfrac{1}{1 - f}$, et l'intégration terme à terme des séries positives (chapitre 3, prop. 13) donne $\mathop{\displaystyle \sum_{n}}\mathop{\displaystyle \int_{A}}f^{n}\,\mathrm{d}\mu = \mathop{\displaystyle \int_{A}}\dfrac{\mathrm{d}\mu}{1 - f}$, d'où l'équivalence.

    **3.** Sur $A \cup B$, $0 \leqslant f^{n} \leqslant f$, intégrable, et $f^{n} \to \chi_{B}$ : $\mathop{\displaystyle \int_{A \cup B}}f^{n} \to \boxed{\mu(B)}$. Avec la question 1, $\mathop{\displaystyle \int_{\Omega}}f^{n}$ tend vers $\mu(B)$ si $\mu(C) = 0$, et vers $+\infty$ sinon. Sans intégrabilité, le cas $\mu(C) > 0$ ne change pas. Si $\mu(C) = 0$, la suite $\mathop{\displaystyle \int_{A}}f^{n}$ décroît ; elle tend vers $0$ dès que l'un de ses termes est fini (convergence dominée par ce terme), mais elle peut valoir $+\infty$ pour tout $n$ : sur $\mathbb{R}$, avec $f = \dfrac{1}{2}$.

    **4.** $\dfrac{f^{n}}{1 + f^{n}}$ tend vers $0$ sur $A$, $\dfrac{1}{2}$ sur $B$, $1$ sur $C$, en restant entre $0$ et $1$. Comme $\mu$ est finie, la convergence bornée (cours, prop. 6) donne 
    $$\int\frac{f^{n}}{1 + f^{n}}\,\mathrm{d}\mu \to \boxed{\mu(C) + \frac{\mu(B)}{2}}, \qquad \int\frac{\mathrm{d}\mu}{1 + f^{n}} \to \boxed{\mu(A) + \frac{\mu(B)}{2}}\text{,}$$
     puisque $\dfrac{1}{1 + f^{n}} = 1 - \dfrac{f^{n}}{1 + f^{n}}$. Sur $[0, 1]$, la seconde limite est $\lambda(\{f < 1\}) + \dfrac{1}{2}\lambda(\{f = 1\})$ ; pour $f(x) = 2x$, elle vaut $\dfrac{1}{2}$.
- id: "l3-in-04-16"
  feuille: "f-l3-in-04"
  numero: 16
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Pour $n \in \mathbb{N}^{*}$ et $x \in \mathbb{R}$, soit $g_{n}(x) = \chi_{[0, n[}(x^{2})\,x^{2}\Big(1 - \dfrac{x^{2}}{n}\Big)^{n}$.

    **1.** Déterminer l'ensemble $D$ des $x \in \mathbb{R}$ pour lesquels $\mathop{\displaystyle \lim_{n}}g_{n}(x)$ existe, et cette limite.

    **2.** Trouver une fonction $g$ intégrable sur $[0, +\infty[$ telle que l'on ait $0 \leqslant g_{n} \leqslant g$, et en déduire $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{0}^{+\infty}}g_{n}(x)\,\mathrm{d} x$. On admettra que $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \dfrac{\sqrt{\pi}}{2}$.
  corrige: |
    **1.** Pour $x$ fixé et $n > x^{2}$, $g_{n}(x) = x^{2}\big(1 - \dfrac{x^{2}}{n}\big)^{n} \to x^{2}\mathrm{e}^{-x^{2}}$ : la limite existe pour tout $x$, et $\boxed{D = \mathbb{R}}$.

    **2.** Comme $\big(1 - \dfrac{u}{n}\big)^{n} \leqslant \mathrm{e}^{-u}$ pour $0 \leqslant u \leqslant n$, $0 \leqslant g_{n}(x) \leqslant g(x) = x^{2}\mathrm{e}^{-x^{2}}$, qui est intégrable. Par convergence dominée puis intégration par parties, 
    $$\lim_{n}\int_{0}^{+\infty}g_{n} = \int_{0}^{+\infty}x^{2}\mathrm{e}^{-x^{2}}\,\mathrm{d} x = \Big[-\frac{x}{2}\mathrm{e}^{-x^{2}}\Big]_{0}^{+\infty} + \frac{1}{2}\int_{0}^{+\infty}\mathrm{e}^{-x^{2}}\,\mathrm{d} x = \boxed{\frac{\sqrt{\pi}}{4} \approx 0{,}443}\text{.}$$
     L'énoncé source rappelait $\mathop{\displaystyle \int_{0}^{+\infty}}\mathrm{e}^{-t^{2}}\,\mathrm{d} t = \sqrt{\pi}$, ce qui aurait donné $\dfrac{\sqrt{\pi}}{2}$ : c'est l'intégrale sur $\mathbb{R}$ qui vaut $\sqrt{\pi}$. Ici la limite est elle-même la domination.

    ![Figure](documents/figures/a2004f2dff833b08.svg)

    Les fonctions $g_{1}$, $g_{2}$, $g_{5}$ (ocre), nulles au-delà de $\sqrt{n}$, croissent vers $x^{2}\mathrm{e}^{-x^{2}}$ (tirets carmin), qui les domine toutes et dont l'aire vaut $\dfrac{\sqrt{\pi}}{4}$.
- id: "l3-in-04-17"
  feuille: "f-l3-in-04"
  numero: 17
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Soit $f : \mathbb{R} \to \mathbb{R}$ continue et bornée.

    **1.** Vérifier que, pour tout entier $n \geqslant 1$, $u \mapsto \dfrac{f(u/n)}{1 + u^{2}}$ est intégrable, et calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{f(u/n)}{1 + u^{2}}\,\mathrm{d} u$.

    **2.** Si $f(0) \neq 0$, donner un équivalent de $I_{n} = \mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{f(x)}{1 + n^{2}x^{2}}\,\mathrm{d} x$ quand $n \to +\infty$.
  corrige: |
    **1.** Avec $M = \mathop{\displaystyle \sup}|f|$, $\big|\dfrac{f(u/n)}{1 + u^{2}}\big| \leqslant \dfrac{M}{1 + u^{2}}$, intégrable, et, $f$ étant continue en $0$, l'intégrande tend vers $\dfrac{f(0)}{1 + u^{2}}$ : la limite est $\boxed{\pi f(0)}$.

    **2.** Le changement de variable $x = \dfrac{u}{n}$ (chapitre 2, prop. 12) donne $I_{n} = \dfrac{1}{n}\mathop{\displaystyle \int_{\mathbb{R}}}\dfrac{f(u/n)}{1 + u^{2}}\,\mathrm{d} u$, d'où $\boxed{I_{n} \sim \dfrac{\pi f(0)}{n}}$. La fonction $\dfrac{n}{\pi(1 + n^{2}x^{2})}$ est une densité de probabilité qui se concentre en $0$ : elle « lit » la valeur $f(0)$.
- id: "l3-in-04-18"
  feuille: "f-l3-in-04"
  numero: 18
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Montpellier (TD 3), exercices 5, 8, 10 et 11"
  page_enonce: 6
  page_corrige: 10
  enonce: |
    **1.** Soit $f$ intégrable sur $[0, +\infty[$. Montrer que $\mathop{\displaystyle \lim_{x \to +\infty}}\mathop{\displaystyle \int_{[x, +\infty[}}f\,\mathrm{d}\lambda = 0$ et que $\mathop{\displaystyle \lim_{x \to +\infty}}\mathop{\displaystyle \int_{x}^{2x}}f(t)\,\mathrm{d} t = 0$.

    **2.** On suppose de plus $f$ décroissante. Montrer que $f$ est positive, qu'il existe une constante $C$ telle que $f(x) \leqslant \dfrac{C}{x}$ pour $x > 0$, et que $\mathop{\displaystyle \lim_{x \to +\infty}}xf(x) = 0$. Montrer que ce résultat est faux si l'on suppose seulement $f$ positive.

    **3.** Soit $f : \mathbb{R} \to \mathbb{C}$ intégrable. Montrer que $\mathop{\displaystyle \lim_{\varepsilon \to 0}}\mathop{\displaystyle \int_{[x - \varepsilon, x + \varepsilon]}}f\,\mathrm{d}\lambda = 0$ pour tout $x \in \mathbb{R}$. Pour $a < b$ réels, que peut-on dire de $\mathop{\displaystyle \lim_{x \to +\infty}}\mathop{\displaystyle \int_{[ax, bx]}}f\,\mathrm{d}\lambda$ ?

    **4.** Soit $f : \mathbb{R} \to \mathbb{C}$ intégrable et $h > 0$. On pose $\varphi_{h}(x) = \mathop{\displaystyle \int_{\mathbb{R}}}f\chi_{[x, x+h]}\,\mathrm{d}\lambda$. Montrer que $\varphi_{h}$ est continue sur $\mathbb{R}$ et que $\mathop{\displaystyle \lim_{x \to +\infty}}\varphi_{h}(x) = 0$.
  corrige: |
    **1.** Pour $x_{k} \to +\infty$, $f\chi_{[x_{k}, +\infty[} \to 0$ en tout point, avec domination par $|f|$ : $\mathop{\displaystyle \int_{[x_{k}, +\infty[}}f \to 0$. Ensuite $\big|\mathop{\displaystyle \int_{x}^{2x}}f\big| \leqslant \mathop{\displaystyle \int_{[x, +\infty[}}|f| \to 0$.

    **2.** Si $f(x_{0}) < 0$, alors $f \leqslant f(x_{0})$ sur $[x_{0}, +\infty[$, et $f$ ne serait pas intégrable : donc $f \geqslant 0$. Par décroissance, pour $x > 0$, 
    $$\frac{x}{2}f(x) \leqslant \int_{x/2}^{x}f(t)\,\mathrm{d} t \leqslant \int_{0}^{+\infty}f,$$
     d'où $f(x) \leqslant \dfrac{C}{x}$ avec $C = 2\mathop{\displaystyle \int} f$, et la question 1 montre que le membre du milieu tend vers $0$ : $\boxed{xf(x) \to 0}$. Sans décroissance, c'est faux : $f = \mathop{\displaystyle \sum_{k \geqslant 2}}k\chi_{[k, k + k^{-3}]}$ est positive, d'intégrale $\mathop{\displaystyle \sum}\dfrac{1}{k^{2}} < +\infty$, mais $kf(k) = k^{2}$. Une fonction intégrable peut garder des pics de plus en plus hauts, pourvu qu'ils soient de plus en plus étroits.

    **3.** $|f|\chi_{[x - \varepsilon, x + \varepsilon]}$ tend vers $|f|\chi_{\{x\}}$, nulle p.p., quand $\varepsilon \to 0$, et est dominée par $|f|$ : la limite est $\boxed{0}$. Pour $t$ fixé, $\chi_{[ax, bx]}(t)$ a une limite quand $x \to +\infty$, et la convergence dominée donne 
    $$\lim_{x \to +\infty}\int_{[ax, bx]}f\,\mathrm{d}\lambda = \begin{cases} 0 & \text{si } 0 < a < b \text{ ou } a < b < 0, \\ \int_{\mathbb{R}}f\,\mathrm{d}\lambda & \text{si } a < 0 < b, \\ \int_{[0, +\infty[}f\,\mathrm{d}\lambda & \text{si } a = 0 < b, \\ \int_{]-\infty, 0]}f\,\mathrm{d}\lambda & \text{si } a < b = 0. \end{cases}$$
     Dans le premier cas, l'intervalle part à l'infini ; dans le deuxième, il envahit $\mathbb{R}$.

    **4.** Si $x_{k} \to x$, $\chi_{[x_{k}, x_{k} + h]}(t) \to \chi_{[x, x + h]}(t)$ pour $t \notin \{x, x + h\}$, et la domination par $|f|$ donne $\varphi_{h}(x_{k}) \to \varphi_{h}(x)$ : $\varphi_{h}$ est continue. Si $x_{k} \to +\infty$, $\chi_{[x_{k}, x_{k} + h]} \to 0$ et $\varphi_{h}(x_{k}) \to 0$.
