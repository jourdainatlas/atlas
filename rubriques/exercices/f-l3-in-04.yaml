    **1.** Soit $f_{n}(x) = n^{2}x\mathrm{e}^{-nx}$. Calculer $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int_{[0, 1]}}f_{n}(x)\,\mathrm{d} x$ et $\mathop{\displaystyle \int_{[0, 1]}}\mathop{\displaystyle \lim_{n}}f_{n}(x)\,\mathrm{d} x$. Existe-t-il $g$ intégrable sur $[0, 1]$ telle que $f_{n} \leqslant g$ pour tout $n \geqslant 1$ ?

    **2.** Mêmes questions pour $f_{n}(x) = n\mathrm{e}^{-nx}$ sur $]0, 1]$. La convergence est-elle uniforme ?

    **3.** Avec $f_{n} = \chi_{[n, n+1[}$ sur $\mathbb{R}$, montrer que l'hypothèse de domination est essentielle dans le théorème de convergence dominée.
  corrige: |
    **1.** Avec $t = nx$, $\mathop{\displaystyle \int_{0}^{1}}n^{2}x\mathrm{e}^{-nx}\,\mathrm{d} x = \mathop{\displaystyle \int_{0}^{n}}t\mathrm{e}^{-t}\,\mathrm{d} t = 1 - (n + 1)\mathrm{e}^{-n} \to \boxed{1}$, alors que $f_{n}(x) \to 0$ en tout point de $[0, 1]$, d'où $\mathop{\displaystyle \int}\mathop{\displaystyle \lim} f_{n} = \boxed{0}$. Aucune $g$ intégrable ne majore toutes les $f_{n}$, sinon le théorème de convergence dominée donnerait la limite $0$. On le voit aussi directement : $\mathop{\displaystyle \sup_{n}}f_{n}(x) \geqslant \dfrac{c}{x}$ pour une constante $c > 0$, non intégrable près de $0$.

    **2.** $\mathop{\displaystyle \int_{0}^{1}}n\mathrm{e}^{-nx}\,\mathrm{d} x = 1 - \mathrm{e}^{-n} \to 1$, alors que $n\mathrm{e}^{-nx} \to 0$ sur $]0, 1]$ : les deux limites diffèrent. La convergence n'est pas uniforme, puisque $\mathop{\displaystyle \sup_{]0, 1]}}n\mathrm{e}^{-nx} = n$, et il n'y a pas de domination intégrable, pour la même raison qu'en 1.

    **3.** $\chi_{[n, n+1[} \to 0$ en tout point, mais $\mathop{\displaystyle \int}\chi_{[n, n+1[} = 1$ ; la plus petite majorante, $\chi_{[0, +\infty[}$, n'est pas intégrable. Ici la masse ne se concentre pas : elle s'enfuit à l'infini.

    ![Figure](documents/figures/516b564049f78bca.svg)

    Les bosses $f_{2}$, $f_{5}$, $f_{10}$, $f_{20}$ (ocre), de sommet $\dfrac{n}{\mathrm{e}}$ en $\dfrac{1}{n}$, gardent une aire proche de $1$ en se resserrant contre l'axe vertical. Elles restent sous l'enveloppe $\dfrac{4}{\mathrm{e}^{2}x}$ (pointillés pétrole), qu'elles touchent chacune en un point : cette enveloppe n'est pas intégrable.
- id: "l3-in-04-13"
  feuille: "f-l3-in-04"
  numero: 13
  partie: "Le théorème de convergence dominée"
  etoiles: 2
  types: [Calcul]
  mots_cles: [convergence dominée]
  noeuds: [m-convergence-dominee]
  notions: [integrable-lebesgue]
  source: "Lyon 1 (TD03 2020), exercice 13"
  page_enonce: 5
  page_corrige: 8
  enonce: |
    Pour chacune des suites suivantes, définies pour $n \geqslant 2$, existe-t-il une majoration intégrable indépendante de $n$ ? Déterminer, s'il existe, $\mathop{\displaystyle \lim_{n}}\mathop{\displaystyle \int} f_{n}\,\mathrm{d}\lambda$.

    **1.** $f_{n} = \sqrt{n}\,\chi_{[1/n, 2/n]}$ sur $\mathbb{R}$, et $g_{n} = \dfrac{n}{\ln n}\chi_{[1/(n+1), 1/n]}$ sur $\mathbb{R}$.

    **2.** $h_{n}(x) = \dfrac{n^{2}x\mathrm{e}^{-nx^{2}}}{1 + x^{2}}$ sur $[0, 1]$, et $\dfrac{n^{2}x\mathrm{e}^{-n^{2}x^{2}}}{1 + x^{2}}$ sur $[A, +\infty[$, avec $A > 0$.

    **3.** $k_{n}(x) = \dfrac{nx\sin x}{1 + |nx|^{\alpha}}$, sur $[0, 1]$ pour $\alpha \geqslant 1$, puis sur $\mathbb{R}$ pour $\alpha > 2$. Vérifier que $k_{n}$ n'est pas intégrable sur $\mathbb{R}$ si $1 \leqslant \alpha \leqslant 2$.

    Que montrent les suites $(g_{n})$ et $(h_{n})$ sur le théorème de convergence dominée ?
  corrige: |
    **1.** $f_{n}(x) \neq 0$ impose $\dfrac{1}{x} \leqslant n \leqslant \dfrac{2}{x}$, donc $f_{n} \leqslant \sqrt{\dfrac{2}{x}}\chi_{]0, 1]}$, intégrable : la domination existe, et $\mathop{\displaystyle \int} f_{n} = \dfrac{1}{\sqrt{n}} \to \boxed{0}$.

    Les intervalles $[\dfrac{1}{n+1}, \dfrac{1}{n}]$ ne se chevauchent qu'aux extrémités, donc $\mathop{\displaystyle \sup_{n}}g_{n} = \mathop{\displaystyle \sum_{n}}g_{n}$ p.p., et 
    $$\int\sup_{n}g_{n}\,\mathrm{d}\lambda = \sum_{n \geqslant 2}\frac{n}{\ln n}\Big(\frac{1}{n} - \frac{1}{n + 1}\Big) = \sum_{n \geqslant 2}\frac{1}{(n + 1)\ln n} = +\infty,$$
     par comparaison à la série de Bertrand $\mathop{\displaystyle \sum}\dfrac{1}{n\ln n}$. Aucune majorante intégrable n'existe ; pourtant $\mathop{\displaystyle \int} g_{n} = \dfrac{1}{(n + 1)\ln n} \to \boxed{0} = \mathop{\displaystyle \int}\mathop{\displaystyle \lim} g_{n}$.

    **2.** Sur $[0, 1]$, $\mathop{\displaystyle \int} h_{n} \geqslant \dfrac{1}{2}\mathop{\displaystyle \int_{0}^{1}}n^{2}x\mathrm{e}^{-nx^{2}}\,\mathrm{d} x = \dfrac{n}{4}(1 - \mathrm{e}^{-n}) \to +\infty$ (en fait $\mathop{\displaystyle \int} h_{n} \sim \dfrac{n}{2}$), alors que $h_{n} \to 0$ : il n'y a pas de domination intégrable, et la limite des intégrales est $\boxed{+\infty}$. Sur $[A, +\infty[$, au contraire, $n^{2}x\mathrm{e}^{-n^{2}x^{2}} = \dfrac{1}{x}(n^{2}x^{2})\mathrm{e}^{-n^{2}x^{2}} \leqslant \dfrac{1}{\mathrm{e} x} \leqslant \dfrac{1}{\mathrm{e} A}$, et l'intégrande est dominée par $\dfrac{1}{\mathrm{e} A(1 + x^{2})}$ : la limite est $\boxed{0}$. Loin de $0$, les bosses n'ont plus de place pour grandir.

    **3.** Pour $t \geqslant 0$ et $\alpha \geqslant 1$, $\dfrac{t}{1 + t^{\alpha}} \leqslant 1$, donc $0 \leqslant k_{n}(x) \leqslant \sin x \leqslant 1$ sur $[0, 1]$. Pour $x > 0$, $\dfrac{nx}{1 + (nx)^{\alpha}}$ tend vers $0$ si $\alpha > 1$ et vers $1$ si $\alpha = 1$. D'où 
    $$\lim_{n}\int_{0}^{1}k_{n} = \boxed{0 \text{ si } \alpha > 1, \qquad 1 - \cos 1 \approx 0{,}460 \text{ si } \alpha = 1}\text{.}$$
     Sur $\mathbb{R}$, pour $|x| \geqslant 1$, $1 + (n|x|)^{\alpha} \leqslant 2(n|x|)^{\alpha}$ donne $|k_{n}(x)| \geqslant \dfrac{1}{2}(n|x|)^{1 - \alpha}|\sin x|$, qui n'est pas intégrable si $\alpha \leqslant 2$, car $\mathop{\displaystyle \int_{1}^{+\infty}}\dfrac{|\sin x|}{x}\,\mathrm{d} x = +\infty$. Si $\alpha > 2$, $|k_{n}(x)| \leqslant |x|^{1 - \alpha}$ pour $|x| \geqslant 1$, et, pour $|x| \leqslant 1$, avec $t = n|x|$, $|k_{n}(x)| \leqslant \dfrac{1}{n}\dfrac{t^{2}}{1 + t^{\alpha}} \leqslant C_{\alpha}$, où $C_{\alpha} = \mathop{\displaystyle \sup_{t \geqslant 0}}\dfrac{t^{2}}{1 + t^{\alpha}} < +\infty$. La domination est acquise, et la limite est $\boxed{0}$.

    La suite $(g_{n})$ montre que la domination n'est pas nécessaire pour que les intégrales convergent vers l'intégrale de la limite ; la suite $(h_{n})$ montre que, sans elle, la conclusion peut tomber en défaut.
- id: "l3-in-04-14"
  feuille: "f-l3-in-04"
  numero: 14
  partie: "Le théorème de convergence dominée"
  etoiles: 1
  types: [Calcul]
