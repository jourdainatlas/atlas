  enonce: |
    Déterminer le polynôme $P$ de degré au plus $2$ tel que $P(-1) = 6$, $P(1) = 2$ et $P(2) = 3$, puis tous les polynômes $Q \in \mathbb{R}[X]$ vérifiant ces trois conditions.
  corrige: |
    La formule du théorème 13, ou la résolution du système $a - b + c = 6$, $a + b + c = 2$, $4a + 2b + c = 3$, donne $P$. La proposition 19 décrit les autres. 
    $$\boxed{P = X^{2} - 2X + 3, \qquad Q = X^{2} - 2X + 3 + A\,(X + 1)(X - 1)(X - 2), \ A \in \mathbb{R}[X]}$$
- id: "ma-13-39"
  feuille: "f-ma-13"
  numero: 39
  partie: "Interpolation de Lagrange"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [interpolation de Lagrange, degré, division euclidienne, polynômes complexes, sommes]
  noeuds: [pol-racines, pol-anneau, pol-division, c-dalembert, n-sommes]
  notions: []
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Soit $z_{1}, \dots, z_{s}$ des complexes deux à deux distincts, et $L_{1}, \dots, L_{s}$ les polynômes de Lagrange associés, de degré $s - 1$, tels que $L_{i}(z_{j})$ vaut $1$ si $i = j$ et $0$ sinon.

    **1.** Soit $P \in \mathbb{C}[X]$ de degré au plus $s - 1$. Simplifier $\sum_{k = 1}^{s} P(z_{k})L_{k}$.

    **2.** En déduire une expression simple de $\sum_{k = 1}^{s} z_{k}^{r}L_{k}$ pour tout entier $r \in [\![0\,;s]\!]$, et la valeur de $\sum_{k = 1}^{s} L_{k}$.

    **3.** Montrer que le reste de la division euclidienne d'un polynôme $A$ par $(X - z_{1}) \cdots (X - z_{s})$ est $\sum_{k = 1}^{s} A(z_{k})L_{k}$.
  corrige: |
    **1.** Les polynômes $P$ et $\sum P(z_{k})L_{k}$ sont de degré au plus $s - 1$ et coïncident en les $s$ points $z_{k}$ : par le théorème 3, 
    $$\boxed{\sum_{k = 1}^{s} P(z_{k})L_{k} = P}$$

    **2.** Pour $r \leqslant s - 1$, la question 1 avec $P = X^{r}$ donne $\sum z_{k}^{r}L_{k} = X^{r}$ ; en particulier $\sum L_{k} = 1$. Pour $r = s$, le polynôme $X^{s} - (X - z_{1}) \cdots (X - z_{s})$ est de degré au plus $s - 1$ et prend la valeur $z_{k}^{s}$ en $z_{k}$ : 
    $$\boxed{\sum_{k = 1}^{s} z_{k}^{r}L_{k} = X^{r} \ (r < s), \qquad \sum_{k = 1}^{s} z_{k}^{s}L_{k} = X^{s} - \prod_{k = 1}^{s} (X - z_{k})}$$

    **3.** Si $A = NQ + R$ avec $N = \prod (X - z_{k})$ et $\deg R < s$, alors $R(z_{k}) = A(z_{k})$, et la question 1 appliquée à $R$ donne $R = \sum A(z_{k})L_{k}$. Le reste est donc le polynôme d'interpolation de $A$ aux points $z_{k}$, ce qui généralise l'exercice 20.
- id: "ma-13-40"
  feuille: "f-ma-13"
  numero: 40
  partie: "Fractions rationnelles"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [fractions rationnelles]
  noeuds: [a-fractions]
  notions: [corps-fractions]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    **1.** Montrer qu'il n'existe aucune fraction rationnelle $F \in \mathbb{C}(X)$ telle que $F^{2} = X$, ni aucune telle que $F^{2} = \frac{1}{X}$.

    **2.** Existe-t-il $R \in \mathbb{C}(X)$ telle que $R^{2} = \frac{X^{2}}{(X + 1)(X + 2)}$ ?
  corrige: |
    **1.** Le degré d'une fraction est un entier, et $\deg(F^{2}) = 2\deg F$ est pair, alors que $\deg X = 1$ et $\deg \frac{1}{X} = -1$ sont impairs.

    **2.** Non. Si $R = \frac{P}{Q}$ sous forme irréductible, alors $R^{2} = \frac{P^{2}}{Q^{2}}$ est encore sous forme irréductible, et tous ses pôles sont de multiplicité paire. Or $\frac{X^{2}}{(X + 1)(X + 2)}$ est sous forme irréductible, avec les pôles simples $-1$ et $-2$. 
    $$\boxed{\text{aucune de ces équations n'a de solution}}$$
     *Piège.* Le degré ne suffit pas pour la question 2 : $\frac{X^{2}}{(X + 1)(X + 2)}$ est de degré $0$, qui est pair. Il faut un argument plus fin, sur les multiplicités.
- id: "ma-13-41"
  feuille: "f-ma-13"
  numero: 41
  partie: "Fractions rationnelles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [fractions rationnelles]
  noeuds: [a-fractions]
  notions: [corps-fractions]
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Déterminer les fractions rationnelles $F \in \mathbb{C}(X)$ telles que $F(X + 1) = F(X)$. On pourra s'intéresser aux pôles de $F$, puis à la partie entière.
  corrige: |
    Si $a$ est un pôle de $F$, l'égalité $F(X) = F(X + 1)$ montre que $a - 1$ en est un aussi, puis $a - 2$, etc. : $F$ aurait une infinité de pôles, ce qui est impossible. Donc $F$ est un polynôme $P$, et $P - P(0)$ s'annule en tous les entiers naturels, puisque $P(n + 1) = P(n)$ : il est nul. 
    $$\boxed{F \text{ est constante}}$$
- id: "ma-13-42"
  feuille: "f-ma-13"
  numero: 42
  partie: "Fractions rationnelles"
  etoiles: 2
