  enonce: |
    *Remplir une boîte avec des briques.* Soit $a \leqslant b \leqslant c$ et $A \leqslant B \leqslant C$ des entiers naturels non nuls. On appelle *brique* une partie de $\mathbb{N}^{3}$ de la forme $[\![x\,;x']\!] \times [\![y\,;y']\!] \times [\![z\,;z']\!]$, où $x \leqslant x'$, $y \leqslant y'$ et $z \leqslant z'$ sont des entiers naturels ; ses *dimensions* sont les trois entiers $x' - x + 1$, $y' - y + 1$ et $z' - z + 1$, et l'on dit qu'elle est de *taille* $(a, b, c)$ si ses dimensions, rangées dans l'ordre croissant, sont $a$, $b$ et $c$. Le pavé $\mathcal{P} = [\![1\,;A]\!] \times [\![1\,;B]\!] \times [\![1\,;C]\!]$ est dit *$(a, b, c)$-pavable* s'il est la réunion de briques de taille $(a, b, c)$ deux à deux disjointes. Pour toute partie finie $E$ de $\mathbb{N}^{3}$, on définit le *poids* 
    $$w(E) = (X - 1)^{3}\sum_{(i, j, k) \in E} X^{i + j + k} \in \mathbb{R}[X].$$

    **1.** Montrer que le pavé de dimensions $5$, $6$, $6$ n'est pas $(1, 2, 4)$-pavable.

    **2.** Calculer le poids d'une brique $[\![x\,;x']\!] \times [\![y\,;y']\!] \times [\![z\,;z']\!]$ en fonction de $x$, $y$, $z$ et de ses dimensions. En déduire $w(\mathcal{P})$.

    **3.** Montrer que si $E$ et $F$ sont deux parties finies disjointes de $\mathbb{N}^{3}$, alors $w(E \cup F) = w(E) + w(F)$. En déduire que si $\mathcal{P}$ est $(a, b, c)$-pavable, alors 
    $$(X^{a} - 1)(X^{b} - 1)(X^{c} - 1) \quad\text{divise}\quad (X^{A} - 1)(X^{B} - 1)(X^{C} - 1).$$

    **4.** Montrer que le cube de dimensions $10$, $10$, $10$ n'est pas $(1, 2, 4)$-pavable, bien que son volume soit un multiple de $8$.

    **5.** Montrer que le pavé de dimensions $7$, $8$, $9$ n'est pas $(1, 2, 4)$-pavable.

    **6.** Pour $d \in \mathbb{N}^{*}$, on note $\zeta_{d} = \mathrm{e}^{2\mathrm{i}\pi/d}$. Soit $m \in \mathbb{N}^{*}$. Montrer que $\zeta_{d}$ est racine de $X^{m} - 1$ si et seulement si $d$ divise $m$, et qu'elle en est alors racine simple.

    **7.** *Théorème de De Bruijn (1969).* On suppose que $a$ divise $b$ et que $b$ divise $c$. Montrer que $\mathcal{P}$ est $(a, b, c)$-pavable si et seulement si, quitte à permuter $A$, $B$ et $C$, l'entier $a$ divise $A$, $b$ divise $B$ et $c$ divise $C$. On comparera les multiplicités de $\zeta_{c}$, $\zeta_{b}$ et $\zeta_{a}$ dans les deux polynômes de la question 3.
  corrige: |
    **1.** Une brique de taille $(1, 2, 4)$ contient $8$ points. Un pavage du pavé, qui contient $5 \times 6 \times 6 = 180$ points, demanderait $\frac{180}{8} = 22{,}5$ briques : c'est impossible.

    **2.** Soit $E = [\![x\,;x']\!] \times [\![y\,;y']\!] \times [\![z\,;z']\!]$, de dimensions $d_{1}$, $d_{2}$, $d_{3}$. La somme sur $E$ se factorise (chapitre 3) : 
    $$\sum_{(i, j, k) \in E} X^{i + j + k} = \Big(\sum_{i = x}^{x'} X^{i}\Big)\Big(\sum_{j = y}^{y'} X^{j}\Big)\Big(\sum_{k = z}^{z'} X^{k}\Big),$$
     et, par télescopage, 
    $$(X - 1)\sum_{i = x}^{x'} X^{i} = X^{x' + 1} - X^{x} = X^{x}(X^{d_{1}} - 1),$$
     et de même pour les deux autres facteurs. 
    $$\boxed{w(E) = X^{x + y + z}(X^{d_{1}} - 1)(X^{d_{2}} - 1)(X^{d_{3}} - 1), \qquad w(\mathcal{P}) = X^{3}(X^{A} - 1)(X^{B} - 1)(X^{C} - 1)}$$

    **3.** Si $E \cap F = \varnothing$, la somme sur $E \cup F$ est la somme des sommes sur $E$ et sur $F$, d'où l'additivité ; par récurrence, le poids d'une réunion finie de parties deux à deux disjointes est la somme des poids. Si $\mathcal{P}$ est la réunion disjointe de briques $E_{1}, \dots, E_{r}$ de taille $(a, b, c)$, la question 2 donne, l'ordre des facteurs étant indifférent, 
    $$w(\mathcal{P}) = \sum_{\ell = 1}^{r} X^{s_{\ell}}(X^{a} - 1)(X^{b} - 1)(X^{c} - 1),$$
     où $s_{\ell}$ est la somme des coordonnées du coin de $E_{\ell}$. Le polynôme $T = (X^{a} - 1)(X^{b} - 1)(X^{c} - 1)$ divise donc $X^{3}S$, avec $S = (X^{A} - 1)(X^{B} - 1)(X^{C} - 1)$. Comme $0$ n'est pas racine de $T$, les polynômes $T$ et $X^{3}$ sont premiers entre eux (proposition 16 (ii)), et le lemme de Gauss (théorème 9) donne $T \mid S$.

    **4.** Ici $T = (X - 1)(X^{2} - 1)(X^{4} - 1)$ admet $\mathrm{i}$ pour racine, puisque $\mathrm{i}^{4} = 1$. Mais $\mathrm{i}^{10} = (\mathrm{i}^{2})^{5} = -1$, donc $\mathrm{i}$ n'est pas racine de $S = (X^{10} - 1)^{3}$ : $T$ ne divise pas $S$ (proposition 16 (i)), et la question 3 conclut. L'argument de volume ne suffisait pas : $1000 = 8 \times 125$.

    **5.** On compare les multiplicités de $-1$ ; dans un produit, la multiplicité d'une racine est la somme des multiplicités dans les facteurs, par la proposition 9. Dans $T$, le réel $-1$ est racine simple de $X^{2} - 1$ et de $X^{4} - 1$, et n'est pas racine de $X - 1$ : il est de multiplicité $2$. Dans $S = (X^{7} - 1)(X^{8} - 1)(X^{9} - 1)$, il n'est racine ni de $X^{7} - 1$ ni de $X^{9} - 1$, et il est racine simple de $X^{8} - 1$, dont les huit racines sont distinctes (proposition 17) : il est de multiplicité $1 < 2$. Donc $T$ ne divise pas $S$, et le pavé n'est pas pavable, bien que $504 = 8 \times 63$.

    **6.** On a $\zeta_{d}^{m} = \mathrm{e}^{2\mathrm{i}\pi m/d}$, qui vaut $1$ si et seulement si $\frac{m}{d} \in \mathbb{Z}$ (chapitre 4), c'est-à-dire si et seulement si $d \mid m$. Par la proposition 17, $X^{m} - 1$ a $m$ racines distinctes et est de degré $m$ : la somme des multiplicités valant $m$, chacune vaut $1$.

    **7.** Supposons d'abord, quitte à permuter, que $a \mid A$, $b \mid B$ et $c \mid C$. Les $\frac{A}{a} \times \frac{B}{b} \times \frac{C}{c}$ briques 
    $$[\![(p - 1)a + 1\,;pa]\!] \times [\![(q - 1)b + 1\,;qb]\!] \times [\![(t - 1)c + 1\,;tc]\!], \qquad 1 \leqslant p \leqslant \frac{A}{a}, \ 1 \leqslant q \leqslant \frac{B}{b}, \ 1 \leqslant t \leqslant \frac{C}{c},$$
     sont deux à deux disjointes et recouvrent le pavé ; si la permutation n'est pas l'identité, on oriente les briques en conséquence.

    Réciproquement, supposons $\mathcal{P}$ pavable, de sorte que $T \mid S$ par la question 3. Par la question 6 et l'additivité des multiplicités, pour tout $d \in \mathbb{N}^{*}$, la multiplicité de $\zeta_{d}$ dans $T$ est le nombre de termes de la liste $(a, b, c)$ divisibles par $d$, et sa multiplicité dans $S$ est le nombre de termes de la liste $(A, B, C)$ divisibles par $d$. La proposition 16 (i) fournit les trois inégalités suivantes.

    • Pour $d = c$, la multiplicité dans $T$ est au moins $1$ : l'un des entiers $A$, $B$, $C$ est multiple de $c$ ; on l'appelle $C_{1}$.

    • Pour $d = b$, comme $b \mid b$ et $b \mid c$, la multiplicité dans $T$ est au moins $2$ : deux des entiers $A$, $B$, $C$ au moins sont multiples de $b$, et l'un d'eux n'est pas $C_{1}$ ; on l'appelle $B_{1}$.

    • Pour $d = a$, comme $a$ divise $a$, $b$ et $c$, la multiplicité dans $T$ vaut $3$ : les trois entiers sont multiples de $a$, en particulier le troisième, que l'on appelle $A_{1}$.

    Les deux implications sont établies. Lorsque $a \mid b$ et $b \mid c$, en notant $(A_{1}, B_{1}, C_{1})$ une permutation convenable de $(A, B, C)$ : 
    $$\boxed{\mathcal{P} \text{ est } (a, b, c)\text{-pavable} \iff a \mid A_{1}, \ b \mid B_{1} \ \text{et} \ c \mid C_{1}}$$
     La démonstration montre davantage : pour une brique « harmonique » ($a \mid b \mid c$), la condition de divisibilité de la question 3 est non seulement nécessaire, mais suffisante.

    *Piège.* L'hypothèse $a \mid b \mid c$ est indispensable. Le pavé de dimensions $1$, $5$, $6$ est $(1, 2, 3)$-pavable : on recouvre une bande $2 \times 6$ par deux briques $2 \times 3$, puis la bande $3 \times 6$ restante par trois briques $3 \times 2$. Pourtant aucune permutation de $(1, 5, 6)$ n'a ses termes multiples de $1$, $2$, $3$ respectivement, puisque $5$ n'est multiple ni de $2$ ni de $3$.
- id: "ma-13-64"
  feuille: "f-ma-13"
  numero: 64
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration]
  mots_cles: [degré, racines, multiplicité, PGCD et Bézout, polynômes complexes]
  noeuds: [pol-anneau, pol-racines, pol-derivee, pol-principal, c-dalembert]
  notions: [multiplicite-racine, pgcd]
  page_enonce: 12
  page_corrige: 26
  enonce: |
    *Théorème de Mason-Stothers et équation de Fermat pour les polynômes.* Pour $P \in \mathbb{C}[X]$ non nul, on note $r(P)$ le nombre de racines complexes *distinctes* de $P$. Soit $A$, $B$, $C$ trois polynômes de $\mathbb{C}[X]$, premiers entre eux dans leur ensemble, tels que 
    $$A + B + C = 0 \qquad\text{et}\qquad ABC \text{ n'est pas constant}.$$
     On veut montrer que $\max(\deg A, \deg B, \deg C) \leqslant r(ABC) - 1$.

    **1.** Montrer que $A$, $B$ et $C$ sont non nuls et deux à deux premiers entre eux.

    **2.** On pose $W = AB' - A'B$. Montrer que $W = BC' - B'C = CA' - C'A$, puis que $W \neq 0$.

    **3.** Soit $z$ une racine de $A$, de multiplicité $m$. Montrer que $z$ est racine de $W$ de multiplicité au moins $m - 1$. En déduire que $\deg(ABC) - r(ABC) \leqslant \deg W$.

    **4.** Conclure, en majorant de trois façons le degré de $W$.

    **5.** *Application.* Soit $n \geqslant 3$. Déterminer tous les triplets $(x, y, z) \in \mathbb{C}[X]^{3}$ tels que $x^{n} + y^{n} = z^{n}$. On traitera d'abord le cas où $x$, $y$, $z$ sont non nuls et premiers entre eux dans leur ensemble.

    **6.** Vérifier que $(X^{2} - 1)^{2} + (2X)^{2} = (X^{2} + 1)^{2}$. Que montre cette égalité pour $n = 2$, et pour l'inégalité de Mason-Stothers ?

    Les huit derniers exercices sont des problèmes à traiter en autonomie : l'énoncé fixe le but, et c'est à vous de trouver le chemin. Un polynôme est dit *simplement scindé* s'il est scindé à racines simples.
  corrige: |
    **1.** Si l'un des polynômes était nul, le produit $ABC$ serait nul, donc constant. Si $D$ divise $A$ et $B$, il divise $C = -A - B$, donc le PGCD de la famille $(A, B, C)$, qui vaut $1$ (remarque suivant la proposition 15) : $D$ est constant. Ainsi $A \wedge B = 1$, et de même $B \wedge C = C \wedge A = 1$.

    **2.** En remplaçant $C$ par $-A - B$ et $C'$ par $-A' - B'$, on obtient 
    $$\begin{aligned} BC' - B'C &= -BA' - BB' + B'A + B'B = AB' - A'B, \\ CA' - C'A &= -AA' - BA' + A'A + B'A = AB' - A'B. \end{aligned}$$
     Supposons $W = 0$. Alors $AB' = A'B$, donc $A$ divise $A'B$ ; comme $A \wedge B = 1$, le lemme de Gauss (théorème 9) donne $A \mid A'$. Si $A$ n'était pas constant, $A'$ serait un multiple non nul de $A$ de degré $\deg A - 1$ (proposition 11) : c'est impossible, donc $A$ est constant. Les égalités $BC' = B'C$ et $CA' = C'A$ montrent de même que $B$ et $C$ sont constants, et $ABC$ le serait. 
    $$\boxed{W = AB' - A'B = BC' - B'C = CA' - C'A \neq 0}$$

    **3.** Par la proposition 9, on écrit $A = (X - z)^{m}A_{1}$ avec $A_{1}(z) \neq 0$ et $m \geqslant 1$. La règle de dérivation d'un produit donne alors 
    $$A' = (X - z)^{m - 1}\big(mA_{1} + (X - z)A_{1}'\big),$$
     puis, en mettant $(X - z)^{m - 1}$ en facteur dans $W = AB' - A'B$, 
    $$W = (X - z)^{m - 1}\Big[(X - z)A_{1}B' - \big(mA_{1} + (X - z)A_{1}'\big)B\Big],$$
     donc $z$ est racine de $W$ de multiplicité au moins $m - 1$. Le même calcul vaut pour les racines de $B$, en échangeant les rôles de $A$ et de $B$, puisque $W = -(BA' - B'A)$. Pour les racines de $C$, on le mène sur l'écriture $W = CA' - C'A$ de la question 2.

    Soit $z_{1}, \dots, z_{r}$ les racines distinctes de $ABC$, avec $r = r(ABC)$, et $\mu_{i}$ la multiplicité de $z_{i}$ dans $ABC$. Les polynômes $A$, $B$, $C$ étant deux à deux premiers entre eux, ils n'ont deux à deux aucune racine commune (proposition 16 (ii)) : chaque $z_{i}$ est racine d'un seul des trois, avec la multiplicité $\mu_{i}$. Par ce qui précède et la proposition 10, $\prod_{i}(X - z_{i})^{\mu_{i} - 1}$ divise $W$, qui est non nul. En comparant les degrés, et puisque $\sum \mu_{i} = \deg(ABC)$ (proposition 16) : 
    $$\boxed{\deg(ABC) - r(ABC) \leqslant \deg W}$$

    **4.** Les deux termes de $W = AB' - A'B$ sont de degré au plus $\deg A + \deg B - 1$ (propositions 3 et 11), donc $\deg W \leqslant \deg A + \deg B - 1$. Avec la question 3, $\deg A + \deg B + \deg C - r(ABC) \leqslant \deg A + \deg B - 1$, soit $\deg C \leqslant r(ABC) - 1$. Les écritures $W = BC' - B'C$ et $W = CA' - C'A$ donnent de même $\deg A \leqslant r(ABC) - 1$ et $\deg B \leqslant r(ABC) - 1$. 
    $$\boxed{\max(\deg A, \deg B, \deg C) \leqslant r(ABC) - 1}$$

    **5.** Montrons que les solutions sont les triplets $(\lambda g, \mu g, \nu g)$, où $g \in \mathbb{C}[X]$ et $(\lambda, \mu, \nu) \in \mathbb{C}^{3}$ vérifie $\lambda^{n} + \mu^{n} = \nu^{n}$ ; ces triplets sont évidemment solutions.

    *Premier cas : $x$, $y$, $z$ non nuls, premiers entre eux dans leur ensemble.* Supposons-les non tous constants, et posons $A = x^{n}$, $B = y^{n}$, $C = -z^{n}$, de somme nulle. Des polynômes de $\mathbb{C}[X]$ sont premiers entre eux dans leur ensemble si et seulement s'ils n'ont aucune racine commune : un PGCD non constant aurait une racine (théorème 11), et une racine commune $w$ fournirait le diviseur commun $X - w$. Une racine commune à $A$, $B$, $C$ le serait à $x$, $y$, $z$ : les polynômes $A$, $B$, $C$ sont donc premiers entre eux dans leur ensemble, et $ABC = -(xyz)^{n}$ n'est pas constant. Les racines de $ABC$ sont celles de $xyz$, donc, avec $\delta = \max(\deg x, \deg y, \deg z)$, 
    $$r(ABC) = r(xyz) \leqslant \deg x + \deg y + \deg z \leqslant 3\delta.$$
     La question 4 donne alors $n\delta \leqslant 3\delta - 1$, soit $(n - 3)\delta \leqslant -1$, ce qui est impossible pour $n \geqslant 3$. Donc $x$, $y$ et $z$ sont constants.

    *Cas général.* Si $x = y = z = 0$, on prend $g = 0$. Sinon, soit $g$ le PGCD de la famille $(x, y, z)$, et $x = gx_{1}$, $y = gy_{1}$, $z = gz_{1}$. Si $D$ divise $x_{1}$, $y_{1}$ et $z_{1}$, alors $gD$ divise $x$, $y$, $z$, donc $g$, et $D$ est constant : les polynômes $x_{1}$, $y_{1}$, $z_{1}$ sont premiers entre eux dans leur ensemble. En simplifiant par $g^{n} \neq 0$ (intégrité), $x_{1}^{n} + y_{1}^{n} = z_{1}^{n}$. Si $x_{1}$, $y_{1}$, $z_{1}$ sont non nuls, le premier cas montre qu'ils sont constants. Si l'un est nul, par exemple $x_{1} = 0$, alors $y_{1}^{n} = z_{1}^{n}$, et $y_{1}$, $z_{1}$ ne sont pas tous deux nuls ; une racine de $y_{1}$ serait racine de $z_{1}^{n}$, donc de $z_{1}$, et commune à $x_{1} = 0$, $y_{1}$, $z_{1}$ : c'est exclu, donc $y_{1}$ est constant, puis $z_{1}$ aussi, puisque $n\deg z_{1} = n\deg y_{1}$. Les autres cas sont identiques. 
    $$\boxed{x^{n} + y^{n} = z^{n} \iff (x, y, z) = (\lambda g, \mu g, \nu g), \quad g \in \mathbb{C}[X], \ \lambda^{n} + \mu^{n} = \nu^{n}}$$

    **6.** Le développement donne $(X^{2} - 1)^{2} + 4X^{2} = X^{4} + 2X^{2} + 1 = (X^{2} + 1)^{2}$. Pour $n = 2$, il existe donc des solutions non constantes et premières entre elles, comme il existe des triplets pythagoriciens d'entiers : le résultat de la question 5 est faux pour $n = 2$. Avec $A = (X^{2} - 1)^{2}$, $B = 4X^{2}$ et $C = -(X^{2} + 1)^{2}$, deux à deux sans racine commune, les racines distinctes de $ABC$ sont $1$, $-1$, $0$, $\mathrm{i}$, $-\mathrm{i}$, d'où $r(ABC) = 5$, et le plus grand degré vaut $4 = r(ABC) - 1$ : l'inégalité de Mason-Stothers est une égalité dans cet exemple, elle ne peut donc pas être améliorée.

    *À retenir.* Pour les entiers, l'équation de Fermat $x^{n} + y^{n} = z^{n}$, $n \geqslant 3$, n'a été résolue qu'au milieu des années 1990, par Andrew Wiles ; pour les polynômes, quelques lignes suffisent. La différence tient à la dérivation, qui n'a pas d'équivalent dans $\mathbb{Z}$ : c'est elle qui, par le polynôme $W$, relie le degré d'un polynôme au nombre de ses racines distinctes.

    Les huit derniers exercices sont des problèmes à traiter en autonomie ; le corrigé indique la démarche, puis la rédige.
- id: "ma-13-65"
  feuille: "f-ma-13"
  numero: 65
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Calcul]
  mots_cles: [polynômes complexes]
  noeuds: [c-dalembert]
  notions: []
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Déterminer les $(P, Q) \in \mathbb{C}[X]^{2}$ tels que $\forall z \in \mathbb{C}$, $|P(z)| \leqslant |Q(z)|$.
  corrige: |
    *Idée.* Les racines de $Q$ sont racines de $P$, avec une multiplicité au moins égale, donc $Q$ divise $P$, et le quotient est un polynôme borné.

    Si $Q = 0$, alors $P = 0$. Sinon, soit $a$ une racine de $Q$ de multiplicité $m$, $Q = (X - a)^{m}Q_{1}$, et $P = (X - a)^{r}P_{1}$ avec $P_{1}(a) \neq 0$ ou $P = 0$. Si l'on avait $r < m$, alors $|P_{1}(z)| \leqslant |z - a|^{m - r}|Q_{1}(z)|$ pour $z \neq a$, et en faisant tendre $z$ vers $a$, $P_{1}(a) = 0$ : contradiction. Par la proposition 16 (i), $Q \mid P$ : $P = RQ$, et $|R(z)| \leqslant 1$ hors des racines de $Q$, donc partout par continuité. Un polynôme non constant n'est pas borné sur $\mathbb{C}$, donc $R$ est une constante $\lambda$ avec $|\lambda| \leqslant 1$. 
    $$\boxed{\text{les couples } (\lambda Q, Q), \ Q \in \mathbb{C}[X], \ |\lambda| \leqslant 1}$$
- id: "ma-13-66"
  feuille: "f-ma-13"
  numero: 66
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [polynômes scindés, théorème de Rolle]
  noeuds: [pol-derivee, pol-racines]
  notions: [derivee-formelle]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Soit $P \in \mathbb{R}[X]$ simplement scindé. Montrer que $P$ n'a pas deux coefficients consécutifs nuls.
  corrige: |
    *Idée.* Deux coefficients consécutifs nuls font de $0$ une racine double d'une dérivée de $P$, qui devrait pourtant être simplement scindée.

    Soit $P = \sum_{j = 0}^{n} a_{j}X^{j}$ de degré $n \geqslant 1$, et supposons $a_{k} = a_{k + 1} = 0$ ; comme $a_{n} \neq 0$, on a $k + 1 \leqslant n - 1$. Par l'exercice 25, appliqué $k$ fois, $P^{(k)}$ est simplement scindé, de degré $n - k \geqslant 2$. Or $P^{(k)}(0) = k!\,a_{k} = 0$ et $P^{(k + 1)}(0) = (k + 1)!\,a_{k + 1} = 0$ : $0$ est racine au moins double de $P^{(k)}$, ce qui est absurde.
- id: "ma-13-67"
  feuille: "f-ma-13"
  numero: 67
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [racines, multiplicité]
  noeuds: [pol-racines, pol-derivee]
  notions: [multiplicite-racine]
  page_enonce: 12
  page_corrige: 27
  enonce: |
    Soit $P \in \mathbb{R}[X]$ non constant, simplement scindé. Montrer que pour tout $a \in \mathbb{C}$, les racines complexes de $P - a$ sont de multiplicité au plus $2$.
  corrige: |
    *Idée.* Une racine triple de $P - a$ serait une racine commune à $P'$ et $P''$.

    Si $z$ est racine de multiplicité au moins $3$ de $P - a$, alors $P'(z) = P''(z) = 0$, puisque $(P - a)' = P'$. Or $P'$ est simplement scindé sur $\mathbb{R}$ (exercice 25) : $z$ est l'une de ses racines, réelle et simple, donc $P''(z) \neq 0$. C'est absurde.
- id: "ma-13-68"
  feuille: "f-ma-13"
  numero: 68
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [racines, polynômes complexes]
  noeuds: [pol-racines, c-dalembert]
  notions: []
  page_enonce: 12
  page_corrige: 28
  enonce: |
    Soient $P$ et $Q$ deux polynômes non constants dans $\mathbb{C}[X]$ tels que l'ensemble des racines de $P(X)$ (resp. de $P(X) - 1$) soit égal à l'ensemble des racines de $Q(X)$ (resp. de $Q(X) - 1$). Montrer que $P(X) = Q(X)$.
  corrige: |
    *Idée.* On compte les racines de $P'$ : les racines distinctes de $P$ et de $P - 1$ sont nombreuses, et $P - Q$ s'annule en chacune.

    Quitte à échanger, $n = \deg P \geqslant \deg Q$. Soit $a_{1}, \dots, a_{r}$ les racines distinctes de $P$, de multiplicités $m_{i}$, et $b_{1}, \dots, b_{s}$ celles de $P - 1$, de multiplicités $n_{j}$ ; ces deux ensembles sont disjoints. Chaque $a_{i}$ est racine de $P'$ de multiplicité $m_{i} - 1$, et chaque $b_{j}$ de multiplicité $n_{j} - 1$, puisque $(P - 1)' = P'$. Donc 
    $$(n - r) + (n - s) = \sum (m_{i} - 1) + \sum (n_{j} - 1) \leqslant \deg P' = n - 1,$$
     soit $r + s \geqslant n + 1$. Par hypothèse, $Q$ s'annule en les $a_{i}$ et $Q - 1$ en les $b_{j}$ : le polynôme $P - Q$, de degré au plus $n$, a au moins $n + 1$ racines distinctes. 
    $$\boxed{P = Q}$$
- id: "ma-13-69"
  feuille: "f-ma-13"
  numero: 69
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [racines, polynôme dérivé, polynômes complexes]
  noeuds: [pol-racines, pol-derivee, c-dalembert]
  notions: [derivee-formelle]
  page_enonce: 13
  page_corrige: 28
  enonce: |
    Soit $P \in \mathbb{C}[X]$. Montrer que les racines de $P'(X)$ sont des barycentres à coefficients positifs ou nuls de racines de $P(X)$.
  corrige: |
    *Idée.* La décomposition de $\frac{P'}{P}$ donne une relation barycentrique entre une racine de $P'$ et les racines de $P$.

    On suppose $P$ non constant, sans quoi tout complexe est racine de $P' = 0$ et l'énoncé est faux. Soit $P = c\prod (X - a_{k})^{m_{k}}$ et $z$ une racine de $P'$. Si $z$ est racine de $P$, c'est un barycentre trivial. Sinon, la proposition 24 donne 
    $$0 = \frac{P'(z)}{P(z)} = \sum_{k} \frac{m_{k}}{z - a_{k}} = \sum_{k} \frac{m_{k}(\overline{z} - \overline{a_{k}})}{|z - a_{k}|^{2}}.$$
     En conjuguant, $\sum \lambda_{k}(z - a_{k}) = 0$ avec $\lambda_{k} = \frac{m_{k}}{|z - a_{k}|^{2}} > 0$, soit 
    $$\boxed{z = \frac{\sum \lambda_{k}a_{k}}{\sum \lambda_{k}}, \qquad \lambda_{k} > 0}$$
     C'est le théorème de Gauss-Lucas : les racines de $P'$ sont dans l'enveloppe convexe de celles de $P$, ce qui généralise l'exercice 13.
- id: "ma-13-70"
  feuille: "f-ma-13"
  numero: 70
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [racines]
  noeuds: [pol-racines]
  notions: []
  page_enonce: 13
  page_corrige: 28
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $P(X) = nX^{n} - X^{n - 1} - \cdots - X - 1$. Montrer qu'à part $1$, les racines de $P$ sont de module $< 1$, puis que $P$ est à racines simples.
  corrige: |
    *Idée.* L'inégalité triangulaire localise les racines ; pour la simplicité, on multiplie par $X - 1$.

    On a $P(1) = 0$. Si $P(z) = 0$ avec $|z| \geqslant 1$, alors $n|z|^{n} = \big|\sum_{k < n} z^{k}\big| \leqslant \sum_{k < n} |z|^{k} \leqslant n|z|^{n - 1}$, donc $|z| \leqslant 1$, soit $|z| = 1$, et toutes ces inégalités sont des égalités. Le cas d'égalité dans l'inégalité triangulaire impose que tous les $z^{k}$ aient le même argument que $z^{0} = 1$, donc $z$ est réel positif : $z = 1$.

    Pour la simplicité, on considère 
    $$R = (X - 1)P = nX^{n + 1} - (n + 1)X^{n} + 1, \qquad R' = n(n + 1)X^{n - 1}(X - 1).$$
     Une racine multiple $z \neq 1$ de $P$ serait racine de $R$ et de $R'$, donc égale à $0$ ; or $R(0) = 1$. Enfin, le calcul donne $R''(1) = n(n + 1)$, qui est non nul : $1$ est racine double de $R$, donc simple de $P$. 
    $$\boxed{\text{les racines autres que } 1 \text{ sont de module } < 1, \text{ et toutes sont simples}}$$
- id: "ma-13-71"
  feuille: "f-ma-13"
  numero: 71
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [racines, sommes]
  noeuds: [pol-racines, n-sommes]
  notions: []
  page_enonce: 13
  page_corrige: 29
  enonce: |
    Soit $P(X) \in \mathbb{R}[X]$ un polynôme n'admettant aucune racine réelle. Montrer que le polynôme $Q(X) = \sum_{n = 0}^{+\infty} P^{(n)}(X)$ n'admet aucune racine réelle. On pourra poser la fonction $f : t \mapsto Q(t) \cdot \mathrm{e}^{-t}$.
  corrige: |
    *Idée.* Le polynôme $Q$ vérifie $Q - Q' = P$, donc $f' = -Pe^{-t}$ garde un signe constant.

    La somme est finie, et $Q - Q' = P$. Quitte à remplacer $P$ par $-P$, on suppose $P > 0$ sur $\mathbb{R}$ : $P$ ne s'annule pas, donc garde un signe constant par le théorème des valeurs intermédiaires. Alors $f'(t) = (Q'(t) - Q(t))\mathrm{e}^{-t} = -P(t)\mathrm{e}^{-t} < 0$ : $f$ est strictement décroissante, et $f(t) \to 0$ en $+\infty$ par croissances comparées. Donc $f(t) > 0$ pour tout $t$, c'est-à-dire $Q(t) > 0$. 
    $$\boxed{Q \text{ n'a aucune racine réelle}}$$
- id: "ma-13-72"
  feuille: "f-ma-13"
  numero: 72
  partie: "Exercices de synthèse"
  etoiles: 4
  types: [Démonstration]
  mots_cles: [fractions rationnelles]
  noeuds: [a-fractions]
  notions: [corps-fractions]
  page_enonce: 13
  page_corrige: 29
  enonce: |
    Soit $F(X)$ une fraction rationnelle non constante dans $\mathbb{C}(X)$. Montrer que l'ensemble image de la fonction rationnelle $z \mapsto F(z)$ est soit $\mathbb{C}$ tout entier, soit $\mathbb{C}$ privé d'un point.
  corrige: |
    *Idée.* L'équation $F(z) = w$ revient à trouver une racine de $P - wQ$ ; d'Alembert-Gauss en fournit une, sauf si ce polynôme est constant, ce qui n'arrive que pour une valeur de $w$ au plus.

    On écrit $F = \frac{P}{Q}$ sous forme irréductible. Soit $w \in \mathbb{C}$. Si $P - wQ$ n'est pas constant, il a une racine $z$ (théorème 11), qui n'est pas un pôle : sinon $Q(z) = 0$ et $P(z) = 0$, ce que la forme irréductible interdit (proposition 16). Donc $F(z) = w$. Si $P - w_{1}Q$ et $P - w_{2}Q$ étaient constants avec $w_{1} \neq w_{2}$, leur différence $(w_{2} - w_{1})Q$ le serait, puis $P$ aussi, et $F$ serait constante. Il y a donc au plus une valeur de $w$ non atteinte. 
    $$\boxed{F(\mathbb{C} \setminus \{\text{pôles}\}) = \mathbb{C} \ \text{ou} \ \mathbb{C} \setminus \{w_{0}\}}$$
     Les deux cas se produisent : un polynôme non constant atteint toutes les valeurs, alors que $\frac{1}{X}$ n'atteint jamais $0$, et $\frac{X + 1}{X}$ n'atteint jamais $1$.

