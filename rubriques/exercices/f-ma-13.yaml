- id: "ma-13-01"
  feuille: "f-ma-13"
  numero: 1
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 1
  types: [Calcul]
  mots_cles: ["l'anneau K[X]"]
  noeuds: [pol-anneau]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer les réels $a$ et $b$ tels que $X^{4} + 6X^{3} + aX^{2} + bX + 1$ soit le carré d'un polynôme de $\mathbb{R}[X]$.
  corrige: |
    Si $P = A^{2}$ avec $A \in \mathbb{R}[X]$, alors $\deg A = 2$ et le coefficient dominant de $A$ vaut $\pm 1$ ; quitte à remplacer $A$ par $-A$, on écrit $A = X^{2} + \beta X + c$. Le développement donne 
    $$A^{2} = X^{4} + 2\beta X^{3} + (\beta^{2} + 2c)X^{2} + 2\beta cX + c^{2}.$$
     Par identification des coefficients : $2\beta = 6$, $c^{2} = 1$, $a = 9 + 2c$ et $b = 6c$. Ainsi $\beta = 3$ et $c = \pm 1$. 
    $$\boxed{(a, b) = (11, 6), \ P = (X^{2} + 3X + 1)^{2} \qquad\text{ou}\qquad (a, b) = (7, -6), \ P = (X^{2} + 3X - 1)^{2}}$$
- id: "ma-13-02"
  feuille: "f-ma-13"
  numero: 2
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["l'anneau K[X]", degré]
  noeuds: [pol-anneau]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Déterminer les polynômes $P \in \mathbb{R}[X]$ vérifiant chacune des équations suivantes. On commencera par comparer les degrés des deux membres.

    **1.** $P(X^{2}) = (X^{2} + 1)\,P(X)$.

    **2.** $P \circ P = P$.

    **3.** $P(X + 1) - P(X) = X$.
  corrige: |
    **(i)** Le polynôme nul convient. Si $P \neq 0$ est de degré $n$, les degrés donnent $2n = n + 2$, soit $n = 2$. On écrit $P = aX^{2} + bX + c$ : 
    $$P(X^{2}) = aX^{4} + bX^{2} + c \qquad\text{et}\qquad (X^{2} + 1)P = aX^{4} + bX^{3} + (a + c)X^{2} + bX + c.$$
     L'identification donne $b = 0$ et $a + c = b = 0$. 
    $$\boxed{P = a(X^{2} - 1), \quad a \in \mathbb{R}}$$

    **(ii)** Les constantes conviennent. Si $\deg P = n \geqslant 1$, la proposition 4 donne $n^{2} = n$, donc $n = 1$. Avec $P = aX + b$, $a \neq 0$, on obtient $a^{2}X + ab + b = aX + b$, donc $a = 1$ et $b = 0$. 
    $$\boxed{P \text{ constant, ou } P = X}$$

    **(iii)** Si $\deg P = n \geqslant 1$ et $P = a_{n}X^{n} + a_{n - 1}X^{n - 1} + \cdots$, la formule du binôme montre que $P(X + 1) - P(X)$ a pour terme de degré $n - 1$ le monôme $na_{n}X^{n - 1}$, et aucun terme de degré $n$. Il faut donc $n = 2$, et l'on cherche $P = aX^{2} + bX + c$ : $P(X + 1) - P(X) = 2aX + a + b = X$ donne $a = \frac{1}{2}$ et $b = -\frac{1}{2}$. 
    $$\boxed{P = \frac{X(X - 1)}{2} + c, \quad c \in \mathbb{R}}$$
     *À retenir.* La comparaison des degrés réduit une équation fonctionnelle à un nombre fini d'inconnues ; c'est le premier réflexe à avoir.
- id: "ma-13-03"
  feuille: "f-ma-13"
  numero: 3
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: ["l'anneau K[X]", polynômes complexes]
  noeuds: [pol-anneau, c-dalembert]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer les polynômes $P \in \mathbb{C}[X]$ tels que $P(X^{2}) = P(X)^{2}$. On pourra écrire $P = aX^{n} + R$ avec $\deg R < n$.
  corrige: |
    Le polynôme nul convient. Sinon, on écrit $P = aX^{n} + R$ avec $a \neq 0$ et $\deg R < n$. Le coefficient de $X^{2n}$ donne $a = a^{2}$, donc $a = 1$. Ensuite, 
    $$P(X^{2}) = X^{2n} + R(X^{2}) \qquad\text{et}\qquad P^{2} = X^{2n} + 2X^{n}R + R^{2},$$
     donc $R(X^{2}) - R^{2} = 2X^{n}R$. Si $R \neq 0$, de degré $m < n$, le membre de gauche est de degré au plus $2m$, et celui de droite de degré $n + m > 2m$ : c'est impossible. Donc $R = 0$. 
    $$\boxed{P = 0 \quad\text{ou}\quad P = X^{n}, \ n \in \mathbb{N}}$$
- id: "ma-13-04"
  feuille: "f-ma-13"
  numero: 4
  partie: "L'anneau $\\mathbb{K}[X]$"
  etoiles: 3
  types: [Calcul]
  mots_cles: ["l'anneau K[X]", polynômes complexes]
  noeuds: [pol-anneau, c-dalembert]
  notions: [anneau-polynomes]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer tous les polynômes $P \in \mathbb{C}[X]$ tels que $P(0) = 0$ et $P(X^{2} + 1) = P(X)^{2} + 1$. On pourra introduire la suite définie par $u_{0} = 0$ et $u_{n + 1} = u_{n}^{2} + 1$.
  corrige: |
    Soit $(u_{n})$ la suite définie par $u_{0} = 0$ et $u_{n + 1} = u_{n}^{2} + 1$. On montre par récurrence que $P(u_{n}) = u_{n}$ : c'est vrai pour $n = 0$ puisque $P(0) = 0$, et si $P(u_{n}) = u_{n}$, alors 
    $$P(u_{n + 1}) = P(u_{n}^{2} + 1) = P(u_{n})^{2} + 1 = u_{n}^{2} + 1 = u_{n + 1}.$$
     Or 
    $$u_{n + 1} - u_{n} = u_{n}^{2} - u_{n} + 1 = \Big(u_{n} - \frac{1}{2}\Big)^{2} + \frac{3}{4} > 0 :$$
     la suite est strictement croissante, donc ses termes sont deux à deux distincts. Le polynôme $P - X$ a une infinité de racines : il est nul (théorème 3). Réciproquement, $P = X$ convient. 
    $$\boxed{P = X}$$
     *Piège.* Sans la condition $P(0) = 0$, il y a d'autres solutions : par exemple $P = X^{2} + 1$, puisque $P(X^{2} + 1)$ et $P^{2} + 1$ valent tous deux $(X^{2} + 1)^{2} + 1$.
- id: "ma-13-05"
  feuille: "f-ma-13"
  numero: 5
  partie: "Divisibilité et division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [division euclidienne]
  noeuds: [pol-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Effectuer les divisions euclidiennes suivantes.

    **1.** $X^{5} - 3X^{3} + 2X + 1$ par $X^{2} + X + 1$.

    **2.** $2X^{4} - X^{3} + 3X - 1$ par $X^{2} - 2X + 3$.

    **3.** $X^{6} - 1$ par $X^{3} + X - 1$.
  corrige: |
    On effectue chaque division par la méthode de la potence, et l'on vérifie en développant $BQ + R$.

    **(i)** $\boxed{X^{5} - 3X^{3} + 2X + 1 = (X^{2} + X + 1)(X^{3} - X^{2} - 3X + 4) + (X - 3)}$

    **(ii)** $\boxed{2X^{4} - X^{3} + 3X - 1 = (X^{2} - 2X + 3)(2X^{2} + 3X) + (-6X - 1)}$

    **(iii)** $\boxed{X^{6} - 1 = (X^{3} + X - 1)(X^{3} - X + 1) + (X^{2} - 2X)}$

    Dans chaque cas, le reste est de degré strictement inférieur à $2$, ou à $3$, comme l'exige le théorème 2.
- id: "ma-13-06"
  feuille: "f-ma-13"
  numero: 6
  partie: "Divisibilité et division euclidienne"
  etoiles: 1
  types: [Calcul]
  mots_cles: [division euclidienne]
  noeuds: [pol-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Déterminer les couples $(\lambda, \mu) \in \mathbb{K}^{2}$ tels que $X^{2} + 2$ divise $X^{4} + X^{3} + \lambda X^{2} + \mu X + 2$.
  corrige: |
    La division euclidienne de $X^{4} + X^{3} + \lambda X^{2} + \mu X + 2$ par $X^{2} + 2$ donne le quotient $X^{2} + X + \lambda - 2$ et le reste 
    $$R = (\mu - 2)X + 6 - 2\lambda.$$
     La divisibilité équivaut à $R = 0$. 
    $$\boxed{(\lambda, \mu) = (3, 2)}$$
     On peut aussi évaluer en la racine $\mathrm{i}\sqrt{2}$ : $4 - 2\mathrm{i}\sqrt{2} - 2\lambda + \mathrm{i}\sqrt{2}\mu + 2 = 0$, ce qui donne la même chose en séparant parties réelle et imaginaire, pour $\lambda$ et $\mu$ réels.
- id: "ma-13-07"
  feuille: "f-ma-13"
  numero: 7
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Calcul]
  mots_cles: [division euclidienne]
  noeuds: [pol-division]
  notions: [division-euclidienne]
  page_enonce: 1
  page_corrige: 3
  enonce: |
    Déterminer les complexes $a$ tels que $X^{2} - aX + 1$ divise $X^{4} - X + a$.
  corrige: |
    La division de $X^{4} - X + a$ par $X^{2} - aX + 1$ donne le reste 
    $$R = (a^{3} - 2a - 1)X + (1 + a - a^{2}).$$
     Il faut $a^{2} = a + 1$ et $a^{3} = 2a + 1$. La première égalité entraîne la seconde : si $a^{2} = a + 1$, alors $a^{3} = a^{2} + a = 2a + 1$. 
    $$\boxed{a = \frac{1 + \sqrt{5}}{2} \qquad\text{ou}\qquad a = \frac{1 - \sqrt{5}}{2}}$$
- id: "ma-13-08"
  feuille: "f-ma-13"
  numero: 8
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [division euclidienne, sommes]
  noeuds: [pol-division, n-sommes]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $p \geqslant 1$ un entier.

    **1.** Montrer que, pour tout $k \in \mathbb{N}$, le reste de la division euclidienne de $X^{k}$ par $X^{p} - 1$ est $X^{r}$, où $r$ est le reste de la division euclidienne de $k$ par $p$.

    **2.** En déduire le reste de la division d'un polynôme $P = \sum a_{k}X^{k}$ par $X^{p} - 1$, puis celui de $X^{2026} + X^{13} + 1$ par $X^{5} - 1$.
  corrige: |
    **1.** On écrit $k = qp + r$ avec $0 \leqslant r < p$. Alors $X^{k} = X^{r}(X^{qp} - 1) + X^{r}$. D'après la formule $a^{q} - 1 = (a - 1)(a^{q - 1} + \cdots + 1)$ appliquée à $a = X^{p}$, le polynôme $X^{p} - 1$ divise $X^{qp} - 1$, et $\deg X^{r} = r < p$ : par unicité, le reste est $X^{r}$.

    **2.** Par linéarité de la division, le reste de $P$ est $\sum_{k} a_{k}X^{r_{k}}$, où $r_{k}$ est le reste de $k$ modulo $p$ : on réduit chaque exposant modulo $p$. Ce polynôme est de degré au plus $p - 1$, et l'unicité conclut. Comme $2026 \equiv 1$ et $13 \equiv 3 \;[5]$ : 
    $$\boxed{X^{2026} + X^{13} + 1 \text{ a pour reste } X^{3} + X + 1 \text{ modulo } X^{5} - 1}$$
     *À retenir.* Modulo $X^{p} - 1$, on calcule avec $X^{p} = 1$, exactement comme modulo $p$ on calcule avec des restes au chapitre 12.
- id: "ma-13-09"
  feuille: "f-ma-13"
  numero: 9
  partie: "Divisibilité et division euclidienne"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [division euclidienne]
  noeuds: [pol-division]
  notions: [division-euclidienne]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    **1.** Soit $A$, $B$, $P$ trois polynômes, avec $P$ non constant. Montrer que si $A \circ P$ divise $B \circ P$, alors $A$ divise $B$.

    **2.** Soit $P, Q \in \mathbb{K}[X]$ et $m \in \mathbb{N}^{*}$. Montrer que $P$ divise $Q$ si et seulement si $P(X^{m})$ divise $Q(X^{m})$.
  corrige: |
    **1.** Soit $B = AQ + R$ la division euclidienne de $B$ par $A$ (si $A = 0$, alors $A \circ P = 0$ divise $B \circ P$, donc $B \circ P = 0$ et $B = 0$ par la proposition 4). En composant par $P$ : 
    $$B \circ P = (A \circ P)(Q \circ P) + R \circ P.$$
     Comme $A \circ P$ divise $B \circ P$, il divise $R \circ P$. Or, par la proposition 4, 
    $$\deg(R \circ P) = \deg R \times \deg P < \deg A \times \deg P = \deg(A \circ P),$$
     donc $R \circ P = 0$, puis $R = 0$. 
    $$\boxed{A \mid B}$$

    **2.** Si $Q = PS$, alors $Q(X^{m}) = P(X^{m})S(X^{m})$. La réciproque est la question 1 avec le polynôme non constant $X^{m}$.
- id: "ma-13-10"
  feuille: "f-ma-13"
  numero: 10
  partie: "Fonctions polynomiales et racines"
  etoiles: 1
  types: [Calcul]
  mots_cles: [racines]
  noeuds: [pol-evaluation, pol-racines]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    À l'aide du schéma de Horner, calculer $P(3)$ pour $P = X^{5} - 4X^{4} + 2X^{3} + X - 7$, et en déduire le quotient de la division de $P$ par $X - 3$.
  corrige: |
    On dispose le schéma de Horner, sans oublier le coefficient nul de $X^{2}$ :

    $$\begin{array}{r|cccccc}  \text{coefficients} & 1 & -4 & 2 & 0 & 1 & -7 \\  \text{produits par }3 &  & 3 & -3 & -3 & -9 & -24 \\ \hline \text{sommes} & 1 & -1 & -1 & -3 & -8 & -31 \end{array}$$

    $$\boxed{P(3) = -31 \qquad\text{et}\qquad P = (X - 3)(X^{4} - X^{3} - X^{2} - 3X - 8) - 31}$$
     Vérification directe : $243 - 324 + 54 + 3 - 7 = -31$. ✓
- id: "ma-13-11"
  feuille: "f-ma-13"
  numero: 11
  partie: "Fonctions polynomiales et racines"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [racines, polynômes complexes]
  noeuds: [pol-evaluation, pol-racines, c-dalembert]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $n \in \mathbb{N}$. Le polynôme $X^{2} + X + 1$ divise-t-il $X^{3n + 8} + X^{3n + 4} + X^{3n}$ dans $\mathbb{C}[X]$ ?

    **2.** Soit $P \in \mathbb{R}[X]$. Montrer que $X^{2} - X$ divise $P(X^{2} + 3X)$ si et seulement si $X^{2} - 2X$ divise $P(X^{2})$.
  corrige: |
    **1.** Les racines de $X^{2} + X + 1$ sont $j$ et $\overline{j} = j^{2}$, simples. Comme $j^{3} = 1$, 
    $$j^{3n + 8} + j^{3n + 4} + j^{3n} = j^{2} + j + 1 = 0,$$
     et de même en $\overline{j}$. Par la proposition 8, $(X - j)(X - \overline{j}) = X^{2} + X + 1$ divise le polynôme. 
    $$\boxed{\text{oui, pour tout } n \in \mathbb{N}}$$

    **2.** Le polynôme $X^{2} - X = X(X - 1)$ a les racines simples $0$ et $1$ ; il divise $Q = P(X^{2} + 3X)$ si et seulement si $Q(0) = Q(1) = 0$, c'est-à-dire $P(0) = P(4) = 0$. De même, $X^{2} - 2X = X(X - 2)$ divise $P(X^{2})$ si et seulement si $P(0) = P(4) = 0$. 
    $$\boxed{\text{les deux conditions équivalent à } P(0) = P(4) = 0}$$
- id: "ma-13-12"
  feuille: "f-ma-13"
  numero: 12
  partie: "Fonctions polynomiales et racines"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [racines]
  noeuds: [pol-evaluation, pol-racines]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $P \in \mathbb{K}[X]$. Montrer que $P - X$ divise $P \circ P - X$.

    **2.** Résoudre dans $\mathbb{C}$ l'équation $(z^{2} + 3z + 1)^{2} + 3z^{2} + 8z + 4 = 0$.
  corrige: |
    **1.** On écrit $P \circ P - X = (P \circ P - P) + (P - X)$. Avec $P = \sum a_{k}X^{k}$, 
    $$P \circ P - P = \sum_{k} a_{k}(P^{k} - X^{k}),$$
     et chaque $P^{k} - X^{k}$ est divisible par $P - X$ (chapitre 11, théorème 3). Donc $P - X$ divise $P \circ P - X$.

    **2.** Avec $P = X^{2} + 3X + 1$, on a $P \circ P - X = (X^{2} + 3X + 1)^{2} + 3X^{2} + 8X + 4$, qui est le polynôme de l'équation. Il est divisible par $P - X = X^{2} + 2X + 1 = (X + 1)^{2}$, et la division donne 
    $$(z^{2} + 3z + 1)^{2} + 3z^{2} + 8z + 4 = (z + 1)^{2}(z^{2} + 4z + 5).$$

    $$\boxed{\mathcal{S} = \{-1, \ -2 + \mathrm{i}, \ -2 - \mathrm{i}\}, \text{ avec } -1 \text{ racine double}}$$
- id: "ma-13-13"
  feuille: "f-ma-13"
  numero: 13
  partie: "Fonctions polynomiales et racines"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [racines, degré, multiplicité, polynôme dérivé, polynômes complexes]
  noeuds: [pol-evaluation, pol-racines, pol-anneau, pol-derivee, c-dalembert]
  notions: [multiplicite-racine, derivee-formelle]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    **1.** Soit $P \in \mathbb{K}[X]$ de degré $3$, possédant au moins deux racines dans $\mathbb{K}$, comptées avec leur multiplicité. Montrer que $P$ est scindé sur $\mathbb{K}$.

    **2.** Soit $P \in \mathbb{C}[X]$ de degré $n \geqslant 2$. Montrer que la moyenne des racines de $P'$ est égale à celle des racines de $P$, les racines étant comptées avec leur multiplicité.
  corrige: |
    **1.** Si $a$ et $b$ sont deux racines, comptées avec multiplicité, $(X - a)(X - b)$ divise $P$ (proposition 8, ou proposition 10 si $a = b$) : $P = (X - a)(X - b)Q$ avec $\deg Q = 1$, et $Q$ a une racine dans $\mathbb{K}$. 
    $$\boxed{P \text{ est scindé sur } \mathbb{K}}$$

    **2.** Si $P = a_{n}X^{n} + a_{n - 1}X^{n - 1} + \cdots$, alors $P' = na_{n}X^{n - 1} + (n - 1)a_{n - 1}X^{n - 2} + \cdots$. Les deux polynômes sont scindés sur $\mathbb{C}$, et le théorème 4 donne les moyennes 
    $$\frac{1}{n}\Big(-\frac{a_{n - 1}}{a_{n}}\Big) \qquad\text{et}\qquad \frac{1}{n - 1}\Big(-\frac{(n - 1)a_{n - 1}}{na_{n}}\Big) = -\frac{a_{n - 1}}{na_{n}}.$$

    $$\boxed{\text{les racines de } P \text{ et de } P' \text{ ont le même isobarycentre}}$$
- id: "ma-13-14"
  feuille: "f-ma-13"
  numero: 14
  partie: "Fonctions polynomiales et racines"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines, relations coefficients-racines, "racines de l'unité", sommes]
  noeuds: [pol-evaluation, pol-racines, cx-exponentielle, n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Utiliser les relations entre coefficients et racines de $X^{n} - 1$ pour retrouver $\sum_{\omega \in \mathbb{U}_{n}} \omega$, puis pour calculer $\prod_{\omega \in \mathbb{U}_{n}} \omega$ et $\sum_{\omega \in \mathbb{U}_{n}} \omega^{2}$.
  corrige: |
    Les éléments de $\mathbb{U}_{n}$ sont les $n$ racines, simples, de $X^{n} - 1$. Le théorème 4 donne $\sigma_{1} = 0$ si $n \geqslant 2$, $\sigma_{2} = 0$ si $n \geqslant 3$, et $\sigma_{n} = (-1)^{n} \times (-1) = (-1)^{n + 1}$. Enfin $\sum \omega^{2} = \sigma_{1}^{2} - 2\sigma_{2}$. 
    $$\boxed{\sum_{\omega \in \mathbb{U}_{n}} \omega = 0 \ (n \geqslant 2), \qquad \prod_{\omega \in \mathbb{U}_{n}} \omega = (-1)^{n + 1}, \qquad \sum_{\omega \in \mathbb{U}_{n}} \omega^{2} = 0 \ (n \geqslant 3)}$$
     Les cas exclus se traitent à la main : $\sum_{\mathbb{U}_{1}} \omega = 1$, $\sum_{\mathbb{U}_{1}} \omega^{2} = 1$ et $\sum_{\mathbb{U}_{2}} \omega^{2} = 1 + 1 = 2$. Le produit se retrouve aussi par $\prod_{k} \mathrm{e}^{2\mathrm{i} k\pi/n} = \mathrm{e}^{\mathrm{i}\pi(n - 1)} = (-1)^{n - 1}$.
- id: "ma-13-15"
  feuille: "f-ma-13"
  numero: 15
  partie: "Fonctions polynomiales et racines"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines, relations coefficients-racines]
  noeuds: [pol-evaluation, pol-racines]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    *Sommes de Newton.*

    **1.** Exprimer $x^{2} + y^{2} + z^{2}$ et $x^{3} + y^{3} + z^{3}$ en fonction de $\sigma_{1} = x + y + z$, $\sigma_{2} = xy + xz + yz$ et $\sigma_{3} = xyz$.

    **2.** Résoudre les systèmes suivants, d'inconnues $x$, $y$, $z$ dans $\mathbb{C}$ (dans $\mathbb{C}^{*}$ pour le premier) : 
    $$\left\{ \begin{array}{l} x + y + z = 1 \\[2pt] \dfrac{1}{x} + \dfrac{1}{y} + \dfrac{1}{z} = 1 \\[6pt] xyz = -4 \end{array} \right. \qquad\qquad \left\{ \begin{array}{l} x + y + z = 2 \\ x^{2} + y^{2} + z^{2} = 14 \\ x^{3} + y^{3} + z^{3} = 20 \end{array} \right.$$
  corrige: |
    **1.** En développant $\sigma_{1}^{2}$ et $\sigma_{1}\sigma_{2}$ : 
    $$\boxed{x^{2} + y^{2} + z^{2} = \sigma_{1}^{2} - 2\sigma_{2}, \qquad x^{3} + y^{3} + z^{3} = \sigma_{1}^{3} - 3\sigma_{1}\sigma_{2} + 3\sigma_{3}}$$

    **2.** Dans chaque cas, on calcule $\sigma_{1}$, $\sigma_{2}$, $\sigma_{3}$ : d'après le théorème 4, $x$, $y$, $z$ sont alors les racines de $T^{3} - \sigma_{1}T^{2} + \sigma_{2}T - \sigma_{3}$, et réciproquement.

    *Premier système.* On a $\sigma_{1} = 1$ et $\sigma_{3} = -4$, et la deuxième équation s'écrit $\sigma_{2} = \sigma_{3}$, donc $\sigma_{2} = -4$. Le polynôme vaut $T^{3} - T^{2} - 4T + 4 = (T - 1)(T - 2)(T + 2)$.

    *Second système.* $\sigma_{1} = 2$, $\sigma_{2} = \frac{4 - 14}{2} = -5$, puis $20 = 8 + 30 + 3\sigma_{3}$, donc $\sigma_{3} = -6$. Le polynôme $T^{3} - 2T^{2} - 5T + 6 = (T - 1)(T + 2)(T - 3)$. 
    $$\boxed{(x, y, z) \text{ est une permutation de } (1, 2, -2), \text{ ou de } (1, -2, 3)}$$
     Chaque système a donc six solutions.
- id: "ma-13-16"
  feuille: "f-ma-13"
  numero: 16
  partie: "Fonctions polynomiales et racines"
  etoiles: 2
  types: [Calcul]
  mots_cles: [racines, factorisation, polynômes complexes]
  noeuds: [pol-evaluation, pol-racines, pol-irreductibles, c-dalembert]
  notions: [polynome-irreductible]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Factoriser dans $\mathbb{C}[X]$ les polynômes suivants, à l'aide de l'information donnée.

    **1.** $X^{3} - 8X^{2} + 23X - 28$, sachant que la somme de deux de ses racines est égale à la troisième.

    **2.** $X^{4} + 12X - 5$, sachant qu'il possède deux racines dont la somme vaut $2$.
  corrige: |
    **(i)** Si $x_{3} = x_{1} + x_{2}$, alors $2x_{3} = x_{1} + x_{2} + x_{3} = 8$, donc $x_{3} = 4$ ; on vérifie que $64 - 128 + 92 - 28 = 0$. La division par $X - 4$ donne $X^{2} - 4X + 7$, de racines $2 \pm \mathrm{i}\sqrt{3}$. 
    $$\boxed{X^{3} - 8X^{2} + 23X - 28 = (X - 4)(X - 2 - \mathrm{i}\sqrt{3})(X - 2 + \mathrm{i}\sqrt{3})}$$

    **(ii)** Les deux racines de somme $2$ sont celles d'un facteur $X^{2} - 2X + p$, et les deux autres, de somme $-2$ par le théorème 4, celles d'un facteur $X^{2} + 2X + q$. En développant $(X^{2} - 2X + p)(X^{2} + 2X + q)$ et en identifiant : $p + q = 4$, $2p - 2q = 12$ et $pq = -5$, d'où $p = 5$ et $q = -1$. 
    $$\boxed{X^{4} + 12X - 5 = (X - 1 - 2\mathrm{i})(X - 1 + 2\mathrm{i})(X + 1 - \sqrt{2})(X + 1 + \sqrt{2})}$$
- id: "ma-13-17"
  feuille: "f-ma-13"
  numero: 17
  partie: "Fonctions polynomiales et racines"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [racines, multiplicité, relations coefficients-racines, sommes]
  noeuds: [pol-evaluation, pol-racines, pol-derivee, n-sommes]
  notions: [multiplicite-racine]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $Q \in \mathbb{R}[X]$ et $P = X^{3}Q + X^{2} + X + 1$. On note $\xi_{1}, \dots, \xi_{n}$ les racines complexes de $P$, comptées avec leur multiplicité.

    **1.** Montrer que $0$ n'est pas racine de $P$.

    **2.** Calculer $\Sigma_{1} = \sum_{k = 1}^{n} \frac{1}{\xi_{k}}$ et $\Sigma_{2} = \sum_{1 \leqslant k < l \leqslant n} \frac{1}{\xi_{k}\xi_{l}}$. On pourra considérer le polynôme $X^{n}P\big(\frac{1}{X}\big)$.

    **3.** Calculer $\sum_{k = 1}^{n} \frac{1}{\xi_{k}^{2}}$, et en déduire que $P$ n'est pas scindé sur $\mathbb{R}$.
  corrige: |
    **1.** $P(0) = 1 \neq 0$.

    **2.** On écrit $P = a_{n}X^{n} + \cdots + a_{3}X^{3} + X^{2} + X + 1$. Le polynôme 
    $$\widetilde{P} = X^{n}P\Big(\frac{1}{X}\Big) = X^{n} + X^{n - 1} + X^{n - 2} + a_{3}X^{n - 3} + \cdots + a_{n}$$
     a pour racines les $\frac{1}{\xi_{k}}$, avec les mêmes multiplicités, puisque $\widetilde{P}(z) = z^{n}P\big(\frac{1}{z}\big)$ pour $z \neq 0$ et que $\widetilde{P}(0) = a_{n} \neq 0$. Les relations du théorème 4 appliquées à $\widetilde{P}$, unitaire, donnent : 
    $$\boxed{\Sigma_{1} = -1 \qquad\text{et}\qquad \Sigma_{2} = 1}$$

    **3.** $\sum \frac{1}{\xi_{k}^{2}} = \Sigma_{1}^{2} - 2\Sigma_{2} = \boxed{-1}$. Si $P$ était scindé sur $\mathbb{R}$, les $\xi_{k}$ seraient réels et cette somme de carrés de réels serait positive. 
    $$\boxed{P \text{ n'est pas scindé sur } \mathbb{R}}$$
     *À retenir.* Le polynôme réciproque $X^{n}P\big(\frac{1}{X}\big)$ échange le rôle des coefficients extrêmes : c'est l'outil naturel pour les sommes d'inverses de racines.
- id: "ma-13-18"
  feuille: "f-ma-13"
  numero: 18
  partie: "Fonctions polynomiales et racines"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [racines, polynômes complexes]
  noeuds: [pol-evaluation, pol-racines, c-dalembert]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer tous les polynômes $P \in \mathbb{C}[X]$ tels que $P(X^{2}) = P(X)\,P(X + 1)$. On examinera le coefficient dominant, puis on démontrera que si $\lambda$ est une racine de $P$, alors $\lambda^{2}$ et $(\lambda - 1)^{2}$ en sont aussi, et que $|\lambda|$ vaut $0$ ou $1$.
  corrige: |
    Le polynôme nul convient. Sinon, soit $a$ le coefficient dominant et $n$ le degré de $P$. Le coefficient de $X^{2n}$ donne $a = a^{2}$, donc $a = 1$.

    *Racines.* Si $\lambda$ est racine, l'évaluation en $\lambda$ donne $P(\lambda^{2}) = 0$, et l'évaluation en $\lambda - 1$ donne $P\big((\lambda - 1)^{2}\big) = P(\lambda - 1)P(\lambda) = 0$. Par récurrence, tous les $\lambda^{2^{k}}$ sont racines ; comme $P$ n'a qu'un nombre fini de racines, ils ne peuvent être deux à deux distincts, ce qui impose $|\lambda| \in \{0, 1\}$, puisque sinon les modules $|\lambda|^{2^{k}}$ seraient strictement monotones. De même, la racine $(\lambda - 1)^{2}$ impose $|\lambda - 1|^{2} \in \{0, 1\}$.

    *Conclusion sur les racines.* Si $\lambda \notin \{0, 1\}$, on aurait $|\lambda| = |\lambda - 1| = 1$, donc $\lambda = \mathrm{e}^{\pm \mathrm{i}\pi/3}$. Mais alors $\lambda^{2} = \mathrm{e}^{\pm 2\mathrm{i}\pi/3}$ serait racine, avec $|\lambda^{2} - 1| = \sqrt{3} \notin \{0, 1\}$ : contradiction. Les seules racines possibles sont $0$ et $1$, et $P = X^{a}(X - 1)^{b}$ avec $a, b \in \mathbb{N}$.

    *Exposants.* On a $P(X^{2}) = X^{2a}(X - 1)^{b}(X + 1)^{b}$ et $P(X)P(X + 1) = X^{a + b}(X - 1)^{b}(X + 1)^{a}$. L'unicité de la décomposition (théorème 10) donne $2a = a + b$ et $b = a$. 
    $$\boxed{P = 0 \quad\text{ou}\quad P = (X^{2} - X)^{n}, \ n \in \mathbb{N}}$$
     Vérification : $(X^{4} - X^{2})^{n} = X^{2n}(X^{2} - 1)^{n} = (X^{2} - X)^{n}\big((X + 1)^{2} - (X + 1)\big)^{n}$. ✓
- id: "ma-13-19"
  feuille: "f-ma-13"
  numero: 19
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivation, polynôme dérivé]
  noeuds: [pol-derivee]
  notions: [derivee-formelle]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Déterminer tous les polynômes $P \in \mathbb{R}[X]$ tels que $P(2) = 1$, $P'(2) = 2$, $P''(2) = 4$ et $P^{(k)}(2) = 0$ pour tout $k \geqslant 3$.
  corrige: |
    Par la formule de Taylor (théorème 6), un tel polynôme est de degré au plus $2$ et s'écrit 
    $$P = P(2) + P'(2)(X - 2) + \frac{P''(2)}{2}(X - 2)^{2} = 1 + 2(X - 2) + 2(X - 2)^{2}.$$
     Réciproquement, ce polynôme convient. 
    $$\boxed{P = 2X^{2} - 6X + 5}$$
- id: "ma-13-20"
  feuille: "f-ma-13"
  numero: 20
  partie: "Dérivation"
  etoiles: 1
  types: [Calcul]
  mots_cles: [dérivation, division euclidienne, polynôme dérivé]
  noeuds: [pol-derivee, pol-division]
  notions: [derivee-formelle]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    Soit $a \neq b$ deux réels et $P \in \mathbb{R}[X]$.

    **1.** Exprimer à l'aide de $P(a)$ et $P(b)$ le reste de la division euclidienne de $P$ par $(X - a)(X - b)$.

    **2.** Exprimer à l'aide de $P(a)$ et $P'(a)$ le reste de la division euclidienne de $P$ par $(X - a)^{2}$.

    **3.** Soit $n \geqslant 2$. Calculer le reste de la division euclidienne de $X^{n} + 2X - 2$ par $(X - 1)^{2}$.
  corrige: |
    **1.** Le reste $R = \alpha X + \beta$ vérifie $R(a) = P(a)$ et $R(b) = P(b)$, en évaluant $P = (X - a)(X - b)Q + R$. On résout ce système de deux équations : 
    $$\boxed{R = \frac{P(a) - P(b)}{a - b}\,X + \frac{aP(b) - bP(a)}{a - b}}$$

    **2.** De $P = (X - a)^{2}Q + R$ on tire $P(a) = R(a)$ et, en dérivant, $P'(a) = R'(a)$, puisque $\big((X - a)^{2}Q\big)'$ s'annule en $a$. 
    $$\boxed{R = P(a) + P'(a)(X - a)}$$

    **3.** Pour $P = X^{n} + 2X - 2$, on a $P(1) = 1$ et $P'(1) = n + 2$. 
    $$\boxed{R = (n + 2)X - (n + 1)}$$
     Vérification pour $n = 2$ : $X^{2} + 2X - 2 = (X - 1)^{2} + 4X - 3$. ✓
- id: "ma-13-21"
  feuille: "f-ma-13"
  numero: 21
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivation, division euclidienne]
  noeuds: [pol-derivee, pol-division]
  notions: [derivee-formelle]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Dans chacun des cas suivants, déterminer le reste de la division euclidienne de $P$ par $Q$, pour $n \in \mathbb{N}$.

    **1.** $P = X^{100}$ et $Q = (X - 1)^{3}(X + 1)$.

    **2.** $P = X^{2n}$ et $Q = (X^{2} + 1)^{2}$.

    **3.** $P = (X + 1)^{2n + 1} - X^{2n + 1}$ et $Q = X^{2} + X + 1$.
  corrige: |
    **(i)** On cherche le reste sous la forme $R = c_{0} + c_{1}(X - 1) + c_{2}(X - 1)^{2} + c_{3}(X - 1)^{3}$. Comme $1$ est racine triple de $Q$, les valeurs de $R$, $R'$, $R''$ en $1$ sont celles de $X^{100}$ : $c_{0} = 1$, $c_{1} = 100$, $c_{2} = \frac{100 \times 99}{2} = 4950$. Enfin $R(-1) = (-1)^{100} = 1$ donne $1 - 200 + 4 \times 4950 - 8c_{3} = 1$, soit $c_{3} = 2450$. 
    $$\boxed{R = 1 + 100(X - 1) + 4950(X - 1)^{2} + 2450(X - 1)^{3} = 2450X^{3} - 2400X^{2} - 2450X + 2401}$$

    **(ii)** On pose $Y = X^{2} + 1$, de sorte que $X^{2n} = (Y - 1)^{n}$. La formule du binôme donne, avec $S$ un polynôme, 
    $$(Y - 1)^{n} = (-1)^{n} + n(-1)^{n - 1}Y + Y^{2}S,$$
     et les deux premiers termes forment un polynôme de degré au plus $2 < 4$. 
    $$\boxed{R = (-1)^{n + 1}\big(nX^{2} + n - 1\big)}$$

    **(iii)** Le reste $R = \alpha X + \beta$ vérifie $R(j) = P(j)$ et $R(\overline{j}) = P(\overline{j}) = \overline{P(j)}$, puisque $P$ est réel. Comme $j + 1 = -j^{2}$, on a $P(j) = -j^{4n + 2} - j^{2n + 1}$, qui vaut $1$ si $n \equiv 0$ ou $2 \;[3]$, et $-2$ si $n \equiv 1 \;[3]$. Cette valeur est réelle, donc $\alpha(j - \overline{j}) = 0$ et $R$ est constant. 
    $$\boxed{R = -2 \text{ si } n \equiv 1 \;[3], \qquad R = 1 \text{ sinon}}$$
- id: "ma-13-22"
  feuille: "f-ma-13"
  numero: 22
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, racines, multiplicité, "racines de l'unité"]
  noeuds: [pol-derivee, pol-racines]
  notions: [derivee-formelle, multiplicite-racine]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Soit $n \geqslant 3$ et $P = X^{2n + 1} - (2n + 1)X^{n + 1} + (2n + 1)X^{n} - 1$. Déterminer la multiplicité de $1$ dans $P$.

    **2.** Soit $n \geqslant 1$. Déterminer les réels $a$ et $b$ tels que $1$ soit racine au moins double de $aX^{n + 1} + bX^{n} + 1$.

    **3.** Montrer par deux méthodes différentes que $X^{2}$ divise $(X + 1)^{n} - nX - 1$ pour tout $n \in \mathbb{N}$.

    **4.** Pour quelles valeurs de $n \in \mathbb{N}^{*}$ le polynôme $(X^{2} + X + 1)^{2}$ divise-t-il $(X + 1)^{n} - X^{n} - 1$ ?
  corrige: |
    **1.** On a $P(1) = 0$, puis 
    $$P' = (2n + 1)\big(X^{2n} - (n + 1)X^{n} + nX^{n - 1}\big), \qquad P'' = (2n + 1)n\big(2X^{2n - 1} - (n + 1)X^{n - 1} + (n - 1)X^{n - 2}\big),$$
     qui s'annulent en $1$, et $P'''(1) = (2n + 1)n\big(2(2n - 1) - (n + 1)(n - 1) + (n - 1)(n - 2)\big) = (2n + 1)n(n + 1) \neq 0$. Par la proposition 12 : 
    $$\boxed{1 \text{ est racine triple de } P}$$

    **2.** Avec $Q = aX^{n + 1} + bX^{n} + 1$, il faut $Q(1) = a + b + 1 = 0$ et $Q'(1) = (n + 1)a + nb = 0$. 
    $$\boxed{a = n, \quad b = -(n + 1)}$$

    **3.** *Par le binôme* : $(X + 1)^{n} - nX - 1 = \sum_{k = 2}^{n} \binom{n}{k}X^{k}$, qui est multiple de $X^{2}$. *Par les dérivées* : $Q = (X + 1)^{n} - nX - 1$ vérifie $Q(0) = 0$ et $Q'(0) = n - n = 0$, donc $0$ est racine au moins double.

    **4.** Les racines de $(X^{2} + X + 1)^{2}$ sont $j$ et $\overline{j}$, doubles. Soit $f = (X + 1)^{n} - X^{n} - 1$, à coefficients réels : il suffit, par la proposition 18, que $j$ soit racine au moins double. Comme $j + 1 = -j^{2}$, 
    $$f'(j) = n\big((-j^{2})^{n - 1} - j^{n - 1}\big) = nj^{n - 1}\big((-j)^{n - 1} - 1\big),$$
     qui est nul si et seulement si $(-j)^{n - 1} = 1$. Or $-j = \mathrm{e}^{-\mathrm{i}\pi/3}$ est une racine primitive sixième de l'unité, donc $f'(j) = 0$ équivaut à $n \equiv 1 \;[6]$. Dans ce cas, $f(j) = -j^{2n} - j^{n} - 1 = -j^{2} - j - 1 = 0$. 
    $$\boxed{(X^{2} + X + 1)^{2} \mid (X + 1)^{n} - X^{n} - 1 \iff n \equiv 1 \;[6]}$$
- id: "ma-13-23"
  feuille: "f-ma-13"
  numero: 23
  partie: "Dérivation"
  etoiles: 2
  types: [Calcul]
  mots_cles: [dérivation, polynôme dérivé]
  noeuds: [pol-derivee]
  notions: [derivee-formelle]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Déterminer tous les polynômes $P \in \mathbb{R}[X]$ tels que $P = P'P''$.
  corrige: |
    Le polynôme nul convient, et une constante non nulle ne convient pas. Si $\deg P = n \geqslant 1$, les degrés donnent $n = (n - 1) + (n - 2)$, soit $n = 3$, et le coefficient dominant $a$ vérifie $a = 3a \times 6a$, donc $a = \frac{1}{18}$. Soit $\alpha$ la racine de $P''$, de degré $1$. L'égalité $P = P'P''$ donne $P(\alpha) = 0$. En dérivant, $P' = P''^{2} + P'P'''$, avec $P''' = 6a = \frac{1}{3}$ ; en $\alpha$, $P'(\alpha) = \frac{1}{3}P'(\alpha)$, donc $P'(\alpha) = 0$. Ainsi $\alpha$ est racine triple de $P$, et $P = \frac{1}{18}(X - \alpha)^{3}$. Réciproquement, $P' = \frac{(X - \alpha)^{2}}{6}$ et $P'' = \frac{X - \alpha}{3}$ conviennent. 
    $$\boxed{P = 0 \quad\text{ou}\quad P = \frac{(X - \alpha)^{3}}{18}, \ \alpha \in \mathbb{R}}$$
- id: "ma-13-24"
  feuille: "f-ma-13"
  numero: 24
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, racines, sommes]
  noeuds: [pol-derivee, pol-racines, n-sommes]
  notions: [derivee-formelle]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $P_{n} = \sum_{k = 0}^{n} \frac{X^{k}}{k!}$.

    **1.** Montrer que $P_{n}$ n'a que des racines simples dans $\mathbb{C}$. On pourra exprimer $P_{n} - P_{n}'$.

    **2.** Montrer que $P_{n}$ n'a aucune racine réelle si $n$ est pair, et exactement une si $n$ est impair. On raisonnera par récurrence, en étudiant les variations de la fonction associée.
  corrige: |
    **1.** On a $P_{n}' = P_{n - 1}$, donc $P_{n} - P_{n}' = \frac{X^{n}}{n!}$. Si $z$ était racine multiple, on aurait $P_{n}(z) = P_{n}'(z) = 0$, donc $z^{n} = 0$, soit $z = 0$ ; or $P_{n}(0) = 1$. 
    $$\boxed{P_{n} \text{ n'a que des racines simples}}$$

    **2.** On montre par récurrence sur $n \in \mathbb{N}$ que $P_{n} > 0$ sur $\mathbb{R}$ si $n$ est pair, et que $P_{n}$ s'annule exactement une fois si $n$ est impair. Pour $n = 0$, $P_{0} = 1$. Si $n$ est impair, $P_{n}' = P_{n - 1} > 0$ : la fonction est strictement croissante, de limites $-\infty$ et $+\infty$, donc s'annule une seule fois. Si $n \geqslant 2$ est pair, $P_{n}' = P_{n - 1}$ s'annule en un seul point $c$, en changeant de signe de $-$ à $+$ : $P_{n}$ atteint son minimum en $c$, et ce minimum vaut 
    $$P_{n}(c) = P_{n}(c) - P_{n}'(c) = \frac{c^{n}}{n!} > 0,$$
     puisque $c \neq 0$ et $n$ est pair. 
    $$\boxed{P_{n} \text{ a } 0 \text{ racine réelle si } n \text{ est pair, et } 1 \text{ si } n \text{ est impair}}$$
- id: "ma-13-25"
  feuille: "f-ma-13"
  numero: 25
  partie: "Dérivation"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [dérivation, degré, racines, multiplicité, polynôme dérivé, polynômes complexes]
  noeuds: [pol-derivee, pol-anneau, pol-racines, c-dalembert]
  notions: [derivee-formelle, multiplicite-racine]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    Soit $P \in \mathbb{R}[X]$ de degré $n \geqslant 2$.

    **1.** On suppose $P$ scindé sur $\mathbb{R}$. Montrer, à l'aide du théorème de Rolle, que $P'$ est scindé sur $\mathbb{R}$, et que toute racine multiple de $P'$ est racine de $P$.

    **2.** On suppose $P$ scindé à racines simples sur $\mathbb{R}$. Montrer que $P'$ est scindé à racines simples sur $\mathbb{R}$, puis que $P^{2} + 1$ n'a que des racines simples dans $\mathbb{C}$.

    **3.** Si $P \in \mathbb{C}[X]$ n'a que des racines simples, en est-il de même de $P'$ ? On pourra considérer $X^{3} - 1$.
  corrige: |
    **1.** Soit $a_{1} < \cdots < a_{r}$ les racines distinctes de $P$, de multiplicités $m_{1}, \dots, m_{r}$, avec $\sum m_{i} = n$. Chaque $a_{i}$ est racine de $P'$ de multiplicité $m_{i} - 1$ (proposition 12). Le théorème de Rolle fournit en outre une racine de $P'$ dans chacun des $r - 1$ intervalles $]a_{i}, a_{i + 1}[$. On obtient ainsi au moins $\sum (m_{i} - 1) + r - 1 = n - 1 = \deg P'$ racines comptées avec multiplicité : ce sont toutes les racines de $P'$, qui est donc scindé, et les racines fournies par Rolle sont simples. Une racine multiple de $P'$ est donc l'un des $a_{i}$. 
    $$\boxed{P' \text{ est scindé sur } \mathbb{R}, \text{ et ses racines multiples sont racines de } P}$$

    **2.** Si tous les $m_{i}$ valent $1$, les $n - 1$ racines de Rolle sont toutes les racines de $P'$, et elles sont simples. Si $z$ était racine multiple de $P^{2} + 1$, alors $2P(z)P'(z) = 0$ avec $P(z) = \pm\mathrm{i} \neq 0$, donc $P'(z) = 0$ ; mais les racines de $P'$ sont réelles, et $P(z)$ serait réel, ce qui contredit $P(z)^{2} = -1$. 
    $$\boxed{P' \text{ est simplement scindé, et } P^{2} + 1 \text{ n'a que des racines simples}}$$

    **3.** Non : $X^{3} - 1$ a trois racines simples dans $\mathbb{C}$, mais sa dérivée $3X^{2}$ a la racine double $0$. Le théorème de Rolle n'a pas d'analogue sur $\mathbb{C}$.
- id: "ma-13-26"
  feuille: "f-ma-13"
  numero: 26
  partie: "Dérivation"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [dérivation, racines, multiplicité, polynôme dérivé, polynômes complexes]
  noeuds: [pol-derivee, pol-racines, c-dalembert]
  notions: [derivee-formelle, multiplicite-racine]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    Soit $P \in \mathbb{C}[X]$ non nul tel que $P'$ divise $P$.

    **1.** Montrer que les racines de $P'$ sont des racines de $P$.

    **2.** Montrer que $P$ ne peut pas avoir deux racines distinctes. On pourra comparer les multiplicités d'une racine dans $P$ et dans $P'$.

    **3.** Déterminer tous les polynômes $P$ possibles.
  corrige: |
    **1.** Si $P = P'S$ et $P'(a) = 0$, alors $P(a) = 0$. Remarquons que $P$ n'est pas constant : sinon $P' = 0$ ne divise pas $P \neq 0$.

    **2.** Soit $n = \deg P \geqslant 1$. Comme $\deg P' = n - 1$, le quotient $S$ est de degré $1$. Si $a$ est racine de $P$ de multiplicité $m \geqslant 1$, elle est racine de $P'$ de multiplicité $m - 1$, et l'égalité $P = P'S$ impose que $a$ soit racine de $S$, pour retrouver la multiplicité $m$. Comme $S$ est de degré $1$, il n'a qu'une racine : $P$ n'a qu'une seule racine.

    **3.** D'après le théorème 11, $P$ est scindé sur $\mathbb{C}$, avec une seule racine $a$ : $P = \lambda(X - a)^{n}$. Réciproquement, $P' = n\lambda(X - a)^{n - 1}$ divise $P$. 
    $$\boxed{P = \lambda(X - a)^{n}, \quad \lambda \in \mathbb{C}^{*}, \ a \in \mathbb{C}, \ n \geqslant 1}$$
- id: "ma-13-27"
  feuille: "f-ma-13"
  numero: 27
  partie: "Dérivation"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [dérivation, racines, multiplicité]
  noeuds: [pol-derivee, pol-racines]
  notions: [derivee-formelle, multiplicite-racine]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $Q \in \mathbb{R}[X]$ non constant et $a \in \mathbb{R}$.

    **1.** On suppose $Q$ scindé à racines simples sur $\mathbb{R}$. En appliquant le théorème de Rolle à la fonction $f : x \mapsto \mathrm{e}^{ax}Q(x)$ et en étudiant $f$ au voisinage de $\pm\infty$, montrer que $Q' + aQ$ est scindé à racines simples sur $\mathbb{R}$.

    **2.** Montrer que le résultat subsiste si $Q$ est seulement supposé scindé sur $\mathbb{R}$, sans hypothèse sur les multiplicités.

    **3.** L'analogue de la question 1 est-il vrai pour $a \in \mathbb{C}$ ? On pourra chercher un complexe $a$ tel que $Q' + aQ$ ait une racine double, pour $Q = X^{2} - 1$.
  corrige: |
    **1.** Soit $a_{1} < \cdots < a_{n}$ les racines de $Q$, et $f(x) = \mathrm{e}^{ax}Q(x)$, de dérivée $f'(x) = \mathrm{e}^{ax}(Q' + aQ)(x)$. Le théorème de Rolle donne une racine de $Q' + aQ$ dans chaque $]a_{i}, a_{i + 1}[$, soit $n - 1$ racines distinctes. Si $a = 0$, c'est fini, car $\deg Q' = n - 1$. Si $a > 0$, alors $f(x) \to 0$ en $-\infty$ par croissances comparées, et $f(a_{1}) = 0$ ; la fonction $f$, non identiquement nulle sur $]-\infty, a_{1}[$, y atteint un extremum, où $f'$ s'annule : on obtient une $n$-ième racine, distincte des autres. Si $a < 0$, on raisonne de même sur $]a_{n}, +\infty[$. Dans ces deux cas, $Q' + aQ$ est de degré $n$ et a $n$ racines réelles distinctes. 
    $$\boxed{Q' + aQ \text{ est simplement scindé sur } \mathbb{R}}$$

    **2.** Si $Q$ a les racines distinctes $a_{1} < \cdots < a_{r}$, de multiplicités $m_{i}$, alors $a_{i}$ est racine de $Q' + aQ$ de multiplicité exactement $m_{i} - 1$, car $(X - a_{i})^{m_{i} - 1}$ divise $Q'$ et $Q$, et le quotient ne s'annule pas en $a_{i}$. Rolle donne $r - 1$ racines dans les intervalles, et une de plus à l'infini si $a \neq 0$, comme en 1. Au total, $\sum(m_{i} - 1) + (r - 1) + 1 = n = \deg(Q' + aQ)$ racines comptées avec multiplicité.

    **3.** Non. Pour $Q = X^{2} - 1$ et $a = \mathrm{i}$, on obtient $Q' + aQ = \mathrm{i} X^{2} + 2X - \mathrm{i} = \mathrm{i}(X - \mathrm{i})^{2}$, qui a une racine double.
- id: "ma-13-28"
  feuille: "f-ma-13"
  numero: 28
  partie: "Arithmétique dans $\\mathbb{K}[X]$"
  etoiles: 1
  types: [Calcul]
  mots_cles: [arithmétique des polynômes, PGCD et Bézout, "racines de l'unité"]
  noeuds: [pol-principal]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 9
  enonce: |
    **1.** Calculer par l'algorithme d'Euclide le PGCD des polynômes $X^{4} + X^{3} - 3X^{2} - 4X - 4$ et $X^{4} + X^{3} - X^{2} - 2X - 2$.

    **2.** Soit $n \geqslant 1$. Déterminer le PGCD de $X^{n} - 1$ et de $(X - 1)^{n}$.
  corrige: |
    **1.** Avec $A = X^{4} + X^{3} - 3X^{2} - 4X - 4$ et $B = X^{4} + X^{3} - X^{2} - 2X - 2$, la première division donne $A = B \times 1 - 2(X^{2} + X + 1)$, puis $B = (X^{2} + X + 1)(X^{2} - 2)$, de reste nul. 
    $$\boxed{A \wedge B = X^{2} + X + 1}$$

    **2.** Le seul facteur irréductible unitaire de $(X - 1)^{n}$ est $X - 1$, et $X^{n} - 1$ en est divisible exactement une fois, puisque ses racines sont simples (proposition 17). 
    $$\boxed{(X^{n} - 1) \wedge (X - 1)^{n} = X - 1}$$
- id: "ma-13-29"
  feuille: "f-ma-13"
  numero: 29
  partie: "Arithmétique dans $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [arithmétique des polynômes]
  noeuds: [pol-principal]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    On pose $A = X^{4} - X^{3} - X^{2} - X - 2$ et $B = X^{3} - 7X - 6$. Résoudre les équations suivantes, d'inconnue $(U, V) \in \mathbb{R}[X]^{2}$.

    **1.** $AU + BV = 1$.

    **2.** $AU + BV = X^{2} + 4X + 3$.

    **3.** $(X^{2} + 2X + 3)\,U + (X^{2} - X - 3)\,V = 0$.

    **4.** $X^{2}U + (2X + 1)\,V = X + 2$.
  corrige: |
    On factorise : $A = (X + 1)(X - 2)(X^{2} + 1)$ et $B = (X + 1)(X - 3)(X + 2)$, donc $A \wedge B = X + 1$. On note $A_{1} = \frac{A}{X + 1} = X^{3} - 2X^{2} + X - 2$ et $B_{1} = \frac{B}{X + 1} = X^{2} - X - 6$, premiers entre eux.

    **(i)** $A \wedge B = X + 1$ divise $AU + BV$, mais pas $1$. 
    $$\boxed{\text{aucune solution}}$$

    **(ii)** En divisant par $X + 1$, l'équation équivaut à $A_{1}U + B_{1}V = X + 3$. L'algorithme d'Euclide donne $A_{1} = (X - 1)B_{1} + (6X - 8)$ et $B_{1} = \big(\frac{X}{6} + \frac{1}{18}\big)(6X - 8) - \frac{50}{9}$, et la remontée fournit la solution particulière 
    $$U_{0} = \frac{13X + 21}{100}, \qquad V_{0} = -\frac{13X^{2} + 8X + 57}{100}.$$
     Si $(U, V)$ est solution, $A_{1}(U - U_{0}) = -B_{1}(V - V_{0})$, et le lemme de Gauss donne $B_{1} \mid U - U_{0}$. 
    $$\boxed{U = \frac{13X + 21}{100} + (X^{2} - X - 6)C, \qquad C \in \mathbb{R}[X]}$$

    $$\boxed{V = -\frac{13X^{2} + 8X + 57}{100} - (X^{3} - 2X^{2} + X - 2)C}$$

    **(iii)** Les deux trinômes ont des discriminants $-8$ et $13$, et aucune racine commune : ils sont premiers entre eux. Le lemme de Gauss donne $X^{2} - X - 3 \mid U$. 
    $$\boxed{U = (X^{2} - X - 3)C, \qquad V = -(X^{2} + 2X + 3)C, \quad C \in \mathbb{R}[X]}$$

    **(iv)** La relation de Bézout $4X^{2} + (1 - 2X)(2X + 1) = 1$, multipliée par $X + 2$, donne une solution particulière, et l'on conclut comme en (iii). 
    $$\boxed{U = 4(X + 2) + (2X + 1)C, \qquad V = (1 - 2X)(X + 2) - X^{2}C, \quad C \in \mathbb{R}[X]}$$
- id: "ma-13-30"
  feuille: "f-ma-13"
  numero: 30
  partie: "Arithmétique dans $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [arithmétique des polynômes, PGCD et Bézout, "racines de l'unité"]
  noeuds: [pol-principal]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Pour $n \in \mathbb{N}^{*}$, on note $P_{n} = X^{n} - 1$.

    **1.** Soit $n, m \in \mathbb{N}^{*}$. Montrer que $P_{n} \wedge P_{m} = P_{n \wedge m}$. On pourra s'inspirer de l'exercice 56 de la feuille du chapitre 12.

    **2.** En déduire que $a$ divise $b$ si et seulement si $P_{a}$ divise $P_{b}$.

    **3.** Soit $p, q \geqslant 2$ premiers entre eux. Montrer que $(X^{p} - 1)(X^{q} - 1)$ divise $(X - 1)(X^{pq} - 1)$.
  corrige: |
    **1.** Si $n = qm + r$, alors $X^{n} - 1 = X^{r}(X^{qm} - 1) + (X^{r} - 1)$, et $X^{m} - 1$ divise $X^{qm} - 1$ : le reste de $P_{n}$ par $P_{m}$ est $P_{r}$. Comme à l'exercice 55 de la feuille 12, l'algorithme d'Euclide sur $(P_{n}, P_{m})$ suit celui sur $(n, m)$, et s'arrête sur $(P_{d}, P_{0}) = (P_{d}, 0)$ avec $d = n \wedge m$. 
    $$\boxed{P_{n} \wedge P_{m} = X^{n \wedge m} - 1}$$

    **2.** Si $a \mid b$, alors $P_{a} \mid P_{b}$. Réciproquement, si $P_{a} \mid P_{b}$, alors $P_{a} = P_{a} \wedge P_{b} = P_{a \wedge b}$, donc $a = a \wedge b$ par les degrés, et $a \mid b$.

    **3.** Les racines de $(X^{p} - 1)(X^{q} - 1)$ sont : $1$, double ; les racines $p$-ièmes et $q$-ièmes de l'unité différentes de $1$, simples, et distinctes entre elles puisque $P_{p} \wedge P_{q} = X - 1$. Ce sont des racines $pq$-ièmes de l'unité, donc des racines simples de $X^{pq} - 1$, et $1$ est racine double de $(X - 1)(X^{pq} - 1)$. La proposition 16 (i) conclut. 
    $$\boxed{(X^{p} - 1)(X^{q} - 1) \mid (X - 1)(X^{pq} - 1)}$$
- id: "ma-13-31"
  feuille: "f-ma-13"
  numero: 31
  partie: "Arithmétique dans $\\mathbb{K}[X]$"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [arithmétique des polynômes]
  noeuds: [pol-principal]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $A$ et $B$ deux polynômes non constants. Montrer que $A$ et $B$ ont un diviseur commun non constant si et seulement s'il existe deux polynômes $P$ et $Q$ non nuls, avec $\deg P < \deg B$ et $\deg Q < \deg A$, tels que $AP = BQ$.
  corrige: |
    Si $D$ est un diviseur commun non constant, $A = DA_{1}$ et $B = DB_{1}$, et $P = B_{1}$, $Q = A_{1}$ conviennent : $AB_{1} = DA_{1}B_{1} = BA_{1}$, avec $\deg B_{1} < \deg B$ et $\deg A_{1} < \deg A$. Réciproquement, si $AP = BQ$ et si $A \wedge B = 1$, le lemme de Gauss donne $B \mid P$, ce qui est impossible puisque $P \neq 0$ et $\deg P < \deg B$. 
    $$\boxed{\text{diviseur commun non constant} \iff \exists P, Q \text{ non nuls}, \ AP = BQ, \ \deg P < \deg B, \ \deg Q < \deg A}$$
- id: "ma-13-32"
  feuille: "f-ma-13"
  numero: 32
  partie: "Arithmétique dans $\\mathbb{K}[X]$"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [arithmétique des polynômes]
  noeuds: [pol-principal]
  notions: [pgcd]
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Soit $p \in \mathbb{N}^{*}$.

    **1.** Montrer qu'il existe un unique couple $(U, V) \in \mathbb{R}[X]^{2}$ tel que $(1 - X)^{p}U + X^{p}V = 1$ et $\deg U < p$.

    **2.** Que peut-on dire de $\deg V$ ? En déduire que $V(X) = U(1 - X)$.

    **3.** Montrer qu'il existe $a \in \mathbb{R}$ tel que $(1 - X)U' - pU = aX^{p - 1}$, et en déduire les coefficients de $U$.
  corrige: |
    **1.** *Existence.* Les polynômes $(1 - X)^{p}$ et $X^{p}$ n'ont pas de racine commune : ils sont premiers entre eux, et le théorème 8 donne $U_{0}$, $V_{0}$. On divise $U_{0} = X^{p}S + U$ avec $\deg U < p$ : alors 
    $$(1 - X)^{p}U + X^{p}\big(V_{0} + (1 - X)^{p}S\big) = 1.$$
     *Unicité.* Si $(U, V)$ et $(U', V')$ conviennent, $(1 - X)^{p}(U - U') = X^{p}(V' - V)$, donc $X^{p} \mid U - U'$ par le lemme de Gauss, et $\deg(U - U') < p$ donne $U = U'$, puis $V = V'$.

    **2.** On a $X^{p}V = 1 - (1 - X)^{p}U$, de degré au plus $2p - 1$, donc $\deg V \leqslant p - 1$. En substituant $1 - X$ à $X$, on obtient $X^{p}U(1 - X) + (1 - X)^{p}V(1 - X) = 1$ : le couple $\big(V(1 - X), U(1 - X)\big)$ convient, avec $\deg V(1 - X) < p$. Par unicité, $U = V(1 - X)$. 
    $$\boxed{V(X) = U(1 - X)}$$

    **3.** En dérivant l'égalité de la question 1 et en regroupant : 
    $$(1 - X)^{p - 1}\big((1 - X)U' - pU\big) = -X^{p - 1}(pV + XV').$$
     Donc $X^{p - 1}$ divise $(1 - X)^{p - 1}\big((1 - X)U' - pU\big)$, et, par le lemme de Gauss, il divise $(1 - X)U' - pU$, qui est de degré au plus $p - 1$ : ce polynôme vaut $aX^{p - 1}$. Avec $U = \sum_{k = 0}^{p - 1} u_{k}X^{k}$, le coefficient de $X^{k}$ pour $k \leqslant p - 2$ donne $(k + 1)u_{k + 1} - (k + p)u_{k} = 0$, et $u_{0} = U(0) = 1$ en évaluant la relation de la question 1 en $0$. 
    $$\boxed{U = \sum_{k = 0}^{p - 1} \binom{p - 1 + k}{k} X^{k}}$$
     Vérification pour $p = 2$ : $U = 1 + 2X$, $V = 3 - 2X$, et $(1 - X)^{2}(1 + 2X) + X^{2}(3 - 2X) = 1$. ✓
- id: "ma-13-33"
  feuille: "f-ma-13"
  numero: 33
  partie: "Polynômes irréductibles de $\\mathbb{C}[X]$ et de $\\mathbb{R}[X]$"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [polynômes irréductibles, racines, polynôme dérivé, PGCD et Bézout, factorisation, polynômes complexes]
  noeuds: [pol-irreductibles, c-dalembert, pol-racines, pol-derivee, pol-principal]
  notions: [polynome-irreductible, derivee-formelle, pgcd]
  page_enonce: 6
  page_corrige: 11
  enonce: |
    **1.** Soit $P \in \mathbb{C}[X]$ non constant. Montrer que $P$ n'a que des racines simples si et seulement si $P \wedge P' = 1$.

    **2.** Factoriser dans $\mathbb{C}[X]$, puis dans $\mathbb{R}[X]$, les polynômes suivants : 
    $$\text{(i) } X^{4} - 4 ; \qquad \text{(ii) } X^{6} + 27 ; \qquad \text{(iii) } (X^{2} - X + 1)^{2} + 1 ; \qquad \text{(iv) } X^{8} - 1.$$
  corrige: |
    **1.** Une racine multiple de $P$ est une racine commune à $P$ et $P'$ (proposition 12), et réciproquement. Par la proposition 16 (ii), $P$ et $P'$ sont premiers entre eux si et seulement s'ils n'ont pas de racine commune.

    **2.** On applique la méthode de la section 13.7 : factorisation sur $\mathbb{C}$, puis regroupement des racines conjuguées.

    **(i)** $X^{4} - 4 = (X^{2} - 2)(X^{2} + 2)$. 
    $$\boxed{\mathbb{C} : (X - \sqrt{2})(X + \sqrt{2})(X - \mathrm{i}\sqrt{2})(X + \mathrm{i}\sqrt{2}) ; \qquad \mathbb{R} : (X - \sqrt{2})(X + \sqrt{2})(X^{2} + 2)}$$

    **(ii)** Les racines de $X^{6} = -27 = 27\,\mathrm{e}^{\mathrm{i}\pi}$ sont les $\sqrt{3}\,\mathrm{e}^{\mathrm{i}(2k + 1)\pi/6}$, $0 \leqslant k \leqslant 5$, soit $\pm \mathrm{i}\sqrt{3}$ et $\pm\frac{3}{2} \pm \mathrm{i}\frac{\sqrt{3}}{2}$. En regroupant les conjuguées, $X^{2} - 2\operatorname{Re}(z)X + |z|^{2}$ avec $|z|^{2} = 3$ : 
    $$\boxed{\mathbb{R} : (X^{2} + 3)(X^{2} - 3X + 3)(X^{2} + 3X + 3)}$$

    **(iii)** $(X^{2} - X + 1)^{2} + 1 = (X^{2} - X + 1 - \mathrm{i})(X^{2} - X + 1 + \mathrm{i})$, et les racines de ces deux trinômes sont $\mathrm{i}$, $1 - \mathrm{i}$ pour le premier, $-\mathrm{i}$, $1 + \mathrm{i}$ pour le second. 
    $$\boxed{\mathbb{C} : (X - \mathrm{i})(X + \mathrm{i})(X - 1 - \mathrm{i})(X - 1 + \mathrm{i}) ; \qquad \mathbb{R} : (X^{2} + 1)(X^{2} - 2X + 2)}$$

    **(iv)** Les racines sont les huit racines huitièmes de l'unité $\mathrm{e}^{\mathrm{i} k\pi/4}$. 
    $$\boxed{\mathbb{R} : (X - 1)(X + 1)(X^{2} + 1)(X^{2} - \sqrt{2}X + 1)(X^{2} + \sqrt{2}X + 1)}$$
- id: "ma-13-34"
  feuille: "f-ma-13"
  numero: 34
  partie: "Polynômes irréductibles de $\\mathbb{C}[X]$ et de $\\mathbb{R}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [polynômes irréductibles, racines, multiplicité, factorisation]
  noeuds: [pol-irreductibles, c-dalembert, pol-racines, pol-derivee]
  notions: [polynome-irreductible, multiplicite-racine]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    Factoriser dans $\mathbb{R}[X]$ les polynômes suivants.

    **1.** $X^{4} - 6X^{3} + 9X^{2} + 9$, que l'on écrira comme une somme de deux carrés.

    **2.** $X^{9} + X^{6} + X^{3} + 1$, en posant $Y = X^{3}$.

    **3.** $X^{10} + X^{5} + 1$, en remarquant que $(X^{5} - 1)(X^{10} + X^{5} + 1) = X^{15} - 1$.

    **4.** $X^{5} - 10X^{4} + 25X^{3} - 25X^{2} + 10X - 1$, dont on cherchera une racine multiple évidente.
  corrige: |
    **(i)** On a $P = (X^{2} - 3X)^{2} + 9 = (X^{2} - 3X + 3\mathrm{i})(X^{2} - 3X - 3\mathrm{i})$ sur $\mathbb{C}$. Pour obtenir directement la factorisation réelle, on fait apparaître une différence de deux carrés : pour tout réel $t$, 
    $$P = (X^{2} - 3X + t)^{2} - \big(2tX^{2} - 6tX + t^{2} - 9\big),$$
     et le trinôme entre parenthèses est le triple d'un carré pour $t = 6$ : $12X^{2} - 36X + 27 = 3(2X - 3)^{2}$. Ainsi 
    $$\boxed{P = \big(X^{2} - (3 + 2\sqrt{3})X + 6 + 3\sqrt{3}\big)\big(X^{2} - (3 - 2\sqrt{3})X + 6 - 3\sqrt{3}\big)}$$
     Les deux trinômes ont pour discriminant $-3$ : ils sont irréductibles dans $\mathbb{R}[X]$.

    **(ii)** Avec $Y = X^{3}$, $Y^{3} + Y^{2} + Y + 1 = (Y + 1)(Y^{2} + 1)$, donc $P = (X^{3} + 1)(X^{6} + 1)$. Puis $X^{3} + 1 = (X + 1)(X^{2} - X + 1)$ et $X^{6} + 1 = (X^{2} + 1)(X^{4} - X^{2} + 1)$, avec $X^{4} - X^{2} + 1 = (X^{2} + 1)^{2} - 3X^{2}$. 
    $$\boxed{P = (X + 1)(X^{2} - X + 1)(X^{2} + 1)(X^{2} - \sqrt{3}X + 1)(X^{2} + \sqrt{3}X + 1)}$$

    **(iii)** Les racines de $X^{10} + X^{5} + 1 = \frac{X^{15} - 1}{X^{5} - 1}$ sont les racines quinzièmes de l'unité qui ne sont pas racines cinquièmes, soit les $\mathrm{e}^{2\mathrm{i} k\pi/15}$ avec $k \in [\![1\,;14]\!]$ non multiple de $3$, toutes simples. On les regroupe par paires $k$, $15 - k$, avec $k \in \{1, 2, 4, 5, 7\}$ ; pour $k = 5$, on obtient $X^{2} + X + 1$. 
    $$\boxed{X^{10} + X^{5} + 1 = (X^{2} + X + 1)\prod_{k \in \{1, 2, 4, 7\}} \Big(X^{2} - 2\cos\frac{2k\pi}{15}\,X + 1\Big)}$$

    **(iv)** On a $P(1) = 0$, et l'on vérifie que $P'(1) = P''(1) = 0$ et $P'''(1) = 6 \times (-5) \neq 0$ : $1$ est racine triple. La division par $(X - 1)^{3}$ donne $X^{2} - 7X + 1$, de racines $\frac{7 \pm 3\sqrt{5}}{2}$. 
    $$\boxed{P = (X - 1)^{3}\Big(X - \frac{7 + 3\sqrt{5}}{2}\Big)\Big(X - \frac{7 - 3\sqrt{5}}{2}\Big)}$$
- id: "ma-13-35"
  feuille: "f-ma-13"
  numero: 35
  partie: "Polynômes irréductibles de $\\mathbb{C}[X]$ et de $\\mathbb{R}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [polynômes irréductibles, factorisation, polynômes complexes]
  noeuds: [pol-irreductibles, c-dalembert]
  notions: [polynome-irreductible]
  page_enonce: 6
  page_corrige: 12
  enonce: |
    On considère le polynôme $P = (1 - X^{2})^{3} + 8X^{3}$.

    **1.** Déterminer les solutions complexes de l'équation $\Big(\frac{1 - z^{2}}{2z}\Big)^{3} = -1$.

    **2.** En déduire la factorisation de $P$ dans $\mathbb{C}[X]$, puis dans $\mathbb{R}[X]$.
  corrige: |
    **1.** Le complexe $w = \frac{1 - z^{2}}{2z}$ vérifie $w^{3} = -1$, donc $w = -\omega$ avec $\omega \in \{1, j, j^{2}\}$, c'est-à-dire $z^{2} - 2\omega z - 1 = 0$, de discriminant réduit $\omega^{2} + 1$. Pour $\omega = 1$, on obtient $z = 1 \pm \sqrt{2}$. Pour $\omega = j$, $\omega^{2} + 1 = -j = \mathrm{e}^{-\mathrm{i}\pi/3}$, de racine carrée $\mathrm{e}^{-\mathrm{i}\pi/6}$, d'où $z = j \pm \mathrm{e}^{-\mathrm{i}\pi/6}$ ; et pour $\omega = j^{2}$, les conjugués. 
    $$\boxed{z \in \Big\{1 \pm \sqrt{2}, \ \frac{\sqrt{3} - 1}{2}(1 \pm \mathrm{i}), \ -\frac{\sqrt{3} + 1}{2}(1 \mp \mathrm{i})\Big\}}$$

    **2.** Comme $P(0) = 1$, les racines de $P$ sont exactement ces six complexes, et $P$ a pour coefficient dominant $-1$. En regroupant les conjuguées : 
    $$\boxed{P = -(X^{2} - 2X - 1)\big(X^{2} + (1 - \sqrt{3})X + 2 - \sqrt{3}\big)\big(X^{2} + (1 + \sqrt{3})X + 2 + \sqrt{3}\big)}$$
- id: "ma-13-36"
  feuille: "f-ma-13"
  numero: 36
  partie: "Polynômes irréductibles de $\\mathbb{C}[X]$ et de $\\mathbb{R}[X]$"
  etoiles: 2
  types: [Calcul]
  mots_cles: [polynômes irréductibles, factorisation, polynômes complexes]
  noeuds: [pol-irreductibles, c-dalembert]
  notions: [polynome-irreductible]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $a \in \,]0, \pi[$ et $n \in \mathbb{N}^{*}$. Factoriser $X^{2n} - 2\cos(na)X^{n} + 1$ dans $\mathbb{C}[X]$, puis dans $\mathbb{R}[X]$.
  corrige: |
    Le polynôme s'écrit $(X^{n} - \mathrm{e}^{\mathrm{i} na})(X^{n} - \mathrm{e}^{-\mathrm{i} na})$. Les racines de $X^{n} = \mathrm{e}^{\mathrm{i} na}$ sont les $\mathrm{e}^{\mathrm{i}(a + 2k\pi/n)}$, $0 \leqslant k \leqslant n - 1$, et celles de $X^{n} = \mathrm{e}^{-\mathrm{i} na}$ leurs conjuguées ; elles sont $2n$ et distinctes, puisque $\mathrm{e}^{\mathrm{i} na} \neq \mathrm{e}^{-\mathrm{i} na}$ pour $a \in \,]0, \pi[$ sauf si $na \in \pi\mathbb{Z}$, cas où les deux familles coïncident et la factorisation reste valable avec des racines doubles. 
    $$\boxed{\mathbb{C} : \prod_{k = 0}^{n - 1} \big(X - \mathrm{e}^{\mathrm{i}(a + 2k\pi/n)}\big)\big(X - \mathrm{e}^{-\mathrm{i}(a + 2k\pi/n)}\big) ; \qquad \mathbb{R} : \prod_{k = 0}^{n - 1} \Big(X^{2} - 2\cos\Big(a + \frac{2k\pi}{n}\Big)X + 1\Big)}$$
     Un facteur réel est irréductible sauf si $a + \frac{2k\pi}{n} \in \pi\mathbb{Z}$, auquel cas il vaut $(X \mp 1)^{2}$.
- id: "ma-13-37"
  feuille: "f-ma-13"
  numero: 37
  partie: "Polynômes irréductibles de $\\mathbb{C}[X]$ et de $\\mathbb{R}[X]$"
  etoiles: 3
  types: [Calcul]
  mots_cles: [polynômes irréductibles, factorisation]
  noeuds: [pol-irreductibles, c-dalembert]
  notions: [polynome-irreductible]
  page_enonce: 6
  page_corrige: 13
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $a \in \mathbb{R}$.

    **1.** Résoudre l'équation $(z + 1)^{n} = \mathrm{e}^{2\mathrm{i} na}$, d'inconnue $z \in \mathbb{C}$.

    **2.** En déduire une factorisation du polynôme $(X + 1)^{n} - \mathrm{e}^{2\mathrm{i} na}$.

    **3.** En évaluant en $0$, en déduire la valeur du produit $\prod_{k = 0}^{n - 1} \sin\Big(a + \frac{k\pi}{n}\Big)$.
  corrige: |
    **1.** On a $z + 1 = \mathrm{e}^{2\mathrm{i}(a + k\pi/n)}$, $0 \leqslant k \leqslant n - 1$, d'où 
    $$z_{k} = \mathrm{e}^{2\mathrm{i}\theta_{k}} - 1 = 2\mathrm{i}\sin\theta_{k}\,\mathrm{e}^{\mathrm{i}\theta_{k}}, \qquad \theta_{k} = a + \frac{k\pi}{n}.$$

    **2.** Ces $n$ racines sont distinctes, et le polynôme est unitaire de degré $n$ : 
    $$(X + 1)^{n} - \mathrm{e}^{2\mathrm{i} na} = \prod_{k = 0}^{n - 1} (X - z_{k}).$$

    **3.** En évaluant en $0$, on obtient 
    $$1 - \mathrm{e}^{2\mathrm{i} na} = (-1)^{n}\prod_{k} z_{k},$$
     dont le membre de gauche vaut $-2\mathrm{i}\sin(na)\,\mathrm{e}^{\mathrm{i} na}$. Comme $\sum \theta_{k} = na + \frac{(n - 1)\pi}{2}$, le membre de droite vaut 
    $$(-2\mathrm{i})^{n}\mathrm{e}^{\mathrm{i} na}\mathrm{i}^{n - 1}\prod_{k}\sin\theta_{k} = -2^{n}\mathrm{i}\,\mathrm{e}^{\mathrm{i} na}\prod_{k}\sin\theta_{k},$$
     puisque $(-\mathrm{i})^{n}\mathrm{i}^{n - 1} = (-1)^{n}\mathrm{i}^{2n - 1} = -\mathrm{i}$. 
    $$\boxed{\prod_{k = 0}^{n - 1} \sin\Big(a + \frac{k\pi}{n}\Big) = \frac{\sin(na)}{2^{n - 1}}}$$
     Pour $n = 2$, on retrouve $\sin a \cos a = \frac{\sin 2a}{2}$. ✓
