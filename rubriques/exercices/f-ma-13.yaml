  page_enonce: 9
  page_corrige: 18
  enonce: |
    **1.** Montrer qu'il n'existe aucun polynôme $P \in \mathbb{R}[X]$ tel que $\frac{P'}{P} = \frac{X^{2} + 1}{X^{3} - 1}$.

    **2.** Déterminer les polynômes $P \in \mathbb{R}[X]$ tels que $\frac{P'}{P} = \frac{2}{X - 1} + \frac{3}{X}$.
  corrige: |
    **1.** Par la proposition 24, $\frac{P'}{P}$ n'a que des pôles simples, et ses coefficients sont les multiplicités des racines, donc des entiers. Or le coefficient de $\frac{1}{X - 1}$ dans $\frac{X^{2} + 1}{X^{3} - 1}$ vaut $\frac{2}{3}$. 
    $$\boxed{\text{aucun polynôme ne convient}}$$

    **2.** La décomposition donnée impose les racines $1$ et $0$, de multiplicités $2$ et $3$, et aucune autre : $P = \lambda(X - 1)^{2}X^{3}$, et réciproquement ces polynômes conviennent. 
    $$\boxed{P = \lambda X^{3}(X - 1)^{2}, \quad \lambda \in \mathbb{R}^{*}}$$
- id: "ma-13-53"
  feuille: "f-ma-13"
  numero: 53
  partie: "Décomposition en éléments simples"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [décomposition en éléments simples, degré, racines, polynômes de Tchebychev, fractions rationnelles]
  noeuds: [a-fractions, pol-anneau, pol-racines]
  notions: [corps-fractions]
  page_enonce: 9
  page_corrige: 18
  enonce: |
    *Polynômes de Tchebychev.*

    **1.** Montrer que, pour tout $n \in \mathbb{N}$, il existe un unique $T_{n} \in \mathbb{R}[X]$ tel que $T_{n}(\cos\theta) = \cos(n\theta)$ pour tout réel $\theta$. On pourra établir une relation entre $T_{n + 2}$, $T_{n + 1}$ et $T_{n}$.

    **2.** Pour $n \geqslant 1$, déterminer le degré, le coefficient dominant et les racines de $T_{n}$.

    **3.** Décomposer $\frac{1}{T_{n}}$ en éléments simples sur $\mathbb{R}$.
  corrige: |
    **1.** La formule $\cos((n + 2)\theta) + \cos(n\theta) = 2\cos\theta\cos((n + 1)\theta)$ (chapitre 4) suggère de poser $T_{0} = 1$, $T_{1} = X$ et $T_{n + 2} = 2XT_{n + 1} - T_{n}$ ; une récurrence double montre que ces polynômes conviennent. L'unicité vient du théorème 3 : deux tels polynômes coïncident sur $[-1, 1]$, qui est infini.

    **2.** Par récurrence, $T_{n}$ est de degré $n$, de coefficient dominant $2^{n - 1}$ pour $n \geqslant 1$. L'équation $\cos(n\theta) = 0$ donne les $n$ racines distinctes $x_{k} = \cos\theta_{k}$, avec $\theta_{k} = \frac{(2k + 1)\pi}{2n}$, $0 \leqslant k \leqslant n - 1$, qui sont donc toutes les racines.

    **3.** Les pôles sont simples. En dérivant $T_{n}(\cos\theta) = \cos(n\theta)$, on obtient $T_{n}'(\cos\theta) = \frac{n\sin(n\theta)}{\sin\theta}$, et $\sin(n\theta_{k}) = (-1)^{k}$. La proposition 23 donne : 
    $$\boxed{\frac{1}{T_{n}} = \frac{1}{n}\sum_{k = 0}^{n - 1} \frac{(-1)^{k}\sin\theta_{k}}{X - \cos\theta_{k}}, \qquad \theta_{k} = \frac{(2k + 1)\pi}{2n}}$$
     Pour $n = 2$, on a $T_{2} = 2X^{2} - 1$, et la formule donne bien 
    $$\frac{1}{2}\Big(\frac{\sin(\pi/4)}{X - \cos(\pi/4)} - \frac{\sin(3\pi/4)}{X - \cos(3\pi/4)}\Big) = \frac{\sqrt{2}}{4}\Big(\frac{1}{X - \frac{\sqrt{2}}{2}} - \frac{1}{X + \frac{\sqrt{2}}{2}}\Big) = \frac{1}{2X^{2} - 1}. \checkmark$$
- id: "ma-13-54"
  feuille: "f-ma-13"
  numero: 54
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [degré, division euclidienne, racines, multiplicité, polynôme dérivé, PGCD et Bézout, factorisation, polynômes complexes]
  noeuds: [pol-anneau, pol-division, pol-racines, pol-derivee, pol-principal, pol-irreductibles, c-dalembert, cx-exponentielle, a-fractions]
  notions: [multiplicite-racine, derivee-formelle, pgcd, polynome-irreductible, corps-fractions]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Vrai ou faux ?* Justifier chaque réponse par une démonstration ou un contre-exemple.

    **1.** Le degré de $P + Q$ est le plus grand des degrés de $P$ et de $Q$.

    **2.** Tout polynôme de $\mathbb{R}[X]$ de degré impair possède au moins une racine réelle.

    **3.** Un polynôme de $\mathbb{R}[X]$ sans racine réelle est irréductible dans $\mathbb{R}[X]$.

    **4.** Si $a$ est racine double de $P$, alors $a$ est racine simple de $P'$.

    **5.** Deux polynômes de $\mathbb{C}[X]$ sans racine commune sont premiers entre eux.

    **6.** Le reste de la division euclidienne de $P$ par $X^{2} - 1$ est $P(1)X + P(-1)$.

    **7.** Tout polynôme de $\mathbb{C}[X]$ de degré $n \geqslant 1$ possède exactement $n$ racines distinctes.

    **8.** La partie entière de $\frac{X^{3} + 1}{X^{2} + 1}$ est $X$.

    **9.** Si $a$ est un pôle simple de $F = \frac{P}{Q}$, sous forme irréductible, le coefficient de $\frac{1}{X - a}$ dans la décomposition de $F$ est $\frac{P(a)}{Q'(a)}$.

    **10.** Pour tout $n \in \mathbb{N}^{*}$, le polynôme $X^{n} - 1$ n'a que des racines simples dans $\mathbb{C}$.
  corrige: |
    **1. **Fausse**.** Les termes dominants peuvent se compenser : $(X^{2} + X) + (-X^{2})$ est de degré $1$. Seule l'inégalité $\deg(P + Q) \leqslant \max(\deg P, \deg Q)$ est vraie (proposition 3).

    **2. **Vraie**.** Les racines non réelles vont par paires de conjuguées de même multiplicité (proposition 18) : leur nombre total est pair, donc il reste au moins une racine réelle. C'est aussi la proposition 13 du chapitre 8.

    **3. **Fausse**.** $X^{4} + 1 = (X^{2} - \sqrt{2}X + 1)(X^{2} + \sqrt{2}X + 1)$ n'a pas de racine réelle.

    **4. **Vraie**.** Par la proposition 12, $P'(a) = 0$ et $P''(a) \neq 0$, donc $a$ est racine simple de $P'$.

    **5. **Vraie**.** C'est la proposition 16 (ii).

    **6. **Fausse**.** Le reste $\alpha X + \beta$ vérifie $\alpha + \beta = P(1)$ et $-\alpha + \beta = P(-1)$, donc il vaut 
    $$\frac{P(1) - P(-1)}{2}X + \frac{P(1) + P(-1)}{2}.$$
     Pour $P = X$, la formule proposée donnerait $X - 1$ au lieu de $X$.

    **7. **Fausse**.** Le nombre de racines est $n$ seulement si on les compte avec leur multiplicité : $X^{2}$ n'a que la racine $0$.

    **8. **Vraie**.** $X^{3} + 1 = X(X^{2} + 1) + (1 - X)$, et le reste est de degré $1 < 2$ (proposition 22).

    **9. **Vraie**.** C'est la proposition 23.

    **10. **Vraie**.** Les $n$ racines $n$-ièmes de l'unité sont distinctes, et elles sont toutes les racines (proposition 17). On peut aussi invoquer l'exercice 33 : $(X^{n} - 1) \wedge nX^{n - 1} = 1$. 
    $$\boxed{\text{vraies : 2, 4, 5, 8, 9, 10 ; \quad fausses : 1, 3, 6, 7}}$$
- id: "ma-13-55"
  feuille: "f-ma-13"
  numero: 55
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [coefficients binomiaux, polynômes à coefficients entiers]
  noeuds: [pol-binome, pol-anneau]
  notions: [anneau-polynomes, coefficient-binomial]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    *Coefficients binomiaux impairs.* Pour deux polynômes $A$ et $B$ à coefficients entiers, on note $A \equiv B \;[2]$ lorsque tous les coefficients de $A - B$ sont pairs, c'est-à-dire lorsque $A - B = 2E$, où $E$ est un polynôme à coefficients entiers.

    **1.** Soit $A$, $B$, $C$, $D$ des polynômes à coefficients entiers tels que $A \equiv B \;[2]$ et $C \equiv D \;[2]$. Montrer que $AC \equiv BD \;[2]$.

    **2.** Montrer que, pour tout $k \in \mathbb{N}$, on a $(1 + X)^{2^{k}} \equiv 1 + X^{2^{k}} \;[2]$.

    **3.** Soit $n \in \mathbb{N}^{*}$, dont l'écriture en base $2$ (exercice 7 de la feuille du chapitre 12) est 
    $$n = 2^{k_{1}} + 2^{k_{2}} + \cdots + 2^{k_{s}}, \qquad k_{1} > k_{2} > \cdots > k_{s} \geqslant 0.$$
     Montrer que 
    $$(1 + X)^{n} \equiv \prod_{i = 1}^{s} \big(1 + X^{2^{k_{i}}}\big) \;[2],$$
     puis que le développement de ce produit est une somme de $2^{s}$ monômes $X^{e}$ d'exposants deux à deux distincts, tous de coefficient $1$.

    **4.** En déduire que le nombre d'entiers $k \in [\![0\,;n]\!]$ tels que $\binom{n}{k}$ soit impair est égal à $2^{s}$. C'est en particulier une puissance de $2$.

    **5.** Combien la ligne d'indice $2026$ du triangle de Pascal contient-elle de coefficients impairs ? Pour quels entiers $n \in \mathbb{N}^{*}$ les coefficients $\binom{n}{k}$, $0 \leqslant k \leqslant n$, sont-ils tous impairs ?
  corrige: |
    **1.** On écrit $A - B = 2E$ et $C - D = 2F$, avec $E$ et $F$ à coefficients entiers. Alors 
    $$AC - BD = A(C - D) + (A - B)D = 2(AF + ED).$$
     Les coefficients d'un produit de polynômes sont des sommes de produits de coefficients (définition du produit, section 13.1), donc $AF + ED$ est à coefficients entiers, et $AC \equiv BD \;[2]$. On remarque aussi que la relation est transitive, puisqu'une somme de polynômes à coefficients pairs est à coefficients pairs.

    **2.** On raisonne par récurrence sur $k$, le cas $k = 0$ étant une égalité. Si $(1 + X)^{2^{k}} \equiv 1 + X^{2^{k}} \;[2]$, la question 1, appliquée avec $A = C = (1 + X)^{2^{k}}$ et $B = D = 1 + X^{2^{k}}$, donne 
    $$(1 + X)^{2^{k + 1}} \equiv \big(1 + X^{2^{k}}\big)^{2} = 1 + 2X^{2^{k}} + X^{2^{k + 1}} \equiv 1 + X^{2^{k + 1}} \;[2].$$

    **3.** Comme $(1 + X)^{n} = \prod_{i} (1 + X)^{2^{k_{i}}}$, la question 2 et la question 1, appliquée $s - 1$ fois, donnent la congruence annoncée. En développant le produit, on choisit dans chaque facteur le terme $1$ ou le terme $X^{2^{k_{i}}}$ : à chaque partie $I$ de $[\![1\,;s]\!]$ correspond le monôme $X^{e_{I}}$, avec $e_{I} = \sum_{i \in I} 2^{k_{i}}$, et 
    $$\prod_{i = 1}^{s} \big(1 + X^{2^{k_{i}}}\big) = \sum_{I \subset [\![1\,;s]\!]} X^{e_{I}}.$$
     Si $e_{I} = e_{J}$, les deux sommes sont deux écritures en base $2$ du même entier, donc $I = J$ par unicité de l'écriture. Les $2^{s}$ parties de $[\![1\,;s]\!]$ donnent ainsi $2^{s}$ exposants distincts, tous compris entre $0$ et $n$.

    **4.** Notons $\mathcal{E}$ l'ensemble des exposants $e_{I}$. D'après la question 3, le coefficient de $X^{k}$ dans le produit vaut $1$ si $k \in \mathcal{E}$ et $0$ sinon. La congruence de la question 3 dit que, pour tout $k \in [\![0\,;n]\!]$, l'entier $\binom{n}{k} - \mathbf{1}_{\mathcal{E}}(k)$ est pair : $\binom{n}{k}$ est impair si et seulement si $k \in \mathcal{E}$. 
    $$\boxed{\mathrm{card}\Big\{k \in [\![0\,;n]\!] \Bigm| \tbinom{n}{k} \text{ impair}\Big\} = 2^{s}, \quad s \text{ nombre de chiffres } 1 \text{ de } n \text{ en base } 2}$$

    **5.** On a $2026 = 2^{10} + 2^{9} + 2^{8} + 2^{7} + 2^{6} + 2^{5} + 2^{3} + 2^{1}$, qui comporte huit chiffres $1$ en base $2$. 
    $$\boxed{\text{la ligne } 2026 \text{ contient } 2^{8} = 256 \text{ coefficients impairs sur } 2027}$$
     Les coefficients sont tous impairs si et seulement si $2^{s} = n + 1$. Or $s$ puissances de $2$ distinctes ont une somme au moins égale à $2^{0} + 2^{1} + \cdots + 2^{s - 1} = 2^{s} - 1$, avec égalité seulement si ce sont exactement ces puissances. Donc $n \geqslant 2^{s} - 1$, avec égalité si et seulement si $\{k_{1}, \dots, k_{s}\} = [\![0\,;s - 1]\!]$. 
    $$\boxed{\text{tous les } \tbinom{n}{k} \text{ sont impairs} \iff n = 2^{s} - 1, \ s \in \mathbb{N}^{*}}$$
     On le vérifie sur les lignes $1$, $3$ et $7$ du triangle de Pascal : $1, 3, 3, 1$ et $1, 7, 21, 35, 35, 21, 7, 1$. À l'opposé, pour $n = 2^{s}$, seuls les deux coefficients extrêmes sont impairs.

    *À retenir.* La question 2 généralise la proposition 13 du chapitre 12 pour $p = 2$ : la congruence $(1 + X)^{2} \equiv 1 + X^{2}$ exprime que $2$ divise le coefficient binomial central de la ligne $2$, et l'élévation au carré répétée la propage aux puissances de $2$. Calculer « modulo $2$ » sur les coefficients d'un polynôme permet de lire d'un coup la parité de toute une ligne du triangle de Pascal.
- id: "ma-13-56"
  feuille: "f-ma-13"
  numero: 56
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sommes, "racines de l'unité", produits de distances]
  noeuds: [n-sommes, pol-racines, cx-exponentielle]
  notions: []
  page_enonce: 10
  page_corrige: 20
  enonce: |
    *Un point du cercle loin de tous les autres.* Soit $n \in \mathbb{N}^{*}$, $\Gamma$ un cercle du plan de centre $O$ et de rayon $R > 0$, et $A_{1}, \dots, A_{n}$ des points du plan, non nécessairement distincts. On veut montrer qu'il existe un point $M \in \Gamma$ tel que 
    $$MA_{1} \times MA_{2} \times \cdots \times MA_{n} \geqslant R^{n}.$$
     On identifie le plan à $\mathbb{C}$, le point $O$ ayant pour affixe $0$, et l'on note $a_{k}$ l'affixe de $A_{k}$. On pose 
    $$P = \prod_{k = 1}^{n} (X - a_{k}) = X^{n} + c_{n - 1}X^{n - 1} + \cdots + c_{1}X + c_{0}, \qquad N = n + 1 \qquad\text{et}\qquad \omega = \mathrm{e}^{2\mathrm{i}\pi/N}.$$

    **1.** Soit $m \in \mathbb{Z}$. Calculer $\sum_{j = 0}^{N - 1} \omega^{jm}$, en distinguant selon que $N$ divise $m$ ou non.

    **2.** Montrer que $\sum_{j = 0}^{N - 1} \omega^{-jn}\,P(R\omega^{j}) = NR^{n}$.

    **3.** En déduire qu'il existe $j \in [\![0\,;N - 1]\!]$ tel que $|P(R\omega^{j})| \geqslant R^{n}$, et conclure.

    **4.** Montrer que la constante $R^{n}$ ne peut pas être remplacée par un nombre strictement plus grand. Lorsque $A_{1}, \dots, A_{n}$ sont les sommets d'un polygone régulier inscrit dans $\Gamma$, déterminer la plus grande et la plus petite valeur du produit $MA_{1} \times \cdots \times MA_{n}$ lorsque $M$ parcourt $\Gamma$.
  corrige: |
    **1.** Si $N$ divise $m$, alors $\omega^{m} = 1$, et la somme vaut $N$. Sinon, $\omega^{m} \neq 1$ (chapitre 4), et la somme géométrique vaut 
    $$\sum_{j = 0}^{N - 1} (\omega^{m})^{j} = \frac{(\omega^{N})^{m} - 1}{\omega^{m} - 1} = 0.$$

    $$\boxed{\sum_{j = 0}^{N - 1} \omega^{jm} = N \text{ si } N \mid m, \qquad 0 \text{ sinon}}$$
     C'est le calcul de l'exercice 14, où l'on prenait $m = 1$ et $m = 2$.

    **2.** Avec $c_{n} = 1$, on a $P(R\omega^{j}) = \sum_{k = 0}^{n} c_{k}R^{k}\omega^{jk}$, et l'on intervertit les deux sommes finies : 
    $$\sum_{j = 0}^{N - 1} \omega^{-jn}P(R\omega^{j}) = \sum_{k = 0}^{n} c_{k}R^{k}\sum_{j = 0}^{N - 1} \omega^{j(k - n)}.$$
     Pour $0 \leqslant k \leqslant n - 1$, on a $1 \leqslant n - k \leqslant n < N$, donc $N$ ne divise pas $k - n$, et la somme intérieure est nulle d'après la question 1. Il ne reste que le terme $k = n$, qui vaut $c_{n}R^{n}N = NR^{n}$.

    **3.** Comme $|\omega^{-jn}| = 1$, l'inégalité triangulaire donne 
    $$NR^{n} \leqslant \sum_{j = 0}^{N - 1} |P(R\omega^{j})| \leqslant N\max_{0 \leqslant j \leqslant N - 1} |P(R\omega^{j})|,$$
     d'où un indice $j$ tel que $|P(R\omega^{j})| \geqslant R^{n}$. Le point $M$ d'affixe $R\omega^{j}$ est sur $\Gamma$, et 
    $$|P(R\omega^{j})| = \prod_{k = 1}^{n} |R\omega^{j} - a_{k}| = \prod_{k = 1}^{n} MA_{k}.$$

    $$\boxed{\exists M \in \Gamma, \quad MA_{1} \times \cdots \times MA_{n} \geqslant R^{n}}$$
     On a même trouvé $M$ parmi les sommets d'un polygone régulier à $n + 1$ côtés inscrit dans $\Gamma$, fixé à l'avance, indépendamment des points $A_{k}$.

    **4.** Si tous les points $A_{k}$ sont en $O$, le produit vaut $R^{n}$ pour tout $M \in \Gamma$ : aucune constante strictement plus grande ne convient. Supposons maintenant que les $A_{k}$ soient les sommets d'un polygone régulier inscrit, d'affixes $\lambda\zeta^{k}$, avec $\lambda = R\mathrm{e}^{\mathrm{i}\theta}$ et $\zeta = \mathrm{e}^{2\mathrm{i}\pi/n}$. En composant la factorisation de la proposition 17 avec $\frac{X}{\lambda}$ et en multipliant par $\lambda^{n}$, on obtient 
    $$P = \prod_{k = 0}^{n - 1} (X - \lambda\zeta^{k}) = X^{n} - \lambda^{n} = X^{n} - R^{n}\mathrm{e}^{\mathrm{i} n\theta}.$$
     Pour $|z| = R$, on a $|z^{n} - R^{n}\mathrm{e}^{\mathrm{i} n\theta}| \leqslant 2R^{n}$, avec égalité si et seulement si $z^{n} = -R^{n}\mathrm{e}^{\mathrm{i} n\theta}$, ce qui a lieu pour $z = R\mathrm{e}^{\mathrm{i}(\theta + \pi/n)}$ ; et le produit est nul aux sommets. 
    $$\boxed{\max_{M \in \Gamma} \prod_{k} MA_{k} = 2R^{n} \ \text{(milieux des arcs)}, \qquad \min_{M \in \Gamma} \prod_{k} MA_{k} = 0 \ \text{(sommets)}}$$

    *À retenir.* Le résultat géométrique est un énoncé sur les polynômes unitaires : un tel polynôme de degré $n$ ne peut pas être de module strictement inférieur à $R^{n}$ en tout point du cercle de rayon $R$, et $X^{n}$ montre que la borne est atteinte. L'exercice 60 établissait un phénomène analogue aux entiers $0, \dots, n$, avec la décomposition en éléments simples au lieu des racines de l'unité.
- id: "ma-13-57"
  feuille: "f-ma-13"
  numero: 57
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Calcul]
  mots_cles: [degré, racines, multiplicité, polynômes complexes]
  noeuds: [pol-anneau, pol-racines, pol-derivee, c-dalembert]
  notions: [multiplicite-racine]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    *Méthode de Cardan.* Soient $P(X) = X^{3} + pX + q \in \mathbb{C}[X]$ et $\alpha_{1}$, $\alpha_{2}$, $\alpha_{3}$ les racines de $P(X)$. On note $j = \mathrm{e}^{2\mathrm{i}\pi/3}$.

    **1.** Montrer qu'il existe un unique couple $(u, v) \in \mathbb{C}^{2}$ tel que $\alpha_{1} = u + v$, $\alpha_{2} = ju + j^{2}v$ et $\alpha_{3} = j^{2}u + jv$.

    **2.** En calculant $\alpha_{1}\alpha_{2}\alpha_{3}$ et $\alpha_{1}\alpha_{2} + \alpha_{2}\alpha_{3} + \alpha_{3}\alpha_{1}$, déterminer $uv$ et $u^{3} + v^{3}$.

    **3.** En déduire que $u^{3}$ et $v^{3}$ sont racines de $Q(X) = X^{2} + qX - \frac{p^{3}}{27}$.

    **4.** Donner une méthode pour calculer les racines de $P(X)$.

    **5.** Donner une méthode pour déterminer les racines d'un polynôme de degré $3$.

    **6.** À quelle condition le polynôme $X^{3} + pX + q$ a-t-il une racine multiple ?

    **7.** On suppose $p$ et $q$ dans $\mathbb{R}$. À quelle condition sur $p$ et $q$ les racines de $P$ sont-elles réelles ?
  corrige: |
    **1.** Comme $\alpha_{1} + \alpha_{2} + \alpha_{3} = 0$ (théorème 4) et $1 + j + j^{2} = 0$, on pose 
    $$u = \frac{\alpha_{1} + j^{2}\alpha_{2} + j\alpha_{3}}{3}, \qquad v = \frac{\alpha_{1} + j\alpha_{2} + j^{2}\alpha_{3}}{3},$$
     et l'on vérifie les trois égalités ; par exemple $u + v = \frac{2\alpha_{1} - \alpha_{2} - \alpha_{3}}{3} = \alpha_{1}$. L'unicité vient de ce que $u + v$ et $ju + j^{2}v$ déterminent $u$ et $v$, le déterminant $j^{2} - j$ étant non nul.

    **2.** En développant, $(u + v)(ju + j^{2}v)(j^{2}u + jv) = u^{3} + v^{3}$, et $\sigma_{2} = -3uv$. Le théorème 4 donne $\sigma_{3} = -q$ et $\sigma_{2} = p$. 
    $$\boxed{uv = -\frac{p}{3}, \qquad u^{3} + v^{3} = -q}$$

    **3.** Donc $u^{3} + v^{3} = -q$ et $u^{3}v^{3} = -\frac{p^{3}}{27}$ : ce sont les racines de $X^{2} + qX - \frac{p^{3}}{27}$ (chapitre 4, théorème 4).

    **4.** On calcule les racines $U$ et $V$ de $Q$, on choisit une racine cubique $u$ de $U$, puis $v = -\frac{p}{3u}$ (si $p \neq 0$) ; les racines sont $u + v$, $ju + j^{2}v$, $j^{2}u + jv$.

    **5.** Pour $aX^{3} + bX^{2} + cX + d$, on divise par $a$ et l'on pose $X = Y - \frac{b}{3a}$, ce qui supprime le terme en $Y^{2}$ : on est ramené à $Y^{3} + pY + q$.

    **6.** Une racine multiple $x$ annule $P' = 3X^{2} + p$, donc $x^{2} = -\frac{p}{3}$, et $P(x) = x(x^{2} + p) + q = \frac{2p}{3}x + q = 0$. Si $p \neq 0$, $x = -\frac{3q}{2p}$, et $x^{2} = -\frac{p}{3}$ s'écrit $27q^{2} + 4p^{3} = 0$ ; si $p = 0$, il faut $q = 0$, ce qui est encore cette condition. 
    $$\boxed{X^{3} + pX + q \text{ a une racine multiple} \iff 4p^{3} + 27q^{2} = 0}$$

    **7.** Si $4p^{3} + 27q^{2} > 0$, le discriminant $q^{2} + \frac{4p^{3}}{27}$ de $Q$ est positif : $u^{3}$ et $v^{3}$ sont réels et distincts, on prend $u$, $v$ réels, et $\alpha_{2}$, $\alpha_{3}$ sont non réels, conjugués. Si $4p^{3} + 27q^{2} = 0$, $u^{3} = v^{3}$ est réel, $u = v$ réel, et les racines $2u$, $-u$, $-u$ sont réelles. Si $4p^{3} + 27q^{2} < 0$, alors $p < 0$, $u^{3}$ et $v^{3}$ sont conjugués non réels, on peut choisir $v = \overline{u}$ puisque $u\overline{u} = -\frac{p}{3} > 0$, et les trois racines $u + \overline{u}$, $ju + \overline{ju}$, $j^{2}u + \overline{j^{2}u}$ sont réelles. 
    $$\boxed{\text{les trois racines sont réelles} \iff 4p^{3} + 27q^{2} \leqslant 0}$$
     C'est le « cas irréductible » de Cardan : lorsque les trois racines sont réelles et distinctes, la formule passe nécessairement par des nombres complexes, comme l'annonçait l'introduction du chapitre 4.
- id: "ma-13-58"
  feuille: "f-ma-13"
  numero: 58
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [degré, factorisation, polynômes complexes, sommes]
  noeuds: [pol-anneau, pol-irreductibles, c-dalembert, n-sommes]
  notions: [polynome-irreductible]
  page_enonce: 10
  page_corrige: 22
  enonce: |
    Soit $n \in \mathbb{N}$. On pose $P_{n}(X) = (X + \mathrm{i})^{2n + 1} - (X - \mathrm{i})^{2n + 1}$.

    **1.** Déterminer le degré de $P_{n}(X)$, puis son terme dominant.

    **2.** Factoriser $P_{n}(X)$ dans $\mathbb{C}[X]$. On utilisera la fonction $\mathrm{cotan} : x \mapsto \frac{\cos x}{\sin x}$.

    **3.** **(a)** Calculer les quantités $\sum_{k = 1}^{2n} \mathrm{cotan}\Big(\frac{k\pi}{2n + 1}\Big)$ et $\sum_{k = 1}^{2n} \mathrm{cotan}^{2}\Big(\frac{k\pi}{2n + 1}\Big)$.

    **(b)** Montrer alors : $\sum_{k = 1}^{n} \mathrm{cotan}^{2}\Big(\frac{k\pi}{2n + 1}\Big) = \frac{n(2n - 1)}{3}$.

    **4.** Montrer que $\forall x \in \,]0, \frac{\pi}{2}[$, $\sin x < x < \tan x$, puis $\mathrm{cotan}^{2}x < \frac{1}{x^{2}} < \mathrm{cotan}^{2}x + 1$.

    **5.** En déduire que la suite de terme général $\sum_{k = 1}^{n} \frac{1}{k^{2}}$ converge vers $\frac{\pi^{2}}{6}$.
  corrige: |
    **1.** Par la formule du binôme, $P_{n} = \sum_{k} \binom{2n + 1}{k}X^{2n + 1 - k}\big(\mathrm{i}^{k} - (-\mathrm{i})^{k}\big)$ : le terme $k = 0$ disparaît, et le terme $k = 1$ vaut $2\mathrm{i}(2n + 1)X^{2n}$. 
    $$\boxed{\deg P_{n} = 2n, \qquad \text{terme dominant } 2(2n + 1)\mathrm{i}\,X^{2n}}$$

    **2.** Une racine $x$ vérifie $\Big(\frac{x + \mathrm{i}}{x - \mathrm{i}}\Big)^{2n + 1} = 1$, avec $x \neq \mathrm{i}$ : $\frac{x + \mathrm{i}}{x - \mathrm{i}} = \mathrm{e}^{2\mathrm{i}\theta_{k}}$, $\theta_{k} = \frac{k\pi}{2n + 1}$, $1 \leqslant k \leqslant 2n$. On en tire $x = \mathrm{i}\frac{\mathrm{e}^{2\mathrm{i}\theta_{k}} + 1}{\mathrm{e}^{2\mathrm{i}\theta_{k}} - 1} = \mathrm{cotan}\,\theta_{k}$. Ces $2n$ réels sont distincts, car $\mathrm{cotan}$ est injective sur $]0, \pi[$. 
    $$\boxed{P_{n} = 2(2n + 1)\mathrm{i}\prod_{k = 1}^{2n} \Big(X - \mathrm{cotan}\frac{k\pi}{2n + 1}\Big)}$$

    **3. (a)** Le terme $k = 2$ est nul, donc $\sigma_{1} = 0$. Le terme $k = 3$ vaut $-2\mathrm{i}\binom{2n + 1}{3}X^{2n - 2}$, donc $\sigma_{2} = -\frac{1}{2n + 1}\binom{2n + 1}{3} = -\frac{2n(2n - 1)}{6}$, et $\sum \mathrm{cotan}^{2} = \sigma_{1}^{2} - 2\sigma_{2}$. 
    $$\boxed{\sum_{k = 1}^{2n} \mathrm{cotan}\frac{k\pi}{2n + 1} = 0, \qquad \sum_{k = 1}^{2n} \mathrm{cotan}^{2}\frac{k\pi}{2n + 1} = \frac{2n(2n - 1)}{3}}$$

    **(b)** Les termes d'indices $k$ et $2n + 1 - k$ sont égaux, puisque $\mathrm{cotan}(\pi - \theta) = -\mathrm{cotan}\,\theta$ : la somme pour $k \leqslant n$ est la moitié.

    **4.** Les fonctions $x \mapsto x - \sin x$ et $x \mapsto \tan x - x$ sont nulles en $0$ et de dérivées $1 - \cos x > 0$ et $\tan^{2}x > 0$ sur $]0, \frac{\pi}{2}[$. En inversant et en élevant au carré, $\mathrm{cotan}^{2}x < \frac{1}{x^{2}} < \frac{1}{\sin^{2}x} = 1 + \mathrm{cotan}^{2}x$.

    **5.** Avec $x = \frac{k\pi}{2n + 1}$ et en sommant pour $1 \leqslant k \leqslant n$ : 
    $$\frac{n(2n - 1)}{3} < \frac{(2n + 1)^{2}}{\pi^{2}}\sum_{k = 1}^{n} \frac{1}{k^{2}} < n + \frac{n(2n - 1)}{3} = \frac{n(2n + 2)}{3}.$$
     En multipliant par $\frac{\pi^{2}}{(2n + 1)^{2}}$, les deux bornes tendent vers $\frac{\pi^{2}}{6}$, et le théorème des gendarmes conclut. 
    $$\boxed{\sum_{k = 1}^{n} \frac{1}{k^{2}} \xrightarrow[n \to +\infty]{} \frac{\pi^{2}}{6}}$$
- id: "ma-13-59"
  feuille: "f-ma-13"
  numero: 59
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [racines, intégration des fractions]
  noeuds: [pol-racines, ar-tfa]
  notions: []
  page_enonce: 11
  page_corrige: 23
  enonce: |
    *Polynômes de Legendre.* Soit $n \in \mathbb{N}$.

    **1.** En considérant les polynômes $\big[(X^{2} - 1)^{n}\big]^{(k)}$, montrer que le polynôme $L_{n}(X) = \big[(X^{2} - 1)^{n}\big]^{(n)}$ est scindé à racines simples dans $]-1, 1[$.

    **2.** Montrer que pour tout polynôme $Q(X)$ tel que $\deg(Q) < n$, $\int_{-1}^{1} Q(t) \cdot L_{n}(t)\,\mathrm{d} t = 0$.

    **3.** Retrouver le fait que chaque polynôme $L_{n}(X)$ est scindé à racines simples dans $]-1, 1[$.
  corrige: |
    **1.** Soit $A = (X^{2} - 1)^{n}$, de degré $2n$, avec $\pm 1$ racines de multiplicité $n$. On montre par récurrence sur $k \in [\![0\,;n]\!]$ que $A^{(k)}$ admet $\pm 1$ pour racines de multiplicité $n - k$, et au moins $k$ racines distinctes dans $]-1, 1[$. Si c'est vrai au rang $k < n$, le théorème de Rolle appliqué entre les $k + 2$ racines distinctes $-1 < c_{1} < \cdots < c_{k} < 1$ de $A^{(k)}$ fournit $k + 1$ racines distinctes de $A^{(k + 1)}$ dans $]-1, 1[$, et $\pm 1$ sont racines de multiplicité $n - k - 1$. Pour $k = n$, $L_{n} = A^{(n)}$, de degré $n$, a $n$ racines distinctes dans $]-1, 1[$ : ce sont toutes ses racines, et elles sont simples.

    **2.** On intègre par parties $n$ fois (chapitre 6). À chaque étape, le terme entre crochets fait intervenir $A^{(j)}(\pm 1)$ avec $j < n$, qui est nul d'après la question 1 : 
    $$\int_{-1}^{1} Q(t)L_{n}(t)\,\mathrm{d} t = -\int_{-1}^{1} Q'(t)A^{(n - 1)}(t)\,\mathrm{d} t = \cdots = (-1)^{n}\int_{-1}^{1} Q^{(n)}(t)A(t)\,\mathrm{d} t = 0,$$
     puisque $Q^{(n)} = 0$ pour $\deg Q < n$.

    **3.** Soit $x_{1}, \dots, x_{m}$ les racines de $L_{n}$ dans $]-1, 1[$ de multiplicité impaire, où $L_{n}$ change de signe. Si $m < n$, le polynôme $Q = \prod (X - x_{i})$ est de degré $m < n$, et $QL_{n}$ garde un signe constant sur $[-1, 1]$ sans être nul : son intégrale est non nulle, ce qui contredit la question 2. Donc $m \geqslant n = \deg L_{n}$, et $L_{n}$ a $n$ racines simples dans $]-1, 1[$.
- id: "ma-13-60"
  feuille: "f-ma-13"
  numero: 60
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [degré, polynômes complexes, sommes]
  noeuds: [pol-anneau, c-dalembert, n-sommes, pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    Soit $P \in \mathbb{C}[X]$ unitaire de degré $n \geqslant 1$. On note $Q = X(X - 1) \cdots (X - n)$.

    **1.** Montrer $\frac{P}{Q} = \sum_{k = 0}^{n} \frac{(-1)^{n - k}}{n!}\binom{n}{k} P(k)\,\frac{1}{X - k}$.

    **2.** En déduire $\sum_{k = 0}^{n} (-1)^{n - k}\binom{n}{k} P(k) = n!$.

    **3.** En déduire $\max\big\{|P(k)| \bigm| k \in [\![0\,;n]\!]\big\} \geqslant \frac{n!}{2^{n}}$.
  corrige: |
    **1.** La fraction $\frac{P}{Q}$ est de degré $-1$ et a les pôles simples $0, \dots, n$. Par la proposition 23 et l'exercice 46 (i), le coefficient en $k$ vaut $\frac{P(k)}{Q'(k)} = \frac{(-1)^{n - k}P(k)}{k!\,(n - k)!} = \frac{(-1)^{n - k}}{n!}\binom{n}{k}P(k)$.

    **2.** Comme $P$ et $Q$ sont unitaires de degrés $n$ et $n + 1$, $x\frac{P(x)}{Q(x)} \to 1$ en $+\infty$, et cette limite est la somme des coefficients. 
    $$\boxed{\sum_{k = 0}^{n} (-1)^{n - k}\binom{n}{k}P(k) = n!}$$

    **3.** Si $M = \max |P(k)|$, l'inégalité triangulaire donne $n! \leqslant M\sum_{k} \binom{n}{k} = 2^{n}M$. 
    $$\boxed{\max_{0 \leqslant k \leqslant n} |P(k)| \geqslant \frac{n!}{2^{n}}}$$
     Un polynôme unitaire ne peut donc pas être petit en tous les entiers de $0$ à $n$ : par exemple, pour $n = 2$, l'un des nombres $|P(0)|$, $|P(1)|$, $|P(2)|$ dépasse $\frac{1}{2}$.
- id: "ma-13-61"
  feuille: "f-ma-13"
  numero: 61
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [polynômes positifs, sommes de deux carrés]
  noeuds: [pol-irreductibles, c-dalembert]
  notions: [polynome-irreductible]
  page_enonce: 11
  page_corrige: 23
  enonce: |
    **1.** Soit $S = \{A^{2} + B^{2} \mid A, B \in \mathbb{R}[X]\}$. Montrer que $S$ est stable par produit.

    **2.** Soit $P \in \mathbb{R}[X]$. Montrer l'équivalence $P \in S \iff \forall x \in \mathbb{R}, \ P(x) \geqslant 0$.
  corrige: |
    **1.** On a $(A^{2} + B^{2})(C^{2} + D^{2}) = (AC - BD)^{2} + (AD + BC)^{2}$, comme pour les modules de nombres complexes.

    **2.** Un élément de $S$ est positif sur $\mathbb{R}$. Réciproquement, soit $P \geqslant 0$ sur $\mathbb{R}$, non nul. Son coefficient dominant $\lambda$ est positif, puisque $P(x)$ a le signe de $\lambda$ pour $x$ grand. Ses racines réelles sont de multiplicité paire : si $a$ était de multiplicité impaire, $P = (X - a)^{m}Q$ avec $Q(a) \neq 0$ changerait de signe en $a$. La décomposition du théorème 12 s'écrit donc avec des facteurs $\lambda = (\sqrt{\lambda})^{2} + 0^{2}$, $(X - a)^{2r} = \big((X - a)^{r}\big)^{2} + 0^{2}$ et $X^{2} + pX + q = \big(X + \frac{p}{2}\big)^{2} + \Big(\sqrt{q - \frac{p^{2}}{4}}\Big)^{2}$, qui sont tous dans $S$. La question 1 conclut. 
    $$\boxed{P \in S \iff \forall x \in \mathbb{R}, \ P(x) \geqslant 0}$$
- id: "ma-13-62"
  feuille: "f-ma-13"
  numero: 62
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [racines, polynôme dérivé, fractions rationnelles]
  noeuds: [pol-racines, pol-derivee, a-fractions]
  notions: [derivee-formelle, corps-fractions]
  page_enonce: 11
  page_corrige: 24
  enonce: |
    On dit qu'un polynôme est *simplement scindé* s'il est scindé à racines simples. Soit $P \in \mathbb{R}[X]$ simplement scindé. On note $a_{1} < a_{2} < \cdots < a_{n}$ ses racines et $b_{1} < \cdots < b_{n - 1}$ les racines de $P'$.

    **1.** En décomposant en éléments simples $\frac{P'}{P}$ de deux façons différentes, montrer 
    $$\forall i \in [\![1\,;n]\!], \qquad n\prod_{j = 1}^{n - 1} (a_{i} - b_{j}) = \prod_{\substack{k \in [\![1\,;n]\!] \\ k \neq i}} (a_{i} - a_{k}).$$

    **2.** En déduire $\forall i \in [\![1\,;n - 1]\!]$, $a_{i} + \frac{a_{i + 1} - a_{i}}{n} \leqslant b_{i} \leqslant a_{i + 1} - \frac{a_{i + 1} - a_{i}}{n}$.
  corrige: |
    **1.** D'une part, par la proposition 24, $\frac{P'}{P} = \sum_{k} \frac{1}{X - a_{k}}$. D'autre part, avec $P = c\prod (X - a_{k})$ et $P' = nc\prod_{j} (X - b_{j})$, la proposition 23 donne pour coefficient en $a_{i}$ 
    $$\frac{P'(a_{i})}{c\prod_{k \neq i}(a_{i} - a_{k})} = \frac{nc\prod_{j}(a_{i} - b_{j})}{c\prod_{k \neq i}(a_{i} - a_{k})}.$$
     En égalant ce coefficient à $1$ : 
    $$\boxed{n\prod_{j = 1}^{n - 1}(a_{i} - b_{j}) = \prod_{k \neq i}(a_{i} - a_{k})}$$

    **2.** Par le théorème de Rolle, $b_{i} \in \,]a_{i}, a_{i + 1}[$. En $b = b_{i}$, la première écriture donne $\sum_{k} \frac{1}{b - a_{k}} = 0$. Les termes $k \leqslant i$ sont positifs, les termes $k \geqslant i + 1$ négatifs. Donc 
    $$\frac{1}{b - a_{i}} \leqslant \sum_{k \leqslant i} \frac{1}{b - a_{k}} = \sum_{k \geqslant i + 1} \frac{1}{a_{k} - b} \leqslant \frac{n - i}{a_{i + 1} - b},$$
     d'où $a_{i + 1} - b \leqslant (n - i)(b - a_{i})$, soit $b - a_{i} \geqslant \frac{a_{i + 1} - a_{i}}{n - i + 1} \geqslant \frac{a_{i + 1} - a_{i}}{n}$. De même, $\frac{1}{a_{i + 1} - b} \leqslant \frac{i}{b - a_{i}}$ donne $a_{i + 1} - b \geqslant \frac{a_{i + 1} - a_{i}}{i + 1} \geqslant \frac{a_{i + 1} - a_{i}}{n}$. 
    $$\boxed{a_{i} + \frac{a_{i + 1} - a_{i}}{n} \leqslant b_{i} \leqslant a_{i + 1} - \frac{a_{i + 1} - a_{i}}{n}}$$
     La seconde question n'utilise que la première écriture de $\frac{P'}{P}$ : la racine de $P'$ ne peut pas s'approcher à moins d'un $n$-ième de la longueur de l'intervalle de ses deux voisines.
