  page_enonce: 7
  page_corrige: 14
  enonce: |
    Soit $p$ et $q$ deux entiers naturels non nuls premiers entre eux. Déterminer les zéros et les pôles de la fraction $\frac{X^{p} - 1}{X^{q} - 1}$, avec leurs multiplicités. On pourra utiliser l'exercice 30.
  corrige: |
    D'après l'exercice 30, $(X^{p} - 1) \wedge (X^{q} - 1) = X - 1$. La forme irréductible est donc 
    $$\frac{X^{p} - 1}{X^{q} - 1} = \frac{1 + X + \cdots + X^{p - 1}}{1 + X + \cdots + X^{q - 1}}.$$

    $$\boxed{\text{zéros : } \mathbb{U}_{p} \setminus \{1\} ; \quad \text{pôles : } \mathbb{U}_{q} \setminus \{1\} ; \quad \text{tous simples}}$$
     En particulier, $1$ n'est ni un zéro ni un pôle, bien qu'il annule le numérateur et le dénominateur de l'écriture initiale.
- id: "ma-13-43"
  feuille: "f-ma-13"
  numero: 43
  partie: "Fractions rationnelles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [fractions rationnelles, multiplicité]
  noeuds: [a-fractions, pol-derivee]
  notions: [corps-fractions, multiplicite-racine]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    **1.** Soit $z \in \mathbb{C}$. Pour $F = \frac{P}{Q} \in \mathbb{C}(X)$ non nulle, on pose $\mu_{z}(F) = \mu_{z}(P) - \mu_{z}(Q)$, où $\mu_{z}(P)$ est la multiplicité de $z$ dans $P$. Montrer que $\mu_{z}(F)$ ne dépend pas du couple $(P, Q)$ choisi pour écrire $F$.

    **2.** Calculer $\mu_{0}(F')$ en fonction de $\mu_{0}(F)$ lorsque $\mu_{0}(F) \neq 0$. En déduire qu'il n'existe aucune fraction rationnelle $F \in \mathbb{C}(X)$ telle que $F' = \frac{1}{X}$.
  corrige: |
    **1.** Si $\frac{P}{Q} = \frac{P_{1}}{Q_{1}}$, alors $PQ_{1} = P_{1}Q$, et la multiplicité d'un produit est la somme des multiplicités : $\mu_{z}(P) + \mu_{z}(Q_{1}) = \mu_{z}(P_{1}) + \mu_{z}(Q)$.

    **2.** Si $m = \mu_{0}(F) \neq 0$, on écrit $F = X^{m}G$ avec $\mu_{0}(G) = 0$, c'est-à-dire $G$ sans zéro ni pôle en $0$. Alors $F' = X^{m - 1}(mG + XG')$, et $G'$ n'a pas de pôle en $0$, donc $mG + XG'$ prend en $0$ la valeur $mG(0) \neq 0$. 
    $$\boxed{\mu_{0}(F') = \mu_{0}(F) - 1 \quad \text{si } \mu_{0}(F) \neq 0}$$
     Si $F' = \frac{1}{X}$, alors $\mu_{0}(F') = -1$. Si $\mu_{0}(F) \neq 0$, on aurait $\mu_{0}(F) = 0$ : contradiction. Si $\mu_{0}(F) = 0$, $F$ n'a pas de pôle en $0$, donc $F'$ non plus : contradiction. Il n'existe pas de « logarithme rationnel ».
- id: "ma-13-44"
  feuille: "f-ma-13"
  numero: 44
  partie: "Fractions rationnelles"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [fractions rationnelles, factorisation, polynômes complexes, sommes]
  noeuds: [a-fractions, pol-irreductibles, c-dalembert, n-sommes]
  notions: [corps-fractions, polynome-irreductible]
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Soit $n \geqslant 2$ et $\omega = \mathrm{e}^{2\mathrm{i}\pi/n}$.

    **1.** Soit $P \in \mathbb{C}[X]$ tel que $P(\omega X) = P(X)$. Montrer qu'il existe $Q \in \mathbb{C}[X]$ tel que $P = Q(X^{n})$.

    **2.** Mettre sous forme irréductible la fraction $\sum_{k = 0}^{n - 1} \frac{X + \omega^{k}}{X - \omega^{k}}$.
  corrige: |
    **1.** Si $P = \sum a_{k}X^{k}$, alors $P(\omega X) = \sum a_{k}\omega^{k}X^{k}$, et l'identification donne $a_{k}(\omega^{k} - 1) = 0$ : $a_{k} = 0$ dès que $n \nmid k$. Donc $P = \sum_{m} a_{mn}X^{mn} = Q(X^{n})$.

    **2.** On écrit $\frac{X + \omega^{k}}{X - \omega^{k}} = 1 + \frac{2\omega^{k}}{X - \omega^{k}}$. Par la proposition 23, $\frac{n}{X^{n} - 1} = \sum_{k} \frac{\omega^{k}}{X - \omega^{k}}$, car le coefficient en $\omega^{k}$ vaut $\frac{n}{n\omega^{k(n - 1)}} = \omega^{k}$. 
    $$\boxed{\sum_{k = 0}^{n - 1} \frac{X + \omega^{k}}{X - \omega^{k}} = n + \frac{2n}{X^{n} - 1} = \frac{n(X^{n} + 1)}{X^{n} - 1}}$$
- id: "ma-13-45"
  feuille: "f-ma-13"
  numero: 45
  partie: "Décomposition en éléments simples"
  etoiles: 1
  types: [Calcul]
  mots_cles: [décomposition en éléments simples, fractions rationnelles]
  noeuds: [a-fractions]
  notions: [corps-fractions]
  page_enonce: 8
  page_corrige: 15
  enonce: |
    Décomposer en éléments simples sur $\mathbb{R}$ les fractions rationnelles suivantes, puis, pour la quatrième, sur $\mathbb{C}$.

    $$\begin{array}{lll}  \text{(i) }\dfrac{1}{(X + 1)^{2}(3 - X)} & \text{(ii) }\dfrac{1}{(X^{2} - 1)(X + 1)^{2}} & \text{(iii) }\dfrac{7X^{2} + 4X - 4}{X^{4} - 4X^{2}} \\  \text{(iv) }\dfrac{X^{4} + 1}{X^{4} - 1} & \text{(v) }\dfrac{X^{3} - 1}{(X - 2)^{2}} & \text{(vi) }\dfrac{3X^{4} + X^{3} + 4X^{2} - X - 3}{(X + 1)(X^{2} + 1)^{2}} \end{array}$$
  corrige: |
    On suit la méthode du cours : partie entière, pôles simples par la proposition 23, pôles multiples par multiplication et évaluation, puis limite de $xF(x)$ ou valeur particulière. 
    $$\text{(i)} \ \boxed{\frac{1}{(X + 1)^{2}(3 - X)} = \frac{1}{4(X + 1)^{2}} + \frac{1}{16(X + 1)} - \frac{1}{16(X - 3)}}$$

    $$\text{(ii)} \ \boxed{\frac{1}{(X^{2} - 1)(X + 1)^{2}} = \frac{1}{8(X - 1)} - \frac{1}{8(X + 1)} - \frac{1}{4(X + 1)^{2}} - \frac{1}{2(X + 1)^{3}}}$$

    $$\text{(iii)} \ \boxed{\frac{7X^{2} + 4X - 4}{X^{4} - 4X^{2}} = \frac{1}{X^{2}} - \frac{1}{X} + \frac{2}{X - 2} - \frac{1}{X + 2}}$$

    $$\text{(iv)} \ \boxed{\frac{X^{4} + 1}{X^{4} - 1} = 1 + \frac{1}{2(X - 1)} - \frac{1}{2(X + 1)} - \frac{1}{X^{2} + 1}} \quad \text{sur } \mathbb{R},$$

    $$\boxed{\frac{X^{4} + 1}{X^{4} - 1} = 1 + \frac{1}{2(X - 1)} - \frac{1}{2(X + 1)} + \frac{\mathrm{i}}{2(X - \mathrm{i})} - \frac{\mathrm{i}}{2(X + \mathrm{i})}} \quad \text{sur } \mathbb{C}$$

    $$\text{(v)} \ \boxed{\frac{X^{3} - 1}{(X - 2)^{2}} = X + 4 + \frac{12}{X - 2} + \frac{7}{(X - 2)^{2}}}$$

    $$\text{(vi)} \ \boxed{\frac{3X^{4} + X^{3} + 4X^{2} - X - 3}{(X + 1)(X^{2} + 1)^{2}} = \frac{1}{X + 1} + \frac{2X - 1}{X^{2} + 1} + \frac{X - 3}{(X^{2} + 1)^{2}}}$$
     Pour (vi), on obtient le coefficient en $-1$ par la proposition 23, puis le terme $\frac{X - 3}{(X^{2} + 1)^{2}}$ en multipliant par $(X^{2} + 1)^{2}$ et en évaluant en $\mathrm{i}$, enfin $\frac{2X - 1}{X^{2} + 1}$ par différence.
- id: "ma-13-46"
  feuille: "f-ma-13"
  numero: 46
  partie: "Décomposition en éléments simples"
  etoiles: 2
  types: [Calcul]
  mots_cles: [décomposition en éléments simples, "racines de l'unité", fractions rationnelles]
  noeuds: [a-fractions, cx-exponentielle]
  notions: [corps-fractions]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Soit $n \geqslant 2$. Décomposer en éléments simples sur $\mathbb{C}$ les fractions rationnelles suivantes.

    $$\begin{array}{llll}  \text{(i) }\dfrac{1}{X(X - 1) \cdots (X - n)} & \text{(ii) }\dfrac{X^{n - 1}}{X^{n} - 1} & \text{(iii) }\dfrac{1}{X^{n} - 1} & \text{(iv) }\dfrac{1}{(X - 1)(X^{n} - 1)} \end{array}$$
  corrige: |
    **(i)** Les pôles $0, 1, \dots, n$ sont simples, et la proposition 23 donne pour coefficient en $k$ l'inverse de $\prod_{j \neq k} (k - j) = k!\,(-1)^{n - k}(n - k)!$. 
    $$\boxed{\frac{1}{X(X - 1) \cdots (X - n)} = \sum_{k = 0}^{n} \frac{(-1)^{n - k}}{k!\,(n - k)!}\,\frac{1}{X - k}}$$

    **(ii)** et **(iii)** Les pôles sont les $\omega_{k} = \mathrm{e}^{2\mathrm{i} k\pi/n}$, simples, avec $Q'(\omega_{k}) = n\omega_{k}^{n - 1} = \frac{n}{\omega_{k}}$. 
    $$\boxed{\frac{X^{n - 1}}{X^{n} - 1} = \frac{1}{n}\sum_{k = 0}^{n - 1} \frac{1}{X - \omega_{k}}, \qquad \frac{1}{X^{n} - 1} = \frac{1}{n}\sum_{k = 0}^{n - 1} \frac{\omega_{k}}{X - \omega_{k}}}$$

    **(iv)** Le pôle $1$ est double, les autres $\omega_{k}$ sont simples, de coefficient $\frac{1}{(\omega_{k} - 1)\,n\omega_{k}^{n - 1}} = \frac{\omega_{k}}{n(\omega_{k} - 1)}$. En $1$, $(X - 1)^{2}F = \frac{1}{S}$ avec $S = 1 + X + \cdots + X^{n - 1}$ : la formule de Taylor donne les coefficients $\frac{1}{S(1)} = \frac{1}{n}$ et $-\frac{S'(1)}{S(1)^{2}} = -\frac{n - 1}{2n}$. 
    $$\boxed{\frac{1}{(X - 1)(X^{n} - 1)} = \frac{1}{n(X - 1)^{2}} - \frac{n - 1}{2n(X - 1)} + \sum_{k = 1}^{n - 1} \frac{\omega_{k}}{n(\omega_{k} - 1)}\,\frac{1}{X - \omega_{k}}}$$
- id: "ma-13-47"
  feuille: "f-ma-13"
  numero: 47
  partie: "Décomposition en éléments simples"
  etoiles: 2
  types: [Calcul]
  mots_cles: [décomposition en éléments simples, PGCD et Bézout, fractions rationnelles]
  noeuds: [a-fractions, pol-principal]
  notions: [pgcd, corps-fractions]
  page_enonce: 8
  page_corrige: 16
  enonce: |
    Soit $A = X^{2} + 1$ et $B = (X - 1)^{2}$. Décomposer la fraction $\frac{1}{AB}$ en éléments simples sur $\mathbb{R}$, et en déduire une relation de Bézout entre $A$ et $B$.
  corrige: |
    On trouve $\frac{1}{(X^{2} + 1)(X - 1)^{2}} = \frac{1}{2(X - 1)^{2}} - \frac{1}{2(X - 1)} + \frac{X}{2(X^{2} + 1)}$ : le coefficient de $\frac{1}{(X - 1)^{2}}$ s'obtient en évaluant $\frac{1}{X^{2} + 1}$ en $1$, celui de seconde espèce en multipliant par $X^{2} + 1$ et en évaluant en $\mathrm{i}$, et le dernier par la limite de $xF(x)$. En multipliant par $AB$ : 
    $$1 = \frac{1}{2}A - \frac{X - 1}{2}A + \frac{X}{2}B.$$

    $$\boxed{\frac{2 - X}{2}\,(X^{2} + 1) + \frac{X}{2}\,(X - 1)^{2} = 1}$$
     *À retenir.* La décomposition en éléments simples d'un $\frac{1}{AB}$ fournit une relation de Bézout entre $A$ et $B$ : c'est le chemin inverse de la démonstration du théorème 14.
- id: "ma-13-48"
  feuille: "f-ma-13"
  numero: 48
  partie: "Décomposition en éléments simples"
  etoiles: 2
  types: [Calcul]
  mots_cles: [décomposition en éléments simples, fractions rationnelles]
