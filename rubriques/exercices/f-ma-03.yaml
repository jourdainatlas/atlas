  enonce: |
    Montrer que, pour tout $n \in \mathbb{N}^{*}$, le nombre $(3 + \sqrt{5})^{n} + (3 - \sqrt{5})^{n}$ est un entier naturel pair. En déduire que l'entier qui suit $(3 + \sqrt{5})^{n}$ est pair.
  corrige: |
    Par la formule du binôme, avec $a = 3$ et $b = \pm\sqrt{5}$, 
    $$(3 + \sqrt{5})^{n} + (3 - \sqrt{5})^{n} = \sum_{k=0}^{n} \binom{n}{k} 3^{n-k} \big(1 + (-1)^{k}\big)\sqrt{5}^{\,k} = 2\sum_{\substack{0 \leqslant k \leqslant n \\ k \text{ pair}}} \binom{n}{k} 3^{n-k}\, 5^{k/2}.$$
     Les termes d'indice impair, qui contiennent $\sqrt{5}$, se compensent, et la somme restante est un entier naturel. 
    $$\boxed{(3 + \sqrt{5})^{n} + (3 - \sqrt{5})^{n} \text{ est un entier naturel pair.}}$$
     Notons $N$ cet entier. Comme $0 < 3 - \sqrt{5} < 1$, on a $0 < (3 - \sqrt{5})^{n} < 1$, donc $N - 1 < (3 + \sqrt{5})^{n} < N$ : l'entier qui suit $(3 + \sqrt{5})^{n}$ est $N$, qui est pair. Par exemple, $(3 + \sqrt{5})^{2} = 14 + 6\sqrt{5} \approx 27{,}4$, et l'entier suivant est $28$.
- id: "ma-03-31"
  feuille: "f-ma-03"
  numero: 31
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 2
