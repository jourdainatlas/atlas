  page_enonce: 8
  page_corrige: 15
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $p \in [\![0\,;n]\!]$.

    **1.** Montrer que, pour tout $k \in [\![0\,;p]\!]$, $\dbinom{n}{k}\dbinom{n-k}{p-k} = \dbinom{n}{p}\dbinom{p}{k}$. Interpréter ce résultat en dénombrant de deux façons les couples $(A, B)$ de parties d'un ensemble à $n$ éléments telles que $A \subset B$, $A$ ait $k$ éléments et $B$ en ait $p$.

    **2.** En déduire $\displaystyle\sum_{k=0}^{p} \binom{n}{k}\binom{n-k}{p-k} = 2^{p}\binom{n}{p}$, et, pour $p \geqslant 1$, $\displaystyle\sum_{k=0}^{p} (-1)^{k}\binom{n}{k}\binom{n-k}{p-k} = 0$.
  corrige: |
    **1.** Par le calcul, les deux membres valent 
    $$\frac{n!}{k!\,(n-k)!} \cdot \frac{(n-k)!}{(p-k)!\,(n-p)!} = \frac{n!}{k!\,(p-k)!\,(n-p)!} = \frac{n!}{p!\,(n-p)!} \cdot \frac{p!}{k!\,(p-k)!}.$$
     Combinatoirement, on choisit d'abord $A$, puis on la complète en $B$ en choisissant $p - k$ éléments parmi les $n - k$ restants ; ou bien on choisit d'abord $B$, puis $A$ à l'intérieur de $B$.

    **2.** En sommant sur $k$ et en factorisant par $\binom{n}{p}$, on obtient $\binom{n}{p}\sum_{k=0}^{p} \binom{p}{k}$ et $\binom{n}{p}\sum_{k=0}^{p} (-1)^{k}\binom{p}{k}$, que la formule du binôme donne. 
    $$\boxed{\sum_{k=0}^{p} \binom{n}{k}\binom{n-k}{p-k} = 2^{p}\binom{n}{p} \qquad \sum_{k=0}^{p} (-1)^{k}\binom{n}{k}\binom{n-k}{p-k} = 0 \ \ (p \geqslant 1)}$$
     La première somme compte les couples $A \subset B$ avec $\mathrm{card}(B) = p$ : il y a $\binom{n}{p}$ choix de $B$, et $2^{p}$ choix de $A$ dans $B$.
- id: "ma-03-32"
  feuille: "f-ma-03"
  numero: 32
