  page_enonce: 7
  page_corrige: 13
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Calculer les sommes suivantes à l'aide de la formule du binôme. 
    $$\sum_{k=0}^{n} \binom{n}{k} 2^{k}, \qquad \sum_{k=0}^{n} (-1)^{k} \binom{n}{k}, \qquad \sum_{k=0}^{n} \frac{(-1)^{k}}{2^{k}} \binom{n}{k}, \qquad \sum_{k=0}^{n} 2^{2k} \binom{n}{k}, \qquad \sum_{k=1}^{2n} \binom{2n}{k} (-1)^{k}\, 2^{k-1}.$$
  corrige: |
    On reconnaît chaque fois $(a + b)^{n}$ pour des valeurs bien choisies de $a$ et $b$ : $(1 + 2)^{n}$, $(1 - 1)^{n}$, $\big(1 - \frac{1}{2}\big)^{n}$, $(1 + 4)^{n}$. Pour la dernière, on écrit $(-1)^{k}2^{k-1} = \frac{1}{2}(-2)^{k}$, et l'on retranche le terme $k = 0$ de $(1 - 2)^{2n}$. 
    $$\boxed{3^{n} \qquad 0 \qquad \frac{1}{2^{n}} \qquad 5^{n} \qquad \frac{(1 - 2)^{2n} - 1}{2} = 0}$$
     *Attention :* la deuxième somme vaut $0$ parce que $n \geqslant 1$ ; pour $n = 0$, elle vaudrait $1$, car $0^{0} = 1$.
- id: "ma-03-27"
  feuille: "f-ma-03"
  numero: 27
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients binomiaux]
  noeuds: [n-sommes, n-fini, pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    Soit $n \geqslant 2$. En utilisant la formule du pion $k\dbinom{n}{k} = n\dbinom{n-1}{k-1}$, calculer 
    $$\sum_{k=0}^{n} k(k - 1)\binom{n}{k}, \qquad \sum_{k=0}^{n} k^{2} \binom{n}{k}, \qquad \sum_{k=0}^{n} \frac{1}{k + 1} \binom{n}{k}.$$
  corrige: |
    En appliquant deux fois la formule du pion, $k(k-1)\binom{n}{k} = n(k-1)\binom{n-1}{k-1} = n(n-1)\binom{n-2}{k-2}$, d'où 
    $$\sum_{k=0}^{n} k(k-1)\binom{n}{k} = n(n-1)\sum_{j=0}^{n-2} \binom{n-2}{j} = n(n-1)\,2^{n-2}.$$
     En ajoutant $\sum k\binom{n}{k} = n2^{n-1}$, calculée dans le cours, on obtient la deuxième somme. Pour la troisième, la formule du pion au rang $n + 1$ donne $\frac{1}{k+1}\binom{n}{k} = \frac{1}{n+1}\binom{n+1}{k+1}$. 
    $$\boxed{n(n-1)\,2^{n-2} \qquad n(n+1)\,2^{n-2} \qquad \frac{2^{n+1} - 1}{n + 1}}$$
     La troisième somme, $\sum_{k=0}^{n} \binom{n}{k}\int_{0}^{1} x^{k}\,\mathrm{d}x$, se retrouve aussi en intégrant $(1 + x)^{n}$ entre $0$ et $1$, comme on sait le faire depuis la Terminale et comme le reprendra le chapitre 6.
- id: "ma-03-28"
  feuille: "f-ma-03"
  numero: 28
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coefficients binomiaux, factorielle]
  noeuds: [n-sommes, n-fini]
  notions: [coefficient-binomial]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    ![Figure](documents/figures/fb356314eb2ef690.svg)

    La figure représente les coefficients $\dbinom{8}{k}$ pour $0 \leqslant k \leqslant 8$.

    **1.** Soit $n \in \mathbb{N}^{*}$. Pour $0 \leqslant k \leqslant n - 1$, calculer le quotient $\dbinom{n}{k+1} \Big/ \dbinom{n}{k}$, et en déduire les variations de la famille $\Big(\dbinom{n}{k}\Big)_{0 \leqslant k \leqslant n}$. Pour quelles valeurs de $k$ le coefficient est-il maximal ?

    **2.** En déduire que, pour tout $n \in \mathbb{N}$, $\dbinom{2n}{n} \geqslant \dfrac{4^{n}}{2n + 1}$.
  corrige: |
    **1.** Pour $0 \leqslant k \leqslant n - 1$, 
    $$\binom{n}{k+1} \Big/ \binom{n}{k} = \frac{n!\,k!\,(n - k)!}{(k+1)!\,(n - k - 1)!\,n!} = \frac{n - k}{k + 1}.$$
     Ce quotient est strictement supérieur à $1$ si et seulement si $n - k > k + 1$, c'est-à-dire $k < \frac{n-1}{2}$, et il vaut $1$ si et seulement si $k = \frac{n-1}{2}$. La famille croît jusqu'au milieu, puis décroît. 
    $$\boxed{\text{Le maximum est atteint en } k = \tfrac{n}{2} \text{ si } n \text{ est pair, en } k = \tfrac{n - 1}{2} \text{ et } k = \tfrac{n + 1}{2} \text{ sinon.}}$$

    **2.** Les $2n + 1$ coefficients $\binom{2n}{k}$ ont pour somme $2^{2n} = 4^{n}$, et le plus grand d'entre eux est $\binom{2n}{n}$. Celui-ci est donc au moins égal à leur moyenne. 
    $$\boxed{\binom{2n}{n} \geqslant \frac{4^{n}}{2n + 1}}$$
     Pour $n = 4$, $\binom{8}{4} = 70 \geqslant \frac{256}{9} \approx 28{,}4$ : la minoration est grossière, mais elle donne le bon ordre de grandeur exponentiel. La formule de Stirling, établie plus tard dans l'année, montre que $\binom{2n}{n}$ est équivalent à $\frac{4^{n}}{\sqrt{\pi n}}$.
- id: "ma-03-29"
  feuille: "f-ma-03"
  numero: 29
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coefficients binomiaux, produits]
  noeuds: [n-sommes, n-fini, pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 8
  page_corrige: 14
  enonce: |
    Pour $n \in \mathbb{N}^{*}$ et $x \in \mathbb{R}$, on pose $\displaystyle P_{n}(x) = \prod_{k=1}^{n} \Big(1 + \frac{x}{k}\Big)$.

    **1.** Calculer $P_{n}(0)$, $P_{n}(1)$ et $P_{n}(-n)$.

    **2.** Montrer que, pour tout réel $x$, $x\,P_{n}(x) = (x + n)\,P_{n}(x - 1)$.

    **3.** Pour $p \in \mathbb{N}$, exprimer $P_{n}(p)$ à l'aide d'un coefficient binomial.
  corrige: |
    **1.** Le produit $P_{n}(1) = \prod \frac{k+1}{k}$ est télescopique, et $P_{n}(-n)$ contient le facteur $1 - \frac{n}{n} = 0$. 
    $$\boxed{P_{n}(0) = 1 \qquad P_{n}(1) = n + 1 \qquad P_{n}(-n) = 0}$$

    **2.** On écrit 
    $$P_{n}(x) = \prod_{k=1}^{n} \frac{k + x}{k} \qquad\text{et}\qquad P_{n}(x - 1) = \prod_{k=1}^{n} \frac{k - 1 + x}{k}.$$
     Les numérateurs de $x\,P_{n}(x)$ sont $x$, $x+1$, …, $x+n$, et ceux de $(x + n)\,P_{n}(x - 1)$ sont $x$, $x+1$, …, $x+n-1$, puis $x+n$ : les deux produits ont les mêmes facteurs et le même dénominateur $n!$. 
    $$\boxed{x\,P_{n}(x) = (x + n)\,P_{n}(x - 1)}$$

    **3.** Pour $p \in \mathbb{N}$, le produit des dénominateurs est $n!$, et celui des numérateurs est 
    $$(p+1)(p+2)\cdots(p+n) = \frac{(n+p)!}{p!}.$$

    $$\boxed{P_{n}(p) = \binom{n+p}{p}}$$
     On peut aussi le démontrer par récurrence sur $p$, à partir de la relation $P_{n}(p) = \frac{p + n}{p}P_{n}(p - 1)$ que donne la question 2.
