  enonce: |
    **1.** Soit $p \in \mathbb{N}$. Montrer que $2\dbinom{2p+1}{p} = \dbinom{2p+2}{p+1}$.

    **2.** Pour $n \in \mathbb{N}$, on pose $\displaystyle S_{n} = \sum_{k=0}^{n} \binom{n+k}{k} \frac{1}{2^{k}}$. Calculer $S_{0}$, $S_{1}$, $S_{2}$, puis montrer que $S_{n+1} = 2S_{n}$ pour tout $n \in \mathbb{N}$, à l'aide de la formule de Pascal. En déduire $S_{n}$.
  corrige: |
    **1.** Par la formule de Pascal et la symétrie, $\binom{2p+2}{p+1} = \binom{2p+1}{p} + \binom{2p+1}{p+1} = 2\binom{2p+1}{p}$.

    **2.** On trouve $S_{0} = 1$, $S_{1} = 1 + \frac{2}{2} = 2$ et $S_{2} = 1 + \frac{3}{2} + \frac{6}{4} = 4$. Par la formule de Pascal, 
    $$\binom{n+1+k}{k} = \binom{n+k}{k} + \binom{n+k}{k-1}, \qquad\text{donc}$$

    $$S_{n+1} = \sum_{k=0}^{n+1} \binom{n+k}{k}\frac{1}{2^{k}} + \sum_{k=1}^{n+1} \binom{n+k}{k-1}\frac{1}{2^{k}}.$$
     La première somme vaut $S_{n} + \dbinom{2n+1}{n+1}\dfrac{1}{2^{n+1}}$. Dans la seconde, la translation $j = k - 1$ donne 
    $$\frac{1}{2}\sum_{j=0}^{n} \binom{n+1+j}{j}\frac{1}{2^{j}} = \frac{1}{2}\Big(S_{n+1} - \binom{2n+2}{n+1}\frac{1}{2^{n+1}}\Big).$$
     D'après la question 1, les deux termes isolés se compensent, et il reste $S_{n+1} = S_{n} + \frac{1}{2}S_{n+1}$. 
    $$\boxed{S_{n+1} = 2S_{n} \qquad\text{donc}\qquad S_{n} = 2^{n}}$$
