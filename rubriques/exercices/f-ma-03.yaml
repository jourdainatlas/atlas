  page_enonce: 10
  page_corrige: 18
  enonce: |
    Résoudre les systèmes suivants par la méthode du pivot, en indiquant à chaque étape les opérations effectuées. 
    $$\text{(a)}\ \left\{ \begin{array}{rcrcrcl} x & + & 2y & - & z & = & 0 \\ x & + & 3y & & & = & 3 \\ & & y & - & z & = & 1 \end{array} \right. \qquad\qquad \text{(b)}\ \left\{ \begin{array}{rcrcrcrcl} x & & & & & + & t & = & 1 \\ x & + & y & + & z & & & = & 0 \\ & & y & & & - & t & = & 1 \\ & & & & z & + & t & = & -1 \end{array} \right.$$

    $$\text{(c)}\ \left\{ \begin{array}{rcrcrcrcl} x & + & y & + & 3z & + & t & = & 3 \\ x & & & + & 3z & - & t & = & 2 \end{array} \right. \qquad\qquad \text{(d)}\ \left\{ \begin{array}{rcrcrcl} 2x & - & y & + & z & = & 1 \\ x & + & y & - & 2z & = & 2 \\ 5x & - & y & & & = & 4 \end{array} \right.$$
  corrige: |
    **(a)** L'opération $L_{2} \leftarrow L_{2} - L_{1}$ donne $y + z = 3$, puis $L_{3} \leftarrow L_{3} - L_{2}$ donne $-2z = -2$. La remontée donne $z = 1$, $y = 2$, puis $x = -2y + z = -3$. 
    $$\boxed{(x, y, z) = (-3, 2, 1)}$$

    **(b)** L'opération $L_{2} \leftarrow L_{2} - L_{1}$ donne $y + z - t = -1$, puis $L_{3} \leftarrow L_{3} - L_{2}$ donne $-z = 2$. Alors $z = -2$, $t = -1 - z = 1$ par la dernière équation, $y = 1 + t = 2$ et $x = 1 - t = 0$. 
    $$\boxed{(x, y, z, t) = (0, 2, -2, 1)}$$

    **(c)** L'opération $L_{2} \leftarrow L_{2} - L_{1}$ donne $-y - 2t = -1$. Les inconnues $z$ et $t$ ne sont en tête d'aucune ligne : ce sont des paramètres. On obtient $y = 1 - 2t$, puis $x = 3 - y - 3z - t = 2 - 3z + t$. 
    $$\boxed{\big\{(2 - 3z + t,\ 1 - 2t,\ z,\ t) \mid (z, t) \in \mathbb{R}^{2}\big\}}$$
     L'ensemble des solutions dépend de deux paramètres : deux équations ne suffisent pas à déterminer quatre inconnues.

    **(d)** On échange $L_{1}$ et $L_{2}$, pour avoir un pivot égal à $1$. Les opérations $L_{2} \leftarrow L_{2} - 2L_{1}$ et $L_{3} \leftarrow L_{3} - 5L_{1}$ donnent $-3y + 5z = -3$ et $-6y + 10z = -6$, puis $L_{3} \leftarrow L_{3} - 2L_{2}$ donne $0 = 0$. Avec $z = 3s$ : 
    $$\boxed{\big\{(1 + s,\ 1 + 5s,\ 3s) \mid s \in \mathbb{R}\big\}}$$
     La troisième équation initiale est la somme du double de la première et de la deuxième : les trois plans ont une droite commune.
