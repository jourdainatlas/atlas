  enonce: |
    **1.** En écrivant $(a + b + c)^{7} = \big((a + b) + c\big)^{7}$ et en appliquant deux fois la formule du binôme, déterminer le coefficient de $a^{2}b^{4}c$ dans le développement de $(a + b + c)^{7}$.

    **2.** Plus généralement, soit $n \in \mathbb{N}$ et $p$, $q$, $r$ trois entiers naturels de somme $n$. Montrer que le coefficient de $x^{p}y^{q}z^{r}$ dans le développement de $(x + y + z)^{n}$ est $\dfrac{n!}{p!\,q!\,r!}$.
  corrige: |
    **1.** Dans $\big((a + b) + c\big)^{7} = \sum_{j=0}^{7} \binom{7}{j}(a + b)^{7-j}c^{j}$, le terme en $c^{1}$ est $7(a + b)^{6}c$, et le coefficient de $a^{2}b^{4}$ dans $(a + b)^{6}$ est $\binom{6}{2} = 15$. 
    $$\boxed{7 \times 15 = 105 = \frac{7!}{2!\,4!\,1!}}$$

    **2.** De même, le terme en $z^{r}$ de $\big((x + y) + z\big)^{n}$ est $\binom{n}{r}(x + y)^{n-r}z^{r}$, et le coefficient de $x^{p}y^{q}$ dans $(x + y)^{p+q}$ est $\binom{p+q}{p}$. Le produit se simplifie : 
    $$\binom{n}{r}\binom{p+q}{p} = \frac{n!}{r!\,(p+q)!} \cdot \frac{(p+q)!}{p!\,q!}.$$

    $$\boxed{\text{Le coefficient de } x^{p}y^{q}z^{r} \text{ est } \frac{n!}{p!\,q!\,r!}}$$
     C'est le nombre de façons de choisir, parmi les $n$ facteurs du produit, ceux qui fournissent $x$, ceux qui fournissent $y$ et ceux qui fournissent $z$.
- id: "ma-03-38"
  feuille: "f-ma-03"
  numero: 38
  partie: "Systèmes linéaires"
  etoiles: 1
  types: [Calcul]
