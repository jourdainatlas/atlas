- id: "ma-03-01"
  feuille: "f-ma-03"
  numero: 1
  partie: "Manipulation des symboles somme et produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes et produits]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    Écrire chacune des expressions suivantes à l'aide du symbole $\sum$, et préciser son nombre de termes.

    **(a)** $2^{3} + 2^{4} + \cdots + 2^{12}$

    **(b)** $\dfrac{1}{2} + \dfrac{2}{4} + \dfrac{3}{8} + \cdots + \dfrac{10}{1024}$

    **(c)** $2 - 4 + 6 - 8 + \cdots + 50$

    **(d)** $1 - \dfrac{1}{2} + \dfrac{1}{3} - \dfrac{1}{4} + \cdots + \dfrac{1}{2n-1} - \dfrac{1}{2n}$

    **(e)** $n + (n+1) + (n+2) + \cdots + 2n$

    **(f)** $\dfrac{x_{1}}{x_{n}} + \dfrac{x_{2}}{x_{n-1}} + \cdots + \dfrac{x_{n}}{x_{1}}$
  corrige: |
    Pour chaque expression, on repère la forme du terme général et les valeurs extrêmes de l'indice. Le nombre de termes d'une somme de $m$ à $n$ est $n - m + 1$.

    • **(a)** $\displaystyle\sum_{k=3}^{12} 2^{k}$, qui a $10$ termes.

    • **(b)** $\displaystyle\sum_{k=1}^{10} \frac{k}{2^{k}}$, qui a $10$ termes, puisque $1024 = 2^{10}$.

    • **(c)** $\displaystyle\sum_{k=1}^{25} (-1)^{k+1}\, 2k$, qui a $25$ termes : les termes sont les entiers pairs de $2$ à $50$, affectés du signe $+$ lorsque $k$ est impair.

    • **(d)** $\displaystyle\sum_{k=1}^{2n} \frac{(-1)^{k+1}}{k}$, qui a $2n$ termes.

    • **(e)** $\displaystyle\sum_{k=n}^{2n} k = \sum_{j=0}^{n} (n + j)$, qui a $n + 1$ termes, et non $n$.

    • **(f)** $\displaystyle\sum_{k=1}^{n} \frac{x_{k}}{x_{n+1-k}}$, qui a $n$ termes : la somme des deux indices vaut toujours $n + 1$.

    *Piège :* pour une somme alternée, le signe s'écrit $(-1)^{k}$ ou $(-1)^{k+1}$ selon le signe du premier terme ; on vérifie toujours la formule sur les deux premiers termes.
- id: "ma-03-02"
  feuille: "f-ma-03"
  numero: 2
  partie: "Manipulation des symboles somme et produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes et produits]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On considère deux suites $(a_{n})_{n \geqslant 0}$ et $(S_{n})_{n \geqslant 0}$ reliées par 
    $$\forall n \in \mathbb{N},\quad S_{n} = \sum_{k=0}^{n} a_{k}.$$

    **1.** Exprimer $a_{n}$ à l'aide des termes de la suite $(S_{n})$, en distinguant le cas $n = 0$.

    **2.** Exprimer à l'aide des termes de la suite $(S_{n})$ les sommes suivantes : 
    $$\sum_{k=0}^{n+1} a_{k}, \qquad \sum_{k=n+1}^{2n} a_{k}, \qquad \sum_{k=0}^{n} 2a_{k}, \qquad \sum_{k=0}^{n} (a_{k} - 1), \qquad \sum_{k=0}^{n} (a_{k} - k).$$
  corrige: |
    **1.** Pour $n \geqslant 1$, la relation de Chasles donne $S_{n} = S_{n-1} + a_{n}$. 
    $$\boxed{a_{0} = S_{0} \qquad\text{et}\qquad a_{n} = S_{n} - S_{n-1} \ \text{ pour } n \geqslant 1}$$

    **2.** On utilise la relation de Chasles, la linéarité et la somme d'une constante, qui compte $n + 1$ termes de $0$ à $n$. 
    $$\boxed{\sum_{k=0}^{n+1} a_{k} = S_{n+1} \qquad \sum_{k=n+1}^{2n} a_{k} = S_{2n} - S_{n} \qquad \sum_{k=0}^{n} 2a_{k} = 2S_{n}}$$

    $$\boxed{\sum_{k=0}^{n} (a_{k} - 1) = S_{n} - (n + 1) \qquad \sum_{k=0}^{n} (a_{k} - k) = S_{n} - \frac{n(n+1)}{2}}$$
     *Attention :* l'erreur la plus répandue est d'écrire $\sum_{k=0}^{n} (a_{k} - 1) = S_{n} - 1$ : la constante $1$ est retranchée à chacun des $n + 1$ termes.
- id: "ma-03-03"
  feuille: "f-ma-03"
  numero: 3
  partie: "Manipulation des symboles somme et produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes et produits]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 1
  page_corrige: 2
  enonce: |
    Soit $n \in \mathbb{N}$. Calculer les sommes suivantes.

    **(a)** $\displaystyle\sum_{k=0}^{n} (-1)^{k}$

    **(b)** $\displaystyle\sum_{k=2}^{n+1} k$

    **(c)** $\displaystyle\sum_{k=n+1}^{2n} 2k$

    **(d)** $\displaystyle\sum_{k=n+1}^{2n} 2^{k}$

    **(e)** $\displaystyle\sum_{k=0}^{2n} (-1)^{k} k$

    **(f)** $\displaystyle\sum_{k=0}^{n} (-1)^{n-k}$

    **(g)** $\displaystyle\sum_{k=-5}^{15} k\,(10 - k)$

    **(h)** $\displaystyle\sum_{k=1}^{n} (n - k + 1)$
  corrige: |
    • **(a)** C'est une somme géométrique de raison $-1$, qui vaut $1$ si $n$ est pair et $0$ s'il est impair. 
    $$\boxed{\sum_{k=0}^{n} (-1)^{k} = \frac{1 + (-1)^{n}}{2}}$$

    • **(b)** On retire le terme $k = 1$ à la somme de $1$ à $n + 1$ : $\dfrac{(n+1)(n+2)}{2} - 1$. 
    $$\boxed{\sum_{k=2}^{n+1} k = \frac{n(n+3)}{2}}$$

    • **(c)** Par différence, $2\Big(\displaystyle\sum_{k=1}^{2n} k - \sum_{k=1}^{n} k\Big) = 2n(2n+1) - n(n+1)$. 
    $$\boxed{\sum_{k=n+1}^{2n} 2k = n(3n + 1)}$$

    • **(d)** Somme géométrique de premier terme $2^{n+1}$, de raison $2$, à $n$ termes : $2^{n+1}(2^{n} - 1)$. 
    $$\boxed{\sum_{k=n+1}^{2n} 2^{k} = 2^{2n+1} - 2^{n+1}}$$

    • **(e)** On regroupe les termes deux par deux après le terme nul, ce qui donne $n$ paires valant $1$ : 
    $$(-1 + 2) + (-3 + 4) + \cdots + \big(-(2n-1) + 2n\big).$$

    $$\boxed{\sum_{k=0}^{2n} (-1)^{k} k = n}$$

    • **(f)** Le changement d'indice $j = n - k$ redonne la somme (a). 
    $$\boxed{\sum_{k=0}^{n} (-1)^{n-k} = \frac{1 + (-1)^{n}}{2}}$$

    • **(g)** La fonction $k \mapsto k(10 - k)$ est symétrique par rapport à $5$, ce qui invite à poser $j = k - 5$, qui décrit $[\![-10\,;10]\!]$. Alors $k(10 - k) = (5 + j)(5 - j) = 25 - j^{2}$, et 
    $$\sum_{k=-5}^{15} k(10 - k) = \sum_{j=-10}^{10} (25 - j^{2}) = 21 \times 25 - 2\sum_{j=1}^{10} j^{2} = 525 - 770.$$

    $$\boxed{\sum_{k=-5}^{15} k(10 - k) = -245}$$

    • **(h)** Le changement d'indice $j = n - k + 1$ donne la somme des entiers de $1$ à $n$. 
    $$\boxed{\sum_{k=1}^{n} (n - k + 1) = \frac{n(n+1)}{2}}$$
- id: "ma-03-04"
  feuille: "f-ma-03"
  numero: 4
  partie: "Manipulation des symboles somme et produit"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes et produits, produits, factorielle]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Donner une expression simple des produits suivants, à l'aide de puissances et de factorielles.

    **(a)** $\displaystyle\prod_{k=-1000}^{1000} (n^{2} - n)$

    **(b)** $\displaystyle\prod_{k=1}^{n} (2k)$

    **(c)** $\displaystyle\prod_{k=n+1}^{2n} k^{2}$

    **(d)** $\displaystyle\prod_{k=1}^{n} (2k + 1)$

    **(e)** $\displaystyle\prod_{k=0}^{n} \mathrm{e}^{-k}$

    **(f)** $\displaystyle\prod_{k=0}^{n} 2^{k}$

    **(g)** $\displaystyle\prod_{k=2}^{n} \Big(1 - \frac{1}{k}\Big)$

    **(h)** $\displaystyle\prod_{k=1}^{n} \frac{k+2}{k}$

    **(i)** $\displaystyle\prod_{k=1}^{n} (4k^{2} - 1)$

    **(j)** $\displaystyle\prod_{k=1}^{n} k\,(n + 1 - k)$
  corrige: |
    • **(a)** Le facteur ne dépend pas de $k$ : c'est un produit de $2001$ facteurs égaux. 
    $$\boxed{(n^{2} - n)^{2001}}$$

    • **(b)** On sort le facteur $2$ de chacun des $n$ facteurs : $\boxed{2^{n}\, n!}$

    • **(c)** $\displaystyle\prod_{k=n+1}^{2n} k = \frac{(2n)!}{n!}$, d'où $\boxed{\Big(\dfrac{(2n)!}{n!}\Big)^{2}}$

    • **(d)** On complète par les facteurs pairs : $(2n+1)! = \displaystyle\prod_{k=1}^{n} (2k) \times \prod_{k=0}^{n} (2k + 1)$, d'où $\boxed{\dfrac{(2n+1)!}{2^{n}\, n!}}$

    • **(e)** Le produit des exponentielles est l'exponentielle de la somme : $\boxed{\mathrm{e}^{-n(n+1)/2}}$

    • **(f)** De même, $\boxed{2^{n(n+1)/2}}$

    • **(g)** Produit télescopique, puisque $1 - \frac{1}{k} = \frac{k-1}{k}$ : $\boxed{\dfrac{1}{n}}$

    • **(h)** Produit télescopique de pas $2$ : $\displaystyle\prod_{k=1}^{n} \frac{k+2}{k} = \frac{3 \times 4 \times \cdots \times (n+2)}{1 \times 2 \times \cdots \times n}$, d'où $\boxed{\dfrac{(n+1)(n+2)}{2}}$

    • **(i)** On factorise $4k^{2} - 1 = (2k - 1)(2k + 1)$, et chaque produit se traite comme en (d) : 
    $$\prod_{k=1}^{n} (2k - 1) = \frac{(2n)!}{2^{n}\, n!} \qquad\text{et}\qquad \prod_{k=1}^{n} (2k + 1) = \frac{(2n+1)!}{2^{n}\, n!}.$$

    $$\boxed{\prod_{k=1}^{n} (4k^{2} - 1) = \frac{(2n)!\,(2n+1)!}{4^{n}\,(n!)^{2}}}$$
     Pour $n = 1$, on trouve bien $\frac{2 \times 6}{4} = 3$.

    • **(j)** On sépare les deux facteurs ; le changement d'indice $j = n + 1 - k$ montre que 
    $$\prod_{k=1}^{n} (n + 1 - k) = n!.$$

    $$\boxed{\prod_{k=1}^{n} k(n + 1 - k) = (n!)^{2}}$$

    *Piège :* en (a), l'indice $k$ ne figure pas dans le facteur ; seul compte le nombre de facteurs, qui vaut $2001$.
- id: "ma-03-05"
  feuille: "f-ma-03"
  numero: 5
  partie: "Manipulation des symboles somme et produit"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes et produits, "changement d'indice", sommes trigonométriques]
  noeuds: [n-sommes, ex-logarithme]
  notions: [logarithme]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    Soit $n \geqslant 2$ un entier. Démontrer les égalités suivantes à l'aide d'un changement d'indice bien choisi.

    **1.** $\displaystyle\sum_{k=1}^{n} \Big(\frac{1}{k} - \frac{1}{n + 1 - k}\Big) = 0$.

    **2.** $\displaystyle\sum_{k=n+1}^{2n-1} \ln\Big(\sin\frac{k\pi}{2n}\Big) = \sum_{k=1}^{n-1} \ln\Big(\sin\frac{k\pi}{2n}\Big)$.

    **3.** $\displaystyle\sum_{k=0}^{n} \frac{k}{n - k + 1} = (n + 1) \sum_{k=1}^{n+1} \frac{1}{k} - (n + 1)$.
  corrige: |
    **1.** Le changement d'indice $j = n + 1 - k$ est une bijection de $[\![1\,;n]\!]$ sur lui-même, donc 
    $$\sum_{k=1}^{n} \frac{1}{n+1-k} = \sum_{j=1}^{n} \frac{1}{j}.$$

    $$\boxed{\sum_{k=1}^{n} \Big(\frac{1}{k} - \frac{1}{n+1-k}\Big) = 0}$$
     La somme de droite est la même que celle de gauche, parcourue à l'envers : c'est l'argument de Gauss du cours.

    **2.** On pose $j = 2n - k$ : lorsque $k$ décrit $[\![n+1\,;2n-1]\!]$, $j$ décrit $[\![1\,;n-1]\!]$, et 
    $$\sin\frac{k\pi}{2n} = \sin\Big(\pi - \frac{j\pi}{2n}\Big) = \sin\frac{j\pi}{2n}.$$

    $$\boxed{\text{Les deux sommes sont égales.}}$$

    **3.** Le changement d'indice $j = n - k$ donne 
    $$\sum_{k=0}^{n} \frac{k}{n - k + 1} = \sum_{j=0}^{n} \frac{n - j}{j + 1} = \sum_{j=0}^{n} \frac{(n + 1) - (j + 1)}{j + 1} = (n + 1)\sum_{j=0}^{n} \frac{1}{j + 1} - (n + 1).$$

    $$\boxed{\sum_{k=0}^{n} \frac{k}{n - k + 1} = (n + 1)\sum_{k=1}^{n+1} \frac{1}{k} - (n + 1)}$$
- id: "ma-03-06"
  feuille: "f-ma-03"
  numero: 6
  partie: "Manipulation des symboles somme et produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes et produits, dénombrement]
  noeuds: [n-sommes, n-fini]
  notions: [ensemble-fini]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Pour $n \geqslant 1$, on pose $\displaystyle u_{n} = \sum_{k=n}^{2n} \frac{1}{k}$.

    **1.** Écrire $u_{1}$, $u_{2}$ et $u_{3}$ sous forme de fractions irréductibles.

    **2.** Exprimer $u_{n+1} - u_{n}$ sous la forme d'une seule fraction. L'erreur la plus répandue consiste à croire que $u_{n+1} - u_{n}$ ne comporte qu'un terme : combien de termes de $u_{n}$ disparaissent-ils, et combien de termes nouveaux apparaissent-ils ?

    **3.** En déduire le sens de variation de la suite $(u_{n})_{n \geqslant 1}$.
  corrige: |
    **1.** On calcule directement : 
    $$\boxed{u_{1} = 1 + \frac{1}{2} = \frac{3}{2} \qquad u_{2} = \frac{1}{2} + \frac{1}{3} + \frac{1}{4} = \frac{13}{12} \qquad u_{3} = \frac{1}{3} + \frac{1}{4} + \frac{1}{5} + \frac{1}{6} = \frac{19}{20}}$$

    **2.** La somme $u_{n+1}$ va de $n + 1$ à $2n + 2$ : par rapport à $u_{n}$, elle perd le terme $\frac{1}{n}$ et gagne les deux termes $\frac{1}{2n+1}$ et $\frac{1}{2n+2}$. 
    $$u_{n+1} - u_{n} = \frac{1}{2n+1} + \frac{1}{2n+2} - \frac{1}{n} = \frac{2n(n+1) + n(2n+1) - 2(n+1)(2n+1)}{2n(n+1)(2n+1)}.$$

    $$\boxed{u_{n+1} - u_{n} = -\frac{3n + 2}{2n(n+1)(2n+1)}}$$

    **3.** Cette différence est strictement négative. 
    $$\boxed{\text{La suite } (u_{n}) \text{ est strictement décroissante.}}$$
     Étant minorée par $0$, elle converge, d'après le chapitre 7 ; le chapitre 18 montrera que sa limite est $\ln 2$.
- id: "ma-03-07"
  feuille: "f-ma-03"
  numero: 7
  partie: "Manipulation des symboles somme et produit"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes et produits]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 2
  page_corrige: 4
  enonce: |
    Soit $n \geqslant 1$ et $x_{1}$, …, $x_{n}$ des réels.

    **1.** Pour quelle valeur du réel $\xi$ a-t-on $\displaystyle\sum_{k=1}^{n} (x_{k} - \xi) = 0$ ? Interpréter.

    **2.** On suppose que $\displaystyle\sum_{k=1}^{n} x_{k} = n$ et $\displaystyle\sum_{k=1}^{n} x_{k}^{2} = n$. Développer $\displaystyle\sum_{k=1}^{n} (x_{k} - 1)^{2}$, et en déduire que tous les $x_{k}$ sont égaux à $1$.
  corrige: |
    **1.** Par linéarité, $\sum_{k=1}^{n} (x_{k} - \xi) = \sum_{k=1}^{n} x_{k} - n\xi$. 
    $$\boxed{\xi = \frac{1}{n}\sum_{k=1}^{n} x_{k}}$$
     C'est la moyenne des $x_{k}$ : c'est l'unique réel autour duquel les écarts se compensent exactement.

    **2.** En développant, puis en utilisant les deux hypothèses, 
    $$\sum_{k=1}^{n} (x_{k} - 1)^{2} = \sum_{k=1}^{n} x_{k}^{2} - 2\sum_{k=1}^{n} x_{k} + n = n - 2n + n = 0.$$
     Une somme de réels positifs n'est nulle que si chaque terme est nul. 
    $$\boxed{x_{k} = 1 \text{ pour tout } k}$$
     Les hypothèses disent que la moyenne vaut $1$ et que la moyenne des carrés vaut $1$ : la variance, moyenne des carrés des écarts à la moyenne, est donc nulle.
- id: "ma-03-08"
  feuille: "f-ma-03"
  numero: 8
  partie: "Manipulation des symboles somme et produit"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes et produits, somme géométrique, factorielle]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $(u_{n})_{n \geqslant 1}$ une suite croissante de réels strictement positifs, et $n \geqslant 1$. On veut montrer que 
    $$\forall k \in [\![1\,;n]\!],\quad (u_{1} u_{2} \cdots u_{k})^{n} \leqslant (u_{1} u_{2} \cdots u_{n})^{k}.$$

    **1.** Interpréter cette inégalité à l'aide des moyennes géométriques $g_{k} = (u_{1} \cdots u_{k})^{1/k}$.

    **2.** Pour $k \in [\![1\,;n]\!]$, comparer $(u_{1} \cdots u_{k})^{n-k}$ et $(u_{k+1} \cdots u_{n})^{k}$, en minorant chaque facteur du second produit par $u_{k}$.

    **3.** Conclure.
  corrige: |
    **1.** En élevant l'inégalité à la puissance $\frac{1}{kn}$, qui est croissante sur $\mathbb{R}_{+}$, elle équivaut à 
    $$\boxed{g_{k} \leqslant g_{n}}$$
     la moyenne géométrique des $k$ premiers termes d'une suite croissante est inférieure à celle des $n$ premiers.

    **2.** Chacun des $k$ facteurs $u_{1}$, …, $u_{k}$ est majoré par $u_{k}$, et chacun des $n - k$ facteurs $u_{k+1}$, …, $u_{n}$ est minoré par $u_{k}$, la suite étant croissante. Tous les nombres étant strictement positifs, 
    $$(u_{1} \cdots u_{k})^{n-k} \leqslant u_{k}^{\,k(n-k)} \leqslant (u_{k+1} \cdots u_{n})^{k}.$$

    **3.** On multiplie l'inégalité précédente par $(u_{1} \cdots u_{k})^{k} > 0$ : 
    $$(u_{1} \cdots u_{k})^{n} \leqslant (u_{1} \cdots u_{k})^{k} \times (u_{k+1} \cdots u_{n})^{k} = (u_{1} \cdots u_{n})^{k}.$$

    $$\boxed{(u_{1} u_{2} \cdots u_{k})^{n} \leqslant (u_{1} u_{2} \cdots u_{n})^{k}}$$
     *À retenir :* on compare deux produits en les découpant en blocs que l'on sait comparer facteur à facteur ; c'est le pendant multiplicatif de la relation de Chasles.
- id: "ma-03-09"
  feuille: "f-ma-03"
  numero: 9
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes télescopiques]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Calculer $\displaystyle S = \frac{1}{2^{10}} + \frac{1}{2^{20}} + \frac{1}{2^{30}} + \cdots + \frac{1}{2^{1000}}$ et, pour $n \in \mathbb{N}$, $\displaystyle T_{n} = \sum_{k=0}^{n} \frac{2^{k-1}}{3^{k+1}}$.

    **2.** On pose $u_{k} = (-2)^{k}$. Calculer, pour $n \in \mathbb{N}$, 
    $$\sum_{k=0}^{2n} u_{k}, \qquad \sum_{k=0}^{2n+1} u_{k}, \qquad \sum_{k=0}^{n} u_{2k}, \qquad \sum_{k=0}^{2n} (u_{k} + n), \qquad \Big(\sum_{k=0}^{2n} u_{k}\Big) + n, \qquad \sum_{k=0}^{n} u_{k+n}.$$
  corrige: |
    **1.** La somme $S$ a $100$ termes, de premier terme $2^{-10}$ et de raison $2^{-10}$. Pour $T_{n}$, on sort le facteur $\frac{1}{6}$ : $T_{n} = \frac{1}{6}\sum_{k=0}^{n} \big(\frac{2}{3}\big)^{k}$. 
    $$\boxed{S = \frac{1}{2^{10}} \cdot \frac{1 - 2^{-1000}}{1 - 2^{-10}} = \frac{1 - 2^{-1000}}{2^{10} - 1} \qquad T_{n} = \frac{1}{2} - \frac{1}{3}\Big(\frac{2}{3}\Big)^{n}}$$

    **2.** On applique la formule de la somme géométrique, de raison $-2$ ou $4$ : 
    $$\boxed{\sum_{k=0}^{2n} u_{k} = \frac{1 + 2^{2n+1}}{3} \qquad \sum_{k=0}^{2n+1} u_{k} = \frac{1 - 2^{2n+2}}{3} \qquad \sum_{k=0}^{n} u_{2k} = \frac{4^{n+1} - 1}{3}}$$

    $$\boxed{\sum_{k=0}^{2n} (u_{k} + n) = \frac{1 + 2^{2n+1}}{3} + n(2n+1) \qquad \Big(\sum_{k=0}^{2n} u_{k}\Big) + n = \frac{1 + 2^{2n+1}}{3} + n}$$

    $$\boxed{\sum_{k=0}^{n} u_{k+n} = (-2)^{n}\,\frac{1 - (-2)^{n+1}}{3}}$$
     *Piège :* les quatrième et cinquième sommes diffèrent : dans la première, la constante $n$ est ajoutée à chacun des $2n + 1$ termes. Les parenthèses ne sont pas décoratives.
- id: "ma-03-10"
  feuille: "f-ma-03"
  numero: 10
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes télescopiques]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    Soit $n \geqslant 2$ un entier.

    **1.** Calculer $\displaystyle\sum_{p=1}^{n} \ln\Big(1 + \frac{1}{p}\Big)$ et $\displaystyle\sum_{k=2}^{n} \frac{1}{k^{2} - 1}$.

    **2.** Déterminer deux réels $a$ et $b$ tels que, pour tout $k \in \mathbb{N}$, $\dfrac{1}{(k+1)(k+3)} = \dfrac{a}{k+1} + \dfrac{b}{k+3}$, puis calculer $\displaystyle\sum_{k=0}^{n} \frac{1}{(k+1)(k+3)}$.

    **3.** Déterminer trois réels $a$, $b$, $c$ tels que, pour tout $k \geqslant 1$, $\dfrac{1}{k(k+1)(k+2)} = \dfrac{a}{k} + \dfrac{b}{k+1} + \dfrac{c}{k+2}$, puis calculer $\displaystyle\sum_{k=1}^{n} \frac{1}{k(k+1)(k+2)}$.
  corrige: |
    **1.** On écrit $\ln\big(1 + \frac{1}{p}\big) = \ln(p + 1) - \ln p$, et $\frac{1}{k^{2}-1} = \frac{1}{2}\big(\frac{1}{k-1} - \frac{1}{k+1}\big)$ ; dans le second cas, le télescopage se fait avec un pas de $2$, et il reste deux termes à chaque bout. 
    $$\boxed{\sum_{p=1}^{n} \ln\Big(1 + \frac{1}{p}\Big) = \ln(n + 1) \qquad \sum_{k=2}^{n} \frac{1}{k^{2} - 1} = \frac{1}{2}\Big(1 + \frac{1}{2} - \frac{1}{n} - \frac{1}{n+1}\Big) = \frac{3}{4} - \frac{2n + 1}{2n(n+1)}}$$

    **2.** En réduisant au même dénominateur, $a(k + 3) + b(k + 1) = 1$ pour tout $k$, donc $a + b = 0$ et $3a + b = 1$. 
    $$\boxed{a = \frac{1}{2},\ b = -\frac{1}{2} \qquad \sum_{k=0}^{n} \frac{1}{(k+1)(k+3)} = \frac{1}{2}\Big(1 + \frac{1}{2} - \frac{1}{n+2} - \frac{1}{n+3}\Big) = \frac{3}{4} - \frac{2n + 5}{2(n+2)(n+3)}}$$

    **3.** En multipliant par $k$ puis en faisant $k = 0$, on obtient $a = \frac{1}{2}$ ; de même, $b = -1$ et $c = \frac{1}{2}$. On regroupe les termes en deux différences de même forme : 
    $$\frac{1}{k(k+1)(k+2)} = \frac{1}{2}\Big(\frac{1}{k(k+1)} - \frac{1}{(k+1)(k+2)}\Big).$$

    $$\boxed{\sum_{k=1}^{n} \frac{1}{k(k+1)(k+2)} = \frac{1}{4} - \frac{1}{2(n+1)(n+2)} = \frac{n(n+3)}{4(n+1)(n+2)}}$$
     *À retenir :* ces décompositions sont des décompositions en éléments simples, qui seront systématisées au chapitre 13.
- id: "ma-03-11"
  feuille: "f-ma-03"
  numero: 11
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sommes télescopiques, récurrence]
  noeuds: [n-sommes, n-recurrence]
  notions: []
  page_enonce: 3
  page_corrige: 6
  enonce: |
    **1.** Soit $n \geqslant 1$. Calculer $\displaystyle\sum_{k=1}^{2n} (-1)^{k} k$ en regroupant les termes deux par deux.

    **2.** Montrer par récurrence que, pour tout $n \geqslant 1$, $\displaystyle\sum_{k=1}^{n} (-1)^{k} k = \frac{(-1)^{n}(2n+1) - 1}{4}$, et vérifier la cohérence avec la question 1.

    **3.** Calculer $\displaystyle\sum_{k=n}^{3n} \min(k, 2n)$, en découpant la somme en deux.
  corrige: |
    **1.** Les $2n$ termes forment $n$ paires $(-(2p - 1) + 2p) = 1$. 
    $$\boxed{\sum_{k=1}^{2n} (-1)^{k} k = n}$$

    **2.** Notons $T_{n}$ la somme. Pour $n = 1$, $T_{1} = -1 = \frac{-3 - 1}{4}$. Si la formule est vraie au rang $n$, alors 
    $$\begin{aligned} T_{n+1} &= \frac{(-1)^{n}(2n+1) - 1}{4} + (-1)^{n+1}(n + 1) \\ &= \frac{(-1)^{n+1}\big(-(2n+1) + 4(n+1)\big) - 1}{4} = \frac{(-1)^{n+1}(2n+3) - 1}{4}. \end{aligned}$$

    $$\boxed{\sum_{k=1}^{n} (-1)^{k} k = \frac{(-1)^{n}(2n+1) - 1}{4}}$$
     Pour $2n$ termes, on trouve $\frac{(4n+1) - 1}{4} = n$, en accord avec la question 1.

    **3.** Pour $k \leqslant 2n$, le minimum vaut $k$, et pour $k > 2n$, il vaut $2n$ : 
    $$\sum_{k=n}^{3n} \min(k, 2n) = \sum_{k=n}^{2n} k + \sum_{k=2n+1}^{3n} 2n = \frac{3n(n+1)}{2} + 2n^{2}.$$

    $$\boxed{\sum_{k=n}^{3n} \min(k, 2n) = \frac{n(7n + 3)}{2}}$$
     Pour $n = 1$, on trouve bien $1 + 2 + 2 = 5$.
- id: "ma-03-12"
  feuille: "f-ma-03"
  numero: 12
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes télescopiques, télescopage]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 4
  page_corrige: 6
  enonce: |
    **1.** En calculant de deux façons la somme télescopique $\displaystyle\sum_{k=0}^{n} \big((k+1)^{4} - k^{4}\big)$, et en utilisant les sommes usuelles du cours, obtenir une expression de $\displaystyle\sum_{k=0}^{n} k^{3}$. Comparer avec le carré de $\displaystyle\sum_{k=0}^{n} k$.

    **2.** On pose, pour $n \in \mathbb{N}$, $\displaystyle f(n) = \frac{n^{5}}{5} + \frac{n^{4}}{2} + \frac{n^{3}}{3} - \frac{n}{30}$. Montrer que $f(n) - f(n-1) = n^{4}$ pour tout $n \geqslant 1$, et en déduire que $f(n)$ est un entier pour tout $n \in \mathbb{N}$.
  corrige: |
    **1.** La somme télescopique vaut $(n+1)^{4}$. En développant $(k+1)^{4} - k^{4} = 4k^{3} + 6k^{2} + 4k + 1$, 
    $$(n + 1)^{4} = 4\sum_{k=0}^{n} k^{3} + n(n+1)(2n+1) + 2n(n+1) + (n + 1).$$
     On isole la somme cherchée, et l'on factorise par $(n + 1)$, puis par $n$ : 
    $$4\sum_{k=0}^{n} k^{3} = (n+1)\big((n+1)^{3} - n(2n+1) - 2n - 1\big) = (n + 1)(n^{3} + n^{2}) = n^{2}(n+1)^{2}.$$

    $$\boxed{\sum_{k=0}^{n} k^{3} = \frac{n^{2}(n+1)^{2}}{4} = \Big(\sum_{k=0}^{n} k\Big)^{2}}$$

    **2.** Le calcul, un peu long mais sans difficulté, donne $f(n) - f(n-1) = n^{4}$ : on développe $(n-1)^{5}$, $(n-1)^{4}$ et $(n-1)^{3}$ par la formule du binôme, et les termes de degré $5$, $3$, $2$, $1$ et $0$ se compensent. Comme $f(0) = 0$, une somme télescopique donne 
    $$f(n) = \sum_{k=1}^{n} \big(f(k) - f(k-1)\big) = \sum_{k=1}^{n} k^{4},$$
     qui est une somme d'entiers. 
    $$\boxed{f(n) = \sum_{k=1}^{n} k^{4} = \frac{n(n+1)(2n+1)(3n^{2} + 3n - 1)}{30} \in \mathbb{N}}$$
     *À retenir :* pour montrer qu'une fraction est entière, il suffit parfois de la reconnaître comme une somme d'entiers. Une démonstration arithmétique directe, par les congruences modulo $2$, $3$ et $5$, serait bien plus laborieuse.
- id: "ma-03-13"
  feuille: "f-ma-03"
  numero: 13
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes télescopiques]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 4
  page_corrige: 7
  enonce: |
    **1.** Déterminer deux réels $a$ et $b$ tels que la suite $u_{k} = (ak + b)\,2^{k}$ vérifie $u_{k+1} - u_{k} = (k + 2)\,2^{k}$ pour tout $k \in \mathbb{N}$. En déduire $\displaystyle\sum_{k=0}^{n} (k + 2)\,2^{k}$.

    **2.** Par la même méthode, en cherchant $u_{k} = (ak^{2} + bk + c)\,2^{k}$, calculer $\displaystyle\sum_{k=0}^{n} k^{2}\, 2^{k}$.
  corrige: |
    **1.** On a $u_{k+1} - u_{k} = \big(2a(k+1) + 2b - ak - b\big)2^{k} = (ak + 2a + b)\,2^{k}$. L'identification donne $a = 1$ et $2a + b = 2$. 
    $$\boxed{u_{k} = k\,2^{k} \qquad \sum_{k=0}^{n} (k + 2)\,2^{k} = u_{n+1} - u_{0} = (n + 1)\,2^{n+1}}$$

    **2.** De même, $u_{k+1} - u_{k} = \big(ak^{2} + (4a + b)k + (2a + 2b + c)\big)2^{k}$, et l'identification avec $k^{2}2^{k}$ donne $a = 1$, $4a + b = 0$, $2a + 2b + c = 0$. 
    $$\boxed{u_{k} = (k^{2} - 4k + 6)\,2^{k} \qquad \sum_{k=0}^{n} k^{2}\,2^{k} = (n^{2} - 2n + 3)\,2^{n+1} - 6}$$
     Pour $n = 2$, on vérifie $0 + 2 + 16 = 18 = 3 \times 8 - 6$.
- id: "ma-03-14"
  feuille: "f-ma-03"
  numero: 14
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 3
  types: [Calcul]
  mots_cles: [sommes télescopiques, somme géométrique]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 4
  page_corrige: 7
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $q \in \mathbb{R} \setminus \{1\}$. Le but est de calculer de trois façons la somme 
    $$S_{n} = \sum_{k=0}^{n} k\, q^{k}.$$

    **1.** Exprimer $S_{n+1}$ en fonction de $S_{n}$ de deux façons différentes, l'une en isolant le dernier terme, l'autre par la translation d'indice $k \mapsto k + 1$. En déduire $S_{n}$.

    **2.** Calculer $(q - 1)\,S_{n}$ en faisant apparaître une somme géométrique, et retrouver $S_{n}$.

    **3.** On considère la fonction $\sigma : \mathbb{R} \setminus \{1\} \to \mathbb{R}$, $x \mapsto \displaystyle\sum_{k=0}^{n} x^{k}$. Calculer sa dérivée de deux façons, et retrouver $S_{n}$.
  corrige: |
    **1.** D'une part, $S_{n+1} = S_{n} + (n + 1)q^{n+1}$. D'autre part, le terme d'indice $0$ étant nul, la translation $k \mapsto k + 1$ donne 
    $$S_{n+1} = \sum_{k=0}^{n} (k + 1)q^{k+1} = q\,S_{n} + q\,\frac{1 - q^{n+1}}{1 - q}.$$
     En égalant les deux expressions, puis en multipliant par $1 - q$ : 
    $$(1 - q)S_{n} = q\,\frac{1 - q^{n+1}}{1 - q} - (n + 1)q^{n+1}.$$

    $$\boxed{S_{n} = \frac{n\,q^{n+2} - (n + 1)\,q^{n+1} + q}{(q - 1)^{2}}}$$

    **2.** On calcule, par translation d'indice, 
    $$(q - 1)S_{n} = \sum_{k=0}^{n} k\,q^{k+1} - \sum_{k=0}^{n} k\,q^{k} = n\,q^{n+1} - \sum_{k=1}^{n} q^{k} = n\,q^{n+1} - q\,\frac{1 - q^{n}}{1 - q},$$
     et l'on retrouve la même expression en divisant par $q - 1$.

    **3.** D'une part, $\sigma(x) = \frac{1 - x^{n+1}}{1 - x}$, dont la dérivée est 
    $$\sigma'(x) = \frac{n x^{n+1} - (n + 1)x^{n} + 1}{(1 - x)^{2}}.$$
     D'autre part, en dérivant la somme terme à terme, $\sigma'(x) = \sum_{k=1}^{n} k x^{k-1}$, donc $S_{n} = q\,\sigma'(q)$, ce qui redonne la formule. *À retenir :* la troisième méthode est la plus rapide et se généralise aux sommes $\sum k^{2} q^{k}$ en dérivant deux fois. Elle annonce l'étude des séries entières de deuxième année.
- id: "ma-03-15"
  feuille: "f-ma-03"
  numero: 15
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 2
  types: [Démonstration]
  mots_cles: [sommes télescopiques, factorielle]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    **1.** Montrer que, pour tout $n \in \mathbb{N}^{*}$ et tout réel $a > 1$, $\dfrac{a^{n} - 1}{a - 1} \leqslant n\,a^{n-1}$. On pourra utiliser la factorisation de $a^{n} - 1$.

    **2.** Montrer que, pour tout $n \geqslant 1$, $\displaystyle\sum_{k=1}^{n} k! \leqslant (n + 1)!$, puis que $\displaystyle\sum_{k=1}^{n} k! \leqslant 2 \cdot n!$ pour tout $n \geqslant 1$.
  corrige: |
    **1.** La factorisation du cours donne $\frac{a^{n} - 1}{a - 1} = \sum_{k=0}^{n-1} a^{k}$. Comme $a > 1$, chacun des $n$ termes est majoré par $a^{n-1}$. 
    $$\boxed{\frac{a^{n} - 1}{a - 1} \leqslant n\,a^{n-1}}$$

    **2.** Pour la seconde inégalité, qui entraîne la première puisque $2 \cdot n! \leqslant (n+1)!$, on raisonne par récurrence. Pour $n = 1$, $1 \leqslant 2$. Si $\sum_{k=1}^{n} k! \leqslant 2 \cdot n!$, alors 
    $$\sum_{k=1}^{n+1} k! \leqslant 2 \cdot n! + (n + 1)! \leqslant (n + 1)! + (n + 1)! = 2\,(n + 1)!,$$
     puisque $2 \cdot n! \leqslant (n + 1) \cdot n!$. 
    $$\boxed{\sum_{k=1}^{n} k! \leqslant 2 \cdot n! \leqslant (n + 1)!}$$
     La somme est dominée par son dernier terme : c'est la croissance très rapide de la factorielle, que le chapitre 10 précisera.
- id: "ma-03-16"
  feuille: "f-ma-03"
  numero: 16
  partie: "Sommes usuelles et sommes télescopiques"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes télescopiques]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 4
  page_corrige: 8
  enonce: |
    *Transformation d'Abel.* Soit $(a_{k})_{k \geqslant 0}$ et $(B_{k})_{k \geqslant 0}$ deux suites de réels. On pose $A_{n} = \displaystyle\sum_{k=0}^{n} a_{k}$ et $b_{k} = B_{k+1} - B_{k}$.

    **1.** Montrer que, pour tout $n \geqslant 1$, 
    $$\sum_{k=0}^{n} a_{k} B_{k} = A_{n} B_{n} - \sum_{k=0}^{n-1} A_{k}\, b_{k}.$$
     *On remarquera l'analogie avec la formule d'intégration par parties.*

    **2.** On note $H_{n} = \displaystyle\sum_{k=1}^{n} \frac{1}{k}$ pour $n \geqslant 1$. Montrer que $\displaystyle\sum_{k=1}^{n} H_{k} = (n + 1)\,H_{n} - n$.

    **3.** Montrer de même que $\displaystyle\sum_{k=1}^{n} k\,H_{k} = \frac{n(n+1)}{2}\,H_{n} - \frac{n(n-1)}{4}$.
  corrige: |
    **1.** On pose $A_{-1} = 0$, de sorte que $a_{k} = A_{k} - A_{k-1}$ pour tout $k \geqslant 0$. Par translation d'indice, 
    $$\sum_{k=0}^{n} a_{k}B_{k} = \sum_{k=0}^{n} A_{k}B_{k} - \sum_{k=0}^{n-1} A_{k}B_{k+1} = A_{n}B_{n} - \sum_{k=0}^{n-1} A_{k}\,(B_{k+1} - B_{k}).$$

    $$\boxed{\sum_{k=0}^{n} a_{k}B_{k} = A_{n}B_{n} - \sum_{k=0}^{n-1} A_{k}\,b_{k}}$$
     C'est l'analogue discret de $\int_{a}^{b} f'g = [fg]_{a}^{b} - \int_{a}^{b} fg'$, que l'on verra au chapitre 6 : $A$ joue le rôle de la primitive $f$ de $a$, et $b$ celui de la dérivée $g'$ de $B$.

    **2.** On applique la formule à des familles indexées à partir de $1$, ce qui ne change rien à la démonstration, avec $a_{k} = 1$, donc $A_{k} = k$, et $B_{k} = H_{k}$, donc $b_{k} = \frac{1}{k+1}$ : 
    $$\sum_{k=1}^{n} H_{k} = n\,H_{n} - \sum_{k=1}^{n-1} \frac{k}{k + 1} = n\,H_{n} - (n - 1) + \sum_{k=1}^{n-1} \frac{1}{k + 1} = n\,H_{n} - (n - 1) + (H_{n} - 1).$$

    $$\boxed{\sum_{k=1}^{n} H_{k} = (n + 1)\,H_{n} - n}$$

    **3.** Avec $a_{k} = k$, donc $A_{k} = \frac{k(k+1)}{2}$, et la même suite $B_{k} = H_{k}$ : 
    $$\sum_{k=1}^{n} k\,H_{k} = \frac{n(n+1)}{2}\,H_{n} - \sum_{k=1}^{n-1} \frac{k(k+1)}{2(k+1)} = \frac{n(n+1)}{2}\,H_{n} - \frac{1}{2}\sum_{k=1}^{n-1} k.$$

    $$\boxed{\sum_{k=1}^{n} k\,H_{k} = \frac{n(n+1)}{2}\,H_{n} - \frac{n(n-1)}{4}}$$
     Pour $n = 2$, on vérifie $1 + 2 \times \frac{3}{2} = 4 = 3 \times \frac{3}{2} - \frac{1}{2}$.
- id: "ma-03-17"
  feuille: "f-ma-03"
  numero: 17
  partie: "Sommes doubles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes doubles, factorielle]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    ![Figure](documents/figures/8b234f652e45b20c.svg)

    Les figures représentent, pour $n = 4$ et $m = 6$, les ensembles d'indices $(i,j)$ des trois sommes suivantes, que l'on demande d'écrire en sommant d'abord sur $i$ : 
    $$S_{1} = \sum_{i=0}^{n} \sum_{j=i}^{n} a_{i,j}, \qquad S_{2} = \sum_{i=0}^{n} \sum_{j=0}^{n-i} a_{i,j}, \qquad S_{3} = \sum_{i=0}^{n} \sum_{j=i}^{m} a_{i,j} \quad (n \leqslant m).$$
  corrige: |
    On décrit chaque ensemble d'indices par des inégalités, puis on lit les bornes en fixant d'abord $j$ ; le dessin de l'énoncé permet de vérifier, colonne par colonne, quelles valeurs de $i$ correspondent à chaque $j$.

    • **$S_{1}$.** L'ensemble est $0 \leqslant i \leqslant j \leqslant n$ : pour $j$ fixé, $i$ va de $0$ à $j$.

    • **$S_{2}$.** L'ensemble est $i \geqslant 0$, $j \geqslant 0$, $i + j \leqslant n$ : pour $j$ fixé, $i$ va de $0$ à $n - j$.

    • **$S_{3}$.** L'ensemble est $0 \leqslant i \leqslant n$ et $i \leqslant j \leqslant m$ : pour $j$ fixé, $i$ va de $0$ à $\min(j, n)$, ce qui oblige à distinguer $j \leqslant n$ et $j > n$.

    $$\boxed{S_{1} = \sum_{j=0}^{n} \sum_{i=0}^{j} a_{i,j} \qquad S_{2} = \sum_{j=0}^{n} \sum_{i=0}^{n-j} a_{i,j} \qquad S_{3} = \sum_{j=0}^{n} \sum_{i=0}^{j} a_{i,j} + \sum_{j=n+1}^{m} \sum_{i=0}^{n} a_{i,j}}$$
     *Piège :* pour $S_{3}$, la forme trapézoïdale de l'ensemble d'indices ne se laisse pas décrire par une seule somme double à bornes simples ; on la découpe en un triangle et un rectangle, par la relation de Chasles.
- id: "ma-03-18"
  feuille: "f-ma-03"
  numero: 18
  partie: "Sommes doubles"
  etoiles: 2
  types: [Calcul]
  mots_cles: [sommes doubles]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 5
  page_corrige: 9
  enonce: |
    Soit $n \in \mathbb{N}^{*}$. Calculer les sommes suivantes, où $i$ et $j$ sont des entiers.

    **(a)** $\displaystyle\sum_{1 \leqslant i \leqslant j \leqslant n} 1$

    **(b)** $\displaystyle\sum_{1 \leqslant i, j \leqslant n} i$

    **(c)** $\displaystyle\sum_{1 \leqslant i \leqslant j \leqslant n} i$

    **(d)** $\displaystyle\sum_{1 \leqslant i \leqslant j \leqslant n} (i + j)$

    **(e)** $\displaystyle\sum_{1 \leqslant i, j \leqslant n} (i + j)^{2}$

    **(f)** $\displaystyle\sum_{1 \leqslant i, j \leqslant n} |j - i|$

    **(g)** $\displaystyle\sum_{1 \leqslant i \leqslant j \leqslant n} \frac{i^{2}}{j}$

    **(h)** $\displaystyle\sum_{i=1}^{n} \sum_{j=1}^{n} \max(i, j)$

    **(i)** $\displaystyle\sum_{i=1}^{n} \sum_{j=1}^{n} \min(i, j)$

    **(j)** $\displaystyle\sum_{1 \leqslant i, j \leqslant n} 3^{i+j}$
  corrige: |
    On utilise les sommes usuelles du cours et la proposition 8 sur les sommes triangulaires.

    • **(a)** On somme $1$ sur $j$ couples pour chaque $j$ : $\sum_{j=1}^{n} j$. 
    $$\boxed{\frac{n(n+1)}{2}}$$

    • **(b)** Le terme ne dépend pas de $j$ : $\sum_{j=1}^{n} \sum_{i=1}^{n} i = n \times \frac{n(n+1)}{2}$. 
    $$\boxed{\frac{n^{2}(n+1)}{2}}$$

    • **(c)** On somme d'abord sur $i$ : $\sum_{j=1}^{n} \frac{j(j+1)}{2} = \frac{1}{2}\big(\frac{n(n+1)(2n+1)}{6} + \frac{n(n+1)}{2}\big)$. 
    $$\boxed{\frac{n(n+1)(n+2)}{6}}$$

    • **(d)** On ajoute à (c) la somme $\sum_{j=1}^{n} j \times j = \frac{n(n+1)(2n+1)}{6}$. 
    $$\boxed{\frac{n(n+1)^{2}}{2}}$$

    • **(e)** On développe $(i + j)^{2} = i^{2} + 2ij + j^{2}$ : les deux termes carrés donnent chacun $n \cdot \frac{n(n+1)(2n+1)}{6}$, et le terme rectangle $2\big(\frac{n(n+1)}{2}\big)^{2}$. 
    $$\boxed{\frac{n^{2}(n+1)(7n + 5)}{6}}$$

    • **(f)** Par symétrie, c'est le double de la somme sur $i < j$ de $j - i$. Pour $j$ fixé, $\sum_{i=1}^{j-1} (j - i) = \frac{j(j-1)}{2}$, et $\sum_{j=1}^{n} \frac{j(j-1)}{2} = \frac{(n-1)n(n+1)}{6}$. 
    $$\boxed{\frac{(n-1)n(n+1)}{3}}$$

    • **(g)** On somme d'abord sur $i$, ce qui fait disparaître le dénominateur : $\sum_{j=1}^{n} \frac{(j+1)(2j+1)}{6}$. 
    $$\boxed{\frac{n(4n^{2} + 15n + 17)}{36}}$$

    • **(h)** Pour $i$ fixé, $\sum_{j=1}^{n} \max(i,j) = i \times i + \sum_{j=i+1}^{n} j = i^{2} + \frac{n(n+1)}{2} - \frac{i(i+1)}{2}$. En sommant sur $i$ : 
    $$\boxed{\frac{n(n+1)(4n - 1)}{6}}$$

    • **(i)** On utilise $\min(i,j) + \max(i,j) = i + j$, dont la somme double vaut $n^{2}(n+1)$. 
    $$\boxed{\frac{n(n+1)(2n+1)}{6}}$$

    • **(j)** Le terme est un produit $3^{i} \times 3^{j}$ : la somme double est le carré de $\sum_{i=1}^{n} 3^{i} = \frac{3(3^{n} - 1)}{2}$. 
    $$\boxed{\frac{9\,(3^{n} - 1)^{2}}{4}}$$

    *À retenir :* le résultat (i) est la somme des carrés, et ce n'est pas un hasard. Pour tout entier $k$ entre $1$ et $n$, on a $\min(i,j) \geqslant k$ pour exactement $(n - k + 1)^{2}$ couples, ceux de $[\![k\,;n]\!]^{2}$ ; en écrivant $\min(i,j)$ comme le nombre d'entiers $k \geqslant 1$ tels que $k \leqslant \min(i,j)$, puis en intervertissant, on obtient $\sum_{k=1}^{n} (n - k + 1)^{2} = \sum_{k=1}^{n} k^{2}$. Toutes ces formules ont été vérifiées pour $n \leqslant 7$.
- id: "ma-03-19"
  feuille: "f-ma-03"
  numero: 19
  partie: "Sommes doubles"
  etoiles: 1
  types: [Calcul]
  mots_cles: [sommes doubles, produits]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 5
  page_corrige: 10
  enonce: |
    Soit $n \in \mathbb{N}^{*}$ et $x$ un réel strictement positif. Simplifier les produits suivants. 
    $$\prod_{1 \leqslant i, j \leqslant n} x^{i+j}, \qquad \prod_{1 \leqslant i, j \leqslant n} i^{\,j}, \qquad \prod_{1 \leqslant i, j \leqslant n} ij.$$
  corrige: |
    Le produit d'exponentielles de même base est l'exponentielle de la somme des exposants, ce qui ramène les deux premiers produits à des sommes doubles. Pour le troisième, on sépare les facteurs. 
    $$\prod_{1 \leqslant i,j \leqslant n} x^{i+j} = x^{\sum (i+j)} = x^{n^{2}(n+1)}, \qquad \prod_{i=1}^{n} \prod_{j=1}^{n} i^{\,j} = \prod_{i=1}^{n} i^{\,n(n+1)/2}.$$

    $$\boxed{x^{n^{2}(n+1)} \qquad (n!)^{n(n+1)/2} \qquad (n!)^{2n}}$$
     Dans le dernier, chaque $i$ apparaît $n$ fois, de même que chaque $j$ : $\prod_{i,j} ij = \big(\prod_{i} i\big)^{n} \big(\prod_{j} j\big)^{n}$.
- id: "ma-03-20"
  feuille: "f-ma-03"
  numero: 20
  partie: "Sommes doubles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sommes doubles, factorielle]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 6
  page_corrige: 10
  enonce: |
    Pour $n \in \mathbb{N}$, on note $\displaystyle S_{n} = \sum_{1 \leqslant i, j \leqslant n} ij$, avec $S_{0} = 0$.

    **1.** Exprimer $S_{n}$ en fonction de $\displaystyle\sum_{k=1}^{n} k$.

    **2.** Soit $(a_{i,j})_{(i,j) \in [\![1\,;n+1]\!]^{2}}$ une famille de réels. Montrer que 
    $$\sum_{1 \leqslant i, j \leqslant n+1} a_{i,j} = \sum_{1 \leqslant i, j \leqslant n} a_{i,j} + \sum_{i=1}^{n} a_{i,n+1} + \sum_{j=1}^{n} a_{n+1,j} + a_{n+1,n+1}.$$

    **3.** En déduire que $S_{n+1} - S_{n} = (n+1)^{3}$, puis que $\displaystyle\sum_{k=1}^{n} k^{3} = \Big(\sum_{k=1}^{n} k\Big)^{2}$.

    ![Figure](documents/figures/296823c1107692ee.svg)

    La figure illustre le résultat pour $n = 4$ : le carré de côté $1 + 2 + 3 + 4 = 10$ est découpé en équerres d'aires $1^{3}$, $2^{3}$, $3^{3}$ et $4^{3}$.
  corrige: |
    **1.** D'après la proposition 7 du cours, la somme double est un produit de deux sommes. 
    $$\boxed{S_{n} = \Big(\sum_{k=1}^{n} k\Big)^{2}}$$

    **2.** Le carré $[\![1\,;n+1]\!]^{2}$ est la réunion disjointe de quatre morceaux : le carré $[\![1\,;n]\!]^{2}$, la colonne $j = n + 1$ avec $i \leqslant n$, la ligne $i = n + 1$ avec $j \leqslant n$, et le coin $(n + 1, n + 1)$. La relation de Chasles donne l'égalité.

    **3.** Avec $a_{i,j} = ij$, les deux sommes simples valent chacune $(n+1)\frac{n(n+1)}{2}$, et le coin vaut $(n+1)^{2}$ : 
    $$S_{n+1} - S_{n} = 2(n + 1)\frac{n(n+1)}{2} + (n + 1)^{2} = (n + 1)^{2}(n + 1) = (n + 1)^{3}.$$
     En sommant ces différences de $0$ à $n - 1$, et puisque $S_{0} = 0$, on obtient $S_{n} = \sum_{k=1}^{n} k^{3}$. La question 1 conclut. 
    $$\boxed{\sum_{k=1}^{n} k^{3} = \Big(\sum_{k=1}^{n} k\Big)^{2}}$$
     La figure de l'énoncé est exactement ce calcul : l'équerre ajoutée au passage de $n$ à $n + 1$ est formée de la colonne, de la ligne et du coin, et son aire est $(n + 1)^{3}$.
- id: "ma-03-21"
  feuille: "f-ma-03"
  numero: 21
  partie: "Sommes doubles"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [sommes doubles]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 6
  page_corrige: 11
  enonce: |
    Soit $n \geqslant 1$ et $x_{1}$, …, $x_{n}$ des réels strictement positifs. Montrer que 
    $$\Big(\sum_{i=1}^{n} x_{i}\Big)\Big(\sum_{j=1}^{n} \frac{1}{x_{j}}\Big) \geqslant n^{2}.$$
     *On écrira le produit comme une somme double, et l'on regroupera les termes d'indices $(i,j)$ et $(j,i)$.* Étudier le cas d'égalité.
  corrige: |
    Par la proposition 7 du cours, le produit vaut $P = \sum_{1 \leqslant i,j \leqslant n} \frac{x_{i}}{x_{j}}$. Les $n$ termes diagonaux valent $1$. Les autres se regroupent par paires $\{(i,j), (j,i)\}$ avec $i < j$, au nombre de $\frac{n(n-1)}{2}$, et pour $u = \frac{x_{i}}{x_{j}} > 0$, 
    $$u + \frac{1}{u} - 2 = \frac{(u - 1)^{2}}{u} \geqslant 0.$$
     Donc $P \geqslant n + 2 \times \frac{n(n-1)}{2} = n^{2}$. 
    $$\boxed{\Big(\sum_{i=1}^{n} x_{i}\Big)\Big(\sum_{j=1}^{n} \frac{1}{x_{j}}\Big) \geqslant n^{2}, \text{ avec égalité si et seulement si tous les } x_{i} \text{ sont égaux.}}$$
     L'égalité impose $u = 1$ pour chaque paire. Cette inégalité exprime que la moyenne arithmétique des $x_{i}$ est supérieure à leur moyenne harmonique ; elle se déduira aussi de l'inégalité de Cauchy-Schwarz du chapitre 19.
- id: "ma-03-22"
  feuille: "f-ma-03"
  numero: 22
  partie: "Sommes doubles"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [sommes doubles]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 6
  page_corrige: 11
  enonce: |
    *Inégalité de Tchebychev.* Soit $n \geqslant 1$, et $a_{1} \leqslant a_{2} \leqslant \cdots \leqslant a_{n}$, $b_{1} \leqslant b_{2} \leqslant \cdots \leqslant b_{n}$ deux familles croissantes de réels. Montrer que 
    $$\frac{1}{n} \sum_{k=1}^{n} a_{k} b_{k} \geqslant \Big(\frac{1}{n} \sum_{i=1}^{n} a_{i}\Big)\Big(\frac{1}{n} \sum_{j=1}^{n} b_{j}\Big).$$
     *On pourra étudier le signe de la somme double $\displaystyle\sum_{1 \leqslant i, j \leqslant n} (a_{i} - a_{j})(b_{i} - b_{j})$.* Que devient l'inégalité si l'une des familles est croissante et l'autre décroissante ?
  corrige: |
    Pour tous $i$ et $j$, les familles étant croissantes, $a_{i} - a_{j}$ et $b_{i} - b_{j}$ ont le même signe : leur produit est positif. En développant la somme double par linéarité, 
    $$0 \leqslant \sum_{1 \leqslant i,j \leqslant n} (a_{i} - a_{j})(b_{i} - b_{j}) = \sum_{i,j} a_{i}b_{i} - \sum_{i,j} a_{i}b_{j} - \sum_{i,j} a_{j}b_{i} + \sum_{i,j} a_{j}b_{j}.$$
     Le premier et le dernier terme valent $n\sum_{k} a_{k}b_{k}$, et les deux termes centraux valent $\big(\sum_{i} a_{i}\big)\big(\sum_{j} b_{j}\big)$. Donc 
    $$0 \leqslant 2n\sum_{k=1}^{n} a_{k}b_{k} - 2\Big(\sum_{i=1}^{n} a_{i}\Big)\Big(\sum_{j=1}^{n} b_{j}\Big),$$
     et l'on divise par $2n^{2}$. 
    $$\boxed{\frac{1}{n}\sum_{k=1}^{n} a_{k}b_{k} \geqslant \Big(\frac{1}{n}\sum_{i=1}^{n} a_{i}\Big)\Big(\frac{1}{n}\sum_{j=1}^{n} b_{j}\Big)}$$
     Si l'une des familles est croissante et l'autre décroissante, chaque produit est négatif, et l'inégalité est renversée. *À retenir :* la moyenne des produits dépasse le produit des moyennes lorsque les deux grandeurs « varient dans le même sens ». En probabilités, au chapitre 21, cela s'énoncera : deux variables aléatoires qui varient dans le même sens ont une covariance positive.
- id: "ma-03-23"
  feuille: "f-ma-03"
  numero: 23
  partie: "Sommes doubles"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [sommes doubles]
  noeuds: [n-sommes]
  notions: []
  page_enonce: 7
  page_corrige: 11
  enonce: |
    Pour $n, p \in \mathbb{N}$, on note $\displaystyle S_{n}^{(p)} = \sum_{i=0}^{n} i^{p}$, avec la convention $0^{0} = 1$.

    **1.** Soit $n, p \in \mathbb{N}$. En calculant de deux façons la somme $\displaystyle\sum_{0 \leqslant i < j \leqslant n} i^{p}$, démontrer la formule d'al-Haytham : 
    $$n\, S_{n}^{(p)} - S_{n}^{(p+1)} = \sum_{k=0}^{n-1} S_{k}^{(p)}.$$

    **2.** Retrouver la valeur de $S_{n}^{(2)}$ à partir de celle de $S_{n}^{(1)}$.

    **3.** En déduire une expression de $S_{n}^{(4)}$, et comparer avec l'exercice 12.
  corrige: |
    **1.** Notons $T = \sum_{0 \leqslant i < j \leqslant n} i^{p}$.

    • En sommant d'abord sur $i$, à $j$ fixé : $T = \sum_{j=1}^{n} \sum_{i=0}^{j-1} i^{p} = \sum_{j=1}^{n} S_{j-1}^{(p)} = \sum_{k=0}^{n-1} S_{k}^{(p)}$.

    • En sommant d'abord sur $j$, à $i$ fixé : il y a $n - i$ valeurs de $j$, et le terme $i = n$, nul, peut être ajouté, donc 
    $$T = \sum_{i=0}^{n} (n - i)\,i^{p} = n\,S_{n}^{(p)} - S_{n}^{(p+1)}.$$

    $$\boxed{n\,S_{n}^{(p)} - S_{n}^{(p+1)} = \sum_{k=0}^{n-1} S_{k}^{(p)}}$$

    **2.** Pour $p = 1$, on a $S_{k}^{(1)} = \frac{k(k+1)}{2} = \frac{1}{2}(k^{2} + k)$, donc le membre de droite vaut 
    $$\frac{1}{2}\big(S_{n-1}^{(2)} + S_{n-1}^{(1)}\big) = \frac{1}{2}\big(S_{n}^{(2)} - n^{2} + S_{n}^{(1)} - n\big).$$
     On isole $S_{n}^{(2)}$ : 
    $$3\,S_{n}^{(2)} = (2n - 1)\,S_{n}^{(1)} + n^{2} + n = \frac{(2n-1)n(n+1)}{2} + n(n+1) = \frac{n(n+1)(2n+1)}{2}.$$

    $$\boxed{S_{n}^{(2)} = \frac{n(n+1)(2n+1)}{6}}$$

    **3.** Pour $p = 3$, on utilise $S_{k}^{(3)} = \frac{k^{2}(k+1)^{2}}{4} = \frac{1}{4}(k^{4} + 2k^{3} + k^{2})$, et l'on procède de même : le membre de droite fait intervenir $S_{n}^{(4)}$, que l'on isole. 
    $$\boxed{S_{n}^{(4)} = \frac{n(n+1)(2n+1)(3n^{2} + 3n - 1)}{30}}$$
     C'est bien la fonction $f(n)$ de l'exercice 12. La formule d'al-Haytham permet ainsi de calculer, de proche en proche, toutes les sommes de puissances.
- id: "ma-03-24"
  feuille: "f-ma-03"
  numero: 24
  partie: "Sommes doubles"
  etoiles: 3
  types: [Calcul]
  mots_cles: [sommes doubles, factorielle, dénombrement]
  noeuds: [n-sommes, n-fini]
  notions: [ensemble-fini]
  page_enonce: 7
  page_corrige: 12
  enonce: |
    Soit $n \geqslant 1$. Calculer 
    $$\sum_{(i,j,k) \in [\![1\,;n]\!]^{3}} \min\big(i, \max(j,k)\big).$$
     *On pourra commencer par dénombrer, pour tout entier $m$ compris entre $1$ et $n$, les couples $(j,k)$ de $[\![1\,;n]\!]^{2}$ tels que $\max(j,k) = m$.*
  corrige: |
    Pour $m \in [\![1\,;n]\!]$, les couples $(j,k)$ tels que $\max(j,k) \leqslant m$ forment le carré $[\![1\,;m]\!]^{2}$, à $m^{2}$ éléments. Ceux tels que $\max(j,k) = m$ sont donc au nombre de $m^{2} - (m - 1)^{2} = 2m - 1$ : ils forment l'équerre de la figure.

    ![Figure](documents/figures/fc9916ac5e5d1f61.svg)

    Pour $n = 6$ et $m = 4$, les couples tels que $\max(j,k) = 4$, en ocre, forment une équerre de $2 \times 4 - 1 = 7$ points, qui borde le carré des couples tels que $\max(j,k) \leqslant 3$, en bleu.

    On regroupe la somme selon la valeur $m$ de $\max(j,k)$, puis l'on somme sur $i$ : 
    $$\sum_{(i,j,k)} \min\big(i, \max(j,k)\big) = \sum_{m=1}^{n} (2m - 1) \sum_{i=1}^{n} \min(i, m),$$

    $$\sum_{i=1}^{n} \min(i, m) = \frac{m(m+1)}{2} + m(n - m) = mn - \frac{m(m-1)}{2}.$$
     Il reste une somme de polynômes en $m$, que l'on calcule avec les sommes usuelles. 
    $$\boxed{\sum_{(i,j,k) \in [\![1\,;n]\!]^{3}} \min\big(i, \max(j,k)\big) = \frac{n^{2}(n+1)(5n + 1)}{12}}$$
     Pour $n = 2$, on trouve $\frac{4 \times 3 \times 11}{12} = 11$, ce que confirme l'énumération des huit triplets.
- id: "ma-03-25"
  feuille: "f-ma-03"
  numero: 25
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coefficients binomiaux, factorielle]
  noeuds: [n-sommes, n-fini]
  notions: [coefficient-binomial]
  page_enonce: 7
  page_corrige: 13
  enonce: |
    **1.** Soit $n \in \mathbb{N}$. Simplifier $(n + 1)! - n!$, $\dfrac{(n + 3)!}{(n + 1)!}$ et $\dfrac{n + 2}{(n + 1)!} - \dfrac{1}{n!}$.

    **2.** Soit $a$ et $b$ deux réels non nuls, et $u_{n} = \dfrac{a^{n}}{n!\,b^{2n}}$. Simplifier $\dfrac{u_{n+1}}{u_{n}}$.

    **3.** Développer $(x + 1)^{6}$ et $(x - 1)^{6}$. En déduire, sans calcul supplémentaire, l'expression développée de $(x + 1)^{6} + (x - 1)^{6}$.
  corrige: |
    **1.** On factorise par la plus petite factorielle : 
    $$\boxed{(n + 1)! - n! = n \cdot n! \qquad \frac{(n+3)!}{(n+1)!} = (n + 2)(n + 3) \qquad \frac{n + 2}{(n+1)!} - \frac{1}{n!} = \frac{1}{(n+1)!}}$$

    **2.** Les puissances et les factorielles se simplifient : 
    $$\boxed{\frac{u_{n+1}}{u_{n}} = \frac{a}{(n + 1)\,b^{2}}}$$

    **3.** La ligne $n = 6$ du triangle de Pascal est $1, 6, 15, 20, 15, 6, 1$. 
    $$\boxed{(x + 1)^{6} = x^{6} + 6x^{5} + 15x^{4} + 20x^{3} + 15x^{2} + 6x + 1}$$
     Pour $(x - 1)^{6}$, les termes de degré impair changent de signe ; dans la somme, ils se compensent et les autres doublent. 
    $$\boxed{(x + 1)^{6} + (x - 1)^{6} = 2x^{6} + 30x^{4} + 30x^{2} + 2}$$
- id: "ma-03-26"
  feuille: "f-ma-03"
  numero: 26
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 1
