  enonce: |
    ![Figure](documents/figures/7e6d40feac248e22.svg)

    **1.** Déterminer les réels $a$, $b$, $c$ tels que la courbe d'équation $y = ax^{2} + bx + c$ passe par les points $A(1,2)$, $B(2,3)$ et $C(3,6)$ de la figure.

    **2.** Même question avec les points $A$, $B$ et $C'(3,4)$. Interpréter le résultat obtenu.
  corrige: |
    **1.** Les trois conditions s'écrivent $a + b + c = 2$, $4a + 2b + c = 3$, $9a + 3b + c = 6$. Les opérations $L_{2} \leftarrow L_{2} - L_{1}$ et $L_{3} \leftarrow L_{3} - L_{1}$ donnent $3a + b = 1$ et $8a + 2b = 4$, puis $L_{3} \leftarrow L_{3} - 2L_{2}$ donne $2a = 2$. 
    $$\boxed{a = 1,\ b = -2,\ c = 3 : \ y = x^{2} - 2x + 3}$$

    **2.** Seul le second membre de la troisième équation change, et l'on obtient $2a = 0$, donc $a = 0$, $b = 1$, $c = 1$. 
    $$\boxed{y = x + 1 : \text{ la seule courbe obtenue est une droite.}}$$
     Les points $A$, $B$ et $C'$ sont alignés : aucune parabole, au sens strict, ne passe par eux.

    ![Figure](documents/figures/45a404b188eb705e.svg)

    La parabole $y = x^{2} - 2x + 3$, en bleu, passe par $A$, $B$ et $C$, et a son sommet en $A$. La droite $y = x + 1$, en ocre, passe par $A$, $B$ et $C'$ : lorsque les trois points sont alignés, la « parabole » dégénère en droite.
- id: "ma-03-40"
  feuille: "f-ma-03"
  numero: 40
  partie: "Systèmes linéaires"
  etoiles: 2
  types: [Calcul]
  mots_cles: [systèmes linéaires]
  noeuds: [v-rang, alglin]
  notions: []
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $m$ un réel. Résoudre, selon les valeurs de $m$, le système 
    $$\left\{ \begin{array}{rcrcrcl} mx & + & y & - & z & = & 0 \\ & & y & + & 3z & = & m \\ x & + & y & + & z & = & 1 \end{array} \right.$$
     *On choisira avec soin le premier pivot, pour ne pas avoir à diviser par une quantité qui peut s'annuler.*
  corrige: |
    Le coefficient $m$ de $x$ dans la première équation peut s'annuler : on prend pour pivot le coefficient $1$ de la troisième. On échange $L_{1}$ et $L_{3}$, puis $L_{3} \leftarrow L_{3} - mL_{1}$ donne $(1 - m)y - (1 + m)z = -m$. On élimine $y$ grâce à $L_{2}$, dont le pivot vaut $1$ : $L_{3} \leftarrow L_{3} - (1 - m)L_{2}$ donne 
    $$\big(-(1 + m) - 3(1 - m)\big)z = -m - m(1 - m), \qquad\text{soit}\qquad (2m - 4)\,z = m(m - 2).$$

    • Si $m \neq 2$, alors $z = \frac{m}{2}$, puis $y = m - 3z = -\frac{m}{2}$ et $x = 1 - y - z = 1$.

    • Si $m = 2$, la dernière ligne s'écrit $0 = 0$ : avec le paramètre $z$, on obtient $y = 2 - 3z$ et $x = 1 - y - z = 2z - 1$.

    $$\boxed{m \neq 2 : \ \Big(1, -\frac{m}{2}, \frac{m}{2}\Big) \qquad m = 2 : \ \big\{(2z - 1,\ 2 - 3z,\ z) \mid z \in \mathbb{R}\big\}}$$
     *Piège :* si l'on prend $m$ comme premier pivot, il faut traiter à part le cas $m = 0$, qui n'a pourtant rien de particulier : la solution y vaut $(1, 0, 0)$, comme le donne la formule générale.
- id: "ma-03-41"
  feuille: "f-ma-03"
  numero: 41
  partie: "Systèmes linéaires"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [systèmes linéaires]
  noeuds: [v-rang, alglin]
  notions: []
  page_enonce: 10
  page_corrige: 19
  enonce: |
    Soit $m$ un réel. On considère les trois plans de l'espace 
    $$\mathcal{P}_{1} : mx + 2y + 3z = 3, \qquad \mathcal{P}_{2} : (m - 1)x + my + z = 1, \qquad \mathcal{P}_{3} : (m + 1)x + my + (m - 1)z = m - 1.$$

    **1.** Vérifier que le point $(0, 0, 1)$ appartient aux trois plans, quelle que soit la valeur de $m$.

    **2.** Montrer que les plans $\mathcal{P}_{1}$ et $\mathcal{P}_{2}$ ne sont jamais parallèles, et déterminer leur intersection lorsque $m = 0$.

    **3.** Déterminer, selon les valeurs de $m$, l'intersection des trois plans.
  corrige: |
    **1.** Pour $(x,y,z) = (0,0,1)$, les premiers membres valent $3$, $1$ et $m - 1$, qui sont les seconds membres.

    **2.** Les plans seraient parallèles si leurs vecteurs de coefficients $(m, 2, 3)$ et $(m - 1, m, 1)$ étaient proportionnels. La troisième composante imposerait $(m, 2, 3) = 3(m - 1, m, 1)$, donc à la fois $m = 3m - 3$ et $2 = 3m$, ce qui est incompatible. Pour $m = 0$, on résout $2y + 3z = 3$ et $-x + z = 1$. 
    $$\boxed{\mathcal{P}_{1} \cap \mathcal{P}_{2} = \Big\{\Big(z - 1,\ \frac{3 - 3z}{2},\ z\Big) \mid z \in \mathbb{R}\Big\} \text{ pour } m = 0}$$

    **3.** Comme $(0, 0, 1)$ est solution, on pose $z = 1 + w$ : le système devient homogène, 
    $$mx + 2y + 3w = 0, \qquad (m - 1)x + my + w = 0, \qquad (m + 1)x + my + (m - 1)w = 0.$$
     La deuxième équation donne $w = -(m - 1)x - my$. En reportant dans les deux autres : 
    $$(3 - 2m)x + (2 - 3m)y = 0 \qquad\text{et}\qquad m\big((3 - m)x + (2 - m)y\big) = 0.$$

    • Si $m = 0$, la troisième équation disparaît : l'intersection est la droite trouvée à la question 2.

    • Si $m \neq 0$, on divise par $m$. En éliminant $x$ ou $y$, on fait apparaître le coefficient 
    $$(3 - 2m)(2 - m) - (2 - 3m)(3 - m) = m(4 - m).$$
     Pour $m \neq 4$, il est non nul, et l'on obtient $x = y = 0$, puis $w = 0$.

    • Si $m = 4$, les deux équations se réduisent à $x + 2y = 0$, et l'on obtient une droite.

    $$\boxed{m \notin \{0, 4\} : \ \{(0, 0, 1)\} \qquad m = 0 \text{ ou } m = 4 : \text{ une droite passant par } (0, 0, 1)}$$
     Pour $m = 4$, la droite est $\{(1 - z,\ \frac{z - 1}{2},\ z) \mid z \in \mathbb{R}\}$. Dans les deux cas particuliers, les trois plans ont une droite commune ; sinon, ils se coupent en un seul point.
- id: "ma-03-42"
  feuille: "f-ma-03"
  numero: 42
  partie: "Systèmes linéaires"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [systèmes linéaires, factorielle]
  noeuds: [v-rang, alglin, n-sommes]
  notions: []
  page_enonce: 11
  page_corrige: 19
  enonce: |
    Soit $n \geqslant 2$ un entier et $a$, $b$ deux réels. On cherche les $n$-uplets $(x_{1}, \dots, x_{n})$ de réels tels que 
    $$a x_{1} + b = x_{2}, \quad a x_{2} + b = x_{3}, \quad \dots, \quad a x_{n-1} + b = x_{n}, \quad a x_{n} + b = x_{1}.$$

    **1.** Montrer que, pour une solution, $x_{k} = a^{k-1} x_{1} + b \displaystyle\sum_{j=0}^{k-2} a^{j}$ pour tout $k \in [\![1\,;n]\!]$.

    **2.** En déduire que le système équivaut à une seule équation en $x_{1}$, que l'on écrira à l'aide de la factorisation de $1 - a^{n}$.

    **3.** Résoudre le système dans chacun des cas suivants : $a^{n} \neq 1$ ; $a = 1$ ; $a = -1$ et $n$ pair.
  corrige: |
    **1.** Par récurrence sur $k$ : c'est vrai pour $k = 1$, la somme étant vide, et si c'est vrai au rang $k$, 
    $$x_{k+1} = a x_{k} + b = a^{k} x_{1} + b\sum_{j=1}^{k-1} a^{j} + b = a^{k} x_{1} + b\sum_{j=0}^{k-1} a^{j}.$$

    **2.** Les $n - 1$ premières équations sont équivalentes aux formules de la question 1, qui expriment $x_{2}$, …, $x_{n}$ en fonction de $x_{1}$. La dernière devient $a^{n}x_{1} + b\sum_{j=0}^{n-1} a^{j} = x_{1}$, soit 
    $$\boxed{(1 - a^{n})\,x_{1} = b\,(1 + a + \cdots + a^{n-1}), \qquad\text{avec}\qquad 1 - a^{n} = (1 - a)(1 + a + \cdots + a^{n-1}).}$$

    **3.** On distingue les cas proposés.

    • *Si $a^{n} \neq 1$*, alors $a \neq 1$ et $1 + a + \cdots + a^{n-1} \neq 0$ : on simplifie, et $x_{1} = \frac{b}{1 - a}$. Ce nombre est le point fixe de $x \mapsto ax + b$, donc tous les $x_{k}$ lui sont égaux.

    • *Si $a = 1$*, l'équation devient $0 = nb$. Si $b \neq 0$, il n'y a pas de solution ; si $b = 0$, les solutions sont les $n$-uplets constants.

    • *Si $a = -1$ et $n$ est pair*, les deux membres sont nuls : $x_{1}$ est quelconque, et les termes alternent entre $x_{1}$ et $b - x_{1}$.

    $$\boxed{a^{n} \neq 1 : \Big(\tfrac{b}{1-a}, \dots, \tfrac{b}{1-a}\Big) \qquad a = 1,\ b = 0 : (c, \dots, c) \qquad a = 1,\ b \neq 0 : \varnothing}$$

    $$\boxed{a = -1,\ n \text{ pair} : (c,\ b - c,\ c,\ b - c,\ \dots,\ c,\ b - c), \ c \in \mathbb{R}}$$
     Dans $\mathbb{R}$, ces cas sont exhaustifs, puisque $a^{n} = 1$ impose $|a| = 1$. Le chapitre 4 fera apparaître d'autres racines $n$-ièmes de l'unité dans $\mathbb{C}$, et donc d'autres solutions lorsque $a$ est complexe.
- id: "ma-03-43"
  feuille: "f-ma-03"
  numero: 43
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux, Démonstration]
  mots_cles: [produits, coefficients binomiaux, systèmes linéaires]
  noeuds: [n-sommes, n-fini, v-rang, alglin, pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 11
  page_corrige: 20
  enonce: |
    **Vrai ou faux.** Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse et justifier la réponse par une démonstration ou un contre-exemple. Les entiers $n$ sont supposés non nuls.

    **1.** Pour tout $n \in \mathbb{N}$, $\displaystyle\sum_{k=0}^{n} 2 = 2n$.

    **2.** Pour tous réels $a_{1}$, …, $a_{n}$, $\displaystyle\prod_{k=1}^{n} (3a_{k}) = 3^{n} \prod_{k=1}^{n} a_{k}$.

    **3.** Pour tous réels $a_{1}$, …, $a_{n}$, $\displaystyle\Big(\sum_{k=1}^{n} a_{k}\Big)^{2} = \sum_{k=1}^{n} a_{k}^{2}$.

    **4.** Pour toute suite $(u_{k})$, $\displaystyle\sum_{k=1}^{n} (u_{k+1} - u_{k}) = u_{n+1} - u_{1}$.

    **5.** Pour tout $n \in \mathbb{N}$, $\displaystyle\sum_{k=0}^{n} \binom{n}{k} 2^{k} = 3^{n}$.

    **6.** Pour tout $n \geqslant 1$, le coefficient $\dbinom{2n}{n}$ est pair.

    **7.** Pour tout $n \geqslant 1$, le nombre de couples $(i,j)$ d'entiers tels que $1 \leqslant i < j \leqslant n$ est $\dfrac{n(n-1)}{2}$.

    **8.** Pour toute famille de réels, $\displaystyle\sum_{i=1}^{n} \sum_{j=1}^{i} a_{i,j} = \sum_{j=1}^{n} \sum_{i=1}^{j} a_{i,j}$.

    **9.** L'opération $L_{1} \leftarrow L_{1} + L_{2}$, suivie de l'opération $L_{2} \leftarrow L_{2} - L_{1}$, transforme un système en un système équivalent.

    **10.** Un système de trois équations linéaires à deux inconnues n'a jamais de solution.
  corrige: |
    **1.** **Fausse** La somme comporte $n + 1$ termes égaux à $2$ : elle vaut $2(n + 1)$.

    **2.** **Vraie** Chacun des $n$ facteurs fournit un facteur $3$.

    **3.** **Fausse** Pour $n = 2$ et $a_{1} = a_{2} = 1$, on trouve $4 \neq 2$ : il manque les termes rectangles.

    **4.** **Vraie** C'est une somme télescopique.

    **5.** **Vraie** C'est la formule du binôme pour $(1 + 2)^{n}$.

    **6.** **Vraie** Par la formule de Pascal et la symétrie, 
    $$\binom{2n}{n} = \binom{2n-1}{n-1} + \binom{2n-1}{n} = 2\binom{2n-1}{n-1}.$$

    **7.** **Vraie** Ces couples correspondent aux parties $\{i, j\}$ à deux éléments de $[\![1\,;n]\!]$, qui sont au nombre de $\dbinom{n}{2}$.

    **8.** **Fausse** Pour $n = 2$, avec $a_{2,1} = 1$ et les autres termes nuls, le membre de gauche contient le terme $a_{2,1}$ et vaut $1$, alors que le membre de droite ne porte que sur les couples $i \leqslant j$ et vaut $0$. L'interversion correcte est 
    $$\sum_{i=1}^{n} \sum_{j=1}^{i} a_{i,j} = \sum_{j=1}^{n} \sum_{i=j}^{n} a_{i,j}.$$

    **9.** **Vraie** Les deux opérations, effectuées l'une après l'autre, sont des opérations élémentaires : la seconde utilise la ligne $L_{1}$, déjà modifiée, mais distincte de $L_{2}$.

    **10.** **Fausse** Le système $x = 0$, $y = 0$, $x + y = 0$ a une solution. Un tel système est souvent incompatible, mais pas toujours.

    $$\boxed{\text{Vraies : 2, 4, 5, 6, 7, 9. \quad Fausses : 1, 3, 8, 10.}}$$
     *Piège :* l'affirmation 9 est vraie. Ce sont les opérations *simultanées* $L_{1} \leftarrow L_{1} + L_{2}$ et $L_{2} \leftarrow L_{2} - L_{1}$ que dénonce le cours ; ce qui compte, c'est que chaque étape soit réversible.
- id: "ma-03-44"
  feuille: "f-ma-03"
  numero: 44
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [factorielle, systèmes linéaires]
  noeuds: [n-sommes, v-rang, alglin]
  notions: []
  page_enonce: 11
  page_corrige: 20
  enonce: |
    *Deux équilibres.* Soit $n \in \mathbb{N}^{*}$, et $\alpha$, $\beta$ deux réels. On cherche les familles $(x_{0}, x_{1}, \dots, x_{n+1})$ de réels telles que $x_{0} = \alpha$ et $x_{n+1} = \beta$, et qui vérifient l'une des deux conditions suivantes.

    **(V)** Pour tout $k \in [\![1\,;n]\!]$, le réel $x_{k}$ est la moyenne de ses deux voisins $x_{k-1}$ et $x_{k+1}$.

    **(T)** Pour tout $k \in [\![1\,;n]\!]$, le réel $x_{k}$ est la moyenne des $n + 1$ réels $x_{j}$, pour $j \in [\![0\,;n+1]\!]$ et $j \neq k$.

    On peut penser aux températures de $n + 2$ points régulièrement espacés le long d'une barre, dont les extrémités sont maintenues aux températures $\alpha$ et $\beta$.

    **1.** Dans cette question, $n = 3$, $\alpha = 0$ et $\beta = 4$. Écrire chacune des deux conditions sous la forme d'un système linéaire de trois équations d'inconnues $x_{1}$, $x_{2}$, $x_{3}$, et le résoudre par la méthode du pivot.

    **2.** On revient au cas général, et l'on suppose la condition (V) vérifiée. Montrer que la différence $x_{k+1} - x_{k}$ ne dépend pas de $k \in [\![0\,;n]\!]$, et en déduire que la condition (V) est vérifiée par une unique famille, que l'on explicitera.

    **3.** On suppose la condition (T) vérifiée, et l'on note $\displaystyle S = \sum_{j=0}^{n+1} x_{j}$. Montrer que $(n + 2)\,x_{k} = S$ pour tout $k \in [\![1\,;n]\!]$, et en déduire que la condition (T) est vérifiée par une unique famille, que l'on explicitera. Comparer les deux profils de température obtenus.
  corrige: |
    **1.** Avec $x_{0} = 0$ et $x_{4} = 4$, la condition (V) s'écrit $2x_{k} = x_{k-1} + x_{k+1}$ pour $k = 1, 2, 3$, et la condition (T) dit que $4x_{k}$ est égal à la somme des quatre autres termes. On obtient les deux systèmes suivants : 
    $$\text{(V)}\ \left\{ \begin{array}{rcrcrcl} 2x_{1} & - & x_{2} & & & = & 0 \\ -x_{1} & + & 2x_{2} & - & x_{3} & = & 0 \\ & & -x_{2} & + & 2x_{3} & = & 4 \end{array} \right. \qquad\qquad \text{(T)}\ \left\{ \begin{array}{rcrcrcl} 4x_{1} & - & x_{2} & - & x_{3} & = & 4 \\ -x_{1} & + & 4x_{2} & - & x_{3} & = & 4 \\ -x_{1} & - & x_{2} & + & 4x_{3} & = & 4 \end{array} \right.$$
     Pour (V), on échange $L_{1}$ et $L_{2}$ afin de disposer du pivot $-1$, puis $L_{2} \leftarrow L_{2} + 2L_{1}$ donne $3x_{2} - 2x_{3} = 0$. On échange alors $L_{2}$ et $L_{3}$, et $L_{3} \leftarrow L_{3} + 3L_{2}$ donne $4x_{3} = 12$. La remontée donne $x_{3} = 3$, puis $x_{2} = 2x_{3} - 4 = 2$ et $x_{1} = 2x_{2} - x_{3} = 1$.

    Pour (T), on échange de même $L_{1}$ et $L_{2}$, puis $L_{2} \leftarrow L_{2} + 4L_{1}$ et $L_{3} \leftarrow L_{3} - L_{1}$ donnent $15x_{2} - 5x_{3} = 20$ et $-5x_{2} + 5x_{3} = 0$. On échange $L_{2}$ et $L_{3}$, et $L_{3} \leftarrow L_{3} + 3L_{2}$ donne $10x_{3} = 20$. La remontée donne $x_{3} = 2$, puis $x_{2} = x_{3} = 2$ et $x_{1} = 4x_{2} - x_{3} - 4 = 2$. 
    $$\boxed{\text{(V)} : (x_{1}, x_{2}, x_{3}) = (1, 2, 3) \qquad\qquad \text{(T)} : (x_{1}, x_{2}, x_{3}) = (2, 2, 2)}$$

    **2.** Pour $k \in [\![1\,;n]\!]$, la condition $2x_{k} = x_{k-1} + x_{k+1}$ s'écrit $x_{k+1} - x_{k} = x_{k} - x_{k-1}$. Notons $d_{k} = x_{k+1} - x_{k}$ pour $k \in [\![0\,;n]\!]$ : on a $d_{k} = d_{k-1}$ pour $1 \leqslant k \leqslant n$, donc, de proche en proche, $d_{k} = d_{0}$ pour tout $k \in [\![0\,;n]\!]$. La somme des $d_{k}$ est télescopique : 
    $$\beta - \alpha = x_{n+1} - x_{0} = \sum_{k=0}^{n} (x_{k+1} - x_{k}) = (n + 1)\,d_{0}.$$
     Ainsi $d_{0} = \frac{\beta - \alpha}{n + 1}$, et, par un nouveau télescopage, $x_{k} = x_{0} + \sum_{j=0}^{k-1} d_{j} = \alpha + k\,d_{0}$. Réciproquement, cette famille est en progression arithmétique, de premier terme $\alpha$ et de dernier terme $\beta$, et chacun de ses termes intérieurs est la moyenne de ses deux voisins. 
    $$\boxed{\forall k \in [\![0\,;n+1]\!], \quad x_{k} = \alpha + \frac{k\,(\beta - \alpha)}{n + 1} = \frac{(n + 1 - k)\,\alpha + k\,\beta}{n + 1}}$$
     Pour $n = 3$, $\alpha = 0$ et $\beta = 4$, on retrouve $x_{k} = k$, conformément à la question 1. ✓

    **3.** Pour $k \in [\![1\,;n]\!]$, la somme des $n + 1$ réels autres que $x_{k}$ vaut $S - x_{k}$, donc la condition (T) s'écrit $(n + 1)\,x_{k} = S - x_{k}$, c'est-à-dire 
    $$(n + 2)\,x_{k} = S.$$
     Les $n$ réels $x_{1}$, …, $x_{n}$ sont donc égaux à un même réel $c = \frac{S}{n + 2}$. En reportant dans la définition de $S$, on obtient $S = \alpha + \beta + nc$, et l'égalité $(n + 2)\,c = \alpha + \beta + nc$ donne $c = \frac{\alpha + \beta}{2}$. Réciproquement, si $x_{1} = \cdots = x_{n} = c$, la moyenne des réels autres que $x_{k}$ vaut 
    $$\frac{\alpha + \beta + (n - 1)\,c}{n + 1} = \frac{2c + (n - 1)\,c}{n + 1} = c,$$
     et la condition (T) est vérifiée. 
    $$\boxed{x_{1} = x_{2} = \cdots = x_{n} = \frac{\alpha + \beta}{2}}$$
     Les deux profils sont très différents. Dans le modèle (V), où chaque point n'échange de chaleur qu'avec ses deux voisins, la température varie de façon affine le long de la barre : c'est le profil d'une barre en régime permanent. Dans le modèle (T), où chaque point échange avec tous les autres, l'intérieur est à une température uniforme, égale à la moyenne des températures des extrémités, quel que soit le nombre de points.

    *À retenir :* on a résolu deux systèmes de $n$ équations à $n$ inconnues sans effectuer de pivot, en exploitant leur structure : une somme télescopique pour le premier, la somme $S$ de toutes les inconnues pour le second. La feuille du chapitre 16 reprendra le modèle (V) en dimension deux, sur une grille dont chaque coefficient intérieur est la moyenne de ses quatre voisins.
- id: "ma-03-45"
  feuille: "f-ma-03"
