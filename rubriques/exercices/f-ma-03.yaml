  enonce: |
    Pour $n \in \mathbb{N}$, on pose $\displaystyle S_{n} = \sum_{k=0}^{n} (-1)^{k} \binom{n-k}{k}$.

    **1.** Calculer $S_{0}$, …, $S_{7}$, et formuler une conjecture.

    **2.** Montrer que $S_{n+2} = S_{n+1} - S_{n}$ pour tout $n \in \mathbb{N}$, puis que $S_{n+3} = -S_{n}$.

    **3.** Démontrer la conjecture.
  corrige: |
    **1.** On calcule $S_{0}, \dots, S_{7}$ : 
    $$\boxed{1,\ 1,\ 0,\ -1,\ -1,\ 0,\ 1,\ 1}$$
     La suite semble périodique de période $6$.

    **2.** La même manipulation qu'à l'exercice 33, avec le signe $(-1)^{k}$, donne 
    $$S_{n+2} = \sum_{k \geqslant 0} (-1)^{k}\binom{n+1-k}{k} + \sum_{k \geqslant 1} (-1)^{k}\binom{n+1-k}{k-1} = S_{n+1} - S_{n},$$
     le changement d'indice $j = k - 1$ faisant apparaître le signe $-1$. Alors $S_{n+3} = S_{n+2} - S_{n+1} = -S_{n}$.

    **3.** On en déduit $S_{n+6} = -S_{n+3} = S_{n}$, et la suite est déterminée par ses six premiers termes. 
    $$\boxed{S_{n} = 1, 1, 0, -1, -1, 0 \text{ selon que } n \equiv 0, 1, 2, 3, 4, 5 \;[6]}$$
     Le chapitre 4 en donnera l'explication : les racines de $r^{2} = r - 1$ sont les nombres complexes $\mathrm{e}^{\pm \mathrm{i}\pi/3}$, dont la puissance sixième vaut $1$.
- id: "ma-03-35"
  feuille: "f-ma-03"
  numero: 35
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 3
  types: [Calcul]
  mots_cles: [coefficients binomiaux, produits]
  noeuds: [n-sommes, n-fini, pol-binome]
  notions: [coefficient-binomial]
  page_enonce: 9
  page_corrige: 16
  enonce: |
    On utilise la formule de la crosse de hockey : pour tous entiers $0 \leqslant p \leqslant n$, $\displaystyle\sum_{k=p}^{n} \binom{k}{p} = \binom{n+1}{p+1}$.

    **1.** Calculer $1 \times 2 \times 3 + 2 \times 3 \times 4 + \cdots + n(n + 1)(n + 2)$.

    **2.** Écrire $k^{3}$ comme combinaison de $\dbinom{k}{3}$, $\dbinom{k}{2}$ et $\dbinom{k}{1}$, et retrouver la valeur de $\displaystyle\sum_{k=0}^{n} k^{3}$.

    **3.** Soit $m \in \mathbb{N}^{*}$. Calculer $\displaystyle\sum_{k=0}^{n} \prod_{p=1}^{m} (k + p)$.
  corrige: |
    **1.** On écrit $k(k+1)(k+2) = 6\binom{k+2}{3}$, puis la formule de la crosse de hockey, après le changement d'indice $j = k + 2$ : 
    $$\sum_{k=1}^{n} k(k+1)(k+2) = 6\sum_{j=3}^{n+2} \binom{j}{3} = 6\binom{n+3}{4}.$$

    $$\boxed{1 \times 2 \times 3 + \cdots + n(n+1)(n+2) = \frac{n(n+1)(n+2)(n+3)}{4}}$$

    **2.** On cherche $a$, $b$, $c$ tels que $k^{3} = a\frac{k(k-1)(k-2)}{6} + b\frac{k(k-1)}{2} + ck$ ; les valeurs $k = 1, 2, 3$ donnent $c = 1$, $b = 6$, $a = 6$. 
    $$k^{3} = 6\binom{k}{3} + 6\binom{k}{2} + \binom{k}{1}, \qquad \sum_{k=0}^{n} k^{3} = 6\binom{n+1}{4} + 6\binom{n+1}{3} + \binom{n+1}{2}.$$

    $$\boxed{\sum_{k=0}^{n} k^{3} = \frac{n^{2}(n+1)^{2}}{4}}$$

    **3.** Le produit vaut $\frac{(k+m)!}{k!} = m!\binom{k+m}{m}$, et la crosse de hockey donne $\sum_{k=0}^{n} \binom{k+m}{m} = \binom{n+m+1}{m+1}$. 
    $$\boxed{\sum_{k=0}^{n} \prod_{p=1}^{m} (k + p) = m!\binom{n+m+1}{m+1} = \frac{(n+m+1)!}{(m+1)\,n!}}$$
     Pour $m = 1$, on retrouve $\sum_{k=0}^{n} (k + 1) = \frac{(n+1)(n+2)}{2}$. *À retenir :* les produits de facteurs consécutifs, appelés *factorielles montantes*, se somment aussi simplement que les puissances se dérivent ; c'est pourquoi on exprime les puissances à l'aide de coefficients binomiaux pour les sommer.
- id: "ma-03-36"
  feuille: "f-ma-03"
  numero: 36
  partie: "Coefficients binomiaux et formule du binôme"
  etoiles: 3
  types: [Démonstration]
  mots_cles: [coefficients binomiaux, factorielle, dénombrement]
  noeuds: [n-sommes, n-fini, pol-binome]
  notions: [coefficient-binomial, ensemble-fini]
  page_enonce: 9
  page_corrige: 17
  enonce: |
    *Formule de Vandermonde.* Soit $a$, $b$, $q$ trois entiers naturels. On considère deux ensembles disjoints $A$ et $B$, à $a$ et $b$ éléments.

    **1.** Pour $k \in [\![0\,;q]\!]$, combien y a-t-il de parties $X$ de $A \cup B$ à $q$ éléments telles que $X \cap A$ ait $k$ éléments ? On justifiera la réponse à l'aide des lemmes du cours sur les ensembles finis.

    **2.** En déduire la formule de Vandermonde : 
    $$\sum_{k=0}^{q} \binom{a}{k}\binom{b}{q-k} = \binom{a+b}{q}.$$

    **3.** En déduire $\displaystyle\sum_{k=0}^{n} \binom{n}{k}^{2}$ pour $n \in \mathbb{N}$.
  corrige: |
    **1.** L'application $X \mapsto (X \cap A, X \cap B)$ est une bijection de l'ensemble des parties $X$ de $A \cup B$ telles que $\mathrm{card}(X \cap A) = k$ et $\mathrm{card}(X) = q$ sur l'ensemble des couples $(X_{1}, X_{2})$ formés d'une partie de $A$ à $k$ éléments et d'une partie de $B$ à $q - k$ éléments. Sa réciproque est $(X_{1}, X_{2}) \mapsto X_{1} \cup X_{2}$, et $X_{1} \cup X_{2}$ a bien $q$ éléments, d'après le lemme 4 du chapitre 2, puisque $A$ et $B$ sont disjoints. Le lemme 6 du chapitre 2 donne le cardinal du produit. 
    $$\boxed{\binom{a}{k}\binom{b}{q-k} \text{ parties}}$$

    **2.** Les parties $X$ de $A \cup B$ à $q$ éléments se répartissent en $q + 1$ catégories disjointes, selon la valeur de $\mathrm{card}(X \cap A)$, qui va de $0$ à $q$. Le lemme 4 du chapitre 2, étendu à une réunion disjointe finie, donne la formule, puisque $A \cup B$ a $a + b$ éléments. 
    $$\boxed{\sum_{k=0}^{q} \binom{a}{k}\binom{b}{q-k} = \binom{a+b}{q}}$$

    **3.** On prend $a = b = q = n$, et l'on utilise la symétrie des coefficients binomiaux : 
    $$\boxed{\sum_{k=0}^{n} \binom{n}{k}^{2} = \binom{2n}{n}}$$
     Le chapitre 13 en donnera une autre démonstration, en identifiant les coefficients des deux membres de l'égalité de polynômes 
    $$(1 + X)^{a}(1 + X)^{b} = (1 + X)^{a+b}.$$
