  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), théorème 2 (§ 3.4) et n° 94, transposés aux vecteurs de l'espace"
  page_enonce: 14
  page_corrige: 28
  enonce: |
    *L'inégalité de Cauchy-Schwarz.*

    **1.** Soient $\vec{u}$ et $\vec{v}$ deux vecteurs de l'espace, avec $\vec{u}\neq\vec{0}$. En étudiant le signe de la fonction $f$ définie sur $\mathbb{R}$ par $f(x)=\|x\vec{u}+\vec{v}\|^{2}$, montrer que 
    $$\left|\vec{u}\cdot\vec{v}\right|\leqslant\|\vec{u}\|\,\|\vec{v}\|$$
     et que cette inégalité est une égalité si et seulement si $\vec{u}$ et $\vec{v}$ sont colinéaires.

    **2.** Montrer que, si $x$, $y$ et $z$ sont trois réels tels que $x^{2}+y^{2}+z^{2}=1$, alors $x+y+z\leqslant\sqrt{3}$. Caractériser le cas d'égalité.

    **3.** L'espace est muni d'un repère orthonormé. Soient $\mathcal{P}$ le plan d'équation $ax+by+cz+d=0$, avec $(a\,;b\,;c)\neq(0\,;0\,;0)$, et $A(x_A\,;y_A\,;z_A)$ un point de l'espace. Sans utiliser le projeté orthogonal de $A$ sur $\mathcal{P}$, montrer que, pour tout point $M$ de $\mathcal{P}$ : 
    $$AM\geqslant\frac{\left|ax_A+by_A+cz_A+d\right|}{\sqrt{a^{2}+b^{2}+c^{2}}}$$
     puis que cette valeur est atteinte en un unique point de $\mathcal{P}$.
  corrige: |
    **1.** Par les propriétés du produit scalaire (distributivité et symétrie), pour tout réel $x$ : 
    $$f(x)=\left(x\vec{u}+\vec{v}\right)\cdot\left(x\vec{u}+\vec{v}\right) =\|\vec{u}\|^{2}x^{2}+2\left(\vec{u}\cdot\vec{v}\right)x+\|\vec{v}\|^{2}$$
     Comme $\vec{u}\neq\vec{0}$, le coefficient $\|\vec{u}\|^{2}$ est strictement positif : $f$ est un trinôme du second degré. Or $f$ est à valeurs positives, puisque c'est le carré d'une norme. Un trinôme de coefficient dominant positif qui aurait deux racines distinctes serait strictement négatif entre ses racines ; le discriminant de $f$ est donc négatif ou nul : 
    $$\Delta=4\left(\vec{u}\cdot\vec{v}\right)^{2}-4\|\vec{u}\|^{2}\|\vec{v}\|^{2}\leqslant 0 \iff \left(\vec{u}\cdot\vec{v}\right)^{2}\leqslant\|\vec{u}\|^{2}\|\vec{v}\|^{2}$$
     La fonction racine carrée étant croissante sur $[0\,;+\infty[$, on obtient, puisque $\sqrt{X^{2}}=|X|$ : 
    $$\boxed{\left|\vec{u}\cdot\vec{v}\right|\leqslant\|\vec{u}\|\,\|\vec{v}\|}$$

    *Cas d'égalité.* Comme on sait déjà que $\Delta\leqslant 0$, il y a égalité si et seulement si $\Delta=0$, c'est-à-dire si et seulement si $f$ s'annule en un réel $x_0$. Or $f(x_0)=0$ signifie $\|x_0\vec{u}+\vec{v}\|=0$, c'est-à-dire $\vec{v}=-x_0\vec{u}$. Réciproquement, si $\vec{v}=\lambda\vec{u}$, alors $f(-\lambda)=0$. Ainsi : 
    $$\boxed{\left|\vec{u}\cdot\vec{v}\right|=\|\vec{u}\|\,\|\vec{v}\| \iff \vec{u} \text{ et } \vec{v} \text{ sont colinéaires.}}$$

    *Remarque.* Deux vecteurs de l'espace étant toujours coplanaires, cette inégalité se lit aussi sur l'expression $\vec{u}\cdot\vec{v}=\|\vec{u}\|\,\|\vec{v}\|\cos\theta$ : elle dit simplement que $|\cos\theta|\leqslant 1$. L'intérêt de la démonstration par le trinôme est ailleurs : elle n'utilise que la distributivité et la positivité de $\vec{w}\cdot\vec{w}$, et elle s'applique donc mot pour mot à des sommes de $n$ termes, ce qui est la forme générale du théorème de Cauchy-Schwarz qu'on rencontre en classe préparatoire.

    **2.** On applique la question 1 aux vecteurs $\vec{u}\begin{pmatrix}1\\1\\1\end{pmatrix}$ et $\vec{v}\begin{pmatrix}x\\y\\z\end{pmatrix}$ dans un repère orthonormé, de normes respectives $\sqrt{3}$ et $1$ : 
    $$x+y+z\leqslant|x+y+z|=\left|\vec{u}\cdot\vec{v}\right|\leqslant\sqrt{3}\times 1=\sqrt{3}$$
     Il y a égalité si et seulement si les deux inégalités sont des égalités : $\vec{v}$ doit être colinéaire à $\vec{u}$, donc $x=y=z=\lambda$ avec $3\lambda^{2}=1$, et de plus $x+y+z=3\lambda$ doit être positif, ce qui impose $\lambda=\dfrac{1}{\sqrt{3}}$. 
    $$\boxed{x+y+z=\sqrt{3} \iff x=y=z=\frac{1}{\sqrt{3}}}$$
     *Interprétation :* les points $(x\,;y\,;z)$ considérés forment la sphère de centre $O$ et de rayon $1$ (exercice 32), et le résultat dit que le plan d'équation $x+y+z=\sqrt{3}$ touche cette sphère en un seul point : il lui est tangent, comme on le vérifierait avec la méthode de l'exercice 33, puisque sa distance à $O$ vaut $\frac{\sqrt{3}}{\sqrt{3}}=1$.

    **3.** Notons $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$, vecteur normal à $\mathcal{P}$, et soit $M(x\,;y\,;z)$ un point de $\mathcal{P}$. Comme $ax+by+cz+d=0$, on peut faire disparaître $d$ : 
    $$ax_A+by_A+cz_A+d=a(x_A-x)+b(y_A-y)+c(z_A-z)=\vec{n}\cdot\overrightarrow{MA}$$
     L'inégalité de la question 1 donne alors $\left|ax_A+by_A+cz_A+d\right|=\left|\vec{n}\cdot\overrightarrow{MA}\right|\leqslant\|\vec{n}\|\times AM$, c'est-à-dire, puisque $\|\vec{n}\|=\sqrt{a^{2}+b^{2}+c^{2}}>0$ : 
    $$\boxed{AM\geqslant\frac{\left|ax_A+by_A+cz_A+d\right|}{\sqrt{a^{2}+b^{2}+c^{2}}}}$$
     D'après le cas d'égalité, cette borne est atteinte exactement lorsque $\overrightarrow{MA}$ est colinéaire à $\vec{n}$, c'est-à-dire lorsque $M$ appartient à la droite passant par $A$ et dirigée par $\vec{n}$. Cette droite a pour représentation paramétrique $(x_A+ta\,;y_A+tb\,;z_A+tc)$, et elle coupe $\mathcal{P}$ pour une unique valeur de $t$, puisque la condition d'appartenance s'écrit $(a^{2}+b^{2}+c^{2})\,t=-(ax_A+by_A+cz_A+d)$. 
    $$\boxed{\text{La borne est atteinte en un unique point : le projeté orthogonal } H \text{ de } A \text{ sur } \mathcal{P}.}$$
     *Ce que l'on a démontré :* on retrouve la formule du cours donnant la distance d'un point à un plan, mais avec une information supplémentaire. Cette distance est la *plus petite* des distances $AM$ lorsque $M$ parcourt le plan, et le projeté orthogonal est le seul point qui la réalise. Avec le tétraèdre de l'exercice 34, on retrouve ainsi que $6/7$ est la plus courte distance de $O$ à un point du plan $(ABC)$.
- id: "t-04-36"
