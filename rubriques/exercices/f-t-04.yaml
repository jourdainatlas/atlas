  noeuds: [v-libre]
  notions: [famille-libre, norme]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 350 et n° 352, transposés des nombres complexes aux vecteurs de l'espace"
  page_enonce: 15
  page_corrige: 29
  enonce: |
    *Médianes d'un triangle, médianes d'un tétraèdre.*

    **1.** Soient $A$, $B$, $C$ trois points non alignés de l'espace et $I$ le milieu de $[BC]$. Déduire de l'identité du parallélogramme (exercice 9) une expression de $AI^{2}$ en fonction de $AB^{2}$, $BC^{2}$ et $CA^{2}$.

    **2.** Soit $G$ le point défini par $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$. Montrer que les trois médianes du triangle $ABC$ passent par $G$.

    **3.** Soit $ABCD$ un tétraèdre. On appelle *médianes* du tétraèdre les quatre droites qui joignent un sommet au centre de gravité de la face opposée, et *bimédianes* les trois segments qui joignent les milieux de deux arêtes opposées. Montrer que les quatre médianes et les trois bimédianes passent par un même point, que l'on caractérisera par une relation vectorielle.

    **4.** Montrer que la somme des carrés des longueurs des trois bimédianes est égale au quart de la somme des carrés des longueurs des six arêtes.
  corrige: |
    **1.** On applique l'identité du parallélogramme $\|\vec{u}+\vec{v}\|^{2}+\|\vec{u}-\vec{v}\|^{2}=2\|\vec{u}\|^{2}+2\|\vec{v}\|^{2}$ aux vecteurs $\vec{u}=\overrightarrow{AB}$ et $\vec{v}=\overrightarrow{AC}$. Comme $I$ est le milieu de $[BC]$, $\overrightarrow{AB}+\overrightarrow{AC}=2\overrightarrow{AI}$, et par la relation de Chasles $\overrightarrow{AB}-\overrightarrow{AC}=\overrightarrow{CB}$. Il vient $4AI^{2}+BC^{2}=2AB^{2}+2AC^{2}$, d'où le *théorème de la médiane* : 
    $$\boxed{AI^{2}=\frac{AB^{2}+CA^{2}}{2}-\frac{BC^{2}}{4}}$$
     *Vérification :* avec le triangle $A(0\,;0\,;0)$, $B(2\,;1\,;2)$, $C(1\,;2\,;-2)$ de l'exercice 8, on a $AB^{2}=AC^{2}=9$ et $BC^{2}=18$, donc $AI^{2}=9-\frac{9}{2}=\frac{9}{2}$. Le calcul direct avec $I\left(\frac{3}{2}\,;\frac{3}{2}\,;0\right)$ donne bien $\frac{9}{4}+\frac{9}{4}=\frac{9}{2}$. Ce triangle étant rectangle en $A$, on retrouve au passage que la médiane issue de l'angle droit mesure la moitié de l'hypoténuse : $AI=\frac{BC}{2}$.

    **2.** Par la relation de Chasles, $\overrightarrow{GB}=\overrightarrow{GA}+\overrightarrow{AB}$ et $\overrightarrow{GC}=\overrightarrow{GA}+\overrightarrow{AC}$, donc : 
    $$\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0} \iff 3\overrightarrow{GA}+\overrightarrow{AB}+\overrightarrow{AC}=\vec{0} \iff \overrightarrow{AG}=\frac{1}{3}\left(\overrightarrow{AB}+\overrightarrow{AC}\right)=\frac{2}{3}\overrightarrow{AI}$$
     Le point $G$ existe donc, il est unique, et il appartient à la médiane $(AI)$, aux deux tiers en partant de $A$. La relation qui définit $G$ ne change pas lorsqu'on permute les lettres $A$, $B$ et $C$ : le même calcul, mené à partir de $B$ puis de $C$, montre que $G$ appartient aussi aux deux autres médianes. 
    $$\boxed{\text{Les trois médianes sont concourantes en } G.}$$

    **3.** On définit cette fois $G$ par $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}+\overrightarrow{GD}=\vec{0}$. Le même calcul qu'à la question 2 donne 
    $$\overrightarrow{AG}=\frac{1}{4}\left(\overrightarrow{AB}+\overrightarrow{AC}+\overrightarrow{AD}\right)$$
     ce qui prouve que $G$ existe et est unique. Notons $G_A$ le centre de gravité de la face $BCD$ ; la question 2, appliquée au triangle $BCD$, donne $3\overrightarrow{G_AA}+\overrightarrow{AB}+\overrightarrow{AC}+\overrightarrow{AD} =\vec{0}$ après décomposition par Chasles, donc $\overrightarrow{AG_A}=\frac{1}{3}\left(\overrightarrow{AB}+\overrightarrow{AC}+\overrightarrow{AD}\right)$. En comparant : 
    $$\overrightarrow{AG}=\frac{3}{4}\,\overrightarrow{AG_A}$$
     Le point $G$ est donc sur la médiane $(AG_A)$, aux trois quarts en partant de $A$, et par symétrie des rôles sur les trois autres médianes.

    Pour les bimédianes, notons $I$ le milieu de $[AB]$ et $J$ celui de $[CD]$. Comme $\overrightarrow{GA}+\overrightarrow{GB}=2\overrightarrow{GI}$ et $\overrightarrow{GC}+\overrightarrow{GD}=2\overrightarrow{GJ}$, la relation qui définit $G$ devient $2\overrightarrow{GI}+2\overrightarrow{GJ}=\vec{0}$ : $G$ est le milieu de $[IJ]$. Il en va de même pour les deux autres couples d'arêtes opposées. 
    $$\boxed{\text{Médianes et bimédianes passent par } G \text{, défini par } \overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}+\overrightarrow{GD}=\vec{0}.}$$

    ![Figure](documents/figures/af50110cbbc5fd01.svg)

    Sur cette figure, on lit que deux médianes (en ocre) et une bimédiane (en violet) se coupent en $G$, qui est le milieu de $[IJ]$ et se trouve aux trois quarts de chaque médiane en partant du sommet.

    *Remarque.* Le coefficient $\frac{2}{3}$ du triangle devient $\frac{3}{4}$ pour le tétraèdre : dans les deux cas, $G$ est l'*isobarycentre* des sommets, et l'on devine la règle générale pour $n$ points. L'erreur la plus répandue est de croire que $G$ est aux deux tiers des médianes du tétraèdre, par analogie hâtive avec le triangle.

    **4.** Prenons $G$ pour origine et notons $\vec{a}=\overrightarrow{GA}$, $\vec{b}=\overrightarrow{GB}$, $\vec{c}=\overrightarrow{GC}$, $\vec{d}=\overrightarrow{GD}$, de sorte que $\vec{a}+\vec{b}+\vec{c}+\vec{d}=\vec{0}$, et posons $S=\|\vec{a}\|^{2}+\|\vec{b}\|^{2}+\|\vec{c}\|^{2}+\|\vec{d}\|^{2}$.

    *Bimédianes.* Avec les notations de la question 3, $\overrightarrow{GI}=\frac{1}{2}(\vec{a}+\vec{b})$ et $\overrightarrow{GJ}=\frac{1}{2}(\vec{c}+\vec{d})=-\frac{1}{2}(\vec{a}+\vec{b})$, donc $IJ=\|\overrightarrow{GJ}-\overrightarrow{GI}\|=\|\vec{a}+\vec{b}\|$. De même, les deux autres bimédianes ont pour longueurs $\|\vec{a}+\vec{c}\|$ et $\|\vec{a}+\vec{d}\|$. En développant, et en utilisant $\vec{b}+\vec{c}+\vec{d}=-\vec{a}$ : 
    $$\|\vec{a}+\vec{b}\|^{2}+\|\vec{a}+\vec{c}\|^{2}+\|\vec{a}+\vec{d}\|^{2} =3\|\vec{a}\|^{2}+\left(S-\|\vec{a}\|^{2}\right)+2\,\vec{a}\cdot\left(\vec{b}+\vec{c}+\vec{d}\right) =S$$

    *Arêtes.* Notons $P$ la somme des six produits scalaires $\vec{a}\cdot\vec{b}$, $\vec{a}\cdot\vec{c}$, …, $\vec{c}\cdot\vec{d}$. D'une part $0=\|\vec{a}+\vec{b}+\vec{c}+\vec{d}\|^{2}=S+2P$, donc $2P=-S$. D'autre part, chaque vecteur apparaît dans trois arêtes, si bien que 
    $$AB^{2}+AC^{2}+AD^{2}+BC^{2}+BD^{2}+CD^{2}=\|\vec{a}-\vec{b}\|^{2}+\dots+\|\vec{c}-\vec{d}\|^{2} =3S-2P=4S$$
     En comparant les deux résultats : 
    $$\boxed{IJ^{2}+I'J'^{2}+I''J''^{2}=\frac{1}{4}\left(AB^{2}+AC^{2}+AD^{2}+BC^{2}+BD^{2}+CD^{2} \right)}$$
     où $[I'J']$ et $[I''J'']$ désignent les deux autres bimédianes.

    *Vérification :* dans un tétraèdre régulier d'arête $1$, chaque bimédiane mesure $\frac{\sqrt{2}}{2}$ (on peut l'inscrire dans un cube d'arête $\frac{\sqrt{2}}{2}$, ses arêtes étant alors des diagonales de faces, et chaque bimédiane joint alors les centres de deux faces opposées du cube). La somme des carrés des bimédianes vaut $3\times\frac{1}{2}=\frac{3}{2}$, et le quart de la somme des carrés des arêtes vaut $\frac{6}{4}=\frac{3}{2}$.

    *Remarque.* Le choix de l'origine en $G$ est ce qui rend le calcul court : la relation $\vec{a}+\vec{b}+\vec{c}+\vec{d}=\vec{0}$ permet de remplacer toute somme de trois vecteurs par l'opposé du quatrième. C'est un réflexe à acquérir, déjà présent dans la question 2.
- id: "t-04-37"
  feuille: "f-t-04"
