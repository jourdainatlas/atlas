- id: "t-04-01"
  feuille: "f-t-04"
  numero: 1
  partie: "Repères, bases et coordonnées"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [cube et pavé, repère, base, coordonnées, milieu]
  noeuds: [v-libre]
  notions: [base-vectorielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    $ABCDEFGH$ est un cube d'arête $1$. On munit l'espace du repère $\left(A\,;\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$.

    ![Figure](documents/figures/e757d9a183860800.svg)

    **1.** Justifier que $\left(\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$ est bien une base de l'espace, et que le repère est orthonormé.

    **2.** Donner les coordonnées des huit sommets du cube dans ce repère.

    **3.** Donner les coordonnées :

    **a)** du centre $I$ de la face $EFGH$ ;

    **b)** du centre $\Omega$ du cube ;

    **c)** du milieu $J$ de $[BC]$ ;

    **d)** du milieu $K$ de $[CG]$.

    **4.** Donner les coordonnées du point $L$ tel que $\overrightarrow{AL}=\dfrac{2}{3}\overrightarrow{AG}$.
  corrige: |
    **1.** Le point $E$ n'appartient pas au plan $(ABD)$, qui est la face inférieure du cube : les quatre points $A$, $B$, $D$ et $E$ ne sont donc pas coplanaires, et $\left(A\,;\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$ est bien un repère de l'espace.

    L'arête du cube valant $1$, les trois vecteurs sont de norme $1$ ; ils portent par ailleurs trois arêtes issues du même sommet d'un cube, donc sont orthogonaux deux à deux. 
    $$\boxed{\text{Le repère est orthonormé.}}$$

    **2.** On lit les coordonnées en décomposant chaque vecteur $\overrightarrow{AM}$ sur la base :

    • $A(0\,;0\,;0)$

    • $B(1\,;0\,;0)$

    • $C(1\,;1\,;0)$

    • $D(0\,;1\,;0)$

    • $E(0\,;0\,;1)$

    • $F(1\,;0\,;1)$

    • $G(1\,;1\,;1)$

    • $H(0\,;1\,;1)$

    *Repère de lecture :* la première coordonnée se déplace de $A$ vers $B$, la deuxième de $A$ vers $D$, la troisième de $A$ vers $E$. Les quatre sommets du bas ont donc une cote nulle, les quatre du haut une cote égale à $1$.

    **3.** Un milieu s'obtient en faisant la moyenne des coordonnées.

    **(a)** $I$ est le milieu de $[EG]$ : $\;\boxed{I\left(\dfrac{1}{2}\,;\dfrac{1}{2}\,;1\right)}$

    **(b)** $\Omega$ est le milieu de $[AG]$ : $\;\boxed{\Omega\left(\dfrac{1}{2}\,;\dfrac{1}{2}\,;\dfrac{1}{2}\right)}$

    **(c)** $J$ est le milieu de $[BC]$ : $\;\boxed{J\left(1\,;\dfrac{1}{2}\,;0\right)}$

    **(d)** $K$ est le milieu de $[CG]$ : $\;\boxed{K\left(1\,;1\,;\dfrac{1}{2}\right)}$

    **4.** $\overrightarrow{AG}$ a pour coordonnées $(1\,;1\,;1)$, donc $\overrightarrow{AL}=\dfrac{2}{3}\overrightarrow{AG}$ a pour coordonnées $\left(\dfrac{2}{3}\,;\dfrac{2}{3}\,;\dfrac{2}{3}\right)$. Comme $A$ est l'origine : 
    $$\boxed{L\left(\dfrac{2}{3}\,;\dfrac{2}{3}\,;\dfrac{2}{3}\right)}$$
- id: "t-04-02"
  feuille: "f-t-04"
  numero: 2
  partie: "Repères, bases et coordonnées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cube et pavé, base, relation de Chasles]
  noeuds: [v-libre]
  notions: [base-vectorielle]
  page_enonce: 1
  page_corrige: 1
  enonce: |
    On reprend le cube de l'exercice 1 et la base $\left(\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$. Décomposer sur cette base chacun des vecteurs suivants, en détaillant l'utilisation de la relation de Chasles.

    **a)** $\overrightarrow{AG}$

    **b)** $\overrightarrow{BH}$

    **c)** $\overrightarrow{CE}$

    **d)** $\overrightarrow{DF}$

    **e)** $\overrightarrow{AC}$

    **f)** $\overrightarrow{BD}$

    **g)** $\overrightarrow{EC}$

    **h)** $\overrightarrow{FH}$

    **i)** $\overrightarrow{AI}$ ($I$ centre de $EFGH$)
  corrige: |
    *On utilise systématiquement la relation de Chasles, ainsi que les égalités $\overrightarrow{BC}=\overrightarrow{AD}$, $\overrightarrow{CG}=\overrightarrow{AE}$, etc., qui traduisent le parallélisme des arêtes.*

    **a)** $\overrightarrow{AG}=\overrightarrow{AB}+\overrightarrow{BC}+\overrightarrow{CG}=\boxed{\overrightarrow{AB}+\overrightarrow{AD}+\overrightarrow{AE}}$

    **b)** $\overrightarrow{BH}=\overrightarrow{BA}+\overrightarrow{AD}+\overrightarrow{DH}=\boxed{-\overrightarrow{AB}+\overrightarrow{AD}+\overrightarrow{AE}}$

    **c)** $\overrightarrow{CE}=\overrightarrow{CB}+\overrightarrow{BA}+\overrightarrow{AE}=\boxed{-\overrightarrow{AB}-\overrightarrow{AD}+\overrightarrow{AE}}$

    **d)** $\overrightarrow{DF}=\overrightarrow{DA}+\overrightarrow{AB}+\overrightarrow{BF}=\boxed{\overrightarrow{AB}-\overrightarrow{AD}+\overrightarrow{AE}}$

    **e)** $\overrightarrow{AC}=\overrightarrow{AB}+\overrightarrow{BC}=\boxed{\overrightarrow{AB}+\overrightarrow{AD}}$

    **f)** $\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{AD}=\boxed{-\overrightarrow{AB}+\overrightarrow{AD}}$

    **g)** $\overrightarrow{EC}=\overrightarrow{EA}+\overrightarrow{AB}+\overrightarrow{BC}=\boxed{\overrightarrow{AB}+\overrightarrow{AD}-\overrightarrow{AE}}$

    **h)** $\overrightarrow{FH}=\overrightarrow{FE}+\overrightarrow{EH}=\boxed{-\overrightarrow{AB}+\overrightarrow{AD}}$

    **i)** $\overrightarrow{AI}=\overrightarrow{AE}+\overrightarrow{EI}=\overrightarrow{AE}+\dfrac{1}{2}\overrightarrow{EG} =\boxed{\dfrac{1}{2}\overrightarrow{AB}+\dfrac{1}{2}\overrightarrow{AD}+\overrightarrow{AE}}$

    *On remarque que* $\overrightarrow{FH}=\overrightarrow{BD}$ : les deux diagonales sont portées par des faces parallèles, ce que la décomposition rend évident.
- id: "t-04-03"
  feuille: "f-t-04"
  numero: 3
  partie: "Repères, bases et coordonnées"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repère, coordonnées, milieu, colinéarité]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 1
  page_corrige: 2
  enonce: |
    L'espace est muni d'un repère orthonormé. On donne les points 
    $$A(1\,;-2\,;3) \qquad B(4\,;0\,;-1) \qquad C(-2\,;5\,;2) \qquad D(0\,;1\,;1)$$

    **1.** Déterminer les coordonnées des vecteurs $\overrightarrow{AB}$, $\overrightarrow{AC}$, $\overrightarrow{BD}$ et $\overrightarrow{CD}$.

    **2.** Déterminer les coordonnées des vecteurs $\overrightarrow{AB}+\overrightarrow{AC}$, $\;2\overrightarrow{AB}-3\overrightarrow{CD}$ et $\;\dfrac{1}{2}\overrightarrow{BD}+\overrightarrow{AC}$.

    **3.** Déterminer les coordonnées du milieu $M$ de $[AB]$, puis celles du milieu $N$ de $[CD]$.

    **4.** Déterminer les coordonnées du point $E$ tel que $ABEC$ soit un parallélogramme.

    **5.** Déterminer les coordonnées du point $F$ tel que $\overrightarrow{AF}=2\overrightarrow{AB}-\overrightarrow{AC}+\overrightarrow{AD}$.
  corrige: |
    **1.** On soustrait les coordonnées du point de départ à celles du point d'arrivée : 
    $$\overrightarrow{AB}\begin{pmatrix}3\\2\\-4\end{pmatrix} \qquad \overrightarrow{AC}\begin{pmatrix}-3\\7\\-1\end{pmatrix} \qquad \overrightarrow{BD}\begin{pmatrix}-4\\1\\2\end{pmatrix} \qquad \overrightarrow{CD}\begin{pmatrix}2\\-4\\-1\end{pmatrix}$$

    **2.** $\overrightarrow{AB}+\overrightarrow{AC}=\boxed{\begin{pmatrix}0\\9\\-5\end{pmatrix}}$ $2\overrightarrow{AB}-3\overrightarrow{CD}=\begin{pmatrix}6\\4\\-8\end{pmatrix}-\begin{pmatrix}6\\-12\\-3\end{pmatrix}=\boxed{\begin{pmatrix}0\\16\\-5\end{pmatrix}}$

    $\dfrac{1}{2}\overrightarrow{BD}+\overrightarrow{AC}=\begin{pmatrix}-2\\\frac{1}{2}\\1\end{pmatrix}+\begin{pmatrix}-3\\7\\-1\end{pmatrix} =\boxed{\begin{pmatrix}-5\\\frac{15}{2}\\0\end{pmatrix}}$

    **3.** $\boxed{M\left(\dfrac{5}{2}\,;-1\,;1\right)}$ et $\boxed{N\left(-1\,;3\,;\dfrac{3}{2}\right)}$

    **4.** $ABEC$ est un parallélogramme si et seulement si $\overrightarrow{AB}=\overrightarrow{CE}$, donc $E=C+\overrightarrow{AB}$ : 
    $$\boxed{E(1\,;7\,;-2)}$$

    **5.** $\overrightarrow{AD}\begin{pmatrix}-1\\3\\-2\end{pmatrix}$, donc $2\overrightarrow{AB}-\overrightarrow{AC}+\overrightarrow{AD}=\begin{pmatrix}6\\4\\-8\end{pmatrix}+\begin{pmatrix}3\\-7\\1\end{pmatrix}+\begin{pmatrix}-1\\3\\-2\end{pmatrix}=\begin{pmatrix}8\\0\\-9\end{pmatrix}$. En ajoutant à $A$ : 
    $$\boxed{F(9\,;-2\,;-6)}$$
- id: "t-04-04"
  feuille: "f-t-04"
  numero: 4
  partie: "Repères, bases et coordonnées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [colinéarité, positions relatives]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 2
  page_corrige: 2
  enonce: |
    **1.** Dans chaque cas, dire si les vecteurs $\vec{u}$ et $\vec{v}$ sont colinéaires.

    **a)** $\vec{u}\begin{pmatrix}2\\-1\\3\end{pmatrix}$, $\vec{v}\begin{pmatrix}-6\\3\\-9\end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix}1\\2\\-1\end{pmatrix}$, $\vec{v}\begin{pmatrix}3\\6\\-2\end{pmatrix}$

    **c)** $\vec{u}\begin{pmatrix}0\\4\\-2\end{pmatrix}$, $\vec{v}\begin{pmatrix}0\\-6\\3\end{pmatrix}$

    **2.** Les points $A(1\,;2\,;3)$, $B(3\,;5\,;1)$ et $C(7\,;11\,;-3)$ sont-ils alignés ?

    **3.** Même question avec $A(0\,;1\,;2)$, $B(2\,;3\,;1)$ et $C(-2\,;-1\,;4)$.

    **4.** Déterminer le réel $m$ pour que $\vec{u}\begin{pmatrix}m\\2\\-1\end{pmatrix}$ et $\vec{v}\begin{pmatrix}6\\-4\\2\end{pmatrix}$ soient colinéaires.

    **5.** On donne les points suivants : 
    $$A(1\,;0\,;1) \qquad B(3\,;2\,;-1) \qquad C(0\,;0\,;0) \qquad D(-1\,;-1\,;1)$$
     Les droites $(AB)$ et $(CD)$ sont-elles parallèles ? Sont-elles confondues ?
  corrige: |
    **1.** Deux vecteurs sont colinéaires si et seulement si leurs coordonnées sont proportionnelles.

    **(a)** $\vec{v}=-3\,\vec{u}$ : $\;\boxed{\text{colinéaires}}$

    **(b)** Le coefficient serait $3$ d'après les deux premières coordonnées, mais $3\times(-1)=-3\neq -2$ : $\;\boxed{\text{non colinéaires}}$

    **(c)** $\vec{v}=-\dfrac{3}{2}\,\vec{u}$ (la première coordonnée, nulle des deux côtés, ne pose aucune difficulté) : $\;\boxed{\text{colinéaires}}$

    **2.** $\overrightarrow{AB}\begin{pmatrix}2\\3\\-2\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}6\\9\\-6\end{pmatrix}=3\,\overrightarrow{AB}$ : 
    $$\boxed{A,\ B \text{ et } C \text{ sont alignés.}}$$

    **3.** $\overrightarrow{AB}\begin{pmatrix}2\\2\\-1\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}-2\\-2\\2\end{pmatrix}$. Le coefficient serait $-1$ d'après les deux premières coordonnées, mais $-1\times(-1)=1\neq 2$ : 
    $$\boxed{\text{les trois points ne sont pas alignés.}}$$

    **4.** Les deux dernières coordonnées imposent $\dfrac{-4}{2}=\dfrac{2}{-1}=-2$, donc le coefficient est $-2$ et $6=-2m$ : 
    $$\boxed{m=-3}$$

    **5.** $\overrightarrow{AB}\begin{pmatrix}2\\2\\-2\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}-1\\-1\\1\end{pmatrix}=-\dfrac{1}{2}\overrightarrow{AB}$ : les vecteurs directeurs sont colinéaires. 
    $$\boxed{(AB) \text{ et } (CD) \text{ sont parallèles.}}$$

    Sont-elles confondues ? On teste si $C$ appartient à $(AB)$ : $\overrightarrow{AC}\begin{pmatrix}-1\\0\\-1\end{pmatrix}$ n'est pas colinéaire à $\overrightarrow{AB}$ (la deuxième coordonnée est nulle sans que les autres le soient). 
    $$\boxed{\text{Les droites sont strictement parallèles.}}$$
- id: "t-04-05"
  feuille: "f-t-04"
  numero: 5
  partie: "Repères, bases et coordonnées"
  etoiles: 2
  types: [Calcul]
  mots_cles: [colinéarité, coplanarité]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 2
  page_corrige: 3
  enonce: |
    *On appliquera la méthode du cours : vérifier d'abord que deux d'entre eux, par exemple $\vec{v}$ et $\vec{w}$, ne sont pas colinéaires **entre eux** ; écrire ensuite $\vec{u}=a\vec{v}+b\vec{w}$ coordonnée par coordonnée ; résoudre le système à l'aide de deux équations, puis tester le couple obtenu dans la troisième.*

    **1.** Les vecteurs suivants sont-ils coplanaires ?

    **(a)** $\vec{u}\begin{pmatrix}3\\1\\5\end{pmatrix}$, $\vec{v}\begin{pmatrix}1\\0\\1\end{pmatrix}$, $\vec{w}\begin{pmatrix}0\\1\\2\end{pmatrix}$

    **(b)** $\vec{u}\begin{pmatrix}2\\-1\\4\end{pmatrix}$, $\vec{v}\begin{pmatrix}1\\1\\0\end{pmatrix}$, $\vec{w}\begin{pmatrix}0\\1\\2\end{pmatrix}$

    **(c)** $\vec{u}\begin{pmatrix}1\\-1\\2\end{pmatrix}$, $\vec{v}\begin{pmatrix}2\\1\\0\end{pmatrix}$, $\vec{w}\begin{pmatrix}0\\3\\-4\end{pmatrix}$

    **2.** Les points $A(1\,;0\,;0)$, $B(0\,;1\,;0)$, $C(0\,;0\,;1)$ et $D(1\,;1\,;-1)$ sont-ils coplanaires ?

    **3.** Même question avec $A(1\,;0\,;0)$, $B(0\,;1\,;0)$, $C(0\,;0\,;1)$ et $D(1\,;1\,;1)$.

    **4.** Les vecteurs $\vec{u}\begin{pmatrix}1\\2\\-1\end{pmatrix}$, $\vec{v}\begin{pmatrix}2\\4\\-2\end{pmatrix}$ et $\vec{w}\begin{pmatrix}3\\0\\5\end{pmatrix}$ sont-ils coplanaires ? *On observera d'abord $\vec{u}$ et $\vec{v}$.*
  corrige: |
    **1.** **(a)** $\vec{v}$ et $\vec{w}$ ne sont pas colinéaires. On cherche $a$ et $b$ tels que $\vec{u}=a\vec{v}+b\vec{w}$ : 
    $$\begin{cases} 3=a \\ 1=b \\ 5=a+2b \end{cases}$$
     Les deux premières donnent $a=3$ et $b=1$. Test dans la troisième : $3+2=5$, vérifié. 
    $$\boxed{\text{Les trois vecteurs sont coplanaires, et } \vec{u}=3\vec{v}+\vec{w}.}$$

    **(b)** $\vec{v}$ et $\vec{w}$ ne sont pas colinéaires : 
    $$\begin{cases} 2=a \\ -1=a+b \\ 4=2b \end{cases}$$
     Les deux premières donnent $a=2$ et $b=-3$. Test dans la troisième : $2\times(-3)=-6\neq 4$. 
    $$\boxed{\text{Les trois vecteurs ne sont pas coplanaires.}}$$

    **(c)** $\vec{v}$ et $\vec{w}$ ne sont pas colinéaires : 
    $$\begin{cases} 1=2a \\ -1=a+3b \\ 2=-4b \end{cases}$$
     La première donne $a=\frac{1}{2}$, la troisième $b=-\frac{1}{2}$. Test dans la deuxième : $\frac{1}{2}-\frac{3}{2}=-1$, vérifié. 
    $$\boxed{\text{Les trois vecteurs sont coplanaires.}}$$

    **2.** Quatre points sont coplanaires si et seulement si les trois vecteurs $\overrightarrow{AB}$, $\overrightarrow{AC}$ et $\overrightarrow{AD}$ le sont. Ici $\overrightarrow{AB}\begin{pmatrix}-1\\1\\0\end{pmatrix}$, $\overrightarrow{AC}\begin{pmatrix}-1\\0\\1\end{pmatrix}$ et $\overrightarrow{AD}\begin{pmatrix}0\\1\\-1\end{pmatrix}$ : 
    $$\begin{cases} 0=-a-b \\ 1=a \\ -1=b \end{cases}$$
     Les deux dernières donnent $a=1$ et $b=-1$. Test dans la première : $-1+1=0$, vérifié. 
    $$\boxed{\text{Les quatre points sont coplanaires.}}$$

    **3.** Cette fois $\overrightarrow{AD}\begin{pmatrix}0\\1\\1\end{pmatrix}$, d'où $a=1$, $b=1$ et, dans la première équation, $-1-1=-2\neq 0$ : 
    $$\boxed{\text{Les quatre points ne sont pas coplanaires.}}$$

    **4.** Ici la méthode ne s'applique pas telle quelle, car $\vec{v}=2\vec{u}$ : les deux premiers vecteurs sont colinéaires. Mais c'est justement ce qui permet de conclure immédiatement.

    En effet, $\vec{u}$ et $\vec{v}$ ayant la même direction, il suffit d'un plan contenant cette direction et celle de $\vec{w}$ pour les contenir tous les trois. 
    $$\boxed{\text{Les trois vecteurs sont coplanaires.}}$$
     *Le cours le signalait :* deux vecteurs colinéaires sont toujours coplanaires avec n'importe quel troisième.
- id: "t-04-06"
  feuille: "f-t-04"
  numero: 6
  partie: "Produit scalaire, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repère, coordonnées, produit scalaire, orthogonalité, norme et distance]
  noeuds: [f-hilbert]
  notions: [norme]
  page_enonce: 2
  page_corrige: 4
  enonce: |
    L'espace est muni d'un repère orthonormé. On donne 
    $$\vec{u}\begin{pmatrix}2\\-1\\3\end{pmatrix} \qquad \vec{v}\begin{pmatrix}1\\4\\-2\end{pmatrix} \qquad \vec{w}\begin{pmatrix}0\\3\\1\end{pmatrix}$$

    **1.** Calculer $\vec{u}\cdot\vec{v}$, $\;\vec{u}\cdot\vec{w}$ et $\;\vec{v}\cdot\vec{w}$.

    **2.** Calculer $\|\vec{u}\|$, $\|\vec{v}\|$ et $\|\vec{w}\|$.

    **3.** Parmi ces trois vecteurs, quels sont ceux qui sont orthogonaux ?

    **4.** Calculer $\vec{u}\cdot(\vec{v}+\vec{w})$ de deux façons différentes.

    **5.** Calculer $\|\vec{u}+\vec{v}\|$, d'abord en déterminant les coordonnées de $\vec{u}+\vec{v}$, puis à l'aide de l'identité $\|\vec{u}+\vec{v}\|^{2}=\|\vec{u}\|^{2}+2\,\vec{u}\cdot\vec{v} +\|\vec{v}\|^{2}$.
  corrige: |
    **1.** Le repère étant orthonormé, on applique $\vec{u}\cdot\vec{v}=xx'+yy'+zz'$ : 
    $$\vec{u}\cdot\vec{v}=2-4-6=\boxed{-8} \qquad \vec{u}\cdot\vec{w}=0-3+3=\boxed{0} \qquad \vec{v}\cdot\vec{w}=0+12-2=\boxed{10}$$

    **2.** $\|\vec{u}\|=\sqrt{4+1+9}=\boxed{\sqrt{14}}$ $\|\vec{v}\|=\sqrt{1+16+4}=\boxed{\sqrt{21}}$ $\|\vec{w}\|=\sqrt{0+9+1}=\boxed{\sqrt{10}}$

    **3.** Le produit scalaire $\vec{u}\cdot\vec{w}$ est nul : 
    $$\boxed{\vec{u} \text{ et } \vec{w} \text{ sont orthogonaux}}$$
     Les deux autres produits ne le sont pas.

    **4.** **Première méthode :** $\vec{v}+\vec{w}\begin{pmatrix}1\\7\\-1\end{pmatrix}$, donc $\vec{u}\cdot(\vec{v}+\vec{w})=2-7-3=-8$.

    **Seconde méthode :** par bilinéarité, $\vec{u}\cdot(\vec{v}+\vec{w})=\vec{u}\cdot\vec{v}+\vec{u}\cdot\vec{w}=-8+0=-8$. 
    $$\boxed{\vec{u}\cdot(\vec{v}+\vec{w})=-8}$$

    **5.** **Par les coordonnées :** $\vec{u}+\vec{v}\begin{pmatrix}3\\3\\1\end{pmatrix}$, donc $\|\vec{u}+\vec{v}\|=\sqrt{9+9+1}=\sqrt{19}$.

    **Par l'identité :** 
    $$\|\vec{u}+\vec{v}\|^{2}=\|\vec{u}\|^{2}+2\,\vec{u}\cdot\vec{v}+\|\vec{v}\|^{2} =14+2\times(-8)+21=19$$

    $$\boxed{\|\vec{u}+\vec{v}\|=\sqrt{19}}$$
- id: "t-04-07"
  feuille: "f-t-04"
  numero: 7
  partie: "Produit scalaire, normes et distances"
  etoiles: 1
  types: [Calcul]
  mots_cles: [orthogonalité]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 3
  page_corrige: 5
  enonce: |
    **1.** Dans chaque cas, les vecteurs $\vec{u}$ et $\vec{v}$ sont-ils orthogonaux ?

    **a)** $\vec{u}\begin{pmatrix}1\\2\\-1\end{pmatrix}$, $\vec{v}\begin{pmatrix}3\\-1\\1\end{pmatrix}$

    **b)** $\vec{u}\begin{pmatrix}2\\0\\3\end{pmatrix}$, $\vec{v}\begin{pmatrix}1\\5\\-1\end{pmatrix}$

    **c)** $\vec{u}\begin{pmatrix}-2\\1\\4\end{pmatrix}$, $\vec{v}\begin{pmatrix}3\\2\\1\end{pmatrix}$

    **2.** Déterminer le réel $m$ pour que $\vec{u}\begin{pmatrix}m\\1\\2\end{pmatrix}$ et $\vec{v}\begin{pmatrix}3\\-2\\1\end{pmatrix}$ soient orthogonaux.

    **3.** Déterminer le réel $m$ pour que $\vec{u}\begin{pmatrix}1\\m\\-2\end{pmatrix}$ et $\vec{v}\begin{pmatrix}2\\3\\m\end{pmatrix}$ soient orthogonaux.

    **4.** Déterminer un vecteur non nul orthogonal à la fois à $\vec{u}\begin{pmatrix}1\\1\\0\end{pmatrix}$ et à $\vec{v}\begin{pmatrix}0\\1\\1\end{pmatrix}$. *On cherchera $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ en écrivant les deux conditions d'orthogonalité.*
  corrige: |
    **1.** Deux vecteurs sont orthogonaux si et seulement si leur produit scalaire est nul.

    **(a)** $3-2-1=0$ : $\;\boxed{\text{orthogonaux}}$

    **(b)** $2+0-3=-1\neq 0$ : $\;\boxed{\text{non orthogonaux}}$

    **(c)** $-6+2+4=0$ : $\;\boxed{\text{orthogonaux}}$

    **2.** $\vec{u}\cdot\vec{v}=3m-2+2=3m$, qui s'annule pour $\boxed{m=0}$.

    **3.** $\vec{u}\cdot\vec{v}=2+3m-2m=m+2$, qui s'annule pour $\boxed{m=-2}$.

    **4.** On cherche $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ vérifiant les deux conditions : 
    $$\begin{cases} \vec{n}\cdot\vec{u}=a+b=0 \\ \vec{n}\cdot\vec{v}=b+c=0 \end{cases} \iff \begin{cases} b=-a \\ c=-b=a \end{cases}$$
     Il suffit de choisir une valeur non nulle de $a$, par exemple $a=1$ : 
    $$\boxed{\vec{n}\begin{pmatrix}1\\-1\\1\end{pmatrix} \text{ convient}}$$
     *Vérification :* $1-1+0=0$ et $0-1+1=0$. Tout vecteur colinéaire à $\vec{n}$ convient également : il y en a une infinité.
- id: "t-04-08"
  feuille: "f-t-04"
  numero: 8
  partie: "Produit scalaire, normes et distances"
  etoiles: 2
  types: [Calcul]
  mots_cles: [repère, colinéarité, produit scalaire, angle]
  noeuds: [v-libre, f-hilbert]
  notions: [famille-libre]
  page_enonce: 3
  page_corrige: 5
  enonce: |
    L'espace est muni d'un repère orthonormé.

    **1.** On donne $A(0\,;0\,;0)$, $B(2\,;1\,;2)$ et $C(1\,;2\,;-2)$. Calculer $AB$, $AC$ et $BC$, puis $\overrightarrow{AB}\cdot\overrightarrow{AC}$. En déduire la nature précise du triangle $ABC$.

    **2.** On donne $A(1\,;2\,;-1)$, $B(3\,;0\,;1)$ et $C(0\,;1\,;2)$. Déterminer la nature du triangle $ABC$.

    **3.** Pour le triangle de la question 2, calculer une valeur approchée au degré près de l'angle $\widehat{ACB}$.

    **4.** On donne $A(1\,;1\,;0)$, $B(2\,;-1\,;3)$, $C(4\,;0\,;1)$ et $D(3\,;2\,;-2)$. Démontrer que $ABCD$ est un parallélogramme, puis préciser s'il s'agit d'un losange.
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}2\\1\\2\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}1\\2\\-2\end{pmatrix}$, d'où 
    $$AB=\sqrt{4+1+4}=3 \qquad AC=\sqrt{1+4+4}=3 \qquad BC=\left\|\begin{pmatrix}-1\\1\\-4\end{pmatrix}\right\|=\sqrt{18}=3\sqrt{2}$$

    $$\overrightarrow{AB}\cdot\overrightarrow{AC}=2+2-4=0$$
     Le produit scalaire est nul et les deux côtés issus de $A$ sont de même longueur : 
    $$\boxed{ABC \text{ est un triangle rectangle isocèle en } A.}$$
     *Vérification par Pythagore :* $3^{2}+3^{2}=18=\left(3\sqrt{2}\right)^{2}$.

    **2.** $\overrightarrow{AB}\begin{pmatrix}2\\-2\\2\end{pmatrix}$, $\overrightarrow{AC}\begin{pmatrix}-1\\-1\\3\end{pmatrix}$ et $\overrightarrow{BC}\begin{pmatrix}-3\\1\\1\end{pmatrix}$, d'où 
    $$AB=\sqrt{12}=2\sqrt{3} \qquad AC=\sqrt{11} \qquad BC=\sqrt{11}$$
     Deux côtés ont la même longueur : 
    $$\boxed{ABC \text{ est isocèle en } C.}$$
     *Il n'est pas rectangle :* $AC^{2}+BC^{2}=22\neq 12$, et aucun autre couple ne convient.

    **3.** $\overrightarrow{CA}\begin{pmatrix}1\\1\\-3\end{pmatrix}$ et $\overrightarrow{CB}\begin{pmatrix}3\\-1\\-1\end{pmatrix}$, donc $\overrightarrow{CA}\cdot\overrightarrow{CB}=3-1+3=5$ et 
    $$\cos\left(\widehat{ACB}\right)=\frac{5}{\sqrt{11}\times\sqrt{11}}=\frac{5}{11} \qquad\text{d'où}\qquad \boxed{\widehat{ACB}\approx 63^{\circ}}$$

    **4.** $\overrightarrow{AB}\begin{pmatrix}1\\-2\\3\end{pmatrix}$ et $\overrightarrow{DC}\begin{pmatrix}1\\-2\\3\end{pmatrix}$. Ces deux vecteurs étant égaux : 
    $$\boxed{ABCD \text{ est un parallélogramme.}}$$
     Pour savoir s'il s'agit d'un losange, on compare deux côtés consécutifs : 
    $$AB=\sqrt{1+4+9}=\sqrt{14} \qquad\text{et}\qquad BC=\left\|\begin{pmatrix}2\\1\\-2\end{pmatrix}\right\|=3$$
     Ces longueurs diffèrent : $\boxed{ABCD \text{ n'est pas un losange.}}$
- id: "t-04-09"
  feuille: "f-t-04"
  numero: 9
  partie: "Produit scalaire, normes et distances"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [colinéarité, produit scalaire, orthogonalité, norme et distance, identité du parallélogramme]
  noeuds: [v-libre, f-hilbert]
  notions: [famille-libre, norme]
  page_enonce: 3
  page_corrige: 6
  enonce: |
    *Dans cet exercice, aucune coordonnée n'est donnée : on utilisera uniquement les identités liées à la norme.*

    **1.** Soient $\vec{u}$ et $\vec{v}$ tels que $\|\vec{u}\|=4$, $\|\vec{v}\|=3$ et $\vec{u}\cdot\vec{v}=-5$. Calculer $\|\vec{u}+\vec{v}\|$, $\|\vec{u}-\vec{v}\|$ et $(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})$.

    **2.** Vérifier sur cet exemple l'identité du parallélogramme.

    **3.** Soient $\vec{u}$ et $\vec{v}$ tels que $\|\vec{u}\|=2$, $\|\vec{v}\|=5$ et $\|\vec{u}+\vec{v}\|=6$. Calculer $\vec{u}\cdot\vec{v}$, puis $\|\vec{u}-\vec{v}\|$.

    **4.** Soient $\vec{u}$ et $\vec{v}$ deux vecteurs de même norme. Démontrer que $\vec{u}+\vec{v}$ et $\vec{u}-\vec{v}$ sont orthogonaux. Quelle propriété du parallélogramme retrouve-t-on ainsi ?
  corrige: |
    **1.** On applique directement les identités du cours : 
    $$\|\vec{u}+\vec{v}\|^{2}=16+2\times(-5)+9=15 \qquad\text{donc}\qquad \boxed{\|\vec{u}+\vec{v}\|=\sqrt{15}}$$

    $$\|\vec{u}-\vec{v}\|^{2}=16-2\times(-5)+9=35 \qquad\text{donc}\qquad \boxed{\|\vec{u}-\vec{v}\|=\sqrt{35}}$$

    $$(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})=\|\vec{u}\|^{2}-\|\vec{v}\|^{2}=16-9=\boxed{7}$$

    **2.** L'identité du parallélogramme affirme que $\|\vec{u}+\vec{v}\|^{2}+\|\vec{u}-\vec{v}\|^{2}=2\left(\|\vec{u}\|^{2}+\|\vec{v}\|^{2}\right)$ : 
    $$15+35=50 \qquad\text{et}\qquad 2(16+9)=50 \qquad \boxed{\text{l'identité est vérifiée.}}$$

    **3.** De $\|\vec{u}+\vec{v}\|^{2}=\|\vec{u}\|^{2}+2\,\vec{u}\cdot\vec{v}+\|\vec{v}\|^{2}$ on tire : 
    $$36=4+2\,\vec{u}\cdot\vec{v}+25 \iff 2\,\vec{u}\cdot\vec{v}=7 \iff \boxed{\vec{u}\cdot\vec{v}=\frac{7}{2}}$$
     Puis $\|\vec{u}-\vec{v}\|^{2}=4-7+25=22$, soit $\boxed{\|\vec{u}-\vec{v}\|=\sqrt{22}}$.

    **4.** Supposons $\|\vec{u}\|=\|\vec{v}\|$. Alors : 
    $$(\vec{u}+\vec{v})\cdot(\vec{u}-\vec{v})=\|\vec{u}\|^{2}-\|\vec{v}\|^{2}=0$$

    $$\boxed{\vec{u}+\vec{v} \text{ et } \vec{u}-\vec{v} \text{ sont orthogonaux.}}$$
     **Interprétation.** Dans le parallélogramme construit sur $\vec{u}$ et $\vec{v}$, les diagonales sont portées par $\vec{u}+\vec{v}$ et $\vec{u}-\vec{v}$. Dire que les quatre côtés ont la même longueur, c'est dire que le parallélogramme est un losange : on retrouve donc que *les diagonales d'un losange sont perpendiculaires*.
- id: "t-04-10"
  feuille: "f-t-04"
  numero: 10
  partie: "Produit scalaire, normes et distances"
  etoiles: 2
  types: [Calcul]
  mots_cles: [cube et pavé, repère, produit scalaire, norme et distance, angle]
  noeuds: [f-hilbert]
  notions: [norme]
  page_enonce: 4
  page_corrige: 7
  enonce: |
    On reprend le cube $ABCDEFGH$ d'arête $1$ et le repère orthonormé $\left(A\,;\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$.

    **1.** Calculer $\overrightarrow{AG}\cdot\overrightarrow{AC}$, puis $\overrightarrow{AG}\cdot\overrightarrow{AB}$.

    **2.** Calculer les longueurs $BD$, $DE$ et $BE$. Quelle est la nature du triangle $BDE$ ?

    **3.** Calculer $\overrightarrow{AG}\cdot\overrightarrow{BD}$ et $\overrightarrow{AG}\cdot\overrightarrow{BE}$. Que peut-on en déduire sur la droite $(AG)$ et le plan $(BDE)$ ?

    **4.** Calculer une valeur approchée au degré près de l'angle entre $\overrightarrow{AG}$ et $\overrightarrow{AB}$.

    **5.** Le triangle $AFH$ est-il équilatéral ? Justifier par le calcul.
  corrige: |
    *On travaille avec les coordonnées de l'exercice 1.*

    **1.** $\overrightarrow{AG}\begin{pmatrix}1\\1\\1\end{pmatrix}$, $\overrightarrow{AC}\begin{pmatrix}1\\1\\0\end{pmatrix}$ et $\overrightarrow{AB}\begin{pmatrix}1\\0\\0\end{pmatrix}$ : 
    $$\overrightarrow{AG}\cdot\overrightarrow{AC}=1+1+0=\boxed{2} \qquad\text{et}\qquad \overrightarrow{AG}\cdot\overrightarrow{AB}=1+0+0=\boxed{1}$$

    **2.** $\overrightarrow{BD}\begin{pmatrix}-1\\1\\0\end{pmatrix}$, $\overrightarrow{DE}\begin{pmatrix}0\\-1\\1\end{pmatrix}$ et $\overrightarrow{BE}\begin{pmatrix}-1\\0\\1\end{pmatrix}$, donc 
    $$BD=DE=BE=\sqrt{2}$$

    $$\boxed{BDE \text{ est un triangle équilatéral de côté } \sqrt{2}.}$$
     *Ce sont trois diagonales de faces du cube*, toutes de même longueur.

    **3.** $\overrightarrow{AG}\cdot\overrightarrow{BD}=-1+1+0=\boxed{0}$ et $\overrightarrow{AG}\cdot\overrightarrow{BE}=-1+0+1=\boxed{0}$.

    Le vecteur $\overrightarrow{AG}$ est donc orthogonal à deux vecteurs non colinéaires du plan $(BDE)$. Tout vecteur de ce plan étant combinaison linéaire de ces deux-là, $\overrightarrow{AG}$ leur est orthogonal à tous : 
    $$\boxed{(AG) \text{ est orthogonale au plan } (BDE),\ \text{et } \overrightarrow{AG} \text{ en est un vecteur normal.}}$$

    **4.** $\cos\left(\widehat{GAB}\right)=\dfrac{\overrightarrow{AG}\cdot\overrightarrow{AB}}{AG\times AB} =\dfrac{1}{\sqrt{3}\times 1}=\dfrac{1}{\sqrt{3}}\approx 0{,}577$, d'où 
    $$\boxed{\widehat{GAB}\approx 55^{\circ}}$$

    **5.** $\overrightarrow{AF}\begin{pmatrix}1\\0\\1\end{pmatrix}$, $\overrightarrow{AH}\begin{pmatrix}0\\1\\1\end{pmatrix}$ et $\overrightarrow{FH}\begin{pmatrix}-1\\1\\0\end{pmatrix}$ : 
    $$AF=AH=FH=\sqrt{2}$$

    $$\boxed{\text{Oui, } AFH \text{ est équilatéral}}$$
     pour la même raison qu'à la question 2 : ses trois côtés sont des diagonales de faces.
- id: "t-04-11"
  feuille: "f-t-04"
  numero: 11
  partie: "Représentation dans l'espace"
  etoiles: 1
  types: [Démonstration]
  mots_cles: [cube et pavé, coordonnées, coplanarité, positions relatives, intersection]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 8
  enonce: |
    On reprend le cube $ABCDEFGH$. Pour chacun des couples de droites suivants, dire si les deux droites sont **coplanaires** ou non. Lorsqu'elles le sont, préciser si elles sont parallèles ou sécantes, et donner dans ce dernier cas leur point d'intersection.

    ![Figure](documents/figures/e757d9a183860800.svg)

    **a)** $(AB)$ et $(GH)$

    **b)** $(AB)$ et $(CG)$

    **c)** $(AF)$ et $(DG)$

    **d)** $(AC)$ et $(EG)$

    **e)** $(AH)$ et $(BG)$

    **f)** $(AG)$ et $(BH)$

    **g)** $(BE)$ et $(CH)$

    **h)** $(AE)$ et $(CD)$

    *On pourra s'appuyer sur les coordonnées de l'exercice 1 pour justifier chaque réponse : la figure seule ne suffit pas à conclure.*
  corrige: |
    *On raisonne sur les coordonnées de l'exercice 1. Deux droites sont parallèles lorsque leurs vecteurs directeurs sont colinéaires ; sinon, elles sont sécantes si elles ont un point commun, et non coplanaires dans le cas contraire.*

    **a)** $\overrightarrow{AB}\begin{pmatrix}1\\0\\0\end{pmatrix}$ et $\overrightarrow{GH}\begin{pmatrix}-1\\0\\0\end{pmatrix}=-\overrightarrow{AB}$ : $\boxed{\text{parallèles}}$, donc coplanaires — elles engendrent le plan $(ABGH)$.

    **b)** $\overrightarrow{AB}\begin{pmatrix}1\\0\\0\end{pmatrix}$ et $\overrightarrow{CG}\begin{pmatrix}0\\0\\1\end{pmatrix}$ ne sont pas colinéaires. Tout point de $(AB)$ a pour ordonnée $0$, tout point de $(CG)$ a pour ordonnée $1$ : elles n'ont aucun point commun. $\boxed{\text{Non coplanaires.}}$

    *C'est l'exemple du cours : sur la figure, les deux droites semblent se croiser.*

    **c)** $\overrightarrow{AF}\begin{pmatrix}1\\0\\1\end{pmatrix}$ et $\overrightarrow{DG}\begin{pmatrix}1\\0\\1\end{pmatrix}$ : $\boxed{\text{parallèles}}$.

    **d)** $\overrightarrow{AC}\begin{pmatrix}1\\1\\0\end{pmatrix}$ et $\overrightarrow{EG}\begin{pmatrix}1\\1\\0\end{pmatrix}$ : $\boxed{\text{parallèles}}$.

    **e)** $\overrightarrow{AH}\begin{pmatrix}0\\1\\1\end{pmatrix}$ et $\overrightarrow{BG}\begin{pmatrix}0\\1\\1\end{pmatrix}$ : $\boxed{\text{parallèles}}$.

    **f)** $\overrightarrow{AG}\begin{pmatrix}1\\1\\1\end{pmatrix}$ et $\overrightarrow{BH}\begin{pmatrix}-1\\1\\1\end{pmatrix}$ ne sont pas colinéaires. Le point $\Omega\left(\frac{1}{2};\frac{1}{2};\frac{1}{2}\right)$ appartient aux deux (il correspond au paramètre $\frac{1}{2}$ dans chaque cas) : 
    $$\boxed{\text{sécantes au centre } \Omega \text{ du cube.}}$$

    **g)** $\overrightarrow{BE}\begin{pmatrix}-1\\0\\1\end{pmatrix}$ et $\overrightarrow{CH}\begin{pmatrix}-1\\0\\1\end{pmatrix}$ : $\boxed{\text{parallèles}}$.

    **h)** $\overrightarrow{AE}\begin{pmatrix}0\\0\\1\end{pmatrix}$ et $\overrightarrow{CD}\begin{pmatrix}-1\\0\\0\end{pmatrix}$ ne sont pas colinéaires. Tout point de $(AE)$ a pour abscisse $0$ et pour ordonnée $0$ ; tout point de $(CD)$ a pour ordonnée $1$ : aucun point commun. $\boxed{\text{Non coplanaires.}}$
- id: "t-04-12"
  feuille: "f-t-04"
  numero: 12
  partie: "Représentation dans l'espace"
  etoiles: 1
  types: [Calcul]
  mots_cles: [cube et pavé, colinéarité, coplanarité, perspective cavalière, positions relatives, intersection]
  noeuds: [v-libre]
  notions: [famille-libre]
  page_enonce: 4
  page_corrige: 9
  enonce: |
    *Cet exercice est entièrement graphique. On représentera un plan par un parallélogramme, et l'on fera systématiquement apparaître en pointillés les parties cachées.*

    **1.** Reproduire en perspective cavalière un cube $ABCDEFGH$. Y tracer en couleur la diagonale $(AG)$, puis le triangle $BDE$.

    **2.** Dessiner un plan $\mathcal{P}$, puis, sur la même figure et de trois couleurs différentes :

    **(a)** une droite $d_{1}$ sécante à $\mathcal{P}$ en un point $I$ ;

    **(b)** une droite $d_{2}$ strictement parallèle à $\mathcal{P}$ ;

    **(c)** une droite $d_{3}$ contenue dans $\mathcal{P}$.

    **3.** Dessiner deux plans sécants, ainsi que leur droite d'intersection.

    **4.** Dessiner deux plans strictement parallèles.

    **5.** Dessiner deux droites non coplanaires. Expliquer en une phrase pourquoi un dessin ne permet jamais, à lui seul, de garantir que deux droites sont non coplanaires.

    **6.** Sur le cube de la question 1, le plan $(BDE)$ coupe le solide selon un triangle. Le tracer en le hachurant.
  corrige: |
    **1.** Le cube, la diagonale $(AG)$ en violet et le triangle $BDE$ en ocre. On notera que $[BD]$ et $[DE]$ sont partiellement cachés.

    ![Figure](documents/figures/07c2e51986460753.svg)

    **2.** Un plan se représente par un parallélogramme. La droite $d_{1}$ le traverse : la partie située derrière le plan est en pointillés. La droite $d_{2}$ passe au-dessus sans le rencontrer. La droite $d_{3}$ est tracée entièrement à l'intérieur du parallélogramme.

    ![Figure](documents/figures/d05815c700e69d6f.svg)

    **3.** Deux plans sécants et leur droite d'intersection $\Delta$ :

    ![Figure](documents/figures/233eae4be0942cf1.svg)

    *Convention de dessin :* le plan $\mathcal{P}$ étant opaque, la moitié de $\mathcal{P}'$ qui passe en dessous est **cachée** : on la trace en pointillés. C'est ce contraste qui fait comprendre au lecteur que les deux plans se traversent, et non qu'ils se contentent de se toucher.

    **4.** Deux plans strictement parallèles : aucun point commun, donc aucune droite d'intersection.

    ![Figure](documents/figures/38c6c208232dbba7.svg)

    **5.** Deux droites non coplanaires. On matérialise le passage de l'une au-dessus de l'autre par une interruption du tracé.

    La façon la plus sûre de représenter deux droites non coplanaires est de s'appuyer sur un solide, dont les arêtes cachées lèvent toute ambiguïté. Sur le cube ci-dessous, $(AB)$ et $(CG)$ conviennent : c'est l'exemple du cours.

    ![Figure](documents/figures/dbdc86dfcf4e0b3e.svg)

    Sans solide de référence, on interrompt la droite qui passe **derrière**, exactement comme pour les arêtes cachées :

    ![Figure](documents/figures/10f33ea026ee42e0.svg)

    Ici $d_{2}$ passe *devant* $d_{1}$ : c'est donc $d_{1}$, située derrière, dont le tracé est interrompu. Les deux droites ne se coupent pas.

    **Pourquoi le dessin ne suffit pas.** Un dessin est une projection de l'espace sur une feuille : deux droites qui n'ont aucun point commun peuvent parfaitement avoir des projections qui se coupent. Seul un calcul — la recherche d'un point commun, ou le test de coplanarité des vecteurs — permet de trancher.

    **6.** La section du cube par le plan $(BDE)$ est le triangle équilatéral $BDE$ de l'exercice 10, que l'on a hachuré sur la figure de la question 1.
- id: "t-04-13"
  feuille: "f-t-04"
  numero: 13
  partie: "Représentation dans l'espace"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [cube et pavé, repère, coordonnées, coplanarité, norme et distance, angle, perspective cavalière, intersection]
  noeuds: [v-libre]
  notions: [famille-libre, norme]
  page_enonce: 5
  page_corrige: 10
  enonce: |
    $ABCDEFGH$ est un pavé droit tel que $AB=4$, $AD=3$ et $AE=2$ (en centimètres). Les sommets sont disposés comme sur le cube des exercices précédents.

    **1.** Représenter ce pavé droit en perspective cavalière.

    **2.** Justifier que $\left(A\,;\dfrac{1}{4}\overrightarrow{AB},\dfrac{1}{3}\overrightarrow{AD}, \dfrac{1}{2}\overrightarrow{AE}\right)$ est un repère orthonormé de l'espace, puis donner les coordonnées des huit sommets dans ce repère.

    **3.** Calculer la longueur de la diagonale $[AG]$.

    **4.** Les droites $(AG)$ et $(BH)$ sont-elles coplanaires ? Si oui, déterminer leur point d'intersection.

    **5.** Les droites $(AB)$ et $(CG)$ sont-elles coplanaires ? Justifier par le calcul, puis expliquer ce que la figure pouvait laisser croire.

    **6.** Calculer une valeur approchée au degré près de l'angle $\widehat{GAB}$.
  corrige: |
    **1.** La figure est celle d'un pavé droit, obtenue comme le cube mais avec des arêtes de longueurs différentes.

    ![Figure](documents/figures/23bdcdf44d61f89c.svg)

    **2.** Les trois vecteurs $\frac{1}{4}\overrightarrow{AB}$, $\frac{1}{3}\overrightarrow{AD}$ et $\frac{1}{2}\overrightarrow{AE}$ sont de norme $1$, et portent trois arêtes issues de $A$ d'un pavé *droit* : ils sont donc orthogonaux deux à deux. Le repère est orthonormé.

    • $A(0\,;0\,;0)$

    • $B(4\,;0\,;0)$

    • $C(4\,;3\,;0)$

    • $D(0\,;3\,;0)$

    • $E(0\,;0\,;2)$

    • $F(4\,;0\,;2)$

    • $G(4\,;3\,;2)$

    • $H(0\,;3\,;2)$

    **3.** $\overrightarrow{AG}\begin{pmatrix}4\\3\\2\end{pmatrix}$, donc $AG=\sqrt{16+9+4}=\boxed{\sqrt{29}\approx 5{,}39 \text{ cm}}$

    **4.** $\overrightarrow{AG}\begin{pmatrix}4\\3\\2\end{pmatrix}$ et $\overrightarrow{BH}\begin{pmatrix}-4\\3\\2\end{pmatrix}$ ne sont pas colinéaires. Cherchons un point commun : $(AG)$ est l'ensemble des points $(4t\,;3t\,;2t)$ et $(BH)$ celui des points $(4-4s\,;3s\,;2s)$. L'égalité des deuxièmes coordonnées donne $t=s$, et celle des premières $4t=4-4t$, soit $t=\frac{1}{2}$. Les troisièmes coordonnées coïncident alors. 
    $$\boxed{\text{Les droites sont sécantes au centre } \left(2\,;\frac{3}{2}\,;1\right) \text{ du pavé.}}$$

    **5.** $\overrightarrow{AB}\begin{pmatrix}4\\0\\0\end{pmatrix}$ et $\overrightarrow{CG}\begin{pmatrix}0\\0\\2\end{pmatrix}$ ne sont pas colinéaires. Tout point de $(AB)$ a pour ordonnée $0$, tout point de $(CG)$ a pour ordonnée $3$ : aucun point commun. 
    $$\boxed{\text{Les droites } (AB) \text{ et } (CG) \text{ sont non coplanaires.}}$$
     **Ce que la figure laissait croire.** Sur le dessin, les segments $[AB]$ et $[CG]$ semblent se croiser au voisinage de $B$ : c'est un pur effet de la projection. La droite $(CG)$ passe en réalité *derrière* $(AB)$.

    **6.** $\cos\left(\widehat{GAB}\right)=\dfrac{\overrightarrow{AG}\cdot\overrightarrow{AB}}{AG\times AB} =\dfrac{16}{\sqrt{29}\times 4}=\dfrac{4}{\sqrt{29}}\approx 0{,}743$, d'où 
    $$\boxed{\widehat{GAB}\approx 42^{\circ}}$$
- id: "t-04-14"
  feuille: "f-t-04"
  numero: 14
  partie: "Équations de plans et représentations paramétriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [équation cartésienne de plan, positions relatives, distance à un plan]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 5
  page_corrige: 11
  enonce: |
    Dans chaque cas, déterminer une équation cartésienne du plan décrit.

    **1.** Le plan passant par $A(1\,;2\,;-1)$ et de vecteur normal $\vec{n}\begin{pmatrix}2\\-1\\3\end{pmatrix}$.

    **2.** Le plan passant par l'origine et de vecteur normal $\vec{n}\begin{pmatrix}1\\1\\1\end{pmatrix}$.

    **3.** Le plan passant par $A(3\,;-2\,;1)$ et de vecteur normal $\vec{n}\begin{pmatrix}0\\1\\-1\end{pmatrix}$.

    **4.** Le plan passant par $A(1\,;1\,;1)$ et parallèle au plan d'équation $2x+3y-z+5=0$.

    **5.** Le plan passant par $A(0\,;2\,;-3)$ et perpendiculaire à la droite de vecteur directeur $\vec{u}\begin{pmatrix}4\\0\\-1\end{pmatrix}$.
  corrige: |
    *Un plan de vecteur normal $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ admet une équation de la forme $ax+by+cz+d=0$ : on lit donc les trois premiers coefficients sur $\vec{n}$, et l'on détermine $d$ en écrivant que le point donné appartient au plan.*

    **1.** L'équation est de la forme $2x-y+3z+d=0$. Avec $A(1\,;2\,;-1)$ : 
    $$2-2-3+d=0 \iff d=3 \qquad\text{soit}\qquad \boxed{2x-y+3z+3=0}$$

    **2.** L'équation est de la forme $x+y+z+d=0$, et le plan passe par l'origine, donc $d=0$ : 
    $$\boxed{x+y+z=0}$$

    **3.** L'équation est de la forme $y-z+d=0$ (le coefficient de $x$ est nul). Avec $A(3\,;-2\,;1)$ : $-2-1+d=0$, soit $d=3$ : 
    $$\boxed{y-z+3=0}$$

    **4.** Deux plans parallèles ont le même vecteur normal, donc les mêmes coefficients $a$, $b$ et $c$. L'équation est de la forme $2x+3y-z+d=0$, et avec $A(1\,;1\,;1)$ : 
    $$2+3-1+d=0 \iff d=-4 \qquad\text{soit}\qquad \boxed{2x+3y-z-4=0}$$

    **5.** Un plan perpendiculaire à une droite admet le vecteur directeur de celle-ci pour vecteur normal. L'équation est de la forme $4x-z+d=0$, et avec $A(0\,;2\,;-3)$ : 
    $$0+3+d=0 \iff d=-3 \qquad\text{soit}\qquad \boxed{4x-z-3=0}$$
- id: "t-04-15"
  feuille: "f-t-04"
  numero: 15
  partie: "Équations de plans et représentations paramétriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [repère, coordonnées, équation cartésienne de plan, positions relatives, intersection]
  noeuds: []
  notions: []
  page_enonce: 5
  page_corrige: 12
  enonce: |
    On considère le plan $\mathcal{P}$ d'équation cartésienne $\;3x-2y+z-6=0$.

    **1.** Donner un vecteur normal à $\mathcal{P}$.

    **2.** Les points $A(1\,;0\,;3)$, $B(2\,;1\,;1)$ et $C(0\,;-3\,;0)$ appartiennent-ils à $\mathcal{P}$ ?

    **3.** Déterminer les coordonnées des points d'intersection de $\mathcal{P}$ avec les trois axes du repère.

    **4.** Déterminer une équation cartésienne du plan parallèle à $\mathcal{P}$ passant par $B(2\,;1\,;1)$.

    **5.** Les plans d'équations $3x-2y+z-6=0$ et $-6x+4y-2z+1=0$ sont-ils parallèles ? Confondus ?
  corrige: |
    **1.** On lit les coefficients de $x$, $y$ et $z$ : $\;\boxed{\vec{n}\begin{pmatrix}3\\-2\\1\end{pmatrix}}$

    **2.** On remplace dans l'équation :

    • $A(1\,;0\,;3)$ : $3-0+3-6=0$, donc $\boxed{A\in\mathcal{P}}$ ;

    • $B(2\,;1\,;1)$ : $6-2+1-6=-1\neq 0$, donc $\boxed{B\notin\mathcal{P}}$ ;

    • $C(0\,;-3\,;0)$ : $0+6+0-6=0$, donc $\boxed{C\in\mathcal{P}}$.

    **3.** Sur l'axe des abscisses, $y=z=0$ : $3x-6=0$ donne $\boxed{(2\,;0\,;0)}$.

    Sur l'axe des ordonnées, $x=z=0$ : $-2y-6=0$ donne $\boxed{(0\,;-3\,;0)}$.

    Sur l'axe des cotes, $x=y=0$ : $z-6=0$ donne $\boxed{(0\,;0\,;6)}$.

    **4.** L'équation est de la forme $3x-2y+z+d=0$, et avec $B(2\,;1\,;1)$ : 
    $$6-2+1+d=0 \iff d=-5 \qquad\text{soit}\qquad \boxed{3x-2y+z-5=0}$$

    **5.** Le second plan a pour vecteur normal $\vec{n}'\begin{pmatrix}-6\\4\\-2\end{pmatrix}=-2\,\vec{n}$ : les deux vecteurs normaux sont colinéaires, donc $\boxed{\text{les plans sont parallèles.}}$

    En multipliant la première équation par $-2$, on obtient $-6x+4y-2z+12=0$, alors que la seconde est $-6x+4y-2z+1=0$. Les constantes diffèrent : 
    $$\boxed{\text{les plans sont strictement parallèles, donc non confondus.}}$$
- id: "t-04-16"
  feuille: "f-t-04"
  numero: 16
  partie: "Équations de plans et représentations paramétriques"
  etoiles: 1
  types: [Calcul]
  mots_cles: [représentation paramétrique]
  noeuds: []
  notions: []
  page_enonce: 6
  page_corrige: 12
  enonce: |
    **1.** Déterminer une représentation paramétrique de la droite passant par $A(2\,;1\,;-3)$ et de vecteur directeur $\vec{u}\begin{pmatrix}1\\-2\\4\end{pmatrix}$.

    **2.** Déterminer une représentation paramétrique de la droite passant par $A(0\,;0\,;1)$ et de vecteur directeur $\vec{u}\begin{pmatrix}2\\0\\-1\end{pmatrix}$.

    **3.** Déterminer une représentation paramétrique de la droite $(AB)$, avec $A(1\,;2\,;0)$ et $B(4\,;0\,;5)$.

    **4.** Déterminer une représentation paramétrique de la droite $(CD)$, avec $C(-1\,;3\,;2)$ et $D(1\,;3\,;-2)$. Que remarque-t-on ?

    **5.** Les points $M(5\,;-5\,;9)$ et $N(4\,;-3\,;1)$ appartiennent-ils à la droite de la question 1 ?
  corrige: |
    **1.** $\boxed{\begin{cases}x=2+t\\y=1-2t\\z=-3+4t\end{cases}} \quad t\in\mathbb{R}$

    **2.** $\boxed{\begin{cases}x=2t\\y=0\\z=1-t\end{cases}} \quad t\in\mathbb{R}$

    **3.** $\overrightarrow{AB}\begin{pmatrix}3\\-2\\5\end{pmatrix}$, d'où $\boxed{\begin{cases}x=1+3t\\y=2-2t\\z=5t\end{cases}} \quad t\in\mathbb{R}$

    **4.** $\overrightarrow{CD}\begin{pmatrix}2\\0\\-4\end{pmatrix}$, d'où $\boxed{\begin{cases}x=-1+2t\\y=3\\z=2-4t\end{cases}} \quad t\in\mathbb{R}$

    *On remarque que* l'ordonnée est constante : tous les points de cette droite ont pour ordonnée $3$, la droite est donc contenue dans le plan d'équation $y=3$, parallèle au plan $(xOz)$.

    **5.** Pour $M(5\,;-5\,;9)$ : la première équation donne $2+t=5$, soit $t=3$. On teste alors les deux autres : $1-2\times 3=-5$ et $-3+4\times 3=9$. Les trois coordonnées conviennent : 
    $$\boxed{M \text{ appartient à la droite.}}$$
     Pour $N(4\,;-3\,;1)$ : la première équation donne $t=2$, et $1-4=-3$ convient, mais $-3+8=5\neq 1$ : 
    $$\boxed{N \text{ n'appartient pas à la droite.}}$$
     *Il faut impérativement tester les trois coordonnées avec la même valeur du paramètre.*
- id: "t-04-17"
  feuille: "f-t-04"
  numero: 17
  partie: "Équations de plans et représentations paramétriques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [coordonnées, orthogonalité, équation cartésienne de plan, distance à un plan]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 6
  page_corrige: 13
  enonce: |
    *Pour déterminer une équation cartésienne d'un plan défini par trois points, on cherche un vecteur normal $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ orthogonal à deux vecteurs du plan : cela donne un système de deux équations, dont on choisit une solution non nulle.*

    **1.** On donne $A(1\,;0\,;0)$, $B(0\,;2\,;0)$ et $C(0\,;0\,;3)$.

    **(a)** Justifier que ces trois points définissent bien un plan.

    **(b)** Déterminer les coordonnées de $\overrightarrow{AB}$ et $\overrightarrow{AC}$.

    **(c)** Déterminer un vecteur normal $\vec{n}$ au plan $(ABC)$.

    **(d)** En déduire une équation cartésienne du plan $(ABC)$, et vérifier qu'elle est satisfaite par les trois points.

    **2.** Déterminer de la même manière une équation cartésienne du plan $(ABC)$ avec $A(1\,;1\,;0)$, $B(2\,;0\,;1)$ et $C(0\,;1\,;2)$.

    **3.** Le point $D(3\,;-1\,;1)$ appartient-il à ce dernier plan ?
  corrige: |
    **1.** **(a)** $\overrightarrow{AB}\begin{pmatrix}-1\\2\\0\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}-1\\0\\3\end{pmatrix}$ ne sont pas colinéaires (la deuxième coordonnée est nulle pour l'un et pas pour l'autre), donc $A$, $B$ et $C$ ne sont pas alignés : ils définissent bien un plan.

    **(b)** Voir ci-dessus.

    **(c)** On cherche $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ orthogonal à ces deux vecteurs : 
    $$\begin{cases} -a+2b=0 \\ -a+3c=0 \end{cases} \iff \begin{cases} a=2b \\ a=3c \end{cases}$$
     En choisissant $c=2$, on obtient $a=6$ puis $b=3$ : 
    $$\boxed{\vec{n}\begin{pmatrix}6\\3\\2\end{pmatrix}}$$

    **(d)** L'équation est de la forme $6x+3y+2z+d=0$, et avec $A(1\,;0\,;0)$ : $6+d=0$, soit $d=-6$ : 
    $$\boxed{(ABC) : 6x+3y+2z-6=0}$$
     *Vérifications :* pour $B(0\,;2\,;0)$, $6-6=0$ ; pour $C(0\,;0\,;3)$, $6-6=0$.

    **2.** $\overrightarrow{AB}\begin{pmatrix}1\\-1\\1\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}-1\\0\\2\end{pmatrix}$. On cherche $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ : 
    $$\begin{cases} a-b+c=0 \\ -a+2c=0 \end{cases} \iff \begin{cases} a=2c \\ b=a+c=3c \end{cases}$$
     En choisissant $c=1$ : $\vec{n}\begin{pmatrix}2\\3\\1\end{pmatrix}$. L'équation est de la forme $2x+3y+z+d=0$, et avec $A(1\,;1\,;0)$ : $2+3+d=0$, soit $d=-5$ : 
    $$\boxed{2x+3y+z-5=0}$$
     *Vérifications :* $B$ donne $4+0+1-5=0$ et $C$ donne $0+3+2-5=0$.

    **3.** $D(3\,;-1\,;1)$ : $6-3+1-5=-1\neq 0$, donc $\boxed{D \text{ n'appartient pas au plan.}}$
- id: "t-04-18"
  feuille: "f-t-04"
  numero: 18
  partie: "Équations de plans et représentations paramétriques"
  etoiles: 2
  types: [Calcul]
  mots_cles: [orthogonalité, équation cartésienne de plan, représentation paramétrique, positions relatives]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 6
  page_corrige: 14
  enonce: |
    On considère les points $A(1\,;-1\,;2)$, $B(3\,;0\,;1)$ et $C(-1\,;-2\,;3)$.

    **1.** Déterminer une représentation paramétrique de la droite $(AB)$.

    **2.** Le point $C$ appartient-il à la droite $(AB)$ ? Que peut-on en déduire pour les trois points ?

    **3.** Déterminer une représentation paramétrique de la droite $\Delta$ passant par $D(2\,;1\,;0)$ et parallèle à $(AB)$.

    **4.** Les droites $(AB)$ et $\Delta$ sont-elles confondues ?

    **5.** Déterminer une équation cartésienne du plan passant par $D$ et orthogonal à la droite $(AB)$.
  corrige: |
    **1.** $\overrightarrow{AB}\begin{pmatrix}2\\1\\-1\end{pmatrix}$, d'où $\boxed{(AB) : \begin{cases}x=1+2t\\y=-1+t\\z=2-t\end{cases}}$

    **2.** Pour $C(-1\,;-2\,;3)$ : la première équation donne $1+2t=-1$, soit $t=-1$. On vérifie : $-1-1=-2$ et $2+1=3$. Les trois coordonnées conviennent. 
    $$\boxed{C \text{ appartient à } (AB),\ \text{donc } A,\ B \text{ et } C \text{ sont alignés.}}$$

    **3.** Une parallèle a le même vecteur directeur : $\boxed{\Delta : \begin{cases}x=2+2t\\y=1+t\\z=-t\end{cases}}$

    **4.** On teste si $D(2\,;1\,;0)$ appartient à $(AB)$ : la première équation donne $1+2t=2$, soit $t=\frac{1}{2}$, mais alors $y=-1+\frac{1}{2}=-\frac{1}{2}\neq 1$. 
    $$\boxed{\text{Les droites sont strictement parallèles, donc non confondues.}}$$

    **5.** Le plan cherché admet $\overrightarrow{AB}$ pour vecteur normal. Son équation est de la forme $2x+y-z+d=0$, et avec $D(2\,;1\,;0)$ : $4+1-0+d=0$, soit $d=-5$ : 
    $$\boxed{2x+y-z-5=0}$$
- id: "t-04-19"
  feuille: "f-t-04"
  numero: 19
  partie: "Positions relatives"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées, représentation paramétrique, positions relatives, intersection]
  noeuds: []
  notions: []
  page_enonce: 7
  page_corrige: 14
  enonce: |
    Dans chaque cas, déterminer la position relative de la droite $\mathcal{D}$ et du plan $\mathcal{P}$. Lorsqu'ils sont sécants, déterminer les coordonnées de leur point d'intersection.

    **1.** $\mathcal{P} : x+2y-z+1=0$ et $\mathcal{D} : \begin{cases} x=2+t \\ y=-1+t \\ z=3t \end{cases}$

    **2.** $\mathcal{P} : x-y+2z-3=0$ et $\mathcal{D} : \begin{cases} x=1+2t \\ y=t \\ z=-1+t \end{cases}$

    **3.** $\mathcal{P} : 3x+y-z+2=0$ et $\mathcal{D} : \begin{cases} x=t \\ y=1-2t \\ z=3+t \end{cases}$
  corrige: |
    *On calcule d'abord $\vec{u}\cdot\vec{n}$. S'il est non nul, la droite perce le plan ; s'il est nul, il reste à tester si un point de la droite appartient au plan.*

    **1.** $\vec{n}\begin{pmatrix}1\\2\\-1\end{pmatrix}$ et $\vec{u}\begin{pmatrix}1\\1\\3\end{pmatrix}$ donnent $\vec{u}\cdot\vec{n}=1+2-3=0$ : la droite est parallèle au plan ou contenue dedans. Le point $A(2\,;-1\,;0)$ de $\mathcal{D}$ vérifie $2-2-0+1=1\neq 0$ : 
    $$\boxed{\mathcal{D} \text{ est strictement parallèle à } \mathcal{P}.}$$

    **2.** $\vec{n}\begin{pmatrix}1\\-1\\2\end{pmatrix}$ et $\vec{u}\begin{pmatrix}2\\1\\1\end{pmatrix}$ donnent $\vec{u}\cdot\vec{n}=2-1+2=3\neq 0$ : la droite et le plan sont sécants. On reporte dans l'équation du plan : 
    $$(1+2t)-t+2(-1+t)-3=0 \iff 3t-4=0 \iff t=\frac{4}{3}$$

    $$\boxed{\text{Point d'intersection : } \left(\frac{11}{3}\,;\frac{4}{3}\,;\frac{1}{3}\right)}$$

    **3.** $\vec{n}\begin{pmatrix}3\\1\\-1\end{pmatrix}$ et $\vec{u}\begin{pmatrix}1\\-2\\1\end{pmatrix}$ donnent $\vec{u}\cdot\vec{n}=3-2-1=0$. Le point $A(0\,;1\,;3)$ de $\mathcal{D}$ vérifie $0+1-3+2=0$ : 
    $$\boxed{\mathcal{D} \text{ est contenue dans } \mathcal{P}.}$$
- id: "t-04-20"
  feuille: "f-t-04"
  numero: 20
  partie: "Positions relatives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [positions relatives]
  noeuds: []
  notions: []
  page_enonce: 7
  page_corrige: 15
  enonce: |
    Dans chaque cas, déterminer la position relative des plans $\mathcal{P}$ et $\mathcal{P}'$.

    **1.** $\mathcal{P} : 2x-y+3z-1=0$ et $\mathcal{P}' : -4x+2y-6z+5=0$

    **2.** $\mathcal{P} : x+y-z+2=0$ et $\mathcal{P}' : 2x-y+z-3=0$

    **3.** $\mathcal{P} : x-2y+z-4=0$ et $\mathcal{P}' : -3x+6y-3z+12=0$

    **4.** $\mathcal{P} : x+z-1=0$ et $\mathcal{P}' : y-2=0$
  corrige: |
    **1.** $\vec{n}\begin{pmatrix}2\\-1\\3\end{pmatrix}$ et $\vec{n}'\begin{pmatrix}-4\\2\\-6\end{pmatrix}=-2\,\vec{n}$ : les plans sont parallèles. En multipliant la première équation par $-2$ : $-4x+2y-6z+2=0$, à comparer à $+5$. 
    $$\boxed{\text{Strictement parallèles.}}$$

    **2.** $\vec{n}\begin{pmatrix}1\\1\\-1\end{pmatrix}$ et $\vec{n}'\begin{pmatrix}2\\-1\\1\end{pmatrix}$ ne sont pas colinéaires : 
    $$\boxed{\text{Sécants, selon une droite.}}$$

    **3.** $\vec{n}'\begin{pmatrix}-3\\6\\-3\end{pmatrix}=-3\,\vec{n}$, et la seconde équation est exactement $-3$ fois la première : 
    $$\boxed{\text{Confondus.}}$$

    **4.** $\vec{n}\begin{pmatrix}1\\0\\1\end{pmatrix}$ et $\vec{n}'\begin{pmatrix}0\\1\\0\end{pmatrix}$ ne sont pas colinéaires : 
    $$\boxed{\text{Sécants.}}$$
     *On remarque que* $\vec{n}\cdot\vec{n}'=0$ : ces deux plans sont même perpendiculaires.
- id: "t-04-21"
  feuille: "f-t-04"
  numero: 21
  partie: "Positions relatives"
  etoiles: 2
  types: [Calcul]
  mots_cles: [représentation paramétrique, positions relatives]
  noeuds: []
  notions: []
  page_enonce: 7
  page_corrige: 15
  enonce: |
    On considère les quatre droites suivantes : 
    $$\mathcal{D}_{1} : \begin{cases} x=1+t \\ y=t \\ z=2-t \end{cases} \qquad \mathcal{D}_{2} : \begin{cases} x=2+s \\ y=1+2s \\ z=1+s \end{cases} \qquad \mathcal{D}_{3} : \begin{cases} x=s \\ y=1+s \\ z=s \end{cases} \qquad \mathcal{D}_{4} : \begin{cases} x=3-2s \\ y=-2s \\ z=4+2s \end{cases}$$

    **1.** Donner un vecteur directeur et un point de chacune de ces quatre droites.

    **2.** Déterminer la position relative de $\mathcal{D}_{1}$ et $\mathcal{D}_{2}$.

    **3.** Déterminer la position relative de $\mathcal{D}_{1}$ et $\mathcal{D}_{3}$.

    **4.** Déterminer la position relative de $\mathcal{D}_{1}$ et $\mathcal{D}_{4}$.

    **5.** Résumer dans un tableau les trois positions relatives rencontrées.
  corrige: |
    **1.** On lit directement dans les représentations paramétriques :

    $$\begin{array}{|c|c|c|c|c|} \hline  & \mathcal{D}_{1} & \mathcal{D}_{2} & \mathcal{D}_{3} & \mathcal{D}_{4} \\ \hline \text{Point} & A(1\,;0\,;2) & B(2\,;1\,;1) & C(0\,;1\,;0) & E(3\,;0\,;4) \\ \hline \text{Vecteur directeur} & \begin{pmatrix}1\\1\\-1\end{pmatrix} & \begin{pmatrix}1\\2\\1\end{pmatrix} & \begin{pmatrix}1\\1\\1\end{pmatrix} & \begin{pmatrix}-2\\-2\\2\end{pmatrix} \\ \hline \end{array}$$

    **2.** Les vecteurs directeurs ne sont pas colinéaires. Cherchons un point commun : 
    $$\begin{cases} 1+t=2+s \\ t=1+2s \\ 2-t=1+s \end{cases}$$
     En reportant $t=1+2s$ dans la première : $2+2s=2+s$, soit $s=0$, donc $t=1$. On teste dans la troisième : $2-1=1$ et $1+0=1$, égalité vérifiée. 
    $$\boxed{\mathcal{D}_{1} \text{ et } \mathcal{D}_{2} \text{ sont sécantes en } (2\,;1\,;1).}$$

    **3.** Les vecteurs directeurs ne sont pas colinéaires. Cherchons un point commun : 
    $$\begin{cases} 1+t=s \\ t=1+s \\ 2-t=s \end{cases}$$
     La première donne $s=1+t$, que l'on reporte dans la deuxième : $t=1+1+t$, soit $0=2$, ce qui est impossible. Il n'existe aucun point commun. 
    $$\boxed{\mathcal{D}_{1} \text{ et } \mathcal{D}_{3} \text{ sont non coplanaires.}}$$

    **4.** Le vecteur directeur de $\mathcal{D}_{4}$ vaut $-2$ fois celui de $\mathcal{D}_{1}$ : les droites sont parallèles. Le point $E(3\,;0\,;4)$ appartient-il à $\mathcal{D}_{1}$ ? La première équation donne $1+t=3$, soit $t=2$, mais alors $y=2\neq 0$. 
    $$\boxed{\mathcal{D}_{1} \text{ et } \mathcal{D}_{4} \text{ sont strictement parallèles.}}$$

    **5.**

    $$\begin{array}{|c|c|c|c|} \hline \text{Couple} & \text{Directeurs colinéaires ?} & \text{Point commun ?} & \text{Position relative} \\ \hline \mathcal{D}_{1},\mathcal{D}_{2} & \text{non} & \text{oui} & \text{sécantes (coplanaires)} \\ \hline \mathcal{D}_{1},\mathcal{D}_{3} & \text{non} & \text{non} & \text{non coplanaires} \\ \hline \mathcal{D}_{1},\mathcal{D}_{4} & \text{oui} & \text{non} & \text{strictement parallèles} \\ \hline \end{array}$$
- id: "t-04-22"
  feuille: "f-t-04"
  numero: 22
  partie: "Positions relatives"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [coordonnées, orthogonalité, représentation paramétrique, positions relatives, intersection]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 7
  page_corrige: 16
  enonce: |
    On considère les plans $\mathcal{P} : x+y+z-3=0$ et $\mathcal{P}' : x-y+2z-1=0$.

    **1.** Justifier que $\mathcal{P}$ et $\mathcal{P}'$ sont sécants.

    **2.** Un point $M(x\,;y\,;z)$ appartient à leur intersection si et seulement si ses coordonnées vérifient les deux équations. On pose $z=t$. Exprimer alors $x$ et $y$ en fonction de $t$.

    **3.** En déduire une représentation paramétrique de la droite $\Delta=\mathcal{P}\cap \mathcal{P}'$, ainsi qu'un vecteur directeur $\vec{u}$ de $\Delta$.

    **4.** Vérifier que $\vec{u}$ est orthogonal aux deux vecteurs normaux. Pourquoi était-ce prévisible ?

    **5.** Le point $K(-1\,;2\,;2)$ appartient-il à $\Delta$ ?
  corrige: |
    **1.** $\vec{n}\begin{pmatrix}1\\1\\1\end{pmatrix}$ et $\vec{n}'\begin{pmatrix}1\\-1\\2\end{pmatrix}$ ne sont pas colinéaires : 
    $$\boxed{\text{les deux plans sont sécants, et leur intersection est une droite.}}$$

    **2.** Avec $z=t$, le système devient : 
    $$\begin{cases} x+y=3-t \\ x-y=1-2t \end{cases}$$
     En additionnant : $2x=4-3t$, donc $x=2-\dfrac{3}{2}t$. En soustrayant : $2y=2+t$, donc $y=1+\dfrac{1}{2}t$.

    **3.** $\boxed{\Delta : \begin{cases}x=2-\frac{3}{2}t\\[1mm] y=1+\frac{1}{2}t\\[1mm] z=t \end{cases}}$

    En posant $t=2t'$ pour éliminer les fractions, on obtient la représentation plus commode 
    $$\left(2-3t'\,;\ 1+t'\,;\ 2t'\right)$$
     d'où le vecteur directeur $\;\boxed{\vec{u}\begin{pmatrix}-3\\1\\2\end{pmatrix}}$

    **4.** $\vec{u}\cdot\vec{n}=-3+1+2=0$ et $\vec{u}\cdot\vec{n}'=-3-1+4=0$.

    C'était prévisible : $\Delta$ est contenue dans chacun des deux plans, donc $\vec{u}$ est un vecteur de chacun d'eux, et il est par définition orthogonal à leurs vecteurs normaux.

    **5.** $K(-1\,;2\,;2)$ : avec la seconde représentation, $2t'=2$ donne $t'=1$, et l'on vérifie $2-3=-1$ et $1+1=2$. 
    $$\boxed{K \text{ appartient à } \Delta.}$$
     *Vérification directe :* $-1+2+2-3=0$ et $-1-2+4-1=0$.
- id: "t-04-23"
  feuille: "f-t-04"
  numero: 23
  partie: "Projeté orthogonal et distance à un plan"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées, orthogonalité, projeté orthogonal]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 8
  page_corrige: 17
  enonce: |
    Dans chaque cas, déterminer les coordonnées du projeté orthogonal $H$ du point $M$ sur le plan $\mathcal{P}$, puis la distance $MH$. *On appliquera la méthode en quatre étapes du cours, et l'on calculera la distance à l'aide de la relation $\overrightarrow{MH}=t\,\vec{n}$.*

    **1.** $M(1\,;2\,;3)$ et $\mathcal{P} : x-2y+2z-5=0$

    **2.** $M(0\,;0\,;0)$ et $\mathcal{P} : 2x+y-2z+6=0$

    **3.** $M(2\,;-1\,;4)$ et $\mathcal{P} : x+y+z-1=0$
  corrige: |
    **1.** $\vec{n}\begin{pmatrix}1\\-2\\2\end{pmatrix}$. La droite passant par $M$ et dirigée par $\vec{n}$ est $(1+t\,;2-2t\,;3+2t)$. En reportant dans l'équation du plan : 
    $$(1+t)-2(2-2t)+2(3+2t)-5=9t-2=0 \iff t=\frac{2}{9}$$

    $$\boxed{H\left(\frac{11}{9}\,;\frac{14}{9}\,;\frac{31}{9}\right)} \qquad\text{et}\qquad MH=|t|\times\|\vec{n}\|=\frac{2}{9}\times 3=\boxed{\frac{2}{3}}$$

    **2.** $\vec{n}\begin{pmatrix}2\\1\\-2\end{pmatrix}$, droite $(2t\,;t\,;-2t)$ : 
    $$4t+t+4t+6=9t+6=0 \iff t=-\frac{2}{3}$$

    $$\boxed{H\left(-\frac{4}{3}\,;-\frac{2}{3}\,;\frac{4}{3}\right)} \qquad\text{et}\qquad MH=\frac{2}{3}\times 3=\boxed{2}$$

    **3.** $\vec{n}\begin{pmatrix}1\\1\\1\end{pmatrix}$, droite $(2+t\,;-1+t\,;4+t)$ : 
    $$(2+t)+(-1+t)+(4+t)-1=3t+4=0 \iff t=-\frac{4}{3}$$

    $$\boxed{H\left(\frac{2}{3}\,;-\frac{7}{3}\,;\frac{8}{3}\right)} \qquad\text{et}\qquad MH=\frac{4}{3}\times\sqrt{3}=\boxed{\frac{4\sqrt{3}}{3}}$$
- id: "t-04-24"
  feuille: "f-t-04"
  numero: 24
  partie: "Projeté orthogonal et distance à un plan"
  etoiles: 1
  types: [Calcul]
  mots_cles: [coordonnées, distance à un plan]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 8
  page_corrige: 17
  enonce: |
    **1.** À l'aide de la formule directe du cours, calculer la distance du point $M$ au plan $\mathcal{P}$ dans chacun des cas suivants :

    **(a)** $M(1\,;1\,;1)$ et $\mathcal{P} : 2x-y+2z-3=0$. Que peut-on en conclure ?

    **(b)** $M(0\,;0\,;0)$ et $\mathcal{P} : 3x-4z+10=0$

    **(c)** $M(2\,;3\,;-1)$ et $\mathcal{P} : x+2y-2z+1=0$

    **2.** Vérifier les résultats de l'exercice 23 à l'aide de cette formule.

    **3.** Déterminer les coordonnées des points de l'axe $(Oz)$ situés à une distance $2$ du plan d'équation $x+2y+2z-1=0$.

    **4.** Expliquer pourquoi la formule directe ne permet pas de répondre à la question de l'exercice 23, où l'on demandait les coordonnées de $H$.
  corrige: |
    **1.** **(a)** $d=\dfrac{|2-1+2-3|}{\sqrt{4+1+4}}=\dfrac{0}{3}=\boxed{0}$.

    Une distance nulle signifie que $\boxed{M \text{ appartient au plan.}}$

    **(b)** $d=\dfrac{|0-0+10|}{\sqrt{9+0+16}}=\dfrac{10}{5}=\boxed{2}$

    **(c)** $d=\dfrac{|2+6+2+1|}{\sqrt{1+4+4}}=\dfrac{11}{3}=\boxed{\dfrac{11}{3}}$

    **2.** Reprenons les trois cas de l'exercice 23 : 
    $$\frac{|1-4+6-5|}{3}=\frac{2}{3} \qquad \frac{|0+0-0+6|}{3}=2 \qquad \frac{|2-1+4-1|}{\sqrt{3}}=\frac{4}{\sqrt{3}}=\frac{4\sqrt{3}}{3}$$

    $$\boxed{\text{Les trois distances sont confirmées.}}$$

    **3.** Un point de l'axe $(Oz)$ s'écrit $M(0\,;0\,;z)$. La condition s'écrit : 
    $$\frac{|0+0+2z-1|}{\sqrt{1+4+4}}=2 \iff |2z-1|=6 \iff 2z-1=6 \text{ ou } 2z-1=-6$$

    $$\boxed{\left(0\,;0\,;\frac{7}{2}\right) \quad\text{et}\quad \left(0\,;0\,;-\frac{5}{2}\right)}$$
     *Il y a bien deux solutions :* les deux points sont de part et d'autre du plan.

    **4.** La formule donne uniquement la *longueur* $MH$, sans jamais faire intervenir les coordonnées de $H$. Pour obtenir le point lui-même, il faut construire la droite passant par $M$ et dirigée par $\vec{n}$, puis chercher son intersection avec le plan : c'est la méthode en quatre étapes, seule capable de fournir $H$.
- id: "t-04-25"
  feuille: "f-t-04"
  numero: 25
  partie: "Projeté orthogonal et distance à un plan"
  etoiles: 2
  types: [Démonstration, Calcul]
  mots_cles: [cube et pavé, repère, coordonnées, orthogonalité, équation cartésienne de plan, projeté orthogonal, distance à un plan, centre de gravité]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 8
  page_corrige: 18
  enonce: |
    On reprend le cube $ABCDEFGH$ d'arête $1$ et le repère orthonormé $\left(A\,;\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$.

    **1.** En utilisant le résultat de l'exercice 10, justifier que $\vec{n}\begin{pmatrix}1\\1\\1\end{pmatrix}$ est un vecteur normal au plan $(BDE)$, puis déterminer une équation cartésienne de ce plan.

    **2.** Calculer la distance du point $A$ au plan $(BDE)$.

    **3.** Calculer la distance du point $G$ au plan $(BDE)$.

    **4.** Vérifier que la somme des deux distances précédentes est égale à $AG$. Interpréter ce résultat.

    **5.** Déterminer les coordonnées du projeté orthogonal $K$ de $A$ sur le plan $(BDE)$.

    **6.** Montrer que $K$ est également le projeté orthogonal de $G$ sur ce plan. Que peut-on en déduire pour les points $A$, $K$ et $G$ ?

    **7.** Vérifier que $K$ est le centre de gravité du triangle $BDE$.
  corrige: |
    **1.** L'exercice 10 a établi que $\overrightarrow{AG}\begin{pmatrix}1\\1\\1\end{pmatrix}$ est orthogonal à $\overrightarrow{BD}$ et à $\overrightarrow{BE}$, deux vecteurs non colinéaires du plan $(BDE)$ : c'est donc un vecteur normal à ce plan. L'équation est de la forme $x+y+z+d=0$, et avec $B(1\,;0\,;0)$ : $1+d=0$. 
    $$\boxed{(BDE) : x+y+z-1=0}$$
     *Vérifications :* $D(0\,;1\,;0)$ et $E(0\,;0\,;1)$ donnent également $1-1=0$.

    **2.** $d\big(A,(BDE)\big)=\dfrac{|0+0+0-1|}{\sqrt{3}}=\boxed{\dfrac{\sqrt{3}}{3}}$

    **3.** $d\big(G,(BDE)\big)=\dfrac{|1+1+1-1|}{\sqrt{3}}=\dfrac{2}{\sqrt{3}} =\boxed{\dfrac{2\sqrt{3}}{3}}$

    **4.** $\dfrac{\sqrt{3}}{3}+\dfrac{2\sqrt{3}}{3}=\sqrt{3}$, et $AG=\|\overrightarrow{AG}\|=\sqrt{3}$. 
    $$\boxed{\text{La somme des deux distances est égale à } AG.}$$
     **Interprétation.** La droite $(AG)$ est orthogonale au plan $(BDE)$ : les projetés orthogonaux de $A$ et de $G$ sont donc situés *sur* cette droite. Les deux distances sont alors deux portions du segment $[AG]$, coupé par le plan.

    **5.** La droite passant par $A$ et dirigée par $\vec{n}$ est $(t\,;t\,;t)$. En reportant : 
    $$3t-1=0 \iff t=\frac{1}{3} \qquad\text{soit}\qquad \boxed{K\left(\frac{1}{3}\,;\frac{1}{3}\,;\frac{1}{3}\right)}$$

    **6.** La droite passant par $G$ et dirigée par $\vec{n}$ est $(1+t\,;1+t\,;1+t)$, d'où $3(1+t)-1=0$, soit $t=-\frac{2}{3}$, et l'on retrouve le point $\left(\frac{1}{3};\frac{1}{3};\frac{1}{3}\right)$. 
    $$\boxed{A,\ K \text{ et } G \text{ sont alignés : } K \text{ est le point où } (AG) \text{ perce le plan } (BDE).}$$

    **7.** Le centre de gravité de $BDE$ a pour coordonnées les moyennes de celles des trois sommets : 
    $$\left(\frac{1+0+0}{3}\,;\frac{0+1+0}{3}\,;\frac{0+0+1}{3}\right) =\left(\frac{1}{3}\,;\frac{1}{3}\,;\frac{1}{3}\right)=\boxed{K}$$
- id: "t-04-26"
  feuille: "f-t-04"
  numero: 26
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [cube et pavé, repère, coordonnées, milieu, produit scalaire, orthogonalité, norme et distance, angle]
  noeuds: [f-hilbert]
  notions: [norme]
  page_enonce: 9
  page_corrige: 19
  enonce: |
    $ABCDEFGH$ est un cube d'arête $1$. On se place dans le repère orthonormé $\left(A\,;\overrightarrow{AB},\overrightarrow{AD},\overrightarrow{AE}\right)$. On note $I$ le milieu de $[EF]$ et $J$ le milieu de $[FG]$.

    **Partie A : longueurs et angles**

    **1.** Donner les coordonnées des points $I$ et $J$.

    **2.** Calculer les longueurs $AI$, $AJ$ et $IJ$.

    **3.** Calculer $\overrightarrow{AI}\cdot\overrightarrow{AJ}$, puis une valeur approchée au degré près de l'angle $\widehat{IAJ}$.

    **Partie B : le plan $(AIJ)$**

    **4.** Justifier que les points $A$, $I$ et $J$ définissent bien un plan.

    **5.** Démontrer que le vecteur $\vec{n}\begin{pmatrix}2\\-2\\-1\end{pmatrix}$ est normal au plan $(AIJ)$.

    **6.** En déduire une équation cartésienne du plan $(AIJ)$, et vérifier qu'elle est satisfaite par les trois points.

    **Partie C : distance et intersection**

    **7.** Calculer la distance du point $G$ au plan $(AIJ)$.

    **8.** Déterminer les coordonnées du projeté orthogonal de $G$ sur ce plan.

    **9.** Déterminer la position relative de la droite $(DG)$ et du plan $(AIJ)$. Si elles sont sécantes, déterminer les coordonnées du point d'intersection.
  corrige: |
    **Partie A**

    **1.** $I$ est le milieu de $[EF]$ avec $E(0\,;0\,;1)$ et $F(1\,;0\,;1)$, et $J$ celui de $[FG]$ avec $G(1\,;1\,;1)$ : 
    $$\boxed{I\left(\frac{1}{2}\,;0\,;1\right) \qquad J\left(1\,;\frac{1}{2}\,;1\right)}$$

    **2.** $\overrightarrow{AI}\begin{pmatrix}\frac{1}{2}\\0\\1\end{pmatrix}$, $\overrightarrow{AJ}\begin{pmatrix}1\\\frac{1}{2}\\1\end{pmatrix}$ et $\overrightarrow{IJ}\begin{pmatrix}\frac{1}{2}\\\frac{1}{2}\\0\end{pmatrix}$, d'où 
    $$AI=\sqrt{\frac{1}{4}+1}=\boxed{\frac{\sqrt{5}}{2}} \qquad AJ=\sqrt{1+\frac{1}{4}+1}=\sqrt{\frac{9}{4}}=\boxed{\frac{3}{2}} \qquad IJ=\sqrt{\frac{1}{2}}=\boxed{\frac{\sqrt{2}}{2}}$$

    **3.** $\overrightarrow{AI}\cdot\overrightarrow{AJ}=\dfrac{1}{2}+0+1=\boxed{\dfrac{3}{2}}$, d'où 
    $$\cos\left(\widehat{IAJ}\right)=\frac{\frac{3}{2}}{\frac{\sqrt{5}}{2}\times\frac{3}{2}} =\frac{2}{\sqrt{5}}\approx 0{,}894 \qquad\text{soit}\qquad \boxed{\widehat{IAJ}\approx 27^{\circ}}$$

    **Partie B**

    **4.** $\overrightarrow{AI}$ et $\overrightarrow{AJ}$ ne sont pas colinéaires : la deuxième coordonnée est nulle pour l'un et pas pour l'autre. Les trois points ne sont donc pas alignés et définissent un plan.

    **5.** $\vec{n}\cdot\overrightarrow{AI}=2\times\dfrac{1}{2}-2\times 0-1\times 1=0$ et $\vec{n}\cdot\overrightarrow{AJ}=2-2\times\dfrac{1}{2}-1=0$.

    Le vecteur $\vec{n}$ est orthogonal à deux vecteurs non colinéaires du plan, donc à tout vecteur du plan : 
    $$\boxed{\vec{n}\begin{pmatrix}2\\-2\\-1\end{pmatrix} \text{ est un vecteur normal au plan } (AIJ).}$$

    **6.** L'équation est de la forme $2x-2y-z+d=0$, et le plan passe par $A(0\,;0\,;0)$, donc $d=0$ : 
    $$\boxed{(AIJ) : 2x-2y-z=0}$$
     *Vérifications :* $I$ donne $1-0-1=0$ et $J$ donne $2-1-1=0$.

    **Partie C**

    **7.** $d\big(G,(AIJ)\big)=\dfrac{|2-2-1|}{\sqrt{4+4+1}}=\dfrac{1}{3}=\boxed{\dfrac{1}{3}}$

    **8.** La droite passant par $G(1\,;1\,;1)$ et dirigée par $\vec{n}$ est $(1+2t\,;1-2t\,;1-t)$. En reportant : 
    $$2(1+2t)-2(1-2t)-(1-t)=9t-1=0 \iff t=\frac{1}{9}$$

    $$\boxed{H\left(\frac{11}{9}\,;\frac{7}{9}\,;\frac{8}{9}\right)}$$
     *Vérification :* $GH=|t|\times\|\vec{n}\|=\frac{1}{9}\times 3=\frac{1}{3}$, ce qui confirme la question 7.

    **9.** $\overrightarrow{DG}\begin{pmatrix}1\\0\\1\end{pmatrix}$ et $\vec{n}\cdot\overrightarrow{DG}=2-0-1=1\neq 0$ : la droite et le plan sont sécants. La droite $(DG)$ a pour représentation paramétrique $(t\,;1\,;t)$, et en reportant : 
    $$2t-2-t=0 \iff t=2$$

    $$\boxed{(DG) \text{ perce le plan } (AIJ) \text{ au point } (2\,;1\,;2).}$$
     *On remarque que* ce point est situé *à l'extérieur* du cube : c'est la droite $(DG)$ tout entière, et non le segment $[DG]$, qui rencontre le plan.
- id: "t-04-27"
  feuille: "f-t-04"
  numero: 27
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [repère, coordonnées, produit scalaire, orthogonalité, équation cartésienne de plan, représentation paramétrique, positions relatives, intersection]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 9
  page_corrige: 20
  enonce: |
    L'espace est muni d'un repère orthonormé. On considère les points 
    $$A(1\,;0\,;2) \qquad B(0\,;1\,;4) \qquad C(2\,;1\,;2)$$
     et le plan $\mathcal{P}$ d'équation cartésienne $\;2x+y-z+3=0$.

    **1.** Vérifier que $B$ appartient à $\mathcal{P}$, et que $A$ et $C$ ne lui appartiennent pas.

    **2.** Calculer la distance du point $A$ à $\mathcal{P}$, puis celle du point $C$.

    **3.** Les points $A$ et $C$ sont-ils situés d'un même côté du plan $\mathcal{P}$ ? Justifier à l'aide du signe de $2x+y-z+3$.

    **4.** Déterminer les coordonnées du projeté orthogonal $H$ de $A$ sur $\mathcal{P}$, puis vérifier la distance obtenue à la question 2.

    **5.** Calculer $\overrightarrow{AB}\cdot\overrightarrow{AC}$. En déduire la nature du triangle $ABC$, puis son aire.

    **6.** Déterminer une représentation paramétrique de la droite $(AC)$, puis étudier sa position relative avec $\mathcal{P}$. Déterminer le cas échéant leur point d'intersection.
  corrige: |
    **1.** $B(0\,;1\,;4)$ : $0+1-4+3=0$, donc $\boxed{B\in\mathcal{P}}$.

    $A(1\,;0\,;2)$ : $2+0-2+3=3\neq 0$ et $C(2\,;1\,;2)$ : $4+1-2+3=6\neq 0$.

    **2.** $\|\vec{n}\|=\sqrt{4+1+1}=\sqrt{6}$, donc 
    $$d(A,\mathcal{P})=\frac{3}{\sqrt{6}}=\boxed{\frac{\sqrt{6}}{2}} \qquad\text{et}\qquad d(C,\mathcal{P})=\frac{6}{\sqrt{6}}=\boxed{\sqrt{6}}$$

    **3.** Les deux quantités $2x+y-z+3$ valent respectivement $3$ et $6$ : elles sont de **même signe**. 
    $$\boxed{A \text{ et } C \text{ sont situés du même côté du plan.}}$$

    **4.** La droite passant par $A$ et dirigée par $\vec{n}$ est $(1+2t\,;t\,;2-t)$. En reportant : 
    $$2(1+2t)+t-(2-t)+3=6t+3=0 \iff t=-\frac{1}{2}$$

    $$\boxed{H\left(0\,;-\frac{1}{2}\,;\frac{5}{2}\right)}$$
     *Vérification :* $AH=|t|\times\|\vec{n}\|=\frac{1}{2}\sqrt{6}$, conforme à la question 2.

    **5.** $\overrightarrow{AB}\begin{pmatrix}-1\\1\\2\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}1\\1\\0\end{pmatrix}$, donc 
    $$\overrightarrow{AB}\cdot\overrightarrow{AC}=-1+1+0=\boxed{0}$$

    $$\boxed{ABC \text{ est un triangle rectangle en } A.}$$
     Son aire vaut alors $\dfrac{AB\times AC}{2}=\dfrac{\sqrt{6}\times\sqrt{2}}{2} =\dfrac{\sqrt{12}}{2}=\boxed{\sqrt{3}}$.

    **6.** $(AC) : (1+t\,;t\,;2)$. Comme $\vec{n}\cdot\overrightarrow{AC}=2+1-0=3\neq 0$, la droite et le plan sont sécants : 
    $$2(1+t)+t-2+3=3t+3=0 \iff t=-1$$

    $$\boxed{(AC) \text{ coupe } \mathcal{P} \text{ au point } (0\,;-1\,;2).}$$
- id: "t-04-28"
  feuille: "f-t-04"
  numero: 28
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Calcul]
  mots_cles: [repère, base, coordonnées, colinéarité, produit scalaire, orthogonalité, norme et distance, équation cartésienne de plan]
  noeuds: [v-libre, f-hilbert]
  notions: [base-vectorielle, famille-libre, norme]
  page_enonce: 10
  page_corrige: 21
  enonce: |
    L'espace est muni d'un repère orthonormé. On considère les points 
    $$A(1\,;1\,;0) \qquad B(3\,;0\,;0) \qquad C(2\,;3\,;5) \qquad D(2\,;1\,;-1)$$
     ainsi que le plan $\mathcal{P}$ d'équation cartésienne $\;x+2y-z-3=0$.

    **Partie A : le plan $(ABC)$**

    **1.** Vérifier que les points $A$, $B$ et $C$ appartiennent à $\mathcal{P}$.

    **2.** Déterminer les coordonnées de $\overrightarrow{AB}$ et $\overrightarrow{AC}$, et justifier que $A$, $B$ et $C$ ne sont pas alignés.

    **3.** En déduire que $\mathcal{P}$ est le plan $(ABC)$.

    **4.** Démontrer, par le calcul, que $\vec{n}\begin{pmatrix}1\\2\\-1\end{pmatrix}$ est bien un vecteur normal au plan $(ABC)$.

    **Partie B : le triangle $ABC$**

    **5.** Calculer $\overrightarrow{AB}\cdot\overrightarrow{AC}$. Que peut-on en déduire pour le triangle $ABC$ ?

    **6.** Calculer les longueurs $AB$, $AC$ et $BC$, et vérifier le résultat précédent à l'aide de la réciproque du théorème de Pythagore.

    **7.** En déduire l'aire du triangle $ABC$.

    **Partie C : le tétraèdre $ABCD$**

    **8.** Vérifier que le point $D$ n'appartient pas au plan $(ABC)$, puis calculer la distance de $D$ à ce plan.

    **9.** Déterminer les coordonnées du projeté orthogonal $H$ de $D$ sur le plan $(ABC)$, et retrouver la distance de la question précédente.

    **10.** En déduire le volume du tétraèdre $ABCD$.

    *On rappelle que le volume d'une pyramide vaut $\dfrac{1}{3}\times\mathcal{B}\times h$, où $\mathcal{B}$ désigne l'aire de la base et $h$ la hauteur correspondante.*
  corrige: |
    **Partie A**

    **1.** $A(1\,;1\,;0)$ : $1+2-0-3=0$ ; $B(3\,;0\,;0)$ : $3+0-0-3=0$ ; $C(2\,;3\,;5)$ : $2+6-5-3=0$. 
    $$\boxed{\text{Les trois points appartiennent à } \mathcal{P}.}$$

    **2.** $\overrightarrow{AB}\begin{pmatrix}2\\-1\\0\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}1\\2\\5\end{pmatrix}$. Ces vecteurs ne sont pas colinéaires (la troisième coordonnée est nulle pour l'un et pas pour l'autre) : 
    $$\boxed{A,\ B \text{ et } C \text{ ne sont pas alignés.}}$$

    **3.** Trois points non alignés définissent un unique plan. Ces trois points appartenant à $\mathcal{P}$ : 
    $$\boxed{\mathcal{P} \text{ est le plan } (ABC).}$$

    **4.** $\vec{n}\cdot\overrightarrow{AB}=2-2+0=0$ et $\vec{n}\cdot\overrightarrow{AC}=1+4-5=0$.

    $\vec{n}$ est orthogonal à deux vecteurs non colinéaires du plan, donc à tout vecteur de ce plan : 
    $$\boxed{\vec{n} \text{ est un vecteur normal au plan } (ABC).}$$

    **Partie B**

    **5.** $\overrightarrow{AB}\cdot\overrightarrow{AC}=2-2+0=\boxed{0}$, donc $\boxed{ABC \text{ est rectangle en } A.}$

    **6.** $AB=\sqrt{4+1}=\sqrt{5}$, $AC=\sqrt{1+4+25}=\sqrt{30}$, $BC=\left\|\begin{pmatrix}-1\\3\\5\end{pmatrix}\right\|=\sqrt{35}$.

    Or $AB^{2}+AC^{2}=5+30=35=BC^{2}$ : la réciproque du théorème de Pythagore confirme que le triangle est rectangle en $A$.

    **7.** $\text{Aire}=\dfrac{AB\times AC}{2}=\dfrac{\sqrt{5}\times\sqrt{30}}{2} =\dfrac{\sqrt{150}}{2}=\boxed{\dfrac{5\sqrt{6}}{2}}$

    **Partie C**

    **8.** $D(2\,;1\,;-1)$ : $2+2+1-3=2\neq 0$, donc $D\notin(ABC)$. De plus 
    $$d\big(D,(ABC)\big)=\frac{|2|}{\sqrt{1+4+1}}=\frac{2}{\sqrt{6}}=\boxed{\frac{\sqrt{6}}{3}}$$

    **9.** La droite passant par $D$ et dirigée par $\vec{n}$ est $(2+t\,;1+2t\,;-1-t)$. En reportant : 
    $$(2+t)+2(1+2t)-(-1-t)-3=6t+2=0 \iff t=-\frac{1}{3}$$

    $$\boxed{H\left(\frac{5}{3}\,;\frac{1}{3}\,;-\frac{2}{3}\right)}$$
     *Vérification :* $DH=\frac{1}{3}\times\sqrt{6}=\frac{\sqrt{6}}{3}$.

    **10.** En prenant $ABC$ pour base et $DH$ pour hauteur : 
    $$V=\frac{1}{3}\times\frac{5\sqrt{6}}{2}\times\frac{\sqrt{6}}{3} =\frac{1}{3}\times\frac{5\times 6}{6}=\boxed{\frac{5}{3}}$$
- id: "t-04-29"
  feuille: "f-t-04"
  numero: 29
  titre: "Type Bac"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Type Bac, Démonstration, Calcul]
  mots_cles: [repère, coordonnées, orthogonalité, équation cartésienne de plan, représentation paramétrique, positions relatives, projeté orthogonal, distance à un plan]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 10
  page_corrige: 22
  enonce: |
    L'espace est muni d'un repère orthonormé. On considère les droites $\mathcal{D}$ et $\mathcal{D}'$ de représentations paramétriques respectives : 
    $$\mathcal{D} : \begin{cases} x=2+t \\ y=1-t \\ z=3+2t \end{cases} \quad t\in\mathbb{R} \qquad\qquad \mathcal{D}' : \begin{cases} x=1+2s \\ y=-s \\ z=s \end{cases} \quad s\in\mathbb{R}$$

    **Partie A : position relative des deux droites**

    **1.** Donner un point et un vecteur directeur de chacune de ces deux droites.

    **2.** Démontrer que $\mathcal{D}$ et $\mathcal{D}'$ ne sont pas parallèles.

    **3.** Démontrer que $\mathcal{D}$ et $\mathcal{D}'$ ne sont pas sécantes.

    **4.** Conclure quant à leur position relative.

    **Partie B : un plan contenant $\mathcal{D}$**

    **5.** Déterminer un vecteur $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ non nul, orthogonal à la fois aux deux vecteurs directeurs trouvés à la question 1.

    **6.** Soit $\mathcal{Q}$ le plan passant par le point $A(2\,;1\,;3)$ et de vecteur normal $\vec{n}$. Déterminer une équation cartésienne de $\mathcal{Q}$.

    **7.** Démontrer que la droite $\mathcal{D}$ est entièrement contenue dans $\mathcal{Q}$.

    **8.** Démontrer que la droite $\mathcal{D}'$ est strictement parallèle à $\mathcal{Q}$.

    **Partie C : une distance**

    **9.** Calculer la distance du point $B(1\,;0\,;0)$ au plan $\mathcal{Q}$.

    **10.** Déterminer les coordonnées du projeté orthogonal de $B$ sur $\mathcal{Q}$, et retrouver la distance précédente.

    **11.** Expliquer pourquoi cette distance est la même pour *tout* point de la droite $\mathcal{D}'$.
  corrige: |
    **Partie A**

    **1.** $\mathcal{D}$ passe par $A(2\,;1\,;3)$ et est dirigée par $\vec{u}\begin{pmatrix}1\\-1\\2\end{pmatrix}$ ; $\mathcal{D}'$ passe par $B(1\,;0\,;0)$ et est dirigée par $\vec{v}\begin{pmatrix}2\\-1\\1\end{pmatrix}$.

    **2.** Le coefficient de proportionnalité serait $2$ d'après les premières coordonnées, mais $2\times(-1)=-2\neq -1$ : 
    $$\boxed{\vec{u} \text{ et } \vec{v} \text{ ne sont pas colinéaires : les droites ne sont pas parallèles.}}$$

    **3.** Cherchons un point commun : 
    $$\begin{cases} 2+t=1+2s \\ 1-t=-s \\ 3+2t=s \end{cases}$$
     La deuxième donne $t=1+s$. En reportant dans la première : $3+s=1+2s$, soit $s=2$ et $t=3$. On teste dans la troisième : $3+6=9$, alors qu'il faudrait obtenir $s=2$. 
    $$\boxed{\text{Le système n'a pas de solution : les droites ne sont pas sécantes.}}$$

    **4.** Elles ne sont ni parallèles ni sécantes : 
    $$\boxed{\mathcal{D} \text{ et } \mathcal{D}' \text{ sont non coplanaires.}}$$

    **Partie B**

    **5.** On cherche $\vec{n}\begin{pmatrix}a\\b\\c\end{pmatrix}$ tel que : 
    $$\begin{cases} a-b+2c=0 \\ 2a-b+c=0 \end{cases}$$
     En soustrayant la première de la seconde : $a-c=0$, donc $a=c$. La première donne alors $b=a+2c=3a$. En choisissant $a=1$ : 
    $$\boxed{\vec{n}\begin{pmatrix}1\\3\\1\end{pmatrix}}$$
     *Vérifications :* $1-3+2=0$ et $2-3+1=0$.

    **6.** L'équation est de la forme $x+3y+z+d=0$, et avec $A(2\,;1\,;3)$ : $2+3+3+d=0$ : 
    $$\boxed{\mathcal{Q} : x+3y+z-8=0}$$

    **7.** Un point quelconque de $\mathcal{D}$ s'écrit $(2+t\,;1-t\,;3+2t)$. En reportant : 
    $$(2+t)+3(1-t)+(3+2t)-8=2+t+3-3t+3+2t-8=0$$
     Le paramètre $t$ disparaît et l'égalité est vraie pour tout $t$ : 
    $$\boxed{\mathcal{D} \text{ est entièrement contenue dans } \mathcal{Q}.}$$

    **8.** $\vec{v}\cdot\vec{n}=2-3+1=0$, donc $\mathcal{D}'$ est parallèle à $\mathcal{Q}$ ou contenue dedans. Or $B(1\,;0\,;0)$ donne $1+0+0-8=-7\neq 0$ : 
    $$\boxed{\mathcal{D}' \text{ est strictement parallèle à } \mathcal{Q}.}$$

    **Partie C**

    **9.** $d(B,\mathcal{Q})=\dfrac{|1+0+0-8|}{\sqrt{1+9+1}}=\dfrac{7}{\sqrt{11}} =\boxed{\dfrac{7\sqrt{11}}{11}}$

    **10.** La droite passant par $B$ et dirigée par $\vec{n}$ est $(1+t\,;3t\,;t)$. En reportant : 
    $$(1+t)+9t+t-8=11t-7=0 \iff t=\frac{7}{11}$$

    $$\boxed{H\left(\frac{18}{11}\,;\frac{21}{11}\,;\frac{7}{11}\right)}$$
     *Vérification :* $BH=\frac{7}{11}\times\sqrt{11}=\frac{7\sqrt{11}}{11}$.

    **11.** La droite $\mathcal{D}'$ étant *parallèle* au plan $\mathcal{Q}$, tous ses points sont à la même distance de ce plan. En effet, si $M$ et $M'$ sont deux points de $\mathcal{D}'$, le vecteur $\overrightarrow{MM'}$ est colinéaire à $\vec{v}$, donc orthogonal à $\vec{n}$ : la quantité $x+3y+z-8$ prend la même valeur en $M$ et en $M'$. 
    $$\boxed{\text{Cette distance commune vaut } \frac{7\sqrt{11}}{11}.}$$
- id: "t-04-30"
  feuille: "f-t-04"
  numero: 30
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [QCM, Démonstration, Calcul]
  mots_cles: [colinéarité, coplanarité, produit scalaire, orthogonalité, norme et distance, équation cartésienne de plan, représentation paramétrique, positions relatives]
  noeuds: [v-libre, f-hilbert]
  notions: [famille-libre, norme]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    Pour chaque question, une seule réponse est exacte. Déterminer laquelle et justifier.

    ```tableau
     ¦ Réponse A ¦ Réponse B ¦ Réponse C
    1. Les vecteurs $\vec{u}\begin{pmatrix}1\\2\\-1\end{pmatrix}$ et $\vec{v}\begin{pmatrix}-2\\-4\\2\end{pmatrix}$ sont ¦ colinéaires ¦ orthogonaux ¦ ni l'un ni l'autre
    2. Le produit scalaire de $\vec{u}\begin{pmatrix}1\\0\\2\end{pmatrix}$ et $\vec{v}\begin{pmatrix}2\\3\\-1\end{pmatrix}$ vaut ¦ $0$ ¦ $4$ ¦ $5$
    3. La norme du vecteur $\vec{u}\begin{pmatrix}2\\-3\\6\end{pmatrix}$ vaut ¦ $7$ ¦ $11$ ¦ $\sqrt{11}$
    4. Un vecteur normal au plan d'équation $x-3y+2z-1=0$ est ¦ $\begin{pmatrix}1\\-3\\2\end{pmatrix}$ ¦ $\begin{pmatrix}-1\\3\\2\end{pmatrix}$ ¦ $\begin{pmatrix}1\\3\\2\end{pmatrix}$
    5. Le plan d'équation $2x-y+z=0$ passe par le point ¦ $(1\,;1\,;1)$ ¦ $(1\,;2\,;0)$ ¦ $(0\,;1\,;2)$
    6. La droite de représentation paramétrique $\begin{cases}x=1+2t\\y=-t\\z=3\end{cases}$ a pour vecteur directeur ¦ $\begin{pmatrix}1\\0\\3\end{pmatrix}$ ¦ $\begin{pmatrix}2\\-1\\0\end{pmatrix}$ ¦ $\begin{pmatrix}2\\-1\\3\end{pmatrix}$
    7. La distance de l'origine au plan d'équation $x+2y+2z-9=0$ vaut ¦ $3$ ¦ $9$ ¦ $1$
    8. Deux droites de l'espace qui ne sont pas parallèles sont ¦ nécessairement sécantes ¦ nécessairement non coplanaires ¦ sécantes ou non coplanaires
    ```
  corrige: |
    **1.** **Réponse A.** $\vec{v}=-2\,\vec{u}$ : les vecteurs sont colinéaires. Leur produit scalaire vaut $-2-8-2=-12\neq 0$, ils ne sont donc pas orthogonaux.

    **2.** **Réponse A.** $1\times 2+0\times 3+2\times(-1)=2-2=0$.

    **3.** **Réponse A.** $\sqrt{4+9+36}=\sqrt{49}=7$.

    **4.** **Réponse A.** Les coefficients de $x$, $y$ et $z$ dans l'équation donnent directement les coordonnées d'un vecteur normal.

    **5.** **Réponse B.** $2\times 1-2+0=0$, donc $(1\,;2\,;0)$ appartient au plan. Les deux autres points donnent respectivement $2-1+1=2$ et $0-1+2=1$, tous deux non nuls.

    **6.** **Réponse B.** On lit les coefficients du paramètre $t$ : $2$, $-1$ et $0$.

    **7.** **Réponse A.** $\dfrac{|0+0+0-9|}{\sqrt{1+4+4}}=\dfrac{9}{3}=3$.

    **8.** **Réponse C.** C'est la nouveauté de la géométrie de l'espace : deux droites non parallèles peuvent être sécantes, mais aussi non coplanaires.
- id: "t-04-31"
  feuille: "f-t-04"
  numero: 31
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Vrai ou faux]
  mots_cles: [base, colinéarité, produit scalaire, orthogonalité, norme et distance, représentation paramétrique, positions relatives]
  noeuds: [v-libre, f-hilbert]
  notions: [base-vectorielle, famille-libre, norme]
  page_enonce: 12
  page_corrige: 23
  enonce: |
    Pour chacune des affirmations suivantes, dire si elle est vraie ou fausse. Si elle est fausse, donner un contre-exemple ou l'énoncé correct.

    **1.** Trois vecteurs deux à deux non colinéaires forment toujours une base de l'espace.

    **2.** Si $\vec{u}\cdot\vec{v}=0$, alors $\vec{u}=\vec{0}$ ou $\vec{v}=\vec{0}$.

    **3.** Deux plans qui n'ont aucun point commun sont parallèles.

    **4.** Deux droites qui n'ont aucun point commun sont parallèles.

    **5.** Un plan admet une infinité de vecteurs normaux.

    **6.** Une droite admet une unique représentation paramétrique.

    **7.** Si une droite est orthogonale à deux droites sécantes d'un plan, alors elle est orthogonale à ce plan.

    **8.** Si $\|\vec{u}+\vec{v}\|=\|\vec{u}\|+\|\vec{v}\|$, alors $\vec{u}$ et $\vec{v}$ sont orthogonaux.
  corrige: |
    **1.** **Fausse**. *Contre-exemple :* $\vec{\imath}$, $\vec{\jmath}$ et $\vec{\imath}+\vec{\jmath}$ sont deux à deux non colinéaires, mais tous trois coplanaires. *Énoncé correct :* il faut que les trois vecteurs ne soient pas coplanaires.

    **2.** **Fausse**. *Contre-exemple :* $\vec{u}\begin{pmatrix}1\\0\\0\end{pmatrix}$ et $\vec{v}\begin{pmatrix}0\\1\\0\end{pmatrix}$ sont non nuls et de produit scalaire nul. Un produit scalaire nul traduit l'**orthogonalité**, pas la nullité.

    **3.** **Vraie**. Deux plans sont soit confondus, soit strictement parallèles, soit sécants selon une droite. N'ayant aucun point commun, ils ne peuvent être ni confondus ni sécants.

    **4.** **Fausse**. *Contre-exemple :* les droites $(AB)$ et $(CG)$ d'un cube n'ont aucun point commun et ne sont pas parallèles : elles sont non coplanaires.

    **5.** **Vraie**. Si $\vec{n}$ est normal à un plan, tout vecteur non nul colinéaire à $\vec{n}$ l'est aussi : il y en a une infinité.

    **6.** **Fausse**. Une droite admet une infinité de représentations paramétriques, selon le point et le vecteur directeur choisis.

    **7.** **Vraie**. Deux droites sécantes d'un plan fournissent deux vecteurs directeurs non colinéaires. Tout vecteur du plan étant combinaison linéaire de ces deux-là, une droite orthogonale aux deux est orthogonale à tous les vecteurs du plan : c'est la définition d'un vecteur normal.

    **8.** **Fausse**. En élevant au carré, la condition s'écrit $\|\vec{u}\|^{2}+2\,\vec{u}\cdot\vec{v}+\|\vec{v}\|^{2} =\|\vec{u}\|^{2}+2\|\vec{u}\|\|\vec{v}\|+\|\vec{v}\|^{2}$, soit $\vec{u}\cdot\vec{v}=\|\vec{u}\|\times\|\vec{v}\|$ : le cosinus de l'angle vaut $1$, les vecteurs sont donc **colinéaires et de même sens**, et non orthogonaux.
- id: "t-04-32"
  feuille: "f-t-04"
  numero: 32
  titre: "Les sphères"
  partie: "Exercices de synthèse"
  etoiles: 2
  types: [Calcul]
  mots_cles: [norme et distance, équation cartésienne de plan, sphère]
  noeuds: []
  notions: [norme]
  page_enonce: 13
  page_corrige: 24
  enonce: |
    *Cet exercice introduit une notion qui ne figure pas au programme, mais qui se déduit entièrement de la formule de distance entre deux points : l'équation cartésienne d'une sphère. Aucune connaissance nouvelle n'est nécessaire, seulement les outils du chapitre.*

    On rappelle que la **sphère** de centre $\Omega$ et de rayon $R>0$ est l'ensemble des points $M$ de l'espace tels que $\Omega M=R$.

    **Partie A : de la définition à l'équation**

    **1.** Soit $\mathcal{S}$ la sphère de centre $\Omega(1\,;2\,;-1)$ et de rayon $3$. Traduire la condition $\Omega M=3$ à l'aide de la formule donnant la distance entre deux points.

    **2.** Les deux membres étant positifs, on peut élever au carré. En déduire que $M(x\,;y\,;z)$ appartient à $\mathcal{S}$ si et seulement si : 
    $$(x-1)^{2}+(y-2)^{2}+(z+1)^{2}=9$$

    **3.** Développer et réduire cette égalité pour obtenir une équation de la forme $x^{2}+y^{2}+z^{2}+ax+by+cz+d=0$.

    **4.** Écrire, sans calcul supplémentaire, l'équation de la sphère de centre $\Omega(x_{0}\,; y_{0}\,;z_{0})$ et de rayon $R$ sous la forme développée.

    **Partie B : reconnaître une sphère**

    Le problème réciproque est plus délicat : toute équation de la forme $x^{2}+y^{2}+z^{2}+ax+by+cz+d=0$ n'est pas nécessairement celle d'une sphère. Pour trancher, on regroupe les termes et on utilise les identités remarquables, exactement comme pour la forme canonique d'un trinôme.

    **5.** Vérifier que $x^{2}-6x=(x-3)^{2}-9$, puis, sur le même modèle, écrire $y^{2}+4y$ et $z^{2}-2z$ sous forme canonique.

    **6.** En déduire que l'ensemble des points $M(x\,;y\,;z)$ tels que 
    $$x^{2}+y^{2}+z^{2}-6x+4y-2z+5=0$$
     est une sphère dont on précisera le centre et le rayon.

    **7.** Procéder de même avec l'équation $\;x^{2}+y^{2}+z^{2}-4x+2y-6z+14=0$. Que constate-t-on ?

    **8.** Procéder enfin de même avec $\;x^{2}+y^{2}+z^{2}-2x+4y+9=0$. Conclure.

    **9.** Résumer en une phrase les trois cas possibles pour un tel ensemble de points.
  corrige: |
    **Partie A**

    **1.** La distance entre $\Omega(1\,;2\,;-1)$ et $M(x\,;y\,;z)$ vaut $\sqrt{(x-1)^{2}+(y-2)^{2}+(z+1)^{2}}$, donc : 
    $$\boxed{M\in\mathcal{S} \iff \sqrt{(x-1)^{2}+(y-2)^{2}+(z+1)^{2}}=3}$$

    **2.** Les deux membres étant positifs, l'élévation au carré est une équivalence : 
    $$\boxed{(x-1)^{2}+(y-2)^{2}+(z+1)^{2}=9}$$

    **3.** On développe chaque carré : 
    $$x^{2}-2x+1+y^{2}-4y+4+z^{2}+2z+1=9$$

    $$\boxed{x^{2}+y^{2}+z^{2}-2x-4y+2z-3=0}$$

    **4.** Le même calcul avec un centre et un rayon quelconques donne : 
    $$(x-x_{0})^{2}+(y-y_{0})^{2}+(z-z_{0})^{2}=R^{2}$$

    $$\boxed{x^{2}+y^{2}+z^{2}-2x_{0}x-2y_{0}y-2z_{0}z+x_{0}^{2}+y_{0}^{2}+z_{0}^{2}-R^{2}=0}$$
     *On retiendra que* les coefficients de $x$, $y$ et $z$ valent $-2$ fois les coordonnées du centre.

    **Partie B**

    **5.** $(x-3)^{2}-9=x^{2}-6x+9-9=x^{2}-6x$ : l'égalité est bien vérifiée.

    De même : $\;y^{2}+4y=(y+2)^{2}-4\;$ et $\;z^{2}-2z=(z-1)^{2}-1$.

    **6.** En regroupant : 
    $$(x-3)^{2}-9+(y+2)^{2}-4+(z-1)^{2}-1+5=0 \iff (x-3)^{2}+(y+2)^{2}+(z-1)^{2}=9$$

    $$\boxed{\text{C'est la sphère de centre } (3\,;-2\,;1) \text{ et de rayon } 3.}$$

    **7.** $x^{2}-4x=(x-2)^{2}-4$, $\;y^{2}+2y=(y+1)^{2}-1$ et $\;z^{2}-6z=(z-3)^{2}-9$, d'où : 
    $$(x-2)^{2}+(y+1)^{2}+(z-3)^{2}-4-1-9+14=0 \iff (x-2)^{2}+(y+1)^{2}+(z-3)^{2}=0$$
     Une somme de trois carrés est nulle si et seulement si chacun l'est : 
    $$\boxed{\text{L'ensemble se réduit au seul point } (2\,;-1\,;3).}$$

    **8.** $x^{2}-2x=(x-1)^{2}-1$ et $y^{2}+4y=(y+2)^{2}-4$, d'où : 
    $$(x-1)^{2}+(y+2)^{2}+z^{2}-1-4+9=0 \iff (x-1)^{2}+(y+2)^{2}+z^{2}=-4$$
     Une somme de carrés ne peut être négative : 
    $$\boxed{\text{L'ensemble est vide.}}$$

    **9.** Après mise sous forme canonique, on aboutit à $(x-x_{0})^{2}+(y-y_{0})^{2}+(z-z_{0})^{2}=k$, et : 
    $$\boxed{\begin{array}{l} \text{si } k>0 : \text{ une sphère de centre } (x_{0};y_{0};z_{0}) \text{ et de rayon } \sqrt{k} ; \\[1mm] \text{si } k=0 : \text{ un unique point ;} \\[1mm] \text{si } k<0 : \text{ l'ensemble vide.} \end{array}}$$
- id: "t-04-33"
  feuille: "f-t-04"
  numero: 33
  titre: "Sphères et plans"
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Problème, Démonstration, Calcul]
  mots_cles: [repère, coordonnées, orthogonalité, positions relatives, intersection, projeté orthogonal, sphère]
  noeuds: [f-hilbert]
  notions: []
  page_enonce: 13
  page_corrige: 25
  enonce: |
    *On réutilise dans cet exercice la notion introduite à l'exercice 32.*

    L'espace est muni d'un repère orthonormé. On considère l'ensemble $\mathcal{S}$ des points $M(x\,;y\,;z)$ vérifiant : 
    $$x^{2}+y^{2}+z^{2}-2x+4y-6z+5=0$$

    **1.** Démontrer que $\mathcal{S}$ est une sphère, dont on précisera le centre $\Omega$ et le rayon $R$.

    **2.** Le point $A(1\,;1\,;3)$ appartient-il à $\mathcal{S}$ ? Et le point $B(0\,;0\,;0)$ ?

    **3.** Soit $\mathcal{P}$ le plan d'équation $\;2x-y+2z-7=0$. Calculer la distance de $\Omega$ à $\mathcal{P}$.

    **4.** En comparant cette distance au rayon, justifier que $\mathcal{P}$ coupe $\mathcal{S}$.

    *On admettra que l'intersection est alors un cercle, dont le centre est le projeté orthogonal de $\Omega$ sur $\mathcal{P}$.*

    **5.** Déterminer les coordonnées du centre $\omega$ de ce cercle.

    **6.** Soit $M$ un point de ce cercle. Justifier que le triangle $\Omega\omega M$ est rectangle en $\omega$, puis, à l'aide du théorème de Pythagore, calculer le rayon $r$ du cercle.

    **7.** Soit $\mathcal{P}'$ le plan d'équation $\;2x-y+2z-19=0$. Calculer la distance de $\Omega$ à $\mathcal{P}'$ et en déduire la position relative de $\mathcal{P}'$ et de $\mathcal{S}$.

    **8.** Déterminer alors les coordonnées de leur unique point commun.

    **9.** Soit $\mathcal{P}''$ le plan d'équation $\;2x-y+2z-25=0$. Quelle est sa position relative avec $\mathcal{S}$ ?

    **10.** Déterminer toutes les valeurs du réel $k$ pour lesquelles le plan d'équation $2x-y+2z+k=0$ est tangent à $\mathcal{S}$.
  corrige: |
    **1.** On met sous forme canonique : 
    $$(x-1)^{2}-1+(y+2)^{2}-4+(z-3)^{2}-9+5=0 \iff (x-1)^{2}+(y+2)^{2}+(z-3)^{2}=9$$

    $$\boxed{\mathcal{S} \text{ est la sphère de centre } \Omega(1\,;-2\,;3) \text{ et de rayon } R=3.}$$

    **2.** $\overrightarrow{\Omega A}\begin{pmatrix}0\\3\\0\end{pmatrix}$ donne $\Omega A=3=R$, donc $\boxed{A\in\mathcal{S}}$.

    $\overrightarrow{\Omega B}\begin{pmatrix}-1\\2\\-3\end{pmatrix}$ donne $\Omega B=\sqrt{1+4+9}=\sqrt{14}\neq 3$, donc $\boxed{B\notin\mathcal{S}}$.

    **3.** $d(\Omega,\mathcal{P})=\dfrac{|2+2+6-7|}{\sqrt{4+1+4}}=\dfrac{3}{3}=\boxed{1}$

    **4.** Cette distance $1$ est **strictement inférieure** au rayon $3$ : le plan passe donc à l'intérieur de la sphère. 
    $$\boxed{\mathcal{P} \text{ coupe } \mathcal{S} \text{ selon un cercle.}}$$

    **5.** La droite passant par $\Omega$ et dirigée par $\vec{n}\begin{pmatrix}2\\-1\\2\end{pmatrix}$ est $(1+2t\,;-2-t\,;3+2t)$. En reportant dans l'équation de $\mathcal{P}$ : 
    $$2(1+2t)-(-2-t)+2(3+2t)-7=9t+3=0 \iff t=-\frac{1}{3}$$

    $$\boxed{\omega\left(\frac{1}{3}\,;-\frac{5}{3}\,;\frac{7}{3}\right)}$$

    **6.** Le point $\omega$ étant le projeté orthogonal de $\Omega$, le vecteur $\overrightarrow{\Omega\omega}$ est normal au plan, tandis que $\overrightarrow{\omega M}$ appartient au plan : ces deux vecteurs sont orthogonaux, donc le triangle est rectangle en $\omega$. Le théorème de Pythagore donne : 
    $$\Omega M^{2}=\Omega\omega^{2}+\omega M^{2} \iff R^{2}=d^{2}+r^{2} \iff 9=1+r^{2}$$

    $$\boxed{r=\sqrt{8}=2\sqrt{2}}$$

    **7.** $d(\Omega,\mathcal{P}')=\dfrac{|2+2+6-19|}{3}=\dfrac{9}{3}=3=R$.

    La distance est **exactement égale** au rayon : 
    $$\boxed{\mathcal{P}' \text{ est tangent à } \mathcal{S} \text{ : ils ont un unique point commun.}}$$

    **8.** Ce point est le projeté orthogonal de $\Omega$ sur $\mathcal{P}'$ : 
    $$2(1+2t)-(-2-t)+2(3+2t)-19=9t-9=0 \iff t=1$$

    $$\boxed{\text{Le point de tangence est } (3\,;-3\,;5).}$$
     *Vérification :* $\overrightarrow{\Omega M}\begin{pmatrix}2\\-1\\2\end{pmatrix}$ a bien pour norme $3=R$.

    **9.** $d(\Omega,\mathcal{P}'')=\dfrac{|2+2+6-25|}{3}=\dfrac{15}{3}=5>3=R$ : 
    $$\boxed{\mathcal{P}'' \text{ ne rencontre pas } \mathcal{S}.}$$

    **10.** Le plan est tangent si et seulement si la distance du centre vaut exactement $R$ : 
    $$\frac{|2\times 1-(-2)+2\times 3+k|}{3}=3 \iff |10+k|=9 \iff 10+k=9 \text{ ou } 10+k=-9$$

    $$\boxed{k=-1 \quad\text{ou}\quad k=-19}$$
     *Interprétation :* ces deux plans sont parallèles et situés de part et d'autre de la sphère, qu'ils touchent chacun en un point ; ils sont distants de $2R=6$.
- id: "t-04-34"
  feuille: "f-t-04"
  numero: 34
  partie: "Exercices de synthèse"
  etoiles: 3
  types: [Démonstration, Calcul]
  mots_cles: [repère, base, coordonnées, coplanarité, orthogonalité, angle, équation cartésienne de plan, projeté orthogonal]
  noeuds: [v-libre, f-hilbert]
  notions: [base-vectorielle, famille-libre]
  page_enonce: 14
  page_corrige: 26
  enonce: |
    L'espace est muni d'un repère orthonormé $\left(O\,;\vec{\imath},\vec{\jmath},\vec{k}\right)$. On considère les points 
    $$A(1\,;0\,;0) \qquad B(0\,;2\,;0) \qquad C(0\,;0\,;3)$$

    **1.** Justifier que $O$, $A$, $B$ et $C$ ne sont pas coplanaires : ils forment donc un tétraèdre.

    **2.** Démontrer que le vecteur $\vec{n}\begin{pmatrix}6\\3\\2\end{pmatrix}$ est normal au plan $(ABC)$, puis déterminer une équation cartésienne de ce plan.

    **3.** Calculer la distance du point $O$ au plan $(ABC)$.

    **4.** Déterminer les coordonnées du projeté orthogonal $H$ de $O$ sur le plan $(ABC)$, et vérifier la distance obtenue à la question 3.

    **5.** Le triangle $ABC$ est-il rectangle ? Justifier.

    **6.** Calculer $\cos\left(\widehat{BAC}\right)$, puis $\sin\left(\widehat{BAC}\right)$. En déduire l'aire du triangle $ABC$.

    **7.** Calculer le volume du tétraèdre $OABC$ en prenant pour base le triangle $OAB$.

    **8.** Retrouver ce volume en prenant cette fois pour base le triangle $ABC$, et pour hauteur la distance calculée à la question 3.
  corrige: |
    **1.** $\overrightarrow{OA}\begin{pmatrix}1\\0\\0\end{pmatrix}$, $\overrightarrow{OB}\begin{pmatrix}0\\2\\0\end{pmatrix}$ et $\overrightarrow{OC}\begin{pmatrix}0\\0\\3\end{pmatrix}$ sont respectivement colinéaires à $\vec{\imath}$, $\vec{\jmath}$ et $\vec{k}$, qui forment une base de l'espace : ils ne sont donc pas coplanaires. 
    $$\boxed{O,\ A,\ B \text{ et } C \text{ forment un tétraèdre.}}$$

    **2.** $\overrightarrow{AB}\begin{pmatrix}-1\\2\\0\end{pmatrix}$ et $\overrightarrow{AC}\begin{pmatrix}-1\\0\\3\end{pmatrix}$, d'où 
    $$\vec{n}\cdot\overrightarrow{AB}=-6+6+0=0 \qquad\text{et}\qquad \vec{n}\cdot\overrightarrow{AC}=-6+0+6=0$$
     $\vec{n}$ est orthogonal à deux vecteurs non colinéaires du plan : c'est un vecteur normal. L'équation est de la forme $6x+3y+2z+d=0$, et avec $A(1\,;0\,;0)$ : $6+d=0$. 
    $$\boxed{(ABC) : 6x+3y+2z-6=0}$$

    **3.** $\|\vec{n}\|=\sqrt{36+9+4}=7$, donc $d\big(O,(ABC)\big)=\dfrac{|-6|}{7}=\boxed{\dfrac{6}{7}}$

    **4.** La droite passant par $O$ et dirigée par $\vec{n}$ est $(6t\,;3t\,;2t)$. En reportant : 
    $$36t+9t+4t-6=49t-6=0 \iff t=\frac{6}{49}$$

    $$\boxed{H\left(\frac{36}{49}\,;\frac{18}{49}\,;\frac{12}{49}\right)}$$
     *Vérification :* $OH=\frac{6}{49}\times 7=\frac{6}{7}$.

    **5.** $\overrightarrow{AB}\cdot\overrightarrow{AC}=1+0+0=1\neq 0$ ; on vérifie de même que les deux autres produits scalaires ($4$ en $B$ et $9$ en $C$) sont non nuls. 
    $$\boxed{\text{Le triangle } ABC \text{ n'est pas rectangle.}}$$

    **6.** $AB=\sqrt{1+4}=\sqrt{5}$ et $AC=\sqrt{1+9}=\sqrt{10}$, donc 
    $$\cos\left(\widehat{BAC}\right)=\frac{1}{\sqrt{5}\times\sqrt{10}}=\boxed{\frac{1}{\sqrt{50}}}$$
     Comme un angle de triangle est compris entre $0$ et $180^{\circ}$, son sinus est positif : 
    $$\sin\left(\widehat{BAC}\right)=\sqrt{1-\frac{1}{50}}=\sqrt{\frac{49}{50}} =\boxed{\frac{7}{\sqrt{50}}}$$
     L'aire du triangle vaut alors : 
    $$\text{Aire}=\frac{1}{2}\times AB\times AC\times\sin\left(\widehat{BAC}\right) =\frac{1}{2}\times\sqrt{50}\times\frac{7}{\sqrt{50}}=\boxed{\frac{7}{2}}$$

    **7.** Le triangle $OAB$ est rectangle en $O$, d'aire $\dfrac{1\times 2}{2}=1$. La hauteur correspondante est $[OC]$, de longueur $3$, car $(OC)$ est orthogonale au plan $(OAB)$ : 
    $$V=\frac{1}{3}\times 1\times 3=\boxed{1}$$

    **8.** Avec $ABC$ pour base et $OH$ pour hauteur : 
    $$V=\frac{1}{3}\times\frac{7}{2}\times\frac{6}{7}=\frac{1}{3}\times 3=\boxed{1}$$

    $$\boxed{\text{Les deux calculs concordent.}}$$
     *C'est une vérification particulièrement satisfaisante :* elle relie l'aire du triangle $ABC$, obtenue par le produit scalaire, à la distance du point $O$ au plan $(ABC)$, obtenue par la formule du cours. Deux outils très différents du chapitre y donnent le même nombre.
