  notions: [norme]
  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 92, transposé du cercle à la sphère"
  page_enonce: 15
  page_corrige: 31
  enonce: |
    *Puissance d'un point par rapport à une sphère.* Soient $\mathcal{S}$ la sphère de centre $O$ et de rayon $R$ (exercice 32), et $A$ un point de l'espace. On mène par $A$ une droite $\Delta$ coupant $\mathcal{S}$ en deux points $M_1$ et $M_2$, éventuellement confondus.

    **1.** Soit $\vec{u}$ un vecteur directeur de $\Delta$ de norme $1$. Montrer que la relation 
    $$\left\|\overrightarrow{OA}+t\vec{u}\right\|^{2}=R^{2}$$
     définit une équation du second degré en $t$, dont on déterminera les coefficients.

    **2.** En déduire que le produit scalaire $\overrightarrow{AM_1}\cdot\overrightarrow{AM_2}$ est indépendant de $\Delta$.

    **3.** Selon la position de $A$ par rapport à $\mathcal{S}$, quel est le signe de ce produit scalaire ? Que vaut-il lorsque $\Delta$ est tangente à $\mathcal{S}$ ?
  corrige: |
    **1.** Tout point $M$ de $\Delta$ s'écrit de manière unique sous la forme $\overrightarrow{AM}=t\vec{u}$ avec $t$ réel : c'est la représentation paramétrique de $\Delta$ de paramètre $t$. Par la relation de Chasles, $\overrightarrow{OM}=\overrightarrow{OA}+t\vec{u}$, et $M$ appartient à $\mathcal{S}$ si et seulement si $OM^{2}=R^{2}$, c'est-à-dire si et seulement si $\left\|\overrightarrow{OA}+t\vec{u}\right\|^{2}=R^{2}$. En développant comme à l'exercice 35, et puisque $\|\vec{u}\|=1$ : 
    $$\boxed{t^{2}+2\left(\overrightarrow{OA}\cdot\vec{u}\right)t+\left(OA^{2}-R^{2}\right)=0}$$
     C'est bien une équation du second degré en $t$, de coefficients $1$, $2\,\overrightarrow{OA}\cdot\vec{u}$ et $OA^{2}-R^{2}$. Les points $M_1$ et $M_2$ correspondent à ses deux racines $t_1$ et $t_2$, confondues lorsque $M_1=M_2$.

    **2.** On a $\overrightarrow{AM_1}=t_1\vec{u}$ et $\overrightarrow{AM_2}=t_2\vec{u}$, donc $\overrightarrow{AM_1}\cdot\overrightarrow{AM_2}=t_1t_2\|\vec{u}\|^{2}=t_1t_2$. Le produit des racines d'un trinôme $ax^{2}+bx+c$ valant $\frac{c}{a}$, y compris dans le cas d'une racine double : 
    $$\boxed{\overrightarrow{AM_1}\cdot\overrightarrow{AM_2}=OA^{2}-R^{2}}$$
     Cette quantité ne dépend que de $A$ et de la sphère, et non de la droite $\Delta$ : on l'appelle la *puissance* du point $A$ par rapport à $\mathcal{S}$.

    **3.** Le signe est celui de $OA^{2}-R^{2}$, c'est-à-dire celui de $OA-R$.

    • Si $A$ est *extérieur* à la sphère ($OA>R$), le produit scalaire est strictement positif : $t_1$ et $t_2$ sont de même signe, les points $M_1$ et $M_2$ sont du même côté de $A$ sur $\Delta$, et l'on a $AM_1\times AM_2=OA^{2}-R^{2}$.

    • Si $A$ est *intérieur* à la sphère ($OA<R$), il est strictement négatif : $A$ est situé entre $M_1$ et $M_2$, et $AM_1\times AM_2=R^{2}-OA^{2}$. Comme $t_1t_2<0$, le trinôme a toujours deux racines distinctes : toute droite passant par un point intérieur coupe la sphère en deux points.

    • Si $A$ est sur la sphère, il est nul, puisque $A$ est alors l'un des deux points.

    Lorsque $\Delta$ est tangente à $\mathcal{S}$, ce qui suppose $A$ extérieur ou sur la sphère, $M_1=M_2=T$ et la puissance vaut $AT^{2}$ : 
    $$\boxed{AT^{2}=OA^{2}-R^{2}}$$
     C'est le théorème de Pythagore dans le triangle $OTA$, rectangle en $T$ : on retrouve que la tangente est orthogonale au rayon, comme à la question 6 de l'exercice 33.

    ![Figure](documents/figures/6392503e28d4b5d4.svg)

    Cette coupe par un plan passant par $O$ et contenant les droites tracées montre deux sécantes (en violet) et la tangente (en ocre) issues du même point extérieur $A$ : les produits $AM_1\times AM_2$, $AM'_1\times AM'_2$ et $AT^{2}$ y sont égaux, ici à $5^{2}-2^{2}=21$.

    *Remarque.* La puissance se lit directement sur l'équation développée de la sphère. Pour la sphère de l'exercice 33, d'équation $x^{2}+y^{2}+z^{2}-2x+4y-6z+5=0$, le membre de gauche n'est autre que $\Omega M^{2}-R^{2}$ ; en $M=O(0\,;0\,;0)$, il vaut $5$, qui est donc la puissance de l'origine. On le vérifie avec l'axe $(Oz)$ : les points $(0\,;0\,;t)$ de la sphère vérifient $t^{2}-6t+5=0$, soit $t=1$ ou $t=5$, et l'on a bien $1\times 5=5=\Omega O^{2}-R^{2}=14-9$.
