  source: "poly « Mathématiques : du lycée aux CPGE scientifiques » (LLG / H4), n° 369, traité par le produit scalaire au lieu des nombres complexes, et prolongé à l'espace"
  page_enonce: 15
  page_corrige: 32
  enonce: |
    *Droite d'Euler d'un triangle, point de Monge d'un tétraèdre.*

    **1.** Soient $ABC$ un triangle et $O$ le centre de son cercle circonscrit. On définit le point $H$ par $\overrightarrow{OH}=\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}$. Montrer que $H$ appartient aux trois hauteurs du triangle $ABC$.

    **2.** Soit $G$ le centre de gravité de $ABC$. Montrer que $\overrightarrow{OH}=3\,\overrightarrow{OG}$. Qu'en déduit-on pour les points $O$, $G$ et $H$ ?

    **3.** Soient $ABCD$ un tétraèdre et $O$ le centre de la sphère passant par ses quatre sommets, dont on admet l'existence. On définit le point $M$ par 
    $$\overrightarrow{OM}=\frac{1}{2}\left(\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}+\overrightarrow{OD}\right)$$
     Pour chaque arête du tétraèdre, on considère le plan passant par le milieu de cette arête et orthogonal à l'arête opposée. Montrer que ces six plans passent par $M$, et situer $M$ par rapport à $O$ et au point $G$ de l'exercice 36.
  corrige: |
    Dans tout l'exercice, la clé est la même : les sommets sont à la même distance $R$ de $O$, et pour deux tels sommets $P$ et $Q$, $\left(\overrightarrow{OP}+\overrightarrow{OQ}\right)\cdot\left(\overrightarrow{OQ}-\overrightarrow{OP}\right)=OQ^{2}-OP^{2}=0$.

    **1.** Par la relation de Chasles, $\overrightarrow{AH}=\overrightarrow{OH}-\overrightarrow{OA}=\overrightarrow{OB}+\overrightarrow{OC}$ et $\overrightarrow{BC}=\overrightarrow{OC}-\overrightarrow{OB}$, donc : 
    $$\overrightarrow{AH}\cdot\overrightarrow{BC}=\left(\overrightarrow{OB}+\overrightarrow{OC}\right)\cdot\left(\overrightarrow{OC}-\overrightarrow{OB}\right) =OC^{2}-OB^{2}=R^{2}-R^{2}=0$$
     Par ailleurs, $O$ appartient au plan $(ABC)$, et $\overrightarrow{AH}=\overrightarrow{OB}+\overrightarrow{OC}$ est une combinaison de vecteurs de ce plan : $H$ appartient donc au plan $(ABC)$. Ainsi, ou bien $H=A$, ou bien $(AH)$ est la droite du plan $(ABC)$ passant par $A$ et orthogonale à $(BC)$ ; dans les deux cas, $H$ appartient à la hauteur issue de $A$. La définition de $H$ étant symétrique en $A$, $B$ et $C$, le même calcul vaut pour les deux autres hauteurs. 
    $$\boxed{H \text{ appartient aux trois hauteurs : c'est l'orthocentre du triangle } ABC.}$$
     *Remarque.* Ce calcul démontre au passage que les trois hauteurs d'un triangle sont concourantes, résultat admis au collège.

    **2.** D'après l'exercice 36, $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}=\vec{0}$. En écrivant $\overrightarrow{GA}=\overrightarrow{GO}+\overrightarrow{OA}$, et de même pour $B$ et $C$, on obtient $3\overrightarrow{GO}+\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}=\vec{0}$, c'est-à-dire $\overrightarrow{OG}=\frac{1}{3}\left(\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}\right)$. 
    $$\boxed{\overrightarrow{OH}=3\,\overrightarrow{OG}}$$
     Les vecteurs $\overrightarrow{OH}$ et $\overrightarrow{OG}$ sont colinéaires : les points $O$, $G$ et $H$ sont alignés. Lorsqu'ils sont distincts, la droite qui les porte s'appelle la *droite d'Euler* du triangle. Ils sont confondus si et seulement si $O=G$, auquel cas chaque médiane, passant par $O$ et par le milieu du côté opposé, est la médiatrice de ce côté ; le triangle est alors équilatéral.

    ![Figure](documents/figures/247c9639d5ec10cc.svg)

    On lit sur cette figure que les trois hauteurs (en ocre) concourent en $H$, et que $O$, $G$ et $H$ sont alignés sur la droite d'Euler (en violet), avec $OH=3\,OG$.

    **3.** Soit $I$ le milieu de l'arête $[AB]$, dont l'arête opposée est $[CD]$. Le plan passant par $I$ et orthogonal à $(CD)$ est le plan de vecteur normal $\overrightarrow{CD}$ passant par $I$ : un point $P$ lui appartient si et seulement si $\overrightarrow{IP}\cdot\overrightarrow{CD}=0$. Or $\overrightarrow{OI}=\frac{1}{2}\left(\overrightarrow{OA}+\overrightarrow{OB}\right)$, donc $\overrightarrow{IM}=\overrightarrow{OM}-\overrightarrow{OI}=\frac{1}{2}\left(\overrightarrow{OC}+\overrightarrow{OD}\right)$, et 
    $$\overrightarrow{IM}\cdot\overrightarrow{CD}=\frac{1}{2}\left(\overrightarrow{OC}+\overrightarrow{OD}\right)\cdot \left(\overrightarrow{OD}-\overrightarrow{OC}\right)=\frac{1}{2}\left(OD^{2}-OC^{2}\right)=0$$
     puisque $C$ et $D$ sont sur la sphère de centre $O$. Le point $M$ appartient donc à ce plan, et, la définition de $M$ étant symétrique en $A$, $B$, $C$ et $D$, le même calcul vaut pour les six arêtes. 
    $$\boxed{\text{Les six plans passent par } M.}$$
     Enfin, comme à la question 2, la relation $\overrightarrow{GA}+\overrightarrow{GB}+\overrightarrow{GC}+\overrightarrow{GD}=\vec{0}$ de l'exercice 36 donne $\overrightarrow{OG}=\frac{1}{4}\left(\overrightarrow{OA}+\overrightarrow{OB}+\overrightarrow{OC}+\overrightarrow{OD}\right)$, d'où : 
    $$\boxed{\overrightarrow{OM}=2\,\overrightarrow{OG} \text{ : } G \text{ est le milieu de } [OM].}$$
     Le point $M$ s'appelle le *point de Monge* du tétraèdre, et la droite qui porte $O$, $G$ et $M$ joue le rôle de la droite d'Euler.

    *Remarque.* Le piège serait de chercher un « orthocentre » du tétraèdre : contrairement à celles d'un triangle, les quatre hauteurs d'un tétraèdre ne sont en général pas concourantes. Ce sont les six plans de l'énoncé, et non les hauteurs, qui fournissent un point de concours dans l'espace ; c'est pourquoi la relation $\overrightarrow{OM}=2\,\overrightarrow{OG}$ n'est pas l'exact analogue de la relation d'Euler $\overrightarrow{OH}=3\,\overrightarrow{OG}$.

